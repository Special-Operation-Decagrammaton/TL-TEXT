[translation]
212210-1 = "Эпизод 21;Неугасимое"
212210-5 = "[ns] «Хина, ты здесь?»"
212210-9 = ""
212210-10 = "А... Сенсей."
212210-11 = "[s] «Ты в порядке? Ты ведь совсем не отдыхаешь?»"
212210-12 = "Сейчас слишком много работы."
212210-13 = "[s1] «Я тут понял, что сам, похоже, попал в серьёзные неприятности».\n[s2] «Я уже довольно давно нахожусь в Геенне...»"
212210-16 = "Ах..."
212210-17 = ""
212210-19 = ""
212210-20 = "[ns] «Я-я не хотел заставлять тебя чувствовать себя виноватой! Прости!»"
212210-21 = ""
212210-22 = ""
212210-23 = "Ха-ха. Вы совсем не меняетесь, да?"
212210-24 = "..."
212210-25 = "Сенсей..."
212210-26 = "Я снова всё испортила."
212210-27 = "Я, наверное, самая большая дура на свете."
212210-28 = "Я так долго бежала от прошлого. Пыталась вырваться из мрака той ненависти."
212210-29 = "Я до сих пор ощущаю кипевшую во мне злобу."
212210-30 = ""
212210-32 = ""
212210-33 = "Но знаете, что беспокоит меня сильнее всего, Сенсей?"
212210-34 = "Когда всё это происходило, на самом деле..."
212210-35 = "Я... чувствовала себя лучше, чем могла предположить."
212210-37 = "Когда обрушивала на других всю свою мощь..."
212210-38 = "Когда оправдывала насилие нелепыми доводами..."
212210-39 = "Мне всё это нравилось."
212210-41 = "..."
212210-42 = "Мне противно от самой себя. Страшно узнать, что, возможно, я и есть такая на самом деле."
212210-43 = "...Я? Защитник наших ценностей?"
212210-44 = "Какая насмешка."
212210-45 = "Я наслаждалась этим. Мне не хотелось останавливаться."
212210-46 = "А если остальные узнают, какая я на самом деле? Их глава Префектуры, которая должна держать оборону...?"
212210-47 = "Это должно быть какой-то дурной шуткой."
212210-48 = "Мне нет прощения."
212210-49 = "Я слаба, порочна и безнадёжно глупа."
212210-50 = "[s] «И всё же что ты решила сделать, Хина?»"
212210-51 = ""
212210-53 = ""
212210-54 = "[ns] «Ты не отступила. Ради Геенны. И я могу тебе это доказать»."
212210-55 = "Сенсей..."
212210-56 = ""
212210-59 = "[ns3] «И я ничем от тебя не отличаюсь. Иногда я тоже так себя чувствую».\n[ns4] «У меня тоже есть отвратительные слабости, которые приходится преодолевать»."
212210-62 = ""
212210-63 = "Вы, Сенсей...?"
212210-64 = "[s5] «Я смотрю им в лицо, но не позволяю им определять, кто я».\n[s6] «Чтобы стать тем, кем хочу быть».\n[s7] «Поэтому я так стараюсь стать лучше»."
212210-68 = "Вы... тоже переживаете из-за такого, Сенсей?"
212210-69 = "...Да? Такие мысли совершенно естественны?"
212210-70 = "...Вы больше уважаете тех, кто старается преодолеть свои слабости, чем тех, у кого их просто нет?"
212210-71 = "[s] «А узнав тебя с этой стороны, я стал ценить тебя ещё больше»."
212210-72 = "...?!"
212210-73 = "Ч-что вы такое говорите, Сенсей...?!"
212210-74 = ""
212210-76 = ""
212210-77 = "...Вы восхищаетесь мной за то, что я признаю свои слабости, поднимаюсь после падений и продолжаю идти вперёд?"
212210-78 = "..."
212210-79 = ""
212210-81 = ""
212210-82 = "...Ты права."
212210-83 = "Мне столького не хватает. Я жалка."
212210-84 = "Но..."
212210-85 = "Я просто продолжу идти."
212210-86 = "Я не уступлю никому и ничему: ни прошлому, ни самой себе, ни своим слабостям. Буду двигаться только вперёд."
212210-87 = ""
212210-89 = ""
212210-90 = "Ну..."
212210-91 = ""
212210-93 = ""
212210-94 = ""
212210-95 = "Вы всегда будете рядом со мной, Сенсей?"
212210-96 = "[s] «Разумеется»."
212210-97 = "...Ага."
212210-98 = "Тогда я больше никогда не проиграю."
212210-100 = "Жизнь в Геенне более или менее вернулась в привычное русло."
212210-101 = "Но не для всех..."
212210-104 = "..."
212210-105 = "[ns] «Шоуко»."
212210-106 = ""
212210-107 = "А. Сенсей. Теперь мы поменялись местами."
212210-108 = "Довольно необычное ощущение. Вы проделали весь этот путь сюда, чтобы позлорадствовать?"
212210-109 = "Поздравляю, Сенсей. Вы победили."
212210-110 = "[s] «Я пришёл не для того, чтобы сводить счёты, Шоуко»."
212210-111 = ""
212210-113 = ""
212210-114 = "Конечно, нет. Это не в вашем характере. Но всё же я должна спросить."
212210-115 = "Вы правда верите, что это правильный исход? Просто вернуть Геенну к тому, что было прежде?"
212210-116 = "Вы считаете, что нынешний хаос Геенны, академии, где правят шум и взрывы, — правильный путь для этой школы?"
212210-117 = "[s8] «Есть те, кто пытается удержать порядок».\n[s9] «А я наблюдаю за происходящим со стороны»."
212210-120 = "...Никогда мне вас не понять."
212210-121 = "Если вы пришли в надежде заставить меня раскаяться и униженно склонить голову, боюсь, уйдёте разочарованным."
212210-122 = "Пусть мои планы провалились, я отказываюсь считать свои убеждения ошибочными."
212210-123 = ""
212210-127 = "[ns] «Просто вспомнил о них и решил принести»."
212210-128 = ""
212210-129 = "...Это ведь... те самые закуски, о которых я вам говорила...?"
212210-130 = ""
212210-132 = ""
212210-133 = "Вы сейчас пытаетесь надо мной насмехаться?"
212210-134 = "[s] «Нет. Я вовсе не это хотел сказать, Шоуко»."
212210-135 = "Тогда что всё это значит? Я преступница и неудачница, пытавшаяся свергнуть власть в Геенне."
212210-136 = "Так почему... Почему вы принесли мне такое?"
212210-137 = "[s10] «Потому что обязанность учителя...»\n[s11] «...следить, чтобы его студенты хорошо питались»."
212210-140 = "Вы снова так на меня смотрите..."
212210-141 = ""
212210-143 = ""
212210-144 = "Если это не жалость... Тогда что же...?"
212210-145 = "Скажите, Сенсей."
212210-146 = "[s] «Это называется терпением»."
212210-147 = "«Терпением»? Ради чего?"
212210-148 = "Чтобы дождаться, пока я сгнию здесь?"
212210-149 = "[s12] «Пока ты не освободишься от оков, которыми сама себя сковала».\n[s13] «Пока не наберёшься смелости жить жизнью, которой заслуживаешь, Шоуко»."
212210-152 = ""
212210-154 = ""
212210-155 = "Жить... жизнью, которой заслуживаю...?"
212210-156 = "Я проиграла. Для меня всё кончено."
212210-157 = "Не говорите мне о такой роскоши, как будущее. Я заслужила гнить здесь до конца своих дней."
212210-158 = ""
212210-160 = ""
212210-161 = "...То есть я могу искупить свои грехи не исчезнув бесследно, а начав всё заново?"
212210-162 = "[s14] «И разве плохо, если хотя бы один человек...»\n[s15] «...будет рядом с тобой на этом пути?»\n[s16] «Я буду тебя ждать»."
212210-166 = "..."
212210-167 = ""
212210-169 = ""
212210-170 = "А-а..."
212210-171 = "...«Шторм»."
212210-172 = "[s] «„Шторм“...?»"
212210-173 = "Так называется организация, которая нашла меня, обучила и поручила мне эту миссию."
212210-174 = "[s] «Что?!»"
212210-175 = "Пока это всё, что я могу сказать."
212210-176 = "...Поэтому прошу вас уйти, Сенсей."
212210-177 = "[s] «Я ещё вернусь, Шоуко»."
212210-178 = "..."
212210-181 = ""
212210-182 = "..."
212210-183 = ""
212210-185 = ""
212210-186 = ""
212210-187 = ""
212210-188 = "...Сладко."
212210-189 = ""
212210-191 = ""
212210-192 = "...Слишком сладко... Всё внутри переворачивается."
212210-193 = "*шмыг* *всхлип*"
212210-196 = "..."
212210-197 = ""
212210-200 = ""
212210-201 = "...Как и предполагалось, за всем этим действительно стояла организация «Шторм»."
212210-202 = "Те, кто стремится унаследовать идеологию Императора-тирана и возродить её наследие."
212210-203 = "Раньше они были всего лишь крысами, которые в подвалах помешались на старых чертежах Императора-тирана."
212210-204 = "Не думала, что они накопили достаточно сил и влияния для чего-то подобного."
212210-205 = "...Мы потеряли бдительность. Это не единичный случай."
212210-206 = "Они сделали это, чтобы запугать нас. И доказать, что способны причинить нам вред."
212210-207 = "Чудовище, которое мы считали усыплённым..."
212210-208 = "...похоже, пробудилось вновь, и на этот раз стало куда хитрее. Ки-хе-хе."
212210-209 = "..."
212210-210 = "По крайней мере, после этого случая в самой академии от наследия Императора-тирана ничего не осталось."
212210-211 = "Теперь, когда внутренняя угроза устранена, нужно лишь подготовиться к внешней..."
212210-212 = "...Не всё наследие Императора-тирана стёрто бесследно."
212210-213 = ""
212210-215 = ""
212210-216 = "...Ах."
212210-217 = ""
212210-219 = ""
212210-220 = "..."
212210-221 = "...В каком-то смысле у нас всё ещё осталось подлинное наследие Императора-тирана..."
212210-223 = ""
212210-224 = "У нас есть Ибуки."
212210-225 = ""
212210-227 = "Пламя и тень;Продолжение в главе 3"
