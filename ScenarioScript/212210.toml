[translation]
212210-1 = "Chapter 21;The Indelible"
212210-5 = "[ns] \"Hina, are you there?\""
212210-10 = "Sensei. You came."
212210-11 = "[s] \"Are you okay? Aren't you pushing yourself a bit too hard?\""
212210-12 = "I'm fine. #nBesides, I don't have the luxury of complaining."
212210-13 = "[s1] \"I'm not one to talk, though...\"\n[s2] \"I've been completely tied up with Gehenna...\""
212210-16 = "Ah..."
212210-20 = "[ns] \"Oh, sorry! I didn't mean it like that...\""
212210-23 = "You're the same as ever, Sensei."
212210-24 = "..."
212210-25 = "Sensei..."
212210-26 = "I made a mistake again."
212210-27 = "Honestly... I'm such a fool."
212210-28 = "It was a past I hated more than anything, one I wanted to discard."
212210-29 = "That thick, pitch-black emotion, stagnant at the bottom... it still feels so vivid."
212210-33 = "Do you know... what I hate, Sensei?"
212210-34 = "...Back then."
212210-35 = "I felt good."
212210-37 = "The fact that I clenched my fist, preparing to strike."
212210-38 = "The process of concocting a grand justification to legitimize violence."
212210-39 = "It felt... just a little bit pleasant."
212210-41 = "..."
212210-42 = "That... is what disgusts me the most. The fact that I am that kind of person."
212210-43 = "I kept talking about 'holding the line,' didn't I?"
212210-44 = "What a ridiculous thing to say. Haha."
212210-45 = "Deep down, there's a part of me that finds pleasure in such acts."
212210-46 = "And someone like that is the Prefect Prefect?"
212210-47 = "A joke that isn't even funny."
212210-48 = "I'm beyond saving."
212210-49 = "Weak, wicked, foolish... just hopeless."
212210-50 = "[s] \"Even so, Hina, you have held the line.\""
212210-54 = "[ns] \"I can vouch for that.\""
212210-55 = "Sensei..."
212210-59 = "[ns3] \"Besides, I'm the same way.\"\n[ns4] \"I feel like I'm going to lose to my own weaknesses. Sometimes, at least.\""
212210-63 = "You too, Sensei...?"
212210-64 = "[s5] \"People are creatures with many facets.\"\n[s6] \"But because there's a version of ourselves we want to be...\"\n[s7] \"We strive to become that person.\""
212210-68 = "Even you... worry about things like that...?"
212210-69 = "Is it natural for me to think these things...?"
212210-70 = "That striving to be better is more wonderful than simply not being that way at all..."
212210-71 = "[s] \"And honestly, it's precisely because you're that kind of person that I like you, Hina.\""
212210-72 = "Wh-...!?"
212210-73 = "Wh-what are you saying...!?"
212210-77 = "Because I'm someone who knows my own immaturity, yet still tries to move forward...?"
212210-78 = "............"
212210-82 = "I see."
212210-83 = "I am... very immature and pathetic."
212210-84 = "But..."
212210-85 = "Even so, I will keep moving forward."
212210-86 = "I won't lose to the past. I won't lose to myself. I will keep... moving forward."
212210-90 = "So, Sensei..."
212210-95 = "Please, stay by my side from now on."
212210-96 = "[s] \"Of course.\""
212210-97 = "...Yeah."
212210-98 = "Then I won't lose to anything."
212210-100 = "(Things have finally settled down, but...)"
212210-101 = "(There are still things left to do.)"
212210-104 = "..."
212210-105 = "[ns] \"Shouko.\""
212210-107 = "...Sensei, is it? Our positions have reversed since last time."
212210-108 = "Being on this side is quite a fresh experience."
212210-109 = "...Congratulations. #nYou've won."
212210-110 = "[s] \"That's not why I came here.\""
212210-114 = "Yes, I know. You were always like that."
212210-115 = "But... do you truly believe this is the right answer? #nReturning Gehenna to how it was in the past?"
212210-116 = "Guns firing everywhere, bombs being thrown. #nDo you really think a chaotic Gehenna where everyone does as they please is correct?"
212210-117 = "[s8] \"Even so, there are people who try to hold the line.\"\n[s9] \"And I'll be watching from the outside, too.\""
212210-120 = "...I don't understand."
212210-121 = "If you're expecting an apology or remorse, you won't get it from me."
212210-122 = "Even if it ended in failure, I don't believe my convictions were wrong."
212210-127 = "[ns] \"Actually, I brought you something.\""
212210-129 = "This is... a snack...? #nAnd it's my favorite one, too..."
212210-133 = "Are you... mocking me?"
212210-134 = "[s] \"Not at all. I have no such intention.\""
212210-135 = "Then what is your intention?"
212210-136 = "I am a loser who plotted to overthrow Gehenna and failed. #nWhy would you bring me something like this..."
212210-137 = "[s10] \"Making sure my students are eating well is--\"\n[s11] \"--just something a teacher does.\""
212210-140 = "That look again..."
212210-144 = "If that's not pity... then what is it...?"
212210-145 = "Tell me."
212210-146 = "[s] \"...I'm waiting.\""
212210-147 = "Waiting...? For what?"
212210-148 = "For me to rot away here? Or for me to self-destruct?"
212210-149 = "[s12] \"For the day you break the curse that binds you.\"\n[s13] \"And find the courage to move on to what's next.\""
212210-155 = "Next... there is no 'next' for me."
212210-156 = "I failed. It's over."
212210-157 = "I am a being meant to be forgotten within these cold walls. #nDon't use such a luxurious word as 'next'."
212210-161 = "...Excuse me? #nAtone for my sins so I can stand up again?"
212210-162 = "[s14] \"Besides, it's nice to have--\"\n[s15] \"--at least one person watching over you.\"\n[s16] \"I'll be waiting until that day.\""
212210-166 = "..."
212210-170 = "Haa..."
212210-171 = "...Storm."
212210-172 = "[s] \"Eh...?\""
212210-173 = "That is the name of the organization that found me, trained me, and gave me my missions."
212210-174 = "[s] \"That is...!!\""
212210-175 = "That is all I can say for now."
212210-176 = "...Please leave."
212210-177 = "[s] \"...I'll come again.\""
212210-178 = "............"
212210-182 = "..."
212210-188 = "...It's sweet."
212210-192 = "It's so sweet... my head feels like it's spinning..."
212210-193 = "Ugh... *hic*..."
212210-196 = "..."
212210-201 = "Just as I thought. 'Storm' was behind this."
212210-202 = "The ones trying to inherit the Thunder Emperor's ideology and restore their legacy."
212210-203 = "I thought they were just rats in the corner of the underground, licking the old blueprints of the Thunder Emperor--"
212210-204 = "To think they'd act so boldly."
212210-205 = "...I seem to have underestimated them."
212210-206 = "They had the power to threaten the academy—that was the proof of their terrorism."
212210-207 = "That monster we were supposed to have sealed away..."
212210-208 = "It seems to have awakened in a much more cunning form. Hehehe."
212210-209 = "..."
212210-210 = "The silver lining is that we were able to eliminate the Thunder Emperor's legacy left within the school."
212210-211 = "With this, the internal threat should be gone. #nSo now, we just need to prepare for external intrusions--"
212210-212 = "No. Not all of the Thunder Emperor's legacy is gone."
212210-216 = "...Ah."
212210-220 = "............"
212210-221 = "Depending on how you look at it, there is what could be called the true legacy of the Thunder Emperor--"
212210-224 = "Since Ibuki is still here."
212210-227 = "Flame and Shadow Arc;To be Continued in Chapter 3"