[translation]
212210-1 = "Episódio 21;Chamas Eternas"
212210-5 = "[ns] \"Hina, você tá aí?\""
212210-9 = ""
212210-10 = "Sensei. Que bom que veio."
212210-11 = "[s] \"Você tá bem? Não tá se cobrando demais?\""
212210-12 = "Com este ritmo de trabalho, dou conta perfeitamente.#nSem contar que não posso me dar ao luxo de choramingar agora."
212210-13 = "[s1] \"Eu também não sou o melhor exemplo de moderação......\"\n[s2] \"Passei os últimos dias enfiado em Gehenna até o pescoço......\""
212210-16 = "Ah......"
212210-17 = ""
212210-19 = ""
212210-20 = "[ns] \"Opa, perdão! Não foi essa a intenção......\""
212210-21 = ""
212210-22 = ""
212210-23 = "Você não muda nada mesmo, né, Sensei."
212210-24 = "......"
212210-25 = "Sensei......"
212210-26 = "Eu cometi um erro terrível de novo."
212210-27 = "É tão...... ridículo."
212210-28 = "Eu odiava aquele passado sombrio mais do que tudo no mundo, queria enterrá-lo para sempre."
212210-29 = "E no entanto...... aquela sensação viscosa, escura e sufocante ainda continua viva e latente dentro de mim."
212210-30 = ""
212210-32 = ""
212210-33 = "Você consegue entender...... o que eu mais odeio em mim?"
212210-34 = "......Naquele instante."
212210-35 = "Eu senti prazer."
212210-37 = "Fechar os punhos, pronta para esmagar os outros na força bruta."
212210-38 = "Inventar pretextos nobres para justificar a violência desenfreada."
212210-39 = "Por uma fração de segundo...... foi reconfortante."
212210-41 = "......"
212210-42 = "É isso...... o que me dá mais nojo: descobrir que no fundo eu era uma pessoa dessas."
212210-43 = "Eu vivia me vangloriando de 'guardar a linha ética'."
212210-44 = "Que hipocrisia patética da minha parte. Hahaha."
212210-45 = "No recôndito da minha alma, existia uma faceta minha que sentia delírio em agir daquele jeito."
212210-46 = "E uma criatura dessas tem a audácia de ser a Presidente da Disciplina......?"
212210-47 = "É uma piada de péssimo gosto."
212210-48 = "Eu não tenho salvação."
212210-49 = "Fraca, má, tola...... um desastre completo."
212210-50 = "[s] \"Mesmo assim, você foi quem mais guardou essa linha com coragem.\""
212210-51 = ""
212210-53 = ""
212210-54 = "[ns] \"Eu dou a minha palavra de honra por você.\""
212210-55 = "Sensei......"
212210-56 = ""
212210-59 = "[ns3] \"E cá entre nós: eu sou igualzinho a você.\"\n[ns4] \"Às vezes sinto que vou desmoronar diante das minhas fraquezas.\""
212210-62 = ""
212210-63 = "Você também...... sente isso?"
212210-64 = "[s5] \"O ser humano é composto de muitas faces e contradições.\"\n[s6] \"Mas porque temos um ideal de quem desejamos ser,\"\n[s7] \"lutamos e nos esforçamos todos os dias para alcançar essa versão.\""
212210-68 = "O Sensei também...... se debate com dilemas assim......?"
212210-69 = "Ter esses pensamentos escuros é algo natural......?"
212210-70 = "O valor reside no esforço incansável de buscar a virtude, não em nascer perfeito......"
212210-71 = "[s] \"E para ser sincero: é exatamente por você ser essa pessoa que eu gosto tanto de você, Hina.\""
212210-72 = "G-Gosta......?!"
212210-73 = "O-O que você tá dizendo do nada......?!"
212210-74 = ""
212210-76 = ""
212210-77 = "Porque eu reconheço a minha imaturidade, mas ainda assim tento caminhar em frente......?"
212210-78 = "............"
212210-79 = ""
212210-81 = ""
212210-82 = "Tem razão."
212210-83 = "Eu sou...... imperfeita e cheia de fraquezas."
212210-84 = "Mas......"
212210-85 = "Apesar de tudo, eu vou continuar caminhando."
212210-86 = "Não vou me deixar derrotar pelo passado e nem pelas minhas sombras. Vou continuar em frente."
212210-87 = ""
212210-89 = ""
212210-90 = "Por isso, Sensei......"
212210-91 = ""
212210-93 = ""
212210-94 = ""
212210-95 = "Continue ao meu lado daqui para a frente."
212210-96 = "[s] \"Sempre.\""
212210-97 = "......Obrigada."
212210-98 = "Com você comigo, não há nada neste mundo capaz de me derrubar."
212210-100 = "(Finalmente superamos mais uma tempestade......)"
212210-101 = "(Mas ainda resta um último assunto pendente a resolver)"
212210-104 = "......"
212210-105 = "[ns] \"Shoko.\""
212210-106 = ""
212210-107 = "......Ora, se não é o Sensei. Nossas posições se inverteram completamente, não é?"
212210-108 = "Estar deste lado das grades é uma experiência deveras interessante."
212210-109 = "......Meus parabéns.#A vitória foi sua."
212210-110 = "[s] \"Eu não vim aqui para me gabar de vitória nenhuma.\""
212210-111 = ""
212210-113 = ""
212210-114 = "Sim, eu sei muito bem. Você sempre foi previsível dessa maneira."
212210-115 = "Mas me diga com franqueza: você realmente acredita que este é o caminho correto?#Voltar àquela Gehenna caótica do passado?"
212210-116 = "Tiros zunindo em cada esquina, explosivos voando ao léu.#Acha mesmo que uma anarquia desregrada é o modelo correto para uma escola?"
212210-117 = "[s8] \"Mesmo no meio do caos, sempre haverá quem lute para guardar a linha.\"\n[s9] \"E eu continuarei aqui por perto, zelando por todas vocês.\""
212210-120 = "......Não consigo compreender a sua mente."
212210-121 = "Se veio esperando súplicas de arrependimento ou desculpas esfarrapadas, perderá o seu tempo."
212210-122 = "Ainda que tenha terminado em fracasso, não considero os meus ideais incorretos."
212210-123 = ""
212210-127 = "[ns] \"Na verdade, trouxe um agrado para você.\""
212210-128 = ""
212210-129 = "Isto são...... doces......?#E exatamente os meus favoritos......"
212210-130 = ""
212210-132 = ""
212210-133 = "Por acaso...... você está zombando da minha cara?"
212210-134 = "[s] \"De forma alguma. Jamais faria isso.\""
212210-135 = "Então qual é a sua intenção?"
212210-136 = "Eu tentei derrubar Gehenna e fracassei miseravelmente, sou uma prisioneira derrotada.#Por que me trazer um agrado destes......?"
212210-137 = "[s10] \"Preocupar-se se uma aluna está se alimentando direito――\"\n[s11] \"é o dever mais básico de qualquer professor.\""
212210-140 = "Esse olhar de novo......"
212210-141 = ""
212210-143 = ""
212210-144 = "Se não é pena ou condescendência...... o que diabos é isso afinal de contas......?"
212210-145 = "Diga-me!"
212210-146 = "[s] \"......Eu estou esperando por você.\""
212210-147 = "Esperando......? Pelo quê?"
212210-148 = "Por que eu apodreça nesta cela? Ou que enlouqueça até me autodestruir?"
212210-149 = "[s12] \"Estou esperando pelo dia em que você corte as amarras que a prendem ao passado.\"\n[s13] \"E encontre a coragem necessária para dar o próximo passo.\""
212210-152 = ""
212210-154 = ""
212210-155 = "Próximo passo......? Eu não tenho próximo passo algum."
212210-156 = "Eu falhei. Cheguei ao meu ponto final."
212210-157 = "Eu mereço ser esquecida no frio dessas paredes de concreto.#Não desperdice palavras generosas como 'próximo passo' comigo."
212210-158 = ""
212210-160 = ""
212210-161 = "......Como?#Pagar pelos erros cometidos serve justamente para podermos nos reerguer?"
212210-162 = "[s14] \"E acho que faz bem ter alguém por perto que olhe por você, não acha?\"\n[s15] \"Nem que seja uma única pessoa.\"\n[s16] \"Esperarei por esse dia pacientemente.\""
