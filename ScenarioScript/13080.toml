[translation]
13080-1 = "Episódio 8;O Conselho Estudantil de Abydos (1)"
13080-5 = "[ns1] Organizar os documentos reunidos.\n[ns2] \"...Acho que os preparativos estão prontos.\""
13080-11 = "Em modo de espera.#nSensei, precisa de alguma coisa?"
13080-12 = "[s] \"Obrigado, Plana. E a Arona?\""
13080-13 = "A Arona-senpai está dormindo. É uma dorminhoca.#nSe houver algum trabalho, por favor, dê as ordens para mim."
13080-14 = "[s3] \"Então...\"\n[s4] Pedir alguns favores para a Plana."
13080-19 = "Entendido.#nProcessarei imediatamente."
13080-20 = "Mais importante, o Sensei deveria dormir nem que seja um pouco.#nVirar a noite não faz bem para a saúde."
13080-21 = "[s] \"Mas já está quase na hora de eu partir.\""
13080-22 = "Compreendido.#nNesse caso, entrarei em contato se surgir alguma novidade."
13080-28 = "Anomalia detectada."
13080-33 = "[ns] \"Plana, o que houve?\""
13080-46 = "..."
13080-47 = "Por quê?"
13080-48 = "Será que meus cálculos estavam errados...?"
13080-51 = "[ns] \"O-O que aconteceu?!\""
13080-53 = "[ns] \"Que impacto foi esse?!\""
13080-56 = "Sensei, Sensei!"
13080-57 = "[s] \"Arona, pode me dizer qual é a situação?\""
13080-60 = "A Schale explodiu!"
13080-61 = "Mas, mais do que isso, a Plana-chan...!"
13080-67 = "A proteção do Sensei..."
13080-68 = "foi concluída a tempo..."
13080-73 = "P-Plana-chan?!"
13080-75 = "Nunca mais deixarei que o Sensei se machuque..."
13080-76 = "[s] \"Plana, você está bem?!\""
13080-77 = "Parece que ela só desmaiou!"
13080-88 = "[ns] \"...!\""
13080-96 = "[ns] (Minha consciência...)"
13080-103 = "...Entendo."
13080-104 = "Isso superou meus cálculos."
13080-105 = "Aquela Arca que opera milagres inexplicáveis,#nmesmo sendo uma arma capaz de derrubar até as muralhas de Jericó... eu a subestimei."
13080-106 = "...Mas não faz mal.#nBasta ajustar a estratégia."
13080-110 = "Estratégia número 2... \"O corpo físico tem seus limites\".#nAfinal, essa premissa não foi quebrada."
13080-111 = "A história mais importante está se desenrolando em um lugar onde o Sensei não pode interferir.#nQuando acordar, já será tarde demais."
13080-113 = "Pois bem, vamos continuar o jogo."
13080-121 = "...Não consigo contato com o Sensei."
13080-125 = "Hmm."
13080-126 = "Será que aconteceu alguma coisa?"
13080-127 = "Não está só dormindo?"
13080-129 = "Logo hoje, acho difícil que seja isso..."
13080-130 = "E a Hoshino-senpai?"
13080-134 = "Pois é, também não temos notícias dela."
13080-136 = "Francamente, o que ela está aprontando?"
13080-137 = "..."
13080-141 = "...Já amanheceu."
13080-142 = "Melhor eu voltar logo.#nO Sensei, a Shiroko-chan... todo mundo deve estar esperando."
13080-143 = "Ultimamente a Shiroko-chan anda ficando cada vez mais forte, viu.#nSerá que daqui a pouco eu já não vou mais conseguir ganhar dela?"
13080-144 = "Ah, o velhote aqui já não aguenta o peso da idade, né."
13080-149 = "Este lugar não muda nada."
13080-150 = "Bom, já é uma cidade abandonada, então faz sentido."
13080-154 = "Por favor! Assinem a petição!"
13080-168 = "Estamos coletando assinaturas para melhorar as condições de Abydos!"
13080-169 = "Precisamos da colaboração de todos vocês!"
13080-171 = "...Tsc."
13080-175 = "Fazer alguma coisa a essa altura..."
13080-179 = "C-Com licença.#nSe não se importar, poderia assinar aqui...?"
13080-180 = "Até a Nephthys está prestes a deixar o Distrito Autônomo,#nde que diabos vai adiantar uma assinatura?!"
13080-192 = "Ah! E-Espera um pouco!"
13080-198 = "Hehehe... Você é a aluna que entrou recentemente, né?#nHum, se não me engano seu nome é..."
13080-204 = "...Hoshino-chan, né!#nUé, não era?"
13080-205 = "E-Espera, Hoshino-chan!"
13080-214 = "Haaah..."
13080-219 = "Vamos realizar uma sessão informativa sobre o plano de reforço da segurança de Abydos!#nPor favor, compareçam!"
13080-220 = "Aqui está o panfleto da sessão informativa!#nNem que seja só para dar uma olhada..."
13080-227 = "...Ah, Hoshino-chan!"
13080-233 = "Espera!"
13080-237 = "...Aii?!"
13080-245 = "...Haaah."
13080-251 = "O-Obrigada."
13080-252 = "Nossa, acabei apertando a mão dela..."
13080-253 = "Como você sabe quem eu sou?"
13080-254 = "Claro que sei! Estão comentando que entrou uma caloura superforte!#n...E que também é um pouquinho mal-humorada, ou algo assim."
13080-255 = "Quer dizer, isso sou só eu falando sozinha..."
13080-256 = "Foi você quem parou a briga daquela gangue outro dia, não foi, Hoshino-chan?"
13080-257 = "Obrigada por ajudar Abydos.#nComo presidente do conselho estudantil, eu queria te agradecer."
13080-261 = "...É melhor voltar logo para casa, Presidente Kuchinashi Yume.#nQuando escurece, aqui fica perigoso."
13080-262 = "Mas eu ainda tenho coisas para fazer..."
13080-269 = "...Ué?"
13080-270 = "Eu cheguei a dizer meu nome para a Hoshino-chan...?"
13080-282 = "Já está tarde assim..."
13080-283 = "Não consegui quase nenhuma assinatura, e ainda sobrou esse monte de panfletos..."
13080-284 = "E eu precisava juntar as assinaturas até o fim desta semana."
13080-288 = "...É verdade, a Hoshino-chan me disse para ir para casa cedo."
13080-298 = "Quem é essa aí?"
13080-300 = "Hiiih!"
13080-305 = "Sessão informativa, é?#nEi, por acaso você é aluna de Abydos?"
13080-306 = "Escuta aqui, tá ligada na situação?#nPor causa de vocês que não pagam o que devem, sobrou pra gente lá de cima!"
13080-311 = "E-Eu, bem..."
13080-314 = "Como é que você pretende assumir a responsabilidade?!#nHein?!"
13080-320 = "A-As folhas de assinatura..."
13080-322 = "Que porcaria de lixo é esse atrapalhando?"
13080-326 = "P-Por favor, parem!"
13080-329 = "Tô nem aí!"
13080-330 = "Aaah, que saco, tô de mau humor.#nVem cá um instantinho."
13080-362 = "H-Hoshino-chan...?"
13080-364 = "Eu não te disse?!#nNão falei para ir embora cedo?!"
13080-365 = "Por que você não foi para casa?!#nVocê é idiota?!"
13080-370 = "D-Desculpa..."
13080-371 = "Abydos é terra sem lei agora, sabia?!"
13080-372 = "..."
13080-381 = "O-O quê, vai peitar a gente?"
13080-382 = "Guardei a sua cara, viu!"
13080-387 = "Haaah..."
13080-388 = "...Não se machucou, Presidente Kuchinashi Yume?"
13080-389 = "N-Não... obrigada, Hoshino-chan."
13080-390 = "Por que você não lutou?"
13080-391 = "Mesmo que eu resolva um problema lutando, isso só vira o estopim para o próximo conflito..."
13080-392 = "Além disso, se eu começar a resolver tudo na base da força,#nacho que um dia vou acabar perdendo quem eu sou..."
13080-393 = "...Não entendi nada do que você disse."
13080-394 = "Então como é que você pretende resolver?"
13080-395 = "..."
13080-399 = "...Vá logo para casa.#nEles podem voltar trazendo reforços."
13080-404 = "E-Espera, Hoshino-chan!"
13080-415 = "Queridos moradores,"
13080-416 = "por favor, assinem a petição!"
13080-417 = "..."
13080-421 = "P-Precisamos da ajuda de todos vocês...!"
13080-422 = "...Ué?#nHoshino-chan, o que houve hoje?"
13080-423 = "Pensei que os caras de ontem poderiam vir se vingar."
13080-424 = "Você veio para me proteger?"
13080-425 = "Não, achei que seria mais fácil derrubar todos de uma vez quando morderem a isca da presidente."
13080-426 = "Então eu sou a isca?!"
13080-427 = "...Tem muita gente de olho no Conselho Estudantil de Abydos."
13080-431 = "Entendi, entendi~"
13080-435 = "Você não sabe ser sincera mesmo, né, Hoshino-chan!#nNa verdade, estava preocupada comigo, não estava?"
13080-436 = "Q-Quem é que tá preocupada...?!"
13080-437 = "Você vive com essa cara emburrada, Hoshino-chan, mas..."
13080-441 = "Você é tão fofa, que desperdício fazer essa cara, sabia?"
13080-442 = "O-O que você está dizendo?!#nSe falar mais besteira, eu vou embora!"
13080-443 = "Hehe... Obrigada, Hoshino-chan."
13080-444 = "Ter uma caloura tão confiável me ajudando dá uma força enorme...!"
13080-445 = "Chega de conversa e se concentre."
13080-446 = "E além disso, esta é a primeira e última vez que ajudo no trabalho do conselho estudantil."
13080-447 = "Hehe, obrigada.#nMas, tipo, se você me chamasse de Yume-senpai em vez de Presidente Kuchinashi Yume,#neu ficaria muuuuito mais feliz..."
13080-451 = "...Você ouviu o que eu acabei de dizer?"
13080-455 = "Próximo;O Conselho Estudantil de Abydos (2)"
