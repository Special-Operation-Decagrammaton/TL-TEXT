[translation]
13080-1 = "Эпизод 8;Студсовет Абидоса 1"
13080-5 = "[ns1] Закончить систематизировать данные, собранные за ночь.\n[ns2] «Общий план у меня уже есть. Дальше...»"
13080-6 = ""
13080-7 = ""
13080-10 = ""
13080-11 = "Всё ещё наготове. Могу чем-нибудь помочь, Сенсей [USERNAME]?"
13080-12 = "[s] «А, спасибо, Плана. А где Арона?»"
13080-13 = "Арона спит. Её можно назвать «соней». Поэтому можете просто рассчитывать на меня, более прилежную."
13080-14 = "[s3] «Спасибо. Тогда... если не возражаешь...»\n[s4] Передать задачу Плане."
13080-15 = ""
13080-16 = ""
13080-18 = ""
13080-19 = "Принято. Задача простая. Я выполню её немедленно."
13080-20 = "Но куда важнее другое: вам нужно отдохнуть, Сенсей. Ночные бдения вредят здоровью."
13080-21 = "[s] «Знаю, но времени нет. Нужно ехать в Абидос.»"
13080-22 = "Поняла. В таком случае—"
13080-23 = ""
13080-25 = ""
13080-26 = ""
13080-27 = ""
13080-28 = "Обнаружена аномалия."
13080-29 = ""
13080-31 = ""
13080-33 = "[ns] «Плана? Что случилось?»"
13080-34 = ""
13080-46 = "..."
13080-47 = "...Ч-Что это?"
13080-48 = "Мои... Мои расчёты были неверны?! Невозможно! Как?"
13080-51 = "[ns] «Ч-Что только что произошло?!»"
13080-53 = "[ns] «Взрыв?! Но почему-то я цел?»"
13080-54 = ""
13080-56 = "Э-Это было близко, Сенсей!"
13080-57 = "[s] «Арона! Что случилось?!»"
13080-60 = "Здание Шале взорвалось!"
13080-61 = "Но сейчас... Плана!"
13080-62 = ""
13080-64 = ""
13080-66 = ""
13080-67 = "Для вашей безопасности... активировала... экстренную защиту..."
13080-68 = "Но это... предел..."
13080-69 = ""
13080-71 = ""
13080-73 = "П-Плана?!"
13080-75 = "Я больше никогда... не позволю вам пострадать... Сенсей..."
13080-76 = "[s] «Плана? Плана! Ты в порядке?!»"
13080-77 = "С ней всё будет хорошо, Сенсей! Она слишком перенапряглась и потеряла сознание... но кроме этого..."
13080-78 = ""
13080-88 = "[ns] «...!!!»"
13080-96 = "[ns] «(Моё сознание...)»"
13080-102 = ""
13080-103 = "...Любопытно."
13080-104 = "Защитная система этого ковчега сильна... значительно сильнее, чем предсказывали мои расчёты."
13080-105 = "Оружие, сокрушившее стены Иерихона, Ковчег Завета... Похоже, я его недооценил."
13080-106 = "...Хм. Неважно. Я скорректирую расчёты, стратегию... И бесполезным это не было. В конце концов..."
13080-107 = ""
13080-109 = ""
13080-110 = "Вторая стратегия: «Пределы тела невозможно преодолеть...» Эта максима остаётся верной."
13080-111 = "А далеко-далеко от вашего ограниченного тела важные разговоры проходят без вас, Сенсей. Спите дальше, просыпайтесь, делайте что хотите. Будет уже слишком поздно."
13080-113 = "Ну что же! Продолжим нашу игру?"
13080-120 = ""
13080-121 = "...Сенсей не отвечает."
13080-122 = ""
13080-124 = ""
13080-125 = "Хм..."
13080-126 = "Думаете... что-то случилось?"
13080-127 = "Может, проспал?"
13080-129 = "Хотя иногда до него не удаётся дозвониться... когда мы договаривались, он всегда приходил заранее."
13080-130 = "А Хошино?"
13080-131 = ""
13080-133 = ""
13080-134 = "Она тоже не отвечает..."
13080-136 = "Серьёзно?! Да что все вообще делают?!"
13080-137 = "..."
13080-141 = "...Солнце уже взошло."
13080-142 = "Мне пора. Широко, Сенсей... Ну, все ждут."
13080-143 = "Ха, эта Широко! Вчера она заставила меня попотеть. Реально становится сильнее... Может, скоро станет сильнее меня?"
13080-144 = "Эх, моя Широко раньше была такой милой, а теперь даже старушке с ней непросто. Время летит, да?"
13080-145 = ""
13080-148 = ""
13080-149 = "Это место совсем не изменилось..."
13080-150 = "Хотя чего ещё ждать от заброшенного города-призрака?"
13080-151 = ""
13080-153 = ""
13080-154 = "Пожалуйста! Пожалуйста, подпишите!"
13080-155 = ""
13080-157 = ""
13080-163 = ""
13080-166 = ""
13080-168 = "Это петиция жителей за улучшение экологической ситуации в Абидосе!"
13080-169 = "Нам нужно объединиться всем вместе, если хотим потребовать действий от корпораций!"
13080-171 = "Нет, простите. Неинтересно..."
13080-172 = ""
13080-174 = ""
13080-175 = "Какая бесплодная борьба..."
13080-176 = ""
13080-178 = ""
13080-179 = "Э-Эм... простите... Если не затруднит, не могли бы вы подписать мою петицию... пожалуйста...?"
13080-180 = "Бессмысленно! Нефтис всё равно уходит, зачем вообще что-то улучшать, тем более экологию?"
13080-181 = ""
13080-183 = ""
13080-184 = ""
13080-185 = ""
13080-187 = ""
13080-188 = ""
13080-189 = ""
13080-191 = ""
13080-192 = "А, эй! Вы там! Подождите! Пожалуйста, не уходите!"
13080-193 = ""
13080-196 = ""
13080-197 = ""
13080-198 = "Хи-хи... Да, вы! Я вас узнаю! Вы новенькая, верно? Если правильно помню, вас зовут Хошино."
13080-199 = ""
13080-201 = ""
13080-202 = ""
13080-203 = ""
13080-204 = "Ч-Что?! Не Хошино? Я ошиблась?"
13080-205 = "Вернись... Хошино?"
13080-213 = ""
13080-214 = "*вздыхает*"
13080-215 = ""
13080-217 = ""
13080-219 = "Мы проводим презентацию об увеличении числа патрулей ради безопасности района! Пожалуйста, приходите и поделитесь мнением!"
13080-220 = "Вот! Возьмите листовку!"
13080-221 = ""
13080-223 = ""
13080-225 = ""
13080-226 = ""
13080-227 = "А! Хошино! Привет!"
13080-228 = ""
13080-230 = ""
13080-231 = ""
13080-232 = ""
13080-233 = "Н-Не уходи! Подожди, всего секундочку! Я хотела с тобой поговорить!"
13080-234 = ""
13080-236 = ""
13080-237 = "Ч-Что...?!"
13080-238 = ""
13080-242 = ""
13080-244 = ""
13080-245 = "...Тц."
13080-246 = ""
13080-248 = ""
13080-250 = ""
13080-251 = "А! С-Спасибо!"
13080-252 = "О... Эм... Для меня честь! Я раньше никогда не пожимала руку знаменитости..."
13080-253 = "...Знаменитости? Ты меня знаешь?"
13080-254 = "Как можно не знать? Ты та самая очень сильная, но ужасно вспыльчивая новенькая, о которой все говорят!"
13080-255 = "Ну, технически это слух, который я сама и начала, но всё же...!"
13080-256 = "Ведь это ты избавилась от банды нарушителей, терроризировавшей район, верно, Хошино? И заставила те банды прекратить драться друг с другом!"
13080-257 = "Ага! Это правда очень помогло Абидосу. Поэтому как председатель студсовета я очень хотела поблагодарить тебя. Спасибо, Хошино!"
13080-258 = ""
13080-260 = ""
13080-261 = "...Вам пора домой, председатель Юмэ. С наступлением темноты вылезают мутные типы. Здесь небезопасно."
13080-262 = "П-Правда? Но у меня ещё столько дел..."
13080-263 = ""
13080-265 = ""
13080-266 = ""
13080-267 = ""
13080-268 = ""
13080-269 = "А...? А! Подожди!"
13080-270 = "...Но откуда ты знаешь моё имя?"
13080-281 = ""
13080-282 = "Ик. Уже так поздно..."
13080-283 = "Я собрала недостаточно подписей, и у меня осталось ещё столько листовок..."
13080-284 = "Ай, нужно закончить собирать подписи здесь до конца недели. Тогда на следующей неделе смогу перейти на другую улицу!"
13080-285 = ""
13080-288 = "Когда так темно, и правда немного жутко... Может, стоит послушать Хошино и пойти домой..."
13080-289 = ""
13080-294 = ""
13080-295 = ""
13080-297 = ""
13080-298 = "Что это за девчонка?"
13080-300 = "О-О...?"
13080-301 = ""
13080-304 = ""
13080-305 = "Что это? Какая-то презентация по патрулированию безопасности от студсовета Абидоса? Ты студент Абидоса? А?!"
13080-306 = "Вы наняли нас, а потом кинули с оплатой! Ты хоть понимаешь, сколько проблем нам устроили?"
13080-307 = ""
13080-310 = ""
13080-311 = "А? Н-Ну... видите ли... Эм!"
13080-313 = ""
13080-314 = "И что делать будешь, а? Теперь ещё проценты набежали, потому что вы слишком долго не платили! Проценты!"
13080-315 = ""
13080-319 = ""
13080-320 = "П-Петиция..."
13080-322 = "А это ещё что? А?"
13080-323 = ""
13080-326 = "Пожалуйста, не делайте этого! Мне нужно завтра раздать их другим людям!"
13080-328 = ""
13080-329 = "Думаешь, мне не плевать?!"
13080-330 = "Отлично. Я была в отвратительном настроении, так что вымещу его на тебе!"
13080-331 = ""
13080-333 = ""
13080-336 = ""
13080-338 = ""
13080-341 = ""
13080-343 = ""
13080-352 = ""
13080-354 = ""
13080-355 = ""
13080-360 = ""
13080-362 = "А-Ах...! Хошино...?!"
13080-364 = "Я говорила тебе или нет, что ночью опасно?"
13080-365 = "Ты тупая?! У тебя ушей нет?"
13080-366 = ""
13080-369 = ""
13080-370 = "П-Прости..."
13080-371 = "Улицы кишат отбросами! Ты вообще не понимаешь, насколько Абидос беззаконен, особенно ночью?!"
13080-372 = "..."
13080-373 = ""
13080-377 = ""
13080-378 = ""
13080-380 = ""
13080-381 = "Т-Ты... Какого...?!"
13080-382 = "Я запомню твоё лицо! Ты ещё пожалеешь!"
13080-383 = ""
13080-385 = ""
13080-387 = "*вздыхает*"
13080-388 = "...Ты в порядке, председатель Юмэ?"
13080-389 = "Д-Да... Спасибо, Хошино..."
13080-390 = "Почему ты не дала сдачи? С такими мелкими бандитами ты бы легко справилась."
13080-391 = "Н-Наверное, но... если пытаться решать проблему насилием, это ведь не настоящее решение... Так круг просто продолжится..."
13080-392 = "А если постоянно прибегать к дракам, скоро это будет единственный способ решать конфликты, который ты знаешь..."
13080-393 = "...Не понимаю."
13080-394 = "Если не драться, как тогда вообще что-то исправлять?"
13080-395 = "В-Вот в этом и вопрос, правда...?"
13080-396 = ""
13080-398 = ""
13080-399 = "Ладно, иди домой. Эти типы могут вернуться с друзьями."
13080-400 = ""
13080-402 = ""
13080-403 = ""
13080-404 = "А? Хошино?!"
13080-409 = ""
13080-410 = ""
13080-411 = ""
13080-415 = "Это петиция жителей за улучшение экологической ситуации в Абидосе!"
13080-416 = "Нам нужно объединиться всем вместе, если хотим потребовать действий от корпораций!"
13080-417 = "..."
13080-418 = ""
13080-420 = ""
13080-421 = "Эм... подписи... за улучшение экологии..."
13080-422 = "А, Хошино? Что ты здесь делаешь?"
13080-423 = "Разве не очевидно? Те бандиты со вчера могут захотеть отомстить."
13080-424 = "Т-Ты хочешь меня защитить?"
13080-425 = "Нет. Я использую приманку, чтобы их выманить."
13080-426 = "Меня?!"
13080-427 = "Да. У студсовета Абидоса куча врагов. А поскольку ты председатель, ты — приманка. Огромная приманка."
13080-428 = ""
13080-430 = ""
13080-431 = "Ха-ха-ха...! Вот как?"
13080-432 = ""
13080-434 = ""
13080-435 = "По-моему, ты врёшь, Хошино. Это написано на твоём милом лице! Где-то глубоко внутри ты за меня переживаешь!"
13080-436 = "Тогда ты неправильно читаешь! И-и кто вообще милый?!"
13080-437 = "Хи-хи. Пусть ты постоянно хмуришься и пытаешься выглядеть страшной, это ведь просто игра, правда?"
13080-438 = ""
13080-440 = ""
13080-441 = "Я вижу настоящую тебя за этой хмурой мордочкой! Она гораздо более... как сказать? Очаровательная! Милая! Славная!"
13080-442 = "Ч-Что ты вообще несёшь?! Продолжишь говорить эту чушь — оставлю тебя здесь!"
13080-443 = "Хи-хи... Спасибо, Хошино."
13080-444 = "Мне спокойнее, когда рядом такая сильная и надёжная младшая."
13080-445 = "У тебя разве нет работы, председатель?"
13080-446 = "Я помогу тебе с делами студсовета. Только один раз."
13080-447 = "Хм... «Председатель» звучит слишком официально. Может, «госпожа Юмэ»? О! А просто Юмэ сделало бы меня ещё счастливее!"
13080-448 = ""
13080-450 = ""
13080-451 = "...Ты вообще меня слушаешь?"
13080-455 = "Следующий эпизод;Студсовет Абидоса 2"
