[translation]
84301300101-5 = "...Это было совсем не хорошо."
84301300101-6 = "..."
84301300101-7 = "А-ха... Хахаха..."
84301300101-8 = "Н-Ну, крокодил был милым! Мне он даже немного понравился!"
84301300101-9 = "Ты серьёзно...?"
84301300101-10 = "Иногда доброта ранит сильнее пуль, Айри."
84301300101-11 = "Кого ранит — крокодила или меня?"
84301300101-12 = "Уже сам факт, что ты спрашиваешь..."
84301300101-14 = "...Это вам не какое-то фэнтезийное приключение."
