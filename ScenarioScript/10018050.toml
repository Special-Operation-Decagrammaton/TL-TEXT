[translation]
10018050-1 = "Эпизод 5; Счёт, пожалуйста"
10018050-2 = "Торговая улица"
10018050-3 = ""
10018050-4 = "Добро пожаловать, добро пожаловать! Попробуйте кусочек — настоящее наслаждение!"
10018050-5 = "Новое меню «Воробья»! Бесплатная дегустация!"
10018050-6 = "«Воробей»? Я думала, они закрываются..."
10018050-7 = "Э-Это был всего лишь слух!"
10018050-8 = "Наоборот, «Воробей» полностью обновляет меню."
10018050-9 = "Ну, посмотрим, каково оно на вкус..."
10018050-10 = ""
10018050-12 = ""
10018050-13 = "*жует* *жует*"
10018050-14 = ""
10018050-17 = "В-Вкусно! То есть раньше тоже было вкусно, но теперь вообще отлично!"
10018050-18 = "Мне очень нравится насыщенный вкус! И текстура стала намного лучше!"
10018050-19 = "Я-я так рада!"
10018050-20 = "Пожалуйста, поддержите новый и улучшенный «Воробей»!"
10018050-21 = ""
10018050-23 = ""
10018050-24 = "Если оно настолько вкусное холодным, представьте, каким будет свежим."
10018050-25 = ""
10018050-27 = ""
10018050-28 = "О! Еда была такой вкусной, что я чуть не забыла о деловой встрече!"
10018050-29 = "Спасибо! Но вам правда лучше идти!"
10018050-30 = ""
10018050-32 = ""
10018050-33 = ""
10018050-34 = ""
10018050-35 = "Вкусно... Очень вкусно."
10018050-36 = "Но..."
10018050-37 = "Есть проблема?"
10018050-38 = "А сколько это стоит, когда вы не раздаёте бесплатно?"
10018050-39 = "Н-Ну... Если учитывать стоимость ингредиентов, доставки и работы..."
10018050-40 = "Получится около девятисот иен."
10018050-41 = "Так дорого? Обычно я трачу на обед всего шестьсот..."
10018050-43 = "П-Правда?!"
10018050-44 = "Э-Это лишь немного дороже других ресторанов, и цены в «Воробье» всегда были примерно такими..."
10018050-45 = "Ага, и именно поэтому люди думали, что «Воробей» закрывается."
10018050-46 = "При таких ценах я не смогу приходить часто..."
10018050-47 = ""
10018050-48 = "Если уж тратиться на еду, я лучше размахнусь по полной и съем что-нибудь более роскошное."
10018050-49 = "Еда тут лучше, чем во многих местах, это правда."
10018050-50 = "Но в итоге блюда всё равно довольно простые."
10018050-51 = "Если уж платить больше самого минимума, я лучше попробую что-нибудь новое."
10018050-52 = "С теми ингредиентами, которые у нас есть, возможности «Воробья» ограничены..."
10018050-53 = "Простите, но это не проблема, которую должны решать посетители."
10018050-54 = "Это так, но..."
10018050-56 = ""
10018050-57 = "Понятно. Важен не только вкус, но и цена."
10018050-58 = "Это наша оплошность. Мы забыли о деловой стороне и слишком сосредоточились на качестве еды."
10018050-59 = ""
10018050-61 = "По-моему, нам прежде всего нужно увеличить порции. Они слишком маленькие."
10018050-62 = "Ты уверена, что это не только твоя проблема, Акари?"
10018050-63 = "Нет, я тоже считаю порции слишком маленькими."
10018050-64 = "Ну, не уверена, что это поможет. Ингредиенты с рынка «Чирп» высокого качества..."
10018050-66 = "...а значит, увеличение порций просто увеличит расходы."
10018050-67 = "А этот район благодаря Няо Фудс завален дешёвыми вариантами, поэтому на их фоне мы будем казаться дорогими."
10018050-68 = "Если хотим завоевать людей, придётся играть по их правилам."
10018050-69 = "К сожалению, их правила предполагают определённое снижение качества..."
10018050-70 = ""
10018050-72 = ""
10018050-73 = "Мне это совсем не нравится."
10018050-74 = "[s] «А почему бы не стремиться и к количеству, и к качеству?»"
10018050-75 = "А? И как это вообще возможно, Сенсей?"
10018050-76 = "Сделать два уровня меню?"
10018050-77 = "Если объединить дешёвые и средние позиции, мы сможем снизить расходы благодаря меньшему и более стандартизированному меню..."
10018050-78 = "...и одновременно предложить отдельное более специализированное меню для постоянных клиентов, чтобы выбор не был слишком однообразным."
10018050-79 = "Каждое меню станет меньше, но найдётся что-то и для тех, кому нужен быстрый перекус, и для тех, кто хочет еду повыше качеством..."
10018050-81 = "Неплохая идея. Если правильно подобрать баланс, мне нравится вариант с комплексным меню."
10018050-82 = "Вроде школьного обеда. ★"
10018050-83 = "Обеды в нашей школе ужасны! Но уверена, комплексное меню в «Воробье» будет отличным!"
10018050-84 = "[s1] «Не забудьте о нагрузке на хозяйку после нашего ухода.»\n[s2] «Есть причина, почему школьные обеды не такие уж аппетитные...»"
10018050-88 = "Мне кажется, это отличная идея. Молодец, Сенсей."
10018050-89 = "Но теперь нужно обсудить закупку более дешёвых ингредиентов для стандартного меню..."
10018050-91 = "Похоже, выбора нет — придётся искать поставщиков в этом районе..."
10018050-92 = "Харуна этому не обрадуется."
10018050-93 = "Конечно не обрадуется. Она ненавидит компромиссы."
10018050-95 = "...Это другое."
10018050-96 = "Это необходимо для выживания «Воробья», так что я сделаю исключение."
10018050-97 = ""
10018050-100 = ""
10018050-101 = "Кстати, закупку продуктов лучше поручить Джури."
10018050-103 = "Что?!"
10018050-105 = "Так удивляться немного грубо. Джури допускает... некоторые ошибки на кухне, но у неё отличный глаз на ингредиенты."
10018050-106 = "Д-Да! Немного неловко говорить о себе такое, но я очень усердно изучала выбор продуктов!"
10018050-107 = "Может, на кухне от меня не так много пользы, но я могу помочь найти хорошие ингредиенты."
10018050-109 = "Хм, раз ты так говоришь..."
10018050-111 = "Решено. Сенсей?"
10018050-112 = "[s] «Похоже, мне тоже пора начинать действовать.»"
10018050-113 = "Удачи."
10018050-114 = ""
