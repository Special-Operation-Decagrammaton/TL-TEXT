[translation]
34210-1 = "Episódio 21;Rumo ao Santo dos Santos"
34210-4 = "Arf... arf..."
34210-12 = "[ns] \"Mika! Você está bem?\""
34210-13 = "..."
34210-14 = "...Eu vou segurar aquela coisa."
34210-18 = "Saori... Eu entendo um pouquinho o motivo de você querer tanto salvar aquela garota."
34210-19 = "Porque comigo foi a mesma coisa... Por isso..."
34210-20 = "Enquanto eu estiver distraindo ela — vá salvar a Atsuko."
34210-21 = "Sensei... me desculpa.#nEu só vivo causando problemas..."
34210-22 = "E... obrigada.#nPor me dizer que eu ainda tenho uma chance..."
34210-23 = "Você..."
34210-24 = "Anda logo, Saori!#nVocês não têm tempo a perder, né?"
34210-28 = "...Certo."
34210-29 = "[s] \"Mika, tome cuidado...\""
34210-30 = "...Não se preocupe, Sensei.#nVocê já sabe, né? — Eu sou bem forte, viu?"
34210-44 = "..."
34210-45 = "...Que garota egoísta."
34210-46 = "...Vamos nos apressar."
