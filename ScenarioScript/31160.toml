[translation]
31160-1 = "Episódio 16;Uma Pequena Brecha"
31160-2 = "Ufa, que refrescante!"
31160-3 = "Já tomou banho? Que rápida, Hifumi."
31160-4 = "Ufufu, pois é. Afinal, a Hifumi-chan não conseguiu tomar banho de manhã e passou o dia inteiro com seu aroma natural—"
31160-5 = "Uauá! F-Falar desse jeito dá vergonha...! Uuh, se eu não tivesse perdido a hora..."
31160-6 = "...Mas isso foi porque você ficou preparando o simulado para nós."
31160-7 = "Desculpa, Hifumi. Se amanhã de manhã também for difícil acordar, é só me avisar. Da próxima vez, eu lavo o seu corpo."
31160-8 = "N-Não, acho que vou recusar essa oferta...!?"
31160-9 = "Ela pode muito bem se lavar sozinha! Ela não é nenhuma criança!"
31160-10 = "É uma questão de eficiência. Há muitas vantagens em nos lavarmos juntas. Além de economizar água, é claro."
31160-11 = "Como não temos um grande banho coletivo, acho meio difícil fazermos um evento de todo mundo lavando as costas umas das outras..."
31160-12 = "Ah, tive uma ótima ideia. Que tal, na próxima vez, em vez do banho, todo mundo pular pelada na piscina?"
31160-13 = "O que você está dizendo assim na maior naturalidade!? Não pode! Uma coisa absurda dessas é totalmente proibida!!"
31160-14 = "Não acho uma má ideia, mas qual é a vantagem de fazer isso na piscina?"
31160-15 = "Não acha que dá uma sensação de liberdade? Só de imaginar todas nós sob o céu azul, expondo tudo e jogando água umas nas outras... Ufufu♡"
31160-16 = "Entendo, realmente não tinha pensado por esse lado. Sensação de liberdade, é..."
31160-21 = "Idiota, idiota, idiota, idiota!! Não pode pensar, não pode imaginar, esse tipo de coisa não pode!"
31160-26 = "Não corrompa a Azusa com essas ideias estranhas! De pervertida na Trinity já basta você!!"
31160-27 = "Por falar nisso, a Koharu-chan também é do time que quer nadar completamente nua, não é?"
31160-28 = "Ignorou todo o contexto!? Você é invencível por acaso!? P-Para começo de conversa, eu nunca disse isso! Na piscina tem que usar roupa de banho normal! Essa é a justiça! Até você estava usando direitinho ontem!"
31160-29 = "Ora...?"
31160-34 = "Tente se lembrar bem, Koharu-chan. Do que eu estava vestindo ontem na piscina..."
31160-35 = "Hã? O-O que tem aquela roupa de banho...?"
31160-41 = "Você acha que aquilo era mesmo[wa:1500] roupa[wa:1000] de banho[wa:1000] ...?"
31160-42 = "!?!!?"
31160-43 = "S-Se não era roupa de banho, o que era então...!?"
31160-45 = "As roupas íntimas de hoje em dia têm designs bem elaborados, então não acha difícil julgar à primeira vista se é roupa de banho ou não? Além disso, também existe a possibilidade de ser pintura corporal...♡"
31160-46 = "...!?!?"
31160-47 = "Quê, mentira!? Q-Quer dizer então que...!?"
31160-48 = "Ora, o que houve?"
31160-49 = "Mesmo que aquilo não fosse uma roupa de banho, será que mudaria alguma coisa? Hein, Koharu-chan?"
31160-50 = "Hã, m-mas é que..."
31160-51 = "Por exemplo, a diferença entre roupa de banho e lingerie... qual seria? Impermeabilidade? Proteção da pele? Design? A área de exposição?"
31160-52 = "Você não conseguiu distinguir só de olhar, não é, Koharu-chan? Naquele lugar e naquele momento, acreditava-se que aquilo era uma \"roupa de banho\", certo?"
31160-53 = "...???"
31160-54 = "Supondo que aquilo na verdade fosse lingerie... como se poderia provar essa possível \"verdade\"?"
31160-55 = "Não há nada mais impotente do que uma verdade que não pode ser provada... Não acha?"
31160-56 = "N-Não estou entendendo nada do que você está falando... A-Afinal, o que você quer dizer!?"
31160-57 = "Estou dizendo que aquela roupa de banho era uma graça, não era?♡"
31160-58 = "...Hã!? Era tudo brincadeira!?"
31160-59 = "...Entendo, é aquele quinto, então."
31160-60 = "...!"
31160-61 = "Quinto...? Hum, Azusa-chan, do que você está falando...?"
31160-62 = "..."
31160-66 = "É só algo que ouvi falar... As sete regras antigas transmitidas há muito tempo em Kivotos. Se não me engano, essa deveria ser a quinta delas."
31160-67 = "\"É possível provar a verdade daqueles que alcançaram o paraíso?\"... Acho que era algo assim. Embora eu não conheça o resto."
31160-68 = "Ou seja, pode existir um paraíso que ninguém consegue provar...? Lembro que era como um enigma zen desse tipo."
31160-69 = "Azusa-chan, como você sabe disso...?"
31160-70 = "Quem conhece essa história..."
31160-71 = "Por acaso você já se encontrou com a Seia-chan, Azusa-chan...!?"
31160-72 = "..."
31160-74 = "...Seia?"
31160-75 = "Está falando da Seia-sama, da Tea Party...?"
31160-76 = "..."
31160-77 = "...Não sei. Só tenho a lembrança de ter ouvido essa história em algum lugar..."
31160-78 = "..."
31160-79 = "Entendo... Pensando bem, a Azusa-chan é uma aluna transferida, não é..."
31160-80 = "Vanitas vanitatum... quer dizer que..."
31160-84 = "...Não, não é nada. Já está tarde, então é melhor irmos dormir logo."
31160-88 = "Bom, obrigada pelo esforço de hoje também, pessoal!"
31160-91 = "Quarto do Sensei"
31160-93 = "Naquela noite..."
31160-94 = "...Sensei."
31160-95 = "É sobre a Hanako-chan..."
31160-96 = "[s] \"...\""
31160-97 = "...Enquanto eu reunia os gabaritos, por algum motivo encontrei um maço guardado junto. Não sei se foi guardado por ser algo raro, mas..."
31160-98 = "Estavam reunidas as folhas de respostas de todas as provas do ano passado, do 1º ao 3º ano. Por algum motivo, parece que houve alguém que respondeu a todas elas..."
31160-99 = "[s] \"E essa pessoa...\""
31160-102 = "...Sim, foi a Hanako-chan."
31160-104 = "Depois das notas do 1º ano que encontrei ontem, acabei bisbilhotando de novo sem querer, mas..."
31160-105 = "Já no 1º ano, no ano passado, a Hanako-chan tirou nota máxima em \"todas as provas\", incluindo matérias consideradas difíceis até para a turma avançada do 3º ano... É o nível de um prodígio absoluto..."
31160-106 = "Quando vi os resultados das provas do 1º ano, pensei que com certeza as notas da Hanako-chan \"tinham caído de repente neste ano\". Mas, a julgar por esses resultados, não é o caso..."
31160-107 = "[s] \"No ano passado ela já conseguia resolver qualquer questão. Ou seja...\""
31160-108 = "...Sim. Só posso pensar que a Hanako-chan agora... está reprovando nas provas de propósito..."
31160-109 = "Hanako-chan... por quê...?"
31160-111 = "Alojamento - Saguão"
31160-116 = "..."
31160-123 = "..."
31160-124 = "Azusa-chan, está de vigia de novo...?"
31160-125 = "..."
31160-129 = "Uaaah..."
31160-130 = "...Bom dia."
31160-133 = "...Certo."
31160-134 = "..."
31160-135 = "Hmm...?"
31160-136 = "(...Ué? Pensando bem, acho que não vi o Sensei desde hoje de manhã...)"
31160-137 = "(Onde será que ele foi...?)"
31160-139 = "Alojamento - Piscina"
31160-140 = "Uau, está cheia de água!"
31160-141 = "Aha, fazia tempo que eu não via essa piscina cheia de água. Por acaso você vai nadar agora? Ou vamos fazer uma festa na piscina com todo mundo?"
31160-142 = "[s] \"Desculpe a demora. Posso saber qual é o assunto?\""
31160-143 = "...Ehehe."
31160-149 = "Só fiquei pensando se o Sensei estava se saindo bem."
31160-151 = "Próximo;O Traidor da Trinity"
