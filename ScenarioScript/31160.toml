[translation]
31160-1 = "Эпизод 16;Трещина на поверхности"
31160-2 = "А-а-а! Теперь намного лучше!"
31160-3 = "Уже приняла душ? Ещё рано."
31160-4 = "Ты забыла? Хифуми сегодня так долго проспала, что не успела принять душ."
31160-5 = "Э-Эй! Не надо говорить это вслух... Стыдно."
31160-6 = "Ты проспала только потому, что допоздна готовила наш пробный экзамен. Стыдиться должна не ты."
31160-7 = "Скорее мне жаль, что после всех твоих усилий я тебя подвела. Скажи, если завтра тоже захочешь поспать подольше. Я с радостью помогу помыться утром, чтобы сэкономить время."
31160-8 = "Ч-Что? Не надо, думаю, я справлюсь!"
31160-9 = "Она сама может помыться! Она не ребёнок!"
31160-10 = "Я знаю — просто пытаюсь действовать эффективно. Совместное купание имеет несколько преимуществ, например экономию воды."
31160-11 = "В этом есть смысл, но у нас ведь нет роскошной бани, где можно всем растянуться и узнать друг друга получше."
31160-12 = "О, придумала. А что если в следующий раз всем искупаться в бассейне голышом? Почти как баня!"
31160-13 = "Это вообще бессмыслица! Запрещено! Полностью запрещено!"
31160-14 = "Я не против, но в чём преимущество? Для школьного бассейна нужен купальник."
31160-15 = "Представь, как свободно будет ощущаться... и как весело! Хи-хи! ♥"
31160-16 = "Веселье? Я об этом не думала. И ты сказала... свободно?"
31160-17 = ""
31160-19 = ""
31160-21 = "Хватит её развращать! Хватит, хватит, хватит, хватит!!!"
31160-23 = ""
31160-25 = ""
31160-26 = "Ты просто извращенка и развратительница! Тринити и так хватает извращенцев, пока ты тут бегаешь!"
31160-27 = "Правда? Я считала тебя человеком, которому купание голышом точно понравится. Ошиблась?"
31160-28 = "С чего ты так решила?! В бассейне нужны купальники! Это справедливость, а всё остальное заслуживает смертной казни!"
31160-29 = "Хм. Тогда..."
31160-30 = ""
31160-32 = ""
31160-33 = ""
31160-34 = "То бикини, которое я носила вчера в бассейне..."
31160-35 = "Что ты там шепчешь?!"
31160-36 = ""
31160-38 = ""
31160-39 = ""
31160-41 = "А это[wa:1800] правда можно[wa:1830] было[wa:660] назвать[wa:800] купальником?"
31160-42 = "...?!"
31160-43 = "Е-Если это был не купальник, тогда что?"
31160-44 = ""
31160-45 = "Забавно, сколько сейчас разных видов белья. Некоторые на первый взгляд легко принять за купальник. ♥"
31160-46 = "...?!"
31160-47 = "Ты хочешь сказать, это было оно?! Только не говори, что ты...!"
31160-48 = "Боже. Почему ты так дрожишь?"
31160-49 = "И что, если это был не купальник? Разве это изменит то, что мы пережили вместе, Кохару?"
31160-50 = "А-А?"
31160-51 = "В чём вообще разница между купальником и бельём? В водостойкости? Защите тела? Дизайне? Открытых участках?"
31160-52 = "Со стороны они ведь ничем не отличаются, правда? Поэтому ты и поверила, когда я сказала, что это купальник."
31160-53 = "...?"
31160-54 = "А что если я теперь скажу, что это были просто бюстгальтер и трусики? Как это доказать?"
31160-55 = "Какой смысл слышать правду, которой не можешь доверять или проверить самостоятельно?"
31160-56 = "Х-Хватит ходить вокруг да около! Так что это было?!"
31160-57 = "Хи-хи-хи! Купальник. Прости, просто тебя так весело дразнить, что я не могу удержаться. ♥"
31160-58 = "Т-Ты всё это время просто хотела меня дразнить?!"
31160-59 = "Теперь понятно. Ханако намекала на пятый коан."
31160-60 = "...?!"
31160-61 = "Пятый... что? О чём ты?"
31160-62 = "..."
31160-63 = ""
31160-65 = ""
31160-66 = "Я слышала об этом вскользь — семь коанов Кивотоса, уходящих корнями в древность. Думаю, она имела в виду пятый."
31160-67 = "«Можно ли доказать, что кто-нибудь когда-либо достигал рая?»#nТак я его помню, но остального не знаю."
31160-68 = "Это риторический вопрос о существовании рая, если ни один живой человек его не видел."
31160-69 = "Удивительно, что ты это знала."
31160-70 = "Тогда это значит..."
31160-71 = "Азуса! Ты раньше встречалась с Сэей?"
31160-72 = "..."
31160-74 = "Сэя?"
31160-75 = "Ты имеешь в виду Сэю из Чаепития, верно?"
31160-76 = "..."
31160-77 = "Нет. Как я сказала, просто слышала об этом вскользь."
31160-78 = "..."
31160-79 = "Точно, ты переведённый студент. Значит, если услышала это не в Тринити..."
31160-80 = "«Vanitas vanitatum...» Неужели... школа-сателлит?"
31160-81 = ""
31160-83 = ""
31160-84 = "Забудь, что я сказала. Уже поздно, нужно поспать."
31160-85 = ""
31160-87 = ""
31160-88 = "Спокойной ночи всем!"
31160-91 = "Комната Сенсея"
31160-93 = "Позже той ночью."
31160-94 = "Я хотела кое о чём поговорить с вами, Сенсей."
31160-95 = "О Ханако."
31160-96 = "[s] «...»"
31160-97 = "Когда я готовила пробный экзамен, смотрела прошлогодние образцовые ответы и кое-что заметила..."
31160-98 = "Все ответы были взяты из экзаменов одного студента."
31160-99 = "[s] «Дай угадаю...»"
31160-101 = ""
31160-102 = "Именно. Это была Ханако."
31160-103 = ""
31160-104 = "Не горжусь этим, но я заглянула и в её оценки за первый курс."
31160-105 = "Они были идеальными. Она получила максимум даже по продвинутым предметам, с которыми мучаются третьекурсницы. Она гений..."
31160-106 = "Но по какой-то причине на втором курсе оценки Ханако полностью рухнули."
31160-107 = "[s] «Ты хочешь сказать, что она...?»"
31160-108 = "Да. Думаю, Ханако намеренно получает плохие оценки."
31160-109 = "Зачем ей это делать?"
31160-111 = "Вестибюль дополнительного корпуса"
31160-113 = ""
31160-114 = ""
31160-115 = ""
31160-116 = "..."
31160-117 = ""
31160-119 = ""
31160-120 = ""
31160-121 = ""
31160-122 = ""
31160-123 = "..."
31160-124 = "Она снова на ночном патруле?"
31160-125 = "..."
31160-129 = "*зевок*"
31160-130 = "Доброе утро."
31160-133 = "*шорох*"
31160-134 = "..."
31160-135 = "*вздыхает*"
31160-136 = "(Я чувствовала, что что-то странно...)"
31160-137 = "(Я всё утро не видела Сенсея.)"
31160-139 = "Бассейн дополнительного корпуса"
31160-140 = "Вау! Бассейн полный!"
31160-141 = "Давно не видела этот старый бассейн наполненным. Планировали поплавать? Может, устроить вечеринку у бассейна?"
31160-142 = "[s] «Зачем ты позвала меня сюда?»"
31160-143 = "Хи-хи-хи."
31160-144 = ""
31160-146 = ""
31160-148 = ""
31160-149 = "Я просто хотела узнать, как у вас дела."
31160-151 = "Следующий эпизод;Предатель Тринити"
