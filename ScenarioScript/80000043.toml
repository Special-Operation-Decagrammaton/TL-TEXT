80000043-19 = "[ns] «Получилось! Отличная работа, Сумирэ!»"
80000043-22 = "*тяжело дышит* Спасибо, тренер."
80000043-23 = "[s] «Твой результат сильно улучшился.»"
80000043-24 = "Правда? Откуда вы знаете?"
80000043-25 = "Вы помните все мои результаты наизусть?"
80000043-26 = "[s1] «Моя работа — следить за развитием студентов.»\n[s2] «Я знаю почти все ваши показатели за этот год.»"
80000043-27 = "Понятно... Обязанности ответственного Сенсея."
80000043-28 = "Понятно... Обязанности ответственного Сенсея."
80000043-29 = "Мне приятно знать, что вы всё это время следили за моим прогрессом!"
80000043-30 = "Спасибо, Сенсей."
80000043-31 = "Значит, вы постоянно наблюдаете за мной, записываете всё, что я делаю..."
80000043-32 = "Это невероятно..."
80000043-33 = "[s3] «В-всё совсем не так, как у тебя звучит!»\n[s4] «Когда ты так говоришь, это звучит неприлично!»"
80000043-34 = "Прошу прощения? Не уверена, что понимаю."
80000043-35 = "А? Я что-то неправильно поняла?"
80000043-36 = ""
80000043-39 = "*вздох* После всей этой тренировки я ужасно проголодалась."
80000043-40 = "[s] «Хочешь куда-нибудь поесть? Я угощаю.»"
80000043-41 = "Спасибо за предложение, но..."
80000043-42 = "Эм..."
80000043-43 = "[s] «Что такое? Я думал, ты голодная.»"
80000043-44 = "Как вы знаете, после тренировки очень важно восполнять питательные вещества."
80000043-45 = "[s] «Верно.»"
80000043-46 = "Н-Но ещё говорят, что на День святого Валентина надо давать сахар тому, кем восхищаешься."
80000043-47 = "П-Правда ведь?"
80000043-48 = "[s] «Эм, да. Вроде того.»"
80000043-49 = "Конечно, сахар не входит в нашу тренировочную диету, но сегодня, думаю, можно сделать исключение."
80000043-50 = "Так что у меня кое-что есть для вас."
80000043-51 = "Вот, тренер."
80000043-52 = ""
80000043-55 = "[s] «Что это?»"
80000043-56 = "Я перепробовала сотни тренировочных продуктов, сравнивая и тестируя их."
80000043-57 = "И решила, что этот подойдёт. Это заменитель еды со вкусом шоколада."
80000043-58 = "Я слышала, вы забываете поесть, когда слишком заняты работой."
80000043-59 = "[s] «Очень заботливо. Спасибо, Сумирэ!»"
80000043-60 = "Рада, что вам нравится."
80000043-61 = "Хорошо, тренер!"
80000043-62 = "Компания гарантирует, что после одного тюбика вы почувствуете сытость!"
80000043-63 = "Так что после него наша 20-километровая пробежка будет пустяком!"
80000043-64 = "[s5] «Я не знал, что у этого подарка есть условия!»\n[s6] «Пробежать двадцать километров... прямо сейчас?!»"
80000043-65 = "Хи-хи! Пойдём, тренер!"
80000043-66 = "Хи-хи! Пойдём, тренер!"
80000043-67 = ""
80000043-69 = ""
80000043-71 = "После этого мне пришлось участвовать в специальной валентиновской тренировке Сумирэ,#nна которую я совершенно точно не подписывался."
