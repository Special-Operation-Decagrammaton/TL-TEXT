[translation]
10027125-3 = ""
10027125-4 = ""
10027125-5 = "О боже... Вы такие... сильные!"
10027125-6 = ""
10027125-8 = ""
10027125-12 = "[ns] «Прости, Марина. Но помни... у любой истории есть две стороны.»"
10027125-14 = ""
10027125-15 = ""
10027125-16 = "Им удалось одолеть Секретариат...? Даже без помощи Сенсея сила дружбы... впечатляет."
10027125-17 = "[s] «Президент! Я почти выдохся.»"
10027125-18 = "Значит... похоже, мы проиграли. Жаль. Мне очень хотелось получить ту рукопись. Пожалуй, лучше красиво отступить, пока ещё могу."
10027125-19 = "Хаха... Рада, что ты понимаешь..."
10027125-20 = "Значит, я получу следующую рукопись, которую ты напишешь."
10027125-21 = "Ты хочешь сказать, что это ещё не конец?!"
10027125-22 = "Не каждая сказка заканчивается после одной битвы! Важно то, что происходит после победы героя над злодеем. А тебе, моя маленькая тёмная лошадка, придётся пережить ещё не одну битву, чтобы от меня избавиться."
10027125-23 = "В следующий раз можешь ждать полномасштабной битвы! Хи, хи, хи!"
10027125-24 = "Как ты можешь с таким невозмутимым лицом говорить настолько страшные вещи?"
10027125-25 = "Ты дала обещание, Мэру. И ведь не хочешь нарушить ещё одно обещание, правда?"
10027125-26 = "Уф!"
10027125-27 = "[s] «В этом она права...»"
10027125-28 = "На этом всё. Издательский отдел пока удаляется. Но когда мы вернёмся, у нас будет предложение, от которого ты не сможешь отказаться."
10027125-30 = "Будем надеяться, в следующий раз контракт будет честным."
10027125-32 = ""
10027125-36 = ""
10027125-37 = ""
10027125-38 = "Ну... Рада, что с этим покончено."
10027125-39 = "Разве всё это не устроила твоя президент?"
10027125-40 = "Может, она и моя президент, но мы с ней совершенно разные люди."
10027125-42 = "В любом случае сейчас ведь речь не об этом, верно?"
10027125-43 = "[s] «Наконец настало время критики Таканэ...»"
10027125-45 = "Надеюсь, вас не расстроят отрицательные отзывы, Сенсей..."
10027125-46 = "Даже если Сенсей не расстроится, я точно буду вся на нервах!"
10027125-47 = "[s1] «Внешнее одобрение имеет больше власти, чем люди думают.»\n[s2] «Соберёмся с духом...»"
10027125-50 = "У-Ух...!"
10027125-51 = "Держись. Глубоко дыши! Вдох... Выдох..."
10027125-52 = ""
10027125-54 = ""
10027125-56 = ""
10027125-57 = "Почему люди так меня боятся, будто я держу их жизнь в своих руках? Так странно..."
10027125-58 = "Ладно, пора читать. Мне нужна минута сосредоточиться."
10027125-68 = ""
10027125-69 = "Хорошо... Время честного отзыва."
10027125-70 = ""
10027125-72 = ""
10027125-74 = ""
10027125-75 = "О... Я ТАК старалась, но ТАК боюсь, что всё окажется зря... Даже ребёнок понял бы, насколько малы шансы. *вздыхает*"
10027125-76 = "Если всё развалится, помните о нас. Помните, что была книга и люди, которые её читали и любили..."
10027125-78 = "...Ты сейчас прощаешься перед смертью?!"
10027125-79 = "Ты тратишь время. А моё время, между прочим, довольно ценно."
10027125-80 = "Знаете, как говорят: все тревожатся о будущем, но мало кто действительно, по-настоящему о нём думает."
10027125-81 = "То же касается прошлого. Мы смотрим на настоящее через призму истории, но мало кто способен изучить прошлое с настоящей ясностью. Мы забываем то, что не любим, прославляем то, что любим, и отодвигаем боль в глубину сознания."
10027125-82 = "Возможно, мы слишком высоко ценим настоящее. Оно не может существовать без своих братьев и сестёр. Позади нас лежит постоянно расширяющееся прошлое, впереди — бесконечное будущее. Настоящее — лишь тонкая линия между ними."
10027125-83 = "Именно поэтому истории о настоящем не могут убежать от прошлого или будущего. Ход времени неизбежен. Многие хотели бы забыть об этом и жить только настоящим. Но уйти от этого невозможно."
10027125-84 = "Эта история — о прошлом, настоящем и будущем Луны."
10027125-85 = "Сама история во многом ничем не примечательна, но... самоотдача автора определённо выделяется. На самом деле это её самая яркая черта."
10027125-86 = "Такая глубина эмоций сегодня встречается редко. Это современная классика. И кроме того..."
10027125-87 = ""
10027125-89 = ""
10027125-90 = "Кроме того..."
10027125-91 = ""
10027125-93 = ""
10027125-95 = ""
10027125-96 = "И кроме того...?"
10027125-97 = "Что? Что там...?"
10027125-99 = "..."
10027125-100 = ""
10027125-103 = "[ns3] «Иногда честность...»\n[ns4] «...это именно то, что нужно, чтобы стать свободным.»"
10027125-106 = "...!"
10027125-107 = "Если это ваши слова, Сенсей, тогда я—"
10027125-108 = "Кхм!"
10027125-109 = "История была хорошей. Она заставила меня задуматься, какой могла бы стать, будь у неё больше времени."
10027125-110 = "Хорошая работа, Фронт освобождения знаний."
10027125-112 = "Так странно это слышать. Ты уверена, что действительно хотела сказать именно это?"
10027125-113 = "Да уж, ты слишком много хвалишь Мэру."
10027125-115 = "Ты представляешь, чего мне стоило это сказать? Как ты смеешь отвечать так грубо?!"
10027125-116 = "Эй, для меня это тоже прозвучало странно, ясно? Дай мне передохнуть!"
10027125-118 = ""
10027125-121 = ""
10027125-122 = "*вздыхает* Ладно. Теперь, когда ты официально часть клуба, я пришлю тебе время и место следующего съезда. Позже проверь почту."
10027125-123 = "Не могу дождаться! А в следующий раз мы будем полностью готовы."
10027125-124 = "Да, в следующем году времени будет предостаточно!"
10027125-125 = "Я бы не рассчитывала. Но всё равно удачи, Фронт освобождения знаний."
10027125-126 = ""
10027125-128 = ""
10027125-129 = "Хорошо..."
10027125-130 = "Вернёмся?"
10027125-131 = "Однозначно. Сегодня я буду спать как убитая."
10027125-132 = "[s] «А я собираюсь проспать следующие два дня.»"
10027125-133 = "Хахаха... Ну. Кхм. В любом случае..."
10027125-134 = "Мэру, не могу поверить, что ты написала для меня последний том «Луны» ..."
10027125-135 = "Всё, что могу сказать... Я правда впечатлена."
10027125-136 = "Хи-хи! Правда? В итоге всё ведь получилось хорошо?"
10027125-137 = "Если правильно сделать концовку, то всё О-КЕЙ! А концовка у нас получилась потрясающая!"
10027125-138 = "...Надо было догадаться, что ты лишишь меня возможности сказать что-нибудь сентиментальное в самом конце."
10027125-139 = "Ничего не прошло гладко! Хуже того, ты втянула в это Сенсея и заставила четыре дня подряд работать над рукописью!"
10027125-140 = "Я-Я просто хотела показать Сенсею, каково жить художнику манги перед дедлайном..."
10027125-141 = "Ой, да ладно. Ты просто хотела быть в центре внимания. Ты заставила его!"
10027125-142 = "Н-нет! Он сам вызвался!"
10027125-143 = "Даже так ты перешла черту!"
10027125-144 = "Ты совершенно опозорила Сенсея."
10027125-145 = "Эй! Мне самой тоже было несладко!"
10027125-146 = "Да, но ты сама это на себя навлекла! И мне жизнь усложнила!"
10027125-147 = ""
10027125-150 = "[ns] «Эй... Знаете, я-я в порядке... Правда...»"
10027125-151 = "Может, вы и в порядке, но я — нет! Стой там, Мэру, и слушай, что я сейчас тебе скажу!"
10027125-152 = "Уаааа! Младшекурсницы не имеют права издеваться над старшими! Никаких речей! Никаких нотаций!"
10027125-154 = "Мээээрууууу!"
10027125-156 = ""
10027125-162 = "Фронт освобождения знаний снова погрузился в крики и перебранку, но на этот раз я уже не так об этом беспокоился."
10027125-164 = ""
10027125-166 = "[ns] «Ну что ж.»"
10027125-167 = ""
10027125-171 = "[ns] «Ещё один мирный день.»"
10027125-173 = "История клуба академии: Последнее приключение пары"
