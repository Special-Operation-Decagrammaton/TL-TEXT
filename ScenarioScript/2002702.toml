[translation]
2002702-1 = "Снорклинг"
2002702-3 = "Я направился к прибрежным скалам, где ждала Широко."
2002702-4 = "А. Сенсей. Сюда."
2002702-5 = "[ns1] «Хороший камень.»\n[ns2] «Что это за место?»"
2002702-8 = ""
2002702-12 = ""
2002702-13 = "Приливная скала. Здесь удобно добывать еду."
2002702-14 = "...О?"
2002702-15 = "Разве у нас и так не много еды?"
2002702-16 = "Хм..."
2002702-17 = "Технически да, но..."
2002702-18 = ""
2002702-20 = ""
2002702-21 = "Разве мне не стоит собрать ещё?"
2002702-22 = ""
2002702-25 = "[ns3] «Наверное, вреда не будет.»\n[ns4] «Если ты хочешь, этого уже достаточно.»"
2002702-28 = "Сенсей."
2002702-29 = "Я надеялась, что вы так скажете, Сенсей."
2002702-30 = "Я уже подготовилась. Всё необходимое со мной."
2002702-31 = ""
2002702-33 = ""
2002702-34 = ""
2002702-36 = ""
2002702-39 = ""
2002702-40 = "Смотрите. Вот. Это снаряжение."
2002702-41 = "[s5] «Снаряжение для снорклинга...»\n[s6] «Ты определённо подготовилась.»"
2002702-44 = "Да. Потому что именно это мне нужно. Для сегодняшней цели."
2002702-45 = "Я прочитала о легендарном моллюске... Он появляется только здесь."
2002702-46 = "Вы о нём слышали?"
2002702-47 = "Я прочитала о нём в брошюре... Но не знаю, существует ли он на самом деле."
2002702-48 = "Но это единственная зацепка, которая у меня пока есть. И..."
2002702-49 = ""
2002702-51 = ""
2002702-52 = "Нет."
2002702-53 = "Я зря трачу время на объяснения. Дайте мне минуту, Сенсей. Я скоро вернусь."
2002702-54 = ""
2002702-58 = "И Широко прыгнула в воду."
2002702-60 = "Каждый раз, когда она выныривала, приносила всякие странные вещи, но..."
2002702-61 = ""
2002702-64 = ""
2002702-65 = "[ns7] «Ты нашла! Отличная работа!»\n[ns8] «Это и правда тот легендарный моллюск?»"
2002702-68 = "Нет. Не то. Это не он."
2002702-69 = ""
2002702-71 = ""
2002702-72 = "Мне нужно нырнуть ещё раз, Сенсей."
2002702-73 = ""
2002702-83 = "После нескольких часов поисков от так называемого «легендарного моллюска» не было ни следа..."
2002702-84 = "[ns9] «Посмотри на время...»\n[ns10] «Может, на сегодня хватит?»"
2002702-87 = "Нет."
2002702-88 = "Всё нормально, Сенсей."
2002702-89 = ""
2002702-92 = "Времени почти не осталось..."
2002702-93 = "Но у меня получилось."
2002702-96 = "― [log=시로코 수영복]Я вернулась, Сенсей.[/log][wa:1700]"
2002702-98 = "― [log=시로코 수영복]Да. Я нашла его. Теперь смогу приготовить то блюдо...[/log][wa:2580]"
2002702-101 = "― [log=시로코 수영복]Я имею в виду блюдо из брошюры.[/log][wa:1780]"
2002702-103 = "― [log=시로코 수영복]Посуда уже готова. Всё подготовлено.[/log][wa:1840]"
2002702-106 = "― [log=시로코 수영복]...Я рада, что вы пришли сюда со мной.[/log][wa:2040]"
2002702-108 = "― [log=시로코 수영복]Если бы я была одна, возможно, сдалась бы.[/log][wa:1760]"
2002702-111 = "[ns11] «Ты и одна отлично бы справилась.»\n[ns12] «Я вообще ничего не сделал, Широко.»"
2002702-114 = "― [log=시로코 수영복]Хм... Неправда.[/log][wa:1520]"
2002702-116 = "― [log=시로코 수영복]Я смогла это сделать... и смогла думать так...[/log][wa:1860]"
2002702-119 = "― [log=시로코 수영복]Только... потому что вы присматривали за мной.[/log][wa:2120]"
2002702-122 = "― [log=시로코 수영복]Спасибо... Сенсей.[/log][wa:2960]"
2002702-125 = "Довольные сегодняшним уловом, мы вернулись в лагерь."
2002702-126 = "А что до вкуса этого легендарного моллюска..."
2002702-127 = ""
2002702-129 = ""
2002702-130 = ""
2002702-132 = ""
2002702-133 = "...он оказался довольно пресным."
