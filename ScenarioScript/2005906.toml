[translation]
2005906-1 = "Свидание с бесёнком"
2005906-3 = "Оперный театр"
2005906-4 = ""
2005906-5 = ""
2005906-6 = "А! Сенсей! Я здесь!"
2005906-7 = "[s1] «Что мы делаем в опере?»\n[s2] «У тебя заказ?»"
2005906-10 = "Нет, ничего подобного. Я просто хотела посмотреть представление."
2005906-11 = "В прошлый раз мы НИЧЕГО не увидели. Были слишком заняты."
2005906-12 = "Поэтому теперь хочу смотреть внимательно, ни на что не отвлекаясь."
2005906-13 = "Хотя не уверена. Опера может оказаться для меня слишком скучной..."
2005906-14 = "Но с Сенсеем мы наверняка найдём, как повеселиться."
2005906-15 = "[s] «Да. Вместе мы что угодно сделаем весёлым!»"
2005906-16 = "Куфуфу. Тогда пойдём внутрь."
2005906-18 = "Ого, здесь очень тихо."
2005906-19 = "...Отличное место для розыгрыша, правда? Все такие серьёзные."
2005906-20 = "Как думаете, что будет, если я брошу бомбу? О! Или радужную дымовую завесу?"
2005906-21 = "[s] «Т-Ты собираешься?!»"
2005906-22 = "Куфуфу, шучу!"
2005906-23 = "Не хочу, чтобы у вас были неприятности. Настроение испортится."
2005906-24 = "К тому же сегодня мы должны сосредоточиться на опере."
2005906-25 = ""
2005906-28 = "А, начинается."
2005906-29 = "Моя первая опера..."
2005906-31 = "После величественной увертюры занавес поднялся."
2005906-32 = "Это была современная опера о девушке, любящей музыку, и жестоком наставнике. В итоге она преодолела все трудности и добилась успеха."
2005906-34 = "Я переживал, что Муцуки заскучает... но зря."
2005906-35 = "Муцуки наслаждалась постановкой до самого конца!"
2005906-36 = ""
2005906-38 = ""
2005906-39 = ""
2005906-40 = ""
2005906-43 = "Представление закончилось, и мы вышли наружу..."
2005906-45 = "[ns] «Уже ночь.»"
2005906-46 = "Да! Время так быстро пролетело, правда?"
2005906-47 = "Ах, было весело."
2005906-48 = "Разве искусство не потрясающее? От одной музыки сердце колотилось!"
2005906-49 = "[s] «Мне понравилось, что сюжет легко понять.»"
2005906-50 = "Куфуфу. Я изучила постановку, прежде чем выбрать."
2005906-51 = "Опера о студенте и его наставнике..."
2005906-52 = "Я невольно задумалась..."
2005906-53 = ""
2005906-55 = ""
2005906-56 = "Сенсей, что вы обо мне думаете?"
2005906-57 = "[s3] «Ч-Что?!»\n[s4] «П-Прямо сейчас?!»"
2005906-60 = "Хм? Почему вы так удивились? Вопрос настолько сложный?"
2005906-61 = "Так что, Сенсей..."
2005906-62 = "Как думаете, я хороший студент?"
2005906-63 = "[s] «А... В-Вот в каком смысле!»"
2005906-64 = "А? А в каком ещё?"
2005906-65 = "Чего вы заикаетесь? Объясните мне. Не спешите."
2005906-66 = "[s] «П-Просто думаю о том, какая ты хороший студент...!»"
2005906-67 = "Ахаха, ладно. На этот раз отпущу..."
2005906-68 = "Значит, хотя бы хорошей вы меня считаете."
2005906-69 = "Куфуфуфу..."
2005906-70 = ""
2005906-72 = ""
2005906-73 = ""
2005906-74 = "Ну, раз посмотрели весёлую оперу, пойдём ужинать!"
2005906-75 = "В торговом районе есть отличное место. Идём!"
2005906-77 = "Муцуки отвела меня в недорогое заведение с шашлычками."
2005906-78 = "Мы приятно поужинали и легко болтали."
2005906-79 = ""
2005906-81 = ""
2005906-83 = "После этого расходиться всё ещё не хотелось. Мы заглянули в уютное кафе."
2005906-84 = "Говорили о недавних трендах, повседневной жизни... обычных вещах."
2005906-85 = ""
2005906-87 = ""
2005906-89 = "Вскоре стало совсем поздно."
2005906-90 = "Прогуливаясь, мы одновременно остановились перед парком, будто прочитали мысли друг друга."
2005906-92 = ""
2005906-93 = "Ах, уже пора прощаться."
2005906-94 = "Сегодня всё пролетело так быстро. Но это хорошо."
2005906-95 = "Спасибо, что пришли, Сенсей. С вами было весело."
2005906-96 = "[s] «Да. Мне тоже было весело.»"
2005906-97 = "Куфуфу. Буду ждать следующего свидания."
2005906-98 = "[s] «Да. Следующего...»"
2005906-99 = ""
2005906-101 = ""
2005906-102 = ""
2005906-103 = "[ns5] «...С-Свидания?!»\n[ns6] «П-Постой, так весь сегодняшний день был...?!»"
2005906-106 = "Ага! Свиданием!"
2005906-107 = "Куфуфу, вы не поняли? Какой же вы медленный, Сенсей."
2005906-108 = "Это ведь наше первое нормальное свидание, правда?"
2005906-109 = "Если думать об этом так, всё ощущается иначе, да?"
2005906-110 = "Не могу нормально объяснить, но в груди всё время что-то покалывало."
2005906-111 = "Так что спасибо! Что составили мне компанию на моём первом свидании!"
2005906-112 = "[s] «Ч-Честь целиком моя!»"
2005906-113 = "Ахаха, мой план устроить естественное, обычное свидание сработал!"
2005906-114 = "Сначала я просто хотела вас подразнить... Но теперь это уже неважно."
2005906-115 = "Знаете, как вы сказали, что я хороший студент..."
2005906-116 = "Я тоже считаю вас хорошим учителем."
2005906-117 = ""
2005906-119 = ""
2005906-120 = ""
2005906-121 = "Так что продолжайте заботиться обо мне, хорошо?"
2005906-122 = "Хотя слушать ваши советы я буду только когда захочу, ладно? Куфуфу."
2005906-124 = "Мы ещё немного посидели и поболтали в парке. Потом мы с Муцуки расстались с улыбками."
2005906-125 = "...И пообещали встретиться снова."
