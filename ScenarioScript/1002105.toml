[translation]
1002105-1 = "Всё как на ладони"
1002105-2 = "Я спросил Азусу, где она, и отправился к ней. Я добрался до пляжа как раз к закату."
1002105-3 = "Добро пожаловать, Сенсей. Я знаю, что должна была сама прийти к тебе..."
1002105-4 = "[s1] «Всё в порядке. Мне небезразлично, чем ты занимаешься.»\n[s2] «Я пришёл обсудить стратегию.»"
1002105-5 = "..."
1002105-6 = "..."
1002105-7 = "Благодаря тебе я наконец смогла по-настоящему оценить пляж..."
1002105-8 = "...но прошло уже столько времени."
1002105-9 = "У меня осталось не так много времени, чтобы узнать больше о пляже."
1002105-10 = "Поэтому я думаю о самом эффективном способе узнать как можно больше за оставшееся время."
1002105-11 = "Как ты думаешь? Какой способ был бы лучшим?"
1002105-12 = "[s3] «Ты всё ещё думаешь об эффективности, даже сейчас.»\n[s4] «Очевидно, нам придётся сделать стратегический выбор.»"
1002105-13 = "Ах. Я потратила слишком много времени."
1002105-14 = "Ах. Я потратила слишком много времени."
1002105-15 = "То есть я вовсе не считаю это время потраченным впустую..."
1002105-16 = "Хм?"
1002105-17 = "У тебя есть идея? Хорошо."
1002105-18 = "Отлично. Похоже, я не ошиблась, когда решила позвать тебя. Я слушаю, Сенсей."
1002105-19 = "А? Ты хочешь, чтобы я пошла за тобой?"
1002105-20 = "Эм. Ну... почему бы и нет?"
1002105-21 = "Хорошо. Я доверюсь твоему выбору."
1002105-22 = "Я прямо за тобой. Веди."
1002105-26 = "...?"
1002105-27 = "Сенсей?"
1002105-28 = "Эм... И долго ещё идти? Насколько далеко мы направляемся?"
1002105-29 = "Мы идём уже почти двадцать минут."
1002105-30 = "Н-Не то чтобы я тебе не доверяла. Я просто хочу уточнить нашу стратегию."
1002105-31 = "Мне кажется, мы уже даже не рядом с пляжем."
1002105-33 = "Почему мы ушли с пляжа и поднялись в горы?"
1002105-34 = "Не уверена, что понимаю. Я сказала, что хочу больше узнать об океане, а ты привёл меня в горы."
1002105-35 = "Уверена, на то есть причина, но..."
1002105-36 = "А?"
1002105-37 = "Ты говоришь, что мы почти пришли?"
1002105-38 = "Мне кажется, ты так и не ответил на мой вопрос."
1002105-39 = "Хорошо. Я снова тебе доверюсь."
1002105-42 = "Нужно лишь пройти дальше..."
1002105-43 = "...?"
1002105-44 = "А-А?"
1002105-45 = "Я чувствую ветер вокруг ног. Что это...?"
1002105-46 = "Это место...!"
1002105-49 = "― Ух ты... Я никогда раньше не видела[wa:2870]"
1002105-51 = "― столько сияющих и красивых вещей сразу... Невероятно![wa:1390]"
1002105-54 = "― Отсюда я могу увидеть всё[wa:2720]"
1002105-56 = "― одним взглядом. Ничто не загораживает обзор.[wa:10]"
1002105-59 = "― Я... никогда прежде не чувствовала ничего подобного.[wa:630]"
1002105-62 = "― Обычно мне не нравятся такие открытые места.[wa:2740]"
1002105-64 = "― Здесь негде укрыться, а контролировать периметр трудно.[wa:870]"
1002105-67 = "― Но, что интересно, меня это почти не беспокоит.[wa:2210]"
1002105-69 = "― Значит, возможно, это... Точно.[wa:2500]"
1002105-72 = "― Потому что сейчас...[wa:4290]"
1002105-74 = "― ...Сенсей находится в моём поле зрения.[wa:1330]"
1002105-76 = ""
1002105-77 = "Как я и думала — интуиция меня не подвела."
1002105-78 = "На самом деле ты даже превзошёл мои ожидания..."
1002105-79 = "Думаю, теперь я могу сказать, что понимаю, что такое пляж."
1002105-80 = "..."
1002105-82 = "Спасибо, Сенсей."
