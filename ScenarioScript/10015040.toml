[translation]
10015040-1 = "Эпизод 4;Группа поддержки «Миллениума»...?"
10015040-3 = "[ns] «Я не чувствую тела...»"
10015040-4 = "Хи-хи. Сегодня вы отлично постарались."
10015040-5 = "Я была удивлена вашей физической формой!"
10015040-6 = "Знаете что, я согласна с Сумирэ! Будь вы учеником, я бы точно завербовала вас в спортсмены!"
10015040-7 = "[s1] «Мы оба знаем, что я был не так уж хорош...»\n[s2] «Мне вполне достаточно смотреть с трибун.»"
10015040-10 = "Хи-хи. Но когда участвуешь сам, игры становятся куда интереснее!"
10015040-11 = "Поэтому «Семинар» старается составлять списки так, чтобы шанс поучаствовать был у каждого студента."
10015040-12 = "Но на деле большинство студентов даже не хотят этого шанса. Трудно набрать достаточно спортсменок для соревнований."
10015040-13 = "[s] «Студенты „Миллениума“ не любят физическую активность?»"
10015040-14 = "Совершенно точно не любят. Хотя, конечно, бывают исключения вроде Клуба спортивной подготовки."
10015040-15 = "Мы не просто так называемся Научной школой «Миллениум». Студенты приходят сюда ради исследований, а не чтобы бросать мяч через поле."
10015040-16 = "Даже бейсбольный клуб «Миллениума» больше интересуется расчётом параболы броска питчера, чем собственно набором очков."
10015040-17 = "Здесь всё именно так. Но открою вам маленький секрет: я очень надеялась, что наши студенты увидят, насколько спорт может быть весёлым, и благодаря этому немного расширят круг интересов."
10015040-18 = "...Хотя я начинаю понимать, что для большинства это скорее огромная заноза."
10015040-19 = "[s] «Очень надеюсь, что все заметят твои старания, Ноа.»"
10015040-20 = ""
10015040-22 = ""
10015040-23 = "Ха-ха... Спасибо. Для меня это много значит."
10015040-24 = ""
10015040-30 = "А вот и мы! Та самая печально известная промышленная лаборатория, где творится инженерная магия."
10015040-31 = "[s3] «Мы не слишком рано?» \n[s4] «Прошло всего три часа с тех пор, как мы попросили их сделать робота...»"
10015040-34 = "Не волнуйтесь. Какими бы странными и эксцентричными они ни были, сроки они не срывают никогда."
10015040-35 = "Утаха сказала, что закончит за три часа — значит, закончит."
10015040-36 = "Не могу дождаться знакомства с нашим потрясающим новым роботом-болельщиком."
10015040-37 = "[s] «Не знаю почему, но у меня сейчас очень плохое предчувствие...»"
10015040-38 = "Привет! Эй!"
10015040-39 = ""
10015040-42 = ""
10015040-44 = ""
10015040-46 = "А...?"
10015040-47 = ""
10015040-48 = "[ns] «...?»"
10015040-49 = "Инженерный департамент, готовы?"
10015040-50 = "Да!"
10015040-51 = "Д-Да..."
10015040-53 = "Вперёд!"
10015040-54 = "ВПЕРЁД!"
10015040-55 = "Ты справишься!"
10015040-56 = "Тысправишься..."
10015040-57 = "Хибики! Слишком тихо! И произноси слова чётче!"
10015040-58 = "Т-ты справишься!"
10015040-60 = "Победа! «Миллениум»!"
10015040-61 = "Ура-а-а-а!"
10015040-62 = "Ура..."
10015040-63 = ""
10015040-69 = "Я прямо зарядилась энергией! Какой страстный клич."
10015040-70 = "Вы тоже чувствуете прилив адреналина, Сенсей?"
10015040-71 = "[s5] «Это было здорово, я только не понял, зачем...»\n[s6] «З-зачем вы вообще кричали речёвку?»"
10015040-74 = "Кхм. Мы... тренируем речёвки для завтрашних спортсменок «Миллениума»."
10015040-75 = "Я прочитала об этом много книг! Вы знали, что научно доказано: поддержка зрителей улучшает физические показатели?"
10015040-76 = "Громкие повторяющиеся звуки стимулируют кору головного мозга и усиливают выброс адреналина, тем самым повышая электромиографическую активность."
10015040-77 = "А эстетически приятные вещи вроде наших подобранных по цветам костюмов и помпонов максимально поднимут боевой дух спортсменок!"
10015040-78 = "Разве костюмы не замечательные? Хибики сама сделала их с нуля! Для неё нет ничего невозможного — хоть роботы, хоть одежда!"
10015040-80 = "Я хотела сшить всем форму в матросском стиле, но успела сделать только для Утахи..."
10015040-81 = "Наши с Котори костюмы очень старые — ещё с тех времён, когда я только начинала экспериментировать с косплеем. Пожалуйста, не смотрите слишком внимательно на швы..."
10015040-82 = "А-а! Я не хочу появляться в этом перед всеми!"
10015040-84 = "Но тебе очень идёт, Хибики! И это в сто раз лучше всего, что можно купить в магазине!"
10015040-85 = "Ещё раз спасибо за мой костюм, Хибики. Если честно, он мне нравится даже больше обычной формы «Миллениума»."
10015040-86 = "[s] «Да... Вы все выглядите отлично, но...»"
10015040-88 = "Я согласна с Сенсеем. Простите, что порчу настроение, но..."
10015040-89 = ""
10015040-92 = ""
10015040-94 = "...что случилось с роботом-болельщиком?"
10015040-95 = ""
10015040-97 = ""
10015040-99 = ""
10015040-100 = "Н-ну... Насчёт этого...!"
10015040-101 = "Мы закончили... Почти полностью закончили... но потом... произошло кое-что... неожиданное..."
10015040-102 = "Если коротко..."
10015040-103 = "Мы провалили задачу."
10015040-104 = "[s] «Вы не смогли закончить робота...?»"
10015040-106 = "Технически мы его закончили. Но во время испытаний всё пошло наперекосяк."
10015040-107 = "Нам нужно было установить все необходимые защитные программы, поэтому мы включили модуль связи малого радиуса — и робот полностью вышел из-под контроля."
10015040-108 = "Мы пытались остановить его всеми способами, но он даже не реагировал на протокол аварийного отключения и укатил по коридору, сея хаос."
10015040-109 = "Итого: у нас нет даже обломка робота, который можно вам показать."
10015040-110 = "Мы, Инженерный отдел, глубоко стыдимся того, что провалили свою миссию."
10015040-111 = "Но уж чего у нас не отнять, так это упорства! Мы дали обещание и выполним свой долг."
10015040-112 = "Может, мы и не тот робот-болельщик, которого вы заказывали, но эта группа поддержки к вашим услугам!"
10015040-113 = "Наш девиз — решать любые проблемы всем, что у нас есть, чего бы это ни стоило!"
10015040-114 = "Черлидинг не совсем входит в наше резюме, но мы постараемся..."
10015040-116 = "Можно на секунду вернуться назад? Вы уверены, что проблемы начались ровно после включения модуля связи малого радиуса?"
10015040-117 = "Покажите мне чертежи робота-болельщика, пожалуйста."
10015040-118 = "Конечно. Вот."
10015040-119 = ""
10015040-121 = ""
10015040-123 = ""
10015040-124 = ""
10015040-125 = "Как я и думала... Проект идеален. Ни одной схемы не на месте, и аварийное отключение должно было сработать, когда вы его активировали."
10015040-126 = "Судя по этим чертежам, нет никаких причин, почему робот мог выйти из-под контроля."
10015040-127 = "[s] «Ты можешь понять это только по чертежу?»"
10015040-128 = "Хи-хи, конечно! Я отвечаю за обработку всех патентов, подаваемых в «Семинар», так что можете считать меня немного экспертом."
10015040-129 = ""
10015040-131 = ""
10015040-132 = ""
10015040-133 = ""
10015040-134 = ""
10015040-135 = "А учитывая собственный опыт Инженерного отдела, сомневаюсь, что при производстве допустили серьёзную ошибку."
10015040-137 = "А значит, я прихожу к выводу, что его взломали."
10015040-139 = "Взломали?!"
10015040-140 = "Как кто-то мог взломать связь такого малого радиуса извне школы? Это далеко за пределами всех известных нам технологий."
10015040-142 = "Вообще-то у президента «Веритас» есть объяснение."
10015040-146 = ""
10015040-147 = "...Кто-то из студентов «Миллениума» саботирует фестиваль?"
10015040-148 = "Какое облегчение! Моя самооценка уже начала страдать от мысли, что в нашем проекте была ошибка."
10015040-149 = "Я бы не называла это облегчением. Наши защитные модули используют коммерческие плагины, поэтому противопоставить этому взлому нам почти нечего."
10015040-151 = "Я очень надеялась, что это сможет подождать до конца спортивного фестиваля, но ситуация явно становится всё хуже."
10015040-152 = "Говорят, лучший способ победить хакера — найти хакера получше."
10015040-153 = "Посмотрим, что «Веритас» скажет по этому поводу."
