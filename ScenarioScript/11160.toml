[translation]
11160-2 = "Episódio 16;A Verdade Revelada"
11160-3 = "Comitê de Contramedidas — Sala de Aula"
11160-4 = "(Voltamos para Abydos com a Hifumi e todos nos reunimos para verificar os documentos.)"
11160-5 = "(Bam!!)"
11160-6 = "O-O que é isso?! O que diabos está acontecendo?!"
11160-7 = "...!!"
11160-8 = "O registro de coleta do carro-forte mostra que recolheram 7,88 milhões de ienes em Abydos.#nSem dúvida, é o caminhão que veio até a nossa escola."
11160-9 = "...Mas logo depois há um registro dizendo \"Subsídio de missão de 5 milhões de ienes fornecido\" para a Gangue dos Capacetes Kata-Kata..."
11160-10 = "Isso quer dizer... que..."
11160-12 = "Depois de pegar o nosso dinheiro, eles foram direto pro esconderijo da Gangue dos Capacetes entregar esse subsídio de missão, não é?!"
11160-13 = "Uma missão...? Para a Gangue dos Capacetes Kata-Kata...?"
11160-14 = "Será que quem está por trás da Gangue dos Capacetes é... a Kaiser Loans?"
11160-17 = "..."
11160-18 = "..."
11160-19 = "..."
11160-20 = "O-O que isso significa?! Eu não entendo! Se a escola falir, eles não vão conseguir recuperar o dinheiro que emprestaram...#nPor que fariam algo assim...?"
11160-21 = "Hmm..."
11160-22 = "Pelo visto, isso não é obra só do banco.#nSó pode ter dedo da matriz da Kaiser Corporation nessa história..."
11160-23 = "...Sim. É a conclusão mais sensata."
11160-27 = "Pessoal, muito obrigada por tudo."
11160-28 = "Desculpa por envolver você nessa confusão, Hifumi-san."
11160-29 = "A-Ahaha..."
11160-30 = "Da próxima vez eu passo lá pra visitar, então conto com você~."
11160-31 = "Sim, com certeza!"
11160-32 = "Os detalhes ainda não estão claros, mas...#nisso pode servir como prova concreta de que a Kaiser Corporation tem algum vínculo com criminosos e grupos antissociais."
11160-33 = "Assim que eu voltar, vou relatar isso ao Tea Party!"
11160-34 = "E também sobre a situação atual de Abydos..."
11160-35 = "..."
11160-36 = "Bom, eu acho que o Tea Party já sabe disso, viu~."
11160-37 = "C-Como assim?!"
11160-38 = "A liderança de uma escola daquele tamanho já deve estar a par de tudo há tempos.#nAfinal, eles não ficam só brincando por lá, né?"
11160-39 = "N-Não pode ser... Mesmo sabendo, eles deixaram vocês..."
11160-40 = "É, a Hifumi-chan é uma menina pura e boazinha mesmo. Mas o mundo não é tão gentil assim, não."
11160-41 = "..."
11160-42 = "Eu agradeço a intenção, Hifumi-chan, mas contar pra eles não vai trazer nenhuma solução de verdade,#ne tenho a sensação de que só vai deixar a gente ainda mais em pânico."
11160-43 = "S-Será mesmo...?"
11160-44 = "Olha, Abydos tá quase fechando as portas, né? A gente não tem força#npra controlar qualquer movimento de escolas gigantes como Trinity ou Gehenna.#nVocê entende o que eu quero dizer, né?"
11160-45 = "...Quer dizer que, mesmo que aprontem alguma coisa sob o pretexto de ajudar, nós não teríamos como impedir...#nÉ isso, não é?"
11160-46 = "...É verdade, não dá pra descartar essa possibilidade.#nAuu... Política é tão difícil."
11160-47 = "Mas... Hoshino-senpai, você não está sendo pessimista demais?#nTalvez eles nos ajudem de verdade..."
11160-48 = "Uhee~ É que eu já virei um velhote cínico que não consegue aceitar a boa vontade dos outros de coração aberto~."
11160-50 = "Foi por ignorar o \"e se\" que Abydos acabou nesse estado."
11160-51 = "..."
11160-52 = "..."
11160-53 = "Bem, então..."
11160-54 = "Hã..."
11160-55 = "Sério... Aconteceu tanta coisa em um único dia, não é?"
11160-56 = "É, foi muito divertido."
11160-57 = "...A única que se divertiu não foi você, Shiroko-senpai?"
11160-58 = "A-Ahahaha... Eu também me diverti."
11160-59 = "Ah, Faust-chan, muito obrigada pela ajuda, viu?"
11160-60 = "P-Por favor, pare de me chamar assim!"
11160-61 = "E aí, líder da Gangue dos Maiôs Mascarados!"
11160-62 = "Pessoal... Vocês estão deixando a Hifumi-san sem graça."
11160-63 = "D-De qualquer forma... Sei que as coisas ainda vão ser difíceis daqui pra frente, mas deem o seu melhor, tá? Estou torcendo por vocês."
11160-64 = "Então... pessoal, até a próxima."
11160-66 = "Bom trabalho a todos. Descansem bem hoje, e vamos nos reunir novamente amanhã."
11160-67 = "Dispensados~."
11160-69 = "Próximo;Nuvens Negras no Horizonte"
