[translation]
11160-2 = "Эпизод 16;Правда раскрыта"
11160-3 = "Клубная комната Комитета по предотвращению закрытия Абидоса"
11160-4 = "Вернувшись в старшую школу Абидоса, все вместе, включая Хифуми, собрались изучить документы."
11160-5 = "*БАБАХ*"
11160-6 = "Какого чёрта это такое?!"
11160-7 = "...!"
11160-8 = "Посмотрите журнал перевозок грузовика. Здесь написано: «Абидос — получено 7 880 000 иен». Это точно тот грузовик, который приезжал к нашей школе."
11160-9 = "Но сразу после этого написано: «Банда шлемов Ката-Ката — передано 5 000 000 иен на финансирование задания»."
11160-10 = "То есть получается..."
11160-11 = ""
11160-12 = "Сразу после того как они забрали наши деньги, они отвезли их прямиком на базу Банды шлемов, чтобы оплатить их задание?!"
11160-13 = "Под заданием ты имеешь в виду то, когда Банда шлемов...?"
11160-14 = "Банда шлемов действовала... по приказу «Кайзер Кредит»?!"
11160-15 = ""
11160-17 = "..."
11160-18 = "..."
11160-19 = "..."
11160-20 = "Но зачем им это? Если школа обанкротится, им никто не заплатит.#nВ этом нет никакого смысла..."
11160-21 = "Хм..."
11160-22 = "Думаю, дело гораздо серьёзнее, чем обычная банковская махинация. Единственное объяснение — штаб-квартира Корпорации «Кайзер» каким-то образом тоже замешана..."
11160-23 = "Согласна. Другого объяснения нет."
11160-27 = "Я вам всем страшно обязана! Правда, спасибо огромное за помощь."
11160-28 = "И тебе спасибо. Прости, что втянули тебя во всё это, Хифуми."
11160-29 = "Ничего страшного. Ха-ха..."
11160-30 = "Не пропадай, слышишь?"
11160-31 = "Не буду."
11160-32 = "Мы пока не знаем всех деталей, но это доказывает связь Корпорации «Кайзер» с жестокими преступными организациями."
11160-33 = "Я передам это Чаепитию!"
11160-34 = "И ещё расскажу им, насколько сильно Абидосу сейчас нужна помощь."
11160-35 = "..."
11160-36 = "Сразу предупрежу: для Чаепития это, скорее всего, уже не новость."
11160-37 = "П-правда?!"
11160-38 = "Сомневаюсь, что шишки из других академий до сих пор ничего не выяснили. Людей для разведки у них хватает."
11160-39 = "Н-но тогда они знали о вас и всё равно ничего не..."
11160-40 = "Какая же ты невинная, Хифуми.#nМир — это не только солнышко и радуга, знаешь ли."
11160-41 = "..."
11160-42 = "Я ценю твой порыв, но не знаю, будет ли от этого хоть какая-то польза.#nНаоборот, нам это может только всё усложнить."
11160-43 = "Д-думаешь...?"
11160-44 = "Наша школа стоит на грани краха. У нас нет ничего, чем можно было бы повлиять на суперакадемии#nвроде Тринити или Геенны. И почти никто уже не способен что-то изменить.#nПонимаешь, о чём я?"
11160-45 = "Если кто-то решит воспользоваться ситуацией под видом помощи... вы ничего не сможете с этим сделать."
11160-46 = "Т-теперь понимаю. Такое действительно возможно. Уф... Ненавижу политику."
11160-47 = "Тебе не кажется, что ты слишком цинична, Хошино? А вдруг они действительно просто захотят помочь?"
11160-48 = "Ой, да брось. Я старая, ворчливая, и в моём возрасте спина болит слишком сильно, чтобы кому-то доверять."
11160-49 = ""
11160-50 = "Наша школа как раз и оказалась в таком положении, потому что игнорировала все эти «а что если»."
11160-51 = "..."
11160-52 = "..."
11160-53 = "Ну..."
11160-54 = "Эм..."
11160-55 = "Просто... за такое короткое время мы столько всего пережили вместе..."
11160-56 = "Ага. Было очень весело."
11160-57 = "Весело? Говори за себя, Широко."
11160-58 = "Не знаю. Мне тоже, вроде, было весело..."
11160-59 = "Рада слышать. Спасибо тебе за всю помощь, Фауст."
11160-60 = "Н-не обязательно продолжать так меня называть!"
11160-61 = "А как тебе «бесстрашная предводительница Банды в масках и купальниках»?"
11160-62 = "Ну хватит... Не издевайтесь над Хифуми."
11160-63 = "Эм, в общем... Я знаю, впереди у вас ещё тяжёлые времена, но я буду за вас болеть. Удачи."
11160-64 = "До встречи, девочки."
11160-66 = "День был очень длинным. Может, всем разойтись по домам и хорошенько отдохнуть?#nПродолжим завтра."
11160-67 = "Все свободны!"
11160-69 = "Следующий Эпизод;Надвигается буря"
