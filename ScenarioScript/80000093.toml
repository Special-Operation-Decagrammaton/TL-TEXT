[translation]
80000093-1 = "Бесконечность..."
80000093-2 = ""
80000093-3 = "Угх... Этот документ..."
80000093-4 = "А если я не успею к сроку, Рин ужасно разозлится..."
80000093-5 = ""
80000093-6 = "После этого дальше..."
80000093-7 = "График. Куда я положила график?"
80000093-8 = "Аргх... Хотела бы я иметь запасное тело."
80000093-9 = "[s1] «Мне прекрасно знакомо это чувство...»\n[s2] «Если бы твоё тело разделилось надвое, хотя бы одна половина могла бы отдохнуть.»"
80000093-10 = "Сенсей?!"
80000093-11 = "Сенсей?!"
80000093-12 = "Простите... Вы выкроили время в своём расписании, чтобы зайти, а я в таком состоянии..."
80000093-13 = "[s] «Всё нормально! Не спеши.»"
80000093-14 = "Спасибо за добрые слова."
80000093-15 = "Но... правда всё нормально? Если я не спешу, разве я не трачу и ваше время?"
80000093-16 = "[s] «Тогда отдыхай так, чтобы не тратить время ни у кого из нас!»"
80000093-17 = "П-Простите?"
80000093-18 = "Кажется, я не понимаю. Что вы имеете в виду...?"
80000093-19 = "О? Вы уже сами не понимаете, что говорите, Сенсей?"
80000093-20 = "Может, отдых нужен не мне, а вам?"
80000093-21 = "[s] «Наверное... отдых нужен нам обоим.»"
80000093-23 = "*вздох* Хорошо. Наконец можно сделать перерыв."
80000093-24 = "Ничего страшного. Всё это мои обязанности."
80000093-25 = "И я знаю, что остальные студенты Генерального студенческого совета работают не меньше меня."
80000093-26 = "Нужно держаться!"
80000093-27 = "[s] «(Перед глазами возникает студент, жующий чипсы со вкусом тарако, но я проигнорирую это.)»"
80000093-29 = "[ns] «Вот, выпей кофе.»"
80000093-30 = "О? Вы принесли мне кофе, Сенсей?"
80000093-31 = "С-Спасибо. Он мне был нужен."
80000093-32 = "Что...?"
80000093-33 = "Как... Как вы узнали, какой кофе я пью?"
80000093-34 = "[s3] «Мы часто встречались в Генеральном ученическом совете, Аюму.»\n[s4] «Нам стоит заботиться друг о друге, ведь мы постоянно перерабатываем...»"
80000093-35 = "Я... ох... эм..."
80000093-36 = "Я... ох... эм..."
80000093-37 = "С-Спасибо, Сенсей. Я... *всхлип* Мне никто раньше такого не говорил..."
80000093-38 = "[s] «Только не плачь сейчас... Дел ещё много...»"
80000093-39 = "*всхлип* Теперь мне хочется плакать уже по другой причине."
80000093-40 = ""
80000093-41 = "[ns] «Кстати, зачем ты хотела встретиться сегодня?»"
80000093-42 = "О, точно! Да. Я почти забыла..."
80000093-43 = "Н-Но прежде чем об этом говорить, хотите что-нибудь поесть? Я хочу отплатить вам за кофе."
80000093-44 = ""
80000093-46 = ""
80000093-48 = "...О нет, это не какой-нибудь странный фрукт."
80000093-49 = "Это грейпфрут в шоколаде. Сушёные дольки грейпфрута, покрытые шоколадом."
80000093-50 = "В нём есть кофеин, теобромин и витамины, так что он должен помогать от усталости..."
80000093-51 = "Или... по крайней мере так говорят."
80000093-52 = "[s5] «Знаю. Мне знакомо это чувство...»\n[s6] «Если бы от усталости было так легко избавиться, жить было бы гораздо лучше...»"
80000093-53 = "О... *всхлип* Вы меня понимаете, Сенсей..."
80000093-54 = "О... *всхлип* Вы меня понимаете, Сенсей..."
80000093-55 = "Простите... Сегодня День святого Валентина, а я смогла дать вам только этот простой шоколад."
80000093-56 = "[s] «Это сегодня...?»"
80000093-57 = "*всхлип* У меня не было времени сбегать и купить что-то получше..."
80000093-58 = "Поэтому я смогла дать только то, что было под рукой."
80000093-59 = "В-Вы разочарованы?"
80000093-60 = "[s] «Нет. Это вкусно.»"
80000093-61 = "П-Правда?"
80000093-62 = "[s] «Ага. Сочетание сладкого и кислого отличное.»"
80000093-63 = "Спасибо!"
80000093-64 = "Я рада, что вы на моей стороне, Сенсей. Хи-хи-хи!"
80000093-66 = "Мы с Аюму ели грейпфрут в шоколаде и жаловались друг другу на объём работы."
