[translation]
2005806-1 = "Эрика, консультация"
2005806-2 = "..."
2005806-3 = "[ns] «Привет, Эрика!»"
2005806-4 = ""
2005806-6 = ""
2005806-7 = "Здравствуйте, Сенсей..."
2005806-8 = "Не ожидала, что вы так быстро сюда примчитесь. Вам нечем было заняться?"
2005806-9 = "Не хотели упустить настолько редкое событие?"
2005806-10 = "А... Наверное, я и правда почти никогда не прошу помочь мне с проблемами."
2005806-11 = ""
2005806-13 = ""
2005806-14 = "Просто подумала, что вы тот человек... которому можно доверять? На кого можно положиться?"
2005806-15 = "...Эй. Что это у вас за самодовольное лицо?"
2005806-16 = "В-В любом случае!"
2005806-17 = "Пока ждала вас, я пыталась привести мысли в порядок."
2005806-18 = "Но думала, времени будет больше, так что простите, если всё ещё говорю сумбурно."
2005806-19 = "[s] «Никакой спешки.»"
2005806-20 = "Хм..."
2005806-21 = ""
2005806-23 = ""
2005806-24 = "Хммм..."
2005806-25 = "Я просто уже некоторое время пытаюсь разобраться с одной вещью."
2005806-26 = "Мне нравится проводить время с другими людьми."
2005806-27 = "Весело быть вместе, разговаривать, ходить в караоке и всё такое."
2005806-28 = "Бывают моменты, когда..."
2005806-29 = "Бывают моменты, когда..."
2005806-30 = "...мне будто нечего больше сказать?"
2005806-31 = "А, и дело не в том, что я не нахожу общего языка с друзьями. Это проблема именно во мне."
2005806-32 = "Мне правда нравится проводить с ними время. Вместе всегда весело."
2005806-33 = "Но, ну..."
2005806-34 = "Давайте пример. Допустим, все разговаривают, и кто-то шутит."
2005806-35 = "Обычно на что-то смешное я реагирую определённым образом..."
2005806-36 = "...но в этот момент будто не могу выразить реакцию."
2005806-37 = "Будто у меня заканчивается энергия на разговор."
2005806-38 = "Но я не устала и не болею. Скорее..."
2005806-39 = "[ns] «Словно...»"
2005806-41 = "[ns] «...ты выжата?»"
2005806-42 = "Выжата...?"
2005806-43 = "[s1] «Знаешь, у каждого есть свой запас энергии.»\n[s2] «Когда он заканчивается, чувствуешь себя выжатой.»"
2005806-46 = "Вы описываете чувство, но это нелогично. Я не делаю столько, чтобы тратить всю энергию."
2005806-47 = "Даже развлечения расходуют энергию?"
2005806-48 = "Некоторые называют это «социальной батарейкой»...?"
2005806-49 = "[s3] «И тогда тебе нужно побыть одной.»\n[s4] «Время „подзарядиться“, как говорят.»"
2005806-52 = "Ого, подзарядиться? Это разве не то, что нужно интровертам?"
2005806-53 = "Я никогда не думала, что мне тоже нужна подзарядка."
2005806-54 = "Друзья делают меня счастливой, и после прогулки день всегда кажется продуктивным."
2005806-55 = "..."
2005806-56 = "Хм. Так вот что это всё это время было?!"
2005806-57 = "...Ничего себе."
2005806-58 = "Нужно это переварить."
2005806-59 = "Думаю, в ваших словах есть смысл."
2005806-60 = "Я просто человек... которому иногда нужно немного времени наедине."
2005806-61 = "[ns] «Это лишь моё мнение, но я всегда тебя такой и видел.»"
2005806-62 = "Д-Да?"
2005806-63 = "[s] «Многие наши случайные встречи происходили, когда ты была одна.»"
2005806-64 = "А, пожалуй, вы правы."
2005806-65 = "[s5] «И каждый раз ты не выглядела одинокой.»\n[s6] «Ты выглядела так, будто тебе хорошо.»"
2005806-68 = ""
2005806-70 = ""
2005806-71 = "...Ага."
2005806-72 = "Быть одной по-своему весело. И некоторые занятия лучше делать в одиночку."
2005806-73 = "Если подумать... У меня есть одно место, куда люблю приходить, когда я одна."
2005806-74 = "[s] «Что-то вроде секретной базы?»"
2005806-75 = "«Секретной базы»..."
2005806-76 = "[s] «Каждому в той или иной форме нужна своя „секретная база“.»"
2005806-77 = "А, понимаю, о чём вы."
2005806-78 = "Да. На своей базе я всегда расслабляюсь."
2005806-79 = "Я всегда считала себя экстравертом..."
2005806-80 = "Немного странно осознавать, что, возможно, это не совсем так."
2005806-81 = "[s7] «Экстраверт, интроверт...»\n[s8] «Жизнь не настолько чёрно-белая.»"
2005806-84 = "Люди многогранны?"
2005806-85 = "Под каким бы углом на меня ни смотрели, я всё равно остаюсь собой...?"
2005806-86 = "Я, которой нравится играть с друзьями, — тоже я. И та, которой нравится проводить время одной, — тоже я."
2005806-87 = "[ns9] «Важно поддерживать хорошие отношения...»\n[ns10] «...но не ценой собственного благополучия.»\n[ns11] «Никто из твоих друзей этого бы не хотел.»"
2005806-92 = "[ns] «И хорошие отношения с самой собой тоже важны.»"
2005806-93 = "Ого. Иногда в вас действительно просыпается взрослый, Сенсей."
2005806-94 = "[s] «Хаха! Потому что я и есть взрослый!»"
2005806-95 = "В любом случае рада, что поговорила с вами, Сенсей. Мне стало намного легче."
2005806-96 = "И я узнала о себе ещё кое-что. Иногда мне нужно отступить и подзарядиться."
2005806-97 = "Это определённо заставляет иначе взглянуть на себя, но не думаю, что это плохо."
2005806-98 = "[s12] «Если понадобится ещё консультация, я всегда рядом.»\n[s13] «Можешь активно мной пользоваться!»"
2005806-101 = ""
2005806-103 = ""
2005806-104 = "«Пользоваться» вами? Никогда так не думала."
2005806-105 = "Конечно, я понимаю, что вы хотите сказать..."
2005806-106 = "Но если выразиться именно так, студент с чистыми намерениями может принять это слишком лично."
2005806-107 = "[s] «А, это я неудачно сказал... Прости.»"
2005806-108 = "Ну тогда скоро запишусь к вам ещё на одну консультацию."
2005806-109 = ""
2005806-111 = ""
2005806-112 = ""
2005806-113 = "Понятно?"
2005806-114 = "[s] «Да. Обещаю.»"
2005806-115 = "Да, клянёмся на мизинцах."
2005806-116 = ""
2005806-118 = ""
2005806-119 = "..."
2005806-120 = "Как я и думала. У вас тёплые руки, Сенсей."
2005806-121 = "[s] «А у тебя мягкие руки, Эрика.»"
2005806-122 = ""
2005806-124 = ""
2005806-125 = "Кажется, к этому я тоже начинаю привыкать."
2005806-127 = "После консультации мы весело разговаривали, пока мне не пришло время уходить."
