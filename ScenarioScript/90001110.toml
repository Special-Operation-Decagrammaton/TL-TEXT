[translation]
90001110-1 = "Эпизод 11;Тупик"
90001110-2 = ""
90001110-3 = "Хорошо. Рио, что по статусу?"
90001110-4 = "Анализ нового пророка?"
90001110-5 = "Да. Провести подробный анализ отсюда не получилось. Учитывая мощность в момент появления, сигнал исчез невероятно быстро."
90001110-6 = "Могу подтвердить, что это новый пророк... совершенно не похожий на Гебуру или Хокму."
90001110-7 = "Получается, это третий пророк, которого мы встретили с момента прибытия сюда."
90001110-8 = ""
90001110-10 = ""
90001110-11 = ""
90001110-12 = "Прямо распродажа пророков."
90001110-13 = "Я хотела бы купить одного. Какова цена?"
90001110-14 = "Вы двое... Пророки закончились на складе."
90001110-15 = "Я записала координаты сигнала. Сейчас отправлю."
90001110-16 = "Довольно далеко. Мне интересно исследовать, но снова рисковать и переносить нашу базу..."
90001110-17 = "Кроме того, испустить настолько сильный сигнал... за этим может стоять злой умысел."
90001110-18 = "Будто что-то нас зовёт?"
90001110-19 = "Функционально похоже на электрическую ловушку для насекомых. Понятно."
90001110-21 = "Не могу сказать наверняка, но исключать это точно не стала бы."
90001110-22 = "[s] «Я чую скрытую ловушку!»"
90001110-23 = "Хотя для заголовков было бы героично что-то вроде: «Отряд Исследования Сверхъестественного храбро принимает вражескую ловушку и побеждает!»..."
90001110-24 = "Я против. Это иррационально и неэффективно."
90001110-25 = "Да. Я согласна с госпожой Рио."
90001110-26 = "У меня не осталось выбора. Раз никто больше не занимает сторону президента, я буду рядом с ней. Простите, госпожа Рио."
90001110-27 = ""
90001110-29 = ""
90001110-30 = "Ч-Что...?"
90001110-31 = ""
90001110-32 = ""
90001110-33 = ""
90001110-34 = "Можете не сочувствовать мне так, будто разбираете залежавшийся товар?! К тому же я вообще не предлагала ни один из вариантов!"
90001110-36 = "Тогда виноваты вы, президент. Следует представлять совету ясные и краткие предложения."
90001110-37 = "Это была попытка разрядить обстановку! Разрядить обстановку!"
90001110-38 = "ДОГОВАРИВАЮ: хотя храбро войти в ловушку звучит заманчиво, я не могу рисковать безопасностью наших участников."
90001110-39 = "Тогда используй мой AMAS."
90001110-40 = "У меня есть дрон AMAS, который я модифицировала для скоростной разведки именно на такой случай."
90001110-41 = "Я отправлю его к источнику сигнала."
90001110-42 = "Ох. Так твоя невротичная натура всё-таки иногда бывает полезна."
90001110-43 = "Я всего лишь применяю наиболее рациональный метод для этой ситуации. К чему ты клонишь?"
90001110-44 = "Забудь! Здесь мне даже рот открыть нельзя!"
90001110-46 = ""
90001110-47 = "Дрон запущен. До района ему примерно двадцать минут."
90001110-48 = "Я замедлю его, подключу видео—"
90001110-49 = "Что?!"
90001110-50 = "Проблема, госпожа Рио?"
90001110-51 = "...Я потеряла связь с дроном AMAS."
90001110-52 = "Нам нужны подробности, госпожа Рио."
90001110-53 = "Именно то, что сказала. Связь оборвалась из ниоткуда."
90001110-54 = "Но до этого он должен был успеть передать хоть какие-то данные, верно?"
90001110-55 = "Подожди. Я анализирую."
90001110-56 = "Это...?"
90001110-57 = "...Что-то не так?"
90001110-58 = "Химари. Сейчас отправлю тебе данные. Помоги проанализировать."
90001110-59 = "Для тебя крайне необычно просить моей помощи. Значит, я предполагаю..."
90001110-60 = "Да. Я искренне надеюсь, что здесь моя трактовка окажется ошибочной."
90001110-61 = ""
90001110-63 = ""
90001110-64 = ""
90001110-65 = "[ns] «Что происходит? Всё ведь нормально... правда?»"
90001110-66 = "Какого...?! Это значит...!"
90001110-67 = "...Похоже, я не ошиблась."
90001110-68 = "Да. В таком ты вряд ли ошибёшься. В конце концов, в этой области я тебя уважаю."
90001110-69 = "Что случилось, президент Химари?"
90001110-70 = "Если сразу перейти к сути, похоже, по этим координатам находится..."
90001110-71 = "...Многомерный барьер, который когда-то защищал Ковчег Атрахасиса."
90001110-72 = "[s] «Ковчег Атрахасиса...?!»"
90001110-76 = ""
90001110-77 = "Да, Сенсей. Ошибки быть не может."
90001110-78 = "Но почему здесь? И почему сейчас? Это значит... красное небо снова вернётся в Кивотос? И те странные машины?"
90001110-85 = ""
90001110-86 = "Наверное, это можно назвать хорошей стороной, но не думаю, что угроза достигла такого масштаба."
90001110-87 = "Верно. По крайней мере, в указанных координатах не видно признаков межпространственного вмешательства."
90001110-88 = "Но Многомерный барьер там есть?"
90001110-89 = "Да. Учитывая новые данные и всё, что мы уже обнаружили, я вынуждена заключить..."
90001110-90 = "...что пророки полностью погрузились в силу Безымянных богов."
90001110-91 = "Более того, они смогли использовать почти непреодолимый защитный механизм — сверхъестественное явление, превосходящее всё, с чем мы сталкивались раньше..."
90001110-92 = "Значит, они что-то здесь скрывают."
90001110-93 = "Да. Какие контрмеры сейчас нам доступны?"
90001110-94 = "В первый раз мы смогли преодолеть Многомерный барьер только благодаря Кораблю Утнапиштима, который Сенсей создал для нас."
90001110-95 = "Снова заполучить в наш арсенал сверхъестественное явление такого масштаба будет крайне трудно."
90001110-96 = ""
90001110-98 = ""
90001110-99 = "[ns] «Да... Скорее всего, так и есть...»"
90001110-100 = "Да... Трудно это признавать, но вариантов у нас мало."
90001110-101 = "Всё остальное бессмысленно, если мы не найдём способ справиться с силой Безымянных богов."
90001110-102 = "И даже если забыть про барьер, нам придётся как-то обойти способность пророков манипулировать реконструкцией материи и бесконечно восстанавливаться."
90001110-103 = "Согласна. Пусть мы и нанесли Гебуре и Хокме критические повреждения, они восстановились практически мгновенно."
90001110-104 = "Да. Благодаря реконструкции их восстановление почти моментальное."
90001110-105 = "Пророки уже способны использовать силу Безымянных богов в таком масштабе? И что нам вообще с этим делать?"
90001110-106 = "И ещё, президент, как мы можем забыть про Многомерный барьер? Даже если притворимся, что его нет, он всё равно останется у нас на пути."
90001110-107 = "[s] «Кстати, а что мы делали тогда?»"
90001110-108 = "Тогда..."
90001110-111 = "Наша основная цель — уничтожить Ковчег Атрахасис в небе над Кивотос."
90001110-114 = "Однако Ковчег защищён барьером состояния квантовой суперпозиции, из-за которого физический доступ снаружи невозможен."
90001110-115 = "Пока этот барьер существует, физически добраться до Ковчега невозможно."
90001110-117 = "Поэтому мы планировали пройти через барьер, переведя Корабль Утнапиштима в то же состояние квантовой суперпозиции."
90001110-118 = ""
90001110-119 = "Но в итоге этот способ не сработал, потому что Ковчег Атрахасиса изменил само значение состояния."
90001110-120 = "Так что в конце концов мы полагались на..."
90001110-121 = "А...!"
90001110-130 = ""
90001110-131 = "[ns] «...!»"
90001110-132 = ""
90001110-136 = "Следующий эпизод;Предложение"
