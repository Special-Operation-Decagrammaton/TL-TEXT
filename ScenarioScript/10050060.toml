[translation]
10050060-1 = "Эпизод 6;Пустое место"
10050060-4 = "Все собрались?"
10050060-5 = "Д-Да!"
10050060-6 = "Хорошо. Как вы все знаете, наша задача — разыскать и расследовать контрабандные книги, которые распространяются по Тринити."
10050060-7 = "Однако прошло уже несколько дней расследования, а мы почти не продвинулись!"
10050060-8 = "Есть..."
10050060-9 = "Только вчера Нагиса выразила серьёзную обеспокоенность состоянием этой миссии."
10050060-10 = "С-Сама Нагиса?!"
10050060-11 = "Именно... Я готова миллион раз склонить голову и извиниться за собственную некомпетентность."
10050060-12 = "Но если проблема в решимости Комитета правосудия добиваться справедливости..."
10050060-13 = "...то это угроза безопасности и целостности самого Тринити!"
10050060-15 = "Поэтому! Мы должны! Доказать, что достойны!"
10050060-16 = "П-Поняла!"
10050060-17 = "Но... что нам делать?"
10050060-18 = "У меня есть план."
10050060-19 = "Он прямолинейный, такой мог бы придумать кто угодно, но иногда, думаю, самый простой вариант — лучший."
10050060-20 = "Важно только одно: обрушить на них молот правосудия!"
10050060-21 = "Поэтому мы направим абсолютно все ресурсы Комитета на наблюдение за каждым уголком кампуса Тринити! Нет, всего района!"
10050060-22 = "Начиная с какого момента...?"
10050060-23 = "Прямо сейчас! Я знаю, что многого от вас прошу, но, пожалуйста, продолжайте стоять на страже справедливости."
10050060-24 = "Обещаю, что буду работать усерднее всех!"
10050060-25 = ""
10050060-27 = ""
10050060-28 = "П-Подождите нас, Маширо!"
10050060-29 = ""
10050060-31 = ""
10050060-32 = ""
10050060-34 = ""
10050060-35 = ""
10050060-36 = ""
10050060-40 = ""
10050060-41 = ""
10050060-42 = ""
10050060-44 = "...Сегодня мы не продали ни одной книги..."
10050060-45 = "Скорее, мы НЕ МОГЛИ."
10050060-46 = "Комитет правосудия, кажется? Студентки в чёрной форме. Почему сегодня они повсюду?"
10050060-47 = "Моё чувство опасности, которому я обязана немалой частью своего выживания в Красной Зиме, сейчас просто вопит."
10050060-48 = "Н-Неужели они нас обнаружили?"
10050060-49 = ""
10050060-53 = "Принцесса! И её служанка! Вот вы где!"
10050060-54 = "...! Д-Да, здравствуйте! Как вы?"
10050060-55 = "Служанка? Эх, ну ладно, сойдёт."
10050060-56 = "Да, спасибо. Простите за грубость, но у нас нет времени на болтовню. Ситуация критическая."
10050060-57 = "В-всё нормально. Что происходит?"
10050060-58 = "Сразу к делу: примерно половина Комитета правосудия сейчас ищет вас."
10050060-59 = "А. Значит, причина, по которой сегодня стало больше этих чёрных форм..."
10050060-60 = "Да. Всё связано с этим. И, возможно, поэтому... по Тринити будто распространяется атмосфера страха..."
10050060-61 = "Атмосфера страха...! Из-за наших действий? Я даже не знаю, как мы сможем извиниться..."
10050060-62 = "Нет, я не это имела в виду! Может, «страх» — не самое подходящее слово... Это не ваша вина, принцесса!"
10050060-63 = "...Просто сейчас всех студенток заставляют прятать любые книги, кроме учебников."
10050060-64 = "Простите, принцесса. Не думаю, что... мы больше можем открыто вам помогать."
10050060-65 = "Нет. За всю помощь до сих пор я буду вам вечно благодарна."
10050060-66 = "Бедная принцесса... Даже добравшись до Тринити, её испытания не заканчиваются... *всхлип*"
10050060-68 = "Эй, я вообще-то тоже здесь."
10050060-69 = "Вам нужно найти место, где можно спрятаться. Такое, куда членам Комитета правосудия не придёт в голову заглянуть."
10050060-70 = "У вас нет никаких идей?"
10050060-71 = "Простите... Их глаза повсюду, так что даже мы не знаем."
10050060-72 = "Но, возможно, как чужаки вы сможете заметить бреши в их защите, которых не видим мы."
10050060-73 = "Берегите себя, принцесса. Надеюсь, когда-нибудь мы сможем устроить вам в Тринити куда более приятный приём."
10050060-74 = "Не думайте так. Я и без того благодарна за прекрасные воспоминания, которые успела создать вместе с вами."
10050060-75 = "Не стоит благодарности!"
10050060-76 = ""
10050060-78 = ""
10050060-79 = ""
10050060-80 = "...Где всё пошло не так...?"
10050060-81 = "Я бы предположила, что с самого начала. Президент, то, что мы здесь делаем, вообще правильно?"
10050060-82 = "В кои-то веки у меня нет для тебя ответа. Но одно я знаю точно: всегда важно доводить дело до конца."
10050060-83 = "В зависимости от времени и места, возможно, это не всегда так уж важно."
10050060-84 = "Кхм! В любом случае! Так, место, куда Комитет не пойдёт..."
10050060-85 = ""
10050060-87 = ""
10050060-88 = ""
10050060-91 = ""
10050060-92 = ""
10050060-93 = ""
10050060-94 = "Нам нужно попасть куда-нибудь менее заметное..."
10050060-95 = "Ува-а... Вот бы Сенсей был здесь..."
10050060-99 = "Президент. Вон там. Похоже, людей там меньше, чем в других местах."
10050060-100 = "Ты права. По крайней мере, членов Комитета правосудия меньше."
10050060-101 = "Вообще место выглядит довольно пустынным."
10050060-102 = "Вот, так намного лучше."
10050060-103 = ""
10050060-111 = ""
10050060-112 = "Это... библиотека? Похоже на то."
10050060-113 = ""
10050060-115 = ""
10050060-117 = "Хотя не совсем такой я представляла современную библиотеку."
10050060-118 = "Книги старые, но за ними очень хорошо ухаживают. Даже слишком хорошо."
10050060-119 = "Значит, здесь должен быть кто-то, кто за всем следит."
10050060-120 = ""
10050060-122 = ""
10050060-123 = "А...?"
10050060-124 = ""
10050060-126 = ""
10050060-130 = ""
10050060-131 = "Таканэ? Что-то случилось?"
10050060-132 = ""
10050060-136 = ""
10050060-137 = ""
10050060-138 = "А-а-арх!"
10050060-139 = "В библиотеке тихо."
10050060-140 = ""
10050060-145 = "*вздыхает* ...Опять чужаки... Цк."
10050060-146 = "Хм?? Хотя на студенток Тринити не похожи."
10050060-147 = "И книг с собой принесли много..."
10050060-149 = "Так. Я не знаю подробностей и, честно говоря, не особо хочу знать..."
10050060-150 = "Но вы связаны с издательством и распространением...?"
10050060-151 = "Да-да. Всё верно, госпожа Козэки Уй. Простите за шум."
10050060-152 = "А, ну... Похоже, вы из наших и понимаете свою вину..."
10050060-153 = "И с вами столько детей..."
10050060-154 = "Детей...??"
10050060-155 = "А, простите. Книг. У вас много книг."
10050060-156 = "Кстати, Уй, ты ведь президент Библиотечного комитета и присматриваешь за этой старой библиотекой?"
10050060-157 = "Я слышала, что Центральная библиотека Тринити — крупнейшая библиотека Кивотоса и в ней есть все существующие книги."
10050060-158 = "Для меня большая честь увидеть такое место своими глазами."
10050060-159 = "Верно. Ты ведь хотела сюда попасть, Таканэ?"
10050060-160 = "А. Эм. Слухи немного преувеличены... но мы и правда стараемся защитить как можно больше детей..."
10050060-161 = "Ага. Понятно. Знаешь, ходят довольно безумные слухи. Например, что однажды ты сожгла целое здание, чтобы наказать студенток за просроченные книги."
10050060-162 = "Это правда."
10050060-163 = "?!"
10050060-164 = "Учитывая обстоятельства, я была милосердна. Эти чужаки совершенно не уважали святость литературы."
10050060-165 = "В любом случае, ваши дети... Мне понравились."
10050060-166 = "Они хорошо сделаны. Мне понравились."
10050060-167 = "Н-Но это ведь просто манга, разве нет?"
10050060-168 = "...? Я разве не глазами её читала? С чего бы это не книга?"
10050060-170 = "И-и судя по реакции студенток Тринити, есть некоторые проблемы с тем, насколько она откровенная...?"
10050060-171 = "Вот как? Ну... Полагаю, со стороны некоторые моменты и правда могут так восприниматься."
10050060-172 = "Просто никто из них на самом деле не читает. Иначе для них это не было бы таким культурным шоком."
10050060-173 = "...В любом случае, судя по тому, что вы говорили раньше, Комитет правосудия активно вас преследует?"
10050060-174 = "Да. К сожалению..."
10050060-175 = "Комитет правосудия никогда бы сам по себе не бросил столько людей на такую мелочь."
10050060-176 = "..."
10050060-177 = "...Это должно быть Чаепитие."
10050060-178 = "Ч-Что? Я даже их не упоминала!"
10050060-179 = "Это очевидно..."
10050060-180 = "Эти занудные руководители... Они никогда не понимали истинной ценности литературы."
10050060-181 = "Ладно. Можете остаться здесь. Я потерплю. В разумных пределах."
10050060-182 = "В-Вас не будет отвлекать наше присутствие?"
10050060-183 = "...Только потому, что вы из наших. Не придавайте этому слишком большого значения. И не задерживайтесь надолго."
10050060-184 = "Ух ты, спасибо, Уй. Тогда мы просто немного переведём дух и перегруппируемся здесь."
10050060-185 = "И ещё кое-что."
10050060-186 = "А-А?"
10050060-187 = "Вы слишком близко. Отойдите. Минимум на три метра."
10050060-189 = "Н-Но мы ведь не...?"
10050060-190 = "Я вас выгоню."
10050060-191 = "...Поняла. Три метра. Правила соблюдать можем."
10050060-192 = "Это не строгое правило библиотеки. Скорее личное..."
10050060-193 = "А? Что ты сказала, Уй?"
10050060-194 = "...Три метра."
10050060-195 = "Д-Да..."
10050060-196 = ""
10050060-198 = ""
10050060-199 = "Президент, это правда нормально...?"
10050060-200 = "Ну, вечно мы здесь оставаться не можем."
10050060-201 = "Но прямо сейчас вариантов у нас почти нет."
10050060-202 = "Что делать?"
10050060-203 = "Раз Уй ещё немного нас потерпит, подождём здесь, пока снаружи всё не утихнет. А пока придумаем план побега и возвращения в Красную Зиму."
10050060-204 = ""
10050060-206 = ""
10050060-207 = "Ах, опять этот взгляд. Я знаю, ситуация не идеальная."
10050060-208 = "Но в жизни иногда приходится просто идти по дороге из жёлтого кирпича, Таканэ."
10050060-209 = "...Я немного отдохну внутри. Сообщите мне, если что-нибудь изменится."
10050060-210 = ""
10050060-212 = ""
10050060-213 = "Я знаю, что сказала Президент, но всё же."
10050060-214 = "Бу-у. А я-то надеялась связаться с ними по куда более эффектному и достойному поводу..."
10050060-215 = ""
10050060-220 = "[ns] «А? Этот номер...»"
10050060-221 = ""
10050060-222 = "А, здравствуйте, Сенсей. Как вы?"
10050060-223 = "Причина, по которой я так внезапно связалась с вами..."
10050060-224 = "Ух, с чего вообще начать...?"
10050060-225 = "[s] «Ничего страшного. Обычно начало — неплохое место.»"
10050060-226 = "Хорошо... Для начала, сейчас мы находимся в Тринити..."
10050060-227 = "[s] «А? Я тоже здесь!»"
10050060-228 = "Что?! Вы тоже?!?!"
