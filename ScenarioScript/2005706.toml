[translation]
2005706-1 = "Лучший способ уборки"
2005706-3 = "...Так что после долгих размышлений единственным логичным выводом оказалось использование установленных блочных бомб—"
2005706-4 = "[s] «Стоп! У меня вопрос! Когда ты вообще успела их установить?»"
2005706-5 = "Естественно, сразу после начала этой миссии."
2005706-6 = "[s1] «(Значит, она с самого начала собиралась всё взорвать!)»\n[s2] «(...Наверное, лучше не говорить это вслух.)»"
2005706-9 = "Мы закончили уборку без каких-либо проблем."
2005706-10 = "Однако поступили жалобы на чрезмерные расходы на ремонт после наших миссий."
2005706-11 = "Президент отмахнулась, но нельзя вечно заметать финансовые вопросы под ковёр."
2005706-12 = "И на более личном уровне я склонна возвращаться к привычным методам, когда сталкиваюсь с... стойкими пятнами."
2005706-13 = "Мне бы не хотелось прослыть определённым типом уборщицы."
2005706-14 = "[s] «(Значит, она ВСЁ-ТАКИ понимает...)»"
2005706-15 = "Как мне лучше поступить, Сенсей?"
2005706-16 = "Я правда хочу действовать настолько мягко и мирно, насколько возможно."
2005706-23 = ""
2005706-24 = ""
2005706-26 = "Ох-ох. Что нам делать? Мы ведь совершенно невиновны..."
2005706-28 = "Надо было понимать, что даже приближаться к Чёрному рынку не стоило..."
2005706-29 = "Но я не думала, что мы станем ЗАЛОЖНИКАМИ..."
2005706-31 = "Заткнуться! Кто разрешал вам разговаривать?"
2005706-32 = "Если продолжите меня раздражать, я возьму вот эти штуки..."
2005706-33 = "...эти Щекотные патроны и буду стрелять по вашим слабым местам, пока не умрёте!!"
2005706-34 = ""
2005706-36 = ""
2005706-37 = "Пожалуйста... Нет...! Это жестокое и необычное наказание!"
2005706-38 = "Эм... Сенсей...?"
2005706-39 = "[s] «Я правда, правда не понимаю, как мы сюда попали...»"
2005706-40 = "Это моя вина, что не смогла как следует вас защитить... Прошу прощения."
2005706-41 = "[s] «Нет-нет. Безопасность мирных людей всегда должна быть приоритетом.»"
2005706-44 = ""
2005706-45 = "Сдавайтесь! Вы окружены! Чем хуже состояние заложников, тем суровее будет приговор!"
2005706-48 = "Что делать, босс?"
2005706-49 = "Назад пути нет! Идём до конца!"
2005706-50 = "Слышали, копы из Валькирии?! Если ВЫ не сдадитесь и не выполните наши требования, больше этих заложников не увидите!"
2005706-51 = ""
2005706-53 = ""
2005706-55 = "Сенсей..."
2005706-56 = "[s3] «Да, Аканэ...»\n[s4] «Похоже, это работа для C&C!»"
2005706-59 = "Да."
2005706-60 = "..."
2005706-61 = "Но способом, отличным от моего обычного подхода, верно?"
2005706-63 = ""
2005706-65 = ""
2005706-66 = "Эм..."
2005706-67 = "Чего тебе?"
2005706-68 = "Я не могла не заметить, что вы ведёте обмен словами с добрыми людьми из Валькирии."
2005706-69 = "Возможно, небольшая уступка поможет продвинуть переговоры."
2005706-70 = "Что ты сказала?"
2005706-71 = "Ты что, не знаешь любимую фразу этих придурков? «Мы не ведём переговоров с террористами!»"
2005706-72 = "Так вот знаешь что?! Мы тоже с копами не торгуемся! Они при первой возможности воткнут нож в спину."
2005706-74 = "Назад!"
2005706-75 = "А-ха-ха..."
2005706-76 = "[s] «(Похоже, легко всё равно не будет.)»"
2005706-79 = "Знаете, у меня есть знакомая в Валькирии. Возможно, я могла бы с ней связаться?"
2005706-80 = "Думаю, мы смогли бы договориться на условиях, выгодных всем сторонам."
2005706-81 = "Тебе легко говорить, но я знаю: при первой возможности ты нас сдашь."
2005706-82 = "Достаточно одного взгляда на тебя. Всё написано на лице!"
2005706-83 = "Моё лицо... Понятно..."
2005706-84 = "[s] «(Что вообще не так с её лицом?!)»"
2005706-87 = ""
2005706-88 = "Ну... В долгосрочной перспективе вам лучше сдаться и надеяться на снисхождение, не так ли?"
2005706-89 = "И-и как это будет выглядеть перед организацией? Все нас осудят!"
2005706-90 = "Ух! Почему я вообще обсуждаю это с какой-то случайной гражданской?"
2005706-91 = ""
2005706-93 = ""
2005706-94 = "[ns] «(Если разозлить Аканэ, репутация будет последней из ваших проблем...)»"
2005706-97 = "Валькирия хочет лишь, чтобы всё закончилось спокойно. Так они работают."
2005706-98 = "Если вы готовы на обмен..."
2005706-99 = "ОБМЕН?!"
2005706-100 = "Ни за что! Либо они выполняют наши требования, либо никакой сделки!"
2005706-101 = "В конце концов, вы теперь на НАШЕЙ территории! Никто на Чёрном рынке не прогнётся под каких-то шишек из Валькирии!"
2005706-102 = "Ты на самом деле просто идиотка? Идиотка среди идиоток?"
2005706-103 = "Хаха, ахаха..."
2005706-104 = "[s] «(Ах вы мелкие...!)»"
2005706-111 = "Темнеет, Сенсей."
2005706-112 = "[s] «Да.»"
2005706-113 = "Завтра учебный день, а я ещё не закончила домашнее задание..."
2005706-114 = "[s] «А для ученика нет ничего важнее учёбы.»"
2005706-115 = "Уверена, у вас тоже полно работы..."
2005706-116 = "Что же делать...?"
2005706-117 = "[s] «Аканэ.»"
2005706-118 = "Хорошо, Сенсей."
2005706-119 = "[s] «Проучи их.»"
2005706-120 = "А?"
2005706-121 = ""
2005706-123 = ""
2005706-124 = "..."
2005706-125 = "Точно?"
2005706-126 = "[s5] «Если все варианты исчерпаны...»\n[s6] «Иногда в жизни приходится пробивать себе дорогу силой.»"
2005706-129 = "Поняла."
2005706-130 = "Господин."
2005706-131 = ""
2005706-133 = ""
2005706-136 = ""
2005706-137 = ""
2005706-139 = ""
2005706-140 = ""
2005706-142 = ""
2005706-143 = ""
2005706-144 = ""
2005706-150 = "И-И-И-К?!"
2005706-151 = "Ч-Что происходит?! Что это вообще такое?!"
2005706-152 = ""
2005706-157 = "Б-Бежим! Эта девчонка слетела с катушек!"
2005706-158 = ""
2005706-161 = "Не бросай меня! А-А-А-А!"
2005706-162 = ""
2005706-168 = "В-Валькирия! Эй! Спасите нас! Мы сдаёмся! Сдаёмся без условий!"
2005706-169 = "Только защитите нас от той девушки!"
2005706-172 = ""
2005706-173 = ""
2005706-175 = "Фух."
2005706-176 = "Бомбы и правда лучший способ уборки."
