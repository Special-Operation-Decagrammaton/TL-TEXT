[translation]
10029040-1 = "Эпизод 4;Время летит"
10029040-2 = "На следующее утро..."
10029040-3 = ""
10029040-7 = "...Принято."
10029040-8 = "Мы прибыли к месту встречи, Президент. Это то здание, о котором вы говорили."
10029040-9 = "Похоже, никто не потерялся."
10029040-10 = "Подтверждаю. Продолжаем спуск в подвал, как и было приказано."
10029040-11 = "Когда вы уйдёте глубоко под землю, мне будет трудно с вами связаться."
10029040-12 = "С нами всё будет в порядке. Я уже бывала там. Примерно представляю, где находится объект."
10029040-13 = ""
10029040-15 = ""
10029040-16 = "Вид у этого места и правда жутковатый... Ты одна тащила нас отсюда всю дорогу назад?"
10029040-17 = "Ты правда сделала это, пока мы были без сознания...? Теперь мне даже немного неловко..."
10029040-19 = "Ничего особенного. Это я сама решила вас забрать."
10029040-20 = "Она права. К тому же благодарность всегда приятнее извинений."
10029040-21 = "Когда я увидела, как вы втроём свалились от усталости после такого весёлого дня в Кивотосе, я даже немного загордилась как представитель этого мира."
10029040-22 = "..."
10029040-23 = "Должна предупредить: на пути вниз сопротивления, скорее всего, будет больше, чем было на пути наверх."
10029040-24 = "Кстати, Эйми. Есть ещё кое-что, что тебе нужно знать об этом объекте."
10029040-25 = "...Что именно?"
10029040-26 = "Я обнаружила энергетический сигнал из подвала. Полагаю, система безопасности настроена переходить в усиленный режим при обнаружении нарушителей."
10029040-27 = "Вы можете столкнуться с дронами, а сам маршрут может даже измениться."
10029040-28 = "Не проблема. Я уже сталкивалась с подобными препятствиями."
10029040-29 = "В этом я не сомневаюсь. Но если бы дело было только в этом, я бы не стала так тебя предупреждать."
10029040-30 = "Есть что-то ещё?"
10029040-31 = "Да. Этот объект способен осуществлять перенос. Опасаться вам стоит не дронов, а скорее..."
10029040-33 = "...того, что вас может перемешать во времени и пространстве."
10029040-34 = "Перемешать во времени и пространстве...? На обычное дело это не похоже."
10029040-35 = "Это ещё мягко сказано. Мы здесь именно из-за этой проблемы..."
10029040-36 = "Пока объект тих, но... Если система безопасности включится, есть риск перегрузки самого комплекса."
10029040-37 = "Иными словами, весь объект может активироваться, а это повышает вероятность непредвиденных происшествий..."
10029040-38 = "Ты хочешь сказать, что после включения объекта есть шанс, что нас перенесёт куда-то ещё? Понятно."
10029040-39 = "[s1] «Спасибо за простое объяснение.»\n[s2] «Даже я всё поняла, Утаха—»"
10029040-40 = ""
10029040-41 = ""
10029040-43 = "[ns3] «Утаха?! И остальные из Инженерного отдела?!»\n[ns4] «Что вы здесь делаете?!»"
10029040-46 = "Если ты так говоришь, Сенсей, можно подумать, что ты совсем не рад нас видеть."
10029040-47 = "Неужели вы правда думали, что сможете оставить нас в стороне от чего-то настолько захватывающего—"
10029040-48 = ""
10029040-50 = ""
10029040-51 = "То есть, настолько важного! К тому же что, если вам понадобится помощь с ремонтом этой загадочной техники?"
10029040-52 = "Простите, но вы только что назвали это захватывающим—"
10029040-53 = "Не цепляйся к мелочам. Мы здесь, чтобы помочь."
10029040-54 = "Ремонт — наша специализация. Да и разве лишняя пара рук не пригодится, если возникнут проблемы?"
10029040-55 = "Именно! Всё ваше оружие сделали мы, так что если что-нибудь выйдет из строя, чинить это должны именно мы!"
10029040-56 = "Хотя никаких неисправностей не будет!"
10029040-58 = "...Может, только непредвиденные побочные эффекты, но никаких неисправностей!"
10029040-59 = "Погоди, что значит—"
10029040-60 = "Нет, сначала другое. Вы все сделали этот пистолет? Но вы же выглядите как студенты..."
10029040-61 = "Ну, чем больше народу, тем веселее. Они наверняка знают об этом месте больше нашего."
10029040-62 = "Кто мы такие, чтобы отказываться от помощи людей, которые действительно здесь живут?"
10029040-63 = "...Хм."
10029040-64 = "Хочешь что-то добавить, Шокухо?"
10029040-65 = "Нет, вовсе нет. Я просто подумала, что вы сегодня непривычно в хорошем настроении, мисс Мисака."
10029040-66 = "Ничего подобного. Просто не хочу тратить время на бессмысленные споры."
10029040-67 = "А? У вас вопрос, Сенсей?"
10029040-68 = "Кажется, будто я жду не дождусь драки? Какая глупость. Не то чтобы мне хотелось сражаться."
10029040-69 = "Просто... Эйми нашла нас здесь и одна отнесла в безопасное место."
10029040-70 = "И ещё заказала для нас оружие, чтобы мы не выделялись... И даже сейчас остаётся с нами."
10029040-71 = "Но если подумать, это вообще никогда не было её проблемой. С самого начала это была наша проблема."
10029040-73 = "Верно! И хотя это был всего один день, Сенсей специально нашёл время устроить нам экскурсию!"
10029040-74 = "Визит был коротким, но я отлично провела время!"
10029040-75 = "Мы должны помочь всем, чем сможем! Как товарищи по попаданию в другой мир!!"
10029040-76 = "Последний довод, кажется, вообще ни к селу ни к городу, но..."
10029040-77 = "[s5] «Я рад, что вам всем понравилось.»\n[s6] «Я тоже отлично провёл время. Было здорово развеяться.»"
10029040-80 = "...Я к тому, что после всего, что вы для нас сделали, мне совсем не хочется просто сидеть сложа руки. Вот и всё."
10029040-81 = "Хм. Пожалуй."
10029040-82 = "Такое бывает нечасто, но тут я с вами согласна. Я тоже не люблю оставаться в долгу."
10029040-83 = "Хи-хи. Я рада слышать это от вас всех. Мне от этого хоть немного спокойнее."
10029040-84 = "Я отправляю вам схему объекта, а затем отключаю связь. Желаю удачи."
10029040-85 = "И ещё, Сенсей."
10029040-86 = "Не думаю, что произойдёт что-то серьёзное, но... будьте осторожны."
10029040-87 = "Перемещение — понятие широкое. Само по себе оно не опасно, но я не хочу, чтобы вас застало врасплох что-нибудь неожиданное."
10029040-88 = "[s7] «Не волнуйся. Можешь мне доверять.»\n[s8] «В конце концов, я же супер-гениальный Сенсей!»"
10029040-89 = "Хи-хи... Хорошо."
10029040-90 = "..."
10029040-91 = "Хорошо. Отправляю схему."
10029040-92 = "...Удачи вам всем."
