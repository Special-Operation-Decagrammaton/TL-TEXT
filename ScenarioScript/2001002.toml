[translation]
2001002-1 = "Тренировка на горячих источниках: кайсэки"
2001002-2 = "Жилой корпус Шале"
2001002-3 = "Когда я вернулся в жилой корпус, меня ждала Нодока, одетая как хозяйка гостиницы при горячих источниках."
2001002-4 = "Добро пожаловать, Сенсей. Я вас ждала."
2001002-5 = "Хорошая работа сегодня."
2001002-6 = ""
2001002-8 = ""
2001002-9 = ""
2001002-11 = "Давайте я возьму вашу верхнюю одежду. Повешу её в шкаф, чтобы она не помялась."
2001002-12 = "[s] «...Что ты делаешь?»"
2001002-13 = "Я ведь говорила вам об этом раньше в MomoTalk, разве нет? Я прохожу тренировку на горячих источниках."
2001002-14 = "Пока курорт с горячими источниками № 227 восстанавливают, я освою все навыки хозяйки гостиницы, чтобы в следующий раз суметь управлять идеальным курортом!"
2001002-15 = "Но хоть я и хочу тренироваться, в Академии Красной Зимы больше нет подходящих горячих источников, а в Академию Геенны я тоже пойти не могу..."
2001002-16 = "Поэтому вместо этого я решила проходить тренировку на горячих источниках в жилом корпусе Шале!"
2001002-17 = "[s1] «Это вообще не тот случай, где подходит „поэтому вместо этого“.»\n[s2] «Почему ты хочешь тренироваться в Шале?»"
2001002-18 = "В жилом корпусе Шале есть не только кровати, но и кухня с ванной!"
2001002-19 = "В жилом корпусе Шале есть не только кровати, но и кухня с ванной!"
2001002-20 = "Это идеальное место для моей тренировки на горячих источниках!"
2001002-21 = "К тому же это отличный повод поближе увидеть Сенсея с более уязвимой стороны... *тяжело дышит* *тяжело дышит*"
2001002-22 = "Ах! З-Забудьте, что я это сказала!"
2001002-23 = "В-В любом случае, вы уже ужинали?"
2001002-24 = "Если вы не против, сегодня я приготовлю нам ужин в рамках тренировки на горячих источниках!"
2001002-25 = "Сегодня я приготовлю..."
2001002-26 = "Настоящий кайсэки, которым можно насладиться только в дорогих рёканах!"
2001002-27 = "[s3] «Кайсэки?!»\n[s4] «Ты уверена, что можешь приготовить что-то настолько дорогое?»"
2001002-28 = "Всё в порядке. Я заранее накопила на все ингредиенты!"
2001002-29 = "Всё в порядке. Я заранее накопила на все ингредиенты!"
2001002-30 = "Нельзя экономить на ингредиентах, если хочешь управлять роскошным курортом с горячими источниками!"
2001002-31 = "Ужин скоро будет готов, пожалуйста, подождите!"
2001002-32 = ""
2001002-34 = ""
2001002-38 = ""
2001002-39 = "Спасибо за ожидание, Сенсей. Ваш кайсэки готов."
2001002-40 = "Начнём с закуски, чтобы подготовить ваши вкусовые рецепторы."
2001002-41 = "Первое блюдо, приготовленное из дорогой тарако, — это..."
2001002-42 = "...кукурузная палочка!"
2001002-43 = "[s] «...Кукурузная палочка?»"
2001002-44 = "Да! Кукурузные палочки — высококачественная закуска, которую трудно достать в Бывшем институте."
2001002-45 = "Не знаю почему, но солёные кукурузные палочки всегда только сильнее разжигают аппетит... Поэтому я решила, что это идеальная закуска!"
2001002-46 = "Ну же, Сенсей. Скорее ешьте, пока она не размокла!"
2001002-47 = ""
2001002-51 = "Ваши вкусовые рецепторы уже проснулись?"
2001002-52 = "[s5] «Ну... это всё-таки кукурузная палочка.»\n[s6] «На вкус... неплохо.»"
2001002-53 = "Хи-хи, я рада, что вам понравилось."
2001002-54 = "Хи-хи, я рада, что вам понравилось."
2001002-55 = "Переходим к следующему блюду."
2001002-56 = ""
2001002-58 = ""
2001002-59 = ""
2001002-61 = ""
2001002-62 = "На этот раз — суп!"
2001002-63 = "Сегодня холодно, поэтому я приготовила прозрачный суп на насыщенном говяжьем бульоне."
2001002-64 = "[s] «Выглядит и пахнет довольно неплохо.»"
2001002-65 = "Да, я использовала особую секретную приправу!"
2001002-66 = "Попробуйте, пока не остыло!"
2001002-67 = ""
2001002-72 = "[ns7] «...И на что это вообще должно быть похоже по вкусу?»\n[ns8] «Солёное и сладкое одновременно!»"
2001002-75 = "Ой? Вам не нравится?"
2001002-76 = "Странно. Я сварила дорогую кукурузную палочку со вкусом кукурузного супа, чтобы сделать вкус насыщеннее."
2001002-77 = "Может, стоило сварить кукурузную палочку со вкусом карри."
2001002-78 = "[s] «Проблема тут не во вкусе.»"
2001002-79 = "И наконец — десерт, чтобы освежить вкус!"
2001002-80 = ""
2001002-82 = "На десерт я приготовила..."
2001002-83 = "Кукурузную палочку со вкусом лимона!"
2001002-84 = "[s] «Опять кукурузная палочка?!»"
2001002-85 = "Да, я разошлась и купила огромный набор кукурузных палочек."
2001002-86 = "В одном наборе целых 10 вкусов! Какое роскошное разнообразие."
2001002-87 = "Я немного вышла за бюджет, покупая столько дорогих закусок, но гости моего курорта того стоят!"
2001002-88 = "[s] «...»"
2001002-91 = "Ну как, Сенсей? Вы довольны кайсэки, который я сегодня вам подала?"
2001002-92 = "Хи-хи, похоже, от его великолепия у вас просто отняло речь."
2001002-93 = "Возможно, курорт с горячими источниками № 227 станет новым раем для гурманов!"
2001002-95 = "(После этого я отвёл Нодоку в город и угостил её настоящим кайсэки на ужин.)"
2001002-96 = "(Попробовав настоящий кайсэки, Нодока была настолько потрясена, что на некоторое время совсем потеряла аппетит.)"
