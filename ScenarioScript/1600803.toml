[translation]
1600803-1 = "Патруль ленивого полицейского"
1600803-2 = "Фубуки была не в духе, поэтому я отправился в центр города, чтобы её подбодрить."
1600803-3 = ""
1600803-5 = ""
1600803-6 = ""
1600803-7 = ""
1600803-8 = "*вздыхает*..."
1600803-9 = "На улице слишком жарко, ноги болят. Не хочу я это делать..."
1600803-10 = "Я просто хочу вернуться в офис, залезть под кондиционер,#nпоесть пончиков и выпить кофе."
1600803-11 = "[s1] «Да ладно. Всё не так уж плохо.»\n[s2] «Патрулирование — часть учёбы в „Валькирии“.»"
1600803-12 = "Но участок, который мне дали, слишком огромный, а эти переулки — настоящий лабиринт."
1600803-13 = "Но участок, который мне дали, слишком огромный, а эти переулки — настоящий лабиринт."
1600803-14 = "Уйдёт весь день, чтобы прочесать здесь каждый закоулок."
1600803-15 = "[s] «Не унывай. Поэтому я и пришёл помочь.»"
1600803-16 = "Правда? Тогда можете оказать мне услугу?"
1600803-17 = "Это Первая улица. Можете пропатрулировать все переулки до Пятой улицы?"
1600803-18 = "А, и ещё можете проверить другую сторону улицы?"
1600803-19 = "[s] «А ты тем временем что будешь делать?»"
1600803-20 = "Я? Я, эм..."
1600803-21 = "Я посижу в этом кафе и посмотрю, не пройдёт ли кто-нибудь подозрительный!"
1600803-22 = "[s] «Другими словами, ты просто сваливаешь свою работу на меня.»"
1600803-23 = "Ладно, ладно. Вы меня поймали."
1600803-24 = "Вы мне особо выбора не оставляете. Я знаю, что могли бы сегодня отдыхать, но вместо этого пришли работать. Ладно уж, один раз побуду хорошей девочкой и пойду патрулировать."
1600803-25 = "Только, ради всего хорошего в Кивотосе, пусть на моём участке ничего не случится..."
1600803-26 = ""
1600803-28 = ""
1600803-29 = "*вздох* Ну, была не была."
1600803-30 = ""
1600803-32 = ""
1600803-34 = ""
1600803-35 = "В этом переулке чисто. Ничего необычного."
1600803-36 = "Сегодня город довольно спокойный. Не понимаю, почему начальство всегда устраивает такую суету вокруг патрулей."
1600803-37 = "Они думают, что весь мир кишит проблемными студентами и конфликтами, но это лишь потому, что сами не умеют расслабляться."
1600803-38 = ""
1600803-40 = ""
1600803-41 = "А? Почему вы остановились посреди улицы, Сенсей?"
1600803-42 = "[s] «Те студенты в переулке ведут себя подозрительно.»"
1600803-43 = ""
1600803-45 = ""
1600803-46 = "Это кого ты назвал подозрительными?!"
1600803-47 = "Ты нас вообще не знаешь! Следи за языком."
1600803-48 = "А теперь вали, если не хочешь, чтобы мы тебе кости переломали!"
1600803-49 = ""
1600803-51 = ""
1600803-52 = ""
1600803-53 = "(Уф. Вот этого мне только не хватало.)"
1600803-54 = "Хаха... Они выглядят довольно крутыми, да?"
1600803-55 = "Хотя я не заметила, чтобы они делали что-то подозрительное."
1600803-56 = "Похоже, просто пара подруг тусуется в обычном глухом переулке."
1600803-57 = "Давайте проигнорируем их и продолжим патруль."
1600803-58 = "[s] «Что это у них во рту?»"
1600803-59 = "Э-Это? Это, должно быть, эм..."
1600803-60 = "...леденцы! Да, точно леденцы."
1600803-61 = "Девочки есть девочки, понимаете? Студенты нашего возраста обожают сладкое.#nНаверное, просто едят конфеты в переулке!"
1600803-62 = "Ладно, оставим их в покое. Нам пора!"
1600803-63 = "[s] «У этой конфеты горит кончик. И дым идёт...»"
1600803-64 = "Ну, эм..."
1600803-65 = "О-Острые!"
1600803-66 = "Наверное, это те острые конфеты, которые сейчас всем нравятся.#nСладкое и острое — отличное сочетание, знаете ли."
1600803-67 = "Наверное, они настолько острые, что даже жар видно у самого кончика."
1600803-68 = "[s] «Но...»"
1600803-69 = "Чего вы так переживаете? Они не подозрительные!"
1600803-70 = "Не стоит судить книгу по обложке, Сенсей.#nПредубеждение заставляет всё вокруг казаться подозрительным —#nдаже камешек на дороге!"
1600803-71 = ""
1600803-75 = ""
1600803-76 = "Вы... серьёзно считаете, что мы не подозрительные?"
1600803-77 = "К-Конечно! Здесь совершенно ничего необычного не происходит."
1600803-78 = "Не нужно тратить время на бесконечные вопросы или тащить вас в участок, понимаете?"
1600803-79 = "Ничего себе. Ты первый человек, который оказался достаточно добрым, чтобы не подозревать нас сразу."
1600803-80 = "Я думала, Полицейская школа «Валькирия» забита идиотами, которые только и хотят всем портить жизнь..."
1600803-81 = "...но ты нас понимаешь! Я сейчас расплачусь! *хнык*"
1600803-82 = "Погодите, ч-что...?"
1600803-83 = ""
1600803-85 = ""
1600803-86 = "Все только и делают, что записывают нас в преступницы, даже не пытаясь понять, кто мы такие."
1600803-87 = "Из-за этого нам лишь сильнее хотелось бунтовать против системы и делать всякие плохие вещи."
1600803-88 = "Но после твоих слов мы вспомнили, что на самом деле вовсе не плохие люди!"
1600803-89 = "Мы хотим делать для общества хорошие вещи, как и ты!"
1600803-90 = ""
1600803-93 = ""
1600803-94 = "Х-Хаха... Это, эм, здорово. Рада за вас."
1600803-95 = "Мне пора возвращаться к патрулю. Почему бы вам, эм, не пособирать мусор на улице?"
1600803-96 = ""
1600803-97 = "Ты сказала «патруль»? Мы можем помочь!"
1600803-98 = ""
1600803-99 = "Ага, мы знаем эти улицы лучше кого угодно!"
1600803-100 = ""
1600803-101 = "Мы мигом всё здесь проверим!"
1600803-102 = "[s3] «Вот это да, Фубуки!»\n[s4] «Ты и правда смогла до них достучаться!»"
1600803-103 = "Уф. Да вы издеваетесь..."
1600803-104 = "Уф. Да вы издеваетесь..."
1600803-106 = "Фубуки ничего не оставалось, кроме как патрулировать улицы вместе с двумя бывшими нарушительницами, которых мы встретили."
1600803-107 = "Они настолько рьяно взялись помогать, что патруль закончился гораздо позже, чем хотелось Фубуки."
