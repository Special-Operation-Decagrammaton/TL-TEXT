[translation]
1002302-1 = "Чего не стоит делать на пляже"
1002302-2 = "Я направляюсь в штаб Дисциплинарного комитета, чтобы передать Иори то, о чём она просила."
1002302-4 = ""
1002302-5 = "Префектурная команда Геенны"
1002302-6 = ""
1002302-7 = ""
1002302-8 = "О, Сенсей. Ты пришёл."
1002302-9 = "[s] «Я принёс солнцезащитный крем, который ты просила.»"
1002302-10 = "Одной заботой перед летним лагерем меньше."
1002302-11 = "Спасибо за помощь, Сенсей."
1002302-12 = "Теперь я могу снова сосредоточиться на документах, которые нужно разобрать до отъезда."
1002302-13 = ""
1002302-15 = ""
1002302-17 = "[ns] «Похоже, ты занята.»"
1002302-18 = "Ну, из-за лагеря старосте придётся на некоторое время покинуть кампус."
1002302-19 = "Поэтому нужно написать подробные инструкции, чтобы студенты не пытались искать лазейки в правилах, пока нас не будет."
1002302-20 = "Обычно этим занимается Хина, но в последнее время она по горло занята нарушителями порядка."
1002302-21 = "Так что мы с остальными членами Дисциплинарного комитета разделили её обязанности между собой, чтобы снизить нагрузку."
1002302-22 = "[s] «Я могу чем-нибудь помочь?»"
1002302-23 = "Нет. Я почти со всем закончила, дальше справлюсь сама."
1002302-24 = "Осталось только окончательно утвердить новые правила для летнего лагеря."
1002302-25 = "[s] «Новые правила?»"
1002302-27 = "Да. Мы не можем просто использовать в лагере те же правила, что и в школе."
1002302-28 = "Например, на пляже нужно носить купальник вместо школьной формы, а взрывчатку, чувствительную к влаге, использовать нельзя. Всё совсем не так, как в кампусе."
1002302-29 = "И хотя некоторые вещи очевидны, есть и такие, которые обычный студент может просто не знать."
1002302-30 = "Вообще-то в подобных вопросах мне бы пригодился твой совет, Сенсей."
1002302-31 = "Чего студенту не следует делать на пляже?"
1002302-32 = "[s1] «Карманные кражи.»\n[s2] «Вооружённые ограбления.»"
1002302-33 = "Да, хорошее замечание..."
1002302-34 = "Да, хорошее замечание..."
1002302-35 = "Да ещё чего! Я говорю о менее очевидных вещах!"
1002302-36 = "Что люди подумают об академии Геенна, если нашим студентам приходится напоминать такие элементарные правила?"
1002302-37 = "Приведи примеры нарушений, которые студенты могут совершить по незнанию."
1002302-38 = "[s3] «Закапывать мины в песок?»\n[s4] «Взрывать недвижимость на берегу?»"
1002302-39 = "Ты думаешь, так легко просто ходить и закапывать мины, Сенсей?"
1002302-40 = "Ты думаешь, так легко ходить и взрывать чужую собственность, Сенсей?"
1002302-41 = "Хватит шутить и отнесись к этому серьёзно!"
1002302-43 = ""
1002302-44 = "От тебя совсем никакой помощи."
1002302-45 = "Как ты вообще представляешь себе обязанности Дисциплинарного комитета?"
1002302-46 = "*вздох* Изначально моей ошибкой было рассчитывать на Сенсея [USERNAME]."
1002302-47 = "Потому что [USERNAME] — безнадёжный извращенец и жалкий взрослый."
1002302-48 = "[s5] «Это уже немного жестоко...»\n[s6] «А теперь скажи это с более надутым лицом.»"
1002302-50 = "Нет. Я злюсь."
1002302-51 = ""
1002302-53 = "(Погоди. Может, чтобы понять извращенца, нужно думать как извращенец.)"
1002302-54 = "(Если попробовать реконструировать ход мыслей Сенсея...)"
1002302-55 = ""
1002302-57 = "Эй, Сенсей. Если бы на пляже тебе разрешили делать всё что угодно, что бы ты сделал в первую очередь?"
1002302-58 = "[s] «Я бы фотографировал девушек в купальниках.»"
1002302-59 = "Надо было догадаться. Ты такой жалкий..."
1002302-60 = "Кстати, в прошлых летних лагерях уже была проблема с фотографиями без разрешения."
1002302-61 = "Запишу это в правила."
1002302-62 = "И? Что ещё ты хотел бы сделать?"
1002302-63 = "[s] «Я хочу пить сок с тобой из одной трубочки.»"
1002302-64 = "Н-Ни один уважающий себя член Дисциплинарного комитета не позволит себе ничего настолько... постыдного!"
1002302-65 = "За студентами, которые пытаются такое делать, определённо нужен надзор."
1002302-66 = "Продолжай."
1002302-68 = "После этого я один за другим выкладывал Иори свои самые сокровенные желания."
1002302-71 = "Готово! Думаю, специальных правил для летнего лагеря теперь достаточно."
1002302-72 = "Наверняка ни один студент не станет делать ничего плохого, кроме того, что уже перечислено здесь..."
1002302-73 = "И всё благодаря твоей помощи, Сенсей. Спасибо."
1002302-74 = "[s7] «Да ладно, пустяки.»\n[s8] «Похоже, я монополизировал весь рынок пляжных нарушений.»"
1002302-77 = "Не знала, что ты настолько регулярно думаешь о таких вещах."
1002302-78 = "Разочаровывает."
1002302-79 = "С этого момента тебе запрещено подходить ко мне ближе чем на полтора метра."
1002302-81 = "И так расстояние между мной и Иори увеличилось... буквально."
