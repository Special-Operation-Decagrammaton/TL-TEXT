[translation]
10052130-1 = "Йесод, Основа чистоты и силы"
10052130-3 = ""
10052130-4 = "Позиция закреплена."
10052130-5 = "У меня тоже. Позиция закреплена. Теперь нужно подняться туда."
10052130-6 = "..."
10052130-7 = "Кстати, как это назвать?"
10052130-8 = "Может, вал?"
10052130-9 = "По-моему, подходит."
10052130-10 = "Кажется, этого пророка звали Йесод."
10052130-13 = "При первом прибытии он устроил нам грандиозную встречу."
10052130-14 = "Ага. Мы всё-таки заставили его отступить на шаг..."
10052130-15 = ""
10052130-17 = "...но ощущалось это как бой с древним стражем замка."
10052130-18 = "Хотя его путь и титул были совсем другими."
10052130-19 = "Как они там звучали?"
10052130-20 = "Его путь — «истина на пути к завершению.»"
10052130-21 = "А титул — «Основание чистоты и силы.»"
10052130-22 = "...Ты это запомнила?"
10052130-23 = "Особо нечем было заняться."
10052130-24 = "А...?"
10052130-25 = "Прошу прощения. Это было бестактно. У всех столько дел, что мы уже почти валимся от работы."
10052130-26 = "Токи, ты снова машинально пошутила? Если не научишься чувствовать обстановку, люди могут начать на тебя злиться."
10052130-27 = "А. Я буду осторожнее. Потому что да, я действительно машинально пошутила."
10052130-28 = "...Мне немного страшно."
10052130-29 = "...Так даже ты умеешь бояться."
10052130-30 = "А ты, Эйми?"
10052130-31 = ""
10052130-33 = ""
10052130-34 = "Я тоже."
10052130-35 = "Остальные могут думать, что..."
10052130-36 = "Мы..."
10052130-37 = "...эксцентричные, но всегда спокойные."
10052130-38 = "Но мы просто студенты. Мы чувствуем всё то же самое."
10052130-39 = "Например, ненавидим рутинную работу и хотим просто бездельничать."
10052130-40 = "Да. Я хотела бы смотреть стримы с Сенсеем и есть картофельные чипсы."
10052130-41 = "Почему стримы?"
10052130-42 = "Потому что я ищу себе хобби."
10052130-43 = "Это называется «мимолётным увлечением.» Победа."
10052130-44 = "...Мимолётным?"
10052130-45 = "Да. Стримеры и трансляции мне немного интересны, но я понимаю, что это временно. Моё хобби может измениться в любой момент."
10052130-46 = "Есть ещё мимолётные хобби?"
10052130-47 = "Хм. Наверное, видеоигры. Мне нравится играть с Арис."
10052130-48 = "Читать мангу тоже было неплохо. Благодаря ей я узнала, что «веселье» подразумевает некоторую долю иррациональности и неэффективности."
10052130-49 = "Манга, игры... Так и думала."
10052130-50 = "Я к тому, что если бы мне не приходилось сражаться, я бы не стала. Есть способы решать проблемы без пуль."
10052130-51 = "Просто... было бы здорово жить в идеальном мире, где все могут ладить."
10052130-52 = "Но мы живём не в таком мире. И поэтому мне страшно."
10052130-53 = "Если случится что-то, что лишит меня и Сенсея возможности ждать завтрашнего дня... или произойдёт немыслимое..."
10052130-54 = "У меня сжимается грудь. Я не могу нормально дышать."
10052130-55 = "Что со мной?"
10052130-56 = "Где-то ниже меня или Сенсея."
10052130-57 = "...Серьёзно?"
10052130-58 = "Конечно нет. Человеческая жизнь есть человеческая жизнь. Одна не может быть ценнее другой."
10052130-59 = "Ага... Спасибо."
10052130-60 = "Я бы хотела, чтобы никто не пострадал."
10052130-61 = "Чтобы все живые существа существовали без боли и борьбы."
10052130-62 = "Вот теперь ты просишь слишком многого."
10052130-63 = "Максимум, что мы можем, — надеяться, что наши друзья останутся в безопасности. Жизнь и правда страшная штука, да?"
10052130-64 = "Сначала нашей головной болью была президент Химари, а теперь ещё и президент Рио..."
10052130-65 = "...И Сенсей. За Сенсея я тоже очень переживаю."
10052130-66 = "Может, однажды я просто запру Сенсея в одной из секретных комнат Миллениума."
10052130-67 = "Это был бы самый эффективный способ обеспечить безопасность."
10052130-68 = "Ты хочешь настроить весь Кивотос против Миллениума, Эйми?"
10052130-69 = "Потому что если да, я буду рядом с тобой на передовой."
10052130-70 = "...Я просто шучу."
10052130-71 = "Я тоже."
10052130-72 = "С тобой иногда трудно понять, Токи."
10052130-73 = "Правда? Но кое-чему я научилась."
10052130-74 = "Чем сложнее и опаснее ситуация..."
10052130-75 = "...тем больше люди шутят и делают бессмысленные глупости."
10052130-76 = "Иначе это слишком тяжело вынести."
10052130-77 = "Поэтому ты тоже постоянно выдаёшь такие дерзкие заявления?"
10052130-78 = "Нет. Это я просто говорю то, что думаю."
10052130-79 = "...Очень в твоём стиле, Токи."
10052130-80 = ""
10052130-85 = ""
10052130-88 = "Эйми, Токи. Слышите? У нас всё готово. Как только вы вступите в бой, мы пройдём по вашему маршруту."
10052130-89 = "Финиш уже виден. Не верится, что мы действительно дошли так далеко..."
10052130-90 = "Это практически последний пророк, да?"
10052130-91 = "Технически осталось ещё двое. Нецах, сам Стальной континент, и..."
10052130-92 = "Малкут..."
10052130-93 = "У-у-ух... В-вы уверены, что мы снова сможем с ней сразиться? Мы... победим...?"
10052130-94 = "Я уверена, Юзу! Мы все получили новое оружие и броню, а Кей сильно подняла уровень!"
10052130-95 = "Да... В этот раз бой не будет настолько односторонним. Теперь мы сами можем использовать значительную часть сил пророков."
10052130-98 = "Тогда, наверное, пора."
10052130-99 = "Именно."
10052130-100 = ""
10052130-104 = "Я пойду первой. В авангарде."
10052130-105 = "В новой экипировке я такая лёгкая. Мне нравится."
10052130-108 = "Угу. План такой: ты отвлечёшь его, чтобы группа подкрепления смогла безопаснее высадиться."
10052130-109 = "Операция «Стальной дождь»..."
10052130-112 = "И ты прикроешь меня?"
10052130-113 = "Всё время. Пока это кажется эффективным, я могу подстроиться под любую роль."
10052130-114 = "Тогда я не буду оглядываться. Не пострадай, Эйми."
10052130-115 = "Увидимся на другой стороне."
10052130-118 = "Ага. Увидимся."
