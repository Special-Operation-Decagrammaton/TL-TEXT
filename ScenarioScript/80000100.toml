[translation]
80000100-1 = "Три сердца"
80000100-2 = "Променад Чёрной Черепахи"
80000100-3 = "Я получил просьбу Руми о дегустации и отправился на Променад Чёрной Черепахи."
80000100-4 = "А, Сенсей! Вот вы где."
80000100-5 = "Ну-ну, садитесь. Так давно вас не видела, что боялась забыть ваше лицо. Заходить нужно чаще."
80000100-6 = "[s] «Прости. Так что за дегустация?»"
80000100-7 = "Ах да, я подготовила несколько вещей."
80000100-8 = "Но сначала... не хотите чашку чая? Я приготовила отличные листья зелёного чая."
80000100-9 = "Я утолил жажду зелёным чаем, который налила Руми."
80000100-10 = "Ну что же, вы довольно сообразительны, Сенсей. Наверняка уже поняли, зачем я сразу начала с зелёного чая, да?"
80000100-11 = "[s1] «Хм... На самом деле я не...»\n[s2] «Кажется, я знаю.»"
80000100-12 = "Ха-ха-ха, понятно. Наверное, подсказок было мало. Впрочем, если бы люди понимали все намерения за чашкой чая, разговоры вообще были бы не нужны."
80000100-13 = "Итак. Вот что я приготовила. В каком-то смысле это главная причина сегодняшней встречи."
80000100-14 = "Правда? И как вы думаете, что у меня на уме?"
80000100-15 = "Подозреваете что-то сладкое? Как и ожидалось от вас, Сенсей. Вы понимаете меня без слов."
80000100-16 = ""
80000100-18 = ""
80000100-20 = "Что это? Можно сказать, лунный пряник..."
80000100-21 = "Но в отличие от обычных лунных пряников, в этих есть шоколад."
80000100-22 = "[s] «Хм, здесь три вида, и все выглядят немного по-разному...»"
80000100-23 = "Отличное наблюдение. Каждый из этих лунных пряников приготовлен по-разному."
80000100-24 = "Первый — обычный лунный пряник. Простая паста из красной фасоли в мучной оболочке, но с шоколадным покрытием снаружи."
80000100-25 = "Во втором шоколадная начинка внутри мучной оболочки."
80000100-26 = "С третьим я немного разошлась: сделала мучную оболочку настолько тонкой, что она почти прозрачная..."
80000100-27 = "Потом приготовила начинку из густого шоколадного крема и охладила всё до полузамороженного состояния. Можно назвать это ледяным шоколадным лунным пряником."
80000100-28 = "И вот мой вопрос, Сенсей. Какой из этих трёх больше всего заслуживает названия «Шоколадный лунный пряник»?"
80000100-29 = "Не спешите. Пробуйте медленно и хорошо обдумайте мнение. Если станет слишком сладко, освежите вкус зелёным чаем."
80000100-31 = "Я сделал, как попросила Руми, и тщательно попробовал каждый пряник."
80000100-32 = "Все три шоколадных лунных пряника были вкусными."
80000100-33 = ""
80000100-34 = "Ну что же, пора услышать ваше решение, Сенсей."
80000100-35 = "Какой был больше всего похож на настоящий шоколадный лунный пряник?"
80000100-36 = "[s3] «Нужно придерживаться традиций. Думаю, вариант № 1 с шоколадной глазурью снаружи — лучший.»\n[s4] «Я выбираю № 2: с ним можно в полной мере почувствовать вкус шоколада.»\n[s5] «Говорят, готовка — это испытание. Как насчёт № 3, где ты попробовала нечто совершенно новое?»"
80000100-40 = "Понятно... Хорошо! Полезно знать. Спасибо, Сенсей."
80000100-41 = "[s] «Значит, сегодня была просто дегустация лунных пряников. Спасибо.»"
80000100-42 = "Хм? Не уверена. Сегодня ведь День святого Валентина, правда?"
80000100-43 = "Я позвала вас только потому, что хотела незаметно накормить шоколадом."
80000100-44 = "[s] «...А?»"
80000100-45 = "..."
80000100-46 = "...Ой... Кажется, я сказала лишнее."
80000100-47 = "Когда слышу эти мысли вслух, становится довольно неловко."
80000100-48 = "Вчера на репетиции мне удалось ничего не выдать, так почему—"
80000100-49 = "Ах, теперь я сказала ещё более неловкую вещь! Какой кошмар!"
80000100-50 = "[s6] «...Возможно, я не вправе это говорить, но...»\n[s7] «Ну... думаю, можно было выразить всё это немного тактичнее.»"
80000100-53 = "Дело в том... Почему-то мне не хотелось быть такой формальной."
80000100-54 = "Я не хочу, чтобы между нами были отношения, где мы что-то скрываем друг от друга, Сенсей."
80000100-55 = "Поэтому мне хотелось говорить откровенно..."
80000100-56 = "Но я не ожидала, что скажу вообще всё это..."
80000100-57 = "[s] «...Хочешь доесть эти лунные пряники?»"
80000100-58 = "А? Но... я приготовила их для вас, Сенсей."
80000100-59 = "Их слишком много, чтобы съесть одному?"
80000100-60 = "..."
80000100-61 = "Хорошо. Тогда подождите немного. Я заварю ещё чая."
80000100-63 = "Мы с Руми поделили шоколадные лунные пряники за чаем и приятной беседой."
