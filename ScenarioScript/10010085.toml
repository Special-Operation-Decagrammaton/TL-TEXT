[translation]
10010085-1 = "Эпизод 8;Чем-то похожи, часть 2"
10010085-2 = ""
10010085-7 = "Я знаю это место! Этот дополнительный корпус находится под контролем Рыцарей исцеления."
10010085-8 = "Подождите."
10010085-9 = "Мы ведь могли пойти и в главное здание Рыцарей на кампусе."
10010085-10 = "Сенсей, есть причина, почему вы привели нас именно сюда?"
10010085-11 = ""
10010085-13 = ""
10010085-14 = "А, значит, вы знаете кого-то, кто здесь работает."
10010085-15 = "Наверное, это как раз тот человек, к которому нам стоит обратиться. Интересно, кто это..."
10010085-16 = "[s1] «Скоро познакомишься.»\n[s2] «Она должна появиться с минуты на минуту.»"
10010085-17 = "Что ты имеешь в виду?"
10010085-18 = "Что ты имеешь в виду?"
10010085-19 = "Вот вы где, Сенсей. Я вас ждала."
10010085-20 = "А?"
10010085-21 = ""
10010085-24 = "Рада снова вас видеть. Не так уж часто вы сами приходите ко мне первым."
10010085-25 = "Ты, должно быть, Хината. Приятно познакомиться."
10010085-26 = "О? Эм, да... Здравствуйте."
10010085-27 = "Но... откуда вы знаете моё имя?"
10010085-28 = "Это тот человек, о котором вы говорили, Сенсей? Наверное, она одна из Рыцарей исцеления."
10010085-29 = "Погодите. Где мои манеры?"
10010085-30 = "Простите. Сначала мне следовало объяснить, зачем мы пришли."
10010085-31 = "О, ничего страшного. Как я и сказала, я вас ждала."
10010085-32 = "Вы... ждали?"
10010085-33 = ""
10010085-34 = "Я знаю, что у вас двоих совсем мало времени, так что идёмте за мной."
10010085-35 = ""
10010085-37 = ""
10010085-39 = ""
10010085-40 = "Эм, Сенсей?"
10010085-41 = "Вы заранее ей написали или что-то такое? Я даже не заметила..."
10010085-42 = "[s3] «Эм... Да, пока будем считать, что так.»\n[s4] «Не думай об этом слишком много.»"
10010085-43 = "Ч-Что это должно значить?"
10010085-44 = "Эм... Если вы так говорите."
10010085-45 = "Я всё ещё немного запуталась..."
10010085-46 = ""
10010085-52 = "Вы ищете святой тоник, верно? Это лекарство с давней историей, связанной с Рыцарями исцеления."
10010085-53 = "В старые времена его использовали намного чаще. Обычно мы не держим его под рукой, так что придётся доставать из медицинского хранилища."
10010085-54 = "На самом деле для выдачи таких старых лекарств существуют правила и процедуры согласования."
10010085-55 = "Но у вас двоих нет на это времени, поэтому я достану всё необходимое.#nБумаги оставьте мне, а сами можете идти дальше."
10010085-56 = ""
10010085-58 = ""
10010085-59 = ""
10010085-60 = "Двух бутылок хватит, Хината?"
10010085-61 = "О-О... Эм, да, этого более чем достаточно."
10010085-62 = "Я всё ещё не понимаю, Сенсей."
10010085-63 = "Как у неё это получается?"
10010085-64 = "[s5] «Со временем привыкаешь.»\n[s6] «Серина готова ко всему.»"
10010085-65 = "Это потрясающе..."
10010085-66 = "Это потрясающе..."
10010085-67 = ""
10010085-69 = ""
10010085-70 = ""
10010085-74 = "Хм. Должно быть где-то на этой стене."
10010085-75 = ""
10010085-80 = "О."
10010085-81 = "Мне звонят из администрации. Простите на минутку..."
10010085-82 = ""
10010085-85 = "Да, это Серина... Угу... Прямо сейчас?"
10010085-86 = "Н-Нет, конечно, могу... Хорошо. Поняла."
10010085-87 = ""
10010085-90 = "В общем, тут такое дело."
10010085-91 = "Простите, Сенсей. Мне нужно идти—"
10010085-92 = "[s7] «Всё нормально. Работа важнее.»\n[s8] «Не переживай за нас. Иди.»"
10010085-93 = "Х-Хорошо. Спасибо."
10010085-94 = "Х-Хорошо. Спасибо."
10010085-95 = "Простите. Я бы продолжила искать вместе с вами, но внезапно хлынул поток пациентов."
10010085-96 = "Правда? Что-то серьёзное случилось?"
10010085-97 = "Ничего страшного. Просто на этой неделе Комитет правопорядка проводит показательные мероприятия."
10010085-98 = "Они ездят с выездами по району Тринити и на окраины."
10010085-99 = "А значит, иногда сталкиваются с хулиганами и бандитами в шлемах..."
10010085-100 = "А, теперь понятно..."
10010085-101 = "Наверное, лечить их всех очень тяжело."
10010085-102 = "Ха-ха. Да, нехватка рук у нас не редкость. Это всего лишь дополнительный корпус, поэтому пациентов здесь меньше, чем в других местах..."
10010085-103 = "...но всё равно я здесь единственная, кто может ухаживать за пациентами в палатах."
10010085-104 = "Ч-Что? Тебе приходится заботиться обо всех одной?"
10010085-105 = "Верно. Иногда я переживаю, что не успеваю уделить каждому столько внимания, сколько он заслуживает."
10010085-106 = "Но я всё равно делаю для них всё, что могу. В конце концов, это моя работа."
10010085-108 = "..."
10010085-109 = "В общем, вот такая ситуация... Простите, Сенсей, но мне придётся ненадолго уйти."
10010085-110 = "Я постараюсь вернуться как можно скорее. Тогда до встречи."
