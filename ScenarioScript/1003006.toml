[translation]
1003006-1 = "Открытая ванна для двоих"
1003006-2 = "О, вы пришли, Сенсей. Я ждала вас."
1003006-3 = "Как я и говорила, я забронировала ужин в местном рёкане."
1003006-4 = "Этот рёкан — один из самых старинных в Академии Геенна. Это туристическая достопримечательность, куда съезжаются гости со всего Кивотоса, поэтому обычным способом забронировать место довольно трудно."
1003006-5 = "К счастью, благодаря особой привилегии членов Префекторской команды мне удалось получить однодневную путёвку. Поэтому я смогла пригласить вас, Сенсей."
1003006-6 = "[s1] «Ты уверена, что я могу принять такую ценную путёвку?»\n[s2] «Мне даже неловко...»"
1003006-7 = "Нет, учитывая всю доброту, которую вы мне проявили, даже этого, кажется, недостаточно."
1003006-8 = "Нет, учитывая всю доброту, которую вы мне проявили, даже этого, кажется, недостаточно."
1003006-9 = "Но я не хочу отнимать у вас слишком много времени, поэтому надеюсь, что вы будете довольны однодневной путёвкой."
1003006-10 = "Кроме того, этот рёкан рассчитан на двух человек, и..."
1003006-11 = "Мне было трудно найти кого-то, кто пошёл бы со мной."
1003006-12 = "[s] «Тогда я принимаю твой подарок, Чинацу.»"
1003006-13 = "Тогда сегодня я к вашим услугам, Сенсей."
1003006-14 = ""
1003006-19 = "Добро пожаловать. Большое спасибо, что посетили наш рёкан."
1003006-20 = "Вы госпожа Хиномия Чинацу, оформившая однодневное бронирование?"
1003006-21 = "Да, я забронировала ужин и комнату на двоих."
1003006-22 = "Прекрасно, спасибо, что зарегистрировались."
1003006-23 = "Сейчас наш рёкан бесплатно предоставляет гостям, зарегистрировавшимся как пара, доступ к открытой ванне."
1003006-24 = "Это редкая возможность получить наши роскошные приватные горячие источники полностью в своё распоряжение, если пожелаете."
1003006-25 = "Что? П-Пара?!"
1003006-26 = "Да, здесь в бронировании вы выбрали тариф для пар..."
1003006-27 = "Есть какая-то проблема?"
1003006-28 = "(О нет. Я допустила опечатку, потому что так спешила с бронированием.)"
1003006-29 = "(Как студент и учитель могут быть парой? Что Сенсей обо мне подумает, если заметит мою ошибку?)"
1003006-30 = "Эм, кажется, я ошиблась."
1003006-31 = "Простите? Так вы не пара?"
1003006-32 = "[s3] «Нет, мы пара.»\n[s4] «Мы просто ещё привыкаем к этому...»"
1003006-35 = "С-С-Сенсей?!"
1003006-36 = "О, понятно."
1003006-37 = "Тогда я подготовлю открытую ванну, как вы просили."
1003006-38 = "Ванна находится прямо перед вашими комнатами, так что пользуйтесь ею в любое удобное время."
1003006-39 = ""
1003006-41 = ""
1003006-42 = ""
1003006-43 = "С-С-Сенсей?! Зачем вы солгали?"
1003006-44 = "Вы считаете, что было бы расточительством не воспользоваться услугой роскошного рёкана?"
1003006-45 = "Пожалуй..."
1003006-46 = "Но отдельная открытая ванна означает... что мы будем пользоваться одной ванной..."
1003006-47 = "Я не ожидала ничего подобного..."
1003006-48 = ""
1003006-50 = ""
1003006-51 = "Нет, ничего."
1003006-52 = "Сегодня я отплачиваю вам за вашу доброту. Не буду беспокоить вас из-за мелочей."
1003006-53 = "Думаю, ужин будет готов ещё не скоро."
1003006-54 = ""
1003006-56 = ""
1003006-57 = ""
1003006-59 = "Может, сначала насладимся открытой ванной?"
1003006-62 = "― Не могу поверить, что этой роскошной ванной пользуемся только мы вдвоём.[wa:940]"
1003006-64 = "― Пожалуй, никогда не знаешь, что может случиться в жизни.[wa:30]"
1003006-67 = "― Может быть, когда-нибудь... Такое будущее...[wa:3380]"
1003006-70 = "― Н-Н-Нет! Ничего![wa:2310]"
1003006-73 = "― Если каким-то образом это действительно случится когда-нибудь...[wa:4110]"
1003006-76 = "― Я была бы счастлива гораздо больше,[wa:2130]"
1003006-78 = "― чем заслуживаю, но..."
1003006-81 = "― Даже если мы всего лишь учитель и студент,[wa:10]"
1003006-83 = "― прямо сейчас я правда счастлива. Правда...[wa:3150]"
1003006-86 = "Это была потрясающая ванна."
1003006-87 = "Кажется, усталость за сегодняшний день — или, скорее, за весь семестр — просто растаяла."
1003006-88 = "Итак, Сенсей, что вы собираетесь делать теперь?"
1003006-89 = "Думаю, в этом рёкане кроме горячих источников есть много других приятных развлечений..."
1003006-90 = "Что? Вы хотите снова пойти в открытую ванну?"
1003006-91 = ""
1003006-93 = ""
1003006-94 = "...Тогда я присоединюсь к вам, Сенсей."
1003006-95 = "Будет опасно, если у вас закружится голова от горячей воды, пока вы будете купаться один."
1003006-96 = "В конце концов, на бумаге мы всё-таки пара. И я отвечаю за медицинскую помощь, так что... позвольте немного за вами присмотреть."
1003006-98 = "(После этого я купался вместе с Чинацу, пока у меня не закружилась голова.)"
