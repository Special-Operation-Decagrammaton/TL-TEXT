[translation]
102190-1 = "Эпизод 19; Операция по обороне района — Город Ширатори, D.U."
102190-5 = "Последним осталось шестое святилище... и мы всё ещё не уверены, кто его хранитель."
102190-6 = "Но судя по обнаруженной энергии... думаю, этот хранитель будет опаснее всех остальных вместе взятых."
102190-7 = "Мы не знаем, что случится, если поспешно атаковать святилище... поэтому стоит усилить оборону и патрулировать D.U."
102190-8 = "Тогда мы сможем найти способ остановить угрозу шестого святилища."
102190-9 = "Способ остановить угрозу? Это возможно, президент?"
102190-10 = "Конечно, Эйми. Всё это время я собирала данные. За кого ты меня принимаешь?"
102190-11 = "Эм... Канализация..."
102190-12 = "Сколько раз повторять? Это имя Рио, а не моё! Я — чистая родниковая вода! Ты стала делать это так часто, что я начинаю подозревать, будто нарочно."
102190-13 = "..."
102190-14 = ""
102190-19 = "Ладно! Миссия подтверждена! Мы займёмся этим!"
102190-20 = "Да. Общество исследования гурманов поможет оборонять район Ширатори в D.U."
102190-22 = "Главным образом потому, что дорога к аквариуму сейчас перекрыта. ★"
102190-23 = "Ага! Так что давайте разберёмся с этим поскорее!"
102190-24 = "Почему бы вам двоим из Клуба дополнительных занятий не поддержать нас?"
102190-26 = "Ч-Что?! Мы тоже?!"
102190-27 = "Подтверждаю. Надеюсь на сотрудничество, Общество исследования гурманов."
102190-29 = "Какая радость! Давно мы вот так не собирались вместе."
102190-30 = "Ладушки! Сейчас мы им наваляем!"
102190-32 = ""
102190-38 = ""
102190-39 = "Бесконечный конвейер ведёт прямиком к справедливости!"
102190-40 = ""
102190-42 = ""
102190-43 = "Бесконечный суши-отряд, Кайтенгеры, прибыл!"
102190-44 = "Ха-ха-ха! Раз уж мир в кризисе, мы не можем просто сидеть и смотреть, как он гибнет!"
102190-45 = "Точно! Самое время праведным Кайтенгеры появиться на сцене!"
102190-46 = "Кстати, в этот раз кризис и правда серьёзный. Мы вообще справимся?"
102190-47 = "Красный! За сегодняшние задания платят надбавку! Просто напоминаю!"
102190-48 = "Ха-ха-ха! Тогда придётся справиться!"
102190-49 = "Вперёд! Бесконечный суши-отряд: Кайтенгеры!"
102190-50 = ""
102190-52 = ""
102190-54 = ""
102190-55 = "Ч-Что? Я одна это видела...?!"
102190-56 = "Нет, ты права! Я тоже видела! Ходячие суши!"
102190-57 = "Суши?! Где?"
102190-58 = "Я уже даже не помню, когда последний раз ела суши! В прошлый раз, когда заказывала доставку, мне сказали, что не могут привезти из-за слишком высоких процентных ставок в том квартале!"
102190-59 = "Это вообще не имеет смысла! При чём тут процентные ставки и суши?!"
102190-61 = "Хи-хи. Прекрасно. Тут действительно становится жарко. Сохраним этот темп."
102190-62 = "Ешь или умри!"
102190-63 = ""
