[translation]
2000009-1 = "Эта ночь — твоя!"
2000009-2 = "Коридор Миллениума"
2000009-3 = "Сенсей!"
2000009-4 = "Наконец-то."
2000009-5 = "Спасибо, но сейчас не до разговоров."
2000009-6 = "Кто-то устроил проблемы на электростанции №1, сразу за мостом Миллениума."
2000009-7 = "Наверняка группа, у которой зуб на Миллениум."
2000009-8 = "Такими темпами академия останется без электричества."
2000009-9 = "Нам повезло, что всё произошло днём."
2000009-10 = "Если не исправить это до темноты..."
2000009-11 = "...весь Миллениум останется во мраке."
2000009-12 = "[s] «Ты шутишь.»"
2000009-13 = "Я совершенно серьёзно."
2000009-14 = "Как думаешь, в такой высокотехнологичной академии вообще валяются свечи и фонарики?"
2000009-15 = "И что важнее... сегодня вечером запланировано большое событие."
2000009-16 = "Многие студенты очень его ждали."
2000009-17 = "Особенно я!"
2000009-18 = "Нужно что-то сделать с электростанцией."
2000009-19 = "Руководители Инженерного отдела делают всё возможное, чтобы восстановить питание отсюда."
2000009-20 = "Но электростанция — моя ответственность, поэтому мне нужно идти самой."
2000009-21 = "Мне нужна твоя помощь, Сенсей."
2000009-23 = "Электростанция Миллениума №1"
2000009-24 = ""
2000009-25 = "Всё хуже, чем я думала..."
2000009-26 = "Здесь явно был серьёзный бой."
2000009-27 = ""
2000009-28 = "Хорошо, Сенсей. За работу!"
2000009-30 = "Проверяю первый сердечник... О нет. Он полностью уничтожен."
2000009-31 = "Заменяю на вспомогательный сердечник, который принесла, и... отлично. Первый подключён!"
2000009-32 = "Поток энергии подтверждён! Слава богу, сама система питания не повреждена."
2000009-33 = "Но это займёт время."
2000009-34 = "Все 13 сердечников могут быть в таком же состоянии."
2000009-35 = "Даже если работать максимально быстро, можем не успеть до темноты."
2000009-37 = "Третий сердечник проверен! К счастью, повреждения небольшие — если восстановить проводку...!"
2000009-39 = "Седьмой готов... Еле удалось починить. Фух. Это было тяжело."
2000009-40 = "[s1] «Может, немного отдохнёшь?»\n[s2] «Сколько ещё времени понадобится?»"
2000009-41 = "Мы только примерно... на половине."
2000009-42 = "Мы только примерно... на половине."
2000009-43 = "Что делать? Если мы не успеем..."
2000009-44 = "*всхлипывает*"
2000009-45 = "[s3] «Не сдавайся!»\n[s4] «День без связи будет не так уж плох.»"
2000009-46 = ""
2000009-47 = "...Ага."
2000009-48 = ""
2000009-49 = "...Нет!"
2000009-50 = "Я не могу сдаться."
2000009-51 = "Может, я и не успею вовремя..."
2000009-52 = "...но какой я тогда мастер, если сдамся сейчас?"
2000009-53 = "Именно это... ты хотел услышать, да, Сенсей?"
2000009-54 = "Да. Я сделаю всё, что смогу."
2000009-55 = ""
2000009-56 = "Я выложусь... на полную?"
2000009-57 = "Эй, восьмой сердечник вроде цел."
2000009-58 = "Н-Неужели...!"
2000009-59 = "Девятый почти не повреждён?"
2000009-60 = "Такими темпами я ещё и с запасом времени закончу!"
2000009-61 = "Сенсей!"
2000009-62 = ""
2000009-63 = "Быстрее!"
2000009-65 = "Все 13 сердечников подключены! Перезапускаю систему..."
2000009-66 = "*вр-р-рум*"
2000009-67 = "Пожалуйста... Пожалуйста, заработай..."
2000009-69 = "*бр-р-р-р*"
2000009-70 = "Да! Получилось!"
2000009-71 = "Огромное спасибо, Сенсей!"
2000009-72 = "Благодаря тебе я смогла вернуть электричество."
2000009-73 = "Это только временное решение. Потом всё равно понадобится полноценный ремонт, но всё же..."
2000009-74 = ""
2000009-75 = ""
2000009-76 = "..."
2000009-77 = "Я хочу отблагодарить тебя за поддержку, Сенсей."
2000009-78 = "Помнишь моё обещание? Я сказала, что покажу тебе кое-что ещё лучше фейерверков."
2000009-79 = "Думаю, пора его выполнить."
2000009-80 = ""
2000009-81 = ""
2000009-82 = "Пройдёшь со мной немного?"
2000009-86 = "Знаю, я повторяюсь... но скажу ещё раз."
2000009-89 = "― Спасибо, Сенсей. Благодаря тебе мы можем видеть этот прекрасный вид.[wa:3080]"
2000009-91 = "― Красиво, правда? Я рада, что мы успели.[wa:1420]"
2000009-94 = "― Хм? Почему для меня это было так важно?[wa:2200]"
2000009-96 = "― Я хотела, чтобы студенты Миллениума могли...[wa:460]"
2000009-99 = "― ...наслаждаться улицами, когда они так ярко освещены."
2000009-102 = "― Что-то подобное... это единственное, что я умею делать.[wa:1060]"
2000009-105 = "― К тому же такой момент...[wa:10]"
2000009-107 = "― ...уже сам по себе достаточная награда.[wa:1760]"
2000009-110 = "― Ну что скажешь, Сенсей? Ночь ещё только начинается.[wa:3880]"
2000009-112 = "― Можешь... остаться со мной ещё немного?[wa:220]"
2000009-115 = "Знаешь, это странно."
2000009-116 = "На самом деле я вижу этот пейзаж постоянно."
2000009-117 = "Но когда рядом ты, Сенсей, всё кажется..."
2000009-118 = "..."
2000009-119 = "...намного красивее."
