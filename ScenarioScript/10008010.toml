[translation]
10008010-1 = "Эпизод 1;Новогоднее мероприятие"
10008010-5 = "Я решил посетить большое новогоднее мероприятие, о котором все говорили в соцсетях."
10008010-6 = "Из-за шумихи в интернете здесь совершенно не протолкнуться."
10008010-7 = "[s] «Ну да, Новый год действительно чувствуется...»"
10008010-8 = "Эй! Это же Сенсей!"
10008010-9 = "С Новым годом, Сенсей!"
10008010-10 = "А?"
10008010-11 = "С-С-С Новым годом!"
10008010-12 = "О. Привет, Сенсей. С Новым годом."
10008010-13 = "[s] «И вас всех тоже.»"
10008010-14 = "О, спасибо, Сенсей."
10008010-15 = "Так что привело тебя сюда?"
10008010-17 = "Больше заняться нечем?"
10008010-18 = "Может, это связано с Шале. Сенсей ведь никогда не перестаёт работать,#nв конце концов."
10008010-19 = "[s] «Может быть. Хватит обо мне. Вы все отлично выглядите.»"
10008010-21 = "О, какой утончённый вкус у тебя, Сенсей."
10008010-22 = "Полюбуйся этими роскошными узорами, вышитыми на лучшем шёлке мастерицей! Впитай великолепный дизайн, стремящийся к гармонии и балансу, но не боящийся необычного!"
10008010-23 = "От одного из наших официальных деловых партнёров я и ожидала столь превосходного эстетического вкуса!"
10008010-24 = "Неплохо для кимоно, арендованного в местном магазине."
10008010-25 = "...?!"
10008010-26 = "..."
10008010-27 = "[s1] «Это неважно. Всё равно выглядит отлично.»\n[s2] «Вы все в любом случае прекрасны.»"
10008010-28 = "Хе-хе."
10008010-29 = "Хе-хе."
10008010-30 = "Как всегда прямолинейно."
10008010-31 = "С-Спасибо."
10008010-32 = "Кхм! Считайте их нашей боевой формой для этого особого случая."
10008010-33 = "[s] «Боевая форма?»"
10008010-34 = "Неважно. У нас есть дело дальше внутри."
10008010-35 = "Не хочешь... пойти с нами, Сенсей?"
10008010-36 = "У тебя ведь всё равно нет других дел, да? Пошли!"
10008010-37 = "[s] «Собираетесь делать пожертвование? Ладно, я с вами.»"
10008010-38 = ""
10008010-44 = "С Новым годом всех, кто смотрит нас дома!"
10008010-45 = "С вами звёздный репортёр Школы журналистики «Кронос» — Кавару Шинон!"
10008010-46 = "Мы выходим в ПРЯМОЙ ЭФИР! Неужели вы не догадались, откуда мы ведём репортаж? Тогда вас ждёт сюрприз."
10008010-47 = "То есть, кто вообще о нём НЕ слышал? Об этом говорит весь Кивотос!"
10008010-48 = "Да! Я на празднике Дайкичидэн, знаменитом слоганом «Пожелаешь — получишь!»"
10008010-49 = "И сегодня у нас особый гость."
10008010-50 = "Встречайте управляющего Дайкичидэном!"
10008010-51 = ""
10008010-54 = ""
10008010-55 = "Ахахаха. Здравствуйте! Я управляющий новогоднего мероприятия Дайкичидэна."
10008010-56 = "Спасибо, что присоединились к нам сегодня. Давайте сразу к делу."
10008010-57 = "Ваша площадка набрала огромную популярность в соцсетях как место, где исполняются желания. Что вы об этом думаете?"
10008010-58 = "Ахахаха. Даже нам трудно сказать, правда это или нет."
10008010-59 = "Но в любом случае мы воспринимаем это как комплимент. Именно благодаря слуху столько людей приходит повеселиться на фестивале Дайкичидэна."
10008010-60 = "О! Кстати, не могли бы вы подробнее рассказать, чем особенно новогоднее мероприятие Дайкичидэна?"
10008010-61 = "Конечно. Во-первых, наше новогоднее мероприятие находится в руках очень способных..."
10008010-64 = "Хе. Давненько не виделись. Я всё ещё должна тебе за прошлый раз."
10008010-65 = "Рада, что и в этот раз проект благополучно ускользнул от глаз Генерального студсовета."
10008010-66 = "Кстати, о том бизнесе, который моя компания недавно приобрела..."
10008010-67 = "Насчёт строительного контракта, который мы подписали с академией Шаньхайцзин..."
10008010-68 = "[s] «Людям определённо есть о чём поговорить.»"
10008010-69 = "Значит, ты заметил. Уже началось — они оценивают друг друга."
10008010-70 = "То, что звучит как обычная беседа, на деле словесная война. Они ведут ожесточённую битву."
10008010-71 = "Само собой, мы уже привлекли их внимание. Чувствуете давление их взглядов? Не расслабляйтесь, потому что именно сейчас начинается самое главное."
10008010-72 = "Мы правда привлекли их внимание? Я ничего особенного не заметила."
10008010-73 = "Не недооценивай их. И ты, Сенсей. Держись уверенно и следуй за нами."
10008010-74 = ""
10008010-76 = ""
10008010-78 = "Туалет находится вон там!"
10008010-79 = "А вот здесь можно вытянуть предсказание судьбы!"
10008010-80 = "[s] «Сэрика?»"
10008010-81 = "А?"
10008010-82 = "Сенсей?!"
10008010-83 = "С-С Новым годом..."
10008010-85 = "Разве ты не...?"
10008010-86 = "Да это же наша маленькая любительница подработок из Абидоса!"
10008010-88 = "Решалы 68? Что вы все здесь делаете?"
10008010-89 = "[s] «Ты устроилась мико на подработку?»"
10008010-90 = "А, ага. Выходные — одно из лучших времён, чтобы подзаработать."
10008010-91 = "[s] «Я так и думал. Ты самый трудолюбивый человек из всех, кого я знаю.»"
10008010-92 = "Хи-хи. Спасибо, но лестью ты ничего не добьёшься, Сенсей."
10008010-93 = "Сначала я сомневалась насчёт этой подработки, но работу с такой оплатой найти трудно."
10008010-94 = "Так что не вздумайте всё испортить, «Решатель проблем»! Не дам вам снова разнести моё место работы!"
10008010-95 = "М-Мы этого не планировали! Не думай, будто мы ходим и всё взрываем ради развлечения!"
10008010-96 = "Мы пришли на новогоднее мероприятие, как и все остальные."
10008010-97 = "Как скажешь."
10008010-98 = "В общем, вы собирались загадать желание?"
10008010-99 = "[s] «Ага. Как ты догадалась?»"
10008010-100 = "С тех пор как это место стало популярным в соцсетях, сюда все именно за этим и приходят."
10008010-101 = "Я провожу вас к ящику для пожертвований."
10008010-102 = ""
10008010-104 = ""
10008010-105 = "Идите за мной. Там кое-кто ждёт встречи с вами."
10008010-106 = "Прошу!"
10008010-110 = ""
10008010-111 = "Вот здесь."
10008010-112 = ""
10008010-114 = ""
10008010-116 = "Перед ним огромная очередь..."
10008010-117 = "Пока дойдёт наша очередь, уже вся ночь пройдёт."
10008010-118 = "Эй, вам не кажется, что этот ящик для пожертвований какой-то странный? Почему спереди написано «хранилище»?"
10008010-119 = "Кажется, босс отвечал за его дизайн. Он говорил, что из-за наплыва посетителей решил сделать его больше похожим на сейф."
10008010-120 = "Вот как..."
10008010-121 = "Если подумать, логично. Сюда приходит много людей делать пожертвования, а значит, в ящик попадает больше денег."
10008010-122 = "Хмф. Потому что все повелись на рекламный трюк. Просто принимают желаемое за действительное."
10008010-123 = "Не знаю насчёт этого. Многие возвращались поблагодарить за исполненные желания. Я сама видела."
10008010-124 = "П-Правда...?"
10008010-125 = "Да и пожертвование стоит не так уж дорого. Я тоже собиралась загадать желание, когда получу зарплату."
10008010-126 = "Ладно, мне нужно вернуться к работе. Постарайтесь не вляпаться в неприятности."
10008010-127 = "Увидимся позже, Сенсей."
10008010-128 = ""
10008010-130 = ""
10008010-132 = "Х-Хм..."
10008010-135 = "Что вы думаете о слухе, что загаданные здесь желания сбываются?"
10008010-136 = "Это правда! Я сама видела, как желания людей исполнялись!"
10008010-137 = "Вы не первый человек, от которого я это слышу."
10008010-139 = "Э-э..."
10008010-140 = ""
10008010-142 = ""
10008010-144 = ""
10008010-145 = "(Она опять начинает уходить в себя.)"
10008010-146 = "(...)"
10008010-148 = "Но разве не было бы довольно опасно, если бы это оказалось правдой?"
10008010-149 = "Опасно? Почему ты так думаешь?"
10008010-150 = "Подумайте, сколько людей положили деньги в ящик и загадали желание. Наверняка желания были самые разные."
10008010-151 = "А что, если злой дух осквернит эти желания?"
10008010-152 = "Что, если такое желание сбудется?"
10008010-153 = "Оно вполне может пожелать, чтобы все остальные желания исполнились наоборот!"
10008010-154 = "Да брось. Это невозможно."
10008010-155 = "Откуда такая уверенность? В таких обстоятельствах может случиться что угодно. Как говорится: «Осторожнее со своими желаниями»."
10008010-156 = "В-Возможно, он прав! Нам нельзя относиться к этому легкомысленно!"
10008010-157 = ""
10008010-160 = ""
10008010-161 = "Эм... Надеюсь, босс, ты не воспринимаешь это всерьёз."
10008010-162 = "Н-Нет, конечно. С чего ты взяла?"
10008010-163 = "Я не из тех, кто верит в необоснованные суеверия."
10008010-164 = "В конце концов, это всего лишь вопрос случайности."
10008010-165 = "При такой большой выборке естественно, что желания некоторых посетителей действительно сбудутся."
10008010-166 = "Потом эти совпадения разносятся среди людей и превращаются в слухи."
10008010-167 = "Или владельцы изначально могли нанять актёров, чтобы те распространяли слухи и подогревали интерес к мероприятию."
10008010-168 = "Основы бизнеса. Вам не помешает это запомнить."
10008010-169 = ""
10008010-172 = ""
10008010-173 = "..."
10008010-174 = "Ага..."
10008010-177 = "[ns] «Похоже, наша очередь.»"
10008010-178 = ""
10008010-182 = "Хе. Наконец-то."
10008010-183 = "Э-Это наш шанс выглядеть как крупные шишки!"
10008010-184 = "Наверное, но это вообще сработает?"
10008010-185 = "Здесь такая толпа, что, по-моему, никто даже не заметит и не заинтересуется размером нашего пожертвования."
10008010-186 = "Ага, скорее всего всё выйдет не так, как босс себе представляла, но ладно. Раз уж мы сюда добрались, можно довести дело до конца."
10008010-187 = ""
10008010-189 = ""
10008010-190 = "Вот моя доля: 50 000 иен."
10008010-191 = "Ого! Ты сказала 50 000?!"
10008010-192 = "Эм, Каёко? Я знаю, что сказала наскрести всё, что сможете, но не думала, что ты принесёшь НАСТОЛЬКО много..."
10008010-193 = "А сколько, по-твоему, нужно было принести, чтобы впечатлить всех?"
10008010-194 = "Впрочем, неважно. Всё равно эти деньги были из моего бюджета на музыку. Могу позволить себе потратить их на новогоднее желание."
10008010-195 = ""
10008010-197 = ""
10008010-198 = ""
10008010-199 = "..."
10008010-201 = "Н-Не может быть..."
10008010-202 = "Я-Я следующая."
10008010-203 = "Я накопила это, несколько месяцев работая ночами на стройке."
10008010-204 = "Тут 300 000 иен!"
10008010-205 = "Что?!"
10008010-206 = "...?!"
10008010-207 = "Ч-Что...?"
10008010-208 = "Только так кто-то настолько ничтожный, как я, мог оказаться полезным Ару."
10008010-209 = "Физическая работа была настолько тяжёлой, что бывали ночи, когда мне казалось, что меня вырвет наизнанку..."
10008010-210 = "...но всё это того стоило, если благодаря этим деньгам я могу быть полезна!"
10008010-212 = "П-Погоди!"
10008010-213 = ""
10008010-215 = ""
10008010-216 = "Поздно. Она уже бросила деньги внутрь."
10008010-217 = "..."
10008010-218 = "*бормочет*"
10008010-219 = ""
10008010-220 = "Готово! Я загадала желание!"
10008010-221 = "Эм, Харука, ты точно не пожалеешь, что отдала столько денег?"
10008010-222 = "А? А почему должна?"
10008010-223 = "Как я и сказала, я просто рада, что смогла помочь."
10008010-224 = ""
10008010-226 = ""
10008010-228 = "..."
10008010-229 = "[s] «Эм, тогда я, наверное, следующий.»"
10008010-230 = ""
10008010-232 = ""
10008010-233 = "[ns] Положить деньги в ящик для пожертвований."
10008010-236 = "[ns] «...»"
10008010-237 = "Теперь ты, Ару!"
10008010-238 = "Д-Да. Хм..."
10008010-239 = "Хорошо."
10008010-240 = ""
10008010-242 = ""
10008010-243 = "О?"
10008010-244 = "Кажется, теперь я понимаю, какой эффект хотела создать Ару."
10008010-245 = "Не поспоришь. От неё действительно исходит особая аура."
10008010-246 = "Понимаю, как демонстративно потратить огромную сумму, будто это пустяк, может выглядеть впечатляюще."
10008010-247 = "Ару выглядит такой величественной..."
10008010-248 = "..."
10008010-249 = ""
10008010-251 = "(Я-Я не могу! Что делать?!)"
10008010-252 = "(Каёко пожертвовала 50 000 иен?! И ради этого урезала свои увлечения и личные расходы?)"
10008010-253 = "(А Харука потом отдала 300 000 иен! С каких пор она работает по ночам на стройке?!)"
10008010-254 = "(Так вот почему она каждый день выглядит такой измотанной? Как она вообще может оправдывать трату таких денег на подобное?)"
10008010-255 = "(И как мне с ними тягаться?! Я принесла всего 5 000 иен.)"
10008010-256 = "(Что делать?! Я же босс!)"
10008010-258 = "Ару?"
10008010-259 = ""
10008010-261 = ""
10008010-262 = ""
10008010-263 = "*бросает*"
10008010-264 = "А? Она сделала это так быстро, что я даже не увидела, сколько она положила."
10008010-265 = "Наверное, она скрыла сумму, чтобы нам не было неловко из-за того, что мы пожертвовали меньше неё. Как заботливо."
10008010-266 = "Интересно, какое желание она загадала."
10008010-267 = ""
10008010-269 = ""
10008010-270 = ""
10008010-271 = "Босс?"
10008010-272 = "Ару?"
10008010-273 = "...!"
10008010-274 = "Ты плачешь?"
10008010-275 = ""
10008010-277 = ""
10008010-278 = ""
10008010-280 = "(Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится!)"
10008010-281 = "(Я сделаю что угодно! Здесь ведь должны исполнять желания, правда?! Тогда исполни это!)"
10008010-282 = "(Я не смогу снова посмотреть им в глаза, если «Решатель проблем» развалится после того, как я заставила их пожертвовать столько денег!)"
10008010-283 = ""
10008010-284 = "Ару уже почти посинела. О чём она там так молится?"
10008010-285 = "Кажется, я догадываюсь..."
10008010-288 = "Ну что ж. Видимо, я последняя."
10008010-289 = ""
10008010-291 = ""
10008010-292 = "Та-дам! 100 миллионов иен!"
10008010-293 = "*качает головой*"
10008010-294 = "Н-Невероятно!"
10008010-296 = "...?!"
10008010-297 = "[s] «Подожди. Эти купюры фальшивые?»"
10008010-299 = "Ага!"
10008010-300 = "Копить деньги — такая морока, поэтому я взяла их из настольной игры."
10008010-301 = ""
10008010-303 = ""
10008010-304 = "Хи-хи. Ну, была не была!"
10008010-305 = "П-Пождите-е-е-е!"
10008010-306 = "Что такое, Ару?"
10008010-307 = "Просто... тебе не кажется, что это немного перебор?"
10008010-308 = "Разве? Какая разница?"
10008010-309 = "Я-Я говорю, подумай хорошенько. А вдруг злой дух решит, что все эти деньги настоящие, и вселится в ящик для пожертвований?"
10008010-310 = "Злой дух?"
10008010-311 = "Подумай, что случится, если твоё желание исполнится наоборот — или наоборот исполнятся все желания, загаданные до твоего."
10008010-312 = "Хи-хи-хи. Ты о чём вообще?"
10008010-313 = "Ты же сама сказала, что это просто суеверия! Кто поверит во всяких злых духов?"
10008010-314 = "Ты слишком много думаешь, Ару!"
10008010-315 = "Ну серьёзно, что худшее может случиться? Ящик для пожертвований взорвётся или—"
10008010-316 = ""
10008010-319 = "О-Он взорвался!"
10008010-320 = "А-Ару, ты в порядке?!"
10008010-321 = "Ого! Не могу поверить, что это реально произошло! Откуда вообще взрыв?!"
10008010-322 = "Кто-то приближается!"
10008010-323 = ""
10008010-325 = ""
10008010-327 = "Ч-Что это?!"
10008010-328 = "В дыму кто-то есть!"
10008010-331 = ""
10008010-332 = "Хааааа!"
10008010-333 = ""
10008010-334 = "Бесконечный конвейер ведёт прямиком к справедливости!"
10008010-335 = ""
10008010-337 = ""
10008010-338 = "Бесконечный суши-отряд, Кайтенгеры, прибыл!"
10008010-339 = ""
10008010-341 = ""
10008010-342 = ""
10008010-343 = "Это часть мероприятия или что?"
10008010-345 = "А теперь вас, злодеи, настигнет правосудие!"
10008010-346 = "Нас? Может, сначала хоть объясните что-нибудь?"
10008010-347 = "Впрочем, неважно."
10008010-348 = "Давайте!"
