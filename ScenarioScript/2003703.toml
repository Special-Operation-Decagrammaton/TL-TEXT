[translation]
2003703-1 = "Полицейская история: эпизод на ленивой реке"
2003703-2 = ""
2003703-3 = "О, Сенсей! Вы пришли патрулировать вместе со мной?"
2003703-4 = "Как хорошо, что вы здесь! Вдвоём будет в два раза веселее... то есть, мы сможем патрулировать вдвое тщательнее!"
2003703-5 = "Вообще-то я, конечно, не позволила бы гражданскому участвовать в патрулировании, но для вас сделаю исключение!"
2003703-6 = "[s1] «Тогда зачем тебе надувной круг?»\n[s2] «Так ты работаешь или...?»"
2003703-9 = "Этот надувной круг — важная часть моих обязанностей спасателя."
2003703-10 = "Подумайте сами. Сегодня мне поручено патрулировать весь парк."
2003703-11 = "А для этого мне нужно средство передвижения."
2003703-12 = "[s] «То есть ты собираешься плавать по кругу?»"
2003703-13 = "Вот именно!"
2003703-14 = "Вокруг всего парка идёт безумно длинная ленивая река."
2003703-15 = "Мне нужно просто лечь в круг и плыть по течению. Даже грести и уставать не придётся."
2003703-16 = "Я всегда мечтала об автоматической системе патрулирования, и лучше этого уже ничего не придумать!"
2003703-17 = "[s3] «...То есть ты просто собираешься развлекаться.»\n[s4] «Разве это не обычное купание?»"
2003703-20 = "И-и-и что именно вы хотите этим сказать? Это часть моих официальных обязанностей!"
2003703-21 = "Просто так совпало, что обязанность очень классная и приятная."
2003703-22 = "Начнём патрулирование? Мне только нужно на секунду опустить этот круг и..."
2003703-23 = ""
2003703-25 = ""
2003703-26 = ""
2003703-27 = "Хоп! Поехали!"
2003703-28 = ""
2003703-30 = ""
2003703-31 = ""
2003703-33 = "...А?"
2003703-36 = "― [log=후부키 수영복]А? Что за...?[/log][wa:1470]"
2003703-39 = "― [log=후부키 수영복]И-и-ик![/log][wa:1210]"
2003703-40 = "― [log=후부키 수영복]...Агх![/log][wa:3710]"
2003703-43 = "― [log=후부키 수영복]А, он не снимается...[/log][wa:1870]"
2003703-44 = "― [log=후부키 수영복]Мне теперь всю жизнь так жить...?[/log][wa:2870]"
2003703-47 = "― [log=후부키 수영복]Эй, Сенсей?[/log][wa:1810]"
2003703-48 = "― [log=후부키 수영복]Поможете немного?[/log][wa:1060]"
2003703-51 = "― [log=후부키 수영복]Я перестану отлынивать и[/log]"
2003703-52 = "― [log=후부키 수영복]буду работать ещё усерднее...[/log][wa:2570]"
2003703-55 = "― [log=후부키 수영복]Я даже отдам вам пончики, которые прятала![/log][wa:940]"
2003703-58 = "― [log=후부키 수영복]А-а![/log]"
2003703-59 = "― [log=후부키 수영복]Хватать меня сзади — это, конечно, один способ...[/log][wa:2080]"
2003703-62 = "В конце концов мне удалось вытащить Фубуки из круга."
2003703-63 = ""
2003703-64 = "*тяжело дышит* *тяжело дышит*"
2003703-65 = "Я уже думала, что оттуда не выберусь."
2003703-66 = "Некоторое время я больше так делать не буду..."
2003703-67 = "[s] «Значит, будешь патрулировать пешком?»"
2003703-68 = "Пешком... Какая морока."
2003703-69 = ""
2003703-71 = ""
2003703-72 = ""
2003703-73 = "Может, вместо круга использовать спасательный жилет."
2003703-75 = "Я патрулировал парк вместе с Фубуки, которая всё время пыталась отлынивать от работы."
