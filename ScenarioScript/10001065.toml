[translation]
10001065-1 = "Эпизод 6; Вторая победа!"
10001065-2 = "Библиотека Академии Красной Зимы"
10001065-3 = "Уф, я проиграла..."
10001065-4 = "И «Роза Бастилии: ограниченное издание к 30-летию» теперь в руках этой невежественной мелкой соплячки..."
10001065-5 = "Настоящий бисер перед свиньями..."
10001065-6 = "Прости меня, цивилизованное общество. Я тебя подвела."
10001065-7 = "Хватит драматизировать! И я же сказала, что я не мелкая соплячка!"
10001065-8 = ""
10001065-10 = ""
10001065-11 = "...Вот. Забирай книгу. Она мне больше не нужна."
10001065-12 = "А? Но ещё пару минут назад ты так настаивала, что будешь на ней спать..."
10001065-13 = "После драки с тобой я слишком разгорячилась. Сон придётся отложить."
10001065-14 = "К тому же эта книга тебе явно очень дорога, так что... оставь её себе."
10001065-15 = "Президент Черино..."
10001065-16 = "Эта книга правда настолько ценная?"
10001065-17 = ""
10001065-18 = "Конечно!"
10001065-19 = "Как я уже сказала, это ограниченное издание к 30-летию «Розы Бастилии». Всего напечатали сто экземпляров, поэтому достать его очень трудно."
10001065-20 = "Кроме того, дополнительная история в приложении есть только в этой версии. Любой поклонник оригинала душу бы продал за такую книгу!"
10001065-21 = ""
10001065-22 = "Разумеется, это всего лишь копия. Оригинал выставлен в Великой библиотеке Тринити."
10001065-23 = "Эх. Хватит смотреть на меня щенячьими глазами, я уже всё поняла!"
10001065-24 = "Но если оригинал в Тринити, почему бы тебе не сходить и не посмотреть на него лично, вместо того чтобы так носиться с копией?"
10001065-25 = ""
10001065-26 = "Ну, посторонним нет доступа к книгам в библиотеке Тринити."
10001065-27 = ""
10001065-28 = "Раз мы студенты Красная Зима, нам остаётся довольствоваться своей копией..."
10001065-29 = "Знай же кое-что, моя дорогая Момидзи."
10001065-32 = "Пока я стою во главе нашей академии Красная Зима, нет ничего невозможного!"
10001065-33 = "Если библиотека Тринити закрыта для студентов других академий, значит, нам просто придётся завоевать Тринити General School!"
10001065-34 = "Пусть Фронт освобождения знаний присягнёт мне на верность, и я обещаю открыть вам царство книг, которое до сих пор было недосягаемо!"
10001065-35 = ""
10001065-36 = "В-вы правда это говорите, президент?"
10001065-37 = "Конечно! Под моим руководством все академии Кивотоса — Геенна, Миллениум, Хяккияко и какие угодно ещё — падут перед нами!"
10001065-38 = "Но первый шаг к этому славному будущему — выгнать товарища Марину из секретариата, чтобы я снова стала президентом..."
10001065-39 = "Мы последуем за вами до самого конца! То есть, пожалуйста, позвольте нам следовать за вами, президент Черино!"
10001065-40 = "Не могу поверить, что даже Фронт освобождения знаний умоляет разрешить им следовать за вами... Вы просто невероятны, президент!"
10001065-41 = "Хех. А я что говорила? Никто не может устоять перед неоспоримой харизмой великой Черино!"
10001065-42 = "Итак, что делать с Мариной? Может, вытащить её из секретариата и бросить в ледяное озеро за кампусом?"
10001065-43 = "Или щекотать всю ночь, пока она не сдастся и больше никогда не посмеет устроить переворот?"
10001065-44 = "Ч-что за...? Погодите, даже я бы не додумалась до такой жестокости!"
10001065-45 = "Давайте решим всё как цивилизованные люди!"
