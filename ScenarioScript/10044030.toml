[translation]
10044030-1 = "Эпизод 3;Снова на поиски пропавшего поезда"
10044030-2 = "На другой станции"
10044030-4 = ""
10044030-5 = "Погоди, он ОПЯТЬ отправился автоматически?!"
10044030-6 = "М-Мы тоже не знаем почему. Этого поезда сегодня даже не было в расписании..."
10044030-8 = "Полный промах."
10044030-9 = "В-Видите, что я имела в виду насчёт ожиданий?"
10044030-10 = ""
10044030-11 = "[ns] «Вы случайно не знаете, к какой станции он направился?»"
10044030-13 = "Д-Дайте посмотрю записи... Учтите, его будет трудно поймать, если он продолжит так делать..."
10044030-15 = "Ух, отстой. Время заканчивается."
10044030-16 = "Пока всё нормально. Найдём его, а потом на полной скорости до пункта назначения. Успеем."
10044030-17 = "...Ага. Придётся."
10044030-19 = ""
10044030-21 = ""
10044030-22 = ""
10044030-24 = "З-Здесь написано, что поезд движется по линии на север...!"
10044030-25 = "...Где нет рельсов метро."
10044030-26 = "Туда идёт автобус."
10044030-27 = "У-у-уф, только не автобус..."
10044030-29 = "Выбора нет. Надо разобраться с этим, пока начальство не заметило."
10044030-30 = "Живо-живо. Ша-ша-ша-а."
10044030-37 = ""
10044030-39 = "..."
10044030-40 = "..."
10044030-42 = "Автобус ОПОЗДАЛ?!"
10044030-43 = "Давайте ползком! Так быстрее!"
10044030-44 = "Почему они всегда опаздывают именно тогда, когда особенно нужны?"
10044030-46 = "..."
10044030-47 = "[s1] «Аоба, ты плохо выглядишь.»\n[s2] «Ты в порядке?»"
10044030-50 = "А, да, я... Я в порядке..."
10044030-51 = "..."
10044030-52 = "Просто... м-меня сильно укачивает..."
10044030-53 = ""
10044030-55 = ""
10044030-56 = "Укачивает?"
10044030-57 = "Д-Да... От всего, что едет по дороге, у меня кружится голова..."
10044030-58 = "Ух... Даже от одной мысли уже становится... Ух..."
10044030-59 = ""
10044030-61 = ""
10044030-63 = "А, вот почему поезда лучше. В них почти никогда не укачивает."
10044030-64 = "*Тяжёлое дыхание* *Тяжёлое дыхание*"
10044030-65 = "Я-я знаю... Это одна из причин, почему я поступила в Хайлендер..."
10044030-66 = ""
10044030-67 = "[ns3] «Даже короткая поездка для тебя звучит тяжело.»\n[ns4] «Если хочешь, я могу сходить за лекарством, а ты подождёшь здесь.»"
10044030-70 = ""
10044030-74 = "О, вот он! Автобус! Сильно опоздал, но приехал!"
10044030-75 = "Не переживайте за меня, Сенсей. Автобус уже здесь, а времени у нас нет."
10044030-76 = "Я-я справлюсь... Пойдём!"
10044030-77 = "[s] «Если станет слишком плохо, просто скажи мне.»"
10044030-78 = "Х-Хорошо..."
10044030-79 = ""
10044030-81 = ""
10044030-82 = ""
10044030-84 = ""
10044030-85 = "Почему вы так опоздали? Мы ждали на пять минут дольше положенного!"
10044030-86 = "Вахаха! Простите. Пробки есть пробки, знаете ли?"
10044030-87 = "А ещё по дороге сюда какая-то байкерская банда перекрыла улицу!"
10044030-89 = "Поезд всё-таки намного лучше..."
10044030-90 = "Вот именно! Один прямой путь, и ничего не мешает."
10044030-91 = "Эй, и у поездов, и у автобусов есть свои плюсы и минусы."
10044030-92 = "Вообще-то я обычно не вижу студентов Хайлендер в автобусе..."
10044030-93 = "[s5] «Мы торопимся.»\n[s6] «Скажем так: мы в ваших руках.»"
10044030-96 = "Вы их опекун? Что ж, куда бы вы ни ехали, я вас доставлю! Вахаха!"
10044030-98 = ""
10044030-100 = ""
10044030-101 = ""
10044030-102 = ""
10044030-103 = ""
10044030-104 = ""
10044030-105 = ""
10044030-106 = "Если тебя сейчас вырвет, я могу похлопать тебя по спине."
10044030-107 = "М-Меня не вырвет..."
10044030-109 = "Форма Хикари 108: Тысяча молотов, вперёд!"
10044030-111 = ""
10044030-113 = ""
10044030-114 = ""
10044030-115 = ""
10044030-116 = "А-Ай... П-Прекрати...! То есть... это не больно, но меня от тебя ТОЧНО сейчас стошнит..."
10044030-117 = "Угх."
10044030-119 = "Пахяхя! У меня есть пластиковые пакеты, если тебе нужен!"
10044030-120 = "[ns] «Аоба, если будешь смотреть в окно и глубоко дышать, станет легче.»"
10044030-121 = "*вдох* *выдох* Мир и правда... полон страданий..."
10044030-122 = "У вас там всё нормально?"
10044030-123 = "Её сейчас вырвет!!"
10044030-124 = "Нет! ...Хотя может и..."
10044030-125 = "Можем не обсуждать это?!"
10044030-126 = "У-у-ух, от злости только хуже..."
10044030-128 = "Хаха, потерпи ещё совсем немного."
10044030-129 = "Постараюсь вести как можно плавнее!"
10044030-130 = "У меня идея. Давайте доберёмся туда как можно быстрее! Со скоростью света!"
10044030-131 = "Не могу. Есть такое правило — безопасная дистанция."
10044030-132 = "О, почти как в поезде!"
10044030-133 = "Ага, только в отличие от поездов автобусу приходится останавливаться каждые несколько кварталов."
10044030-134 = "Зато так проще садиться и выходить."
10044030-135 = "И вообще, вы жалуетесь на автобус, пока едете в автобусе. Хаха."
10044030-136 = "Пахяхя, тут ты меня подловил!"
10044030-137 = ""
10044030-142 = "А, чёрт, опять эта байкерская банда."
10044030-143 = "Эй, мелюзга, вы же поубиваетесь! Убирайтесь с дороги!"
10044030-144 = "Заткнись! Это наша дорога! Отвали!"
10044030-145 = "Ах вы мелкие... Ур-р-р!"
10044030-146 = "Президент звонит... Жми на газ!"
10044030-147 = "[ns] «Мы тут застрянем...»"
10044030-148 = "Эй вы, УБЕРИТЕСЬ с ДОРОГИ! Мы торопимся!"
10044030-149 = "Всё. Нам конец."
10044030-150 = "*вздох* Серьёзно. Ничего не поделать."
10044030-152 = "..."
10044030-153 = "Ещё похлопать по спинке?"
10044030-154 = "Пожалуйста, не надо... *вдох* *выдох*"
10044030-155 = ""
10044030-157 = "Я не понимаю, откуда вообще берутся пробки. Почему все просто не едут одновременно?"
10044030-158 = "Аоба, ты второкурсница. Что думаешь?"
10044030-159 = "Не разговаривай со мной сейчас... *вдох* *выдох*"
10044030-160 = "[s] «Ты точно выдержишь до конца поездки, Аоба?»"
10044030-161 = "Да, думаю. Если вы сможете отогнать ОТ МЕНЯ ИХ."
10044030-162 = "По крайней мере водитель держит слово и ведёт плавно..."
10044030-164 = "Вы сказали, что работа по доставке НАША! Так какого чёрта всё закончилось вот так?!"
10044030-165 = ""
10044030-166 = "Ха-ха, ты и сама знаешь ответ."
10044030-167 = "Из-за вашего безбашенного вождения посылки приезжают по частям, либо вам на хвост садится Валькирия."
10044030-168 = "Тц..."
10044030-169 = "Н-Но мы быстрее!"
10044030-170 = "Мы неуловимые преступницы улиц!"
10044030-171 = "Это правда."
10044030-172 = "Но на этот раз мне нужны надёжность и стабильность."
10044030-173 = "Поэтому — железнодорожная перевозка. Самый безопасный вариант. Хи-хи..."
10044030-174 = "Чёрт... МЫ проиграли поезду? Мы?"
10044030-175 = "Сделка закрыта. Нам больше нечего обсуждать."
10044030-176 = "П-Погодите! По—"
10044030-177 = ""
10044030-179 = ""
10044030-180 = "Гах! Не могу поверить!"
10044030-181 = "Мы так старались ради этой работы...!"
10044030-182 = ""
10044030-186 = ""
10044030-187 = "К-Кэп... Ты в порядке...?"
10044030-188 = "Я не «Кэп.» Зови меня «Президент»!!"
10044030-189 = "Ик! П-Простите... П-Президент!"
10044030-190 = "...Ладно, что у тебя?"
10044030-191 = "Я-я созываю всех, как вы сказали. Что дальше?"
10044030-192 = "..."
10044030-193 = "Теперь у нас остался только один ход."
10044030-194 = "Что?"
10044030-195 = ""
10044030-197 = ""
10044030-199 = "Вернуть упущенную возможность."
10044030-201 = "О-о...! Я не поняла, но звучит круто!"
10044030-202 = "Эти мелкие соплячки увели работу прямо у нас из-под носа. Я её верну и заставлю их заплатить!"
10044030-205 = ""
10044030-206 = "Эй, девчонки из Хайлендер! Вы говорили, это ваша остановка, да?"
10044030-207 = "Ага, приехали! Пахяхя!"
10044030-208 = "Время искать поезд!"
10044030-209 = ""
10044030-210 = "[ns] «Как ты себя чувствуешь, Аоба?»"
10044030-212 = "Н-Наконец-то всё закончилось... *вдох* *выдох*"
10044030-213 = "Молодец, что сдержалась. А то у нас был бы ЕЩЁ один бардак!"
10044030-214 = "С-Спасибо... водитель автобуса... что были так внимательны..."
10044030-215 = "Вахаха, без проблем! Я всегда слежу, чтобы все добрались куда надо целыми и невредимыми!"
10044030-216 = "Ну и что думаете? Не хуже поезда, правда?"
10044030-217 = "Э-Это... действительно..."
10044030-218 = "А, но если бы вы поехали на поезде, тебя бы вообще не укачало."
10044030-219 = "И там есть туалеты!"
10044030-220 = "У-У вас двоих ВООБЩЕ есть социальные навыки?"
10044030-221 = ""
10044030-223 = ""
10044030-224 = "В любом случае я всё ещё больше люблю поезда, но автобусы, может, и не так плохи. Пахяхя!"
10044030-225 = "Ещё бы поехала. Пока, водитель!"
10044030-226 = "Хаха, надеюсь увидеть вас снова!"
10044030-227 = ""
10044030-228 = "[ns] «Спасибо, господин водитель!»"
10044030-232 = "Теперь хочешь похлопываний по спинке?"
10044030-233 = "Ты же просто издеваешься надо мной, да?"
10044030-235 = "Давайте! Нам ещё поезд ловить!"
