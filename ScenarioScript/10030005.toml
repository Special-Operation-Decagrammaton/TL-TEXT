[translation]
10030005-162 = "#video;10030"
10030005-1 = "Пролог;Новогоднее решение"
10030005-2 = "Хакерская комната Веритас"
10030005-4 = ""
10030005-5 = ""
10030005-7 = "Маки, мне тут выпадают только обычные блоки. Думаю, в этом участке ресурсы закончились."
10030005-8 = "Ага... Похоже, мы уже нашли всё стоящее."
10030005-9 = "Котама, как у тебя дела с логической схемой?"
10030005-10 = ""
10030005-12 = ""
10030005-14 = ""
10030005-16 = "...Сложнее, чем я ожидала. После нового обновления система изменилась, поэтому нам не хватает некоторых важных ресурсов."
10030005-17 = "Переделывать всё будет непросто."
10030005-18 = "Возможно, мы взялись за слишком многое, пытаясь закончить всё до конца года."
10030005-19 = "Если сейчас сдадимся, все усилия, которые мы вложили, чтобы добраться до этого момента, пропадут зря."
10030005-21 = "Ага. Я зайду сегодня вечером, чтобы—"
10030005-22 = ""
10030005-29 = ""
10030005-30 = "Все..."
10030005-31 = ""
10030005-33 = ""
10030005-34 = "А, Чихиро! Привет!"
10030005-35 = "Здравствуйте, вице-президент. Вас давно не было в клубной комнате."
10030005-36 = "Так давно, что я уже почти забыла, как выглядит ваше лицо."
10030005-38 = "Ничего не поделать. Из-за конца финансового года довольно много компаний наняли меня для консультаций по безопасности."
10030005-39 = ""
10030005-41 = ""
10030005-42 = ""
10030005-43 = "Но всё же, почему никто из вас не отвечает на телефон?"
10030005-44 = "Только сегодня я звонила вам три раза, и никто не ответил. Я даже отменила встречу, чтобы прийти проверить вас, потому что забеспокоилась."
10030005-45 = ""
10030005-48 = ""
10030005-49 = ""
10030005-50 = ""
10030005-51 = "О... Тут и правда много пропущенных уведомлений."
10030005-52 = "Прости. Мы были так заняты, что я, наверное, забыла проверить телефон."
10030005-54 = "Мы работаем над этим уже больше суток. Кажется, будто солнце взошло всего минуту назад..."
10030005-55 = "Но вся наша работа оказалась бы бессмысленной, если бы мы сбились с темпа."
10030005-57 = "...У вас горит какой-то дедлайн?"
10030005-58 = "А, вы выполняли проверки безопасности к концу года, которые я закрепила на доске клуба?"
10030005-59 = "Проверить компьютеры академии на уязвимости — действительно хорошая идея. Сейчас довольно много червей и вирусов гуляет на свободе."
10030005-60 = "Я горжусь тем, что вы наконец встали на путь праведных белых хакеров—"
10030005-62 = "Эм, так..."
10030005-63 = "Мы не проводили проверки безопасности."
10030005-64 = ""
10030005-66 = ""
10030005-68 = "Мы установили новый мод для Mineral Craft!"
10030005-69 = ""
10030005-72 = ""
10030005-73 = "...Что?"
10030005-74 = "Ну знаешь, Mineral Craft? Сейчас это самая популярная песочница в Кивотосе."
10030005-75 = "Конечно, я знаю, что такое Mineral Craft..."
10030005-76 = "Но зачем играть в неё, если у вас есть срочная работа, которую нужно закончить?"
10030005-77 = "Ну, один из крупнейших авторов модов для Mineral Craft несколько дней назад выпустил новое обновление."
10030005-78 = "Там добавили новые виды руды для создания снаряжения высокого уровня и целую логическую систему для построения схем!"
10030005-80 = "Давно не выходило такого крупного обновления, поэтому нам нужно время, чтобы полностью всё изучить."
10030005-81 = "...Как члены Веритас, мы обязаны собрать полезную информацию и распространить её по академии."
10030005-82 = "Ага! Это важнейшая миссия Веритас!"
10030005-83 = ""
10030005-85 = ""
10030005-87 = ""
10030005-88 = "Иными словами..."
10030005-89 = "Вы так увлеклись видеоигрой, что пропустили все мои звонки?"
10030005-90 = ""
10030005-92 = ""
10030005-93 = "Я бы не стала формулировать именно так, но..."
10030005-94 = ""
10030005-97 = ""
10030005-98 = "Вы собираетесь всю оставшуюся жизнь бездельничать здесь?"
10030005-99 = "Я понимаю, сегодня выходной, но каждый день напролёт только играть в видеоигры... Это нездорово!"
10030005-101 = "Ой-ой, она опять читает нам нотации..."
10030005-102 = "Обещаем, как только закончим тестировать новый мод, вернёмся к нашему обычному образу жизни и—"
10030005-103 = "И чем это отличается от вашего обычного образа жизни?"
10030005-104 = "Вы каждый день едите еду быстрого приготовления... Почти не двигаетесь..."
10030005-105 = "Не думайте, что я не знаю, как наш клуб выступил на последнем спортивном дне."
10030005-106 = "Впереди у нас целый новый год, так почему бы не выйти на улицу? В этом году мы все можем сосредоточиться на исправлении нездоровых привычек."
10030005-107 = "У нас уже всё схвачено!"
10030005-108 = "Мы были заняты, но всё равно успели придумать идеальный план на Новый год!"
10030005-109 = "...Вот как? И что же именно входит в этот план?"
10030005-110 = ""
10030005-112 = ""
10030005-113 = ""
10030005-114 = "Очевидно, нам нужно встретить первый рассвет нового года!"
10030005-115 = ""
10030005-118 = ""
10030005-119 = "...Хм. Не ожидала, что вы запланируете что-то настолько физически активное."
10030005-120 = "Не возражаете, если я присоединюсь? Давно мы ничего не делали всей компанией. Где собираетесь смотреть рассвет?"
10030005-121 = "На Восточных равнинах, конечно! Я каждый год туда хожу!"
10030005-122 = "...Восточные равнины? Я не знаю такого места в Кивотосе."
10030005-124 = "Потому что Восточные равнины — это локация в World of Archive, любимой MMORPG Маки. Она главный рекрутер нашей гильдии."
10030005-125 = "В симулированном мире World of Archive солнце каждое утро восходит в 6 часов. Поэтому в первый день нового года игроки собираются на Восточных равнинах, чтобы посмотреть игровой рассвет."
10030005-126 = ""
10030005-127 = "Игроки всех фракций хотят увидеть рассвет, поэтому перед ним каждый год проводится PVP-событие!"
10030005-128 = "Никогда не забуду, как в прошлом году наша гильдия уничтожила главных соперников сервера. Мы победили их последних бойцов и встали в победную позу как раз в тот момент, когда солнце показалось над горизонтом..."
10030005-129 = ""
10030005-132 = ""
10030005-133 = "(Надо что-то делать... Такими темпами они и весь следующий год проведут в безделье...)"
10030005-134 = ""
10030005-136 = ""
10030005-137 = "Все, освободите расписание на последний день года."
10030005-138 = ""
10030005-141 = ""
10030005-142 = ""
10030005-143 = "Э-э?! А я собиралась всю ночь охотиться в World of Archive!"
10030005-145 = "Считайте это приказом вице-президента. Все без исключения должны быть перед клубной комнатой к девяти утра."
10030005-147 = "Если это приказ вице-президента..."
10030005-148 = "У меня тогда ничего особенного не запланировано... Но зачем собирать всех вместе?"
10030005-150 = "Я поняла, что совершила ошибку, полностью погрузившись в работу в ущерб клубу. Вы все слишком увлеклись виртуальным миром и совсем забыли о том, что находится за пределами монитора."
10030005-151 = ""
10030005-153 = ""
10030005-154 = "Так что в этом году мы все пойдём смотреть настоящий рассвет!"
10030005-155 = ""
10030005-158 = ""
10030005-160 = "Ч-что?!"