[translation]
10011065-8 = "Хе-хе-хе. Молодцы, все! Вы прошли!"
10011065-9 = ""
10011065-11 = ""
10011065-12 = "Ниндзюцу безмыслия сработало...!"
10011065-13 = "Отлично, Цукуё!"
10011065-14 = "К-Какое облегчение...!"
10011065-16 = "Я только сейчас поняла. Она не читает мысли. Она просто отлично считывает и понимает эмоции других людей."
10011065-17 = "И то, что произошло раньше, было лишь продолжением этого."
10011065-18 = "[s] «Логично. У Мимори доброе сердце, и она всегда думает о других.»"
10011065-19 = "О, боже. Спасибо за добрые слова, Сенсей."
10011065-20 = "Ну конечно, вся эта история с чтением мыслей — просто часть представления."
10011065-21 = "На самом деле читать чужие мысли невозможно!"
10011065-22 = "Ещё раз поздравляю Исследовательский клуб ниндзюцу с прохождением испытания!"
10011065-23 = "Мы закончили? Отлично. Уходим отсюда."
10011065-24 = "О, но Мичиру."
10011065-25 = "Эм... да?"
10011065-26 = "Я всего лишь добровольная актриса на этом мероприятии, поэтому, возможно, мне не стоит высказывать своё мнение."
10011065-27 = "Но настоящая леди никогда не молчит, если совет действительно нужен."
10011065-28 = "Мичиру, меня действительно тронула твоя доброта. Но тебе стоит верить в силу своих любимых товарищей по клубу."
10011065-29 = "...Силу?"
10011065-30 = "Да, верно."
10011065-31 = "Что ты имеешь в виду?"
10011065-32 = "Главное, что мы прошли испытание. Чего все ждут?"
10011065-33 = "Нам нужно добраться до Ибуки."
10011065-34 = "О. Эм, да..."
10011065-35 = "Всем удачи! О, и ещё кое-что!"
10011065-36 = ""
10011065-38 = ""
10011065-39 = "Сенсей! Нехорошо предаваться таким мыслям с самого утра, ясно?"
10011065-40 = "[s3] «Опять же, это всё очень несправедливо!»\n[s4] «Мы ещё поговорим об этом позже, хорошо?!»"
