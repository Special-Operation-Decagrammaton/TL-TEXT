[translation]
1601403-1 = "Пикник с Ибуки!"
1601403-2 = "Привет, Сенсей! Вы скучали по Ибуки, пока её не было?"
1601403-3 = "[s1] «Да, без тебя было немного одиноко.»\n[s2] «Я с нетерпением ждал нашей встречи.»"
1601403-6 = "Ой, так не пойдёт!"
1601403-7 = "Макото говорит, что настоящая храбрость — это когда приходится стоять совсем одному."
1601403-8 = "Но когда она так говорит, Ибуки всё равно стоит рядом с ней. Хи-хи."
1601403-9 = "В общем! Всё будет хорошо, Сенсей. Ведь теперь Ибуки здесь!"
1601403-10 = "[s] «Конечно! А ещё вот. Я купил пудинг в честь твоего возвращения!»"
1601403-11 = "Ура! Спасибо!"
1601403-12 = "[s] «Хочешь съесть его в комнате отдыха?»"
1601403-13 = "Ага!"
1601403-14 = ""
1601403-15 = "Спасибо за угощение!"
1601403-16 = ""
1601403-18 = ""
1601403-19 = ""
1601403-20 = ""
1601403-22 = "Настоящий рай для тех, кому наскучили серые будни!"
1601403-23 = ""
1601403-25 = ""
1601403-26 = "Лучший парк развлечений во всём Кивотосе! Добро пожаловать в Galactic Studio Кивотос!"
1601403-27 = "Волшебный день для друзей и всей семьи! Только в Galactic Studio Кивотос!"
1601403-28 = "..."
1601403-29 = "[s] «Ибуки, ты пудинг проливаешь.»"
1601403-30 = "..."
1601403-31 = ""
1601403-33 = ""
1601403-34 = "[ns] «...Эй, Ибуки, хочешь сходить в парк развлечений?»"
1601403-35 = "А?! Правда?! Ибуки можно?"
1601403-36 = "Ой, но Макото сказала..."
1601403-37 = "«На парк развлечений можно раскошелиться только в самые важные дни!»"
1601403-38 = "[s] «Ну... Сегодня ты пришла навестить меня в Шале. По-моему, это достаточно важный день. А я всё-таки Сенсей, так что...!»"
1601403-39 = ""
1601403-41 = ""
1601403-42 = "Тогда Ибуки хочет пойти!"
1601403-43 = "Сводите Ибуки в парк развлечений!"
1601403-44 = "Ибуки хочет покататься на каруселях и посмотреть парад вместе с Сенсеем!"
1601403-45 = "[s3] «Тем более надо идти!»\n[s4] «Тогда давай сейчас соберёмся, а завтра отправимся в парк развлечений?»"
1601403-48 = "Ура! Сенсей, вы самый лучший!"
1601403-49 = "А! А! Нам нужно купить билеты! И собрать обед!"
1601403-50 = "[s] «Билеты купит Сенсей. За них не переживай.»"
1601403-51 = "Тогда Ибуки соберёт нам обед! Ибуки в этом настоящий эксперт!"
1601403-52 = "Пойдём купим продукты, Сенсей!"
1601403-54 = ""
1601403-55 = "На обед можно взять любимую еду Ибуки!"
1601403-56 = ""
1601403-58 = ""
1601403-59 = ""
1601403-60 = ""
1601403-61 = ""
1601403-62 = "Мармеладных мишек, апельсиновые конфеты, карамель, а на десерт... пудинг!"
1601403-63 = "[s5] «Эм, Ибуки. Всё это звучит вкусно, но...»\n[s6] «Может, на обед сделаем онигири? Хорошо?»"
1601403-66 = "Хорошо! Онигири тоже вкусные!"
1601403-67 = "Ироха сказала, что онигири Ибуки довольно вкусные, так что Ибуки уверена — Сенсею понравится!"
1601403-68 = "[s] «Правда? Тогда буду ждать с нетерпением.»"
1601403-69 = "Обязательно ждите!"
1601403-71 = "Купив все нужные продукты, мы отправились на кухню Шале."
1601403-73 = "Ну что, Сенсей. Пора готовить!"
1601403-74 = ""
1601403-76 = ""
1601403-77 = ""
1601403-78 = "Сначала вот так лепим рис. Потом кладём внутрь мармеладных мишек. А потом сжимаем, сжимаем..."
1601403-79 = "[s] «М-Мармеладных мишек?!»"
1601403-80 = "Ага! Онигири с мармеладными мишками! Ирохе очень понравились!"
1601403-81 = "[s7] «Понятно! К-Какое необычное блюдо!»\n[s8] «М-м! А Сенсею можно ещё один — с маринованной сливой, Ибуки?!»"
1601403-84 = "Сенсею такие нравятся? Конечно!"
1601403-85 = ""
1601403-87 = ""
1601403-88 = ""
1601403-89 = "Та-да! Готово! Сенсей, а теперь попробуйте сделать один сами!"
1601403-90 = "[s] «Хорошо. Сначала просто слепим рис...»"
1601403-91 = "Ага! Вот так! Молодец!"
1601403-92 = "Ибуки сделает для Сенсея один особенно большой!"
1601403-93 = "И ещё..."
1601403-94 = ""
1601403-96 = ""
1601403-97 = ""
1601403-98 = "Готово!"
1601403-99 = "[s] «Выглядят очень вкусно! Можно один попробовать?»"
1601403-100 = "Нет! Нельзя! Мы будем есть их завтра в парке развлечений!"
1601403-101 = "Так что потерпите до завтрашнего пикника!"
1601403-104 = "Но на следующий день..."
1601403-105 = ""
1601403-109 = ""
1601403-110 = "Хм..."
1601403-111 = "Похоже, дождь не собирается прекращаться... А Ибуки так хотела пойти с Сенсеем в парк развлечений..."
1601403-112 = "Ибуки хотела покататься на карусели, посмотреть парад, пообедать и—"
1601403-113 = ""
1601403-115 = ""
1601403-116 = "У-у-у... *всхлип*..."
1601403-117 = "[s] «...Ибуки!»"
1601403-118 = "Д-Да?"
1601403-119 = ""
1601403-122 = "А? Сенсей, зачем вы расстилаете на полу коврик для пикника?"
1601403-123 = "[s] «Ибуки. В тот момент, когда я расстелил этот коврик, нас телепортировало в парк развлечений.»"
1601403-125 = "[ns] «Итак, Ибуки! Добро пожаловать в парк Шале!»"
1601403-126 = "...Парк Шале?"
1601403-127 = "[s9] «Мы не можем поехать в Galactic Studio...»\n[s10] «Так что сегодня давай превратим Шале в наш собственный парк развлечений!»"
1601403-130 = "Шале... как парк развлечений?"
1601403-131 = "[s11] «Именно! Ну что, начнём наш пикник в парке развлечений?»\n[s12] «Готова обедать, Ибуки?»"
1601403-134 = "То есть Ибуки просто снимает обувь и садится на коврик?"
1601403-135 = ""
1601403-139 = "Ух ты! И правда как настоящий пикник!"
1601403-140 = "[s] «Проголодалась, Ибуки?»"
1601403-141 = "Ещё как, Сенсей!"
1601403-142 = ""
1601403-144 = ""
1601403-147 = ""
1601403-148 = "Вот, давайте съедим онигири, которые мы сделали!"
1601403-149 = ""
1601403-151 = ""
1601403-152 = "..."
1601403-153 = "[s] «...На них муравьи не залезли?»"
1601403-154 = "...Нет, но... точно можно?"
1601403-155 = "[s] «Что именно можно?»"
1601403-156 = "Но Ибуки делала эти онигири, чтобы съесть их в Galactic Studio."
1601403-157 = "Сенсей, вы точно хотите съесть их в... парке Шале?"
1601403-158 = "[s13] «Да. Неважно, где ты ешь. Важно, с кем.»\n[s14] «Мы ведь оба старались, когда готовили этот обед, правда?»"
1601403-161 = "..."
1601403-162 = "Да! Вы правы!"
1601403-163 = "Пока Ибуки вместе с Сенсеем, Ибуки может есть где угодно!"
1601403-165 = "Мы с Ибуки чудесно провели вторую половину дня, играя со всеми игрушками и играми, которые мог предложить «парк Шале»."
