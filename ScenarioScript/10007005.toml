[translation]
10007005-1 = "Пролог;Один день из жизни спецотряда №227"
10007005-2 = "Руины возле спецотряда №227"
10007005-4 = "Угх. Почему она не вытаскивается?!"
10007005-5 = ""
10007005-7 = ""
10007005-8 = "Я так... ужасно близко!"
10007005-9 = ""
10007005-12 = ""
10007005-13 = "Нодока, я принесла тебе горячего какао."
10007005-14 = "О, Шигурэ!"
10007005-15 = "Я как раз думала о горячем напитке, чтобы согреть замёрзшие руки и ноги... Спасибо!"
10007005-16 = ""
10007005-18 = ""
10007005-19 = ""
10007005-20 = ""
10007005-21 = "Я думала, мои руки сейчас отмёрзнут."
10007005-22 = "Сладкое, сладкое тепло какао разливается по всему телу..."
10007005-23 = "Напоминает нашу счастливую жизнь в главном корпусе. Помнишь, когда мы могли пить какао сколько хотели?"
10007005-24 = "Когда же мы сможем вернуться в главный корпус?"
10007005-25 = "Ты слишком переживаешь. Президент Черина сняла наше отстранение на прошлом фестивале, помнишь?"
10007005-26 = "Просто потерпи, когда-нибудь она за нами придёт."
10007005-27 = "Нет! Не буду! Уже месяцы прошли, месяцы!"
10007005-28 = "Готова поспорить, эта высокомерная коротышка даже не помнит о нашем существовании! Н-Наверняка сейчас купается в роскоши и ест пудинг! И горячего какао сколько угодно!"
10007005-29 = "В прошлый раз я явно была слишком добра к ней. В следующий раз я ей покажу..."
10007005-30 = "Пожалуй, промолчу, что в прошлый раз проиграла именно ты..."
10007005-31 = "Что ты вообще здесь делаешь, кроме того что замерзаешь насмерть?"
10007005-32 = "Рада, что спросила! Я как раз вытаскивала эти гнилые столбы."
10007005-33 = "У нас заканчиваются дрова для костров, а снег всё прибывает."
10007005-34 = "Вот я и решила убить двух зайцев: немного расчистить территорию и добыть дров!"
10007005-35 = "Помочь?"
10007005-36 = "Да, объединим силы и вытащим столб!"
10007005-37 = ""
10007005-39 = ""
10007005-40 = ""
10007005-41 = "Ладно, тянем вместе на счёт три!"
10007005-42 = ""
10007005-43 = "Раз, два..."
10007005-44 = ""
10007005-45 = ""
10007005-47 = ""
10007005-48 = ""
10007005-49 = "ТРИ!"
10007005-50 = ""
10007005-52 = ""
10007005-54 = ""
10007005-56 = "*бум*"
10007005-58 = "Какого чёрта это было?!"
10007005-59 = "Бомба? О боже, нет, это гигантский крот. Шигурэ, обними меня! Нам конец!"
10007005-60 = "Обниму, если хочешь, но гигантских кротов в этих местах нет."
10007005-61 = "Если это не крот, значит бомба! На нас напали!"
10007005-62 = ""
10007005-64 = ""
10007005-65 = "...Пожалуйста, посмотри глазами."
10007005-66 = ""
10007005-68 = ""
10007005-72 = "Ч-Что это?!"
10007005-73 = "Мать-природа нападает на нас!"
10007005-74 = "Кажется, мы наткнулись на водоносную жилу."
10007005-75 = "Она огромная."
10007005-78 = "А если вся вода замёрзнет и это место превратится в гигантский каток? Шигурэ, нельзя этого допустить. Мы здесь живём!"
10007005-79 = "Нужно немедленно остановить поток!"
10007005-80 = ""
10007005-82 = ""
10007005-83 = ""
10007005-84 = ""
10007005-85 = "Чем мы вообще можем его перекрыть? У меня даже дров не хватает на костёр."
10007005-86 = "Я всего лишь хотела испытать хотя бы каплю счастья возле тёплого костра."
10007005-87 = "И за это маленькое желание меня накажут. Мы замёрзнем насмерть на этом ледовом катке, забытые и брошенные."
10007005-88 = "Не падай духом, Нодока. Всё никогда не настолько плохо, как кажется."
10007005-89 = "Ты не видишь гигантский перевёрнутый водопад, бьющий из земли?! Скажи мне, как это может быть не плохо!"
10007005-90 = "Посмотри внимательнее. Это не обычные грунтовые воды."
10007005-91 = "Что ты имеешь в виду?"
10007005-92 = ""
10007005-95 = "А? Погоди! Вода тёплая и пахнет серой..."
10007005-96 = "Горячий источник?!"
10007005-97 = "Я же говорила, не всё так плохо."
10007005-98 = "Представь возможности. Я смогу лениться и больше не греть воду для купания."
10007005-99 = "Ты права, но..."
10007005-100 = "Дурацкий горячий источник никак не улучшит наше жалкое положение!"
10007005-102 = "Горячие источники? Дурацкие?!"
10007005-103 = "К-Кто здесь? Шигурэ, на нас медведь напал!"
10007005-104 = ""
10007005-106 = ""
10007005-110 = ""
10007005-111 = "О? В Академии Красной Зимы водятся медведи? Как интересно!"
10007005-112 = "Хочу увидеть, покажите!"
10007005-114 = "Ты кто...?"
10007005-116 = "Вот я глупая! Захотела увидеть медведей, даже не представившись."
10007005-117 = "Где есть горячий источник — там и мы!"
10007005-118 = "И вот мы здесь — в ясный, сияющий день, идеально подходящий для разработки!"
10007005-119 = "Мы — клуб горячих источников академии Геенна!"
10007005-120 = ""
10007005-122 = ""
10007005-124 = ""
10007005-125 = "Академия Геенна?"
10007005-126 = "Что здесь делают студенты Геенны?"
10007005-127 = "Пусть нас и отстранили, но это не помешает нам защищать академию Красной Зимы от незваных гостей!"
10007005-128 = "Ахахаха! ♪ Какие вы милые! Если будете так много переживать, на ваших хорошеньких лобиках морщинки появятся."
10007005-129 = "Мы всего лишь пришли проверить информацию о новом горячем источнике."
10007005-130 = "Ну... вообще-то она не ошибается..."
10007005-131 = "Но как, чёрт возьми, вы так быстро о нём узнали?"
10007005-132 = "Ахахаха! Вот это реально круто!"
10007005-133 = "Как и ожидалось, президент Касуми всегда права!"
10007005-134 = "*принюхивается* Ах-х, этот сладкий, успокаивающий запах серы. Прямо как дома."
10007005-135 = "Вы ведь не против, если я осмотрю источник?"
10007005-136 = "Н-Наверное, нет. Но только быстренько взглянуть."
10007005-137 = "Кхм. Посмотрим."
10007005-138 = ""
10007005-140 = ""
10007005-141 = ""
10007005-142 = ""
10007005-143 = "Хм-м, этот горячий источник..."
10007005-144 = "Если честно, понятия не имею! Но выглядит довольно круто!"
10007005-145 = "Тогда зачем ты делала вид, будто ты тут эксперт?!"
10007005-146 = "Я не забиваю свою маленькую голову скучными вещами вроде качества или состава."
10007005-147 = "Для меня хороший горячий источник — тот, при виде которого хочется сбросить одежду и сразу прыгнуть внутрь!"
10007005-148 = "Что? Президент одобрила разрешение на строительство?"
10007005-149 = "Отлично! Тогда начинаем разработку горячего источника!"
10007005-150 = ""
10007005-152 = ""
10007005-153 = ""
10007005-155 = "Машины у вас довольно большие... Простите, это что, гигантский бур?"
10007005-156 = "П-Подождите секунду. Я разрешила вам только посмотреть! Что вообще происходит?!"
10007005-157 = "Тебе уши прочистить? Я же уже сказала. Происходит разработка горячего источника!"
10007005-158 = "Но это же бывший институт, которым заведует спецотряд №227!"
10007005-159 = "Как я уже сказала, я не позволю другим школам просто так топтаться по территории академии Красной Зимы!"
10007005-160 = "Хотя здесь всё равно особо ничего не происходит."
10007005-161 = "О-о, милашки, у вас уже есть свои планы по освоению этой территории?"
10007005-162 = "Н-Ну, я бы не сказала, что прямо так."
10007005-163 = "Хм, тогда я вообще не вижу проблемы."
10007005-164 = "Ну, короче, мы начинаем."
10007005-165 = "Она хуже медведя!"
10007005-166 = "Так, друзья!"
10007005-167 = "Сожжём лес и снесём все старые здания!"
10007005-168 = "Интересно, что будет, если поджечь заснеженные ветки... Как захватывающе! ♪"
10007005-169 = ""
10007005-171 = ""
10007005-176 = ""
10007005-177 = "Шигурэ, что они делают с нашим домом?"
10007005-178 = "Если подумать логически, руины всё равно собирались сносить. Можно хотя бы получить из этого какую-то пользу."
10007005-179 = "Иди сюда, садись рядом и смотри. У меня ещё есть горячее какао."
10007005-180 = "Л-Ладно... но я всё равно немного волнуюсь."
10007005-184 = ""
10007005-185 = "Ч-Ч-Ч..."
10007005-186 = "Что происходит?!"
10007005-187 = "Как видите, это новый курорт горячих источников, который мы построили!"
10007005-188 = "Хи-хи, разве не великолепно? ♪"
10007005-189 = "Э-Это уже целый комплекс! Огромный термальный курорт, ещё и с рёканом?!"
10007005-190 = "Я не думала, что вы отгрохаете настолько гигантский курорт!"
10007005-191 = "Ну, знаешь, как это бывает. Тут пробился новый источник, там пробился ещё один, бюджет увеличили, масштаб вырос — и вуаля!"
10007005-192 = "Разве не впечатляет? Я всегда говорю: чем больше, тем лучше!"
10007005-193 = "Н-Но что-то настолько—"
10007005-194 = "А, конечно, раз всё это находится на территории академии Красной Зимы, распоряжайтесь как хотите."
10007005-195 = "Можете забрать всё себе и жить припеваючи, приглашать богатых гостей или устроить вечеринку для остальных студентов! Ограничивает вас только фантазия."
10007005-196 = "Ты вообще меня слушаешь?"
10007005-197 = "Что? По словам президента, поблизости есть ещё участки с горячими источниками?!"
10007005-198 = "Тогда нельзя терять ни секунды!"
10007005-199 = "Больше горячих источников! Больше разработки!!"
10007005-200 = "Мы пойдём разрабатывать новый источник неподалёку, так что если с комплексом будут проблемы — звоните мне в любое время!"
10007005-201 = ""
10007005-203 = ""
10007005-205 = ""
10007005-206 = "Они как буря: налетели и исчезли."
10007005-207 = "Буря, которая превратила наш дом в курорт горячих источников!"
10007005-208 = "Я понимаю, что это хороший новый комплекс, но как, чёрт возьми, нам управляться с такой махиной?"
10007005-209 = ""
10007005-211 = ""
10007005-212 = "Ну... всё-таки жалко было бы дать этому пропасть, правда?"
