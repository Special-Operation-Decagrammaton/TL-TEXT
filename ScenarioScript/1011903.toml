[translation]
1011903-1 = "Как выражать свои чувства"
1011903-2 = "В итоге я отправился на фестиваль Рыночной аллеи в Хяккияко."
1011903-3 = ""
1011903-6 = "Попробуйте нашу якисобу с фирменным соусом! А ещё у нас есть окономияки!"
1011903-7 = "Дынная булочка с настоящим кремом из дыни Эбису!"
1011903-8 = "Особая сахарная вата! Любимая у Чисэ!"
1011903-9 = ""
1011903-11 = ""
1011903-12 = "Клуб ракуго-фитнеса скоро даст представление на площади. Присоединяйтесь!"
1011903-13 = "Идеальный шанс сжечь 500 калорий за один сеанс ракуго! Отлично помогает похудеть!"
1011903-17 = "Я наслаждался разными выступлениями и уличной едой. Не успел оглянуться, как уже наступил вечер."
1011903-18 = "Перед самым закрытием я встретил Нагусу, которая разбирала материалы в дальней части фестивальной площадки."
1011903-19 = ""
1011903-23 = "А, Сенсей [USERNAME]. Вы здесь."
1011903-24 = "Вам понравился фестиваль?"
1011903-25 = "[s] «Да, благодаря тебе я отлично провёл время.»"
1011903-26 = ""
1011903-29 = "[ns] «Кстати, сегодня я вообще тебя там не видел.»"
1011903-30 = "И не могли увидеть. Я была так занята жаркой шашлычков и переноской вещей, что почти не отходила от прилавка."
1011903-31 = "Но оно того стоило, когда я увидела, как посетителям понравилась приготовленная мной еда."
1011903-32 = "Сегодня все старались изо всех сил, чтобы фестиваль удался."
1011903-33 = "[s] «И всё же ты тоже заслуживала им насладиться.»"
1011903-34 = ""
1011903-37 = "О! Спасибо вам за сегодняшнюю работу, госпожа президент!"
1011903-38 = "Эм, вообще-то я..."
1011903-39 = "О, вы вице-президент? Ну, как бы то ни было, без вас мы бы не справились. Всё закончилось бы катастрофой!"
1011903-40 = "Когда наш доброволец у гриля сообщил, что заболел, я думала, нам вообще придётся пропустить весь фестиваль."
1011903-41 = "Но благодаря вам мы смогли обслужить самых разных гостей."
1011903-42 = "И готовите вы потрясающе. Вы сказали, что делали это впервые? Где-то научились?"
1011903-44 = "Раньше я не готовила шашлычки, но люблю их есть."
1011903-45 = "Если честно, мои были далеко не такими вкусными, как те, что я пробовала раньше. Прошу прощения."
1011903-46 = "Ха-ха! И ко всему прочему вы ещё и скромница."
1011903-47 = ""
1011903-49 = ""
1011903-50 = "Ой, чуть не забыла сказать..."
1011903-51 = "У нас будет вечеринка после фестиваля. Если у вас нет планов, не хотите присоединиться?"
1011903-52 = "Все так рады, что сегодня всё прошло отлично после стольких усилий."
1011903-53 = "С вами там будет ещё веселее, Нагуса!"
1011903-54 = "В таком случае... я..."
1011903-55 = ""
1011903-57 = ""
1011903-58 = "...О, простите. У меня уже есть планы. Боюсь, я не смогу прийти."
1011903-59 = "Есть? Ах, ну, жаль."
1011903-60 = "Тогда как-нибудь загляните к нам в магазин. Шашлычки за наш счёт!"
1011903-61 = "Буду с нетерпением ждать."
1011903-62 = ""
1011903-64 = ""
1011903-66 = "[ns] «У тебя другие планы?»"
1011903-67 = "По правде говоря... нет."
1011903-68 = "Я солгала. Просто не хотела идти на вечеринку."
1011903-69 = "[s] «Почему? Что-то случилось?»"
1011903-70 = "Нет, вовсе нет. На самом деле мне нравится такая шумная атмосфера."
1011903-71 = "Но... мой собственный довольно холодный характер ей не очень подходит."
1011903-72 = "Я редко знаю, что сказать, а люди часто неверно понимают выражение моего лица и принимают мою холодность на свой счёт."
1011903-73 = "Когда дело касается того, чтобы помогать другим веселиться, я... в лучшем случае неопытна."
1011903-74 = "В такой тёплой атмосфере я бы только понизила температуру. Поэтому я отказалась."
1011903-75 = "[s1] «Не думаю, что они восприняли бы это так.»\n[s2] «Мне нравится быть рядом с тобой.»"
1011903-77 = "Хм?!"
1011903-78 = "Н-Но..."
1011903-79 = "[s] «Чтобы выражать чувства, опыт не нужен.»"
1011903-80 = ""
1011903-83 = "[ns3] «Даже если ты молчалива или тебя неправильно понимают...»\n[ns4] «...если вы все счастливы по одной и той же причине, вы поладите.»"
1011903-86 = ""
1011903-87 = ""
1011903-88 = "...Я не думала об этом с такой стороны."
1011903-89 = "Вы позволите, Сенсей?"
1011903-90 = "Я догоню их и спрошу, можно ли ещё присоединиться."
1011903-91 = "[s] «Конечно! Иди. Повеселись!»"
1011903-94 = "С чуть более лёгкой походкой Нагуса ушла вслед за доносившимся смехом."
