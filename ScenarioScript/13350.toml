13350-24 = "Неверно, Сунаоками Широко. Присутствие Хромы здесь — не твоя вина."
13350-25 = "А.Р.О.Н.А.?! Как?!"
13350-26 = "Я использую проявленную Хрому как канал связи с тобой. Нужно спешить — время не на нашей стороне."
13350-27 = "А.Р.О.Н.А.... Нет, правильнее называть тебя данным тебе именем."
13350-28 = "Плана... Какова текущая ситуация?"
13350-29 = "Спасибо. Твоё первоначальное предположение было частично верным. Сунаоками Широко этого мира призвала сюда Хрому."
