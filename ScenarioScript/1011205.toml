[translation]
1011205-1 = "Случайная встреча"
1011205-3 = "По дороге обратно, закончив рабочие дела..."
1011205-4 = ""
1011205-10 = "[ns] «...»"
1011205-11 = ""
1011205-14 = "Почему-то я вспомнил переписку с Асуной в MomoTalk и огляделся по сторонам."
1011205-15 = ""
1011205-18 = "[ns] «Её здесь нет...»"
1011205-19 = ""
1011205-24 = "[ns] «...»"
1011205-25 = ""
1011205-31 = ""
1011205-34 = "[ns] «Ну, наверное, всё не может быть настолько просто.»"
1011205-36 = ""
1011205-37 = ""
1011205-38 = ""
1011205-39 = "О-о!! Это Сенсей!!"
1011205-40 = "[s] «Как быстро!!»"
1011205-41 = "Ого, это и правда вы, Сенсей! Мы снова встретились!"
1011205-42 = "Ахаха! Что это такое? Судьба? Что-то вроде того?"
1011205-43 = "Я просто гуляла и почему-то подумала: если пойду сюда, снова встречу вас!"
1011205-44 = "И вот я здесь, и вы тоже здесь!"
1011205-45 = "[s] «Ты и правда появляешься повсюду, да?»"
1011205-46 = "Хаха, удивились?"
1011205-47 = "Что вы сказали? Хотите посадить меня на поводок, чтобы всегда знать, где я?"
1011205-48 = "Ахаха! Значит, вам ХОЧЕТСЯ поводок?"
1011205-49 = "[ns1] «Нет, я говорил образно...»\n[ns2] «Я просто пошутил.»"
1011205-50 = ""
1011205-51 = ""
1011205-53 = "А у меня как раз есть один!!"
1011205-54 = ""
1011205-56 = ""
1011205-58 = "[ns] «З-зачем ты развязываешь эту ленту, Асуна...?»"
1011205-59 = ""
1011205-61 = ""
1011205-63 = ""
1011205-66 = "― [log=아스나 교복]Та-дам! Теперь Сенсей и Асуна соединены![/log][wa:1830]"
1011205-69 = "― [log=아스나 교복]Ну как вам?[/log]"
1011205-71 = "― [log=아스나 교복]Теперь всё хорошо, правда? Вы ведь знаете, где я, да?[/log][wa:10]"
1011205-74 = "― [log=아스나 교복]...Что такое? Почему вы так смотрите?[/log][wa:1740]"
1011205-77 = "― [log=아스나 교복]А? Я что-то сделала не так? Надо было наоборот?[/log][wa:2090]"
1011205-80 = "[ns3] «Не думаю, что проблема именно в этом...»\n[ns4] «Ты выгуливаешь меня как щенка.»"
1011205-81 = "― [log=아스나 교복]Хм? ...А? А-а!! Точно![/log][wa:3460]"
1011205-82 = "― [log=아스나 교복]Хм? ...А? А-а!! Точно![/log][wa:3460]"
1011205-85 = "― [log=아스나 교복]Ха... Хаха... Смешно![/log][wa:1570]"
1011205-88 = "― [log=아스나 교복]И правда...[/log][wa:600]"
1011205-91 = "― [log=아스나 교복]будто я выгуливаю щенка![/log][wa:60]"
1011205-94 = "― [log=아스나 교복]Сенсей? Вы сейчас мой щеночек?[/log][wa:2950]"
1011205-97 = "― [log=아스나 교복]А мой щеночек может[/log]"
1011205-99 = "― [log=아스나 교복]сказать... «гав-гав»?[/log][wa:640]"
1011205-102 = "― [log=아스나 교복]Хи-хи![/log]"
1011205-104 = "― [log=아스나 교복]Если хорошо сделаете, я дам вам вкусняшку![/log][wa:1160]"
1011205-108 = ""
1011205-109 = "Хаха, щеночек! Гуляем со щеночком!"
1011205-110 = ""
1011205-112 = ""
1011205-113 = "[ns5] «Эм, Асуна...»\n[ns6] «Я не хочу сказать, что в этом есть что-то плохое...»"
1011205-116 = "[ns] «Но если нас увидят другие студенты, могут возникнуть проблемы...»"
1011205-117 = "А, думаете? Хм."
1011205-118 = ""
1011205-120 = ""
1011205-121 = "Да, они могут неправильно понять."
