[translation]
90101090-1 = "Episódio 9;Interrogatório Padrão SRT"
90101090-2 = "Em frente aos armazéns do Porto de Kanezaki"
90101090-3 = ""
90101090-4 = ""
90101090-5 = ""
90101090-6 = ""
90101090-7 = "Quem é que tá aí?!"
90101090-8 = ""
90101090-10 = ""
90101090-11 = ""
90101090-12 = "Sou eu, cambada de incompetentes! A sua [ruby=Capo]chefe de filial[/ruby]!"
90101090-13 = "Já se esqueceram da minha cara, por acaso?!"
90101090-14 = "A-Ah, Madrinha... perdoe a nossa audácia!"
90101090-15 = "Tá, tá, chega de enrolação. Aconteceu alguma coisa estranha no turno da tarde?"
90101090-16 = "Não, senhora! Enquanto estávamos de vigia aqui, nem um caranguejo ousou chegar perto!"
90101090-17 = "Ora, também pudera. #nQuem teria coragem de meter o nariz no território da Família Carpaccio sem ter amor aos dentes—"
90101090-18 = "—Bom, pensando bem, parece que ultimamente anda aparecendo bastante folgado por aí."
90101090-19 = ""
90101090-20 = "Mil desculpas! Eu vim trazer o pedido, mas não tinha ninguém na guarita da entrada..."
90101090-21 = "Se eu deixasse a comida lá fora, ia estragar tudo com o sereno da noite, então entrei procurando alguém pra entregar em mãos!"
90101090-22 = "É ruim, hein! A guarda do portão principal te deixou passar batida até aqui?!"
90101090-23 = "Ué... mas não tinha absolutamente ninguém no portão da frente!"
90101090-24 = ""
90101090-25 = "Tsc... A moral da Família Carpaccio não impõe mais o respeito de antigamente mesmo."
90101090-26 = "Pra recuperar a confiança do chefão supremo, a gente não pode perder essa licitação por nada deste mundo...!"
90101090-27 = "Madrinha, algum problema tirando o seu sono?"
90101090-28 = "Não é da sua conta."
90101090-29 = "E falando nisso, vocês dois não eram a dupla da ronda vespertina? #nJá passou das 18h faz tempo! Por que ainda tão plantados aqui na porta do galpão?"
90101090-30 = "É que... bem..."
90101090-31 = "Acontece que os caras do turno da noite tiveram um revertério daqueles no estômago e tão trancados no banheiro."
90101090-32 = "Bando de frouxos! O que aqueles desgraçados comeram pra passar mal desse jeito?!"
90101090-33 = "Acho que foi um tal de sushi... #nPediram entrega de comida ontem de madrugada."
90101090-34 = "Aí abriu um buraco na escala da patrulha noturna, e a gente não sabia o que fazer..."
90101090-35 = "Seus idiotas de galocha...!"
90101090-36 = "Se eu não tivesse passado por aqui, iam ficar de braços cruzados esperando a noite inteira?!"
90101090-37 = "P-Perdão, senhora!"
90101090-38 = "Vão voando até o dormitório e tragam o Sato e o Suzuki pelo colarinho! Hoje é folga deles, tão à toa."
90101090-39 = "Digam que a Capo vai compensar a folga depois, mas que hoje eles vão ter que ralar!"
90101090-40 = "S-Sim, senhora...!"
90101090-41 = ""
90101090-43 = ""
90101090-44 = ""
90101090-45 = ""
90101090-46 = "...Tão esperando o quê, empacados aí que nem duas mulas?"
90101090-47 = "É que a gente tava discutindo quem é que vai."
90101090-48 = "O chefe sempre fala, né? #nNa hora de guardar o perímetro, sempre em duplas. Nunca deixe o posto desguarnecido. Então..."
90101090-49 = "Argh... quanta dor de cabeça, meu Deus!"
90101090-50 = "E daí?! #nEnquanto um vai chamar, o outro ia ficar aqui jogando conversa fora comigo, por acaso?!"
90101090-51 = "Se é pra trazer os substitutos rápido, os dois se mexendo juntos chegam o dobro mais rápido, seus acéfalos!"
90101090-52 = "Ou vocês tão com a pretensão ridícula de achar que EU preciso da proteção de vocês?!"
90101090-53 = "N-Não, de jeito nenhum!"
90101090-54 = "Então mexam essas pernas e tragam os dois agora mesmo!"
90101090-55 = ""
90101090-57 = ""
90101090-58 = ""
90101090-59 = "...Ai, ai. Ter que administrar um território portuário com uma corja de paspalhos desses é de enlouquecer."
90101090-60 = "Com licença..."
90101090-61 = "Mas se levar um ataque de surpresa pela retaguarda, até mesmo uma Capo fica em maus lençóis, não acha?"
90101090-62 = "Hã? O que você dis—"
90101090-63 = ""
90101090-65 = ""
90101090-67 = "—Ugh...!"
90101090-68 = ""
90101090-71 = ""
90101090-72 = "Provavelmente o seu chefe tinha esse tipo exato de situação em mente."
90101090-73 = ""
90101090-75 = "Aqui é a FOX3. Capturei o escalão intermediário da Família Carpaccio com sucesso."
90101090-76 = "FOX4, na escuta. Nenhum sinal de outros membros num raio de cinquenta metros."
90101090-77 = "FOX1, copiado. Oculte o alvo e faça o traslado até o Ponto Charlie. Atenção redobrada para não deixar testemunhas."
90101090-78 = "Mas que droga... tá acontecendo..."
90101090-79 = ""
90101090-81 = ""
90101090-86 = "Ugh... urghh..."
90101090-87 = ""
90101090-95 = "...Voltou a si?"
90101090-96 = ""
90101090-98 = ""
90101090-99 = "Onde... onde é que eu tô?! Quem são vocês...?!"
90101090-100 = "Galpão abandonado nos arredores do Porto de Kanezaki"
90101090-101 = ""
90101090-103 = ""
90101090-104 = "FOX1, a consciência do alvo foi restabelecida."
90101090-105 = ""
90101090-107 = ""
90101090-108 = "Valeu a pena ficarmos fazendo barulho no ouvido dela."
90101090-109 = "Muito bem. Daremos início ao interrogatório."
90101090-110 = ""
90101090-112 = ""
90101090-113 = ""
90101090-114 = "Interrogatório...?! Hah, vão me interrogar?!"
90101090-115 = "Nunca vi esse fardamento ridículo na minha vida..."
90101090-116 = "Vocês são capangas a mando da Família Arancino, é?!"
90101090-117 = "Trouxeram até um adulto a tiracolo pra posar de valentões! #nPois fiquem sabendo que o meu chefão vai moer vocês até não sobrar pó!"
90101090-118 = "[s] \"E-Er... vejamos...\""
90101090-119 = "Não dê ouvidos a ela, Sensei."
90101090-120 = "É só o latido desesperado de quem já foi encurralada."
90101090-121 = ""
90101090-123 = ""
90101090-124 = "Cale a boca. Você não tem permissão para fazer perguntas."
90101090-125 = "Hahaha, que pose de mandona!"
90101090-126 = "Podem vir com tudo, quero só ver! Não abro o bico nem que a vaca tussa!"
90101090-127 = "Antes de trair a minha organização, eu prefiro mil vezes virar comida de caranguejo—"
90101090-128 = ""
90101090-131 = ""
90101090-134 = "FOX2. Esse gerador de energia aqui não tá pifado, não?"
90101090-135 = "Não tem outro sobressalente? De preferência um bem mais potente."
90101090-136 = "E-Espera aí! O que vocês tão pensando em fazer?!"
90101090-137 = "Ué, o que você acha? Já não dissemos? #nInterrogatório."
90101090-138 = "Mas desculpe o inconveniente, vai ter que esperar só um minutinho. #nAinda tô terminando de plugar a fiação."
90101090-139 = "V-Vocês pretendem me torturar com choque elétrico?!"
90101090-140 = ""
90101090-141 = ""
90101090-142 = "Uma crueldade dessas... o Conselho Estudantil Federal não vai deixar barato!"
90101090-143 = "Vocês já devem ter ouvido falar, não ouviram?! #nSe passar dos limites no D.U., as forças de operações especiais subordinadas diretamente à Presidente caem matando em cima!"
90101090-144 = ""
90101090-146 = ""
90101090-147 = ""
90101090-148 = ""
90101090-149 = "Podem tentar fugir até os confins de Kivotos, elas vão caçar vocês até o inferno...! #nV-Vocês não têm medo da Presidente do Conselho Estudantil Federal?!"
90101090-150 = "[s] \"Ah, sobre essas forças especiais...\""
90101090-151 = "Não tem com que se preocupar. Já resolvemos tudo com elas."
90101090-152 = "Sim, sim! Tivemos um 'diálogo' extremamente sincero e produtivo com a chefia."
90101090-153 = "Vocês falaram direto com a Presidente?! Não me venham com historinha pra boi dor—"
90101090-154 = "Calma, calma lá. Não precisa desse pânico todo. #nNão pretendemos deixar nenhuma cicatriz no seu corpinho."
90101090-155 = "Este gerador foi trazido apenas para ligar os servidores de computação. #nNão usamos choques em seres humanos."
90101090-156 = "Servidores...?"
90101090-157 = ""
90101090-159 = ""
90101090-160 = "Seu nome é Takahashi-san. #nCapo da Família Carpaccio e líder da divisão encarregada da segurança do Porto de Kanezaki... correto?"
90101090-161 = "Seus subordinados tremem de medo dizendo que você não tem coração nem piedade, #nmas, curiosamente, seu passatempo secreto é colecionar bichinhos fofos—"
90101090-162 = "C-Como é que você sabe disso...?!"
90101090-163 = "Ora, a própria senhorita escreveu tudinho na sua conta secreta do 'Fru-Link'."
90101090-164 = "Claro, você achava que ninguém nunca descobriria, mas..."
90101090-165 = "Cruzando as contas que você segue com os seus horários diários de patrulha, #nidentificamos você num piscar de olhos."
90101090-166 = "No mês passado, você até foi à loja temporária de Corgi Town só pra garantir a pelúcia exclusiva da Uromi-chan em edição limitada..."
90101090-167 = "E olha só que gracinha: você também tem um gatinho de estimação em casa."
90101090-168 = "Grrr...!"
90101090-169 = "E então... o que será que acontece se vazarmos todos esses segredos da sua conta privada pro submundo do porto?"
90101090-170 = "[s1] \"Que ideia absolutamente maquiavélica...!\"\n[s2] \"Que medo... isso é aterrorizante demais...\""
90101090-173 = "P-Parem, por favor! Se fizerem isso, toda a minha autoridade e reputação de durona vão pro ralo!"
90101090-174 = "Sendo assim, sugiro que responda às nossas perguntas com total sinceridade."
90101090-175 = "Qual foi a razão pela qual vocês espalharam o boato do 'Caranguejo Monstro'?"
90101090-176 = "Tsc... então vocês já descobriram até isso."
90101090-177 = "Mas não pensem que vou ceder tão fácil! Eu sou a Capo de confiança do chefão! O terror dos comerciantes do cais—"
90101090-178 = "Pelo visto ela ainda não entendeu a gravidade da situação, né?"
90101090-179 = "FOX1. Trouxe aquilo que você pediu."
90101090-180 = "É isso aqui, né?"
90101090-181 = "...Excelente. Bom trabalho."
90101090-182 = "FOX3, se as negociações fracassarem, vá imediatamente à residência da Capo. E alimente o gatinho dela com isto."
90101090-183 = "O-O que diabos vocês pretendem dar pra ele comer...?!"
90101090-184 = "Lata de patê gourmet de atum nobre da marca 'Inari Co.'. #nQuem tem gato sabe muito bem como eles enlouquecem com isso..."
90101090-185 = "O que você acha que o seu gatinho vai fazer se uma estranha oferecer um patê importado caríssimo desses todo santo dia?"
90101090-186 = "N-Não me diga que..."
90101090-187 = "Nem se compara com aquela ração seca sem graça de sempre. Ele vai se esfregar todo, ronronar com carinho infinito e fazer manha..."
90101090-188 = "E aí... talvez ele comece a esnobar e virar a cara pra [ruby=・]d[/ruby][ruby=・]o[/ruby][ruby=・]n[/ruby][ruby=・]a[/ruby] [ruby=・]m[/ruby][ruby=・]ã[/ruby][ruby=・]o[/ruby] [ruby=・]d[/ruby][ruby=・]e[/ruby] [ruby=・]v[/ruby][ruby=・]a[/ruby][ruby=・]c[/ruby][ruby=・]a] que só dá ração barata, né?"
90101090-189 = "COMO VOCÊS PODEM SER TÃO CRUÉIS E MONSTRUOSAS?!"
90101090-190 = "...Cruéis?"
90101090-191 = "Você está redondamente enganada sobre nós."
90101090-192 = "Nós não somos pessoas comuns. Somos 'raposas frias e implacáveis'."
90101090-193 = "Se recusar a cooperar, faremos coisas que superam em muito o que a sua imaginação é capaz de conceber."
90101090-194 = "Guuhhh...!"
90101090-195 = "[s3] \"Meninas, vamos com calma.\"\n[s4] \"Deixem um espaço para ela poder falar, sim?\""
90101090-198 = "Você aí, o adulto... afinal de contas, quem é você?"
90101090-199 = "Se essas garotas estão sob o seu comando, não são simples delinquentes juvenis. #nSão de alguma corporação corporativa militar?"
90101090-200 = "[s5] \"Eu sou de Scha... quer dizer, sou o responsável por elas.\"\n[s6] \"Peço desculpas pela abordagem tão bruta na hora de trazê-la.\""
90101090-203 = "Humpf! Acha mesmo que vou acreditar em desculpinha depois de tudo isso?"
90101090-204 = "Pode tentar amaciar o quanto quiser, eu sei muito bem que estão querendo me passar a perna."
90101090-205 = "[s7] \"Dou a minha palavra de honra.\"\n[s8] \"Não temos o menor interesse nas regalias ou no território da Família Carpaccio.\""
90101090-208 = "Até parece que vou engolir essa—"
90101090-209 = ""
90101090-211 = ""
90101090-212 = "...É sério mesmo? Vocês não querem a licitação do porto?"
90101090-213 = ""
90101090-215 = ""
90101090-216 = ""
90101090-217 = "Olha só, bastou o Sensei entrar no jogo pro clima tenso amolecer na hora!"
90101090-218 = "Uma abordagem clássica, mas a tática do 'morde e assopra' nunca falha. Embora eu não esperasse o Sensei no papel do doce."
90101090-219 = "Tenho quase certeza de que o Sensei não fez isso como jogada calculada, mas enfim..."
90101090-220 = ""
90101090-222 = ""
90101090-223 = ""
90101090-224 = "[ns] \"Só queremos entender por que vocês disseminaram esse boato.\""
90101090-225 = "O motivo de espalhar pânico? Um adulto como você deveria entender perfeitamente."
90101090-226 = ""
90101090-229 = ""
90101090-230 = "Quando as emoções do ser humano fervem, o discernimento vai pro ralo. Seja por euforia, tristeza ou pavor..."
90101090-231 = "Se a emoção falar mais alto, ninguém consegue pensar com a razão. Todo mundo passa a ser manipulado facilmente pela palavra alheia."
90101090-232 = ""
90101090-234 = ""
90101090-236 = "A esta cidade de Kivotos... falta [ruby=・]t[/ruby][ruby=・]e[/ruby][ruby=・]r[/ruby][ruby=・]r[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby]."
90101090-238 = "[log=카야]A esta cidade de Kivotos... falta [ruby=・]t[/ruby][ruby=・]e[/ruby][ruby=・]r[/ruby][ruby=・]r[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby].[/log]"
90101090-240 = "...Se mostrarmos o terror absoluto a todos,"
90101090-244 = "...Se mostrarmos o terror absoluto a todos,"
90101090-245 = "cada cidadão se curvará e fará exatamente o que eu mandar."
90101090-247 = "[log=카야]...Se mostrarmos o terror absoluto a todos, cada cidadão se curvará e fará exatamente o que eu mandar.[/log]"
90101090-249 = "E de todos os sentimentos humanos, o mais fácil de controlar é o 'medo'. #nDiante do desconhecido, as pessoas se apavoram por instinto."
90101090-250 = "É que nem as tais tropas de elite da Presidente do Conselho Estudantil Federal. #nA simples possibilidade de elas existirem já faz qualquer bandido pensar duas vezes antes de agir, não faz?"
90101090-251 = "Se elas existem de verdade ou quantas pessoas já prenderam não tem a menor importância."
90101090-252 = ""
90101090-255 = "Uma academia erguida sobre o terror das pessoas..."
90101090-257 = "[log=미야코]Uma academia erguida sobre o terror das pessoas...[/log]"
90101090-261 = "Como uma coisa dessas poderia ser a Academia Especial SRT?!"
90101090-263 = "[log=미야코]Como uma coisa dessas poderia ser a Academia Especial SRT?![/log]"
90101090-265 = "........."
90101090-266 = "Só peguei emprestado o mesmo truque para garantir a sobrevivência da minha família."
90101090-267 = "'Se não quiser sofrer as consequências, não meta o bedelho nos nossos negócios.' Simples assim."
90101090-268 = "Se o objetivo era intimidar, haveria outros métodos."
90101090-269 = "Por que escolher especificamente a história de 'caranguejos monstros'?"
90101090-270 = "Porque aproveitei uma lenda urbana que o pessoal do porto já conhecia de cor e salteado."
90101090-271 = "'Quem desafiar a Família Carpaccio vira ração de caranguejo e encara um terror sem volta.'"
90101090-272 = "E o melhor de tudo é que ninguém sai ferido de verdade."
90101090-273 = "Bastava pesquisar um pouco — aliás, qualquer estivador do porto sabe muito bem. #n[ruby=・]C[/ruby][ruby=・]a[/ruby][ruby=・]r[/ruby][ruby=・]a[/ruby][ruby=・]n[/ruby][ruby=・]g[/ruby][ruby=・]u[/ruby][ruby=・]e[/ruby][ruby=・]j[/ruby][ruby=・]o[/ruby][ruby=・]s[/ruby] [ruby=・]c[/ruby][ruby=・]o[/ruby][ruby=・]m[/ruby][ruby=・]u[/ruby][ruby=・]n[/ruby][ruby=・]s[/ruby] não têm força nenhuma pra machucar ninguém pra valer."
90101090-274 = "Mas o nosso público-alvo são os cidadãos comuns lá fora."
90101090-275 = "A imagem de pinças afiadas e carapaça dura já é suficiente para evocar um pavor instintivo na cabeça de qualquer um."
90101090-276 = "A Valkyrie não move uma palha por causa de simples boatos de corredor."
90101090-277 = "Nós apenas tiramos proveito de um terror intangível."
90101090-278 = "Qual é o problema nisso? Afinal de contas, ninguém sumiu do mapa!"
90101090-279 = ""
90101090-281 = ""
90101090-283 = ""
90101090-284 = ""
90101090-285 = "...Como você tem a cara de pau de dizer uma barbaridade dessas?"
90101090-286 = ""
90101090-288 = ""
90101090-289 = "Inúmeras pessoas inocentes foram consumidas pela angústia e pelo pavor, enquanto o vencedor da licitação era manipulado antes mesmo do pregão começar!"
90101090-290 = "Com base em quê você tem a audácia de afirmar que 'não há problema' nisso tudo?!"
90101090-291 = "Q-Qual é a sua agora?! Por que essa revolta toda do nada?!"
90101090-292 = ""
90101090-294 = "[ns] \"Yukino, respire fundo...\""
90101090-295 = "Mas Sensei, eu—"
90101090-296 = ""
90101090-301 = "Ué? Que barulho é esse?"
90101090-302 = "Tem alguma coisa estalando? 'Clac, clac, clac'..."
90101090-303 = "Parece barulho de pata de artrópode gigante se movendo..."
90101090-304 = "...Será uma infestação colossal de baratas?!"
90101090-305 = "Para com essa nojeira! #nDesde quando barata faz um estrondo pesado desses?!"
90101090-306 = "E esse tremor no chão?! Tem alguma escavadeira operando aqui perto por acaso?!"
90101090-307 = "Não havia nenhuma obra programada para este horário nas docas."
90101090-308 = "...E o ruído está ficando cada vez mais próximo e ensurdecedor!"
90101090-309 = "Sensei, recue imediatamente para trás de nós!"
90101090-310 = ""
90101090-312 = ""
90101090-313 = "...Está vindo!"
90101090-314 = "[s] \"O... o que é aquilo...?!\""
90101090-315 = ""
90101090-320 = "MAS QUE DIABOS DE COISA É AQUELA—?!"
