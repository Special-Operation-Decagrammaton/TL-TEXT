[translation]
90101090-1 = "Эпизод 9;Убеждение по-SRT"
90101090-2 = "Порт Канэсаки: перед складом"
90101090-3 = ""
90101090-4 = ""
90101090-5 = ""
90101090-6 = ""
90101090-7 = "Кто там?"
90101090-8 = ""
90101090-10 = ""
90101090-11 = ""
90101090-12 = "Я, глава филиала и ваш капо."
90101090-13 = "Вы меня уже даже не узнаёте?"
90101090-14 = "А... Простите!"
90101090-15 = "Оставьте оправдания. Есть что доложить?"
90101090-16 = "Нет! Ни одного шатающегося краба или чего-то такого!"
90101090-17 = "Так и должно быть. Только дурак осмелится без приглашения сунуться на территорию Карпаччо."
90101090-18 = "Хотя в последнее время дураков стало многовато."
90101090-19 = ""
90101090-20 = "Простите... Я пришла с доставкой, но у двери никого не было."
90101090-21 = "Я не могла оставить еду там портиться. Поэтому вошла, надеясь найти кого-нибудь, кому можно передать заказ..."
90101090-22 = "Вот как? Хочешь сказать, охрана у главного входа просто тебя пропустила?"
90101090-23 = "Нет... Потому что у двери охраны не было. П-Поэтому я и вошла."
90101090-24 = ""
90101090-25 = "Ц. Было время, когда люди боялись даже шёпотом произнести наше имя. А теперь курьерши заходят сюда как к себе домой."
90101090-26 = "Нам всего лишь нужно выиграть эти торги! Тогда босс снова будет нам доверять."
90101090-27 = "Что-то беспокоит, сестрёнка?"
90101090-28 = "Нет, ничего."
90101090-29 = "Кстати, разве у тебя не дневная смена на этой неделе? Уже после шести, иди домой."
90101090-30 = "А, ну..."
90101090-31 = "Ночная смена вчера заказала еду и отравилась."
90101090-32 = "Слабаки. Что они ели?"
90101090-33 = "Эм, суши, кажется? Оставили на поздний перекус, а к тому моменту они испортились."
90101090-34 = "Короче, сегодня некому их подменить, и мы всё ещё думаем, что делать."
90101090-35 = "Идиоты..."
90101090-36 = "А если бы я не пришла, вы бы что, всю ночь тут сидели?!"
90101090-37 = "П-Простите!"
90101090-38 = "Идите за Сато и Сузуки в их комнату. Сегодня у них выходной."
90101090-39 = "Скажите, что только на сегодня, а потом я им компенсирую."
90101090-40 = "А, да...!"
90101090-41 = ""
90101090-43 = ""
90101090-44 = ""
90101090-45 = ""
90101090-46 = "Ну так идите! Чего стоите?"
90101090-47 = "Мы пытаемся решить, кто из нас пойдёт."
90101090-48 = "Потому что босс всегда говорит, что на охране мы должны держаться парами..."
90101090-49 = "*вздох* От вас двоих у меня голова болит."
90101090-50 = "И какой у вас был план? Одна идёт за ними, а вторая остаётся здесь мило болтать со мной?"
90101090-51 = "Идите! Вместе найдёте их быстрее!"
90101090-52 = "Или... вы думаете, что я недостаточно сильна, чтобы одна охранять склад?"
90101090-53 = "Нет, вовсе нет!"
90101090-54 = "Тогда УЖЕ ИДИТЕ!"
90101090-55 = ""
90101090-57 = ""
90101090-58 = ""
90101090-59 = "*вздох* Не верится, что мне постоянно приходится иметь дело с такими."
90101090-60 = "Эм, капо?"
90101090-61 = "Разве даже ВЫ не окажетесь в опасности, если, скажем, попадёте в засаду?"
90101090-62 = "Ты о чём—"
90101090-63 = ""
90101090-65 = ""
90101090-67 = "...Ух."
90101090-68 = ""
90101090-71 = ""
90101090-72 = "Надо было слушать босса и не отходить от напарницы."
90101090-73 = ""
90101090-75 = "Говорит FOX 3. Офицер семьи Карпаччо захвачен."
90101090-76 = "FOX 4, принято. В радиусе как минимум 50 метров чисто."
90101090-77 = "FOX 1, принято. Сопроводи цель к точке Чарли. Без свидетелей."
90101090-78 = "Уф, что вообще происходит..."
90101090-79 = ""
90101090-81 = ""
90101090-86 = "Угх... А-а-ах..."
90101090-87 = ""
90101090-95 = "...Ты проснулась?"
90101090-96 = ""
90101090-98 = ""
90101090-99 = "Где я... И кто вы...?"
90101090-100 = "Окраина порта Канэсаки: заброшенный склад"
90101090-101 = ""
90101090-103 = ""
90101090-104 = "FOX 1, цель очнулась."
90101090-105 = ""
90101090-107 = ""
90101090-108 = "Хорошо. Риск и шум того стоили."
90101090-109 = "Начинайте допрос."
90101090-110 = ""
90101090-112 = ""
90101090-113 = ""
90101090-114 = "...Допрос? Ха, вы собираетесь допрашивать МЕНЯ?"
90101090-115 = "Так, вашу форму я раньше не видела..."
90101090-116 = "Вас прислала семья Аранчино?"
90101090-117 = "Думаете, взрослый за вашей спиной что-то изменит? Мой босс придёт за каждой из вас!"
90101090-118 = "[s] «Эм, ну, вообще...»"
90101090-119 = "Не отвечайте ей, Сенсей."
90101090-120 = "Это жалкие попытки запугать нас."
90101090-121 = ""
90101090-123 = ""
90101090-124 = "Здесь вопросы задаём мы."
90101090-125 = "Хаха, энергии у тебя хоть отбавляй. Мне нравится."
90101090-126 = "Но нет ничего, что заставит меня заговорить."
90101090-127 = "Скармливайте меня крабам! Делайте что хотите! Я никогда не предам семью!"
90101090-128 = ""
90101090-131 = ""
90101090-134 = "FOX 2, кажется, этот генератор сдох."
90101090-135 = "У кого-нибудь есть запасной? Желательно мощный."
90101090-136 = "П-Погодите. Что вы собираетесь с ним делать?"
90101090-137 = "А? Допрашивать тебя, очевидно. Ты плохо слышишь?"
90101090-138 = "Потерпи. Мне нужно разобраться с кабелями."
90101090-139 = "В-Вы собираетесь меня ПЫТАТЬ? ЭЛЕКТРИЧЕСКИМ ТОКОМ?"
90101090-140 = ""
90101090-141 = ""
90101090-142 = "Генеральный студенческий совет вам это с рук не спустит!"
90101090-143 = "Говорят, у президента есть собственное спецподразделение, которое расправляется с теми, кто нарушает закон в D.U.! Наверняка слышали о них."
90101090-144 = ""
90101090-146 = ""
90101090-147 = ""
90101090-148 = ""
90101090-149 = "А если они возьмут след, от них не убежишь! В-Вы совсем не боитесь президента Генерального студенческого совета?!"
90101090-150 = "[s] «А, это спецподразделение, наверное...»"
90101090-151 = "Спасибо за беспокойство, но она уже дала нам добро."
90101090-152 = "Ага-ага. Разговор был продуктивный."
90101090-153 = "ВЫ, соплячки, разговаривали с президентом Генерального студенческого совета? Даже я не настолько доверчивая!"
90101090-154 = "И вообще, успокойся. Мы не собираемся калечить тебя или делать что-то настолько мерзкое."
90101090-155 = "Генератор нужен мне для интернета, а не чтобы жарить тебя током."
90101090-156 = "Для... интернета?"
90101090-157 = ""
90101090-159 = ""
90101090-160 = "Вы руководитель группы Такахаси, верно? Капо семьи Карпаччо и управляющая контрактной охраной порта Канэсаки?"
90101090-161 = "У вас репутация беспощадной, остальные члены семьи вас боятся. Но, как я слышала, вы любите собирать милые вещи."
90101090-162 = "К-Как ты это знаешь?!"
90101090-163 = "Это в открытом доступе! В вашем запасном аккаунте FruLink."
90101090-164 = "Наверняка вы думали, что псевдоним вас защищает..."
90101090-165 = "...но проанализировать ваши поведенческие и алгоритмические паттерны оказалось несложно."
90101090-166 = "Как вам временный магазин в Corgi Town? Лимитированная плюшевая Уроми, которую вы купили, очаровательна."
90101090-167 = "Ай-ай. А какой милый у вас котик!"
90101090-168 = "Тц..."
90101090-169 = "Ваша устрашающая репутация... Как думаете, что с ней будет, если я опубликую этот аккаунт на официальной странице семьи Карпаччо?"
90101090-170 = "[s1] «Это жестче пыток током...!»\n[s2] «Кажется, у меня мороз по коже.»"
90101090-173 = "С-Стойте! Пожалуйста! Вы разрушите всё, ради чего я работала!"
90101090-174 = "Я и сама НЕ ХОЧУ. Но если не ответите на вопросы, выбора у меня не останется."
90101090-175 = "Руководитель Такахаси. Зачем вы распространяли слухи о крабах-монстрах?"
90101090-176 = "Ц. Значит, вы хорошо осведомлены."
90101090-177 = "Но я не скажу. Я любимый капо босса Карпаччо и гроза Торговой гильдии Канэсаки—"
90101090-178 = "Похоже, она всё ещё не поняла ситуацию."
90101090-179 = "FOX 1, я принесла то кошачье лакомство, о котором мы говорили."
90101090-180 = "Влажный корм Inari со вкусом тунца, да?"
90101090-181 = "Ага, хорошая работа."
90101090-182 = "FOX 3. Если договориться не получится, сходи домой к капо и накорми этим её кота."
90101090-183 = "Ч-Что изменится от того, что вы накормите моего кота?"
90101090-184 = "Как любительница кошек, вы должны знать, что от этого лакомства коты сходят с ума."
90101090-185 = "Ваш кот сейчас голодный дома. Как думаете, как он отреагирует, если кто-то придёт и предложит ему такой деликатес?"
90101090-186 = "Н-Неужели..."
90101090-187 = "Вы кормите кота пресным сухим кормом. Наверняка он будет очень благодарен и ласков к тому, кто откроет ему совершенно новый мир, верно?"
90101090-188 = "Может, ему даже разонравится собственная хозяйка. Та, что всю жизнь давала ему безвкусную еду."
90101090-189 = "В-Вы не люди! Вы демоны, притворяющиеся людьми!"
90101090-190 = "...Люди?"
90101090-191 = "Похоже, возникло недоразумение."
90101090-192 = "Мы не люди и не демоны. Мы жестокие, хитрые лисы."
90101090-193 = "Если не будешь сотрудничать, поймёшь, что это только начало кошмара."
90101090-194 = "Гах...!"
90101090-195 = "[s3] «Успокойтесь все.»\n[s4] «Дайте ей хотя бы шанс заговорить.»"
90101090-198 = "А ТЫ вообще кто такой?"
90101090-199 = "Раз вы действуете со взрослым, обычными мелкими бандитами вас не назвать. На корпорацию работаете?"
90101090-200 = "[s5] «Я из Scha— Нет, я их опекун.»\n[s6] «Прошу прощения за грубое обращение.»"
90101090-203 = "Что, решили играть в доброго и злого полицейского?"
90101090-204 = "Можете сколько угодно подслащивать слова, я вас вижу насквозь."
90101090-205 = "[s7] «Клянусь своим именем.»\n[s8] «Нас не интересуют интересы семьи Карпаччо.»"
90101090-208 = "И я должна вам просто поверить?"
90101090-209 = ""
90101090-211 = ""
90101090-212 = "...Вы правда не охотитесь за контрактом?"
90101090-213 = ""
90101090-215 = ""
90101090-216 = ""
90101090-217 = "Хм. Сенсей снова сотворил магию, вот так просто."
90101090-218 = "Добрый и злой полицейский — клише не просто так. Хотя на планировании мы не обсуждали, что Сенсей возьмёт роль доброго."
90101090-219 = "Если честно, не думаю, что он продумывал это настолько глубоко."
90101090-220 = ""
90101090-222 = ""
90101090-223 = ""
90101090-224 = "[ns] «Правда нет. Мы лишь хотим больше узнать о слухе.»"
90101090-225 = "...Вы взрослый, да? Значит, знаете, что страх — полезный инструмент."
90101090-226 = ""
90101090-229 = ""
90101090-230 = "Сильные эмоции — будь то радость, печаль или страх — затуманивают суждение."
90101090-231 = "Когда сильная эмоция захватывает человека, им легко манипулировать. Он принимает плохие решения."
90101090-232 = ""
90101090-234 = ""
90101090-236 = "Этому Кивотосу не хватает страха."
90101090-238 = "[log=카야]Этому Кивотосу не хватает страха.[/log]"
90101090-240 = "Если они будут бояться меня,"
90101090-244 = "Если они будут бояться меня,"
90101090-245 = "то станут послушнее."
90101090-247 = "[log=카야]Если они будут бояться меня, то станут послушнее.[/log]"
90101090-249 = "Людям свойственно бояться неизвестного. Поэтому страх так легко использовать."
90101090-250 = "Вспомните спецподразделение президента Генерального студенческого совета. Сам факт его существования сдерживает преступников по всему Кивотосу."
90101090-251 = "И люди даже не уверены, существует ли оно. Или что вообще делало. Это неважно."
90101090-252 = ""
90101090-255 = "Вы пытаетесь использовать страх и ужас"
90101090-257 = "[log=미야코]Вы пытаетесь использовать страх и ужас[/log]"
90101090-261 = "тех самых людей, для защиты которых была создана наша академия,#nчтобы... восстановить SRT?"
90101090-263 = "[log=미야코]тех самых людей, для защиты которых была создана наша академия, чтобы... восстановить SRT?[/log]"
90101090-265 = "..."
90101090-266 = "Вот и мы воспользовались похожей тактикой. Ради сохранения имени нашей семьи."
90101090-267 = "Если не хотите столкнуться со страхом неизвестного, не вмешивайтесь в наши дела..."
90101090-268 = "Было полно других способов вселить страх."
90101090-269 = "Почему именно крабы?"
90101090-270 = "Просто удобно. Мы работаем в порту, поэтому воспользовались уже существующей городской легендой."
90101090-271 = "Врагов семьи Карпаччо скармливают крабам. Мы — та неизвестность, которой вы боитесь."
90101090-272 = "Если внимательно посмотреть, никто ведь на самом деле не пострадал, верно?"
90101090-273 = "Любому портовому работнику достаточно немного разобраться, чтобы понять: какие-то КРАБЫ физически не могут обглодать человека до костей."
90101090-274 = "А что касается обычных людей..."
90101090-275 = "Сам образ краба с твёрдым панцирем и острыми клешнями уже способен напугать. И заставить их бояться нас."
90101090-276 = "И Валькирия не станет проводить расследование из-за каких-то странных крабов-людоедов."
90101090-277 = "Мы просто извлекаем выгоду из расплывчатого чувства страха. Вот и всё."
90101090-278 = "Никто на самом деле не исчез, значит, реальной проблемы нет."
90101090-279 = ""
90101090-281 = ""
90101090-283 = ""
90101090-284 = ""
90101090-285 = "...Как вы можете говорить это с такой уверенностью?"
90101090-286 = ""
90101090-288 = ""
90101090-289 = "Люди вынуждены жить каждый день с тревогой и страхом, которые вы создали. Здесь нет победителей — только мошенники и угнетатели."
90101090-290 = "Так КАК вы вообще можете утверждать, что здесь никому не причинили вреда?!"
90101090-291 = "Ч-Чего ты так завелась?! Я что-то странное сказала?!"
90101090-292 = ""
90101090-294 = "[ns] «Юкино, успокойся.»"
90101090-295 = "Но я—"
90101090-296 = ""
90101090-301 = "А? Вы это слышите?"
90101090-302 = "Подтверждаю. Слышу какой-то щёлкающий звук."
90101090-303 = "Похоже на звук насекомых или членистоногих при движении."
90101090-304 = "...Так у них тут тараканы завелись?"
90101090-305 = "Уф! Не надо мне таких образов! Да и тараканы не были бы настолько громкими!"
90101090-306 = "И настолько тяжёлыми тоже. Земля дрожит, будто работает тяжёлая техника."
90101090-307 = "В расписании никакой стройки не было."
90101090-308 = "...Звук становится громче."
90101090-309 = "Сенсей, отойдите назад."
90101090-310 = ""
90101090-312 = ""
90101090-313 = "...Оно приближается."
90101090-314 = "[s] «...Что именно?»"
90101090-315 = ""
90101090-320 = "Что это за штука?!"
