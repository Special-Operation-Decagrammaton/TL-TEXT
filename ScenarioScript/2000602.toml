[translation]
2000602-1 = "Советы по скейтбордингу"
2000602-2 = "Я жду Саю в условленном месте."
2000602-3 = "Н-Не стойте там, Сенсей! Отойдите!"
2000602-4 = "[s] «Сая?»"
2000602-5 = ""
2000602-7 = ""
2000602-9 = ""
2000602-10 = "Ч-Что вы делали, Сенсей?!"
2000602-11 = "Почему вы стояли прямо на тротуаре у подножия лестницы? Разве вы не знаете, что это опасно?"
2000602-12 = "[s1] «Это я должен задавать вопросы!»\n[s2] «Это ТЫ что делала на скейтборде на тротуаре?!»"
2000602-13 = ""
2000602-14 = ""
2000602-15 = "О чём вы говорите, Сенсей? Скейтборд — не транспортное средство, им пользуются пешеходы!"
2000602-16 = "Следовательно, кататься на скейтборде по тротуару должно быть законно!"
2000602-17 = "Хотя если бы у скейтборда был турбодвигатель на солнечной энергии, это уже другой вопрос... Я всё-таки не эксперт по законам."
2000602-18 = "[s] «Ладно, неважно. Так с чего вдруг скейтборд?»"
2000602-19 = "Ц-ц-ц. Иногда вы правда ничего не понимаете, Сенсей."
2000602-20 = "Как ещё мне за один день обойти каждый уголок Променада Чёрной Черепахи?"
2000602-21 = "Променад такой большой, что пешком за день его весь не обойти. К тому же некоторые рестораны спрятаны в узких переулках, куда даже велосипед не пролезет."
2000602-22 = "Поэтому лучший транспорт — скейтборд!"
2000602-23 = "На нём легко ездить, по асфальту он может разогнаться почти как велосипед, и при этом достаточно маленький для тесных мест. Идеально, чтобы мотаться между всеми магазинами Променада."
2000602-24 = "Вам тоже стоит купить скейтборд, Сенсей."
2000602-25 = "[s] «Тебе не кажется, что это опасное сочетание?»"
2000602-26 = "Вы слишком много переживаете! Это куда безопаснее велосипеда."
2000602-27 = "Если, конечно, не пытаться делать трюки. Упадёшь — синяков точно не избежать."
2000602-28 = "Вот, дам вам попробовать."
2000602-29 = "[s] «Ну, раз ты настаиваешь...»"
2000602-30 = ""
2000602-32 = ""
2000602-38 = "..."
2000602-39 = "Ну надо же. Вы не шутили насчёт опасного сочетания. Никогда не видела, чтобы кто-то свалился сразу же."
2000602-40 = "Хотите пару советов по скейтбордингу?"
2000602-41 = "Хотя у меня их особо и нет. Я с самого начала умела кататься, потому что я гений. ♪"
2000602-42 = "Если уж давать совет, то примерно такой: «Станьте единым целым со скейтбордом.»"
2000602-43 = "[s3] «Стать единым целым со скейтбордом...»\n[s4] «Ладно! Я понял!»"
2000602-44 = ""
2000602-45 = ""
2000602-46 = ""
2000602-49 = "[ns] «Поехали!»"
2000602-50 = "*грохот*"
2000602-52 = "Ну, скорость у вас была приличная... пусть и под горку. По сравнению с первой попыткой вы явно продвинулись."
2000602-53 = "Но что-то тут не так..."
2000602-54 = ""
2000602-55 = "Постойте! Это ВЫ катились с горки, а не скейтборд!"
2000602-56 = "Я ВОВСЕ не это имела в виду, когда сказала стать единым целым с доской!"
2000602-58 = "Я начал замедляться только после двенадцати с половиной оборотов."
2000602-59 = "На следующий день я даже с кровати не смог встать — всё тело было в синяках."
