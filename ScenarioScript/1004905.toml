[translation]
1004905-1 = "Неудачный момент"
1004905-2 = "Я наслаждался долгожданным выходным."
1004905-3 = "Я выспался и в конце концов вышел в магазин за обедом."
1004905-4 = ""
1004905-8 = ""
1004905-9 = ""
1004905-10 = ""
1004905-11 = "............"
1004905-12 = "Что?!"
1004905-13 = "[ns] «...?»"
1004905-15 = "[ns1] «...Там кто-то есть?»\n[ns2] Пойти на звук."
1004905-18 = ""
1004905-19 = ""
1004905-20 = ""
1004905-21 = "...!!!"
1004905-22 = "...Она убежала."
1004905-23 = "[ns3] Пойти за ней.\n[ns4] «Почему ты меня избегаешь...»"
1004905-26 = ""
1004905-27 = ""
1004905-28 = ""
1004905-29 = ""
1004905-30 = ""
1004905-31 = "...! А-а! Ай..."
1004905-32 = "[s] «...Казуса?»"
1004905-35 = "― Эм.[wa:680]"
1004905-37 = "― Вы сразу меня узнали?[wa:10]"
1004905-40 = "― Понятно..."
1004905-42 = "― Д-Да, логично. Конечно, узнали бы...[wa:480]"
1004905-45 = "― Н-Нет,[wa:490]"
1004905-47 = "― я вовсе не избегала вас...[wa:10]"
1004905-50 = "― Я-я просто... эм...[wa:1240]"
1004905-52 = "― Ну, эм... Я ещё не накрасилась.[wa:1140]"
1004905-55 = "― Не смотрите так близко...![wa:2660]"
1004905-58 = "― Я же сказала, Сенсей."
1004905-60 = "― Не подходите ближе![wa:180]"
1004905-63 = "[ns5] «Может, тебе не стоит так переживать из-за этого.»\n[ns6] «Какая разница, накрашена ты или нет?»"
1004905-64 = "― П-Правда? ...Вот как?[wa:2640]"
1004905-65 = "― П-Правда? ...Вот как?[wa:2640]"
1004905-67 = "― Ну... Надеюсь, это правда...[wa:1160]"
1004905-70 = "― Что это за реакция...?[wa:650]"
1004905-73 = "― Э-Эй! Не смейтесь! Что смешного?[wa:520]"
1004905-75 = "― Эй!!!"
1004905-78 = "*вздох* Забудьте. Злиться на вас всё равно бесполезно."
1004905-79 = "Вы уже закончили с покупками? Тогда уходите. Из-за вас я не могу спокойно ходить по магазину."
1004905-80 = "А?!"
1004905-81 = "Вы ничего не успели взять, потому что всё это время ходили за мной...?"
1004905-82 = "...О."
1004905-83 = "О, правда... Хахаха..."
1004905-84 = "Ха-ха-ха..."
1004905-85 = ""
1004905-87 = ""
1004905-88 = ""
1004905-89 = "Я сказала, прекратите!!!"
1004905-90 = "......"
1004905-91 = "В конце концов сотрудник магазина сделал нам замечание за «нарушение порядка»."
1004905-94 = ""
1004905-95 = "Ух... Я со стыда сгораю."
1004905-96 = "Чтобы было ясно, это ваша вина, Сенсей!"
1004905-97 = "Вы серьёзно? Вам было весело?"
1004905-98 = "Вы сегодня прямо специально действуете мне на нервы!"
1004905-99 = "Я стараюсь показать вам себя с лучшей стороны! Можно хоть немного уважать все мои усилия?"
1004905-100 = "*вздох* Почему я трачу всю энергию в свой выходной?"
1004905-101 = "...Так... возвращаясь к тому, что было..."
1004905-102 = "Вы правда имели в виду то, что сказали?"
1004905-103 = "[s7] «Что? Что мне всё равно, накрашена ты или нет?»\n[s8] «Ты заставишь меня повторить это ещё раз?»"
1004905-104 = "...Н-Ну, да."
1004905-105 = "Просто мне всё это немного неловко."
1004905-106 = "Ух, не стоит быть такой неуверенной."
1004905-107 = "Ладно-ладно. Просто поверю вам."
1004905-108 = "Но больше никогда не хочу слышать об этом. Иначе так врежу вам по голове, что память потеряете."
1004905-109 = "Х-Хорошо..."
1004905-110 = ""
1004905-112 = ""
1004905-113 = "Пока! Увидимся позже, Сенсей!"
1004905-114 = ""
1004905-116 = ""
1004905-117 = "[ns] «...»"
1004905-118 = "Казуса убежала вдаль, а я вернулся к работе."
