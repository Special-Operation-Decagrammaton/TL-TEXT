[translation]
1600215-1 = "Необычные очки"
1600215-2 = "На всякий случай я отправился в «Миллениум»."
1600215-3 = "А, Сенсей!"
1600215-4 = ""
1600215-6 = ""
1600215-7 = "Что вы делаете в «Миллениуме»?! У вас здесь работа?"
1600215-8 = "...Нет? Тогда это личное дело?"
1600215-9 = "...А? Ко мне?"
1600215-10 = "Вы пришли увидеться со мной?"
1600215-11 = "...Но почему?"
1600215-13 = "Я вкратце объяснил Котори, почему пришёл к ней."
1600215-14 = ""
1600215-15 = "Ах..."
1600215-16 = "Хм-м... Понятно..."
1600215-17 = "П-простите. Я вовсе не хотела заставлять вас волноваться, Сенсей."
1600215-18 = "Я сказала это слишком необдуманно. Не думала, что вы проделаете весь этот путь только ради меня."
1600215-19 = "Но, как видите, мои очки уже починили... Так что, к счастью, волноваться совершенно не о чем!"
1600215-20 = "А. Эм. Может, это на самом деле даже немного жаль?"
1600215-21 = "Ведь получается, что я заставила вас прийти сюда совершенно зря."
1600215-22 = "[s1] «Я просто рад знать, что всё хорошо.»\n[s2] «Я могу тебя увидеть, поэтому всё хорошо!»"
1600215-25 = "А-а-а..."
1600215-26 = "Большое вам спасибо."
1600215-27 = "...Что?"
1600215-28 = "...Вам кое-что интересно?"
1600215-29 = ""
1600215-31 = ""
1600215-32 = "...И-интересно... кое-что?!"
1600215-33 = "Да! Пожалуйста, скажите! Что вам интересно, Сенсей?!"
1600215-34 = "Спрашивайте всё, что пожелаете, Сенсей! Я, Тоёми Котори, отвечу на любой ваш вопрос. А если не знаю ответа — узнаю и всё равно отвечу!"
1600215-35 = "Что угодно, лишь бы отблагодарить вас за то, что пришли ко мне!"
1600215-36 = "[s3] «Ты уверена?»\n[s4] «Что угодно?»"
1600215-39 = "Да, конечно!"
1600215-40 = "Всё нормально! Что угодно!"
1600215-41 = ""
1600215-44 = "[ns] «...Тогда...»"
1600215-45 = ""
1600215-48 = "[ns5] «Эти очки для тебя особенные?»\n[ns6] «Похоже, ты очень дорожишь своими очками.»"
1600215-51 = "А! Вам интересны мои очки? Ну, понимаете...!"
1600215-52 = ""
1600215-54 = ""
1600215-55 = "...Эм."
1600215-56 = "М-мои... мои очки? Ну... это... э-эм..."
1600215-57 = ""
1600215-59 = ""
1600215-60 = ""
1600215-61 = "Угх. Я совсем не ожидала такого вопроса, поэтому даже слов подобрать не могу!"
1600215-62 = "Меня вдруг охватило чувство дежавю..."
1600215-63 = "А-ха-ха... Ваши личные вопросы всегда заставляют меня так себя чувствовать."
1600215-64 = "Э-э..."
1600215-65 = "...Нет! Так нельзя! Я не позволю этому повториться!"
1600215-66 = "Я сказала, что отвечу на любой вопрос, значит, так и будет! Соберись, Котори!"
1600215-67 = "Эм... Э-э... *вдох* *выдох*"
1600215-68 = "[s7] «Если не можешь ответить, ничего страшного.»\n[s8] «(В этой ситуации правда нужно глубоко дышать...?)»"
1600215-69 = ""
1600215-70 = ""
1600215-72 = ""
1600215-73 = "Всё хорошо. Я успокоилась и, как обещала, отвечу!"
1600215-74 = "...На самом деле всё не настолько серьёзно, как я это выставляю."
1600215-76 = "Сенсей, посмотрите вот на эту сторону моих очков. Выглядит немного необычно, правда?"
1600215-77 = "Из-за такой необычной формы заменить линзу довольно сложно!"
1600215-78 = "Но у этих очков есть особенность, которой нет у обычных!"
1600215-79 = "В каком-то смысле я специально выбрала именно такой дизайн!"
1600215-80 = "Как вы прекрасно знаете, я часто читаю лекции о самых разных вещах. А когда начинаю что-то объяснять, могу слегка затянуть."
1600215-81 = "Поэтому эти очки специально сделаны так, чтобы слушателям было на чём сосредоточить взгляд во время моих лекций!"
1600215-82 = "Проще говоря, они служат визуальной точкой фокусировки. И, что удивительно, это действительно довольно эффективно!"
1600215-83 = "[s9] «Ага!»\n[s10] «Неожиданно практично!»"
1600215-86 = ""
1600215-87 = "Фу. Фу. Фу. Теперь вы всё поняли, Сенсей!"
1600215-88 = "Даже такая мелочь помогает людям сосредоточиться и, следовательно, лучше усвоить информацию, которую я доношу!"
1600215-89 = "...Хотя в последнее время люди, кажется, убегают, едва увидев мои очки."
1600215-90 = "[s11] «(...И правда.)»\n[s12] «Они стали частью твоей личности.»"
1600215-93 = "Да! И в любом случае они всё ещё отлично работают на новичках, которые ещё ни разу не слышали моих лекций!"
1600215-94 = "Когда в этот раз мои очки сломались, я действительно подумывала вернуться к обычной паре, за которой проще ухаживать..."
1600215-95 = ""
1600215-97 = ""
1600215-98 = "[ns13] «...Котори?»\n[ns14] «Ты только что... замолчала??»"
1600215-101 = "...Хи-хи."
1600215-102 = "Знаете что? Оставить их — определённо лучший вариант."
1600215-103 = "Ведь если бы я их сменила, этой чудесной ситуации никогда бы не случилось!"
1600215-105 = "Мы с Котори ещё немного поболтали за лёгким перекусом, после чего я вернулся в «Шале»."
