[translation]
3001-1 = "Тень консервов, часть 1"
3001-2 = ""
3001-4 = "Офис частной охранной консалтинговой компании Blackstone"
3001-5 = ""
3001-6 = ""
3001-8 = ""
3001-9 = "Хи-хи... План идёт гладко."
3001-10 = "Я плачу головорезам, чтобы они нападали на маленькую школу, а потом эффектно появляюсь и предлагаю защиту от этих же головорезов! Нет спроса на товар — создай его сама!"
3001-11 = "Похоже, взять пример с Кайзер и правда было верным решением!"
3001-12 = "Если продолжу в том же духе, моя военная корпорация станет даже крупнее Кайзер Group!"
3001-13 = ""
3001-17 = ""
3001-19 = "Босс! На нас напали!"
3001-20 = "Что? Кто посмел напасть на нашу компанию?"
3001-21 = "Это те соплячки из Валькирия? Мы же уже подкупили руководство Управления обороны!"
3001-23 = "Э-Это не полиция. Это агенты SRT!"
3001-24 = "SRT?! Я думала, Генеральный студенческий совет уже закрыл академию SRT!"
3001-25 = "Как они узнали, что мы здесь?!"
3001-26 = "Ух... Мы столько вложили в этот бизнес..."
3001-27 = "Я не собираюсь сейчас всё бросать!"
3001-28 = ""
3001-33 = ""
3001-34 = "SRT! Всем поднять руки и сделать шаг назад!"
3001-35 = "RABBIT 1, докладываю. Время 13:30. Я прибыла в точку Whiskey."
3001-36 = "...Охрана у входа уже обезврежена. Переходим к следующей фазе."
3001-38 = "Да кем они себя возомнили!"
3001-40 = "Вы представитель этой охранной компании?"
3001-41 = "В отчёте, «случайно» добытом из Бюро безопасности Валькирия на прошлой неделе, есть доказательства вашей причастности к недавней серии нападений на небольшие школы."
3001-42 = "Несмотря на эти доказательства, Бюро безопасности Валькирия, похоже, не смогло вас арестовать из-за сложных административных процедур Управления обороны."
3001-43 = "К вашему несчастью, академия SRT была создана именно для обхода бюрократической волокиты."
3001-45 = "Ух... Никогда не думала, что нас поймают вот так."
3001-46 = "Но я не позволю таким мелким сошкам разрушить компанию, над которой столько работала!"
3001-47 = "Я глава ЧВК и давно работаю наёмницей. В ближнем бою я уверена в себе!"
3001-48 = ""
3001-50 = ""
3001-51 = ""
3001-52 = ""
3001-53 = "Ну давайте! Нападайте!"
3001-54 = ""
3001-58 = ""
3001-59 = ""
3001-60 = "С-Снайперский огонь прямо на этих улицах...?!"
3001-61 = ""
3001-63 = ""
3001-64 = ""
3001-66 = "...RABBIT 4. Цель устранена."
3001-67 = "Я продолжу наблюдение отсюда."
3001-69 = "Ух, босса вырубили..."
3001-70 = "Нас поймали! А связываться со спецагентами SRT мне совсем не хочется."
3001-71 = "Б-Бежим!"
3001-72 = "Ещё чего! Не уйдёте!"
3001-73 = ""
3001-83 = "Сектор A чист. Все противники быстро устранены."
3001-84 = "С-Сектор B тоже. Мы обезвредили всех, кто не у-успел сбежать."
3001-85 = "Отличная работа, все."
3001-86 = "Свяжите обезвреженных противников и запросим у Полицейской школы Валькирия помощь с дальнейшей обработкой."
3001-87 = "А потом возвращаемся домой."
3001-89 = "Разве это не была база ЧВК? Ничего полезного для меня не нашли?"
3001-90 = "Даже если это припасы, предназначенные к утилизации, я всё равно смогу найти им применение."
3001-91 = "К сожалению, здесь только стрелковое оружие, причём большая часть оборудования и боеприпасов несовместима с нашим нынешним снаряжением."
3001-92 = "Нам остаётся только утилизировать их или передать Полицейской школе Валькирия."
3001-94 = "Не то чтобы я пришла сюда ради награды, но найти что-нибудь было бы приятным бонусом."
3001-95 = "М-Мияко, Саки. А что насчёт этих коробок?"
3001-96 = "На них написано: «Еда»."
3001-97 = ""
3001-99 = ""
3001-102 = "Это... армейские пайки."
3001-103 = "И срок годности ещё не вышел!"
3001-104 = "Ха-ха! Отлично! Похоже, всё-таки получили немного трофеев!"
3001-105 = "Ты сказала еда? Что там? А? Рассказывай!"
3001-107 = "Много разных видов пайков. Обычно они специально обработаны для долгого хранения..."
3001-108 = "Так что для нас, живущих в палатке, они подходят куда лучше бэнто, которыми мы питались."
3001-109 = "И п-посмотрите, сколько их..."
3001-111 = "Знаю, я придираюсь, но некоторые из них так себе."
3001-112 = "«Вегетарианский омлет с сыром чеддер», «овсяная каша», «сублимированный рис с красной фасолью для холодных регионов...»"
3001-113 = ""
3001-115 = ""
3001-117 = "Ух... Я уже пробовала этот соус из смеси морепродуктов. Он ужасен."
3001-118 = "А я думала, пайки обычно безвкусные."
3001-119 = "Раньше армейские пайки и правда были довольно отвратительными, но сейчас всё иначе."
3001-120 = "Вкусная еда сильно повышает боевой дух солдат, поэтому войскам выгодно, чтобы пайки были вкуснее."
3001-121 = "Раньше наука была развита слабее, поэтому боевые пайки были твёрдыми и пресными. Сейчас можно наслаждаться даже сочной и ароматной едой где угодно."
3001-122 = "Также разработали специальные продукты вроде тофу-«мяса» для вегетарианцев и солдат с аллергиями, так что видов армейских пайков теперь множество."
3001-124 = "П-Понятно..."
3001-125 = "Саки... Т-Ты так много обо всём знаешь..."
3001-126 = "Н-Но даже если ты читала об этом в у-учебниках, когда ты успела всё это попробовать?"
3001-127 = "Ага, выкладывай, чудила. На тренировках мы ели боевые пайки всего несколько раз."
3001-129 = "Н-Ну..."
3001-130 = "Я слышала, что армейские пайки — основная еда спецназа, вот мне и стало интересно, ясно?"
3001-131 = "Мне не терпелось, поэтому я купила и попробовала их ещё до поступления в SRT..."
3001-132 = "О? О-хо-хо? На нашу книжную умницу это совсем не похоже."
3001-133 = "Ну вот и настало время признаться, Саки! Ты поступила, чтобы попробовать все крутые штуки SRT, да? А вовсе не из чувства долга!"
3001-134 = "Да ладно, мы тут все кучка задротов. Можешь говорить честно."
3001-135 = "З-Замолчи! Это вообще никак не связано!"
3001-137 = "Независимо от вкуса, я рада, что какое-то время нам не придётся беспокоиться о еде."
3001-138 = "Собираем всё и возвращаемся домой."
3001-140 = "...Той ночью."
