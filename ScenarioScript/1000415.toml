[translation]
1000415-1 = "Тяжёлая ноша"
1000415-2 = "Ни секунды не раздумывая, я поспешил в комнату Хины."
1000415-3 = ""
1000415-6 = "[ns] «Я пришёл, Хина.»"
1000415-8 = "Да, Сенсей, заходи."
1000415-9 = "[s] «Прошу прощения за вторжение.»"
1000415-10 = ""
1000415-15 = "Хи-хи... Ну и ну, Сенсей, похоже, ты и правда примчался сломя голову."
1000415-16 = ""
1000415-18 = ""
1000415-19 = "Весь вспотел. Ты в порядке?"
1000415-20 = "По дороге... что-то случилось?"
1000415-21 = "[ns1] «Нет, я просто бежал сюда.»\n[ns2] «Я обрадовался твоему звонку.»"
1000415-24 = "[ns3] «...Но ты сама в порядке?»\n[ns4] «У тебя огромные круги под глазами.»"
1000415-27 = "А, ну, понимаешь..."
1000415-28 = "До самого утра я была завалена работой Префектурной команды."
1000415-29 = "Зато благодаря этому сегодня смогла взять выходной и немного отдохнуть."
1000415-30 = "[s] «О, а мне точно стоит приходить в твой выходной?»"
1000415-31 = "Ну..."
1000415-32 = "Вообще-то... ты здесь ИМЕННО из-за моего выходного."
1000415-33 = "Я хотела тебя увидеть, Сенсей..."
1000415-34 = "Конечно, я не думала, что ты так легко согласишься прийти по первому зову..."
1000415-35 = "Это была детская просьба. Очень мило с твоей стороны, что ты её выполнил."
1000415-36 = "Спасибо."
1000415-37 = "[s] «Не стоит благодарности. Я всегда рад быть рядом, если нужен тебе.»"
1000415-38 = "Н-неужели?"
1000415-39 = "...Хи-хи, хорошо..."
1000415-40 = ""
1000415-42 = ""
1000415-43 = "Немного поздно говорить об этом сейчас, но..."
1000415-44 = "Как ты заметил, у меня эти круги под глазами, и... ну, выгляжу я сейчас не лучшим образом."
1000415-45 = "Не могу поверить, что позвала тебя к себе вот в таком виде..."
1000415-46 = "Если подумать... Как бы это сказать...?"
1000415-47 = "Ну, мне немного неловко, вот и всё."
1000415-48 = "[s5] «Не беспокойся об этом!»\n[s6] «Главное — насладиться остатком выходного.»"
1000415-51 = "О-Ох?"
1000415-52 = "[ns] «Конечно! Давай устроим лучший отдых в мире.»"
1000415-53 = ""
1000415-55 = ""
1000415-56 = "...Да, пошли."
1000415-57 = ""
1000415-59 = ""
1000415-60 = ""
1000415-61 = "О... П-Прости, Сенсей, ещё кое-что..."
1000415-62 = "Я так увлеклась работой, что забыла позавтракать."
1000415-63 = "[s] «Если хочешь хорошо провести день, надо начать с полного желудка.»"
1000415-64 = "Это правда..."
1000415-65 = "Может, выйдем куда-нибудь и поищем что поесть...?"
1000415-66 = "[s] «Нет, отменяется!»"
1000415-67 = "А? Почему...?"
1000415-68 = "[s] «Я не могу позволить тебе так тратить силы!»"
1000415-69 = "Разве сходить поесть в выходной — это правда пустая трата сил?"
1000415-70 = "Ч-Что тогда предлагаешь?"
1000415-71 = "Дома у меня почти нечего есть..."
1000415-72 = "[s] «Хина, я тут подумал...»"
1000415-73 = ""
1000415-75 = ""
1000415-76 = "[ns] «Ты любишь лапшу быстрого приготовления?»"
1000415-77 = "Вполне..."
1000415-84 = "[ns] «Отлично. Дай мне три минуты. Поедим вместе.»"
1000415-85 = "Но, Сенсей... ты ведь заслуживаешь чего-то получше лапши быстрого приготовления."
1000415-86 = "Ты пришёл ко мне издалека. Я надеялась угостить тебя чем-то более достойным..."
1000415-87 = "[s7] «Неважно, что мы будем есть.»\n[s8] «Важно, что мы будем есть вместе.»"
1000415-90 = "[ns9] «Если только ты не хочешь.»\n[ns10] «Ты не обязана соглашаться лишь потому, что я сказал.»"
1000415-93 = "Нет-нет! Всё нормально."
1000415-94 = "...Я не ненавижу лапшу быстрого приготовления."
1000415-95 = "Иногда ела её, в основном во время операций. Просто..."
1000415-96 = "...она никогда не казалась мне полноценной едой."
1000415-97 = "[s11] «По крайней мере, это удобно.»\n[s12] «Что ж, рад слышать, что ты ела это не слишком часто.»"
1000415-100 = "[ns] «Как бы ты ни была занята, нужно нормально питаться.»"
1000415-101 = ""
1000415-103 = ""
1000415-104 = "Пф."
1000415-105 = "Тебе ли это говорить."
1000415-106 = "Я могла бы сказать тебе то же самое."
1000415-107 = "[s] «Хм... справедливо.»"
1000415-108 = "И всё же..."
1000415-109 = "Если подумать..."
1000415-110 = "Сидеть здесь, у меня в комнате, вместе с тобой... ждать, пока заварится лапша..."
1000415-111 = "...Это довольно непривычно и даже приятно."
1000415-112 = ""
1000415-115 = ""
1000415-116 = "[ns] «Готово, Хина! Давай есть!»"
1000415-117 = "Ладно."
1000415-118 = ""
1000415-120 = ""
1000415-121 = ""
1000415-122 = "[ns] «Ну как?»"
1000415-123 = "...Вкусно."
1000415-125 = "После этого мы с Хиной продолжили заниматься разными вещами в её выходной."
1000415-128 = "Хм? Ты хочешь просто посидеть и посмотреть телевизор вместе?"
1000415-129 = "Это хороший способ расслабиться — просто смотреть что попадётся по телевизору..."
1000415-130 = "...не ожидая ничего особенного...?"
1000415-131 = "Хм... Я не знаю, но..."
1000415-132 = "Если ты так говоришь, Сенсей."
1000415-133 = "Мы посмотрели комедийное шоу с какими-то знаменитостями, о которых ни один из нас никогда не слышал."
1000415-136 = "[ns] «Хина, придумал! Давай построим четырёхэтажный карточный домик!»"
1000415-137 = "Ч-Что, вот так внезапно?"
1000415-138 = "Хм, значит, такая простая работа может успокаивать разум...?"
1000415-139 = "Н-Ну, не уверена, что у меня получится, но попробую."
1000415-142 = "Мы снова и снова терпели неудачу, но каждый раз смеялись и получали удовольствие от процесса."
1000415-145 = "[ns] «Хина, территория академии Геенна впереди хорошо охраняется.»"
1000415-147 = "[ns] «Будь готова!»"
1000415-148 = "Все районы впереди заняты. У нас хватит денег на пошлину, ЕСЛИ они вдруг не решат поднять её вдвое."
1000415-149 = "Нужно действовать решительно, чтобы выбраться из этой угрозы."
1000415-150 = ""
1000415-152 = ""
1000415-153 = "Хорошо. Всё, что мне нужно..."
1000415-154 = "...добраться до того необитаемого острова!"
1000415-155 = ""
1000415-159 = ""
1000415-160 = "Мы играли в настольную игру, где нужно путешествовать по районам Кивотоса, бросая кубики и скупая недвижимость."
1000415-167 = "Гх..."
1000415-168 = "Э-Эта атака сняла нам половину здоровья!"
1000415-169 = "[s13] «Не сдавайся!»\n[s14] «У нас ещё есть Эликсир, который мы берегли...!»"
1000415-172 = "Эликсир, точно. Если выпью его сейчас, магия восстановится..."
1000415-173 = "...и тогда я смогу уничтожить этого босса!"
1000415-174 = "Но тогда..."
1000415-175 = "...а если он понадобится позже, против босса сильнее? Не могу решить!"
1000415-176 = "Сохраню пока!"
1000415-177 = "[s] «Я понимаю тебя! Правда понимаю!»"
1000415-178 = ""
1000415-180 = ""
1000415-185 = ""
1000415-186 = ""
1000415-187 = "Мы играли в видеоигру, которую я давно купил, но всё не находил времени запустить."
1000415-193 = "Так мы и проводили время вместе."
1000415-197 = "Мы и не заметили, как солнце уже начало садиться."
1000415-200 = "...Ах."
1000415-201 = "Не думала, что сегодня будет настолько весело."
1000415-202 = "И всё благодаря тебе, Сенсей."
1000415-203 = "[s] «Я просто рад, что смог тебе помочь.»"
1000415-205 = "[ns15] «К тому же для меня день тоже был хорошим.»\n[ns16] «Я увидел твою неожиданную сторону.»"
1000415-208 = "О? Неожиданную сторону меня...?"
1000415-209 = "[s17] «Обычно ты очень тщательно ко всему подходишь.»\n[s18] «А во время игры у тебя на лице такое выражение...»"
1000415-212 = "А...?"
1000415-213 = "Ч-Что ещё за выражение...?"
1000415-214 = "Э-Эй, С-Сенсей...?"
1000415-215 = "[s] «Хахаха, я просто шучу.»"
1000415-216 = ""
1000415-218 = ""
1000415-219 = "...Ах, ну и человек же ты."
1000415-220 = "[s] «Слушай, работа главы Префектурной команды довольно тяжёлая, да?»"
1000415-221 = "...Я бы солгала, сказав, что легко."
1000415-222 = ""
1000415-224 = ""
1000415-225 = ""
1000415-227 = "Но сейчас это уже настолько естественно для меня, будто часть самой себя."
1000415-228 = "С того дня, как я впервые надела повязку Префектурной команды... я каждый день чувствую её вес."
1000415-229 = "Иногда мне хотелось сбежать, иногда — всё бросить..."
1000415-230 = "Порой хотелось пожаловаться и сказать, что я больше не справляюсь, но..."
1000415-231 = "...потом случаются такие дни, как сегодня."
1000415-232 = ""
1000415-234 = ""
1000415-235 = "И я понимаю, что выдержала и дошла сюда не только благодаря своим усилиям, но и поддержке окружающих."
1000415-236 = "А теперь, когда рядом есть такие люди, как ты, Сенсей, которые доверяют мне..."
1000415-237 = "Я знаю, что смогу идти дальше и не сдаваться."
1000415-238 = "Как бы тяжело ни было."
1000415-239 = ""
1000415-242 = "[ns] «Ты правда удивительная, Хина.»"
1000415-243 = "П-Правда?"
1000415-244 = "О нет, любой на моём месте поступил бы так же."
1000415-245 = "Я не заслуживаю такой похвалы..."
1000415-246 = "[s19] «Ты заслуживаешь всей похвалы мира.»\n[s20] «Не каждый смог бы сделать то, что сделала ты.»"
1000415-249 = "[ns21] «Ты проявила исключительную преданность делу.»\n[ns22] «Я лишь говорю тебе правду, как и подобает учителю.»"
1000415-252 = "Ну, полагаю, я поняла."
1000415-253 = ""
1000415-258 = ""
1000415-259 = ""
1000415-260 = "...Да, сообщение принято."
1000415-261 = ""
1000415-263 = ""
1000415-264 = "Г-Глава! Простите..."
1000415-265 = "Я знаю, у вас сегодня выходной, но..."
1000415-266 = "Сейчас в северном районе Геенны огромный переполох...!"
1000415-267 = ""
1000415-271 = "Что?! Полномасштабная война между Отделом горячих источников и Бандой Шлемов?! Из-за чего они вообще дерутся?!"
1000415-272 = "Они в ярости из-за перепродажи билетов на горячие источники?!"
1000415-273 = ""
1000415-275 = ""
1000415-276 = "...Понятно, да, именно из-за этого."
1000415-277 = ""
1000415-279 = ""
1000415-280 = "*вздыхает*"
1000415-281 = "Ну что ж, Сенсей, мой выходной на этом закончился."
1000415-282 = "[s] «Да. Похоже, дел у тебя выше крыши.»"
1000415-283 = "...Так и есть, но я целый день отдохнула с тобой. Теперь я готова."
1000415-284 = "Если позволишь..."
1000415-285 = ""
1000415-290 = ""
1000415-291 = "Главу Префектурной команды ждёт работа."
1000415-292 = "[s] «Береги себя, Хина.»"
1000415-293 = ""
1000415-295 = ""
1000415-296 = ""
1000415-297 = ""
