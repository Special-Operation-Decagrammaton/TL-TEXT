[translation]
11007-2 = "Por mim já deu, o resto fica com vocês."
11007-5 = "Ela tá fugindo!! Vamos atrás dela!"
11007-6 = "Não, não podemos agir por impulso. Nosso objetivo é única e exclusivamente retomar o Schale."
11007-7 = "Devemos continuar avançando direto até o prédio do Schale."
11007-8 = "...É, tá bom. Ir atrás dela não é trabalho nosso mesmo."
11007-9 = "E também pode ser uma armadilha."
11007-10 = "Sim. Vamos priorizar a retomada do prédio. Continuemos avançando."
