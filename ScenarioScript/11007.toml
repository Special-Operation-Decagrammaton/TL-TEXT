[translation]
11007-2 = "Моя работа здесь закончена. Остальное оставляю вам."
11007-3 = ""
11007-5 = "Она убегает?! За ней!"
11007-6 = "Нет, нельзя действовать безрассудно. Наша цель — вернуть клубную комнату Шале."
11007-7 = "Нам нужно добраться до здания."
11007-8 = "...Ладно. Полагаю, ловить её — не наша работа."
11007-9 = "К тому же это вполне может быть ловушка."
11007-10 = "Именно. Наш приоритет — вернуть здание. Продолжаем движение."
