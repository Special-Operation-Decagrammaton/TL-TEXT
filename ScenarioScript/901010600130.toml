[translation]
901010600130-7 = ""
901010600130-8 = "Эм, извините."
901010600130-9 = "Вижу, вы и сегодня много работаете. Почему бы не сделать перерыв и не выпить бесплатный ледяной энергетик?"
901010600130-10 = ""
901010600130-12 = ""
901010600130-13 = "Погоди, разве ты не та девушка-курьер, что была здесь пару дней назад?"
901010600130-14 = "Моя героиня! Большое спасибо, юная леди!"
901010600130-15 = "Фуфу, поблагодарить меня можете, поставив лайк в приложении FOX EATS!"
901010600130-16 = "Кстати, ваш коллега вон там рассказывал мне..."
901010600130-17 = "Что-то про парня, Мия... как-то так. Новый член команды, который пропал?"
901010600130-18 = "Старик опять разболтался..."
901010600130-19 = "Не переживай за парня. Здесь такое постоянно случается."
901010600130-20 = "Часто? Работа на рыбалке настолько тяжёлая?"
901010600130-21 = "Ага, конечно, многие молодые увольняются. Работа тяжёлая. И одинокая."
901010600130-22 = "Но Миягучи не был таким ленивым, как говорит старик. Да, жаловался много, но работу выполнял. И выполнял хорошо."
901010600130-23 = "Может, с ним и произошёл несчастный случай, но я думаю, он сбежал из-за долгов."
901010600130-24 = ""
901010600130-26 = ""
901010600130-27 = "Долгов?"
901010600130-28 = "О да. Многие рыбаки идут на судно, чтобы расплатиться с долгами... или сбежать от них."
901010600130-29 = "Работа тяжёлая и иногда опасная, но за короткое время можно хорошо заработать, если погода благоволит."
901010600130-30 = "И ещё я слышал, Миягучи был азартным игроком. Дурак. Попытал удачу и только глубже залез в яму."
901010600130-31 = "Похоже, он даже взял займ у семьи Карпаччо..."
901010600130-33 = "Семьи Карпаччо?"
901010600130-34 = "Ага. Вы их видели... те, в чёрном, у ворот. Никто не входит и не выходит, не поговорив с ними."
901010600130-35 = ""
901010600130-39 = "Это их территория, и именно они отвечают за охрану порта Канэсаки."
901010600130-40 = "Они дают займы людям с плохой кредитной историей. Как и ожидаешь, семья Карпаччо берёт безумные проценты."
901010600130-41 = "Миягучи ни за что не смог бы это выплатить. Уверен, он сбежал, пока долг не стал совсем неподъёмным."
901010600130-42 = "Понятно... Как страшно."
901010600130-43 = "Ещё бы. Так что слушай, девочка — держись подальше от азартных игр!"
901010600130-44 = "И от частных займов тоже!"
901010600130-45 = "Обязательно запомню."
