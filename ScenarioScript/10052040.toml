[translation]
10052040-1 = "Форма"
10052040-2 = "Угх..."
10052040-3 = "[s] «Ты в порядке?»"
10052040-4 = "Меня немного тошнит. Особенно с левой стороны головы..."
10052040-5 = "[s] «Почему?»"
10052040-6 = "Это потому, что мы принесли ядро Бины на борт и активировали его..."
10052040-7 = "..."
10052040-8 = "Всё будет нормально. Мне просто нужно привыкнуть к потоку энергии... Представьте постоянный писк, который следует за вами повсюду. К нему нужно адаптироваться."
10052040-9 = "[s] «...Ты правда будешь в порядке, да...?»"
10052040-10 = "Правда буду. С каждой секундой становится легче. Но... так будет происходить каждый раз, когда мы активируем ядро пророка."
10052040-11 = "Возможно, я так реагирую, потому что это тело признали «дефектным»... Или там было «повреждённым»?"
10052040-12 = "Главное вот что. Активация ядра позволяет нам перенастраивать мощность и функции корабля."
10052040-13 = "И поскольку поток этой энергии сейчас явно связан с этим телом... я должна суметь им управлять."
10052040-14 = "[s] «Я не очень понимаю, но переживаю, что дорогая Кей-Кей слишком себя изматывает.»"
10052040-15 = "Я не «Кей-Кей». Серьёзно. У меня и без того голова болит."
10052040-16 = ""
10052040-18 = ""
10052040-20 = ""
10052040-21 = ""
10052040-22 = ""
10052040-23 = ""
10052040-24 = "Арис...? Что это...?"
10052040-25 = "Это школьная форма, Кей!"
10052040-26 = "Н-нет, это я понимаю, но зачем... ты показываешь её мне?"
10052040-27 = "Потому что именно в ней я была, когда впервые встретила всех!"
10052040-28 = "Мне... очень нравилось то чувство. Казалось, что всё возможно и впереди только хорошее. Поэтому я захотела поделиться этим чувством с Кей. Это тебе!"
10052040-29 = ""
10052040-31 = ""
10052040-32 = "Эм... Тебе не нравится...?"
10052040-33 = "Н-нет! Вовсе нет, Арис! Наоборот, наоборот..."
10052040-34 = ""
10052040-36 = ""
10052040-37 = "Хи-хи..."
10052040-38 = "Это вполне естественно. Наша школьная форма Миллениума была единственным рациональным выбором."
10052040-39 = "...Как же по-«риовски» вставить такой практичный комментарий."
10052040-40 = ""
10052040-41 = "[ns] «Школьная форма ученика — его боевая броня!»"
10052040-42 = "А ты что несёшь, Сенсей...?"
10052040-43 = "Что? Думаешь, урок — это «поле боя», где нужно побеждать боссов под названием «экзамены»?"
10052040-44 = "..."
10052040-45 = "Ладно, пусть будет по-твоему. Только перестань объяснять."
10052040-46 = "Т-тогда я..."
10052040-47 = "..."
10052040-48 = "Да! Пожалуйста, надень её, Кей! Я хочу посмотреть!"
10052040-49 = "...!"
10052040-52 = ""
10052040-54 = ""
10052040-55 = "К-как выглядит?"
10052040-56 = "Ого!"
10052040-57 = "[ns] «А...»"
10052040-58 = "К-как?! Я задала прямой вопрос! Скажите! Вы что, сейчас надо мной смеётесь?!"
10052040-59 = "Нет... Она тебе очень идёт, Кей. Правда подходит."
10052040-60 = "Ага. Я так и знала. Хи-хи. Ты очень милая!"
10052040-61 = "...!!!"
10052040-62 = "С-спасибо. Юзу... Мидори, тебе тоже."
10052040-63 = ""
10052040-65 = ""
10052040-66 = "Кей, ты в порядке? Тебе не жарко в стольких слоях одежды? Лицо покраснело."
10052040-67 = "Нет, всё хорошо. Я не перегреваюсь так сильно, как ты, Эйми."
10052040-68 = "Не волнуйся, Кей. Ты отлично выглядишь."
10052040-69 = "СЛИШКОМ отлично. Я почти чувствую угрозу. Всё-таки мне нужно сохранять звание главной милой, бледной и идеальной красавицы."
10052040-70 = "...У меня нет никакого желания отнимать его у тебя."
10052040-71 = "Какое облегчение. Моё сердце осталось цело после подтверждения, что я по-прежнему платонически идеальная, милая горничная непревзойдённой красоты."
10052040-72 = "Да. Это звание полностью твоё, Токи."
10052040-73 = ""
10052040-75 = ""
10052040-76 = ""
10052040-81 = ""
10052040-82 = "Эм, все..."
10052040-83 = "Так что... Большое вам спасибо..."
10052040-84 = "Хм? Что ты сказала? Мы тебя не слышим!"
10052040-85 = "Ух...!"
10052040-86 = ""
10052040-88 = ""
10052040-89 = "Б-БОЛЬШОЕ ВАМ СПАСИБО! ТЕПЕРЬ ЧЕРЕЗ ШЛЕМ СЛЫШНО? ДОВОЛЬНЫ?!"
10052040-90 = "Ахаха! Да, конечно! Теперь громко и ясно!"
10052040-91 = "[ns] «Ага, ага!»"
10052040-92 = "Ц...! Приходится слышать это от двух самых раздражающих людей в Кивотосе..."
10052040-93 = "В-В любом случае!"
10052040-94 = "Я буду носить эту форму только когда... необходимо. В особых случаях."
10052040-95 = "Но почему, Кей?"
10052040-96 = "Ну, это..."
10052040-97 = "..."
10052040-98 = "Вы явно вложили в этот подарок столько мыслей и... чувств. Я хочу беречь и сохранять его как можно дольше."
10052040-99 = "Понятно. Спасибо, Кей."
10052040-100 = "Н-нет... Если уж на то пошло, это я должна вас всех благодарить..."
10052040-101 = "Наверное, и это правда! Ну вот! Кей просто немного стесняется!"
10052040-102 = "Заткнись, Момои!!"
10052040-103 = ""
