[translation]
90001200-1 = "Эпизод 20;Предзнаменование"
90001200-6 = "Как видите, все мы сейчас находимся в тундре."
90001200-7 = ""
90001200-9 = ""
90001200-10 = ""
90001200-11 = "Я помню, вы рассказывали нам об огромном трансформирующемся роботе, которого встретили здесь!"
90001200-12 = "Точно-точно! Я тоже помню! Для сюжета сгодится!"
90001200-13 = "Да, Момой! Монстр! Трансформация! Робот!"
90001200-14 = "Это всё, что нужно, чтобы сделать божественную игру! Мы никак не можем провалиться!"
90001200-15 = "...Позволь спросить, Момой. Какую именно историю ты собираешься написать с такими элементами?"
90001200-16 = "Э-Это ещё надо придумать... А пока начнём с уничтожения мира!"
90001200-17 = "Нет. Отклонено."
90001200-18 = ""
90001200-20 = ""
90001200-21 = ""
90001200-22 = "Почему?!"
90001200-24 = "Госпожа Рио, как вы и сказали, я обнаружила следы железной дороги."
90001200-25 = "Приземлимся и разведаем местность? Или предпочтёте наблюдение с воздуха, Сенсей?"
90001200-26 = "[s1] «С такой высоты мы упустим детали.»\n[s2] «Давайте осторожно спустимся вниз.»"
90001200-29 = "Поняла, Сенсей. Не волнуйтесь. Если что-нибудь случится, я вас защищу."
90001200-30 = "[s] «Хорошо. На тебя действительно можно положиться, Токи!»"
90001200-31 = "Вы собираетесь выражать это чувство только словами?"
90001200-32 = "Эм, Токи? Ты ведь сейчас управляешь кораблём..."
90001200-33 = "Ничего не поделаешь. Пока что я последую приказу Рио."
90001200-34 = "Я снижу высоту. Пожалуйста, пристегните ремни и будьте готовы к турбулентности."
90001200-37 = ""
90001200-38 = "Здесь так... пустынно..."
90001200-39 = "Это естественно. Эта местность никогда не была заселена."
90001200-40 = "Да. И кто-то выбрал эти забытые земли, чтобы в спешке построить железную дорогу."
90001200-41 = "А когда нужное количество ресурсов было собрано, объект быстро забросили."
90001200-43 = "Похоже, пути во многих местах разрушены. Судя по всему, намеренно — чтобы ими нельзя было воспользоваться снова."
90001200-44 = "Но остатки путей всё ещё здесь."
90001200-45 = "Н-Но как нам... идти по следу? Пешком весь путь будет немного..."
90001200-46 = "Она права. Пока воспользуемся транспортом. Я могу вызвать корабль на автопилоте."
90001200-47 = ""
90001200-49 = ""
90001200-50 = ""
90001200-51 = ""
90001200-52 = ""
90001200-53 = "Так и сделаем. Если что-то пойдёт не так, у нас будет безопасное убежище в корабле."
90001200-54 = ""
90001200-56 = ""
90001200-58 = ""
90001200-59 = "...И жили они долго и счастливо."
90001200-60 = "А-А дальше? А потом? Что было потом?"
90001200-61 = "История подошла к концу, Эйн..."
90001200-62 = "Как же так...?"
90001200-63 = "Ну, сказки ведь обычно такие, да? Хотя Эйн чуть не расплакалась в середине, концовку почти всегда можно предсказать."
90001200-64 = "Н-Но...!"
90001200-66 = "О? Разве ты сама тоже чуть не расплакалась, Соф?"
90001200-67 = "Н-Неправда! Я просто, ну, эм...!"
90001200-68 = ""
90001200-70 = ""
90001200-71 = ""
90001200-72 = "Однако правда в том, что концовки заранее предопределены. Если уж так должно быть, то счастливый финал — идеальный вариант!"
90001200-73 = "Д-Да. Эхехе. А ещё м-мне понравилось, что это было голосом Старшей сестры..."
90001200-74 = "Какая следующая история, Старшая сестра? Следующую, следующую!"
90001200-76 = "Похоже, вам нравятся сказки, Эйн, Соф, Ор."
90001200-77 = "Д-Да! Нравятся! А когда их читаете вы, Старшая сестра... нравятся ещё сильнее...!"
90001200-78 = "И это ещё полезно для сбора данных о человеческой «реальности», верно?"
90001200-79 = "Хм, лично я не вижу в этой «пользе» ничего особенно интересного. Это глупые истории глупых людей."
90001200-80 = "Однако мне очень нравится слушать их голосом Старшей сестры."
90001200-82 = "Что мне прочитать следующим? Эта история рассказывает о журавле-рабочем, который хитростью поднимает революцию против коварной капиталистической лисы."
90001200-83 = "Или, быть может, сказку о ветре и солнце, которые сговорились похитить плащ бедного путника? Однако путешественник преодолевает все испытания."
90001200-84 = "Э-Эм... Я бы хотела..."
90001200-85 = ""
90001200-87 = ""
90001200-88 = ""
90001200-89 = "Сигнал тревоги?"
90001200-90 = "Посмотрим... О?"
90001200-91 = "Ч-Что? Этот плохой взрослый и группа Цукацуки Рио... вернулись в тундру...?"
90001200-92 = "Это..."
90001200-93 = "Ну-ну-ну. Вот оно что. Похоже, это их ответ на «объявление войны» Соф."
90001200-94 = "А причина их возвращения в тундру... Ага. Они собираются идти по остаткам наших транспортных путей."
90001200-95 = "Они быстро приближаются к ответу, не так ли? Есть пусть и ничтожный, но шанс, что всё примет неприятный оборот."
90001200-96 = "И что ты теперь скажешь в своё оправдание, Соф? Именно поэтому я отговаривала тебя копировать человеческие шалости вроде твоего «объявления войны»."
90001200-97 = "У-ух..."
90001200-98 = "Не волнуйся, не волнуйся. Иначе когда ещё мне выпадет возможность тебя поддразнить?"
90001200-99 = "Эй!"
90001200-100 = "Н-Но если они продолжат идти по этому маршруту, то в конце концов..."
90001200-101 = "Нет-нет-нет. Именно поэтому я и не беспокоюсь, Эйн."
90001200-102 = "А? Ах...!"
90001200-103 = "Да. Именно. На выбранном ими пути полно препятствий."
90001200-104 = "Хотя, похоже, они привлекли ещё людей. Стоит оценить ситуацию."
90001200-105 = "Я-я сделаю! Э-Эм... Так... Начнём с этой!"
90001200-106 = ""
90001200-108 = ""
90001200-109 = ""
90001200-110 = "Хм, хм, хммм. Посмотрим... Её зовут Сайба Момой. Характеристика — неорганизованный рассказчик. Других примечательных особенностей нет. Совершенно безвредна."
90001200-111 = ""
90001200-113 = ""
90001200-114 = ""
90001200-115 = "А это Сайба Мидори. Младшая сестра-близнец Сайбы Момой. Характеристика — иллюстратор-любитель. Других примечательных особенностей нет. Тоже безвредна."
90001200-116 = ""
90001200-118 = ""
90001200-119 = ""
90001200-120 = "И-и наконец... Ханаока Юзу...? Характеристика — о, программист...? В-в основном она тоже кажется безвредной."
90001200-121 = "Эйн, Соф, Ор. Я заметила это лишь на кратчайший миг, но разве два сигнала не промелькнули перед нами?"
90001200-122 = ""
90001200-124 = ""
90001200-125 = ""
90001200-126 = "С-Старшая сестра?! Пожалуйста, не напрягайтесь из-за таких мелочей!"
90001200-127 = "И-Именно! Такие вещи полностью наша обязанность. Вам следует беречь силы для куда более важных ситуаций!"
90001200-128 = "Однако я желаю быть полезной вам, мои младшие сёстры. Эйн, Соф, Ор."
90001200-130 = "Разве желание помочь младшим сёстрам — не естественный инстинкт старшей?"
90001200-131 = ""
90001200-133 = ""
90001200-134 = "А-Ах..."
90001200-135 = "Как блистательно... Как благородно..."
90001200-136 = "Однако, Старшая сестра, подобные выбивающиеся сигналы встречаются весьма часто. Это всего лишь незначительный шум."
90001200-137 = "Ага. Такой случайный шум обычно вызывают мезоны."
90001200-138 = "Теоретически ошибка возможна в любой электронной схеме. Это называется одиночным сбоем."
90001200-139 = "Т-Так что, если вы не против, п-пожалуйста, доверьтесь нам!"
90001200-140 = "В конце концов, мы же ваши гордые... младшие сёстры!"
90001200-142 = "..."
90001200-143 = "Принято. Я поняла. Тогда продолжу полагаться на вас."
90001200-144 = "Однако если вам всё же понадобится моя помощь, пожалуйста, не стесняйтесь просить. Обещаете?"
90001200-145 = "Да!"
90001200-146 = ""
90001200-149 = ""
90001200-150 = ""
90001200-151 = ""
90001200-152 = "Что ж... Что нам делать?"
90001200-153 = "Эм, ну, мы... То есть..."
90001200-154 = "Хм... Что же делать...?"
90001200-155 = "Оставьте их в покое."
90001200-156 = "Я так и знала, что ты это скажешь."
90001200-157 = "Но я ведь права, нет? Зачем вступать с ними в бой и попусту терять силы?"
90001200-158 = "Разве не лучше просто тянуть их время? Пусть бродят без цели."
90001200-159 = "Н-Наша г-главная задача сейчас... всё-таки стабилизировать пробудившегося Нецаха...!"
90001200-160 = "Это правда. И нам нужно увеличить скорость его расширения. Значит, чем больше времени они потратят впустую, тем лучше для нас."
90001200-161 = "И что произойдёт, даже если тот учитель и его разношёрстная компания доберутся до Узловых точек?"
90001200-162 = "Между ними и Стальным континентом стоит Тиферет. Для них это непреодолимое препятствие."
90001200-163 = "И-и даже если они каким-то образом пройдут Тифи, там ещё столько всего предстоит преодолеть!"
90001200-164 = "Тоже верно. В невозможном случае, если они победят привратника, Стальной континент — наша территория."
90001200-165 = "Им ни за что его не победить!"
90001200-166 = "Ой! Прости, Эйн. Прости. Я не хотела сказать, что это вообще возможно. Просто... эм... Ну ты понимаешь!"
90001200-167 = "При составлении планов нужно учитывать все возможные исходы, верно? Есть ещё всякие вещи вроде квантового туннелирования..."
90001200-168 = "Т-Ты права. Прости... Я..."
90001200-169 = "Ну-ну."
90001200-170 = "Как ты и сказала. Даже если случится самый невероятный и худший сценарий..."
90001200-171 = "...мы положим всему конец здесь, на Стальном континенте."
90001200-172 = "...Наша главная директива — сделать так, чтобы Старшей сестре никогда не пришлось выходить наружу."
90001200-173 = "А-Ах... Да... Ага. Верно..."
90001200-174 = "...Да. Верно. Этого нельзя допустить..."
90001200-175 = "...!"
90001200-176 = "Кстати, Ор. Хочешь разыграть кого-нибудь вместе со мной?"
90001200-177 = "Я? Как необычно. Чтобы ты сама позвала меня на «розыгрыш». Я слушаю."
90001200-178 = "По-моему, задумка довольно хорошая. Итак..."
90001200-179 = ""
90001200-181 = ""
90001200-182 = ""
90001200-183 = ""
90001200-184 = "...Вот так. Что думаешь?"
90001200-185 = "О-Ого..."
90001200-186 = "..."
90001200-187 = "Поняла! Ого, ого, ого, Соф! Откуда ты знаешь о моей склонности к подобным вещам?"
90001200-188 = "Как я могла не знать...? В любом случае ты согласна, верно?"
90001200-189 = "Разумеется! В первую очередь, если компания того учителя не способна преодолеть даже это, их возможности прискорбно ограничены!"
90001200-190 = "Эм, мне кажется, в такой ситуации говорить «не способны преодолеть даже это» не совсем справедливо..."
90001200-192 = "Меня это не касается!"
90001200-193 = "П-Правда..."
90001200-194 = "Я немедленно начну подготовку! Разумеется, это займёт некоторое время, так что проявите терпение!"
90001200-195 = ""
90001200-197 = ""
90001200-198 = "Ага-ага. Удачи."
90001200-201 = ""
90001200-202 = "Мы едем уже очень долго... Интересно, насколько далеко тянется этот путь..."
90001200-203 = "[s] «Такое чувство, будто мы едем по трансконтинентальной железной дороге...»"
90001200-204 = ""
90001200-206 = ""
90001200-207 = ""
90001200-208 = "Уже ночь... Нам всё равно продолжать?"
90001200-209 = "...При обычных обстоятельствах, учитывая риск, я бы одобрила ночную остановку."
90001200-210 = "Однако Стальной континент продолжает расти даже сейчас. Мы не можем сбавлять темп. Простите, все."
90001200-212 = "Форсированный марш..."
90001200-213 = "Меня это устраивает, госпожа Рио. Однако, похоже, железнодорожные пути здесь заканчиваются."
90001200-214 = "И-и?! Правда? Что нам делать??"
90001200-215 = "Это значит, что мы заблудились? Что делать...?"
90001200-216 = "...У меня ещё плохие новости."
90001200-217 = "В-Вы ведь шутите, да...?"
90001200-218 = "Очень хотелось бы."
90001200-219 = "Однако некоторое время назад мы потеряли сигнал GPS."
90001200-220 = "?!"
90001200-221 = "Она права... Что происходит? Я точно получала координаты со своего личного спутника...!"
90001200-222 = "[s] «У тебя есть личный спутник?! Как?!»"
90001200-223 = "...Это неважно. Сейчас важно то, что существует высокая вероятность, что мы заблудимся—"
90001200-224 = ""
90001200-227 = ""
90001200-228 = ""
90001200-229 = "...?! Пригнитесь! Держитесь за что-нибудь!"
90001200-230 = ""
90001200-237 = ""
90001200-238 = "Есть! Они попались!"
90001200-239 = "П-Получилось...!"
90001200-240 = "Нам удалось использовать бесшумные дроны Эйн, чтобы сфокусировать проекцию энергии Запретной силы... Превосходно. Теперь вся эта область окружена замкнутым энергетическим полем."
90001200-241 = "Их электронные устройства станут бесполезны, словно после мощнейшего ЭМИ-удара!"
90001200-242 = "Спасибо, Эйн! Ты всегда так нам помогаешь!"
90001200-243 = "Н-Не за что... Эхехе... Наши маховички всегда стараются изо всех сил...!"
90001200-244 = "По крайней мере, на этот раз название хоть как-то понятно..."
90001200-246 = "Как там дела?!"
90001200-247 = "Бесполезно, президент... Ни одна схема не отвечает."
90001200-248 = "Я предусмотрела защиту от ЭМИ, так как это могло случиться?"
90001200-249 = "Мой Аби-Эшух тоже полностью обесточен. Если нас сейчас атакуют из засады...!"
90001200-250 = "Ч-Что... с нами будет...?"
90001200-251 = "У-ух..."
90001200-253 = "Сенсей... Кей..."
90001200-254 = "[s3] «Давайте сначала все успокоимся.»\n[s4] «Паника нам никак не поможет.»"
90001200-257 = ""
90001200-260 = "[ns] «(Но что нам теперь делать?)»"
90001200-261 = "*вздох* Ну серьёзно. Хватит уже."
90001200-262 = "К-Кей?!"
90001200-263 = ""
90001200-264 = "[ns] «Кей???»"
90001200-265 = "Всё хорошо, Прин—Арис. Всё хорошо."
90001200-266 = "Можешь мне верить. Я знаю, что это такое и как этому противостоять."
90001200-267 = "П-Правда, Кей?"
90001200-268 = "Арис... Принцесса. Посмотри на меня. Смотри мне в глаза. Да. Отлично. Так и продолжай."
90001200-269 = "А теперь давай проучим этих «малявок»."
90001200-270 = "Пусть поймут, с кем они вообще решили связаться!"
90001200-271 = ""
90001200-273 = ""
90001200-274 = ""
90001200-275 = ""
90001200-278 = "Следующий эпизод;Последний долг"
