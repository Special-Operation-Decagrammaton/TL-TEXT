10002090-97 = "Только последние отбросы могут так не уважать вкусную еду!"
10002090-99 = "Что?! И уж кто-кто, а ты последняя, кому такое говорить!"
10002090-100 = "Хочешь вмешаться?"
10002090-101 = "Хорошо. Если встанешь у нас на пути, пощады не будет."
