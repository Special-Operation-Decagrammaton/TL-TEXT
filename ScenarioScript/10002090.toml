[translation]
10002090-1 = "Эпизод 9; Разбивание арбузов, часть 1"
10002090-2 = "Теперь переходим к «Разбиванию арбузов.»"
10002090-3 = "Вообще-то перед поездкой я забыла купить арбузы, но в Пляжной хижине удалось недорого купить один."
10002090-4 = ""
10002090-6 = ""
10002090-7 = ""
10002090-8 = "Мы уверены, что это обычный арбуз? Откуда знать, что внутри не бомба?"
10002090-9 = "Н-нет, это просто обычный арбуз. Его мы и будем разбивать."
10002090-10 = "Тогда проблем не будет. Я довольно хорошо умею обезвреживать бомбы."
10002090-11 = "Разбивание арбуза — пляжная традиция."
10002090-12 = "Кто-нибудь принёс палку?"
10002090-13 = "Хм?"
10002090-14 = "Нам нужно что-нибудь твёрдое, чтобы расколоть арбуз: палка, бита, деревянный меч... Что-то в таком духе."
10002090-15 = "Раз уж ты сказала... я и это забыла взять."
