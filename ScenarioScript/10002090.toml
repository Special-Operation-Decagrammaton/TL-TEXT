10002090-25 = "А-арбуз!"
10002090-26 = "Почему ты удивлена? Нужно было разбить арбуз. Я его разбила."
10002090-27 = "Нет, Азуса! Если просто выстрелить в него, весь смысл теряется!"
10002090-28 = "К тому же это нужно делать с завязанными глазами!"
10002090-29 = "То есть играем по местным правилам? Как хочешь."
10002090-30 = ""
10002090-32 = ""
10002090-39 = "А-а-а! Только не снова!"
10002090-40 = ""
10002090-42 = ""
10002090-44 = ""
10002090-45 = "Ты очень метко стреляешь, Азуса..."
10002090-46 = "...но не ты одна здесь снайпер."
10002090-47 = ""
10002090-49 = ""
10002090-51 = "*бах*"
10002090-52 = "Выходит, не одна."
10002090-53 = "Впечатляет, насколько точно ты стреляешь из винтовки такого калибра."
10002090-54 = "В чём испытаем себя дальше?"
10002090-55 = "Всё ещё не уверена, что я лучший стрелок? Хорошо. Я принимаю вызов, Азуса."
10002090-56 = ""
10002090-59 = ""
10002090-61 = ""
10002090-62 = "Только не говорите, что они собираются сделать то, о чём я думаю."
10002090-63 = "Мы же не можем просто позволить им делать что угодно, правда, Сенсей?"
10002090-64 = "[s] «Небольшое соревнование никому ещё не вредило.»"
10002090-65 = "Н-Ну..."
10002090-68 = ""
10002090-69 = "Я вернулась. Поставила арбуз туда, куда вы просили."
10002090-70 = "Ты правда попадёшь? До него больше 500 метров. Отсюда он едва виден как точка."
10002090-71 = "Вообще-то я поражала бесчисленное количество целей с такой дистанции."
10002090-72 = "Ч-что? Но у тебя же ещё будут завязаны глаза."
10002090-73 = "Что я за снайпер, если не могу справиться с таким простым ограничением?"
10002090-74 = "Я бы сказала, что полностью завязанные глаза — довольно серьёзное ограничение для снайпера!"
10002090-75 = "Глупости. Стремиться к новым вершинам — естественно."
10002090-76 = "Как иначе я могла бы называть себя снайпером справедливости?"
10002090-77 = "Это начинает выходить из-под контроля."
10002090-78 = "Не думаю, что их уже получится отговорить."
10002090-79 = "Тогда начнём, Сенсей?"
10002090-80 = "А?"
10002090-81 = "[s] «Что случилось?»"
10002090-82 = "Если глаза меня не обманывают..."
10002090-83 = "...арбуз, который я поставила там, исчез!"
10002090-84 = "Неужели кто-то уже выстрелил? Нет, не сходится. Мы бы услышали."
10002090-85 = "Что происходит?"
10002090-86 = "А?"
