[translation]
10047020-1 = "Эпизод 2;Страна чудес надежд и мечтаний"
10047020-2 = "Я направлялся в Академию искусств Вайлдхант вместе с Цумуги."
10047020-5 = "Какой длинный подземный тоннель... прямо как кроличья нора."
10047020-6 = "Может, всё-таки стоило надеть костюм девушки-кролика."
10047020-7 = "Ха... Шучу. Я понимаю, что всему своё время и место."
10047020-8 = "[s] «Т-То есть если обстоятельства идеально совпадут, ты всё-таки наденешь?»"
10047020-9 = "Всё может сложиться как угодно. Кто знает?"
10047020-10 = "Продолжим. Я едва могу дождаться, когда вы со всеми познакомитесь."
10047020-14 = ""
10047020-15 = "Следуйте за мной. Осталось совсем немного."
10047020-16 = ""
10047020-18 = ""
10047020-20 = "[ns] «А? Это...?»"
10047020-21 = "Вам необходимо пройти краткий досмотр. Просим спокойно сотрудничать."
10047020-22 = "[s] «Д-Досмотр?»"
10047020-23 = "Наша академия довольно строго относится к посторонней контрабанде."
10047020-24 = "Не волнуйтесь. Уверена, у вас всё будет в порядке."
10047020-28 = ""
10047020-29 = "Да, всё чисто. Можете проходить."
10047020-30 = ""
10047020-32 = ""
10047020-33 = "Хи-хи, тогда идём?"
10047020-34 = "[s] «В Вайлдханте всегда так строго?»"
10047020-35 = "Есть такая поговорка: «искусство — это взрыв»."
10047020-36 = "У нас был... случай, когда один студент воплотил это буквально."
10047020-37 = "А другая однажды решила проверить пределы экспериментального громкоговорителя..."
10047020-38 = "...он разбил несколько окон."
10047020-39 = "[s1] «Теперь я понимаю, зачем нужен досмотр...»\n[s2] «Похоже, они очень увлечённые...»"
10047020-42 = "Хех, в конце концов, искусство И ЕСТЬ взрыв."
10047020-43 = "Ну что, продолжим?"
10047020-44 = ""
10047020-46 = ""
10047020-48 = "Вскоре после этого..."
10047020-49 = ""
10047020-53 = "Мы пришли."
10047020-54 = "А теперь настоящее представление. Добро пожаловать в обитель художественных начинаний..."
10047020-59 = "...Академию искусств Вайлдхант."
10047020-60 = "[ns] «Ух ты...! Дух захватывает!»"
10047020-61 = ""
10047020-62 = "Это академия художников, построенная художниками ради развития художников."
10047020-63 = "Она не так велика, как главная тройка, но наша история не уступает Тринити или Геенне."
10047020-64 = "Студенты живут в строго управляемых общежитиях, где день и ночь оттачивают свои навыки."
10047020-65 = ""
10047020-68 = ""
10047020-69 = "Похоже, неподалёку кто-то дерётся..."
10047020-71 = "Что? «Идти в ногу со временем»? Ты хочешь сказать, что мои взгляды на искусство устарели?"
10047020-72 = "Я такого не говорила! Может, запишешься на чистку ушей и потом вернёшься ко мне!"
10047020-73 = ""
10047020-75 = ""
10047020-76 = "Цк... В таком случае..."
10047020-77 = "Иди сюда, невежда!"
10047020-78 = ""
10047020-84 = "...Иногда у нас проходят интеллектуальные дебаты о теории искусства."
10047020-85 = "[s] «Они буквально стреляют друг в друга?!»"
10047020-86 = "В конце концов, искусство — это борьба и завоевание."
10047020-87 = "Ну что, продолжим? Моё общежитие прямо впереди."
10047020-88 = ""
10047020-90 = ""
10047020-98 = "[ns] «ВОТ ТАК выглядит повседневная жизнь художника...?»"
10047020-100 = "Коридор общежития Вайлдханта"
10047020-102 = "Наша комната в конце этого коридора."
10047020-103 = "[s] «Комната Цумуги...»"
10047020-104 = ""
10047020-107 = "[ns3] «Она будет похожа на уютную сказку?»\n[ns4] «Или будет такой же мощной, как дэт-метал?»"
10047020-110 = "Хи-хи... Полагаю, вам придётся увидеть самим."
10047020-111 = "Наша комната — общежитие 4, блок 404..."
10047020-112 = "Некоторые считают это дурным знаком, потому что в других языках цифра 4 звучит похоже на слово «смерть»."
10047020-113 = "Лично мне эта симметрия очень нравится."
10047020-114 = "[s] «М-Мы все должны умереть...!»"
10047020-115 = "О, вас вдохновили мои тексты?"
10047020-116 = "Я бы не воспринимала номер буквально. Я почти уверена, что мы все живы. Считайте это... подрывным социальным комментарием."
10047020-117 = "В любом случае, поскольку номер заставляет людей нервничать, мы с соседками дали ему прозвище."
10047020-118 = ""
10047020-120 = ""
10047020-121 = "А, вот мы и пришли. Заходим."
10047020-125 = "Вот. Добро пожаловать в наше скромное общежитие. Здесь... уютно, правда?"
10047020-126 = "[ns] «...О. Здесь чувствуется что-то... мистическое.»"
10047020-127 = ""
10047020-131 = ""
10047020-132 = "Хи-хи... Э-хе-хе..."
10047020-133 = "Наконец-то вы здесь. Тот, кого притянула магия Арканы."
10047020-134 = ""
10047020-136 = ""
10047020-138 = "Я... тоже чувствую зов судьбы."
10047020-139 = "Ой, да ладно! Мы впервые встречаемся! Можете хоть раз вести себя нормально?!"
10047020-140 = "Но карты сказали, что «величественное приветствие» будет идеальным!"
10047020-141 = "Предсказания Эри... очень точны."
10047020-142 = "*вздох* Простите. Позвольте мне извиниться за них. Они просто не могут не быть чудиками..."
10047020-143 = ""
10047020-145 = ""
10047020-147 = "Я познакомлю вас со своими соседками."
10047020-148 = "Это самая старшая — Каноэ."
10047020-149 = ""
10047020-151 = ""
10047020-152 = ""
10047020-153 = "Я многое слышала от Муги... Приятно познакомиться..."
10047020-154 = "Мяу! Мя-я-у!"
10047020-155 = "Кар! Ка-а-р!"
10047020-156 = ""
10047020-157 = "[ns] «У-У тебя интересные питомцы...»"
10047020-158 = "Когда они успели здесь появиться...?"
10047020-159 = "Они не мои... Обычно сами уходят, поэтому я стараюсь им не мешать."
10047020-160 = "[ns] «П-Понятно...»"
10047020-161 = ""
10047020-163 = ""
10047020-164 = ""
10047020-165 = "Следующая — Эри, она с моего курса."
10047020-166 = ""
10047020-168 = ""
10047020-169 = ""
10047020-170 = "Сенсей... Вы верите в МАГИЮ?"
10047020-171 = "[s] «Если считать магией несколько ошеломительных сюрпризов... Тогда да.»"
10047020-172 = "Как я и думала! Я знала, что вы один из нас, Сенсей!"
10047020-173 = "Нет, больше чем учитель. Вы — мастер!"
10047020-174 = "Я чувствую в комнате неописуемое магическое притяжение, Мастер!"
10047020-175 = "[ns] «Я мастер...?»"
10047020-176 = ""
10047020-178 = ""
10047020-179 = ""
10047020-180 = "А это самая младшая — Рэна."
10047020-181 = ""
10047020-183 = ""
10047020-184 = ""
10047020-185 = "Сенсей, ещё не поздно! Бегите, спасайте свою жизнь!"
10047020-186 = "Они держат меня здесь, но у вас ещё есть шанс...!"
10047020-187 = "[s] «Тебя... держат силой?»"
10047020-189 = "Хех, она шутит. Как видите, она совершенно свободна и... весьма бойкая."
10047020-190 = "И наконец, я — Шиина Цумуги. Я Белоснежка этого домика, живущая среди таких... очаровательных людей."
10047020-191 = "[s5] «...Я думал, ты Спящая красавица?»\n[s6] «...Я думал, ты кролик?»"
10047020-194 = "Я могу быть кем захочу. В искусстве ведь так же — твой..."
10047020-195 = ""
10047020-197 = ""
10047020-198 = ""
10047020-199 = "...образ..."
10047020-200 = "...это единственное, что важно!"
10047020-201 = ""
10047020-202 = "[ns] «А...»"
10047020-203 = "Видите? Они все странные! Ни секунды не могут вести себя нормально!"
10047020-204 = "Хи-хи... А что вообще значит «нормально» в Вайлдханте?"
10047020-205 = "Ага, признайся! Тебе нравится проводить с нами время!"
10047020-206 = "К-Кому такое может нравиться?"
10047020-207 = ""
10047020-209 = ""
10047020-210 = "Вы ещё пожалеете! Однажды я докажу всему миру, что вы все сектантки!"
10047020-211 = "[s] «Сектантки? О чём она говорит?»"
10047020-212 = "Как я уже говорила, Вайлдхант не поддерживает официальные кружки."
10047020-213 = "Но каждому нужны увлечения помимо своей специальности."
10047020-214 = "Желание творить... бесконечно..."
10047020-215 = ""
10047020-217 = ""
10047020-218 = "Да! Поэтому я вместе с соседками создала неофициальный кружок!"
10047020-219 = "Мы — общество талантливых девушек, исследующих философские и эстетические способы, которыми оккультизм влиял на историю искусства!"
10047020-220 = ""
10047020-223 = "Мы — Общество исследования оккультизма! Или коротко «Оккультное общество»! Всё очень интеллектуально."
10047020-224 = ""
10047020-226 = ""
10047020-227 = "[ns7] «Оккультное... общество?»\n[ns8] «Так вот почему комната выглядит именно так.»"
10047020-230 = "Раз уж так, давайте представимся ещё раз. Ну же, девочки!"
10047020-231 = "Меня зовут Ширао Эри. Моя специальность — живопись!"
10047020-232 = "Я основательница и президент Оккультного общества, а ещё последний маг этой эпохи, исследующий существование магии!"
10047020-233 = "Шиина Цумуги, как вы уже знаете. Я учусь на прикладной музыке и являюсь вице-президентом Общества."
10047020-234 = "Я вступила, потому что... хочу узнать, можно ли призвать демона силой дэт-метала."
10047020-235 = "Можете звать меня... Итагаки Каноэ. Моя специальность — секрет."
10047020-236 = "Если чего-то не знаете, можете спросить меня, потому что я знаю всё..."
10047020-238 = "...ЧТО БЫ это ни было. Э-хе-хе..."
10047020-239 = "Мяу! Мя-я-у!"
10047020-240 = "Кар! Ка-а-р!"
10047020-241 = ""
10047020-243 = ""
10047020-244 = "Видите? Теперь понимаете, о чём я? Бегите от этих чудачек, пока ещё можете."
10047020-245 = "А маленькую, которая притворяется «нормальной», зовут Кинуи Рэна."
10047020-246 = "Несмотря на необычный эстетический вкус, её специальность — дизайн одежды."
10047020-247 = "Это ТЫ необычная, раз носишь аксессуары с глазными яблоками!"
10047020-248 = "*вздох* Верить в оккультизм. Какая глупость."
10047020-249 = "Но оккультное существует! Столько доказательств... и очевидцев!"
10047020-250 = "Например, огромное чудовище в форме Пероро, появившееся в море возле D.U..."
10047020-251 = "Танцующие куклы... в заброшенном парке развлечений... Хи-хи."
10047020-252 = "Неопознанные монстры, которых вытаскивают из подозрительных книг?"
10047020-253 = "[s] «К-Кажется, это немного не по теме...»"
10047020-254 = ""
10047020-256 = ""
10047020-258 = "[ns] «В любом случае, похоже, вам здесь очень весело...»"
10047020-259 = "Не только нам. Вся академия весёлая, Мастер!"
10047020-260 = "Вообще-то, может, вместе устроим экскурсию?"
10047020-261 = ""
10047020-263 = ""
10047020-264 = "Давайте прямо сейчас отправимся наружу и проведём небольшое оккультное расследование!"
10047020-265 = ""
10047020-267 = ""
10047020-268 = ""
10047020-269 = "[ns] «Конечно. Веди!»"
10047020-270 = ""
10047020-271 = ""
10047020-272 = "*вздох* Ой, ладно. Некоторым людям уже ничем не помочь."
10047020-273 = "Тогда решено!"
10047020-274 = "Да. Все вместе, идём."
10047020-275 = "Погодите! А какой вообще план?"
10047020-276 = "Разумеется, ещё до прибытия Мастера план уже был вплетён в нити судьбы."
10047020-277 = "Первое место — одно из моих любимых."
10047020-278 = "Хи-хи, и одно из моих тоже."
10047020-279 = "Только не говори... Нет! Только не туда?!"
10047020-280 = "Хи-хи... Да."
10047020-281 = "...Пожалуйста! Умоляю! Не устраивайте неприятностей."
10047020-283 = "Так началась экскурсия по Вайлдханту."
