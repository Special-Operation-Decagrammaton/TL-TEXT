[translation]
2005703-1 = "Первый шаг вперёд"
2005703-2 = "...Давайте ещё раз повторим план."
2005703-3 = "Сначала мы с Сенсеем наденем миниатюрные рации C&C, прежде чем я войду в класс."
2005703-4 = "Цель — подойти к одноклассницам... иначе, чем обычно."
2005703-5 = "Для этого я буду поддерживать непринуждённый разговор по сценарию, который мы репетировали всю ночь."
2005703-6 = "Вы будете слушать и давать советы в реальном времени по мере развития ситуации."
2005703-7 = "Операция «Аватар»: стать дружелюбнее!"
2005703-8 = ""
2005703-10 = ""
2005703-11 = "..."
2005703-12 = "Вы... правда думаете, что это сработает?"
2005703-13 = "[s1] «Рискуя повториться...»\n[s2] «Раз уж мы зашли так далеко, остаётся только продолжать.»"
2005703-16 = "Конечно. Я верю вам, Сенсей."
2005703-17 = ""
2005703-19 = ""
2005703-21 = "Если честно, мне хотелось попросить её НЕ верить в меня настолько сильно."
2005703-22 = "Нет более заминированного поля боя, чем разговор со старшеклассницами!"
2005703-23 = ""
2005703-32 = ""
2005703-33 = ""
2005703-36 = ""
2005703-37 = "О, это госпожа Аканэ."
2005703-38 = "З-Здравствуйте... госпожа Аканэ."
2005703-39 = ""
2005703-41 = ""
2005703-43 = ""
2005703-44 = ""
2005703-45 = "Приветствую, одноклассницы! Что за напряжённая атмосфера? Давайте говорить как старые добрые друзья!"
2005703-47 = "...?!"
2005703-48 = "Что...?!"
2005703-50 = "(...Вы точно уверены, что это правильный способ, Сенсей...?)"
2005703-51 = "[s] «Даже если нет, мы должны верить в выбранный путь!»"
2005703-52 = "(...Поняла.)"
2005703-55 = "П-Привет, госпожа Аканэ...? Вы сегодня в хорошем настроении..."
2005703-56 = "Я-я, кажется, никогда не видела вас без очков."
2005703-58 = "Я решила полностью сменить образ, поэтому надела линзы!"
2005703-59 = "И вы всё зовёте меня «госпожой...!» Знаете, это может очень ранить мои чувства! Эхе-хе!"
2005703-60 = ""
2005703-63 = ""
2005703-64 = "О, теперь понятно! Вы пробовали образец из Клуба образа жизни и здоровья?"
2005703-65 = "Слышала, они разрабатывают новое гормональное средство, которое улучшает характер студентов и активирует обмен веществ..."
2005703-66 = "Забыла, как называется... но вроде оно должно делать людей бодрее и здоровее."
2005703-67 = "...Если так описывать, они не особо отличаются от Клуба псевдонауки..."
2005703-68 = "Технически это другое. Продукты Клуба образа жизни и здоровья, похоже, реально меняют людей..."
2005703-69 = "С определённой точки зрения это разве не НАМНОГО хуже?"
2005703-70 = ""
2005703-72 = ""
2005703-74 = "(Наш сценарий...)"
2005703-75 = "(Прошу прощения. Несмотря на всю подготовку, социальная часть всё ещё вызывает у меня сильный дискомфорт.)"
2005703-76 = "[s] «(Нет... Почти уверен, что это моя вина.)»"
2005703-77 = "(Но... что делать теперь...?)"
2005703-78 = "[s] «(Пока давай выберем вот это...!)»"
2005703-79 = ""
2005703-82 = ""
2005703-83 = "К-Кхм! Вы обе... хотите после уроков сходить со мной в Харухабару?"
2005703-84 = "Я слышала, там проходит специальное коллаборационное мероприятие."
2005703-86 = "Харухабара...?"
2005703-87 = "А...?"
2005703-89 = "(...)"
2005703-90 = "(Может... это был не лучший вариант, Сенсей...)"
2005703-91 = ""
2005703-94 = ""
2005703-95 = ""
2005703-96 = "БОЖЕ! Я не знала, что вы тоже любите ходить в Харухабару, госпожа Аканэ!"
2005703-97 = "Я пойду!"
2005703-99 = "..."
2005703-100 = "Ага!"
2005703-101 = ""
2005703-105 = ""
2005703-106 = "О, блин... Урок начинается."
2005703-107 = "Я так давно не была в Харухабаре! Пойдём сразу после занятий?"
2005703-108 = "Мы буквально были там две недели назад."
2005703-109 = "Это давно!"
2005703-111 = "Мы с Аканэ одновременно облегчённо вздохнули."
2005703-112 = "И тогда я понял, что пытаться предсказать ход разговора старшеклассниц было с моей стороны по-настоящему глупой затеей."
2005703-115 = ""
2005703-121 = ""
2005703-122 = "Вот и мы, Харухабара!"
2005703-123 = "Куда сначала?"
2005703-124 = "Очевидно в аркаду! На этот раз я всерьёз побью рекорды!"
2005703-125 = "Туда можно сходить когда угодно... А вы как думаете... госпожа Аканэ?"
2005703-126 = ""
2005703-129 = ""
2005703-130 = "(...Что мне здесь делать, Сенсей...?)"
2005703-131 = "[s] «(Э-Эм... Если сомневаешься, всегда выбирай...)»"
2005703-132 = ""
2005703-134 = ""
2005703-135 = "Может, сначала что-нибудь поедим?"
2005703-137 = "Начать с еды — никогда не плохая идея! Еда — топливо!"
2005703-138 = "Я уже немного перекусила вместо обеда, но... неважно! Ещё влезет."
2005703-141 = ""
2005703-143 = ""
2005703-147 = "Теперь в аркаду!"
2005703-148 = "Ты неизменно последовательна!"
2005703-149 = "Не знаю, кто такая эта «UZQueen», но она на первом месте ВО ВСЁМ. Я обязана её обойти!"
2005703-150 = "Ах."
2005703-151 = "Ах."
2005703-152 = ""
2005703-154 = ""
2005703-155 = ""
2005703-156 = ""
2005703-157 = "Вы тоже знаете UZQueen... госпожа Аканэ?"
2005703-158 = ""
2005703-160 = ""
2005703-161 = "Н-Наверное? Немного по слухам...?"
2005703-162 = "Ну... Нет ничего плохого в том, чтобы бросить себе вызов."
2005703-163 = "*вздох* Хотя, может, стоит сейчас же остановить её от пустой траты времени."
2005703-164 = "А-ха-ха-ха..."
2005703-173 = ""
2005703-176 = ""
2005703-179 = "Мне нужна вторая порция энергии... Вот это! Говорят, этот пудинг новый!"
2005703-180 = "Карамель и листья периллы...? Вы уверены, что это удачная комбинация? Похоже на одноразовый рекламный трюк."
2005703-182 = "(Постой, этот продукт напоминает мне случай, когда нас вызвали на уборку по делу «Подозрение на террор подозрительными вкусами»...)"
2005703-183 = "(Тогда решили, что создатель не имел злого умысла, а просто настолько любил листья периллы, что готов был поставить на них жизнь.)"
2005703-184 = "(Не верится, что один из его продуктов всё ещё продаётся...)"
2005703-187 = ""
2005703-188 = ""
2005703-190 = "..."
2005703-191 = "..."
2005703-192 = ""
2005703-195 = ""
2005703-196 = "Ч-Что такое...?"
2005703-198 = "Ты хорошо поёшь, Аканэ!"
2005703-199 = "Без шуток... Казалось, мои уши благословили..."
2005703-201 = "О-Ой, ну что вы. Вы слишком добры..."
2005703-205 = "Думаю, с твоим оттенком кожи подойдёт вот это... Как тебе?"
2005703-206 = "Ты права... Подтон идеальный!"
2005703-207 = "Ты ещё и в макияже хороша, Аканэ!"
2005703-208 = "(На заданиях мне довольно часто приходится маскироваться...)"
2005703-214 = ""
2005703-215 = "Да уж. Я смертельно устала. В любом случае..."
2005703-216 = "Да уж. Я смертельно устала. В любом случае..."
2005703-217 = "..."
2005703-219 = "...?"
2005703-221 = "Аканэ! Теперь можешь расслабиться!"
2005703-222 = "Согласна. Мы правда ценим все усилия, которые ты сегодня приложила."
2005703-223 = ""
2005703-226 = ""
2005703-227 = "Ах..."
2005703-228 = "...Это... было настолько очевидно?"
2005703-230 = "Ну да. Ты вела себя на сто восемьдесят градусов иначе, чем обычно."
2005703-231 = "Но я просто решила, что у тебя есть причины, и подыграла."
2005703-233 = "..."
2005703-234 = "Секунду. Я давно не носила линзы, и они немного мешают."
2005703-237 = ""
2005703-239 = "Вот Аканэ, которую мы знаем! Хотя без очков тоже было приятно увидеть."
2005703-240 = "Вот к такой мы привыкли!"
2005703-241 = "Так... Можно спросить, что произошло?"
2005703-243 = "...?!"
2005703-244 = "Только если сама хочешь рассказать! И ничего плохого не случилось, нам было очень весело!"
2005703-245 = "Это..."
2005703-246 = "..."
2005703-247 = "Я решила последовать совету Сенсея..."
2005703-248 = "...и попробовать самой проявить инициативу в общении."
2005703-250 = "А-а-а... Теперь понятно."
2005703-255 = "Поскольку Аканэ, похоже, уже с удовольствием разговаривала, я тихо выключил рацию."
2005703-256 = "И ещё..."
2005703-257 = ""
2005703-260 = "Я твёрдо решил больше никогда не отправляться в приключения, напоминающие «Симулятор повседневных разговоров старшеклассниц»."
