[translation]
84303301000-5 = "Спасибо... Мы чуть не потеряли всю игру, над которой так долго работали..."
84303301000-6 = "КАК это вообще случилось...? Ещё вчера все были в восторге...!"
84303301000-7 = "Игра не изменилась... Юзу проверила код и ничего нового не увидела..."
84303301000-9 = "Наверное, на игру наложили развращающее проклятие. Хорошо, что этот новый вор помог спасти положение!"
84303301000-10 = "К тому же Сэя оказалась невосприимчива к проклятию ярости! Возможно, у неё есть ответ!"
84303301000-11 = ""
84303301000-14 = ""
84303301000-15 = "...!! Правда?"
84303301000-16 = "На вас это не подействовало?"
84303301000-17 = "Но погодите... Алиса, кто это?!"
84303301000-19 = "А, простите. Я не представилась."
84303301000-20 = "Я Юризоно Сэя из Чаепития Тринити General School. Я отвечаю за прибывших студентов."
84303301000-21 = "Так что это моя ответственность не меньше, чем ваша."
84303301000-22 = "Простите, что мои студенты чуть не уничтожили вашу драгоценную работу."
84303301000-23 = ""
84303301000-26 = ""
84303301000-27 = "Отвечаете...? Почему вы...? Что такое Чаепитие?"
84303301000-28 = "Хм..."
84303301000-30 = "Это что-то вроде студенческого совета. Полагаю, ваш аналог здесь — Семинар."
84303301000-31 = ""
84303301000-34 = ""
84303301000-35 = "Ага! Вы как Юука! Теперь понятно!"
84303301000-36 = "Погоди, но она ощущается как кто-то повыше..."
84303301000-38 = "(На меня это не подействовало только потому, что после предупреждения Рио я была настороже.)"
84303301000-39 = "(Если бы я подошла, ничего не зная... вероятно, сорвалась бы так же, как остальные.)"
84303301000-40 = ""
84303301000-42 = ""
84303301000-44 = ""
84303301000-45 = ""
84303301000-46 = "...! О, прошу прощения. Вы ведь не обычный вор, да? Вы Король воров!"
84303301000-48 = ""
84303301000-50 = ""
84303301000-51 = "Алиса...?!"
84303301000-52 = "Это куда более громкий титул, чем я заслуживаю."
84303301000-53 = "Я всего лишь помогаю человеку, который пытается не допустить подобных происшествий. ...А кроме этого я не настолько выдающийся человек."
84303301000-54 = "*ворчит*"
84303301000-55 = "Понятно. Значит, вора отправил мудрец!"
84303301000-56 = "Тогда мудрец предсказал проклятие?"
84303301000-58 = "*ворчит*"
84303301000-59 = "Э-Это..."
84303301000-61 = "...Это не совсем неправда."
84303301000-62 = "И пока я не могу рассказать подробности... но мы уже работаем над тем, чтобы доказать вашу невиновность."
84303301000-63 = "Сначала нам нужно продолжить расследование. Так что, если вы не против... можно мне копию этой игры?"
84303301000-64 = ""
84303301000-67 = ""
84303301000-68 = "А? Н-Нашей игры? Вы уверены?"
84303301000-69 = "Мы не против... На самом деле мы даже благодарны... но вы умеете читать код?"
84303301000-71 = "Я — нет, но есть человек, которому я доверяю и который умеет."
84303301000-72 = ""
84303301000-74 = ""
84303301000-75 = "...Тот самый мудрец."
84303301000-76 = ""
84303301000-78 = ""
84303301000-80 = ""
