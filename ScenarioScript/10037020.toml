[translation]
10037020-1 = "Эпизод 2;Разделённые воды сходятся"
10037020-3 = "Ого... Так вот он какой...!"
10037020-5 = "Это Шаньхайцзин!"
10037020-6 = "Всё точно как в моих исследованиях!"
10037020-7 = "Томоэ, Томоэ! Посмотри туда! На крышу! Какая интересная!"
10037020-8 = ""
10037020-10 = ""
10037020-12 = ""
10037020-13 = "(Должно быть, это те самые студенты из слухов!)"
10037020-14 = "(Я столько о них слышала, но никогда не думала, что увижу их лично...!)"
10037020-15 = ""
10037020-17 = ""
10037020-18 = "Хм? Такое чувство, будто на нас все смотрят?"
10037020-19 = "Уверена, они просто не могут отвести глаз от вашей ауры, Великий Вождь! Так и должно быть!"
10037020-20 = "Т-Ты думаешь? Хи-хи. Хи-хи-хи."
10037020-22 = "Хм? Я чувствую, что где-то произошла перемена... Понятно."
10037020-23 = "(Возможно, нам стоит подготовиться немного иначе.)"
10037020-30 = ""
10037020-31 = "Доклад, госпожа."
10037020-32 = ""
10037020-35 = ""
10037020-36 = "Мы получили сообщение, что наши гости из Федеральной Академии Красной Зимы только что прибыли к главным воротам."
10037020-37 = "...Понятно."
10037020-38 = ""
10037020-40 = ""
10037020-41 = "Я уже много раз это говорила, но повторю ещё раз."
10037020-42 = "Эта встреча по обмену станет значимым событием и для Шаньхайцзина, и для Красной Зимы."
10037020-43 = "Я ожидаю, что вы встретите их и будете обращаться с ними с подобающим уважением."
10037020-45 = "Как скажете, госпожа!"
10037020-46 = "Мы навсегда запечатлеем в сердцах всю важность этого события!"
10037020-48 = "...Хорошо."
10037020-49 = "Тогда я отдам свой первый приказ касательно этой встречи по обмену между Шаньхайцзином и Красной Зимой."
10037020-50 = ""
10037020-52 = ""
10037020-53 = ""
10037020-54 = "Обязательно поприветствуйте наших гостей как подобает Генрюмону."
10037020-55 = ""
10037020-58 = ""
10037020-59 = "Как прикажете, госпожа!"
10037020-60 = "Клянёмся, что не посрамим ни ваше имя, ни вашу репутацию!"
10037020-61 = "[s] «(Все выглядят немного слишком напряжёнными...)»"
10037020-62 = ""
10037020-65 = ""
10037020-67 = "Вот всё и начинается, госпожа Президент."
10037020-68 = "Да."
10037020-69 = "..."
10037020-70 = ""
10037020-72 = ""
10037020-73 = "Сенсей, подойдите сюда, пожалуйста."
10037020-74 = ""
10037020-76 = ""
10037020-78 = ""
10037020-79 = "Я подошёл к Кисаки, как она и просила."
10037020-80 = "У меня к вам просьба."
10037020-81 = "Девушки, которые только что ушли... Не могли бы вы за ними присмотреть?"
10037020-82 = "Не то чтобы я им не доверяла, просто..."
10037020-83 = "Считайте это моим излишним беспокойством."
10037020-84 = "[s] Молча кивнуть."
10037020-85 = ""
10037020-87 = ""
10037020-89 = "Эм, госпожа Президент? Если вам нужна помощь, возможно, вместо Сенсея могла бы помочь я...?"
10037020-90 = "(...Если я доверю это Мине, есть небольшой шанс, что она лишь всё усугубит...)"
10037020-91 = "У тебя ведь есть более важная обязанность, не так ли?"
10037020-92 = "Что? Более важная обязанность...?"
10037020-93 = "Я говорю о твоём долге защищать президента Генрюмона."
10037020-94 = ""
10037020-96 = ""
10037020-97 = "...! К-Конечно! Можете на меня рассчитывать, госпожа Президент! Пока я дышу, никто не посмеет к вам прикоснуться!"
10037020-98 = "Не сомневаюсь. Я знаю, что могу на тебя положиться."
10037020-99 = "Госпожа...!"
10037020-100 = "(...Надеюсь, ничего плохого не случится...)"
10037020-109 = "Госпожа ясно приказала встретить их как подобает Генрюмону."
10037020-110 = "Она ведь именно это имела в виду, да?"
10037020-111 = "Очевидно! А что ещё это могло значить?"
10037020-112 = "Хи-хи-хи... Надеюсь, они готовы. Мы покажем им, как всё делается в Шаньхайцзине...!"
10037020-113 = "Мы должны исполнить первый приказ госпожи касательно встречи по обмену!"
10037020-114 = "Нельзя её разочаровать! Вперёд!"
10037020-115 = ""
10037020-117 = ""
10037020-120 = "Протокол допроса: 092-H-8"
10037020-122 = "Следователь: анонимный член Генрюмона"
10037020-124 = "Подозреваемая: Рэнкава Черино, Академия Красной Зимы, 3-й курс"
10037020-128 = ""
10037020-129 = "Имя?"
10037020-130 = "Нет-нет-нет, стойте! Где Марина? Томоэ? Куда все делись?"
10037020-131 = "Мне сказали, что это поездка, то есть встреча по обмену! Тогда почему...? О-О, понятно! Это государственный переворот, да? Ловушка?!"
10037020-133 = "Хватит! Я спросила твоё имя!"
10037020-134 = "С-Сама хватит! Я президент студенческого совета Красной Зимы, Главный инспектор по благоустройству, Главный секретарь, Начальник санитарной службы, Капитан спортивного клуба, Глава всех старост, Начальник санитарной службы и Знаток столового питания."
10037020-135 = "А совсем недавно меня ещё и выбрали лучшим пудинговым гурманом месяца и даже директором производства кастеллы!"
10037020-136 = "...Ну и... длинно. Но, кажется, где-то там всё же прозвучало твоё имя — вместе со всеми должностями."
10037020-137 = "Почему у тебя вообще столько должностей...?"
10037020-138 = "Хотя нет. Неважно. Идём дальше... Есть хобби?"
10037020-139 = "Как грубо! Насколько я помню, именно Шаньхайцзин пригласил нас на эту встречу по обмену...!"
10037020-140 = "Красная Зима этого не забудет! Зачем вы вообще притащили меня сюда?!"
10037020-142 = "Мы сопроводили тебя сюда, потому что сама президент приказала."
10037020-143 = ""
10037020-145 = ""
10037020-146 = "Она сказала поприветствовать наших гостей как подобает Генрюмону!"
10037020-147 = "Да что это вообще значит?!"
10037020-148 = ""
10037020-151 = "[ns] «(...Ох-ох.)»"
10037020-153 = "[ns] «(Всё выглядит очень плохо, да...?)»"
10037020-156 = "[ns] «*тяжело дышит* Простите! Кисаки? У нас проблема!»"
10037020-157 = "Что такое, Сенсей? Постойте... По вашему выражению лица и тону я вижу, что что-то не так."
10037020-158 = "...Расскажите, что происходит."
10037020-161 = "Я рассказал Кисаки о том, что увидел в подземной комнате допросов."
10037020-164 = ""
10037020-165 = "*вздыхает*"
10037020-166 = "Понятно. Спасибо, Сенсей. Сейчас важнее всего прояснить недоразумение с этим, мягко говоря, невежливым приёмом..."
10037020-167 = "Я отправлю кого-нибудь... Хотя нет, лучше передам указания лично."
10037020-168 = "Я хотела, чтобы наших посетителей встретили как «почётных гостей», а не как преступников."
10037020-169 = ""
10037020-171 = ""
10037020-172 = "..."
10037020-173 = "(Э-Это было близко. Я бы сделала то же самое и сразу потащила их на допрос!)"
10037020-175 = "Сенсей, подойдите сюда, пожалуйста."
10037020-176 = ""
10037020-178 = ""
10037020-179 = ""
10037020-180 = "Я подошёл к Кисаки, как она и просила."
10037020-181 = "У меня к вам ещё одна просьба."
10037020-182 = "[s] Понимающе кивнуть, чтобы её успокоить."
10037020-183 = "Да... Конечно. Спасибо."
10037020-184 = "Иметь друга, который так быстро тебя понимает, — удивительная вещь..."
10037020-185 = ""
10037020-187 = ""
10037020-188 = "Мина."
10037020-189 = ""
10037020-192 = ""
10037020-193 = "Д-Д-Д-Да, госпожа Президент!"
10037020-194 = "Я полагаю, ты... поступила бы иначе?"
10037020-195 = "К-К-К-Конечно, госпожа! Я-Я-Я-Я никогда бы не допустила таких нелепых ошибок...!"
10037020-196 = "...Разумеется. Конечно, не допустила бы."
10037020-201 = "Угх... Президент была такой спокойной, но ощущение, будто меня только что отчитали..."
10037020-202 = "Наверное, она сейчас в ярости... О нет..."
10037020-203 = "Н-Но всё же! Она сказала, что проявит милость, если я как следует исправлю эту проблему!"
10037020-204 = "Да! Сейчас не время мешкать!"
10037020-205 = "Обращаться с ними как с почётными гостями... Это уже легко понять!"
10037020-206 = "Нельзя снова её подвести! Вперёд!"
10037020-207 = ""
10037020-209 = ""
10037020-215 = ""
10037020-216 = "Из комнаты допросов — прямо в тюрьму?!"
10037020-217 = ""
10037020-219 = ""
10037020-221 = "К-Кхм... Вид подобных мест мне не совсем непривычен, но..."
10037020-222 = "...Интересно, что вообще происходит. Приглашение на встречу по обмену было лишь предлогом, чтобы заманить нас в ловушку?"
10037020-223 = "Может, это заговор Тёмного Монарха Шаньхайцзина...?"
10037020-225 = "Молчать! Лучше признайтесь, с какими подозрительными целями вы явились в Шаньхайцзин!"
10037020-226 = "Иначе...!"
10037020-227 = ""
10037020-231 = ""
10037020-232 = "*ахает* Это что?!"
10037020-233 = "Ч-Что вы увидели, председатель Марина?"
10037020-235 = "Даже гости из Красной Зимы должны знать, что это за животное!"
10037020-236 = "Смотрите. Настоящая панда Шаньхайцзина!"
10037020-237 = "Расскажите, что вы замышляли..."
10037020-238 = "Иначе мы отберём у этой очаровательной маленькой панды бамбук!"
10037020-239 = ""
10037020-242 = ""
10037020-243 = "В-Вы злодеи! Эта панда вам ничего не сделала! Отпустите её!"
10037020-244 = "Мучить панду — такого милого маленького медвежонка...! Что вы за чудовища?!"
10037020-246 = "Хотите это остановить — просто признайтесь! Хе-хе-хе... Посмотрите, как она радуется бамбуку. Одно лёгкое движение моей руки, и...!"
10037020-247 = ""
10037020-251 = "Кью-у-у?!"
10037020-252 = "Нееет!"
10037020-253 = ""
10037020-256 = "[ns] «(Всё становится только хуже?!)»"
10037020-261 = ""
10037020-262 = ""
10037020-264 = "Г-Госпожа Президент?!"
10037020-265 = "[s1] «Нет, Кисаки! Кисаки, приди в себя!»\n[s2] «Встреча по обмену только началась!»"
10037020-266 = ""
10037020-267 = ""
10037020-269 = ""
10037020-270 = "...Да. Вы правы. Спасибо за своевременный совет."
10037020-271 = "Мина."
10037020-272 = "Д-Да, госпожа Президент!"
10037020-273 = "Я хочу, чтобы ты лично сообщила им: к гостям из Красной Зимы следует относиться так же хорошо, как к самой президенту Генрюмона."
10037020-274 = "В-Вы хотите сказать...?!"
10037020-275 = "Поторопись. Времени мало."
10037020-276 = ""
10037020-278 = ""
10037020-279 = "Как прикажете!"
10037020-280 = ""
10037020-282 = ""
10037020-283 = "...Я хотела бы кое-что у вас спросить, Сенсей."
10037020-284 = "[s] «...Конечно. Спрашивай что угодно.»"
10037020-285 = "Я... говорю слишком непонятно?"
10037020-286 = "Возможно, я недостаточно ясно отдаю приказы?"
10037020-287 = "[s] «Не думаю, что дело в этом...»"
10037020-288 = "Тогда вы знаете, почему наши ученики каждый раз делают вот это?"
10037020-289 = "[s] «...»"
10037020-290 = "Пожалуйста..."
10037020-291 = "Мне просто нужно, чтобы они слушали..."
10037020-295 = "Что это такое?! Нам сказали, что будет встреча по обмену... Проклятый Шаньхайцзин!"
10037020-296 = "Ну-ну, Черино — то есть, Великий Вождь Черино. Вы должны быть образцом смелости и великодушия."
10037020-297 = "Произошло несколько небольших недоразумений, но полагаю, их вот-вот разрешат."
10037020-299 = "Я поражена тем, что вы считаете «небольшим», Главный секретарь Томоэ..."
10037020-300 = "Как они могли? И ещё с маленькой пандой! Как бессердечно!"
10037020-301 = "Хо-хо... Выражение лица способно передать множество значений."
10037020-302 = "А что до возможных преимуществ, которые мы получили благодаря этому недоразумению...? Прибережём их на чёрный день."
10037020-303 = ""
10037020-307 = "А пока давайте насладимся тем, что Генрюмон Шаньхайцзина предложил нам в качестве извинения."
10037020-308 = "Признаю, форма Красной Зимы уже начинала казаться немного душной."
10037020-309 = ""
10037020-312 = "Черино, можешь поднять руки?"
10037020-321 = ""
10037020-322 = "Гости из Красной Зимы входят в Риккагаку!"
10037020-323 = "Все, пожалуйста, поприветствуйте наших гостей из Красной Зимы!"
10037020-324 = ""
10037020-332 = ""
10037020-333 = "Угх... Т-Так нормально...? Плечи... ноги...!"
10037020-334 = ""
10037020-338 = "[ns] «К-Кто вы?!»"
10037020-339 = ""
10037020-341 = ""
10037020-342 = "Сенсей?! Что вы...? Постойте — вы меня не узнаёте?! Или они и вас тут успели обработать, Сенсей?!"
10037020-343 = "[s] «Нет, я не это имел в виду!»"
10037020-344 = "Я настолько хорошо выгляжу, что вы меня не узнали? Вот это уже непонятно. Нужно выражаться прямее."
10037020-345 = "Ну-ну, председатель Марина. Сенсей просто так делает комплименты."
10037020-346 = "[s3] «...Не знаю, что сказать, Томоэ, кроме одного...»\n[s4] «Этот наряд будто специально для тебя сшили. Я легко могу представить тебя в нём каждый день.»"
10037020-349 = "Ох! Спасибо, Сенсей."
10037020-350 = "Знаете, я за вами наблюдала... Ваш талант говорить нужные вещи в нужный момент сделал бы вас отличным разжигателем революционного духа."
10037020-351 = "[s] «Ни за что...»"
10037020-352 = ""
10037020-354 = ""
10037020-356 = "Хм-м, я почему-то ревную! Товарищ, я тоже здесь!"
10037020-357 = "[s5] «Тебе идеально идёт этот образ, Черино!»\n[s6] «Особенно косички и одежда!»"
10037020-360 = "Т-Ты правда так думаешь? Хи-хи-хи... Как всегда, у тебя отличный глаз, товарищ!"
10037020-361 = ""
10037020-363 = ""
10037020-364 = "А? Где усы...? Ч-Что?! Томоэ!"
10037020-365 = ""
10037020-367 = ""
10037020-369 = ""
10037020-370 = "Ты ничего не видел. Верно, Томоэ?"
10037020-371 = "А что тут было видеть, Великий Вождь?"
10037020-372 = ""
10037020-374 = ""
10037020-376 = "(...Фальшивые усы — часть культуры Красной Зимы...?)"
10037020-377 = "(Слава богу. Решение провести встречу по обмену было правильным. Нам ещё многому предстоит научиться о мире.)"
10037020-379 = "Добро пожаловать в Шаньхайцзин."
10037020-380 = ""
10037020-383 = ""
10037020-385 = ""
10037020-387 = "Ещё раз благодарю вас за то, что приняли наше приглашение: Великий Вождь Красной Зимы Черино, Главный секретарь Томоэ и председатель Марина."
10037020-388 = "Я президент студенческого совета Шаньхайцзина, также известного как Генрюмон, Рюгэ Кисаки."
10037020-390 = "Рада познакомиться, госпожа Кисаки."
10037020-391 = ""
10037020-393 = ""
10037020-394 = "Так, Черино. Это твой шанс показать своё достоинство. Как я и говорила... Нет, как мы репетировали..."
10037020-395 = "П-Пора?! Л-Ладно...!"
10037020-399 = ""
10037020-400 = "Благодарю вас за столь пышный приём, госпожа Кисаки."
10037020-401 = "Я президент студенческого совета Красной Зимы, Главный инспектор по благоустройству, Главный секретарь, Начальник санитарной службы, Капитан спортивного клуба, Глава всех старост, Начальник санитарной службы и Знаток столового питания."
10037020-403 = "А совсем недавно я стала лучшим пудинговым гурманом месяца и директором производства кастеллы — Черино!"
10037020-404 = ""
10037020-406 = ""
10037020-408 = "(От такого длинного представления публика уснёт. А это замечание про «пышный приём»? Похоже, она так просто это не забудет...)"
10037020-409 = "(Но теперь уже ничего не поделать. Мы были неправы.)"
10037020-410 = "(Тихая битва уже началась. Но от человека вашего уровня я иного и не ожидала, Великий Вождь Черино.)"
10037020-412 = "Ну как, Томоэ? Я ничего не перепутала?"
10037020-413 = "Отлично, Черино. Ты наверняка показала им всё своё достоинство."
10037020-414 = ""
