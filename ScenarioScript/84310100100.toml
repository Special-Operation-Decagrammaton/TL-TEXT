[translation]
84310100100-5 = ""
84310100100-6 = "О, тут немного шумно. Что происходит?"
84310100100-7 = ""
84310100100-10 = ""
84310100100-11 = "А, Юризоно Сэя. Хорошо, что вы здесь. Я хотела кое-что вам сказать."
84310100100-13 = "Мне?"
84310100100-14 = "Нужно, чтобы я что-то сделала?"
84310100100-15 = "Наоборот. Я говорю ей перестать раздавать тебе поручения."
84310100100-16 = "...А? Что ты...?"
84310100100-17 = "Я знаю, ты не против помогать, но мы даём тебе слишком много заданий. Ты вообще-то здесь гость."
84310100100-18 = ""
84310100100-20 = ""
84310100100-21 = "Ты вообще помнишь, что приехала посмотреть Экспо? Или уже кажется, будто ты здесь только ради заданий?"
84310100100-22 = "Это не..."
84310100100-23 = ""
84310100100-25 = ""
84310100100-26 = "...Полагаю, это не совсем неправда. Если честно."
84310100100-27 = "Вот! Вот! Тогда какой в этом смысл?"
84310100100-29 = "Но она сама этого попросила."
84310100100-30 = "Люди иногда меняют мнение!"
84310100100-31 = ""
84310100100-34 = ""
84310100100-35 = "То, что она так сказала, не значит, что можно воспринимать её помощь как должное и днями подряд заваливать заданиями!"
84310100100-36 = "Н-Нет, Нэру. Всё правда нормально. Но я ценю твою заботу..."
84310100100-37 = "Ну, дело не только в этом..."
84310100100-38 = "...Сенсей пришёл и поговорил с нами."
84310100100-40 = "..."
84310100100-42 = "Сенсей...? Обо мне?"
84310100100-43 = "Не в смысле, что ругал, но..."
84310100100-44 = "Сенсей сказал, что было бы хорошо дать тебе пару дней просто насладиться Экспо."
84310100100-45 = "Очень вежливо, конечно, но посыл мы поняли."
84310100100-46 = ""
84310100100-49 = ""
84310100100-50 = "...Да, поняли. И я приношу извинения."
84310100100-52 = "Нет, повторюсь, извиняться не за что. Вы обе дали мне именно то, о чём я просила."
84310100100-53 = "Но точку зрения Сенсея я понимаю."
84310100100-54 = "У меня была причина приехать сюда, и мне стоит уделить время тому, ради чего я приехала."
84310100100-55 = "Стоит. Хотя бы день-два. Забудь о нашей работе. Просто походи по Экспо и развлекись."
84310100100-56 = "Ага, и даже если что-то случится, мы вдвоём справимся."
84310100100-57 = "Ц. Было бы неплохо, если бы Сенсей сам сразу пошёл к Сэе, вместо того чтобы заставлять меня всё это говорить..."
84310100100-59 = "(...Полагаю, обе они так думают.)"
84310100100-60 = "(Но Сенсей явно очень доверяет Нэру. И уверена, она это доверие заслужила.)"
84310100100-61 = "Хорошо. Раз все говорят одно и то же, я просто выкину всё из головы и пойду прогуляюсь."
84310100100-63 = "Ага. Развлекайся."
84310100100-64 = "Береги себя. Сообщи, если что-нибудь случится."
84310100100-66 = "Фуфу, обязательно."
