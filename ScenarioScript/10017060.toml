[translation]
10017060-1 = "Эпизод 6;Маленькие (?) женщины"
10017060-2 = "Центр Кивотоса"
10017060-4 = ""
10017060-5 = "Мы уже пришли, Ханаэ?"
10017060-6 = ""
10017060-8 = ""
10017060-9 = "Ещё немного... Почти!"
10017060-10 = "Это на другом конце города от места, где мы занимались благотворительностью..."
10017060-11 = "Не могу поверить, что такое происходит на Рождество."
10017060-12 = "Хаха... Похоже, Рыцари скорой помощи должны быть готовы ко всему, даже на Рождество."
10017060-13 = "Надеюсь только, что никто не пострадает..."
10017060-15 = "*БУМ*"
10017060-16 = ""
10017060-18 = ""
10017060-19 = "Кья!"
10017060-20 = "И-и-ик!"
10017060-21 = "Этот взрыв... Неужели...?"
10017060-22 = "Надо спешить!"
10017060-23 = "Ускоримся!"
10017060-25 = "Вход в White & Mason"
10017060-26 = ""
10017060-28 = "*тяжело дышит* *тяжело дышит*"
10017060-29 = "Прости, Цуруги... Я на пределе..."
10017060-30 = ""
10017060-32 = ""
10017060-34 = "Кррааагх..."
10017060-35 = "Теперь понимаю, почему вас называют секретным оружием Тринити, президент Цуруги."
10017060-36 = "А-а-а-ах..."
10017060-37 = "Тебе уже нужно уходить отсюда."
10017060-38 = "Не могу."
10017060-39 = "Я всё ещё не понимаю... Почему вы это делаете?"
10017060-40 = "Грех можно простить, но отрицать его существование — значит отрицать покаяние! Недопустимо!"
10017060-41 = "Передо мной трагедия! Я и не знала, что Боевая группа Правосудия пала так низко!"
10017060-42 = "Но моё сердце выдержит. Я не откажусь от помощи товарищам!"
10017060-43 = "А-а-а-а-а?!"
10017060-45 = ""
10017060-48 = "Капитан!"
10017060-49 = "Капитан! Вы в порядке?"
10017060-51 = "Ханаэ, Сэрина. Вы пришли."
10017060-52 = "Я в порядке. Пока моё сердце остаётся сильным, тело не дрогнет."
10017060-53 = "Только тех, кто говорит горькую правду, можно назвать настоящими друзьями."
10017060-54 = "Никакой капитуляции, пока они не примут нашу доброжелательность!"
10017060-55 = "[s1] «О, это Цуруги.»\n[s2] «Привет, Цуруги.»"
10017060-58 = "С-с-с-Сенсей?!"
10017060-59 = ""
10017060-61 = "(Я-я-я-я не могу опозориться перед Сенсеем!)"
10017060-62 = ""
10017060-64 = "Кьяк! А-а-а-а?!"
10017060-65 = ""
10017060-67 = ""
10017060-69 = "О. Президент Боевой группы Правосудия только что отключилась, как новорождённый муравьед!"
10017060-70 = "Сенсей, что вы опять сделали?"
10017060-71 = "[s3] «Я ничего не делал!»\n[s4] «Почему мы сразу решили, что это моя вина?!»"
10017060-75 = "Что, чёрт возьми, здесь происходит?!"
10017060-76 = ""
10017060-78 = ""
10017060-79 = "Цуруги?! Проснись! Что случилось? Почему она отключилась точь-в-точь как новорождённый муравьед?"
10017060-80 = "А. Вот вы где, вице-президент Хасуми."
10017060-81 = "Рыцари скорой помощи? Понятно, что здесь происходит."
10017060-82 = "Рыцари скорой помощи напали на Боевую группу Правосудия на Рождество."
10017060-83 = "Вы ведь понимаете, что это может перерасти в политическую проблему?"
10017060-84 = "Какова именно была причина этого нападения?"
10017060-85 = "В зависимости от вашего ответа Боевая группа Правосудия будет вынуждена ответить тем же!"
10017060-87 = "Что?! П-погодите..."
10017060-88 = "Мы просто..."
10017060-90 = "Как и подобает настоящим друзьям, мы всего лишь пришли встряхнуть Боевую группу Правосудия, которой это давно необходимо!"
10017060-91 = "Что за чушь ты несёшь?!"
10017060-92 = "Даже вы не понимаете, вице-президент Хасуми?!"
10017060-93 = "Я опустошена. Моё сердце разбито!"
10017060-94 = "Мы желаем лишь вашего спасения!"
10017060-95 = "Я пришла возродить Боевую группу Правосудия! Снова разжечь в них чувство справедливости!"
10017060-96 = "Теперь я вижу, что вы заблудились. Но не бойтесь! Как настоящий друг, я никогда не откажусь указать вам путь!"
10017060-97 = "...Что? Вообще-то сейчас потерялась именно я."
10017060-98 = "Скажи мне, Хасуми, где справедливость в том, чтобы отнимать у других? Где справедливость в том, чтобы предаваться собственной жадности на Рождество?"
10017060-99 = "Что мы вообще отняли? Можешь хотя бы начать с объяснения этого?!"
10017060-100 = "И ты хоть представляешь, как трудно было арендовать White & Mason? Конечно нет!"
10017060-101 = "Борьба за аренду этого кафе... Нам пришлось пройти через конкуренцию с другими клубами, заговоры и, хуже всего, бюрократию!"
10017060-102 = "Мы даже использовали присутствие Цуруги как аргумент на переговорах! Еле справились!"
10017060-103 = "Разве это не немного манипулятивно?!"
10017060-104 = "Правильно или нет, мы сделали то, что было нужно!"
10017060-105 = "Просто поступайте правильно!"
10017060-106 = "Суть в том, что в сегодняшний вечер вложили кучу усилий!"
10017060-107 = "А потом вы всё это выбросили в окно! Всё испорчено!"
10017060-108 = "Усилия не оправдывают несправедливость! Боевой группе Правосудия нужно напомнить о её предназначении!"
10017060-109 = "Ты такая упрямая! Всегда была упрямой! Помнишь, что ты сделала с тем фунтовым кексом на первом курсе?"
10017060-110 = "Не забегай вперёд! Не стоит бросаться камнями, живя в стеклянном доме! Или поговорим о том пудинге на твоём первом курсе?"
10017060-111 = "Ещё одно слово — и я объявлю войну Рыцарям скорой помощи!"
10017060-112 = "То, что ты вспомнила тот кекс, уже само по себе равносильно объявлению войны!"
10017060-113 = "[s5] «Эм, алло?»\n[s6] «Я не очень понимаю все эти разговоры о десертах, но можно вмешаться?»"
10017060-117 = "Сенсей?! Хорошо, что вы здесь! Пожалуйста, выслушайте. Внезапно капитан Майн—"
10017060-118 = "Прошу прощения за шум, Сенсей, но вице-президент Хасуми—"
10017060-119 = "Эй! Я первая спросила Сенсея!"
10017060-120 = "Я сегодня увидела Сенсея раньше тебя!"
10017060-121 = ""
10017060-123 = ""
10017060-133 = ""
10017060-134 = "Так вопросы не задают! До тебя просто невозможно достучаться!"
10017060-135 = "Впервые за сегодня мы в чём-то согласны!"
10017060-137 = "Капитан... Я не знаю, что делать..."
10017060-138 = "..."
10017060-139 = "Сэрина, Ханаэ."
10017060-140 = "Сейчас не мне указывать вам, как именно оказывать помощь."
10017060-141 = "Вы должны решить это сами."
10017060-142 = "Вы можете присоединиться ко мне и спасти Боевую группу Правосудия от их собственной тьмы."
10017060-143 = "Или можете безусловно лечить и поддерживать тех членов Боевой группы Правосудия, которым это необходимо."
10017060-144 = "Сердце, всегда готовое прийти на помощь, — вот с чего начинаются и чем заканчиваются Рыцари скорой помощи."
10017060-145 = ""
10017060-147 = ""
10017060-157 = "Ч-что нам делать? Что делать?!"
10017060-158 = "Сначала поможем капитану. Потом нужно заняться ранеными."
10017060-159 = "Точно?"
10017060-160 = "Я доверяю капитану, Ханаэ. Но мы не можем бросить и раненых членов Боевой группы Правосудия."
10017060-161 = "Нам не нужно выбирать сторону! Вместо этого поможем всем!"
10017060-163 = "...Да! Медицина не знает границ! Верно?"
10017060-164 = "Да. Медицина не знает границ. На этом стоят Рыцари скорой помощи."
10017060-165 = "Но столько людей пострадало..."
10017060-166 = "Даже если мы их вылечим, смогут ли Рыцари скорой помощи и Боевая группа Правосудия когда-нибудь помириться?"
10017060-167 = "Все раны заживают. Верно, Ханаэ?"
10017060-168 = "...Что?"
10017060-169 = "Потому что мы их вылечим."
10017060-170 = "О!"
10017060-171 = "Но сначала нужно быть к этому готовыми."
10017060-172 = "Т-точно! Я об этом не подумала!"
10017060-173 = "Хи-хи. Будет очень много работы."
10017060-174 = "И я всё это время буду улыбаться!"
10017060-176 = "Вот это настрой!"
10017060-177 = "Как я уже сказала, я не откажусь от вас, Боевая группа Правосудия!"
10017060-178 = "Пусть мой свет пронзит ваш затуманенный взор! Живите жизнью, достойной называться справедливой!"
