[translation]
10034090-1 = "Послесловие 1;Шиина Цумуги"
10034090-4 = ""
10034090-5 = "[ns1] «...Мы пришли.»\n[ns2] «Думаю, это то самое здание.»"
10034090-8 = "Да, адрес она дала именно этот. Хотя концертных площадок здесь не одна."
10034090-10 = "Одно можно сказать точно: это не какая-то одолженная репетиционная комната, не крыша и не одно из наших обычных маленьких местечек."
10034090-11 = "Ага. Здесь уже совсем другой уровень."
10034090-12 = "Похоже, она намного профессиональнее нас."
10034090-13 = ""
10034090-15 = ""
10034090-17 = ""
10034090-18 = "Мы можем просто так войти? Нам не нужно купить билеты или что-то такое?"
10034090-19 = "Обычно это работает именно так."
10034090-20 = "С другой стороны, нам и НЕ обязательно заходить к ней прямо сейчас. Если у неё сегодня концерт, как она говорила, она наверняка занята."
10034090-21 = "Верно. Можно потом просто написать ей, что мы посмотрели выступление и нам понравилось."
10034090-22 = ""
10034090-24 = ""
10034090-26 = ""
10034090-27 = "Айри, как нашему уважаемому лидеру, поручим это тебе?"
10034090-28 = "Я уже сказала, что не буду заниматься президентскими делами..."
10034090-29 = "Президент ты или нет, ты всё равно остаёшься нашим лидером. Почему бы не принять этот престиж?"
10034090-30 = "Конечно, скромность — это тоже одна из форм «рока»."
10034090-31 = "Угх... Не в этом дело..."
10034090-33 = "Ладно, давайте просто войдём. Сенсей, вы ведь встречались с Цумуги, да?"
10034090-34 = "[s] «Да, от неё немного веяло Нацу.»"
10034090-35 = "А...?"
10034090-36 = "Э-э... У меня плохое предчувствие..."
10034090-37 = "Хм..."
10034090-38 = "Д-давайте просто войдём! Ха-ха...!"
