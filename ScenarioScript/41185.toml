[translation]
41185-2 = "T3 abatido!"
41185-4 = "Confirmado! RABBIT 2, avance até a próxima cobertura!"
41185-5 = "Entendido!"
41185-6 = "Demais integrantes, mantenham posição por 5 segundos!"
41185-7 = "3... 2... 1..."
41185-12 = "Saki, agora! Lance o Foxtrot!"
41185-13 = "Entendido! Granada de luz, lá vai!"
41185-19 = "Miyu, sniper às 5 horas!"
41185-20 = "Ah, entendido...!"
41185-21 = "Desculpa, preciso recarregar antes...!"
41185-22 = "Entendido. Saki, fogo de cobertura!"
41185-23 = "Deixa comigo!"
41185-34 = "Quem são elas?!"
41185-35 = "Droga, não conseguimos dominá-las mesmo com essa vantagem numérica... Que situação é essa?!"
41185-36 = "Sermos encurraladas em casa não faz o menor sentido...!"
41185-37 = "Desse jeito vamos ser empurradas até a entrada!"
41185-38 = "Fiquem calmas, os reforços do Departamento de Segurança já devem estar chegando!"
41185-39 = "Assim que chegarem, vamos expulsá-las em ondas de ataque!"
41185-45 = "...Múltiplos passos confirmados vindos do lado oeste."
41185-49 = "Moe, consegue hackear os sensores de temperatura ambiente da Valkyrie?"
41185-50 = "O sistema de segurança inteiro seria outra história, mas só isso? Sem problema!"
41185-51 = "Manipule os valores para provocar um mau funcionamento."
41185-52 = "Para quantos graus eu coloco?"
41185-53 = "900 graus Celsius."
41185-54 = "OK!"
41185-57 = "O quê, água...?!"
41185-58 = "Os sprinklers deram defeito?!"
41185-59 = "Espera, isso significa que..."
41185-63 = "Droga, as portas corta-fogo...!"
41185-68 = "Ficar presa dentro da própria escola é o cúmulo..."
41185-69 = "Assim nem o Departamento de Segurança consegue se juntar a nós."
41185-70 = "Ah, mas não dá para abrir isso manualmente?"
41185-71 = "Ótimo, então vamos logo..."
41185-75 = "...O que é isso? Elas esqueceram alguma coisa?"
41185-76 = "Não é C4? Parece que tem tipo uma bateria de lítio presa nele."
41185-77 = "...Espera, lítio? Quer dizer que se encostar na água..."
41185-81 = "...Ah."
41185-91 = "Uaaah, que sono..."
41185-92 = "Sério, que bagunça no meio da madrugada..."
41185-93 = "Invadir o prédio principal da academia de polícia... tem gente que não tem noção mesmo..."
41185-94 = "Mas por que chamaram até a gente... O Departamento de Segurança bem que podia dar conta sozinho..."
41185-95 = "Vou só fingir que estou patrulhando de qualquer jeito e voltar logo para casa..."
41185-99 = "...O que é aquilo?"
41185-106 = "...Hã, estão tirando com a minha cara?"
41185-107 = "Mesmo assim, que armadilha mais maldosa..."
41185-108 = "Só alguém muito idiota para cair numa coisa dessas—"
41185-110 = "Esse aí é o donut edição limitada da \"Master Donuts\". E ainda tem recheio de marshmallow."
41185-111 = "...Sério mesmo?"
41185-115 = "Bom apeti—"
41185-120 = "Eu sabia~?!"
41185-127 = "...Não acredito que funcionou mesmo."
41185-128 = "Eu também achei meio estranho, mas eram ordens da Miyako-chan..."
41185-129 = "...Mas deu certo, né."
41185-131 = "Bem, para mim também foi uma aposta..."
41185-132 = "Se estamos conseguindo nos virar, é graças a todas vocês."
41185-133 = "Acho que, mesmo que outra pessoa estivesse no comando, o resultado provavelmente teria sido o mesmo..."
41185-134 = "Já falei para parar de desconversar."
41185-135 = "Hã, bem... desculpa...?"
41185-136 = "Não é isso! Esse resultado foi claramente mérito seu, Miyako. Não de outra pessoa, para de desconversar!"
41185-137 = "Foi você quem encontrou a melhor solução, isso não tem discussão, né?"
41185-139 = "É verdade, a gente só agiu exatamente como você mandou."
41185-140 = "Só deu certo porque confiamos em você, Miyako-chan."
41185-141 = "Bem, sobre tudo o que eu disse até agora... foi mal."
41185-142 = "Mas pelo menos agora você é a nossa líder, isso eu garanto."
41185-147 = "...Entendo."
41185-148 = "Ainda assim, o mérito não é só meu."
41185-149 = "Afinal, só conseguimos porque trabalhamos juntas."
41185-151 = "Você é mesmo teimosa..."
41185-152 = "Ah, nada fora do normal, né?"
41185-154 = "Acabamos conversando demais..."
41185-155 = "Vamos nos apressar!"
41185-161 = "Parem aí!"
41185-162 = "Eu achei que não podia ser... mas as invasoras,"
41185-163 = "eram vocês mesmas!"
41185-168 = "Você é, se não me engano..."
41185-169 = "Obrigada pela ajuda outro dia. Sou Kirino, a ás do Departamento de Segurança Pública!"
41185-170 = "Como oficial, não posso permitir invasão ao prédio escolar no meio da madrugada!"
41185-175 = "...Apareceu uma toda empolgada."
41185-176 = "...Miyako-chan, o que a gente faz?"
41185-178 = "(Outro dia eu acabei levando um tiro dela... mas, segundo nossas informações, a pontaria dela é...)"
41185-179 = "...Ignorem. Continuem avançando."
41185-185 = "H-Hã? E-Espera, o que significa isso?!"
41185-186 = "E-Eu vou atirar mesmo, viu?! Eu tenho que atirar!"
41185-187 = "A-Aí vai...!"
41185-196 = "Nenhum tiro acertou, hein..."
41185-197 = "Uuh... Outro dia eu consegui acertar de um jeito tão legal..."
41185-198 = "Deixar escapar alguém que estava bem na minha frente..."
41185-199 = "...A propósito, Fubuki, por que você estava caída aí com uma caixa de papelão na cabeça?"
41185-200 = "Ah, sei lá, bateu uma preguiça ou algo assim... Nem lembro direito."
41185-206 = "Enfim, Kirino, quer comer isso aqui?"
41185-208 = "Próximo;Hora dos Adultos"
