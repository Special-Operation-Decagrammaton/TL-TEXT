[translation]
41185-2 = "Вражеские штурмовики уничтожены. «Танго 3» выбыл!"
41185-4 = "Принято! RABBIT 2, продвигайся к следующей точке! Я прикрою!"
41185-5 = "Поняла!"
41185-6 = "Остальные, удерживать позиции пять секунд."
41185-7 = "Три... Два... Один..."
41185-8 = ""
41185-12 = "Саки, сейчас! Разрядить «Фокстрот»!"
41185-13 = "Светошумовая впереди!"
41185-14 = ""
41185-19 = "Мию! Вражеский снайпер на пять часов!"
41185-20 = "Есть!"
41185-21 = "Но в патроннике последний выстрел! Нужно перезарядиться!"
41185-22 = "Разрешаю. Саки, прикрой её!"
41185-23 = "Оставь мне!"
41185-24 = ""
41185-34 = "Кто, чёрт возьми, эти типы? Они режут нас как огромная организованная бензопила!"
41185-35 = "Их меньше, оружие хуже... а они всё равно оттесняют нас!"
41185-36 = "Это вообще НАША школа? Они используют местность лучше нас!"
41185-37 = "Такими темпами придётся отходить к центральному входу..."
41185-38 = "Держать позиции! Подкрепление Бюро безопасности должно прибыть с минуты на минуту!"
41185-39 = "Как только они придут, просто задавим их числом! В конце концов, их всего трое."
41185-40 = ""
41185-42 = ""
41185-45 = "Подкрепление замечено у западного входа."
41185-46 = ""
41185-48 = ""
41185-49 = "Моэ, можешь получить доступ к системе отопления школы? Нужно взломать датчик внутренней температуры."
41185-50 = "У таких систем практически нет защиты. Раз плюнуть."
41185-51 = "Завысь показания температуры. Обманем автоматическую систему управления зданием."
41185-52 = "Хи-хи. Вот это мне нравится. Насколько горячо?"
41185-53 = "900 градусов Цельсия!"
41185-54 = "Хорошо!"
41185-57 = "Э-Это вода?"
41185-58 = "Спринклеры сошли с ума!"
41185-59 = "А это значит..."
41185-60 = ""
41185-63 = "Ах! Противопожарные перегородки опускаются!"
41185-64 = ""
41185-68 = "Чёрт. Мы заперты внутри здания."
41185-69 = "Подкрепление больше не сможет к нам попасть."
41185-70 = "Не волнуйся. Перегородками можно управлять вручную из диспетчерской."
41185-71 = "Просто поднимем их и впустим подкрепление!"
41185-72 = ""
41185-74 = ""
41185-75 = "Хм? Это что? Нарушители забыли?"
41185-76 = "Похоже на заряд C4. Но сверху модифицированный литиевый аккумулятор, как у самодельной бомбы."
41185-77 = "Постой. Но если литий намокнет..."
41185-78 = ""
41185-80 = ""
41185-81 = "...Нам конец."
41185-82 = ""
41185-85 = ""
41185-91 = "*зевает* Спать хочется..."
41185-92 = "Что за шум посреди ночи?"
41185-93 = "Что за мир такой? Мелкий вор лезет именно в полицейскую школу."
41185-94 = "И зачем они разбудили вообще всех? Бюро безопасности и само справится с каким-то воришкой."
41185-95 = "Они уже держат ситуацию под контролем. Я просто быстро пройдусь по пути обратно."
41185-96 = ""
41185-98 = ""
41185-99 = "Хм...?"
41185-100 = ""
41185-102 = ""
41185-105 = ""
41185-106 = "Это худшая ловушка, которую я видела в жизни."
41185-107 = "Да, у нас репутация любителей пончиков, но такая откровенная ловушка прямо в главном здании — это уже оскорбление."
41185-108 = "Какой тупой идиот вообще попадётся на настолько очевидную ловушку..."
41185-109 = ""
41185-110 = "О, да. Это лимитированный клубничный пончик из Master Donuts. С маршмеллоу."
41185-111 = "С маршмеллоу? Ну тогда..."
41185-112 = ""
41185-114 = ""
41185-115 = "Спасибо за угощение!"
41185-116 = ""
41185-118 = ""
41185-120 = "В-Вы меня поймали!"
41185-121 = ""
41185-123 = ""
41185-127 = "Это реально сработало? Ущипните меня, пожалуйста."
41185-128 = "Я-я тоже сомневалась... Но Мияко сказала слепо выполнять её приказы."
41185-129 = "В итоге получилось."
41185-131 = "Ха... Я тоже нервничала. Это была немного авантюра."
41185-132 = "Но мы смогли пройти через огромные силы врага и дойти сюда только благодаря выдающимся навыкам каждой из вас."
41185-133 = "С любым другим лидером результат был бы таким же."
41185-134 = "Опять ты за своё."
41185-135 = "Простите? Я что-то не так сказала?"
41185-136 = "Мияко, дурья башка! Всё благодаря тебе! Никто другой нас сюда не привёл. Это ТЫ!"
41185-137 = "Во всём Кивотосе нет никого, кто смог бы сделать то, что ты сейчас сделала! Ты оценила ситуацию, навыки каждой из нас и правильно всех расставила. Это всё ты."
41185-139 = "Мы были твоими маленькими пешками, а ты идеально сыграла партию."
41185-140 = "М-Мы об этом не говорим, но... всегда верили в тебя как в лидера."
41185-141 = "Даже то, что я говорила, будто не признаю тебя лидером..."
41185-142 = "Я не это имела в виду. Прости."
41185-143 = ""
41185-145 = ""
41185-146 = ""
41185-147 = "Спасибо, все."
41185-148 = "Но я всё равно не согласна, что это только моя заслуга."
41185-149 = "Операцию спецназа можно провести лишь силами всего отряда!"
41185-151 = "Вот же упрямый командир."
41185-152 = "В этом её очарование."
41185-154 = "Хватит болтать."
41185-155 = "Мы ещё не выбрались. Студенты Валькирии скоро нас догонят. Двигаемся!"
41185-156 = ""
41185-158 = ""
41185-159 = ""
41185-161 = "Стоять, злодейки!"
41185-162 = "Я слышала, в школу проникли нарушители..."
41185-163 = "А это оказались вы!"
41185-164 = ""
41185-166 = ""
41185-168 = "Разве ты не..."
41185-169 = "Меня трудно забыть, да? Это я, Кирино, ас Бюро общественной безопасности! Один раз я уже победила вас своим Ударом правосудия и сделаю это снова!"
41185-170 = "Я не проявлю милосердия к преступницам, угрожающим общественному порядку и миру!"
41185-171 = ""
41185-173 = ""
41185-175 = "Кто эта горячая чудила, которая перекрыла путь?"
41185-176 = "В-Ваш приказ, Мияко."
41185-178 = "(По данным Сенсея, навыки стрельбы этого студента определённо...)"
41185-179 = "Игнорировать. Продолжаем к точке сбора."
41185-180 = ""
41185-182 = ""
41185-185 = "О-Они ушли? Эй! Вернитесь!"
41185-186 = "Я правда выстрелю! Реально выстрелю, если не вернётесь!"
41185-187 = "Аргх!"
41185-188 = ""
41185-190 = ""
41185-191 = ""
41185-192 = ""
41185-193 = ""
41185-194 = ""
41185-196 = "Этот выстрел улетел на Луну..."
41185-197 = "Разве в прошлый раз я их не обезвредила идеально?"
41185-198 = "Я провалила долг. Преступницы ускользнули прямо из рук."
41185-199 = "Кстати, почему ты лежала на полу с коробкой на голове?"
41185-200 = "Хм. Не помню. Знаю только, что у меня в руке лимитированный пончик."
41185-201 = ""
41185-203 = ""
41185-204 = ""
41185-206 = "Хочешь кусочек, Кирино?"
41185-208 = "Следующий эпизод;Пора взрослеть"
