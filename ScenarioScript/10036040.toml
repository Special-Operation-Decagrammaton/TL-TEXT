[translation]
10036040-1 = "Эпизод 4;Тарелка якисобы"
10036040-2 = ""
10036040-3 = "Чёрт! Кто ОНИ вообще такие?! Просто возникли на пути из ниоткуда!"
10036040-4 = "Если бы не они, диджей уже был бы у нас!"
10036040-5 = "Проблема в том, что мы мыслили слишком мелко. Банда шлемов заслуживает худшего."
10036040-6 = "Ага, думаешь?"
10036040-7 = "Конечно! Простого похищения недостаточно за то, что они сделали."
10036040-8 = "Особенно учитывая, что мы ЗАПЛАТИЛИ за этот план."
10036040-9 = "Раньше ты говорила, что план идеальный."
10036040-10 = "Заткнись! Снова звоним этой профессорше!"
10036040-11 = "Ладно."
10036040-12 = ""
10036040-14 = ""
10036040-17 = "Здравствуйте. Как продвигается план?"
10036040-18 = "Нас избили и прогнали какие-то случайные сопляки, даже не из Банды шлемов!"
10036040-19 = "Что это вообще был за мелочный план? Дайте нам что-то масштабнее, что-то надёжное!"
10036040-20 = "Хм? Ну, вы должны понимать, что я составила тот план на основе информации, которую вы мне дали..."
10036040-21 = "С учётом расположения фигур я решила, что дебюта хватит, чтобы довести дело до мата."
10036040-22 = "Но если это не так... объяснение может быть только одно."
10036040-23 = ""
10036040-24 = "«В игру вошёл новый игрок.»"
10036040-25 = "...Хм, вот как. Это может сыграть нам на руку."
10036040-26 = "Теперь мы знаем, что диджей защищён лучше, чем мы думали."
10036040-27 = "И после попытки похищения они наверняка выделят на его защиту ещё больше сил."
10036040-28 = "Переставим фигуры. Расстановка фигур — моя специальность."
10036040-30 = "Эм, о какой игре вообще речь...?"
10036040-32 = "И за этот план платить не нужно. Считайте это... бонусом после продажи."
10036040-34 = "Д-Да? Отлично! Блин, сразу бы так..."
10036040-35 = "Так какой план? Мы же не будем просто повторять то же самое?"
10036040-37 = "Конечно нет."
10036040-38 = "Под именем «Профессор Смог, первоклассный консультант по преступлениям»..."
10036040-39 = ""
10036040-41 = ""
10036040-43 = "...я создам игру, полную зрелища и блеска."
10036040-45 = ""
10036040-46 = "Фух, кажется, сцену наконец полностью собрали."
10036040-47 = "Спасибо за помощь, Сенсей. Теперь я должна вам ещё больше."
10036040-48 = "[s1] «Это был интересный новый опыт.»\n[s2] «Мне понравилось узнавать обо всём этом.»"
10036040-51 = "И правда. Не каждый день удаётся увидеть вблизи оборудование такой стоимости."
10036040-52 = "Думаю, одна эта вертушка стоит... больше, чем я могу себе позволить."
10036040-53 = "И нужны часы и часы практики, чтобы обращаться с ней так, как DJ B.o.B."
10036040-54 = "[s] «Ты много знаешь о диджеинге.»"
10036040-55 = "Ну, я знала, что буду помогать диджею, поэтому подготовилась заранее."
10036040-56 = "Не сказала бы, что «много знаю». Я выучила только то, что было нужно для задания."
10036040-57 = "[s3] «Что ещё можешь рассказать?»\n[s4] «Ты знаешь больше меня.»"
10036040-60 = "Могу рассказать ещё, если вам интересно, но... не сейчас. DJ B.o.B может позвать меня в любую минуту..."
10036040-61 = "[s] «А, не переживай за него. Он не помешает.»"
10036040-62 = "Эм... наверное, я поверю вам, Сенсей."
10036040-63 = "Хорошо, вот что я знаю."
10036040-64 = "«DJ» — сокращение от «Disc Jockey». Они подбирают музыку, чтобы создавать настроение на вечеринках и тому подобном."
10036040-65 = "Главный их навык — смешивать несколько существующих треков и создавать из них что-то новое. Возможных звучаний бесконечно много."
10036040-66 = "А главный инструмент — вот эта вертушка."
10036040-67 = "С её помощью можно менять BPM или делать скретчи — если играют пластинки или CD."
10036040-68 = "Вот так..."
10036040-69 = ""
10036040-71 = ""
10036040-72 = "...Ну, примерно в этом суть."
10036040-73 = "[s5] «У тебя хорошо получается!»\n[s6] «Ты случайно не профессионал?»"
10036040-76 = "...Я всё ещё новичок, но спасибо, Сенсей."
10036040-77 = "Пока готовилась к заданию, нашла старую брошенную вертушку и немного попрактиковалась."
10036040-78 = "Хотя с таким хорошим оборудованием всё ощущается гораздо плавнее. Достаточно лёгкого движения пальцев по фейдеру высоты..."
10036040-79 = "Погодите, если снизить BPM и поднять тональность..."
10036040-80 = ""
10036040-82 = ""
10036040-83 = "Понятно. Вот как это работает."
10036040-84 = "А если добавить скретч..."
10036040-85 = ""
10036040-87 = ""
10036040-88 = "...О-о!"
10036040-89 = "П-Простите. Я немного увлеклась."
10036040-90 = "Ладно, на этом хватит. Пойдём расставлять сиденья."
10036040-91 = "Сначала передний сектор..."
10036040-92 = ""
10036040-95 = "..."
10036040-96 = "[s] «Может, пообедаем?»"
10036040-97 = "Но работа ещё осталась."
10036040-98 = "[s] «Ацуко, Мисаки и Хиёри могут быть у киосков с едой.»"
10036040-99 = "Хм, надеюсь, они нашли что-нибудь вкусное. Они заслуживают здесь повеселиться."
10036040-100 = "[s] «Похоже, ты за них переживаешь. Хочешь пойти поздороваться?»"
10036040-101 = "...Сначала спрошу заказчика."
10036040-102 = ""
10036040-104 = ""
10036040-105 = "[ns] «...»"
10036040-107 = ""
10036040-108 = "Я вернулась."
10036040-109 = "Почему-то он сказал мне: «Да, конечно, приятного аппетита! Не напрягайтесь, отдыхайте!»"
10036040-110 = "Он ОПРЕДЕЛЁННО не такой, как был утром."
10036040-111 = "Но он всё-таки разрешил, так почему нет? Пойдём."
10036040-112 = "В сектор с палатками с едой, Сенсей."
10036040-115 = "Похоже, в палатки с едой вложили не меньше усилий, чем в концерт."
10036040-116 = "Чего бы вам ни хотелось, уверена, здесь это найдётся."
10036040-117 = "Кстати, Хиёри как-то спрашивала меня, какой вкус у якисобы."
10036040-118 = "Я её тоже никогда не ела, поэтому тогда просто придумала ответ."
10036040-119 = ""
10036040-123 = ""
10036040-124 = "Сюда, Сенсей!"
10036040-125 = ""
10036040-130 = ""
10036040-131 = "Х-Хи-хи, столько еды... Мне вообще можно быть настолько счастливой? Нас ведь не откажутся обслуживать везде подряд, а потом не придётся идти ловить крабов, правда?"
10036040-132 = "Конечно нет. Я даже накопила карманные деньги специально на сегодня, так что не бойся."
10036040-133 = "Чего вы двое хотите?"
10036040-134 = "Ничего конкретного. Почему-то толпы и жара только отбивают у меня аппетит."
10036040-135 = "Я хочу якисобу!"
10036040-136 = "Я спрашивала Саори, какая она на вкус, и она сказала — как рай, хи-хи!"
10036040-137 = "Ну, точнее она сказала: «В три раза вкуснее пайкового сахара!»"
10036040-138 = "И я ей верю!"
10036040-139 = "..."
10036040-141 = "Наверное, я тоже возьму то же самое."
10036040-145 = ""
10036040-146 = ""
10036040-147 = "В этом месте не слишком людно. Может, зайдём сюда?"
10036040-148 = "Подойдёт."
10036040-149 = ""
10036040-151 = ""
10036040-152 = ""
10036040-153 = "Добро пожаловать! На троих? Прошу сюда!"
10036040-154 = "Х-Хи-хи, н-наконец-то я попробую рай!"
10036040-155 = ""
10036040-157 = ""
10036040-159 = ""
10036040-160 = ""
10036040-162 = "Вот меню. Не спешите."
10036040-163 = ""
10036040-166 = ""
10036040-167 = "Ну а теперь..."
10036040-169 = "Погодите, 3000 иен за мороженое на палочке? 7000 за порцию якисобы?!"
10036040-170 = ""
10036040-173 = ""
10036040-174 = "Это место может быть только..."
10036040-176 = "...пятизвёздочным рестораном высокой кухни!"
10036040-178 = "Нет, нет, это временная палатка."
10036040-179 = "Это просто дикие наценки, вот и всё."
10036040-181 = "Простите?"
10036040-182 = "Наши цены определяются спросом и предложением."
10036040-183 = "Сегодня желающих поесть здесь предостаточно."
10036040-184 = "Но доставка ингредиентов на удалённый пляж требует расходов на транспорт, содержание, труд и так далее."
10036040-185 = "Естественно, это повышает цену."
10036040-186 = "Но даже так это слишком. В несколько раз дороже обычной цены."
10036040-187 = "Ну, конечно, вы можете пойти куда-нибудь ещё."
10036040-188 = "Но для сведения: это самая дешёвая палатка на фестивале."
10036040-190 = "Серьёзно?"
10036040-191 = "Н-Нет надежды... Это конец... если только мы не поедим здесь, а потом не возьмём опасную работу, чтобы расплатиться."
10036040-192 = "Может, можно позировать в откровенных купальниках за деньги, как в той статье, что я читала. Кажется, называлось «Пляжный денди»..."
10036040-193 = "Успокойся, Хиёри. Деньги у нас ЕСТЬ."
10036040-194 = "Это определённо дороже, чем мы ожидали... но было бы жалко уйти голодными, правда?"
10036040-195 = "Но бюджет..."
10036040-196 = "Деньги можно накопить снова, а кто знает, когда ещё у нас появится шанс создать такие воспоминания?"
10036040-197 = "Так, раз, два, три... Вот, 7000 иен. Одну якисобу, пожалуйста."
10036040-198 = "Хи-хи! Поняла! Заказ принят!"
10036040-199 = ""
10036040-201 = ""
10036040-202 = ""
10036040-203 = "Просто безумие..."
10036040-204 = "Даже на Чёрном рынке сказали бы, что это слишком дорого."
10036040-205 = "Не могу поверить, что они пытаются столько брать!"
10036040-206 = "[s] «Всё нормально, Саори. Я могу заплатить за них, хорошо?»"
10036040-207 = "Нет, так будет неправильно."
10036040-208 = "Это вина палатки с едой. Не вы должны за это расплачиваться."
10036040-209 = "...Сделаем иначе. Идите за мной."
10036040-210 = ""
10036040-212 = ""
10036040-214 = "За кухней палатки с едой"
10036040-215 = ""
10036040-216 = "Ха-ха, на каждого найдётся свой лох!"
10036040-217 = "Ха-ха-ха! Не могу поверить, что кто-то заплатил столько за якисобу."
10036040-218 = "Она что, какая-то большая шишка из корпорации?"
10036040-219 = "Нет, деньги у неё были все мятые."
10036040-220 = "Наверняка мы оставили её без гроша, но здесь так устроено. Закон джунглей!"
10036040-221 = "Ага, слышали про тех четырёх нарушительниц, которые взорвали раменную, потому что им не понравилась одна общая миска?"
10036040-222 = "Жёсткий бизнес. Чтобы выжить, делаешь что нужно."
10036040-223 = "Правда?"
10036040-224 = ""
10036040-227 = "Хватит с вас двоих."
10036040-228 = ""
10036040-231 = ""
10036040-234 = ""
10036040-235 = "Вы кто такие?!"
10036040-237 = "Сколько там стоила якисоба?"
10036040-239 = "7000 иен! Не хотите — не заказывайте!"
10036040-241 = "Дороговато, не находите?"
10036040-243 = "И-И что ТЫ с этим сделаешь? Те покупатели честно заплатили."
10036040-244 = "Честно, говоришь? Забавно, я посмотрела меню, которое вы подавали комитету фестиваля. Там якисоба стоила 700 иен, а не 7000."
10036040-245 = "Вы получили одобрение на эту цену, а потом подняли её в десять раз."
10036040-246 = "Ничего честного в этом нет."
10036040-247 = "Хмф! Покупатель сам должен смотреть. Не наша вина, если он делает плохой выбор."
10036040-248 = "Нет уж. Это ВАША вина, потому что вы специально их обманули."
10036040-249 = "Так что сейчас же извинитесь и возместите всё каждому."
10036040-250 = "Ого, смотрите, мисс Мораль. Все сюда!"
10036040-251 = ""
10036040-253 = ""
10036040-255 = ""
10036040-256 = ""
10036040-257 = ""
10036040-258 = ""
10036040-259 = "Вы ведь не хотите закончить фестиваль в больнице? Проваливайте."
10036040-261 = "..."
10036040-262 = "Ну что, Сенсей, теперь отступать некуда."
10036040-263 = "Разберёмся до того, как «дети» узнают."
