[translation]
1010906-1 = "Маленькое пятно"
1010906-2 = "Исполнительный офис Шале"
1010906-4 = "На следующий день, пока мы с Ноа работали в Шале..."
1010906-5 = ""
1010906-8 = "[ns] «После обеда меня немного клонит в сон...»"
1010906-10 = "[ns] «Ноа, хочешь кофе?»"
1010906-11 = "Ах, а я как раз думала, как приятно было бы выпить чашечку кофе."
1010906-12 = "Мне тоже одну, пожалуйста."
1010906-14 = ""
1010906-17 = "[ns1] «Вот чашка чёрного кофе.»\n[ns2] «Я налил до краёв, так что осторожнее.»"
1010906-20 = ""
1010906-21 = ""
1010906-22 = ""
1010906-23 = "[ns] «Ай! Горячо!»"
1010906-24 = "С-Сенсей, вы в порядке?"
1010906-25 = "[s] «Со мной всё хорошо. А ты?»"
1010906-26 = "Да, со мной тоже всё в порядке."
1010906-27 = "Чашка немного дрогнула, и часть кофе пролилась. Пожалуйста, охладите руки водой."
1010906-28 = "Кофе на полу можно вытереть... На юбке осталось несколько пятен, но ничего страшного."
1010906-29 = "[s3] «Прости, я испачкал твою белую юбку.»\n[s4] «Если хочешь, можешь сходить переодеться.»"
1010906-32 = ""
1010906-34 = ""
1010906-35 = ""
1010906-36 = "Нет, всё в порядке. Я всё равно собиралась заняться стиркой сразу после работы."
1010906-37 = ""
1010906-39 = ""
1010906-40 = ""
1010906-41 = "...Хотя, пожалуй, если оставить всё как есть, меня это будет беспокоить."
1010906-42 = "Прошу прощения, Сенсей. Я ненадолго отойду и переоденусь во «что-нибудь поудобнее.»"
1010906-43 = ""
1010906-45 = ""
1010906-47 = "Немного позже..."
1010906-49 = ""
1010906-50 = "Я вернулась!"
1010906-51 = "[s] «Ноа, твоя одежда...»"
1010906-52 = "Да? Как я и сказала, я надела «что-нибудь удобное.»"
1010906-53 = "Хорошо, что в прошлый раз я оставила в Шале запасную пижаму."
1010906-54 = "Остаток сегодняшней смены я проведу в ней."
1010906-55 = "[s] «Но что, если другие студенты увидят тебя и неправильно поймут...?»"
1010906-56 = "Что тут можно неправильно понять, если я объясню, что переоделась из-за пятна от кофе?"
1010906-57 = ""
1010906-59 = ""
1010906-60 = ""
1010906-61 = "Или вас беспокоит что-то ещё?"
1010906-62 = "[s5] «Ну, пожалуй, нет...»\n[s6] «Но мне кажется, работать в белой пижаме будет неудобно.»"
1010906-65 = ""
1010906-67 = ""
1010906-68 = "Всё в порядке. Я и так привыкла носить белое."
1010906-69 = "Меня часто спрашивают, не неудобно ли носить только белую одежду, но я нахожу в этом немало преимуществ."
1010906-70 = "Белый хорошо сочетается с любым цветом, а любые загрязнения сразу заметны и их легко убрать."
1010906-71 = "Кроме того, белый хорошо отражает свет, поэтому идеально подходит такому чувствительному к жаре человеку, как я."
1010906-72 = "А ещё, когда на одежде появляются такие пятна... они становятся записью о прожитом дне."
1010906-73 = "[ns] «Ноа.»"
1010906-74 = "Д-да?! Я сказала что-то странное?"
1010906-75 = "[s7] «Нет. Просто пятна от кофе с белой одежды трудно вывести...»\n[s8] «Можешь прямо сейчас сходить в прачечную и заняться ими.»"
1010906-78 = "..."
1010906-79 = "Сенсей, иногда вы..."
1010906-80 = "Бываете совершенно нечутким в некоторых вещах."
1010906-81 = "[s] «А? Почему ты расстроилась?»"
1010906-82 = "...Не знаю."
1010906-84 = "Мне ещё довольно долго пришлось пытаться успокоить Ноа..."
