[translation]
70014020-1 = "Странствия аптекаря 2"
70014020-2 = "..."
70014020-3 = "И зачем мне это?"
70014020-4 = "Иными словами, какую выгоду я получу?"
70014020-5 = "Сейчас этот дом и так скоро станет моим."
70014020-6 = "Более того, исцелив её, я могу всё испортить."
70014020-7 = "[s1] «И всё же, почему бы не попробовать?»\n[s2] «Взамен я дам тебе обещание, Кай»."
70014020-10 = "Обещание...? Мне?"
70014020-11 = "...Не мне, конечно, об этом говорить, но..."
70014020-12 = "Сенсей, вы точно хорошо себя чувствуете? Вы в своём уме?"
70014020-13 = "[s3] «Стоило учителю предложить студенту обещание...»\n[s4] «Как сразу такое недоверие! Обидно!»"
70014020-16 = "Вот как. Значит, «студенту»?"
70014020-17 = "И всё же... Вы ведь хотите сказать..."
70014020-18 = "...Кхе-хе-хе. Что ж. Весьма любопытное предложение. Пожалуй, соглашусь."
70014020-19 = "Но будьте осторожнее, Сенсей. Вес обещания... куда больше, чем вам кажется."
70014020-20 = ""
70014020-22 = ""
70014020-25 = "Кай достала из сумки несколько ингредиентов, смешала их и осторожно нагрела..."
70014020-26 = "В конце долгого и трудоёмкого процесса у неё получилось кое-что приготовить."
70014020-27 = "И ещё..."
70014020-29 = ""
70014020-30 = "Что... произошло? Моё тело, мои суставы...?!"
70014020-31 = "Вы ещё не до конца выздоровели. Ну... Через неделю, возможно, всё пройдёт."
70014020-32 = "Всегда есть риск рецидива. Если боль вернётся, обязательно примите это."
70014020-33 = ""
70014020-35 = ""
70014020-36 = "Однако как аптекарь я настоятельно рекомендую принимать его ТОЛЬКО при появлении симптомов."
70014020-37 = "Спасибо... Огромное тебе спасибо..."
70014020-38 = "Но... Если меня можно было так легко вылечить, почему я так долго болела...?"
70014020-39 = "..."
70014020-40 = ""
70014020-41 = "[ns5] «Н-Ну, наверное, потому что старое лекарство Кай...!»\n[ns6] «Вместе с сегодняшним лекарством...!»\n[ns7] «И дало такой лечебный эффект...!»"
70014020-45 = "Вот оно что... Значит, так и есть? Спасибо, Кай. Спасибо тебе огромное..."
70014020-46 = "Ну да. Именно так."
70014020-47 = "Ха-ха... Давно я не чувствовала такой лёгкости. Кажется, теперь смогу без труда спуститься по лестнице."
70014020-48 = "Надо бы отпраздновать! Может, даже выпить где-нибудь! Столько времени прошло..."
70014020-49 = ""
70014020-51 = ""
70014020-52 = ""
70014020-53 = "[ns] «Ты и правда очень умелая...»"
70014020-54 = "Разумеется. Это само собой. На самом деле, если бы её состояние не улучшилось, я бы, наверное, расстроилась."
70014020-55 = "[s8] «Не потому, что старушка не выздоровела бы...»\n[s9] «А потому, что это означало бы твою ошибку...?»"
70014020-58 = "О. Вы полагаете, что неплохо меня понимаете, не так ли, Сенсей?"
70014020-59 = "В данном случае вы правы. Терпеть не могу мысль, что могу ошибиться. Для врача и аптекаря это совершенно естественно."
70014020-60 = "Поэтому исцеление этой пожилой женщины не вызвало у меня никаких чувств. Ведь результат был предрешён."
70014020-61 = "Впрочем..."
70014020-62 = "..."
70014020-63 = "Если подумать, всё не так уж плохо."
70014020-64 = "Итак, Сенсей."
70014020-65 = ""
70014020-67 = ""
70014020-69 = "Мне всё сильнее хочется поговорить о вашем «обещании»."
70014020-70 = "Хм? «Не беспокойся об этом и просто немного подожди»?"
70014020-71 = "Сначала вам нужно закончить дела на Чёрном рынке?"
70014020-72 = ""
70014020-74 = ""
70014020-75 = "..."
70014020-76 = "Это определённо пробуждает моё любопытство. Вы не из тех, кто без причины бродит по таким местам, Сенсей."
70014020-77 = "Так что позвольте спросить. Сенсей, зачем вы проделали весь этот путь?"
70014020-78 = ""
70014020-81 = "[ns] «Я хочу своими глазами увидеть, что представляет собой Чёрный рынок»."
