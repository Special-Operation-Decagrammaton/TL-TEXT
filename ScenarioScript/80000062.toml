[translation]
80000062-1 = "Нет упаковки — не проблема"
80000062-2 = "Вот вы где, Сенсей."
80000062-3 = "Спасибо, что согласились встретиться так поздно. У меня перерыв между экстренными вызовами, поэтому далеко уходить нельзя."
80000062-4 = "[s1] «Не стоит благодарности. Что случилось?»\n[s2] «Не нужно извиняться за занятость.»"
80000062-5 = "Ничего особенного. Ничего не случилось."
80000062-6 = "Сегодня не больше и не меньше работы, чем обычно, поэтому проблемы я не вижу."
80000062-7 = "У вас наверняка тоже полно дел, поэтому сразу перейду к сути."
80000062-8 = "Я позвала вас ради этого."
80000062-9 = ""
80000062-11 = ""
80000062-14 = "[ns3] «Это шоколад ко Дню святого Валентина?»\n[ns4] «Он обмотан бинтами?»"
80000062-15 = "Верно. Сегодня День святого Валентина, и было бы неправильно не вручить вам подходящий подарок."
80000062-16 = "Верно. Сегодня День святого Валентина, и было бы неправильно не вручить вам подходящий подарок."
80000062-17 = "Возможно, стоило купить обычный шоколад в магазине..."
80000062-18 = "...но времени было мало, поэтому я решила использовать то, что уже было под рукой."
80000062-19 = "[ns] «А, значит, шоколад домашний.»"
80000062-21 = "[ns] «Погоди. А что именно было у тебя под рукой...?»"
80000062-22 = "Как вы знаете, в наших машинах скорой помощи есть всевозможные лекарства и материалы на случай чрезвычайных ситуаций. Приготовить простой шоколад не проблема."
80000062-23 = "Хм?"
80000062-24 = "Что такое? Вы выглядите напряжённо."
80000062-25 = "А, кажется, я понимаю, что вас беспокоит. Но можете не переживать."
80000062-26 = "Пусть смесь и необычная и лишь по вкусу напоминает шоколад,#nона совершенно безвредна и нетоксична."
80000062-27 = "Хотя упаковка всё же оставляет желать лучшего..."
80000062-28 = "Упаковочной бумаги у меня не было, поэтому пришлось использовать стерильные бинты. Наверное, выглядит немного странно."
80000062-29 = "Оформление — важная часть любого подарка, поэтому я переживала именно об этом."
80000062-30 = "[s5] «Он необычный, прямо как ты, Сэна. Мне нравится.»\n[s6] «Он единственный в своём роде. Мне так даже больше нравится.»"
80000062-31 = "Опять эти непринуждённые комплименты. Очень на вас похоже, Сенсей."
80000062-32 = "Опять эти непринуждённые комплименты. Очень на вас похоже, Сенсей."
80000062-33 = "Что касается шоколада, вкус у него должен быть обычным. Не могли бы вы попробовать сейчас,#nесли не возражаете?"
80000062-34 = ""
80000062-36 = ""
80000062-37 = "Насколько я знаю, по традиции Дня святого Валентина я должна лично вас им накормить.#nПриступим."
80000062-38 = "Хм? Почему вы колеблетесь?"
80000062-39 = "Я же сказала, его безопасно есть. Пожалуйста, не двигайтесь."
80000062-40 = ""
80000062-43 = ""
80000062-44 = ""
80000062-45 = "Я сказала... не двигайтесь."
80000062-49 = "К моему удивлению, на вкус это действительно оказалось шоколадом."
