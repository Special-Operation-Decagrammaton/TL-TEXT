[translation]
41060-1 = "Эпизод 6;Операция по доставке еды"
41060-2 = "На следующее утро я пришёл в парк проверить, как дела у отряда RABBIT."
41060-4 = "Перед парком Коусаги"
41060-11 = "[ns1] «А-а-а!»\n[ns2] «Кто поставил здесь ловушку?!»"
41060-15 = ""
41060-16 = "Сенсей из Шале?"
41060-17 = "Я-то думала, что это грязная бродячая собака."
41060-18 = "[s3] «Грязная бродячая собака… Ты ранишь меня в самое сердце.»\n[s4] «Зачем здесь эта ловушка?»"
41060-19 = "Это Вы сами виноваты, что попались."
41060-20 = "Разве это не очевидно?"
41060-21 = "Мы обезопасили периметр от возможных нарушителей."
41060-22 = "О, это же наш не самый любимый Сенсей?"
41060-23 = "Ох, я бы на на Вашем месте была осторожнее. Я тут вокруг мины расставила."
41060-24 = "[s5] «Это уже слишком!»\n[s6] «Где именно?!»"
41060-25 = "Хи-хи. Ну, я и сама без понятия, где они."
41060-26 = "Хи-хи, не знаю."
41060-27 = "Давайте посмотрим… Как же их найти… Думаю, если что-то сделает ба-бах, то вуаля!  Мы нашли мину!"
41060-28 = "[s] «Девчата, вы превратили парк в зону боевых действий!»"
41060-29 = "Ну а как ещё нам себя защищать?"
41060-30 = "Это база!"
41060-31 = "Хотя, похоже, противотанковые мины и растяжки в стандартную процедуру не входят…"
41060-32 = "[s] «Я полагаю... Это Мияко вам сказала...»"
41060-33 = "На задании лишней подготовки не бывает."
41060-34 = "Никогда не позволяй ложному чувству безопасности одурачить тебя. Так поступают только лузеры."
41060-35 = ""
41060-37 = ""
41060-40 = ""
41060-41 = "Саки, Мое... Вы обе в порядке?"
41060-42 = "Я услышала какой-то шум, исходящий отсюда."
41060-43 = "И-ик… Э-это Сенсей."
41060-44 = "Здравствуйте, Сенсей."
41060-45 = "Какие у Вас к нам дела, когда солнце ещё даже не встало?"
41060-46 = "[s7] «Как спалось?»\n[s8] «Я хотел узнать, не нуждаетесь ли вы в чём-то?»"
41060-47 = "Нормально. Думаю, Вам не стоит так сильно переживать."
41060-48 = "Вам не о чем беспокоиться."
41060-49 = "Студенты SRT хорошо обучены для подобных ситуаций."
41060-50 = "Ага! Мы можем расставить палатки и разжечь огонь даже с закрытыми глазами."
41060-51 = "Навыки выживания обязательны для всех студентов SRT."
41060-53 = "Ну, мы ведь не в дикой глуши. У нас есть вода и электричество. Это практически пятизвёздочный отель!"
41060-54 = "И тут довольно много тени, так что стоять в дозоре не так уж плохо."
41060-56 = "Ситуация под полным контролем, Сенсей. Можете уходить."
41060-57 = "Угу, угу! Нет никаких проблем! Вообще! Ни единой!"
41060-58 = ""
41060-60 = ""
41060-61 = ""
41060-62 = "[ns] «Этот звук…»"
41060-63 = "Э-это был гром. Возможно, мы должны приготовиться к шторму."
41060-65 = "Саки! Твой живот нас всех выдал, дура."
41060-66 = "Я не могу это остановить, понятно?!"
41060-67 = "Хочу домой…"
41060-69 = "Как я и говорила, мы всем обеспечены."
41060-70 = ""
41060-72 = ""
41060-73 = "[ns] «...Это так?»"
41060-74 = "..."
41060-76 = "Вы когда-то слышали термин \"Голодная ярость\"? Это означает, что я злая, потому что я голодная!"
41060-77 = "В-видите ли, Сенсей…"
41060-78 = "Знаете что, ладно! Да! Мы не видели ни крошки еды со вчерашнего дня."
41060-80 = "Эта база построена на территории переделанного парка, и единственная вещь, которая здесь есть, - вода из питьевого фонтанчика."
41060-81 = "И нам совершенно негде запросить припасы."
41060-82 = "Эх. Мы должны были забрать еду из Академии SRT."
41060-83 = "И кто вообще вместо еды принёс зенитную установку? Мы можем съесть зенитную ракету? А?"
41060-84 = "Эй! Не лезь к моим ракетам только потому, что ты голодная."
41060-85 = "Они тоже важны! Подумай о блеске и очаровании БА-БАХОВ!"
41060-86 = "В любом случае, мисс Лицемерка, разве это не ты притащила кучу учебников? Почему ты не ешь бумагу?"
41060-87 = "К-Кощунство!"
41060-88 = "Мы всё ещё студенты SRT. Как преданные студенты вообще могли оставить свои учебники?"
41060-90 = "З-здесь есть несколько магазинов, но наши студенческие карты заблокировали, так что у нас совсем нет денег."
41060-91 = "И теперь мы остаёмся здесь, забытые и голодные. Будем медленно уходить в небытие…"
41060-92 = "Я хочу вернуться в корпус SRT... Это несправедливо."
41060-93 = ""
41060-96 = "[ns] Достать лапшу быстрого приготовления."
41060-97 = ""
41060-99 = ""
41060-100 = "Это..."
41060-101 = "Это лапша быстрого приготовления?!"
41060-102 = "Э-это рамен с курицей и соевым соусом от бренда Митошин! Обычно у меня слюнки так теку только от взрывчатки."
41060-103 = "[s9] «Я купил много разных вкусов.»\n[s10] «Здесь хватит на всех.»"
41060-104 = "Ну, если наш щедрый Сенсей так настаивает, чтобы мы взяли рамен, то что ещё остаётся делать такой маленькой девочке, как я?"
41060-105 = "Ну, если наш щедрый Сенсей так настаивает, чтобы мы взяли рамен, то что ещё остаётся делать такой маленькой девочке, как я?"
41060-107 = "Всем стоять."
41060-108 = "Я бы на вашем месте была осторожнее."
41060-109 = "Предоставлять вещи первой необходимости людям в трудном положении, чтобы потом требовать в обмен всё, что вздумается, - это древняя как мир тактика вымогательства."
41060-110 = "Мы не знаем, каковы мотивы Сенсея. Не нужно обманываться его показной добротой."
41060-111 = "[s] «Я действительно не хочу, чтобы вы умерли с голоду.»"
41060-112 = "Вы нас за дур держите, Сенсей?"
41060-113 = "Любой уважаемый себя оперативник знает, что во время миссии нельзя употреблять в пищу то, что ты не упаковал лично."
41060-114 = "Я никогда не приму Вашу еду с подвохом!"
41060-115 = "[s] Открыть лапшу быстрого приготовления."
41060-116 = ""
41060-119 = "Ч-что Вы делаете?"
41060-120 = "Вы же знаете, что мы всё равно не съедим ни единого кусочка!"
41060-121 = ""
41060-124 = "[ns] Залить кипятком и подождать три минуты."
41060-125 = ""
41060-137 = "Угх…"
41060-138 = "Это какой-то новый вид п-пыток?"
41060-139 = "[s11] «Какой хороший запах, да?»\n[s12] «А ведь она остывает прямо сейчас.»"
41060-142 = "Держитесь, отряд RABBIT! Вы же видите, какую хитрую тактику использует Сенсей, чтобы сломить нашу волю?"
41060-143 = "Уверена, Сенсей только и ждёт, пока мы клюнем на приманку, чтобы перейти в атаку!"
41060-144 = "В-верно!"
41060-145 = "Вы действительно думали, что сможете сломить мою волю дешёвой лапшой быстрого приготовления?"
41060-146 = "Если Вы собираетесь что-то вымогать, то наживка должна быть в сто раз вкуснее!"
41060-147 = "[s] «Если вы так желаете. Тогда мне больше достанется.»"
41060-148 = ""
41060-152 = ""
41060-153 = "С-Саки, я теряю концентрацию…"
41060-154 = "Разве ты не чувствуешь запах умами в этом наваристом бульоне? Каждый сёрб Сенсея сводит меня с ума!"
41060-155 = "Держись, Мое. Элита SRT не сломится из-за одной порции жалкой лапши."
41060-156 = ""
41060-158 = ""
41060-160 = "Внимание! Глубокий вдох, и сконцентрируйтесь!"
41060-161 = "Помните, как в академии мы учились противодействовать методам пыток с использованием нейролептических препаратов?"
41060-162 = "Запах рамена может быть сильным, но наша воля ещё сильнее!"
41060-163 = ""
41060-165 = ""
41060-167 = "Эта пытка ещё ужаснее, чем щекотка… Но я буду стараться изо всех сил."
41060-168 = "Мы никогда не предадим Академию SRT, Сенсей!"
41060-169 = ""
41060-172 = "[ns] Добавить яйцо."
41060-173 = "...!"
41060-175 = "Что это было? Это ведь яйцо?"
41060-176 = "Посмотрите на мягкую консистенцию желтка. Это может быть только оно."
41060-178 = "Густой, солёный бульон пропитывает едва схватившееся яйцо… делает это лакомство похожим на пудинг…"
41060-179 = "Со всеми этими добавками… даже эта дешёвая лапша быстрого приготовления…"
41060-180 = "…Должна быть невероятно вкусной!"
41060-181 = "[s] «...Хотите попробовать?»"
41060-182 = ""
41060-183 = "Да!"
41060-184 = "[s13] «Думаю, такой рамен есть в Валькирии.»\n[s14] «Я слышал, что в Валькирии есть рамен получше.»"
41060-185 = ""
41060-186 = ""
41060-188 = ""
41060-189 = "Так и знала. Как я и говорила, старое как мир вымогательство."
41060-190 = "Вот Вы и показали своё истинное лицо, злобный взрослый!"
41060-191 = "Согласна! Это было очень ж-жестоко с Вашей стороны, Сенсей…"
41060-193 = "А я-то думала, что это я тут сумасшедшая…"
41060-194 = "Повторюсь. Мы не намерены переводиться."
41060-195 = "Вы думали, что можете воспользоваться нашей ужасной ситуацией. Но мы останемся здесь - там, где сможем сохранить убеждения и справедливость, за которые мы всегда и боролись в Академии SRT."
41060-196 = "Бытовой комфорт никогда не заменит нам убеждений."
41060-197 = ""
41060-201 = "[ns] Передать адрес, написанный на листке."
41060-203 = "Что это?"
41060-204 = "[s15] «Вам же можно брать еду у кого угодно, кроме меня, верно?»\n[s16] «Идите по этому адресу, там вас бесплатно покормят.»"
41060-205 = "Вы предлагаете нам еду? Просто так, ничего не требуя взамен?"
41060-206 = "Вы предлагаете нам еду? Просто так, ничего не требуя взамен?"
41060-207 = "Я ясно дала Вам понять, Сенсей, что мы не те ученицы, которым нужна помощь."
41060-208 = ""
41060-210 = "(Внезапное изменение тактики Сенсея выглядит довольно подозрительно, но…)"
41060-211 = ""
41060-213 = "Понятно. Не думаю, что у нас есть другой выбор, кроме как согласиться."
41060-215 = "Так что… Спасибо Вам, Сенсей."
41060-220 = "Вы действительно верите, что у хитрого Сенсея не было злого умысла, когда он отправлял нас сюда?"
41060-221 = "М-может, наша убеждённость поколебала уверенность Сенсея."
41060-222 = "Ну вот опять, Мию. Ух, именно поэтому я тебя порой терпеть не могу. Ты действительно думаешь, что наши состроенные глазки и урчащие животики заставили кого-то вроде Сенсея подумать: \"Ой бедненькие, я обязан помочь этим бедняжкам из доброты душевной\"?"
41060-223 = "Не знаю. Сенсей выглядел вполне искренним, когда передавал нам записку."
41060-224 = "Возможно, он даже поможет нам вернуть SRT."
41060-226 = "Должно быть, это то самое место."
41060-227 = "Г-где еда? Саки, держи меня… Думаю, я сейчас упаду в обморок от голода."
41060-228 = "Погодите, разве не здесь офис Шале?"
41060-229 = "Тут же только старое оружие и хлам…"
41060-230 = ""
41060-232 = ""
41060-234 = "Они уже должны быть здесь."
41060-235 = ""
41060-238 = ""
41060-239 = "Привет, [USERNAME] Сенсей направил нас сюда."
41060-240 = "А, да! Рада, что вы смогли найти это место!"
41060-241 = "Я так счастлива, что Сенсей направил вас ко мне! Вы, должно быть…"
41060-242 = "…Специалисты по утилизации бенто!"
41060-243 = "С-специалисты по утилизации бенто?!"
41060-244 = "Да! Наш магазин не самый популярный, поэтому у нас всегда остаётся множество списанных продуктов с истекающим сроком годности."
41060-245 = "Обычно мне приходится избавляться от них самой, но это слишком сложная работа для одной такой маленькой меня."
41060-246 = "Так что, когда Сенсей сказал мне, что нашёл людей, которые придут и избавятся от них за меня, я была так счастлива! И вот вы уже здесь."
41060-247 = ""
41060-249 = ""
41060-251 = ""
41060-252 = ""
41060-253 = "..."
41060-255 = "О нет! Я вас обидела? О боже, вы не специалисты по утилизации?"
41060-256 = "Ой, нет! Это мы! Специалисты по утилизации бенто к вашим услугам!"
41060-257 = "Мы просто не были уверены, что пришли в подходящее место!"
41060-258 = "Ох, какое облегчение… Но в-ваши лица выглядят сейчас немного пугающе…"
41060-259 = "Потому что мы голодные!! *кхм* То есть, потому что мы очень усердно работаем, понимаешь? Хах! Ха-ха!"
41060-260 = "У тебя случайно не найдётся старого молока или напитков?"
41060-261 = "Ой, найдётся, конечно! Позвольте мне прямо сейчас всё принести!"
41060-262 = ""
41060-264 = ""
41060-267 = "Ты тупая, Мое? Возьмёшь еду с истекающим сроком?"
41060-268 = "Как ты могла пасть так низко?"
41060-269 = "Срок годности практически истёк, но ещё не до конца, поняла?! Что нам ещё делать, Мисс Превосходство?"
41060-270 = "Н-Но... Мы отряд RABBIT из Академии SRT! Элита из элит!"
41060-271 = "Ну, иди и строй из себя недотрогу где-нибудь в другом месте!"
41060-272 = "А я собираюсь насладиться каждым кусочком своего обеда."
41060-273 = ""
41060-275 = ""
41060-276 = "П-п-погоди! Я же не сказала, что не буду есть! Пожалуйста, Мое, оставь мне!"
41060-277 = ""
41060-279 = ""
41060-280 = ""
41060-283 = "Таков наш конец?"
41060-284 = "Неужели теперь такова наша жизнь? Клянчить еду, как бродячие псы, не знающие вкуса нормальной жизни…"
41060-285 = ""
41060-287 = ""
41060-289 = "[USERNAME] Сенсей..."
41060-290 = "Я никогда не забуду этого унижения. Никогда."
41060-292 = "Следующий эпизод;Операция \"Морковь\", часть 1"
