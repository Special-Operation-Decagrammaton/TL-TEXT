[translation]
41060-1 = "Episódio 6;Vamos Iniciar a Busca por Comida"
41060-2 = "(Na manhã seguinte, fui ao parque para conferir se todas estavam passando bem.)"
41060-4 = "Em frente ao Parque Kousagi"
41060-11 = "[ns1] \"Uaaah?!\"\n[ns2] \"U-Uma armadilha...?!\""
41060-16 = "...Ah, é o Sensei."
41060-17 = "Estava se mexendo de um jeito estranho, achei que fosse um suspeito ou um cachorro de rua."
41060-18 = "[s3] \"Cachorro de rua...?\"\n[s4] \"Armadilhas num parque são perigosas, não acha?!\""
41060-19 = "Não tem jeito, mesmo que diga isso."
41060-20 = "Não tem jeito, mesmo que diga isso."
41060-21 = "Para impedir invasores, precisamos fazer no mínimo isso."
41060-22 = "Ah, olha o Sensei aí."
41060-23 = "Melhor tomar cuidado onde pisa aí. Tem minas terrestres enterradas."
41060-24 = "[s5] \"Quêê?!\"\n[s6] \"Espera, espera, não posso dar nem um passo! Onde estão as minas?!\""
41060-25 = "Onde será que estavam... Esqueci o lugar exato."
41060-26 = "Onde será que estavam... Esqueci o lugar exato."
41060-27 = "Bom, se explodir, é porque estava ali."
41060-28 = "[s] \"Por que vocês ficam espalhando coisas tão perigosas assim...?!\""
41060-29 = "Perigoso nada, é o mínimo de autodefesa."
41060-30 = "Isso mesmo! Se duvidar, isso aqui ainda é pouco!"
41060-31 = "Se pudesse, eu queria colocar minas antitanque e todo tipo de armadilha ao redor do parque inteiro."
41060-32 = "[s] \"Não acha que isso é claramente exagero...?\""
41060-33 = "Em vigilância não existe \"exagero\". Temos que estar sempre totalmente preparadas."
41060-34 = "Se a gente baixar a guarda um pouquinho, vai que aquela policial parecida com um cachorrinho aparece de novo, né?"
41060-41 = "Saki, Moe,"
41060-42 = "Aconteceu algum problema?"
41060-43 = "Hii! Se-Se-Sensei...?!"
41060-44 = "...Bom dia."
41060-45 = "Precisa de alguma coisa tão cedo?"
41060-46 = "[s7] \"Fiquei pensando se vocês estavam bem.\"\n[s8] \"Estão precisando de alguma coisa?\""
41060-47 = "Como pode ver, não há problema algum."
41060-48 = "Como pode ver, não há problema algum."
41060-49 = "A Academia Especial SRT está acostumada com acampamentos."
41060-50 = "Para a SRT, isso é moleza."
41060-51 = "É o básico do nosso treinamento."
41060-53 = "Além disso, aqui tem água disponível, então está até bem confortável."
41060-54 = "Também tem bastante sombra e é fácil de se esconder..."
41060-56 = "Portanto, não precisa se preocupar."
41060-57 = "Não tem problema nenhum, então vai embora logo!"
41060-62 = "[ns] \"Esse som agora...\""
41060-63 = "...Talvez tenha trovoadas se aproximando."
41060-65 = "Essa não cola, né... Por que não conseguiu segurar...?"
41060-66 = "Não tem jeito, é uma reação fisiológica!"
41060-67 = "Uuu..."
41060-69 = "...Reforçando, não há problema algum, então—"
41060-73 = "[ns] \"...Sério mesmo?\""
41060-74 = "..."
41060-76 = "Aaah, ficar irritada só me deu ainda mais fome..."
41060-77 = "N-Na verdade..."
41060-78 = "Ah, quer saber, a gente não comeu nada! Algum problema?!"
41060-80 = "Temos água, mas, por outro lado, só temos água mesmo..."
41060-81 = "E não podemos contar com nenhum suprimento..."
41060-82 = "Droga, se eu soubesse que ia dar nisso, teria trazido comida da SRT..."
41060-83 = "Se era pra trazer um míssil antiaéreo, pensando bem, comida teria sido..."
41060-84 = "O que você tá falando? O míssil também é importante!"
41060-85 = "E acima de tudo, é lindo!"
41060-86 = "Mais importante, esse seu manual ridiculamente pesado é que é o problema, né? Devia ter jogado fora e colocado comida no lugar..."
41060-87 = "Idiota!"
41060-88 = "Como uma aluna poderia jogar fora o próprio manual?!"
41060-90 = "Mesmo se quiséssemos comprar numa loja, a conta da escola foi congelada..."
41060-91 = "Com certeza vamos acabar morrendo de fome assim..."
41060-92 = "Uuu, eu quero voltar para a SRT..."
41060-96 = "[ns] Tirar um lámen de copo da bolsa."
41060-100 = "A-Aquilo é..."
41060-101 = "...Lámen de copo?"
41060-102 = "Lámen de shoyu com caldo de frango da Misshin...! Meu favorito...!"
41060-103 = "[s9] \"Trouxe várias outras coisas também.\"\n[s10] \"Não querem comer comigo?\""
41060-104 = "...B-Bom? Se o Sensei faz tanta questão assim?"
41060-105 = "...B-Bom? Se o Sensei faz tanta questão assim?"
41060-107 = "...Esperem."
41060-108 = "Não podemos aceitar tão facilmente."
41060-109 = "Numa situação de aperto, fingir oferecer suprimentos vitais para depois exigir algo ainda mais valioso em troca..."
41060-110 = "É uma tática clássica. Não podemos aceitar sem saber as verdadeiras intenções."
41060-111 = "[s] \"Não, eu não quero nada em troca...\""
41060-112 = "Hah, acha mesmo que vamos acreditar nisso?"
41060-113 = "Durante uma operação, é regra básica não ingerir nada além do que nós mesmas trouxemos."
41060-114 = "Não vamos comer assim, sem mais nem menos, comida cuja segurança nem está garantida."
41060-115 = "[s] Abrir a tampa do lámen de copo."
41060-119 = "O quê...?!"
41060-120 = "Ei, eu já disse que não vamos comer!"
41060-124 = "[ns] Despejar água quente."
41060-137 = "Grr...!"
41060-138 = "Que cheiro bom... Fiquei com ainda mais fome..."
41060-139 = "[s11] \"Já que está pronto, que tal comer?\"\n[s12] \"Vai esfriar, viu?\""
41060-142 = "...Dispenso. É inútil tentar quebrar nossa determinação dessa maneira."
41060-143 = "Se cairmos uma vez, acabaremos presas nas armações do Sensei sem parar."
41060-144 = "N-"
41060-145 = "Não vou me render por causa de um simples lámen de copo!"
41060-146 = "B-Bom, se fosse para ser fisgada por um banquete de verdade, até vai..."
41060-147 = "[s] \"Então, com licença, vou começar...\""
41060-153 = "Ugh, guh...!"
41060-154 = "Que cheiro absurdamente bom...!"
41060-155 = "E-Eu não vou perder...!"
41060-160 = "É nessa hora que se respira fundo!!"
41060-161 = "A gente aprendeu isso na academia como contramedida contra tortura com drogas, lembra?!"
41060-162 = "Mesmo que o cérebro seja estimulado, se a vontade não quebrar, não há problema! Vamos enganar a mente de outro jeito!"
41060-167 = "Uuu, preciso aguentar..."
41060-168 = "Nós jamais cederemos à tortura...!"
41060-172 = "[ns] Colocar um ovo pochê."
41060-173 = "...Ah."
41060-175 = "Isso agora, por acaso foi..."
41060-176 = "Colocar ovo nessa altura do campeonato é golpe baixo..."
41060-178 = "Uuu, com certeza tá delicioso..."
41060-179 = "Fazendo isso, já não dá mais..."
41060-180 = "...Argh, não aguento mais!"
41060-181 = "[s] \"...Querem comer?\""
41060-183 = "Queremos!!"
41060-184 = "[s13] \"Aqui está. Aliás... realmente não tem chance de vocês irem para a Valkyrie?\"\n[s14] \"Pelo menos o problema da comida se resolveria por enquanto...\""
41060-189 = "Então realmente pretendia abalar nossa resistência para depois negociar."
41060-190 = "Mostrou sua verdadeira face, seu canalha."
41060-191 = "No fim das contas, este mundo é mesmo cruel..."
41060-193 = "Que método mais medonho de usar, hein..."
41060-194 = "Não importa o que faça, nossos sentimentos pela nossa academia não vão mudar."
41060-195 = "De fato estamos com fome e passando por dificuldades. Ainda assim, se não fizermos isso, não conseguiremos proteger nossas convicções."
41060-196 = "Não precisamos de uma vida confortável se o preço for abrir mão disso."
41060-201 = "[ns] Entregar o bilhete que trouxe."
41060-203 = "...O que é isso?"
41060-204 = "[s15] \"Se não querem algo que pareça caridade, pensei que talvez isso servisse.\"\n[s16] \"Pelo menos assim vocês conseguem comida sem que venha diretamente de mim.\""
41060-205 = "...Se formos até aqui, haverá alguma coisa?"
41060-206 = "...Se formos até aqui, haverá alguma coisa?"
41060-207 = "Já disse várias vezes que nada fará a gente mudar de ideia..."
41060-210 = "(O que será que está pensando de verdade...)"
41060-213 = "...Entendido. Não sei do que se trata, mas vou aceitar isto."
41060-215 = "Apenas aceitar, nada mais."
41060-220 = "O que o Sensei tá pensando de verdade...?"
41060-221 = "Será que o Sensei também está tentando entender a gente...?"
41060-222 = "Ingênua, Miyu. Se baixar a guarda fácil assim, vai acabar se dando mal, sabia?"
41060-223 = "Mas a expressão de agora há pouco era bem séria. Não parecia estar agindo de qualquer jeito."
41060-224 = "Quem sabe no futuro até nos ajude a reabrir a SRT..."
41060-226 = "O endereço anotado é aqui."
41060-227 = "Estou com tanta fome que não consigo dar nem mais um passo..."
41060-228 = "...Aqui não é o escritório da Schale?"
41060-229 = "Chamar a gente até aqui, pra quê...?"
41060-234 = "Ué, se não me engano já estava quase na hora...?"
41060-239 = "É... A gente veio por indicação do Sensei [USERNAME]."
41060-240 = "Ah, eu estava esperando por vocês...!"
41060-241 = "O Sensei já me contou tudo."
41060-242 = "Vocês vieram dar fim aos \"produtos para descarte\" no meu lugar, não é?!"
41060-243 = "...Hã?"
41060-244 = "Como quase não vem cliente aqui, sobram muitos produtos para descarte... É um desperdício, mas..."
41060-245 = "Toda vez tenho que colocar tudo em sacos de lixo orgânico para descartar, e isso dá bastante trabalho..."
41060-246 = "O Sensei me disse que vocês fariam isso no meu lugar...? Foi uma ajuda enorme. Já deixei tudo separado aqui."
41060-253 = "..."
41060-255 = "...U-Ué? Será que houve algum engano...?"
41060-256 = "Não, tá tudo certo, tudo certo!"
41060-257 = "Pode deixar o resto com a gente!"
41060-258 = "A-Ah, entendi. Hum... Não tem nada a ver com isso, mas vocês estão se sentindo bem? Estão com uma cara meio pálida..."
41060-259 = "É que a gente tá com fo— quer dizer, aconteceram umas coisas aí!"
41060-260 = "Tem mais alguma coisa vencida aí? A gente leva tudo."
41060-261 = "Ah, sim! Tem sim, esperem um pouquinho...!"
41060-267 = "Espera, espera, espera! Moe, isso está errado de vários jeitos!!"
41060-268 = "Pegar marmitas de descarte, isso é...!"
41060-269 = "Mas isso ia pro lixo, né? Ainda dá pra comer, seria um desperdício. E convenhamos, isso não parece \"caridade\"."
41060-270 = "M-Mas nós da SRT fazendo uma coisa dessas...!"
41060-271 = "Bom, se a Saki não quiser comer, por mim tudo bem."
41060-272 = "Eu como tudo com o maior prazer!"
41060-276 = "E-Eu não disse que não vou comer!"
41060-283 = "Snif, snif..."
41060-284 = "De agora em diante, vamos viver assim, pegando marmitas de descarte..."
41060-289 = "Sensei [USERNAME]..."
41060-290 = "Eu jamais vou esquecer esta humilhação..."
41060-292 = "Próximo;Operação Cenoura (1)"
