[translation]
1001815-1 = "Золотые воспоминания"
1001815-2 = "Я разговаривал с Юзу в Отделе разработки игр..."
1001815-3 = "Разговор о старой игровой статье перерос в разбор книжной полки... а потом и в уборку всей клубной комнаты."
1001815-5 = "Клубная комната Отдела разработки игр"
1001815-6 = "Уф, я всего лишь хотела найти старый обзор игры..."
1001815-7 = "А потом так увлеклась разбором этих коробок, что всё превратилось в утомительную генеральную уборку... Прости, что втянула тебя в такую скуку, Сенсей."
1001815-8 = "[s] «Всё нормально. Я всё равно не был занят.»"
1001815-9 = ""
1001815-12 = "[ns] «Ого. Здесь столько игровых картриджей...»"
1001815-13 = "Ну, это всё-таки комната Отдела разработки игр."
1001815-14 = "Мы собираем самые разные игры для вдохновения. Постоянные исследования — важная часть работы разработчика игр."
1001815-15 = "Хотя... большинство из них немного «ретро.» Они запускаются только на старых консолях."
1001815-16 = ""
1001815-18 = ""
1001815-20 = "[ns] «Хм, а это что...?»"
1001815-21 = "Что ты нашёл, Сенсей?"
1001815-22 = "[ns1] «На этом нет этикетки...»\n[ns2] «Это тоже диск с игрой?»"
1001815-25 = "М-Может быть... Я уже не очень помню..."
1001815-26 = "На коробке что-нибудь написано?"
1001815-27 = "[s] «Внизу написано... „Юзу“.»"
1001815-28 = "Ч-Ч-Ч-Что?! М-Моё имя...?! Моё?!"
1001815-29 = "К-Как... Я не помню, чтобы делала что-то такое..."
1001815-30 = "Погоди... Неужели это..."
1001815-31 = "[s3] «Ты тоже не знаешь, что это?»\n[s4] «Тогда давай вставим его в компьютер и...»"
1001815-34 = "П-Подожди! Сенсей!"
1001815-35 = "Э-Этот диск... Пожалуйста... дай мне самой его проверить."
1001815-36 = "[s] «Что-то не так?»"
1001815-37 = "Н-Ну... Скорее..."
1001815-38 = "...там могут быть личные и конфиденциальные материалы."
1001815-39 = "Уф... Почему именно ЭТО должно было всплыть, когда Сенсей здесь...?"
1001815-40 = ""
1001815-42 = ""
1001815-43 = "М-Мне правда очень жаль... Но не мог бы ты выйти в коридор, пока я загружу диск?"
1001815-44 = "[s] «А если я просто отвернусь?»"
1001815-45 = "Н-Нет! И уши тоже закрой, пожалуйста!"
1001815-48 = "Юзу вытолкала меня из клубной комнаты Отдела разработки игр."
1001815-50 = "Прошло около десяти минут..."
1001815-51 = "Эм, Сенсей..."
1001815-52 = "М-Можешь заходить..."
1001815-54 = "П-Прости за то, что было раньше. Я запаниковала..."
1001815-55 = "[s5] «Не извиняйся. Если это было личное...»\n[s6] «Тебе удалось посмотреть, что там?»"
1001815-58 = "Да. Ничего особенного там не было."
1001815-59 = "Ну... Может, ничего «особенного,» но это было «важно.»"
1001815-60 = "[s] «В смысле?»"
1001815-61 = "Это был... золотой мастер-диск прототипа Tales Saga Chronicle. Самой первой игры, которую я сделала."
1001815-62 = "О, ты не знаешь, что значит «золотой мастер»..."
1001815-63 = "Ах, прости. Я забыла объяснить."
1001815-64 = "Разработчики обычно называют мастер-диск с финальной версией продукта «золотым мастером.»"
1001815-65 = "Термин пришёл из музыкальной индустрии — продюсеры покрывали свои пластинки золотом ради долговечности... и гордости."
1001815-66 = "Сейчас это просто выражение. В общем, на этом диске находится финальная версия моей первой игры."
1001815-67 = "Конечно, сам диск не золотой. Сейчас так уже никто не делает... наверное."
1001815-68 = "На этом CD хранится прототип Tales Saga Chronicle... ещё до того, как мы выложили его в сеть."
1001815-69 = "Я так переживала и боялась, что засунула диск в коробку, лишь бы не думать о том, к чему эта игра привела."
1001815-70 = "Не могу поверить, что забыла об этом."
1001815-71 = "[s] «А сейчас ты в порядке?»"
1001815-72 = "Да, всё хорошо."
1001815-73 = "Во всяком случае, достаточно хорошо. Я так и не смогла до конца забыть... все отзывы и критику, которые принесла мне эта игра."
1001815-74 = "Но теперь у меня столько хороших воспоминаний, что они с лихвой перекрывают тот плохой период."
1001815-75 = "Если подумать, наш клуб вообще собрался только благодаря тому, что я выпустила этот прототип."
1001815-76 = "Если бы я тогда не попыталась... если бы не закончила эту игру, у меня не было бы такого светлого и прекрасного настоящего."
1001815-77 = "Поэтому... я... думаю, что справлюсь. Смогу встретиться с этим лицом к лицу. Всё хорошо."
1001815-78 = "[s7] «Да. Это очень дорогое воспоминание.»\n[s8] «Никогда не узнаешь, засияет ли драгоценный камень, пока не отполируешь его.»"
1001815-81 = "...Да. Это золотое... воспоминание, правда? Моё единственное и неповторимое."
1001815-82 = "Кстати, ты ведь никогда не играл в прототип Tales Saga Chronicle, да?"
1001815-83 = "Может быть... хочешь попробовать?"
1001815-84 = "[s] «Да! С удовольствием!»"
1001815-85 = "На этом компьютере может быть современный интернет, но привод для CD у него всё ещё есть... Давай вставим диск."
1001815-86 = ""
1001815-90 = "Х-Хаха... Он может быть не слишком хорошо оптимизирован. Загрузка займёт какое-то время."
1001815-91 = ""
1001815-94 = "О-Ошибка?! К-Как..."
1001815-95 = "«Предупреждение. Обнаружен повреждённый код. Критическое состояние системы: неизбежная перегрузка процессора.»"
1001815-96 = "«Анализ кода... Заключение: неоптимизированное вредоносное ПО неизвестного назначения.»"
1001815-97 = "«В целях безопасности компьютера код будет УНИЧТОЖЕН!»"
1001815-98 = "П-Пожалуйста, не удаляй мои воспоминания!"
1001815-100 = "Благодаря быстрой реакции Юзу удалось спасти свой диск от трагического удаления."
1001815-101 = "...Но прохождение прототипа Tales Saga Chronicle пришлось отложить на гораздо более поздний срок."
