[translation]
1300003-1 = "Ты мой Господин? Часть 2"
1300003-2 = "Исполнительный офис Шале"
1300003-3 = ""
1300003-4 = "Время Аканэ в Шале началось со взрыва."
1300003-5 = "Приятно познакомиться."
1300003-6 = "Аканэ из C&C."
1300003-7 = "Я здесь, чтобы служить тебе, Сенсей — прошу прощения. Господин."
1300003-8 = "Мне сообщили, что на этой миссии я буду под командованием Шале."
1300003-9 = "Как тебе, вероятно, известно, C&C состоит из лучших агентов Миллениума — нет, всего Кивотоса."
1300003-10 = "Мы предоставляем самые разные «услуги по уборке»..."
1300003-11 = "Например, очищаем Миллениум от проблемных элементов или убеждаем начальников, которые обирают работников, выплатить долги и покинуть город."
1300003-12 = "Это не так уж отличается от работы Шале, поэтому сюда и назначили агента моего уровня."
1300003-13 = "Полагаю, тебе нужны услуги каждого студента Кивотоса, верно?"
1300003-14 = "Мудрое решение. Агент Ноль-Три, Мурокаса Аканэ. Я к твоим услугам, Господин."
1300003-15 = "Какая сегодня миссия?"
1300003-16 = "Ликвидация? Ухаживание? Сбор разведданных? Война? Корпоративный шпионаж?"
1300003-17 = "[s1] «Для начала убери этот беспорядок.»\n[s2] «Может, начнём с задания по уборке...?»"
1300003-18 = "А, устранение цели. Хорошо. Можешь уточнить, кто именно?"
1300003-19 = "А, устранение цели. Хорошо. Можешь уточнить, кто именно?"
1300003-20 = "..."
1300003-21 = "Что, простите?"
1300003-22 = "Ты говорил... о настоящей уборке?!"
1300003-23 = "Хочешь, чтобы я подмела, вытерла пыль и всё разложила, пока комната не засияет?!"
1300003-24 = "Не могу поверить своим ушам. Я что, похожа на какую-то горничную?!"
1300003-25 = "..."
1300003-26 = "О."
1300003-27 = "*вздох* Прошу прощения. Иногда даже я забываю обо всех своих обязанностях."
1300003-28 = "Хорошо. Больше ни слова."
1300003-29 = "Я член C&C. Нет такой миссии по уборке, которую я не способна выполнить."
1300003-30 = "Цель уборки... твой рабочий кабинет?"
1300003-31 = "Придётся принести инструменты."
1300003-32 = "*шорох*"
1300003-33 = "[s] «Зачем ты достаёшь бомбу?»"
1300003-34 = "Потому что ничего эффективнее для уборки нет."
1300003-35 = "Не беспокойся, Господин. Когда я закончу, здесь не останется ни пылинки."
1300003-36 = "Хе-хе."
1300003-39 = "Шучу."
1300003-40 = "Если честно, я очень обрадовалась, когда меня сюда вызвали."
1300003-41 = "Поэтому решила немного подшутить над тобой, потому что смутилась из-за собственного энтузиазма."
1300003-42 = "Уборка и готовка — тоже мои сильные стороны. Особенно уборка."
1300003-43 = "Позволь показать, каково это — иметь рядом компетентную горничную."
1300003-44 = "Для начала починю потолок, который сама взорвала."
1300003-46 = "Аканэ без остановки убирала мой кабинет целый час."
1300003-48 = "Хех. Ну что теперь скажешь?"
1300003-49 = "Офис Шале больше, чем я ожидала. Его стоит поддерживать в чистоте."
1300003-50 = "Я начала с обследования... прошу прощения, с уборки комнаты, которую ты называешь своей."
1300003-51 = "Гигиена и чистота нужны не только ради внешнего вида."
1300003-52 = "Они необходимы и для здоровья, и для достоинства."
1300003-53 = "Смотри, Господин. Теперь этот кабинет достаточно чист, чтобы угодить даже самому придирчивому чистюле."
1300003-55 = "[ns] «Спасибо.»"
1300003-56 = "...?!"
1300003-57 = "..."
1300003-58 = "О... Прошу прощения."
1300003-59 = "Уже очень давно никто не благодарил меня."
1300003-60 = "Обычно они просто кричат что-нибудь вроде: «Проклятые горничные!» или «Они меня достали!»"
1300003-61 = "На их фоне ты действительно достоин того, чтобы тебе служить, Сенсей — нет, Господин."
1300003-62 = "На сегодня моя миссия завершена, но если тебе когда-нибудь понадобится помощь... можешь воспользоваться моими услугами."
1300003-63 = "Я буду служить тебе изо всех сил."
1300003-64 = ""
1300003-65 = "Ха-ха. Теперь, когда думаю об этом, это забавное воспоминание."
1300003-66 = "[s] «Кстати, зачем ты вообще вошла через потолок с бомбой?»"
1300003-67 = "Ах..."
1300003-68 = "Я хотела произвести незабываемое первое впечатление."
1300003-69 = "Это ведь было началом нашего времени вместе. Хи-хи."
1300003-70 = "И я всё ещё с нетерпением жду того, что будет дальше."
