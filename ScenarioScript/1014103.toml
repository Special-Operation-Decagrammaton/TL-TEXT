[translation]
1014103-1 = "Неожиданный подарок"
1014103-2 = "Офис Шале"
1014103-3 = ""
1014103-4 = "З-Здравствуйте, Сенсей."
1014103-5 = "И-Игуса Харука прибыла на службу..."
1014103-6 = "[s1] «Добро пожаловать, Харука.»\n[s2] «Я завариваю кофе. Хочешь?»"
1014103-9 = "Д-Драгоценный кофе, приготовленный руками Сенсея...?!"
1014103-10 = "А, к-кстати, я тоже кое-что принесла!"
1014103-11 = "Эм... Это подношение для вас, Сенсей..."
1014103-12 = "[s] «Подношение?!»"
1014103-13 = "Да, п-пожалуйста, возьмите!"
1014103-14 = ""
1014103-16 = ""
1014103-19 = "Харука протянула мне обычную картонную коробку среднего размера."
1014103-21 = "Эм... Вам вроде понравилось в прошлый раз, Сенсей..."
1014103-22 = "Поэтому я упаковала это в коробку... и принесла..."
1014103-23 = "[s] «Что-то... что мне понравилось...?»"
1014103-24 = ""
1014103-25 = "Я вообще не понимал, о чём она говорит, но всё же открыл коробку."
1014103-26 = ""
1014103-27 = "И с удивлением увидел..."
1014103-28 = ""
1014103-30 = ""
1014103-31 = "[ns] «...Платье?»"
1014103-32 = ""
1014103-33 = "Внутри аккуратно лежало сложенное платье, которое Харука носила в прошлый раз."
1014103-34 = "Да, эм, когда мы встретились у входа на выставку..."
1014103-35 = "Вы сказали, что платье красивое!"
1014103-36 = "П-Поэтому я его принесла!"
1014103-37 = "И-и я уверена, что на вас оно тоже будет отлично смотреться, Сенсей!"
1014103-38 = "[s] «На мне?!»"
1014103-39 = "Да! П-Пожалуйста, носите когда захотите!"
1014103-40 = "[s] «Ты хочешь, чтобы я его НОСИЛ?!»"
1014103-41 = "И не переживайте!"
1014103-42 = "Я убедилась, что на нём не осталось ни моего запаха, ни грязи! Сдала в химчистку, потом постирала, потом снова в химчистку, а потом погладила!"
1014103-43 = "П-Постойте... Я сейчас веду себя грубо?!"
1014103-44 = "Не верится, я подарила вам вещь, которую уже носила! Нужно было купить новую!"
1014103-45 = "Вообще-то я пыталась! Но обыскала все рынки и универмаги Кивотоса и нигде не нашла точно такое же!"
1014103-46 = "Даже в магазине, где я его купила, больше не было..."
1014103-47 = "Поэтому я подумала, что могу просто отдать своё... Какая же я дура! Дура!"
1014103-48 = "П-Простите! Если вам не нужны мои грязные тряпки, я любой ценой достану новое! Я разграблю весь Чёрный рынок!"
1014103-49 = "[s3] «Нет-нет-нет!»\n[s4] «Я вообще изначально не говорил, что ПЛАТЬЕ красивое!»"
1014103-52 = "Э...?"
1014103-53 = "В-вот как...?"
1014103-54 = "Мне казалось, я именно это услышала..."
1014103-55 = "Я-я схожу с ума?! Может, у меня были галлюцинации...?!"
1014103-56 = "[s] «Нет, ты просто перепутала, о ком шла речь.»"
1014103-57 = ""
1014103-60 = "[ns] «ТЫ была красивой в этом платье, Харука.»"
1014103-61 = "..."
1014103-62 = "Э-Э-Э-Э-Э?!"
1014103-63 = "Э-Это..."
1014103-64 = "Я... красивая..."
1014103-65 = ""
1014103-67 = ""
1014103-68 = ""
1014103-70 = ""
1014103-71 = "Я когда-то слышала, что если сделать вот так, можно проснуться от сна..."
1014103-72 = ""
1014103-74 = ""
1014103-75 = "[ns] «С-Стой!!»"
1014103-76 = ""
1014103-78 = "Понадобилось время, но мне наконец удалось успокоить Харуку."
1014103-79 = "После этого я вернул ей коробку."
1014103-81 = ""
1014103-82 = "[ns] «Если не веришь мне, посмотри сама.»"
1014103-83 = "А? П-Прямо сейчас...?"
1014103-84 = "Я-я очень нервничаю..."
1014103-85 = "Но если вы хотите... Хорошо. Я сейчас вернусь."
1014103-86 = ""
1014103-88 = ""
1014103-93 = "A little bit later..."
1014103-94 = ""
1014103-100 = ""
1014103-101 = "Эм... Я переоделась в платье..."
1014103-102 = "А?! Это зеркало в полный рост...? Когда оно здесь появилось...?!"
1014103-103 = "[s] «Неважно. Посмотри. Что думаешь?»"
1014103-104 = "Д-Даже если вы спрашиваете..."
1014103-105 = "Эм..."
1014103-106 = "Ух-х-х-х...!"
1014103-107 = "Уа-а-а-а...!"
1014103-108 = ""
1014103-110 = ""
1014103-112 = "Харука выбежала из офиса, красная как помидор..."
