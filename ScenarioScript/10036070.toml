[translation]
10036070-1 = "Эпизод 7;Она идёт"
10036070-2 = ""
10036070-3 = "Ай! Можно аккуратнее?! Меня там два раза подстрелили!"
10036070-4 = "Я не могу наносить мазь ещё мягче. Хватит драматизировать!"
10036070-5 = "Чёрт... Только посмотрите на нас."
10036070-6 = "Мы даже близко к сцене не подошли. Какая-то неизвестная девчонка из Банды шлемов просто избила нас всех."
10036070-7 = "Ага. Вроде была далеко, а я моргнула — и она уже прямо передо мной."
10036070-8 = "Угх, она что, призрак...? С такими навыками могла бы найти место получше Банды шлемов—"
10036070-9 = "Эй, заткнись!"
10036070-10 = "Да, Банда шлемов отстой, но они нас победили, значит, мы ещё хуже! Столько планировали и даже вечеринку сорвать не смогли..."
10036070-11 = "Это не наша вина!"
10036070-12 = "Wait..."
10036070-13 = "...Ага, мы все выложились на сто процентов, потому что думали, что план сработает."
10036070-14 = "Если ничего не вышло, виновата планировщица, а не мы!"
10036070-15 = "Тогда..."
10036070-16 = "Да, профессорша-умница! Это всё она виновата!"
10036070-17 = "Давайте снова ей позвоним!"
10036070-18 = ""
10036070-23 = ""
10036070-24 = "Здравствуйте. Звоните, чтобы пригласить меня на победный тост?"
10036070-26 = "Серьёзно?!"
10036070-27 = "Давайте начистоту, профессор. Вы ведь специально составили этот план так, чтобы нас подставить, да?"
10036070-28 = "Нас избили и разгромили ещё до того, как мы вообще смогли туда попасть!"
10036070-30 = "Что? Это невозможно."
10036070-31 = "Я безупречно рассчитала ваши силы и силы Банды Шлемов. Как ни посмотри на цифры, вы должны были победить."
10036070-33 = "Ага, прямо как с тем планом похищения! НИ ОДИН ваш план не работает!"
10036070-35 = "Хм. Не могли бы вы рассказать подробнее?"
10036070-36 = ""
10036070-37 = "...А, понятно. Вторая неудача. Как прискорбно."
10036070-39 = "Ага? И когда уже мы начнём получать хоть что-то за свои деньги?"
10036070-40 = "Серьёзно, вы вообще знаете, сколько мы на это копили?"
10036070-41 = "Скольких людей нам пришлось трясти?!"
10036070-43 = "Значит, оба раза вас перехватили и сорвали ваши планы..."
10036070-44 = "...даже когда защита противника была слабее всего..."
10036070-45 = "Любопытно."
10036070-47 = "Что тут такого «любопытного»? И что вы собираетесь с этим делать? Вы всё это время вели нас не туда!"
10036070-49 = "Тихо, дилетанты."
10036070-51 = "Ч-Что вы сейчас сказали?!"
10036070-52 = "Всё, хватит! Где вы?! Я сначала отделаю вас, А ПОТОМ разберусь с Бандой Шлемов!"
10036070-54 = "Ну-ну. Давайте успокоимся."
10036070-55 = "Одно ясно, и нам стоит это признать."
10036070-56 = "На другой стороне доски у нас достойный противник."
10036070-57 = "Соперник мне под стать — по крайней мере, в дебюте."
10036070-58 = "Но до эндшпиля ещё далеко."
10036070-59 = "А теперь слушайте внимательно..."
10036070-61 = "Хм?"
10036070-63 = "Эм, внимание всем! Официальное объявление фестиваля Банды Шлемов!"
10036070-64 = "Из-за затянувшейся подготовки к концерту диджея начало переносится с пяти на шесть."
10036070-65 = "Э-э, простите. Но ожидание того стоит!"
10036070-66 = "...Думаешь, это из-за нашей засады?"
10036070-67 = ""
10036070-68 = "Именно. Отличная работа. Вы задержали главное событие на целый час."
10036070-70 = "Погодите, это и был ваш план?"
10036070-71 = "Хотите сказать, вы и ЭТО тоже предусмотрели?!"
10036070-73 = "Ну, возможно. Ход битвы нередко меняют неожиданности. Прихоти, ошибки и упрямство."
10036070-74 = "И здесь это даже к лучшему. Благодаря вашим стараниям концерт отложили, и теперь месть совсем близко."
10036070-75 = "Точнее, месть будет в «её» руках, а не в ваших."
10036070-76 = "В «её» руках...?"
10036070-77 = ""
10036070-79 = ""
10036070-80 = ""
10036070-81 = "Похоже, её приготовления опередили наши методы."
10036070-82 = "Боюсь, для... ваших конкретных фигур выигрышного эндшпиля не существует."
10036070-83 = "Сдаться или доиграть до конца — решать вам. На этом моя консультация окончена."
10036070-84 = "Ну а теперь..."
10036070-85 = ""
10036070-87 = ""
10036070-88 = ""
10036070-91 = "...О чём она вообще говорила?"
10036070-92 = "Не знаю..."
10036070-93 = "Нас уже изрядно потрепали. Мы мало что ещё можем сделать."
10036070-94 = "Даже профессорша-умница больше не думает, что мы победим. Давайте на этом закончим."
10036070-95 = "К тому же, если мы снова встретим ту гангстершу из Банды Шлемов, она нам наваляет—"
10036070-96 = ""
10036070-98 = ""
10036070-99 = "Как вам не стыдно!!"
10036070-100 = "Я в вас разочарована! Проиграть — одно, но потерять волю к борьбе?!"
10036070-101 = "Думаете, Старшая сестрёнка хотела бы, чтобы вы сейчас сдались?"
10036070-102 = "Вспомните, какая она сильная, какая надёжная! Как далеко она нас привела!"
10036070-103 = "*глубокий вдох*"
10036070-104 = ""
10036070-106 = ""
10036070-107 = ""
10036070-108 = "Кто мы такие? Мы хулиганы! Мы заставляем плакать грустных детей, а тех, кто уже плачет, заставляем плакать ещё сильнее!"
10036070-109 = "Кто отомстит за нашу Старшую сестрёнку, если не мы?!"
10036070-110 = "Нам больше не нужны ни эта профессорша, ни кто-либо ещё!"
10036070-111 = "Мы сами по себе! Как и всегда!"
10036070-112 = "Ага!"
10036070-113 = "Если можете идти — за мной!"
10036070-114 = "Мы идём к концертной сцене и устроим там лучшую засаду в нашей жизни!"
10036070-116 = ""
10036070-117 = "Так, до начала двадцать минут! Все места уже заняты."
10036070-118 = "Мы отстаём от графика, так что шевелимся!"
10036070-119 = "Хорошо!"
10036070-120 = "Микрофоны — есть! Колонки — есть! Отлично!"
10036070-121 = "Финальная проверка звука начнётся через минуту!"
10036070-122 = "Поняла."
10036070-124 = "Ого! Мисс подработчица!"
10036070-125 = "Я пришла выполнить свою часть работы."
10036070-126 = "Н-Не обязательно! Можешь отдохнуть...!"
10036070-127 = "Нет, у меня здесь задание. Я не могу просто сидеть без дела. Что нужно сделать?"
10036070-128 = "Осталось только проверить вертушку и протестировать колонки."
10036070-129 = "Поняла. Оставь это мне."
10036070-130 = "Т-Тогда оставляю!"
10036070-131 = ""
10036070-133 = ""
10036070-134 = ""
10036070-135 = "[ns] «Эй, Саори.»"
10036070-136 = "Хм? А, Сенсей. Как раз вовремя. Шоу вот-вот начнётся."
10036070-137 = "«Дети» тоже пришли на концерт? Мм, спасибо, что помогли им сюда добраться."
10036070-138 = "Мне осталось провести всего одну последнюю проверку звука..."
10036070-139 = "[s] «Давай я помогу.»"
10036070-140 = "Я так и знала, что вы это скажете, Сенсей."
10036070-141 = "Поднимайтесь за мной на сцену."
10036070-143 = "Ух ты! Я впервые на концерте диджея. Наверняка будет отпад."
10036070-144 = "Ага, там всё время будет такой мощный, громкий драйв!"
10036070-145 = "От этих битов тут всё затрясётся!"
10036070-146 = ""
10036070-147 = "...Так много людей."
10036070-148 = "[s3] «Все любят концерты.»\n[s4] «Похоже, все места заняты.»"
10036070-151 = "Знаете, я весь день то поднимаюсь на эту сцену, то спускаюсь с неё..."
10036070-152 = "...но сейчас всё ощущается СОВСЕМ иначе."
10036070-153 = "Для меня это новый опыт."
10036070-154 = "Не думаю, что когда-либо раньше испытывала такое."
10036070-155 = "Ощущение... странное."
10036070-157 = ""
10036070-158 = "Хи-хи, хорошо, что мы пришли пораньше."
10036070-159 = "Лучшие места во всём зале, прямо по центру."
10036070-160 = "Мне не очень нравится толкаться среди всей этой толпы..."
10036070-161 = "В журнале, который я читала, говорилось, что концерты диджеев — всегда лучшая часть таких фестивалей!"
10036070-162 = "Чем больше ты веселишься, тем популярнее становишься у толпы!"
10036070-163 = "И зачем тебе вообще быть популярной среди гангстеров Банды Шлемов...?"
10036070-164 = ""
10036070-166 = ""
10036070-167 = "О, посмотрите наверх. Наверное, они проводят последнюю проверку."
10036070-168 = "И Сао-Сао там, как и ожидалось."
10036070-169 = "П-Правда? Где? Где она?"
10036070-170 = ""
10036070-172 = ""
10036070-174 = "Постой, Хиёри... Если ты так подпрыгнешь, она может тебя заметить—"
10036070-175 = ""
10036070-177 = ""
10036070-178 = "Стоп. Кто-нибудь ещё это слышал?"
10036070-179 = "Что? Ч-Что слышал?"
10036070-180 = ""
10036070-182 = ""
10036070-184 = "ВПЕРЁД, МОЧИ ИХ!"
10036070-185 = "Получайте, Банда Шлемов! Давайте!"
10036070-186 = ""
10036070-192 = ""
10036070-193 = ""
10036070-194 = "П-Погодите, что? Хулиганы?! Как?!"
10036070-195 = "Угх! Они нападают! Открыть ответный огонь!"
10036070-197 = "Это за Старшую сестрёнку, мелкие засранки!!"
10036070-198 = ""
10036070-203 = ""
10036070-204 = "Угх..."
10036070-205 = "Что это вообще было?"
10036070-206 = "Полезть в драку с такой толпой..."
10036070-207 = "Чего они вообще пытались добиться?"
10036070-209 = "Тц...! Даже наша последняя атака... оказалась напрасной...!"
10036070-210 = "Значит, вот и всё..."
10036070-211 = "Это была... месть... за Старшую сестрёнку...!"
10036070-212 = ""
10036070-214 = ""
10036070-216 = ""
10036070-217 = ""
10036070-218 = "Чёрт, да что с ними вообще?"
10036070-219 = "Хотела бы я знать. Они просто хотели устроить хаос? Поэтому и пытались похитить диджея?"
10036070-220 = ""
10036070-222 = ""
10036070-223 = "...Стоп."
10036070-225 = "Ацуко, Хиёри, пригнитесь!"
10036070-226 = ""
10036070-230 = "Кья?!"
10036070-231 = "Чего-о-о?!"
10036070-232 = ""
10036070-235 = "Угх! Ч-Что это было, снаряд?!"
10036070-236 = "Что произошло?! Что происходит?!"
10036070-238 = "*кашель* *кашель* Они притащили миномёты, или ракетницы, или..."
10036070-239 = "*кашель* Нет, у нас ничего такого нет..."
10036070-240 = "Тогда что же это...?"
10036070-241 = ""
10036070-242 = "[ns] «П-Погодите, это...?!»"
10036070-243 = ""
10036070-244 = "Давненько не виделись, Банда Шлемов. Как поживаете?"
10036070-245 = "Я каждый день о вас беспокоилась. Как вы на самом деле?"
10036070-246 = "Вы ели сбалансированный завтрак? Жили полной жизнью?"
10036070-247 = "Мне было бы очень жаль услышать, что нет. Я так ждала дня нашей новой встречи."
10036070-248 = "Дня, когда смогу подарить вам... Всем вам... Таким ярким, беспокойным и безрассудным..."
10036070-249 = ""
10036070-251 = ""
10036070-252 = "...месть собственными руками!!"
