[translation]
80000135-1 = "Сладкое и твёрдое"
80000135-2 = "Офис Шале"
80000135-4 = "Здравствуйте, Сенсей!"
80000135-5 = "Я принесла вам эксклюзивный товар премиум-класса!"
80000135-6 = "[s] «...Ты возвращаешься со сделки?»"
80000135-7 = "Вообще-то да. Я забирала кое-что по заказу клиентов из Вайлдхант."
80000135-8 = "Но сегодняшняя сделка была простой. Нужно было забрать всего один товар."
80000135-9 = "Хотите посмотреть, Сенсей?"
80000135-10 = ""
80000135-12 = ""
80000135-15 = "Не дожидаясь ответа, Фую открыла сумку и показала содержимое."
80000135-16 = "Внутри лежало несколько больших шаров в индивидуальной упаковке."
80000135-17 = "[ns] «Это...?»"
80000135-18 = "Фу-фу, как видите, это..."
80000135-19 = "[s] «Бомбы?»"
80000135-20 = "Да, ЛУЧШИЕ бом—"
80000135-21 = "Нет! Конфеты! Это конфеты!"
80000135-22 = "За кого вы вообще принимаете Картель свободной торговли, Сенсей?!"
80000135-23 = "Бомбы не настолько прибыльны, как вы думаете! И заказы на них бывают редко."
80000135-24 = "[s] «А, так причина в этом...?»"
80000135-25 = "Ага. Даже младенец может сделать самодельную бомбу. Нужны только гранаты и мамин запас пороха на экстренный случай."
80000135-26 = "[s] «Тогда... почему эти конфеты запрещены?»"
80000135-27 = "Эти конфеты называются «сломай-челюсть»."
80000135-28 = "Они простые и, очевидно, на 99% состоят из слоёв сахара..."
80000135-29 = "Но самое главное в них — фирменная «твёрдость»."
80000135-30 = "Слои расплавленного сахара очень плотно спрессовывают друг с другом, поэтому конфета получается невероятно твёрдой и ею легко подавиться."
80000135-31 = "...И ИМЕННО поэтому их внесли в список запрещённых."
80000135-32 = "[s] «А...?»"
80000135-33 = "Несколько студентов откололи об них зубы. Жёсткая штука."
80000135-34 = "Поэтому Префектурный совет, естественно, решил, что никому нельзя их иметь."
80000135-35 = "[s] «О...»"
80000135-36 = "И всё же спрос есть. Художники, писатели и даже некоторые музыканты их любят. Такие конфеты долго не заканчиваются и дают чем занять рот во время работы."
80000135-37 = "Благодаря этому мы неплохо зарабатываем... А, но сейчас не об этом."
80000135-38 = ""
80000135-40 = ""
80000135-41 = ""
80000135-42 = "Вот, Сенсей."
80000135-43 = ""
80000135-44 = "Фую протянула мне конфету заметно больше остальных..."
80000135-45 = "Она была больше бейсбольного мяча!"
80000135-46 = ""
80000135-47 = "[ns] «Это...?»"
80000135-48 = "Я же сказала. Пришла доставить вам качественный товар."
80000135-49 = "Это ограниченная серия огромной шоколадной конфеты «сломай-челюсть», Сенсей."
80000135-50 = "Сегодня ведь Д-День святого Валентина... П-Правда?"
80000135-51 = "[s] «Ого, спасибо, Фую!»"
80000135-52 = "...Хи-хи."
80000135-53 = "[s1] «Но если он такой большой... Сначала придётся его разбить?»\n[s2] «Куда я положил молоток...?»"
80000135-56 = "А, не надо, Сенсей. Давайте проще."
80000135-57 = ""
80000135-59 = ""
80000135-60 = "[ns] «...Твой пистолет?»"
80000135-62 = "Бах!"
80000135-66 = "Вот, можете приступать, Сенсей!"
80000135-67 = "[s] «С-Спасибо!»"
80000135-68 = ""
80000135-69 = "Я положил кусочек конфеты в рот..."
80000135-70 = "...и он оказался гораздо вкуснее, чем я представлял."
80000135-71 = "[ns] «Вкусно...!»"
80000135-72 = "Правда? Правда?"
80000135-73 = "Они постарались по полной. Я же говорила — эксклюзивная, ремесленная, ограниченная серия!"
80000135-74 = "[s] «Вот. И ты попробуй кусочек, Фую.»"
80000135-75 = ""
80000135-77 = ""
80000135-78 = ""
80000135-79 = "О...! Д-Да...!"
80000135-80 = ""
80000135-81 = "...Вы правы. Для такой твёрдой конфеты шоколадный вкус очень насыщенный."
80000135-82 = "[s] «И она такая твёрдая, что хватит надолго.»"
80000135-83 = "Да. Она часами будет оставаться сладкой и не закончится."
80000135-84 = "...Будет чем заняться, пока вы продолжаете думать обо мне."
80000135-85 = ""
80000135-87 = ""
80000135-88 = "А, ой, знаете что? Мне надо... Уже поздно. Я пошла!"
80000135-89 = ""
80000135-91 = ""
80000135-94 = ""
80000135-95 = "Угх..."
80000135-96 = "Я, должно быть, совсем спятила!"
80000135-97 = "«Продолжаете думать обо мне»... Не верю, что я это сказала! Будто такая крутая. Как же стыдно!"
80000135-98 = "Н-Но всё же... всё же..."
80000135-99 = "М-Может, это... сработало?"
80000135-100 = ""
80000135-102 = ""
80000135-103 = "Н-Не знаю!"
