[translation]
51210-1 = "Episódio 21;Mesmo Assim, Para Você"
51210-3 = "Haaah!"
51210-15 = "Conseguimos dar conta dos peixes pequenos, mas ainda assim..."
51210-23 = "[ns] \"Os ataques não surtem efeito no Kurokage, né.\""
51210-24 = "Talvez esteja tentando se reorganizar, pois também se acalmou por lá, mas..."
51210-25 = "Não dá pra saber quando vai atacar de novo~"
51210-26 = "Desse jeito, não vamos conseguir ir atrás daquela garota de antes!"
51210-27 = "Uwaaah! O que a gente faz~~?!"
51210-29 = "Se continuarmos assim, a Yukari vai..."
51210-30 = "Não pode ser, temos que encontrar um jeito de qualquer maneira...!"
51210-31 = "Ei, Kikyou?!"
51210-32 = "......"
51210-38 = "[ns] \"Nagusa.\""
51210-42 = "[ns1] \"Entendi que a Shuro está atrás da Yukari, e...\"\n[ns2] \"Que toda essa situação foi parte de um plano.\""
51210-45 = "[ns] \"Pode me dizer o que significa criar uma 'Hyakumonogatari'?\""
51210-47 = "[ns] \"O que a Shuro... pretende fazer com a Yukari?\""
51210-48 = "Isso é..."
51210-49 = "Não é hora de ficar enrolando..."
51210-50 = "Não devíamos salvar a Yukari primeiro?!"
51210-52 = "Nagusa-senpai, você disse \"assim como foi com a Ayame\", não foi?"
51210-56 = "Kikyou...?"
51210-61 = "Renge, informação é fundamental.#nÉ frustrante, mas como ela disse, nós não sabemos de nada."
51210-62 = "O que é certo, como devemos lidar com isso... nada."
51210-63 = "Sem informações, não podemos tomar decisões."
51210-64 = "É por isso que o Sensei está perguntando, não é?#nA única pessoa aqui que tem essas informações agora é a Nagusa-senpai."
51210-66 = "Só eu..."
51210-67 = "Então nos diga.#nQual é o objetivo dela... e o que nós devemos fazer."
51210-68 = "A única que sabe disso, Nagusa-senpai... é você."
51210-72 = "........."
51210-73 = "...Entendi."
51210-74 = "Mesmo numa situação dessas, nós..."
51210-75 = "O Clube Beleza da Natureza..."
51210-80 = "Nagusa-senpai...?"
51210-86 = "Há muito tempo... antes mesmo de Hyakkiyako se tornar uma aliança, havia um bando de espíritos malignos... que espalhava o caos."
51210-87 = "É a elas que esse nome se refere..."
51210-88 = "[ns3] \"'Um clube hediondo que se recusa a reconhecer a forma atual da Aliança Hyakkiyako',\"\n[ns4] \"'espíritos malignos que manipulam livros misteriosos para enganar as pessoas'... era isso?\""
51210-91 = "...Sim."
51210-92 = "Não sei o motivo nem o objetivo... mas os meios definitivamente existem."
51210-93 = "Usando um livro misterioso chamado \"Ino Mononoke Roku\", pelo próprio deleite...#npela própria \"elegância\"... elas tentam criar histórias de terror chamadas \"Hyakumonogatari\"."
51210-94 = "Na verdade, nos Grandes Campos de Neve aonde eu fui, a presidente do Clube Beleza da Natureza, Kokuriko... fez a Ayame..."
51210-95 = "...transformou ela em uma \"Hyakumonogatari\" e a levou para além do \"Crepúsculo\"."
51210-101 = "Eu só pude ficar assistindo... completamente impotente..."
51210-103 = "A Presidente Ayame, então..."
51210-104 = "..."
51210-106 = "Se o que a Shuro disse for verdade, acho que desta vez o alvo é a Yukari."
51210-107 = "Desse jeito, a Yukari também vai acabar como a Ayame..."
51210-108 = "Por que... por que você não nos contou nada?"
51210-109 = "Eu estava com medo... medo de contar a verdade."
51210-116 = "...Nagusa-senpai."
51210-124 = "O quê?! Quem está aí?!"
51210-126 = "Alô, alô — meus caros, conseguem me ver?"
51210-130 = "Ah, Sensei! Ali...!"
51210-138 = "Ahaha! Estão se divertindo no festival~?"
51210-139 = "Estão se divertindo bastante, não estão...?"
51210-140 = "Afinal, nós demos o nosso melhor e preparamos tudo isso só para entreter vocês."
51210-144 = "Aquele é o dirigível de transmissão do Clube Yin-Yang..."
51210-145 = "Também está sendo transmitido ao vivo pela internet...!"
51210-146 = "O quê?! C-como?!#nEla consegue fazer até isso?!"
51210-147 = "[s] \"É o que a Shizuko tinha preparado para o festival...\""
51210-148 = "Mas por que fazer uma transmissão..."
51210-150 = "Ahaha, mas não foi só isso que eu preparei, sabe?"
51210-151 = "Tenho uma convidada especial que gostaria muito de apresentar a vocês!"
51210-155 = "Alguns de vocês já devem conhecê-la — neste festival recriado após 20 anos, \"aquela\" pessoa em quem todos vocês depositam tantas expectativas!"
51210-164 = "[ns] \"Yukari...!\""
51210-165 = "Ahaha! Conseguem ver be~m direitinho?"
51210-166 = "Bom, eu preparei tudo para isso, né?#nÉ claro que dá para ver bem."
51210-167 = "Apresento a vocês a protagonista desta história!"
51210-169 = "......"
51210-171 = "Agora ela está em silêncio absoluto como a Bela Adormecida, mas eu sei muito bem."
51210-172 = "Essa sacerdotisa... guarda no peito uma ferida maior do que qualquer outra pessoa, não é mesmo?"
51210-175 = "Quem ela admirava nunca sequer olhou para ela—"
51210-178 = "—quando implorou para que tudo voltasse a ser como antes, foi descartada como algo sem sentido."
51210-180 = "Quando gritou que queria voltar, foi rejeitada sob a desculpa de que tinha outro lugar para onde ir—"
51210-182 = "E então a senhorita sacerdotisa finalmente voltou para o seu próprio lugar... sim, bem aqui!"
51210-184 = "Contudo, porém, que pena...#nNaquele que ela achava ser o único lugar ao qual pertencia, tudo o que exigiram dela foi—"
51210-185 = "Apagar a desonra de 20 anos atrás — apenas isso."
51210-186 = "......"
51210-187 = "Pois é. Ninguém se importa nem um pouco com os sentimentos da senhorita sacerdotisa."
51210-188 = "Ah! Ah! Que dó...#nEm um festival onde todos deveriam estar sorrindo, ela está sozinha, afogada em tristeza."
51210-189 = "...Não é frustrante?"
51210-190 = "Se é para sofrer carregando esse sentimento sozinha...#nnão seria muito melhor fazer todo mundo carregar isso junto?"
51210-194 = "Por isso, eu vou emprestar a minha voz no seu lugar.#nNo seu lugar, vou devolver todos esses sentimentos a eles!"
51210-195 = "Pois bem, o que começa agora é a elegância do nosso Clube Beleza da Natureza—"
51210-196 = "De forma bela, fascinante e deslumbrante, vamos reduzir Hyakkiyako a cinzas!"
51210-197 = "Aguardem ansiosamente, meus caros! Ahahaha!"
51210-204 = "[ns] \"Yukari...!\""
51210-206 = "Ela disse que vai queimar Hyakkiyako."
51210-207 = "Se não a detivermos rápido... a situação vai ficar ainda pior do que já está."
51210-208 = "P-precisamos ir logo...!"
51210-213 = "[ns] \"O Kurokage começou a se mexer...!\""
51210-214 = "Droga...!"
51210-215 = "O que a gente faz contra uma coisa em que os ataques nem pegam?!"
51210-216 = "Aliás, mesmo que a gente dê um jeito nisso aqui...#ncomo vamos derrotar aquela garota se tiros não funcionam nela?!"
51210-217 = "...Existe um jeito."
51210-221 = "Kikyou, é sério...?!"
51210-225 = "[ns] \"Essa é... a arma da Presidente da Hyakkaryouran...?\""
51210-230 = "Sim. Nagusa-senpai... a \"Hyakuren\" que você deixou comigo."
51210-231 = "Se o que a Shuro disse for verdade..."
51210-232 = "Só existe uma pessoa capaz de derrotar a Shuro... quem possui a prova.#nOu seja—"
51210-238 = "A única que pode salvar a Yukari... é você, Nagusa-senpai."
51210-239 = "Então, por favor, senpai.#nSalve a Yukari."
51210-240 = "É-é verdade... com certeza, a Nagusa-senpai, que tem a qualificação de Presidente, consegue..."
51210-244 = "Eu..."
51210-249 = "Não consigo."
51210-251 = "Hã?! P-por quê?!"
51210-253 = "A pessoa \"qualificada para ser Presidente\" de quem a Shuro falou...#né a Ayame, não eu."
51210-254 = "Eu... não consigo."
51210-255 = "É como a Shuro disse... desde o começo, tudo não passou de desculpas."
51210-256 = "Com medo de que descobrissem quem eu realmente sou, eu tentei fugir."
51210-257 = "Sem conseguir dizer o que realmente sentia, me esforçando ao máximo só para ficar ao lado da Ayame...#npara conseguir ficar ao lado dela, eu apenas interpretei uma garota chamada \"Nagusa\"."
51210-258 = "Eu enganei todo mundo."
51210-259 = "Eu mesma... era só um \"cosplay\"."
51210-260 = "[s] \"Nagusa...\""
51210-263 = "Eu só queria ficar ao lado da Ayame... só queria me tornar alguém digna dela."
51210-264 = "Uma farsa — que só fingiu ser uma aluna exemplar."
51210-265 = "...Eu não consegui contar. Depois de perder a Ayame bem diante dos meus olhos e voltar para cá... se eu dissesse a todos que voltei sozinha..."
51210-270 = "Com certeza — iriam me apontar o dedo pelas costas."
51210-272 = "Alguém como eu não tem qualificação nenhuma."
51210-273 = "Não tem como alguém como eu... salvar a Yukari—"
51210-279 = "Goryou Nagusa...!!"
51210-284 = "Ah..."
51210-289 = "[ns] \"Kikyou, calma...!\""
51210-304 = "Kikyou...?"
51210-305 = "Eu disse coisas horríveis para a Yukari."
51210-306 = "Disse que ela já tinha um lugar para voltar.#nQue ela não precisava ficar brincando de Hyakkaryouran."
51210-307 = "Eu nunca pensei isso de verdade... me enganei dizendo que era pelo bem da Yukari... e afastei ela de forma egoísta."
51210-309 = "E foi isso... que deixou aquela garota daquele jeito."
51210-310 = "Ki-Kikyou..."
51210-315 = "..."
51210-316 = "Eu ainda não consigo perdoar você... por ter nos abandonado e ido embora."
51210-317 = "Nem por nunca ter voltado, mesmo com a gente esperando por você esse tempo todo..."
51210-322 = "...Mas."
51210-323 = "Mas, sabe..."
51210-325 = "Por minha culpa..."
51210-326 = "Aquela garota que eu feri com as minhas palavras egoístas..."
51210-327 = "A única que pode salvar a Yukari é você."
51210-328 = "Não sou eu, não é a Renge, e nem mesmo a Presidente Ayame...#né apenas você."
51210-330 = "Então, por favor."
51210-331 = "Eu sei que é um pedido egoísta.#nSei que é cara de pau demais pedir isso agora."
51210-332 = "Mesmo assim, por favor...!"
51210-333 = "Eu quero pedir desculpas a ela...!"
51210-334 = "Por favor... Nagusa-senpai."
51210-336 = "Eu imploro..."
51210-339 = "Nagusa-senpai!"
51210-343 = "Ah..."
51210-344 = "Eu também... comigo também é assim!"
51210-345 = "Eu sei que também não tenho o direito de dizer uma coisa dessas, mas!"
51210-346 = "Eu sinto o mesmo que a Kikyou!"
51210-347 = "Eu também machuquei a Yukari... por isso quero pedir desculpas."
51210-348 = "Quero encontrar ela de novo e conversar direito."
51210-349 = "Eu sei que estou sendo egoísta. Querer pedir desculpas só agora, depois que as coisas chegaram a esse ponto, é o cúmulo da hipocrisia, mas..."
51210-350 = "...Mesmo assim."
51210-355 = "Se, como a Yukari disse, der para voltar àquela época... eu também...!"
51210-356 = "Então, por favor, Nagusa-senpai."
51210-362 = "......Eu enganei todo mundo..."
51210-363 = "Eu menti..."
51210-369 = "[ns] \"Nagusa, eu também te peço.\""
51210-382 = "...Entendido."
51210-392 = "Eu vou tentar."
51210-404 = "[ns] \"Parece que não vai nos deixar passar tão fácil, né.\""
51210-405 = "Sensei, vão na frente...!#nDeixem aqui com a gente!"
51210-406 = "É isso aí. Agora que decidimos o que fazer, tá tudo tranquilo~#nÉ só segurar ele o máximo possível, né?"
51210-407 = "Entendido. Pode deixar que nós o seguramos!"
51210-408 = "Deixa com a gente, Sensei!"
51210-410 = "Nagusa-senpai, Sensei... por favor, cuidem da Yukari."
51210-412 = "[ns] \"Sim, vamos! Nagusa!\""
51210-419 = "...!"
51210-421 = "Próximo;A Cidade Envolta em Chamas"
