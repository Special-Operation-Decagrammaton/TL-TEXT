[translation]
51210-1 = "Эпизод 21;И всё же — твоя"
51210-3 = "ХИЯ!"
51210-4 = ""
51210-7 = ""
51210-9 = ""
51210-11 = ""
51210-13 = ""
51210-15 = "Мы отбиваемся от мелких Духов артефактов, но..."
51210-16 = ""
51210-23 = "[ns] «Мы не можем попасть в Курокагэ ни одной пулей.»"
51210-24 = "Пока они отступили, но лишь перегруппировываются."
51210-25 = "Они могут вернуться в любой момент."
51210-26 = "Плохой человек убегает! Нам нужно пробиться сквозь этих штуковин!"
51210-27 = "Что мне делать?! Мимори? Цубаки?"
51210-29 = "Юкари в опасности."
51210-30 = "Я не позволю, чтобы с ней что-то случилось!"
51210-31 = "Нам нужно прорваться через их строй! Какой план, Кикё?!"
51210-32 = "..."
51210-33 = ""
51210-35 = ""
51210-37 = ""
51210-38 = "[ns] «Нагуса.»"
51210-39 = ""
51210-41 = ""
51210-42 = "[ns1] «Я понимаю, что Сюро нужна Юкари.»\n[ns2] «Сюро манипулировала каждым событием этой ночи и всё спланировала.»"
51210-43 = ""
51210-44 = ""
51210-45 = "[ns] «Но что Сюро имеет в виду под „написать собственную историю о призраках“?»"
51210-47 = "[ns] «Чего Сюро пытается добиться с помощью Юкари?»"
51210-48 = "Это..."
51210-49 = "У нас нет времени медлить, Сенсей!"
51210-50 = "Чем дольше мы ждём здесь, тем больше опасность для Юкари!"
51210-52 = "Как Аямэ? Нагуса?"
51210-53 = ""
51210-55 = ""
51210-56 = "Эй? Кикё?"
51210-57 = ""
51210-59 = ""
51210-61 = "Мне придётся повторять тебе одно и то же до конца наших дней? Битвы выигрывают благодаря информации, а сейчас у нас её нет."
51210-62 = "Без неё стратегии не существует."
51210-63 = "Мне нужно больше сведений, если вы хотите, чтобы я составила план."
51210-64 = "Сенсей это понимает. Поэтому рассказывай, Нагуса. Похоже, только ты понимаешь, что происходит."
51210-66 = "Только я..."
51210-67 = "Я рассчитываю на тебя. Каковы её намерения? Мотивы? Что она предпримет дальше?"
51210-68 = "Позволь подчеркнуть ещё раз. Это можешь сделать только ты."
51210-69 = ""
51210-71 = ""
51210-72 = "..."
51210-73 = "...Понятно."
51210-74 = "...Ты будешь цепляться за свою глупость до последнего вздоха."
51210-75 = "«Красота природы»..."
51210-76 = ""
51210-78 = ""
51210-80 = "Нагуса...?"
51210-81 = ""
51210-83 = ""
51210-85 = ""
51210-86 = "«Красота природы» — группа чудовищ, которые когда-то бесчинствовали на этих землях ещё до создания союза Хяккияко."
51210-87 = "О них известно многое."
51210-88 = "[ns3] «Как о зловещем клубе, выступавшем против союза Хяккияко...»\n[ns4] «Как о колдующих чудовищах со странными могущественными томами.»"
51210-91 = "...Как и сказал Сенсей."
51210-92 = "Мы ничего не знаем об их намерениях. Есть ли у чудовищ вообще причины? Но мы знаем, как они действуют."
51210-93 = "Они используют свои тома и распространяют слухи в мире людей. Когда слухи набирают достаточно силы, они обретают физическую форму."
51210-94 = "Вот как... Вот как исчезла Аямэ. На снежных полях мы встретили президента «Красоты природы», Кокурико."
51210-95 = "Она использовала свой том, превратила Аямэ в Фантомное сказание и утащила её в мир духов."
51210-96 = ""
51210-99 = ""
51210-101 = "А я... Я ничего не сделала. Я смотрела в полном ужасе и ничего не предприняла."
51210-103 = "Вот как Аямэ..."
51210-104 = "..."
51210-106 = "Я полагаю, Сюро собирается сделать то же самое с Юкари."
51210-107 = "Я не знаю, что делать. Это будет всё равно что снова потерять Аямэ."
51210-108 = "Вот какой секрет ты скрывала? Ты могла просто рассказать нам правду."
51210-109 = "...Я боялась. Была в ужасе и стыдилась."
51210-110 = ""
51210-111 = ""
51210-113 = ""
51210-115 = ""
51210-116 = "...Нагуса."
51210-117 = ""
51210-121 = ""
51210-123 = ""
51210-124 = "Ч-Что это?!"
51210-126 = "Я схожу с ума или все остальные тоже это видят?"
51210-127 = ""
51210-129 = ""
51210-130 = "Смотрите, Сенсей! Вон там!"
51210-131 = ""
51210-137 = ""
51210-138 = "Аха-ха! Всем привет! Веселитесь сегодня?"
51210-139 = "Уверена, что да!"
51210-140 = "Надеюсь, вы цените все усилия, которые я вложила в этот Фестиваль фонарей!"
51210-141 = ""
51210-143 = ""
51210-144 = "Это дирижабль Клуба Инь-Ян для прямых трансляций..."
51210-145 = "Она вещает на весь Кивотос!"
51210-146 = "На весь Кивотос?! Как?"
51210-147 = "[s] «Шизуко подготовила всё для прямой трансляции ритуала...»"
51210-148 = "Как — неважно. Зачем?"
51210-150 = "Сегодня ночью будет ещё много захватывающих событий!"
51210-151 = "Но сперва позвольте представить особенную гостью."
51210-152 = ""
51210-154 = ""
51210-155 = "Как вы прекрасно знаете, Фестиваль фонарей проводится впервые за двадцать лет. А эта маленькая леди — главная звезда программы!"
51210-156 = ""
51210-158 = ""
51210-160 = ""
51210-161 = ""
51210-163 = ""
51210-164 = "[ns] «У неё Юкари!»"
51210-165 = "Аха-ха! Видите её?"
51210-166 = "Конечно видите, ведь вся эта сцена была создана специально для неё!"
51210-167 = "Но прежде чем начать, расскажу вам немного больше о нашей главной героине."
51210-169 = "..."
51210-171 = "Итак, она немного вздремнула — и вполне заслуженно."
51210-172 = "Ведь нашей несчастной мико пришлось пережить столько всего. Её бросили. Предали. Осудили."
51210-174 = ""
51210-175 = "Она цеплялась за юбку своего любимого кумира, только чтобы остаться позади, в её тени."
51210-177 = ""
51210-178 = "Она попыталась рассказать кому-то о своей мечте вернуться в старые добрые времена — и что получила в ответ? Насмешки и издевательства."
51210-179 = ""
51210-180 = "Когда она вернулась туда, что считала своим домом, её тут же выгнали. Велели возвращаться туда, где её место."
51210-182 = "И тогда она послушно вернулась в семью Кадэнокодзи."
51210-184 = "Она думала, что будет счастлива! Но, вернувшись в этот якобы «дом», обнаружила ужасный секрет."
51210-185 = "Кадэнокодзи Юкари была для них всего лишь инструментом. Они хотели, чтобы она танцевала, танцевала и танцевала, лишь бы очистить свой дом от позора двадцатилетней давности."
51210-186 = "..."
51210-187 = "Вот именно. Куда бы эта мико ни шла, она не встретила ни одной души, способной понять её боль."
51210-188 = "Пока все купались в праздничном веселье, она в одиночестве переживала невообразимые страдания."
51210-189 = "Разве это... справедливо?"
51210-190 = "Почему все должны быть счастливы за её счёт? Пусть страдают так же, как страдала она."
51210-191 = ""
51210-193 = ""
51210-194 = "Поэтому вместо неё я верну вам всю боль, которую вы ей причинили."
51210-195 = "Добро пожаловать в утончённость «Красоты природы»."
51210-196 = "Горящий в пламени Хяккияко станет величайшим зрелищем, которое вы когда-либо видели!"
51210-197 = "Приготовьтесь к этой истории!"
51210-198 = ""
51210-203 = ""
51210-204 = "[ns] «Юкари...!»"
51210-206 = "Она пригрозила сжечь весь Хяккияко."
51210-207 = "Дальше всё станет только хуже."
51210-208 = "Надо что-то делать! Не знаю что, но хоть что-нибудь!"
51210-209 = ""
51210-213 = "[ns] «Как не вовремя... Курокагэ двинулся!»"
51210-214 = "Да чтоб тебя!"
51210-215 = "Это безнадёжно! Как нам победить чудовище, до которого мы даже дотронуться не можем?"
51210-216 = "Допустим, в каком-то невозможном мире мы сумеем проскочить мимо него — эта мелкая тоже неуязвима для наших атак."
51210-217 = "...Есть способ."
51210-218 = ""
51210-220 = ""
51210-221 = "Ч-Что? Как?!"
51210-222 = ""
51210-224 = ""
51210-225 = "[ns] «Кикё, это Сотня Лотосов?»"
51210-226 = ""
51210-229 = ""
51210-230 = "Да, Сотня Лотосов. Последний подарок Нагусы мне."
51210-231 = "Если словам Сюро можно верить..."
51210-232 = "Она сама точно сказала нам, как её победить."
51210-233 = ""
51210-235 = ""
51210-237 = ""
51210-238 = "Это ты, Нагуса. Только ты можешь спасти Юкари."
51210-239 = "Так сделай это. Пожалуйста."
51210-240 = "Она права. Сотня Лотосов у нас есть, но использовать её может только Нагуса."
51210-241 = ""
51210-243 = ""
51210-244 = "Я..."
51210-247 = ""
51210-249 = "Я не могу."
51210-251 = "А?! П-Почему?! Нагуса!"
51210-253 = "Только Аямэ достойна быть президентом Хяккарёран."
51210-254 = "Я никогда им не была."
51210-255 = "Несмотря ни на что, в одном Сюро была права. Я лгала. Лгала всем вам."
51210-256 = "Я боялась, что вы увидите меня настоящую, поэтому сбежала."
51210-257 = "Что бы вы сказали, узнав, что «Нагуса» — всего лишь роль? Просто девочка, отчаянно пытавшаяся оставаться рядом со своей лучшей подругой?"
51210-258 = "Поэтому я лгала. Убегала и лгала."
51210-259 = "Пожалуй, с самого начала я просто играла чужую роль."
51210-260 = "[s] «Нагуса...»"
51210-261 = ""
51210-263 = "Я всё это время была самозванкой. Я лишь хотела стать достаточно хорошей, чтобы стоять рядом с Аямэ."
51210-264 = "Я всё притворялась. Образ сильной и умного студента, которым вы восхищались, был лишь миражом."
51210-265 = "А потом я потеряла Аямэ и ничем не смогла ей помочь. Как после этого я могла рассказать вам правду?"
51210-266 = ""
51210-270 = "Я боялась, что меня обвинят. Не хотела, чтобы все узнали, какой я мошенник."
51210-272 = "Такая трусиха, как я, никогда не будет достойна."
51210-273 = "Такая трусиха, как я... недостаточно хороша, чтобы спасти Юкари!"
51210-274 = ""
51210-277 = ""
51210-278 = ""
51210-279 = "Горё Нагуса!"
51210-280 = ""
51210-283 = ""
51210-284 = "Ах..."
51210-285 = ""
51210-287 = ""
51210-288 = ""
51210-289 = "[ns] «Кикё, давай спокойно вдохнём.»"
51210-290 = ""
51210-292 = ""
51210-294 = ""
51210-295 = ""
51210-296 = ""
51210-297 = ""
51210-304 = "...Кикё?"
51210-305 = "Я причинила Юкари боль."
51210-306 = "Я сказала ей, что время игр закончилось и пора возвращаться домой."
51210-307 = "Я убедила себя лгать ради того, чтобы защитить Юкари."
51210-309 = "Наша «защита» привела её туда, где она сейчас оказалась."
51210-310 = "...Кикё."
51210-315 = "..."
51210-316 = "Часть меня до сих пор презирает тебя. То, что ты нас бросила, так просто не забыть."
51210-317 = "Потому что я ждала. Осталась и ждала, ждала. А ты не вернулась."
51210-318 = ""
51210-322 = "И всё же..."
51210-323 = "Несмотря на это..."
51210-324 = ""
51210-325 = "Мои ошибки принадлежат мне. Я это понимаю."
51210-326 = "Я сильно её ранила и хочу всё исправить."
51210-327 = "Но мне это не под силу. Нагуса, сейчас только ты можешь спасти Юкари."
51210-328 = "Не я, не Рэнгэ... и даже не Аямэ. Ты."
51210-330 = "Я умоляю тебя."
51210-331 = "Моя заносчивость всегда была моим главным недостатком. После сегодняшнего дня я не имею права держать голову высоко."
51210-332 = "Но вот я здесь и умоляю."
51210-333 = "Пожалуйста. Скажи Юкари, что всё будет хорошо. Помоги мне перед ней извиниться."
51210-334 = "Спаси её, Нагуса."
51210-336 = "Пожалуйста."
51210-338 = ""
51210-339 = "Нагуса!"
51210-340 = ""
51210-342 = ""
51210-343 = "Ах."
51210-344 = "Я... я чувствую то же самое!"
51210-345 = "Не то чтобы мне было чем хвастаться. В конце концов, после твоего ухода я тоже сбежала из Хяккарёран."
51210-346 = "Но я всё равно с ней согласна!"
51210-347 = "Я ранила человека, который нам очень дорог, и теперь должна посмотреть ей в глаза и извиниться."
51210-348 = "Мне просто нужно поговорить с ней ещё один раз."
51210-349 = "Я знаю, мы многого от тебя просим. Мы не должны заставлять тебя исправлять наши ошибки."
51210-350 = "Но..."
51210-353 = ""
51210-355 = "Как сказала Юкари... Я тоже хочу вернуться..."
51210-356 = "Поэтому, пожалуйста, Нагуса."
51210-357 = ""
51210-359 = ""
51210-361 = ""
51210-362 = "Но я мошенница..."
51210-363 = "Я лгала вам всем."
51210-364 = ""
51210-366 = ""
51210-368 = ""
51210-369 = "[ns] «Я тоже тебя умоляю, Нагуса.»"
51210-370 = ""
51210-372 = ""
51210-373 = ""
51210-375 = ""
51210-376 = ""
51210-377 = ""
51210-378 = ""
51210-379 = ""
51210-380 = ""
51210-382 = "...Хорошо."
51210-383 = ""
51210-386 = ""
51210-388 = ""
51210-389 = ""
51210-390 = ""
51210-391 = ""
51210-392 = "Я ничего не обещаю, но могу попытаться."
51210-393 = ""
51210-397 = ""
51210-398 = ""
51210-399 = ""
51210-401 = ""
51210-404 = "[ns] «Подъём будет тяжёлым.»"
51210-405 = "Какая разница?! Мы пробьём себе путь!"
51210-406 = "Да. Насколько я понимаю, вам нужно время, верно?"
51210-407 = "Мы не сможем победить их всех, но выиграем для вас столько времени, сколько сумеем!"
51210-408 = "Мы справимся, Сенсей!"
51210-410 = "...Идите спасать Юкари, Сенсей. Нагуса."
51210-412 = "[ns] «Мы вернём её целой и невредимой. Идём, Нагуса!»"
51210-413 = ""
