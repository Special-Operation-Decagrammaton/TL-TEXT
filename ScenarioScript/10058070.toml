[translation]
10058070-1 = "Episode 7;Red Light"
10058070-3 = "Cherino... President...?"
10058070-4 = "Why is the President in a place like that...?"
10058070-5 = "Looking as unchanged as ever. And you still haven't grown an inch."
10058070-6 = "You're competing?! Why?!#nWait, does that mean for us to win, we have to beat President Cherino?!"
10058070-7 = "If we actually win, won't we get purged?!"
