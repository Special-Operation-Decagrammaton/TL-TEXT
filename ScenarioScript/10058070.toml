10058070-86 = "Ajitani Hifumi...!"
10058070-88 = "My oh my~! A rival appears right here! How fateful!!"
10058070-89 = "The Red Winter Office's Purge-kun No. 1 team has been ambushed by Trinity Remedial Class's Crusader-chan team!"
10058070-90 = "Led by Ajitani Hifumi, who ties for 2nd in the tank rankings,#nthis is a terrifying team!"
10058070-91 = "[s] \"Hifumi is rank 2 in the tank rankings?!\""
10058070-92 = "Eh? You didn't know?"
10058070-93 = "She's a famous competitor even in Gehenna!#nHer exploits earned her the alias Titania, the Fairy Queen!"
10058070-94 = "[s] \"Infamous? It's a cute name though?\""
10058070-95 = "Well, you see—"
10058070-96 = "They say she got it because if you run into her in the forest, you can never escape!"
10058070-97 = "[s] \"And thus, the Fairy Queen...!\""
10058070-98 = "Word has it there are even worse names for her out there!"
10058070-101 = "By the way, why did the Remedial Class team end up battling#nthe Red Winter Office team?"
10058070-102 = "They could have just waited for the Special Class 183 team to get taken out!"
