10058070-12 = "That's right! Don't you think if we just run away, she'll take care of her?#nThat way, we won't get purged!!"
10058070-13 = "Lend me your binoculars! We need to see what's going on over there before we move!"
10058070-15 = "For now, let's just run blindly in the opposite direction of where President Cherino is heading..."
10058070-22 = "Wh-Where did she go~?!"
10058070-23 = "Geez!! You're looking right through binoculars, how can you not see her?!"
10058070-24 = "This is weird!! She was definitely right over there!!"
10058070-27 = "Lana, turn off the engine! The sound might give us away!"
10058070-28 = "?"
10058070-29 = "I turned it off ages ago to save fuel."
10058070-30 = "Eh...?"
10058070-31 = "Make sure other tanks don't get the drop on your rear."
