10058070-112 = "Yes. Their gun barrel is still pointed at us, but#nI think they'll switch targets to 183 any second now."
10058070-113 = "Then shouldn't we just run away while we have the chance?#nWe hit all the targets, so all that's left is to reach the finish line!"
10058070-114 = "You're right, Koharu-chan. But..."
10058070-115 = "That would mean leaving 183 to die."
10058070-116 = "...!"
10058070-117 = "Umm... Well, that's true..."
