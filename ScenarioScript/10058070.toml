10058070-9 = "Let's just avoid her and keep moving!#nMaybe some other team will take out the President in the meantime!"
10058070-10 = "No, wait... Is there even a team that can beat her...?#nAh, I know! If it's that fluffy-haired person with the sleepy eyes..."
