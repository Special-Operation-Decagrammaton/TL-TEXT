10058070-46 = "Their Elo rating is the baseline 1500. They're a mysterious team that is both undefeated and winless!"
10058070-47 = "Among tank race maniacs, Special Class 183 is already starting to be called#n\"The Masher Descended from the Slaughters of Hell\"!"
10058070-48 = "They reportedly built their tank together just for this tournament,#nI wonder what kind of performance they'll show us!"
10058070-50 = "Fuaaaaaahn!"
