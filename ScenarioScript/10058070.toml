10058070-142 = "No, Koharu-chan. You aren't missing anything. But..."
10058070-148 = "Even if you were missing something, it's that very Koharu-chan that makes you great."
10058070-150 = "What is \"that kind of me\"?!"
10058070-151 = "Ahaha, Hanako-chan. Phrasing it like that is going to make Koharu-chan misunderstand."
10058070-152 = "What does everyone else think?"
10058070-153 = "I agree with the genius Koharu-chan's opinion."
10058070-154 = "It breaks my heart too. I agree."
