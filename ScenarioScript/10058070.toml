10058070-57 = "President. According to reports,#n they are the Special Class 183 team from Red Winter Federal Academy."
10058070-58 = "Hmph... Their tank looks bizarre, and they all look terrified."
10058070-59 = "If other students saw this, it might undermine my authority."
10058070-60 = "Loader, HEAT shell. Point-blank fire as soon as you're ready!"
10058070-61 = "Wipe out anyone who stands in the way of my victory!"
