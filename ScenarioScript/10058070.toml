10058070-192 = "Heaven forbid! The coup the other day was a misunderstanding!"
10058070-193 = "Please give this unworthy Marina a chance to restore your trust!"
10058070-194 = "Grant me permission for an \"anti-tank assault\" to leap onto the enemy tank! Cherino-sama!"
10058070-195 = "..."
10058070-196 = "Hmph, magnificent loyalty."
