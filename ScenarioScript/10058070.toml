10058070-129 = "They barged into our fight in the first place, anyway!"
10058070-130 = "Besides, I hate retakes and studying! So let's just help them escape and call it done!#nWe'll win our own way!"
10058070-131 = "If we just run away like this, it's going to keep bugging me forever... so..."
10058070-132 = "..."
