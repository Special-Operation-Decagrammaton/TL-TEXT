[translation]
10056110-1 = "Epilogue;Barnacles are barnacles, for better or worse"
10056110-2 = "Odysseia Anchorage"
10056110-3 = "(About a week after returning from the blue hole)"
10056110-10 = "Ugh... It stinks..."
10056110-11 = "This is the worst..."
10056110-12 = "So stinky."
10056110-17 = "S-Sorry. I was asked to scrape off barnacles again..."
10056110-18 = "Well, it cannot be helped."
10056110-19 = "Right now, scraping barnacles is about the only thing the Diving Club can do."
10056110-20 = "...Indeed."
10056110-21 = "Besides, this will reduce our debt a little bit.#nI do not think it is such a bad deal."
10056110-28 = "Ah, Vice Commander Ami...!"
10056110-29 = "W-We were not slacking off...!"
10056110-30 = "After diving, we need to rest enough to remove the nitrogen left in our bodies--"
10056110-31 = "Ah, do not worry. I am not here to monitor you."
10056110-32 = "I am..."
10056110-33 = "Here to express our gratitude on behalf of the Island."
10056110-34 = "...Gratitude, you say?"
10056110-35 = "Yes."
10056110-36 = "I heard that the other day you protected Sensei from the Jiaolong of the Saltwater and contributed greatly to repelling them."
10056110-37 = "Sensei of Schale is a VIP welcomed at Odysseia."
10056110-38 = "If anything were to happen to Sensei, it would have brought disgrace not only to the Island, but#nto the academy as a whole."
10056110-39 = "I express my gratitude on behalf of the Island and the academy."
10056110-40 = "N-No... It is nothing to thank us for..."
10056110-41 = "If we had not sneaked the boat out in the first place, Sensei would not have gotten involved..."
10056110-42 = "Should we call this reaping what we sow...?"
10056110-43 = "That is true."
10056110-44 = "Ugh..."
10056110-45 = "However, there is one more thing I want to thank you for."
10056110-46 = "The Jiaolong of the Saltwater--no, I heard you put that idiot in her place?"
10056110-47 = "When she was arrested, handing her over to the correction bureau was the best course of action for the Island, but..."
10056110-48 = "Personally, I wanted to teach her a lesson."
10056110-49 = "You have done the Club President a huge favor."
10056110-50 = "Th-Thank you very much..."
10056110-51 = "I-If you do not mind... could you also clear our debt for purchasing equipment..."
10056110-52 = "If you wish, shall I calculate it precisely for you?"
10056110-53 = "N-No, thank you!"
10056110-57 = "And... I was wrong about what I said before regarding the single plank."
10056110-58 = "A single plank drifting away from where it belongs...#nsometimes saves the lives of those in distress."
10056110-59 = "Of course, that does not mean I will allow exceptions in the future."
10056110-60 = "O-Of course! W-We will not break Odysseia's rules either!"
10056110-61 = "We will do our absolute best!"
10056110-66 = "Does the Club President have to bow and scrape so much it makes me embarrassed to watch?"
10056110-67 = "She is in a weak position against authority... Just understand her."
10056110-68 = "A sea lion, a sea lion~"
10056110-69 = "That aside, I reviewed your report--"
10056110-70 = "May I ask how you obtained the magnetic mines used in the attack?"
10056110-71 = "They were not included in the purchase details reported in advance."
10056110-72 = "Eh?! Th-That is..."
10056110-73 = "W-We snatched them! From the pirate ship warehouse!"
10056110-74 = "Hmm...?"
10056110-79 = "[ns1] \"Hello there.\"\n[ns2] \"What are you doing?\""
10056110-82 = "Sensei, hello."
10056110-83 = "I came to deliver a message to the Diving Club. I have just finished my business."
10056110-84 = "[s3] \"I bought some ice cream at Aqua Seal...\"\n[s4] \"Would you like some too, Ami?\""
10056110-87 = "No, I have paperwork piling up."
10056110-88 = "Excuse me."
10056110-92 = "[ns] \"...Ami is so stiff.\""
10056110-93 = "A-Ahaha... She has a lot of work, so it cannot be helped..."
10056110-94 = "[s5] \"Were you all just taking a break?\"\n[s6] \"Let us eat ice cream together.\""
10056110-97 = "No, you do not have to go that far for us..."
10056110-101 = "...Sensei.#nPlease tell me why you care about us so much."
10056110-102 = "Even though we cannot do anything for Sensei..."
10056110-103 = "[s] \"Do I need a special reason?\""
10056110-104 = "Eh?"
10056110-105 = "[s7] \"I am the Diving Club's sponsor, am I not?\"\n[s8] \"It is only natural for a sponsor to support you!\""
10056110-112 = "I see. In that case... I will gladly accept it."
10056110-120 = "Oh, Sensei. Did you buy more ice cream for us?"
10056110-121 = "Sayuri wants sardine ice cream~"
10056110-122 = "I want vanilla."
10056110-126 = "Ah, I want... "
10056110-132 = "Itadakimasu!"
10056110-133 = "DIVE into OCEAN!"
