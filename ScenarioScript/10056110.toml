[translation]
10056110-1 = "Epilogue; Just Barnacles, but Still Barnacles"
10056110-2 = "Odyssey Anchorage"
10056110-3 = "(About a week after we returned from the blue hole...)"
10056110-10 = "Ugh... It stinks."
10056110-11 = "This sucks..."
10056110-12 = "It stiiinks."
10056110-17 = "I-I'm sorry. We were asked to scrape barnacles off again..."
10056110-18 = "Well, it can't be helped."
10056110-19 = "This is just about the only type of work available to the Diving Club right now."
10056110-20 = "...Indeed."
10056110-21 = "Besides, a part of your debt will be waived for doing this. #nI believe it is not a bad deal at all."
10056110-28 = "E-executive officer Ami...!"
10056110-29 = "W-we weren't slacking off...!"
10056110-30 = "If you don't take a sufficient rest after diving to flush out the remaining nitrogen in#nyour body, then—"
10056110-31 = "Ah, be at ease. I am not here to surveil you all."
10056110-32 = "Rather..."
10056110-33 = "I am here to express my gratitude on behalf of Island."
10056110-34 = "...Gratitude?"
10056110-35 = "Indeed."
10056110-36 = "You girls made significant contributions in protecting Sensei from the Sea Dragon the other day."
10056110-37 = "Sensei is a VIP we have welcomed to Odyssey."
10056110-38 = "If they had been harmed in this incident, #nit would have been a great dishonor not merely to Island, but the entire school."
10056110-39 = "On behalf of Island, and the entire school, I offer you my deepest gratitude."
10056110-40 = "N-no... There's no need for you to thank us..."
10056110-41 = "If we hadn't snuck our boat out in the first place, then Sensei wouldn't have been dragged into this mess..."
10056110-42 = "You could say that we were just cleaning up our mess..."
10056110-43 = "That certainly is true."
10056110-44 = "Urgh..."
10056110-45 = "However, there was one other thing I wanted to thank you for."
10056110-46 = "I heard that you beat the Sea Dragon... No, that fool, into submission?"
10056110-47 = "When we had first arrested her, the best course of action from Island was to hand her over to the Correction Bureau..."
10056110-48 = "However, personally, I was very interested in teaching her a lesson."
10056110-49 = "It would seem that I am deeply indebted to you, club president Kokoro."
10056110-50 = "Th-thank you very much..."
10056110-51 = "I-if you don't mind... Could you also waive the debt we incurred from buying#nequipment...?"
10056110-52 = "If you so wish, I could give you a more accurate calculation of your debt."
10056110-53 = "Th-that's okay, thank you very much!"
10056110-57 = "Also... It would seem that I was wrong about what I said regarding the missing#nplank."
10056110-58 = "When a plank drifts away from where it belongs... #nSometimes, it may even save the life of someone lost at sea."
10056110-59 = "Be that as it may, we do not intend on allowing anymore exceptions in the future."
10056110-60 = "O-of course! W-we also don't intend on breaking anymore rules at Odyssey!"
10056110-61 = "W-we'll do our very best!"
10056110-66 = "Prez's bowing so much and acting so submissive that it's actually kinda#nembarrassing to watch."
10056110-67 = "Well she is at the mercy of the higher ups right now... So I hope you can be#nunderstanding of why."
10056110-68 = "She's doing the seal thing! The flop flop!"
10056110-69 = "Putting that aside, I have taken a look at the report of this incident..."
10056110-70 = "Would you mind if I ask where you managed to aquire the limpet mines used in#nyour attack?"
10056110-71 = "They do not appear to have been mentioned in your previous purchasing#nstatements."
10056110-72 = "Ah!? W-well, umm..."
10056110-73 = "W-we looted them! From those pirate ships' holds!"
10056110-74 = "Hmmm..."
10056110-79 = "[ns1] \"Hey, what's up?\"\n[ns2] \"What're you all doing?\""
10056110-82 = "Sensei, thank you for your hard work."
10056110-83 = "I was forwarding a message to the Diving Club. My business here is done."
10056110-84 = "[s3] \"I bought some ice cream from Aqua Seal...\"\n[s4] \"Would you like some too, Ami?\""
10056110-87 = "I am all right. I have a pile of paperwork I need to get through."
10056110-88 = "Please excuse me."
10056110-92 = "[ns] \"...Ami is so serious.\""
10056110-93 = "A-ahaha... She does have a lot of work to do, so it can't really be helped."
10056110-94 = "[s5] \"Were you all in the middle of taking a break?\"\n[s6] \"Let's have ice cream together.\""
10056110-97 = "No, you didn't have to go out of your way to buy some for us…"
10056110-101 = "...Sensei. #nPlease tell me why you care about us so much."
10056110-102 = "There's nothing at all that we can do for you..."
10056110-103 = "[s] \"Do I really need any special reason?\""
10056110-104 = "Huh?"
10056110-105 = "[s7] \"I'm the Diving Club's sponsor.\"\n[s8] \"It's only natural for a sponsor to provide backing!\""
10056110-112 = "That's true. In that case... I'll graciously accept."
10056110-120 = "Oh, Sensei. Did you buy us ice cream again?"
10056110-121 = "Sayuri wants sardine ice creaam."
10056110-122 = "I would like vanilla."
10056110-126 = "Ah, me too..."
10056110-132 = "Thanks for the ice cream!"
10056110-133 = "DIVE into OCEAN!"