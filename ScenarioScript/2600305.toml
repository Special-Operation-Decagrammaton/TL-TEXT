[translation]
2600305-1 = "Серина — в любое время и в любом месте"
2600305-2 = "(Сегодня снова был сумасшедший день. Я весь день ездил между примерно десятью зданиями.)"
2600305-3 = "(Мне нужно посетить ещё три места, так что пора спешить к следующему.)"
2600305-4 = "[s1] (Спуститься на лифте.)\n[s2] (Спуститься по лестнице.)"
2600305-5 = "*ж-ж-ж*... *динь*"
2600305-8 = "*др-р-р* *др-р-р* *бах*"
2600305-9 = "Э-Эм. И-Из-за внезапного отключения электричества просим всех отнестись с пониманием..."
2600305-10 = "[s3] (Открыть дверь вручную и выйти.)"
2600305-13 = "*шлёп* *топ* *шлёп* *топ*"
2600305-14 = "(Я быстро пошёл вниз по лестнице.)"
2600305-19 = "*др-р-р* *др-р-р* *бах* *бах* *бах*"
2600305-20 = "Э-Эм. И-Из-за внезапного отключения электричества просим всех отнестись с пониманием..."
2600305-23 = "...Сенсей?"
2600305-24 = "Сенсей! Ты не ранен?!"
2600305-25 = "[s] «...?»"
2600305-26 = ""
2600305-27 = ""
2600305-28 = "Вставай, Сенсей! Ты в порядке?"
2600305-29 = "Это я, Серина! Ты меня слышишь?"
2600305-30 = "Не спеши. Мне нужно осмотреть тебя на предмет травм!"
2600305-31 = ""
2600305-32 = ""
2600305-33 = "..."
2600305-34 = "Слава богу. Колено и рука поцарапаны, но ничего серьёзного."
2600305-35 = "Когда шок пройдёт, всё будет хорошо."
2600305-36 = "Хорошо. Давай обработаем эти царапины."
2600305-37 = "[s4] «Спасибо, Серина.»\n[s5] «Совсем не больно. На тебя всегда можно положиться, Серина.»"
2600305-38 = "Я ценю это, но лучше бы ты перестал попадать в ситуации, где тебе нужна моя помощь."
2600305-39 = "Мне совсем не радостно слышать это, пока ты ранен."
2600305-40 = "Серьёзно, именно поэтому я и говорила: зови меня, если понадобится помощь!"
2600305-41 = "Отключение электричества? Что значит «с этим ничего не поделать»?"
2600305-42 = "Я всегда буду рядом, чтобы помочь — устал ты, ранен или оказался в темноте из-за отключения света, это моя работа!"
2600305-43 = "Прошу, звони мне, когда попадаешь в беду. Я не хочу, чтобы такое продолжалось…"
2600305-44 = ""
2600305-45 = ""
2600305-46 = "Вот видишь, я была права. Приди я чуть позже — остался бы шрам. Тебе этого хочется?"
2600305-47 = "Тебе повезло, что я пришла так быстро."
2600305-48 = "...Что?"
2600305-49 = "Откуда я знала... где тебя искать?"
2600305-50 = "..."
2600305-51 = "Н-Не знаю. Совпадение. Я... просто проходила мимо?"
2600305-52 = "К-Какая разница, как это получилось?! Ты опять меняешь тему! Плохой пациент! Плохой!"
2600305-53 = "Что? Это я меняю тему? Н-Нет! Никогда!"
2600305-54 = "В-В общем! В следующий раз позвони мне до того, как что-нибудь случится!"
2600305-55 = "Хорошо? Обещай. Ты. Телефон. Мне. Позвонить!"
2600305-56 = "Я-я закончила тебя лечить, так что... пока!"
2600305-57 = ""
2600305-59 = "(Прежде чем я успел что-то сказать, Серина быстро скрылась в темноте.)"
2600305-60 = "(В конце концов электричество вернулось, и я смог закончить дела на день.)"
2600305-61 = "(Позже я проверил записи камер, но не нашёл ни одного кадра, где Серина входит в здание.)"
