[translation]
2000606-1 = "Законы моды"
2000606-2 = "Шаньхайцзин, Персиковый источник"
2000606-4 = "Закончив работу в академии Шаньхайцзин, я зашёл в ближайшую чайную выпить чаю."
2000606-5 = "[s] «Сая?»"
2000606-6 = "О, Сенсей?"
2000606-7 = "Не ожидала встретить вас в чайной Шаньхайцзина."
2000606-8 = "Здесь свободно, хотите присоединиться?"
2000606-9 = "[s1] «Ты тоже пришла выпить чаю?»\n[s2] «Только не говори, что экспериментируешь с чаем.»"
2000606-10 = "Ага. Здесь приятная атмосфера и отличный чай. Идеально после еды."
2000606-11 = "Обычно я заглядываю сюда, когда в выходные прихожу на Променад Чёрной Черепахи."
2000606-12 = "Грубо! Я не всё подряд, что ем и пью, использую для экспериментов, знаете ли."
2000606-13 = "Мне нравится после еды спокойно выпить здесь чашку чая, как любому студенту Шаньхайцзина."
2000606-14 = "К тому же в последнее время вся еда на Променаде стала такой острой, что без чая после еды у меня бы разболелся живот. Вот почему я стала заходить сюда чаще."
2000606-15 = "И всё из-за моего особого острого соуса."
2000606-16 = "[s] «Он и правда стал очень популярным, да?»"
2000606-17 = "Да это уже не просто популярность!"
2000606-18 = "Сейчас он на пике моды. Почти каждое блюдо на Променаде готовят с этим соусом!"
2000606-19 = "И его добавляют не только в мапо-тофу или лапшу даньдань — им посыпают даже блюда, которые обычно вообще не острые, вроде жареного риса и пельменей!"
2000606-20 = "Я понимаю, что это модно, но разве не перебор? Не все любят острое, а они продолжают пихать соус буквально во всё."
2000606-21 = "Почему нельзя было устроить моду на сыр во всех блюдах...?"
2000606-22 = "[s] «Тренды не вечны. Рано или поздно это утихнет.»"
2000606-23 = "Ну, я хотя бы рада, что здесь, в Персиковом источнике, его не используют."
2000606-24 = "Хотя это и так очевидно. Какой идиот станет добавлять острый соус в чай, как бы сильно он его ни любил? Ха-ха-ха!"
2000606-25 = "Здесь я могу спокойно провести выходной."
2000606-27 = ""
2000606-28 = "Привет, Сая! В последнее время ты часто заходишь в Персиковый источник."
2000606-29 = "Как раз вовремя. Я давно хотела кое о чём тебя попросить."
2000606-30 = "Меня? О чём?"
2000606-31 = "Я слышала, что новое блюдо лапшичной стало хитом после твоего совета."
2000606-32 = "Так уж совпало, что мы тоже хотим обновить меню. Не могла бы ты попробовать одну из наших новинок и высказать мнение до запуска?"
2000606-33 = "Конечно! Без проблем!"
2000606-34 = "Прекрасно. Начнём с этого лунного пряника."
2000606-35 = ""
2000606-36 = "О, эта красная начинка — клубничная? Выглядит очень сладко."
2000606-37 = "Ну что ж, попробуем!"
2000606-38 = ""
2000606-40 = ""
2000606-41 = ""
2000606-42 = ""
2000606-44 = "ОСТРО! ОЧЕНЬ ОСТРО!"
2000606-45 = "Ч-Что за...?! Почему из всех вещей именно лунный пряник острый?!"
2000606-46 = "О. Тебе не понравилось?"
2000606-47 = "Странно. Я специально добавила острый соус, который сейчас так популярен на Променаде."
2000606-48 = "Какой псих захочет острые сладости?!"
2000606-49 = "Наоборот. С тех пор как острый соус вошёл в моду, несколько посетителей приходили в Персиковый источник в поисках острых сладостей. Очень досадно, что нам нечего было им предложить."
2000606-50 = "Некоторые посетители даже приносили свой острый соус и добавляли его в наш чай..."
2000606-51 = "Я ещё приготовила маття с острым соусом. Не хочешь попробовать?"
2000606-52 = "Ни за что! Отказываюсь!"
2000606-53 = "А-а-а! Я больше не могу!"
2000606-54 = "Мне плевать, моё это творение или нет! Я не позволю ему испортить абсолютно каждое блюдо во всём Шаньхайцзине!"
2000606-55 = "С этого момента я больше не сделаю ни единой капли этого острого соуса! Производство официально прекращено!"
2000606-57 = "(Так особый острый соус Саи сняли с производства после короткого всплеска популярности.)"
2000606-58 = "(Однако говорят, что оставшиеся непроданные запасы позже продавались по баснословным ценам среди ценителей острой еды Кивотоса.)"
