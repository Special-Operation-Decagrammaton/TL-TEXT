[translation]
10059110-1 = "Episode 11: Respective Intentions"
10059110-2 = "(The next day. I visited the Art Council to handle some remaining paperwork.)"
10059110-4 = "Good day."
10059110-5 = "Have you displayed the souvenir I gave you?"
10059110-6 = "[s1] \"Good day.\"\n[s2] \"O-of course, it's hanging on the wall...\""
10059110-9 = "Fufu, I hope you and everyone else were able to appreciate the artistic sensibility dwelling within that piece."
10059110-10 = "You think so too, don't you, Sensei?"
10059110-14 = "…Oh? Your reaction seems rather dull."
10059110-15 = "Was the uniform alone not enough for you?"
10059110-16 = "To truly convey my sincerity, should I have framed what was underneath the uniform as well?"
10059110-17 = "For the record, it was black that day."
10059110-18 = "[s] \"I didn't need to know that!\""
10059110-19 = "Fufu… Manami-sama, really…"
10059110-20 = "My apologies, Sensei. #nManami-sama seems to be in an even more mischievous mood than usual today."
10059110-21 = "Perhaps she is still feeling exhilarated from what happened yesterday."
10059110-22 = "Vice President Urara."
10059110-23 = "I am being se-ri-ous."
10059110-24 = "I-is that so…!?"
10059110-29 = "Allow me to explain—"
10059110-33 = "—No, that would be tactless. Instead, a piece of advice for you, Sensei."
10059110-34 = "Manami-sama and I are two sides of the same coin."
10059110-35 = "Where Manami-sama goes, Canon follows. Please, be prepared."
10059110-36 = "[s] \"What was that!?\""
10059110-37 = "Regardless, thank you all for your hard work."
10059110-38 = "With this, the current incident has come to a close."
10059110-39 = "However… crises will surely visit us again."
10059110-40 = "In every era, the hands of mammonism reach out toward art."
10059110-41 = "…The broker of mammon."
10059110-42 = "Real name, Asuka Hattada. #nIt seems she was expelled from Highlander Railway Academy."
10059110-43 = "Using railway transport for illegal transactions is likely an application of the knowledge she gained at the academy."
10059110-44 = "Judging by the fact that she still hasn't been caught, #nthere is no doubt she possesses considerable skill."
10059110-45 = "For the time being, it appears she has backed away from our academy, #nbut there is a possibility she may approach us again using a different route."
10059110-46 = "And, there is one more of the Seven Prisoners."
10059110-47 = "The Phantom Thief of Benevolence—Akira Kiyosumi."
10059110-48 = "That thieving cat continues to steal art pieces from all over, scattering calling cards as she goes."
10059110-49 = "This is a challenge directed at me. If so, I should respond to that challenge."
10059110-50 = "The next opponent we shall face is… that thieving cat."
10059110-51 = "Does that mean… we are going to capture the phantom thief?"
10059110-52 = "But there have been countless failures in the past. She is like a mirage; visible, yet impossible to grasp. #nHave you found some effective way to deal with her?"
10059110-53 = "Yes. This incident provided an unexpected byproduct."
10059110-54 = "The other day, I obtained some reliable information."
10059110-55 = "It says that the thieving cat—"
10059110-56 = "is disguised as a student and hiding within our academy."
10059110-60 = "She has caused us enough trouble already. #nI intend to begin a capture operation here."
10059110-61 = "I will lock that cheeky thieving cat in a cage and sentence her to a life of eating nothing but canned tuna."
10059110-62 = "…Of course, along with the accomplice hiding in the academy."
10059110-63 = "There is… an accomplice? In this academy?"
10059110-64 = "I am certain of it."
10059110-65 = "If left alone, your rose garden will be devoured by pests."
10059110-66 = "We must deal with this before that happens. #nPlease, lend me your strength once again."
10059110-71 = "…Yes! Of course."
10059110-75 = "I can feel it just by listening."
10059110-79 = "A new ripple—disturbing the surface of my lake."
10059110-83 = "[ns] \"………….\""
10059110-84 = "(It feels like the real turmoil of Wild Hunt is only just beginning…)"
10059110-86 = "…Fufufu."
10059110-87 = "Everything is going according to plan."
10059110-88 = "The broker who was so difficult to control will likely be driven by revenge to share my ambitions."
10059110-89 = "The phantom thief, whose freedom is threatened, will have no choice but to keep reaching out to me."
10059110-90 = "With this, all preparations are complete."
10059110-91 = "—We are little birds waiting to hatch."
10059110-92 = "Little birds trapped in a shell called the world—a world made of hypocrisy and vanity."
10059110-93 = "But eventually, the day will come when we can hold our heads high and fly into the vast sky."
10059110-94 = "The shell will shatter, and the world will fall into chaos, but… that is fine."
10059110-95 = "For those who are about to be born—"
10059110-99 = "must first destroy one world."
10059110-101 = "The Danced-Upon Art ~The Ivory Tower and the Uninvited Guest~"
