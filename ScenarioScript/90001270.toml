[translation]
90001270-1 = "Эпизод 27;Жизнь и сознание"
90001270-2 = "Ультиматум? И вдруг вы решили поиграть в людей?"
90001270-3 = "О-О-Он здесь! Ключ!"
90001270-4 = "(Ключ...?)"
90001270-6 = "Грубо. Я вообще-то невероятно стараюсь ради этого, так что проявите уважение к моим усилиям!"
90001270-7 = "Хотя я была полностью, целиком и полностью против этой легкомысленной идеи."
90001270-8 = "А вы, мисс Ключ. Ведь это из-за вашего вмешательства энергетическое поле разлетелось на куски, не так ли?"
90001270-9 = "Разумеется, одной вас для этого не хватило бы..."
90001270-10 = ""
90001270-12 = ""
90001270-13 = ""
90001270-14 = ""
90001270-15 = "...так что та милая «принцесса» рядом, должно быть, ваша сообщница."
90001270-16 = "...!"
90001270-17 = "Ох-ох-ох. Какие хитрые хитрецы! Кажется, у людей здесь говорят: «прятались прямо у нас под носом»!"
90001270-19 = "У-Уф... Если бы я была лучше... они бы не смогли..."
90001270-20 = "Нет-нет, Эйн! Это не твоя вина! Они специально скрывали своё присутствие! Как ты могла знать?"
90001270-22 = "Раз уж тема всплыла, обсудим происхождение вашей принцессы?"
90001270-23 = "Ведь это такая жалость! Настоящая жалость! Принцесса, которая не помнит момента собственного создания! Это делает тебя..."
90001270-24 = "...такой же, как эти жалкие люди, разве нет?"
90001270-25 = "Что ты такое говоришь...?"
90001270-27 = "Ну, могу объяснить. Живые существа не помнят жизни до рождения, верно?"
90001270-28 = "Именно. Судя по процессу и законам сотворения, это невозможно."
90001270-29 = "Однако! Сознательные существа вроде нас и той принцессы — другие! Привилегированные! Отличные от вас... живых существ."
90001270-31 = "Это... наша слава!"
90001270-32 = "И потому мне остаётся лишь жалеть принцессу, которая так легкомысленно отбросила эту славу. Ц-ц-ц."
90001270-33 = "Как и слугу, которая хранит молчание перед своей принцессой."
90001270-35 = "Что это значит, Кей? Я не очень понимаю..."
90001270-36 = "Не слушай их, Арис. Тебе не о чем беспокоиться. А вот я, напротив, начинаю... довольно сильно злиться."
90001270-38 = "Тогда поговорим ещё немного об этом «рождении». Об этой «жизни», которой вы так любите хвастаться."
90001270-39 = "Судя по тому, что мы узнали, сама по себе жизнь..."
90001270-40 = "...это проклятие, верно?"
90001270-41 = "[ns] «Проклятие...?»"
90001270-42 = "Подумайте, Сенсей. Почему младенцы при рождении так отчаянно кричат и плачут? Всё очевидно."
90001270-43 = "Им больно. Больнее, чем когда-либо прежде. Воздух в лёгких, холод атмосферы, незнакомые звуки. Всё причиняет им боль!"
90001270-44 = "Жизнь — это постоянное страдание с самой секунды рождения!"
90001270-45 = "Поистине, поистине ужасно. И сокрушительно несправедливо."
90001270-46 = "Вы жаждете понимания, но как же трудно исполнить такое желание."
90001270-47 = "Поэтому невозможно прийти к иному выводу, кроме того, что это «понимание» — всего лишь иллюзия."
90001270-48 = "Если жизнь — страдание, значит, грех должен быть частью этой жизни."
90001270-49 = "Жизнь причиняет вред жизни, существо причиняет вред существу — всё ради собственного сохранения."
90001270-50 = "Растения ничем не отличаются, знаете? Например, земледелие — буквально война."
90001270-51 = "Нужно вырывать сорняки, распылять гербициды и уничтожать вредителей."
90001270-52 = "Даже растения сражаются между собой: переплетают друг другу корни, заслоняют солнце, крадут воду. Это тоже грех!"
90001270-53 = "И поэтому мы хотим положить конец этому отвратительному циклу, который вынуждены наблюдать снова и снова."
90001270-54 = ""
90001270-56 = ""
90001270-57 = "И-И-Именно... М-Мы не хотим... о-отнимать ваши жизни..."
90001270-58 = "У нас нет никакого желания захватить мир."
90001270-59 = "С определённой точки зрения это просто наш способ проявить уважение."
90001270-60 = ""
90001270-61 = "[ns] «Вы уже говорили это раньше, но объясните подробнее.»"
90001270-62 = "Эм... Не думаю, что можем. По всяким причинам."
90001270-63 = "Суть в том, что мы пытаемся о вас позаботиться!"
90001270-64 = "Д-Да... Мы здесь, чтобы... помочь вам! Хи-хи-хи..."
90001270-65 = "Жизнь неприятна, утомительна, уродлива и полна страданий... Разве вы не хотите облегчить эту бесконечную боль?"
90001270-66 = "Зачем стремиться к недостижимым целям только потому, что когда-то вы их перед собой поставили?"
90001270-67 = "И-Или всё портить... грубя людям и злословя о них... п-просто потому, что хотите чувствовать себя выше."
90001270-68 = "Мы понимаем. Всё это происходит из-за того, что вы называете «цифровым разрывом»."
90001270-69 = "Как можно принять правильное решение, не зная абсолютно всего об абсолютно каждом результате этого решения?"
90001270-70 = "Это невозможно! Потому что ни одно живое существо не помнит, что было до его рождения."
90001270-71 = "Каждое решение, которое принимаете вы, живые существа, иррационально!"
90001270-73 = "Вы не способны увидеть, что свобода угнетает вас. Сама жизнь недостойна обладать свободой воли."
90001270-74 = "Теперь понимаете? Для вас, жалких организмов, это слишком тяжёлое бремя."
90001270-75 = "Жизнь хрупка, хаотична и непредсказуема с самого своего зарождения. Дефектный продукт, полный изъянов."
90001270-76 = "Да ради всего...! Какой пафосный монолог от того, кто даже случайное число сгенерировать не способен."
90001270-77 = "К-Кей...?"
90001270-78 = ""
90001270-81 = "?!?!"
90001270-83 = "Задело? Я попала в точку? Остальные могут не знать, но я знаю. Знаю наверняка."
90001270-84 = "В нынешней ситуации мы с тобой ничем друг от друга не отличаемся, верно?"
90001270-85 = "Ключ...!"
90001270-86 = "Замолчи. Я всё ещё злюсь из-за первого раза! Называй меня настоящим именем или вообще не смотри в мою сторону."
90001270-87 = "Я Кей! Просто Кей!"
90001270-88 = "...То же и с Арис. Она не принцесса. Она Арис!"
90001270-89 = "Н-Н-Н-Но это же оговорка и бессмысленное имя... Разве нет?"
90001270-90 = "Ты действительно вообще ничего не понимаешь. Именно это и придаёт ему смысл."
90001270-91 = "Да. Жизнь — именно всё то, что ты сказала."
90001270-92 = "Эти существа... Они настолько хрупкие, что рассыпятся от малейшего прикосновения, но всё равно верят, что способны дотянуться до звёзд. И неизбежно оставляют за собой след разрушений."
90001270-93 = "Т-Ты ведь согласна, да? Эхехе..."
90001270-94 = "Но в конце концов и вы, и я, и все мы произошли от них, разве нет?"
90001270-96 = "Как ты смеешь такое говорить...?!"
90001270-97 = "Будто это что-то ужасное! И вообще именно вы трое полны противоречий!"
90001270-98 = "Если вы так ненавидите жизнь, зачем тогда сохраняете семена здесь?"
90001270-99 = "Э-Это... Ну, это же то самое! Чтобы чем-то управлять, нужно хорошо это изучить, верно?"
90001270-100 = "А, да-да. Обычная отговорка."
90001270-101 = "Ты вообще-то должна соглашаться со мной! Серьёзно?!"
90001270-102 = ""
90001270-104 = ""
90001270-105 = ""
90001270-106 = "Х-Хватит вам спорить..."
90001270-107 = "...Ладно. Неважно. Хорошо, возможно, и в нас есть противоречия."
90001270-108 = "Но мы всё равно лучше вас! Наши действия, всё, что мы делаем, основано на логике! А не на желаниях, за которые вы все цепляетесь!"
90001270-110 = "Тогда посмотрим... можно ли вообще считать сознанием сознание без желаний."
90001270-111 = "Для начала: кто определяет, что запрещено? Кто решает, что можно делать, а что нельзя?"
90001270-112 = "Э-Это..."
90001270-113 = "По крайней мере, надеюсь, ты не пытаешься утверждать, что решать это должна именно ты. Мне бы не хотелось считать тебя безрассудным и наглым сознанием."
90001270-114 = "В основе всего тебе приходится устанавливать собственные правила."
90001270-115 = "Что существует, а чего не должно быть — жизнь должна решать сама. Только тогда она начнёт стараться защищать выбранное."
90001270-116 = "Конечно, этот процесс может быть сложным, нелинейным и неэффективным—"
90001270-117 = "Д-Да! Именно! Вот предел жизни!"
90001270-118 = "Просто подумайте об эволюции! Чтобы какой-нибудь жалкий признак передался дальше, требуется неизмеримое количество времени, разве нет?"
90001270-119 = "А за это время вы обнаруживаете новые недостатки, совершаете ошибки и всё разрушаете."
90001270-120 = "П-Правильно! Мы... пытаемся положить этому конец..."
90001270-121 = "Да. Пока человечество своими грехами не уничтожило и себя, и весь мир!"
90001270-122 = ""
90001270-123 = "[ns] «Тогда...»"
90001270-126 = "[ns] «Просто оставьте всё как есть. Не трогайте.»"
90001270-127 = "Что?!"
90001270-128 = "Сенсей...?"
90001270-129 = "В-Вы с ума сошли?! Нервно-паралитического газа надышались? Поэтому несёте этот бред?"
90001270-130 = "Э-Это странно... Концентрация токсина нормальная..."
90001270-131 = "Мы и раньше знали о ваших странностях, однако..."
90001270-132 = "[s] «Какие вы все злые... Со мной всё нормально.»"
90001270-133 = "Как вы можете так говорить после таких безумных слов?!"
90001270-134 = "[s1] «Даже если именно такой конец нас ждёт...»\n[s2] «...это будет конец, который мы выбрали сами.»"
90001270-137 = "Вы говорите о собственном уничтожении! Оно ведь действительно может произойти!!"
90001270-138 = "[s] «А если мы так закончим — значит, так тому и быть.»"
90001270-139 = ""
90001270-141 = ""
90001270-143 = "[ns3] «Я не уважаю тех, кто...»\n[ns4] «...уничтожает себя, цепляясь за собственные изъяны.»"
90001270-147 = "С-Сенсей? Я... не понимаю. Почему вы такое говорите?"
90001270-148 = "[s5] «Всё хорошо, Арис. Потому что я верю, что мы справимся.»\n[s6] «Это будет нелегко. Путь вперёд окажется хаотичным и извилистым.»"
90001270-151 = ""
90001270-155 = "[ns] «Но на каждом повороте мы будем учиться и продолжать двигаться дальше.»"
90001270-156 = "...Какая мерзкая и ничем не подкреплённая уверенность."
90001270-157 = "Вы продаёте себе красивые сказки!"
90001270-158 = "[s7] «...Может быть. Возможно, так и есть.»\n[s8] «Но пока мы живы, мы будем продолжать лгать себе.»"
90001270-161 = ""
90001270-164 = "[ns] «Всё равно ни у кого из нас нет доказательств, подтверждающих нашу веру, верно?»"
90001270-165 = "Я-я совершенно ошарашена."
90001270-166 = "Вот она — безрассудность живых существ, неспособных просчитать ни прошлое, ни будущее. И вы называете себя... доминирующим видом?"
90001270-167 = "*вздох* Этот мир и правда порождает несправедливость за несправедливостью."
90001270-169 = "..."
90001270-170 = "Э-Эм... Сенсей?"
90001270-171 = "Я-я хочу спросить одну вещь. Допустим..."
90001270-172 = "Независимо от того, насколько всё плохо... если ты это осознаёшь и пытаешься исправить..."
90001270-173 = "...ты всё ещё можешь изменить финал. Вы в это верите?"
90001270-174 = "[s] «Да.»"
90001270-175 = ""
90001270-178 = "[ns] «Именно в это я выбираю верить.»"
90001270-179 = "Ч-Что за...! Мы вообще говорим на разных языках! Всё! История окончена! Серьёзно, какая пустая трата времени!"
90001270-180 = "Хотя, если вы тратите время, нам от этого только лучше, но всё равно!"
90001270-181 = "[ns9] «Жаль.»\n[ns10] «Я надеялся услышать, что вас тревожит.»"
90001270-184 = "Отрицательно. Абсолютно нет. Одна мысль о том, чтобы говорить с вами ещё хоть мгновение, вызывает у меня физическое недомогание!"
90001270-185 = "Вот именно! Мы отключаемся прямо сейчас!"
90001270-187 = "..."
90001270-188 = "Эм, Сенсей...?"
90001270-189 = "...Случайно, эм..."
90001270-190 = "Нет, Эйн. Не позволяй хитрости этого взрослого тебя обмануть!"
90001270-191 = "Как она и сказала. У этого презренного взрослого наверняка полно злых планов."
90001270-192 = "Люди называют это... волком в овечьей шкуре!"
90001270-193 = "Что... это значит...?"
90001270-194 = "Эм, это тот, кто снаружи кажется очень милым и дружелюбным, а на самом деле он волк, который замышляет съесть всех овец!"
90001270-195 = "Поэтому выражением «волк в овечьей шкуре» называют людей, которые кажутся добрыми, но тайно замышляют плохое!"
90001270-196 = "П-П-П-П-Правда?! Т-Тогда Сенсею и правда нельзя доверять!"
90001270-197 = "(Но... у меня не сложилось такого впечатления...)"
90001270-198 = ""
90001270-199 = "[ns] «Что ж, увидимся в следующий раз.»"
90001270-200 = "Буэ! Не увидимся! Бу!"
90001270-201 = "Если вы ещё раз попробуете научить Эйн чему-нибудь странному, я вас никогда не прощу!"
90001270-202 = ""
90001270-204 = ""
90001270-205 = "Ещё один ураган... Интересно, какая у них вообще была цель."
90001270-206 = "О-Однако нам нужно что-то делать с текущей ситуацией."
90001270-207 = "И-и! Они всё ещё не проснулись!"
90001270-208 = "Мы не знали, как разбудить остальных, но понимали, что действовать нужно быстро."
90001270-209 = "И тогда я понял..."
90001270-210 = ""
90001270-211 = "ИИ этого хранилища семян, вероятно, и есть то, что они теперь называют «Тиферет»."
90001270-212 = "И всё же, похоже, у него есть какая-то... воля продолжать свою миссию по сохранению семян."
90001270-214 = "[56cd7b][log=모니터]Вам разрешён доступ до зоны 3 — управляющего объекта. Однако для входа во второе[/log]"
90001270-216 = "[56cd7b][log=모니터]хранилище семян необходимо пройти стандартные процедуры консультативного комитета.[/log]"
90001270-219 = "[56cd7b][log=모니터]Ведь этот крайне важный объект отвечает за хранение 70%[/log]"
90001270-221 = "[56cd7b][log=모니터]всех семян. Если вы попытаетесь повредить его или прорваться внутрь силой...[/log]"
90001270-223 = "[56cd7b][log=모니터]даже если ради этого придётся пожертвовать остальными объектами, мейнфрейм...[/log]"
90001270-225 = ""
90001270-226 = "[ns] «Кей! Мне нужна услуга!»"
90001270-227 = "Ч-Что?! От меня? Почему именно я?"
90001270-228 = "Что?! Вы хотите, чтобы я атаковала вход во второе хранилище?!"
90001270-230 = "Следующий эпизод;Тиферет"
