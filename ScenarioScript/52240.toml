[translation]
52240-1 = "Episódio 24;O Lamento dos Demônios Diante do Rugido do Leão"
52240-2 = "Nyahaha~ Por um fio!#nHmm, ou seria por meio fio?"
52240-3 = "Eu fiquei relaxando de propósito para fazer o inimigo baixar a guarda... mas, por dentro, estava suando frio."
52240-4 = "Jamais deixaríamos passar aquele sinal transmitido por gerações na Hyakkaryouran."
52240-5 = "Fogos de artifício brancos subindo na torre do castelo são o sinal de \"problemas no Clube Yin-Yang\"."
52240-6 = "Foi o momento perfeito, não é mesmo!#nQue alívio termos chegado a tempo!"
52240-7 = "Tsc... Todo mundo aqui só é rápido na hora de fugir.#nE eu achando que dessa vez a gente ia pegar eles de vez..."
52240-8 = "M-Me arrastaram até aqui à força...#nSe eu estivesse com o Livro Macabro, vocês não seriam nada...!"
52240-9 = "Ora? Vocês estão acompanhadas de alguém bem inesperado."
52240-10 = "Essa combinação curiosa... Parece que aconteceu bastante coisa, hein."
52240-11 = "[s1] \"Niya, você está bem?\"\n[s2] \"Você não se machucou?\""
52240-14 = "Sim. Eu tenho o corpo bem resistente ♪"
52240-15 = "Além disso, contei com escoltas muito confiáveis. Graças a isso, o Festival Waraku conseguiu acontecer sem problemas.#nSensei [USERNAME], muito obrigada."
52240-16 = "[s] \"Que alívio.\""
52240-17 = "Sim, ajudou muitíssimo."
52240-18 = "Mas isso é tudo o que consegui fazer...#nJá estou no meu limite só para manter a situação sob controle."
52240-19 = "Diante do absurdo avassalador que é o Hyakumonogatari, fui completamente impotente."
52240-20 = "Acho que o dia de renunciar ao cargo de presidente do Clube Yin-Yang está próx—"
52240-26 = "...N-Nyaaagh?!"
52240-27 = "Fique quieta, por favor! Vou desinfetar o ferimento!"
52240-28 = "É-É só um arranhãozinho..."
52240-29 = "Se deixar virar cicatriz, vai ser tarde demais."
52240-30 = "Mesmo as menores coisas... precisam ser feitas na hora certa."
52240-31 = "...Nagusa-san."
52240-32 = "[s3] \"Você diz que é impotente, mas...\"\n[s4] \"Ninguém consegue fazer tudo sozinho.\""
52240-37 = "[ns] \"Eu também não sou ninguém sem as alunas.\""
52240-38 = "...Se é o Sensei quem está dizendo."
52240-43 = "Realmente, agora não é hora de ficar me lamentando."
52240-44 = "Antes de mais nada, fico muito feliz que tenham retornado em segurança.#nSensei [USERNAME], e a todas da Hyakkaryouran."
52240-45 = "E também... à pequena contadora de histórias de terror do Clube Beleza da Natureza."
52240-49 = "Dá pra parar de me chamar de pequena?!"
52240-50 = "—Primeiro, vamos organizar a situação.#nVou passar as informações que o Clube Yin-Yang reuniu."
52240-51 = "Para entender o cenário atual e traçar um plano, o primeiro passo é separar os registros dos boatos."
52240-52 = "Sim. Informações não verificadas são o nosso maior inimigo."
52240-54 = "Entendo... Então a Ayame-san..."
52240-55 = "Eu sempre senti algo meio instável vindo dela... mas não imaginava que fosse a esse ponto."
52240-56 = "Não ter percebido que a Presidente da Hyakkaryouran estava tão encurralada assim... foi falha nossa."
52240-57 = "Não, a culpa de não ter percebido o sofrimento da Ayame é minha.#nSe eu tivesse ficado mais perto dela—"
52240-58 = "A culpa é de todas nós, não é?"
52240-59 = "Eu já não disse que carregar tudo sozinha é um mau hábito seu, senpai?"
52240-60 = "Isso mesmo! Nós também deixamos a Ayame-senpai se sobrecarregar!"
52240-61 = "Dessa vez, vamos carregar esse peso todas juntas!"
52240-65 = "...Verdade. Proteger a Ayame sempre foi o objetivo de todas nós."
52240-69 = "...Quero perguntar uma coisa, Presidente Niya."
52240-70 = "É verdade que só manter o festival acontecendo já consegue conter o poder do Hyakumonogatari da Ayame... do Hitotsume?"
52240-71 = "Não. Como a Artista do Macabro disse, é apenas uma medida paliativa."
52240-72 = "É verdade que o entusiasmo do festival diminui o medo no coração das pessoas e o enfraquece, mas..."
52240-73 = "Emoções são instáveis."
52240-74 = "Quando a empolgação do festival esfriar,#no Hitotsume voltará a aparecer por toda Hyakkiyako."
52240-75 = "O maior problema é... a Presidente Ayame."
52240-76 = "A Ayame-senpai realmente é muito forte, mas..."
52240-77 = "Sim, esse é exatamente o problema."
52240-78 = "Até onde eu sei, ninguém é páreo para a Presidente Ayame."
52240-79 = "Isso... é verdade."
52240-80 = "Eu também nunca consegui vencer a Ayame nem uma única vez..."
52240-81 = "Por mais Hitotsumes que derrotemos, enquanto a origem — a Presidente Ayame — continuar intacta, eles voltarão a agir se alimentando do medo."
52240-82 = "Droga... Ela era tão confiável como aliada, mas como inimiga é assustadora."
52240-83 = "Porém, não significa que estejamos sem saída, sabiam?"
52240-84 = "Afinal, temos a \"Hyakuren\", a arma lendária capaz de perfurar um Livro Macabro, e todas vocês da Hyakkaryouran estão reunidas."
52240-85 = "Se conseguirmos avançar derrotando as aparições pela cidade até chegar à Presidente Ayame, teremos uma chance de destruir o Livro Macabro..."
52240-86 = "Mas só existe uma Hyakuren, né? Com essa quantidade de monstros pela frente..."
52240-87 = "Por isso... nós também vamos usar um Livro Macabro."
52240-88 = "Sabe como dizem, né? \"Combater veneno com veneno\"."
52240-89 = "Deixaremos que uma assombração enfrente outra assombração."
52240-90 = "Mas se não temos o principal, que é o Livro Macabro..."
52240-91 = "Sobre isso—"
52240-96 = "Hã? Do que você está falando...?"
52240-97 = "Enfrentar um Livro Macabro com outro Livro Macabro?#nSe fosse tão fácil assim de conseguir, eu não teria passado por todo esse trabalho!"
52240-98 = "Além disso, quanto tempo você acha que eu, uma contadora de histórias de terror,#nlevei para dominar o \"Ino Mononokeroku\"?#nVocês não conseguiriam nem em anos—"
52240-99 = "Nós temos o \"Ino Mononokeroku\"."
52240-100 = "...Hã?"
52240-104 = "Aqui, pode pegar."
52240-106 = "I-Isso... é o verdadeiro?!"
52240-107 = "I-Impossível... O \"Ino Mononokeroku\" deveria ter sido reduzido a cinzas..."
52240-108 = "Pois é. Quando nós o encontramos, só restavam a capa em frangalhos e alguns pedaços de página."
52240-109 = "Restaurar um livro inteiro a partir de cinzas normalmente é impossível.#nAinda mais se tratando de um Livro Macabro..."
52240-110 = "No entanto, em uma das academias com as quais mantemos contato, existe uma espécie de \"maga\" capaz de tornar esse impossível em realidade..."
52240-119 = "Uma simples aluna consertou o Ino Mononokeroku...?"
52240-120 = "Não tem como alguém fazer isso...!"
52240-126 = "...Ei, espera! Não tem nada escrito neste livro!"
52240-127 = "Mesmo para essa maga incrível, não havia como descobrir o conteúdo que foi queimado."
52240-132 = "E-Então não serve para nada!#nO poder de um Livro Macabro nasce das histórias de terror escritas nele!"
52240-133 = "Só restaurar a aparência—"
52240-136 = "Que sentido haveria em algo assim?"
52240-139 = "Não tem sentido nenhum... é..."
52240-143 = "Sim, um Livro Macabro sem nada escrito é apenas um livro comum."
52240-144 = "Sendo assim... basta escrever uma nova história nele, não é mesmo?"
52240-145 = "Pelas mãos da popular romancista \"Kuchiki Shura\"."
52240-146 = "...Kuchiki Shura?"
52240-147 = "Kuchiki Shura..."
52240-148 = "[s] \"É o pseudônimo da Shuro, não é?\""
52240-149 = "V-V-V-Você! Como é que você sabe disso?!"
52240-150 = "É claro que eu sei. Você publicava toda semana no site \"Vamos Escrever Novels!\", não era?"
52240-151 = "Eu sou fã da série que você escrevia antes, \"A Vez em que Fui para Outro Mundo, Virei Contadora de Histórias de Terror e Subi Muito de Nível\"~"
52240-153 = "U-Uwaaaaaaaaah! M-Meu estilo daquela época e o de hoje são totalmente diferentes...!"
52240-154 = "Habilidades apelonas que faziam de tudo, reviravoltas malucas tiradas direto da sua cabeça...#nEra uma obra-prima imperdível, com a seção de comentários pegando fogo a cada capítulo novo..."
52240-155 = "I-Isso, é que...!"
52240-156 = "Não, eu entendo perfeitamente.#nA verdadeira essência daquela obra eram os temas profundos escondidos em cada capítulo, certo?"
52240-157 = "Deve ter sido muito frustrante lidar com leitores incapazes de ler nas entrelinhas."
52240-161 = "...Você leu a minha novel?"
52240-162 = "Sim. Eu não disse que era fã?"
52240-163 = "Shuro-san, pare um pouco para pensar."
52240-164 = "Quando a sua história se tornar realidade pelo poder do Livro Macabro, que cara vão fazer aqueles que comentavam \"não tem realismo\"...?"
52240-165 = "Aquele sentimento frustrante e miserável de ser feita de piada sem sequer ser lida direito—"
52240-166 = "Você não gostaria de devolver na mesma moeda?"
52240-170 = "...Hmpf."
52240-171 = "Não vai ser assim tão fácil!"
52240-172 = "Eu não escrevo nenhum Hyakumonogatari que não seja para agradar a Kokuriko-sama—"
52240-173 = "Por mim, tudo bem, sabia?#nPode criar um novo Hyakumonogatari em Hyakkiyako."
52240-174 = "...Você está falando sério?!"
52240-175 = "Sim... Qual história será que vai cativar mais os leitores: a dela ou a sua? Estou bem curiosa."
52240-176 = "E-Espera aí, Presidente Niya! Se deixar ela fazer isso...!"
52240-177 = "Shh..."
52240-178 = "Parece que ela tem um plano."
52240-182 = "O-O meu Hyakumonogatari... bem aqui..."
52240-185 = "Quando compreenderes isso, certamente... obterás o livro que pertence somente a ti."
52240-188 = "Um Livro Macabro... só meu..."
52240-192 = "Qual é a sua resposta...?"
52240-200 = "...Posso mesmo escrever qualquer coisa?"
52240-202 = "Então... a próxima música é..."
52240-206 = "Chise-chan, força...!"
52240-224 = "Pina-dono, mais inimigos vindo por trás!"
52240-225 = "P-Pela frente também...! A-Assim não vai dar...!"
52240-226 = "Uuh... Achei que tinham diminuído, mas estão aumentando de novo..."
52240-227 = "Desse jeito..."
52240-232 = "Ué? Esse miado..."
52240-233 = "Um gato?"
52240-234 = "Não me diga que até aquele gato-monstro da última vez—?!"
52240-246 = "Gunyaoooooon!"
52240-250 = "...Hã, o que é aquilo?"
52240-251 = "Ele parece meio diferente daquele gato-monstro da outra vez... quer dizer, bem diferente..."
52240-252 = "Parece um rabisco de criança...?"
52240-259 = "[log=슈로]\"Renascido pelas mãos da Contadora de Histórias Macabras mais forte, o Myouki Kurokage...[/log]"
52240-261 = "[log=슈로]Transbordava uma força que fazia qualquer um tremer só de olhar...[/log]"
52240-263 = "[log=슈로]Hmm...[wa:1000] Enfim, todo mundo ficou morrendo de medo!\"[/log]"
52240-266 = "[log=슈로]\"...Enorme...[wa:1000] Seus bigodes e[wa:1000] os chifres na testa feriam tudo o que tocavam...[/log]"
52240-268 = "[log=슈로]Com uma aparência super sombria e incrível...!\"[/log]"
52240-271 = "[log=슈로]\"Sua figura rugindo ferozmente[wa:1000] já não era mais a de um gato,[/log]"
52240-273 = "[log=슈로]Era como a de um leão nobre, gigantesco e invencível...\"[/log]"
52240-277 = "Ahaha, que coisa é aquela?!"
52240-278 = "Isso também faz parte do show do Festival Waraku?"
52240-279 = "Até que é fofinho~!"
52240-280 = "Presidente, Tsukuyo-dono! Os monstros ficaram desconcertados!"
52240-281 = "Agora é a nossa chance!"
52240-282 = "M-Mas nossas armas e bombas não fazem efeito naqueles monstros..."
52240-283 = "E já ficamos sem ideias para montar armadilhas ou atrair eles para outro lugar..."
52240-286 = "Ah...! Quando foi que ele chegou tão perto...?!"
52240-289 = "Tsukuyo-dono, cuidado!"
52240-297 = "Os tiros... acertaram?"
52240-298 = "M-Mas como...?"
52240-302 = "Ei, que tipo de desenvolvimento é esse...?"
52240-303 = "Se vai ter uma virada épica contra um inimigo forte, não devia ter um pouco mais de preparação ou sei lá...?"
52240-304 = "É por isso que leitores amadores são um saco! O clichê clássico nessa hora é...!"
52240-309 = "[log=슈로]\"Naquele momento... ao lado do leão,[wa:1000] hã... estavam os Ninjas Supremos que lutavam ao seu lado!\"[/log]"
52240-318 = "Uau?! D-De repente senti uma força incrível surgindo dentro de mim!"
52240-319 = "Presidente, não sabia que existia um jutsu assim!"
52240-320 = "Hã, eu não conheço isso não... que medo!"
52240-321 = "D-De qualquer forma, assim conseguiremos conter os monstros! Vamos proteger o palco!"
52240-326 = "Clube de Pesquisa Ninjutsu, avançar!"
