[translation]
52240-1 = "Эпизод 24;Крик облегчения"
52240-2 = "Нья-ха-ха! Вот это и называют «успели в последний момент»."
52240-3 = "Я делала вид, будто совершенно спокойна, чтобы они ничего не заподозрили... но что бы я делала, если бы вы правда не пришли? Нья-ха-ха!"
52240-4 = "Как мы могли не ответить?"
52240-5 = "Это же наша традиция. Один белый фейерверк, запущенный с Тэнсюкаку, — сигнал клуба Инь-Ян о помощи."
52240-6 = "Вовремя как никогда!"
52240-7 = "Ц... Эти типы из «Красоты природы» всё же чертовски шустрые. Каждый раз кажется, будто я уже схватила их за хвост, а они снова ускользают, как змеи."
52240-8 = "...Чего уставились?"
52240-9 = "О? Вот это неожиданно."
52240-10 = "Необычная компания, ничего не скажешь. Похоже, у вас было настоящее приключение."
52240-11 = "[s1] «А ТЫ сама в порядке, Ния?»\n[s2] «Серьёзных ран нет?»"
52240-14 = "Да-да. Я крепче, чем выгляжу."
52240-15 = "И благодаря твоей надёжной охране Фестиваль Вараку не пришлось отменять."
52240-16 = "[s] «Рад, что всё получилось.»"
52240-17 = "На самом деле твоя помощь была бесценна."
52240-18 = "С другой стороны, даже мои возможности ограничены."
52240-19 = "Какая нелепость... «Сто историй о призраках»... Они сделали меня совершенно бесполезной."
52240-20 = "Возможно, пора мне оставить пост президента клуба Инь-Ян..."
52240-21 = ""
52240-24 = ""
52240-25 = ""
52240-26 = "Н-Нья-а-а?!"
52240-27 = "Пожалуйста, не двигайтесь! Вы мешаете обработать рану!"
52240-28 = "Э-Эта маленькая царапина может подождать..."
52240-29 = "Если не обработать сейчас, на лице может остаться большой шрам."
52240-30 = "Неважно, большое дело или маленькое — упустишь правильный момент, назад уже не вернёшь."
52240-31 = "...Нагуса."
52240-32 = "[s3] «Всем иногда нужна помощь.»\n[s4] «Тебе кажется, что без моей помощи ты ничего не можешь...»"
52240-33 = ""
52240-34 = ""
52240-36 = ""
52240-37 = "[ns] «...но без каждого из вас я сам был бы никем.»"
52240-38 = "...Как скажете, Сенсей."
52240-39 = ""
52240-41 = ""
52240-42 = ""
52240-43 = "Вы правы. Сейчас не время для отчаяния и жалоб."
52240-44 = "Для начала хочу поприветствовать каждого из вас с благополучным возвращением в наш район: Сенсея [USERNAME], Хяккарёран..."
52240-45 = "...а также маленькую барда из «Красоты природы»."
52240-46 = ""
52240-48 = ""
52240-49 = "Кого ты назвала маленькой?!"
52240-50 = "Давайте приведём всё к общему знаменателю. Начну с информации, которую клуб Инь-Ян собрал на данный момент."
52240-51 = "Нельзя строить план, пока мы не понимаем ситуацию полностью. Нужно отделить факт от вымысла, реальность от иллюзии."
52240-52 = "Да. Слухи и шёпот нас погубят."
52240-54 = "Понятно. Вот куда привёл путь Аямэ..."
52240-55 = "Я чувствовала её внутреннюю хрупкость, но всегда предпочитала не замечать. В конце концов, она так старательно укрепляла её идеально выстроенным образом."
52240-56 = "Это моя халатность. Давление президентства Хяккарёран всё это время её раздавливало."
52240-57 = "Я... Я даже не заметила. Именно я должна была лучше всех понимать её страдания."
52240-58 = "...Нельзя сваливать всю вину на одного человека."
52240-59 = "Сколько раз мне повторять, Нагуса? Твоя привычка взваливать на себя все беды мира — ужасная черта."
52240-60 = "Именно! Каждая из нас глубоко в душе чувствует боль Аямэ!"
52240-61 = "И в следующий раз мы схватим её и прижмём так крепко, чтобы она больше никогда не чувствовала себя так!"
52240-62 = ""
52240-64 = ""
52240-65 = "...Да. Мы все вместе искренне желаем её безопасного возвращения."
52240-66 = ""
52240-68 = ""
52240-69 = "Можно задать вопрос, президент Ния?"
52240-70 = "Правда ли этого фестиваля будет достаточно, чтобы подавить силу Фантомного сказания президента Аямэ — Хитоцумэ?"
52240-71 = "Совсем нет. Как сказала та художница-призрак, это лишь временная мера."
52240-72 = "Радость и пыл фестиваля среди хаоса помогли ослабить силу Фантомного сказания..."
52240-73 = "...но эмоции переменчивы."
52240-74 = "Как только новизна и волнение улягутся, взгляд Хитоцумэ снова вскоре сожмёт Хяккияко."
52240-75 = "Но самая большая преграда — Аямэ..."
52240-76 = "Есть ещё что-то, что мучает президента Аямэ?"
52240-77 = "Скорее, проблема в ней самой."
52240-78 = "Кто вообще способен с ней справиться? Аямэ всегда была сильнейшей в Хяккарёран."
52240-79 = "Э-Это отрицать невозможно..."
52240-80 = "Даже мне ни разу не удалось победить Аямэ в тренировочном бою."
52240-81 = "И пока существует президент Аямэ, будет существовать и Хитоцумэ. Он будет питаться людским страхом и восстанавливаться снова и снова."
52240-82 = "Чёрт... Она была нашим самым надёжным союзником... а теперь стала самым опасным врагом."
52240-83 = "Но мы ещё не исчерпали все варианты."
52240-84 = "Ваш легендарный пистолет Сотня Лотосов способен пробить их тома и монстров. И ещё у нас есть все вы, прекрасные участницы Хяккарёран."
52240-85 = "Будем развеивать Духов артефактов на улицах одного за другим и найдём возможность уничтожить том."
52240-86 = "Сотня Лотосов одна, а монстров там примерно миллион. Как нам со всеми ними драться?"
52240-87 = "Ну, можно ещё... противопоставить им силу другого тома."
52240-88 = "Как говорится, клин клином вышибают."
52240-89 = "Лучший способ бороться с непобедимой силой — использовать против неё такую же."
52240-90 = "У тебя есть собственный том?"
52240-91 = "Ну—"
52240-93 = ""
52240-96 = "А? Что за бред ты несёшь?"
52240-97 = "Том против тома? Думаешь, я бы сидела здесь сложа руки, если бы томы так легко доставались?"
52240-98 = "Даже мне, барду «Красоты природы», понадобилась уйма времени, чтобы научиться контролировать «Фантомные записи Ино»! Даже если вам каким-то чудом удастся найти один—"
52240-99 = "Да. Именно он. «Фантомные записи Ино»."
52240-100 = "Что...?"
52240-101 = ""
52240-103 = ""
52240-104 = "Вот. Возьми."
52240-106 = "Это... «Фантомные записи»?"
52240-107 = "Н-Не может быть. Вы же в прошлый раз всё испортили и сожгли их, разве нет...?"
52240-108 = "Именно. Нам удалось спасти только обугленную обложку и несколько разорванных страниц."
52240-109 = "С такими жалкими остатками восстановить обычную книгу было бы почти невозможно, не говоря уже о проклятом томе."
52240-110 = "Но нам повезло! У нас очень хорошие отношения с академией, которая утверждает, что располагает собственной волшебницей. Она умеет восстанавливать целые книги из обрывков."
52240-112 = ""
52240-113 = ""
52240-114 = ""
52240-115 = ""
52240-117 = ""
52240-118 = ""
52240-119 = "Хочешь сказать... какая-то обычная человеческая волшебница восстановила «Фантомные записи Ино»?"
52240-120 = "Не может быть! Не верю!"
52240-121 = ""
52240-123 = ""
52240-124 = ""
52240-125 = ""
52240-126 = "...Она совершенно пустая?! Здесь ничего нет!"
52240-127 = "Ну разумеется. Даже волшебница не могла достать содержимое из воздуха. Страницы ведь полностью сгорели."
52240-128 = ""
52240-130 = ""
52240-132 = "Тогда она бесполезна! Сила тома исходит из написанных внутри историй!"
52240-133 = "Даже если у вас красивая обложка, которая выглядит точно так же..."
52240-135 = ""
52240-136 = "А, та потрёпанная книжка с историями о призраках? Зачем тебе вообще нужна эта старая вещь?"
52240-138 = ""
52240-139 = "...без историй она ничего не стоит."
52240-140 = ""
52240-142 = ""
52240-143 = "Ты права. Без них том не лучше стопки бумаги, правда?"
52240-144 = "Тогда почему бы просто не написать собственные истории?"
52240-145 = "Хм, знаменитая писательница Кутики Сюра?"
52240-146 = "...Кутики Сюра?"
52240-147 = "Кутики Сюра, то есть..."
52240-148 = "[s] «Это ведь псевдоним Сюро, да?»"
52240-149 = "К-Как ты это знаешь?!"
52240-150 = "О боже, как мне не знать? Ты ведь каждую неделю публикуешь рассказы на сайте «Давайте писать романы», разве нет?"
52240-151 = "Лично я была огромной поклонницей «Я стала бардом-призраком и в одиночку прокачалась в новом мире!»"
52240-153 = "Ч-Чего-о-о?! ЧЕГО-О-О!"
52240-154 = "Разумеется, бешеный темп и читерские способности сделали её спорным шедевром, поэтому комментарии с каждым обновлением превращались в настоящую войну..."
52240-155 = "Э-Это потому что...!"
52240-156 = "Даже не объясняй. Суть твоей работы была вовсе не в этих банальных тропах, а в исследовании глубоких тем за ними, верно?"
52240-157 = "Я искренне тебе сочувствую. Как же невыносимо, когда люди не видят и не понимают твои художественные решения."
52240-158 = ""
52240-160 = ""
52240-161 = "Ты... Ты правда читала мои работы?"
52240-162 = "Я же сказала, что они мне нравились."
52240-163 = "Ну что скажешь, писательница Сюро?"
52240-164 = "Этот том способен воплощать твои истории в реальность. Представь лица всех тех, кто сомневался и смеялся над твоими нереалистичными сюжетными поворотами."
52240-165 = "Что ты чувствовала, когда никто не понимал твоих текстов? Раздражение? Отчаяние? Злость, от которой едва хватало воздуха?"
52240-166 = "Разве тебе не хочется... заставить их почувствовать то же самое?"
52240-167 = ""
52240-169 = ""
52240-170 = "*ахает*"
52240-171 = "Н-Не пытайся мне льстить! Я не стану вам помогать!"
52240-172 = "Я делаю то, чего хочет Кокурико! Хочу создать для неё новые «Сто историй о призраках»! И всё!"
52240-173 = "И это нормально. Даже если ты распространишь по Хяккияко новые истории о призраках — нормально."
52240-174 = "Ч-Что? Серьёзно?"
52240-175 = "Я хоть раз тебе солгала? Более того, мне даже любопытно: к чьим историям потянутся люди — к твоим или к той художнице-призраку?"
52240-176 = "Постой, президент Ния. Не думаю, что это поможет ситуации—"
52240-177 = "Тс-с."
52240-178 = "Пока просто посмотрим, что будет."
52240-179 = ""
52240-181 = ""
52240-182 = "Мои собственные... «Сто историй о призраках»..."
52240-184 = ""
52240-185 = "Поймёшь это — и однажды у тебя появится собственный том."
52240-187 = ""
52240-188 = "Мой собственный том..."
52240-189 = ""
52240-191 = ""
52240-192 = "Ну что скажешь?"
52240-193 = ""
52240-195 = ""
52240-196 = ""
52240-197 = ""
52240-198 = ""
52240-200 = "Я правда могу написать... всё, что захочу?"
52240-202 = "Тогда... следующая песня..."
52240-203 = ""
52240-206 = "Держись, Чисэ! У тебя получится!"
52240-207 = ""
52240-209 = ""
52240-219 = ""
52240-220 = ""
52240-221 = ""
52240-222 = ""
52240-224 = "Нас обходят с фланга, Пина!"
52240-225 = "И спереди тоже! Нас полностью превосходят числом!"
52240-226 = "Ух... Казалось, некоторое время преимущество было у нас, но потом они внезапно опять начали размножаться."
52240-227 = "Мы долго так не продержимся..."
52240-228 = ""
52240-230 = ""
52240-232 = "А? Кто-то... кричит?"
52240-233 = "Или кошка плачет?"
52240-234 = "Ах! Это может быть тот монстр с прошлого—"
52240-235 = ""
52240-237 = ""
52240-242 = ""
52240-243 = ""
52240-244 = ""
52240-245 = ""
52240-246 = "НЯ-А-А-А-А!"
52240-247 = ""
52240-249 = ""
52240-250 = "...Что это за жалкое создание?"
52240-251 = "Оно... совсем не похоже на монстра-кота, который напал на нас на прошлом фестивале."
52240-252 = "Это что, ребёнок нарисовал?"
52240-254 = ""
52240-255 = ""
52240-256 = ""
52240-257 = ""
52240-259 = "[log=슈로]«В руках величайшего барда-призрака из всех существовавших Мёки Курокагэ был возрождён...[/log]"
52240-261 = "[log=슈로]Достаточно было взглянуть, чтобы понять, насколько он силён...[/log]"
52240-263 = "[log=슈로]В общем, он был настолько страшным, что все дрожали перед ним...»[/log]"
52240-266 = "[log=슈로]«Итак... [wa:1000]Он был гигантским,[wa:1000] с длинными усами, а его огромный рог мог пронзить что угодно...[/log]"
52240-268 = "[log=슈로]Выглядел он суперазлодейски».[/log]"
52240-271 = "[log=슈로]«Он рычал как большая кошка... [wa:1000]Нет, как благородный и могучий зверь...[/log]"
52240-273 = "[log=슈로]Точно, он выглядел как огромный лев...»[/log]"
52240-277 = "Ха-ха-ха! Что это вообще такое?"
52240-278 = "Может, часть Фестиваля Вараку?"
52240-279 = "Он даже немного милый, правда?"
52240-280 = "Президент, Цукуё! Монстры растерялись!"
52240-281 = "Наш шанс переломить ход боя! Внезапная атака!"
52240-282 = "К-Как? Мы не можем их ни застрелить... ни взорвать..."
52240-283 = "Баррикады и хитрости тоже не работают..."
52240-285 = ""
52240-286 = "Ик?! К-Когда ты успел подойти так близко...?"
52240-287 = ""
52240-289 = "Цукуё, осторожно!"
52240-291 = ""
52240-295 = ""
52240-296 = ""
52240-297 = "Наша атака... только что попала?"
52240-298 = "Что вообще сейчас происходит?"
52240-300 = ""
52240-301 = ""
52240-302 = "Стой! Даже если это вымысел, разве это не перебор?"
52240-303 = "Каким бы сильным ни был противник, правила всё равно нужно соблюдать! Ты сама рушишь собственный сюжет!"
52240-304 = "Именно такие читатели-дилетанты, как ты, тормозят литературу! Для такой ситуации существует только один троп!"
52240-305 = ""
52240-307 = ""
52240-309 = "[log=슈로]«И в этот момент...[wa:1000] появилась безумно сильная ниндзя».[/log]"
52240-312 = ""
52240-314 = ""
52240-315 = ""
52240-317 = ""
52240-318 = "Уа?! Изуна чувствует... невероятную силу, бурлящую внутри!"
52240-319 = "Что происходит, президент?"
52240-320 = "Я... понятия не имею... Мне уже страшно..."
52240-321 = "Н-Ну... по крайней мере теперь мы можем драться с монстрами! Нужно защитить... сцену!"
52240-322 = ""
52240-324 = ""
52240-325 = ""
52240-326 = "Клуб исследования ниндзюцу! В атаку!"
