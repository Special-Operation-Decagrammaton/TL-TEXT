31040-169 = "Aluna do 2º ano do Clube de Aulas de Reforço, Shirasu Azusa."
31040-170 = "Enquanto era perseguida pelo Comitê de Justiça sob suspeita de atos violentos dentro da escola, ocupou o depósito de munição de gás lacrimogêneo de uso didático."
31040-171 = "Detonou cerca de 1 tonelada de bombas de gás lacrimogêneo e foi detida após 3 horas de resistência."
31040-172 = "Até o último instante antes de sua captura, resistiu ferozmente utilizando diversas armadilhas e explosivos improvisados (IEDs). Múltiplos danos registrados."
31040-174 = "Próximo;As Alunas do Clube de Aulas de Reforço (2)"
