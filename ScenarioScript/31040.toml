[translation]
31040-1 = "Episódio 4;As Alunas do Clube de Aulas de Reforço (1)"
31040-3 = "B-Bem, hum, é que..."
31040-4 = "Aquelas circunstâncias inevitáveis que me trouxeram até aqui foram..."
31040-5 = "É que eu matei uma prova para ir a um show surpresa do Peroro-sama... e aí..."
31040-6 = "[s] \"...\""
31040-7 = "Uuu..."
31040-8 = "N-Não me olhe com esse olhar tão frio, por favooor...! Eu juro que tinha conferido o calendário das provas direitinho! Foi algum tipo de engano, ou melhor, uma confusão..."
31040-9 = "..."
31040-10 = "Auuu... M-Me desculpe..."
31040-11 = "[s] \"Não, você não precisa pedir desculpas pra mim...\""
31040-12 = "S-Sim. Hum, então..."
31040-13 = "É que... a Nagisa-sama me pediu para dar suporte a você, Sensei..."
31040-15 = "...E por isso, Hifumi-san. Além de ajudar o Sensei, você poderia guiar o Clube de Aulas de Reforço por mim?"
31040-16 = "Quê!? E-Eu!?"
31040-17 = "Sim. Para começo de conversa, é algo que só uma aluna exemplar como você, Hifumi-san, seria capaz de fazer."
31040-18 = "E-Eu não chego nem perto de ser uma aluna exemplar... Na verdade, minhas notas são bem na média... e agora estou até correndo o risco de reprovar..."
31040-19 = "Fufu. É que eu tenho em altíssima conta o seu \"amor\", Hifumi-san. Além disso, agora é a sua vez de retribuir o meu \"amor\"... não é mesmo?"
31040-20 = "A-Auuu..."
31040-21 = "Fufu. Sendo assim, conto com você, Presidente do Clube de Aulas de Reforço."
31040-24 = "[ns] \"Então você é a presidente do clube...!?\""
31040-25 = "É-É só de forma provisória, mas... o Clube de Aulas de Reforço já é mesmo um clube temporário criado em circunstâncias especiais..."
31040-26 = "Q-Quando todas nós escaparmos da reprovação, o clube deve deixar de existir naturalmente."
31040-27 = "P-Por isso, hum... até lá, conto com você, Sensei."
31040-28 = "[s] \"Sim. Conto com você também, Hifumi.\""
31040-29 = "Apesar de estarmos nessa situação... que bom que o responsável por nós é você, Sensei."
31040-30 = "Ah, você ainda não conheceu as outras integrantes do Clube de Aulas de Reforço, não é?"
31040-31 = "Conferi a lista de membros e parece que somos quatro no total, contando comigo."
31040-32 = "Por ora, vamos lá conhecê-las, Sensei? Primeiro, precisamos nos reunir para bolar um plano e descobrir como escapar da reprovação..."
31040-35 = "[ns] Seguir a Hifumi."
31040-38 = "Sala do Comitê de Justiça"
31040-39 = "[ns] \"Aqui é...\""
31040-40 = "A-Au... Eu não queria muito ter que vir aqui, mas..."
31040-41 = "Hum, com licença... Tem alguém aí?"
31040-45 = "..."
31040-46 = "Ah, o-olá."
31040-47 = "..."
31040-48 = "H-Hum..."
31040-49 = "...O quê?"
31040-50 = "A-Au... É-É que..."
31040-51 = "..."
31040-52 = "Auuu... S-Será que eu fiz alguma coisa de errado...?"
31040-53 = "[s] \"Acho que ela só é um pouquinho tímida com estranhos.\""
31040-54 = "...Q-Quem aqui é tímida com estranhos!?"
31040-55 = "E-Eu só estou em alerta porque vocês são pessoas que eu não conheço, só isso!?"
31040-56 = "[s] \"Mas não é exatamente isso que chamam de 'tímida com estranhos'...?\""
31040-57 = "Ugh..."
31040-58 = "...E-Enfim, o que vocês querem com o Comitê de Justiça?"
31040-59 = "H-Hum... Estamos procurando uma pessoa..."
31040-60 = "Hã!? Quer dizer que vieram pedir pro Comitê de Justiça procurar alguém?"
31040-61 = "Vocês estão achando que a gente é um grupo de voluntárias ou o quê? Não estamos tão desocupadas assim, tá?"
31040-62 = "Não, hum, é que me disseram que ela está presa aqui..."
31040-63 = "...Hã?"
31040-64 = "Quer dizer, hum, é que tem uma pessoa que fez algo indevido e está aqui..."
31040-65 = "Quê, não me diga que está falando da...?"
31040-70 = "Olá. Por acaso estão procurando por mim?"
31040-71 = "!? !?"
31040-72 = "!?"
31040-73 = "[s] \"!?\""
31040-74 = "Quê, hã, como assim!? C-Como você saiu da cela!? Eu tranquei a porta direitinho!?"
31040-76 = "Não, estava aberta, viu? Ouvi vozes que pareciam estar falando de mim, então resolvi vir dar uma olhada. Precisam de alguma coisa?"
31040-77 = "Ora. Um adulto, o que significa que... você é o Sensei, não é? Mais uma vez, olá. Entendo, por acaso vieram pelo Clube de Aulas de Reforço?"
31040-78 = "E-Espera aí!! Não saia andando por aí vestida desse jeito!? Ei, volta aqui!!"
31040-83 = "Ura"
31040-85 = "wa"
31040-89 = "Ha"
31040-91 = "na"
31040-93 = "ko"
31040-95 = "Aluna do 2º ano do Clube de Aulas de Reforço, Urawa Hanako."
31040-96 = "Flagrada e detida pelo Comitê de Justiça enquanto perambulava pela escola de maiô."
31040-97 = "Atualmente sob detenção do Comitê de Justiça (ou pelo menos deveria estar)."
31040-101 = "...? Algum problema, Shimoe-san?"
31040-102 = "É claro que tem problema!? Por que você está perambulando pela escola de maiô!?"
31040-103 = "Mas na piscina, que também fica dentro do campus da escola, todas usam maiô normalmente, não é? E aqui também não deixa de ser dentro do campus... Ah, ou será que a Shimoe-san é do tipo que não usa maiô na piscina?"
31040-104 = "Quê, hã? Como assim..."
31040-105 = "Ah, então era isso? A Shimoe-san prefere nadar completamente nua. Como esperado do Comitê de Justiça, cobrindo até mesmo esse tipo de modalidade."
31040-106 = "T-Tá maluca!? É claro que eu uso maiô!? C-Como é que eu faria uma coisa dessas...!"
31040-107 = "Ainda assim, pensar que a nudez é a verdadeira justiça... É uma visão bastante vanguardista. Eu nunca havia refletido muito sobre isso, mas entendo. Experimentar qualquer dia desses pode ser bem interessante..."
31040-108 = "E-Enfim, volta logo pra lá, rápido! As minhas veteranas já estão quase chegando!"
31040-109 = "Ora, mas essas pessoas vieram me ver—"
31040-110 = "Cala a boca, cala a boca, sua criminosa indecente!! Volta logo!!"
31040-111 = "Peço desculpas, parece que a situação por aqui está um tanto confusa, então nos vemos mais tarde, está bem?"
31040-116 = "..."
31040-117 = "[s] \"...\""
31040-120 = "Arf, arf..."
31040-121 = "H-Hum..."
31040-122 = "O que está acontecendo aqui, afinal...? O que vai ser da Hanako-san depois disso?"
31040-123 = "Pena de morte, é óbvio! Coisas pervertidas são proibidas! Pena capital!"
31040-124 = "A-Acho que não pode ser para tanto, mas..."
31040-125 = "Ela saiu andando pela escola de maiô, sabia!? Em plena luz do dia! Bem no meio da praça lotada de alunas!!"
31040-126 = "..."
31040-127 = "Mas dentro da escola devemos vestir as roupas determinadas pelo regulamento escolar, não é? Por isso mesmo eu estava usando direitinho o maiô oficial da escola..."
31040-128 = "E por que tinha que ser o maiô!? Era só vestir o uniforme escolar, não é!? Aliás, não se mete na conversa!"
31040-129 = "Auuu, b-bom, por enquanto..."
31040-130 = "P-Parece que vai ser um pouco difícil conversar com a Hanako-san agora..."
31040-131 = "Que tal irmos conhecer a próxima integrante primeiro...?"
31040-132 = "Vejamos..."
31040-133 = "A outra é... a Shirasu Azusa-san."
31040-136 = "Estamos de volta."
31040-137 = "Missão cumprida! Capturamos Shirasu Azusa-san em flagrante!"
31040-139 = "Quê... Quêêê!?"
31040-140 = "Ah, Hasumi-senpai, Mashiro."
31040-141 = "Bom trabalho, Koharu-san. Ué...?"
31040-142 = "Sensei [USERNAME]?"
31040-147 = "(Fiuuu, fiuuu...)"
31040-148 = "..."
31040-149 = "[s] \"...\""
31040-150 = "...Foi por pouco. Se eu tivesse munição suficiente, teria levado mais algumas comigo."
31040-151 = "Já chega, façam o que quiserem. Mas já aviso que recebi treinamento para resistir a tortura, então não vai ser tão fácil me fazer abrir a boca."
31040-152 = "(Fiuuu, fiuuu...)"
31040-157 = "Shi"
31040-159 = "rasu"
31040-163 = "A"
31040-165 = "zu"
