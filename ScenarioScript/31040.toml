31040-48 = "П-Простите..."
31040-49 = "Что?"
31040-50 = "Н-Ну, я, эм..."
31040-51 = "..."
31040-52 = "Нас игнорируют...?"
31040-53 = "[s] «Может, она стесняется.»"
31040-54 = "К-Кого ты назвал стеснительной?!"
31040-55 = "Я просто настороженно отношусь к незнакомцам!"
31040-56 = "[s] «Это и называется стесняться.»"
31040-57 = "..."
31040-58 = "Что вам нужно в Комитете правосудия?"
31040-59 = "Э-Эм... Мы ищем кое-кого."
31040-60 = "Что?! Вы думаете, Комитет правосудия ищет пропавших людей?"
31040-61 = "Это не сюда. Мы не волонтёры."
31040-62 = "Н-Нет, мы не это имели в виду. Нам сказали, что человек, которого мы ищем, задержан здесь."
31040-63 = "Его заперли?"
31040-64 = "З-За... нарушение порядка. Так что, эм..."
31040-65 = "А?"
31040-66 = ""
31040-67 = ""
31040-69 = ""
31040-70 = "Вы пришли за мной?"
31040-71 = "...?!"
31040-72 = "...?!"
31040-73 = "[s] «...?!»"
31040-74 = "Ч-Что за?! Как ты выбралась из камеры?! Я точно помню, что заперла её!"
31040-76 = "То есть ты не хотела оставить её открытой? Я просто вышла, когда услышала, что кто-то меня ищет. Чем могу помочь?"
31040-77 = "Не ожидала увидеть здесь учителя. Значит, вы руководите Клубом дополнительных занятий, да?"
31040-78 = "Х-Хватит любезностей, иди оденься! Кто вообще ходит в купальнике, чудачка?!"
