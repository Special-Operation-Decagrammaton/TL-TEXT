31040-169 = "Второкурсница из Клуба дополнительных занятий: Ширасу Азуса"
31040-170 = "Заняла склад слезоточивого газа, скрываясь от преследования за насильственные действия на территории школы."
31040-171 = "Затем три часа использовала слезоточивый газ, сопротивляясь задержанию, пока Комитет правосудия наконец её не схватил."
31040-172 = "До самого ареста уходила от поимки, устанавливая ловушки и самодельные взрывные устройства."
