31040-120 = "*тяжело дышит* *тяжело дышит*"
31040-121 = "Эм, так..."
31040-122 = "Что теперь будет с Ханако?"
31040-123 = "Разве не очевидно?! Наказание за непристойность — смерть! Казнить на месте!"
31040-124 = "Н-Не думаю, что стоит заходить так далеко..."
31040-125 = "Она ходила по школе в купальнике! Посреди дня! По площади, полной людей!"
31040-126 = "..."
31040-127 = "Не понимаю. Я знаю, что у нас есть дресс-код, поэтому и выбрала школьный купальник."
31040-128 = "Почему ты просто не надела обычную форму?!"
31040-129 = "Ох."
31040-130 = "С Ханако сейчас будет трудно разговаривать."
31040-131 = "Почему бы нам не встретиться со следующей участницей?"
31040-132 = "Эм, посмотрим..."
31040-133 = "Следующая участница... Ширасу Азуса."
31040-134 = ""
31040-136 = "Мы вернулись."
31040-137 = "Миссия выполнена! Ширасу Азуса успешно задержана!"
31040-139 = "Что?! Не может быть!"
31040-140 = "О, вы вернулись, Хасуми. Маширо."
31040-141 = "Спасибо, что присматривала, Кохару... Погоди..."
