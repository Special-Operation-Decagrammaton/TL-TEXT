31040-95 = "Второкурсница из Клуба дополнительных занятий: Урава Ханако."
31040-96 = "Арестована за прогулки по кампусу в школьном купальнике."
31040-97 = "В настоящее время находится под стражей Комитета правосудия."
31040-99 = ""
31040-101 = "Хм? Что-то не так, мисс Шимоэ?"
31040-102 = "Н-Нельзя носить купальник на территории школы! Это же здравый смысл!"
31040-103 = "Хм? Но школьный бассейн тоже находится на территории школы... Вы предпочитаете плавать без купальника, мисс Шимоэ?"
31040-104 = "А? Что за...?"
31040-105 = "Не ожидала, что вы любите плавать нагишом. Хотя я слышала, Комитет правосудия любит подавать пример."
31040-106 = "Не говори глупостей! Кто вообще говорил о предпочтениях?!"
31040-107 = "Вы настаиваете, что нудизм — единственно допустимый образ жизни? Как авангардно. Радикально, конечно, но, возможно, стоит исследовать..."
31040-108 = "Да вернись уже в камеру! Мои старшие вот-вот придут!"
31040-109 = "О боже. Они тоже идут, чтобы посмотреть на меня?"
31040-110 = "Замолчи! Замолчи! Просто залезай обратно!"
31040-111 = "Пока-пока, все. Я немного занята, так что увидимся в другой раз."
