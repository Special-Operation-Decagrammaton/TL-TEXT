[translation]
31040-1 = "Эпизод 4;Отстающие студенты, часть 1"
31040-2 = ""
31040-3 = "Т-Так вот..."
31040-4 = "...это не моя вина."
31040-5 = "Было внезапное шоу Пероро, и мне пришлось пропустить обычный экзамен, чтобы туда попасть. В-Вот поэтому я теперь отстаю."
31040-6 = "[s] «...»"
31040-7 = "..."
31040-8 = "Н-Не смотрите на меня так! Я была уверена, что проверила дату экзамена, но, наверное, ошиблась. Да..."
31040-9 = "..."
31040-10 = "Простите..."
31040-11 = "[s] «Не думаю, что тебе есть за что извиняться.»"
31040-12 = "Д-Да. Так вот что произошло..."
31040-13 = "...Нагиса попросила меня помогать вам, Сенсей."
31040-15 = "Вот как обстоят дела. Поможешь Сенсею руководить Клубом дополнительных занятий, Хифуми?"
31040-16 = "Что?! Я-я?!"
31040-17 = "Да. Это ответственность, с которой справится только такой образцовый студент, как ты."
31040-18 = "Я-я не образцовый студент. У меня всегда были средние оценки... и это ещё до того, как я начала отставать."
31040-19 = "Ха-ха. Я всегда считала тебя довольно сострадательной. К тому же не пора ли вернуть мне должок?"
31040-20 = "Ну..."
31040-21 = "Ха-ха. Сочту это согласием. Рассчитываю на тебя, президент Клуба дополнительных занятий."
31040-23 = ""
31040-24 = "[ns] «Ты президент клуба?!»"
31040-25 = "Э-Это просто временное звание. Клуб дополнительных занятий сам по себе временный."
31040-26 = "Нас распустят, как только все снова подтянут оценки."
31040-27 = "Н-Но до тех пор я буду работать вместе с вами, Сенсей."
31040-28 = "[s] «Рассчитываю на тебя, Хифуми.»"
31040-29 = "Я рада, что вы здесь. Иначе даже не знаю, что бы делала..."
31040-30 = "О, а вы уже познакомились с остальными участницами Клуба дополнительных занятий?"
31040-31 = "Их должно быть ещё трое. Я посмотрела список, чтобы узнать, кто это."
31040-32 = "Пойдём познакомимся с ними, Сенсей. Нам будет чем заняться: и учить, и придумывать план, как не дать им снова провалиться."
31040-33 = ""
31040-34 = ""
31040-35 = "[ns] Следовать за Хифуми."
31040-38 = "Клубная комната Комитета правосудия"
31040-39 = "[ns] «Погодите. Разве это не...?»"
31040-40 = "О нет. Никогда не люблю сюда приходить."
31040-41 = "Здравствуйте... Здесь кто-нибудь есть? Алло?"
31040-42 = ""
31040-43 = ""
31040-44 = ""
31040-45 = "..."
31040-46 = "З-Здравствуйте."
