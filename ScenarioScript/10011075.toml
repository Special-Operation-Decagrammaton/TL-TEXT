[translation]
10011075-2 = ""
10011075-7 = "Хорошо-хорошо! Вы прошли! Поздравляю!"
10011075-8 = "*тяжело дышит* *тяжело дышит* Всё закончилось?"
10011075-9 = "Да, мэм! Мне нужно доложить начальству. Сейчас вернусь!"
10011075-10 = ""
10011075-12 = ""
10011075-13 = "[ns] «Надеюсь, теперь всё.»"
10011075-15 = "В-Вы двое! Вы в порядке?"
10011075-16 = "Господин! Президент! Вы не ранены?!"
10011075-17 = "Цукуё! Изуна!"
10011075-18 = "Вы внезапно исчезли... Мы с Изуной попытались пойти за вами..."
10011075-19 = "Но заблудились внутри особняка ниндзя! Когда надежды почти не осталось, Цукуё придумала решение!"
10011075-20 = "Я... Я вспомнила этот особняк из к-к-комикса, который вы мне дали, Президент..."
10011075-21 = "Хорошо, что ты его порекомендовала, правда, Президент? Хе-хе!"
10011075-22 = "О, д-да?"
10011075-23 = "[s] «Кстати, где Ироха?»"
10011075-25 = "Ну, понимаете. Она была с нами, но где-то по дороге..."
10011075-26 = "Просто исчезла. Так что, эм, выбрались только мы двое..."
10011075-27 = "Н-Надо пойти её искать..."
10011075-28 = "К сожалению, сейчас у нас нет на это времени."
10011075-29 = ""
10011075-31 = ""
10011075-32 = "Эм. Цукуё. Изуна. Мне нужно кое-что вам сказать."
10011075-34 = "Д-Да...?"
10011075-35 = ""
10011075-40 = ""
10011075-41 = "[ns] «А? Вы ведь...?»"
10011075-42 = "Слава богу. Похоже, я успела вовремя."
10011075-43 = "[s] «Кахо?»"
10011075-44 = "Будь у меня время, я бы подробно отчитала вас за это кричащее представление."
10011075-45 = "Но вместо этого я настаиваю, чтобы вы немедленно прекратили преследование."
