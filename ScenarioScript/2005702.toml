[translation]
2005702-1 = "Один день моей жизни"
2005702-3 = ""
2005702-4 = "Эй, это Сенсей!"
2005702-5 = "Здравствуйте, Сенсей! Вы ведь присутствовали на уроке, да?"
2005702-6 = "Ну как вам?"
2005702-7 = "[s] «Программа Миллениума и правда продвинутая...»"
2005702-8 = "Да ничего особенного! Хотите как-нибудь поучаствовать в эксперименте?"
2005702-9 = ""
2005702-12 = ""
2005702-19 = ""
2005702-21 = ""
2005702-22 = "О, Аканэ..."
2005702-23 = "То есть, госпожа Аканэ."
2005702-25 = "Да, здравствуйте."
2005702-26 = "..."
2005702-27 = "Очень приятно встретиться с вами вот так, «Сенсей»."
2005702-29 = "Вы... хотите присоединиться к разговору, госпожа Аканэ?"
2005702-31 = "..."
2005702-32 = "Спасибо за приглашение, но..."
2005702-33 = "Фуфу. Нет. Не хочу мешать приятному дню."
2005702-34 = "Прошу меня извинить. Сенсей. Все."
2005702-35 = ""
2005702-37 = ""
2005702-38 = "[ns] «Аканэ...?»"
2005702-39 = "Ах..."
2005702-40 = "Я не это имела в виду..."
2005702-41 = "Аканэ бывает немного... пугающей, правда?"
2005702-42 = ""
2005702-44 = "Yeah, you're right. We're even in the same year."
2005702-45 = "Но она ещё и успевает выполнять всю работу C&C."
2005702-48 = "Кстати, разве это не забавно? Агентство совершенно секретное, а знают о нём все."
2005702-49 = "Кажется, в этом и есть их главная фишка."
2005702-50 = "Она справляется с любым запросом, тщательная, умелая и вообще хороша во всём, но..."
2005702-51 = "Может, именно поэтому с ней трудно разговаривать?"
2005702-52 = "Да, как цветок на вершине утёса."
2005702-53 = ""
2005702-55 = ""
2005702-57 = "[ns] «(...)»"
2005702-59 = "[ns] «(Что-то меня беспокоит.)»"
2005702-68 = ""
2005702-69 = "Здравствуйте, Сенсей. Уже возвращаетесь?"
2005702-70 = "[s] «Аканэ!»"
2005702-72 = "[ns] «Ты меня ждала?»"
2005702-73 = "Фуфу. Да. Вы потрудились прийти сюда, так что это минимум, который я могла сделать."
2005702-74 = "Ну что же, прошу меня извинить."
2005702-75 = "[s] «Э-Эм...!»"
2005702-78 = "Такое чувство, будто к Аканэ трудно подойти... правда?"
2005702-79 = "Yeah, you're right. We're even in the same year."
2005702-80 = "Она справляется с любым запросом, тщательная, умелая и вообще хороша во всём, но..."
2005702-81 = "Да, я вас прекрасно понимаю. Как цветок, цветущий на вершине утёса."
2005702-83 = "[ns] «Стой!»"
2005702-84 = ""
2005702-85 = "Да? Всё в порядке?"
2005702-86 = "Вы хотите вернуться... вместе?"
2005702-87 = ""
2005702-89 = ""
2005702-90 = "..."
2005702-91 = "Хорошо, «Господин»."
2005702-92 = "Спасибо, что проводите меня."
2005702-93 = "О боже. Мне не стоит называть вас «Господином», пока я в школьной форме?"
2005702-94 = "Поняла... Сенсей."
2005702-95 = "Тогда я в ваших руках."
2005702-103 = "Мы с Аканэ шли бок о бок по улице, пока день превращался в вечер."
2005702-104 = "Между нами повисла непривычная тишина."
2005702-107 = "[ns] «Эм, Аканэ?»"
2005702-108 = "...Сегодня я казалась другой?"
2005702-109 = "...Сегодня я казалась другой?"
2005702-110 = "..."
2005702-111 = "Прошу прощения за это, Сенсей."
2005702-112 = "Но именно так я веду себя как обычный студент на территории академии."
2005702-113 = "[s1] «П-Понятно...»\n[s2] «А кто были те студенты, с которыми ты разговаривала в школе?»"
2005702-116 = "О, они?"
2005702-117 = "Просто... одноклассницы. Иногда мы разговариваем. Порой мне приходится как следует предупреждать их о некоторых моих «клубных занятиях»..."
2005702-118 = "Пожалуй, и всё."
2005702-120 = "Снова тишина..."
2005702-123 = "Сенсей?"
2005702-124 = "[s] «Д-Да?»"
2005702-125 = "Вы переживали?"
2005702-126 = "[s] «Насчёт этого...»"
2005702-127 = "..."
2005702-128 = ""
2005702-130 = ""
2005702-131 = "Иногда мне довольно трудно «вписаться»."
2005702-132 = "То же самое можно сказать и о членах моего клуба..."
2005702-133 = "Полагаю, президент — небольшое исключение. Ей настолько безразлично мнение других, что она способна ладить с кем угодно."
2005702-134 = "Асуна... У Асуны просто какое-то необъяснимое обаяние, правда?"
2005702-135 = "Фуфу, а Карин развила сильное чувство товарищества с другими студентами Миллениума, которым тяжело даётся математика."
2005702-136 = "А Токи..."
2005702-137 = "..."
2005702-138 = "Ей просто невозможно не захотеть помочь, вам не кажется?"
2005702-139 = "..."
2005702-140 = "Но со мной всё немного иначе. Я вежлива и дружелюбна."
2005702-141 = "Однако приблизиться ко мне бывает трудно."
2005702-142 = ""
2005702-145 = "Фуфу. Какое новое и интересное выражение у вас на лице, Сенсей."
2005702-146 = "Вы тоже думаете, что мне стоит сильнее стараться вписаться?"
2005702-147 = "[s] «Хмм... Нет, я бы так не сказал.»"
2005702-148 = "Что...?"
2005702-149 = "И вы... правда так думаете?"
2005702-150 = "[s3] «Главное, чтобы ты была счастлива!»\n[s4] «В мире полно самых разных людей.»"
2005702-153 = "Э-Это правда... Но разве нам не стоит стараться ладить с окружающими?"
2005702-154 = "Нужно быть бодрыми и позитивными, наслаждаться обществом друг друга..."
2005702-155 = "[s5] «Правда, но с другой стороны...»\n[s6] «Разве это не просто давление общества?»"
2005702-158 = "..."
2005702-159 = "То есть важнее всего... мои чувства?"
2005702-160 = "...Вы хотите знать, что я чувствую?"
2005702-161 = "[s7] «Только если тебе комфортно поделиться.»\n[s8] «Но я правда хочу знать.»"
