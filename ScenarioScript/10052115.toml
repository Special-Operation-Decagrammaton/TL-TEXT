[translation]
10052115-2 = ""
10052115-3 = "..."
10052115-4 = ""
10052115-6 = ""
10052115-8 = ""
10052115-9 = "Но думаю, это нормально."
10052115-10 = "Нормально... не знать?"
10052115-11 = "Да."
10052115-12 = "Потому что, возможно, ответ не один."
10052115-13 = "..."
10052115-14 = "[s] «Что-то не так, Арис?»"
10052115-15 = "Я не понимаю."
10052115-16 = "Я тоже не до конца понимаю."
10052115-17 = "[s] «Конечно. Я же сказала: поговори со мной об этом, когда будешь готова.»"
10052115-18 = "Вместе со всеми."
10052115-19 = "..."
10052115-20 = "Ты неисправима."
10052115-21 = "Возможно!"
10052115-22 = "Но я рада, что мы поговорили."
10052115-23 = "Я тоже."
10052115-24 = "Хотя всё ещё считаю тебя наивной."
10052115-25 = "[s] «Если честно, Соф не совсем неправа.»"
10052115-26 = "Что?!"
10052115-27 = "[s1] «С обещанием завтрашнего дня приходит и неизбежность утраты.»\n[s2] «И каждый новый день может принести больше плохого, чем хорошего.»"
10052115-30 = "[ns] «Прямо как сказала Соф.»"
10052115-31 = "Обязательно!"
10052115-32 = "..."
10052115-33 = "Арис."
10052115-34 = ""
10052115-36 = ""
10052115-38 = "Что время, проведённое вместе, не было бессмысленным."
10052115-39 = "Что хочешь остаться с друзьями, которых обрела."
10052115-40 = "[s] «В каком-то смысле ты уже сама ответила на этот вопрос.»"
10052115-41 = "Что? Я правда—"
10052115-42 = "...уже ответила."
10052115-43 = "Что всё время, проведённое нами вместе, не было бессмысленным."
10052115-44 = "Что ты хотела остаться с друзьями, которых обрела."
10052115-45 = "Но... разве этого достаточно?"
10052115-46 = "[s3] «На самом деле, этого более чем достаточно.»\n[s4] «Жизнь никогда не обязана быть великим поиском предназначения.»"
10052115-49 = "Что?!"
10052115-50 = "ЧТООО?!"
10052115-51 = "Я не понимаю... Никакого предназначения?"
10052115-52 = "...Если бы такая вещь существовала..."
10052115-53 = "...тогда жизнь без цели или смысла считалась бы бесполезной."
10052115-54 = "...!"
10052115-55 = "[s5] «Так что... возможно, нам всем достаточно просто быть собой.»\n[s6] «А главное, встреча со всеми вами стала величайшим счастьем моей жизни.»"
10052115-58 = "Я-я тоже! Без Сенсея я...!"
10052115-59 = "..."
10052115-60 = "Я тоже туда вхожу?"
10052115-61 = "[s] «Это даже не вопрос.»"
10052115-62 = "Ну. Тогда ладно."
10052115-63 = "[s7] «Ага. Вот и всё. Только это и важно.»\n[s8] «Чем больше смотришь, тем сильнее понимаешь, насколько жизнь нелогична.»"
10052115-64 = ""
10052115-65 = ""
10052115-67 = ""
10052115-68 = "[ns] «И у нас есть два варианта.»"
10052115-69 = "«Сдаться»..."
10052115-70 = "...«или сражаться до конца»?"
10052115-71 = "...Но если сдаться, это конец пути?"
10052115-72 = "..."
10052115-73 = "Тогда получается... сейчас у нас только один выбор."
10052115-74 = "[s9] «Сражаться и победить.»\n[s10] «Написать счастливый финал для всех нас.»"
10052115-77 = "Значит, само счастье — это борьба?"
10052115-78 = "[s11] «Именно. Это отказ смиряться с невыносимым.»\n[s12] «Даже если приходится делать это в ярости.»"
10052115-81 = "[ns] «Прямо как ты сказала, Кей.»"
10052115-82 = "Почему вдруг я?!"
10052115-83 = ""
10052115-85 = ""
10052115-89 = "Стой! Не гладить по голове! Не улыбаться! Даже если попробуете—"
10052115-90 = "...Л-ладно. Только один раз."
10052115-91 = "..."
10052115-92 = "Так счастье И ЕСТЬ главная борьба жизни?"
10052115-93 = "[s13] «Именно. И я хочу, чтобы все вы были счастливы.»\n[s14] «А я, может быть, просто буду дополнением к этому.»"
10052115-94 = ""
10052115-95 = ""
10052115-97 = ""
10052115-98 = "«Дополнением»?"
10052115-99 = "Конечно, я тоже желаю Сенсею счастья! Но не как дополнению... Разве это не грустно?"
10052115-100 = "Нет? Совсем нет?"
10052115-101 = "...Некоторые люди счастливы, видя радость других?"
10052115-102 = "...И чувствуют боль, когда видят чужие страдания?"
10052115-103 = "...Возможность плакать рядом с тем, кто страдает..."
10052115-104 = "...может дать этому человеку силы сражаться до конца?"
10052115-105 = "Но нельзя гарантировать, что так будет всегда. Разве это не просто заблуждение?"
10052115-106 = "Это ещё мягко сказано. Это лицемерие. Ух. Я начинаю говорить как те мелкие."
10052115-107 = "Что жизнь, отношения и общество — незаконные конструкции, едва держащиеся на хрупком цементе под названием недопонимание."
10052115-108 = "[s15] «И что с того?»\n[s16] «Я лучше буду лицемером.»"
10052115-111 = "Что?!"
10052115-112 = "...!"
10052115-113 = "[s17] «Родиться добрым или преодолеть свою природу огромными усилиями...»\n[s18] «Что из этого кажется тебе круче?»"
10052115-116 = "Почему мы вдруг приплели сюда «крутость»?"
10052115-117 = "...Но ведь именно в этом суть проблемы?"
10052115-118 = "...Жизнь одна, значит, стоит прожить её круто? Иначе какой смысл?"
10052115-119 = "Очень в вашем стиле, Сенсей."
10052115-120 = "Хотя я всё ещё немного запуталась..."
10052115-121 = "...но одно я поняла точно! Я совершенно нормальна именно такой, какая я сейчас!"
10052115-122 = "[s] «Именно!!»"
10052115-123 = "Спасибо, Сенсей! Теперь я знаю, чего хочу!"
10052115-124 = "И чего же, Арис?"
10052115-125 = ""
10052115-127 = ""
10052115-128 = "Я хочу с ними подружиться!"
10052115-129 = ""
10052115-131 = ""
10052115-132 = "С Эйн, Соф, Ор, пророком по имени Малкут и со всеми остальными пророками тоже!"
10052115-133 = "Думаю, наши проблемы слишком велики, чтобы решить их одними разговорами."
10052115-134 = "Но я не думаю, что пытаться будет плохо."
10052115-135 = "Даже лицемерие лучше, чем ничего!"
10052115-136 = "[s] «Мне нравится! Я за тебя болею!»"
10052115-137 = "Да!"
