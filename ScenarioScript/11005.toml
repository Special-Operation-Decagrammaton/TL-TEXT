[translation]
11005-2 = "Chegamos!!"
11005-3 = "Sim."
11005-4 = "Retomada da sede do \"Schale\" concluída. Eu também já estou quase chegando. Vamos nos encontrar no subsolo do prédio."
11005-11 = "Schale • Subsolo do Prédio"
11005-13 = "Hmm... Não faço a menor ideia do que seja isso. Assim fica difícil até de quebrar..."
11005-14 = "...Ora?"
11005-15 = "[s1] Dei de cara com uma aluna suspeita.\n[s2] Cumprimentar."
11005-16 = "O-Ora, ora, ora..."
11005-17 = "O-Ora, ora, ora..."
11005-18 = "..."
11005-19 = "A-Aah..."
11005-20 = "C-C-Com..."
11005-21 = "Com licença!!"
11005-24 = "[s] \"...?\""
11005-26 = "Schale • Subsolo do Prédio"
11005-28 = "Desculpe a demora."
11005-29 = "...? Aconteceu alguma coisa?"
11005-30 = "[s] \"Não, nada demais.\""
11005-31 = "...Entendo. É aqui que está guardado o que a Presidente do Conselho Estudantil Geral deixou."
11005-33 = "(Estende o objeto)"
11005-35 = "...Felizmente, está intacto, sem um único arranhão."
11005-41 = "...Por favor, pegue."
11005-42 = "[s] \"Um tablet...?\""
11005-43 = "Sim. Isto é o que a Presidente do Conselho Estudantil Geral deixou para o Sensei.#nÉ a \"Arca de Shittim\"."
11005-44 = "[s] (Já ouvi esse nome em algum lugar...)"
11005-46 = "Parece um tablet comum, mas na verdade é um objeto completamente misterioso. Fabricante, sistema operacional, arquitetura, mecanismo de funcionamento — tudo é desconhecido."
11005-47 = "A Presidente disse que esta \"Arca de Shittim\" pertence ao Sensei e que, com ela, você conseguiria restaurar o controle da torre."
11005-48 = "Nós não conseguimos sequer ligá-la, mas será que o Sensei vai conseguir, ou será que..."
11005-49 = "[s] \"...\""
11005-50 = "..."
11005-51 = "...Bom, meu papel termina aqui. Daqui em diante, tudo depende do Sensei."
11005-52 = "Vou me afastar para não atrapalhar."
11005-55 = "..."
11005-56 = "[ns] Ligar a \"Arca de Shittim\"."
