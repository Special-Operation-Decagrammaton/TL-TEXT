[translation]
11005-2 = "Наконец-то!"
11005-3 = "Хмф."
11005-4 = "Мы успешно вернули клубную комнату Шале. Я скоро прибуду. Встретимся в подвале здания."
11005-11 = "Подвал здания Шале"
11005-13 = "М-м... И как мне это уничтожить, если я даже не знаю, что это такое...?"
11005-14 = "...О?"
11005-15 = "[s1] «Часто здесь бываешь?»\n[s2] Поприветствовать её с улыбкой."
11005-16 = "Э-э..."
11005-17 = "Э-э..."
11005-18 = "..."
11005-19 = "Ну..."
11005-20 = "Я, эм..."
11005-21 = "Я уже ухожу!"
11005-24 = "[s] «...?»"
11005-26 = "Подвал здания Шале"
11005-28 = "Простите, что заставила ждать. Я здесь."
11005-29 = "...Хм? Я что-то пропустила?"
11005-30 = "[s] «Ничего особенного»."
11005-31 = "...Понятно. Что ж, вот то, что оставила после себя президент Генерального ученического совета."
11005-32 = ""
11005-33 = "*шорох*"
11005-34 = ""
11005-35 = "К счастью, на нём ни царапины."
11005-36 = ""
11005-37 = ""
11005-38 = ""
11005-41 = "Прошу. Возьмите."
11005-42 = "[s] «Умный планшет?»"
11005-43 = "Да. Именно это президент Генерального ученического совета оставила вам. Ковчег Шиттим."
11005-44 = "[s] «(Это название кажется знакомым...)»"
11005-45 = ""
11005-46 = "На вид это обычный планшет, но его происхождение остаётся загадкой. Производитель, операционная система, архитектура и компоненты совершенно неизвестны."
11005-47 = "Президент Генерального ученического совета оставила Ковчег Шиттим вам. Она сказала, что с его помощью вы сможете получить контроль над башней."
11005-48 = "Никому из остальных членов совета не удалось его активировать. Возможно, вы сможете разобраться, Сенсей, но если нет..."
11005-49 = "[s] «...»"
11005-50 = "..."
11005-51 = "Моя работа здесь закончена. Теперь всё зависит от вас."
11005-52 = "Я отойду, чтобы не мешать."
11005-55 = "..."
11005-56 = "[ns] Активировать Ковчег Шиттим."
