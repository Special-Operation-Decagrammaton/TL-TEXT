[translation]
10055170-1 = "Акробатика на границе света и тени"
10055170-2 = ""
10055170-3 = "Какой красивый закат!"
10055170-4 = "Из-за нас, правда?"
10055170-5 = "И наконец мы можем просто расслабиться и полюбоваться им, не думая о выживании."
10055170-6 = ""
10055170-8 = ""
10055170-10 = ""
10055170-11 = "ВОТ вы где, обе."
10055170-12 = "А, привет, Сацуки."
10055170-13 = "...Где Макото? Разве она была не с вами?"
10055170-14 = "Она... слишком увлеклась крабовыми боями. Теперь бродит и бросает вызовы всем подряд."
10055170-15 = "Я ходила за ней, пока ноги не заболели. Чиаки осталась с ней."
10055170-16 = "...Ты уверена, что этих двоих можно оставлять наедине?"
10055170-17 = "Хм... Они вполне могут натворить дел. Однако чего не вижу, того не знаю."
10055170-18 = "Так ВОТ как ты столько времени остаёшься подругой Макото..."
10055170-19 = "М-м..."
10055170-20 = "*вздох* Как же не хочется этим заниматься..."
10055170-21 = "...Но если я не вмешаюсь, она натворит дел, а разгребать придётся мне."
10055170-22 = "Пойду приведу её обратно. Сенсей, Сацуки, присмотрите за Ибуки, ладно?"
10055170-23 = ""
10055170-25 = ""
10055170-27 = "Конечно. Ибуки ведёт себя хорошо, так что присмотреть за ней совсем не трудно."
10055170-28 = ""
10055170-30 = ""
10055170-31 = ""
10055170-32 = ""
10055170-33 = "..."
10055170-34 = "...Кто это?"
10055170-35 = "О, привет, Сацуки!"
10055170-36 = "Это Чисе! Мы теперь друзья!"
10055170-37 = "Вот так просто, да?"
10055170-38 = ""
10055170-40 = ""
10055170-41 = "...У меня плохое предчувствие."
10055170-42 = "Эй, простите. Можно с вами поговорить?"
10055170-43 = "Ракушки..."
10055170-44 = "Хм...?"
10055170-45 = "Я пришла сюда вслед за ракушками."
10055170-46 = ""
10055170-47 = "Акробатика на границе света и тени"
10055170-50 = ""
10055170-52 = "Интересно, кто их здесь разложил?"
10055170-53 = "...Не думаю, что их кто-то раскладывал."
10055170-54 = "Почему... они здесь?"
10055170-55 = "Ну, в мире много сил, которые перемещают предметы. Ветер, течения..."
10055170-56 = "Трудно сказать, что именно принесло их сюда."
10055170-57 = "Ух ты. Море. Оно удивительное."
10055170-58 = "О да, ещё какое. И опасное."
10055170-59 = "Опасное?"
10055170-60 = "Да. Море ПОЛНО опасностей. Сильные волны, усталость, обезвоживание, палящее солнце..."
10055170-61 = "Мне нравится солнце. Оно тёплое."
10055170-62 = "...Давай согласимся, что здесь у нас разные мнения."
10055170-63 = "Ня-ха-ха!"
10055170-64 = ""
10055170-66 = ""
10055170-69 = ""
10055170-70 = "Ну, здравствуйте. Вы присматривали за нашей Чисе?"
10055170-71 = "А, вы, должно быть, председатель Клуба инь-ян из Хяккияко?"
10055170-72 = "...Надо же, мне даже представляться не пришлось. Польщена. Приятно познакомиться."
10055170-73 = "А теперь, когда обмен любезностями закончен, перейдём к делу."
10055170-74 = "...Кахо, твой выход."
10055170-75 = "Ты опять сваливаешь всю тяжёлую работу на меня?! Как обычно!"
10055170-76 = "Ну, я же здесь всего лишь гость, верно?"
10055170-77 = "*вздох* Кхм. Мы, представители Клуба инь-ян, прибыли к вам..."
10055170-78 = "...чтобы вызвать Общество Пандемониума на «Крабовую схватку за наследие»."
10055170-80 = "«Крабовую схватку за наследие»? А я думала, это называется крабовыми боями."
10055170-81 = "А, это, пожалуй, разговорное название. Но сама традиция уходит корнями в древность и передаётся из поколения в поколение в одном из районов Хяккияко..."
10055170-82 = "Кахо, Кахо. Давай не будем затягивать."
10055170-83 = "М-м, верно. По сути, это одно и то же."
10055170-84 = "Замечу, мы здесь лишь зрители. Ня-ха!"
10055170-85 = "Как она и сказала. Я бы сама охотно приняла вызов, если бы могла..."
10055170-86 = "...но настоящие чемпионы здесь те, чья связь с крабами крепче всего!"
10055170-87 = "Иными словами, настал звёздный час принцессы Вараку!"
10055170-88 = "Угу. Ты будешь сражаться со мной."
10055170-89 = "Обязательно? Вообще-то я сюда не соревноваться пришла..."
10055170-90 = "А, вот как?"
10055170-91 = "Прекрасно. Значит, засчитаем тебе поражение без боя?"
10055170-92 = "Как пожелаете. У меня нет никакого желания вступать в схватку."
10055170-93 = "Хи-хи. Понимаю. Тогда, думаю, тебе не жалко будет отдать звезду..."
10055170-95 = "Не-а! Нельзя!"
10055170-96 = "Ибуки?"
10055170-97 = "Если мы потеряем звезду, Макото очень расстроится!"
10055170-98 = "Хотите забрать её? Сначала победите Ибуки!"
10055170-99 = "Ибуки?! ...Нет-нет, я не могу подвергать тебя такой опасности."
10055170-101 = "Это всё-таки НЕ настолько опасно..."
10055170-102 = "Как неудачно вышло. Вызвать меня, ненавидящую сражения, когда рядом одна Ибуки..."
10055170-103 = "Неужели?! Они всё это время следили за нами? Это был их замысел?"
10055170-104 = "Я? Нет-нет. Конечно нет!"
10055170-105 = "Разумеется, куда логичнее было бы бросить вызов председателю Макото..."
10055170-106 = "И, конечно, можно было намеренно выбрать цель послабее..."
10055170-107 = "Но это были бы политические интриги, а кто станет таким заниматься?"
10055170-108 = "Меня переиграли, а я даже не знала, что участвую в игре."
10055170-109 = "Ух...! Ладно, ладно. Я стану твоим противником."
10055170-110 = "О?"
10055170-111 = "Я возглавляю разведывательный комитет Общества Пандемониум, а ты обошла меня и в стратегии, и в разведке. Я не могу остаться в стороне!"
10055170-112 = "Я принимаю твою «Крабовую схватку за наследие»!"
10055170-113 = "...Такого я совсем не ожидала."
10055170-114 = "Но ладно! Будет весело. Давай обе получим удовольствие."
10055170-116 = "Как тебя зовут?"
10055170-117 = "А-А?"
10055170-118 = "Мне необходимо узнать твоё имя."
10055170-119 = "...Кёгоку Сацуки. Советую хорошенько его запомнить. Я не каждому представляюсь."
10055170-120 = "Понятно. Тогда начнём."
10055170-121 = "Я принимаю вызов Кёгоку Сацуки на «Крабовую схватку за наследие»."
10055170-122 = "Сенсей проследит за поединком. Председатель Ния и заместитель председателя Кахо выступят свидетелями."
10055170-123 = "О-ого, всё всерьёз."
10055170-125 = "Как я уже говорила, это древняя, освящённая временем традиция."
10055170-126 = "Участники и крабы, по местам."
10055170-127 = ""
10055170-129 = ""
10055170-130 = "Пусть бой будет честным!"
