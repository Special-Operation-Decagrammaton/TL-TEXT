[translation]
10055170-1 = "Acrobatics where light and shadow intersect"
10055170-3 = "The sunset is beautiful, isn't it?"
10055170-4 = "It certainly is..."
10055170-5 = "I wonder how long it's been since I could just relax without a single worry..."
10055170-11 = "Oh, you two are here."
10055170-12 = "Ah, Satsuki-senpai."
10055170-13 = "...Where is Makoto-senpai? I thought you were together."
10055170-14 = "Makoto-chan is running around looking for someone to challenge. She seems to have taken quite a liking to these club fights."
10055170-15 = "I got a bit tired, so I left the rest to Chiaki."
10055170-16 = "...Are those two going to be alright?"
10055170-17 = "Hmm, they might cause some trouble, sure. But well, I'm here, so it doesn't really concern me."
10055170-18 = "...I think I finally understand why Satsuki-senpai has been able to stick with Makoto-senpai for so long."
10055170-19 = "..."
10055170-20 = "Sigh... it really is... it's just so much trouble..."
10055170-21 = "But if Makoto-senpai does something reckless, it'll be even more of a headache..."
10055170-22 = "I'm going to go check on them. Sensei, Satsuki-senpai, please keep an eye on Ibuki."
10055170-27 = "Of course. Ibuki-chan is well-behaved. Consider it done."
10055170-33 = "..."
10055170-34 = "...Um, who might you be?"
10055170-35 = "Ah, Satsuki-senpai!"
10055170-36 = "This is Chise-oneechan! She became friends with Ibuki!"
10055170-37 = "In this short amount of time?"
10055170-41 = "...That's suspicious."
10055170-42 = "You there, do you have a moment?"
10055170-43 = "Shells~"
10055170-44 = "Hmm...?"
10055170-45 = "I was picking them up and ended up here."
10055170-47 = "Acrobatics where#nlight and shadow intersect"
10055170-52 = "I wonder who put that there?"
10055170-53 = "...I don't think anyone put it there."
10055170-54 = "Then why is it there?"
10055170-55 = "Well... in this world, there are many things that move objects, like currents or the wind."
10055170-56 = "Isn't it the work of one of those?"
10055170-57 = "The ocean is amazing."
10055170-58 = "Heh, not bad. You understand the greatness of nature. Then... you must also understand the dangers, right?"
10055170-59 = "Dangers?"
10055170-60 = "That's right, the ocean is full of dangers. The hot sun, the raging waves, and even dehydration..."
10055170-61 = "I like the sun because it's warm."
10055170-62 = "...It seems we have a difference of opinion."
10055170-63 = "Nya-ha~"
10055170-70 = "Well, well~ It seems my Chise is being well taken care of~"
10055170-71 = "If I recall correctly, you are the head of the Hyakkiyako Yin-Yang Club?"
10055170-72 = "Nya? I didn't actually introduce myself... but it helps that you already know, so I can skip the explanation~"
10055170-73 = "Now then... with the pleasantries out of the way, let's move on to the main topic."
10055170-74 = "Hmm... Kaho, if you would."
10055170-75 = "Ehh!? You're passing it to me after saying all that!?"
10055170-76 = "I'm just here to watch, after all~"
10055170-77 = "Sigh... The reason we from the Yin-Yang Club have come to visit is—"
10055170-78 = "To challenge Pandemonium to a 'Crab-Acceptance Battle'."
10055170-80 = "Crab-Acceptance Battle...? Not a club fight?"
10055170-81 = "That seems to be how it's known to the public. However, it originally stems from a tradition passed down through generations in a certain region of Hyakkiyako—"
10055170-82 = "Kaho, you're going on too long."
10055170-83 = "O-oh, right. You can think of it as being the same thing as what you call a club fight."
10055170-84 = "Well, we're just spectators, though~"
10055170-85 = "If I could, I would have liked to fight myself, but..."
10055170-86 = "The highlight of this tournament is the 'Club Fighter' who shares a bond with their crab—"
10055170-87 = "—the place where the 'Waraku Princess' shines!"
10055170-88 = "Yeah. Let's have a match, me and you."
10055170-89 = "Ehh!? Honestly, I'm not interested in matches..."
10055170-90 = "Ho ho."
10055170-91 = "In that case, shall we consider this match a win by default for us...?"
10055170-92 = "Yeah. I'm not interested in some tournament called the 'Best Crab in the World' anyway."
10055170-93 = "Fufu. Then we'll be taking the star of Pandemonium..."
10055170-95 = "No way!"
10055170-96 = "Ibuki-chan?"
10055170-97 = "If the star is gone, Makoto-senpai will be sad!"
10055170-98 = "If you want to take it, you have to face me first!"
10055170-99 = "Wait! I can't let Ibuki-chan do something so dangerous!"
10055170-101 = "No, it's not particularly dangerous..."
10055170-102 = "Of all times, you had to come when only I and Ibuki-chan, who hates fighting, are here..."
10055170-103 = "...!? D-don't tell me! You targeted this timing on purpose!?"
10055170-104 = "How could you say such a thing~"
10055170-105 = "I did see Chairman Makoto running around looking for an opponent, though~"
10055170-106 = "And I thought, 'Pandemonium is vulnerable right now'~"
10055170-107 = "I didn't think anything of the sort~"
10055170-108 = "Ugh! To think I'd be outmaneuvered in an information war..."
10055170-109 = "F-fine, I get it! I'll be your opponent!"
10055170-110 = "Oh~?"
10055170-111 = "As the head of Pandemonium's Intelligence Department, I can't let myself be beaten in an information war and just take it!"
10055170-112 = "I'll take you on!"
10055170-113 = "...This has taken a rather unexpected turn."
10055170-114 = "Well, I suppose that's part of the fun!"
10055170-116 = "Name."
10055170-117 = "Eh?"
10055170-118 = "Tell me."
10055170-119 = "...Kyogoku Satsuki. I don't tell just anyone, so don't go spreading it around."
10055170-120 = "Yeah, then let's begin."
10055170-121 = "Pandemonium, accepting the challenge of Kyogoku Satsuki—"
10055170-122 = "Sensei will be the witness. Director Niya and Vice-Director Kaho will be the observers."
10055170-123 = "W-wow, this is quite formal..."
10055170-125 = "Yes. As I mentioned earlier, the Crab-Acceptance Battle is a tradition with a long history."
10055170-126 = "Now then, both parties, both crabs, take your positions..."
10055170-130 = "Let the match begin!"