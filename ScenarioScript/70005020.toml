[translation]
70005020-1 = "Запись от 19 февраля (1)"
70005020-3 = "[log]19 февраля[/log]"
70005020-6 = "Клубная комната Префектурной команды Геенна"
70005020-7 = ""
70005020-8 = "..."
70005020-9 = "..."
70005020-10 = "..."
70005020-11 = "А теперь, пожалуйста, нормально объясните, что здесь произошло."
70005020-12 = "Прошу прощения за прямоту, но похоже, нашу доставку перепутали..."
70005020-13 = "...с посылкой этого «Генрюмон» из академии Шаньхайцзин."
70005020-14 = "Вы не слишком спокойны, учитывая обстоятельства?!"
70005020-15 = "В-Вы же попросили объяснение!"
70005020-16 = "Я немедленно свяжусь с Генрюмон из Шаньхайцзин и потребую надлежащих действий для исправления этой ошибки доставки!"
70005020-17 = "Подождите, старший администратор Ако! Это... нормально?"
70005020-18 = "Что ты пытаешься сказать, Чинацу?!"
70005020-19 = "Генрюмон — ученический совет академии Шаньхайцзин. Это организация, эквивалентная Обществу Пандемониума нашей академии Геенна."
70005020-20 = "И...?"
70005020-21 = "В основном наша Префектурная команда отвечает за дисциплину и безопасность внутри Геенна."
70005020-22 = "И конечно, при определённых ситуациях и обстоятельствах мы уже взаимодействовали с другими академиями."
70005020-23 = "Однако если речь о прямом обмене с ученическим советом другой академии, который, повторю, является организацией, эквивалентной Обществу Пандемониума..."
70005020-24 = "Ах."
70005020-25 = "Да... Думаю, вы понимаете..."
70005020-26 = "В зависимости от точки зрения обращение к ним может считаться дипломатическим вопросом."
70005020-27 = "Если Общество Пандемониума узнает..."
70005020-28 = ""
70005020-30 = ""
70005020-32 = "Мы никогда не услышим конца этой истории. Никогда..."
70005020-33 = "Ух! Кто-нибудь здесь лично знает кого-то оттуда?!"
70005020-34 = "..."
70005020-35 = "Что это значит?! У вас обеих вообще нет друзей из других школ?!"
70005020-36 = "С-Старший администратор Ако? Ну, я бы не сказала... друг, но я знакома с одним студентом из Восточного алхимического общества Шаньхайцзин..."
70005020-37 = "Восточное алхимическое общество? Это что?"
70005020-38 = "Сложно объяснить... Но если проводить параллель, можно сравнить их с Клубом экстренной медицинской помощи."
70005020-39 = "А, вот почему..."
70005020-40 = "..."
70005020-42 = "В любом случае, хорошо. Тогда используем это, чтобы установить... личный контакт с Шаньхайцзин."
70005020-44 = ""
70005020-45 = ""
70005020-47 = "..."
70005020-48 = "..."
70005020-49 = "Что... нам делать?"
70005020-50 = "Даже если спрашиваешь меня..."
70005020-51 = "Для начала, для кого этот торт?"
70005020-52 = ""
70005020-54 = ""
70005020-55 = "Написано Геенна. Посмотрим... «Президенту Сорасаки Хине, с любовью»?"
70005020-56 = "Сорасаки Хина? Кажется, я где-то слышала это имя..."
70005020-57 = ""
70005020-59 = ""
70005020-60 = "О, вспомнила! По-моему, это главный префект академии Геенна? Идеальный сверхчеловек, который из-за кулис поддерживает работу всей академии или что-то такое..."
70005020-61 = "Хмф! Уверена, наша госпожа милее и круче!"
70005020-62 = "Это сейчас вообще не относится к делу..."
70005020-64 = "Значит... наш торт ушёл туда, а их торт приехал сюда?"
70005020-65 = "Логично предположить... Тогда это можно считать... дипломатическим вопросом?"
70005020-66 = "...Это тоже... звучит логично."
70005020-67 = "Тогда... по правилам нам потребуется кто-то, кто занимается такими вопросами, верно?"
70005020-68 = "...То есть PR-менеджер?"
70005020-69 = "...Ты хочешь поручить это PR-менеджеру?"
70005020-70 = "...По правилам...?"
70005020-71 = "Точно?"
70005020-72 = "Пожалуйста, перестаньте говорить..."
70005020-73 = ""
70005020-75 = ""
70005020-76 = ""
70005020-77 = ""
70005020-78 = ""
70005020-79 = "А? Восточное алхимическое общество звонит нам...?"
70005020-80 = ""
70005020-82 = ""
70005020-83 = "Слушай внимательно, исполнительный офицер Мина!"
70005020-84 = "Нам поступил «личный» звонок из Клуба экстренной медицинской помощи Геенна!"
70005020-85 = "«Личный» звонок...?"
70005020-86 = ""
70005020-88 = ""
70005020-89 = ""
70005020-90 = "Здравствуйте, исполнительный офицер Коноэ Мина... то есть просто Мина. Это Хиномия Чинацу из Префектурной команды Геенна... то есть в этой ситуации просто Чинацу."
70005020-91 = "Х-Хорошо..."
70005020-92 = "Вы случайно не получили торт, который предназначался нам?"
70005020-93 = "...!!"
70005020-98 = ""
70005020-99 = "Спасибо, что подтвердили, что торты перепутались, Мина. Наши дальнейшие действия будут—"
70005020-100 = "Прошу прощения. Мне придётся перезвонить после того, как мы проведём собра— непринуждённо поговорим об этом."
70005020-101 = ""
70005020-103 = ""
70005020-104 = ""
70005020-105 = "Что нам делать...?"
70005020-106 = "Ух, ух... Мне правда придётся просить помощи у ТЕХ людей...?"
70005020-107 = "«Тех» людей?"
70005020-108 = "Н-Нет. Ничего."
70005020-109 = "В любом случае, я возьму ответственность и разберусь сама! Эм... Простите, что консультировалась с вами вне смены."
70005020-110 = "Поняла, исполнительный офицер. Только не переусердствуйте..."
70005020-111 = ""
70005020-113 = ""
70005020-114 = ""
70005020-115 = "*вздыхает*"
70005020-116 = ""
70005020-118 = ""
70005020-119 = "...Если что-нибудь случится, сообщите нам."
70005020-120 = "Если совсем честно, не думаю, что Генрюмон справится самостоятельно без решительности и находчивости госпожи, которая направляла бы вас."
70005020-121 = ""
70005020-122 = "*вздо-о-о-о-ох*"
70005020-123 = "...Ничего не поделаешь. Признать свой предел — значит сделать один шаг назад сегодня, чтобы завтра сделать два вперёд."
70005020-124 = "Но всё же почему...?"
70005020-125 = "Нет, суть крутости — немедленно действовать во время кризиса!"
70005020-127 = "Променад Чёрной Черепахи"
70005020-128 = "Мм, хорошо. Я поняла ситуацию. Как удачно, у меня как раз есть отличная идея!"
70005020-129 = "П-Правда?"
70005020-130 = "Что вы собираетесь делать, президент? Связи Променада Чёрной Черепахи не доходят до самой Геенна."
70005020-131 = "Да, именно поэтому. Это может стать отличной возможностью как раз установить такие связи."
70005020-132 = "В любом случае, все любят петь?"
70005020-133 = "Петь?"
70005020-134 = "А?"
