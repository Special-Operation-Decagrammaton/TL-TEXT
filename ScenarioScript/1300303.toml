[translation]
1300303-1 = "Неосознанная истина"
1300303-2 = "*дзынь*"
1300303-3 = ""
1300303-4 = "Хасуми пришла к месту встречи."
1300303-5 = "Ты пришёл раньше меня, Сенсей."
1300303-6 = "[s] «Привет»."
1300303-7 = "Хм. Может, сначала закажем? У них замечательный молочный чай."
1300303-8 = "Вы готовы сделать заказ?"
1300303-9 = "Да, мне молочный чай, и... эм... что будешь ты, Сенсей?"
1300303-10 = "[s1] «Чёрный кофе.»\n[s2] «Апельсиновый сок.»\n[s3] «Фруктовое парфе.»"
1300303-11 = "Ладно, тогда..."
1300303-12 = "Один медовый молочный чай и один чёрный кофе, пожалуйста."
1300303-13 = "Ладно, тогда..."
1300303-14 = "Один медовый молочный чай и один апельсиновый сок, пожалуйста."
1300303-15 = "Ладно, тогда..."
1300303-16 = "Один медовый молочный чай и одно фруктовое парфе, пожалуйста."
1300303-17 = "Один масляный пудинг, один шоколадный баумкухен с сырным тартом..."
1300303-18 = "...тирамису с сезонными фруктами, апельсиновый мадлен и..."
1300303-19 = "...два шоколадных крокембуша... и крепы с зелёным чаем."
1300303-20 = "[s] «...»"
1300303-21 = "Хм. Думаю, хватит."
1300303-22 = ""
1300303-23 = "Ешь, Сенсей."
1300303-24 = "[s] «Ты выглядишь счастливой.»"
1300303-25 = "*жует* *жует*"
1300303-26 = "П-Правда?"
1300303-27 = "Прошу прощения. Где мои манеры?"
1300303-28 = "Я всегда была сладкоежкой. Если бы не вступила в Отряд справедливости, возможно, оказалась бы в Клубе сладкоежек после школы."
1300303-29 = "Я всегда ценю возможность поесть десертов... даже если приходится делать это одной."
1300303-30 = "*жует* *жует*"
1300303-31 = "[s] «Так что ты хотела обсудить?»"
1300303-32 = "Ах да. Насчёт этого..."
1300303-33 = "..."
1300303-34 = "Это касается... моей диеты."
1300303-35 = "[s] «Диеты?»"
1300303-36 = "..."
1300303-37 = "Да. Я продолжаю набирать вес, как бы полезно ни питалась."
1300303-38 = "Я решила сесть на диету, но никакого прогресса."
1300303-39 = "Не могу понять, почему она не работает..."
1300303-40 = "Студенты постоянно приходят к тебе за советом, Сенсей. Я подумала, что если кто и сможет найти корень проблемы, то ты..."
1300303-41 = "[s4] «...Корень?»\n[s5] «...Ты правда не можешь догадаться?»"
1300303-42 = "Да. Сенсей, есть идеи?"
1300303-43 = "Да. Сенсей, есть идеи?"
1300303-44 = "Может, дело в генетике? Или в образе жизни...? Возможно, мне нужно больше тренироваться."
1300303-45 = ""
1300303-46 = "[s] Смотреть, как Хасуми ест десерт."
1300303-47 = ""
1300303-48 = "...?"
1300303-49 = "..."
1300303-50 = "..."
1300303-51 = "О. Н-Ну тогда..."
1300303-52 = "..."
1300303-53 = "Ты хочешь сказать... причина в этом?"
1300303-54 = "..."
1300303-55 = "Наверное... да. Без сомнений. Вот она."
1300303-56 = "Это так очевидно, но я не замечала... Я-я..."
1300303-57 = "...пришла спросить, почему не худею... одновременно набивая рот десертами. Как же стыдно..."
1300303-58 = "[s] «Всё в порядке?»"
1300303-59 = ""
1300303-60 = "Я только что вспомнила об очень важном деле, Сенсей! Мне нужно идти!"
1300303-61 = ""
1300303-62 = "*вжух*"
1300303-64 = "[s] «Опять?!»"
1300303-65 = "Увидимся!"
1300303-67 = "Хасуми молнией вылетела за дверь."
