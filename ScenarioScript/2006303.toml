[translation]
2006303-1 = "A Girl's Greed"
2006303-2 = "Whew, thanks, Sensei."
2006303-3 = "There's still a lot I don't understand about large shopping malls. #nThere's so much to buy—"
2006303-4 = "Escalators are still a little scary..."
2006303-5 = "Still, I made it through thanks to you. That was a big help."
2006303-6 = "[s1] \"Glad I could be of help.\"\n[s2] \"Come to think of it, you bought a ton of wiper blades, didn't you?\""
2006303-9 = "Yeah. Tanks use a lot of different types of wipers."
2006303-10 = "And we need a lot of them. Every observation window needs its own wiper."
2006303-11 = "...Ah. I forgot to buy one. #nThey were out of stock earlier, but someone told me another store has it. Let's go take a look."
2006303-16 = "There's a risk we might get separated, so don't fall behind. Understand?"
2006303-17 = "[s] \"I'll do my best not to get lost!\""
2006303-18 = "Good."
2006303-20 = "Automotive Supply Store"
2006303-23 = "Objective spotted—a wiper for the commander's cupola."
2006303-27 = "Goal achieved. Let's Return To Base."
2006303-28 = "Hmm...?"
2006303-32 = "Th-This is...! #nWhy are Momo Friends doing here...?"
2006303-33 = "[s] \"Looks like some kind of collaboration with vehicle supplies.\""
2006303-34 = "I can't believe they sell things like this—"
2006303-35 = "No, no! This is bad! If they're in a place like this, I'll, I'll grow soft...!"
2006303-36 = "[s] \"I think they're cute, though.\""
2006303-37 = "Well, obviously. I'm saying they're dangerous because they're too cute!"
2006303-38 = "Looking at them clouds my judgment... #nAnd fills me with the urge to hug them and pet their fluffy fur."
2006303-39 = "...Still, what do vehicle supplies have to do with Momo Friends?"
2006303-43 = "C-Could it be—!"
2006303-44 = "Are you supposed to clean out a tank's barrel using a fluffy, cute plushie...?"
2006303-45 = "[s] \"It might look that way, but probably not!\""
2006303-50 = "I see. Even vehicle supplies need to be cute, huh."
2006303-54 = "This is a steering wheel cover to keep your hands from getting cold."
2006303-58 = "And this long, slender Pinky Paka is a cushion to attach to your seatbelt."
2006303-62 = "Fluffy, round, and cute."
2006303-66 = "Hmm..."
2006303-67 = "[s3] \"Do you want it?\"\n[s4] \"Should I buy it for you?\""
2006303-70 = "There are a lot of things I want. #n...Honestly, I want all of them."
2006303-71 = "But these are things that go inside a tank."
2006303-72 = "If anything were to happen to the tank, I wouldn't want them to get destroyed along with it."
2006303-73 = "That feeling when you lose something... feeling empty and hollow, I'm not good at dealing with that."
2006303-74 = "...Sorry, Sensei. #nIt shouldn't be such a big deal, but I couldn't help thinking about it."
2006303-75 = "[s5] \"I understand how you feel.\"\n[s6] \"So, how about something like this?\""
2006303-81 = "...!"
2006303-82 = "This... well..."
2006303-83 = "Yeah, this should be fine."
2006303-84 = "Hehe..."
2006303-87 = "That's one \"Tank Air Freshener ~Lavender Scent~ Skullman Ver.\", correct? #nThank you for your purchase."
2006303-88 = "This is a strong-scented type, so please be careful where you install it."
2006303-92 = "Thank you, Sensei."
2006303-93 = "Air fresheners are consumable items, so once the scent wears off, I can take it out and display it in my room."
2006303-94 = "This way, I don't have to worry."
2006303-95 = "[s] \"I'm glad you like it.\""
2006303-96 = "Now I can be with Skullman even while driving."
2006303-97 = "And Sensei picked it out for me."
2006303-98 = "I'll treasure it. Thank you."
2006303-102 = "We should head back soon. Everyone's waiting."
2006303-104 = "(The next day, Azusa agreed to show off her tank)"
2006303-109 = "[ns7] \"The tank is here, but...\"\n[ns8] \"Azusa? Where are youー?\""
2006303-112 = "Inside, Sensei. Come on in."
2006303-118 = "[ns9] (Stepping inside the tank...)\n[ns10] (A sharp, stinging sensation pierced my eyes and nose.)"
2006303-121 = "Sensei, are you okay?"
2006303-122 = "Sorry, I didn't have a gas mask."
2006303-123 = "I'll put some on you, too. This should stop your eyes from stinging."
2006303-124 = "[ns] \"What is this pungent smell...?\""
2006303-125 = "Right after we disbanded yesterday, I installed the Skullman air freshener."
2006303-126 = "But having just one looked a little lonely—"
2006303-127 = "So I went back to the store, bought all the other characters, and installed them too."
2006303-128 = "As a result, it created an irritant odor close to CS gas."
2006303-129 = "I suppose one shouldn't be too greedy."
2006303-130 = "[s] \"Gathering all his friends together, Azusa, you're so kind!\""
2006303-134 = "Kin...d?"
2006303-136 = "(Afterwards, she removed the scented inserts from the excess fresheners.)"
2006303-137 = "(Azusa looked satisfied with the neatly lined-up dolls and the pleasant, mild scent.)"
