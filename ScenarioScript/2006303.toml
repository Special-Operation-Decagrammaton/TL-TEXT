[translation]
2006303-1 = "Her Greed"
2006303-2 = "Phew. Thanks, Sensei."
2006303-3 = "I still don't know much about these large shopping malls. #nNot to mention how much I have to buy—"
2006303-4 = "And how escalators are still a little scary..."
2006303-5 = "But I got through it thanks to you. You really helped me out."
2006303-6 = "[s1] \"I'm glad I could be of help.\"\n[s2] \"Come to think of it, you bought a whole bunch of wipers.\""
2006303-9 = "Yes. That's because there are many types of wipers designed for tanks."
2006303-10 = "We also need a lot of them. Every single viewport needs its own wiper."
2006303-11 = "...Ah. I forgot to buy one of them. They were sold out at the last store, but they#nmentioned another store having them. Let's go there now."
2006303-16 = "Stay close to me so you don't get lost. Got it?"
2006303-17 = "[s] \"I'll try my best to not get lost!\""
2006303-18 = "Good."
2006303-20 = "Auto Parts Store"
2006303-23 = "Target acquired—wipers for the commander's cupola."
2006303-27 = "Mission accomplished. [ruby=Return To Base]Let's RTB[/ruby]."
2006303-28 = "Huh...?"
2006303-32 = "W-What is this...!? #nWhy are there Momo Friends here...!?"
2006303-33 = "[s] \"Looks like they had a collab with some auto parts.\""
2006303-34 = "Wh-why would they have something like this in stock!"
2006303-35 = "N-No! This is bad! If I stay here, I-I might lose it...!"
2006303-36 = "[s] \"They're so cute though.\""
2006303-37 = "Of course they are. That's exactly why they're so dangerous!"
2006303-38 = "Even looking at them is clouding my judgement... #nI'm getting the urge to cuddle and fluff them so badly."
2006303-39 = "...But what do auto parts have to do with Momo Friends?"
2006303-43 = "U-Unless...!?"
2006303-44 = "Are these cute and fluffy plushies meant for cleaning the inside of a tank barrel...?"
2006303-45 = "[s] \"I can see the logic, but I don't think it's right!\""
2006303-50 = "I see. So the demand for cute things extends to auto parts as well."
2006303-54 = "This one's a steering wheel cover to keep your hands from getting cold."
2006303-58 = "And this long and skinny Pinky-Paca's a seat belt shoulder pad."
2006303-62 = "They're so fluffy, so round, and so cute."
2006303-66 = "Nghh..."
2006303-67 = "[s3] \"Do you want some?\"\n[s4] \"I can buy them for you.\""
2006303-70 = "There's a lot that I want. #n...Honestly, I want them all."
2006303-71 = "But these are meant to be put inside a tank."
2006303-72 = "If something happens to the tank, I don't want them to go down with it."
2006303-73 = "The feeling of losing something... That emptiness and vanity... I don't like it."
2006303-74 = "...Sorry, Sensei. #nIt's probably not that big of a deal, but I can't help but to think of it."
2006303-75 = "[s5] \"I understand that feeling.\"\n[s6] \"So, how about something like this instead?\""
2006303-81 = "...!"
2006303-82 = "This one... maybe..."
2006303-83 = "Yeah. This should be fine."
2006303-84 = "Heheh..."
2006303-87 = "\"That's one \"Tank Air Freshener ~Lavender Scented~ Skullman ver\"! #nThank you for your purchase!\""
2006303-88 = "These types have a strong scent to them, so be careful where you put them."
2006303-92 = "Thanks, Sensei."
2006303-93 = "Since air fresheners are disposable, I can use it to decorate my room once it runs#nout."
2006303-94 = "I won't have to worry about it then."
2006303-95 = "[s] \"I'm glad you like it.\""
2006303-96 = "Now I can be with Skullman even when I'm driving."
2006303-97 = "And it's something you chose for me as well."
2006303-98 = "I'll treasure it. Thank you."
2006303-102 = "It's time we headed back. Everyone's waiting for us."
2006303-104 = "(The next day, Azusa showed me around the tank.)"
2006303-109 = "[ns7] \"I see the tank, but...\"\n[ns8] \"Azusa! Where are you?\""
2006303-112 = "I'm inside. Come in."
2006303-118 = "[ns9] (Once I went inside...)\n[ns10] (I was struck by a stinging sensation in my eyes and nose.)"
2006303-121 = "Sensei, are you all right?"
2006303-122 = "Sorry I don't have a gas mask for you."
2006303-123 = "I'll apply some of this on you. It should help with the prickling in your eyes."
2006303-124 = "[ns] \"What's with that pungent smell...?\""
2006303-125 = "Yesterday, right after everyone separated, I installed the Skullman air freshener."
2006303-126 = "But it looked lonely by itself..."
2006303-127 = "So I went back to the store and bought all of its friends."
2006303-128 = "As a result, it now smells very similar to CS gas in here."
2006303-129 = "It seems this is the price of greed."
2006303-130 = "[s] \"You're so nice for gathering all of its friends together!\""
2006303-134 = "...Nice?"
2006303-136 = "(After that, we removed the scent pack from all of the extra air fresheners.)"
2006303-137 = "(With the figures lined side-by-side like friends and the scent brought to a pleasant#nlevel, Azusa seemed to be satisfied.)"