[translation]
1003306-1 = "Непоколебимая вера"
1003306-2 = "Я старался закончить работу как можно быстрее, чтобы освободить время для планов с Вакамо."
1003306-3 = "Но работа всё прибывала, и в итоге я закончил на шесть часов позже, чем обещал."
1003306-7 = "Наконец я прибыл к месту встречи, опоздав на шесть часов."
1003306-8 = "Я переживал, что за это время Вакамо могла попасть в неприятности,#nпоэтому как можно быстрее начал осматривать окрестности."
1003306-9 = ""
1003306-14 = "[ns] «(Вот она!)»"
1003306-16 = "Как ты можешь вот так лежать перед совершенно незнакомым человеком и выставлять живот?"
1003306-17 = "Придётся преподать тебе урок и показать, что бывает, когда теряешь бдительность."
1003306-18 = "[s] «В-Вакамо?! Что ты делаешь?!»"
1003306-19 = ""
1003306-21 = ""
1003306-22 = ""
1003306-26 = "Получай! Ну как тебе, м-м...? А вот здесь?#nНравится, когда я чешу тебя тут?"
1003306-27 = ""
1003306-30 = "Хи-хи. А вот и нет."
1003306-31 = "Мне больше хочется почесать тебя сзади за шеей."
1003306-32 = "Можешь сколько угодно плакать и дуться, но здесь я решаю, кого и как гладить."
1003306-33 = "[s] «Вакамо? Что ты делаешь?»"
1003306-34 = "Что...?"
1003306-35 = ""
1003306-37 = ""
1003306-38 = "С-Сенсей?!"
1003306-39 = "Ох. Я просто... играла с этой кошкой!"
1003306-40 = "Э-Это не то, чем кажется!"
1003306-41 = "[s] «Это именно то, чем кажется. Вот уж неожиданность.»"
1003306-42 = "П-Правда?"
1003306-43 = "Ах. Кажется, я никогда не говорила вам, как сильно люблю животных."
1003306-44 = "Хи-хи. На самом деле я их обожаю."
1003306-45 = "Мне с ними гораздо проще ладить, чем с людьми.#nОни не разговаривают и не могут сказать ничего обидного..."
1003306-46 = "Они всегда благодарны за внимание и не спешат предавать."
1003306-47 = "Немного грустно, насколько проще им отвечать взаимностью на доброту по сравнению с нами."
1003306-48 = "Я просто не могу удержаться рядом с ними."
1003306-49 = "Мне нравится, какие они чистые и искренние. Хи-хи."
1003306-50 = "[s1] «Д-Да. Отвечать взаимностью...»\n[s2] «Я здорово облажался, да?»"
1003306-51 = "Хм?"
1003306-52 = "Хм?"
1003306-53 = "Почему вы так приуныли? Что-то случилось, Сенсей?"
1003306-54 = "[s3] «Я обещал встретиться с тобой после работы, но подвёл тебя.»\n[s4] «Я подвёл тебя, потому что так долго не мог закончить работу.»"
1003306-55 = "Вам кажется, что вы меня разочаровали?"
1003306-56 = "Вам кажется, что вы меня разочаровали?"
1003306-57 = "Ох. Я заставила вас подумать, будто говорила о вас?"
1003306-58 = "Да что вы, я бы никогда! Разумеется, я полностью вам доверяю."
1003306-59 = "Я даже не допускала мысли, что вы можете меня предать...#nМне такое и в голову не приходило!"
1003306-60 = ""
1003306-62 = ""
1003306-63 = ""
1003306-65 = ""
1003306-67 = "[ns] «В-Вакамо?!»"
1003306-68 = ""
1003306-70 = "Единственное, что меня огорчает, — то, что вы неправильно меня поняли."
1003306-71 = "Мне больно даже представлять, что я могла бы подумать, будто вы вот так меня бросите."
1003306-72 = "Вы опоздали. И что? Такое случается.#nВсего шесть часов — кто вообще считает?"
1003306-73 = "Уж точно не я! Моё сердце весь день колотилось от предвкушения того, что я проведу время с вами!"
1003306-74 = "[s] «Я-Я понял. Теперь можешь меня отпустить...»"
1003306-75 = "Глупости. Подойдите ближе и погладьте меня по щеке.#nИли хотите, чтобы я погладила вашу?"
1003306-76 = "Хи-хи. Я не против ждать сколько угодно, если в конце смогу побыть с вами.#nЯ выдержу столько, сколько понадобится. ♥"
1003306-77 = "Как я вообще могла подумать, что вы меня предали? Пожалуйста, не поймите мои слова неправильно."
1003306-78 = "Я знаю, что такой трагедии никогда не случится. Я даже не знаю, как выразить сейчас свои чувства."
1003306-79 = "[s] «Хорошо, я понял. Успокойся.»"
1003306-80 = "Ох. Вы меня понимаете? Правда?"
1003306-81 = "Какое облегчение!"
1003306-82 = "[s5] «Но зачем ты вообще ждала так долго?»\n[s6] «А если бы я вовсе не смог прийти?»"
1003306-83 = "Вы имеете в виду, если бы вы вообще не пришли?"
1003306-84 = "Вы имеете в виду, если бы вы вообще не пришли?"
1003306-85 = "Зачем вам вообще об этом переживать? Я знаю, что вы никогда не нарушите данное мне обещание."
1003306-86 = "Даже если бы мне пришлось ждать больше шести часов..."
1003306-87 = "...я знаю, что вы никогда не нарушите своего слова. Вы никогда не предаёте моего доверия и всегда направляете мою руку."
1003306-88 = "Поэтому будь то шесть часов, дни, недели или даже месяцы,#nя продолжала бы ждать."
1003306-89 = "Так зачем мне переживать? Хи-хи. Какой же вы глупенький."
1003306-90 = "[s] «...»"
1003306-91 = "По крайней мере, именно так я к этому отношусь."
1003306-92 = "Но сейчас мне всё же немного грустно."
1003306-93 = "Вы думали, что я могу потерять веру в вас из-за такого опоздания.#nКак мне доказать, что этого никогда не случится?"
1003306-94 = "[s] «Тебе правда ничего не нужно доказывать.»"
1003306-95 = "О!"
1003306-96 = "Я придумала."
1003306-97 = "Что, если мы простоим сегодня всю ночь в лунном свете, а я до самого утра буду шептать вам на ухо нежные слова?"
1003306-98 = "Например, о том, что чувства моего сердца к вам никогда не изменятся."
1003306-99 = "Одна мысль об этом приносит мне столько радости, что я едва могу сдержаться.#nКажется, я могу взорваться в любую секунду."
1003306-100 = "[s] «Н-Не хотелось бы этого! Давай займёмся чем-нибудь другим, ладно?»"
1003306-101 = "Чем-нибудь другим...?"
1003306-102 = "Боже! Вы и правда так хотите провести со мной время, да? ♥"
1003306-103 = "Я вне себя от счастья, но..."
1003306-104 = "...мне не стоит бездумно хвататься за возможность снова ошеломить вас.#nЯ слишком предана вам для такого."
1003306-105 = ""
1003306-107 = ""
1003306-108 = ""
1003306-110 = "Я сохраню ваше предложение на будущее."
1003306-111 = "[s] «Ну ладно. Когда время придёт, будь со мной помягче.»"
1003306-112 = "Хи-хи. Вы такой милый, когда нервничаете."
1003306-113 = "Хорошо. Пока я смогу сдержаться — на этот раз. Хи-хи."
1003306-115 = "День уже подходил к концу, но по дороге домой с Вакамо мы всё-таки успели немного пройтись по магазинам."
