[translation]
1005906-1 = "Раны и шрамы"
1005906-6 = "Я получил от сотрудников академии сообщение об инциденте в Тринити."
1005906-7 = "...Мика находится в комнате самоанализа, отбывая наказание за применение насилия на территории академии."
1005906-8 = "[s] «Применение насилия…?»"
1005906-9 = "Да. Сегодня произошёл инцидент, в ходе которого Мика ударила другого студента."
1005906-10 = "[ns1] «…?!» \n[ns2] «Что случилось? Почему?!»"
1005906-13 = "М-Мы всё ещё выясняем подробности."
1005906-14 = "Но, похоже, Мика не принесла купальник на сегодняшний урок физкультуры, хотя знала, что будет плавание. Вместо этого она просто сидела в стороне и наблюдала."
1005906-15 = "[s] «...Её купальник?»"
1005906-16 = "Да. Она и без того сильно опоздала, а потом вместо участия просто слонялась возле бассейна."
1005906-17 = "Поведение Мики на занятии было неподобающим и неуважительным."
1005906-18 = "Некоторые студенты заметили это, им не понравилось, и они высказали претензии. Тогда Мика отреагировала агрессивно и ударила одну из них."
1005906-19 = ""
1005906-22 = "[ns] «...»"
1005906-23 = "К счастью, студент не пострадал, а Мика сама явился для наказания. Поэтому ситуацию удалось разрешить без дальнейшего конфликта."
1005906-24 = "Однако вы прекрасно знаете, что положение Мики как студенты... непростое. Мы надеемся, что этот случай не перерастёт во что-то более серьёзное."
1005906-25 = "Поэтому мы хотели бы попросить вас, как представителя Шале, проконтролировать наказание Мики."
1005906-26 = "[s] «…Понятно.»"
1005906-27 = ""
1005906-29 = ""
1005906-30 = "Спасибо!"
1005906-31 = ""
1005906-33 = ""
1005906-34 = "У меня есть ещё дела, поэтому прошу меня извинить!"
1005906-35 = ""
1005906-37 = ""
1005906-38 = "[ns] «...»"
1005906-39 = ""
1005906-44 = "Я отправился проведать Мику, которая сейчас отбывала наказание."
1005906-49 = ""
1005906-50 = "[ns] «Мика...»"
1005906-51 = "Вот видишь. В итоге всё снова закончилось вот так..."
1005906-52 = "Разочарован? Но ты ведь и так знал, что я плохой студент."
1005906-53 = "Я проблемная девчонка, которая всё портит, если её оставить без присмотра."
1005906-54 = ""
1005906-56 = ""
1005906-57 = "Куда бы я ни пошла, везде только создаю проблемы, так что, наверное, я..."
1005906-58 = ""
1005906-60 = ""
1005906-62 = ""
1005906-63 = ""
1005906-64 = "[ns] «Ты в порядке? Тебя ведь травят, да?!»"
1005906-65 = "Ч-что?!"
1005906-66 = "[s] «Купальник. Ты правда просто потеряла его?»"
1005906-67 = ""
1005906-69 = ""
1005906-70 = "Я-я..."
1005906-71 = "Ты же купил мне этот купальник, Сенсей..."
1005906-75 = ""
1005906-76 = ""
1005906-77 = ""
1005906-78 = "Ч-что?!"
1005906-79 = "Мой купальник пропал? Я куда-то его положила?"
1005906-80 = ""
1005906-85 = "Хи-хи. Всемогущая госпожа из Чайной партии даже со своим шкафчиком разобраться не может."
1005906-86 = "Ну, может, она просто настолько привыкла, что все всегда обслуживают её, что сама уже ничего не умеет."
1005906-87 = "Она ведь такая знатная и высокородная по сравнению с нами. Может, просто не захотела плавать в одном бассейне с простолюдинками вроде нас?"
1005906-88 = "Ой, мусорное ведро сегодня совсем переполнено. Неужели выбрасывать так много всего? Хи-хи-хи!"
1005906-89 = "..."
1005906-90 = ""
1005906-92 = ""
1005906-101 = "Его нет... Я проверила мусорный бак и даже мусоросжигатель, но..."
1005906-102 = "Нигде нет! Почему это происходит? Этот купальник для меня очень важен..."
1005906-103 = ""
1005906-106 = ""
1005906-107 = "Ой, а почему здесь мусор?"
1005906-108 = ""
1005906-111 = "...!"
1005906-112 = "О! Да это не мусор! Просто какой-то мерзкий изрезанный купальник, да?"
1005906-113 = ""
1005906-115 = ""
1005906-116 = "Хотя теперь это уже почти мусор."
1005906-117 = ""
1005906-119 = ""
1005906-120 = ""
1005906-121 = ""
1005906-122 = ""
1005906-124 = ""
1005906-125 = "Как вы смеете..."
1005906-127 = "И-Ик?!"
1005906-128 = "Что она делает?! Я думала, Мике больше нельзя давать сдачи! Она же должна быть связанным по рукам и ногам бумажным тигром!"
1005906-129 = "М-Мы сейчас умрём?"
1005906-130 = ""
1005906-132 = ""
1005906-133 = ""
1005906-134 = ""
1005906-136 = "(Нет...)"
1005906-137 = "(Я не могу снова так поступить... Я...)"
1005906-138 = "Ведьма! Она ведьма! С-Спасите меня!"
1005906-139 = ""
1005906-142 = "П-Подождите! Не бросайте меня!"
1005906-143 = ""
1005906-146 = "Эй! Отпусти меня! А-Ай!"
1005906-147 = ""
1005906-152 = "А-Ай... Ах...!"
1005906-153 = ""
1005906-155 = ""
1005906-156 = ""
1005906-157 = "Мой купальник... Сенсей..."
1005906-159 = "..."
1005906-160 = "Мне так жаль, Сенсей. Ты подарил мне этот купальник, а теперь он полностью испорчен... Кажется, его уже даже не починить."
1005906-161 = "Хотя это всё моя вина. Вот расплата за все ужасные вещи, которые я натворила... Если бы я просто была хорошей девочкой, такого бы со мной не происходило..."
1005906-162 = "Клянусь, в этот раз я правда, правда старалась вести себя хорошо... Но опять всё испортила."
1005906-163 = "Я всегда только всё тебе порчу, Сенсей! Я так ждала урока физкультуры, чтобы надеть новый купальник, который ты мне купил..."
1005906-164 = "Наверное, мне просто не суждено быть хорошей..."
1005906-165 = "Я хотела всё исправить и так старалась..."
1005906-166 = "[s] «Ладно, Мика. У тебя сегодня есть время?»"
1005906-167 = "А?"
1005906-168 = "Вот это неожиданно... Ну, до комендантского часа в общежитии у меня ещё много времени, но..."
1005906-169 = ""
1005906-171 = ""
1005906-172 = ""
1005906-174 = "[ns] «Тогда не хочешь посетить урок плавания от Сенсея?»"
1005906-175 = "...Что?"
1005906-176 = ""
1005906-182 = "Магазин у Тринити"
1005906-184 = ""
1005906-185 = "Понятно. Повреждения серьёзные, но на самом деле это вполне можно починить."
1005906-187 = "..."
1005906-188 = "Конечно, заплатки будут немного заметны, но плавать в нём можно будет без проблем. Гарантийный срок ещё не закончился, так что сделаю бесплатно."
1005906-189 = "[s] «Тогда, пожалуйста, займитесь им.»"
1005906-190 = "Конечно. Это не должно занять много времени, так что подождите здесь."
1005906-193 = ""
1005906-194 = "Готово, все заплатки на месте. Держите!"
1005906-195 = ""
1005906-197 = ""
1005906-199 = "..."
1005906-200 = "Так одежду, оказывается, можно вот так чинить..."
1005906-201 = "Я и не знала... Думала, если одежда порвалась, её просто заменяют новой."
1005906-205 = "Э-Эм, Сенсей... Куда мы идём? Это ведь не дорога к классу..."
1005906-206 = "Ты же говорил, что у нас будет урок плавания? Хотя я всё ещё не совсем понимаю, что ты под этим имел в виду."
1005906-207 = "И вообще, я почти уверена, что все бассейны в это время уже закрыты..."
1005906-208 = "[s] «Я знаю одно место.»"
1005906-209 = ""
1005906-211 = ""
1005906-213 = "Бассейн дополнительного корпуса"
1005906-215 = "Где...?"
1005906-216 = ""
1005906-218 = ""
1005906-219 = ""
1005906-220 = "А. Понятно. Это место..."
1005906-221 = "[s] «У тебя ведь с ним связано много воспоминаний, да?»"
1005906-222 = "...Ага. Много."
1005906-223 = "Какое-то время это место вообще стояло заброшенным. Всё было изношено, грязно, и большинство считало, что восстановить его уже невозможно."
1005906-224 = "Но посмотри на него сейчас... Чистое и красивое."
1005906-225 = "[s3] «Вот именно. То же самое и с твоим испорченным купальником.»\n[s4] «Мне кажется, это относится и ко многим другим вещам.»"
1005906-228 = "..."
1005906-229 = "То есть мы будем плавать здесь? Вдвоём?"
1005906-230 = "В заброшенном бассейне посреди ночи, только ты и я? Ты точно не против? Если нас поймают, у тебя же будет куча проблем."
1005906-231 = "[s] «...А? В-Вот как?»"
1005906-232 = "Ну, я не против, даже если нас поймают! Я пойду переоденусь в купальник! Сейчас вернусь! ☆"
1005906-233 = ""
1005906-235 = ""
1005906-236 = "[ns] «П-Подожди, Мика?!»"
1005906-239 = "Та-дам! ☆"
1005906-240 = "Смотри, Сенсей! Немного тесноват, но, по-моему, сидит идеально!"
1005906-241 = ""
1005906-243 = ""
1005906-244 = "Ну как? Как тебе? Нормально на мне сидит? Это всего лишь школьный купальник, но... тебе нравится?"
1005906-245 = "М? М-м-м??"
1005906-246 = "[s] «Э... Эм... Ты слишком близко, Мика.»"
1005906-247 = "Ахаха! Что такое? Это же просто я в купальнике! Если будешь так отступать, заденешь мои чувства! ☆"
1005906-248 = "[s] «...»"
1005906-249 = ""
1005906-251 = ""
1005906-252 = ""
1005906-259 = "...Ой. Кажется, я немного увлеклась."
1005906-260 = "[s] «Ну, ты всегда сначала делаешь, а потом уже жалеешь.»"
1005906-261 = "Хи-хи. Ага, видимо, настоящая натура человека не так-то легко меняется. ☆"
1005906-262 = ""
1005906-265 = "Ну что, присоединишься ко мне, Сенсей? Здесь так приятно и прохладно!"
1005906-266 = "[s] «Нет. Мне и здесь вполне хорошо...»"
1005906-267 = ""
1005906-270 = "Бип! Кто здесь? В это время находиться на территории запрещено!"
1005906-271 = "А?! Это охрана, Сенсей!!"
1005906-272 = "[s5] «Я только что вспомнил об одном срочном деле! Прошу нас извинить!»\n[s6] Схватить Мику и убежать."
1005906-273 = ""
1005906-277 = "Сенсей?!"
1005906-278 = ""
1005906-282 = "Сенсей?!"
