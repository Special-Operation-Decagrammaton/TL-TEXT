[translation]
10050030-1 = "Эпизод 3;Отчёт о продажах"
10050030-2 = "Жилой корпус Тринити"
10050030-3 = "Ох... Сегодня мы вкалывали до упаду, а ведь это был только первый день."
10050030-4 = "Хорошая работа, Президент."
10050030-5 = "Как ни крути, Тринити и правда впечатляет. Не думала, что у них найдётся место, где мы сможем остановиться."
10050030-6 = "У этой школы куда больше коммерческих и политических связей, чем у большинства. Полагаю, гостевые помещения для них почти необходимость."
10050030-7 = "...Хотя стоило это недёшево..."
10050030-8 = "Хм, это съедает больше нашей прибыли, чем мне хотелось бы. Может, стоило выбить долю побольше..."
10050030-9 = "Ни один человек в здравом уме, даже Мэрури, не согласился бы на это в тот момент..."
10050030-10 = "Но сегодня у нас был довольно успешный день. Наверняка мы сможем покрыть расходы на дорогу и проживание."
10050030-11 = "Тоже верно. Давай посмотрим, мы в плюсе или в минусе."
10050030-12 = "Хи-хи-хи. Моя любимая часть. Ну-ка, ну-ка..."
10050030-13 = "..."
10050030-14 = "..."
10050030-15 = ""
10050030-17 = ""
10050030-18 = ""
10050030-19 = "Т-Таканэ, возьми себя в руки!"
10050030-20 = "Президент, это сон? Другого рационального объяснения я придумать не могу."
10050030-21 = "Соберись, Таканэ. Это реальность. Всё по-настоящему."
10050030-22 = "Невозможно! С нами не происходят такие хорошие вещи."
10050030-23 = "Знаю, знаю. Но прими это. Прочувствуй. Насладись моментом."
10050030-24 = "Масштаб и правда совершенно другой. Я даже нули с трудом могу сосчитать. Тринити страшная... Очень страшная..."
10050030-25 = "Я же говорила: хочешь заработать — иди по следу денег!"
10050030-26 = "Ещё помогло то, что студентки Тринити сочли сюжет свежим и необычным."
10050030-27 = "Одна студентка даже сказала: «Будто пробуешь совершенно новый вкус, которого никогда в жизни не испытывала.»"
10050030-28 = "То, что привычно для Красной Зимы, в другом месте всё ещё может казаться новым и захватывающим."
10050030-29 = "Вот о чём я и говорю! Культура хочет, чтобы ею обменивались. Ей это НЕОБХОДИМО. Без нормального обращения она застаивается и становится вредной, разъедая всё вокруг."
10050030-30 = "...Как устаревшая, испорченная мечта."
10050030-31 = "Президент..."
10050030-32 = "В конце концов, наша работа — распространять культуру и обеспечивать её обращение."
10050030-33 = "...Ведь культура — это небилогический организм, который растёт на почве под названием «деньги»."
10050030-34 = "Возможно, потому что ценность денег — и сам акт обмена — стали понятием куда более масштабным, чем валюта сама по себе..."
10050030-35 = "В любом случае обращение необходимо. В этом суть нашей работы."
10050030-36 = "Застоявшиеся мечты и застоявшаяся культура — трагичное наследие, которое разрушает общество."
10050030-37 = "Кроме того, вместе с культурой обращаются и деньги. Хе-хе-хе."
10050030-38 = "Да-да, конечно, Президент..."
10050030-39 = "В любом случае, пора рассчитываться уже в другом смысле! Для начала свяжемся с Фронтом освобождения знаний!"
10050030-40 = ""
10050030-42 = ""
10050030-43 = "*зевает* Что такое, Якумо? Для этого уже слишком поздно."
10050030-44 = "Сейчас не время дремать, Мэру. Мне много чего хочется сказать... но, уверена, цифры произведут куда большее впечатление, чем слова."
10050030-45 = "Вот. Итоги за сегодня."
10050030-46 = "Итоги...? А, точно-точно. Тогда..."
10050030-47 = ""
10050030-49 = ""
10050030-50 = ""
10050030-51 = ""
10050030-53 = "Мэру? Мэру?! Что случилось?!?!"
10050030-54 = "Момидзи. У меня, должно быть, галлюцинации... Посмотри, пожалуйста. Убедись, что я не сошла с ума."
10050030-55 = "А? Значит, это... сегодняшние итоги? Но...?"
10050030-56 = "А-а-а!!!"
10050030-57 = "Скажи честно, Якумо. Ты банк ограбила или что? Совершила экономическое преступление? Обвела вокруг пальца весь финансовый сектор?"
10050030-59 = "Ты обо мне совсем неправильного мнения. Я живу с принципом «бизнес прежде всего»."
10050030-60 = "Я никогда не стану связываться с грязными деньгами. Грязный источник — это грязные риски для будущего бизнеса."
10050030-61 = "Тогда это..."
10050030-62 = "...по-настоящему?"
10050030-63 = "Ай-яй. Вот что бывает, когда творческих людей оставляют без присмотра. Они даже не понимают, что значит «продавать»."
10050030-64 = "Ну же, сходите и нормально поешьте. Дай угадаю... Вы опять ужинали надеждами и мечтами?"
10050030-65 = "Мы правда можем...?"
10050030-66 = "Да. Никто не сможет отрицать результаты вашей тяжёлой работы."
10050030-67 = "Вот и всё. Поздравляю вас."
10050030-68 = "Э-э, а, эм, ну... То есть..."
10050030-69 = "Ты же знаешь, Мэру. Скажи нормально!"
10050030-70 = "Спасибо, Издательский отдел. Вы... Вы нас правда спасли...!"
10050030-71 = "Ну, полагаю, книга и правда получилась хорошей. Потому и продалась."
10050030-72 = "У меня нет таланта продавать вещи, у которых нет потенциала."
10050030-73 = "...Ты? Раздаёшь комплименты?"
10050030-74 = "Это настолько редкое явление? Ну, могу обещать, что с Таканэ такого точно никогда не случится."
10050030-75 = "Вот тут мы с тобой согласны."
10050030-77 = "...Президент? Мэрури? О чём это вы двое вообще говорите?"
10050030-78 = "Ик?! Н-Ни о чём!"
10050030-79 = "Д-Да! Просто... Эм! Просто деловой разговор, который бывает между деловыми людьми!"
10050030-80 = "Хм..."
10050030-81 = "П-Перейдём к другому. С такой скоростью, с какой книги разлетаются с полок, через несколько дней у нас закончатся запасы."
10050030-82 = "Так что просто доверьтесь нам и ждите нашего возвращения из-за горизонта!"
10050030-83 = "Д-Да! Я и раньше вам доверяла, но увидеть результат своими глазами заставило меня доверять ещё сильнее!"
10050030-84 = "Доверие Мэрури шокирует сильнее, чем комплимент Президента."
10050030-85 = "В общем, мы спать! Спокойной ночи! Спасибо!"
10050030-86 = "Д-Да! Хорошенько поешьте!"
10050030-87 = ""
10050030-89 = ""
10050030-90 = ""
10050030-91 = "Ну что ж. Может, и нам пора укладываться? Завтра, думаю, нас ждёт ещё один насыщенный день продаж!"
10050030-92 = "Да, Президент. Давайте отдохнём."
10050030-93 = "Ты на удивление хорошо выдерживаешь такой напряжённый график. Я впечатлена."
10050030-94 = "Ничего особенного. Да и по сравнению с тем, как всё бывает дома, в Красной Зиме, здесь довольно приятно..."
10050030-95 = "Верно-верно. Но в тебе есть какая-то благородная аура, Таканэ."
10050030-96 = "Вот сегодня кто-то сказал, что даже не знал, будто в Красной Зиме учится такая принцесса, как ты..."
10050030-97 = "Ч-Что вы такое говорите, Президент?! Вы же знаете, что в Красной Зиме никакого дворянства нет!"
10050030-98 = "Ну а какой маркетинг обходится без крошечной капельки обмана?"
10050030-99 = "...Если честно, большая часть рекламы в реальности где-то в зоне «ТЕХНИЧЕСКИ мы говорим правду»."
10050030-100 = "...К чему вы клоните, Президент?"
10050030-101 = "Примерно вот к чему. Выслушай меня. Всё это часть нашего маркетинга! Так что..."
10050030-106 = "Клубная комната Комитета правосудия"
10050030-107 = "Здравствуйте, Сенсей! Шимико! Давайте и сегодня вместе добиваться справедливости!"
10050030-108 = "[s] «А, привет, Маширо. Какое бодрое и энергичное утро...»"
10050030-109 = "Ты сегодня очень воодушевлена, Маширо..."
10050030-110 = "А, простите, если напугала вас. Меня просто очень радует мысль, что я буду работать не только с Библиотечным комитетом, но и с Сенсеем."
10050030-111 = "И несанкционированная книга такого рода должна быть самой настоящей противоположностью справедливости!"
10050030-112 = "Наверняка это подозрительная, бесполезная и неприятная вещь..."
10050030-113 = "Мы должны вырвать её с корнем!"
10050030-114 = "[s] «(Кажется, рвение Маширо направлено немного не туда...)»"
10050030-115 = "Ты, случайно, не читала эту книгу, Маширо?"
10050030-116 = "Конечно нет! Мне не нужно её читать, чтобы понять, что она противоречит справедливости."
10050030-117 = "В-вот как...?"
10050030-118 = "К тому же время — ограниченный ресурс..."
10050030-119 = "Поэтому я уже разместила членов Комитета правосудия по всему Тринити."
10050030-120 = "Очень скоро мы отследим источник распространения этой книги!"
10050030-121 = "[s] «Что? Уже?!»"
10050030-122 = "Да! Сенсей. Я... сделаю всё, что смогу!"
10050030-123 = "Я вас не подведу!"
10050030-124 = "Спасибо всем. Пожалуйста, оставайтесь на своих позициях."
10050030-125 = "Поняла!"
10050030-126 = ""
10050030-128 = ""
10050030-129 = ""
10050030-130 = "Тогда я тоже отправляюсь в поле. Связывайтесь со мной в любое время!"
10050030-131 = ""
10050030-133 = ""
10050030-135 = "Её рвение невероятно..."
10050030-136 = "[s] «Да... Настолько, что меня это даже беспокоит.»"
10050030-137 = "Вы переживаете за Маширо, Сенсей?"
10050030-138 = "[s1] «Ну да, за неё. За Маширо...»\n[s2] «Но ещё и за студенток, которые распространяют книгу.»"
10050030-141 = "А, вы о них. Вообще-то я думала о чём-то похожем."
10050030-142 = "Не ожидали? Но президент Уй, скорее всего, сказала бы что-нибудь вроде: «Человек, который любит книги, не может быть плохим.»"
10050030-143 = "А? А вдруг это просто кто-то, кто смотрит на книги как на способ заработать?"
10050030-144 = "..."
10050030-145 = "Возможно, но не думаю, что здесь именно такой случай."
10050030-146 = "С современными технологиями книги скорее стали предметом коллекционирования. Вряд ли кто-то станет ими торговать, если хоть немного их не любит."
10050030-147 = "Если человек правда хотел бы просто заработать, зачем ему продавать книги? Сейчас есть куда более эффективные способы."
10050030-148 = "[s] «В этом... есть смысл.»"
10050030-149 = "Верно? Поэтому я считаю, что те, кто устроил весь этот переполох, наверняка хорошие люди."
10050030-150 = "...По крайней мере, скорее всего, они не ужасные люди. Уверена, мы сможем друг с другом поговорить."
