[translation]
2005406-1 = "Система жизнеобеспечения 2"
2005406-2 = ""
2005406-3 = ""
2005406-4 = "...Мне так стыдно..."
2005406-5 = "[s1] «Всё нормально. Ты, наверное, очень устала.»\n[s2] «Иногда проспать — часть жизни.»"
2005406-8 = "Но в нынешней ситуации..."
2005406-9 = "Если честно, это во многих смыслах подрывает мой авторитет. Я—"
2005406-10 = "Что? Не хотите, чтобы я была так «строга к себе»?"
2005406-11 = "И думаете, это случилось потому, что в последнее время вы слишком сильно на меня полагались?"
2005406-12 = "И всё же..."
2005406-13 = "[s3] «Эй, кажется, ты меня не поняла!»\n[s4] «Сегодня я буду твоей „системой жизнеобеспечения“, Химари!»"
2005406-16 = "...А?"
2005406-17 = "Сенсей будет моей...?"
2005406-18 = "Но, но это—!"
2005406-19 = "Помогали ли мне раньше другие? Конечно, но..."
2005406-20 = "Ну... да. Поначалу Эйми очень мне помогала, а в последнее время иногда подключалась и Токи..."
2005406-21 = "Н-Но всё равно! Получать помощь от Сенсея — совсем другое..."
2005406-22 = "[s] «...Тебе настолько неприятна эта мысль?»"
2005406-23 = "Конечно нет! Наоборот...!"
2005406-24 = "...Наоборот..."
2005406-25 = "Эм, э-э-э..."
2005406-26 = ""
2005406-28 = ""
2005406-30 = "(Мне это нравится... Нравится настолько, что я даже не могу произнести это вслух...!)"
2005406-31 = "(И мне ужасно неловко из-за самого этого чувства! Я не знаю, что сказать!)"
2005406-32 = ""
2005406-34 = ""
2005406-36 = "[ns5] «Ты такая способная, Химари! Но иногда я бы хотел, чтобы ты позволяла кому-нибудь помогать тебе.»\n[ns6] «Если я подхожу — положись на меня!»"
2005406-39 = ""
2005406-41 = "Сенсей? Не стоит так легко говорить подобные вещи!"
2005406-42 = "В отличие от меня, разумеется. Мне такие предупреждения не нужны."
2005406-43 = "Если вы и дальше будете так терять бдительность, особенно рядом со студентами вроде Рио — умными, опасными девушками, которые многого требуют..."
2005406-44 = "всё может стать довольно... хлопотно, не так ли?"
2005406-45 = "[s] «А это тоже звучит весело!»"
2005406-46 = "Что?!"
2005406-47 = "Вы хотите сказать, что студенты обладают уникальной привилегией беспокоить вас «когда угодно и чем угодно»?"
2005406-48 = "..."
2005406-49 = "Серьёзно! Перестаньте говорить такие вещи!"
2005406-50 = "...Пожалуйста, не испытывайте моё терпение. Я знаю, вы не специально."
2005406-51 = "Если бы я действительно захотела, то тоже могла бы стать настоящей занозой, знаете ли."
2005406-52 = "[ns] «Химари?»"
2005406-53 = ""
2005406-55 = "А-а-а-а, нет! Ничего! Разумеется!"
2005406-56 = "Кхм..."
2005406-57 = "Что ж, как вы и сказали, Сенсей."
2005406-58 = "Сегодня я собираюсь по-настоящему вам мешать. Быть ужасно назойливой и требовательной. Это... допустимо?"
2005406-59 = "[s7] «Уф, это и есть „что посеешь, то и пожнёшь“...?»\n[s8] «Похоже, выбора нет! Вызов принят!»"
2005406-62 = "Фу-фу-фу..."
2005406-63 = "Вы сами это сказали. Готовы к последствиям, Сенсей?"
2005406-64 = "Так и началось моё хлопотное (?) время с Химари."
2005406-66 = ""
2005406-67 = "Ах... Эта раковина такая высокая, а мне нужно помыть руки. Неужели никто меня не поднимет?"
2005406-68 = "Я ведь такая хрупкая и лёгкая. И раковина не так уж далеко... правда?"
2005406-69 = "[ns] «Да-да.»"
2005406-70 = ""
2005406-71 = ""
2005406-73 = ""
2005406-75 = "Тёплое дыхание Химари коснулось моего уха."
2005406-76 = "[ns] «?!»"
2005406-77 = "Ох. Чему вы так удивились, Сенсей?"
2005406-78 = "Разве дыхание... не необходимо для жизни? Я ведь вам НЕ МЕШАЛА, правда?"
2005406-79 = ""
2005406-80 = "Формально она была права, но...!"
2005406-81 = "Я постарался сосредоточиться, помогая ей добраться до раковины."
2005406-82 = ""
2005406-84 = ""
2005406-85 = ""
2005406-87 = "..."
2005406-88 = "(Что я вообще делаю? Кажется, сердце сейчас взорвётся!)"
2005406-89 = "(Ах... Это куда напряжённее, чем я ожидала.)"
2005406-90 = "(Как же стыдно...!)"
2005406-92 = ""
2005406-93 = "Ах... Что же делать? Мои бедные хрупкие руки совсем ослабли. Я так много работала."
2005406-94 = "Я бы с ОГРОМНЫМ удовольствием получила массаж, но ещё я слегка проголодалась и чувствую слабость..."
2005406-95 = "О, кажется, в холодильнике у меня припрятаны шоколадные брауни. Вот бы кто-нибудь меня ими покормил..."
2005406-98 = ""
2005406-99 = "Спасибо, Сенсей."
2005406-100 = "В таком случае..."
2005406-101 = ""
2005406-103 = ""
2005406-104 = "[ns] «?!»"
2005406-105 = "Фу-фу. Что такое, Сенсей?"
2005406-106 = "Похоже, сахар в крови падает немного быстрее, чем я ожидала."
2005406-107 = "Я не удержалась, наклонилась и потянулась попробовать."
2005406-108 = "[s] «П-Понятно. Тебе правда очень хотелось, да...?»"
2005406-109 = ""
2005406-111 = ""
2005406-113 = "(Кажется, мои щёки горят! Только бы он не заметил!)"
2005406-114 = "(Лицо Сенсея так близко...!)"
2005406-115 = "(То есть это я сама приблизилась, но всё равно...!)"
2005406-116 = "..."
2005406-117 = "(Но главное — неужели Сенсей правда ничего не чувствует, даже когда такая редкая и хрупкая красавица находится так близко?)"
2005406-118 = ""
2005406-120 = ""
2005406-121 = "(Нет, может быть...? Я допустила ошибку?)"
2005406-122 = "..."
2005406-123 = "(Может, я слишком резко сократила дистанцию, и это дало обратный эффект...? Слишком агрессивно.)"
2005406-124 = "(Точно. Это как добавить слишком много катализатора...)"
2005406-125 = "(Увеличенное количество катализатора может ускорить реакцию и быстрее дать результат...)"
2005406-126 = "(Но одновременно повышает риск нежелательных и непредвиденных побочных продуктов. Стабильность всей системы нарушается!)"
2005406-127 = "(Как я могла допустить такую ошибку? Мне следует уйти в отставку и переосмыслить свои решения...)"
2005406-129 = ""
2005406-130 = "Ох. Уже ночь. Ну и денёк."
2005406-131 = "[s] «Что? Уже?!»"
2005406-132 = "Здесь трудно чётко отличить день от ночи, поэтому легко потерять счёт времени."
2005406-133 = "В конце концов, вокруг нас происходит настоящее «сверхъестественное явление». Здесь всё такое... необычное."
2005406-134 = "Ах... Мой режим сна совершенно сбился, и мне трудно засыпать вовремя. Неужели никто не побудет рядом и не поможет мне как следует отдохнуть?"
2005406-135 = "[s] «Это правда нормально?!»"
2005406-136 = "О?"
2005406-137 = "Я ведь доверяю вам больше всех на свете, разве нет?"
2005406-138 = "[s] «...!!»"
2005406-140 = "[ns9] «Понятно. Я всё понял.»\n[ns10] «В конце концов, сейчас я — система жизнеобеспечения Химари!»"
2005406-143 = ""
2005406-144 = "Я отвёл Химари к кровати, надеясь помочь ей уснуть."
2005406-145 = "Но потом...!"
2005406-146 = "Хия! ♪"
2005406-147 = ""
2005406-151 = "[ns] «Химари?!»"
2005406-152 = "Что такое, Сенсей? Вы же сказали, что поможете мне отдохнуть."
2005406-153 = "Знаете, когда я не могу уснуть, мне нужно, чтобы кто-нибудь был рядом. Это очень помогает."
2005406-154 = "Хм? «А как же Эйми и Токи»?"
2005406-155 = ""
2005406-157 = ""
2005406-158 = "(...Если честно, они не помогут.)"
2005406-159 = "(...На самом деле Эйми, скорее всего, довела бы меня до теплового удара. А это совершенно НЕ продуктивный способ отдыха.)"
2005406-160 = ""
2005406-162 = ""
2005406-164 = "Ох, Сенсей. Они хорошие, но..."
2005406-165 = "(Прости, Сенсей.)"
2005406-166 = "(Мне так жаль, что я настолько хлопотная... Правда.)"
2005406-167 = "[ns11] «Ладно, хорошо.»\n[ns12] «Но только пока ты не уснёшь.»"
2005406-170 = "Д-Да. Разумеется!"
2005406-171 = ""
2005406-173 = ""
2005406-176 = "Я уложил Химари и выключил свет."
2005406-177 = "Её ровное дыхание оказалось неожиданно успокаивающим."
2005406-178 = "Я ведь сказал, что останусь только до тех пор, пока Химари не уснёт..."
2005406-179 = "...Но в итоге первым вырубился я."
2005406-180 = ""
2005406-183 = ""
2005406-186 = "Сенсей..."
2005406-187 = "Вы очнулись?"
2005406-188 = "...Ровное дыхание, небольшое снижение температуры тела, а монитор ЭЭГ показывает тета-волны и небольшие следы дельта-волн..."
2005406-189 = "Фу-фу..."
2005406-190 = "Полагаю, в последнее время именно вы расходовали больше всего сил."
2005406-191 = ""
2005406-194 = "Я не был уверен, но мне показалось, будто меня обхватили руками..."
2005406-195 = ""
2005406-196 = "Сенсей."
2005406-197 = "...Сенсей."
2005406-198 = "Наш—"
2005406-199 = "Сейчас вы только мой, Сенсей..."
2005406-200 = "Вы это знаете?"
2005406-201 = "И сейчас я веду себя очень плохо."
2005406-202 = "Если вы заметили, надеюсь, вы простите меня и просто спишете всё на сон."
2005406-203 = "А если не заметили... Что ж, я бы предпочла, чтобы вы как можно дольше оставались в неведении."
2005406-204 = "В наших обстоятельствах, посреди всего происходящего, думать о таком..."
2005406-205 = "...забыв о том, что я гениальная, хрупкая и прекрасная девушка... Я начинаю разочаровываться в себе."
2005406-206 = "Если уж винить кого-то, то мне хотелось бы возложить малую долю ответственности на вас — того, кто сделал меня такой, но..."
2005406-207 = "Нет. Это действительно было бы слишком несправедливо."
2005406-208 = ""
2005406-210 = ""
2005406-211 = ""
2005406-212 = "Простите, Сенсей."
2005406-213 = "Простите."
2005406-214 = "Но именно сейчас, Сенсей..."
2005406-215 = "И наверняка впредь..."
2005406-216 = "для меня вы — тот, кого не сможет заменить никто и ничто во всём мире..."
2005406-217 = "Именно настолько вы мне дороги и важны."
2005406-220 = "Я не был уверен, но мне показалось, что что-то мягкое коснулось моего лба."
2005406-221 = "Спокойной ночи, Сенсей."
2005406-222 = "И, пожалуйста, берегите себя."
