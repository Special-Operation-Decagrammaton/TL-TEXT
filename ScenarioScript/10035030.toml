[translation]
10035030-1 = "Эпизод 3;Играем с детьми!"
10035030-2 = "Вот и наше новое назначение."
10035030-3 = "Здесь играют маленькие дети."
10035030-4 = "Хорошо, что мы в помещении, но присматривать за детьми непросто..."
10035030-5 = "У них столько энергии, за ними трудно угнаться."
10035030-6 = ""
10035030-8 = ""
10035030-9 = "..."
10035030-10 = "[s1] «Считай это новым началом.»\n[s2] «Просто не зацикливайся на том, что случилось там.»"
10035030-13 = "Конечно, Сенсей."
10035030-14 = "Я смешала обязанности Бюро общественного порядка и Бюро общественной безопасности."
10035030-15 = "Я так долго занималась охраной порядка, что теперь это уже часть моей натуры."
10035030-16 = "Всё нормально! Все ошибаются!"
10035030-17 = "Никто не начинает идеально."
10035030-18 = "Не унывайте, директор."
10035030-19 = "...Спасибо."
10035030-20 = "Очевидно, вы все куда лучше меня умеете работать с людьми."
10035030-21 = "Может, в следующий раз дадите мне пару советов."
10035030-22 = "Конечно. Во-первых, нужно работать в ровном темпе и регулярно делать перерывы."
10035030-23 = "Она не спрашивает тебя, как отлынивать от работы, Фубуки!"
10035030-24 = "Ладно тогда, специально для вас поделюсь тремя принципами, которым меня научили, когда я только начинала."
10035030-26 = "Три принципа, говоришь."
10035030-27 = "Это должно быть интересно."
10035030-29 = "Итак, вот они..."
10035030-30 = "«Служение, чуткость и искренность.»"
10035030-31 = "Служение! Всегда думай как слуга народа!"
10035030-32 = "Чуткость! Активно и внимательно слушай, когда гражданину есть что сказать."
10035030-33 = "Искренность! Помогай не потому, что обязана, а потому, что искренне хочешь."
10035030-34 = "На нашей последней квартальной аттестации был тест по этим принципам. Я сдала его на отлично."
10035030-35 = "А потом она провалила тест по стрельбе—"
10035030-36 = "Не будем об этом!"
10035030-37 = "И ещё кое-что."
10035030-38 = "Есть ещё?"
10035030-39 = "Это не входит в три принципа, но есть ещё четвёртое «С». Я узнала о нём уже на работе."
10035030-40 = "Улыбка."
10035030-41 = "Улыбка...?"
10035030-42 = "Верно. Что бы ни происходило, я всегда стараюсь начать с улыбки."
10035030-43 = "Чаще всего люди улыбаются в ответ, и нам обоим становится легче."
10035030-44 = "Понятно. Я запомню."
10035030-45 = "Ну что ж! Пойдём поздороваемся с детьми."
10035030-49 = "Да, это точно детский бассейн."
10035030-50 = "Вода даже до пояса не доходит."
10035030-51 = "Я не лучший пловец, но здесь-то я смогу спасти кого угодно!"
10035030-52 = "И дети все такие милые!"
10035030-53 = "Эй, у нас новенькая!"
10035030-54 = "Хи-хи, как будем с ней играть?"
10035030-55 = "А-А?"
10035030-56 = "У меня дурное предчувствие..."
10035030-57 = "Эй, ты, в жёлтом купальнике! Не бегай так! Это опасно!"
10035030-58 = "Хи-хи! Сюда!"
10035030-59 = "А ну вернись сюда!"
10035030-60 = ""
10035030-62 = ""
10035030-63 = "Сотрудница Кирино, осторожно!"
10035030-65 = "Попалась! Бросок на спину!"
10035030-66 = ""
10035030-70 = ""
10035030-72 = "Уф!"
10035030-73 = ""
10035030-76 = ""
10035030-77 = "Ого, исполнено идеально."
10035030-78 = "У ребёнка есть потенциал."
10035030-79 = "*бульк* *бульк* *вдох*"
10035030-80 = "Ф-Фубуки! Помоги!"
10035030-81 = "Просто встань, Кирино."
10035030-82 = "...А. Вода по пояс, точно."
10035030-83 = "А-а! Ведьма ожила!"
10035030-84 = "Хватайте её! Хватайте!"
10035030-85 = "Эй! Хватит брызгать в меня! Я глаза открыть не могу!"
10035030-86 = "Не думайте, что я просто буду стоять и терпеть!"
10035030-87 = "Эй! Эй!"
10035030-88 = ""
10035030-90 = ""
10035030-91 = "..."
10035030-92 = "[s] «Хех, похоже, силы здесь примерно равны.»"
10035030-93 = "Правда ведь?"
10035030-94 = "Похоже, придётся мне вмешаться."
10035030-95 = "Что ты задумала?"
10035030-96 = ""
10035030-97 = ""
10035030-98 = "Все! Внимание, пожалуйста!"
10035030-99 = "Это ещё кто?"
10035030-100 = "Она какая-то чудаковатая, нет?"
10035030-101 = "А теперь... играем в «Красный свет, зелёный свет»!"
10035030-102 = "«Красный свет, зелёный свет»?"
10035030-103 = "Посмотрим, кто пройдёт дальше всех."
10035030-104 = "(Они же не бросят всё и не станут играть с ней просто так.)"
10035030-105 = "Победитель получит ещё десять очков!"
10035030-106 = "(Какие ещё «очки»? Дети на такое не купятся...)"
10035030-107 = "Ладно, первый раунд, поехали!"
10035030-108 = "Зелёный свет! ...Красный свет!"
10035030-109 = "(...О-Хорошо, я замерла!)"
10035030-110 = "(Я даже не понимаю, зачем мы это делаем, но...)"
10035030-111 = "(...Я не хочу проиграть!)"
10035030-113 = "Эй, ты! Если пошевелишься — выбываешь. Тебя это устраивает?"
10035030-114 = ""
10035030-116 = ""
10035030-117 = "Эти дети только что носились как сумасшедшие..."
10035030-118 = "...а теперь совершенно смирные."
10035030-119 = "Ладно, зелёный свет! И-и-и... красный свет!"
10035030-121 = "Фубуки продолжала играть с детьми и делала это так ловко, будто ничего проще нет."
10035030-123 = "[ns3] «Фубуки, ты потрясающая!»\n[ns4] «Ты правда отлично ладишь с детьми.»"
10035030-126 = "Да это вообще основы."
10035030-127 = "Дети любят соревнования, И это ещё их выматывает. Намного проще, чем пытаться силой ими командовать."
10035030-128 = "Этому трюку я научилась на патрулях, когда приходилось иметь дело с нарушителями."
10035030-129 = "Ах, понятно..."
10035030-130 = "Хороший урок."
10035030-131 = "Теперь нам осталось просто опустить ноги в воду и смотреть за детьми."
10035030-132 = "Думаю, с этим мы все справимся, да?"
10035030-134 = "Определённо! Я справлюсь!"
10035030-135 = "Раньше я ошиблась, но больше такого не повторится!"
10035030-136 = "А я буду наблюдать с другой стороны."
10035030-137 = "[s] «Я пойду туда вместе с Канной.»"
10035030-138 = "Хорошо. Будем наблюдать парами, с обеих сторон."
10035030-139 = "Технически вы не спасатель, Сенсей, но раз мы все здесь, думаю, ничего страшного."
10035030-142 = "Фух. Кто бы мог подумать, что работе спасателя ещё и учиться надо?"
10035030-143 = "[s] «Скоро освоишься.»"
10035030-144 = "Надеюсь... но если честно, я чувствую себя здесь не в своей тарелке."
10035030-145 = "Даже если не считать моих ошибок, у меня явно нет такого природного таланта, как у Фубуки."
10035030-146 = "[s] «Ещё слишком рано унывать.»"
10035030-148 = "[ns] «Служение, чуткость, искренность и улыбка, верно?»"
10035030-149 = ""
10035030-150 = "Хи-хи, верно."
10035030-151 = "Хорошо. Я постараюсь ещё усерднее."
10035030-152 = ""
10035030-155 = "*ахает*"
10035030-156 = "*пф* *кашляет*"
10035030-157 = "П-Помогите!"
10035030-158 = "*кашляет* *кашляет*"
10035030-159 = "Ребёнок упал в воду...!"
10035030-160 = "Подождите здесь, Сенсей!"
10035030-161 = ""
10035030-163 = ""
10035030-165 = "*ахает* *тяжело дышит*"
10035030-166 = "Вы в порядке?"
10035030-167 = "*кашляет* *кашляет*"
10035030-168 = "Т-Там в воде аллигатор! Огромный аллигатор..!"
10035030-169 = "Тебе наверняка показалось от паники. Успокой дыхание."
10035030-170 = "Нет, теперь я боюсь воды!"
10035030-171 = "Я не хочу обратно!"
10035030-172 = "Всё хорошо. Я буду следить, чтобы ты снова не поскользнулся."
10035030-173 = "[s] «Канна, улыбнись. Улыбнись!»"
10035030-174 = "...Да!"
10035030-175 = ""
10035030-177 = ""
10035030-178 = "Теперь всё хорошо."
10035030-179 = "..."
10035030-180 = "УААААА!"
10035030-181 = ""
10035030-188 = "Хм?"
10035030-189 = "[ns] «(Её улыбка только что напугала ребёнка так, что он снова полез в воду?)»"
10035030-190 = "Мне страшно! Я-Я хочу отсюда! Уа-а-а—!"
10035030-191 = ""
10035030-193 = ""
10035030-194 = "...Сенсей?"
10035030-195 = "Ты правда думаешь, что я смогу это делать?"
10035030-196 = "Я потеряла уверенность в себе..."
