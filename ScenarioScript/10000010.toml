[translation]
10000010-1 = "Эпизод 1;Добро пожаловать в Момоёдо"
10000010-2 = "Момоёдо? Знаменитая чайная?"
10000010-3 = "Клубничный анмицу в Момоёдо — лучший!"
10000010-4 = "Говорите о Момоёдо? Ну, а МОЁ любимое там — это..."
10000010-5 = ""
10000010-6 = "прекрасная улыбка Шизуко!"
10000010-8 = "Найти дорогу до Момоёдо оказалось довольно просто."
10000010-11 = ""
10000010-12 = "Заходите, босс! Добро пожаловать!"
10000010-13 = "Мне сказали, что вы из семьи Шале. Я Пина.#nДавайте пожмём руки!"
10000010-14 = "[s1] «Из какой ещё...?»\n[s2] «Куда?»"
10000010-15 = "Стой, стой, стой! Пина...! Не отпугивай Сенсея!"
10000010-16 = "Стой, стой, стой! Пина...! Не отпугивай Сенсея!"
10000010-17 = "А? Но, президент..."
10000010-18 = "Вы же сказали тепло встречать Сенсея всякий раз, когда я его увижу!"
10000010-19 = "Я имела в виду НЕ это. Я говорила о хорошем первом впечатлении."
10000010-20 = "В конце концов, первое впечатление можно произвести только один раз."
10000010-21 = "План был в нашу первую встречу выглядеть как можно милее,#nчтобы сразу поднять очки симпатии Сенсея ДО НЕБЕС."
10000010-22 = "[s] «Так, эм...»"
10000010-23 = "Т-точно! Я забыла, что ты уже здесь, Сенсей!"
10000010-24 = "Я хотела сказать..."
10000010-25 = "Х-хи-хи-хи...?"
10000010-26 = "П-перейдём дальше... Кхм!"
10000010-27 = ""
10000010-28 = ""
10000010-29 = "Очень приятно, Сенсей!"
10000010-30 = "Добро пожаловать в Момоёдо! Ня!"
10000010-31 = "[s] «Ня»...?"
10000010-32 = "Позволь показать тебе всё вокруг!"
10000010-33 = "Пина! У нас клиент!"
10000010-34 = "Поняла. Ваше желание — закон, босс!"
10000010-35 = "Я же просила не так!"
10000010-37 = "В любом случае, здорово, что ты пришёл, Сенсей!"
10000010-38 = "[s] «Ага, это я. Сенсей. Тот самый из Шале.»"
10000010-39 = "Наверное, мне тоже стоит официально представиться, да?"
10000010-40 = "Я Кавава Шизуко."
10000010-41 = "А ещё я президент отдела организации фестивалей Объединённой академии Хяккияко и хозяйка этой традиционной чайной — Момоёдо!"
10000010-42 = "А значит, я ещё и лицо Момоёдо — собственный идол этой чайной!"
10000010-43 = "Я тоже здесь работаю! Считайте меня силовой поддержкой!"
10000010-44 = "Я Пина, и я иду путём справедливости и рыцарской чести!"
10000010-45 = "[s] «Очень приятно познакомиться с вами обеими.»"
10000010-46 = "Так это твой первый визит в Объединённую академию Хяккияко?"
10000010-47 = "В любом случае, мне стоит рассказать основные сведения об отделе организации фестивалей."
10000010-48 = ""
10000010-50 = "Для начала: что ТАКОЕ Объединённая академия Хяккияко?"
10000010-52 = "Хяккияко — академия, которая с самого основания делает упор на туризм."
10000010-54 = "Фестивали, горячие источники, музыка, развлечения..."
10000010-55 = "И, конечно же, вкусная еда!"
10000010-57 = "Это место, где самые разные культуры и студенты гармонично сосуществуют!"
10000010-59 = "Отдел организации фестивалей отвечает, ну... за фестивали.#nФестивали — главная достопримечательность туристической отрасли Хяккияко."
10000010-60 = "Наш клуб занимается планированием, проведением и общим управлением!#nВерно ведь?"
10000010-61 = "Верно! А Момоёдо — крутое убежище нашего клуба!"
10000010-62 = "Мы день и ночь готовились к Фестивалю цветения сакуры Хяккияко!"
10000010-63 = "Впечатляет? Узри силу отдела организации фестивалей!"
10000010-64 = "[s] «На улицах и правда было очень оживлённо.»"
10000010-65 = "Фух. Радует, что после всех наших усилий Фестиваль цветения сакуры проходит успешно, но всё же..."
10000010-66 = "*вздыхает* В последнее время у нас появились нарушители порядка."
10000010-67 = "Сегодня они снова устроили сцену."
10000010-68 = "[s] «Так вот почему ты связалась со мной.»"
10000010-69 = "Именно. Прости, но мы пригласили тебя не только полюбоваться цветущей сакурой..."
10000010-71 = ""
10000010-72 = "Президент! Они снова что-то затеяли!"
10000010-73 = "Аргх! Опять они! Это что, черти какие-то?! Стоило мне только О НИХ УПОМЯНУТЬ!"
10000010-74 = "Эм, я имею в виду..."
10000010-75 = "Что же ЭТО может быть...? Х-хи-хи-хи."
10000010-76 = "Прости. Надо держать образ. В-в любом случае, всё подробно расскажу по дороге!"
10000010-79 = "Ха-ха-ха! Мы Моурё — духи, обитающие на улицах Хяккияко!"
10000010-80 = "Так что можешь звать нас... Уличными Моурё! Понял?"
10000010-81 = "Вперёд! Клиент хочет, чтобы мы устроили переполох, так что за дело!"
10000010-83 = "[ns3] «Это тоже часть фестиваля?»\n[ns4] «Не знал, что фестивали стали настолько экстремальными.»"
10000010-84 = "Н-не говори глупостей! На каком фестивале устраивают зажигательные взрывы?!"
10000010-85 = "Н-не говори глупостей! На каком фестивале устраивают зажигательные взрывы?!"
10000010-86 = "Они просто саботажники, пришедшие испортить фестиваль!"
10000010-87 = "Саботировать такой фестиваль — это уже ниже некуда!"
10000010-89 = "А отдел организации фестивалей бессилен нас остановить!"
10000010-90 = ""
10000010-92 = "Все! В атаку!"
