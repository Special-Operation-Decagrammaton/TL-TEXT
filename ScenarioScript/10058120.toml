[translation]
10058120-1 = "Episode 12;When I Get There, I'll Write a Letter"
10058120-4 = "We're here!"
10058120-5 = "Good work! Winning in your first-ever race is amazing!"
10058120-6 = "So cool!! You really, really tried your best!"
10058120-7 = "We will now begin the Gehenna Cup Victory Celebration."
10058120-8 = "First, an awards ceremony by President Cherino."
10058120-9 = "Class 183, winners of the Gehenna Cup. Step forward."
10058120-13 = "Class 183 Special Class HR Representative, Niki Anna."
10058120-16 = "Class 183 Special Class Vice HR Representative, Niki Elina."
10058120-19 = "And Class 183 Special Class Sub-Vice HR Representative, Furuhata Rana."
10058120-20 = "You brought back the Gehenna Cup trophy, the long-cherished dream of myself as General Secretary.#nLet us praise this greatly."
10058120-21 = "The courage to stand face-to-face against a gigantic Gehenna tank."
10058120-22 = "And the Red Winter spirit of never giving up until the very end."
10058120-23 = "Everyone was deeply moved by your heroic efforts."
10058120-24 = "By the authority of the Red Winter Office, #nClass 183 Special Class is hereby awarded the \"Medal of Diligent Mustaches\"!"
10058120-28 = "Th-Thank you very much...!"
10058120-29 = "We did it...! This isn't a dream, right...?"
10058120-30 = "The Office, and myself... believe that everyone in Red Winter should be rewarded in accordance with their achievements."
10058120-31 = "With that said, who was the mastermind?"
10058120-32 = "Eh, um... that is."
10058120-33 = "It was the Vice HR Representative! #nIf Elina hadn't encouraged us, we wouldn't even have participated!"
10058120-34 = "What?! Why are you suddenly being so modest?!"
10058120-35 = "I-I only made the suggestion! Anna the HR Representative worked the hardest!"
10058120-36 = "And Rana, and Sensei too... everyone pooled their efforts!"
10058120-37 = "Peace."
10058120-40 = "I see. Niki Anna the HR Representative took charge, and you all followed her lead."
10058120-41 = "In other words—"
10058120-42 = "Under Niki Anna's orders, you raided the Office and chipped my statue..."
10058120-43 = "And on top of stealing window glass, you shelled the plaza?"
10058120-44 = "Ah, ehehe... It was nothing much, President."
10058120-47 = "What?!"
10058120-48 = "Did you think the Office wouldn't find out?! You rebellious elements!!"
10058120-49 = "Th-That is!! I mean!!"
10058120-52 = "An award is an award, and punishment is punishment!"
10058120-53 = "All of Class 183, back to the Special Class for an indefinite stay!!!!"
10058120-55 = "Noooooooo!!!"
10058120-57 = "...And so, we returned to the Class 183 Special Class."
10058120-59 = "Everyone is doing well. #nCompared to before Sensei arrived, I feel like things have definitely changed."
10058120-60 = "Anna has become even more of a show-off, and Elina has gotten better at teasing."
10058120-61 = "\"The tank race lacked impact! Let's hit 'em with something even bigger next time!\" the two of them say, but..."
10058120-64 = "They've been doing RWWE ever since the research topic selection phase, #nso it's taking them a little while to choose."
10058120-65 = "Everyone wants to see Sensei... #nso we'd be happy if you came to visit again once our research topic is decided."
10058120-66 = "P.S. As promised, the statue and window glass have been put back."
10058120-69 = "With my two best friends. From Furuhata Rana."
10058120-71 = "[ns] \"...Is that so.\""
10058120-74 = "[ns1] \"By the way, the fact that you brought this directly...\"\n[ns2] \"Does that mean you've already decided on a research topic?\""
10058120-77 = "That's not it. When I went to mail the letter, we ran out of stamps."
10058120-78 = "This is my second time here, but it's still quite a trip."
10058120-84 = "*Zzz*... *zzza...*"
10058120-99 = "Start Your Engines! ~Class 183 Forever!~"
