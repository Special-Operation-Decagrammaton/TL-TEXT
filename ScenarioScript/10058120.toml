[translation]
10058120-1 = "Episode 12;A Letter Once I'm There"
10058120-4 = "They're here!"
10058120-5 = "Good job, you three! It's amazing that you won on your first try!"
10058120-6 = "So cool! You all really, absolutely, positively gave it your best out there!"
10058120-7 = "We will now commence the Gehenna Cup championship celebration!"
10058120-8 = "First, a commendation from President Cherino."
10058120-9 = "Would the victors of the Gehenna Cup—No. 183—step forward."
10058120-13 = "Class president of Spec Ops No. 183, Niki Anna."
10058120-16 = "Vice president of Spec Ops No. 183, Niki Erina."
10058120-19 = "And finally, sub-vice president of Spec Ops No. 183, Furuhata Rana."
10058120-20 = "It has been a long dream of mine, as the Great Leader, to bring home the#nchampionship cup. You have accomplished a feat worthy of commendation."
10058120-21 = "You have shown the courage to stand head-on against Gehenna's colossal tank—"
10058120-22 = "And have demonstrated the unyielding spirit of Red Winter."
10058120-23 = "Your performance has deeply inspired everyone."
10058120-24 = "By the authority of the Red Winter Office, #nI bestow upon Spec Ops No. 183 the Labor Mustache Medal!"
10058120-28 = "Th-thank you very much...!"
10058120-29 = "We did it...! This isn't a dream, right...!?"
10058120-30 = "The Office and myself believe... That everyone at Red Winter #nought to be rewarded in correspondence to their deeds."
10058120-31 = "As such, I would like to know who it was that inspired your participation."
10058120-32 = "Um, well it was..."
10058120-33 = "The vice president! #nIt was only because Erina encourged me, that any of us ended up participating!"
10058120-34 = "Eeehh!? Why're you suddenly being all humble!?"
10058120-35 = "All I did was suggest the idea! It was class president Anna who put in the most#nwork!"
10058120-36 = "There was Rana and Sensei too... This whole thing only came together because of everyone's help!"
10058120-37 = "Peace."
10058120-40 = "I see. So class president Niki Anna took leadership, and the rest of you followed#nafter her."
10058120-41 = "In other words..."
10058120-42 = "It was under the command of Niki Anna that you raided the Office and chipped#naway at MY statue..."
10058120-43 = "Not to mention the theft of my window and firing upon the plaza."
10058120-44 = "E-Ehehe... It wasn't that big of a deal, President."
10058120-47 = "Huh!?"
10058120-48 = "Did you think the Office wouldn't find out, you dissidents!?"
10058120-49 = "W-Well, you know! Does that mean!?"
10058120-52 = "A reward is a reward, and a punishment is a punishment!"
10058120-53 = "No. 183, you will hereby remain in your Spec Ops! INDEFINITELY!"
10058120-55 = "Nooooooooo!!"
10058120-57 = "...And that is why we have returned to Spec Ops No. 183."
10058120-59 = "Everyone is doing well. #nI feel that compared to the time before you came, things have definitely changed."
10058120-60 = "Anna has become even more of a show-off than before, and Erina has gotten even better at teasing people."
10058120-61 = "The two of them have been saying, \"We didn't leave enough of an impact with the Gehenna Cup! We need something BIGGER!\""
10058120-64 = "However... They are still stuck deciding the research topic through RWWE, so it#nmay take a while longer before they begin."
10058120-65 = "Everyone seems eager to meet you again, so... It'd make me happy if you could#ncome hang out with us again after we decide on the research topic."
10058120-66 = "P.S. Just as promised, we have returned the statue and window to their original#nplaces."
10058120-69 = "With her two friends, Furuhata Rana."
10058120-71 = "[ns] \"...So that's what's been happening.\""
10058120-74 = "[ns1] \"By the way, if you're here delivering this to me personally...\"\n[ns2] \"Does that mean they've finally decided on the research topic?\""
10058120-77 = "That's not it. I originally intended to send this letter, but I ran out of postage#nstamps."
10058120-78 = "And after coming here for the second time, I can confirm that the journey is,#nin fact, still arduous."
10058120-84 = "Zzz... Zzz..."
10058120-99 = "Start Your Engines!~Long Live 183!~"