[translation]
2006205-1 = "Fashion's Also Chemistry!"
2006205-2 = "Beluga Market"
2006205-3 = "（I arrived at Red Winter to aid Erina on her official business.）"
2006205-4 = "Ahhh... So this is what the atmosphere's like at the lower altitudes..."
2006205-5 = "Naturally, it's perfect for I—the genius Niki Erina."
2006205-6 = "[s] \"Of course! You look amazing here!!\""
2006205-7 = "Heheeh! Now you're just stating facts! Buuut, I'll never say no to praise!"
2006205-8 = "Today, I'm here to conduct market research on the artificial fiber-based products I've been#ndeveloping! The Office approved of this outing on the condition that I submit a written#nreport afterward!"
2006205-9 = "I wanted to hit up Znamya Cafe too, but... Seems like all the staff are on leave right#nnow."
2006205-10 = "It's a shame, but it is what it is! I've got a lot to do today anyway!"
2006205-11 = "[s] \"What kind of products are we talking about here?\""
2006205-12 = "Excellent question! I have three of my masterpieces to introduce to you today!"
2006205-13 = "The first is polyvinyl alcohol fiber! #nIt's made from coal and limestone, which are cheap and readily available to obtain. #nOn top of being cheap, the fiber's also great at absorbing water!"
2006205-14 = "The second is regenerated cellulose fiber. #nIt can be made by chemically treating scrap paper, sawdust, or old cotton. #nIt's resource efficient AND eco-friendly."
2006205-15 = "The final is insulating wool! #nBy using a chemical treatment, I've managed to boost the thermal insulation of#nordinary wool."
2006205-16 = "All three of these products were well received during interim assessments. #nIt would seem the day I finally escape 183 is drawing near!"
2006205-17 = "[s] \"These all sound incredible!\""
2006205-18 = "I know right? Truly, as long as I put my mind to it, I'm someone who can#naccomplish anything!"
2006205-19 = "I can't wait to see how happy everyone is with my products! No more dawdling#naround! Let's hit up the shop!"
2006205-20 = "The shop was also made specifically for these new products, which I think is#nsuuuper awesome!"
2006205-21 = "Now, bear witness to the magic of chemistry!"
2006205-23 = "Wooow! The interior design's on point! This thingy! Look at it! Look!!"
2006205-24 = "Umm... Uhh, what was it called again? That electrical apparatus that brightens up dark areas..."
2006205-25 = "Right, lighting! The lighting is GORGEOUS! #nOooh, and is that PVC tiling I see? PVC tiling's both waterproof and an excellent#ninsulator!"
2006205-26 = "The vibes here are IMMACULATE! There's plenty of stock, and there's not a single customer in sight..."
2006205-30 = "There's not a single customer in sight!?"
2006205-35 = "E-excusee mee. Why isn't there anyone here? Could it be that you're not open yet?"
2006205-36 = "The place is open. There simply aren't any customers."
2006205-37 = "Why!? The stuff's cute and cheap... and the selling floor even looks this amazing!"
2006205-38 = "Wh-what about something like... the polyvinyl fiber blouse! #nIs it not popular? It should be flying off the shelves with how cute it is!"
2006205-39 = "Ah, that? Our staff use it to wipe down the place. It wasn't selling particularly well, so we took it off the shelves."
2006205-40 = "You use it to WIPE STUFFFF!?"
2006205-41 = "Yes. It has poor ventilation and it's slippery, to the point where they can't even be be used as pajamas. #nI tried going to sleep in it once and I very nearly fell out of my bed. Not only that, but it drastically#nshrinks once you wash it."
2006205-42 = "It's only redeeming quality is how absorptive it is, so we use it as a cleaning rag."
2006205-43 = "..."
2006205-44 = "Th-then how about the coats and uniforms made of regenerated cellulose!"
2006205-45 = "They've got a beautiful gloss to them, they're afforable, and best of all, they're#neco-friendly... they HAVE to be popular, right!? Right!?"
2006205-46 = "The sale of that product has been prohibited by the Office."
2006205-47 = "HUHH!?"
2006205-48 = "Certainly, with how cute and affordable it was, you could say it was our best selling#nproduct. We even sold out of it at one point."
2006205-49 = "Then, why...?"
2006205-50 = "They rapidly deteriorate after a certain number of wash cycles. #nLast week, there was this one day that was particularly windy, and ton of people's clothes disintegrated."
2006205-51 = "Dozens of people were locked up for public indecency that day. #nHowever, members of the Office also had their clothes vanish, so they let everyone#noff."
2006205-52 = "Some children ended up thinking it wasn't the Sun who who won, but rather the North Wind. #nBecause of that, the curriculum for the elementry division saw a complete revamping, which#ncaused a massive commotion."
2006205-53 = "Ahh... So that's what happens when you make things out of biodegradable#nmaterials..."
2006205-54 = "Th-there's still one left... One last hope!"
2006205-55 = "What about the winter pants made out of insulating wool? #nWith how cold it's been recently, surely it's popular, right?"
2006205-56 = "Ah, the \"fire ant pants?\" We aren't selling those anymore."
2006205-57 = "When they were worn, they caused skin irritations and heightened body temperatures. #nPeople would wear them in the morning without knowing this and go insane by the time they got back home at night. #nBecause of that, there were rumors that these pants were made by fire ants."
2006205-58 = "Znamya Cafe over there adopted those pants as part of their new uniforms. #nHowever, it caused all of the staff to nearly break down from stress, which is#nwhy they're still closed."
2006205-59 = "A-ah..."
2006205-60 = "They are good for polishing things though, so you should still be able to find them at the nearby hardware store."
2006205-61 = "By the way, you've only been asking about our discontinued products. May I ask#nwhat the problem is?"
2006205-62 = "..."
2006205-63 = "[s1] \"L-let's leave for now.\"\n[s2] （I took Erina with me and left the store.）"
2006205-69 = "..."
2006205-70 = "[s3] \"Don't feel too down about it...\"\n[s4] \"These things just happen sometimes, so cheer up!\""
2006205-73 = "Mnnghh..."
2006205-74 = "LET'S GO! That was a HUUUGE success!"
2006205-75 = "I ended up creating something that FAR surpassed any and all expectations I had!"
2006205-76 = "[s] \"You aren't upset!?\""
2006205-77 = "Huh? Why would I be upset about this?"
2006205-78 = "Ah, well I guess they ended up being horrible for clothes. #nOne's itchy, one disintegrates... and one is slippery. What a shame!"
2006205-79 = "However, I've also learned a lot about them! #nLike, one's great for polishing things down... #nAnother has an incredible biodegradation rate, and the last is slippery but very absorptive."
2006205-80 = "What I'm saying is, they aren't useless inventions! #nThey're bound to be useful in some application!"
2006205-81 = "There've been plenty of other examples recently of inventions that ended up being used for#npurposes other than their original intent! For example, sticky notes were born out of a failed#nadhesive, and the side effects of certain drugs could be repurposed for different symptoms!"
2006205-82 = "The most important thing, is that I accomplished SOMETHING! Peace siign!"
2006205-83 = "[s5] \"What a great attitude to have!\"\n[s6] \"But what're you going to do about the report?\""
2006205-86 = "Well, about that... that's actually the easiest part!"
2006205-90 = "I just gotta rewrite the project proposal and the parts about intended uses, then#nit'll be all good!"
2006205-91 = "I had a feeling something like this would happen, so I wrote it all using pencil.#nThat means that all I have to do is redo my stamp... And that's everything taken#ncare of!"
2006205-92 = "And that's everything taken care of!"
2006205-93 = "[s] \"I-is that so...?\""
2006205-95 = "（Erina cheerfully pushed the report into the Office's postbox.）"
2006205-96 = "（It was a relief to see that Erina seemed to be happy about it all.）"