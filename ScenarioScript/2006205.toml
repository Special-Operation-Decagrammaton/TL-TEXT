[translation]
2006205-1 = "Even fashion is chemistry!"
2006205-2 = "White Dolphin Market"
2006205-3 = "(Visited Red Winter to help Erina with her business trip)"
2006205-4 = "Ah... so this is what the air at low altitudes feels like..."
2006205-5 = "It is truly a perfect fit for a genius like me, Niki Erina!"
2006205-6 = "[s] \"Hey! Looking sharp!\""
2006205-7 = "Heh-heh! Well, that is just a given! Praise never gets old, no matter how many times you hear it!"
2006205-8 = "Today, I will be conducting market research on the synthetic fiber products I have been researching! #nI even got permission from the Office on the condition that I submit a report!"
2006205-9 = "I wanted to visit the Znamya Cafe too, but... it seems all the employees are out sick."
2006205-10 = "It is unfortunate, but it cannot be helped! I have a lot to do today anyway!"
2006205-11 = "[s] \"What kind of products are they?\""
2006205-12 = "Good question! Today I am introducing three of my masterpieces!"
2006205-13 = "The first is polyvinyl alcohol fiber! #nIt is cheap and widely available, and can be made from coal and limestone. #nPlus, it has great water absorption!"
2006205-14 = "The second is regenerated cellulose fiber. #nThis is made by chemically treating waste paper, sawdust, and old cotton. #nIt helps save resources and is eco-friendly, too."
2006205-15 = "Lastly, heat-retaining wool fiber! #nRegular wool is given a chemical treatment to enhance its heat retention."
2006205-16 = "All three received favorable interim evaluations. #nEscaping District 183 might not be so far off after all!"
2006205-17 = "[s] \"They all sound amazing!\""
2006205-18 = "Right? When I put my mind to it, I get results!"
2006205-19 = "I cannot wait to see everyone happy faces! Let us head to the shop right away!"
2006205-20 = "I made this shop specifically for these new products, so I think it looks super cool!"
2006205-21 = "Behold the magic of chemistry!"
2006205-23 = "Wow! Such a lovely interior! This is it, this is the stuff!!"
2006205-24 = "Um... uh, what was it called again? That electrical device that brightens up dark places--"
2006205-25 = "Ah right, lighting! How dazzling! #nOh, and are those PVC tiles on the floor? Waterproof and high thermal insulation, too!"
2006205-26 = "The atmosphere is top-notch! There is plenty of stock, and there are no customers at all..."
2006205-30 = "There are no customers at all?!"
2006205-35 = "U, um? Why is there nobody here? Could it be that you are not open yet?"
2006205-36 = "We are open. There are just no customers."
2006205-37 = "Why?! They are cute, cheap... and the sales floor is so wonderful!"
2006205-38 = "I, isn't something like this popular? #n A blouse made from polyvinyl alcohol fiber! It is super cute and seems like it would sell well!"
2006205-39 = "Ah, that. We use it for wiping down the store. It was not selling at all, so we took everything down."
2006205-40 = "For wiping the store?!"
2006205-41 = "Yes. It has poor breathability and is too slippery to use as pajamas. #nI tried sleeping in it once and almost fell right out of bed. #nPlus, it shrinks like crazy when you wash it."
2006205-42 = "The only good thing about it is its water absorption, so we use it as a rag."
2006205-43 = "..."
2006205-44 = "Th, then what about this? A coat and uniform made from regenerated cellulose!"
2006205-45 = "It is glossy and pretty, reasonably priced... it must be popular, right?! Above all, it is eco-friendly!"
2006205-46 = "That product has a sales ban issued by the Office."
2006205-47 = "What?!"
2006205-48 = "It certainly sold the best since it was cheap and cute. #nIt even sold out completely at one point."
2006205-49 = "Then why..."
2006205-50 = "It deteriorates rapidly after just a few washes. #nOn the windy day last week, everyone clothes were tearing apart."
2006205-51 = "Dozen of people were arrested for public indecency, #nthough they were all released because the Office staff ran out of clothes too."
2006205-52 = "The children seemed to think that 'the north wind took off the clothes instead of the sun,' #nso they had to redo the elementary school education. It is quite a mess."
2006205-53 = "Ah... so this is what happens when you make things out of biodegradable materials..."
2006205-54 = "Th, there is still one... final hope remaining!"
2006205-55 = "What about the cold-weather pants made from heat-retaining wool fiber?"
2006205-56 = "Ah, those Fire Ant Pants? We do not sell those anymore."
2006205-57 = "Wearing them makes your skin tingle and raises your body temperature. #nPeople put them on in the morning without realizing it, and come back home raving mad at night. #nRumor has it they must have been made from fire ants."
2006205-58 = "The Znamya Cafe adopted them for their new uniform, #nso everyone seems worn out from the stress, and they are still closed."
2006205-59 = "Ah, aaah..."
2006205-60 = "It seems they can be used for polishing, so you will probably find them sold at the hardware store over there."
2006205-61 = "Still, you are only looking for discontinued products. Did something happen?"
2006205-62 = "..."
2006205-63 = "[s1] \"L-Let's just head outside.\"\n[s2] (Took Erina outside)"
2006205-69 = "..."
2006205-70 = "[s3] \"Don't be too down...\"\n[s4] \"These things happen, cheer up!\""
2006205-73 = "Ugh..."
2006205-74 = "All right! Huge success!"
2006205-75 = "I invented something even more amazing than originally expected!"
2006205-76 = "[s] \"You weren't depressed?!\""
2006205-77 = "Eh? Was there something to be depressed about?"
2006205-78 = "Ah, sure, it was a failure as clothing. #nTingling skin, biodegrading... slipping right off. That is unfortunate!"
2006205-79 = "But I learned a lot too! #nLike its usefulness as a polish... #nthe speed of biodegradation, and how it is slippery yet has great water absorption."
2006205-80 = "In other words, it was not a meaningless invention! #nIt will be useful somewhere in this world!"
2006205-81 = "There are other inventions that achieved results different from their original intent! #nUsing failed adhesives for memo pads, or finding other uses for drug side effects!"
2006205-82 = "The important thing is that I 'accomplished something'! Yay!"
2006205-83 = "[s5] \"That's a great attitude!\"\n[s6] \"But what should we do about the report?\""
2006205-86 = "As for that... actually, it is the easiest part!"
2006205-90 = "We just need to rewrite the proposal and the 'intended specifications'!"
2006205-91 = "I wrote it in pencil expecting this to happen, so if I just rewrite it and leave the stamp--"
2006205-92 = "And everything is all okay!"
2006205-93 = "[s] \"I-Is that so...?\""
2006205-95 = "(Erina cheerfully shoved her report into the Office mailbox)"
2006205-96 = "(Seeing Erina looking so pleased, I breathed a sigh of relief)"
