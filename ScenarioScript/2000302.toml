[translation]
2000302-1 = "Чёрная форма"
2000302-2 = "Класс Тринити"
2000302-3 = ""
2000302-4 = ""
2000302-5 = ""
2000302-6 = "О, Сенсей. Рада снова вас видеть."
2000302-7 = "О, моя юбка? Я одолжила у Хасуми швейный набор, чтобы зашить её."
2000302-8 = "Шов может снова разойтись, если я буду слишком много двигаться... Придётся обойтись этим, пока не придёт новая."
2000302-9 = "Я бы одолжила другую, но форма Хасуми мне ни за что не подойдёт по размеру, а одежда Цуруги всегда покрыта кровью её врагов."
2000302-10 = "Получить новую форму Оперативной группы правосудия бывает настоящей головной болью даже в Тринити."
2000302-11 = "Вам интересно, почему наша форма чёрная, тогда как обычные студенты носят белую?"
2000302-12 = "Чтобы кровь неправедных врагов, которую мы проливаем — например, учеников Геенны, — не была заметна на форме. Ещё раз внимательно посмотрите на форму Цуруги."
2000302-13 = "Пока на мне эта форма, я могу без тревог истреблять врагов."
2000302-14 = "[s] Нервно сглотнуть и испуганно посмотреть."
2000302-15 = "Это... должна была быть шутка. Я переборщила?"
2000302-16 = "[s] «Я подумал, что ты серьёзно, и немного испугался.»"
2000302-17 = "Я прекрасно понимаю, что чувством юмора меня не одарили. Люди почему-то приходят в ужас всякий раз, когда я шучу."
2000302-18 = "Интересно, почему."
2000302-19 = "[s] «Может, дело в том, насколько серьёзно ты при этом выглядишь?»"
2000302-20 = "Возможно. Хех..."
2000302-21 = "Следует уточнить: мы носим чёрную форму не из-за страха перед пятнами крови."
2000302-22 = "В нашем клубе придают большое значение гигиене. Если во время задания на форму попадает кровь, мы должны как можно скорее её отстирать."
2000302-23 = "[s] «Ха-ха. Хорошая шутка, Маширо.»"
2000302-24 = "Нет, я говорила серьёзно..."
2000302-25 = "В конце концов, за достижение справедливости приходится платить. Ха-ха..."
2000302-26 = "[s] Нервно сглотнуть и испугаться ещё сильнее."
2000302-27 = "Хм. Когда я шучу, вы воспринимаете всё всерьёз, а когда говорю серьёзно — думаете, что я шучу."
2000302-28 = "Похоже, чувства юмора у меня действительно нет, да?"
2000302-30 = "После этого я ещё некоторое время разговаривал с Маширо о том, что её беспокоило."
