[translation]
10003030-1 = "Эпизод 3;Всё ради идеального отпуска"
10003030-2 = "Штаб летнего лагеря"
10003030-3 = "Нам удалось взять ситуацию на пляже под контроль, и мы собрались с остальными в штабе."
10003030-4 = "Хорошая новость: драку мы остановили."
10003030-5 = "Плохая новость: это были лишь их разведывательные отряды."
10003030-6 = "[s] «Ты серьёзно?»"
10003030-7 = "Да. Обе стороны по сути просто прощупывали друг друга перед настоящей битвой."
10003030-8 = "Полагаю, им также поручили расставить ловушки, чтобы получить преимущество позже."
10003030-9 = "Обе стороны, видимо, подумали об одном и том же и столкнулись."
10003030-10 = "Тогда это значит..."
10003030-11 = "Чёрт тебя дери, Ако! Всё должно было быть не так! Ты сказала, что здесь тихо!"
10003030-12 = "Какой смысл жаловаться человеку, которого здесь нет? Тем не менее этот пляж всё ещё находится в районе Геенны. Мы не можем позволить обеим сторонам творить что угодно."
10003030-13 = "Хотя ситуация начинает выходить из-под контроля. Возможно, стоит сообщить главному префекту."
10003030-14 = "[s] «Но если вы это сделаете, отпуск Хины...»"
10003030-15 = "Возможно, выбора нет, Сенсей. Мы едва справились с первой стычкой."
10003030-16 = "Остальные члены Дисциплинарного комитета приехали сюда не отдыхать."
10003030-17 = "[s] «Говорит девушка, которая взяла с собой купальник!»"
10003030-18 = "А это тут при чём?!"
10003030-19 = "На этом этапе у нас нет другого выбора. Нужно доложить Хи—"
10003030-20 = ""
10003030-23 = "Стой, Чинацу!"
10003030-24 = "Ако?!"
10003030-25 = "Старший администратор?"
10003030-26 = "Эти беспомощные идиоты из Общества Пандемониума! Им обязательно было докопаться до меня в самый неподходящий момент..."
10003030-27 = "Но я НЕ сдамся. Мы столько старались, чтобы устроить президентке отпуск на пляже. И позволим каким-то нарушителям всё испортить? Ни за что!"
10003030-28 = "Разведывательный комитет только что закончил сбор данных об этих хулиганах и гангстерах. Я отправлю информацию вам."
10003030-29 = "Даже по вашим меркам это было быстро..."
10003030-30 = "Одна группа называется «Пляжные хулиганы Фубар» и появилась в этих местах совсем недавно."
10003030-31 = "Судя по собранным данным, они проиграли борьбу за влияние на другом пляже и были вытеснены в район Геенны."
10003030-32 = "Другая — отколовшаяся часть Банды Кивотоса в шлемах. Они называют себя Бандой в шлемах «Сплэши» и уже некоторое время создают проблемы в этом районе."
10003030-33 = "У нас также есть данные о численности, вооружении и примерной структуре командования обеих групп."
10003030-34 = "Изучив всё, что мы собрали, я приняла решение."
10003030-35 = "[s] «И какое же?»"
10003030-36 = "Наших текущих сил должно быть более чем достаточно. Докладывать главному префекту ничего не нужно!"
10003030-37 = "Вы всё ещё хотите, чтобы мы разобрались сами?"
10003030-38 = "(*вздох* Она действительно будет гнуть своё при любых обстоятельствах.)"
10003030-39 = "Официальное расписание Хины начинается чуть меньше чем через четыре часа с беговой тренировки."
10003030-40 = "Значит, нам всего лишь нужно победить и хулиганов, и гангстеров до того, как они начнут войну друг с другом. Тогда президент ничего не узнает!"
10003030-41 = "Вы хотите, чтобы мы ликвидировали две противоборствующие силы за такой короткий срок?"
10003030-42 = "Именно!"
10003030-43 = "Может, мы и справимся, но реально ли сделать это только нашими силами?"
10003030-44 = "Никаких «может»! Мы ОБЯЗАНЫ добиться успеха! Иначе весь Кивотос будет уничтожен!"
10003030-45 = "Не слишком ли это? Только потому, что Хина не получит отпуск...? Ладно, сделаем что сможем."
10003030-46 = "Иори, ты займёшься хулиганами Фубар на пляже. Чинацу, ты устроишь засаду у убежища Банды в шлемах «Сплэши»."
10003030-47 = "С членами Дисциплинарного комитета, размещёнными в отеле, вы должны справиться."
10003030-48 = "Сенсей, а вы снова останетесь с Хиной."
10003030-49 = "[s] «Понял.»"
10003030-50 = "Помните, наша цель не изменилась. Главный приоритет — обеспечить президентке спокойный летний отпуск!"
10003030-51 = "Поэтому она не должна узнать ничего о происходящем за пределами отеля, иначе ей придётся вмешаться самой."
10003030-53 = "Начинаем, все! Ради отпуска Хины!"
10003030-54 = "Ладно."
10003030-55 = "*вздыхает*"
10003030-56 = "[ns] «Будьте осторожны там, вы двое.»"
10003030-60 = "[ns] «Я верну-у-улся.»"
10003030-61 = "Вот вы где, Сенсей. Вам всё ещё больно? Вы так быстро ушли."
10003030-62 = "[s] «Больно? А-А, точно. Моя отмазка.»"
10003030-63 = "Отмазка? Не понимаю, о чём вы, но шум снаружи становится громче. Тренировка усилилась?"
10003030-64 = "[s] «Эм, ага! Наверное.»"
10003030-65 = "Наверное, за это нужно благодарить Ако. По крайней мере, я спокойна, зная, что она всё контролирует."
10003030-66 = "А мне остаётся только сидеть здесь и смотреть в окно."
10003030-67 = "Мы наконец приехали на пляж, но к этому виду не так-то просто привыкнуть."
10003030-68 = "Наверное, потому что я была на пляже всего несколько раз?"
10003030-69 = "[s] «Потому что у тебя обычно просто нет времени ходить на пляж, да?»"
10003030-70 = "Да, ты прав. Работа обычно занимает всё время, поэтому у меня почти не бывает возможности приезжать на такие курорты."
10003030-71 = "Я бывала здесь несколько раз на разведке и по другим делам, но это было скорее работой."
10003030-72 = "У меня никогда не было возможности приехать на пляж просто ради отдыха."
10003030-73 = "На самом деле, возможно, это первый раз, когда я вижу пляж и мне не нужно ни о чём другом беспокоиться."
10003030-74 = ""
10003030-75 = ""
10003030-76 = "Сенсей, эм..."
10003030-77 = "[s] «Что?»"
10003030-78 = "Ты любишь пляж?"
10003030-79 = "[s1] «Да, люблю.»\n[s2] «Не сказал бы, что я его фанат.»\n[s3] «Хм. Мне в общем-то всё равно.»"
10003030-80 = "Значит, вы любите пляж, Сенсей."
10003030-81 = "Интересно."
10003030-82 = "Правда? Тогда в этом мы не так уж отличаемся."
10003030-83 = "(Но было бы расточительством приехать сюда и всё время сидеть внутри.)"
10003030-84 = "Вот как?"
10003030-85 = "Тогда, возможно, нам обоим просто не хватает опыта с пляжами."
10003030-86 = "Не думаю, что мы что-то поймём, просто глядя из окна."
10003030-87 = "А мне этого не хочется — особенно когда сама возможность приехать сюда такая редкая."
10003030-88 = "Я знаю, Ако велела мне просто ждать здесь, однако..."
10003030-89 = ""
10003030-90 = ""
10003030-92 = ""
10003030-93 = "...не хочешь сходить со мной на пляж?"
10003030-94 = "[s] «Ты хочешь пойти на пляж вместе?»"
10003030-95 = "Помните, наша цель не изменилась. Главный приоритет — обеспечить президентке спокойный летний отпуск!"
10003030-96 = "Поэтому она не должна узнать ничего о происходящем за пределами отеля, иначе ей придётся вмешаться самой."
10003030-98 = "[ns4] «(Главный приоритет — чтобы Хина хорошо провела время, но...)»\n[ns5] «(А чтобы Хина хорошо провела время, ей придётся выйти из комнаты...)»"
10003030-99 = "Сенсей?"
10003030-100 = "Сенсей?"
10003030-101 = "[s] «Дай мне всего минутку.»"
10003030-102 = "Конечно..."
10003030-103 = ""
10003030-104 = ""
10003030-106 = "Сенсей? Что такое? У меня и так руки заняты этими хулиганами."
10003030-107 = "Что? Хина хочет пойти на пляж?"
10003030-108 = "Л-Ладно! Я что-нибудь придумаю!"
10003030-109 = ""
10003030-111 = "[ns] «Идё-о-ом на пляж!»"
10003030-112 = ""
10003030-113 = "О."
10003030-118 = "Так вот какой он, пляж."
10003030-119 = "Песок под ногами ощущается немного странно."
10003030-120 = "И я вижу свои следы..."
10003030-121 = ""
10003030-123 = "...как волны их смывают."
10003030-124 = "Как... интересно."
10003030-125 = "[s6] (Хина улыбается...)\n[s7] (Хорошо, что мы это сделали.)"
10003030-126 = "Странно. Я редко бываю на пляже."
10003030-127 = "Странно. Я редко бываю на пляже."
10003030-128 = "Но в этот раз я могу прогуляться вместе с тобой."
10003030-129 = "Эй, Сенсей..."
10003030-130 = ""
10003030-132 = "А?"
10003030-133 = "[s] «П-Прости! Одну секунду!»"
10003030-134 = ""
10003030-137 = "Это Ако. Всем ответить!"
10003030-138 = "[s] «Ч-Что происходит?»"
10003030-139 = "Лучше бы это было важно. Я сейчас немного занята!"
10003030-140 = "Ситуация изменилась. По докладу Чинацу, Банда в шлемах «Сплэши» направляется к пляжу раньше, чем ожидалось!"
10003030-141 = "Прошу прощения. Мы пытались их остановить, но они оказались быстрее, чем ожидалось, и прорвались через нашу оборону."
10003030-142 = "Лучше спросить, откуда они вообще раздобыли тяжёлую артиллерию."
10003030-143 = "Нам придётся менять план. Иори, продолжай сдерживать хулиганов и сделай всё, чтобы они не столкнулись с гангстерами."
10003030-144 = "Все оставшиеся члены — перехватить Банду в шлемах «Сплэши»!"
10003030-145 = "А вы, Сенсей!"
10003030-146 = "[s] «Д-Да?»"
10003030-147 = "Вам нужно эвакуироваться с пляжа. Мы не можем позволить президентке вмешаться, поэтому немедленно верните её в отель!"
10003030-148 = "Её отпуск нельзя испортить — любой ценой!"
10003030-149 = ""
10003030-150 = "Сенсей?"
10003030-151 = "[s] «Э-Это был отель! Нам срочно надо обратно, Хинатюра!»"
10003030-152 = ""
10003030-153 = ""
10003030-154 = "Х-Хинатюра... П-Подожди, Сенсей. Я не закончила—"
10003030-155 = ""
