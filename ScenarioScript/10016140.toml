[translation]
10016140-1 = "Послесловие;Эпизод Инженерного отдела и Веритас"
10016140-3 = ""
10016140-5 = ""
10016140-6 = "О, привет! Чихиро!"
10016140-7 = ""
10016140-9 = ""
10016140-10 = "Я только что закончила проверять, что все использованные на соревнованиях роботы благополучно вернули."
10016140-11 = "Харе проверяет целостность программ, а макрос уже сортирует результаты всех забегов..."
10016140-12 = "...И на этом вся работа, которую поручил нам Семинар, завершена!"
10016140-13 = "Отличная работа, Маки."
10016140-14 = "Прости, что пришлось просить тебя работать во время фестиваля. Всё-таки он проходит не так уж часто."
10016140-15 = "Да брось! Я успела поучаствовать в нескольких соревнованиях и даже кое-где порисовать. Было потрясающе!"
10016140-16 = "Нет ничего лучше, чем добавить миру немного красок."
10016140-17 = "Рада слышать, что ты так думаешь."
10016140-18 = "Кстати, я слышала, что один студент Миллениум принёс на соревнование какое-то голографическое устройство, и из-за этого возник спор..."
10016140-19 = ""
10016140-21 = ""
10016140-22 = "Противники описали устройство, и оно звучало почти точь-в-точь как Athena-3 Харе..."
10016140-23 = "Ты что-нибудь об этом знаешь, Ма—"
10016140-24 = "Ик! Совсем забыла, Котама просила помочь ей забрать прослушки, которые она установила к фестивалю..."
10016140-26 = "П-прости, Чихиро! Похоже, мне пора бежать!"
10016140-27 = ""
10016140-29 = ""
10016140-30 = ""
10016140-31 = "Ну, полагаю, это всё подтверждает."
10016140-32 = "Когда вернёмся в клубную комнату, им потребуется строгое напоминание и дисциплинарное взыскание..."
10016140-35 = ""
10016140-36 = "Чихиро, ты уже закончила со всеми делами на фестивале?"
10016140-37 = "Да, благодаря нашим младшим."
10016140-38 = "А ты? Проводила всех посетителей?"
10016140-39 = "Разумеется. Как капитан группы поддержки принимающей школы, я обязана была заботиться о зрителях до самого конца спортивного праздника."
10016140-40 = "Тебе бы не пришлось, если бы вы с самого начала построили нормального робота поддержки."
10016140-41 = "Думаешь? А я не жалуюсь..."
10016140-42 = "Хотя это была задача в последний момент, чирлидинг стал для меня совершенно новым опытом. Мне понравилась возможность попробовать роль, отличную от моих обычных обязанностей."
10016140-43 = "Мне было настолько весело, что день пролетел незаметно."
10016140-44 = "Хотя, похоже, пора снова становиться мастером Инженерного отдела... Я буду скучать."
10016140-45 = "Если тебе грустно возвращаться к инженерии, опыт и правда был замечательный."
10016140-46 = ""
10016140-48 = ""
10016140-49 = "А ты, Чихиро? Тебе понравился фестиваль?"
10016140-50 = "Не сказала бы, что было именно весело... Я была так занята, что день закончился раньше, чем я успела это осознать."
10016140-51 = "Мало того что всю прошлую ночь я не спала, готовясь к открытию, так сегодня проблемы сыпались одна за другой. Даже церемония открытия превратилась в огромный переполох..."
10016140-52 = "Всё немного как в тумане, по крайней мере до того момента, когда мне удалось ненадолго вздремнуть в лазарете."
10016140-53 = "...Утаха, ты ведь тоже вчера не спала всю ночь. Ты совсем не устала?"
10016140-54 = "Мм. Вообще-то я так устала, что отключусь, стоит только лечь, но..."
10016140-55 = "Моя сила воли сильнее любой сонливости!"
10016140-56 = "Не знаю, восхищаться её силой духа или считать её просто дурой..."
10016140-57 = "В любом случае, похоже, тот робот поддержки, которого вы построили, натворил ещё больше бед, пока я спала..."
10016140-58 = ""
10016140-60 = ""
10016140-61 = ""
10016140-62 = "...И это снова возвращает меня к вопросу: о чём вы вообще думали, когда оснащали робота-чирлидера таким количеством боевых функций?!"
10016140-63 = "Потому что..."
10016140-65 = "Потому что это была моя мечта."
10016140-66 = "Забудь о своих мечтах! Из-за твоих мечтаний нас расследует академия SRT!"
10016140-67 = "Ты вообще—"
10016140-68 = ""
10016140-70 = ""
10016140-71 = ""
10016140-72 = ""
10016140-73 = "...Неважно. Если бы ты была человеком, который слушает мои нотации, ты бы давно отказалась от своих мечтаний."
10016140-74 = "Хихи. Как и ожидалось от моей старой подруги. Ты всегда быстро оцениваешь ситуацию и выносишь решение."
10016140-75 = ""
10016140-77 = ""
10016140-79 = "Как бы то ни было, из-за всего этого я почти не смогла участвовать в празднике, но рада, что остальные хорошо повеселились."
10016140-80 = "Хакеры обычно и так проводят большую часть времени в помещении, но наши новенькие вывели это на новый уровень. Они настолько мало двигаются, что я порой всерьёз переживаю за их здоровье."
10016140-81 = "Они хотя бы размялись, да и общение с другими академиями и соревнования в непривычной обстановке наверняка расширили их кругозор."
10016140-82 = "Тут я полностью с тобой согласна."
10016140-83 = "В мире есть вещи, которым можно научиться только собственным телом, а не из книг или видео."
10016140-84 = ""
10016140-86 = ""
10016140-87 = "Кстати о новом опыте — мне только что пришла идея."
10016140-88 = ""
10016140-90 = ""
10016140-91 = "Чихиро, почему бы и тебе не попробовать чирлидинг?"
10016140-92 = "...С чего это вдруг?"
10016140-93 = "Поддерживать команду вместе со всеми оказалось гораздо веселее, чем я ожидала... Вот я и захотела поделиться этим опытом с тобой."
10016140-94 = "А форму чирлидера, уверена, Хибики сошьёт тебе в два счёта, если попросить..."
10016140-95 = "И, как мы только что говорили, яркий новый опыт может вдохновить тебя в программировании."
10016140-96 = "Забудь. Не знаю насчёт других спортивных занятий, но чирлидинг..."
10016140-97 = ""
10016140-99 = ""
10016140-100 = "...А, понятно. Ты, должно быть, переживаешь из-за лишних килограммов, набранных из-за нерегулярного рабочего графика."
10016140-101 = "Не волнуйся. Люди обращают на чужую фигуру гораздо меньше внимания, чем тебе кажется."
10016140-102 = "К тому же я выяснила, что самым разным людям нравятся самые разные..."
10016140-103 = "Дело не в моём весе!"
10016140-104 = "Да всё нормально. Знаешь, как говорится..."
10016140-106 = "Проигрывает только тот, кто стесняется!"
10016140-107 = "Никто так не говорит!"
