[translation]
10016070-1 = "Эпизод 7;Сотрудничество 2"
10016070-2 = "Что не так с этим дурацким танком? Он не двигается!"
10016070-3 = "[s1] «Потому что это не танк...»\n[s2] «Инженерный департамент убрал его боевые функции во время вчерашнего ремонта...»"
10016070-4 = "Ну, это было довольно антиклимактично. Подкрепление нам едва ли понадобится."
10016070-5 = "Ну, это было довольно антиклимактично. Подкрепление нам едва ли понадобится."
10016070-6 = "Я рада, что мои опасения оказались напрасными. Хотя удивительно, что мы так быстро со всем разобрались."
10016070-7 = ""
10016070-9 = ""
10016070-10 = "Угх!! Не смотрите на нас свысока!"
10016070-11 = "Отступаем! Мы соберём ещё больше сторонников трёхдневной рабочей недели, и тогда вы уже не сможете остановить наш протест!"
10016070-12 = ""
10016070-14 = ""
10016070-16 = "Эй! Вернитесь!"
10016070-19 = "Здравствуйте и снова добро пожаловать на канал «Кронос»! Надеемся, все успели вкусно пообедать в одном из многочисленных киосков за пределами стадиона."
10016070-20 = "Утренние соревнования завершены — посмотрим, как теперь выглядит турнирная таблица!"
10016070-21 = "Академия Геенна неожиданно вырвалась вперёд сразу после начала турнира."
10016070-22 = "Удалось ли ей сохранить первое место?"
10016070-23 = "Ого! Теперь на вершине таблицы лидирует Научная школа Миллениум!"
10016070-24 = "Научная школа Миллениум?! Школа, куда больше известная математическими формулами, чем пенальти — сомневаюсь, что кто-то ожидал от них такого результата!"
10016070-25 = "Похоже, преимущество домашнего поля и правда существует."
10016070-26 = "Но отрыв совсем небольшой, так что им лучше не спускать глаз с Геенны и Тринити, которые наступают на пятки!"
10016070-27 = "При такой ожесточённой борьбе совершенно невозможно предсказать, кто станет победителем после дневных соревнований."
10016070-28 = "А следующим соревнованием нас ждёт... полоса препятствий!"
10016070-29 = "Здесь всё решает скорость: нужно стать самой быстрой участницей и преодолеть разнообразные препятствия по всей трассе."
10016070-30 = "Совершенно верно! Здесь множество сложных препятствий, которые будут замедлять бегуний и мешать им!"
10016070-31 = "Тут есть всё: от ниндзя-калтропов до крышек от бутылок, похожих на монеты в 500 иен, и даже плюшевые котики в коробках с надписью «Пожалуйста, заберите меня»..."
10016070-32 = "Думаю, котики в коробках точно отвлекли бы меня от гонки!"
10016070-33 = "Чтобы сделать всё ещё интереснее, в этом году добавили особое правило."
10016070-34 = "Вместо эстафетной палочки бегуньи будут передавать большую гранату с электронным детонатором внутри."
10016070-35 = "То есть вместо обычной палочки участницы будут передавать друг другу гранату? Звучит опасно!"
10016070-36 = "В этом-то и весь азарт! Пока гранату вовремя передадут следующей участнице, она не взорвётся."
10016070-37 = "Но если слишком затянуть — вас дисквалифицируют эффектным взрывом!"
10016070-38 = "Это правило ввели, чтобы поощрять командную работу, а не позволять каждой школе полагаться только на своего аса."
10016070-40 = "Ну что, какую академию в этот раз благословит Богиня Удачи?"
10016070-42 = "Участницы, представляющие Абидос в полосе препятствий..."
10016070-43 = "Сэрика, Хошино и Широко."
10016070-44 = ""
10016070-46 = ""
10016070-47 = "Хе-хе. Я так волнуюсь~"
10016070-48 = "Просто оставьте это мне."
10016070-49 = "Гранаты, брошенные котики... Почему всё так сложно?!"
10016070-50 = "Если мы хотим приз за первое место, нам обязательно нужно победить!"
10016070-51 = ""
10016070-53 = ""
10016070-54 = "Хаха... Не хочу, чтобы вы расстроились, если не получится. У такой маленькой школы, как наша, шансов не так много..."
10016070-55 = "Но всё равно мы постараемся изо всех сил!"
10016070-56 = "Если мы хорошо покажем себя на соревнованиях, может, больше студентов заинтересуются переводом в Абидос!"
10016070-57 = "Хахаха! Позволь просветить тебя, моя очаровательная младшекурсница!"
10016070-58 = "Нужного внимания ты добьёшься не хорошим выступлением на спортивном фестивале. Настоящий эффект будет, если выделиться на трибунах!"
10016070-59 = "...На трибунах?"
10016070-60 = "Ага-ага! Группа поддержки ведь сидит на трибунах!"
10016070-61 = "Смотри! Я поговорила с Хошино, и она вдохновила меня подготовить несколько поз для поддержки!"
10016070-62 = "Вперёд! Ты справишься!"
10016070-63 = "ВПЕРЁД!"
10016070-64 = "Группа поддержки в купальниках! ☆"
10016070-65 = "Что ещё за группа поддержки в купальниках? Звучит тупо!"
10016070-66 = ""
10016070-68 = ""
10016070-69 = "...Вообще-то я тоже кое-что подготовила."
10016070-70 = "О нет..."
10016070-71 = ""
10016070-73 = ""
10016070-74 = "Видите? Шестидесятимиллиметровая противотанковая ракета."
10016070-76 = "З-зачем?!"
10016070-77 = "Для предупредительных выстрелов, очевидно."
10016070-78 = "Поддержка важна для поднятия боевого духа своей команды, но говорят, лучшая защита — нападение. Нужно ещё и сломить дух соперника."
10016070-79 = "Как только другие команды увидят, как я выхожу с этой устрашающей ракетой, их охватят безнадёжность и отчаяние."
10016070-80 = "Мне нравится, Широко! Сильный настрой — уже половина победы."
10016070-81 = "Хи-хи! Как весело! ☆"
10016070-82 = ""
10016070-84 = "Но..."
10016070-85 = "Да ни за что это не разрешат!"
10016070-87 = "Хи-хи... Большие гранаты для полосы препятствий могут выглядеть как старые модели с тёрочным запалом, но на самом деле внутри продвинутый электронный запал, работающий с датчиком на рукоятке!"
10016070-88 = "Но поскольку мы делали их вчера в спешке, я не совсем уверена, что они будут работать как надо..."
10016070-89 = "Тогда долг мастера — самой испытать своё изобретение, участвуя в соревновании!"
10016070-90 = "Утаха, я проверю запал гранаты во время соревнования. Можешь, пожалуйста, поддержать нас?"
10016070-91 = ""
10016070-93 = ""
10016070-94 = "Конечно! Поддержку оставь нам."
10016070-95 = "Ух... Лучше бы я просто участвовала в забеге..."
10016070-96 = "Ты всё ещё сомневаешься, Хибики?"
10016070-97 = "Помни, теперь ты член группы поддержки! Твоя обязанность — заряжать команду энергией и настроем!"
10016070-98 = "Ну же! Улыбнись! Веселее! Веселее!"
10016070-99 = "Вперёд! Борись! Побеждай! Миллениум!"
10016070-100 = "М-Миллениум...!"
10016070-102 = "*зевает* Я так устала..."
10016070-103 = "Со вчерашней ночи я постоянно влипаю в какие-то странные происшествия..."
10016070-104 = "Если я х-хоть немного расслаблюсь, то м-могу отключиться..."
10016070-105 = "Не расслабляться, отряд RABBIT! Фестиваль Хало ещё далеко не закончен!"
10016070-106 = "И какой-нибудь коварный террорист прямо сейчас может готовить свой следующий ход."
10016070-107 = ""
10016070-109 = ""
10016070-110 = "Эм... Радар показывает крупный объект, приближающийся к трассе..."
10016070-111 = "Что это...?"
10016070-113 = "Ух... Не хочу участвовать в этой дурацкой гонке..."
10016070-114 = "Но Ако сказала, что если я попаду в тройку лучших, то даст мне общий талон на питание, и я смогу есть всё что захочу на Фестивале Хало Кивотоса..."
10016070-115 = ""
10016070-117 = "Так что... наверное, я немного постараюсь."
10016070-118 = ""
10016070-120 = ""
10016070-121 = ""
10016070-123 = ""
10016070-125 = "И с выстрелом сигнального пистолета участницы стартуют!"
10016070-126 = ""
10016070-129 = "Посмотрите, как они несутся! Какая скорость!"
10016070-130 = ""
10016070-133 = "Похоже, дорожка с калтропами не доставила особых проблем этим опытным спортсменкам. Теперь им нужно передать эстафету, то есть гранату, второй бегунье!"
10016070-134 = "Следующее препятствие..."
10016070-135 = "*грохот*"
10016070-136 = "А? Что это за звук?"
10016070-137 = ""
10016070-139 = ""
10016070-141 = "Упрямые ублюдки..."
10016070-142 = "П-перестаньте меня преследовать!"
10016070-143 = ""
10016070-145 = ""
10016070-148 = "Это танк?! Почему по стадиону несётся танк?"
10016070-149 = "У меня есть ответ!"
10016070-150 = "Этот шарообразный робот — робот-болельщик, которого мы сделали для спортивного фестиваля."
10016070-151 = "У него эргономичная круглая форма и гусеницы, поэтому он может быстро перемещаться по любой местности!"
10016070-152 = "В итоге мы не смогли его использовать из-за... небольшого происшествия."
10016070-154 = "Так что настоящий вопрос — что он здесь делает?"
10016070-155 = "Робот-болельщик? Да на нём огромный пулемёт!"
10016070-156 = "Это боевая система, которую мы установили, чтобы мгновенно подавлять террористов в случае нападения на фестиваль."
10016070-157 = "Но эту функцию, к сожалению, пришлось отключить. Она не сработает, если не обнаружит прямую угрозу или, возможно, мощный удар."
10016070-158 = "Бах! Бах!"
10016070-159 = "БА-БАХ!"
10016070-160 = "Широко! Я же сказала тебе не использовать это!"
10016070-161 = "Кто вообще стреляет противотанковой ракетой по невинному роботу-болельщику?!"
10016070-162 = "...Разве нельзя?"
10016070-163 = "Ух! Конечно нельзя!"
10016070-164 = "Он выглядел очень дорогим... Надеюсь, с ним всё в порядке."
10016070-166 = "Обнаружен взрыв боеголовки с пробивной способностью четыреста миллиметров и выше. Активация боевой системы."
10016070-167 = "Идентификация студентов-правонарушительниц в радиусе километра..."
10016070-168 = "Три студенты с незаконными пулями JHP, семь студентов в неразрешённой самодельной спортивной форме, пять студентов, которые едят на ходу..."
10016070-170 = "Критерии для определения «правонарушительницы» довольно строгие, да?"
10016070-171 = "Для машинного обучения ИИ мы использовали алгоритм принятия решений Семинара."
10016070-172 = "Возможно, на его параметры повлияла одна бессердечная казначейша..."
10016070-174 = "Проверка завершена. Все студенты в радиусе километра будут помечены как «правонарушительницы.»"
10016070-175 = "Полная мощность! Уничтожить!"
10016070-176 = "БА-БАХ!"
10016070-178 = "Ч-что происходит?! Почему нас атакует танк?"
10016070-180 = "Он взбесился из-за взрыва?"
10016070-181 = "Ух! Широко, это всё твоя вина!"
10016070-183 = "Я-я им не управляю! Помогите!"
10016070-184 = "Студенты-правонарушительницы, нарушающие ход спортивного фестиваля, будут уничтожены."
10016070-186 = "Я так и знала! Террористы Миллениума наконец-то вышли на сцену!"
10016070-187 = "Подойдём ближе и используем гранату. Должно сработать."
10016070-188 = ""
10016070-190 = ""
10016070-191 = "...А? Граната просто отскочила от него, будто пёрышко..."
10016070-193 = "БУМ!"
10016070-194 = "Саки!"
10016070-196 = "В-вы всё это снимаете?"
10016070-197 = "Во время полосы препятствий на трассу внезапно ворвался танк и начал атаковать студентов!"
10016070-198 = "Как такое ужасающее оружие вообще оказалось на мирном Фестивале Хало?!"
10016070-199 = "Вот это сенсация! Срочные новости!"
10016070-201 = "Что это за танк, Юука?"
10016070-202 = "В плане проведения фестиваля не было ничего про танк!"
10016070-203 = "Я-я тоже ничего о нём не знаю!"
10016070-204 = "Я не думала, что это настоящий танк! Когда протестующие его забрали, я решила, что это просто макет или что-то такое."
10016070-205 = "Мне кажется довольно подозрительным, что он говорит точь-в-точь как ты."
10016070-206 = "Всякое вроде «Уничтожить их!» и «Правонарушители!»"
10016070-207 = "Я так не разговариваю!"
10016070-208 = "Но важнее другое: что это за танк, Сенсей?! Что произошло вчера, пока я спала?"
10016070-209 = "[s3] «Эм... Тут такое дело...»\n[s4] «Это довольно долгая история...»"
10016070-212 = "Объяснишь, когда мы возьмём ситуацию под контроль."
10016070-213 = "Мари, пожалуйста, помоги эвакуировать зрителей."
10016070-214 = "Д-Да!"
10016070-215 = "Остальные — мы обезвредим этот танк!"
10016070-217 = "Я как раз собиралась это сказать! Мне не нужны твои приказы!"
10016070-218 = "После этого они напишут отчёт на десять страниц!"
