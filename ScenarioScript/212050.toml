[translation]
212050-1 = "Эпизод 5;Я ухожу"
212050-2 = "Стратегический штаб Пандемониума"
212050-4 = ""
212050-7 = ""
212050-8 = "Председатель Макото. Два представителя Лиги наследия просят аудиенции."
212050-9 = ""
212050-12 = ""
212050-13 = "Хм. Разрешаю."
212050-15 = "Есть. Пропустим их."
212050-16 = ""
212050-18 = ""
212050-19 = "..."
212050-24 = ""
212050-25 = "Эм..."
212050-26 = ""
212050-29 = ""
212050-30 = "Хмф. Фурихата Маюми и Мёраку Карен, что привело вас сюда?"
212050-32 = "Эм, ну... В общем..."
212050-33 = "Председатель, не буду ходить вокруг да около. Сразу к делу."
212050-34 = ""
212050-37 = ""
212050-38 = "Ки-хе-хе... Невероятная дерзость, но я достаточно великодушна, чтобы стерпеть такую грубость. Говори."
212050-39 = "Уф... Вы серьёзно?"
212050-40 = "Слушайте... вы действительно всерьёз говорили всё это в своей речи?"
212050-41 = "Я всегда серьёзна."
212050-42 = "То есть вы и правда хотите начать войну...? И завоевать Кивотос силами Геенны...?"
212050-43 = "Откуда столько сомнений? Разве по моему голосу было неясно, что я говорю искренне?"
212050-44 = "Просто... ну. Переходить к разрушительной войне вот так внезапно — это уж слишком."
212050-45 = "И Пандемониум с Префектурой так давят на студентов. Я видела, как они конфисковывали личные боеприпасы. Разве всё это необходимо?"
212050-46 = "Этот приказ отдала лично я. Судя по всему, его успешно исполняют. Ки-хе."
212050-47 = "Э-Это..."
212050-48 = "Хмф, вас пугают недавние реформы? Поначалу перемены всегда вызывают неудобства."
212050-49 = "Но взгляните! Пандемониум и Префектура объединились! Все студенты сплотились под знаменем Геенны."
212050-50 = "Фурихата Маюми. Разве ты не видишь перед собой ту славную единую Геенну, о которой мечтала? Ки-хе-хе."
212050-51 = "...Но Макото, а как же свобода воли? Когда мы мечтали о великой Геенне, то думали, что все объединятся добровольно."
212050-53 = "Председатель, воля в конечном счёте лишь порождение окружающих условий."
212050-54 = "А мы всего лишь заменяем нынешнюю среду хаоса строгим и управляемым порядком."
212050-56 = "Шоуко..."
212050-57 = "Тогда позвольте спросить вас обеих. А ВЫ настроены серьёзно?"
212050-58 = "В-в каком смысле?"
212050-59 = "Я спрашиваю, готовы ли вы завоевать Кивотос ради Геенны. Считаете ли вы это необходимым, чтобы вернуть Геенне славу? Да... или нет?"
212050-60 = "Разве не об этом вы так громко заявляли? Единая Геенна, где все мыслят как одно целое. Великая Геенна, какой она была прежде."
212050-61 = "..."
212050-62 = "И вот настал этот момент. Вы говорили, что хотите вернуть Геенну прошлого."
212050-63 = "И теперь, как тогда, все движутся к одной цели и мыслят как единое целое. Что вы на это скажете?"
212050-64 = "Но, председатель..."
212050-65 = ""
212050-67 = ""
212050-68 = "Вы же говорили, что вам нравится нынешняя Геенна. Что она и так существует именно так, как вы задумали."
212050-69 = "Вы сказали нам это при встрече, когда рассуждали о ценности свободы, пусть даже она и порождает хаос."
212050-71 = "Ага. Почему вы так внезапно передумали? И не только вы, но и остальные старшие...?"
212050-72 = ""
212050-75 = ""
212050-76 = "Ки-хе-хе... Тогда я всего лишь прибегла к риторическому приёму, ещё не осознав истину."
212050-77 = "Свобода, которую раздают без разбора, непредсказуема и неэффективна. Геенне нужен абсолютный порядок, поддерживаемый совершенным контролем."
212050-78 = "Разве не вы спорили со мной? Утверждали, что так называемая свобода в моей Геенне приводит лишь к бессмысленному хаосу."
212050-80 = "В-в общих чертах мы так и говорили..."
212050-82 = "Обещаю вам: после войны Геенна засияет ярче, чем вы можете себе представить."
212050-83 = "Всё, что вам нужно, — следовать за мной."
212050-84 = ""
212050-87 = ""
212050-88 = ""
212050-90 = "..."
212050-92 = "Ладно... пока что. Мы пойдём."
212050-94 = "Ки-хе-хе. И хорошенько обдумайте свои следующие шаги."
212050-95 = ""
212050-98 = ""
212050-101 = ""
212050-102 = "Что такое, Ироха? Если хочешь что-то сказать, говори."
212050-103 = "Макото... Ты ведь всерьёз всё это затеяла?"
212050-104 = "Опять этот вопрос? Я не из тех, кто бросает слова на ветер."
212050-105 = "..."
212050-107 = "Тогда я ухожу из Пандемониума."
212050-108 = ""
212050-110 = ""
212050-111 = "Что?"
212050-112 = "Знакомая мне Макото могла нести любую глупость, но никогда бы не сказала ничего подобного."
212050-113 = "И я не хочу оставаться рядом... с такой тобой."
212050-115 = "И-Ироха...?"
212050-116 = "..."
212050-118 = "Ироха...?"
212050-120 = "...Вот как?"
212050-121 = "Да."
212050-122 = "Тогда поступай как хочешь."
212050-123 = "..."
212050-124 = "Хмф... Я думала, однажды ты, возможно, возглавишь Пандемониум..."
212050-125 = "Но, видимо, на этом наши пути расходятся, Ироха."
212050-126 = "Да. Огромное тебе, чёрт побери, спасибо за всё время, что мы провели вместе."
212050-127 = ""
212050-129 = ""
212050-130 = ""
212050-131 = "..."
212050-132 = ""
212050-134 = ""
212050-136 = ""
212050-137 = "Ироха..."
212050-138 = "Ироха, ты уходишь...? Ты больше не в Пандемониуме...?"
212050-139 = "А-а... Ч-что же нам делать?! Ироха...!!!"
212050-141 = "Тихо."
212050-142 = ""
212050-144 = ""
212050-145 = "А, но!"
212050-146 = "Сейчас Геенна переживает величайший перелом в своей истории. Чтобы добиться успеха, все должны работать сообща, как шестерёнки точного механизма."
212050-147 = "Настало время посвятить себя возрождению славной Геенны! Здесь нет места разболтанным винтам и ржавым шестерням!"
212050-148 = ""
212050-150 = ""
212050-152 = ""
212050-153 = "...Макото, ты злюка!"
212050-154 = ""
212050-156 = ""
212050-157 = "Нельзя так говорить об Ирохе! Это плохо!"
212050-158 = "...Нет, Ибуки. Сейчас не время думать о личных отношениях."
212050-159 = "Ты ещё мала, потому можешь не понимать, но ради воплощения нашего замысла..."
212050-160 = "И всё равно! Ибуки ничего такого не знает, зато Ибуки знает, что Ироха расстроилась!"
212050-161 = "Тц..."
212050-162 = ""
212050-164 = ""
212050-165 = ""
212050-166 = "...Сацуки, Чиаки. Успокойте Ибуки."
212050-167 = "Шоуко, тебе поручена инспекция военного времени. Сверяйся с инвентаризационными документами."
212050-168 = "Поняла."
212050-169 = ""
212050-175 = "..."
212050-176 = "Макото..."
212050-177 = ""
212050-179 = ""
212050-181 = ""
212050-182 = "*всхлипывает*"
212050-184 = "У-у... Уа-а-а..."
212050-185 = ""
212050-187 = ""
212050-188 = "И-Ибуки! Уверена, Макото и Ироха просто пошутили!"
212050-189 = "Д-да! Хочешь пудинг? Уверена, сладости тебя развеселят!"
212050-191 = "Не хочу... Уа-а... Не надо больше ссориться... Не надо говорить гадости... *всхлип*"
212050-192 = "Не будем! Никто больше не будет! А теперь успокойся и..."
212050-193 = ""
212050-195 = ""
212050-196 = ""
