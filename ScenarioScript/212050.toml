[translation]
212050-1 = "Episode 5;I Quit"
212050-2 = "Pandemonium Society - Operations Room"
212050-8 = "Chairman Makoto, the Gehenna Restoration Committee is requesting an audience."
212050-13 = "Hmph, granted."
212050-15 = "I shall show them in."
212050-19 = "……."
212050-25 = "Ah……."
212050-30 = "Hmph. What is it you want, Mayumi Furihata, Karen Myouraku?"
212050-32 = "Um, well, you see……."
212050-33 = "Chairman, let's skip the pleasantries."
212050-38 = "Hehehe... It is a sign of magnanimity to forgive even the most blatant rudeness. Speak your mind."
212050-39 = "Honestly……."
212050-40 = "Anyway, that speech. Are you serious about it?"
212050-41 = "I am always serious."
212050-42 = "So, is Gehenna going to attack Kivotos?"
212050-43 = "Let me ask you this: why do you doubt my sincerity?#nAre the words of Makoto Hanuma not worthy of your trust?"
212050-44 = "No, it's just…… attacking Kivotos, that's a lot to take in all of a sudden."
212050-45 = "And it's a bit heavy-handed, isn't it? I saw it earlier—you were even confiscating students' ammunition.#nIs that really necessary?"
212050-46 = "Hehehe. It seems my orders are being carried out perfectly."
212050-47 = "How could you……."
212050-48 = "Hmph, you talk a big game, yet you're afraid?#nChange is always unfamiliar and frightening."
212050-49 = "Now, the Prefect Team and the Pandemonium Society have joined forces, and the entire student body has gathered under the banner of Gehenna."
212050-50 = "The 'United Gehenna' you once dreamed of has finally come to fruition."
212050-51 = "……But isn't individual will important, too?#nWe dreamed of everyone coming together of their own free will to achieve greatness, not like this……."
212050-53 = "If I may, Chairwoman.#nWill is something shaped by one's environment."
212050-54 = "We have simply transformed the existing environment of disorder into one of strictly controlled order."
212050-56 = "Shoko……."
212050-57 = "Then I ask you: are you serious?"
212050-58 = "A-about what?"
212050-59 = "Are you prepared to stand against Kivotos to serve as the foundation for a greater Gehenna?"
212050-60 = "You used to say it like a mantra, didn't you?#n'Make Gehenna Great Again.'"
212050-61 = "……."
212050-62 = "You wanted to return to the Gehenna of the past, didn't you?#nWell, now is the time."
212050-63 = "Just like in those days, everyone's hearts are united, moving toward the same goal."
212050-64 = "But still……."
212050-68 = "Chairman, wasn't the Gehenna of today supposed to be better than the past?"
212050-69 = "When we came to ask for permission for our activities, you said so yourself. You said it was about freedom."
212050-71 = "That's right. Why did it change so suddenly? Not just you, but the others too……."
212050-76 = "Hehehe…… I hadn't reached the truth back then. That is all."
212050-77 = "Compare it to the order established under complete control.#nThe half-baked freedom granted back then was nothing more than an inefficient and unpredictable source of anxiety."
212050-78 = "In fact, you yourselves said it back then: that superficial freedom is meaningless."
212050-80 = "W-well, we did say that, but……."
212050-82 = "I, Makoto, guarantee this:#nOnce we have achieved our goal, Gehenna will shine brighter than you could ever imagine."
212050-83 = "For now, you need only follow me."
212050-90 = "……."
212050-92 = "……I understand. I'm going home for today."
212050-94 = "Hehehe. You would do well to think carefully about your future conduct."
212050-102 = "What is it, Iroha? If you have something to say, say it."
212050-103 = "Makoto-senpai…… you're serious about this, aren't you?"
212050-104 = "Are we back to that? You should know by now. I have never uttered a single word of nonsense."
212050-105 = "……."
212050-107 = "Then, I…… I quit the Pandemonium Society."
212050-111 = "What did you say?"
212050-112 = "The Makoto-senpai I know would never say such things."
212050-113 = "I don't want to see the Makoto-senpai who has changed…… anymore."
212050-115 = "I-Iroha-chan……?"
212050-116 = "……."
212050-118 = "Iroha-senpai……?"
212050-120 = "……I see."
212050-121 = "Yes."
212050-122 = "Then do as you please."
212050-123 = "……."
212050-124 = "Hmph…… I had thought you might be the one to succeed me in the Pandemonium Society……."
212050-125 = "So this is where it ends."
212050-126 = "Yes. Thank you for everything over the years."
212050-131 = "……."
212050-137 = "Iroha…… senpai……?"
212050-138 = "You're quitting? Does that mean you're not in the Pandemonium Society anymore……?"
212050-139 = "W-w-what do we do!? Iroha-chan is……!!"
212050-141 = "Quiet."
212050-145 = "B-but!"
212050-146 = "Gehenna is at a critical crossroads. #nIf everything doesn't mesh like a precision gear, we cannot achieve our great ambition."
212050-147 = "When the time comes to stake our lives on building a great Gehenna—we have no need for squeaky gears!!"
212050-153 = "……Makoto-senpai, that's horrible!"
212050-157 = "You shouldn't say things like that!"
212050-158 = "……You're wrong, Ibuki. Now is not the time to be caught up in personal relationships."
212050-159 = "To fulfill our long-cherished ambition—"
212050-160 = "I don't care! Ibuki doesn't really understand, but…… Iroha-senpai looked so sad!"
212050-161 = "Ugh……!"
212050-166 = "Satsuki, Chiaki. Calm Ibuki down."
212050-167 = "Shoko, we are going on an inspection. Bring the inventory documents and follow me."
212050-168 = "Understood."
212050-175 = "……."
212050-176 = "Makoto-senpai……."
212050-182 = "……*hic*."
212050-184 = "W-waaa…… uwaaaaaa…… *sob*."
212050-188 = "I-Ibuki-chan!#nMaybe Makoto-senpai and Iroha-chan…… maybe they didn't mean it!"
212050-189 = "Oh, I know! Let's eat some pudding? Eating something sweet will make you feel better!!"
212050-191 = "I don't want any…… *sob*…… please don't fight…… don't say mean things…… *sniff*."
212050-192 = "I won't! I promise! There, there, calm down……."
212050-197 = "Iroha-chan……."
212050-203 = "……."
212050-204 = "Chairman."
212050-205 = "……."
212050-206 = "Do you intend to just leave Iroha Natsume as she is?"
212050-207 = "What are you getting at?"
212050-208 = "Iroha Natsume has made it clear that she refuses to follow the Chairman."
212050-209 = "She is now a threat to Gehenna's unity. I see no reason to let this slide."
212050-210 = "We should designate her as a person of interest and, depending on the circumstances, treat this as treason—"
212050-212 = "That is enough."
212050-213 = "……."
212050-214 = "I will decide how to handle her."
212050-215 = "I will listen to your suggestions, but know your place."
212050-216 = "……My apologies."
212050-217 = "……Let's go."
212050-222 = "……So, it seems you cannot control everything after all."
212050-223 = "Still, this much should be enough. Hehe."
212050-228 = "Next Episode;Hot Spring Development Department"