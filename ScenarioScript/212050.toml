212050-203 = "......"
212050-204 = "Líder."
212050-205 = "......"
212050-206 = "A senhora pretende deixar a parlamentar Iroha...... perdão, Natsume Iroha, solta por aí?"
212050-207 = "O que está insinuando?"
212050-208 = "Natsume Iroha deixou explícita sua recusa em obedecer às ordens da liderança máxima."
212050-209 = "A essa altura, ela representa uma ameaça direta à coesão militar de Gehenna. Não há motivos para deixá-la impune."
212050-210 = "Deveríamos classificá-la como alvo de alta vigilância e, conforme a situação, aplicar a devida contenção por traição――"
212050-212 = "Chega."
212050-213 = "......"
212050-214 = "O destino dela quem decide sou eu."
212050-215 = "Eu escuto seus conselhos táticos. Mas conheça o seu lugar."
212050-216 = "......Peço escusas pela intromissão."
212050-217 = "......Vamos."
212050-218 = ""
212050-220 = ""
212050-221 = ""
212050-222 = "......Como imaginei: não é possível controlar absolutamente tudo à perfeição."
212050-223 = "Ainda assim, para os meus propósitos, isso já é mais do que suficiente. Fufufu."
