[translation]
212050-1 = "Episódio 05;Tô Fora!"
212050-2 = "Sociedade Pandemônio - Sala de Comando Tático"
212050-4 = ""
212050-7 = ""
212050-8 = "Líder Makoto, as representantes do Comitê de Restauração de Gehenna solicitam audiência."
212050-9 = ""
212050-12 = ""
212050-13 = "Permissão concedida."
212050-15 = "Podem entrar."
212050-16 = ""
212050-18 = ""
212050-19 = "......"
212050-24 = ""
212050-25 = "Ah......"
212050-26 = ""
212050-29 = ""
212050-30 = "Humph. Que negócio as traz aqui? Furihata Mayumi, Myouraku Karen."
212050-32 = "É que...... bem......"
212050-33 = "Senhora líder, sem rodeios, por favor."
212050-34 = ""
212050-37 = ""
212050-38 = "Kwahaha! Tolerar impertinências é o privilégio dos verdadeiros líderes magnânimos. Prossigam."
212050-39 = "Ai, paciência......"
212050-40 = "Direto ao ponto: aquele discurso todo de guerra. Foi sério mesmo?"
212050-41 = "Esta que vos fala SEMPRE fala com a mais absoluta seriedade."
212050-42 = "Então Gehenna vai mesmo marchar pra guerrear contra Kivotos inteira?"
212050-43 = "Inverto a pergunta: por que a dúvida?#nAcaso as palavras da grande Hanuma Makoto não lhe parecem dignas de fé inabalável?"
212050-44 = "Não é isso! É que...... atacar Kivotos do nada? Isso cai como uma bomba na nossa cabeça!"
212050-45 = "Sem falar que as coisas tão passando dos limites. Acabamos de ver guardas tomando as munições das alunas na marra!#nPrecisava dessa grosseria toda?"
212050-46 = "Kwahaha! Vejo que minhas diretrizes operacionais estão funcionando com perfeição suíça."
212050-47 = "Não é possível......"
212050-48 = "Humph, tanto falavam de grandeza e agora tremem diante do primeiro passo?#nA verdadeira transformação sempre assusta os covardes."
212050-49 = "Agora o Comitê de Disciplina e a Sociedade Pandemônio marcham lado a lado, e todo o corpo discente cerra fileiras sob a nossa bandeira."
212050-50 = "A 'Gehenna Unida' que você tanto sonhava floresceu aqui diante dos seus olhos."
212050-51 = "......Mas e a vontade de cada uma? Não conta nada?!#nO que a gente sonhava era ver todo mundo se unindo por pura vontade própria, pra construirmos juntas uma escola grandiosa......!"
212050-53 = "Com a devida vênia, líder Mayumi.#nA vontade é moldada pelo ambiente."
212050-54 = "Apenas substituímos o antigo ambiente de desordem anárquica por uma disciplina rigorosamente coordenada."
212050-56 = "Shoko......"
212050-57 = "Portanto, pergunto a vocês: o compromisso de vocês é real?"
212050-58 = "C-Como assim?"
212050-59 = "Vocês têm a fibra necessária para se colocarem contra Kivotos e servirem de alicerce para a glória de Gehenna?"
212050-60 = "Não eram vocês que enchiam a boca aos quatro cantos dizendo: 'Tornar Gehenna grande novamente'? Pois bem!"
212050-61 = "......"
212050-62 = "Não queriam o retorno dos tempos áureos de Gehenna?#nO momento tão aguardado é exatamente este."
212050-63 = "Como nos velhos tempos, todos os corações batendo no mesmo compasso, marchando para o mesmo objetivo."
212050-64 = "Mas......"
212050-65 = ""
212050-67 = ""
212050-68 = "Líder Makoto, a Gehenna de hoje não era mil vezes melhor do que a do passado?"
212050-69 = "Foi isso que você bateu no peito pra dizer quando fomos pedir autorização pro Comitê! Falou de liberdade!"
212050-71 = "Pois é! Por que essa virada de casaca repentina? E não foi só você, foram todas as veteranas......"
212050-72 = ""
212050-75 = ""
212050-76 = "Kwahaha...... Naquela época, eu ainda não havia alcançado a iluminação suprema. Simples assim."
212050-77 = "Comparem com a ordem majestosa gerada pelo controle absoluto!#nEssa 'liberdade' capenga que tínhamos não passava de um entulho ineficiente, caótico e perigosamente imprevisível."
212050-78 = "Pelo contrário: naquele dia, foram vocês que afirmaram em alto e bom som que uma liberdade de fachada não tinha valor algum."
212050-80 = "B-Bem, a gente disse isso mesmo, mas......"
212050-82 = "Eu, Makoto, garanto de pés juntos:#nQuando essa obra estiver concluída, Gehenna brilhará com um esplendor tão estarrecedor que as mentes de vocês sequer conseguem vislumbrar."
212050-83 = "Por ora, limitem-se a marchar atrás dos meus passos majestosos!"
212050-84 = ""
212050-87 = ""
212050-88 = ""
212050-90 = "......"
212050-92 = "......Entendi. Por hoje, a gente vai embora."
212050-94 = "Kwahaha. Tratem de refletir muito bem sobre qual será a postura de vocês daqui para frente."
212050-95 = ""
212050-98 = ""
212050-101 = ""
212050-102 = "O que foi, Iroha? Se tem algo a declarar, cuspa de uma vez."
212050-103 = "Makoto-senpai...... você tá falando sério mesmo?"
212050-104 = "Outra vez com essa ladainha? Você me conhece melhor do que ninguém: eu nunca brinquei em serviço na minha vida."
212050-105 = "......"
212050-107 = "Sendo assim...... eu me demito da Sociedade Pandemônio."
212050-108 = ""
212050-110 = ""
212050-111 = "O que disse?!"
212050-112 = "A Makoto-senpai que eu conheço jamais diria essas barbaridades."
212050-113 = "E eu...... me recuso a continuar assistindo a essa mulher bizarra em que você se transformou."
212050-115 = "I-Iroha-chan......?!"
212050-116 = "......"
212050-118 = "Iroha-senpai......?"
212050-120 = "......Compreendo."
212050-121 = "Sim."
212050-122 = "Nesse caso, faça o que bem entender."
212050-123 = "......"
212050-124 = "Humph...... eu chegava a cogitar que você herdaria o comando da Sociedade Pandemônio um dia......"
212050-125 = "Parece que a sua fibra só ia até aqui."
212050-126 = "Pois é. Muito obrigada por tudo durante todo esse tempo."
212050-127 = ""
212050-129 = ""
212050-130 = ""
212050-131 = "......"
212050-132 = ""
212050-134 = ""
212050-136 = ""
212050-137 = "Iroha...... senpai......?"
212050-138 = "Se demitir...... quer dizer que ela não é mais da Pandemonium......?"
212050-139 = "A-A-Ai meu Deus, o que a gente faz?! A Iroha-chan foi embora......!!"
212050-141 = "Silêncio!"
212050-142 = ""
212050-144 = ""
212050-145 = "M-Mas!"
212050-146 = "Gehenna se encontra em uma encruzilhada histórica crucial.#nSe cada engrenagem não girar em harmonia milimétrica, o triunfo será impossível."
212050-147 = "Na hora de dar a própria vida para erguer uma Gehenna grandiosa―― parafusos frouxos não têm serventia alguma!!"
212050-148 = ""
212050-150 = ""
212050-152 = ""
212050-153 = "......Makoto-senpai, você é muito má!"
212050-154 = ""
212050-156 = ""
212050-157 = "Você não pode falar uma coisa horrível dessas!"
212050-158 = "......Não é isso, Ibuki. Este não é o momento de nos apegarmos a sentimentalismos baratos."
212050-159 = "Para realizarmos nosso supremo objetivo――"
212050-160 = "Não quero saber! A Ibuki não entende nada de guerra, mas...... a Iroha-senpai tava com uma cara muito triste!"
212050-161 = "Ugh......!"
212050-162 = ""
212050-164 = ""
212050-165 = ""
212050-166 = "Satsuki, Chiaki. Acalmem a Ibuki."
212050-167 = "Shoko, vamos inspecionar as tropas. Traga os relatórios de inventário e me acompanhe."
212050-168 = "Às suas ordens."
212050-169 = ""
212050-175 = "......"
212050-176 = "Makoto-senpai......"
212050-177 = ""
212050-179 = ""
212050-181 = ""
212050-182 = "......Snif."
212050-184 = "Buaaa...... buááá...... buaaaaaaaah!"
212050-185 = ""
212050-187 = ""
212050-188 = "C-Calma, Ibuki-chan!#nA Makoto-senpai e a Iroha-chan...... n-não falaram por mal, com certeza!"
212050-189 = "O-Olha, que tal um pudim bem gostoso?! Comer um docinho sempre alegra o coração, não alegra?!"
212050-191 = "Não quero pudim...... buááá! Não briguem...... não falem coisas feias umas pras outras...... buááá!"
212050-192 = "A gente não vai brigar! Ninguém vai brigar mais! Pronto, calma, respira fundo......"
212050-193 = ""
212050-195 = ""
212050-196 = ""
212050-197 = "Iroha-chan......"
212050-200 = ""
