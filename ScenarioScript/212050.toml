212050-200 = ""
212050-201 = ""
212050-202 = ""
212050-203 = "..."
212050-204 = "Председатель."
212050-205 = "..."
212050-206 = "Вы намерены позволить ей, Нацумэ Ирохе, вот так просто уйти?"
212050-207 = "...А что?"
212050-208 = "Нацумэ Ироха ясно дала понять, что не намерена следовать вашему руководству, председатель. Она инакомыслящая."
212050-209 = "Мы ведь не можем закрывать глаза на тех, кто подрывает единство Геенны?"
212050-210 = "Нужно объявить её подозреваемой и, в зависимости от тяжести выявленных нарушений, обвинить в государственной измене..."
212050-212 = "Хватит."
212050-213 = "..."
212050-214 = "Что с ней делать, решу я."
212050-215 = "Игараши Шоуко. Я прислушиваюсь к твоим советам, но НЕ переходи границы."
212050-216 = "...Да. Простите."
212050-217 = "...Пора идти."
212050-218 = ""
212050-220 = ""
212050-221 = ""
212050-222 = "...Как и ожидалось. Я не могу управлять каждой мыслью."
212050-223 = "Но, пожалуй, и этого будет достаточно. Фу-фу."
