[translation]
2600505-1 = "Учёба в кафе"
2600505-2 = "..."
2600505-3 = "[s] «...»"
2600505-4 = "(Хм. Я узнаю это кафе.)"
2600505-5 = "Ч-что? Почему вы так на меня смотрите?"
2600505-6 = "[s1] «Ты обещала, что мы больше не будем этого делать!»\n[s2] «Разве с этими оправданиями ещё не покончено?»"
2600505-7 = "Нет! Нет! Не волнуйтесь, всё не так!"
2600505-8 = "Я позвала вас сюда учиться, а не есть!"
2600505-9 = "Я знаю, о чём вы думаете... Но правда не поэтому."
2600505-10 = "Сегодня я действительно позвала вас сюда учиться... Честно!"
2600505-11 = "Недавнюю контрольную я написала не очень, поэтому хотела разобрать свои ответы."
2600505-12 = "Но одной это сделать непросто."
2600505-13 = "Я понимаю, что решила правильно... Но никак не пойму, где именно ошиблась, понимаете?"
2600505-14 = "Поэтому мне нужен кто-то, кто объяснит мои ошибки. Вы не против?"
2600505-15 = "Вы ведь учитель, значит, справитесь, правда? В конце концов, это ваша работа."
2600505-16 = "Почему именно десертное кафе? Ну, десертное кафе — всё равно кафе! Здесь многие занимаются!"
2600505-17 = "Я оторвала вас от работы? Я знаю, у вас и так куча дел..."
2600505-18 = "Но всё нормально, потому что остальные справятся? *вздох* Фух, я уже устала!"
2600505-19 = "Спасибо, что сказали так... Я знала, что правильно сделала, попросив именно вас!"
2600505-20 = "Иногда вы говорите странные вещи, но ваши слова всё равно успокаивают... Как-то так."
2600505-21 = "А? Мои оценки? Ну... думаю, средние. А что?"
2600505-22 = "Я слишком стараюсь, хотя ничего опасного не происходит...? Что вы такое говорите? У всех ведь по-разному, правда?"
2600505-23 = "Думаете, я прилежная? Нет, правда, это не так. Странно вообще говорить о таком как о «прилежании»."
2600505-24 = "Прилежание — это скорее, ну... например..."
2600505-25 = "[s3] «Значит, усердие — это прибегать по первому зову Ёшими?»\n[s4] «Усердие — это внимательно следить за расписанием кондитерского кафе?»"
2600505-26 = "Вот именно! Например, когда Сенсей думает обо мне..."
2600505-27 = "...?"
2600505-28 = "Ну, с такими усилиями..."
2600505-29 = "...Эй!"
2600505-30 = "Хватит надо мной издеваться!"
2600505-31 = "Я больше не могу! Вы скользкий, как сырное масло!"
2600505-32 = "Каждый раз одно и то же! ...Постоянно шутите так, что я ничего не понимаю! Вы хоть знаете, каково мне?!"
2600505-33 = "Наверняка вам кажется смешным именно потому, что я не понимаю, где вы шутите!"
2600505-34 = "Успокоиться? Я похожа на человека, который сейчас может успокоиться?! Не могу я успокоиться!"
2600505-35 = "Что значит «люди смотрят»? Мне-то какое дело?!"
2600505-36 = "Что значит «разобрать ответы»?! Какая теперь вообще разница?!"
2600505-37 = "..."
2600505-38 = "*вздох* ...Ах да. Контрольная. Надо разбирать контрольную..."
2600505-39 = "Сенсей, вы ведь пришли сюда помочь мне с учёбой, так что я вас прощу..."
2600505-40 = "Но только один раз. Только один! Понятно?!"
2600505-41 = "Угх, что за странное чувство... Будто вы всё ещё надо мной издеваетесь..."
2600505-42 = "Я в плохом настроении? Всё, хватит! Перестаньте болтать и просто посмотрите мои задания!"
2600505-44 = "(После этого мы с Ёшими долго разбирали все её неправильные ответы.)"
2600505-46 = "Так! Мы как-то закончили... Мы правда всё закончили!"
2600505-47 = "Хорошая работа? О чём вы? Сенсей, это вы хорошо поработали."
2600505-48 = "Но всё равно спасибо. Благодаря вам я почти со всем разобралась. Одна я бы точно не справилась."
2600505-49 = "Что? Вы сказали, это потому, что я смогла понять всё, чему вы меня учили?"
2600505-50 = "Хм!"
2600505-51 = "Вот видите? Вы умеете говорить приятные вещи, Сенсей!"
2600505-52 = "Никогда бы не подумала, ведь вы постоянно меня дразните!"
2600505-53 = "[s] «Я скажу всё, что тебе нравится, Ёшими»."
2600505-54 = ""
2600505-55 = "Ч-что..? Э-это?! Всё, хватит, пожалуйста!"
2600505-56 = "..."
2600505-57 = "*вздох* Ладно. Сегодня я это спущу."
2600505-58 = ""
2600505-59 = ""
2600505-60 = "Но вам всё равно придётся время от времени мне помогать... Хорошо, Сенсей?"
2600505-62 = "(После этого всё вернулось в норму, и мы вдвоём объелись всеми десертами, какие только были в кафе.)"
