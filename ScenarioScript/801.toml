[translation]
801-1 = "Брифинг миссии Grand Assault"
801-4 = ""
801-5 = "Прошу прощения за ожидание, Сенсей."
801-6 = "Ивабицу Аюму из Регламентного комитета прибыла для помощи."
801-7 = "З-Здравствуйте, Сенсей."
801-8 = "Нельзя терять время. Начну брифинг."
801-9 = "После недавних событий Генеральный студенческий совет неустанно работал над улучшением мер реагирования на чрезвычайные ситуации. Это место — результат."
801-11 = "Да... Это пункт управления... по сути, оперативная комната..."
801-12 = "Отсюда у вас будет больше инструментов, данных и средств массовой связи, чтобы эффективнее управлять полем боя, если Кивотос снова окажется под угрозой."
801-14 = "Регламентный комитет сыграл ключевую роль в том, чтобы всё было готово так быстро и эффективно. Отличная работа, Аюму."
801-15 = "Что вы! Нет-нет, это всё идея Рин... главного администратора... Я просто делала, что мне говорили..."
801-16 = "Казначейство тоже внесло большой вклад..."
801-17 = "Все много работали над этой оперативной комнатой, Сенсей, так что надеюсь, она вам пригодится..."
801-18 = "До следующей встречи, Сенсей."
801-19 = "У-Удачи, Сенсей!"
