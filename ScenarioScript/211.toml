[translation]
211-1 = "Судьба незаконченной истории о призраке"
211-2 = ""
211-3 = ""
211-4 = "Мне было весьма любопытно, какая заблудшая душа на этот раз забрела сюда... Должен сказать, вас я не ожидал."
211-5 = "...Ах, понятно. Теперь я понимаю."
211-6 = "Полагаю, учитывая то, как разворачиваются события..."
211-7 = "Что ж, наша встреча здесь — всего лишь следующий поворот страницы. И всё же она едва ли сравнится с легендами, рвущимися из собственных историй."
211-8 = "..."
211-9 = "...Хм? Вы не понимаете?"
211-10 = "Неужели вы не слышали? О шумных событиях вашего мира?"
211-11 = "Это история, разыгранная на радостной сцене фестиваля. Но «кошачья лапа» за кулисами организовала мрачный финал."
211-12 = "Она соткала историю из лжи и предательства, породив вместо неё рассказ о заброшенности и отчаявшейся душе, уставшей быть инструментом чужих целей."
211-13 = "Они создали Фантомную Сказку: Мёки Курокагэ."
211-14 = "Жалкая история о призраке, которой никогда не суждено получить завершение."
211-15 = "Даже сейчас её дух бродит и пылает на заброшенной территории фестиваля. Слышите её вопли скорби?"
211-17 = "Всё это родилось из приглушённого шёпота их историй, освещённых лишь одной свечой. Свечой, ведущей их сотню рассказов."
211-18 = "И потому, по прихоти самой судьбы, наша встреча, возможно, была неизбежна."
211-19 = "Сможет ли Сенсей из Шале наконец положить конец этой жалкой истории о призраке?"
211-20 = "Я буду наблюдать, как всегда. Хи-хи."
