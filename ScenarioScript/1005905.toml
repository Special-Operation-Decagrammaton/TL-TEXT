[translation]
1005905-1 = "Принцесса с чердака"
1005905-2 = "Я пришёл поздно — работа затянулась."
1005905-4 = ""
1005905-5 = "Ух ты! ☆ Сенсей!"
1005905-6 = "[s] «Прости, что так поздно. Долго ждала?»"
1005905-7 = "Мм? Нет-нет. Всё хорошо. Я знаю, что ты очень занят, Сенсей. А вот у меня в последнее время свободного времени полно."
1005905-8 = "[s] «Но что случилось, Мика?»"
1005905-9 = ""
1005905-11 = "Мм? Ну... Эм..."
1005905-12 = "На самом деле ничего не случилось..."
1005905-13 = "Просто подумала, что было бы здорово вместе выпить чаю и съесть десерт. Если ты не против, конечно."
1005905-14 = "Н-Но сегодня праздник, поэтому магазины закрываются раньше."
1005905-15 = "Уже так поздно, что я даже не уверена, осталось ли поблизости хоть что-нибудь открытым..."
1005905-16 = "Что же делать? Не хочу, чтобы ты зря проделал весь этот путь."
1005905-17 = "Но и отнимать у тебя ещё больше времени тоже не хочу, Сенсей. Может, тебе лучше вернуться в Шале?"
1005905-18 = "Наверное, тебе и так лучше, если люди не будут постоянно видеть тебя рядом с такой нарушительницей, как я..."
1005905-19 = "[s] «Да не переживай ты об этом.»"
1005905-20 = "Л-Ладно."
1005905-21 = "[s1] «Это я виноват, что опоздал.»\n[s2] «Может, найдём где-нибудь место посидеть?»"
1005905-24 = "Где-нибудь посидеть?"
1005905-25 = ""
1005905-27 = ""
1005905-28 = ""
1005905-29 = "Ты имеешь в виду... у меня в комнате?"
1005905-30 = "[s] «У тебя в комнате?»"
1005905-31 = "Да."
1005905-32 = "Я ничего такого не имею в виду! И это просто комната в общежитии, ничего особенного..."
1005905-33 = "Но поскольку сегодня праздник, отбой позже обычного."
1005905-34 = "И у меня есть рулетики и чай. Если честно, рулетики мне уже надоели, но скоро испортятся, так что..."
1005905-35 = "Вообще, можешь потом забрать их с собой, Сенсей! Всё лучше, чем выбрасывать еду!"
1005905-36 = "[s3] «(Не хочется снова отказывать Мике после такого доброго предложения...)»\n[s4] «Знаешь что? С удовольствием зайду и заберу рулеты.»"
1005905-39 = "А, да, я так и думала, что у тебя не очень много свободного времени."
1005905-40 = ""
1005905-42 = ""
1005905-43 = "Пойдём! Общежитие в эту сторону!"
1005905-44 = ""
1005905-46 = ""
1005905-52 = "[ns] «(Какое старое здание...)»"
1005905-53 = "Уныло выглядит, да? Здание старое, поэтому особой популярностью не пользуется. Здесь почти никто не живёт."
1005905-54 = "Уф! В прошлый раз я даже крысу здесь видела! Иногда начинаю скучать по тюремной камере, представляешь?"
1005905-55 = "[s] «Тебе, должно быть, тяжело.»"
1005905-56 = "Ахаха! ☆ Да нет, не всё так плохо. Управляющие здесь замечательные!"
1005905-57 = "В общем, моя комната на верхнем этаже, так что можем подняться по этой аварийной лестнице."
1005905-58 = "[s5] «Аварийная лестница не очень-то похожа на обычный путь...»\n[s6] «Мика, надеюсь, ты не единственная жильца во всём этом странном здании.»"
1005905-61 = "Не переживай. Просто у меня особый случай и довольно необычное прошлое."
1005905-62 = ""
1005905-64 = ""
1005905-65 = "Осторожнее. Лестница крутая."
1005905-73 = "Пришли! Комната в самом конце!"
1005905-74 = "[s] «Это же буквально чердак...»"
1005905-75 = "Ага..."
1005905-76 = "Да... Чердак..."
1005905-77 = ""
1005905-79 = ""
1005905-80 = ""
1005905-81 = "Так, посмотрим..."
1005905-82 = "Уже почти время..."
1005905-83 = ""
1005905-86 = "[ns] «Для чего?»"
1005905-87 = ""
1005905-90 = "Переклички!"
1005905-91 = "[ns] «?!?!»"
1005905-92 = "Главный вход закрывается! Никаких исключений! Каждый студент должен выстроиться перед дверью своей комнаты!"
1005905-93 = "Перекличка начнётся с верхнего этажа!"
1005905-94 = "О нет! Это совсем плохо, Сенсей. Проверяющая идёт сюда!"
1005905-95 = "[s] «М-Мика?!»"
1005905-96 = "Залезай в мою комнату и прячься под одеялом! Быстро! Если тебя здесь поймают, у тебя будут огромные неприятности!"
1005905-97 = "[s7] «А?!»\n[s8] Сделать, как сказала Мика."
1005905-98 = ""
1005905-100 = ""
1005905-105 = "Я едва успел нырнуть под одеяло, на которое указала Мика."
1005905-110 = "Мика? Что за шум? Что-то случилось?"
1005905-111 = "А? Нет. Ничего такого."
1005905-112 = "Мне показалось, будто я слышала, как ты с кем-то разговаривала..."
1005905-113 = "Ахаха! ☆ О чём ты? Здесь только я. Наверное, послышалось."
1005905-114 = ""
1005905-116 = ""
1005905-117 = ""
1005905-119 = "М-м... Отойди на минутку. Я хочу осмотреть комнату."
1005905-120 = "Эй! Ты мне не доверяешь?!"
1005905-121 = "Ну... ладно. Делай что хочешь."
1005905-123 = "Тогда прошу меня извинить."
1005905-124 = ""
1005905-128 = "[ns] «(...!)»"
1005905-129 = ""
1005905-133 = "..."
1005905-134 = "Хм... Похоже, мне и правда просто послышалось..."
1005905-135 = ""
1005905-140 = "Ладно, только не шуми, хорошо, Мика? Здание старое, стены здесь очень тонкие."
1005905-141 = "Отдохни как следует."
1005905-142 = "Конечно. Спасибо! ☆"
1005905-143 = ""
1005905-145 = ""
1005905-146 = "Ух ты. Получилось!"
1005905-147 = ""
1005905-152 = "Сенсей. Всё хорошо. Можешь вылезать."
1005905-153 = "[ns] «Мика! Ты—»"
1005905-156 = "― Тс-с-с!!!"
1005905-160 = "― ...Сенсей, я тебя обманула.[wa:1820]"
1005905-163 = "― Что же нам теперь делать?[wa:10]"
1005905-165 = "― Похоже, мы застряли здесь до самого утра."
1005905-168 = "― А ты так легко мне поверил.[wa:1750]"
1005905-170 = "― Правда, Сенсей... Я ведь говорила тебе...[wa:10]"
1005905-173 = "― столько раз, что мне нельзя доверять...[wa:2700]"
1005905-176 = "[ns] «Ты—»"
1005905-177 = "― Мм? Если ты сейчас поднимешь шум,[wa:1490]"
1005905-179 = "― все обо всём узнают. Ты точно этого хочешь?[wa:630]"
1005905-182 = "― Конечно, мне-то в любом случае всё равно.[wa:1520]"
1005905-185 = "[ns] «...»"
1005905-186 = "― Что?[wa:2000]"
1005905-188 = "― ...Ты ведь не злишься, правда?[wa:1440]"
1005905-191 = "― Ты уже должен меня знать."
1005905-193 = "― Ты ведь знал, что от меня одни проблемы, Сенсей. Разве нет...?[wa:10]"
1005905-196 = "[ns9] Не подыгрывать розыгрышу Мики.\n[ns10] «Зачем ты это сделала? Это уже не просто шутка.»"
1005905-197 = "― Эй...[wa:520]"
1005905-198 = "― Эй...[wa:520]"
1005905-200 = "― Я не хотела тебя расстраивать..."
1005905-203 = "― ...Мне не нравится, когда ты на меня злишься, Сенсей...[wa:3490]"
1005905-205 = "― Это была безобидная шутка.[wa:1530]"
1005905-208 = "― Всего на мгновение...[wa:350]"
1005905-210 = "― Я просто хотела провести с тобой ещё немного времени, Сенсей.[wa:1030]"
1005905-213 = "Мы дождались утра в комнате Мики, а мой поспешный уход оставил её немного растерянной."
1005905-214 = "Как только двери общежития открылись, мне удалось незаметно выскользнуть наружу."
