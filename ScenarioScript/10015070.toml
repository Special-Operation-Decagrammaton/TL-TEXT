[translation]
10015070-1 = "Эпизод 7;Спортивный праздник для всех"
10015070-2 = ""
10015070-7 = "Это Инженерный отдел. Мы сняли с робота-болельщика батарею и основные компоненты."
10015070-8 = "Мы наконец распутали всю проволоку. Осталось провести несколько тестов, и всё будет готово."
10015070-9 = "«Веритас» докладывает. Мы поймали виновниц саботажа фестиваля."
10015070-10 = "Правда, делать почти ничего не пришлось. После специальной тренировки Сумирэ они были не в состоянии двигаться."
10015070-11 = "Вообще-то, Сенсей, думаю, вам стоит с ними поговорить."
10015070-12 = ""
10015070-14 = ""
10015070-15 = "[ns] «Что случилось? Всё в порядке?»"
10015070-16 = "Хи-хи. Я рада, что мы закрыли это дело без серьёзных травм."
10015070-17 = "Хотя в бою мы всё-таки потеряли часть оборудования..."
10015070-18 = ""
10015070-20 = ""
10015070-22 = ""
10015070-23 = "Хотите сходить со мной навестить наших местных преступниц?"
10015070-25 = "Я... не могу поверить, что мы проиграли..."
10015070-26 = ""
10015070-27 = "Но мне всё равно! Антифестивальная группа никогда не сдастся!"
10015070-29 = "Пока я дышу, я буду продолжать пытаться сорвать спортивный фестиваль!"
10015070-30 = "Они и правда не сдаются, да? Если честно, я даже не понимаю, за что они борются."
10015070-31 = "Серьёзно! Просто сдавайтесь, пока всё не стало ещё хуже!"
10015070-33 = "Я предпочла бы не участвовать ни в каких... радикальных мерах прямо перед фестивалем. Но я не против."
10015070-34 = "Продолжите угрожать безопасности «Миллениума» — и мне придётся запереть вас до конца Фестиваля Хало."
10015070-35 = ""
10015070-39 = ""
10015070-40 = ""
10015070-41 = "[ns] «Дай мне минутку поговорить с ними, Чихиро.»"
10015070-43 = "Вы? Тот самый Сенсей из «Шале»?"
10015070-44 = "И что вы сделаете, а? Прочитаете нам нотацию?"
10015070-45 = "[s] «Я просто хочу знать... Почему вы так против этого события?»"
10015070-46 = "Потому что..."
10015070-47 = "Спорт — это не весело!"
10015070-49 = "С-с-спорт... не в-весёлый?!"
10015070-50 = "Я не... я не понимаю. Напряжение мышц, пот, стекающий по телу, приятное изнеможение после того, как довёл себя до предела... это разве... не весело?"
10015070-52 = "Ну конечно! Для спортивных людей вроде тебя всё звучит замечательно!"
10015070-53 = "Для таких нескоординированных и неспособных студентов, как мы, спортивный фестиваль — почти новый вид пытки!"
10015070-54 = "Ты знаешь, каково это — стать посмешищем всей школы из-за попытки сделать кувырок на гимнастике?"
10015070-55 = "Мне до сих пор снятся кошмары о том, как товарищи по команде смотрели на нас, если мы ошибались в командных играх."
10015070-56 = "Неужели не понимаешь? Такие никчёмные студенты, как мы, стоят на обочине, чтобы такие, как вы, могли над нами смеяться!"
10015070-57 = "Если уж нам и потеть, мы сами выберем, из-за чего!"
10015070-59 = "Физическая активность и спорт действительно часто связаны с командной работой."
10015070-60 = "Только не начинайте про уроки физкультуры. Я понимаю строгие правила и контроль ради предотвращения травм, но всегда их ненавидела."
10015070-62 = "Всё это понятно, но ваши страдания не дают права заставлять страдать других."
10015070-63 = "Вы знаете, сколько труда вложено в это мероприятие? Сколько студентов отмечали дни в календаре до Фестиваля Хало?"
10015070-64 = "Я знаю, мы зашли слишком далеко... но... но...!"
10015070-65 = ""
10015070-67 = ""
10015070-68 = "...Почему они должны были проводить его именно здесь?"
10015070-69 = "[s] «А что не так с тем, что принимает „Миллениум“?»"
10015070-70 = "Большинство студентов Научной школы «Миллениум» изучают, ну, науки..."
10015070-71 = "Мы здесь свои. Никто не издевается над нами за то, что мы неспортивные или слабые."
10015070-72 = "Но потом все начали говорить, что хотят заставить студентов «Миллениума» полюбить спорт!"
10015070-73 = "Таких, как мы, снова отодвинут в сторону! Я этого не хочу!"
10015070-74 = "Я не хочу возвращаться во времена средней школы."
10015070-76 = "Я бы хотела прояснить одно недоразумение."
10015070-77 = "Дело никогда не было в уровне ваших результатов или в том, кто победит, а кто проиграет."
10015070-78 = "У каждого человека своё телосложение, своя среда, свои способности. В том, чтобы отличаться от других, нет ничего постыдного."
10015070-79 = "Дух спорта — в преодолении собственных пределов! Дискриминация и издевательства из-за текущего уровня человека противоречат всему, во что мы верим!"
10015070-80 = "Это просто красивые слова, прикрывающие реальность рейтингов!"
10015070-84 = "У нас нет выносливости — на дорожке нас наверняка обгонят на круг. Нет координации — все увидят, как мы спотыкаемся о мяч."
10015070-85 = ""
10015070-88 = "С чего я должна делать вид, будто горжусь тем, что я хуже всех? Думаете, это приятно?"
10015070-89 = "Я больше не хочу быть посмешищем!"
10015070-91 = "Я... кажется, немного понимаю..."
10015070-92 = ""
10015070-96 = "[ns] «Ноа, уже слишком поздно менять соревнования?»"
10015070-97 = "Я бы не сказала, что обязательно слишком поздно..."
10015070-98 = "Что вы предлагаете?"
10015070-99 = "[s] «Например...»"
10015070-100 = ""
10015070-105 = "Любопытно. Вы хотите добавить элементы, которые не зависят от физической силы: например, роботизированные препятствия или логические задачи в эстафетах."
10015070-106 = "Предложение неплохое."
10015070-107 = "Это даст студентам с меньшими физическими возможностями шанс повлиять на исход соревнования и заодно добавит зрелищности для публики."
10015070-108 = "А по-моему, это просто ещё один способ продемонстрировать новейшие технологии «Миллениума»."
10015070-109 = ""
10015070-111 = ""
10015070-112 = ""
10015070-113 = ""
10015070-114 = "Предложение одобрено. Срочно закажем роботизированные препятствия и попросим Исполнительный комитет с пониманием отнестись к изменениям."
10015070-115 = ""
10015070-118 = ""
10015070-120 = "Также нужно будет ввести простой порядок, чтобы студенты могли в день соревнований поменять дисциплину, если захотят."
10015070-121 = "Кроме того, я создам консультационный отдел, который впредь будет собирать предложения студентов по таким мероприятиям."
10015070-122 = ""
10015070-124 = ""
10015070-125 = "Надеюсь, теперь вы чувствуете, что ваши потребности услышаны. Да?"
10015070-126 = "Е-если вы действительно сможете это сделать, у меня больше не останется претензий..."
10015070-127 = "Говорить-то легко, но церемония открытия уже завтра!"
10015070-128 = "Вы правда успеете воплотить все эти идеи к тому времени?"
10015070-129 = "Значит, мне просто придётся сделать так, чтобы успели."
10015070-130 = "Я уже говорила: Фестиваль Хало — объединяющее событие, созданное студентами для студентов. И я совершенно искренне говорю, что он предназначен для всех."
10015070-131 = "И вот я стою лицом к лицу с двумя студентами, которые чувствовали себя настолько забытыми, что решили бунтовать. Значит, я не справилась со своими обязанностями."
10015070-132 = "И в любом случае, разбирать недовольство студентов и выслушивать жалобы..."
10015070-133 = "...тоже входит в обязанности студсовета."
10015070-134 = ""
10015070-137 = ""
10015070-138 = ""
10015070-139 = ""
10015070-141 = ""
10015070-142 = ""
10015070-143 = ""
10015070-145 = ""
10015070-146 = ""
10015070-147 = ""
10015070-149 = ""
10015070-154 = "Е-если ещё не поздно... Можно я помогу с подготовкой?"
10015070-155 = "Пожалуйста! Я сделаю что угодно!"
10015070-156 = "Я хочу загладить неприятности, которые мы устроили."
10015070-157 = "Сделаю всё, что попросите, даже тяжёлую физическую работу!"
10015070-159 = "До такого доходить не нужно. Тяжёлую работу могут выполнить роботы."
10015070-160 = "Разумеется, роботы — специализация Инженерного отдела. Мы вмиг вернём робота-болельщика в строй."
10015070-162 = "Обязательства «Веритас» на этом заканчиваются. Но..."
10015070-163 = "...если мои очаровательные младшие заинтересованы в новых соревнованиях, я не могу просто сидеть сложа руки. Поможем чем сможем."
10015070-164 = "Я случайно выпила штук пять энергетиков. Спать не могу, а заняться всё равно нечем."
10015070-165 = "Если нужно делать компьютерные макросы — я в деле."
10015070-166 = "Хе-хе. Новым препятствиям понадобятся украшения и покраска!"
10015070-167 = "Пришёл мой звёздный час. Встречайте Маки-художницу!"
10015070-169 = "Тогда я, наверное, просто вернусь и переоденусь во что-нибудь удобнее перед ремонтом..."
10015070-170 = "Нет. Мы взяли на себя обязанность поддерживать спортсменок на фестивале, поэтому должны довести её до конца."
10015070-171 = ""
10015070-172 = "Ремонт оставьте Тандергану и вспомогательным роботам. А мы сосредоточимся на тренировке поддержки за оставшееся время!"
10015070-174 = "Поняла! У большинства наших роботов и так встроены функции саморемонта."
10015070-175 = "Немного подправим вспомогательных роботов, чтобы они могли помочь, отполируем программу саморемонта — и все проблемы решены!"
10015070-176 = "Н-но... разве не эффективнее было бы поручить поддержку роботам, пока мы занимаемся ремонтом...?"
10015070-177 = "Ты упускаешь главное, Хибики. Пользу поддержки нельзя измерять такими показателями."
10015070-178 = "Страсть и любовь, которые льются из криков живых людей, не заменит никакой ИИ!"
10015070-179 = "Ну да... Но костюмы всё равно сшиты ужасно, никто не захочет на них смотреть... и мы даже не успели потренироваться..."
10015070-180 = "Тогда начнём прямо сейчас."
10015070-181 = "И никто не станет оценивать вид стежка или качество ткани. Главное — искренность и забота."
10015070-182 = "Да! Поддержка должна идти от сердца! И вообще, мне очень нравятся костюмы, которые ты нам сделала, Хибики!"
10015070-183 = "Так что будем болеть от всей души!"
10015070-184 = "Я обо всём жалею... Не надо было делать эти костюмы для чирлидинга..."
10015070-192 = "Ноа, для чего эти мобильные устройства?"
10015070-193 = "О, эти? Просто старые неиспользуемые устройства. Я решила применить их повторно."
10015070-194 = "Отделите вычислительный модуль и подключите его к центральному ИИ, управляющему всем нашим оборудованием."
10015070-195 = "Времени на ремонт повреждённого вычислительного модуля или заказ нового не хватает... поэтому я пытаюсь синхронизировать старые модули для помощи в вычислениях. Пожалуйста, настройте набор команд."
10015070-196 = "Принято. Так мы сможем распределить процессы между несколькими модулями и компенсировать недостаток вычислительной мощности. Очень изящное решение."
10015070-198 = "Д-давай сильнее! П-побеждай...!"
10015070-199 = "Хибики, ты не читала книгу, которую я тебе дала? Нужно расслабиться! Глубоко вдохни и излучай уверенность!"
10015070-200 = "Подними руки вверх, будто тебе всё нипочём! Кричи речёвку во весь голос! Нет, погоди! Нельзя переставать двигаться, пока кричишь! Всё одновременно, Хибики."
10015070-201 = "Она уже сильно продвинулась."
10015070-202 = "Думаю, завтра всё пройдёт замечательно!"
10015070-204 = "Эй, през. Сигнализация во втором здании западного крыла недавно сработала."
10015070-205 = "Правда? Антифестивальная группа теперь на нашей стороне..."
10015070-206 = "Тогда кто это может быть?"
10015070-207 = "Хорошо. Включите усиленные меры безопасности в этом районе и записывайте происходящее. Сообщите мне сразу, как что-нибудь обнаружите."
10015070-208 = ""
10015070-214 = ""
10015070-215 = ""
10015070-216 = "О, Сенсей? Вы всё ещё здесь?"
10015070-217 = ""
10015070-219 = ""
10015070-220 = "День был долгий, уже поздно. Вам стоит отдохнуть, пока есть возможность."
10015070-221 = "Вы уже добрались сюда. Можете сегодня переночевать в комнате персонала, вместо того чтобы тащиться обратно в «Шале»."
10015070-222 = "[s1] «Спасибо за предложение. Но мне кажется, я должен сделать ещё больше.» \n[s2] «Мне неловко отдыхать, пока вы, студенты, работаете всю ночь.»"
10015070-225 = "Не нужно. Вы уже помогли нам неизмеримо много."
10015070-226 = "Пожалуйста, идите и отдохните перед завтрашней работой."
10015070-227 = ""
10015070-229 = ""
10015070-231 = ""
10015070-232 = ""
10015070-233 = ""
10015070-234 = ""
10015070-235 = ""
10015070-236 = ""
10015070-238 = "Знаете... Мне никогда раньше не доводилось работать с другими студентами в такой шумной и оживлённой атмосфере. Будто мы компания друзей, которые вместе не спят всю ночь."
10015070-239 = "Поэтому сегодня мне не будет скучно и компания не нужна."
10015070-240 = "К тому же у нас появились несколько незваных гостей..."
10015070-241 = "[s] «Но...»"
10015070-242 = "Ладно, ладно. Если переживаете, можете помочь — загляните к Юке. Она всё ещё спит в клубной комнате «Семинара»."
10015070-243 = "После заката стало прохладно. Не хочу, чтобы она простудилась."
10015070-244 = "А если после этого вы всё равно не собираетесь домой..."
10015070-245 = ""
10015070-247 = ""
10015070-249 = ""
10015070-250 = "Полагаю, скоро нам всем понадобится крепкая чашка кофе."
