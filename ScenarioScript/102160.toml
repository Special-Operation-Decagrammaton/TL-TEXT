[translation]
102160-1 = "Эпизод 16; Операция по обороне района — Миллениум"
102160-2 = "Теперь очередь Инженерного отдела."
102160-4 = "Это мы! Я готова настолько, насколько вообще могу быть."
102160-5 = "Вся моя тренировка не имеет смысла, если я не смогу защитить Миллениум сейчас."
102160-7 = "*вздыхает* ...Анализ материалов святилища... анализ данных... а теперь ещё и оборонительная операция... Хотела бы я, чтобы меня было десять..."
102160-8 = ""
102160-12 = ""
102160-14 = "...А? AMAS?"
102160-16 = "Привет, малыш! Ты пришёл нам помочь? Тебя прислала Веритас?"
102160-17 = "Что? Точно не мы. Президент Химари — единственная, кто достаточно хороша, чтобы взломать этих AMAS."
102160-18 = "Меня продолжают обвинять в том, чего я не делала... Тяжкая ноша гения..."
102160-19 = "Н-Ну, если это не вы, то кто? Н-Неужели... п-п-призрак?!"
102160-20 = ""
