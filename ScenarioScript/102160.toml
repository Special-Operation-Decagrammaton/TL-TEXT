102160-24 = "..."
102160-25 = "..."
102160-26 = "Ну, дарёному коню в зубы не смотрят. Сейчас нам нужна любая помощь."
102160-27 = "Химари права. Не отвлекаемся. Все готовы?"
102160-28 = ""
