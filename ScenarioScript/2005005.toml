[translation]
2005005-1 = "Я не справлюсь одна!"
2005005-2 = "Я спустился к главному входу здания."
2005005-3 = "Сенсей! Сюда!"
2005005-4 = "[s] «Привет, Рицу!»"
2005005-5 = "Сенсей, разве ты не говорил, что занят?"
2005005-6 = "[s1] «Рицу. Видишь ли, взрослые...»\n[s2] «...готовы ухватиться за любой повод сбежать от работы.»"
2005005-9 = "О! Я знаю, кто ты!"
2005005-10 = "Ты — «безнадёжный случай»."
2005005-11 = "[s] «Ты права, но слышать это больно!»"
2005005-12 = "Но главное ведь то, что ты пойдёшь со мной, да?"
2005005-13 = "В таком случае меня вполне устраивает, что ты «безнадёжный случай»."
2005005-14 = "Пойдём, Сенсей! Я знаю эту улицу вдоль и поперёк."
2005005-15 = ""
2005005-17 = ""
2005005-19 = "Рицу потащила меня в торговый квартал."
2005005-21 = "Квартал магазинов одежды"
2005005-22 = "Та-дам! Мы пришли, Сенсей!"
2005005-23 = "Повседневная одежда, деловой кэжуал, формальная — что угодно! Всё на одной улице!"
2005005-24 = "[s] «Я проходил здесь мимо, но никогда не заходил!»"
2005005-25 = "Видишь! Тут даже есть те прозрачные юбки и брюки, которые тебе нравятся! Прямо за углом!"
2005005-26 = "[s3] «Я не говорил, что мне такое нравится!»\n[s4] «Люди правда это покупают?»"
2005005-29 = "Если это тебе не нравится, тогда иди за мной. Сюда!"
2005005-30 = "Начнём с нормальной одежды по нормальным ценам, хорошо?"
2005005-31 = ""
