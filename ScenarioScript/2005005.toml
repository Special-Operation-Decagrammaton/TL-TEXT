2005005-34 = ""
2005005-35 = ""
2005005-36 = ""
2005005-38 = "Мы ходили по магазинам одежды."
2005005-39 = "Некоторые вещи, кажется, больше соответствовали вкусу самой Рицу..."
2005005-40 = "...но несколько приличных вариантов мы всё же нашли."
2005005-42 = "Вход на Чёрный рынок"
2005005-43 = "Хм, думаю, мы набрали неплохой набор."
2005005-44 = "Что думаете, Сенсей?"
2005005-45 = "[s] «Такое чувство, будто мой гардероб полностью обновился!»"
2005005-46 = "Хи-хи! Тогда хорошо, что мы выбрались."
2005005-47 = "Сенсей, можешь минутку подождать здесь?"
2005005-48 = "[s] «Пошла забирать контрабанду?»"
2005005-49 = ""
2005005-51 = ""
2005005-52 = "В точку. Ты всегда понимаешь, что к чему."
2005005-53 = "Я скоро вернусь."
2005005-54 = ""
2005005-56 = ""
2005005-58 = "[ns] «(Ну... Раз уж я здесь, можно осмотреться.)»"
2005005-60 = "[ns] «(Эта улица выглядит немного иначе...)»"
2005005-61 = ""
2005005-62 = "Хм? Добро пожаловать, приятель! Что ищешь?"
2005005-63 = "[s] «А, может быть, что-нибудь из верхней одежды?»"
2005005-64 = "Отлично! У нас как раз свежие поступления!"
2005005-65 = ""
2005005-67 = ""
2005005-68 = "Вот! Надень это! Будет смотреться отлично!"
2005005-69 = "[s] «Я вообще-то хотел сначала осмотреться...»"
2005005-70 = "Не-а, только время потратишь. Эта вещь будто для тебя создана! Посмотри мне в глаза и скажи, что не доверяешь моему вкусу!"
2005005-71 = "[s] «Я не... вижу ваших глаз?»"
2005005-72 = "Я говорю — примерь. Вот!"
2005005-73 = ""
2005005-76 = "Ого! Я так и знал! Идеально. Сам не считаешь?"
2005005-77 = "[s] «...Рукава немного длинные.»"
2005005-78 = "Не переживай! Рядом есть портной. Отличный мастер. Укоротим. Подожди минутку, ладно?"
2005005-79 = "[s] «Нет. Кажется, я это не хочу.»"
2005005-80 = "Знаешь, глупо сомневаться. Такая вещь редко попадается. Завтра её уже не будет."
2005005-81 = "Сенсей, что здесь происходит?"
2005005-82 = ""
2005005-84 = ""
2005005-85 = "О! С-Сестрёнка?!"
2005005-86 = "Что ты делаешь? Ты ведь не... снова пытаешься «дожать» покупателя, да?"
2005005-87 = "Нет! Я... просто предложил помочь найти варианты, которые лучше подойдут его фигуре... в следующий раз!"
2005005-88 = "Я так и думала. Отлично! Тогда Сенсея я забираю."
2005005-89 = "Прекрасно! Всего хорошего!"
2005005-93 = ""
2005005-94 = "Похоже, без меня тебе здесь и правда никак, да, Сенсей?"
