[translation]
2000703-1 = "Проблемы виртуального идола"
2000703-5 = "Комната ожидания амфитеатра"
2000703-7 = "(Когда я пришёл в комнату ожидания амфитеатра, Мику разговаривала с кем-то.)"
2000703-8 = ""
2000703-10 = ""
2000703-11 = "Что значит «ты не можешь петь»?!"
2000703-12 = "Как я и сказала. Я понятия не имею почему. Просто... не могу."
2000703-13 = "Почему ты не сказала мне раньше...? Что случилось?"
2000703-14 = "По какой-то причине каждый раз, когда я пытаюсь петь в новом теле, певческий голос просто не выходит."
2000703-15 = "Ух. Наверняка это проклятые техники. Они уверяли меня, что полностью уверены: у твоего тела не будет никаких отклонений..."
2000703-16 = "Мы не можем провести концерт с идолом, который не умеет петь. Дело плохо."
2000703-17 = "Полагаю, отложить выступление уже никак нельзя?"
2000703-18 = "Мы не можем этого сделать! Штраф за отмену будет астрономическим."
2000703-19 = "И это даже без учёта уже вложенных средств. Вся реклама, аренда амфитеатра, плюс затраты на исследования и разработку твоего нового тела."
2000703-20 = "Если отменить выступление, вернуть эти расходы будет невозможно."
2000703-21 = "Другого выхода нет. Ты обязана найти способ вернуть певческий голос!"
2000703-22 = "Есть..."
2000703-23 = ""
2000703-25 = ""
2000703-26 = ""
2000703-27 = "*вздыхает*"
2000703-28 = "[s] «Дела выглядят не очень хорошо.»"
2000703-30 = "О, Сенсей. Ты пришёл."
2000703-31 = "Почти жаль, что вы это увидели. Простите."
2000703-32 = "[s] «Это был организатор сцены?»"
2000703-33 = "Да. Он один из руководителей, ответственных за живое выступление."
2000703-34 = "Я делала всё возможное, чтобы скрывать тот факт, что не могу петь, пока мы не найдём выход..."
2000703-35 = "...но теперь всё раскрылось."
2000703-36 = "Похоже, надежды отложить или отменить выступление нет."
2000703-37 = "[s] «В таких мероприятиях задействовано очень многое.»"
2000703-38 = "Это правда. В конечном счёте ответственность лежит на мне."
2000703-39 = "Кроме того, если я отступлю сейчас, то нарушу обещание поклонникам, которые хотели услышать моё пение. Я не хочу этого."
2000703-40 = "[s1] «Не переживай слишком сильно.»\n[s2] «Уверен, скоро ты снова сможешь петь.»"
2000703-41 = "Спасибо, что подбадриваете меня."
2000703-42 = "Спасибо, что подбадриваете меня."
2000703-43 = "В любом случае, Сенсей, удалось ли вам найти какой-нибудь способ вернуть мне голос?"
2000703-44 = "[s] «Я кое-что принёс, чтобы начать.»"
2000703-45 = ""
2000703-47 = ""
2000703-48 = ""
2000703-51 = "Это... лук-порей?"
2000703-52 = "Вы слышали, что если обернуть луком-пореем шею человека, охрипшего из-за простуды, это может помочь ему восстановиться."
2000703-53 = "Я тоже что-то подобное слышала..."
2000703-54 = "...но сработает ли народное средство на мне? Я ведь всё ещё виртуальный идол."
2000703-55 = "[s] «Давай попробуем и узнаем.»"
2000703-56 = ""
2000703-58 = ""
2000703-59 = "Вы правы. В моём положении выбирать не приходится."
2000703-60 = ""
2000703-62 = ""
2000703-63 = ""
2000703-64 = ""
2000703-66 = "Хм-м. Горлу действительно стало теплее, когда я обернула шею луком-пореем."
2000703-67 = "Может, всё-таки сработает."
2000703-68 = "Хорошо! Сейчас попробую спеть!"
2000703-69 = ""
2000703-71 = ""
2000703-73 = ""
2000703-74 = "...Не получается."
2000703-75 = "Может, дело действительно в том, что я виртуальный идол. Лук тут ни при чём — он не виноват."
2000703-76 = "[s3] «Сдаваться ещё рано.»\n[s4] «На этот раз попробуем вот это!»"
2000703-79 = ""
2000703-81 = ""
2000703-82 = ""
2000703-85 = "Это энергетик?"
2000703-86 = "На этикетке нарисована какая-то странная птица."
2000703-87 = "[s5] «Он очень популярен среди некоторых студентов.»\n[s6] «Он окрыляет. Ну, как Пероро.»"
2000703-88 = "Хм... Не то чтобы я вам не доверяла, но звучит слишком хорошо, чтобы быть правдой. Обычный энергетик?"
2000703-89 = "Хм... Не то чтобы я вам не доверяла, но звучит слишком хорошо, чтобы быть правдой. Обычный энергетик?"
2000703-90 = "А вдруг от него горлу станет только хуже?"
2000703-91 = "С другой стороны, если есть хоть малейший шанс, что он поможет вернуть голос..."
2000703-92 = ""
2000703-94 = ""
2000703-95 = "...тогда я попробую!"
2000703-98 = "(Мы перепробовали все домашние средства, которые я принёс, но Мику так и не смогла снова запеть.)"
2000703-100 = "И это тоже не сработало."
2000703-101 = "[s] «Я был уверен, что мятно-шоколадное мороженое точно поможет...»"
2000703-102 = "Но это ведь было просто обычное мороженое?"
2000703-103 = "А предыдущий вариант с пирожными вообще заставил меня почувствовать себя на чаепитии."
2000703-104 = "Мы не продвинулись ни на шаг, но, честно говоря, мне очень весело."
2000703-105 = "Я так переживала из-за приближающегося концерта, что было приятно отвлечься от него и подумать о чём-то другом."
2000703-106 = "Даже не помню, когда в последний раз могла просто беззаботно подурачиться и повеселиться."
2000703-107 = "[s] «Подурачиться...»"
2000703-108 = "Я-Я не хотела принижать ваши старания, Сенсей!"
2000703-109 = "Просто меня создали для пения. Возможность улыбаться чему-то, не связанному с песнями, — совершенно новое чувство для такой, как я."
2000703-110 = "Мне было очень весело..."
2000703-111 = "[s] «Если тебе было весело, этого достаточно.»"
2000703-112 = "Вы правда так думаете?"
2000703-113 = "Спасибо, что снова помогали мне сегодня, Сенсей."
2000703-114 = ""
2000703-116 = ""
2000703-117 = ""
2000703-119 = "Надеюсь, мой голос скоро вернётся."
