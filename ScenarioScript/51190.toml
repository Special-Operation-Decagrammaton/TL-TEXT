[translation]
51190-1 = "Эпизод 19;Бард «Красоты природы» 1"
51190-4 = "Пламя пожирает улицы."
51190-5 = "Чудовища из ваших кошмаров нашли путь в реальность."
51190-7 = "Фестиваль начинается, когда ночное небо озаряется огнями."
51190-8 = ""
51190-12 = "И тогда мы восстанем."
51190-13 = ""
51190-18 = "Начинается."
51190-19 = "Пожалуйста, покажите для меня своё лучшее выступление."
51190-21 = "Спойте мне собственную историю о призраке."
51190-22 = ""
51190-37 = "[ns] «После всего этого... даже царапины нет.»"
51190-40 = "Как такое возможно? Оно жрёт наши пули, будто это такояки!"
51190-42 = "Ни один мой выстрел ничего не делает! Я настолько бездарна?!"
51190-43 = "Будто мы просто стреляем в воздух..."
51190-44 = "Оно действительно не из этого мира."
51190-46 = "...Это бесполезно. Всё бесполезно."
51190-47 = "[s] «...Нагуса?»"
51190-50 = "Ваши пули, как сказала Рэнгэ, для этого чудовища не опаснее такояки."
51190-51 = "Серьёзно?! Почему?"
51190-52 = "Мы бессильны против Фантомного сказания."
51190-53 = "Фантомные сказания происходят из тома под названием «Фантомные записи Ино», созданного «Красотой природы»."
51190-54 = "В призрака нельзя выстрелить."
51190-55 = "Ты сама себя слышишь? Это звучит совершенно безумно!"
51190-56 = "...Хотя, учитывая, что на этой штуке нет ни единой царапины, я не могу сказать, что это НЕправда. Но призраки?"
51190-58 = "Нагуса... Ты хочешь сказать, что мы вообще ничего не можем с ним сделать?"
51190-59 = "Совсем ничего?! Какой гадкий, подлый читер! Бу!"
51190-60 = ""
51190-63 = ""
51190-64 = "Я не говорила, что это невозможно."
51190-65 = "[s] «Не невозможно» уже лучше, чем ничего, Нагуса!"
51190-66 = "Для этого потребуется одобрение Великой Пророчицы Кузунохи. Полномочие президента. Только тогда можно преодолеть силу Фантомных сказаний."
51190-67 = "Президент Хяккарёран — единственный во всём Хяккияко, кто владеет Сотней Лотосов."
51190-68 = "[s] «(Почему мне кажется, что я уже слышал эту историю?)»"
51190-70 = "Это не что иное, как легендарное оружие, которым владела Великая Пророчица Кузуноха и которое способны носить лишь президенты Хяккарёран..."
51190-71 = "Легендарный заклинательный пистолет экзорциста!"
51190-73 = "Без Сотни Лотосов всё потеряно."
51190-74 = "Мы не можем просто позволить ему делать что вздумается. Другого варианта нет?"
51190-75 = "...Нет."
51190-76 = "Где и когда ты вообще всё это узнала, Нагуса?"
51190-77 = "Когда я была на Великом снежном поле..."
51190-78 = "Это история для другого раза."
51190-79 = "Нам нужно действовать быстро и начать эвакуацию. Свести ранения и ущерб к минимуму, насколько возможно."
51190-80 = "Я не... Мы не можем позволить истории повториться здесь."
51190-81 = ""
51190-83 = ""
51190-85 = "Ни за что! Ненавижу этот план!"
51190-86 = ""
51190-89 = ""
51190-90 = "Рэнгэ...?"
51190-91 = ""
51190-93 = ""
51190-95 = "Ты хочешь, чтобы я поджала хвост и сбежала? Как в тот день, когда небо стало красным?"
51190-96 = "Отказываюсь."
51190-97 = "Я больше не хочу быть такой."
51190-98 = "Я не хочу сдаваться ещё до того, как всё закончится. Не снова. Сейчас Хяккияко нуждается в нас как никогда!"
51190-99 = "[s] «Рэнгэ...»"
51190-100 = "Других вариантов нет? Ты ведь сама всё разложила по шагам."
51190-101 = "Нам нужна Сотня Лотосов? Полномочие президента? Разве передо мной сейчас не президент Хяккарёран?!"
51190-102 = ""
51190-104 = ""
51190-106 = ""
51190-107 = "А, ну, я... Моя правая рука..."
51190-108 = "Я просто... не могу."
51190-109 = ""
51190-111 = ""
51190-113 = "Я передала Полномочие Кикё."
51190-114 = "...Но в любом случае это ничего бы не изменило."
51190-115 = "С Полномочием или без него — я не могу."
51190-116 = "Почему нет? Я не понимаю."
51190-117 = ""
51190-119 = ""
51190-120 = ""
51190-121 = "Я... Я никогда не стану Аямэ."
51190-122 = ""
51190-126 = "Ха-ха-ха! Вот уж действительно правда!"
51190-127 = "Более того, ты знаешь это лучше кого-либо во всём огромном мире."
51190-128 = ""
51190-130 = ""
51190-131 = "...Кто это был?"
51190-132 = ""
51190-134 = ""
51190-137 = ""
51190-138 = "Хи-хи! Хи-хи-хи. Нагуса права, хочет она того или нет."
51190-139 = "Вы и пальцем не сможете тронуть моего драгоценного Курокагэ — лучшее из Фантомных сказаний. Он родился из «Фантомных записей Ино», созданных лично мной."
51190-140 = "Если, конечно, Аямэ не явится сюда со своим Полномочием, по праву полученным от Великой Пророчицы."
51190-141 = ""
51190-144 = ""
51190-146 = "Но этого не случится, правда ведь, Нагуса?"
51190-147 = "Что ты натворила? Зачем ты здесь?"
51190-148 = "...Ябуки Сюро."
51190-149 = "[s] «Это та девушка из „Красоты природы“, с которой я разговаривал.»"
51190-150 = "Ха-ха-ха! Боже мой. Нагуса И Сенсей из Шале меня запомнили! Какая честь!"
51190-151 = "Правда, Сенсей, я так благодарна, что вы сегодня здесь."
51190-152 = "Что вы стали свидетелем моей истории."
51190-153 = "Ну что, как вам пока?"
51190-154 = "Нравятся истории о призраках, которые я подготовила для Фестиваля фонарей?"
51190-155 = ""
51190-158 = ""
51190-159 = "Ты хочешь сказать... чудовища, все эти разрушения..."
51190-160 = "Это всё твоих рук дело?"
51190-161 = "А?! Не может быть! Она же такая маленькая и милая!"
51190-162 = "[ns] «Это ты призвала всех этих чудовищ?»"
51190-164 = "Ха-ха-ха! Как же мне нравятся эти выражения на ваших лицах. Вы правда меня ненавидите, да?"
51190-165 = "Обожаю, обожаю, обожаю то, как вы, герои, себя ведёте! Серьёзно, покажите ещё!"
51190-167 = "Ответь на вопрос, пока я не разрубила тебя пополам!"
51190-169 = "Хи-хи-хи. Мне нравится оставаться целой, так что так и быть, отвечу."
51190-170 = "Позвольте представиться."
51190-171 = "Я Сюро!"
51190-172 = "И да, именно я призвала Фантомные сказания в этот мир."
51190-173 = "Я бард «Красоты природы», Ябуки Сюро. Запомните моё имя, хорошо?"
51190-174 = "[s] «Бард...?»"
51190-175 = "Ха. Ха-ха-ха! Какие же милые лица вы умеете строить."
51190-176 = "Это выражение будто говорит: «Я тупица! Я ничего не понимаю!»"
51190-177 = "А может, оно говорит: «Я тебя ненавижу. Ненавижу. Ненавижу. Ненавижу. Ненавижу.»"
51190-178 = "Хи-хи-хи. Дайте мне как следует этим насладиться."
51190-179 = "...Но ничьё выражение не сравнится с твоим, Нагуса. Ничьё."
51190-180 = ""
51190-183 = ""
51190-185 = "Скучала по мне? Такое чувство, будто с нашей встречи на Великом снежном поле прошла тысяча лет."
51190-186 = "Я ждала и ждала, надеясь, что ты вернёшься поиграть со мной. Представляешь, что я почувствовала, узнав, что вместо этого ты пришла сюда!"
51190-187 = "Ах, ах. Ты права. А что ещё сделала бы такая глупая, бесполезная и жалкая неудачница, как ты?"
51190-188 = "Может, неудачники вообще не способны испытывать стыд."
51190-189 = "Ты даже Хяккарёран нормально бросить не можешь. Убегаешь, возвращаешься, убегаешь, возвращаешься."
51190-190 = "Я бы сказала, что разочарована, но ты даже этого не стоишь."
51190-191 = "Не смей так говорить о Нагусе, мелкая бесовка."
51190-192 = "А-а? Если ты всё ещё её защищаешь, тогда..."
51190-193 = "Ха-ха-ха! Секретики дружбе не помогают, Нагуса!"
51190-194 = ""
51190-196 = ""
51190-198 = "Ты только и умеешь что лгать?"
51190-200 = "...Заткнись."
51190-202 = "Ха! Ха-ха-ха! Это слишком хорошо!"
51190-203 = "Ты носишь форму Хяккарёран, притворяешься президентом Хяккарёран и без стыда врёшь каждому члену Хяккарёран!"
51190-204 = "Но мне ты соврать не можешь, правда, Нагуса?"
51190-205 = "Ты врёшь, врёшь и врёшь, а Хяккарёран и Сенсей всё это покорно проглатывают."
51190-207 = "Хватит..."
51190-209 = "Я не знаю, кем ты себя возомнила..."
51190-210 = "Но заткнись уже со своим бредом!"
51190-212 = "Бредом? Как грубо... Даже Нагуса знает, что это не бред."
51190-213 = "Я даже проявлю доброту и помогу Нагусе. Хотите узнать все её секреты?"
51190-214 = "Только запомните: правду вам наконец рассказала я, а не ваша драгоценная Нагуса."
51190-215 = "Я сказала, прекрати..."
51190-216 = "Прекратить? Но госпожа «Сила есть — ума не надо» вон там хочет узнать, что я имею в виду."
51190-217 = "Уж ты-то знаешь: честные вопросы заслуживают честных ответов. Иначе ты плохой человек! Правда?"
51190-218 = "Так и быть, проявлю великодушие и отвечу."
51190-219 = ""
51190-221 = ""
51190-222 = "Нагуса как заезженная пластинка. Снова и снова несёт одно и то же."
51190-224 = "«Я никогда не буду достаточно хороша, чтобы стать президентом Хяккарёран.»"
51190-225 = ""
51190-227 = ""
51190-228 = "«Я не Аямэ», и «Только Аямэ заслужила Полномочие.»"
51190-229 = "Тебе самой от себя не надоело? Аямэ то, Аямэ это! Бу-ху, Аямэ куда лучше меня!"
51190-230 = "Я сказала прекратить!"
51190-231 = "Хахаха."
51190-232 = "Да у тебя наглости хоть отбавляй!"
51190-233 = ""
51190-235 = ""
51190-237 = "[log][ff4444]Лгунья.[-][/log]"
51190-240 = "[log][ff4444]Дело никогда не было в Аямэ.[-][/log]"
51190-243 = ""
51190-244 = ""
51190-246 = "Не потому же всё это, что ты считала Аямэ та-а-акой великой, правда?"
51190-247 = "Ты разводишь руками и продолжаешь лгать, будто ничего нельзя было поделать."
51190-248 = "Тебе стыдно? Неловко? Боишься, что потеряешь всех, если скажешь правду?"
51190-249 = "Страшно! Так, так страшно быть честной, правда?"
51190-250 = "[s] «Чего ей бояться?»"
51190-251 = "Потому что! Лжецы всегда боятся, что их разоблачат!"
51190-252 = "Позвольте показать вам настоящую Нагусу. Уродливую, неуверенную Нагусу, от которой она всё это время убегала."
51190-253 = "От меня и моего тома ничего не скрыть."
51190-254 = ""
51190-256 = ""
51190-258 = "Что...?!"
51190-259 = ""
51190-273 = "Можешь поверить? Похоже, президент Аямэ и правда исчезла."
51190-274 = "(Шёпот. Слухи.)"
51190-275 = "У нас нет президента. Кто поведёт Хяккарёран?"
51190-276 = ""
51190-281 = "(Молва разносится быстро.)"
51190-282 = "Нагуса все эти годы поддерживала Аямэ. Она столько сделала для Хяккарёран."
51190-284 = "Всё будет хорошо."
51190-285 = ""
51190-288 = "(Их голоса наполняются ожиданием.)"
51190-289 = ""
51190-291 = ""
51190-292 = ""
51190-294 = ""
51190-295 = "Нет... Не будет."
51190-296 = "(Как я могла сказать такое?)"
51190-298 = ""
51190-299 = "Я не могу так с ними поступить."
51190-300 = ""
51190-304 = "(Мне не хватит сил нести этот крест.)"
51190-305 = "Я не могу..."
51190-306 = ""
51190-309 = "Потому что тогда они наконец увидят, какая я на самом деле."
51190-310 = "Увидят, что я всего лишь самозванка."
51190-311 = "Я никогда не заслуживала места рядом с Аямэ."
51190-313 = ""
51190-314 = "Мне не хватает всего. По сравнению с Аямэ я бесполезна."
51190-315 = "В Хяккарёран никогда не вступал более отвратительный и ужасный человек."
51190-316 = "Я цеплялась за Аямэ, надеясь, что её пламя осветит и меня в выгодном свете."
51190-317 = ""
51190-318 = "Когда Аямэ не станет, моя истинная сущность раскроется."
51190-319 = "Самозванка. Мошенница. Все узнают."
51190-320 = ""
51190-321 = "Чем дольше я останусь здесь без Аямэ, тем сильнее будет гнить их представление обо мне."
51190-322 = "Я уже слышу их смех. Их насмешки."
51190-324 = ""
51190-325 = "Страшно..."
51190-326 = "Мне так страшно, что меня увидят настоящей."
51190-327 = "Я должна защитить себя. Пока с меня не содрали кожу и не раскрыли меня..."
51190-329 = "[log]Мне нужно сбежать.[/log]"
51190-332 = ""
51190-333 = "К-Кто-нибудь ещё это видел?"
51190-334 = "Да. Мы все это видели."
51190-335 = "Это было... из прошлого?"
51190-336 = "[s] «Больше, чем воспоминание — это были её чувства...»"
51190-338 = "Это ведь было ненастоящим, да? Н-Нагуса? Не может быть."
51190-339 = ""
51190-341 = ""
51190-342 = ""
51190-344 = "Ха-ха-ха! Расскажите мне, что вы сейчас чувствуете, во всех подробностях."
51190-345 = "Я хочу знать, каково это — узнать, что человек, которым ты восхищался, был всего лишь мошенником."
51190-346 = "Но больше всего ты..."
51190-347 = ""
51190-349 = ""
51190-350 = "Особенно ты, прячущаяся в переулке."
51190-351 = "Я хочу услышать тебя — одновременно её самого сурового критика и самого преданного сторонника. Каково смотреть, как она рушится у тебя на глазах?"
51190-352 = ""
51190-354 = ""
51190-356 = ""
51190-357 = "[ns] «Кикё! Ты всё это время была здесь?»"
51190-358 = "Да. Похоже, улицы заполнил ужас, который следовало искоренить."
51190-359 = "Поэтому я пришла разобраться... и обнаружила совсем другое."
51190-360 = "То... что нас заставили увидеть."
51190-361 = "...!"
51190-362 = "Это твои мысли, Нагуса? Твои настоящие мотивы?"
51190-363 = "Кикё, пожалуйста. Я..."
51190-365 = "Ха-ха-ха! Да, вот так. Всё правда, Кикё."
51190-366 = "Разве ты не чувствуешь себя преданной? Вы все смотрели на неё с восхищением в глазах, а внутри она была всего лишь прогнившей старой трусихой."
51190-367 = "Ты поверила ей, когда она сказала, что не сможет заменить Аямэ? Когда уверяла, что недостойна?"
51190-368 = "Дура! Она боялась, что чем дольше пробудет президентом, тем больше кусочков её тщательно выстроенного образа разлетится вдребезги."
51190-369 = "Эта трусливая, бесстыжая идиотка должна была быть вашим президентом?! Всё, что её волновало, — хорошо выглядеть в глазах драгоценной подруги детства. После исчезновения Аямэ она едва продержалась пять минут."
51190-370 = "А теперь посмотрите на неё — бежит, бежит, снова бежит. Как всегда."
51190-372 = "Вот почему ты всё бросила? Вот в чём причина твоего предательства?"
51190-373 = "Нагуса... Я не... понимаю..."
51190-374 = ""
51190-377 = ""
51190-378 = "Пожалуйста! Кикё! Рэнгэ!"
51190-379 = "Я никогда не хотела... Я просто..."
51190-381 = "Ложь, ложь, ложь."
51190-382 = "Тебе никогда не надоедает лгать?"
51190-383 = "Скажи прямо. «Я боялась, что меня отвергнут», или, может быть, «Я не хотела, чтобы вы узнали, какая я бесхребетная и ужасная.»"
51190-384 = "Прими это. Я хочу услышать, как ты сама это скажешь. Признайся, что ты грязная трусиха!"
51190-385 = "...Ничего? Серьёзно?"
51190-386 = "Ты мне отвратительна."
51190-388 = "Это не... Я...!"
51190-389 = "Я-я... Я просто думала, что без меня все смогут..."
51190-391 = "Ты..."
51190-392 = "Горё Нагуса. Ты..."
51190-393 = ""
51190-395 = ""
51190-396 = "Я..."
51190-397 = "Всё было не так... Это было ради Аямэ..."
51190-398 = "Я просто хотела вернуть Аямэ..."
51190-400 = "Ха-ха-ха! Аха-ха-ха! Это слишком хорошо."
51190-401 = "Да, да! Расскажи им всё. Выпусти наружу все спрятанные обиды, гнев и чувство предательства!"
51190-402 = "Вырви своё сердце наружу."
51190-403 = "Друг станет врагом, а любовь превратится в ненависть."
51190-404 = "Пусть яд направляет твой язык, а ваши связи рассыплются в пыль."
51190-405 = "Мы уничтожаем истории, в которые вы верили! А из пепла родятся новые, построенные на слухах и заблуждениях."
51190-406 = "Вот кульминация моей пьесы."
51190-407 = "Весь мой труд... Мои планы...!"
51190-408 = "Наконец-то вы все расцветёте моей утончённостью!"
51190-409 = ""
51190-412 = "[ns] «Цубаки!»"
51190-413 = "Поняла."
51190-414 = ""
51190-416 = ""
51190-418 = ""
51190-420 = "Следующий эпизод;Бард «Красоты природы» 2"
