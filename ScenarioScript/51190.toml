[translation]
51190-1 = "Episódio 19;A Contadora de Contos Macabros do Clube Beleza da Natureza (1)"
51190-4 = "Chamas ardentes — montanhas de escombros."
51190-5 = "Espíritos e demônios — marchando pelas ruas."
51190-7 = "Ao som que anuncia o início do festival —"
51190-12 = "— Eu irei visitá-las."
51190-18 = "— Então... finalmente começou."
51190-19 = "Vamos, mostrem-me."
51190-21 = "O \"Hyakumonogatari\" que vocês tecem —"
51190-37 = "[ns] \"Mesmo depois de todos esses ataques... não tem nem um arranhão...\""
51190-40 = "O que é essa coisa...?!#nMeus ataques nem fazem efeito!"
51190-42 = "Buaaaá! Tem alguma coisa muito estranha!!#nNão importa o quanto eu atire, parece que nada acerta!"
51190-43 = "Parece que passa direto através dele, né~"
51190-44 = "Sim... É como se estivéssemos enfrentando uma miragem..."
51190-46 = "...É inútil."
51190-47 = "[s] \"...Nagusa?\""
51190-50 = "Ataques comuns não funcionam contra aquilo."
51190-51 = "Hã?! Por que não?!"
51190-52 = "...Porque aquilo é o \"Hyakumonogatari Fantasmagórico\"."
51190-53 = "Um \"conto macabro\" criado pelo Clube Beleza da Natureza a partir do livro macabro \"Inou Mononokeroku\"."
51190-54 = "Por isso, balas comuns não surtem efeito contra ele."
51190-55 = "Você joga uma história dessas do nada e quer que eu acredite assim, na lata...?"
51190-56 = "Bem... na prática as balas não estão funcionando mesmo, então não tenho escolha a não ser acreditar...!"
51190-58 = "Hm... Se o que a Nagusa-san diz for verdade... quer dizer que não há como derrotá-lo?"
51190-59 = "Nada funciona nele?! Isso é apelação pura! Que injustiça!!"
51190-64 = "Não é... que não exista uma forma de derrotá-lo."
51190-65 = "[s] \"E qual é essa forma?\""
51190-66 = "A única capaz de derrotar um \"conto macabro\" nascido do livro macabro...#né aquela reconhecida pela Grande Profetisa Kuzunoha —"
51190-67 = "Ou seja, apenas a Presidente da Hyakkaryouran que empunha a \"Prova\"."
51190-68 = "[s] (Eu já ouvi algo parecido... em algum lugar...)"
51190-70 = "Passada adiante pela Grande Profetisa Kuzunoha, algo que apenas as Presidentes de cada geração podem empunhar..."
51190-71 = "É a \"arma capaz de capturar fantasmas\", ora pois!"
51190-73 = "A Prova — \"Hyakuren\" — sem ela, não é possível fazer nem um arranhão no Hyakumonogatari Fantasmagórico."
51190-74 = "Então não há nada que possamos fazer...?"
51190-75 = "...Sim. Não podemos fazer nada."
51190-76 = "...Como você sabe disso, Nagusa-senpai?"
51190-77 = "Eu... na Grande Planície Nevada..."
51190-78 = "...Não, não é nada."
51190-79 = "Vamos fugir logo... Se continuarmos aqui, vai ser tarde demais."
51190-80 = "Antes que isso aconteça... antes que se repita o que houve naquela vez, rápido —"
51190-85 = "Mesmo assim, eu não vou aceitar deixar as coisas assim!"
51190-90 = "Renge-chan?"
51190-95 = "Você está me dizendo pra ficar parada só assistindo de braços cruzados... igual daquela vez?"
51190-96 = "Nem pensar que eu vou fazer isso!"
51190-97 = "Nunca mais..."
51190-98 = "Eu odeio não poder fazer nada quando alguém pede ajuda...#nNão quero desistir achando que \"esse é o nosso limite\"!"
51190-99 = "[s] \"Renge...\""
51190-100 = "Nagusa-senpai, você disse que quem possui a Prova pode derrotar aquela coisa, não disse?"
51190-101 = "Então você consegue, não consegue, Nagusa-senpai?!#nVocê é a Presidente Interina da Hyakkaryouran, afinal!"
51190-107 = "Não, eu... eu não...#nO meu braço direito já..."
51190-108 = "Eu... não consigo."
51190-113 = "Não consigo. Eu não tenho mais a \"Prova\", deixei com a Kikyou..."
51190-114 = "Não... mesmo que eu ainda estivesse com ela..."
51190-115 = "Eu não conseguiria."
51190-116 = "Por... por quê...?"
51190-121 = "Porque eu... não sou a Ayame."
51190-126 = "Ahahahahaha!"
51190-127 = "Você entende muito bem, né?"
51190-131 = "...Quem está aí?"
51190-138 = "Ihih, ihihihi...! Certa resposta, acertou na mosca~!!#nÉ exatamente como a Nagusa-chan disse!"
51190-139 = "Aquilo ali — \"Kurokage\", do Hyakumonogatari Fantasmagórico — é um conto macabro nascido do livro macabro \"Inou Mononokeroku\".#nVocês não vão conseguir fazer nem um arranhãozinho no Kurokage, sabia~?"
51190-140 = "...A menos que sejam a \"Ayame\", que herdou a Prova da Grande Profetisa, né?"
51190-146 = "Não é mesmo~? Afinal, você conhece essa pessoa muito bem, não conhece?#nNé, Nagusa-chan?"
51190-147 = "Por que... como você está aqui...?"
51190-148 = "Yabuki... Shuro."
51190-149 = "[s] \"Do Clube Beleza da Natureza...\""
51190-150 = "Ora, ora, ora~ Que felicidade! Tanto a Nagusa-chan quanto o Sensei de Schale... lembram de mim? Estou tão emocionada~!"
51190-151 = "E mais, e mais, deixe-me agradecer, Sensei.#nPor ter me acompanhado até aqui..."
51190-152 = "E por ter escutado a minha história direitinho~."
51190-153 = "Ora bem, ora bem, o que acharam~?"
51190-154 = "O \"conto macabro\" que eu preparei para vocês... foi do seu agrado~?"
51190-159 = "...Não me diga que toda essa confusão...!"
51190-160 = "Foi obra sua?!"
51190-161 = "Hã?! É sério?!#nFoi ela...?!"
51190-162 = "[ns] \"A responsável por invocar o monstro...\""
51190-164 = "Ahaha! Que hostilidade fresquinha, chega a dar arrepios na pele! Cautela — e raiva."
51190-165 = "Eu adorei, adorei de montão~!!#nSim, sério mesmo... demais!"
51190-167 = "Responde à minha pergunta!"
51190-169 = "Sim, sim~. Se é uma pergunta sua, é claro que vou responder."
51190-170 = "Permita-me me apresentar formalmente mais uma vez~."
51190-171 = "Eu sou Shuro —"
51190-172 = "Como deduziram tão brilhantemente, fui eu quem invocou o Hyakumonogatari Fantasmagórico aqui —"
51190-173 = "— A Contadora de Contos Macabros do Clube Beleza da Natureza... Yabuki Shuro, ao seu dispor~. Muito prazer em conhecê-las."
51190-174 = "[s] \"'Contadora de Contos Macabros'...?\""
51190-175 = "Aha... Ahaha!#nEssa cara de novo~?"
51190-176 = "Essa cara de boba de quem não entende uma palavra e não faz ideia do que está acontecendo."
51190-177 = "Ahaha! Não entende nada, mas a hostilidade já está lá em cima..."
51190-178 = "Eu gosto disso, gosto muito disso~!#nAdoro essa expressão no seu rosto... É irresistível."
51190-179 = "...Mas a minha favorita mesmo é~... Aha!#nÉ você, Nagusa-chan~."
51190-185 = "Não nos vemos desde a Grande Planície Nevada, né~?#nQuanto tempo faz desde então? ...Ihih."
51190-186 = "Eu fiquei me perguntando para onde você tinha fugido... jamais imaginaria que seria para Hyakkiyako."
51190-187 = "Bem, no estado patético em que você ficou, imagino que esse fosse mesmo o único lugar para onde voltar, né~?"
51190-188 = "Mas ainda assim~ — não acha que é muita cara de pau?"
51190-189 = "Você nem queria voltar para a Hyakkaryouran, queria?#nSó pensava em fugir, fugir e fugir de lá... desesperadamente."
51190-190 = "Sinceramente... você não tem vergonha na cara mesmo, né~?"
51190-191 = "Do que você está falando...?"
51190-192 = "Uééé~?#nNão me diga que vocês não sabiam?"
51190-193 = "Nagusa-chan, você ainda estava escondendo isso delas~?"
51190-198 = "Ainda está contando \"mentiras\"?"
51190-200 = ".........!"
51190-202 = "Ahahaha!!"
51190-203 = "A Nagusa-chan ainda carrega o título da \"Hyakkaryouran\" e posa de Presidente Interina, né? Escondendo quem realmente é..."
51190-204 = "Eu sei de tudo sobre o quanto a Nagusa-chan é cara de pau e sem vergonha~..."
51190-205 = "E ninguém aqui sabia de nada~?"
51190-207 = "Pa... para..."
51190-209 = "Não sei quem você é, mas..."
51190-210 = "Já chega de zombar da Hyakkaryouran."
51190-212 = "Que crueldade~! Eu nem estou zombando... né, Nagusa-chan?"
51190-213 = "Quer que eu conte no seu lugar? Eu não me importo nem um pouquinho, viu~?"
51190-214 = "Pela tímida Nagusa-chan~...#nContar a verdade que você nunca teve coragem de dizer em voz alta é moleza para mim~!"
51190-215 = "Para..."
51190-216 = "De jeito nenhum~#nAfinal, foi ela quem perguntou, não foi~?"
51190-217 = "A gente tem que responder às perguntas direitinho, né~? Quem não faz isso nunca vira uma pessoa respeitável, sabia~? Eu adoro responder perguntas~."
51190-218 = "Então~... eu vou contar para vocês."
51190-222 = "A Nagusa-chan sempre dizia isso antes:"
51190-224 = "\"Eu não posso ser a Presidente da Hyakkaryouran.\""
51190-228 = "\"Porque eu não sou a Ayame.\" \"Eu não tenho o direito de ocupar esse lugar sem ser a Ayame.\""
51190-229 = "Ayame, Ayame, Ayame...!#nSó dando desculpas usando o nome da Ayame~."
51190-230 = "Já chega, para...!"
51190-231 = "Ahahaha."
51190-232 = "Francamente —"
51190-237 = "[log][ff4444]<MENTIRA>[-][/log]"
51190-240 = "[log][ff4444]<Você nunca pensou nisso de verdade>[-][/log]"
51190-246 = "Na verdade, o motivo nunca foi esse, foi?"
51190-247 = "Você enche a boca com palavras bonitas, mas~... é tudo mentira, não é~?"
51190-248 = "Você tem vergonha demais para contar para elas, não tem?"
51190-249 = "Afinal... dizer a verdade dá muito medo!"
51190-250 = "[s] \"Medo...?\""
51190-251 = "Sim. Ela morre de medo de que todas descubram, a Nagusa-chan~."
51190-252 = "Então esses sentimentos feios no fundo do coração da Nagusa-chan..."
51190-253 = "Eu vou mostrar para vocês com o meu \"livro macabro\"~."
51190-258 = "...!"
51190-273 = "Ei, você soube? Dizem que a Presidente Ayame desapareceu."
51190-274 = "(Todas dizem)"
51190-275 = "O que vai ser da Hyakkaryouran agora? O posto de Presidente vai ficar vago, não vai?"
51190-281 = "(Todas comentam)"
51190-282 = "Mesmo sem a Ayame-senpai, a Nagusa-senpai, amiga de infância dela e igualmente brilhante, ficou conosco!"
51190-284 = "Então vai ficar tudo bem!"
51190-288 = "(Vozes cheias de expectativa ecoam)"
51190-295 = "<Não é isso>"
51190-296 = "(Estes são os verdadeiros sentimentos que nunca pude expressar)"
51190-299 = "...Eu não consigo."
51190-304 = "(Para mim, que fui deixada para trás, esta arma é pesada demais)"
51190-305 = "Porque... eu..."
51190-309 = "Desse jeito, vão descobrir quem eu sou de verdade."
51190-310 = "Eu só estava fingindo ser a Vice-Presidente da Hyakkaryouran."
51190-311 = "Sem talento nem habilidade, eu apenas ficava ao lado da Ayame..."
51190-314 = "Eu não tenho nenhuma qualidade."
51190-315 = "Sou sem graça e patética."
51190-316 = "Eu, que não sei fazer nada e só me contentava em ficar ao lado da Ayame —"
51190-318 = "— Todas vão descobrir."
51190-319 = "Que eu só estava ali por acaso —"
51190-321 = "Que eu me escondi na sombra da Ayame e fugi."
51190-322 = "Todas vão apontar para mim e se decepcionar."
51190-325 = "— Que medo."
51190-326 = "Tenho medo de que descubram a verdade."
51190-327 = "Antes que descubram a verdade —"
51190-329 = "[log]— Preciso fugir.[/log]"
51190-333 = "Eita! Que coisa estranha foi essa que passou voando agora...?!!"
51190-334 = "Nós vimos, né."
51190-335 = "O que foi aquilo...?"
51190-336 = "[s] \"Uma cena... do passado...?\""
51190-338 = "Isso... era da Nagusa-senpai...?"
51190-344 = "E aí, e aí? Qual é a sensação~?"
51190-345 = "Como se sente depois de espiar o coração da veterana que tanto admirava...? Por favor, compartilhe suas impressões comigo~!"
51190-346 = "Isso mesmo..."
51190-350 = "Você aí nesse canto, você mesma."
51190-351 = "Conte para mim o que sentiu ao ver os verdadeiros pensamentos da veterana que você tanto cobrou~!"
51190-357 = "[ns] \"Kikyou...!\""
51190-358 = "Só fiquei curiosa com a confusão e vim dar uma olhada."
51190-359 = "Era só isso... que eu pretendia fazer."
51190-360 = "...Aquilo agora."
51190-361 = "...!"
51190-362 = "Aquilo... era o que a Nagusa-senpai realmente pensava?"
51190-363 = "Kikyou, eu..."
51190-365 = "Ahaha! Isso mesmo~, isso mesmo~!"
51190-366 = "Aqueles eram os verdadeiros sentimentos da Nagusa-chan. A verdadeira face — da veterana que toda a Hyakkaryouran admirava."
51190-367 = "Francamente... \"tem que ser a Ayame\", \"eu não consigo porque não sou a Ayame\"... ela só dava essas desculpas."
51190-368 = "Mas na verdade era tudo mentira!"
51190-369 = "Bastava fingir estar à altura da amiga de infância.#nA verdadeira face dela é a de uma tola que não dava a mínima para mais ninguém além da amiga de infância~."
51190-370 = "Por isso a Nagusa-chan... está tentando fugir de vocês.#nPorque não quer que se decepcionem com ela!"
51190-372 = "Foi por um motivo desses... que você se afastou de nós?"
51190-373 = "Nagusa-senpai..."
51190-378 = "Kikyou, Renge... não é isso...!"
51190-379 = "No começo, não era minha intenção... Eu só...!"
51190-381 = "Ora, ora~? Ainda vai tentar arrumar desculpas~?"
51190-382 = "Você sempre foi esse tipo de pessoa desde o início, não foi?"
51190-383 = "Só tinha medo de que descobrissem o quanto você é patética."
51190-384 = "Você jogou tudo para o alto achando que era melhor fugir do que ser julgada... e ainda não consegue admitir~?"
51190-385 = "Sério... Nagusa-chan, você é..."
51190-386 = "Nojenta, sabia~?"
51190-388 = "E-Eu...!"
51190-389 = "Eu... eu só queria... para todas...!"
51190-391 = "Senpai..."
51190-392 = "Goryou Nagusa... você..."
51190-396 = "Não..."
51190-397 = "Não é isso... A Ayame..."
51190-398 = "Eu só queria... pela Ayame...!"
51190-400 = "Aha, ahaha!"
51190-401 = "A~ah... Olha só, se despedaçaram todinhas, né~?"
51190-402 = "Aha... Que se quebre tudo, tu~dinho mesmo."
51190-403 = "Isso, xinguem, ataquem e briguem umas com as outras..."
51190-404 = "Machuquem-se com palavras~... escondam o que sentem atrás de mentiras..."
51190-405 = "Joguem a verdade fora, toda despedaçada#n— e vamos transformar a verdade e a mentira em um \"conto macabro\", sim~?"
51190-406 = "Assim..."
51190-407 = "Vocês finalmente vão...!"
51190-408 = "Se tornar o verdadeiro \"requinte\" que eu pinto —"
51190-412 = "[ns] \"Tsubaki!\""
51190-413 = "Sim, pode deixar comigo, Sensei."
51190-420 = "Próximo;A Contadora de Contos Macabros do Clube Beleza da Natureza (2)"
