[translation]
1015403-1 = "The Collector's Dilemma"
1015403-2 = "(You headed to the Wild Hunt Art Council room to meet Manami.)"
1015403-7 = "Thank you for coming."
1015403-8 = "I appreciate you taking the time."
1015403-9 = "[s1] \"Just you, Manami?\"\n[s2] \"Where are the other members?\""
1015403-12 = "They are not here. This is a personal matter. Regarding the 'art exhibition' I mentioned earlier—"
1015403-13 = "It concerns my 'private museum'."
1015403-14 = "As you know, I house various works of art in my private museum."
1015403-15 = "However, I have recently run into a major problem."
1015403-16 = "My collection just keeps growing."
1015403-17 = "I have finally run out of display space!"
1015403-21 = "At first, I considered storing them in the academy's archives."
1015403-22 = "However, the Council rejected it, stating that personal items cannot be kept there."
1015403-24 = "Next, I tried to renovate the attic."
1015403-25 = "But that was also rejected in the meeting, as it would cost more than the projected budget."
1015403-27 = "I could use my authority to override their objections."
1015403-28 = "But I have no intention of giving the opposition an excuse to criticize me."
1015403-29 = "[s] \"The opposition...?\""
1015403-30 = "Yes. A 'shadow organization' within this academy that keeps me in check."
1015403-31 = "I have yet to grasp the scale of their influence or who their leader is."
1015403-32 = "However, I believe they are related to the cat burglar I am currently pursuing."
1015403-33 = "Some members say it's just my imagination, but..."
1015403-34 = "I know better."
1015403-35 = "Those vermin, scurrying unpleasantly through the darkness and sullying the academy—"
1015403-36 = "Once I catch them, I shall sentence them to a lifetime of eating insect jelly."
1015403-39 = "...Oh, excuse me. That was a bit harsh."
1015403-40 = "Regardless, I cannot use the academy's archives or renovate buildings for my own convenience."
1015403-41 = "If only there were an infinite space to store my collection..."
1015403-42 = "Sensei, do you have any good ideas?"
1015403-43 = "[s3] \"If you're short on space...\"\n[s4] \"Why not sell or give away some of the collection?\""
1015403-46 = "Excuse me?"
1015403-47 = "Are you serious?"
1015403-48 = "[s] \"...Ah, I guess that's a no!\""
1015403-49 = "Naturally. My feelings are poured into every single piece; giving them to others is out of the question."
1015403-50 = "The most I am willing to concede is to temporarily borrow a space managed by someone I trust."
1015403-51 = "[s5] \"Then, how about Schale?\"\n[s6] \"Should I keep them for you?\""
1015403-54 = "Schale..."
1015403-57 = "Hmm."
1015403-58 = "Thank you for the offer. But it is difficult to answer immediately."
1015403-59 = "If it is not too much trouble, may I visit Schale right now?"
1015403-60 = "I would like to confirm if it is a suitable place to house my collection."
1015403-61 = "[s] \"R-right now...?\""
1015403-62 = "Yes, right now."
1015403-64 = "(In the end, you were pressured by Manami and returned to Schale together.)"
1015403-73 = "[ns] \"Welcome! This is the office!\""
1015403-74 = "Oh..."
1015403-75 = "...Hmm? You don't mean to suggest I should store my collection here, do you?"
1015403-76 = "[s] \"There's some empty space, and I thought it would be fine...\""
1015403-77 = "Haaah..."
1015403-78 = "There are four major elements to be mindful of when storing art."
1015403-79 = "If you are making this suggestion without knowing that, I must seriously reconsider our cooperative relationship."
1015403-80 = "[s7] \"Four major elements!?\"\n[s8] \"Is it... dust?\""
1015403-83 = "...I thought as much."
1015403-84 = "Temperature, humidity, light, and pollution prevention. These are the four major elements to be aware of when storing art."
1015403-85 = "There is too much light coming in here; managing the illuminance seems difficult."
1015403-86 = "If I were to place figures here, they would discolor due to UV rays, ruining their value."
1015403-87 = "[s] \"I see...\""
1015403-90 = "[ns9] \"Wait, what? Figures?\"\n[ns10] \"Your collection is figures?\""
1015403-93 = "Not entirely, but it is a fact that they are included. Figures are fine works of art, too."
1015403-94 = "Looking at a figure evokes feelings for the work you love—"
1015403-95 = "This is the very art of sensation itself."
1015403-96 = "Don't tell me... you don't understand?"
1015403-97 = "[s] \"That's not true! I understand!\""
1015403-98 = "That is good to hear."
1015403-99 = "Now that you understand the important elements for storage, let's look elsewhere."
1015403-100 = "I hope there is a place here more worthy of discussion."
1015403-102 = "(And so, you toured Schale with Manami.)"
1015403-111 = "(...However, you couldn't find a place that Manami liked.)"
1015403-112 = "(The last place was—)"
1015403-114 = "[ns] \"H-how about here?\""
1015403-115 = "Oh, and this is...?"
1015403-120 = "It is a bit cluttered, but... it is a fine room."
1015403-121 = "It seems to have been designed to store something from the start."
1015403-122 = "A structure that allows for sealing, lighting with adjustable intensity—"
1015403-123 = "Plus, it has temperature and humidity control."
1015403-124 = "This passes the test."
1015403-125 = "[s] \"Th-thank goodness...\""
1015403-126 = "Then, I shall borrow a portion of this space."
1015403-127 = "Thank you for your cooperation."
1015403-129 = "(And the next day...)"
1015403-140 = "(Under Manami's direction, a temporary storage room was created.)"
1015403-143 = "Council President! The work is complete!"
1015403-144 = "Yes, thank you all for your hard work."
1015403-145 = "As promised, I shall issue special exit permits."
1015403-146 = "Thank you!"
1015403-148 = "I will transport the items to be stored myself."
1015403-149 = "Each one is a precious work, so the utmost care is required."
1015403-150 = "I cannot carry much at once, so I will be visiting Schale many times..."
1015403-151 = "You understand, don't you, Sensei?"
1015403-152 = "[s] \"U-uh, yeah... no problem.\""
1015403-153 = "Consider it an honor to be entrusted with my precious art."
1015403-154 = "I am quite selective about who I choose, after all."
1015403-155 = "[s] \"But are you really sure about this place?\""
1015403-156 = "Did I not say it passed the test?"
1015403-157 = "Besides, this gives me a reason to come to Schale whenever I like."
1015403-158 = "Securing a place for my beloved art and shortening the distance to Schale will also lead to strengthening my power within the academy. This is truly killing two birds with one stone."
1015403-159 = "Fufu, Sensei. Just watch."
1015403-160 = "Someday, I will catch all the forces that resist me and sentence them to a lifetime of eating natto."
1015403-161 = "[s] (Could it be that was her goal from the start...?)"
1015403-164 = "Come to think of it, we haven't discussed your reward."
1015403-165 = "As the Council President of Wild Hunt, I cannot simply borrow Schale for free."
1015403-166 = "Come now, tell me your wish. I shall grant you anything you desire."
1015403-167 = "It would be preferable if it were something I could handle internally, though..."
1015403-172 = "Take this opportunity to unleash it. The wish hidden in your heart, Sensei."
1015403-173 = "I have the authority to grant such wishes, after all."
1015403-174 = "[s] \"I don't have any wishes like that!\""
1015403-175 = "Fufu, it seems you aren't mentally prepared yet."
1015403-180 = "I am not in a hurry, so please let me know whenever you are ready."
1015403-181 = "Until we meet again."
1015403-183 = "(For a while after that, Manami's visits to Schale continued.)"
1015403-184 = "(You can't help but feel used... but as long as you stay strong, it should be fine.)"
