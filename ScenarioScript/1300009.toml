[translation]
1300009-1 = "Золотой полдень"
1300009-2 = "Исполнительный офис Шале"
1300009-4 = "..."
1300009-5 = "..."
1300009-6 = ""
1300009-7 = ""
1300009-8 = "О, Господин. Какое совпадение."
1300009-9 = "[s1] «Ты заставила меня работать весь день!»\n[s2] «Ты сама меня позвала. Не назвал бы это совпадением.»"
1300009-10 = "Не будем переживать из-за мелочей."
1300009-11 = "Не будем переживать из-за мелочей."
1300009-12 = "Но ты прав: назвать это совпадением сложно."
1300009-13 = "Скорее судьба."
1300009-14 = "..."
1300009-15 = "Хи-хи. Не нужно смущаться."
1300009-16 = "Я... позволила себе подготовить награду за помощь в прошлой миссии."
1300009-20 = "Некий жилой дом"
1300009-22 = ""
1300009-23 = ""
1300009-24 = ""
1300009-25 = "Хм. Здесь чище, чем я ожидала."
1300009-26 = "Этот дом? Я подготовила его заранее."
1300009-27 = "Подожди здесь немного."
1300009-28 = "Обещай, что не придёшь, пока я не позову, хорошо?"
1300009-29 = "Почему бы тебе пока не прилечь? Наверняка устал после работы."
1300009-30 = ""
1300009-31 = "..."
1300009-34 = "Господин."
1300009-35 = "Господин, просыпайся."
1300009-38 = "[ns3] Встать и подойти.\n[ns4] Поспать ещё немного..."
1300009-40 = "..."
1300009-41 = "*шуршание* *шуршание*"
1300009-42 = "...?"
1300009-43 = "Что-то вкусно пахнет."
1300009-44 = "..."
1300009-45 = "*шуршание* *шуршание*"
1300009-46 = "...?"
1300009-47 = "Что-то вкусно пахнет."
1300009-48 = "*шорох*"
1300009-50 = "Проснулся."
1300009-51 = "Хи-хи. Не ожидала, что ты и правда уснёшь."
1300009-52 = "Ну что, тогда начнём? Кхм."
1300009-55 = "― О, ты дома.[wa:800]"
1300009-57 = "― Как прошёл день?[wa:1040]"
1300009-60 = "― О, Господин. Нам как раз привезли чайные листья высшего сорта.[wa:1820]"
1300009-62 = "― Налить тебе чашку?[wa:1480]"
1300009-65 = "― Что? Это не наш дом?[wa:2020]"
1300009-68 = "― Ха-ха. Не говори глупостей. Неважно, где находится наш дом...[wa:2180]"
1300009-70 = "― ...пока сейчас мы вместе."
1300009-73 = "Ну как? Тебе понравился мой маленький подарок?"
1300009-74 = "Мурокаса Аканэ из C&C всегда будет рядом, чтобы служить тебе, Господин."
