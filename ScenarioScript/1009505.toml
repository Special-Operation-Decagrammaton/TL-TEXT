[translation]
1009505-1 = "Пожалуйста, не забывайте о горничной, Сенсей"
1009505-2 = "Если подумать, у нас большая проблема!"
1009505-3 = "[s] «Что вдруг случилось, Мидори?!»"
1009505-4 = "Я ведь согласилась стать вашей личной горничной, чтобы помочь с концепт-артом для игры про горничную, верно?"
1009505-5 = "Но если задуматься..."
1009505-7 = ""
1009505-8 = ""
1009505-10 = ""
1009505-11 = ""
1009505-13 = ""
1009505-14 = ""
1009505-16 = ""
1009505-17 = "Кажется, всё это время я просто веселилась вместе с вами!"
1009505-18 = "[s1] «Да ничего, ничего...»\n[s2] «Ученикам положено веселиться, пока они растут...»"
1009505-21 = "Да, но ученикам ещё и учиться положено!"
1009505-22 = "[s3] «Ничего себе, слышать такое от тебя...»\n[s4] «Я так горжусь, что чуть не плачу...»"
1009505-25 = ""
1009505-27 = ""
1009505-28 = "В любом случае так продолжаться не может."
1009505-29 = "Пусть хотя бы сегодня, но я должна как следует выполнить обязанности горничной!"
1009505-30 = "Сенсей! Вы сейчас идёте в Шале, да? Возьмите меня с собой!"
1009505-31 = "[s] «Мидори? Не тяни меня так! Мидори?!»"
1009505-33 = ""
1009505-34 = "Кстати, Сенсей, вы знаете, какие вообще бывают виды горничных?"
1009505-35 = "[s] «Совсем нет.»"
1009505-36 = "Понятно!"
1009505-37 = "Хм-м... Для начала, самой уважаемой должностью была личная горничная хозяйки."
1009505-38 = "В её основные обязанности входили уход за гардеробом и аксессуарами, а также помощь с переодеванием и макияжем."
1009505-39 = "Хозяйка дома нанимала такую горничную лично, и подчинялась та непосредственно ей."
1009505-40 = "Экономка тоже занимала очень высокое положение."
1009505-41 = "Если точнее, экономка даже не считалась горничной. Это была скорее управляющая должность, отвечавшая за домашнее хозяйство."
1009505-42 = "Она была главным управляющим: руководила остальной прислугой, включая горничных, и занималась кадровыми вопросами."
1009505-43 = "[s] «Ого! Я столько всего узнаю...!»"
1009505-44 = "Ступенью ниже находилась домашняя горничная."
1009505-45 = "В основном она отвечала за уборку и порядок в комнатах."
1009505-46 = "Ещё была детская горничная, присматривавшая за детьми, и кухонная горничная, которая, очевидно, помогала на кухне."
1009505-47 = "Также были прачка, отвечавшая за стирку, и горничная по комнатам, выполнявшая более общие обязанности."
1009505-48 = "Так что существовало множество разных должностей горничных, но..."
1009505-49 = "...самой распространённой была «горничная на все руки.»"
1009505-50 = "Одна горничная, которая самостоятельно выполняла всю работу."
1009505-51 = "Большинство семей просто не могли позволить себе больше одной горничной."
1009505-52 = "[s] «Ты правда отлично разбираешься!»"
1009505-53 = "Конечно! Перед тем как рисовать иллюстрации, я всегда всё тщательно изучаю."
1009505-54 = ""
1009505-56 = ""
1009505-60 = "Так что повторюсь: пусть хотя бы на один день, но я твёрдо намерена стать настоящей горничной!"
1009505-61 = "Оставьте всю работу Шале мне!"
1009505-63 = "И так начался энергичный однодневный опыт Мидори в роли горничной..."
1009505-64 = ""
1009505-65 = "Самая базовая обязанность горничной — конечно же, уборка!"
1009505-66 = ""
1009505-68 = ""
1009505-69 = "В углу этого кабинета столько пыли..."
1009505-70 = "В таких местах пыль обычно и скапливается, потому что туда редко добираются во время уборки."
1009505-71 = "Если честно, в клубной комнате Отдела разработки игр обычно всё примерно так же..."
1009505-72 = "Не волнуйтесь, Сенсей! Я вычищу всё так, что вам придётся смотреть под ноги, чтобы не поскользнуться!"
1009505-73 = "[s] «Но помещение ведь должно оставаться безопасным?»"
1009505-75 = ""
1009505-76 = "Следующая задача — помощь с едой!"
1009505-77 = "Хотя в нашем случае это, если честно, в основном уборка мусора после еды навынос..."
1009505-78 = "И раз уж об этом заговорили — посмотрите, сколько тут старых контейнеров."
1009505-79 = "Сначала я займусь сортировкой для переработки."
1009505-80 = "[s] «Теперь мне даже стыдно...»"
1009505-81 = "Всё в порядке. В конце концов, я горничная."
1009505-83 = ""
1009505-84 = "...Полагаю, помогать вам одеваться — тоже часть обязанностей горничной, верно?"
1009505-85 = "[s5] «Эм... Мидори? Мисс Мидори...?»\n[s6] «Что-то в твоём настрое сегодня необычное...?»"
1009505-88 = "Всё хорошо, Сенсей. Предоставьте мне всё — и физически, и морально."
1009505-89 = ""
1009505-91 = ""
1009505-95 = "Ваш наряд немного растрепался. Позвольте мне привести его в порядок."
1009505-96 = ""
1009505-98 = ""
1009505-99 = ""
1009505-100 = "Вот, готово. Может, ещё принести вам зеркало?"
1009505-102 = ""
1009505-103 = "Мытьё посуды — ещё одна важная обязанность горничной!"
1009505-104 = ""
1009505-106 = ""
1009505-107 = "...И это приводит нас к этой горе накопившихся кружек."
1009505-108 = "[s] «Мне просто... прости. Правда, прости...»"
1009505-109 = "Всё в порядке. В конце концов, я горничная."
1009505-110 = "[s] «Разве ты уже не говорила это...?»"
1009505-111 = "Да. И хотелось бы, чтобы мне не приходилось повторять это так часто."
1009505-119 = ""
1009505-120 = "Сегодня был очень полезный день!"
1009505-121 = "Мне почти кажется... что я могла бы навсегда остаться вашей горничной..."
1009505-122 = "[s] «Эм, хм... Нет, это, пожалуй, будет немного сложно...»"
1009505-124 = "[ns] «Ты набралась достаточно опыта горничной для своей игры?»"
1009505-125 = "А?"
1009505-126 = ""
1009505-128 = ""
1009505-129 = "О!"
1009505-130 = "Я совсем забыла..."
1009505-131 = "Я так сосредоточилась на всех обязанностях, что вообще об этом не думала... Как вы считаете, это был полезный опыт?"
1009505-132 = "Я благодарна вам за поддержку, но..."
1009505-133 = "Н-Ну тогда! В качестве последней просьбы..."
1009505-134 = "...можно попросить вас ещё об одной... услуге?"
1009505-135 = "[s] «О какой услуге?»"
1009505-136 = "Эм, понимаете...!"
1009505-137 = "..."
1009505-138 = "Не знаю, пригодится ли мне это когда-нибудь, но..."
1009505-139 = "Я хочу сделать концептуальный снимок себя в образе горничной..."
1009505-140 = "Так что... если вы не против..."
1009505-141 = "Я надеялась, что вы сможете меня сфотографировать...!"
1009505-146 = "Обсудив с Мидори постановку и контекст концептуального снимка, я стал искать в Шале подходящее место."
1009505-147 = "Идея Мидори для сцены была такой..."
1009505-151 = "― [log=미도리 메이드]Мне... жаль... Хозяин![/log][wa:3510]"
1009505-152 = "― [log=미도리 메이드]Я... я снова ошиблась и... упала...[/log][wa:4620]"
1009505-155 = "― [log=미도리 메이드]Но... не беспокойтесь обо мне. Можете отчитать меня как пожелаете, Хозяин...[/log][wa:2770]"
1009505-156 = "― [log=미도리 메이드]Что бы ни было... я приму это...[/log][wa:4110]"
1009505-159 = "― [log=미도리 메이드]Что... скажете?[/log][wa:1670]"
1009505-162 = "[ns] «Мне кажется, нам правда не стоит этого делать!»"
1009505-163 = "― [log=미도리 메이드]Н-Но... именно такая у нас сцена![/log][wa:1660]"
1009505-164 = "― [log=미도리 메이드]Я ведь сама попросила вас... сделать это...[/log][wa:5620]"
1009505-167 = "― [log=미도리 메이드]Эм, Сенсей?[/log][wa:3130]"
1009505-168 = "― [log=미도리 메이드]Вас... удовлетворил сегодняшний опыт Мидори в роли горничной?[/log][wa:3580]"
1009505-171 = "*вздох* Я чувствую себя... на удивление бодро."
1009505-172 = "Спасибо, Сенсей. Вы хорошо потрудились."
1009505-173 = ""
1009505-176 = "А? Что это за взгляд?"
1009505-177 = "[s] «Ничего. Просто считаю простые числа.»"
1009505-178 = "Неужели...?"
1009505-179 = "...Хи-хи."
1009505-180 = "Сенсей, я приложу все силы к этой иллюстрации."
1009505-181 = "И если вы не против..."
1009505-182 = "Я бы очень хотела показать готовую работу вам раньше всех. Можно?"
1009505-183 = "[s] «Конечно. Не могу дождаться.»"
1009505-184 = "Есть, сэр!"
