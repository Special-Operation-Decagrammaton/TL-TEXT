[translation]
1000902-1 = "Пик наслаждения"
1000902-2 = "Спортивная площадка Геенны 19"
1000902-3 = "Я пришёл туда, где Изуми хотела встретиться."
1000902-4 = "Сенсей! Сюда!"
1000902-5 = "[s1] «Я пришёл, как и обещал, но...»\n[s2] «Так с чем ты сегодня экспериментируешь?»"
1000902-8 = ""
1000902-9 = ""
1000902-10 = "Вот, Сенсей. Эту книгу я читала вчера. Там я нашла кое-что потрясающее."
1000902-11 = "[s3] «Я тренируюсь, следовательно, ем...?»\n[s4] «Очень прямолинейное название.»"
1000902-12 = "Ага, увидев название, я сразу поняла, что должна прочитать её целиком. И проглотила книгу как в трансе."
1000902-13 = "Ага, увидев название, я сразу поняла, что должна прочитать её целиком. И проглотила книгу как в трансе."
1000902-14 = "[s] «Как в трансе, значит...»"
1000902-15 = "Дай прочитаю тебе самое главное место, Сенсей!"
1000902-16 = "В книге написано..."
1000902-17 = "«Как триатлонист, который интенсивно тренируется, я очень люблю поесть.»"
1000902-18 = "«В мире существует бесчисленное множество деликатесов, но один я ставлю выше всех остальных.»"
1000902-19 = "«Это тонкоцу-рамен быстрого приготовления от Митошин.»"
1000902-20 = "«Вкус тонкоцу-рамена всегда особенно хорош после ежедневной тренировки: двадцати километров бега, двухсот приседаний и ста колёс.»"
1000902-21 = "«В каком-то смысле его вкус кажется куда насыщеннее любого деликатеса в мире...»"
1000902-22 = "(пускает слюни)"
1000902-23 = "[s] «Эй, Изуми...?»"
1000902-24 = "Это..."
1000902-25 = "Вот оно, Сенсей!"
1000902-26 = "Если верить книге, вкус тонкоцу-рамена после такой тренировки должен быть..."
1000902-27 = "...райским опытом, с которым не сравнится никакая другая еда на земле!"
1000902-28 = "[s] «Думаю, автор немного преувеличивал...»"
1000902-29 = "Я приготовила тонкоцу-рамен, чтобы проверить самой! Взяла две порции, чтобы и тебе досталось, Сенсей."
1000902-30 = "[s] «Я так и знал! Вот что ты собралась испытывать!»"
1000902-31 = "Не волнуйся, клубничное желе сверху я тоже не забыла!"
1000902-32 = "[s] «Иного от тебя и не ожидал, Изуми!»"
1000902-33 = "Подумать только, возможно, есть способ сделать еду невероятно вкусной без дорогих ингредиентов и сложных рецептов..."
1000902-34 = "Мы обязаны попробовать, Сенсей!"
1000902-35 = "Отлично! Начинаем тренировку, Сенсей!"
1000902-36 = "[s] «У-У-у...»"
1000902-38 = "Так началась моя адская тренировка с Изуми..."
1000902-40 = ""
1000902-41 = ""
1000902-42 = ""
1000902-43 = ""
1000902-45 = "Раз! Два! Три! Четыре!"
1000902-46 = "Готово! Теперь твоя очередь, Сенсей!"
1000902-47 = "[s] «М-м!»"
1000902-49 = "Дальше прыжок в длину, Сенсей!"
1000902-50 = ""
1000902-51 = "Раз, два...!"
1000902-52 = "...Хья!"
1000902-54 = ""
1000902-55 = ""
1000902-56 = ""
1000902-57 = "Хорошо, Сенсей, теперь ты!"
1000902-58 = "[s] «М-м-м-м-м!»"
1000902-61 = "(Спринты, приседания, марафон, пресс, растяжка спина к спине...)"
1000902-62 = "(За два часа мы с Изуми выполнили все упражнения из книги.)"
1000902-65 = "[ns] *тяжело дышит* *тяжело дышит*"
1000902-66 = "Фух! Хорошо поработали! Отличное чувство!"
1000902-67 = "Хм? Что такое, Сенсей?"
1000902-68 = "[s] «*тяжело дышит* *тяжело дышит* Фух...»"
1000902-69 = "(тык) Сенсей?"
1000902-70 = "[s] «Это ведь всё... да?»"
1000902-73 = "(буль-буль)"
1000902-74 = "[s] «Даже горелки уже готовы. Ты основательно подготовилась.»"
1000902-75 = "Конечно! Это же ради моего эксперимента."
1000902-76 = ""
1000902-77 = "*щелчок*"
1000902-78 = "Теперь заливаем Митошин горячей водой... Добавляем немного клубничного джема и перемешиваем... Три минуты! Ещё совсем чуть-чуть!"
1000902-79 = ""
1000902-80 = "(наливает жидкость)"
1000902-81 = ""
1000902-82 = ""
1000902-83 = "Ну же, ну же..."
1000902-84 = "Готово, Сенсей!"
1000902-85 = "[s] «Посмотрим...»"
1000902-86 = ""
1000902-87 = "*кусь* *ням-ням* *жуй-жуй*"
1000902-88 = "...!"
1000902-89 = "Эй! И-и-и!"
1000902-90 = "[s5] «Изуми, ты в порядке?!»\n[s6] «Вкусно? Изуми?!»"
1000902-91 = "...Обычный вкус."
1000902-92 = "...Обычный вкус."
1000902-93 = "[s] «Обычный?»"
1000902-94 = "Просто обычный вкус, Сенсей. Как у самого обыкновенного стаканчика тонкоцу-рамена!"
1000902-95 = "То есть вкусно! Но не настолько, как я представляла..."
1000902-96 = "Я не драматизирую, просто..."
1000902-97 = "[s] «Ну, и тренировка была довольно обычной.»"
1000902-98 = "Но в книге всё было написано. Может, книга ошибается? Нет. Может быть, дело в том, что..."
1000902-99 = "...У каждого человека своя тренировка, после которой еда кажется вкуснее?"
1000902-100 = "[s] «...»"
1000902-101 = "Надо это изучить, Сенсей..."
1000902-102 = "Как член Общества гурманов, я никогда не перестану изучать вкусную еду! ...Хотя этого, наверное, мало. Нужно ещё больше?"
1000902-103 = "[s7] «Конечно.»\n[s8] «Я поддержу тебя, Изуми!»"
1000902-104 = "Ура!"
1000902-105 = "Ура!"
1000902-108 = "(У меня не хватило духу сказать ей, что еда обычно вкуснее, когда ты просто голоден.)"
