[translation]
10029075-1 = "Эпизод 7;Величайшая ментальная способность Академия-Сити"
10029075-6 = "Ч-Что?! Кто эти люди?!"
10029075-7 = "Откуда они взялись? И почему они все дерутся друг с другом?!"
10029075-8 = "Г-Где мы? Как мы сюда попали?!"
10029075-9 = "Перекрыть территорию!"
10029075-10 = "Сначала нейтрализовать всех остальных, а потом разберёмся, что это за место!"
10029075-12 = "Р-Руины Миллениума? Почему мы здесь?!"
10029075-13 = "...! Ты...!!"
10029075-14 = "...? Это ЧВК Кайзера..."
10029075-15 = "Я не совсем понимаю происходящее, но совпадением это быть не может. Уберите их!"
10029075-16 = "Приготовиться к бою!!"
10029075-18 = "Не связывайтесь с нами! Оружие наготове, девочки! Разберёмся, где мы, после того как уложим этих людей!"
10029075-19 = ""
10029075-21 = ""
10029075-24 = "Э-Эти ребята..."
10029075-25 = "Они тоже из другого мира? Пространство-время перемешалось ещё сильнее?!"
10029075-26 = "[s1] «Вообще-то это наши, эм, знакомые...»\n[s2] «Давайте просто оставим всё как есть.»"
10029075-29 = "...А? Они из этого мира?"
10029075-30 = ""
10029075-32 = ""
10029075-33 = "...Все они?!"
10029075-34 = ""
10029075-36 = ""
10029075-37 = "У вас тут и правда весьма интересная компания."
10029075-38 = "И как вы собираетесь из этого выкручиваться, мисс Мисака? Такими темпами оборудование будет уничтожено в перестрелке."
10029075-39 = "Это и тебя касается, знаешь ли! Если оборудование сломается, ты застрянешь здесь вместе с нами!!"
10029075-40 = "Сенсей!! Что нам делать? Вы же сказали, что они ваши друзья!"
10029075-41 = "...А?"
10029075-42 = "Они не ваши друзья? ...Они... старые враги?"
10029075-43 = "...Они враги!!"
10029075-44 = "Аргх...! Почему это должно было случиться именно сейчас...!!"
10029075-45 = ""
10029075-47 = ""
10029075-49 = ""
10029075-50 = "Сенсей? Вам что-то нужно?"
10029075-51 = "...Ну, я могу попытаться закончить ремонт оборудования..."
10029075-52 = "Но нам нужно больше времени. И если оборудование попадёт под перекрёстный огонь, я уже ничего не смогу сделать."
10029075-53 = "Оно и так работает нестабильно! Даже если мы его починим, оборудование включится и..."
10029075-55 = "Это не проблема. Когда ремонт закончится, мы вставим принесённый чип."
10029075-56 = "Президент запрограммировала чип так, чтобы он обновил алгоритм оборудования. Всё просто."
10029075-57 = "Настоящая проблема..."
10029075-58 = "[s3] «Остановить этот хаос.»\n[s4] «Нужно не дать этим ребятам драться, пока ремонт не закончится.»"
10029075-61 = ""
10029075-63 = ""
10029075-64 = "*вздыхает*"
10029075-65 = "Я хотела этого избежать, но раз уж всё дошло до такого...?"
10029075-66 = "Я надеялась оставить о себе лучшее впечатление..."
10029075-67 = "..."
10029075-68 = "Сколько вам нужно? Три минуты? Нет, пяти минут должно хватить, верно?"
10029075-69 = "[s7] «...Шокухо?»\n[s8] «Что ты имеешь в виду...?»"
10029075-72 = "Разумеется, я говорю о том, чтобы остановить этот хаос. Сколько времени вам нужно?"
10029075-73 = "...! Шокухо!"
10029075-74 = "Не делайте такое лицо, мисс Мисака. Мне эта ситуация тоже совсем не нравится."
10029075-75 = "Но, как вы сами сказали, если мы не сможем вернуться домой, это будет проблемой, не так ли?"
10029075-76 = "Учитывая обстоятельства, я..."
10029075-77 = "...полагаю, придётся дать им немного попробовать."
10029075-78 = ""
10029075-80 = ""
10029075-82 = ""
10029075-83 = ""
10029075-84 = ""
10029075-85 = ""
10029075-86 = ""
10029075-87 = "Ч-Что...?"
10029075-88 = "Все... остановились...?"
10029075-89 = "Время замерло...? Н-Нет, только люди..."
10029075-90 = "...Понимаю."
10029075-91 = "Это та сила, о которой упоминала Микото. Если так, мы сможем действовать эффективно."
10029075-92 = ""
10029075-94 = ""
10029075-96 = "Эм..."
10029075-97 = "Уверена, вы все впечатлены, но... может, всё-таки сосредоточитесь на ремонте...?"
10029075-98 = "Здесь сложнее сосредоточиться... чем обычно... Больно..."
10029075-99 = "Моя способность — не грубая разрушительная сила... Она требует тонкости..."
10029075-101 = "...? Это ты обо мне сейчас, да?"
10029075-102 = "Она не ошибается. Нам нужно спешить."
10029075-103 = "И дроны не остановились, так что их всё ещё придётся разбирать."
10029075-104 = "Но число противников сократилось больше чем наполовину... Теперь это возможно."
10029075-105 = "Да, мы справимся! Но что с ремонтом? Вы сможете?"
10029075-107 = "Хи-хи. Похоже, все рассчитывают, что именно мы спасём положение."
10029075-108 = "Ага. В такой ситуации... будет стыдно их подвести."
10029075-109 = "Мы справимся! Пять минут! Этого более чем достаточно!!"
10029075-111 = "Давайте постараемся! Мы уже почти закончили!!"
10029075-112 = "[s9] «Хорошо. Тогда начинаем!»\n[s10] «Будем стараться до самого конца!»"
10029075-116 = "Ага!"
