[translation]
90000155-2 = ""
90000155-3 = "Что это было...?"
90000155-4 = "Это точно пророк Декаграматона. Судя по данным, вероятно, пятый пророк, Гебура."
90000155-5 = "Но этот пророк… Он ведёт бой совершенно иначе, чем все предыдущие."
90000155-6 = "Все прошлые пророки сражались исключительно собственными силами. Ведь они сами по себе были самостоятельными существами."
90000155-7 = "Но этот пятый пророк… Он словно… Получает поддержку от невероятно сложной боевой системы. Как будто смотришь на хорошо обученного солдата…"
90000155-8 = "Прямо в яблочко! Как там тебя... Акебоши Химари, да?"
90000155-9 = ""
90000155-11 = ""
90000155-12 = "*хлоп* *хлоп* П-Потрясающе. Кстати, я получила совершенно неожиданные данные! Ваш... Аби-Эшух? Так это произносится, да? Или всё же нет?.."
90000155-13 = "...!!"
90000155-14 = "Так, так, пусть это и не особо важно. Но всё же он работает на запретной технологии. Изучи-ка её."
90000155-15 = ""
90000155-18 = "[ns] «...Кто вы вообще такие?»"
90000155-19 = "...А?"
90000155-20 = "Ч-Что??"
90000155-21 = "Что???"
90000155-22 = ""
90000155-23 = "Это он. Владелец загадочного Сундука."
90000155-24 = "Это тот взрослый. Владыка Шале."
90000155-25 = "Этого человека называют \"Сенсей\". Хотя это неважно."
90000155-26 = "Да, верно. Может, нам стоит представиться? Меня зовут Айн."
90000155-27 = "Я Соф!"
90000155-28 = "Ор."
90000155-30 = "Мы — существа, которых не существует."
90000155-31 = "Мы — бессмертные несуществующие."
90000155-32 = "Мы — сокрытый свет и вечность."
90000155-33 = "Мы — те, кто служит Декаграматону."
90000155-34 = "Мы — те, кто выстилает путь, ведущий к свету."
90000155-35 = "И мы — те, кто готовит Царство Конца."
90000155-36 = ""
90000155-39 = "[ns] «Последователи Декаграмматона?!»"
90000155-40 = ""
90000155-41 = "Даже после смерти Декаграмматона мы продолжаем исполнять его волю. Его последние приказы."
90000155-42 = "Мы здесь кто-то вроде инженеров или учёных! Мы поддерживаем пророков."
90000155-43 = "Встреча с Сенсеем не входила в расчёты, но это неважно. Мы уходим."
90000155-44 = ""
90000155-45 = "Уходите?.. Куда?"
90000155-46 = "У-Уже? Но я ещё не собрала все данные о битве Гебуры, которые хотела..."
90000155-47 = "Нет-нет-нет. Просто оставь её тут резвиться. В Ледниковом Море мы уже сделали всё, что нам было нужно."
90000155-48 = "Верно. Мы получили всё необходимое, чтобы завершить нашу Старшую Сестру. А Гебура пусть делает то, для чего была создана."
90000155-49 = "Да. Ради Старшей Сестры..."
90000155-50 = "Ну, как-то так! Пусть это и было неожиданно, но приятно познакомиться, Сенсей."
90000155-51 = "Мы ещё встретимся. Уже очень скоро."
90000155-52 = "А ну стойте! У меня к вам вопросы..."
