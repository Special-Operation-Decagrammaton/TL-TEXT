[translation]
22050-1 = "Эпизод 5; Ведомые Алисой 2"
22050-2 = "Площадь Миллениума No.19"
22050-3 = "Моё приключение с Алисой продолжилось."
22050-4 = "Вот место нашего следующего события!"
22050-5 = ""
22050-7 = ""
22050-9 = ""
22050-11 = "Я чувствую здесь присутствие новых предметов!"
22050-12 = "Давайте исследовать, Сенсей."
22050-14 = "О, это Алиса."
22050-15 = ""
22050-19 = ""
22050-20 = ""
22050-21 = "Как дела? Чем сегодня занимаешься?"
22050-22 = "Я прохожу тренировку героя! Сегодня специальная: для героя-новичка."
22050-23 = "Не знаю, в чём разница... но звучит круто."
22050-24 = "А что это за взрослый с тобой?"
22050-25 = "Это Сенсей, маскот геройской группы."
22050-26 = "[s1] «Здравствуйте, я Сенсей из Шале.»\n[s2] «Здравствуйте, я талисман отряда героев.»"
22050-29 = "Так вы тот самый Сенсей из Шале?"
22050-30 = "Впервые вижу вас вживую. Теперь понимаю, почему вы маскот..."
22050-31 = "...Правда?"
22050-32 = "В любом случае, Алиса, удачи в приключении!"
22050-33 = "Спасибо! Благодаря вашей поддержке моя энергия полностью восстановлена."
22050-34 = "Пока мы ходили по кампусу Миллениума, Алиса получила поддержку от множества разных студентов."
22050-36 = "Лекционный зал Миллениума No. 11"
22050-37 = "А? Это Алиса там?"
22050-38 = "Алиса, привет! Ты выполняешь какой-то квест?"
22050-39 = "Да, сегодня я отправилась в приключение по квесту, который получила от Юзу."
22050-40 = "Круто!"
22050-41 = "Тогда, раз уж ты всё равно идёшь, можешь отнести это в лекционный зал в соседнем здании?"
22050-42 = "*ах* Это побочный квест?"
22050-43 = "Да. Если отнесёшь, я дам тебе в награду этот монблан из известной кондитерской Тринити!"
22050-44 = "Серьёзно?! И это всё, что ты ей дашь?"
22050-45 = "Тогда я ещё добавлю эти шоколадные шарики из магазина у дома!"
22050-46 = "Хорошо! Квесты — моя специализация! Предоставьте это мне!"
22050-47 = "За выполнение побочных квестов она получила в награду множество сладостей."
22050-49 = "О? Неужели это те, о ком я думаю?"
22050-50 = ""
22050-55 = ""
22050-56 = "Они самые. Здравствуйте, Сенсей. Привет, Алиса."
22050-57 = "Приветики."
22050-59 = "Здравствуйте, все!"
22050-60 = ""
22050-62 = ""
22050-63 = "[ns] «Всем привет. А что здесь делает Инженерный Департамент?»"
22050-64 = "О! Вам интересно наше расписание, Сенсей?"
22050-65 = "Хорошо! Я объясню! Сегодня утром Инженерный Департамент проснулся в семь часов..."
22050-67 = "Котори долго и с мельчайшими подробностями пересказывала события дня."
22050-69 = "...И вот так мы здесь оказались! Целая череда необычайных событий. Правда, Хибики? Утаха?"
22050-70 = "Что? А, да. Наверное."
22050-71 = "...Кажется? Я не слушала."
22050-72 = "Короче говоря, мы вышли за дополнительным оборудованием для Инженерного Департамента."
22050-73 = "Ух ты. Вы каждый день создаёте новое снаряжение."
22050-74 = "Теперь понятно! Вы великие кузнецы стали, выковавшие Меч Света! Я так вами восхищаюсь!"
22050-75 = "Снаряжение...?"
22050-76 = "Не совсем понимаю, но спасибо."
22050-77 = "Кузнецы... Такое древнее слово могла выдать только Алиса!"
22050-78 = "Ну, в каком-то смысле она не так уж и неправа."
22050-79 = "Оружие Алисы — амбициозный проект, созданный Инженерным Департаментом..."
22050-80 = ""
22050-82 = ""
22050-83 = "Кстати, Алиса, как там рельсотрон..."
22050-84 = ""
22050-86 = ""
22050-87 = ""
22050-88 = "То есть, как тебе Меч Света?"
22050-89 = ""
22050-91 = ""
22050-92 = "Да! Меч Света — моё сокровище! Это символ героя!"
22050-93 = "Я всегда буду его беречь!"
22050-94 = "[s] «Теперь это одна из самых дорогих ей вещей.»"
22050-96 = "[ns] «Проблема лишь в том, что иногда она пробивает им потолки.»"
22050-97 = "А? Разве это проблема?"
22050-98 = "В Миллениуме такое постоянно случается."
22050-99 = ""
22050-100 = "Развитие технологий требует жертв."
22050-101 = "[s] «...Ну да. Для Инженерного Департамента это обычное дело.»"
22050-102 = "Кхм. В любом случае."
22050-103 = "Мы рады, что ты хорошо им пользуешься."
22050-104 = "Пожалуйста, и дальше береги Меч Света."
22050-106 = "Есть, госпожа!"
22050-108 = "На протяжении всего приключения Алиса получала горы поддержки."
22050-109 = "Мы вместе продолжали прокладывать путь вперёд, ни на мгновение не останавливаясь."
22050-110 = ""
22050-118 = "А случайные встречи происходили снова и снова."
22050-120 = "Наконец-то я тебя нашла, мелкая."
22050-121 = ""
22050-124 = ""
22050-125 = "П-Появилась дикая маленькая горничная! И-и-и!"
22050-126 = "А?! Как ты смеешь называть меня дикой маленькой горничной!"
22050-127 = "[s] «О? Неру?»"
22050-128 = "Что вы здесь делаете, Сенсей?"
22050-129 = "Неважно. Раз вы оба тут, пойдёмте со мной потусим."
22050-130 = "П-Прямо сейчас? Но я в данный момент нахожусь в приключении..."
22050-132 = "Мне всё равно. Пошли."
22050-133 = ""
22050-135 = ""
22050-136 = "Ч-Что...?"
22050-137 = "Меня захватила маленькая горничная! Неужели моему приключению конец?!"
22050-138 = "Если это гейм овер, я хотя бы хочу кат-сцену!"
22050-139 = "Ну вот, опять ты несёшь какую-то чушь."
22050-141 = "И сколько раз мне повторять?! Не называй меня маленькой горничной!"
22050-142 = "...Тогда как мне тебя называть?"
22050-143 = "Неру! Просто называй меня Неру!"
22050-144 = "Я вообще-то твоя старшекурсница!"
22050-145 = "Хорошо. Поняла."
22050-146 = "Маленькая старшекурсница Неру."
22050-147 = "Убери \"маленькая\"!"
22050-148 = "[s] «Погоди, Неру. Мы сейчас в геройском приключении, так что заняты...»"
22050-149 = "Геройском приключении?! А?"
22050-150 = "Сейчас есть кое-что поважнее этой дурацкой штуки!"
22050-151 = "[s] «Что-то поважнее...?»"
22050-152 = "Угх. Вы безнадёжны!"
22050-153 = ""
22050-156 = "Игровой зал Миллениума"
22050-163 = "Аргх! Опять проиграла! Чёрт, как же бесит! Что это вообще был за приём?!"
22050-164 = "Это что, какой-то трюк?!"
22050-165 = "Юзу говорит, трюки — часть игрового процесса!"
22050-166 = "Что?! Как же бесит!"
22050-167 = "Ч-Что за...?!"
22050-168 = "[s] «И вот это важнее...? Играть в игры в аркаде?»"
22050-169 = "А?"
22050-170 = "Конечно! Сегодня я возьму реванш у этой мелкой!"
22050-171 = "В прошлый раз она, может, и надрала мне задницу, потому что застала врасплох..."
22050-172 = "Но сегодня всё будет иначе! Я изучала комбо! Клянусь, я отыграюсь!"
22050-174 = "Я помню, ты говорила то же самое в прошлое воскресенье, Неру."
22050-175 = ""
22050-176 = "Что ты сказала?!"
22050-177 = "Они некоторое время препирались, полностью погрузившись в игру."
22050-178 = ""
22050-181 = ""
22050-183 = ""
22050-185 = ""
22050-187 = ""
22050-188 = ""
22050-189 = ""
22050-190 = ""
22050-191 = ""
22050-193 = ""
22050-194 = "[ns] «Эм... вы часто вот так играете?»"
22050-195 = "Да... Неру постоянно бросает мне такие вызовы, поэтому мне не остаётся ничего, кроме как соглашаться."
22050-196 = "Ч-Что ты несёшь? Звучит так, будто я тебя умоляю играть!"
22050-197 = "[s] «Разве это не так?»"
22050-198 = "Нет!"
22050-199 = "Мне просто хотелось понять, что это за игры, в которые постоянно играют эта мелкая и Департамент Разработки Игр."
22050-200 = "Иногда играю пару раундов, и всё!"
22050-201 = "Согласно моей памяти, это пятидесятый бой с Неру."
22050-202 = "...Просто со временем накопилось, вот и всё!"
22050-203 = "[s] «Неру... Не знал, что ты настолько любишь игры.»"
22050-204 = "Да, судя по моему опыту, Неру очень любит игры."
22050-205 = "Она часто приходит в Департамент Разработки Игр, чтобы поиграть на FlyStation Мидори."
22050-206 = "Для справки: мой текущий результат — пятьдесят побед из пятидесяти игр. У меня серия побед."
22050-208 = "Неру ещё далеко до настоящего геймера! Ей следует использовать комбо вот так..."
22050-209 = "[s] «...По-моему, ты правда очень любишь игры.»"
22050-210 = "Ч-Что?! Эй! Да не настолько уж!"
22050-211 = "Неважно! Ещё один раунд! Ещё один!"
22050-212 = "А-А...? Опять...?"
22050-213 = "Да! Пока я не выиграю! Так что заодно научи меня тому комбо, о котором говорила."
22050-214 = "Ни за что... Пока не выиграешь...? Значит, я не смогу вернуться в клубную комнату до вечера..."
22050-215 = "Научи меня, чтобы я смогла победить!"
22050-216 = ""
22050-221 = "Играя вместе, они устроили настоящий переполох."
22050-222 = "Угх! Ч-Что это было?!"
22050-223 = ""
22050-233 = "Неру! Нельзя просто долбить по кнопкам. Нужно точно рассчитывать момент каждого нажатия!"
22050-234 = "З-Знаю я!"
22050-235 = ""
22050-241 = "Поначалу они были полны сил, ссорились и веселились, но время шло..."
22050-242 = ""
22050-246 = "Аргх! Неру, ты всё ещё неправильно связываешь комбо!"
22050-247 = "Такими темпами шкала голода у меня и Сенсея полностью опустеет..."
22050-248 = "Хмф! Ещё раз! С самого начала!"
22050-249 = "Они спорили, жаловались и кричали друг на друга, но..."
22050-250 = ""
22050-265 = "...Ух, близко. Ещё чуть-чуть — и я бы провела невероятное комбо."
22050-266 = "..."
22050-267 = ""
22050-271 = "Аргх! Ладно! Ещё один раунд, хорошо?"
22050-272 = "Д-Да!"
22050-273 = "Чем дольше они играли, тем лучше, казалось, начинали понимать друг друга."
22050-274 = ""
22050-293 = "[ns] «Ух ты...»"
22050-294 = "..."
22050-295 = "Эй! А вот это как тебе?! Сейчас покажу своё секретное комбо!"
22050-296 = "А! Эм...!"
22050-297 = "Эй, сосредоточься! Не отвлекайся от экрана!"
22050-298 = "Если потеряешь бдительность, моё роскошное комбо уничтожит твоего персонажа..."
22050-299 = "Боже. А я всё гадала, куда Неру могла уйти, бросив наше задание."
22050-300 = "А вот и она."
22050-302 = "А-Акане?! Ты что здесь делаешь?"
22050-303 = "Я же говорила."
22050-304 = "Сегодня позже мы получаем задание непосредственно от президента, поэтому нужно подготовиться."
22050-305 = "Ах."
22050-306 = "[s] «Ты забыла...»"
22050-307 = "Н-Нет! Я как раз собиралась идти, сразу после того как выиграю эту игру...!"
22050-308 = ""
22050-318 = "А?!"
22050-319 = "Идеальная победа!"
22050-320 = "П-Постой! Это нечестно!"
22050-321 = "Мир соревнований суров. Во время игры нужно всегда сохранять концентрацию."
22050-322 = "Если ты проиграла, потому что отвлеклась посреди боя, неужели ждёшь, что соперник признает результат недействительным?"
22050-323 = "Хм... Это... звучит логично..."
22050-324 = "Ладно! Давай ещё раз...!"
22050-325 = ""
22050-326 = "Кхм. Ты обещала играть только один час в день."
22050-327 = "Пора заняться нашим заданием. Ты весь день бездельничала."
22050-328 = "Ну Акане! Ещё совсем чуть-чуть!"
22050-329 = ""
22050-331 = ""
22050-335 = "[ns] «(Как мама, пришедшая отчитать ленивого ребёнка.)»"
22050-337 = "Сенсей? Что это сейчас было за выражение на вашем лице?"
22050-338 = "[s] «Ничего...»"
22050-340 = "Аргх! В следующий раз ты за это заплатишь! Клянусь, я тебя одолею!"
22050-341 = "Да-да. Конечно одолеешь. А теперь идём."
22050-342 = ""
22050-345 = ""
22050-346 = "Просим нас извинить, Сенсей и Алиса."
22050-347 = ""
22050-349 = ""
22050-350 = ""
22050-351 = ""
22050-356 = ""
22050-357 = ""
22050-358 = "Когда мы с Алисой вышли из игрового зала, уже был вечер."
22050-359 = "[s] «Кстати, Алиса.»"
22050-360 = "Да?"
22050-361 = "[s3] «Разве ты не боялась Неру?»\n[s4] «Я думал, ты избегала Неру, потому что боялась её...»"
22050-364 = ""
22050-369 = "Когда они играли вместе, казалось, что Алиса и Неру прекрасно ладят."
22050-370 = "Мне стало интересно, не ошибался ли я насчёт их отношений."
22050-371 = "А... Понимаете..."
22050-372 = "Раньше Неру была моим врагом... но теперь она союзник..."
22050-373 = "Момои говорит, есть вероятность, что Неру стала слабее."
22050-374 = "Поэтому я больше не боюсь Неру."
22050-375 = "[s] «Неру бы разозлилась, узнай она, что Момои опять такое говорит...»"
22050-376 = "И-и! Костюмы горничных всё ещё очень меня пугают. Я не хочу, чтобы Неру злилась."
22050-377 = "Но теперь..."
22050-378 = ""
22050-383 = "Неру — моя подруга!"
22050-384 = "Она подруга, которая играет со мной в игры..."
22050-385 = "Но я не могу одновременно отправляться в приключения и играть с Неру. Это неэффективно."
22050-386 = "Сегодня я хотела продолжить приключение с Сенсеем..."
22050-387 = "[s] «(Так вот почему она пыталась избегать Неру...)»"
22050-389 = "[ns] «Ну, сегодняшнее приключение было очень весёлым.»"
22050-390 = "...!"
22050-391 = "Правда?"
22050-392 = "[s] «А тебе было весело?»"
22050-394 = "Путешествуя по кампусу Миллениума, я смог немного заглянуть в повседневную жизнь Алисы."
22050-395 = ""
22050-397 = ""
22050-398 = ""
22050-399 = ""
22050-400 = ""
22050-401 = ""
22050-402 = "Она встречалась со множеством студентов, и многие её знали."
22050-403 = ""
22050-405 = ""
22050-406 = ""
22050-407 = ""
22050-408 = "И, похоже, все они её обожали."
22050-409 = ""
22050-411 = ""
22050-412 = ""
22050-413 = ""
22050-414 = ""
22050-415 = ""
22050-416 = ""
22050-417 = ""
22050-419 = ""
22050-420 = "Алиса с таким энтузиазмом относилась к своим приключениям здесь и делилась ими со всеми друзьями, которых успела завести."
22050-422 = "Я..."
22050-423 = ""
22050-427 = "Сегодняшнее приключение с вами было очень весёлым, Сенсей!"
22050-428 = "Хотя сегодня мне и не удалось выполнить квест Юзу..."
22050-429 = "Я герой! А герои не сдаются!"
22050-430 = ""
22050-432 = ""
22050-434 = ""
22050-435 = "Сейчас я всего лишь новичок, но если продолжу выполнять квесты и ходить в приключения, повышая уровень..."
22050-436 = "Когда-нибудь я одолею злого владыку, угрожающего миру, своим Мечом Света!"
22050-437 = ""
22050-441 = "...Вы продолжите ходить со мной в приключения до тех пор, Сенсей?"
22050-443 = "[s] «Да, конечно.»"
22050-444 = ""
22050-450 = "Сегодня, завтра и ещё очень-очень долго..."
22050-451 = "Эти счастливые дни с Алисой и Миллениумом будут продолжаться вечно."
22050-452 = "...По крайней мере, так я думал."
22050-455 = "Следующий Эпизод: Странная машина 1"
