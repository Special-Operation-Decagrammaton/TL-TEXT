[translation]
22050-1 = "Episódio 5;~Aris e os Guiados~ (2)"
22050-2 = "Praça nº 19 de Millennium"
22050-3 = "(Depois disso, a aventura com a Aris continuou.)"
22050-4 = "A próxima área é aqui!"
22050-11 = "A Aris consegue sentir... há a presença de um item novo por aqui!"
22050-12 = "Então, vamos começar a exploração..."
22050-14 = "Ah, é a Aris-chan!"
22050-21 = "O que está fazendo hoje? Em treinamento de guerreira de novo?"
22050-22 = "Não é treinamento de guerreira, é treinamento de heroína.#nHoje estou na versão Heroína Aprendiz!"
22050-23 = "Tem alguma diferença nisso...? Não entendi muito bem."
22050-24 = "Quem é do seu lado? Um adulto?"
22050-25 = "O Sensei é o Sensei!#nEle é o mascote do grupo da heroína."
22050-26 = "[s1] \"Olá, sou o Sensei da Schale.\"\n[s2] \"Olá, sou o mascote do grupo da heroína.\""
22050-29 = "Sensei... da Schale...?"
22050-30 = "Que pessoa com uma aura misteriosa...#nAté que dá pra entender um pouco esse negócio de mascote..."
22050-31 = "...S-Será mesmo?"
22050-32 = "Bom, deixa pra lá.#nAris-chan, boa sorte na sua aventura hoje!"
22050-33 = "Sim! A Aris recebeu a torcida e recarregou as energias!"
22050-34 = "(Assim, caminhando por toda Millennium, recebendo palavras de incentivo das alunas pelo caminho...)"
22050-36 = "Millennium - Auditório nº 11"
22050-37 = "Hm? Ei, aquela não é a Aris?"
22050-38 = "Oiê, Aris!#nFazendo alguma missão hoje também?"
22050-39 = "Sim! Hoje estou fazendo uma missão que a Yuzu me passou."
22050-40 = "Hmm, entendi!"
22050-41 = "Então, pega isso aqui. Pode levar lá pro auditório?"
22050-42 = "Hum, isso é uma missão?"
22050-43 = "Aham. E a recompensa é esta aqui!#nUm Mont Blanc que comprei naquela doceria famosa de Trinity!"
22050-44 = "O quê?! Isso é golpe baixo!"
22050-45 = "Então, se você concluir essa missão, eu te dou bolinhas de chocolate!"
22050-46 = "Sim! Missões são a especialidade da Aris!#nPode deixar com a Aris!"
22050-47 = "(Recebendo doces de presente com a desculpa de serem recompensas de missão...)"
22050-49 = "Hmph! Será que quem está ali é—"
22050-56 = "Ah, são o Sensei e a Aris."
22050-57 = "Oiê."
22050-59 = "O-Olá!"
22050-63 = "[ns] \"Olá, é raro ver o Clube de Engenharia por aqui.\""
22050-64 = "O Sensei está interessado na nossa agenda, não é mesmo?!"
22050-65 = "Muito bem! Eu mesma vou explicar!#nNós do Clube de Engenharia acordamos às 7 da manhã..."
22050-67 = "(Garota explicando...)"
22050-69 = "...e foi assim que viemos parar aqui!#nNão é, Hibiki? Utaha-senpai?!"
22050-70 = "Ah, é, bom... tipo isso."
22050-71 = "...Talvez?"
22050-72 = "Resumindo, a gente saiu pra repor os equipamentos que estavam faltando."
22050-73 = "Uhum, uhum... Essa dedicação de criar novas armas todos os dias..."
22050-74 = "Como esperado das ferreiras de aço que forjaram a Espada da Luz!#nA Aris ficou muito emocionada!"
22050-75 = "Armas...?"
22050-76 = "N-Não entendi muito bem... mas acho que vou aceitar como um elogio."
22050-77 = "Ferreiras... que escolha de palavras bem a cara da Aris!"
22050-78 = "Bom, em um sentido amplo, até que faz sentido."
22050-79 = "A arma da Aris é o maior orgulho do Clube de Engenharia, afinal..."
22050-83 = "...Aliás.#nAris, como anda o canhão elétrico..."
22050-88 = "Digo, a Espada da Luz? Está funcionando bem? Algum defeito?"
22050-92 = "Está impecável!#nPara a Aris, a Espada da Luz é um tesouro!"
22050-93 = "Sim, porque é o símbolo da heroína! Eu cuido dela com muito carinho!"
22050-94 = "[s] \"É mesmo um tesouro insubstituível pra você, Aris.\""
22050-96 = "[ns] \"...O único problema é que às vezes ela acaba destruindo o teto.\""
22050-97 = "Hã? E isso é um problema?"
22050-98 = "Em Millennium, isso é bem normal."
22050-100 = "O avanço tecnológico sempre exige alguns sacrifícios, afinal."
22050-101 = "[s] \"...Entendi. Pro Clube de Engenharia isso é rotina, né?\""
22050-102 = "Bom, mesmo assim..."
22050-103 = "Ficamos muito felizes sabendo que você está cuidando bem dela."
22050-104 = "Continue contando com ela, Aris."
22050-106 = "Sim!"
22050-108 = "(Assim, recebendo incentivos ao longo do caminho...)"
22050-109 = "(A aventura com a Aris continuou—)"
22050-118 = "(E houve ainda outros encontros...)"
22050-120 = "Te achei, baixinha."
22050-125 = "U-Uma Empregada Baixinha selvagem apareceu!"
22050-126 = "Hã?! Quem você tá chamando de baixinha selvagem?!"
22050-127 = "[s] \"Ué, Neru?\""
22050-128 = "Que saco, o Sensei também tá junto?"
22050-129 = "Veio bem a calhar.#nOs dois, venham comigo rapidinho."
22050-130 = "Q-Quê?! A Aris ainda está no meio de uma aventura..."
22050-132 = "Anda logo, vamos."
22050-136 = "U-Uwaaaah...?!"
22050-137 = "A Aris foi capturada pela Empregada Baixinha!#nSerá que a aventura da Aris termina aqui?!"
22050-138 = "Se for pra ter um final ruim, pelo menos quero uma CG especial!"
22050-139 = "Do que cê tá falando...?"
22050-141 = "Esquece isso! Que história é essa de 'Empregada Baixinha'?!"
22050-142 = "...Então, como a Aris deve chamar você?"
22050-143 = "Me chama de senpai, ué, normal."
22050-144 = "Vai, me chama de Neru-senpai."
22050-145 = "Hmm... certo, entendido!"
22050-146 = "Neru-senpai Baixinha."
22050-147 = "Tira o 'baixinha'!"
22050-148 = "[s] \"Desculpa, Neru. A gente tá meio ocupado numa aventura agora...\""
22050-149 = "Hã? Que papo é esse?"
22050-150 = "Tem uma coisa muito mais importante do que isso, né!"
22050-151 = "[s] \"Mais importante...?\""
22050-152 = "Hã? Claro que é—"
22050-156 = "Millennium - Fliperama"
22050-163 = "Droga! Perdi de novo!#nGuaaah! Que raiva!"
22050-164 = "Que golpe foi esse?! Isso aí é apelação pura!"
22050-165 = "A Yuzu disse que golpes apelões também fazem parte do jogo!"
22050-166 = "Hã?! Para de jogar sujo, pô!"
22050-167 = "U-Uwaaaah?!"
22050-168 = "[s] \"A coisa importante era... jogar fliperama?\""
22050-169 = "Hã?"
22050-170 = "Mas é óbvio, né!#nEu decidi que hoje eu vou ter a minha revanche contra essa baixinha."
22050-171 = "Da última vez eu dei mole, mas..."
22050-172 = "Hoje eu tô em outro nível. Eu treinei os combos!"
22050-174 = "Aris se lembra de ter ouvido... essa exata frase da Neru-senpai semana passada."
22050-176 = "O que cê disse, sua pirralha?!"
22050-177 = "(Mesmo provocando uma à outra desse jeito, as duas continuaram jogando contra.)"
22050-194 = "[ns] \"Vocês duas jogam contra com frequência?\""
22050-195 = "Sim... a Neru-senpai sempre me desafia, então a Aris aceita."
22050-196 = "Hã? Desse jeito parece que eu tô te obrigando a jogar comigo."
22050-197 = "[s] \"Ué, e não é isso?\""
22050-198 = "Claro que não, pô!"
22050-199 = "Eu só fiquei curiosa pra ver que tipo de coisa ela e o pessoal do Clube de Desenvolvimento de Jogos tão fazendo."
22050-200 = "Enquanto eu investigava, acabei jogando umas partidas contra ela, só isso."
22050-201 = "Mas, segundo a memória da Aris, hoje é a 50ª vez que jogo contra a Neru-senpai."
22050-202 = "...Foi só coincidência de horário."
22050-203 = "[s] \"Neru... você gosta mais de videogame do que eu imaginava.\""
22050-204 = "Sim, pela experiência da Aris, a Neru-senpai adora videogames."
22050-205 = "Ela vive indo lá na sala do clube pra jogar no PryStation da Midori."
22050-206 = "Aliás, o placar até agora está em 50 jogos e 50 vitórias. A Aris está invicta."
22050-208 = "Em termos de habilidade, a Neru-senpai ainda tem muito a melhorar!#nSe tivesse variado um pouco mais o combo naquela hora..."
22050-209 = "[s] \"...Você gosta mesmo, né?\""
22050-210 = "Droga, para de falar besteira!! Cala a boca!!"
22050-211 = "Próxima! Vamos mais uma."
22050-212 = "S-Sim... de novo...?"
22050-213 = "Até eu ganhar.#nAnda, me ensina o combo."
22050-214 = "Nossa... até a Neru-senpai ganhar...#nA Aris... não vai conseguir voltar pra sala do clube até o fim da tarde..."
22050-215 = "Isso só depende do jeito que você ensinar, pô!"
22050-221 = "(E assim, o duelo entre Neru e Aris recomeçou—)"
22050-222 = "Droga?! O-Ora seu!"
22050-233 = "Neru-senpai... ficar esmagando os botões não vai conectar o combo... Você precisa apertar cada comando com cuidado!"
22050-234 = "E-Eu já sei disso!"
22050-241 = "(E assim, as duas continuaram jogando...)"
22050-246 = "U-Uwaaah!#nO combo da Neru-senpai não conecta..."
22050-247 = "Desse jeito, a barra de fome da Aris e do Sensei vai chegar a zero..."
22050-248 = "Tsc, droga, de novo desde o começo!"
22050-249 = "(Mesmo xingando, Neru não parava de jogar, e impulsionada pelo entusiasmo dela, a aula de jogos de luta da Aris continuou...)"
22050-265 = "...Droga, faltou só um tiquinho pra conectar."
22050-266 = "... (toda nervosa)"
22050-271 = "Guaaah...! Mais uma vez. Tudo bem, né?"
22050-272 = "S-Sim!"
22050-273 = "(Ali estavam as duas, se entendendo um pouquinho melhor a cada partida—)"
22050-293 = "[ns] \"Ah...\""
22050-294 = "..."
22050-295 = "Toma! Vai! Conecta!"
22050-296 = "Ah, hum... com licença..."
22050-297 = "Ei, pirralha! Não tira o olho da tela!"
22050-298 = "Olha o meu combo magnífico..."
22050-299 = "—Eu estava me perguntando onde você estaria matando serviço..."
22050-300 = "Então era aqui que a senhora estava, Presidente."
22050-302 = "Uwah! A-Akane?!#nDesde quando cê tá aí?!"
22050-303 = "Eu não avisei?"
22050-304 = "Disse que hoje teríamos o comunicado de uma missão da Presidente, então era para se preparar—"
22050-305 = "...Ah."
22050-306 = "[s] \"Você esqueceu, né...\""
22050-307 = "N-Não!#nAssim que eu terminasse essa..."
22050-318 = "Ei?!"
22050-319 = "Vitória perfeita da Aris!"
22050-320 = "Ei, isso aí foi trapaça!"
22050-321 = "O mundo das disputas é implacável. É preciso estar sempre na melhor condição para lutar."
22050-322 = "Ou será que a Neru-senpai diria que não valeu se fosse derrotada por se distrair no meio de um combate?"
22050-323 = "Heh... olha só o que você tá falando..."
22050-324 = "Fechado! Esse desafio—"
22050-326 = "Videogame é só uma hora por dia.#nNós combinamos, não combinamos?"
22050-327 = "Vamos, de volta à missão, Presidente.#nNão vou permitir mais nem um minuto, está bem?"
22050-328 = "Ah, espera um pouco, Akane! Só mais um pouquinho...!"
22050-335 = "[ns] (Matou o dever de casa total...)"
22050-337 = "...Ora, Sensei?#nAconteceu alguma coisa?"
22050-338 = "[s] \"Não, nada...\""
22050-340 = "Droga, você me paga!#n—Da próxima vez eu ganho."
22050-341 = "Sim, sim, com certeza.#nVamos andando logo."
22050-346 = "Então, peço licença.#nAté mais, Sensei, Aris-chan."
22050-358 = "(Quando saí do fliperama com a Aris, o sol já tinha se posto.)"
22050-359 = "[s] \"A propósito, Aris.\""
22050-360 = "Sim?"
22050-361 = "[s3] \"Você não tinha medo da Neru, Aris?\"\n[s4] \"Achei que você tivesse medo da Neru...\""
22050-369 = "(Para quem tinha medo, a Aris parecia estar se divertindo bastante com a Neru.)"
22050-370 = "(Será que eu me enganei...?)"
22050-371 = "Ah, é que..."
22050-372 = "É verdade que a Neru-senpai já foi nossa inimiga antes... mas agora é aliada."
22050-373 = "Então, segundo a Momoi, há uma grande probabilidade de a Neru-senpai ter ficado mais fraca."
22050-374 = "Por isso, a Aris não tem mais medo da Neru-senpai."
22050-375 = "[s] \"A Momoi disse isso...? Se a Neru ouvir, ela vai ficar furiosa.\""
22050-376 = "C-Claro, a Aris ainda tem um pouco de receio de roupas de empregada..."
22050-377 = "Mas agora..."
22050-383 = "Sim, a Neru-senpai também é nossa companheira!"
22050-384 = "Uma companheira que joga videogame com a Aris e com todo mundo..."
22050-385 = "Bem, é um pouco problemático não poder me aventurar enquanto jogo com a Neru-senpai..."
22050-386 = "E justo hoje que era dia de me aventurar com o Sensei... é que..."
22050-387 = "[s] (Ah... então era por isso que ela tentou evitar a Neru...)"
22050-389 = "[ns] \"Eu me diverti muito na aventura de hoje.\""
22050-390 = "!!"
22050-391 = "Sério mesmo?"
22050-392 = "[s] \"E você, Aris? Como foi a aventura de hoje?\""
22050-394 = "(Depois de andar o dia inteiro por Millennium, entendi como é o dia a dia da Aris.)"
22050-402 = "(Conhecendo várias alunas,)"
22050-408 = "(Sendo mimada por elas,)"
22050-420 = "(A Aris, que se esforça tanto em suas aventuras por aqui...)"
22050-422 = "A Aris..."
22050-427 = "A Aris também se divertiu muito na aventura de hoje com o Sensei!"
22050-428 = "Bem, infelizmente não conseguimos avançar na missão da Yuzu..."
22050-429 = "Mas a Aris ainda é uma heroína.#nHeroínas nunca desistem!"
22050-435 = "Ainda sou uma aprendiz, mas vou continuar cumprindo missões, subir muito de nível..."
22050-436 = "E um dia, com esta Espada da Luz, vou derrotar o Rei Demônio que ameaça o mundo!"
22050-441 = "Até lá... você vai continuar se aventurando com a Aris, Sensei?"
22050-443 = "[s] \"Sim, com certeza.\""
22050-450 = "(E assim o dia chegou ao fim—)"
22050-451 = "(O cotidiano comum de Millennium segue em frente.)"
22050-452 = "(—Sim, era o que eu achava que continuaria acontecendo.)"
22050-455 = "Próximo;A Máquina Misteriosa (1)"
