10029065-6 = "Что...! Теперь их ещё больше! Они и правда бесконечные!!"
10029065-7 = "Разумеется. Для них это оборудование тоже важно. Вероятно, система использует все доступные ресурсы, чтобы защитить его."
10029065-8 = ""
10029065-10 = ""
10029065-12 = "И барьер всё ещё держится..."
