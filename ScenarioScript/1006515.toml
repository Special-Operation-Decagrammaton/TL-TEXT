[translation]
1006515-1 = "Украшение любви"
1006515-2 = "Я закончил дела в Клубе Инь-Ян раньше, чем ожидал, поэтому пришёл в комнату отдыха немного заранее."
1006515-6 = ""
1006515-7 = ""
1006515-8 = ""
1006515-9 = ""
1006515-10 = ""
1006515-11 = ""
1006515-12 = "А, Сенсей?"
1006515-13 = "Разве мы не договаривались встретиться чуть позже? Вы рано..."
1006515-14 = "[s1] «А, прости. Я закончил работу раньше.»\n[s2] «Прости! Ты ещё убираешься?»"
1006515-17 = "Ничего страшного. Сегодня уборка заняла немного больше времени, чем обычно."
1006515-18 = "Я убиралась усерднее обычного, потому что знала, что вы придёте."
1006515-19 = "Хотя, похоже, я несколько перестаралась, и время незаметно убежало."
1006515-20 = "Прошу прощения за беспорядок."
1006515-21 = "[s3] «Да ничего. Я сам пришёл раньше.»\n[s4] «Раз уж я здесь, давай помогу тебе?»"
1006515-24 = "Я ни за что не могла бы так вас утруждать..."
1006515-25 = "...Хм? Чем быстрее мы закончим, тем быстрее сможем попить чай?"
1006515-26 = "Понятно... Вам ведь будет трудно расслабиться, зная, что комната отдыха в таком состоянии..."
1006515-27 = "Тогда я приму вашу помощь."
1006515-30 = "Мы усердно убирали комнату отдыха, когда..."
1006515-32 = "С этим нужно... быть особенно осторожной."
1006515-33 = ""
1006515-35 = ""
1006515-36 = "[ns5] «Ты прямо изо всех сил полируешь это.»\n[ns6] «Эта вещь особенно важна для тебя?»"
1006515-39 = "А, да."
1006515-40 = "Возможно, как вице-президенту Клуба Инь-Ян мне не следует поддаваться соблазну товаров и материальных вещей..."
1006515-41 = "Но именно эта вещь для меня невероятно особенная."
1006515-42 = "[s] «Особенная? Ты меня заинтересовала.»"
1006515-43 = "А. Хотите посмотреть, Сенсей?"
1006515-44 = "[s] «Правда? Можно?»"
1006515-45 = "Конечно. Никаких проблем."
1006515-46 = "Вот, держите. Только осторожнее... Она довольно тяжёлая."
1006515-47 = ""
1006515-49 = ""
1006515-51 = "[ns] «Ты получила это от учеников Хяккияко?»"
1006515-52 = ""
1006515-54 = ""
1006515-55 = "Хи-хи. Да."
1006515-56 = "Это было примерно тогда, когда я только начала работать главным стратегом Клуба Инь-Ян."
1006515-57 = "В торговом квартале проходил фестиваль, в организации которого я помогала..."
1006515-58 = "Я тогда ещё совсем не привыкла к работе и чувствовала себя скорее обузой, которая даже не понимает, что от неё требуется."
1006515-59 = "Но как только фестиваль закончился, группа участвовавших в нём учеников и торговцев подарила мне это."
1006515-60 = "Они говорили: «Это мероприятие прошло так гладко благодаря помощи Клуба Инь-Ян!» и «Какое облегчение, что вы были здесь», и даже «Как и ожидалось от Клуба Инь-Ян». И всё в таком духе..."
1006515-61 = "Я... Они были так добры и благодарны. Это оказалось слишком волнительно."
1006515-62 = "Тогда я ужасно растерялась. Ведь я не сделала ничего особенно достойного похвалы."
1006515-63 = "[s] «Уверен, ты старалась изо всех сил, Кахо.»"
1006515-64 = "К-как и сейчас, я просто старалась помогать проводить успешные мероприятия, чтобы ещё шире распространять ценности и культуру академии Хяккияко."
1006515-65 = "Но как бы то ни было, когда я смотрю на эту благодарственную грамоту, меня переполняет гордость."
1006515-66 = "Получив её, я почувствовала, что все мои усилия до этого были не напрасны... что мне удалось хотя бы немного поделиться своей страстью со всеми."
1006515-67 = "Я просто испытала облегчение оттого, что справляюсь со своей работой главного стратега."
1006515-68 = "Я никогда не хочу забывать это чувство, поэтому каждый раз во время ежедневной уборки особенно тщательно её полирую."
1006515-69 = "[s] «Для тебя она и правда очень много значит!»"
1006515-70 = "Хи-хи. Ещё как."
1006515-74 = "Мы закончили уборку комнаты отдыха."
1006515-75 = "Спасибо, что помог мне, Сенсей."
1006515-76 = "[s] «Тогда, может, теперь выпьем чаю?»"
1006515-77 = "Хи-хи. Думаю, сегодня чай будет ещё вкуснее обычного."
1006515-78 = "Ведь я буду пить его в чистой, прибранной комнате, да ещё и вместе с Сенсеем..."
1006515-79 = "Итак, дайте мне немного времени на приготовления."
1006515-81 = "Мы с Кахо устроили очень спокойное чаепитие в комнате, которую довели до идеальной чистоты."
