[translation]
10018100-1 = "Эпизод 10; Судьбоносный день"
10018100-3 = ""
10018100-9 = "Здравствуйте, дорогие зрители!"
10018100-10 = "Как прошёл ваш год? Готовы встретить новый?"
10018100-11 = "С вами звёздный репортёр Школы журналистики «Кронос» — Кавару Шинон!"
10018100-12 = ""
10018100-14 = ""
10018100-15 = "Кто-нибудь знает, где я сейчас нахожусь?"
10018100-16 = "Не расстраивайтесь, если нет!"
10018100-18 = "Мы и сами думали, что это обычный торговый район, пока не услышали новости!"
10018100-19 = "Вы слышали о Няомото Фудс? Уверена, многие слышали!"
10018100-20 = "Няомото Фудс, также известная как Няо Фудс, — компания по производству продуктов, которая стремительно расширяется по всему Кивотосу!"
10018100-21 = "Сегодня мы получили сообщение, что здесь пройдёт новогодний кулинарный поединок по осэти, организованный Няомото Фудс!"
10018100-22 = "*хлоп* *хлоп* *хлоп*"
10018100-23 = "Сегодняшний спонсор — никто иной, как сама Няомото Фудс! И они пригласили для нас особого гостя."
10018100-24 = "Президент Няомото Фудс — Няомото Кан!"
10018100-25 = ""
10018100-27 = ""
10018100-30 = ""
10018100-31 = "Мва-ха-ха. Рад со всеми познакомиться."
10018100-32 = "Спасибо за интерес к этому скромному мероприятию. Мва-ха-ха."
10018100-34 = "А бросает вызов Няо Фудс..."
10018100-35 = "...владелица традиционного местного заведения, рассчитывающая победить эту растущую корпоративную силу вкусом!"
10018100-36 = "Хозяйка «Воробья»!"
10018100-37 = ""
10018100-39 = ""
10018100-41 = ""
10018100-42 = "З-Здравствуйте. Рада познакомиться со всеми..."
10018100-43 = "Правила соревнования просты."
10018100-44 = "Победит тот, кто приготовит лучшие сто наборов осэти."
10018100-45 = "Честно говоря, я даже беспокоюсь за соперника."
10018100-46 = "Мы в Няо Фудс использовали передовые технологии и системы массового производства, чтобы без происшествий приготовить наши осэти."
10018100-47 = "Но «Воробей» полагается на ручной труд, поэтому я переживаю, как они справились с таким объёмом..."
10018100-49 = "Понятно! Как великодушно с вашей стороны переживать об обстоятельствах соперника, господин Няо!"
10018100-50 = "Какова обстановка в «Воробье»?!"
10018100-53 = "(Мва-ха-ха. Это невозможно.)"
10018100-54 = "(Будто ста наборов осэти было недостаточно сложно — после саботажа они точно не могли справиться.)"
10018100-55 = "(Я уже вижу это: хозяйка «Воробья» в слезах, опозоренная тем, что пришла на соревнование даже без нужного количества еды.)"
10018100-56 = "(А затем, наконец, моё великодушие...)"
10018100-58 = "Ну..."
10018100-59 = "Благодаря поддержке всех мы смогли приготовить сто наборов осэти."
10018100-60 = ""
10018100-62 = ""
10018100-64 = "Что?!"
10018100-66 = "Ого! Вы хотите сказать, что «Воробей» способен конкурировать с методом массового производства Няо Фудс?!"
10018100-67 = "Можно узнать ваш секрет?!"
10018100-68 = "Всё благодаря тем, кто нас поддержал."
10018100-69 = "Я вас с ними познакомлю."
10018100-70 = ""
10018100-72 = ""
10018100-76 = ""
10018100-77 = "З-Здравствуйте, я Айкиё Фуука из Клуба школьной столовой Геенны. Рада познакомиться со всеми."
10018100-78 = "А я Куродатэ Харуна из Общества гурманов Геенны."
10018100-80 = "О! Внимание! Все сюда!"
10018100-81 = "Здесь и Клуб школьной столовой, и Общество гурманов Геенны!"
10018100-82 = "Разве не невероятно видеть, как они работают вместе?! Что вообще происходит в Геенне?!"
10018100-83 = "Беспрецедентное сотрудничество ведёт «Воробей» к успеху!"
10018100-84 = "Я, Кавару Шинон, не верю своим глазам!"
10018100-86 = "(Н-Не о чем волноваться.)"
10018100-87 = "(Столько домашней еды за такое короткое время...)"
10018100-88 = "(Она никак не сможет победить еду, изготовленную с промышленной точностью!)"
10018100-89 = "И теперь! Битва начинается!"
10018100-90 = "Сегодня судьями будут члены Гильдии торговцев, известные своим придирчивым вкусом!"
10018100-91 = ""
10018100-94 = "Погодите, я тоже могу попробовать?"
10018100-95 = "Спасибо!"
10018100-99 = "Давно я не ела осэти..."
10018100-100 = "Осэти вкусные, но через некоторое время от них устаёшь, потому что всё такое сладкое."
10018100-101 = "И дома их готовить ужасно сложно из-за всей этой мороки."
10018100-102 = ""
10018100-108 = "Погодите, этот вкус...?!"
10018100-111 = "Я вообще не очень люблю осэти."
10018100-112 = "Да, сейчас они не так популярны. Но выглядят красиво."
10018100-113 = ""
10018100-116 = "Это осэти от Няо Фудс..."
10018100-117 = ""
10018100-121 = "*жует* Ну, вкус именно такой, как ожидалось. В точности как ожидалось..."
10018100-122 = "А это от «Воробья»..."
10018100-123 = ""
10018100-126 = "Хм?"
10018100-127 = "Эй. Быстрее попробуй это."
10018100-129 = "Знаете, я вообще никогда раньше не пробовала осэти. Разве не захватывающе?"
10018100-130 = "Это отлично. Знаешь, что ещё отлично? Этот район. Тебе стоит его прорекламировать."
10018100-131 = "Разве сам факт присутствия здесь Школы журналистики «Кронос» — уже не достаточная реклама?!"
10018100-132 = "Да, ну, я просто подумала..."
10018100-133 = ""
10018100-135 = ""
10018100-136 = ""
10018100-137 = "Боже мой! Я не знала, что осэти могут быть настолько вкусными!"
10018100-138 = "Невероятно!"
10018100-139 = "О?"
10018100-140 = "Дайте попробовать..."
10018100-141 = ""
10018100-143 = ""
10018100-144 = ""
10018100-146 = ""
10018100-148 = "О!"
10018100-151 = "Все, внимательно смотрите!"
10018100-152 = "Этот новогодний кулинарный поединок, спонсируемый Няо Фудс, достигает своего пика!"
10018100-153 = "И теперь пора определить победителя!"
10018100-154 = ""
10018100-156 = ""
10018100-158 = "(Я сделала всё, что могла... Теперь остаётся лишь ждать результата.)"
10018100-159 = "(Победа была решена ещё до начала готовки. Моя победа — факт, который осталось лишь обнаружить. Мва-ха-ха.)"
10018100-160 = ""
10018100-163 = ""
10018100-164 = "Победитель, с разгромным преимуществом...!"
10018100-166 = "(Надо было подготовить победную речь. Честно говоря, настолько полный контроль почти утомляет.)"
10018100-167 = "(Естественно, изобразить скромность, великодушие, позволить победе говорить самой за себя... Хотя, пожалуй, и я могу немного за неё сказать...)"
10018100-168 = "(Да, словно на сборочной линии, всё всегда идёт по плану.)"
10018100-169 = ""
10018100-171 = ""
10018100-172 = ""
10018100-173 = "Какой неожиданный результат! Никто не мог этого предсказать!"
10018100-174 = "Побеждает «Воробей»!"
10018100-176 = "Да-да, соболезнования «Воробью»..."
10018100-177 = ""
10018100-179 = ""
10018100-180 = "Что?!?!"
10018100-182 = "Возможно всё! Возможно вообще всё!!!!!!"
10018100-183 = "Я-я не могу в это поверить."
10018100-184 = "Огромное спасибо всем!"
10018100-186 = "П-Подождите минутку! Тут должна быть ошибка!"
10018100-187 = "Сто наборов?! Всего на четыреста человек?!"
10018100-188 = "Это домашняя еда! Качество обязательно должно отличаться от порции к порции!"
10018100-189 = "Моя еда была математически спроектирована, чтобы быть эффективно вкусной! Чего вам ещё надо?!"
10018100-191 = "Возможно, вы отнеслись к этому слишком легкомысленно, председатель Няо."
10018100-192 = ""
10018100-194 = ""
10018100-195 = ""
10018100-199 = ""
10018100-200 = "Ты!"
10018100-201 = "Люди говорят, что устают от осэти, потому что они обычно в основном сладкие."
10018100-202 = "От сладкой еды легко пресытиться."
10018100-203 = "К тому же ваша еда буквально утонула в синтетических приправах."
10018100-204 = "Если попробовал один раз — считай, попробовал сто."
10018100-205 = "П-Почему вы делаете вид, будто сами чем-то отличаетесь?!"
10018100-206 = ""
10018100-207 = "Мы отличаемся, и послевкусие у нас тоже разное."
10018100-208 = "Мы выборочно использовали различные дополнительные ингредиенты: имбирь, кунжут и измельчённый красный перец."
10018100-209 = "И это ещё не всё. Няо Фудс бездумно смешала низкокачественные продукты с синтетическими приправами."
10018100-210 = "Но никакое количество приправ не скроет плохое качество самих ингредиентов."
10018100-212 = "Текстура и ощущения во рту тоже имеют значение!"
10018100-213 = "Даже если грибы шиитаке одинаковы на вкус, люди обычно предпочитают те, что чуть более упругие!"
10018100-215 = "Н-Но!"
10018100-216 = "Как вы смогли приготовить еду на четыреста человек за такое короткое время?!"
10018100-218 = "О, это? Джури?"
10018100-219 = "Сколько порций Клуб школьной столовой готовит каждый день?"
10018100-220 = "Хм... Около четырёх тысяч?"
10018100-221 = "Не могу поверить, что Няо Фудс настолько переживает из-за каких-то четырёхсот порций..."
10018100-222 = "А независимо от размера порции Общество гурманов заметит и лишнюю чайную ложку сахара, и недостающую каплю соевого соуса!"
10018100-224 = "Наша победа была неизбежна с самого начала!"
10018100-225 = ""
10018100-227 = ""
10018100-229 = "Какой невероятный результат!"
10018100-230 = "Какая смелость — раскрыть секреты своего успеха!"
10018100-231 = "Здесь царит невероятное возбуждение!"
10018100-232 = ""
10018100-234 = ""
10018100-235 = "Уф, да кому не плевать! Кому есть дело до соревнования? Кому вообще есть дело до еды?!"
10018100-236 = "П-Председатель Няо?!"
10018100-237 = ""
10018100-239 = ""
10018100-241 = "Банда гурманов в шлемах! Резервный корпус Няо Фудс! Накажите их!"
10018100-242 = ""
10018100-244 = ""
10018100-247 = ""
10018100-248 = "Уф, не могу поверить, что всё закончилось ещё большей работой для нас."
10018100-249 = ""
10018100-251 = ""
10018100-252 = ""
10018100-254 = "Работа есть работа. Постарайся не держать обиду."
10018100-255 = ""
10018100-257 = ""
10018100-259 = "Обида..."
10018100-260 = "Интересный выбор слова."
10018100-261 = "Какое интересное развитие событий. ★"
10018100-262 = "Я знала, что всё к этому придёт."
10018100-263 = "Ура! Пора отработать всю эту вкусную еду!"
10018100-265 = "Сцена достигает ещё большего накала!"
10018100-266 = "Дуэль между Няо Фудс и Обществом гурманов, печально известной террористической группой Кивотоса!"
10018100-267 = "Не переключайтесь, друзья!"
10018100-268 = "Наша трансляция ещё далека от завершения!"
