70006010-222 = "Спасибо, Акари. Это могло плохо закончиться."
70006010-223 = "Становится опасно. ★"
70006010-224 = "Ай, больно! Очень больно!"
70006010-225 = "Х-Харуна! Что делать?!"
70006010-226 = "Я уже прекрасно вижу, что делать."
70006010-227 = ""
70006010-229 = ""
70006010-230 = "Все. Пока отступаем!"
70006010-231 = ""
70006010-233 = ""
70006010-234 = "Как и ожидалось... ★"
70006010-235 = ""
70006010-237 = ""
70006010-238 = ""
70006010-239 = ""
70006010-240 = "О нет. Побега не будет!"
70006010-243 = ""
70006010-244 = ""
70006010-245 = ""
70006010-246 = ""
70006010-247 = ""
70006010-248 = ""
70006010-250 = ""
70006010-251 = "Здесь раненые. Нужно немедленно начать лечение."
70006010-252 = "Хорошо, не двигайся, иначе будет больно."
70006010-253 = "Уааа! Харуна! Акари! Джунко! Возьмите меня с собой! Не бросайте...!"
70006010-255 = "Прости, Изуми! Мы будем помнить тебя!"
70006010-256 = "УААААХ! Я отомщу всем троим за это, даже если это будет последнее, что я сделаю-у-у!"
70006010-257 = ""
70006010-259 = ""
70006010-260 = "Бросать друга в беде... Позор."
70006010-261 = "Даже с таким боевым духом мы, Рыцари спасения, окажем тебе необходимую помощь!"
70006010-262 = "Ага, ловите их всех!"
70006010-263 = "Серьёзно?"
70006010-264 = "...А?"
70006010-265 = ""
70006010-270 = ""
70006010-271 = ""
70006010-272 = ""
70006010-273 = "...Какая беспощадность во имя «помощи»."
70006010-274 = "Похоже, полевая медицина — страшная штука. ★"
70006010-276 = "Ну что, Джунко. Покажи, где болит."
70006010-277 = "О, это серьёзно! Поражённый участок нужно вырезать!"
70006010-279 = "Ты ш-шутишь, правда? Ты же шутишь!"
70006010-280 = "Ух, меня бы не ранили, если бы я не была голодной..."
70006010-281 = "Не лижи мою руку, пока говоришь это...!"
70006010-283 = "С двумя оставшимися уже ничего не сделать. Нам нужно уйти отсюда и продумать следующий ход..."
70006010-284 = ""
70006010-286 = ""
70006010-287 = "...Акари?"
70006010-288 = "Похоже, для меня это конец пути..."
70006010-289 = "Я приняла удар за тебя, Харуна... Дальше всё на тебе..."
70006010-290 = "Хи-хи-хи..."
70006010-291 = ""
70006010-293 = ""
70006010-294 = ""
70006010-295 = "Акари...!"
70006010-296 = ""
70006010-299 = ""
70006010-300 = "Теперь осталась только ты."
70006010-301 = ""
70006010-303 = ""
70006010-304 = "Фуфу... Хи-хи-хи..."
70006010-305 = "Похоже, сопротивляться бессмысленно. Я сдаюсь."
70006010-306 = "Но должна признать, это впечатляет. Ваша репутация идёт впереди вас, но я и представить не могла, что вы так быстро нас уложите."
70006010-307 = "Вы и правда разрушительница, Мине."
70006010-309 = "Что значит «разрушительница»?! Что вы обо мне слышали?!"
70006010-310 = "Что бы со мной ни случилось, пожалуйста, проследите, чтобы мои друзья получили нормальную медицинскую пом—"
70006010-311 = ""
70006010-312 = ""
70006010-313 = "Мне сюда бензопилу!"
70006010-314 = "УАААА...!"
70006010-315 = "Ханаэ, не пугай её так. Она подумает, что ты серьёзно."
70006010-316 = "А я серьёзно!"
70006010-318 = "Ты и раньше была страшной. А теперь ты ещё и УЛЫБАЕШЬСЯ..."
70006010-319 = "Ну и бардак. Всё, что я могу сейчас сделать, — попытаться восстановить силы..."
70006010-320 = ""
70006010-322 = ""
70006010-323 = ""
70006010-324 = "А-а-а, почему Акари лижет мою руку?!"
70006010-325 = ""
70006010-326 = ""
70006010-327 = "...Ещё раз: пожалуйста, нормальное лечение."
70006010-328 = "Не волнуйся. Эти двое — достойные Рыцари спасения."
70006010-329 = "В конце концов, «То, что нас не уничтожает, делает нас сильнее»."
70006010-331 = "Я должна спросить. Почему вы, Рыцари спасения, вместе с Фуукой?"
70006010-332 = "Н-Ну..."
