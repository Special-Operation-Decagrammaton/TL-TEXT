[translation]
70006010-1 = "Изысканная кухня, печенье и помощь. Эпизод 1"
70006010-2 = "А... Я голодная. Что сегодня на обед?"
70006010-3 = "Обед, говоришь? Над этим надо серьёзно подумать."
70006010-4 = ""
70006010-6 = ""
70006010-7 = "Мне всё равно что, если мы едим вместе!"
70006010-8 = "Тогда надо идти в место с безлимитной едой."
70006010-10 = "У меня сейчас не так много денег. Безлимитные заведения в последнее время слишком дорогие."
70006010-11 = "Тогда найдём меню с дешёвой качественной едой и большими порциями."
70006010-13 = "Хи-хи, я знаю один вариант."
70006010-14 = "Погоди, ты думаешь о... том?"
70006010-15 = "Именно!"
70006010-16 = "Да, звучит хорошо! ★"
70006010-18 = "Понятно. Хорошо, если этого хотят все..."
70006010-19 = "...сегодня сделаем Фууке из Клуба школьного питания «заказ»."
70006010-20 = "Погоди. Это..."
70006010-21 = "Давайте не будем называть это «заказом»!"
70006010-23 = "Джунко, заказы бывают разные. Не переворачивай всё."
70006010-24 = "Хи-хи-хи, мне нравится всё, что готовит Фуука, с заказом или без!"
70006010-26 = "*вздох* Этого уже не остановить..."
70006010-27 = ""
70006010-29 = ""
70006010-30 = "А? Погоди."
70006010-31 = "Это Джури звонит?"
70006010-32 = ""
70006010-34 = ""
70006010-35 = "Алло, Куродатэ Харуна слушает. Чем могу помочь?"
70006010-36 = ""
70006010-38 = ""
70006010-39 = "Привет, Харуна. Я хотела кое-что уточнить."
70006010-40 = "Фуука случайно не с тобой?"
70006010-42 = "Вообще-то мы как раз собирались пойти к Фууке..."
70006010-43 = "Погоди, если ОНА спрашивает НАС..."
70006010-45 = "О, когда я не могу с ней связаться, просто предполагаю, что она с вами."
70006010-46 = "Похоже, сегодня нет."
70006010-47 = "Где же она? У нас закончилось масло для готовки, нужно ещё..."
70006010-48 = "О, оно должно быть в шкафу у двери на кухню."
70006010-49 = "В шкафу у двери на кухню..."
70006010-50 = ""
70006010-52 = ""
70006010-56 = "О, нашла! Огромное спасибо!"
70006010-58 = "Погоди, откуда ты вообще это знала?"
70006010-59 = "Хи-хи, вот в чём вопрос, правда?"
70006010-61 = "В любом случае, благодаря тебе проблема решена. Спасибо."
70006010-62 = "Ну, если увидите Фууку, присмотрите за ней, ладно?"
70006010-63 = ""
70006010-65 = ""
70006010-66 = "...Такое чувство, будто ты тонко просишь нас её найти..."
70006010-67 = "Хм, Джури не может дозвониться Фууке. Что происходит?"
70006010-68 = "Её ведь не похитили?"
70006010-69 = "Это было бы непростительно."
70006010-70 = "И маловероятно. Никто бы её не забрал, кроме нас."
70006010-71 = "Так что в каком-то смысле у нас есть обязанность её найти."
70006010-73 = "Ага, а потом попросим приготовить нам что-нибудь вкусное!"
70006010-75 = "Значит, выполняем приказ."
70006010-76 = "Тонкий приказ. По крайней мере, сами никого не похищаем."
70006010-78 = "Хи-хи-хи, хорошо, начинаем!"
70006010-85 = ""
70006010-86 = ""
70006010-87 = ""
70006010-88 = ""
70006010-89 = ""
70006010-90 = ""
70006010-92 = "*нюх* *нюх*"
70006010-93 = "Эм, здесь пахнет чем-то знакомым."
70006010-94 = "Чем-то вкусным!"
70006010-95 = "Да, вкусным, но знакомым больше чем этим..."
70006010-97 = "Может, это запах Фууки."
70006010-98 = "Ого! Джунко даже знает, как пахнет Фуука!"
70006010-99 = "Ч-Что ты пытаешься сказать...!"
70006010-100 = ""
70006010-102 = ""
70006010-103 = ""
70006010-104 = ""
70006010-105 = "Насчёт запаха не знаю, но эти следы похожи на следы Фууки."
70006010-106 = "Это точно её стиль обуви."
70006010-107 = "Как ты вообще можешь определить это среди ВСЕХ этих следов...?"
70006010-108 = "Фуука особенная. ★"
70006010-110 = "Судя по её покупательским привычкам, она могла быть в торговом районе здесь, возле Шале."
70006010-111 = "Уверена, мы недалеко от её любимого магазина..."
70006010-112 = "Вы все кучка сталкеров...!"
70006010-113 = "А? Погоди. Кто там...?"
70006010-114 = ""
70006010-116 = ""
70006010-117 = ""
70006010-118 = ""
70006010-119 = "...Это она. Хм. Ты была права."
70006010-120 = "Она просто покупает ингредиенты. Не похоже, что её похитили."
70006010-121 = "Ну, нельзя оставлять её здесь на открытом месте. Придётся вмешаться и защитить."
70006010-123 = "Д-Да! Пока не стало опасно!"
70006010-124 = "*вздох* Я слишком устала, чтобы даже спорить."
70006010-125 = ""
70006010-127 = ""
70006010-128 = ""
70006010-129 = ""
70006010-130 = ""
70006010-132 = ""
70006010-133 = ""
70006010-134 = ""
70006010-135 = "В-Вы?! Как вы узнали...!"
70006010-136 = "Ох, Фуука, почему ты так удивлена?"
70006010-137 = "Особенно учитывая, как часто мы случайно встречаемся..."
70006010-138 = "Эй, Фуука! Что сегодня на обед?"
70006010-140 = "Джури переживала за тебя."
70006010-141 = "Джури? О..."
70006010-142 = "Я отвлеклась. Пропустила её звонок. Позже извинюсь."
70006010-143 = "Отвлеклась? Наверное, готовишь что-то суперособенное! Не могу дождаться!"
70006010-144 = "Можно и так сказать, наверное..."
70006010-145 = "Но вы сегодня лучше отдохните. Если похитите меня здесь, у вас будут проблемы."
70006010-147 = "Почему? Хина из Префектурной команды рядом?"
70006010-148 = "А! Все берегитесь!"
70006010-149 = ""
70006010-151 = ""
70006010-154 = ""
70006010-156 = "На нас напали...?"
70006010-157 = ""
70006010-162 = ""
70006010-164 = ""
70006010-166 = ""
70006010-167 = ""
70006010-168 = ""
70006010-170 = "Это Рыцари спасения!"
70006010-171 = "Ага, они избивают тебя почти до смерти только ради того, чтобы потом вылечить!"
70006010-172 = "И ещё, говорят, Мине просто всё разрушает, а потом заставляет своих рыцарей убирать за ней."
70006010-174 = "Ч-Что? Какое они имеют отношение к Фууке?!"
70006010-175 = "Медицина не знает границ! Фуука, ты в порядке?"
70006010-177 = "Не могу поверить, что слух дошёл до других школ..."
70006010-178 = "Хи-хи-хи, не волнуйся. Если когда-нибудь получишь травму, мы вылечим тебя как новенькую!"
70006010-180 = "Звучит так, будто ты хочешь, чтобы это случилось!"
70006010-181 = "Фуука рассказывала нам о вас."
70006010-182 = "Защита слабых — часть нашей миссии."
70006010-183 = "Аомори Мине, капитан Рыцарей спасения... в бой!"
