[translation]
10023060-1 = "Эпизод 6;А пока — в путь"
10023060-2 = "После насыщенного событиями первого дня мы надеялись, что второй пройдёт немного спокойнее..."
10023060-6 = "Так это та картина, которую завтра выставят на аукцион. Я собираюсь сделать ставку. А вы?"
10023060-7 = "Могу лишь сказать, что всё зависит от атмосферы этого дня."
10023060-8 = ""
10023060-11 = ""
10023060-12 = "[ns] «(Несмотря ни на что, похоже, они всё равно с нетерпением ждут аукциона.)»"
10023060-13 = ""
10023060-15 = ""
10023060-16 = ""
10023060-17 = ""
10023060-18 = ""
10023060-19 = ""
10023060-20 = ""
10023060-21 = "Уф. Я вымоталась."
10023060-22 = "[s] «Хорошая работа, Момои.»"
10023060-23 = "Мы зашли уже так далеко, что мне почти хочется довести всё до конца просто назло! Только это сейчас и держит меня на ногах!"
10023060-24 = "Если это вообще имеет смысл."
10023060-25 = "Прости, что втянула тебя во всё это, Сенсей."
10023060-26 = "[s] «Вообще-то это даже немного освежает.»"
10023060-27 = "Ты серьёзно? Лучше бы серьёзно, а то!"
10023060-28 = "Потому что теперь я буду звонить тебе каждый раз, когда нам снова понадобится выбраться из очередной передряги!"
10023060-29 = "[s] «...Беру свои слова обратно! Пожалуйста!»"
10023060-30 = ""
10023060-34 = "...!"
10023060-35 = "[ns] «Должно быть, это она!»"
10023060-36 = "Что происходит?"
10023060-37 = "Я бы не слишком переживал. Говорят, Благородный Вор может навредить кошелькам, но жертв после неё не бывает."
10023060-38 = "А! И правда. Значит, мы можем просто... откинуться назад и насладиться представлением?"
10023060-39 = "Только не говорите Мэйтаро, что это я сказала, но это даже немного забавно."
10023060-40 = ""
10023060-43 = ""
10023060-44 = ""
10023060-46 = "Никто особенно не паникует. Они что, после вчерашнего уже привыкли?"
10023060-47 = "В таком случае..."
10023060-48 = "[s] «Пора. Всё как мы планировали.»"
10023060-50 = "Она и пальцем не коснётся картины."
10023060-51 = "Я охраняю верх лестницы."
10023060-52 = ""
10023060-54 = ""
10023060-56 = ""
10023060-57 = "Только дайте команду — и я подстрелю любую цель!"
10023060-58 = "Я спрячусь... и буду оценивать ситуацию..."
10023060-59 = "[s] «Я верю в вас всех!»"
10023060-62 = ""
10023060-63 = "..."
10023060-64 = "..."
10023060-66 = "..."
10023060-68 = "Какое напряжение! А она ничего не делает!"
10023060-69 = ""
10023060-73 = "Пока мы все ждали, я почувствовал, как к моей ноге подкатилась маленькая стеклянная бусина."
10023060-74 = "Вопреки здравому смыслу я поднял её..."
10023060-75 = ""
10023060-78 = "Здравствуйте, Сенсей. Вы меня слышите?"
10023060-79 = "[s] «Кто это?»"
10023060-81 = "Эта маленькая бусина — одна из моих любимых игрушек. С её помощью я могу говорить с вами, а подслушивающие нас не услышат."
10023060-82 = "[s] «Это...?»"
10023060-83 = "Тсс. Не спрашивайте дальше."
10023060-84 = "У нас нет времени. Я должна сказать вам: вы — пешка в куда более крупной игре. Как и все мы."
10023060-85 = "[s] «Тогда кто двигает фигуры?»"
10023060-86 = "Вы бы уже знали, если бы сумели разгадать мою загадку. В любом случае скоро всё выяснится."
10023060-87 = "Какая жалость. Похоже, наше время истекло. Мне пора направляться к своей цели."
10023060-88 = "Вы можете остаться королевским шутом и продолжать слепой танец, а можете рискнуть всем ради истины."
10023060-89 = "Жизнь — не что иное, как бесконечная череда подобных выборов, согласны?"
10023060-90 = ""
10023060-93 = "[ns] «Она исчезла...»"
10023060-94 = ""
10023060-97 = ""
10023060-98 = "Слава богу! Мы снова видим!"
10023060-99 = "Но что с Благородным Вором? Похоже, она исчезла вместе с темнотой."
10023060-100 = "Может, это было просто обычное отключение электричества?"
10023060-101 = "Или охрана действительно так эффективна, как хвастается Мэйтаро."
10023060-102 = ""
10023060-104 = ""
10023060-107 = "Что-то не так, Сенсей?"
10023060-108 = "[s] «Момои, можешь позвать всех сюда?»"
10023060-109 = "А? Зачем? А как же наша работа по охране?"
10023060-110 = "[s] «Именно поэтому.»"
10023060-111 = ""
10023060-113 = ""
10023060-115 = "Вы серьёзно, Сенсей?!"
10023060-116 = "Нас всех обманывают? Но кто?"
10023060-117 = "[s1] «Она не сказала, кто именно...»\n[s2] «Она лишь сказала, что ответ скрыт в загадке с карточки...»"
10023060-120 = "И мы должны просто ей поверить?"
10023060-121 = "Мы говорим об одной из Семи Узников! Она может просто врать!"
10023060-122 = "Она не может быть полностью плохой. Она ведь спасла Мидори..."
10023060-123 = "Д-Да, спасла, но...!"
10023060-124 = "Может, это был спонтанный поступок! Не знаю! Что нам делать, Сенсей?"
10023060-125 = "[s3] «Все Семь Узников всё равно студенты...»\n[s4] «Она студент, поэтому я хочу её выслушать...»"
10023060-128 = "Очень по-сенсейски."
10023060-130 = "Вообще-то я тоже хотела кое-что сказать."
10023060-131 = "Помните, когда я прочитала с карточки «За Антикитерой...»? Мне показалось, что реакция Мэйтаро была немного странной."
10023060-132 = "Точно! Когда мы почти разгадали шифр, он как-то слишком отмахнулся от этого!"
10023060-133 = "И мне показалось странным, что сначала он был так уверен, будто защищать нужно только одну картину."
10023060-135 = "Я тоже хочу доложить! Мне уже очень давно не удаётся найти Мэйтаро."
10023060-136 = "Я наблюдала за залом, главными воротами и подоконником, но Мэйтаро нигде не видно."
10023060-137 = "[s] «Значит, никто здесь его не видел?»"
10023060-138 = ""
10023060-140 = ""
10023060-142 = "Странно. Он что, просто оставил сегодняшнюю охрану на нас и смылся?"
10023060-143 = "И правда. Если задуматься, я ни разу не видела Мэйтаро с начала выставки."
10023060-144 = "[s5] «Хм. Разве именно он не сильнее всех переживал за безопасность картины?» \n[s6] «Почему он исчез именно тогда, когда должна была напасть воровка?»"
10023060-147 = "Как там было... Та часть про луну, которую мы не смогли разгадать..."
10023060-148 = "«за замёрзшим танцем и Антикитерой лунный свет не сияет.»"
10023060-149 = "Мидори, ты говорила, что реакция Мэйтаро была... странной, верно?"
10023060-150 = "Да. Будто он пытался уйти от темы..."
10023060-151 = "Антикитера... Антикитера..."
10023060-152 = ""
10023060-154 = ""
10023060-155 = ""
10023060-156 = "Неужели...?"
10023060-157 = "О, это режим UZQueen! Я его хорошо знаю."
10023060-158 = "[s] «Ты что-то поняла?»"
10023060-159 = "Мэйтаро показывал нам те большие аналоговые часы... верно?"
10023060-160 = "Антикитерский механизм... это устройство вроде календаря, которое вычисляет движение небесных тел..."
10023060-161 = "По сути, его можно считать разновидностью часов..."
10023060-162 = ""
10023060-165 = ""
10023060-170 = ""
10023060-171 = "Так это и есть те аналоговые часы."
10023060-172 = "Теперь я понимаю смысл остановившихся часов."
10023060-173 = ""
10023060-175 = ""
10023060-176 = ""
10023060-177 = ""
10023060-178 = "Видите? Статуя танцовщицы находится прямо под часами."
10023060-179 = "[s] «В буквальном смысле — застывший танец.»"
10023060-180 = "Но за часами и статуей я ничего не вижу..."
10023060-181 = "Если позволите. Посмотрите сюда, на пол. Этот круглый участок не совпадает с остальной плиткой."
10023060-182 = ""
10023060-184 = ""
10023060-185 = "Мы должны суметь повернуть его и совместить узор."
10023060-186 = ""
10023060-188 = ""
10023060-189 = "Токи осторожно повернула плиту, завершив узор."
10023060-190 = "А затем...!"
10023060-191 = ""
10023060-195 = ""
10023060-197 = "...!"
10023060-199 = "[ns] «Я не ожидала увидеть на этой миссии раздвижные стены и скрытую лестницу...»"
10023060-200 = "Она ведёт в подвал."
10023060-201 = "«Лунный свет не сияет» — весьма подходящее описание."
10023060-202 = "Теперь я понимаю, почему Мэйтаро так быстро сменил тему."
10023060-203 = "[s] «Итак... Как думаете, что там внизу?»"
10023060-204 = "Не знаю. Но если Мэйтаро и Благородная Воровка спускались по этой лестнице, у нас нет выбора — придётся идти следом."
10023060-206 = "В-всё в порядке, Сенсей! Отдел разработки игр обязательно з-защитит вас!"
10023060-207 = "Нельзя такое говорить дрожащим голосом... Они же поймут, что ты боишься..."
10023060-209 = "Не беспокойтесь. C&C тоже здесь."
10023060-210 = "Мы договорились работать вместе на этой миссии. Я намерена сдержать слово."
10023060-211 = "[s] «Вы все способны с этим справиться!»"
10023060-213 = "Событие задания активировано! Теперь мы действуем в моём любимом жанре: данжен-кроулер!"
10023060-214 = "Раз я герой, а вы — талисман, пожалуйста, оставайтесь прямо рядом со мной! Сенсей!"
10023060-215 = "[s] «Рассчитываю на тебя, герой!»"
10023060-216 = "В-все... будьте осторожны... пожалуйста..."
10023060-217 = "Моя коробка всегда открыта, если нужно спрятаться... Думаю, если сильно потесниться, поместимся вдвоём."
10023060-218 = "[s] «Хорошо! Отдел разработки игр, C&C, вперёд!»"
