[translation]
1000515-1 = "Универсальный входной билет"
1000515-3 = "По «просьбе» Хошино я отправился в клубную комнату Комитета по предотвращению закрытия."
1000515-4 = ""
1000515-10 = "Хм? Что это за звук...?"
1000515-11 = "Это Сенсей? В такое время наверняка Сенсей."
1000515-12 = ""
1000515-16 = ""
1000515-17 = "Хех! Конечно."
1000515-18 = "Спасибо, Сенсей. Я не была уверена, что вы придёте ради такой пустяковой просьбы, но вы всё-таки здесь."
1000515-19 = "...А? Остальные?"
1000515-20 = "У всех моих младших сегодня свои планы. Поэтому у меня и появилась возможность позвать вас."
1000515-21 = "Они часто вас зовут. Иногда просто чтобы поблагодарить или провести с вами время, если вы свободны, но..."
1000515-22 = "...они ещё и постоянно на вас полагаются. Всё время просят об услугах или советах."
1000515-23 = "Если спросите меня, по-моему, они слишком от вас зависят."
1000515-24 = "И мне неловко, что они звонят только когда им что-то нужно. Даже если вы взрослый."
1000515-25 = "[s1] «Меня это полностью устраивает.»\n[s2] «Я просто рад, что им так спокойно рядом со мной.»"
1000515-28 = "Хех, я знала, что вы так скажете."
1000515-29 = "Но всё равно им важно научиться быть самостоятельными..."
1000515-30 = "...Неважно."
1000515-31 = "В смысле, мне-то уж точно не стоит об этом говорить. Мне самой тоже нужно над этим работать."
1000515-32 = ""
1000515-34 = ""
1000515-35 = "Знаю, знаю. Не смотрите на меня так."
1000515-36 = "Серьёзно, не надо. Когда вы так смотрите, я чувствую себя как тогда, когда Аяне на меня злится."
1000515-37 = "В любом случае я позвала вас не ради разговора об этом."
1000515-38 = "Я просто была одна и вдруг подумала о вас. Поэтому и попросила прийти."
1000515-39 = "[s3] «...Подумала обо мне?»\n[s4] «Ух ты, твоё настроение так резко изменилось!»"
1000515-42 = "Ну-ну, хватит дурачиться."
1000515-43 = "Послушайте, Сенсей..."
1000515-44 = "Можете взглянуть на это?"
1000515-45 = ""
1000515-47 = ""
1000515-48 = ""
1000515-50 = "[ns5] «Это... твоя подушка.»\n[ns6] «А? Почему вдруг?»"
1000515-53 = "Ах, точно, вы ещё не знаете. Это не просто подушка."
1000515-54 = "Это моё личное сокровище — «Универсальный входной билет». У него таинственные силы!"
1000515-55 = ""
1000515-58 = "Хех... По вашему лицу видно, что вы вообще не понимаете, о чём я."
1000515-59 = "Ну, необязательно объяснять каждую мелочь. Сенсей, садитесь сюда."
1000515-60 = ""
1000515-62 = ""
1000515-64 = "Хорошо, хорошо, вот так."
1000515-65 = "Теперь сядьте там и... зажмите это между рукой и грудью."
1000515-66 = ""
1000515-69 = "Вот так."
1000515-70 = "А теперь закройте глаза..."
1000515-71 = ""
1000515-73 = ""
1000515-75 = ""
1000515-77 = ""
1000515-81 = "Этот Билет позволяет комфортно уснуть где угодно."
1000515-82 = ""
1000515-85 = "Как и сказала Хошино, мягкость подушки постепенно убаюкала меня."
1000515-86 = "Проваливаясь в глубокий сон, я всё ещё слышал бормотание Хошино."
1000515-89 = "...Сенсей."
1000515-90 = "Я подумала, что вам было бы полезно забыть обо всём и немного поспать."
1000515-91 = "Но я знаю, вы не тот человек, который сам так поступит, если только студент вроде меня всё не устроит."
1000515-92 = "Поэтому я даю вам её взаймы. Даже несмотря на то, насколько она мне дорога."
1000515-93 = ""
1000515-96 = "...Сенсей? Вы уже спите?"
1000515-97 = "Ну..."
1000515-99 = "Сенсей, вы должны знать..."
1000515-100 = ""
1000515-103 = "Вы для меня очень... дорогой человек."
1000515-104 = ""
1000515-112 = "Не знаю, сколько я проспал."
1000515-113 = ""
1000515-117 = "Когда я открыл глаза, солнце уже село."
1000515-118 = "[ns7] «Уже вечер...?»\n[ns8] «Ух ты, я так крепко спал. Наверное, очень устал.»"
1000515-121 = "...О, вы проснулись, Сенсей?"
1000515-122 = ""
1000515-125 = ""
1000515-126 = "Вы выглядели так спокойно и уютно, что я в итоге сама уснула рядом, хе-хе..."
1000515-127 = "...А?"
1000515-128 = "Ну, эта подушка и правда моё секретное оружие, но мне она НЕ НУЖНА, чтобы уснуть."
1000515-129 = "Скажем так, я одолжила её вам, чтобы в плане сна у нас были равные условия."
1000515-130 = "В общем..."
1000515-131 = "Уже поздно. Вам стоит вернуться и отдохнуть перед завтрашним днём."
1000515-132 = "Я провожу вас до выхода. Всё-таки это я вас пригласила."
1000515-133 = "К тому же я часто патрулирую этот район..."
1000515-134 = "...так что убью двух зайцев одним выстрелом. Не переживайте из-за этого."
1000515-135 = "...А?"
1000515-136 = "Подушка понравилась?"
1000515-137 = "Хотите знать, где такую купить?"
1000515-138 = ""
1000515-140 = ""
1000515-141 = ""
1000515-142 = "...Хех."
1000515-143 = "Не-а, не скажу. Если расскажу, то больше не смогу использовать её как повод позвать вас сюда."
1000515-144 = "На самом деле раньше их продавали здесь, ещё до того, как Абидос стал таким, как сейчас. Теперь нигде не найти."
1000515-145 = "Именно поэтому мой «Универсальный входной билет» — уникальное сокровище."
1000515-146 = ""
1000515-148 = ""
1000515-149 = ""
1000515-150 = "Ну что, Сенсей?"
1000515-151 = "Если она снова понадобится, придётся прийти и попросить меня."
1000515-152 = "Понятно?"
1000515-154 = "Хошино проводила меня из Абидоса, после чего я вернулся в комнату отдыха Шале."
1000515-155 = "Подушки и диванные подушки в комнате отдыха не шли ни в какое сравнение."
