[translation]
80000023-1 = "Романтический обстрел"
80000023-2 = "Мастерская Инженерного Департамента"
80000023-3 = "Я пришёл в Инженерный отдел после последнего сообщения Хибики."
80000023-4 = "Эй, Сенсей."
80000023-5 = "Спасибо, что пришли посмотреть на моё новое изобретение."
80000023-6 = "Та-дам."
80000023-8 = "[s1] «Это что...?»\n[s2] «Артиллерийский снаряд?»"
80000023-9 = "Ага. 60-миллиметровая миномётная мина — такая же, какой я обычно пользуюсь."
80000023-10 = "Ага. 60-миллиметровая миномётная мина — такая же, какой я обычно пользуюсь."
80000023-11 = "Но самое интересное: внутри нет пороха."
80000023-12 = "Там шоколад."
80000023-13 = "[s] «Шоколад?»"
80000023-14 = "Ага. Точнее, концентрированная какао-паста."
80000023-15 = "Выстреливаешь миной, от высокой температуры какао-паста разделяется, и ба-бах.#nТам, где она падает, образуется шоколадное болото."
80000023-16 = "Это был заказ для мероприятия ко Дню святого Валентина, но я решила сама увеличить мощность и радиус действия."
80000023-17 = "[s] «Впечатляет.»"
80000023-18 = "Ага. Я подумала, что должно быть достаточно масштабно, чтобы все смогли насладиться."
80000023-19 = "Проблема только одна: разработку я закончила..."
80000023-20 = "...но испытать её пока не удалось."
80000023-21 = "Так что... можно я выстрелю этим по зданию Шале?"
80000023-22 = "Представьте романтическую атмосферу, когда шоколад потечёт по стенам."
80000023-23 = "[s] «Ага... Нет. Это опасно и вообще не романтично.»"
80000023-24 = "Хм..."
80000023-25 = "Наверное, кто-нибудь и правда может пострадать, если в него попадёт..."
80000023-26 = "О! Тогда как насчёт фонтана на площади Тринити?"
80000023-27 = "Представьте, как обрадуются студенты Тринити, если их скучный фонтан превратится в шоколадную мечту."
80000023-28 = "[s3] «Это всё равно так же опасно!»\n[s4] «Ты хочешь развязать войну между Миллениумом и Тринити?!»"
80000023-29 = "Ладно, справедливо..."
80000023-30 = "Ладно, справедливо..."
80000023-31 = "Тогда, пожалуй, просто отдам её вам."
80000023-32 = ""
80000023-34 = ""
80000023-35 = ""
80000023-36 = "Если когда-нибудь захочется шоколада — пользуйтесь."
80000023-37 = "Но за вкус не ручаюсь."
