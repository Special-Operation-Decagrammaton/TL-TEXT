[translation]
1012103-1 = "Это не путь Хяккарёран!"
1012103-2 = "Я пришёл туда, где мы с Юкари договорились встретиться."
1012103-3 = "А потом..."
1012103-4 = ""
1012103-5 = "У аквапарка Хяккияко"
1012103-6 = ""
1012103-7 = ""
1012103-9 = "Люди стояли в длинной очереди, надеясь спастись от жары."
1012103-10 = "А! Сенсей! Я здесь!"
1012103-11 = ""
1012103-14 = "Как же хорошо, что я вас заметила."
1012103-15 = ""
1012103-18 = "Здесь так людно... Я могу потерять вас за секунду."
1012103-19 = "Е-если вы не против... Можно мне держаться за вашу руку?"
1012103-20 = "...Вот. Теперь мы в безопасности."
1012103-21 = ""
1012103-23 = ""
1012103-24 = ""
1012103-25 = "Хи-хи. Пока мы вот так сцеплены, вы от меня никуда не денетесь."
1012103-26 = "Так вот, должно быть, это и есть тот водный парк, от которого все в таком восторге."
1012103-27 = "Я слышала, что здесь довольно... «круто»."
1012103-28 = "[s1] «Это только вход.»\n[s2] «Внутри ещё круче.»"
1012103-31 = "Мне, Юкари, даже не нужно заглядывать внутрь, чтобы понять правду."
1012103-32 = "У всех здесь такие радостные улыбки — значит, этот наполненный водой парк и правда потрясающее место!"
1012103-33 = "Ох, я едва сдерживаю восторг, Сенсей!"
1012103-34 = "Отправляемся!"
1012103-36 = "Ого...! Сенсей, смотрите!"
1012103-37 = "Все в купальниках!"
1012103-38 = "[s3] «Именно ЭТО тебя впечатлило?»\n[s4] «А ещё тут полно горок...»"
1012103-41 = "Всё именно так, как вы сказали. Все понимают, какая здесь положена одежда."
1012103-42 = "Разные наряды и весёлые развлечения... Совсем как на фестивале!"
1012103-43 = "Обычно на таких мероприятиях Хяккарёран я работаю... Но сегодня мы с вами можем просто веселиться!"
1012103-44 = "*гул толпы*"
1012103-45 = ""
1012103-47 = ""
1012103-48 = "Хм...? Я чувствую тревогу. Почему атмосфера вдруг изменилась?"
1012103-49 = "Всех направляют к выходу. О нет! В бассейне случилось происшествие или... «происшествие»?"
1012103-50 = ""
1012103-53 = "Большое спасибо, что посетили нас сегодня!"
1012103-54 = "В связи с обстоятельствами мы закрываемся раньше. Просим всех гостей немедленно покинуть территорию."
1012103-55 = "Ч-что происходит...?! Я думала, они будут открыты ещё несколько часов..."
1012103-56 = "Внеплановая эвакуация — тоже часть культуры бассейнов?"
1012103-57 = "Госпожа... А я-то думала, в последнее время вы ведёте себя хорошо, но вы опять доставляете неприятности!"
1012103-58 = ""
1012103-60 = ""
1012103-61 = "Но теперь всё в порядке. Эта негигиеничная... водная... площадка... отныне зарезервирована для частного мероприятия семьи Кадэнокодзи."
1012103-62 = "Как вы вообще сюда добрались...?!"
1012103-63 = "И вы сказали «зарезервирована»?"
1012103-64 = "Да. Хотя просьба была внезапной, владелец оказался весьма сговорчив."
1012103-65 = "Полагаю, всё благодаря постоянному вкладу семьи Кадэнокодзи в местное сообщество."
1012103-66 = "Семья Кадэнокодзи... Я вовсе не хотела такого—"
1012103-67 = "Цыц! Это СЕМЕЙНОЕ дело! Драгоценная госпожа из рода Кадэнокодзи не должна выставлять напоказ свою сияющую благородную кожу!"
1012103-68 = "Сенсей, вас мы не считаем посторонним. Мы очень вас уважаем."
1012103-69 = "Но, госпожа, вы ведь знаете, что так вести себя не следует. Откуда вообще взялся этот бунтарский дух?"
1012103-70 = "...Как бы то ни было! Вам следует понимать, как вам повезло оказаться здесь, Сенсей!"
1012103-71 = "[s] «...? Спасибо?»"
1012103-73 = "Хотя я и рада остаться с Сенсеем наедине..."
1012103-74 = "Что ж. Оставлю вас двоих... Хо-хо!"
1012103-75 = ""
1012103-76 = "Что? В смысле бассейн закрыт?"
1012103-77 = "Но вы же вчера обещали нам, что мы сможем..."
1012103-78 = "Ну-ну, не плачь! Попробуем снова на следующей неделе."
1012103-79 = ""
1012103-81 = "Сенсей."
1012103-82 = "Я ценю каждое мгновение, проведённое с вами. Одна мысль о вас вызывает у меня улыбку и заставляет сердце биться быстрее."
1012103-83 = "Думаю, всё из-за того, какой вы человек. Я горжусь вами и всем, чему у вас научилась."
1012103-84 = ""
1012103-86 = ""
1012103-87 = "Так что, Сенсей..."
1012103-88 = "[s5] «Кажется, я понимаю...»\n[s6] «Слово за тобой, Юкари.»"
1012103-91 = "Да! Соберитесь вокруг, мне есть что объявить всем присутствующим!"
1012103-92 = "Независимо от желаний семьи Кадэнокодзи, я, Юкари, никогда не пожертвую чужой радостью ради собственной!"
1012103-93 = "Какая упрямая... Если таков ваш выбор, семья настаивает, чтобы вы покинули это общественное место!"
1012103-94 = "Отлично. Я согласен."
1012103-95 = "Почему вы всегда...? Что ж, хорошо."
1012103-96 = ""
1012103-98 = ""
1012103-99 = "Сенсей."
1012103-100 = "Прошу прощения. Я и представить не могла, что семья узнает и станет так яростно возражать..."
1012103-101 = "Хм? Мне следует посмотреть туда?"
1012103-102 = ""
1012103-105 = "Эм... Приносим извинения за путаницу с предыдущим объявлением. В связи с... новыми обстоятельствами мы НА САМОМ ДЕЛЕ открыты!"
1012103-106 = "А в качестве компенсации сегодня вход бесплатный! Если вы уже заплатили, обратитесь в службу по работе с гостями за возвратом средств."
1012103-107 = "Это должно заткнуть этих нытиков, а тот богач Кадэнокодзи оплатил расходы за день, так что мы всё равно в плюсе, детка! ...А? Микрофон всё ещё включён?!"
1012103-108 = "Хм? Ты это слышала? Я думал, нас всех уже выставили за дверь!"
1012103-109 = "Наверное, совесть замучила! И бесплатно! Вот это день резко наладился!"
1012103-110 = ""
1012103-111 = "Можно заходить! Кто последний у горки — тухлое яйцо!"
1012103-112 = "Кто последний — тухлое яйцо!"
1012103-113 = ""
1012103-115 = ""
1012103-116 = "Эй! Не бегать!"
1012103-117 = ""
1012103-119 = "...Посмотрите на все эти улыбки."
1012103-120 = "[ns7] «Приятно видеть.»\n[ns8] «Оно того стоило?»"
1012103-123 = "Безусловно!"
1012103-125 = "Хотя нам с Юкари так и не удалось поплавать, по дороге обратно мы купили закуски и чудесно провели время."
