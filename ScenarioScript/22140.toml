[translation]
22140-1 = "Episódio 14;A Cidade-Fortaleza Eridu"
22140-2 = "Vocês apareceram mais rápido do que eu esperava."
22140-3 = "Então você já sabia desde o início que viríamos para cá."
22140-5 = "Sim. A senhorita Rio tem conhecimento de tudo."
22140-6 = "Tanto as decisões da C&C quanto seus movimentos—"
22140-7 = "E, é claro — o objetivo do Sensei também. Tudo."
22140-8 = "Portanto, permitam-me dizer uma coisa.#n— Qualquer resistência adicional é inútil. Por favor, rendam-se sem reagir."
22140-9 = "Oh... entendo."
22140-10 = "Huum, acho que isso vai ser meio difícil, hein?"
22140-20 = "...?!"
22140-21 = "Uau, que susto!"
22140-22 = "Ora, nem mesmo isso chega a ser um desafio para você?"
22140-23 = "A-Akane...?"
22140-24 = "...Murokasa Akane-senpai."
22140-25 = "...Especialista em controle de área usando explosivos em combate—"
22140-26 = "—Uma figura de alto risco da C&C."
22140-27 = "Fufu, ouvir isso de uma caloura que acabei de conhecer me deixa até um pouco sem graça."
22140-28 = "Aquilo de agora há pouco era apenas a minha forma de cumprimentá-la, mas..."
22140-29 = "..."
22140-30 = "Muito prazer, caloura.#nToki... certo?"
22140-31 = "Ouvi dizer que você cuidou muito bem da nossa presidente outro dia."
22140-32 = "E além disso... ainda nos agraciar com um conselho tão educado para nos rendermos..."
22140-33 = "Fufu, eu já tinha ouvido falar que você era a guarda-costas da Presidente Rio, mas...#nSinceramente."
22140-35 = "...Não posso deixar que subestime a C&C dessa maneira."
22140-36 = "...!"
22140-40 = "Olho por olho, dente por dente. Afinal, é exatamente para isso que viemos hoje."
22140-45 = "...Claro que, se você se render direitinho agora mesmo, podemos deixar isso para lá, sabe?"
22140-47 = "...Isso eu não posso fazer."
22140-48 = "Recebi ordens da senhorita Rio."
22140-49 = "\"Neutralize a C&C, que está agindo contra as instruções\"..."
22140-50 = "Por isso, não posso recuar desta posição."
22140-52 = "Huum, você é toda certinha, né, Toki-chan? ♪"
22140-53 = "Reação exatamente como o esperado."
22140-54 = "A C&C é uma organização de agentes secretos..."
22140-55 = "No começo, presumi que vocês se infiltrariam para causar confusão e me preparei para isso, mas..."
22140-56 = "Jamais imaginei que viriam assim, bem pela frente..."
22140-57 = "...Isso foi inesperado.#nPorém, a minha presença aqui também faz parte do plano de vocês, não é?"
22140-59 = "...É mesmo?"
22140-60 = "Ahaha ♪ Acho que é mais ou menos isso aí~?"
22140-62 = "Ora, pois é... para nós também foi bem inesperado."
22140-63 = "—Não adianta tentar desconversar."
22140-64 = "Já sei exatamente o que as senpais estão planejando."
22140-65 = "A Neru-senpai e o Sensei não estão aqui."
22140-66 = "Ou seja, o plano é esse, não é?#nVocês ficaram encarregadas de me segurar aqui."
22140-67 = "De certa forma, é uma escolha sensata. Evitar um confronto direto comigo enquanto visto o \"armamento\" da senhorita Rio,"
22140-68 = "e, nesse meio-tempo, deixar livre a Neru-senpai, a força mais poderosa de Millennium—"
22140-69 = "Se for assim, sim... realmente haveria uma chance de vitória."
22140-70 = "Quem é que tem chance de vitória, hein?"
22140-78 = "Ahaha! Demorou, hein, presidente!"
22140-79 = "Neru... senpai? Por que... está aqui...?"
22140-80 = "Hã? Não é óbvio, não?"
22140-81 = "É a revanche."
22140-82 = "Revanche...?"
22140-83 = "Se eu fosse por outro caminho, você com certeza ia vir atrás pra tentar me parar, né?"
22140-84 = "E eu tô sem saco pra esse tipo de encheção."
22140-85 = "Então, ir salvar a pirralha—"
22140-86 = "dá tempo de sobra de fazer isso \"depois\" de acabar com a tua raça."
22140-87 = "Ei, caloura. Não esqueci o que você fez da última vez."
22140-88 = "Vou te ensinar direitinho o que acontece quando se peita uma veterana."
22140-95 = "...!!"
22140-96 = "Iniciando resposta."
22140-102 = "Heh! Beleza! Cai dentro, então!"
22140-106 = "Com isso...!"
22140-107 = "Derrotamos todos os drones que estavam no caminho...!"
22140-108 = "[ns] \"Pessoal, foco total! Já estamos quase na superfície...!\""
22140-114 = "Isso aííí! Conseguimos sair!"
22140-115 = "E agora, pra onde a gente tem que ir daqui?"
22140-117 = "A Aris provavelmente está bem no centro de Eridu..."
22140-118 = "Sim, naquela torre ali no centro."
22140-119 = "Calculei a rota a partir da posição atual.#nSe seguirem direto para o norte pela avenida à esquerda, chegarão lá."
22140-120 = "[ns] \"Obrigado pelo suporte. Bom, vamos lá?\""
22140-131 = "Sai da frente, sai da frente!!"
22140-139 = "Pode deixar que eu faço a navegação daqui."
22140-140 = "Bora avançar com tudo! GO, GO~!"
22140-142 = "Próximo;Armadilha"
