[translation]
22140-1 = "Эпизод 14; Город-крепость Эриду"
22140-2 = "Вы отреагировали на шум даже быстрее, чем мы ожидали."
22140-3 = "Она уже знала, что мы придём?"
22140-5 = "Да. Рио знает всё."
22140-6 = "И движения, и решения C&C..."
22140-7 = "...и цель Сенсея, и куда он направляется."
22140-8 = "Скажу один раз. Дальнейшее сопротивление бессмысленно. Пожалуйста, спокойно сдавайтесь."
22140-9 = "Хмм... Понятно."
22140-10 = "Хи-хи. Не думаю!"
22140-11 = ""
22140-13 = ""
22140-14 = ""
22140-20 = "...?!"
22140-21 = "Ух ты! Даже я испугалась!"
22140-22 = "Ну надо же. Ты довольно легко уклонилась."
22140-23 = "А-Акане...?"
22140-24 = "...Мурокаса Акане."
22140-25 = "Согласно данным... ключевая участница C&C, отдающая приоритет подавлению большой площади..."
22140-26 = "И предпочитающая взрывчатку в бою."
22140-27 = "Хи-хи. Немного неловко слышать, что младшекурсница, которую я раньше не встречала, так много обо мне знает."
22140-28 = "Поверьте, удовольствие полностью моё."
22140-29 = "..."
22140-30 = "Приятно познакомиться, младшекурсница. Тебя звали... Токи?"
22140-31 = "Я слышала, наша президент задолжала тебе после прошлой встречи."
22140-32 = "А теперь... у тебя хватает наглости требовать нашей капитуляции."
22140-33 = "Хи-хи. Я знаю, что ты телохранитель Президента Рио... но всё же..."
22140-35 = "...Мне кажется, ты недооцениваешь C&C."
22140-36 = "...!"
22140-37 = ""
22140-39 = ""
22140-40 = "Понимаешь, мы всегда возвращаем долги. Всегда."
22140-41 = ""
22140-43 = ""
22140-44 = ""
22140-45 = "Так что, возможно, спокойно сдаться стоит именно тебе."
22140-47 = "Не стану."
22140-48 = "Я получила приказ от Рио."
22140-49 = "Подавить участниц C&C, нарушающих приказы и действующих самовольно."
22140-50 = "Я буду сражаться и выполню приказ."
22140-52 = "Какая преданная собачка! Гав-гав!"
22140-53 = "Что ж, примерно такого ответа мы и ожидали."
22140-54 = "C&C известна как организация тайных агентов..."
22140-55 = "Я предполагала, что вы будете следовать своему обычному методу и попытаетесь проникнуть скрытно."
22140-56 = "Признаю, не ожидала, что вы окажетесь достаточно дерзкими, чтобы бросить нам прямой вызов."
22140-57 = "...Поймала. Ты наверняка предсказала мою реакцию."
22140-59 = "...Думаете?"
22140-60 = "Ха-ха-ха. Не понимаю, о чём ты."
22140-62 = "О, боже. Как умно. Нам следовало просто проникнуть незаметно..."
22140-63 = "Можете притворяться сколько угодно."
22140-64 = "Но благодаря вашим действиям я теперь понимаю ситуацию."
22140-65 = "Пока вы втроём удерживаете меня здесь, Неру и Сенсей займутся возвращением цели."
22140-66 = "Разве не таков ваш план?"
22140-67 = "И, избегая прямого столкновения со мной, обладательницей оружия Рио..."
22140-68 = "Неру, которую можно назвать сильнейшей боевой единицей Миллениума, начнёт действовать, пока я связана боем..."
22140-69 = "Вы решили, что так у вас появится шанс победить."
22140-70 = "Неверно!"
22140-71 = ""
22140-73 = ""
22140-74 = ""
22140-75 = ""
22140-76 = ""
22140-77 = ""
22140-78 = "Ха-ха-ха! Опаздываешь, Президент!"
22140-79 = "Неру... Почему ты здесь?"
22140-80 = "Что ты имеешь в виду?"
22140-81 = "Разумеется, пришла на матч-реванш."
22140-82 = "Реванш...?"
22140-83 = "Если бы я пошла туда, где ты меня ждала, ты бросила бы всё здесь и пришла меня останавливать."
22140-84 = "Зачем всё так усложнять?"
22140-85 = "Я могу просто пойти спасти мелкую..."
22140-86 = "...после того как изобью тебя."
22140-87 = "Эй, младшекурсница. В прошлый раз ты неплохо прошлась по моей руке."
22140-88 = "Теперь, думаю, моя очередь."
22140-89 = ""
22140-92 = ""
22140-93 = ""
22140-95 = "...!"
22140-96 = "Я принимаю ваш вызов."
22140-97 = ""
22140-99 = ""
22140-101 = ""
22140-102 = "Ха! Отлично. Начнём!"
22140-103 = ""
22140-106 = "Вот так...!"
22140-107 = "Мы уничтожили всех дронов, перекрывавших проход!"
22140-108 = "[ns] «Сейчас, все! Приготовьтесь! Выходим на поверхность!»"
22140-114 = "Получилось! Мы снаружи!"
22140-115 = "Куда теперь?!"
22140-117 = "Думаю, Алиса должна находиться в центральной части Эриду..."
22140-118 = "В центральной башне."
22140-119 = "Судя по вашему текущему положению, добраться туда можно, если идти на север по левой дороге!"
22140-120 = "[ns] «Хорошо! Спасибо за поддержку! Тогда...»"
22140-123 = ""
22140-131 = "Прочь с дороги!"
22140-132 = ""
22140-135 = ""
22140-136 = ""
22140-139 = "Я проведу вас через город."
22140-140 = "Всем вперёд! Спасите Алису!"
22140-142 = "Следующий Эпизод: Ловушка"
