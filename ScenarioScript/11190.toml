[translation]
11190-2 = "Episódio 19;Eu Não Vou Perdoar Vocês!"
11190-3 = "Área Urbana Destruída de Abydos"
11190-4 = "(Fumaça subindo...)"
11190-6 = "Cof, cof... Uau, o prédio simplesmente desapareceu?"
11190-7 = "Cof... Mas o que diabos..."
11190-8 = "(Tonteira)"
11190-10 = "Cof, cof... U-Uaaah..."
11190-13 = "(O-O que é isso?! O que aconteceu?!)"
11190-14 = "...Aru-chan... Sério mesmo? Você explodiu tudo de verdade?"
11190-15 = "Hã... Hã?"
11190-16 = "Só pra não se apegar, você mandou pelos ares a loja de lámen que foi tão gentil com a gente?#nMandou bem, hein?!"
11190-17 = "Isso sim é coisa de uma supervilã sem coração nem piedade!#nUm ato cruel que nenhum zé-ninguém teria coragem de fazer! Você é a pior das vilãs!"
11190-18 = "Hã, ué?... Ah?"
11190-19 = "Então é isso que significa ser uma fora-da-lei linha-dura!! Incrível, Aru-chan! Subiu no meu conceito!"
11190-20 = "Hã... Ah...? ...A-Ahahahaha! M-Mas é claro!#nImpiedosa! Sem compaixão! Se pagar bem, a gente faz qualquer coisa! Esse é o nosso lema!!"
11190-21 = "Então era isso mesmo!!"
11190-25 = "Vocês...!! Como ousam fazer uma coisa tão horrível?!"
11190-26 = "..."
11190-27 = "..."
11190-28 = "Confirmei que o Mestre está a salvo! Por sorte, foram só ferimentos leves, então já o encaminhei para um abrigo próximo!"
11190-29 = "...Quer dizer que já posso quebrar tudo, né?"
11190-30 = "Eu não vou perdoar vocês. Não vou perdoar de jeito nenhum...!!"
11190-32 = "?!"
11190-33 = "Opa, falando no diabo."
11190-34 = "...O momento não foi dos melhores, mas uma hora ou outra a gente ia ter que acertar as contas com elas mesmo."
11190-35 = "Vou chamar os mercenários que contratamos pra cá."
11190-37 = "..."
11190-38 = "...I-Isso mesmo!! Agora vocês entenderam, Abydos?! Viram o tamanho da vilã que eu sou!"
11190-39 = "Vamos lá, hora do acerto de contas!! Podem vir com tudo!"
11190-40 = "Eu vou dar cabo de todas até não sobrar nenhuma, Aru-sama."
11190-43 = "Estão preparadas?!"
11190-44 = "(Clic-clac)"
11190-45 = "É hora do castigo~!"
11190-49 = "Essa fala é minha!! Vou mostrar a vocês o que é uma verdadeira fora-da-lei!!"
