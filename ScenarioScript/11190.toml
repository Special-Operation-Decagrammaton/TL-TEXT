11190-26 = "..."
11190-27 = "..."
11190-28 = "Состояние хозяина Шибы подтверждено. К счастью, он получил только поверхностные ранения, поэтому ему окажут помощь в ближайшем убежище!"
11190-29 = "Отлично. Значит, теперь можно не сдерживаться, верно?"
