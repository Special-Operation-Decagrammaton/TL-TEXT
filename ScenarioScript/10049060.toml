[translation]
10049060-1 = "Эпизод 6;Отряд линчевателей никогда не отступает!"
10049060-2 = "..."
10049060-3 = "Ай! А-а..."
10049060-4 = "Прости, Рейса. Это дезинфектор. Будет щипать."
10049060-5 = "Порез довольно серьёзный. Ты крепкая."
10049060-6 = "Хи-хи. Ничего страшного! Я привыкла к таким царапинам."
10049060-7 = "В конце концов, я суперзвезда Рейса из Отряда линчевателей!"
10049060-8 = "И ЕЩЁ я Термитовая Розовая, волшебница справедливости!"
10049060-9 = "Мне многому стоит у тебя поучиться, Рейса."
10049060-10 = "..."
10049060-11 = "Всё это — полный бардак."
10049060-12 = "Всё пошло не так."
10049060-13 = "[s1] «Тяжело одновременно играть роль и драться.»\n[s2] «Бывают такие дни.»"
10049060-16 = "Я не только про сегодняшний день, Сенсей."
10049060-17 = "Я про всё с самого момента, когда основала Отряд линчевателей."
10049060-18 = "...Нет, я была в полном беспорядке ещё до этого."
10049060-20 = "Сузуми...?"
10049060-21 = "Не возражаете, если я немного выговорюсь?"
10049060-22 = "Я понимаю, что этим могу ещё сильнее вас нагрузить..."
10049060-23 = "...но всё же, если вы не против..."
10049060-24 = "[s3] «Я понесу этот груз вместе с тобой. В любое время.»\n[s4] «Не спеши и говори всё, что тебе нужно.»"
10049060-27 = "Мы же товарищи по Отряду линчевателей!"
10049060-28 = "Я, Узава Рейса, помогу тебе облегчить этот груз!"
10049060-29 = "...Спасибо."
10049060-30 = ""
10049060-32 = ""
10049060-33 = "Ну, иногда я слышу, как люди спрашивают..."
10049060-34 = "«Почему Моризуки Сузуми не вступит в Отряд справедливости?» «Что вообще за Отряд линчевателей?» «Она что, ненавидит Отряд справедливости?»"
10049060-35 = "Не просто «иногда». Такое спрашивают часто."
10049060-36 = "..."
10049060-37 = ""
10049060-40 = "Ты же занимаешься этим только потому, что не смогла попасть в Отряд, да?"
10049060-41 = ""
10049060-44 = ""
10049060-45 = "..."
10049060-46 = "...Дело в том, что я БЫЛА в Отряде справедливости, когда училась на первом курсе."
10049060-47 = ""
10049060-49 = ""
10049060-50 = "Ты была в Отряде? Правда?"
10049060-51 = "...Но ушла вскоре после вступления."
10049060-52 = "И... я не то чтобы много об этом рассказывала."
10049060-53 = "Я хотела просто закрыть все незавершённые вопросы и закончить эту главу... но всё не всегда идёт так, как мне хочется."
10049060-54 = "Наверняка ты об этом слышала, Маширо."
10049060-55 = "...Кое-что, да."
10049060-56 = "Я слышала, что когда-то ты состояла в Отряде справедливости."
10049060-57 = "...Понятно."
10049060-58 = "Слухи неизбежны, поэтому, конечно, люди будут что-то обо мне слышать."
10049060-59 = "Но неправда то, будто у меня был какой-то серьёзный конфликт с кем-то из Отряда или я считала сам Отряд несправедливым."
10049060-60 = "На самом деле причина гораздо мельче, отчего мне ещё неловче."
10049060-61 = "...Мне просто было трудно там прижиться, и я боялась остаться одна... поэтому сбежала."
10049060-62 = "[ns] «Наверное, тебе было трудно к ним привыкнуть.»"
10049060-63 = "Хорошо, Сенсей."
10049060-64 = "Отряд справедливости — огромная организация, где у каждого есть своя определённая роль и правила."
10049060-65 = "И естественно, люди с похожими обязанностями тянутся друг к другу."
10049060-66 = "Едят вместе, болтают о мелочах, запоминают лица друг друга..."
10049060-67 = "И мне неловко это признавать... но у меня такое получалось очень плохо."
10049060-68 = "Даже когда я садилась с кем-то поговорить, всегда боялась, что темы закончатся."
10049060-69 = "...Точнее, я боялась, что именно я убью разговор."
10049060-70 = "Поэтому часто пыталась насильно тянуть такие разговоры дальше и дальше."
10049060-71 = "Впервые об этом слышу..."
10049060-72 = "А когда я ушла, почувствовала огромное облегчение. Будто мне больше не придётся этого делать."
10049060-73 = "Тогда это было одной из моих главных проблем. Даже если другим было всё равно, неловкая я или нет, меня это постоянно тревожило."
10049060-74 = "Я всё время думала: «А что, если я их подведу?» или, если у меня что-то хорошо получалось: «А что, если я выставлю их хуже?»"
10049060-75 = "Особенно когда они считали меня другом..."
10049060-76 = "...и когда вокруг была опасность, все эти нарушители и прочее."
10049060-77 = "Так что... я ушла из Отряда справедливости."
10049060-78 = "...Вот такая история Моризуки Сузуми, социально неловкой трусихи."
10049060-79 = "[ns5] «Нет, Сузуми. Ты не трусиха.»\n[ns6] «Сколько я тебя знаю, ты всегда была смелой.»"
10049060-82 = "[ns7] «Я помню, как мы впервые сражались вместе.»\n[ns8] «Ты сразу шагнула вперёд, ни секунды не колеблясь.»"
10049060-85 = "Сенсей..."
10049060-86 = "Сенсей прав!"
10049060-87 = "Ты одна из самых смелых и крутых людей, которых я знаю, Сузуми!"
10049060-88 = "И в Отряде линчевателей ты отлично справляешься!"
10049060-89 = "Это ТЯЖЁЛАЯ работа, но ты всегда выглядишь такой уверенной и крутой, когда её делаешь!"
10049060-90 = "Ну, я просто решила, что КТО-ТО должен патрулировать улицы, так что почему бы мне не внести свой вклад."
10049060-91 = "Хотя вообще-то Отряд справедливости и должен быть этим «кем-то», а я от них сбежала."
10049060-92 = "Может, я боялась быть тем самым человеком или хотя бы ТАКИМ человеком."
10049060-93 = "«Бегающая светошумовая граната Тринити.» Мне не особенно нравится это прозвище."
10049060-94 = "Но, если честно..."
10049060-95 = "Часть меня всё-таки его любила."
10049060-96 = "Немного неловко признавать, но благодаря ему другие хотя бы не слышат имя «Моризуки Сузуми.»"
10049060-97 = "А теперь ещё есть «Термитовая Белая.» Я знаю, это просто персонаж, но... это имя мне не противно."
10049060-98 = "[s9] «Светошумовая граната» — крутое прозвище!\n[s10] «А мне всегда казалось, что „Сузуми“ звучит красиво.»"
10049060-101 = "..."
10049060-102 = "Вы всегда так добры, Сенсей."
10049060-103 = "Но как бы то ни было, я собираюсь уйти из Отряда линчевателей."
10049060-104 = "...Хотя, конечно, и уходить-то особо не из какого «отряда»."
10049060-105 = "У него нет никакой настоящей власти."
10049060-106 = "Просто внезапные вспышки насилия... от человека вроде меня, которому вообще не место там."
10049060-107 = "Избивать людей без чьего-либо разрешения или квалификации..."
10049060-108 = "Полагаю, до сих пор это было своего рода... самоудовлетворением. Когда я отпускаю себя на улицах, мне больше не нужно сдерживаться."
10049060-109 = "В некотором смысле я не так уж отличаюсь от головорезов, с которыми дерусь."
10049060-110 = "Неверно!"
10049060-111 = ""
10049060-113 = ""
10049060-114 = "Совершенно неверно!"
10049060-115 = "Рейса?!"
10049060-116 = "НИКТО не имеет права говорить о тебе плохо, Сузуми! Даже ты сама!"
10049060-117 = "С тех пор как ты мне помогла... ты мой герой!"
10049060-118 = "И ты НЕ просто выходишь на улицу и бьёшь людей, чтобы самой стало лучше!"
10049060-119 = "Ты выходишь в патруль, когда идёт дождь, шторм, когда ноги болят. Неважно! Ты всегда там! Это НЕ МОЖЕТ быть приятно, но ты всё равно это делаешь!"
10049060-120 = "Неважно, состоишь ты ещё в Отряде или нет!"
10049060-121 = "Ты ИМЕЕШЬ право делать то, что делаешь, и ты НИКАКАЯ не бандитка!"
10049060-122 = "Кроме того... мне нравится ходить с тобой в патрули!"
10049060-123 = "Мы делимся наушниками и постоянно натыкаемся на всякие забавные вещи!"
10049060-125 = "..."
10049060-126 = "Я рада, что ты так думаешь, Рейса."
10049060-127 = ""
10049060-129 = ""
10049060-130 = ""
10049060-132 = "Даже когда дождь льёт стеной, все лавки с сахарной ватой закрываются, а головорезы расходятся по домам..."
10049060-133 = "...ты всё ещё там!"
10049060-134 = "Как бы тяжело ни было, ты продолжаешь защищать порядок. Вот что отличает тебя от этих головорезов!"
10049060-135 = "Потому что, как настоящая волшебница, ты всегда на стороне справедливости!"
10049060-136 = "Всегда... на стороне справедливости."
10049060-137 = "Спасибо за добрые слова."
10049060-138 = "Я правда очень их ценю..."
10049060-139 = ""
10049060-142 = ""
10049060-143 = "...но прости."
10049060-144 = "Эх, Сузуми..."
10049060-145 = "Ты ведь... на самом деле не уйдёшь из Отряда линчевателей, правда?"
10049060-146 = "..."
10049060-147 = ""
10049060-148 = "[ns] «Рейса.»"
10049060-149 = "Что?"
10049060-150 = "[s] «Подойди сюда на минутку...»"
10049060-155 = "Что такое, Сенсей?"
10049060-156 = "[s] «Давай дадим Сузуми немного времени.»"
10049060-157 = "Но... от одной МЫСЛИ, что она уйдёт..."
10049060-158 = "...у меня сердце болит."
10049060-159 = "Она столько для меня сделала..."
10049060-160 = "...а я совсем не могу ей помочь..."
10049060-161 = "Если она уйдёт, я никогда не смогу отплатить ей."
10049060-162 = "[ns] «Она не будет так на это смотреть.»"
10049060-164 = "[ns] «Давай доверимся Сузуми и дадим ей немного отдохнуть.»"
10049060-170 = "..."
10049060-171 = ""
10049060-176 = ""
10049060-177 = ""
10049060-178 = "[ns] «Сузуми?»"
10049060-179 = "...Да, Сенсей?"
10049060-181 = "*кашляет* *шмыгает носом* Это Маширо с поста наблюдения. Вы меня слышите?"
10049060-182 = ""
10049060-184 = ""
10049060-185 = "...Да, слышим."
10049060-186 = "Там на башне холодно? Ты звучишь так, будто простудилась..."
10049060-187 = "Вовсе нет. *шмыгает носом*"
10049060-188 = "Простите, что отвлекаю во время перерыва, но, кажется, я заметила цель."
10049060-189 = "Я вижу кого-то, кто похож на Комаказэ Рабу."
10049060-190 = "[s11] «Кого-то...»\n[s12] «...похожего на Рабу...?»"
10049060-193 = "Пожалуйста, подойдите ближе и подтвердите."
10049060-194 = ""
10049060-196 = ""
10049060-198 = "Сузуми..."
10049060-199 = "..."
10049060-200 = "...Поняла. Выдвигаюсь."
10049060-201 = "[ns] «Сузуми.»"
10049060-203 = "[ns13] «Отряд справедливости, Отряд линчевателей — сейчас это неважно.»\n[ns14] «Давайте покажем всем лучших Рейсу и Сузуми.»"
10049060-206 = "..."
10049060-207 = "...Ты права."
10049060-208 = "Нужно закончить начатое."
10049060-209 = "Пойдём найдём цель."
