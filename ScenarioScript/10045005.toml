[translation]
10045005-1 = "Пролог;Совместная прогулка Хяккарёран"
10045005-4 = "Бесконечно ясное голубое небо. Жар неумолимого солнца.#nЛето пришло!"
10045005-5 = "Это история о дружбе и юности."
10045005-7 = ""
10045005-8 = "И всё-таки почему я снова здесь?"
10045005-9 = "Такой прекрасный день следовало провести спокойно, а именно — изучая военную историю."
10045005-10 = "Так почему же, скажите на милость, я на пляже?"
10045005-11 = "Сверкающее синее море с друзьями, ясное небо и белые облака! Да ещё и освежающий купальник! Мои мечты наконец стали реальностью!"
10045005-12 = "Не будем медлить ни секунды! К воде, друзья мои!"
10045005-13 = "Идите. Развлекайтесь."
10045005-14 = ""
10045005-16 = ""
10045005-17 = "Ну же! Ты согласилась пойти со всеми нами на совместную прогулку!"
10045005-18 = "Да, согласилась. Но в какой момент я согласилась ехать именно на пляж?"
10045005-20 = "Кикё... Это... Это из-за меня? Потому что ты хотела бы быть здесь не со мной?"
10045005-22 = "Нет, вовсе нет, Юкари. Просто..."
10045005-23 = "Я не люблю активность на улице."
10045005-24 = ""
10045005-27 = ""
10045005-29 = "Кикё — само определение домоседа."
10045005-30 = "Было бы настоящим преступлением приехать так далеко и не насладиться всем, что может предложить нам великий океан!"
10045005-31 = ""
10045005-34 = ""
10045005-35 = ""
10045005-36 = "Итак, Кикё, отплываем к неизведанным водам!"
10045005-37 = "Эм..."
10045005-38 = "Кикё делает то, что хочет, Юкари. Просто оставь её."
10045005-39 = "Мы пойдём первыми! Если передумаешь — присоединяйся, ладно?"
10045005-40 = ""
10045005-42 = ""
10045005-43 = "Фуфу. Я буду с нетерпением ждать тебя в воде!"
10045005-44 = ""
10045005-46 = ""
10045005-47 = "...Фух."
10045005-48 = ""
10045005-51 = "...Прошу прощения. Именно я выбрала это место для нашей совместной прогулки."
10045005-52 = "Нет. Они были не меньше рады."
10045005-53 = "Кто я такая, чтобы портить всем настроение?"
10045005-54 = "Фуфу. Как заботливо."
10045005-55 = "Не забудьте немного размяться."
10045005-56 = "Ведь скоро всё начнётся."
10045005-57 = "Летняя традиция Хяккияко..."
10045005-59 = "[log=나구사 수영복]Водный фестиваль Хяккияко[/log]"
10045005-61 = ""
10045005-62 = ""
10045005-63 = ""
10045005-65 = "(...Как всё дошло до этого?)"
10045005-66 = "(Я уступила желанию остальных поучаствовать в водном мероприятии...)"
10045005-67 = "(Хотя я совершенно не умею плавать...!)"
10045005-68 = ""
10045005-70 = ""
10045005-72 = "Нам действительно невероятно повезло. Подумать только, из всех желающих жребий выпал каждой из нас."
10045005-73 = "...Да. Довольно неожиданный поворот событий."
10045005-74 = "(Особенно учитывая, как отчаянно я надеялась, что хотя бы меня не выберут.)"
10045005-75 = "Всё хорошо, Кикё? Может, тебя что-то тревожит?"
10045005-76 = "...Я просто разрабатывала план."
10045005-77 = "План, который приведёт нас к великолепной победе."
10045005-79 = "Очень в твоём духе."
10045005-80 = "Как всегда, я тебе доверяю."
10045005-81 = "(Именно. Я должна придумать путь к отступлению.)"
10045005-82 = ""
10045005-84 = ""
10045005-85 = "(Я не позволю всем узнать, что оперативный офицер Хяккарёран боится воды!)"
