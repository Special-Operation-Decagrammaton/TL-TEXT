[translation]
1010003-1 = "Похожее и различное"
1010003-3 = "[ns1] «То есть ты хочешь купить лотерейный билет...»\n[ns2] «...с номерами, которые помнишь из своего мира, и сорвать джекпот?!»"
1010003-6 = "Да. Я помню выигрышные номера."
1010003-7 = "[s3] «Эм... Я понимаю, почему это может сработать, но...»\n[s4] «...Насколько это вообще этично? Как ни посмотри.»"
1010003-10 = "Во всём Кивотосе только я способна применить этот метод. И раз уж мне пришла эта идея, я должна довести её до конца."
1010003-11 = "[s] «Это будет интересно... в самых разных смыслах.»"
1010003-13 = "[ns5] «Но правда ли это нормально? Мы не нарушим какой-нибудь вселенский баланс?»\n[ns6] «А как же моя преподавательская этика?!»"
1010003-14 = ""
1010003-15 = ""
1010003-17 = ""
1010003-18 = "[ns7] «Ну, отступать уже поздно! Давай!»\n[ns8] Купить лотерейный билет."
1010003-19 = ""
1010003-20 = ""
1010003-26 = "Но выигрышные номера оказались совсем не такими, какие помнила Широко."
1010003-27 = ""
1010003-35 = "Простите, Сенсей. Я зря потратила ваши 300 иен."
1010003-36 = "[s] «Не волнуйся. Мне самому всё это было очень интересно.»"
1010003-37 = "Да. Я начинаю понимать, что этот мир немного отличается от моего."
1010003-38 = "[s] «Например?»"
1010003-39 = "Трудно точно описать различия... и мои воспоминания... туманны..."
1010003-40 = "Будто я очнулась от мутного сна... а всё, что я знала, перестало существовать. Теперь даже собственное тело я воспринимаю словно чужое."
1010003-41 = "...Я не совсем правильно это объясняю. Простите."
1010003-42 = "Я не Широко из своего мира и не Широко из этого."
1010003-43 = "Различия... просто есть. Так же, как лотерейные номера оказались другими."
1010003-44 = "[s] «Но некоторые вещи всё ещё те же.»"
1010003-45 = "Да. Некоторые. Например вы, Сенсей. Это странно, но вы остаётесь неизменной величиной."
1010003-46 = "[s] «И то, что ты любишь кататься на велосипеде, тоже не изменилось.»"
1010003-47 = "..."
1010003-48 = "[s] «Широко, почему ты перестала ездить?»"
1010003-50 = "[ns9] «Ты даже сделала дома велосипедную мастерскую.»\n[ns10] «И у тебя даже есть велосипедный генератор.»"
1010003-53 = "Ну..."
1010003-54 = "В этом нет какого-то глубокого смысла. Просто... прошло очень много времени."
1010003-55 = "Раньше я легко могла проехать несколько тысяч километров. Возможно... теперь я уже не способна на такое."
1010003-56 = "Смогу ли я... правда снова ездить? Что, если мои способности ухудшились?"
1010003-57 = "Что, если я сяду на велосипед и это лишь окончательно докажет, что к прежней жизни мне уже никогда не вернуться?"
1010003-58 = "[s] «Почему ты так думаешь?»"
1010003-59 = "Что, если я очнусь от этого тумана и обнаружу, что это вовсе не Абидос, а вас здесь никогда не было?"
1010003-60 = "...Что, если всё это действительно было просто сном?"
1010003-61 = ""
1010003-63 = ""
1010003-64 = "Я бессвязно говорю, да? Простите, Сенсей."
1010003-65 = ""
1010003-67 = ""
1010003-68 = ""
1010003-69 = ""
1010003-70 = "[ns] «Я не сон, Широко.»"
1010003-71 = ""
1010003-73 = ""
1010003-74 = "[ns] «Я прямо перед тобой. Я никуда не исчезну.»"
1010003-75 = "...Так близко."
1010003-76 = ""
1010003-78 = ""
1010003-79 = "...Это я понимаю. Вы всегда были надёжной опорой, Сенсей."
1010003-80 = "Я понимаю... что неизменные вещи... всё ещё существуют..."
1010003-85 = ""
1010003-86 = "Этот путь мне знаком."
1010003-87 = "Я ехала здесь, когда отправилась в своё путешествие по Кивотосу."
1010003-88 = "На этом светофоре я остановилась, чтобы отправить сообщение в MomoTalk..."
1010003-89 = ""
1010003-91 = ""
1010003-92 = "Понятно... Я помню даже мельчайшие детали этой улицы..."
1010003-93 = ""
1010003-95 = ""
1010003-96 = "Да, Сенсей. Сюда."
1010003-97 = "[ns] «Подожди меня, Широко!»"
1010003-98 = ""
1010003-106 = ""
1010003-107 = "Вот здесь, Сенсей. Отсюда лучше всего видно улицу внизу."
1010003-108 = ""
1010003-110 = ""
1010003-111 = "[ns11] «Подожди... Широко... Я не успеваю...»\n[ns12] «Господи, как ты такая быстрая...?»"
1010003-114 = "[ns] Следовать за Широко."
1010003-120 = "― [log=시로코 테러 무소속]Да... Это место осталось прежним. [/log][wa:2390]"
1010003-121 = "― [log=시로코 테러 무소속]Возможно, изменилась только я.[/log][wa:3250]"
1010003-124 = "― [log=시로코 테러 무소속]Да... И всё же некоторые вещи остаются неизменными. Это меня успокаивает.[/log][wa:2380]"
1010003-127 = "― [log=시로코 테러 무소속]Сенсей, думаю, я попробую снова кататься на велосипеде.[/log][wa:3460]"
1010003-130 = "― [log=시로코 테러 무소속]Думаю, на пути будет немало препятствий, но...[/log][wa:10]"
1010003-131 = "― [log=시로코 테러 무소속]Мне кажется, я справлюсь... пока вы рядом со мной, Сенсей.[/log][wa:5350]"
1010003-134 = "[ns] «Я рад. Я буду болеть за тебя, Широко!»"
1010003-135 = "― [log=시로코 테러 무소속]Да. Спасибо, Сенсей.[/log][wa:2480]"
