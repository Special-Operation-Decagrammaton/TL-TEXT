[translation]
1007802-1 = "Кинугава Касуми"
1007802-2 = "Следуя указаниям Касуми, я пришёл к старому заброшенному зданию."
1007802-3 = ""
1007802-6 = "Здесь кто-то есть?"
1007802-7 = "А, Сенсей! Как раз вовремя!"
1007802-8 = "Идите сюда!"
1007802-9 = "[s1] «Значит, это правда ты, Касуми. Хорошо. Уже иду.»\n[s2] Направиться на голос Касуми."
1007802-12 = ""
1007802-17 = "Сенсей!"
1007802-18 = "Я здесь!"
1007802-19 = "Нет, не туда! Сюда!"
1007802-22 = "― [log=카스미]Ого! Уахаха![/log][wa:800]"
1007802-24 = "― [log=카스미]Лучшего момента для появления и придумать нельзя![/log][wa:10]"
1007802-27 = "― [log=카스미]Добро пожаловать, Сенсей...[/log][wa:320]"
1007802-29 = "― [log=카스미]...в моё сверхсекретное убежище! Если точно — номер 86![/log][wa:510]"
1007802-32 = "― [log=카스미]Что я здесь делаю?[/log][wa:690]"
1007802-35 = "― [log=카스미]Не могу поверить, что вам вообще пришлось спрашивать, Сенсей.[/log]"
1007802-37 = "― [log=카스미]Вы же знаете, что я всегда занимаюсь только одним.[/log][wa:380]"
1007802-40 = "― [log=카스미]Моим самым любимым делом в мире...[/log]"
1007802-42 = "― [log=카스미]Исследую новые и захватывающие места для горячих источников![/log][wa:260]"
1007802-45 = "[ns3] «Новые... места для горячих источников?»\n[ns4] «Н-Но тогда это значит...»"
1007802-46 = "― [log=카스미]Хаха! Сенсей![/log][wa:800]"
1007802-47 = "― [log=카스미]Хаха! Сенсей![/log][wa:800]"
1007802-49 = "― [log=카스미]Выражение вашего лица бесценно. Хаха![/log][wa:10]"
1007802-52 = "― [log=카스미]Кхм. В общем... Да, всё именно так, как вы думаете.[/log][wa:10]"
1007802-54 = "― [log=카스미]Я ищу идеальное место, которое можно разнести в пух и прах![/log][wa:10]"
1007802-57 = "― [log=카스미]Хм... Может, здесь?[/log][wa:2040]"
1007802-59 = "― [log=카스미]Нет. Это место не годится. Нужно что-нибудь эпичное![/log][wa:10]"
1007802-62 = "― [log=카스미]Что? Сенсей? Почему вы так на меня смотрите?[/log][wa:1840]"
1007802-64 = "― [log=카스미]Что не так?[/log][wa:680]"
1007802-67 = "Если у вас есть мнение, я с удовольствием его выслушаю."
1007802-68 = "Я знаю, что сама ищу в идеальном месте для подрыва, но иногда ценю мнение других!"
1007802-69 = "Конечно, я не слушаю мнение кого попало. Но вы же Сенсей. Разумеется, мне интересно, что думаете вы!"
1007802-70 = "А?"
1007802-71 = "О, есть вполне разумное объяснение, почему в этом месяце я уже в восемьдесят шестом убежище..."
1007802-72 = "Хаха! Ответ очевиден, Сенсей. Я в бегах!"
1007802-73 = "Геенна назначила за мою голову солидную награду, так что приходится осторожно показываться на людях."
1007802-74 = "К тому же планирование подрыва требует огромной концентрации."
1007802-75 = "А значит, мне нужно тихое место вдали от проторенных дорог, понимаете?"
1007802-76 = "Не буду утомлять вас подробностями. Главное — сам план подрыва!"
1007802-77 = "У меня назрело несколько идей. Ради развлечения я буду показывать места пальцами ног, а вы скажете, что думаете!"
1007802-78 = "Посмотрим... Хм..."
1007802-79 = "Как насчёт этого места, где универмаг? Горячий источник был бы куда лучше какого-то дурацкого магазина."
1007802-80 = "Не нравится? Хм... Тогда, может..."
1007802-81 = "Здесь? Пересадочная станция метро и так по сути огромная дыра в земле, а значит, можно копнуть ещё глубже!"
1007802-82 = "Нет? Нужно что-то посвежее, да? Хм... Ну, раз вы так говорите."
1007802-83 = "Тогда... Хм."
1007802-84 = "М-м-м-м!"
1007802-86 = "Касуми продолжала выбирать места с большим потоком людей или плотной застройкой."
1007802-87 = "Я пытался направить её к менее людным местам, но это оказалось непросто."
1007802-88 = ""
1007802-89 = "Хм...!"
1007802-90 = "Любите вы всё обдумывать, Сенсей. Что бы я ни выбрала, вы находите причину отказаться."
1007802-91 = "Ну всё, хватит! Больше не вынесу отказов!"
1007802-92 = "Следующий вариант — последний в моём списке потенциальных мест для подрыва."
1007802-93 = "Так что даже если вам не понравится, вам придётся сказать, что нравится. Поняли? Ладно, вот он..."
1007802-94 = "Это..."
1007802-95 = "[s5] «Да. Это...?»\n[s6] Нервно сглотнуть."
1007802-98 = "Вот!"
1007802-99 = ""
1007802-101 = ""
1007802-102 = "[ns7] «Незастроенная долина?»\n[ns8] «Вообще-то, это может быть...»"
1007802-105 = "Уахаха! По вашему лицу видно, что вы с облегчением вздохнули."
1007802-106 = "Или, ну... это самое недовольное выражение из всех, что было до сих пор. Ха!"
1007802-107 = "Ну что скажете, Сенсей? Это то самое место, да? Возражений нет?"
1007802-108 = "[s9] «Это место вполне подойдёт.»\n[s10] Кивнуть."
1007802-111 = "Хорошо, хорошо! Всё решилось в последний момент, но мы наконец нашли вариант, который устраивает нас обоих!"
1007802-112 = "Раз вы дали добро, я начну работу и буду сообщать о прогрессе!"
1007802-113 = "Неплохо всё сложилось, если позволите мне самой это сказать! Я довольна!"
1007802-114 = "Спасибо, что встретились со мной сегодня, Сенсей! До следующего раза!"
1007802-115 = ""
1007802-117 = ""
1007802-124 = ""
1007802-125 = "О! Чуть не забыла снаряжение!"
1007802-126 = "...ну, тогда..."
1007802-127 = "До встречи, Сенсей!"
1007802-128 = ""
1007802-130 = ""
1007802-133 = "Глядя на место, где всего несколько мгновений назад стояла Касуми, я с облегчением вздохнул."
