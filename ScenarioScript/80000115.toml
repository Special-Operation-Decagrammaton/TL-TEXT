[translation]
80000115-1 = "Сладость, которая не надоедает"
80000115-3 = "Сэн!"
80000115-4 = "Сэ!"
80000115-5 = "Й!"
80000115-6 = ""
80000115-8 = ""
80000115-9 = "Можешь прийти в Тринити через несколько дней?"
80000115-10 = "Я хочу кое-что тебе дать."
80000115-11 = "И не спрашивай что. Это секрет, хорошо?"
80000115-12 = "Ладно. Тогда увидимся."
80000115-13 = "[ns] «Через несколько дней... Понятно. Буду ждать.»"
80000115-14 = ""
80000115-15 = ""
80000115-16 = "Ч-Что? Б-Будешь ждать?"
80000115-17 = "Я-я не понимаю, о чём ты. А-аха-ха... Т-Ты ведь даже не знаешь, что я собираюсь тебе дать..."
80000115-18 = "Н-Не думай об этом слишком много... Иначе сюрприза не получится! Всё должно быть прямо «Та-дам!»"
80000115-20 = "[ns] «Не переживай. Я приду вовремя. До встречи, Мика.»"
80000115-21 = ""
80000115-22 = ""
80000115-23 = "Э-Это плохо! Сенсей, ты не должен этого ждать! Весь план испорчен!"
80000115-24 = "Ч-Что же делать?!"
80000115-25 = ""
80000115-27 = ""
80000115-29 = "Через несколько дней, после занятий в Тринити..."
80000115-30 = ""
80000115-33 = "Я пришёл к месту встречи, но Мики там не было."
80000115-34 = ""
80000115-37 = "[ns] Позвонить ей."
80000115-38 = ""
80000115-42 = "...Я занята. Кто— А?! С-Сенсей?!"
80000115-43 = "Погодите, который час— Нет!! Уже?!"
80000115-44 = "Прости, Сенсей! Подожди всего минутку! Так, эм... Таймер на... 160? Нет, это температура разогрева... Семь минут? Ладно, буду через семь минут, Сенсей!"
80000115-45 = "Мне надо п-переодеться... Ч-Что? П-Подожди! Что-то горит? О нет!!"
80000115-46 = ""
80000115-53 = "[ns] «...Хм.»"
80000115-54 = ""
80000115-57 = "[ns] «Я знаю, где она.» Отправиться туда, где засела Мика."
80000115-58 = ""
80000115-62 = "Кулинарная лаборатория №7"
80000115-63 = ""
80000115-64 = "*кашель* *кашель* Похоже, шоколад всё-таки нельзя плавить в духовке... Ух..."
80000115-65 = "...А?"
80000115-66 = "[s] «Привет, Мика.»"
80000115-67 = "С-Сенсей?!"
80000115-68 = "[s] «Я пришёл, потому что волновался.»"
80000115-69 = "В-Волновался? Как ты вообще узнал, что я здесь? П-Постой! П-Подожди!!"
80000115-70 = "Стоять! Не подходи ближе!"
80000115-71 = "[s] «...А??»"
80000115-72 = "Я... только что после физкультуры... и вся в пыли после уборки спортзала... И ещё не переоделась!"
80000115-73 = "И да... Я знаю, что у меня всё лицо в сливках и шоколаде..."
80000115-74 = "[s] «Не переживай из-за этого, Мика.»"
80000115-75 = "Да. Я так и думала, что ты скажешь что-то подобное..."
80000115-76 = "Но я-то переживаю, Сенсей! Нельзя так мучить сердце молодой девушки!"
80000115-77 = "[s] «П-Понял...»"
80000115-78 = "Подожди меня в соседнем классе. Я скоро приду."
80000115-80 = "Я решил подождать в одном из пустых классов по соседству, как попросила Мика."
80000115-81 = ""
80000115-86 = ""
80000115-87 = ""
80000115-89 = ""
80000115-90 = ""
80000115-91 = ""
80000115-92 = "Долго ждал, Сенсей?"
80000115-93 = "Прости, что опоздала. Студенту, отвечавшему за уборку спортзала, стало плохо, и я помогла закончить..."
80000115-94 = "Я собиралась предупредить, что задержусь... Но потом удивилась, увидев тебя здесь."
80000115-95 = "В любом случае... Хоть и поздновато, теперь приготовления закончены."
80000115-96 = "[s] «То, что ты прячешь за спиной?»"
80000115-97 = "...Да. Именно. Сегодня..."
80000115-98 = "Я сделала это для тебя, Сенсей."
80000115-99 = "Та-дам!"
80000115-100 = ""
80000115-102 = ""
80000115-104 = ""
80000115-105 = "Это должно было быть сюрпризом... Но аха-ха... всё пошло не по плану."
80000115-106 = "Пришлось одолжить духовку в кулинарной лаборатории... И никаких премиальных ингредиентов раздобыть не получилось."
80000115-107 = "Но я всё равно хотела приготовить сама."
80000115-108 = "Выглядит, наверное, не очень, потому что я впервые пеку... Кажется, шоколадная глазурь немного подгорела... Но... всё равно... то есть..."
80000115-109 = ""
80000115-111 = ""
80000115-113 = ""
80000115-114 = ""
80000115-115 = "Попробуй этот... ШОКОЛАДНЫЙ рулет."
80000115-116 = "[s1] «Спасибо. Для меня честь попробовать твой домашний рулет.»\n[s2] «Это и правда сюрприз! Спасибо, Мика. Выглядит замечательно.»"
80000115-117 = ""
80000115-118 = ""
80000115-120 = ""
80000115-121 = ""
80000115-122 = ""
80000115-123 = "Х-Хорошо..."
80000115-124 = "[s] «Но тебе разве ещё не надоели рулеты? Почему именно рулет?»"
80000115-125 = "Хм? Аха-ха-ха, в этом есть смысл."
80000115-126 = "Но именно рулеты я ела чаще всего, так что хорошо знаю их — от текстуры до основных вкусов..."
80000115-127 = "В первый раз с выпечкой слишком экспериментировать нельзя, правда? Поэтому я выбрала знакомое."
80000115-128 = "[s] «Хм. Вот как...?»"
80000115-129 = ""
80000115-131 = ""
80000115-132 = ""
80000115-133 = "Эм. Кстати, Сенсей, а КАК ты узнал, где я?"
80000115-134 = "Кажется, я сказала что-то про разогрев, но в Тринити десятки лабораторий с духовками..."
80000115-135 = "И я никому не говорила, что пойду сюда... Так как...?"
80000115-136 = "[s] «Ну, я запомнил твоё ежедневное расписание.»"
80000115-137 = "А-А?"
80000115-138 = "[s3] «Я знаю, в какую кулинарную лабораторию ты обычно ходишь на занятия.» \n[s4] «К тому же она была ближе всего к полю, где проходил урок физкультуры.»"
80000115-141 = "П-Понятно... Ну, наверное, это естественно... Всё-таки ты преподаватель..."
80000115-142 = "Но знать всё моё расписание..."
80000115-143 = ""
80000115-145 = ""
80000115-146 = "Хи-хи. Мне что, оказывают особое внимание как госпоже Персоне нон грата?"
80000115-147 = "Ну... всё равно мне от этого немного приятно."
80000115-148 = "[s5] «Нет, я видел, как усердно ты работала.»\n[s6] «Я знаю, тебе пришлось нелегко, Мика. Так что не падай духом.»"
80000115-149 = ""
80000115-150 = ""
80000115-152 = ""
80000115-153 = ""
80000115-154 = "...Хорошо!"
