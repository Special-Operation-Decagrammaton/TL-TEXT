[translation]
2005902-1 = "Бесёнок и злодейка"
2005902-2 = "Позже Муцуки пришла ко мне в офис."
2005902-4 = "Алло, Сенсей?"
2005902-5 = "[s] «Ты сегодня прямо нарядилась.»"
2005902-6 = "Да. И на то есть хорошая причина."
2005902-7 = "Видите ли, один мой личный знакомый попросил выполнить работу."
2005902-8 = "Мне нужно изображать юную леди из богатой семьи."
2005902-9 = "Причём с ужасным характером... Можно сказать, настоящую злодейку."
2005902-10 = "[s] «Ч-Что это вообще за работа...?!»"
2005902-11 = "Конфиденциально. Соглашение о неразглашении и всё такое."
2005902-12 = "Суть в том... что я хотела на ком-нибудь потренироваться."
2005902-13 = "Я ведь такая хорошая девочка, поэтому это может быть сложно. Сенсей... Вы поможете, правда?"
2005902-14 = "[s] «Да! Предоставь это мне!»"
2005902-15 = "Куфуфу. Я знала, что вы так скажете."
2005902-16 = "Ну что, начнём?"
2005902-17 = "..."
2005902-19 = "...!"
2005902-20 = "О-хо-хо..."
2005902-21 = "О-хо-хо-хо!"
2005902-22 = ""
2005902-23 = "Её атмосфера полностью изменилась...!"
2005902-24 = "Эй, ты! Эта леди жаждет пить. Немедленно принеси мне освежающий напиток!"
2005902-25 = "Чего стоишь с отвисшей челюстью и слюни пускаешь? Не знаешь, какое угощение подобает такой леди, как я?"
2005902-26 = "[s] «М-Может, принести чаю...?»"
2005902-27 = "О-хо-хо, значит, в этой милой головке всё-таки есть мозг."
2005902-28 = "Ну же. Немедленно принеси."
2005902-29 = "...Пока моё терпение не закончилось."
2005902-30 = "[s] «Ого, Муцуки. Это и правда было очень по-злодейски!»"
2005902-31 = "Ты. Что ты там лепечешь?"
2005902-32 = "Даю три секунды исчезнуть из поля зрения. И вернуться с достойным чаем!"
2005902-33 = "[s] «Я-я сейчас!»"
2005902-34 = ""
2005902-39 = ""
2005902-40 = "[ns] «Вот!»"
2005902-41 = "Это..."
2005902-42 = "...улун?!"
2005902-43 = "Как ты смеешь приносить такой простонародный чай леди вроде меня. Это шутка?"
2005902-44 = "[s] «Но сейчас у меня есть только улун...»"
2005902-45 = "*вздох* Так не пойдёт. Похоже, тебе нужна коррекция. Придётся наказать."
2005902-46 = "Ну же. Ложись. Будешь моим стулом."
2005902-47 = "[s] «Офисное кресло вон там... наверное, удобнее...»"
2005902-48 = "Скучно. Банально. Для такой леди, как я, это не подходит."
2005902-49 = "Так что встань на колени и будь моим стулом. Сейчас же."
2005902-50 = "Считай это честью. Не каждому так везёт."
2005902-51 = "[s] «П-Понял!»"
2005902-53 = "Я быстро опустился на пол и стал стулом Муцуки."
2005902-55 = ""
2005902-56 = "О-хо-хо-хо! Так тебе и надо!"
2005902-57 = "Ну как ощущения? Быть всего лишь игрушкой, предметом для леди намного младше тебя?"
2005902-58 = "Быть униженным под задницей маленькой девочки!"
2005902-59 = "[s] «М-Мне нравится?»"
2005902-60 = "А? Тебе не неудобно?"
2005902-61 = "[s] «Для такой милой девушки, как ты, Муцуки, — всё что угодно!»"
2005902-62 = "..."
2005902-63 = "Пффффф...!"
2005902-64 = "Ха-ха-ха!"
2005902-65 = "Ох, Сенсей! Ахахаха! Это так смешно, я больше не могу продолжать!"
2005902-66 = ""
2005902-68 = ""
2005902-69 = ""
2005902-70 = "[ns] «А? Уже всё?»"
2005902-71 = "Куфуфу. Только не говорите, что хотели продолжения?"
2005902-72 = "Или предпочитаете увеличить интенсивность? Добавить стек или хлыст?"
2005902-73 = "Сенсей, как вам хорошая порка?"
2005902-74 = "[s] «Н-Ну...!»"
2005902-75 = "Ахахаха. Шучу. Это уже не нужно."
2005902-76 = "Таков мой персонаж!"
2005902-77 = "Ну как? Я правда выглядела злодейкой? Вы поверили?"
2005902-78 = "[s] «Да. Я даже не задумываясь выполнял твои приказы!»"
2005902-79 = "Ахахаха! Очень смешно было смотреть, как вы пугаетесь, Сенсей."
2005902-80 = "А. Я так насмеялась, что пить хочется. Есть что-нибудь?"
2005902-81 = "[s] «Как насчёт улуна, миледи?»"
2005902-82 = "О, того самого, что раньше?"
2005902-83 = "Куфуфу, конечно. Почему нет? Я люблю улун."
2005902-86 = "Ах, освежает!"
2005902-87 = "После этого мы с Муцуки ещё немного поболтали."
2005902-88 = "Почему-то её аристократическое «о-хо-хо-хо» застряло у меня в голове."
2005902-89 = ""
2005902-91 = ""
2005902-92 = "О-хо-хо-хо...!"
