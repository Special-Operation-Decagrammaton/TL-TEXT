1600802-69 = "Не притворяйтесь, будто не понимаете, о чём я!"
1600802-70 = "Вы, кадеты Бюро общественной безопасности... До вас просто невозможно достучаться."
1600802-71 = "Я связываюсь по поводу баррикады, которую ваше бюро брало взаймы.#nКогда вы её вернёте?"
1600802-72 = "Бюро безопасности хотело бы получить её обратно как можно скорее."
1600802-73 = "«Почему бы вам не обратиться в Бюро безопасности?»"
1600802-74 = "Простите? Это И ЕСТЬ Бюро безопасности!"
1600802-75 = "Вы нас за идиотов держите?"
1600802-76 = "«Ага, я тоже так думаю.»"
1600802-77 = ""
1600802-80 = "..."
1600802-81 = "Это неприемлемо."
