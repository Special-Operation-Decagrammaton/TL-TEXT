1600802-37 = "«Фубуки, помнишь о собрании завтра утром? Не опаздывай!»"
1600802-38 = "«Ага, знаю. Не переживай.»"
1600802-39 = "«Фубуки, ты видела журнал патрулирования за прошлую неделю? Мне нужно написать отчёт, а я никак его не найду.»"
1600802-40 = "«Не знаю... Обратись в Бюро безопасности.»"
1600802-41 = "Видите? Круто, да?"
1600802-42 = "Алгоритм не идеален, но большую часть задач всё равно может перекидывать другим отделам."
1600802-43 = "А я тем временем могу заниматься чем-нибудь более полезным."
1600802-44 = "Например, спать, перекусывать..."
1600802-45 = "[s3] «А такое вообще разрешено?»\n[s4] «А если случится что-то действительно важное?»"
1600802-46 = "Не переживайте. В Бюро общественной безопасности НИКОГДА не бывает ничего важного."
1600802-47 = "Не переживайте. В Бюро общественной безопасности НИКОГДА не бывает ничего важного."
1600802-48 = "Нам только и поступают надоедливые жалобы, на которые приходится раз за разом отвечать одно и то же."
1600802-49 = "А если вдруг поступит что-то серьёзное, с чем макрос не справится, Кирино всё равно разберётся сама. Мне и пальцем шевелить не нужно."
1600802-50 = "[s] «Но...»"
1600802-51 = "*зевает* Блин, спать хочется. Наверное, потому что мой сон прервали."
1600802-52 = "Я пойду снова посплю. Последите тут за всем вместо меня,#nладно, Сенсей? Проверьте, чтобы макрос продолжал работать."
