1600802-63 = "Это Бюро безопасности. Как продвигается работа, кадет Фубуки?"
1600802-64 = "«Ага, знаю. Не переживай.»"
1600802-65 = "«Я работаю усерднее обычного.»"
1600802-66 = "Простите? Следите за манерами."
