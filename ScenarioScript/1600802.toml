1600802-30 = "[s] «Макрос?»"
1600802-31 = "Ага. Я переделала программу-макрос, которую купила у «Миллениума», и сделала что-то вроде автоответчика, способного выполнять мою работу."
1600802-32 = "Когда он включён, то автоматически обрабатывает жалобы граждан, поступающие в Бюро общественной безопасности."
1600802-33 = "Например..."
