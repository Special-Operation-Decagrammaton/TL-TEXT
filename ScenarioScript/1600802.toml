1600802-18 = "Если у вас какая-то надоедливая просьба, советую найти Кирино или кого-нибудь ещё. Мне ещё отсыпаться и отсыпаться."
1600802-19 = "[s1] «Ты всё это время спала? Но MomoTalk...»\n[s2] «А как же сообщение, которое ты отправила мне в MomoTalk?»"
1600802-20 = "MomoTalk? Не знаю, о чём вы. Я весь день спала."
