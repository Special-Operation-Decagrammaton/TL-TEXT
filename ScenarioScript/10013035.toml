10013035-65 = "[ns] «Изуна! Смотри, куда показывает Чисэ! Это цель для ниндзя!»"
10013035-66 = ""
10013035-68 = ""
10013035-69 = "Да, господин! Как пожелаете!"
10013035-70 = "Стиль Изуны! Секретное оружие души!"
10013035-71 = "Сюрикен! Я-а!"
10013035-72 = ""
10013035-80 = "Ч-Ч-Что?! Что это было?"
10013035-81 = "Это была летающая бомба? Впечатляет."
10013035-82 = "Какие продвинутые технологии. Я такого не ожидала!"
10013035-83 = ""
10013035-87 = ""
10013035-89 = ""
10013035-91 = ""
10013035-93 = ""
10013035-94 = "Н-Неужели это..."
10013035-95 = "Атака Изуны... вызвала это?"
10013035-96 = "Г-Г-Г-Г-Г..."
10013035-97 = "Горячие источники!"
10013035-99 = "Президент Касуми! Вы не дали мне закончить реплику!"
10013035-100 = "Какая разница! Мэгу! Подготовь всех!"
10013035-102 = "А-а как же наша битва...?"
10013035-104 = "Кому нужна эта тупая битва? Ты воду не видишь?!"
10013035-105 = "Ага! Все из Отдела горячих источников! Готовьтесь!"
10013035-107 = "Горячие источники! Горячие источники!"
