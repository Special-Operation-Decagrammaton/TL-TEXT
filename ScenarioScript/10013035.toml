10013035-178 = "Вообще-то..."
10013035-179 = "Эм-м, ну..."
10013035-180 = "Я решила!"
10013035-181 = "Я хочу оставить это место вам."
10013035-182 = "[s] «Шизуко?»"
10013035-183 = "Что ты имеешь в виду?"
10013035-184 = "Давайте заключим сделку."
10013035-185 = "Я не заберу ваш контракт — за определённую цену."
10013035-186 = "Оставайтесь здесь и управляйте любимым курортом горячих источников."
10013035-187 = "...А? Почему? А как же Охота на курорты?"
10013035-188 = "Ну, вы ведь всё ещё хотите найти глубоководные горячие источники, верно?"
10013035-189 = "Да! Да! Мы всё ещё не достигли настоящей цели. Правда, президент?!"
10013035-190 = "Не достигли, но..."
10013035-191 = "Хм-м... Ты даёшь нам какую-то возможность? Хочешь заключить сделку?"
10013035-193 = "Да. Как владелица Момоёдо, я предлагаю партнёрство."
10013035-194 = "О, вроде франчайзингового договора."
10013035-195 = "Франчайзинг... Да, примерно так!"
10013035-196 = "Ну... Что скажете?"
10013035-197 = "Хм..."
10013035-198 = ""
10013035-200 = ""
10013035-201 = "Ва-ха-ха! Да, идея интересная! Неплохо!"
10013035-202 = "Нас не только не наказывают за разработку источников, но ещё и предлагают сотрудничать... Такое и правда редко бывает!"
10013035-203 = "Знаете что? Почему бы и нет! Давайте работать вместе, босс!"
