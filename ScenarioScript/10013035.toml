[translation]
10013035-3 = "Ва-ха-ха! Чувствую жар! Никто не хочет уступать! Идеальная ситуация для разработки горячих источников!"
10013035-4 = "Сожгите всё, что мешает разработке!"
10013035-6 = "Вы слышали! Это приказ президента Касуми!"
10013035-7 = "В атаку во имя разработки! Если придётся — сожгите весь мир!"
10013035-8 = ""
10013035-10 = ""
10013035-12 = ""
10013035-13 = ""
10013035-14 = "Да! Сжечь всё!"
10013035-16 = "Чисэ! Ты не на той стороне!"
10013035-17 = "Уgh. Почему они такие?"
10013035-18 = "Что за странные люди настолько одержимы разработкой горячих источников?"
10013035-19 = "[s] «Наверное, те, кто вступает в Отдел горячих источников?»"
10013035-20 = "Спасибо, Капитан Очевидность!"
10013035-22 = "Если мы победим, вы удостоитесь чести стать рабочими Отдела горячих источников!"
10013035-23 = "Примите жизнь разработчика источников! Вы ещё полюбите её! Ва-ха-ха!"
10013035-24 = "[s] «Посвятить всё лето копанию под палящим солнцем...»"
10013035-26 = "Я на это не подпишусь!"
10013035-27 = "Босс! Не думаю, что мы ещё долго продержимся."
10013035-28 = "Шизуко! Нужно что-то придумать, и быстро."
10013035-29 = "Знаю, знаю! Нужно выбить их из равновесия."
10013035-30 = "А! Иногда самый прямой ответ — лучший."
10013035-31 = "Захватить президента Отдела горячих источников... и обезвредить её!"
10013035-33 = "Как захватывающе! Фестиваль обезглавливания наших врагов."
10013035-34 = "Ого, босс! Вы и правда безжалостная хозяйка Момоёдо!"
10013035-35 = "Эм... Эм-м..."
10013035-36 = "С-Шизуко! Твой план страшнее некоторых сцен из исторических драм Изуны! И-и!"
10013035-37 = "[s] «Шизуко даже страшнее фанатиков горячих источников...»"
10013035-38 = "Хватит перевирать мои слова! Я сказала только захватить её!"
10013035-39 = "Хватит болтать! Надеюсь, вы готовы стать рабочими!"
