10013035-129 = "...Как, чёрт возьми, они построили это так быстро?"
10013035-130 = "Я впечатлена!"
10013035-131 = "Вот это другое дело! Не совсем те глубоководные источники, которые я представляла, но сойдёт!"
10013035-132 = "Твоя бомба сделала вполне приличный горячий источник!"
10013035-133 = "Как вам двоим удалось найти этот гейзер? Синеволосая и черноволосая с лисьими ушами. Не хотите вступить в Отдел горячих источников?"
10013035-134 = "Жизнь с горячими источниками — отличная жизнь!"
10013035-135 = "...?"
10013035-136 = "Изуна просит прощения! Изуна уже состоит в Клубе исследования ниндзюцу!"
10013035-137 = "Вот как? Жаль."
10013035-138 = "Все, обратно к работе! Финальные штрихи важнее всего!"
10013035-139 = "П-Погодите! А что будет с битвой и контрактом?!"
10013035-140 = "О, это..."
10013035-141 = "Хммм..."
10013035-142 = "...Наверное, мы проиграли?"
10013035-143 = "А?"
10013035-144 = "Вы нашли горячий источник раньше нас!"
10013035-145 = "Так что всё именно так! Жаль, но мы честно проиграли."
10013035-146 = "[s] «Почему мне кажется, что вам с самого начала было всё равно...?»"
10013035-147 = "Ну что ж, к следующему!"
10013035-148 = "Президент Касуми! А как же глубоководные горячие источники?!"
10013035-149 = "Будут ещё возможности."
10013035-150 = "Мы обязаны с честью уступить победителям!"
10013035-151 = "Хм-м. Мне это не очень нравится... но раз вы так говорите, президент Касуми..."
10013035-152 = "Ну же, Мэгу. Тот, кто нашёл горячий источник, не может быть совсем плохим. Давайте доверим это место им!"
10013035-153 = "О! Логично!"
10013035-155 = "И что именно здесь логично?"
10013035-156 = "Да-да! Жаль, что мы не смогли разработать наши глубоководные источники, но оставим это вам!"
10013035-157 = "А..."
10013035-158 = "[s] «Отличная работа, Шизуко. Ты добыла свой первый контракт.»"
10013035-159 = "Да! Теперь мы на шаг ближе к цели, Шизуко!"
10013035-160 = "Д-Да, но..."
10013035-161 = "Это..."
10013035-163 = "Тогда до встречи!"
10013035-164 = ""
10013035-166 = ""
10013035-167 = ""
10013035-169 = "Стой!"
10013035-170 = ""
10013035-174 = ""
10013035-175 = "А? Что-то не так?"
