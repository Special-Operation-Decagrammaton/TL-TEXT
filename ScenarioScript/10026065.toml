[translation]
10026065-7 = "Фух! Это был последний..."
10026065-8 = "Всё прошло отлично! Даже освежает, почти как стирка в соборе!"
10026065-9 = "Сенсей...? Что случилось?"
10026065-10 = "В-Вы ранены?! О нет! Я была уверена, что заблокировала их всех!"
10026065-11 = "О! С вами всё хорошо? Какое облегчение..."
10026065-12 = "Если бы вы пострадали из-за моего упрямства, у меня бы сердце разбилось—"
10026065-13 = ""
10026065-19 = "О! Слышите? Что ТЕПЕРЬ происходит?"
10026065-20 = "Ч-Что это за звук?! Будто взорвалась граната, а потом..."
10026065-21 = "С-Сенсей?! Хината...?"
10026065-23 = "Рада видеть, что вы оба целы. Но что это был за грохот?"
10026065-24 = "А, эм... Звук гранаты?"
10026065-25 = "*ахает*"
10026065-26 = "Это— то есть, я... эм..."
10026065-27 = "Ничего! Тебе совершенно не о чем беспокоиться!"
10026065-28 = "Правда! Не позволяй паре маленьких взрывов гранат отвлекать тебя от расследования."
10026065-29 = "Что значит «не о чем»? Взорвались десятки гранат. По-моему, это как раз повод для беспокойства."
10026065-30 = "Есть предел тому, сколько всего можно просто отмахнуться и назвать пустяком..."
10026065-31 = "[s1] «Мы знаем. Но это правда было ничего страшного. Не волнуйся.»\n[s2] «Ничего не случилось! Всё в порядке!»"
10026065-34 = "И вы тоже, Сенсей...?"
10026065-35 = ""
10026065-37 = ""
10026065-38 = "Вот как."
10026065-39 = "Вы двое устали ждать нас и решили немного потренироваться в стрельбе, да? Хорошо. Вернёмся внутрь и закончим расследование, Уи."
10026065-40 = "...?"
10026065-41 = "Что происходит? Почему вы все так странно себя ведёте? Это какая-то шутка?"
10026065-42 = "Уи, успокойся. Если Сенсей говорит, что всё в порядке, значит так и есть. Если бы случилось что-то серьёзное, нас бы позвали. А теперь идём..."
10026065-43 = "Мы просто сначала проверим, что здесь произошло, хорошо? Пожалуйста... Слушай, когда с тобой разговаривают..."
10026065-45 = "К-О-Д-З-Э-К-И?"
10026065-46 = "А! Не пугай меня так!"
10026065-47 = "...Ладно, хорошо! Я не знаю, что происходит, но... я вернусь внутрь, ясно?!"
10026065-48 = "Ну, просто чтобы продолжить исследование..."
10026065-49 = ""
10026065-51 = ""
10026065-53 = "...Хи-хи. ♡"
10026065-54 = "[s] «Спасибо, Ханако.»"
10026065-55 = "Ой, даже не знаю, за что вы вдруг меня благодарите..."
10026065-56 = "Кохару, пойдём за Уи?"
10026065-57 = "Хм...? Эм, да..."
10026065-58 = ""
10026065-60 = ""
10026065-62 = "[ns3] «Не верится, что у тебя получилось.»\n[ns4] «Было довольно громко.»"
10026065-65 = "Ахаха... Ну, думаю, всё прошло неплохо..."
10026065-66 = "Хоть раз... Хахаха..."
10026065-67 = "Я не собиралась этого делать, но... думаю, пусть это останется нашим маленьким секретом."
10026065-68 = "Хотя Сестре, наверное, не стоит заниматься подобным... Хм... Надеюсь, всё в порядке."
10026065-69 = "[s5] «Конечно, всё в порядке.»\n[s6] «Слушай. Почему бы тебе не отдохнуть остаток дня?»"
10026065-72 = ""
10026065-74 = ""
10026065-75 = "...Хи-хи... Спасибо, Сенсей."
10026065-76 = "Мне гораздо проще расслабиться, когда именно вы это говорите, Сенсей."
10026065-77 = "В таком случае я последую вашему совету."
10026065-78 = ""
10026065-80 = ""
10026065-81 = "Я сохраню это в секрете."
10026065-83 = "Остаток дня я провёл, отдыхая и присматривая за Хинатой и багажом."
