[translation]
1701-1 = "Призрак в палате, часть 1"
1701-2 = "Палата Главной больницы Святой Терезы"
1701-3 = "Рыцари исправительного курса прибыли!"
1701-4 = "Где пациенты? Если вам плохо, поднимите руку и крикните погромче!"
1701-5 = "Тс-с... Ханаэ, ты слишком громкая. Здесь много больных, пожалуйста, говори тише."
1701-6 = "А я не согласна. Может, тревога и корень всех болезней, зато смех — универсальное лекарство, правда?"
1701-7 = "Если все будут улыбаться и громко петь вместе, то мигом поправятся!"
1701-8 = "Ха-ха. И то верно. Благодаря бодрой энергии Ханаэ жизнь в больнице уже не кажется такой скучной."
1701-9 = "Мне достаточно просто посмотреть на улыбку Ханаэ, чтобы почувствовать прилив сил."
1701-10 = "Хи-хи. Рада это слышать."
1701-11 = "О, Широяги. Это же хлеб с обеда. Ты не доела?"
1701-12 = "Просто в последнее время у меня совсем нет аппетита. Не знаю, почему мне не хочется есть..."
1701-13 = "Так нельзя... Чтобы быть здоровой, нужно получать достаточно питательных веществ!"
1701-14 = ""
1701-15 = ""
1701-17 = "Давай я тебя покормлю. Открой рот пошире!"
1701-18 = "Так нечестно, это особое отношение! Сэрина, покорми и меня!"
1701-19 = "И меня, и меня!"
1701-20 = "Все прекратите вести себя как дети, а не то я расскажу старшей медсестре! И не смотрите на меня такими грустными глазами — не подействует!"
1701-21 = "Если будет пациент с травмированными руками, я сама покормлю его хлебом!"
1701-22 = ""
1701-23 = ""
1701-24 = ""
1701-25 = "Несмотря на учёбу, они каждые выходные добровольно приходят в больницу ухаживать за пациентами... Рыцари исправительного курса и правда ангелы!"
1701-26 = "Вот именно. Стоит мне на них посмотреть — и сердце наполняется теплом... Наверное, даже злой дух рядом с ними превратился бы в милого ягнёнка."
1701-27 = "Ага, точно!"
1701-29 = "Вестибюль Главной больницы Святой Терезы"
1701-30 = "Старшая медсестра, я закончила обход третьего этажа. У всех пациентов всё хорошо."
1701-31 = "Отличная работа. Никто из пациентов не доставлял вам проблем?"
1701-32 = "Нет! Все были добры и приветливы. Мне очень понравилось с ними знакомиться!"
1701-33 = "Рада слышать. Если подумать, атмосфера в больнице стала намного позитивнее, а жалоб от пациентов стало гораздо меньше. И всё благодаря Рыцарям исправительного курса."
1701-34 = "Мы просто делаем свою работу, хе-хе."
1701-35 = "Если кому-то понадобятся мы, Рыцари исправительного курса, обязательно зовите!"
1701-36 = ""
1701-37 = "Кстати... у меня есть вопрос."
1701-38 = "Какой, Сэрина?"
1701-39 = "Во время визитов мы поднимаемся только на первые три этажа. На четвёртом есть пациенты?"
1701-40 = "На карте в центральном вестибюле показано, что на четвёртом этаже тоже есть палаты..."
1701-41 = "Дело в том, что... среди пациентов пошёл нехороший слух..."
1701-42 = "Нехороший слух?"
1701-43 = "Говорят, после полуночного звона... там появляется призрак, весь обмотанный бинтами!"
1701-44 = "П-Призрак? Это правда?"
1701-45 = "Я не верю, что там настоящий призрак... но столько пациентов из-за этого тревожились, что нам пришлось перенести отделение."
1701-46 = "Поэтому теперь четвёртый этаж пустует."
1701-47 = "С-Страшный слух... Т-Тогда я буду держаться подальше от четвёртого этажа..."
1701-49 = "Но даже если это призрак... Раз он весь в бинтах, значит, он ранен, верно?"
1701-50 = "Если капитан Мине узнает, что мы отказали раненому пациенту из-за страха, она наверняка разочаруется!"
1701-51 = "Н-Но Рыцари исправительного курса помогают только живым пациентам. Мы не организация по борьбе с призраками!"
1701-52 = "Н-Нам правда не стоит с ними связываться..."
1701-53 = "Мы не узнаем правду, пока не проверим, верны слухи или нет!"
1701-54 = "К тому же, если из-за призрака четвёртым этажом нельзя пользоваться, больница сможет принимать меньше пациентов. Так что это и ради пациентов тоже!"
1701-55 = "Угх... Ну почему именно сейчас ты решила быть такой логичной?!"
1701-56 = "Хи-хи. Значит, ты со мной согласна. Встретимся сегодня в одиннадцать вечера и проверим призрака в пустующем отделении!"
1701-57 = ""
1701-58 = "Е-Если там настоящий призрак, я уйду! Убегу и даже не оглянусь!"
