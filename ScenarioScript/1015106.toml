[translation]
1015106-1 = "Genius and From Now On"
1015106-2 = "Here we go!"
1015106-6 = "Ugh, it's heavy... I need to systemize this soon..."
1015106-7 = "[s] \"Hello, Anna!\""
1015106-11 = "Ah, Sensei! I've been waiting for you!"
1015106-12 = "I've been at my wits end doing this alone..."
1015106-13 = "[s1] \"If it's for you, Anna, I'll come running anytime!\"\n[s2] \"What should I help with?\""
1015106-16 = "Right now, I'm organizing Class 183's documents."
1015106-17 = "Since I am the Class President, I manage all the records for Class 183."
1015106-18 = "But when I actually tried to do it, I realized I have no talent for organizing."
1015106-19 = "When I tried to arrange the documents in alphabetical order, #nthe paper sizes were all different and it looked terrible—"
1015106-20 = "When I grouped them by paper size, #nthe thickness bothered me, so I started measuring them with a micrometer..."
1015106-21 = "I really look like an idiot, don't I? #nI'm so bad at organizing it makes even me laugh."
1015106-22 = "[s3] \"Let's try doing it together once more!\"\n[s4] \"I'll help too!\""
1015106-27 = "Please!"
1015106-35 = "No matter how many times I look at it, it's an insane amount...!"
1015106-36 = "Starting with the records of Class 183's predecessors... #nthere are research and patent documents, and even the students' record."
1015106-40 = "Alright! Let's prepare ourselves and begin!"
1015106-41 = "[s] \"Yeah! Let's do our best!\""
1015106-57 = "As I thought, things go smoothly when I'm with you, Sensei."
1015106-58 = "Next is..."
1015106-62 = "...Let's put this one off until later. ...Ahaha."
1015106-63 = "[s] \"What kind of document is it?\""
1015106-64 = "Um... It's nothing special. It's a record from before I came here."
1015106-65 = "Looking at it makes me sad, so I just left it here and forgot about it."
1015106-66 = "Hehe..."
1015106-67 = "[s] \"...Shall we take a break and change of pace for a bit?\""
1015106-71 = "Thank you for your consideration."
1015106-72 = "...If you don't mind, could we look at it together?"
1015106-73 = "If I'm with you, Sensei... I think I can face it properly."
1015106-74 = "[s] \"If it can help you, Anna, of course.\""
1015106-75 = "...Thank you!"
1015106-79 = "First, opening the box was a all-successful."
1015106-80 = "It was surprisingly easy. Hehe."
1015106-81 = "Wow, there are even things I drew in kindergarten. So nostalgic~"
1015106-82 = "[s5] \"Did you draw this, Anna? Amazing!!\"\n[s6] \"I want to hear Dr. Anna's explanation!\""
1015106-85 = "U-Understood! Leave it to me!"
1015106-86 = "This is a blueprint for a type of particle accelerator called a cyclotron. #nIt's a device that accelerates charged particles using electromagnets. #nI designed it using things a kindergartener could get their hands on, so the functionality itself is simple."
1015106-87 = "It seems I was interested in physics around this time. #nCome to think of it, when I was little, my dreams for the future changed almost#nevery day."
1015106-88 = "[s7] \"Cyclo... that's amazing!\"\n[s8] \"A kindergartener studying physics… that's impressive!\""
1015106-91 = "Hehe... It's not that really amazing~"
1015106-95 = "The blueprints are gathered here! #nWhen I was 9, I was trying to build a laser gyroscope, #nso I really was interested in a lot of different things."
1015106-100 = "And this is..."
1015106-104 = "...A certificate I made myself."
1015106-105 = "When I was 11, I won the grand prize at an Academy competition."
1015106-106 = "However, due to various circumstances, the awards ceremony was canceled... #nThe record of the award remained, but I didn't receive a certificate."
1015106-107 = "I wanted to show off at the awards ceremony, #nand I was looking forward to receiving a bouquet and being praised, #nso after crying for a while, I made it myself."
1015106-108 = "But when I actually made it, I started feeling miserable... #nBecause I knew perfectly well of how shameful yearning for approval #nlooks like from the outside."
1015106-109 = "I'm stubborn and all I care about is being recognized. #nI think anyone would find that kind of person annoying."
1015106-110 = "That's why I couldn't even hang it on the wall, #nand I was so embarrassed that I just left it in here. All this time until now."
1015106-114 = "...Ah! This is embarrassing, so it's a secret between just the two of us!"
1015106-115 = "[s9] \"It's a little late, but shall we hold an awards ceremony right now?\"\n[s10] \"After all... We have both a recipient AND a bestower here!\""
1015106-120 = "R-Really?"
1015106-121 = "I'm so happy! In that case, I'll go prepare a little!!"
1015106-122 = "I'm going to step outside for a bit, so please wait!!"
1015106-132 = "[wa:1250]― [log=안나]You really...[wa:1950] set it all up...[/log]"
1015106-135 = "― [log=안나]...I thought that kind of courage[/log]"
1015106-137 = "― [log=안나]was something I[wa:600] didn't have.[/log]"
1015106-140 = "[ns11] \"Grand Prize, Niki Anna!\"\n[ns12] \"I present this award to the sincere and outstanding Anna.\""
1015106-143 = "[wa:1000]― [log=안나]Sensei[wa:2600], to me...[/log]"
1015106-146 = "― [log=안나]...Fufu[/log]"
1015106-148 = "― [log=안나]That's the first time I've ever [wa:1550] heard an award commendation like that.[/log]"
1015106-151 = "― [log=안나]Thank you very much[/log]"
1015106-154 = "― [log=안나]To be able to receive such an award...[/log]"
1015106-156 = "― [log=안나]It truly is an honor.[/log]"
1015106-159 = "[wa:2370]― [log=안나]...I thought...[/log]"
1015106-162 = "― [log=안나]I'd start bragging, or talking about my hardships.[/log]"
1015106-165 = "― [log=안나]But right now, I'm just so[wa:700] overwhelmed with[wa:1060] emotion...[/log]"
1015106-167 = "― [log=안나]I don't even know what's going on anymore.[/log]"
1015106-170 = "[wa:560]― [log=안나]Thank you very much,[wa:1720] Sensei.[/log]"
1015106-173 = "― [log=안나]I truly didn't think a day like this would ever come...[/log]"
1015106-175 = "― [log=안나]I never expected it...[/log]"
1015106-178 = "― [log=안나]It's as if all my dreams...[/log]"
1015106-180 = "― [log=안나]Have come true all at once...[/log]"
1015106-183 = "― [log=안나]That's how I feel.[/log]"
1015106-186 = "[ns13] \"I'll keep cheering on your dreams from now on too.\"\n[ns14] \"Will you keep giving it your all as you work toward your dreams?\""
1015106-189 = "[wa:680]― [log=안나]From now on,[wa:1700] always...[/log]"
1015106-192 = "― [log=안나]Yes![wa:1490] Always...[/log]"
1015106-194 = "― [log=안나]Fufu...![/log]"
1015106-197 = "(Together with Anna, who had regained her energy, we organized every last#nrecord.)"
1015106-198 = "(Anna was smiling the whole time, so I guess she really enjoyed it.)"