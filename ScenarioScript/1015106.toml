[translation]
1015106-1 = "With a Genius, From Now On"
1015106-2 = "Heave-ho!"
1015106-6 = "Ugh, so heavy... I need to systemize this quickly..."
1015106-7 = "[s] \"Hello, Anna!\""
1015106-11 = "Ah, Sensei! I have been waiting for you!"
1015106-12 = "I was completely at my wit's end on my own..."
1015106-13 = "[s1] \"If it is for Anna, I will come running anytime!\"\n[s2] \"What do you need help with?\""
1015106-16 = "Right now, I am organizing the documents for District 183."
1015106-17 = "As the class representative, I manage all records for District 183."
1015106-18 = "But when I actually tried to do it, I realized I have no talent for organizing."
1015106-19 = "I tried to arrange the documents in Japanese syllabary order, but #nthe paper sizes were all over the place and it looked messy--"
1015106-20 = "So I grouped them by paper size, #nand then I started worrying about the thickness and began measuring them with a micrometer..."
1015106-21 = "Really, I look so silly. #nI am so bad at organizing that even I have to laugh."
1015106-22 = "[s3] \"Let us try doing it together again!\"\n[s4] \"I will help you too!\""
1015106-27 = "Please do!"
1015106-35 = "No matter how many times I look at it, this is an outrageous amount..."
1015106-36 = "Starting with the records of the previous generation of District 183... #nthere are research and patent documents, and even individual student files."
1015106-40 = "Alright! Let us steel our resolve and get started!"
1015106-41 = "[s] \"Yeah! Let us do our best!\""
1015106-57 = "As expected, things go much smoother when I am with you, Sensei."
1015106-58 = "Next is..."
1015106-62 = "...Let us put this off for later. ...Ahaha."
1015106-63 = "[s] \"What kind of documents are those?\""
1015106-64 = "Um... nothing major. Just records from before I came here."
1015106-65 = "Looking at them makes me feel sad, so I left them here and forgot about them."
1015106-66 = "Ehehe..."
1015106-67 = "[s] \"...Should we take a little break to change the pace?\""
1015106-71 = "Thank you for your consideration."
1015106-72 = "...If you do not mind, would you look at them with me?"
1015106-73 = "If I am with you, Sensei... I feel like I can face them properly."
1015106-74 = "[s] \"If I can be of help to Anna, of course.\""
1015106-75 = "...Thank you very much!"
1015106-79 = "First of all, opening the box was a success."
1015106-80 = "It was easier than expected. Ehehe."
1015106-81 = "Wow, there are things I drew when I was in kindergarten too. So nostalgic~"
1015106-82 = "[s5] \"Did Anna draw this? Amazing!!\"\n[s6] \"I want to hear Dr. Anna's explanation!\""
1015106-85 = "O-Okay! Leave it to me!"
1015106-86 = "This is a type of particle accelerator... a blueprint of a cyclotron, #na device that accelerates charged particles using electromagnets. #nI designed it using things a kindergartener could get, so the function itself is simple."
1015106-87 = "It seems I was interested in physics back then. #nCome to think of it, my future dream used to change almost every day when I was a child."
1015106-88 = "[s7] \"A cyclo... that is amazing!\"\n[s8] \"Into physics in kindergarten... as expected!\""
1015106-91 = "Ehehe... come on, it is not that amazing~"
1015106-95 = "Blueprints are gathered here! #nWhen I was 9 years old, I tried to make a laser gyroscope, #nand I really took an interest in all sorts of things."
1015106-100 = "And this is..."
1015106-104 = "...A certificate I made myself."
1015106-105 = "When I was 11, I won the grand prize at the academy tournament."
1015106-106 = "However, due to various circumstances, the awards ceremony was canceled... #nand while the award record remained, I never got the certificate."
1015106-107 = "I wanted to show off at the awards ceremony, #nand I was looking forward to getting a bouquet and being praised, #nso I cried for a bit and then made one myself."
1015106-108 = "But once I made it, I started feeling pathetic... #nI already knew how much of a mass of attention-seeking behavior #nthat looked like from the outside."
1015106-109 = "Stubborn and full of desires to be acknowledged. #nAnyone would think I am a troublesome person."
1015106-110 = "That is why I could not even hang it on the wall, #nand I was too embarrassed to just leave it in here. All this time."
1015106-114 = "...Ah! This is embarrassing, so it is a secret between the two of us!"
1015106-115 = "[s9] \"It is a bit late, but shall we hold the awards ceremony now?\"\n[s10] \"Because here... we have both the person receiving the award and the person presenting it!\""
1015106-120 = "R-Really?"
1015106-121 = "I am so happy! Then let me prepare for a moment!!"
1015106-122 = "I am going outside, so please wait a little bit!!"
1015106-132 = "[wa:1250]- [log=안나]I actually [wa:1950]went ahead and [wa:730]displayed it...[/log]"
1015106-135 = "- [log=안나]...Such courage,[/log]"
1015106-137 = "- [log=안나]I thought I [wa:950]did not have.[/log]"
1015106-140 = "[ns11] \"Grand Prize, Niki Anna!\"\n[ns12] \"We bestow this award to the sincere and wonderful Anna.\""
1015106-143 = "[wa:1000]- [log=안나]Sensei is [wa:2600]giving this to me...[/log]"
1015106-146 = "- [log=안나]...Hehe,[/log]"
1015106-148 = "- [log=안나]This is the first time [wa:2220]I have heard [wa:620]such an award speech.[/log]"
1015106-151 = "- [log=안나]Thank you very much, [/log]"
1015106-154 = "- [log=안나]To be able to [wa:810]receive such an award,[/log]"
1015106-156 = "- [log=안나]I am truly [wa:610]honored.[/log]"
1015106-159 = "[wa:2370]- [log=안나]...I thought[/log]"
1015106-162 = "- [log=안나]more boastful stories [wa:840]or hardship tales would come out.[/log]"
1015106-165 = "- [log=안나]Right now, [wa:2600]I am so overwhelmed [wa:1060]that...[/log]"
1015106-167 = "- [log=안나]I do not even know what is what.[/log]"
1015106-170 = "[wa:560]- [log=안나]Thank you very much, [wa:1720]Sensei.[/log]"
1015106-173 = "- [log=안나]That a day like this [wa:544]would come,[/log]"
1015106-175 = "- [log=안나]I really never thought...[/log]"
1015106-178 = "- [log=안나]It feels as though[/log]"
1015106-180 = "- [log=안나]all my dreams came true[/log]"
1015106-183 = "- [log=안나]at once... [wa:580]That is how I feel.[/log]"
1015106-186 = "[ns13] \"I will keep cheering on Anna's dreams from now on.\"\n[ns14] \"Will you keep striving toward your dreams with all your might?\""
1015106-189 = "[wa:680]- [log=안나]From now on, [wa:1700]always...[/log]"
1015106-192 = "- [log=안나]Yes! [wa:1490]Always...[/log]"
1015106-194 = "- [log=안나]Hehe...![/log]"
1015106-197 = "(Together with Anna, who had regained her energy, we finished organizing the records.)"
1015106-198 = "(Judging by how much she seemed to enjoy it, Anna was smiling the whole time.)"
