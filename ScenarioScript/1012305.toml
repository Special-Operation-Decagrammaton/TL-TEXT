[translation]
1012305-1 = "Последний момент"
1012305-2 = "Прочитав сообщение Сейи, я отправился в её комнату."
1012305-3 = ""
1012305-7 = "...Я ждала вас, Сенсей."
1012305-8 = "Того самого «конца», которым я хотела с вами поделиться..."
1012305-9 = ""
1012305-10 = "Комната Сейи"
1012305-11 = "...Фух."
1012305-12 = "Вы совсем не выглядите удивлённым. Более того, словно именно этого и ожидали."
1012305-13 = "[s1] «Ну, это логично.»\n[s2] «Ты имела в виду „конец“ ношения этого наряда?»"
1012305-16 = ""
1012305-18 = ""
1012305-19 = "Возможно... я слишком явно выдала свои намерения."
1012305-20 = "Хм. Но всё же я считала, что вам недостаёт некоторой... интуиции. Я надеялась, вы удивитесь сильнее."
1012305-21 = "Я хотела вас удивить. Думала, вы войдёте и скажете: «Ох, Сейя, ты заболела? Что-то случилось?»."
1012305-22 = "Ваша реакция настолько безразлична, что задевает мои чувства. Вас... устраивает такой результат?"
1012305-23 = "И чем теперь вы заполните пустоту в моём сердце? Вы принесли мне хоть что-нибудь достойное?"
1012305-24 = "...Простите?"
1012305-25 = "Не можете сказать? Что это—"
1012305-26 = "[s3] «...Сейя, давай не будем.»\n[s4] «Я стараюсь быть с тобой помягче.»"
1012305-29 = ""
1012305-31 = ""
1012305-32 = "Фуфу, хорошо. Как пожелаете."
1012305-33 = "Мне следовало извиниться... Нет, лучше поблагодарить вас за такое спокойствие. Хорошо. Продолжим."
1012305-34 = "Я позвала вас... потому что, как вы и догадались, сегодня последний день, когда я ношу этот наряд."
1012305-35 = "Вообще-то сегодня нет особой причины его надевать. Все мои друзья уже видели его и высказали своё мнение."
1012305-36 = "И всё же... я так и не смогла убрать его в шкаф."
1012305-37 = "Мне захотелось показать его вам ещё один, последний раз."
1012305-38 = "Забавное оправдание. Собственно, поэтому я и решила вам позвонить."
1012305-39 = "Если кто-то и будет смеяться над моей драматичностью... я предпочту, чтобы это были вы."
1012305-40 = "Почему бы мне просто не надевать его снова, когда захочется?"
1012305-41 = "...Полагаю, именно это вы обычно говорите другим студентам."
1012305-42 = "Ну... Я бы не сказала, что совершенно не могу, но... Как бы объяснить...?"
1012305-43 = "Меня это не привлекает. Исчезнет особая магия."
1012305-44 = "В следующий раз, по другому поводу, мне следует надеть уже другой наряд. Но сегодня — отдельный, особенный случай, разве нет?"
1012305-45 = "Что касается одежды, которую приходится носить постоянно, думаю, в Тринити..."
1012305-46 = "...«униформы» Чаепития мне уже вполне достаточно."
1012305-47 = "А когда я надеваю что-нибудь другое, вроде этого..."
1012305-48 = "...я словно освобождаюсь от привычных внутренних ограничений."
1012305-49 = ""
1012305-51 = ""
1012305-52 = "Думаю, это всё, что я хотела сказать."
1012305-53 = "Простите. Я такая скучная девушка, а всё равно отнимаю ваше время."
1012305-54 = "Правда, я рассмотрела множество вариантов. Думала о ваших интересах и увлечениях."
1012305-55 = "Я думала, может, стоит выражаться загадочнее — цитировать книги и философов."
1012305-56 = "Но ничего не подходило. Ничто из этого особенно не увлекало меня — с чего бы тогда увлечь вас?"
1012305-57 = "Наверное, этого и следовало ожидать. Меня ограничивают собственные рамки мышления."
1012305-58 = "Мои маленькие... шалости раньше сводились к тому, чтобы притвориться больной или слегка соврать, но вы уже научились видеть меня насквозь."
1012305-59 = "И вот теперь, когда мне больше нечем с вами поделиться, я сижу здесь и говорю об одежде."
1012305-60 = "...Серьёзно."
1012305-61 = "Какая же я жалкая девушка. Фуфуфу."
1012305-62 = "[s5] Погладить Сейю по голове.\n[s6] «Вот так, вот так.»"
1012305-65 = "...? Сенсей?"
1012305-66 = "Что это значит?"
1012305-67 = "...Простите?"
1012305-68 = "Вот такой у вас ответ? Гладь-гладь? ...Вам нравится, или...?"
1012305-69 = "Что вы пытаетесь сказать...?"
1012305-70 = ""
1012305-72 = ""
1012305-73 = ""
1012305-74 = "[ns7] «...Сейя?»\n[ns8] «Ты сердишься?»"
1012305-77 = "...Хмф."
1012305-78 = "Сенсей, вы со мной так жестоки. Пусть я отчасти это и заслужила."
1012305-79 = "Но если уж хотите играть, не забывайте, на чьём поле находитесь."
1012305-80 = ""
1012305-82 = ""
1012305-83 = ""
1012305-84 = ""
1012305-86 = "[ns9] «...Сейя?!»\n[ns10] «Ты заперла дверь...?!»"
1012305-90 = "Фу-фу-фу..."
1012305-91 = "Ох, настоящая паника. Теперь я знаю единственный способ добиться от вас искренней реакции."
1012305-92 = "Как вы наверняка понимаете, это МОЯ комната. А в моей комнате... МОЁ слово — закон Тринити."
1012305-93 = "Итак... теперь вам придётся меня побаловать, Сенсей."
1012305-94 = ""
1012305-96 = ""
1012305-98 = ""
1012305-99 = "...И без моего разрешения вы отсюда не уйдёте."
1012305-101 = "Я баловал Сейю в её комнате, пока она наконец не осталась полностью довольна."
1012305-102 = "К тому времени, когда она открыла дверь и попрощалась, уже наступил вечер."
