[translation]
2601002-1 = "Снайпер на причале"
2601002-2 = "Причал рыбацкой деревни"
2601002-3 = "На следующий день я отправился к причалу рыбацкой деревни, где, как мне сказали, тренировалась Мию."
2601002-4 = "Я дошёл до конца пирса. Там была группа рыбаков, но Мию нигде не было..."
2601002-5 = "...О?"
2601002-6 = "С-Сенсей?"
2601002-7 = "[s1] «Мию...?»\n[s2] «Хм? Откуда идёт этот голос?»"
2601002-10 = "Здесь, Сенсей. У края пирса..."
2601002-11 = "Вы приближаетесь..."
2601002-14 = "[ns] «О, ты рыбачишь.»"
2601002-15 = "― [log=미유 수영복]Хи-хи... Даже вы меня не заметили, Сенсей.[/log][wa:1760]"
2601002-17 = "― [log=미유 수영복]Моя маскировка снова идеальна...[/log][wa:10]"
2601002-20 = "― [log=미유 수영복]Есть старая поговорка: хочешь спрятать дерево — спрячь его в лесу...[/log][wa:1240]"
2601002-23 = "― [log=미유 수영복]Если я хочу затеряться среди рыбаков,[/log][wa:10]"
2601002-25 = "― [log=미유 수영복]мне самой тоже стоит порыбачить.[/log][wa:10]"
2601002-28 = "― [log=미유 수영복]...Вот бы только чайки перестали пытаться свить гнездо[/log][wa:2100]"
2601002-30 = "― [log=미유 수영복]у меня на голове...[/log]"
2601002-33 = "― [log=미유 수영복]Ну да ладно. Мне к такому не привыкать...[/log][wa:920]"
2601002-35 = "― [log=미유 수영복]Хи-хи... Хи-хи-хи...[/log][wa:1080]"
2601002-38 = "― [log=미유 수영복]Я выбрала это место, потому что у меня как раз есть удочка,[/log][wa:2280]"
2601002-40 = "― [log=미유 수영복]но оно и правда идеально подходит для скрытого наблюдения.[/log][wa:10]"
2601002-43 = "― [log=미유 수영복]Здесь очень хорошая видимость,[/log][wa:10]"
2601002-45 = "― [log=미유 수영복]так что обзор просто отличный.[/log][wa:980]"
2601002-48 = "― [log=미유 수영복]Дует приятный ветерок, и мне не жарко,[/log][wa:1180]"
2601002-50 = "― [log=미유 수영복]а соломенная шляпа закрывает лицо от солнца...[/log][wa:10]"
2601002-53 = "― [log=미유 수영복]А-а ещё... сегодня...[/log][wa:5140]"
2601002-56 = "― [log=미유 수영복]С-С-Сенсей...[/log][wa:2980]"
2601002-58 = "― [log=미유 수영복]здесь со мной...[/log]"
2601002-60 = ""
2601002-62 = "А-Ах...!"
2601002-63 = "Ой, простите! Я вас не заметил...!"
2601002-64 = "Н-Нет... Это я виновата, что меня так... трудно заметить..."
2601002-65 = "[s] «Ты в порядке, Мию?»"
2601002-66 = "Да. Просто меня застали врасплох..."
2601002-67 = "Я для всех настолько незаметная... что рыбаки всё время ставят лодки прямо перед моей удочкой, а птицы собираются вокруг меня..."
2601002-68 = "Поэтому... нормально рыбачить довольно трудно..."
2601002-69 = "Но...! Я к такому привыкла, так что... Ха-ха..."
2601002-70 = "[s5] «П-Попробуй посмотреть на это с хорошей стороны!»\n[s6] «Так даже лучше, раз сейчас ты работаешь под прикрытием.»"
2601002-73 = "А... Угу..."
2601002-74 = ""
2601002-78 = ""
2601002-79 = "...О?"
2601002-80 = "Я-я что-то чувствую...!"
2601002-81 = "[s7] «Твоя удочка...!»\n[s8] «Что-то клюнуло!»"
2601002-84 = "А-а-а... Нужно... вытянуть...!"
2601002-85 = "Уаа! Оно такое тяжёлое... А-а-а!"
2601002-86 = "Ух...!"
2601002-87 = ""
2601002-89 = ""
2601002-90 = ""
2601002-95 = "П-Получилось...?"
2601002-96 = ""
2601002-97 = "Это... это..."
2601002-98 = ""
2601002-101 = "[ns9] «...Хороший улов.»\n[ns10] «Вы только посмотрите на размер этой рыбины...»"
2601002-104 = "О-Она хорошая...?"
2601002-105 = "Я не очень разбираюсь в морской рыбалке, поэтому не знаю, насколько большая рыба считается... большой..."
2601002-106 = ""
2601002-109 = "Эй, народ! Посмотрите, какая рыба у этой девчонки на крючке!"
2601002-110 = "Вот это улов! Не знал, что здесь вообще водятся такие огромные рыбины!"
2601002-111 = "А-А... Я-я здесь впервые, так что н-не знаю..."
2601002-112 = "Как тебе вообще удалось поймать такой трофей?"
2601002-113 = "Это очень осторожная рыба. Стоит ей хоть немного учуять человека — сразу уплывает."
2601002-114 = "На вид ты обычный студент, но, похоже, ты какой-то... эксперт по рыбалке..."
2601002-115 = "Н-Нет... Я просто..."
2601002-116 = "Меня никто никогда не замечает... Я очень хорошо умею оставаться незаметной..."
2601002-117 = "[s11] «Поймала осторожную рыбу, потому что осталась незаметной, да?»\n[s12] «Редкий талант.»"
2601002-120 = "Н-Нет, это..."
2601002-121 = "Эх, завидую. Представьте, быть настолько тихой и неподвижной, что даже рыбы не понимают, что ты рядом."
2601002-122 = "Хотел бы я так уметь!"
2601002-123 = "Точно! Эй, девочка, в чём твой секрет?"
2601002-124 = ""
2601002-128 = "Э-Эм... Я правда ничего особенного..."
2601002-129 = "Уааа..."
2601002-131 = "От такого внезапного внимания Мию запаниковала, и в итоге мне пришлось унести её оттуда."
