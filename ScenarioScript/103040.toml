[translation]
103040-1 = "Эпизод 4; Что скрыто в Абидос 1"
103040-2 = "Крепость над небом, на которую вы хотите попасть, — разновидность Ковчега Атрахасис."
103040-6 = "[ns1] «Ковчег Атрахасиса?»\n[ns2] «...Мне знакомо это название.»"
103040-9 = "Да. Некоторое время назад ковчег с таким названием на короткое время появился в Миллениум, а затем исчез."
103040-10 = "Это наследие Безымянных богов, прежних хозяев Кивотос, погребённое глубоко под земными слоями."
103040-11 = "Можно сказать, древняя цивилизация."
103040-12 = "AL-1S, которую вы нашли, и некоторые пророки до того, как их взломал Decagrammaton, — такое же наследие."
103040-13 = "Мы не думали, что они будут представлять особую угрозу, ведь их уже уничтожили, но..."
103040-14 = "Я и представить не мог, что Chroma, пришедшая извне Кивотос, захочет заполучить их..."
103040-15 = "Похоже, если какая-то тайна хотя бы раз проявилась в Кивотос, Проводник Chroma может сделать её своей."
103040-16 = "Вероятно, Ковчег Атрахасис был получен так же, как Chroma-Decagrammaton, появившийся через святилище, Mimesis и искусственные ангелы."
103040-17 = ""
103040-19 = ""
103040-21 = "Если этот ковчег — наследие Безымянных богов, то в Кивотос нет технологий, способных с ним справиться."
103040-22 = ""
103040-25 = "...Если только не бороться огнём с огнём. Вам придётся самим заполучить технологию Безымянных богов."
103040-26 = "[ns3] «Значит...»\n[ns4] «Это и находится в Абидосе...?»"
103040-29 = "Верно."
103040-30 = "Там ждёт древнее оружие, способное противостоять Ковчегу Атрахасис."
103040-33 = "Именно его я и искал в Пустыне Абидос через Корпорацию Кайзер."
103040-34 = "Древнее оружие, погребённое в слоях Кивотос, до-просветительский ужас, который невозможно понять существующими технологиями..."
103040-35 = "Но в то время оно меня не интересовало."
103040-38 = "Тогда моей целью было посредством контракта заполучить сильнейшую Мистику Кивотос."
103040-39 = ""
103040-41 = "Сокровище, погребённое в Абидос, тогда было... прихотью."
103040-42 = "Было бы удобно найти его с помощью Кайзер... но если бы не нашли — мне было всё равно. Так я к этому относился."
103040-44 = ""
103040-45 = "Но для президента Кайзер... моё объяснение, должно быть, прозвучало заманчиво."
103040-46 = "Древнее оружие, мощнее всего в Кивотос... Что, если бы оно оказалось в ваших руках...?"
103040-47 = "Президент решил, что сможет править всем Кивотос."
103040-50 = "И в итоге... раскопки сверхдревнего оружия, погребённого в Пустыне Абидос, увенчались успехом..."
103040-51 = ""
103040-53 = "После этого президенту больше не было причин колебаться. С этим оружием он наверняка решил, что Кайзер сможет захватить любой район Кивотос."
103040-54 = "Так Генеральный студсовет был атакован, а Сенсей из Шале похищен... *усмехается* Если бы всё пошло по плану, Кивотос действительно мог оказаться в руках президента."
103040-56 = "...Но именно тогда появились Ложные святилища."
103040-58 = ""
103040-59 = "Когда Sanctum Tower была разрушена, осторожный президент понял, что ситуация ему не по зубам, и отступил."
103040-60 = "Можно сказать, он толковый бизнесмен. Он знал, что для использования древнего оружия ему понадобится Sanctum Tower."
103040-62 = "Теперь Sanctum Tower разрушена, и нет ни способа, ни человека, способного управлять древним оружием."
103040-63 = "За исключением одного человека. Владельца Ящик Шиттим, артефакта, сопоставимого с Sanctum Tower."
103040-64 = ""
103040-67 = "[ns] «...»"
103040-69 = "[ns] «Что это за древнее оружие?»"
103040-70 = "...Сначала я думал, что погребённое в Абидос может быть ковчегом."
103040-71 = "Это был не ковчег, но нечто похожее. Нечто столь же грандиозное."
103040-72 = ""
103040-74 = ""
103040-75 = ""
103040-77 = "...Это был корабль."
103040-78 = "Окончательная форма оружия, сравнимая с Ковчегом Атрахасис, носит имя, происходящее из истоков Кивотос."
103040-81 = "Это Корабль Утнапиштима."
103040-82 = ""
103040-85 = "...Межзвёздный боевой корабль."
103040-87 = "Следующий эпизод; Что скрыто в Абидос 2"
