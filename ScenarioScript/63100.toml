[translation]
63100-1 = "Эпизод 10;Экклесия для тех, кто не исчезает"
63100-5 = "[log]День пробного экзамена[/log]"
63100-9 = "Ну?"
63100-10 = "Хм."
63100-11 = "У меня нет никаких оснований..."
63100-12 = "...но почему-то внезапно кажется, что всё будет хорошо."
63100-13 = "Повторюсь, я не сделала вообще ничего, чтобы так себя чувствовать."
63100-14 = ""
63100-16 = ""
63100-17 = "Ты совсем не училась, да?"
63100-19 = "И вот я подумала..."
63100-20 = "Эм..."
63100-21 = "Учебники ведь создают специально, чтобы хорошо учить учеников, верно?"
63100-22 = "Точно..."
63100-23 = "Тогда, насколько я вижу, наш учебник отстой."
63100-24 = "Он меня ничему не научил."
63100-25 = "Ого. Такой логики я буквально никогда раньше не слышала..."
63100-26 = "Ну что ж, удачи на экзамене..."
63100-27 = "Тебе тоже..."
63100-28 = "Ошибись ровно на один вопрос больше меня!"
63100-29 = "Ты только что буквально прокляла меня!"
63100-30 = ""
63100-34 = "[ns] «Ну что! Все хорошо подготовились?»"
63100-35 = "А, Сенсей!"
63100-36 = "Сенсей..."
63100-37 = "Что делать, когда чувствуешь, что завалишь экзамен?"
63100-38 = "[s1] «Это лишь начало! Вы ещё даже не приступили.»\n[s2] «Вот войдёте внутрь и сядете за парту — тогда увидите.»\n[s3] «Внезапно всё, что вы учили, начнёт расплываться в голове...»"
63100-42 = "Ого... Мне стало... в тысячу раз хуже..."
63100-43 = "[s] «В общем, удачи всем!»"
63100-44 = "Ладно-о..."
63100-45 = ""
63100-47 = ""
63100-49 = "Привет, Сенсей. Рада видеть. Вы пришли встретить нас?"
63100-50 = "Ну вы и беспокоитесь... Серьёзно думаете, что мы сейчас сбежим? Мы слишком много пережили, чтобы добраться сюда."
63100-51 = ""
63100-54 = ""
63100-55 = "Хм? Разве Сенсей не пришёл исключительно нас поддержать?"
63100-56 = "О... Я думала, Мисаки просто говорит это потому, что она Мисаки..."
63100-57 = "П-Понятно. Прости, Мисаки."
63100-59 = "Серьёзно? Я вообще не—"
63100-60 = "*вздыхает* Да без разницы."
63100-61 = "Что ж, нам пора, Сенсей."
63100-62 = "Я-Я очень постараюсь..."
63100-63 = ""
63100-70 = ""
63100-71 = "Здравствуйте, Сенсей."
63100-72 = "А, привет, Сенсей... Вам сегодня не нужно работать?"
63100-73 = "[s4] «Сегодня это моя работа…»\n[s5] «Моя задача — следить за экзаменом и подбадривать вас!»"
63100-76 = "П-Понятно."
63100-77 = ""
63100-79 = ""
63100-80 = "Хм? Хотите знать, как я отношусь к пробному экзамену Ариуса?"
63100-81 = "..."
63100-82 = "Честно говоря... пока не могу сказать, что идея мне нравится."
63100-83 = "Но все дети Ариуса захотели попробовать ещё раз."
63100-84 = "И я решила им довериться."
63100-85 = "И вы, Сенсей."
63100-86 = "[s] «Спасибо, Субару»."
63100-87 = ""
63100-89 = ""
63100-90 = "Э-Э? Что? Почему? Разве это не слишком внезапно?!"
63100-91 = "[s] «Спасибо, что доверяешь мне»."
63100-92 = "Н-Ну, это ведь ничего такого..."
63100-93 = "Хм? Вы начинаете тревожиться и сомневаться, когда студенты не доверяют тому, что вы делаете?"
63100-94 = "..."
63100-95 = "Я... не ожидала настолько честного ответа."
63100-97 = "З-Значит, я тоже помогаю вам, Сенсей?!"
63100-98 = "[s] «Да, конечно. Умница. Я очень тобой горжусь»."
63100-99 = ""
63100-101 = ""
63100-102 = ""
63100-105 = "Я погладил Майю по голове."
63100-106 = "Хи-хи... Хех... Приятно... Спасибо, Сенсей."
63100-107 = ""
63100-109 = ""
63100-111 = "..."
63100-112 = "Я-я тоже..."
63100-113 = ""
63100-117 = ""
63100-118 = "Субару! Пойдём! Уже пора!"
63100-119 = "Что? А-А..."
63100-120 = "Хорошо..."
63100-121 = ""
63100-123 = ""
63100-125 = "[ns] «Интересно, экзамен в Тринити уже начался...»"
63100-126 = "(Если во взрослой жизни и есть хоть один плюс...)"
63100-127 = "(...так это то, что мне больше не нужно сдавать пробные экзамены... Какая глупая мысль.)"
63100-128 = "Пока я ждал окончания экзамена, некоторое время работал в ближайшем кафе."
63100-135 = "Ух... Всё и правда, окончательно закончилось..."
63100-136 = "Ну? Как всё прошло?"
63100-137 = ""
63100-139 = ""
63100-141 = ""
63100-142 = "..."
63100-143 = "..."
63100-144 = "Полная катастрофа..."
63100-145 = ""
63100-148 = "Э-Эй, их ещё даже не проверили!"
63100-149 = "Знаешь... иногда просто чувствуешь..."
63100-151 = "...Если честно, у меня то же ощущение..."
63100-152 = "Сестра по оружию..."
63100-153 = ""
63100-157 = "[ns] «С возвращением, все!»"
63100-158 = ""
63100-159 = "Сенсей..."
63100-160 = "*всхлип*... Сенсей..."
63100-161 = "Я точно совершенно завалила экзамен...!"
63100-162 = "[s6] «Сейчас это неважно!»\n[s7] «Чтобы завершить экзамены, мы должны соблюсти давнюю традицию!»"
63100-165 = "Что?"
63100-166 = "Типа... отметить конец экзаменационного сезона?"
63100-167 = "[s8] «Именно... вечеринка после экзаменов!»\n[s9] «Мы вкусно поедим и прекрасно проведём время!»\n[s10] «Этой традиции мы ни за что не дадим исчезнуть!»"
63100-168 = ""
63100-169 = ""
63100-170 = ""
63100-173 = ""
63100-174 = "О-Ого! Есть такие замечательные традиции?"
63100-175 = "Может, экзамены всё-таки не так уж плохи!"
63100-177 = "Погодите-погодите. Не будем ТАК быстро забывать, насколько адской была вся эта учёба."
63100-178 = "Но ведь теперь всё закончилось, да?"
63100-179 = "Когда боль закончилась, это уже не боль!"
63100-180 = "...!"
63100-181 = "Вот это подход Ариуса!"
63100-183 = "Да!"
63100-184 = "Сенсей, купите нам, пожалуйста, что-нибудь вкусное?"
63100-185 = "[s11] «Приглашайте всех! Ни о чём не беспокойтесь!»\n[s12] «...Хотя бы немного пожалейте мой бедный кошелёк...»"
63100-189 = "Хорошо!"
63100-190 = ""
63100-195 = "И вот так..."
63100-196 = "...их самый первый экзамен и вечеринка после него закончились мирно и счастливо."
63100-197 = ""
63100-207 = ""
63100-208 = "Здравствуй, Субару, Майя. Присаживайтесь."
63100-210 = "Здравствуй, Ацуко."
63100-211 = "Э-Эм... Здравствуйте, п-принцесса Ацуко..."
63100-213 = "Фуфу. Я больше не принцесса, так что титул не нужен."
63100-214 = "Разве мы не договорились общаться по-дружески?"
63100-215 = "Д-Договорились! Просто... Хорошо... *вдыхает*"
63100-216 = "А-Ацуко. Привет, Ацуко."
63100-217 = "Спасибо. Буду признательна."
63100-219 = "Так о чём ты хотела поговорить, Ацуко?"
63100-221 = "Хм... Экзамен прошёл хорошо, верно? И я слышала, что во внешнем мире после экзаменов обычно делают именно так."
63100-222 = "Сначала давайте поедим. Говорят, в этом кафе очень знаменитый пирог с пеканом."
63100-223 = "Х-Хорошо... Большое спасибо..."
63100-224 = "Ну и как вы обе себя чувствовали на экзамене? Думаю, я ответила на всё настолько хорошо, насколько могла."
63100-225 = "Я тоже ответила на всё, что знала!"
63100-226 = "Но, если честно, я не знала гораздо больше, чем знала."
63100-227 = "А ты, Субару?"
63100-229 = "...Я впервые проходила пробный экзамен, и задания третьего курса показались мне немного тяжёлыми. Вот и всё."
63100-230 = "Фуфу. Поскольку это всего лишь пробный экзамен, он нужен только как... личная точка отсчёта, что ли."
63100-231 = "За пробный экзамен нет никаких наказаний, так что результаты не имеют большого значения."
63100-232 = ""
63100-234 = ""
63100-235 = "Что...? Настоящие экзамены... наказывают?!"
63100-236 = "Хм... Если результаты слишком плохие, придётся ходить на дополнительные занятия."
63100-237 = "А если оценки не улучшатся, могут оставить на второй год или не допустить к выпуску."
63100-238 = "А... Вот что значит «наказание»..."
63100-239 = "...Да."
63100-240 = "Таковы порядки куда более доброго мира."
63100-241 = "..."
63100-242 = "..."
63100-243 = "Какие у Отряда планы дальше, Ацуко?"
63100-244 = "Я предполагала, что тебе будет интересно."
63100-245 = "..."
63100-246 = ""
63100-248 = ""
63100-250 = "Отряд Ариус намерен заняться обязанностями, которыми до сих пор пренебрегал."
63100-251 = "...И как именно?"
63100-252 = "Пока следующий ученический совет Ариуса не будет официально и честно избран, Отряд Ариус намерен исполнять обязанности временного ученического совета."
63100-253 = ""
63100-256 = ""
63100-257 = "Отряд Ариус... станет ученическим советом Ариуса? Но тогда... Тогда..."
63100-258 = "Наша школа станет... такой же, как другие школы..."
63100-259 = "Получается, спустя сотни и сотни лет школа-сателлит Ариус наконец вернётся к нормальной жизни?"
63100-260 = "Я сделаю всё возможное, чтобы так и произошло."
63100-261 = "Да. Придётся, раз я временно исполняю обязанности президента ученического совета Ариуса."
63100-262 = "ПРЕЗИДЕНТА УЧЕНИЧЕСКОГО СОВЕТА?!?!"
63100-263 = "Тише-тише. Ты немного громкая, Майя."
63100-264 = "А-А. Прости."
63100-265 = "Если смотреть объективно и учитывать немногочисленные оставшиеся традиции Ариуса, кроме тебя это не мог быть никто."
63100-266 = "Хорошо. А что собираются делать остальные?"
63100-267 = "Мисаки будет казначеем."
63100-268 = "Конечно, она возмущалась. «Вы правда хотите загнать меня работой, да? Ладно, если лучше никого нет»."
63100-269 = "На языке Мисаки это означает: «Всё равно буду делать, так что постараюсь как следует»."
63100-270 = "Что ещё за «язык Мисаки»...?"
63100-271 = "Ну... язык, где примерно половину сказанного нужно понимать наоборот. Только не говори ей это в лицо. Она ужасно разозлится."
63100-272 = "*вздыхает*..."
63100-273 = "А Саори будет вице-президентом и одновременно главным управляющим."
63100-274 = "Логику понимаю."
63100-275 = "Что касается управления, она предложила такую политику: всем по возможности работать подработки."
63100-276 = "Что? Почему?!"
63100-277 = "Она сказала, что так вы быстрее узнаете общество, заработаете немного карманных денег и поможете восстановлению Ариуса."
63100-278 = "Поскольку есть риск мошенничества, она велела всем показывать ей договоры до подписания. Немного смущённо объяснила, что сама много раз училась на ошибках в этой сфере."
63100-279 = "...То есть она просто заставляет всех повторять её собственный путь."
63100-280 = "Фуфу. В конце концов, лучше всего люди учатся на опыте. И ещё..."
63100-281 = "«И ещё»?"
63100-282 = "..."
63100-285 = ""
63100-286 = "Хм? Основа уже понемногу формируется."
63100-287 = "Если начнут поступать заявки на создание клубов, придётся оценивать их по бюджету и реализуемости..."
63100-288 = "Когда придёт время, каждый случай придётся рассматривать отдельно."
63100-289 = "Хм? Меньше логистики, больше моих личных желаний?"
63100-290 = "Я-Я не могу, Ацуко. Мы уже не в том положении, чтобы ставить себя или свои желания на первое место."
63100-291 = "А если это просьба твоего президента ученического совета...?"
63100-292 = "..."
63100-293 = "Н-Ну... Особых оснований для этого нет, так что можешь совсем не обращать внимания на эту мысль."
63100-294 = ""
63100-296 = ""
63100-297 = "Мне пришло в голову... Что, если мы... сделаем себе форму...?"
63100-298 = "Красивую и милую."
63100-299 = "Спасибо, Сао-Сао. Именно это я и хотела услышать."
63100-300 = ""
63100-302 = "Прости. Подробности расскажу, когда придёт время."
63100-303 = "Хм? Хорошо. Я не против."
63100-304 = "А Хиёри..."
63100-305 = "...Хиёри будет..."
63100-306 = "...нашим секретарём?"
63100-307 = "То есть секретарь, которая ещё и ведёт архив. Это..."
63100-308 = "Да... Когда она впервые это поняла, довольно долго плакала..."
63100-309 = "А потом собралась и загорелась желанием стараться изо всех сил."
63100-310 = "Когда Хиёри мотивирована, у неё отлично всё получается, поэтому я была очень рада."
63100-311 = "Я-Я сама не знаю почему, но мне тоже от этого радостно... Хиёри просто очень добрая..."
63100-312 = "Ну... Главное, что тебе приятно."
63100-313 = "О, и у меня есть просьба к Отряду Никомедии."
63100-314 = "...К нам? Какая?"
63100-315 = "Я хочу, чтобы вы взяли на себя роль дисциплинарного отряда Ариуса."
63100-316 = "Дисциплинарного... отряда?"
63100-317 = "Да, автономной силы, отвечающей за общественный порядок, нравы и дисциплину."
63100-318 = "Здесь я правда не думаю, что могу попросить кого-то кроме тебя, Субару."
63100-319 = "...А если я откажусь?"
63100-320 = "Ты правда будешь так делать?"
63100-321 = "..."
63100-323 = "С-Субару...?"
63100-324 = ""
63100-327 = ""
63100-328 = "*вздыхает*"
63100-329 = "Ты всегда была хитрой, Ацуко."
63100-330 = "Правда? Полагаю, я всё-таки президент ученического совета. Пусть даже временно."
63100-331 = "Да-да. Именно такой и должна быть."
63100-332 = "(Так гладко решать кадровые вопросы — тоже своего рода талант.)"
63100-333 = "..."
63100-334 = "Так каков твой большой план, Ацуко?"
63100-335 = ""
63100-337 = ""
63100-339 = ""
63100-340 = "Я хочу превратить Ариус в замечательную школу."
63100-341 = "...Тогда здесь мы думаем одинаково."
63100-342 = "Да. Думаю, любой студент Ариуса скажет то же самое."
63100-343 = "...Ты права. Только работы абсурдно много, да?"
63100-344 = "Знаю. Я больше не убегу. Повторю это столько раз, сколько понадобится."
63100-345 = "Ты уверена в своих силах?"
63100-346 = "Если честно — нет. Не уверена. Поэтому мне нужна помощь."
63100-347 = "Если взяться за руки, одному проще утянуть другого вниз."
63100-348 = "Или проще вытянуть друг друга обратно, если кто-то упадёт."
63100-349 = "Будущее всё равно неизвестно, поэтому я не хочу зацикливаться на худших сценариях."
63100-350 = "Разве это не просто необоснованный оптимизм?"
63100-351 = "Можно посмотреть и так, но я предпочитаю называть это активизмом. А, я знаю, что у этого слова, строго говоря, есть собственное определение."
63100-352 = "Я использую его, чтобы сказать: важно действовать здесь и сейчас, в тот самый момент, в котором я стою."
63100-353 = "И не думаю, что мы сможем это делать, если хотя бы не притворимся, что питаем какую-то смутную, расплывчатую надежду на будущее."
63100-354 = ""
63100-356 = ""
63100-357 = ""
63100-358 = "Вместе, если получится."
63100-359 = "..."
63100-360 = "Поняла."
63100-361 = "Если ты так чувствуешь, я постараюсь поддержать тебя изо всех сил."
63100-362 = "Мы правда не знаем, что произойдёт дальше и с чем столкнёмся."
63100-363 = "То есть кто бы вообще подумал, что мы в итоге будем сдавать какой-то пробный экзамен...?"
63100-364 = "Фуфу. Признаю, даже меня это застало врасплох."
63100-365 = "К-Кстати.....насчёт капитана Рыцарей исправительного курса из Тринити..."
63100-366 = "Мине? Да. О ней тоже стоит поговорить."
63100-367 = "Да... Я слышала, после происшествия в Ариусе она какое-то время была прикована к постели."
63100-368 = "Так и было. Однако..."
63100-369 = "Беспокоиться не о чем. Она полностью восстановилась."
63100-370 = ""
63100-372 = ""
63100-373 = "Правда?! Отлично!"
63100-374 = "Несколько дней она не могла заниматься, но, похоже, это почти не повлияет на результаты пробного экзамена."
63100-375 = "Понятно... Ну, хотя бы это облегчение."
63100-376 = "Да. На самом деле в тот день Мине фактически запечатала в себе силу четырёх Ангелов Откровения."
63100-377 = "Что? Вот что на самом деле произошло?!"
63100-378 = "Да. Помнишь, прямо перед тем как потерять сознание, она победила четырёх ангелов."
63100-379 = "Её действия сорвали единственную возможность семи ангелов войти в резонанс и высвободить полную силу."
63100-380 = "Мине... выдержала силу всех четырёх ангелов?! Одной силой воли?!"
63100-382 = "Ч-Что такое, Субару...?"
63100-383 = ""
63100-386 = ""
63100-387 = "А, нет, прости. Я не хотела повышать голос. Просто настолько..."
63100-388 = "Похоже, Мине очнулась почти точно в тот момент, когда тебя победили как последнего ангела."
