[translation]
10036060-1 = "Эпизод 6;Засада из темноты"
10036060-2 = "После соревнования с водяными пистолетами я тайком ушёл проведать Саори."
10036060-3 = ""
10036060-6 = ""
10036060-7 = "А, Сенсей. Что вас привело?"
10036060-8 = "[s] «Да ничего особенного. Просто хотел узнать, как идёт подготовка к концерту.»"
10036060-9 = "Мы идём с опережением графика. Только что закончили уборку вокруг сцены."
10036060-10 = "Хм? Вам кажется, здесь суета? Наверное, так и есть."
10036060-11 = ""
10036060-13 = ""
10036060-14 = ""
10036060-15 = "Вы двое, просто с-стойте рядом со мной. Если я останусь одна, они могут снова прийти за мной!"
10036060-16 = "Да всё нормально. Здесь безопасно."
10036060-17 = "Мы даже привели дополнительных телохранителей, как ты просил. Не переживай."
10036060-18 = "Надеюсь, этого хватит..."
10036060-19 = ""
10036060-21 = ""
10036060-24 = ""
10036060-25 = "DJ B.o.B просит всё больше и больше охраны."
10036060-26 = "Мы даже сняли несколько охранников с периметра и поставили ближе к сцене, чтобы лучше за ним следить."
10036060-27 = "По-моему, это уже чрезмерно, но..."
10036060-28 = "[s] «Ты боишься, что что-то случится?»"
10036060-29 = "...Да. Назовём это профессиональной привычкой. Я не говорю, что что-то ОБЯЗАТЕЛЬНО случится, но ощущение именно такое."
10036060-30 = "[s] «Это очень в твоём стиле, Саори. Давай сходим туда?»"
10036060-31 = "М-м, хорошо."
10036060-32 = "Похоже, усилить охрану сцены можно было только за счёт ослабления периметра."
10036060-34 = ""
10036060-35 = "Так, готовы."
10036060-36 = "На связи! Разведгруппа, как прошла шпионская миссия?"
10036060-37 = "...Всё именно так, как сказала профессор."
10036060-38 = "Диджей попросил больше телохранителей, поэтому им пришлось снять часть охраны с периметра."
10036060-39 = "Сейчас их оборона растянута и ослаблена."
10036060-40 = "Удивительно, профессор попала точно в точку..."
10036060-41 = ""
10036060-43 = ""
10036060-44 = "А вот и она!"
10036060-45 = "Быстро отвечай!"
10036060-46 = ""
10036060-50 = ""
10036060-51 = "Здравствуйте, все. Это я."
10036060-52 = "Все на позициях?"
10036060-54 = "Конечно! Разведку закончили, группа засады полностью готова."
10036060-55 = "Но профессор... откуда вы знали, что диджей попросит больше телохранителей?"
10036060-57 = "Оказалось, DJ B.o.B — важная фигура в преступном мире."
10036060-58 = "По вашим впечатлениям о нём, записям его концертов, интервью, новостям и прочему я составила его психологический профиль."
10036060-59 = "Он очень труслив, и когда возникает опасность — а при работе с преступным миром она возникает часто — он ставит свою безопасность на первое место."
10036060-60 = "Сегодня на него уже однажды напали, и у него нет причин думать, что всё закончилось. Конечно он захотел дополнительную охрану."
10036060-61 = "Но телохранителей нужно откуда-то взять, поэтому естественно они выбрали тех, кого могли «выделить»: охранников с наименьшей нагрузкой на окраинах."
10036060-62 = "И поэтому их первый ход был очевиден с самого начала."
10036060-63 = "Теперь нужно этим воспользоваться."
10036060-64 = "Наш следующий ход очевиден. Прорываем ослабленную оборону и немедленно атакуем фестиваль."
10036060-65 = "Захватите инициативу в начале игры — и победа станет неизбежной. Наконец нанесёте удар по Банде шлемов."
10036060-66 = "Но я что-то заболталась. Вы знаете, что делать. Дальше всё зависит от вас. Удачи."
10036060-67 = ""
10036060-69 = ""
10036060-70 = ""
10036060-71 = ""
10036060-72 = ""
10036060-73 = "Как думаете, тот прежний, более неуклюжий план она тоже дала как часть этого?"
10036060-74 = "Не-а, скорее просто так совпало."
10036060-75 = "Главное, теперь мы наконец отомстим за нашу старшую."
10036060-76 = "Если бы только наши чувства могли достичь её сквозь те железные решётки..."
10036060-77 = "Эй, хватит сентиментальности! Нам всем грустно, но надо держать себя в руках."
10036060-78 = "Все готовы? Никаких сомнений, никаких сожалений. Уже почти пора..."
10036060-79 = ""
10036060-80 = "Головорезы?"
10036060-81 = "Наверное, собираются устроить засаду на сцену."
10036060-82 = "...Хм, это немного выходит за рамки моего контракта, но у меня есть принципы..."
10036060-83 = ""
10036060-84 = ""
10036060-85 = ""
10036060-86 = "..."
10036060-87 = "Сенсей, я просто упрямлюсь или...?"
10036060-88 = "[s] «Этот фестиваль для всех, кто здесь, и ты хочешь его защитить. Я помогу.»"
10036060-89 = "Верно. Вступаем в бой!"
10036060-91 = "Группа А. Готовы."
10036060-92 = "Группа Б в порядке. Ждём сигнала."
10036060-93 = "Мы тоже готовы."
10036060-94 = ""
10036060-95 = "Хорошо, идеально."
10036060-96 = "Спорим, эти сопляки из Банды шлемов сразу же побегут?"
10036060-97 = "Знаете, некоторые говорят, что засады — это трусость. Но мы здесь не драться с ними, а наказать."
10036060-98 = "Ладно! Разнесём этот фестиваль!"
10036060-99 = "Группа засады, приём? Вперёд!"
10036060-100 = "*помехи* ...Говорит группа C. Здесь что-то не— *помехи*"
10036060-101 = "Хм? Связь барахлит? Группа C, приём. Группа C, слышите?"
10036060-102 = "*помехи*"
10036060-103 = "*туп*"
10036060-104 = "Что происходит...?"
10036060-105 = "А? *помехи* Что это? Кажется, я что-то увидела!"
10036060-106 = "Эй, иди проверь—"
10036060-107 = "*туп*"
10036060-108 = "Так, либо у нас внезапно ОЧЕНЬ плохая связь, либо..."
10036060-109 = "...Группа Б, приём!"
10036060-110 = "Эй! Вон там! Стреляйте!"
10036060-111 = "Они идут сюда! Угх!"
10036060-112 = "*помехи* *помехи*"
10036060-113 = "*туп*"
10036060-114 = "А-А? Эй, ребята?"
10036060-115 = "Ч-Что происходит...?"
10036060-116 = "Я-Я не..."
10036060-117 = ""
10036060-119 = ""
10036060-120 = ""
10036060-121 = "Чт— Кто там?! Покажись!"
10036060-122 = "Здесь нет никого из Банды шлемов. Наверное, просто ветер. Я-Я пойду проверю!"
10036060-123 = "Э-Эй, погоди!"
10036060-124 = ""
10036060-126 = ""
10036060-129 = "*ахает*"
10036060-130 = "Х-Хватит надо мной издеваться! У меня и так плохое предчувствие...!"
10036060-131 = "Е-Если продолжите, я выстрелю, понятно...?"
10036060-132 = ""
10036060-134 = ""
10036060-135 = ""
10036060-136 = ""
10036060-138 = "Ч-Что...?"
10036060-139 = ""
10036060-141 = ""
10036060-143 = ""
10036060-147 = ""
10036060-148 = "...Головорезы отступают. Преследовать не нужно."
10036060-149 = "Числом они превосходили нас, но никакого плана на случай потери группы у них не было. Неуклюже."
10036060-150 = "Конечно, у меня были ваши идеально рассчитанные указания и разведка с высоты."
10036060-151 = "Так что спасибо."
10036060-152 = "[s1] «Ты была куда впечатляюще меня.»\n[s2] «Я просто рад, что мы смогли защитить фестиваль.»"
10036060-155 = "Хех, спорить не буду. Хотя если подумать, зачем они вообще устроили эту засаду?"
10036060-156 = "Наверняка у них были причины, но это не значит, что им нужно позволять делать что хотят."
10036060-157 = "О! Посмотрите на время."
10036060-158 = "Мне НЕМЕДЛЕННО нужно готовить сцену."
10036060-159 = "Простите, Сенсей, мне пора."
10036060-160 = "[s] «Не переживай. Иди.»"
10036060-161 = "Тогда увидимся позже."
10036060-162 = ""
10036060-164 = ""
10036060-166 = "[ns3] «Они хотели похитить диджея...»\n[ns4] «Они хотели напасть на сцену...»"
10036060-167 = ""
10036060-168 = ""
10036060-172 = "[ns] «Что же они задумали...?»"
10036060-174 = ""
10036060-175 = "[ns] «Наслаждаетесь фестивалем?»"
10036060-176 = "А, Сенсей. Добро пожаловать."
10036060-177 = "Мы как раз осматривали фестивальные игры."
10036060-178 = "И ужасно проигрывали."
10036060-179 = "Мы обречены, Сенсей. Обречены!"
10036060-180 = "Нам выпадала одна проклятая карта за другой, из автомата с клешнёй не получилось достать ни одной игрушки..."
10036060-181 = "Надежды нет. Наше счастье смыло, как песок волнами..."
10036060-182 = "[s] «Здесь есть не только фестивальные игры, Хиёри.»"
10036060-183 = "А?"
10036060-184 = "[s] «Ещё будет концерт диджея!»"
10036060-186 = "Верно."
10036060-187 = "Концерт, который Сао-Сао так старательно готовила, всё ещё впереди."
10036060-188 = "И он вот-вот начнётся. Пусть станет ярким финалом прекрасного дня!"
