[translation]
80000026-1 = "Фирменный продукт академии Красная Зима"
80000026-2 = "Главные ворота академии Красная Зима"
80000026-4 = "Томоэ написала мне и попросила встретиться с ней в академии Красная Зима."
80000026-5 = "Добро пожаловать, Сенсей. Я вас ждала."
80000026-6 = "Я слышала, сегодня День святого Валентина."
80000026-7 = "Разве это не чудесно? В этот день принято дарить шоколад тому, кому хочешь признаться в чувствах."
80000026-8 = "Я приготовила для вас небольшой подарок, Сенсей."
80000026-9 = ""
80000026-11 = ""
80000026-13 = "Пожалуйста, примите этот шоколад."
80000026-14 = "[s] «Это шоколад на День святого Валентина?»"
80000026-15 = "Да! Его приготовили специально к сегодняшнему дню."
80000026-16 = "Это новая фирменная сладость академии Красная Зима!"
80000026-17 = "Она называется Черенка. Этот шоколад делают у нас уже давно. Однако Великий лидер любит его исключительно сладким, из-за чего себестоимость сильно растёт."
80000026-18 = "И хуже всего то, что портрет Черино на упаковке совершенно не милый!"
80000026-19 = "Я попыталась нарисовать новый образ, более достойный нашего Великого лидера,#nно она едва взглянула и сказала, что это несолидно."
80000026-20 = "Члены Клуба школьного питания неустанно работают над Черенкой с лучшим вкусом и дизайном."
80000026-21 = "И потому мой проект по распространению милого облика Черино по всему Кивотосу почти завершён!"
80000026-22 = "Так что я хочу, чтобы вы попробовали этот прототип и честно высказались."
80000026-23 = "[s] «Ты уверена, что это валентиновский шоколад?»"
80000026-24 = "Да, верно. Этот прототип специально приготовили ко Дню святого Валентина."
80000026-25 = "Почему вы выглядите настороженно? С ним что-то не так?"
80000026-26 = "[s] «Ничего. Выглядит вкусно.»"
80000026-27 = "Хи-хи. Рада это слышать."
80000026-28 = "Надеюсь, вам понравится мой шоколад от всего сердца, Сенсей!"
