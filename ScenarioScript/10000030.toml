[translation]
10000030-1 = "Эпизод 3;Эксцентричная девушка из клуба Инь-Ян"
10000030-2 = "Пойдём скорее, пока не стало слишком поздно, Сенсей!"
10000030-3 = "Когда в Хяккияко всё начинает лететь к чертям, как сейчас..."
10000030-4 = "...есть два основных места, куда мы можем обратиться за помощью."
10000030-5 = "Первое — клуб Инь-Ян, который более-менее выполняет роль ученического совета академии."
10000030-6 = "А второе — Совет по урегулированию Хяккарёран."
10000030-7 = "Но я слышала, что Хяккарёран сейчас временно не работает!"
10000030-8 = "Ага. Пина права."
10000030-9 = "Получается, остаётся только клуб Инь-Ян... на первый взгляд."
10000030-10 = "[s] «На первый взгляд»?"
10000030-11 = "Насчёт этого..."
10000030-12 = "Позже поймёшь, что я имею в виду!"
10000030-13 = "А пока пойдём, Сенсей."
10000030-14 = "Пина, пока меня нет, Момоёдо на тебе."
10000030-15 = "Есть! Я никому не позволю посягнуть на НАШУ территорию!"
10000030-16 = "Хорошо. Перед уходом ответь мне на один вопрос."
10000030-17 = "Валяйте!"
10000030-18 = "Допустим, пока мы с Сенсеем отсутствуем, сюда придут Моурё."
10000030-19 = "Что ты сделаешь, если они постучат в дверь и скажут: «Простите, можно воды?»"
10000030-20 = "Гангстер с чувством справедливости никогда не проигнорирует нуждающегося!#nЯ помогу им!"
10000030-21 = "Нет! Неправильный ответ!"
10000030-22 = "*вздыхает* И что мне с тобой делать?"
10000030-23 = "Может, не стоит оставлять магазин вот так..."
10000030-24 = "Вы слишком переживаете, президент! Я справлюсь!"
10000030-26 = "Мы с Шизуко вышли из Момоёдо и подошли к внушительному зданию."
10000030-27 = "Это одно из важнейших мест Объединённой академии Хяккияко."
10000030-28 = "Клуб Инь-Ян должен быть внутри."
10000030-29 = "Ух... У меня всегда всё внутри сжимается, когда я прихожу сюда."
10000030-30 = "[s] «Почему?»"
10000030-31 = "Ну... клуб Инь-Ян не слишком склонен к сотрудничеству и редко соглашается помогать."
10000030-32 = "По правде говоря, с этой просьбой лучше было бы обратиться к Хяккарёран..."
10000030-33 = "Клуб Инь-Ян утверждает, что существует ради поддержания баланса в Хяккияко..."
10000030-34 = "...так что никто не гарантирует, что они будут сотрудничать. Только усмехнутся и скажут: «У нас нет полномочий»."
10000030-35 = "По крайней мере, именно так всегда говорит их самодовольная президент!"
10000030-36 = "А ещё у них правило: любые официальные вопросы сначала обязательно оформлять письменно."
10000030-37 = "Да дайте передохнуть! У кого на это есть время, когда фестиваль уже идёт?!"
10000030-38 = "Мой старый враг — бюрократия! Вечно эта бюрократия!"
10000030-39 = ""
10000030-40 = "Ха-ха. Ладно, хватит жаловаться."
10000030-41 = "У нас есть способы заставить их сотрудничать. А в этот раз на нашей стороне ты и Шале, Сенсей."
10000030-42 = "Пока ты здесь, президент клуба Инь-Ян будет вынуждена нас выслушать."
10000030-43 = "На этот раз преимущество будет у меня против этой самодовольной занозы.#nХе-хе-хе..."
10000030-44 = "Э-эм, то есть... Очень надеюсь, что она нас выслушает! Х-хи-хи-хи..."
10000030-45 = "[s] «Ты даже сейчас пытаешься держать образ?»"
10000030-46 = "З-забудь, что слышал! Просто зайдём внутрь!"
10000030-49 = "Добро пожаловать, Сенсей. Мы ждали тебя."
10000030-50 = "Эй, Чисэ... Погоди. Ты только что сказала, что знала о приходе Сенсея?"
10000030-51 = "Откуда ты знала?"
10000030-52 = "Мне сказала Ния."
10000030-53 = "И вот вы оба здесь."
10000030-54 = "Милый Сенсей..."
10000030-55 = "...и енот."
10000030-56 = "Ч-что...?! Кого это ты назвала енотом?!"
10000030-57 = ""
10000030-58 = "А где ваша всезнайка-президент?"
10000030-59 = "Президент?"
10000030-60 = "Она..."
10000030-61 = "Хм..."
10000030-62 = "Лично я думаю, что чёрная кошка была бы куда лучше в качестве питомца."
10000030-63 = "Никто не просил тебя советовать питомцев!"
10000030-64 = "Погоди... Ты намекаешь, что я какой-то домашний енот?!"
10000030-65 = ""
10000030-66 = "В любом случае... Мы с Сенсеем пришли сюда именно для встречи с ней."
10000030-67 = "Так что? Где она, Чисэ?"
10000030-68 = "Президент?"
10000030-69 = "Она отсутствует..."
10000030-70 = "...до конца дня."
10000030-71 = "Вернётся завтра."
10000030-72 = "До конца дня? Но ещё рано. По какой причине?"
10000030-73 = "...? *наклоняет голову*"
10000030-74 = "Посмотреть... на кошку?"
10000030-75 = "Почему ты сказала это вопросительно? Кто-нибудь объяснит, что вообще происходит!"
10000030-76 = "Ну конечно, эта раздражающая президент отсутствует именно тогда, когда нужна больше всего..."
10000030-77 = "[s] Объясни Чисэ, зачем вы пришли."
10000030-78 = "Да, я знаю всё об инциденте на фестивале."
10000030-79 = "Знаешь?!"
10000030-80 = "Президент сказала, что напрямую мы помочь не можем..."
10000030-81 = "...но, возможно, сможет Клуб внутренней дисциплины."
10000030-82 = "Клуб внутренней дисциплины?"
10000030-83 = "Клуб внутренней дисциплины тоже обращался по поводу беспорядков на фестивале. Позиция президента примерно такая..."
10000030-84 = "...если одна группа не справляется, почему бы им не попробовать работать вместе?"
10000030-85 = "[s] «Наверняка есть клубы с похожими проблемами.»"
10000030-86 = "Ты хочешь сказать, Клуб внутренней дисциплины... тоже ищет помощи?"
10000030-87 = "Ладно, больше ничего не говори. Пойдём навестим их."
10000030-88 = "Чисэ, свяжись со мной, если ваша президент вернётся."
10000030-89 = "Пойдём, Сенсей! Вперёд!"
10000030-90 = ""
10000030-91 = ""
10000030-92 = "Ага. До встречи..."
10000030-94 = "Итак, Клуб внутренней дисциплины. Они немного... Как бы это сказать?"
10000030-95 = "Их участницы известны тем, что слегка странные."
10000030-96 = "[s1] «ЭТО ты называешь их странными?»\n[s2] «Страннее тебя?»"
10000030-97 = "Что ты пытаешься сказать? Что я...?"
10000030-98 = "Ты считаешь меня странной?! Я НЕ странная, Сенсей!"
10000030-99 = "Как ты можешь называть собственной идола Момоёдо, Кавава Шизуко, чудачкой?"
10000030-100 = "В ЛЮ-БОМ СЛУ-ЧА-Е!"
10000030-101 = "Клуб внутренней дисциплины занимается всяческими тренировками, чтобы совершенствовать себя."
10000030-102 = "Например, они собирают пазлы во сне, чтобы улучшить режим сна."
10000030-103 = "[s] «Они делают что?»"
10000030-104 = "Они даже разбираются с хулиганами, чтобы повысить свой уличный авторитет."
10000030-105 = "[s] «Что, прости?»"
10000030-106 = "А лучшие из них даже умеют читать мысли!"
10000030-107 = "[s] «Это шутка? Такое чувство, будто меня сейчас пранкуют.»"
10000030-108 = "Это НЕ шутка. Ну, по крайней мере, если верить рассказам.#nСкоро сам увидишь."
10000030-109 = "И всё же я не уверена, что они нам помогут."
10000030-110 = "Ой, прости... Мне стоит перестать думать так негативно!"
10000030-111 = "Не узнаем, пока не попробуем!"
10000030-112 = "Пойдём к Клубу внутренней дисциплины!"
10000030-113 = ""
10000030-115 = "*кашель* *кашель* Ч-что это было?!"
10000030-116 = ""
10000030-117 = "Ха-ха-ха! Моурё вернулись, чтобы испортить фестиваль!"
10000030-118 = "В этот раз мы разнесём здесь всё!"
10000030-119 = ""
10000030-120 = "Чёрт! Опять они!"
10000030-121 = "Давайте! Мы готовы драться в любое время и в любом месте!"
