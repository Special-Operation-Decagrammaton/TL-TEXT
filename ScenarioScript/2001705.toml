[translation]
2001705-1 = "Девушка всё ещё хочет знать"
2001705-2 = "Мне ничего не оставалось, кроме как купить Хиёри свежий выпуск Ron-ro."
2001705-3 = "Спасибо!"
2001705-5 = "[ns] Отправиться в заброшенное здание, где находится Хиёри."
2001705-8 = "Заброшенный отель"
2001705-9 = "[ns1] «(Кажется, она говорила, что это здесь...)»\n[ns2] «(Вокруг никого не видно.)»"
2001705-10 = "...Ух."
2001705-11 = "...Ух."
2001705-12 = "[s3] «(Кто-то стонет?)»\n[s4] «(Это Хиёри?!)»"
2001705-13 = "У-у-ух... Больно...!"
2001705-14 = "У-у-ух... Больно...!"
2001705-15 = "[s] Проверить, откуда доносится голос."
2001705-16 = ""
2001705-23 = ""
2001705-24 = "Я нашёл Хиёри лежащей в углу подвала."
2001705-25 = "[s] «Хиёри?! Что случилось?»"
2001705-26 = "С-Сенсей?! Вы снова меня нашли?"
2001705-27 = "Мой живот... Я... Я неудачница!! Уф..."
2001705-28 = "[ns] «Мы едем в больницу, сейчас же!»"
2001705-30 = "Я поспешно отвёз Хиёри в ближайшую больницу."
2001705-32 = "К счастью, ничего серьёзного. У неё расстройство желудка, но через несколько дней в больнице она восстановится."
2001705-33 = "[s] «Какое облегчение. Спасибо.»"
2001705-34 = "Но кроме того, пациентка недоедает. Пожалуйста, следите, чтобы она полноценно питалась."
2001705-35 = "[s] «...»"
2001705-37 = "Сенсей..."
2001705-38 = "[s] «Лежи, Хиёри. Тебе сказали отдыхать.»"
2001705-39 = "Простите... Эта бесполезная неудачница снова доставила вам хлопоты."
2001705-40 = "Я выпила воду из крана в заброшенном здании. Я не знала..."
2001705-41 = "Если бы принесла её остальным, они бы тоже заболели. Я бы заставила их страдать ещё сильнее."
2001705-42 = "[s] «Зачем ты пьёшь грязную воду?»"
2001705-43 = "В Ариусе я постоянно пила воду из-под крана. И проблем не было..."
2001705-44 = "Может, моё тело не привыкло к этой среде."
2001705-45 = "[s] «Бактерии одинаковы и здесь, и в Ариусе.»"
2001705-46 = "Наверное, это наказание за мелкое воровство... За мои неудачи..."
2001705-47 = "Но..."
2001705-48 = "Я не могу создавать ещё больше проблем. Наверняка все волнуются."
2001705-49 = ""
2001705-50 = "Мне нужно вернуться."
2001705-51 = ""
2001705-52 = "[s] «Больные пациенты из постели не встают. Лежи.»"
2001705-53 = "Но..."
2001705-54 = "[s] «Я принёс тебе новый выпуск Ron-ro.»"
2001705-55 = "...! В-Вы случайно не купили новый номер с тематической статьёй?!"
2001705-56 = "А. Вы меня поймали. Я клюнула, да?"
2001705-57 = "Понятно... Бесполезным неудачницам вроде меня остаётся только подчиниться... Взрослые и правда страшные."
2001705-58 = ""
2001705-60 = ""
2001705-62 = "С-Сенсей... Мне немного страшно... Можете остаться со мной?"
2001705-63 = "[s5] «Ради тебя — хоть на всю ночь.»\n[s6] «Конечно.»"
2001705-64 = "Спасибо..."
2001705-65 = "Спасибо..."
2001705-67 = "Я решил остаться и ухаживать за Хиёри всю ночь."
2001705-69 = "Я задремал, а проснувшись, обнаружил, что Хиёри исчезла."
2001705-70 = "[ns] «Хиёри...?»"
2001705-72 = "[ns] «Куда она могла уйти в таком состоянии?»"
2001705-73 = "УААААААА!!"
2001705-74 = "Сенсей! Я всё это время была права! Я и правда неудачница!"
2001705-75 = "Посмотрите, что написано в журнале! Пупок нормального человека выглядит вот так! А мой... Мой...!"
2001705-78 = "― Сенсей, смотрите.[wa:1850]"
2001705-80 = "― Посмотрите на меня...[wa:520]"
2001705-83 = "― О-Он ведь немного другой, да?[wa:1690]"
2001705-85 = "― Он выглядит странно?"
2001705-88 = "― Я всё переживала,[wa:440]"
2001705-90 = "― что он выглядит странно...[wa:880]"
2001705-93 = "― И оказалась права![wa:1240]"
2001705-96 = "― Сенсей?[wa:2260]"
2001705-98 = "― Почему вы всё время отводите взгляд?[wa:1180]"
2001705-101 = "― Неужели он"
2001705-103 = "― н-настолько странный, что вы даже смотреть не можете?[wa:2160]"
2001705-106 = "― Уааа! Значит, так оно и есть...[wa:1560]"
2001705-108 = "― В этой жизни нет смысла.[wa:1610]"
2001705-111 = "― Почему жизнь такая...[wa:1290]"
2001705-114 = "― Моя жизнь такая же испорченная, как это место...[wa:310]"
2001705-116 = "― на которое вы даже смотреть не можете."
2001705-119 = "― Хи-хи... Сенсей.[wa:1780]"
2001705-121 = "― Можете меня немного подбодрить...? [wa:10]"
2001705-124 = "― Скажите, что даже если я странная,[wa:690]"
2001705-126 = "― может, я всё равно могу быть хоть чем-то полезна.[wa:10]"
2001705-129 = "[ns] «Для начала опусти рубашку!»"
2001705-131 = "«10 секретных знаний, которым не учат в школе» говорит, что у привлекательных людей пупок должен выглядеть вот так. Смотрите."
2001705-132 = "[s] «...»"
2001705-133 = "Мало того что я неполноценный человек, даже мой пупок не соответствует норме. Лучше бы я никогда не читала эту статью!"
2001705-134 = "[s] «Хиёри...»"
2001705-135 = "...Сегодня я казалась другой?"
2001705-136 = "[s] «Я конфискую журнал.»"
2001705-137 = "ЧТО?! Нет! Зачем вы это делаете?"
2001705-138 = "Пожалуйста, Сенсей! Не надо! Я ещё не дочитала! Уаааааа!"
