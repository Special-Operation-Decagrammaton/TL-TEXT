[translation]
1005602-1 = "Серина в святую ночь"
1005602-2 = ""
1005602-5 = "Я тоже хочу подарок!"
1005602-6 = "И я! И я!"
1005602-7 = "Я первая! Я пришла раньше!"
1005602-8 = "Так-так. Все становимся в очередь по одному."
1005602-9 = "Подарков хватит на всех, поэтому, пожалуйста, не ссорьтесь."
1005602-10 = ""
1005602-11 = "О! Здравствуйте, Сенсей!"
1005602-12 = "[s1] «Привет, Серина. Как ты?»\n[s2] «Что ты делаешь?»"
1005602-15 = "Я раздаю детям подарки."
1005602-16 = "Эй! Они пролезли без очереди! Они плохие! Плохим детям подарки не дают, правда?"
1005602-17 = "Ох... Ха-ха..."
1005602-18 = "Все должны дождаться своей очереди, хорошо?"
1005602-19 = "То есть если я подожду, ты дашь мне подарок?"
1005602-20 = "Да, конечно! Возможно, так ты даже получишь его быстрее."
1005602-21 = "Хорошо! Тогда я подожду!"
1005602-22 = ""
1005602-25 = "[ns] «Какая же ты трудолюбивая...»"
1005602-26 = "Ну что вы, Сенсей. Это просто часть обязанностей члена Рыцарей скорой помощи."
1005602-27 = "Я не могу принимать похвалу за то, что просто выполняю свою работу."
1005602-28 = "В-Вы считаете меня скромной? Серьёзно, Сенсей! Сегодня вы говорите какие-то нелепости."
1005602-29 = "Правда, в этом нет ничего особенного. Для нас вполне обычно проводить такие благотворительные мероприятия."
1005602-31 = "К тому же... сегодня особенный день."
1005602-32 = "Это единственный день в году, когда люди по-настоящему открывают сердца щедрости и доброте."
1005602-33 = "Ради этого всё и стоит того."
1005602-35 = "Защищать детскую веру в Санту... тоже часть моей работы."
1005602-37 = "Я думал, Санта — старенький дедушка?"
1005602-38 = "Точно! Мама говорит, что он дедушка!"
1005602-39 = "Дедушка Санта! Дедушка Санта!"
1005602-40 = "Где дедушка Санта?"
1005602-41 = ""
1005602-42 = "А-А?"
1005602-43 = "Ну..."
1005602-44 = "[s3] «Дедушка Санта не смог прийти и прислал вместо себя сестру Санту.»\n[s4] «Вы разве не знаете? Это же сестра Санта!»"
1005602-47 = "Ч-что?!"
1005602-48 = ""
1005602-50 = ""
1005602-51 = "О! Ха-ха... Да, всё верно!"
1005602-52 = ""
1005602-54 = ""
1005602-55 = "Я сестра Санта, дети!"
1005602-56 = ""
1005602-58 = ""
1005602-59 = "Вы все хорошо себя вели в этом году? Если да, то получите подарок!"
1005602-60 = ""
1005602-62 = ""
1005602-63 = "Кому дать первому?"
1005602-64 = "Я! Я!"
1005602-65 = "Я в этот раз не лез без очереди... Я ждал!"
1005602-66 = "Эм... А правда, что сестра Санта не приходит к непослушным детям...?"
1005602-70 = "Фух. Отличная работа, Сенсей."
1005602-71 = "[s] «Всю тяжёлую работу сделала ты...»"
1005602-72 = "П-Правда? Ха-ха-ха."
1005602-73 = "Заботиться о детях тяжело, но это очень благодарная работа."
1005602-74 = "[s5] «Отличная работа, сестра Санта.»\n[s6] «Спасибо за твой труд, сестра Санта.»"
1005602-77 = "Сенсей! Пожалуйста, не дразните меня."
1005602-78 = ""
1005602-80 = ""
1005602-81 = "На всякий случай у меня с собой ещё есть медицинские принадлежности."
1005602-82 = "Но надеюсь, пользоваться ими не придётся."
1005602-83 = "Хотя Санте вполне подошло бы раздавать аптечки первой помощи!"
1005602-84 = "[s] «А ты раньше верила в Санту?»"
1005602-85 = ""
1005602-87 = ""
1005602-88 = "Я верила в него до того, как вступила в Рыцари скорой помощи."
1005602-89 = "Э-Это странно?"
1005602-90 = "Правда? Обещаете, что не считаете это странным?"
1005602-91 = "Я... рада это слышать. С вами довольно легко говорить, Сенсей."
1005602-92 = ""
1005602-94 = ""
1005602-95 = "Мне кажется, с тех пор как я вступила в Рыцари скорой помощи, я сильно выросла."
1005602-96 = "Я узнала гораздо больше, чем могла представить... включая настоящую личность Санты."
1005602-97 = "[s] «Наверное, ты расстроилась, узнав, что Санты не существует...»"
1005602-98 = "Хи-хи... Вы так думаете?"
1005602-99 = "В каком-то смысле да, я действительно расстроилась."
1005602-100 = "Но зато потом я сама смогла стать Сантой!"
1005602-101 = "Теперь я могу сама защищать детские мечты. По-моему, это прекрасно."
1005602-102 = ""
1005602-104 = ""
1005602-109 = "О!"
1005602-110 = "Сенсей, снег идёт!"
1005602-111 = ""
1005602-112 = "Настоящее белое Рождество! Потрясающе!"
1005602-113 = "А-Апчхи!"
1005602-114 = ""
1005602-115 = "Но всё-таки довольно холодно, правда?"
1005602-116 = ""
1005602-120 = ""
1005602-125 = "― С-Сенсей?[wa:320]"
1005602-127 = "― Вы уверены, что я могу взять этот шарф?[wa:620]"
1005602-130 = "― Н-Но...[wa:1000]"
1005602-132 = "― Сегодня ведь я должна быть Сантой.[wa:500]"
1005602-135 = "― Это я должна[wa:1880]"
1005602-137 = "― подарить вам подарок..."
1005602-140 = "― А вместо этого сама его получаю...[wa:10]"
1005602-143 = "― Что? Даже Санта заслуживает[wa:1080]"
1005602-145 = "― награды?[wa:880]"
1005602-148 = "― Ну... Если вы так говорите...[wa:2420]"
1005602-150 = "― Хи-хи..."
1005602-153 = "― Спасибо, Сенсей.[wa:620]"
1005602-155 = "― Я буду им дорожить."
1005602-160 = "Этот шарф... такой тёплый."
1005602-161 = "Надеюсь, вы сами не замёрзнете."
1005602-162 = ""
1005602-164 = ""
1005602-168 = "В-Вообще-то... Сенсей?"
1005602-169 = "Можете... побыть со мной ещё немного?"
1005602-170 = "Хотя бы пока этот вечер не закончится."
