[translation]
80000128-1 = "Неожиданный подарок"
80000128-2 = "Я был занят работой, когда..."
80000128-3 = "[ns] «Я вымотался...»"
80000128-5 = "Сенсей, вы тут?"
80000128-6 = ""
80000128-9 = ""
80000128-10 = "О, тут!"
80000128-11 = "[s] «Привет, Нозоми...»"
80000128-12 = "Пахя-хя, что за глаза дохлой рыбы?"
80000128-13 = "А, ага. Да-да. Я знала, что вы опять переработаете."
80000128-14 = "И именно поэтому..."
80000128-15 = "Вот!"
80000128-16 = ""
80000128-18 = ""
80000128-19 = ""
80000128-20 = "Ничего особенного. Просто полезные жевательные витамины. Говорят, подходят уставшим взрослым вроде вас."
80000128-21 = "Вы наверняка уже получили кучу сладкого... и я знаю, что вы вечно СУПЕР заняты."
80000128-22 = "Вот я и подумала, что вам пригодится что-нибудь для бодрости! Пахя-хя!"
80000128-23 = "[ns] «Нозоми...!»"
80000128-24 = ""
80000128-25 = "Эй, что за странное лицо?"
80000128-26 = "Вы что, «растрогались»?"
80000128-27 = "Пф. Будто я сама их делала..."
80000128-28 = "Пахя-хя, Сенсей, вы неожиданно сентиментальный в таких вещах."
80000128-29 = "Ну, надеюсь, вам понравится, раз уж я специально сюда пришла."
80000128-30 = "Тогда я пойду."
80000128-31 = "Я думала прогулять, но вы вроде заняты..."
80000128-32 = "А? Хотите, чтобы я «осталась ненадолго»?"
80000128-33 = ""
80000128-35 = ""
80000128-36 = "Хм, это значит, вы со мной поиграете?"
80000128-37 = "[s] «Да! Работу закончу потом!»"
80000128-38 = "Пахя-хя, вот это настрой! Уже выглядите бодрее!"
80000128-39 = ""
80000128-41 = ""
80000128-42 = ""
80000128-43 = "Отлично, тогда..."
80000128-44 = "С чего начнём?"
80000128-46 = "Я решил забыть о работе и вместо этого весело провести время с Нозоми."
80000128-47 = "Она сказала, что дурачиться тоже помогает ей снимать стресс. Потом она помогала мне с работой до позднего вечера..."
