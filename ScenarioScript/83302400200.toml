[translation]
83302400200-5 = ""
83302400200-6 = "Ох ты. Подумать только, глава префектов нашла время в своём плотном графике и пришла аж к моей камере."
83302400200-7 = "Хе. Для меня честь."
83302400200-8 = ""
83302400200-10 = ""
83302400200-14 = ""
83302400200-15 = "Харуна. Я почти уверена, что уже знаю ответ, но хочу услышать его от тебя самой."
83302400200-16 = "Зачем ты похитила Фууку?"
83302400200-17 = "Хе. Разве не очевидно?"
83302400200-18 = "Еда для вечеринки, которую Фуука готовит к Вечеринке Геенны..."
83302400200-19 = "С какой стати Общество Пандемониума должно заграбастать всё себе? Для их неотёсанных вкусов такая еда просто пропадёт зря!"
83302400200-20 = "Как президент Общества гурманов Геенны, я несу священную обязанность!"
83302400200-21 = "Если речь о новых или необычных блюдах, наш клуб должен попробовать их первым!"
83302400200-22 = "...Можно было и не спрашивать. Ты всегда устраиваешь погром по одной и той же причине."
83302400200-23 = "Ваш клуб не меняется, сколько бы раз мы вас ни сажали."
83302400200-24 = "Мы не были бы Обществом гурманов, если бы не были готовы рискнуть всем ради вкусной еды!"
83302400200-25 = "...Ладно. Это всё, что я хотела услышать. Посиди в камере и хорошенько подумай над своей философией."
83302400200-26 = ""
83302400200-28 = ""
83302400200-32 = "Хе, как скажешь. Буду ждать нашей следующей встречи, Хина."
