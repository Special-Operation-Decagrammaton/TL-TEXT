[translation]
22090-1 = "Episódio 9;A Verdade Cruel (1)"
22090-7 = "[ns] \"Tsukatsuki... Rio...?\""
22090-8 = "Ela é... a presidente do conselho estudantil de Millennium."
22090-9 = "...P-Presidente, o que está fazendo a-aqui...?"
22090-10 = "..."
22090-12 = "Sim, eu sou aquela que lidera o Seminar — o núcleo da Escola de Ciências Millennium."
22090-13 = "E aquela que busca resolver os \"Problemas do Milênio\", seguindo as estrelas."
22090-14 = "Normalmente, eu gostaria de ter marcado uma ocasião formal para cumprimentar o Sensei da Schale, mas..."
22090-15 = "Hoje tenho outro assunto a tratar, então deixemos isso para uma próxima oportunidade..."
22090-16 = "[s] \"Afinal, que 'verdade' é essa?\""
22090-17 = "Isso mesmo — a \"verdade\"."
22090-18 = "Vocês chegaram a uma conclusão após o \"incidente\" de alguns dias atrás, não chegaram?"
22090-19 = "Uma face diferente mostrada por aquela que sempre consideraram uma amiga.#nE a destruição e o caos que surgiram ao mesmo tempo."
22090-20 = "E então — vocês não pensaram nisto?"
22090-25 = "\"Talvez aquilo que sempre consideramos uma amiga não seja realmente isso\" — não é?"
22090-26 = "Não estou certa?#nSensei da Schale."
22090-27 = "...!!"
22090-31 = "[ns] \"Rio, o que exatamente você...\""
22090-32 = "Para ir direto ao ponto..."
22090-35 = "Essa garota atrás de você..."
22090-36 = "— \"Aquilo\" que possui a aparência de uma garota não é uma aluna comum."
22090-37 = "Aquilo que vocês batizaram de Aris é..."
22090-40 = "— A comandante do \"Exército Incompreensível\" que invade vindo do desconhecido,"
22090-41 = "um \"OOPArt\" adorado pelos Sacerdotes Sem Nome que veneram o \"Deus Sem Nome\" —#no legado deixado por um povo antigo —"
22090-42 = "E o seu nome é..."
22090-44 = "\"Princesa dos Deuses Sem Nome AL-1S\"."
22090-51 = "[ns] \"Sem Nome...?\""
22090-52 = "Aris..."
22090-53 = "Aris não consegue... entender..."
22090-54 = "Isso mesmo! O que você está dizendo?!"
22090-55 = "Pare de impor essas histórias inventadas da sua cabeça!"
22090-56 = "Eu conheço bem esse papo porque minha irmã sempre faz isso.#nNão saia inventando lore pra Aris do nada!"
22090-58 = "M-Midori..."
22090-59 = "— Peço desculpas. Faltou consideração da minha parte."
22090-60 = "Para facilitar a compreensão, vou usar uma analogia com os \"jogos\" de que vocês tanto gostam."
22090-64 = "Em outras palavras, \"Aris\".#nVocê é..."
22090-65 = "O \"Lorde Demônio\" nascido para destruir este mundo."
22090-66 = "...!!"
22090-67 = "[s] \"A Aris é... um Lorde Demônio?\""
22090-68 = "De novo com essa história... Por que você está dizendo uma coisa dessas?!"
22090-69 = "O que você está tramando, afinal?!"
22090-70 = "Não estou tramando nada.#n— Pelo contrário, eu é que gostaria de perguntar..."
22090-71 = "Vocês não viram com os próprios olhos?#nO que aconteceu quando a Aris entrou em contato com o \"Exército Incompreensível\"."
22090-72 = "[s] \"'Exército Incompreensível'...\""
22090-80 = "[ns] \"Você quer dizer... aquele robô...?\""
22090-81 = "— Exatamente."
22090-82 = "Originalmente, nada daquilo deveria ter acontecido... foi um erro total da nossa parte."
22090-83 = "Achei que tínhamos rastreado todos eles com a C&C e os AMAS —#njamais imaginei que uma unidade escaparia da nossa rede de vigilância."
22090-84 = "Isso foi inteiramente culpa da minha falha.#nPeço desculpas por isso."
22090-88 = "Hã? Desculpas? A presidente?!#nHã...?"
22090-89 = "— Contudo."
22090-90 = "[s] \"Contudo?\""
22090-91 = "Graças a isso, minha hipótese foi comprovada."
22090-93 = "Aquilo com que vocês entraram em contato é uma \"calamidade\" que transbordou das \"Ruínas\"."
22090-94 = "Um pesadelo que trará o fim a Millennium — e, consequentemente, a toda Kivotos."
22090-95 = "E ficou provado que a existência da Aris está atraindo essas coisas para fora das \"Ruínas\"."
22090-97 = "Desta vez, por sorte, vocês só encontraram uma unidade quase destruída, mas..."
22090-98 = "Da próxima vez, não vai acabar tão facilmente."
22090-110 = "[ns] \"...\""
22090-111 = "Só existe uma maneira de resolver essa ameaça, Aris."
22090-112 = "Uma maneira... de resolver...?"
22090-113 = "Sim.#n— Você desaparecer, Aris."
22090-114 = "Você não pode existir neste mundo."
22090-115 = "...N-Não..."
22090-116 = "Aris... só queria... ser uma heroína..."
22090-117 = "Jogar... com todo mundo...#nFazer missões... era só isso que Aris queria..."
22090-118 = "Não, isso não vai se realizar."
22090-119 = "Não entendo muito de jogos, mas... tenho conhecimento de dicionário."
22090-123 = "Por isso, vou lhe fazer uma pergunta."
22090-124 = "Você se autointitula uma heroína, mas..."
22090-128 = "Por acaso uma \"heroína\" apontaria sua espada contra os próprios amigos?"
22090-130 = "Na verdade, o que você fez não seria papel de uma vilã?"
22090-134 = "...!"
22090-138 = "Aris-chan! Não dê ouvidos a ela!"
22090-139 = "Eu tinha ouvido falar que a presidente era excêntrica, mas...#nnunca imaginei que fosse uma pessoa assim...!"
22090-141 = "S-Sensei...!"
22090-143 = "[ns] \"...Rio, pare.\""
22090-144 = "Parar? Parar o quê?"
22090-145 = "Desviar os olhos dos fatos não é compaixão, Sensei."
22090-146 = "Isso é mera \"fuga da realidade\" — abandonar a responsabilidade que se deve assumir é uma atitude extremamente irracional."
22090-147 = "[s] \"Isso não é uma questão de ser racional ou irracional...\""
22090-148 = "Então, a Aris..."
22090-149 = "O que a Aris... deveria fazer...?"
22090-150 = "Como eu disse antes —"
22090-151 = "A origem de tudo isso é você, Aris,"
22090-152 = "tudo está acontecendo porque você está aqui."
22090-153 = "Sendo assim, o resto é simples, não acha?"
22090-154 = "Uma bomba — basta desarmá-la em um local seguro."
22090-155 = "Desarmar... uma bomba...?"
22090-156 = "Ah... ficou difícil de entender?"
22090-163 = "Ou seja — basta destruir a sua auréola e tudo estará resolvido."
22090-170 = "?!?!"
22090-175 = "Ah, mas... será que essa coisa em você é mesmo uma auréola?"
22090-176 = "Como você, que não é uma aluna, possui uma auréola...#nNão sei o motivo, mas —"
22090-177 = "Uma mera máquina como você possuir uma auréola..."
22090-178 = "Sim, é igual àquela IA tomada pela loucura."
22090-179 = "É... mais um motivo para não podermos deixá-la livre por aí."
22090-180 = "[s] \"Rio.\""
22090-182 = "[ns] \"Não vou perdoar se você disser mais uma palavra.\""
22090-183 = "...Se minhas palavras e ações são desagradáveis, peço desculpas."
22090-184 = "Desde sempre, muitas pessoas me detestaram."
22090-185 = "— Afinal, o problema deve estar em mim."
22090-186 = "Mas não me importo se não me compreenderem. Eu só quero proteger a todos."
22090-187 = "Pois bem, é a sua vez — Mikamo Neru."
22090-194 = "...!"
22090-195 = "Neru... senpai..."
22090-196 = "..."
22090-200 = "[ns] \"Neru...?\""
22090-201 = "..."
22090-202 = "Não a julguem mal."
22090-203 = "Originalmente, a C&C pertence ao Seminar... ou melhor, são agentes sob meu comando direto."
22090-204 = "Não há sentimentos pessoais envolvidos.#nElas apenas obedecem solenemente às minhas ordens."
22090-205 = "Contra a líder da C&C — a Neru — nem mesmo você, Sensei, conseguiria resistir apenas com o Clube de Desenvolvimento de Jogos, certo?"
22090-206 = "E mesmo que peça ajuda externa —"
22090-214 = "Os arredores já estão completamente cercados pelos AMAS.#nNenhum reforço chegará a tempo."
22090-215 = "Vamos, hora de trabalhar.#nNeru, poderia recolher a Aris?"
22090-217 = "..."
22090-218 = "Neru-senpai..."
22090-222 = "...Heh."
22090-223 = "Heh...?"
22090-227 = "Droga, nem ferrando que eu vou fazer isso!"
22090-231 = "Neru... O que exatamente você pretende?"
22090-236 = "[ns] \"Neru...!\""
22090-238 = "...Neru-senpai?"
22090-239 = "Olha, eu nunca fui muito fã dos seus pedidos mesmo, viu."
22090-240 = "Mas sequestrar uma aluna da mesma escola — e ainda por cima uma que nem sabe o que tá rolando?"
22090-241 = "— Nem ferrando que eu pego um serviço desses."
22090-242 = "Não tenho mais obrigação nenhuma de te aturar — Rio!"
22090-243 = "Neru... Você pretende me trair aqui?"
22090-244 = "Trair?#nHah! Eu só não fui com a cara da sua ordem!"
22090-246 = "Entendo, então é isso..."
22090-247 = "Neru, você é sempre assim."
22090-248 = "Esse seu jeito de desobedecer ordens conforme o humor —"
22090-249 = "Esse seu lado explosivo, feito uma bomba-relógio que nunca se sabe quando vai estourar, é a sua maior virtude...#ne também o que mais dá trabalho."
22090-250 = "...Por isso, até mesmo esta situação estava dentro dos meus cálculos."
22090-251 = "Fiz bem em chamar apenas você desde o início, em vez de toda a C&C."
22090-252 = "Hã? Que papo é esse?"
22090-253 = "Toki — é a sua vez."
22090-258 = "[ns] \"Neru, cuidado!\""
22090-259 = "Hã?"
22090-268 = "Quem diabos é você?!"
22090-274 = "Prazer em conhecê-la, senpai.#n— E a você também, Sensei."
22090-275 = "Membro da C&C, codinome Zero Quatro. Apresentando-me."
22090-276 = "Quê... a quinta...?"
22090-277 = "[s] \"Da C&C...?\""
22090-278 = "Ataque surpresa pelas costas? Tá me tirando, sua pirralha?"
22090-279 = "Tá preparada pro que vem aí?!"
22090-280 = "[ns] \"Neru, espera...!\""
