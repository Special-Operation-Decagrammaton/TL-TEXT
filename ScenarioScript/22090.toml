[translation]
22090-1 = "Эпизод 9; Жестокая правда 1"
22090-3 = ""
22090-6 = ""
22090-7 = "[ns] «Цукацуки Рио...?»"
22090-8 = "Сенсей, она... президент Миллениума."
22090-9 = "Ч-Что президент здесь делает...?"
22090-10 = "..."
22090-12 = "Верно. Я — центр Научной школы Миллениум, глава Семинара и..."
22090-13 = "...та, кто стремится к звёздам в надежде разгадать Загадку Миллениума."
22090-14 = "Я предпочла бы, чтобы наша первая встреча была более официальной, но..."
22090-15 = "Сегодня я здесь не из-за вас, Сенсей."
22090-16 = "[s] «Ты сказала, что пришла рассказать нам правду...»"
22090-17 = "Да. Правду."
22090-18 = "После происшествия несколько дней назад вы и студенты Департамента Разработки Игр наверняка думаете об одном и том же."
22090-19 = "Вы не можете перестать думать о совершенно неожиданной стороне того, кого считали другом... и о разрушениях и хаосе, которые она устроила."
22090-20 = "А при таком ходе мыслей естественным следующим шагом будет..."
22090-21 = ""
22090-23 = ""
22090-25 = "\"Тот, кого я считала другом, возможно, вовсе мне не друг\"."
22090-26 = "Разве не так, Сенсей?"
22090-27 = "...!"
22090-28 = ""
22090-30 = ""
22090-31 = "[ns] «Рио, что за чушь ты несёшь?»"
22090-32 = "Хорошо. Скажу прямо."
22090-34 = ""
22090-35 = "Маленькая девочка у вас за спиной..."
22090-36 = "Точнее, \"вещь\" за вашей спиной — не обычный студент."
22090-37 = "То, что вы называете Алисой, — это..."
22090-39 = ""
22090-40 = "Командир таинственной армии, вторгающейся с неизвестной территории."
22090-41 = "Алиса — Артефакт, которому поклонялись Безымянные жрецы, служившие Безымянным Богам, и наследие, оставленное прежними обитателями Кивотоса."
22090-42 = "Она..."
22090-44 = "...принцесса Безымянных Богов, AL-1S."
22090-49 = ""
22090-50 = ""
22090-51 = "[ns] «Безымянных... кого?»"
22090-52 = "Я..."
22090-53 = "Я... не понимаю, о чём вы говорите..."
22090-54 = "Эй! Как вы смеете так о ней говорить?!"
22090-55 = "Нельзя просто ворваться сюда, наговорить непонятных вещей и ждать, что мы покиваем и поверим!"
22090-56 = "Так со мной может поступать только моя сестра! Алиса — наша подруга, а не какая-то странная принцесса!"
22090-58 = "М-Мидори..."
22090-59 = "Ты права. Прошу прощения. Возможно, я проявила недостаточно такта."
22090-60 = "Чтобы было проще понять, сравню это с играми, в которые вы часто играете."
22090-61 = ""
22090-63 = ""
22090-64 = "Алиса, по сути твоё существование..."
22090-65 = "...равнозначно существованию тёмного владыки, рождённого уничтожить этот мир."
22090-66 = "...!"
22090-67 = "[s] «Алиса... повелитель демонов?»"
22090-68 = "Говорю же, это полный бред."
22090-69 = "Зачем вы всё это говорите?! Чего вы добиваетесь?"
22090-70 = "Ничего. На самом деле это я хочу задать вам несколько вопросов."
22090-71 = "Вы уже сами видели и пережили то, что произошло при контакте Divi:Sion и Алисы."
22090-72 = "[s] «То есть Divi:Sion — это...»"
22090-73 = ""
22090-76 = ""
22090-78 = ""
22090-79 = ""
22090-80 = "[ns] «Те... странно выглядящие роботы?»"
22090-81 = "Да. Верно."
22090-82 = "Вы вообще не должны были с ними соприкасаться."
22090-83 = "Я думала, все роботы отслеживаются силами C&C и AMAS. Не могла поверить, что некоторым удалось уйти из сети наблюдения."
22090-84 = "Это определённо моя ошибка. Прошу прощения."
22090-85 = ""
22090-87 = ""
22090-88 = "А-А? Президент... извиняется...?"
22090-89 = "И всё же."
22090-90 = "[s] «Да?»"
22090-91 = "Это событие доказало, что угроза, существование которой я лишь предполагала, реальна."
22090-93 = "Если говорить прямо, существа, с которыми вы столкнулись, — бедствия, вырвавшиеся из руин."
22090-94 = "Это кошмар, который принесёт разрушение Миллениуму и Кивотосу."
22090-95 = "Само существование Алисы зовёт их из руин."
22090-96 = ""
22090-97 = "На этот раз нам повезло: она столкнулась лишь с полуразрушенным хламом..."
22090-98 = "Но уверяю вас, в следующий раз всё не закончится так благополучно."
22090-99 = ""
22090-101 = ""
22090-102 = ""
22090-103 = ""
22090-104 = ""
22090-105 = ""
22090-106 = ""
22090-108 = ""
22090-110 = "[ns] «...»"
22090-111 = "Есть только один способ как можно быстрее устранить эту угрозу, Алиса."
22090-112 = "Устранить... эту угрозу? Угроза — это я?"
22090-113 = "Да, Алиса. Ты должна исчезнуть."
22090-114 = "Ради этого мира тебя не должно существовать. Тебя вообще никогда не должно было существовать."
22090-115 = "...Это так... но..."
22090-116 = "Я просто... хотела стать... героем..."
22090-117 = "Я всего лишь хотела... выполнять... игровые квесты..."
22090-118 = "К сожалению, для тебя это невозможно."
22090-119 = "У меня мало опыта с играми... но знаний о них достаточно, чтобы хотя бы объяснить тебе понятным языком."
22090-120 = ""
22090-122 = ""
22090-123 = "Поэтому позволь спросить."
22090-124 = "Ты называешь себя героем, но..."
22090-125 = ""
22090-127 = ""
22090-128 = "Ты напала на свою подругу и ранила её. Она до сих пор не очнулась."
22090-130 = "Разве это не больше похоже на злодея, которого должен победить герой?"
22090-131 = ""
22090-134 = "...!"
22090-135 = ""
22090-138 = "Алиса! Всё это чушь!"
22090-139 = "Я слышала, что президент Семинара странная, но это превзошло все мои ожидания! Вы ненормальная!"
22090-141 = "С-Сенсей...! П-Помогите..."
22090-142 = ""
22090-143 = "[ns] «...Рио, прекрати. Немедленно.»"
22090-144 = "Что именно мне следует прекратить?"
22090-145 = "Перестать говорить правду? Отворачивание от реальности никому не поможет, Сенсей."
22090-146 = "Слепо верить в свои идеалы похвально, но иррационально. Это правда."
22090-147 = "[s] «Дело не в рациональности...»"
22090-148 = "Ч-Что..."
22090-149 = "Что мне... нужно сделать...?"
22090-150 = "Не волнуйся. Всё просто."
22090-151 = "Ты ответственна за все кризисы, возникшие здесь."
22090-152 = "Сам факт твоего существования — ядро проблемы. Ты словно бомба с часовым механизмом."
22090-153 = "А если причина проблемы ясна, то и решение очевидно."
22090-154 = "Когда рядом опасная бомба, её нужно перенести в безопасное место и обезвредить."
22090-155 = "Обезвредить...? Я... бомба...?"
22090-156 = "Это оказалось слишком сложно для понимания? Тогда скажу проще."
22090-157 = ""
22090-159 = ""
22090-162 = ""
22090-163 = "Твой нимб должен быть уничтожен."
22090-164 = ""
22090-166 = ""
22090-168 = ""
22090-170 = "?!?!?!?!?!?!?!"
22090-171 = ""
22090-173 = ""
22090-174 = ""
22090-175 = "Хватит драматизировать. Подумай: этот нимб вообще был твоим с самого начала?"
22090-176 = "У тебя вообще не должно быть нимба. Ты не человек."
22090-177 = "Ты машина, которая каким-то образом обрела нимб."
22090-178 = "Алиса, ты — сошедший с ума ИИ."
22090-179 = "Поэтому я не могу просто оставить тебя без присмотра."
22090-180 = "[s] «Рио.»"
22090-182 = "[ns] «Прямо сейчас я не потерплю от тебя больше ни слова.»"
22090-183 = "...Прошу прощения. Мне уже говорили, что я выражаюсь слишком резко."
22090-184 = "Полагаю, поэтому большинство людей меня и не любит."
22090-185 = "Возможно, проблема во мне."
22090-186 = "Но мне всё равно. Можете понимать меня неправильно сколько угодно. Именно я защищаю всех от опасности."
22090-187 = "Хорошо, твой ход, Микамо Неру."
22090-188 = ""
22090-193 = ""
22090-194 = "...!"
22090-195 = "Неру..."
22090-196 = "..."
22090-197 = ""
22090-199 = ""
22090-200 = "[ns] «Неру...?»"
22090-201 = "..."
22090-202 = "Пожалуйста, не принимайте это на личный счёт."
22090-203 = "Изначально C&C был частью Семинара... Точнее, это клуб агентов, действующий по моим прямым приказам."
22090-204 = "Надеюсь, вы понимаете: я делаю это не из личной неприязни. Я лишь выполняю необходимое."
22090-205 = "Даже Сенсей и Департамент Разработки Игр не смогут противостоять Неру, лидеру C&C."
22090-206 = "И помощи вам ждать неоткуда."
22090-207 = ""
22090-212 = ""
22090-213 = ""
22090-214 = "Вся окружающая территория занята моими AMAS. Вас уничтожат раньше, чем кто-либо со стороны успеет пошевелить пальцем."
22090-215 = "Что ж, монолог окончен. Неру, забери Алису."
22090-217 = "..."
22090-218 = "Маленькая... старшекурсница Неру..."
22090-219 = ""
22090-221 = ""
22090-222 = "...Ха."
22090-223 = "Ха...?!"
22090-224 = ""
22090-226 = ""
22090-227 = "Аргх! Как же бесит!"
22090-228 = ""
22090-230 = ""
22090-231 = "Неру?! Почему ты вдруг напала на меня? Только не говори, что..."
22090-232 = ""
22090-234 = ""
22090-235 = ""
22090-236 = "[ns] «Неру!»"
22090-237 = ""
22090-238 = "Н-Неру?"
22090-239 = "Ты вечно заставляешь меня делать то, чего я не хочу. И я делаю!"
22090-240 = "Но это? ЭТО?! Ты хочешь, чтобы я похитила невиновного студента из собственной школы? Чтобы ты уничтожила её нимб? МОЮ ПОДРУГУ?!"
22090-241 = "Вот здесь мой предел! Я этого не сделаю!"
22090-242 = "Ты думала, что можешь вечно мной помыкать? Что я всю жизнь буду твоей маленькой марионеткой?!"
22090-243 = "Неру... Ты меня предаёшь?"
22090-244 = "Предаю? Ха! Чтобы предать верность, она сначала должна быть! Я не стану выполнять приказ, с которым не согласна!"
22090-246 = "Ах, понятно..."
22090-247 = "Неру, ты всегда была такой."
22090-248 = "Ты никогда не сомневалась, прежде чем ослушаться приказа, если была не в настроении."
22090-249 = "Твоя вспыльчивость — твоя сила... и одновременно самая раздражающая твоя черта."
22090-250 = "Поэтому я заранее просчитала этот вариант."
22090-251 = "Было правильным решением позвать только тебя, а не всех участниц C&C."
22090-252 = "А? Что?"
22090-253 = "Токи, твой выход."
22090-254 = ""
22090-256 = ""
22090-257 = ""
22090-258 = "[ns] «Неру, берегись!»"
22090-259 = "А?"
22090-260 = ""
22090-266 = ""
22090-268 = "*кха* *кха* Ты кто такая?!"
22090-269 = ""
22090-272 = ""
22090-273 = ""
22090-274 = "Приятно познакомиться, старшекурсница Неру. И Сенсей."
22090-275 = "Я состою в C&C. Позывной — Ноль-Четыре."
22090-276 = "О... пятая...?"
22090-277 = "[s] «Ещё одна участница C&C...?»"
22090-278 = "Ты напала на меня со спины!"
22090-279 = "Тебе это с рук не сойдёт!"
22090-280 = "[ns] «Неру, п-подожди!»"
