[translation]
12080-1 = "Episódio 8;Rumo ao Deserto de Abydos (3)"
12080-3 = "Hmm, drones e autômatos, é..."
12080-4 = "Por algum motivo, esse tipo de coisa adora se juntar por aqui."
12080-5 = "...?! Pessoal, tem alguma coisa logo à frente!"
12080-6 = "Por causa da poeira, ainda não dá para ver direito o que é, mas...!"
12080-7 = "Uma cidade enorme... não, uma fábrica, ou talvez uma base militar...? E-Enfim, parece ser uma instalação gigantesca...?"
12080-8 = "...Uma instalação num lugar desses? Não está vendo coisa, não?"
12080-9 = "Por enquanto, daqui a gente só consegue ver um oásis seco..."
12080-10 = "Acho que provavelmente não é engano meu... Por ora, tentem avançar até onde der para confirmar a olho nu!"
12080-12 = "..."
12080-13 = "O que é isso..."
12080-14 = "Esse arame farpado estendido por aí parece continuar facilmente por vários quilômetros..."
12080-15 = "Uma fábrica...? Não parece ser uma plataforma de perfuração de petróleo... O que será essa construção...?"
12080-16 = "Isso não existia antigamente..."
12080-19 = "Uaaah?! O quê?! O que foi isso?!"
12080-21 = "Invasores!"
12080-22 = "Capturem-nas, não as deixem escapar!"
12080-25 = "Uma força armada não identificada está atacando pela frente!"
12080-26 = "Não entendi muito bem, mas se é uma saudação de boas-vindas, melhor a gente retribuir, né?"
12080-27 = "Então, vamos com tudo~!"
