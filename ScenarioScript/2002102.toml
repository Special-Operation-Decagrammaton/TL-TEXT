[translation]
2002102-1 = "Послушный или непослушный?"
2002102-2 = "Сенсей, это я!"
2002102-3 = "[s] «Привет, Ханаэ! Это новый костюм?»"
2002102-4 = "Да! Теперь я Санта!"
2002102-5 = "И раз уж я его надела..."
2002102-6 = "Я обязана исполнить обязанности Санты!"
2002102-7 = "[s1] «Вот как...? Это так работает?»\n[s2] «Не уверен, но раз ты так говоришь...»"
2002102-8 = "Так вот, насчёт моей проблемы..."
2002102-9 = "Так вот, насчёт моей проблемы..."
2002102-10 = "Вообще-то она связана с моим костюмом."
2002102-11 = "[s3] «Рассказывай.»\n[s4] «Теперь мне ещё любопытнее.»"
2002102-12 = "Раз вы так говорите... Только приготовьтесь, хорошо? Глубоко вдохните. *вдох* *выдох*"
2002102-13 = "Раз вы так говорите... Только приготовьтесь, хорошо? Глубоко вдохните. *вдох* *выдох*"
2002102-14 = "Мне кажется, у меня просто нет всего необходимого, чтобы стать настоящим Сантой!"
2002102-15 = "[s] «Настоящим Сантой? Что это для тебя значит, Ханаэ?»"
2002102-16 = "Очень многое! Во-первых, как мне понять, кто вёл себя хорошо, а кто плохо?"
2002102-17 = "А вдруг я подарю подарок тому, кто его не заслуживает?"
2002102-18 = "И мне ещё нужно уметь таскать очень тяжёлые вещи!"
2002102-19 = "Иначе как я заберусь на крышу с огромным мешком подарков?"
2002102-20 = "А самое ужасное...!"
2002102-21 = "Мне нужно уметь летать со скоростью в два Маха... или быстрее!"
2002102-22 = "Иначе я никогда не успею облететь весь Кивотос за одну ночь!"
2002102-24 = "Я понимал, что нужно сказать ей: Санты не существует, а вся история — просто сказка."
2002102-25 = "Но, глядя на её полный энтузиазма невинный взгляд, я не смог сказать, что всё это выдумка..."
2002102-26 = ""
2002102-27 = "Что вы имеете в виду? Я не настоящий Санта, а просто сегодня нарядилась в него?"
2002102-28 = "То есть вы думаете... мне не нужно так стараться...?"
2002102-29 = "Сенсей, вы неправы! Как вам вообще не стыдно так думать!"
2002102-30 = "Надевая костюм Санты, ты берёшь на себя ответственность! Это очень серьёзно!"
2002102-31 = "Этот костюм — символ детских надежд и мечтаний. И эту обязанность нужно выполнять изо всех сил!"
2002102-32 = "[s5] «Пожалуй... Я понимаю, о чём ты.» \n[s6] «Уф, приплетать надежды и мечты детей... Это нечестно!»"
2002102-33 = "Вот теперь вы меня поняли!"
2002102-34 = "Вот теперь вы меня поняли!"
2002102-35 = "Но мою проблему мы всё ещё не решили. Что мне делать, Сенсей?"
2002102-36 = "[s] «Что для тебя самое важное, Ханаэ?»"
2002102-37 = "Хм... Мне нужно уметь летать со скоростью в два Маха! Давайте начнём с этого!"
2002102-38 = "[s7] «Ну, это уже перебор.»\n[s8] «Скорее всего, это невозможно.»"
2002102-39 = "Ох... А я думала, это как раз самое выполнимое... Тогда с чего мне начать?"
2002102-40 = "Ох... А я думала, это как раз самое выполнимое... Тогда с чего мне начать?"
2002102-41 = "Что? Неважно, сколько времени я буду раздавать подарки?"
2002102-42 = "Наверное, проще будет научиться определять, хорошо ребёнок себя вёл или плохо..."
2002102-43 = "Хорошо, Сенсей! Пожалуйста, научите меня!"
2002102-44 = "[s9] «Я что-нибудь скажу, а ты попробуешь понять, говорю я правду или нет.»\n[s10] «Хорошо. Попробуй определить, вру я или говорю правду.»"
2002102-45 = "О! Как проверка на детекторе лжи!"
2002102-46 = "О! Как проверка на детекторе лжи!"
2002102-47 = "Вы такой умный, Сенсей! Дети могут много о чём соврать, потому что не понимают, что это плохо. Наша задача — распознать ложь и научить их!"
2002102-48 = "Ура! Будет очень весело. С чего начнёте, Сенсей?"
2002102-49 = "[s] «Вообще-то в это время года я ношу с собой мешок...»"
2002102-51 = "[ns] «И летаю со скоростью в два Маха, раздавая подарки.»"
2002102-52 = "Ого! Сенсей, вы... вы прямо как Санта!"
2002102-53 = "Что значит неправда? Но Сенсей ведь может всё!"
2002102-54 = "Это... тоже неправда? Обычный человек так не может?"
2002102-55 = "Кажется... я поняла... Но немного жаль, что вы не умеете летать..."
2002102-56 = "[s] «*кхе-кхе* Аргх, я не могу перестать кашлять, и живот болит!»"
2002102-57 = "О нет! Всё хорошо, Сенсей. Пожалуйста, ложитесь, я вам помогу!"
2002102-58 = "Я читала о таких внезапных болезнях в учебнике! Сначала нужно очистить воздух огнём и изгнать плохую энергию!"
2002102-59 = "Следующий шаг... Ах да! Нужно выпустить побольше крови, а потом отхлестать вас, чтобы помочь преодолеть страдания!"
2002102-60 = "[s] «В этом вообще нет смысла! Я так просто умру!»"
2002102-62 = "Мы с Ханаэ ещё некоторое время играли в детектор лжи."
2002102-63 = "...И я в очередной раз понял, насколько Ханаэ доверчивая и невинная до самой глубины души."
