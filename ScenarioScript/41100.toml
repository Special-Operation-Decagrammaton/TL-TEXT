[translation]
41100-1 = "Episódio 10;Desapego e Bentô de Yakiniku"
41100-11 = "...Ora, já acordou?"
41100-17 = "Como está se sentindo?"
41100-19 = "Se está tudo bem, melhor ainda. Eu estava preocupado caso nossa hospitalidade desajeitada causasse algum problema... Afinal, também é a primeira vez que recebemos alguém de fora de Kivotos."
41100-20 = "[s] \"...Quem é você?\""
41100-21 = "Perdoe-me pela demora nas apresentações. Meu nome é Descartes."
41100-22 = "Sou o líder desta organização, a \"Associação em Busca da Felicidade Certa sem Posses\"... conhecida como \"FeliSem\"."
41100-23 = "[s1] \"???\"\n[s2] \"FeliSem...?\""
41100-24 = "É a primeira vez que ouve falar de nós?"
41100-25 = "É a primeira vez que ouve falar de nós?"
41100-26 = "Achei que qualquer pessoa que buscasse uma vida de pobreza honesta já teria ouvido falar pelo menos uma vez... Entendo."
41100-27 = "Bem, eu já imaginava que pudesse ser esse o caso."
41100-28 = "Afinal, parece que você andou usando suas subordinadas para saquear comida."
41100-29 = "[s] \"Hã, do que você está falando...?\""
41100-30 = "Já chega de se fazer de desentendido! Meus companheiros viram com os próprios olhos você todo amigável com aquelas alunas de orelha de coelho!"
41100-31 = "[s3] \"Orelha de coelho...?\"\n[s4] \"Está falando das meninas do Esquadrão RABBIT?\""
41100-32 = "Não tenho o menor interesse em como essas alunas se chamam."
41100-33 = "Não tenho o menor interesse em como essas alunas se chamam."
41100-34 = "O que importa é que vocês são pessoas gananciosas que estão atrapalhando nossa busca espiritual."
41100-35 = "[s] \"Nós atrapalhamos alguma coisa...?\""
41100-36 = "...Às vezes, somos chamados de certas coisas."
41100-37 = "De \"peso morto\", ou \"escória da sociedade\"..."
41100-38 = "Contudo, nenhum desses rótulos acerta o alvo. Não é que não estejamos fazendo nada..."
41100-39 = "Nós estamos apenas praticando o \"Desapego\"!"
41100-40 = "[s] \"Não estou conseguindo acompanhar o raciocínio...\""
41100-41 = "As pessoas de Kivotos possuem coisas demais."
41100-42 = "Tanques novos, fuzis caros, bunkers à prova de mísseis e por aí vai..."
41100-43 = "Mas esses desejos nunca são saciados. Sempre mais alto, sempre mais caro... No fim, isso só serve para exaurir a vida."
41100-44 = "A verdadeira felicidade não nasce da \"posse\", mas sim do \"desapego\"..."
41100-45 = "Abrir mão de tudo além do mínimo necessário para sobreviver e manter uma existência simples e natural... Só assim se alcança a verdadeira felicidade."
41100-46 = "Por isso vivíamos praticando o \"Desapego\": sem trabalhar e sem possuir nada."
41100-50 = "Porém, certo dia, visitantes indesejadas apareceram por aqui."
41100-51 = "Com orelhas de coelho e empunhando armas que pareciam bem caras, aquelas alunas foram pegando um bentô descartado atrás do outro."
41100-52 = "Depois que elas passaram, não sobrou nem mato no chão... Não restou sequer um único bentô de broto de feijão."
41100-53 = "Já é difícil um \"bentô de yakiniku\" ir parar no descarte... E até esses elas monopolizaram...!"
41100-54 = "Um absurdo desses pode mesmo ser tolerado?!"
41100-55 = "[s] \"Espera, você não tinha dito que não tinha interesse em luxos...?\""
41100-56 = "B-Bem, isso é verdade, mas..."
41100-57 = "Enfim! Não me importa se é Esquadrão RABBIT ou Esquadrão Coelho, não podemos tolerar tamanha atrocidade!"
41100-58 = "E pelo que vejo, você é o líder delas... Vamos, prometa."
41100-59 = "Que daqui em diante, sempre que um \"bentô de yakiniku\" for descartado, vocês vão cedê-lo para nós, da \"FeliSem\"!"
41100-60 = "[s5] \"Elas não são minhas subordinadas.\"\n[s6] \"Elas são apenas minhas alunas.\""
41100-61 = "Subordinadas ou alunas, tanto faz. Elas obedecem ao que você diz, não obedecem?"
41100-62 = "Subordinadas ou alunas, tanto faz. Elas obedecem ao que você diz, não obedecem?"
41100-63 = "...O que é essa cara estranha? Mesmo sendo Sensei, não consegue controlar as próprias alunas?"
41100-64 = "Francamente, não tem jeito mesmo..."
41100-68 = "Se é assim, entregue apenas o seu celular e fique quietinho aí. Eu mesmo vou negociar."
41100-69 = "[s] \"Acho que não vai dar em nada, mas...\""
41100-73 = "Vejamos..."
41100-74 = "Deve ser este aqui."
41100-81 = "...O que você quer? Estamos ocupadas preparando a refeição agora."
41100-82 = "Ah, você é a líder do \"Esquadrão RABBIT\"?"
41100-83 = "Nós somos os buscadores urbanos da verdadeira felicidade, da \"Associação em Busca da Felicidade Certa sem Posses\"... abreviado, \"FeliSem\"—"
41100-87 = "...E-Ela desligou na minha cara?"
41100-88 = "[s] \"Deve ter achado que era golpe ou algo assim...\""
41100-89 = "É-É por isso que pessoas comuns que não conhecem a verdade..."
41100-96 = "A-Alô, pessoal? Parece que houve um mal-entendido e acharam que era um \"trote\" ou algo do tipo..."
41100-97 = "Nós capturamos o Sensei de vocês. Se não atenderem às nossas exigências sem resistir, vamos submetê-lo a um tratamento cruel agora mesmo—"
41100-98 = "Faça o que quiser."
41100-103 = "...Desligou de novo?!"
41100-104 = "O que significa isso?! Você é mesmo o \"Sensei\"?! Elas não demonstraram nem um pingo de preocupação!"
41100-105 = "[s] \"Bem, é uma situação meio complicada...\""
41100-106 = "Droga, dei todo esse trabalho para fazer o Sensei da Schale de refém... Assim os bentôs de luxo vão..."
41100-107 = "Se é assim, vou ter que tentar outro método..."
41100-108 = "[s] \"Posso tentar ligar eu mesmo, só para testar?\""
41100-109 = "Você quer negociar diretamente?"
41100-110 = "Por mim tudo bem, mas é melhor não tentar nenhum truque barato como fingir que negocia para chamar a polícia."
41100-111 = "O armamento da nossa \"FeliSem\" supera facilmente o da Valkyrie, saiba disso!"
41100-112 = "[s] Ligar para o Esquadrão RABBIT."
41100-121 = "Ah, fala sério, o que foi, Sensei... A gente trabalhou até tarde da noite e tá exausta."
41100-122 = "Se não for nada importante, já vou—"
41100-123 = "[s] \"Na verdade, eu encontrei um bentô descartado de bife de wagyu...\""
41100-129 = "Hahaha!"
41100-130 = "Estava tão confiante e acabou sendo ignorado também!"
41100-131 = "Ah, se é assim, vou ter que ameaçar outras alunas..."
41100-142 = "Aqui é a SRT! Quem não é autorizado, saia da frente!"
41100-144 = "Saki, não estamos em uma missão da SRT agora, então é melhor não nos identificarmos assim..."
41100-145 = "M-Mais importante, tem mesmo wagyu de primeira linha aqui...?"
41100-146 = "Um bentô de bife de wagyu... Eu nunca comi algo assim nem na época da SRT..."
41100-148 = "Sim, com certeza foi isso que ele disse. Sem dúvida."
41100-149 = "Pelo rastreamento reverso, ele deve estar bem por aqui! Depressa!"
41100-150 = "[s] \"Nossa, como elas são competentes...\""
41100-152 = "Ah, Sensei..."
41100-153 = "Onde está o bentô de bife de wagyu?!"
41100-154 = "A coleta rápida é o básico de qualquer missão."
41100-155 = "Se a validade já passou, o sabor vai se deteriorando a cada segundo, então precisamos garantir isso agora mesmo..."
41100-156 = "Era o que eu pensava, mas onde está o bentô?"
41100-157 = "[s] \"Bem, sobre isso...\""
41100-159 = "Hahaha! Caíram direitinho no nosso plano!"
41100-160 = "O limite do desejo é como uma miragem que não existe..."
41100-161 = "Aqueles que sucumbem à ganância e se deixam seduzir por essa ilusão acabam inevitavelmente caminhando para a ruína."
41100-162 = "Não entendi nada do que você falou... mas quer dizer que não tem bentô de bife de wagyu?"
41100-163 = "Mas é claro que não. Por que acharam que algo assim estaria no descarte?"
41100-164 = "Que tal aproveitar esta oportunidade para perceberem a maravilha do \"Desapego\"?"
41100-166 = "Vamos, camaradas. Vamos ensinar isso a elas!"
41100-176 = "Uau, quem são esses caras?! Estão com roupas em trapos, mas só com armas de última geração...!"
41100-177 = "F-Fomos cercadas..."
41100-179 = "Primeiro, vamos manter a calma."
41100-180 = "O básico é atraí-los para um espaço estreito e eliminá-los um por um. Assim, mesmo com essa desvantagem numérica..."
41100-181 = "Bem, não faz diferença se só as armas forem boas."
41100-182 = "Não subestimem a gente, somos da SRT!"
41100-183 = "Eu dou um jeito em todos os atiradores no segundo andar..."
41100-184 = "Miyako, eu e a Miyu seguramos a frente, então cuida da retaguarda. Fechado?"
41100-186 = "...Sim, vamos nessa."
41100-187 = "Vou lançar uma granada de luz; ao meu sinal, dispersem-se."
41100-188 = "Então..."
41100-190 = "Iniciar operação!"
