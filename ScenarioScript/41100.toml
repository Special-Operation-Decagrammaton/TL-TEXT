[translation]
41100-1 = "Эпизод 10;Нестяжания и бенто с якинику"
41100-11 = "Вы наконец-то проснулись."
41100-12 = ""
41100-15 = ""
41100-16 = ""
41100-17 = "Прошу прощения за столь скверное гостеприимство моих товарищей."
41100-18 = ""
41100-19 = "Мы не часто принимаем гостей, так что, надеюсь на Ваше понимание."
41100-20 = "[s] «Ты кто такой?»"
41100-21 = "Ах, где же мои манеры. Меня зовут Декарт."
41100-22 = "Я лидер этой организации - Преследователи Счастья в Нестяжании, или, если кратко, просто Преследователи."
41100-23 = "[s1] «Счастья в Нестяжании?»\n[s2] «Преследователи?»"
41100-24 = "Хочешь сказать, что никогда не слышал о нашей организации?"
41100-25 = "Хочешь сказать, что никогда не слышал о нашей организации?"
41100-26 = "Мы широко известны среди тех, кто стремится к минимализму и душевному покою. Чтобы не знать о нас, нужно вести жизнь, непозволительно полную излишеств."
41100-27 = "Впрочем, я и так это знал."
41100-28 = "Я изначально знал, что ты эгоистичный человек, который приказывает своим прихвостням обкрадывать бедняков, лишая их пропитания!"
41100-29 = "[s] «Не уверен, что понимаю, о чём ты…»"
41100-30 = "Не строй из себя идиота! Я своими глазами видел, как ты и эти студентов с кроличьими ушками шушукались и плели свои интриги!"
41100-31 = "[s3] «Ты имеешь в виду студентов SRT?»\n[s4] «Ты говоришь про отряд RABBIT?»"
41100-32 = "Неважно, как они себя называют."
41100-33 = "Неважно, как они себя называют."
41100-34 = "Мы зовём их жадными свиньями. Вы оскверняете наш путь к просветлению."
41100-35 = "[s] «И что же мы осквернили на этот раз?»"
41100-36 = "…Общество клеймит нас множеством имён."
41100-37 = "Пиявки, тунеядцы, бездомные, бесполезные бездельники…"
41100-38 = "Но все эти прозвища - лишь злая насмешка. Называть нас бездельниками!.."
41100-39 = "Мы - благородные мужи, преследующие идеал нестяжания!"
41100-40 = "[s] «Нестяжания?»"
41100-41 = "Соверменные жители Кивотоса желают обладать всем, на что только упадёт их взгляд."
41100-42 = "Новейшие танки, дорогие винтовки, уютные бункеры, способные выдержать ракетный удар…"
41100-43 = "И они покупают всё больше и больше, пытаясь заполнить вещами зияющую пустоту внутри себя. Но чем больше они приобретают, тем сильнее разрастается эта дыра, пока полностью не поглотит всё их естество!"
41100-44 = "Истинное счастье кроется не в том, чтобы иметь, а в том, чтобы НЕ иметь…"
41100-45 = "Человек должен быть готов отречься от привязанности к мирским благам, сбросить оковы общества и довольствоваться лишь тем, что необходимо для выживания! Быть свободным!"
41100-46 = "Мы не паразиты на теле общества. Мы сами выбрали такую жизнь: не работать, ничем не владеть, ничего не копить. Мы освободили себя от материальной алчности и вместо этого питаем свои души праведной нищетой!"
41100-47 = ""
41100-49 = ""
41100-50 = "Но затем, в самый разгар нашего благородного пути, объявились они - вероломные захватчики."
41100-51 = "Эти чужаки носят кроличьи уши, а экипированы по последнему слову техники - самым дорогим снаряжением, какое только можно купить! Их ненасытный аппетит не знал границ: они гребут под себя каждый бенто, до которого только могут дотянуться их алчные ручонки!"
41100-52 = "Они как вирус, пожирающий всё на своём пути. Они не оставляют после себя даже захудалый бенто с ростками маша…"
41100-53 = "А ведь бенто с якинику и так пользуются таким спросом, что их почти никогда не выбрасывают… И монополизировать подобную роскошь…"
41100-54 = "Подобное безрассудство - это просто плевок в лицо всему, за что мы боремся!"
41100-55 = "[s] «Разве вы боретесь не за отказ от материальных привязанностей?»"
41100-56 = "Я-я… Ну… Видишь ли…"
41100-57 = "Не заговаривай мне зубы! В любом случае, мы не можем просто стоять и смотреть сквозь пальцы на то, как этот отряд кроликов, зайчиков или как они там себя кличут, продолжает свои алчные бесчинства."
41100-58 = "И причина, по которой я притащил тебя сюда - это выдвинуть ультиматум."
41100-59 = "Как лидер этих негодяек, ты обязан передать им: отныне все бенто с якинику принадлежат Преследователям!"
41100-60 = "[s5] «Эти девчата не мои подчинённые.»\n[s6] «Они вообще-то просто мои студенты.»"
41100-61 = "Студенты, подчинённые - какая к чёрту разница? Ты их учитель, так что просто заставь их тебя слушаться!"
41100-62 = "Студенты, подчинённые - какая к чёрту разница? Ты их учитель, так что просто заставь их тебя слушаться!"
41100-63 = "И не надо так на меня смотреть. Неужели ты настолько некомпетентен, что не способен совладать со своими же студентами?"
41100-64 = "Эх, я не хотел, чтобы до этого дошло."
41100-65 = ""
41100-67 = ""
41100-68 = "Не двигайся. Сейчас я наберу их с твоего мобильного и лично озвучу свои требования."
41100-69 = "[s] «Я же пытаюсь тебе объяснить, им будет абсолютно всё равно…»"
41100-70 = ""
41100-72 = ""
41100-73 = "Так, и где тут у тебя в контактах отряд RABBIT?"
41100-74 = "Вот они."
41100-75 = ""
41100-77 = ""
41100-80 = ""
41100-81 = "Да, Сенсей? Мы вообще-то заняты приготовлением ужина."
41100-82 = "Я разговариваю с лидером Отряда RABBIT?"
41100-83 = "Мы - Преследователи Счастья в Нестяжании, или, если коротко, просто Преследователи, союз монахов этого города, ищущих истинного счастья. Мы благородные…"
41100-84 = ""
41100-86 = ""
41100-87 = "Они… сбросили?"
41100-88 = "[s] «Возможно, они подумали, что ты телефонный мошенник?»"
41100-89 = "Угх… Вот именно поэтому просветление и ускользает от этих непутёвых студентов…"
41100-90 = ""
41100-92 = ""
41100-95 = ""
41100-96 = "Алло? Не сбрасывайте звонок, это не развод."
41100-97 = "Ваш драгоценный Сенсей у нас в заложниках. Если вы не выполните наши требования, то больше никогда его не увидите."
41100-98 = "А, ну ладно. Передайте Сенсею от меня \"пока\""
41100-99 = ""
41100-101 = ""
41100-102 = ""
41100-103 = "Они снова сбросили?! Опять?"
41100-104 = "Ты точно их Сенсей? Как эти черствейшие создания могут не проявлять к тебе ни малейшего сострадания? Да что с вами всеми такое?"
41100-105 = "[s] «Это довольно долгая история...»"
41100-106 = "Чёрт! Я ведь был уверен, что наш план безупречен! Я уже мысленно купался в элитных бенто до конца своих дней…"
41100-107 = "Но я никак не ожидал, что они окажутся настолько обделены просветлением!"
41100-108 = "[s] «Может, мне попробовать набрать их самому?»"
41100-109 = "Тебе? Лично?"
41100-110 = "Что ж, валяй. Однако учти: любая попытка вызвать полицию закончится очень плачевно."
41100-111 = "Преследователи вооружены до зубов и не боятся пролить кровь ради нашего благородного дела!"
41100-112 = "[s] Самому связаться с Отрядом RABBIT."
41100-113 = ""
41100-115 = ""
41100-120 = ""
41100-121 = "У-у-ух… Опять Вы, Сенсей? Я всю ночь не спала и жутко хочу спать."
41100-122 = "Если Вы наберёте нас ещё хоть раз…"
41100-123 = "[s] «Здесь кто-то оставил бенто с мраморной говядиной вагю высшего качества.»"
41100-124 = ""
41100-126 = ""
41100-127 = ""
41100-129 = "Хах! И ты правда думаешь, что твоим драгоценным студентам будет не плевать на твой голос?"
41100-130 = "Тебя точно так же сбросили! Прямо как меня!"
41100-131 = "Угх. Единственный способ спасти положение - взять и шантажировать твоей персоной каких-нибудь других студентов."
41100-132 = ""
41100-135 = ""
41100-139 = ""
41100-142 = "SRT! Всем рассредоточиться, прикрывайте!"
41100-144 = "Саки, когда мы не на спецзадании, использование официального названия академии противоречит протоколу…"
41100-145 = "Я-я тоже хочу бенто с вагю высшего качества."
41100-146 = "Я н-ни разу в жизни не пробовала вагю, даже когда мы учились в SRT."
41100-148 = "Зуб даю, Сенсей сказал, что мясо где-то здесь."
41100-149 = "Я отследила сигнал его мобильника прямо до этой точки, так что без говядины домой не возвращаемся!"
41100-150 = "[s] «Ого, я не знал, что вы можете передвигаться так быстро.»"
41100-152 = "Ой… Здравствуйте, Сенсей."
41100-153 = "Сенсей, ну и где бенто с вагю высшего качества?!"
41100-154 = "Оперативность - ключевой фактор в сохранении свежести продуктов."
41100-155 = "Как только у выброшенного бенто истекает срок годности, каждая секунда становится критичной."
41100-156 = "Поэтому, как только Мое доложила нам о Вашем звонке, мы свернули все задачи и выдвинулись на точку в максимальном темпе."
41100-157 = "[s] «Эм, ну, дело в том, что…»"
41100-159 = "Бхахахаха! Вы целиком и полностью заглотнули нашу наживку!"
41100-160 = "Вы явились сюда, ведомые своими низменными человеческими желаниями, и они же сбили вас с истинного пути!"
41100-161 = "Таких имбецилов, как вы, вечно идущих на поводу у жадности, эта же жадность и пожирает, пока не приведёт к абсолютному краху!"
41100-162 = "Что этот придурок несёт? Где наш бенто с вагю?"
41100-163 = "Разумеется, никакого вагю здесь нет. Их раскупают в первые же секунды после завоза."
41100-164 = "Но то, что вы обретёте здесь - это бесценный урок о радостях нестяжания!"
41100-166 = "Товарищи, восстаньте! Внушим же наши благородные идеалы этим алчным гоблинам!"
41100-167 = ""
41100-169 = ""
41100-170 = ""
41100-176 = "Это ещё кто такие?! Выглядят как обычные бродяги, но стволы у них современные!"
41100-177 = "М-мы окружены…"
41100-179 = "Не паникуй."
41100-180 = "Заманите их в узкое пространство. Мы зажмём их в бутылочном горлышке и перещёлкаем по одному."
41100-181 = "Думали, мы испугаемся ваших пушек? Мелюзга остаётся мелюзгой, сколько оружия ей ни дай."
41100-182 = "Используйте всё, что у вас есть. Вам ни за что не сравниться с элитой SRT!"
41100-183 = "Я-я, н-наверное, смогу снять снайперов на втором этаже."
41100-184 = "Отлично, я прикрою тебя и разберусь с теми, кто будет спереди. Мияко, ты прикроешь наш тыл?"
41100-185 = ""
41100-186 = "Как и всегда. Берегите себя."
41100-187 = "Ждите моего знака перед броском светошумовой гранаты. Это будет сигналом, чтобы занять позиции."
41100-188 = "Ну что ж..."
41100-190 = "Отряд RABBIT, вперёд!"
