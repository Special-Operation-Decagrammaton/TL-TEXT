[translation]
1012503-1 = "Шляпа ведьмы"
1012503-3 = ""
1012503-4 = "Ух... Мастер! Хорошо, что ты здесь."
1012503-5 = "Я не знаю, что делать."
1012503-6 = "Сегодня днём у меня практический экзамен... и принимать его будет УЖАСНО придирчивый экзаменатор..."
1012503-7 = "...а мне сказали, что нельзя брать с собой ничего связанного с магией, даже мою ведьминскую шляпу!"
1012503-8 = "«Не надевай шляпу»?! Да они бы ещё велели мне ходить голой!"
1012503-9 = ""
1012503-11 = ""
1012503-12 = "Ух, что же делать?"
1012503-13 = "Я НЕ ХОЧУ ходить голой, Мастер!"
1012503-14 = ""
1012503-16 = ""
1012503-17 = ""
1012503-18 = ""
1012503-19 = "[ns1] «...Д-Давай поговорим об этом где-нибудь в другом месте!»\n[ns2] «Здесь слишком много людей смотрят.»"
1012503-22 = ""
1012503-25 = "Я нашёл тихое место и выслушал Эри."
1012503-27 = ""
1012503-28 = "[ns3] «Значит, в экзаменационную комнату можно взять только художественные принадлежности.»\n[ns4] «Вообще-то звучит вполне разумно.»"
1012503-31 = "Погоди, то есть ТЫ хочешь, чтобы я пошла без шляпы?"
1012503-32 = "Т-Ты хочешь, чтобы мне было ужасно неловко?"
1012503-33 = "[s] «Вовсе нет!»"
1012503-34 = "Единственный способ всё исправить — добиться другого экзаменатора."
1012503-35 = "...Хм, я МОГЛА БЫ проклясть нынешнего экзаменатора, чтобы у него весь день болел живот..."
1012503-36 = "[s] «Т-Ты умеешь такое?»"
1012503-37 = "Для магии нет ничего невозможного. Если незаметно подмешать таблетки ему в еду..."
1012503-38 = "[s] «Это не магия! Это преступление!»"
1012503-39 = "У-Ух...!"
1012503-40 = "Ты прав, ты прав. Так делать нельзя."
1012503-41 = "...Значит, сменить экзаменатора никак не получится."
1012503-42 = "Придётся идти в экзаменационную комнату совершенно безоружной."
1012503-43 = "Тогда у меня закончится мана, и они ещё неизвестно что со мной сделают...!"
1012503-44 = "[s5] «Эй, не паникуй.»\n[s6] «А что, если потренироваться рисовать без шляпы?»"
1012503-47 = "Прямо сейчас?"
1012503-48 = "...Ну, «если не сейчас, то когда», верно?"
1012503-49 = "*выдыхает*"
1012503-50 = "Хорошо. Я сниму её прямо здесь и сейчас. Будто раздеваюсь догола, но я это сделаю."
1012503-51 = ""
1012503-53 = ""
1012503-54 = "...Отвернись на минутку, пожалуйста."
1012503-56 = "Я закрыл глаза и отвернул голову, как она просила."
1012503-57 = ""
1012503-60 = "*выдыхает*"
1012503-61 = "Честно говоря, я бы лучше оставила на себе ТОЛЬКО шляпу..."
1012503-62 = "[s] «Нет-нет, пожалуйста, всё остальное оставь на себе!»"
1012503-63 = "З-Знаю! Это была шутка, просто шутка!"
1012503-64 = "Так или иначе... думаю, теперь можешь открыть глаза."
1012503-65 = ""
1012503-66 = "К-Как я выгляжу? Наверное, нелепо?"
1012503-67 = "[s7] «Вовсе нет.»\n[s8] «Ты выглядишь совершенно естественно. Не переживай.»"
1012503-70 = "П-Понятно. Э-хе-хе-хе..."
1012503-71 = "Спасибо, Мастер. Мне и правда стало спокойнее."
1012503-72 = ""
1012503-76 = ""
1012503-78 = ""
1012503-79 = "О, привет, Эри."
1012503-80 = "Привет, Эри! Сегодня без шляпы? Давненько такого не было."
1012503-81 = "Т-Ты! Эм..."
1012503-82 = "П-П-Привет! Ч-Что т-тебя сюда привело?!"
1012503-83 = "Мы готовимся к экзамену."
1012503-84 = "А ты? Тоже?"
1012503-85 = "Ну, давайте все сдадим на отлично. Я за тебя болею!"
1012503-86 = "С-С-Спасибо! Я-Я-Я постараюсь изо всех сил...!!"
1012503-87 = ""
1012503-89 = ""
1012503-90 = ""
1012503-91 = "А-Ах...! Всё кончено! Кто-то с моего факультета увидел меня голой...!"
1012503-92 = "[s] «Ты не голая! Возьми себя в руки!»"
1012503-93 = "...Т-Точно!#nД-Другие люди ведь снимают шляпы, да?#n...Обычно."
1012503-94 = ""
1012503-96 = ""
1012503-97 = ""
1012503-98 = "...Ух, честно, я так не могу."
1012503-99 = "Так или иначе, я ОБЯЗАНА попасть в эту комнату В ШЛЯПЕ."
1012503-100 = "...Может, сделать ведьминскую шляпу, которую другие люди не смогут видеть."
1012503-101 = "Тогда я надену ЕЁ, зайду внутрь и..."
1012503-102 = "...нет, это всё равно будет то же самое, что снять шляпу!"
1012503-103 = ""
1012503-105 = ""
1012503-106 = "Что это вообще, «Новое платье короля»?!"
1012503-107 = "Ох, какой ужас! Ты уверен, что мне не стоит наложить то проклятие с больным животом?"
1012503-108 = "[s9] «Д-Давай успокоимся и потренируемся рисовать!»\n[s10] «Уверен, если продолжишь практиковаться, сможешь рисовать без проблем!»"
1012503-111 = "Ух, ты правда думаешь, что я справлюсь?"
1012503-112 = "[s] «Да. И я продолжу снабжать тебя маной.»"
1012503-113 = "Как скажешь..."
1012503-114 = "...Хорошо, Мастер. Может, мне стоит просто взглянуть на это иначе."
1012503-115 = "...А. Я могу пойти без шляпы и представить, что я обнажённая модель."
1012503-116 = "Нагота — часть искусства. Тогда я совсем не буду выглядеть неуместно."
1012503-117 = "[s] «М-Может, не совсем так, но не падай духом!»"
1012503-119 = "(После этого я продолжил позировать для тренировочных картин Эри.)"
