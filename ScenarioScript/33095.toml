[translation]
33095-2 = "*тяжело дышит* *тяжело дышит*..."
33095-3 = "Угх..."
33095-4 = ""
33095-7 = "[s] «Хина!»"
33095-12 = "Глава Дисциплинарного комитета Геенны... пала."
33095-13 = "Наконец-то... Удивительно, что с такими ранами она вообще дошла так далеко."
33095-14 = "..."
33095-15 = "Со всеми ключевыми фигурами Тринити и Геенны покончено. Остался только ты, Сенсей Шале."
33095-16 = "[s] «А вы, должно быть, отряд Ариуса.»"
33095-17 = "..."
33095-18 = "Хм-м."
33095-19 = "Хи-хи..."
33095-20 = "..."
33095-21 = ""
33095-23 = ""
33095-24 = "Верно — мы отряд. Наконец-то приятно познакомиться, и спасибо, что так хорошо заботились об Азусе."
33095-25 = "[s] «...!»"
33095-26 = "Похоже, у неё всё хорошо. Скоро у нас будет достаточно времени, чтобы наверстать упущенное."
33095-27 = "Мы подписали договор от имени Тринити в Соборе объединения."
33095-28 = "..."
33095-29 = "[s] «Зачем вам это?»"
33095-30 = "Потому что во имя рая мы, отряд Ариуса, стали Организацией Эдемского договора — новой вооружённой силой, которая будет охранять святость договора."
33095-31 = "[s] «...!»"
33095-32 = "Это всегда должно было быть нашей обязанностью. Именно это право нам должны были дать на Первом совете."
33095-33 = "Но Тринити предпочла растоптать эту обязанность. Нас преследовали и обвиняли во всех конфликтах той эпохи — подавляли и делали козлами отпущения."
33095-34 = "Однако теперь, обладая полномочиями ОЭД, мы получили право определять, кого будут подавлять."
33095-35 = "И Геенна, и Тринити представляют угрозу договору. Это цели, которые необходимо устранить."
33095-36 = "[s] «Вы же не всерьёз...»"
33095-37 = "Тринити и Геенна будут стёрты с лица Кивотоса."
33095-38 = ""
33095-43 = ""
33095-44 = "Их конец наступит от рук хранителей заповедей, которые сейчас стоят перед тобой."
33095-45 = "И все станут свидетелями ненависти, которую мы хранили столетиями после Первого совета."
33095-46 = "Но прежде нужно разобраться ещё с одной последней деталью."
33095-47 = ""
33095-50 = "[ns] «(Вот каково это, когда на тебя направляют оружие...)»"
33095-51 = "Она сказала, что ты станешь самым большим препятствием нашему плану."
33095-54 = "А-а-а-а-а-а!"
33095-55 = ""
33095-57 = ""
33095-60 = "Сорасаки Хина! Как ты всё ещё можешь двигаться?!"
33095-61 = "Сэна! Сюда!"
33095-62 = ""
33095-65 = "С-Скорая?!"
33095-66 = ""
33095-74 = "Сюда, Сенсей! Дайте руку!"
33095-75 = ""
33095-78 = "Не думайте, что всё будет так просто!"
33095-79 = ""
33095-82 = "К-Как у неё всё ещё столько сил?"
33095-83 = ""
33095-89 = "Мы их упустили."
33095-90 = "Ничего. Хина изо всех сил прикрывала Сенсея, но я подтверждаю: в Сенсея попали."
33095-91 = "Он не житель Кивотоса. Без нимба лишь вопрос времени, когда смерть заберёт Сенсея."
33095-92 = "И всё же... Зачем она зашла так далеко ради его защиты? Он действительно настолько важен?"
33095-93 = "..."
33095-94 = "Химэ что-то показывает... Без Сенсея всё прошло бы по плану? И Азуса нас бы не предала?"
33095-95 = "..."
33095-98 = "[ns] «(Живот... Как же горячо.)»"
33095-99 = "Слушайте внимательно, Сенсей. В вас попала пуля."
33095-100 = "Считайте, что повезло: жизненно важные органы не задеты. Но без лечения вы истечёте кровью."
33095-101 = "Я начну оказывать первую помощь. Не бойтесь кричать, если будет больно."
33095-102 = "Я не дам вам умереть. Именно для этого обучен Медицинский аварийный клуб."
33095-103 = ""
33095-106 = "[ns] «(Я сейчас отключусь...)»"
33095-108 = "..."
33095-109 = "Хм. Как мило, что ты всё-таки решила присоединиться."
33095-110 = "Не ожидала, что ты действительно покажешься. Могла ведь просто сбежать."
33095-111 = "Х-Хи-хи. Похоже, давно не виделись..."
33095-112 = ""
33095-114 = ""
33095-116 = ""
33095-117 = "*тяжело дышит*... *тяжело дышит*..."
33095-118 = "Как ты, Азуса?"
33095-119 = "Почему? Как ты посмела...?"
33095-120 = "Ты и сама знаешь ответ. Для тебя больше нет места — ни в Тринити, ни в Шале."
33095-121 = "В мире нет места, которое примет таких убийц, как мы."
33095-122 = "Как ты ПОСМЕЛА причинить вред Сенсею?!"
33095-123 = "Даже если такое место существовало, оно было бы мимолётным и исчезло бы в мгновение ока... как теперь исчез твой Сенсей."
33095-124 = "Всё тщетно, так зачем сопротивляться, Ширасу Азуса?"
33095-125 = "САОРИ-И-И!!!"
33095-126 = ""
33095-132 = "Даже сейчас ты дремлешь в сладком сне. Значит, мне остаётся только разбудить тебя."
33095-133 = "Я буду снова и снова вырывать тебя из этих снов — столько раз, сколько потребуется."
33095-134 = "А теперь иди."
33095-138 = "[ns] «Разве это не...?»"
33095-139 = "Приятно познакомиться, Сенсей."
33095-140 = "Я Юризоно Сэя."
33095-141 = "Мы в вашем сне... а может, это мой сон."
33095-142 = "[s] «Сэя...»"
33095-143 = "А. Значит, возможно, это не первая наша встреча."
33095-144 = "Такое возможно. Для меня течение времени стало довольно запутанным."
33095-145 = "Как бы то ни было, я рада возможности поговорить с вами."
33095-146 = ""
33095-148 = ""
33095-149 = ""
33095-150 = "Итак, начнём распутывать эту историю?"
33095-152 = "Следующий эпизод;Сладкая ложь"
