[translation]
33095-2 = "Haa, haa... haa..."
33095-3 = "Guh..."
33095-7 = "[ns] \"Hina!!\""
33095-12 = "A Chefe do Comitê Disciplinar de Gehenna finalmente caiu."
33095-13 = "F-Finalmente...? Isso deve ter doído tanto, como ela aguentou até aqui com esses ferimentos...?"
33095-14 = "..."
33095-15 = "Todas as figuras principais de Trinity e Gehenna já foram eliminadas. Agora só resta você, Sensei da Schale."
33095-16 = "[s] \"...Vocês são o Esquadrão Arius?\""
33095-17 = "..."
33095-18 = "Huu..."
33095-19 = "Ehehe..."
33095-20 = "..."
33095-24 = "...Sim, isso mesmo. Nós somos o \"Esquadrão Arius\". Finalmente nos encontramos, Sensei."
33095-25 = "[s] \"...!\""
33095-26 = "Ouvi dizer que você cuidou da Azusa. Estamos indo encontrá-la agora mesmo."
33095-27 = "...Em vez de Trinity, fomos nós que assinamos o tratado nesta \"Antiga Catedral da Comunhão\"."
33095-28 = "..."
33095-29 = "[s] \"...O que você quer dizer com isso?\""
33095-30 = "Significa que nós, o \"Esquadrão Arius\", nos tornamos a nova força armada que protege o tratado em nome do paraíso... a \"Organização do Tratado do Éden (ETO)\"."
33095-31 = "[s] \"!?\""
33095-32 = "Originalmente, esse era o nosso dever. Um direito legítimo que deveríamos ter exercido já na época do Primeiro Concílio."
33095-33 = "Mas Trinity pisoteou tudo isso. Eles nos definiram como a causa do conflito, ou seja, como \"alvos de supressão\", e nos oprimiram implacavelmente."
33095-34 = "...De agora em diante, o \"Esquadrão Arius\" exercerá a autoridade da Organização do Tratado do Éden e redefinirá quem são os \"alvos de supressão\"."
33095-35 = "Gehenna e Trinity. Essas duas escolas são os verdadeiros elementos de conflito que violam o Tratado do Éden, e os alvos de supressão que devem ser eliminados."
33095-36 = "[s] \"Isso quer dizer que...\""
33095-37 = "Vamos apagar Trinity e Gehenna de Kivotos. Literalmente."
33095-44 = "...Junto com os preceitos deste tratado e seus guardiões."
33095-45 = "Vocês vão testemunhar o rancor acumulado ao longo de centenas de anos desde o Primeiro Concílio... todo o nosso ódio."
33095-46 = "...Mas, antes disso, vamos dar um jeito em você."
33095-50 = "[ns] \"(O cano da arma...)\""
33095-51 = "Sensei da Schale... Ela disse que você provavelmente seria o maior obstáculo para o nosso plano."
33095-54 = "Aaaaaaaaahhh!!!"
33095-60 = "...! Ainda consegue se mexer, Sorasaki Hina?!"
33095-61 = "Sena! Por aqui!!"
33095-65 = "Uma ambulância...!?"
33095-74 = "Sensei! Dê-me a mão!"
33095-78 = "Não vou deixar fugir!!"
33095-82 = "E-Ela ainda tinha toda essa força..."
33095-89 = "...Eles escaparam."
33095-90 = "Tanto faz. Sorasaki Hina interferiu, mas a bala acertou em cheio."
33095-91 = "Essa pessoa vem de fora de Kivotos. O halo vai se quebrar... não, vai morrer."
33095-92 = "Ainda assim, aquela reação... Aquele Sensei é alguém tão importante assim?"
33095-93 = "..."
33095-94 = "\"Se aquela pessoa não estivesse lá, tudo teria saído conforme o plano\"...? É-É mesmo, Princesa? Hã? \"E a Azusa com certeza também...\"?"
33095-95 = "..."
33095-98 = "[ns] \"(Meu abdômen está queimando...)\""
33095-99 = "Ouça com atenção, Sensei. Você levou um tiro."
33095-100 = "Por um milagre, os pontos vitais não foram atingidos, mas não podemos ignorar essa hemorragia."
33095-101 = "Vou iniciar os primeiros socorros agora. Se doer, pode gritar."
33095-102 = "Não vou deixar você morrer. Afinal, sou do Departamento de Medicina de Emergência."
33095-106 = "[ns] \"(Minha consciência está ficando turva...)\""
33095-108 = "..."
33095-109 = "...Então é aqui que você resolve aparecer."
33095-110 = "Não achei que fosse dar as caras... Podia muito bem ter fugido de uma vez."
33095-111 = "Ehehe, quanto tempo, né...?"
33095-117 = "Haa, haa, haa..."
33095-118 = "...E então, Azusa?"
33095-119 = "Por que, por quê...?"
33095-120 = "Foi exatamente como eu disse, não foi? Não há lugar para você nem em Trinity, nem na Schale."
33095-121 = "Não existe nenhum lugar neste mundo que aceite \"assassinas\" como nós."
33095-122 = "Por que fizeram isso com o Sensei...?!"
33095-123 = "Mesmo que pareça existir um lugar assim, tudo se desfaz de forma efêmera... exatamente como aquele tal de \"Sensei\" agora há pouco."
33095-124 = "...Tudo é em vão. Então por que continua se debatendo, Shirasu Azusa?"
33095-125 = "Saoriiiiiiiii!!!!"
33095-132 = "Ainda está embriagada por esse doce sonho...? Não tem jeito, eu vou te ajudar."
33095-133 = "Vou fazer você acordar desse sonho quantas vezes for preciso."
33095-134 = "Venha."
33095-138 = "[ns] \"Onde estou...?\""
33095-139 = "...É um prazer conhecê-lo, eu acho, Sensei."
33095-140 = "Meu nome é Yurizono Seia."
33095-141 = "E este lugar é dentro do seu sonho... ou, quem sabe, dentro do meu próprio sonho."
33095-142 = "[s] \"Seia...\""
33095-143 = "Oh, será que esta não é a nossa \"primeira vez\" nos encontrando?"
33095-144 = "Peço perdão pela indelicadeza. Para mim, neste momento, o fluxo do tempo está um tanto retorcido."
33095-145 = "Contudo, Sensei, o que importa não é isso, mas sim o fato de você e eu estarmos nos encontrando desta forma."
33095-150 = "Pois bem... vamos começar a desvendar esta história."
33095-152 = "Próximo;Mentiras Doces"
