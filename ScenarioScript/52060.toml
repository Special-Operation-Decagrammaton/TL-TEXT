[translation]
52060-1 = "Episódio 6;O Festival e os Preparativos"
52060-6 = "Nyaha~ Sejam bem-vindas, pessoal da Hyakkaryouran."
52060-7 = "Muito obrigada por se reunirem aqui,#napesar do chamado repentino."
52060-8 = "Oizinho~"
52060-13 = "É natural que a Hyakkaryouran colabore na manutenção da ordem em Hyakkiyako."
52060-14 = "Além disso, temos uma dívida com o Clube Yin-Yang."
52060-15 = "Só que..."
52060-19 = "...Por que o Sensei está aqui?"
52060-20 = "[s1] \"Quanto tempo, pessoal.\"\n[s2] \"Estão todas bem?\""
52060-26 = "M-Mestre?!"
52060-27 = "Ora, Sensei! Que alegria ver o seu rosto!"
52060-28 = "...Bom dia, Sensei."
52060-30 = "Desta vez, gostaríamos de contar também com a ajuda do Sensei [USERNAME]...#nPor isso, pedimos que viesse de tão longe. Nyaha."
52060-31 = "[s3] \"Nem é tão longe assim. Além disso...\"\n[s4] \"Se for um pedido de alunas importantes, eu vou correndo para qualquer lugar.\""
52060-35 = "Aiai...#nEu já imaginava desde o momento em que o Clube Yin-Yang nos chamou de repente."
52060-36 = "Se chamaram a Hyakkaryouran e a Schale ao mesmo tempo...#nÉ um caso tão complicado assim?"
52060-38 = "Imagina~♪#nJamais faríamos um pedido tão pesado para convidadas tão importantes, viu?"
52060-39 = "Afinal, quase todas as encrencas que acontecem em Hyakkiyako somos nós que resolvemos.#n...Não é mesmo, Kaho?"
52060-40 = "...Sim. Os membros do Clube Yin-Yang, \"com exceção da Niya-sama\", trabalham duro dia e noite."
52060-41 = "Que frieza, poxa~"
52060-46 = "Bom, o jeito de trabalhar da presidente Niya é bem famoso, né."
52060-48 = "Eu também já ouvi falar disso.#nDizem que quando você faz um pedido para a presidente Niya,#npor algum motivo acaba tendo que resolver tudo sozinho..."
52060-49 = "Entendo!#nUma líder verdadeiramente sábia#nnos guia com sutileza para que resolvamos os problemas por conta própria!"
52060-51 = "Ora, ora? Parece que o clima está ficando estranho..."
52060-52 = "D-De qualquer forma... Como o Sensei já deve saber,#na Academia Aliada Hyakkiyako é conhecida pelo turismo e pelos festivais.#nPor isso mesmo, durante os festivais acontecem muitos incidentes e acidentes..."
52060-53 = "Sendo assim,#npensamos em pedir a ajuda do Sensei e do pessoal da Hyakkaryouran,#ne por isso convidamos todos aqui."
52060-54 = "[s] \"Preparativos para um novo festival?\""
52060-55 = "Sim. Em Hyakkiyako, realizamos festivais em todas as estações do ano."
52060-56 = "O \"Festival das Flores de Cerejeira da Primavera de Hyakuyo\" para aproveitar a primavera ensolarada,#no \"Festival Aquático de Hyakuyo\" para espantar o calor abafado—"
52060-57 = "O \"Festival da Árvore Sagrada\" para pedir por uma boa colheita no outono,#ne o \"Festival das Flores de Neve do Inverno de Hyakuyo\", onde as esculturas de neve fazem esquecer o frio...#nClaro, entre os festivais das quatro estações, também há diversos eventos grandes e pequenos."
52060-58 = "E o que será realizado desta vez é...!"
52060-64 = "O Festival Waraku~!"
52060-66 = "Eba~"
52060-72 = "D-Desculpem por isso...!"
52060-73 = "Nyahaha, tudo bem, tudo bem♪"
52060-74 = "Então, Kaho, pode explicar para o Sensei?"
52060-75 = "O Festival Waraku é, literalmente, um festival repleto dos encantos da Chise-chan,#nfeito para espalhar o charme de Waraku Chise-chan."
52060-76 = "Exposição dos haikus e pertences favoritos da Chise-chan, e...#nvenda de stands acrílicos limitados com ilustrações da Chise-chan!"
52060-77 = "E a atração principal que mais recomendamos é—"
52060-78 = "O show especial ao vivo da Chise-chan!"
52060-79 = "Normalmente, a Chise-chan não costuma cantar muito, mas...#na voz dela tem um encanto maravilhoso que aquece o coração de quem ouve."
52060-80 = "Não podemos perder nem um único segundo dessa imagem da Chise-chan!#nPor isso, providenciei três câmeras com lentes super teleobjetivas de 800mm—"
52060-82 = "K-Kaho... já chega por aí..."
52060-83 = "Calma aí~"
52060-88 = "D-De novo... Peço mil desculpas."
52060-89 = "[s5] \"D-De qualquer forma...\"\n[s6] \"Vocês estão se dedicando muito a este festival, né.\""
52060-92 = "C-Com certeza!"
52060-93 = "Eu também estou me esforçando~"
52060-94 = "[s] \"Muito bem~!\""
52060-95 = "Eu sei que vocês estão ainda mais empolgadas com o Festival Waraku desta vez."
52060-96 = "Por isso, estamos colaborando ativamente na patrulha do local e na contenção de delinquentes, mas..."
52060-97 = "Claro, somos muito gratas pela colaboração de sempre de todas vocês."
52060-98 = "Só que surgiu um pequeno problema fora do local do festival."
52060-100 = "Um problema...?"
52060-102 = "Pessoal, o que é mais importante em um festival?"
52060-103 = "Um local capaz de acomodar muita gente...?"
52060-105 = "Decorações luxuosas também são indispensáveis!"
52060-106 = "Acho que a variedade de barraquinhas. Falou em festival, falou em sair comendo por aí, né?"
52060-107 = "É verdade, tem que ter yakitori."
52060-108 = "Sim, yakitori também, mas... no fim das contas, o mais importante#nsão as comidas típicas de festival!"
52060-109 = "Afinal, precisamos que os turistas gastem bastante dinheiro..."
52060-113 = "...Sobre essas comidas de barraquinha, vocês sabem de onde vêm os ingredientes?"
52060-114 = "[s] \"Não é de fora de Hyakkiyako?\""
52060-115 = "Para conseguir grandes quantidades de ingredientes frescos,#ntrazer de muito longe fica meio~ complicado, sabe."
52060-116 = "Quase tudo é fornecido pela#n\"Filial Ebisu\", no Distrito Autônomo do Norte."
52060-117 = "[s] \"Filial Ebisu...?\""
52060-118 = "Sim.#nHoje o nome é Academia \"Aliada\" Hyakkiyako,#nmas na antiga era de guerras existiam diversas filiais."
52060-119 = "Como resquício daquela época, algumas escolas em regiões isoladas#ncontinuam existindo como filiais até hoje."
52060-120 = "A \"Filial Ebisu\", no Distrito Autônomo do Norte, é uma delas."
52060-121 = "Elas possuem vastas terras agrícolas#ne nos fornecem os produtos colhidos lá."
52060-125 = "Hã? O Distrito Autônomo do Norte não é um lugar onde neva até no verão?#nCresce alguma plantação lá?"
52060-126 = "Hihi. Quanto mais frio, mais doces ficam as raízes, sabia?#nAlém disso, nem todo o Distrito Autônomo do Norte tem um clima como o da Grande Planície Nevada."
52060-128 = "Peixes, frutas e laticínios como queijos também são muito famosos por lá."
52060-129 = "O caranguejo-peludo também é delicioso~"
52060-130 = "[s7] \"Parece um lugar com uma natureza bem rica...\"\n[s8] \"Se tiver oportunidade, adoraria visitar.\""
52060-133 = "...Pois bem, recebemos um pedido de socorro dessa mesma Filial Ebisu."
52060-140 = "Em dias nublados ou quando o sol começa a se pôr...#ndizem que \"aparições\" têm surgido por lá."
52060-141 = "...O que é isso?"
52060-142 = "É um nome vago, mas..."
52060-143 = "Parece que \"aquilo\" que ataca as pessoas tem sempre uma aparência diferente,#nentão não há outra forma de descrever."
52060-144 = "Às vezes uma criatura grotesca, às vezes uma fera selvagem,#ne até mesmo a forma de alguém conhecido pela testemunha..."
52060-148 = "Porém, existem alguns pontos em comum."
52060-149 = "Primeiro: assume a forma daquilo que o alvo mais teme."
52060-150 = "Segundo: armas de fogo comuns não conseguem sequer arranhá-lo."
52060-159 = "...\"Hyakumonogatari Fantasmagórico\"."
52060-160 = "Sim, penso exatamente o mesmo."
52060-161 = "Algo como espíritos malignos que se alimentam do medo e perturbam a mente de quem os vê."
52060-162 = "Como Clube Yin-Yang—#nsuspeitamos que haja uma ligação com o Hyakumonogatari que apareceu no Festival das Lanternas."
52060-167 = "E se for mesmo uma aparição nascida de uma história de terror assim—#nos únicos capazes de derrotá-la são a \"Presidente da Hyakkaryouran\"#ne a prova de seu título, a \"Hyakuren\"."
52060-168 = "..."
52060-170 = "Ainda não há muitas testemunhas das aparições.#nMas se a existência delas se espalhar, isso pode prejudicar o festival."
52060-171 = "Por isso, gostaríamos de pedir a vocês, que podem exterminar o Hyakumonogatari, que resolvam o problema."
52060-173 = "Claro que nós somos as mais indicadas para isso, mas..."
52060-174 = "Para ser exata, quem consegue empunhar a Hyakuren é apenas a Presidente Interina, Nagusa-senpai."
52060-180 = "...É só irmos ao \"Distrito Autônomo do Norte\", né?"
52060-181 = "Acho que não vou conseguir fazer tão bem quanto a Ayame... mas vou tentar."
52060-182 = "...Vamos lá?"
52060-183 = "Beleza! Vamos acabar logo com esses monstros e dar um jeito de curar o braço da Nagusa-senpai também!"
52060-184 = "E também vamos resgatar a Presidente Ayame, com certeza!"
52060-186 = "...Hihi. Pelo visto, nossos interesses coincidiram."
52060-187 = "Se um único pedido resolve o problema de vocês também, matamos dois coelhos com uma cajadada só..."
52060-188 = "Não... incluindo o Sensei, seriam três coelhos com uma cajadada só."
52060-189 = "[s] \"Qual foi o motivo de me chamarem...?\""
52060-190 = "Pensei que o Sensei pudesse ter algo em mente que o incomoda~"
52060-191 = "Você sabe sobre aquele assunto da Kuzunoha, não sabe?"
52060-192 = "[s9] \"Sim, claro.\"\n[s10] \"...Mas acho que agora já está tudo bem.\""
52060-197 = "Nyaha...?!"
52060-198 = "Isso é... surpreendente.#nEu achava que você ainda estava correndo atrás de um jeito#nde restaurar quem foi tocado pelo Chroma..."
52060-199 = "Ter resolvido isso no pouco tempo em que não nos vimos!#n...Nossa, o Sensei [USERNAME] sempre consegue me surpreender."
52060-203 = "Só para constar, segundo uma passagem de registros antigos,#na Grande Profetisa Kuzunoha estaria no \"Templo do Crepúsculo\"."
52060-204 = "Claro, há pouquíssimos relatos de pessoas que realmente viram o \"Templo do Crepúsculo\".#nSua localização exata é desconhecida."
52060-205 = "Porém... ouvi dizer que, no centro da Grande Planície Nevada, existe um caminho que leva ao templo."
52060-206 = "Procurar um templo isolado em meio a uma planície nevada sem fim#né imprudente demais.#nPara ser sincera, eu tinha minhas dúvidas, mas—"
52060-207 = "A carta de Kuzunoha que a Vice-Presidente Nagusa trouxe da Grande Planície Nevada—#nela realmente existe..."
52060-208 = "[s] \"Então, se formos direto para a Grande Planície Nevada—\""
52060-209 = "...Sensei. Por mais que se prepare, a Grande Planície Nevada é um lugar perigoso.#nPara um corpo que não aguenta nem uma única bala, seria difícil demais."
52060-210 = "[s] \"T-Tudo isso...?\""
52060-211 = "Hihi. Mas... nos arredores da Filial Ebisu há um distrito comercial movimentado."
52060-212 = "Se você se dedicar a ajudar as pessoas lá junto com a Hyakkaryouran—"
52060-218 = "quem sabe a lendária Grande Profetisa não dá as caras de repente...?"
52060-219 = "[s11] \"Obrigado, Niya.\"\n[s12] \"Isso ajuda muito.\""
52060-222 = "Eu é que agradeço por cuidarem dessa encren...#nDigo, digo, não tenho palavras para agradecer pela ajuda na resolução do problema."
52060-223 = "Niya-sama..."
52060-224 = "Eu posso ir junto também~?"
52060-225 = "Isso... não pode.#nChise-chan, vamos continuar os preparativos para o Festival Waraku aqui."
52060-226 = "Queria tanto ver... uma paisagem de neve."
52060-230 = "Uuuugh...! A Chise-chan toda tristinha!#nMeu coração vai se partir..."
52060-231 = "M-Mas!#nPelo sucesso do Festival Waraku, não posso abrir mão da Chise-chan agora...!"
52060-232 = "[s] \"Vamos juntos em uma próxima vez, tá?\""
52060-233 = "Sim, vou ficar esperando, Sensei."
52060-235 = "Já avisamos a Filial Ebisu sobre isso.#nNão que seja para substituir a Chise-nyan, mas#nalguém deve vir buscar vocês."
52060-236 = "Como você estará com o pessoal da Hyakkaryouran, acho que vai ficar tudo bem, mas...#naquele lugar está fora do nosso alcance."
52060-237 = "Sensei, por favor, tome muito cuidado."
52060-239 = "Próximo;Terra da Neve"
