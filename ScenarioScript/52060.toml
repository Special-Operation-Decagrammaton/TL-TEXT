[translation]
52060-1 = "Эпизод 6;Подготовка к фестивалю"
52060-5 = ""
52060-6 = "Нья-ха... Здравствуйте, Хяккарёран. Все прекрасно выглядите."
52060-7 = "Знаю, всё произошло внезапно, так что спасибо, что пришли."
52060-8 = "Добро пожаловать."
52060-9 = ""
52060-11 = ""
52060-13 = "Оставь благодарности. Если дело связано с безопасностью Хяккияко, наш долг явиться по первому зову."
52060-14 = "Кроме того, мы не забыли, что клуб Инь-Ян сделал для нас."
52060-15 = "Но у меня есть один вопрос—"
52060-16 = ""
52060-18 = ""
52060-19 = "...Что здесь делает Сенсей Шале?"
52060-20 = "[s1] «Давно не виделись!»\n[s2] «Надеюсь, у вас всё хорошо?»"
52060-21 = ""
52060-22 = ""
52060-25 = ""
52060-26 = "Сенсей?!"
52060-27 = "Сенсей! Как чудесно снова встретиться!"
52060-28 = "...Доброе утро, Сенсей."
52060-30 = "Да! И отличная работа, Сенсей [USERNAME], что добрались сюда и не заблудились! Нья-ха."
52060-31 = "[s3] «Тут недалеко.»\n[s4] «Ради студентов в беде — что угодно!»"
52060-35 = "Мне было интересно, почему клуб Инь-Ян так внезапно нас вызвал..."
52060-36 = "Но просьба, требующая одновременно Хяккарёран и Сенсея Шале... Должно быть, дело серьёзное."
52060-38 = "Совсем нет. Что, думаете, я бы вызвала Сенсея из такой дали только ради тяжёлой работы?"
52060-39 = "Клуб Инь-Ян никогда не избегал самых сложных и неприятных проблем Хяккияко. Верно, Кахо?"
52060-40 = "...Да. Это правда обо всём клубе Инь-Ян... кроме Нии."
52060-41 = "Ой, больно. Какая злая..."
52060-42 = ""
52060-45 = ""
52060-46 = "Лень президента Нии достигла легендарного уровня."
52060-48 = "Я тоже слышала. Говорят, если попросить президента Нию что-нибудь сделать, она будет надоедать, пока ты сама не решишь проблему."
52060-49 = "Ого, вдохновляет людей на самостоятельность... Какая мудрая глава!"
52060-51 = "А? Когда это превратилось в допрос?"
52060-52 = "В-В любом случае! Уверена, Сенсей знает: Объединённая академия Хяккияко славится своими фестивалями. И... большинство серьёзных инцидентов происходит именно во время них."
52060-53 = "Поэтому мы пригласили вас всех, чтобы смиренно попросить помочь с грядущим фестивалем!"
52060-54 = "[s] «У вас ЕЩЁ ОДИН фестиваль?»"
52060-55 = "Да. В Хяккияко есть фестиваль на каждый сезон, как минимум каждый год, и так будет вечно."
52060-56 = "Фестиваль цветения сакуры празднует весну. Водный фестиваль встречает тёплое лето. Ритуал Древа божеств желает богатого осеннего урожая. А Фестиваль снежинок... ну, тут объяснять не надо?"
52060-57 = "В какой бы день года вы ни приехали, если вы в Хяккияко — вы ОБЯЗАТЕЛЬНО будете наслаждаться фестивалем."
52060-58 = "А этот новый фестиваль, самый особенный из всех, называется..."
52060-59 = ""
52060-63 = ""
52060-64 = "Фестиваль Вараку!"
52060-66 = "Да!"
52060-67 = ""
52060-70 = ""
52060-71 = ""
52060-72 = "П-Простите, что перебиваю... Я просто так взволнована!"
52060-73 = "Нья-ха-ха... Всё нормально, Кахо."
52060-74 = "Тогда почему бы ТЕБЕ не объяснить Сенсею, что такое Фестиваль Вараку?"
52060-75 = "Конечно! Ну, Сенсей, всё очевидно! Я предложила Фестиваль Вараку, чтобы показать всем очарование Чисэ, её талант и её... абсолютную уникальность!"
52060-76 = "Будет выставка каллиграфии с её хайку, галереи уникальных предметов, которые она собрала, и даже мерч! Можно будет унести домой плюшевую Чисэ!"
52060-77 = "Но главным событием фестиваля, конечно, станет..."
52060-78 = "...праздничный концерт с Чисэ!"
52060-79 = "Так много людей ещё не слышали удивительный голос Чисэ! У него такая уникальная фактура и сладость, и теперь его услышит вся Хяккияко!"
52060-80 = "А ради истории клуб Инь-Ян подготовил три продвинутых телеобъектива, чтобы мы могли снова и снова переживать этот момент и—"
52060-82 = "К-Кахо... Хватит..."
52060-83 = "Дыши."
52060-84 = ""
52060-87 = ""
52060-88 = "Ах, простите, я не хотела... Прошу прощения."
52060-89 = "[s5] «Это было много...»\n[s6] «Рад видеть такую страсть.»"
52060-92 = "К-Конечно!"
52060-93 = "Я тоже усердно работала!"
52060-94 = "[s] «Это здорово!»"
52060-95 = "Мы знаем, что студенты Хяккияко уже в восторге от Фестиваля Вараку."
52060-96 = "Поэтому мы патрулировали площадку, следили за возможными проблемами с безопасностью и выгоняли нарушителей."
52060-97 = "Да! Мы прекрасно знаем и глубоко благодарны Хяккарёран за усилия."
52060-98 = "Однако в подготовке возникла проблема. Она связана с фестивалем, но... находится за его пределами."
52060-100 = "Что ты имеешь в виду?"
52060-102 = "Как думаете, что важнее всего для успешного фестиваля?"
52060-103 = "Подходящее место?"
52060-105 = "Яркие украшения?"
52060-106 = "Еда в палатках, да? Я всегда сначала иду туда."
52060-107 = "Согласна. Не могу насладиться фестивалем, пока не съем куриный шашлык."
52060-108 = "Да, куриные шашлыки... важны. Хороший аргумент. Но на фестивале есть ещё очень, очень много другой еды."
52060-109 = "Вообще, именно еда часто приносит основную прибыль на каждом событии."
52060-110 = ""
52060-112 = ""
52060-113 = "Но... знаете, откуда приходит большая часть ингредиентов для фестиваля?"
52060-114 = "[s] «Не отсюда?»"
52060-115 = "Некоторые отсюда, но большинство привозят издалека!"
52060-116 = "Большинство свежих продуктов поступает из дочерней школы Эбису в северном районе."
52060-117 = "[s] «Дочерняя школа Эбису...?»"
52060-118 = "Да. Хотя сейчас Хяккияко едина, это далось нелегко. Долгие годы мы были разделены на враждующие дочерние школы."
52060-119 = "В отдалённых районах — на окраинах Хяккияко — дочерние школы сохранились до сих пор."
52060-120 = "Одна из них, наиболее важная сейчас, — Эбису на севере."
52060-121 = "Дочерняя школа Эбису окружена плодородными полями. Годами они поставляют нам отборные ингредиенты, благодаря которым наши фестивали такие... аппетитные."
52060-122 = ""
52060-124 = ""
52060-125 = "Хм? Это ведь рядом с... Великим снежным полем, да? Не знала, что там вообще можно что-то выращивать."
52060-126 = "Фу-фу... Корнеплоды вроде редьки, картофеля и моркови становятся слаще на холоде. А в отличие от Великого снежного поля, в Эбису есть времена года. Летом там очень приятно!"
52060-128 = "Рыба, фрукты и сыр там тоже великолепны."
52060-129 = "И волосатые крабы!"
52060-130 = "[s7] «Звучит невероятно вкусно.»\n[s8] «Когда-нибудь хочу туда съездить.»"
52060-133 = "Ну... Эбису попросила нас о помощи. И думаю, именно Хяккарёран подходит лучше всех."
52060-134 = ""
52060-136 = ""
52060-137 = ""
52060-139 = ""
52060-140 = "Говорят, когда небо хмурое или после заката, появляются какие-то паранормальные... сущности и нападают на людей."
52060-141 = "Паранормальные...?"
52060-142 = "Насчёт этого... в Эбису просто не нашли лучшего слова."
52060-143 = "Видите ли, эти... сущности... не имеют постоянной формы."
52060-144 = "Одни видели гротескных чудовищ, другие — зверей, а кто-то утверждает, что столкнулся со старыми врагами."
52060-145 = ""
52060-147 = ""
52060-148 = "Все эти сущности выглядели по-разному, но у них есть две общие черты."
52060-149 = "Во-первых, они воплощают величайший страх жертвы."
52060-150 = "Во-вторых, огнестрельное оружие не причиняет им вреда, по крайней мере обычное."
52060-151 = ""
52060-154 = ""
52060-155 = ""
52060-157 = ""
52060-159 = "Фантомные сказания."
52060-160 = "Именно! Мы думаем одинаково."
52060-161 = "Странные монстры, которые устраивают хаос и выходят лишь во тьме..."
52060-162 = "Они и правда похожи на Духов артефактов, которых «Красота природы» призвала во время прошлого Фестиваля фонарей."
52060-163 = ""
52060-165 = ""
52060-167 = "И, если память мне не изменяет, единственное, что способно ранить этих монстров, — Сотня Лотосов, верно?"
52060-168 = "..."
52060-170 = "Пока их видели всего несколько раз, но мы не хотим ждать, пока всё выйдет из-под контроля. Эбису нужна наша помощь, а нам — их."
52060-171 = "Если возможно, Хяккарёран мог бы расследовать это? Наш фестиваль зависит от этого."
52060-173 = "Похоже, это действительно работа для нас..."
52060-174 = "«Нас» здесь не совсем подходит. Только Нагуса, как исполняющая обязанности президента, может владеть Сотней Лотосов."
52060-175 = ""
52060-177 = ""
52060-179 = ""
52060-180 = "Мы нужны в северном районе?"
52060-181 = "Пусть у меня и нет таланта Аямэ... я выложусь полностью."
52060-182 = "...Вот она."
52060-183 = "Хорошо! Разнесём этих Духов, а заодно вылечим руку Нагусы!"
52060-184 = "И спасём президента Аямэ!"
52060-186 = "Фу-фу... Я так рада, что мы согласны."
52060-187 = "Все наши интересы совпадают! Будто убить двух зайцев─"
52060-188 = "─или лучше сказать, ТРЁХ зайцев одним выстрелом?"
52060-189 = "[s] «И... зачем здесь я?»"
52060-190 = "Вы же знаете, я никогда не стала бы тратить ваше время впустую, Сенсей."
52060-191 = "Помните наши поиски Кузунохи?"
52060-192 = "[s9] «Конечно.»\n[s10] «...Сейчас об этом можно не переживать.»"
52060-193 = ""
52060-194 = ""
52060-196 = ""
52060-197 = "Нья-ха?! Н-Не переживать...?"
52060-198 = "Это... неожиданно. Я думала, вы всё ещё пытаетесь решить проблему с Хромой."
52060-199 = "Вы так выросли. По-настоящему сделали себе имя, Сенсей [USERNAME]."
52060-200 = ""
52060-202 = ""
52060-203 = "Ну, не то чтобы вы ищете, но я слышала слухи, что Великая Пророчица Кузуноха живёт в Сумеречном храме."
52060-204 = "Разумеется, как и в случае самой Кузунохи, мы даже не уверены, что Сумеречный храм существует. Несколько студентов утверждают, что видели его, но... кто знает?"
52060-205 = "Я слышала, Сумеречный храм находится где-то в центре Великого снежного поля."
52060-206 = "Искать, скорее всего, несуществующий храм на бескрайнем пронизывающем холодом снежном поле — совершенно не моё представление о хорошем времяпрепровождении..."
52060-207 = "...но разве Нагуса не нашла там, в снегах, письмо Кузунохи? Сомневаюсь, что это просто совпадение."
52060-208 = "[s] «Ты думаешь, она на Великом снежном поле!»"
52060-209 = "Великое снежное поле — место не для слабонервных, а слабее Сенсея в этом смысле никого нет. Он не переживёт даже одной пули."
52060-210 = "[s] «Это немного жестоко...»"
52060-211 = "Фу-фу. Зато район возле дочерней школы Эбису хороший и безопасный!"
52060-212 = "Так что если будете держаться рядом с Хяккарёран и немного помогать..."
52060-213 = ""
52060-215 = ""
52060-217 = ""
52060-218 = "...кто знает, возможно, легендарная Великая Пророчица вас заметит!"
52060-219 = "[s11] «Спасибо, Ния.»\n[s12] «Это было... очень полезно.»"
52060-222 = "Да пустяки! Мы все просто невероятно благодарны, что вы вместе с Хяккарёран занимаетесь этим."
52060-223 = "...Ния!"
52060-224 = "На снежное поле?"
52060-225 = "Нет... не ты, Чисэ. Тебе нужно остаться здесь и помогать готовить Фестиваль Вараку."
52060-226 = "Я хотела увидеть снег... Белые облака..."
52060-227 = ""
52060-229 = ""
52060-230 = "Уф... Чисэ, пожалуйста, не расстраивайся! Я сейчас заплачу..."
52060-231 = "Н-Но всё равно нельзя! Чисэ, этот фестиваль весь ради тебя! Ты должна остаться."
52060-232 = "[s] «В следующий раз, Чисэ. Обещаю.»"
52060-233 = "Я буду ждать."
52060-235 = "Пусть это и не Чисэ, Эбису обещала, что кто-нибудь встретит вас по прибытии."
52060-236 = "Я знаю, что вас сопровождает очень способный Хяккарёран, но всё равно будьте осторожны. Это чужая территория."
52060-237 = "Счастливого пути, Сенсей!"
52060-239 = "Следующий эпизод;Снежная страна"
