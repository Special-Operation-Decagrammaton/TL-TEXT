[translation]
90001290-1 = "Эпизод 29;Грузоперевозки"
90001290-2 = "[ns] «М-Мы сделали это...!»"
90001290-3 = "Слава богу, с вами всё в порядке, Сенсей! Должно быть, это был тот пророк, о котором вы говорили!"
90001290-4 = "Это было невероятно! Как будто победили мини-босса!"
90001290-5 = "Если оставить в стороне сравнение Арис с мини-боссом... это определённо был необычный пророк. Во многих смыслах."
90001290-7 = "Ну, у нас ведь даже нет чёткого стандарта того, каким вообще должен быть пророк."
90001290-8 = "Но всё же он ощущался иначе, чем те, с которыми мы сталкивались раньше."
90001290-9 = "Да. Казалось, что множество отдельных частей объединились, чтобы поддерживать основной модуль."
90001290-10 = "Разве это не была чрезмерная реакция? Такой объём огневой мощи мог уничтожить семена, которые он пытался защитить."
90001290-12 = "Мне это тоже показалось странным. Возможно..."
90001290-13 = "...он ставил устранение нарушителей выше защиты."
90001290-14 = "Слово «устранение» делает всё это ещё страшнее..."
90001290-15 = "Эти ИИ, которых называют пророками... Они все были такими же беспощадными...? Сенсей, неужели вы всё это время сражались с подобным...?"
90001290-16 = "Ува-а-а... Мир за пределами моего одеяла... и моего шкафчика такой страшный."
90001290-17 = ""
90001290-18 = "[ns1] «Ну... До сих пор всё как-то обходилось.»\n[ns2] «На самом деле это благодаря Отряду Исследования Сверхъестественного и всем остальным.»"
90001290-21 = ""
90001290-22 = "Ох. Я была бы совершенно не против, если бы вы похвалили меня ещё немного, Сенсей."
90001290-23 = "Зачем вы это сказали, Сенсей? Смотрите. У президента снова раздувается голова."
90001290-24 = "Согласна, Сенсей. Признания заслуживаю именно я. Я превосходно, безупречно работаю и как член C&C, и как член Отряда Исследования Сверхъестественного."
90001290-26 = "...Я начинаю задаваться вопросом, как вам вообще удавалось всё это время сохранять Сенсею жизнь."
90001290-28 = "Тиферет... проиграла...?"
90001290-29 = "В-Вааааа!"
90001290-30 = "Я правда... правда не верила, что такое возможно..."
90001290-31 = ""
90001290-33 = ""
90001290-34 = "Тиферет вышла на связь. Она приносит глубочайшие извинения."
90001290-35 = "Прежде всего Соф. Она извиняется за то, что следование остаточным воспоминаниям ИИ хранилища семян привело к такому результату."
90001290-36 = "И перед Эйн — за то, что предала твоё доверие."
90001290-37 = "И наконец перед Ор — за убеждение, будто она всегда лишь разочаровывала своего управляющего."
90001290-38 = ""
90001290-39 = "Нет, это не так. Всё хорошо. Мы можем хотя бы радоваться тому, что данные Тиферет в безопасности."
90001290-40 = "...Если бы только не все эти непредвиденные переменные... вроде той принцессы и её слуги..."
90001290-41 = "Когда и как вообще эти переменные успели сюда пробраться?"
90001290-42 = "П-Продержись ещё немного, Тифи! М-Мы что-нибудь придумаем!"
90001290-43 = "Ор! Как там последний пусковой контейнер?"
90001290-44 = "Так или иначе, мы ЗАСТАВИМ его работать. Поэтому, Эйн!"
90001290-45 = "Д-Да! Н-Но..."
90001290-46 = "Нам нужно больше времени...! Чтобы переместить Тифи в пусковой контейнер в подвале и загрузить её... нужно ещё хотя бы 30 минут...!"
90001290-47 = "У нас нет столько времени!"
90001290-48 = "Ч-Ч-Ч-Ч-Что же нам делать...?"
90001290-49 = "Просто! Переместим пусковой контейнер прямо под Тиферет...!"
90001290-50 = "А потом...?"
90001290-52 = "А потом взорвём пол!"
90001290-53 = "Чего-о-о-о-о?!"
90001290-54 = "Остренько! А мне нравится!"
90001290-55 = "Правда?!"
90001290-59 = "Что теперь? Эта дрожь... была довольно сильной, нет?"
90001290-60 = "Да. Будто под нами двигалось что-то огромное."
90001290-61 = "Предупреждение системы безопасности: код 2. Предупреждение системы безопасности: код 2. Объект переходит в режим блокировки."
90001290-62 = "Внимание. Объект переходит в режим блокировки. Всем оставшимся сотрудникам немедленно покинуть помещение."
90001290-63 = ""
90001290-65 = ""
90001290-66 = ""
90001290-68 = "Ух...! Сенсей! Держитесь за меня!"
90001290-69 = "Все, выбирайтесь отсюда!"
90001290-70 = ""
90001290-72 = ""
90001290-79 = "Все в порядке? Особенно Арис? И Сенсей, наверное?"
90001290-80 = "Со мной всё хорошо, Кей! И с остальными тоже. Но..."
90001290-81 = ""
90001290-82 = "[ns] «Что именно произошло...?»"
90001290-83 = ""
90001290-84 = "Сенсей! Там, внизу...!"
90001290-88 = "Что... это?"
90001290-89 = "Похоже на огромный транспортный комплекс."
90001290-90 = "...! Неужели именно так они перевозили ресурсы на Стальной континент?"
90001290-91 = "Но... как именно? Это больше похоже на огромный грузовой контейнер, чем на что-либо ещё..."
90001290-92 = ""
90001290-95 = "Неужели...? Все пригнитесь! К-Кажется, оно сейчас выстрелит!"
90001290-96 = ""
90001290-101 = "[ns] «А-А-А-А!»"
90001290-102 = "Вы в порядке, Сенсей? Мы с Токи заблокировали всё, что смогли!"
90001290-103 = "Похоже, вы целы. Я рада."
90001290-105 = "...Контейнер исчез. Точнее, его запустили."
90001290-106 = "Как ты поняла, что он вот-вот выстрелит?"
90001290-107 = "Н-Ну... В одной игре, в которую я раньше играла, было похожее устройство... п-поэтому я просто подумала..."
90001290-108 = "Хм... Понятно. Возможно, из игр можно узнать больше полезного, чем я думала."
90001290-110 = "А пока спустимся в пространство внизу."
90001290-111 = "Здесь много остаточного тепла, так что будьте осторожны."
90001290-112 = "Я... останусь здесь и постою на страже."
90001290-113 = "А? Если уж идти, то нам всем вместе— А. О. Понятно. Тогда рассчитываем на тебя."
90001290-114 = "Да. Спасибо, Кей."
90001290-120 = "Вон оттуда сюда тянется длинный рельс."
90001290-121 = "Понятно. Похоже, по нему сюда доставляли ресурсы с мест добычи."
90001290-122 = "Когда они прибывали, их загружали в контейнер, который мы видели раньше..."
90001290-124 = "...а затем запускали на Стальной континент. Эта система... Как её лучше назвать?"
90001290-125 = "Пока что вполне подойдёт название «пусковая установка контейнеров»."
90001290-126 = "В любом случае, похоже, это было их основным способом транспортировки."
90001290-127 = ""
90001290-128 = "Если проанализировать траектории контейнеров, мы сможем вычислить координаты Стального континента."
90001290-129 = "Раз уж у нас есть возможность, разумно будет заодно изучить оставшиеся здесь сооружения."
90001290-131 = "Поняла. Не совсем, но ладно. Что мне делать?"
90001290-132 = "Эм... Для начала..."
90001290-133 = "Тут понадобится дополнительная физическая сила, можешь позвать Эйми?"
90001290-134 = "Там внизу жарко. Не хочу."
90001290-135 = "[s] «Потом куплю тебе что-нибудь холодное!»"
90001290-136 = "..."
90001290-137 = "Так точно, Сенсей. Лучше сдержите обещание."
90001290-138 = ""
90001290-140 = "Следующий эпизод;Подготовка к отправлению"
