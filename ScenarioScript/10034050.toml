[translation]
10034050-1 = "Эпизод 5;Ради Айри"
10034050-2 = ""
10034050-3 = ""
10034050-4 = "[ns1] «Совсем не можешь с ней связаться?»\n[ns2] «Она не приходила на репетиции?»"
10034050-7 = "Нет. Уже два дня подряд..."
10034050-9 = "ОДИН день я бы ещё не считала проблемой, но..."
10034050-10 = "Странно, что она даже на звонки не отвечает."
10034050-11 = "...Полагаю, вы тоже ничего от неё не слышали."
10034050-12 = "То есть никто не знает, где она? Н-нам нужно сообщить в Оперативную группу правосудия?"
10034050-13 = "...У вас нет никаких догадок?"
10034050-14 = "[s3] «...Ты заметила что-нибудь странное перед её исчезновением?»\n[s4] «Расскажи всё, что помнишь.»"
10034050-17 = "Эм, ну... ничего конкретного я назвать не могу."
10034050-18 = "Мы не ссорились и ничего такого. И репетиции были не идеальными, но становилось лучше."
10034050-19 = "Я вообще не ожидала ничего подобного. Особенно когда речь об Айри."
10034050-21 = "...Если бы это я пропустила две репетиции подряд, никто бы даже глазом не моргнул."
10034050-22 = "Ага. Если бы это была Нацу..."
10034050-23 = ""
10034050-25 = ""
10034050-26 = "...Погодите, вы это осознаёте? И просто признаёте?"
10034050-27 = "Если вы понимаете, то зачем тогда вообще ведёте себя так...?"
10034050-28 = "В целом ничего особенно заметного не было, но одна странность всё же имелась."
10034050-29 = "Хм?"
10034050-30 = "...Что?"
10034050-31 = "Совсем небольшая... но была. Возможно, именно в этом и заключалась проблема."
10034050-32 = "О какой странности ты говоришь?"
10034050-33 = "Ну, она была слишком незначительной, чтобы на неё указывать."
10034050-34 = "Может, это вообще ничего не значило. Я говорю на всякий случай, так что не принимайте мои слова за истину."
10034050-35 = "Но всё же... Как бы это сказать...?"
10034050-36 = "Последние несколько дней... казалось, Айри чувствовала..."
10034050-37 = "...будто у неё что-то... не получается."
10034050-38 = "[s5] «Не получается?»\n[s6] «На репетициях? Что-то с навыками?»"
10034050-41 = "Она выглядела довольно неспокойной. Будто за ней что-то гналось."
10034050-42 = "Конечно, она всё это подавляла и постоянно улыбалась, так что, возможно, думала, что мы ничего не заметим."
10034050-43 = "Ты тоже заметила. У тебя острый глаз на такие вещи."
10034050-44 = "...Погодите, что? Когда она так себя вела? Почему я ничего не заметила...?"
10034050-45 = "Повторюсь, это почти не бросалось в глаза. Она специально не позволяла этому влиять на репетиции."
10034050-46 = "Но всё равно я бы никогда не подумала, что она исчезнет, не сказав ни слова."
10034050-47 = "Наверняка что-то случилось..."
10034050-48 = "...А? Что вы сказали?"
10034050-49 = "У вас есть версия, Сенсей?"
10034050-50 = ""
10034050-52 = ""
10034050-53 = "...Сенсей...? Почему вы...?"
10034050-54 = "Это же клавиши, которые оставила Айри..."
10034050-55 = ""
10034050-57 = ""
10034050-58 = ""
10034050-59 = "*ахает* Это...?"
10034050-60 = "Под чехлом лежит листок бумаги..."
10034050-61 = "Это записка."
10034050-62 = "Ч-что? Записка? Зачем ей было оставлять нам такую записку?"
10034050-63 = "[s7] «Потому что это Айри.»\n[s8] «Она ни за что не ушла бы, не сказав ни слова.»"
10034050-66 = "Что там написано...? М-можно посмотреть...?"
10034050-67 = ""
10034050-69 = ""
10034050-72 = "«Всем.»"
10034050-73 = "«Простите.»"
10034050-74 = "А?"
10034050-75 = "Хм?"
10034050-76 = "...Она просит прощения...?"
10034050-78 = ""
10034050-80 = ""
10034050-82 = "«Простите, что тяну вас назад.»"
10034050-83 = "«Так ничего не получится, поэтому я поищу кого-нибудь получше себе на замену.»"
10034050-85 = "...Что?"
10034050-86 = ""
10034050-88 = ""
10034050-90 = "«Надеюсь, вы всех там порвёте. Вы...»"
10034050-91 = "«Вы не такие, как я.»"
10034050-92 = "...«Поэтому я уверена, что у вас получится»"
10034050-93 = "Эм..."
10034050-94 = ""
10034050-95 = ""
10034050-96 = "Что..."
10034050-98 = "Что это вообще за чушь...?"
10034050-104 = ""
10034050-105 = ""
10034050-106 = "...Эм."
10034050-107 = "Погодите, и что, мы так и будем здесь стоять?"
10034050-109 = "...? Что ты имеешь в виду под «и что, мы так и будем»?"
10034050-110 = "Сенсей сказал, что догадывается, где искать Айри."
10034050-111 = "Если Сенсей знает, где она, значит, вероятно, знает и в чём её проблема, так что нам стоит оставить это Сенсею, да?"
10034050-112 = "Если ты снова вломишься, настаивая, что всё сделаешь сама, как в прошлый раз..."
10034050-113 = ""
10034050-115 = ""
10034050-116 = ""
10034050-117 = ""
10034050-118 = "...? Почему вы на меня смотрите...?"
10034050-119 = "Да ни почему, просто вспомнила прошлый раз."
10034050-120 = "И всё же, даже если Сенсей вернёт Айри, это на самом деле ничего не решит."
10034050-121 = "Мы точно хотим просто сидеть сложа руки, пока они не вернутся?"
10034050-122 = "Сенсей сказал, что пойдёт один, значит, так и сделаем. Уверена, у него есть причина."
10034050-123 = "...О, можем разложить на столе любимые вещи Айри к их возвращению."
10034050-124 = "Устроим вечеринку, на которой съедим годовой запас мятного шоколада."
10034050-125 = "Да брось! Я вообще не об этом!"
10034050-126 = "Вы не заметили, как странно вела себя Айри? Она была сама не своя!"
10034050-127 = "И я не только про её исчезновение. Она с самого начала была другой!"
10034050-128 = "Айри вообще когда-нибудь НАСТАИВАЛА на чём-то? Разве это не впервые?"
10034050-129 = ""
10034050-132 = ""
10034050-133 = "Если подумать..."
10034050-134 = "Это совсем не в её стиле. Разговоры о группе, игра на инструментах..."
10034050-135 = "Она приплела эту историю с Frederica Semla и втянула всех нас..."
10034050-136 = "И выглядела напряжённой, словно ей обязательно нужно что-то доказать."
10034050-137 = "ПОЧЕМУ она хотела собрать группу? Почему захотела начать играть? А до этого..."
10034050-138 = "Что вообще могло быть проблемой ещё до этого?"
10034050-139 = "Мм. Значит, пока отложим сам стресс и сосредоточимся на его первопричине."
10034050-140 = "Хорошая мысль. И, похоже, сейчас у нас есть время это обдумать."
10034050-141 = ""
10034050-143 = ""
10034050-144 = "А?"
10034050-145 = "...Хм?"
10034050-146 = "Хотя ответ кажется довольно очевидным..."
10034050-147 = "Что значит «очевидным»?"
10034050-148 = "Идея с группой свалилась как снег на голову. Что тут очевидного?"
10034050-149 = "Подумайте. Когда мы начали репетировать, у нас была цель, причина всё это делать."
10034050-150 = ""
10034050-152 = ""
10034050-153 = "Пройти прослушивание."
10034050-154 = "Айри была помешана на репетициях. Наверняка боялась провала. Достаточно очевидно, разве нет?"
10034050-156 = "Но если бы она провалилась, это ведь не имело бы большого значения, да? Вот этого мы до сих пор и не понимаем."
10034050-157 = "Прослушивание было лишь предлогом, чтобы мы согласились. Само по себе оно не так важно."
10034050-158 = "Да, может, ты права. Даже если мы провалимся, единственное, что мы потеряем, это..."
10034050-159 = "...Frederica Semla..."
10034050-160 = ""
10034050-162 = ""
10034050-163 = "Хм?"
10034050-164 = "Хм?"
10034050-165 = "Хм?"
10034050-166 = ""
10034050-168 = ""
10034050-169 = "*ахает*"
10034050-170 = "А...!"
10034050-171 = "Подо-о-ождите секунду!"
10034050-172 = "Что ты теперь пытаешься сказать?"
10034050-173 = "Да просто подумайте секунду! Будто все кусочки головоломки наконец сходятся...!!"
10034050-174 = "С чего бы такой, как Айри, самой настаивать, чтобы мы создали группу?"
10034050-175 = "Что она сделала сразу после того, как предложила то, на что никто из нас не согласился бы?"
10034050-176 = "...Показала нам листовку и рассказала о прослушивании."
10034050-177 = "Сказала, что если пройдём, сможем поесть Frederica Semla, будто пыталась нас заманить."
10034050-178 = "...Будто это всего лишь дополнительный бонус."
10034050-179 = "Но, может быть, только может быть!! Она ходила вокруг да около, но..."
10034050-180 = ""
10034050-183 = "...А что, если всё было наоборот...?!"
10034050-184 = ""
10034050-186 = ""
10034050-187 = ""
10034050-188 = "Нет-нет, Ёшими. По-моему, ты уже слишком далеко зашла."
10034050-189 = "Почему? Это прямо один в один то, как могла бы думать Айри."
10034050-190 = "Да ладно тебе. Серьёзно? В этом вообще есть смысл?"
10034050-191 = "В это трудно поверить, но иногда и сама правда звучит невероятно."
10034050-193 = "Думаю, мы правы! Абсолютно правы! На сто процентов! Прямо в яблочко!"
10034050-194 = "Другой причины просто нет! Что бы мы там ни думали!"
10034050-195 = "КОНЕЧНО её расстраивает, что она не становится лучше!! КОНЕЧНО она злится и переживает!!"
10034050-196 = "Потому что именно она больше всех хотела съесть semla!!"
10034050-197 = "Потому что ей ОБЯЗАТЕЛЬНО нужно пройти прослушивание!! Если провалится, ничего не получит!!"
10034050-198 = ""
10034050-200 = ""
10034050-202 = ""
10034050-203 = "...Серьёзно? Поднимать такой шум из-за одной маленькой...?"
10034050-204 = "Шум? Подумай сама. Айри ведь не сказала бы: «Эй, я хочу съесть semla, так что давайте все вместе соберём группу!!» Правда?"
10034050-205 = "...Нет. Нацу — возможно, но не Айри."
10034050-207 = "Эй. Эм... мне кажется, сегодня все почему-то решили пройтись именно по мне..."
10034050-208 = "В любом случае... она делала вид, будто всё ради группы, а сама заманивала нас этой semla."
10034050-209 = "Но на самом деле semla с самого начала была её конечной целью. Она за неё жизнь отдаст!"
10034050-210 = "Правда? Всё ведь сходится, да?! Это же совершенно в стиле Айри!! Я знаю её как свои пять пальцев!"
10034050-211 = "Н-ну... не скажу, что ты НЕ ПРАВА, но..."
10034050-212 = "То есть доводы у тебя хорошие, но... Айри? Вот так нас подводить к этому?"
10034050-213 = "Ну, она ведь ничего плохого не сделала. Нет ничего страшного в том, чтобы не рассказывать всем о своей мотивации, правда?"
10034050-214 = "Она ведь нам не врала. Мы получим столько же semla, сколько и она, так что ей вообще не за что себя винить."
10034050-215 = "И она придумала целую историю, чтобы всё это прикрыть. Неплохая стратегия, если всё сработает."
10034050-216 = "...Но."
10034050-217 = "Если вся эта стратегия зависит от её собственных навыков..."
10034050-218 = "Конечно, она будет нервничать! Это же дико стрессово!! Даже Я бы сбежала!!"
10034050-219 = "А вы бы нормально себя чувствовали в такой ситуации? Если бы сами всё это затеяли?"
10034050-220 = "Значит, вся эта чушь о поиске другого участника — просто потому, что мы не сможем вместе с ней съесть semla..."
10034050-221 = "...Серьёзно?"
10034050-222 = "...Мм... Что и требовалось доказать, я бы сказала."
10034050-223 = ""
10034050-225 = ""
10034050-226 = "*вздыхает*"
10034050-227 = "Айри, Айри..."
10034050-228 = "Айриии!! Ну ты и дурочка!! Почему просто не... Аргх!!"
10034050-229 = "Как ты и сказала, она не из тех, кто так поступает."
10034050-230 = "Это правда, но...!! Угх!!"
10034050-231 = "Значит, всё упирается в semla. И если мы добудем ей одну, она больше не будет нервничать."
10034050-232 = "Лучшего финала и пожелать нельзя. Более того — это просто рок."
10034050-233 = "Погодите, разве semla не очень трудно достать? И мы ведь даже не уверены, что пройдём прослушивание..."
10034050-234 = "Если честно, мне было бы не по себе идти на прослушивание с кем-то вместо Айри."
10034050-235 = "Конечно. Но это даже не главная проблема."
10034050-236 = "До прослушивания неделя. Мы что, будем всё это время смотреть, как Айри унывает?"
10034050-237 = "Ни за что, абсолютно нет! Только через мой труп!"
10034050-238 = "Давайте найдём одну. Если раздобудем её к завтрашнему дню, сможем просто запихнуть ей в рот!"
10034050-239 = "Идея хорошая, но не выйдет. Semla нельзя просто купить в магазине."
10034050-240 = "Она настолько редкая, что даже Комитету Карнавала приходится специально её добывать. Сами мы её не достанем."
10034050-241 = "Н-ну, я..."
10034050-242 = ""
10034050-244 = ""
10034050-246 = ""
10034050-247 = ""
10034050-248 = "Хм?"
10034050-249 = "...Зачем так быстро сдаваться? Наверняка где-нибудь мы её найдём."
10034050-250 = "А? Что?"
10034050-251 = "«Где-нибудь найдём»?! Где?!"
10034050-252 = "Хм?"
10034050-253 = "Почему ты меня спрашиваешь? Ты сама уже сказала..."
10034050-254 = "...У Комитета Карнавала она есть."
10034050-255 = "Хм?"
10034050-256 = "А-ха. Я всё думала, к чему ты клонишь."
10034050-257 = "Но нет. Если бы они раздавали её всем, кто попросит, она бы изначально не была призом."
10034050-258 = "Эм, мне кажется, Нацу вовсе не предлагает нам просить..."
10034050-259 = ""
10034050-261 = ""
10034050-262 = "...Ты ведь не думаешь устроить ограбление, правда? Это уже полный абсурд."
10034050-263 = "Фестиваль проводит Чаепитие, прямо в центре кампуса."
10034050-264 = "Студенты из Комитета наверняка охраняют всё днём и ночью."
10034050-265 = "Нам придётся перелезть через стены, а потом нас ВСЁ РАВНО поймают, так что придётся с боем прорываться наружу..."
10034050-266 = "Невозможно. Никак не получится."
10034050-267 = "Понимаю, от меня это звучит смешно, но как таким тепличным нежным цветочкам, как мы, вообще провернуть ЧТО-ТО такое?"
10034050-268 = "Разве что найдётся кто-то, кто умеет всё это делать и сможет устроить нам ускоренный курс..."
10034050-269 = "...Любопытно, что ты это сказала, Ёшими."
10034050-270 = "Ты не видишь? Или настолько привыкла к ней, что уже забыла. Но среди нас есть одна, кто умеет и по стенам лазить, и сражаться."
10034050-271 = "...А?"
10034050-272 = ""
10034050-274 = ""
10034050-275 = ""
10034050-276 = "Она даже сейчас здесь, вместе с нами. В отличие от нас, она не тепличный цветок. Вышедший на покой монстр преступного мира, спящий зверь..."
10034050-277 = ""
10034050-279 = ""
10034050-280 = ""
10034050-281 = "...Легенда."
10034050-282 = ""
10034050-284 = ""
10034050-285 = ""
10034050-286 = "Нацу, нет. Даже не начинай."
10034050-287 = ""
10034050-289 = ""
10034050-290 = ""
10034050-291 = "Без шуток, подруга. Я совершенно серьёзна. Даже серьёзнее обычного."
10034050-292 = "Сверхсерьёзна, можно сказать. Дело чрезвычайной важности."
10034050-293 = "Ты и сама всё понимаешь. Это единственный вариант. Других у нас действительно не осталось."
10034050-294 = "Н-но это только потому что...!"
10034050-295 = "Более того, возможно, всё твоё прошлое с самого начала было предначертано, чтобы привести тебя к этому моменту."
10034050-296 = "Неужели тебе не приходило в голову, Кёяма Казуса, что именно у тебя есть нужная нам сила?"
10034050-297 = "Ну, эм, это..."
10034050-298 = "Эм...! Угх...!"
10034050-299 = "..."
10034050-300 = ""
10034050-302 = ""
10034050-303 = ""
10034050-304 = ""
10034050-305 = "*вздыхает*"
10034050-306 = "...Ладно, сначала скажу вот что."
10034050-307 = "Даже ЕСЛИ я возьму всё на себя, никаких гарантий нет. Как только вызовут Оперативную группу правосудия и они появятся — всё кончено."
10034050-308 = "И даже если мы сумеем выбраться, последствия всё равно будут."
10034050-309 = "За проникновение в командный центр мероприятия, которое проводит Чаепитие? Ещё бы."
10034050-310 = ""
10034050-312 = ""
10034050-314 = "Итак, сегодняшний день станет концом Клуба сладкоежек после уроков. Потому что к этому времени завтра клуба уже не будет существовать."
10034050-315 = "Не будет ни комнаты, ни финансирования. Другими словами, нас просто вышвырнут на улицу."
10034050-316 = "Так ты всё понимаешь, но всё равно..."
10034050-318 = "...И что?"
10034050-319 = ""
10034050-320 = "В смысле... и что?"
10034050-321 = "...Тебя это останавливает?"
10034050-322 = "Загляни в своё сердце, Кёяма Казуса. Неужели страх последствий действительно заставляет тебя отступить?"
10034050-323 = "Или мне стоит спросить кого-нибудь ещё. Что скажешь, Ёшими?"
10034050-324 = "Хм?"
10034050-325 = "Что я думаю?"
10034050-326 = "Я думаю: «да кому какое дело?» Мы ведь всё равно сможем встречаться вне клуба. Если мы даже ради подруги не способны на такое, тогда зачем вообще нужен этот клуб?"
10034050-327 = "Просто создадим групповой чат и будем встречаться так."
