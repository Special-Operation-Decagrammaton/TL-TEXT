[translation]
10024090-1 = "Эпизод 9;Добро побеждает, справедливость торжествует"
10024090-2 = "Генрюмон"
10024090-3 = ""
10024090-4 = "..."
10024090-5 = "..."
10024090-6 = ""
10024090-8 = ""
10024090-9 = ""
10024090-10 = "...и вот что произошло."
10024090-11 = "Надеюсь, вы там вовсю применяете к пойманным преступникам своё любимое правосудие Генрюмон."
10024090-12 = "Значит, всё закончено? Мы поймали настоящего виновника."
10024090-13 = "И имя Променада Чёрной Черепахи очищено..."
10024090-14 = "Это всё, что вы можете сказать?"
10024090-15 = "Я знала, что так будет, но всё равно разочарована..."
10024090-16 = "[s] «Генрюмон ведь обвиняла Променад Чёрной Черепахи без настоящих доказательств, верно?»"
10024090-17 = "Да ладно вам. Проступок одного человека не делает виновной всю Генрюмон!"
10024090-18 = "Почему мы должны отвечать за ошибки одного члена?"
10024090-19 = "Если бы мы так делали, Генрюмон вообще ничего не смогла бы сделать!"
10024090-21 = "Господи... Они вообще не понимают."
10024090-22 = "Это только подтверждает всё плохое, что я когда-либо думала о Генрюмон... и мне от этого грустно."
10024090-23 = ""
10024090-25 = ""
10024090-27 = ""
10024090-28 = "П-президент идёт!"
10024090-29 = "Президент идёт!"
10024090-30 = ""
10024090-32 = ""
10024090-34 = ""
10024090-35 = "Мне показалось, я слышу здесь шум."
10024090-37 = ""
10024090-39 = ""
10024090-40 = "Г-госпожа! Эти смутьяны—!"
10024090-42 = "Довольно. Я уже всё знаю."
10024090-43 = "Госпожа...!"
10024090-44 = ""
10024090-46 = ""
10024090-47 = ""
10024090-49 = ""
10024090-50 = ""
10024090-52 = ""
10024090-54 = "Госпожа?!"
10024090-55 = "Она... кланяется...?"
10024090-56 = "О боже..."
10024090-57 = ""
10024090-59 = ""
10024090-60 = "От имени Генрюмон приношу официальные извинения."
10024090-61 = "За беспочвенные обвинения против Променада Чёрной Черепахи. За оскорбление чести Променада."
10024090-62 = "И прежде всего — за нарушение общественного порядка Шаньхайцзина и мою беспечность как руководителя."
10024090-63 = "От имени Генрюмон обещаю больше никогда не допустить подобного."
10024090-64 = "Такова воля Рюгэ Кисаки, Президента Генрюмон."
10024090-65 = ""
10024090-67 = "Н-но... Президент..."
10024090-68 = "Оставайтесь на месте."
10024090-69 = "Мы просто..."
10024090-71 = "Я сказала — стойте."
10024090-73 = "Д-да, Президент!"
10024090-74 = ""
10024090-76 = ""
10024090-78 = ""
10024090-79 = "Это же хорошо, правда? Генрюмон принесла вам официальные извинения!"
10024090-80 = "Эм... Почему вы так на меня смотрите? Я тоже извинилась...!"
10024090-81 = "Это более чем справедливо. Во время расследования бывают ошибки. Не будешь же извиняться перед каждой ромашкой, которую раздавил каблуком..."
10024090-82 = ""
10024090-84 = ""
10024090-86 = ""
10024090-87 = "...Я не понимаю, Президент!"
10024090-88 = "Ну... А я понимаю. Отчасти."
10024090-89 = "Тебя правда устраивает, как всё закончилось?"
10024090-90 = "Не совсем. Но в то же время — да?"
10024090-91 = "Теперь никто не говорит прямо, что имеет в виду!"
10024090-92 = "[s1] «Кажется, я тоже понимаю...»\n[s2] «Не совсем, но да. Вот что я чувствую.»"
10024090-95 = "Ну что ж! Думаю, серьёзных разговоров на этот год достаточно."
10024090-96 = "Мы пришли к взаимопониманию с Генрюмон, и Променад Чёрной Черепахи снова может открыть бизнес!"
10024090-97 = "В конце концов, Генрюмон просто делала то, что должна как ученический совет."
10024090-98 = "Эм... Поняла. Я последую вашему решению, Президент."
10024090-99 = "Но это не значит, что я довольна!"
10024090-100 = "Да-да. Я приготовлю тебе что-нибудь вкусное, если от этого станет легче."
10024090-101 = ""
10024090-103 = ""
10024090-105 = ""
10024090-106 = "Не спешите уходить. Я хотела бы сделать вам предложение."
10024090-107 = "[s] «Что ты задумала?»"
10024090-108 = "Этот инцидент накрыл Шаньхайцзин тучей уныния."
10024090-109 = "И Генрюмон обязана что-то с этим сделать."
10024090-110 = "Поэтому я хочу нанять Променад Чёрной Черепахи."
10024090-111 = "Г-госпожа Президент?"
10024090-112 = "Не создавай проблем, Мина. Променад Чёрной Черепахи тоже часть Шаньхайцзина."
10024090-113 = "Это... правда. Да, госпожа Президент..."
10024090-114 = "Итак, что вы задумали? Я вся внимание."
10024090-115 = "Не спеши радоваться. Ты ещё не знаешь, о чём я попрошу."
10024090-116 = "Для Променада Чёрной Черепахи возможно всё! Кроме невозможного."
10024090-117 = "Это твоя гарантия?"
10024090-118 = "Если заплатите достаточно."
10024090-119 = "Хорошо. Я хочу, чтобы вы устроили праздник. Самый большой праздник, который у вас когда-либо был."
10024090-120 = "Праздник для каждого студента Шаньхайцзина... и для Сенсея."
10024090-121 = "[s] «О, я приглашён?»"
10024090-123 = "Вы сыграли важную роль в разрешении этого дела, разве нет?"
10024090-124 = "Я хочу, чтобы вы увидели и гостеприимную сторону Шаньхайцзина."
10024090-125 = "Праздник для всего Шаньхайцзина... и Сенсея..."
10024090-127 = "О деньгах не беспокойтесь. Генрюмон оплатит всё."
10024090-128 = "Или всё-таки это невозможно?"
10024090-129 = "Вовсе нет. На самом деле звучит весело!"
10024090-130 = "Давненько все члены Променада одновременно не собирались на кухне!"
10024090-132 = "Значит, справитесь?"
10024090-133 = "Конечно! Каждый член Променада был поваром прежде, чем стать торговцем."
