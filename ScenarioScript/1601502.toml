[translation]
1601502-1 = "Сахарный подъём"
1601502-2 = "Получив сообщение от Айри, я отправился в центр города."
1601502-3 = "Вскоре я заметил Айри, бегущую ко мне издалека."
1601502-4 = "Сенсе-э-эй!!!"
1601502-5 = ""
1601502-9 = ""
1601502-11 = ""
1601502-12 = ""
1601502-14 = "...Та-да!"
1601502-15 = "[s1] «...А-Айри?!»\n[s2] «Ты сегодня такая энергичная!»"
1601502-18 = "Хи-хи. Правда? Наверное, это всё адреналин!"
1601502-19 = "Я только что закончила репетицию в комнате группы! Она была очень продуктивной."
1601502-20 = "Пока мы обсуждали всякое, я вдруг вспомнила магазин, который давно хотела вам показать!"
1601502-21 = "И поэтому! Написала вам при первой же возможности!"
1601502-22 = "Прямо в ту же секунду, честно!"
1601502-23 = "[s3] «(Она сегодня и правда переполнена энергией.)»\n[s4] «(Не хочу сбивать ей настроение.)»"
1601502-26 = "Тогда вперёд! Магазин закрывается довольно рано, так что нам нужно идти как можно скорее!"
1601502-27 = "Пожалуйста, за мной!"
1601502-28 = ""
1601502-30 = ""
1601502-33 = "Ох... Эта очередь..."
1601502-34 = "Не ожидала столько людей, да ещё так рано... Придётся немного подождать..."
1601502-35 = "Похоже, я ошиблась насчёт того, что всё будет быстро... Наверное, стоило прийти чуть раньше..."
1601502-36 = "Репетировать всегда можно завтра... Может, сегодня надо было уйти пораньше и занять очередь."
1601502-37 = "[s5] «Нет-нет. Ты правильно сделала, что осталась.»\n[s6] «Спешить некуда. Мы всегда можем вернуться!»"
1601502-40 = "М-м... Наверное, вы правы, но..."
1601502-41 = "...А?"
1601502-42 = "Как я отношусь к тому, чтобы вернуться завтра? Эм... Хм..."
1601502-43 = "[s] «...Айри?»"
1601502-44 = "...Хмф!"
1601502-45 = "...Нет!"
1601502-46 = "Это просто не вариант. Какой бы длинной ни была очередь, правильнее всего ждать. Хоть час, хоть десять!"
1601502-47 = "И поэтому...!"
1601502-48 = ""
1601502-50 = ""
1601502-51 = "...А? А, п-подождите секунду."
1601502-52 = "Ай. Я только что поняла, что опять это сделала..."
1601502-53 = "[s7] «...Что ты имеешь в виду?»\n[s8] «Опять сделала...?»"
1601502-56 = "Я-Я имею в виду... Ну..."
1601502-57 = "Простите, Сенсей. Я пытаюсь заставить вас подстроиться под моё расписание, совсем не думая о вашем времени."
1601502-58 = "У вас и так наверняка очень плотный график... и даже если сегодня выходной, вам стоило бы использовать его для отдыха."
1601502-59 = "Иногда я не замечаю, как моё упрямство влияет на других... Остальные члены клуба постоянно мне об этом говорят..."
1601502-60 = "А теперь я поступила так же и с вами, Сенсей. Хи-хи... Мне правда очень жаль."
1601502-61 = "Как вы и сказали, давайте просто придём завтра. Или в любое другое удобное вам время!"
1601502-62 = ""
1601502-64 = ""
1601502-65 = "...А?"
1601502-66 = "Сегодня у вас нет никаких планов? Вы свободны и можете делать всё, что я захочу?"
1601502-67 = "Что значит это тоже отдых для вас? Я заставляю вас стоять в длинной очереди... Ноги устанут..."
1601502-68 = "[s9] «Отдых не обязательно означает лежать и спать.»\n[s10] «Мне весело, а это главное.»"
1601502-71 = "Сенсей..."
1601502-72 = "Хи-хи."
1601502-73 = "Я очень ценю ваши слова, но сегодня правда всё нормально. Эта очередь может занять больше времени, чем вы думаете..."
1601502-74 = "...Что?"
1601502-75 = "Вы правда-правда не против? Эм. Я не совсем понимаю, почему вам хочется остаться..."
1601502-76 = "[s11] «Ну, я кое о чём хочу тебя спросить.»\n[s12] «Расскажи подробнее, что тебе говорят остальные члены клуба!»"
1601502-79 = "А..."
1601502-80 = ""
1601502-82 = ""
1601502-83 = "...Пф."
1601502-84 = "Ха-ха-ха! Что вы вообще такое говорите, Сенсей?"
1601502-85 = "Вот что вас так заинтересовало? Там почти нет никакой истории. На самом деле это просто лекция о моих недостатках."
1601502-86 = "Совсем мелочь. Но я не против рассказать!"
1601502-87 = "Понимаете, когда я чем-то увлекаюсь, у меня бывает... туннельное зрение. И я известна своим упрямством."
1601502-88 = "...Хм? Например?"
1601502-89 = "Хм..."
1601502-90 = "...Хи-хи. Хорошо, Сенсей."
1601502-91 = ""
1601502-93 = ""
1601502-95 = "Может, этого как раз хватит, чтобы скоротать время."
