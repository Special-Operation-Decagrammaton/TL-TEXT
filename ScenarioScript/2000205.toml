[translation]
2000205-1 = "Средство для диеты"
2000205-2 = "Улица Променада Чёрной Черепахи"
2000205-3 = "Рада, что ты добрался без проблем."
2000205-4 = "Хе-хе! Как ты наверняка знаешь, это Променад Чёрной Черепахи в Шаньхайцзине. Он славится своей едой!"
2000205-5 = "Говорят, у уличных торговцев и Студсовета тайная вражда с руководством... Слухи ходят постоянно, но еда от этого хуже не становится!"
2000205-6 = "Может, этого и недостаточно, чтобы загладить мой косяк, но сегодня я отведу тебя в один из лучших ресторанов города!"
2000205-7 = "Кстати, у тебя на лице всё ещё осталась шерсть Незусукэ... Хе-хе."
2000205-8 = "Прости, знаю, смеяться не стоит... но это слишком смешно! Бахахаха!"
2000205-9 = "Фух... Не переживай, Сенсей. Эффект этого эликсира тоже скоро пройдёт. Шерсть должна выпасть примерно через месяц."
2000205-10 = "Ну что, пойдём внутрь."
2000205-11 = ""
2000205-13 = "Ресторан с лапшой"
2000205-14 = ""
2000205-15 = "Добро пожаловать! Что будете заказывать?"
2000205-16 = "Как обычно. Две порции лапши аль денте с густым бульоном, двойными овощами, побольше чеснока и жира, пожалуйста!"
2000205-17 = "Сейчас будет! Две лапши аль денте с густым бульоном, двойными овощами, дополнительным чесноком и жиром!"
2000205-18 = ""
2000205-19 = "*ур-р-р* *ур-р-р*"
2000205-20 = "В-Вы слышали, капитан? Эта мелкая заказала ВОТ ЭТО?"
2000205-21 = "Ну надо же. Не думал, что школьница вроде неё закажет лапшу аль денте с густым бульоном, двойными овощами, чесноком и дополнительным жиром."
2000205-22 = ""
2000205-24 = "Ура! Не могу дождаться."
2000205-25 = "[s] «Лапша и густой бульон с... чем?»"
2000205-26 = "Ты уже забыл? Я заказала лапшу аль денте с густым бульоном, двойными овощами, побольше чеснока и жира. Поверь, будет вкусно."
2000205-27 = "Думаешь, я не доем? Вот увидишь! Если постараться, возможно всё."
2000205-28 = "Девушки её возраста обычно считают калории, а она заказала дополнительный жир... Как с таким питанием у неё может быть такая фигура?"
2000205-29 = "Хороший вопрос. Она ни за что не доест эти миски."
2000205-30 = "Ваш заказ. Две лапши аль денте с густым бульоном, двойными овощами, дополнительным чесноком и жиром."
2000205-31 = "Наконец-то! Огромное спасибо!"
2000205-33 = "Вот это было вкусно!"
2000205-34 = ""
2000205-36 = "Вы видели, капитан? Эта мелкая всё съела. Даже бульон выпила!"
2000205-37 = "Как девушка такого размера может прикончить лапшу аль денте с густым бульоном, двойными овощами, чесноком и дополнительным жиром? У неё, должно быть, невероятный метаболизм..."
2000205-38 = ""
2000205-41 = ""
2000205-42 = "Эй, ты. Ты только что съела две порции лапши аль денте с густым бульоном, двойными овощами, чесноком и дополнительным жиром?"
2000205-43 = "Ага. Какие-то проблемы?"
2000205-44 = "Тебя не волнуют калории? Одна миска намного превышает рекомендуемую дневную норму!"
2000205-45 = "Хахаха! И что? С моей самодельной диетической добавкой это ничего не значит!"
2000205-46 = "Ты сама делаешь диетические добавки?"
2000205-47 = "Ага! Выпьешь одну — и не наберёшь ни килограмма, даже после самой жирной еды!"
2000205-48 = "Ух ты... она продаётся? Я заплачу сколько скажешь!"
2000205-49 = "Оставь деньги себе. Возьми и потом скажи, сработало ли."
2000205-50 = "Огромное спасибо! Ты меня спасла!"
2000205-51 = "С этим мы сможем есть сколько угодно жирного и макаронов!"
2000205-52 = "Не терпится попробовать..."
2000205-53 = ""
2000205-54 = ""
2000205-56 = "Хахаха! Мне тоже. С нетерпением жду результатов."
2000205-58 = "Лаборатория Саи"
2000205-59 = ""
2000205-60 = ""
2000205-61 = ""
2000205-63 = ""
2000205-64 = "*задыхаясь* Вот ты где... мошенница!"
2000205-65 = "Ты вообще кто такая, чтобы травить нас этим ядом?!"
2000205-66 = "О? Не сработало? Может, надо было дать вам что-нибудь посильнее..."
2000205-67 = "Нет! Оно работает слишком хорошо!"
2000205-68 = "Мы мгновенно перевариваем всё, что едим... Сколько бы ни съели, всё равно не насыщаемся..."
2000205-69 = "Так мы скоро умрём с голоду..."
2000205-70 = "Но ведь оно работает ровно как обещано! Вы же не набираете вес, правда? Хахаха!"
2000205-71 = "Ах ты... Ты за это заплатишь!"
2000205-72 = "Заплатила бы... если бы у меня были силы..."
2000205-73 = ""
2000205-74 = ""
2000205-75 = ""
2000205-76 = "Хм... А что если для баланса сделать таблетку, от которой набираешь вес каждый раз, когда пьёшь воду?"
