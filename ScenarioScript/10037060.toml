[translation]
10037060-1 = "Эпизод 6;Говорили, что покрытый снегом бамбук согнулся"
10037060-3 = "[ns] «Какой же густой бамбуковый лес...»"
10037060-4 = "Фуфу! Что скажете, Сенсей? Впечатляет, правда?"
10037060-5 = "Будь сейчас подходящий сезон, я могла бы показать вам, как собираю побеги бамбука."
10037060-6 = "Побеги бамбука...?"
10037060-7 = "Да, это молодые ростки бамбука. Они мягкие и нежные и отлично подходят почти к любому блюду."
10037060-8 = "Вполне возможно, вчера их использовали в блюдах Променада Чёрной Черепахи..."
10037060-9 = "Те тонкие жёлтые кусочки, да? Они были такими вкусными!"
10037060-10 = "Да! Побеги бамбука из Шаньхайцзина особенно хорошего качества. Настолько, что говорят: можно есть их целый день и не надоест!"
10037060-12 = "Приятно сегодня прогуливаться вместе с вами, госпожа, в отличие от вчерашнего дня."
10037060-13 = "Да... Я должна извиниться за вчерашнюю невежливость, Великий Вождь Черино."
10037060-14 = "Хм? О чём вы, госпожа Кисаки?"
10037060-15 = "Я о том, что хозяйка встречи по обмену не смогла как следует сопровождать своих дорогих гостей."
10037060-16 = ""
10037060-18 = ""
10037060-20 = ""
10037060-21 = "Г-Госпожа Президент...!"
10037060-23 = "А, так вот о чём речь? Я всё думала, что вы имеете в виду. И вы всё это время об этом переживали?"
10037060-24 = "Раз уж мы заговорили об этом, я тоже хочу кое-что сказать."
10037060-25 = ""
10037060-27 = ""
10037060-28 = ""
10037060-30 = "Я Великий Вождь Красной Зимы! Такие мелочи никогда не смогут угрожать моей власти!"
10037060-31 = ""
10037060-33 = ""
10037060-35 = "Вот почему вы наш Великий лидер!"
10037060-37 = "Э-эм...!"
10037060-38 = "(Я не могу понять её настоящие чувства, но всё равно испытываю облегчение. Великий Вождь Черино, похоже, не НАСТОЛЬКО расстроена.)"
10037060-39 = "Я очень благодарна, что вы отнеслись к этому с таким пониманием. Как вы спали прошлой ночью? Вам не было неудобно?"
10037060-40 = "Никаких проблем, госпожа Кисаки. Было так тепло и уютно! Мне не на что жаловаться."
10037060-41 = "Но там был... какой-то аромат, которого я раньше никогда не чувствовала."
10037060-42 = "Фуфу. Вижу, у председателя Марины хороший нюх. Это лечебные благовония, созданные Обществом Восточной Алхимии Шаньхайцзина."
10037060-43 = "Говорят, они приносят спокойствие и исцеляют сердце и душу... Но интересно, действительно ли они помогли."
10037060-44 = "Х-а? Теперь, когда вы сказали, кажется, помогли... Но я не уверена..."
10037060-45 = "Ну, раз вы проделали весь путь до бамбукового леса, я могу показать вам кое-что хорошее."
10037060-46 = "Кое-что хорошее?"
10037060-48 = "Под этим вы имеете в виду...? О!"
10037060-49 = "Именно. Это особенность бамбукового леса Шаньхайцзина."
10037060-50 = "Ха-ха! Надеюсь, вы готовы. Ещё не было ни одного студента, которому бы это не понравилось!"
10037060-51 = "Пойдём? Я покажу дорогу."
10037060-55 = ""
10037060-56 = "Э-Это...?! Не может быть, это...!"
10037060-57 = "Разве не прекрасно? Разве не удивительно? Разве они не невероятно милые?!"
10037060-58 = ""
10037060-60 = ""
10037060-62 = "Панды!!"
10037060-63 = "О, председатель Марина! Если будете кричать так громко, можете напугать панд..."
10037060-64 = "О, правда?!"
10037060-66 = "Такое возможно, хотя я не уверена, что эти увальни вообще способны вот так взять и убежать."
10037060-67 = "(В день прибытия в Шаньхайцзин я уже видела маленькую панду из тюрьмы, но...)"
10037060-68 = "(Наверное, сейчас не лучший момент об этом упоминать.)"
10037060-69 = "Теперь, когда я вижу их лучше, должна сказать... Для меня это всё равно просто пятнистый медведь."
10037060-70 = "Хм? Вы уже раньше видели панду?"
10037060-71 = "О, да. Ну, знаете, на картинках и всё такое. Председатель Марина обожает всех медведей без исключения!"
10037060-72 = "Фуфу, понятно. Панды действительно относятся к медведям — и ещё они ужасные обжоры по части бамбука!"
10037060-74 = "Если подумать, кажется, бамбук — единственное, что едят панды..."
10037060-75 = "Это правда. Но они едят не любой бамбук. Они привередливы и всегда выбирают один и тот же вид."
10037060-76 = "И весь день они только спят и едят."
10037060-77 = "[s] «Только едят и спят? Потрясающе! Завидую!»"
10037060-78 = "С-Сенсей?"
10037060-79 = "Хм-м... Я чувствую какую-то тьму... Хотя, может, и нет..."
10037060-80 = "Но панды ведь очаровательные, правда?"
10037060-82 = "Именно, госпожа! Просто смотреть на них вот так..."
10037060-83 = ""
10037060-86 = "Ах, будто бальзам на сердце!"
10037060-87 = "Фуфу! Тогда наслаждайтесь сколько хотите. Вижу, они действительно вас успокаивают. Хотите подойти ближе?"
10037060-88 = ""
10037060-90 = ""
10037060-91 = "Можно?!"
10037060-92 = "Да. Мина вас проведёт. Они уже привыкли к людям. Мина, прошу."
10037060-94 = "Да, госпожа Президент."
10037060-95 = ""
10037060-97 = ""
10037060-98 = "Я подойду осторожно."
10037060-99 = "Не забывайте держать безопасную дистанцию. Если подойти слишком близко, это плохо и для вас, и для панды."
10037060-100 = ""
10037060-102 = ""
10037060-103 = ""
10037060-106 = ""
10037060-107 = ""
10037060-110 = "Хорошо, теперь Сенсей..."
10037060-111 = ""
10037060-113 = ""
10037060-114 = "?!?!"
10037060-115 = ""
10037060-119 = "(Что происходит...? Всё моё тело...!)"
10037060-120 = "(Я не могу дышать, так кружится голова. Руки и ноги такие... тяжёлые.)"
10037060-121 = "(Почему это должно было случиться именно сейчас...?)"
10037060-122 = "[ns] «К-Кисаки?! Ты в порядке?!»"
10037060-123 = ""
10037060-128 = "(Голос Сенсея... Он звучит так далеко... Мы далеко друг от друга...?)"
10037060-129 = "(Если нет...)"
10037060-130 = ""
10037060-137 = "...Сенсей. Мне нужно кое-что у вас спросить."
10037060-138 = "Уже... ночь? Так темно."
10037060-139 = "[ns] (...!)"
10037060-141 = "[ns] «...Да. Похоже, солнце село уже некоторое время назад...»"
10037060-143 = "..."
10037060-144 = "...Понятно."
10037060-145 = "..."
10037060-146 = "У меня к вам просьба, Сенсей."
10037060-147 = "Не могли бы вы... позвать сюда президента Общества Восточной Алхимии?"
10037060-149 = "[ns] «Позвать Саю... сюда?»"
10037060-150 = "Да... Сейчас... Это единственный способ разобраться с этой ситуацией..."
10037060-151 = "И... пожалуйста, позаботьтесь о Великом Вожде Черино и группе Красной Зимы..."
10037060-152 = "Отведите их... в Риккагаку... вместе с Миной..."
10037060-153 = "[ns1] «Я обязательно это сделаю.»\n[ns2] «Но... насчёт того, что уже ночь...?»"
10037060-154 = "...Фу-фу..."
10037060-155 = "...Фу-фу..."
10037060-156 = "Сенсей, вы очень добры..."
10037060-157 = "Но... не нужно... поддерживать эту историю ради меня..."
10037060-158 = ""
10037060-162 = ""
10037060-163 = "...Простите. У меня для вас плохие новости, госпожа."
10037060-164 = "(Она уже здесь...?)"
10037060-165 = "Но вы хотели услышать всю правду, поэтому мне остаётся лишь ответить совершенно честно..."
10037060-166 = ""
10037060-169 = "(Нет... Не может быть... Может, я просто вспоминаю тот прошлый раз...)"
10037060-172 = "Надеюсь, вы внимательно меня выслушаете."
10037060-173 = "Отныне каждый день вы сможете нормально двигаться только ограниченное время..."
10037060-174 = "(Да, она точно так сказала...)"
10037060-175 = "На весь Риккагаку этого не хватит, но давайте зажжём лечебные благовония в главной комнате. Это хотя бы немного поможет вам, госпожа."
10037060-176 = "Начиная с завтрашнего дня, вы должны каждое утро принимать этот эликсир бессмертия. Если пропустите хотя бы один день, случится что-то очень плохое."
10037060-177 = "Что ещё? Хм..."
10037060-178 = "Советую каждый день растягиваться... возможно, делать гимнастику. Говорят, корень болезней — плохое кровообращение..."
10037060-179 = "Понятно? Пообещайте мне беречь себя."
10037060-180 = "...Никто в Шаньхайцзине не хочет вот так вас потерять, госпожа..."
10037060-182 = "(Странно.)"
10037060-183 = "(Я была уверена, что сегодня утром приняла эликсир бессмертия...)"
10037060-184 = "(...)"
10037060-185 = ""
10037060-188 = "(Но тогда получается...)"
