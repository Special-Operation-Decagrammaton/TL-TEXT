51220-30 = "[ns] «Им нет конца!»"
51220-31 = "Уф. Мы едва можем прорваться через этих Духов артефактов, не говоря уже о спасении Юкари."
51220-32 = "(Цель прямо перед нами, но всё равно недосягаема. Я не могу... В одиночку я не справлюсь!)"
51220-33 = ""
51220-36 = ""
51220-37 = ""
51220-40 = ""
51220-41 = "Привет-привет! Похоже, мы успели вовремя."
51220-42 = "Это мы, Сенсей."
51220-43 = "[s] «Вот уж кого не ожидал увидеть, но как же я вам рад!»"
51220-44 = "Президент Ния сказала, что мы должны помочь Сенсею."
51220-45 = "[s] «Ния сказала?»"
51220-46 = "Ну, вообще-то мы помогаем вам помочь нам."
51220-47 = "Связь глушат, и мы не смогли дозвониться до Фестивального отдела. Поэтому пришли сами!"
51220-48 = "Ранее мы видели, как кто-то взломал прямую трансляцию..."
51220-49 = "Это она, да? Та, что прислала письмо?"
51220-50 = "[s] «Да. Из „Красоты природы“.»"
51220-51 = "...Как я и думала."
51220-52 = "Улицы Хяккияко превращаются в руины."
51220-53 = "Похоже, я действительно просчиталась. Если бы можно было повернуть время вспять..."
51220-54 = "[s] «Мы оба несём это бремя. Давайте сосредоточимся на том, что можем сделать сейчас.»"
51220-55 = "Как всегда, вы правы, Сенсей. Проклиная судьбу сейчас, прошлое мы не изменим."
51220-56 = "Похоже, после этого нам обоим придётся расплатиться с долгами, Нагуса. Но сейчас над нами нависли куда более серьёзные проблемы."
51220-58 = "А, да."
51220-59 = "Я получила общее представление о ситуации."
51220-60 = "Ябуки Сюро из «Красоты природы» стоит за всем происходящим и именно она взяла вашу Юкари в заложницы. Я что-то упустила?"
51220-61 = "...Нет."
51220-62 = "Нам нужно так или иначе доставить вас к той сцене."
51220-63 = ""
51220-65 = ""
51220-66 = ""
51220-68 = "Спереди, сзади, слева и справа... Чудовища повсюду."
51220-69 = "Как нам с ними сражаться, президент Ния?"
51220-70 = "Мы вдвоём, мягко говоря, не та ударная сила, которая вам нужна..."
51220-71 = "Если мы продержимся до прибытия подкрепления Клуба Инь-Ян — это будет настоящее чудо..."
51220-72 = ""
51220-77 = "...!!"
51220-78 = ""
51220-81 = "[ns] «Нет! Подкрепление нам не нужно!»"
51220-82 = ""
51220-84 = ""
51220-85 = "Хм?"
51220-86 = "Что вы такое говорите—"
51220-87 = ""
51220-91 = "Секретное оружие — взрывные сюрикены! ХИЯ!"
51220-92 = ""
51220-97 = ""
51220-98 = ""
51220-99 = ""
51220-100 = "Ха! Клуб исследования ниндзюцу..."
51220-101 = "...прибыл..."
51220-102 = "...на место! Нин-нин!"
51220-104 = "[ns] «Изуна! Мичиру! Цукуё!»"
51220-105 = "Вы... Клуб исследования ниндзюцу?"
51220-106 = "Здравствуйте, все."
51220-108 = "Ого! Президент Клуба Инь-Ян! И привет, Чисэ!"
51220-109 = "О! Сенсей, вы нашли Нагусу!"
51220-110 = "Вы появились в идеальный момент, хотя я немного в замешательстве."
51220-111 = "Мм? А, вы про то, откуда мы знали?"
51220-113 = "Сенсей попросил Клуб исследования ниндзюцу... помочь!"
51220-114 = "Да! Господин попросил нашей помощи, и будь то дождь, огонь или даже страшные призраки, мы всегда ответим на зов господина!"
51220-115 = "Да! Сквозь дождь и огонь!"
51220-117 = "П-Подождите секунду! Я никогда не соглашалась бежать через огонь или что-нибудь хотя бы отдалённо похожее!"
51220-118 = "Всё нормально! Вы можете всё, президент."
51220-119 = "Вы ведь лучший ниндзя из всех, кого мы знаем...!"
51220-120 = "Н-Ну, если вы так говорите...!"
51220-121 = "Как президент Клуба исследования ниндзюцу заявляю: мы пробежим сквозь огонь, чтобы помочь!"
51220-122 = "Да! Вот наша президент!"
51220-123 = "Эм, ага! Сделаем это!"
51220-124 = "Положитесь на нас, Сенсей!"
51220-125 = "[s] «Вы трое лучшие.»"
51220-127 = "Вот как..."
51220-128 = "Клуб исследования ниндзюцу действительно умеет прийти на помощь, да?"
51220-129 = "Что ж. Ниндзя, откроем путь?"
51220-130 = "Я тоже здесь. Сенсей, пожалуйста, смотрите. Я очень усердно тренировалась."
51220-132 = "Пошли!"
51220-133 = "Клуб исследования ниндзюцу! В атаку!"
