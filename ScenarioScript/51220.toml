[translation]
51220-1 = "Episódio 22;A Cidade Envolta em Chamas"
51220-5 = "[ns] \"Arf... arf... O palco...\""
51220-12 = "Sensei, cuidado...!"
51220-30 = "[ns] \"Parece que eles estão aumentando em número...!\""
51220-31 = "...Desse jeito, não vamos conseguir atravessar os fantasmas do Hyakumonogatari..."
51220-32 = "(Como eu imaginava, eu sozinha não tenho força suficiente... O palco está bem diante dos nossos olhos...! Desse jeito, eu não vou conseguir fazer nada...!)"
51220-41 = "Por um triz. Sensei, você está bem~?"
51220-42 = "Chegamos~"
51220-43 = "[s] \"Niya... Chise?! Por que vocês duas estão aqui...!\""
51220-44 = "A presidente Niya disse para virmos ajudar o Sensei~"
51220-45 = "[s] \"A Niya?\""
51220-46 = "Sim. Para resolver toda essa situação... por assim dizer."
51220-47 = "Não conseguimos contato com o Comitê de Organização de Festivais, então viemos até a cidade conferir pessoalmente, sabe~."
51220-48 = "Também queria verificar aquela invasão de sinal de agora há pouco..."
51220-49 = "Então ela realmente é a responsável pela carta... uma integrante do Clube Beleza da Natureza?"
51220-50 = "[s] \"Sim, parece que sim.\""
51220-51 = "...Hum."
51220-52 = "Foi erro meu. Eu julguei mal a situação...#nDeixar Hyakkiyako chegar a esse estado..."
51220-53 = "Fui imprudente. Dizem que não adianta chorar pelo leite derramado, mas mesmo assim—"
51220-54 = "[s] \"Eu também tenho minha parcela de culpa. Vamos superar isso juntos a partir daqui.\""
51220-55 = "...É verdade, lamentar o passado não vai mudar a situação."
51220-56 = "Vamos deixar o acerto de contas para depois e olhar para frente agora — Nagusa-san."
51220-58 = "Ah... sim."
51220-59 = "Fiz um resumo rápido da situação atual."
51220-60 = "No momento, quem tomou a praça do festival foi Yabuki Shuro, do Clube Beleza da Natureza. E a Yukari-san, do Hyakkaryouran, está sendo mantida como refém... Está certo?"
51220-61 = "...Sim."
51220-62 = "Para salvá-la, precisamos seguir até lá."
51220-68 = "Por todo lado está cheio de monstros~"
51220-69 = "...Presidente, o que a gente faz?"
51220-70 = "Huum... Acho que só comigo vai ser difícil, viu~."
51220-71 = "Mesmo que a gente resista até chegarem os reforços do Clube Yin-Yang, quem sabe o que pode acontecer..."
51220-77 = "... ... ... ...!!!"
51220-81 = "[ns] \"Não, ainda há uma brecha!\""
51220-85 = "Hum...?"
51220-86 = "Sensei, o que exatamente você—"
51220-91 = "Técnica Secreta! Shuriken Explosiva! Haaa!"
51220-100 = "Hehe~ O Clube de Pesquisa Ninjutsu...!"
51220-101 = "Acaba de...!"
51220-102 = "Entrar em cena! Nin-nin!"
51220-104 = "[ns] \"Izuna! Michiru! Tsukuyo...!\""
51220-105 = "Vocês são... do Clube de Pesquisa Ninjutsu?"
51220-106 = "Oiê, pessoal~"
51220-108 = "Uau! A presidente do Clube Yin-Yang e a Chise-sama...?!"
51220-109 = "Espera, quem está ali é a Nagusa?!"
51220-110 = "Por que todas vocês estão aqui...?"
51220-111 = "Hum? Bem, é que—"
51220-113 = "O Sensei nos procurou pedindo ajuda...!"
51220-114 = "Sim! Se for para ajudar o Mestre, todo o Clube de Pesquisa Ninjutsu#nestá pronto para correr até qualquer lugar, seja no fogo ou na água! Nin-nin!"
51220-115 = "Sim...! É exatamente como a Izuna-chan disse!"
51220-117 = "Não, não, não?! Por mais que a gente queira, no meio do fogo já é um pouco demais, né?!"
51220-118 = "Vai ficar tudo bem, você consegue, Presidente...!"
51220-119 = "Afinal de contas, você é a nossa Presidente...!"
51220-120 = "Ugh... Falando desse jeito, não tenho escolha, né...!"
51220-121 = "É claro que, como presidente do Clube de Pesquisa Ninjutsu, estou mais do que preparada!#nVamos mostrar do que somos capazes!"
51220-122 = "Sim! Essa é a nossa Presidente...!"
51220-123 = "Hmph!! Então eu também vou dar o meu melhor!"
51220-124 = "Beleza! Pode ficar tranquilo e deixar tudo com a gente, Sensei-dono!"
51220-125 = "[s] \"Pessoal... obrigado!\""
51220-127 = "Não esperava menos do pessoal do Clube de Pesquisa Ninjutsu..."
51220-128 = "Sempre tão confiáveis, hein~."
51220-129 = "...Pois bem, vamos lá?#nNós abriremos o caminho."
51220-130 = "Deixa comigo~#nVou mostrar o resultado do meu treino."
51220-132 = "Então vamos lá!"
51220-133 = "Clube de Pesquisa Ninjutsu, avançaar!"
51220-143 = "...Sim!"
