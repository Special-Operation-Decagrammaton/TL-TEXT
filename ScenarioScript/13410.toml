[translation]
13410-1 = "Эпизод 41;Что остаётся после"
13410-3 = "Одна из средних школ Абидоса"
13410-4 = "Вы видели объявление? Назвали дату закрытия школы."
13410-5 = "...И что тогда будет с нами?"
13410-6 = "Ну, у нас уже даже старшей школы, куда можно поступить, не останется. Нужно делать как все остальные. Уезжать."
13410-7 = "Но..."
13410-8 = "Говорят, даже студсовет распустили. Старшей школе Абидоса конец. Всему району конец."
13410-9 = "Даже Нефтис сбежала! Эта жадная корпорация о нас заботиться не станет."
13410-10 = "А их дочь? Она же сказала, что останется до выпуска?"
13410-11 = "Она просто хотела тебя успокоить! Какая дура останется? Уж точно не наследница какой-то модной корпорации!"
13410-12 = "Я её уже сто лет в школьных коридорах не видела! Нужно скорее выбираться отсюда, пока ещё можем."
13410-17 = ""
13410-18 = ""
13410-19 = "Солнце... встаёт?"
13410-20 = "Как? Мне ведь ещё нужно..."
13410-21 = "Чёрт... Что я вообще..."
13410-22 = "...пыталась доказать?"
13410-23 = ""
13410-25 = ""
13410-26 = ""
13410-27 = ""
13410-29 = "Надзиратель? Ау-у? Ты куда делась?!"
13410-30 = "Не убегай... Суо!"
13410-33 = "Что, чёрт возьми, произошло?!"
13410-35 = "Почему глава Дисциплинарного комитета в Абидосе?! Ей сейчас оказывают медицинскую помощь? Насколько она вообще ранена?!"
13410-36 = "[s] «Ако... Успокойся хоть на секунду...»"
13410-37 = "Успокоиться?! В такой ситуации? И ещё вы исчезли из больницы, Сенсей! Вы вообще в порядке?!"
13410-38 = "[s1] «Смотри, со мной всё совершенно нормально.»\n[s2] «Я даже не был ранен. Просто переутомился из-за работы.»"
13410-39 = ""
13410-41 = ""
13410-43 = ""
13410-44 = "*вздох* Ну, глава Дисциплинарного комитета действительно рассказала мне о ситуации... Хотя это совсем не похоже на «личное дело», как она утверждала..."
13410-45 = "Не ожидала, что именно вы стояли за этой просьбой, Сенсей."
13410-46 = "Когда вы вообще успели связаться с главой Дисциплинарного комитета?"
13410-47 = "[ns] «Ну...»"
13410-52 = "[ns3] Закончить систематизировать данные, собранные за ночь.\n[ns4] «В целом я понимаю, что делать. Дальше...»"
13410-53 = ""
13410-54 = ""
13410-57 = ""
13410-58 = "Всё ещё наготове. Могу чем-нибудь помочь, Сенсей [USERNAME]?"
13410-59 = "[s] «А, спасибо, Плана. А где Арона?»"
13410-60 = "Арона спит. Её можно назвать «соней». Поэтому можете просто рассчитывать на меня, более прилежную."
13410-61 = "[s5] «Спасибо. Тогда... если не возражаешь...»\n[s6] Передать задачу Плане."
13410-62 = ""
13410-63 = ""
13410-64 = ""
13410-65 = "[ns] «Пушка, скорее всего, связана с Геенной. Нужно попросить у Хины больше информации.»"
13410-66 = ""
13410-67 = "Простая задача. Поняла. Считайте, уже выполнено."
13410-70 = "В любом случае никуда не двигайтесь! Я уже еду!"
13410-71 = "...А?"
13410-72 = ""
13410-74 = ""
13410-75 = "Глава Дисциплинарного комитета только что написала мне...#n«Я уже возвращаюсь, так что не нужно ехать сюда».#nОткуда она узнала?!"
13410-76 = "Мне нужно подготовиться... Мы с вами ещё поговорим позже, Сенсей!"
13410-77 = ""
13410-79 = ""
13410-80 = "[ns] «...Хм.»"
13410-82 = ""
13410-83 = "О, Сенсей? Вы всё это время были здесь?"
13410-84 = "[s] «С возвращением, Нономи.»"
13410-85 = "Да, я ненадолго ходила в прачечную! Не можем же мы вечно ходить в спортивных костюмах! ♧"
13410-86 = "Заодно постирала одежду главы Дисциплинарного комитета... Надеюсь, она не решит, что я зашла слишком далеко?"
13410-87 = "[s] «Конечно нет.»"
13410-88 = "...Ага-ага. Она производит определённое впечатление, но в этот раз действительно очень старалась ради всех нас."
13410-89 = "Ну что же, пойдёмте, Сенсей! У нас собрание!"
13410-90 = "[s] Пойти в класс вместе с Нономи."
13410-91 = ""
13410-95 = "Та-дам! Все, забирайте одежду!"
13410-96 = "Спасибо, Нономи."
13410-97 = "Ах... Прости за хлопоты, Нономи."
13410-98 = "Не извиняйся, Аяне! Такие мелочи одному человеку всё равно проще сделать разом!"
13410-99 = "И вообще, не вижу ничего плохого в том, чтобы стирать всем вместе. ♧"
13410-100 = "Она права! И деньги экономим!"
13410-101 = "Хм? Кстати, а где Хошино?"
13410-102 = "В медпункте. Кажется, хотела поговорить с главой Дисциплинарного комитета."
13410-103 = ""
13410-105 = ""
13410-106 = "Посмотрим. Мои гетры! А это бельё... Широко, твоё, да? Держи."
13410-107 = "Э-Эм."
13410-108 = "А? Ну же, бери бельё, Широко. Чего смотришь?"
13410-109 = "А...?"
13410-110 = ""
13410-112 = ""
13410-113 = "[ns] «...»"
13410-114 = "Ч-Что вы делаете, Сенсей?! Зачем пытаетесь подглядывать за бельём старшеклассниц?!"
13410-115 = "[s] «Нет, всё совсем не так...»"
13410-116 = "У вас вообще никакого чувства такта! Посмотрите, как Широко смутилась! Отвернитесь!"
13410-117 = "Нет... Я не..."
13410-118 = ""
13410-120 = ""
13410-121 = "Тогда почему бы вам не сходить за Хошино и главой Дисциплинарного комитета в медпункт, Сенсей?"
13410-122 = "Да! Уходите отсюда, Сенсей! Быстрее!"
13410-123 = "[s] «Я правда ни в чём не виноват...»"
13410-128 = "[ns7] «Хина? Хошино?»\n[ns8] «Вы где?»"
13410-131 = ""
13410-133 = "...Здесь, Сенсей."
13410-141 = "..."
13410-142 = "[s] «Хм...»"
13410-143 = "Таканаши Хошино уснула... Я не могу пошевелиться."
13410-144 = "[s] «Хмм...»"
13410-145 = "Эм, Сенсей... Мне скоро нужно возвращаться. Не могли бы вы помочь...?"
13410-146 = "[s] «Хммм...»"
13410-147 = "Хватит издавать странные звуки и помогите мне!"
13410-148 = ""
13410-151 = "Я разбудил Хошино и снял её с Хины."
13410-153 = "Все собрались?"
13410-154 = "Да!"
13410-155 = "Угу."
13410-156 = "Ага-ага! Все здесь. ♧"
13410-157 = "*зевок*"
13410-158 = "Ты не собираешься переодеваться, Хошино?"
13410-159 = "Не обращай внимания. Иногда в жизни нужно расслабляться."
13410-160 = "Хм? А где глава Дисциплинарного... то есть Хина?"
13410-161 = "Глава Дисциплинарного комитета уже вернулась в Геенну."
13410-162 = "А? Уже?"
13410-163 = "Да. Она собралась и ушла ещё до того, как ты успела переодеться в школьную форму."
13410-164 = "В отличие от некоторых, Хина очень прилежная, да?"
13410-165 = "Хех. Даже попрощаться не дала."
13410-167 = "...Прошу простить за столь внезапный уход."
13410-168 = "Хошино всё ещё просыпается... Уверена—"
13410-169 = "Нет, меня будут ждать. Особенно после того, как я ушла одна."
13410-170 = "Прощания оставим на следующий раз. Вопрос с Железнодорожной пушкой всё ещё требует решения."
13410-171 = "Мы ещё встретимся и обсудим подробности."
13410-172 = "Эм..."
13410-173 = ""
13410-175 = ""
13410-177 = "Спасибо вам за помощь, глава Дисциплинарного комитета!"
13410-179 = "Да! Спасибо! Без вас мы бы не смогли остановить Хошино."
13410-180 = "Да. Мы у вас в долгу."
13410-181 = "В следующий раз расскажите подробнее о вашей грандиозной битве с Хошино!"
13410-182 = "Да. Нам всем интересно услышать больше."
13410-183 = ""
13410-185 = ""
13410-186 = ""
13410-187 = "[ns] «Спасибо, Хина. В следующий раз я отплачу за помощь.»"
13410-188 = ""
13410-189 = "...Уже поздно."
13410-190 = "До встречи, Комитет по выплате долга."
13410-191 = ""
13410-193 = ""
13410-195 = "Что? И она просто вот так ушла?"
13410-196 = "А! Она ещё сказала, что постирает твой спортивный костюм и пришлёт обратно."
13410-197 = "А?! Она его забрала?!"
13410-198 = "Ну, твой костюм был единственным её размера..."
13410-199 = "Думаешь, она и бельё моё постирает? Я дала ей одолжить комплект..."
13410-200 = "Э-Эй, не говори такое вслух! Сама у неё спроси!"
13410-201 = "Но у меня нет её номера... а эта старушка очень стеснительная, знаешь ли..."
13410-202 = "Тогда попроси номер у Сенсея! Уф! И что это за новый образ у тебя?"
13410-203 = "Хм... Ну..."
13410-204 = "Вот твоя форма, Хошино. Пожалуйста, переоденься, чтобы мы могли начать собрание!"
13410-205 = "Этой старушке и так нормально..."
13410-207 = "Мы сейчас в спортзале? Или ты дед, который в выходной лежит перед телевизором и чешет живот?!"
13410-208 = "*зевает* Ну, если настаиваешь..."
13410-209 = ""
13410-211 = ""
13410-212 = ""
13410-216 = "Хорошо, начинаем ежедневное собрание Комитета по выплате долга Абидоса, также известного как студсовет Абидоса — сокращённо Комитет по выплате долга!"
13410-217 = "Для начала—"
13410-218 = "Постой. Я хочу кое-что сказать."
13410-219 = "...А? Хошино?"
13410-220 = "Что-то сказать?"
13410-221 = "Что такое?"
13410-222 = "Только не говори опять какую-нибудь странность."
13410-223 = "Кхм..."
13410-224 = "Нономи, Широко, Аяне, Серика... и Сенсей."
13410-225 = "Насчёт всего, что произошло за последние несколько дней..."
13410-226 = "Э-Эм... В общем..."
13410-227 = ""
13410-229 = ""
13410-230 = ""
13410-231 = "Эм... Ну... В общем..."
13410-232 = "Думаю... я реально облажалась..."
13410-233 = "А? Ты что-то сказала? Ничего не слышно. Ты слышала её, Широко?"
13410-234 = "Нет. Ничего не слышала."
13410-235 = "...!"
13410-236 = "Хм... Да. Я тоже тебя не слышала, Хошино."
13410-237 = "[s] «Говори громко и с гордостью, Хошино.»"
13410-238 = "И вы туда же, Сенсей?"
13410-239 = "Ну... Эм..."
13410-240 = ""
13410-242 = ""
13410-243 = "Мне правда очень жаль! За всё! Вдвойне!"
13410-244 = "Оглядываясь назад, даже я сама не могу объяснить, зачем делала всё это, но..."
13410-245 = "Но... я правда всё испортила. Заставила вас переживать... создала кучу проблем... эм..."
13410-246 = ""
13410-248 = ""
13410-249 = "Да. Очень много."
13410-250 = "Но всё же хорошо закончилось, правда?"
13410-251 = "Я просто рада, что ты вернулась, Хошино."
13410-252 = "Ага. Именно."
13410-253 = "Да... Я плохо помню, что именно произошло, но одну вещь запомнила очень хорошо."
13410-254 = "Ваши голоса."
13410-256 = ""
13410-257 = ""
13410-259 = ""
13410-261 = "...И один голос я слышала особенно отчётливо."
13410-262 = "Серики! Когда она обещала мне дебютировать айдолом вместе с Аяне!"
13410-263 = "Серьёзно?"
13410-264 = "Айдолом?"
13410-265 = "Ч-Что?! А?"
13410-266 = "Ч-Что ты сейчас вообще говоришь?!"
13410-267 = "Но я тебя слышала, Сэрика! Ты что, теперь собираешься отказаться от обещания? Серьёзно? Притворишься, будто ничего не было?"
13410-268 = "Я-я действительно это сказала, но...! Это был порыв! Чистый порыв!"
13410-269 = "Сэрика?!"
13410-270 = "У нас вариантов не осталось, ясно?!"
13410-271 = "Хех. А эта старушка теперь думает, что не сможет спокойно умереть, пока не увидит это своими глазами."
13410-273 = "Ты ведь не собираешься сказать что-нибудь вроде: «Прости, это слишком. Забудь, что я вообще такое говорила», да?"
13410-274 = "Это слишком, слишком много! Хотя... наверное, не совсем невозможно..."
13410-275 = "Ага-ага! Значит, вы двое дебютируете, как только появится подходящая возможность, хорошо?! Я буду вашим продюсером! ♧"
13410-276 = "Айдол... Что...?"
13410-277 = "*шёпотом* Всё нормально. Просто подыгрывай. Такая «возможность» бывает раз на миллион."
13410-278 = "*шёпотом* Сэрика..."
13410-279 = ""
13410-281 = ""
13410-283 = "Не переживайте. Возможности в жизни нужно создавать самим. Я всё организую."
13410-284 = "Умоляю тебя, Широко. Пожалуйста, сбавь энтузиазм..."
13410-291 = ""
13410-292 = ""
13410-293 = ""
13410-294 = ""
13410-295 = ""
13410-296 = ""
13410-297 = "Хошино. Когда будешь готова... расскажешь нам больше о председателе Юмэ?"
13410-298 = ""
13410-300 = ""
13410-301 = "Да! Я тоже хочу послушать."
13410-302 = "Ха-ха... Я тоже."
13410-303 = "Ага-ага! Расскажи нам всё!"
13410-304 = "Хм... Вот как? Хотите услышать все захватывающие приключения моей юности?"
13410-305 = "Тогда... лучше всего начать, конечно, с того раза, когда мы отправились к Великому оазису в одних купальниках."
13410-306 = "Что?! В купальниках? Зачем?! Как?!"
13410-307 = "Хех-хех. На самом деле этому есть невероятное объяснение..."
13410-311 = "[ns] «Теперь ты в порядке, Хошино?»"
13410-312 = "..."
13410-313 = "Я не в порядке... но я в порядке."
13410-316 = "Как... ты, Хошино?"
13410-317 = "Нелегко жить, неся такую боль."
13410-318 = "Угу. Тяжело. Я виню себя каждый день. От сожалений трудно отбиваться. Тьма всегда где-то рядом, на самом краю."
13410-319 = "Но несмотря на всё это, были люди, которые протягивали мне руки в эту тьму. Они не отступали, день за днём. Ради такой, как я."
13410-320 = "Теперь я могу быть благодарна даже этой боли, потому что благодаря ей встретила Нономи, Широко, Аяне, Серику... и даже другую Широко. Я встретила своих милых младших."
13410-321 = "Так что... эта боль и это счастье теперь одинаково являются частью моей жизни."
13410-322 = "Ну..."
13410-323 = "Я не могу позволить боли остановить меня здесь. Нужно идти дальше."
13410-326 = "А как же всё дорогое, что ты потеряла?"
13410-327 = ""
13410-331 = "Можно ли... это отпустить?"
13410-332 = ""
13410-334 = "Нет, Широко. Нельзя. Потому что это тоже часть меня."
13410-335 = "Но если обеими руками я буду цепляться за эту боль..."
13410-336 = "...то не смогу схватиться за руки тех, кто тянется ко мне."
13410-337 = ""
13410-343 = "Ну..."
13410-344 = "Так что, наверное..."
13410-354 = "Всё... Конец... Это место... обречено..."
13410-355 = "Ничего не имеет смысла... Как я вообще мог надеяться обрести просветление... в этой помойной яме...?"
13410-356 = "Меня забросило не туда... Этот... этот мир..."
13410-357 = "...совершенно не подходит ни мне, ни Гематрии!!"
13410-358 = ""
13410-361 = "Гематрии, говоришь?"
13410-362 = "...!"
13410-363 = ""
13410-370 = "И-и-и-ик?! Б-Б-Бог смерти...?! К-Как ты здесь оказался...?!"
13410-371 = "Я думала, что уничтожила все следы Гематрии до последнего. Но похоже, один выжил."
13410-372 = "Ч-Ч-Что это за загадочный свет? Эта неизвестная сила...? Ты можешь меня отследить?"
13410-373 = "Ч-Что они натворили...? Какое чудовище они пригласили в этот мир...?"
13410-374 = "Ты ищешь истину смерти, верно? Позволь лично просветить тебя, Гематрия. Не возражаешь?"
13410-375 = "И-Ик?!"
13410-376 = "Что может быть лучше для обучения, чем личный опыт?"
13410-377 = ""
13410-379 = "Н-Нет...! Нет!! Это...!"
13410-380 = "Это...!!"
13410-381 = ""
13410-383 = "...Я тебя не убью."
13410-384 = "Я пришла с намерением уничтожить тебя, но пощажу."
13410-385 = "Прочь. Ползи обратно в свой подземный мир."
13410-386 = "Никогда не пытайся вернуться."
13410-387 = "Никогда не забывай: в Абидосе таится бог смерти и ждёт тебя, Подземный житель."
13410-388 = ""
13410-398 = "...больно..."
13410-399 = "...больно... Мне больно... Ах..."
13410-402 = "Больно... Больно..."
13410-403 = "...Больно..."
13410-404 = ""
13410-408 = "Подтверждаю. Связь Подземного жителя с этим миром разорвана."
13410-409 = "Да. Он больше никогда-никогда сюда не вернётся, Сенсей."
13410-410 = "[s] «Хорошая работа, Арона, Плана.»"
13410-411 = "Хрома, с которой мы тогда столкнулись, полностью исчерпана. Использовать эту силу больше никогда не понадобится."
13410-412 = "Но... другая Широко..."
13410-413 = "Подтверждаю. Устанавливаю соединение с Сунаоками Широко..."
13410-414 = "..."
13410-415 = "Плана...?"
