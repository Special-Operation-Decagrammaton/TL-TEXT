[translation]
13410-1 = "Episódio 41;O Que Ficou para Trás"
13410-3 = "Uma escola de ensino fundamental em Abydos"
13410-4 = "Ei, você viu?#nParece que decidiram fechar a escola."
13410-5 = "...O que vai ser da gente?"
13410-6 = "Acho que só resta ir embora, né?"
13410-7 = "Mas ainda tem o Colégio Abydos..."
13410-8 = "Dizem que o conselho estudantil de lá também foi dissolvido.#nO Distrito Autônomo inteiro já era."
13410-9 = "Afinal, até a Nephthys foi embora."
13410-10 = "Mas dizem que a herdeira de lá vai ficar até se formar..."
13410-11 = "Você lembra de já ter visto ela na escola alguma vez?"
13410-12 = "Já tá na hora de pensar em outro caminho, né."
13410-19 = "...Já é hora do sol nascer?"
13410-20 = "Tsc..."
13410-21 = "Eu ainda não fiz nada...#nNão, o que foi que..."
13410-22 = "O que será que eu queria provar...?"
13410-29 = "Oiii, supervisoraaa?"
13410-30 = "Cadê vocêêê?"
13410-33 = "O que diabos aconteceu aí?!"
13410-35 = "Por que a Chefe está em Abydos?!#nE ainda por cima em tratamento?!"
13410-36 = "[s] \"Ako, primeiro se acalma...\""
13410-37 = "Como eu poderia ficar calma?!#nAliás, você também está bem, Sensei?!#nEu soube que fugiu do hospital!"
13410-38 = "[s1] \"Eu estou bem.\"\n[s2] \"Acho que era só cansaço acumulado.\""
13410-44 = "Haah... A Chefe tinha me avisado antes,#nmas eu não imaginava que a situação estaria assim."
13410-45 = "...E ainda por cima, você pediu ajuda a ela."
13410-46 = "Quando foi que entrou em contato com a Chefe?"
13410-47 = "[ns] \"Bem...\""
13410-52 = "[ns3] Organizar os documentos reunidos.\n[ns4] \"...Acho que com isso está tudo pronto.\""
13410-58 = "Em espera. Sensei, precisa de alguma coisa?"
13410-59 = "[s] \"Obrigado, Plana. E a Arona?\""
13410-60 = "A Arona-senpai está dormindo. É uma dorminhoca.#nSe houver algum trabalho, por favor, ordene a mim."
13410-61 = "[s5] \"Nesse caso...\"\n[s6] Pedir alguns favores à Plana."
13410-65 = "[ns] \"Parece que Gehenna está envolvida no Canhão Ferroviário, então pode entrar em contato com a Hina?\""
13410-67 = "Compreendido. Processarei imediatamente."
13410-70 = "Enfim, fique esperando exatamente aí, entendeu?!"
13410-71 = "Eu também estou indo para aí agora mesmo!"
13410-75 = "Você mesma vai vir...?#nC-Chefe, por favor, não se esforce demais!"
13410-76 = "Só fique esperando aí!#nSensei, entrarei em contato novamente!"
13410-80 = "[ns] \"...Como é que eu vou pedir desculpas?\""
13410-83 = "Ora, Sensei.#nEntão você estava aqui."
13410-84 = "[s] \"E você, Nonomi, onde estava?\""
13410-85 = "Na lavanderia!#nAfinal, não dá pra ficar com essa roupa pra sempre ☆"
13410-86 = "Aproveitei e lavei as roupas da Chefe do Comitê Disciplinar também...#nSerá que tem problema?"
13410-87 = "[s] \"Acho que não tem problema.\""
13410-88 = "...Verdade, né?#nEla parece ser muito mais gentil do que dizem os boatos."
13410-89 = "A reunião já vai começar, vamos indo, Sensei?"
13410-90 = "[s] Entrar na sala com a Nonomi."
13410-95 = "Roupas bem fofinhas chegando~!"
13410-96 = "Nn... obrigada, Nonomi."
13410-97 = "Desculpe o incômodo, Nonomi-senpai."
13410-98 = "Imagina! Era só colocar as roupas e apertar o botão ☆"
13410-99 = "Além disso, essa quantidade eu consigo carregar sozinha."
13410-100 = "Bom, pra gente é uma mão na roda."
13410-101 = "Ué, falando nisso, cadê a Hoshino-senpai...?"
13410-102 = "Ela foi para a enfermaria.#nProvavelmente a Chefe do Comitê Disciplinar também está lá."
13410-106 = "Hum... essa é minha... e essa aqui é da Shiroko-senpai, né?#nToma, pode levar."
13410-107 = "S-Sim."
13410-108 = "O que foi, senpai?"
13410-109 = "Ah..."
13410-113 = "[ns] \"........................\""
13410-114 = "Ei, Sensei?!#nPor que você tá encarando a roupa das alunas?!"
13410-115 = "[s] \"O quê? Eu não fiz nada...\""
13410-116 = "Você não tem um pingo de noção mesmo!#nOlha só, a Shiroko-senpai tá ficando com vergonha!"
13410-117 = "Não, nem tô..."
13410-121 = "Ah, Sensei...#nSe não se importar, poderia ir chamar a Hoshino-senpai e a Hina?"
13410-122 = "Anda logo, sai daqui!#nVamos, xô, xô!"
13410-123 = "[s] \"Eu me declaro inocente...\""
13410-128 = "[ns7] \"Hina, Hoshino.\"\n[ns8] \"Posso entrar?\""
13410-133 = "...Pode sim, Sensei."
13410-141 = "..."
13410-142 = "[s] \"Hum...\""
13410-143 = "A Hoshino Takanashi acabou dormindo, então não consigo me mexer."
13410-144 = "[s] \"Hmm...\""
13410-145 = "A Ako está esperando por mim, então já queria ir embora..."
13410-146 = "[s] \"...Parece até um desperdício.\""
13410-147 = "Ah, para com isso e me ajuda logo...!"
13410-151 = "Para ajudar a Hina em apuros, acordei a Hoshino."
13410-153 = "Pessoal, estão todas prontas?"
13410-154 = "Claro!"
13410-155 = "Nn."
13410-156 = "Sim, sim. Está todo mundo aqui ☆"
13410-157 = "Fuaaah..."
13410-158 = "Aliás, Hoshino-senpai, você pretende ficar com essa roupa o tempo todo?"
13410-159 = "Aham, dá muita preguiça de trocar~"
13410-160 = "Ué, cadê a Hina-chan?"
13410-161 = "A Chefe do Comitê Disciplinar voltou para Gehenna há pouco."
13410-162 = "Quê, já?"
13410-163 = "Quando a gente viu, ela já tinha ido."
13410-164 = "Diferente de certa pessoa, foi super ágil e decidida!"
13410-165 = "Entendi... acabei perdendo a chance de agradecer direito."
13410-167 = "...Obrigada por tudo."
13410-168 = "A Hoshino-senpai ainda está..."
13410-169 = "Acho que todas estão esperando."
13410-170 = "Vou voltar em breve para investigar sobre o Canhão Ferroviário."
13410-171 = "A gente pode se despedir direito nessa hora."
13410-172 = "Com licença..."
13410-177 = "Muito obrigada por ter nos ajudado."
13410-179 = "Se a Chefe do Comitê Disciplinar não estivesse lá, não teríamos conseguido parar a Hoshino-senpai."
13410-180 = "Nn, salvou a gente."
13410-181 = "Da próxima vez, me conta como foi lutar contra a Hoshino-senpai."
13410-182 = "Eu também quero saber."
13410-187 = "[ns] \"Da minha parte também... obrigado, Hina.\""
13410-189 = "...Já vou indo."
13410-190 = "Até a próxima."
13410-195 = "Ela foi embora assim, tão rapidinho."
13410-196 = "Ah... ela disse que vai lavar a sua roupa e devolver depois, Hoshino-senpai."
13410-197 = "Nem precisava, podia ter devolvido do jeito que tava."
13410-198 = "Ela é mesmo uma pessoa muito certinha."
13410-199 = "Será que ela também vai lavar e devolver a roupa íntima~?"
13410-200 = "Ah, pergunta isso direto pra ela, vai..."
13410-201 = "Na verdade, mesmo que eu quisesse pedir de volta, não tenho o contato dela."
13410-202 = "É só perguntar pro Sensei, você só tá com preguiça!"
13410-203 = "...Uhee~"
13410-204 = "Por enquanto, por favor, vá se trocar antes de começarmos a reunião."
13410-205 = "O velhote aqui tá bem assim mesmo..."
13410-207 = "Sério, você parece um tiozão largado na sala no fim de semana!"
13410-208 = "Fuaaah... fazer o quê, né."
13410-216 = "Então, vamos dar início à reunião regular do \"Comitê de Contramedidas\",#nque é tanto o Comitê de Contramedidas contra o Fechamento quanto o Conselho Estudantil de Abydos!"
13410-217 = "A primeira pauta é..."
13410-218 = "Espera, Ayane-chan... eu tenho uma coisa pra falar pra todo mundo."
13410-219 = "...Hoshino-senpai?"
13410-220 = "Falar...?"
13410-221 = "Aconteceu alguma coisa?"
13410-222 = "Se vier com papo esquisito de novo, dessa vez não vou deixar barato, senpai."
13410-223 = "Cof, cof..."
13410-224 = "Nonomi-chan, Shiroko-chan, Ayane-chan, Serika-chan... e Sensei."
13410-225 = "Achei que devia dizer isso direito, mais uma vez..."
13410-226 = "É que..."
13410-231 = "Bem..."
13410-232 = "...Desculpa, pessoal."
13410-233 = "Ora, não consegui ouvir direito.#nVocê também não, né, Shiroko-chan?"
13410-234 = "Nn, não ouvi nada."
13410-235 = "...!"
13410-236 = "Ei, Hoshino-senpai.#nEu também não ouvi nada, viu."
13410-237 = "[s] \"Eu também não ouvi muito bem~\""
13410-238 = "Até você, Sensei..."
13410-239 = "Então..."
13410-243 = "...Desculpa mesmo, pessoal!#nNão só uma, mas duas vezes...!"
13410-244 = "Saí correndo sozinha de novo..."
13410-245 = "...Dei trabalho e preocupei vocês, né."
13410-249 = "...É verdade."
13410-250 = "Mas você voltou pra gente, não voltou?!"
13410-251 = "Nn, que bom que voltou."
13410-252 = "Sim, isso mesmo."
13410-253 = "Na verdade, minhas memórias estão meio nebulosas..."
13410-254 = "...Mas no meio da escuridão, eu ouvi a voz de vocês."
13410-261 = "Que a Ayane-chan e a Serika-chan—"
13410-262 = "Vão estrear como idols!"
13410-263 = "Hã?"
13410-264 = "Idols?"
13410-265 = "Quêêê?!"
13410-266 = "O-O que você tá falando?!"
13410-267 = "Ora~, a Serika-chan não vai quebrar a promessa, vai?"
13410-268 = "A-Aquilo foi... eu só falei no calor do momento!"
13410-269 = "Serika-chan?!"
13410-270 = "Ué, não tinha outro jeito!"
13410-271 = "Uhee~"
13410-273 = "Não vem dizer agora que não vai fazer, hein~?"
13410-274 = "Não, não, não..."
13410-275 = "Podem deixar o cargo de produtora comigo ☆"
13410-276 = "Virar idol..."
13410-277 = "Relaxa, não tem como a gente fazer isso de verdade."
13410-278 = "V-Verdade, né, Serika-chan."
13410-283 = "Eu vou fazer isso acontecer."
13410-284 = "Pelo amor de Deus, Shiroko-senpai, fica quieta..."
13410-297 = "...Hoshino-senpai.#nAlgum dia, me conta sobre a Presidente Yume."
13410-301 = "É, eu também quero ouvir."
13410-302 = "Eu também, por favor."
13410-303 = "Sim, sim, eu quero ouvir!"
13410-304 = "Opa, sério~?#nEntão todo mundo quer ouvir as aventuras de tirar o fôlego do velhote aqui, né?"
13410-305 = "Então, primeiro vou contar de quando a gente explorou o Grande Oásis de maiô."
13410-306 = "Hã? Por que de maiô?!"
13410-307 = "Fufufu, na verdade tem um segredo nisso—"
13410-311 = "[ns] \"Hoshino, você já está bem?\""
13410-312 = "..."
13410-313 = "Não é bem \"estar bem\"."
13410-316 = "Hoshino-senpai..."
13410-317 = "Viver carregando essa dor é difícil, né?"
13410-318 = "...Todo santo dia eu fico me arrependendo de novo e de novo."
13410-319 = "Mas havia garotas que estenderam a mão pra mim."
13410-320 = "Graças àquele tempo,#npude conhecer a Nonomi-chan, a Shiroko-chan, a Ayane-chan, a Serika-chan...#ne também a outra Shiroko-chan."
13410-321 = "...Tanto essa dor quanto essa felicidade são coisas preciosas na minha vida."
13410-322 = "Por isso..."
13410-323 = "Em vez de ficar parada sofrendo e me arrependendo... eu devo seguir em frente."
13410-326 = "...Mesmo que o que você perdeu de precioso não volte?"
13410-331 = "Tudo bem abrir mão disso?"
13410-334 = "Acho que não precisa abrir mão."
13410-335 = "Mas se ficar olhando pra trás pra sempre..."
13410-336 = "Não dá pra segurar as mãos que todo mundo estendeu pra você, né?"
13410-343 = "...Então, sabe."
13410-344 = "Então, com certeza..."
13410-354 = "Acabou... Já era, acabou."
13410-355 = "Jamais imaginei que terminaria assim..."
13410-356 = "Eu fui apenas jogado no lugar errado..."
13410-357 = "...Um mundo como este não é digno de mim, membro da Gematria."
13410-361 = "Gematria."
13410-362 = "...!"
13410-370 = "Iih, IIIIIIH?!#nPor que o Deus da Morte está aqui...?!"
13410-371 = "Eu achei que tinha derrotado todos da Gematria, mas ainda restava um."
13410-372 = "Essa luz... por acaso me rastreou até aqui?"
13410-373 = "O que aqueles seres fizeram...?#nQue tipo de existência eles trouxeram para este mundo...!"
13410-374 = "Se você busca os segredos da morte, eu te ajudo."
13410-375 = "IIH, IIIIIIH—?!"
13410-376 = "Se experimentar por conta própria, vai entender na hora."
13410-379 = "N-Não! Pare com isso!"
13410-380 = "Tudo menos isso...!"
13410-383 = "...Não vou te matar."
13410-384 = "Por hoje, vou te deixar ir."
13410-385 = "Então suma logo.#nVolte para o seu subterrâneo— e nunca mais apareça."
13410-386 = "Mas... jamais se esqueça."
13410-387 = "Da existência do \"Deus da Morte\"... que está em Abydos."
13410-398 = "...Que agonia."
13410-399 = "Iiih... que agonia, que agonia."
13410-402 = "Que agonia... que agonia..."
13410-403 = "Que agonia..."
13410-408 = "Confirmado.#nA conexão com o Morador do Subterrâneo foi completamente encerrada."
13410-409 = "Com isso, ele não deve conseguir voltar nunca mais."
13410-410 = "[s] \"Bom trabalho, vocês duas.\""
13410-411 = "Há pouco, o poder do \"Chroma\" também deixou de ser detectado."
13410-412 = "Porém, a outra Shiroko-san—"
13410-413 = "—Confirmado.#nA conexão com a Shiroko Sunaookami-san..."
13410-414 = "..."
13410-415 = "Plana-chan...?"
13410-417 = "...Foi desconectada."
13410-418 = "Hã?!"
13410-419 = "[s] \"O que aconteceu?!\""
13410-420 = "...É que foi cortada unilateralmente."
13410-424 = "Será que isso significa que ela não quer que a procuremos...?"
13410-427 = "Deserto de Abydos"
13410-428 = "..."
13410-442 = "Próximo;Epílogo (1)"
