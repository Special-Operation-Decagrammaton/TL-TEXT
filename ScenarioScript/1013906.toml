[translation]
1013906-1 = "Именная наклейка Нико"
1013906-2 = "Исполнительный офис Шале"
1013906-3 = "Нико была в Исполнительном офисе Шале на дежурстве Представителя Студентов."
1013906-4 = "[ns] «...О?»"
1013906-6 = ""
1013906-7 = "Что-то не так, Сенсей?"
1013906-8 = "[s1] «Ящик забит коробками скоб.»\n[s2] «Я думал, они закончились, и вчера заказал ещё...»"
1013906-11 = "О нет... Какая трата. Но такое случается."
1013906-12 = "Сколько вы заказали?"
1013906-13 = "[s3] «Примерно годовой запас, чтобы не экономить...»\n[s4] «Казначей меня теперь точно убьёт...»"
1013906-16 = "Значит, есть студенты, которых даже вы боитесь, Сенсей."
1013906-17 = "Но скобы не портятся, так что ничего страшного в запасе нет."
1013906-18 = "Напоминает SRT. Иногда мы забывали проверить склад и случайно повторно заказывали то, что уже было."
1013906-19 = "Однажды мы как раз заказали новую партию мин. Позже выяснилось, что в подвале стоял целый нетронутый ящик—"
1013906-20 = "[s] «И это считается безопасным?!»"
1013906-21 = "Всё нормально. В Кивотосе вообще довольно часто находят забытые коробки со взрывчаткой."
1013906-22 = "Хотя в идеале они не должны принадлежать SRT."
1013906-23 = "Чтобы такое исправить, в Академии SRT ввели правило: на всё клеить именные ярлыки."
1013906-24 = "[s] «...Правило?»"
1013906-25 = "У нас были стандартные выданные вещи, поэтому принадлежности легко путались."
1013906-26 = "...Во время стирки нижнее бельё менялось местами довольно часто."
1013906-27 = "Хотя, кажется, именно это происходило только в отряде FOX. Интересно почему."
1013906-28 = "[s5] «(Кажется, я примерно понимаю почему...)»\n[s6] «Звучит довольно проблемно.»"
1013906-31 = "А, Сенсей. Раз уж заговорили, почему бы не применить такое же правило к вещам Шале?"
1013906-32 = "У меня как раз есть именные наклейки. После смены Представителя Студентов мне нужно кое-что подписать."
1013906-33 = "Если чётко отмечать, где лежит каждая вещь и кому принадлежит, можно избежать ситуаций вроде сегодняшней. И проблем с запасами больше не будет!"
1013906-34 = "Вот, я купила много, так что дам немного и вам, Сенсей."
1013906-35 = "[s7] «Отличная идея.»\n[s8] «Тогда давай подпишем канцелярию, пока всё раскладываем.»"
1013906-38 = "Да!"
1013906-43 = "После этого мы с Нико ходили по Шале и клеили именные наклейки на разные вещи."
1013906-44 = "Заодно я нашёл много предметов, которые давно считал потерянными."
1013906-46 = ""
1013906-47 = "[ns] «...Это заняло намного больше времени, чем ожидалось.»"
1013906-48 = "Да. Спасибо за работу."
1013906-49 = "Теперь сразу видно, где что находится и кому принадлежит."
1013906-50 = "Письменные принадлежности лежат в этом ящике. Тонер и бумага для принтера — в коробке рядом с принтером..."
1013906-51 = ""
1013906-53 = ""
1013906-54 = "О? Осталась одна наклейка."
1013906-55 = "Интересно, есть ли ещё что-нибудь неподписанное..."
1013906-56 = "[s9] «Можешь использовать её где хочешь, Нико.»\n[s10] «Почему бы не наклеить её на что-нибудь своё?»"
1013906-59 = "...Ага."
1013906-60 = "Тогда наклею эту именную наклейку на что-нибудь своё."
1013906-61 = ""
1013906-63 = ""
1013906-64 = ""
1013906-66 = "Вот."
1013906-67 = ""
1013906-70 = "[ns] «Т-Ты сейчас похлопала меня по спине?! Зачем?!»"
1013906-72 = ""
1013906-73 = "Хи-хи, просто так."
1013906-74 = ""
1013906-76 = ""
1013906-77 = ""
1013906-78 = "Важно подписывать свои вещи. Тогда не будет путаницы, кому они принадлежат."
