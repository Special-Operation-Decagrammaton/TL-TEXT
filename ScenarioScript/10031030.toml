[translation]
10031030-1 = "Эпизод 3;Требование председателя"
10031030-13 = ""
10031030-14 = "Ухх! Так и знала! Одной Дисциплинарной комиссии уже хватает проблем! А противостоять главе Хине — настоящий кошмар!"
10031030-15 = "(Дрожь дрожь дрожь дрожь...)"
10031030-16 = ""
10031030-18 = ""
10031030-20 = ""
10031030-21 = ""
10031030-22 = "П-Прораб! Что нам делать!"
10031030-23 = "Хм... Президент тоже попала в передрягу, так что сейчас некому сказать мне, что делать. Тогда..."
10031030-24 = "Отступаем! Спасайся кто может!"
10031030-25 = "Перегруппироваться в убежище Отдела горячих источников через 30!"
10031030-26 = ""
10031030-28 = ""
10031030-31 = ""
10031030-32 = "За ними, Ако."
10031030-33 = ""
10031030-35 = ""
10031030-36 = "Принято, глава Дис—!"
10031030-38 = "Стоооооооойте!!"
10031030-40 = "П-Председатель Макото! Что случилось?!"
10031030-42 = "Прежде чем убегать, может, остановитесь и посмотрите на бардак, который натворили!"
10031030-43 = ""
10031030-46 = ""
10031030-53 = "[ns] «Похоже, внутри зал собраний полностью обрушился...»"
10031030-54 = ""
10031030-55 = ""
10031030-56 = "И?"
10031030-57 = "В смысле «и»?!"
10031030-58 = "Это здание разрушено, потому что ты позволила Дисциплинарной комиссии устроить здесь погром ещё до церемонии перерезания ленты!"
10031030-59 = "Ты не собираешься взять за это ответственность?!"
10031030-60 = "О чём ты вообще? Почему ущерб твоему зданию должен быть МОЕЙ ответственностью?"
10031030-61 = "Разве всё это не произошло из-за твоего безумного решения нанять Отдел горячих источников? Тот самый Отдел горячих источников?"
10031030-62 = "И что?"
10031030-63 = "Что?"
10031030-64 = "Это уже в прошлом!"
10031030-65 = "[s] «Ого.»"
10031030-66 = "Церемония перерезания ленты должна была стать праздником вместе с Сенсеем из Шале. А теперь из-за погрома вашей команды всё превратилось в катастрофу!"
10031030-67 = ""
10031030-69 = ""
10031030-70 = ""
10031030-71 = "Я требую, чтобы ты взяла ответственность! Ты, Дисциплинарная комиссия..."
10031030-72 = "Нет, именно ты, Сорасаки Хина!"
10031030-73 = "Как лидер своей маленькой организации, надеюсь, ты не отвернёшься и не попытаешься сбросить ответственность за этот бардак!"
10031030-74 = "Нет! Глава, вам не нужно слушать этот бред!"
10031030-75 = "[s] «Это уже перебор, Макото...»"
10031030-77 = ""
10031030-78 = "...Хорошо. Чего ты от меня хочешь?"
10031030-79 = "Глава?!"
10031030-80 = ""
10031030-82 = ""
10031030-83 = "[ns] «Хина?»"
10031030-84 = "А? И всё?"
10031030-85 = "Хотя я не собиралась портить церемонию, операция Дисциплинарной комиссии действительно нанесла некоторый ущерб."
10031030-86 = "И если операция ещё и помешала работе Сенсея... Я бы не вынесла, если бы оказалась за это ответственна."
10031030-87 = "Что я могу для вас сделать, председатель Макото?"
10031030-88 = "Хмм... Я..."
10031030-89 = ""
10031030-90 = "(Почему Хина так легко соглашается на мои требования?!)"
10031030-91 = "(Стоп, какая разница! Это мой шанс показать, что именно Я управляю Дисциплинарной комиссией!)"
10031030-92 = "(Что бы сказать, чтобы они увидели всю мощь моей харизмы и потеряли дар речи?!)"
10031030-93 = "(Хмм, главным событием вечеринки должен быть фортепианный концерт.)"
10031030-94 = "(Кекеке! Тогда...!)"
10031030-95 = ""
10031030-96 = "Кеке... Кекекеке... Кекекекеке!!!!"
10031030-97 = "[s] «Похоже, Макото задумала что-то крупное.»"
10031030-99 = "Глава, не надо! От обещаний такой, как она, точно будут одни проблемы!"
10031030-100 = "Нет, Ако. Я уже решила."
10031030-101 = "Н-Но!"
10031030-102 = ""
10031030-104 = ""
10031030-105 = ""
10031030-106 = ""
10031030-107 = "Я не хочу мешать работе Сенсея."
10031030-108 = "[s] «Х-Хина!»"
10031030-109 = "Уф!"
10031030-110 = "Кекекеке! Тогда я тоже приняла решение!"
10031030-111 = "Если ты посмеешь попросить её о чём-то неразумном..."
10031030-112 = "Не переживай. Я не идиотка. Моё требование вполне разумно."
10031030-113 = "Разумное требование? От тебя?"
10031030-114 = "Да. Ты, Сорасаки Хина, одолжишь свои навыки Особой вечеринке Геенны, которую устраиваю я, Великая Макото!"
10031030-115 = "Конечно. Я так и поняла, что вы готовитесь к своей вечеринке Геенны."
10031030-116 = "Но втянуть во всё это главу Хину... Скажи, план этого года ещё хуже прошлогоднего?"
10031030-117 = "Ха! Оставь свои беспочвенные обвинения, Амау Ако. Моё единственное стремление — устроить вечеринку больше прежних."
10031030-118 = "И почему бы нет? В конце концов, нам даже помогает Сенсей! Кхахахаха!"
10031030-119 = "*ахает*. Даже Сенсей?"
10031030-120 = "[s] «Да, каким-то образом...»"
10031030-121 = "Конечно! И это ещё не всё! Сенсей тоже с нетерпением ждёт Особую вечеринку Геенны! Ведь её устраиваю я, Великая Макото!"
10031030-122 = "Вечеринка, которую ждёт Сенсей..."
10031030-123 = "[s] «Ну, я бы не сказал, что лично прямо жду вечеринку, но...»"
10031030-124 = "Видишь? Вечеринку, которая важна для Сенсея, чуть не испортили. И мне нужны навыки главы Дисциплинарной комиссии, чтобы это компенсировать!"
10031030-125 = "И как именно я должна это компенсировать?"
10031030-126 = ""
10031030-128 = ""
10031030-130 = ""
10031030-131 = ""
10031030-132 = "(А теперь — мой главный козырь, добытый разведсетью Общества Пандемониума!)"
10031030-133 = "Глава Дисциплинарной комиссии Сорасаки Хина!"
10031030-134 = "Я требую, чтобы ты сыграла вступительный фортепианный концерт на Особой вечеринке Геенны!"
10031030-135 = "...Что?"
10031030-136 = "Фортепианный концерт?"
10031030-137 = "Кекеке! Да! Концерт!"
10031030-138 = "(По сведениям моих шпионов, глава Дисциплинарной комиссии не умеет ни плавать, ни играть на пианино!)"
10031030-139 = ""
10031030-141 = ""
10031030-142 = ""
10031030-143 = "Фортепианный концерт главы! Пианино! Концерт!"
10031030-144 = "О-о, можно я сниму? Нет! Надо записать!"
10031030-145 = "Но... Э-Это невыполнимое требование!"
10031030-146 = "Ну же, Хина! Только не говори, что теперь откажешься после обещания помочь?!"
10031030-147 = "..."
10031030-148 = "[s] «Хина, тебе не обязательно делать это, если не хочешь.»"
10031030-149 = "...Сенсей."
10031030-150 = "Спасибо за доброту. Но обещание есть обещание."
10031030-151 = "Мои действия действительно причинили другим вред. А если Сенсей тоже ждёт вечеринку Геенны, тогда..."
10031030-152 = "Я... как глава Дисциплинарной комиссии Геенны должна... Я... эм..."
10031030-153 = "...тоже хочу оправдать ожидания Сенсея... поэтому..."
10031030-154 = "*вздыхает* Хорошо. Я соглашусь на ваше требование, председатель."
10031030-155 = "П-Правда?!"
10031030-156 = "Кхм!"
10031030-157 = "Ну что же! Хорошо видеть, что глава Дисциплинарной комиссии не отказывается от своих слов, верно?!"
10031030-158 = "Буду считать это согласием и продолжу подготовку!"
10031030-159 = ""
10031030-161 = ""
10031030-162 = ""
10031030-163 = "Хорошо. А мы пока отправимся ловить Отдел горячих источников."
10031030-164 = "Если оставить их без присмотра, они снова натворят дел. Когда закончу с этим, придётся начинать репетиции на пианино к концерту..."
10031030-165 = "Пойдём, Ако."
10031030-166 = ""
10031030-168 = ""
10031030-170 = ""
10031030-171 = "А, эм... Г-Глава?!"
10031030-172 = ""
10031030-174 = ""
10031030-176 = ""
10031030-177 = "Она и правда согласилась."
10031030-178 = "...Кеке."
10031030-179 = "Кихехе. Кихехе. Кихехехе!"
10031030-180 = "Ну... За этим будет весело наблюдать!"
10031030-181 = "Даже не думай отвертеться! Ты сама на это подписалась, глава Сорасаки Хина!"
10031030-184 = "[ns] «...Надеюсь, всё закончится хорошо.»"
