[translation]
212120-1 = "Episódio 12;Você Vai Torcer Por Mim, Sensei?"
212120-3 = ""
212120-4 = "......Acabou pra gente."
212120-5 = "Pois é, né......"
212120-6 = "[s] \"......\""
212120-8 = "Eu não imaginava que a segurança da sala da rádio estaria tão impenetrável assim......"
212120-13 = ""
212120-15 = ""
212120-16 = "A entrada neste prédio está estritamente proibida."
212120-17 = "Ué? Mas é que eu vim fazer uma reportagem super importante――"
212120-18 = "Negativo. Proibido."
212120-19 = "Mas veja bem...... eu sou repórter do Semanário da Pandemonium...... nem com credencial?"
212120-20 = "Afirmativo. Ninguém está autorizado a entrar, não importa quem seja."
212120-21 = "Ai, caramba...... e agora?"
212120-24 = ""
212120-25 = "Não é só na porta da frente: dei uma espiada e o corredor inteiro tá entupido de sentinelas armadas até os dentes."
212120-26 = "A vigilância tá em alerta vermelho máximo......"
212120-27 = "......O jeito vai ser entrar na base do estouro e arrebentar tudo?"
212120-29 = "Não temos efetivo suficiente pra isso, e mesmo se abrirmos caminho na marra, não vamos longe."
212120-30 = "Mesmo que a Satsuki-senpai consiga invadir, não há garantia de que achará a frequência no mesmo segundo."
212120-31 = "Se outras tropas de reforço chegarem nesse meio-tempo...... especialmente a Presidente Hina...... será o nosso fim."
212120-32 = "......"
212120-33 = ""
212120-35 = ""
212120-37 = ""
212120-38 = "Olhando pelo lado positivo, isso é a prova cabal de que a nossa teoria está certíssima."
212120-39 = "Por que diz isso?"
212120-40 = "Porque deslocaram um batalhão inteiro para proteger aquele lugar."
212120-41 = "Se mobilizaram tanta gente assim, é porque há algo crucial a ser protegido lá dentro."
212120-42 = "Ah, faz sentido! Então isso é uma ótima notícia, né?"
212120-43 = "Se a gente desconsiderar o pequeno detalhe de que não conseguimos entrar nem a pau, sim."
212120-44 = ""
212120-46 = ""
212120-48 = "......"
212120-49 = "......Mas tem uma coisa muito esquisita nisso tudo, não acham?"
212120-50 = "O quê?"
212120-51 = "Segurança serve pra proteger algo de invasores, certo?"
212120-52 = "E se a sala da rádio tá sob cerco de segurança máxima――"
212120-54 = "......"
212120-55 = "Pensando por esse lado......"
212120-56 = "Significa que [ruby=・]al[/ruby][ruby=・]guém[/ruby] lá dentro já sabe que a chave do mistério está guardada lá."
212120-57 = ""
212120-59 = ""
212120-60 = "Quer dizer que...... tem alguém orquestrando tudo isso deliberadamente por trás dos panos......?!"
212120-61 = "......!!"
212120-62 = "Então essa lavagem cerebral não foi mero acidente."
212120-63 = "......Tem um autor intelectual manipulando o tabuleiro."
212120-64 = "[s] \"......\""
212120-65 = "Diante das evidências circunstanciais...... é praticamente uma certeza absoluta."
212120-66 = "......Mas quem seria?"
212120-67 = ""
212120-71 = ""
212120-72 = "Ué? Alguém mais tava marcado pra vir aqui――"
212120-73 = ""
212120-75 = ""
212120-77 = ""
212120-78 = ""
212120-81 = ""
212120-82 = "......"
212120-84 = "Shoko?"
212120-85 = "Shoko-chan......!"
212120-87 = "......Então vocês estavam todas reunidas aqui."
212120-88 = "Ebaaa! Shoko, você veio se juntar a nós?!"
212120-89 = "[s] \"Espere, Mayumi......!\""
212120-90 = ""
212120-93 = ""
212120-94 = "Paradas onde estão!"
212120-95 = ""
212120-97 = ""
212120-98 = "......"
212120-99 = "......O que você veio fazer aqui?"
212120-100 = "Vim conceder uma oportunidade a vocês."
