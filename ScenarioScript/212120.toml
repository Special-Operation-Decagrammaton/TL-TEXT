212120-102 = "A oportunidade de compreenderem, de uma vez por todas, o que é o correto para Gehenna."
212120-103 = "......"
212120-105 = "Ah é? E que porcaria de 'correto' é esse na sua cabeça?"
212120-106 = ""
212120-108 = ""
212120-109 = "É não cometer a covardia de trair Gehenna."
212120-110 = ""
212120-113 = ""
212120-115 = "Curvar-se à disciplina e contribuir com a grandeza de Gehenna."
212120-116 = "Cerrar fileiras no exército e esmagar o inimigo com ferro e sangue."
212120-117 = "Apenas isso."
212120-118 = "Não me faça rir! Isso nunca vai ser o caminho certo!"
212120-119 = "A História se encarregará de provar quem tem razão."
212120-120 = "Embora, como bem sabem, a História seja sempre escrita pelas mãos dos mais fortes."
212120-121 = "Estarei observando o destino que vocês escolherem."
212120-122 = ""
212120-124 = ""
212120-126 = ""
212120-127 = "Shoko......!"
212120-128 = "......Você tá falando sério mesmo?"
212120-129 = "Líder Mayumi, Karen. Acredito ter lhes dado chances mais do que generosas para escolher."
212120-130 = "......"
212120-131 = "......Sendo assim, nossos caminhos se bifurcam em definitivo."
212120-132 = "......"
212120-135 = ""
212120-136 = "Vocês duas sempre foram um fardo cansativo de carregar."
212120-137 = "O que pensavam que fariam se eu não estivesse por perto?"
212120-138 = ""
212120-141 = ""
212120-142 = "A gente nem estaria metida nessa enrascada pra começo de conversa!"
212120-143 = "Quem deu a ideia de fundar o Comitê foi VOCÊ, Shoko!!"
212120-145 = "Pensando bem, é verdade."
212120-148 = "Shoko......"
212120-149 = "Por que a gente foi parar nessa situação tão triste......?"
212120-150 = "......Por Gehenna."
212120-151 = "Para a restauração da glória de Gehenna."
212120-152 = "......"
212120-153 = "Mentira! Isso...... isso não tem NADA a ver com o nosso ideal!"
212120-155 = "Chega de sentimentalismos baratos."
212120-158 = "Traçarei uma linha definitiva aqui."
212120-159 = "Se continuarem atrapalhando, abrirão rachaduras na coesão inabalável de Gehenna."
212120-160 = "Isto é um aviso formal."
212120-161 = "Se vocês realmente amam esta escola, parem de fomentar divisões internas."
212120-162 = "Os atos de vocês só trazem prejuízos graves a Gehenna."
212120-163 = ""
212120-165 = ""
212120-168 = "Sim. Pode se aproximar, Presidente."
212120-169 = ""
212120-171 = ""
212120-172 = ""
212120-175 = ""
212120-176 = "......"
212120-177 = "[s] \"Hina......\""
212120-178 = "Presidente......!"
212120-179 = "......Iori, Chinatsu."
212120-180 = "......Sim."
212120-181 = "O que exatamente vocês estavam fazendo até agora?"
212120-182 = "B-Bem, é que......"
212120-183 = "Vocês sabem muito bem, não sabem?#nAbandonar o posto sem autorização é insubordinação passível de execução sumária imediata."
212120-185 = "......"
212120-186 = "Presidente Hina, acalme-se, por favor! Nós só estávamos conversando――"
212120-187 = ""
212120-189 = ""
212120-190 = ""
212120-191 = "Iroha. Ouvi dizer que você pediu demissão da Sociedade Pandemônio."
212120-192 = "......É a mais pura verdade."
212120-193 = "Devo interpretar isso como um ato de rebeldia aberta contra toda a Gehenna?"
212120-194 = "O núcleo de elite do Comitê de Disciplina confraternizando com uma desertora declarada......#nComo vocês esperam que eu reaja diante de tal traição?"
212120-195 = "......"
212120-196 = ""
212120-198 = ""
212120-199 = "Satsuki, Chiaki. Vocês duas também renunciaram aos seus cargos na Pandemonium?"
212120-200 = ""
212120-202 = ""
212120-204 = ""
212120-206 = "Se não renunciaram, voltem agora para o quartel da Pandemonium. Há carência crítica de oficiais operacionais."
212120-207 = "E quanto ao Comitê de Restauração de Gehenna: tenho perguntas a fazer a vocês duas."
212120-208 = "A nós duas......?!"
212120-209 = "A secretária de vocês passa noites em claro orquestrando os planos estratégicos perfeitos."
212120-210 = "A glória de Gehenna que vocês tanto clamavam está diante dos seus olhos. O que exatamente vocês estão fazendo aqui?"
212120-211 = ""
212120-213 = ""
212120-214 = "......Isso aí é a Gehenna com que a gente sonhava?!"
212120-215 = "Um coletivo rigidamente disciplinado, despido de caprichos egoístas, marchando rumo a um único objetivo supremo."
212120-216 = "Não era isso que vocês tanto imploravam?"
212120-217 = ""
212120-219 = ""
212120-220 = "Hahaha! Passou longe disso aí, senhora."
212120-221 = "O que tem de diferente?"
212120-222 = "O nome disso aí é loucura pura e simples, veterana."
212120-223 = "Posso registrar essa declaração como as suas últimas palavras de despedida como aluna de Gehenna?"
212120-224 = ""
212120-226 = ""
212120-228 = "Para que não haja equívocos: repita com clareza. Mais uma vez."
212120-229 = "E-Eita...... que aura sufocante......!"
212120-230 = "E-Esse é...... o poder avassalador da chefe da Disciplina quando fala sério......"
212120-231 = ""
212120-233 = ""
212120-235 = "[ns] \"Hina......!\""
212120-236 = ""
212120-238 = ""
212120-239 = "Ufa......"
212120-241 = "Ugh......"
212120-242 = "Arf...... arf......"
212120-243 = ""
212120-246 = ""
212120-247 = "Deixarei bem claro pela última vez:"
212120-248 = "A era da complacência com a preguiça sob o falso pretexto de 'liberdade' acabou."
212120-249 = "Todas vocês, retornem imediatamente aos seus postos."
212120-250 = "Se voltarem a demonstrar qualquer conduta suspeita――"
212120-251 = ""
212120-253 = ""
212120-254 = "Arquem com as devidas consequências."
212120-255 = "[s] \"......\""
212120-256 = "......Sensei."
212120-257 = "Não vou perguntar o que você estava fazendo aqui."
212120-258 = "Em troca, poderia me conceder um pouco do seu tempo?"
212120-259 = "[s] \"......Tudo bem.\""
212120-260 = "......Obrigada. Venha comigo."
212120-264 = "(Fui levado por Hina até uma instalação isolada)"
212120-265 = ""
212120-268 = "(Pedi em segredo para as outras não se preocuparem......)"
212120-269 = "(Mas não fazia ideia de como as coisas iriam terminar)"
212120-272 = ""
212120-273 = "Sensei......"
212120-274 = "[s] \"Pode falar, Hina.\""
212120-275 = "......Você está bem?"
212120-276 = "[s] \"Como assim......?\""
212120-277 = "É que você esteve em Gehenna o tempo todo recentemente, não esteve?"
212120-278 = "Você também está se preocupando com o nosso futuro, eu sei."
212120-279 = "Afinal, este é o momento mais decisivo de toda a nossa história......"
212120-280 = "[s] \"......\""
212120-281 = "Diga-me, Sensei."
212120-282 = "Quando Gehenna iniciar o ataque total contra Kivotos...... o que você vai fazer?"
212120-283 = "[s] \"Eu......\""
212120-284 = "Nesse momento solene...... você vai me dizer aquelas mesmas palavras de antes?"
212120-285 = ""
212120-287 = ""
212120-288 = "'Obrigado pelo seu esforço. Obrigado por dar o seu melhor'."
212120-289 = "'Estarei sempre torcendo por você, não importa o que aconteça'."
212120-290 = "――Você vai me dizer isso de novo?"
212120-291 = "[s] \"............\""
212120-292 = "......Compreendo."
212120-293 = "Você...... acha que tudo isso é um erro terrível, não acha?"
212120-294 = "Mas eu......"
212120-295 = "Eu não sinto que a minha mente esteja doente."
212120-296 = "Nunca na minha vida meus pensamentos foram tão cristalinos, nem minhas decisões tão cheias de certeza."
212120-297 = ""
212120-301 = "Eu finalmente enxerguei: esta é a minha razão de existir."
212120-302 = "A minha força bélica, a minha firmeza de comando, a autoridade do meu cargo."
212120-303 = "Tudo o que sou existe para um único fim: para que Gehenna governe toda a Kivotos."
212120-304 = "[s] \"Hina......\""
212120-307 = "......Por que será, né?"
212120-308 = "Às vezes, fragmentos do passado me vêm à mente."
212120-309 = "Por que será que, naquela época, eu......"
212120-310 = "Por que será que eu lutei até o fim contra a Imperatriz do Trovão――"
212120-311 = "Pela...... li-ber-da-de......?"
212120-312 = ""
212120-316 = ""
212120-317 = "Argh! Urghhhhh......!"
212120-318 = "[s] \"Hina......!\""
212120-319 = ""
212120-323 = "Aaaaaaaaargh......!!"
212120-324 = ""
212120-333 = ""
212120-334 = ""
212120-335 = "......"
212120-336 = "......Sensei."
212120-337 = "Torça por nós...... torça por mim, exatamente como sempre fez."
212120-338 = "Apenas com as suas palavras, eu consigo ir muito mais longe. Consigo suportar qualquer tormento nesta vida."
212120-339 = "[s] \"......\""
212120-341 = "[ns] \"Sim, eu sei que você é capaz de superar qualquer coisa, Hina.\""
212120-343 = "[ns] \"Eu vou dar tudo de mim por você, Hina.\""
212120-344 = "......Vou confiar em você."
212120-345 = "Por isso, eu lhe imploro: de agora em diante, faça exatamente o que eu mandar."
212120-346 = ""
212120-348 = ""
212120-351 = ""
212120-354 = ""
212120-356 = "[ns] \"Hina?!\""
212120-357 = "Como eu já disse antes, corpos estranhos não têm lugar em uma Gehenna unificada."
212120-358 = "Este é o momento em que todos devem marchar como um só corpo."
212120-359 = "Não sei por que aquelas alunas ainda insistem em resistir, mas......"
212120-360 = "Se o alicerce delas for removido, a rebelião se dissipará naturalmente."
212120-361 = "......E me disseram que esse alicerce é você, Sensei."
212120-362 = "Por isso, manterei você sob custódia de proteção por algum tempo."
212120-363 = ""
212120-365 = ""
212120-367 = ""
212120-368 = "Eu...... não queria ter que fazer isso."
212120-369 = "Só de pensar na hipótese de você me odiar, meu peito gela de pavor."
212120-370 = "Mas se eu não fizer isso, não conseguirei te proteger. Por isso...... por favor, tente entender os meus sentimentos."
212120-371 = ""
212120-377 = "(Olhando para o brilho estranho e perturbador nos olhos de Hina, fiquei sem palavras)"
