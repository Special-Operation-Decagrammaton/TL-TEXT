[translation]
212120-1 = "Episode 12;Will You Support Me, Sensei?"
212120-4 = "……It's over."
212120-5 = "Yeah, no kidding……."
212120-6 = "[s] \"…….\""
212120-8 = "I can't believe the security at the broadcasting room is this tight……."
212120-16 = "Entry to this building is prohibited."
212120-17 = "Huh? Oh, I came here because I wanted to do an interview—"
212120-18 = "Denied."
212120-19 = "Um…… I'm a reporter for the Weekly Pandemonium…… is that still not allowed?"
212120-20 = "Correct. No one is permitted to enter, regardless of who they are."
212120-21 = "What should we do……."
212120-25 = "It's not just the front of the building; from what I could see, the inside is packed with security too."
212120-26 = "They're being incredibly cautious, aren't they……."
212120-27 = "……Isn't our only option to force our way in?"
212120-29 = "We simply don't have the numbers, and even if we did break through, there's nowhere to go from there."
212120-30 = "Even if Satsuki-senpai managed to get in, there's no guarantee she'd find a lead right away."
212120-31 = "In the meantime, other forces…… especially if the Prefect Team leader comes as reinforcements, it's over."
212120-32 = "……."
212120-38 = "If you look at it another way, you could say this is proof that our hypothesis is correct."
212120-39 = "How so?"
212120-40 = "Because they've allocated that many people to security."
212120-41 = "It means there is something in that broadcasting room worth protecting at all costs."
212120-42 = "Oh, I see. So, I guess that's a good thing?"
212120-43 = "Except for the fact that the security is too tight to get in."
212120-48 = "……."
212120-49 = "……Doesn't something feel off?"
212120-50 = "Like what?"
212120-51 = "Security is meant to protect something, right?"
212120-52 = "So if the broadcasting room is being guarded, that means—"
212120-54 = "……."
212120-55 = "The way you put it……."
212120-56 = "There is someone who knows there's a lead in there."
212120-60 = "In other words…… does that mean someone orchestrated this whole situation……?"
212120-61 = "……!!"
212120-62 = "If that's the case, this isn't an accident."
212120-63 = "……It means there's a culprit behind this incident."
212120-64 = "[s] \"…….\""
212120-65 = "Judging by the circumstantial evidence…… it's almost certain."
212120-66 = "……But, who?"
212120-72 = "Hm? Was there anyone else scheduled to come—"
212120-82 = "……."
212120-84 = "Shouko?"
212120-85 = "Shouko-chan……!"
212120-87 = "……Everyone, so this is where you were."
212120-88 = "Wow~! Shouko, you came here too?"
212120-89 = "[s] \"Wait, Mayumi……!\""
212120-94 = "Don't move!"
212120-98 = "……."
212120-99 = "……What did you come here to do?"
212120-100 = "To offer you a chance."
212120-101 = "A chance……?"
212120-102 = "An opportunity to realize what is truly right for Gehenna."
212120-103 = "……."
212120-105 = "Oh? And what exactly is this 'right' you're talking about?"
212120-109 = "To never betray Gehenna."
212120-115 = "To follow order and contribute to the greatness of Gehenna."
212120-116 = "And to join the ranks, striking down our enemies with blood and iron."
212120-117 = "That is all."
212120-118 = "Don't make me laugh. There's no way that's right."
212120-119 = "History will prove it eventually."
212120-120 = "Though, history is written by those with power, isn't it?"
212120-121 = "I shall be watching your efforts closely."
212120-127 = "Shouko……!"
212120-128 = "……Are you serious?"
212120-129 = "Chairwoman, Karen. I believe I have given you more than enough opportunities to choose."
212120-130 = "……."
212120-131 = "……Our paths have diverged now."
212120-132 = "……."
212120-136 = "You two are such a handful."
212120-137 = "What were you planning to do if I wasn't here?"
212120-142 = "If that were the case, we wouldn't be doing this in the first place!"
212120-143 = "You were the one who started it, Shouko!!"
212120-145 = "I suppose that's true."
212120-148 = "Shouko……."
212120-149 = "How did we end up like this……?"
212120-150 = "……For the sake of Gehenna."
212120-151 = "To restore Gehenna."
212120-152 = "……."
212120-153 = "No, this…… this isn't it at all."
212120-155 = "Enough sentimentality."
212120-158 = "Let's draw a line here."
212120-159 = "If you get in our way, it will cause a rift in Gehenna's unity."
212120-160 = "This is a warning."
212120-161 = "If you truly care about Gehenna, do not incite division."
212120-162 = "Your actions are detrimental to Gehenna."
212120-168 = "Yes. Please, come this way."
212120-176 = "……."
212120-177 = "[s] \"Hina…….\""
212120-178 = "Chairwoman……!"
212120-179 = "……Iori, Chinatsu."
212120-180 = "……Yes."
212120-181 = "What have you been doing until now?"
212120-182 = "Th-that is……."
212120-183 = "You know, don't you?#nUnauthorized absence is a matter serious enough to warrant immediate disciplinary action."
212120-185 = "……."
212120-186 = "Prefect Team leader, please calm down. We were just talking—"
212120-191 = "Iroha. I heard you said you were quitting Pandemonium."
212120-192 = "……That is correct."
212120-193 = "Does that mean I should understand it as you rebelling against Gehenna?"
212120-194 = "The core of the Prefect Team is with someone who has raised the flag of rebellion……#nHow am I supposed to take this fact?"
212120-195 = "……."
212120-199 = "Satsuki, Chiaki. Did you two quit Pandemonium as well?"
212120-206 = "If not, return to Pandemonium. We are short-handed and in a state of chaos."
212120-207 = "And the Gehenna Restoration Committee. I have questions for you as well."
212120-208 = "Us too……!?"
212120-209 = "Your secretary is sacrificing sleep to put together the best possible plan."
212120-210 = "With the Gehenna you've been screaming about right in front of you, what are you doing?"
212120-214 = "……Is that the Gehenna we dreamed of?"
212120-215 = "A controlled group that has abandoned selfish indulgence and moves toward a single goal."
212120-216 = "That's what you wanted, isn't it?"
212120-220 = "Yaha, that's a bit different."
212120-221 = "What's different?"
212120-222 = "That's called madness, Senpai."
212120-223 = "As fellow Gehenna students, should I take that as your final words?"
212120-228 = "Could you say that clearly so I don't misunderstand? One more time."
212120-229 = "Yaha…… the pressure is insane……!"
212120-230 = "Th-this is the Prefect Team leader's…… true power……."
212120-235 = "[ns] \"Hina……!\""
212120-239 = "Phew……."
212120-241 = "Ugh……."
212120-242 = "Haa, haa……."
212120-247 = "Let me state this clearly once more."
212120-248 = "The Gehenna that indulged in laziness while wallowing in empty 'freedom' is over."
212120-249 = "Everyone, return to your posts."
212120-250 = "If you show any more signs of unrest in the future—"
212120-254 = "Be prepared for the consequences."
212120-255 = "[s] \"…….\""
212120-256 = "……Sensei."
212120-257 = "I won't ask why you were here."
212120-258 = "Instead, could you spare me some time?"
212120-259 = "[s] \"……Understood.\""
212120-260 = "……Yeah. Then, follow me."
212120-264 = "(I was led by Hina to another location)"
212120-268 = "(I told everyone I left behind not to worry, but……)"
212120-269 = "(I had no idea how things would turn out)"
212120-273 = "Sensei……."
212120-274 = "[s] \"Let me hear it.\""
212120-275 = "……Are you okay?"
212120-276 = "[s] \"What do you mean……?\""
212120-277 = "Because you've been in Gehenna a lot lately, right?"
212120-278 = "You're looking out for us, aren't you?"
212120-279 = "Because this is a very important turning point for us……."
212120-280 = "[s] \"…….\""
212120-281 = "Hey, Sensei."
212120-282 = "If Gehenna starts a full-scale attack on Kivotos, what will you do?"
212120-283 = "[s] \"I…….\""
212120-284 = "Will you say it like you did before?"
212120-288 = "Thank you for your hard work.#nThank you for giving it your all."
212120-289 = "I'll always be cheering for you."
212120-290 = "—Like that."
212120-291 = "[s] \"………….\""
212120-292 = "……I see."
212120-293 = "So you think…… that I'm wrong."
212120-294 = "But, I……."
212120-295 = "I don't think my heart is wrong."
212120-296 = "I've never felt this clear-headed, or this confident in my actions, until now."
212120-301 = "I realized it. This is my reason for existing."
212120-302 = "My power, my decisions, my position."
212120-303 = "All of it exists for Gehenna to rule over Kivotos."
212120-304 = "[s] \"Hina…….\""
212120-307 = "……I wonder why."
212120-308 = "Suddenly, I remember the past."
212120-309 = "Why did I, back then……."
212120-310 = "Why, while resisting the Kaiser……"
212120-311 = "For, the, sake, of, freedom……?"
212120-317 = "Ugh! Ggggh……!"
212120-318 = "[s] \"Hina……!\""
212120-323 = "Uaaaaaa……!!"
212120-335 = "……."
212120-336 = "……Sensei."
212120-337 = "Support us…… support me, just like you always have."
212120-338 = "That alone is enough for me to work even harder. I can overcome anything, no matter how painful."
212120-339 = "[s] \"…….\""
212120-341 = "[ns] \"Yeah, I know you can overcome it, Hina.\""
212120-343 = "[ns] \"I'll do my best for you too.\""
212120-344 = "……I believe you."
212120-345 = "So, please. From now on, do as I say."
212120-356 = "[ns] \"Hina!?\""
212120-357 = "Like I said before, a unified Gehenna has no room for foreign objects."
212120-358 = "Because this is a time when everyone must come together."
212120-359 = "I don't know why there are students who oppose us, but……."
212120-360 = "If the pillar is removed, they should naturally fade away."
212120-361 = "……And they say that pillar is you, Sensei."
212120-362 = "So for a while, I'll have to keep you under protection."
212120-368 = "I don't want to do this…… if I could help it."
212120-369 = "The thought of you hating me is terrifying."
212120-370 = "But I can't protect you unless I do this. So…… I want you to understand my feelings."
212120-377 = "(Looking into Hina's strangely glowing eyes, I couldn't say a word)"
212120-381 = "(The reality that I couldn't support my student's dream……)"
212120-382 = "(Swirled in my heart as feelings I couldn't put into words)"
212120-384 = "Next Episode;Confinement"