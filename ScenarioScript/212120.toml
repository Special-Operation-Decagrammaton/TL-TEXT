[translation]
212120-1 = "Эпизод 12;Вы поддержите меня, Сенсей?"
212120-3 = ""
212120-4 = "...Нам конец."
212120-5 = "Тут не поспоришь. *вздох*"
212120-6 = "[s] «...»"
212120-8 = "Не верится, что радиорубку так тщательно охраняют..."
212120-13 = ""
212120-15 = ""
212120-16 = "Вход запрещён."
212120-17 = "Что? А, я пришла сделать репортаж."
212120-18 = "Тем более нельзя."
212120-19 = "Эм... Нет, я ОФИЦИАЛЬНЫЙ КОРРЕСПОНДЕНТ «Еженедельника Пандемониума»! Во славу Геенны, так сказать?"
212120-20 = "Нет. В здание никому нельзя."
212120-21 = "О-Ого..."
212120-24 = ""
212120-25 = "Весь вход в здание оцепили охранники. А если заглянуть в окна, видно, что внутри тоже полно охраны."
212120-26 = "Пожалуй, радиорубка теперь самое охраняемое место в Геенне..."
212120-27 = "...А мы не можем просто прорваться силой?"
212120-29 = "Через столько охранников не пробиться. А даже если пробьёмся, что будем делать дальше?"
212120-30 = "Даже если Сацуки проникнет внутрь и осмотрится, нет гарантии, что она успеет найти доказательства."
212120-31 = "Если нас перехватят... особенно если это сделает глава Префектуры, нам конец."
212120-32 = "..."
212120-33 = ""
212120-35 = ""
212120-37 = ""
212120-38 = "В некотором смысле наше затруднительное положение подтверждает нашу теорию."
212120-39 = "Вот как?"
212120-40 = "Зачем ещё так охранять радиорубку, если там нет ничего важного?"
212120-41 = "Там НЕПРЕМЕННО должна быть какая-нибудь зацепка."
212120-42 = "Ага, значит, это хорошие новости?"
212120-43 = "Если сумеем попасть внутрь, то да."
212120-44 = ""
212120-46 = ""
212120-48 = "..."
212120-49 = "Но... вам не кажется, что тут что-то не так?"
212120-50 = "Что?"
212120-51 = "Если такая охрана действительно означает, что в радиорубке есть зацепка..."
212120-52 = "...значит, кто-то пытается не дать другим её обнаружить, верно?"
212120-54 = "..."
212120-55 = "А это значит..."
212120-56 = "Кто-то знает, что там хранится нечто очень ценное..."
212120-57 = ""
212120-59 = ""
212120-60 = "И выходит... этот кто-то намеренно всё подстроил...?"
212120-61 = "...!!!"
212120-62 = "Я хочу сказать, что нынешняя ситуация возникла не случайно."
212120-63 = "...То есть кто-то всё это устроил?"
212120-64 = "[s] «...»"
212120-65 = "Судя по происходящему... другого объяснения нет."
212120-66 = "...Но кто это мог быть?"
212120-67 = ""
212120-71 = ""
212120-72 = "Хм? Мы пригласили кого-то ещё...?"
212120-73 = ""
212120-75 = ""
212120-77 = ""
212120-78 = ""
212120-81 = ""
212120-82 = "..."
212120-84 = "Ш-Шоуко?"
212120-85 = "Шоуко...!"
212120-87 = "...Да. Именно здесь я и ожидала вас найти."
212120-88 = "Отлично! Значит, ты пришла к нам присоединиться, Шоуко?"
212120-89 = "[s] «Погоди, Маюми...!»"
212120-90 = ""
212120-93 = ""
212120-94 = "НЕ ПОДХОДИТЕ!"
212120-95 = ""
212120-97 = ""
212120-98 = "..."
212120-99 = "...Зачем ты здесь?"
212120-100 = "Я пришла дать вам шанс."
212120-101 = "«Шанс»...?"
212120-102 = "Возможность осознать, что действительно правильно для Геенны."
212120-103 = "..."
212120-105 = "Да? И что же для тебя «правильно»?"
212120-106 = ""
212120-108 = ""
212120-109 = "Для тебя? Не предавать Геенну."
212120-110 = ""
212120-113 = ""
212120-115 = "Объединиться во имя великого порядка и внести вклад в её славу."
212120-116 = "Примкнуть к походу против Кивотоса и безжалостно сокрушать наших врагов кровью и железом."
212120-117 = "Вот и всё."
212120-118 = "Не шути со мной. Ты же знаешь, что в этом нет ничего «правильного»."
212120-119 = "История рассудит, кто был «прав», а кто «виноват». Что было «славным», а что «запретным»."
212120-120 = "И помни: историю пишут те, у кого власть."
212120-121 = "Я продолжу за вами... пристально наблюдать."
212120-122 = ""
212120-124 = ""
212120-126 = ""
212120-127 = "Шоуко...!"
212120-128 = "Шоуко... Ты серьёзно?"
212120-129 = "Председатель и... Карен. Вам двоим я давала больше всего шансов."
212120-130 = "..."
212120-131 = "...Но, видно, теперь наши пути расходятся."
212120-132 = "..."
212120-135 = ""
212120-136 = "И всё-таки вы двое настоящие нарушители спокойствия."
212120-137 = "Что бы вы без меня делали?"
212120-138 = ""
212120-141 = ""
212120-142 = "Уж точно не всё вот это!"
212120-143 = "Это ты постоянно втягивала нас во всякие истории!"
212120-145 = "Верно, втягивала."
212120-148 = "Шоуко..."
212120-149 = "Как мы до такого дошли?"
212120-150 = "...Всё это ради Геенны."
212120-151 = "Ради Геенны, которая вновь станет по-настоящему великой."
212120-152 = "..."
212120-153 = "Нет, я не этого хотела."
212120-155 = "...Довольно сантиментов."
212120-158 = "Скажу прямо."
212120-159 = "Чем больше вы мешаете, тем слабее становится Геенна. Для завоевания нам нужно единство."
212120-160 = "Это предупреждение."
212120-161 = "Если вам действительно дорога Геенна, перестаньте сеять раздор и раскалывать её."
212120-162 = "То, что вы делаете сейчас, прячась в этой комнатушке, уж точно не на благо Геенны."
212120-163 = ""
212120-165 = ""
212120-168 = "Да, сюда. Проходите, пожалуйста."
212120-169 = ""
212120-171 = ""
212120-172 = ""
212120-175 = ""
212120-176 = "..."
212120-177 = "[s] «Хина...»"
212120-178 = "Г-глава Префектов...!"
212120-179 = "...Иори, Чинацу."
212120-180 = "...Да, глава Префектуры."
212120-181 = "Что вы здесь делаете? Почему покинули посты без разрешения и нарушили субординацию?"
212120-182 = "Н-Ну..."
212120-183 = "Самовольный уход с поста запрещён. По нынешним правилам Префектуры вас могут осудить прямо на месте."
212120-185 = "..."
212120-186 = "Спокойнее, глава Префектуры. Мы здесь просто разговариваем..."
212120-187 = ""
212120-189 = ""
212120-190 = ""
212120-191 = "Ироха. Я слышала, ты покинула Пандемониум."
212120-192 = "...Да. Я ушла."
212120-193 = "Фактически это означает мятеж против нынешней Геенны, разве нет?"
212120-194 = "И как мне понимать, что мои ближайшие подчинённые сейчас находятся с тобой?"
212120-195 = "..."
212120-196 = ""
212120-198 = ""
212120-199 = "Сацуки и Чиаки. Не припомню, чтобы вы объявляли об уходе из Пандемониума."
212120-200 = ""
212120-202 = ""
212120-204 = ""
212120-206 = "Поправьте меня, если я ошибаюсь. В противном случае вернитесь в Пандемониум и помогайте своему председателю."
212120-207 = "И к Лиге наследия Геенны у меня тоже есть вопрос."
212120-208 = "К-к нам...?!"
212120-209 = "Ваш секретарь жертвует сном, чтобы разработать лучшие планы для своей славной академии."
212120-210 = "Наша Геенна, о которой вы столько плакали и переживали, наконец стала реальностью. Ну как вам?"
212120-211 = ""
212120-213 = ""
212120-214 = "Ты спрашиваешь, действительно ли это Геенна нашей мечты?"
212120-215 = "Совершенная армия, свободная от своеволия и стремящаяся к единой цели."
212120-216 = "Разве не этого вы хотели?"
212120-217 = ""
212120-219 = ""
212120-220 = "Яха, по-моему, тут что-то не сходится..."
212120-221 = "Вот как?"
212120-222 = "Видите ли, то, что вы описываете, называется «безумием», глава Префектуры."
212120-223 = "Мне следует считать это официальным заявлением о вашем отказе участвовать в создании славной Геенны?"
212120-224 = ""
212120-226 = ""
212120-228 = "Повторишь? Я хочу убедиться, что всё правильно поняла."
212120-229 = "...Тц...! Яха... Это уже слишком...!"
212120-230 = "Т-так вот какая глава Префектуры на самом деле!"
212120-231 = ""
212120-233 = ""
212120-235 = "[ns] «Хина...!»"
212120-236 = ""
212120-238 = ""
212120-239 = "Фух..."
212120-241 = "Угх..."
212120-242 = "*тяжело дышит* *тяжело дышит*"
212120-243 = ""
212120-246 = ""
212120-247 = "Повторю ещё раз, чтобы ни у кого не осталось сомнений."
212120-248 = "Времена Геенны, где праздность оправдывали «свободой», закончились."
212120-249 = "Вернитесь на свои места и к своим обязанностям, пока мы не начали операцию."
212120-250 = "А если вы и в ближайшие дни продолжите вести себя столь недопустимо..."
212120-251 = ""
212120-253 = ""
212120-254 = "...вас ждут заслуженные последствия."
212120-255 = "[s] «...»"
212120-256 = "...Сенсей..."
212120-257 = "Не стану спрашивать, почему вы были с ними."
212120-258 = "И всё же не могли бы вы уделить мне немного времени?"
212120-259 = "[s] Согласиться."
212120-260 = "...Хорошо. Тогда давайте немного поговорим."
212120-264 = "Я последовал за Хиной."
212120-265 = ""
212120-268 = "Я заверил студентов, что за меня не стоит беспокоиться..."
212120-269 = "Но не представлял, что произойдёт дальше."
212120-272 = ""
212120-273 = "Сенсей..."
212120-274 = "[s] «...Я слушаю, Хина»."
212120-275 = "Сенсей, у вас в последнее время всё хорошо?"
212120-276 = "[s] «В каком смысле...?»"
212120-277 = "Я заметила, что вы задержались в Геенне надолго."
212120-278 = "Должно быть, вам очень небезразлично происходящее у нас."
212120-279 = "А поскольку сейчас для нас наступил столь важный момент..."
212120-280 = "[s] «...»"
212120-281 = "Сенсей."
212120-282 = "Что вы будете делать, когда Геенна начнёт войну за завоевание Кивотоса?"
212120-283 = "[s] «Я...»"
212120-284 = "Когда наступит этот день, вы будете разговаривать со мной так же, как прежде?"
212120-285 = ""
212120-287 = ""
212120-288 = "«Спасибо за твой труд»#n«Спасибо, что стараешься изо всех сил»."
212120-289 = "«Я всегда тебя поддержу»."
212120-290 = "...Вы по-прежнему будете говорить мне всё это?"
212120-291 = "[s] «...»"
212120-292 = "...Понятно."
212120-293 = "Значит, Сенсей... Вы считаете, что мы поступаем неправильно."
212120-294 = "Но я..."
212120-295 = "...Не думаю, что с моими чувствами что-то не так."
212120-296 = "Никогда ещё мои мысли не были настолько ясными, а уверенность настолько твёрдой."
212120-297 = ""
212120-301 = "Да. В этом смысл моего существования."
212120-302 = "Моя сила, решимость, положение."
212120-303 = "Всё это ради завоевания Кивотоса Геенной."
212120-304 = "[s] «Хина...»"
212120-307 = "...Интересно, почему..."
212120-308 = "Я вдруг вспоминаю прошлое."
212120-309 = "Почему я тогда так поступала?"
212120-310 = "Почему восстала против Императора-тирана...?"
212120-311 = "...Ради «свободы»...?"
212120-312 = ""
212120-316 = ""
212120-317 = "Ух! Тц...!"
212120-318 = "[s] «Хина...!»"
212120-319 = ""
212120-323 = "А-а...!!!"
212120-324 = ""
212120-333 = ""
212120-334 = ""
212120-335 = "..."
212120-336 = "...Сенсей."
212120-337 = "А. Пожалуйста, продолжайте поддерживать нас, поддерживать МЕНЯ... как всегда."
212120-338 = "Когда вы рядом, я могу стараться ещё усерднее. Могу преодолеть любые испытания, какими бы мучительными они ни были."
212120-339 = "[s] «...»"
212120-341 = "[ns] «Хина, ты сможешь справиться И С ЭТИМ»."
212120-343 = "[ns] «Я тоже сделаю для тебя всё, что смогу, Хина»."
212120-344 = "...Да. Уверена, вы говорите искренне."
212120-345 = "Вот почему я попрошу вас пойти со мной и делать то, что я скажу."
212120-346 = ""
212120-348 = ""
212120-351 = ""
212120-354 = ""
212120-356 = "[ns] «Хина?!»"
212120-357 = "Как я уже говорила, в единой Геенне нет места раздорам."
212120-358 = "Теперь мы все должны действовать согласованно, словно одно целое, с единой волей и единым разумом."
212120-359 = "Хотя я до сих пор не понимаю, почему некоторые студенты идут против нашей воли..."
212120-360 = "Уверена, разногласия исчезнут, если устранить того, кто вдохновляет их на мятеж."
212120-361 = "...И мне сообщили, что этот человек вы, Сенсей."
212120-362 = "Поэтому, Сенсей, какое-то время вы пробудете под нашей заботливой охраной."
212120-363 = ""
212120-365 = ""
212120-367 = ""
212120-368 = "...Мне жаль, что всё так обернулось."
212120-369 = "Признаться, я боюсь, что вы возненавидите меня за это..."
212120-370 = "Но иначе я не смогу вас защитить. Поэтому прошу... надеюсь, вы поймёте."
212120-371 = ""
212120-377 = "Я молча смотрел в глаза Хины, светившиеся странным сиянием. У меня не находилось ни слова."
212120-378 = ""
212120-381 = "Реальность, в которой я не мог поддержать мечту студента..."
212120-382 = "...заставляла меня чувствовать себя чужим самому себе."
212120-384 = "Следующий эпизод;Заточение"
