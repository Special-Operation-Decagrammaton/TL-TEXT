[translation]
2001515-1 = "Первое воспоминание"
2001515-2 = "Мы с Каэдэ вместе отправились во временный магазин «Мушикуин»."
2001515-3 = ""
2001515-6 = "[ns1] «Ого. Посмотри на эту очередь.»\n[ns2] «Похоже, ждать придётся долго.»"
2001515-9 = ""
2001515-10 = "Правда? По-моему, всё вполне ожидаемо, Сенсей! Мы ведь говорим о лимитированном протекторе для карт «Мушикуин»!"
2001515-11 = "А ещё это повторный выпуск ТОГО САМОГО супермегаредкого издания, которое, как все думали, больше никогда не появится!"
2001515-12 = "Если упустить этот шанс — всё! Его больше никогда-никогда не будут продавать!"
2001515-13 = "[s3] «Протектор для карт — это то, о чём я думаю?» \n[s4] «Такая маленькая пластиковая обложка для карты, да?»"
2001515-16 = "Верно! Именно так, Сенсей!"
2001515-17 = "Раз уж случай особенный... Я покажу вам своё сокровище, Сенсей!"
2001515-18 = "[s] «Твоё сокровище?!»"
2001515-19 = "Да! Только не слишком возбуждайтесь! Та-дам!"
2001515-20 = ""
2001515-22 = ""
2001515-23 = ""
2001515-25 = "[ns] «Этот протектор... От него прямо веет стариной...»"
2001515-26 = "Видите ли... это первый протектор для карт, который я когда-либо купила. Я копила все карманные деньги, чтобы его приобрести."
2001515-27 = "Когда я была совсем новичком, я даже не знала, что мне понадобится такая штука."
2001515-28 = "Это было ещё до того, как я поняла, насколько драгоценна каждая отдельная карта, поэтому я хватала карты изо всех сил и мякала их!"
2001515-29 = "Не успела оглянуться, как испортила эти незаменимые сокровища."
2001515-30 = "Я наивно думала, что могу просто... купить их снова!"
2001515-31 = "Не самый достойный момент моей карьеры бойца..."
2001515-32 = "А-а-а! Чем больше об этом думаю, тем меньше понимаю, что тогда творила!"
2001515-33 = "Я аж съёживаюсь, вспоминая своё позорное прошлое, Сенсей!"
2001515-34 = "[s5] «Не переживай. Всё правда нормально!» \n[s6] «Это обычное чувство взросления.»"
2001515-37 = "Я не хочу «взрослеть»! Я хочу уже быть взрослой!"
2001515-38 = "...А? Нетерпение — враг прогресса? Хм... Интересная мысль."
2001515-39 = "...Что значит «как в карточной битве»? Как это?"
2001515-40 = "Да, вы правы, карты лучше разыгрывать в определённом порядке. Но при чём тут...?"
2001515-41 = "Это похоже на то, как я разрушу свою стратегию, если из-за нетерпения начну форсировать ход?"
2001515-42 = "То есть... лучший способ стать настоящей леди — терпеливо дождаться подходящего момента?"
2001515-43 = "Хм... Возможно, вы что-то нащупали!"
2001515-44 = "Вы не перестаёте меня удивлять! Наверное, потому что вы взрослый. Значит, мне нужно просто дождаться своей очереди стать настоящей леди... и тогда я тоже смогу говорить такие крутые вещи, как Сенсей!"
2001515-45 = "[s] «Хорошо. Я буду ждать столько, сколько тебе понадобится.»"
2001515-46 = "Ладно, вернёмся к делу. На многих турнирах вообще не разрешают участвовать без протекторов для карт!"
2001515-47 = "Из-за этого мой столь горячо ожидаемый дебют бойца закончился ничем."
2001515-48 = "Уааа! А я должна была дебютировать в ослепительном сиянии славы бойца!"
2001515-49 = "[s] «Я и не знал, что без протекторов вообще не допускают к боям!»"
2001515-50 = "Ах, подумайте сами, Сенсей! Если у протектора непрозрачная задняя сторона, она закрывает рубашку карты!"
2001515-51 = "Так можно заранее исключить часть способов жульничества, поэтому почти на всех турнирах рукава для карт обязательны."
2001515-52 = "Никогда не забывайте, Сенсей! Карты — сама душа бойца! В них наши воспоминания, мечты и сердца!"
2001515-53 = "Тот, кто не обращается со своими картами с величайшей заботой, вообще не имеет права называться бойцом!"
2001515-54 = "Вот почему протекторы так важны! Это броня бойца!"
2001515-55 = "[s] «Броня бойца. Сильное выражение!»"
2001515-56 = "А! У меня получилось сказать что-то крутое? Прямо как вы, Сенсей? Правда?!"
2001515-57 = "...Думаешь?"
2001515-58 = "Хи-хи... С-Спасибо, Сенсей. Услышать от вас такое..."
2001515-59 = "[s] «Так почему ты настолько сильно любишь „Мушикуин“?»"
2001515-60 = "А... Это вообще-то давняя история..."
2001515-61 = "Если честно, немного неловко рассказывать..."
2001515-62 = ""
2001515-65 = "[ns] «(Как странно слышать от человека возраста Каэдэ слова „давняя история“...)»"
2001515-66 = "Не знаю, знаете ли вы, Сенсей, но вообще-то я из деревни."
2001515-67 = "Наверное, очевидно, но в полях особо нечем заняться! И играть там тоже почти не с чем..."
2001515-69 = "Я ловила раков у реки... или жуков-геркулесов в лесу..."
2001515-70 = "А! Но всё равно было очень весело! Когда я играла с друзьями, время летело незаметно!"
2001515-71 = "Просто... глубоко внутри мне хотелось чего-то ещё. Чего-то более захватывающего! Ещё более увлекательного!"
2001515-73 = "А потом... Я! Познакомилась! С «Мушикуин»!"
2001515-74 = ""
2001515-75 = "У меня голову снесло! На этих картах были изображения жуков-геркулесов! И жуков-оленей!"
2001515-76 = "А главное — это была игра, где игроки по очереди делали ходы и пытались вырвать победу в напряжённой битве!!"
2001515-77 = "Да, поначалу... Ну, я просто не могла не думать: «Как такое вообще возможно?»"
2001515-78 = "Как вообще передать словами то чувство...?"
2001515-79 = "Придумала! Словно открыть совершенно новый континент!"
2001515-80 = "[s] «Невероятная аналогия...»"
2001515-81 = "Но если я так чувствовала, значит так и было, верно?"
2001515-82 = "Подумать только, у игры могли быть тщательно продуманные правила... Это было совсем не похоже на салки!"
2001515-83 = "Если хорошо разобраться во всех правилах, можно понять, как победить!"
2001515-84 = "А ещё лучше то, что даже если проиграешь, всегда можно сыграть снова в следующий раз!"
2001515-85 = "И неважно, кто твой соперник — все играют по одним и тем же правилам! Разве игры не удивительная штука?"
2001515-86 = "Если бы не «Мушикуин»... я могла бы вообще никогда не узнать, что существуют такие игры!"
2001515-87 = "[s] «Знакомство с „Мушикуин“ стало важнейшим моментом твоей жизни, да, Каэдэ?»"
2001515-88 = "А-А? Вы так думаете...?"
2001515-89 = "Я не очень понимаю, что это значит... Но раз Сенсей говорит, значит, в этом есть смысл! Хи-хи-хи."
2001515-91 = "Следующий покупатель! Добро пожаловать!"
2001515-92 = "А! Наша очередь, Сенсей! Пойдём!"
2001515-94 = "Так Каэдэ стала одной из счастливчиков-фанатов «Мушикуин», которым удалось купить лимитированный протектор для карт во временном магазине."
