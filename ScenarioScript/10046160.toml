[translation]
10046160-2 = ""
10046160-3 = "Я долго ждала."
10046160-4 = "Наконец-то настал мой черёд."
10046160-5 = "...Сэя?"
10046160-6 = "Да. Пойдём, Ичика."
10046160-7 = "Нет! А? Куда пойдём?"
10046160-8 = "...? Мы вместе идём патрулировать."
10046160-9 = "Я иду... Но это опасная и изнурительная работа, так что тебе лучше наслаждаться приятным отпуском вон там."
10046160-10 = "А, я всё прекрасно понимаю."
10046160-11 = "Рада."
10046160-12 = "Сэя из Чаепития НЕ МОЖЕТ патрулировать... или, поправка. Сэя слишком квалифицирована, поэтому не может патрулировать."
10046160-13 = "Именно это ты пытаешься мне сказать?"
10046160-14 = "Эм... отчасти. Ты занимаешь очень высокий пост..."
10046160-15 = "Но кто назначил меня Сэей из Чаепития, а тебя — Ичикой из Оперативной группы Правосудия?"
10046160-16 = "...А?"
10046160-17 = ""
10046160-19 = ""
10046160-20 = "Роль — призрак без формы. Если бы мы оказались на необитаемом острове, сохранились бы эти роли?"
10046160-21 = "...А?!"
10046160-22 = "Звания и роли — миражи, созданные общественными нормами. Если бы мы создали общество только из тебя и меня, действительно ли я была бы настолько «выше» тебя?"
10046160-23 = "...ЧТО?!"
10046160-24 = "Все определения были бы относительными. Даже если бы ты не согласилась, пока согласна я, можно сказать, что половина общества поддерживает это мнение."
10046160-25 = "Дискуссия окончена. А теперь идём."
10046160-26 = ""
10046160-28 = ""
10046160-29 = ""
10046160-30 = "...Нет-нет! Это... Что вообще произошло? Ты ничего не объяснила!"
10046160-31 = "Хаха. Как же я соскучилась по работе в поле. Далёкое воспоминание ожило..."
10046160-32 = "Сэя!"
10046160-33 = ""
10046160-35 = ""
