[translation]
10055200-1 = "Мегасуперкраб: грёзы тают, как морская пена"
10055200-2 = ""
10055200-3 = "Сенсей из Шале."
10055200-4 = "Да, это я. Бывший директор ЧВК «Кайзер». Бывший выездной торговый представитель «Октопус-банка»."
10055200-5 = "...Теперь я никто. Просто сам по себе."
10055200-6 = "Но если вы всё ещё зовёте меня директором, Сенсей, то в этот миг я им и буду."
10055200-7 = "Ведь именно ВЫ в этом мире определяете сущность вещей."
10055200-8 = "Думаю, вы уже начали это осознавать."
10055200-9 = "Это не более чем грёза наяву. История, которая просто исчезнет, как пузырёк, поднявшийся к поверхности моря."
10055200-10 = "...Да. Совсем как моя судьба."
10055200-11 = "Когда-то, будучи директором великой корпорации «Кайзер», я держал в руках богатство и власть..."
10055200-12 = "А теперь ничего. Пена на волнах, которую смыло прочь."
10055200-13 = "Понимаете? Всё в этом мире столь же бессмысленно и мимолётно."
10055200-14 = "А, ну вот, я снова принялся оплакивать свою судьбу."
10055200-15 = "Враг, с которым вам предстоит встретиться, — воплощение невозможной мечты. Олицетворение необъятного кошмара."
10055200-16 = "Его зовут Мегатонный Сверхопасный Краб. Сокращённо — Мегасуперкраб."
10055200-17 = "...Послушайте, Сенсей. Это лишь мимолётный сон, навеянный летним зноем. Когда он рассеется, не будет причин когда-либо к нему возвращаться."
10055200-18 = "Что же ценного вы находите в таком месте?"
