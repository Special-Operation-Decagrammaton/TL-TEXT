[translation]
10055200-1 = "MSDC, the projection of a daydream that turns to foam"
10055200-3 = "Sensei of Schale, is it?"
10055200-4 = "Ah... yes, that is me. #nThe former director of Kaiser PMC, and former sales clerk at Octopus Bank."
10055200-5 = "...Now, I am no one. Just myself."
10055200-6 = "But if you still call me 'Kaiser PMC Director,' #nthen for this moment, perhaps that is what I am."
10055200-7 = "After all, the essence of this world is decided by you, Sensei."
10055200-8 = "I believe you have realized it by now..."
10055200-9 = "This is, at its core, a single daydream—a story that would vanish into foam #nif it were to rise to the surface."
10055200-10 = "...Much like myself."
10055200-11 = "Once, as a director of the great Kaiser Group, #nI held all the wealth and power..."
10055200-12 = "But now, it has all come to nothing."
10055200-13 = "The world is... equally worthless, and hollow."
10055200-14 = "...My apologies. I have begun lamenting my own state again."
10055200-15 = "The entity you are about to face is... #nthe peak of a dream that should not exist—a collection of vast nightmares."
10055200-16 = "Its name is the Megaton Super Dangerous Club... or MSDC for short."
10055200-17 = "...Sensei, this is but a fleeting dream brought on by the sweltering heat. #nWhat has passed once will never return."
10055200-18 = "In such a place, what kind of value will you find?"