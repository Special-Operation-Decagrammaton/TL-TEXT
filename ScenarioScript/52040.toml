[translation]
52040-1 = "Эпизод 4;Почётная гостья семьи Кадэнокодзи"
52040-6 = "Семья Кадэнокодзи... моя семья... занимается поддержанием хороших отношений внутри Хяккияко."
52040-7 = "Мы предоставляем удобства и комнаты известным личностям, посещающим Хяккияко, в обмен на... деловые связи и услуги."
52040-8 = "Как раз сейчас в нашем поместье остановилась врач."
52040-9 = ""
52040-12 = ""
52040-13 = "Врач...?"
52040-15 = "Да. Пусть она и не знаменита, но специализируется на мистической медицине. Она не раз мне помогала."
52040-16 = "С тех пор как я отказалась от обязанностей мико, отношения с семьёй стали... немного натянутыми..."
52040-17 = "Но ради твоей руки, Нагуса, я готова стерпеть любое унижение!"
52040-18 = ""
52040-20 = ""
52040-22 = ""
52040-23 = "...Юкари. Прости, но эта рука—"
52040-24 = ""
52040-28 = "О? Вы вернулись, госпожа."
52040-29 = ""
52040-31 = ""
52040-32 = ""
52040-35 = ""
52040-36 = "Мы так переживали, когда вы не отвечали на звонки. Как чудесно снова вас видеть."
52040-37 = "Так вы передумали и решили покинуть этот Совет—"
52040-38 = ""
52040-40 = ""
52040-41 = ""
52040-43 = ""
52040-45 = ""
52040-46 = "...Полагаю, нет."
52040-47 = "Добро пожаловать, друзья моей дорогой госпожи."
52040-48 = "Хяккарёран. С какой целью вы сегодня посетили нашу семью?"
52040-49 = "Знаю, это бесстыдно, но как дочь семьи Кадэнокодзи я хочу кое о чём попросить."
52040-50 = "П-Просьба? Это ваш дом. Разумеется, можете просить о чём угодно."
52040-51 = "Пожалуйста, приведите врача, которая сейчас здесь остановилась."
52040-52 = ""
52040-54 = ""
52040-55 = "Врача? Госпожа, вы ранены?"
52040-56 = "Это для Нагусы, и дело очень личное."
52040-57 = "У неё серьёзная специфическая рана. Пожалуйста, немедленно позовите врача."
52040-58 = ""
52040-60 = ""
52040-61 = "...Поняла. Я немедленно её приведу."
52040-68 = "Немного позже..."
52040-72 = ""
52040-73 = "Госпожа, врач готова вас принять."
52040-74 = ""
52040-77 = ""
52040-78 = "...О боже, пациент?"
52040-79 = ""
52040-81 = ""
52040-82 = ""
52040-83 = "А я думала, что приехала в отпуск..."
52040-84 = "Но в благодарность за щедрость семьи Кадэнокодзи я посмотрю."
52040-86 = "О боже..."
52040-88 = "(Эта женщина кажется знакомой...)"
52040-89 = ""
52040-91 = ""
52040-92 = ""
52040-93 = "Ого...!"
52040-94 = ""
52040-96 = ""
52040-97 = "Что такое, Рэнгэ? Ты её знаешь?"
52040-98 = "Нет... Мне просто нравятся её очки! Как думаешь, где она их купила?"
52040-99 = ""
52040-101 = ""
52040-103 = "Да кому не всё равно?!"
52040-104 = ""
52040-106 = ""
52040-108 = "Взаимно. Я Рику, странствующий врач, путешествующая по Кивотосу."
52040-109 = "В душе я странница и бесконечно благодарна семье Кадэнокодзи за временный дом."
52040-110 = "Пусть мои медицинские методы и необычны, для меня будет честью помочь члену семьи Кадэнокодзи."
52040-111 = "Вы слишком добры."
52040-112 = "Пожалуйста, осмотрите руку моей подруги."
52040-113 = ""
52040-115 = ""
52040-116 = ""
52040-118 = ""
52040-119 = "Хм. Моя специализация — внутренняя медицина, так что не уверена, смогу ли помочь..."
52040-120 = ""
52040-122 = ""
52040-123 = ""
52040-124 = "Но сделаю всё возможное. Теперь, пожалуйста, снимите бинты."
52040-125 = "..."
52040-126 = ""
52040-133 = ""
52040-135 = "Д-Думаете... всё серьёзно, доктор?"
52040-136 = "Вы можете её вылечить или нет?"
52040-137 = ""
52040-139 = ""
52040-141 = "Боже мой...?"
52040-142 = "Болит?"
52040-143 = ""
52040-145 = ""
52040-146 = "...Иногда."
52040-147 = "Тогда это фантомная боль. От фантомной конечности."
52040-148 = ""
52040-150 = ""
52040-151 = "...Фантомной конечности?"
52040-152 = "Да. Возможно, вы слышали? Боль бывает мучительной."
52040-153 = "Нервы не знают, что руки больше нет. Они посылают мозгу сигналы боли... боли в конечности, которой у вас нет и которую нельзя лечить."
52040-155 = "Какого..."
52040-156 = "Проверьте очки! Рука Нагусы прямо перед вами!"
52040-158 = "Нет. Руки пациентки здесь нет."
52040-159 = "Судя по цвету, её ампутировали несколько месяцев назад, и сейчас она лежит заброшенной где-то далеко."
52040-160 = "Возможно, в кромешной тьме мира духов, госпожа Нагуса?"
52040-161 = ""
52040-163 = ""
52040-164 = "...Откуда вы знаете?"
52040-165 = "Как я и сказала, я странница. Путешествовала по всему Кивотосу в поисках необычной медицины."
52040-166 = "В северном районе Хяккияко я обнаружила несколько удивительных растений... и животных."
52040-167 = "И заметила, что тени не способны сосуществовать с живыми клетками. После прикосновения наступает своего рода... смерть."
52040-168 = "Местные называли это «быть пожранным миром духов»."
52040-169 = "...Итак. Вашу руку поглотил мир духов? Вы оставили часть себя на северных землях?"
52040-170 = ""
52040-172 = ""
52040-173 = "...Да. Меня коснулся мир духов."
52040-174 = ""
52040-177 = ""
52040-178 = "Я думала, этот доктор шутит, но она сразу узнала рану."
52040-179 = "...Рэнгэ, осторожнее. Она гостья семьи Кадэнокодзи."
52040-181 = "Очень впечатляет, доктор! Вы невероятно проницательны!"
52040-182 = "Так... что мы можем сделать, чтобы вылечить руку Нагусы?"
52040-183 = ""
52040-185 = ""
52040-186 = "Единственный способ избавиться от фантомной боли — воссоединение."
52040-187 = "Боль будет продолжаться бесконечно, пока вы не найдёте настоящую руку, потерянную в мире духов."
52040-188 = ""
52040-190 = ""
52040-192 = ""
52040-194 = "Вы хотите сказать, что мне нужно вернуться..."
52040-195 = "Другого способа нет?"
52040-196 = "Лёгкая растяжка? Физическая реабилитация может облегчить симптомы, но не устранит причину."
52040-197 = "Есть упражнение, которым один мой старый знакомый поддерживал здоровье. Если хотите, могу прислать видео по почте."
52040-198 = "Спасибо. Буду признательна."
52040-199 = "Госпожа, учтите одну вещь."
52040-200 = ""
52040-202 = ""
52040-203 = ""
52040-205 = "Время лечит не всё. Более того, если упустить момент, иногда время загоняет вас в точку невозврата."
52040-206 = "Не позволяйте робости лишить вас вариантов."
52040-207 = ""
52040-209 = ""
52040-210 = "..."
52040-211 = "Что ж, желаю скорейшего выздоровления."
52040-212 = ""
52040-214 = ""
52040-216 = ""
52040-217 = "Она предлагает нам пришить обратно руку, которую мы и так видим? Она просто... тратила наше время и несла чушь?"
52040-218 = "Если это действительно рана от мира духов, её лечение вполне может лежать за пределами привычной логики."
52040-219 = "Я никогда не слышала, чтобы из мира духов можно было что-то ВЫТАЩИТЬ..."
52040-220 = "Мы считали мир духов и «Сто историй о призраках» простыми сказками, как легенду о Кузунохе... пока не случился Фестиваль фонарей."
52040-221 = ""
52040-223 = ""
52040-225 = ""
52040-226 = ""
52040-227 = "Я хочу рассказать одну историю... свою."
52040-228 = "Я... была с вами не до конца честна."
52040-229 = ""
52040-232 = ""
52040-234 = "Я расскажу о ране... о своём позоре... и о своём провале."
52040-235 = ""
52040-237 = ""
52040-238 = "Расскажу всё. Аямэ... была со мной."
52040-242 = "Следующий эпизод;Тоска за пределами памяти"
