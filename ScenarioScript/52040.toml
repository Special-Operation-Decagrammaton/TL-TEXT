[translation]
52040-1 = "Episódio 4;A Nobre da Família Kadenokouji"
52040-6 = "Nós da família Kadenokouji construímos, desde os tempos antigos,#nlaços de confiança com casas ilustres e organizações de dentro e fora de Hyakkiyako."
52040-7 = "Oferecemos refeições e hospedagem às figuras notáveis que visitam Hyakkiyako#ne, em troca, pedimos auxílio para os assuntos do nosso clã..."
52040-8 = "E, por acaso, um médico a quem devemos muito está hospedado aqui agora mesmo."
52040-13 = "Um médico...?"
52040-15 = "Não é alguém famoso, mas possui uma medicina bastante peculiar...#nNo passado, eu mesma me curei de uma doença graças aos remédios dessa pessoa."
52040-16 = "Não sei se eu, que abandonei meus deveres como sacerdotisa,#nainda posso contar com a ajuda da família Kadenokouji.#nMas..."
52040-17 = "Tudo isso é para que a Nagusa-senpai fique bem novamente!"
52040-23 = "Desculpa, Yukari. Este braço..."
52040-28 = "Oh?#n...Senhorita! A senhorita voltou?!"
52040-36 = "Estávamos tão preocupados sem notícias suas.#nQue alívio ver que a senhorita está bem!"
52040-37 = "Se voltou, quer dizer que vai retomar seus deveres como sacerdotisa—"
52040-46 = "—Pelo visto, não é bem esse o caso."
52040-47 = "Sejam muito bem-vindas, amigas da senhorita."
52040-48 = "Ouvi dizer que o Comitê de Mediação de Conflitos Hyakkaryouran anda muito ocupado...#nO que as traz até aqui?"
52040-49 = "Vim como membro da família Kadenokouji para fazer um pedido.#nSei bem que é ousadia da minha parte, mas..."
52040-50 = "Um pedido...? Basta dar a ordem e, imediatamente—"
52040-51 = "Gostaria de pedir a ajuda do médico que está hospedado em nossa casa."
52040-55 = "A-A senhorita está ferida...?!"
52040-56 = "Quem precisa ser examinada é esta minha senpai."
52040-57 = "O ferimento é urgente. Por favor, eu lhe imploro."
52040-61 = "...Entendido. Vou chamar o médico imediatamente."
52040-68 = "(Algum tempo depois...)"
52040-73 = "Senhorita, trouxe o médico."
52040-78 = "...Ora, então esta é a paciente de emergência?"
52040-83 = "Hmm, eu pretendia dar um tempo na preparação de remédios, mas..."
52040-84 = "Devo muito à família Kadenokouji, então—#nPois bem, vou dar uma mãozinha."
52040-86 = "Oh!"
52040-88 = "(Essa aparência... eu já vi em algum lugar...)"
52040-93 = "Ah!"
52040-97 = "Renge, você reconheceu de algum lugar?"
52040-98 = "Que óculos irados...!"
52040-103 = "É nisso que você reparou?!"
52040-108 = "Prazer em conhecê-las, integrantes do Hyakkaryouran.#nSou um médico viajante que estuda medicina por toda Kivotos — podem me chamar de Riku."
52040-109 = "Por certos motivos, eu estava sem lugar para ficar,#ne a família Kadenokouji teve a gentileza de me acolher."
52040-110 = "Não sei se serei de grande ajuda,#nmas se puder retribuir essa gentileza, ficarei feliz em emprestar minha força."
52040-111 = "Muito obrigada...!"
52040-112 = "O que gostaríamos que examinasse é o braço dela."
52040-119 = "Opa... um ferimento externo?#nMinha especialidade é clínica geral, mas—"
52040-124 = "Vamos dar uma olhada. Poderia tirar as ataduras?"
52040-125 = "..."
52040-135 = "Não importa quantas vezes eu veja... é um ferimento terrível."
52040-136 = "Qual é o seu diagnóstico?"
52040-141 = "Ora, ora, que interessante..."
52040-142 = "Você sente dor no braço?"
52040-146 = "...Às vezes."
52040-147 = "Nesse caso, trata-se do que chamamos de dor fantasma."
52040-151 = "...Dor fantasma?"
52040-152 = "Sim, é um tipo de distúrbio neurológico."
52040-153 = "Quando uma parte do corpo é perdida ou amputada,#nos nervos periféricos da área afetada recebem estímulos falsos,#ncausando dores intensas em um membro que nem deveria existir..."
52040-155 = "Mas..."
52040-156 = "O braço da Nagusa-senpai está bem ali..."
52040-158 = "Não, o braço não está aqui."
52040-159 = "Pelo que vejo... foi decepado há alguns meses#ne hoje está abandonado em algum lugar distante — algo assim."
52040-160 = "Por exemplo... em meio a uma escuridão insondável — no \"Crepúsculo\", talvez?"
52040-164 = "...Como você sabe disso?"
52040-165 = "Eu viajo por toda Kivotos coletando ingredientes medicinais."
52040-166 = "A fauna e a flora selvagens mudam de forma e propriedades conforme o ambiente em que nascem e crescem.#nPorém, as que cresciam na \"Região Autônoma do Norte\" de Hyakkiyako#npossuíam uma característica peculiar."
52040-167 = "À primeira vista pareciam ervas comuns, mas na verdade estavam mortas mesmo estando vivas —#num estado semelhante a uma \"sombra\", sem nenhum sopro de vida."
52040-168 = "Os moradores locais disseram: \"Aquilo foi engolido pelo Crepúsculo.\""
52040-169 = "...Não seria esse também o caso do seu braço?"
52040-173 = "...É. Este ferimento é uma marca do Crepúsculo."
52040-178 = "Então não é charlatão, não..."
52040-179 = "...Renge. Estamos diante de um convidado da família Kadenokouji. Olha os modos."
52040-181 = "Descobrir a causa tão rápido... não esperava menos de um grande médico!"
52040-182 = "E então... o que precisamos fazer para curar o braço da Nagusa-senpai?"
52040-186 = "Só existe uma maneira de curar completamente a dor fantasma: recuperar a parte do corpo que foi perdida."
52040-187 = "Até que recupere o seu braço, essa dor provavelmente vai continuar para sempre."
52040-194 = "No fim das contas, não tem jeito... eu tenho mesmo que ir lá."
52040-195 = "Não existe nenhum outro método...?"
52040-196 = "Não passa de um paliativo... mas dizem que exercícios físicos ajudam a aliviar a dor."
52040-197 = "Tenho uma conhecida que vive acamada#ne começou a fazer uma ginástica para cuidar da saúde.#nDepois eu envio o vídeo para vocês."
52040-198 = "Obrigada. Vou assistir."
52040-199 = "Mas, por favor, mantenha uma coisa em mente."
52040-205 = "O tempo não vai curar esse ferimento.#nPelo contrário, quanto mais o momento certo for adiado,#nmais ele se tornará incurável, corroendo seu corpo e sua mente."
52040-206 = "Eu realmente não recomendo deixar isso para depois."
52040-210 = "..."
52040-211 = "Estimo melhoras."
52040-217 = "\"Recuperar o braço\" sendo que ele tá bem ali? Isso lá é charada...?"
52040-218 = "Mas, como a Nagusa-senpai disse, se o ferimento foi causado pelo Crepúsculo,#ntratamentos comuns não vão surtir efeito, não é?"
52040-219 = "Eu tampouco jamais ouvi falar de um método para recuperar algo engolido pelo Crepúsculo..."
52040-220 = "Afinal, até mesmo o \"Crepúsculo\" e o \"Hyakumonogatari\",#naté aquele dia, eu achava que eram como a Kuzunoha-sama —#napenas contos de fadas."
52040-227 = "Ei... tem uma história que eu quero que vocês ouçam."
52040-228 = "Tem uma coisa... que eu ainda não contei para ninguém."
52040-234 = "O que aconteceu naquele dia... que eu tinha vergonha e medo demais para contar."
52040-238 = "O que aconteceu entre mim e a Ayame.#nVocês podem... ouvir tudo?"
52040-242 = "Próximo;A Admiração Além das Memórias"
