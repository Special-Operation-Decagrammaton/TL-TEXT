[translation]
1001109-1 = "Сладкий дневной сон"
1001109-4 = ""
1001109-5 = "Комната отдыха Сада цветущей сливы"
1001109-6 = ""
1001109-7 = "Боже, Сенсей. Ты вообще высыпаешься? У тебя мешки под глазами."
1001109-8 = "Как бы сильно Шале ни загружало тебя, отдыхать всё равно нужно."
1001109-9 = "Придумала. Студенты Сада цветущей сливы сейчас на улице, так почему бы тебе не вздремнуть здесь?"
1001109-10 = "Всё в порядке. Спи, а я обязательно разбужу тебя до возвращения детей."
1001109-11 = ""
1001109-12 = ""
1001109-13 = "Если продолжишь сопротивляться... мне придётся крепко тебя обнять и силой уложить спать!"
1001109-14 = ""
1001109-15 = "Хи-хи. Вот так, хороший Сенсей. Дневной сон полезен для здоровья. Ложись сюда, на одеяло."
1001109-16 = ""
1001109-17 = ""
1001109-19 = "Я спою тебе колыбельную."
1001109-20 = "Баю-бай, Сенсей, на верхушке дерева... Ветер подует — колыбель покачнётся..."
1001109-23 = "Ветка сломается — колыбель упадёт..."
1001109-27 = "― Ох. Ты проснулся.[wa:1020]"
1001109-30 = "― Сегодня... было очень приятно. Хи-хи.[wa:2980]"
1001109-33 = "― Ой. Детям уже пора возвращаться.[wa:340]"
1001109-35 = "― Тебе пора идти?"
1001109-38 = "― Нет... хи-хи. Отдохни ещё немного, Сенсей.[wa:4340]"
1001109-40 = "― Не беспокойся о сегодняшнем занятии... Я тебя подменю.[wa:10]"
1001109-43 = "― Ох... Какой же ты милый. Хи-хи.[wa:3740]"
1001109-46 = "Ну как ты? Отдохнул?"
1001109-47 = "[s] «Намного лучше, но мне уже пора вставать.»"
1001109-48 = "Глупости, Сенсей. Полежи ещё немного."
1001109-49 = "Я не хочу отказываться от этого драгоценного момента... То есть я хочу, чтобы ты ещё чуть-чуть отдохнул."
1001109-50 = "Кстати, я тоже сегодня плохо спала. Может, и мне прилечь?"
1001109-51 = "Тогда споёшь теперь мне колыбельную, Сенсей?"
1001109-52 = "И погладишь меня по голове, пока я не усну? Я хочу слышать твой тёплый голос, пока не провалюсь в сон."
1001109-53 = "Дети? Ой, точно. Наверное, раз они скоро вернутся, мне всё-таки стоит не спать?"
1001109-54 = ""
1001109-55 = ""
1001109-56 = "Хотя, думаю, сегодня я заслужила право немного полениться."
1001109-57 = "Пока что считай меня ещё одним сонным студентом в своём классе."
