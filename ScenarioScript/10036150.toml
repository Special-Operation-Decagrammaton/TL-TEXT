[translation]
10036150-1 = "Как Отряд развлекается: игра 3"
10036150-2 = ""
10036150-3 = "Боже мой! Вы и средний уровень прошли без ошибок!"
10036150-4 = "Вы уже совсем близко к призу!"
10036150-5 = "Кажется, я начинаю понимать, как это работает."
10036150-6 = "Хотя наверняка самое сложное они приберегли напоследок."
10036150-7 = "Возникает вопрос: после этого можно будет сыграть ещё раз?"
10036150-8 = "Извините, одна попытка на посетителя."
10036150-9 = "Если бы мы позволяли всем пробовать снова и снова, призы уже давно бы закончились."
10036150-11 = "Значит, это раунд «пан или пропал»."
10036150-12 = "Ну, по крайней мере всё понятно."
10036150-13 = "Начнём?"
10036150-14 = ""
10036150-16 = ""
10036150-17 = ""
10036150-18 = ""
10036150-19 = ""
10036150-20 = "...Хм, Сао-Сао? Что случилось? Ты какая-то мрачная..."
10036150-21 = ""
10036150-23 = ""
10036150-24 = "Тебе случайно не плохо?"
10036150-25 = "Н-Ничего."
10036150-26 = "Просто жаль, что мы не можем продолжать играть вот так."
10036150-27 = "Да, действительно давно мы все вместе так не веселились."
10036150-29 = "Ага..."
10036150-30 = "..."
10036150-31 = "...Хи-хи, значит, сегодня вечером нужно повеселиться ещё сильнее! Чтобы потом ни о чём не жалеть."
10036150-32 = ""
10036150-34 = ""
10036150-35 = "Ни о чём не жалеть... Ладно."
10036150-36 = "Такая ночь бывает только раз. Давайте насладимся ей по полной."
10036150-38 = "Все готовы?"
10036150-39 = "Давайте выиграем последний раунд и заберём приз для Хиёри!"
10036150-40 = "Ага!"
10036150-41 = "Раз уж мы зашли так далеко, придётся и мне подыграть..."
10036150-42 = "Х-Хи-хи, спасибо вам всем..."
10036150-43 = ""
10036150-45 = ""
10036150-46 = "Хотя мы ещё не победили..."
10036150-47 = "Верно, и легко не будет!"
10036150-48 = "Это продвинутый уровень, финальный раунд!"
10036150-49 = "Смогут ли наши участницы заполучить желанный приз?"
10036150-50 = "Или всё закончится поражением?"
10036150-52 = "Сейчас узнаем!"
