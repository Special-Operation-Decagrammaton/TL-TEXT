[translation]
80000136-1 = "Я сделала!"
80000136-2 = "Офис Шале"
80000136-3 = "Вернувшись из командировки, я обнаружил в офисе нечто новое."
80000136-4 = ""
80000136-7 = "В углу стояла... масса... неупакованного шоколада."
80000136-8 = ""
80000136-11 = "И я примерно догадывался, кто её поставил..."
80000136-12 = "[ns] «...Рицу?»"
80000136-13 = "Да! Верно!"
80000136-14 = "Мой особый шоколад-сюрприз! Специально для Сенсея!"
80000136-15 = "С Днём святого Валентина, Сенсей!"
80000136-16 = "[s] «Спасибо, Рицу!»"
80000136-17 = "Хи-хи."
80000136-18 = "Кстати, Сенсей, как вы поняли с одного взгляда?"
80000136-19 = "Ну, что это от меня?"
80000136-20 = "[ns] «Как можно было не понять?»"
80000136-21 = ""
80000136-23 = ""
80000136-25 = "[ns] «...Этот шоколад больше офисного холодильника!»"
80000136-26 = "Аха...!"
80000136-27 = "Вообще-то вам не нужно об этом переживать, Сенсей!"
80000136-28 = "[s] «Хм? О чём переживать?»"
80000136-29 = "ЭТОТ шоколад не нужно класть в холодильник!"
80000136-30 = "Даже в самую жаркую летнюю погоду!"
80000136-31 = "Потому что..."
80000136-32 = "Этот шоколад! Никогда не растает!"
80000136-33 = "[s1] «Неплавящийся шоколад?!»\n[s2] «Что же ты сотворила с его химическим составом...?!»"
80000136-36 = "Ха! Если интересно, почему бы не потрогать?"
80000136-37 = "Как предложила Рицу, я провёл пальцами по поверхности."
80000136-38 = "[ns] «Э-Это...!»"
80000136-39 = "Хи-хи, ну как? Разгадали тайну?"
80000136-40 = "[s] «Да, уверен, он никогда не растает.»"
80000136-41 = ""
80000136-44 = "[ns] «...Потому что этот шоколад сделан из камня...!»"
80000136-45 = "Верно! Я нашла коричневый мрамор и вырезала его!"
80000136-46 = "Ну как? Что думаете?"
80000136-47 = "[s3] «Он невероятно точный.»\n[s4] «Я правда принял его за шоколад...»"
80000136-50 = "Хи-хи, вот это комплимент!"
80000136-51 = "Хм? «Как это вообще возможно»?"
80000136-52 = "Подойдите ближе, Сенсей."
80000136-53 = "Я объясню все детали!"
80000136-55 = "И я осматривал разные части шоколада(?) и слушал объяснения Рицу."
80000136-56 = "Но у меня всё ещё оставалось несколько ДРУГИХ вопросов..."
80000136-58 = ""
80000136-59 = "[ns5] «...Как ты попала в офис, Рицу?»\n[ns6] «Я уверен, что охранная система включена...»"
80000136-62 = "Ага? Но в вентиляционных шахтах никакой охраны нет!"
80000136-63 = ""
80000136-67 = "...После возвращения Рицу в Вайлдхант я заказал модернизацию системы безопасности."
