[translation]
80000133-1 = "Пока не вспомнишь прошлую жизнь"
80000133-2 = "Ещё один день, заполненный работой в Шале..."
80000133-3 = ""
80000133-6 = ""
80000133-7 = "Здравствуйте, Сенсей..."
80000133-8 = "[s] «О, Каноэ! Зачем позвонила? Всё хорошо?»"
80000133-9 = "Э-хе-хе-хе..."
80000133-10 = "Причина, почему я связалась с вами... Неужели именно вы ещё не поняли?"
80000133-11 = "Ведь нас... связывает красная нить судьбы..."
80000133-12 = "[s] «Это из-за... шоколада?»"
80000133-13 = "Верно."
80000133-14 = "И не просто шоколада, а очень милого шоколадного маффина..."
80000133-15 = "Я приготовила его с любовью... и расплавляла особые ингредиенты в алхимической печи."
80000133-16 = "Ну как? Хотите попробовать...?"
80000133-17 = "[s] «Да! Твои блюда всегда вкусные!»"
80000133-18 = "Да. Именно этого ответа я ждала."
80000133-19 = "Хи-хи, э-хе-хе-хе...!"
80000133-20 = "[s1] «Мм, но скоро мне нужно отправляться в командировку.»\n[s2] «Можно я встречу тебя на обратном пути и попробую?»"
80000133-23 = "...Лучше прямо сейчас."
80000133-24 = "[s] «П-Прямо сейчас? Но до отъезда всего около тридцати минут...»"
80000133-25 = "Не волнуйтесь..."
80000133-26 = "Я знала, что так будет... Поэтому уже всё подготовила."
80000133-27 = "Кар! Ка-а-ар...!"
80000133-28 = "[ns] «Э-Это же...?!»"
80000133-29 = ""
80000133-31 = ""
80000133-32 = ""
80000133-33 = ""
80000133-34 = "...Я знала, что так будет."
80000133-35 = "Хи-хи... Я действительно способная женщина."
80000133-36 = "[s] «К-Когда ты успела сюда прийти?!»"
80000133-37 = "Сейчас это неважно."
80000133-38 = "На самом деле важно... лишь то, что я сейчас перед вами."
80000133-39 = "Тогда, пожалуйста, закройте глаза...?"
80000133-40 = "Её взгляд был полон ожидания."
80000133-41 = "Я решил сделать, как она сказала."
80000133-42 = ""
80000133-46 = "Хи-хи... Подождите ещё совсем немного..."
80000133-47 = ""
80000133-50 = "Кар! Ка-каар!"
80000133-51 = ""
80000133-53 = "Мяу! Мя-яу!"
80000133-54 = "[ns] «Ты притащила сюда ЕЩЁ животных...?»"
80000133-55 = "Наверное, их привлёк запах."
80000133-56 = "Но этот особый маффин... только для вас, Сенсей..."
80000133-57 = "А вы, остальные, уходите. Для вас я приготовлю потом..."
80000133-58 = ""
80000133-63 = "Хорошо. Теперь можете открыть глаза..."
80000133-64 = ""
80000133-66 = ""
80000133-67 = ""
80000133-68 = "Сенсей..."
80000133-69 = "[ns3] «К-комната изменилась...?»\n[ns4] «Каноэ, здесь всё такое милое...!»"
80000133-72 = "Вот, возьмите. В нём... мои чувства к вам, Сенсей."
80000133-73 = ""
80000133-75 = ""
80000133-76 = ""
80000133-77 = "Я... правда хотела поделиться с вами особым шоколадом."
80000133-78 = "Он должен помочь вам восстановить воспоминания... о прошлой жизни..."
80000133-79 = "...Я делала вам нечто очень похожее, если сможете вспомнить."
80000133-80 = "Пожалуйста, попробуйте..."
80000133-81 = "Мой... особый маффин...!"
80000133-82 = "[s] «...!!»"
80000133-83 = "Будто зачарованный, я положил шоколадный маффин Каноэ в рот...!"
80000133-84 = ""
80000133-87 = ""
80000133-88 = "Ну как? Вкусно?"
80000133-89 = "[s] «Просто потрясающе...!»"
80000133-90 = "А...!"
80000133-91 = "Я знала! Знала, что вам понравится, Сенсей!"
80000133-92 = ""
80000133-94 = ""
80000133-95 = ""
80000133-96 = "..."
80000133-97 = "...Хи-хи. Э-хе-хе-хе."
80000133-98 = "Сенсей принял меня... Теперь ритуал завершён."
80000133-99 = "Теперь вы навеки мой...! Э-хе-хе-хе...!"
80000133-100 = "Теперь... скажите. Кто я?"
80000133-101 = "Кем я была для вас в прошлой жизни...?"
80000133-102 = "[ns5] «Милый котёнок...!»\n[ns6] «Умный маленький ворон...!»"
80000133-105 = ""
80000133-106 = "...Наверное, этого недостаточно для завершения ритуала."
80000133-107 = "Тогда вам нужно продолжать есть, пока не вспомните..."
80000133-108 = "Я испекла довольно много... на случай, если так и случится."
80000133-110 = "Мы с Каноэ весело ели вкусные шоколадные маффины, пока мне не пришло время отправляться в командировку."
80000133-111 = "К сожалению, никаких воспоминаний прошлой жизни я так и не вспомнил..."
80000133-112 = ""
80000133-115 = ""
80000133-116 = ""
80000133-117 = "Но... всё хорошо..."
80000133-118 = "Мы повторим это ещё несколько раз..."
80000133-119 = "Хи-хи. Э-хе-хе-хе...!"
