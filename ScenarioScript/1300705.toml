[translation]
1300705-1 = "Бедный гурман"
1300705-2 = "Исполнительный офис Шале"
1300705-4 = ""
1300705-5 = "Я вернулась..."
1300705-6 = "Уф. Это расследование было ужасным. Я так ждала шведского стола с безлимитной вагю."
1300705-7 = "Почему никто не сказал, что сегодня они закрыты?! Откуда мне было знать?!"
1300705-8 = "Я специально почти не ела в обед, чтобы оставить место для пулькоги. Уф, я умираю с голоду..."
1300705-9 = "У тебя случайно нет чего-нибудь поесть, Сенсей? Я такая голодная..."
1300705-10 = "[s] «Как раз есть кое-что прямо здесь...»"
1300705-11 = "Правда? Дай посмотреть... куриная лапша Митошин?"
1300705-12 = "Я слышала об этой марке, но никогда не пробовала. Это же та лапша быстрого приготовления, которую кладёшь в стакан и заливаешь кипятком, да?"
1300705-13 = "Я знаю, что сказала, будто умираю с голоду, но я всё-таки гурман. Есть дешёвую лапшу быстрого приготовления как-то..."
1300705-14 = "[s] «Никто не заставляет. Всё нормально.»"
1300705-15 = "Я-я не говорила, что не хочу! Отдай обратно!"
1300705-16 = "Хм. Положить лапшу в стакан, залить кипятком и ждать три минуты..."
1300705-17 = "Тут даже нет отдельной основы для бульона или гарнира. Это просто не может быть вкусно..."
1300705-18 = ""
1300705-19 = ""
1300705-20 = ""
1300705-21 = "(Что за...?! Вкусно!)"
1300705-22 = "(Обжаренная лапша упругая, почти al dente. Не верю своим вкусовым рецепторам...)"
1300705-23 = "(И к тому же сочетание лапши и соуса ДЕЙСТВИТЕЛЬНО создаёт насыщенный бульон... Это превосходит самые смелые ожидания!)"
1300705-24 = "[s] «Ну? Что скажешь?»"
1300705-25 = "Н-Ну, съедобно, пожалуй! Хотя до высоких стандартов такого гурмана, как я, далеко! Х-Хаха!"
1300705-26 = "И вообще, этим едва ли можно насытиться. У тебя случайно нет ещё?"
1300705-27 = "Н-Не пойми неправильно! Я прошу добавки не потому, что мне понравилось!"
1300705-28 = "Мне просто нужны калории! Не вздумай всё переворачивать!"
1300705-30 = "После этого Джунко прикончила ещё две порции куриной лапши."
