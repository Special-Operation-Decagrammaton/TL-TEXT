[translation]
1601806-1 = "Руки капитана"
1601806-2 = "Сенсей, тебе не надоедает всё время так бегать?"
1601806-3 = "А если упадёшь и поранишься? Кожа у тебя такая нежная."
1601806-4 = "[s] «Я не могу заставлять моего драгоценного студента ждать!»"
1601806-5 = "(Д-Драгоценного студента...)"
1601806-6 = "Ничего особенного."
1601806-7 = "Погода хорошая. Может, прогуляемся?"
1601806-9 = "И вот она подошла ко мне, выпятила грудь и сказала..."
1601806-10 = "«Капитан! Сначала вам придётся пройти через меня!»"
1601806-11 = "...Ну я и прошла! Видел бы ты это!"
1601806-13 = "А в другой раз у меня шлем треснул. Хорошо, что я вообще была в нём, конечно!"
1601806-14 = "И хотя у нас на всех едва наскребается лишняя йена, они всё равно накопили денег. Отнесли его в ремонт!"
1601806-15 = "Так что да! Я забочусь о своей команде. Естественно. Они не все плохие."
1601806-17 = "...А потом она вернулась — все руки в синяках, губа рассечена..."
1601806-18 = "И я такая: «Где они?! Я им сейчас покажу...»"
1601806-19 = "Хм? Это что?"
1601806-20 = "[s] «Похоже на уток.»"
1601806-21 = "Такие маленькие. Обычно я даже не отличаю их от гусей."
1601806-22 = "Но у этой дамочки есть характер, да?"
1601806-23 = "И... за ней шесть маленьких утят. Ох."
1601806-24 = "[s1] «Но разве эти утята не...»\n[s2] «...идут прямо к канализационной решётке?»"
1601806-27 = "Точно!"
1601806-28 = "А! Маленькие утята провалились!"
1601806-29 = "Эй, мамаша! Осторожнее! Ты должна была понимать, что твои малыши слишком маленькие! Следить надо!"
1601806-30 = "*вздыхает* Ладно, ничего не поделаешь."
1601806-31 = "Сенсей, подними решётку!"
1601806-32 = ""
1601806-40 = "― [log=라브]Раз, два, три, четыре, пять, шесть. Отлично! [/log][wa:6000]"
1601806-42 = "― [log=라브]Спасли всех шестерых![/log]"
1601806-45 = "― [log=라브]Тебе стоит слушаться маму, [/log][wa:10]"
1601806-47 = "― [log=라브]хорошо? [/log][wa:10]"
1601806-50 = "― [log=라브]Мама-утка, похоже, тоже теперь в порядке,[/log][wa:690]"
1601806-52 = "― [log=라브]так что ещё одна проблема решена![/log][wa:910]"
1601806-55 = "[ns] «Ты не совсем обычный студент, Рабу.»"
1601806-56 = "― [log=라브]Ч-Ч-Ч-Что ты такое говоришь?![/log][wa:1070]"
1601806-58 = "― [log=라브]Сенсей, это разве не немного грубо? [/log][wa:440]"
1601806-61 = "― [log=라브]А?... А?! Это...[/log][wa:4600]"
1601806-64 = "[ns] «Я имела в виду, что ты похожим образом руководишь Бандой Шлемов.»"
1601806-65 = "― [log=라브]А-а! Так вот что ты имела в виду! [/log][wa:1720]"
1601806-68 = "― [log=라브]Конечно, у лидера [/log][wa:620]"
1601806-70 = "― [log=라브]тоже должна быть сострадательная сторона! [/log][wa:10]"
1601806-73 = "― [log=라브](Сенсей специально это делает?)[/log][wa:1930]"
1601806-75 = "― [log=라브](Может, она просто неловкая?)[/log]"
1601806-78 = "― [log=라브](Даже если так, меня это бесит.)[/log]"
1601806-80 = "― [log=라브](Но если это нарочно — ещё хуже!) [/log][wa:10]"
1601806-83 = "― [log=라브](...Не может же быть, что это было специально... Правда...?)[/log][wa:2940]"
1601806-87 = "Ладно, давайте теперь держаться травы!"
1601806-88 = "И в следующий раз смотрите, куда идёте!"
1601806-89 = "Так, о чём мы там говорили?"
1601806-90 = "Я уже рассказывала, как мы втроём разобрались с сотней головорезов?"
1601806-91 = "[s] «Кстати, тебе нормально ходить в этом шлеме?»"
1601806-92 = ""
1601806-94 = ""
1601806-95 = "[ns3] «Ты ведь понимаешь, что засунула туда утят...»\n[ns4] «Из... канализации?»"
1601806-98 = "!"
1601806-99 = "Ты худшая, Сенсей! Ненавижу тебя!"
1601806-100 = ""
1601806-102 = ""
1601806-104 = "Рабу поспешно сняла шлем и убежала в парк."
