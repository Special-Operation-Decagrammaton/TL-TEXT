[translation]
83306060400-5 = ""
83306060400-6 = "Акари! Передашь приправу?"
83306060400-7 = "Держи, Изуми! ★"
83306060400-8 = "М-м-м! Спасибо! Соус из морского огурца — именно то, что нужно, чтобы сделать этот мисо-суп ещё вкуснее!"
83306060400-9 = "Все студенты, которые пробовали его раньше, попадали в обморок — настолько он вкусный!"
83306060400-10 = "Хм-хм-хм! Мы делимся особым рецептом Изуми! Это спасение для всех голодных студентов!"
83306060400-11 = "Всё идёт идеально!"
83306060400-12 = "Ага! Мы уже вырубили всех, кто мог помешать нам захватить Клуб школьных обедов! ★"
83306060400-13 = ""
83306060400-15 = ""
83306060400-17 = ""
83306060400-18 = "Как я и подозревала, виновник этого переполоха — снова Общество гурманов."
83306060400-19 = "А? Хина?! Почему глава префектов здесь?"
83306060400-20 = "Ох ты, нас уже раскрыли?"
83306060400-21 = "Что именно вы здесь делаете?"
83306060400-22 = "М-мы просто хотели накормить голодных студентов в столовой чем-нибудь вкусным..."
83306060400-23 = "Ну и, конечно, поделиться едой, которую приготовила Изуми."
83306060400-24 = "Мы помогаем другим студентам пройти тяжёлый, но достойный путь гурмана! ★"
83306060400-25 = "Именно! Хорошей еды много не бывает!"
83306060400-26 = "И поэтому каждый студент в столовой сейчас валяется без сознания."
83306060400-27 = "...Прошу прощения, но веселье закончено. Пострадавших уже достаточно."
83306060400-28 = "Что?! Я ещё даже толком не распробовала!"
83306060400-29 = "А, Изуми... Похоже, наша миссия заканчивается здесь."
83306060400-30 = "Жаль, что не смогу увидеть финал вместе с тобой, но я, пожалуй, удалюсь. Удачи!"
83306060400-31 = ""
83306060400-33 = ""
83306060400-35 = "А-а! Акари?! Акари! Н-не бросай меня! Какая же ты злая!!"
83306060400-36 = ""
83306060400-38 = ""
83306060400-39 = ""
83306060400-41 = "*вздыхает* Они всегда устраивают хаос с такими по-детски простыми намерениями."
83306060400-42 = "В первую очередь нужно заняться пострадавшими."
