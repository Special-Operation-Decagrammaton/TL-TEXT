[translation]
10014020-1 = "Эпизод 2; Хотя бы раз или два"
10014020-2 = "Вот школьные ворота. Теперь я в безопасности."
10014020-3 = "Наш Апостол справедливости не станет устраивать сцену в школе."
10014020-4 = "Эм..."
10014020-5 = "Я этого не планировала, но выходит, вы вроде как проводили меня сюда."
10014020-6 = "Простите за неудобства."
10014020-7 = "И... спасибо за помощь."
10014020-8 = "[s1] «...Ты дружелюбная, но вежливая, Казуса.»\n[s2] «Ты хорошо разделяешь дела и личное.»"
10014020-9 = "А-А? П-Правда?"
10014020-10 = "А-А? Разделяю...? П-Правда?"
10014020-11 = "То есть с учителем ведь именно так и нужно разговаривать, да?"
10014020-12 = "В любом случае, ещё раз спасибо за время. Встретимся позже."
10014020-13 = "Хм?"
10014020-14 = "Что насчёт моего прошлого? Почему я должна как-то особенно относиться к тому, что рассказала вам?"
10014020-15 = "О, хулиганки?"
10014020-16 = "Думаете, я хотела скрыть своё прошлое с ними...?"
10014020-17 = ""
10014020-19 = ""
10014020-20 = "О... Понятно."
10014020-21 = "Ну, не то чтобы я хожу и хвастаюсь этим."
10014020-22 = "Но это правда, и изменить её я не могу."
10014020-23 = "Я бы не стала прямо скрывать это, но... неприятно вспоминать."
10014020-24 = "Вся эта история раздражает... как и Рейса."
10014020-25 = "Хотелось бы, чтобы она хоть попыталась посмотреть на всё с моей стороны, но она вообще не изменилась."
10014020-26 = "Мы уже в старшей школе... Почему нельзя просто двигаться дальше?"
10014020-27 = "Надеюсь, она скоро повзрослеет. Иначе навсегда останется ребёнком."
10014020-28 = "Будто она считает, что мы всё ещё дети, которые играют в средней школе. Она не может забыть."
10014020-29 = "Я просто не понимаю почему, понимаете? Я правда пытаюсь двигаться дальше и начать сначала."
10014020-30 = "[s] «...»"
10014020-31 = "...?"
10014020-32 = "Что? Я сказала что-то не то?"
10014020-33 = "А?"
10014020-34 = "Почему я перестала быть хулиганкой?"
10014020-35 = "Эм... Это..."
10014020-36 = "П-Почему вы хотите знать? Я просто... перестала, понимаете?"
10014020-37 = "Быть хулиганкой — это... просто..."
10014020-38 = ""
10014020-40 = ""
10014020-41 = ""
10014020-42 = ""
10014020-43 = ""
10014020-44 = ""
10014020-45 = ""
10014020-46 = ""
10014020-47 = "Да какая вообще разница?! Разве странно, что я хотела завязать?!"
10014020-48 = "У каждого есть что-то в прошлом, что хочется оставить позади."
10014020-49 = "Люди бывают шпионами, грабителями банков, агентами под видом горничных или даже самопровозглашёнными ниндзя..."
10014020-50 = "Они выбирают самые разные пути. Я тоже захотела."
10014020-51 = "[s3] «О, теперь я понимаю, о чём ты.»\n[s4] «...Наверное, в этом есть смысл.»"
10014020-52 = "Именно. Я всего лишь один обычный случай среди бесчисленных других."
10014020-53 = "Именно. Я всего лишь обычный случай среди бесчисленных других."
10014020-54 = "Все взрослеют, когда приходит время. Так что больше никаких вопросов о прошлом!"
10014020-55 = "Это немного... неловко, понимаете?"
10014020-56 = ""
10014020-59 = "О! Звонок."
10014020-60 = "Мне нельзя опаздывать, Сенсей. Увидимся позже."
10014020-61 = "Спасибо за помощь сегодня. Мне уже намного легче."
10014020-62 = "Серьёзно, спасибо."
10014020-63 = "Ну... до следующего раза."
10014020-64 = ""
10014020-66 = ""
10014020-67 = "......"
10014020-68 = "[ns] «...Отряд линчевателей.»"
10014020-69 = ""
10014020-76 = "Немного рановато. До готовности ещё далеко."
10014020-77 = ""
10014020-80 = ""
10014020-81 = "Я удивилась, когда вы внезапно со мной связались."
10014020-82 = "О, нет. Никакой обузы. Для меня честь, что вам понадобилась моя помощь."
10014020-83 = "Я многим вам обязана."
10014020-84 = "Ничего обещать не могу, но постараюсь помочь."
10014020-85 = "А? О, у меня сейчас нет занятий."
10014020-86 = "У нас у всех расписания различаются в зависимости от курса и класса."
10014020-87 = "Так что вы хотели спросить?"
10014020-88 = "Член Отряда линчевателей? О. Так вот зачем я вам понадобилась."
10014020-89 = "Я постараюсь, но Отряд линчевателей не официальная организация."
10014020-90 = "Мы добровольно патрулируем и защищаем район, поэтому никакого отбора нет."
10014020-91 = "Участники мало знают о прошлом, мотивах или текущих обстоятельствах друг друга."
10014020-92 = "А?"
10014020-93 = "Узава Рейса?"
10014020-94 = "[s5] «Кажется, я видел вас вместе.» \n[s6] «Ты ведь знаешь Рейсу?»"
10014020-95 = "А. Значит, опять Рейса."
10014020-96 = "А. Значит, опять Рейса."
10014020-97 = "Простите, если она доставила проблемы. Надеюсь, ничего серьёзного."
10014020-98 = "[s7] «Погоди, ты сказала „опять“...?»\n[s8] «Почему ты сразу предполагаешь неприятности?»"
10014020-99 = "Она не плохой человек. У неё добрые намерения, и она добра почти до крайности."
10014020-100 = "Она не плохой человек. У неё добрые намерения, и она добра почти до крайности."
10014020-101 = "...Но чрезмерное рвение может быть и благословением, и проклятием."
10014020-102 = "Хотя я удивлена. Я думала, рядом с вами Рейса хотя бы будет осторожнее."
10014020-103 = "О? Не вам она доставляет неприятности?"
10014020-104 = "Я смогу лучше помочь, если буду понимать ситуацию. Все детали не нужны, только суть."
10014020-105 = "[ns] Объяснить текущую ситуацию."
10014020-106 = ""
10014020-107 = ""
10014020-108 = "...Понятно."
10014020-109 = "К сожалению, это очень в стиле Рейсы. Уж чего-чего, а настойчивости ей не занимать."
10014020-110 = "Хотя это многое мне прояснило. Я думала, что неплохо знаю этих хулиганок."
10014020-111 = "Но, похоже, мой взгляд на мир был слишком узким. Они студенты, такие же как мы."
10014020-112 = "...Но вернёмся к теме. Она перестала быть хулиганкой. Почему Рейса всё ещё бросает ей вызов?"
10014020-113 = "У неё ведь и правда нет причин бросать вызов бывшей хулиганке... Может, дело просто в соперничестве? Мне кажется, здесь что-то ещё."
10014020-114 = "Но гадать незачем. Давайте спросим её прямо."
10014020-115 = "У меня есть номер Рейсы. Если скажу, что вы её ищете, она сразу придёт."
10014020-116 = "Как вы прекрасно знаете, она из тех, кто сначала действует, а потом думает."
10014020-117 = "Сейчас ей напишу..."
10014020-118 = ""
10014020-121 = "О, от кого это сообщение?"
10014020-122 = "...От Рейсы?"
10014020-123 = "[s9] «Рейса связалась с тобой первой?»\n[s10] «Что происходит?»"
10014020-124 = "Э-э-э..."
10014020-125 = "Э-э-э..."
10014020-126 = "...Просьба о подкреплении."
