10002030-18 = "Какого...?!"
10002030-20 = "Что это такое, Азуса? Почему ты внутри крепости?! Она же огромная!"
10002030-21 = "Ты попросила меня сделать песчаный замок — я его и сделала. Нет такой атаки, которую он не выдержит."
10002030-22 = "Я имела в виду обычный песчаный замок!"
10002030-23 = "Меня беспокоило открытое пространство пляжа и отсутствие укрытий, поэтому это идеальная защита."
10002030-24 = "Здесь мы будем защищены от нападения."
10002030-25 = "Я на стороне Азусы. Эта позиция, которую она построила, прекрасно подойдёт, чтобы отстреливать любого врага, который попытается приблизиться."
10002030-26 = "Маширо?! И ты тоже в этом участвовала?! Ты помогала ей строить?!"
10002030-27 = ""
10002030-29 = ""
