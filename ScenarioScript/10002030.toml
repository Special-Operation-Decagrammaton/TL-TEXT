10002030-36 = "Нет. Это минимальный размер, который всё ещё обеспечивает достаточную защиту от вражеской атаки."
10002030-37 = "Всё-таки он из песка. Но с такой высокой наблюдательной позиции всё должно быть нормально."
10002030-40 = "После этого мы сфотографировали Маширо и Азусу."
10002030-42 = "*вздыхает* Ну, по крайней мере эти двое нашли общий язык."
10002030-43 = "Н-но мы должны веселиться! Мы же на пляже!"
10002030-44 = "Вряд ли на нас снова вот так нападут..."
