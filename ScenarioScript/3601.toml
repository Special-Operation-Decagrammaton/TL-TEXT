[translation]
3601-1 = "Сладость и ностальгия 1"
3601-2 = "*вздыхает*"
3601-3 = "Объявляю сегодняшнее утреннее собрание открытым."
3601-4 = "Если у кого-то есть новости или вопросы, прошу высказываться."
3601-5 = "Да, президент Нагиса. Для начала: вчера вечером на улице возле кафе произошла перестрелка."
3601-6 = "Свидетели подтвердили, что спор возник из-за того, кому достанется клубника на вершине десерта из ограниченного меню."
3601-7 = ""
3601-9 = ""
3601-10 = "Клубника...?"
3601-11 = "Из-за одной клубники... такой конфликт?"
3601-12 = "Вице-президент Отряда справедливости Хасуми была не на службе, поэтому отправили президента Цуруги. Она успешно подавила конфликт."
3601-13 = "...Если это была президент Цуруги, значит Рыцарям спасения пришлось несладко."
3601-14 = "Ага, столько банок — то есть студентов — оказалось помято, что Рыцари спасения оказывали экстренную помощь всю ночь."
3601-15 = ""
3601-17 = ""
3601-18 = "Принято к сведению. Рыцари спасения наверняка израсходовали немало припасов..."
3601-19 = "Пожалуйста, напомните Рыцарям подать отчёт о чрезвычайных расходах, если им понадобится пополнить запасы."
3601-20 = ""
3601-22 = ""
3601-23 = ""
3601-24 = "Подойдите. Что у вас за доклад?"
3601-25 = "Это касается уже упомянутых Рыцарей спасения..."
3601-26 = "Произошёл инцидент: несколько пациентов в панике сбежали, увидев медицинскую бензопилу в наборе для лечения..."
3601-27 = "...из-за чего лечебную комнату пришлось полностью закрыть."
3601-28 = "Ух... Зачем они таскают с собой эту жуткую штуку...? *вздох*"
3601-29 = "...В таком случае проведите полную проверку медицинского оборудования Рыцарей спасения."
3601-30 = ""
3601-32 = ""
3601-33 = ""
3601-34 = "Что ж... Есть что-нибудь ещё?"
3601-35 = "В час ночи несколько свидетелей сообщили, что видели обнажённого студента, слонявшегося по крыше главного корпуса."
3601-36 = "Хотя её заметили лишь несколько человек, уже распространяются слухи, будто это был призрак. Возможно, нам придётся на это отреагировать."
3601-37 = "..."
3601-38 = "Фу-фу..."
3601-39 = "Обнажённую... говорите?"
3601-40 = "Посреди ночи... На крыше... Обнажённую..."
3601-41 = "Вы так... уверены, что это был не фантом? Не призрак?"
3601-42 = "Мисс Нагиса...?"
3601-43 = "Я бы действительно... очень предпочла... чтобы это оказался призрак..."
3601-44 = "И что мне тогда делать? Как мне вообще на это реагировать? Это выше моих сил! Голая! Голыми руками!"
3601-45 = "...Хи-хи."
3601-46 = "Хи-хи... Хи-хи-хи... Хи-хи-хи-хи..."
3601-47 = ""
3601-49 = ""
3601-51 = "Мисс Нагиса?!"
3601-52 = "Она отключилась! Девушка выбыла!"
3601-54 = "Рыцари! Ты, позови Рыцарей спасения! Быстро!"
3601-56 = "Наги потеряла сознание от переработки?!"
3601-57 = "Да. Если точнее, ей поставили диагноз «выгорание»."
3601-58 = "К счастью, с физическим здоровьем проблем нет, но..."
3601-59 = "...я налила ей обычный холодный чёрный чай из ПЛАСТИКОВОЙ бутылки, а она вообще не возразила."
3601-61 = "Что? Погоди, это звучит серьёзно!"
3601-62 = "Именно. Ей прописали обязательный отпуск вдали от работы в надежде, что отдых восстановит её психическое состояние."
3601-63 = "«Восстановит психическое состояние»..."
3601-64 = "Может, десерты из ограниченного меню помогут? Сейчас сезон клубники!"
3601-65 = "...Судя по протоколу собрания, это может сделать только хуже."
3601-66 = "Главный приоритет — оттащить Нагису подальше от работы."
3601-67 = "Она не отдохнёт, пока остаётся в школе."
3601-68 = "Хм-м, значит, нам нужно найти место, где Наги сможет расслабиться... за пределами Тринити."
3601-69 = "Да. Думаю, так будет лучше всего."
3601-70 = "Хорошо..."
3601-71 = "За пределами Тринити... Место, которое понравится Наги... Освежающее..."
3601-72 = "Ах!"
3601-74 = "Мика?"
3601-75 = "Давайте поедем в Шаньхайцзин!"
3601-76 = "В академию Шаньхайцзин...? Почему?"
3601-77 = "На окраине Шаньхайцзин есть знаменитая мастерская чёрного чая!"
3601-78 = "Я слышала, если записаться на экскурсию, можно участвовать в дегустации и смешивании чая!"
3601-79 = "Наги любит чёрный чай, да и занятие творческое... Думаю, ей станет лучше!"
3601-80 = "...Давненько ты не предлагала ничего настолько логичного, Мика."
3601-81 = "Хм? Что значит «давненько»?"
3601-82 = "Сэя, и что ты вообще обо мне думаешь...?"
3601-83 = "Признаю, идея хорошая."
3601-84 = "Правда? Правда?"
3601-85 = "Тогда как мы туда доберёмся...?"
3601-86 = "Я бы избегала общественного транспорта. Наги вымотана, и нам лучше держать её подальше от толпы."
3601-87 = "Может, возьмём служебную машину из общего гаража Чайная партия?"
3601-88 = "Для неё нужны водитель и сопровождающий..."
3601-89 = "...а они только напомнят ей о работе."
3601-90 = "Хм-м, тогда как насчёт..."
3601-91 = "Поедем на моём скутере."
3601-92 = "У меня есть подходящая коляска, в которой вы обе легко поместитесь."
3601-93 = "Ого! Давненько я не видела, как ты водишь!"
3601-94 = "Хорошо! Я забронирую экскурсию в мастерской."
3601-95 = "Да, спасибо, Мика."
3601-96 = "Ладно, тогда оздоровительный тур Наги..."
3601-98 = "...начинается!"
