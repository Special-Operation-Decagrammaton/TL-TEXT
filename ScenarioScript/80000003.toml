[translation]
80000003-1 = "Закуски главного офицера"
80000003-2 = "Приёмная Генерального Студенческого Совета"
80000003-3 = "Вот вы где, Сенсей. Спасибо, что пришли."
80000003-4 = "Уверена, вы знаете, зачем я вас позвала... верно?"
80000003-5 = "[s] «Кажется, догадываюсь.»"
80000003-6 = "Хорошо. Очень хорошо."
80000003-7 = "В отличие от отчёта, который Шале сдал вчера. Быстрее было бы разобрать то, что вы умудрились сделать правильно, чем все ошибки."
80000003-8 = "В нём было множество ошибок и, по какой-то причине, к задней странице оказался прикреплён чек из магазина игрушек."
80000003-9 = "Давайте разберём всё по порядку и исправим... хорошо?"
80000003-10 = "[s] «Д-Да, мэм...»"
80000003-15 = "Мне пришлось исправлять отчёт, пока Рин указывала на каждую допущенную мной ошибку."
80000003-18 = "Хорошо. Исправленная версия почти готова."
80000003-19 = "Теперь подпишите здесь и здесь..."
80000003-20 = "[s] «*зевок*...»"
80000003-21 = ""
80000003-23 = ""
80000003-24 = "Вы, должно быть, устали, Сенсей."
80000003-25 = "Что такое? Вы мало спали прошлой ночью из-за обязанностей в Шале?"
80000003-26 = "Это объясняет такой небрежный почерк."
80000003-27 = "Поддерживать здоровый режим сна — тоже часть ваших обязанностей.#nЕсли засиживаться допоздна ради работы, проблема станет только хуже."
80000003-28 = "Если сейчас главное — не уснуть, можете воспользоваться сахаром или кофеином, чтобы продержаться день."
80000003-29 = "Подождите здесь минутку. Посмотрю, какие закуски есть в комнате отдыха."
80000003-30 = ""
80000003-32 = ""
80000003-34 = "Боюсь, у нас остался только этот шоколад."
80000003-35 = "Вот. Возьмите, Сенсей."
80000003-36 = ""
80000003-38 = ""
80000003-39 = "Почему вы так на меня смотрите? Это всего лишь кусочек шоколада.#nНе понимаю, почему вы улыбаетесь."
80000003-40 = "[s] «Потому что, ну... Сегодня же...»"
80000003-41 = "Сегодня? А что сегодня?"
80000003-42 = "Сегодняшняя дата..."
80000003-43 = "..."
80000003-44 = "...!"
80000003-45 = "Я совершенно НЕ это имела в виду!"
80000003-46 = "Я просто хотела, чтобы вы восстановили силы, закончили бумаги#nи как можно скорее ушли."
80000003-47 = "[s] «Ну, если ты так говоришь...»"
80000003-48 = "Именно так я и говорю. А теперь закончите отчёт и можете идти."
80000003-49 = "[s] «Да, мэм...»"
80000003-50 = "..."
80000003-51 = "Честное слово. Я НЕ это имела в виду..."
80000003-52 = "[s] «Я услышал тебя с первого раза...»"
80000003-55 = "Я закончил с бумагами в неловкой тишине."
