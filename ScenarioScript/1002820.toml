[translation]
1002820-1 = "Переполох с кроличьим хвостиком"
1002820-2 = "Я отправился в Миллениум к Асуне, хотя мы так и не договорились, где встретимся."
1002820-3 = "Ура! Господин! Я здесь!"
1002820-4 = "Как только я пришёл на площадь, то увидел Асуну вдалеке. Как обычно, она притягивала к себе все взгляды."
1002820-5 = "Я вас ждала, Господин! Вы ведь пришли ко мне, да?!"
1002820-6 = "Я по вашему лицу вижу! Я так рада!"
1002820-7 = "А?"
1002820-8 = "Зачем я с вами связалась?"
1002820-9 = "Хм... Зачем..."
1002820-10 = "...Я забыла! Наверное, это было неважно!"
1002820-11 = "[s1] «Х-Хорошо. Значит, всё в порядке...»\n[s2] «Ты выглядишь как обычно... Какое облегчение.»"
1002820-12 = "Хахаха! Что вы имеете в виду? Ваши ответы всегда такие забавные!"
1002820-13 = "Хахаха! Что вы имеете в виду? Ваши ответы всегда такие забавные!"
1002820-14 = "Моя одежда? Почему я это надела?"
1002820-15 = "Хм. Особой причины не припомню. Просто захотелось!"
1002820-16 = "Раз уж у меня есть этот наряд, надо его носить, правда? А почему вы спрашиваете?"
1002820-17 = "А, хвост? Вы уже видели, как я его бросаю?"
1002820-18 = "Ага! Было дело! Люди так удивляются, когда узнают, что это граната!"
1002820-19 = "А? Этот тоже граната?"
1002820-20 = ""
1002820-22 = ""
1002820-23 = "Хм-м, не знаю! Как думаете, Господин?"
1002820-24 = "Если хотите... почему бы вам самим не выяснить?"
1002820-25 = ""
1002820-29 = "...О!"
1002820-30 = "Ахахаха! Какая жалость, Господин! Вы пытались украсть мой хвост? Не-не! Сначала надо угадать, а уже потом проверять!"
1002820-31 = "Или хотите поиграть в догонялки? Хотите быть «водящим»?"
1002820-32 = "Ладно, я убегаю! Поймайте меня, если сможете!"
1002820-33 = ""
1002820-35 = ""
1002820-37 = "В моей руке оказалась булавка, похожая на чеку..."
1002820-38 = ""
1002820-41 = "[ns] «...»"
1002820-43 = "[ns3] «Ч-Чека?!»\n[ns4] «Асуна! Асуна! Подожди, стой!»"
1002820-46 = ""
1002820-47 = "Ахахаха! Господин, вы слишком медленный! Я быстрый кролик!"
1002820-48 = ""
1002820-50 = ""
1002820-52 = "Я отчаянно гнался за Асуной, но выбился из сил и рухнул."
1002820-54 = "Я лежал на земле, пытаясь отдышаться, когда Асуна вернулась ко мне."
1002820-55 = "Господин, вы что делаете? Уже устали? А я ещё хочу играть!"
1002820-56 = "...Господин, что случилось...?"
1002820-57 = "А?"
1002820-58 = "Граната...?"
1002820-59 = "Хи-хи! Хвост — не граната!"
1002820-60 = "...Господин? Почему у вас такое лицо?"
1002820-61 = "Это просто кроличий хвост."
1002820-62 = "[s5] «...? Это не граната?»\n[s6] «Но тогда что насчёт этой чеки...?»"
1002820-63 = "...Чека? О чём вы?"
1002820-64 = "Что ты имеешь в виду?"
1002820-65 = "...А? Это мой брелок для ключей."
1002820-66 = "Господин, вы подумали... что этот брелок — чека?"
1002820-67 = ""
1002820-69 = ""
1002820-70 = "...ХА!"
1002820-71 = "Уахахаха! Господин, вы такой нелепый! С вами всегда так весело!"
1002820-72 = "Хватит быть таким подозрительным! Обещаю, всё безопасно!"
1002820-73 = "Я никогда вам не врала, Господин!"
1002820-74 = "А?"
1002820-75 = "Всё равно хотите сами проверить, на всякий случай? Ахахаха! Ну что это такое?!"
1002820-76 = "Хм-м... Что же делать? Думаю!"
1002820-77 = "...Хм! Ладно!"
1002820-78 = "Раз уж вы сегодня так меня развлекали, разрешу потрогать мой хвост!"
1002820-79 = ""
1002820-81 = ""
1002820-82 = ""
1002820-83 = ""
1002820-84 = ""
1002820-85 = "Вот, Господин. Потрогайте. Видите? Это правда просто хвост."
1002820-86 = "Ахаха! Хватит, хватит, Господин! Щекотно!"
1002820-87 = "[s7] «Фух... Да. Это просто хвост.»\n[s8] Вздохнуть с облегчением и рухнуть."
1002820-88 = ""
1002820-89 = ""
1002820-92 = ""
1002820-93 = "...Хм? Господин?"
1002820-94 = "Господин?"
1002820-95 = "Вы спите, Господин?"
1002820-96 = ""
1002820-98 = ""
1002820-99 = "...Хорошо!"
1002820-100 = "Тогда я тоже вздремну рядом с вами!"
1002820-101 = ""
1002820-103 = ""
1002820-105 = "Когда я проснулся, то лежал рядом с Асуной прямо посреди улицы."
1002820-106 = ""
1002820-109 = "На нас странно поглядывали прохожие, поэтому я быстро разбудил Асуну и ушёл..."
