10029085-12 = ""
10029085-13 = "Вы... закончили...?"
10029085-14 = "Не хочется признавать, но... сохранять порядок становится всё труднее...!"
10029085-15 = "Шокухо...?!"
10029085-16 = "Ещё немного...!"
10029085-17 = "...Готово!"
10029085-18 = "Хорошо. Чип установлен, соединения восстановлены. Теперь остаётся только включить оборудование."
10029085-19 = "Спасибо, что подождали! А теперь, без лишних церемоний...!"
10029085-20 = "Я активирую оборудование!"
10029085-21 = ""
10029085-23 = ""
10029085-25 = "...!"
10029085-26 = "...!"
10029085-27 = "...!"
10029085-28 = "...!"
10029085-29 = "[ns1] «Оно включается...!»\n[ns2] «Звук совсем не такой, как раньше...!»"
10029085-32 = ""
10029085-33 = "...?!"
10029085-34 = "Ч-Что?! Снова этот свет...!"
10029085-35 = "*ахает*"
10029085-36 = ""
10029085-38 = ""
10029085-40 = ""
10029085-41 = "Ч-Что...?!"
10029085-42 = ""
10029085-44 = ""
10029085-46 = ""
10029085-47 = "Э-э...?!"
10029085-48 = ""
10029085-50 = ""
10029085-53 = "Свет... Он...!"
10029085-54 = "...Успех. Оборудование восстанавливает нормальное состояние между двумя мирами."
10029085-55 = "Все, кого перенесло сюда, будут отправлены обратно туда, откуда они изначально прибыли."
10029085-56 = "Ого... Мы правда справились...?"
10029085-57 = "Хи-хи. Да. Честно говоря, я не думала, что это сработает..."
10029085-58 = "Нет лучшей мотивации, чем ограничение по времени! Это явление можно объяснить восприятием времени!"
10029085-59 = "Восприятие времени, конечно же, означает психологическое ощущение времени человеком, формируемое органами чувств и мозгом. В отличие от других чувств, оно основано на общем объёме информации..."
10029085-61 = "Значит, всё? Оно отправляет нас обратно?"
10029085-62 = "Не похоже, что меня куда-то отправляют..."
10029085-64 = "Они меня игнорируют..."
10029085-66 = "Они и правда быстро привыкли к нашему миру."
10029085-67 = "Всё идёт по плану. Оборудование работает в обратном порядке. Тот, кто пришёл первым, уйдёт последним."
10029085-68 = "Как и сказала Президент, вас вернут точно в тот момент, когда вы были перенесены из своего мира. Никаких воспоминаний об этом месте у вас не останется."
10029085-69 = "Даже огнестрельное оружие, которое вы держите..."
10029085-70 = "О."
10029085-71 = "То есть... Мы не можем забрать его с собой?"
10029085-72 = "Нет. Оно не было перенесено сюда этим оборудованием, поэтому останется здесь."
10029085-73 = "Хм... Понятно..."
10029085-74 = "Какая жалость. Я надеялась взять домой какие-нибудь сувениры."
10029085-75 = "Как я уже объясняла, произошедшее здесь не будет иметь для вас никакого значения. Ни воспоминаний, ни доказательств."
10029085-76 = "В вашем мире ничего из этого никогда не происходило и не существовало."
10029085-77 = "Ха-ха... Д-Да, это правда..."
10029085-78 = ""
10029085-80 = ""
10029085-81 = "...Ну..."
10029085-82 = "И ничего страшного, разве нет? Ведь нам было весело!"
10029085-83 = "...?"
10029085-84 = "...А?"
10029085-85 = "Да, мы ничего не вспомним, но это ведь не значит, что наш визит сюда был ненастоящим, верно? К тому же он останется в памяти Сенсея и Эйми..."
10029085-86 = "К-Конечно, я не знаю, были ли эти дни для Эйми весёлыми... или просто раздражающими! Ха-ха-ха!"
10029085-87 = "...А!"
10029085-88 = "Кстати... Можно я сделаю вот так...?"
10029085-89 = ""
10029085-91 = ""
10029085-92 = ""
10029085-93 = ""
10029085-94 = "Это..."
10029085-95 = "Я просто хочу попросить... Можешь сохранить это для меня?"
10029085-96 = "Как напоминание о том, как здорово мы здесь провели время!"
10029085-97 = "Мы здорово провели время...? Я не против, но..."
10029085-98 = "[s3] «Конечно. Мы сохраним это.»\n[s4] «Я рад, что вам было весело.»"
10029085-101 = "Сенсей...?"
10029085-102 = "...!"
10029085-103 = "Спасибо, Сенсей!!"
10029085-104 = ""
10029085-106 = ""
10029085-107 = "Я ничего из этого не понимаю, но ладно. Сделаем, как ты просишь."
10029085-108 = "Спасибо, Эйми!!"
10029085-109 = "А вы как, Мисака? Шокухо? Раз уж всё равно не можем забрать оружие с собой, давайте оставим его нашим новым друзьям!"
10029085-110 = "В каком-то смысле это будет доказательством того, что мы здесь побывали! Разве не здорово?"
10029085-112 = "Конечно... Но мне бы не хотелось оставлять им лишнюю обузу..."
10029085-113 = "*вздыхает*"
10029085-114 = "Думаю, можно. В конце концов, присмотреть за такой вещью не так уж сложно."
10029085-115 = "Должна признать, последние несколько дней были куда спокойнее обычного... Пожалуй, потеряться в другом мире — не такая уж плохая вещь."
10029085-116 = "...Хотя под конец у меня всё-таки немного разболелась голова."
10029085-117 = ""
10029085-119 = ""
10029085-120 = ""
10029085-121 = ""
10029085-122 = "Хм..."
10029085-123 = "Даже без воспоминаний, без доказательств... Вы говорите, что это всё равно не будет бессмысленным..."
10029085-124 = "[s5] «Иногда жизнь устроена именно так.»\n[s6] «Порой ты ничего не помнишь ИМЕННО потому, что слишком хорошо повеселился.»"
10029085-127 = "Не знаю насчёт этого, но..."
10029085-128 = "Если Сенсей так сказал, уверена, однажды я это пойму."
10029085-129 = "Если оставить такую возможность..."
10029085-130 = "Мы сохраним всё это для вас."
10029085-131 = "Отлично!"
10029085-132 = "Что ж..."
10029085-133 = "О, этот свет..."
10029085-134 = "[s7] «Похоже, настала твоя очередь.»\n[s8] «Думаю, пришло время прощаться.»"
10029085-137 = "Похоже на то! Хи-хи... Я пойду первой!"
10029085-138 = "Огромное спасибо вам, ребята из Инженерного отдела!"
10029085-139 = ""
10029085-141 = ""
10029085-142 = ""
10029085-144 = "Теперь уже по-настоящему...!"
10029085-145 = "Я отлично провела время!"
10029085-146 = ""
10029085-148 = ""
10029085-150 = ""
10029085-151 = "Прощайте."
10029085-152 = ""
10029085-154 = ""
10029085-156 = ""
10029085-157 = "...До свидания."
10029085-158 = "[s9] «Береги себя, Мисака.»\n[s10] «Счастливого пути.»"
10029085-159 = ""
10029085-160 = ""
10029085-162 = ""
10029085-163 = ""
10029085-164 = ""
10029085-167 = "...Они ушли?"
10029085-168 = "После всей этой суеты вдруг стало очень тихо."
10029085-169 = "Потому что остались только... мы и оборудование."
10029085-170 = "Я даже слышу эхо наших голосов! Всё это уже почти не кажется реальным!"
10029085-172 = "Оборудование..."
10029085-173 = ""
10029085-175 = ""
10029085-176 = ""
10029085-177 = ""
10029085-178 = "...Хм?"
10029085-180 = "Этот звук..."
10029085-181 = "[s11] «Оно издаёт какие-то странные звуки...»\n[s12] «Будто что-то рвётся...?»"
10029085-184 = "О."
10029085-185 = "Оборудование выходит из-под контроля. Такими темпами оно скоро взорвётся, и вся эта область обрушится."
10029085-186 = "О, логично. Наверное, им уже очень давно так активно не пользовались, а мы ещё и запустили его в обратном режиме..."
10029085-187 = "Погодите... Ты только что сказала..."
10029085-188 = "...вся эта область..."
10029085-189 = "...обрушится?"
10029085-190 = "[s13] «...Что?»\n[s14] «Звучит серьёзно!»"
10029085-193 = "Верно. Нам нужно бежать."
10029085-194 = "...Или мы могли бы использовать оборудование, чтобы попасть в безопасное место."
10029085-195 = "Нет, забудьте. Оно настроено на обратный режим и теперь может только притягивать объекты сюда."
10029085-196 = "Нужно спешить. Все за мной."
10029085-197 = "Мы тут говорили, что было взрывно весело, но это уже слишком буквально!"
10029085-198 = "[s15] «Вообще-то мы сюда пришли не развлекаться...»\n[s16] «Поговорим потом! Сначала бежим!»"
10029085-201 = "А-а-а-а!"
10029085-202 = ""
10029085-204 = ""
10029085-205 = ""
10029085-214 = "После безумного рывка нам удалось выбраться прежде, чем объект самоуничтожился."
10029085-215 = ""
10029085-218 = "Как только мы благополучно вернулись в Миллениум, все тут же рухнули от усталости..."
10029085-221 = ""
10029085-222 = "Хи-хи."
10029085-223 = "Какая весёлая была пара дней. Столько всего интересного произошло..."
10029085-224 = "Не знаю, как вы, Сенсей, но передо мной открылся целый новый мир возможностей."
10029085-225 = "Вот почему я не могу отказаться от исследования руин Миллениума."
10029085-227 = "Некое научное свидетельство юности"
