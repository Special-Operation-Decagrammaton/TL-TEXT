[translation]
10021005-3 = "Сенсей! Ковчег Атрахасиса вот-вот самоуничтожится!"
10021005-4 = "Остальные студенты уже в пути. Но пока они не прибудут, нам придётся здесь, на Троне Нарам-Сина, в одиночку сдерживать Широко из альтернативной линии времени и Френапатеса!"
10021005-5 = "Это может быть наша последняя битва! Нужно выложиться полностью!"
10021005-6 = "Удачи, Сенсей!"
