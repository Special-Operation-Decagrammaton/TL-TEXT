[translation]
221060-1 = "Episode 6;Curiosity Killed the Cat..."
221060-2 = "(From the next day on, whenever I found some free time, I would drop by Odyssey and watch the #nstudents and Sammy play together.)"
221060-3 = "(Sammy was loved everywhere she went, but--)"
221060-6 = "Phew... laundry is done!"
221060-7 = "There is so much... it took like three hours just to hang it all up."
221060-8 = "Couldn't you wash things a little at a time before it piled up like this?"
221060-9 = "No way. Water usage is restricted while we are at sea. #nWe couldn't just wash bedding."
221060-10 = "Since we are finally back on land and can use fresh water as much as we want, #nwe have to wash all this piled-up clothing at once--"
221060-12 = "Meow~"
221060-13 = "Ah, it is Sammy."
221060-14 = "Hey, how are you doing?"
221060-15 = "We hardly ever see you lately. Even when we find you, you are just taking a nap."
221060-16 = "Well, it cannot be helped. Look at her age."
221060-17 = "Meow..."
221060-20 = "Achoo, achoo..."
221060-21 = "A-Are you okay? Does something hurt?"
221060-26 = "........."
221060-27 = "She left."
221060-28 = "Lately, I have no idea what Sammy is thinking."
221060-29 = "...I mean, I hope she is okay."
221060-30 = "What do you mean?"
221060-31 = "You know... that old saying about how a cat coughing brings a storm."
221060-32 = "Sammy has been coughing a lot lately... I have a bad feeling about this..."
221060-38 = "Whoa, a squall!"
221060-39 = "Don't tell me this is because Sammy coughed!?"
221060-40 = "This is no time to be talking about that! Hurry up and bring in the bedding!"
221060-44 = "We just washed it... Now we have to do it all over again..."
221060-48 = "Gangway in front of the Cruise Management Department flagship Golden Elysium"
221060-50 = "Alright, attention! Atten-tion!"
221060-51 = "Starting today, we will resume loading foods with short expiration dates."
221060-52 = "Especially today, there are many heavy items, so please be careful not to injure yourselves."
221060-53 = "Understood, Manager!"
221060-54 = "If anyone drops or spills anything because they were fooling around--"
221060-55 = "You will be playing a game of Russian roulette with me and my automatic pistol, #nso be prepared, alright?"
221060-56 = "...Understood!"
221060-58 = "Next up... 5 cases of bottled milk, coming through!"
221060-59 = "5 cases of bottled milk, received!"
221060-64 = "...Hm? #nDid something just scurry past?"
221060-68 = "Meow."
221060-69 = "Oh, it is just Sammy."
221060-70 = "Sammy, that is the handrail, it is dangerous."
221060-71 = "Even jumping looks tough for you lately. #nIf you were to slip in a place like that--"
221060-72 = "Meow~"
221060-77 = "Yikes!?"
221060-78 = "Hey, Sammy!? #nThat way is--"
221060-87 = "...I told you to be careful, didn't I?"
221060-88 = "If you want to place bets with me that badly... then I suppose I have no choice."
221060-89 = "It is a misunderstanding! What just happened was Sammy--"
221060-94 = "...Sammy? Don't tell me she ran away...?"
221060-95 = "Ugh... As expected, whenever a cat falls, nothing good ever comes of it!"
221060-97 = "(Whenever something bad happened while Sammy was around, #nthe Odyssey students would instinctively connect the two.)"
221060-98 = "(Sammy being far too curious was partly to blame, though...)"
221060-100 = "Trident flagship Rhodes, upper deck area"
221060-104 = "Alright everyone, deck cleaning will now begin!"
221060-105 = "I am sure many of you first-years are doing this for the first time after entering port, but stay sharp! #nThis is not just washing with water!"
221060-106 = "A deck constantly exposed to sea breezes will rust if not cleaned regularly! #nThat translates directly to a drop in our combat readiness!"
221060-107 = "For the honor of Trident, polish every nook and cranny until it shines! #nUnderstood!?"
221060-108 = "Yes!"
221060-109 = "...Wait, why is Sumika acting as the captain? #nDoes she think this is the Harpy?"
221060-110 = "No way... Is she trying to take the supervisor role just because deck cleaning is a pain--"
221060-111 = "There is no way that is true!"
221060-112 = "For this kind of group work, having someone oversee the overall progress ensures nothing gets missed!"
221060-113 = "Is there some problem with me taking on that role?"
221060-114 = "Is it really necessary for Sumika to do it?"
221060-115 = "There is no reason not to do it!"
221060-116 = "Come on, come on! The ship is rusting even as we stand here. #nLet us get to cleaning already!"
221060-117 = "Yes, yes~"
221060-123 = "Wow! Bubbles!"
221060-124 = "Must be because we mixed in powdered soap. So many bubbles are coming out."
221060-125 = "So pretty..."
221060-126 = "Come to think of it... whenever we clean like this, customers without fail--"
221060-131 = "Sammy!"
221060-132 = "What is it, did you come to play with the bubbles?"
221060-133 = "Sorry, but we are not playing right now. #nCould you step aside for a little bit?"
221060-137 = "You over there, stop chatting and focus on cleaning--"
221060-138 = "Meow!?"
221060-139 = "Whoa!?"
221060-144 = "[ns] \"Look out!\""
221060-150 = "[ns1] \"Just in time...\".\n[ns2] \"Are you hurt?\""
221060-153 = "Sensei!?"
221060-154 = "Thank you so much...! #nThanks to you, I managed not to fall into the ocean...!"
221060-155 = "Sammy suddenly slipped right in front of me, so I panicked..."
221060-156 = "[ns] \"The floor gets slippery during cleaning, so you have to be careful.\""
221060-160 = "Yes... I am sorry..."
221060-161 = "And... Sensei, that was a huge impact just now... Are you alright?"
221060-162 = "[ns] \"Of course! This is nothing--\""
221060-166 = "[ns3] \"My back... hurts...\".\n[ns4] \"I cannot... put any force into my legs...\""
221060-170 = "Sensei!?"
221060-175 = "Next Episode;A Restless Waiting Period"
