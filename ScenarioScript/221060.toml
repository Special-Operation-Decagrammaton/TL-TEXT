[translation]
221060-1 = "Episódio 06;A Curiosidade Matou o Gato..."
221060-2 = "（A partir do dia seguinte, passei a visitar a Odisseia sempre que encontrava um intervalo na agenda,#nobservando as alunas brincando com o Sammy pelo navio.）"
221060-3 = "（Por onde quer que passasse, o Sammy era mimado e coberto de afeto, mas...）"
221060-5 = ""
221060-6 = "Ufaaa... finalmente terminei de estender a roupa!"
221060-7 = "Nossa senhora, quanta coisa acumulada... ficamos três horas inteiras só pendurando pano nos varais!"
221060-8 = "Não dava pra ter lavado um pouquinho de cada vez antes de acumular essa montanha?"
221060-9 = "Claro que não, né criatura! Em alto-mar o racionamento de água doce é rígido demais.#nLavar acolchoado e edredom grosso era impensável."
221060-10 = "Agora que voltamos pra terra firme e a água da torneira tá liberada,#ntemos que lavar tudo que tá entulhado de uma vez só――"
221060-12 = "Myaau～"
221060-13 = "Olha só, é o Sammy!"
221060-14 = "Oi, lindão! Como você tá hoje?"
221060-15 = "Fazia um tempão que eu não te via acordado! Sempre que te acho, tá tirando uma soneca."
221060-16 = "Ah, dá um desconto pro bichinho, olha a idade dele!"
221060-17 = "Myaaawn......"
221060-18 = ""
221060-20 = "Cof, cof, cof......"
221060-21 = "E-Ei, tudo bem?! Tá sentindo falta de ar?!"
221060-22 = ""
221060-26 = "............"
221060-27 = "Ué... já foi embora."
221060-28 = "Ultimamente tá tão difícil saber o que passa pela cabecinha do Sammy..."
221060-29 = "......Quer dizer, será que tá tudo bem mesmo?"
221060-30 = "Como assim?"
221060-31 = "Sabe aquele ditado antigo de bordo... que quando o gato tosse, a tempestade vem em seguida?"
221060-32 = "O Sammy anda tossindo com tanta frequência ultimamente... que tô com um mau pressentimento esquisito..."
221060-34 = ""
221060-37 = ""
221060-38 = "Ai, meu Deus, um temporal do nada!"
221060-39 = "Não falei?! Foi só o Sammy tossir que o tempo virou!"
221060-40 = "Não é hora de discutir crendice, sua doida! Corre pra recolher as cobertas do varal!"
221060-41 = ""
221060-43 = ""
221060-44 = "Depois de todo o trampo pra lavar tudo... vamos ter que fazer tudo de novo, que ódiooo......!"
221060-48 = "Passarela de ligação em frente ao Golden Elysium, capitânia do Clube de Cruzeiros"
221060-49 = ""
221060-50 = "Muito bem, atenção todo mundo! A-ten-ção!"
221060-51 = "A partir de hoje, damos início ao embarque das cargas de alimentos com prazo de validade curto."
221060-52 = "A remessa de hoje é especialmente pesada, portanto exijo concentração total para ninguém se machucar."
221060-53 = "Entendido, Gerente Mitsuki!"
221060-54 = "Caso alguma de vocês resolva brincar em serviço e derrube ou quebre qualquer caixa――"
221060-55 = "Fará uma partidinha amistosa de roleta-russa comigo usando uma pistola automática, entenderam bem o recado?"
221060-56 = "......Sim, senhora! Perfeitamente entendido!"
221060-58 = "Próxima remessa... cinco caixas de leite em garrafa de vidro subindo a bordo!"
221060-59 = "Recebendo as cinco caixas de leite!"
221060-61 = ""
221060-64 = "......Hum?#nImpressão minha ou algo passou correndo ali embaixo?"
221060-65 = ""
221060-67 = ""
221060-68 = "Myao."
221060-69 = "Ah, era só você, Sammy."
221060-70 = "Sammy, sai daí! Esse corrimão é estreito demais, é perigoso!"
221060-71 = "Você mal tá conseguindo pular ultimamente sem ganir de dor.#nSe suas patinhas escorregarem dessa altura――"
221060-72 = "Myaau～"
221060-74 = ""
221060-77 = "Myaaaaa?!"
221060-78 = "Espera aí, Sammy?!#nNão pula pra a――"
221060-79 = ""
221060-81 = ""
221060-83 = ""
221060-86 = ""
221060-87 = "......Eu avisei para terem cuidado com a carga, não avisei?"
221060-88 = "Se estavam com tanta vontade assim de apostar suas vidas na minha roleta... não me deixam escolha."
221060-89 = "Foi sem querer, Gerente! Juro por tudo, o Sammy pulou na nossa frent――"
221060-90 = ""
221060-92 = ""
221060-93 = ""
221060-94 = "......Sammy? Espera, aquele bicho fugiu na calada da noite...?"
221060-95 = "Uuu... não tem jeito, quando um gato escorrega a bordo, a desgraça vem a cavalo!"
221060-97 = "（Sempre que um incidente desagradável acontecia perto do Sammy,#nas garotas da Odisseia associavam imediatamente aos antigos tabus marítimos.）"
221060-98 = "（Embora a curiosidade desmedida do velho bichano também ajudasse a provocar essas confusões...）"
221060-100 = "Convés superior do Rhodes, navio capitânia do Trident"
221060-101 = ""
221060-102 = ""
221060-103 = ""
221060-104 = "Muito bem, tripulação! Iniciaremos a faxina pesada do convés agora mesmo!"
221060-105 = "Sei que muitas calouras do primeiro ano estão fazendo isso pela primeira vez após o retorno ao porto, mas mantenham a postura firme!#nIsso aqui não é uma simples lavagem com água e sabão!"
221060-106 = "O convés exposto à maresia constante enferruja num piscar de olhos se não for esfregado com energia!#nE ferrugem no casco significa queda direta na prontidão de combate!"
221060-107 = "Pela honra e glória do esquadrão Trident, quero ver este piso brilhando até dar pra pentear o cabelo no reflexo!#nFui clara?!"
221060-108 = "Sim, senhora..."
221060-109 = "......Mas vem cá, por que a Sumika tá posando de capitã do navio?#nEla tá achando que virou comandante da corveta Harpia por acaso?"
221060-110 = "Não me diga que... ela só se voluntariou pra fiscalizar pra fugir de pegar no esfregão pesado――"
221060-111 = "Mas que calúnia sem tamanho! Longe de mim pensar uma coisa dessas!"
221060-112 = "Num trabalho coletivo dessa magnitude, ter alguém supervisionando a linha de produção garante que nenhum cantinho passe batido!"
221060-113 = "Qual o problema de eu ter me voluntariado para essa nobre missão de liderança?!"
221060-114 = "O problema é que ninguém te pediu pra fazer isso, Sumika."
221060-115 = "E ninguém me proibiu também, tá legal?!"
221060-116 = "Andem logo, que enquanto vocês ficam de fofoquinha o navio tá enferrujando!#nArregacem as mangas e comecem a esfregar!"
221060-117 = "Sim, capitãzinha, já entendemos..."
221060-122 = ""
221060-123 = "Olha só que lindo! Quanta bolha de sabão!"
221060-124 = "Deve ser por causa do sabão em pó que misturamos na água. Fez uma espuma danada."
221060-125 = "Que gracinha..."
221060-126 = "Pensando bem... sempre que a gente lava o chão desse jeito, aparece aquele visitante de costum――"
221060-127 = ""
221060-129 = ""
221060-130 = ""
221060-131 = "Sammy!"
221060-132 = "Veio até aqui brincar de estourar bolhas de sabão, foi?"
221060-133 = "Sinto muito, lindão, mas a gente tá em horário de serviço pesado agora.#nDá licença um instantinho pro sabão passar, vai?"
221060-136 = ""
221060-137 = "Ei, vocês aí! Menos conversa fiada e mais foco na faxin――"
221060-138 = "Myaaaah?!"
221060-139 = "Cuidadooo?!"
221060-140 = ""
221060-142 = ""
221060-144 = "[ns] \"Cuidado aí!\""
221060-149 = ""
221060-150 = "[ns1] \"Foi por um triz......\"\n[ns2] \"Você se machucou, Sumika?\""
221060-153 = "S-Sensei?!"
221060-154 = "M-Muitíssimo obrigada por me segurar...!#nPor pouco eu não caí direto no mar aberto...!"
221060-155 = "O Sammy escorregou no sabão bem na minha frente, aí me desesperei e perdi o equilíbrio..."
221060-156 = "[ns] \"Piso ensaboado é um perigo, tem que andar com cuidado redobrado.\""
221060-157 = ""
221060-158 = ""
221060-159 = ""
221060-160 = "Sim... me desculpa pelo vacilo..."
221060-161 = "Mas e você, Sensei? O impacto na grade agora foi feio... tá tudo bem com você?"
221060-162 = "[ns] \"Comigo? Imagina, isso aqui é fichinh――\""
221060-165 = ""
221060-166 = "[ns3] \"Ai... minhas costas...\"\n[ns4] \"Travou... perdi a força nas pernas......\""
221060-169 = ""
221060-170 = "SENSEEEEI?!"
