[translation]
10039030-1 = "Эпизод 3;Путь к славе поп-идола: танец"
10039030-2 = ""
10039030-3 = "...О? Вы хотите узнать о поп-идолах...?"
10039030-4 = "Ну, если хотите... Хм, что я могу рассказать...?"
10039030-5 = "Если честно, не так уж много. Костюм я не делала и песню не писала. Всё это мне дали в одном месте, куда я хожу. Это часть спонсорского соглашения..."
10039030-6 = "А вот танец, который я учу, могу показать."
10039030-7 = "У вас спонсорство с магазином?"
10039030-8 = "О да! Вообще-то участие в мероприятии поп-идолов изначально было не совсем нашей идеей."
10039030-9 = "Мы с Фубуки любим ходить в одну сеть пончиковых неподалёку, и они попросили нас нарядиться и выступить на мероприятии как их талисманы."
10039030-10 = "[s1] «...Талисманы?»\n[s2] «Типа рекламной акции?»"
10039030-13 = "Ага, именно так нам и сказали!"
10039030-14 = "Если подумать, это и правда странно, Сенсей. Как вообще роль идола пончиковой связана с общественной безопасностью?"
10039030-15 = "Но как только подвернулась эта «возможность,» начальство сразу сказало: «Делайте.»"
10039030-16 = "Да брось, Фубуки, не говори так! Чтобы поддерживать людей, нам нужно быть с ними ближе!"
10039030-17 = "Выступление в роли талисманов поможет им увидеть нас приветливыми и дружелюбными, такими, какими мы и хотим казаться, правда?"
10039030-18 = "Я просто говорю, что это лишняя работа..."
10039030-19 = "...Ну, вы пришли к нам за помощью, сестра, и мы с радостью сделаем всё, что можем."
10039030-20 = "Как она сказала, мы не эксперты, но хотя бы можем показать вам танец, который разучиваем."
10039030-21 = "Этот танец..."
10039030-22 = ""
10039030-24 = ""
10039030-25 = ""
10039030-26 = ""
10039030-27 = "...Вот так? Я правильно сделала, Фубуки?"
10039030-28 = "А чего ты на меня смотришь? Это не танцевальная студия. Хочешь, чтобы все на нас пялились?"
10039030-29 = "Ну, я просто не совсем помню последовательность. Может, вот так...?"
10039030-31 = "Ну..."
10039030-32 = "[ns3] «(Это точно не так.)»\n[ns4] «(Похоже, они сами ещё учатся.)»"
10039030-35 = "Ну, в общем, что-то вроде этого."
10039030-36 = "Как я и сказала, мы всё ещё тренируемся. Даже ходим на занятия."
10039030-37 = "Ага, и с одной стороны, это хотя бы отдых от моей обычной работы..."
10039030-38 = ""
10039030-39 = "[ns5] «(...но она занимается другой работой.)»\n[ns6] «(В итоге всё примерно одинаково.)»"
10039030-42 = "Ага, вы поняли, Сенсей."
10039030-43 = "На самом деле из-за этого теперь намного сложнее отлынивать от работы..."
10039030-45 = "Фубуки!"
10039030-46 = "Да-да. Не смотри на меня так."
10039030-47 = "Короче, мне всё время говорят, что танцы могут быть полезными, когда научишься нормально."
10039030-48 = "Полезными? Как?"
10039030-49 = "Ну, во-первых, они делают тебя лучшим идолом. Но, думаю, бывают моменты, когда тебя застают врасплох или всё происходит слишком быстро..."
10039030-50 = "...и если нужно выиграть время или кого-то отвлечь, танец тоже может пригодиться!"
10039030-51 = "Ого!"
10039030-52 = "То есть, конечно, ты вообще НЕ ХОТЕЛА бы оказаться в такой ситуации..."
10039030-53 = "Но что важнее, сестра—"
10039030-54 = ""
10039030-56 = ""
10039030-57 = ""
10039030-58 = "[ns7] «Что это за звук...?»\n[ns8] «Сигнал тревоги?»"
10039030-61 = "Происшествие, Фубуки! Пора выдвигаться!"
10039030-63 = "Мы ОБЯЗАНЫ выдвигаться? Я думала, нас сняли с графика ради репетиций и всего такого."
10039030-64 = "Они же так сказали, верно?"
10039030-65 = ""
10039030-67 = ""
10039030-68 = ""
10039030-69 = "Сейчас не хватает людей! Мы хотя бы должны там присутствовать! К тому же место происшествия..."
10039030-70 = ""
10039030-72 = ""
10039030-73 = "Видели...?"
10039030-74 = "Это пончиковая!"
10039030-75 = "Эм..."
10039030-76 = "…Погодите, серьёзно?"
10039030-77 = "Та самая, что вас спонсирует...?"
10039030-78 = "Некогда спорить, Фубуки! Пошли!"
10039030-79 = "Нет, я о том...! Постой! Подожди минутку...!!"
10039030-80 = ""
10039030-82 = ""
10039030-83 = ""
10039030-84 = ""
10039030-87 = ""
10039030-93 = "Никому не двигаться! И без глупостей!"
10039030-94 = "Мы пришли только за пончиками. Отдавайте их спокойно, и никто не пострадает!"
10039030-95 = "И-и-и! Пожалуйста, не надо...!"
10039030-96 = "Я сказала, отдавай уже чёртовы пончики! ...О, отлично, «Валькирия» уже здесь. СПАСИБО."
10039030-97 = "Н-Но сначала за них нужно заплатить. Таковы правила магазина."
10039030-98 = "Таковы правила КАЖДОГО магазина! Ты серьёзно просишь грабителя заплатить?!"
10039030-99 = "П-Просто... начальник сказал следить, чтобы все платили заранее!"
10039030-100 = "КАК можно быть настолько тупой?!"
10039030-101 = "Ну, она кассир на подработке..."
10039030-102 = "Хаха, да, тут не поспоришь."
10039030-103 = "...Уф. Отлично, нас уже окружили."
10039030-104 = "Ладно. Возьмём её в заложники и потребуем машину для побега."
10039030-106 = "Охх, как всё до этого дошло...?"
10039030-107 = "Из-за тебя, вот как!"
10039030-108 = "Почему это моя вина?! Это вы всё начали!"
10039030-110 = "Вообще-то, она права."
10039030-111 = "Ты вообще на чьей стороне?!"
10039030-113 = "О боже, захват заложника среди бела дня... Невероятно!"
10039030-114 = "И всё из-за каких-то пончиков..."
10039030-115 = ""
10039030-117 = ""
10039030-119 = "О, Кирино! Фубуки! Хорошо, что вы здесь."
10039030-120 = "Мы стоим друг напротив друга уже двадцать минут. Как будем действовать?"
10039030-121 = "Они повысили требования. Сначала хотели только пончики, теперь требуют машину для побега. Фух, напряжённо..."
10039030-123 = "Эм... У нас есть ещё подкрепление? Кто-нибудь из Бюро безопасности или Бюро общественного порядка...?"
10039030-124 = "Говорят, им понадобится время, чтобы добраться сюда."
10039030-125 = "Пока что мы сами по себе."
10039030-126 = "*вздыхает* Серьёзно...?"
10039030-127 = "Эй, это же Фубуки из Бюро общественной безопасности?"
10039030-128 = "Ага! Наверное, она пришла защищать пончиковую!"
10039030-129 = "Я слышала, они сотрудничают ради мероприятия поп-идолов. Поэтому она пришла их спасать? Вот это преданность!"
10039030-130 = "Н-Нет, всё не так..."
10039030-131 = "А? О, Фубуки!"
10039030-132 = "Фубуки! Фубуки, сюда!"
10039030-133 = "Да ну вас! Что это, фан-встреча какая-то?"
10039030-134 = "Это такой долбаный позор..."
10039030-135 = "О, ага, эм... Привет..."
10039030-136 = "Что ж, спасение теперь зависит от нас."
10039030-137 = "Нам как-то нужно обезвредить хулиганок и спасти заложницу!"
10039030-138 = "...Как-то. Хм..."
