[translation]
2000303-1 = "Что такое справедливость?"
2000303-2 = "Класс Тринити"
2000303-3 = "Справедливость... Как легко это слово слетает с языка. Разве существует слово лучше?"
2000303-4 = "Оперативная группа правосудия всегда стремилась поддерживать справедливость в Кивотосе, а тех, кто творит несправедливость, ждёт суровое наказание."
2000303-5 = "Когда-то я сражалась, веря, что всё, что делают мои старшие, справедливо, а наши враги из Геенны — напротив... но в последнее время у меня появились сомнения."
2000303-6 = "Э-это не значит, что я перестала верить в своих старших!"
2000303-7 = "Однако когда они выпустятся, Оперативная группа правосудия останется на мне, и мне придётся самой решать, что справедливо."
2000303-8 = "Для этого мне необходимо ясно понимать, что такое справедливость."
2000303-9 = "Поэтому я пошла и купила экземпляр классического бестселлера: «Справедливость: поступать правильно»."
2000303-10 = "[s] «Никогда о такой не слышал...»"
2000303-11 = "Книга оказалась именно такой, как я надеялась. В ней было множество примеров справедливости и несправедливости и объяснялось, как они проявляются в разных ситуациях."
2000303-12 = "Например, хулиганы, мучающие других, несправедливы, а врачи, спасающие людей от мучительных болезней, справедливы. Вкусная еда, приносящая людям радость, справедлива, а странная пища, от которой болит живот, — несправедлива."
2000303-13 = "Всё казалось таким ясным и однозначным. Это полностью совпадало с моим личным пониманием справедливости."
2000303-14 = "Но некоторые примеры мне всё ещё трудно понять из-за недостатка опыта."
2000303-15 = "Не могли бы вы выслушать их и сказать мне, как будет правильно поступить?"
2000303-16 = "[s] «Конечно, выкладывай.»"
2000303-17 = "Хорошо. Вот первый пример."
2000303-18 = "«Вы машинист поезда. Однажды вы замечаете пятерых людей, привязанных к путям, на которые вот-вот въедете.»"
2000303-19 = "«Если перевести стрелку на другой путь, можно спасти этих пятерых, но тогда вы собьёте одного другого человека. Как в таком случае будет правильно поступить?»"
2000303-20 = "Ответить непросто. Перевести стрелку было бы правильно, если цель — спасти больше людей, но для этого придётся пожертвовать тем, кому иначе ничего не угрожало."
2000303-21 = "Что важнее? Спасти жизни или не причинять намеренного вреда другому человеку?"
2000303-22 = "[s] «А что говорит книга?»"
2000303-23 = "Там сказано... что это мысленный эксперимент, поэтому правильного ответа нет."
2000303-24 = "Справедливость без ответа? Какая чепуха."
2000303-25 = "У справедливости всегда должен быть один ясный ответ..."
2000303-26 = "[s] «А что выбрала бы ты?»"
2000303-27 = "Хм. Неужели нет способа спасти всех?"
2000303-28 = "Я не могу принять такой ответ, даже если он противоречит самой сути этого примера."
2000303-29 = "Я сделала бы всё возможное, чтобы спасти их всех, чего бы это ни стоило."
2000303-30 = ""
2000303-31 = "Таков путь справедливости!"
2000303-33 = "Мы с Маширо отлично провели время, вместе читая книгу."
