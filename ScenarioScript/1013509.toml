[translation]
1013509-1 = "Текущие сумерки"
1013509-2 = ""
1013509-3 = "[ns] «Кей-Кей в Шале!»"
1013509-4 = "Не драматизируй!"
1013509-5 = "...К тому же это далеко не первый раз."
1013509-6 = "[s] «Я всё равно рад тебя видеть.»"
1013509-7 = "..."
1013509-8 = "Я не говорю, что сама не рада..."
1013509-9 = ""
1013509-11 = ""
1013509-12 = "?! СТОЙ! Отойди, или я выстрелю!"
1013509-13 = ""
1013509-14 = "Похоже, значительная часть работы Шале состоит в том, чтобы предлагать идеи или добиваться общего согласия."
1013509-15 = "Эти люди... оставили столько записей. Могли бы просто обсудить всё между собой. Уф."
1013509-16 = "И все эти бумажные документы ради так называемых «мер безопасности»..."
1013509-17 = "Я, конечно, понимаю, что абсолютно защищённых сетей не бывает."
1013509-18 = "Но, с другой стороны, было бы ещё безопаснее просто НЕ записывать каждую мельчайшую деталь повестки."
1013509-19 = "[s] «Это часть работы с людьми.»"
1013509-20 = "И благодаря этому здесь всё кое-как крутится."
1013509-21 = "Одно дело, если бы работы иногда становилось меньше или хотя бы её объём не менялся."
1013509-22 = "Но ты уже достаточно давно здесь, чтобы понять: работы будет становиться только больше."
1013509-23 = "Чем лучше Шале решает проблемы, тем чаще остальные будут прибегать сюда со своими мелочами."
1013509-24 = "Разве изначально ты не был преподавателем, Сенсей?"
1013509-25 = "И какова теперь твоя роль? Бюрократ-администратор или... наставник, который должен помогать студентам задумываться о своей жизни и будущем?"
1013509-26 = "[s1] «И не говори...»\n[s2] «Такими темпами я вообще забуду всё, чему хотел учить...»"
1013509-29 = "Не говори об этом так, будто это чужая проблема. Серьёзно..."
1013509-30 = "Я закончу этот документ."
1013509-31 = "Ой, не надо так бурно меня благодарить. Это ведь часть обязанностей Представителя учеников, верно?"
1013509-32 = "Академический город. Ну и концепция. Наверняка у того, чтобы запихнуть столько студентов в такое тесное пространство, ЕСТЬ какие-то плюсы."
1013509-33 = "Но студенты особенно уязвимы для мошенников. Поэтому на улицах постоянно творится что-то возмутительное."
1013509-34 = "А ещё студенты, как известно, не отличаются хорошим самоконтролем."
1013509-35 = "Понимаю, что сегодня это ОЧЕНЬ спорный взгляд, но раньше считалось, что человек младше двадцати лет ещё не может считаться полностью ответственным взрослым."
1013509-36 = "И теперь одна катастрофа следует за другой. Взрывы и ущерб имуществу каждый день. Строительные компании явно гребут деньги лопатой. Хочешь разбогатеть — инвестируй в них."
1013509-37 = "[s] «Но это бы отрицало саму основу Академического города...»"
1013509-38 = "Я говорю всё это потому, что систему уже не исправить. Это никогда не закончится."
1013509-39 = "Никто не образумится, пока что-нибудь — или КТО-НИБУДЬ — действительно не рухнет."
1013509-40 = "Вот. Отправь это. Дополнительные данные приложены."
1013509-41 = "Иногда цифры говорят сами за себя."
1013509-42 = ""
1013509-45 = "[ns] «Кей-Кей.»"
1013509-46 = "А?"
1013509-47 = ""
1013509-49 = ""
1013509-50 = ""
1013509-51 = "[ns] «Я люблю тебя!»"
1013509-52 = "Отвали! Фу, гадость!!"
1013509-58 = "[ns] «Мы... правда закончили всю работу на сегодня!»"
1013509-60 = ""
1013509-61 = "...Ты в порядке?"
1013509-62 = "А? Ты говоришь, что моя забота помогает тебе «почувствовать себя лучше»?"
1013509-63 = "Серьёзно, зря я вообще беспокоилась."
1013509-64 = "Что? Хочешь «сводить меня куда-нибудь»? Съесть какой-нибудь роскошный ужин? А потом купить мне аксессуары?"
1013509-65 = "Ого. Сенсей, ты не устал? Ты только что выглядел таким..."
1013509-66 = "...Точно всё нормально? Н-Ну тогда..."
1013509-67 = "..."
1013509-68 = "Кстати, кто завтра будет Представителем учеников?"
1013509-69 = "[s] «Посмотрим...»"
1013509-70 = ""
1013509-73 = "[ns] «А? Похоже, тут чего-то не хватает. Ещё не решили.»"
1013509-74 = "...Вот как?"
1013509-75 = "Но выбрать кого-то всё равно нужно до завтрашнего утра, верно?"
1013509-76 = "..."
1013509-77 = "Тогда... выбери меня."
1013509-78 = "[s] «Что?!»"
1013509-79 = "Ч-Что это за странное лицо? Просто подумай..."
1013509-80 = "Я хочу сказать вот что..."
1013509-81 = "Это часть моей тренировки по адаптации к Кивотосу. Мне нужно освоиться с работой Шале и заодно сократить дефицит торгового баланса! А ещё я смогу помочь тебе скорректировать тарифные ставки."
1013509-82 = "Только представь, насколько я могу быть полезна. Я могла бы консультировать тебя по... падению реальных доходов! И упадку государственного образования, будущему человечества, планеты и лучшим способам очистить разлагающуюся душу нашего мира. И ещё, ещё..."
1013509-83 = "Послушай! Это тренировка, учебное упражнение, реальный практический опыт... и многое, многое другое!"
1013509-84 = "Это самое рациональное решение для нас обоих. Ты должен быть благодарен, что я уже всё продумала за тебя!"
1013509-85 = "[s] «„Рациональное решение“... Звучит прямо как...»"
1013509-86 = "?!"
1013509-87 = "Я-я немного не так выразилась... Хватит пытаться меня смутить!"
1013509-88 = "В общем, ты понял, что я пытаюсь сказать?!"
1013509-89 = "[s] «Кей-Кей.»"
1013509-90 = "Что теперь?"
1013509-91 = "[s] «Я хочу всего один раз сказать: „Какая хорошая Кей-Кей!“. Можно?»"
1013509-92 = "Я убью тебя, Сенсей, а потом сама ПОЙДУ И УМРУ!!"
1013509-93 = ""
1013509-94 = "Но, подводя итог, сегодня ты хорошо поработал."
1013509-95 = "...И завтра поработаем ещё."
1013509-96 = "А теперь вернёмся к делу. Ты сказал, что мы поужинаем вместе... и ещё много чего сделаем. Поторопись."
1013509-97 = "[s] «Да-да. Секундочку.»"
1013509-98 = ""
1013509-99 = "И в тот самый момент, когда я это сказал..."
1013509-100 = ""
1013509-102 = ""
1013509-103 = ""
1013509-104 = ""
1013509-105 = ""
1013509-106 = "[ns] «Ох...»"
1013509-107 = "...?"
1013509-108 = "Что такое, Сенсей?"
1013509-109 = ""
1013509-111 = ""
1013509-112 = ""
1013509-113 = "[ns] «...!»"
1013509-114 = "Сенсей?"
1013509-115 = ""
1013509-117 = ""
1013509-118 = ""
1013509-119 = "А? Что значит, я стала «размытой и исчезла»? Очевидно же, проблема в ТЕБЕ."
1013509-120 = "Я всё это время была здесь... Очевидно."
1013509-121 = "..."
1013509-122 = "Ты, должно быть, устал. Размытое зрение — один из симптомов недосыпа."
1013509-123 = "Сегодня ночью тебе стоит как следует отдохнуть."
1013509-126 = "― [log=케이 교복]Не волнуйся.[/log][wa:2060]"
1013509-127 = "― [log=케이 교복]Я не исчезну. [/log][wa:2700]"
1013509-130 = "― [log=케이 교복]Наоборот.[/log][wa:1080]"
1013509-131 = "― [log=케이 교복]Я буду бороться за жизнь, чего бы это ни стоило.[/log][wa:4530]"
1013509-134 = "― [log=케이 교복]Если Сенсей не откажется от этого мира...[/log][wa:3780]"
1013509-135 = "― [log=케이 교복]то и я никогда не сдамся.[/log][wa:5570]"
1013509-138 = "― [log=케이 교복]Так что... всё хорошо. Всё будет хорошо.[/log][wa:4040]"
1013509-139 = "― [log=케이 교복]Я продолжу быть рядом.[/log][wa:3690]"
1013509-142 = "― [log=케이 교복]Я скажу это только здесь... Но я...[/log][wa:4730]"
1013509-143 = "― [log=케이 교복]не так уж сильно тебя ненавижу.[/log][wa:4860]"
1013509-155 = "Я проводил её до Миллениума, поэтому в тот день мы расстались чуть позже обычного."
1013509-156 = "Сначала мы шли, оставляя между собой небольшое расстояние."
1013509-157 = "Но почему-то Кей подошла ближе. Она медленно зацепила кончик моего мизинца своим."
