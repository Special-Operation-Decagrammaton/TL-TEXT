[translation]
1013202-1 = "Снова в модели!"
1013202-2 = "За кулисами модного показа"
1013202-4 = "Я переживал из-за того, что Цукуё снова вернулась к работе моделью вскоре после ухода, поэтому решил лично посмотреть показ."
1013202-5 = "О, Сенсей. Сюда!"
1013202-6 = "Н-Надеюсь, у вас не возникло проблем со входом."
1013202-7 = "[s] «Мне помог сотрудник.»"
1013202-8 = "Хи-хи, какое облегчение."
1013202-9 = "Я... заранее предупредила персонал..."
1013202-10 = "Я сказала, что заглянет «очень важный человек», и попросила как следует о нём позаботиться..."
1013202-11 = "[s] «Ты говорила обо мне?»"
1013202-12 = "Так... необычно встречаться с вами вот так, за кулисами."
1013202-13 = "Такое чувство... будто мы встретились в каком-то тайном месте. Хи-хи."
1013202-14 = "[s1] «И правда есть такое ощущение.»\n[s2] «Как идёт подготовка к показу?»"
1013202-17 = "Ах, точно! Первую примерку я уже закончила и теперь отрабатывала походку."
1013202-18 = "Я ещё не привыкла к этим каблукам, поэтому решила потренироваться."
1013202-19 = "[s] «О... Сейчас ты прозвучала как настоящий профессионал, Цукуё!»"
1013202-20 = ""
1013202-22 = ""
1013202-23 = "Н-Ничего страшного!"
1013202-24 = "Конечно, есть люди с куда более долгой карьерой... настоящие профессионалы."
1013202-25 = "Как бы то ни было, сегодня мой последний день в роли модели."
1013202-26 = "Н-ну как вам, Сенсей?"
1013202-27 = ""
1013202-29 = ""
1013202-31 = ""
1013202-32 = "Эм... платье хорошо на мне смотрится?"
1013202-33 = "[s3] «Что за лишний вопрос!»\n[s4] «На тебе любая одежда в Кивотосе будет смотреться хорошо!»"
1013202-36 = "У-Уаа-а..."
1013202-37 = "Не... нужно мне льстить..."
1013202-38 = "Н-Но всё равно спасибо за эти слова, Сенсей. Хи-хи..."
1013202-39 = "[s] «Кстати... Почему ты решила снова попробовать себя в моделинге?»"
1013202-40 = "О, этот заказчик знал меня ещё со времён агентства Шайнкэт."
1013202-41 = "Сначала я хотела отказаться, но..."
1013202-42 = "Когда узнала подробности, оказалось, что для однодневной подработки всё не так уж плохо..."
1013202-43 = "И, эм..."
1013202-45 = "...Организаторы показа сделали мне предложение, от которого я не смогла отказаться..."
1013202-46 = "[s] «...Предложение, от которого не смогла отказаться?»"
1013202-47 = "Верно."
1013202-48 = "Если честно, я ведь уже однажды ушла из модельного бизнеса..."
1013202-49 = "...поэтому мне было страшновато возвращаться..."
1013202-50 = "Но когда они сделали предложение, я заметила, что начинаю менять своё мнение..."
1013202-51 = "[s] «И что же они тебе предложили...?»"
1013202-52 = "О, ну..."
1013202-53 = ""
1013202-55 = ""
1013202-56 = "Пожалуйста, занимайте позицию. Начинаем через десять минут."
1013202-57 = "Ой, уже столько времени...!"
1013202-58 = "Я скоро вернусь, Сенсей!"
1013202-59 = ""
1013202-61 = ""
1013202-62 = ""
1013202-64 = "Меня не покидало ощущение, что что-то здесь не так..."
1013202-65 = "Поэтому я старался как можно внимательнее наблюдать за Цукуё."
1013202-67 = "Площадка модного показа"
1013202-69 = "Вскоре модный показ начался."
1013202-70 = ""
1013202-78 = ""
1013202-79 = ""
1013202-80 = ""
1013202-82 = ""
1013202-85 = "Цукуё выступила великолепно."
1013202-86 = "...И показ прошёл без единой заминки."
1013202-87 = ""
1013202-92 = "Снаружи площадки"
1013202-93 = "После финального выхода я встретился с Цукуё снаружи."
1013202-94 = ""
1013202-96 = ""
1013202-97 = "А, Сенсей!"
1013202-98 = "Простите, что заставила ждать."
1013202-99 = "[s] «Всё нормально. Я тоже только что вышел.»"
1013202-100 = "П-Правда?"
1013202-101 = "Хи-хи... Как хорошо."
1013202-102 = "И... раз уж моя работа на показе закончена..."
1013202-104 = "Эй, вы там. Стоять."
1013202-105 = ""
1013202-107 = ""
1013202-108 = "Прошу прощения...?"
1013202-109 = "Послушайте, госпожа Цукуё. Вы не можете просто уйти...!"
1013202-110 = "Что...?"
1013202-111 = "У нас была договорённость, и ВЫ обязаны остаться."
1013202-112 = "Надеюсь, вы не забыли о подписанном контракте."
1013202-113 = "Ох...! Простите, я и правда забыла. Я так торопилась..."
1013202-114 = "[s] «Погоди, то самое предложение, от которого ты не могла отказаться, это на самом деле...»"
1013202-115 = ""
1013202-117 = ""
1013202-118 = "О, значит, вы уже слышали."
1013202-119 = "Да. Благодаря моим умелым переговорам мне удалось нанять такую прекрасную модель, как Цукуё."
1013202-120 = "А её условием было..."
1013202-121 = ""
1013202-123 = ""
1013202-124 = "...настоящий рекламный буклет к «У ниндзя семь жизней»! Это тринадцатый фильм Шиба Дог Ван Вана, и он был хитом!"
1013202-125 = "[s] «...А?»"
1013202-126 = "Это культовый фильм, но из-за... напряжённой обстановки в то время рекламная кампания была очень маленькой, поэтому оригинальных буклетов почти не осталось. Это крайне редкая брошюра! И ещё такая красивая!"
1013202-127 = "Разумеется, именно наше агентство отвечало за маркетинг!"
1013202-128 = "Так что госпожа Цукуё поставила подпись под контрактом... получив обычный модельный гонорар и настоящий буклет!"
1013202-129 = "[s] «...И это всё?!»"
1013202-131 = "Да! Если поставить такую вещь в клубной комнате, президент и Изуна будут в восторге!"
1013202-132 = "Хи-хи, я чуть не ушла без него. Хорошо, что вы меня нашли. Спасибо."
1013202-133 = "В конце концов, именно ради этого я снова согласилась поработать моделью."
1013202-134 = "О, кстати, госпожа Цукуё."
1013202-135 = "Почему бы вам не решиться и не вернуться на подиум по-настоящему?"
1013202-136 = "...Что?"
1013202-137 = "Всего несколько дней назад я встретил Шайнкэт на модной конференции..."
1013202-138 = "И сразу понял, что он... всё ещё ваш поклонник."
1013202-139 = "Н-Но..."
1013202-140 = "Мне очень приятно это слышать, но я..."
1013202-141 = ""
1013202-143 = ""
1013202-144 = "Если честно, то время было для меня очень страшным."
1013202-145 = "Адские тренировки... полностью овощная диета... постоянный уход за собой и стресс!"
1013202-146 = "Признаю, одной лишь одарённости, чтобы быть моделью, недостаточно."
1013202-147 = "Простите, что вообще это поднял."
1013202-148 = "Н-Нет, всё хорошо! Наоборот, я очень благодарна за предложение."
1013202-149 = "Если позволите, я вернусь внутрь. Спасибо, что пришли."
1013202-150 = ""
1013202-152 = ""
1013202-153 = "Почему-то мне кажется, что мне стоит извиниться..."
1013202-154 = ""
1013202-156 = ""
1013202-157 = ""
1013202-158 = "Последние несколько дней я почти ничего не ела, потому что на меня так давила необходимость снова прийти в форму!"
1013202-159 = "[s] «В таком случае, Цукуё... Пойдём со мной. Я знаю один ресторан.»"
1013202-160 = "С-Сенсей...?"
1013202-161 = "В-Вы уверены, что мне стоит..."
1013202-162 = "[s5] «Кто не работает, тот не ест.»\n[s6] «Но ты работала, значит, заслужила поесть!»"
1013202-165 = "О!"
1013202-166 = "В-В таком случае..."
1013202-167 = "С-Спасибо, Сенсей!"
1013202-169 = "Счёт оказался немного выше, чем я ожидал, но..."
1013202-170 = "...снова увидеть улыбку Цукуё стоило куда больше этих денег."
