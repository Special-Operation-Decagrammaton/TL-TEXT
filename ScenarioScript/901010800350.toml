901010800350-42 = "Трансформирующийся робот...?"
901010800350-43 = "Ты себя слышишь? Во-первых, они накопили целую гору денег."
901010800350-44 = "И всё это на игрушку? Сколько она вообще может стоить? Десять тысяч иен?"
901010800350-45 = ""
901010800350-47 = ""
901010800350-48 = "...FOX 3, тебе нужно мыслить как взрослой. Это не детские игры."
901010800350-49 = ""
901010800350-51 = ""
901010800350-52 = "Современные лимитированные роботы — совсем другая лига. Посмотри на эти объявления."
901010800350-53 = ""
901010800350-55 = ""
901010800350-56 = "Погодите, что за... На эти деньги можно оплатить операционный бюджет небольшой академии!"
901010800350-57 = "Мы могли бы купить новейшее оружие... Нет! Мы могли бы заменить ВСЁ наше снаряжение на эти деньги."
901010800350-58 = "Я знаю, что в мире существует бесчисленное множество дорогих коллекционных вещей..."
901010800350-59 = "Но даже в семье Карпаччо трудно оправдать использование общих средств на личное хобби."
901010800350-60 = "Пожалуйста, подумайте о другой причине."
