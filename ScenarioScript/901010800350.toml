901010800350-22 = "O motivo pelo qual estão economizando cada centavo é—\n[as2] Para pagar o tributo devido ao chefão da máfia.\n[as3] Para comprar robôs colecionáveis de edição limitada.\n[as1] Para cobrir a caução e a taxa de renovação do contrato do porto."
901010800350-23 = "Exato. A renovação da concessão portuária está logo aí."
901010800350-24 = "Não sabemos o valor exato, mas a caução de garantia exigida na licitação é astronômica."
901010800350-25 = "E como o leilão público funciona por concorrência de maior lance, o custo de vitória pode superar em muito o valor inicial."
901010800350-27 = "Faz todo o sentido eles acumularem recursos com tanta obstinação."
901010800350-28 = "O tributo do chefão é alto, de fato, mas já consta como custo fixo ordinário da organização."
901010800350-29 = "Portanto, não justificaria esse corte de gastos repentino nos últimos meses."
901010800350-30 = "A reserva financeira deve ter outra finalidade primordial."
