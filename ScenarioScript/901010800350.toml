[translation]
901010800350-6 = "Resumindo o que encontramos nos registros financeiros da doca de carga..."
901010800350-7 = "A maior fonte de renda da filial da Família Carpaccio era... #ncomo esperávamos, o contrato de vigilância do porto."
901010800350-8 = "Claro que, tirando os salários das capangas e o tributo enviado ao chefão supremo, quase não sobrava lucro líquido."
901010800350-9 = "Só que o mais curioso é que, nos últimos meses, eles cortaram despesas fixas e acumularam uma quantia vultosa em caixa."
901010800350-10 = "Compraram caranguejos que nem vão comer, e ao mesmo tempo cortaram até o lanche dos funcionários... Qual seria a lógica disso?"
901010800350-11 = "Devem estar se preparando para um grande desembolso! Tipo algum megaevento pra ostentar o poder da organização."
901010800350-12 = "Dá pra deduzir com facilidade, na verdade."
901010800350-13 = "Como ouvimos ontem no restaurante, a Família Carpaccio só tem uma grande dor de cabeça no momento."
901010800350-14 = "O motivo pelo qual estão economizando cada centavo é—"
