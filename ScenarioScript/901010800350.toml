[translation]
901010800350-6 = "Подведём итог данным по логистике, которые я нашла у погрузочной зоны..."
901010800350-7 = "Как мы и ожидали, основной доход этого филиала семьи Карпаччо — контракт на охрану порта."
901010800350-8 = "Однако после расходов на персонал и большой доли босса прибыль у них почти исчезает."
901010800350-9 = "Странно другое: они урезают постоянные расходы. Уже несколько месяцев копят деньги."
901010800350-10 = "Покупать массу крабов, которых не собираешься есть, и одновременно урезать расходы... Интересно, какова цель."
901010800350-11 = "Может, впереди у них какая-то крупная трата. Например, большое мероприятие, чтобы показать всем свою силу."
901010800350-12 = "Очевидно же."
901010800350-13 = "Мы услышали это за завтраком. У семьи Карпаччо сейчас одна главная забота."
901010800350-14 = "Они копят деньги, чтобы..."
901010800350-15 = ""
901010800350-17 = ""
901010800350-18 = ""
901010800350-21 = ""
901010800350-22 = "#Q;오토기;Они копят деньги, чтобы...\n[as2] «Отдать дань боссу.»\n[as3] «Купить лимитированного трансформирующегося робота.»\n[as1] «Сделать ставку на продление контракта с портом.»"
901010800350-23 = "Верно. Контракт семьи Карпаччо скоро выставят на продление."
901010800350-24 = "Точных цифр я не знаю, но сумма наверняка нужна большая."
901010800350-25 = "А поскольку всё решается на аукционе, итоговая цена может оказаться гораздо выше ожидаемой."
901010800350-27 = "Этого вполне достаточно, чтобы начать копить."
901010800350-28 = "А. Они действительно отдают боссу Карпаччо крупную сумму, но это скорее постоянный расход."
901010800350-29 = "Это не объясняет, почему они начали экономить только несколько месяцев назад."
901010800350-30 = "Уверена, эти деньги нужны им для чего-то другого."
