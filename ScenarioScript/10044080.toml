[translation]
10044080-1 = "Эпизод 8;То, что нужно делать, не меняется"
10044080-2 = "..."
10044080-3 = "Так... Эм... Всё нормально...?"
10044080-4 = "Что именно нормально?"
10044080-5 = "Груз. Который мы перевозим."
10044080-6 = "«Нормально» в каком смысле?"
10044080-7 = "Я-я просто... Может, я слишком много думаю, но..."
10044080-8 = "Ух, да скажи уже наконец!!"
10044080-9 = ""
10044080-11 = ""
10044080-12 = "...Обычно ценности не перевозят в таком грузовом поезде, верно?"
10044080-13 = "Наверное, нет."
10044080-14 = "В-Вот именно! Обычно мы перевозим промышленные материалы! Так почему мы везём чьи-то ценности?!"
10044080-15 = "И почему нам о них не сказали?"
10044080-16 = "Нам сказали, мы просто не слушали."
10044080-17 = "Н-Ну... может, они на это и рассчитывали. На то, что вы двое будете беспечными."
10044080-19 = "...Кажется, мы могли вляпаться в какой-то заговор..."
10044080-20 = ""
10044080-23 = ""
10044080-24 = "Пахяхя! Ты что, слишком много манги читаешь?"
10044080-26 = "Ургх, не отмахивайся так! Я-я И ПРАВДА много читаю. А кто нет? Но..."
10044080-27 = "Именно на этом задании сломалась система отправления, Кронос прилетели и сделали о нас спецрепортаж, на нас напали НЕСКОЛЬКО банд..."
10044080-28 = "Р-Разве ВСЁ это может быть совпадением?"
10044080-29 = "Ну, сбой и правда был странным, да, но всё после него произошло из-за наших собственных ошибок."
10044080-30 = "А что, если кто-то и это предусмотрел?"
10044080-31 = ""
10044080-34 = ""
10044080-36 = "А что, если... существует преступная организация, которая рассчитывает, что мы завалим это задание?"
10044080-37 = "Я слышала, что ценности вроде произведений искусства используют для отмывания денег."
10044080-38 = "Хикари тоже слышала."
10044080-39 = "Мы оказались в центре чего-то большого. СЛИШКОМ большого. Масштаба «перевернуть-весь-Кивотос»."
10044080-40 = "П-Правда, Сенсей? Я ведь не просто параноик?"
10044080-41 = "[s1] «Ну, раз уж ты упомянула...»\n[s2] «И правда звучит немного...»"
10044080-44 = "И байкерская банда! Они тоже были странными...! Они ведь всё время ехали за нами, да?"
10044080-45 = "Не могло же это быть просто местью за историю с пиццей."
10044080-46 = "Разве они не были нашим фан-клубом?"
10044080-47 = "Никакого фан-клуба нет."
10044080-48 = "[ns] «И что ты предлагаешь делать?»"
10044080-49 = "..."
10044080-50 = "Я-я не говорю, что ХОЧУ что-то делать, просто..."
10044080-51 = "Я переживаю. Потому что то, что мы везём... они могут использовать для чего-то плохого, понимаете?"
10044080-52 = "И если это так, разве мы не станем сообщниками, доставив это им?"
10044080-53 = "Если мы собираемся отдать это преступнику, то... может, не стоит."
10044080-54 = "...Не знаю. Просто такая мысль пришла."
10044080-55 = ""
10044080-57 = ""
10044080-58 = "Нет, я понимаю, о чём ты. И такое действительно иногда случается."
10044080-59 = "Но это не меняет того, что МЫ должны сделать."
10044080-60 = "И какой же...?"
10044080-61 = "Кто-то предложил работу, мы её приняли, значит теперь доставляем груз в пункт назначения. Точка."
10044080-62 = "Всё просто, да?"
10044080-63 = "В-В каком-то смысле, но..."
10044080-65 = "Мы не говорим «не думай о том, что мы делаем» или «делай всё, что тебе велят.»"
10044080-66 = "Просто если мы приняли работу, то каждый раз доводим её до конца как положено."
10044080-67 = "Мы Хайлендер. Это наша главная обязанность."
10044080-69 = "Обязанность..."
10044080-70 = "К тому же нет смысла переживать о том, чего мы не знаем."
10044080-71 = "Чего не знаем — того не знаем, понимаешь? Думать об этом — только стресс."
10044080-72 = "Здесь не только это вызывает у меня стресс..."
10044080-73 = "..."
10044080-74 = "...но тут ты права. Спасибо, мне уже немного легче."
10044080-75 = "Пахяхя, вот видишь? Всё образуется. Не парься так сильно."
10044080-76 = "Наверное, здорово. Просто скакать по жизни и не думать о последствиях..."
10044080-77 = ""
10044080-78 = "[ns3] «Лично я считаю, что ответственность лежит на взрослых.»\n[ns4] «Некоторые ученики согласны с этим, а некоторые — нет.»"
10044080-79 = ""
10044080-80 = ""
10044080-81 = ""
10044080-82 = "[ns5] «Во что бы вы ни верили и какие бы решения ни принимали...»\n[ns6] «...как Сенсей я поддержу вас настолько, насколько смогу.»"
10044080-85 = "Пахяхя! Ага, звучит хорошо. Спасибо, что прикрываете нас, Сенсей!"
10044080-86 = "Наденьте форму чирлидерши. И скажите это ещё ра-а-аз."
10044080-87 = "...Значит, какое бы решение мы в итоге ни приняли, вы его уважите."
10044080-88 = ""
10044080-90 = ""
10044080-91 = "*вздох* Полагаю, сейчас нет смысла об этом переживать."
10044080-92 = "Лучше сосредоточиться на доставке."
10044080-93 = "[s] «А ПОТОМ, если захотим, сможем разобраться, как груз будут использовать.»"
10044080-94 = "Т-Точно."
10044080-95 = "...Н-Но это всё просто моя болтовня. Не воспринимайте слишком серьёзно."
10044080-96 = "[s] «На болтовню это не похоже.»"
10044080-97 = "...Н-Ну..."
10044080-98 = "...спасибо тебе, Сенсей."
10044080-99 = "..."
10044080-100 = ""
10044080-103 = "...Почемууу вы так серьёзно смотрите?"
10044080-104 = "Эм, мне кажется или поезд ускоряется?"
10044080-105 = "Хмм, сейчас посмотрю..."
10044080-106 = ""
10044080-108 = ""
10044080-110 = ""
10044080-111 = ""
10044080-112 = "..."
10044080-113 = "...«Ускоряется» — мягко сказано. Он вообще НЕ ДОЛЖЕН быть способен развить такую скорость."
10044080-115 = "У нашего поезда снялся лимит? Что?"
10044080-116 = "Э-Это... странно. Попробую замедлиться..."
10044080-117 = ""
10044080-119 = ""
10044080-120 = ""
10044080-121 = "...О."
10044080-122 = ""
10044080-124 = ""
10044080-125 = ""
10044080-126 = "О-о нет."
10044080-128 = "Что?"
10044080-130 = "...Тормоз не работает. Вообще."
10044080-131 = "А?"
10044080-132 = "А?"
10044080-134 = "[ns] «...Что??!»"
