[translation]
2006405-1 = "Rule Violation"
2006405-2 = "(Went to Wild Hunt to listen to Urara's troubles)"
2006405-4 = "An empty lot in Wild Hunt with no one around"
2006405-8 = "Sensei."
2006405-9 = "I am truly sorry for putting you through the trouble of coming all this way..."
2006405-10 = "[s] \"It's fine. Solving my students' problems is my job.\""
2006405-11 = "I'm happy to hear you say that, but..."
2006405-14 = "Even now... I'm still hesitant."
2006405-15 = "I'm not sure if I should be confiding in you about a problem that goes against the academy's policies..."
2006405-16 = "[s] \"That makes me want to hear it even more.\""
2006405-19 = "O-oh, really?"
2006405-20 = "Ugh..."
2006405-21 = "You'll keep this a secret... won't you?"
2006405-25 = "...I'll trust you, Sensei, and tell you."
2006405-28 = "It happened a few days ago."
2006405-32 = "Per Manami-sama's instructions, the academy's prohibited list was updated."
2006405-33 = "Among the items... was 'Theater,' the thing I love most."
2006405-34 = "[ns] \"What kind of content was it that got it banned?\""
2006405-36 = "It was about a protagonist living as an ordinary student who—"
2006405-41 = "At night, they become a dark hero wearing a mask and cape to punish evil."
2006405-42 = "It was deemed that this treats outlaws as heroes and could give a false impression of 'Phantom Thieves'..."
2006405-43 = "Manami-sama banned it herself."
2006405-46 = "[ns] \"I see...\""
2006405-48 = "Since the update to the prohibited list was announced, all items related to theater have been subject to confiscation."
2006405-49 = "Fortunately, as the Vice President, I'm still okay for now, but all the regular students have had theirs taken away."
2006405-50 = "...It's only a matter of time before my things are found."
2006405-51 = "I can't keep them hidden forever."
2006405-52 = "I even thought about turning them in voluntarily, but..."
2006405-55 = "I just can't bring myself to let go of the things I love."
2006405-56 = "Especially the script; it's from the original performance, so it's impossible to get now."
2006405-57 = "Oh... to think that the Vice President, who should be a role model, is breaking the rules..."
2006405-58 = "Sensei..."
2006405-59 = "What do you think I should do?"
2006405-60 = "[s1] \"If they get confiscated or you turn them in...\"\n[s2] \"When would you get them back?\""
2006405-63 = "I don't think I ever would. ...Unless I can persuade Manami-sama."
2006405-64 = "But she isn't the type of person who is easily persuaded..."
2006405-65 = "[s] (Is there any good way... Ah!)"
2006405-68 = "[ns] \"Should I hold onto them for you?\""
2006405-69 = "Hold onto them... you mean?"
2006405-70 = "..."
2006405-71 = "I know the layout of the academy, so I know routes to smuggle things out."
2006405-72 = "But things don't always go according to the script..."
2006405-73 = "If we're caught, it might bring harm to you, Sensei. Are you really sure about this?"
2006405-74 = "[s3] \"We'll cross that bridge when we get to it!\"\n[s4] \"We're a secret theater troupe now, after all!\""
2006405-77 = "..."
2006405-78 = "Ugh... for the Vice President of the Arts Council to be plotting such a thing, I can't face my fellow students. At this rate, I'm becoming a 'Phantom Thief' myself..."
2006405-79 = "But right now, there's no other way..."
2006405-82 = "...Sensei. Please come back to this spot tonight."
2006405-83 = "Let's carry this out under the cover of darkness."
2006405-84 = "[s] \"Understood. See you tonight!\""
2006405-91 = "(Finished my work for the day, and the promised time is approaching)"
2006405-95 = "(Slipped into Wild Hunt using the route Urara taught me)"
2006405-96 = "(How did she know a route that avoids the Dormitory Warden Squad's eyes...)"
2006405-99 = "Sensei, you're right on time."
2006405-103 = "We shouldn't stay long."
2006405-104 = "...Please, take these."
2006405-108 = "[ns] \"W-wow, these are surprisingly heavy?\""
2006405-109 = "Since I love theater, I've collected quite a lot of goods..."
2006405-110 = "It's presumptuous of me to ask while you're already doing me a favor, but please, be extremely careful. Especially with the script—handle it with the utmost care so it doesn't get bent."
2006405-111 = "[s] \"Leave it to me.\""
2006405-112 = "Then, please be careful of the Dormitory Warden Squad. They might still be nearby—"
2006405-113 = "Hm? Is someone there?"
2006405-116 = "[ns] (Let's hide in the bushes over there...!!)"
2006405-120 = "S-Sensei? Aren't you a bit too close?"
2006405-121 = "[ns5] \"Sorry, just bear with it for a moment.\"\n[ns6] \"They're coming right this way.\""
2006405-124 = "Ugh, ughhhhh..."
2006405-128 = "Hmm?"
2006405-129 = "That's strange... I thought I heard voices."
2006405-132 = "..."
2006405-133 = "Hey! It's no use hiding, come out!"
2006405-134 = "If you turn yourself in, I'll show some leniency, okay?"
2006405-138 = "...Was it just my imagination?"
2006405-144 = "Thought they left? Too bad! They hadn't left yet!"
2006405-147 = "..."
2006405-148 = "What. It really was my imagination."
2006405-149 = "Sigh... and I thought this was my chance to rack up some achievements."
2006405-153 = "D-did they leave...?"
2006405-154 = "[s] \"Yeah, looks like they're gone.\""
2006405-155 = "Ughhhhh..."
2006405-160 = "Thank goodness... just thinking about what would have happened if we were caught..."
2006405-161 = "I froze up and couldn't move for a second... thanks to you, Sensei, we were able to hide."
2006405-164 = "..."
2006405-165 = "Ugh, to think I'm running away from the Dormitory Warden Squad... what am I doing..."
2006405-166 = "Sensei. Please leave Wild Hunt while you can. The Warden Squad might come back, so please be very careful."
2006405-167 = "[s] \"You too, Urara.\""
2006405-170 = "(Then, I hurried out of Wild Hunt)"
2006405-171 = "(Managed to make it back to Schale without being caught)"
2006405-175 = "Sensei, you really are... a sinful person."
2006405-176 = "Do you even realize what you've done?"
2006405-177 = "..."
2006405-178 = "Heh, hehe... no, no, no."
2006405-179 = "Calm down, calm down..."
