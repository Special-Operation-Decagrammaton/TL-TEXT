[translation]
21060-1 = "Episódio 6;Como Aprender a Falar"
21060-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21060-3 = "Enfim, me apresentando direito agora."
21060-4 = "Sou a Yuzu, presidente do Clube de Desenvolvimento de Jogos."
21060-5 = "Obrigada por vir para o nosso clube, Aris-chan."
21060-6 = "Vamos nos dar bem daqui pra frente."
21060-7 = "Nos dar... bem...?"
21060-8 = "...Entendido."
21060-9 = "Yuzu entrou para o grupo, pan-paka-paaan!"
21060-10 = "...Eu disse certo?"
21060-11 = "Ah, sim. É mais ou menos por aí, eu acho."
21060-12 = "Hehe, pelo visto você gostou mesmo do nosso jogo... Fazer novos companheiros é uma das melhores partes de um RPG, né?"
21060-13 = "Ah, se você achou RPG legal..."
21060-14 = "Eu posso te recomendar outros jogos também."
21060-15 = "Ei, espera aí! Eu recomendo pra Aris primeiro!"
21060-16 = "Quanto mais jogos de qualidade ela jogar, mais natural vai ficar o jeito dela falar — e maior vai ser a chance de sucesso do nosso plano!"
21060-17 = "Vamos lá, primeiro temos \"Mito dos Heróis\", \"Final Fantasia\", \"Eyes Eternal\" e..."
21060-18 = "O que você está dizendo? A Aris-chan é iniciante em jogos! O melhor é começar por \"A Lenda de Zelna: A Ilha dos Sonhos\"!"
21060-19 = "Disso eu não abro mão: o próximo tem que ser \"Contos Romancing\". Ah, mas o terceiro... pessoalmente, acho que talvez seja melhor pular..."
21060-22 = "...??"
21060-23 = "..."
21060-25 = "...Expectativa. Iniciando o jogo novamente."
21060-27 = "(2 horas depois)"
21060-28 = "(Bip, bip, bip, bip, bip, bip...)"
21060-29 = "Nossa, Aris, você não tá lendo rápido demais...? Parece que você termina de ler quase no mesmo instante em que o texto aparece..."
21060-30 = "Aris-chan, agora vamos jogar \"A Lenda da Batalha dos Orcs\"! Vou te mostrar como batalhas por turno são divertidas!"
21060-31 = "(Assente com a cabeça)"
21060-32 = "(Bip, bip, bip, bip, bip, bip...)"
21060-34 = "(Zzz...)"
21060-35 = "...nhã."
21060-36 = "(Bip, bip, bip, bip, bip, bip...)"
21060-38 = "(Bip, bip, bip, bip, bip, bip...)"
21060-39 = "...Zerado."
21060-41 = "(Bip, bip, bip, bip, bip, bip...)"
21060-42 = "...Zerado."
21060-44 = "Piu, piu..."
21060-45 = "Hummmm..."
21060-46 = "Quê, já é de manhã?! Droga, preciso me arrumar...!"
21060-47 = "..."
21060-48 = "Finalmente despertou..."
21060-49 = "Ainda bem que acordou a salvo. Você tem muita sorte."
21060-50 = "Hã?!"
21060-51 = "A-Ah, é a Aris-chan... Como você está? Conseguiu aprender bastante coisa?"
21060-52 = "Afirmo tuas palavras, ó ser mortal."
21060-53 = "V-Você não aprendeu só umas falas meio exageradas demais...?!"
21060-54 = "Haaah... Bom dia, pessoal..."
21060-56 = "(Clac)"
21060-57 = "Bom dia!"
21060-58 = "Aris, toma."
21060-62 = "...?"
21060-63 = "Aris obteve \"Documento Não Identificado\"."
21060-65 = "Opa, seu jeito de falar ficou ainda mais refinado, hein? Isso é uma \"Carteirinha de Estudante\"."
21060-66 = "Refinado? Na verdade é exatamente o jeito que os jogos retrô falam..."
21060-67 = "Carteirinha de Estudante...?"
21060-68 = "Essa carteirinha prova que você é aluna da nossa escola. A Veritas até hacke... quer dizer, registrou seu nome na lista de alunos, então agora você é oficialmente nossa companheira, Aris!"
21060-69 = "Companheira... Certo, entendi."
21060-71 = "Pan-paka-paaan! Aris entrou para o grupo como \"companheira\"!"
21060-73 = "Ei, você não ia dizer \"hackeou\" agora há pouco...?"
21060-74 = "Relaxa, relaxa! Bom, uniforme, carteirinha de estudante e o jeito de falar! Tudo isso já tá resolvido, então..."
21060-75 = "Só falta..."
21060-76 = "Uma arma, né?"
21060-77 = "Beleza! Aris, já que estamos aqui, vamos te mostrar tudo."
21060-78 = "Mostrar...?"
21060-81 = "A nossa escola, Millennium!"
21060-83 = "Próximo;Grande Demais para Ser Chamada de Arma"
