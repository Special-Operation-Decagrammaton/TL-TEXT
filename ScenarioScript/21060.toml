[translation]
21060-1 = "Эпизод 6;Как выучить язык"
21060-2 = "Департамент Разработки Игр Милленниума"
21060-3 = "В любом случае, приятно познакомиться, Алиса."
21060-4 = "Как сказала Момои, меня зовут Юзу, я президент Департамента Разработки Игр."
21060-5 = "Спасибо, что вступила в наш клуб, Алиса."
21060-6 = "Буду рада делать игры вместе с тобой."
21060-7 = "Будешь... рада?"
21060-8 = "Принято."
21060-9 = "Пам-па-ка-пан! Юзу присоединилась к отряду!"
21060-10 = "Именно это ты имела в виду, подтверждаю?"
21060-11 = "Эм, д-да. Думаю, примерно так."
21060-12 = "Похоже, ты действительно понимаешь нашу игру. Новые члены отряда — одна из простых радостей RPG."
21060-13 = "О, и если хочешь ещё одну весёлую игру..."
21060-14 = "...у меня есть рекомендация."
21060-15 = "Стой! У меня сначала есть несколько обязательных игр!"
21060-16 = "Чем больше ты играешь и чем естественнее становится речь, тем выше шанс, что наш план сработает. Нужно просто показать тебе побольше слов."
21060-17 = "Сначала The Fable of Heroes, потом Final Fantasia, а потом Pyre Emblem—"
21060-18 = "А?! Алиса ведь только знакомится с играми! The Legend of Zinda: Lonk's Awakening — очевидный выбор для новичка!"
21060-19 = "Извините, но я не могу молчать. Следующей должна быть Romancing NaGa. Хотя третью часть можно пропустить..."
21060-20 = ""
21060-22 = "...?"
21060-23 = "..."
21060-24 = ""
21060-25 = "Возбуждение подтверждено. Запускаю игру."
21060-27 = "(Два часа спустя...)"
21060-28 = "*бип-боп-буп*"
21060-29 = "Вау, ты так быстро читаешь, Алиса. И понимаешь всё, что на экране?"
21060-30 = "Эй, Алис, давай следующей попробуем Strategem Ogre! Я познакомлю тебя с миром тактических игр!"
21060-31 = "*кивает*"
21060-32 = "*бип* *боп* *буп* *боп*"
21060-33 = ""
21060-34 = "Хр-р..."
21060-35 = "Хр-р— м-м..."
21060-36 = "*бип* *боп* *буп* *боп*"
21060-37 = ""
21060-38 = "*бип* *боп* *буп* *боп*"
21060-39 = "Пройдено."
21060-40 = ""
21060-41 = "*бип* *боп* *буп* *боп*"
21060-42 = "...И— пройдено."
21060-44 = "*чирик-чирик*"
21060-45 = "Угххх..."
21060-46 = "У-Уже утро?! О нет! Нужно готовиться в школу!"
21060-47 = "*крадётся*"
21060-48 = "Наконец-то вы открыли глаза..."
21060-49 = "Слава богу. Я уже не была уверена, что вы вообще проснётесь."
21060-50 = "А?!"
21060-51 = "Алиса! Ты теперь нормально разговариваешь!"
21060-52 = "Воистину, смертная. Воззри на меня и познай истину."
21060-53 = "Х-Ха-ха. П-Похоже, есть ещё над чем работать."
21060-54 = "Эм. Доброе утро всем..."
21060-55 = ""
21060-56 = "*скрип*"
21060-57 = "Доброе утро!"
21060-58 = "Вот, держи, Алис."
21060-59 = ""
21060-60 = ""
21060-62 = "...?"
21060-63 = "Получен загадочный предмет!"
21060-65 = "Ого! Ты уже так хорошо говоришь. Это ученический билет."
21060-66 = "Вообще-то даже круто, что она говорит как персонаж ретро-игры..."
21060-67 = "Ученический билет?"
21060-68 = "Он нужен, чтобы доказать, что ты учишься в нашей школе. Веритас взломали — то есть зарегистрировали тебя в списке академии, так что теперь ты одна из нас!"
21060-69 = "Одна из вас? То есть я союзник?"
21060-70 = ""
21060-71 = "Пам-па-ка-пан! Алиса присоединилась к отряду!"
21060-73 = "Э-Это правда сработает?"
21060-74 = "Конечно! У нас уже есть форма и ученический билет! Всё будет норма-а-а-ально..."
21060-75 = "Следующий пункт в списке..."
21060-76 = "...оружие."
21060-77 = "Ладно, Алиса. Мы хотим тебе кое-что показать."
21060-78 = "То есть...?"
21060-79 = ""
21060-81 = "Устроим большую экскурсию по школе Милленниума!"
21060-83 = "Следующий эпизод;Слишком велик, чтобы называться пушкой"
