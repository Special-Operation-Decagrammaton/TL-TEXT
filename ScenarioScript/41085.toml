[translation]
41085-2 = "Tsc, onde diabos aquela ladra se meteu?"
41085-3 = "Não deve ter ido longe... Procurem por aqui!"
41085-8 = "Já disse que não somos ladras!"
41085-9 = "Saki, abaixe a voz. Vão acabar nos descobrindo."
41085-13 = "Acampamento RABBIT, aqui é RABBIT 1. Chegamos ao Ponto Echo. O alvo \"Cenoura\" também foi assegurado com sucesso. Felizmente não há feridos, mas..."
41085-14 = "Com o confronto de agora há pouco, a rota de fuga do plano original ficou inutilizável."
41085-15 = "Além disso, confirmamos reforços inimigos..."
41085-17 = "Bom, eu já sabia que ia dar nisso no momento em que a Saki virou líder."
41085-18 = "Ela só é perfeita na teoria; na prática, só faz besteira."
41085-19 = "Cala a boca! Você também era um desastre nos exercícios práticos, Moe!"
41085-20 = "Droga, o que foi que deu errado...?"
41085-21 = "[s] \"É bem comum as coisas não saírem como o planejado na prática.\""
41085-22 = "Tsc, era a chance perfeita de mostrar do que a SRT é capaz... Que vergonha passar um vexame desses na frente de Schale..."
41085-24 = "...A propósito, onde está a Miyu?"
41085-25 = "Ué, ela não está com vocês? No GPS, o sinal dela está bem em cima do de vocês."
41085-27 = "Não pode ser..."
41085-31 = "Aquela idiota...!"
41085-32 = "Ela deixou o rádio dentro da bolsa!"
41085-33 = "Ela deve ter entrado em pânico durante o confronto."
41085-34 = "Se ela se moveu dali..."
41085-35 = "Será que foi para aquele guindaste de torre no Prédio B?"
41085-36 = "Prédio B...? Pelo que eu vi agora há pouco, aquele lugar estava infestado de seguranças!"
41085-37 = "Nem tem cobertura por ali, não dá para esperar que ela consiga escapar sozinha..."
41085-38 = "...Saki, o que fazemos?"
41085-39 = "Como assim o que fazemos? Só nos resta resgatá-la."
41085-40 = "Nesse caso, vamos ter que deixar este tambor para trás. Afinal, não dá para lutar carregando um tambor nas costas..."
41085-41 = "Tem razão. É uma pena, mas vamos desistir da \"Cenoura\" e priorizar o resgate."
41085-42 = "Os inimigos estão em grande número... É melhor nos prepararmos para o pior."
41085-46 = "...Sensei?"
41085-47 = "Aconteceu alguma coisa?"
41085-48 = "[s] \"Que tal irmos escondidos dentro dos tambores?\""
41085-50 = "...Está falando sério?"
41085-51 = "Mover-se coberta por um tambor para enganar os olhos do inimigo...?"
41085-52 = "...Espera, eu já li sobre isso em um livro."
41085-53 = "A história de um agente lendário que concluiu inúmeras missões de infiltração usando caixas de papelão e tambores..."
41085-54 = "Não, por mais que diga isso, não tem como eles não desconfiarem..."
41085-55 = "Mas também não temos outra opção, né?"
41085-56 = "Eu também não quero seguir as ordens desse Sensei."
41085-57 = "Mas a operação fracassar por um erro meu, ou uma integrante se machucar, seria muito pior..."
41085-58 = "...Entendido. Vamos seguir esse plano."
41085-59 = "Sendo assim, equipem um tambor compatível com a sua altura."
41085-60 = "Vamos resgatar a RABBIT 4!"
41085-66 = "...Hã? Sempre teve um tambor ali?"
41085-67 = "Sei lá. Quantos tambores você acha que tem neste porto? Não me diga que você decorou a posição de todos eles."
41085-68 = "É, faz sentido..."
41085-69 = "Só que parece meio estranho, tipo... eu tive a impressão de que ele se mexeu..."
41085-70 = "Você só está cansado."
41085-71 = "Anda, vamos pegar logo essa ladra e ir descansar."
41085-77 = "...Não acredito que eles realmente não perceberam."
41085-78 = "Eu também estava com um pé atrás, mas..."
41085-79 = "Parece ser mais eficaz do que qualquer camuflagem ou cobertura comum."
41085-80 = "Se funciona tão bem assim, dá até vontade de levar um monte de volta."
41085-81 = "Bem, não é muito realista carregar mais de dois sozinha."
41085-82 = "Quando voltarmos para a SRT, vamos considerar a compra de alguns."
41085-86 = "...RABBIT 2, estamos quase chegando ao ponto de encontro."
41085-91 = "G-Gente, para onde vocês foram...?"
41085-92 = "Saki-chan... Miyako-chan...?"
41085-93 = "Nessa situação não posso nem gritar, e ainda perdi meu rádio em algum lugar..."
41085-94 = "É o meu fim... Vou ser esquecida por todo mundo desse jeito..."
41085-95 = "Vou acabar secando até morrer aqui em cima deste guindaste..."
41085-99 = "...?"
41085-103 = "O-O tambor se mexeu...!?"
41085-104 = "Miyu!"
41085-105 = "E ainda fala...!?"
41085-106 = "O-O que é isso? Uma nova criatura não identificada!? O Caos Rastejante...!?"
41085-107 = "Aqui! Entra logo aqui dentro!"
41085-108 = "Uuu, o monstro quer me arrastar para dentro e se fundir comigo...!?"
41085-109 = "S-Senhor Tambor, mesmo se me comer, eu provavelmente não tenho um gosto bom...!"
41085-110 = "É hora de falar esse tipo de besteira?!"
41085-111 = "Em vez de morrer seca, eu vou acabar devorada por um tambor..."
41085-113 = "Que fim mais terrível...!"
41085-115 = "Ah, que saco!"
41085-119 = "Sou eu! Acorda!"
41085-120 = "S-Saki-chan...?"
41085-121 = "Usamos tambores para chegar até aqui sem sermos vistas. Anda, vamos logo."
41085-122 = "S-Saki-chan... Eu achei que vocês tinham me abandonado..."
41085-123 = "Não foi nada disso, anda, entra logo."
41085-124 = "E uma aluna da SRT não chora em meio a uma operação!"
41085-125 = "U-Uhum..."
41085-126 = "Então, antes que os guardas percebam, rápido—"
41085-130 = "Ali! São invasoras!"
41085-134 = "Tsc, fomos descobertas!"
41085-136 = "Inimigos se aproximando... Ih, é um monte de drones."
41085-137 = "RABBIT 2, quais são as ordens?"
41085-138 = "Nessas horas..."
41085-140 = "Só corram!!"
41085-153 = "Depois disso, corremos sob uma chuva de balas ainda dentro dos tambores... e, de alguma forma, conseguimos voltar ao parque."
41085-155 = "Parque Kousagi - Acampamento do Esquadrão"
41085-158 = "Arf, arf... Chegando até aqui, acho que estamos seguras..."
41085-159 = "Uau, o que é isso? Uma criatura não identificada? O Caos Rastejante?"
41085-160 = "...Bom, vamos queimar isso uma vez, por via das dúvidas."
41085-161 = "Para com isso! Sou eu, sou eu!"
41085-165 = "Quem é que você está chamando de Caos Rastejante? Aliás, a Miyu também falou a mesma coisa agora há pouco..."
41085-167 = "...Conseguimos voltar em segurança."
41085-168 = "Ainda bem que ninguém se machucou."
41085-169 = "...E você, Sensei [USERNAME], sofreu algum ferimento?"
41085-170 = "[s1] \"Eu também estou bem.\"\n[s2] \"Graças aos tambores.\""
41085-171 = "Que alívio. Se por acaso o Sensei se machucasse durante a nossa operação..."
41085-172 = "Que alívio. Se por acaso o Sensei se machucasse durante a nossa operação..."
41085-173 = "Não dá nem para imaginar que tipo de punição receberíamos do Conselho Estudantil Geral de novo."
41085-175 = "Nossa, mas a Saki passou um baita vexame, hein. E olha que estava toda confiante."
41085-176 = "Continua péssima na prática, né~"
41085-177 = "Cala a boca. Se não fossem os imprevistos, teria acabado em 5 minutos."
41085-178 = "Sério, a realidade é sempre assim..."
41085-179 = "N-Não sai mesmo conforme o manual, né..."
41085-181 = "De qualquer forma, bom trabalho a todas."
41085-182 = "É fato que a operação foi um sucesso sob o comando da Saki."
41085-183 = "...Humpf."
41085-184 = "Enfim, estou toda grudenta de suor..."
41085-185 = "Nessas horas dá muita vontade de tomar um banho, mas..."
41085-186 = "Kuhihi, sabia que você ia dizer isso..."
41085-187 = "Por isso eu já deixei a lenha e tudo o que precisamos pronto de antemão! Vamos, vamos logo tomar banho!"
41085-188 = "Quer dizer que você ficou preparando o banho durante a operação...?"
41085-189 = "Normalmente isso daria medida disciplinar... Mas bom, já que dá para tomar banho, vou aproveitar."
41085-193 = "...Então, vamos fazer mais um trabalhinho."
41085-196 = "Entendido!"
41085-207 = "Aah... Estou revivendo..."
41085-208 = "Não tem nada melhor que um banho para recuperar as energias..."
41085-209 = "Banho de tambor não é nada mal, até melhor do que eu pensava."
41085-210 = "A temperatura da água também está ótima..."
41085-211 = "Parece difícil regular a temperatura disso..."
41085-212 = "Igual a um sapo na água morna, eu vou acabar..."
41085-213 = "Não se preocupe. Estou monitorando tudo direitinho com a termografia."
41085-214 = "Na verdade, não está meio morno demais assim?"
41085-215 = "Quer que eu jogue um pouco de pó de termite?"
41085-216 = "Idiota! Vai explodir tudo!!"
41085-217 = "Além disso, nessa temperatura está ótimo. Se esquentar mais que isso, vamos virar ensopado de coelho."
41085-218 = "Tomar banho todas juntas assim até que é bem divertido."
41085-219 = "Mesmo quando voltarmos para a SRT um dia, de vez em quando podíamos..."
41085-220 = "[s] \"Mas é bom ficar de olho para ver se ninguém aparece, né.\""
41085-221 = "Ah, está tudo bem. Não tem ninguém por perto."
41085-222 = "Entre nós do esquadrão já nem ligamos de nos ver sem roupa, e ninguém vem ao parque a essa hora."
41085-223 = "Mesmo se alguém aparecer, as minas terrestres e as torretas vão disparar."
41085-224 = "...A propósito, por que o Sensei está aqui?"
41085-225 = "[s3] \"Meio que fui levado pelo momento, sabe...\"\n[s4] \"...De vigia?\""
41085-232 = "..."
41085-234 = "Ei, o que você está fazendo aqui?! Espiar alunas tomando banho é completamente inaceitável!!"
41085-235 = "Dessa vez não pode nem reclamar se levar um tiro!!"
41085-236 = "E-Eu sabia, você esperou a operação acabar para aproveitar que estamos desarmadas...!?"
41085-237 = "...Moe, os mísseis."
41085-238 = "Beleza, toma essa!!"
41085-244 = "Parque Kousagi - Beco Próximo"
41085-245 = "Líder, parece que chegaram novatas naquele parque."
41085-246 = "O destino é algo que vem como o vento e parte como o vento..."
41085-247 = "Não podemos concluir precipitadamente se isso é bom ou ruim."
41085-248 = "No entanto, se elas desejam coexistir conosco... precisarão cultivar o espírito do \"desapego\", aceitando as coisas como elas são."
41085-249 = "...O que acharam delas? Elas também são seres nobres que se orgulham do mesmo desapego que nós?"
41085-250 = "Não. Longe do desapego, estão completamente tomadas pela ganância."
41085-251 = "Além disso, são absurdamente proativas e levaram quase todas as marmitas vencidas... até os bentôs de broto de feijão que quase nunca sumiam!"
41085-252 = "Também levaram toda a sucata... mal conseguimos fazer nossos próprios reparos."
41085-253 = "Entendo... Que pena, com um encontro tão fortuito, mas elas foram corrompidas pelo desejo material..."
41085-260 = "Eu não queria causar alarde, mas... muito bem, preparem as armas."
41085-262 = "A essas pessoas vulgares que perderam a moral, cegadas pela cobiça..."
41085-264 = "Vamos ensinar a elas a \"alegria do desapego\"!"
41085-266 = "Próximo;Sombra à Espreita"
