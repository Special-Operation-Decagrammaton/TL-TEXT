[translation]
41085-2 = "Тс, куда делись воришки?"
41085-3 = "Они должны быть здесь! Обыщите каждый угол."
41085-4 = ""
41085-6 = ""
41085-8 = "Хватит называть нас воришками!"
41085-9 = "Саки, прошу, будь тише! Враги всё ещё рядом."
41085-10 = ""
41085-12 = ""
41085-13 = "RABBIT 1 докладывает Лагерю. Мы прибыли на точку Эхо, морковка у нас. Потерь нет."
41085-14 = "Но наш изначальный путь эвакуации теперь заблокирован."
41085-15 = "И к противнику уже движется крупное подкрепление."
41085-17 = "Ого. Саки снова всё испортила? Так неожиданно. А, нет."
41085-18 = "Маленькая мисс лучшая в классе, но абсолютно бесполезная в реальной полевой работе."
41085-19 = "Заткнись, Мое! Я всё равно лучше тебя!"
41085-20 = "Не понимаю. Я думала, что это лучший план…"
41085-21 = "[s] «В реальной жизни идеальных планов не существует.»"
41085-22 = "Я думала, что смогу показать Сенсею силу SRT… Вместо этого я опозорила и себя, и академию."
41085-24 = "Погодите…. А где Мию?"
41085-25 = "Она не с тобой? Её индикатор GPS рядом с тобой."
41085-27 = "Это невозможно…"
41085-28 = ""
41085-30 = ""
41085-31 = "Мию, ну ты и дура!"
41085-32 = "Она оставила свою рацию в сумке!"
41085-33 = "Должно быть, она запаниковала и бросила её, когда противник начал надвигаться на неё."
41085-34 = "Дайте подумать. Мию склонна выполнять приказы буквально, до единой буквы. Ты сказала ей забраться так высоко, как только она может…"
41085-35 = "Полагаю, она на башенном кране у здания Б."
41085-36 = "Не может быть. Там же всё просто кишит охранниками."
41085-37 = "Оттуда ведь нет никакого выхода. Она точно застряла там наверху."
41085-38 = "Что нам делать, Саки?"
41085-39 = "Что за глупый вопрос? Операция \"Морковь\" официально превращается в спасательную операцию."
41085-40 = "Придётся оставить бочки. Мы не сможем одновременно сражаться и тащить их на себе."
41085-41 = "К сожалению, соглашусь. Теперь вернуть Мию целой и невредимой - наша основная задача."
41085-42 = "Но противник сильно превосходит нас числом. Мы должны быть готовы понести урон."
41085-43 = ""
41085-45 = ""
41085-46 = "...Сенсей?"
41085-47 = "У Вас есть план?"
41085-48 = "[s] «Давайте залезем в бочки.»"
41085-50 = "Прошу прощения? Вы предлагаете скрываться в бочках, пока мы продвигаемся к Мию?"
41085-51 = "Нам нужны более реалистичные предложения, Сенсей."
41085-52 = "…А ведь я читала о подобном ранее."
41085-53 = "В одной из наших книг говорилось о легендарном агенте, который скрывался в коробках и бочках, чтобы выполнять невыполнимые миссии по проникновению."
41085-54 = "И как мы будем передвигаться? Самостоятельно ползущие бочки привлекут только больше внимания."
41085-55 = "Понимаю, что это не лучший вариант, но что нам остаётся?"
41085-56 = "Да я лучше использую свой драгоценный учебник как подставку для кружки, чем буду слушать это Воплощение Зла…"
41085-57 = "Но… Мию в такой ситуации из-за меня. Я не могу её бросить."
41085-58 = "Понятно. На время этой миссии я вверяю свою судьбу в Ваши руки."
41085-59 = "Всем найти и использовать железные бочки в качестве укрытия."
41085-60 = "Выдвигаемся! Операция \"Морковь\": Спасение Мию!"
41085-64 = ""
41085-66 = "Может, я схожу с ума, но эта бочка всегда была здесь?"
41085-67 = "Да эти бочки везде валяются, это же погрузочная площадка. Что с тобой вообще не так?"
41085-68 = "Я же говорю, понимаю, что звучу безумно, но всё-таки…"
41085-69 = "Клянусь, секунду назад эта бочка двигалась."
41085-70 = "Ты снова слишком много выпил за ужином?"
41085-71 = "Так, протрезвей. Босс снесёт наши головы, если воришки сбегут."
41085-72 = ""
41085-74 = ""
41085-76 = ""
41085-77 = "…Я не понимаю. Как это вообще работает?"
41085-78 = "Должна признать, я сама была настроена довольно скептично."
41085-79 = "Но это было самое простое проникновение в нашей жизни."
41085-80 = "Если бы я знала, что это так эффективно, я бы взяла больше бочек для будущих миссий."
41085-81 = "Ха-ха, нам вряд ли бы удалось утащить больше бочек."
41085-82 = "Однажды, когда мы вернёмся в Академию SRT, мы сможем запросить бюджет, чтобы купить тебе столько бочек, сколько захочешь."
41085-83 = ""
41085-86 = "RABBIT 2. Мы достигли точки назначения. Приготовиться к контакту."
41085-90 = ""
41085-91 = "К-куда все делись?"
41085-92 = "Саки? Мияко? Есть кто-нибудь? С-Сенсей?"
41085-93 = "Если я буду говорить слишком громко, охранники смогут найти меня… И… И я, кажется, забыла рацию…"
41085-94 = "На этот раз всё по-настоящему. Они забыли обо мне и вернулись домой."
41085-95 = "Я исчезну, как дурной сон… Они будут веселиться и строить совместные воспоминания, пока я буду превращаться в пыль на этом кране…"
41085-96 = ""
41085-98 = ""
41085-99 = "Кья! Что это?"
41085-100 = ""
41085-102 = ""
41085-103 = "Она… она двигается?! Это же движущаяся бочка!"
41085-104 = "Мию! Мию!"
41085-105 = "Она знает моё имя? Погоди-ка… Она ещё и говорящая?"
41085-106 = "Ч-что за чёрт? Неведомое чудище?! Или это жуткое, ползучее предзнаменование надвигающегося конца света?!"
41085-107 = "Быстрее, залезай внутрь!"
41085-108 = "Это монстр! Он хочет съесть меня живьём!"
41085-109 = "П-пощади меня, бочкомонстр! Я маленькая и совсем невкусная, правда-правда!"
41085-110 = "Да что ты такое несёшь? Давай, залезай уже!"
41085-111 = "Я потерянная и забытая в этом холодном мире.... И теперь… Меня сожрёт этот ужасный бочкомонстр?"
41085-113 = "Я ХОЧУ ДОМОЙ!"
41085-115 = "Ты сейчас это серьёзно?"
41085-116 = ""
41085-118 = ""
41085-119 = "Эй, Мию! Это я, Саки."
41085-120 = "Саки?"
41085-121 = "Я спряталась в бочке, чтобы спасти тебя. Смотри, нет никакого бочкомонстра."
41085-122 = "Вааааа… Саки… Я думала, что вы забыли обо мне! *шмыг*"
41085-123 = "Ты реально думала, что мы так поступим?"
41085-124 = "А теперь давай, больше не плачь. Ты элита SRT!"
41085-125 = "Хорошо... *шмыг*"
41085-126 = "Давай, залезай в бочку, пока не пришли охранники."
41085-127 = ""
41085-130 = "НАРУШИТЕЛИ!"
41085-131 = ""
41085-134 = "Упс. Уже немного поздно."
41085-136 = "Не хотелось бы прерывать ваше воссоединение, но противник наступает слева, справа, со всех сторон!"
41085-137 = "RABBIT 2, твоё решение. Вступаем в бой?"
41085-138 = "В учебнике была описана подобная ситуация…"
41085-140 = "БЕЖИМ!"
41085-141 = ""
41085-153 = "Они быстро бросились в парк, прикрываясь от дождя пуль своими бочками…"
41085-155 = "Парк Коусаги, Лагерь"
41085-157 = ""
41085-158 = "*пха* *ха* Эти настырные охранники… Мы действительно оторвались от них?"
41085-159 = "Ого-го-го. Кто впустил сюда эту штуку? Это неведомое чудище? Или ползучий ужас Кивотоса?"
41085-160 = "Я никак не могу понять… Возможно, я должна сделать ба-бах…"
41085-161 = "Хватит паясничать. Это мы!"
41085-162 = ""
41085-164 = ""
41085-165 = "И как вообще получилось, что у тебя и Мию одна и та же реакция? И что ещё за ползучий хаос?"
41085-167 = "Я рада, что все вернулись обратно."
41085-168 = "А также рада, что все вернулись в целости и сохранности."
41085-169 = "Вы ведь не пострадали, [USERNAME] Сенсей?"
41085-170 = "[s1] «В полной целости и сохранности.»\n[s2] «Нет ни царапины, и всё благодаря бочке!»"
41085-171 = "Я рада. Если бы Сенсей пострадал во время нашей миссии…"
41085-172 = "Я рада. Если бы Сенсей пострадал во время нашей миссии…"
41085-173 = "Генеральный Студенческий Совет спустил бы с нас шкуру."
41085-175 = "Хи-хи, Сакииии~ Тебе не нужно подлечить своё маленькое эго? Мисс Идеал не продержалась и пяти минут в роли командира, как всё пошло наперекосяк."
41085-176 = "Признай. В полевых условиях ты так же хороша, как и я."
41085-177 = "Е-если бы не эта маленькая оплошность, я бы выполнила эту миссию с закрытыми глазами!"
41085-178 = "Ну почему всё никогда не получается так, как на бумаге?"
41085-179 = "Потому что реальность отличается от книг…"
41085-181 = "В любом случае, операция завершена успешно. Мы доставили морковку, и никто не пострадал."
41085-182 = "И всё благодаря тебе, Саки."
41085-183 = "...Спасибо."
41085-184 = "Что важнее, я вся пропотела и пахну порохом."
41085-185 = "Мне до смерти хочется снять всю эту грязь, но помыться в лагере - это не так просто, как повернуть кран."
41085-186 = "Хи-хи-хи. Я так и знала, что ты это скажешь."
41085-187 = "Та-да! Я заранее взяла дрова и полотенца, так что каждый может насладиться приятной горячей ванной."
41085-188 = "Ты добыла всё это, пока мы выполняли операцию?"
41085-189 = "Технически это противоречит процедуре и влечёт за собой дисциплинарное взыскание. Но… основной целью этой операции было принять ванну, верно?"
41085-190 = ""
41085-192 = ""
41085-193 = "Отряд RABBIT, время мыться!"
41085-195 = ""
41085-196 = "Ура! Поддерживаю!"
41085-207 = "Ах… Вот это я понимаю."
41085-208 = "Я уже и позабыла, как это круто! Горячая ванна после миссии - лучше всего на свете!"
41085-209 = "Эта бочка к тому же оказалась очень комфортной."
41085-210 = "И температура что надо…"
41085-211 = "С-сейчас всё прекрасно, н-но что если вода будет становиться всё горячее и горячее, и в конце концов мы все сваримся?"
41085-212 = "Разве вы не слышали, как лягушек медленно варят живьём?"
41085-213 = "Не забивай свою маленькую ноющую головку глупостями. Смотри, этот тепловизор отслеживает температуру."
41085-214 = "Я бы даже сказала, что вода, наоборот, становится холоднее…"
41085-215 = "Как насчёт того, чтобы подсыпать в дрова немного термитного порошка? Хи-хи."
41085-216 = "Ну хоть раз в жизни ты можешь не думать о зажигательных смесях? Что с тобой не так?!"
41085-217 = "И вообще, сейчас всё и так нормально. Мне бы не хотелось, чтобы мы превратились в кроличье рагу."
41085-218 = "Должна признать, в этом есть своё очарование. Мы все вместе принимаем ванну в парке."
41085-219 = "Давайте когда-нибудь снова отправимся в поход. После того, как мы выполним свою миссию и заново откроем Академию SRT."
41085-220 = "[s] «Кстати, вас не смущает, что вы моетесь прямо под открытым небом?»"
41085-221 = "Конечно нет. Ведь за ним никто не смотрит."
41085-222 = "Затяжные миссии часто требуют от нас мыться и переодеваться в таких условиях, так что ничего нового."
41085-223 = "А в этом парке очень редко появляются посетители. Те немногие, кто забредут так далеко, встретят наши мины и автоматические турели."
41085-224 = "...Но кое-кто НА НАС смотрит."
41085-225 = "[s3] «Я не совсем знал, куда идти…»\n[s4] «Полагаю, я… караульный?»"
41085-226 = ""
41085-227 = ""
41085-232 = "..."
41085-234 = "Караульный? Прямо сейчас Вы подглядываете за моющимися студентами!"
41085-235 = "Убирайтесь! Проваливайте прямо сейчас и больше не возвращайтесь!"
41085-236 = "Я-я так и знала, что этот жуткий учитель что-то сделает с нами, пока мы беззащитны!"
41085-237 = "Мое, настоящим я разрешаю тебе использовать абсолютно все твои зажигательные устройства."
41085-238 = "ВЗОРВИСЬ, ИЗВРАЩЕНЕЦ!"
41085-239 = ""
41085-244 = "Переулок рядом с Парком Коусаги"
41085-245 = "Эй, Босс. У нас тут в парке неподалёку какие-то новенькие завелись."
41085-246 = "Люди по своей сути изменчивы. Подобно ветру, они приходят и уходят."
41085-247 = "Ты не должен нарушать своё внутреннее спокойствие из-за такой мелочи."
41085-248 = "Однако, если они не уйдут, им придётся научиться сосуществовать с нами. Они должны будут принять наши идеалы нестяжания и освободиться от мирских желаний общества."
41085-249 = "Скажи мне. Как думаешь, смогут ли они прозреть и посвятить себя нашему благородному делу?"
41085-250 = "Да конечно нет! Они самые алчные люди, которых мы только видели."
41085-251 = "Они обчистили все магазины в поисках списанных бенто, которые раньше можно было найти на каждом шагу. Теперь мы не можем раздобыть даже паршивое бенто с ростками маша."
41085-252 = "И их ручонки, похоже, считают, будто всё вокруг принадлежит им! Они тащат всё подряд: от деревянных брусьев до брезента! Мы теперь, вероятно, даже не сможем восстановить наше святилище!"
41085-253 = "О боже. Похоже, группа новоприбывших - это всего лишь стая прожорливых гоблинов."
41085-254 = ""
41085-258 = ""
41085-259 = ""
41085-260 = "Ну что же, товарищи. Берите оружие."
41085-261 = ""
41085-262 = "Давайте преподадим урок этим аморальным, жадным чревоугодникам…"
41085-263 = ""
41085-264 = "Урок о подлинных радостях нестяжания!"
41085-266 = "Следующий эпизод;Подозрительная тень"
