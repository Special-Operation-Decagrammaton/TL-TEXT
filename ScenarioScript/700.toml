700-10 = "Ч-Что-о-о?"
700-11 = "[s] «...?!»"
700-12 = "П-Простите, э-эм, секундочку...! А-а-а!"
700-14 = "Я падаю!"
700-15 = "[ns] Поймать её."
700-17 = ""
700-18 = "В-Вы спасли меня..."
700-19 = "С-Спасибо... Я чуть не умерла..."
700-20 = "П-Подождите...!"
700-21 = "Вы тот самый Сенсей из Шале?! Простите! Я-Я могла вас раздавить!"
700-22 = "[s] «Вы...»"
700-23 = "Ой, как невежливо с моей стороны. Я Аюму из Регламентного комитета Генерального студенческого совета."
700-24 = "Сейчас я также временно служу секретарём Рин... то есть главного администратора."
700-25 = "[s] «Приятно познакомиться, Аюму»."
700-26 = "Да! М-Мне тоже приятно, Сенсей."
700-27 = "Я много о вас слышала... Все говорят, вы потрясающий человек... во всех смыслах..."
700-28 = "А я тем временем даже стопку документов организовать не могу."
700-29 = "[s1] «Какая большая стопка. Тебе помочь?»\n[s2] «Я могу чем-нибудь помочь?»"
700-30 = "Что?!"
700-31 = "Что?!"
700-32 = "В-Вы правда поможете... мне?"
700-33 = "Я очень рада, но... каждый день этого столько. Не могу вас нагружать..."
700-34 = "[s] «Всё нормально»."
700-35 = "Вы... правда?"
700-36 = "Т-Тогда я была бы очень благодарна..."
700-37 = ""
700-39 = ""
700-40 = ""
700-41 = "Можете сначала проверить вот это?"
700-43 = "(Так я начал вместе с Аюму из Генерального студенческого совета решать множество разных задач.)"
