[translation]
101070-1 = "Эпизод 7; Созыв Комитета экстренного реагирования"
101070-2 = "Запрос о созыве Комитета экстренного реагирования был отправлен в каждый район."
101070-4 = "Это..."
101070-5 = "Что такое, Аяне?"
101070-7 = "Сакурако..."
101070-8 = "...Сообщение от Генерального студенческого совета."
101070-10 = "..."
101070-12 = "Генеральный студенческий совет хочет сформировать Комитет экстренного реагирования... Сколько лет прошло с прошлого раза?"
101070-13 = "Я слышала, Сенсей сообщил Генеральному студенческому совету о нашем вещем сне. Может, это стало причиной?"
101070-14 = "Генеральный студенческий совет не из тех, кто принимает настолько радикальные меры из-за одной догадки. Скорее всего, здесь есть нечто, чего мы ещё не знаем."
101070-15 = "Однако с исчезновения президента я настороженно отношусь к Генеральному студенческому совету. Нанагами Рин пока не давала поводов для опасений, но слепо следовать за ней было бы глупо."
101070-16 = "Буря внутри Совета после исчезновения президента очевидна всем. Прежде всего нужно обсудить ситуацию с Сенсеем."
101070-17 = "На данный момент я не вижу причин отказываться."
101070-18 = "...Сенсей будет рядом с нами."
101070-19 = "Хотя наше решение присутствовать, возможно, поддержат не все. Здесь указано, что приглашены Общество Пандемониума, Старшая Сестра Миллениума, Красный Диктатор и даже Тёмный Монарх."
101070-20 = "Сомневаюсь, что встреча с такой компанией пройдёт гладко. Меня беспокоят возможные политические распри."
101070-21 = ""
101070-23 = ""
101070-25 = ""
101070-28 = "О боже! Наги! Сэя! Что вы тут делаете?"
101070-29 = "М-Мика..."
101070-30 = "Ого, ух ты! Дай посмотрю! Генеральный студенческий совет просит всех членов Чаепития прийти на заседание Комитета экстренного реагирования?"
101070-31 = "Звучит так драматично! Похоже, выбора у меня нет, да? Что надеть? И волосы надо завить!"
101070-32 = ""
101070-34 = ""
101070-35 = "Хм? Там ещё будут Геенна и Общество Пандемониума?"
101070-36 = "..."
101070-37 = "Мика... Пожалуйста..."
101070-38 = "Пожалуйста что, Наги? Не устраивать неприятностей? Ты меня до сих пор не знаешь? Хи-хи! ☆"
101070-39 = "Сенсей ведь будет там, да? Мне нужно показать, насколько я выросла!"
101070-40 = ""
101070-42 = ""
101070-44 = "..."
101070-45 = "*вздох* ...У меня уже болит голова."
101070-46 = "Наш шанс наконец настал, Ироха! Пора!"
101070-47 = "...Пора что?"
101070-48 = "Мы поднимемся на высоту положения и докажем мощь Общества Пандемониума Генеральному студенческому совету и самому Шале!"
101070-49 = "Я перехватила сообщение до того, как оно дошло до Префектурной команды! Хи-хи-хи. Мы осуществим наш план без их невыносимого вмешательства!"
101070-50 = "...Для начала хотя бы скажи, что за план, Макото."
101070-51 = "Генеральный студенческий совет не посадит нас рядом с Тринити. Они не настолько тупые."
101070-52 = "Ну... Надеюсь, Сенсей не даст всему превратиться в полный кошмар."
101070-54 = "...У вас 51 234 непрочитанных сообщения."
101070-55 = ""
101070-57 = "...У вас 51 235 непрочитанных сообщений."
101070-59 = "Госпожа! Это..."
101070-60 = "Не шуми. Я знаю."
101070-61 = "Д-да, мэм."
101070-62 = "Не мне вмешиваться. Но я должна знать, что происходит."
101070-64 = "Мне странно, что Генеральный студенческий совет пригласил нас. Мы удалены от него и географически, и политически."
101070-65 = "Нья-ха-ха! Согласна! В последнее время они всё чаще с нами связываются, да, Кахо?"
101070-66 = "...Это не повод для смеха, Ния."
101070-67 = "Нья-ха-ха. Пожалуй, ты права."
101070-68 = "Будь Хяккарёран на месте, мы могли бы свалить такие хлопоты на них..."
101070-70 = "В последнее время президента не видно. Что происходит?"
101070-71 = "Ты не слышала? После последнего переворота она прячется в горах."
101070-72 = "Опять? Кто на этот раз устроил?"
101070-73 = "Эх. Какая разница? Не первый и не последний."
101070-74 = "Хотите поспорить, сколько она в этот раз будет отсутствовать?"
101070-75 = ""
101070-77 = ""
101070-80 = "Сенсей, Генеральный студенческий совет прислал нам письмо!"
101070-81 = "Старший администратор Рин собрала представителей студентов главных районов в так называемый Комитет экстренного реагирования!"
101070-82 = "А ещё Рин приложила отдельные данные специально для вас..."
101070-84 = "Там сказано, что по всему Кивотосу обнаружены объекты со сверхвысокой энергией."
101070-86 = "Но сами объекты невидимы..."
101070-87 = "Цель Комитета экстренного реагирования — заставить районы сотрудничать, чтобы выяснить причину и истинную природу этого явления!"
101070-88 = "Организовать студентов всех разных районов будет сложно, поэтому они попросили Сенсея прийти и помочь!"
101070-89 = "[s] «Спасибо за краткое объяснение, Арона.»"
101070-90 = "Это моя работа! Скоро за вами пришлют сопровождение. Вы важная персона, поэтому они предусмотрели все вопросы безопасности."
101070-91 = "А пока я подробнее изучу информацию, которую передала Рин."
101070-92 = "Если что-нибудь выясню, сразу сообщу!"
101070-93 = "[s] «На тебя всегда можно положиться. Спасибо.»"
101070-98 = ""
101070-99 = "Сенсей? Мы приехали за вами."
101070-100 = "Мы сопроводим вас до башни Санктум, где сейчас располагается Генеральный студенческий совет."
101070-101 = "[s] «Валькирия?»"
101070-102 = "Да. На аварийной вертолётной площадке Шале подготовлен вертолёт."
101070-104 = "Сюда, пожалуйста."
101070-105 = "[ns1] Сесть в вертолёт.\n[ns2] Войти в вертолёт."
101070-106 = ""
101070-107 = ""
101070-111 = "..."
101070-112 = "..."
101070-113 = "[s] «Кажется чрезмерным использовать тактический транспортный вертолёт только ради меня...»"
101070-114 = "Ну, мы всё-таки полицейская школа."
101070-115 = "У нас есть ресурсы, чтобы обеспечить такую поддержку столь важному человеку."
101070-116 = "[ns3] «...»\n[ns4] «...?»"
101070-120 = "А учитывая, что в наши дни бюджета едва хватает на патроны, мне не стоит быть эгоисткой."
101070-121 = "Такими темпами мне придётся сражаться с горохомётом против огнемёта! Или чем-то похуже!"
101070-122 = ""
101070-123 = "..."
101070-124 = "..."
101070-125 = "[ns5] «Вы кто такие?!» \n[ns6] «Вы не студенты Валькирии!»"
101070-128 = "..."
101070-129 = "..."
101070-130 = ""
101070-132 = ""
101070-133 = ""
101070-134 = ""
101070-135 = "[ns7] «...!!!»\n[ns8] «ЧВК „Кайзер“...!»"
101070-138 = "Быстро соображаете, Сенсей. Хотя недостаточно быстро."
101070-139 = "*трррк* Сенсей из Шале у нас."
101070-140 = "*трррк* Хорошая работа. Переходите к следующей фазе."
101070-142 = "Хи-хи-хи. Полагаю, миссия прошла успешно, генерал?"
101070-143 = ""
101070-145 = ""
101070-147 = ""
101070-148 = "Да. Сенсей из Шале захвачен."
101070-149 = "Верно."
101070-150 = "Без Сенсея Комитет экстренного реагирования окажется парализован, а авторитет главного администратора рухнет."
101070-151 = "И это ещё на шаг приблизит нас к нашей цели — ликвидации Шале..."
101070-152 = "...А?"
101070-153 = ""
101070-155 = ""
101070-157 = "А-Аргх...?!"
101070-158 = ""
101070-161 = "...Наконец-то мы поняли ваши истинные мотивы, начальник обороны."
101070-162 = "Ваша идея справедливости нас никогда не интересовала. На данном этапе ликвидация Шале нам невыгодна."
101070-163 = "Вы даже не заметили, что наши планы давно изменились."
101070-164 = ""
101070-166 = ""
101070-167 = ""
101070-168 = "Президент, это я."
101070-169 = "Здравствуйте, генерал. Всё идёт по плану?"
101070-170 = "Да. Всё проходит гладко."
101070-172 = ""
101070-173 = "Превосходно. Раз артефакт в пустыне уже у нас, силы Генерального студенческого совета нам больше не нужны, как и сотрудничество Управления обороны."
101070-174 = "Гематрия — тоже мелочная трата времени. С артефактом мы можем действовать самостоятельно."
101070-175 = "Приступайте к захвату Генерального студенческого совета. Одновременно мы получим административный контроль над башней Санктум."
101070-176 = "И тогда Корпорация Кайзер наконец вырвет контроль над Кивотосом из рук Генерального студенческого совета."
101070-177 = "...Хм? Не волнуйтесь. Они не доставят проблем."
101070-178 = ""
101070-179 = "...Понятно."
101070-180 = ""
101070-182 = ""
101070-183 = "После окончания заседания Комитета экстренного реагирования ждите в указанной зоне. Как только зал Генерального студенческого совета останется без защиты, мы его захватим."
101070-184 = "Наши цели — главный администратор Генерального студенческого совета и председатели. Но помните: главный администратор — приоритет."
101070-185 = "Есть, сэр."
101070-186 = "Что делать с начальником обороны?"
101070-187 = "Переведите её в тюрьму при штабе PMC. Даже её собственные солдаты там её не найдут."
101070-188 = "Без Сенсея и начальника обороны Комитет экстренного реагирования развалится. Когда мы займём Генеральный студенческий совет, а президент получит административный контроль над башней Санктум, в D.U. будет объявлено военное положение."
101070-189 = "После этого план перейдёт ко второму этапу."
101070-190 = "*трррк* Генерал, что делать с Сенсеем?"
101070-191 = ""
101070-192 = "*трррк* Заприте Сенсея там, где его никто не найдёт. И не позволяйте даже пошевелиться, даже если придётся прострелить конечность."
101070-193 = "Поняла!"
101070-194 = ""
101070-196 = ""
101070-197 = "[ns] «(Под дулом оружия...!)»"
101070-198 = ""
101070-203 = "Следующий Эпизод; Пришествие света"
