[translation]
10014025-10 = "У-Угх... Аргх... Ч-Что это...?"
10014025-11 = "Кто, чёрт возьми... на нас напал...?"
10014025-12 = ""
10014025-14 = ""
10014025-16 = "А-ха-ха-ха! Никто не скроется от Апостола Тринити, Узавы Рейсы! Стойте, злодеи!"
10014025-17 = "Серьёзно... Как ты это произносишь и не съёживаешься от стыда?"
10014025-18 = "И разве раньше ты не называла себя «Рыцарем народа»? Определись уже с именем!"
10014025-20 = "...Я пришла сразу, как ты попросила подкрепление, но ты уже со всем разобралась."
10014025-21 = "Наверное, на этом этапе я уже не должна удивляться."
10014025-22 = ""
10014025-23 = "Сузуми! Ты пришла!"
10014025-24 = "Прости! Мне пришлось пойти вперёд, пока злодеи не сбежали!"
10014025-25 = "Но я бы не справилась, если бы не знала, что ты уже идёшь! Спасибо!"
10014025-26 = "На тебя всегда можно положиться, Сузуми! Ты Светошумовая граната Тринити!"
10014025-27 = "Я-я рада, что всё обошлось..."
10014025-28 = "И ещё... умоляю, прекрати с этими странными прозвищами."
10014025-29 = "Хорошо, Светошумовая граната. А кого ты привела?"
10014025-30 = "Кажется... немного знакомым. Хм..."
10014025-31 = "[s1] «Привет, Рейса.»\n[s2] «Мы встречались сегодня утром.»"
10014025-32 = "А! Знаю!"
10014025-33 = "А! Знаю!"
10014025-34 = "Вы тот, кого схватила Кёяма Казуса, эта хулиганка! Вы в порядке? Она вас не ранила?!"
10014025-35 = "[s3] «Я и не знал, что был заложником...»\n[s4] «...Казуса — хулиганка?»"
10014025-36 = "Позвольте представить официально. Это Сенсей из Шале. Сенсей, это Рейса."
10014025-37 = "Позвольте представить официально. Это Сенсей из Шале. Сенсей, это Рейса."
10014025-38 = "Ого! Учитель?"
10014025-39 = "Знаете, кажется, я помню, что студенты что-то такое говорили."
10014025-40 = "[s5] «Позволь снова представиться. Привет, Рейса.»\n[s6] «Можешь считать меня и своим учителем, Рейса.»"
10014025-41 = "П-Привет! Я Узава Рейса, Апостол Тринити!"
10014025-42 = "П-Правда? Я Узава Рейса, Апостол Тринити!"
10014025-43 = "Рейса, вообще-то мы хотели поговорить с тобой о сегодняшнем утре, если у тебя есть минутка."
10014025-44 = "Нужно прояснить некоторую путаницу вокруг Кёямы Казусы."
10014025-45 = "О?"
10014025-46 = "Не понимаю! Что здесь путать в задержании злодеев?"
10014025-47 = ""
10014025-49 = ""
10014025-50 = "О нет... Не может быть..."
10014025-52 = "Человек, которого я видела похищающим Сенсея, был не Кёяма Казуса?"
10014025-54 = "Я вообще не это сказала."
10014025-55 = "Нет!"
10014025-56 = "Нет-нет-нет-нет! Ты ошибаешься!"
10014025-57 = "Что?!"
10014025-58 = "Сузуми. Я уверена на сто процентов. Та злая хулиганка была Кёяма Казуса!"
10014025-59 = "Она могла попытаться замаскироваться школьной формой, но мой острый глаз видит всё."
10014025-60 = "Казуса никогда не сможет скрыть ауру зверя, исходящую прямо из её души!"
10014025-62 = "Верно, Сенсей? Вы её видели! Это была Кёяма Казуса собственной персоной!"
10014025-63 = "[s7] «Это была Казуса, но...»\n[s8] «Аура зверя???»"
10014025-64 = "Я приму это за «да»! Я никогда не перепутаю эту опасную хулиганку!"
10014025-65 = "Я приму это за «да»! Я никогда не перепутаю эту опасную хулиганку!"
10014025-66 = "Сузуми, я знаю настоящий ужас..."
10014025-67 = ""
10014025-69 = "...ужас по имени Кёяма Казуса!"
10014025-71 = ""
10014025-72 = "Она легенда! Миф! Страшилка, которой родители пугают детей, чтобы те не шатались по улицам!"
10014025-73 = ""
10014025-74 = "Кат Палуг, дикая кошка, способная одним взглядом заморозить даже самых суровых хулиганок!"
10014025-75 = ""
10014025-77 = ""
10014025-78 = "Когда я училась в средней школе..."
10014025-79 = "Она была единственной хулиганкой, которую я не могла победить ни разу! Самый грозный враг!"
10014025-80 = "Другими словами..."
10014025-81 = "Она мой главный соперник!"
10014025-83 = "Разве Кат Палуг не кот-монстр из детской книжки? Ты и правда любишь прозвища."
10014025-84 = "Слушай, я не отрицаю всего этого, но хоть раз можешь просто остановиться и послушать?"
10014025-85 = "А потом однажды она просто загадочно исчезла! Никто не знает, где она скрывается в тенях!"
10014025-86 = "До сих пор! Я в шоке, что она выбрала мирную территорию Тринити, чтобы начать свои планы. Её зло не знает границ!"
10014025-87 = "Сузуми! Сенсей! Такими темпами Кат Палуг воскреснет и превратит нашу любимую академию в место тьмы и отчаяния!"
10014025-88 = "Это моя миссия как Апостола Тринити! Я должна... Нет! Я остановлю её!"
10014025-89 = "Помнишь, две минуты назад я просила тебя остановиться и послушать? Сенсей проделал весь этот путь, чтобы поговорить с тобой разумно."
10014025-90 = ""
10014025-92 = ""
10014025-93 = "Поговорить? Со мной?"
10014025-94 = "Что ты имеешь в виду? Справедливость здесь отстаиваю я!"
10014025-95 = "Ты говоришь, Кёяма Казуса больше не хулиганка? К-Кем ещё она может быть?"
10014025-96 = "О?"
10014025-97 = "Кёяма Казуса — это..."
10014025-98 = "...ОБЫЧНЫЙ студент?"
10014025-99 = ""
10014025-101 = ""
10014025-102 = "...ОБЫЧНЫЙ студент?"
10014025-103 = "[s9] «Ты спросила одно и то же дважды.»\n[s10] «Наверное, в это трудно поверить.»"
10014025-104 = "Потому что это не имеет смысла! Это просто, совершенно невозможно!"
10014025-105 = "Конечно! Это просто, совершенно невозможно!"
10014025-106 = "Н-Но... Сузуми и Сенсей не стали бы мне лгать..."
10014025-107 = "Ч-Что сейчас происходит?!"
10014025-108 = "Я понимаю, тебе трудно это принять, Рейса."
10014025-109 = "Конечно трудно... П-Потому что вы не знаете Казусу так, как я!"
10014025-110 = "ТУ САМУЮ Кёяму Казусу?! Единственную и неповторимую Кат Палуг?!"
10014025-111 = "Она неудержимый зверь!"
10014025-112 = "Как она может быть... обычной...?"
10014025-113 = "[s11] «(Для Рейсы Казуса словно... демон)»\n[s12] «(Для неё Казуса словно злодей из сказки.)»"
10014025-114 = "Но в то же время... если вы двое говорите, что это правда..."
10014025-115 = "Но в то же время... если вы двое говорите, что это правда..."
10014025-116 = "...Угх."
10014025-117 = "П-Простите. Я немного запуталась... Можно мне немного времени всё обдумать?"
10014025-118 = "[s13] «Конечно. Свяжись со мной в любое время.»\n[s14] «Не спеши. Надеюсь, ты сможешь это принять.»"
10014025-119 = "О... Д-Да..."
10014025-120 = "О... Д-Да..."
10014025-121 = "Т-Тогда до свидания..."
10014025-122 = ""
10014025-124 = ""
10014025-125 = ""
10014025-126 = ""
10014025-127 = ""
10014025-128 = "...Вот и ушла."
10014025-129 = "С ней всё будет хорошо. Может потребоваться время, но хотя бы мы всё ей объяснили."
10014025-130 = "[s] «Рейса выглядела...»"
10014025-132 = "[ns] «Она выглядела немного разочарованной...»"
10014025-133 = "Думаете? Я ничего не заметила."
10014025-134 = ""
10014025-137 = "...Сенсей?"
