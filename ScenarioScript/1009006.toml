[translation]
1009006-1 = "Фестиваль только для одного"
1009006-3 = ""
1009006-4 = "Ух ты! Сенсей!"
1009006-5 = "[s1] «О, привет, Умика.»\n[s2] «Ты сегодня бодрее обычного.»"
1009006-8 = "Правда? Я и сама не уверена."
1009006-9 = "Наверное, мне просто хотелось встретить Сенсея особенно радостно... Хи-хи-хи."
1009006-10 = "А пригласила я вас сегодня сюда специально потому, что..."
1009006-11 = "[s] «Потому что...»"
1009006-12 = "Пока секрет!"
1009006-13 = "[s] «Секрет, значит?»"
1009006-14 = "Н-Ну же! Вы так быстро разочаровались?!"
1009006-15 = "Знаете что, Сенсей?"
1009006-16 = "Сейчас я тихонько выйду через заднюю дверь."
1009006-17 = "Когда я выйду, досчитайте до десяти..."
1009006-18 = "А потом медленно идите следом. Поняли?"
1009006-19 = "А теперь прошу меня извинить!"
1009006-20 = ""
1009006-22 = ""
1009006-24 = "Умика вежливо вышла через заднюю дверь."
1009006-25 = ""
1009006-28 = "Я молча досчитал до десяти, а затем—"
1009006-29 = ""
1009006-32 = "[ns] Выйти через заднюю дверь."
1009006-38 = "― [log=우미카]Добро пожаловать на мой фестиваль, Сенсей![/log][wa:1790]"
1009006-41 = "― [log=우미카]Хи-хи-хи. Ну как вам?[/log][wa:840]"
1009006-42 = "― [log=우미카]Вся моя работа и подготовка... были ради именно этого момента!![/log][wa:4900]"
1009006-45 = "― [log=우미카]Я никому не сказала, и приглашений не было.[/log][wa:1370]"
1009006-48 = "― [log=우미카]Этот фестиваль... только для вас, Сенсей![/log][wa:2310]"
1009006-51 = "― [log=우미카]Фестиваль только для нас двоих, без всяких помех...[/log][wa:1390]"
1009006-52 = "― [log=우미카]Мне немного неловко, но... надеюсь, вам понравится![/log][wa:6790]"
1009006-55 = ""
1009006-56 = "Вы говорили, что из-за работы в Шале вам трудно наслаждаться парками аттракционов и фестивалями..."
1009006-57 = "[s] «Так ты подготовила фестиваль для меня?»"
1009006-58 = "Да. Если из-за работы трудно найти время на большой фестиваль... возможно, фестиваль для одного человека подойдёт лучше."
1009006-59 = "Особенно если вы всё равно собирались зайти."
1009006-60 = "[s] «Так вот какая у тебя была отличная идея.»"
1009006-61 = "Хи-хи-хи."
1009006-62 = "Сенсей! Раз уж вы наконец пришли на фестиваль, позвольте провести для вас экскурсию!"
1009006-63 = "Сюда! Пожалуйста, взгляните на этот веер Сенсея!"
1009006-64 = "[s] «Ох... ничего себе! На нём даже написано [USERNAME]...»"
1009006-65 = "И не пропустите шашлычок Сенсея! Попробуйте!"
1009006-66 = "[s] «...А чем он отличается от обычного шашлычка?»"
1009006-67 = "Хи-хи-хи. Ну... я посмотрела, какие блюда из меню Момоёдо вам нравятся больше всего..."
1009006-68 = "И выбрала соус, который, как мне кажется, вам понравится сильнее всего!"
1009006-69 = "А теперь я начну жарить окономияки Сенсея! Обычно в окономияки кладут любимые ингредиенты человека..."
1009006-70 = "Так что я наполню его всем, что вы любите! Настоящий окономияки Сенсея!"
1009006-71 = "[s] «Откуда Момоёдо вообще может знать всё это?!»"
1009006-72 = "Хи-хи-хи. Не недооценивайте сервис Момоёдо!"
1009006-73 = "На этом фестивале ещё есть сладкая вата Сенсея, ловля йо-йо Сенсея, тир Сенсея и многое другое!"
1009006-74 = ""
1009006-77 = ""
1009006-78 = ""
1009006-80 = ""
1009006-81 = ""
1009006-82 = ""
1009006-84 = ""
1009006-88 = ""
1009006-89 = "[ns] «Меня уже начинает смущать такое количество Сенсея...»"
1009006-90 = ""
1009006-91 = "Всё нормально! Об этом фестивале будем знать только мы двое! О, хотите сфотографироваться?"
1009006-92 = ""
1009006-95 = ""
1009006-96 = "А в конце вас ждёт ещё и особенно специальная программа!"
1009006-100 = ""
1009006-101 = "Ну что, как вам Фестиваль Сенсея?"
1009006-102 = "[s] «Я никогда его не забуду. По очень многим причинам...»"
1009006-103 = "Правда? Правда?"
1009006-104 = ""
1009006-106 = ""
1009006-107 = "Возможно, я немного забегаю вперёд, но..."
1009006-108 = "Не думаю, что когда-нибудь забуду Фестиваль Сенсея этого года."
1009006-109 = "[s3] «...Рад это слышать.»\n[s4] «Спасибо, Умика. Для нас обоих это стало памятным событием...»"
1009006-112 = ""
1009006-113 = ""
1009006-114 = ""
1009006-115 = "Серьёзно...?"
1009006-116 = "..."
1009006-117 = "Но это ещё не конец! То есть мой Фестиваль Сенсея уже почти подошёл к концу, но он ещё не закончился полностью!"
1009006-118 = "[s] «Там ещё что-то есть?!»"
1009006-119 = "Да! Посмотрите сюда!"
1009006-120 = ""
1009006-127 = "[ns] «Ещё и фейерверки?!»"
1009006-128 = "Конечно! Фестиваль всегда должен заканчиваться фейерверком!"
1009006-129 = ""
1009006-134 = "Эм... Сенсей?"
1009006-135 = "[ns] «Хм?»"
1009006-136 = ""
1009006-137 = "Вы не против, если я немного отдохну и посмотрю фейерверк вместе с вами?"
1009006-138 = ""
1009006-141 = ""
1009006-142 = "Спасибо. Хи-хи-хи."
1009006-144 = ""
1009006-146 = "Умика тихо села рядом со мной."
1009006-147 = "Мы сидели вместе и смотрели в небо, пока яркие разноцветные фейерверки Фестиваля Сенсея озаряли его."
