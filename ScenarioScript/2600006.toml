[translation]
2600006-1 = "Неожиданная ситуация"
2600006-3 = ""
2600006-4 = "Вы пришли, Сенсей. Спасибо, что приняли мою просьбу."
2600006-5 = "Хотя я не ожидала вас так быстро."
2600006-6 = "Благодаря вам работа станет намного проще."
2600006-7 = "Но документы я храню не здесь."
2600006-8 = "Вся эта бумажная работа довольно громоздкая, поэтому здесь я ею не занимаюсь."
2600006-9 = ""
2600006-11 = ""
2600006-12 = "Пойдёмте со мной..."
2600006-13 = ""
2600006-15 = ""
2600006-23 = ""
2600006-24 = "Комната отдыха была относительно опрятной, лишь кое-где лежали вещи."
2600006-25 = "Она была не столько грязной, сколько... обжитой."
2600006-26 = ""
2600006-28 = ""
2600006-29 = "Хм... Простите за такой беспорядок."
2600006-30 = "Надо было прибраться. Простите..."
2600006-31 = "[s1] «Всё хорошо. В Шале то же самое.»\n[s2] «Здесь много личных вещей...»"
2600006-32 = "А-ха-ха... Спасибо за понимание."
2600006-33 = "А, да. Ну... я провожу здесь много времени..."
2600006-34 = "Никто в Префектурной команде не хочет помогать мне с рутинной работой."
2600006-35 = "Так что в основном этим помещением пользуюсь только я."
2600006-36 = "Когда я на дежурстве или задерживаюсь допоздна, прихожу сюда."
2600006-37 = ""
2600006-39 = ""
2600006-40 = "Раскладушка уже не раз пригодилась."
2600006-41 = "В “Шале” тоже так, да?"
2600006-42 = "Ну тогда, а-ха-ха... Похоже, мы оба слишком много работаем."
2600006-43 = "В общем, документы вот здесь."
2600006-44 = ""
2600006-46 = ""
2600006-47 = ""
2600006-49 = ""
2600006-50 = "*тук*"
2600006-51 = ""
2600006-54 = "[ns3] «Ты собиралась сделать всё это одна?»\n[ns4] «За сколько лет здесь документы?»"
2600006-55 = "Ну..."
2600006-56 = "Здесь работа накапливается быстро. Наверное, в «Шале» всё немного иначе."
2600006-57 = "За годы...?"
2600006-58 = "Нет-нет. Это только за последнюю неделю."
2600006-59 = "Глава Префектурной команды уже всё утвердила, нам остаётся только разложить документы."
2600006-60 = "Простите. Это слишком много? Мне больше некого было попросить."
2600006-61 = "[s5] «Всё хорошо. Всегда можешь попросить меня о помощи.»\n[s6] «Шутишь? Я в этом эксперт. Мигом управимся.»"
2600006-62 = "Хм... Я почему-то думала, что вы так скажете."
2600006-63 = "Хм... Я почему-то думала, что вы так скажете."
2600006-64 = "То есть я знала, что вы согласитесь помочь, если попрошу, но..."
2600006-65 = "Мне не хотелось злоупотреблять вашей добротой."
2600006-66 = "Если бы был хоть какой-то другой вариант, я бы—"
2600006-67 = "Неважно. Спасибо за помощь, Сенсей."
2600006-69 = "С таким завалом нельзя было терять время, поэтому мы сразу принялись за сортировку."
2600006-70 = "На это ушла почти вся оставшаяся часть дня."
2600006-75 = "*вздыхает*"
2600006-76 = "На сегодня всё. И хорошо, уже очень поздно..."
2600006-77 = "Хм? Думаете, работы было много?"
2600006-78 = "Поверьте. Это ещё ничего."
2600006-79 = "Как бы то ни было, без вас я бы сегодня ночью точно не закончила."
2600006-80 = "...А?"
2600006-81 = "Хотите спросить про обои и плакат?"
2600006-82 = "Ч-что с ними?"
2600006-83 = "Думаете, они странные, да?"
2600006-84 = "Н-Нет?"
2600006-85 = "*вздох* ...Слава богу. На секунду вы меня напугали."
2600006-86 = "Как я уже говорила, со временем комната отдыха как-то сама изменилась."
2600006-87 = "Теперь это скорее мой второй дом."
2600006-88 = ""
2600006-90 = ""
2600006-91 = "...?"
2600006-92 = "[s] «...?»"
2600006-93 = "На этом этапе её уже почти можно назвать моим домом..."
2600006-94 = "Хм... Уже поздняя ночь..."
2600006-95 = "...и я нахожусь в помещении, которое почти моя комната..."
2600006-96 = "...вместе с Сенсеем. Только мы вдвоём... наедине..."
2600006-97 = "[s] «...?»"
2600006-98 = "Эм... Э-э-э..."
2600006-99 = "...!"
2600006-102 = "― Знаете... Если подумать... Эм...[wa:1200]"
2600006-105 = "― Эта ситуация... Эм...[wa:530]"
2600006-107 = "― Немного... неприличная...[wa:140]"
2600006-110 = "― Вам не кажется? Сенсей...?[wa:1770]"
2600006-112 = "― Пожалуйста... Скажите хоть что-нибудь... Что угодно...[wa:2670]"
2600006-115 = "― Если вы будете молчать...[wa:20]"
2600006-117 = "― станет очень неловко..."
2600006-120 = "― Не из-за вас! Я просто... Угх! Простите.[wa:300]"
2600006-122 = "― Я не хочу показаться грубой. Просто... не знаю, что сказать...[wa:10]"
2600006-125 = "― ИЛИ что делать! Угх![wa:1030]"
2600006-128 = "[ns] «Чинацу? У тебя лицо примерно двенадцати оттенков красного. Ты в порядке?»"
2600006-129 = "― *вздох*[wa:210]"
2600006-131 = "― Да, я— я в порядке. Ага.[wa:2580]"
2600006-134 = "― Хи-хи... Боже! Не знаю, что на меня нашло.[wa:880]"
2600006-136 = "― Что это за чувство?[wa:1180]"
2600006-139 = "― Каждый раз, когда я рядом с вами...[wa:1960]"
2600006-141 = "― я сама не своя.[wa:670]"
2600006-144 = "― Это так трудно объяснить.[wa:680]"
2600006-146 = "― И причин так много..."
2600006-149 = "Я-я так виновата, Сенсей."
2600006-150 = "Я сама попросила вас прийти, а потом вся растерялась."
2600006-151 = "Со мной обычно такого не бывает. Я—"
2600006-152 = "...А?"
2600006-153 = "Вы не против?"
2600006-154 = "Спасибо. От этого мне правда немного легче..."
2600006-155 = ""
2600006-157 = ""
2600006-158 = "..."
2600006-159 = "[s] «...Чинацу?»"
2600006-160 = ""
2600006-162 = ""
2600006-163 = "Я в порядке. Правда. Ничего такого."
2600006-164 = "Теперь я понимаю..."
2600006-165 = "Да, конечно."
2600006-167 = "Это всё было у меня в голове..."
