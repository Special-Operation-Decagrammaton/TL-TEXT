[translation]
2004103-1 = "Служба доставки"
2004103-7 = "...Уф, вот и всё. Это все посылки."
2004103-8 = "Рио заказала куда больше посылок, чем я ожидал."
2004103-9 = "Вы там личную мастерскую обустраиваете или что? Хахаха, ладно, шучу."
2004103-10 = "Просто распишитесь здесь..."
2004103-12 = "Как и обещал Рио, я оставался в офисе до наступления темноты."
2004103-23 = "Здравствуйте, Сенсей. Полагаю, я пришла точно вовремя."
2004103-24 = "Для начала позвольте мне извиниться."
2004103-25 = "[s] «А? За что?»"
2004103-26 = "Ну, по дороге сюда я немного размышляла..."
2004103-27 = "...и мне показалось, что так будет правильно."
2004103-28 = "[s] «О, Рио. Ты повзрослела. Я тобой горжусь.»"
2004103-29 = "Н-не дразните меня так..."
2004103-30 = "Кстати, чтобы убедиться, что меня не отследили и не опознали..."
2004103-31 = "Я заглушила все дорожные камеры и камеры наблюдения по пути сюда."
2004103-32 = "Могу с уверенностью сказать: меня никто не видел."
2004103-33 = "[s] «...Ох, Рио. Ты совсем не изменилась. Но я всё равно тебя поддержу...»"
2004103-34 = "...Не совсем понимаю, что вы имеете в виду."
2004103-35 = "В любом случае, спасибо, что подержали у себя эти посылки, Сенсей. У меня в убежище сейчас несколько проектов, и для них понадобились дополнительные детали."
2004103-36 = "Модернизация кулинарного Avant Guard, обслуживание компьютеров, анализ реагентов..."
2004103-37 = "Больше всего мне были нужны высококачественная испарительная камера и подавитель ИС."
2004103-38 = "Понимаете, чем больше устройств работает одновременно, тем важнее эффективность охлаждения. А ещё мне нужен ионный раствор для недавнего исследования..."
2004103-40 = "Она ещё некоторое время продолжала своё непонятное объяснение."
2004103-41 = "Не уверен, но, кажется, ей нравилось об этом рассказывать."
2004103-43 = "...В общем, поэтому мне и понадобились все эти детали. И, разумеется, сама я заказать их не могла."
2004103-44 = "Не раскрыв местоположение убежища."
2004103-45 = "[s] «Поэтому ты и указала Шале как адрес пересылки.»"
2004103-46 = "Именно. Так что прошу прощения за это."
2004103-47 = "[s] «Погоди-ка: у тебя есть убежище?»"
2004103-48 = "Не одно."
2004103-49 = "Сейчас я использую то, которое расположено наиболее оптимально..."
2004103-50 = "...но на случай необходимости у меня есть несколько запасных."
2004103-51 = "При малейшем признаке опасности мои AMAS сразу перевезут меня в следующее."
2004103-52 = "[s] «Похоже на довольно тяжёлый образ жизни.»"
2004103-53 = "Солгала бы, если бы сказала, что это не так..."
2004103-54 = "Но всё же это рационально."
2004103-55 = "...Вы считаете, что это звучит неэффективно?"
2004103-56 = "...Что ж, возможно."
2004103-57 = "Мы с Эйми некоторое время назад это обсуждали."
2004103-58 = "Она говорит, что я из тех людей, кто способен пожертвовать эффективностью ради рациональности."
2004103-59 = "А у неё, по её словам, всё наоборот."
2004103-60 = "Честно говоря, я думала, что одно невозможно без другого. Что самый эффективный вариант естественным образом будет и самым рациональным."
2004103-61 = ""
2004103-63 = ""
2004103-64 = "Но... по-видимому, это не так."
2004103-65 = "Люди не всегда способны быть рациональными, а большая часть событий в нашей жизни происходит между одними людьми и другими."
2004103-66 = "Раньше я смотрела на это так: считала людей ненадёжными и недостойными доверия. Поэтому мне казалось, что всё необходимо контролировать."
2004103-67 = "...Теперь я уже так не думаю."
2004103-68 = "Потому что людей нельзя откатить назад."
2004103-69 = "[s] «Откатить назад?»"
2004103-70 = "Да."
2004103-71 = "В последнее время я много об этом думала."
2004103-72 = "Люди — не машины."
2004103-73 = ""
2004103-74 = "Если у машины ломается деталь, её можно просто заменить. Если алгоритм принятия решений ИИ работает неправильно, его можно просто переписать."
2004103-75 = "И всё снова будет как новое. Таким же, каким было раньше. Любая часть машины заменяема."
2004103-76 = ""
2004103-77 = "Но... с людьми всё не так. То, что с ними происходит, нельзя исправить подобным образом."
2004103-78 = "Некоторые части человека способны восстановиться сами, но и у этого есть пределы."
2004103-79 = ""
2004103-80 = ""
2004103-81 = "В человеческом организме каждый день рождается и погибает около 330 миллиардов клеток. Период обновления клеток составляет от месяца до года..."
2004103-82 = "Но, например, нервные клетки мозга за всю жизнь так и не заменяются полностью."
2004103-83 = "Вы знаете историю корабля Тесея?"
2004103-84 = "[s1] «Что-то знакомое.»\n[s2] «Прости, кажется, не знаю.»"
2004103-85 = "Это история о том, что значит — или не значит — постепенно заменять части чего-либо одну за другой."
2004103-86 = "И остаётся ли вещь той же самой после того, как заменили всё."
2004103-87 = "Представь корабль. Со временем его части приходится заменять."
2004103-88 = "И вот детали заменяют одну за другой, пока однажды не окажется, что когда-то была заменена абсолютно каждая. Это всё ещё тот же корабль или уже нет?"
2004103-89 = "Думаю... этот принцип можно применить к машинам."
2004103-90 = "Даже если заменить каждую деталь, пока машина продолжает выполнять свою функцию, она остаётся той же самой машиной."
2004103-91 = "...Но мне кажется, с людьми это работает иначе."
2004103-92 = "Возможно, когда-нибудь в далёком будущем появятся способы анализировать каждый нейрон мозга и создавать точную копию из углерода и белков для любой части, которую требуется заменить..."
2004103-93 = "Но сейчас я не хочу проводить этот мысленный эксперимент. Он требует слишком много допущений и почти не связан с реальностью."
2004103-94 = "Вы ведь понимаете, что я называю «мысленным экспериментом», верно? Когда ситуацию условно упрощают, а затем строят прогнозы на этой основе?"
2004103-95 = "На самом деле мысленные эксперименты бывают двух типов."
2004103-96 = "В одном случае можно получить почти точный результат на основе подробного моделирования."
2004103-97 = "А другой строится на воображении и предположениях."
2004103-98 = "Вопрос о человеческом «корабле Тесея» определённо относится ко второму типу."
2004103-99 = "Поэтому сейчас я не вижу особого смысла его рассматривать."
2004103-100 = "Иными словами, Сенсей..."
2004103-101 = "Я хотела сказать, что вы — такой, какой вы есть сейчас..."
2004103-102 = ""
2004103-104 = ""
2004103-105 = ""
2004103-106 = ""
2004103-107 = ""
2004103-108 = "...для меня незаменимы."
2004103-109 = "[s] «Хм? Что ты имеешь в виду?»"
2004103-110 = ""
2004103-112 = ""
2004103-113 = ""
2004103-114 = "...Что ж, ничего страшного, если вы не понимаете."
2004103-115 = "Но когда-нибудь..."
2004103-116 = "...надеюсь, вы тоже начнёте смотреть на меня так же."
2004103-117 = ""
2004103-119 = ""
2004103-120 = "Просто мысль, пришедшая мне в голову в тот момент."
2004103-122 = "Итак, раз я забрала все посылки, мне пора возвращаться."
2004103-123 = "[s] «...И как ты собираешься возвращаться?»"
2004103-124 = "Так же, как пришла сюда: заглушу все дорожные камеры и камеры наблюдения."
2004103-125 = "Чтобы никто не увидел, как я покидаю Шале, и—"
2004103-126 = "[s3] «Нет уж, я это запрещаю.»\n[s4] «…Я тебя отвезу.»"
2004103-129 = "А? Н-Но..."
2004103-130 = "[s] «Президент Рио, пожалуйста, послушайте Сенсея.»"
2004103-131 = "Х-хорошо..."
2004103-133 = "Я вызвал такси — большое грузовое такси — и высадил Рио неподалёку от её убежища."
2004103-134 = "Она дождалась, пока такси уедет, а затем вызвала свои AMAS, чтобы перенести посылки."
2004103-135 = ""
2004103-137 = ""
2004103-138 = ""
2004103-139 = ""
2004103-140 = "Тогда я пойду. Спасибо вам за всё сегодня, Сенсей."
2004103-141 = "[s] «Не за что. Доберись домой благополучно.»"
