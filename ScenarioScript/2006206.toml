[translation]
2006206-1 = "Everything is chemistry!"
2006206-3 = "Ah, another failure!"
2006206-4 = "The equipment is too old and completely useless! Nnnnoooo!"
2006206-5 = "[s] \"What are you making?\""
2006206-6 = "I had already given up on it, but I will tell you..."
2006206-7 = "I was making a synthetic diamond! I even reached 529 carats, but I could not cross the 1-carat wall..."
2006206-8 = "So this is my limit... How frustrating..."
2006206-9 = "[s] \"You call that a limit, but isn't that amazing?!\""
2006206-13 = "[ns] \"Wait, why a diamond...?\""
2006206-14 = "I found a magazine with a 'How to Choose a Gift' section! It said that giving a gift is a way to express your daily gratitude and feelings."
2006206-15 = "Sensei always takes care of me, so I wanted to give you something, but... I had no idea what would be good! It also said that the other person might feel burdened by it..."
2006206-16 = "It would be sad if it were too practical, but on the other hand, it would be troublesome if it had no use at all. And if the price is too high, that is a problem too... It is super complicated."
2006206-17 = "While I was worrying about it, it suddenly hit me! 'A diamond!'"
2006206-18 = "It has various uses, and since I am making it myself, it will not be too expensive. Plus, it is pretty so you can display it. See, do you not think it is the perfect gift?"
2006206-19 = "...Well, it ended up failing miserably, though."
2006206-20 = "[s] \"That thought is the best gift of all!\""
2006206-21 = "Does that mean 'your feelings alone are enough'?! That was written in there too!"
2006206-22 = "I want to give something to Sensei! Once I make up my mind, I cannot rest until I see it through to the end!"
2006206-23 = "I could probably do it if I try one more time, so could you wait just 50 hours?"
2006206-24 = "Or, if you tell me what you want, I can make it right away?"
2006206-25 = "[s] \"Anything is fine as long as it is from Erina!\""
2006206-26 = "Nnn, I wonder what. ...A bust of me made out of a diamond, maybe?"
2006206-27 = "Hmm..."
2006206-28 = "Ah, this is it!"
2006206-29 = "Sensei! Please wait a moment! I will be right back!"
2006206-34 = "(3 hours later)"
2006206-37 = "(Evening came, and a blizzard started blowing)"
2006206-38 = "[ns] \"This is bad, I have to go look for her...!\""
2006206-40 = "Cough...! Achoo!"
2006206-41 = "Uuuh, it is freezing! Achoo!"
2006206-47 = "I am back! Cough cough!"
2006206-48 = "[s] \"Are you okay?! I was worried!\""
2006206-49 = "Do not worry! Just in case, I attached a safety line!"
2006206-50 = "Look! It is cold, so please get in bed!"
2006206-51 = "There is something I want to show you!"
2006206-59 = "[wa:430]-- [log=에리나]Hehe, [wa:1040]isn't it pretty?[wa:1660] *Cough cough*[/log]"
2006206-61 = "-- [log=에리나]It is a snow crystal [wa:1300]preserved with polyvinyl acetal.[wa:1160][/log]"
2006206-64 = "-- [log=에리나]Even as time passes, [wa:1430]it will not melt, even in a warm place.[/log]"
2006206-67 = "[wa:1070]-- [log=에리나]Since I went through the trouble, [wa:1000]I tried to find the biggest [wa:1010]and prettiest one, and then...[/log]"
2006206-69 = "-- [log=에리나]It ended up getting this late.[/log]"
2006206-72 = "-- [log=에리나]*Sniffle*... [wa:2240]Since it is a special occasion, [wa:1120]I tried making it [wa:990]an eternally shining snow crystal.[/log]"
2006206-75 = "-- [log=에리나]What do you think?[/log]"
2006206-77 = "-- [log=에리나]Every time you look at this, [wa:1460]will you remember me?[/log]"
2006206-80 = "[ns] \"Of course! Because it is a very precious gift.\""
2006206-82 = "[wa:600]-- [log=에리나]Hehe![wa:850] Ya[wa:320]y![/log]"
2006206-84 = "-- [log=에리나]I am glad you are happy with it.[/log]"
2006206-87 = "-- [log=에리나]It is amazing...[/log]"
2006206-89 = "-- [log=에리나]This too, [wa:910]that too, [wa:1140]it is al[wa:650]l[wa:300] chemistry.[/log]"
2006206-92 = "-- [log=에리나]Sensei, [wa:1830]and I as well...[/log]"
2006206-94 = "-- [log=에리나]Can be explained by chemistry.[/log]"
2006206-97 = "[wa:1420]-- [log=에리나]What we see, [wa:1610]and information processing, [wa:1550]are nothing more than electrical signals.[/log]"
2006206-99 = "-- [log=에리나]And yet, they react with one another.[/log]"
2006206-102 = "-- [log=에리나]Even though they are all just electrical signals,[/log]"
2006206-104 = "-- [log=에리나]They ended up being given a name like emotions.[/log]"
2006206-107 = "-- [log=에리나]No, [wa:800]it is not that [wa:780]I dislike that...[/log]"
2006206-110 = "[wa:1420]-- [log=에리나]If a reaction like this is going to happen, [wa:2720]I thought it would be nice [wa:1450]if we were the same.[/log]"
2006206-113 = "-- [log=에리나]Or rather![wa:1100] *Cough cough*![/log]"
2006206-115 = "-- [log=에리나]I [wa:770]might have gone crazy from this cold![/log]"
2006206-118 = "-- [log=에리나]Ahaha...![wa:1260] Haha...[/log]"
2006206-121 = "Cough, cough...!"
2006206-122 = "[s] \"I am sorry, you caught a cold because of making me that present...\""
2006206-123 = "Don't be ridiculous, please don't worry about it! I am totally fine!"
2006206-124 = "If you are still worried... I would be happy if you display this in a place where you can see it every day!"
2006206-125 = "It is a promise...! Fuuuh..."
2006206-126 = "[s] \"Understood! It is a promise!\""
2006206-127 = "Ehehe..."
2006206-128 = "Hehe..."
2006206-129 = "...Zzz..."
2006206-131 = "(Perhaps because she was tired, Erina fell asleep in the blink of an eye)"
2006206-132 = "(I watched over the peacefully sleeping Erina alongside the snow crystal)"
