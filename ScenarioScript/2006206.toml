[translation]
2006206-1 = "We're All Chemistry!"
2006206-3 = "Aaagh! Another failure!"
2006206-4 = "This equipment's too old to pull this off! Ngaaahh!"
2006206-5 = "[s] \"What're you making?\""
2006206-6 = "I've about given up by this point, so I might as well tell you..."
2006206-7 = "I was making synthetic diamonds! I was able to get up to 529 carats, but I’ve hit a wall trying to get just one more carat…"
2006206-8 = "So this is my limit... How frustrating..."
2006206-9 = "[s] \"That's an awfully high limit though!?\""
2006206-13 = "[ns] \"Actually, why're you even making a diamond...?\""
2006206-14 = "There was this magazine I picked up that had an article about choosing presents! #nIt said that giving a gift is a way to convery those feelings of gratitude you hold for someone."
2006206-15 = "You've always been taking such good care of me, so I wanted to give you something... #nBut, I couldn't think of what to give you! It didn't help that the article also mentioned#nthat the recipient could feel burdened by the gift..."
2006206-16 = "Choosing something too practical could run the risk of feeling too impersonal, but something too impractical wouldn't work either. It's also a problem if it's too#nexpensive... The whole thing's just so complicated."
2006206-17 = "While I was stressing out over this, a flash of inspiration suddenly hit! Diamonds,#nof course!"
2006206-18 = "They've got lots of different uses, and they aren't expensive if I make them myself. #nPlus, diamonds are pretty, so you could also just use them for decor.#nSee, don't they make such good gifts?"
2006206-19 = "...Sadly, the whole thing ended in failue anyhow."
2006206-20 = "[s] \"The thought behind it is more important than the present itself!\""
2006206-21 = "That's the same as saying \"it's the thought that counts!\" They mentioned that#ntoo!"
2006206-22 = "I WANT to give you something, Sensei! #nOnce I set my mind on something, I can't be satisfied until I've seen it aaaall the#nway through!"
2006206-23 = "I think I can pull it off if I just try one more time. Could you come back in a bit?#nLike, 50 hours?"
2006206-24 = "But alternatively, if you have something you'd like instead, I can also make that#nin a jiffy."
2006206-25 = "[s] \"I'm fine with anything you give me!\""
2006206-26 = "Nghhh, but what though... A bust of myself made of diamonds? Does that work?"
2006206-27 = "Hmmm..."
2006206-28 = "Ah, I got it!"
2006206-29 = "Sensei! Wait here for a second! I'll be right back!"
2006206-34 = "(Three hours later.)"
2006206-37 = "(The sun set as a blizzard began to rage.)"
2006206-38 = "[ns] \"Nope, I'm going out to look for her...!\""
2006206-40 = "Cough...! Achoo...!"
2006206-41 = "Uuuugh... Isshooo cooolddd! Atchoo!"
2006206-47 = "I have returned! Cough cough!"
2006206-48 = "[s] \"Are you alright!? I was worried about you!\""
2006206-49 = "No need to be worried! I had a safety rope set up just in case!"
2006206-50 = "C'mere! It's cold out here, so come into the futon!"
2006206-51 = "I've got something to show you!"
2006206-59 = "[wa:430]― [log=에리나]Heheh. [wa:1040]Pretty, isn't it? [wa:1660]*Cough cough*[/log]"
2006206-61 = "― [log=에리나]These are snow crystals. [wa:500]I hardened them using polyvinyl acetate.[/log]"
2006206-64 = "― [log=에리나]Even as time passes [wa:1000]or if they're put into a warm room, they won't melt.[/log]"
2006206-67 = "[wa:1070]― [log=에리나]I don't do this often, [wa:100]so I wanted to find [wa:500]the biggest and prettiest crystals...[/log]"
2006206-69 = "― [log=에리나]I wasn't expecting it to get this late though.[/log]"
2006206-72 = "― [log=에리나]Sniffle... [wa:500]It was a rare occasion, [wa:200]so I also wanted to try making these snow crystals glow forever.[/log]"
2006206-75 = "― [log=에리나]What do you think?[/log]"
2006206-77 = "― [log=에리나]When you look at them, [wa:500]will you think of me?[/log]"
2006206-80 = "[ns] \"Of course I will! It's a precious present you gave me after all.\""
2006206-82 = "[wa:600]― [log=에리나]Heheh! [wa:850]Yaa[wa:320]ay![/log]"
2006206-84 = "― [log=에리나]I'm glad you like it.[/log]"
2006206-87 = "― [log=에리나]Incredible, isn't it...?[/log]"
2006206-89 = "― [log=에리나]This, [wa:500]that [wa:900]and eeee[wa:500]verything. It's all chemistry.[/log]"
2006206-92 = "― [log=에리나]The same goes for you, [wa:900]and for I as well...[/log]"
2006206-94 = "― [log=에리나]We can all be explained by chemistry.[/log]"
2006206-97 = "[wa:1420]― [log=에리나]What we see [wa:850]and how we process information; [wa:800]it's nothing more than electrical signals.[/log]"
2006206-99 = "― [log=에리나]And yet, we react to one another.[/log]"
2006206-102 = "― [log=에리나]Those, too, are nothing but electrical signals.[/log]"
2006206-104 = "― [log=에리나]Still, we gave them a name: emotions.[/log]"
2006206-107 = "― [log=에리나]I mean, it's not like I'm against this idea...[/log]"
2006206-110 = "[wa:1420]― [log=에리나]I just thought it'd be nice [wa:2720]if a reaction like this [wa:1300]was mutual.[/log]"
2006206-113 = "― [log=에리나]Juuuust kiddin'! [wa:250]Cough cough![/log]"
2006206-115 = "― [log=에리나]I think [wa:100]this cold's making me go a little cuckoo![/log]"
2006206-118 = "― [log=에리나]Ahahah...! [wa:400]Hahah...[/log]"
2006206-121 = "Cough, cough...!"
2006206-122 = "[s] \"Sorry. The reason you caught a cold was because you wanted to make me a present...\""
2006206-123 = "Don't worry about that! Everything's A-ookay!"
2006206-124 = "But, if you really want to make it up to me... Then I'd be happy if you could put my gift somewhere you'll see everyday!"
2006206-125 = "Promise me that...! Fwaah..."
2006206-126 = "[s] \"Sure thing! I promise I will!\""
2006206-127 = "Ehehe..."
2006206-128 = "Hehe..."
2006206-129 = "...Zzz..."
2006206-131 = "(Erina immediately passed out, perhaps from exhaustion.)"
2006206-132 = "(I watched over Erina as she slept soundly, alongside those snow crystals of#nhers.)"