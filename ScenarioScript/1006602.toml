[translation]
1006602-1 = "Горничная против кризиса!"
1006602-2 = "Я поспешил в комнату Клуба разработки игр."
1006602-3 = ""
1006602-9 = "Клубная комната Отдела разработки игр"
1006602-10 = "[ns] «Арис?»"
1006602-11 = "Герой... Наконец-то вы добрались до меня..."
1006602-12 = "[s1] «Конечно. Я волновался за тебя, Арис.»\n[s2] «Арис... где ты?»"
1006602-15 = "Вы должны уйти, герой... Сейчас я не могу ни с кем встречаться..."
1006602-16 = "[s] «Ты и правда попала в беду?»"
1006602-17 = "..."
1006602-18 = "[s3] «Если да, давай разберёмся с этим вместе.»\n[s4] «Я хочу тебе помочь.»"
1006602-21 = ""
1006602-27 = ""
1006602-28 = ""
1006602-29 = "Так нечестно, Сенсей... Если вы так говорите, мне придётся выйти..."
1006602-30 = "[s] «О... Привет, Арис. На тебе костюм горничной! Зачем?»"
1006602-31 = "*хнык* Сенсей, вы произнесли проклятое слово — «горничная»!"
1006602-32 = "Я больше не могу терпеть этот костюм горничной! Он совершенно не работает!"
1006602-33 = "Я вообще не хотела его надевать, но надела только потому, что вы сказали, что придёте..."
1006602-34 = "...Так что теперь вы должны взять ответственность за то, во что я превратилась!"
1006602-35 = ""
1006602-37 = ""
1006602-39 = ""
1006602-40 = "Сенсей! Погладьте меня по голове!"
1006602-42 = "По просьбе Арис я погладил её по голове."
1006602-43 = "Кажется, Арис немного успокоилась."
1006602-45 = "[ns] «Итак, Арис, объяснишь, что случилось?»"
1006602-46 = "Ну..."
1006602-49 = ""
1006602-50 = "[ns5] «То есть... тебе больше нечего было надеть...?»\n[ns6] «И костюм горничной оказался единственной оставшейся одеждой?»"
1006602-53 = "Да... Остальная одежда сейчас в стирке, и у меня остался только этот костюм горничной..."
1006602-54 = "Но костюм горничной — это проклятая броня! Он снижает все мои характеристики!"
1006602-55 = "Жестокая битва из прошлого, поединок один на один с Нэру, павшие члены отряда..."
1006602-56 = "Неожиданная хорошая сцена, стоп-кадр и слёзы радости, небесный кит, улетающий на закате в финале, и специальная рекламная вставка..."
1006602-57 = "[s7] «Да, я это помню. Почти всё.»\n[s8] «Одна вещь тут как будто немного лишняя...?!»"
1006602-60 = "В любом случае! С тех пор моя совместимость с костюмом горничной просто ужасна..."
1006602-61 = "Тело меня не слушается... Руки и ноги дрожат, а вместо храбрости меня переполняет страх..."
1006602-62 = "*хнык* Так я... больше не смогу выполнять свой квест героя..."
1006602-63 = "[s] «Тогда, Арис!»"
1006602-64 = "...?"
1006602-65 = "[s] «Давай вместе преодолеем страх перед костюмом горничной!»"
1006602-66 = "Преодолеть...? Как...?"
1006602-67 = "Если я одета как горничная, значит, мне нужно сменить класс на горничную?"
1006602-68 = "[s9] «Верно! Ты можешь сменить класс на горничную!»\n[s10] «А потом снова повысить уровень и вернуть характеристики.»"
1006602-71 = "Эм... Не знаю, получится ли у меня... но я поверю вам, Сенсей."
1006602-72 = "Хотя вообще-то я и так вам доверяю!"
1006602-73 = "Тогда что мне делать дальше...?"
1006602-74 = "[s] «Может, сделать что-нибудь из того, что обычно делают горничные?»"
1006602-75 = "Что обычно делает горничная?"
1006602-76 = ""
1006602-78 = ""
1006602-79 = "Я знаю, что горничная обычно... убирается."
1006602-80 = "Другие обязанности включают бой, разрушение и проникновение..."
1006602-81 = "Хм? Пока не думать о других обязанностях?"
1006602-82 = "Тогда... сначала я начну с уборки!"
1006602-85 = ""
1006602-86 = "Ах! В этой комнате слишком грязно!"
1006602-87 = "Повсюду валяются пустые бутылки и пакеты из-под чипсов, а вся комната покрыта пылью!"
1006602-88 = "Как думаете, я смогу всё это убрать, Сенсей?"
1006602-89 = "[s] «Постепенно, шаг за шагом. Давай.»"
1006602-90 = "Поняла... Буду убирать всё по очереди..."
1006602-91 = ""
1006602-92 = "Сенсей, можете дать мне мусорный пакет? Одного мало. Нужно несколько!"
1006602-93 = ""
1006602-94 = "Из пустых пакетов от чипсов высыпались крошки! Мне нужен пылесос! Помогите!"
1006602-95 = ""
1006602-96 = "*кашель* *кашель* Я попыталась стряхнуть пыль, но её стало ещё больше! Нужно прибить пыль водой из ведра!"
1006602-97 = "Что? Я не могу просто разливать воду, потому что мы в помещении?"
1006602-98 = "Точно..."
1006602-100 = "Каким-то образом нам с Арис удалось убрать комнату клуба."
1006602-104 = ""
1006602-106 = "..."
1006602-107 = "Сенсей! Мы наконец закончили уборку комнаты клуба! Теперь здесь чисто!"
1006602-108 = "[ns] «И, похоже, ты уже привыкла к костюму горничной.»"
1006602-109 = "О? Теперь, когда вы об этом сказали..."
1006602-110 = "Это потрясающе, Сенсей! Я больше не дрожу! И чувствую себя отлично!"
1006602-111 = "Наверное, потому что я завершила квест уборки в роли горничной, повысила уровень и вернула свои характеристики!"
1006602-112 = "[s] «Рад, что это помогло.»"
1006602-113 = "Ох, если бы вы не помогли мне, Сенсей, я бы давно проиграла из-за пониженных характеристик!"
1006602-114 = "Вы и правда знаете всё, Сенсей! Ура!"
1006602-116 = "После этого я играл с Арис, которая была намного счастливее, чем при нашей встрече."
