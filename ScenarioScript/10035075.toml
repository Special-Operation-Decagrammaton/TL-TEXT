10035075-13 = "[s] «Спасибо за сотрудничество.»"
10035075-14 = "Прошу прощения за то, что было раньше."
10035075-15 = "В это буквально невозможно поверить. Откуда, чёрт возьми, он взялся?"
10035075-16 = "В любом случае, начинаем поиски."
10035075-17 = "Как только мы его найдём, наша охрана разберётся, так что группа «Валькирии» может отойти."
10035075-18 = "Давайте все зайдём внутрь."
10035075-19 = "Я с вами."
10035075-20 = "Прежде чем идти дальше, мы уверены, что ЭТО место безопасно?"
10035075-21 = ""
10035075-23 = ""
10035075-24 = "Настолько, насколько вообще можем быть уверены. Теперь лучше оставить операцию по захвату администрации парка."
10035075-25 = "А? Зачем?"
10035075-26 = "Сейчас наша основная обязанность — работа спасателей."
10035075-27 = "Безопасность посетителей важнее, чем поимка существа."
10035075-28 = "Кроме того... думаю, организатор всего этого сейчас внутри."
10035075-30 = "Организатор?!"
10035075-31 = "А, я так и знала!"
10035075-32 = "А? О ком вы?"
10035075-33 = "[s] «Хм... это тот, о ком я думаю?»"
10035075-34 = "Ага, мне тоже интересно!"
10035075-37 = ""
10035075-38 = "Ладно, рано или поздно он должен показаться."
10035075-39 = "Обыщите каждый сантиметр и не останавливайтесь, пока не найдёте!"
10035075-40 = "Этого НЕ БУДЕТ в МОЁМ парке в первый же день!"
10035075-41 = "Я НЕ ПОТЕРПЛЮ никаких нарушений, откуда бы они ни исходили!"
10035075-42 = "Босс! Кажется, вам нужно на секунду подойти сюда."
10035075-43 = "Что там? Нашли существо?"
10035075-47 = "Нет, дело не в этом — я про вот это."
10035075-48 = "Слив сточных вод, который выходит за пределы парка. Так..."
10035075-49 = "Что это?!"
10035075-50 = "Верно, он должен был быть закрыт металлической сеткой, но здесь отверстие!"
10035075-51 = "Достаточно большое, чтобы аллигатор мог входить и выходить."
10035075-52 = "Ну, хотя бы это кое-что объясняет."
10035075-53 = "Но это не значит, что он ушёл."
10035075-54 = "Я уверен, он всё ещё в парке! Найдите его немедленно!"
10035075-55 = ""
10035075-56 = "Есть, босс!"
