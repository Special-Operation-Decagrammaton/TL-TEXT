[translation]
1601406-1 = "Урок математики с Ибуки!"
1601406-2 = "Получив сообщение от Ибуки, я приехал в академию Геенна и направился в комнату отдыха Общества Пандемониума."
1601406-6 = ""
1601406-7 = "А! Сенсей! Спасибо, что пришли!"
1601406-8 = "Ибуки вас ждала!"
1601406-9 = "[s1] «Привет, Ибуки! Что случилось?»\n[s2] «Чем хочешь заняться сегодня, Ибуки?»"
1601406-12 = "Сенсей, Ибуки долго думала обо всех местах, куда мы ходили в прошлый раз!"
1601406-13 = "Там было столько всего весёлого, что Ибуки было трудно выбрать, чем заняться сегодня..."
1601406-14 = "Кататься в полицейской машине, готовить в столовой в самый час пик, командовать танком и ездить по городу..."
1601406-15 = "Но потом случилось кое-что странное, Сенсей..."
1601406-16 = "Ибуки думала и думала... а в голову всё время приходил Сенсей!"
1601406-17 = "[s] «Я?»"
1601406-18 = "Ага! Вы понимаете чувства Ибуки..."
1601406-19 = "Вы превратили Шале в парк развлечений..."
1601406-20 = "И показали Ибуки, что она может заниматься очень многими вещами!"
1601406-21 = "Ну..."
1601406-22 = "Ибуки решила, что однажды хочет стать такой же, как Сенсей!"
1601406-23 = "[s] «Профессор Ибуки... Буду ждать этого дня.»"
1601406-24 = "Хи-хи, правда?"
1601406-25 = "Сенсей, Ибуки хочет вам кое-что показать!"
1601406-26 = "Именно поэтому Ибуки и позвала вас сюда!"
1601406-27 = "[s] «Что же это? Мне уже любопытно!»"
1601406-28 = "Сюда!"
1601406-31 = "Добро пожаловать на урок математики профессора Ибуки!"
1601406-34 = "― [log=이부키]Сегодня Ибуки будет вашим учителем![/log][wa:890]"
1601406-35 = "― [log=이부키]Урок начался... Сначала займёмся математикой![/log][wa:3230]"
1601406-38 = "― [log=이부키]Ибуки уверена в своих знаниях математики![/log][wa:1160]"
1601406-41 = "― [log=이부키]Вчера Ибуки получила за контрольную 100 баллов[/log][wa:10]"
1601406-42 = "― [log=이부키]и даже золотую звёздочку![/log][wa:1000]"
1601406-45 = "[ns] «Потрясающе. Как и ожидалось от профессора Ибуки!»"
1601406-46 = "― [log=이부키]Хи-хи-хи... Ну хорошо. Сенсей...[/log][wa:2050]"
1601406-47 = "― [log=이부키]У профессора Ибуки есть для вас вопрос![/log][wa:1820]"
1601406-50 = "― [log=이부키]Вот! Если у Ибуки есть два мороженых[/log][wa:10]"
1601406-51 = "― [log=이부키]и один пудинг.[/log][wa:1130]"
1601406-54 = "― [log=이부키]Сколько всего у неё десертов?[/log][wa:10]"
1601406-57 = "[ns] «Если сложить... Ответ... три?»"
1601406-58 = "― [log=이부키]Неправильно! Почти![/log][wa:1500]"
1601406-59 = "― [log=이부키]Правильный ответ...[/log][wa:2360]"
1601406-62 = "[ns] «Да...?»"
1601406-63 = "― [log=이부키]«Сенсей сделает Ибуки ещё счастливее и купит ей ещё три!»![/log][wa:4400]"
1601406-66 = "― [log=이부키]А! И не забудьте[/log][wa:260]"
1601406-67 = "― [log=이부키]почистить зубы после еды![/log][wa:470]"
1601406-70 = "― [log=이부키]Ибуки обязательно чистит зубы[/log][wa:270]"
1601406-71 = "― [log=이부키]три раза в день![/log][wa:1190]"
1601406-74 = ""
1601406-75 = "Ну как вам урок Ибуки, Сенсей?"
1601406-76 = "[s] «Это был отличный урок от отличного учителя.»"
1601406-77 = "Хи-хи, правда?"
1601406-78 = "Когда Ибуки вырастет, как Сенсей и старшеклассницы..."
1601406-79 = "...Ибуки станет такой же, как вы!"
1601406-80 = "[s] «Уверен, так и будет, Ибуки.»"
1601406-81 = "Серьёзно?"
1601406-82 = "Хи-хи, хорошо! Спасибо, Сенсей!"
1601406-83 = ""
1601406-85 = ""
1601406-90 = ""
1601406-91 = ""
1601406-92 = "Ибуки будет очень стараться!"
1601406-94 = "Я ещё довольно долго слушал искреннюю лекцию профессора Ибуки в этой маленькой аудитории."
