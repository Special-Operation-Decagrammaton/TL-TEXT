212030-17 = "......"
212030-18 = "Gente do céu, não tô entendendo mais é nada."
212030-19 = "Nem eu, tô boiando feio."
212030-20 = "Mas tipo assim...... mesmo sem entender patavina......"
212030-21 = "Não era exatamente isso o que a gente tanto queria?"
212030-22 = "Hã?"
212030-23 = "Pensa bem: Gehenna tá finalmente se unindo!"
212030-24 = "A líder da Sociedade Pandemônio e a chefa da Disciplina se matando era a raiz de toda a quizumba por aqui, não era?#nE essa treta acabou de evaporar!"
212030-25 = "É, por esse lado faz sentido, mas...... será que tá certo mesmo? Sério?"
212030-26 = "Hummm, sei lá, tem um negócio aí que não tá descendo redondo......"
212030-27 = "Sair invadindo as outras escolas, pô......"
212030-29 = "......"
212030-31 = "Não será que foi só modo de falar......?"
212030-32 = "Sabe como é, né? Tipo nos animes: se juntar com o rival de infância pra encarar uma ameaça maior～"
212030-33 = "Mas a cara delas parecia séria demais pra ser só pose... ou será que viajei?"
212030-34 = "E cá entre nós, ninguém conquista Kivotos da noite pro dia assim."
212030-36 = "No entanto, também não há motivo algum para não marcharmos."
212030-37 = ""
212030-40 = ""
212030-41 = "Hãã?"
212030-42 = "Como assim, Shoko?"
212030-44 = "É exatamente o que ouviram."
212030-45 = "A forma mais eficiente de unificar Gehenna é elegendo um inimigo em comum."
212030-46 = "Mas eleger Kivotos inteira de inimiga não é puxar a corda demais da conta?"
212030-47 = "Não vejo dessa forma.#nQuem sempre nos tratou como escória desordeira e tentou nos reprimir?"
212030-48 = "Foi a própria Kivotos. Para fazê-los nos respeitar, precisamos demonstrar um poder esmagador."
212030-49 = "Portanto, esta marcha é um direito legítimo de Gehenna e a resposta perfeita à arrogância das outras escolas."
212030-50 = "Será mesmo......?"
212030-51 = "Sem ação decisiva, a grandeza jamais será alcançada."
212030-53 = "E aí...... a resposta é sair atirando em todo mundo, né......"
212030-55 = "Confesso que nunca parei pra filosofar sobre isso tão a sério......"
212030-56 = "Na prática, não muda muita coisa do que já fazemos rotineiramente."
212030-57 = "Apenas expandiremos a nossa 'Área do Gatilho Livre' para cobrir Kivotos inteira. É simples assim."
212030-58 = "Como é que é a história?"
212030-59 = "Disparar, detonar e pulverizar sob o comando de ordens unificadas."
212030-60 = "A única diferença é que os alvos serão o prédio central de Trinity, a Torre de Millennium, a Árvore Sagrada de Hyakkiyako......"
212030-61 = "Isso basta."
212030-63 = "Mas elas vão revidar com tudo, né?"
212030-64 = "Não é igual aos alvos de papelão que a gente explode na nossa área de tiro."
212030-65 = "Pois é! O exército das outras academias não é fraco não!"
212030-66 = "Por mais que a gente esteja unida agora――"
212030-68 = "É perfeitamente viável."
