212030-126 = "Remodelamos......?"
212030-127 = "Sim."
212030-128 = "Não foi ninguém de fora. Fomos nós mesmas."
212030-129 = "......"
212030-130 = "Tudo o que fizemos até aqui serviu a esse nobre propósito."
212030-131 = "......"
212030-132 = "A marcha para punir a arrogância de Kivotos e restaurar a glória sob o brasão de Gehenna vai começar."
212030-133 = "Voltaremos a ser o símbolo vivo do terror supremo―― a Gehenna soberana que nenhuma academia ousava encarar de frente."
212030-134 = ""
212030-136 = ""
212030-137 = "Gehenna será a régua do mundo, a única e verdadeira lei."
212030-138 = "O antigo sonho está a apenas um passo de se tornar realidade......"
212030-139 = ""
212030-141 = ""
212030-143 = ""
212030-146 = ""
212030-147 = "Você é a Igarashi Shoko, correto?"
212030-148 = ""
212030-150 = ""
212030-151 = "Em que posso ser útil?"
212030-152 = "A líder Makoto mandou chamá-la. Apresente-se à sala de comando tático da Sociedade Pandemônio imediatamente."
212030-153 = "Compreendido."
212030-154 = ""
212030-156 = ""
212030-157 = "Com sua licença, líder Mayumi. Vou me retirar."
212030-159 = "Ah, tá bom... boa sorte lá. Seja lá pro que ela chamou......"
212030-160 = "Vai com Deus～!"
212030-161 = ""
212030-164 = ""
212030-165 = ""
212030-166 = "Pensando bem, vocês duas também são do Comitê de Restauração, não são?"
212030-167 = ""
212030-170 = ""
212030-171 = "É, somos sim......"
212030-172 = "Pera, você não é aquela veterana de outro dia?#nAquela que contou pra gente como era Gehenna no passado――"
212030-174 = "Finalmente o sonho vai se cumprir! E aí, vocês não tão pulando de alegria?!"
212030-175 = "Hã? Alegria por quê......?"
212030-176 = "Gehenna vai finalmente resgatar a sua verdadeira face de glória!"
212030-177 = "Não era isso que vocês tanto pregavam pelos corredores?!"
212030-178 = "É...... a Gehenna de antigamente......?"
212030-179 = "Exatamente! Aquela época áurea em que governávamos pelo terror absoluto! A grandiosa Gehenna!"
212030-180 = "M-Mas você não tinha dito que aquela época era um inferno sem tamanho?"
212030-182 = "Disse que odiava aquele tempo e que nunca iria querer voltar... por que tá toda sorridente agora?!"
212030-184 = "Ah, esquece aquela bobagem! Eu estava redondamente enganada!"
212030-185 = "......"
212030-186 = "A Gehenna antiga era regida por pura ordem e controle de ferro. Exatamente como vocês idealizaram!"
212030-187 = "Todo mundo marchando em uníssono, com o mesmo foco e rumo a um único objetivo.#nUma escola formidável onde ninguém precisava quebrar a cabeça com picuinhas chatas!"
212030-188 = "......"
212030-189 = "O que não conseguimos alcançar naquela época, vamos conquistar com juros e correção agora!"
212030-190 = "Atacar Kivotos inteira de surpresa! Tem sensação mais revigorante do que essa?!"
212030-191 = "A verdadeira Gehenna tá de volta! Imponente, poderosa e aterrorizante!"
212030-192 = ""
212030-194 = ""
212030-196 = ""
212030-197 = "Ela...... não parece a mesma pessoa......"
212030-198 = "Senpai, você tá legal mesmo?"
212030-200 = "Melhor impossível! Me sinto nas nuvens!"
212030-201 = "Até pouco tempo atrás eu ficava me apegando a essa vidinha mansa e sem rumo, achando que liberdade era aquilo."
212030-202 = "Mas finalmente enxerguei a verdade!"
212030-203 = "Bom, preciso me apresentar à formatura de batalha."
212030-204 = "Vocês duas tratem de dar o sangue também, viu?#nPoder lutar nessa guerra é a maior honra das nossas vidas!"
212030-205 = ""
212030-207 = ""
212030-209 = ""
212030-210 = "......Mayumi."
212030-211 = "Aquela veterana... não tinha jurado de pés juntos pra gente nunca romantizar o passado?"
212030-212 = "......Tinha."
