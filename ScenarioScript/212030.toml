212030-117 = "M-Mas aquilo era só uma brincadeira pra galera desestressar......"
212030-118 = "E quem foi que construiu essa disciplina do zero?"
212030-119 = ""
212030-121 = ""
212030-123 = "Fomos nós. Fui eu. Foi você."
212030-124 = "Nós remodelamos a mente de Gehenna."
