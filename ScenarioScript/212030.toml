[translation]
212030-181 = "You said you didn't want to go back, so why are you so happy?"

212030-1 = "Эпизод 3;Ответ Лиги наследия"
212030-3 = ""
212030-4 = "..."
212030-5 = "..."
212030-6 = "..."
212030-9 = "Во имя великой Геенны развяжем священную войну, чтобы исправить этот извращённый Кивотос и установить истинный порядок."
212030-10 = ""
212030-12 = ""
212030-15 = "..."
212030-16 = "..."
212030-17 = "..."
212030-18 = "Ну... Сейчас немного суматошно... Но большие перемены всегда сопровождаются потрясениями, верно?"
212030-19 = "Ага, точно. ...Аха-ха."
212030-20 = "Я вообще не понимаю, что происходит..."
212030-21 = "Наверное, это хорошо? В каком-то смысле мы ведь именно этого и хотели?"
212030-22 = "А?"
212030-23 = "Геенна объединилась? Все действуют сообща... и ставят Геенну на первое место?"
212030-24 = "Кажется, вражда председателя Макото и главы Префектуры Хины разрешилась. А ведь именно ИХ конфликт раскалывал академию сильнее всего..."
212030-25 = "Ну... Это правда. Хотя и немного пугает."
212030-26 = "...Они объединились, но совершенно не так, как надо..."
212030-27 = "Война...?"
212030-29 = "..."
212030-31 = "Может, они просто блефуют? Вдруг вся эта военная кампания — лишь учения?"
212030-32 = "Чтобы мы научились действовать сообща ради общей цели?"
212030-33 = "Но они выглядели ТАКИМИ серьёзными..."
212030-34 = "Да не может быть. Нельзя же просто так объявить войну, правда?"
212030-36 = "Вообще-то нет никаких причин НЕ объявлять войну."
212030-37 = ""
212030-40 = ""
212030-41 = "Ч-что?"
212030-42 = "Что ты имеешь в виду, Шоуко?"
212030-44 = "Я сказала то, что сказала."
212030-45 = "Лучший способ объединить Геенну — дать всем общего врага... начав праведную войну."
212030-46 = "Но разве воевать со всем Кивотосом — не слишком амбициозная затея?"
212030-47 = "Кивотос всегда считал нас, жителей Геенны, изгоями и нарушителями порядка. Нас подавляли."
212030-48 = "Чтобы они признали нас на мировой арене, нам нужно продемонстрировать подавляющее превосходство."
212030-49 = "Поэтому наша война оправданна. И я считаю её достойным ответом на высокомерное отношение Кивотоса к нам."
212030-50 = "Н-неужели?"
212030-51 = "Без завоеваний не бывает славы."
212030-53 = "...Война..."
212030-55 = "Война... Я никогда всерьёз об этом не думала..."
212030-56 = "Если подумать, мало что изменится."
212030-57 = "Просто представьте, что «Зона безудержной стрельбы» распространилась на весь Кивотос."
212030-58 = "...«Зона безудержной стрельбы»?"
212030-59 = "Да. Стрелять, взрывать и разрушать сообща. Всё в ритме единого боевого клича."
212030-60 = "Разнести центр Тринити, башню Миллениума и Древо божеств Хяккияко."
212030-61 = "Ничего сложного."
212030-63 = "Но ведь на войне враги будут давать отпор."
212030-64 = "Это совсем не то же самое, что разрушать мишени и декоративные постройки."
212030-65 = "Она права. С другими академиями шутки плохи."
212030-66 = "Даже если мы все объединимся..."
212030-68 = "Это возможно."
212030-69 = ""
212030-71 = ""
212030-72 = ""
212030-74 = ""
212030-75 = "Председатель, помните, что вы говорили? У всего, что мы делали, была цель."
212030-76 = "А... да. Кажется, я что-то такое говорила."
212030-77 = "Благодаря нашим занятиям большинство студентов Геенны теперь умеют ходить строем."
212030-81 = ""
212030-82 = "Знаешь, двигаться со всеми в одном ритме даже как-то... весело? По-своему?"
212030-83 = "Ага. Сначала было непривычно, а потом я сама не заметила, как начала шагать в ногу со всеми!"
212030-84 = ""
212030-86 = ""
212030-87 = ""
212030-89 = "Теперь большинство студентов Геенны способно выполнять тактические манёвры."
212030-93 = ""
212030-94 = "Впереди мина «Клеймор», обходим! Открыть огонь, атакуем с правого фланга!"
212030-95 = ""
212030-98 = ""
212030-101 = "На крыше замечен макет снайпера!"
212030-102 = "Гранатомётом обрушить второй этаж! За попадание дадут 200 очков!"
212030-103 = ""
212030-107 = ""
212030-108 = ""
212030-110 = ""
212030-116 = ""
212030-117 = "Н-но мы ведь делали это, чтобы снять стресс..."
212030-118 = "А кто всё это придумал?"
212030-119 = ""
212030-121 = ""
212030-123 = "Мы. Вы. Я..."
212030-124 = "...сделали Геенну такой."
212030-125 = "...Это мы всё устроили...?"
212030-126 = "Мы...?"
212030-127 = "Да."
212030-128 = "Никто иной, как мы сами."
212030-129 = "..."
212030-130 = "Всё, что мы делали, имело смысл. У каждого действия была своя цель."
212030-131 = "..."
212030-132 = "Скоро начнётся священная война. Мы исправим этот извращённый Кивотос и установим истинный порядок во имя славной Геенны."
212030-133 = "Мы вернём академии былое величие, когда само наше имя внушало ужас и ни одна другая академия не смела бросить нам вызов."
212030-134 = ""
212030-136 = ""
212030-137 = "Геенна станет единственным законом и единственным порядком."
212030-138 = "До воплощения нашей заветной мечты остался всего один шаг..."
212030-139 = ""
212030-141 = ""
212030-143 = ""
212030-146 = ""
212030-147 = "А, Игараши Шоуко, верно?"
212030-148 = ""
212030-150 = ""
212030-151 = "Вы меня искали?"
212030-152 = "Председатель Макото вызывает вас. Она ждёт в стратегическом штабе Пандемониума."
212030-153 = "В... военном штабе. Поняла, комендант. Немедленно явлюсь с докладом."
212030-154 = ""
212030-156 = ""
212030-157 = "С вашего позволения, я удалюсь."
212030-159 = "А, конечно. Береги себя, Шоуко... Не знаю, что понадобилось Макото, но, эм..."
212030-160 = "...Мы будем ждать."
212030-161 = ""
212030-164 = ""
212030-165 = ""
212030-166 = "Кстати, давно не виделись, младшие товарищи."
212030-167 = ""
212030-170 = ""
212030-171 = "Эм..."
212030-172 = "А, вы ведь та, с кем мы уже говорили? Вы рассказывали о старой Геенне..."
212030-174 = "И вот наконец всё свершилось! Ну как вам? Разве это не невероятно славно?"
212030-175 = "А? Что именно...?"
212030-176 = "Геенна наконец вернулась к своему прежнему облику!"
212030-177 = "Разве не о таком славном единстве вы мечтали?"
212030-178 = "Эм... Так вот какой она была раньше?"
212030-179 = "Да! Когда мы правили с помощью страха! Наша великая крепость снова напоминает старые добрые времена!"
212030-180 = "Н-но разве вы не говорили, что тогда в Геенне было... не очень хорошо?"
212030-182 = "Вы говорили, что не хотите возвращаться в прошлое. Почему же теперь так радуетесь?"
212030-184 = "А, забудьте! Я тогда была настоящей дурой. Просто оговорилась."
212030-185 = "..."
212030-186 = "Подумайте сами. Когда-то в Геенне царили порядок и контроль, совсем как в ваших мечтах."
212030-187 = "Это было поистине славное место. Все действовали слаженно, шли к общей цели, мыслили как единое целое. Никто не раздражался, никто не мучился сложными вопросами. Это было... идеально."
212030-188 = "..."
212030-189 = "А главное, похоже, мы наконец сможем достичь целей, которые тогда оставались недосягаемыми!"
212030-190 = "Война со всем Кивотосом?! Ха-ха, разве не об этом мы всегда мечтали?"
212030-191 = "Геенна наконец пробудилась вновь. Славная и грозная Геенна былых времён."
212030-192 = ""
212030-194 = ""
212030-196 = ""
212030-197 = "Вы... как будто изменились с нашей последней встречи...?"
212030-198 = "...С вами точно всё в порядке?"
212030-200 = "Разумеется! Со мной всё совершенно, совершенно замечательно!"
212030-201 = "Когда мы говорили в прошлый раз, я была увлечена своими глупыми хобби и безвкусными безделушками. Меня всё это так отвлекало, что я даже не задумывалась о возвращении к старым порядкам."
212030-202 = "Не верится, что я была такой. Вспомню и сама сгораю от стыда."
212030-203 = "Что ж, пора возвращаться в штаб!"
212030-204 = "И вы готовьтесь. Участие в этом священном походе — редкая и славная привилегия."
212030-205 = ""
212030-207 = ""
212030-209 = ""
212030-210 = "...Чего?"
212030-211 = "И это она ещё говорила, что нельзя «идеализировать прошлое»."
212030-212 = "...Ага."
212030-213 = "..."
212030-217 = "Следующий эпизод;Объединённая Геенна"