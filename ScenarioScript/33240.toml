[translation]
33240-1 = "Эпизод 24;Ненависть, которая нам не принадлежит"
33240-2 = "Гх..."
33240-3 = "Ширасу... Адзу...са..."
33240-4 = ""
33240-7 = "*тяжело дышит*... *тяжело дышит*... *тяжело дышит*..."
33240-8 = ""
33240-10 = ""
33240-12 = "[s] «Азуса!»"
33240-13 = "Я не могу двигаться, Сенсей..."
33240-15 = ""
33240-16 = "..."
33240-17 = "Ацуко..."
33240-18 = "*кашель* Химэ... Почему ты не убежала?"
33240-19 = "Мы проиграли, Азуса."
33240-20 = ""
33240-22 = ""
33240-23 = "Н-Нет, Химэ! Если ты заговоришь, она—"
33240-24 = "Всё хорошо. Теперь всё кончено."
33240-25 = "Она всё равно не собиралась оставлять меня в живых независимо от исхода. Так что всё нормально."
33240-26 = "...?"
33240-27 = "Давай закончим здесь, Саори."
33240-28 = "Закончим...?"
33240-29 = "Ты ведь не предлагаешь вернуться в Ариус. Нас убьют, если мы вернёмся..."
33240-30 = "Тогда убежим. Вместе."
33240-31 = "Убежать...?"
33240-32 = "Да."
33240-33 = "Азуса кое-чему меня научила."
33240-34 = "Ненависть, которую мы столько времени носили в себе... нам не принадлежит."
33240-35 = "Она никогда не была нашей. Её вложили в нас, а мы ошибочно приняли её за свою."
33240-36 = "Азуса поняла это раньше нас."
33240-37 = "..."
33240-38 = "Ты многое узнала и пережила за время своего отсутствия."
33240-39 = "Теперь я вижу. Тебе повезло встретить замечательного учителя, Азуса."
33240-40 = "И теперь Азуса нашла место, которому принадлежит."
33240-41 = "Поэтому, Саори..."
33240-42 = "...давай убежим вместе."
33240-43 = "Подальше отсюда. Подальше от Ариуса."
33240-44 = "Подальше от этой ненависти, которая нам не принадлежит."
33240-45 = "Но... мы не можем просто так уйти..."
33240-47 = ""
33240-48 = "Великолепно. Потенциал взрослости вновь проявляет себя."
33240-49 = "Разум и достоинство. Учтивость и убеждённость. Опыт и мудрость...#nВсе эти качества достойны восхищения."
33240-50 = "Да... Вы тот самый. Именно вы..."
33240-51 = "Вы тот, кто хранит ответ на возвышенное, которое я ищу!"
33240-54 = "Что происходит?"
33240-55 = "Не может быть..."
33240-56 = "Доктрина реализована?"
33240-57 = "[s] «(Это ощущается как...)»"
33240-58 = "Мы столкнулись с чем-то выше нашего уровня."
33240-59 = "Что происходит...?"
33240-60 = ""
33240-62 = ""
33240-64 = "С-Сенсей..."
33240-65 = "Это... плохо. Нужно бежать. Нам нужно выбраться отсюда."
33240-66 = "[s] «Верно. Кто-то подстроил игру против нас.»"
33240-67 = "Сенсей?"
33240-68 = "[ns1] «Я надеялся, что не придётся этим пользоваться.»\n[ns2] Потянуться за кошельком."
33240-69 = ""
33240-70 = ""
33240-73 = "А... Значит, вот оно!"
33240-74 = "Так это та самая карта, о которой я столько слышал!"
33240-75 = "Сила, получаемая в обмен на вашу жизнь и время... Непостижимая мощь, чьё происхождение и пределы даже нам неизвестны!"
33240-76 = "Интересно, как бы её назвал Голконда... Наверное, сказал бы, что для понимания требуется метакогниция."
33240-77 = "Хорошо. Покажите мне, Сенсей. Покажите цену, которую вы заплатили."
33240-78 = "Покажите силу, ради которой стоит заложить собственную жизнь!"
33240-79 = ""
33240-81 = ""
33240-82 = ""
33240-83 = "Ответьте на мою работу всей своей мощью!"
