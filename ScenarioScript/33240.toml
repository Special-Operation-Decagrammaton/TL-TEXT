[translation]
33240-1 = "Episódio 24;O Ódio de Quem"
33240-2 = "U-Urgh..."
33240-3 = "Azu, sa..."
33240-7 = "Arf, arf, arf..."
33240-12 = "[ns] \"Azusa!\""
33240-13 = "Sensei..."
33240-16 = "..."
33240-17 = "Atsuko..."
33240-18 = "Cof! Princesa, por que não fugiu...?"
33240-19 = "Nós perdemos, Azusa."
33240-23 = "N-Não pode, Princesa! Se você falar, ela vai—"
33240-24 = "Tudo bem, porque já acabou tudo."
33240-25 = "Além do mais, de um jeito ou de outro, ela não devia ter a intenção de me deixar viva. Então está tudo bem."
33240-26 = "...?"
33240-27 = "Vamos parar com isso, Saori."
33240-28 = "...Parar?"
33240-29 = "Está dizendo para voltarmos para Arius...? Mesmo se voltarmos, nós só vamos ser mortas..."
33240-30 = "Por isso, vamos fugir juntas."
33240-31 = "Fugir..."
33240-32 = "Sim."
33240-33 = "A Azusa me ensinou."
33240-34 = "Isso que carregamos não sei desde quando... não é o nosso ódio."
33240-35 = "Nós aprendemos esse ódio. E, desde então, sempre acreditamos que ele era nosso."
33240-36 = "...A Azusa com certeza percebeu isso, não foi?"
33240-37 = "..."
33240-38 = "A Azusa aprendeu muitas coisas e viveu várias experiências..."
33240-39 = "Você encontrou um bom adulto, né, Azusa?"
33240-40 = "E encontrou o lugar ao qual pertence..."
33240-41 = "Por isso, Saori."
33240-42 = "...Vamos fugir."
33240-43 = "Deste lugar, de Arius."
33240-44 = "Desse ódio que foi plantado em nós sem percebermos, e que não deveria ser nosso."
33240-45 = "Fugir... Mas como..."
33240-48 = "Esplêndido..."
33240-49 = "Intelecto e dignidade, cortesia e convicção, além da experiência e sabedoria cultivadas..."
33240-50 = "Como eu pensava, se for você..."
33240-51 = "Sem dúvida compreenderá o meu \"Sublime\"...!"
33240-54 = "I-Isso é..."
33240-55 = "...Não pode ser."
33240-56 = "Aquele \"Dogma\" foi concluído...?"
33240-57 = "[s] (Isso é...)"
33240-58 = "Isso está em outro nível..."
33240-59 = "O que está acontecendo...?"
33240-64 = "S-Sensei. Isso é..."
33240-65 = "Isso é ruim, precisamos fugir...!"
33240-66 = "[s] \"...Pelo visto, isso é trapaça.\""
33240-67 = "Sensei...?"
33240-68 = "[ns1] \"Eu queria terminar tudo sem precisar usar isso, mas...\"\n[ns2] Pegar o Cartão de Adulto."
33240-73 = "Oh, oooooh...!"
33240-74 = "Entendo, então aquele é o famoso \"Cartão\"...!"
33240-75 = "Um poder obtido ao preço da vida e do tempo... Algo indecifrável cuja origem e limites nem mesmo nós conseguimos compreender...!!"
33240-76 = "Ah, como será que Golconde o chamaria...? Será que ele me ensinaria alguma expressão de ordem superior...?"
33240-77 = "Mostre-me, Sensei. O preço que você tem pagado..."
33240-78 = "E o brilho daquilo que obteve em troca...!"
33240-83 = "Responda à minha obra com todas as suas forças!"
