[translation]
1012902-1 = "Девочка-волшебница из Отряда линчевателей Тринити"
1012902-2 = "Однажды вечером я задержался на работе. Решил размяться и пройтись по периметру Шале."
1012902-3 = ""
1012902-13 = "Было уже поздно, но я заметил свет в раздевалке."
1012902-14 = "[ns1] «(Кто-то забыл выключить свет?)»\n[ns2] «(Или там ещё кто-то есть?)»"
1012902-15 = ""
1012902-16 = ""
1012902-19 = "[ns3] «(Похоже, пусто.)»\n[ns4] Медленно открыть дверь."
1012902-20 = ""
1012902-21 = ""
1012902-27 = "― [log=스즈미 매지컬]С-Сенсей![/log][wa:580]"
1012902-30 = "― [log=스즈미 매지컬]Ч-Что вы здесь делаете?![/log][wa:350]"
1012902-32 = "― [log=스즈미 매지컬]Нет, как давно вы там стоите?! [/log][wa:140]"
1012902-35 = "[ns5] «Прости, Сузуми! Я думал, здесь никого нет!»\n[ns6] «Я стучал... но всё равно прости!»"
1012902-36 = "― [log=스즈미 매지컬]Я так сосредоточилась на музыке,[/log][wa:90]"
1012902-37 = "― [log=스즈미 매지컬]Я так сосредоточилась на музыке,[/log][wa:90]"
1012902-39 = "― [log=스즈미 매지컬]что совсем вас не заметила...[/log]"
1012902-42 = "― [log=스즈미 매지컬]Но всё же я рада, что это были вы, Сенсей. [/log][wa:160]"
1012902-45 = "― [log=스즈미 매지컬]А, э-этот костюм, он, эм...![/log][wa:3640]"
1012902-47 = "― [log=스즈미 매지컬]Я подготовила его для тайного расследования Отряда линчевателей...[/log][wa:10]"
1012902-50 = "― [log=스즈미 매지컬]О-Он никак не связан с моими... [/log][wa:10]"
1012902-52 = "― [log=스즈미 매지컬]предпочтениями! Правда![/log][wa:260]"
1012902-55 = "[ns] «Сузуми, ты такая милая!»"
1012902-56 = "― [log=스즈미 매지컬]Я просто проверяла, [/log][wa:30]"
1012902-58 = "― [log=스즈미 매지컬]подходит ли размер...![/log][wa:900]"
1012902-61 = "― [log=스즈미 매지컬](С-Сенсей сказал, что я милая...) [/log][wa:490]"
1012902-63 = "― [log=스즈미 매지컬](Если вы так внезапно меня хвалите, то... Ух...!)[/log][wa:750]"
1012902-66 = "― [log=스즈미 매지컬](Я всё ещё не привыкла слышать комплименты.)[/log][wa:10]"
1012902-68 = "― [log=스즈미 매지컬](Мне приятно...! Но...!)[/log][wa:2020]"
1012902-71 = "― [log=스즈미 매지컬]То, что вы сегодня увидели,[/log][wa:770]"
1012902-73 = "― [log=스즈미 매지컬]должно остаться в тайне! [/log][wa:410]"
1012902-76 = "― [log=스즈미 매지컬]Это... совершенно секретно![/log][wa:2610]"
1012902-79 = "В любом случае! Почему вы в раздевалке?"
1012902-80 = "[s7] «Здесь горел свет, я пришёл его выключить.»\n[s8] «И заодно провести обычную проверку безопасности.»"
1012902-83 = "Понятно. Значит, Сенсей тоже патрулирует Шале."
1012902-84 = "То есть вы делаете это ради безопасности учеников... Прямо как Отряд линчевателей."
1012902-85 = "[s] «Может, я научился этому у тебя, Сузуми.»"
1012902-86 = "!"
1012902-87 = "...Это очень вдохновляет, Сенсей."
1012902-88 = "Именно поэтому я..."
1012902-89 = ""
1012902-91 = ""
1012902-92 = "Эм... Мне нужно переодеться обратно... Так что..."
1012902-93 = "[s] «А, прости! Я задумался!»"
1012902-94 = "До следующего раза."
1012902-95 = ""
1012902-97 = ""
1012902-98 = "И, пожалуйста... сохраните увиденное сегодня в тайне."
1012902-100 = "Я вернулся в свой офис."
1012902-101 = "Когда я проверил немного позже, весь свет уже был выключен."
