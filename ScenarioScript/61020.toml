[translation]
61020-1 = "Эпизод 2;Обязанности студента!"
61020-2 = "Давно не виделись, Сенсей!"
61020-3 = "Нам надо встречаться почаще, а то я ещё забуду, как вы выглядите!"
61020-4 = "Правда? Интересно. Я запомнила форму лица Сенсея и кончики его ушей."
61020-5 = "Идеально помнить внешность цели — часть выполнения моей миссии."
61020-6 = ""
61020-8 = ""
61020-9 = "...Ты вообще о чём? Не говори так, будто собираешься устранить Сенсея..."
61020-10 = "О-хо-хо. Вместо столь жестоких намерений, возможно, её миссия предполагает... ночной визит. Разумеется, ради дополнительных занятий."
61020-11 = "А ТЫ теперь что несёшь?! Ты вообще способна хоть минуту сдерживать свои пошлые наклонности?!"
61020-12 = "Ты проклята?! Если хотя бы раз в день не скажешь что-то такое, у тебя язык отвалится? СМЕРТНАЯ КАЗНЬ!!"
61020-13 = "Мяу. ♡"
61020-14 = "Странные рожицы тоже теперь ВНЕ ЗАКОНА!!! Я только что решила!"
61020-16 = "А-ха-ха... Было бы здорово увидеться снова до того, как на следующей неделе у нас начнётся завал, Сенсей."
61020-17 = "[s] «На следующей неделе? А что будет?»"
61020-18 = "А. Наверное, вы не в курсе."
61020-19 = "На следующей неделе в Тринити начнётся самый разгар сезона Комплексных экзаменов."
61020-20 = "Так что нам правда надо начинать учиться... Причём очень серьёзно."
61020-21 = "[s] «Что такое Комплексный экзамен Тринити?»"
61020-23 = "Фу-фу-фу. Печально известный Комплексный экзамен Тринити."
61020-24 = "Это серия стандартизированных тестов для оценки знаний студентов по всем направлениям: языковая грамотность, санитарное просвещение, уроки здоровья и... О! Санитарное просвещение!"
61020-25 = "Как следует из названия, это комплексный экзамен по всем предметам, которые мы должны знать."
61020-26 = "Не думаю, что там настолько много разделов про здоровье...#nУх. Стоп. Теперь поняла. Ух."
61020-27 = "[s] «Он отличается от обычных экзаменов?»"
61020-28 = "Мне тоже любопытна эта деталь. Что такое «дополнительные экзамены», я узнала раньше, но..."
61020-29 = "Главное отличие в том, что задания для Комплексного экзамена Тринити составляют не в Тринити."
61020-30 = "Точно не помню почему... Что-то про достоверность? Объективность?"
61020-31 = ""
61020-33 = ""
61020-34 = "Верно! Если вопросы составляют внутри Тринити, слишком велик риск предвзятости."
61020-35 = "Люди даже могут спросить..."
61020-36 = "«Насколько честно, если тот, кто составил экзамен, сам же его и сдаёт?»"
61020-37 = "И пусть это небольшая поблажка, зато в Комплексном экзамене нет занятий по капелле."
61020-38 = "[s] «А... Теперь понял... Это что-то вроде пробного национального экзамена...»"
61020-39 = "А? Что это...?"
61020-40 = "...Что-то ещё хуже Комплексного экзамена? Эм... Кажется, понимаю."
61020-42 = "По моему анализу выражения лица Сенсея, ему это совершенно не нравилось."
61020-44 = "Фу-фу. Понимаю. Сенсей пытается убедить нас, что экзамены не любит никто, кем бы он ни был. Включая меня."
61020-45 = "...В это трудно поверить? Сенсей, несмотря на ваше искажённое представление обо мне, я правда самая обычная старшеклассница."
61020-46 = "«Обычная»...?"
61020-47 = "Ну, если вы предлагаете особый ночной экзамен под вашим личным наблюдением, Сенсей... Вот его я бы с огромным удовольствием сдала."
61020-48 = "ТЫ! ЛУЧШЕ! ПРЕКРАТИ! ИНАЧЕ!"
61020-49 = "Ой-ой, Кохару... «Иначе» что?"
61020-50 = ""
61020-52 = ""
61020-54 = "СМЕРТНАЯ КАЗНЬ!!!"
61020-55 = "Кья-а-а! ♡"
61020-56 = "А-ха-ха-ха..."
61020-57 = ""
61020-58 = "Поняла. Хифуми. В миссии «Комплексный экзамен» опасности провала нет."
61020-59 = "Ага! Поскольку экзамен проводит не Тринити, на наши оценки он не повлияет. Но именно поэтому мы должны постараться ещё сильнее!"
61020-60 = "Студенты Тринити — элита! Мы не можем уступить какой-нибудь другой школе."
61020-61 = "Технически «провалить» его нельзя, но если совсем облажаешься, придётся ходить на дополнительные учебные занятия."
61020-62 = "То есть я не могу провалиться... но всё равно могу провалиться."
61020-63 = "Аха... Можно сказать и так... Просто они не хотят слишком строго наказывать тех, кому трудно учиться."
61020-64 = "Вроде того, что мы делали в Клубе дополнительных занятий..."
61020-65 = "Это называется «учебными» занятиями, но от тебя почти ничего не требуют — только прийти!"
61020-66 = "Но никто же не хочет, чтобы дополнительные занятия отнимали те жалкие часы после школы, которые остаются для себя?"
61020-67 = ""
61020-68 = "[ns] «На этот раз мы станем Клубом усердной учёбы и обойдёмся без пересдач!»"
61020-69 = "П-Правда..."
61020-70 = "Хорошо сказано, Сенсей. В случае, если Комплексный экзамен провалю только я..."
61020-71 = "...вы станете учителем на моих дополнительных занятиях?"
61020-72 = "Только представьте. Пустой класс, в нём лишь мы вдвоём. Жарко, вы открываете окно, и вечерний ветер скользит по нам..."
61020-73 = "Я, проблемный студент, смотрю на тёплый багрянец заката... Сенсей подходит ближе, чтобы меня отчитать..."
61020-74 = "Врывается сильный порыв ветра... Сенсей инстинктивно протягивает руку, чтобы защитить меня..."
61020-75 = ""
61020-77 = ""
61020-79 = ""
61020-80 = "Мы смотрим друг другу в глаза, лица совсем рядом, и сами не замечаем, как наклоняемся... ближе... и ближе..."
61020-81 = "Ч-ЧТООО?!"
61020-82 = "???"
61020-83 = "А?!?!"
61020-84 = "Тебе ЗАПРЕЩЕНО говорить!! ЗАПРЕЩЕНО!!"
61020-85 = "Э-хе-хе."
61020-86 = ""
61020-88 = ""
61020-89 = ""
61020-90 = "[ns1] «(Раз уж они об этом заговорили...)»\n[ns2] «(Надо посмотреть, как справляются остальные.)»"
61020-94 = "[ns] «Патрульный отряд не отдыхает даже во время экзаменов?!»"
61020-95 = "Разумеется нет! Учёба И общественная безопасность одинаково важны!"
61020-96 = "Узрите! Вот несгибаемая воля Патрульного отряда! Мы никогда не поступимся принципами!"
61020-97 = "Правда, Сузуми?!"
61020-98 = ""
61020-100 = ""
61020-101 = "Эм, я не совсем понимаю, какие именно «принципы» ты имеешь в виду..."
61020-102 = "Но в любом случае учёба — неотъемлемая обязанность любого студента. Поэтому я согласна."
61020-103 = "Простите? Просто глядя на меня, вам становится легче на душе? Я-Я не понимаю, что это значит..."
61020-104 = "Я тоже! Но если что-то хорошее, ничего плохого в нём быть не может!"
61020-107 = ""
61020-108 = "А-а?!#nО, это вы двое. Я подумала, сюда пробрался посторонний."
61020-109 = "Сенсей просто пришёл проверить нас, раз сейчас экзамены!"
61020-110 = "Лингвистика в этих тестах такая примитивная. Мне почти не нужно готовиться."
61020-111 = "Там есть и другие предметы, Уи! Не зря это называется «Комплексный экзамен»."
61020-112 = "...В книгах есть сведения по самым разным предметам, так что всё будет нормально..."
61020-114 = "Нормально? Даже с... математикой?"
61020-115 = "А-а?!"
61020-116 = "Так нельзя, президент. Как привередничать в еде вредно для здоровья, так и быть привередливой читательницей тоже плохо!"
61020-117 = "Угх..."
61020-118 = ""
61020-119 = "[ns] «Ты хорошо знаешь математику, Шимико?»"
61020-120 = "Я?"
61020-121 = "Я первокурсница, поэтому объём моего экзамена будет намного проще, чем у президента, которая на третьем курсе."
61020-122 = "Ух... Как нечестно."
61020-124 = ""
61020-125 = "Эй, Сенсей. Мы ведь СОБРАЛИСЬ вместе готовиться к Комплексному экзамену..."
61020-126 = ""
61020-128 = ""
61020-129 = "Слушайте внимательно, отважные студенты. Когда падает уровень сахара, падает и работа мозга."
61020-130 = "А пополнять запасы следует только самым премиальным топливом: глюкозой."
61020-131 = "Следовательно! Наслаждаться десертом в столь критическое время — не только романтично, но и совершенно необходимо!"
61020-132 = "Точно! Какая учёба без сладостей? Вот за это мы тебя и держим рядом, Нацу!"
61020-134 = "...И вот мы здесь."
61020-135 = "П-Прости, Сенсей. Ты даже нашёл время зайти к нам..."
61020-136 = ""
61020-137 = "[ns] «В каком-то смысле... приятно видеть, что некоторые вещи никогда не меняются...»"
61020-139 = "Разумеется, Сенсей. Рыцарь первой помощи принимает вызов, будь то экзамен или помощь."
61020-140 = "На самом деле этот Комплексный экзамен — всего лишь помощь в иной форме."
61020-141 = "[s] «Эм... Я не совсем понимаю...»"
61020-142 = "И экзамены, и помощь приносят пользу людям."
61020-143 = "Мы должны поддерживать нашу страстную преданность помощи, следуя её принципам при любых обстоятельствах."
61020-144 = "Поэтому помощь принимает множество форм. Например, протянуть руку с чистыми намерениями, а не из эгоистичных желаний."
61020-145 = "Или противостоять несправедливости любыми необходимыми средствами. Это тоже проявление помощи."
61020-146 = "Представьте коррумпированного поставщика медикаментов, который ради экономии создал некачественный продукт, неспособный нормально дезинфицировать и лечить раны. Наказывая его, я помогаю и ему, и обществу."
61020-147 = "Все пути ведут к помощи."
61020-148 = "Значит, и этот экзамен — тоже помощь."
61020-149 = ""
61020-150 = "Хм? А что именно значит «помощь»? Аха... а-ха-ха..."
61020-151 = "П-Полагаю, это то, что мы, Рыцари первой помощи, ценим превыше всего?"
61020-152 = "Знаете, мне интересно, почему передовые медицинские достижения Тринити вообще не проверяют на экзамене!"
61020-153 = "О-Ох. Эм... Может, потому что наше лезвие прогресса немного слишком острое, Ханаэ..."
61020-155 = "С-С-С-С-С-С-Сенсей?! Ч-Ч-Что вы здесь делаете?!"
61020-156 = "О-О! Я рада, что вы захотели нас проверить... но...!"
61020-157 = "У-угх..."
61020-158 = "Сделай несколько глубоких вдохов, Цуруги. Пожалуйста, возьми себя в руки перед Сенсеем."
61020-159 = "Д-Да..."
61020-160 = "Спасибо, Сенсей... за заботу..."
61020-161 = ""
61020-162 = "[ns] «Простите. Я не хотел мешать вашей подготовке»."
61020-163 = "Ничего страшного. Правильные перерывы — важнейшая часть процесса."
61020-164 = "Последние несколько дней, кроме еды и патрулей, мы только и делали, что учились."
61020-165 = "Свободного времени у нас меньше, чем у большинства, поэтому приходится втискивать подготовку в каждую доступную минуту."
61020-166 = ""
61020-168 = ""
61020-170 = "Она совершенно права, но тебе не надо так волноваться, Сенсей! Все здесь прекрасно знали, какой будет жизнь в Отряде справедливости, когда вступали."
61020-171 = "Да. Решительно идти вперёд по выбранному пути, невзирая на препятствия..."
61020-172 = "...это и делает нас теми, кто мы есть."
61020-173 = "Кстати о препятствиях, я всё ещё застряла на этом месте! Можешь объяснить моральный релятивизм?"
61020-174 = "...Мне тоже немного трудно. Если что-то морально или аморально только относительно определённой точки зрения, можно ли вообще что-либо назвать «моральным»?"
61020-175 = "Это одна из тех тем, которые становятся только сложнее, чем больше о них думаешь. Давай начнём хотя бы с запоминания теории..."
61020-177 = "...Ах, да. Я планирую проводить учебные занятия в большом актовом зале. Посещение обязательно для всех Сестёр."
61020-178 = "[s3] «А-что, если кому-то лучше заниматься в одиночку?!»\n[s4] «Обязательное участие — это слишком жёстко! А если человек стесняется?»"
61020-181 = "Я не понимаю. Мы, Сестринство, стремимся жить без стыда и греха."
61020-182 = "Для студентов учёба — одна из главных обязанностей. С какой стати им стесняться своих Сестёр в трудный момент?"
61020-183 = "Я доверяю Сестринству и его членам собственную жизнь!"
61020-184 = "Кроме того, я заверила их, что они могут записаться ко мне на консультацию и обсудить любые тревоги."
61020-185 = "Я сделаю всё возможное, чтобы они успокоились."
61020-186 = "Д-Для большинства сестёр личная консультация с вами — это..."
61020-187 = ""
61020-189 = ""
61020-190 = ""
61020-191 = "Прекрасная возможность, да, сестра Хината? Я обязана постоянно искать новые способы воплощать сострадание и праведные принципы, которые проповедуем другим."
61020-193 = "К-Как скажете! Наверное...!"
61020-195 = "Мне удалось убедить Сакурако немного смягчиться."
61020-196 = "И в итоге мы сделали учебные занятия для Сестёр добровольными."
61020-197 = "Хинате и Мари... правда нелегко..."
61020-198 = ""
61020-199 = ""
61020-200 = ""
61020-201 = ""
61020-202 = "А! Сенсей! Здравствуйте!"
61020-203 = "А, ну... Возможно, я немного откладывала подготовку..."
61020-204 = "Правда? Вы угостите нас десертом, если хорошо напишем? Я запомнила!"
61020-205 = "И я! В этот раз даже начну готовиться заранее!"
61020-206 = "Ты имеешь в виду опять «дашь глазам отдохнуть» после одной страницы конспекта?"
61020-207 = "Я точно видела, как ты тоже уснула!"
61020-208 = ""
61020-210 = ""
61020-211 = ""
61020-213 = "Я улыбнулся перепалке девушек и пошёл дальше."
61020-214 = "Меня удивили две студенты, обе явно нервничали."
61020-215 = ""
61020-219 = ""
61020-220 = "С-Сенсей...?"
61020-221 = "У вас есть минутка...?"
61020-222 = ""
61020-224 = "Следующий Эпизод;Новое Начало"
