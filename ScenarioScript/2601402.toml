[translation]
2601402-1 = "Ежедневный журнал питания Карин"
2601402-2 = "Здесь стоит взять чуть больше поправку на ветер..."
2601402-3 = "Нет, может, лучше с другой стороны..."
2601402-4 = "[s] «Карин.»"
2601402-5 = "О, Сенсей."
2601402-6 = "Я не знала, что вы здесь. Прошу прощения."
2601402-7 = "Хм? Что я записывала?"
2601402-8 = "А, эм... просто возможные позиции для снайпера на этой площади."
2601402-9 = "Нет, никакой конкретной миссии у меня нет. Это скорее привычка. Я всегда делаю так перед началом задания, поэтому..."
2601402-10 = "[s] «Но разве сегодня у тебя не выходной?»"
2601402-11 = "Ну, д-да."
2601402-12 = "[s1] «В выходной нужно отдыхать.»\n[s2] «Я пока подержу этот блокнот у себя.»"
2601402-15 = "А, е-если вы заберёте мои записи...!"
2601402-16 = "М-м... но вы правы."
2601402-17 = "Ладно. В выходной я не буду заниматься ничем, связанным с заданиями."
2601402-18 = "...И что мне тогда делать...?"
2601402-19 = "[s] «Что ты обычно делаешь после завершения заданий?»"
2601402-20 = "Убираюсь и готовлюсь к следующей миссии."
2601402-21 = "Ещё подрабатываю."
2601402-22 = "[s] «А увлечения?»"
2601402-23 = "Э-эм, уборка, наверное?"
2601402-24 = "М-м, но технически это тоже продолжение моей работы, так что увлечением назвать трудно..."
2601402-25 = "Если подумать, в моей жизни почти нет спокойных занятий для отдыха."
2601402-26 = "[s] «Это плохо!»"
2601402-27 = ""
2601402-30 = "[ns] «Карин, тебе нужно отдыхать!»"
2601402-31 = "О... В-вы так думаете?"
2601402-32 = "Но физически я вроде совсем не устала..."
2601402-33 = "Что? Сейчас я могу этого не чувствовать, но потом всё разом даст о себе знать?"
2601402-34 = "Невралгия, затёкшая шея, хроническая усталость...? О чём вы вообще...?"
2601402-35 = "Ну... ладно, я поняла."
2601402-36 = "Раз сегодня я в школьной форме, а не в форме горничной, буду отдыхать, как вы и посоветовали."
2601402-37 = "Хотя я не знаю, чем именно заняться. Может, вы что-нибудь посоветуете, Сенсей."
2601402-38 = "[s] «Как насчёт...»"
2601402-39 = ""
2601402-42 = "[ns] «...для начала попробовать фестивальную еду?»"
2601402-45 = "Фестиваль... Понятно. Кажется, на территории школы действительно сейчас проходит один..."
2601402-46 = "Хотя у меня почти нет опыта с такими вещами..."
2601402-47 = "Сенсей, мы будем есть здесь?"
2601402-48 = "[s] «Вообще-то в уличных палатках бывает очень вкусно.»"
2601402-49 = ""
2601402-52 = "[ns] «Скажи, если что-нибудь сразу приглянется.»"
2601402-53 = "Надо посмотреть, что здесь есть. Давайте пройдёмся вместе."
2601402-55 = "Вкусные шашлычки здесь!"
2601402-56 = "Ещё есть хот-доги и якисоба!"
2601402-57 = "Шашлычки, хот-доги и якисоба... Всё выглядит вкусно."
2601402-58 = "Хорошо, я решила. Сенсей, возьму вон тот шашлычок."
2601402-59 = "Два, пожалуйста."
2601402-60 = "Ага! Спасибо!"
2601402-61 = "Вот, этот вам, Сенсей. Берите."
2601402-62 = "[s] «Тебе стоит научиться...»"
2601402-63 = "Простите?"
2601402-64 = ""
2601402-67 = "[ns] «Карин, тебе стоит научиться прямо говорить о том, чего ты хочешь!»"
2601402-68 = "У-уф?!"
2601402-69 = "О-о чём вы говорите...?"
2601402-70 = "[s] «Шашлычок, хот-дог и якисоба. По две порции каждого, пожалуйста!»"
2601402-71 = "Ага! Спасибо!"
2601402-72 = "Вот!"
2601402-73 = "М-можно правда купить ВСЁ это...?"
2601402-74 = "Что? Если мы пришли сюда снять стресс, а я буду себя сдерживать, стресс только накопится?"
2601402-75 = "В этом есть смысл, но... эм..."
2601402-76 = "Хорошо тогда. Спасибо."
2601402-77 = "Давайте поедим на той скамейке."
2601402-79 = "Этот шашлычок вкусный. Попробуйте свой, Сенсей."
2601402-80 = "И якисоба совсем неплохая..."
2601402-81 = "Вы были правы. Если бы я ограничилась одним шашлычком, потом бы пожалела."
2601402-82 = "[s] «Фуфу, попробуй ещё этот хот-дог.»"
2601402-83 = "Хорошо тогда."
2601402-84 = "М-м, тоже вкусно."
2601402-85 = "[s] «Рад это слышать. Тогда—»"
2601402-86 = ""
2601402-89 = "А! Сенсей, осторожно, вы его уроните!"
2601402-90 = ""
2601402-94 = "...Поймала."
2601402-95 = "[s] «Отличная реакция, Карин!»"
2601402-96 = "А, эм, я-то поймала, но..."
2601402-99 = "― [log=카린 교복]С-Сенсей, подождите, одну минутку.[/log][wa:1430]"
2601402-100 = "― [log=카린 교복]Если подумать, теперь будет проблематично отдавать его вам обратно...![/log][wa:1010]"
2601402-103 = "― [log=카린 교복]Я... я поймала его ногами, так что он немного испачкался...[/log][wa:3720]"
2601402-104 = "― [log=카린 교복]Может, я съем его, а вы возьмёте этот...?[/log][wa:4350]"
2601402-107 = "― [log=카린 교복]...А.[/log][wa:1570]"
2601402-108 = "― [log=카린 교복]Точно, я ведь уже откусила от этого...[/log][wa:1860]"
2601402-111 = "― [log=카린 교복]Н-нет, подождите! Это совсем не то. Я вовсе не это имела в виду...![/log][wa:310]"
2601402-114 = "― [log=카린 교복]Ладно, тогда сделаем так...[/log][wa:10]"
2601402-115 = "― [log=카린 교복]...! Н-нет, нет![/log][wa:2680]"
2601402-118 = "[ns3] «У-успокойся, Карин. Меня устроит любой вариант.»\n[ns4] «Я понимаю. Если тебя устраивает, то и меня тоже.»"
2601402-119 = "― [log=카린 교복]Нет, дело не в этом! Я правда совсем не это имела в виду![/log][wa:840]"
2601402-120 = "― [log=카린 교복]Нет, дело не в этом! Я правда совсем не это имела в виду![/log][wa:840]"
2601402-123 = "― [log=카린 교복]К-какой бы я вам ни отдала, это всё равно...![/log][wa:3210]"
2601402-124 = "― [log=카린 교복]Уф... И что мне теперь делать...?[/log][wa:3600]"
2601402-127 = "Мне удалось успокоить Карин, и мы вместе доели хот-доги."
2601402-128 = ""
2601402-129 = "К-кхм, я на секунду запаниковала, но... теперь всё хорошо. Я совершенно спокойна."
2601402-130 = "Хот-доги были довольно вкусными."
2601402-131 = "[s] «Да, были...»"
2601402-132 = "Уф, кажется, я краснею..."
2601402-133 = "В-в любом случае, спасибо за сегодня."
2601402-134 = "Это и правда было похоже на настоящий выходной."
2601402-135 = "Надеюсь, в следующий раз ты тоже научишь меня ещё каким-нибудь способам снимать стресс."
