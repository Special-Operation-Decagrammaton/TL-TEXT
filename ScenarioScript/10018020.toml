10018020-150 = ""
10018020-152 = "...зачёт."
10018020-154 = ""
10018020-155 = "Да!"
10018020-156 = "Фух..."
10018020-158 = "С гастрономической точки зрения оно безупречно."
10018020-159 = "Но что ещё важнее — такую еду жалко есть в одиночестве."
10018020-160 = ""
10018020-162 = ""
10018020-163 = "Почему бы вам всем не присоединиться ко мне?"
10018020-164 = ""
10018020-166 = ""
10018020-171 = ""
10018020-172 = "Еда, одобренная Харуной... Я в предвкушении! ★"
10018020-173 = "Запах заставил меня так мучительно ждать, что кажется, будто я не ела весь день!"
10018020-174 = ""
10018020-176 = ""
10018020-177 = "Хорошо, давайте—"
10018020-178 = ""
10018020-181 = ""
10018020-182 = ""
10018020-186 = "Где хозяин этой забегаловки?!"
10018020-187 = "Ты! Кто разрешал менять поставщика?"
10018020-188 = "Это нарушение договора! Ты мелкий шрифт вообще читала?"
10018020-189 = "Будут штрафы! Компенсации! Банкротство! И не такое, каким пользуются богачи!"
10018020-190 = ""
10018020-195 = ""
10018020-196 = "Эй! Смотри, куда идёшь!"
10018020-197 = ""
10018020-206 = ""
10018020-207 = "Моя... Моя еда..."
