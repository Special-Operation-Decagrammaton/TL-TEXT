[translation]
10018020-1 = "Эпизод 2; Предприятие Фууки в переулке"
10018020-2 = ""
10018020-6 = ""
10018020-7 = "Невероятно..."
10018020-8 = ""
10018020-10 = ""
10018020-11 = ""
10018020-12 = "Вытяжка, газовые конфорки, фритюрница, духовка… Всё это обычно быстро покрывается жиром."
10018020-13 = "Но здесь всё настолько чистое, будто совершенно новое."
10018020-14 = ""
10018020-16 = ""
10018020-17 = "Ваш холодильник невероятно аккуратный, продукты хорошо организованы и всегда под рукой."
10018020-18 = "Овощи немного помяты, но это наверняка проблема поставщика."
10018020-19 = "А приправы вы, похоже, выбрасываете раньше указанного срока годности?"
10018020-20 = "Ну, если из-за меня кто-то заболеет, я потеряю доверие! ...Так нельзя?"
10018020-21 = "Н-Ничего страшного!"
10018020-22 = "Кухня чистая, практически безупречная."
10018020-23 = "При всём при этом... вы всегда используете одни и те же приправы?"
10018020-24 = "Да. Меня учили только так..."
10018020-25 = "Хм... Все ингредиенты приправляются одинаково..."
10018020-26 = "Похоже, мы нашли первую проблему."
10018020-27 = "Но до этого я уже некоторое время думаю ещё об одном."
10018020-28 = "Да, о чём?"
10018020-29 = "Вы говорили, что закупаете все ингредиенты у Няо Фудс, верно?"
10018020-30 = "Да, другого выбора у меня нет..."
10018020-31 = "Честно говоря, качество этих ингредиентов ниже среднего."
10018020-32 = ""
10018020-34 = ""
10018020-35 = "...Понятно."
10018020-36 = ""
10018020-38 = ""
10018020-39 = "Не вы одна это заметили."
10018020-40 = "Когда я начала закупаться у Няо Фудс, постоянные посетители стали жаловаться на общий вкус блюд."
10018020-41 = "Но Няо Фудс монополизировала все поставки в этом районе. У меня нет другого выбора."
10018020-42 = "Если проблема в поставках, Клуб школьной столовой может помочь!"
10018020-44 = "Точно."
10018020-45 = "Это далековато, но... не хотите пойти со мной?"
10018020-46 = ""
10018020-49 = ""
10018020-52 = "...Босс, я хотела бы попросить вашей помощи."
10018020-53 = "Конечно! Чем я могу тебе помочь, Фуука?"
10018020-54 = "Я помогаю тебе, а ты помогаешь мне найти больше покупателей? Все в выигрыше!"
10018020-55 = "Я-я у вас в долгу..."
10018020-56 = "Ой, нет. Не нужно таких слов. В трудную минуту помогать друг другу — это естественно."
10018020-58 = "Мы поставляем еду студентам Геенны, так что за качество отвечаем!"
10018020-60 = "Получать столько помощи... Я не хочу становиться обузой..."
10018020-61 = "Вовсе нет. Для людей из кулинарного сообщества естественно помогать там, где помощь нужна."
10018020-62 = "Мы все намерены вам помочь."
10018020-63 = "И более надёжного спасителя вы бы не нашли! Я готова поручиться за Фууку в любой день!"
10018020-64 = "[s] «Я тоже могу за неё поручиться.»"
10018020-65 = "Видите? Даже Сенсей из Шале с нами!"
10018020-67 = "Ха-ха-ха..."
10018020-68 = ""
10018020-70 = ""
10018020-72 = ""
10018020-73 = "Эй, это не хозяйка «Воробья»?"
10018020-74 = "Вроде она. Что тут происходит? Почему они разговаривают с хозяйкой рынка «Чирп»?"
10018020-75 = ""
10018020-77 = ""
10018020-78 = "Неужели...?"
10018020-81 = ""
10018020-82 = ""
10018020-83 = "Раз уж ингредиенты у нас есть, приступим к готовке?"
10018020-84 = "Джури, можешь заняться подготовкой?"
10018020-85 = "Оставь мне!"
10018020-89 = "Не хочу вмешиваться в ваши устоявшиеся методы, но..."
10018020-90 = "...вы не думали использовать остаточное тепло, чтобы смешивать соус?"
10018020-91 = ""
10018020-93 = ""
10018020-94 = "Мясо покроется им, и вкус с текстурой станут совсем другими."
10018020-95 = "Это почти как карамелизация."
10018020-96 = "О... Я об этом не подумала!"
10018020-100 = "Когда готовите суп, слегка обжарьте ингредиенты перед тем, как добавлять воду."
10018020-101 = "Так вкус всего блюда станет глубже."
10018020-102 = "Но разве я не могу просто пережарить твёрдые ингредиенты?"
10018020-103 = "Такой риск определённо есть."
10018020-104 = "Думайте об этом как о головоломке."
10018020-106 = "Каждому блюду нужно своё решение и идеальный баланс."
10018020-109 = "Готовить большими объёмами сложно."
10018020-110 = "Количество ингредиентов можно умножить на число людей, а вот с температурой так не получится."
10018020-111 = "Есть какое-нибудь решение?"
10018020-112 = "Чаще помешивайте, чтобы всё готовилось равномерно."
10018020-113 = "Но не слишком часто, иначе можно испортить более нежные ингредиенты."
10018020-114 = "Нужно очень осторожно найти идеальный баланс."
10018020-118 = "Итак, мы закончили несколько новых блюд для меню."
10018020-119 = "А теперь нужен кто-то, кто оценит, удались ли они..."
10018020-120 = "Харуна?"
10018020-122 = "Я ждала."
10018020-123 = "Ну что ж, пора приступать."
10018020-124 = ""
10018020-126 = ""
10018020-127 = ""
10018020-128 = ""
10018020-129 = ""
10018020-131 = ""
10018020-132 = "(Я-я так нервничаю.)"
