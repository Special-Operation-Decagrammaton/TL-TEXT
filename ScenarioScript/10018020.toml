10018020-211 = "Н-Называть это трагедией немного драматично."
10018020-212 = "И-и вообще это была твоя вина! Нужно было внимательнее относиться к моему локтю!"
10018020-213 = "[s] «Не думаю, что у вас получится, но хотя бы попытайтесь убежать.»"
