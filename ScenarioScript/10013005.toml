[translation]
10013005-1 = "Пролог;Лето ещё не закончилось"
10013005-2 = ""
10013005-7 = ""
10013005-8 = ""
10013005-9 = "Мы прибыли, Сенсей."
10013005-10 = "[s1] «Спасибо, что подвезла на вертолёте.»\n[s2] «Я знаю, ты занята, Аяне. Спасибо.»"
10013005-13 = "Не стоит!"
10013005-14 = "Я обещала всем безопасно доставить вас обратно в Шале."
10013005-15 = "Вот. Я помогу занести ваш багаж."
10013005-16 = ""
10013005-18 = ""
10013005-19 = "А? Сенсей... Кто-то перекрывает вход."
10013005-20 = "[s] «Хм?»"
10013005-22 = ""
10013005-25 = ""
10013005-26 = "А, Сенсей! Возвращаетесь из отпуска?"
10013005-27 = "Хи-хи. Вот это жизнь. И отпуск, и милые девушки?"
10013005-28 = "А-А?! М-Милые...?!"
10013005-29 = "Ой, твоя реакция напоминает мне, как я впервые встретила Кахо."
10013005-30 = "Хи-хи. Ты просто прелесть."
10013005-31 = "[s] «...Ния...?»"
10013005-32 = "Ния, пожалуйста, сосредоточься на нашем срочном деле. Думаю, ты смущаешь Сенсея и его студента."
10013005-33 = "Хи-хи. Просто не смогла удержаться. Прости, прости."
10013005-34 = "[s] «И Мимори тоже... Неожиданная компания...»"
10013005-35 = "Ладно. Хватит болтать."
10013005-36 = "Сенсей, я здесь по официальному делу как студент Хяккияко."
10013005-37 = "А-а-а! Сенсей! У нас проблемы! Большие проблемы!"
10013005-38 = "Президент...! Президент и Умика...!"
10013005-39 = "[s] «Пина?! Что-то случилось с Шизуко?»"
10013005-40 = "Видите ли, похоже, Шизуко попала в небольшую неприятность."
10013005-41 = "[s] «Я с ней поговорю. Идём в Момоёдо.»"
10013005-42 = "В этом и суть проблемы. Её там нет."
10013005-43 = "Президент сейчас на пляже!"
10013005-44 = "[s] «...На пляже?»"
10013005-45 = "Да, мне сказали, что президент Отдела фестивалей находится в месте под названием..."
10013005-46 = "...курорт «Потерянный рай»."
10013005-47 = "[s] «Курорт „Потерянный рай“... Не может быть...»"
10013005-49 = "Н-Но... Разве мы не только что были там?"
10013005-50 = "[s] «...Были.»"
10013005-55 = "Мы благополучно прибыли, все."
10013005-56 = ""
10013005-58 = "Ура. Мы здесь."
10013005-59 = "Это и есть курорт «Потерянный рай»?"
10013005-60 = "Он... во многом превосходит ожидания."
10013005-61 = "[s] «Спасибо, что привезла нас сюда. У тебя и без того забот полно.»"
10013005-62 = "О-О! Нет, не благодарите! Мне всё равно нужно было возвращаться... Просто я не ожидала, что вместе с вами."
10013005-63 = ""
10013005-66 = "Похоже, все добрались без происшествий! ♪"
10013005-67 = "[s] «Почему ты не приехала, Ния...?»"
10013005-68 = "А-ха-ха! Сенсей, вы приглашаете меня на романтическое свидание на пляже?"
10013005-69 = "К сожалению, как президент Клуба Инь-Ян я не могу просто ускользнуть, когда захочу."
10013005-70 = "Поэтому я отправила вместо себя Чисэ и Мимори. Пожалуйста, присмотрите за ними!"
10013005-71 = "[s] «Похоже на отговорку...»"
10013005-72 = "Ха... ха-ха..."
10013005-73 = "Да. Я постараюсь изо всех сил от имени президента."
10013005-75 = "Сенсей! Простите! Зная, что президент в беде, я тоже хотела поехать!"
10013005-76 = "Но у меня есть миссия — защищать район Момоёдо...!"
10013005-77 = "[s] «Выполняй свою работу. Мы справимся.»"
10013005-78 = "Да, Сенсей...! То есть, босс!"
10013005-79 = "Президент Отдела фестивалей должна быть в Пляжной хижине."
10013005-80 = "[s] «Пляжная хижина, говоришь...»"
10013005-82 = ""
10013005-89 = "[ns] \"H-Huh?!\""
10013005-90 = "Сенсей! Давайте выясним, что за шум."
10013005-92 = ""
10013005-93 = ""
10013005-94 = "Э-Эта сила. Неужели это злая сила, что устроила Охоту на курорты?!"
10013005-95 = "Нельзя недооценивать Отдел проведения фестивалей Академии Хяккияко!"
10013005-97 = "Я же сказала! Я понятия не имею, о чём вы говорите!"
10013005-98 = "Это вы сами без причины влезли в наши дела!"
10013005-99 = "Э-Э-Это уже пятый раз за сегодня!"
10013005-101 = "Врёшь до самого конца, значит."
10013005-103 = "Сейчас мы отступаем, но лучше следите за спиной!"
10013005-104 = ""
10013005-106 = ""
10013005-107 = "Я... не очень чувствую, что мы победили."
10013005-108 = "[s] «Шизуко?»"
10013005-110 = "Шизуко...!"
10013005-111 = "Привет. Маленькая енотиха!"
10013005-113 = ""
10013005-115 = ""
10013005-116 = "А?! Сенсей... и остальные?!"
10013005-117 = "Мой господин!"
10013005-118 = "Сенсей из Шале?!"
10013005-119 = "[s] «Эм... Хороший денёк для пляжа?»"
10013005-120 = "В... Ва..."
10013005-121 = "А-А-А! Сенсей! Это был такой ужасный день!"
10013005-123 = "Момоёдо курорта «Потерянный рай»"
10013005-124 = "Не могу поверить, что вы приехали так далеко, господин!"
10013005-125 = "Вы пришли оценить прогресс Изуны? Нин-нин!"
10013005-126 = "[s] «Вообще-то это приятный сюрприз.»"
10013005-127 = "Ого! Значит, это судьба! Изуна здесь на задании по сопровождению по просьбе Шизуко!"
10013005-128 = "Шизуко увидела потенциал Изуны стать сильнейшей ниндзя во всём Кивотосе и наняла её!"
10013005-129 = "Хм?"
10013005-130 = "О, нет. Я просто увидела потенциал в ниндзюцу как концепции."
10013005-131 = "Для рекламных мероприятий будет отлично!"
10013005-132 = "Что?! То есть ты не думала, что Изуна — супер-крутая, супер-сильная ниндзя?!"
10013005-133 = "(разочарована)"
10013005-134 = "[s] «Изуна, подработка тоже важная работа.»"
10013005-135 = "Правда?! Если господин так говорит, Изуна должна стараться изо всех сил!"
10013005-136 = ""
10013005-137 = "[s3] «В любом случае, Ния и Пина отправили меня сюда.»\n[s4] «Все говорили, что Шизуко и Умика в беде.»"
10013005-141 = "Пожалуй, мы действительно попали в небольшую неприятность..."
10013005-142 = "Сенсей! Только сегодня на нас уже напали пять раз! Пять! Раз!"
10013005-143 = "[s] «Мне жаль, что так вышло...»"
10013005-144 = "Мы просто открыли магазин, а бандиты окружили нас, вопя «Мы победим владельца!» и всякую другую странную ерунду."
10013005-145 = "Может быть, эта «Охота на курорты», о которой они говорили, — какой-то весёлый фестиваль?"
10013005-146 = "С чего бы им нападать на нас из-за фестиваля?!"
10013005-147 = "[s] «Владелец... и Охота на курорты...»"
10013005-149 = "Прошу прощения, но..."
10013005-150 = ""
10013005-152 = ""
10013005-153 = "Случайно не вы выиграли отпуск на курорте в этом месте?"
10013005-154 = "А? Не совсем, то есть..."
10013005-155 = "Хи-хи. Отдел проведения фестивалей купил контракт на курорт «Потерянный рай» и приехал сюда!"
10013005-156 = "Да, в рамках нашей деятельности."
10013005-157 = "[s] «Вы ведь не читали мелкий шрифт, да?»"
10013005-158 = "Мелкий шрифт? О чём вы?"
10013005-159 = "[s] «Хм?»"
10013005-160 = "...?"
10013005-161 = ""
10013005-165 = "Эм, похоже, произошло какое-то недоразумение."
10013005-166 = "Аяне, можешь нас просветить?"
10013005-167 = "Вы ведь приехали сюда в отпуск с Сенсеем, верно?"
10013005-168 = "О, да... но это... Ну, сложно объяснить."
10013005-169 = "Тогда, может, Сенсей объяснит за нас?"
10013005-170 = "[s] «Охота на курорты, о которой вы слышали, идёт по всему архипелагу.»"
10013005-171 = "Поэтому здесь эти Бандиты в купальниках?"
10013005-172 = "И из-за какой-то лазейки все дерутся друг с другом, чтобы застолбить права?"
10013005-173 = "Я подробно объяснил им всё, что связано с Охотой на курорты."
10013005-174 = "[s] «Вы должны увидеть это в своём контракте.»"
10013005-176 = "Владелец этого контракта получает «право пользования» курортом «Потерянный рай»."
10013005-177 = "Вышеупомянутое «право пользования» означает права на всю землю, товары и объекты курорта, а также всю прибыль и ресурсы, производимые курортом."
10013005-178 = "Права владельца являются «абсолютными»."
10013005-179 = "Я не вижу в этом контракте ничего неправильного."
10013005-180 = "[s] «Проблема в том, что у всех один и тот же контракт.»"
10013005-181 = "Я рассказал ей, как Серика выиграла «отпуск» в Абидосе и что у Бандитов в шлемах тоже был контракт."
10013005-182 = "Я также объяснил, что контракт выглядел так, будто относится только к одному острову, но на самом деле давал права на весь архипелаг курортов «Потерянный рай»."
10013005-183 = "То есть вы хотите сказать, что многие люди приехали в «Потерянный рай» с таким же контрактом, как у нас."
10013005-184 = "А Охота на курорты началась, когда они обнаружили лазейку и начали бороться за права собственности."
10013005-185 = "Погодите, погодите. Это безумие! Откуда вы вообще всё это знаете?"
10013005-186 = "[s] «Нам с Аяне пришлось узнать это на собственном опыте.»"
10013005-187 = ""
10013005-190 = "[ns] «(Кстати, студенты Абидоса ведь всё ещё должны быть здесь...)»"
10013005-191 = ""
10013005-197 = "Ай! Ещё одна бесчестная засада?!"
10013005-198 = ""
10013005-200 = ""
10013005-201 = ""
10013005-202 = "Пяти раз за день уже более чем достаточно! Оставьте нас в покое!"
10013005-203 = ""
10013005-207 = ""
10013005-208 = "Сюда!"
10013005-209 = "Прибыли на службу! ☆"
10013005-210 = "[s] «...Вы...?»"
10013005-212 = "Мы пришли расправиться с преступниками, стоящими за Охотой на курорты."
10013005-213 = "Отдел проведения фестивалей Академии Хяккияко! Я никогда не прощу вашей лжи и обмана!"
10013005-214 = "Ага. Пришло время правосудия."
10013005-215 = "Ага, ага! Праведное правосудие! ☆"
10013005-217 = "Вперёд на них!"
10013005-218 = "Не надо повторять дважды!"
10013005-220 = "...Ох, боже."
10013005-221 = "Э-Э-Эй! Что вы делаете?!"
10013005-222 = ""
10013005-227 = "[ns] «...Мне нечего сказать в своё оправдание.»"
10013005-229 = ""
10013005-230 = ""
10013005-231 = ""
10013005-232 = ""
10013005-233 = "Ч—"
10013005-234 = "Что, чёрт возьми, здесь происходит?!"
