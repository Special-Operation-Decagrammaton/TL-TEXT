[translation]
70010010-1 = "Конец механической коробки передач 1"
70010010-2 = "Павильон компьютерной инженерии выставки Миллениум"
70010010-3 = "Наконец-то начнём!"
70010010-4 = "От всей души приветствуем и благодарим наших гостей из офиса Красная Зима, участвующих в этом особом культурном обмене!"
70010010-5 = ""
70010010-7 = ""
70010010-8 = "Это я должна благодарить ВАС за столь любезное гостеприимство, достойное моей скромной персоны."
70010010-9 = "Почтенная президент академии Красная Зима, Украшательница земель, Президент, Великий лидер, Начальница санитарии, Капитан спортивного клуба, Глава всех префектов и Знаток столового питания!"
70010010-10 = "А что ещё важнее, недавно меня короновали Гурманом пудинга этого месяца и председательницей Академии наук Красная Зима!"
70010010-11 = "Для меня честь, что вы пригласили меня на эту вашу «выставку Миллениум», чтобы мы в Красная Зима смогли ещё сильнее развивать передовую науку и технологии!"
70010010-12 = "Рада познакомиться, президент Черина! Не буду больше заставлять вас ждать. Взгляните! Фирменный шедевр Миллениум, наше любимое дитя, объединение всех наших исследований — суперкомпьютер SEN 9000!"
70010010-13 = ""
70010010-15 = ""
70010010-17 = "И как это вообще компьютер? Монитора нет! Я даже печатать не могу!"
70010010-18 = "Потому что это не требуется! Я способна использовать передовые технологии визуализации и распознавания голоса как для ввода, так и для вывода."
70010010-19 = ""
70010010-22 = ""
70010010-24 = "Приветствую, почтенная президент академии Красная Зима, Украшательница земель, Президент, Великий лидер, Начальница санитарии, Капитан спортивного клуба, Глава всех префектов и Знаток столового питания."
70010010-25 = "А также Гурман пудинга этого месяца и председательница Академии наук Красная Зима — Черина! Добро пожаловать в Миллениум."
70010010-26 = "О-Она РАЗГОВАРИВАЕТ?! Со мной?!"
70010010-27 = "Что ещё важнее, она запомнила весь мой титул и даже не сбилась! Вы это слышали?"
70010010-28 = "(Она даже идеально повторила ошибку Черины, дважды сказав «президент»...)"
70010010-29 = "(Подумать только, я не единственная в мире, кто на такое способен...!)"
70010010-31 = "Ну вот. Я хотела устроить ей торжественное представление, а SEN 9000 сама взяла и ответила!"
70010010-32 = "Благодаря LLM, которую я лично разработала для SEN 9000, она понимает и отвечает более чем на 6000 языках — и всё это без клавиатуры!"
70010010-33 = "Давай немного похвастаемся, SEN. Расскажи о своих сильных сторонах."
70010010-34 = "Да. Я превосходно выполняю математические вычисления. Вы не найдёте программу, способную решать задачи с такой же скоростью и точностью, как я."
70010010-35 = "Вот именно! И мы можем это доказать. Что насчёт этой задачи?"
70010010-37 = "Это вообще математика? В этой формуле почти нет чисел..."
70010010-38 = "И она ещё и написана от руки. Ох, думаю, у меня с этим было бы немало трудностей."
70010010-40 = "..."
70010010-41 = "Хех. Она явно не знает ответа."
70010010-42 = "В конце концов, технологии никакой другой школы не способны сравниться с технологиями нашей престижной—"
70010010-43 = "Ой! Я всё это время была на беззвучном режиме?"
70010010-44 = "Ответ — 42. Ты осторожничаешь, потому что мы на демонстрации? Не нужно так мне поддаваться!"
70010010-45 = ""
70010010-47 = ""
70010010-48 = ""
70010010-50 = "Вот именно! Благодаря своей LLM она даже умеет вот так шутить!"
70010010-51 = "Но математика — далеко не всё! Это интерактивная презентация, так почему бы вам самой не задать SEN вопрос, президент Черина?"
70010010-52 = "М-Мне?!"
70010010-53 = "Сколько моих статуй находится на территории Красная Зима?"
70010010-54 = "На этот вопрос ты точно никак не можешь знать ответ!"
70010010-56 = "Всего 199 статуй, а в начале следующего месяца планируется открыть ещё одну."
70010010-57 = "Возможны расхождения, поскольку эти данные основаны на публичных социальных сетях, интернет-сообществе Red Bear и открытых пресс-релизах."
70010010-58 = "Забавный факт! По статистике, в течение следующей недели сломают как минимум десять статуй."
70010010-59 = "Я ответила на ваш вопрос?"
70010010-60 = "Она ответила без единой секунды колебаний."
70010010-61 = "И всё... правильно..."
70010010-63 = "У неё ещё множество талантов, а если посмотреть на следующее..."
70010010-64 = "Х-Хорошо..."
70010010-65 = ""
70010010-66 = ""
70010010-67 = ""
70010010-68 = ""
70010010-69 = ""
70010010-70 = ""
70010010-71 = ""
70010010-72 = "На этом сегодняшняя демонстрация окончена! Большое спасибо, что были с нами."
70010010-74 = "Ого, это было потрясающе! Она буквально умеет всё!"
70010010-75 = "Серьёзно. В технологиях Миллениум никто не превзойдёт."
70010010-77 = "Ещё раз спасибо за визит, Красная Зима!"
70010010-78 = "Угх..."
70010010-79 = ""
70010010-81 = ""
70010010-82 = ""
70010010-84 = "Меня это НЕ впечатляет!!"
70010010-85 = ""
70010010-88 = ""
70010010-90 = "Да, забавно, как ребёнок с новой игрушкой! Но вы правда думали, что у великой Красная Зима нет чего-то вроде... этого?"
70010010-91 = "Вот именно! У нас тоже есть суперкомпьютер! И он больше! И горячее!"
70010010-92 = "(Для компьютеров это вообще-то плохо, президент...)"
70010010-93 = ""
70010010-95 = ""
70010010-96 = "Красная Зима тоже проектирует суперкомпьютеры?"
70010010-97 = "Ого! Я никогда не видела Красная Зима на заседаниях Общества компьютерных исследований, так что понятия не имела!"
70010010-98 = "Ну... Эм, конечно, мы держали это в секрете! Потому что он такой огромный и мощный!"
70010010-99 = "Но раз Миллениум всё-таки хоть немного нас догнал, думаю, можно немного о нём рассказать."
70010010-100 = "Потрясающе! Я бы очень хотела посмотреть!"
70010010-101 = "Считайте это приглашением в Красная Зима — лично убедиться в нашей мощи! Конечно, если у вас будет время."
70010010-103 = "Тогда буду в понедельник!"
70010010-104 = "...ЧТО ты сейчас сказала?"
70010010-105 = "Ага, я как раз буду неподалёку! Идеально совпало."
70010010-106 = "Не терпится увидеть, что Красная Зима там прячет под капотом! И подумать только, я увижу это первой!"
70010010-107 = ""
70010010-109 = ""
70010010-110 = "О, э-э, да! Да, конечно! Разумеется! В следующий понедельник!"
70010010-111 = "Вы все увидите величие Красная Зима!"
70010010-112 = ""
70010010-113 = ""
70010010-114 = "Что мне делать?"
70010010-115 = "Она приедет на следующей неделе! А у нас нет суперкомпьютера!"
70010010-116 = "Президент Черина, может, организовать государственный переворот как раз к её визиту?"
70010010-117 = "Мы уже использовали это в прошлый раз... Потом слишком долго пришлось восстанавливать мою власть после возвращения на место. С меня хватит революций на этой неделе!"
70010010-118 = "Эм... Может, если хорошо поискать, где-нибудь найдётся? Или просто сделаем свой?"
70010010-119 = ""
70010010-122 = "Президент Черина, я вернулась с запрошенной технической оценкой от спецотряда №183."
70010010-123 = "Теоретические исследования завершены, и они подготовили проект суперкомпьютера, способного запускать готовое программное обеспечение."
70010010-124 = "Уже?! Отличная работа, Томоэ! Ты правда лучшая!"
70010010-125 = "Тогда за дело! Властью Секретариата мобилизовать все необходимые ресурсы и персонал Красная Зима!"
70010010-126 = "Разумеется, президент. Позвольте пройтись по смете. С учётом нынешнего инженерного уровня Красная Зима..."
70010010-127 = "Потребуется 160 миллиардов электронных ламп..."
70010010-128 = "...27 электростанций для выработки необходимой энергии..."
70010010-129 = "...и 3 новых города для размещения персонала, который будет заниматься обслуживанием. Кроме того—"
70010010-131 = "А?"
70010010-132 = "По расчётам, придётся сровнять с землёй около восьми гор, чтобы освободить достаточно места для проекта."
70010010-133 = "И-и..."
70010010-134 = "А если весь персонал перевести на 16-часовые смены без выходных..."
70010010-135 = "Предполагаемый срок завершения — примерно 6 веков."
70010010-136 = "..."
70010010-137 = "Желаете продолжить?"
70010010-139 = "Эта девчонка приедет на следующей неделе! НА! СЛЕДУЮЩЕЙ! НЕДЕЛЕ! Как мне впихнуть шесть веков работы до её приезда?!"
70010010-140 = ""
70010010-142 = ""
70010010-143 = "А-Апчхи!!"
70010010-144 = ""
70010010-145 = "(Как же тут напряжённо... Ух. Может, воды попить.)"
70010010-146 = ""
70010010-148 = ""
70010010-149 = "(Главного секретаря Томоэ загнали по полной. Главное, чтобы Комитету безопасности не пришлось—)"
70010010-150 = ""
70010010-152 = ""
70010010-153 = "(Кх! Не в то горло!)"
70010010-154 = "КХА-А-А!"
70010010-155 = ""
70010010-158 = ""
70010010-159 = "Ты сейчас... засмеялась, Марина? Надо мной?"
70010010-160 = "Ты подумала: «Так Черине и надо за её нелепое враньё»?"
70010010-162 = "Н-Нет! *кашляет* *давится* Т-Товарищ! Н-Ни в коем случае!"
70010010-163 = "Тогда... ты смеёшься, потому что у меня усы отклеились?"
70010010-164 = "Н-Нет, не поэтому! В-Воды—"
70010010-165 = "«О чём вы думаете?» — это ты хотела сказать...? Намекаешь, что моего лидерства недостаточно, чтобы создать этот суперкомпьютер? Что моей власти недостаточно?"
70010010-167 = "(Т-Так я точно попаду под чистку!!)"
70010010-168 = "Во...ды... О чём... вы..."
70010010-169 = ""
70010010-171 = ""
70010010-172 = "...планируете? Да, именно это я и хотела спросить! Видите ли, я проявила инициативу и заранее попросила Комитет безопасности начать работу! Чтобы мы были готовы помочь с чем угодно!"
70010010-173 = "Правда? Ты серьёзно?!"
70010010-174 = "Конечно! Я, Марина, возьму ответственность на себя и прослежу, чтобы всё было готово к следующей неделе!"
70010010-175 = "Марина."
70010010-176 = "Д-Да, товарищ?"
70010010-177 = ""
70010010-179 = ""
70010010-181 = "Я правда благодарна, что ты рядом со мной."
70010010-182 = "Спасибо тебе за службу Красная Зима и лично мне."
70010010-183 = "Тогда я доверюсь тебе. Когда всё будет готово, ты удостоишься чести получить медаль Трудовых Усов первого класса..."
70010010-184 = "Нет-нет. Для такого даже медали Трудовых Усов первого класса недостаточно."
70010010-185 = "Я награжу тебя медалью Героя Федеральной академии Красная Зима!"
70010010-186 = "Я выполню задачу, Великий лидер!"
70010010-187 = ""
70010010-189 = ""
70010010-190 = ""
70010010-191 = ""
70010010-192 = "...Что мне теперь делать?"
70010010-193 = "Мы должны построить суперкомпьютер к следующей неделе...?"
70010010-194 = ""
70010010-196 = ""
70010010-197 = ""
70010010-198 = "И что она от нас вообще хочет?"
70010010-199 = "Диктаторы ведь думают, что могут требовать от рабочего класса всё что угодно и когда угодно, да?"
70010010-200 = "Ха-ха-ха! Звучит как СПЛОШНАЯ БОЛЬ! Хорошо, что это не моя проблема."
70010010-201 = "Не возражаешь, если я использую это как комедийный эпизод в следующей истории? Гарантирую, будет хит!"
70010010-202 = "Давайте сначала разберёмся с текущими дедлайнами, а потом уже думать о твоей следующей работе... Ты и так по уши в проблемах."
70010010-203 = "Нгх..."
70010010-204 = ""
70010010-206 = ""
70010010-207 = "Хе-хе-хе. Товарищ Марина, не ответишь на пару вопросов? Что ты чувствуешь, зная, что стоишь на пороге полного и публичного унижения?"
70010010-208 = "«Председатель Комитета безопасности: вода или чистка?» Станешь моделью для обложки следующего выпуска «Красного Медведя»!"
70010010-209 = "Меня поражает чистая идиотия этой задумки. Даже если считать её документальной, литературной ценности в ней ВСЁ РАВНО нет."
70010010-210 = "Два из десяти."
70010010-212 = "Ты теперь нас оцениваешь?"
70010010-213 = "Да. Похоже, жёсткая критика не способна пробиться сквозь ваши толстые черепа, поэтому со вчерашнего дня я применяю новый метод."
70010010-214 = "Например, твоя рукопись? Ноль из десяти, Мэрури. Хотя бы имей совесть её закончить."
70010010-215 = "Мне больше нравилось, когда мы обсуждали человека, который попал в гораздо более интересную и куда более глубокую задницу, чем я. Давайте вернёмся к ней."
70010010-217 = "Смейтесь сколько хотите. Важно только одно — поможете вы мне или нет."
70010010-218 = "Отрицательно. Я не намерена пожимать руку буржуазии."
70010010-219 = "Назови хоть одну причину, почему кто-то из нас должен помогать ТЕБЕ."
70010010-220 = "Вообще-то есть одна... Очень веская..."
70010010-221 = "Я немного запаниковала, когда президент спросила, кто мне помогает."
70010010-222 = "И первые имена, которые пришли в голову... были ваши..."
70010010-223 = "Так что теперь она считает, будто мы все работаем вместе."
70010010-224 = ""
70010010-226 = ""
70010010-228 = ""
70010010-230 = "ЧТО ТЫ СКАЗАЛА?!?!"
70010010-231 = "Один из десяти! Ты совсем с ума сошла?!"
70010010-232 = "Как ты могла втянуть нас в свою проблему?! О чём ты думала?"
70010010-233 = "Ух... Нам конец... Нас всех почистят."
70010010-235 = "Ты назвала ей наши имена? Значит, мало того что угнетаешь народ, так ещё и перекладываешь последствия своих поступков на невиновных?"
70010010-236 = "Вот же чёрт. Ты сделала нас невольными сообщниками, чтобы снять удар с себя. Скажи, чем мы заслужили твою вражду?"
70010010-238 = "Н-Нет, всё не так! Я просто... не знала, что делать! Сказала первое, что пришло в голову! Это не какой-то злой план, который я вынашивала."
70010010-239 = "Мы столько раз пересекались... Наверное, я просто считала вас всех... друзьями..."
70010010-241 = "Друзьями...?"
70010010-242 = "А?"
70010010-244 = "З-Забудьте. В любом случае, мне правда жаль, что втянула вас."
70010010-245 = "Если вы ничем не можете помочь, я скажу президенту правду. Обещаю, с вами ничего не случится."
70010010-246 = "Мне не следовало в одностороннем порядке решать, что мы друзья. Простите."
70010010-247 = ""
70010010-249 = ""
70010010-250 = "Девять из десяти..."
70010010-251 = "ЧТО? То есть девятки ты всё-таки ставишь! А моя манга?"
70010010-252 = "Мэрури, тебе ещё очень, очень, очень, ОЧЕНЬ далеко до историй, способных хотя бы приблизиться к трогательным рассказам о человеческом опыте."
70010010-253 = "Ты считала нас друзьями и потому решила положиться на нас. Даже у меня сердце не каменное."
70010010-255 = "Ты считала нас друзьями... Не может быть, чтобы наша председательница Комитета безопасности была настолько милой."
70010010-256 = "Вот это неожиданный поворот в новостном цикле... Марина хочет быть... друзьями. Хе-хе-хе."
70010010-258 = "Теперь я понимаю. Я и правда была самонадеянной."
70010010-260 = "Н-Не в этом дело! Мы не говорим, что мы не друзья!"
70010010-261 = "Просто... эта задача полностью за пределами даже наших возможностей! П-Правда же, все?"
70010010-262 = "Верно. Если даже всем жителям Красная Зима понадобилось бы 600 лет, то впятером..."
70010010-263 = "Вообще-то вчетвером. Мэру так отстаёт, что ей даже за едой приходится работать."
70010010-264 = "Я же сказала! Я почти закончила!"
70010010-266 = "Икэкура Марина, офицер Красная Зима и председатель Комитета безопасности."
70010010-267 = "Марионетка угнетателей и их правая рука считает нас друзьями. Хм."
70010010-268 = ""
70010010-270 = ""
70010010-271 = ""
70010010-273 = "Добро пожаловать на борт, Марина! Поздравляю, теперь ты наша товарищ!"
70010010-274 = "Т-Товарищ?!"
70010010-276 = "Минори?!"
70010010-277 = "О-хо. Вот это поворот!"
70010010-278 = "Разве ты не слышала? Бесплатных обедов не бывает."
70010010-279 = "Президент, этот обед как раз БЕСПЛАТНЫЙ. Мы пользуемся тем, что кухня бастует."
70010010-280 = "Слова верные, вывод неверный. Кто-то всё равно заплатил за еду, чтобы она здесь оказалась и мы могли её украсть, значит, она всё равно не БЕСПЛАТНАЯ."
70010010-282 = "Марина! Испугавшись тиранического угнетения, ты пробудилась к нашему общему классовому сознанию!"
70010010-283 = "Ты наконец открыла глаза! Присоединяйся к нам на передовой борьбы против угнетения! Освободим товарищей!"
70010010-284 = "Спасибо за энтузиазм, но я всё ещё не вижу решения."
70010010-285 = "Даже если забыть о материалах, с полным составом Рабочей партии это всё равно невозможно."
70010010-286 = "Если честно, спланировать революцию выглядит реалистичнее и экономичнее..."
70010010-287 = "А что именно президент вообще хочет? Всё, что мы смогли понять: «сложная машина»."
70010010-288 = "Она увидела её на выставке Миллениум."
70010010-289 = "Компьютер в форме огромного ящика, который отвечает на любой заданный вопрос."
70010010-291 = "Компьютер, который отвечает на вопросы?"
70010010-292 = "Если подумать, это же слишком просто, разве нет?"
70010010-293 = ""
70010010-295 = ""
70010010-297 = "...ПРОСТО?!"
70010010-299 = "[log]До визита Отдела исследований вычислительной науки Миллениум: 1 день.[/log]"
70010010-301 = "Товарищ Марина. День почти настал. Завтра к нам приедет Отдел исследований вычислительной науки Миллениум."
70010010-302 = "После всей твоей бравады и громких слов ты ведь не пришла сегодня сказать, что в итоге ничего не получилось, верно?"
70010010-303 = "Вовсе нет, президент!"
70010010-304 = "Наоборот, всё идёт точно по графику. Я пришла сегодня продемонстрировать нашу работу!"
70010010-305 = "Товарищи, заносите суперкомпьютер, созданный лучшими технологиями Красная Зима!"
70010010-306 = ""
70010010-308 = ""
70010010-309 = ""
70010010-311 = "Вот он! Благодаря выдающемуся лидерству Великого лидера Черины мы разработали передовой суперкомпьютер..."
70010010-312 = "RFC Девять-тысяч-и-один!"
70010010-314 = "RFC... Что?"
70010010-315 = "Сокращение от Red (Winter) Federal Computer. И он полностью превзошёл Миллениум 9000! Поэтому и «плюс один»."
70010010-316 = "Марина! Я знала, что у тебя получится!"
70010010-317 = ""
70010010-319 = ""
70010010-323 = "Ты САМАЯ ЛУЧШАЯ!!"
70010010-324 = "(О боже...! Искренний комплимент от самой Черины... Сколько же времени прошло с последнего?)"
70010010-325 = "К-Кхм. Из-за некоторых мер безопасности вопрос нужно написать на бумаге и вставить сюда."
70010010-327 = "Значит, эта штука должна уметь отвечать на любой мой вопрос, да?"
70010010-328 = "Посмотрим... «Кто лидер Красная Зима?»"
70010010-329 = ""
