70010010-338 = ""
70010010-341 = ""
70010010-342 = "Вот ответ! Дай сюда, дай!"
70010010-343 = "«Ответ: почтенная президент академии Красная Зима, Украшательница земель, Великий лидер, Начальница санитарии, Капитан спортивного клуба, Глава всех префектов и Знаток столового питания»."
70010010-344 = "«А также лучший гурман пудинга этого месяца и председатель Академии наук Красная Зима — Черина»."
70010010-345 = "П-Потрясающе! Она знает весь мой титул, хотя сама компьютер!"
70010010-347 = "Разумеется, президент! И это только начало!"
