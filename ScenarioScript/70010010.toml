70010010-354 = "Ого, ты выучила всё целиком?"
70010010-355 = "Писать весь этот титул каждый раз стало настолько невыносимо, что в издательском отделе нам сделали специальную печатную форму."
70010010-356 = "То есть вы просто копипастите?"
70010010-358 = "Знай врага и знай себя — и победишь в каждой битве. Конечно революционер должен знать титул, на который претендует угнетатель!"
70010010-359 = "Тсс! Она нас услышит!"
70010010-360 = "Не бойтесь! Это специальная звукоизолированная коробка от спецотряда №183. Здесь нас никто не обнаружит."
70010010-361 = "За происходящим снаружи можно следить через микрофон «компьютера» и глазок в передней двери."
70010010-362 = "Мне от этого не легче! Если нас поймают, она, наверное, заставит нас жить тут до выпуска."
