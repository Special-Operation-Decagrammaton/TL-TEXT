70010010-371 = "Когда на наших глазах разворачивается трагедия, у нас есть моральный долг вмешаться, разве нет?"
70010010-372 = "Но если бы я заранее знала про этот жалкий план на два из десяти, никогда бы не согласилась!"
70010010-374 = "Разве настоящее сострадание не проявляется именно в такие моменты?"
70010010-375 = "Кто-нибудь что-нибудь слышит? К сожалению, я не способна разобрать слова авторов, которые просрочили дедлайн, но всё равно полезли в эту коробку ради «нового материала»."
70010010-376 = "Ух...! Дедлайн — это всего один спринт, но нужно ещё думать о подготовке к марафону!"
