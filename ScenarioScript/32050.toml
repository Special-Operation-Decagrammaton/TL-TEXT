[translation]
32050-1 = "Эпизод 5;Полуночный переполох, часть 1"
32050-2 = "Хи-хи-хи. ♥"
32050-3 = "Ну... вот мы и пришли."
32050-4 = "Видите? Разве не весело? Ничто не сравнится с запретным удовольствием от нарушения правил и восторгом от того, что делаешь это вместе."
32050-5 = "Вот как выглядит район в такое время. Он гораздо оживлённее, чем я ожидала."
32050-6 = "Верно. Многие магазины работают круглосуточно."
32050-7 = "Та пекарня ещё открыта? И кафе вон там тоже..."
32050-8 = "Чуть дальше есть полностью автоматизированный магазин товаров «Друзей Момо». А через дорогу — комиссионный магазин только с коллекционными товарами ограниченного выпуска."
32050-9 = "Вот как. Ты отлично знаешь окрестности."
32050-10 = "А-Ахаха..."
32050-11 = ""
32050-13 = ""
32050-14 = "Эх. Зачем я пошла с вами? Если Хасуми меня поймает, мне конец."
32050-15 = "Правда? Наверное, она очень строга с младшими. Я всегда думал, что она добрая."
32050-16 = "П-потому что так и есть! Хасуми добрая, умная, сильная и держится с достоинством и грацией!"
32050-17 = "Её гнев... столь же непревзойдён, как и остальные качества."
32050-18 = "[s] «Она редко злится, но уж если разозлится... Верно?»"
32050-19 = "Да. Однажды было такое..."
32050-21 = "Клубная комната JTF"
32050-26 = "..."
32050-27 = "..."
32050-28 = "В-Вице-президент Хасуми, пожалуйста, успокойтесь..."
32050-29 = ""
32050-31 = ""
32050-32 = "Как они смеют?! Общество Пандемониума! Геенна! Думают, им это сойдёт с рук?!"
32050-33 = "А-а-а-а-а!"
32050-34 = ""
32050-35 = "Боже. Что же так её расстроило?"
32050-36 = "Она возвращалась со встречи с руководством Геенны по поводу Эдемского договора, когда вдруг..."
32050-37 = ""
32050-38 = "*тяжело дышит* *тяжело дышит*..."
32050-39 = "Слушайте внимательно."
32050-40 = "Это ещё не конец..."
32050-41 = "С этого момента я сажусь на диету!"
32050-43 = "...?!"
32050-44 = "...?!"
32050-45 = "Ты сказала... диета?"
32050-47 = "Да, диета! Я похудею!"
32050-48 = "Отныне, если увидите, что я ем больше двух раз в день или перекусываю, смело выбивайте еду из рук и отчитывайте меня!"
32050-49 = "В одиночку соблюдать диету трудно, поэтому я разрешаю вам следить за мной. Мне нужна ваша помощь!"
32050-50 = "Ч-что именно произошло на встрече с Геенной...?"
32050-51 = "..."
32050-52 = "Непростительно... Она перешла все границы!"
32050-54 = ""
32050-55 = "Так ты и есть тайное оружие Тринити, Кэнзаки Цуруги."
32050-56 = "Прошу прощения? Нет, я..."
32050-57 = "Ты гораздо женственнее, чем я ожидала. Даже оскорбительно женственна."
32050-58 = "Хе-хе! Значит, так Тринити хочет играть? Пытается сломить наш дух в начале первой встречи?! Как мелочно!"
32050-59 = "А?"
32050-60 = "Ироха! Приведи Сацуки. Я не позволю Тринити смотреть на нас свысока!"
32050-62 = "Макото, это не президент Цуруги, а вице-президент Хасуми. Я сообщила о её прибытии в переданных документах."
32050-63 = "А если речь о её груди, не понимаю, чем поможет Сацуки."
32050-64 = ""
32050-66 = ""
32050-67 = "Ч-ЧТО?! Они прислали замену?! Как оскорбительно! Они издеваются?!"
32050-68 = "Нас провели! Встреча — лишь уловка! Они хотят деморализовать нас высоким ростом и большой грудью?!"
32050-69 = "Нет, поэтому я и пыталась предупредить, что мы ждём Хасуми. Ты вообще меня слушаешь? Нет, верно?"
32050-70 = "Как ты СМЕЕШЬ меня недооценивать! Думаешь запугать меня своей неприлично большой грудью?!"
32050-71 = "Пожалуйста, успокойтесь. И перестаньте упоминать её грудь. Вы позорите Общество Пандемониума."
32050-72 = "Я не сдамся этой великанше, Ироха. Приготовь сама-знаешь-что!"
32050-73 = ""
32050-76 = ""
32050-77 = "Великанша...?"
32050-78 = ""
32050-80 = ""
32050-81 = "Не знаю, о чём вы, но встреча явно провалена. Советую обеспечить путь отхода."
32050-82 = "А?"
32050-83 = ""
32050-85 = ""
32050-86 = "А-А-А-А-А-А!!!"
32050-87 = ""
32050-94 = "..."
32050-95 = "..."
32050-96 = "[s] «...»"
32050-97 = "Я слышала, после той провальной встречи Хасуми плохо ест."
32050-98 = "Неудивительно, что она держит обиду на Геенну."
32050-99 = "[s] «Теперь я тоже за неё волнуюсь.»"
32050-100 = "Но Хасуми сильная! Несмотря на всё пережитое, она соблюдает данный обет."
32050-101 = "Уверена, с ней всё будет хорошо."
32050-102 = ""
32050-104 = ""
32050-105 = "Смотрите. Здесь ещё одна пекарня."
32050-106 = "После этой истории мне захотелось сладкого. Может, заглянем?"
32050-107 = "О, их особые парфе потрясающие! Я не знала, что они работают круглосуточно..."
32050-108 = "Парфе? Звучит идеально. Идём."
32050-109 = ""
32050-112 = ""
32050-114 = "П-почему такая спешка?!"
32050-115 = "Эм... Надеюсь, меня здесь никто не увидит."
32050-116 = ""
32050-118 = ""
32050-119 = ""
32050-120 = ""
32050-122 = "Добро пожаловать."
32050-123 = "Ух ты, мы действительно едим десерт посреди ночи. Как волнительно!"
32050-124 = "Хм-м."
32050-125 = "Столик на пятерых? Что будете заказывать?"
32050-126 = "Эм... у вас ещё осталось особое парфе?"
32050-127 = "Простите. Оно есть, но последние три порции сегодня купил предыдущий посетитель."
32050-128 = "О, как жаль..."
32050-129 = "Нас опередили. Не ожидала такой конкуренции в этот час. Как наивно."
32050-130 = "О?"
32050-131 = "С-Сенсей?"
32050-132 = "[s] «Хасуми?!»"
32050-133 = "Х-Хасуми?!"
32050-134 = "Это случайно не парфе у тебя в руках?"
32050-136 = "Хасуми и правда держала три особых парфе."
32050-138 = "Не ожидала встретить здесь Клуб дополнительных занятий и Сенсея."
32050-139 = "Ой-ой..."
32050-140 = "Какая встреча, Хасуми. Ещё удивительнее видеть, как ты ешь три парфе. Разве ты не на диете?"
32050-141 = "Д-да. Насчёт этого..."
32050-142 = "Дай угадаю. Ты не смогла подавить желание и пришла сюда за любимыми десертами."
32050-143 = "Н-нет! Я-я хотела сказать..."
32050-144 = "Ты уступила восхитительному желанию, а когда опомнилась, было поздно. Назад пути не было."
32050-145 = "[s] «Не могу тебя винить.»"
32050-146 = "Сенсей. Насколько я знаю, Клубу дополнительных занятий нельзя покидать территорию школы во время лагеря."
32050-147 = ""
32050-149 = ""
32050-150 = "Если сохранишь мой секрет, я сохраню ваш."
32050-151 = "Х-Хасуми..."
32050-152 = "Как продвигается учёба, Кохару?"
32050-153 = "Ну, эм..."
32050-154 = "[s] «Её оценки продолжают расти.»"
32050-156 = "Верно! Такими темпами Кохару скоро сдаст экзамен."
32050-158 = "Вот как?"
32050-159 = "Эм..."
32050-160 = "Рада это слышать. Я же говорила, что у тебя получится."
32050-161 = "Разве ты не помнишь?"
32050-163 = "Продолжай усердно учиться, Кохару."
32050-164 = "И не забывай о своей цели."
32050-165 = "Но я не думаю, что справлюсь..."
32050-166 = "Как мне всё это вызубрить и подтянуть оценки? Я не гожусь для этой миссии..."
32050-167 = "Другого выбора нет! Это нужно сделать!"
32050-168 = ""
32050-170 = ""
32050-171 = "Прости, что повысила голос, но остаться с нами ты сможешь, только если сдашь экзамены."
32050-172 = "Если не ради меня, то сделай это ради Сенсея и всех, кто столько сил вложил в помощь нам. Хорошо?"
32050-173 = "Ладно. Я постараюсь."
32050-175 = "Хи-хи. Не хочу тебя подводить, Хасуми."
32050-176 = "А я всегда за тебя болею. Жду не дождусь, когда ты вернёшься в Отряд правосудия и снова будешь участвовать в наших заданиях."
32050-177 = "Обещаю!"
32050-178 = "[s] «Какая чистая душа.»"
32050-179 = "*пип* *пип* *пип* *пип* *пип*"
32050-180 = "Зашифрованное сообщение? В такой час?"
32050-181 = "Да, Ичика? Что случилось?"
32050-182 = "У нас проблемы, Хасуми. Ты где?"
32050-183 = "Проблемы? Объясни, пожалуйста."
32050-184 = "Предположительно, студенты из Геенны проникли на территорию академии. Они открыли огонь и нападают на объекты Тринити."
32050-185 = "Это Префектурная команда Геенны? Значит, они наконец раскрыли карты. Мерзавки из Общества Пандемониума!"
32050-186 = "Ну, дело в том..."
32050-187 = "Наверняка хотят помешать заключению Эдемского договора! Каковы их силы? Сколько отрядов и какие объекты они атаковали?!"
32050-188 = "Успокойся. Во-первых, это не Префектурная команда, и отрядов там вообще нет. Их всего четверо."
32050-189 = "Всего четверо?.. И это не Префектурная команда?"
32050-190 = "Да. Подтверждено, что нападению подвергся... местный аквариум."
32050-191 = "Зачем им нападать на него?"
32050-192 = "Они украли выставленную там редкую рыбу — золотого магуро — и теперь скрываются."
32050-193 = "Золотого магуро?"
32050-194 = "Говорят, рыба очень дорогая. Возможно, они хотят её продать. Мы только что установили, к какой организации они принадлежат."
32050-195 = "Общество гурманов — террористическая группировка из Геенны."
32050-197 = ""
32050-198 = "Их главарь — Куродатэ Харуна, в Геенне её считают крайне опасной! Скорее отдайте приказ, вице-президент!"
32050-200 = "Эй! Какого чёрта мы решили ограбить именно это место?! Мы же посреди района Тринити!"
32050-201 = "А какой у нас был выбор? Мы должны были заполучить золотого магуро любой ценой! ★"
32050-202 = "Как они могли держать легендарного тунца взаперти, чтобы им любовались только через стекло аквариума? Где их уважение к высокой кухне?"
32050-203 = "Изысканная еда — нечто куда более благородное и доступное каждому."
32050-204 = "Золотой магуро не захотел бы торчать на выставке лишь затем, чтобы богачи становились ещё богаче."
32050-205 = "Мы просто делаем то, что должно! Правда, Фуука?"
32050-206 = "М-м-м! М-м-м-м!"
32050-207 = "Видите? Президент Клуба школьных обедов так горячо меня поддерживает, что даже прослезилась."
32050-208 = "По-моему, дело скорее в кляпе у неё во рту. ★"
32050-209 = "Ай! Тунец всё бьётся! Он колотит меня плавниками!"
32050-210 = "Только не вздумай его уронить, Изуми! Он бесценен!"
32050-211 = "Может, уже съедим его?! Его и так трудно держать, а тут за нами ещё гонятся девчонки в чёрной матросской форме!"
32050-212 = "Это Отряд правосудия Тринити! Они ничуть не менее страшные, чем Префектурная команда. Как мы отсюда выберемся, Харуна?"
32050-213 = "Неважно, удастся нам сбежать или нет."
32050-214 = "Важно лишь, кому достанется последний кусочек!"
32050-215 = "Девиз нашего клуба: «Ешь или умри!» Таков благородный путь, который должен принять каждый гурман!"
32050-216 = "И только это имеет значение! ★"
32050-217 = ""
32050-220 = "Пока что мы куда ближе к смерти, чем к обеду, так что шевелитесь!"
32050-221 = "Прорвёмся через окружение и отступим! А потом наша дорогая Фуука приготовит нам своё знаменитое сашими!"
32050-222 = "М-м-м! М-м-м-м!"
32050-224 = "Следующий Эпизод;Полуночный переполох, часть 2"
