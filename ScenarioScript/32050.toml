[translation]
32050-1 = "Episódio 5;Grande Confusão à Meia-Noite (1)"
32050-2 = "Ufufu...♡"
32050-3 = "Ahaha... A-Acabamos vindo mesmo, né."
32050-4 = "E então? Já não está sendo divertido? Essa sensação de pecado por fazermos algo proibido, somada à segurança de estarmos fazendo isso todas juntas... a combinação dessas duas coisas é...!"
32050-5 = "Entendo, então a cidade de madrugada é assim... É mais movimentada do que eu pensava."
32050-6 = "Pois é, também tem muitas lojas que funcionam 24 horas."
32050-7 = "Aquela ali é uma doceria? Tem lugares que ficam abertos 24 horas...? Ah, a cafeteria também está aberta."
32050-8 = "Se seguirmos um pouquinho mais adiante, também tem uma loja de produtos dos Momo Friends. E bem em frente a ela, tem uma lojinha escondida que só vende itens de edição limitada..."
32050-9 = "Fufu, como esperado da Hifumi-chan, conhece tudo nos mínimos detalhes."
32050-10 = "A-Ahahaha..."
32050-14 = "Uuu... No fim acabei vindo na onda, mas se por acaso a Hasumi-senpai me vir num lugar desses, ela vai ficar uma fera comigo..."
32050-15 = "Ora, é mesmo? Eu tinha ouvido falar que a Hasumi-san era muito gentil com as veteranas e calouras..."
32050-16 = "C-Claro que ela é gentil! Além disso, ela é excelente nos estudos e no combate, tem talento e beleza...? E muita elegância, é uma veterana incrível!"
32050-17 = "M-Mas quando ela fica brava, dá muito medo de verdade..."
32050-18 = "[s] \"Por falar nisso, você mencionou antes que quando a Hasumi fica brava de verdade é assustador...\""
32050-19 = "U-Uhum... Aconteceu uma vez antes, e eu estava lá na hora..."
32050-21 = "Sala do Comitê de Justiça"
32050-26 = "..."
32050-27 = "..."
32050-28 = "Ha-Hasumi-senpai, por favor, acalme-se—"
32050-32 = "Eu jamais, jamais vou perdoar!! A Pandemonium Society!! A Gehenna!! Como, como puderam chegar àquele ponto...?!!"
32050-33 = "Hii...!"
32050-35 = "Ora... Isso parece bem intenso. O que foi que aconteceu...?"
32050-36 = "Foi durante uma reunião com a liderança da Gehenna sobre o Tratado do Éden..."
32050-38 = "Arf, arf..."
32050-39 = "...Ouçam, ouçam muito bem. Eu declaro aqui e agora."
32050-40 = "A partir de hoje, eu... eu...!"
32050-41 = "Desta vez eu vou mesmo fazer dieta!!"
32050-43 = "...!?"
32050-44 = "...!?"
32050-45 = "D-Dieta...?"
32050-47 = "Sim, dieta!"
32050-48 = "A partir de agora, se me flagrarem fazendo mais de duas refeições por dia ou colocando qualquer doce na boca, por favor, apontem na mesma hora e me dêem uma bronca!"
32050-49 = "Ouvi dizer que como esse tipo de coisa é difícil de conseguir só com a própria força de vontade, o melhor é declarar em voz alta! Eu preciso da ajuda de todas vocês!"
32050-50 = "Ha-Hasumi-senpai... O que exatamente aconteceu na reunião com a Gehenna...?"
32050-51 = "..."
32050-52 = "Imperdoável...! Como, como puderam dizer aquilo...!"
32050-55 = "...Entendo, então você é Kenzaki Tsurugi, a chamada \"Arma Estratégica da Trinity\"."
32050-56 = "...Hã? Ah, não, eu sou—"
32050-57 = "Compreendo, é ainda mais fora dos padrões do que eu imaginava. A ponto de ser desagradável."
32050-58 = "Kiki! Mas esse tipo de estratégia não funciona contra a grande Makoto-sama! É muita ingenuidade achar que vão nos vencer com um impacto logo de cara!"
32050-59 = "...Como?"
32050-60 = "Iroha, traga a Satsuki aqui! Vamos mostrar que não perdemos em nada para esse pessoal da Trinity!!"
32050-62 = "Makoto-senpai, esta não é a presidente Tsurugi-san, e sim a vice-presidente Hasumi-san. Tenho certeza de que isso constava nos documentos enviados com antecedência."
32050-63 = "Além disso, se estiver falando do tamanho do busto agora, acho que mesmo se a Satsuki-senpai vier, provavelmente não vai conseguir vencer."
32050-67 = "O-O quêêê?! Não é a Tsurugi?! Entendo, uma substituta, é...? Estão mesmo nos subestimando, recorrendo a truques baratos a essa altura do campeonato...!"
32050-68 = "Hah! Quer dizer então que esta reunião inteira é uma farsa desde o princípio?! Nos chamar até aqui só para tentar nos intimidar logo de início com a pressão dessa altura e desse busto...!"
32050-69 = "Não, como eu acabei de dizer, ela sempre foi a Hasumi-san. Você está me ouvindo? Não está ouvindo nada, né?"
32050-70 = "Grr, exibindo esses peitos grandes a ponto de ser desagradável...! Está querendo comprar briga comigo, a grande Makoto-sama da Pandemonium Society?!"
32050-71 = "Por favor, acalme-se, e pare de falar sobre o busto dela. Já está ficando constrangedor para nós como Pandemonium Society."
32050-72 = "Iroha, já que chegou a esse ponto, prepare aquilo! Como se eu fosse aceitar perder para essa mulher gigante!"
32050-77 = "Mulher gigante...?"
32050-81 = "Mesmo você dizendo \"aquilo\", não faço a menor ideia do que esteja falando, mas pelo menos já entendi muito bem que esta reunião foi por água abaixo. Vamos logo fugir daqui."
32050-82 = "...Hum?"
32050-86 = "Aah... Aaaaaaaaaaaah!!"
32050-94 = "..."
32050-95 = "..."
32050-96 = "[s] \"...\""
32050-97 = "E aí a reunião em si acabou dando errado... Desde então, a Hasumi-senpai quase não tem comido direito, então estou preocupada..."
32050-98 = "Então foi isso que aconteceu... Dá para entender por que ela está tão furiosa com o pessoal da Gehenna, com toda a razão..."
32050-99 = "[s] \"Será que a Hasumi está bem...?\""
32050-100 = "Mas a Hasumi-senpai é forte em vários sentidos, então ela vai ficar bem!"
32050-101 = "Desde aquele dia, ela tem se esforçado firme para cumprir a promessa que fez a si mesma...!"
32050-105 = "Ah, aqui também tem uma doceria."
32050-106 = "Falar de comida acabou me dando uma certa fome... Que tal comermos alguma coisa aqui?"
32050-107 = "Ah, o parfait de edição limitada daqui é super delicioso! Eu não sabia que eles funcionavam 24 horas."
32050-108 = "Parfait, é...? Uhum, nada mal. Vamos."
32050-114 = "H-Hã...?!"
32050-115 = "Uuu... N-Ninguém está vendo, né...?"
32050-122 = "Sejam bem-vindos."
32050-123 = "Ahaha, ir a uma doceria no meio da madrugada... Dá um certo nervosismo, mas também é super empolgante, né?"
32050-124 = "De fato."
32050-125 = "Mesa para cinco pessoas? Podem fazer o pedido."
32050-126 = "Hã... Ah, vocês ainda têm o parfait de edição limitada?"
32050-127 = "Ah, sinto muitíssimo... Os últimos três parfaits de edição limitada acabaram de ser pedidos por outra cliente há pouquinho tempo..."
32050-128 = "Ah, entendo..."
32050-129 = "Chegamos um passo atrasados... Ser tão disputado até uma hora dessas, não dá mesmo para subestimar."
32050-130 = "...Ora?"
32050-131 = "Se-Sensei...?"
32050-132 = "[s] \"Hasumi...!?\""
32050-133 = "Ha-Hasumi-senpai?!"
32050-134 = "Ora, aqueles são os parfaits de edição limitada? Parece que tem um monte..."
32050-136 = "(Diante de nós estava Hasumi, com três parfaits à sua frente, comendo com gosto.)"
32050-138 = "Sensei, e pessoal do Clube de Aulas de Reforço..."
32050-139 = "A-Aaaaaah...!"
32050-140 = "Hasumi-san, que coincidência♡ Ora, três parfaits inteiros no meio da madrugada... Se não me engano, ouvi dizer que você estava de dieta, não estava?"
32050-141 = "I-Isso aqui é que, bem..."
32050-142 = "Sim, eu compreendo perfeitamente o que se passa em seu coração. Guiada pelos desejos perversos que a atacaram na calada da noite, você acabou vindo parar até aqui, não foi?"
32050-143 = "Hã...?! N-Não, é que..."
32050-144 = "E depois de se entregar completamente aos seus desejos e fazer uma bagunça, quando finalmente recobrou a razão, já estava tão descontrolada que não havia mais volta..."
32050-145 = "[s] \"Dá mesmo uma fome no meio da noite, né.\""
32050-146 = "Se-Sensei... Cof, cof. Bem, deixando a minha situação de lado por um instante, as alunas do Clube de Aulas de Reforço não estavam proibidas de sair durante o acampamento de estudos...?"
32050-150 = "...Que tal fingirmos mutuamente que ninguém viu nada aqui?"
32050-151 = "Ha-Hasumi-senpai..."
32050-152 = "Koharu, você está se esforçando nos estudos?"
32050-153 = "Ah, hã, sobre isso, bem..."
32050-154 = "[s] \"As notas da Koharu subiram muito ultimamente, viu.\""
32050-156 = "S-Sim, é verdade...! A Koharu-chan está se esforçando tanto que, se continuar nesse ritmo, vai conseguir passar com certeza...!"
32050-158 = "Entendo, fico feliz em saber."
32050-159 = "Uuu... Bem, hã..."
32050-160 = "Isso é excelente. Eu não disse que você consegue quando tenta, Koharu?"
32050-161 = "Assim como eu lhe disse naquela ocasião..."
32050-163 = "Estou torcendo por você, Koharu. Por favor, dê o seu melhor nos estudos."
32050-164 = "Não se esqueça do seu verdadeiro objetivo; não estou falando apenas dos estudos que estão diante de você agora."
32050-165 = "Mas isso... Para mim, é impossível..."
32050-166 = "Melhorar minhas notas tão rápido assim... É verdade que eu quero ficar junto com você, senpai, mas isso é difícil demais para mim..."
32050-167 = "Não pode pensar assim!"
32050-171 = "Desculpe por levantar a voz de repente... Mas, Koharu, para que possamos continuar sempre juntas daqui para frente, você precisa se esforçar agora."
32050-172 = "Além disso, o Sensei com certeza vai ajudá-la. Pelo bem do Sensei também, dedicar-se aos estudos é o que você deve fazer agora, Koharu."
32050-173 = "...Sim. Eu vou dar o meu melhor."
32050-175 = "...Ehehe. É-É que eu não quero decepcionar as expectativas da Hasumi-senpai."
32050-176 = "Sim. Continuo torcendo por você, Koharu. Estou aguardando ansiosamente pelo dia em que você voltará logo para o Comitê de Justiça e poderemos cumprir missões juntas novamente."
32050-177 = "Sim, vou dar o meu melhor...!"
32050-178 = "[s] \"Que conversa bonita...\""
32050-179 = "(Bzzzz...)"
32050-180 = "...? Uma ligação... a esta hora?"
32050-181 = "Alô... Ichika? Aconteceu alguma coisa?"
32050-182 = "Hasumi-senpai, surgiu um probleminha por aqui. Onde a senhora está agora?"
32050-183 = "Um problema...? Poderia me dar mais detalhes?"
32050-184 = "Ao que tudo indica, recebemos informações de que alunas que se presume serem da Gehenna invadiram os arredores da academia sem autorização e estão atacando instalações da Trinity enquanto disparam indiscriminadamente."
32050-185 = "Um ataque... É o Comitê Disciplinar da Gehenna?! Ou será que a Pandemonium Society finalmente revelou suas verdadeiras intenções...?!"
32050-186 = "Ah, não, na verdade..."
32050-187 = "Quem quer que seja, sem dúvida tem a intenção de sabotar o Tratado do Éden...! Qual é a escala, quantas companhias são? E o local, qual instalação está sendo atacada?!"
32050-188 = "Calma aí, senpai. Por enquanto, não é o Comitê Disciplinar da Gehenna, e o contingente é bem pequeno; só confirmamos quatro pessoas até agora."
32050-189 = "Não é o Comitê Disciplinar... e são quatro pessoas...?"
32050-190 = "Sim. E parece que o local atacado foi... o aquário."
32050-191 = "O-O aquário...? Por que atacariam um lugar desses...?"
32050-192 = "Sei lá. Eu também não entendi muito bem, mas parece que elas roubaram uma espécie rara que estava em exposição, um tal de \"Atum Dourado\", e estão fugindo com ele."
32050-193 = "\"Atum Dourado\"...?"
32050-194 = "Dizem que é um peixe super caro, então provavelmente querem vender em algum lugar... Ah, acabaram de me mandar mais algumas informações aqui."
32050-195 = "Deixa eu ver... Ao que parece, a verdadeira identidade delas é aquele grupo terrorista da Gehenna, a \"Sociedade de Pesquisa Gourmet\"."
32050-198 = "A líder do plano é a presidente Kurodate Haruna, aquela famosa figura marcada como pessoa de alto risco até mesmo dentro da Gehenna. E aí, o que a gente faz, senpai?"
32050-200 = "Eiiii!! Por que viemos parar tão longe assim?! Aqui já não é bem no meio da Trinity?!"
32050-201 = "Não tínhamos escolha! Depois de ouvir falar daquele \"Atum Dourado\", não podíamos simplesmente ficar paradas olhando★"
32050-202 = "Fufu. Tratar aquele atum lendário como um mero peixe ornamental... Fazer uma coisa dessas é uma total falta de cortesia para com a alta gastronomia."
32050-203 = "A gastronomia deve ser sublime e, ao mesmo tempo, universal..."
32050-204 = "Acabar reduzido a uma mera atração para ganhar dinheiro certamente não é o que este senhor \"Atum Dourado\" desejava."
32050-205 = "Nós apenas ressoamos com o clamor da voz dele! Não é mesmo, Fuuka-san?"
32050-206 = "Hmph?! Hmmm! Hmmmmmm?!"
32050-207 = "Vejam só. A presidente do Clube de Merenda Escolar da Gehenna concorda tanto conosco que está até soluçando em lágrimas de emoção!"
32050-208 = "Embora, por causa da mordaça, não dê para entender nadinha do que ela está dizendo★"
32050-209 = "Uaaah, o atum ainda está se debatendo todo! Estou levando tapa da nadadeira dele?!"
32050-210 = "Izumi, segure firme direito! Esse peixe é super caro!"
32050-211 = "Aliás, quando é que a gente vai poder comer isso? Estou levando tapa de atum, sendo perseguida por garotas de uniforme de marinheiro preto, e já está me dando fome!"
32050-212 = "Uniforme de marinheiro preto... Isso não é o Comitê de Justiça?! Elas são tão perigosas quanto o nosso Comitê Disciplinar! O que vamos fazer, Haruna, será que dá para fugir?!"
32050-213 = "Fufu... Se vamos conseguir fugir ou não, isso é um mero detalhe sem importância."
32050-214 = "O que importa é: conseguiremos comê-lo ou não?!"
32050-215 = "Em outras palavras, \"comer ou morrer\"! Existem apenas essas duas opções! Esse é justamente o caminho sublime que nós, gourmets, devemos trilhar!"
32050-216 = "No fim das contas, tudo se resume a isso, né★"
32050-220 = "Parem de discursar com tanta pompa, temos que lutar na medida certa e fugir logo daqui!!"
32050-221 = "Vamos, hora de romper o cerco e bater em retirada! Precisamos fazer com que a Fuuka-san prepare um sashimi de atum fresquinho para nós o mais rápido possível!!"
32050-222 = "Hmmmmmmm—?!!"
32050-224 = "Próximo;Grande Confusão à Meia-Noite (2)"
