[translation]
2004803-1 = "Госпожа Нагиса над водой"
2004803-2 = "Я нашёл палатку, о которой мне рассказывала Нагиса."
2004803-3 = "Что же было внутри...?"
2004803-5 = "Частный пляж"
2004803-6 = "[ns] Открыть палатку."
2004803-9 = "[ns] «...Доска для сёрфинга?»"
2004803-10 = "Внутри была не только доска для сёрфинга, но ещё банан, водные лыжи и каяк."
2004803-11 = "Однако..."
2004803-12 = "[ns] «...К ним ведь даже никто не прикасался.»"
2004803-13 = "Спортивный инвентарь покрывался пылью."
2004803-14 = ""
2004803-17 = "Вытерев всё, я внезапно загорелся идеей."
2004803-18 = "[ns] «...Может, воспользоваться шансом и научиться сёрфингу?»"
2004803-20 = "Я взял доску для сёрфинга и решил выйти в открытое море."
2004803-22 = "Но..."
2004803-24 = "Где-то в море"
2004803-26 = "[ns] «Бле-е!»"
2004803-27 = "Я едва мог удержать равновесие на доске, не говоря уже о том, чтобы поймать хоть одну волну."
2004803-28 = ""
2004803-31 = "[ns] *кашель* *буль-буль*"
2004803-32 = "После того как я снова и снова падал в воду..."
2004803-33 = "...Сенсей?"
2004803-36 = "― [log=나기사 수영복]Что привело вас так далеко в море?  [/log][wa:1250]"
2004803-38 = "― [log=나기사 수영복]Да ещё и распластавшимся на доске... [/log][wa:10]"
2004803-41 = "[ns] «Я ужасно страдал...»"
2004803-42 = "― [log=나기사 수영복]...? Можно спросить, что произошло? [/log][wa:2410]"
2004803-45 = "― [log=나기사 수영복]Море — опасное место.[/log][wa:430]"
2004803-47 = "― [log=나기사 수영복]Даже малейшая ошибка может привести к серьёзному происшествию.[/log][wa:10]"
2004803-50 = "[ns] «Ну... Я бы не заходил так далеко...»"
2004803-51 = "― [log=나기사 수영복]Мне трудно понять ситуацию...[/log][wa:200]"
2004803-53 = "― [log=나기사 수영복]Правильные действия зависят от обстоятельств. Пожалуйста, расскажите, что случилось...[/log][wa:260]"
2004803-56 = "[ns] «Я просто снова и снова падал с доски...»"
2004803-57 = "― [log=나기사 수영복]А-а. Теперь понимаю.[/log][wa:1690]"
2004803-59 = "― [log=나기사 수영복]Я рада, что ничего ужасного не произошло. [/log][wa:1250]"
2004803-62 = "― [log=나기사 수영복]Говорят, научиться держать равновесие[/log][wa:80]"
2004803-64 = "― [log=나기사 수영복]— первое препятствие в сёрфинге.[/log][wa:1100]"
2004803-67 = "― [log=나기사 수영복]Это сложность, с которой поначалу сталкивается каждый.[/log][wa:10]"
2004803-70 = "― [log=나기사 수영복]Но... пока вы вот так отдыхаете,[/log][wa:1090]"
2004803-72 = "― [log=나기사 수영복]на воде ваше тело быстро остынет.[/log][wa:10]"
2004803-75 = "― [log=나기사 수영복]Идите сюда.[/log]"
2004803-77 = "― [log=나기사 수영복]У меня есть тёплые напитки.[/log][wa:480]"
2004803-80 = ""
2004803-82 = "Вот. Я взяла с собой термос."
2004803-83 = "Выпейте немного, чтобы согреться."
2004803-84 = "[s] «Ты даже в море берёшь с собой чёрный чай?»"
2004803-85 = "Фуфу. Нет, там просто тёплая вода."
2004803-86 = "Термос всё-таки изменил бы вкус чая."
2004803-87 = "Хм? Что я делала?"
2004803-88 = "Я просто наслаждалась мягким покачиванием волн."
2004803-89 = "Морской бриз и вид вокруг уже начинали казаться немного обыденными."
2004803-90 = "И всё же плавать было слишком утомительно."
2004803-91 = "Мне хотелось одновременно и делать что-нибудь, и не делать ничего."
2004803-92 = "Ты понимаешь это чувство, Сенсей?"
2004803-93 = "[s] «Не знаю, как это называется, но я тебя понимаю!»"
2004803-94 = "Фу-фу, я знала, что ты поймёшь."
2004803-95 = "Вот поэтому я просто наслаждалась тем, как дрейфую в море."
2004803-96 = "Волны делают всю работу за меня, а я просто отдыхаю."
2004803-97 = "И, похоже, я сделала правильный выбор."
2004803-98 = "Потому что встретила тебя."
2004803-100 = "И так мы с Нагисой наслаждались волнами и тёплой водой из её термоса."
