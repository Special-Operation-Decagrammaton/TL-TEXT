[translation]
1011302-1 = "Хобби 1"
1011302-2 = "Я приехал немного раньше в парк, где должен был встретиться с Сэной."
1011302-3 = "[ns1] «М-м. Встретиться с Сэной должно быть приятно...»\n[ns2] «Интересно, чем мы вообще здесь займёмся.»"
1011302-7 = "[ns3] «Хобби Сэны — дежурить в ожидании и сортировать лекарства...»\n[ns4] «…Неужели именно этим она хочет заняться сегодня?»"
1011302-10 = "Сенсей, вы из тех людей, для кого счастье других важнее собственного?"
1011302-11 = "[ns] «Не обязательно, но хорошо, когда всем весело.»"
1011302-12 = "То есть даже если кто-то другой был бы счастливее вас, вы всё равно были бы довольны?"
1011302-13 = "[ns5] «Наверное, зависит от ситуации...»\n[ns6] «Но я всё равно был бы рад.»"
1011302-16 = "Понятно. Учту."
1011302-17 = "[ns] «Погоди, ты же...?!»"
1011302-18 = ""
1011302-21 = ""
1011302-22 = "Здравствуйте, Сенсей. Вы рано."
1011302-23 = "[s] «Если ты уже была здесь, могла бы просто сказать!»"
1011302-24 = "Могла бы, но так я узнала о вас немного больше."
1011302-25 = "Вы оказались во многом именно таким, как я ожидала, но кое в чём превзошли мои ожидания."
1011302-26 = "Что именно я ожидала? Неважно. Я просто рада, что смогла встретиться с вами здесь, вот и всё."
1011302-27 = "Я давно этого ждала."
1011302-28 = "Итак, какие у вас планы на остаток дня?"
1011302-29 = "У меня? О, как я и говорила, я просто хотела встретиться с вами здесь, Сенсей."
1011302-30 = "Если подходить к этому исключительно с точки зрения эффективности, мы могли бы закончить на этом и разойтись."
1011302-31 = "Или пойти другим путём и вместе спланировать наше будущее..."
1011302-32 = "...Хм."
1011302-33 = "[s7] «Нет-нет, думаю, нам точно не стоит этого делать!»\n[s8] «Давай вместе побудем в режиме ожидания, ладно? В ожидании!»"
1011302-36 = "В режиме ожидания... Хм. Хорошо, давайте."
1011302-37 = "Если вы уверены, конечно. Я к этому привыкла, но не знаю, насколько комфортно будет вам."
1011302-38 = "Справитесь? Понятно. Поверю вам на слово."
1011302-40 = "И так мы с Сэной перешли в «режим ожидания» в парке..."
1011302-44 = "Вы в порядке, Сенсей?"
1011302-45 = "В каком смысле? Я просто спрашиваю о вашем эмоциональном состоянии."
1011302-46 = "По моим наблюдениям, сейчас вы выглядите «расслабленным»."
1011302-47 = "[s] «Это заметно?»"
1011302-48 = "Заметно."
1011302-49 = "Приблизительно."
1011302-50 = "Что чувствую я? Хм. Что ж, думаю, будет справедливо рассказать и об этом."
1011302-51 = "Если говорить просто, прямо сейчас..."
1011302-52 = "...куда ни посмотрю — повсюду опасность."
1011302-53 = "[s] «Опасность?! Где?!»"
1011302-54 = "Например, вон там."
1011302-55 = ""
1011302-56 = ""
1011302-57 = ""
1011302-58 = "Ахахаха! Ахахахаха! Хватит, сестрёнка! Щекотно!"
1011302-59 = "Что, уже хватит? А вот так? Ой, не убегай! Я только сильнее буду щекотать!"
1011302-60 = ""
1011302-61 = "Что? Они просто дети, которые играют? Ну, на первый взгляд МОЖНО так подумать, но..."
1011302-62 = "...при этом опасность вполне реальна."
1011302-63 = "В норме насыщение крови кислородом у человека составляет около 99%."
1011302-64 = "Но чрезмерная щекотка может снизить этот показатель и вызвать гипоксию."
1011302-65 = "Вы говорите, что обычно людей не щекочут до такого состояния?"
1011302-66 = "Ох, Сенсей. Никогда не знаешь, что люди выкинут в следующий момент."
1011302-67 = "И вон там есть ещё один пример."
1011302-68 = ""
1011302-69 = "О-о... Рамен готов."
1011302-70 = "Сегодня хочу сначала попробовать лапшу, так что отложу это яйцо онсэн в сторону..."
1011302-71 = "...и начну с этой мягкой, ароматной лапши."
1011302-72 = ""
1011302-73 = "Что плохого в том, чтобы наслаждаться раменом и яйцом онсэн, спрашиваете? Вы не первый, кто задаёт этот вопрос."
1011302-74 = "Но яйцо онсэн сравнительно сложнее есть, чем лапшу, а лапши легко набрать в рот слишком много за раз."
1011302-75 = "Следовательно, безопаснее сначала съесть яйцо, тем самым подготовив пищевод и желудок."
1011302-76 = "Более того, если съесть слишком много лапши сразу, она может перекрыть дыхательные пути, и в результате получится труп... то есть пациент в экстренном состоянии."
1011302-77 = "И это ещё не всё. Вон там тоже есть потенциальная опасность."
1011302-78 = ""
1011302-79 = "М-м! М-м! Обожаю сыр!"
1011302-80 = "А к сыру обязательно нужны солёные огурцы!"
1011302-81 = "Кисленькие огурцы отлично перебивают тяжёлый вкус сыра!"
1011302-82 = ""
1011302-83 = "Именно. Есть сыр вместе с солёными огурцами — это ДЕЙСТВИТЕЛЬНО проблема. Хотите знать почему?"
1011302-84 = "Есть такое вещество — тирамин. Оно образуется при ферментации продуктов."
1011302-85 = "И в сыре, и в солёных огурцах содержится много тирамина."
1011302-86 = "Если тирамин чрезмерно стимулирует симпатическую нервную систему, это может вызвать аритмию — нарушение сердечного ритма."
1011302-87 = "А если оставить это без внимания, дело может дойти до остановки сердца."
1011302-88 = "[s9] «В таком случае... если хочется жить максимально безопасно...»\n[s10] «Нельзя есть, двигаться или вообще что-либо делать...?»"
1011302-91 = "Что ж, да. Если все жизненные потребности, включая питание, обеспечиваются, это действительно самый безопасный образ жизни."
1011302-92 = "[s] «Но разве это не слишком?»"
1011302-93 = "Похоже, большинство людей так и считает. Именно поэтому такие, как мы, всегда находятся в режиме ожидания."
1011302-94 = "[s] «Ну, раз ты так говоришь. Я даже не знаю, что ответить...»"
1011302-95 = "Хм? Мне нравится быть в режиме ожидания, потому что так можно быстро отреагировать на ситуацию?"
1011302-96 = "...Не обязательно."
1011302-97 = "Конечно, мне нравится сортировать документы и проверять, всё ли в наших записях в порядке."
1011302-98 = "И делать эту работу гораздо проще, когда рядом никого нет."
1011302-99 = "Но в основе всего... мне нравится то, что это позволяет подготовиться к неизвестному."
1011302-100 = "[s] «Что ты имеешь в виду?»"
1011302-101 = "..."
1011302-102 = "Будущее неизвестно. И это вызывает тревогу."
1011302-103 = "Но именно ПОТОМУ, что оно неизвестно..."
1011302-104 = "Точнее говоря: мы никогда не знаем, какое тело, то есть какую «травму», придётся увидеть следующей..."
1011302-105 = "...поэтому, когда я просто нахожусь здесь, смотрю вокруг и остаюсь в режиме ожидания, во мне постоянно сохраняется лёгкое напряжение."
1011302-106 = "Не подумайте, будто я ХОЧУ, чтобы с кем-нибудь что-то случилось. Я всегда надеюсь, что каждый проведёт день и совсем не пострадает."
1011302-107 = "Но если отбросить это, есть особое удовлетворение, которое я ощущаю только тогда, когда наблюдаю за миром в таком состоянии напряжения."
1011302-108 = "Это ощущается... значимым — находиться здесь, наготове, и испытывать всё это."
1011302-113 = "Ого, сегодня время и правда пролетело незаметно, да?"
1011302-114 = "Может, дело в моей одежде, но температура моего тела ниже обычного..."
1011302-115 = "...а значит, существует риск переохлаждения."
1011302-116 = "Чтобы этого избежать, думаю, нам с вами стоит встать ближе. Ещё ближе."
1011302-117 = ""
1011302-119 = ""
1011302-120 = ""
1011302-121 = "[ns] «...Это точно всё ещё про переохлаждение?»"
1011302-122 = "Нет, вы меня поймали. Это была отговорка."
1011302-123 = "Я просто хотела ещё немного побыть вот так рядом с вами, Сенсей. Вот и всё."
1011302-124 = "Хотя бы сегодня."
1011302-125 = ""
1011302-127 = ""
1011302-128 = "И всё же я очень рада, что мы смогли провести время так, Сенсей."
1011302-129 = "Простите... Я понимаю, что всегда слишком напряжена. Но всё же."
1011302-130 = "Интересно, вот так ощущается свидание в режиме ожидания? Это волнительно."
1011302-131 = "Что такое свидание в режиме ожидания? Разве не очевидно?"
1011302-132 = "Это свидание, которое проходит, пока вы находитесь в режиме ожидания."
1011302-133 = "Как у нас сейчас."
1011302-135 = "И так мы с Сэной провели половину дня на «свидании в режиме ожидания», а затем я вернулся к работе."
1011302-136 = "«Свидание» здесь в том же смысле, что и «встреча для учёбы» или «встреча поиграть». Просто встреча в заранее оговорённое время."
