[translation]
2001005-1 = "Тренировка на горячих источниках: этикет"
2001005-2 = "Горная дорога возле Спецотряда № 227"
2001005-4 = ""
2001005-5 = "Чтобы управлять курортом с горячими источниками, каждый день приходится справляться с огромной кучей стирки."
2001005-6 = "От юкат, которые выдают гостям, до полотенец, которыми они вытираются."
2001005-7 = "Количество белья на курорте с горячими источниками просто невозможно представить!"
2001005-8 = "Но хозяйка великолепного курорта обязана сохранять достоинство, как бы занята она ни была!"
2001005-9 = "Поэтому сегодня я буду тренироваться ходить по обледенелой дороге, неся несколько тяжёлых подушек!"
2001005-10 = "[s] «Это тоже часть тренировки на горячих источниках?»"
2001005-11 = "Конечно. Ведь говорят, что достоинство начинается с того, как ты себя держишь, верно?"
2001005-12 = "Но изящно ходить с тяжёлой стопкой белья совсем не просто."
2001005-13 = "К тому же на курорте повсюду вода, поэтому полы скользкие. Если быть неосторожной, можно упасть и растерять всё достоинство."
2001005-14 = "Именно поэтому я выбрала для тренировки эту заснеженную гору!"
2001005-15 = "Если я смогу изящно ходить с тяжёлой ношей по этой обледенелой заснеженной горе, то и на горячих источниках сумею сохранять достойный вид."
2001005-16 = "Хорошо, Сенсей. Ваша задача — складывать подушки мне на руки, пока я удерживаю равновесие на льду!"
2001005-17 = ""
2001005-19 = ""
2001005-20 = ""
2001005-21 = "[ns] «Столько хватит?»"
2001005-22 = "Продолжайте! Я выдержу ещё как минимум десять."
2001005-23 = ""
2001005-25 = ""
2001005-26 = "[ns] «А теперь?»"
2001005-27 = "Нет, ещё нет, ещё!"
2001005-31 = "Д-Думаю, теперь уже достаточно."
2001005-32 = "[s] «Это уже превратилось в какой-то комедийный номер.»"
2001005-33 = "Хи-хи, может, выгляжу я смешно, зато равновесие держу идеально!"
2001005-34 = "Разве гости не будут поражены и не оставят мне большие чаевые, если увидят, как я скольжу туда-сюда с огромными стопками белья?"
2001005-35 = "[s] «Ты курорт с горячими источниками открываешь или цирк?»"
2001005-36 = "Что вы такое говорите, Сенсей? Я сейчас совершенно серьёзно тренируюсь."
2001005-37 = "Но высокая стопка подушек всё сильнее качается, и удерживать равновесие становится трудно."
2001005-38 = "О-Ой?!"
2001005-39 = "[s] «Нодока, стой, осторожно!»"
2001005-40 = ""
2001005-42 = ""
2001005-44 = "Ай..."
2001005-46 = "[ns1] «Ты в порядке?»\n[ns2] «Не ушиблась?»"
2001005-49 = "Я-Я в порядке. Просто поскользнулась."
2001005-50 = "Наверное, пытаться удержать сразу 50 подушек было слишком самонадеянно."
2001005-51 = "Уф."
2001005-52 = "Кажется, я подвернула лодыжку. Немного болит."
2001005-53 = "Похоже, на сегодня тренировку придётся закончить..."
2001005-54 = ""
2001005-57 = ""
2001005-58 = ""
2001005-61 = "А? Что вы вообще делаете, Сенсей?"
2001005-62 = "[s3] «Ты ведь не сможешь спуститься с горы в таком состоянии?»\n[s4] «Залезай. Я отнесу тебя вниз.»"
2001005-63 = "Ч-Что-о-о? Вы понесёте меня на спине?!"
2001005-64 = "Ч-Что-о-о? Вы понесёте меня на спине?!"
2001005-65 = "Д-Даже если я повредила лодыжку, разве для такой, как я, это не слишком большая честь?"
2001005-66 = "Получить возможность наблюдать спину Сенсея вблизи... настолько, что можно чувствовать тепло его тела."
2001005-67 = "[s] «О чём ты говоришь?»"
2001005-68 = "Н-Неважно!"
2001005-69 = ""
2001005-71 = ""
2001005-72 = "Хи-хи! Пусть я и повредила лодыжку, но в итоге сегодня мне всё-таки повезло."
2001005-74 = "(После этого я вернулся в Шале, неся Нодоку с повреждённой ногой на спине.)"
