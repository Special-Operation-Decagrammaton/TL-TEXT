[translation]
1300803-1 = "Хардкорная ночная подработка"
1300803-2 = "(Серика опаздывает.)"
1300803-4 = ""
1300803-5 = "*тяжело дышит* *тяжело дышит*"
1300803-6 = "[s] «Почему так долго, Серика?»"
1300803-7 = "Это... не моя вина... На работе в рамэнной меня заставили остаться сверхурочно..."
1300803-8 = "[s] «Кажется, ты говорила, что на подработку всегда нужно приходить заранее.»"
1300803-9 = "О, д-да, это правда, но... З-Заткнитесь! Я всего на несколько минут опоздала..."
1300803-10 = "..."
1300803-11 = "Мы отстаём от графика. Быстрее, Сенсей!"
1300803-14 = "(Мы с Серикой начали ночную подработку охранниками здания.)"
1300803-15 = "(Работа довольно скучная... Нужно всю ночь охранять вход в здание.)"
1300803-17 = "*вздох* Я вымоталась."
1300803-18 = "На всю ночь лучше выходить по пятницам, потому что потом есть целые выходные на восстановление. Правда, минус в том, что теряешь все выходные."
1300803-19 = "Вас это устраивает, Сенсей? Мне нормально, но я пойму, если вы слишком заняты."
1300803-20 = "Разве вы не хотели бы заняться чем-нибудь ещё на выходных?"
1300803-21 = "[s1] «Не думал, что мы проведём здесь всю ночь.»\n[s2] «По выходным я обычно сижу дома, так что ничего страшного.»"
1300803-22 = "...О."
1300803-23 = "Я думала, я вам говорила..."
1300803-24 = "П-Прости..."
1300803-25 = "Ха-ха. Вы бы предпочли каждую неделю сидеть дома? А я люблю выходить и развлекаться."
1300803-26 = "*вздох* Не могу дождаться, когда вернусь домой и приму душ."
1300803-27 = "Сегодня мы хорошо поработали, Сенсей."
1300803-28 = "До следующего раза! Пока-пока!"
1300803-29 = ""
1300803-31 = "Я снова решил пожертвовать заработанные деньги Комитету по предотвращению закрытия."
