84311100101-8 = "Ну, у всех есть чувствительные темы. У меня тоже. Лучше вообще их не затрагивать."
84311100101-9 = "Хм? Какие?"
84311100101-10 = "..."
84311100101-12 = "Ты вообще слушала...?"
