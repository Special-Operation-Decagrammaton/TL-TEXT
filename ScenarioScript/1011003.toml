[translation]
1011003-1 = "Просьба об уходе"
1011003-5 = "Вы пришли, Сенсей. Простите, что заставила вас проделать весь этот путь."
1011003-6 = "Как вы, наверное, уже догадались, сейчас у меня нет никаких особенно срочных проблем. Надеюсь, я достаточно ясно дала это понять, попросив вас зайти «когда будете свободны.»"
1011003-7 = "И всё же, если позволите мне задним числом оправдать своё приглашение..."
1011003-8 = ""
1011003-10 = ""
1011003-11 = ""
1011003-13 = "...возможно, вот это сойдёт за причину."
1011003-14 = "[s1] «Это...?»\n[s2] «Ого, потрясающе!»"
1011003-17 = "Тем, кто изматывает себя работой, нужно восполнять запас сахара. Чаепитие специально заказало эти сладости."
1011003-18 = "Раз уж я отняла у вас время и силы, стоит хотя бы помочь восстановить последнее."
1011003-19 = "Наверное, это выглядит немного противоречиво..."
1011003-20 = "...я хочу доставлять вам хлопоты и одновременно заботиться о ваших перекусах, сне и прочем."
1011003-21 = "Но пусть будет так. Прошу отнестись с пониманием."
1011003-22 = "А если это вступление показалось вам слишком длинным — прошу, угощайтесь."
1011003-23 = ""
1011003-25 = ""
1011003-26 = ""
1011003-28 = "...Сенсей? Это...?"
1011003-29 = "[s3] «Я подумал, это поможет тебе почувствовать себя лучше.»\n[s4] «Не хотел приходить с пустыми руками.»"
1011003-32 = "О. Но зачем...?"
1011003-33 = "Если вы с самого начала раскусили уловку, разве стали бы вообще утруждаться?"
1011003-34 = "Хотите сказать, вы специально принесли угощения больному человеку, хотя знали, что на самом деле я вовсе не больна?"
1011003-35 = "...Хм? «Болезнь» была лишь предлогом, чтобы принести их мне?"
1011003-36 = ""
1011003-38 = ""
1011003-39 = "А-а... Понятно."
1011003-40 = "Значит, мы оба принесли десерты. Марки разные, конечно, но по сути почти одно и то же."
1011003-41 = "Можно подумать, мы собрались на пикник, а не пришли навещать больную."
1011003-42 = "И, разумеется, вы с самого начала знали, зачем я вас позвала."
1011003-43 = "[s5] «Хотя я и не знал, чего ожидать.»\n[s6] «Не думал, что ты так хорошо подготовишься.»"
1011003-46 = "Фуфу. Вот как?"
1011003-47 = "...Какая жалость. Похоже, моя идея оказалась не такой уж оригинальной, как я думала."
1011003-48 = "Вообще-то я немного радовалась возможности удивить вас подарком."
1011003-49 = "Что? Вы всё равно его хотите?"
1011003-50 = "Вам правда нравится...? Но почему...?"
1011003-51 = "[s7] «Забавно, что мы подумали об одном и том же.»\n[s8] «Значит, мы оба думали друг о друге.»"
1011003-52 = ""
1011003-53 = ""
1011003-55 = ""
1011003-56 = ""
1011003-57 = "...И правда."
1011003-58 = "И только вы способны превратить такое совпадение во что-то настолько приятное, Сенсей."
1011003-59 = "Впечатляет. Одна простая фраза из ваших уст — и всё моё разочарование исчезло. На самом деле всё вышло куда лучше, чем я могла ожидать."
1011003-60 = "Мы оба с самого начала понимали, что всё это лишь предлог."
1011003-61 = "И вот я ожидаю, что вы подыграете мне ради моего удовольствия. По правде говоря, мне следовало бы просто довольствоваться вашей компанией и парой сладостей."
1011003-62 = "Как бы это сказать...?"
1011003-63 = "Глядя на то, как я развиваюсь, боюсь, скоро слово «девчонка» станет слишком мягким описанием."
1011003-64 = "Но не беспокойтесь. Я вполне умею устанавливать собственные границы."
1011003-65 = "Только с вами я веду себя так."
1011003-66 = "И именно поэтому есть черты, которые я обязательно никогда не переступлю."
1011003-67 = "...Теперь вам спокойнее?"
1011003-68 = "[s9] «Конечно. Я ни разу в тебе не сомневался.»\n[s10] «Я доверяю тебе, Сейя.»"
1011003-71 = "...Фуфу."
1011003-72 = "Не могу не рассмеяться. С вами одинаково приятно и непредсказуемо."
1011003-73 = "Но вернёмся к делу: давайте насладимся этими восхитительными десертами."
1011003-74 = ""
1011003-76 = ""
1011003-77 = "[ns11] «А? Сейя? Зачем ты...?»\n[ns12] «...Ты убираешь все сладости, которые я принёс?»"
1011003-80 = "Разумеется."
1011003-81 = "Тех угощений, что приготовила я, уже достаточно для нас двоих. И они распакованы, поэтому логично сначала съесть их."
1011003-82 = "И простите, что говорю это так прямо, но все сладости, которые принесли вы, теперь мои."
1011003-83 = "Я буду смаковать их сама, когда мне захочется."
1011003-84 = ""
1011003-86 = ""
1011003-87 = ""
1011003-88 = "...Таковы правила моей комнаты. Даже вам придётся им подчиняться, Сенсей."
1011003-89 = "В этой комнате..."
1011003-91 = "...моё слово — закон Тринити."
