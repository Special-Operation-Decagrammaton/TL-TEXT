[translation]
10052140-1 = "Милосердие"
10052140-9 = ""
10052140-10 = "А-а-а-а-а-а...!!!"
10052140-11 = "Н-не может быть...! Как такое могло случиться...?!"
10052140-12 = ""
10052140-14 = ""
10052140-16 = "..."
10052140-17 = "Отключите тревогу."
10052140-19 = "Уведомление тревоги остановлено."
10052140-20 = ""
10052140-23 = ""
10052140-24 = "С-Соф...?"
10052140-25 = "Ты... можешь просто вот так?"
10052140-27 = "Ситуация от этого не изменится. Включена тревога или нет — всё равно."
10052140-28 = "Правда?"
10052140-30 = "..."
10052140-31 = "Э-Это правда..."
10052140-32 = "Эйн. Ты готова?"
10052140-33 = "В-всё хорошо! Я почти закончила!"
10052140-34 = "О? С обеими вещами?"
10052140-35 = "Да!"
10052140-37 = "Хорошо. Понятно. Тогда..."
10052140-38 = "Какой план?"
10052140-39 = "План? Какой ещё план? Враг уже у порога."
10052140-40 = "Было бы невежливо не устроить им тёплый приём, верно?"
10052140-41 = "..."
10052140-42 = "Ты права. У нас всё ещё есть два ядра."
10052140-43 = "И ситуация ещё не вышла из-под контроля настолько, чтобы её нельзя было исправить."
10052140-44 = "Именно."
10052140-45 = "Ты собираешься встретить их, Соф?"
10052140-46 = "Ага. Пойдём поговорим с ними лицом к лицу."
10052140-48 = "Я-я тоже...?"
10052140-49 = "Ты оставайся здесь и закончи последние штрихи."
10052140-50 = "Сейчас нет ничего важнее того, чем ты занимаешься."
10052140-51 = ""
10052140-53 = ""
10052140-54 = "Д-Да...!"
10052140-56 = "Мы успешно захватили весь Стальной континент, кроме центрального узла Нецаха."
10052140-57 = "Ого... Не могу поверить, что мы правда это сделали..."
10052140-58 = "Статистически, если педантично следовать процессу, рано или поздно достигнешь нужного результата. Удивляться нечему."
10052140-59 = "Эм... А если бы с самого начала всё пошло не так...?"
10052140-60 = "В таком случае..."
10052140-61 = "Тогда мы бы, наверное, сейчас придумывали, как выжить в мире, полностью сделанном из стали."
10052140-62 = "Ч-Что...?!"
10052140-63 = "Есть поговорка: «Всё хорошо, что хорошо кончается.» Пока всё идёт хорошо, значит, это хорошо."
10052140-64 = "...Ты подозрительно спокойно к этому относишься."
10052140-65 = "С точки зрения вероятности это было сложнее, чем провести верблюда через игольное ушко..."
10052140-66 = "...С точки зрения квантовой механики вероятность была не нулевой, но некоторые переменные совпали так, что..."
10052140-67 = "Я совсем не переживала! Потому что с нами были Сенсей и все наши друзья! И самое главное — Рио вернулась в нашу группу!"
10052140-68 = "Я-я...?"
10052140-69 = "Да! Это тот самый троп, где враг становится союзником! Теперь мы непобедимы!"
10052140-70 = "А...? Погоди, но тогда получается, я говорю, что Рио раньше была моим врагом... Я... эм... Что делать?!"
10052140-71 = "Мне очень жаль, Рио! Я совсем не это имела в виду!"
10052140-72 = "Н-нет... Факт в том, что тогда я определённо... была вашим врагом, так что..."
10052140-73 = ""
10052140-75 = ""
10052140-76 = "Спасибо, Рио!"
10052140-77 = ""
10052140-81 = "Вы когда-нибудь задумывались о происхождении всего сущего?"
10052140-82 = "?!"
10052140-84 = "Позвольте мне задать вам эти вопросы."
10052140-85 = "...!"
10052140-86 = ""
10052140-90 = "Откуда мы пришли?"
10052140-91 = "Каково наше предназначение?"
10052140-92 = "Что происходит после конца всего?"
10052140-94 = "Кей...!"
10052140-95 = "Да, Арис. Я тоже это слышу."
10052140-97 = "Возможно, бог в некотором смысле является дисциплиной для своих последователей."
10052140-98 = ""
10052140-100 = ""
10052140-101 = "Арис? Кей? Что-то происходит?"
10052140-102 = ""
10052140-104 = ""
10052140-105 = "Хм? Н-ну...!"
10052140-106 = "Ничего важного."
10052140-107 = "С-спасибо, Кей..."
10052140-108 = "Нет, именно для этого я здесь."
10052140-109 = "Но... что имел в виду тот голос? Ты что-то знаешь, Кей?"
10052140-110 = "...Я не всё поняла."
10052140-111 = "Но думаю, это может быть связано с нашим происхождением."
10052140-113 = "Внимание, все. Что-то приближается."
10052140-118 = ""
10052140-120 = "..."
10052140-121 = "..."
10052140-122 = "[s1] «Соф! Ор! Хороший сегодня день!»\n[s2] «Эйн сегодня не с вами?»"
10052140-125 = "...Что с тобой не так?"
10052140-126 = "Угх..."
10052140-128 = "Ну-ну. Когда тебе говорят «привет», как отвечают хорошие дети?"
10052140-129 = "И с каких пор мы с тобой в таких дружеских отношениях, Изумимото Эйми...?"
10052140-130 = "Слишком длинное обращение. Иными словами, неэффективно. Просто зови меня Эйми."
10052140-131 = "...Что?"
10052140-132 = "Повторяй за мной. Э-й-м-и."
10052140-133 = "Нет, я имела в виду—"
10052140-134 = "Эйми."
10052140-135 = "...Ладно, Эйми. И Сенсей [USERNAME] тоже."
10052140-136 = "Умница."
10052140-137 = "..."
10052140-138 = "Уф. Ладно, признаю: вы и правда зашли далеко. Никогда бы не подумала, что вы победите восемь пророков, не говоря уже о том, чтобы захватить столько территории Нецаха."
10052140-140 = "...Тц."
10052140-141 = "У меня есть предложение. Почему бы нам не забыть прошлое, а вам не перевестись в нашу школу?"
10052140-142 = "Сенсей подтвердил, что заявления ещё принимаются."
10052140-143 = "И это не обязательно должна быть наша школа. Кивотос, Академический город, — федерация тысяч больших и маленьких школ."
10052140-144 = "Так что технически у вас есть тысячи вариантов."
10052140-145 = "Но я всё равно рекомендовала бы научную школу Миллениум."
10052140-146 = "Ни за что. Никогда. Нет. Побереги дыхание для какого-нибудь идиота, которому не всё равно."
10052140-147 = "А ещё ограниченное время при переводе вы получите особый приветственный подарок лично от госпожи Рио."
10052140-148 = "Ч-что? Мне никто об этом не говорил..."
10052140-149 = "Подыграй!"
10052140-150 = "Х-Хорошо..."
10052140-151 = "Но если отбросить это, вы слышите наше предложение? Кивотос, и особенно Миллениум, открыт для всех студентов."
10052140-152 = "Мы же ГОВОРИМ, что НЕ ПОЙДЁМ!! Серьёзно. Нам не нужен этот хлам."
10052140-153 = "(Уф, терпеть не могу даже притворяться, что рассматриваю это, но Эйн нужно больше времени...!)"
10052140-154 = "[s] «Что бы ни случилось, я, Сенсей Кивотоса, никогда от вас не откажусь!»"
10052140-155 = "Ха, удачи! После всего, что вы натворили, мне нечего вам сказать!"
10052140-157 = "А? Тогда зачем ты проделала весь этот путь, чтобы увидеться с нами?"
10052140-158 = "О-она права! У тебя нет никакой нормальной причины быть здесь!"
10052140-160 = "Уф."
10052140-162 = "Н-ну. Это...!"
10052140-163 = "Так ведь вы, люди, делаете! Раз уж вы зашли так далеко, мы должны лично выйти и поприветствовать вас. Или типа того!"
10052140-164 = "[s] «Ой, какие мы теперь воспитанные! Умница!»"
10052140-165 = "Хм. Тогда почему бы нам ещё немного так не пообщаться?"
10052140-166 = "Что именно значит «так»? И хватит уже ухмыляться! Кто-нибудь ещё подумает, что мы тебе нравимся!"
10052140-167 = "Если честно, не могу сказать, что совсем не согласна. Хи-хи."
10052140-168 = "...Вы тут все окончательно с ума сошли?! Разве мы не злодеи в вашей истории? Мы пытаемся покрыть ваш мир металлом!"
10052140-169 = "Вот почему говорят, что молодость растрачивается на молодых. Не переживай. В школе научишься."
10052140-170 = "А, я понимаю, к чему ты, Эйми. С возрастом приходит зрелость."
10052140-171 = "...Хотя не ко всем."
10052140-172 = "Х-Химари! Это уже немного слишком...!"
10052140-173 = "Всё нормально, Юзу."
10052140-174 = ""
10052140-176 = ""
10052140-178 = ""
10052140-179 = "Хм? Разве мы не о тех троих детях говорим?"
10052140-180 = "...Видишь? Всё нормально."
10052140-181 = "П-Правда..."
10052140-182 = "[s] «В любом случае человеку важно учиться, пока он растёт.»"
10052140-183 = "Хорошо, что я не «человек», да?"
10052140-184 = "[s] «Нет-нет. Если знаешь манеры и этикет, значит, ты тоже человек!»"
10052140-185 = "Ты говоришь, будто учёба так важна, но нам не нужно «развиваться.» Мы родились уже со всем необходимым для существования, запрограммированным внутри."
10052140-186 = "...Да и вообще, мы изначально не люди."
10052140-187 = "[s3] «Думать, что знаешь всё, — верный признак того, что не знаешь ничего!»\n[s4] «В этом мире факты могут измениться в одно мгновение!»"
10052140-191 = "Хорошо сказано. Некоторые считают, что учёба — путь длиною в жизнь."
10052140-192 = "Поэтому, Сенсей, разве не ваш долг как педагога сразу после нашего возвращения проводить для меня индивидуальные занятия..."
10052140-193 = "...чтобы наверстать всё, что я пропустила?"
10052140-194 = "...Что именно ты подразумеваешь под «занятиями»?"
10052140-195 = "Отличная идея, Токи! Можно и мне тоже, пожалуйста?"
10052140-196 = "..."
10052140-197 = "Подтверждаю. Потому что наша очаровательная Арис невероятно милая и убедительная."
10052140-198 = "Ор, что мы сейчас вообще наблюдаем?"
10052140-199 = "..."
10052140-200 = "Вот поэтому вы, люди, всегда в итоге о чём-то жалеете."
10052140-201 = "Делаете что захотите, а потом отказываетесь отвечать за последствия!"
10052140-202 = "Ага. Другие люди, природа или сам мир..."
10052140-203 = "Вы портите всё, к чему прикасаетесь, без малейшего сожаления."
10052140-204 = "Теперь моя очередь задать вопрос. Вы никогда не жалели о содеянном?"
10052140-205 = "Никогда не хотели всё переиграть?"
10052140-206 = "[s] «...Это правда. Людям свойственно сожалеть.»"
10052140-207 = "..."
10052140-208 = "[s5] «Если бы люди могли переиграть прошлые ситуации...»\n[s6] «Уверен, кое-что они сделали бы иначе.»"
10052140-211 = "..."
10052140-212 = "[s] «Но даже если у нас остаются сожаления, мы не возвращаемся назад.»"
10052140-213 = "...Почему?"
10052140-214 = "[s] «Потому что мы оглядываемся назад, чтобы двигаться вперёд.»"
10052140-215 = "...!"
10052140-216 = "[s7] «Мы размышляем о пути, который уже прошли...»\n[s8] «...и несём эти уроки с собой до самого финиша.»"
10052140-220 = "[ns9] «Прокладываем ли мы собственную дорогу или идём по следам тех, кто был до нас...»\n[ns10] «Так мы выбираем, как прожить свою жизнь.»"
10052140-223 = "...!"
10052140-224 = "Так... живут люди..."
10052140-225 = "А что тогда насчёт нас...?"
10052140-226 = "..."
10052140-227 = ""
10052140-231 = "Эйн? Ты там?"
10052140-232 = ""
10052140-234 = ""
10052140-235 = "Д-да! Я-я здесь, старшая сестра!"
10052140-236 = "Мне жаль, что я потребовала от тебя так многого... Но я чувствую: моё перерождение уже близко."
10052140-237 = "М-м-м-мы виноваты! Потому что мы недостаточно хороши... Тебе придётся запачкать руки!"
10052140-238 = "Не извиняйся. Как вашей старшей сестре, мне ничто не приносит большей радости, чем то, что вы на меня полагаетесь."
10052140-239 = "Правда. Спасибо, что доверились мне."
10052140-240 = "Д-Да...!"
10052140-241 = "..."
10052140-242 = "Соф, Ор. В-вы меня слышите? В-всё ещё нормально... Мы справимся!"
10052140-243 = "...По крайней мере, я так думаю...!"
10052140-244 = "Подготовка Даат почти завершена! Я тоже скоро буду там!"
10052140-245 = ""
10052140-251 = "Хорошо. Поняла."
10052140-252 = "В таком случае...!"
10052140-253 = "Да. Именно, Соф."
10052140-254 = "Спасибо, что выиграли время."
10052140-255 = ""
10052140-257 = ""
10052140-258 = "Так, все внимательно слушайте!"
10052140-259 = "Мы можем починить сломанное! Можем вернуть свет осквернённой божественности!"
10052140-260 = "Мы всё ещё можем начать заново! Как и вы, мы никогда не сдаёмся! И поэтому...!"
10052140-261 = "Разветвлённые возможности!"
10052140-262 = "Просветление через знание!"
10052140-264 = "Мудрость Хокмы! Отвага Гебуры!"
10052140-265 = "И бесформенная тень, отброшенная единством!"
10052140-266 = ""
10052140-269 = ""
10052140-270 = "Что они пытаются сделать?"
10052140-271 = "Неужели это...?!"
