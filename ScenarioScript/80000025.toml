[translation]
80000025-1 = "Шоколадные усы"
80000025-2 = "Первая столовая академии Красная Зима"
80000025-3 = "Добро пожаловать, товарищ! Я тебя заждалась!"
80000025-4 = "Я позвала тебя, чтобы поведать о новейшем великом достижении Федеральной академии Красная Зима."
80000025-5 = "Одном из множества великих достижений, ставших возможными благодаря её блистательному лидеру — мне!#nХа-ха-ха!"
80000025-6 = "[s] «И что же это?»"
80000025-7 = "Прекрасный вопрос, товарищ!"
80000025-8 = "Студенты здесь готовят Черенку — особый молочный шоколад!"
80000025-9 = "Фирменное лакомство академии Красная Зима, особенно знаменитое тем, что на нём выгравирован мой портрет! По всей школе воспевают его восхитительно сладкий вкус!"
80000025-10 = "Его вкус ещё ни разу меня не разочаровал."
80000025-11 = "Повар, принеси свежую Черенку."
80000025-17 = "Да. Вот этот вкус. Ошеломляющая сладость!"
80000025-18 = "Но, к величайшей трагедии, остальная часть Кивотоса всё ещё не открыла для себя это истинное шоколадное чудо!"
80000025-19 = "Стоит им попробовать его хоть раз — и они уже никогда не забудут."
80000025-20 = "Я слышала о мероприятии под названием День святого Валентина, когда студенты обмениваются шоколадом."
80000025-21 = "Я воспользуюсь этим шансом, чтобы прославить величие Черенки по всему региону!"
80000025-22 = "[s] «А я тогда зачем здесь?»"
80000025-23 = "Потому что ты знаменитый Сенсей из Шале, товарищ."
80000025-24 = "Ты мост между школами, поэтому только ты достоин донести весть о существовании Черенки!"
80000025-25 = "А теперь, товарищ! Распространи мои слова и шоколад среди всех студентов Кивотоса!"
80000025-26 = "[s] «Можно мне хотя бы сначала попробовать?»"
80000025-27 = "А-А? О! Т-Точно, чтобы понять её величие, нужно сначала попробовать."
80000025-28 = "Повар, принеси Черенку моему товарищу."
80000025-29 = ""
80000025-31 = ""
80000025-32 = "Что?! У тебя не осталось ингредиентов?!"
80000025-33 = "Как ты смеешь не выполнять производственный план!"
80000025-34 = "Я всех вас до последнего отправлю на чистку!"
80000025-38 = "Кхм. Прошу прощения за шум."
80000025-39 = "[s] «Как там производство шоколада?»"
80000025-40 = "П-Прекрасно. Возможно, припасов слегка не хватает, но при должной мотивации они всё сделают!"
80000025-41 = "Под моим руководством нет ничего невозможного!"
80000025-42 = ""
80000025-44 = ""
80000025-45 = "Свежей у меня, может, и нет..."
80000025-46 = ""
80000025-48 = ""
80000025-50 = "...так что, пожалуйста, не обращай внимания на то, что я уже откусила от этой."
80000025-51 = "Попробуй и расскажи о ней всему Кивотосу!"
80000025-52 = "Понятно? Это приказ!"
80000025-54 = "Молочный шоколад Черино оказался настолько сладким, что я едва смог его съесть..."
