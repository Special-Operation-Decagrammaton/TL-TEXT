[translation]
1006802-1 = "Поздоровайся, Рейса"
1006802-3 = ""
1006802-4 = "Оп-ля..."
1006802-5 = "А?"
1006802-6 = "Ч-Что?!"
1006802-7 = "О! Здравствуйте, Сенсей!"
1006802-8 = "[s1] «Привет, Рейса.»\n[s2] «Не ожидал встретить тебя здесь.»"
1006802-11 = "Да! Какое совпадение! Хотя, вообще-то... Здесь проходит много автобусов, так что, может, это не такое уж совпадение!"
1006802-12 = "Вы куда-то направляетесь, Сенсей? Или кого-то ждёте? Или... что-то ещё?"
1006802-13 = "А, вы ждёте автобус! Ха-ха! Да! Тогда всё понятно! Конечно!"
1006802-14 = "Эм..."
1006802-15 = "Что ж! Ха-ха! Тогда увидимся позже!"
1006802-16 = ""
1006802-18 = ""
1006802-19 = "[ns3] «Подожди минутку, Рейса!»\n[ns4] Остановить её!"
1006802-22 = "...?"
1006802-23 = "А? Что такое? Вы хотели поговорить о чём-то ещё?"
1006802-24 = "О? Про MomoTalk, который я отправила сегодня утром?"
1006802-25 = "А. Это. Ха-ха! П-Простите. Наверное, я заставила вас переживать. Пожалуйста, забудьте об этом!"
1006802-26 = "Мне правда нечего было сказать... Я просто хотела поздороваться."
1006802-27 = "Но у вас, наверное, столько дел... Если подумать, я просто добавила ещё одно к общей куче."
1006802-28 = "Я прослежу, чтобы такого больше не случилось!"
1006802-29 = "[s5] «Нет! Я хочу, чтобы ты спокойно здоровалась со мной, когда захочешь.»\n[s6] «Вообще-то я хотел сказать, что можешь писать мне чаще, если хочешь.»"
1006802-32 = "...Что?"
1006802-33 = "Эм. А? Эм... С-Спасибо?"
1006802-34 = "Н-Но, Сенсей... Вы правда специально пришли... только чтобы сказать это?"
1006802-35 = "Что? Вы хотите знать, есть ли у меня планы? Эм, н-нет, не особо..."
1006802-36 = "У меня... редко бывают планы. Разве что происходит что-нибудь особенное. Ха-ха..."
1006802-37 = "...А!"
1006802-38 = "Не волнуйтесь! У меня с друзьями в школе всё хорошо! Ничего такого, ясно?"
1006802-39 = "Дело вообще-то во мне... Они зовут меня гулять, но я не очень умею отвечать на сообщения..."
1006802-40 = "Я всегда слишком долго думаю, что ответить, или делаю всё неловким, потому что слишком радуюсь... Обычно всё происходит примерно так."
1006802-41 = "Я... наверное, хотела спросить, нет ли у вас советов, как перестать допускать такие ошибки..."
1006802-42 = "[s7] «Понимаю. Я примерно так и думал.»\n[s8] «Тебе просто нужен небольшой совет и практика.»"
1006802-45 = "Эм... Когда вы так говорите... мне становится от этого немного хуже..."
1006802-46 = "Но... думаю, наверное... Как бы это сказать?"
1006802-47 = "Я просто подумала, что, раз вы всё-таки учитель... Может, ничего страшного, если с вами я буду ошибаться?"
1006802-48 = ""
1006802-50 = ""
1006802-51 = "Эм! Но когда я произношу это вслух, звучит так, будто я ещё больше надоедаю! Простите, простите, простите меня..."
1006802-52 = "Вы говорите, что всё нормально? Но..."
1006802-53 = "[s9] «Теперь попробуй делать так и с другими.»\n[s10] «Привыкай к мысли, что ошибаться — нормально.»"
1006802-56 = "...? Не понимаю, Сенсей."
1006802-57 = "Я и так постоянно ошибаюсь! Почему ещё больше ошибок — это нормально?"
1006802-58 = "А? То есть, чем больше я об этом переживаю, тем выше шанс, что это случится...? Эм..."
1006802-59 = "Простите! Я всё ещё не совсем понимаю..."
1006802-60 = "Эм! Но вы всё-таки дали мне совет, Сенсей, так что даже если я не до конца его понимаю, я попробую! Да!"
1006802-61 = "Вообще-то... немного страшно... Но я всё равно попробую!"
1006802-62 = ""
1006802-67 = "О! Вот и ваш автобус. Простите, Сенсей. Я всё-таки отняла у вас столько времени."
1006802-68 = "Ну, тогда я пойду! Хорошего вам дня, Сенсей!"
1006802-69 = ""
1006802-71 = ""
1006802-73 = "...Хорошо! Пока!"
1006802-74 = ""
1006802-76 = ""
1006802-77 = "[ns11] «Доберись домой безопасно.»\n[ns12] Сесть в автобус."
