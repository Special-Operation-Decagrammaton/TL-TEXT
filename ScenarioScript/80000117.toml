[translation]
80000117-1 = "Валентиновский фестиваль"
80000117-2 = "Сегодня День святого Валентина, Сенсей!"
80000117-3 = "[s] «Д-Да, и...?»"
80000117-4 = "Как вы воспринимаете День святого Валентина, Сенсей? Для меня... это шоколадный фестиваль!"
80000117-5 = "[s] «Да-да...»"
80000117-6 = "Мне очень нравится традиция дарить шоколад. И нравится волнение от подготовки шоколада для других."
80000117-7 = "И ЕЩЁ мне нравится, как в это время мир становится счастливее, а повсюду продают шоколад в красивой упаковке..."
80000117-8 = "В общем, мне нравится всё!"
80000117-9 = "Поэтому мне стало интересно: существуют ли шоколадные фейерверки?!"
80000117-10 = "[s] «Что вообще такое шоколадные фейерверки, Умика...?»"
80000117-11 = "Т-Теперь, когда вы спросили, я и сама не знаю..."
80000117-12 = "Может, положить шоколад в ракету фейерверка, запустить в небо и чтобы он падал повсюду, как дождь или снег!"
80000117-13 = "Или добавить шоколад в бенгальский огонь, чтобы при горении пахло шоколадом!"
80000117-14 = "[s] «Мне кажется, это создаст некоторые проблемы...»"
80000117-15 = "Значит, и правда невозможно..."
80000117-16 = "Ну и ладно, мне всё равно нравится этот шоколадный фестиваль!"
80000117-17 = "Я..."
80000117-18 = "...ещё..."
80000117-19 = "...я ценю и другой смысл Дня святого Валентина, знаете?"
80000117-20 = "Даже в Момоёдо мы стараемся увеличить продажи, выставляя специальные валентиновские товары."
80000117-21 = "Все радостно приходят покупать разные шоколадные вагаси и десерты!"
80000117-22 = "...Это ещё и помогает тем, кто обычно забывает про День святого Валентина!"
80000117-23 = "Они могут использовать это как оправдание и сказать, что пришли специально за валентиновскими новинками Момоёдо!"
80000117-24 = "[s] «Страшная бизнес-схема от Момоёдо!»"
80000117-25 = "Э-Это идея начальницы...!"
80000117-26 = "У меня пока не такой деловой талант, как у неё, чтобы придумывать подобное."
80000117-27 = "[s1] «Это потому, что ты ещё первогодка, Умика.»\n[s2] «Тебе ещё есть куда расти!»"
80000117-30 = "Да! Однажды, как начальница, я умело...!"
80000117-31 = "Я накрою весь мир фестивалями с помощью невероятной...!"
80000117-32 = "Невероятной...!!"
80000117-33 = ""
80000117-35 = ""
80000117-36 = "Невероятной штуки! Я обязательно чего-нибудь добьюсь!"
80000117-37 = "[s3] «Я буду за тебя болеть...»\n[s4] «Только не делай ничего слишком страшного...»"
80000117-40 = "В любом случае, думаю, важно каждый день начинать со свежим настроем!"
80000117-41 = "А чтобы это сделать...!"
80000117-42 = "Ч-Чтобы это сделать..."
80000117-43 = "..."
80000117-44 = "Для вас, кто всегда меня поддерживал..."
80000117-45 = "Я должна, эм, ну..."
80000117-46 = "..."
80000117-47 = "Т-Точно! Выразить благодарность! Вот что это!"
80000117-48 = "Пусть это лишь малая часть всего, что вы дали мне..."
80000117-49 = "Я хотела... думала, что смогу... отплатить за вашу доброту..."
80000117-50 = "Поэтому приготовила вот это!"
80000117-51 = ""
80000117-53 = ""
80000117-55 = "[ns] «Это... шоколадный микоси?»"
80000117-56 = "Верно! Хи-хи..."
80000117-57 = "Каждому фестивалю нужен микоси, правда?"
80000117-58 = "Поэтому я попробовала сделать шоколад в форме микоси."
80000117-59 = "Крышу даже можно открыть, вот так!"
80000117-60 = "[s] «О-о-о, круто! Ты правда вложила в это душу!»"
80000117-61 = "Спасибо, Сенсей. А внутри микоси, там, где обычно размещают самое дорогое..."
80000117-62 = "Я..."
80000117-63 = "Я положила свой особый шоколад."
80000117-64 = "...Знаете, Сенсей?"
80000117-65 = "Говорят, в фестивальных микоси обитают божественные духи."
80000117-66 = "А затем эти духи исполняют желания людей или благословляют участников фестиваля."
80000117-67 = "Поэтому в микоси сажают самого важного человека фестиваля."
80000117-68 = "Он распространяет среди всех участников добро — радость, счастье, удачу и восторг."
80000117-69 = "Поэтому внутри также могут оставлять пустое место или помещать священные предметы..."
80000117-70 = "Но почему-то мне показалось, что божественный дух внутри микоси..."
80000117-71 = "...немного похож на вас, Сенсей."
80000117-72 = "[s] «О? На меня?»"
80000117-73 = "Д-Да..."
80000117-74 = "По крайней мере, я так чувствую."
80000117-75 = "Поэтому я сделала шоколадный микоси, в котором покоится священный шоколадный предмет..."
80000117-76 = "А этот священный шоколад внутри... я делала, думая о вас, Сенсей."
80000117-77 = "Итак, Сенсей."
80000117-78 = "Я знаю, что валентиновский шоколад можно есть как угодно."
80000117-79 = "Но если вы не против, откройте крышу..."
80000117-80 = "...и начните с того, что внутри?"
80000117-81 = "Ведь это то, что выражает мои мысли о вас, Сенсей..."
80000117-82 = "[s5] «Для меня это честь.»\n[s6] «Спасибо, выглядит вкусно.»"
80000117-85 = "Спасибо!"
80000117-86 = "Т-Тогда я принесу чай или что-нибудь, что хорошо к нему подойдёт!"
80000117-87 = "Так что, пожалуйста... наслаждайтесь от души!"
80000117-88 = "Извините!"
80000117-89 = ""
80000117-91 = ""
80000117-93 = "Я смотрел, как покрасневшая до ушей Умика убежала на кухню."
80000117-94 = "Затем медленно достал из микоси священный шоколадный предмет..."
