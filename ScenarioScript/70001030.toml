[translation]
70001030-1 = "Термы Акай 3"
70001030-2 = ""
70001030-3 = "Значит, это последнее место..."
70001030-4 = "Ничего не поделаешь. У всех остальных купальных помещений, которые мы осмотрели, были серьёзные недостатки."
70001030-5 = "Ты права, но..."
70001030-6 = "Я очень не хочу покупать что-либо у академии Миллениум."
70001030-7 = "...Почему?"
70001030-8 = "Разве не все изобретения академии Миллениум используют передовые технологии, которые требуют сложного обслуживания?"
70001030-9 = "Я слышала слухи, что даже автомат с кофе в их комнате отдыха оснащён ИИ. Я даже представить не могу, какими будут их ванны..."
70001030-10 = "Да ладно... Уверена, это просто сплетни."
70001030-11 = "В крайнем случае просто спросим цену и на этом закончим."
70001030-12 = "Ага..."
70001030-13 = ""
70001030-15 = ""
70001030-17 = ""
70001030-18 = "А-Аварийный демонтаж?!"
70001030-19 = "С модификациями, которые мы внесли в купальные помещения общежития, что-то не так?"
70001030-20 = "Н-Нет. Вроде всё работает нормально..."
70001030-21 = "Просто сегодня сюда придёт делегация из другой академии, чтобы осмотреть общежития."
70001030-22 = "Показывать им работу Инженерного отдела до того, как Семинар успеет оценить ваши модификации, как-то..."
70001030-23 = "Но мы студенты Научной школы Миллениум. Мы имеем право показывать миру свои изобретения."
70001030-24 = "Более того, разве не лучше, чтобы на таком важном событии Инженерный отдел сам представил новые помещения и объяснил, как они работают?"
70001030-25 = "Но ваши прошлые модификации—"
70001030-27 = ""
70001030-28 = "Эм, простите... Мы из академии Красная Зима?"
70001030-29 = "В-Вы уже здесь!"
70001030-30 = "Ужасно извиняюсь... Но мы ещё не полностью готовы показать помещение."
70001030-31 = "Нет? Но насколько я вижу, всё чисто и готово к использованию..."
70001030-32 = ""
70001030-34 = ""
70001030-35 = "Вот именно, новые ванны полностью готовы!"
70001030-36 = "П-Президент Утаха!"
70001030-37 = "Значит, ваши помещения тоже нуждались в ремонте?"
70001030-38 = ""
70001030-39 = "Ещё как! И как участница проектной команды я с радостью лично объясню вам функции недавно установленных ванн Миллениум!"
70001030-40 = "Для начала: совершенно новая ванна в центре оснащена передовым ИИ, который анализирует потребности пользователя и автоматически регулирует температуру воды."
70001030-41 = "Сканируя воду и кожу пользователя в реальном времени, ИИ избавляет от необходимости самостоятельно подливать воду!"
70001030-42 = "Бойлер, нагревающий воду, работает по принципу теплового насоса и поглощает тепло из окружающего пространства, так что заодно служит системой охлаждения..."
70001030-43 = "Благодаря встроенному охлаждению к ванне также прикреплён холодильник, чтобы пользователь мог наслаждаться прохладным напитком прямо во время купания!"
70001030-45 = ""
70001030-46 = "Ванна с холодильником... Невероятно..."
70001030-48 = "В нашем купальном комплексе также есть функция автоматического мытья для особо ленивых студентов."
70001030-49 = "Пользователь может отдавать голосовые команды встроенному ИИ и поручать ему мыть тело множеством автономных роботизированных рук."
70001030-50 = "Одна эта ванна способна заменить целый набор устройств для ванной комнаты."
70001030-52 = "Ну... На бумаге это и правда звучит потрясающе..."
70001030-53 = "Ванна с таким количеством технологий наверняка стоит целое состояние, да...?"
70001030-55 = "О, о цене можете вообще не переживать!"
70001030-56 = "Этот передовой купальный комплекс установлен в тестовом режиме и ещё не прошёл окончательные испытания. Инженерный отдел возьмёт с вас только стоимость материалов, а обслуживание и ремонт полностью возьмём на себя!"
70001030-58 = "Разумеется, в договор придётся добавить пункт, освобождающий отдел от ответственности за любые несчастные случаи во время испытательного периода..."
70001030-59 = ""
70001030-61 = ""
70001030-62 = ""
70001030-63 = "...Но дешевле мы уже не можем."
70001030-65 = ""
70001030-67 = ""
70001030-68 = "Погодите, это намного дешевле всех остальных комплексов, которые мы смотрели."
70001030-69 = "Подпишем! Немедленно подпишем договор с Миллениум!"
70001030-70 = "Эм, возможно, вы не знаете, потому что из другой академии..."
70001030-71 = "Но... изобретения нашего Инженерного отдела печально известны тем, что в них почти всегда обнаруживается хотя бы одна неожиданная функция, хотя в целом они работают хорошо..."
70001030-72 = "Полный цикл испытаний безопасности займёт время, поэтому я бы рекомендовала заключить контракт на помещения другой академии..."
70001030-73 = "Это не проблема. Разве не лучше, когда у покупки есть дополнительные функции?"
70001030-74 = ""
70001030-76 = ""
70001030-77 = ""
70001030-78 = ""
70001030-79 = "Мм, отличный настрой. От бесплатного бонуса не отказываются!"
70001030-80 = "Вот это я называю хорошим сервисом!"
70001030-82 = "Как специальный посланник академии Красная Зима, я немедленно одобряю это решение!"
70001030-83 = "Просим Инженерный отдел установить свои передовые купальные комплексы в общежитиях академии Красная Зима!"
70001030-85 = "Предоставьте всё нам!"
70001030-86 = ""
70001030-88 = ""
70001030-89 = "Общее общежитие академии Красная Зима"
70001030-91 = ""
70001030-92 = "Хм-м... Значит, это та новая ванна, которую студенты Спецотряда привезли из академии Миллениум?"
70001030-93 = "Выглядит обычно, но нельзя недооценивать козни реакционной интеллигенции. Всегда есть вероятность, что Миллениум специально саботировал собственное устройство, чтобы ударить по академии Красная Зима..."
70001030-94 = "Учитывая эту угрозу, президент ученического совета академии Красная Зима, глава благоустройства, Великий Вождь, глава физического воспитания и обладательница других должностей возьмёт опасность на себя... и испытает её первой!"
70001030-95 = "...Я точно не лезу первой просто из любопытства!"
70001030-96 = ""
70001030-98 = ""
70001030-99 = "Посмотрим... Согласно инструкции, встроенный ИИ автоматически моет пользователя?"
70001030-100 = "Эй, ИИ! Приказываю тебе вымыть мне волосы!"
70001030-101 = "Подтверждено. Активация функции автоматического купания."
70001030-102 = ""
70001030-107 = "О, интересно... Роботизированные руки моют волосы почти как человеческие."
70001030-108 = "Хм-м... совсем неплохо..."
70001030-109 = ""
70001030-113 = "...Ай! Погоди! Мыло попало мне в глаз!"
70001030-114 = "Нельзя мыть мне волосы понежнее?! Я тебя репрессирую!"
70001030-115 = "Репрессировать..."
70001030-116 = "Прошу прощения. Я не понимаю значение слова «репрессировать». Повторная активация функции автоматического купания."
70001030-117 = "Что это за ИИ, который даже репрессии проводить не умеет?"
70001030-118 = "Хватит! Я сама вымою волосы, отпусти меня!"
70001030-119 = "Внимание. Покидать ванну при активных роботизированных руках травмоопасно."
70001030-120 = ""
70001030-123 = "...Активация режима удержания ради безопасности пользователя."
70001030-124 = "А...? Почему роботизированные руки держат меня на месте?"
70001030-125 = "Отпустите! Я закончила купаться!"
70001030-126 = "Для правильного купания рекомендуется не менее 5 минут расслаблять кожу в горячей воде перед намыливанием."
70001030-127 = "Правильное нанесение мыла также должно включать участки, которыми обычно пренебрегают, включая области за ушами и запястья."
70001030-128 = "Стой! Прекрати! Приказываю остановиться!"
70001030-129 = "Обнаружено резкое учащение пульса пользователя..."
70001030-130 = "Активация классической музыки для успокаивающего купания..."
70001030-131 = ""
70001030-138 = "Стойте!"
70001030-139 = ""
70001030-143 = "Некоторое время спустя..."
70001030-144 = ""
70001030-145 = ""
70001030-146 = ""
70001030-147 = ""
70001030-148 = "Ох, президент Черина. Вы долго купались."
70001030-149 = "Вы похожи на чихуахуа, свалившуюся в ванну с пеной... На самом деле довольно мило."
70001030-150 = "..."
70001030-151 = "А кожа такая мягкая! Наверное, вы специально уделили побольше времени тщательному мытью."
70001030-152 = "Я в восторге, что вам понравились новые купальные помещения, которые мы импортировали из академии Миллениум."
70001030-153 = "—прессировать..."
70001030-154 = "...Хм?"
70001030-156 = "...Всех ответственных за эту ванну репрессировать!"
70001030-158 = "Вскоре совершенно новые купальные помещения, разработанные Инженерным отделом, были насильно демонтированы, а контрреволюционных саботажниц Спецотряда №227 прогнали обратно в Бывший институт..."
70001030-159 = "Из-за этого между Миллениум и академией Красная Зима некоторое время были дополнительные проблемы, но это уже история для другого раза..."
70001030-161 = "Термы Акай"
