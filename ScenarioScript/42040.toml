42040-118 = "Разве моё имя что-то изменит? Ты шла на операцию с мыслью: «Я из SRT. Справлюсь с чем угодно». Лениво. Недисциплинированно. Всегда рассчитывай на худший сценарий."
42040-119 = "Даже лучший и самый опытный ветеран может погибнуть на поле боя от случайной пули."
42040-120 = "Храбрые воины здесь долго не живут. Хороший спецназовец ведёт себя трусливо. Иначе умрёшь."
42040-121 = "Постой. Я знаю этот голос... Н-Не может быть."
