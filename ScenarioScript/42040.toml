[translation]
42040-1 = "Episódio 4;Reencontro Inesperado"
42040-3 = "...Aqui é RABBIT 1. Hora atual: 1625."
42040-4 = "Rastreamos o sinal de GPS da RABBIT 3 e localizamos o suspeito que invadiu o Ponto S. Chegamos à área-alvo."
42040-5 = "No Ponto R, nosso ponto de descida, está chovendo no momento,#ne a visibilidade está limitada a menos de 500 m. Tenham cuidado."
42040-6 = "A-Aqui é RABBIT 4... Graças à chuva, não parece haver pedestres..."
42040-7 = "Também não há combatentes de emboscada... Desta posição, consigo acertar qualquer ponto..."
42040-8 = "Entendido. Em seguida, RABBIT 2, solicito relatório."
42040-9 = "Aqui é RABBIT 2. Sabotei o circuito fechado do lado externo do prédio.#nCom isso, o alarme não deve disparar por um tempo."
42040-10 = "Porém..."
42040-11 = "RABBIT 2, algum problema?"
42040-12 = "Não, não é bem um problema... É que esse prédio me parece estranhamente familiar."
42040-14 = "Não é impressão sua? Não tem nenhum registro de operação nossa por aqui."
42040-15 = "Disso eu sei. Não é isso...#nÉ a \"estrutura\" deste prédio que me parece familiar."
42040-16 = "Três rotas de entrada e um interior labiríntico de três andares...#nNão parece exatamente a arena de combate fechado das instalações de treinamento da SRT?"
42040-17 = "Hehehe, agora que você falou, é igualzinho mesmo."
42040-19 = "Eu estava achando estranho me sentir tão calma em território inimigo, então era por isso..."
42040-20 = "Sim. Justamente por ser um ambiente familiar,#nconseguiremos manter a calma e reagir mesmo diante de imprevistos."
42040-21 = "Mas essa estrutura é desfavorável para quem ataca.#nMesmo nos simulados da academia, a taxa de vitória da defesa era sempre maior, então fico um pouco apreensiva..."
42040-22 = "Saki, por que está amarelando? Nós somos da SRT, esqueceu?"
42040-23 = "Mesmo que o inimigo tenha armas desconhecidas, é só esmagar tudo com poder de fogo, hehe..."
42040-24 = "...É verdade. Além disso, nem a elite da PMC conseguiu fazer nada contra nós..."
42040-25 = "Deixem o apoio de retaguarda comigo... Vai dar tudo certo, nós conseguimos."
42040-26 = "Então, vamos iniciar a invasão. RABBIT 2, para o ponto da operação!"
42040-31 = "Arrombamento."
42040-36 = "Rota de entrada, garantida!"
42040-37 = "RABBIT 1, entrando no prédio!"
42040-41 = "...Setor A, limpo."
42040-42 = "Setor B, limpo!"
42040-43 = "Seguindo direto para o Setor C!"
42040-47 = "(...Estranho. Já avançamos tanto aqui dentro e ninguém apareceu ainda.)"
42040-48 = "(Não parece haver armadilhas nem nada do tipo... mas sinto que estamos deixando passar alguma coisa...)"
42040-49 = "Aqui é RABBIT 2.#nRABBIT 1, há uma barricada montada logo à frente e não dá para passar.#nO que fazemos? Rompemos por aqui mesmo?"
42040-53 = "Não, fazer muito barulho corre o risco de revelar nossa posição ao inimigo.#nVamos contornar."
42040-54 = "Entendido. Pelo corredor central que está aberto, então..."
42040-55 = "RABBIT 2, continue a operação—"
42040-59 = "Argh...!"
42040-63 = "Esse disparo agora?!"
42040-64 = "RABBIT 2, responda! RABBIT 2!"
42040-65 = "A comunicação... caiu...?"
42040-66 = "RABBIT 4, solicito informações de observação! RABBIT 3, verifique os dados de GPS!"
42040-70 = "...Bloqueio de sinal?"
42040-71 = "(Nessa situação... não vou conseguir pedir apoio nem à RABBIT 2 nem às outras integrantes do esquadrão.)"
42040-72 = "(Emboscou a vanguarda ao mesmo tempo em que ativou um bloqueador para cortar a comunicação,#nisolando cada integrante da unidade...)"
42040-73 = "(Neutralizar o oponente sob silêncio de rádio exige um trabalho em equipe de altíssimo nível...#nNão é algo que mercenários ou alunas comuns conseguiriam fazer...)"
42040-74 = "(Primeiro, preciso resgatar a RABBIT 2...)"
42040-83 = "(Uma emboscada?! Desde quando...?!)"
42040-85 = "..."
42040-97 = "(Droga... o corredor é estreito demais, minha arma principal está atrapalhando...)"
42040-98 = "(Não estou acostumada com combate corpo a corpo, mas não tenho escolha...)"
42040-102 = "(Primeiro, vou desequilibrar o centro de gravidade dela—)"
42040-103 = "...FOXTROT."
42040-104 = "(...! Não pode ser, uma granada de luz—)"
42040-113 = "...1,5 segundo. Mesmo considerando o estresse causado pelo estrondo e pelo clarão, sua reação foi lenta."
42040-114 = "Reconheço que você entrou no alcance seguindo o manual de CQB,#nmas, naquela situação, dar uma cabeçada teria sido melhor do que recuar a mão conforme a cartilha."
42040-115 = "Argh...!"
42040-116 = "Melhor não se mexer à toa. Vai acabar quebrando o braço."
42040-117 = "Quem é você...?#nNão parece ser uma mercenária nem traficante de armas..."
42040-118 = "...Em uma operação, o importante não é a identidade do oponente.#nÉ se preparar para o pior cenário."
42040-119 = "Mesmo uma veterana equipada com o melhor armamento pode ser neutralizada por uma única bala perdida no campo de batalha."
42040-120 = "Por isso, exige-se que forças especiais ajam com a cautela de um covarde."
42040-121 = "Essa voz... não pode ser..."
42040-122 = "Quanto tempo, líder de esquadrão Tsukiyuki."
42040-127 = "...Fico feliz em reencontrá-la."
42040-128 = "Yukino-senpai...?!"
42040-130 = "Próximo;A Sombra das Veteranas"
