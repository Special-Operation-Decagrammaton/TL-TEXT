[translation]
42040-1 = "Эпизод 4;Неожиданная встреча"
42040-3 = "RABBIT 1 докладывает. Время 16:25."
42040-4 = "Мы проследили GPS-сигнал, который RABBIT 3 использовала для определения местоположения подозреваемого, проникшего в точку «Сьерра». Подтверждаю прибытие."
42040-5 = "В точке высадки «Ромео» идёт дождь, видимость около 500 метров. Всем подразделениям соблюдать осторожность."
42040-6 = "Эм, э-это RABBIT 4... К счастью, из-за погоды здесь сейчас почти никого..."
42040-7 = "Скрытых врагов нет... Непосредственной угрозы засады тоже... И если что-то случится, позиция у меня хорошая..."
42040-8 = "Принято. RABBIT 2, доклад."
42040-9 = "RABBIT 2 на связи. Цепи перерезаны. Датчики сигнализации отключены... пока что."
42040-10 = "Но знаете..."
42040-11 = "Проблема, RABBIT 2?"
42040-12 = "Не совсем, но... это здание никому больше не кажется знакомым?"
42040-14 = "Тебя током ударило, пока цепи резала? Мы здесь никогда не проводили операций, дурочка."
42040-15 = "Я не это имела в виду! Просто... планировка? Не знаю, сама структура кажется знакомой."
42040-16 = "Похоже на полигон для боя в помещениях тренировочного комплекса SRT, правда? Три этажа и входы... И когда я смотрела чертежи от Моэ, лабиринт внутри тоже показался знакомым."
42040-17 = "Хи-хи. И правда немного знакомо. Хотя на учениях по нам бы уже давно стреляли."
42040-19 = "П-Пожалуйста, не сглазь... но мне спокойнее от того, что мы вроде уже делали нечто подобное."
42040-20 = "Верно. Раз местность знакома, нам будет проще прогнозировать и адаптироваться в столкновениях."
42040-21 = "Но здания с такой планировкой обычно проще оборонять. На наших учебных боях защитники чаще имели преимущество, поэтому я немного нервничаю..."
42040-22 = "Ха! Великая и страшная «мы элитные агенты SRT» Саки боится? Да ладно!"
42040-23 = "Какая разница, какая у них оборона и оружие? Сделаем как всегда. Проще простого."
42040-24 = "Уф, подумать только, меня пришлось подбадривать ТЕБЕ. Ладно! Ладно! Если нас не смогли победить элитники ЧВК, вооружённые до зубов, кто сможет?"
42040-25 = "И-и я буду прикрывать вас сзади...!"
42040-26 = "Нужно просто работать вместе. RABBIT 2, все остальные — на позиции! Пошли!"
