[translation]
1009205-1 = "Выступление для одного"
1009205-4 = "Я отправился к месту встречи и стал искать Ёшими."
1009205-5 = ""
1009205-10 = "Открыв дверь, я увидел пустую комнату с выключенным светом."
1009205-11 = ""
1009205-14 = "[ns1] «Ёшими, ты здесь...?»\n[ns2] Найти и включить свет."
1009205-15 = ""
1009205-16 = ""
1009205-20 = ""
1009205-22 = "...Фух."
1009205-23 = "Вот вы где, Сенсей. Я вас ждала."
1009205-24 = ""
1009205-27 = "[ns3] «Ёшими?»\n[ns4] «Что вообще происходит...?»"
1009205-30 = "Происходит то, что я сейчас буду играть."
1009205-31 = "Я усердно тренировалась, пальцы чуть не стёрла, но..."
1009205-32 = ""
1009205-34 = ""
1009205-35 = "Меня всё равно трясёт. Я впервые играю перед зрителем."
1009205-36 = "А?"
1009205-37 = "Мне обязательно это вслух говорить?!"
1009205-38 = ""
1009205-40 = ""
1009205-41 = "*вздыхает*"
1009205-42 = "Ну же, Сенсей. Не заставляйте меня разжёвывать очевидное."
1009205-43 = "Вы же умеете чувствовать обстановку. Правда хотите вести себя вот так?"
1009205-44 = "Девушка только взяла в руки гитару и наконец смогла сыграть песню целиком. Поэтому позвала кого-то показать, над чем тренировалась."
1009205-45 = "Теперь вы понимаете, что здесь происходит?"
1009205-46 = "Я специально всё это организовала... так что просто слушайте."
1009205-47 = "Я совершенно серьёзно."
1009205-48 = ""
1009205-51 = "[ns5] «...Я понял.»\n[ns6] Замолчать и сесть."
1009205-52 = ""
1009205-53 = ""
1009205-56 = "...Фух. Хорошо."
1009205-57 = "Ничего себе, я сказала вам, что делать, и вы сделали. Сегодня столько «первых разов», и из-за каждого я нервничаю ещё сильнее."
1009205-58 = "Та-а-ак..."
1009205-59 = "А?"
1009205-60 = "Что за песня?"
1009205-61 = "Типа тренировочной для группы...?"
1009205-62 = "Нет-нет, эта совсем другая. Настолько другая, что остальные её ещё не слышали."
1009205-63 = "Я сама её выбрала..."
1009205-64 = ""
1009205-66 = ""
1009205-67 = ""
1009205-68 = "...Стоп."
1009205-69 = "Не спрашивайте, как она называется и откуда, потому что я всё равно не скажу."
1009205-70 = "Просто сосредоточьтесь на музыке, ладно?"
1009205-71 = ""
1009205-73 = ""
1009205-78 = ""
1009205-79 = "...Хорошо, начинаем. Собралась."
1009205-80 = "...*вдох*... *выдох*..."
1009205-81 = "...Фух..."
1009205-82 = "...Хм-м..."
1009205-83 = "Хм..."
1009205-84 = ""
1009205-86 = ""
1009205-87 = "М-м-м...!!!"
1009205-88 = ""
1009205-90 = "...Не могу."
1009205-91 = ""
1009205-95 = "[ns7] «Почему ты села?»\n[ns8] «Не нужно так нервничать.»"
1009205-99 = "Сенсей. Простите, но я лучше сяду, как на репетиции, чем буду стоять и всё испорчу."
1009205-100 = "Может, это будет выглядеть немного неловко... но надеюсь, вы поймёте."
1009205-101 = "Та-а-ак..."
1009205-102 = ""
1009205-104 = ""
1009205-105 = ""
1009205-106 = "...Теперь точно."
1009205-107 = ""
1009205-109 = ""
1009205-112 = "В комнате воцарилась тишина. Единственным звуком была гитара Ёшими."
1009205-113 = "Ни усилителей, ни колонок не было, поэтому пришлось вслушиваться."
1009205-114 = "И, что удивительно..."
1009205-115 = ""
1009205-118 = "...играла она очень хорошо."
1009205-121 = "― [log=요시미 밴드]Фух... Фух...[/log][wa:1400]"
1009205-124 = "― [log=요시미 밴드]...Д-Да...[/log][wa:990]"
1009205-126 = "― [log=요시미 밴드]Я смогла...[/log]"
1009205-129 = "[ns9] «Потрясающее выступление.»\n[ns10] «...Вот это было по-настоящему.»"
1009205-130 = "― [log=요시미 밴드]П-Правда...?[/log][wa:910]"
1009205-131 = "― [log=요시미 밴드]П-Правда...?[/log][wa:910]"
1009205-133 = "― [log=요시미 밴드]Сенсей, для вас это тоже было... так...? [/log][wa:10]"
1009205-136 = "― [log=요시미 밴드]Вы ведь не просто подыгрываете мне?[/log][wa:10]"
1009205-138 = "― [log=요시미 밴드]Это... правда, да? [/log][wa:820]"
1009205-141 = "― [log=요시미 밴드]Такое чувство... Сердце колотится...[/log][wa:1530]"
1009205-144 = "― [log=요시미 밴드]Я впервые чувствую что-то подобное...[/log][wa:10]"
1009205-147 = "― [log=요시미 밴드]...Сенсей...[/log][wa:490]"
1009205-150 = "― [log=요시미 밴드]Если оглянуться назад, [/log]"
1009205-152 = "― [log=요시미 밴드]думаю, я впервые показала Сенсею... [/log][wa:10]"
1009205-155 = "― [log=요시미 밴드]Как бы сказать...? Эм...[/log][wa:2070]"
1009205-158 = "― [log=요시미 밴드]...Свою «крутую» сторону... Да, точно.[/log][wa:1270]"
1009205-162 = "...Ладно, ладно! Всё!"
1009205-163 = "Больше играть не буду. Концерт окончен!"
1009205-164 = ""
1009205-166 = ""
1009205-167 = "П-Пойдёмте! Ничего особенного, просто мне не хотелось большой публики на первом выступлении! Вот и всё, ничего особенного!"
1009205-168 = "Так что давайте просто..."
1009205-169 = ""
1009205-171 = ""
1009205-172 = "А? Что вы сказали?"
1009205-173 = ""
1009205-175 = ""
1009205-176 = "Е-Ещё раз...? На бис...?"
1009205-177 = "О чём вы вообще? Мне не нужно играть... Нет, забудьте..."
1009205-178 = "Я просто хотела показать вам свою первую песню! Бис ведь ничего не будет значить, да?"
1009205-179 = "[s11] «Я бы с радостью услышал и вторую или третью песню.»\n[s12] «Твой первый бис? Это много значит.»"
1009205-182 = "*ахает*"
1009205-183 = "Тц... Ургх...! Угхх!!"
1009205-184 = "Мой тупой, тупой рот! Надо было просто заклеить его скотчем до того, как я сюда пришла!"
1009205-185 = ""
1009205-187 = ""
1009205-188 = "Р-р-ргх!!"
1009205-189 = "*вдох* Хорошо. Значит, вот как..."
1009205-190 = ""
1009205-192 = ""
1009205-193 = "...Хорошо."
1009205-194 = "Ладно, сыграю, раз вы хотите. Всё равно здесь только мы двое."
1009205-195 = "Вы ведь тоже нечасто такое делаете, да? Думаю, что нет."
1009205-196 = "Приготовьтесь. И помните: я это так просто не оставлю."
1009205-197 = "Хорошо, Сенсей. Все ваши «первые разы»..."
1009205-198 = ""
1009205-200 = ""
1009205-201 = ""
1009205-202 = "...отныне я заберу себе."
1009205-204 = "После этого я прослушал все песни, которые Ёшими могла сыграть с ходу."
1009205-205 = ""
1009205-208 = "Несмотря на все возражения, она играла усердно и сосредоточенно, пока совсем не вымоталась."
