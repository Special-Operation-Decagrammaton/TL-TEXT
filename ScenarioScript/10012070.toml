[translation]
10012070-1 = "Эпизод 7; Слегка слишком большой круг"
10012070-4 = "Утро наступило слишком быстро."
10012070-5 = "Я проснулся от ощущения тёплых солнечных лучей."
10012070-6 = "Наконец-то проснулись, Сенсей."
10012070-7 = "Я знаю, вы поздно легли, но уже почти время обеда."
10012070-8 = "Или вы просто соня, которая любит отсыпаться по выходным?"
10012070-9 = "[s1] «...Хошино?»\n[s2] «Где все?»"
10012070-10 = "Сенсей, приём! Вы всё ещё спите?"
10012070-11 = "Сразу к делу, да?"
10012070-12 = "Остальные встали ни свет ни заря и пошли чинить вертолёт."
10012070-13 = "Почему я не помогаю?"
10012070-14 = "Хи-хи. Мне поручили очень важную задачу — защищать вас. Бандиты в шлемах не возвращались, но мало ли."
10012070-15 = "Я не бездельничала, ясно?"
10012070-16 = "Так что теперь, когда вы проснулись..."
10012070-17 = "...время поспать."
10012070-18 = "[s3] «А как же твоя серьёзная миссия?!»\n[s4] «Я знал, что этим всё закончится.»"
10012070-19 = "Не жадничайте, Сенсей! Будем дежурить по очереди."
10012070-20 = "Не жадничайте, Сенсей! Будем дежурить по очереди."
10012070-21 = "Я не забыла, как вы вчера бросили меня на растерзание. Теперь должны загладить вину."
10012070-22 = "Давайте ещё совсем немного побездельничаем, прежде чем пойдём к остальным, хорошо?"
10012070-23 = "И если они вдруг вернутся раньше, пожалуйста, разбудите меня."
10012070-24 = "Хех. Спокойной ночи, Сенсей."
10012070-25 = ""
10012070-27 = ""
10012070-28 = ""
10012070-29 = ""
10012070-30 = "Хр-р..."
10012070-31 = "[s5] «...Спи спокойно, Хошино.»\n[s6] «Я побуду твоим будильником.»"
10012070-32 = "М-м-м... Хр-р-р..."
10012070-33 = "М-м-м... Хр-р-р..."
10012070-35 = "Я смотрел, как волны накатывают и отходят, пока Хошино спала."
10012070-36 = "Наконец, примерно к обеду, я решил, что пора."
10012070-38 = "[ns7] Слегка потрясти Хошино.\n[ns8] «Просыпайся, Хошино.»"
10012070-39 = "М-м-м... Сенсей... Ещё... пять минут..."
10012070-40 = "М-м-м... Сенсей... Ещё... пять минут..."
10012070-41 = "[s] «Ты сама сказала тебя разбудить.»"
10012070-42 = ""
10012070-45 = "[ns] «...?»"
10012070-47 = "Система защиты курорта активирована. В зоне обнаружено несанкционированное передвижение вооружённого судна."
10012070-48 = "Гости, немедленно укройтесь в помещениях. Повторяю. Немедленно укройтесь в помещениях."
10012070-49 = "Хм... Это мой будильник...?"
10012070-50 = "Автоматическая система обороны активирована. Открытие орудийного порта."
10012070-52 = "М-м-м... никаких орудийных портов..."
10012070-53 = "П-Погоди? Орудия?!"
10012070-54 = "Сенсей? Что происходит?"
10012070-55 = "Я всё ещё сплю? На нас напал Кракен? По всему острову появляется артиллерия."
10012070-56 = "[s9] «Система защиты обнаружила нарушителя.»\n[s10] «Кажется, кто-то вторгается.»"
10012070-57 = "Нарушитель? Кто...?"
10012070-58 = "Вторгается? Кто...?"
10012070-64 = "<Системное сообщение>"
10012070-66 = "Внимание. Территория"
10012070-69 = "<Системное сообщение>"
10012070-70 = "Внимание. Территория под юрисдикцией курорта"
