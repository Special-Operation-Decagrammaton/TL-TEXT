10012070-76 = "Внимание. Территория под юрисдикцией курорта сейчас подвергается"
10012070-78 = ""
10012070-79 = "Внимание. Территория под юрисдикцией курорта подвергается атаке."
10012070-82 = "<Системное сообщение>"
10012070-84 = "Начало"
10012070-86 = "контрмер."
10012070-91 = "Эм..."
10012070-92 = ""
10012070-94 = ""
10012070-95 = "Сенсей, там далеко в океане."
10012070-96 = "Видите тот гигантский круг? Хотя... при таком размере это вообще ещё круг?"
10012070-97 = "Мне кажется или он направляется прямо на нас?"
10012070-98 = "Погоди... Это...!"
10012070-100 = "...Ах."
10012070-102 = "Наконец-то! Сенсей, я вас нашла!"
10012070-103 = "Ждите меня, мой дорогой!"
10012070-104 = ""
10012070-110 = ""
10012070-111 = "...Ох, вдвойне плохо."
10012070-115 = "Вон там, у берега!"
10012070-116 = ""
10012070-119 = "*ахает*"
10012070-120 = "Ч-Что это? Что там вообще происходит?!"
10012070-121 = "Как им удалось раздобыть судно на воздушной подушке?"
10012070-123 = "Меня больше беспокоит то, что на борту. Похоже, там все их силы."
10012070-124 = "Рано или поздно они всё равно должны были вернуться, да?"
10012070-125 = "Хватит анализировать ситуацию, идите помогать! Система защиты курорта долго не выдержит!"
10012070-126 = ""
10012070-136 = "С-Система уже отключилась. У неё не было ни шанса."
10012070-137 = "Вот именно! Наши друзья в опасности! Мы что, будем просто стоять и смотреть?!"
10012070-138 = "Я не это имею в виду, Серика. Мы не сможем помочь, если у нас нет способа уничтожить такую тяжёлую технику."
10012070-139 = ""
10012070-141 = ""
10012070-143 = ""
10012070-144 = ""
10012070-146 = ""
10012070-147 = "...Тяжёлая техника?"
10012070-148 = "Аяне?"
10012070-149 = "Может, у нас всё-таки есть способ помочь! У нас есть собственный козырь."
10012070-150 = "Ремонт ещё не закончен, но..."
10012070-151 = "Мы обязаны хотя бы попробовать!"
10012070-153 = "Попробовать? Что именно?"
10012070-154 = "...О! Поняла! ☆"
10012070-155 = "Ты права! Мы и так почти закончили ремонт."
10012070-156 = "Отлично придумано, Аяне."
10012070-157 = "Ага, ага! С мозгами Аяне за нами мы справимся с чем угодно."
10012070-158 = "Остался только мелкий ремонт! Мы справимся!"
10012070-159 = "К тому же... этот курорт просто усыпан оборонительным вооружением."
10012070-160 = ""
10012070-162 = ""
10012070-163 = "Хи-хи. Почему бы нам немного не прокачать наш вертолёт?"
