[translation]
10031080-1 = "Эпилог;Начало вечеринки"
10031080-2 = "После того как все проблемы были решены, Особая вечеринка Геенны наконец началась как следует."
10031080-3 = ""
10031080-5 = ""
10031080-6 = "Хорошо. Сенсей, Ако, я скоро вернусь."
10031080-7 = "Да! У-Удачи, глава!"
10031080-8 = ""
10031080-10 = ""
10031080-12 = ""
10031080-13 = "[ns] «Удачи, Хина.»"
10031080-14 = ""
10031080-16 = ""
10031080-17 = ""
10031080-18 = "Уф! С-Сорасаки Хина... Ты...!"
10031080-19 = "Я бросила на тебя столько отвлекающих факторов, и всё равно ты добралась сюда."
10031080-20 = "Давай, Хина! Это было так круто!"
10031080-21 = "И-Ибуки?!"
10031080-22 = ""
10031080-24 = ""
10031080-26 = ""
10031080-27 = "Просто признай это, Макото... Общество Пандемониума... нет, ты проиграла."
10031080-28 = ""
10031080-30 = ""
10031080-32 = ""
10031080-33 = "Хаха! Точно подмечено, Ироха!"
10031080-34 = "Ну, с Макото всегда так."
10031080-36 = "Нет! Это ещё не конец! Ещё нет!"
10031080-37 = "Хина никак не могла успеть подготовиться к концерту!"
10031080-38 = "...Она просто делает храброе лицо! Она не умеет играть! Она опозорится! Все это знают!"
10031080-39 = "Похоже, отрицание у нас тут глубокое, как река..."
10031080-40 = ""
10031080-41 = "..."
10031080-42 = ""
10031080-43 = "(Я усердно тренировалась...)"
10031080-44 = "(Чтобы оправдать твои ожидания...)"
10031080-45 = "(Так что в каком-то смысле эта песня для тебя...)"
10031080-46 = ""
10031080-47 = ""
10031080-48 = "...Я постараюсь изо всех сил."
10031080-49 = ""
10031080-51 = ""
10031080-61 = ""
10031080-63 = ""
10031080-65 = ""
10031080-67 = ""
10031080-69 = ""
10031080-74 = "[ns] «...Это было потрясающе.»"
10031080-75 = ""
10031080-76 = ""
10031080-77 = ""
10031080-78 = "...Ургх! О-Она меня сделала!"
10031080-79 = "Как она может так играть?! Наша разведка клялась, что она не умеет играть на пианино!"
10031080-80 = "Стоп, а вдруг эти сведения были фальшивыми? Контрразведка, чтобы ввести нас в заблуждение!"
10031080-81 = "Д-Дисциплинарная комиссия! Когда вы уже перестанете рушить мои планы?! Что нужно сделать, чтобы вы наконец успокоились?!"
10031080-82 = "[s] «Макото... Ты сама построила сцену и сама поставила её туда...»"
10031080-83 = "Ага, Макото. Ты сама напросилась."
10031080-84 = "*ахает* Я-я правда?! Аргх!!!"
10031080-85 = ""
10031080-87 = ""
10031080-88 = ""
10031080-90 = ""
10031080-91 = "...Фух."
10031080-92 = ""
10031080-94 = ""
10031080-95 = ""
10031080-96 = "Глава, это было потрясающе!"
10031080-97 = ""
10031080-99 = ""
10031080-101 = ""
10031080-102 = "Когда вы успели так хорошо научиться играть на пианино?!"
10031080-103 = "Ваше выступление было по-настоящему прекрасным."
10031080-104 = ""
10031080-106 = ""
10031080-107 = ""
10031080-108 = "А... да. Спасибо... Всем вам."
10031080-109 = "Я успела добраться вовремя. Каким-то образом."
10031080-110 = "[s] «Ты была великолепна, Хина. Твоя музыка правда тронула меня.»"
10031080-111 = "А, С-Сенсей..."
10031080-112 = "К-Конечно. Если вам понравилось, значит, все усилия были не зря."
10031080-113 = "Спасибо. Правда."
10031080-114 = "[s1] «Не благодари меня. Это ты разбиралась со всеми этими делами и всё равно находила время на репетиции.»\n[s2] «Ты нормально себя чувствуешь? Ты ведь не слишком себя загнала?»"
10031080-117 = "Хм?"
10031080-118 = "Наверное, было занято, но не сказать, что мне пришлось уж слишком себя загонять."
10031080-119 = "[s] «Слово „занято“ звучит слишком мягко, если говорить о последних нескольких днях...»"
10031080-120 = "А, вы про схемы Макото."
10031080-121 = "Ну... Они были немного тяжеловаты..."
10031080-122 = "Но Общество Пандемониума постоянно творит что-то подобное. Ничего особенного. В общем, всё как обычно."
10031080-123 = "Ага. Макото регулярно устраивает такие погромы."
10031080-124 = "[s] «...Эм, и как часто это происходит?»"
10031080-125 = "Я бы сказала..."
10031080-126 = "Примерно четыре раза в год?"
10031080-128 = ""
10031080-129 = "Это часть повседневной жизни здесь, в Геенне."
10031080-130 = "Я бы даже начала беспокоиться, если бы председатель ничего не замышляла."
10031080-131 = "[s] «Геенна — страшное место!»"
10031080-133 = "Итак... Почему мы стоим и тратим время на разговоры? Это ведь вечеринка."
10031080-134 = "Не желаете составить мне компанию, Сенсей?"
10031080-135 = "[s] «С удовольствием.»"
10031080-136 = "Фуфу. Тогда..."
10031080-137 = ""
10031080-139 = ""
10031080-140 = ""
10031080-141 = ""
10031080-142 = "Ведите, Сенсей."
10031080-144 = "После недели сплошных неприятностей Геенна всё же получила великолепную вечеринку. Весело было всем."
10031080-145 = "Купаясь в сиянии их серенады"
