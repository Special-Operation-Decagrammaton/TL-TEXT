[translation]
61030-1 = "Эпизод 3;Новое Начало"
61030-6 = "Д-Добро пожаловать, Сенсей."
61030-7 = "Итак... это наша комната..."
61030-8 = ""
61030-9 = "[ns1] «Так что происходит?»\n[ns2] «Не стесняйся!»"
61030-12 = "Ай! Стой! Я забыла!"
61030-13 = "Забыла что? А...!"
61030-14 = "С-С-С-Сенсей! Нам очень жаль..."
61030-15 = "Но вы можете подождать снаружи? Всего пять минут!"
61030-16 = "Понимаю, это, наверное, выглядит странно!"
61030-17 = "Но пожалуйста, всего пять минут!"
61030-19 = "Я решил сделать, как они попросили, и вышел в коридор."
61030-20 = "Через некоторое время..."
61030-21 = ""
61030-24 = "М-Можете заходить! То есть, пожалуйста, заходите!"
61030-25 = ""
61030-29 = ""
61030-31 = "[ns] «Эм...?!»"
61030-32 = "З-Здравствуйте ещё раз, Сенсей."
61030-33 = "Мы не хотели вас пугать! На самом деле мы совсем не желаем вам зла!"
61030-34 = "Полагаю, по меркам Тринити нас можно назвать переводными студентами из Ариус?"
61030-35 = ""
61030-36 = "[ns] «А...!»"
61030-43 = ""
61030-44 = "Вы можете не помнить про Мадам и всё, что случилось... но однажды она просто полностью исчезла!"
61030-45 = "Мы были рады, что её больше нет, но одновременно совершенно не понимали, что делать. Напряжение чувствовалось повсюду. Что станет с Ариус?"
61030-46 = "Но именно тогда мы встретили... их."
61030-49 = "...Здесь должно подойти."
61030-50 = ""
61030-52 = ""
61030-53 = "В-Ваша форма...?!"
61030-54 = "Т-Тринити?!"
61030-55 = ""
61030-57 = ""
61030-58 = "Пожалуйста, тише. Да-да, я оттуда. Не хотела вас пугать."
61030-59 = "Вообще-то мне полагалось надеть форму Чайная партия вместо этой, но..."
61030-61 = "«Чаепитие»...?"
61030-62 = "Что... это?"
61030-64 = "..."
61030-65 = "Это что-то вроде... клуба в Тринити, где очень ценят чаепития."
61030-66 = ""
61030-67 = "Что?! Мы можем перевестись... в Тринити?!"
61030-68 = "Но для нас... Тринити..."
61030-70 = "Да. Я понимаю, почему вы так реагируете."
61030-71 = "Клянусь, я ни в коем случае не пытаюсь на вас давить. Я лишь протягиваю руку как... один из вариантов."
61030-72 = "Вы можете принять её и начать новую жизнь в Тринити."
61030-73 = "Но не обязаны. Что бы вы ни захотели сделать, выбор за вами."
61030-74 = "Просто... всё это так внезапно."
61030-75 = "Понимаю. Более того, уверена, этого вы ожидали меньше всего. Не нужно отвечать сразу."
61030-76 = "В Тринити и Чайная партия есть люди, которые искренне хотят преодолеть пропасть между нами. Их немного, но достаточно."
61030-77 = "А значит, сделать всё слишком публично будет... трудно."
61030-78 = "Даже если мы сможем перевестись... и даже если найдутся люди, которые нас примут..."
61030-79 = "Остальные студенты... нормально к нам отнесутся?"
61030-80 = "Вот вы и добрались до самой сути проблемы. Тринити — объединение бесчисленных фракций и клубов."
61030-81 = "Если всё же решите пойти с нами, в документах вас обозначат как «переводных студентов из другой школы». Скажем, что вы приехали из далёкой сельской местности."
61030-82 = "В нынешней ситуации это лучшее, что мы можем сделать."
61030-83 = ""
61030-85 = ""
61030-86 = ""
61030-87 = "..."
61030-88 = "..."
61030-90 = "Я серьёзно говорила, что можете не торопиться."
61030-91 = ""
61030-93 = ""
61030-94 = "Обдумайте всё, и если решите приехать, позвоните по этому номеру."
61030-95 = ""
61030-97 = "..."
61030-98 = "..."
61030-100 = "Мы думали."
61030-101 = "Мы очень, очень, очень долго думали."
61030-102 = "Всё было неопределённо. Наша ситуация, Ариус, Тринити и..."
61030-103 = ""
61030-106 = "Но сколько бы мы ни думали, всё равно казалось: что угодно будет лучше того, что у нас было."
61030-107 = ""
61030-110 = ""
61030-111 = ""
61030-112 = ""
61030-113 = ""
61030-114 = ""
61030-115 = "[ns] «И в итоге вы оказались здесь...»"
61030-116 = "Есть..."
61030-117 = "И-И ещё много других студентов Ариус тоже перевелись..."
61030-118 = "Хотя в основном это первокурсницы и второкурсницы..."
61030-119 = ""
61030-120 = "[ns3] «Понятно... Какой тяжёлый путь.»\n[ns4] «...Тебе пришлось многое пережить.»"
61030-123 = "Н-Ничего такого. Честно говоря, всё это до сих пор кажется ненастоящим."
61030-124 = "В Ариус... даже собственное одеяло было недостижимой мечтой."
61030-125 = "А здесь у меня есть кровать! Такая мягкая... и пушистая... Хи-хи."
61030-126 = "Ну, в Ариус кровати были, но пользоваться ими нам не разрешали. Потому что комфорт мог сделать нас слабыми."
61030-127 = ""
61030-129 = ""
61030-131 = "[ns] «...Простите меня, обе»."
61030-134 = "Я склонил голову перед двумя девушками в знак извинения."
61030-135 = "Ч-Что?! П-П-Почему вы извиняетесь, Сенсей?"
61030-136 = "В-Верно! В каком-то смысле именно благодаря вам мы вообще здесь оказались..."
61030-137 = "[s] «Мне не следовало оставлять Ариус без внимания после всего случившегося»."
61030-138 = "В-Всё равно! Когда вы такое говорите, мы..."
61030-139 = "Мы не ради этого вас сюда позвали!"
61030-141 = "Потрясённый тем, что увидел студентов Ариус в Тринити, я совсем забыл, что они хотели о чём-то меня спросить."
61030-142 = ""
61030-143 = "Ч-Что мы хотели обсудить?#nА! Я так рада, что наконец можем спросить."
61030-144 = "Так вот, эм... Наш вопрос..."
61030-145 = "Что такое «Комплексный экзамен»?"
61030-146 = "[s] «...А?»"
61030-147 = "Вообще-то, если точнее, я хотела спросить, что такое «экзамен» в принципе."
61030-148 = "В Ариус мы не учились на таких «уроках»..."
61030-149 = "И мы не думали, что можем спросить студентов Тринити."
61030-150 = "Они все выглядели так, будто прекрасно знают, что это такое, и никому не надо объяснять..."
61030-151 = "Вот почему мы надеялись, что вы нам поможете, Сенсей!"
61030-152 = "Вы ведь учитель, правда?"
61030-153 = ""
61030-154 = "[ns] «...Понял. Теперь ясно»."
61030-156 = "[ns] «Мы ведь впервые встречаемся, да?»"
61030-157 = "Хм? Конечно..."
61030-158 = "Ведь... мы всё-таки из Ариус..."
61030-159 = "Нам не стоит так плохо говорить о себе...?"
61030-160 = "Э-Эм. Мы можем постараться. Хотя бы при вас."
61030-161 = ""
61030-163 = ""
61030-164 = ""
61030-165 = ""
61030-166 = "Ай...?!"
61030-167 = "И-и...!"
61030-169 = "Не думая, я протянул руки и погладил их по головам."
61030-170 = "Студенты Ариус отшатнулись в страхе, инстинктивно съёжившись перед моими протянутыми руками."
61030-171 = ""
61030-177 = "П-П-П-П-Простите, Сенсей! Мы не хотели— Это потому что...!"
61030-178 = "М-Мы совсем не думаем о вас так...! Вообще! Это не—"
61030-179 = "[s] «Эй, не переживайте. Я ничего такого не подумал»."
61030-180 = "Н-Но..."
61030-181 = "..."
61030-182 = ""
61030-183 = "[ns] «Всё хорошо»."
61030-185 = "[ns] «...Теперь всё будет хорошо»."
61030-186 = ""
61030-187 = ""
61030-188 = ""
61030-189 = "Осторожно и неуверенно обе чуть-чуть придвинулись ко мне."
61030-190 = "...Ах..."
61030-191 = "Ух... *всхлипывает*..."
61030-193 = "Увидев их вблизи, я внезапно осознал, насколько маленькими были все студенты Ариус, которых я встречал до этого, особенно по сравнению со сверстницами."
61030-194 = "Помогая им немного расслабиться, я объяснил смысл и важность экзаменов."
61030-195 = ""
61030-196 = "Понятно... Значит, хотя оценивать человека по результату одного теста, возможно, не лучший способ..."
61030-197 = "...он всё равно помогает студентам повторять и усваивать материал."
61030-198 = "Знаете, в Ариус у нас тоже было что-то похожее!"
61030-199 = "Например, определить количество патронов по весу магазина или понять, что делать в ближнем бою..."
61030-200 = ""
61030-202 = ""
61030-203 = "...способы уничтожения нимбов и всё такое."
61030-204 = "Э-Эй!"
61030-205 = "Хм? Что? А...!"
61030-206 = "П-Прости, Сенсей! Мне не стоило так буднично об этом говорить!"
61030-207 = "Хм? Вам интереснее, как мы здесь освоились? Хи-хи, ну... Здесь у нас настоящая «школьная жизнь»!"
61030-208 = "Даже странно такое говорить. Хех."
61030-209 = "Весело ли нам? Да! Очень! А больше всего мы снова и снова всему удивляемся!"
61030-210 = "Никаких патрулей и учений. И если ошибёшься, тебя не посадят в одиночную камеру! И, Сенсей, представьте: нас даже кормят три раза в день!"
61030-211 = "И тут бывает жарко! Я этому очень удивилась!"
61030-212 = "Потому что... в Ариус всегда было холодно..."
61030-213 = ""
61030-214 = "[ns] «Все хорошо к вам относятся?»"
61030-215 = "Да! Очень хорошо! Ведь они думают, что мы перевелись из деревни."
61030-216 = "На самом деле они иногда бывают НАСТОЛЬКО добрыми, что я даже не знаю, как реагировать..."
61030-217 = "Мы несколько раз ходили со студентами Тринити в место под названием «кафе»."
61030-218 = "И они без всякого волнения заказывали из меню такие дорогие вещи! Я сама чуть глаза не выронила."
61030-219 = "Там столько видов кофе и тортов! Я всё ещё их запоминаю. Правда, они такие вкусные... и дорогие! Хи-хи."
61030-220 = "Поэтому мы тоже устроились на подработку! Чтобы иметь возможность ходить в кафе!"
61030-221 = "Работать — это круто! Кажется, на работе я узнаю не меньше, чем в классе."
61030-222 = "Например, насколько лёгким может стать кошелёк в середине расчётного периода..."
61030-223 = "[s] «Это не меняется даже во взрослом возрасте!»"
61030-224 = "П-Правда?! А я думала, вы будете таким... совсем необычным человеком, Сенсей."
61030-225 = "Типа очень богатым, вообще ни о чём не переживающим."
61030-226 = "Жизнь остаётся жизнью, кем бы ты ни был? Я... Мне даже нравится, как это звучит."
61030-227 = "Ага... Правда звучит хорошо..."
61030-228 = "..."
61030-229 = "..."
61030-230 = "Эм, Сенсей?"
61030-231 = "Вы, наверное, уже догадались, но..."
61030-232 = "Не все перевелись в Тринити."
61030-233 = "[s] «...Да»."
61030-234 = "Не знаю, насколько хорошо смогу это объяснить."
61030-235 = "Но некоторые студенты решили остаться."
61030-236 = "Причин было много..."
61030-237 = "Но мне кажется, в основе всего было то, что принять Тринити и внешний мир означало слишком большие перемены."
61030-238 = "После перевода сюда я кое-что поняла."
61030-245 = "Очень многое в жизни зависит от того, где ты родился."
61030-246 = "В одном месте людям повезёт, если они смогут поесть хотя бы раз в день."
61030-247 = "А совсем рядом другие спокойно едят дорогие десерты в кафе и ресторанах."
61030-248 = "Если подумать, в другом мире наши две школы могли бы быть очень близки."
61030-249 = ""
61030-255 = "...Мы не знаем, что стало со студентами, которые остались."
61030-256 = "У нас есть догадки, но это лишь догадки."
61030-257 = "Мы слышали слухи... что те студенты полностью разорвали связи с внешним миром."
61030-258 = "И теперь проводят какую-то партизанскую операцию."
61030-259 = ""
61030-260 = "Сенсей. Мы узнали, что все приходят из разных мест и что нужно по возможности уважать чужие взгляды."
61030-261 = "Но даже понимая это, мы всё равно не можем не переживать за тех, кто остался."
61030-262 = "Потому что... нам до сих пор снятся кошмары. Про Ариус... и всё, что случилось."
61030-263 = "Иногда мы просыпаемся посреди ночи с криками."
61030-264 = "Мы даже начали считать, кто чаще просыпается и кто громче кричит. Хех... Хе-хе."
61030-265 = "Сейчас я побеждаю!"
61030-266 = "В последний раз мы проснулись почти одновременно!"
61030-267 = "Я проснулась на целую минуту раньше тебя!"
61030-268 = ""
61030-270 = ""
61030-271 = ""
61030-272 = "Сенсей. Может, это прозвучит странно..."
61030-273 = "Но когда вы раньше объясняли, что такое экзамен..."
61030-274 = "Я просто подумала, было бы здорово, если бы остальные тоже получили шанс его сдать."
61030-276 = "Стой? Правда?"
61030-277 = "Я-Я знаю, это немного странно..."
61030-278 = "Нет-нет! Я подумала то же самое!"
61030-279 = "[ns] «Почему, как думаете, вы так почувствовали?»"
61030-280 = ""
61030-281 = "Э-Это немного трудно объяснить..."
61030-282 = "Думаю... Когда я вижу, как студенты Тринити занимаются обычными вещами — ходят на уроки, собираются утром, сдают экзамены..."
61030-283 = "От этого как-то хорошо, понимаете? Это похоже на то, чем и должны заниматься студенты нашего возраста."
61030-284 = "Иногда я слышу, как студенты Тринити жалуются, что ненавидят учиться."
61030-285 = "Нам действительно очень трудно... и всё это для нас совершенно чужое... Но сказать, что мы ненавидим учёбу, тоже не можем."
61030-286 = "«Учёба — обязанность студента!» Мы здесь часто это слышим."
61030-287 = ""
61030-288 = "[ns] «...!»"
61030-289 = ""
61030-291 = ""
61030-292 = ""
61030-293 = ""
61030-294 = ""
61030-295 = "С-С-Сенсей?!"
61030-296 = "Сенсей?!"
61030-297 = "Я так ими гордился, что просто не смог удержаться и начал гладить их по головам!"
61030-298 = ""
61030-299 = "[ns] «Простите! Просто когда услышал, как вы это говорите, я...!»"
61030-300 = ""
61030-301 = "В-Всё нормально! Мы правда так думаем!"
61030-302 = "Я бы не возражала, если бы мы постояли так... ещё совсем немного..."
61030-303 = "..."
61030-304 = "..."
61030-305 = "Значит, чья-то рука... может быть такой тёплой..."
61030-306 = "Это так... мягко. Хех."
61030-307 = ""
61030-308 = "[ns5] «В общем, ты хочешь, чтобы студенты Ариуса...»\n[ns6] «...получили возможность „учиться“, верно?»\n[ns7] «И попробовали сдать экзамен!»"
61030-312 = "Именно! В этом вся идея, но..."
61030-313 = "Меня кое-что тревожит. Может, я просто слишком много думаю..."
61030-314 = "Ладно, наверное, лучше просто спросить... Эм."
61030-315 = "Полное название этого теста — «Комплексный экзамен Тринити», да? Я-Я знаю, что вопросы составляла не Тринити, но..."
61030-316 = "[s] «А...!»"
61030-317 = "Студентам, которые остались в Ариус и очень сильно ненавидят Тринити..."
61030-318 = "...наверное, совсем не понравится название «Комплексный экзамен Тринити», правда?"
61030-319 = "И никто из них раньше вообще не учился."
61030-320 = "Кроме того, я слышала, Ариус сейчас не принимает никаких посетителей."
61030-321 = "Может, если бы там можно было проводить занятия, как здесь..."
61030-322 = "Если бы это было хоть немного возможно, всё уже давно произошло бы!"
61030-323 = "[s] «Не переживайте о мелочах!»"
61030-324 = "П-Правда?! Значит... вы действительно думаете, что есть способ?"
61030-325 = "Потому что вы взрослый! Учитель! Вы наверняка знаете множество вещей, которых мы не знаем!"
61030-326 = "[s] «Находить невозможные решения — часть обязанностей взрослого»."
61030-327 = "Почему-то, хотя я не совсем понимаю..."
61030-328 = "...я всё равно чувствую, что могу вам поверить. Хи-хи."
61030-329 = "Обратиться к вам за помощью действительно было правильным решением, Сенсей!"
61030-330 = ""
61030-332 = ""
61030-333 = "У меня есть ещё одна просьба, если можно..."
61030-335 = "[log=아리우스 학생 A 마스크OFF]Пожалуйста... присмотрите за членами Squad ради нас.[/log]"
61030-339 = "[ns] «...!»"
61030-345 = "Следующий Эпизод;Где сливаются реки"
