[translation]
2005003-1 = "Так быстрее!"
2005003-2 = "Офис Шале"
2005003-3 = "Я, как обычно, утопал в бумагах, когда услышал..."
2005003-4 = ""
2005003-7 = "...стук?"
2005003-8 = "[ns] «Не заперто. Заходи.»"
2005003-10 = "[ns1] «Погодите, этот звук...»\n[ns2] «...доносится из окна...?»"
2005003-13 = "Я посмотрел через стекло и..."
2005003-14 = "[ns] «...А?»"
2005003-15 = "Рицу висела на карнизе!"
2005003-16 = "[ns] «Рицу?!»"
2005003-17 = "Сенсей! Сенсей!"
2005003-18 = "У тебя окно заперто! Разбить?"
2005003-19 = "[s3] «Оно дорогое и пуленепробиваемое!»\n[s4] «Конечно нет!»"
2005003-22 = ""
2005003-26 = "Я быстро отпер окно и помог ей забраться внутрь."
2005003-28 = "Проникновение завершено!"
2005003-29 = "[ns] «Ты взобралась сюда по стене здания?»"
2005003-30 = "Ага! Твой лифт был ТА-А-АКИМ медленным!"
2005003-31 = "[s] «Рицу. У нас ещё есть лестница.»"
2005003-32 = "Хмм...?"
2005003-33 = "Но так было короче. Самый прямой путь."
2005003-34 = "[s] «Математически ты права, но...!»"
2005003-35 = ""
2005003-38 = "[ns] «Как ты вообще получила разрешение прийти сюда? Сегодня не твоя очередь быть представительницей.»"
2005003-39 = "О! Я сказала им, что хочу купить немного мрамора. Для скульптуры."
2005003-40 = "Собрание о-о-очень строго относится к выходам наружу..."
2005003-41 = "Но если причина связана с искусством, они чу-у-уточку добрее."
2005003-42 = "Поэтому после каменоломни я зашла к тебе!"
2005003-43 = "[s] «То есть ты принесла сюда... каменную плиту?»"
2005003-44 = "Ага! Она на первом этаже, возле лифта. Хочешь, я подниму её сюда?"
2005003-45 = "[s] «Я-Я потом сам спущусь и посмотрю...!»"
2005003-46 = "А, конечно! Но это не главное."
2005003-47 = "Вот, Сенсей! Это тебе!"
2005003-48 = ""
2005003-51 = "[ns] «Это... рубашка?»"
2005003-52 = "Ага! Помнишь, как в прошлый раз ты весь покрылся каменной пылью, когда помогал мне со скульптурой?"
2005003-53 = "Я подумала, что рубашку ты тогда испортил..."
2005003-54 = "Поэтому попросила подругу с факультета моды сделать тебе новую."
2005003-55 = "[s] «Так вот почему ты спрашивала мой любимый цвет...?»"
2005003-56 = "Ага. Видишь ли, я думала сделать рубашку твоего любимого цвета..."
2005003-57 = "Но не хотела вмешиваться в её художественное видение. Поэтому оставила выбор ей."
2005003-58 = "[s] «Хорошо, что я не сказал „прозрачный“...»"
2005003-59 = "А! Это твоя ФИШКА, Сенсей?"
2005003-60 = "[s5] «Вовсе нет!»\n[s6] «В любом случае, спасибо, Рицу! Буду часто её носить!»"
2005003-63 = "Ага, ага! Примерь! Посмотрим, как сидит!"
2005003-64 = "[s] «Да, я пойду переоденусь в другой комнате...»"
2005003-65 = ""
2005003-72 = ""
2005003-73 = "[ns] «...Эм, Рицу? Почему ты идёшь за мной...?»"
2005003-74 = "М? Ты о чём?"
2005003-75 = "[s] «Ну, потому что мне нужно переодеться? В другой комнате?»"
2005003-76 = "..."
2005003-77 = "А, стесняешься, Сенсей?"
2005003-78 = "А может, я переоденусь в рабочую одежду прямо рядом с тобой?"
2005003-79 = "[s] «Нет! Пожалуйста, не надо!»"
2005003-81 = "Каким-то образом мне всё же удалось спокойно переодеть рубашку."
2005003-83 = "Хм."
2005003-84 = "Ну как? Удобно? Размер подходит?"
2005003-85 = "[s] «Идеально. Ученики Вайлдхант такие талантливые!»"
2005003-86 = "Вот видишь, мне кажется... она действительно..."
2005003-87 = ""
2005003-89 = ""
2005003-90 = "...тебе не подходит!"
2005003-91 = "[s] «Почему...?»"
2005003-92 = "А, на ТЕБЕ она смотрится хорошо, Сенсей! Сама по себе."
2005003-93 = "Но с твоими брюками и обувью, по-моему, вообще не сочетается!"
2005003-94 = "[s] «В следующий раз начинай с этого...!»"
2005003-95 = "Но ничего страшного!"
2005003-96 = "В следующий раз можем сходить и подобрать вещи, которые будут сочетаться!"
