[translation]
1003106-1 = "Новогоднее гадание"
1003106-2 = "Нельзя праздновать Новый год без омикудзи, Сенсей."
1003106-3 = "[s] «Вот как?»"
1003106-4 = "Все ведь желают себе удачи в новом году, правда?"
1003106-5 = "Это и так очевидно."
1003106-6 = "Хотя я не думаю, что простой омикудзи способен определить судьбу на весь год, каким бы ни выпало предсказание."
1003106-7 = "Но как боссу и главе организации мне всё же кажется забавным воспользоваться случаем и одним глазком посмотреть на свою удачу в этом году."
1003106-8 = "Всего лишь безобидное гадание."
1003106-9 = "[s] «Ну, если ты так говоришь...»"
1003106-10 = "Именно так! Ну же, давайте вместе вытянем омикудзи."
1003106-11 = "Кто знает! Может, мне выпадет главный приз!"
1003106-12 = "Смотрите внимательно! ♪"
1003106-13 = "[s] «Разве омикудзи так работает?»"
1003106-17 = "О, вот оно."
1003106-18 = "В общем, трясёшь коробку, вытаскиваешь выпавшую палочку, смотришь номер... затем открываешь ящик с таким же номером и читаешь предсказание. Вот и всё."
1003106-19 = "Одна попытка стоит 100 иен."
1003106-20 = "Я начну."
1003106-21 = ""
1003106-23 = ""
1003106-24 = ""
1003106-25 = ""
1003106-27 = "Мой номер... 45."
1003106-28 = ""
1003106-29 = "Теперь посмотрим в ящике..."
1003106-30 = ""
1003106-32 = ""
1003106-33 = "Моё предсказание..."
1003106-34 = "...небольшое несчастье?"
1003106-35 = "«Будьте осторожны: ваш бизнес может пошатнуться, а рынок неблагоприятен. Возможны проблемы с друзьями.» Что за...?"
1003106-36 = "[s] «Звучит не очень хорошо.»"
1003106-37 = "Хм-м. Ну, не то чтобы я в это верила."
1003106-38 = "Как это там называется? Эффект Барнума?"
1003106-39 = "Когда тебе дают правдоподобное утверждение, а ты невольно связываешь его именно со своими обстоятельствами..."
1003106-40 = "[s] «Но это всё-таки твоё предсказание. Хочешь пойти и привязать его?»"
1003106-41 = ""
1003106-43 = ""
1003106-44 = "[ns] «Ару?»"
1003106-45 = "Простите, Сенсей, но я не могу. Смириться с таким проигрышным предсказанием — всё равно что сдаться, разве нет?"
1003106-46 = "Я вытяну ещё одно. Это всего 100 иен."
1003106-47 = ""
1003106-49 = ""
1003106-50 = ""
1003106-51 = ""
1003106-53 = "Так, на этот раз мне выпало 87."
