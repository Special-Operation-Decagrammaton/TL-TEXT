1003106-58 = ""
1003106-60 = ""
1003106-61 = "...несчастье?"
1003106-62 = "«Сейчас не время добиваться целей, вам следует сохранять терпение. Остерегайтесь испытаний: вашему делу суждено потерпеть крах.»"
