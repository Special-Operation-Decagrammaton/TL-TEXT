1003106-66 = "[ns] «Ару?»"
1003106-67 = "Хе-хе."
1003106-68 = "Хе-хе-хе. Отлично. Я принимаю этот вызов."
1003106-69 = "Я не сдамся, сколько бы несчастий мне ни выпадало!"
1003106-70 = "[s] «Ару, не обязательно воспринимать это настолько серьёзно!»"
1003106-71 = "Нет, обязательно, Сенсей! Это война! Война между мной и омикудзи!"
1003106-72 = "Как оно смеет утверждать, что Решалы 68 потерпят крах?!"
