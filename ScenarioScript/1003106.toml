1003106-133 = ""
1003106-136 = ""
1003106-137 = "...какое-то «почти-но-не-совсем несчастье»?"
1003106-138 = "Как такое возможно?! Должно же быть хотя бы одно предсказание без несчастья!"
1003106-139 = "Я думала, это священное место! Я не суеверная, но это уже слишком!"
