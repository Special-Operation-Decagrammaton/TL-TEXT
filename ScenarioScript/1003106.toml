1003106-165 = "[s] «Правда?»"
1003106-166 = "Д-Да. В смысле, в итоге нам выпал хороший результат, а всё хорошо, что хорошо кончается, верно?"
1003106-167 = ""
1003106-169 = ""
1003106-170 = "Ну же, Сенсей. Пойдём привяжем все предсказания, которые мы вытянули!"
1003106-171 = "Правда, мне понадобится время, чтобы привязать все свои..."
1003106-172 = "[s] «Я помогу.»"
1003106-173 = "О-О. Хорошо."
1003106-174 = "Как и написано в вашем предсказании."
1003106-175 = "Хорошо относитесь к тому, кто рядом... Хи-хи."
1003106-176 = ""
1003106-178 = ""
