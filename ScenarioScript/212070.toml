[translation]
212070-1 = "Episode 7;I Don't Really Get It"
212070-4 = "(I received a message from Mayumi and Karen that sounded like they were deeply troubled.)"
212070-10 = "(I hurried to the meeting spot.)"
212070-15 = "Sensei..."
212070-16 = "...Hey there, Sensei."
212070-17 = "[s] \"Sorry to keep you waiting.\""
212070-18 = "Sensei, you know about it, right...? The situation in Gehenna..."
212070-19 = "[s] Nod."
212070-20 = "Haha, I figured. Being Sensei must be tough."
212070-21 = "You have to look after every school, and then Gehenna goes and does something like this..."
212070-22 = "...What do you think, Sensei?"
212070-24 = "[ns] \"I'll find a way. With everything I've got.\""
212070-25 = "...I knew you'd say that."
212070-26 = "You want to know what we think?"
212070-30 = "I wonder what we think... Honestly, I have no idea what's going on..."
212070-31 = "I thought it was a good thing that the Pandemonium Society and the Prefect Team joined forces. #nIt was the first step toward uniting Gehenna, and it's what we've been advocating for."
212070-34 = "But this atmosphere... it's wrong. #nIt's oppressive, and they're trying to control the students through fear..."
212070-35 = "And what's this about attacking Kivotos? That's completely different from just shooting or breaking things."
212070-38 = "The upperclassmen seem completely focused on the preparations... but are they really serious about this?"
212070-39 = "The other students are just getting dragged into it because they don't want to be labeled as traitors..."
212070-42 = "Is this really right? Is this truly the path to a great Gehenna? #n...What should we do?"
212070-43 = "Chairwoman..."
212070-44 = "My head has been spinning for so long now."
212070-48 = "It's not all bad, though."
212070-52 = "The people who usually don't listen to anyone have all gone quiet. From one perspective, it's pure peace."
212070-53 = "The Pandemonium Society and the Prefect Team seem to be getting along well, too."
212070-54 = "Maybe it's closer to the Gehenna we imagined."
212070-58 = "I mean... I like a good fight, and I like throwing punches, right? #nOh, I pick my opponents carefully, though!"
212070-59 = "If only the current Gehenna didn't have such a weird goal..."
212070-60 = "I don't really get this whole attacking Kivotos thing."
212070-61 = "Punching people for no reason makes no sense, and it just leaves a bad taste in your mouth."
212070-62 = "There's no righteous cause for what Gehenna is trying to do."
212070-63 = "Why did things end up like this? My head's starting to hurt."
212070-64 = "...What do you think I'm most afraid of right now?"
212070-65 = "What is it?"
212070-66 = "...We admired the Gehenna of the past."
212070-67 = "That's why our committee is called the Gehenna Restoration Committee. To make Gehenna great 'again'."
212070-68 = "But what if we were wrong about the 'past'...?"
212070-69 = "Oppressively suppressing students and trying to cause harm to other schools. #nIf this was the Gehenna of the past..."
212070-70 = "..."
212070-71 = "What have we been doing all this time...?"
212070-72 = "Was a 'great Gehenna' always like this?"
212070-73 = "Chairwoman..."
212070-74 = "And... and...!"
212070-75 = "Have we done something irreversible to Gehenna...?"
212070-76 = "All because we admired the Gehenna of the past without knowing anything about it...!!"
212070-82 = "[ns] I take Mayumi's hand to calm her down."
212070-87 = "Sensei..."
212070-88 = "[s1] \"It's not your fault.\"\n[s2] \"I guarantee it.\""
212070-94 = "..."
212070-95 = "Were we wrong...? Was it all for nothing...?"
212070-96 = "I really tried my best, though..."
212070-97 = "[s] \"It wasn't for nothing.\""
212070-98 = "Huh...?"
212070-99 = "[s] \"Because you're feeling that something is wrong.\""
212070-100 = "Something is wrong...?"
212070-101 = "[s3] \"If you two had been half-hearted--\"\n[s4] \"You might have accepted the current Gehenna as great.\""
212070-106 = "[ns5] \"But you two weren't like that.\"\n[ns6] \"That's because it's different from the greatness you were aiming for, right?\""
212070-111 = "[ns7] \"I know.\"\n[ns8] \"Mayumi, Karen, and everyone in the Restoration Committee.\"\n[ns9] \"You've all been working hard to change Gehenna for the better.\""
212070-119 = "Waaaaahhh!!!"
212070-123 = "Ch-Chairwoman...!"
212070-124 = "Don't cry... you're making me cry too...!!"
212070-129 = "Aaaaaahhhhh!!!"
212070-131 = "(I kept comforting them until they stopped crying.)"
212070-135 = "Sniff, ugh... *hic*!"
212070-136 = "My makeup is all ruined now..."
212070-137 = "Sorry..."
212070-138 = "But when you said that, I just..."
212070-139 = "Sigh..."
212070-143 = "But I'm okay now! I bounce back fast!"
212070-144 = "Fully recovered!"
212070-145 = "..."
212070-146 = "Haha, that's our Chairwoman for you."
212070-147 = "[s] \"What are you two going to do now?\""
212070-148 = "This isn't a great Gehenna."
212070-149 = "Right, Chairwoman?"
212070-150 = "Yeah! We have to put a stop to all of this!"
212070-151 = "We'll create a truly great Gehenna!"
212070-152 = "[s] \"In that case, there's someone I'd like you to meet.\""
212070-156 = "Huh, a student with the same goal...? There are others?"
212070-157 = "Haha, we'd love to. The more the merrier right now."
212070-158 = "[s] \"But, um... what about Shoko?\""
212070-162 = "Shoko is..."
212070-163 = "It seems her way of thinking is a bit different from ours."
212070-164 = "She's acting like some kind of operations strategist for the upperclassmen."
212070-165 = "It looks like she wants to do it herself..."
212070-166 = "Though, we haven't even been able to talk to her properly yet..."
212070-167 = "[s] \"I'll try talking to her.\""
212070-168 = "Yeah... please do."
212070-169 = "I think Shoko will listen if it's you, Sensei."
212070-170 = "Shoko-chan..."
212070-171 = "Hey, Sensei..."
212070-172 = "Thank you for listening to us today."
212070-173 = "Seriously! Me too!! Haha."
212070-175 = "(I hope their smiles never fade.)"
212070-179 = "(That is what I wished for from the bottom of my heart.)"
212070-181 = "Next Episode;Chiaki"