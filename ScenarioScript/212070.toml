[translation]
212070-1 = "Эпизод 7;Я не уверена"
212070-4 = "Со мной связались Маюми и Карен."
212070-5 = ""
212070-10 = "По их словам было ясно, что им многое нужно рассказать, поэтому я сразу отправился к ним."
212070-14 = ""
212070-15 = "Сенсей..."
212070-16 = "Йаха... Здравствуйте, Сенсей."
212070-17 = "[s] «Привет, Маюми и Карен»."
212070-18 = "Сенсей, вы ведь тоже всё видели...? Что сейчас творится в Геенне...?"
212070-19 = "[s] Кивнуть."
212070-20 = "Йаха-ха, наверное, вам сейчас очень непросто..."
212070-21 = "У вас и так хватает работы в Шале, а теперь Геенна собралась воевать с вашими другими академиями..."
212070-22 = "...Что вы об этом думаете, Сенсей?"
212070-23 = ""
212070-24 = "[ns] «Я сделаю всё возможное, чтобы этого не допустить»."
212070-25 = "...Я так и знала."
212070-26 = "Вы... «хотите узнать, что мы думаем»?"
212070-27 = ""
212070-29 = ""
212070-30 = "Я-я хотела бы ответить, но не понимаю, что происходит."
212070-31 = "Это замечательно, что Пандемониум и Префектура наконец работают вместе. Это отвечает нашей мечте о единой Геенне. Мы этого хотели... Я сама этого ТРЕБОВАЛА. Так что..."
212070-32 = ""
212070-34 = "Но такие перемены... совсем не то, что мы представляли. Всё делается силой, бесчеловечно, через запугивание и страх..."
212070-35 = "А война? Даже я понимаю, что это не то же самое, что стрелять по неодушевлённым предметам и разрушать их."
212070-36 = ""
212070-38 = "Старшие сейчас заняты подготовкой к сражению. А я всё спрашиваю себя: «Они серьёзно?» Но всё происходит прямо на наших глазах."
212070-39 = "И похоже, нас, младшекурсников, отчитывают уже за одно промедление. Некоторые просто подчиняются, чтобы их не объявили предателями..."
212070-40 = ""
212070-42 = "Ч-что нам делать? Правильно ли всё это? Разве так возвращают Геенне былую славу?"
212070-43 = "Президент..."
212070-44 = "...Я совсем не уверена. Просто запуталась."
212070-45 = ""
212070-47 = ""
212070-48 = "Я понимаю, не всё так уж плохо. Я вижу, что изменилось."
212070-49 = ""
212070-51 = ""
212070-52 = "Нарушители порядка притихли, студенты ходят строем."
212070-53 = "Как она и сказала, Пандемониум и Префектура теперь ладят. Хотя ЭТО считалось невозможным."
212070-54 = "Похоже на славную Геенну, о которой мы мечтали."
212070-55 = ""
212070-57 = ""
212070-58 = "Но война..."
212070-59 = "Если честно, я люблю подраться. Мне нравится поколачивать тех, кто это заслужил..."
212070-60 = "Но здесь я не уверена."
212070-61 = "Причинять боль невинным людям бессмысленно. Мне самой было бы от этого мерзко."
212070-62 = "У этой войны нет оправданий, ведь никто не сделал ничего плохого."
212070-63 = "*вздох* Не знаю. Голова уже раскалывается."
212070-64 = "...Знаешь, что меня пугает?"
212070-65 = "Что?"
212070-66 = "То, как мы... боготворили старую Геенну."
212070-67 = "Мы назвали наш клуб «Лигой наследия» и только и хотели, что вернуть Геенне былую славу."
212070-68 = "Но если Геенна действительно была такой..."
212070-69 = "Если это была академия, где безжалостно подавляли студентов и готовились к ничем не оправданной захватнической войне против соседних академий..."
212070-70 = "..."
212070-71 = "Тогда ради чего мы вообще старались...?"
212070-72 = "Та самая великая Геенна, о которой мы мечтали... выглядела вот так?"
212070-73 = "Президент..."
212070-74 = "И... и ещё...!"
212070-75 = "Если всё это произошло из-за наших действий, то что же нам теперь делать...?"
212070-76 = "Всё потому, что мы восхищались Геенной прошлого, ничего не зная и ни в чём не сомневаясь...! ЭТО НАША ВИНА!!!"
212070-77 = ""
212070-79 = ""
212070-80 = ""
212070-82 = "[ns] Взять Маюми за руку и успокоить."
212070-83 = ""
212070-85 = ""
212070-86 = ""
212070-87 = "...Сенсей..."
212070-88 = "[s1] «Обещаю, это не так».\n[s2] «Вы в этом не виноваты»."
212070-89 = ""
212070-90 = ""
212070-92 = ""
212070-94 = "..."
212070-95 = "Я-я... боюсь, что всё, что мы делали, было напрасно."
212070-96 = "Когда я думаю, сколько сил мы вложили... Как сильно мне было не всё равно... И вот к чему всё привело?"
212070-97 = "[s] «Ваши усилия не были напрасны. Я могу это доказать»."
212070-98 = "Ч-что?"
212070-99 = "[s] «Доказательство — в твоих нынешних переживаниях»."
212070-100 = "«Переживаниях»...?"
212070-101 = "[s3] «Если бы вам действительно было наплевать на Геенну...»\n[s4] «...вы бы сейчас радовались и праздновали её „славу“»."
212070-106 = "[ns5] «Но вы обе понимаете, что происходящее неправильно».\n[ns6] «И знаете, что не ради этого так тяжело трудились»."
212070-109 = ""
212070-111 = "[ns7] «Я прекрасно знаю...»\n[ns8] «...что ты, Карен и остальные участники Лиги наследия...»\n[ns9] «...старались сделать Геенну лучше»."
212070-112 = ""
212070-113 = ""
212070-114 = ""
212070-116 = ""
212070-117 = ""
212070-119 = "Уа-а-а!!!"
212070-120 = ""
212070-122 = ""
212070-123 = "П-председатель...!"
212070-124 = "Не плачь! Ты же и меня сейчас доведёшь до слёз...!!!"
212070-125 = ""
212070-129 = "Уа-а-а-а-а!!!"
212070-131 = "Я утешал Маюми и Карен, пока они не перестали плакать."
212070-134 = ""
212070-135 = "Фух... *шмыг*"
212070-136 = "Серьёзно. Весь макияж размазался..."
212070-137 = "Прости, Карен... И вы простите, Сенсей."
212070-138 = "После ваших слов я просто не смогла сдержаться..."
212070-139 = "А-а..."
212070-140 = ""
212070-142 = ""
212070-143 = "Зато я умею быстро оправляться от неудач!"
212070-144 = "Так что теперь со мной всё в порядке!"
212070-145 = "..."
212070-146 = "Йаха, ага. Вот это настрой, председатель!"
212070-147 = "[s] «И что теперь будем делать?»"
212070-148 = "Ну, теперь мы точно знаем одно."
212070-149 = "Эту Геенну никак не назвать славной."
212070-150 = "Ага! Поэтому нужно добиться, чтобы они отказались от всей этой военной затеи!"
212070-151 = "А потом мы начнём возвращать Геенне НАСТОЯЩУЮ славу!"
212070-152 = "[s] «Тогда я хотел бы познакомить вас с некоторыми студентами»."
212070-153 = ""
212070-155 = ""
212070-156 = "С теми, кто «думает так же»...? Это какой-то клуб?"
212070-157 = "А, тогда мы будем рады познакомиться. Чем больше нас, тем лучше."
212070-158 = "[s] «Кстати... Где Шоуко?»"
212070-159 = ""
212070-161 = ""
212070-162 = "Шоуко..."
212070-163 = "По-моему, в последнее время у Шоуко появились собственные планы."
212070-164 = "Она стала оперативным офицером, отвечающим за вторжение в Кивотос."
212070-165 = "Звучит как очень сложная работа, поэтому мы почти не общались."
212070-166 = "...И если подумать, похоже, она всегда хотела войны."
212070-167 = "[s] «Попробую поговорить с Шоуко»."
212070-168 = "Да... Пожалуйста, Сенсей."
212070-169 = "Уверена, Шоуко вас послушает."
212070-170 = "Ох, Шоуко..."
212070-171 = "А ещё..."
212070-172 = "Спасибо за совет, Сенсей."
212070-173 = "Ага-ага! Мы вам очень благодарны! Йаха!"
212070-175 = "Я всей душой надеялся..."
212070-176 = ""
212070-179 = "...что улыбки этих студентов никогда не померкнут."
212070-181 = "Следующий эпизод;Чиаки"
