[translation]
212070-1 = "Episódio 07;Não Entendi Nada"
212070-4 = "(Recebi uma mensagem aflita de Mayumi e Karen, parecendo desesperadas)"
212070-5 = ""
212070-10 = "(Fui correndo até o ponto de encontro marcado)"
212070-14 = ""
212070-15 = "Sensei......"
212070-16 = "......E aí, Sensei."
212070-17 = "[s] \"Desculpem a demora, meninas.\""
212070-18 = "Sensei, você já tá sabendo, né......? Do que tá rolando em Gehenna......"
212070-19 = "[s] Aceno com a cabeça."
212070-20 = "Sabia...... Imagino como deve tá sendo puxado pra você."
212070-21 = "Você já tem que cuidar de todas as academias de Kivotos, e agora Gehenna vira esse hospício a céu aberto......"
212070-22 = "......O que você acha de tudo isso, Sensei?"
212070-23 = ""
212070-24 = "[ns] \"Eu vou resolver isso. Com todas as minhas forças.\""
212070-25 = "......Sabia que você ia falar isso."
212070-26 = "E se você quiser saber o que a gente tá achando......"
212070-27 = ""
212070-29 = ""
212070-30 = "Eu nem sei mais o que pensar...... Tô boiando completamente, não entendi nada......"
212070-31 = "Ver a Pandemonium e a Disciplina dando as mãos parecia o paraíso no começo.#nEra o primeiro passo pra unificar Gehenna, era tudo o que a gente sempre sonhou."
212070-32 = ""
212070-34 = "Mas esse clima pesado de agora...... tá muito errado.#nEsse autoritarismo sufocante, essa paranoia de controlar as alunas pelo medo......"
212070-35 = "E que palhaçada é essa de declarar guerra contra Kivotos? Atirar em alvo de treino e quebrar lata velha não tem NADA a ver com isso!"
212070-36 = ""
212070-38 = "As veteranas tão enfiadas na preparação de invasão...... mas será que elas tão mesmo falando sério?"
212070-39 = "E as outras meninas do colégio tão sendo arrastadas junto só de pavor de levarem tiro taxadas de traidoras......"
212070-40 = ""
212070-42 = "Isso tá certo mesmo? É esse o caminho pra tornar Gehenna grandiosa?#n......O que é que a gente faz agora?"
212070-43 = "Mayumi......"
212070-44 = "Minha cabeça tá dando um nó gigantesco, juro......"
212070-45 = ""
212070-47 = ""
212070-48 = "Mas ó...... pensando friamente, não é só coisa ruim também."
212070-49 = ""
212070-51 = ""
212070-52 = "Aquele bando de delinquente que nunca ouvia ninguém agora anda pianinho na linha. Dependendo do ângulo, virou uma paz de cemitério."
212070-53 = "A Pandemonium e a Disciplina tão se entendendo como nunca."
212070-54 = "Olhando por cima, até lembra a Gehenna que a gente tinha idealizado."
212070-55 = ""
212070-57 = ""
212070-58 = "Eu...... bem, eu adoro uma boa briga e amo descer o braço em folgada, né?#nMas ó, eu sempre escolho muito bem quem merece apanhar!"
212070-59 = "Essa Gehenna de agora...... se não fosse por esse objetivo bizarro, até que ia......"
212070-60 = "Mas sair invadindo Kivotos não entra na minha cabeça nem a pau."
212070-61 = "Bater nos outros sem motivo justo é idiotice pura, só deixa um gosto amargo na boca depois."
212070-62 = "Não tem nobreza nenhuma no que Gehenna tá querendo fazer."
212070-63 = "Por que diabos as coisas desandaram desse jeito? Minha cabeça já tá explodindo de dor."
212070-64 = "......Sabe qual é o meu maior pavor agora?"
212070-65 = "Qual?"
212070-66 = "......A gente sempre teve essa ilusão com o passado de Gehenna."
212070-67 = "Foi por isso que batizamos o grupo de Comitê de Restauração de Gehenna. Pra fazer a escola ser grande 'de novo'."
212070-68 = "Mas e se a gente tiver entendido o 'passado' totalmente errado......?"
212070-69 = "Esmagar as alunas na base da opressão, sair destruindo as outras academias......#nSe esse for o verdadeiro passado de Gehenna......"
212070-70 = "......"
212070-71 = "O que diabos foi que a gente andou fazendo até hoje......?"
212070-72 = "Era essa a tal 'Gehenna Grandiosa'?!"
212070-73 = "Mayumi......"
212070-74 = "E pior...... pior ainda......!"
212070-75 = "Será que fomos nós...... que causamos essa desgraça irreversível em Gehenna......?"
212070-76 = "Só porque ficamos idolatrando a [ruby=・]Ge[/ruby][ruby=・]hen[/ruby][ruby=・]na[/ruby] [ruby=・]do[/ruby] [ruby=・]pa[/ruby][ruby=・]ssa[/ruby][ruby=・]do[/ruby] sem saber de nada......!!"
212070-77 = ""
212070-79 = ""
212070-80 = ""
212070-82 = "[ns] Segurei as mãos de Mayumi para acalmá-la."
212070-83 = ""
212070-85 = ""
212070-86 = ""
212070-87 = "Sensei......"
212070-88 = "[s1] \"A culpa não é de vocês duas.\"\n[s2] \"Eu dou a minha palavra de honra.\""
212070-89 = ""
212070-90 = ""
212070-92 = ""
212070-94 = "......"
212070-95 = "Será que a gente errou tanto assim......? Tudo o que fizemos foi em vão......?"
212070-96 = "A gente se esforçou com tanto amor......"
212070-97 = "[s] \"Não foi em vão de jeito nenhum.\""
212070-98 = "Não......?"
212070-99 = "[s] \"A prova disso é que vocês sentiram esse aperto no peito.\""
212070-100 = "Aperto no peito......?"
212070-101 = "[s3] \"Se a dedicação de vocês fosse rasa ou falsa――\"\n[s4] \"Vocês teriam aceitado essa opressão de agora como 'grandeza'.\""
212070-106 = "[ns5] \"Mas vocês não aceitaram.\"\n[ns6] \"Porque o coração de vocês sabe que isso não é a verdadeira grandeza, não é?\""
212070-109 = ""
212070-111 = "[ns7] \"Eu vi tudo de perto.\"\n[ns8] \"Vi o quanto a Mayumi, a Karen e todas do Comitê de Restauração se doaram.\"\n[ns9] \"Vocês lutaram de corpo e alma para mudar Gehenna para melhor.\""
212070-112 = ""
212070-113 = ""
212070-114 = ""
212070-116 = ""
212070-117 = ""
212070-119 = "Buaaaaaaaahhhhhh～～～!!"
212070-120 = ""
212070-122 = ""
212070-123 = "M-Mayumi......!"
212070-124 = "Não chora assim que eu vou chorar junto...... snif...... buááá!!"
212070-125 = ""
212070-129 = "Buaaaaaaaahhh～～～～～!!!"
212070-131 = "(Fiquei ali consolando as duas até que as lágrimas cessassem)"
212070-134 = ""
212070-135 = "Snif...... ugh...... ai, ai......"
212070-136 = "Olha aí, minha maquiagem derreteu todinha pelo rosto......"
212070-137 = "Desculpa......"
212070-138 = "Mas ouvindo o Sensei falar daquele jeito, não deu pra segurar......"
212070-139 = "Ai, caramba......"
212070-140 = ""
212070-142 = ""
212070-143 = "Mas pronto! Já passou! Sou boa de recuperar o fôlego rápido!"
212070-144 = "Renovação total!"
212070-145 = "......"
212070-146 = "Hahaha, essa sim é a minha líder de respeito!"
212070-147 = "[s] \"E o que vocês pretendem fazer daqui em diante?\""
212070-148 = "Essa palhaçada não tem nada a ver com a nossa Gehenna grandiosa."
212070-149 = "Não é, Mayumi?"
212070-150 = "Com certeza! Temos que botar um ponto final nisso tudo!"
212070-151 = "A verdadeira Gehenna grandiosa―― nós mesmas vamos construir!"
212070-152 = "[s] \"Nesse caso, tenho uma turma pra apresentar pra vocês.\""
212070-153 = ""
212070-155 = ""
212070-156 = "Ué, tem mais alunas que pensam como a gente......?"
212070-157 = "Opa, seja muito bem-vinda qualquer ajuda! Quanto mais gente, melhor!"
212070-158 = "[s] \"Mas me digam...... e quanto à Shoko?\""
212070-159 = ""
212070-161 = ""
212070-162 = "A Shoko......"
212070-163 = "Parece que a cabeça dela tá em outra sintonia agora."
212070-164 = "Ela tá lá na sala de comando bancando a assessora de guerra das veteranas."
212070-165 = "Parece até que ela quis isso por vontade própria......"
212070-166 = "Pra falar a verdade, a gente nem conseguiu ter uma conversa franca com ela......"
212070-167 = "[s] \"Eu vou tentar conversar com ela.\""
212070-168 = "Por favor...... faça isso."
212070-169 = "Se for você, Sensei, acho que a Shoko vai parar pra ouvir."
212070-170 = "Shoko-chan......"
212070-171 = "Sensei......"
212070-172 = "Muito obrigada por ter escutado nosso desabafo hoje, de coração."
212070-173 = "De coração mesmo! Valeu demais, Sensei! Hahaha."
212070-175 = "(Fiz uma prece silenciosa)"
212070-176 = ""
212070-179 = "(Para que o sorriso daquelas garotas nunca mais se apagasse)"
212070-181 = "Próximo Episódio;Chiaki"
