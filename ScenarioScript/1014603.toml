[translation]
1014603-1 = "The Chairman's Summer Panic"
1014603-2 = "(After receiving a message from Makoto, I head toward the Pandemonium Society...)"
1014603-4 = "Um... what exactly do you expect us to do about this?!"
1014603-8 = "As I just said, you are to disperse."
1014603-9 = "Occupying the plaza for military training... are you planning to hold a protest or something?"
1014603-10 = "But we already submitted a request for permission to train..."
1014603-11 = "You were the ones who told us to submit the request to the Pandemonium Society, weren't you?"
1014603-12 = "That may be, but..."
1014603-13 = "I cannot overlook the Prefect Team's continued rebellious attitude. #nYou will cease your training in the plaza."
1014603-14 = "Your own chairman is the one who designated this as the training site!"
1014603-15 = "What do you mean you can't grant permission if we follow your own instructions!?"
1014603-16 = "If you have a complaint, take it up with the chairman directly."
1014603-17 = "Seriously... what is her problem?"
1014603-26 = "(...Leaving the noisy plaza behind, I headed to the Pandemonium Society.)"
1014603-28 = "...I should become a swimsuit model!"
1014603-29 = "That way, I can show off this figure while staying on land! That's the plan!"
1014603-30 = "What do you think? A brilliant idea, isn't it? Kiki!"
1014603-31 = "...Hm? Sensei, what's wrong?"
1014603-32 = "You've seemed miles away for a while now..."
1014603-33 = "[s1] \"Actually, just a moment ago...\"\n[s2] Explain what happened at the plaza."
1014603-38 = "Hmm."
1014603-39 = "Even when Lady Makoto isn't watching, it seems we in the Pandemonium Society are working hard!"
1014603-40 = "Hm? What is it, Sensei?"
1014603-41 = "[s3] \"No, it's just...\"\n[s4] \"I realized you really do hate the Prefect Team.\""
1014603-44 = "...I didn't expect you to say that, Sensei."
1014603-45 = "Or perhaps, because you are Sensei, you don't understand?"
1014603-46 = "It's not just me who hates the Prefect Team."
1014603-47 = "That's right—it is not just me."
1014603-48 = "In the first place, is there any reason to like the Prefect Team?"
1014603-49 = "I dare say! Even if you asked every student in Gehenna the same question, #neveryone would keep their mouths shut!"
1014603-50 = "Because their act of 'correcting public morals' is nothing more than oppression."
1014603-54 = "They suppress individual freedom and force order upon us."
1014603-55 = "Why is that necessary? #nIs Gehenna really so full of troublemakers that they have to go that far?"
1014603-56 = "No—Gehenna would be fine without all that."
1014603-57 = "Crackdowns, arrests, punishments... how does any of this benefit the academy!"
1014603-58 = "Isn't it just hypocrisy? #nNo, forcing sacrifices on others for one's own self-satisfaction is nothing but malicious."
1014603-59 = "Perhaps it is the Prefect Team that needs to be 'corrected'?"
1014603-60 = "Hah... I've said too much about trivial things."
1014603-61 = "Talking about them is just a waste of time."
1014603-62 = "[s5] \"I see... thank you for being honest with me.\"\n[s6] \"You really think about these things a lot, don't you?\""
1014603-65 = "...You're the only one I'd ever say that to, Sensei."
1014603-66 = "There's no point in letting students think for themselves!"
1014603-67 = "The moment they start thinking, they begin to doubt the system—#nand eventually, they'll threaten the Pandemonium Society! Kishishi!"
1014603-68 = "[s7] \"I'm relieved to see the usual Makoto!\"\n[s8] \"Just keep being yourself, Makoto...\""
1014603-71 = "What do you mean by that...?"
1014603-72 = "Ah! I can't take it anymore!! #nI'm done holding back!!"
1014603-74 = "Every single time... there's a limit to my patience too!"
1014603-75 = "Take it up with the chairman? Fine, I will!"
1014603-76 = "Chairman of the Pandemonium Society, show yourself!"
1014603-77 = "—Face me!"
1014603-80 = "What!? The Prefect Team, all the way out here...!?"
1014603-81 = "Elite Guard! What are you doing! #nGet her out of here, now!"
1014603-85 = "...Come to think of it, I had the Elite Guard handling the Prefect Team, didn't I?"
1014603-86 = "That means... who is going to drag her out...?"
1014603-91 = "Chairman Makoto!! Prepare yourself!"
1014603-95 = "W-wait a second!!"
1014603-99 = "[ns] \"Both of you, calm down.\""
1014603-100 = "S-Sensei?"
1014603-101 = "[s9] \"I understand the situation.\"\n[s10] \"Would you let me help?\""
1014603-107 = "[ns11] \"I know it's frustrating...\"\n[ns12] \"But getting emotional won't make the situation any better.\""
1014603-110 = "But!"
1014603-111 = "...Sigh, I suppose you're right."
1014603-112 = "But what are we supposed to do? #nBoth the Prefect and the Administrative Officer are out..."
1014603-118 = "[ns13] \"Makoto, could you do me a favor?\"\n[ns14] \"Consider it a personal favor to me.\""
1014603-121 = "A-ah. You mean about the training?"
1014603-122 = "I won't interfere any further. I promise."
1014603-123 = "That should solve the problem, right?"
1014603-124 = "...Well, I did get heated and come all the way here. #nI didn't really intend to cause a total disaster..."
1014603-125 = "Sigh... my apologies."
1014603-129 = "............"
1014603-130 = "[s] \"Makoto, I'm sorry.\""
1014603-131 = "Hm? Sensei, why are you apologizing?"
1014603-132 = "[s15] \"Because of what I said earlier...\"\n[s16] \"I forced both of you to compromise.\""
1014603-138 = "[ns] \"I think the way Makoto handled it was unpleasant, too.\""
1014603-139 = "...Ah, you're right."
1014603-140 = "Sensei, you took away the Prefect's freedom to be angry at being treated unfairly, and you forced me to offer a compromise."
1014603-141 = "That is exactly the kind of 'method' the Prefect Team uses, which I, Makoto, despise."
1014603-142 = "Yet, strangely, I don't feel any discomfort... what does this mean?"
1014603-143 = "My apologies. Could we call it a day for now?"
1014603-144 = "I need some time to clear my head."
1014603-146 = "(Leaving Makoto to her thoughts, I departed from the Pandemonium Society.)"