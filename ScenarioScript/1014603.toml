[translation]
1014603-1 = "Головокружительное лето председателя"
1014603-2 = "После переписки с Макото я отправился в клубную комнату Общества Пандемониума."
1014603-4 = "Да серьёзно! И что нам, по-вашему, делать?"
1014603-5 = ""
1014603-7 = ""
1014603-8 = "То, что я уже сказала. Немедленно разойтись."
1014603-9 = "Вы пытаетесь без разрешения занять площадь для военных учений. Это можно расценить как демонстрацию силы и угрозу."
1014603-10 = "Так я же и подаю заявление на разрешение!"
1014603-11 = "И именно ВЫ, Общество Пандемониума, эти разрешения выдаёте, верно?"
1014603-12 = "Ты не ошибаешься."
1014603-13 = "Однако Префектура открыто нарушает распоряжения Общества Пандемониума. Поэтому мы не можем одобрить вашу заявку."
1014603-14 = "Да это ваша придурочная председатель сама назначила это чёртово место!"
1014603-15 = "Вы не даёте нам проводить учения, а потом заявляете, что мы их не проводим, и отказываете в разрешении! Вы вообще себя слышите?!"
1014603-16 = "Если у вас есть претензии, обращайтесь к нашему председателю."
1014603-17 = "Да ты...!"
1014603-18 = ""
1014603-20 = ""
1014603-26 = "Я оставил всё более шумную площадь позади и отправился искать Макото в клубной комнате Пандемониума."
1014603-28 = "...А выход — стать моделью в купальнике!"
1014603-29 = "Тогда я смогу показать всем этот образ, не замочив ни единого волоска!"
1014603-30 = "Какая блестящая идея! Как и следовало ожидать от меня, ки-хе-хе!"
1014603-31 = "...А? Сенсей, что происходит?"
1014603-32 = "Вы меня совсем не слушаете."
1014603-33 = "[s1] «Ну, понимаешь...»\n[s2] Рассказать, что произошло на площади."
1014603-36 = ""
1014603-38 = "Понятно. Поэтому вы и отвлеклись."
1014603-39 = "Превосходно. Рада слышать, что мои подчинённые продолжают добросовестно исполнять свои обязанности!"
1014603-40 = "Хм? Что-то не так, Сенсей?"
1014603-41 = "[s3] «Не то чтобы что-то не так...»\n[s4] «Но ты действительно терпеть не можешь Префектуру...»"
1014603-44 = "...Удивлена слышать от вас такое."
1014603-45 = "Возможно, именно положение преподавателя мешает вам это увидеть?"
1014603-46 = "У меня нет ничего особенного против Префектуры."
1014603-47 = "Скорее наоборот..."
1014603-48 = "Да и кому вообще нравится эта Префектура?"
1014603-49 = "Именно! Опросите каждого студента Геенны, и не услышите о ней ни единого доброго слова!"
1014603-50 = "Ведь сама причина её существования — дисциплина, то есть, по сути, подавление."
1014603-51 = ""
1014603-53 = ""
1014603-54 = "Требуя от студентов слепого подчинения, они попирают свободу, которую мы так ценим!"
1014603-55 = "Так почему мы должны им подчиняться? Неужели мы все плохие, если этого не делаем?"
1014603-56 = "Конечно нет! Геенна прекрасно справляется и без их дисциплины!"
1014603-57 = "Они делают вид, будто всё, что они творят, идёт на благо академии!"
1014603-58 = "Вот это и есть самое лицемерное! На самом деле они просто тешат своё самолюбие за счёт наших студентов!"
1014603-59 = "Это саму Префектуру следует призвать к порядку! И как следует!"
1014603-60 = "...Ах. Я немного увлеклась."
1014603-61 = "Мне даже неприятно тратить слова на разговоры о них."
1014603-62 = "[s5] «Спасибо за откровенность».\n[s6] «Ты много об этом размышляла»."
1014603-65 = "Вы единственный человек, с кем я могу об этом поговорить."
1014603-66 = "Меньше всего я хочу, чтобы студенты начали думать!"
1014603-67 = "Ведь сначала они начнут задумываться, потом задавать вопросы, затем выступать против системы, а это помешает воплощению моих грандиозных планов!"
1014603-68 = "[s7] «Уф! Вот теперь узнаю нашу Макото!»\n[s8] «Мне так дорога твоя улыбка!»"
1014603-71 = "Что вы такое...?"
1014603-72 = "А-А-А!! С меня хватит! Я больше не намерена это терпеть!!"
1014603-73 = ""
1014603-74 = "Всему есть предел! Нельзя бесконечно испытывать чужое терпение!"
1014603-75 = "Предлагаете обратиться к председателю? Отлично! ОТЛИЧНО! Чудесная мысль!"
1014603-76 = "Эй, председатель Общества Пандемониума, выходи сюда!"
1014603-77 = "Давай драться, прямо сейчас!!"
1014603-78 = ""
1014603-80 = "Член Префектуры? Как она вообще сюда добралась?!"
1014603-81 = "Охрана? Охрана?! Вы что, забыли о своих обязанностях?! Немедленно выведите её!"
1014603-82 = ""
1014603-84 = ""
1014603-85 = "Ай! Погодите, я же сегодня приказала им всем мешать Префектуре..."
1014603-86 = "Значит, здесь некому её остановить?!"
1014603-87 = ""
1014603-89 = ""
1014603-90 = ""
1014603-91 = "А-А-А! Наконец-то я тебя нашла, председатель Макото!"
1014603-92 = ""
1014603-94 = ""
1014603-95 = "П-постой!!"
1014603-96 = ""
1014603-98 = ""
1014603-99 = "[ns] «Может, все немного успокоимся?»"
1014603-100 = "С-Сенсей?"
1014603-101 = "[s9] «В общих чертах я понимаю, что происходит».\n[s10] «Я могу чем-нибудь помочь?»"
1014603-104 = ""
1014603-107 = "[ns11] «Я понимаю, как это несправедливо и обидно».\n[ns12] «Но если сорваться на ком-то, ничего не исправишь»."
1014603-110 = "Да знаю я, знаю?!"
1014603-111 = "*вздох* Знаю... Глава Префектуры Хина сказала бы то же самое."
1014603-112 = "Но моё терпение на исходе! Они вечно так поступают, стоит главе Префектуры и старшему администратору отлучиться!"
1014603-113 = ""
1014603-115 = ""
1014603-117 = ""
1014603-118 = "[ns13] «Макото, прошу тебя».\n[ns14] «Ради меня»."
1014603-121 = "А, а-а... Ладно. Речь шла об учениях?"
1014603-122 = "Я всё улажу. Проводите свои учения. Даю слово."
1014603-123 = "Этого достаточно?"
1014603-124 = "...Я, конечно, ворвалась сюда с угрозами, но обещаю, что на самом деле ничего бы не сделала."
1014603-125 = "*вздох*... Ладно."
1014603-126 = ""
1014603-128 = ""
1014603-129 = "..."
1014603-130 = "[s] «Прости, Макото»."
1014603-131 = "...Хм? За что?"
1014603-132 = "[s15] «За то, что только что произошло».\n[s16] «За то, что попросил тебя уступить»."
1014603-135 = ""
1014603-138 = "[ns] «Ты говорила, что не веришь в компромиссы...»"
1014603-139 = "...Всё так, как вы сказали."
1014603-140 = "Вы увидели, что возмущение члена Префектуры вполне оправдано несправедливым обращением, и заставили меня пойти на компромисс."
1014603-141 = "А это ведь тоже своего рода подавление моей свободы."
1014603-142 = "Но, странное дело... Я не злюсь."
1014603-143 = "Простите, но прошу пока оставить меня одну."
1014603-144 = "Мне нужно время, чтобы разобраться в своих чувствах."
1014603-146 = "Я оставил Макото размышлять о своих чувствах и отправился домой."
