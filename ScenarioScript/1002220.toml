[translation]
1002220-1 = "То, что всё ещё дорого"
1002220-2 = "Я с воодушевлением прибежал на пляж, где меня ждала Хина."
1002220-3 = ""
1002220-6 = ""
1002220-7 = "[ns] «Хина! Я пришёл!»"
1002220-8 = "О, Сенсей..."
1002220-9 = "Я переживала, потому что подумала, что просьба могла быть слишком внезапной..."
1002220-10 = ""
1002220-12 = ""
1002220-13 = "Ты пришёл без малейших колебаний. Спасибо, Сенсей."
1002220-14 = "[s] «Ну, ради тебя я всегда приду. Я рад быть здесь.»"
1002220-15 = "А..."
1002220-16 = "...Понятно. Ты рад быть здесь..."
1002220-17 = "...Хи-хи."
1002220-18 = "[s1] «Я довольно хорошо плаваю! Можешь на меня рассчитывать!» \n[s2] «Я вообще не умею плавать, но постараюсь!»"
1002220-19 = "Похоже, я в надёжных руках."
1002220-20 = "О-О... Понятно..."
1002220-21 = "[s3] «Тогда просто будем учиться вместе, шаг за шагом!»"
1002220-22 = "Если... Если ты так говоришь..."
1002220-23 = "Сенсей, мне ведь нужно соответствовать твоему настрою, да?"
1002220-24 = "Я постараюсь изо всех сил, чтобы не отнимать слишком много твоего времени этим уроком."
1002220-25 = ""
1002220-27 = ""
1002220-28 = "Это одна из немногих моих сильных сторон. Я быстро учусь."
1002220-29 = "Тогда не будем терять время и приступим—"
1002220-31 = ""
1002220-33 = "[ns] «Подожди, так не пойдёт.»"
1002220-34 = "Прости? Что ты имеешь в виду?"
1002220-35 = "[s4] «Главное — учиться медленно и уверенно, а не как можно быстрее!» \n[s5] «Чтобы чему-то научиться, нужно потратить время!»"
1002220-38 = "Нет, я имею в виду... Я не могу просто валять дурака. Это один из твоих драгоценных выходных."
1002220-39 = "Будет жаль, если ты проведёшь его целиком со мной..."
1002220-40 = "[s] «Вовсе нет! Даже если мы ничего не будем делать, я буду рад провести выходной с тобой.»"
1002220-41 = "...Т-Т-Ты действительно хотел провести весь день... т-т-только со мной...?"
1002220-42 = "Ты серьёзно? Тогда докажи мне это прямо сейчас."
1002220-43 = "П-П-Подожди! Я не это имела в виду! Вставай! Ты устроишь сцену! Сенсей!"
1002220-44 = "Ты правда просто..."
1002220-45 = "..."
1002220-46 = "Пф."
1002220-47 = "Ну, для тебя это точно вполне в характере."
1002220-48 = "Ладно, хорошо, Сенсей."
1002220-49 = "[s] «Хорошо, пойдём!»"
1002220-50 = "Ну..."
1002220-51 = ""
1002220-54 = ""
1002220-57 = "Ч-что Вы делаете?"
1002220-58 = "Почему вы вдруг начали в нас стрелять?!"
1002220-59 = ""
1002220-61 = ""
1002220-62 = "Почему? Это же очевидно!"
1002220-63 = "Мы... страстно ненавидим тех, кто начинает ворковать друг с другом только потому, что наступило жаркое лето!"
1002220-64 = "Я собираюсь испортить всем счастье!"
1002220-65 = "А особенно — испорчу день тем, кто выставляет своё счастье напоказ!"
1002220-66 = "Что это вообще за бессмысленная причина?!"
1002220-68 = ""
1002220-70 = ""
1002220-71 = "[ns] «Хина, вон там...!»"
1002220-72 = ""
1002220-73 = "...Сенсей, пожалуйста, отойди."
1002220-74 = "Я ненадолго."
1002220-75 = ""
1002220-77 = "[ns] «Что? Хина!»"
1002220-78 = ""
1002220-80 = ""
1002220-81 = "А? Ты кто такая?"
1002220-82 = "Маленький рост... серебряные волосы... Стоп, она же...!"
1002220-83 = ""
1002220-85 = ""
1002220-86 = "А-Аааа?!"
1002220-87 = "П-Почему здесь знаменитая своей силой староста Геенны?! Аргх!!"
1002220-88 = ""
1002220-90 = ""
1002220-94 = "Хина безжалостно разобралась с нарушителями."
1002220-96 = ""
1002220-97 = "С-Спасибо! Вы нас правда спасли!"
1002220-98 = "Я даже не знаю, как вас отблагодарить!"
1002220-99 = "Не нужно. Я просто поступила правильно."
1002220-101 = "Сразу после того как она отправила благодаривших её людей восвояси..."
1002220-103 = ""
1002220-106 = "[ns] «Хорошая работа, Хина.»"
1002220-107 = ""
1002220-108 = "Ничего необычного."
1002220-109 = "В Геенне я не раз видела таких — летом некоторые студенты совсем перестают себя контролировать."
1002220-110 = "Полагаю, подобное уже стало обычным делом."
1002220-111 = "[s] «Как и ожидалось от старосты Геенны!»"
1002220-112 = "Я... дело не в этом..."
1002220-113 = ""
1002220-117 = "[ns] «А? Хина, что это был за звук?»"
1002220-118 = "О. Похоже, круг прокололся."
1002220-119 = "[s] «Разве это не тот самый, который ты всегда носишь с собой? Как он вдруг...?»"
1002220-120 = "Похоже... в него попала пуля во время боя."
1002220-121 = "Это была моя ошибка."
1002220-122 = "Даже в бою я могла бы этого избежать, если бы была внимательнее."
1002220-123 = "К тому же это снаряжение Дисциплинарного комитета... Я так долго им пользовалась, что стала относиться к нему слишком беспечно."
1002220-124 = "[s] «Значит, он просто старый. Это не твоя вина.»"
1002220-125 = "Нет, Сенсей..."
1002220-126 = "Это была моя собственная неосторожность."
1002220-127 = "Ну... С уже сломанной вещью мало что сделаешь."
1002220-128 = "..."
1002220-129 = "[s] «Тогда пойдём его починим?»"
1002220-130 = "Починим? Круг?"
1002220-131 = "Возможно, это не так просто, как звучит..."
1002220-132 = "Это снаряжение Дисциплинарного комитета, поэтому оно сделано из особого материала."
1002220-133 = "Мне пришлось бы вернуться в академию и подать заявку на ремонт..."
1002220-134 = "Наверное, стоило ожидать, что что-то подобное случится... А ведь Сенсей собирался ещё научить меня плавать..."
1002220-135 = "Хмф. Конечно же, это должно было случиться именно со мной..."
1002220-136 = "..."
1002220-137 = "...Хотя, пожалуй, можно посмотреть на это с хорошей стороны."
1002220-138 = "[s] «Хина?»"
1002220-139 = "Я пользуюсь этим кругом уже так давно, что никогда всерьёз не думала о том, что однажды придётся с ним расстаться."
1002220-140 = "Но когда-нибудь придётся. Я ведь не могу вечно плавать с кругом, правда?"
1002220-141 = "Представь себе — грозная староста, привязанная к утиному кругу. Ха-ха."
1002220-142 = "Наверное, так тому и быть."
1002220-143 = "Так даже будет лучше для нашего урока плавания, Сенсей."
1002220-144 = "..."
1002220-145 = "Хорошо, Сенсей. Я готова тренироваться без круга."
1002220-146 = "[s] «Ну, технически ты права. Мы можем тренироваться и без него.»"
1002220-147 = "...А?"
1002220-148 = "[s] «И рано или поздно тебе всё равно придётся перестать им пользоваться, как ты сама сказала.»"
1002220-149 = "С-Сенсей?"
1002220-150 = "[s] «Но ведь этот день не обязан быть именно сегодня, правда?»"
1002220-151 = "...! Это..."
1002220-152 = "Это не совсем неправда, но..."
1002220-153 = "[s6] «И самое главное — я очень хотел снова увидеть, как происходит „это“!» \n[s7] «Но я всё ещё не увидел милую Хину, которая не знает, что делать на своём круге!»"
1002220-156 = "С-Сенсей?! Что ты вдруг такое говоришь...?!"
1002220-157 = "Если ты не шутишь... я правда разозлюсь."
1002220-158 = "[ns] «Я-Я хочу сказать, не сдавайся, даже не попытавшись найти решение!»"
1002220-160 = "[ns] «Разве твой драгоценный детский круг не хранит для тебя важные воспоминания?!»"
1002220-161 = "Сенсей..."
1002220-162 = "...Господи."
1002220-163 = "Ты всегда такой."
1002220-164 = "Ладно. Хорошо."
1002220-165 = "[s8] «Отлично! Давай поищем место!» \n[s9] «Постараемся изо всех сил его починить!»"
1002220-169 = "Убедив Хину, я начал искать место, где можно было бы починить круг."
1002220-170 = ""
1002220-175 = ""
1002220-176 = ""
1002220-177 = ""
1002220-178 = ""
1002220-179 = ""
1002220-180 = ""
1002220-181 = ""
1002220-182 = ""
1002220-184 = ""
1002220-185 = ""
1002220-186 = ""
1002220-187 = ""
1002220-188 = ""
1002220-189 = ""
1002220-190 = ""
1002220-195 = ""
1002220-196 = "Это... думаю, я смогу починить."
1002220-197 = "...Правда?"
1002220-198 = "Особый материал из ресурсов, встречающихся только в Геенне... Ничего обещать не могу, но я бы с удовольствием взялся за такой вызов!"
1002220-199 = "Тогда оставляем его на вас."
1002220-200 = "[s] «Вы наша единственная надежда!»"
1002220-201 = ""
1002220-203 = ""
1002220-208 = "В итоге нам удалось починить круг."
1002220-210 = ""
1002220-211 = ""
1002220-212 = ""
1002220-213 = "Эта уточка снова готова плавать!"
1002220-214 = "[s] «Спасибо!»"
1002220-215 = "С-Спасибо..."
1002220-216 = "И вам спасибо! Для меня это был отличный опыт! Рад, что вы довольны."
1002220-217 = ""
1002220-219 = ""
1002220-221 = ""
1002220-222 = "[ns] «Фух, Хина! Какое облегчение!»"
1002220-223 = "М-м. И правда. Я всё ещё удивлена."
1002220-224 = "Честно говоря, я думала, что повреждения слишком серьёзные и ремонт невозможен. Просто пыталась себя утешить..."
1002220-225 = "Спасибо, Сенсей."
1002220-226 = "[s] «Не стоит.»"
1002220-227 = ""
1002220-230 = "Но... мы потратили весь день на поиски места, где можно починить круг..."
1002220-231 = "...Спасибо, что сегодня потакал мне, Сенсей."
1002220-232 = "Это я сама тебя позвала. Не хочу задерживать тебя слишком долго."
1002220-233 = "[s] «Нет, Хина. День ещё не закончился.»"
1002220-234 = "...Хм?"
1002220-235 = "[s10] «Кажется, я что-то тебе обещал, разве нет?» \n[s11] «Я обещал всегда стараться ради тебя. Плавание тоже считается.»"
1002220-236 = ""
1002220-237 = ""
1002220-240 = "[ns12] «Для тебя уже слишком поздно?»\n[ns13] «Как насчёт урока?»"
1002220-241 = "А..."
1002220-242 = "А..."
1002220-243 = "Ты всё ещё готов... ради меня?"
1002220-244 = ""
1002220-246 = ""
1002220-247 = ""
1002220-249 = "В таком случае..."
1002220-250 = "С твоего разрешения я заберу себе остаток твоего выходного."
1002220-251 = ""
1002220-253 = ""
1002220-255 = "Я тоже обещаю стараться. Буду твоим лучшим студентом."
1002220-257 = ""
1002220-260 = "А потом мы вместе плавали на пляже до глубокой ночи, пока луна не начала опускаться за горизонт."
