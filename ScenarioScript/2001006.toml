[translation]
2001006-1 = "Тренировка на горячих источниках: отдых и расслабление"
2001006-2 = "Добро пожаловать. Большое спасибо, что посетили нашу ножную ванну «Гуцу-Гуцу»!"
2001006-3 = "Как вы, возможно, слышали, вода в нашей ножной ванне богата природными минералами и очень полезна при растяжениях и кожных заболеваниях."
2001006-4 = "Кроме того, нас окружает прекрасный сад, так что вы сможете расслабиться, наслаждаясь ножной ванной."
2001006-5 = ""
2001006-7 = ""
2001006-9 = ""
2001006-10 = "Горячий источник, о котором вы говорили, оказался ножной ванной."
2001006-11 = "Я нервничала, потому что думала, что вы хотите принять ванну вместе."
2001006-12 = "[s] «Может, лучше было пойти на другой горячий источник?»"
2001006-13 = "Н-Нет! Ножной ванны более чем достаточно!"
2001006-14 = "В конце концов, я повредила только лодыжку, так что мне вовсе не нужна лечебная ванна для всего тела!"
2001006-15 = "И... я пока морально не готова принимать ванну вместе с вами."
2001006-16 = "[s] «Что, прости?»"
2001006-17 = "Н-Ничего!"
2001006-18 = ""
2001006-20 = ""
2001006-22 = ""
2001006-24 = "Ну же, Сенсей. Пойдём!"
2001006-27 = "― *вздох* Какая прекрасная ванна.[wa:1500]"
2001006-29 = "― Кажется, боль в лодыжке проходит.[wa:800]"
2001006-32 = "― Здесь и правда очень красивый вид.[wa:1530]"
2001006-35 = "― Этот ухоженный сад...[wa:10]"
2001006-37 = "― ...правда прекрасен.[wa:10]"
2001006-40 = "― Жаль только, что крыша закрывает[wa:1500]"
2001006-42 = "― ночное небо."
2001006-45 = "[ns] «Наверное, стоило найти другой горячий источник.»"
2001006-46 = "― Вообще-то,[wa:440]"
2001006-48 = "― думаю, и так тоже хорошо.[wa:130]"
2001006-51 = "― Этот роскошный миг в горячем источнике...[wa:830]"
2001006-54 = "― ...вместе с вами, Сенсей."
2001006-56 = "― Придётся сохранить это в тайне. Даже от звёзд на небе.[wa:10]"
2001006-59 = "[ns] «Лодыжке уже лучше?»"
2001006-60 = "Да. Она ещё не совсем зажила, но болит гораздо меньше."
2001006-61 = "Спасибо, что привезли меня на такой хороший курорт с горячими источниками, Сенсей."
2001006-62 = "[ns] «Готова возвращаться?»"
2001006-63 = "Нет, я давно не бывала на горячих источниках в другом районе. Было бы жаль просто взять и уйти!"
2001006-64 = "Нужно воспользоваться возможностью и самой посмотреть, какие товары здесь продают и какие услуги предлагают."
2001006-65 = ""
2001006-67 = ""
2001006-68 = ""
2001006-70 = "Всё это... тоже часть моей тренировки на горячих источниках!"
2001006-72 = "(После этого мы с Нодокой приятно провели вечер на горячих источниках.)"
