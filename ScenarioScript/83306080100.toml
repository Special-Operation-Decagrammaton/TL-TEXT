[translation]
83306080100-5 = ""
83306080100-6 = "Пока Фуука готовит обычное меню Клуба школьных обедов для студентов Геенны..."
83306080100-7 = "Я, Ушимаки Джури, приготовлю специальный полевой обед для Общества Пандемониума!"
83306080100-8 = "У тебя непростая задача — тащиться сюда ради приготовления еды."
83306080100-9 = "Я просто хочу немного поднять настроение Обществу Пандемониума... После обрушения зала собраний они такие подавленные. Может, моя еда поможет."
83306080100-10 = "Даже когда нам грустно, важно есть! Забота о теле — первый шаг к заботе о сердце!"
83306080100-11 = "(Судя по выражению лица Макото, не похоже, что они сильно подавлены...)"
83306080100-12 = "Сначала заверну ингредиенты в фольгу... и положу их в эту бочку..."
83306080100-13 = ""
83306080100-15 = ""
83306080100-16 = ""
83306080100-18 = "...А?"
83306080100-20 = "Хм? Джури? Что-то не так?"
83306080100-21 = ""
83306080100-31 = "Я просто готовлю десерт для Общества Пандемониума...!"
83306080100-32 = ""
83306080100-34 = ""
83306080100-35 = "Н-но он вдруг начал двигаться...! П-почему?!"
83306080100-37 = "(Мы снаружи руин Зала собраний Общества Пандемониума... где Отдел горячих источников вёл раскопки...)"
83306080100-38 = "(Неужели вода... Опять горячий источник?)"
83306080100-39 = ""
83306080100-44 = "Ч-Чего-о-о?! Все — о-осторожно!"
