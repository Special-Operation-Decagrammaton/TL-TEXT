[translation]
13400-1 = "Episódio 40;As Pegadas Deixadas por um Sonho"
13400-5 = "Os raios..."
13400-6 = "Por todo o oásis..."
13400-10 = "Hina-chan, consegue se levantar?"
13400-14 = "...Sim, estou bem."
13400-23 = "Isso é..."
13400-24 = "...Fogos de artifício?"
13400-25 = "Será que reagiu aos raios...?"
13400-34 = "...Isso é..."
13400-35 = "Ei, aquilo ali não tem formato de peixe?"
13400-36 = "Que lindo... Parece até o mar!"
13400-39 = "..."
13400-40 = "Será que...#nNão é aquele mineral que gera plasma quando recebe algum estímulo?"
13400-41 = "Mas deveria ser um metal raro e caríssimo."
13400-42 = "..."
13400-45 = "(Caríssimo...?)"
13400-46 = "...O sol está nascendo."
13400-49 = "...Você tinha razão, senpai."
13400-50 = "Eu encontrei o tesouro."
13400-51 = "Nunca imaginei que realmente conseguiria encontrar, mas..."
13400-52 = "Eu estava errada..."
13400-55 = "...Senpai."
13400-63 = "U-Uau!#nEstá ainda mais intenso que antes!"
13400-64 = "...Faz sentido. Não é à toa que vale 10 milhões de ienes a cada 100g."
13400-65 = "Hã?!"
13400-66 = "Quê?"
13400-67 = "Nos últimos dois anos, o preço de mercado subiu umas dez vezes."
13400-68 = "E-Ei, a gente tem que parar essa reação em cadeia de algum jeito!#nNão, o dinheiro!"
13400-69 = "Vamos garantir pelo menos um pouco!#nAyane-chan, cadê a pá?!"
13400-70 = "Mesmo que você peça assim do nada..."
13400-71 = "Poxa, você tinha que ter trazido uma!"
13400-74 = "Não, acho que só com uma picareta—"
13400-75 = "Tem algum jeito de parar essa explosão?"
13400-76 = "...Acho que é impossível.#nA reação em cadeia vai continuar até que todo o mineral da região se queime."
13400-77 = "Uau!#nQue mágico~☆"
13400-82 = "Shiroko, não use a máscara que eu te dei como sacola."
13400-83 = "Mas..."
13400-84 = "Shiroko-senpai, chamar as duas pelo mesmo nome confunde tudo, não dá pra dar um jeito nisso?"
13400-85 = "Então eu vou te chamar de \"Shiroko Pequena\"."
13400-86 = "Nn, eu vou crescer logo."
13400-87 = "Então, \"Shiroko Fraca\"."
13400-91 = "Ei, isso é perigoso!"
13400-92 = "É inútil. Eu vivi coisas que você não viveu e sei coisas que você não sabe. Essa diferença—"
13400-93 = "Nn, dessa vez eu não vou perder."
13400-96 = "Poxa, se acalmem, por favor!"
13400-97 = "Uau~, será que já está chegando o gran finale?"
13400-106 = "Hmm..."
13400-107 = "...Ah, deixa pra lá."
13400-110 = "Sempre que o velhote aqui tenta pagar de descolado, acaba assim~"
13400-111 = "...Uhe~"
13400-113 = "Próximo;O Que Ficou para Trás"
