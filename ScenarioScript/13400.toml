[translation]
13400-1 = "Эпизод 40;Следы мечты"
13400-5 = "Молнии..."
13400-6 = "По всему высохшему оазису..."
13400-7 = ""
13400-9 = ""
13400-10 = "Ты можешь встать, Хина?"
13400-11 = ""
13400-13 = ""
13400-14 = "Да. Я могу идти сама."
13400-15 = ""
13400-17 = ""
13400-20 = ""
13400-23 = "Это..."
13400-24 = "...фейерверки?"
13400-25 = "Это реакция на молнии? Похоже, они не опасны..."
13400-26 = ""
13400-28 = ""
13400-34 = "Это..."
13400-35 = "Смотрите на тот! Он немного похож на рыбу."
13400-36 = "Как красиво... будто небо превратилось в океан."
13400-39 = "..."
13400-40 = "Я слышала слухи о минерале, способном создавать ионно-плазменный эффект при реакциях с экстремально высокой температурой. Говорят, он даже способен придавать свету форму..."
13400-41 = "Но почему он здесь? Это невероятно редкий металл, и к тому же очень дорогой."
13400-42 = "..."
13400-45 = "(Дорогой...?)"
13400-46 = "...Солнце встаёт."
13400-49 = "Ты была права, Юмэ. Сокровище всё это время было здесь."
13400-50 = "Я думала, что никогда не смогу найти следы..."
13400-51 = "...того, что ты оставила..."
13400-52 = "Я ошибалась..."
13400-55 = "Да. Я правда ошибалась, Юмэ."
13400-56 = ""
13400-63 = "О-Ого! Теперь они взрываются всё быстрее!"
13400-64 = "Понятно. Наверное, именно из-за этой цепной реакции сто граммов стоят почти десять миллионов йен."
13400-65 = "Что?!"
13400-66 = "Что?"
13400-67 = "Примерно такова нынешняя рыночная цена. За последние два года она выросла почти в десять раз."
13400-68 = "Г-Гах! Нет! Остановите это! Наши деньги горят! Всё горит как лесной пожар!"
13400-69 = "Л-Лопата! Нужна лопата! Аяне, лопату!"
13400-70 = "К сожалению, я не ношу лопату с собой просто так..."
13400-71 = "Ну, теперь тебе реально стоит об этом подумать!"
13400-72 = ""
13400-74 = "Нет, лучше носите кирку. Ею легче разбивать землю."
13400-75 = "Есть какой-нибудь способ остановить взрывы?"
13400-76 = "...Нет. Реакция будет продолжаться, пока гореть не останется нечему."
13400-77 = "Ого! Смотрите, как красиво! ♧"
13400-78 = ""
13400-82 = "Эй. Широко. Пожалуйста, не используй маску, которую я тебе дала, как сумку."
13400-83 = "Эм... но минералы..."
13400-84 = "Эй, Широко. Можешь как-нибудь иначе называть другую Широко? Уже реально путаюсь."
13400-85 = "Тогда... буду звать её «Маленькая Широко»."
13400-86 = "Отказ. Я очень скоро стану выше."
13400-87 = "А. Придумала. «Слабая Широко»."
13400-88 = ""
13400-91 = "Гах, Широко! Опусти оружие! Не стрелять!"
13400-92 = "Бесполезно. Я пережила то, чего ты ещё не пережила, знаю то, чего ты ещё не знаешь. Ты не сможешь сократить разрыв между—"
13400-93 = "Да. Я уже один раз с тобой дралась, так что теперь не проиграю."
13400-94 = ""
13400-96 = "Да прекратите уже!!"
13400-97 = "Ого! Смотрите, всё взрывается разом! Грандиозный финал! Невероятное зрелище! ♧"
13400-98 = ""
13400-106 = "...Да, и правда."
13400-107 = "Стоит этой старушке попытаться сказать что-нибудь крутое, всё обязательно заканчивается вот так, да?"
13400-110 = "...Ну, ничего не поделаешь."
13400-111 = "Хех-хех."
13400-113 = "Следующий эпизод;Что остаётся после"
