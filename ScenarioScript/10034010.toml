[translation]
10034010-1 = "Эпизод 1;Давайте создадим группу!!"
10034010-2 = "Не могу поверить, что вы просто схватили случайную еду и съели её!"
10034010-4 = "[ns1] «Почему, это была, типа, ограниченная серия?!»\n[ns2] «Ну тогда надо было хотя бы как-то это подписать!!»"
10034010-5 = "Н-ну... нет, но всё равно!"
10034010-6 = "Я собиралась всё подписать! Вы съели это раньше, чем я успела!"
10034010-7 = ""
10034010-9 = ""
10034010-10 = "А что именно вы вообще схватили? Как оно выглядело?"
10034010-11 = "...Вы не помните?! Вы что, вообще не смотрели и просто схватили первое попавшееся?!"
10034010-12 = "Отлично, теперь мне придётся пересчитать ВСЁ и выяснить, чего не хватает!"
10034010-13 = "Эй, успокойся. Криком это не исправить."
10034010-14 = "Такое бывает. Сенсей не знал, что возникнет проблема."
10034010-15 = "Гр-р...! Да, я знаю, но...! Но...!!"
10034010-16 = "А-а-аргх!!"
10034010-17 = "...Ладно, может, я слишком остро реагирую, но это просто НЕВЕЗЕНИЕ, что вы съели именно это и именно сейчас!"
10034010-18 = "...Хм? Что ты сказала?"
10034010-19 = "Вы не понимаете, что происходит? Ну да, ладно. Я действительно немного увлеклась с криками."
10034010-20 = "В общем, я собиралась попросить вас оценить все эти сладости."
10034010-21 = "Поэтому и разложила их на столе. Чтобы вы всё попробовали и вынесли вердикт."
10034010-22 = "[s3] «Ты хочешь, чтобы я съел... всё это?»\n[s4] «Ты хочешь, чтобы я их оценил?»"
10034010-25 = "Именно. Нам нужно мнение со стороны."
10034010-26 = "Мы выбираем сладости для Десертного кафе."
10034010-27 = "[s] «...Десертного кафе?»"
10034010-28 = "Да. Вполне подходящее название для главной достопримечательности Карнавала Тринити — грандиозного события, которое приближается слишком быстро."
10034010-29 = "Многочисленные клубы Тринити будут изо всех сил пытаться превзойти друг друга в суровой битве пекарен!"
10034010-30 = "...Если говорить проще, у каждого будет своё небольшое тематическое кафе."
10034010-31 = "На школьном фестивале. Он уже скоро."
10034010-32 = "И для нас это довольно большое событие. Почти все клубы участвуют."
10034010-33 = "[s5] «Понятно, поэтому вы меня и позвали.»\n[s6] «Хотите оставить выбор меню мне?»"
10034010-37 = "Ага, это была моя идея. Неплохо, да? Что скажете?"
10034010-38 = "А?"
10034010-39 = "Ну нет, не всё в клубе — моя идея. Не совсем."
10034010-40 = "У нас нет президента или кого-то такого, так что всё обычно решает тот, кому первому приходит идея. В этот раз это была она."
10034010-41 = "...Повтори?"
10034010-42 = "Хотите знать, кто создал клуб, если президента нет?"
10034010-43 = ""
10034010-45 = ""
10034010-46 = "Ага. Так вот что вас заинтересовало, да...?"
10034010-47 = "Хм-м."
10034010-48 = "О, давайте превратим это в игру!"
10034010-49 = "Ладно, все тихо-тихо. Пусть Сенсей угадает, кто это мог быть."
10034010-50 = "...Ну? Сенсей?"
10034010-51 = "Как думаете, кто из нас основал клуб?"
10034010-52 = ""
10034010-54 = ""
10034010-55 = ""
10034010-56 = ""
10034010-57 = "[ns7] «...Ёшими?»\n[ns8] «...Нацу?»\n[ns9] «...Казуса?»"
10034010-58 = "Хм. Большинство думает, что это я, потому что у меня здесь самые сильные мнения..."
10034010-59 = "И больше всего энергии."
10034010-60 = "...Нет, я бы сказала, Нацу буянит сильнее меня."
10034010-61 = "Хм? Вы собираетесь впутать в это меня...?"
10034010-62 = "Хм... Если подумать, наверное, так и есть."
10034010-63 = "Что? Что за предательство?"
10034010-64 = ""
10034010-66 = ""
10034010-67 = ""
10034010-68 = ""
10034010-69 = "Нет, если бы Нацу основала клуб, в него бы никто никогда не вступил."
10034010-70 = "Правда?"
10034010-71 = "Хи-хи. Твоя скромность очаровательна. Но давай, скажи правду!"
10034010-72 = "Мне пришлось бы сделать больше, чем просто сказать."
10034010-73 = "Угх. Похоже, мне лучше вмешаться..."
10034010-74 = ""
10034010-75 = ""
10034010-76 = "Эй-эй. Мы клуб сладостей. Не банда головорезов."
10034010-77 = "О, это уже боевые слова."
10034010-79 = "Все, мы — Четыре Божественных Зверя Банды сладкоежек после уроков!"
10034010-80 = ""
10034010-82 = ""
10034010-88 = "Не ставь щит!!"
10034010-89 = "Я буду непоколебимо стоять против любого насилия!!"
10034010-90 = ""
10034010-91 = "А, хватит! Давайте уже займёмся делом."
10034010-92 = "Мы ВООБЩЕ-ТО должны закончить выбирать десерты до возвращения Айри! Мы даже не начали!!"
10034010-93 = "Что бы сказала Айри, если бы вернулась и увидела нас в таком бардаке...?"
10034010-94 = ""
10034010-99 = ""
10034010-100 = "Давайте создадим группу!!"
10034010-101 = "Вот и ответ. Она бы сказала: «Давайте создадим группу»."
10034010-102 = ""
10034010-104 = ""
10034010-105 = "...Группу...?"
10034010-107 = "Все...!!"
10034010-108 = "Группу...!"
10034010-109 = "...Давайте!!"
10034010-110 = ""
10034010-111 = "...Группу?"
10034010-112 = ""
10034010-114 = ""
10034010-116 = ""
10034010-117 = "[ns10] «Группа, вот так внезапно?»\n[ns11] «Такого я не ожидал.»"
10034010-120 = "О... Сенсей?"
10034010-121 = "Я не знала, что вы здесь. Но да, теперь мы создаём группу!"
10034010-122 = "П-погоди секундочку, Айри."
10034010-123 = "Мы серьёзно собираемся вот так внезапно это делать?"
10034010-124 = ""
10034010-126 = ""
10034010-128 = ""
10034010-129 = "Вообще-то да, довольно внезапно."
10034010-130 = "И надо же, именно Казуса ставит идею Айри под сомнение..."
10034010-131 = "Редчайший случай, без сомнений."
10034010-133 = "Это не внезапно! Послушайте, это НАШЕ кафе! Для школьного фестиваля!"
10034010-134 = "Разве вы не думаете, что в нём должно быть что-то особенное? Кафе с живой группой будет идеально!"
10034010-135 = "Мы, конечно, МОГЛИ бы просто открыть обычное Десертное кафе, но так делают все остальные!"
10034010-137 = "Н-ну...?"
10034010-138 = "Ого. Смелое заявление."
10034010-139 = "Забавно. Вот мы, Клуб сладкоежек после уроков, решили, что одних сладостей недостаточно."
10034010-141 = "Нельзя терять время! Единственный шанс показать нашу группу будет на открытии школьного фестиваля."
10034010-142 = "А прослушивание туда через две недели! Даже если мы сегодня купим инструменты и начнём тренироваться, времени будет едва хватать!"
10034010-143 = "Его НЕ хватит. Мы не сможем."
10034010-144 = "Эй, не говори «не сможем», пока мы даже не попробовали."
10034010-145 = ""
10034010-146 = ""
10034010-147 = "О, теперь я плохая...?"
10034010-148 = "Стоит тебе разогнаться, и тебя уже не остановить."
10034010-149 = "Я ВООБЩЕ не ожидала ничего из этого."
10034010-151 = "А? Что такое? Почему вы все такие..."
10034010-152 = "Странные. Я думала, все сразу согласятся."
10034010-153 = "Как и почему ты вообще могла так подумать...?"
10034010-154 = "Успокойтесь, все."
10034010-155 = ""
10034010-157 = ""
10034010-158 = ""
10034010-160 = "[ns12] «Почему именно группа, Айри?»\n[ns13] «Что тебя на это вдохновило?»"
10034010-163 = "А-а...? Вы спрашиваете меня...?"
10034010-164 = "Н-ну... Хм... Это... В общем..."
10034010-165 = "Я..."
10034010-166 = ""
10034010-168 = ""
10034010-169 = "Я просто подумала, что мы должны сделать ХОТЬ ЧТО-НИБУДЬ..."
10034010-170 = "[s] «...»"
10034010-171 = ""
10034010-174 = "[ns] «...?»"
10034010-175 = "...Нет!"
10034010-176 = ""
10034010-178 = ""
10034010-179 = ""
10034010-180 = "Нет, нет, нет, нет, нет, нет, нет!! Нет!!"
10034010-181 = "Ни за что. Нет! Даже для Айри «нет» значит «нет»!!"
10034010-182 = "Мы вообще о чём говорим? То есть обычно я соглашаюсь, но это уже перебор! И ты же не Нацу!"
10034010-183 = "А я тут при чём?"
10034010-184 = "Группа?! Мы клуб сладостей!"
10034010-185 = "Как музыка вообще связана со сладостями?! Если мы делаем это КАК клуб сладостей, разве не должно быть ХОТЬ ЧТО-ТО связанное со сладостями?!"
10034010-187 = "Ё-Ёшими..."
10034010-188 = "Неприкрашенная правда редко обходится без заноз."
10034010-189 = "Нацу..."
10034010-190 = "...Прости, Айри."
10034010-191 = "Даже Казуса..."
10034010-192 = ""
10034010-195 = "[ns14] «Думаю, Ёшими права.»\n[ns15] «Эй, Айри. Давай переведём дух и немного подумаем.»"
10034010-198 = "...Сенсей..."
10034010-199 = ""
10034010-201 = ""
10034010-202 = "Х-Хорошо..."
10034010-203 = "..."
10034010-204 = "Ладно, значит, если бы это БЫЛО как-то связано со сладостями, всё было бы нормально, да...? Да...?"
10034010-206 = "...Что?"
10034010-207 = "Связано с...?"
10034010-208 = "Десертами...?"
10034010-210 = "Вообще-то я кое-что случайно захватила по дороге сюда. Смотрите!"
10034010-211 = "«Случайно» захватила? Ты всё это время была подготовлена..."
10034010-212 = ""
10034010-214 = ""
10034010-215 = ""
10034010-216 = ""
10034010-217 = "...? На что я смотрю...?"
10034010-218 = "Это плакат с набором участников на праздничный концерт открытия школьного фестиваля. Связи со сладостями я пока не вижу..."
10034010-219 = "...Нет, погоди. Ёшими. Стоп."
10034010-220 = "...Посмотри. Внизу плаката. «Награды за участие в концерте для музыкальных групп»."
10034010-221 = "...Награды? Какие...?"
10034010-222 = ""
10034010-224 = ""
10034010-225 = "...А."
10034010-227 = "...Ох."
10034010-228 = "Не может быть..."
10034010-229 = ""
10034010-231 = ""
10034010-232 = ""
10034010-233 = "[ns16] «...Frederica Semla?»\n[ns17] «Это название десерта или чего-то такого?»"
10034010-236 = "Именно, Сенсей! Frederica Semla..."
10034010-237 = "...королева семлы."
10034010-238 = "Это легендарная булочка. Настолько вкусная, что королева одной древней страны съела подряд четырнадцать штук. А потом рухнула без сил."
10034010-240 = "Надеюсь, у них настоящая, а не те дешёвые подделки, которые продаются в магазине."
10034010-241 = "Нет, это Карнавал Тринити. Его организует само Чаепитие. Они бы никогда не опустились до мелкой подделки."
10034010-242 = "...Значит, она НАСТОЯЩАЯ? Настоящая Frederica Semla...? Серьёзно...?"
10034010-243 = "Ну, это уже совсем другое дело... Я бы даже сказала, совсем другая проблема."
10034010-244 = "Совершенно другое. Это меняет саму парадигму. Мы — Клуб сладкоежек после уроков..."
10034010-245 = ""
10034010-247 = ""
10034010-248 = "...«Те, кто живёт ради охоты на ещё не попробованные десерты»."
10034010-250 = "...Хи-хи."
10034010-251 = "Ёшими? Все?"
10034010-252 = "Ну как теперь? Что думаете?"
10034010-253 = "Мы готовы на это?"
10034010-254 = ""
10034010-255 = ""
10034010-256 = ""
10034010-257 = ""
10034010-259 = ""
10034010-260 = "[ns18] «...Погоди, когда ты говоришь ВСЕ...»\n[ns19] «Почему все смотрят на меня?»"
10034010-263 = "...Сенсей."
10034010-265 = "Давайте создадим группу!"
