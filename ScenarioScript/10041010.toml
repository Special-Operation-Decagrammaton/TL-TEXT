[translation]
10041010-1 = "Эпизод 1;Доказательство себя"
10041010-3 = "[log]1 неделю назад[/log]"
10041010-9 = "...Непостижимо! Если тебе нужно напомнить..."
10041010-10 = "...подобные задачи всегда были МОЕЙ обязанностью. У меня гораздо больше опыта, чем у Нагисы."
10041010-11 = "Так почему ты говоришь такое...?"
10041010-12 = "...Погоди, ты больше не считаешь, что я на это способна?"
10041010-13 = ""
10041010-16 = "Ты же знаешь, я не это имею в виду, Сэя. Я просто..."
10041010-17 = ""
10041010-20 = "[ns] «...?»"
10041010-21 = "С-Сэя? Что случилось? Ты очень расстроена. Почему?"
10041010-22 = "Тебе обязательно спрашивать? Ты никогда не меняешься, да, Мика?"
10041010-23 = "Сэя?!"
10041010-24 = "Спокойнее, Сэя. Мика, давай сначала её выслушаем, прежде чем говорить что-то ещё."
10041010-25 = "О, прекрасно, давайте я объясню всё ещё раз с самого начала..."
10041010-26 = "И снова: что у тебя за отношение?"
10041010-27 = "Обе, пожалуйста, успокойтесь. Если кто-нибудь это услышит, может неправильно понять и решить, что мы ссоримся."
10041010-28 = "О, а о чём тут спорить? Судя по всему, теперь Нагиса просто решает всё сама."
10041010-29 = "Сэя!!"
10041010-30 = "[ns1] «Что там происходит?»\n[ns2] Идти на голоса."
10041010-31 = ""
10041010-32 = ""
10041010-38 = "Хм?"
10041010-39 = "Сенсей...?"
10041010-40 = ""
10041010-43 = ""
10041010-44 = "А? Сенсей? Что вы здесь делаете...?"
10041010-45 = ""
10041010-47 = ""
10041010-48 = "Вы, эм... случайно всё это не слышали? Мы просто..."
10041010-49 = "М-мы не ссорились! Совсем! Мы просто..."
10041010-50 = ""
10041010-52 = ""
10041010-54 = ""
10041010-55 = "*вздыхает*"
10041010-56 = "Я позвала Сенсея. Подумала, что нам может понадобиться помощь."
10041010-57 = ""
10041010-60 = ""
10041010-61 = "Нагиса...?"
10041010-62 = "ТЫ позвала?"
10041010-64 = "Я надеялась, до этого не дойдёт, но раз уж дошло, нам явно нужен посредник. Кто подойдёт лучше Сенсея?"
10041010-65 = "Обычно мы бы решили всё сами, но..."
10041010-67 = "...А!"
10041010-68 = "«Когда тебе тревожно, не переживай в одиночку — попроси помощи у друга или взрослого.»"
10041010-69 = "Мы ведь сами установили такое правило, верно?"
10041010-70 = "...Хорошо, теперь мне всё совершенно ясно."
10041010-71 = "Ты позвала Сенсея, чтобы заручиться поддержкой и отодвинуть меня в сторону, так ведь, Нагиса?"
10041010-72 = "Ну вот, опять!"
10041010-74 = "Послушай меня. Я говорю совершенно серьёзно."
10041010-75 = "И именно потому говорю серьёзно, что волнуюсь за тебя, Сэя."
10041010-76 = "Если ничего другого, то хотя бы это, я искренне надеюсь, ты сможешь понять."
10041010-77 = "Вот именно, именно! Наги так давит только потому, что переживает за тебя, Сэя!"
10041010-78 = "Иногда она говорит непонятно и её неправильно понимают, но НЕ в этот раз!"
10041010-79 = "Кто бы говорил..."
10041010-80 = ""
10041010-82 = ""
10041010-84 = ""
10041010-85 = "[ns3] «Кто-нибудь объяснит мне, что происходит?»\n[ns4] «Уверен, у всех здесь есть свои причины. Давайте поговорим.»"
10041010-89 = "Что ж, пожалуй, пусть Сэя сама всё объяснит."
10041010-90 = "Сэя, если ты не против..."
10041010-91 = ""
10041010-94 = ""
10041010-95 = "...Хм. На тебя не похоже."
10041010-96 = "Я ожидала, что ты сразу начнёшь тараторить Сенсею и окрасишь весь разговор своими собственными мнениями."
10041010-98 = "Сэя, это уже слишком."
10041010-99 = "Повторяю, Наги делает это только потому, что волнуется за тебя!"
10041010-100 = ""
10041010-102 = ""
10041010-103 = "Наги..."
10041010-104 = ""
10041010-106 = ""
10041010-108 = ""
10041010-109 = "...Прости. Это И ПРАВДА было слишком."
10041010-110 = "Я вспылила. Я действительно не хотела этого говорить."
10041010-111 = "И я понимаю. Нагиса, ты хочешь удостовериться — нет, убедиться, — что тебе совсем не нужно за меня беспокоиться."
10041010-112 = "Я ни разу не сомневалась, что ты искренне переживаешь. Да и как могла?"
10041010-113 = "..."
10041010-114 = "Твоя искренность никогда не вызывала сомнений и не вызывает сейчас."
10041010-115 = "Сэя..."
10041010-116 = "Но даже так мне кажется, что ты переходишь границы. Особенно учитывая конкретный вопрос, о котором идёт речь."
10041010-117 = "[s5] «Перехожу границы?»\n[s6] «Какой вопрос?»"
10041010-120 = "Позвольте объяснить предмет спора. Проще говоря, мы решаем, кто из нас будет представлять Чаепитие на Выставке Миллениума."
10041010-123 = "Это грандиозная демонстрация технологий, которую проводит Миллениум, и мы договорились устроить обмен со студентами нашей школы."
10041010-124 = "Нагиса выдвинула себя, а я, в свою очередь, выдвинула себя."
10041010-125 = "Главное, что меня беспокоит, — её нагрузка и усталость."
10041010-128 = "А её беспокоит моё здоровье и безопасность. Вот и получается конфликт, который нужно разрешить."
10041010-129 = "Начнём с того, что я без проблем могу представлять Чаепитие. В прошлом я организовывала множество подобных дипломатических мероприятий."
10041010-130 = "Нагиса и без того перегружена внутренними делами Тринити. Если она уедет сейчас, ей придётся отложить слишком многое, а это будет... контрпродуктивно."
10041010-131 = "С другой стороны, как я уже сказала, Нагиса подняла вопрос моего здоровья и безопасности. Но..."
10041010-132 = "Её здоровье значительно улучшилось, но она лишь недавно перестала считаться «пациенткой»."
10041010-133 = "И это не моё личное мнение, а объективное заключение Рыцарей помощи."
10041010-134 = "Для всех нас в Чаепитии постоянная угроза нападения — часть повседневной жизни..."
10041010-135 = ""
10041010-137 = ""
10041010-138 = "Сэя больше не может заранее предсказывать их и готовиться, как раньше. Если честно, думаю, ей нужна защита."
10041010-139 = ""
10041010-142 = ""
10041010-143 = "Опять это..."
10041010-144 = "Нет смысла смягчать слова. Сейчас даже Мика способна защитить себя лучше тебя."
10041010-145 = "И что это вообще должно означать...?"
10041010-146 = "Я признаю, что Научная школа «Миллениум» безопаснее большинства мест и нападение там маловероятно."
10041010-147 = "Но при этом их технологии часто нестабильны, а значит, там случаются аварии. Игнорировать такой риск нельзя."
10041010-148 = "Если по какой-то нелепой случайности Сэя попадёт в такую аварию..."
10041010-149 = "А с чего ты решила, что тебе повезёт больше, чем мне?"
10041010-150 = "...Я говорю о тебе, Сэя. Ко мне это вообще не относится."
10041010-152 = "Тут что-то не сходится..."
10041010-153 = ""
10041010-155 = ""
10041010-156 = "Кстати, а почему меня вообще не рассматривают?"
10041010-157 = "Ну, Мика, сейчас ты находишься в несколько затруднительном положении, чтобы представлять Тринити..."
10041010-158 = ""
10041010-160 = ""
10041010-161 = "А... Точно. Эхе-хе, простите..."
10041010-162 = "Отправлять Мику — риск, на который ни одна из нас не готова пойти."
10041010-163 = "..."
10041010-164 = "[s7] «Значит, вы обе просто переживаете друг за друга.»\n[s8] «Похоже, вы и правда очень друг о друге заботитесь.»"
10041010-165 = ""
10041010-166 = ""
10041010-168 = ""
10041010-170 = "Это очень мило с вашей стороны, Сенсей, но сейчас не время для..."
10041010-171 = "...Что?"
10041010-172 = "Вы согласны с Сэей?"
10041010-173 = ""
10041010-176 = ""
10041010-178 = "...Правда с Сэей?"
10041010-180 = "Сенсей?"
10041010-181 = "Вы согласны со мной?"
10041010-182 = "[s9] «А что, если я поеду вместе с ней?»\n[s10] «Если что-нибудь случится, я сразу смогу вам сообщить.»"
10041010-183 = ""
10041010-184 = ""
10041010-186 = ""
10041010-187 = "Хм..."
10041010-188 = "Вот это неожиданно. Похоже, позвать Сенсея оказалось не совсем тем, на что ты рассчитывала, да, Наги?"
10041010-189 = "Хотя она ещё не согласилась..."
10041010-190 = ""
10041010-192 = ""
10041010-194 = "...Хм-м..."
10041010-195 = "Понятно. Значит, таково ваше предложение, Сенсей."
10041010-203 = ""
10041010-204 = ""
10041010-206 = ""
10041010-207 = ""
10041010-208 = "*вздыхает*"
10041010-209 = "Хорошо. Если вы говорите, что сможете её защитить, я вам доверюсь."
10041010-210 = ""
10041010-213 = ""
10041010-214 = "...Нагиса?"
10041010-215 = "Ты вдруг стала такой сговорчивой. Что случилось?"
10041010-216 = "Вот так мгновенно принять решение? Ты в порядке?"
10041010-217 = ""
10041010-220 = ""
10041010-221 = "И за кого вы меня вообще принимаете?"
10041010-222 = "Я уже сказала, что не хочу запрещать ей ехать. Я лишь хочу гарантировать её безопасность."
10041010-223 = "И если честно, даже рядом с Сенсеем её безопасность нельзя «гарантировать» полностью."
10041010-224 = "Конечно, многое здесь идёт от моей собственной тревоги. Я это понимаю. Но всё же..."
10041010-225 = "...Как бы там ни было, мы все знаем, что за плечами Сенсея длинная история успехов."
10041010-226 = "И моя вера в эти успехи перевешивает тревогу настолько, насколько вообще что-либо может."
10041010-227 = "...Да. Сенсей, я верю в вас."
10041010-228 = "[s11] «Спасибо, Нагиса.»\n[s12] «Не волнуйся. Я не позволю ничему пойти не так.»"
10041010-231 = "Я вверяю вам все свои надежды."
10041010-232 = ""
10041010-234 = ""
10041010-236 = ""
10041010-237 = "Нагиса, ты..."
10041010-239 = "...Ты доверяешь Сенсею... но не мне."
10041010-240 = ""
10041010-243 = "[log]Возвращение в настоящее[/log]"
10041010-247 = "Я знаю, что это моя внутренняя проблема. В каком-то смысле — недостаток самооценки."
10041010-248 = "«Какой толк от Сэи, если она больше ничего не может предсказывать? Теперь она бесполезна!»"
10041010-249 = "Не думаю, что Нагиса когда-нибудь действительно сказала бы такое или даже подумала. И про Мику я так не думаю."
10041010-250 = "Но даже понимая это головой... что ж, в некоторых вещах я всё ещё незрелая, особенно когда дело касается эмоций."
10041010-251 = "Полагаю, у всех нас есть свои пробелы и недостатки."
10041010-252 = "Именно поэтому я хотела получить эту работу на Выставке Миллениума — вести туда студентов."
10041010-253 = "Мне кажется, я должна чего-то добиться, чтобы самой признать собственную ценность."
10041010-254 = "Но всё это просто истерика, верно, Сенсей?"
10041010-255 = "[s13] «Совсем нет. Ты помогаешь себе восстановиться.»\n[s14] «Это часть процесса. В этом нет ничего плохого.»"
10041010-258 = "Как всегда, умеете поддержать."
10041010-259 = "Спасибо. Мне и правда стало немного легче."
10041010-260 = "В таком случае, Сенсей... если вы не против..."
10041010-261 = "...могу я попросить вас ещё об одной услуге?"
10041010-262 = "Возможно, с моей стороны это по-детски и уж точно упрямо, но если я хочу полностью принять и признать себя..."
10041010-263 = "...почувствовать собственную компетентность и уверенность..."
10041010-264 = "...пока я буду ходить по Выставке Миллениума, не могли бы вы..."
10041010-265 = "...не ходить за м—"
10041010-266 = ""
10041010-271 = ""
10041010-272 = "...Мы пришли."
10041010-273 = "Что ж, тогда приступим. Уверена, мы скоро снова поговорим."
