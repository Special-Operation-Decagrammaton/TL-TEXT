[translation]
10056060-1 = "Episode 6;The Stowaway"
10056060-2 = "Inside the cramped wheelhouse"
10056060-5 = "...A treasure map?"
10056060-9 = "Right. I got it from a client yesterday."
10056060-10 = "The spot is a blue hole, 12 nautical miles from D.U. There is an old sunken ship there, apparently."
10056060-11 = "They said they would buy the cargo if we salvage it, but..."
10056060-12 = "What do you all think...?"
10056060-13 = "...It feels like there is some kind of catch."
10056060-14 = "Still, I can understand why they are asking us.#nPulling things up from a sunken ship in a blue hole is difficult, after all."
10056060-15 = "Suspicious."
10056060-16 = "If they knew where the sunken ship was beforehand, they should have been able to move faster."
10056060-17 = "Why are they asking us now of all times?"
10056060-18 = "They said there is a character figure among the cargo they are targeting."
10056060-19 = "It wasn't popular before, but it started trending recently, so figures are going for naming-your-own-price."
10056060-20 = "The reward offered yesterday, even after deducting fees, is about this much..."
10056060-26 = "Whoa. That is enough to pay off all our debts and have change left over."
10056060-27 = "Waffle cone sardine ice cream... We could buy enough to last a lifetime."
10056060-28 = "They said they would buy whatever else we find, so they want us to bring back anything that looks valuable..."
10056060-29 = "Is it really that suspicious...?"
10056060-30 = "...The value of antiques goes up and down depending on the times."
10056060-31 = "So, if you consider that there is now a benefit to pulling it up despite the cost,#nrelying on the client's story makes sense."
10056060-32 = "If you tried to ask a large organization for something like this, they wouldn't be very flexible..."
10056060-33 = "Maybe we don't need to be overly suspicious."
10056060-34 = "Then we don't need to worry, right? Let's get ready right now!"
10056060-39 = "Wait. That aside.#nKoko knows very well that exploring the blue hole is more dangerous than other places, right?"
10056060-40 = "Ugh..."
10056060-41 = "Checking the depth and securing visibility are both difficult."
10056060-42 = "Maybe we will meet Ruska?"
10056060-43 = "That is a cryptid."
10056060-47 = "You are not acting like your usual self, Koko. Are you in a hurry?"
10056060-48 = "Could it be... did Island say something to you yesterday?"
10056060-52 = "Well..."
10056060-56 = "If we cannot pay this compensation, our club might get disbanded."
10056060-57 = "Disbanded... does that mean we can't dive anymore?"
10056060-58 = "Yeah. Probably focus on surface activities like other clubs."
10056060-59 = "I don't want that..."
10056060-60 = "...So that's how it is."
10056060-61 = "Yeah. Because I don't want to... come out of the water."
10056060-62 = "Even after the voyage ends, if we return without any results..."
10056060-63 = "--I won't be able to face anyone."
10056060-64 = "[s] \"Face who?\""
10056060-65 = "That is--"
10056060-66 = "Wha--?!"
10056060-67 = "Se-Se-Sensei?! Since when were you here?!"
10056060-68 = "[s] \"From the very beginning...\""
10056060-69 = "Why are you here?"
10056060-70 = "[s1] \"I was taking a nap here.\"\n[s2] \"By the time I woke up, the ship had already left...\""
10056060-73 = "Ah... I forgot to check the room downstairs..."
10056060-74 = "What should I do... Should we turn back now...?"
10056060-75 = "[s3] \"I heard the whole story.\"\n[s4] \"You're going on a treasure hunt, right?\""
10056060-78 = "But going out to sea is dangerous..."
10056060-79 = "And it would be wasting Sensei's time..."
10056060-80 = "[s] \"It's fine. I have no plans today.\""
10056060-84 = "[ns5] \"I want to see everyone diving for real, too.\"\n[ns6] \"Could you forgive me just this once...?\""
10056060-87 = "Augh... Understood..."
10056060-88 = "In exchange! Sensei, please stay inside the ship no matter what!"
10056060-90 = "We should be able to get back before the date changes, and..."
10056060-91 = "We might be able to slip through Trident's patrol area without being noticed..."
10056060-92 = "[s] \"Why do you need to sneak through?\""
10056060-96 = "That is... I don't think Island would approve of this plan."
10056060-97 = "We are already drowning in debt, and relying on a sketchy treasure map..."
10056060-98 = "They would definitely nag us about wasting fuel."
10056060-102 = "...Because I don't want to endure any more chilly glares."
10056060-103 = "[s] \"Have you ever asked Island for help?\""
10056060-104 = "No, not really..."
10056060-105 = "I don't want to expose my weaknesses and get treated like dead weight."
10056060-106 = "People already complain that we are wasting money on a non-productive hobby."
10056060-107 = "There is no need to go out of our way to ask for something we will just get turned down on."
10056060-108 = "[s7] \"It's true that opening up can be scary.\"\n[s8] \"I can understand wanting to hide your weakness.\""
10056060-114 = "[ns] \"But sometimes--\""
10056060-116 = "...Sensei? Are you okay?"
10056060-117 = "Your face has turned the color of grape ice cream."
10056060-118 = "[s9] \"Sorry... It's been a while since I've been on a small boat...\"\n[s10] \"It rocks more than I expected...\""
10056060-121 = "Eh? This is actually on the mild side for rocking."
10056060-122 = "Sensei, you get seasick easier than I thought."
10056060-123 = "[s] \"...Do you have any motion sickness medicine?\""
10056060-124 = "We don't have medicine, but..."
10056060-125 = "Chewing on this might take your mind off of it."
10056060-129 = "[ns] \"...This gum has an unusual flavor!?\""
10056060-130 = "It is not gum. Dried kelp."
10056060-131 = "It smells like the ocean breeze, so Sayuri likes it."
10056060-136 = "[ns] \"Ugh...\""
10056060-137 = "Whoa, bad, bad."
10056060-138 = "Sayuri, bring a bucket! Hurry!"
10056060-147 = "(After that, sea sickness continued unabated for a while as they headed toward the blue hole)"
10056060-153 = "Dragon King. I have returned."
10056060-154 = "Hm, good work."
10056060-155 = "I was too busy searching for my former retainers to pay much attention to you, but--"
10056060-156 = "That expression... It seems you bring joyful news."
10056060-157 = "Yes."
10056060-158 = "I have found talented women of the deep sea who can serve as bearers of treasure worthy of the Dragon Palace."
10056060-159 = "Oh?#n...A new face? I look forward to it."
10056060-163 = "Descendants of whales who can freely traverse the deep sea, you say?"
10056060-164 = "It seems they are in dire straits.#nIf the Dragon King shows them mercy, they will surely pledge allegiance."
10056060-165 = "Splendid. New retainers are always welcome."
10056060-166 = "Then we must prepare to welcome our guests."
10056060-170 = "Come forth. New retainers."
10056060-172 = "To my Dragon Palace!"
