[translation]
10056060-1 = "Episode 6; Stowaway"
10056060-2 = "Cramped Wheelhouse Interior"
10056060-5 = "...A treasure map?"
10056060-9 = "Yeah. The client from yesterday gave it to me."
10056060-10 = "It points to a blue hole twelve nautical miles out from the D.U. Supposedly, there's an old shipwreck there."
10056060-11 = "They said they would buy any of the cargo we salvage out from it, but..."
10056060-12 = "I need your opinions on this."
10056060-13 = "...They probably have an ulterior motive."
10056060-14 = "But still, I can understand why they're asking us for help. #nHauling cargo up and out of a blue hole is no easy feat."
10056060-15 = "Suspicious."
10056060-16 = "If they already knew the location of the shipwreck, then they likely would've made a move earlier."
10056060-17 = "If so, then why are they asking for our help now?"
10056060-18 = "They said that there's figurines of a character in the cargo they're looking for."
10056060-19 = "The character wasn't popular before, but now that they're gaining traction, people#nare looking to buy those figures for any asking price."
10056060-20 = "The renumeration they presented yesterday, even after deducting commissioning fees, was about this much..."
10056060-26 = "Whoa. This is enough to cover the debt and then some."
10056060-27 = "Waffle cone sardine ice cream... Sayuri could buy enough to last a lifetime."
10056060-28 = "They also said that they'd buy whatever else we brought up, so they want us to#nbring back anything that looks expensive..."
10056060-29 = "This does sound suspicious, doesn't it?"
10056060-30 = "...The value of antiques fluctuates with time."
10056060-31 = "If you believe that the rewards outweight the cost, then the client's position#nbegins to make more sense."
10056060-32 = "If you tried to rely on a larger organization to handle something like this, they#nprobably wouldn't be able to operate too freely."
10056060-33 = "Perhaps there's no need for us to be so skeptical."
10056060-34 = "So there's no need to worry, right? Then let's get ready to go!"
10056060-39 = "Hold on. That's only one part of it. #nKokoro, I believe you know just how dangerous it is to explore a blue hole#ncompared to any other place."
10056060-40 = "Urk..."
10056060-41 = "Not only is it difficult to verify your depth, but it's also hard to maintain a clear#nfield of view."
10056060-42 = "Maybe you'll meet the Lusca."
10056060-43 = "That's just a [ruby=UMA]cryptid[/ruby], isn't it?"
10056060-47 = "This isn't like you, Kokoro. What's got you so frightened?"
10056060-48 = "Don't tell me Island said something to you yesterday...?"
10056060-52 = "That's—"
10056060-56 = "If we don't manage to pay off the damages, then our club may have to be#ndisbanded."
10056060-57 = "Disband... So we won't be able to dive anymore?"
10056060-58 = "Yeah. Like the other clubs, we'll have to focus on activities out of the water."
10056060-59 = "Sayuri doesn't want that..."
10056060-60 = "...So that's how it is."
10056060-61 = "Yeah. I... don't want to leave the water."
10056060-62 = "If the voyages ends and I still have nothing to show for it..."
10056060-63 = "Then how would I ever face..."
10056060-64 = "[s] \"Face who?\""
10056060-65 = "That's—"
10056060-66 = "Uwah!?"
10056060-67 = "S-Se-Sensei!? How long have you been here!?"
10056060-68 = "[s] \"I've been here this whole time...\""
10056060-69 = "Why are you here?"
10056060-70 = "[s1] \"I was taking a nap here.\"\n[s2] \"By the time I woke up, the ship had already set sail...\""
10056060-73 = "Oops... I forgot to check the room downstairs..."
10056060-74 = "What should we do? Do we turn back?"
10056060-75 = "[s3] \"I heard everything.\"\n[s4] \"You're going to search for treasure?\""
10056060-78 = "But, heading out to the open seas is dangerous..."
10056060-79 = "And plus, I don't want to waste your time..."
10056060-80 = "[s] \"It's fine. I don't have anything lined up today.\""
10056060-84 = "[ns5] \"I want to see you all dive for real.\"\n[ns6] \"Just this once, could you let me watch?\""
10056060-87 = "Auugh... I understand..."
10056060-88 = "But! In exchange, you MUST stay inside the ship!"
10056060-90 = "It looks like we should be able to make it back by midnight..."
10056060-91 = "We'll probably also be able to slip through Trident's patrol without being#ndetected..."
10056060-92 = "[s] \"Why do we have to secretly pass through?\""
10056060-96 = "Because, well... I highly doubt Island would ever approve of this plan."
10056060-97 = "We're already drowning in debt as it is, and now that we're relying on a treasure#nmap with little to no chance of paying off..."
10056060-98 = "They'll never let me hear the end of it about wasting fuel."
10056060-102 = "...I don't want to be looked at coldly anymore."
10056060-103 = "[s] \"Have you tried asking Island for help?\""
10056060-104 = "No, not really..."
10056060-105 = "I don't want to show weakness, nor do I want them to treat me like I'm useless."
10056060-106 = "As it is, we're already receiving flak about wasting money on an unproductive#nhobby."
10056060-107 = "What's the point of asking if you know you'll probably be rejected?"
10056060-108 = "[s7] \"Sure, it's scary to expose yourself to others.\"\n[s8] \"I also understand why you would hide your weakness.\""
10056060-114 = "[ns] \"However, someti—\""
10056060-116 = "...Sensei? You okay?"
10056060-117 = "Your face is turning grape ice cream colored."
10056060-118 = "[s9] \"Sorry... It's been a while since I've been on a small boat...\"\n[s10] \"I wasn't expecting it to rock this much...\""
10056060-121 = "Huh? This barely counts as rocking, though."
10056060-122 = "You're even weaker on a boat than I thought."
10056060-123 = "[s] \"...Do you have any motion sickness medicine?\""
10056060-124 = "We don't have medicine, but..."
10056060-125 = "Maybe you can distract yourself from it by chewing on this."
10056060-129 = "[ns] \"This gum has a weird flavor!\""
10056060-130 = "Not gum. It's dried kelp."
10056060-131 = "Smells like the sea. Sayuri likes it."
10056060-136 = "[ns] \"Urp...\""
10056060-137 = "Oh no no no."
10056060-138 = "Sayuri, grab a bucket! Quick!"
10056060-147 = "(After that, while the seasickness continued to persist for a little longer, we headed towards the blue hole.)"
10056060-153 = "Dragon Queen, I have returned."
10056060-154 = "Umu. Good work."
10056060-155 = "As my hands have been full searching for my former retainers, I have not been#nable to give you my attention."
10056060-156 = "However... That look on your face tells me that you bring amusing news."
10056060-157 = "Yes."
10056060-158 = "I have found talents of the deep seas, capable of bearing treasures befitting of the Dragon Palace."
10056060-159 = "Oh? #n...Newcomers. How exciting."
10056060-163 = "Descendants of the Whales— ones capable of freely traversing the deep seas,#nat that?"
10056060-164 = "They appear to have fallen into a predicament. #nIf the Dragon Queen were to show them mercy, they are sure to vow their fealty."
10056060-165 = "Excellent. New retainers will always be welcome."
10056060-166 = "Prepare to receive our guests."
10056060-170 = "Come hither, my new retainers."
10056060-172 = "My palace awaits you!"