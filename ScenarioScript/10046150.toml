[translation]
10046150-2 = ""
10046150-3 = "Приветик! ★"
10046150-4 = "Мика?!"
10046150-5 = "Хаха, Ичика! Я слышала, из-за промаха Наги ты работаешь до изнеможения!"
10046150-6 = "Так что я пришла помочь!"
10046150-7 = ""
10046150-9 = ""
10046150-10 = "...О. Я думала, ты обрадуешься."
10046150-11 = "Я сказала что-то не то?"
10046150-12 = "Н-Нет! Нет, Мика, вовсе нет!"
10046150-13 = "Я просто... удивилась. И очень благодарна."
10046150-14 = "О, правда? Я рада."
10046150-15 = "Но всё же, может, тебе вернуться на главную часть пляжа? Там толпы, музыка..."
10046150-16 = "А? Почему?"
10046150-17 = "Потому что я обычно патрулирую более пустые и опасные места."
10046150-18 = "А, ты обо мне беспокоишься?"
10046150-19 = "Да... охрана Чаепития входит в обязанности Оперативной группы Правосудия. Волноваться — моя работа."
10046150-20 = "О, тогда не надо!"
10046150-21 = "Вообще-то я очень сильная!"
10046150-22 = "Хахаха... Ну, надеюсь, до этого не дойдёт."
10046150-23 = "Это потому, что я из Чаепития, да?"
10046150-24 = ""
10046150-26 = ""
10046150-27 = "Тогда что, если я сделаю вот так?"
10046150-28 = "Что, если забудем про мой титул, и я просто помогу тебе как обычная, самая простая Мисоно Мика? Как подруга?"
10046150-29 = "...Ты всё равно член Чаепития."
10046150-30 = "Хаха. Наверное."
10046150-31 = "Хаха. И всё же..."
10046150-32 = "...если ты будешь настаивать..."
10046150-33 = "А? То есть мне можно—?"
10046150-34 = "Да, я с радостью приму твою помощь, Мика."
10046150-35 = "Ура! Никаких передумать! Отлично! Прикрой мне спину!"
