[translation]
102090-1 = "Эпизод 9; Второе святилище — Район руин Миллениум"
102090-2 = "Начинаем захват второго святилища. Оборонительный отряд готов?"
102090-3 = "Готов."
102090-4 = "Сомневаюсь, что я ей понадоблюсь, но прикрою Цуруги. Мы готовы."
102090-5 = ""
102090-7 = ""
102090-8 = "Хорошо... А десантная группа? Проникновение завершено?"
102090-9 = ""
102090-10 = "Да. Мы только что вошли в вентиляцию."
102090-11 = "Продвигаемся к центральной части завода боеприпасов."
102090-12 = "Ха-ха-ха! Давно мы не прыгали с парашютами! Было весело, правда?"
102090-14 = "Не время тянуть. Поехали!"
102090-15 = "Хорошо. Десантная группа атакует центр завода боеприпасов, а оборонительная — сдержит продвижение войск."
102090-16 = "Когда оборона противника будет дезорганизована, оборонительная группа войдёт в здание."
102090-17 = "Начинаем операцию! Встретимся снова перед Chesed."
