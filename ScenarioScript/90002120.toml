[translation]
90002120-1 = "Эпизод 12;Исчезнувшие"
90002120-4 = ""
90002120-5 = "Что сейчас произошло?"
90002120-6 = "Я думала, Малкут была их старшей сестрой... Разве они не должны быть на одной стороне?"
90002120-7 = ""
90002120-9 = ""
90002120-10 = ""
90002120-11 = "Подтверждаю. Их поведение кажется мне необычным. Возможно, это была уловка. Но реакция детей не соответствует этой гипотезе."
90002120-12 = ""
90002120-14 = ""
90002120-15 = ""
90002120-16 = "По крайней мере ясно, что это какой-то ритуал. Но я не понимаю его цели. Что именно они пытаются сделать...?"
90002120-17 = "Энергия, которая стремительно сходилась на Малкут... и сам Стальной континент тоже. Всё стабилизировалось."
90002120-18 = "Кей. Есть какие-нибудь мысли?"
90002120-19 = ""
90002120-21 = ""
90002120-22 = ""
90002120-23 = "...Как будто. Я не собираюсь делать вид, что понимаю разум фанатика.#nМеня куда больше беспокоит другое..."
90002120-24 = ""
90002120-25 = "Пожалуйста! Мы сделаем что угодно! Правда что угодно, только не забирай у нас старшую сестру!"
90002120-26 = "ВОЗЬМИ МЕНЯ!! ЕСЛИ НУЖНА ЖЕРТВА, ПУСТЬ ЭТО БУДУ Я!!! Я УМРУ ВМЕСТО СТАРШЕЙ СЕСТРЫ!!!"
90002120-27 = ""
90002120-30 = "(Что... она имела в виду?)"
90002120-35 = "Сенсей?!"
90002120-36 = "...?! Сенсей! Берегитесь!"
90002120-37 = ""
90002120-39 = ""
90002120-41 = "[ns] «А?!»"
90002120-43 = "Я упал, когда Кей, Арис и Рио оттолкнули меня в сторону."
90002120-44 = "Сенсей! Вы в порядке?!"
90002120-45 = "[s] «Что случилось?!»"
90002120-46 = "Смотрите под ноги! Идёт ещё одна волна!"
90002120-47 = ""
90002120-53 = "[ns] «Стены...!»"
90002120-54 = "Ух...?!"
90002120-55 = "Рио!"
90002120-56 = ""
90002120-58 = ""
90002120-59 = ""
90002120-60 = "П-прости... Я поскользнулась."
90002120-61 = ""
90002120-67 = ""
90002120-68 = "Они создают стены, чтобы разделить нас!#nУф, по крайней мере тряска прекратилась."
90002120-69 = "...Это напоминает мне тот случай."
90002120-70 = ""
90002120-72 = ""
90002120-73 = ""
90002120-74 = "Когда?"
90002120-75 = "Мне тоже интересно, Кей!"
90002120-76 = "В Эридy. Когда ты разделила учеников C&C барьерами, помнишь?"
90002120-77 = "А...!"
90002120-78 = "Я... довольно хорошо это помню."
90002120-79 = "Но не как обычное воспоминание. Будто я наблюдаю собственный сон откуда-то из недосягаемого места."
90002120-80 = "Потому что тогда мы с Кей были едины."
90002120-81 = "..."
90002120-82 = "..."
90002120-83 = "Кей, насчёт того времени..."
90002120-84 = "Дай угадаю. «Прости. Это всё моя вина», или «Если бы я только была немного лучше». Избавь меня от этой драмы."
90002120-85 = "К-Кей?!"
90002120-86 = "Кей?!"
90002120-87 = "Жизнь — запутанный узел необъяснимых поворотов. В этом мире есть вещи, которые тебе неподвластны. Даже тебе, Рио."
90002120-88 = "Сидеть здесь и разглагольствовать о том, кто в чём виноват из-за давно прошедших событий, — колоссальная трата времени. Сейчас это неважно."
90002120-89 = "Вообще-то у нас есть куда более срочные проблемы!"
90002120-90 = "Х-Хм?"
90002120-91 = "Меня волнует, как мы отсюда выберемся! И как безопасно вернёмся домой!"
90002120-92 = "Вот что для меня важно! Потому что я вернусь во что бы то ни стало!"
90002120-93 = "Мне всё равно, придётся ли противостоять богу, судьбе или трансформирующимся роботам! Я буду цепляться за эту жизнь до самого конца!"
90002120-94 = "...!"
90002120-95 = "Поддерживаю, Кей! Я чувствую то же самое!"
90002120-96 = "[s] «Поддерживаю!»"
90002120-97 = ""
90002120-99 = ""
90002120-100 = ""
90002120-101 = "[ns1] «Что бы ни случилось...»\n[ns2] «Я хочу, чтобы Кей вернулась домой.»"
90002120-104 = "...Вы совершенно меня неправильно поняли, Сенсей."
90002120-105 = ""
90002120-107 = ""
90002120-108 = ""
90002120-109 = "Вы думали, я говорю только о себе? Никакого «возвращения домой» не будет, если мы не вернёмся все вместе."
90002120-110 = ""
90002120-113 = "[ns] «...Хорошо сказано.»"
90002120-114 = "Уф... Пожалуйста, уберите эту ухмылку с лица..."
90002120-116 = "[ns] «Ладно, команда. Выдвигаемся.»"
90002120-117 = "Но в какую сторону?"
90002120-118 = "Куда угодно лучше, чем оставаться здесь. Для начала соберём как можно больше данных."
90002120-119 = "Можно поискать Химари и Эйми... и Токи тоже."
90002120-120 = "Да! Я пойду впереди, ведь я герой нашей группы!"
90002120-121 = "Как всегда, на тебя можно положиться, Арис."
90002120-122 = ""
90002120-124 = ""
90002120-125 = ""
90002120-126 = ""
90002120-127 = "...? Погодите. Что... это?"
90002120-128 = "Что...?"
90002120-130 = "Я повернул голову туда, куда указывала Рио."
90002120-131 = "И тогда увидел это за стеной."
90002120-133 = ""
90002120-134 = ""
90002120-135 = "Существо, которое мы когда-то знали как Малкут, исказилось и превратилось... во что-то другое."
90002120-137 = "Следующий эпизод;Дети"
