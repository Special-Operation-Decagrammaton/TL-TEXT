[translation]
52120-1 = "Эпизод 12;Мико рода Кадэнокодзи"
52120-5 = "Мы полдня шли по заснеженному полю, прежде чем добрались до особняка."
52120-6 = ""
52120-11 = "Должно быть, это и есть Потусторонний особняк..."
52120-12 = "Я-Я здесь никогда не была."
52120-13 = "...Странно. Этот особняк действительно заброшен уже несколько десятилетий?"
52120-14 = ""
52120-16 = ""
52120-17 = ""
52120-18 = "Сад чистый. Трава не заросла, будто за ним ухаживали всего несколько дней назад."
52120-19 = "Разве это не ещё один довод в пользу того, что здесь база «Красоты природы»?"
52120-20 = "Кто-то ухаживает за особняком, который считался заброшенным, и живёт в нём. Само по себе подозрительно, правда?"
52120-22 = "Я согласна с Аямэ. Всё указывает на более масштабный и зловещий замысел."
52120-23 = "И если это действительно база «Красоты природы», тогда Сюро должна..."
52120-24 = ""
52120-26 = ""
52120-27 = ""
52120-29 = ""
52120-30 = "..."
52120-31 = "Ябуки Сюро?.."
52120-32 = "[s] «С тобой всё хорошо?»"
52120-33 = ""
52120-35 = ""
52120-36 = "Я не могу..."
52120-37 = "Как я посмотрю в глаза госпоже Кокурико?.."
52120-38 = "Она дала мне два шанса, а я оба упустила! Она меня возненавидит!"
52120-39 = "Бросит меня... Выкинет, как ненужный мусор..."
52120-40 = "Ого... Кокурико правда настолько жестока?"
52120-41 = ""
52120-43 = ""
52120-44 = "Не смей так говорить о госпоже Кокурико! Госпожа Кокурико..."
52120-45 = "Уа-а..."
52120-46 = "[s] «Бедняжка...»"
52120-48 = "[ns] «Может, вы пойдёте вперёд? Я присмотрю за Сюро.»"
52120-49 = ""
52120-51 = ""
52120-53 = "Мы всё равно собирались разделиться и разведать особняк..."
52120-54 = "Но мы же не можем оставить Сенсея одного и без защиты! А если появится дух предмета?"
52120-55 = "Полагаю, я могу остаться с ними двумя."
52120-56 = ""
52120-58 = ""
52120-59 = "Я ведь не воин. Вряд ли от меня будет много пользы в поисках..."
52120-60 = "Но я быстрая. Если что-то случится, схвачу Сенсея и убегу к вам!"
52120-62 = "Нет, думаю, этого недостаточно."
52120-63 = "Я останусь и присмотрю за Сюро—"
52120-64 = "[s1] «Не переживай, Кикё.»\n[s2] «Мы будем совсем рядом.»"
52120-67 = "Но..."
52120-68 = "[s] «Как сказала Азами, если что-то случится — мы убежим.»"
52120-69 = ""
52120-71 = ""
52120-72 = ""
52120-73 = "Хорошо. Только не перенапрягайся."
52120-74 = "...У тебя дурная привычка пытаться изображать героя."
52120-75 = "[s] «Спасибо за заботу.»"
52120-76 = "Тогда разделимся и начнём поиски?"
52120-77 = "Мы с Нагусой проверим главное здание и внутренний двор, Кикё и Рэнгэ — сарай и пристройки, а Юкари осмотрит библиотеку."
52120-78 = "Если увидите что-нибудь странное — не трогайте. И если ХОТЬ ЧТО-ТО покажется подозрительным, сразу зовите остальных. Разберёмся вместе."
52120-80 = "Хорошо, Аямэ."
52120-81 = "Оставь мне!"
52120-82 = ""
52120-85 = ""
52120-86 = "Тогда приступим."
52120-87 = ""
52120-89 = ""
52120-92 = ""
52120-93 = "Здесь так чисто."
52120-94 = "К тому же кухня укомплектована столовыми приборами и чайными сервизами. Кто-то явно был здесь совсем недавно."
52120-95 = "От всего этого не по себе."
52120-96 = "Они могут быть совсем рядом и ждать момента для засады."
52120-97 = "Вполне возможно."
52120-98 = ""
52120-100 = ""
52120-101 = "Это здание кажется мне странно знакомым..."
52120-106 = "«Красота природы»! Покажитесь, трусы!"
52120-107 = ""
52120-109 = ""
52120-110 = ""
52120-112 = ""
52120-113 = "Ты серьёзно думаешь, что это сработает?"
52120-114 = "Ты скорее выдаёшь нашу позицию. Пока мы говорим, они уже могут убегать."
52120-115 = "Хмф, пусть попробуют! Сенсей и Азами охраняют вход."
52120-116 = "Но всё-таки... этот особняк не кажется тебе знакомым? Будто я уже здесь бывала..."
52120-117 = "Будь разумнее. Ты никак не могла бывать в заброшенном особняке в такой глуши—"
52120-118 = ""
52120-120 = ""
52120-121 = "...Постой. Эта конструкция..."
52120-122 = ""
52120-124 = ""
52120-125 = ""
52120-126 = ""
52120-127 = ""
52120-129 = ""
52120-130 = "...Неужели?"
52120-131 = ""
52120-133 = ""
52120-134 = ""
52120-136 = "Узор на этом пресс-папье..."
52120-137 = ""
52120-140 = "...это герб семьи Кадэнокодзи."
52120-141 = "Почему печать Кадэнокодзи находится в заброшенном особняке...?"
52120-142 = ""
52120-144 = ""
52120-147 = "...Точно. Особняк Кадэнокодзи в Центральном Хяккияко изначально был лишь расширением."
52120-148 = "Главная ветвь Кадэнокодзи когда-то жила далеко на севере."
52120-149 = "Белый снег и замёрзший пруд в заднем саду зимой были прекрасны."
52120-150 = "Но из-за трагедии, произошедшей ещё до твоего рождения, мы решили переехать."
52120-151 = ""
52120-153 = ""
52120-154 = "...Это был позор, запятнавший имя семьи."
52120-155 = "Видишь ли, мико Кадэнокодзи повела себя совершенно неподобающим образом..."
52120-156 = ""
52120-158 = "Только не говорите..."
52120-159 = "Н-Не может быть. Это было больше двадцати лет назад..."
52120-160 = ""
52120-162 = ""
52120-163 = ""
52120-168 = ""
52120-169 = "Все книги покрыты пылью, кроме этой."
52120-170 = "На том не похоже. Выглядит как обычный дневник..."
52120-171 = ""
52120-173 = ""
52120-180 = "Двадцать лет назад мико Кадэнокодзи обладала праведным и благородным сердцем."
52120-181 = ""
52120-186 = "[log]Храни честь имени Кадэнокодзи.[/log]"
52120-190 = "Девушка, верившая в справедливость и рыцарство, вступила в Хяккарёран. Вскоре её талант признали, и она стала президентом."
52120-191 = ""
52120-195 = "[log]Хранить честь имени Кадэнокодзи[/log]"
52120-197 = "[log]значит распространять престиж семьи.[/log]"
52120-201 = "Но самоотверженность девушки вступала в конфликт с учениями её семьи."
52120-204 = "Девушка должна была исполнить танец мико на Фестивале фонарей."
52120-205 = "Однако прямо перед выходом на сцену вдали начал распространяться небольшой пожар."
52120-206 = "Самоотверженная девушка решила прежде всего тушить огонь, полагая, что без её вмешательства он распространится."
52120-207 = "Она остановила пожар, но пропустила своё выступление. Фестиваль закончился ничем... а семья Кадэнокодзи оказалась жестоко опозорена."
52120-208 = ""
52120-212 = "[log]Какой бы ни была причина,[/log]"
52120-214 = "[log]пренебречь своим долгом — значит опозорить семью.[/log]"
52120-218 = "Полностью опозоренную девушку изгнали из дома. Она посвятила себя президентству в Хяккарёран — единственному оставшемуся смыслу жизни."
52120-219 = "Но, возможно, эта одержимость затуманила её рассудок."
52120-220 = "Почувствовав её слабость, участницы Хяккарёран провели поединок за наследование. Они отняли у неё и должность, и Сотню Лотосов."
52120-221 = ""
52120-225 = "[log]Полномочие Президента[/log]"
52120-227 = "[log]доказывается поединком за наследование.[/log]"
52120-230 = "В итоге у девушки не осталось ничего, даже собственного имени."
52120-231 = "Она потеряла уважение товарищей и людей."
52120-232 = "Тогда девушка отправилась искать Кузуноху, надеясь получить божественное наставление."
52120-233 = ""
52120-237 = "[log]Храни честь имени Кадэнокодзи.[/log]"
52120-241 = "Но сколько бы она ни бродила по Великому снежному полю и ни искала Кузуноху, девушка оставалась одна."
52120-242 = "Потому что Кузуноха была не более чем слухом."
52120-243 = ""
52120-247 = "Всё оказалось ложью."
52120-248 = "Последняя надежда, державшая её благородное сердце, оборвалась, и девушку поглотили предательство, отчаяние и ненависть."
52120-249 = "Если пророчица Хяккарёран и безусловная любовь семьи были лишь ложью..."
52120-250 = "Если всё, чем она восхищалась, было всего лишь слухом, который кто-то выдумал..."
52120-251 = ""
52120-254 = ""
52120-256 = "[log][ff4444]...Тогда она поклялась сама стать слухом.[-][/log]"
52120-260 = ""
52120-261 = "Я та, кто оживляет все слухи и истории о призраках. Именно я воплощаю их в реальность."
52120-263 = ""
52120-264 = "...Н-Невозможно!"
52120-265 = "Мико Кадэнокодзи, исчезнувшая двадцать лет назад, — президент «Красоты природы»?!"
52120-266 = ""
52120-270 = "В истине есть своя изысканность, дорогая."
52120-271 = ""
52120-273 = ""
52120-274 = ""
52120-275 = ""
52120-276 = "Твоя семья и любимый Совет построены на уродливом прошлом."
52120-277 = "Это твой дневник? Твоя история?"
52120-278 = "Да. И, похоже, она очень напоминает твою."
52120-279 = ""
52120-281 = ""
52120-282 = "Фу-фу... Интересно, у меня тогда тоже было такое преданное выражение лица. Даже... немного ностальгично."
52120-283 = "(«Нужно предупредить остальных!»)"
52120-284 = "Друзья тебя не спасут, маленькая Кадэнокодзи."
52120-285 = ""
52120-287 = ""
52120-288 = "К-Как ты прочитала мои мысли?"
52120-289 = "Милая, ты не настолько сложная. Твои мысли, эмоции и боль... я прекрасно их понимаю."
52120-290 = "Я была мико Кадэнокодзи. Я была участницей Хяккарёран."
52120-291 = ""
52120-293 = ""
52120-294 = "Я была тобой. И твоё будущее ничем не будет отличаться от моего."
52120-295 = ""
52120-297 = ""
52120-299 = ""
52120-300 = ""
52120-301 = "Это ложь!"
52120-302 = "Пусть я, Юкари, и не самая сильная..."
52120-303 = "И идеалы, к которым я стремлюсь, могут быть иллюзиями, украшенными ложью...!"
52120-304 = "...Но я никогда не стану такой, как ты! Обещаю!"
52120-305 = ""
52120-308 = ""
52120-309 = "Мне тебя жаль, драгоценный хрупкий цветочек."
52120-310 = "Ты до невозможности очаровательна. Если честно, я даже думала тебя отпустить... но мне всё-таки нужно поддерживать репутацию."
52120-311 = ""
52120-313 = ""
52120-314 = ""
52120-315 = ""
52120-316 = ""
52120-317 = "...Особенно после того, как ты натоптала грязными ботинками по всему моему изысканному дому."
52120-319 = "...Ух."
52120-320 = "Пытайся сколько хочешь! Я никогда не дрогну!"
