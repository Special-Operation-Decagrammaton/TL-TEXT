[translation]
52120-1 = "Episódio 12;A Sacerdotisa da Família Kadenokouji"
52120-5 = "(Depois disso, avançamos pela planície nevada por cerca de meio dia e chegamos a uma residência)"
52120-11 = "Então esta é a famosa \"Mansão Higan\"..."
52120-12 = "E-Eu também nunca tinha vindo aqui antes."
52120-13 = "...Que estranho."
52120-18 = "Não tem nem uma erva daninha no jardim.#nParece que alguém morava aqui até bem pouco tempo atrás."
52120-19 = "...Isso só aumenta a chance de ser a base do Clube Beleza da Natureza."
52120-20 = "Ninguém moraria num lugar desses se não tivesse algo a esconder."
52120-22 = "Verdade.#nSe fossem delinquentes como a Trupe Chimi,#nnão se dariam a tanto trabalho assim."
52120-23 = "Se este for mesmo o quartel-general deles, então a Shuro—"
52120-30 = "..."
52120-31 = "Shuro...?"
52120-32 = "[s] \"Você não está se sentindo bem?\""
52120-36 = "Eu acabei voltando para cá..."
52120-37 = "Não tenho coragem de encarar a Kokuriko-sama..."
52120-38 = "Eu falhei duas vezes... Com certeza ela está decepcionada comigo..."
52120-39 = "Não... eu não quero... Não quero ser jogada fora como lixo..."
52120-40 = "Ei, ei... Essa tal de Kokuriko é tão assustadora assim?"
52120-44 = "Alguém como você não tem o direito de pronunciar esse nome!#nA Kokuriko-sama..."
52120-45 = "Ugh...!"
52120-46 = "[s] \"Você está bem...?\""
52120-48 = "[ns] \"Desculpa, tudo bem se eu ficar aqui com a Shuro?\""
52120-53 = "A gente consegue investigar sozinhas, mas..."
52120-54 = "Se este for mesmo o quartel-general do Clube Beleza da Natureza, deixar o Sensei aqui..."
52120-55 = "Se for o caso, eu fico junto também."
52120-59 = "Combate não é a minha especialidade, mas..."
52120-60 = "Se acontecer alguma coisa, eu levo o Sensei e vou me reunir com vocês na hora!"
52120-62 = "Não, só isso não me deixa tranquila."
52120-63 = "Eu fico de olho nessa garota."
52120-64 = "[s1] \"Não precisa se preocupar, vai ficar tudo bem.\"\n[s2] \"Afinal, estamos todos no mesmo terreno.\""
52120-67 = "Mas..."
52120-68 = "[s] \"Como a Azami disse, se acontecer qualquer coisa, a gente se reúne logo com vocês.\""
52120-73 = "Pelas alunas, não liga nem para si mesmo—"
52120-74 = "Essa é uma mania ruim sua. ...Não se force demais, tá?"
52120-75 = "[s] \"Obrigado por se preocupar.\""
52120-76 = "Bom, vamos nos dividir para investigar?"
52120-77 = "Eu e a Nagusa ficamos com a casa principal e o pátio. Kikyou e Renge, o anexo.#nYukari, pode cuidar do escritório?"
52120-78 = "Evitem tocar em qualquer coisa suspeita.#nSe algo acontecer, chamem alguém imediatamente."
52120-80 = "Sim, vou tomar cuidado."
52120-81 = "Podem deixar aos meus cuidados!"
52120-86 = "Então, pessoal, vamos lá."
52120-93 = "É uma casa bonita, né?"
52120-94 = "Sim. Não tem nem um grão de poeira nos utensílios de chá nem na louça... Parece que havia alguém aqui."
52120-95 = "Mas agora... está sinistramente silencioso."
52120-96 = "Pode ser que estejam preparando uma emboscada. Não baixe a guarda."
52120-97 = "É verdade."
52120-101 = "Mas essa construção... o que será? Tenho a impressão de que já vi este lugar..."
52120-106 = "Clube Beleza da Naturezaaa! Apareçaaam!"
52120-113 = "Eles não vão sair de boa vontade só porque você chamou..."
52120-114 = "E se eles fugirem por causa da sua gritaria?"
52120-115 = "Hmph, quero ver tentarem fugir!#nO Mestre e a Azami-san estão lá na entrada."
52120-116 = "Mas fala aí... Você não conhece essa casa de algum lugar?#nParece que eu já vim aqui antes..."
52120-117 = "Num fim de mundo desses? Não pode ser—"
52120-121 = "Não... eu também tenho a sensação de já ter visto este lugar."
52120-130 = "Não é engano meu..."
52120-136 = "O que está gravado aqui é..."
52120-140 = "O brasão da família Kadenokouji—"
52120-141 = "Por que estaria em uma ruína como esta...?"
52120-147 = "...Sim.#nA Mansão Kadenokouji no centro de Hyakkiyako#né, originalmente, uma residência secundária construída para apoiar os membros da família dedicados aos estudos."
52120-148 = "Antigamente, a mansão principal ficava nas terras distantes do norte."
52120-149 = "Em dias de neve, a beleza daquele jardim tingido de branco puro era indescritível..."
52120-150 = "Contudo... devido a um certo incidente, fomos obrigados a abandonar aquelas terras."
52120-154 = "Uma vergonha absoluta que manchou a história da nossa família..."
52120-155 = "A sacerdotisa da época cometeu atos escandalosos que desonraram o nome Kadenokouji—"
52120-158 = "Não pode ser..."
52120-159 = "M-Mas isso foi há 20 anos...!"
52120-169 = "Apenas este livro não está coberto de poeira..."
52120-170 = "Parece ser o diário de alguém..."
52120-180 = "Há vinte anos, a garota que herdou o nome Kadenokouji transbordava senso de justiça."
52120-186 = "[log]\"Mantenha-se íntegra como membro da família Kadenokouji.\"[/log]"
52120-190 = "Para conquistar uma força de corpo e mente digna do nome de sua família, a garota ingressou no Comitê de Mediação de Conflitos Hyakkaryouran—#ne, num piscar de olhos, ascendeu ao posto de Presidente."
52120-195 = "[log]\"A conduta de um membro da família Kadenokouji\"[/log]"
52120-197 = "[log]\"é um meio para espalhar nosso prestígio.\"[/log]"
52120-201 = "Contudo, a paixão da garota por ajudar os outros entrava em conflito com os ensinamentos da família."
52120-204 = "No dia de um certo festival, a garota deveria apresentar a dança da sacerdotisa durante o ritual."
52120-205 = "\"Um festival que deveria terminar sem contratempos. Porém, fascinadas pela expectativa de um ritual grandioso, as pessoas deixaram passar uma pequena faísca.\""
52120-206 = "A garota percebeu a faísca e priorizou apagar o fogo em vez de continuar o ritual..."
52120-207 = "Não chegou a se tornar uma tragédia, mas o festival terminou em decepção...#ne a honra da família Kadenokouji, responsável pelo ritual, foi completamente arruinada."
52120-212 = "[log]\"Seja qual for o motivo,\"[/log]"
52120-214 = "[log]\"quem abandona seu dever é uma vergonha para a família.\"[/log]"
52120-218 = "Incapaz de suportar as acusações de sua casa, a garota deixou a família Kadenokouji.#nE passou a se agarrar ao único lugar que lhe restava — o título de \"Presidente do Hyakkaryouran\"."
52120-219 = "\"Teria sido essa obsessão o que embotou suas habilidades?\""
52120-220 = "A garota já não tinha o vigor nem a força de antes... Percebendo isso, alguém a desafiou para um Torneio de Sucessão#ne usurpou o posto de Presidente e a Hyakuren."
52120-225 = "[log]\"A qualificação\"[/log]"
52120-227 = "[log]\"é algo que se prova no Torneio de Sucessão.\"[/log]"
52120-230 = "Tudo escapou por entre os dedos da garota."
52120-231 = "Por mais que tentasse permanecer \"íntegra\", algo ou alguém sempre ficava no caminho."
52120-232 = "Mas a lendária grande profetisa — Kuzunoha, a fundadora do Hyakkaryouran —#ncom certeza a compreenderia."
52120-237 = "[log]\"Mantenha-se íntegra como membro da família Kadenokouji.\"[/log]"
52120-241 = "Por mais que percorresse a grande planície nevada e reunisse informações,#nnão encontrou nenhum vestígio de Kuzunoha."
52120-242 = "\"Kuzunoha-sama é apenas uma lenda.\""
52120-247 = "Era tudo mentira."
52120-248 = "Tendo perdido a esperança, a garota acabou se envolvendo em desespero e ódio."
52120-249 = "As origens do Hyakkaryouran... os ensinamentos da família Kadenokouji... Se tudo era falso..."
52120-250 = "Se tudo o que ela admirou e em que acreditou... não passava da história de outra pessoa..."
52120-256 = "[log][ff4444]Desta vez, serei eu quem vai criar a \"história\".[-][/log]"
52120-261 = "Usando os rumores e contos de terror que rastejam por este mundo como sementes, farei florescer uma flor negra...#ne me tornarei a \"Líder dos Espíritos Malignos\"."
52120-264 = "...N-Não consigo acreditar..."
52120-265 = "A sacerdotisa dos Kadenokouji que desapareceu há 20 anos é...#na presidente do Clube Beleza da Natureza...?"
52120-270 = "Só foi perceber agora? Que garota mais lenta..."
52120-276 = "Tanto a família quanto a organização que você ama tanto... repousam sobre os sedimentos imundos afundados no passado."
52120-277 = "Você é a autora deste diário...?"
52120-278 = "É a primeira vez que nos encontramos assim, não é?"
52120-282 = "Fufu... Será que eu também fazia essa expressão antigamente?"
52120-283 = "(Preciso avisar as senpais depressa...!)"
52120-284 = "Ora, vai chamar as suas senpais?"
52120-288 = "C-Como você sabe o que estou pensando...?"
52120-289 = "Seus sentimentos, sua dor, sua tristeza, sua hesitação... Consigo enxergar cada um deles na palma da mão."
52120-290 = "Afinal, eu também já fui uma filha dos Kadenokouji e um membro do Comitê de Mediação de Conflitos Hyakkaryouran."
52120-294 = "Um dia, você também vai se tornar como eu..."
52120-301 = "...Isso nunca vai acontecer!"
52120-302 = "É verdade que eu ainda sou imatura, lenta e fraca! Mas...!"
52120-303 = "Mesmo que tudo aquilo que eu admiro e almejo alcançar um dia... seja apenas uma ilusão...!"
52120-304 = "Ainda assim, eu...!#nPrometi às minhas senpais que jamais desistiria!"
52120-309 = "...Que admirável."
52120-310 = "Bem que eu gostaria de deixar passar por você ser tão adorável, mas não vai dar."
52120-317 = "...Crianças que invadem a casa dos outros sem tirar os sapatos merecem um castigo."
52120-319 = "Ngh...!"
52120-320 = "Venha o que vier... eu não vou perder!"
