[translation]
1009015-1 = "Первый и последний"
1009015-2 = "Мне так жаль, Сенсей!"
1009015-3 = "[s1] «Всё нормально. Я ждал всего пять минут.»\n[s2] «Но ты редко опаздываешь, Умика.»"
1009015-6 = "Н-Ну..."
1009015-7 = "Я проходила мимо подготовки к какому-то фестивалю за углом... и засмотрелась..."
1009015-8 = "[s] «Подготовка к фестивалю?»"
1009015-9 = "Да. Похоже, в торговом квартале устраивают небольшое празднование."
1009015-10 = "Наверное, это скорее базар или ярмарка ремёсел, чем фестиваль?"
1009015-11 = "Угх... Пусть фестиваль и скромный, совсем на меня не похоже, что он застал меня врасплох. Я ведь читаю все фестивальные бюллетени."
1009015-12 = "[s] «Похоже, его было легко пропустить. И всё-таки ты его нашла!»"
1009015-13 = "Наверное. Хи-хи-хи."
1009015-14 = "Но всё равно, когда я вижу, как люди вкладываются в праздник, собирают событие по кусочкам..."
1009015-15 = "...меня это вдохновляет сильнее всего."
1009015-16 = "[ns] «(Почему от её слов мне становится так виновато?)»"
1009015-17 = "Мне кажется, место вроде фестиваля, куда все могут прийти отдохнуть и отпраздновать, делает повседневную жизнь намного лучше."
1009015-18 = "А? Что я имею в виду? Ну... В общем..."
1009015-19 = "Мне кажется, фестиваль — это... приглашение сбежать. Он ограничен во времени, мимолётен и открывает новый мир в месте, которое обычно кажется совершенно обыденным."
1009015-20 = "Конечно, это ощущение бывает не только на фестивалях. Парк аттракционов, отпуск и даже игры, фильмы и книги тоже позволяют так сбежать от реальности."
1009015-21 = "Главное... что люди могут ненадолго оставить повседневность и перенестись в новый мир!"
1009015-22 = "Да. В новый мир, Сенсей! Я серьёзно!"
1009015-23 = "Мир, где каждый может сбросить груз с плеч... Можно сказать, место, где можно дать волю своей внутренней причудливости и... даже глупости!"
1009015-24 = "Живой фестиваль начинается ранним утром и заканчивается ночным фейерверком... Это само по себе похоже на открытие и закрытие особого мира."
1009015-25 = "А потом люди возвращаются к обычной жизни, только отдохнувшие и полные новой энергии."
1009015-26 = "Теперь, когда я это сказала, звучит почти как портал в другое измерение... немного как исэкай, если вы знаете, о чём я."
1009015-27 = "Конечно, даже у хорошего фестиваля есть недостатки..."
1009015-28 = "Например, можно так увлечься, что в итоге накупишь слишком много сувениров!"
1009015-29 = "[s] «Да... Мне знакомо это чувство.»"
1009015-30 = "Н-Но, конечно, есть вещи, о покупке которых я не жалею."
1009015-31 = "Например, вот эта. Посмотрите, Сенсей."
1009015-32 = ""
1009015-34 = ""
1009015-35 = ""
1009015-37 = "[ns] «Что это? Кукла?»"
1009015-38 = "Да. Хи-хи-хи... Я купила эту куклу на своём самом первом фестивале."
1009015-39 = "...Тогда я была вдвое ниже."
1009015-40 = "Сейчас даже не понимаю, зачем я её тогда купила..."
1009015-41 = "Но что-то в ней сразу привлекло мой взгляд. Я просто обязана была её получить."
1009015-42 = "[ns] «Она и правда особенная...»"
1009015-44 = "[ns] «Но я даже не могу понять, мальчик это или девочка.»"
1009015-45 = "Вот именно! Я тоже не знаю!"
1009015-46 = "Торговец тогда предложил мне угадать, а правильный ответ так и не сказал!"
1009015-47 = "Я думала об этом весь день. Всё собиралась вернуться и потребовать ответ."
1009015-48 = "Хи-хи-хи. Ну... вот так я и стала такой, какая есть."
1009015-49 = "[s] «Это память о твоём самом первом фестивале...»"
1009015-50 = "Да! Можно и так сказать!"
1009015-51 = "Но... мне есть ещё что добавить."
1009015-52 = "[s] «Да?»"
1009015-53 = "Э-Это не что-то невероятное... Не хочу заранее слишком вас воодушевлять."
1009015-54 = "На самом деле есть ещё одна такая кукла."
1009015-55 = ""
1009015-57 = ""
1009015-58 = ""
1009015-60 = "[ns] «А, значит, они идут парой.»"
1009015-61 = "Да. Именно."
1009015-62 = "Тот торговец тогда продавал их обеих, а потом..."
1009015-63 = ""
1009015-65 = ""
1009015-66 = "...а потом..."
1009015-67 = "[s] «А потом?»"
1009015-68 = ""
1009015-70 = ""
1009015-71 = "О-О, ничего!"
1009015-72 = "Простите, Сенсей! Сегодня я представитель студентов! Мне нужно быть собраннее."
1009015-73 = "Точно! Работа! Я ведь должна помогать вам с работой, да?!"
1009015-74 = "[s] «Умика?»"
1009015-75 = "Ну же, Сенсей! Давайте скорее закончим работу!"
1009015-76 = "Знаете, завтра открывается ещё один фестиваль."
1009015-77 = "Если вы не против, может, мы..."
1009015-78 = "[s] «Да. Давай.»"
1009015-79 = "...!"
1009015-80 = "Спасибо!"
1009015-82 = "Мы с Умикой закончили все дела на сегодня."
1009015-83 = "Узнав, что она благополучно вернулась в школу..."
1009015-86 = "[ns] «Хм!»"
1009015-89 = "[ns] «Это...?»"
1009015-90 = "Я уже собирался сказать Умике, что она забыла свою куклу..."
1009015-91 = ""
1009015-92 = ""
1009015-94 = "...но потом решил вместо этого написать ей в MomoTalk."
