[translation]
1601202-1 = "Новый год, новая одежда! Новая я?"
1601202-3 = "Пекарня L'Oiseau Bleu"
1601202-4 = "Получив звонок от Джунко, я отправился в L'Oiseau Bleu."
1601202-5 = "Добро пожаловать в L'Oiseau Bleu!"
1601202-6 = "О, привет, Сенсей. Ну как?"
1601202-7 = "[s] «Так вот что ты хотела мне показать...»"
1601202-8 = "Это кимоно! Ага."
1601202-9 = "В L'Oiseau Bleu нам выдали их для работы на Новый год."
1601202-10 = "Но это по желанию, никого не заставляют его надевать."
1601202-11 = "[s] «Говоришь, по желанию, но весь магазин забит кимоно...»"
1601202-12 = ""
1601202-14 = ""
1601202-15 = "Да! Большинству идея очень понравилась."
1601202-16 = "...Почему вы всё время оглядываетесь?"
1601202-17 = "На меня! Смотрите на меня, Сенсей! Вы ведь ради меня сюда пришли!"
1601202-18 = "Ладно, только не пяльтесь слишком долго! Серьёзно... найдите золотую середину."
1601202-19 = "Н-Ну и как вам?"
1601202-20 = "Что? Нет, я про наряд! Спрашиваю, как я в нём выгляжу!"
1601202-21 = "[s] «Тебе идёт, Джунко.»"
1601202-22 = "О. Вот как."
1601202-23 = "Это все данные, которые удалось получить."
1601202-24 = "Нет, всё нормально. Я не злюсь. Правда. *вздох* Просто..."
1601202-25 = "[s] «Ты супер-мега милая, Джунко! Самая лучшая! Самая красивая! Хочу забрать тебя домой!»"
1601202-26 = "Ч-Что с вами вообще не так?! И что вы там собираетесь со мной делать?!"
1601202-27 = "Серьёзно, просто найдите идеальный баланс, который совпадёт с тем, чего я хочу!"
1601202-28 = "В общем, главное — мне очень нравится это кимоно."
1601202-29 = "Настолько, что я хочу арендовать его и носить ещё и вне работы."
1601202-30 = "Но для этого придётся платить за аренду и химчистку..."
1601202-31 = "А значит, мне нужно больше денег и, следовательно, больше работы... *вздох*"
1601202-32 = "[s1] «Реальность требует жертв...»\n[s2] «Желания порождают жертвы...»"
1601202-35 = "Точно, жертвы — именно об этом я и думала."
1601202-36 = "Значит, мы уже согласны, что вы должны пожертвовать собой и заказать самые дорогие позиции в меню!"
1601202-37 = "[s3] «Меня обманули! Провели! Но выбора нет!»\n[s4] «Зачем ограничиваться дорогим? Закажу вообще всё!»"
1601202-40 = "Я-Я же пошутила! Вы тоже шутите, правда? Правда?!"
1601202-41 = "[s] «Официантка такая красивая, что я просто обязан разориться!»"
1601202-42 = "Н-Нет! Я имею в виду... Я просто...!"
1601202-43 = "[s] «Но вообще я правда хочу попробовать новогоднее меню L'Oiseau Bleu!»"
1601202-44 = "Я-Я понимаю..."
1601202-45 = "Но вы правда хотите столько всего?"
1601202-46 = "Вы серьёзно это заказали? Л-Ладно..."
1601202-47 = "Я приняла ваш заказ..."
1601202-48 = ""
1601202-56 = ""
1601202-57 = "..."
1601202-58 = "*вздох* Что я вам говорила..."
1601202-59 = "[s] «...Что я заказал слишком много?»"
1601202-60 = "Уф, вы меня вообще никогда не слушаете."
1601202-61 = "И что вы теперь будете делать со всем этим? Вы даже половину не тронули."
1601202-62 = "У вас есть хорошая идея? Почему-то мне кажется, сейчас всё пойдёт каким-то странным путём..."
1601202-63 = "Хм? Вам нужен кто-то, чтобы доесть вместе?"
1601202-64 = "[s5] «Давай закончим это вместе, Джунко.»\n[s6] «Я хочу поесть с тобой.»"
1601202-67 = "Что вы такое говорите?! Я сейчас вообще-то работаю..."
1601202-68 = "Н-Но, если вы настаиваете..."
1601202-69 = ""
1601202-71 = ""
1601202-72 = "Думаю, управляющий не будет против..."
1601202-73 = "Ничего не поделаешь! Поем с вами!"
1601202-76 = "Джунко села рядом, и мы медленно принялись доедать все пирожные."
1601202-77 = ""
1601202-81 = "Я сказал, что мне понравилось наше свидание. Она меня ударила."
