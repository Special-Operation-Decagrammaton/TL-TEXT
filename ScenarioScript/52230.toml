[translation]
52230-1 = "Эпизод 23;Праздничные песни для всех"
52230-2 = "Что? Ты хочешь провести Фестиваль Вараку? Сейчас?!"
52230-3 = "Да. Всё необходимое оборудование уже готово, верно?"
52230-4 = "Ну да, но всё равно..."
52230-5 = "Как мы вообще проведём фестиваль посреди всего этого?"
52230-6 = "Повсюду монстры, люди в ужасе. Даже если делать вид, что всё замечательно..."
52230-7 = "Всем вам, кто гордится своими фестивалями и вложил столько сил в этот день, мне больно это говорить..."
52230-8 = "...но сейчас важнее, чтобы люди знали: фестиваль состоится, чем чтобы он действительно прошёл успешно."
52230-9 = "Фестиваль должен воплощать радость и праздник, а наш может быть отмечен чистым ужасом. На первый взгляд это полная противоположность равновесию."
52230-10 = "Но..."
52230-11 = "Я знаю. Проводить фестиваль в таких обстоятельствах опасно для всех."
52230-12 = "Даже сейчас всё внутри меня протестует против идеи отправить Чисэ на сцену прямо посреди этой опасности."
52230-13 = "Но это всё, что осталось в наших силах."
52230-14 = ""
52230-16 = ""
52230-17 = "Фестивальному отделу необязательно оставаться до конца. Укройтесь, где сможете."
52230-18 = "Просто научите нас пользоваться оборудованием, а остальное клуб Инь-Ян сделает сам."
52230-19 = ""
52230-21 = ""
52230-22 = "Я-я хочу помочь! До самого конца!"
52230-23 = "...Умика?"
52230-24 = "В прошлый раз, на Фестивале фонарей, я потеряла сознание и была совершенно бесполезна... А теперь вы хотите, чтобы я просто сидела и позволила истории повториться?"
52230-25 = ""
52230-27 = ""
52230-28 = "Я гордая участница Фестивального отдела и не позволю этому случиться!"
52230-29 = ""
52230-31 = ""
52230-33 = "Я тоже, президент!"
52230-34 = "Мы устраиваем фестивали не потому, что они весёлые — мы устраиваем их, чтобы веселиться!"
52230-35 = "Если какие-то посторонние заставят нас отступить от идеалов, это будет означать конец фестивалей навсегда!"
52230-36 = "В прошлый раз я не смогла подняться на высоту момента..."
52230-37 = "...но сегодня смогу! Сегодня я сделаю всё, чтобы прогнать этих негодяев! Я жизнью защищу фестиваль!"
52230-38 = "...Если честно..."
52230-39 = "Я тоже киплю от злости."
52230-40 = "Студенты Хяккияко так долго ждали этот фестиваль."
52230-41 = "И дело не только в нашем отделе. Студенты, жители, торговцы... Они вложили кровь, пот и слёзы, чтобы он состоялся."
52230-42 = "К чёрту их изысканность! К чёрту их истории о призраках! Один раз сорвать любимый фестиваль — уже непростительно, а они делают это ВТОРОЙ раз этой чушью!"
52230-43 = "Да-да!"
52230-44 = "Кахо, если мы проведём Фестиваль Вараку, это остановит «Красоту природы» или как их там?"
52230-45 = "Не могу обещать. Но точно знаю: это последнее, чего они хотят."
52230-46 = "Тогда покажем им, что такое настоящий Хяккияко!"
52230-47 = "М-Мы тоже хотим помочь!"
52230-48 = "Да! Изуна, Цукуё и президент! Мы втроём встанем рядом с вами и вложим всю душу в эту миссию! Нин-нин!"
52230-49 = "О... Не знаю насчёт этого..."
52230-50 = ""
52230-52 = ""
52230-53 = "Но Сенсей дал нам эту миссию. А как ниндзя я обязана довести её до конца."
52230-54 = "Насладимся Фестивалем Вараку на полную!"
52230-55 = "О-о-о... Я прямо загорелась!"
52230-56 = ""
52230-58 = ""
52230-59 = ""
52230-60 = "Тогда тебе скоро выходить на сцену, Чисэ. Песню подготовила?"
52230-61 = "Да. Всё подготовлено и готово."
52230-62 = "Мы вас прикроем, а вы просто сосредоточьтесь на выступлении, хорошо?"
52230-65 = ""
52230-67 = "*вдох*"
52230-68 = "Хорошо! Всем привет!"
52230-69 = "Пожалуйста... послушайте мою песню!"
