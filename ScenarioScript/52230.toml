[translation]
52230-1 = "Episódio 23;Canção de Harmonia nos Quatro Cantos"
52230-2 = "Vamos realizar o Festival Waraku nessa situação?!"
52230-3 = "Sim. Os equipamentos necessários para o festival já estão prontos, não estão?"
52230-4 = "Bem, sim, mas..."
52230-5 = "Será mesmo possível conduzir o festival em segurança no meio dessa confusão?"
52230-6 = "Monstros estão aparecendo por toda parte, e os cidadãos estão apavorados. Mesmo que a gente realize o festival..."
52230-7 = "Dói-me dizer isso a vocês do Comitê de Organização de Festivais, que se esforçaram tanto até hoje, mas..."
52230-8 = "No momento, mais importante do que o sucesso do festival é fazer todos saberem que o festival está acontecendo."
52230-9 = "Se o local que deveria estar transbordando de sorrisos e alegria ficar tomado pelo medo e por gritos, não poderemos dizer que tudo segue \"como sempre\"."
52230-10 = "Mas..."
52230-11 = "Estou ciente do perigo."
52230-12 = "Eu também não quero colocar a Chise-chan em um palco perigoso..."
52230-13 = "Mas... no momento, isso é tudo o que está ao nosso alcance."
52230-17 = "Vocês não precisam ficar no local até o final."
52230-18 = "Se puderem apenas nos ensinar a operar os equipamentos, nós do Clube Yin-Yang cuidaremos do resto—"
52230-22 = "E-Eu...! Eu quero ajudar até o fim!"
52230-23 = "...Umika?"
52230-24 = "No último Festival das Lanternas, eu desmaiei e não consegui fazer nada... Ficar só assistindo desta vez também, eu..."
52230-28 = "Como membro do Comitê de Organização de Festivais, eu não posso aceitar isso!"
52230-33 = "Eu também, Presidente!"
52230-34 = "Um festival existe para todo mundo se divertir junto!"
52230-35 = "Se cedermos à interferência de fora, nunca mais vamos conseguir realizar festival nenhum!"
52230-36 = "Da última vez, não fomos páreo para eles, mas..."
52230-37 = "Eu, a humilde Pina, estou pronta para enxotar esses arruaceiros com força total desta vez!"
52230-38 = "...Para ser sincera..."
52230-39 = "Eu também estou furiosa."
52230-40 = "Quantas alunas estavam esperando ansiosamente por este festival..."
52230-41 = "Não foi só o nosso Comitê — tanta gente de Hyakkiyako suou a camisa por este festival."
52230-42 = "Não sei se é refinamento artístico ou história de terror, mas tentar atrapalhar de novo com essas baboseiras é imperdoável!"
52230-43 = "Uau~"
52230-44 = "Kaho-san, se realizarmos o Festival Waraku... vamos conseguir deter aquele tal Clube Beleza da Natureza, certo?"
52230-45 = "Não sei os detalhes, mas é certo que elas não querem que o festival aconteça."
52230-46 = "Então, vamos jogar o nosso \"festival\" — bem na cara delas!"
52230-47 = "N-Nós também vamos ajudar!"
52230-48 = "Sim! Tanto a Izuna, quanto a Tsukuyo-dono e a Presidente!#nEstamos prontas para dar o nosso máximo ao lado de vocês! Nin-nin!"
52230-49 = "Ah, não, e-eu não estou pronta para tanto assim..."
52230-53 = "Mas... foi um pedido do Sensei, então vou cumprir meu dever como ninja!"
52230-54 = "Vamos curtir o Festival Waraku com tudo!"
52230-55 = "Era de se esperar...! Vamos lá!"
52230-60 = "Chise-chan, sinto muito por colocá-la em um palco perigoso... Você se lembra da música?"
52230-61 = "Sim, está tudo bem."
52230-62 = "Não deixaremos nem um único Tsukumogami chegar perto do palco... então, conto com você."
52230-67 = "Ufa..."
52230-68 = "Então, pessoal~"
52230-69 = "Ouçam... a minha canção~!"
