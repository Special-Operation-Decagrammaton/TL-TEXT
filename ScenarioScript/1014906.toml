[translation]
1014906-1 = "Divers and Decompression Sickness"
1014906-2 = "(The next day... We headed out to the nearby sea on a borrowed boat for the Diving Club's observation tour.)"
1014906-3 = "(Just before Kokoro finished her preparations and entered the water...)"
1014906-6 = "By the way, Sensei, have you heard that rumor?"
1014906-7 = "Lately, there have been some delinquent students around attacking small boats..."
1014906-8 = "What should I do if you get attacked while I am underwater...?"
1014906-9 = "Since Sensei has no way to defend yourself, you would surely just let them do as they please..."
1014906-10 = "[s1] \"It is fine. I am used to dealing with students.\"\n[s2] \"I will try to talk my way out of it if that happens.\""
1014906-13 = "No, that is not okay!"
1014906-14 = "Sensei, you do not know how terrifying the students of the sea can be...!"
1014906-15 = "They are rough and merciless, completely different from land delinquents!"
1014906-16 = "On the unlucky day you happen to get tangled up with those temper-tantrum-throwing kids..."
1014906-17 = "Ugh, I do not even want to think about it."
1014906-18 = "My diving preparations are perfect, but...#nWhen it comes to Sensei, I always mess things up..."
1014906-19 = "[s3] \"I do not think you need to worry that much...\"\n[s4] \"If something happens, do you have a way to contact me?\""
1014906-22 = "No... signals do not reach underwater, so I cannot use my phone either..."
1014906-26 = "Ah...!"
1014906-27 = "Sensei, please take this."
1014906-28 = "[s] \"What is this...?\""
1014906-29 = "It is a signal buoy for divers."
1014906-30 = "If you throw it into the water, it opens and makes a sound, so you can tell even from underwater."
1014906-31 = "If something happens, please throw this."
1014906-32 = "I check the surface from time to time, and if the buoy is open, I will come right back up...!"
1014906-33 = "[s5] \"Got it, thank you.\"\n[s6] \"You be careful too, Kokoro.\""
1014906-36 = "Yes...!"
1014906-38 = "(About 30 minutes after Kokoro dived...)"
1014906-41 = "[ns] \"W-Whoa!?\""
1014906-45 = "(Startled by a seabird that suddenly flew by, I dropped the signal buoy I was holding.)"
1014906-46 = "(The buoy that fell into the sea opened immediately and began to emit a shrill sound.)"
1014906-50 = "[ns7] (What should I do...?)\n[ns8] (Kokoro might misunderstand...)"
1014906-57 = "S-Sensei...!"
1014906-58 = "Are you okay!? I saw the buoy open...!"
1014906-59 = "[s9] \"Sorry, I accidentally dropped the buoy!\"\n[s10] \"Nothing happened, I am really sorry...!\""
1014906-62 = "Is that so... nothing happened..."
1014906-63 = "I am glad... I thought something had happened to Sensei..."
1014906-64 = "[s11] \"Are you okay, Kokoro?\"\n[s12] \"If you surface too suddenly, will you get decompression sickness...?\""
1014906-67 = "...Me?"
1014906-68 = "I am... completely... fine."
1014906-69 = "...Hiccup."
1014906-70 = "[s] \"That does not look like you are fine at all!?\""
1014906-71 = "I feel a little dizzy, buuut... I am totally, totally fine...!"
1014906-72 = "My vision is blurry, and my body feels all itchy... buuut, hiccup, I am alwite!"
1014906-73 = "[s] \"Let us head to the decompression chamber right now.\""
1014906-74 = "Nooo... you do not need... to worry about me!"
1014906-75 = "What I should be worried about is... Sensei, you...!"
1014906-76 = "[s] \"Me?\""
1014906-77 = "Yeees."
1014906-78 = "Sensei cannot even stop bullets...#nAnd you cannot survive the water pressure at 100 meters deep bare-handed either..."
1014906-79 = "You rush right over the moment a student is in danger... and you always say you will take responsibility..."
1014906-80 = "You are even nice to vicious delinquent students, sooo..."
1014906-81 = "If you do not pay proper attention... someday, absolutely..."
1014906-82 = "You are going to get into terrible trouble...!"
1014906-83 = "[s13] \"Alright, alright. Rely on me for now.\"\n[s14] \"Come on, hold onto my shoulder.\""
1014906-86 = "Rely on Sensei...?"
1014906-87 = "And hold your shoulder... is that really okay...?"
1014906-88 = "Fufu... Fufufu..."
1014906-89 = "...Once in a while, this might not be so bad."
1014906-90 = "[s] \"Did you just say something wild?\""
1014906-91 = "I did nooot!?"
1014906-93 = "(After that, I took a completely sloshed Kokoro to the Odyssey infirmary.)"
1014906-94 = "(Kokoro fully recovered in the decompression chamber, but...#nFor a while after that, she avoided me...)"
