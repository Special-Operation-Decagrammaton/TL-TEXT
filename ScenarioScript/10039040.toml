[translation]
10039040-1 = "Эпизод 4;Путь к славе поп-идола: песня"
10039040-2 = "Хм... Посмотрим... Хм..."
10039040-3 = "Костюмы — есть. Танцевальная подготовка — есть."
10039040-4 = "Пока всё идёт хорошо. Благодаря вам, Сенсей."
10039040-5 = "Теперь осталось только выбрать песню, и всё будет готово."
10039040-6 = "Всё будет... готово."
10039040-7 = ""
10039040-9 = ""
10039040-10 = "[ns1] «....Мари?»\n[ns2] «Тебя что-то тревожит?»"
10039040-13 = "...?! А-А?! Нет, ничего."
10039040-14 = "Я просто... задумалась. Наверное, устала. Хи-хи."
10039040-15 = "Ну, сейчас не время. Нужно найти песню."
10039040-16 = "Сенсей, как раз вовремя."
10039040-17 = "А...?"
10039040-18 = "Кто здесь?"
10039040-19 = "[ns3] «...? Утаха?»\n[ns4] «Похоже на...»"
10039040-23 = ""
10039040-24 = "...Хи-хи. Я случайно услышала ваш разговор."
10039040-25 = "Мне даже немного обидно, Сенсей. Поп-идолы — это же так весело, а я просто..."
10039040-26 = ""
10039040-28 = ""
10039040-29 = "Не могу поверить, что вы ничего мне не рассказали."
10039040-30 = "[s5] «Что это была за пауза?»\n[s6] «Что ты там сказала про веселье?»"
10039040-33 = "О, не обращайте внимания на детали. В общем, похоже, вам нужна помощь."
10039040-34 = "Что нужно? Костюмы? Хореография...?"
10039040-35 = "...Песня?"
10039040-36 = "А, песня! Отлично. У меня полно готовых."
10039040-37 = "...А? Хотите знать, почему у меня уже есть песни?"
10039040-38 = "Ну, потому что..."
10039040-39 = "...я тоже собираюсь участвовать."
10039040-40 = "[s7] «Ты?»\n[s8] «Инженер-идол?»"
10039040-43 = "Хи-хи. Я ждала такой реакции."
10039040-44 = "Я надеялась вовлечь весь отдел, но нет, буду только я."
10039040-45 = "Мы с Хибики и Котори не смогли договориться о направлении музыки."
10039040-46 = "Наверное, мои вкусы для них слишком прогрессивные."
10039040-47 = "Но делиться с другими тем, что любишь, — тоже часть роли поп-идола."
10039040-48 = "Может, они передумают, когда увидят меня на сцене."
10039040-49 = "Роль... поп-идола...?"
10039040-50 = "Ну конечно. У каждого идола есть причина, что-то, что заставляет его выступать."
10039040-51 = "Желание донести послание, слова, которые хочется сказать, имя, которое хочется выкрикнуть..."
10039040-52 = "Или... пламенное желание показать всем истинную сущность шедевра «Mirrorball Thundergun.» Что бы ни было их самым искренним и глубоким чувством."
10039040-53 = "И если кто-то способен заставить публику почувствовать ту же страсть, он по праву может называться мастером."
10039040-54 = "Кстати, мы ещё не знакомы. Ты..."
10039040-55 = "...из Сестринства? А, понятно."
10039040-56 = "...А?"
10039040-57 = "Понятно. Значит, будущий идол — она, а не вы."
10039040-58 = "[s9] «О чём ты вообще думала...?»\n[s10] «Это студенческое мероприятие, студенческое!»"
10039040-61 = "Да я шучу."
10039040-62 = "В любом случае, здорово. Более того, мне теперь ещё сильнее хочется помочь."
10039040-63 = "Из вас получится замечательный идол, сестра. У меня глаз мастера на потенциал необработанных драгоценных камней."
10039040-64 = "О, правда?! Спасибо!"
10039040-65 = ""
10039040-67 = ""
10039040-68 = ""
10039040-69 = "...П-Подождите, что?"
10039040-70 = "...Я? Вы думаете... я?"
10039040-71 = "Но погодите..."
10039040-72 = "О, так это НЕ ты здесь хочешь стать идолом?"
10039040-73 = "Значит, всё-таки Сенсей...?"
10039040-74 = "[s11] «Нет, конечно нет.»\n[s12] «Я же сказал — нет.»"
10039040-77 = "Хаха... Спасибо за добрые слова, но я лишь помогаю."
10039040-78 = "Я знакома с парой будущих идолов и стараюсь убедиться, что у них есть всё необходимое."
10039040-79 = "Эм..."
10039040-80 = ""
10039040-82 = ""
10039040-83 = "...Хм."
10039040-84 = "Ну ладно. Понимаю."
10039040-85 = "Жаль только. Ты действительно прекрасный драгоценный камень."
10039040-86 = "Н-Нет, я...! Послушайте, мне очень приятно это слышать, но я совсем не такой человек."
10039040-87 = "...О, вы сказали, у вас, возможно, есть песня для нас. Есть?"
10039040-88 = "Конечно. Именно поэтому я сюда и подошла."
10039040-89 = "Вы ведь не против, если я помогу, Сенсей?"
10039040-90 = ""
10039040-92 = ""
10039040-93 = "[ns13] «Конечно, помогай.»\n[ns14] «Я тебе доверяю.»"
10039040-96 = "Хи-хи. Рада, что вы мне доверяете."
10039040-97 = "Сестра, я дам вам направление... Хорошо, просто идите туда и подождите нас. Мне нужно кое о чём поговорить с Сенсеем."
10039040-98 = "Направление к... чему?"
10039040-99 = "В караоке неподалёку. Чтобы выбрать песню, нужно петь и слушать."
10039040-100 = "Иди подожди нас там, мы скоро подойдём. Ты ведь сможешь добраться одна?"
10039040-101 = "Да, конечно!"
10039040-102 = "Спасибо, Утаха! Я... Я буду ждать вас там!"
10039040-103 = ""
10039040-105 = ""
10039040-106 = ""
10039040-107 = ""
10039040-108 = "...Хм."
10039040-109 = "Хммм..."
10039040-110 = ""
10039040-113 = "[ns15] «...Утаха?»\n[ns16] «Ты хочешь сказать... что-то о Мари?»"
10039040-116 = "Есть всего одна мелочь, которую я хотела уточнить."
10039040-117 = "Эта девочка..."
10039040-118 = "Вы ТОЧНО уверены, что она сама не хочет стать поп-идолом?"
10039040-119 = "Почему я снова об этом спрашиваю? Ну..."
10039040-120 = "Мне кажется, она очень даже ХОЧЕТ сама это попробовать."
10039040-121 = "Просто она, похоже, пока до конца этого не осознаёт. Я удивлена, что вы уже не предложили ей."
10039040-122 = "В общем, это всё, о чём я хотела поговорить. Решила, что иначе сегодня не усну."
10039040-123 = "Хм?"
10039040-124 = "У вас что-то на уме? Пока решили занять позицию «поживём — увидим»?"
10039040-125 = "Хи-хи, я так и знала, что дело примерно в этом... Ну, вы учитель, так что, думаю, сами знаете, как лучше поступить."
10039040-126 = "Надеюсь, мы все увидим её на сцене."
10039040-127 = ""
10039040-129 = ""
10039040-130 = "Кстати, Сенсей. Думаю, вам понравится моя песня. Вот, послушайте..."
10039040-131 = "[s] «О, это ТОТ САМЫЙ жанр!»"
10039040-133 = "После этого мы с Утахой отправились в караоке и помогли Мари выбрать песню."
10039040-135 = ""
10039040-136 = ""
10039040-137 = ""
10039040-140 = "— Песня пройдена —"
10039040-142 = ""
10039040-145 = "На следующий день..."
10039040-146 = "О боже, это... Здесь столько всего..."
10039040-147 = "Вы, должно быть, столько сил потратили..."
10039040-148 = "Мы... Мы не хотели настолько вас обременять."
10039040-149 = "Мы не просили заходить так далеко... Мы лишь хотели, чтобы вы выбрали одно из наших предложений..."
10039040-150 = "Полагаю, с твоей точки зрения ты просто не могла сделать что-то вполсилы. Вот до чего мы её довели, капитан Минэ."
10039040-151 = "Эм..."
10039040-152 = "Не обязательно каждый раз говорить «мы»..."
10039040-153 = ""
10039040-155 = ""
10039040-156 = ""
10039040-157 = "Хех... Нет, вообще-то, я тоже несу ответственность."
10039040-158 = "Мы нагрузили тебя — это факт. У тебя даже сейчас тёмные круги под глазами."
10039040-159 = "Нам обеим очень жаль."
10039040-161 = "Нет-нет, это совсем не было обузой! Правда."
10039040-162 = "Мне понравилось. А круги под глазами лишь потому, что... я вчера допоздна выбирала песню."
10039040-163 = "Да. Как сказала Мари, это нам следует благодарить тебя, а не извиняться."
10039040-164 = "И благодаря тебе, думаю, мы обе нашли путь вперёд."
10039040-165 = "Сакурако?"
10039040-166 = "Ну..."
10039040-167 = "Уже немного поздно это говорить, но, Мари, пожалуйста, иди отдохни."
10039040-168 = ""
10039040-171 = ""
10039040-172 = ""
10039040-173 = ""
10039040-174 = "Ч-Что...?"
10039040-175 = "Ну, ты наверняка устала. Должно быть, непросто было всё это собирать."
10039040-176 = "Обещаю, мы с капитаном Минэ используем всё как следует."
10039040-177 = "Верно. Ни капли твоих усилий не пропадёт зря."
10039040-179 = "...А, точно. Конечно..."
10039040-181 = "...? Мари...?"
10039040-182 = "Что такое...? Тебя что-то беспокоит?"
10039040-184 = "*ахает* Эм, ну, немного... То есть нет! Нет, всё нормально. Я просто устала, как вы и сказали. Хаха..."
10039040-185 = "Да, эм, держитесь там обе! Я пойду!"
10039040-186 = ""
10039040-188 = ""
10039040-189 = ""
10039040-190 = "Мари..."
10039040-191 = "Это было странно..."
10039040-192 = "Как думаешь, что она хотела сказать?"
10039040-193 = "В любом случае, нам нужно немедленно начинать тренироваться."
10039040-194 = "Нужно разносить костюмы, выучить песню, освободить расписание под танцевальные занятия..."
10039040-195 = "Нельзя терять время! Её жертва не будет напрасной!"
10039040-197 = "Ж-Жертва?! Это не слишком громко сказано...?"
10039040-198 = "Сакурако...!"
10039040-199 = "Ладно, ладно. Начнём прямо сейчас, как ты и сказала."
10039040-200 = ""
10039040-202 = ""
10039040-205 = ""
10039040-206 = "..."
10039040-207 = ""
10039040-210 = ""
10039040-211 = ""
10039040-212 = "Да, это сестра Иочи Мари."
10039040-213 = "...А, сестра Хината."
10039040-214 = "Просто звоню узнать, как дела. Теперь я свободна, если нужна помощь."
10039040-215 = "...О?"
10039040-216 = "Вы уже почти закончили? Значит, сегодняшняя работа..."
10039040-217 = "...уже вся завершена? Я, эм, понимаю. Спасибо. Вы, должно быть, управились просто молниеносно."
10039040-218 = "...Да. Да, хорошо."
10039040-219 = "Конечно, скоро позвоню."
10039040-220 = ""
10039040-222 = ""
10039040-224 = "...Похоже, у меня внезапно появилось свободное время. Может, и правда получится отдохнуть."
10039040-225 = "Хм..."
10039040-226 = "Но что это..."
10039040-228 = "...Что за странное чувство...?"
