[translation]
10037110-1 = "Эпилог;Когда спутники расходятся"
10037110-2 = "Время летит так быстро... Встреча по обмену уже заканчивается."
10037110-3 = "Хи-хи-хи! Похоже, вам действительно понравилась эта встреча по обмену, Великий Вождь Черино."
10037110-5 = "Я рада. Какое главное впечатление о Шаньхайцзине вы унесёте с собой?"
10037110-6 = ""
10037110-8 = ""
10037110-9 = "Хм-м, Шаньхайцзин был..."
10037110-10 = ""
10037110-12 = ""
10037110-14 = "...настоящим большим приключением для нас!"
10037110-15 = "Интересные виды, вкусная новая еда, ленивые панды и Пекинская опера... Всё было прекрасно! Потрясающе!"
10037110-17 = "Надеюсь, вы сможете простить неприятности с Клубом Пекинской Оперы."
10037110-18 = "Ха! Похоже, госпоже Кисаки нужно, чтобы я повторилась."
10037110-19 = "Скажу ещё раз! Чрезмерная скромность и извинения могут дать обратный эффект!"
10037110-20 = "Я Великий Вождь Красной Зимы! Такие мелочи никогда не смогут угрожать моей власти!"
10037110-21 = "...Понятно."
10037110-23 = "Именно! Президент Черино — очень великодушный человек!"
10037110-24 = "Кагуя и члены Клуба Пекинской Оперы всё равно вернутся через две-три недели мытья туалетов. Этого вполне достаточно, разве нет?"
10037110-25 = ""
10037110-27 = ""
10037110-29 = ""
10037110-30 = "(И снова я вижу огромную разницу между обычаями Шаньхайцзина и школьными правилами Красной Зимы.)"
10037110-31 = "Президент Кисаки, особенно впечатляет то, как естественно вы вдохновляете людей."
10037110-32 = "Это прекрасное вдохновение для моей собственной пропаганды — то есть для того, как я убеждаю других."
10037110-33 = "Хм, правда? Вот уж чего я совсем не ожидала."
10037110-35 = "Но вы выглядите расстроенной, Президент Кисаки. Что-то случилось?"
10037110-36 = "Я? Ох. Нет, со мной всё в порядке."
10037110-37 = "Серьёзно...?"
10037110-38 = "Но важнее другое... Я подготовила небольшой памятный подарок. Надеюсь, вы его примете."
10037110-39 = ""
10037110-44 = "Это... панда?!"
10037110-45 = "Это фигурка панды, сделанная из белого, чёрного и зелёного нефрита. Пустяк, но надеюсь, она останется вам на память о поездке в Шаньхайцзин."
10037110-46 = "Потрясающе, госпожа! Чёрно-белые цвета панды переданы идеально. И её пухлая форма, и сонные глаза...!"
10037110-47 = "Кажется, она вот-вот оживёт и начнёт двигаться!"
10037110-48 = "Фуфу! Похоже, председателю Марине она особенно понравилась."
10037110-50 = "Спасибо! Я буду хранить её в своём Исполнительном Кабинете! Как только сможем, я с радостью приглашу вас в нашу Красную Зиму!"
10037110-51 = "Как я могу отказаться? Более того, я буду ждать этого, Великий Вождь Черино!"
10037110-59 = ""
10037110-60 = "Фух... Едва успела вернуться."
10037110-61 = "Что касается проводов, я всё оставила менеджеру по связям с общественностью. Уверена, они справятся."
10037110-62 = ""
10037110-64 = ""
10037110-65 = "..."
10037110-66 = "Я беспокоюсь."
10037110-67 = ""
10037110-69 = ""
10037110-71 = ""
10037110-74 = "Может ли всё, что сделал Клуб Пекинской Оперы, запустить в Шаньхайцзине другой вид перемен?"
10037110-75 = "Уверена, дело не только в Кагуе. В конце концов, всё начала именно я."
10037110-78 = "Так было и раньше. Что бы ни происходило в Шаньхайцзине..."
10037110-79 = "Опавшие цветы, наводнения, удары молний... Всё моя вина. Такова моя роль."
10037110-80 = "Это означает брать на себя всю ответственность без оправданий. Вот что значит быть президентом Шаньхайцзина."
10037110-81 = ""
10037110-83 = ""
10037110-84 = ""
10037110-85 = "Но сейчас..."
10037110-87 = "Мне стоит попробовать немного отдохнуть."
10037110-88 = ""
10037110-95 = "...Как вы себя чувствуете, Президент Кагуя?"
10037110-96 = "Никогда не чувствовала себя спокойнее, благодаря вам, Исполнительный Офицер Мина."
10037110-97 = "По вам не скажешь... Вы правда это имели в виду...?"
10037110-98 = "Невежливо указывать на ложь, даже если она очевидна..."
10037110-99 = ""
10037110-101 = ""
10037110-102 = "Тогда спрошу прямо. Зачем вы задумали всё это?"
10037110-103 = "..."
10037110-104 = "Ради верности. Вот и всё."
10037110-105 = "Вы поставили ту Пекинскую оперу перед гостями из Красной Зимы и Генрюмоном, да ещё и посмели навредить президенту! Какое это имеет отношение к верности?!"
10037110-106 = "Если бы могла, я бы вас исключила — и даже этого мне показалось бы мало!"
10037110-107 = "Вижу, вы всё ещё тугодумная сторонница верности, Исполнительный Офицер Мина."
10037110-108 = "Настоящая верность — сделать всё возможное, чтобы противостоять президенту, когда она принимает неправильное решение!"
10037110-109 = "...Под «неправильным решением» вы имеете в виду приглашение гостей из Красной Зимы?"
10037110-110 = "Разве не Клуб Пекинской Оперы первым выразил беспокойство по этому поводу?"
10037110-111 = "Верность президенту, чьи действия не соответствуют правильному порядку вещей, никак нельзя назвать истинной верностью."
10037110-112 = "Президент, безусловно, умна и мудра... Но она произвольно выбирает, какие проблемы решать."
10037110-114 = "Что?!"
10037110-115 = "Разве вы не знаете? Я говорю об исключении Шинтани Кай."
10037110-116 = ""
10037110-119 = ""
10037110-120 = "К чему вы клоните...?"
10037110-126 = "Спасибо, что пришла сюда. Насчёт происходящего в Обществе Восточной Алхимии и Шаньхайцзине... Нет, теперь спрашивать уже бесполезно."
10037110-127 = "...Внутреннее расследование в Обществе Восточной Алхимии постепенно сужает круг подозреваемых."
10037110-128 = "У меня не осталось выбора, кроме как покинуть Общество Восточной Алхимии."
10037110-129 = "Но если ты исчезнешь сейчас, разве это не выставит тебя виновной?"
10037110-130 = "Это был единственный вариант. Да и теперь они уже ничего не смогут сделать."
10037110-131 = "Кехехех... Мне и правда часто попадаются такие правильные девочки, как ты и Кагуя, да?"
10037110-132 = "Кстати, о чём вы говорили с президентом Клуба Пекинской Оперы той ночью?"
10037110-133 = "Ни о чём особенном."
10037110-135 = "Просто спрашиваю, потому что Кагуя упомянула, что вернёт меня в Общество Восточной Алхимии."
10037110-136 = ""
10037110-138 = ""
10037110-139 = "Что, простите?!"
10037110-142 = "О чём вы говорите? Шинтани Кай снова принять в Общество Восточной Алхимии?"
10037110-143 = "Чушь!"
10037110-145 = "Нет, именно это и будет естественным и правильным путём!"
10037110-146 = "Разве вы не согласны, что процедура, которой президент воспользовалась для исключения Кай, была чрезмерно радикальной и ненормальной?!"
10037110-147 = ""
10037110-150 = "...!"
10037110-151 = "Кроме того, помимо обхода надлежащей процедуры и мгновенного исключения, все записи были полностью стёрты, и почти никто вообще не знает о Кай!"
10037110-152 = "Но подражательные преступления всё равно нужно предотвращать!"
10037110-153 = "Более того, если бы она выполнила каждый шаг процедуры, исключение Шинтани Кай могло занять больше года!"
10037110-154 = "Подумай, сколько жертв могло появиться за это время!"
10037110-155 = "Как бы то ни было, всё должно делаться по правилам."
10037110-156 = "Даже президент не может произвольно нарушать школьные правила Шаньхайцзина!"
10037110-157 = "Если мы не уважаем школьные правила, мы подрываем сам институт, который и наделил президента властью над Шаньхайцзином!"
10037110-160 = "Мы не обсуждали ничего особенно выдающегося, но разговор определённо был забавным."
10037110-161 = "Она сказала, что после моего восстановления в Обществе Восточной Алхимии меня снова исключат — уже по всей положенной процедуре."
10037110-162 = "Затем эти записи и вся правда о них будут широко распространены, чтобы я стала примером для остальных."
10037110-163 = "...Да, это очень похоже на то, что сказала бы президент Клуба Пекинской Оперы."
10037110-164 = "Ты... собиралась принять это предложение?"
10037110-165 = "Сначала меня позабавили её разговоры о возвращении меня в Общество Восточной Алхимии."
10037110-166 = "Именно поэтому я предложила Кагуе написать новую Пекинскую оперу."
10037110-169 = ""
10037110-170 = "Вот почему вы хотели восстановить Кай, а потом снова её исключить?!"
10037110-171 = ""
10037110-173 = ""
10037110-174 = "Глупышка! Ты правда думаешь, что это вообще возможно — что Кай согласится на такое предложение?!"
10037110-175 = "Кай — студент Шаньхайцзина. У неё нет причин отказываться! Так и должно быть!"
10037110-176 = "Все такие узколобые!"
10037110-178 = "Если по какой-то ничтожной случайности Кай откажется, я заставлю её!"
10037110-179 = "Для чего вообще существуют власть и полномочия президента Генрюмона!"
10037110-180 = "Почему президент Генрюмона, по-вашему, обладает большей властью, чем президенты студенческих советов других академий?"
10037110-181 = "Разве всё не должно делаться ради соблюдения обычаев Шаньхайцзина?!"
10037110-182 = ""
10037110-184 = ""
10037110-186 = ""
10037110-187 = "(...Мне часто говорят, что я упрямая...)"
10037110-188 = "(Но эта психованная уже совсем другого уровня...)"
10037110-191 = ""
10037110-192 = "А что насчёт того, что будет после моего возвращения в Общество Восточной Алхимии? Я бы, скорее всего, просто проигнорировала все идеи Кагуи."
10037110-193 = "Восстановление, а потом повторное исключение лишь ради соблюдения правильной процедуры? Ты правда думаешь, что я стану в этом участвовать?"
10037110-194 = "Но... разве это тоже не своего рода предательство?"
10037110-195 = "Ты правда думаешь, что на этом этапе мне есть до этого дело?"
10037110-196 = "..."
10037110-197 = "Я очень долго к этому шла. Мне даже пришлось пережить унижение заключения в Исправительном Бюро."
10037110-198 = "Но я всё равно накопила силы и ждала подходящего момента. И этот момент настал."
10037110-199 = "Я заберу то, что принадлежит мне, и никто не встанет у меня на пути."
10037110-200 = ""
10037110-202 = ""
10037110-203 = ""
10037110-204 = "Иди и передай им."
10037110-207 = "Я вернулась."
10037110-208 = "Сияющая Луна, Шумный Сон"
