[translation]
10026100-1 = "Эпизод 10;Небольшие перемены"
10026100-2 = "Ах... Понятно."
10026100-3 = "Кроме первой находки, есть ещё два места с тайными общежитиями и шкафами для хранения."
10026100-4 = "А всё это место было тренировочным полигоном Совета, который закрыли из-за всей этой несанкционированной деятельности?"
10026100-5 = "Даже студенты тех времён иногда прогуливали..."
10026100-6 = "Полагаю, мы все порой поддаёмся такому соблазну."
10026100-7 = "По крайней мере, общую картину мы поняли. Детали разберём позже. Спасибо за помощь."
10026100-8 = "О, и отличная работа... очень быстро. Вы определённо оправдываете свою репутацию Волшебницы Старой библиотеки."
10026100-9 = "...Ах..."
10026100-10 = "Эм..."
10026100-11 = "Не знаю, что сказать... Я понимаю, что должна быть благодарна за то, что мы так быстро всё закончили, но..."
10026100-12 = "Всё оказалось слишком просто... Я чувствую себя немного..."
10026100-13 = ""
10026100-15 = ""
10026100-16 = "...разочарованной. Но какой пример я подам, если, будучи Сестрой, буду испытывать что-то кроме благодарности."
10026100-17 = "Как и обещали... в обмен на её помощь в этом деле мы можем забыть об истории со Священным писанием и Козэки Уи."
10026100-18 = "Хи-хи! Это замечательно!"
10026100-19 = "...Хм."
10026100-20 = "Ханако, если ты не против. Я хотела бы задать тебе личный вопрос, не для протокола."
10026100-21 = "Это расследование... Я с самого начала видела, как ты пыталась всё подстроить."
10026100-22 = "Я знаю, у тебя не было злого умысла. Ты просто хотела помочь Уи, и это прекрасно."
10026100-23 = "Но я всё же должна спросить... Ты знала что-нибудь об этих руинах ещё до всего этого? Ты знала, чем было это место?"
10026100-24 = "Полагаю, должна была знать, иначе зачем тебе было так старательно защищать Уи?"
10026100-25 = "Ты это заметила, да? Похоже, в последнее время я стала менее осторожной."
10026100-26 = "Что касается того, почему я защищала Уи..."
10026100-27 = "Причины нет. Считай это прихотью."
10026100-28 = "Прихотью? Хмм..."
10026100-29 = "Ну... Хорошо. Мне этого достаточно."
10026100-30 = "И... места, указанные в вашем отчёте, — это всё, что вы нашли?"
10026100-31 = "Что ты имеешь в виду?"
10026100-32 = "Ты намекаешь, что мы что-то от тебя скрываем? Что мы лжём?"
10026100-33 = "Нет! Вовсе нет! Я не это имела—"
10026100-34 = "Я не хотела вас обидеть этим вопросом! Просто в наше время осторожность не помешает, понимаете?"
10026100-35 = "А теперь насчёт карты..."
10026100-36 = "Ах."
10026100-37 = "Карты. Да. Мне правда очень жаль. Я должна была бережнее с ней обращаться, но понимаете... Пыл сражения..."
10026100-38 = "О, нет. Я как раз хотела сказать, что всё в порядке."
10026100-39 = "Это было печально, но возможность наконец исследовать те руины стоила этой потери."
10026100-40 = "Если уж на то пошло, мы благодарны вам за проделанную работу и за то, что вы сделали для нас копию."
10026100-41 = "Я искренне надеюсь, что однажды у нас появится возможность отплатить вам за помощь."
10026100-42 = "До следующей встречи..."
10026100-43 = ""
10026100-45 = ""
10026100-46 = "...Хи-хи."
10026100-47 = "Вернёмся, Сенсей?"
10026100-51 = "[ns1] «Это точно нормально...?»\n[ns2] «Как-то неправильно получается.»"
10026100-54 = "Эй-эй! Теперь уже поздно сомневаться! Мы все в этом замешаны... Мы сообщницы."
10026100-55 = "Неважно, что именно мы спрятали и где закопали. Дело сделано."
10026100-56 = "Не могу поверить, что ты вообще подумала что-то рассказать... Ты не такая милая, как выглядишь."
10026100-57 = "В любом случае, вернёмся к нашему разговору на днях, когда вы спросили меня, нравится ли мне Уи."
10026100-58 = "Я знаю, что уже ответила. Но раз всё стало таким хаотичным, решила сейчас выразиться предельно ясно."
10026100-59 = "Мой ответ — да... думаю, она мне нравится."
10026100-60 = "Если нам ещё когда-нибудь представится шанс... я бы с удовольствием снова прогулялась с тобой в купальнике."
10026100-61 = "[s3] «Уи будет тяжеловато.»\n[s4] «Не ставь её в слишком неловкое положение.»"
10026100-62 = "Думаете? Хи-хи..."
10026100-63 = "Да. Я бы так сказала."
10026100-64 = "А, Ханако?"
10026100-65 = "Хм..."
10026100-66 = "О, привет, Мари!"
10026100-67 = ""
10026100-70 = ""
10026100-71 = "Давно тебя не видела. Как ты поживаешь?"
10026100-72 = "О, вы тоже здесь, Сенсей? Наверное, по официальным делам."
10026100-73 = "Можно и так сказать."
10026100-74 = "А... Понятно..."
10026100-75 = "...Хи-хи."
10026100-76 = "Может, в следующий раз мне привести их сюда просто ради развлечения?"
10026100-77 = ""
10026100-79 = ""
10026100-81 = "Например, чтобы повидаться с тобой, Мари...?"
10026100-82 = "...?!"
10026100-83 = "Ханако! Я-Я не поэтому спросила!"
10026100-84 = "О, я вам мешаю? Простите. Просто не смогла удержаться от такого предложения..."
10026100-85 = "Н-Нет! Я не против. Пожалуйста, приходите. Я всегда рада принять Ханако и Сенсея!"
10026100-86 = "О-Обещайте!"
10026100-87 = "...Хи-хи."
10026100-88 = "Ладно. Чтобы ты знала, сегодня мы действительно здесь по делу, и нам ещё нужно посетить несколько мест. Поэтому придётся зайти в другой раз."
10026100-89 = "А, хорошо! Берегите себя!"
10026100-90 = "...И вы тоже, С-Сенсей!"
10026100-91 = ""
10026100-93 = ""
10026100-95 = "[ns] «Мари выглядит очень счастливой.»"
10026100-96 = "Правда ведь? Хи-хи..."
10026100-97 = "Мари для меня слишком уж пай-девочка, но..."
10026100-98 = "Я рада видеть её счастливой. Можно даже сказать, что это благодаря вам, Сенсей."
10026100-99 = "А это значит..."
10026100-100 = "Если потом Мари будет плакать из-за того, что мы не смогли провести время вместе, это тоже будет ваша вина!"
10026100-101 = "[s5] «...Что? С чего вдруг?!»\n[s6] «По-моему, Мари не может пойти гулять в купальнике!»"
10026100-104 = "Хи-хи... Может, нам вернуться и спросить у неё самой?"
10026100-105 = "Решайте быстрее, Сенсей. Сегодня нам ещё много куда нужно зайти..."
10026100-106 = ""
10026100-108 = ""
10026100-111 = "Я вернулась!"
10026100-112 = "Вернулась? Ты говоришь так, будто это твой дом."
10026100-113 = "Ух! Ещё один человек, который будет действовать мне на нервы..."
10026100-114 = ""
10026100-117 = "Хината! Пожалуйста, осторожнее!"
10026100-118 = "Передвигать этот книжный шкаф опасно! Ты можешь серьёзно кого-нибудь травмировать!"
10026100-119 = ""
10026100-121 = ""
10026100-122 = "И сама можешь пострадать, Хината. Смотри под ноги!"
10026100-124 = "Ахаха... Простите. На полу оказалось больше вещей, чем я ожидала."
10026100-125 = "Но я не позволю этому меня замедлить! Я не собираюсь никому уступать!"
10026100-126 = "Я не поэтому прошу тебя быть осторожнее."
10026100-127 = "Эм... Учитывая, сколько здесь книг, тебе не кажется, что неплохо было бы нанять помощника?"
10026100-128 = "Не могу поверить, что ты всё это время справлялась со всем одна. Я немного переживаю..."
10026100-129 = "Ни в коем случае!"
10026100-130 = "Я изо всех сил стараюсь не пускать сюда людей. И уж точно не стану приглашать кого-то внутрь, чтобы он... трогал вещи."
10026100-131 = "Вот прямо сейчас, например... Аргх! Что вы— Всё! Я больше не могу!"
10026100-132 = "Сколько здесь вообще людей?! Это уже какой-то цирк с тремя аренами!"
10026100-133 = "...Кошмар! Я так не могу."
10026100-134 = "[s7] «Уи, здесь всего четыре человека.»\n[s8] «Тсс! Мы в библиотеке. Помнишь?»"
10026100-137 = "Хи-хи. Не волнуйся, Уи. Мы ненадолго."
10026100-138 = "Я передала наш отчёт Сакурако. К счастью, вопросов у неё почти не было. Так что с этим покончено!"
10026100-139 = "А?! Она вот так просто всё приняла?"
10026100-140 = "Должно быть, ты дала очень хорошее объяснение. Спасибо вам обеим."
10026100-141 = "А что насчёт карты и Капсулы воспоминаний?"
10026100-142 = "Об этом мы не говорили. Более того, собор, похоже, совершенно не обеспокоен."
10026100-143 = "Честно говоря, я удивилась, что именно ты предложила этот маленький трюк, Уи."
10026100-144 = "Закопать Капсулу воспоминаний, свернув карту внутри, было гениально."
10026100-145 = "Я лишь надеюсь, что оставить её там действительно нормально. На тебя не похоже так обращаться с настолько важной частью истории."
10026100-146 = "Разве если свернуть карту, положить её в ящик и закопать, пергамент со временем не повредится?"
10026100-148 = "Погодите, что?"
10026100-149 = "Именно ты сейчас беспокоишься о таких вещах...?"
10026100-150 = "*вздыхает* Вы правда хотите подробное объяснение?"
10026100-151 = "А... Нет, простите. Я пообещала себе, что буду добрее ко всем вам."
10026100-152 = "Просто чем больше вокруг людей, тем чаще мне приходится напоминать себе не грубить."
10026100-153 = "В любом случае, отвечая на ваш вопрос... я библиотекарь, а не археолог."
10026100-154 = "Я стараюсь уважать волю создателей этих артефактов, какой бы она ни была. Я не складываю всё без разбора в музей."
10026100-155 = "Не все реликвии закапывали с намерением передать их будущим поколениям."
10026100-156 = "Некоторые истории должны были жить лишь в сердцах и памяти тех, кто их знал."
10026100-157 = "Тот тренировочный полигон официально закрыли. Они никогда не собирались возвращаться за теми воспоминаниями."
10026100-158 = "Если бы вы забрали их с собой, эти записи и найденные нами ценные личные вещи всё равно бы конфисковали и уничтожили."
10026100-160 = "Была причина, по которой эти люди ни с кем не делились своими драгоценными воспоминаниями."
10026100-161 = "Они хотели, чтобы те исчезли вместе со временем."
10026100-162 = ""
10026100-163 = "Если бы мы откопали их и запихнули в музей, это было бы величайшим оскорблением."
10026100-164 = "..."
10026100-165 = "Как исследователи, мы обязаны были выяснить и сообщить, что там произошло."
10026100-166 = "И мы это сделали. Но та Капсула воспоминаний... Я хотела уважить её изначальное предназначение."
10026100-167 = "В то же время ящик, которому нечего хранить, почему-то кажется... очень одиноким."
10026100-168 = "[s9] «...Пергамент хранится очень долго.»\n[s10] «А поскольку это предметы одной эпохи, они... связаны.»"
10026100-171 = "Примерно так. Оба были созданы в ту эпоху и разделяют одну историю."
10026100-172 = "Но хватит об этом."
10026100-173 = ""
10026100-175 = ""
10026100-176 = ""
10026100-177 = ""
10026100-178 = "Я удивлена, что Хината согласилась на моё предложение."
10026100-179 = "...А? Ко мне?"
10026100-180 = "Ну... ты же Сестра. Разве ложь не станет для тебя проблемой?"
10026100-181 = "Ахаха... Вот что тебя беспокоит, Уи?"
10026100-182 = "Не волнуйся обо мне. Со мной всё будет хорошо. К тому же ты ведь не заставляла меня лгать."
10026100-183 = "Ты не чувствовала, что на тебя давили?"
10026100-184 = "Конечно нет! Да, обычно лгать плохо, но..."
10026100-185 = "...иногда маленькая ложь во благо никому не навредит, если намерения хорошие. И кто знает? Возможно, тебе даже простят её."
10026100-186 = "Сестра Сакурако всегда говорила: «Постоянно читать Писание и повторять правила..."
10026100-187 = "...нужно лишь для того, чтобы они помогали направлять нас по верному пути."
10026100-188 = "В глубине души мы знаем, что правильно, и прежде всего должны уважать эту интуицию.»"
10026100-189 = "...Твоё объяснение казалось правильным, Уи. Поэтому я и поддержала твой план. Поверь мне. Со мной всё будет хорошо."
10026100-190 = "Эм... Э-эм... М-м..."
10026100-191 = "[s11] «Вы и правда замечательные Сёстры.»\n[s12] «Всё обязательно будет хорошо.»"
10026100-194 = "Да... Какое облегчение."
10026100-195 = "Я рада. И надеюсь, это немного разрушит твои предубеждения о Сестре Сакурако и остальных, Уи..."
10026100-197 = "Ни за что. Это совершенно разные темы."
10026100-198 = "Ты слишком наивна, Хината."
10026100-199 = "Этот человек... Нет. Вся эта организация что-то скрывает... что-то огромное!"
10026100-200 = "Иначе зачем им постоянно отправлять тебя сюда следить за мной?"
10026100-201 = "Эм... Так друзья и поступают. Проверяют, всё ли друг у друга в порядке. Я пытаюсь тебе помочь, Уи..."
10026100-202 = "Именно так они и хотят, чтобы ты думала, Хината! И им легко, потому что ты слишком добрая! Но это не НАСТОЯЩАЯ причина!"
10026100-203 = "*вздыхает* Знаешь что? Забудь. Я только зря трачу слова."
10026100-204 = "Ха-ха-ха..."
10026100-206 = "Как скажешь, Уи. В любом случае, похоже, самое худшее уже позади."
10026100-207 = "Полагаю, нам пора перестать тебе мешать, пока ты окончательно не сошла с ума."
10026100-208 = "...!"
10026100-209 = "Т-Тогда... Эм..."
10026100-210 = "Эй, подождите!"
10026100-211 = "А? Что такое, Уи?"
10026100-212 = "Ты втайне надеялась, что мы останемся подольше?"
10026100-213 = "Н-Не говори глупостей. Это..."
10026100-214 = "Я вообще не это собиралась— Забудь... Вот. По одной каждому."
10026100-215 = ""
10026100-217 = ""
10026100-218 = "[ns13] «Холодный американо! Ух ты!»\n[ns14] «Уи, это значит...?»"
10026100-221 = ""
10026100-223 = "Из-за меня всем пришлось многое пережить."
10026100-224 = "Я знаю, это немного, но хотя бы так могу отблагодарить вас. Возьмите по одному, когда будете уходить..."
10026100-225 = "...в знак моей признательности."
10026100-226 = ""
10026100-228 = ""
10026100-229 = ""
10026100-230 = ""
10026100-231 = "[ns15] «Спасибо за напиток.»\n[ns16] «Приятно видеть, что ты стараешься, Уи.»"
10026100-234 = "П-Почему все улыбаются и смотрят на меня?! Просто... заберите кофе и уже уходите!"
10026100-236 = "Вы меня слышали! Вон! Кыш!"
10026100-237 = "Ладно! Ладно!"
10026100-238 = "До встречи, Уи!"
10026100-239 = "[ns] «Не перенапрягайся, Уи.»"
10026100-240 = ""
10026100-241 = ""
10026100-242 = "*вздыхает*"
10026100-243 = "Как же это раздражает. Я не умею ладить с людьми."
10026100-244 = ""
10026100-246 = ""
10026100-247 = "Как у меня постоянно появляются друзья, с которыми приходится быть милой?"
10026100-250 = "..."
10026100-251 = "С-Сенсей? З-Зачем вы так срочно меня позвали?"
10026100-252 = "Почему сюда? И почему в таком наряде?"
10026100-254 = ""
10026100-255 = "Ч-что происходит?!"
10026100-256 = "Объяснитесь, Сенсей, иначе рискуете быть казнённым!"
10026100-257 = "Это ведь не то, о чём я думаю... правда?! Со стороны это точно будет выглядеть плохо."
10026100-258 = "[s17] «Тебе понравится, Кохару.»\n[s18] «Не волнуйся. Всё будет хорошо.»"
10026100-261 = "И-Ик?! Ч-Что вы имеете в виду?!"
10026100-262 = "Так вот оно что?! Вы наконец показываете своё истинное лицо?! Никогда не думала, что вы окажетесь настолько смелым!"
10026100-263 = "О, хорошо! Вы здесь! Сюда, Сенсей! И ты тоже, Кохару!"
10026100-264 = "...?"
10026100-265 = "...А? Этот голос похож на..."
10026100-266 = ""
10026100-267 = ""
10026100-269 = "А! Какое облегчение, что вы пришли. Я уже начала думать, что иду прямо в засаду."
10026100-270 = "Азуса, никто не устраивает засаду в таком месте."
10026100-271 = "Хи-хи. Мы ждали вас двоих."
10026100-272 = "Теперь мы все можем начать беззаботно наслаждаться солнечным днём!"
10026100-273 = "Сенсей арендовал для нас весь бассейн!"
10026100-274 = ""
10026100-276 = ""
10026100-277 = "А?"
10026100-278 = "Хм..."
10026100-279 = "Эм... Сенсей?"
10026100-280 = "[s19] «Ты впервые плаваешь вместе со всеми?»\n[s20] «Ну как тебе, Кохару? Неплохо, правда?»"
10026100-283 = "Эм... Э-эм..."
10026100-284 = "Эм..."
10026100-285 = "...Хи-хи!"
10026100-287 = "Ага."
10026100-288 = "Внеклассные занятия Тринити: В поисках скрытых руин"
