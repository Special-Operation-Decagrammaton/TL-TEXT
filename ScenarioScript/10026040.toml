[translation]
10026040-1 = "Эпизод 4;Участок B: Катакомбы"
10026040-4 = "Следующее место, которое нам нужно исследовать... прямо здесь."
10026040-5 = "Хм... Для обычного погреба или склада всё слишком сложно устроено."
10026040-6 = "Архитектура впечатляет. Наверняка это было важное место."
10026040-7 = "Давайте снова разделимся для исследования."
10026040-8 = "Но далеко не уходите. Пока поблизости бродят мимесисы, нужно быть осторожнее."
10026040-9 = "Оставайтесь так близко, чтобы можно было докричаться..."
10026040-10 = "И смотрите под ноги. Время это место не пощадило. Повсюду обломки."
10026040-11 = "Ну... Я пошла..."
10026040-12 = ""
10026040-14 = ""
10026040-15 = "Эм, У-Уи. Подожди..."
10026040-16 = ""
10026040-18 = ""
10026040-19 = "Она уже ушла..."
10026040-20 = "Если здесь так опасно, почему мы не держимся вместе?"
10026040-21 = "Даже сейчас Уи предпочитает быть одна?"
10026040-22 = "..."
10026040-23 = "...Сенсей?"
10026040-24 = "[s1] «Да?»\n[s2] «Не переживай. Я пойду за ней.»"
10026040-25 = ""
10026040-26 = ""
10026040-29 = "Всё так плохо, как я и думала. Здесь действительно видны следы времени."
10026040-30 = "Только посмотрите на эти образования, созданные каплями воды."
10026040-31 = ""
10026040-34 = "Ииииик!!"
10026040-35 = "С-Сенсей?! Что вы здесь делаете?"
10026040-36 = "Ч—"
10026040-37 = "Какая разница, что здесь мимесисы? Я прекрасно справлюсь одна. Не нужно ходить за мной."
10026040-38 = "Мы ведь даже не так далеко друг от друга..."
10026040-39 = "Но... пожалуй, я немного поступила безрассудно."
10026040-40 = "Если вы правда так переживаете, тогда... Было бы неплохо держаться вместе."
10026040-42 = "Хм..."
10026040-43 = "Не ожидала, что буду так благодарна за вашу компанию. Это... приятно, что вы обо мне беспокоитесь."
10026040-44 = "Если честно, я не рада тому, как мы здесь оказались."
10026040-45 = "Но само это место не такое уж плохое."
10026040-46 = "То есть кому бы не понравилось находиться в таком интересном месте?"
10026040-47 = "Ч—"
10026040-48 = "Что значит «многим»? Я знаю, здесь немного мрачно, но..."
10026040-49 = "Ладно, пожалуй, вы правы. Такое нравится не всем."
10026040-50 = "Но я не говорила конкретно о вас."
10026040-51 = "Возможно, вас удивит, что я и сама не особо люблю плохо освещённые места."
10026040-52 = "Да, прямой солнечный свет я не люблю, но мне всё же нужно хоть что-то, при чём можно читать..."
10026040-53 = "Разумеется, до этого я говорила не только об освещении. Дело ещё и в возрасте этого места."
10026040-54 = "Знаю, такое нравится не всем, но сколько же здесь истории!"
10026040-55 = "Здесь можно открыть столько всего, помимо древних текстов."
10026040-56 = "Я говорю о том, что..."
10026040-57 = ""
10026040-60 = "...это относится ко всему."
10026040-61 = "[s3] «...Верно.»\n[s4] «Ты имеешь в виду следы времени?»"
10026040-64 = "Да, следы, отражающие историю давно ушедшей эпохи, вещи, которые лежат далеко за пределами нашего понимания."
10026040-65 = "Некоторые этого не понимают. Они просто назовут такое место проклятым или заброшенным..."
10026040-66 = "Это оскорбление для людей, посвятивших жизнь созданию этого места, его защите и попыткам осмысленно передать свои знания."
10026040-67 = "Они принижают хранителей этой драгоценной информации лишь за то, что те стали жертвами разрушительного хода времени."
10026040-68 = "*вздыхает* Для меня это болезненная тема. Наверное, поэтому другие люди часто кажутся мне... слишком утомительными."
10026040-69 = ""
10026040-71 = ""
10026040-72 = "Простите. Я ведь обещала себе перестать пускаться в такие тирады."
10026040-73 = "Я поняла, что не все такие."
10026040-74 = "Например, Хината или Ханако... Они помогли мне взглянуть на людей иначе."
10026040-75 = "Вообще-то они очень мне помогли. Хотя я не понимаю почему."
10026040-76 = "В общем... Это непросто, но я стараюсь не делать поспешных выводов о людях..."
10026040-77 = "Хотя иногда всё ещё думаю о них плохо, как только что."
10026040-78 = "Господи! Почему я всегда такая?"
10026040-79 = "Я знаю, что должна стыдиться себя и своих предубеждений. Я стараюсь исправиться."
10026040-80 = "Но всё же..."
10026040-81 = "Если я делаю что-то неправильно, пожалуйста, скажите мне об этом, Сенсей."
10026040-82 = "Я не против, если меня немного отругают, когда это необходимо. Иногда я этого заслуживаю."
10026040-83 = ""
10026040-85 = ""
10026040-86 = "Ну, не то чтобы именно «заслуживаю»... Странно прозвучало."
10026040-87 = "Я хочу сказать, вы мой учитель, а я всего лишь студент..."
10026040-88 = "Поэтому вы можете сделать мне замечание, когда это необходимо. Ведь учителя так и поступают, правда?"
10026040-89 = "..."
10026040-90 = "...Простите. Теперь я просто болтаю без остановки."
10026040-91 = "Давайте забудем об этом, хорошо? Нам всё равно нужно возвращаться к работе."
10026040-93 = "Можно с уверенностью сказать, что чем бы ни было это здание, оно имело большое значение."
10026040-95 = "Поразительно, сколько внимания уделено деталям. Интерьер, отделка, декоративные элементы, искусство — всё сделано с огромной тщательностью."
10026040-96 = "Они бы не приложили столько усилий, если бы это место не играло важную роль в их культуре и не олицетворяло власть."
10026040-97 = ""
10026040-98 = "Может, это был какой-то подземный командный центр?"
10026040-99 = "Да. Я бы так сказала."
10026040-100 = ""
10026040-103 = "Иииик!!"
10026040-104 = "Что только что упало?! От такого грохота и мёртвые проснутся!"
10026040-105 = ""
10026040-109 = "Что здесь вообще могло издать такой громкий звук?"
10026040-110 = "Готова поспорить, Хината что-то сломала."
10026040-111 = "Она такая неуклюжая. Я бы не удивилась..."
10026040-112 = "[s5] «Не очень-то добрые слова, Уи.»\n[s6] «Не стоит сразу думать о людях худшее.»"
10026040-115 = "А. Вы правы..."
10026040-116 = "Хм... И вот вам уже пришлось меня отругать."
10026040-117 = "Я не хотела обвинять Хинату, просто такое уже случалось в библиотеке, и я—"
10026040-118 = "Нет. Мои причины не имеют значения, и лучше извиниться, чем оправдываться. Простите."
10026040-119 = "Пойдём посмотрим, что вызвало этот шум. Может, я смогу чем-то помочь."
10026040-120 = ""
10026040-122 = ""
10026040-123 = ""
10026040-124 = ""
10026040-125 = "Вот вы где. Мы услышали шум. Что случилось?"
10026040-126 = "...?"
10026040-127 = "Почему вы молчите?"
10026040-128 = "...??"
10026040-129 = "Разве вы не знаете, что игнорировать того, кто с вами разговаривает, невежливо?"
10026040-130 = "Что ЭТО такое?"
10026040-131 = "Эй! Что вы делаете?"
10026040-132 = ""
10026040-134 = ""
10026040-135 = ""
10026040-138 = ""
10026040-139 = "Эм..."
10026040-140 = "..."
10026040-141 = "...?"
