[translation]
2601203-1 = "Подготовка к чрезвычайным ситуациям"
2601203-2 = "Чтобы помочь Кирино с тренировкой, я снова отправился в тренировочный бассейн Полицейской школы Валькирия."
2601203-3 = ""
2601203-5 = ""
2601203-6 = "Привет, Сенсей!"
2601203-7 = "Как я уже говорила, сегодняшняя тренировка будет на суше, без плавания!"
2601203-8 = "Вообще никакого захода в воду."
2601203-9 = "[s] «(Я услышал ещё в первый раз...)»"
2601203-10 = "Самый важный навык первой помощи для любого спасателя — без сомнений, СЛР."
2601203-11 = "Это жизненно важный навык для спасения утопающих."
2601203-12 = "С помощью нажатий на грудную клетку мы искусственно поддерживаем кровообращение и защищаем мозг от повреждений."
2601203-13 = "По статистике, при проведении СЛР шанс выживания выше в 2,4 раза, чем без неё."
2601203-14 = "[s1] «Ого, впечатляет! Ты и правда хорошо подготовилась, да?»\n[s2] «С такими знаниями ты уже почти эксперт!»"
2601203-17 = "...по крайней мере, так написано в «Руководстве спасателя для новичков Валькирии»!"
2601203-18 = "[s] «Ну, читать инструкцию всё равно полезно.»"
2601203-19 = "Хорошо, начинаем тренировку! Сначала устанавливаем учебный манекен—"
2601203-20 = ""
2601203-22 = ""
2601203-23 = "А?"
2601203-24 = "[s3] «Какой манекен?»\n[s4] «Я не вижу никакого манекена...»"
2601203-27 = "Я-я, наверное, оставила его в кладовой..."
2601203-28 = "Вот блин. Кладовая вообще на другом конце школы. Как думаете, мне быстро сбегать туда?"
2601203-29 = "Н-Но у меня бассейн забронирован только на ограниченное время..."
2601203-30 = "[s5] «Похоже, выбора нет.»\n[s6] «Я побуду твоим манекеном.»"
2601203-33 = "Что? Вы правда согласны?"
2601203-34 = "Так тренировка точно получится реалистичнее."
2601203-35 = "Вы уверены, что не против этого?"
2601203-36 = "[s] «Я пришёл помочь тебе с тренировкой — этим и займусь.»"
2601203-37 = "С-Спасибо!"
2601203-38 = "Тогда в ответ я приложу все силы."
2601203-41 = "Я лёг и закрыл глаза, притворяясь без сознания."
2601203-42 = "О нет! Сенсей, очнитесь! Вы, у выхода, немедленно вызывайте скорую! Я окажу первую помощь до их приезда!"
2601203-43 = "С-Сначала проверяем пульс и дыхание...!"
2601203-44 = "[s] «(Она проверяет пульс рукой и слушает дыхание. Всё по инструкции.)»"
2601203-45 = "Затем убеждаемся, что дыхательные пути свободны!"
2601203-46 = "[s] «(Она приподняла мне подбородок, правильно выравнивая дыхательные пути.)»"
2601203-47 = "Эм, дальше я..."
2601203-48 = ""
2601203-51 = "[ns] «(Хм...?)»"
2601203-52 = "Я воспользуюсь AED!"
2601203-53 = ""
2601203-56 = "[ns] «(Погоди, что?)»"
2601203-57 = ""
2601203-58 = "[ns7] «Ч-Что ты делаешь?!»\n[ns8] «Это опасно!»"
2601203-61 = "А? Но в инструкции написано использовать AED при остановке сердца..."
2601203-62 = "Это необходимо, чтобы повысить шансы на выживание!"
2601203-63 = "[s] «Это же тренировка! Нельзя просто сделать вид, что мы его используем?»"
2601203-64 = "Согласно инструкции, чем реалистичнее тренировка, тем выше наши шансы победить в настоящей ситуации."
2601203-65 = "Так что, пожалуйста, лежите спокойно. Учебные манекены не должны двигаться!"
2601203-66 = "[s9] «Н-Не стоит НАСТОЛЬКО зацикливаться на инструкции!»\n[s10] «„Победить“? Мы вообще с кем сражаемся?!»"
2601203-69 = "...Хорошо. Если вы настаиваете, Сенсей, этот этап придётся пропустить."
2601203-70 = "В инструкции сказано, что после применения AED следующий шаг — это..."
2601203-71 = ""
2601203-73 = ""
2601203-74 = ""
2601203-75 = "Ох. З-Знаете, думаю, вы правы насчёт того, что не стоит слишком буквально следовать инструкции."
2601203-76 = "Во время тренировки ведь нельзя делать В ТОЧНОСТИ то же, что и в настоящей чрезвычайной ситуации."
2601203-77 = "Н-Не то чтобы я... я не хотела делать эту часть с вами, Сенсей... просто мне кажется, для этого ещё немного рано...!"
2601203-78 = "[s] «Тебе только сейчас так показалось?!»"
2601203-79 = "Да. Да, точно..."
2601203-80 = "Я лучше схожу за учебным манекеном."
2601203-81 = "Спасибо, что хотя бы ненадолго заменили его."
2601203-82 = ""
2601203-84 = ""
2601203-85 = "[ns11] «...»\n[ns12] «(Хм, она уронила инструкцию...)»"
2601203-91 = "Согласно инструкции, после использования AED следующим шагом идёт искусственное дыхание рот в рот."
