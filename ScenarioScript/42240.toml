[translation]
42240-1 = "Episódio 24;Epílogo"
42240-2 = "Escola Kronos, Estúdio Compartilhado Nº 7"
42240-4 = "Olá a todos que estão assistindo ao canal!#nEu sou Mai Kazamaki, do Clube de Jornalismo de Kronos!"
42240-5 = "Hoje, no canal \"Análise de Atualidades de Mai Kazamaki\", vamos cobrir em detalhes a recente troca da Presidente Interina do Conselho Estudantil Geral e a tentativa de atentado a bomba na Estação Kousagi."
42240-6 = "Como todos os cidadãos já sabem, após o pronunciamento de emergência outro dia, a Administradora-Chefe Rin Nanagami perdeu o cargo, e Kaya Shiranui, então Chefe do Gabinete de Defesa, assumiu como nova Presidente Interina do Conselho Estudantil Geral."
42240-7 = "A Chefe Kaya virou alvo de polêmica logo após a posse por conta de várias ordens executivas incoerentes — e depois, ao ser descoberto que ela havia orquestrado o atentado terrorista na Estação Kousagi, passou por um julgamento de impeachment — e foi formalmente indiciada."
42240-8 = "Em relação a esse caso, veio à tona que a \"Kaiser Security\", subsidiária da \"Kaiser Corporation\", recebeu propinas milionárias da Chefe Kaya, colocando o Grupo Kaiser mais uma vez no centro das controvérsias."
42240-9 = "No entanto, o representante do Grupo Kaiser divulgou uma nota afirmando que \"não passou de uma ação isolada de executivos da subsidiária, sem relação alguma com as diretrizes da matriz\"."
42240-10 = "Apesar de o incidente ter tomado proporções gigantescas, o Conselho Estudantil Geral não deu uma resposta clara, o que levantou diversas suspeitas."
42240-11 = "Hoje, no canal \"Análise de Atualidades de Mai Kazamaki\", convidamos um especialista em atualidades para explicar todas essas suspeitas de forma bem clara!"
42240-12 = "Especialista em atualidades — Sr. Descartes, com a palavra!"
42240-19 = "Saudações. Eu sou Descartes, o especialista em atualidades mais rápido do D.U. e líder da \"Associação em Busca da Felicidade Verdadeira Sem Posses\"... ou simplesmente \"AFVSP\"!"
42240-20 = "O-Olá, Sr. Descartes."
42240-21 = "Nossa... que nome impressionante para uma associação."
42240-22 = "Ah, você tem interesse em nossas atividades?"
42240-23 = "Nós somos especialistas e a \"Associação em Busca da Felicidade Verdadeira Sem Posses\", ou \"AFVSP\", é..."
42240-24 = "Não, não precisa explicar, obrigada."
42240-25 = "Hoje gostaríamos de ouvir sua opinião sobre as diversas suspeitas envolvendo o Conselho Estudantil Geral."
42240-26 = "Tsc..."
42240-27 = "Primeira pergunta!"
42240-28 = "Presa sob suspeita de corrupção e insurreição, a Chefe do Gabinete de Defesa Kaya nega veementemente que esses crimes tenham sido por interesse próprio."
42240-29 = "Mesmo enquanto era transferida para o Departamento Correcional, a Chefe Kaya continuava repetindo: \"Quando um verdadeiro super-humano aparecer, até ignorantes como vocês compreenderão a minha vontade\"."
42240-30 = "Afinal, a quem esse \"super-humano\" se refere?#nAo Sensei de Schale...? Ou à Presidente do Conselho Estudantil Geral...?"
42240-31 = "Ou será que... existe algum segredo ainda não revelado?!"
42240-33 = "...Claro que não, né?"
42240-34 = "Se existisse alguém capaz de manipular a Chefe do Gabinete de Defesa, nem precisaria recorrer a algo tão trabalhoso quanto um golpe de Estado."
42240-35 = "Isso não passa de choro de perdedora, nem vale a pena dar ouvidos."
42240-37 = "S-Será mesmo...?"
42240-38 = "Vamos à próxima pergunta."
42240-39 = "Quando a Chefe Kaya foi presa, alguns cidadãos relataram ter visto, além dos executivos da \"Kaiser Security\", várias alunas de uniforme marinheiro sendo escoltadas juntas."
42240-40 = "Ainda não se sabe a identidade dessas alunas de uniforme marinheiro nem a qual academia pertencem."
42240-41 = "Segundo rumores — elas seriam integrantes da desativada Academia Especial SRT —"
42240-43 = "— Como assim?! Claro que não!!"
42240-48 = "P-Por que ficou tão bravo de repente?"
42240-49 = "As integrantes da Academia Especial SRT são alunas corajosas que arriscaram a vida lutando pela justiça!"
42240-50 = "Colocar alunas assim no mesmo saco que os culpados pelo incidente... que absurdo!"
42240-51 = "Não posso entrar em detalhes, mas dizer que essas alunas eram da Academia Especial SRT é pura fake news!"
42240-52 = "Juro pela minha marmita de yakiniku vencida!"
42240-54 = "(...Isso não significa que ele não tem certeza nenhuma?)"
42240-58 = "Entendi. Então, por último..."
42240-59 = "Qual foi exatamente o objetivo da Chefe Kaya ao chamar o Sensei de Schale no dia em que fez o pronunciamento de emergência?"
42240-60 = "Pelo fato de ter feito a convocação em canal aberto, não parecia ter intenção de esconder a relação com o Sensei..."
42240-61 = "Será que a Chefe Kaya pretendia obter de Schale alguma arma ou autoridade capaz de controlar Kivotos à vontade?"
42240-62 = "Ah, isso eu posso responder com absoluta certeza!"
42240-63 = "O que a Chefe Kaya exigiu do Sensei de Schale foi... as marmitas que iam ser descartadas pela loja de conveniência de Schale!"
42240-67 = "As marmitas... que iam ser descartadas...?"
42240-68 = "Exato. A loja de conveniência de Schale recebe poucos clientes para o seu tamanho, então uma quantidade enorme de marmitas acaba sendo descartada todos os dias."
42240-69 = "Qualquer um que visse aquela montanha de marmitas... com certeza ia querer!"
42240-71 = "E podemos deduzir que as negociações de marmitas entre Schale e o Conselho Estudantil Geral fracassaram pelo fato de a loja de conveniência de Schale ter ficado um tempo sem receber entregas de marmitas logo depois!"
42240-73 = "..."
42240-74 = "Mas atenção, pessoal! Existe uma forma fácil de conseguir marmitas descartadas sem precisar negociar com o Conselho Estudantil Geral!"
42240-75 = "Se você se filiar à \"AFVSP\" agora mesmo, ganha grátis frango frito de carcaça e mais uma marmita de broto de feijão de brinde —"
42240-80 = "Estamos enfrentando instabilidades no sinal. Por favor, aguarde um momento."
42240-81 = "O que vocês estão fazendo?!"
42240-82 = "Como ousam me tratar desse jeito —"
42240-86 = "Pedimos desculpas a todos. Nosso convidado, o especialista em atualidades Sr. Descartes, precisou se ausentar por um compromisso urgente."
42240-87 = "O programa de hoje do canal \"Análise de Atualidades de Mai Kazamaki\" será substituído pela transmissão emergencial de \"O Mistério das Lulas: Os Nutrientes do Mar Falam\"."
42240-88 = "Por favor, não mude de canal...!"
42240-92 = "...De onde será que a Shinon tirou aquele \"especialista em atualidades\"?"
42240-97 = "Departamento Correcional, Prisão Especial, Bloco B, Cela 207"
42240-99 = "...A vida no Departamento Correcional nem é tão ruim quanto eu pensei."
42240-100 = "Acordar na hora certa, cumprir a rotina, treinar o corpo...#nPelo menos nessa parte de viver com disciplina, talvez não seja tão diferente da Academia Especial SRT."
42240-101 = "Mas é uma pena não ter inarizushi no cardápio."
42240-102 = "Ah... que saudade de um inarizushi fresquinho..."
42240-108 = "Detenta número 5021, chegou uma entrega para você."
42240-113 = "...Uma entrega? De quem é?"
42240-114 = "Não sei quem mandou. Veio direto lá de cima."
42240-118 = "Tem uma carta dentro, então dê uma olhada."
42240-122 = "Que estranho... não tem ninguém fora do Departamento Correcional que me mandaria uma carta..."
42240-127 = "...Miyako-chan?"
42240-130 = "Dia XX de X, 04h00. Líder do Esquadrão RABBIT, Miyako Tsukiyuki.#nComo nossa vida no Parque Kousagi se estabilizou, apresento o relatório de situação."
42240-131 = "Todos os membros do Esquadrão RABBIT seguem em serviço sem acidentes ou doenças —"
42240-135 = "...Não, acho melhor escrever de um jeito um pouco menos formal."
42240-136 = "Como a senhora está, senpai? Aqui é a Miyako."
42240-139 = "Naquele dia, depois que toda a operação terminou.#nNós voltamos para o Parque Kousagi."
42240-140 = "Conversamos muito entre nós sobre para onde deveríamos voltar... mas, no fim, só existe este lugar para nós."
42240-141 = "Além da Academia Especial SRT, não há outra academia onde possamos realizar nossos ideais..."
42240-142 = "E enquanto estivermos aqui, a luta pela justiça da SRT vai continuar."
42240-149 = "Depois da prisão da Chefe Kaya, a Administradora-Chefe Rin retomou o cargo de Presidente Interina do Conselho Estudantil Geral."
42240-150 = "Todas as ordens executivas arbitrárias foram revogadas, e a situação do D.U. está voltando ao normal aos poucos."
42240-151 = "Talvez porque a oposição à Administradora Rin tenha diminuído temporariamente, as críticas da opinião pública contra ela parecem ter se acalmado um pouco..."
42240-152 = "Mas Kivotos ainda tem uma montanha de problemas para resolver..."
42240-153 = "Então os dias difíceis da Administradora Rin e dos membros do Conselho Estudantil Geral ainda devem continuar por um bom tempo."
42240-155 = "Por enquanto, ficou decidido que o fato de termos neutralizado vocês e denunciado os crimes da Chefe Kaya não será divulgado ao público."
42240-156 = "O próprio Conselho Estudantil Geral não poderia admitir oficialmente que recebeu apoio da Academia Especial SRT, que eles mesmos decidiram fechar..."
42240-157 = "E nós também não queríamos expor a desonra das nossas senpais."
42240-159 = "Por isso, pedimos que todo o crédito oficial pela resolução do incidente fosse atribuído à Diretora Kanna."
42240-160 = "Graças a isso, a Diretora Kanna e as alunas do Departamento de Segurança Interna puderam voltar ao serviço antes do previsto."
42240-161 = "...Fico aliviada por ver que a decisão dela foi recompensada, mesmo que um pouco."
42240-166 = "A propósito, parece que a Kirino-san, do Departamento de Segurança Pública, ganhou a chance de ser transferida para o Departamento de Segurança por causa dos méritos nessa operação... mas, por algum motivo, ela recusou."
42240-167 = "Será que ela percebeu algo importante naquela última batalha?"
42240-169 = "Quanto ao Esquadrão RABBIT... não chega a ser uma recompensa, mas recebemos permissão oficial do Conselho Estudantil Geral para continuar acampadas aqui no Parque Kousagi."
42240-170 = "Como o parque já ia ser demolido mesmo e a administração de Kousagi Town ficou em aberto, a permissão acabou saindo bem mais fácil do que esperávamos."
42240-171 = "Graças a isso, agora conseguimos lidar com o pessoal da Valkyrie sem tanta tensão."
42240-172 = "Claro, a vida no parque ainda tem muitos inconvenientes, e o [USERNAME] Sensei tem nos ajudado bastante..."
42240-174 = "Schale - Sala de Descanso"
42240-176 = "Aah... que refrescante..."
42240-177 = "Valeu por deixar usar o chuveiro, Sensei."
42240-178 = "Com esse calor todo, ficar acendendo fogo só pra esquentar água do banho dá um trabalhão."
42240-179 = "[s1] \"De nada.\"\n[s2] \"Como eu já disse antes, podem usar o chuveiro de Schale quando quiserem.\""
42240-182 = "Hehe, já que estou aqui, será que posso dar uma olhada na geladeira também...?"
42240-189 = "Sensei, trouxe o resultado da análise balística do local do incidente que você pediu outro dia..."
42240-193 = "Moe, você... que roupa é essa?"
42240-194 = "Não me diga que você usou o chuveiro de Schale sozinha?"
42240-195 = "Ah, bem, é que..."
42240-196 = "Ontem à noite o ventilador da minha barraca quebrou, e eu estava derretendo de suor..."
42240-197 = "Se refrescar em Schale sozinha sem avisar ninguém..."
42240-198 = "...Sua traidora!"
42240-199 = "[s3] \"Ah, verdade. Saki.\"\n[s4] \"Comprei o xampu com aquele cheiro que você pediu outro dia.\""
42240-204 = "O-Obrigada... quebrou um galho."
42240-209 = "...Espera aí, Saki. Você também estava vindo aqui?"
42240-210 = "Ora, ora, quem é a traidora agora, hein?"
42240-211 = "I-Isso é, quer dizer..."
42240-212 = "Outro dia, durante o meu plantão em Schale, meu capacete abafou demais e eu só lavei o cabelo...!"
42240-213 = "Eu não tomei um banho completo que nem certa pessoa!"
42240-214 = "Se usou o chuveiro, dá na mesma!"
42240-222 = "Bom dia, Sensei."
42240-223 = "Acabei suando na operação da manhã... será que eu poderia usar o chuveiro...?"
42240-227 = "Ué...? Saki e... Moe...?"
42240-235 = "Miyako?!"
42240-242 = "Acho que vai levar um tempinho até nos acostumarmos, mas tenho certeza de que vamos conseguir conviver bem juntas."
42240-243 = "...Afinal, nós temos um apoio muito confiável: o [USERNAME] Sensei."
42240-245 = "Normalmente seria difícil por conta das regras do Departamento Correcional, mas pedi um favor especial ao Sensei para enviar esta pequena lembrança."
42240-246 = "É só uma marmita de loja de conveniência que nem se compara ao inarizushi caseiro da Niko-senpai, mas é tudo o que conseguimos preparar no momento."
42240-247 = "Este é o fim do relatório. Por favor, cuide-se bem."
42240-248 = "Atenciosamente, Miyako Tsukiyuki, Líder do Esquadrão RABBIT."
42240-253 = "Ahaha... mandar uma marmita de loja de conveniência como primeiro presente para a sua senpai."
42240-254 = "Isso já é um pouco demais, Miyako-chan..."
42240-258 = "...Mas que bom que você parece estar bem."
42240-265 = "Corrida da manhã, concluída...!"
42240-266 = "Parece que meu condicionamento caiu bastante.#nJá estou acabada só com a corrida..."
42240-267 = "Ué? Isso aí não é... inarizushi?"
42240-268 = "Uau, esse cheirinho... faz tanto tempo que eu não sinto que dá até vontade de chorar..."
42240-269 = "A gente... pode comer isso?"
42240-271 = "Sim, a gente ganhou de presente."
42240-272 = "Vamos chamar a Yukino-chan também e comer todas juntas."
42240-273 = "Ebaaa!"
42240-275 = "Mas marmita de loja de conveniência no Departamento Correcional... que raro, hein."
42240-276 = "Quem mandou esse inarizushi?"
42240-278 = "Hmm, deixa eu ver... como eu poderia dizer... se fosse para descrever..."
42240-285 = "— Acho que é um presente do \"amanhã\"."
