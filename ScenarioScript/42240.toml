[translation]
42240-1 = "Эпизод 24; Эпилог"
42240-2 = "Школа «Кронос», Общественная студия 7"
42240-4 = "Добрый вечер! С вами Казамаки Май из Школы журналистики «Кронос»!"
42240-5 = "Сегодня в «Актуальных событиях Казамаки» мы обсуждаем перестановки в офисе президента Генерального студенческого совета и подлый заговор по уничтожению станции Коусаги."
42240-6 = "Как вы все прекрасно знаете, недавно глава обороны Ширануи Кая в ходе шокирующего переворота сместила главного администратора Нанагами Рин с поста исполняющей обязанности президента Генерального студенческого совета, перевернув Кивотос с ног на голову!"
42240-7 = "Однако продержалась она недолго! Недовольство общества росло из-за жёстких правил и ещё более жёстких ограничений. Всё завершилось импичментом, когда выяснилось, что именно она стояла за террористическим заговором на станции Коусаги!"
42240-8 = "Представьте шок всего мира! А дальше стало только хуже: расследование вывело на службу безопасности «Кайзера», подразделение корпорации «Кайзер». Похоже, они приняли от Каи огромные взятки, вновь поставив корпорацию в центр скандала!"
42240-9 = "Однако Кайзер Group утверждает, что это самовольный поступок одного руководителя и компания к нему отношения не имеет. Они решительно осудили поведение этого сотрудника!"
42240-10 = "Но несмотря на то, что масштаб скандала растёт каждый день, от Генерального студенческого совета — абсолютная тишина! Может ли общество вообще ещё доверять этому Совету?"
42240-11 = "Чтобы подробнее обсудить эту крайне серьёзную тему, сегодня к нам присоединился..."
42240-12 = "...наш эксперт по текущим событиям, Декарт!"
42240-13 = ""
42240-15 = ""
42240-18 = ""
42240-19 = "Здравствуйте. Я Декарт, ведущий эксперт по актуальным событиям и глава Искателей счастья в нестяжательстве, или просто Искателей!"
42240-20 = "Здравствуйте и добро пожаловать, Декарт."
42240-21 = "Похоже, вы возглавляете весьма эксцентричную группу."
42240-22 = "О! Хотите присоединиться?"
42240-23 = "Мы, Искатели счастья в нестяжательстве, или просто Искатели, —"
42240-24 = "Мы с удовольствием послушаем об этом в другой раз, но сегодня у нас куда более срочный вопрос!"
42240-25 = "Мы пригласили вас, чтобы расспросить о различных проблемах вокруг Генерального студенческого совета."
42240-26 = "Ц."
42240-27 = "Первый вопрос!"
42240-28 = "После ареста глава обороны Кая упорно отрицает все обвинения в злоупотреблении должностью ради личной выгоды."
42240-29 = "Более того, когда её перевозили в Исправительное бюро, она заявила: «Когда появится настоящий сверхчеловек, вы, невежественные массы, наконец всё поймёте!»"
42240-30 = "Кто или что за сверхчеловек, о котором она говорила? Сенсей из Шале...? Или, возможно, предыдущий президент Генерального студенческого совета?"
42240-31 = "А если нет, как вы думаете, был ли в её словах какой-то иной смысл?!"
42240-33 = "...Конечно нет."
42240-34 = "Если бы действительно существовал какой-то сверхчеловек, способный контролировать Совет и всех остальных, Кае не пришлось бы опускаться до таких мутных дел ради желаемого."
42240-35 = "Это не более чем безумные вопли проигравшей. Я бы не искал в её словах никакого смысла."
42240-37 = "П-Понятно..."
42240-38 = "Тогда следующий вопрос!"
42240-39 = "Во время ареста главы Каи видели студентов в незнакомой форме, которых задержали и увели под конвоем."
42240-40 = "Несмотря на шквал вопросов и слухов, личности этих студентов так и не были подтверждены."
42240-41 = "Некоторые слухи даже утверждают, что они могут быть из расформированной академии SRT—"
42240-43 = "Полная чушь!"
42240-44 = ""
42240-47 = ""
42240-48 = "П-Почему вы так считаете?"
42240-49 = "Студенты академии SRT — те самые храбрецы, что сражались вместе с угнетёнными, когда мы восстали против коррупции «Кайзера»!"
42240-50 = "Абсурдно думать, что такие отважные ученики могут быть связаны с подобным скандалом!"
42240-51 = "Я не могу раскрыть источники, но уверенно заявляю: слухи о том, что они из академии SRT, совершенно беспочвенны!"
42240-52 = "Готов поставить на это своё просроченное бенто с якинику!"
42240-54 = "(...Если ставить на кон что-то настолько мерзкое, кажется, будто вы вообще не уверены...)"
42240-55 = ""
42240-57 = ""
42240-58 = "Пожалуй, от такого приза мы откажемся! Ха-ха! И наш последний вопрос..."
42240-59 = "Зачем глава Кая вызвала Сенсея из Шале во время своего публичного обращения?"
42240-60 = "Поскольку это было сделано через общедоступную трансляцию, очевидно, глава Кая не собиралась скрывать свою связь с учителем..."
42240-61 = "Хотела ли она взять Шале под контроль и усилить своё влияние на Кивотос?"
42240-62 = "А, это просто!"
42240-63 = "Скорее всего, глава Кая хотела от Сенсея... просроченные бенто, которые забрали из магазина Шале!"
42240-64 = ""
42240-66 = ""
42240-67 = "Просроченные... бенто...?"
42240-68 = "Именно. При такой низкой посещаемости магазина остатки неизбежны."
42240-69 = "У любого наблюдателя потекли бы слюнки при виде гор и гор просроченных бенто!"
42240-71 = "Именно поэтому во время правления Каи поставки бенто в магазин Шале были заблокированы! Переговоры о бенто наверняка сорвались."
42240-73 = "..."
42240-74 = "Но, граждане, не тревожьтесь! Получить эти обеды можно и без всяких сделок с Генеральным студенческим советом!"
42240-75 = "Вступив в Искатели, вы бесплатно получите карааге из куриной косточки и бенто с ростками маша!"
42240-76 = ""
42240-80 = "Простите, друзья! Похоже, небольшая техническая неполадка. Мы скоро вернёмся."
42240-81 = "Что вы со мной делаете?!"
42240-82 = "Как вы смеете так со мной обращаться?! Я подам в суд—"
42240-83 = ""
42240-86 = "Простите, друзья. Похоже, наш эксперт по текущим событиям Декарт внезапно оказался занят срочными делами."
42240-87 = "Оставшуюся часть сегодняшнего анализа событий от Казамаки Май заменит «Мой кальмарчик-Сенсей»!"
42240-88 = "Не переключайтесь!"
42240-89 = ""
42240-91 = ""
42240-92 = "Где вообще Шинон нашла этого типа?"
42240-97 = "Исправительное бюро, специальный лагерь, крыло B, блок 207"
42240-99 = "...Знаете, жизнь здесь совсем не такая плохая, как я ожидала."
42240-100 = "Не так уж отличается от академии SRT. Подъём по расписанию, упражнения, строгий распорядок..."
42240-101 = "Единственный недостаток — за едой не дают инаризуси."
42240-102 = "Ох... Только прошлой ночью мне приснились горячие, только что приготовленные инаризуси..."
42240-103 = ""
42240-107 = ""
42240-108 = "Заключённая 5021. Для вас особый обед."
42240-109 = ""
42240-112 = ""
42240-113 = "...Особый обед? В каком смысле?"
42240-114 = "Подарок от анонимного отправителя. Должно быть, кто-то довольно высокопоставленный."
42240-115 = ""
42240-117 = ""
42240-118 = "Тебе ещё и письмо оставили."
42240-119 = ""
42240-121 = ""
42240-122 = "Странно. Никто снаружи не стал бы писать мне..."
42240-123 = ""
42240-125 = ""
42240-126 = ""
42240-127 = "...Мияко?"
42240-130 = "00/00, 04:00. Командир отряда RABBIT Цукиюки Мияко. Немного запоздалый, но всё же доклад! Жизнь в парке Коусаги вернулась в норму."
42240-131 = "Отряд RABBIT действует в полном составе, травм и исключений нет..."
42240-132 = ""
42240-135 = "...Звучит невероятно официально, да?"
42240-136 = "Я не так хотела с тобой разговаривать. Привет. Это Мияко."
42240-139 = "После окончания операции мы снова живём в парке Коусаги."
42240-140 = "Мы с отрядом немного спорили, что делать дальше, но в итоге этот парк теперь наш дом."
42240-141 = "Единственная академия, которая разделяет наши идеалы правосудия, — академия SRT..."
42240-142 = "Так что мы останемся здесь и продолжим сражаться за SRT как умеем."
42240-148 = ""
42240-149 = "После ареста Каи администратор Рин снова заняла пост исполняющей обязанности президента Генерального студенческого совета."
42240-150 = "Все жёсткие приказы Каи отменили, и в D.U. наконец снова начинает становиться нормально."
42240-151 = "Сейчас у администратора Рин большой запас доверия общества, поэтому всё относительно спокойно."
42240-152 = "Хотя почему-то кажется, что конфликты и проблемы в Кивотосе вообще никогда не заканчиваются."
42240-153 = "Уверена, Рин и остальные ближайшие пару месяцев будут очень-очень заняты."
42240-155 = "Мы скрыли твою причастность к преступлениям Каи. Об этом знает только Генеральный студенческий совет."
42240-156 = "Признать, что Генеральный студенческий совет обратился за помощью к академии SRT — той самой, которую сам закрыл, — было бы неудобно, поэтому они согласились сотрудничать."
42240-157 = "И мы не хотели рассказывать миру вместо тебя. Я подумала, что ты сама сделаешь это, когда будешь готова."
42240-158 = ""
42240-159 = "Директору Канне официально приписали заслугу в возвращении мира Кивотосу."
42240-160 = "Благодаря этому она и студенты Бюро общественного порядка вернулись к обязанностям быстрее, чем ожидалось."
42240-161 = "Я была рада увидеть, что её преданность тому, что она считала правильным, в итоге была вознаграждена."
42240-162 = ""
42240-164 = ""
42240-165 = ""
42240-166 = "Слышала, Кирино из Бюро общественной безопасности за её роль во всём этом предложили место в Бюро общественного порядка... но она неожиданно отказалась."
42240-167 = "Может, озарение на поле боя?"
42240-169 = "Что касается отряда RABBIT... Генеральный студенческий совет наконец официально разрешил нам оставаться в парке Коусаги."
42240-170 = "Для Совета это решение стало проще, поскольку развитие города Коусаги, очевидно, больше не планируется."
42240-171 = "И это очень здорово! Теперь мы даже можем встречаться со студентами «Валькирии» и свободнее передвигаться."
42240-172 = "Жизнь в парке определённо была не самым простым вариантом... Но [USERNAME] Сенсей очень помог сделать её возможной!"
42240-174 = "Гостиная Шале"
42240-176 = "Я уже так давно не могла нормально принять душ."
42240-177 = "Спасибо, что позволяете нам пользоваться удобствами Шале, Сенсей."
42240-178 = "Ванны из бочек бывают весёлыми, но иногда это ужасная морока, когда просто хочется расслабиться!"
42240-179 = "[s1] «В любое время.»\n[s2] «Как я уже говорил, пользуйтесь когда захотите.»"
42240-182 = "Хи-хи, раз уж заговорили о гостеприимстве, тогда я пойду разграблю холодильник..."
42240-183 = ""
42240-188 = ""
42240-189 = "Сенсей, я принесла баллистический анализ с места происшествия, о котором вы просили..."
42240-190 = ""
42240-192 = ""
42240-193 = "Моэ... Почему ты так выглядишь?"
42240-194 = "Не может быть... Неужели ты тайком пришла сюда и одна воспользовалась душем Шале?!"
42240-195 = "Эм..."
42240-196 = "У меня вчера сломался вентилятор в палатке, и я ужасно вспотела, так что..."
42240-197 = "Ты пришла и помылась без нас!"
42240-198 = "Предательница!"
42240-199 = "[s3] «Саки, шампунь, который ты хотела, только что привезли.»\n[s4] «Я взял шампунь с тем ароматом, который тебе хотелось.»"
42240-200 = ""
42240-201 = ""
42240-203 = ""
42240-204 = "Правда? Спасибо!"
42240-205 = ""
42240-207 = ""
42240-209 = "...Постой, ты тоже здесь моешься?"
42240-210 = "И кто теперь предательница, а?"
42240-211 = "Я-Я просто!"
42240-212 = "Под шлемом иногда ужасно потею! Я была на дежурстве в Шале, что мне ещё было делать?!"
42240-213 = "И я только волосы помыла! Не пользовалась всем душем, в отличие от кое-кого!"
42240-214 = "Неважно, какой частью душа ты пользовалась! Половиной пользоваться — это всё равно пользоваться!"
42240-215 = ""
42240-221 = ""
42240-222 = "Доброе утро, Сенсей."
42240-223 = "Можно воспользоваться душем? Сегодня на утреннем патруле было очень жарко..."
42240-224 = ""
42240-226 = ""
42240-227 = "А...? Саки? Моэ?"
42240-228 = ""
42240-231 = ""
42240-232 = ""
42240-234 = ""
42240-235 = "Мияко!"
42240-236 = ""
42240-242 = "...Ну, думаю, чтобы привыкнуть, понадобится немного времени."
42240-243 = "Но пока [USERNAME] Сенсей на нашей стороне, думаю, всё будет хорошо."
42240-245 = "Нам пришлось немного схитрить, чтобы не нарушить правила Исправительного бюро, но мы приготовили для тебя небольшой обед."
42240-246 = "Это не домашняя еда Нико, но максимум, что мы могли сделать, — купить инаризуси в магазине."
42240-247 = "На этом мой доклад окончен. Надеюсь, у тебя всё хорошо."
42240-248 = "Цукиюки Мияко, командир отряда RABBIT."
42240-249 = ""
42240-251 = ""
42240-252 = ""
42240-253 = "Наконец-то я получаю подарок от своих очаровательных младших — и это бенто из круглосуточного магазина?"
42240-254 = "Хотя это очень в стиле Мияко."
42240-255 = ""
42240-257 = ""
42240-258 = "...Рада слышать, что у них всё хорошо."
42240-259 = ""
42240-264 = ""
42240-265 = "Я только что закончила утреннюю пробежку."
42240-266 = "Я тоже! Но кажется, выносливость уже падает... Эта пробежка меня вымотала."
42240-267 = "Постой. Это что... инаризуси?"
42240-268 = "Запах... Божественный! Я... я сейчас расплачусь."
42240-269 = "Мы... Это... отравлено?"
42240-271 = "Конечно нет. Это подарок."
42240-272 = "Позови остальных, поделимся."
42240-273 = "Сделаем это!"
42240-275 = "Какая редкая роскошь в Исправительном бюро..."
42240-276 = "И кто вообще тебе это прислал?"
42240-278 = "Хм, кто же?"
42240-279 = ""
42240-281 = ""
42240-282 = ""
42240-285 = "Скажем так, это подарок от моего завтра..."
