[translation]
10003010-1 = "Эпизод 1;Это не то...?"
10003010-8 = "Члены Дисциплинарного комитета собрались в отеле для тренировочного лагеря."
10003010-11 = "Шевелитесь! Комитет миссий и Разведывательный комитет, перенесите всё на пятый этаж! Там будет наш штаб!"
10003010-12 = "Быстрее! До начала тренировок осталось мало времени!"
10003010-13 = "Есть, госпожа!"
10003010-14 = "Комитет снабжения, поторопитесь с припасами! И Медицинский комитет должен подготовить список—"
10003010-15 = "Это понадобится немедленно. Поставьте вон там, в тренировочной зоне."
10003010-16 = "Поняла!"
10003010-20 = "[ns] «Похоже, они привыкли выполнять приказы.»"
10003010-21 = "Конечно. Они члены Дисциплинарного комитета. Как они смогут защищать порядок Геенны, если не умеют выполнять приказы?"
10003010-22 = "Мы регулярно проводим такие учебные сборы, хотя и не каждый месяц."
10003010-23 = "Но этот ощущается совсем не так, как остальные..."
10003010-24 = ""
10003010-25 = ""
10003010-27 = "Вот вы где. Временный штаб уже готов. Соберёмся там."
10003010-29 = "Штаб летнего лагеря"
10003010-30 = "Как идут приготовления?"
10003010-31 = "Пока всё хорошо. Те, кто закончил работу, отдыхают в своих комнатах."
10003010-32 = "Медицинский комитет тоже почти закончил подготовку."
10003010-33 = "Значит, всё идёт гладко. Отлично."
10003010-34 = "Подведём итог: для тренировок мы привезли на пляж Араба ровно 100 членов Дисциплинарного комитета."
10003010-35 = "[s] «Есть особая причина, почему вы выбрали именно это место?»"
10003010-36 = "Да. Это пляж Араба — одно из самых тихих мест в районе Геенны."
10003010-37 = "За последний год здесь зарегистрировали меньше 100 преступлений, и даже они были мелкими: побег из пляжной закусочной без оплаты, нарушение тишины, строительство без разрешения и тому подобное."
10003010-38 = "[s] «По-моему, звучит шумно.»"
10003010-39 = "Да бросьте. По сравнению с остальным районом это детские шалости."
10003010-40 = "В любом случае, мне нужно было тихое место для лагеря. Не будем забывать настоящую причину."
10003010-41 = "Разумеется, мы должны устроить нашей президентке отпуск!"
10003010-42 = "Что до остальных членов, с их тренировками я вполне справлюсь сама."
10003010-43 = "Похоже на то."
10003010-44 = "Раз ты настаиваешь, Ако."
10003010-45 = "Почему такая неохота, Иори? И вообще, почему ты уже в купальнике? Надеюсь, ты не собиралась уклоняться от обязанностей в этой поездке."
10003010-46 = "А?"
10003010-47 = "[s1] «Я как раз хотел кое-что сказать.»\n[s2] «Тебе очень идёт, Иори.»"
10003010-48 = "...?!"
10003010-49 = "...?!"
10003010-50 = "Я-я надела его только потому, что тренировки проходят на пляже. Я старалась одеться по обстановке!"
10003010-51 = "Если бы я была в форме, то выделялась бы среди обычных посетителей пляжа. Это могло бы привлечь нежелательное внимание нарушителей."
10003010-52 = "[s] «Мне кажется, внимания ты и так привлечёшь достаточно.»"
10003010-53 = "Хватит болтовни! Мы здесь не для того, чтобы кто-то из ВАС отдыхал!"
10003010-54 = "Я же сказала, что не поэтому надела это, Ако!"
10003010-55 = "Всё это ради Хины, а наша задача — лишь убедиться, что она сможет отдохнуть и хорошо провести время! Больше ни о чём вам беспокоиться не нужно!"
10003010-56 = "Так что будь хорошей маленькой шестерёнкой и дай нашей президентке отдохнуть, ладно?"
10003010-57 = "Ладно, ладно. Я поняла..."
10003010-58 = "(Я так и думала, что всё будет именно так. Поэтому даже не стала брать купальник.)"
10003010-60 = "Я ясно выражаюсь? Ни единого намёка на проблемы не должно дойти до ушей главного префекта!"
10003010-61 = "[s] «Кстати, а где вообще Хина?»"
10003010-62 = "Она в своём гостиничном номере наслаждается четырёхчасовым перерывом для отдыха и расслабления."
10003010-63 = "Целых четыре часа?"
10003010-64 = "Да. Тем временем остальные члены пройдут тактическую тренировку, а затем лёгкую пробежку. К тому времени я собиралась позвать её вниз."
10003010-65 = "Но это будет лишь формальностью. На самом деле ей нужно просто слегка прогуляться по пляжу."
10003010-66 = "И она на это согласилась?"
10003010-67 = "Мне удалось убедить её, что ходьба тоже считается тренировкой. До того времени надо подготовить пляж. Я хочу, чтобы он был настолько чистым, что с него можно было есть."
10003010-68 = "Можно попытаться, но не думаю, что это будет легко."
10003010-69 = "У меня вопрос, старший администратор."
10003010-70 = "Да? Что такое, Чинацу?"
10003010-71 = "Насчёт пляжа. Здесь тихо — слишком тихо."
10003010-72 = "Мы были готовы принимать просьбы от отеля или других гостей, но ничего подобного не было. Вы знаете почему?"
10003010-73 = "Разве это не просто совпадение? Кроме чистого везения, я не вижу причины, почему с нашего приезда ничего не случилось."
10003010-74 = "Может быть, но, пожалуйста, не сглазь."
10003010-75 = "Ты сама это подняла..."
10003010-76 = ""
10003010-78 = "О? Это мне."
10003010-79 = ""
10003010-80 = ""
10003010-81 = "Да, это Ако. Чем могу помочь?"
10003010-82 = "Старший администратор, мы на рынке рядом с отелем покупаем припасы, но все магазины закрыты. Что нам делать?"
10003010-83 = "Закрыты? Вы уверены, что не ошиблись?"
10003010-84 = ""
10003010-86 = "Извините. Это управляющий отелем. Можно войти на минутку?"
10003010-87 = "Да, открыто. Что случилось?"
10003010-88 = ""
10003010-89 = ""
10003010-91 = "А-а, я думал, что на стойке регистрации ошиблись, но вы и правда Дисциплинарный комитет академии Геенна!"
10003010-92 = "Да, и? Что с того?"
10003010-93 = "Мне уже не нравится, к чему всё идёт."
10003010-94 = "Разве вы не прибыли в ответ на нашу просьбу о помощи...?"
10003010-95 = "[s] «Я ничего не понимаю. Можно с самого начала?»"
10003010-96 = "*вздох* Здесь полный хаос. Та Банда в шлемах из трущоб и пляжные хулиганы, появившиеся из ниоткуда, воюют друг с другом!"
10003010-97 = "Сначала это были мелкие стычки, но конфликт становится всё серьёзнее. Теперь они собираются устроить настоящую войну, чтобы решить, чья это территория!"
10003010-98 = "Настоящую войну...?"
10003010-99 = "Слухи уже разошлись по сети, и люди делают ставки на победителя! Местные торговцы закрыли лавки и в страхе разбежались!"
10003010-100 = "Если так продолжится, они уничтожат не только друг друга. Они разнесут весь район, включая отель и местные магазины!"
10003010-101 = "И это сразу после того, как мы закончили ремонт и даже добавили горячий источник..."
10003010-102 = "Но надежда ещё есть! Теперь, когда Дисциплинарный комитет здесь, вы ведь остановите тотальную войну, которая начнётся через четыре часа?!"
10003010-103 = ""
10003010-104 = ""
10003010-106 = ""
10003010-107 = ""
10003010-108 = ""
10003010-109 = ""
10003010-110 = "ЧЕРЕЗ ЧЕТЫРЕ ЧАСА?!"
10003010-111 = "[s3] «Какое совпадение.»\n[s4] «Ну вот, сглазила, Иори.»"
10003010-112 = "Только не намекай, что это МОЯ вина!"
10003010-113 = "Только не намекай, что это МОЯ вина!"
10003010-114 = "П-Подождите минутку. Вы хотите сказать, что сегодня начнётся крупномасштабный конфликт?!"
10003010-115 = "Что за дела, Ако?! Ты же говорила, что это самый тихий пляж во всей Геенне?!"
10003010-116 = "Так говорили все данные!"
10003010-117 = "Она права. Я только что сама проверила."
10003010-118 = "Я также могу подтвердить слова управляющего. По сообщениям в соцсетях, крупная битва должна начаться здесь в течение ближайших четырёх часов."
10003010-119 = ""
10003010-120 = "GehEricha0201: Разве не говорили, что это сегодня?"
10003010-121 = "#Nyanko&: та битва между шлемогангстерами и теми хулиганами???"
10003010-122 = "akusi-girl: я всё лето этого ждала лол"
10003010-123 = "EATorDIEOfficial: Для нас это тоже может быть хорошей возможностью."
10003010-124 = "И ещё несколько похожих комментариев. В сети всё уже вышло из-под контроля."
10003010-125 = "Ты издеваешься!"
10003010-126 = ""
10003010-128 = "О нет. Должно быть, это президент."
10003010-129 = ""
10003010-131 = "Ако. Меня кое-что беспокоит в расписании лагеря. Почему мне предписано оставаться в комнате следующие четыре часа? Я хочу кое-что обсудить, так что приходи немедленно."
10003010-132 = ""
10003010-134 = "И ей нужно было позвонить именно сейчас?!"
10003010-135 = "Мы приехали тренироваться, а ты заставила её первые четыре часа сидеть в комнате. Конечно, ей это показалось подозрительным."
10003010-136 = ""
10003010-137 = ""
10003010-138 = "Опять?! Кто на этот раз?!"
10003010-139 = "Общество Пандемониума?!"
10003010-140 = ""
10003010-142 = "Это старший администратор Ако? Мы нашли несколько ошибок в документах, которые вы прислали. Хотели бы встретиться и всё уточнить."
10003010-143 = "Сейчас? Это не может подождать?!"
10003010-144 = ""
10003010-146 = "О нет..."
10003010-147 = ""
10003010-148 = ""
10003010-152 = "Срочное сообщение, старший администратор Ако!"
10003010-153 = "Неизвестная группа хулиганов и небольшой отряд Банды в шлемах начали драку на пляже. Нам нужно немедленно вмешаться!"
10003010-159 = "С сегодняшнего дня это наша территория! Зачем ждать ещё четыре часа?! Вышвырнем этих неудачниц в шлемах ПРЯМО СЕЙЧАС!"
10003010-160 = "Знайте своё место! Думаете, мы просто позволим каким-то пляжным бродягам захватить нашу территорию?!"
10003010-161 = ""
10003010-162 = ""
10003010-163 = ""
10003010-164 = ""
10003010-166 = "Ч-Что случилось...?"
10003010-167 = "Где ты, Ако? И ещё — я только что слышала стрельбу снаружи. План тренировок перенесли на более раннее время?"
10003010-168 = "А-Ако, что нам делать?"
10003010-169 = "Всё становится только хуже. Каковы ваши приказы, старший администратор?"
10003010-170 = ""
10003010-171 = ""
10003010-172 = ""
10003010-173 = ""
10003010-174 = ""
10003010-175 = "Ладно!"
10003010-177 = "*вдох*... *выдох*..."
10003010-178 = "Всё будет хорошо."
10003010-179 = "[ns] «Ако?»"
10003010-180 = "Ну давайте! Думаете, я не справлюсь с парой проблем?!"
10003010-181 = "Первое! Сенсей, идите к Хине и скажите ей, что всё в порядке. Скажите, что тренировки идут по плану."
10003010-182 = "Если она начнёт задавать вопросы, скажите, что ей пока просто не назначили заданий."
10003010-183 = "И самое главное: ни при каких обстоятельствах президент не должна покидать свою комнату. Я ясно выразилась?!"
10003010-184 = "[s] «П-понял.»"
10003010-185 = "Иори, Чинацу. Возьмите наших людей, идите на пляж и прекратите драку."
10003010-186 = "Е-Есть!"
10003010-187 = "Поняла."
10003010-188 = "У меня нет выбора — придётся пока вернуться в кампус и встретиться с этими вредителями из Общества Пандемониума. Мы в сложной ситуации, но не забывайте нашу главную цель."
10003010-189 = "Любой ценой мы должны..."
10003010-190 = "...обеспечить Хине отпуск!"
10003010-191 = "[s] «Д-Да, мэм!»"
