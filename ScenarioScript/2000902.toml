[translation]
2000902-1 = "Зимние каникулы президента"
2000902-2 = ""
2000902-3 = ""
2000902-4 = "Добро пожаловать, товарищ! Я тебя ждала!"
2000902-5 = "[s] «А? Черино, ты одна?»"
2000902-6 = "Ну, дело в том..."
2000902-7 = "Я арендовала весь этот роскошный курорт с горячими источниками, но остальные студенты из секретариата не смогли приехать — слишком заняты."
2000902-8 = "Конечно, искреннее трудолюбие достойно похвалы, но отдых тоже необходим для повышения общей продуктивности. Совсем они недогадливые, правда?"
2000902-9 = "К тому же это мой долгожданный отпуск, а я даже не могу им насладиться, потому что одна в этом огромном курорте."
2000902-10 = "Н-Не то чтобы мне было одиноко или что-то такое!"
2000902-11 = "Лидер, отвечающий за множество людей, должен быть привычен к одиночеству."
2000902-12 = "Я — Великий лидер, уважаемый президент студсовета, Украшатель земель и Главный санитар Красной Зимы... и так далее! Для такой, как я, одиночество ничего не значит!"
2000902-13 = "Но раз уж ты здесь, товарищ, полагаю, я составлю тебе компанию."
2000902-14 = "Хи-хи... Почувствуй себя польщённым, товарищ!"
2000902-15 = "...Итак, что мне делать?"
2000902-16 = "[s] «Почему ты спрашиваешь меня?»"
2000902-18 = "Я понимаю, что я великий президент студсовета, но я никогда не отдыхала на курорте с горячими источниками."
2000902-19 = "Когда курорт построили при Старом институте, я не смогла толком отдохнуть, потому что разбиралась с теми дураками."
2000902-20 = "Так что на этот раз я обязана насладиться всеми приятными вещами, которые обычно мне недоступны!"
2000902-21 = "Итак, товарищ, чем чудесным можно заниматься только на курорте с горячими источниками?"
2000902-22 = "[s] «Может, расслабиться в горячем источнике?»"
2000902-23 = "Этого я уже сделала более чем достаточно!"
2000902-24 = "Если слишком долго сидеть в воде, у меня начинает кружиться голова и я устаю... Не понимаю людей, которым нравятся долгие ванны."
2000902-25 = "[s] «Как насчёт почитать мангу, которую давно хотела?»"
2000902-26 = "Я и так постоянно это делаю."
2000902-27 = "[s] «А если вкусно поесть и вздремнуть?»"
2000902-28 = "Это я в любой момент могу сделать в Секретариате."
2000902-29 = "Аргх! Я так давно не была в зимнем отпуске, а здесь нечем новым заняться!"
2000902-30 = "Если бы я знала, что горячие источники такие скучные, лучше бы пошла в парк развлечений или на фабрику пудинга."
2000902-31 = "[s1] «Такое чувство, что ты и без отпуска часто расслабляешься...»\n[s2] «Ты уверена, что тебе вообще нужен отдых?»"
2000902-32 = "Тишина, товарищ! Хочешь быть репрессирован?"
2000902-33 = "Тишина, товарищ! Хочешь быть репрессирован?"
2000902-34 = "Я не могу так растратить долгожданные зимние каникулы. Неужели больше нечем заняться?"
2000902-35 = "Чем-нибудь невероятно весёлым, что можно испытать только на курорте с горячими источниками."
2000902-36 = ""
2000902-38 = ""
2000902-39 = ""
2000902-40 = "Что это за стол в углу лаунжа, товарищ?"
2000902-41 = "[s] «Для настольного тенниса.»"
2000902-42 = "Хм-м, если подумать, на курорте Старого института довольно много студентов увлечённо играли в настольный теннис прямо в юкатах."
2000902-43 = "Есть что-то особенное в настольном теннисе на горячих источниках?"
2000902-44 = "Мне нужно самой это проверить."
2000902-45 = "Товарищ, прямо сейчас сыграй со мной в настольный теннис!"
2000902-46 = "[s3] «Раз ты настаиваешь...»\n[s4] «Мне ведь можно не поддаваться, правда?»"
2000902-47 = "Хаха, какая уверенность."
2000902-48 = "Хаха, какая уверенность."
2000902-49 = "Раз ты так уверен в своих навыках настольного тенниса, давай поспорим! Проигравший покупает победителю пудинг!"
2000902-50 = "И не какой-нибудь, а пудинг высшего качества от L'Oiseau Bleu!"
2000902-51 = "[s] «Договорились.»"
2000902-52 = "Хи-хи, ничто так не мотивирует, как бесплатный пудинг!"
2000902-53 = "Да!"
2000902-54 = ""
2000902-56 = ""
2000902-57 = "Начали!"
2000902-59 = "Я с энтузиазмом играл с Черино в настольный теннис."
2000902-60 = "(Черино играла ужасно, но мы продолжили больше десяти партий, потому что она отказывалась признавать поражение.)"
