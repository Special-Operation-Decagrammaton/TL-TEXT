[translation]
1000108-1 = "Раны"
1000108-2 = "Медпункт"
1000108-3 = "Я же сказала, что со мной всё нормально..."
1000108-4 = "Можешь расслабиться."
1000108-5 = "[s] «Но у тебя всё ещё идёт кровь...»"
1000108-6 = "Если поцарапаться, кровь — это нормально! Нужно просто время, чтобы рана зажила."
1000108-7 = "Разве это не подходящий ответ? Хм..."
1000108-8 = "[s] «Тебе нужно лучше беречь себя.»"
1000108-9 = "Но лишняя осторожность снижает эффективность."
1000108-10 = "Нельзя бояться травм. Нужно идти вперёд и выполнять задачу..."
1000108-11 = "Ай!"
1000108-12 = "Мог бы предупредить, прежде чем наносить антисептик, Сенсей."
1000108-13 = "Да, я прекрасно знаю, что без нормальной обработки может начаться инфекция..."
1000108-14 = "[s] Я продолжил обрабатывать рану Эйми."
1000108-15 = ""
1000108-16 = ""
1000108-17 = ""
1000108-19 = "Мне немного неловко..."
1000108-20 = "[s] «Я не против заботиться о тебе. Просто не хочу, чтобы ты травмировалась.»"
1000108-21 = "Ладно. Постараюсь быть осторожнее."
1000108-22 = ""
1000108-24 = "(Если Сенсей будет каждый раз так обо мне заботиться, может, стоит почаще получать травмы...)"
1000108-25 = ""
1000108-26 = "Хм? Ничего."
1000108-28 = "Я перевязал рану Эйми и отпустил её."
