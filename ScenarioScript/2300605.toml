[translation]
2300605-1 = "Профессионал Момоёдо!"
2300605-2 = "(Прочитав сообщение Шизуко и забеспокоившись, я отправился в Момоёдо.)"
2300605-4 = ""
2300605-5 = "[s] «О, Шизуко. Я...»"
2300605-6 = "Вот ваш набор мандзю!"
2300605-7 = ""
2300605-8 = "Шизуко! Вообще-то я заказывал..."
2300605-9 = "Погодите. Я и правда заказывал мандзю."
2300605-10 = "Что? Сегодня ты действительно правильно приняла мой заказ?"
2300605-11 = "Вы ведь этого хотели, верно? Приятного аппетита."
2300605-12 = "...?"
2300605-14 = ""
2300605-15 = ""
2300605-16 = "[ns] «Эй, Шизуко...?»"
2300605-17 = ""
2300605-18 = ""
2300605-19 = ""
2300605-21 = "*ахает* Осторожно, Шизуко!"
2300605-23 = ""
2300605-24 = "Что это было?!"
2300605-25 = "Прямо перед тем, как Шизуко должна была упасть, она проскользнула и исполнила какой-то акробатический трюк!"
2300605-26 = "Ой, простите. Я не хотела этого делать."
2300605-27 = "Она совсем не похожа на свою обычную жизнерадостную себя. Такая быстрая и профессиональная!"
2300605-28 = "Вы заказывали анмицу, верно? Одну минуту."
2300605-29 = "Вот."
2300605-30 = "И она спокойно приносит правильные заказы!"
2300605-31 = ""
2300605-32 = "Сегодня с Шизуко... что-то не так."
2300605-33 = "Она работает так быстро и всё делает правильно..."
2300605-34 = "О, что-то не так?"
2300605-35 = "Такая Шизуко выглядит очень круто!"
2300605-36 = "[s] «С ней наверняка что-то случилось.»"
2300605-38 = "(Момоёдо уже почти закрывается.)"
2300605-39 = "Мы скоро закрываемся."
2300605-40 = "Спасибо, что сегодня посетили Момоёдо."
2300605-41 = "А?"
2300605-42 = "Сенсей?"
2300605-43 = "Когда вы пришли?"
2300605-44 = "[s1] «Ты так и не подошла к моему столику принять заказ.»\n[s2] «Наверное, ты меня не заметила.»"
2300605-45 = "П-Прости... Я..."
2300605-46 = "П-Прости... Я..."
2300605-47 = "О."
2300605-48 = ""
2300605-49 = ""
2300605-51 = "[s] «Шизуко, ты в порядке?!»"
2300605-52 = "*тяжело дышит* *тяжело дышит*"
2300605-54 = ""
2300605-55 = ""
2300605-56 = "А...? Где я?"
2300605-57 = "[s] «Ты в порядке? Ты потеряла сознание, поэтому я принёс тебя в твою комнату.»"
2300605-58 = "С-Сенсей?"
2300605-59 = "Что произошло?"
2300605-60 = "[s3] «Наверное, ты переутомилась.»\n[s4] «Ты снова занята каким-то уличным фестивалем?»"
2300605-61 = "Ну..."
2300605-62 = "Ну..."
2300605-63 = "В последнее время в Момоёдо стало намного больше посетителей."
2300605-64 = "И у меня было столько работы как у президента Отдела организации фестивалей..."
2300605-65 = "[s] «Ты же понимаешь, что нельзя так себя изматывать.»"
2300605-66 = "Но..."
2300605-67 = "...Я ведь должна быть той, на кого можно положиться."
2300605-68 = "Я не могу просто сидеть сложа руки и отдыхать."
2300605-69 = "[s5] «Всем иногда нужен отдых.»\n[s6] «Иногда можно и пропустить работу.»"
2300605-70 = "Вы хотите, чтобы я отдохнула...?"
2300605-71 = "Вы хотите, чтобы я отдохнула...?"
2300605-72 = "Разве ваша работа не в том, чтобы мотивировать меня всегда стараться изо всех сил?"
2300605-73 = "[s] «Да, и в этом случае это значит положить голову и немного поспать.»"
2300605-75 = "[s7] «Я буду рядом.»\n[s8] «Я подержу тебя за руку.»"
2300605-76 = "Хорошо..."
2300605-77 = "Хорошо..."
2300605-78 = "Тогда только сегодня..."
2300605-79 = ""
2300605-80 = "Я просто немного вздремну, Сенсей."
2300605-81 = "Можете побыть здесь... пока я не усну?"
2300605-82 = "Хр-р..."
2300605-84 = "(Я тихо оставался рядом с Шизуко, пока она долго спала.)"
