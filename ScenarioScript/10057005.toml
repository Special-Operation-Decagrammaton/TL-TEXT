[translation]
10057005-1 = "Prologue"
10057005-2 = "Schale - Office"
10057005-5 = "(The warm temperature causes my eyes to grow heavy...)"
10057005-11 = "[ns1] \"Come in.\"\n[ns2] \"It's open.\""
10057005-16 = "[ns3] \"Why aren't they coming in?\"\n[ns4] Open the door."
10057005-24 = "Ah..."
10057005-25 = "Are you... Schale's... Sensei?"
10057005-26 = "[s] \"That's me, but... Are you okay? You're wobbling a lot...\""
10057005-27 = "The one who watches over everyone and can solve any problem..."
10057005-28 = "Sensei of Schale..."
10057005-33 = "At last, I've found you..."
10057005-37 = "[ns] \"Are you alright!?\""
10057005-45 = "Schale - Lounge"
10057005-48 = "Fortunately, there doesn't seem to be anything wrong with her."
10057005-49 = "She doesn't seem to suffering from malnutrition, so it's likely due to overwork."
10057005-50 = "[s] \"That's good to hear.\""
10057005-52 = "[ns5] \"By the way, Serina.\"\n[ns6] \"When did you get here?\""
10057005-56 = "W-why, would you look at the time? It's inconvenient how fast time flies by#nthese days."
10057005-57 = "I'll be taking my leave now... #nPlease be sure to get her some hot water to drink once she wakes up."
10057005-60 = "[ns] (No, seriously. When did she get in here...?)"
10057005-65 = "U-ugh..."
10057005-71 = "Sensei..."
10057005-75 = "I see. You look exactly like how they described you on the radio."
10057005-76 = "[s] \"Good morning. Are you feeling alright?\""
10057005-77 = "I'm fine. This is all still within my expectations."
10057005-78 = "Ah, right... It's a pleasure to meet you. #nI am Furuhata Rana from Red Winter Federal Academy."
10057005-79 = "I apologize for the sudden request, but may I ask for your assistance in a matter?"
10057005-80 = "[s7] \"My assistance?\"\n[s8] \"What can I help you with?\""
10057005-85 = "There is something I would like you to stop—"
10057005-86 = "A never-ending conflict."
10057005-87 = "[s] \"By conflict... You mean like a coup?\""
10057005-88 = "No, not a coup d'état."
10057005-89 = "This is a conflict that cannot be stopped by anyone..."
10057005-92 = "Except for you."
10057005-94 = "?"