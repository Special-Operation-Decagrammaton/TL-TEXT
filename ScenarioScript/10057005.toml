[translation]
10057005-1 = "Prologue"
10057005-2 = "Schale Office"
10057005-5 = "(It is so warm... I am getting sleepy...)"
10057005-11 = "[ns1] \"Go right ahead.\"\n[ns2] \"It is open.\""
10057005-16 = "[ns3] \"Why are they not coming in?\"\n[ns4] I try opening the door."
10057005-24 = "Ah..."
10057005-25 = "Are you... the Sensei of Schale...?"
10057005-26 = "[s] \"That is right. You look a bit dizzy, are you okay...?\""
10057005-27 = "The one who takes care of everyone and solves any problem..."
10057005-28 = "The Sensei of Schale..."
10057005-33 = "I finally met you..."
10057005-37 = "[ns] \"Are you okay!?\""
10057005-45 = "Schale - Breakroom"
10057005-48 = "Fortunately, there are no issues anywhere."
10057005-49 = "It does not seem to be malnutrition, so I suspect it is overwork."
10057005-50 = "[s] \"That is a relief.\""
10057005-52 = "[ns5] \"By the way, Serina.\"\n[ns6] \"When did you even get here?\""
10057005-56 = "My, look at the time already. Lately, time seems to fly by so fast, it is troublesome."
10057005-57 = "Well then, I will take my leave... #nPlease make sure to give her some warm water once she wakes up."
10057005-60 = "[ns] (How on earth did she get in...)"
10057005-65 = "U, ugh..."
10057005-71 = "Sensei..."
10057005-75 = "I see. You look exactly as I heard on the radio."
10057005-76 = "[s] \"Morning. How are you feeling?\""
10057005-77 = "No problems here. Everything up to this point is within expectations."
10057005-78 = "That is right... It is a pleasure to meet you. #nMy name is Lana Furuhata from Red Winter Federal Academy."
10057005-79 = "I apologize for the sudden request, but might I ask for your assistance, Sensei?"
10057005-80 = "[s7] \"My help?\"\n[s8] \"What do you need help with?\""
10057005-85 = "I want you to stop it--"
10057005-86 = "This endless conflict."
10057005-87 = "[s] \"Conflict... like a coup?\""
10057005-88 = "No, it is not a coup."
10057005-89 = "The only one who can stop this conflict is..."
10057005-92 = "Sensei, only you."
10057005-94 = "?"
