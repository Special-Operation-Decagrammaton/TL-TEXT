[translation]
10057005-1 = "Prologue"
10057005-2 = "Schale Office"
10057005-5 = "(It's so warm... I'm starting to get sleepy...)"
10057005-11 = "[ns1] \"Come in.\"\n[ns2] \"It's unlocked.\""
10057005-16 = "[ns3] \"Why aren't they coming in?\"\n[ns4] I try opening the door."
10057005-24 = "Oh..."
10057005-25 = "Are you... the Sensei of Schale?"
10057005-26 = "[s] \"That's right. You look a bit unsteady, are you okay...?\""
10057005-27 = "The one who looks after everyone and solves any problem..."
10057005-28 = "The Sensei of Schale..."
10057005-33 = "I finally... found you."
10057005-37 = "[ns] \"Are you alright!?\""
10057005-45 = "Schale Break Room"
10057005-48 = "Fortunately, there don't seem to be any issues."
10057005-49 = "It doesn't look like malnutrition, so I believe it's just exhaustion."
10057005-50 = "[s] \"That's a relief.\""
10057005-52 = "[ns5] \"By the way, Serina.\"\n[ns6] \"When did you get here?\""
10057005-56 = "Oh, look at the time. The clock has been moving so fast lately, it's quite a bother."
10057005-57 = "Well then, I'll be going... #nPlease give them some warm water once they wake up."
10057005-60 = "[ns] (How on earth did she get in here...)"
10057005-65 = "Ugh, ugh..."
10057005-71 = "Sensei..."
10057005-75 = "I see. You look exactly as I heard on the radio."
10057005-76 = "[s] \"Good morning. How are you feeling?\""
10057005-77 = "I am fine. Everything up to this point was within my calculations."
10057005-78 = "That's right... It's a pleasure to meet you. #nMy name is Furuhata Rana from Red Winter Federal Academy."
10057005-79 = "I apologize for the sudden request, but could I ask for your help, Sensei?"
10057005-80 = "[s7] \"My help?\"\n[s8] \"What do you need me to do?\""
10057005-85 = "I want you to stop it—"
10057005-86 = "The endless conflict."
10057005-87 = "[s] \"Conflict... like a coup?\""
10057005-88 = "No, it is not a coup."
10057005-89 = "The only one who can stop this conflict is..."
10057005-92 = "Sensei, it is only you."
10057005-94 = "?"