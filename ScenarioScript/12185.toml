[translation]
12185-2 = "Вы прибыли к целевым координатам!"
12185-3 = "Хошино держат где-то здесь! Ищите внимательно — мы обязательно её найдём..."
12185-4 = "..."
12185-5 = "Что это за место?"
12185-6 = "Это... школа?"
12185-7 = "Она разрушена, но, похоже, да."
12185-8 = "Школа посреди пустыни. Значит, это..."
12185-9 = "Верно. Перед вами то, что когда-то было главным корпусом старшей школы Абидос."
12185-10 = "!!"
12185-11 = ""
12185-13 = ""
12185-14 = ""
12185-15 = ""
12185-17 = "..."
12185-18 = "Ты...!"
12185-19 = ""
12185-20 = "Итак, вы наконец прибыли, Комиссия по взысканию долгов Абидоса."
12185-21 = ""
12185-22 = ""
12185-23 = ""
12185-24 = ""
12185-25 = ""
12185-26 = "Подкрепление врага..."
12185-27 = "Судя по всему, они мобилизовали все силы."
12185-28 = "ЧВК Кайзер собирается начать здесь полномасштабную войну...!"
12185-29 = ""
12185-30 = "Перед вами руины Абидоса, покинутые по мере опустынивания... Когда-то это было самое сердце Абидоса."
12185-31 = "Вы, вероятно, даже не знаете, что стояло здесь раньше... Но под этим песком похоронены остатки академии, которая когда-то была крупнейшей и сильнейшей во всём Кивотосе."
12185-32 = "И так уж получилось, что именно здесь Гематрия попросила нас построить лабораторию."
12185-33 = "Лабораторию...?!"
12185-34 = "Где Хошино?!"
12185-35 = "Вице-президент находится в здании позади нас."
12185-36 = "На самом деле эксперимент, возможно, уже начался."
12185-37 = "...!"
12185-38 = "Если хотите забрать её, придётся сначала пройти через нас."
12185-39 = "Осторожно, все. Они не сдадутся без боя."
12185-40 = ""
12185-41 = ""
12185-42 = ""
12185-43 = "Ну, я с ними разберу—"
12185-44 = "*БА-А-А-АХ*"
12185-45 = "Ещё один взрыв?! Что на этот раз происходит?"
12185-46 = ""
12185-48 = "Та-дам! Мы здесь! ☆"
12185-49 = "..."
12185-50 = "И-извините за вторжение!"
12185-51 = "Э-это Решатели проблем?!"
12185-52 = "Мы наконец вас догнали, Ару! Похоже, прервали что-то важное. Кто-нибудь введёт нас в курс дела?"
12185-53 = "Угх... Я хотела помочь из тени... Как же это отстойно."
12185-54 = "Какого...?! Что вы здесь делаете?"
12185-55 = "Появиться сейчас, в такой момент... Неужели...?!"
12185-56 = "Теперь понимаю. Они совсем не умеют скрывать чувства."
12185-57 = "Эй, чего вы ухмыляетесь?"
12185-58 = "Босс, нам обязательно это делать? От них у меня мурашки по коже..."
12185-59 = "..."
12185-60 = "Хех. Хорошо, что вы быстро соображаете, Комиссия по взысканию долгов. Разве не очевидно, зачем мы здесь?"
12185-61 = ""
12185-63 = "Идите. Мы разберёмся здесь. А вы спасайте свою подругу!"
12185-65 = "!!"
12185-66 = "!!"
12185-67 = "!!"
12185-68 = "*вздыхает*"
12185-69 = ""
12185-70 = ""
12185-71 = ""
12185-72 = ""
12185-74 = "(М-меня язык за зубами не держится!)"
12185-75 = ""
12185-76 = "Ох, Ару. Продолжай в том же духе — и я окончательно в тебя влюблюсь."
12185-77 = "Д-давай приказы, Ару! Моя жизнь принадлежит тебе!"
12185-78 = ""
12185-79 = "...Тц."
12185-80 = "Вы даже благодарности не хотите, да?"
12185-81 = "Тогда, когда всё закончится... просто сходим вместе поесть рамэна или что-нибудь такое!"
12185-82 = "Ага-ага! Мы обязательно вас угостим!"
12185-83 = "Ага, спасибо."
12185-84 = ""
12185-86 = "*вздох* Кажется, мы уже слишком далеко зашли, чтобы отступать."
12185-87 = "А-атака! Нет, остановите их! А-а-а—!"
12185-88 = "Ахахаха! Вот теперь становится весело, Ару! После такой крутой реплики тебе лучше не падать слишком быстро!"
12185-90 = "Разорвём их на куски!"
12185-92 = "Следующий эпизод;Не отпуская. Часть 2"
