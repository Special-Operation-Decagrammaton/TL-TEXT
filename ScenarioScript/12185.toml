[translation]
12185-2 = "Chegamos às coordenadas-alvo!"
12185-3 = "A Hoshino-senpai deve estar presa por aqui! Em algum lugar nos arredores, com certeza...!"
12185-4 = "..."
12185-5 = "Aqui é..."
12185-6 = "...Aqui é uma escola?"
12185-7 = "Esses vestígios... provavelmente é uma escola, né?"
12185-8 = "Uma escola no meio do deserto... Será que..."
12185-9 = "Sim. Este é o verdadeiro prédio principal do Colégio Abydos."
12185-10 = "!!"
12185-17 = "..."
12185-18 = "Você é...!!"
12185-20 = "Chegaram longe, Comitê de Contramedidas de Abydos."
12185-26 = "Muitos reforços inimigos...!"
12185-27 = "Com esses números... provavelmente é todo o efetivo disponível do inimigo..."
12185-28 = "A Kaiser PMC com certeza pretende travar uma guerra total aqui...!"
12185-30 = "As ruínas abandonadas de Abydos, tomadas pela desertificação... Este lugar era, originalmente, o centro de Abydos."
12185-31 = "...Os restos daquela que já foi a maior e mais poderosa escola de Kivotos estão enterrados sob esta areia."
12185-32 = "A Gematria exigiu que construíssemos um laboratório aqui."
12185-33 = "Um laboratório...?!"
12185-34 = "Mais importante do que isso, onde está a Hoshino-senpai?!"
12185-35 = "Se procura aquela vice-presidente do conselho estudantil, ela está no prédio logo ali."
12185-36 = "Embora o experimento talvez já tenha até começado..."
12185-37 = "...!"
12185-38 = "Se querem chegar até ela, basta passarem por nós. Isto é, se forem capazes disso."
12185-39 = "Com todo esse efetivo, não parece que vão nos deixar passar facilmente..."
12185-43 = "...Nn, então deixem aqui comigo—"
12185-44 = "(KABOOOOM!!)"
12185-45 = "Outra explosão?! O-O que foi agora?"
12185-48 = "Tcharam! Oiê~ ☆"
12185-49 = "..."
12185-50 = "C-Com licença!"
12185-51 = "P-Pessoal da Faz-Tudo...?!"
12185-52 = "Finaaalmente alcançamos vocês! Mas espera, está todo mundo reunido aqui... Será que a gente interrompeu uma cena importante?"
12185-53 = "...Hmph, eu pretendia dar uma mãozinha discretamente, mas parece que não saiu tão bem assim."
12185-54 = "V-Vocês...!"
12185-55 = "Aparecerem bem nessa hora significa que...!"
12185-56 = "...Entendi, então é isso."
12185-57 = "...Hm? O que são esses olhares cheios de expectativa?"
12185-58 = "Chefe, estou com um mau pressentimento, então vamos primeiro entender a situação antes de..."
12185-59 = "..."
12185-60 = "Hehe, pelo menos o faro de vocês não está enferrujado, Comitê de Contramedidas. O motivo de estarmos aqui é óbvio, não é?"
12185-63 = "Deixem aqui conosco e sigam em frente!!!"
12185-65 = "!"
12185-66 = "!!"
12185-67 = "!!!"
12185-68 = "...Haa."
12185-74 = "(EU ACABEI FALANDOOOO—!!!!)"
12185-76 = "Uau... desse jeito eu vou acabar me apaixonando, Aru-chan..."
12185-77 = "C-Como esperado! E-Eu vou segui-la pelo resto da minha vida! Aru-sama!!"
12185-79 = "...Ah, qual é."
12185-80 = "N-Não vou agradecer nem nada, viu?!!"
12185-81 = "Mas quando tudo isso acabar... a gente vai comer um lámen juntas, Faz-Tudo!!"
12185-82 = "Sim, nós com certeza retribuiremos essa dívida!"
12185-83 = "Nn, obrigada."
12185-86 = "Haa... agora que chegamos até aqui, não tem jeito."
12185-87 = "E-Eu me deixei levar pelo momento, mas o que eu faço agora...?! Atacar?! Não, fugir...?!"
12185-88 = "Ahahahaha! Agora ficou divertido, Aru-chan! Depois de mandar uma frase tão estilosa daquelas, não tem como voltar atrás!"
12185-90 = "Então, vamos começar!!!"
12185-92 = "Próximo;O Que Mesmo Assim Não Deixamos Ir (2)"
