[translation]
33180-1 = "Эпизод 18;Ни секунды сомнений"
33180-2 = "..."
33180-3 = "[s] Улыбнуться Хасуми, когда она проснётся."
33180-4 = "Сенсей."
33180-5 = "Где я? Что произошло...?"
33180-6 = "[s] «Я рад, что с тобой всё хорошо.»"
33180-7 = "Я тоже. Мне казалось, мой нимб сейчас уничтожат..."
33180-8 = "Что с Цуруги и остальными?"
33180-9 = ""
33180-12 = "..."
33180-13 = "[s] Посмотреть на кровать Цуруги."
33180-14 = "...?"
33180-15 = ""
33180-17 = "Кья-а-а-а-а?!"
33180-18 = "С-Сенсей?! Что вы здесь делаете...?"
33180-19 = "Ого! Ты уже можешь двигаться, Цуруги?! Не зря ты председатель Отряда правосудия."
33180-21 = ""
33180-22 = "Вы хорошо выглядите, Сенсей."
33180-23 = "[s] «Да, благодаря тебе.»"
33180-24 = "Я рада, что лечение в итоге помогло. Мне впервые пришлось ухаживать за взрослым."
33180-25 = "Сенсей..."
33180-26 = "Тебе ещё нельзя вставать, Чинацу. Ложись обратно. Не заставляй меня давить старшинством."
33180-27 = "Н-Но теперь я в Дисциплинарном комитете..."
33180-28 = "Дверь Медицинского аварийного клуба всегда открыта для твоего возвращения. Я прослежу, чтобы тебе доставались только трупы высшего качества. То есть, пациенты."
33180-29 = "Думаю, мне придётся отказаться..."
33180-30 = ""
33180-32 = ""
33180-33 = ""
33180-34 = "Сенсей..."
33180-35 = "Что ты делаешь, Ако? Тебе ещё нельзя дви—ах."
33180-36 = "[s] «Спокойнее, вы обе. Со мной всё хорошо.»"
33180-37 = "Но председатель всё ещё пропала..."
33180-38 = "Её нет в кабинете, и я не могу с ней связаться."
33180-39 = "Сенсей. Пожалуйста..."
33180-40 = "[s] «Не волнуйся. Я найду Хину.»"
33180-41 = "Спасибо, Сенсей. Мы рассчитываем на вас."
33180-44 = ""
33180-45 = "Сенсей..."
33180-46 = "[s] «Привет, Хифуми.»"
33180-47 = "Сенсей, дело в Азусе. Она..."
33180-48 = "..."
33180-49 = "..."
33180-50 = "Она сражается совсем одна. Всё ещё там, одна, продолжает бороться..."
33180-51 = "[s] «Я знаю.»"
33180-52 = "Я не знаю, что делать. Не знаю, как ей помочь..."
33180-53 = "Может ли такая обычная девушка, как я, хоть что-то сделать?"
33180-54 = "Я знаю, это опасно, но должен быть способ. Я хочу помочь Азусе."
33180-55 = "..."
33180-56 = "Д-Да! Мы не можем просто оставить её так!"
33180-57 = "Кохару..."
33180-58 = "Я-Я тоже знаю, каково быть совсем одной. Когда тебя бросили... Мы не можем её бросить!"
33180-59 = "Согласна. Могу только представить, насколько ей сейчас одиноко."
33180-60 = "[s] «Вот почему именно ты лидер Клуба дополнительных занятий, Хифуми.»"
33180-61 = "Я кто...?"
33180-62 = "[s1] «Твоя стойкость привела нас сюда.»\n[s2] «Обычная ты или нет, ты никогда не сдавалась.»"
33180-63 = "Мы все много работали, но зашли так далеко только потому, что ты была президентом нашего клуба."
33180-64 = "Мы все много работали, но зашли так далеко только потому, что ты была президентом нашего клуба."
33180-65 = "Верно. Никто из нас не стоял бы сейчас здесь, если бы не ты, Хифуми."
33180-66 = "Ханако... Кохару..."
33180-67 = "[s3] «А если немного потеряешься, всегда можешь прийти ко мне.»\n[s4] «В конце концов, слушать и помогать — моя работа.»"
33180-68 = "..."
33180-69 = "..."
33180-70 = "Хорошо. Теперь я всё поняла."
33180-71 = "Я усвоила урок. Я не сдамся и не буду себя унижать."
33180-72 = "Сделаю всё, что потребуется!"
33180-73 = "Тогда идём, Сенсей. Мы спасём Азусу."
33180-74 = "[s5] «Вот так-то.»\n[s6] «Конечно. Как всегда, пойду за тобой.»"
33180-77 = "Мы сделаем это вместе — ради Азусы."
33180-78 = "Верно! Потому что она наша подруга!"
33180-79 = "В этот раз, когда я с ней поговорю, всё будет иначе."
33180-80 = ""
33180-82 = ""
33180-83 = "Полагаю, тебе нужно кое-что ей сказать."
33180-84 = "Точно."
33180-85 = "Все постоянно говорят нам, что мы неправы... насчёт мира... и его истин. Так что мне нужно кое-что высказать."
33180-86 = "Я отказываюсь верить тому, что Азуса сказала... о настоящем мире."
33180-87 = "Хифуми?"
33180-88 = ""
33180-90 = ""
33180-91 = "[ns] «Иногда друзьям нужно прямо говорить друг другу, что они думают.»"
33180-92 = "Именно! В этот раз я достучусь до Азусы и до всех остальных!"
33180-93 = "Конечно, Хифуми. Я тоже буду слушать, затаив дыхание. Расскажи всем, что чувствуешь."
33180-94 = "Об этом потом. Нам нужно двигаться!"
33180-97 = "Собирать людей, убеждать их, общаться, понимать..."
33180-98 = "Сенсей пытается снова объединить студентов Тринити и Геенны после того, как их вновь разорвали друг от друга."
33180-99 = "Даже сейчас Совет Святой Юстины несёт волю ненависти Ариуса и наступает на Тринити и Геенну."
33180-100 = "А вы всё равно продолжаете убеждать и просить..."
33180-101 = "...понемногу объединяя всех нас общей целью."
33180-102 = ""
33180-104 = ""
33180-105 = ""
33180-106 = "Пока Азуса всё ещё пытается остановить Ариус в одиночку."
33180-107 = "У старого собора."
33180-108 = "Того самого места, оставленного в руинах — символа утраченного рая."
33180-109 = "Именно там столкнутся Ариус, Азуса и Сенсей."
33180-111 = "..."
33180-112 = "..."
33180-113 = "Азуса..."
33180-114 = ""
33180-116 = ""
33180-117 = "Саори..."
33180-118 = "Как ты посмела ранить Химэ?! Ты ответишь за это!"
33180-119 = "Я остановлю тебя, Саори. Даже если это будет последнее, что я сделаю."
33180-120 = "Ну попробуй!"
33180-122 = "Думаешь, сможешь погасить нашу вражду?! Нашу ненависть?! Нашу обиду?!"
33180-123 = "Смогу. Если мне не хватает злобы, я её найду. Если придётся тебя убить — убью."
33180-124 = ""
33180-126 = ""
33180-130 = ""
33180-131 = "АЗУСА!"
33180-132 = "И если из-за этого я больше никогда не смогу вернуться в их мир, тогда я с ним попрощаюсь."
33180-134 = "Следующий эпизод;Наши истории"
