[translation]
33180-1 = "Episódio 18;Sem Hesitar"
33180-2 = "..."
33180-3 = "[s] Olhar na direção da Hasumi."
33180-4 = "...Sensei."
33180-5 = "Onde estamos...? O que foi que aconteceu...?"
33180-6 = "[s] \"Hasumi, que alívio...\""
33180-7 = "...Sim. Foi por muito pouco, mas..."
33180-8 = "E a Tsurugi? E todas as outras...?"
33180-12 = "..."
33180-13 = "[s] Olhar na direção da Tsurugi."
33180-14 = "...?"
33180-17 = "Gyaaaaaah!?"
33180-18 = "Se-Se-Se-Sensei!? P-Por que você está aqui...!?"
33180-19 = "Ah, Tsurugi-san! Espera, você já consegue se mexer!? Não esperava menos da presidente do Comitê de Justiça!"
33180-22 = "...Fico muito feliz que esteja a salvo, Sensei."
33180-23 = "[s] \"Tudo graças à Sena.\""
33180-24 = "Imagina. Foi a primeira vez que tratei de um adulto, mas que bom que deu tudo certo."
33180-25 = "Sensei..."
33180-26 = "Chinatsu, você ainda não pode se mexer. Fique deitada, é uma ordem da sua veterana."
33180-27 = "Mas atualmente eu pertenço ao Comitê Disciplinar..."
33180-28 = "Você pode voltar para o Clube de Medicina de Emergência agora mesmo, sabia? Vai poder tocar à vontade em cadá... digo, em feridos de ótima qualidade."
33180-29 = "Não, obrigada... Vou recusar educadamente."
33180-34 = "Sensei..."
33180-35 = "Ako-chan, você ainda não pode se mexer... Urgh...!"
33180-36 = "[s] \"Ainda bem que tanto a Ako quanto a Iori estão a salvo, apesar dos ferimentos...\""
33180-37 = "A Chefe do Comitê Disciplinar desapareceu..."
33180-38 = "Ela não estava na sala do clube, e não conseguimos entrar em contato com ela..."
33180-39 = "Sensei, por favor, encontre a Chefe..."
33180-40 = "[s] \"Sim, deixe comigo.\""
33180-41 = "...Certo. Conto com você."
33180-45 = "Sensei..."
33180-46 = "[s] \"Hifumi...\""
33180-47 = "Sensei, a Azusa-chan..."
33180-48 = "..."
33180-49 = "..."
33180-50 = "A Azusa-chan está lutando sozinha... Ainda agora, esse tempo todo sozinha..."
33180-51 = "[s] \"...Sim.\""
33180-52 = "Ela disse que pertencemos a lugares diferentes... E aí eu já não sei mais o que fazer..."
33180-53 = "As coisas chegaram a uma situação tão grave... Não há mais nada que uma aluna comum como eu possa fazer..."
33180-54 = "Como eu posso ajudar a Azusa-chan...? Afinal, eu..."
33180-55 = "..."
33180-56 = "Mesmo assim, não podemos simplesmente deixá-la pra lá, né!?"
33180-57 = "Koharu-chan..."
33180-58 = "Não importa de onde cada uma vem! E-Eu sei bem como é...! Ficar sozinha, ser deixada pra trás... Eu sei o quanto isso é triste! Por isso, não podemos deixar a Azusa sozinha...!"
33180-59 = "...Pois é. Esse tipo de coisa dá uma baita solidão."
33180-60 = "[s] \"Foi a Hifumi quem nos guiou até aqui o tempo todo.\""
33180-61 = "...?"
33180-62 = "[s1] \"Claro que todas se esforçaram, mas foi porque você deu o seu melhor até aqui, Hifumi.\"\n[s2] \"Porque, mesmo sendo alguém comum, você nunca desistiu do que todas buscavam.\""
33180-63 = "Eu me esforcei. Mas eu sei muito bem que, nos bastidores, você cuidou de um monte de problemas e fez de tudo como presidente do clube... e que foi graças a isso que eu consegui dar o meu melhor."
33180-64 = "Eu me esforcei. Mas eu sei muito bem que, nos bastidores, você cuidou de um monte de problemas e fez de tudo como presidente do clube... e que foi graças a isso que eu consegui dar o meu melhor."
33180-65 = "É verdade. Foi porque a Hifumi-chan não desistiu que eu também posso estar aqui agora."
33180-66 = "Koharu-chan, Hanako-chan..."
33180-67 = "[s3] \"Por isso, vai ficar tudo bem. Quando não souber mesmo o que fazer, eu também estarei aqui.\"\n[s4] \"Mesmo que agora pareça impossível, vamos pensar, conversar e resolver isso juntos.\""
33180-68 = "..."
33180-69 = "..."
33180-70 = "...Sim, muito obrigada."
33180-71 = "Eu também aprendi direitinho. Não vou desistir, nem vou ficar hesitando para sempre."
33180-72 = "Eu vou fazer o que estiver ao meu alcance...!"
33180-73 = "...Vou lá salvar a Azusa-chan."
33180-74 = "[s5] \"...Você sempre foi assim, né, Hifumi?\"\n[s6] \"E eu também vou te ajudar do mesmo jeito, Hifumi.\""
33180-77 = "Então, vamos todas juntas?"
33180-78 = "S-Sim! Temos que salvar a nossa amiga...!"
33180-79 = "Vou encontrar a Azusa-chan e, desta vez..."
33180-83 = "...Temos que dizer tudo o que sentimos, não é?"
33180-84 = "...Sim."
33180-85 = "Preciso dizer tudo a ela com firmeza."
33180-86 = "Essa história de que não podemos viver no mesmo mundo, eu..."
33180-87 = "Hifumi...?"
33180-91 = "[ns] \"Mesmo entre amigas, se você não disser, ela não vai saber.\""
33180-92 = "...Sim! Desta vez, eu vou falar com todas as letras...!"
33180-93 = "Isso mesmo. E eu também estarei bem ao seu lado."
33180-94 = "É... B-Bom, a gente vai indo, né? Então vamos logo, depressa!"
33180-97 = "Reunir a todos, conversar... criar laços e alcançar a compreensão."
33180-98 = "As alunas de Trinity e Gehenna estão, pouco a pouco..."
33180-99 = "Agora que o Conselho dos Santos de Justina, carregado com o ódio de Arius, avança contra Trinity e Gehenna."
33180-100 = "Pedindo ajuda umas às outras, amparando-se mutuamente..."
33180-101 = "E assim, pouco a pouco, estão tentando se aproximar."
33180-106 = "Enquanto isso, Azusa, que tenta deter o Esquadrão Arius sozinha..."
33180-107 = "A Antiga Catedral."
33180-108 = "Rumo àquele lugar que ostenta o nome do paraíso, mas que hoje não passa de ruínas."
33180-109 = "Azusa, o Esquadrão Arius... e também o Sensei se dirigem para lá..."
33180-111 = "..."
33180-112 = "..."
33180-113 = "Azusa..."
33180-117 = "..."
33180-118 = "Como ousa... Como ousa fazer aquilo com a Princesa...! Eu jamais vou te perdoar...!"
33180-119 = "Eu vou deter a Saori. Nem que isso custe a minha vida."
33180-120 = "Como se você fosse capaz de uma coisa dessas!!"
33180-122 = "Achou mesmo que poderia suportar a nossa fúria, o nosso ódio, o nosso rancor!?"
33180-123 = "...Eu vou me tornar uma assassina."
33180-131 = "Azusaaa!!"
33180-132 = "...Mesmo que eu nunca mais possa voltar para aquele mundo."
33180-134 = "Próximo;A Nossa História"
