[translation]
80000009-1 = "Соревнование по поеданию шоколада"
80000009-2 = "Столовая Геенны"
80000009-3 = "Слышали новости, Сенсей?"
80000009-4 = "В центре города на День святого Валентина проведут большой конкурс по еде."
80000009-5 = "Угадаете, что будут есть участники?#nАга, шоколад!"
80000009-6 = "Я уже участвовала в конкурсах с хлебом и даже шоколадным тортом, но обычный шоколад будет впервые.#nЯ немного волнуюсь."
80000009-7 = "Покупной шоколад очень сытный, потому что в нём много сахара и масла."
80000009-8 = "Поэтому я тренируюсь, поедая шоколад из столовой Геенны."
80000009-9 = "[s] «Хочешь, присоединюсь?»"
80000009-10 = "Конечно. Когда есть соперник, тренироваться полезнее."
80000009-11 = "Да и любая еда вкуснее, когда есть с кем поделиться, правда?"
80000009-12 = "Поэтому..."
80000009-13 = ""
80000009-15 = ""
80000009-17 = "...я купила весь этот шоколад оптом!"
80000009-18 = "[s] «Всё это только на двоих?!»"
80000009-19 = "Нет, не глупи. Эта порция только твоя."
80000009-20 = "Моя — вот эта, побольше."
80000009-21 = "[s] «По-моему, ты слишком высокого мнения о размере моего желудка...»"
80000009-22 = "Не сдавайся ещё до начала. У тебя ведь взрослый аппетит должен быть!"
80000009-23 = "Давай так. Если сумеешь съесть всю свою порцию,#nя исполню одно твоё желание!"
80000009-24 = "Так что покажи немного духа!"
80000009-25 = "Ну что ж. Да начнётся соревнование по поеданию шоколада!"
80000009-27 = "Я осилил только половину шоколада, который дала мне Акари, прежде чем мне стало плохо."
80000009-28 = "Выбрасывать остаток было бы невежливо, поэтому я завернул его и принёс обратно в Шале, чтобы доесть понемногу."
