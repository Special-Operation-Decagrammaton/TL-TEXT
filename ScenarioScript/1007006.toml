[translation]
1007006-1 = "Время идёт"
1007006-2 = "Сад Цветущей Сливы"
1007006-3 = ""
1007006-4 = "Эй! Это Мина!"
1007006-5 = "Мина! Покатай меня на спине!"
1007006-6 = "Хе-хе... Как поживают сегодня мои милые маленькие солдатики?"
1007006-7 = "Она опять сказала что-то странное..."
1007006-8 = ""
1007006-9 = "Я не хочу играть, если ты так говоришь!"
1007006-10 = "Нет-нет-нет! О чём вы? Я вовсе не говорю странно!"
1007006-11 = "О, придумала... Все, стройтесь. Я принесла подарки!"
1007006-12 = "[s] «Не знал, что ты любишь детей, Мина.»"
1007006-13 = "...А?!"
1007006-14 = "Н-На самом деле! Дети из Сада сливовых цветов — это..."
1007006-15 = "...будущее Шаньхайцзина!"
1007006-16 = "Так говорит Руми."
1007006-17 = ""
1007006-18 = "Она всегда приносит нам фрукты и закуски и разрешает есть сколько угодно!"
1007006-19 = "Змеи с Променада Чёрной Черепахи... Пытаются задобрить детей едой...!"
1007006-20 = "Какой подлый приём. Я этого не потерплю!"
1007006-21 = "[s] «Ты не преувеличиваешь? Все любят детей...»"
1007006-22 = "Сенсей, вы на их стороне? Вы пришли шпионить за мной по их приказу?!"
1007006-23 = "[s] «Я никогда не стал бы шпионить за своими студентами...»"
1007006-24 = "Хмф... Раз вы так говорите."
1007006-25 = "В любом случае, дети... Держите! Новая одежда для вас!"
1007006-26 = "М-м... Похоже на форму Генрюмона."
1007006-27 = "Посмотрите на цветы на этих туфлях... Я таких никогда раньше не видела."
1007006-28 = "Хе-хе. Генрюмон заказал их специально для вас."
1007006-29 = "И, в отличие от подарков с Променада Чёрной Черепахи, этим вы сможете пользоваться ещё очень долго."
1007006-30 = "Скукота. Есть что-нибудь ещё?"
1007006-31 = ""
1007006-32 = "Я хочу красивые вещи. Дай мне что-нибудь красивое!"
1007006-33 = "Что?!"
1007006-34 = "Вы сами не понимаете, что говорите. Садитесь, я сейчас всё вам объясню..."
1007006-35 = ""
1007006-37 = ""
1007006-39 = ""
1007006-40 = "Эту одежду вручную сшил лучший портной Генрюмона."
1007006-41 = "В этой ткани заключены дух, традиции и ценности Шаньхайцзина и Генрюмона!"
1007006-42 = "Каждый стежок, каждый узор наполнен смыслом."
1007006-43 = "И эти туфли! Чёрный — цвет Генрюмона, потому что он символизирует решительность, стойкость, честность и справедливость."
1007006-44 = "Мы сделали это, чтобы помочь вам, детям из Сада сливовых цветов, однажды вырасти достойными членами Шаньхайцзина."
1007006-45 = "Разбудите меня, когда закончите говорить..."
1007006-46 = "Эм... Я слышала, что чёрные розы означают прощание. Ты куда-то уезжаешь, Мина?"
1007006-47 = "Н-Нет, я совсем не это имела в виду!"
1007006-49 = ""
1007006-52 = "О-о-ох... Моя спина..."
1007006-53 = "[s] «Тебе сегодня понравилось играть с детьми?»"
1007006-54 = "Время потрачено не зря."
1007006-55 = "Они окружили меня, просили обнять их..."
1007006-56 = "Дёргали за волосы... Кричали прямо в ухо... Игнорировали, когда я говорила... Но что поделать, они же дети."
1007006-57 = "[s] «Иногда они и меня выматывают.»"
1007006-58 = "В каком-то смысле это словно возвращать долг, да?"
1007006-59 = "В конце концов, мы все когда-то были детьми."
1007006-60 = ""
1007006-62 = "[ns] «...»"
1007006-63 = "Что за взгляд, Сенсей?"
1007006-64 = "Удивлены, что от меня можно услышать такую мудрость?"
1007006-65 = "Хе-хе. Я просто рада, что сегодня вы смогли увидеть, чего я на самом деле стою."
1007006-66 = "Когда я смотрю на этих детей, начинаю задумываться..."
1007006-67 = "Какими студентами они станут, когда вырастут? Смогу ли я стать для них человеком, на которого стоит равняться?"
1007006-68 = "Ах, но вы ведь взрослый. Наверное, вы уже давно перестали думать о таких вещах."
1007006-69 = "[s1] «Не думаю, что такие мысли когда-нибудь исчезают полностью.»\n[s2] «То, что становишься старше, ещё не делает тебя взрослым автоматически.»"
1007006-72 = "Правда? Я не знала."
1007006-73 = "Наверное, иногда я и правда вижу в вас эту сторону."
1007006-74 = "Но вы всегда выглядите так, будто точно знаете, что делаете."
1007006-75 = "[s] «Рад, что так кажется!»"
1007006-76 = "То есть на самом деле вы не знаете?"
1007006-77 = "[s] «Внутри я примерно как... утка, которая изо всех сил старается не утонуть.»"
1007006-78 = "Большинство уток, наверное, назвали бы это плаванием."
1007006-79 = "О, что такое? Я задела за живое?"
1007006-80 = ""
1007006-82 = ""
1007006-83 = ""
1007006-84 = "Одна дама как-то сказала мне, что глубоко внутри мы все всё ещё дети. Сколько бы лет ни прошло..."
1007006-85 = ""
1007006-88 = "[ns] «Нужно примириться с самим собой. Это единственный покой, который нам вообще доступен в этом безумном мире.»"
1007006-89 = "Когда первая капля уже упала тебе на голову, поздно что-то менять. Остаётся лишь принять дождь."
1007006-91 = "По дороге обратно в Шале мы с Миной делились этой и другой суровой мудростью."
