[translation]
10051110-1 = "Эпилог;Назад к началу"
10051110-2 = "На следующий день..."
10051110-4 = "Офис Шайнкэт"
10051110-5 = "Спасибо за вчерашнее."
10051110-6 = "Показ был испорчен... но это не целиком ваша вина."
10051110-7 = "На самом деле благодаря вам и Сенсею из Шале ущерб оказался минимальным. Вы спасли нас от кошмара с репутацией."
10051110-8 = "В любом случае, ты сказала, что хочешь вернуться в... клуб ниндзя?"
10051110-9 = "...Да."
10051110-10 = "Хм."
10051110-11 = "Тогда это, должно быть, правильный выбор. Я и так достаточно на тебя давил. Каждый должен выбирать свой путь сам."
10051110-12 = "...Хотите верьте, хотите нет, но я знаю это по собственному опыту."
10051110-13 = ""
10051110-15 = ""
10051110-16 = "Что ж, время — деньги. Давайте заканчивать."
10051110-17 = "Моё прекрасное платье, которое ты испортила. Что собираешься с этим делать?"
10051110-18 = "Э-Это...!"
10051110-19 = "Ха-ха-ха! Я шучу, Цукуё. Тебя так легко дразнить."
10051110-20 = "Вот. Возьми."
10051110-21 = "Коробка...?"
10051110-22 = ""
10051110-24 = ""
10051110-25 = "Э-Это...!"
10051110-26 = "Да, это платье, которое ты порвала. Я всю ночь его чинил."
10051110-28 = "Считай это прощальным подарком. Ты его заслужила."
10051110-29 = "...!"
10051110-30 = "Не пойми неправильно. Я всё ещё весьма раздражён. Но я не могу отпустить гостя из офиса с пустыми руками. Особенно в праздник."
10051110-31 = "С Новым годом."
10051110-32 = "Н-Но...!"
10051110-33 = "А теперь иди. Я занят."
10051110-34 = ""
10051110-36 = ""
10051110-38 = "...Спасибо! С Новым годом!"
10051110-40 = "У входа в офис Шайнкэт"
10051110-41 = ""
10051110-42 = "Цукуё, она опаздывает..."
10051110-43 = "[s] «Эм, она разговаривает с ним всего пять минут...»"
10051110-44 = "В-Важно то, как я жду! Само чувство!"
10051110-45 = ""
10051110-47 = ""
10051110-48 = "Президент! Мой господин! Цукуё появилась на горизонте!"
10051110-49 = "Цукуё!"
10051110-50 = ""
10051110-52 = ""
10051110-54 = "П-Президент! И Изуна! И... Сенсей?!"
10051110-55 = "[s] «Ты решила, Цукуё?»"
10051110-56 = "Да! Я..."
10051110-57 = "Я выбираю... Клуб исследования ниндзюцу!"
10051110-58 = "Ура!"
10051110-59 = "Ещё раз — с возвращением, Цукуё!"
10051110-60 = "Кстати, почему здесь камера...?"
10051110-61 = "[s] «Мы должны сообщить всему миру, что ты вернулась!»"
10051110-62 = "Э...?!"
10051110-63 = "На этот раз камера установлена правильно! Крепко и ровно!"
10051110-64 = "А после съёмки давайте все вместе пойдём есть рамен! Нин-нин!"
10051110-65 = "Рамен...!"
10051110-66 = ""
10051110-68 = ""
10051110-70 = "Итак, «Мичиручи: свиток девушки-ниндзя»..."
10051110-71 = ""
10051110-73 = ""
10051110-75 = ""
10051110-78 = "...начинается прямо сейчас!"
10051110-79 = ""
10051110-82 = "Незримый путь — Эпизод: Дежурство охраны на модном показе!"
