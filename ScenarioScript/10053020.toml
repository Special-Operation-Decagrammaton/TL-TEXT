[translation]
10053020-1 = "Эпизод 2;У неё такой образ"
10053020-2 = "Ч-Что?! Что вы здесь делаете, Сенсей?!"
10053020-3 = "[s1] «Это я должен спросить, что ТЫ здесь делаешь!»\n[s2] «Как ты вообще сюда выбралась?!»"
10053020-6 = "Что? В смысле «как»? Я получила официальное разрешение по всем правилам!"
10053020-7 = "...А, я знаю, вы думаете, что знаете о нашей школе всё, но не верьте слухам."
10053020-8 = "Вайлдхант не держит учеников буквально взаперти, знаете ли."
10053020-9 = "Конечно, получить разрешение на выход немного муторно..."
10053020-10 = "А? О, Сенсей... Вы знаете Гурумин?"
10053020-11 = "[s3] «Да, очень хорошо.»\n[s4] «Она моя кохай из прошлой жизни.»"
10053020-14 = "...? Что это вообще за отношения?"
10053020-15 = "Шьяа! Нет! Только не вы тоже, Сенсей! Не подыгрывайте этой ерунде — так Каное станет ещё невыносимее!"
10053020-16 = "Но всё же вы должны ответить. Почему вы здесь, Сенсей?"
10053020-17 = "Я думала, Цучиноко ищем только МЫ ТРОЕ."
10053020-18 = "А, простите. Я забыла упомянуть, что Сенсей пойдёт с нами. Всё решилось в последний момент."
10053020-19 = "Но, как бы то ни было, чем больше, тем веселее! Верно, девочки?"
10053020-20 = "Держи свою экстравертность подальше от меня."
10053020-21 = "Раз Сенсей уже знает Гурумин, ЭТО знакомство можно пропустить."
10053020-22 = "Тогда... Хм."
10053020-23 = ""
10053020-25 = ""
10053020-28 = ""
10053020-29 = ""
10053020-30 = "..."
10053020-31 = ""
10053020-33 = ""
10053020-34 = ""
10053020-35 = "[ns5] «...? Ты на меня показываешь...?»\n[ns6] Сложите кончики пальцев вместе."
10053020-36 = "...Телепатия не сработала."
10053020-37 = "Похоже, мы с Сенсеем работаем на разных частотах."
10053020-38 = ""
10053020-40 = ""
10053020-41 = "...!"
10053020-42 = "Как я и думала. У нас с вами схожие ауры, Сенсей."
10053020-43 = ""
10053020-45 = ""
10053020-46 = ""
10053020-47 = "Рада знакомству. И добро пожаловать."
10053020-48 = "Меня зовут Ханэмото Цубаса, руководитель этой экспедиции. Я возглавляю Институт паранормальных исследований Мо."
10053020-49 = "Обращаясь ко мне, буду признательна, если вы будете называть меня «директор Цубаса»."
10053020-50 = "[ns7] «Директор...?»\n[ns8] «Рэна...?»"
10053020-53 = ""
10053020-54 = ""
10053020-55 = "Послушайте, я знаю, о чём вы думаете... Но она не настолько странная, как кажется. Я-то знаю."
10053020-56 = "Это просто образ для стримов. «Институт паранормальных исследований Мо» — название её канала."
10053020-57 = "Так что это вроде её фишки."
10053020-58 = "«Фишка»? Ты ранишь меня, Рэна."
10053020-59 = "Наш исследовательский институт — единственная организация, применяющая научную методологию для изучения паранормальной активности в Кивотосе."
10053020-60 = "Во-первых, нет никакого «нашего» и никакой «организации». Там только ты."
10053020-61 = "Э-Это... Есть сложная причина, почему всё выглядит именно так."
10053020-62 = "И главное, Сенсей! Не хочу, чтобы вы неправильно поняли!"
10053020-63 = "Паранормальные исследования — не псевдонаука!"
10053020-64 = "А-а-а... Опять начинается..."
10053020-65 = ""
10053020-67 = ""
10053020-68 = "Паранормальные явления не просто существуют по всему Кивотосу — они происходят локально и довольно часто. Уверена, вы знакомы с этим."
10053020-69 = "Недавно в Миллениуме произошло нечто совершенно ВЫДАЮЩЕЕСЯ. Вы знаете об этом, Сенсей?"
10053020-70 = "[s] «...!»"
10053020-71 = ""
10053020-73 = ""
10053020-74 = ""
10053020-75 = "О... Я читаю по вашему лицу. Вы подозреваете, что ТОЧНО знаете, о чём я говорю, да?"
10053020-76 = "Полагаю, это логично. Событие было настолько прорывным и невероятным, что было бы странно, если бы Сенсей из Шале о нём не знал."
10053020-77 = "Именно. Я говорю о случае наблюдения НЛО в Восточных Альпах Миллениума!"
10053020-78 = "[ns9] «...А?»\n[ns10] «Восточные Альпы, что...?»"
10053020-81 = ""
10053020-82 = ""
10053020-83 = "По свидетельствам очевидцев, ранним утром неопознанный белый дискообразный объект, окружённый светом, свободно летал, игнорируя известные законы ускорения!"
10053020-84 = "Это всего лишь гипотеза, но нельзя отрицать, что описанный летающий объект звучит как архетипичное наблюдение НЛО в духе Адамски!"
10053020-85 = "Некоторые говорят, что из-за шаблонного и, осмелюсь сказать, КЛИШИРОВАННОГО вида аппарата это обман или ошибка подтверждения. Я с такими утверждениями не согласна."
10053020-86 = "НЛО существуют!"
10053020-87 = ""
10053020-89 = ""
10053020-90 = ""
10053020-91 = "Нельзя отрицать доказательства. Есть множество независимых показаний очевидцев, согласующихся между собой."
10053020-92 = "Если бы могла, я бы сама посетила места наблюдений и попыталась установить контакт. К сожалению, я не могу свободно перемещаться по территории Миллениума... по... какой-то причине..."
10053020-93 = "[s11] «Общаться с НЛО...?»\n[s12] «Рэна...?»"
10053020-96 = "Да ладно... Она странная! Но это совсем не то же самое, что Оккультное общество!"
10053020-97 = "Она гораздо реалистичнее и рациональнее моих соседок по комнате, и мы на удивление хорошо ладим..."
10053020-98 = "Стоп, почему я вообще сейчас оправдываюсь?"
10053020-99 = ""
10053020-101 = ""
10053020-102 = "Директор Мо, может, и не выглядит так, но она довольно известна в этой сфере."
10053020-103 = "Она каждый день без пропусков выкладывает видео с городских исследований. Вы бы НЕ ПОВЕРИЛИ, в какие заброшенные здания она незаконно пробиралась!"
10053020-104 = "Нет, такой сферы не существует. И... она не НАСТОЛЬКО известна."
10053020-105 = "Она исследует только заброшенные здания, где ничего не происходит. Просмотров и подписчиков почти нет."
10053020-106 = ""
10053020-107 = "[ns13] «Ты каждый день исследуешь заброшенные здания...?»\n[ns14] «И у тебя ещё остаётся время на учёбу...?»"
10053020-111 = ""
10053020-112 = "К-Конечно остаётся! Каждый студент Миллениума серьёзно относится к занятиям. Особенно к математике!"
10053020-113 = "...? Ты из Миллениума?"
10053020-114 = "А? Разве я не упоминала?"
10053020-115 = "Нет, не упоминала... Я удивлена. Думала, студенты Миллениума не верят в такое."
10053020-116 = "В какое «такое»?"
10053020-117 = "Ну, понимаешь. Цучиноко, йети..."
10053020-118 = "...или магию."
10053020-119 = "О. Как студент Миллениума я не могу оставить это без ответа."
10053020-120 = "Ни одна теория не была доказана с самого начала. Каждое предположение проходило научный метод, интерпретацию и проверку, прежде чем в итоге стать общепринятой истиной."
10053020-121 = "...А?"
10053020-122 = ""
10053020-124 = ""
10053020-125 = "Иными словами, отрицать возможность лишь потому, что она пока не доказана, значит отрицать саму ОСНОВУ натурфилософии, созданной человечеством."
10053020-126 = "Более того, даже Миллениум — центр передовой современной науки — имеет собственные тайны. Достаточно взглянуть на неизведанные Руины по соседству."
10053020-127 = "Паранормальными исследованиями должны заниматься учёные, а не отвергать их как суеверное табу."
10053020-128 = "И хотя более КОНСЕРВАТИВНЫЕ и НЕЛЮБОЗНАТЕЛЬНЫЕ исследователи считают эту область «псевдонаукой», я считаю..."
10053020-129 = ""
10053020-131 = ""
10053020-132 = ""
10053020-133 = "А... Ты и правда студент Миллениума."
10053020-134 = "Мои соседки по комнате говорят похожие вещи — хоть и с немного другим пылом."
10053020-135 = "И всё же мы все на одной стороне, потому что нас объединяет одно и то же любопытство!"
10053020-136 = "Возможно, у нас есть что-то общее, Рэна. В конце концов, ты тоже здесь и ищешь Цучиноко."
10053020-137 = "...А. Я здесь не поэтому."
10053020-138 = "Хм?"
10053020-139 = ""
10053020-141 = ""
10053020-142 = "Чтобы не было недопонимания, скажу предельно ясно."
10053020-143 = "Я НЕ верю в Цучиноко!!"
10053020-144 = ""
10053020-147 = ""
10053020-149 = "[ns15] «...Ну конечно, не веришь.»\n[ns16] «Я всё прекрасно понимаю.»"
10053020-153 = "Эй! Это ещё что значит?"
10053020-154 = "Вообще-то, думаю, это мы должны спросить тебя о том же."
10053020-155 = "Если ты не веришь в Цучиноко, тогда зачем участвуешь в этой экспедиции?"
10053020-156 = "Ну, потому что..."
10053020-157 = ""
10053020-159 = ""
10053020-160 = ""
10053020-161 = "*вздох*... Сенсей уже знает, но мои соседки по комнате... своеобразные. Можно сказать, фанатки оккультизма."
10053020-162 = "Просто представьте: они листают ленту, находят какого-нибудь чудака, который утверждает, что видел Цучиноко. Сразу становятся такими самодовольными и объявляют это доказательством оккультизма, искусства или чего там ещё!"
10053020-163 = "Поэтому я опережу их!"
10053020-164 = "Все эти свидетели, скорее всего, видели какую-нибудь плоскую ящерицу или змею, проглотившую хот-дог."
10053020-165 = "Если я найду источник всей этой ерунды и докажу, как появились ложные слухи, им придётся меня выслушать."
10053020-166 = "...Хотя интересно, хватит ли этого, чтобы привести их в чувство."
10053020-167 = "[s17] «...Ну конечно, именно поэтому.»\n[s18] «Я всё прекрасно понимаю.»"
10053020-170 = "Я ЖЕ только что сказала, что всё не так...!"
10053020-171 = ""
10053020-173 = ""
10053020-174 = ""
10053020-175 = "Постойте. Я не могу позволить человеку с такими нечистыми мотивами участвовать."
10053020-176 = "Наша цель — подтвердить существование легендарного криптида Цучиноко."
10053020-177 = "Верно!"
10053020-178 = "А затем... доказать, что на САМОМ ДЕЛЕ это инопланетный разведывательный дрон!"
10053020-179 = "...А? Это... правда то, чем мы занимаемся?"
10053020-181 = "Нет, не правда! Хватит впихивать сюда свою странную одержимость."
10053020-182 = "Мы здесь... чтобы выяснить, существует ли Цучиноко!"
10053020-183 = "Ах, а-а... Понятно. Возможно, для любителя это было слишком внезапно."
10053020-184 = "Но внеземные исследования — не то, что я только что выдумала. Ими активно занимаются в академической среде."
10053020-185 = "Статья на эту тему вышла в свежем выпуске «New Pyramid Future», известного научного журнала Красной Зимы."
10053020-186 = "В этой псевдонаучной макулатуре?!"
10053020-187 = "Сенсей, этот журнал — просто сборник конспирологических статей, которые отвергли все издатели Миллениума. Они ПЛАТЯТ, чтобы печататься в Красной Зиме!"
10053020-188 = "Ты ошибаешься. Это элита Семинара цензурирует правду. Именно академическая среда Миллениума продвигает только СВОЮ версию «официальной науки»..."
10053020-189 = "Но всё же, Рэна... Для такого скептика ты удивительно хорошо разбираешься в теме."
10053020-190 = "Даже некоторые давние подписчики не знают столько о предыстории журнала..."
10053020-191 = "...!"
10053020-192 = "...Понятно. Похоже, ты тоже эксперт. Пришла сюда, вооружившись собственными теориями."
10053020-193 = "Хорошо. Я принимаю твой вызов. Если хочешь поспорить..."
10053020-194 = "...Мой аргумент остаётся прежним. Цучиноко — это замаскированный инопланетный дрон."
10053020-195 = "Её неестественный вид — результат небрежной попытки имитировать местные формы жизни из иной гравитационной среды. А её неуловимость отражает цель разведывательного дрона: тихое наблюдение."
10053020-196 = "А, знаете... Я очень надеялась, что мы ищем НАСТОЯЩУЮ змею."
10053020-197 = "Я и этого не исключаю. Возможно всё."
10053020-198 = "Мне не терпится узнать, чья интерпретация окажется точнее. Эта экспедиция обещает быть интересной!"
10053020-199 = ""
10053020-201 = ""
10053020-202 = ""
10053020-203 = "«Интерпретация»? Я, ну..."
10053020-204 = "*вздох* Неважно. По крайней мере, мы все ищем одно и то же."
10053020-205 = "...Я одна нормальная во всём Кивотосе?"
10053020-206 = "[ns19] «...Ну конечно, ты.»\n[ns20] «Я всё прекрасно понимаю.»"
10053020-209 = ""
10053020-211 = "ШЬЯАА!! Прекратите!!"
