[translation]
2601205-1 = "Общая спасательная подготовка"
2601205-2 = ""
2601205-3 = "Сенсей, вы пришли!"
2601205-4 = "После всех усилий и всего, через что мне пришлось пройти, чтобы соответствовать требованиям для сертификации спасателя..."
2601205-5 = "Для меня честь показать вам результаты своих тренировок!"
2601205-6 = "[s1] «Я этого ждал.»\n[s2] «Не могу дождаться!»"
2601205-9 = "Надеюсь, вы готовы!"
2601205-10 = "Итак, вот наш старый пятикилограммовый груз — наш «утопающий». Бросайте его в воду!"
2601205-11 = "Изо всех сил!"
2601205-12 = ""
2601205-14 = ""
2601205-15 = "[ns] «Хия!»"
2601205-19 = "Кто-то упал в воду! Спасатель Кирино уже идёт!"
2601205-20 = ""
2601205-22 = ""
2601205-25 = "[ns] «(Хорошо, теперь осталось только принести его обратно и...)»"
2601205-26 = "*бульк* *бульк* *вдох*"
2601205-27 = "*кашляет*"
2601205-28 = "[s3] «(Не очень хорошо.)»\n[s4] «(У меня плохое предчувствие...)»"
2601205-31 = ""
2601205-32 = "Уф!"
2601205-33 = "У меня никак не получалось нормально двигаться..."
2601205-34 = ""
2601205-35 = "Но не волнуйтесь, с СЛР я точно справлюсь!"
2601205-36 = "Хия!"
2601205-37 = ""
2601205-44 = "[ns5] «Э-Эй, я знаю, что нужно давить сильно, но...»\n[ns6] «Это же не может быть полезно для манекена.»"
2601205-47 = ""
2601205-48 = "Нажатия на грудную клетку должны быть СИЛЬНЫМИ, чтобы поддерживать кровообращение!"
2601205-49 = "Раз! Раз! Раз! Раз!"
2601205-50 = "[s] «Кирино, давай на секунду остановимся—»"
2601205-51 = ""
2601205-55 = "[ns] «Ого!»"
2601205-58 = "Сенсей!!"
2601205-59 = ""
2601205-64 = "― [log=키리노 수영복]Сенсей![/log][wa:610]"
2601205-65 = "― [log=키리노 수영복]Вы в порядке?![/log][wa:790]"
2601205-68 = "― [log=키리노 수영복]Слава богу, вы открыли глаза.[/log][wa:1600]"
2601205-69 = "― [log=키리노 수영복]Вы меня на секунду напугали. [/log][wa:2830]"
2601205-72 = "― [log=키리노 수영복]Похоже, СЛР [/log]"
2601205-73 = "― [log=키리노 수영복]не понадобится.[/log][wa:1560]"
2601205-76 = "[ns7] «Я просто пропустила один шаг.»\n[ns8] «Крошечная оплошность.»"
2601205-79 = "― [log=키리노 수영복]Находясь рядом с водой, всегда нужно внимательно следить за обстановкой![/log][wa:1400]"
2601205-82 = "― [log=키리노 수영복]Даже самый умелый пловец[/log]"
2601205-83 = "― [log=키리노 수영복]в любой момент может столкнуться с неожиданной ситуацией.[/log][wa:1840]"
2601205-86 = "― [log=키리노 수영복]Конечно, когда на дежурстве такой спасатель, как я, волноваться не о чем![/log][wa:2020]"
2601205-89 = "― [log=키리노 수영복]Я всегда буду внимательно следить за всем вокруг. Вы в безопасности![/log][wa:1120]"
2601205-92 = ""
2601205-93 = "Фух! Хорошо, что ничего серьёзного не случилось."
2601205-94 = "Хотя тренировка пошла не по плану..."
2601205-95 = "Груз теперь на дне бассейна, а манекен... слегка развалился."
2601205-96 = "Я хотела показать результаты тренировок, но всё испортила."
2601205-97 = "[s] «Не переживай, я прекрасно увидел, чему ты училась.»"
2601205-98 = "А? В смысле?"
2601205-99 = "[s] «Ты провела идеальную спасательную операцию.»"
2601205-100 = ""
2601205-103 = "[ns] «Это доказательство того, чему ты научилась как спасатель.»"
2601205-104 = "Я-я просто увидела, как вы упали, и сразу прыгнула следом. Даже не успела подумать."
2601205-105 = "Но ведь я вас вытащила, а вы намного тяжелее того груза..."
2601205-106 = ""
2601205-108 = ""
2601205-109 = "Знаете, может, вы и правы, Сенсей."
2601205-110 = "Я действительно стала лучше и даже сама этого не заметила."
2601205-111 = "Спасибо, Сенсей! Благодаря вам теперь я знаю, что справлюсь!"
2601205-112 = ""
2601205-114 = ""
2601205-115 = ""
2601205-116 = "С этого момента зовите меня Спасатель Кирино!"
