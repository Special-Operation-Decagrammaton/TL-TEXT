1001106-15 = "Сделай и мне «Выше и выше», Сенсей!"
1001106-16 = "[s] «Все по очереди. Не волнуйтесь.»"
1001106-17 = "Хахаха. Как здорово! Так высоко!"
1001106-18 = "Теперь моя очередь!"
