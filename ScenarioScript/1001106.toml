1001106-45 = "Если честно... под мышками у меня довольно щекотно."
1001106-46 = "Наверное, это ещё одна причина, почему такая игра не подходит взрослым."
1001106-47 = "Не думала, что «Выше и выше» может быть настолько смущающей..."
