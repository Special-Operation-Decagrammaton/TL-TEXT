[translation]
1007405-1 = "Неожиданно неловкая"
1007405-4 = "Я сидел на пляже, пока солнце понемногу садилось."
1007405-5 = ""
1007405-8 = "Пока я смотрел на закат, послышались приближающиеся шаги."
1007405-9 = "[ns1] «Привет, Ханако.»\n[ns2] «Ты и правда пришла.»"
1007405-12 = "Вы действительно здесь. Поначалу я не совсем вам поверила."
1007405-13 = "Оп-ля..."
1007405-14 = "[ns3] «Ты садишься прямо рядом со мной?»\n[ns4] «Как ловко ты подсела ко мне.»"
1007405-17 = "А это проблема? Я думала, к этому моменту мы уже стали ближе. Моё сердце... разбито!"
1007405-18 = ""
1007405-20 = ""
1007405-21 = "Шучу. Хи-хи."
1007405-22 = "Но вы ведь всегда простите своего драгоценного студента, правда?"
1007405-23 = "Считайте это милой маленькой шалостью одной из ваших любимиц."
1007405-24 = "Если не простите меня, это будет очень жестоко и совсем не по-учительски."
1007405-25 = ""
1007405-28 = "Хи-хи..."
1007405-29 = "...Вот это мой Сенсей."
1007405-30 = "Не могу поверить, что вы всё это время держали такой вид только для себя."
1007405-31 = ""
1007405-34 = "Золотое сияние неба отражается от океана..."
1007405-35 = "Я никогда не видела такого заката."
1007405-36 = "Мне очень повезло отправиться в эту поездку. Кажется, я стала гораздо ближе со всеми, кто приехал вместе с нами."
1007405-37 = "...Хм? Это ведь я всё организовала?"
1007405-38 = "Ну, да, я, но такие поездки далеко не всегда проходят настолько удачно."
1007405-39 = "Учитывая результат, думаю, это вполне можно назвать счастливым случаем."
1007405-40 = "И ничего этого не получилось бы без вас, Сенсей."
1007405-41 = "..."
1007405-42 = "Хм..."
1007405-43 = "Эм... хм..."
1007405-44 = "Сенсей...?"
1007405-45 = "[s5] «Ты хочешь что-то сказать, да?»\n[s6] «Стесняться — это на тебя не похоже, Ханако.»"
1007405-48 = "Х-Хм? Не думала, что меня так легко прочитать, но, видимо, у вас в этом немало практики."
1007405-49 = "Хи-хи."
1007405-50 = "И всё же вам не кажется, что ваши вопросы немного лишены такта? Если бы вы так прямо расспрашивали застенчивого, робкого студента, вы бы его спугнули."
1007405-51 = "[s7] «Наверное, но ты не такая.»\n[s8] «Я меняю вопросы в зависимости от того, с кем говорю.»"
1007405-54 = "Хм-м... Понятно..."
1007405-55 = "Вот как вы это видите."
1007405-56 = "Вообще-то я немного разочарована. Не знала, что наше сближение повлечёт за собой такие... недостатки."
1007405-57 = "[s9] «Один студент сказал мне, что здесь я могу быть настолько честным, насколько захочу.»\n[s10] «Уверен, скоро ты с этим смиришься.»"
1007405-58 = "*вздох* Вы правда побеждаете меня в моей же игре. Давно такого не было."
1007405-59 = "Куда бы я ни повернула, вы всё равно на шаг впереди."
1007405-60 = ""
1007405-62 = ""
1007405-63 = "...Хи-хи."
1007405-64 = "Хи-хи-хи..."
1007405-65 = "Вы ведь не ошибаетесь. Не знаю, почему я сейчас так тяну время."
1007405-66 = "...Хм."
1007405-67 = "Эм..."
1007405-68 = "М-м-м..."
1007405-69 = "[ns] Ничего не говорить и подождать."
1007405-70 = ""
1007405-71 = "Сенсей..."
1007405-72 = "..."
1007405-73 = "...Спасибо."
1007405-74 = "...За сейчас, за всё, что было до этого... За всё."
1007405-75 = "Я даже мечтать не могла о том, что так весело проведу время со всеми. И всё благодаря вам."
1007405-76 = "Наверное, вам это и объяснять не нужно, но, вопреки распространённому мнению, я на самом деле довольно неуклюже обращаюсь со многими вещами."
1007405-77 = "Даже сейчас — честно говорить вам о своих чувствах — для меня способ стать увереннее."
1007405-78 = "Хотя, Сенсей, я уже множеством других способов давала этим чувствам вырваться наружу. И ни один из них, похоже, не пробился через вашу толстую черепушку."
1007405-79 = "Я хотела поблагодарить вас и убедиться, что вы понимаете, как сильно я ценю всё, что вы делаете. И не только в этой поездке."
1007405-80 = "..."
1007405-81 = "Какое облегчение! Теперь, когда я это сказала, я рада, что решилась рассказать вам о своих чувствах."
1007405-82 = "Чем больше я об этом думаю..."
1007405-83 = "Я рада, что приехала сюда."
1007405-84 = "О! Простите за такое одностороннее признание."
1007405-85 = "А вы, Сенсей? Вам было... хотя бы немного весело?"
1007405-86 = "[s11] «С тобой — всегда, Ханако.»\n[s12] «Спасибо. За то, что рассказала мне о своих чувствах.»"
1007405-89 = "...Хи-хи. Почему я так радуюсь?"
1007405-90 = "Тогда, Сенсей..."
1007405-91 = ""
1007405-93 = ""
1007405-94 = ""
1007405-96 = "Пожалуйста, продолжайте заботиться обо мне и после нашего возвращения."
