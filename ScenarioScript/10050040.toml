[translation]
10050040-1 = "Эпизод 4;Тайная операция"
10050040-2 = ""
10050040-3 = "Ну что, за ещё один отличный день продаж!"
10050040-4 = ""
10050040-5 = ""
10050040-6 = ""
10050040-7 = ""
10050040-8 = ""
10050040-9 = "Президент? Мне кажется... или студенток стало намного больше, чем вчера?"
10050040-10 = "Ты права... Что-то изменилось. И форма у них чёрная..."
10050040-11 = ""
10050040-13 = ""
10050040-14 = ""
10050040-15 = ""
10050040-16 = ""
10050040-17 = ""
10050040-18 = ""
10050040-19 = "Студентки Тринити... тоже не выглядят счастливыми от их присутствия."
10050040-20 = "Может, сравнение не самое точное, но это напоминает мне, как наши студентки реагируют на появление Секретариата."
10050040-21 = "Эх, наверняка к нам это не имеет никакого отношения. Какие-нибудь внутренние дела Тринити. Давай, нам книги продавать."
10050040-22 = "Продолжаем зарабатывать!"
10050040-23 = ""
10050040-28 = "О, вот ты где!"
10050040-29 = ""
10050040-31 = ""
10050040-32 = ""
10050040-35 = "О? А ты кто?"
10050040-36 = "Тсс. Говори тише и иди за мной."
10050040-37 = "А? Что? Что это...?"
10050040-42 = "Какой-то спортзал"
10050040-43 = "*тяжело дышит* *тяжело дышит* Почему ты так спешишь...?"
10050040-44 = "Где мы? И что студентки Тринити...?"
10050040-45 = "Ещё чуть-чуть."
10050040-46 = "Все! Они здесь! Теперь безопасно!"
10050040-47 = ""
10050040-51 = ""
10050040-52 = ""
10050040-53 = ""
10050040-54 = "Что вообще...?"
10050040-55 = "...Для начала не могли бы вы объяснить нам ситуацию?"
10050040-56 = "Да, теперь можно говорить. Дело в тех студентках, которых вы видели по пути сюда, в чёрной форме."
10050040-57 = "Это Комитет правосудия... что-то вроде дисциплинарного отряда, который отвечает за безопасность Тринити и следит, чтобы студентки соблюдали правила."
10050040-58 = "Конечно, они все очень стараются, но ходят слухи, что президент Комитета правосудия может сложить человека, как смятую банку..."
10050040-59 = "Добавь немного коррупции и перекладывания вины — и получится почти Секретариат..."
10050040-60 = "Н-Но почему эти люди так...?"
10050040-61 = "Потому что... Комитет правосудия ищет вас."
10050040-62 = "Ради нас...?"
10050040-63 = "Полагаю, естественный вопрос — почему, но я могу назвать несколько причин."
10050040-64 = "Короче говоря, с сегодняшнего утра вы двое официально разыскиваемые преступницы."
10050040-65 = ""
10050040-67 = ""
10050040-68 = "Публично об этом ещё не объявляли, но здесь слухи расходятся быстро."
10050040-69 = "Мы смогли подтвердить, что Комитет правосудия действительно вас разыскивает."
10050040-70 = "И, судя по слухам, приказ поступил напрямую от Чаепития."
10050040-71 = "«Чаепитие»...? Звучит довольно... мило."
10050040-72 = "Ну..."
10050040-74 = "В-Вы хотите сказать... что триумвират студенческого совета Тринити... охотится за нами?"
10050040-75 = "...Другими словами, будто президент Черно выписала ордер на наш арест."
10050040-76 = "Нет-нет. Будь это она, я бы знала сто один способ выкрутиться."
10050040-77 = "Именно поэтому я с самого начала была против этого плана, Президент!"
10050040-78 = "Ещё ничего не кончено, Таканэ! Оглянись."
10050040-79 = "Если бы студентки Тринити хотели от нас избавиться, разве они уже не сдали бы нас Комитету правосудия?"
10050040-80 = "П... полагаю, да."
10050040-81 = "Если они найдут вас двоих... Скорее всего, вас запретят. Навсегда."
10050040-82 = "Все заработанные вами деньги конфискуют."
10050040-83 = "Так нельзя! Это подавление экономической деятельности!"
10050040-84 = "И ещё конфискуют книги, которые вы привезли..."
10050040-85 = "Так нельзя! Это подавление культурной деятельности!"
10050040-86 = "Именно. Мы думаем так же, поэтому и привели вас сюда!"
10050040-87 = "Кстати, а что это за место?"
10050040-88 = "Спасибо, что спросили. Это..."
10050040-89 = "...Секретная база Леди Тринити!"
10050040-90 = "Они называют себя Леди Тринити?!"
10050040-91 = "Президент, тише!"
10050040-92 = "Мы освободили спортзал, которым никто не пользовался, и устроили здесь своё место."
10050040-93 = "Разумеется, Комитет правосудия вообще не знает о его существовании."
10050040-94 = "Мы все держали это в секрете между собой. Поэтому и «секретная база»."
10050040-95 = ""
10050040-97 = ""
10050040-98 = "В этой школе повсюду переплетены тайны и интриги... Страшная Тринити. По-настоящему страшная..."
10050040-99 = "Говорить такое от лица Издательского отдела немного похоже на самобичевание..."
10050040-100 = "И всё же это само по себе возможность."
10050040-101 = "Ничто не продаётся лучше запрещённого! Подавление — словно медаль для культуры!"
10050040-102 = "Даже если сама сцена ничего особенного, стоит её подвергнуть цензуре — и это уже реклама, продажи взлетают в несколько раз!"
10050040-103 = "К слову о медалях, я вспомнила Медаль Усов..."
10050040-104 = "Вот она и правда бесполезная..."
10050040-105 = "В любом случае, мы вас услышали ясно и чётко."
10050040-106 = "Да. Спасибо, что привели нас в ваше безопасное место."
10050040-107 = "Ну что ж... Может, начнём сегодняшнюю... торговую сессию?"
10050040-108 = ""
10050040-110 = ""
10050040-111 = "Сцена готова..."
10050040-112 = "...Могу я попросить нас начинать, Таканэ? Хе-хе-хе."
10050040-113 = "...Это правда необходимо?"
10050040-114 = "Ради маркетинга, Таканэ. Ради маркетинга!"
10050040-115 = "Я даже думать об этом не могу без чувства стыда."
10050040-116 = "Смотри на это так, Таканэ. Всё это ради продвижения культурной деятельности!"
10050040-117 = "У-Ух... Х-Хорошо, Президент..."
10050040-119 = ""
10050040-120 = ""
10050040-121 = ""
10050040-122 = ""
10050040-123 = ""
10050040-124 = "Привет, Кохару. Кажется, давно не виделись."
10050040-125 = "Д-Да... Наверное... Сегодня я видела много членов Комитета. Что-то случилось?"
10050040-126 = "Ну... Эм... Похоже, среди студенток распространяется какая-то странная книга."
10050040-127 = "Нам приказали найти источник и выяснить масштаб операции."
10050040-128 = "Официально это подают как помощь Комитета правосудия операции Библиотечного комитета."
10050040-129 = "Но некоторые говорят, что на самом деле это прямой приказ Чаепития..."
10050040-130 = "П-прямой приказ?! Всё настолько серьёзно?!"
10050040-131 = "Наверное..."
10050040-132 = "Знаешь, кажется... я что-то слышала об этой книге..."
10050040-133 = "Правда? У тебя есть зацепка?"
10050040-134 = "Н-Нет. Я правда только краем уха слышала..."
10050040-135 = "Ох, жаль. Если всё-таки узнаешь что-нибудь полезное, обязательно сообщи мне!"
10050040-136 = "Для нас необычно начинать такую операцию вообще без разведданных."
10050040-137 = "Х-Хотя я всё ещё только на первом курсе, так что мне особо не с чем сравнивать."
10050040-138 = "Но даже так кажется, будто сверху систематически пытаются скрыть, что происходит на самом деле."
10050040-139 = "Э-Эм, да. Посмотрю, что смогу найти. Но вы правда не нашли... вообще ничего?"
10050040-140 = "Вообще-то нашли! Нам удалось получить несколько экземпляров, похожих на образцы первой и второй книг."
10050040-141 = "К-Как они? М-Можно посмотреть?"
10050040-142 = "А? Ну... Раз ты тоже была членом Комитета, Кохару, и, думаю, уже почти все это видели..."
10050040-143 = "Вот."
10050040-144 = "Посмотрим..."
10050040-145 = ""
10050040-147 = ""
10050040-148 = "А-А-А-А?!"
10050040-149 = ""
10050040-151 = ""
10050040-153 = "К-Кохару?! Кохару?!?!"
10050040-155 = "Н-Ну... Эм, правда, честно, не потому что я хочу это читать или что-то такое..."
10050040-156 = "...а ТОЛЬКО чтобы лучше помогать Комитету правосудия..."
10050040-157 = "...У вас есть следующая?"
10050040-158 = "Пока нет..."
10050040-159 = "Хочешь оставить эту себе? У меня есть ещё, так что можно."
10050040-160 = "С-Спасибо. Тогда... Если найдёшь что-нибудь во время расследования... м-можешь показать мне?"
10050040-161 = "Я-я тоже буду очень-очень стараться искать!"
10050040-162 = "Да. Конечно. Спасибо за сотрудничество. Тогда удачи!"
10050040-163 = "Х-Хорошо. Я постараюсь...!"
10050040-164 = ""
10050040-166 = ""
10050040-167 = "..."
10050040-168 = ""
10050040-170 = ""
10050040-172 = "У-У меня правда нет никаких скрытых мотивов...! Я ведь... стану элитным членом Комитета правосудия!"
10050040-173 = "В-В любом случае, что мне теперь делать с этим...?"
10050040-174 = "Погодите... Если это совместная операция Комитета правосудия и Библиотечного комитета...?"
10050040-176 = "Клубная комната Комитета правосудия"
10050040-177 = "*вздыхает*"
10050040-178 = "[s] «Ты выглядишь измотанной...»"
10050040-179 = "Прошу прощения, Сенсей. Это не лучшая демонстрация наших способностей."
10050040-180 = "Но нам правда очень тяжело найти хоть какие-то зацепки."
10050040-181 = "Мы не ожидали такого общего нежелания студенток сотрудничать."
10050040-182 = "На каждый вопрос они отвечали: «Не знаю», или быстро меняли тему."
10050040-183 = "Я подумала и, кажется, поняла почему. Возможно, эта книга испускает злые волны..."
10050040-184 = "...и околдовывает всех студенток Тринити."
