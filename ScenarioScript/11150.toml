[translation]
11150-2 = "Эпизод 15;Уезжаем навстречу закату!"
11150-3 = "Центр города"
11150-5 = ""
11150-6 = ""
11150-7 = ""
11150-8 = "Фух, теперь-то можно их снять, да? В них уже совсем душно."
11150-9 = "Нужно продолжать движение. Скоро они нас догонят."
11150-10 = "Хошино права. С каждой минутой они перекрывают всё больше дорог."
11150-11 = "Всё спланировано и учтено, так что не волнуйтесь! ☆"
11150-12 = "Сюда. Быстрее."
11150-13 = "Эй, Широко... почему ты всё ещё в ней? Разве не жарко?"
11150-14 = "Наверное, не хочет снимать, потому что с этой маской открыла своё истинное призвание. Похоже, теперь это часть её души."
11150-15 = "Слава богу, Широко оказалась в Абидосе. Поступи она в другую школу, наверняка стала бы криминальным гением."
11150-16 = ""
11150-17 = ""
11150-18 = "Не уверена..."
11150-20 = "...?!"
11150-21 = ""
11150-22 = ""
11150-23 = "..."
11150-25 = "Вы миновали баррикаду. Теперь вы должны быть в безопасности."
11150-26 = "Отлично! Получилось!"
11150-27 = "*вздыхает* Не могу поверить, что вы действительно ограбили банк Чёрного рынка..."
11150-28 = "Широко. Транспортные журналы у тебя, да?"
11150-29 = "Эм... Они в мешке."
11150-30 = ""
11150-31 = "*щелчок*"
11150-32 = "А? Что это всё такое...? Это пачки денег?!"
11150-33 = "Ч-ЧТО?! Широко, ты вместо документов взяла деньги?!"
11150-34 = "Нет... Я попросила журналы, как мы и планировали. Это сотрудник банка всё неправильно понял и отдал нам деньги."
11150-35 = "Так... На вид здесь как минимум 100 миллионов иен.#nОго, мы и правда ограбили их на 100 миллионов всего за пять минут!"
11150-36 = "Отличная работа! Чего вы все друг на друга уставились? Забираем!"
11150-37 = "..."
11150-38 = ""
11150-39 = "П-погодите! Вы собираетесь оставить эти деньги себе?!"
11150-40 = "А что не так, Аяне? Это наш шанс погасить долг."
11150-41 = "Но тогда мы действительно станем обычными преступниками, Сэрика!"
11150-42 = "Это мы проливали кровь, пот и слёзы, чтобы заработать эти деньги! А этот мерзкий банк решил пустить их на преступления!"
11150-43 = "Эти деньги пошли бы на новое оружие, патроны и бог знает что ещё для настоящих преступников! Ну украли мы у преступников. И что? Кому от этого вред?!"
11150-44 = "..."
11150-45 = "Я согласна с Сэрикой. Всё равно эти деньги только финансировали бы новые преступления.#nЧто бы мы с ними ни сделали, это будет куда полезнее."
11150-46 = "Вот! Я же говорила! И долг Абидоса они точно помогут уменьшить!"
11150-47 = "Хм. Это правда... Что думаешь, Широко?"
11150-48 = "Ты всё равно скажешь «нет», так что обсуждать это бессмысленно."
11150-49 = "Что?!"
11150-50 = "На тебя всегда можно положиться — ты отлично знаешь, о чём я думаю, Широко."
11150-51 = "Нам нужны документы! Не деньги."
11150-52 = "Если сегодня мы переступим эту черту, потому что «мы против преступников», то что будет в следующий раз? А потом?"
11150-53 = "..."
11150-54 = "Если мы привыкнем так рассуждать, скоро вообще перестанем видеть эту черту."
11150-55 = "..."
11150-56 = "А потом однажды случится большой кризис, и мы сделаем то, чего делать действительно нельзя, оправдываясь тем, что у нас не было выбора."
11150-57 = "Я не хочу, чтобы мои милые младшие дошли до такого."
11150-58 = "Да и какой смысл защищать школу, если мы будем делать это таким способом?"
11150-59 = "..."
11150-60 = "Если уж идти таким путём, можно было просто погасить долг золотой картой Нономи."
11150-61 = "Вообще-то я предлагала такой вариант, но вы были против..."
11150-62 = "Я понимаю. Если погасить долг Абидоса нечестным способом, мы просто расплатимся за него тем, что окажемся обязаны чему-то другому..."
11150-63 = "Хе. Примерно так."
11150-64 = "Поэтому мешок оставляем. Берём только документы. Приказ президента."
11150-65 = ""
11150-67 = "Да вы издеваетесь! Вы хотите просто бросить все эти деньги?!#nИменно сейчас вам приспичило проявлять принципиальность?!"
11150-68 = "Ты слышала. Приказ президента."
11150-69 = "Я не могу притворяться, будто до конца понимаю, каково вам в ситуации Абидоса...#nно я точно знаю: если вы возьмёте эти деньги, всё станет только хуже."
11150-70 = "Думаю, потом вы бы об этом пожалели."
11150-71 = "Ну, похоже, выбора у нас особо нет, да?#nЯ просто избавлюсь от мешка где-нибудь в неприметном месте."
11150-72 = "Спасибо."
11150-73 = "Погодите! К вам кто-то направляется!"
11150-74 = "Это охрана Чёрного рынка за нами?!"
11150-75 = "Нет, не похоже. Кто бы это ни был, враждебности я не вижу."
11150-76 = ""
11150-77 = "Секунду. Я знаю этот сигнал. Это...?"
11150-78 = "Э-это Ару из «Решалы 68»!"
11150-81 = "*тяжело дышит* *тяжело дышит* П-погодите!"
11150-82 = "*снова надевает маску*"
11150-83 = ""
11150-84 = "Погодите! Я не пришла драться."
11150-85 = "(Что ОНА здесь делает?)"
11150-86 = "(Атаковать?)"
11150-87 = "(Не знаю. Похоже, первой она нападать не собирается.)"
11150-88 = "(Вы все её знаете?)"
11150-89 = "(Хе. Мы давно знакомы.)"
11150-90 = "Так, эм... Я просто хотела сказать..."
11150-91 = "Я видела, как вы ограбили тот банк. Не могу поверить, что вы ограбили банк Чёрного рынка и ушли всего за пять минут! Такие преступники, как вы, рождаются раз в поколение."
11150-92 = "...?!"
11150-93 = "Если честно, это произвело на меня огромное впечатление. Такая дерзость сейчас редкость. Скажем так... вы меня вдохновили."
11150-94 = "Я-я буду продолжать стараться и однажды стану такой же преступницей, как вы! Настоящим свободным духом, которого не ограничивают никакие правила и законы!"
11150-95 = "(Что за чушь она несёт...?)"
11150-96 = "П-поэтому, пожалуйста...! Хотя бы скажите мне ваше имя!"
11150-97 = "Имя...?"
11150-98 = "Ну, как называется ваша группа? Или фракция, или клуб? Настоящие имена мне не нужны... но я хочу знать, кем именно восхищаюсь!"
11150-99 = "(Эм, кажется, она совершенно неправильно всё поняла...)"
11150-100 = "А-а, теперь понятно! Конечно, мы с радостью скажем!"
11150-101 = "(Н-Нономи?!)"
11150-102 = "Мы... Банда в масках и купальниках!"
11150-103 = "Ты сказала... «Банда в масках и купальниках»?!"
11150-104 = "Это название такое... такое... КРУТОЕ! Мне нравится!"
11150-105 = "(...)"
11150-106 = "Вообще-то вместе с масками мы должны носить купальники,#nно так спешили, что захватили только маски."
11150-107 = "(Теперь она просто выдумывает на ходу.)"
11150-108 = "Точно! Днём мы суперзвёзды-поп-айдолы, а ночью — лихие борцы за справедливость, карающие злодеев!"
11150-109 = "Я Кристина! ♧"
11150-110 = "Ого! У вас даже свой образ есть?!"
11150-111 = "Бу-га-га! Око за око, зуб за зуб! Отринь милосердие и ступай по пути хаоса! Таков наш девиз."
11150-112 = "О-офигеть!"
11150-114 = "На какую ещё комедию мы только что наткнулись?"
11150-115 = "Ого, Ару прямо заворожена! Смотрит как ребёнок, впервые попавший на съёмочную площадку!"
11150-117 = ""
11150-118 = "(Этого достаточно, да? Давайте уже искать путь отсюда!)"
11150-119 = "Ну что ж. Адьос! ☆"
11150-120 = "А теперь пора ускакать навстречу закату!"
11150-121 = "Но сейчас ещё середина дня..."
11150-122 = "*срывается с места*"
11150-123 = "..."
11150-124 = "Значит, путь хаоса! Я выжгу этот девиз в самой глубине души!"
11150-125 = ""
11150-126 = ""
11150-127 = "..."
11150-128 = "..."
11150-129 = "(Надо бы ей что-то сказать, но я даже не знаю когда и как...)"
11150-130 = "(Оставь её. Так будет смешнее.)"
11150-131 = ""
11150-133 = "Эй, эм..."
11150-134 = "Что нам делать с этим мешком? Кажется, те ребята его оставили..."
11150-135 = "Что? Не думаешь же ты... что Банда в масках и купальниках оставила его здесь в подарок мне?"
11150-136 = "Эм, нет. Не думаю... Скорее всего, просто забыли."
11150-137 = "Он довольно тяжёлый. Интересно, что внутри."
11150-138 = "*щелчок*"
11150-139 = "...!"
11150-140 = "Не. Может. Быть."
11150-141 = "Разве это... не...?!"
11150-143 = "Ой. Кажется, я забыла забрать мешок с деньгами."
11150-144 = "Что?!"
11150-145 = "Мы всё равно собирались его выбросить. Забудь."
11150-146 = "Ну и ладно. Уверена, он попадёт к кому-нибудь, кому действительно нужен."
11150-147 = "Я тоже надеюсь! Надеюсь, деньги достанутся тому, кому они правда пригодятся."
11150-148 = "Тогда будем считать это нашим добрым делом на сегодня. Хочется верить, что их нашёл человек, которому они очень нужны."
11150-149 = "Меня сейчас стошнит. А-а! Не могу поверить!"
11150-151 = "А?!"
11150-152 = "Чего-о-о?!"
11150-153 = "Что теперь?"
11150-154 = ""
11150-156 = "То есть...?"
11150-157 = "Получается, мы больше не будем ложиться спать голодными?"
11150-159 = "Тем временем в офисе «Решалы 68»..."
11150-160 = "Чего-о-о?!"
11150-161 = "Банда в масках и купальниках — это на самом деле те девчонки из Абидоса?!"
11150-162 = "Ха-ха-ха! Ару, у тебя лицо такое, будто ты только что узнала, что Санта-Клауса не существует!"
11150-163 = "*вздыхает*"
11150-164 = "До Ару наконец дошла правда."
11150-166 = "Следующий Эпизод;Правда раскрыта"
