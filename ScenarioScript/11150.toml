[translation]
11150-2 = "Episódio 15;Vamos, Rumo ao Pôr do Sol!"
11150-3 = "Área Urbana"
11150-8 = "Ufaaa, que sufoco. Já posso tirar isso, né?"
11150-9 = "Sem moleza agora~, anda, anda. Os perseguidores já devem estar vindo~."
11150-10 = "Precisamos sair daqui o mais rápido possível... As estradas devem ser bloqueadas a qualquer momento..."
11150-11 = "Não se preocupe. Preparei tudo nos mínimos detalhes☆"
11150-12 = "Por aqui, rápido."
11150-13 = "Ei, Shiroko-senpai... Não vai tirar a máscara? Não atrapalha?"
11150-14 = "Acho que ela encontrou a vocação da vida dela, ou virou parte da alma dela e não quer mais tirar, né~?"
11150-15 = "Ainda bem que a Shiroko-senpai veio para Abydos...#nSe fosse em outra escola, ela já teria aprontado algo absurdo..."
11150-18 = "S-será mesmo...?"
11150-20 = "...?!"
11150-23 = "..."
11150-25 = "Passamos pelo ponto de bloqueio. Daqui para frente é seguro."
11150-26 = "Isso! Grande sucesso!"
11150-27 = "Não acredito que assaltamos mesmo um banco ilegal do Mercado Negro... Ufa..."
11150-28 = "Shiroko-chan, você pegou direitinho os documentos de registro de cobrança, né?"
11150-29 = "S-sim... Estão dentro da bolsa."
11150-31 = "(Clique)"
11150-32 = "...Hã? Que diabos é isso?! Dentro da bolsa... tem maços de dinheiro...?!"
11150-33 = "Ueeeeê?! Shiroko-senpai, você roubou dinheiro?!"
11150-34 = "N-não... Os documentos que queríamos estão aqui direitinho.#nEsse dinheiro foi o pessoal do banco que colocou por engano..."
11150-35 = "Deixa eu ver... Uhe, tem facilmente 100 milhões aqui. A gente realmente faturou 100 milhões em 5 minutos~."
11150-36 = "Ebaaa!! O que estão esperando paradas aí?! Vamos carregar isso!"
11150-37 = "..."
11150-39 = "E-esperem um pouco! Vocês pretendem usar esse dinheiro?!"
11150-40 = "Por que não, Ayane-chan? Precisamos pagar a dívida!"
11150-41 = "Se fizermos isso... vai ser crime de verdade, Serika-chan!!"
11150-42 = "E daí que é crime?! Esse dinheiro, para começo de conversa,#nfoi o dinheiro que nós suamos para ganhar!#nFoi parar naquele banco ilegal!"
11150-43 = "Além disso, se deixássemos lá, podia acabar virando armas e equipamento para criminosos!#nO que tem de errado em roubar o dinheiro de bandidos?!"
11150-44 = "..."
11150-45 = "Eu concordo com a Serika-chan.#nComo é dinheiro de criminosos, acho melhor nós darmos um bom uso para ele."
11150-46 = "Viu só! Só com isso, já dá para abater um baita pedaço da dívida da escola?!"
11150-47 = "Hmm... Até faz sentido, mas... O que você acha, Shiroko-chan?"
11150-48 = "...Nem preciso dar minha opinião, a Hoshino-senpai vai ser contra de qualquer jeito."
11150-49 = "Hã?!"
11150-50 = "Acertou em cheio, Shiroko-chan. Você me conhece bem mesmo, né~."
11150-51 = "Tudo o que precisamos são os documentos. Não o dinheiro."
11150-52 = "Tudo bem que desta vez era dinheiro de criminosos, mas e na próxima? E depois da próxima?"
11150-53 = "..."
11150-54 = "Se a gente se acostumar com esse tipo de método...#num dia, com certeza vamos acabar fazendo a mesma coisa sem nem pensar duas vezes."
11150-55 = "..."
11150-56 = "Aí, quando estivermos em apuros de novo no futuro...#nvamos acabar fazendo o que não devemos, dizendo \"não teve jeito\"."
11150-57 = "Uhe~, este velhote aqui não ia gostar nem um pouco de ver suas fofas calouras virando isso~."
11150-58 = "Do que adianta proteger a escola desse jeito?"
11150-59 = "..."
11150-60 = "Se fosse para apelar para um método desses, a gente já teria dependido do cartão dourado reluzente da Nonomi-chan desde o começo~."
11150-61 = "...Eu bem que sugeri isso, mas a Hoshino-senpai foi contra..."
11150-62 = "Eu entendo como a senpai se sente. Não importa o quanto a gente se esforce, se não pagarmos a dívida do jeito certo, Abydos deixa de ser Abydos..."
11150-63 = "Uhe, exatamente."
11150-64 = "Então, vamos deixar esta bolsa para trás. Só levamos os documentos necessários, ok? É uma ordem minha como presidente~."
11150-67 = "Aaaah!! Que agonia! Não faz sentido nenhum! Vamos mesmo jogar fora uma fortuna dessas?! Vocês são certinhas nas horas mais erradas!!"
11150-68 = "Nn, se é uma ordem da presidente."
11150-69 = "Eu não conheço bem a situação de Abydos, mas... ficar com esse dinheiro pode acabar trazendo outros problemas."
11150-70 = "É como uma semente de desgraça, afinal..."
11150-71 = "Aha... Fazer o quê, né? Eu dou um jeito de me livrar desta bolsa em algum lugar."
11150-72 = "Beleza, conto com você~."
11150-73 = "...!! Esperem! Alguém está se aproximando da posição de vocês!"
11150-74 = "...!! São os Guardas do Mercado nos perseguindo?!"
11150-75 = "...N-não. Não parece haver hostilidade."
11150-77 = "Vou verificar... Aquela é..."
11150-78 = "A-Aru-san da Faz-Tudo 68?!"
11150-81 = "Arf, ufa... E-esperem!!"
11150-82 = "...!!"
11150-84 = "C-calma. Eu não sou inimiga..."
11150-85 = "(O que ela tá fazendo aqui...?)"
11150-86 = "(Vamos derrubar ela?)"
11150-87 = "(Sei não. Bater em quem disse que não quer brigar é meio chato, né.)"
11150-88 = "(Vocês conhecem ela...?)"
11150-89 = "(Mais ou menos~, de vista~.)"
11150-90 = "C-com licença... N-não é nada demais, mas..."
11150-91 = "Eu vi o assalto ao banco...#nInvadir um banco do Mercado Negro em míseros 5 minutos e bater em retirada com perfeição... Vocês são foras da lei de um nível raro de se ver."
11150-92 = "...?!"
11150-93 = "Sinceramente, foi um choque... Fazer algo tão ousado nos dias de hoje...#nFoi até emocionante."
11150-94 = "E-eu também vou me esforçar! Uma alma verdadeiramente livre, sem amarras de leis ou regras!#nÉ esse tipo de fora da lei que eu quero ser!"
11150-95 = "(Mas... do que diabos ela tá falando?)"
11150-96 = "E-então, por isso... M-me digam o nome de vocês!!"
11150-97 = "Nome...?!"
11150-98 = "Tipo, o nome da organização, ou da equipe, vocês têm um, não têm?!#nNão precisa ser oficial... Só para que eu possa gravar a figura heroica de hoje no fundo do meu coração!!"
11150-99 = "(Uhe... Parece que ela tá tendo um mal-entendido gigantesco~...)"
11150-100 = "...Sim! Eu entendi perfeitamente o que você quer dizer!"
11150-101 = "(N-Nonomi-senpai?!)"
11150-102 = "Nós somos conhecidas como... a Gangue dos Maiôs Mascarados!"
11150-103 = "...Gangue dos Maiôs Mascarados?!"
11150-104 = "N-nossa...!! Que irado!! É estiloso demais!!"
11150-105 = "(...)"
11150-106 = "Uhe~, normalmente o traje oficial é maiô escolar com máscara, mas como foi meio de emergência, hoje viemos só de máscara mesmo~."
11150-107 = "(Ela tá inventando uma história nada a ver?!)"
11150-108 = "Isso mesmo! De dia trabalhamos como idols, e à noite nos transformamos em ladras fantasma da justiça para derrotar os malfeitores!"
11150-109 = "E eu sou a Christina, viu♧"
11150-110 = "\"V-viu♧\"...?! E-elas até têm bordão de personagem...?!"
11150-111 = "Uhe, olho por olho, dente por dente. Impiedosas, solitárias,#ntrilhando o inferno como se fosse o nosso quintal.#nEsse é o nosso lema!!"
11150-112 = "O-o quêêê?!"
11150-114 = "...O que essas garotas estão fazendo...?"
11150-115 = "Nossa, a Aru-chan caiu direitinho nessa.#nEla tá com a cara de uma criança que foi levada para um show de super-herói!"
11150-118 = "(Já chega, né? Vamos dar o fora logo!)"
11150-119 = "Bem, já vamos indo. Adiós~☆"
11150-120 = "Vamos! Rumo ao pôr do sol!"
11150-121 = "Ainda nem está de tardezinha, mas..."
11150-122 = "(Zuum!)"
11150-123 = "..."
11150-124 = "Certo! Trilhando o inferno como se fosse... Vou gravar essas palavras na minha alma! Eu também vou dar o meu melhor!"
11150-127 = "..."
11150-128 = "..."
11150-129 = "(Acho que devíamos contar a verdade para ela... mas quando?)"
11150-130 = "(Tá engraçado demais, vamos deixar assim por um tempo.)"
11150-133 = "C-com licença..."
11150-134 = "O que fazemos com esta bolsa? Parece que elas deixaram aqui..."
11150-135 = "Hm? Será que... a Gangue dos Maiôs Mascarados deixou isso para mim...?"
11150-136 = "Não, com certeza não... Só esqueceram mesmo, né?"
11150-137 = "É bem pesada, viu? O que será que tem dentro?"
11150-138 = "(Clique)"
11150-139 = "...!!"
11150-140 = "Uaaaah?!"
11150-141 = "!! I-isso é...!!"
11150-143 = "...Ué? A bolsa de dinheiro... eu acabei deixando lá."
11150-144 = "Quêêê?!"
11150-145 = "Uhe~, tudo bem, né? A gente ia jogar fora mesmo. Não esquenta, não esquenta."
11150-146 = "Nn. Alguém vai acabar achando, com certeza."
11150-147 = "Pois é☆ Tomara que alguém precisando de dinheiro encontre."
11150-148 = "Ahaha... Vamos pensar que fizemos uma boa ação.#nSe pensarmos que alguém com fome vai poder comer até encher a barriga com aquele dinheiro..."
11150-149 = "Uuuh... Que desperdício... Não importa como se olhe, é desperdício demais!! Francamente, vocês são boazinhas demais!!"
11150-151 = "Quêêêêê?!"
11150-152 = "Uaaaaaaaah?!"
11150-153 = "Isso aqui é..."
11150-156 = "...?"
11150-157 = "...Será que com isso eu não vou mais precisar pular refeições?"
11150-159 = "(Escritório da Faz-Tudo 68)"
11150-160 = "O QUÊÊÊÊÊÊÊÊÊÊÊ?!"
11150-161 = "A GANGUE DOS MAIÔS MASCARADOS ERA ABYDOS?!"
11150-162 = "Ahahaha~, a Aru-chan entrou em choque~! Hilário demais!"
11150-163 = "Suspiro..."
11150-164 = "(No fim das contas, eu contei para ela.)"
11150-166 = "Próximo;A Verdade Revelada"
