[translation]
10003045-1 = "Эпизод 4;Обычный день на пляже"
10003045-2 = "Две банды вот-вот должны были начать бой, и мы снова собрались, чтобы героически защищать отпуск Хины."
10003045-4 = "*вздох* Я понимаю, что мне приказали ждать здесь до начала тренировок, но всё равно скучно."
10003045-5 = "Знаю. Хочешь сыграть в настольную игру, чтобы скоротать время?"
10003045-6 = ""
10003045-8 = "Сенсей, у нас тут серьёзные проблемы! Нам нужны ваши приказы!"
10003045-9 = ""
10003045-11 = "[ns] «К-Конечно, Хина! Но сначала мне нужно сделать кое-что важное...!»"
10003045-12 = "А-А. Хорошо..."
10003045-15 = "Я только что вернулся после того, как мы с трудом победили хулиганов на пляже."
10003045-16 = "С возвращением, Сенсей. Всё в порядке? Я слышала взрывы снаружи."
10003045-17 = "Тренировка опять стала интенсивнее?"
10003045-18 = "Я рада, что наши члены так усердно тренируются, но мне неловко просто отдыхать здесь."
10003045-19 = "И здесь становится немного душно. Не хочешь спуститься со мной и взять мороженого?"
10003045-20 = ""
10003045-22 = "Сенсей, это Чинацу. Мы ведём тяжёлый бой с Бандой в шлемах «Сплэши» в трущобах!"
10003045-23 = "Огневая мощь их танков выше, чем мы рассчитывали. Одним нам будет трудно удержаться!"
10003045-24 = "Запрашиваю ваше непосредственное командование, Сенсей."
10003045-25 = ""
10003045-27 = "[ns1] «П-Прости, Хина, но опять кое-что случилось...!»\n[ns2] «Эм, мне пора — я духовку не выключил!»"
10003045-28 = "С-Сенсей! Подождите!"
10003045-29 = "С-Сенсей! Подождите!"
10003045-31 = "Сенсей, отряды Чинацу и Иори испытывают трудности! Могу я попросить вас принять непосредственное командование? Но президент не должна узнать!"
10003045-32 = "Сенсей..."
10003045-34 = "Что за...? Они выходят из океана?! Они что, сирены?! Нам нужна ваша помощь, Сенсей!"
10003045-35 = "Сэн—"
10003045-37 = "Гангстеры также привели автоматонов и вертолёты! Нам нужна ваша помощь, Сенсей!"
10003045-38 = "Сэн—"
10003045-40 = "Эм, Сенсей..."
10003045-41 = "Всё в порядке? Вы выглядите неважно."
10003045-42 = "[s] «Я-я в порядке, Хина, просто... эм...»"
10003045-43 = "*вздох* Я знаю. Тебе снова куда-то нужно, да?"
10003045-44 = "Иди. Не спеши. Я подожду."
10003045-45 = "[s] «С-Спасибо. Я скоро...»"
10003045-49 = "Битва продолжалась ещё два часа."
10003045-51 = "Штаб летнего лагеря"
10003045-52 = "*тяжело дышит* *тяжело дышит*..."
10003045-53 = "Фух..."
10003045-54 = "Все ещё живы?"
10003045-55 = "[s] «Каким-то чудом...»"
10003045-56 = "Всё болит, купальник разваливается, но я ещё дышу."
10003045-57 = "Не ожидала, что они окажут такое сопротивление."
10003045-58 = "Но благодаря нашим усилиям..."
10003045-59 = "Да."
10003045-60 = "Точно."
10003045-61 = "Мы подтвердили, что и Пляжные хулиганы Фубар, и Банда в шлемах «Сплэши» отступили. В сети уже разошлась новость, что их тотальная война отменена."
10003045-62 = "Значит, наша миссия выполнена."
10003045-63 = "Наконец-то всё закончилось!"
10003045-64 = "Верно. На сегодня мы достаточно потрудились."
10003045-65 = ""
10003045-66 = ""
10003045-68 = "Не знаю, как вас благодарить, Дисциплинарный комитет Геенны!"
10003045-69 = "Вы не только спасли мой отель, но и местные владельцы бизнеса теперь могут снова открыть лавки!"
10003045-70 = "Придумал! Я дам вам всем бесплатные билеты в наши горячие источники. Они уже открыты, так что отдыхайте сколько хотите."
10003045-71 = "Мы лишь сделали то, что должны были, но от предложения не откажемся. Хорошая работа, все."
10003045-72 = "До беговой тренировки ещё около часа. Все отдохните, а затем обсудим дальнейшее расписание."
10003045-73 = "[s] «Наконец-то смогу прогуляться по пляжу с Хиной.»"
10003045-74 = "Именно. Я знаю, вы устали, но, пожалуйста, оставайтесь рядом с президенткой и позаботьтесь, чтобы она наслаждалась отпуском."
10003045-75 = ""
10003045-77 = ""
10003045-78 = "Старший администратор Ако? Для вас сообщение от Общества Пандемониума."
10003045-79 = "Всё идёт по плану? Надеюсь, вы сейчас не занимаетесь делами где-то совсем в другом месте."
10003045-80 = "Ч-Что? Нет, я просто..."
10003045-81 = "Хм? Это Иори из Дисциплинарного комитета? Этот купальник довольно..."
10003045-82 = "Ой нет! Палец соскользнул!"
10003045-83 = ""
10003045-84 = ""
10003045-86 = "Общество Пандемониума держит её на коротком поводке. Чуть не попались, Иори."
10003045-87 = "Эй! Не выставляй так, будто это МОЯ вина!"
10003045-88 = "Ну, их вмешательство нельзя назвать неожиданным. Они всегда были занозой у нас в боку."
10003045-89 = "Да, но я уверена, Ако справится."
10003045-90 = "[s] «Пойду проверю, как там Хина.»"
10003045-91 = "Хорошо. До начала тренировки осталось немного, так что проследите, чтобы президент ничего не заподозрила, Сенсей."
10003045-92 = "Они уже отступили, так что теперь всё спокойно, да?"
10003045-93 = "Честно говоря, пока Ако нет, это, наверное, лучший шанс сводить президентку на пляж. Что может пойти не так?"
10003045-94 = "Иори, ты так ничему и не научилась про сглаз?"
10003045-95 = ""
10003045-96 = ""
10003045-97 = "[ns] «Ну всё.»"
10003045-98 = "Вот же мой длинный язык."
10003045-99 = "Теперь уже поздно забирать слова назад. Раз Ако нет, спрошу сама."
10003045-100 = ""
10003045-101 = ""
10003045-103 = "Что на этот раз?!"
10003045-104 = ""
10003045-105 = ""
10003045-108 = "На нас напали! Но в этот раз это...!"
10003045-110 = "А-а-а! Где все?! Говорили, здесь будет фестиваль!"
10003045-111 = "Это больше походило на войну банд, чем на фестиваль. Но для банд война — чем не фестиваль? ☆"
10003045-112 = "Да неважно! Что происходит?!"
10003045-113 = "Как нам проводить исследование, почему жареная кукуруза на пляже такая вкусная?"
10003045-114 = "Ага! Когда мы будем есть жареную кукурузу?!"
10003045-115 = "Дура! Мы здесь ПРОДАВАТЬ кукурузу, а не есть!"
10003045-116 = "Именно поэтому мы тащили сюда весь этот тяжёлый багаж, а теперь ни одного правонарушителя, которому можно продать!"
10003045-117 = "Здесь никого нет! Что происходит?!"
10003045-118 = "[s] «Общество гурманов? Что вы здесь делаете?»"
