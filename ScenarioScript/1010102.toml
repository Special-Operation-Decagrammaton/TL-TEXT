[translation]
1010102-1 = "Работа в ресторане"
1010102-4 = "Через некоторое время после сообщения Саори я проголодался и отправился в ресторан на пляже."
1010102-9 = ""
1010102-10 = "Ваши окономияки. Приятного аппетита."
1010102-11 = "Выглядит вкусно!"
1010102-12 = "Но, кажется, здесь не хватает майонеза..."
1010102-13 = ""
1010102-15 = ""
1010102-16 = "А, мои глубочайшие извинения. Я немедленно исправлю ошибку."
1010102-17 = ""
1010102-19 = ""
1010102-21 = "Извините! Нам до сих пор не принесли меню!"
1010102-22 = "Прошу прощения! Одну минуту, пожалуйста!"
1010102-23 = ""
1010102-25 = ""
1010102-27 = "[ns] «(Хм... Думаю, немного подожду...)»"
1010102-31 = ""
1010102-32 = "*тяжело дышит* *тяжело дышит*"
1010102-33 = "Добро пожаловать. Пожалуйста, ознакомьтесь с меню и..."
1010102-34 = ""
1010102-36 = ""
1010102-37 = "Сенсей?"
1010102-38 = "Вы пришли навестить меня? Спасибо."
1010102-39 = "[s] «Ты выглядишь очень занятой.»"
1010102-40 = "Так кажется, Сенсей? Дело не столько в объёме работы, сколько в том, что я к ней ещё не привыкла."
1010102-41 = "Я всё ещё разбираюсь во всех тонкостях этой работы."
1010102-42 = "Вот ваше меню."
1010102-43 = "Скажите, когда будете готовы сделать заказ."
1010102-44 = "[s1] «Хм... Какое большое меню...»\n[s2] «Что-нибудь посоветуешь?»"
1010102-47 = "Эм, возможно, я не самый подходящий человек для такого вопроса..."
1010102-48 = ""
1010102-50 = ""
1010102-51 = "А. Конечно. Я должна порекомендовать самое популярное блюдо."
1010102-52 = "Это «Фирменный омурайсу с заботой»."
1010102-53 = "Это самое популярное блюдо в нашем меню."
1010102-54 = "А? Что значит «с заботой»?"
1010102-55 = "Официант просто рисует кетчупом картинку на омурайсу. Мне это кажется довольно бессмысленным, ведь клиент всё равно потом это съест..."
1010102-56 = ""
1010102-59 = "[ns] «Вот это! Я хочу это, пожалуйста!»"
1010102-60 = "В-Вы правда?! Вы уверены, что хотите заказать именно это, Сенсей?"
1010102-61 = "Понятно... Однако я не могу гарантировать результат... Я не слишком хорошо рисую кетчупом."
1010102-62 = "[s3] «Так будет даже лучше!»\n[s4] «Уникальный рисунок от Саори!»"
1010102-65 = "Вот... как?"
1010102-66 = "Что ж, если вы этого хотите. Подождите только—"
1010102-67 = ""
1010102-71 = "Эй! Это ещё что такое?!"
1010102-72 = ""
1010102-74 = ""
1010102-75 = "Похоже, там возникла проблема..."
1010102-76 = "[s] «Тебе не нужно пойти разобраться?»"
1010102-77 = "Эм... Я немного обеспокоена, но я ещё принимаю ваш заказ."
1010102-78 = "Вы тоже клиент, Сенсей, поэтому я должна как следует выполнить свою работу—"
1010102-79 = ""
1010102-83 = "Я хочу поговорить с менеджером! ПРЯМО СЕЙЧАС!"
1010102-84 = "Э-Эм..."
1010102-85 = "[s] «Всё нормально. Иди посмотри, что случилось.»"
1010102-86 = "Простите. Я вернусь как можно скорее."
1010102-87 = ""
1010102-89 = ""
1010102-90 = "[ns] Из беспокойства пойти за Саори."
1010102-91 = ""
1010102-98 = "Еда вообще не похожа на картинку! Это заведение — позор!"
1010102-99 = "Я не дам ни гроша этому ужасному ресторану!"
1010102-100 = ""
1010102-103 = ""
1010102-104 = "Я только что принесла вам фирменный омурайсу..."
1010102-105 = "С блюдом что-то не так?"
1010102-106 = "Конечно! Этот омурайсу — катастрофа!"
1010102-107 = ""
1010102-109 = ""
1010102-110 = "Посмотри как следует своими глазами!"
1010102-111 = ""
1010102-113 = ""
1010102-114 = "Это наш стандартный омурайсу. Я не вижу здесь проблемы."
1010102-115 = "[s] «(...И к тому же он уже наполовину съеден.)»"
1010102-116 = "Вот именно! Ты даже не понимаешь, в чём проблема!"
1010102-117 = "В описании блюда ясно сказано, что на нём должна быть нарисованная вручную кетчупом кошка!"
1010102-118 = ""
1010102-120 = ""
1010102-121 = "Но это не кошка! Это кролик!"
1010102-122 = "[ns] «Это уже полный бред!»"
1010102-123 = "Нет, не бред! Это ложная реклама!"
1010102-124 = "Как я и сказал, я не заплачу вам ни цента!"
1010102-125 = ""
1010102-127 = ""
1010102-128 = "Что...?"
1010102-129 = ""
1010102-131 = ""
1010102-132 = "Понятно... Я могу понять вашу точку зрения."
1010102-133 = "Я обязана проследить, чтобы вы получили именно то, что заказали. Это невыполнение моих обязанностей."
1010102-134 = "Хм, да-да. Разумеется, я здесь прав."
1010102-135 = "[s] «Саори, тебе совсем не обязательно—»"
1010102-136 = ""
1010102-138 = ""
1010102-140 = "Поэтому я нарисую столько кошек, сколько понадобится, пока вы не останетесь довольны!"
1010102-141 = ""
1010102-145 = "Ч-Что? Подожди секунду!"
1010102-146 = "Я вообще не к этому клонил..."
1010102-147 = "Не волнуйтесь. Я нарисую вам самую идеальную кетчупную кошку из всех когда-либо нарисованных."
1010102-148 = "Омурайсу и бутылку кетчупа, пожалуйста!"
1010102-149 = ""
1010102-151 = ""
1010102-152 = "Хия!"
1010102-153 = "П-Подождите...!"
1010102-155 = "Час спустя..."
1010102-158 = ""
1010102-159 = "Да. Думаю, пока что это лучший вариант. Вас устраивает?"
1010102-160 = "Я-я пытаюсь сказать, что мне вообще не это нужно!"
1010102-161 = "Понятно. Всё ещё не соответствует вашим стандартам."
1010102-162 = "Тогда я продолжу, пока вы не будете довольны своей кетчупной кошкой!"
1010102-163 = ""
1010102-165 = ""
1010102-168 = "Четыре часа спустя..."
1010102-171 = ""
1010102-172 = "На ваше одобрение! Думаю, это лучшая кетчупная кошка в истории!"
1010102-173 = "Хватит... Пожалуйста, хватит!"
1010102-174 = "...Всё ещё недостаточно."
1010102-175 = ""
1010102-177 = ""
1010102-178 = "Тогда ещё раз!"
1010102-179 = ""
1010102-181 = ""
1010102-182 = "Умоляю! Остановись! Я был неправ! Ладно?!"
1010102-183 = "Вот ваши деньги! Сдачу оставьте себе!"
1010102-184 = ""
1010102-186 = ""
1010102-187 = ""
1010102-188 = "П-Подождите! Вернитесь!"
1010102-189 = "А мне казалось, этот рисунок получился неплохо...!"
1010102-190 = ""
1010102-192 = ""
1010102-193 = "...Он ушёл."
1010102-194 = "Неужели я настолько ужасно рисую, что клиенты сбегают, Сенсей?"
1010102-195 = "[s] «...Думаю, дело было совсем не в твоём рисунке.»"
1010102-196 = "А?"
1010102-197 = "...Так вот в чём дело? Он хотел использовать кетчупную кошку как предлог, чтобы не платить?"
1010102-198 = "Понятно... Когда его план сработал не так, как ожидалось, он просто заплатил и сбежал..."
1010102-199 = "Спасибо, Сенсей. Это был очень полезный опыт. Я запомню его навсегда."
1010102-200 = "...В любом случае мне нужно ещё больше тренироваться рисовать кетчупных кошек, чтобы никто даже не подумал пожаловаться."
