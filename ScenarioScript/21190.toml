[translation]
21190-1 = "Episódio 19;Double-O"
21190-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21190-4 = "Mana! Ainda não?!"
21190-5 = "C-Calma, não me apressa! Só falta digitar isso aqui e acabou...!"
21190-6 = "Faltam só 2 minutos!! Não tem como não apressar!"
21190-7 = "Para ser exata, 96 segundos. Enquanto eu falava, já caíram para 92 segundos..."
21190-8 = "T-Tá bom, tá bom! Já terminei!"
21190-12 = "Vou rodar só um teste rápido aqui... beleza."
21190-13 = "Nenhum erro, Momoi!"
21190-14 = "Ok! Fazendo o upload do arquivo, tempo estimado... 15 segundos! Aris, quantos segundos faltam?!"
21190-15 = "Restam 19 segundos...!"
21190-16 = "P-Por favor...!"
21190-20 = "Transferência concluída..."
21190-22 = "Sua inscrição para o Prêmio Millennium foi concluída."
21190-23 = "CONSEGUIMOOOOOS!"
21190-24 = "Por um triz... Achei que meu coração ia parar..."
21190-25 = "Agora... é só esperar o resultado daqui a 3 dias, né."
21190-26 = "Pelo menos entregamos a tempo, mas ainda não saiu o resultado."
21190-27 = "Em 3 dias... vamos descobrir se poderemos continuar nesta sala do clube ou não."
21190-28 = "...Mas 3 dias é tempo demais, não acham? Então eu tenho uma ideia."
21190-29 = "Que tal a gente já subir a versão web de \"Tales Saga Chronicle 2\"?"
21190-31 = "!?"
21190-32 = "P-Por quê?"
21190-33 = "Eu não aguento esperar 3 dias! Além disso, vocês não querem ver a reação dos jogadores antes da nota dos jurados?!"
21190-34 = "Hmm, mas dá um pouco de medo... Fico preocupada com os comentários negativos."
21190-35 = "O que você tá dizendo?! A gente não fez esse jogo só para inscrever no Prêmio Millennium, né!"
21190-36 = "Vamos mostrar com confiança! Afinal, nós demos o nosso melhor!"
21190-37 = "É-É verdade, mas..."
21190-38 = "...Sim, vamos subir."
21190-39 = "Hã?"
21190-40 = "Porque eu acho que uma obra... só fica completa de verdade quando existem pessoas para ver e jogar."
21190-41 = "Eu quero... terminar o nosso jogo direito."
21190-42 = "Yuzu-chan..."
21190-43 = "Tudo bem. Mesmo se virar uma enxurrada de críticas negativas como da outra vez..."
21190-44 = "Nós nos esforçamos ao máximo. E além disso... com todo mundo junto, eu sei que vou conseguir encarar."
21190-46 = "Eu já estou bem."
21190-48 = "..."
21190-49 = "Então vamos fazer o upload agora mesmo!"
21190-50 = "Aah! E-Espera! Preciso me preparar psicologicamente...!"
21190-52 = "Upload concluído! Deve levar pelo menos umas 2 ou 3 horas até alguém jogar e comentar, então vamos descansar um pouco!"
21190-53 = "...Ah, verdade."
21190-55 = "..."
21190-57 = "..."
21190-58 = "Hum, Aris? Por que você tá sentada na frente do computador?"
21190-59 = "Estou em modo de espera."
21190-60 = "Parece que as pessoas já começaram a baixar. Estou curiosa."
21190-61 = "Ainda vai demorar para jogarem, acho que não vai chegar nada tão rápido assim, sabia?"
21190-62 = "Sim, mas mesmo assim vou esperar."
21190-63 = "E-Eu também..."
21190-64 = "De qualquer jeito, estou nervosa demais para dormir..."
21190-65 = "Eu também vou esperar."
21190-66 = "...É."
21190-67 = "Não dá, meu coração também começou a disparar."
21190-68 = "O meu não para de bater de preocupação... Aii, fui eu que dei a ideia e tô quase surtando de nervoso!"
21190-69 = "(Plim)"
21190-70 = "Ah, primeiro comentário."
21190-71 = "O que diz?! O que diz?!"
21190-72 = "<hermet021: Uau, isso aqui é a continuação daquele jogo que ficou em 1º lugar no ranking de jogos lixo da última vez? Achei que tinham desistido de fazer jogos, mas não aprendem mesmo, hein>"
21190-73 = "..."
21190-74 = "A-Aris, não liga muito para esse tipo de coisa..."
21190-75 = "..."
21190-76 = "Contatando Maki. Vou disparar o canhão de raio na potência máxima na direção desse endereço IP."
21190-77 = "I-Isso não pode!"
21190-78 = "...Tudo bem."
21190-79 = "É comentário de alguém que nem jogou ainda... Não vamos ligar para isso, tá?"
21190-80 = "(Plim)"
21190-81 = "<Kotoha0507: O \"TSC\" anterior certamente não era uma obra fácil de elogiar sem ressalvas. Porém, tinha originalidade e, no mínimo, estava longe de ser comum. Estou ansioso para ver que tipo de novidade esse 2 vai trazer>"
21190-82 = "Opa, aos poucos estão vindo reações decentes..."
21190-83 = "(Plim)"
21190-84 = "<QueenC: Bom, vamos ver se vem obra-prima ou desastre... Já que é assim, não quero nada morno. Seja para um lado ou para o outro, espero uma experiência extrema>"
21190-85 = "(Plim)"
21190-86 = "<kirakiraNO1: Joguei o anterior e não guardei boas lembranças. Na verdade, ainda lembro nitidamente de vários traumas. Mas por que será... mesmo sabendo que é a continuação, acabei baixando sem pensar>"
21190-87 = "I-Incrível! Não parece que o pessoal tá super empolgado com o nosso jogo?!"
21190-88 = "No geral, tá parecendo mais gente se divertindo tentando desarmar uma bomba-relógio..."
21190-89 = "Tipo aquela curiosidade mórbida..."
21190-91 = "(Plim, plim)"
21190-92 = "<cat0808: Tenho prova de recuperação daqui a 2 horas... mas tô com muito mais vontade de jogar isso agora>"
21190-93 = "<You-me: Provas você vai ter várias pela frente. O melhor momento para jogar isso é agora, que acabou de sair!>"
21190-94 = "É... se possível, eu preferia que você fosse fazer a prova..."
21190-95 = "O-O número de downloads já passou de 2.000?! Isso não é meio estranho?!"
21190-96 = "Ah... Parece que um portal famoso publicou uma matéria anunciando o lançamento do nosso jogo."
21190-97 = "Uaaah...! Eu só torcia para não sermos ignoradas! Quando o número sobe tanto assim, bate um medo do nada!"
21190-100 = "..."
21190-101 = "...Meu coração está acelerado."
21190-102 = "Aii! Meu coração vai explodir de ansiedade e medo!"
21190-103 = "(KABUUUM!)"
21190-104 = "!?"
21190-105 = "O-O seu coração explodiu mesmo?!"
21190-106 = "N-Não! Não foi meu coração!"
21190-107 = "O que foi isso...?! O videogame explodiu?!"
21190-108 = "Hã, será que eu joguei tempo demais...?"
21190-109 = "Não! Esse disparo é de calibre 13,97mm... É da Karin-senpai!"
21190-110 = "(BOOOOM!)"
21190-111 = "Hyaa?!"
21190-112 = "Ataque de longa distância confirmado, na direção das 11 horas em frente à sala do clube! Distância aproximada: 1 km...!"
21190-113 = "É-É vingança pela última vez?!"
21190-114 = "Iniciando contra-ataque!"
21190-115 = "Não, Aris, vamos sair daqui primeiro! Se ficarmos aqui, o Sensei pode se machucar, e além disso..."
21190-116 = "Se a gente lutar aqui dentro, a nossa sala do clube vai ser destruída!"
21190-117 = "Mana..."
21190-118 = "T-Tem pessoal do Conselho Estudantil lá fora também...! É retaliação pelo caso do \"Espelho\"...?!"
21190-119 = "E-Eu até estava me sentindo um pouco culpada, mas...!"
21190-120 = "Aii, lá vem outro!"
21190-121 = "[s1] \"Fiquem calmas.\"\n[s2] \"Enquanto ela recarrega, vamos sair daqui.\""
21190-122 = "Sensei...!"
21190-123 = "Sensei...!"
21190-124 = "Sim!"
21190-125 = "Aris, eu e a Yuzu vamos na frente!"
21190-126 = "Sim."
21190-127 = "Aris vai proteger o Sensei e todas vocês."
21190-129 = "Beleza, vamos lá!!"
