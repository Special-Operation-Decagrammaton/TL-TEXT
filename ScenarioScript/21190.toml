[translation]
21190-1 = "Эпизод 19;Double O"
21190-2 = "Департамент Разработки Игр Милленниума"
21190-4 = "Момои! Ты уже закончила?"
21190-5 = "Дай минутку... Мне только это ввести, и готово..."
21190-6 = "У нас осталось всего две минуты! Нельзя терять ни секунды!"
21190-7 = "Если точнее — 96 секунд. О, уже 92..."
21190-8 = "Ладно! Ладно! Я закончила!"
21190-9 = ""
21190-12 = "Быстро протестируем и... Так."
21190-13 = "Ошибок нет, Момои!"
21190-14 = "Отлично! Начинаю загрузку! До отправки 15 секунд! Арис, сколько времени?!"
21190-15 = "Осталось 19 секунд..."
21190-16 = "Пожалуйста, пожалуйста, пожалуйста..."
21190-17 = ""
21190-18 = ""
21190-20 = "Статус: отправлено..."
21190-22 = "Спасибо за вашу заявку и участие в Миллениум Prize."
21190-23 = "Мы сделали это!"
21190-24 = "Фу-у-ух... Еле успели."
21190-25 = "Теперь остаётся ждать объявления результатов через четыре дня."
21190-26 = "Мы успели, но узнаем свою судьбу только после результатов."
21190-27 = "Через четыре дня решится, останемся мы здесь или уйдём."
21190-28 = "Поэтому у меня есть предложение."
21190-29 = "Почему бы за оставшееся время не выложить открытую веб-версию Tales Saga Chronicle 2?"
21190-31 = "А?"
21190-32 = "Зачем нам это?"
21190-33 = "Да какая разница, что думают судьи? Разве вам не хочется узнать, что скажут о нашей игре обычные игроки?"
21190-34 = "Н-Но что, если они скажут, что она ужасная?"
21190-35 = "Посмотри на это иначе. Мы делали её для себя. Миллениум Prize — всего лишь бонус."
21190-36 = "Мы сделали всё, что могли, и этим уже можно гордиться!"
21190-37 = "Ну да, но..."
21190-38 = "Давайте сделаем это."
21190-39 = "А?"
21190-40 = "Искусство ничего не стоит, если его никто не увидит."
21190-41 = "Я хочу, чтобы люди увидели то, что мы создали."
21190-42 = "Юзу..."
21190-43 = "Всё нормально. Даже если будет как в прошлый раз и на нас обрушится лавина мерзких комментариев..."
21190-44 = "...я буду знать, что мы сделали всё, что могли. И сделали это вместе. Вот что действительно важно."
21190-45 = ""
21190-46 = "Со мной всё в порядке, честно."
21190-48 = "..."
21190-49 = "Ладно! Сейчас загружу!"
21190-50 = "П-Погоди!"
21190-52 = "И... готово! Через два-три часа начнут появляться отзывы. А пока я отдохну."
21190-53 = "Хорошо..."
21190-55 = "..."
21190-56 = ""
21190-57 = "...*плюх*"
21190-58 = "Арис? Почему ты сидишь перед компьютером?"
21190-59 = "Я жду."
21190-60 = "Люди уже начинают скачивать игру. Я хочу узнать, что они думают."
21190-61 = "Арис, если постоянно смотреть на чайник, он быстрее не закипит. Настоящие отзывы появятся позже."
21190-62 = "Ну, я всё равно буду ждать."
21190-63 = "Я тоже."
21190-64 = "Я всё равно слишком волнуюсь, чтобы уснуть."
21190-65 = "Так что подожду вместе с тобой."
21190-66 = "Ах."
21190-67 = "У меня сердце колотится."
21190-68 = "А-а! Я больше нервничаю, чем радуюсь. И ведь это я предложила всё это!"
21190-69 = "*динь*"
21190-70 = "О! Первый комментарий!"
21190-71 = "Ч-Что?! Серьёзно?!"
21190-72 = "helmet021: О, мошенницы с «Худшей игрой года» вернулись! Думал, они бросят после того, как поняли, что бездарны, но нет — снова клепают сиквелы, лол"
21190-73 = "..."
21190-74 = "Ах... Всё нормально, Арис. Не принимай близко к сердцу."
21190-75 = "Поняла."
21190-76 = "Я попрошу Маки достать IP-адрес этого человека, а потом отправлюсь туда и выстрелю в него лазером на полной мощности."
21190-77 = "Т-Ты не можешь так сделать!"
21190-78 = "Мидори права."
21190-79 = "Они явно даже не пробовали игру, так что просто игнорируй."
21190-80 = "*динь*"
21190-81 = "Kotoha0507: Первая часть была катастрофой, но там было несколько интересных идей. Надеюсь, геймплей в этот раз улучшили."
21190-82 = "Вот, уже лучше."
21190-83 = "*динь*"
21190-84 = "QueenC: Мне страшно... Когда я закончу игру, как мой будущий я будет судить нынешнюю меня? Прокляну ли себя за то, что добровольно скачала это, или возрадуюсь своей вере?"
21190-85 = "*динь*"
21190-86 = "kirakiraNO1: первая заставила меня вообще бросить игры лол, такой кринж ппц. Но почему мне всегда хочется попробовать такое?"
21190-87 = "В-Вау! Люди реально хотят сыграть в нашу игру!"
21190-88 = "Эм... Такое чувство, будто они считают нашу игру бомбой с таймером."
21190-89 = "Они думают, что возненавидят её, но всё равно хотят попробовать..."
21190-91 = "*дзынь-дзынь*"
21190-92 = "cat0808: через два часа пересдача, но TSC2 прям :eyes: Думаю прогулять и поиграть. Стоит?"
21190-93 = "Yousee-me: Конечно играй в TSC2! Экзамены временны, а сыграть в TSC2 в день релиза — вечно. Ждать — преступление против искусства!"
21190-94 = "Э-э-э... Им всё-таки лучше пойти на экзамен."
21190-95 = "Ого, уже больше 2000 скачиваний. Как так быстро?"
21190-96 = "О. Кто-то запостил игру на агрегаторе соцсетей."
21190-97 = "А-а-а! Я просто надеялась, что людям будет не всё равно, а теперь мне страшно!"
21190-98 = ""
21190-100 = "..."
21190-101 = "У меня сердце колотится."
21190-102 = "Не могу понять, мне страшно или я в восторге!"
21190-103 = "*БУМ*"
21190-104 = "А?!"
21190-105 = "Это у Момои сердце взорвалось?"
21190-106 = "Что?! Нет, это не я!"
21190-107 = "Тогда что это было? Наша консоль наконец сдохла?"
21190-108 = "Она и правда уже старая..."
21190-109 = "Нет! Это гильза от 13,97-миллиметрового патрона! Такие у Карин!"
21190-110 = "*БУМ БУМ*"
21190-111 = "Ик!"
21190-112 = "Подтверждена дальняя атака. Направление: одиннадцать часов. Дистанция: примерно один километр!"
21190-113 = "Н-Неужели наша прошлая игра была НАСТОЛЬКО плоха?!"
21190-114 = "Готовлю контратаку!"
21190-115 = "Не надо, Арис! Здесь Сенсей."
21190-116 = "И если мы начнём сражаться здесь, клубную комнату разнесёт!"
21190-117 = "Момои..."
21190-118 = "Снаружи силы Студсовета! Может, они пришли мстить!"
21190-119 = "Не верится, что раньше мне их даже немного было жалко!"
21190-120 = "Ик!"
21190-121 = "[s1] «Успокойся.»\n[s2] «Выйдем наружу.»"
21190-122 = "Сенсей!"
21190-123 = "Сенсей!"
21190-124 = "Да!"
