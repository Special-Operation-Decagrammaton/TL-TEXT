[translation]
10056030-1 = "Episode 3;Prized Kelp Tea"
10056030-2 = "Diving Clubroom"
10056030-3 = "I am so, so sorry...!"
10056030-4 = "For what happened earlier..."
10056030-5 = "A-And yesterday, I thought you were peeping on us while we were swimming..."
10056030-6 = "I am truly sorry!"
10056030-13 = "Sorry for suddenly running away... When you mentioned an island, I just reacted."
10056030-14 = "The sardine ice cream was delicious."
10056030-15 = "[s] \"Well, given the situation, it is hard to blame you for misunderstanding.\""
10056030-19 = "[ns1] \"Even so, you two look energetic.\"\n[ns2] \"I sprinted at full speed, so I am totally exhausted...\""
10056030-22 = "We did not really run that much..."
10056030-23 = "Well, we are the Diving Club. We have pretty good lung capacity."
10056030-24 = "Sayuri has held her breath for over ten minutes before."
10056030-25 = "[s3] \"Ten whole minutes!?\"\n[s4] \"That is amazing...\""
10056030-28 = "You can praise me more."
10056030-29 = "Sayuri has the most natural talent for free diving among us."
10056030-35 = "Sensei, here. Want some tea?"
10056030-36 = "I think wetting your throat will help you calm down a bit."
10056030-37 = "[s] \"Thank you. I will take some.\""
10056030-41 = "[ns] \"Is this... kelp tea?\""
10056030-42 = "Yes. It is just dried kelp steeped in hot water."
10056030-43 = "At Odyssey, most of our food comes from the sea. #nSo we use kelp instead of tea leaves."
10056030-44 = "At first, the umami flavor was a bit overwhelming, but now I cannot live without it."
10056030-45 = "Odyssey kelp is famous for being high quality, you know."
10056030-46 = "It seems Trinity bought some kelp tea from us before, but... they have not bought any since. #nGuess it was not to their taste."
10056030-47 = "Kelp tea is so good, though..."
10056030-48 = "[s] \"Did you harvest this kelp yourselves?\""
10056030-49 = "W-What are you saying, absolutely not!"
10056030-50 = "Fishing activities by the Diving Club are strictly prohibited."
10056030-51 = "People already make snide remarks about us supposedly poaching as it is."
10056030-52 = "Fishing and diving are in completely different categories. We do not cross each other's boundaries."
10056030-53 = "That is right. If our goal was to dive down and harvest things, we would have become the \"Ama Club\"."
10056030-54 = "[s] \"So what kind of activities do you usually do?\""
10056030-55 = "That would be--"
10056030-56 = "Diving."
10056030-57 = "Free diving!"
10056030-58 = "No, you are the only one who goes all the way to the ocean floor with free diving."
10056030-59 = "Various activities we can do underwater, other than fishing."
10056030-60 = "Like searching for lost items, underwater photography, making seafloor maps..."
10056030-61 = "Even maintaining underwater facilities is something that cannot be done without the Diving Club!"
10056030-62 = "And making friends. Like sharks, or turtles."
10056030-66 = "In short, we solve problems that occur on the seabed and get compensated for our work."
10056030-67 = "However... ever since we anchored in D.U., there have been almost no underwater problems... #nso people rely on us less and less..."
10056030-68 = "Lately, it has just been fun dives--underwater exploration purely for enjoyment..."
10056030-69 = "[s5] \"Club activities can have all sorts of purposes.\"\n[s6] \"I do not think being free time means it is a bad thing...\""
10056030-75 = "[ns] \"Where do you get your diving gear?\""
10056030-77 = "Uhm, well, that is..."
10056030-78 = "O-Online shopping...?"
10056030-79 = "[s7] \"Does not that kind of stuff cost a lot?\"\n[s8] \"Is not managing your money difficult?\""
10056030-82 = "Ugh, um..."
10056030-86 = "Actually... we have a bit of... debt..."
10056030-87 = "[s] \"Debt!?\""
10056030-88 = "Well, strictly speaking, it is slightly different."
10056030-89 = "How much is it right now? About the cost of four dry suits...?"
10056030-90 = "Enough to buy 5,000 Aqua Seal single cones."
10056030-91 = "I-It is okay, though? You do not need to worry! #nOnce we find a treasure sleeping on the seabed, we can pay it all back at once...!"
10056030-92 = "[s9] \"Still... debt, huh...\"\n[s10] \"Is there no way to cut costs?\""
10056030-95 = "When it comes to that..."
10056030-96 = "Diving naturally costs a lot of money..."
10056030-97 = "And we cannot afford to skimp on safety to save money..."
10056030-98 = "If we cannot dive, we have no value at all..."
10056030-99 = "We used to have a sponsor, but they suddenly stopped responding."
10056030-100 = "We tried communicating through every channel, but heard nothing back."
10056030-101 = "It has already been a month since we started using these abyss suits... I wonder how long this will last."
10056030-102 = "At this rate, the seams are going to rust..."
10056030-103 = "Good opportunity. How about we do more free-diving training?"
10056030-104 = "Do not measure things by Sayuri standards!?"
10056030-108 = "[ns] \"A sponsor, huh...\""
10056030-110 = "[ns11] \"In that case, how about this?\"\n[ns12] \"I will be your new sponsor.\""
10056030-114 = "Sensei...?"
10056030-115 = "W-What is your angle..."
10056030-116 = "Is the island pulling strings behind the scenes?"
10056030-117 = "Situations like this usually have a catch."
10056030-118 = "What a suspicious person～?"
10056030-119 = "[s] \"Of course, it is not for free.\""
10056030-123 = "[ns] \"I expect you to pay me back with your bodies.\""
10056030-124 = "When you say pay you back with our bodies..."
10056030-128 = "No way--!?"
