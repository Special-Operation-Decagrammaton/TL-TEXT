[translation]
10056030-1 = "Episode 3; Signature Kelp Tea"
10056030-2 = "Diving Club; Clubroom"
10056030-3 = "I'm so, so sorry...!"
10056030-4 = "I was being extremely rude earlier..."
10056030-5 = "A-and also, yesterday, I thought someone was peeping at me swimming, so..."
10056030-6 = "Please forgive me!"
10056030-13 = "Sorry for booking it on you too... You mentioned Island, so I instinctively just took off."
10056030-14 = "The sardine ice cream was tasty."
10056030-15 = "[s] \"There were bound to be misunderstandings with those circumstance, so it's fine.\""
10056030-19 = "[ns1] \"But still, you two sure are fit.\"\n[ns2] \"I was chasing you two with everything I had, so I'm dead tired right now...\""
10056030-22 = "We didn't even run that much..."
10056030-23 = "But I guess we are from the Diving Club. Our lung capacity's pretty good."
10056030-24 = "Sayuri can hold her breath for over ten minutes."
10056030-25 = "[s3] \"Over ten minutes!?\"\n[s4] \"That's incredible...\""
10056030-28 = "Feel free to compliment me more."
10056030-29 = "Sayuri's the most talented freediver amongst us."
10056030-35 = "Here, Sensei. Would you like some tea?"
10056030-36 = "This should moisten your throat and make you feel a bit better."
10056030-37 = "[s] \"Thanks. I'll have some.\""
10056030-41 = "[ns] \"Is this... kelp tea?\""
10056030-42 = "Yes. It's made by steeping dried kelp in hot water."
10056030-43 = "Odyssey relies on the ocean to source a majority of its ingredients. #nOur substitute for tea leaves is, therefore, kelp."
10056030-44 = "I used to find the flavor of the tea to be too strong, but now I can't live without it."
10056030-45 = "Odyssey's kelp is famous for its quality."
10056030-46 = "Apparently Trinity bought some of our kelp tea at some point... but they haven't#nbought any more. I wonder if it wasn't to their taste."
10056030-47 = "Kelp tea is so good though..."
10056030-48 = "[s] \"Did you harvest this kelp yourself?\""
10056030-49 = "D-don't be ridiculous!"
10056030-50 = "In general, the Diving Club is prohibited from any kind of fishing."
10056030-51 = "People have already been accusing us of poaching fish."
10056030-52 = "Fishing and diving are separate from one another, so neither side should encroach#nthe other's activities."
10056030-53 = "Yep. If you wanted to dive AND collect stuff, then you'd just join the#nAma-divers Club."
10056030-54 = "[s] \"What do you usually do then?\""
10056030-55 = "Well..."
10056030-56 = "Diving."
10056030-57 = "Freediving!"
10056030-58 = "Yeah, no. You're the only one who freedives all the way to the seabed."
10056030-59 = "We do all sorts of things under the sea, barring fishing."
10056030-60 = "Searching for dropped items, underwater photography, seabed mapping..."
10056030-61 = "Without the Diving Club, there would be no one to service facilities on the ocean#nbottom!"
10056030-62 = "We also make friends down there, like with sharks or turtles."
10056030-66 = "In short, we fix problems that occur on the ocean floor and receive payment for#nour work."
10056030-67 = "But... Ever since we moored in the D.U., there have been practically zero issues#nunderwater. As a result, not many people have been asking us for help."
10056030-68 = "All we do lately are \"fun dives\"—basically just exploring around underwater for#nfun."
10056030-69 = "[s5] \"Club activities can cover lots of different ground.\"\n[s6] \"I don't think it's bad to have nothing to do...\""
10056030-75 = "[ns] \"Where do you get your diving gear from?\""
10056030-77 = "Umm... Well..."
10056030-78 = "O-online shopping...?"
10056030-79 = "[s7] \"Isn't your gear expensive?\"\n[s8] \"How are you managing to get by with your finances?\""
10056030-82 = "Urk..."
10056030-86 = "Actually... we have... a little bit of a debt..."
10056030-87 = "[s] \"A debt!?\""
10056030-88 = "Strictly speaking though, it's a little different."
10056030-89 = "How much is it these days? How much are four drysuits worth...?"
10056030-90 = "Enough for 5,000 Aqua Seal single cones."
10056030-91 = "I-it's fine! There's no need to be worried! #nAll we need to do is find the treasure resting at the bottom of the ocean, and we'll be able to pay it off in one go...!"
10056030-92 = "[s9] \"But still... A debt...\"\n[s10] \"Is there any way you can cut back on expenses?\""
10056030-95 = "If it's just cutting back on costs..."
10056030-96 = "Well, diving inherently costs a lot of money."
10056030-97 = "And we can't exactly cheap out on safety..."
10056030-98 = "But if we don't dive, then our club has no purpose..."
10056030-99 = "We used to have a sponsor, but they suddenly stopped contacting us one day."
10056030-100 = "We've tried contacting them through every possible channel, but still no word."
10056030-101 = "It's been a month since we started using this abyss suit... No telling how much#nlonger it'll last in this state."
10056030-102 = "All of its joints are gonna turn rusty at this rate..."
10056030-103 = "A good opportunity. How about training without equipment?"
10056030-104 = "Stop basing your ideas off these \"Sayuri standards\" of yours!"
10056030-108 = "[ns] \"A sponsor...\""
10056030-110 = "[ns11] \"In that case, how about this?\"\n[ns12] \"I'll become your new sponsor.\""
10056030-114 = "You?"
10056030-115 = "Wh-what are you planning...?"
10056030-116 = "Is Island pulling the strings behind this decision?"
10056030-117 = "There's almost always a catch in these kinds of situations."
10056030-118 = "Maybe Sensei's just reaally niice?"
10056030-119 = "[s] \"Of course, I'm not doing this for free.\""
10056030-123 = "[ns] \"I'll have you all pay me back with your bodies.\""
10056030-124 = "By paying you back with our bodies..."
10056030-128 = "Surely, you don't mean—!?"