[translation]
12150-1 = "Episódio 15;A Batalha por Abydos (2)"
12150-3 = "Guaaaah?!"
12150-4 = "Seus malditos! Não passam de cães na coleira, como ousam...!"
12150-6 = "Cala a boca, eu lá quero saber disso! É muito melhor trabalhar com o Sensei do que com você! É simples assim!"
12150-7 = "Aha! Trair o contratante é o básico para qualquer fora-da-lei, né? Você nem conseguiu prever isso?"
12150-9 = "Pessoal da Faz-Tudo..."
12150-10 = "É verdade, para fora-da-lei, faz todo sentido."
12150-11 = "...Graças a vocês, nós acordamos. Não temos tempo para ficar hesitando agora."
12150-12 = "Isso mesmo! Acima de tudo, precisamos trazer a Hoshino-senpai de volta!!"
12150-13 = "Não quero saber se não somos reconhecidas ou se somos uma organização ilegal! Nada disso importa agora!"
12150-15 = "Salvar a Hoshino-senpai. É só isso que importa agora."
12150-16 = "Tsc, uma resistência inútil a essa altura...! Como ousam...!!"
12150-17 = "[s] \"...Como ousa fazer isso com a minha preciosa aluna.\""
12150-18 = "!!"
12150-19 = "[s] \"Eu vou pegar a Hoshino de volta.\""
12150-20 = "N-Não me venha com essa! Sensei, que direito você acha que tem—"
