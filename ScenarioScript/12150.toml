[translation]
12150-1 = "Эпизод 15;Осада Абидоса. Часть 2"
12150-3 = "А-а-а!"
12150-4 = "Вы смеете кусать руку, которая вас кормит?!"
12150-6 = "Заткнись! С чего вы вообще решили, что мы хотим с вами работать?! Сенсей обращается с нами куда лучше, чем вы, неудачники!"
12150-7 = "Ха-ха! Какие же мы злодейки, если не ударим нанимателя в спину? Вам следовало этого ожидать!"
12150-8 = ""
12150-9 = "Решатели проблем..."
12150-10 = "Они правы."
12150-11 = "...Да. Правы. Сейчас не время колебаться."
12150-12 = "Точно! Хошино нужна наша помощь! Мы должны её спасти!"
12150-13 = "Кому какое дело, признаны мы официально или нет? Если мы не спасём Хошино, тогда..."
12150-14 = ""
12150-15 = "Верно. Спасти её — наш главный приоритет. Всё остальное неважно."
12150-16 = "Вы! Сопротивление бесполезно! Как вы смеете...?!"
12150-17 = "[s] «Вы похитили одну из моих дорогих студентов.»"
12150-18 = "!!"
12150-19 = "[s] «Ничто не помешает мне спасти Хошино.»"
12150-20 = "Не говорите глупостей! Вы всего лишь учитель! У вас нет права..."
