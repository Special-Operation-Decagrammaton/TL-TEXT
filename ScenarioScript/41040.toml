[translation]
41040-1 = "Episódio 4;Circunstâncias sob Outro Ângulo"
41040-2 = "Prazer em conhecê-lo... Sensei."
41040-3 = "Eu me chamo Kaya, do Gabinete de Defesa, pertencente ao Conselho Estudantil Geral de Kivotos. Sou a responsável pelas questões de segurança dentro do Comitê Administrativo."
41040-4 = "[s1] \"Gabinete de Defesa...?\"\n[s2] \"Comitê Administrativo...?\""
41040-5 = "Entendo, parece que não está muito familiarizado, não é?"
41040-6 = "Entendo, parece que não está muito familiarizado, não é?"
41040-7 = "A Administradora Rin nunca chegou a comentar nada a respeito com o senhor?"
41040-8 = "[s] \"Desculpa, não muito...\""
41040-9 = "Bem, a Administradora Rin realmente é de poucas palavras."
41040-10 = "Então, aproveitando as apresentações, permita-me explicar brevemente."
41040-11 = "O Conselho Estudantil Geral, que cuida da administração de Kivotos, tem como órgão principal o \"Comitê Administrativo\". Ele é responsável pelas tarefas centrais e é composto por 11 divisões ao todo, como o \"Gabinete de Finanças\" e o \"Gabinete de Mediação\"."
41040-12 = "Além desse Comitê Administrativo, existe um órgão à parte sob a jurisdição da Administradora Rin: o \"Gabinete de Coordenação\", de caráter especial. A união desse \"Gabinete de Coordenação\" com o \"Comitê Administrativo\" de 11 divisões forma o \"Conselho Estudantil Geral\"... Acredito que pensar assim já dê uma boa ideia geral."
41040-13 = "Eu sou responsável pelo \"Gabinete de Defesa\", o órgão encarregado de proteger as alunas e os cidadãos contra forças que ameacem a segurança de Kivotos."
41040-14 = "[s] \"Entendi, obrigado pela explicação. Parece um trabalho bem difícil.\""
41040-15 = "De forma alguma, ocupo apenas uma posição de supervisão e me limito a dar instruções. Quem realmente tem o trabalho pesado são as unidades de campo, como a Kanna-san aqui."
41040-19 = "É verdade que, desde o desaparecimento da Presidente do Conselho Estudantil Geral, eu temia que surgissem diversos fatores de instabilidade..."
41040-20 = "Mas a Schale tem cuidado de tanta coisa para nós que, felizmente, a nossa carga de trabalho não aumentou tanto assim."
41040-21 = "Gostaria de aproveitar esta ocasião para expressar novamente a minha gratidão."
41040-22 = "[s3] \"Imagina, eu que agradeço. A propósito, queria perguntar uma coisa...\"\n[s4] \"A Valkyrie e a SRT ficam a cargo do Gabinete de Defesa?\""
41040-23 = "Exato. A Academia de Polícia Valkyrie, em princípio, opera sob as ordens do nosso Gabinete de Defesa, porém..."
41040-24 = "Exato. A Academia de Polícia Valkyrie, em princípio, opera sob as ordens do nosso Gabinete de Defesa, porém..."
41040-30 = "A Academia Especial SRT é uma organização um tanto peculiar, que fica fora do controle não apenas do Gabinete de Defesa, mas até mesmo do Comitê Administrativo."
41040-32 = "Como o senhor deve saber, os distritos autônomos de cada academia em Kivotos praticamente não sofrem interferência do Conselho Estudantil Geral. E cada distrito possui sua própria organização encarregada da segurança."
41040-33 = "Por exemplo, uma aluna que cause problemas na Academia Gehenna não é punida pelo Conselho Estudantil Geral, mas sim pelo Comitê Disciplinar de Gehenna, não é verdade?"
41040-36 = "Entretanto, crimes cometidos em outros locais... como no caso do D.U., por exemplo, ficam basicamente sob a jurisdição da Valkyrie."
41040-37 = "Só que, se a aluna fugir para o distrito autônomo de outra academia ou fizer conluio com algum conselho estudantil, a prisão se torna muito difícil."
41040-38 = "Claro que, mesmo nesses casos, sempre nos esforçamos para agir o mais rápido possível... mas esse tipo de resposta tardia tem seus limites."
41040-43 = "Foi justamente para resolver isso que nasceu a \"Academia Especial SRT\"."
41040-44 = "Elas receberam da própria Presidente do Conselho Estudantil Geral a autorização para agir imediatamente diante de qualquer crime, a qualquer hora e em qualquer lugar."
41040-49 = "Por essa razão, o processo seletivo da Academia Especial SRT é extremamente rigoroso, formando um grupo de elite. Seus equipamentos também estão entre os melhores de Kivotos."
41040-52 = "Como um dos resultados disso, a unidade do 3º ano da Academia Especial SRT — conhecida como \"Esquadrão FOX\" — conseguiu prender a Raposa da Calamidade, \"Wakamo\", que há anos era uma dor de cabeça para Kivotos. Além disso, acumularam diversos outros sucessos..."
41040-53 = "...Até o desaparecimento da Presidente do Conselho Estudantil Geral."
41040-55 = "Com o desaparecimento da Presidente do Conselho Estudantil Geral, a responsabilidade pela SRT ficou no ar."
41040-56 = "Nessas condições, a academia se tornou praticamente um barril de pólvora extremamente perigoso... e ninguém quis assumir a responsabilidade pela Academia Especial SRT."
41040-57 = "Nós também tentamos encontrar uma solução, mas... justamente por conta do equipamento de ponta delas, era difícil definir o momento certo e a forma de mobilizá-las..."
41040-58 = "...E, como consequência, a Academia Especial SRT acabou ficando de mãos atadas."
41040-59 = "[s] \"E por isso decidiram fechá-la?\""
41040-60 = "Claro que esse não foi o único motivo."
41040-61 = "Ainda não havia certeza de que a Presidente do Conselho Estudantil Geral não voltaria, e que a SRT deveria ser mantida... Havia também opiniões desse tipo dentro do Conselho Estudantil Geral."
41040-62 = "Eu mesma sou uma das pessoas que compartilham dessa opinião."
41040-63 = "Porém, talvez por perceberem que sua própria existência estava ameaçada... o \"Esquadrão FOX\" tomou uma atitude."
41040-64 = "[s5] \"'Esquadrão FOX'...\"\n[s6] \"O esquadrão que você mencionou antes, o primeiro a prender a Wakamo?\""
41040-65 = "Sim, exatamente."
41040-66 = "Sim, exatamente."
41040-67 = "No mês passado, o Esquadrão FOX atacou repentinamente o Conselho Estudantil Geral."
41040-68 = "Elas atacaram os membros que defendiam o fechamento da Academia Especial SRT e fugiram."
41040-69 = "Como resultado, parte das instalações da Torre Sanctum foi completamente incendiada. Vários membros do Conselho Estudantil Geral ficaram feridos e alguns precisaram ser hospitalizados."
41040-70 = "Depois disso, a Administradora tentou abrir discussões sobre a Academia Especial SRT sob diversas abordagens, mas..."
41040-74 = "Em seguida, o \"Esquadrão RABBIT\" também tentou apontar suas armas contra o Conselho Estudantil Geral. Foi aquele incidente recente no parque."
41040-75 = "Chegando a esse ponto, os demais membros do Conselho Estudantil Geral certamente..."
41040-76 = "...Sensei. Tenho ouvido falar dos seus feitos por toda Kivotos."
41040-77 = "Se as coisas continuarem assim, o \"Esquadrão RABBIT\" corre o risco de ter seus registros estudantis apagados, ficando sem poder pertencer a nenhuma academia e vagando sem rumo."
41040-78 = "Elas passaram pelo rigoroso exame de admissão da Academia Especial SRT; são, sem dúvida alguma, alunas de elite."
41040-79 = "Desperdiçar todo esse talento em vão seria uma perda imensa..."
41040-80 = "Se não se importar, poderia convencê-las e incentivá-las a se transferirem para a Academia de Polícia Valkyrie?"
41040-81 = "Se conseguirmos uma resposta positiva delas... acredito que, da minha parte, poderei persuadir rapidamente os demais para que não apaguem seus registros estudantis."
41040-82 = "[s] \"Bem, isso...\""
41040-83 = "Sei bem que será difícil convencê-las. No entanto —"
41040-84 = "[s] \"Mais do que a dificuldade de convencê-las...\""
41040-88 = "[ns] \"Não posso forçar as alunas a seguirem um caminho que elas não querem.\""
41040-90 = "...Entendo, ora vejam só."
41040-91 = "Tem razão. Cada uma delas certamente entrou na Academia Especial SRT carregando seus próprios sonhos..."
41040-92 = "Forçar a distorção desses desejos realmente me deixa desconfortável. E eu nem saberia o que dizer quando a Presidente do Conselho Estudantil Geral retornasse..."
41040-93 = "A princípio, seguindo as normas, falou-se em aplicar uma punição severa em nome da honra do Conselho Estudantil Geral, mas..."
41040-94 = "Ora, pouco me importam as normas!"
41040-95 = "C-Chefe do Gabinete de Defesa...?"
41040-96 = "Ah, peço perdão."
41040-97 = "Por favor, finja que não ouviu isso."
41040-98 = "Sensei. Nós, do \"Comitê Administrativo — Gabinete de Defesa\", cooperaremos ativamente com a Schale."
41040-99 = "Portanto, peço-lhe, por favor: poderia ajudá-las para que essas meninas consigam continuar perseguindo seus sonhos?"
41040-100 = "Deixo a decisão sobre o destino do \"Esquadrão RABBIT\" inteiramente nas suas mãos, Sensei."
41040-101 = "O senhor pode mantê-las na Schale sob sua supervisão, ou deixá-las livres como preferirem... Quanto a isso, fique totalmente à vontade."
41040-102 = "A única coisa difícil seria \"reabrir a Academia Especial SRT para que elas voltem\"..."
41040-103 = "[s] \"Tem certeza de que posso decidir isso?\""
41040-104 = "Sim. Apesar das aparências, gozo de bastante confiança dentro do \"Comitê Administrativo\"."
41040-105 = "Vamos apenas dizer que fiquei devendo um favor aos outros membros."
41040-106 = "Comparado ao futuro dessas alunas de elite, isso é um preço bem baixo."
41040-112 = "Então, Sensei... conto com o senhor para cuidar delas, está bem?"
41040-114 = "Próximo;Desconfiança que Não Se Apaga"
