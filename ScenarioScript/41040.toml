[translation]
41040-1 = "Эпизод 4;Положение Главы Штаба"
41040-2 = "Приятно познакомиться, Сенсей."
41040-3 = "Меня зовут Ширануи Кая, глава Оборонного Комитета в составе Административного совета Главного Студенческого Совета."
41040-4 = "[s1] «Административный совет?..»\n[s2] «Оборонный Комитет?..»"
41040-5 = "Не слышали о нём?"
41040-6 = "Не слышали о нём?"
41040-7 = "Вице-Президент Рин совсем ничего не рассказывала об этом, не так ли?"
41040-8 = "[s] «Неа.»"
41040-9 = "Ай-ай-ай. И правда, на редкость немногословная женщина."
41040-10 = "Ну тогда позвольте мне побыть Вашим учителем, Сенсей."
41040-11 = "Главный Студенческий Совет существует для выполнения всех административных задач Кивотоса. И эта колоссальная задача в основном решается силами Административного совета."
41040-12 = "Административный совет состоит из одиннадцати ведомств, таких как Казначейство и Комитет по правопорядку. Старший администратор Рин, как Вы знаете, руководит генеральным секретариатом, который следит за всеми нами."
41040-13 = "А я как раз из Оборонного Комитета! Мы усердно работаем для обеспечения безопасности учеников и жителей от плохишей, которые угрожают Кивотосу."
41040-14 = "[s] «Должно быть, ты довольно занятая.»"
41040-15 = "Хи-хи, с моей стороны было бы ложью утверждать так. Отдавать приказы - дело нехитрое. Это главе Канне и её сотрудникам приходится изо всех сил стараться, чтобы сохранить мир."
41040-16 = ""
41040-18 = ""
41040-19 = "Но знаете ли, ситуация стала крайне нестабильной с той поры, как исчезла президент Главного Студенческого Совета. Неопределённость, политические волнения и всё прочее в том же духе."
41040-20 = "Если бы не Шале, которое вовремя заполнило эту брешь, то я определённо была бы настолько занята, как Вы думали."
41040-21 = "Так что я хочу ещё раз поблагодарить Вас за всё, что Вы сделали. Возможно, как-нибудь за чашкой чая."
41040-22 = "[s3] «Ты сказала, что можешь помочь мне с ученицами из Академии SRT.»\n[s4] «Тогда Оборонный Комитет управляет Академией SRT?»"
41040-23 = "Видите ли, ученицы Полицейской Школа Валькирия находятся под командованием Оборонного Комитета, но…"
41040-24 = "Видите ли, ученицы Полицейской Школа Валькирия находятся под командованием Оборонного Комитета, но…"
41040-25 = ""
41040-27 = ""
41040-28 = ""
41040-30 = "Всё то объяснение структуры нашей организации, которое я только что дала, вообще не относится к Академии SRT."
41040-32 = "В Кивотосе есть множество академических округов, которые находятся вне юрисдикции Главного Студенческого Совета, или клубов, которые самостоятельно обеспечивают безопасность на своей территории."
41040-33 = "Например, если ученица нарушит закон внутри округа Геенны, тогда она будет нести наказания согласно законам Команды Префектов. Не нашего."
41040-36 = "Но предположим, что ученица совершила преступление в Округе Утнапиштим, где находится Шале, - тогда в дело вступают ученицы из Валькирии. Довольно просто, верно?"
41040-37 = "Но проблема возникает, если ученица совершает преступление в одном округе, а затем перемещается в другой. Кто тогда имеет право арестовать её? Бывали даже случаи, когда Студенческие Советы других академий намеренно помогали им скрыться."
41040-38 = "В подобных случаях мы направляем уведомление о сотрудничестве, но школы далеко не всегда идут навстречу."
41040-39 = ""
41040-43 = "Таким образом, мы приходим к созданию Академии SRT."
41040-44 = "Академия SRT задумывалась как что-то вроде Вас, Сенсей. Внесудебная сила, которая может противостоять преступникам вне зависимости от того, где они находятся. Естественно, исключительно с одобрения президента Главного Студенческого Совета."
41040-45 = ""
41040-49 = "Для достижения этой цели отбирались только самые талантливые ученицы. И они были вооружены самым лучшим, передовым снаряжением."
41040-50 = ""
41040-52 = "И, если быть честной, они быстро показали свою эффективность. Отряд FOX, состоящий из учениц SRT старшего курса, успешно арестовал Вакамо, известную по всему Кивотосу как Лисица Бедствия и совершенно неуловимая преступница."
41040-53 = "И тогда… Пуф. Президент Главного Студенческого Совета исчезает."
41040-55 = "Президент пропала, а ведь она была единственным человеком, отвечающим за Академию SRT и все её операции."
41040-56 = "Мне хочется сказать, что никто просто не захотел брать на себя ответственность за этих хорошо обученных, до зубов вооружённых учениц. Но на самом деле - никто попросту не мог."
41040-57 = "Поначалу нашему Оборонному Комитету было поручено взять под контроль учениц SRT, но наши…  попытки были сильно ограничены из-за их ультрасовременного снаряжения."
41040-58 = "И в конце концов Академия SRT превратилась в пустую оболочку."
41040-59 = "[s] «Я не думаю, что это хорошая причина для её закрытия.»"
41040-60 = "Это была далеко не единственная причина."
41040-61 = "Честно говоря, многие руководители хотели сохранить Академией SRT до возвращения президента Главного Студенческого Совета."
41040-62 = "И я была среди них."
41040-63 = "Но… Ну… Понимаете, члены отряда ЛИС вовремя осознали, что их существование находится под угрозой. А они не из тех, кто будет послушно ждать, пока мы разрушаем их привычный образ жизни."
41040-64 = "[s5] «Отряд FOX...»\n[s6] «А студенты, которых ты упоминала ранее?»"
41040-65 = "Да. Лучший отряд Академии SRT, который схватил Вакамо, Лисицу Бедствия, и множество других опасных преступников."
41040-66 = "Да. Лучший отряд Академии SRT, который схватил Вакамо, Лисицу Бедствия, и множество других опасных преступников."
41040-67 = "Ещё буквально до прошлого месяца ученицы SRT всё ещё были полностью укомплектованы своим передовым снаряжением."
41040-68 = "Услышав слух о планах закрыть школу, Отряд FOX вооружился и атаковал Генеральный Студенческий Совет. Их целью стали те, кто громче всех выступал против них, а после нападения они бесследно исчезли."
41040-69 = "Сгорели не только некоторые строения Башни Санктум, но и множество учениц из студенческого совета были серьёзно ранены и госпитализированы."
41040-70 = "После этого вмешалась Вице-Президент. Она приказала полностью закрыть Академию SRT и немедленно изъять всё оружие."
41040-71 = ""
41040-73 = ""
41040-74 = "Но прежде чем мы успели это сделать, Отряд RABBIT сбежал, прихватив с собой всё оружие."
41040-75 = "Так что прямо сейчас во всём Генеральном Студенческом Совете Вы не найдёте ни одной сочувствующей им души."
41040-76 = "Сенсей, я слышала, что Вы действительно всем сердцем заботитесь о своих студентах."
41040-77 = "Честно говоря, я уже на пределе. Академические награды членов Отряда RABBIT вот-вот полностью аннулируют. И всё, что останется от Академии SRT - это горстка преступников и бродяг."
41040-78 = "Но ведь они не бродяги. Они элитные ученицы, которые были скрупулезно отобраны для Академии SRT."
41040-79 = "Терять таких талантливых учениц… Это станет невосполнимой потерей для всего Кивотоса."
41040-80 = "На этом наш длинный монолог закончен. Сможете ли Вы убедить отряд RABBIT перевестись в Валькирию?"
41040-81 = "Если они согласятся на перевод, я уговорю глав других ведомств не исключать их."
41040-82 = "[s] «Не знаю, смогу ли.»"
41040-83 = "Я знаю, что поставила перед Вами немалую задачу…"
41040-84 = "[s] «Дело не в том, чтобы убедить их.»"
41040-85 = ""
41040-87 = ""
41040-88 = "[ns] «Я просто не могу заставить их вступить на путь, которого они не хотят.»"
41040-89 = ""
41040-90 = "…Полагаю, слухи о Вас были правдивы, Сенсей."
41040-91 = "Все эти ученицы лезли из кожи вон, чтобы поступить в Академию SRT, поскольку они верили в неё. И как их учитель, Вы не будите просить их поступиться своими идеалами в угоду нуждам Генерального Студенческого Совета."
41040-92 = "Ну, на самом деле я и сама никогда не одобряла их исключение. Как я буду смотреть в глаза президенту, когда она вернётся?"
41040-93 = "Какая дилемма. Технически, отряд RABBIT должен быть наказан по всей строгости закона…"
41040-94 = "Но правила созданы, чтобы их нарушать!"
41040-95 = "Гла-глава Комитета?"
41040-96 = "Ой, я не должна была так говорить, верно?"
41040-97 = "Давай просто забудем об этом, глава Канна."
41040-98 = "Сенсей, Оборонный Комитет с радостью окажет Вам поддержку."
41040-99 = "Я бы очень хотела увидеть счастливый конец, который Вы себе представляете. Прошу, ведите учениц к их мечте."
41040-100 = "Вместо Дисциплинарного Комитета я позволю Вам решить судьбу отряда RABBIT."
41040-101 = "Отправляйте их, куда они захотят, хоть оставляйте при Шале. Всё, что пожелаете."
41040-102 = "Ну, только если Вы не потребуете снова открыть Академию SRT. Моё влияние всё же имеет границы."
41040-103 = "[s] «Ты уверена?»"
41040-104 = "Ха-ха! Я никогда не была так уверена."
41040-105 = "Административный Комитет верит в меня, а я так или иначе улажу этот вопрос с остальными руководителями."
41040-106 = "Это малая цена за нашу основную цель, верно?"
41040-107 = ""
41040-109 = ""
41040-110 = ""
41040-112 = "Сенсей, прошу, направьте Академию SRT в будущее, в которое верите."
41040-114 = "Следующий эпизод;Нерешённое недоверие"
