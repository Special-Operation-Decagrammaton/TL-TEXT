[translation]
2601102-1 = "Неужели я — легенда?"
2601102-2 = "Получив сообщение от Сатэн, я отправился в торговый квартал."
2601102-3 = ""
2601102-7 = "Даже издалека было видно, как её глаза сияют от восторга."
2601102-8 = ""
2601102-10 = ""
2601102-11 = ""
2601102-12 = ""
2601102-13 = ""
2601102-14 = ""
2601102-15 = "Ух ты... Не могу поверить... Я правда не могу поверить!"
2601102-16 = "Это реально? Я ведь не забрела случайно в какой-нибудь тематический парк? Или это шоу со скрытой камерой?"
2601102-17 = "Или, может, здесь снимают фильм... Наверняка так, правда?"
2601102-18 = "Люди с крыльями, люди с рогами, люди со звериными ушами и хвостами..."
2601102-19 = "Тут даже настоящие зверолюди есть!"
2601102-20 = "[s1] ...Сатэн?\n[s2] Чем ты занимаешься?"
2601102-23 = ""
2601102-25 = ""
2601102-26 = ""
2601102-27 = ""
2601102-28 = "А в небе — яркий столб света и нимб...!!"
2601102-29 = "[s3] Ты что-то слишком возбуждена...\n[s4] Эм... Сатэн?"
2601102-32 = "...?! А-а!"
2601102-33 = "О! А, это всего лишь ты, Сенсей!"
2601102-34 = "Ты меня напугал... Я всё ещё не отошла после того, как убежала от говорящего пса..."
2601102-35 = "То есть... Он выглядел как милый щеночек, но всё же..."
2601102-36 = "Да...?"
2601102-37 = "Мне не нужно их бояться? Они не злые?"
2601102-38 = "Ох... Эм..."
2601102-39 = ""
2601102-41 = ""
2601102-42 = "...Не то чтобы я испугалась или что-то такое."
2601102-43 = "[s5] Вот как?\n[s6] А твоя реакция только что тогда..."
2601102-46 = "Ну... Да, я немного удивилась..."
2601102-47 = "Ой, ты ведь не переживаешь за меня? Прости! Я не хотела тебя волновать."
2601102-48 = "Просто... Я никогда раньше ничего подобного не видела, а теперь всё это сразу передо мной."
2601102-49 = "Если особо не присматриваться, это место очень похоже на Академгородок. Но стоит обратить внимание — различия огромные..."
2601102-50 = "И ещё..."
2601102-51 = "Будто все городские легенды, о которых я когда-либо читала, существуют здесь одновременно..."
2601102-52 = "Это всё так потрясающе!"
2601102-53 = "Но... Эм..."
2601102-54 = ""
2601102-56 = ""
2601102-57 = "Есть одна вещь... Только одна вещь немного не оправдывает моих... ожиданий, наверное."
2601102-58 = "Все здесь ведут себя так, будто это совершенно нормально, поэтому всё это совсем не ощущается городской легендой..."
2601102-59 = "[s7] Для них это и есть совершенно нормально.\n[s8] Городская легенда зависит от того, кто на неё смотрит."
2601102-62 = "Наверное, в этом есть смысл..."
2601102-63 = ""
2601102-65 = ""
2601102-66 = "О?"
2601102-67 = "Погоди! Получается... Здесь городская легенда — это я?!"
2601102-68 = "[s9] Ты имеешь в виду как человек из другого мира?\n[s10] Если посмотреть с этой стороны, то, наверное, да."
2601102-71 = "...!"
2601102-72 = "Правда ведь? Я даже не думала об этом с такой стороны!"
2601102-73 = "Настоящей городской легендой... всё это время была я сама..."
2601102-74 = "О-о-о..."
2601102-75 = "Сенсей...? Эм..."
2601102-76 = ""
2601102-78 = ""
2601102-79 = ""
2601102-80 = ""
2601102-81 = "Я... кажусь тебе загадочной?"
2601102-82 = "[s11] Даже не знаю, что на это ответить.\n[s12] Эм... Наверное?"
2601102-85 = "По твоему лицу так не скажешь... Какая жалость."
2601102-86 = "Ничего страшного, если я здесь всё та же обычная я. Похоже, сегодня я не увидела ничего, что было бы действительно необычным для местных жителей."
2601102-87 = "Но у вас ведь наверняка есть свои городские легенды, правда? Истории о призраках или всякая оккультная мистика!"
2601102-88 = "[s13] Ловко ты сменила тему.\n[s14] Ты ведь вообще не умеешь сдаваться, да?"
2601102-91 = "Конечно нет! Если тебе что-то по-настоящему важно, надо продолжать за этим гнаться!"
2601102-92 = "Пойдём искать городские легенды, Сенсей! Такую, которая будет достойна этого удивительного мира!"
2601102-93 = ""
2601102-95 = ""
2601102-96 = "[ns] «...»"
2601102-98 = "[ns] Последовать за Сатэн."
2601102-100 = "Я последовал за возбуждённой Сатэн, пока она исследовала Кивотос."
2601102-101 = "Как я и ожидал, никаких городских легенд мы так и не нашли..."
