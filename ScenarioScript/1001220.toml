[translation]
1001220-1 = "Предел Тренера"
1001220-2 = "Парк возле Шале"
1001220-3 = "Очередной день, очередная пробежка с Сумирэ в шесть утра..."
1001220-4 = ""
1001220-10 = "Прости, что заставила ждать, Тренер."
1001220-11 = "Собирать экипировку оказалось намного дольше, чем я думала."
1001220-12 = "[s] «Ничего. Я ждал недолго.»"
1001220-14 = "[ns] «Кстати, эта экипировка нужна для нашей пробежки?»"
1001220-15 = "Конечно."
1001220-16 = "Для любого упражнения правильная подготовка — ключ."
1001220-17 = "Будь то беговая дорожка или асфальт, неправильная экипировка может привести к серьёзным травмам!"
1001220-18 = "[s] «Понятно...»"
1001220-19 = "Я давно не бегала, поэтому пришлось купить новую экипировку."
1001220-20 = "Новая тренировка, новое место... кажется, у меня даже мурашки. Хи-хи."
1001220-21 = "Ну что... начнём с лёгкой пробежки?"
1001220-22 = ""
1001220-24 = ""
1001220-25 = ""
1001220-26 = ""
1001220-28 = "Примерно десять минут спустя..."
1001220-35 = ""
1001220-36 = "*тяжело дышит* *тяжело дышит*"
1001220-37 = "[s] «...Сумирэ, ты в порядке?»"
1001220-38 = "Да. Мы ещё даже километра не пробежали."
1001220-39 = "Я могу так весь день."
1001220-40 = "[s1] «По тебе не скажешь.»\n[s2] «Ты уверена? Ты немного запыхалась.»"
1001220-43 = ""
1001220-45 = ""
1001220-46 = ""
1001220-47 = "Нет... Я полностью в порядке."
1001220-48 = "На самом деле чувствую себя даже лучше обычного."
1001220-49 = "Знаю, я вроде тяжело дышу..."
1001220-50 = ""
1001220-52 = ""
1001220-53 = ""
1001220-54 = "Наверное, просто взяла на один мешок с песком слишком много."
1001220-55 = "[s] «...Мешки с песком?»"
1001220-56 = "Да, сегодня перед пробежкой я закрепила мешки с песком на руках и ногах."
1001220-57 = "Возможно, привязала несколько лишних."
1001220-58 = "[s3] «Пробежка с утяжелителями? Впечатляет.»\n[s4] «Разве обычных тренировок недостаточно?»"
1001220-61 = "Если хочу продолжать становиться сильнее, нужно заставлять мышцы работать по-новому."
1001220-62 = "Важно не перегружаться, но если всё время делать одни и те же упражнения, прогресса не будет."
1001220-63 = "Дойти до предела, а потом изо всех сил его превзойти... Вот настоящая тренировка!"
1001220-64 = "[s] «Впечатляющий подход...»"
1001220-66 = "[ns] «Если так подумать, может, и мне стоит повысить нагрузку.»"
1001220-67 = "Хорошая идея, Тренер."
1001220-68 = "Если хочешь усложнить пробежку, возьми несколько этих мешков."
1001220-69 = "Я принесла по два комплекта на руки и ноги, так что один можешь взять себе."
1001220-70 = "[s] «Ладно, попробую.»"
1001220-71 = ""
1001220-75 = "[ns] «Почему они такие тяжёлые?!»"
1001220-76 = "А? Правда?"
1001220-77 = "Я точно рассчитала вес, который нужен для укрепления мышц без перегрузки..."
1001220-78 = "[s] «Сколько они вообще весят?»"
1001220-79 = "Не так уж много."
1001220-80 = "По пять килограммов с каждой стороны, всего десять?"
1001220-81 = "[s] «Это же почти как бегать с гантелей.»"
1001220-82 = "Что? Нет, конечно."
1001220-83 = "Хи-хи, это выглядело бы очень глупо."
1001220-84 = "Хотя... может быть забавным новым упражнением. Как-нибудь в другой раз."
1001220-85 = "[ns5] (Будто ноги закованы в кандалы.)\n[ns6] (Как Сумирэ вообще с ними бегает?)"
1001220-88 = ""
1001220-89 = "Хорошо, Тренер. Нам ещё далеко, так что выше ноги!"
1001220-90 = "Раз, два! Раз, два!"
1001220-91 = ""
1001220-93 = ""
1001220-99 = "[ns] «П-Подожди меня!»"
1001220-101 = "Я пытался продолжить пробежку с мешками, которые дала Сумирэ."
1001220-102 = "Но они оказались слишком тяжёлыми, и вскоре ноги отказали."
