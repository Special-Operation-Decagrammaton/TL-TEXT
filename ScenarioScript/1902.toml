[translation]
1902-1 = "Внеплановый аудит Префектурной команды"
1902-2 = "Конференц-зал Префектурной команды"
1902-3 = "...И это вкратце весь план тактических учений Префектурной команды, запланированных на следующий месяц."
1902-4 = "Это то, что вы придумали после того, как отвергли план Общества Пандемониума?"
1902-5 = "Мы считаем нынешний план более чем приемлемым."
1902-6 = "Насколько мне известно, бюджетная смета уже подана, поэтому после рассмотрения я прошу Общество Пандемониума её утвердить."
1902-7 = "Я получила вашу смету и ознакомилась с ней, старший администратор."
1902-8 = "Что ж..."
1902-9 = "Ваше предложение отклонено."
1902-10 = "Прошу прощения? В этой смете не должно быть ни единой ошибки."
1902-11 = "Возможно."
1902-12 = "Тогда почему...?"
1902-13 = "Отклонено — и точка."
1902-14 = "Если вам кажется, что мы что-то упустили, мы всегда можем внести правки в смету."
1902-15 = "Бесполезно. Неужели не понимаете? Как бы вы её ни исправляли, бюджет всё равно будет отклонён."
1902-16 = "По какой причине? Почему вы не говорите?"
1902-17 = "Ладно. Потому что я уже давно считаю, что бюджет Префектурной команды следует проверять куда тщательнее."
1902-18 = "Иначе как мне выяснить, не присваивает ли кто-нибудь наши средства?"
1902-19 = "(Она это серьёзно?! Никто не транжирит деньги налогоплательщиков Геенны сильнее Общества Пандемониума.)"
1902-20 = "П-Понятно. Тогда это может означать только одно..."
1902-21 = "Именно. Мы решили немедленно начать аудит Префектурной команды."
1902-22 = "Постойте! Вы не можете просто взять и сделать это!"
1902-23 = "Это не прихоть. Насколько мне известно, в последнее время внутри Префектурной команды возникли некоторые проблемы."
1902-24 = "Например, некая администратор, помимо главы префектов, самовольно отдавала приказы вашим войскам... или что-то в этом роде."
1902-25 = "...!"
1902-26 = "А-ха-ха! Ну и лицо у тебя!"
1902-27 = "(Обычно она пропускает мимо ушей всё важное, что мы говорим, но ЭТО, конечно же, узнала. Тц.)"
1902-28 = "Не забывай, Амау Ако: от Общества Пандемониума ничто не ускользает!"
1902-29 = "(Змея!)"
1902-30 = "Полагаю, здесь произошло какое-то недоразумение, поэтому я ещё раз просмотрю документы."
1902-31 = "А, вот как. Наверное, просто вышла путаница."
1902-32 = "Вот как ты хочешь сыграть...?"
1902-34 = "Очень хорошо! Готовьтесь к аудиту — на этот раз вам не отвертеться! Ха-ха-ха!"
1902-36 = ""
1902-37 = ""
1902-38 = ""
1902-39 = "Прекрасно. Просто прекрасно."
1902-42 = ""
1902-43 = "Есть работа, Ироха."
1902-44 = "Что такое, Макото?"
1902-45 = "С этого момента я приказываю провести аудит Префектурной команды! Копай глубже и вытащи наружу всё, что только сможешь о них найти!"
1902-46 = "Покажи им, что бывает, когда они играют с нашим бюджетом. Докажи всему Кивотосу, насколько страшным может быть Общество Пандемониума, Ироха!"
1902-47 = "Если уж надо."
1902-48 = "Ч-Что это сейчас было, Ироха?"
1902-49 = "*вздох* Ничего. Значит, мне просто нужно провести аудит, верно?"
1902-50 = "Да! Чтобы уничтожить Префектурную команду!"
1902-51 = "Это всего лишь аудит. Как он вообще должен их уничтожить?"
1902-52 = "Хе-хе-хе... Это наш шанс потрясти Префектурную команду до основания и сделать так, чтобы они больше никогда не помыкали Обществом Пандемониума."
1902-53 = "Как скажешь. Конечно."
1902-54 = "Ты хотя бы можешь слушать меня, пока я говорю?"
1902-56 = "Итак... да! Мы пришли провести аудит Префектурной команды!"
1902-57 = "*вздох* Какая морока..."
1902-58 = "Макото доверила Ибуки эту работу, так что Ибуки постарается изо всех сил!"
1902-59 = ""
1902-61 = "П-Погодите. Мы начинаем прямо сейчас?!"
1902-62 = "Наши учения уже совсем скоро. Если проводить аудит сейчас, график станет ещё плотнее."
1902-63 = "Что вообще происходит, Ако?! Президента даже нет на месте!"
1902-64 = ""
1902-66 = "Тц."
1902-67 = "Сдавайся. Это прямой приказ от руководства Общества Пандемониума."
1902-68 = "Всё в порядке. Нам нечего скрывать. Вы сами увидите, что управление у нас безупречное."
1902-69 = "Более того, когда Общество Пандемониума закончит своё бессмысленное расследование, оно наконец поймёт, что Префектурной команде нечего скрывать."
1902-70 = "Так что делайте что хотите!"
1902-71 = "Ако принимает это слишком близко к сердцу..."
1902-72 = "Если честно, от того, как она завелась, мне только тревожнее."
1902-73 = ""
1902-75 = "Тогда начнём."
1902-76 = "Первое место, которое мы хотели бы посетить..."
1902-77 = "...штаб Префектурной команды."
1902-79 = "Коридор штаба Префектурной команды"
1902-80 = "Здесь вообще есть что проверять? Это просто коридоры."
1902-81 = "Хм. Понятно."
1902-82 = "Ч-Что там ещё может быть?"
1902-83 = ""
1902-84 = ""
1902-86 = "Свежий выпуск периодической газеты Общества Пандемониума не выставлен для проходящих мимо."
1902-87 = "Придётся снять баллы."
1902-88 = "Что?!"
1902-89 = "Какого...?!"
1902-90 = "*вздыхает*"
1902-91 = ""
1902-92 = "Периодическое издание Общества Пандемониума должно висеть на доске объявлений в каждом здании, чтобы новости регулярно доходили до всех. Это школьное правило."
1902-93 = "С каких это пор?!"
1902-94 = "С тех пор как Макото предложила и ввела это правило два месяца назад. Понимаю, уведомление могло ещё не дойти до всех..."
1902-95 = "...но правила есть правила."
1902-96 = "Это абсурд!"
1902-97 = "Часть бюджета ваших тактических учений придётся перенаправить на устранение этой проблемы."
1902-98 = "Запишу это как «обслуживание доски объявлений»."
1902-99 = "У-ух..."
1902-100 = ""
1902-101 = "Ближе к делу."
1902-103 = "Комната отдыха на втором этаже штаба Префектурной команды"
1902-104 = "Этой комнатой отдыха регулярно пользуются наши сотрудники. Её тоже обязательно проверять?"
1902-105 = "Да. Нужно проверить, есть ли в наличии все обязательные припасы и не истёк ли у чего-нибудь срок годности."
1902-106 = "Такие вещи необходимо проверять, иначе ваши цифры будут неточными и вводящими в заблуждение."
1902-107 = "В таком случае нам точно нечего бояться!"
1902-108 = "Эй, Ироха?"
1902-109 = "Что такое, Ибуки?"
1902-110 = "А у них нет горячего какао?"
1902-111 = ""
1902-112 = ""
1902-113 = "Нет. Ещё одно замечание. Бюджет снова придётся перераспределить, чтобы здесь был достаточно широкий выбор для любых гостей."
1902-115 = "Что?! Кто вообще пьёт горячее какао в это время года?!"
1902-116 = ""
1902-117 = "Кто знает? Но иметь запас на разные вкусы любого возможного гостя — элементарная предусмотрительность."
1902-118 = "Что ещё важнее, Макото велела придираться даже к самым мелким вещам, в которых можно найти недостаток."
1902-119 = "Погодите, что?! А эту часть вы вообще должны были говорить нам вслух?!"
1902-120 = "Тогда сделайте вид, что не слышали. Я не больше вашего хочу здесь находиться."
1902-121 = "Продолжим..."
1902-122 = ""
1902-124 = "..."
1902-126 = "Ироха продолжала безжалостно урезать и перераспределять бюджет Префектурной команды."
1902-128 = "Вот это, то, ещё это и вот то тоже..."
1902-129 = "Сократить, изменить, сократить, убрать, отменить и снова сократить."
1902-130 = "...!"
1902-131 = "*качает головой*"
1902-132 = "Это возмутительно! Я не просто буду жаловаться — я подам официальную претензию!"
1902-133 = "От этих слов ничего не изменится. Я всего лишь госслужащая, выполняющая свою работу."
1902-134 = "Лично я ничего не имею против Префектурной команды, так что ругать посланника бессмысленно."
1902-135 = ""
1902-136 = ""
1902-137 = ""
1902-138 = ""
1902-140 = "Финансовый аудит продолжался ещё три часа."
1902-142 = "Итак, в итоге было перераспределено около 95 процентов нынешнего бюджета тактических учений."
1902-143 = "Вы издеваетесь?! На сами учения почти ничего не осталось!"
1902-144 = "Если эти изменения окончательные, наш следующий тренировочный лагерь придётся..."
1902-145 = "Осталось сделать последнее..."
1902-146 = ""
1902-147 = ""
1902-149 = "Ля-ля-ля-ля!"
1902-150 = "Эй, ты. Смотри куда...!"
1902-151 = ""
1902-152 = ""
1902-153 = ""
1902-154 = ""
1902-156 = "Ибуки!"
1902-157 = "А-Ай... *шмыг*"
1902-158 = "Ибуки, ты в порядке? Не ушиблась?"
1902-159 = "Ты сильно упала. Всё нормально?"
1902-160 = "*шмыг* Д-Да. И-Ибуки в порядке... *шмыг*"
1902-161 = ""
1902-162 = ""
1902-163 = ""
1902-164 = "А теперь бюджет ваших ближайших учений и следующего квартала равен нулю."
1902-166 = "Что?! А куда делись оставшиеся пять процентов?!"
1902-167 = "Не могли бы вы объяснить?"
1902-168 = "Всё просто: вы довели Ибуки до слёз."
1902-169 = "Да вы издеваетесь! Вы уже даже не пытаетесь делать вид, что это профессионально!"
1902-170 = "Заставить Ибуки плакать — тяжелейшее нарушение."
1902-171 = "Точно! Макото всё время так говорит!"
1902-172 = "Но это офис! Конечно, если носиться тут как сумасшедшая, на пути что-нибудь попадётся!"
1902-173 = "Вы заранее знали, что мы придём, так что времени расчистить проход было предостаточно. Если Макото узнает, что Ибуки пострадала..."
1902-174 = "...она взбесится и обвинит вас в травмировании аудитора. Я просто ускоряю процесс."
1902-175 = "Не хочу второй раз сюда тащиться только затем, чтобы сообщить вам её решение."
1902-176 = "Тирания!"
1902-177 = "Теперь Префектурной команде придётся составить бюджет заново с нуля, поэтому прошу предоставить все документы о том, как вы собираетесь покрыть возникшие недочёты."
1902-178 = ""
1902-179 = ""
1902-180 = "Ха-ха-ха! Прекрасно, Ироха! Ты великолепно справилась!"
1902-181 = "Макото."
1902-182 = "Теперь вы понимаете, старший администратор Ако? Вот что бывает, когда Общество Пандемониума берётся за дело всерьёз."
1902-183 = "Тц."
1902-184 = "Пора прекратить это бессмысленное сопротивление и узнать своё место!"
1902-185 = "Префектурная команда — всего лишь пешка Общества Пандемониума!"
1902-186 = "Примите это и привыкайте жить под моим каблуком!"
1902-187 = "Всё, что вам нужно, — послушно переворачиваться по нашей команде, как собачки!"
1902-188 = "Это всего лишь аудит."
1902-189 = "Планы по перераспределению бюджета составлены, но администрация ещё должна их обработать, и... Вы меня не слушаете."
1902-191 = "И вот что произошло ранее."
1902-192 = "*нервно оглядывается*"
1902-193 = "Вот как. Пока меня не было, многое произошло."
1902-194 = "*вздох* Эти змеи. Я хотела избежать встречи с ними, но теперь выбора почти нет."
1902-195 = "П-Председатель?"
1902-196 = "Глава... префектов?"
1902-197 = ""
1902-199 = "Я скоро вернусь."
1902-203 = "После этого угол штаб-квартиры Общества Пандемониума по неизвестным причинам рухнул под взрывами и градом пуль."
1902-204 = "Но это уже совсем другая история..."
1902-205 = "Внеплановый аудит Префектурной команды"
