[translation]
1015202-1 = "A Special Performance"
1015202-2 = "(Headed to the park where Tsumugi is.)"
1015202-11 = "Oh my. To think you'd arrive so early."
1015202-12 = "Is this the heart of a 'huntsman' pitying Snow White?"
1015202-13 = "Or perhaps the heart of one who has come to welcome the sleeping princess?"
1015202-14 = "……Either is fine. What matters is, Sensei's—"
1015202-19 = "—'Heart'."
1015202-24 = "……So then."
1015202-25 = "Hehe, thank you for coming. I shall tune my instrument carefully today, so that I may respond to your feelings, Sensei."
1015202-26 = "[s1] \"Sorry for interrupting your prep.\"\n[s2] \"Is there anything I can help with?\""
1015202-29 = "How kind of you……."
1015202-30 = "But please, don't worry about it. Preparing on my own is part of the charm of street performing, after all."
1015202-31 = "That said, I would like to return the favor for your kindness."
1015202-32 = "What would you like? I don't have anything ready right now, but……."
1015202-33 = "Let's see, if you don't mind, Sensei—"
1015202-34 = "Huh? What's that guy doing here?"
1015202-36 = "People are trying to take a nap here, so keep it down……."
1015202-37 = "Heh! You're gonna pay for disturbing our sleep!"
1015202-38 = "Hey! You with the guitar!"
1015202-39 = "Oh, is there something you need?"
1015202-40 = "Huh? Why is this chick acting so calm?"
1015202-41 = "You ruined our nap! What are you gonna do about it!"
1015202-42 = "If you pay us a nuisance fee, we might let you off the hook."
1015202-43 = "I'm afraid I don't have any cash on me."
1015202-44 = "Then hand over that guitar!"
1015202-45 = "Do it now if you don't want to get hurt! Heh!"
1015202-46 = "……Hehe, hehehe."
1015202-47 = "Huh? What are you giggling at?"
1015202-48 = "To think you'd recognize the value of this guitar—"
1015202-49 = "Could it be that you have an interest in art?"
1015202-50 = "Art? Who cares about that!"
1015202-51 = "Then…… allow me to teach you."
1015202-56 = "This is not just a guitar, but a work of art called an 'Escopetarra'."
1015202-57 = "This piece, which symbolizes pacifism—"
1015202-58 = "is characterized by the fusion of a gun and a guitar."
1015202-59 = "……Huh?"
1015202-60 = "Usually, one would make a guitar that doesn't fire live rounds based on the shape of a gun……."
1015202-61 = "But I made an Escopetarra based on the shape of a guitar that actually fires live rounds."
1015202-62 = "……This way, I can play a wider variety of sounds."
1015202-66 = "Would you like to hear it once?"
1015202-67 = "My 'special performance'."
1015202-73 = "Guh……!?"
1015202-83 = "Oh my, to collapse from just this much……."
1015202-84 = "Was my performance that shocking?"
1015202-85 = "[ns3] \"Th-that really was a special performance…….\"\n[ns4] \"I-is this Tsumugi's version of pacifism……?\""
1015202-88 = "Conflict is born from the will to use violence."
1015202-89 = "If so, isn't the act of cutting off the root of that conflict also—#nconsidered pacifism?"
1015202-90 = "Peace is not merely the absence of violence."
1015202-91 = "Peace is the manifestation of a merciful heart."
1015202-92 = "Yes. I play my Escopetarra with a heart of mercy."
1015202-93 = "If I hadn't put those people to sleep just now……#neveryone here, including you, Sensei, would have been in danger."
1015202-94 = "[s] \"H-human death is social welfare……!\""
1015202-95 = "Hehe, please take that phrase merely as a message."
1015202-96 = "Because 'Love and Peace'—is very important."
1015202-97 = "Now then, the preparations are complete…… the street performance begins."
1015202-98 = "[s] \"What kind of song are you playing today?\""
1015202-99 = "I was planning to start with my usual songs, but……."
1015202-100 = "Let's see…… I just had an interesting arrangement come to mind—"
1015202-101 = "So I think I'll perform a song that can only be played with this guitar.#nNow, what kind of song could it be?"
1015202-102 = "[s] \"Wait…… don't tell me……?\""
1015202-103 = "Yes. It is exactly that."
1015202-104 = "……Let us begin."
1015202-114 = "Kneel before me!! You ruffians!!"
1015202-115 = "Love and Peace! Love and Peeeeace!!"
1015202-120 = "[ns] \"Whoa…….\""
1015202-121 = "(This is a much more intense stage than usual……)"
1015202-126 = "U-ugh…… did I pass out……?"
1015202-132 = "Wake up! You guys! This is no time to be sleeping!"
1015202-133 = "Ugh…… what is this deafening noise……!"
1015202-134 = "Wait, that is……!"
1015202-135 = "Love and Peace! Love and Peeeeace!!"
1015202-141 = "WAAAAAAHHHHHHH!!!!"
1015202-142 = "Yikes! Th-these people! They're insane!"
1015202-143 = "We shouldn't have messed with them……! Run away!"
1015202-144 = "W-we're sorryyyyyyy!!"
1015202-151 = "(After that, a rumor spread among the delinquents: 'Be careful of the woman with the guitar in the plaza'—or so they say……)"
