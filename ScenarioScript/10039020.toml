[translation]
10039020-1 = "Эпизод 2;Путь к славе поп-идола: костюм"
10039020-2 = "...Вот как всё обстоит."
10039020-3 = ""
10039020-5 = ""
10039020-6 = "Если так, вы двое точно пришли по адресу!"
10039020-7 = "Когда речь об идолах, всё решает внешний вид! Милота — их главная черта. Если ты милая, это решает вообще всё!"
10039020-8 = "[s1] «...?! Н-Нономи...?»\n[s2] «Ты выглядишь невероятно воодушевлённой...»"
10039020-11 = "В-Внешний вид...? Понятно...?"
10039020-12 = "О...? Вы удивлены. Я думала, вы и так это знаете."
10039020-13 = "Ну, раз вы пришли за помощью именно к НАМ, значит, знаете, что мы сами уже готовимся к выступлению в роли идолов."
10039020-14 = "Если что-то понадобится — только скажите. Такая возможность помочь Сенсею выпадает редко, так что все с радостью подключатся!"
10039020-15 = "Ох!"
10039020-16 = "Спасибо! Я вам всем так благодарна."
10039020-17 = ""
10039020-19 = ""
10039020-20 = "Эм, хотя... простите, что спрашиваю..."
10039020-21 = "А все остальные... сейчас заняты? Кажется, здесь никого кроме вас."
10039020-22 = "О. Ну, это потому что..."
10039020-23 = ""
10039020-25 = ""
10039020-26 = "Хи-хи. Вообще-то, вы подняли хороший вопрос."
10039020-27 = "Можете вы двое помочь мне с одной маленькой вещью?"
10039020-28 = "[s3] «Ого, это квест?»\n[s4] «Что-то случилось?»"
10039020-31 = "Вроде того. Понимаете, я полностью за то, чтобы мы стали идолами, но некоторые из нас немного... стесняются."
10039020-32 = "Хм?"
10039020-33 = "Стесняются какой именно части?"
10039020-34 = "Давайте просто... Я всё расскажу по дороге."
10039020-35 = "Вообще-то нам лучше бежать. Справитесь?"
10039020-36 = "К-Конечно! Я ведь не могу принимать вашу помощь и ничем не отплатить, правда?"
10039020-37 = "Позвольте сделать всё, что смогу!"
10039020-38 = "Ох, какой замечательный ответ. Спасибо!"
10039020-39 = "Не хочу предполагать, Сенсей, но вы тоже не против помочь?"
10039020-40 = "[s5] «Ох...ну... Конечно.»\n[s6] Неуверенно кивнуть."
10039020-43 = "Да! Отлично! ☆ Одна проблема решена! А теперь вы оба, за мной!"
10039020-44 = "Идём! ☆"
10039020-52 = "Похоже, тебе приходится нелегко, Широко. Ты в порядке?"
10039020-53 = "Я в порядке. Но не представляла, что будет настолько тяжело."
10039020-54 = "Честно говоря, я давно не встречала такого сопротивления. Это труднее, чем сражаться с ЧВК «Кайзер»."
10039020-55 = "Хошино держится?"
10039020-56 = "...Посмотри туда."
10039020-58 = "Хех, хеххх... Хех, хеххх... Простите, все... Мне конец..."
10039020-59 = ""
10039020-61 = ""
10039020-64 = "Даже Хошино выбыла. Дела плохи."
10039020-65 = "[ns7] «Х-Хошино выбыла?!»\n[ns8] «Ч-Что здесь вообще происходит?!»"
10039020-68 = "Э-Это боевая ситуация...? Вы прямо сейчас сражаетесь?!"
10039020-69 = "...Кто это, Нономи?"
10039020-70 = "Она из Тринити?"
10039020-72 = "Да. Это Мари из Сестринства. Она пришла нам помочь."
10039020-73 = "Так, чтобы ввести вас в курс дела..."
10039020-74 = "Ни за что! Я отказываюсь! Никогда!"
10039020-75 = ""
10039020-77 = ""
10039020-78 = "[ns9] «Это звучит как...»\n[ns10] «Сэрика...?»"
10039020-82 = "О, Сенсей, вы тоже здесь, хех..."
10039020-83 = "Уф. Простите, что вам пришлось это увидеть."
10039020-84 = "Наши очаровательные младшие такие боевые. Я всего лишь попыталась уговорить их, а они совсем вышли из-под контроля."
10039020-85 = ""
10039020-87 = ""
10039020-88 = "...А? Уговорить на что? Ну..."
10039020-89 = "Стать поп-идолами!"
10039020-91 = ""
10039020-93 = ""
10039020-94 = "Погодите, что?"
10039020-95 = "...«Стать поп-идолами»...?"
10039020-96 = "П-Простите, я не очень понимаю, как это связано с... этим..."
10039020-97 = "Ну, вы же знаете, что в Тринити проходит академический фестиваль, да? Там будет мероприятие поп-идолов."
10039020-98 = "Вот Нономи и захотела собрать группу и зарегистрироваться."
10039020-99 = "...К тому же есть... одно обещание."
10039020-100 = "Единственная категория, куда ещё можно записаться, — дуэты. Поэтому, раз двое из нас дали такое обещание..."
10039020-101 = "...Мы записываем их как дуэт первогодок. Именно на это они согласились."
10039020-102 = ""
10039020-104 = ""
10039020-105 = "[ns11] «А! Теперь всё совершенно понятно.»\n[ns12] «Точно. Они ведь и правда договорились о чём-то таком.»"
10039020-108 = "Эх, молодёжь нынче. Носятся туда-сюда, обещают что попало. А вот в мои времена обещания ДЕРЖАЛИ."
10039020-109 = "Верно, Серика? Аяне?"
10039020-111 = "Ну... то есть, мы правда обещали, но..."
10039020-112 = "Я не думала, что нам придётся наряжаться вот... вот так!"
10039020-113 = "Точно! На ЭТО мы не соглашались. Это вообще несправедливо!"
10039020-114 = ""
10039020-115 = "[ns] «(Наряжаться... во что именно?)»"
10039020-117 = "В этом проблема? Но костюмы, которые мы подготовили, — настоящие костюмы идолов, разве нет?"
10039020-118 = "Даже если поменять костюмы, вы всё равно будете одеты так, чтобы выделяться. В этом смысл идолов!"
10039020-119 = "Н-Но всё равно...!"
10039020-120 = "Понимаю. Может, вам просто нужно немного времени—"
10039020-121 = "У нас нет времени. Есть дедлайн. Если мы не сделаем все фотографии и не отправим заявку, всё кончено."
10039020-122 = "Слышала, Аяне?! Нам надо продержаться совсем немного! Всего несколько дней!"
10039020-123 = "Точно! Мы никогда не сдадимся."
10039020-124 = "...Ого, не думала, что она пригонит вертолёт."
10039020-125 = "Похоже, ей ОЧЕНЬ неловко. Хех..."
10039020-126 = "Ну, в отличие от них, нам здесь придётся сдерживаться..."
10039020-127 = ""
10039020-129 = ""
10039020-130 = "Но с указаниями Сенсея и помощью этой Сестры мы сможем всё закончить мирно и по-доброму, правда?"
10039020-132 = "А? Что?"
10039020-133 = "А, точно. Ты, эм... Ладно, я просто, эм..."
10039020-134 = "Послушайте, вы двое! Я понимаю, что вы хотите из этого выбраться."
10039020-135 = "Но вы ведь дали обещание. ...Правда?"
10039020-136 = "Важно держать обещания. Так люди учатся доверять друг другу."
10039020-137 = ""
10039020-139 = ""
10039020-140 = "[ns13] «Верно. Обещание есть обещание.»\n[ns14] «Мы все должны выполнять взятые обязательства.»"
10039020-143 = "..."
10039020-144 = "«Выполнять обязательства...»"
10039020-145 = "Ладно. Хорошо! Я в деле!"
10039020-147 = "Отлично! Спасибо, Сенсей!"
10039020-148 = "Хорошо!"
10039020-149 = ""
10039020-152 = ""
10039020-154 = ""
10039020-155 = ""
10039020-156 = ""
10039020-157 = "Идём! ☆"
