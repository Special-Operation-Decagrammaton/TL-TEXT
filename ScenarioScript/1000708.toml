[translation]
1000708-1 = "Запомни это навсегда"
1000708-2 = "Центр Кивотоса"
1000708-3 = ""
1000708-4 = "Эй, юная леди! Ты, с красными волосами!"
1000708-5 = "Хм? Я?"
1000708-6 = "Да, ты ведь та, кто разрисовал ту стену, верно?"
1000708-7 = "О, ну..."
1000708-8 = "Я владелец этого здания."
1000708-9 = "Мне очень жаль!"
1000708-10 = ""
1000708-11 = "Я не хотела создавать проблемы. Просто переулок был таким грязным—"
1000708-12 = "Пожалуйста, только не вызывайте полицию!"
1000708-13 = "Я и не собирался."
1000708-14 = "Мне уже надоело, что туда постоянно сваливают мусор и уродуют стену безобразными каракулями."
1000708-15 = "Но с тех пор, как ты расписала её своим рисунком, мусора и новых каракулей стало меньше. Даже не знаю, как тебя благодарить."
1000708-16 = "О-Ой. Я сделала это только потому, что н-накрыло вдохновение. Х-Хаха...!"
1000708-17 = "Не хочешь расписать и другую сторону?"
1000708-18 = "Но если не хочешь, не обязательно..."
1000708-19 = "Конечно хочу! С удовольствием!"
1000708-21 = "Хаха! Не могу поверить, что мне официально разрешили делать с этой стеной всё, что захочу."
1000708-22 = "Художникам граффити почти никогда не дают возможность рисовать что угодно и сколько угодно. Это так волнительно!"
1000708-23 = "[s] «Не могу дождаться, чтобы увидеть, что ты нарисуешь.»"
1000708-24 = "Это ещё что, Сенсей? Ты же обещал стать моим учеником, помнишь?"
1000708-25 = "Очевидно, ты будешь рисовать вместе со мной. Вот, держи мой баллончик, Сенсей."
1000708-26 = "[s] «Что бы мне нарисовать...?»"
1000708-27 = "Не думай слишком много. Пусть сердце само ведёт линии, а потом заполни их цветом."
1000708-28 = ""
1000708-29 = "Любую ошибку всегда можно закрасить... Так что не переживай. Просто бери баллончик и начинай."
1000708-32 = "― Ну что, достаточно хорошо?[wa:2380]"
1000708-34 = "― Как тебе, Сенсей?"
1000708-37 = "― Хмф... Мог бы хотя бы сделать вид, что впечатлён.[wa:940]"
1000708-40 = "― Мне нужен отзыв как от профессионального арт-критика!"
1000708-42 = "― ..."
1000708-45 = "― А ты что нарисовал, Сенсей?"
1000708-47 = "― Э-э...[wa:540]"
1000708-50 = "― Хахаха! Это вообще что такое? Выглядит так смешно![wa:20]"
1000708-53 = "― Боюсь ли я высоты? Не когда ты рядом.[wa:4380]"
1000708-56 = "― И я тоже буду рядом, когда понадоблюсь тебе.[wa:10]"
1000708-58 = "― Стену, Сенсей. Для тебя я нарисую что угодно![wa:10]"
1000708-61 = "Надеюсь, эта стена простоит здесь вечно, чтобы я всегда могла помнить этот момент с тобой."
1000708-62 = ""
1000708-63 = "Я, э-э... Сделай вид, что ты этого не слышал!"
