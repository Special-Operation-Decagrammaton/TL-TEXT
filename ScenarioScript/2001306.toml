[translation]
2001306-1 = "Чёрное и белое"
2001306-2 = "Я сопровождал Чихиро в стартап-компанию в деловом районе, чтобы помочь ей с консультацией по безопасности."
2001306-3 = "Добрый вечер. Я Кагами Чихиро из «Веритас»."
2001306-4 = "Насколько я понимаю, вам требуется обслуживание сервера."
2001306-5 = "Вы опоздали! Вы вообще знаете, который час?!"
2001306-6 = "Прошу прощения? Обслуживание было назначено на 22:00."
2001306-7 = "Мне плевать, что там написано в расписании! Я занятой человек!#nПочему я должен иметь дело с вами в такое время?!"
2001306-8 = "Вы должны были прийти раньше ради МОЕГО удобства!"
2001306-9 = "Прошу прощения... В следующий раз постараюсь помнить об этом, чтобы не доставлять неудобств."
2001306-10 = "Хмф. Вот поэтому я и не хочу вести дела с группой хакеров."
2001306-11 = "О ваших способностях судить не могу, но вижу, что деловой этикет у вас хромает."
2001306-12 = "Всё, что вам нужно знать, находится в документах на моём столе."
2001306-13 = "Только не облажайтесь. Наш серверный зал оборудован современной системой мониторинга, которая отправляет журналы в реальном времени."
2001306-14 = "Мы сразу получим предупреждение при обнаружении чего-либо необычного, так что даже не думайте вмешиваться в работу сервера."
2001306-15 = "Мне бы и в голову не пришло. Я приступаю к работе."
2001306-16 = ""
2001306-18 = ""
2001306-19 = "[ns] «Ты в порядке?»"
2001306-20 = "Я в порядке. Некоторые клиенты бывают такими."
2001306-21 = "Название «Веритас» у некоторых людей вызывает определённую реакцию."
2001306-22 = "Мы мало что можем сделать, чтобы люди не спешили с выводами из-за нашей репутации."
2001306-23 = "В любом случае забудем об этом и приступим к работе. Ночь коротка."
2001306-25 = ""
2001306-26 = "С их настройками всё в порядке."
2001306-27 = "Мне нужно лишь скопировать резервные данные."
2001306-28 = "Хм? Что это за данные?"
2001306-29 = "[s] «Что-то случилось?»"
2001306-30 = "Не обязательно что-то плохое. Просто в базе данных я обнаружила много неожиданной информации."
2001306-31 = "Похоже на личные данные пользователей, установивших приложение компании. Как они их собирали?"
2001306-32 = "И это ещё не всё. Здесь есть подозрительные записи о транзакциях, которых нет в бухгалтерском журнале."
2001306-33 = "Я изучу это немного внимательнее."
2001306-34 = ""
2001306-36 = ""
2001306-37 = "Теперь понятно. Их приложение устанавливает бэкдор для сбора информации."
2001306-38 = "Собранные данные они продавали страховой компании.#nРаспространённая схема."
2001306-39 = "[s1] «Это законно?»\n[s2] «Нам стоит сообщить о них?»"
2001306-40 = "Это незаконно, но сообщить о таком не так просто."
2001306-41 = "Это незаконно, но сообщить о таком не так просто."
2001306-42 = "Я тоже нарушаю закон, потому что обнаружила эти данные без разрешения клиента. Поэтому их нельзя представить полиции в качестве доказательства."
2001306-43 = "А если выяснится, что «Веритас» намеренно разгласил защищённые данные клиента, мы потеряем много доверия и заказчиков..."
2001306-44 = "...даже если у нас была веская причина."
2001306-45 = "[s] «Это кажется несправедливым.»"
2001306-46 = "Да, знаю."
2001306-47 = "Мы оказались в непростой ситуации."
2001306-48 = "..."
2001306-51 = "На следующее утро."
2001306-52 = "Срочные новости. Известного разработчика приложений подозревают в сборе персональных данных пользователей без их согласия."
2001306-53 = "Это выяснилось после того, как неизвестный хакер опубликовал исходный код приложения в интернете, что впоследствии обрушило стоимость акций компании.#nКомпании грозит банкротство."
2001306-54 = "Президент компании А отверг обвинения, однако это не остановило общественное мнение от того, чтобы настроиться против разработчика."
2001306-55 = ""
2001306-58 = "[ns] «...»"
2001306-59 = "..."
2001306-60 = "[s3] «Чихиро?»\n[s4] «Это ты сделала?»"
2001306-63 = "Н-Нет. Почему вы так решили? Даже проверить сервер было непросто из-за той «современной» системы мониторинга, которой так хвастался их президент."
2001306-64 = "Возможно, за этим стоял какой-нибудь другой умелый хакер из Кивотоса."
2001306-65 = "Кто-то, кроме меня..."
2001306-66 = ""
2001306-68 = ""
2001306-69 = "[ns] «...»"
2001306-70 = "Ладно, хорошо. Это была я."
2001306-71 = "Я не могла закрыть глаза на то, что они делали, но и не хотела подрывать доверие к «Веритас». Просто оставить всё как есть я тоже не могла, поэтому... позже взяла дело в свои руки."
2001306-72 = "Я изо всех сил стараюсь учить остальных этике хакинга, поэтому если они узнают, что я позволила личным чувствам взять верх и взломала одного из наших клиентов..."
2001306-73 = "...мне будет слишком стыдно смотреть им в глаза."
2001306-74 = "Вы разочарованы во мне, Сенсей?"
2001306-75 = "[s] «Ты ведь больше так не сделаешь, правда?»"
2001306-76 = ""
2001306-79 = "[ns] «Ты всё-таки вице-президент „Веритас“.»"
2001306-80 = ""
2001306-81 = "Взрослые бывают такими строгими."
2001306-82 = "Вы правы. «Веритас» — часть того, кто я есть."
2001306-83 = "То, что я сделала, отражается на нашем клубе, даже если я пытаюсь отделить от него свои поступки. Придётся хорошо постараться, чтобы загладить это перед младшими."
2001306-84 = ""
2001306-85 = ""
2001306-87 = "И всё же я была бы благодарна, если бы это осталось нашим маленьким секретом."
