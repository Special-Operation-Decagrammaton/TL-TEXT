[translation]
84303300600-7 = "Что это такое?! Меня переполняет невыносимая ярость...!!"
84303300600-8 = "Я уничтожу всё и всех!!"
84303300600-9 = ""
84303300600-14 = "Аааа! Давай сюда!! Дерись со мной прямо сейчас!!"
84303300600-15 = ""
84303300600-18 = "И-Ииик...!"
84303300600-19 = "Как такое произошло...! На тестах такого вообще не было!"
84303300600-22 = "Ч-Что...?"
84303300600-23 = "(Даже если они злятся, это явно ненормально.)"
84303300600-24 = "(Что-то в игре заставило их потерять рассудок.)"
84303300600-25 = "(Я не знаю подробностей, но это точно то, о чём говорила Рио...)"
84303300600-26 = ""
