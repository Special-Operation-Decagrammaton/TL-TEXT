[translation]
1002202-1 = "Прогулка по пляжу со старостой"
1002202-2 = ""
1002202-3 = ""
1002202-4 = ""
1002202-5 = "Сенсей."
1002202-6 = "[s1] «Эй, Хина, ты такая милая!»\n[s2] «Какой милый купальник!»"
1002202-7 = "Говори тише."
1002202-8 = "Говори тише."
1002202-9 = "Если кто-нибудь услышит тебя и узнает меня... всё пропало."
1002202-10 = "[s] «Точно...»"
1002202-11 = "Я позвала тебя сюда потому, что здесь меня почти никто не знает."
1002202-12 = "Здесь не так много студентов Геенны, да и студенты Тринити сюда почти не приходят."
1002202-13 = "[s] «А что делать в месте, где мораль никого не волнует?»"
1002202-14 = "..."
1002202-15 = "Это..."
1002202-16 = "Ну..."
1002202-17 = "[s] «Ты здесь репетируешь перед тренировочным лагерем! Понял!»"
1002202-18 = "..."
1002202-19 = "Ты просто..."
1002202-20 = "Хватит надо мной издеваться."
1002202-21 = "[s] «Я не издеваюсь. Я хочу поиграть с тобой!»"
1002202-22 = "Это в любом случае плохая идея! Мы здесь не для игр!"
1002202-23 = "Если я не пойму, как выглядит пляж летом, я могу не суметь должным образом реагировать на проблемы во время тренировочного лагеря."
1002202-25 = "Мне следует изучать любые места, с которыми я незнакома. В этом смысле это просто подготовка, как ты и сказал."
1002202-26 = "[s] «Хорошо, понял.»"
1002202-27 = "*вздыхает*"
1002202-28 = "Самое важное здесь — не раскрыть мою личность."
1002202-29 = "Через несколько часов нам придётся возвращаться, но, думаю, времени достаточно, чтобы разобраться, что представляет собой пляж."
1002202-30 = "Первое, что я хочу сделать..."
1002202-31 = ""
1002202-34 = ""
1002202-35 = ""
1002202-36 = ""
1002202-37 = "...!"
1002202-38 = "О, подожди, Сенсей. Мне только что пришло сообщение из школы."
1002202-39 = "Прости. Подожди всего минутку."
1002202-40 = "[s] «Как всегда занята. Не переживай за меня.»"
1002202-41 = "Я вернусь раньше, чем ты успеешь заметить."
1002202-42 = ""
1002202-43 = ""
1002202-44 = "Хина отошла проверить телефон."
1002202-46 = "Время шло, а Хина всё не возвращалась."
1002202-47 = "Я попытался связаться с ней, чтобы убедиться, что ничего не случилось."
1002202-49 = "И тут мне пришло сообщение от Хины в MomoTalk."
1002202-50 = "Сенсей, помоги мне..."
1002202-51 = "[s] «...?!»"
1002202-54 = ""
1002202-55 = "*вздох* Спасибо, Сенсей."
1002202-56 = "Меня поймали какие-то подозрительно добрые люди, а потом..."
1002202-57 = "[s] «Тебя отвели в пункт для потерявшихся детей?»"
1002202-58 = "..."
1002202-59 = "Я пыталась объяснить им, что уже не учусь в начальной школе..."
1002202-60 = "Эти люди... Я понимаю, что они хотели как лучше..."
1002202-61 = "...но сколько бы я ни объясняла, что я не потерявшийся ребёнок, они всё повторяли: «Всё будет хорошо, не бойся.»"
1002202-62 = "Они просто не слушали. Почему?"
1002202-63 = "[s] «Ну, очевидно, потому что...»"
1002202-64 = "Потому что что?"
1002202-65 = "[s] «Ничего. Причина могла быть какой угодно.»"
1002202-66 = "*вздох* Какая морока."
1002202-67 = "[s] «Почему ты вообще согласилась пойти с ними?»"
1002202-68 = "Потому что я не могла позволить раскрыть мою настоящую личность."
1002202-69 = "Это сделало бы меня лёгкой мишенью для врагов."
1002202-70 = "Кроме того, если станет известно, что Сенсей из Шале и староста Геенны вместе ходили на пляж..."
1002202-71 = "Это точно попадёт в заголовки и, наверное, будет круглосуточно транслироваться с дирижабля."
1002202-72 = "[s] «По-моему, это уже слишком далеко зашло...»"
1002202-73 = "..."
1002202-74 = "В любом случае, урок я точно усвоила."
1002202-75 = "Если я останусь одна, это снова случится, так что не отходи от меня, Сенсей."
1002202-76 = "[s] «Твоё желание — закон.»"
1002202-77 = "Фух. Значит, у нас осталось около 30 минут."
1002202-78 = "Надеюсь, ты ещё немного побудешь со мной."
1002202-80 = "Оставшееся время я гулял с Хиной по пляжу."
