[translation]
52270-1 = "Эпизод 27;Наконец ухватившись за подол"
52270-3 = ""
52270-4 = ""
52270-7 = ""
52270-9 = ""
52270-11 = "Ты всё-таки пришла, Нагуса."
52270-12 = "Аямэ, я..."
52270-13 = "Не нужно ничего объяснять."
52270-14 = "Я всё видела и слышала через свой Хитоцумэ."
52270-15 = "И всё, что я слышала, было ложью. Все эти разговоры о «понимании»..."
52270-16 = "Говори какие угодно красивые слова — я никогда тебя не пойму."
52270-17 = "И не хочу. Ни тебя, ни кого-либо ещё."
52270-18 = "Аямэ. Я прошла весь этот путь не ради жалкой попытки понять тебя."
52270-19 = ""
52270-21 = ""
52270-22 = "Тогда зачем?"
52270-23 = "Я пришла забрать у тебя последнее бремя, которое ты несёшь."
52270-24 = ""
52270-26 = ""
52270-27 = "...Президент Совета урегулирования Хяккарёран, Нанакадо Аямэ."
52270-28 = "За уклонение от обязанностей Хяккарёран и создание угрозы для студентов, которых ты должна была защищать, ты лишаешься права на Полномочие президента."
52270-29 = ""
52270-31 = ""
52270-32 = ""
52270-33 = "Я вызываю тебя на поединок за право наследования."
52270-34 = ""
52270-36 = ""
52270-37 = ""
52270-38 = ""
52270-39 = ""
52270-40 = "Для известной плаксы ты, смотрю, отрастила характер."
52270-41 = "Эй-эй, погодите. Ты собираешься сражаться с ней совсем одна?"
52270-42 = "Я-я тоже должна возразить! Против такого грозного противника, как Аямэ, нам следует атаковать всем вместе...!"
52270-44 = "Будет нас одна или четверо — результат не изменится."
52270-45 = "Рэнгэ и Юкари, пожалуйста, защищайте Сенсея."
52270-46 = "Тогда... для проведения поединка за право наследования Хяккарёран есть определённые условия, верно?"
52270-47 = "Требуется один свидетель не из Хяккарёран, чтобы подтвердить беспристрастность поединка..."
52270-48 = "И один офицер Хяккарёран, чтобы засвидетельствовать соблюдение традиции."
52270-49 = ""
52270-51 = ""
52270-52 = "Кикё, Сенсей. Пожалуйста, будьте нашими свидетелями."
52270-53 = ""
52270-55 = ""
52270-56 = "...Понятно."
52270-57 = ""
52270-58 = "[ns] «Конечно. Я останусь до самого конца.»"
52270-59 = ""
52270-61 = ""
52270-62 = ""
52270-63 = "Всё так же цепляешься за бессмысленные формальности..."
52270-64 = "Ладно, понимаю. В порядке и традициях есть свой смысл."
52270-65 = ""
52270-67 = ""
52270-68 = ""
52270-69 = "Я, президент Совета урегулирования Хяккарёран, Нанакадо Аямэ..."
52270-70 = "...принимаю вызов Горё Нагусы на поединок за право наследования."
52270-74 = ""
52270-75 = ""
52270-76 = ""
52270-78 = ""
52270-79 = ""
52270-80 = ""
52270-81 = ""
52270-82 = "Уф!"
52270-83 = "..."
52270-84 = "Это безумие! Она сражается с президентом Аямэ на равных?"
52270-85 = "Бой всё ещё очень близкий, но если она сохранит такой напор... то может победить!"
52270-86 = ""
52270-88 = ""
52270-90 = ""
52270-91 = ""
52270-92 = ""
52270-94 = ""
52270-95 = "(Почему...? Почему я не могу её подавить?)"
52270-96 = "(Из всех людей... именно она? Я... проигрываю такой, как Нагуса?)"
52270-98 = "...Почему ты так отчаянно стараешься?"
52270-99 = ""
52270-101 = ""
52270-102 = "Отчаянно...?"
52270-103 = "Это ты сражаешься изо всех сил. Не строй теперь из себя такую важную."
52270-104 = "Нет... Каждое твоё движение, дыхание, выражение лица... Я чувствую всё."
52270-105 = "Ты потеряла былую остроту. Твоё отчаянное желание не проиграть буквально кричит мне об этом."
52270-106 = "Если бы ты и правда считала, что у меня нет намерения победить, ты бы вообще не стала бросать мне вызов."
52270-107 = "Мой настоящий вопрос... почему ты так цепляешься за кресло президента?"
52270-108 = "Если тебе так отчаянно хочется его сохранить, оставь всё это позади и возвращайся."
52270-109 = "Оставить... позади?"
52270-110 = "Ты хочешь, чтобы я отказалась от своего положения? От желаний и решимости? И что тогда у меня останется?"
52270-111 = ""
52270-113 = ""
52270-114 = "Если никто не способен меня понять, если никто меня не принимает... тогда ради чего я вообще живу?!"
52270-115 = ""
52270-117 = ""
52270-118 = ""
52270-119 = "...Но зачем тебе вообще нужна причина?"
52270-120 = "Разве нельзя просто... жить?"
52270-122 = "Пусть причиной будет чистое небо и тёплое солнце или аппетитные запахи, доносящиеся от лавок ночного рынка...?"
52270-123 = "Разве этого недостаточно, чтобы встретить новый завтрашний день? Жизнь не требует отчаянно искать для неё «причину»."
52270-125 = ""
52270-127 = "Для меня уже того, что ты была рядом, было достаточно."
52270-128 = "Я..."
52270-129 = ""
52270-131 = ""
52270-132 = "...Ты выросла с тех пор, как я видела тебя в последний раз, Нагуса. Подумать только, именно ты умудрилась задеть меня своими красивыми речами."
52270-134 = ""
52270-140 = ""
52270-141 = "Что ж, на меня это не подействует."
52270-142 = ""
52270-144 = ""
52270-145 = ""
52270-146 = ""
52270-147 = "Я докажу свою ценность и причину жить — здесь и сейчас."
52270-148 = ""
52270-161 = "Хааа... Теперь всё кончено."
52270-162 = ""
52270-165 = "Поздравляю, Нагуса. Теперь ты президент."
52270-166 = "После сотен неудачных вызовов ты наконец победила меня."
52270-167 = "Ты заслужила право гордиться собой. Подними голову и улыбнись."
52270-168 = ""
52270-173 = "Тогда скажи мне, почему..."
52270-174 = "...ты всё ещё так горько плачешь?"
52270-176 = "...Прости, Аямэ."
52270-179 = "Мне правда очень жаль, Аямэ."
52270-180 = "Всё это потому, что я не смогла смотреть тебе в глаза. Я снова и снова затыкала уши, не желая слышать твои крики."
52270-181 = ""
52270-184 = "Прости, что не схватила тебя за руку, когда ты нуждалась во мне."
52270-185 = "Прости, что не заметила твоих страданий, пока ты заботилась о моих."
52270-186 = "Я болезненно осознаю всё, чего мне ещё не хватает, и насколько я некомпетентна по сравнению с тобой... но клянусь, я больше никогда не отпущу твою руку."
52270-187 = "Как бы низко ты ни пала, я упаду вместе с тобой. Всегда."
52270-188 = ""
52270-191 = "Мне правда, совершенно, безнадёжно жаль, Аямэ..."
52270-196 = "...Я и правда..."
52270-197 = "...всегда ненавидела это твоё плачущее лицо."
52270-201 = "Следующий эпизод;Вместе ждать цветения"
