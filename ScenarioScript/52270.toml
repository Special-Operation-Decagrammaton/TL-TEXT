[translation]
52270-1 = "Episódio 27;Os Dedos que Segurei"
52270-11 = "No fim das contas você veio mesmo, Nagusa."
52270-12 = "Ayame, eu..."
52270-13 = "Não precisa se dar ao trabalho de explicar."
52270-14 = "Eu vi tudo através do Hitotsume."
52270-15 = "Compreensão, incompreensão... francamente, que tolice."
52270-16 = "Não importa o que você diga, não acho que eu vá te entender."
52270-17 = "Seja lá quem for... eu simplesmente não quero entender ninguém."
52270-18 = "Ayame, eu não vim aqui para que você me entenda."
52270-22 = "Então, veio para quê?"
52270-23 = "Eu vim para que você me entregue tudo o que está carregando nas costas."
52270-27 = "...Presidente do Comitê de Mediação de Conflitos Hyakkaryouran. Nanakado Ayame."
52270-28 = "Seus atos de trair o dever do Hyakkaryouran e expor Hyakkiyako ao perigo foram julgados indignos do posto de Presidente."
52270-33 = "— Eu desafio você para o Torneio de Sucessão."
52270-40 = "Olha só como fala agora, aquela chorona."
52270-41 = "Vai dar conta sozinha mesmo?!"
52270-42 = "É-É verdade! Se a oponente é a Ayame-senpai, deveríamos ir todas juntas...!"
52270-44 = "Mesmo que todas nós enfrentemos ela juntas, acho que o resultado não vai mudar."
52270-45 = "Renge, Yukari, cuidem do Sensei, por favor."
52270-46 = "Além disso... o Torneio de Sucessão do Hyakkaryouran tem suas condições, não tem?"
52270-47 = "Para garantir que o julgamento do Torneio de Sucessão seja justo, é necessária uma testemunha de fora do Hyakkaryouran..."
52270-48 = "E uma integrante da diretoria do Hyakkaryouran."
52270-52 = "Kikyou, Sensei. Por favor, sejam as testemunhas do Torneio de Sucessão."
52270-56 = "...Entendido."
52270-58 = "[ns] \"Com prazer.\""
52270-63 = "Sempre tão preocupada com as regras, não mudou nada."
52270-64 = "Mas... tudo bem, é importante encerrar as coisas direito."
52270-69 = "Presidente do Comitê de Mediação de Conflitos Hyakkaryouran, Nanakado Ayame."
52270-70 = "Aceito o desafio da desafiante, Goryou Nagusa, para o Torneio de Sucessão."
52270-82 = "...Guh!"
52270-83 = "......"
52270-84 = "Incrível... A Nagusa-senpai tá lutando de igual pra igual com a Presidente Ayame."
52270-85 = "Ainda não podemos baixar a guarda, mas... se continuar assim, quem sabe...!"
52270-95 = "(Por quê... antes eu conseguia derrubá-la num instante)"
52270-96 = "(Logo a Nagusa... perder para alguém como a Nagusa...!)"
52270-98 = "...Por que você está tão desesperada assim?"
52270-102 = "Desesperada...?"
52270-103 = "Quem está desesperada é você, para de bancar a forte."
52270-104 = "Não. Seus movimentos, sua respiração, sua expressão..."
52270-105 = "Tudo em você está dizendo \"não posso perder\". Você não é a Ayame de antes."
52270-106 = "Hah... Se eu pretendesse pegar leve, nem teria aceitado o Torneio de Sucessão desde o começo."
52270-107 = "Você ainda tem apego ao posto de Presidente?"
52270-108 = "Então era só ter desistido de tudo e voltado."
52270-109 = "Desistir?"
52270-110 = "Se eu abrir mão da minha posição, dos meus desejos, da minha seriedade... o que vai restar de mim...?"
52270-114 = "Se ninguém me compreender, se ninguém me reconhecer, para que é que eu vou viver?!"
52270-119 = "...Você não precisa de um motivo."
52270-120 = "...Só de você estar ali, já basta."
52270-122 = "O calor gostoso do sol, a beleza de um céu azul límpido... o cheiro delicioso vindo do mercado..."
52270-123 = "Cada pequena coisa dessas faz a gente pensar \"hoje foi divertido. Amanhã com certeza também vai ser...\".#nVocê não precisa ficar procurando um motivo."
52270-127 = "Para mim... só de ter você aqui, Ayame, já estava bom."
52270-128 = "Eu..."
52270-132 = "...Você cresceu mesmo, Nagusa. Até tentando me abalar com palavras."
52270-141 = "Mas esse tipo de truque não funciona comigo."
52270-147 = "O meu valor e a minha razão de viver, eu vou provar bem aqui—"
52270-161 = "Ah... então é aqui que acaba."
52270-165 = "Parabéns... Nagusa, agora a Presidente é você."
52270-166 = "Você, que me desafiou centenas de vezes e nunca venceu uma única vez... finalmente me derrotou."
52270-167 = "Estufe o peito. Esse não era o seu objetivo?"
52270-173 = "...Ei."
52270-174 = "...Por que você está chorando com essa cara?"
52270-176 = "Desculpa..."
52270-179 = "Me desculpa mesmo... Ayame."
52270-180 = "Por nunca ter olhado direito para você... Você estava gritando de dor bem ao meu lado o tempo todo, e eu não ouvi..."
52270-184 = "Eu não percebi que você também estava estendendo a mão, pedindo ajuda...!"
52270-185 = "Você estava sofrendo o tempo todo, e eu só sabia me apoiar em você... Me desculpa."
52270-186 = "Comparada a você, eu não tenho nada, mas... essa mão aqui, eu prometo... nunca mais vou soltar."
52270-187 = "Porque eu vou carregar a sua dor junto com você..."
52270-191 = "Me desculpa mesmo, de verdade... Ayame..."
52270-196 = "No fim das contas, eu—"
52270-197 = "Eu sempre odiei... essa sua cara de choro."
52270-201 = "Próximo;Aguardando Juntos pelo Desabrochar"
