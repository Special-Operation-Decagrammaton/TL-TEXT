[translation]
2002505-1 = "Холодный ветер, тёплое солнце"
2002505-2 = "Дни становились холоднее. Ледяной ветер покалывал кожу."
2002505-3 = "Я беспокоился о Харуке и её растениях, поэтому решил навестить её и проверить, всё ли в порядке."
2002505-5 = "Внутри здания стало легче. Там было тепло и уютно, но..."
2002505-6 = ""
2002505-9 = "Снаружи всё ещё завывал холодный ветер."
2002505-10 = ""
2002505-13 = "[ns1] Издать звук, чтобы не напугать её.\n[ns2] «Харука? Это я!»"
2002505-14 = "И-и-и... С-Сенсей?!"
2002505-15 = "И-и-и... С-Сенсей?!"
2002505-16 = "С-сейчас! Я уже иду!"
2002505-17 = ""
2002505-23 = ""
2002505-24 = "С-Сенсей? Здесь так холодно! Почему вы пришли?"
2002505-25 = "О! Нет-нет-нет. Я не хотела сказать, что вам нельзя приходить сюда когда угодно! Я не это имела в виду! Просто... эм..."
2002505-26 = "[s3] «Я пришёл, потому что переживал за тебя и твои растения.»\n[s4] «Хотел проверить. С растениями всё в порядке?»"
2002505-27 = "...Что?"
2002505-28 = "...Что?"
2002505-29 = "М-мы в порядке! Вам не нужно беспокоиться о таких, как мы!"
2002505-30 = "К-конечно, всё хорошо. Никаких проблем. Я бы даже сказала... такая погода нам подходит."
2002505-31 = ""
2002505-33 = ""
2002505-34 = "Эм... Это правда. Ветер холодный, как вы и сказали. Но..."
2002505-35 = "Эти растения довольно живучие... Им это особо не мешает."
2002505-36 = "Пока есть солнечный свет и вода, они переживут почти что угодно."
2002505-37 = "Потому что... это сорняки. Угу."
2002505-38 = "[s5] «Хотя им это и не нужно, ты всё равно заботишься о них.»\n[s6] «Это очень добрый поступок, Харука.»"
2002505-39 = "Н-нет! Всё не так!"
2002505-40 = "Н-нет! Всё не так!"
2002505-41 = "Я-я имею в виду... я не спорю с вами! Просто..."
2002505-42 = "Это правда. Они и сами прекрасно растут... К-конечно. Но..."
2002505-43 = "Мне кажется, им было бы счастливее, если бы кто-то о них заботился..."
2002505-44 = "Поэтому я стараюсь это делать и иногда немного поливаю... Вот и всё."
2002505-45 = "...Сенсей?"
2002505-46 = "...Что? Нет! Нет, вам не нужно помогать!"
2002505-47 = "Я-я уже закончила! Всё сделала! Е-если вода попадёт вам на руки... Или грязь... И мои сорняки, и я..."
2002505-48 = "...Что?"
2002505-49 = "Вы хотите пойти? Ну, хорошо. Н-но куда?"
2002505-50 = "Стойте! Н-неважно. Как я вообще могла это спросить?!"
2002505-51 = "Я-я пойду за вами! Конечно пойду! Куда угодно! Хоть в ад!"
2002505-52 = ""
2002505-55 = ""
2002505-56 = ""
2002505-57 = ""
2002505-58 = ""
2002505-60 = ""
2002505-61 = ""
2002505-62 = "...С-Сенсей? Разве это не..."
2002505-63 = "[s7] «Я подумал, что тёплый суп сейчас был бы кстати.»\n[s8] «Я хотел поделиться с тобой, Харука.»"
2002505-64 = "А-а?! Ч-что? Внезапно? Почему? Ради такой, как я?"
2002505-65 = "А-а?! Ч-что? Внезапно? Почему? Ради такой, как я?"
2002505-66 = "Даже если вы это сделаете, я... я не смогу отдать вам больше, чем уже отдаю... Я и так посвящаю вам всю свою жизнь, поэтому..."
2002505-67 = "Если вы сделаете для меня это... тогда мне придётся отдать вам ещё и следующую жизнь..."
2002505-68 = "Я-я имею в виду! Я и так собиралась это сделать. Так что это не проблема, но..."
2002505-69 = "[s9] «Всем приятно, когда о них хоть немного заботятся.»\n[s10] «Я хочу, чтобы ты была счастлива. Как твои растения.»"
2002505-70 = "А..."
2002505-71 = "А..."
2002505-72 = "А... Эм... Э-э..."
2002505-73 = "Э-это... Эм... Хе..."
2002505-74 = "Эм-м?!"
2002505-75 = "[s11] «Расслабься, Харука.»\n[s12] «Сегодня больше никаких панических приступов.»"
2002505-76 = "...!"
2002505-77 = "...!"
2002505-78 = "Д-Да."
2002505-79 = "Хорошо! Я перестала!"
2002505-80 = "Т-Тогда..."
2002505-81 = ""
2002505-83 = ""
2002505-84 = "Я просто..."
2002505-85 = "Спасибо за еду!"
2002505-87 = "Я убедился, что Харука вдоволь поела горячей уличной еды, а затем вернулся в Шале."
