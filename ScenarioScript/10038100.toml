[translation]
10038100-1 = "Эпизод 10;Уравновешивая небеса"
10038100-3 = ""
10038100-5 = ""
10038100-7 = ""
10038100-9 = "Уже почти стемнело, Кисаки. Что так долго?"
10038100-10 = "Ты хоть представляешь, сколько времени уходит на то, чтобы разгребать последствия за тобой?"
10038100-11 = "Я тебя не просила. Так легко отвлекаешься. Ты всё ещё не нашла, на чём сосредоточиться."
10038100-12 = "О, нашла. Но тебе этого никогда не понять. Это как услышать голос реки."
10038100-13 = "Зачем мне слушать воображаемые звуки? Или твою бессмысленную болтовню. Опять убежишь?"
10038100-14 = "О, не только мне есть что тебе сказать."
10038100-15 = "О?"
10038100-16 = ""
10038100-20 = ""
10038100-22 = ""
10038100-23 = "...Давно не виделись, Кай."
10038100-24 = "Ах, моя дорогая младшекурсница. Хи-хи... Спасибо, что поддерживала работу Общества, пока меня не было."
10038100-25 = "Хм, ты всё ещё остаёшься для меня загадкой."
10038100-26 = "Я думала, если мы встретимся снова, то увижу тебя иначе."
10038100-27 = "Но нет, похоже, я ожидала слишком многого..."
10038100-28 = "Это всё, что ты пришла сказать?"
10038100-29 = "Кех-хех-кех... Смешно. Будто уж ты-то имеешь право читать мне нотации."
10038100-30 = "Хм?"
10038100-31 = ""
10038100-33 = ""
10038100-34 = "Я просмотрела записи твоих рецептов. Ты испытывала эликсиры на людях, совсем как я."
10038100-35 = ""
10038100-37 = ""
10038100-38 = "Нет, НЕ как ты! Мои..."
10038100-39 = "[s] «Сая делала это не ради собственной выгоды.»"
10038100-40 = ""
10038100-42 = ""
10038100-43 = "...Опять Сенсей."
10038100-44 = "Вы тоже были одной из её подопытных свинок, не так ли?"
10038100-45 = "И всё ещё пытаетесь её защищать? Любопытно."
10038100-46 = "[s] «...То есть, её зелья ДЕЙСТВИТЕЛЬНО создавали проблемы, но...»"
10038100-48 = "С-Сенсей?!"
10038100-49 = "[s] «...но она всегда лишь хотела сделать других счастливыми.»"
10038100-52 = "[ns1] «Она никогда ни с кого ничего за это не брала.»\n[ns2] «И остановилась, когда увидела, что людям больно.»"
10038100-57 = "Но именно в этом и была проблема. Разве вы не понимаете, Сенсей?"
10038100-58 = "Успех невозможен, если позволять неудачам себя останавливать."
10038100-59 = "Сколько бы ни было провалов и побочных эффектов, всё это часть процесса. Важно лишь, чтобы достижение перевесило нанесённый ущерб."
10038100-60 = ""
10038100-62 = ""
10038100-63 = "Если ты позволишь неудачам отпугнуть тебя, как она, то сама навсегда останешься неудачницей."
10038100-64 = "Ты была близка к эликсиру бессмертия. Ближе, чем кто-либо ещё."
10038100-65 = "Но твои методы сделали всех несчастными!"
10038100-66 = "Кех-хех-кех... Ох, опять началось."
10038100-67 = "Что вообще такое «счастье,» и кто его определяет? И как?"
10038100-68 = "Обычные люди даже не знают, чего им не хватает. Думаешь, они способны сказать, что делает их счастливыми? Они понятия не имеют!"
10038100-69 = "..."
10038100-70 = "Ты всё ещё не можешь ответить, да?"
10038100-71 = "Конечно не можешь. Люди невежественны и эгоистичны."
10038100-72 = "Они никогда не бывают благодарны. Дай им то, чего, как им кажется, они хотят, — и они всё равно найдут повод пожаловаться."
10038100-73 = "Но несмотря ни на что и на всё, что кто угодно скажет, я закончу это зелье."
10038100-74 = "Эликсир, который дарует мудрость просветлённым, чтобы мы могли исполнить ИСТИННЫЕ желания людей."
10038100-75 = ""
10038100-77 = ""
10038100-79 = ""
10038100-80 = "Помни, Сая. Восточное алхимическое общество было основано именно для этой цели."
10038100-81 = "Но мы..."
10038100-82 = ""
10038100-86 = "И именно поэтому мы должны довести дело до конца."
10038100-87 = ""
10038100-89 = ""
10038100-90 = "О, Кисаки. Я почти забыла, что ты здесь."
10038100-91 = "Ты помнишь студентов, чьи тела разрушила своими эликсирами? Или скажешь, что в масштабе великой цели они не имеют значения?"
10038100-92 = "Кех-хех-кех... Помню. Конечно, помню. Каждая из них дала бесценные данные. Как я могла забыть?"
10038100-93 = "Тогда ты должна знать и то, что Сая забросила даже собственные исследования, чтобы лечить этих самых студентов."
10038100-94 = "Позволь прояснить одно. Все эти студенты получили ровно то, о чём просили."
10038100-95 = "Мало кто способен ясно понимать собственные желания."
10038100-96 = "Мало кто способен предвидеть последствия своего выбора, и ещё меньше тех, кто способен их вынести."
10038100-97 = "Должны ли мы отвечать за невежество обычных людей? Я так не думаю."
10038100-98 = "В той или иной мере мы все «обычные». И все заслуживаем милосердия и великодушия."
10038100-99 = "О, говори за себя."
10038100-100 = "Если тебе хочется видеть меня именно так — пожалуйста."
10038100-101 = ""
10038100-103 = ""
10038100-105 = ""
10038100-107 = "Как одна из множества обычных людей, я ещё раз напомню: как и прежде, тебе нет места в Саньхайцзине."
10038100-108 = ""
10038100-110 = ""
10038100-112 = "А теперь ты просто оскорбляешь саму себя. Какое разочарование, Кисаки."
10038100-113 = "Я надеялась, что со временем ты станешь мне ровней."
10038100-114 = "Фуфу... Удивительно приятно слышать это от человека, чьё сердце полно мести."
10038100-115 = "...О, отомстить я могу когда угодно."
10038100-116 = "И не забывай: это ты сделала меня такой."
10038100-117 = "Ты уже это говорила. А теперь слушай меня."
10038100-118 = ""
10038100-120 = ""
10038100-121 = ""
10038100-122 = "Тот, кто сделал тебя такой, какая ты есть... это ты сама."
10038100-123 = ""
10038100-126 = ""
10038100-127 = "Простите...?!"
10038100-128 = "Каждый выбор, приведший тебя сюда, сделала ты."
10038100-129 = "ТЫ решила, что выше всех этих «обычных» людей. ТЫ решила, что можешь обращаться с ними как с игрушками."
10038100-130 = "И ты можешь дальше винить меня."
10038100-131 = "Я приму эту вину. Я президент. Это моя работа."
10038100-132 = "Ты слишком много говоришь..."
10038100-133 = ""
10038100-135 = ""
10038100-136 = ""
10038100-137 = "Я только что решила, что следующим подопытным будешь ты."
10038100-138 = "Вот как? Думаешь, это в твоих силах?"
10038100-139 = "Ха. Можешь изображать сколько угодно спокойствия и уверенности."
10038100-140 = ""
10038100-142 = ""
10038100-144 = "Но я знаю, как долго мы держали Саю взаперти."
10038100-145 = "Без её лечения ты сейчас едва можешь стоять."
10038100-146 = "Фуфу... На это ты рассчитывала? Конечно рассчитывала."
10038100-147 = ""
10038100-149 = ""
10038100-151 = "Открой глаза. Посмотри, кто стоит перед тобой. Я — президент Гэнрюмона."
