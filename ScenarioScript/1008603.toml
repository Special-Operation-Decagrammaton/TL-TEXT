[translation]
1008603-1 = "Хина и платье 2"
1008603-2 = "Я пришёл в магазин первым и терпеливо ждал Хину."
1008603-3 = ""
1008603-6 = ""
1008603-7 = "Простите, Сенсей!"
1008603-8 = "У Префекторской команды возникла проблема. Я опоздаю на нашу встречу примерно на час."
1008603-9 = "Мне правда очень жаль... Вините Общество Пандемониума — они опять устроили неприятности!"
1008603-10 = "[s] «Не переживай, Хина. Дела Префекторской команды важнее отдыха.»"
1008603-11 = "Да... Спасибо, что понимаете."
1008603-12 = "Но я не хочу, чтобы вы зря тратили время, ожидая меня."
1008603-13 = "Если вы не против, почему бы вам не выбрать платье для меня?"
1008603-14 = "Что касается размера, можете использовать мои мерки из начальной школы. Сейчас отправлю их сообщением."
1008603-15 = "[s1] «Разве это не приведёт к той же проблеме, что и с платьем со склада?!»\n[s2] «Не думаю, что мне стоит знать настолько личные данные...»"
1008603-18 = "А-А? Ч-Что не так...?"
1008603-19 = "[s3] «...Ничего. Я постараюсь.»\n[s4] «Ты уверена, что хочешь, чтобы платье выбрал я?»"
1008603-22 = "Да. Если выбирать по моему вкусу, вряд ли получится что-то модное."
1008603-23 = "А вы, кажется, хорошо разбираетесь в таких вещах."
1008603-24 = "...Я хотела бы надеть то, что, по-вашему—"
1008603-25 = "[s] «Тогда ты...?»"
1008603-26 = "О-Ой, нет! Ничего...!"
1008603-27 = ""
1008603-29 = ""
1008603-31 = "Г-Глава Префекторской команды! Общество Пандемониума снова за своё!"
1008603-32 = ""
1008603-34 = ""
1008603-35 = "Я рассчитываю на вас, Сенсей!"
1008603-36 = ""
1008603-38 = ""
1008603-39 = "[ns] «Похоже, Хине трудно даже просто взять выходной. ...Ну ладно.»"
1008603-41 = "Примерно час спустя..."
1008603-43 = ""
1008603-44 = ""
1008603-45 = ""
1008603-46 = "[ns] «А, Хина, ты пришла!»"
1008603-47 = ""
1008603-48 = "[ns] «Х-Хина?»"
1008603-49 = "Эм... Простите, что опоздала, Сенсей."
1008603-50 = "Как я и говорила по телефону, возникла проблема: Общество Пандемониума пыталось захватить Клуб школьного питания..."
1008603-51 = "Что-то вроде: «Кто контролирует пудинг, тот контролирует Геенну! Ке-ке-ке!»..."
1008603-52 = "Серьёзно. Не понимаю, зачем было устраивать из этого такой шум."
1008603-53 = "И что бы они вообще делали со всем этим пудингом, если бы его получили?"
1008603-54 = "Ух. Не могу поверить, что из-за сладостей они отняли у меня время на выбор платья вместе с вами."
1008603-55 = "Простите, Сенсей. Я не хотела вас разочаровывать."
1008603-56 = "[s] «Со мной всё хорошо, правда. Не накручивай себя, ладно?»"
1008603-58 = "[ns] «Забудь об этом. Я уже выбрал платье, в котором ты станешь звездой бала Геенны. Хочешь взглянуть?»"
1008603-59 = "О... точно! Вы выбрали для меня платье."
1008603-60 = "И ещё, что значит «звезда бала Геенны»?"
1008603-61 = "Платье должно быть похоже на звезду? Оно металлическое?"
1008603-62 = "Кевлар был бы куда практичнее, Сенсей..."
1008603-63 = "[s] «Не усложняй. Просто примерь. Оно будет смотреться отлично.»"
1008603-64 = "Х-Хорошо. Поверю вам..."
1008603-65 = "Но разве не нужно сначала снять мерки?"
1008603-66 = "Простите, я опять слишком много думаю."
1008603-67 = "Хорошо, я примерю."
1008603-72 = ""
1008603-73 = ""
1008603-74 = ""
1008603-75 = ""
1008603-76 = ""
1008603-77 = "Эм... ну как, Сенсей?"
1008603-78 = "Мне... идёт?"
1008603-79 = "[s] «Да! Даже лучше, чем я представлял!»"
1008603-80 = "П-Правда?"
1008603-81 = "Н-Не выглядит странно? Как будто ребёнок играет в переодевание?"
1008603-82 = "[s5] «Нет. Ты выглядишь красиво и элегантно.»\n[s6] «Настоящая звезда бала!»"
1008603-83 = "Красивая и э-элегантная?"
1008603-84 = "Как скажешь..."
1008603-85 = "Значит, вот какой вы меня види—"
1008603-86 = "Ч-что?!"
1008603-87 = "Н-Не издевайтесь надо мной, Сенсей!"
1008603-88 = "Фух... В любом случае... У-У вас хороший вкус, Сенсей."
1008603-89 = "Платье хорошо сидит, и в нём очень легко двигаться..."
1008603-90 = "Да. Думаю, на вечеринке с ним проблем не будет."
1008603-91 = "Я переживала, что попросила слишком многого. Но теперь..."
1008603-92 = "Обратиться к вам было правильным решением. Спасибо, Сенсей."
1008603-93 = "[s] «Всегда пожалуйста.»"
1008603-94 = "Ну что ж, раз примерка закончена, пойду переоденусь обратно—"
1008603-95 = "[s7] «Подожди! Ты ведь впервые за долгое время так нарядилась, верно?»\n[s8] «Нельзя просто убрать платье в шкаф до вечеринки! Побудь нарядной весь день!»"
1008603-98 = "Вот так...?"
1008603-99 = "Кхм."
1008603-100 = "Отклонено, Сенсей."
1008603-101 = "В таком виде я слишком выделяюсь. Это может быть опасно—"
1008603-102 = "[s] «Ух! Но это же такая трата!»"
1008603-103 = "Я не могу ходить по Геенне в нарядном платье. На меня будут странно смотреть."
1008603-104 = "Нечего тут «тратить»..."
1008603-105 = "...Неужели это платье и правда настолько хорошее?"
1008603-106 = "...Я ценю ваши чувства, но нет."
1008603-107 = "Мне достаточно, что его увидели вы."
1008603-108 = "[s] «А?»"
1008603-109 = "Н-Ни о чём."
1008603-110 = "Пойдём обратно, Сенсей."
1008603-112 = "Так Хина снова переоделась в свою обычную одежду. Хотя мне всё-таки удалось уговорить её ещё немного пройтись по магазинам."
