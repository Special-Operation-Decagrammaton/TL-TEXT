[translation]
1009103-1 = "Клуб после школьной рок-группы"
1009103-2 = ""
1009103-8 = ""
1009103-9 = "Извините! Угх, я устала..."
1009103-10 = "Просто сниму обувь и поставлю её сюда..."
1009103-11 = ""
1009103-13 = ""
1009103-14 = "...Уф."
1009103-15 = ""
1009103-19 = "Фух! Так гораздо лучше."
1009103-20 = "А?"
1009103-21 = "...Сенсей? Чего вы смеётесь? ...Что смешного?"
1009103-22 = "[s1] «Я, конечно, всегда говорю „чувствуй себя как дома“, но...»\n[s2] «...ты обращаешься с этим местом как со своей спальней.»"
1009103-25 = "Ч-Что? Мне нельзя было сюда приходить?! Или я правда вам мешаю?"
1009103-26 = "А?"
1009103-27 = "Не в этом дело?"
1009103-28 = "...Фух. Слава богу. А я на секунду уже занервничала."
1009103-29 = ""
1009103-31 = ""
1009103-32 = "...Погодите. Стоп."
1009103-33 = "Мне надо как следует об этом подумать. Может, вы просто сейчас пытаетесь быть добрым."
1009103-34 = "Или... вы правда это имеете в виду. Или я показалась слишком наглой... или грубой..."
1009103-35 = "[s3] «Ты уже сама себя накручиваешь, да?»\n[s4] «Правда, всё нормально. Лучше расскажи, что сегодня произошло.»"
1009103-38 = ""
1009103-40 = ""
1009103-41 = "...Ха-ха. Л-Ладно."
1009103-42 = "Просто поверю вам на слово."
1009103-43 = "Хм... Что сегодня произошло..."
1009103-44 = "Ну, очевидно, ничего ПРЯМ серьёзного..."
1009103-45 = "Как я и писала в MomoTalk, репетиция немного затянулась, мы почувствовали, что хорошо сыгрались, и решили прогнать всё ещё несколько раз."
1009103-46 = "С репетициями такая штука: в плохой день мы заканчиваем пораньше, а в ХОРОШИЙ — никак не можем остановиться."
1009103-47 = "В итоге мы закончили, даже не доев десерты, которые принесли, и на секунду задумались, точно ли мы вообще клуб сладостей."
1009103-48 = "Теперь уже больше похоже, что мы Клуб после школьной группы, а не Клуб сладостей после школы."
1009103-49 = "...А, верно."
1009103-50 = "Кстати об этом. Я так и не съела десерт, поэтому забрала его с собой."
1009103-51 = "Хотите немного, Сенсей? Я как раз собиралась съесть его сейчас, если вы не против."
1009103-52 = "[s5] «О, повезло мне!»\n[s6] «Отлично, мне как раз нужен сахар.»"
1009103-55 = "Хи-хи. Хорошо. Давайте присядем и насладимся. Сегодня я особенно довольна своим выбором."
1009103-56 = "Это... Барабанная дробь..."
1009103-57 = "[s7] «Из кафе „Мильфей“!»\n[s8] «Торт „Печенье со сливками“, который едят ложкой!»"
1009103-60 = "О, погодите! Вы сразу поняли, что это такое, с одного взгляда?"
1009103-61 = "Вы теперь тоже полноценный фанат десертов? Хех, не знала, что мы так сильно на вас повлияли."
1009103-62 = "Хотя неважно. Даже хорошо, что не нужно объяснять каждую мелочь."
1009103-63 = "Ну что ж, давайте сразу приступим...!"
1009103-64 = ""
1009103-66 = ""
1009103-67 = "...Ха."
1009103-68 = "[s9] «...Казуса?»\n[s10] «Почему ты застыла?»"
1009103-71 = "Н-Ну, сначала я хотела зачерпнуть прям огромную ложку..."
1009103-72 = "...но потом подумала, что, знаете, как-то невежливо вот так жадно уплетать при взрослом."
1009103-73 = "Может, вы попробуете первым?"
1009103-74 = "...Погодите, можно есть как хочется? Вам всё равно?"
1009103-75 = "Х-Хмм... Мм... Вот как...?"
1009103-76 = "Ну, если Сенсей так говорит..."
1009103-77 = ""
1009103-79 = ""
1009103-80 = ""
1009103-81 = "Н-Нет! Не получится. Мне будет слишком неловко, так что нет."
1009103-82 = "Наверное, просто такая у меня странность."
1009103-83 = "Вам это может показаться глупым, Сенсей, но если вы не против подыграть..."
1009103-84 = ""
1009103-86 = ""
1009103-87 = ""
1009103-88 = "Сенсей..."
1009103-90 = "...давайте вы попробуете первым."
1009103-93 = "― [log=카즈사 밴드]...Ну же, скорее![/log][wa:4140]"
1009103-96 = "― [log=카즈사 밴드]Скажите «а-а»![/log][wa:1330]"
1009103-97 = "― [log=카즈사 밴드]Пока не упало![/log][wa:480]"
1009103-100 = "― [log=카즈사 밴드]Если вы не съедите,[/log][wa:800]"
1009103-101 = "― [log=카즈사 밴드]то и я не смогу съесть своё![/log][wa:1050]"
1009103-104 = "― [log=카즈사 밴드]Ну же, скажите «а-а-а»!![/log][wa:3035]"
1009103-107 = "― [log=카즈사 밴드]...А?[/log][wa:1450]"
1009103-110 = "― [log=카즈사 밴드]Можно?[/log]"
1009103-111 = "― [log=카즈사 밴드]Мне первой попробовать своё...?[/log][wa:2190]"
1009103-114 = "― [log=카즈사 밴드]А...?[/log][wa:500]"
1009103-115 = "― [log=카즈사 밴드]Эта ложка... моя?[/log][wa:3325]"
1009103-118 = "― [log=카즈사 밴드]...Хм?[/log][wa:2780]"
1009103-119 = "― [log=카즈사 밴드]...А?[/log][wa:1910]"
1009103-122 = "― [log=카즈사 밴드]Ложка...?[/log][wa:1560]"
1009103-123 = "― [log=카즈사 밴드]Моя...?[/log][wa:2570]"
1009103-126 = "― [log=카즈사 밴드]...А.[/log][wa:750]"
1009103-129 = "― [log=카즈사 밴드]А-а-а![/log]"
1009103-130 = "― [log=카즈사 밴드]Забудьте, что я только что сказала![/log][wa:2150]"
1009103-133 = "С-Сенсей! Н-Нет! Так нельзя..."
1009103-134 = "Это, эм... Ну...!"
1009103-135 = "Ой, торт...! Он падает...!"
1009103-136 = ""
1009103-140 = "К счастью, кусок торта упал на остальной торт, так что ничего страшного не случилось."
1009103-141 = "Казуса продолжала повторять «нет», пока ела, а потом покинула Шале, будто убегая."
