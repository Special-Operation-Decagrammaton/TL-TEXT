[translation]
83306105100-5 = "А-а-а-а! Всё пропало! Не могу поверить, что потеряла талон на еду!"
83306105100-6 = "Надо было раньше проверить, что он в кармане!"
83306105100-7 = "Я же не специально его потеряла!"
83306105100-8 = "Я каждый день снова и снова проверяла, что он на месте — так не могла дождаться, когда попробую еду с вечеринки!"
83306105100-9 = "И всё-таки умудрилась потерять его именно в день вечеринки, да?"
83306105100-10 = "Ну, наверное, шнурки развязываются именно тогда, когда собираешься бежать забег! Такое иногда случается!"
83306105100-12 = "Но почему это должно было случиться именно на ЭТОМ забеге?!"
83306105100-13 = ""
83306105100-15 = ""
83306105100-17 = ""
83306105100-18 = "Похоже, у Общества гурманов проблемы."
83306105100-19 = "А! Г-глава префектов! Мы сегодня ничего не делали!"
83306105100-20 = "Прямо сейчас мы просто бедные студенты, обречённые терпеть голод в суровой пустоши, пока остальные наслаждаются вкусной едой с вечеринки..."
83306105100-21 = "Мы превратились в группу трагически голодных желудков!"
83306105100-22 = "Хм? Джунко, разве только ты не можешь поесть? У меня талон есть."
83306105100-23 = "У меня тоже."
83306105100-24 = "И у меня!"
83306105100-26 = "Что?! Вы правда бросите своего товарища по клубу?!"
83306105100-27 = "Джунко, это неверное утверждение."
83306105100-28 = "Что?"
83306105100-29 = "Мы, Общество гурманов, — личности, стремящиеся взойти на вершину высшего гастрономического опыта."
83306105100-30 = "Если кто-то из наших товарищей падает на этом трудном пути и теряет свой талон на еду, это не мы бросили его. Это он бросил самого себя."
83306105100-31 = "А-а-а-а! Просто скажи мне в лицо, что хочешь разбить мне сердце! Скажи!"
83306105100-32 = "...Если это настолько серьёзная проблема, просто возьми мой талон."
83306105100-33 = "Ни за что! Как член Общества гурманов, я не могу позволить себе такую простую лазейку!"
83306105100-34 = "Вы очень строги, когда речь идёт о гастрономии."
83306105100-35 = "Хе, скажем так: путь гурмана требует абсолютной решимости."
83306105100-36 = "Но... в данном случае мы можем поискать талон Джунко."
83306105100-37 = "Что?! Правда?!"
83306105100-38 = "Да. Всем известно, что еда вкуснее в хорошей компании."
83306105100-39 = "Ага, тут ничего не поделаешь! Я уже голодная, но вместе всё равно лучше. Давайте найдём твой талон!"
83306105100-40 = "Хи-хи! Я знала, что мы будем искать, просто тебя дразнить весело! ★"
83306105100-41 = "Девочки!"
83306105100-42 = "Тогда... я тоже помогу искать."
83306105100-43 = "Спасибо вам всем!"
