[translation]
10052195-2 = ""
10052195-3 = "С-Сенсей..."
10052195-4 = "[s] «ЭЙМИ!!!»"
10052195-5 = "Фуфу. Посмотрите на себя. Ну и вид у вас, Сенсей."
10052195-6 = "...Хотите знать, в порядке ли я?"
10052195-7 = "..."
10052195-8 = "Обычно я бы не задумываясь ответила: да. Жаль, сейчас так не получается."
10052195-9 = "Простите, Сенсей. Похоже, здесь именно я разваливаюсь."
10052195-10 = "[ns] «...!»"
10052195-11 = "...Так... ярко."
10052195-12 = "Эта гигантская конструкция... Она... неестественная."
10052195-13 = "Она высасывает наши силы... даже саму жизнь..."
10052195-14 = "У меня чувство, будто сейчас что-то изменится."
10052195-15 = ""
10052195-17 = ""
10052195-18 = "Ах."
10052195-21 = "...Простите, Сенсей."
10052195-22 = "В конце концов мы оказались недостаточно сильны..."
10052195-23 = ""
10052195-26 = "[ns1] «...!!!»\n[ns2] «(Другого выбора у меня уже нет.)»"
10052195-29 = "Нет... Нет...! Пожалуйста, Сенсей...!"
10052195-30 = "Сенсей... Кей... Все..."
10052195-31 = "Пожалуйста... Хоть что-нибудь, что угодно..."
10052195-32 = "Если я могу сделать хоть ЧТО-НИБУДЬ...!"
10052195-36 = "Где..."
10052195-38 = "...это? Куда пропал Сенсей?"
10052195-39 = "Наконец вы прибыли."
10052195-41 = "Вы нас знаете? Кто вы? И где мы?"
10052195-42 = "Но важнее — где Сенсей...? И все остальные...?"
10052195-43 = "Д-да! Если всё так и останется, пока мы здесь, все...!"
10052195-44 = "Не беспокойтесь. Обещаю: пока что ваши друзья в безопасности."
10052195-45 = "Позвольте спросить вас кое о чём. Вы когда-нибудь задумывались об истоке всего сущего?"
10052195-46 = "Что?!"
10052195-47 = "Откуда мы пришли? Каково наше предназначение?"
10052195-48 = "Что происходит после конца всего?"
10052195-50 = "...Возможно, бог в каком-то смысле является дисциплиной для своих последователей."
10052195-51 = "Значит, вы помните. Я рад."
10052195-52 = "Поэтому, продолжая прокладывать свой путь вперёд — путь, принадлежащий только вам, — вы не должны забывать, кто вы есть на самом деле."
10052195-53 = "Арис, принцесса Безымянных Богов, и Кей, её слуга и ключ."
10052195-54 = "...Я больше не принцесса. Теперь я..."
10052195-55 = "И это ваше право. Однако ваши истоки и полномочия, дарованные вам в этой жизни, тесно вплетены в ваш путь."
10052195-56 = "...?"
10052195-57 = "Могу объяснить иначе — возможно, более современная аналогия вам подойдёт лучше. Представьте, что Кей — это реле, управляющее усилителем, которым являешься ты, Арис."
10052195-58 = "Реле...? Усилитель...?"
10052195-59 = "..."
10052195-60 = "Такова была твоя судьба. Принцесса Безымянных Богов, созданная Жрецами."
10052195-61 = "Твоей целью было вернуть это место, Кивотос, к миру, где когда-то правили Безымянные Боги. Где они снова могли бы обрести свои изначальные формы и принять власть."
10052195-62 = "И та, что сама выбрала себе имя «Кей,» — ключ к силе Безымянного Бога."
10052195-63 = "Инструмент, устройство. Её предназначение — открыть силы Принцессы Безымянных Богов, когда придёт время."
10052195-64 = "Я-я... Но я...!"
10052195-65 = "Цок..."
10052195-66 = "Разумеется, вы двое отважно сделали всё, чтобы этот замысел никогда не осуществился. Вы по собственной воле отвергли предназначенную вам судьбу. По собственной свободной воле."
10052195-67 = "И ключ столь же отважно отбросила собственное предназначение и судьбу."
10052195-68 = "Однако теперь вы оказались на развилке. Путь повторного пробуждения снова распахивает перед вами двери."
10052195-69 = "Что сделает это «повторное пробуждение»?"
10052195-70 = "Неужели вы хотите сказать...?!"
10052195-71 = "Верно. Стальной континент — колоссальный феномен Мистики — проявился в Кивотосе."
10052195-72 = "Именно поэтому я сейчас могу говорить с вами."
10052195-73 = "И пока этот феномен существует, Арис обладает безграничным потенциалом выйти за пределы отношений реле и усилителя."
10052195-74 = "Она сама может стать Безымянным Богом."
10052195-75 = "Б... Безымянным Богом? Что это значит?"
10052195-76 = "Ты трансцендируешь и станешь БОГОМ."
10052195-77 = "Ты станешь всемогущим существом, для которого собственные желания — лишь игрушки на кончиках пальцев."
10052195-78 = "Ибо Безымянные Боги владеют силой возможности."
10052195-79 = "Эта сила. «Возможность.» В ней нет ничего особенно уникального."
10052195-80 = "Каждое живое существо рождается с этой силой, пусть и ничтожно малой."
10052195-81 = "Если ты вознесёшься к тому, что принадлежит тебе по праву рождения... самозванца, претендующего на божественность, вроде Декаграмматона можно будет вычеркнуть из летописей истории так, словно его никогда не существовало."
10052195-82 = "Ты обретёшь силу привести к спасению своих друзей, свою Кей и даже Сенсея из Шале."
10052195-83 = "Эта сила не требует от тебя ни жертвы, ни лишений. Лишь искреннего принятия."
10052195-84 = "Но что тогда случится со мной? Что... станет с Тэндо Арис?"
10052195-85 = ""
10052195-88 = "У тебя острые инстинкты. Если ты трансцендируешь в ту, кем тебе было предназначено стать..."
10052195-89 = "...сама возможность существования сегодняшней Тэндо Арис будет стёрта."
10052195-90 = "Это—!!"
10052195-91 = "..."
10052195-92 = "Тэндо Арис передо мной... Она ведь сама лишь результат одной единственной возможности среди миллионов, разве нет?"
10052195-93 = "Разве создать Рай — не благородный и достойный путь?"
10052195-94 = "Но все мои друзья... и Сенсей... Разве им не будет хоть немного грустно, если я исчезну?"
10052195-95 = "Простое решение. Все воспоминания о том, что ты когда-либо существовала, будут стёрты из их памяти."
10052195-96 = "Как ты смеешь...?!"
10052195-97 = "...!"
10052195-98 = "Нельзя скорбеть о чём-то — или о ком-то, — чего не существует."
10052195-99 = "Разве не желанием твоего сердца было написать счастливый финал для всех нас здесь?"
10052195-100 = "Но...!"
10052195-101 = "..."
10052195-102 = "Алиса...?"
10052195-103 = ""
10052195-105 = ""
10052195-106 = ""
10052195-107 = ""
10052195-108 = "Мне это не нужно."
10052195-109 = "Мне не нужна такая вещь."
10052195-111 = "Алиса!"
10052195-112 = ""
10052195-114 = ""
10052195-115 = ""
10052195-116 = "Неожиданный ответ. И чем же ты его объяснишь?"
10052195-117 = "Рай — это место, куда мы все должны прийти вместе, держась за руки! Это не место, ради которого нам нужны чудеса или абсолютная сила."
10052195-118 = "И даже если у нас не получится... Даже если мы никогда не достигнем рая, а наши истории закончатся трагедией..."
10052195-119 = ""
10052195-121 = ""
10052195-122 = "Как сказал Сенсей: «Если так всё и закончится — значит, так тому и быть.»"
10052195-123 = "Тогда я не понимала, что это значит... но теперь, кажется, понимаю."
10052195-124 = "Именно так, Арис!"
10052195-125 = "Было бы прекрасно вернуть Кивотос к тому, каким он был раньше."
10052195-126 = "Больше всего на свете я хочу помочь всем вернуть свои истинные формы."
10052195-127 = "Но это не будет результатом наших собственных усилий. Я не хочу использовать чит-движок, чтобы мгновенно повысить себе уровень."
10052195-128 = "Игры не предназначены для такого прохождения."
10052195-129 = "Ты повышаешь уровень медленно, по одному, учишься правильно распределять очки навыков. Вся суть — с самого низа осваивать игровой процесс через трудности. Именно оттуда и нужно начинать."
10052195-130 = "И именно через этот опыт ты узнаешь такие чувства, как «веселье» и «удовлетворение»."
10052195-131 = "Поэтому я продолжу идти по этому пути вместе с друзьями. И однажды мы всё-таки доберёмся туда."
10052195-132 = "Для нас ценен сам путь!"
10052195-133 = "То, что достаётся легко, так же легко теряется. Ты ничему не учишься, и ничего долговечного из этого не выходит."
10052195-134 = "Разве это не просто взгляд, который именно ты, Арис, приобрела, познавая мир через видеоигры?"
10052195-135 = "Да. И мне очень повезло с этим."
10052195-136 = "Я уже не такая наивная, как раньше. Я знаю, что в этом мире есть невозможные, непреодолимые вещи."
10052195-137 = "Я узнала, что реальность может быть суровой и жестокой. Иногда на неё трудно смотреть прямо."
10052195-138 = "В мире видеоигр всё не так."
10052195-140 = "Понимаете, видеоигры создаются из надежд тех, кто представляет себе более прекрасный мир."
10052195-142 = "Пока люди продолжают мечтать о том, как сделать свой мир, свой дом, лучше и прекраснее, я не понимаю, как надежда вообще может умереть."
10052195-143 = ""
10052195-144 = "Надежда на то, что тяжёлый труд окупится..."
10052195-145 = "Вера в собственные усилия..."
10052195-146 = "Я надеюсь, что мы все продолжим вместе повышать уровень и расти вместе."
10052195-147 = "Продвигаться мы будем медленно, но однажды всё равно придём туда, куда должны."
10052195-148 = "Потому что я..."
10052195-149 = ""
10052195-151 = ""
10052195-152 = ""
10052195-153 = ""
10052195-154 = "...люблю всех."
10052195-155 = "Всех в Миллениуме, всех в Кивотосе, Кей."
10052195-156 = "И Сенсея тоже. Я люблю каждого человека, которого встретила в своём путешествии."
10052195-157 = ""
10052195-159 = ""
10052195-160 = "..."
10052195-161 = ""
10052195-163 = ""
10052195-164 = "Но эту силу я всё же позаимствую!"
10052195-165 = "АРИС?!"
10052195-166 = "Ты пришла к любопытному выводу. Разве ты уже не отвергла эту судьбу?"
10052195-167 = "Нет! Теперь я наконец поняла!"
10052195-168 = "Здесь, на Стальном континенте, я могу сама выбирать, как распорядиться своей судьбой!"
10052195-169 = "И даже вы меня не остановите!"
10052195-170 = "Так, посмотрим, сработает ли...? Значит, вот так, потом так и..."
10052195-171 = "А!!"
10052195-172 = ""
10052195-174 = ""
10052195-175 = "...Быстро же ты приспосабливаешься."
10052195-176 = "Уверен, ты понимаешь последствия того, что возьмёшь эту силу не как Принцесса Безымянных Богов, а как Тэндо Арис."
10052195-177 = "И всё равно продолжишь?"
10052195-178 = "Да! Можете спрашивать меня снова и снова, но мой ответ не изменится."
10052195-179 = "Именно так, как учил нас Сенсей!"
10052195-180 = "Ты станешь обычным студентом."
10052195-181 = "У тебя больше не останется никаких возможностей. На этом всё."
10052195-182 = "Всё, что ты узнала здесь, даже само существование этого места, будет стёрто из твоей памяти."
10052195-183 = "Ибо забвение — необходимое условие твоего входа сюда."
10052195-184 = "Я знаю. Но мне всё равно."
10052195-185 = "Ты будешь расти."
10052195-186 = "Да. Я буду расти!"
10052195-187 = "Но этот рост будет болезненным."
10052195-188 = "Я не стану притворяться, будто мне не страшно. Но это не значит, что я не смогу выдержать!"
10052195-189 = "Ты низойдёшь из божественного состояния и станешь несовершенным существом."
10052195-190 = "Я не считаю себя несовершенной. Совсем нет."
10052195-191 = "То, что дорого моему сердцу, важнее славы или силы."
10052195-192 = "Кей... Мои друзья..."
10052195-193 = "...И Сенсей."
10052195-194 = "Вот что для меня важно. Гораздо больше, чем я вообще могла представить!"
10052195-195 = "Мы живём не ради чудес, силы или особых привилегий."
10052195-196 = "Важно то, что мы продолжаем делать ещё один шаг вперёд и доверяем друг другу, пока идём дальше."
10052195-197 = "Вот именно! Ну что скажете о нашей Арис, а? Разве она не лучшая?"
10052195-198 = "Поэтому я возьму свою силу!"
10052195-199 = "В первый и последний раз я, Тэндо Арис, воспользуюсь своим правом по рождению!"
10052195-200 = ""
10052195-202 = ""
10052195-203 = "Понятно. И я стану свидетелем."
10052195-204 = "Покажи мне. Покажи, что значит сотворить чудо, отказавшись от него."
10052195-205 = "Ха... Как занятно! Как же интересно!"
10052195-206 = "Позволь мне увидеть завершение этой главы."
10052195-207 = "Принцесса... Нет, Арис. Пожалуйста, докажи мне, что эта надежда — не плод наивных заблуждений."
10052195-208 = "Я хочу это увидеть. Тебя, достигающую земли обетованной рука об руку с теми, в кого ты веришь. Именно так, как ты сама и предсказала."
10052195-209 = "Итак, ты вновь заявишь права на свой трон. И чего же ты добьёшься этой силой, принадлежащей только тебе, Арис?"
10052195-211 = "Мои... Мои друзья..."
10052195-212 = "Да. Твои благородные желания сияют ярко. Однако невозможное остаётся невозможным."
10052195-213 = ""
10052195-214 = "...Да. Потому что помочь этой силой можно лишь тем, кому дарована Мистика."
10052195-215 = "То же касается и Сенсея... Если с ним когда-нибудь что-то случится..."
10052195-216 = "Я не смогу отменить то, что уже произошло."
10052195-217 = "Тогда я спрашиваю снова. Чего ты хочешь добиться, Арис?"
10052195-218 = "Хи-хи! Я уже ответила на этот вопрос!"
10052195-219 = "...Фуфу. Полагаю, ты права. Глупый вопрос с моей стороны."
10052195-220 = "Спасибо вам, странный голос!"
10052195-221 = "Это я должен благодарить тебя. Ты принесла с собой нечто новое.#nА теперь пришло время прощаться."
10052195-222 = "Наши пути навсегда останутся параллельными, и мы больше никогда не встретимся."
10052195-223 = "Те, кто следует за тобой, заклеймят тебя предательницей и проклянут за содеянное."
10052195-224 = "И всё же я наслаждался каждым мгновением нашей встречи."
10052195-225 = "Прощай, Арис. Пусть удача сопровождает каждый твой осторожный шаг."
10052195-226 = "Спасибо! До свидания! Я буду стараться изо всех сил, что бы ни случилось!"
10052195-227 = ""
10052195-229 = ""
10052195-230 = ""
10052195-231 = "И тебе, Кей. Единственной носительнице моей идентичности."
10052195-232 = "...Похоже, мне придётся нести её до самой могилы."
10052195-233 = "Спасибо. Это приносит мне покой."
10052195-234 = "Ну что ж. Пришло время вам уходить."
10052195-235 = "Не беспокойтесь и идите вперёд с отвагой."
10052195-236 = "И, быть может, однажды наши возможности снова сойдутся."
10052195-237 = ""
10052195-239 = ""
10052195-243 = "[ns] «А...?»"
10052195-244 = "...?"
10052195-245 = "Наверное... всё было..."
10052195-246 = "Я думала, мне конец... Как?"
10052195-247 = "Арис? Ты в порядке?"
10052195-248 = ""
10052195-249 = "Да! Я в порядке! И Кей тоже..."
10052195-250 = "Отныне всё будет хорошо!"
10052195-251 = "Что...?!"
10052195-256 = "[log=아리스 결전 비무장]Здравствуйте! [wa:1130]Я Тэндо Арис![/log]"
10052195-257 = "[wa:1800][log=아리스 결전 비무장]Я состою в Отделе разработки игр![/log]"
10052195-262 = "[log=아리스 결전 비무장]Я учусь писать код, [/log]"
10052195-263 = "[log=아리스 결전 비무장][wa:2230]и теперь умею программировать[wa:1130] простые вещи![/log]"
10052195-268 = "[log=  ]А ещё, [wa:960]хоть я пока только студент, я также герой![/log]"
10052195-273 = "[log=아리스 결전 비무장]Герой...[wa:1080]это не тот, кто [wa:1690]особенно впечатляющий или великий.[wa:80] [/log]"
10052195-278 = "[log=아리스 결전 비무장]Скорее это класс, который [wa:790]вселяет храбрость во всех![wa:80] [/log]"
10052195-279 = "[wa:1910][log=아리스 결전 비무장]Это приключение, [wa:960]путешествие к горизонту![/log]"
10052195-284 = "[log=아리스 결전 비무장]Поэтому [wa:920]я, Арис, никогда не сдамся! [wa:1550]До самого конца всех концов![/log]"
10052195-287 = "Арис...!"
10052195-288 = "Мы справимся, Кей! Покажем им, на что мы способны, вместе!"
10052195-289 = "Это...?! Эта Мистика, эта божественность!"
10052195-290 = "Кем ты хочешь быть, Кей?"
10052195-291 = "Ч-что?!"
10052195-292 = "Сейчас наше воображение безгранично!"
10052195-293 = "Кем ты хочешь быть? Самой сильной? Самой собой? Подойдёт что угодно!"
10052195-294 = "Представь ту версию себя... которой ты гордишься больше всего!"
10052195-295 = "I-I...!"
