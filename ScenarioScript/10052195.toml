10052195-424 = "Сенсей?!"
10052195-425 = "...Вы серьёзно?"
10052195-426 = "...Нужно всегда выслушивать того, кто пытается обратиться к тебе? Как послов, которых раньше отправляли во время войн?"
10052195-427 = "Но вы можете подвергнуть себя опасности..."
