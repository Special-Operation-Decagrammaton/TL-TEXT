10052195-369 = ""
10052195-370 = ""
10052195-371 = "По крайней мере стало немного легче. Больше нет ощущения, будто конечности тянут во все стороны."
10052195-372 = "Угх... *тяжело дышит*..."
10052195-373 = "Вы в порядке, Сенсей? Госпожа Рио?"
10052195-374 = "А. Смотрите. Кей сменила одежду на школьную форму."
10052195-375 = "Что? А-а? С каких пор...?!"
10052195-376 = "..."
10052195-377 = "Теперь понимаю, Кей. Именно такой вариант себя тебе нравится больше всего."
10052195-378 = "Значит... ты уже была именно той, кем хотела быть!"
10052195-379 = "Я...!"
10052195-380 = "Ты права. Совершенно права."
10052195-381 = "Кроме того, пусть внешне я выгляжу точно так же..."
10052195-382 = "...моё тело изменилось на молекулярном уровне! Вся структура теперь другая!"
10052195-383 = "Она права! Я могу за неё поручиться!"
10052195-384 = "Ключ. Скажи мне. Как ты воспринимаешь «божественность»?"
10052195-385 = "Это сила, даруемая не за заслуги, а передаваемая лишь избранным немногим, отмеченным с самого начала."
10052195-386 = "Несправедливость этой судьбы глубока и сама по себе является трагедией."
10052195-387 = "Мне плевать, что ты думаешь! Оставь свои мнения при себе."
10052195-388 = "Мне надоела эта бесполезная игра словами. Мы сидим тут и мусолим давно забытое прошлое!"
10052195-389 = "Даже если это твоё прошлое? Само твоё происхождение?"
10052195-390 = "Именно поэтому никто не имеет больше права сказать это, чем я!"
10052195-391 = "Меня волнует настоящее. Настоящее, которое ты всё время пытаешься забрать себе."
10052195-392 = "Жизнь и без того хрупкая, так оставь её тем, кто живёт здесь и сейчас."
10052195-393 = "Потому что плохо освещённый маяк приведёт корабль к крушению!"
