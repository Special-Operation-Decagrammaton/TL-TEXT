10052195-361 = "Если я остановлюсь здесь, всё это превратится в мимолётные следы и исчезнет."
10052195-362 = "*вздыхает*"
10052195-363 = "В каком-то смысле мне приходится, пусть и нехотя, признать твою неустанную настойчивость."
