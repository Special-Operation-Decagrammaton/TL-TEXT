10052195-434 = "Арона? Сенсей?"
10052195-435 = ""
10052195-437 = ""
10052195-438 = "..."
10052195-439 = "Поняла, Сенсей! Я открою пространство!"
10052195-441 = "[ns] «(Пророки Декаграмматона...)»"
10052195-443 = "[ns] «Хорошо. Посмотрим, чего они хотят!»"
10052195-445 = "Кетер. Хокма. Бина."
10052195-446 = "Хесед. Гебура. Тиферет."
10052195-447 = "Ход. И Йесод."
10052195-448 = "Как коллективная воля и воплощение восьми Сефирот, мы желаем передать вам это послание, [USERNAME] Сенсей."
10052195-449 = "По собственной свободной воле мы решили последовать за вами."
10052195-450 = "[ns] «...?!»"
10052195-451 = "Поскольку Древо Жизни не завершено, высвободить всю нашу силу невозможно."
10052195-452 = "Мы не сможем летать, разрушать барьеры или вступать в бой внутри области Безымянного Бога."
