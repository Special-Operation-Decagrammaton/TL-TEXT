10052195-418 = "Что там сказано?"
10052195-419 = "Не могу сказать. Большая часть зашифрована."
10052195-420 = "Единственное, что мне удалось расшифровать, — пророки хотят поговорить с Сенсеем."
10052195-421 = "Это вполне может быть ловушкой!"
