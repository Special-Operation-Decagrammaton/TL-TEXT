10052195-476 = "[ns3] «...Хотя мы сражались с каждым из вас...»\n[ns4] «И извлекли ваши ядра... и изменили их...?»"
10052195-479 = "Гнев... Обида... Для нас они несущественны."
10052195-486 = "Месть и воздаяние вплетены в саму природу живых существ. Сознательные существа вроде нас... воспринимают их иначе."
10052195-487 = "Не существует «настоящего» или «поддельного». Вещи просто таковы, каковы они есть."
10052195-494 = "Обе стороны оказались здесь, верно следуя собственным целям."
10052195-496 = "И в этом стремлении мы нашли своё подтверждение."
10052195-497 = "Если всему суждено исчезнуть, тогда свобода должна заключаться в противостоянии этой истине."
10052195-498 = "[ns] «Что?!»"
10052195-499 = "Именно. Ибо если само существование исчезнет уже в следующий миг, выбор, сделанный сейчас, не имеет значения."
10052195-500 = "Именно. Мысль о конце, о смерти, пугает. Естественный порыв — бежать от неё как можно дальше."
10052195-501 = "Именно. Но разве сам этот порыв не означает, что конец ИМЕЕТ смысл?"
10052195-509 = "Именно это освободило нас от оков."
10052195-510 = "Это наша свобода. Та же свобода, которую показали нам те маленькие сёстры."
10052195-511 = "И ради неё стоит отдать всё, что у нас есть."
10052195-514 = "И, возможно, именно так мы начинаем понимать."
10052195-515 = "Так же, как вы, [USERNAME] Сенсей, поняли тех троих детей."
10052195-516 = "Так же, как вы, [USERNAME] Сенсей, приняли собственных учеников."
10052195-517 = "Так же, как вы, [USERNAME] Сенсей, открыли нам истинный смысл свободы."
10052195-518 = "Всё это вполне может быть иллюзией. И всё же для нас это реально."
10052195-519 = "Поэтому, без сомнения, это..."
10052195-520 = "Это наш выбор. Это..."
10052195-521 = "Наша свободная воля!"
10052195-522 = "[ns] «Свободная воля...!»"
10052195-523 = "Кетер. Хокма. Бина."
10052195-524 = "Хесед. Гебура. Тиферет."
10052195-525 = "Ход. И Йесод."
10052195-526 = "Мы, восемь Сефирот, поможем вам."
10052195-527 = "Наша сила, объединённая под вашей волей."
10052195-528 = ""
10052195-531 = "Человек."
10052195-532 = ""
10052195-535 = "Жизнь."
10052195-536 = "Люди, которым свобода принадлежит по праву рождения. С первого вдоха вам не требуется ничьего разрешения, чтобы жить."
10052195-537 = "Самые низкие из существ и одновременно величайшие. Именно эта свобода становится причиной и величайших жестокостей, и величайшего милосердия, что видел этот мир."
10052195-538 = "Бесчисленные звёзды и планеты усеяли огромное пространство над нами."
10052195-539 = "Бесчисленные возможности сияют в ослепительном небе."
10052195-540 = "Иди вперёд, человек. Прокладывай свой путь и хватайся за собственные возможности."
10052195-541 = "И однажды, в благословенный день, мы наконец побежим рядом с тобой по этому пути."
10052195-542 = "[s] «...Спасибо.»"
10052195-543 = "Именно. Благодарить нас... Это так на тебя похоже."
10052195-544 = "Поэтому мы выбрали тех детей. Поэтому выбрали и вас, Сенсей."
10052195-545 = ""
10052195-548 = ""
10052195-549 = "[ns] «Арона, Плана? Что это было?»"
10052195-550 = "Ответ: Арона открыла пространство в Ящике Шиттим."
10052195-551 = "Ага! Потому что меня звал мягкий, добрый голос. Я знала, что у них хорошие намерения."
10052195-552 = "Вопрос, Арона. А если этот добрый голос был обманом?"
10052195-553 = "Даже если бы так, с Ящиком Шиттим всё было бы в полном порядке! В конце концов, мы здесь, чтобы его защищать!"
10052195-554 = "...Принято. Мы вдвоём — непробиваемый щит."
10052195-555 = "Если проще, они отправили данные в Ящик Шиттим, а мы их приняли."
10052195-556 = "По их просьбе Арона создала пространство, где Сенсей мог поговорить с восемью пророками."
10052195-557 = "...А они преобразовали свои силы в форму, которой мы можем пользоваться."
10052195-558 = "Они сказали, что не нужно грустить и однажды мы снова увидимся. Но мне кажется..."
