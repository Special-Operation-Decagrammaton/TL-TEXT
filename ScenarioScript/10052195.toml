10052195-400 = ""
10052195-402 = ""
10052195-403 = "Хе-хе! И мы тоже здесь!"
10052195-404 = "Канал связи установлен! Сенсей, вы в порядке?!"
10052195-405 = "С-слава богу... Все..."
10052195-407 = "Если кратко описать нынешнюю ситуацию... Мы вообще не можем получить изображение с вашей стороны, Сенсей!"
10052195-408 = "Тот... алтарь. Его полностью окружила какая-то странная сфера."
10052195-409 = "М-мы несколько раз пытались стрелять по ней... но вообще ничего не произошло..."
10052195-410 = "Я делаю вывод, что единственное решение — разрушить её область изнутри."
