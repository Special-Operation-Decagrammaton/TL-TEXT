[translation]
2001415-1 = "Кролик и военный устав"
2001415-2 = "На столе лежала книга с именем Саки."
2001415-3 = ""
2001415-6 = "Сенсей, вы нашли её?"
2001415-7 = "Я искала по всему парку, но её там не было..."
2001415-8 = "[s] «Ты вот это искала?»"
2001415-9 = ""
2001415-11 = ""
2001415-12 = "Да! Она!"
2001415-13 = "Именно она!"
2001415-14 = "[s] «Что это за книга?»"
2001415-15 = "Ну, возможно, вы удивитесь..."
2001415-16 = "Это не какая-то обычная книга."
2001415-17 = "Вот, смотрите!"
2001415-18 = ""
2001415-20 = ""
2001415-22 = "Впечатляет, правда?"
2001415-23 = "[ns] «...И чем же она необычная?»"
2001415-24 = "Что?! Это же руководство для студентов SRT!"
2001415-25 = "Здесь собраны все основы и базовые тактики жизни в SRT."
2001415-26 = "Большинство людей вообще не могут его увидеть, но вам можно, Сенсей!"
2001415-27 = "[s] «Здесь куча закладок и заметок на полях...»"
2001415-28 = "Ну, я не могла дождаться начала семестра, поэтому прочитала её целиком. Уже десять раз."
2001415-29 = "Я хотела убедиться, что хорошо понимаю основы."
2001415-30 = "[s] «Почему здесь написано: „На территории кампуса всегда идти в ногу с остальными“?»"
2001415-31 = "А. Это правила этикета SRT."
2001415-32 = "Там не одобряют, когда кто-то идёт в своём темпе. Все стараются шагать в ногу."
2001415-33 = "Меня часто за это ругали, пока я не привыкла."
2001415-34 = "[s] «Но я видел, что иногда ты идёшь не в ногу.»"
2001415-35 = "Например, когда мы шли по мосту, да?"
2001415-36 = "[s] «...Да, кажется, именно тогда.»"
2001415-37 = "Фу-фу... В руководстве и про это написано!"
2001415-38 = "Видите, на мосту слишком много людей, идущих в ногу, могут войти в резонанс с его собственной частотой."
2001415-39 = "Из-за этого мост может разрушиться, поэтому при переходе мы специально сбиваем шаг."
2001415-40 = "Правила и уставы SRT предусматривают вообще всё, правда?"
2001415-41 = "[s1] «Погоди, „мост может разрушиться“?!»\n[s2] «Ого, впечатляет!»"
2001415-44 = "Правда ведь? Правда? Здесь о-о-очень много таких интересных вещей. Вам стоит прочитать, Сенсей!"
2001415-45 = ""
2001415-48 = "[ns3] «В конце есть страница с заметками...»\n[ns4] «А это что? „Приходил некто по имени Сенсей из Шале“.»"
2001415-51 = "А?!"
2001415-52 = "(А-а!! Я забыла, что использовала эту страницу как дневник!!)"
2001415-53 = "[s] «Я никогда не доверяю взрослым»."
2001415-54 = "Н-Ну а разве МОЖНО им доверять? Большинству взрослых — нет. Тогда это звучало разумно!"
2001415-55 = "В любом случае, почему вы всё ещё это читаете?!"
2001415-56 = "[s] «Ведёт себя мило, но наверняка у него есть какой-то скрытый мотив»."
2001415-57 = "И-и-и! Отдайте!! Отдайте сюда!"
2001415-58 = "[ns] «Ну, может быть, он ВСЁ-ТАКИ действительно хороший»."
2001415-59 = "Хватит это читать!!"
2001415-60 = ""
2001415-63 = "Когда я пришёл в себя, Саки уже забрала руководство и ушла."
2001415-64 = "Пока я был без сознания, она написала у меня на лице «Идиот!». Смывалось это с трудом."
