[translation]
1300102-1 = "Аромат облаков"
1300102-2 = "Придя в торговый район, я заметил Чисэ, бесцельно бродившую вокруг."
1300102-3 = ""
1300102-4 = ""
1300102-5 = ""
1300102-6 = ""
1300102-7 = "[s] «Чисэ, что ты делаешь?»"
1300102-8 = "А, Сенсей. Ты здесь?"
1300102-9 = "[s] «Ты будто просто бродишь без цели.»"
1300102-10 = "Ну..."
1300102-11 = "Эм, я гонялась за облаком."
1300102-12 = "[s] \"A cloud?\""
1300102-13 = "А, вон оно, снова двигается."
1300102-14 = "Сенсей, надо за ним идти."
1300102-15 = ""
1300102-16 = ""
1300102-17 = ""
1300102-18 = "Чисэ медленно пошла следом за плывущим облаком."
1300102-19 = "[s] «Эй, Чисэ! Подожди!»"
1300102-22 = "Облако..."
1300102-27 = "[ns] «Это то облако, которое ты ищешь?»"
1300102-28 = "Нет, другое."
1300102-29 = "То, что я ищу, немного... мягче."
1300102-30 = "Лёгкое и пушистое, Сенсей."
1300102-31 = "[s] «Облака... облака...»"
1300102-32 = "..."
1300102-33 = ""
1300102-34 = ""
1300102-35 = ""
1300102-36 = "[ns] «Чисэ, подожди!»"
1300102-38 = "Я исходил всё вокруг, гоняясь за Чисэ, которую словно носило ветром."
1300102-40 = ""
1300102-41 = "И здесь нет..."
1300102-42 = ""
1300102-43 = ""
1300102-45 = ""
1300102-46 = ""
1300102-47 = ""
1300102-49 = ""
1300102-50 = "И здесь тоже."
1300102-51 = "Хм..."
1300102-52 = ""
1300102-53 = "[s] «Чисэ, подожди минутку!»"
1300102-54 = ""
1300102-55 = "Хм? Сенсей? Что такое?"
1300102-56 = "[s1] «Может, хватит?»\n[s2] «Какое именно облако ты ищешь?»"
1300102-57 = "Облако, которое я ищу..."
1300102-58 = "Облако, которое я ищу..."
1300102-59 = "[s] «Если объяснишь, мы найдём быстрее.»"
1300102-60 = "И правда. Если ты поможешь, Сенсей..."
1300102-61 = "...думаю, мы его найдём."
1300102-62 = "Итак, облако, которое я ищу... оно..."
1300102-63 = "Ну..."
1300102-64 = "[s] «Ну...?»"
1300102-65 = "Мягкое облако."
1300102-66 = "[s3] «Мягкое. Да. Ты уже это говорила.»\n[s4] «Это было мягкое облако. И?»"
1300102-67 = "И ещё..."
1300102-68 = "И ещё..."
1300102-69 = "Оно очень приятно пахло."
1300102-70 = "[s5] «Конечно, оно прекрасно пахло.»\n[s6] «...Постой. А? Пахло?»"
1300102-71 = "Ага."
1300102-72 = "Ага."
1300102-73 = "От этого запаха казалось, будто я плыву по мягким облакам в небе."
1300102-74 = "[s] «Можешь объяснить чуть подробнее...»"
1300102-75 = "Подробнее..."
1300102-76 = "Эм."
1300102-77 = "Пахнет как сияющее солнце над головой."
1300102-78 = "[s7] «Пахнет солнцем...»\n[s8] «Есть ещё какие-нибудь приметы?»"
1300102-79 = "Что-нибудь ещё... Другая особенность..."
1300102-80 = "Что-нибудь ещё... Другая особенность..."
1300102-81 = "А, есть ещё кое-что."
1300102-82 = "[s] «О! Что?»"
1300102-83 = "Это облако было похоже на тебя."
1300102-84 = "Ага, совсем как ты."
1300102-85 = "[s9] «А?»\n[s10] «Было похоже на меня?»"
1300102-86 = "Да! Тёплое, как солнечный свет, и пахнет невероятно приятно. Даже просто рядом с ним мне хорошо!"
1300102-87 = "Да! Тёплое, как солнечный свет, и пахнет невероятно приятно. Даже просто рядом с ним мне хорошо!"
1300102-88 = "Мне оно очень понравилось."
1300102-89 = "[s11] «Понятно.»\n[s12] «Ты ведь говоришь об увиденном облаке... верно?»"
1300102-90 = "Конечно, я говорю про облако!"
1300102-91 = "Конечно, я говорю про облако!"
1300102-92 = "Сегодня такая хорошая погода! Думаю, мы можем его найти!"
1300102-93 = "Было бы здорово..."
1300102-95 = "Мы с Чисэ бродили в поисках облака, пока не село солнце."
1300102-98 = "[ns] «Похоже, сегодня облако не найдём.»"
1300102-99 = "Ага."
1300102-100 = "[s] «Ничего, будет завтра. В следующий раз...»"
1300102-101 = "(пристально смотрит)"
1300102-102 = "[s] «Чисэ...?»"
1300102-103 = "(пристально смотрит)"
1300102-104 = "[s] «Чисэ, на что ты смотришь?»"
1300102-107 = "Сахарная вата..."
1300102-108 = "[s] «Сахарная вата?»"
1300102-110 = "[s] «Если хочешь... могу купить тебе.»"
1300102-111 = "(кивает)"
1300102-114 = "Спасибо!"
1300102-116 = "Ням-ням."
1300102-117 = "[s] «Ну как? Вкусно?»"
1300102-118 = "Ага."
1300102-119 = "[s13] «Это здорово.»\n[s14] «Облако мы не нашли, но будет следующий раз.»"
1300102-120 = ""
1300102-121 = ""
1300102-122 = "Ага... Ням-ням-ням."
1300102-123 = "[s] «Кстати, что это вообще было за облако?»"
1300102-124 = "Трудно объяснить."
1300102-125 = "Но ничего..."
1300102-126 = "Это облако мне тоже нравится."
1300102-127 = "[s] \"A cloud?\""
1300102-128 = "Форма и текстура немного другие, но..."
1300102-129 = "Ты умеешь покупать самые вкусные облака."
1300102-130 = "[s] «...?»"
1300102-131 = "Ах..."
1300102-132 = "У меня вся рука липкая, Сенсей."
1300102-133 = "[s] «О, подожди. У меня где-то есть чем вытереть...»"
1300102-134 = "Хм. Надо помыть оставшуюся сахарную вату, чтобы не была такой липкой."
1300102-135 = "[s] «...Нет, не надо!»"
1300102-137 = "После этого я отчаянно пытался не дать Чисэ вытереть руки об мою одежду."
