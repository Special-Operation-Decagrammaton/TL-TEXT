[translation]
70007020-1 = "Случайная встреча 2"
70007020-2 = "Семь... Восемь...!"
70007020-3 = "(Даже после сотен повторений её техника всё ещё безупречна. И для неё это будто лёгкая пробежка.)"
70007020-4 = "...Девять... Десять! Так... Всего было сорок?"
70007020-5 = "(С-сорок?! Даже близко нет! Я ОЧЕНЬ внимательно считала!)"
70007020-6 = "Мм! Давайте просто округлим вниз до тридцати — я ведь даже не вспотела. Раз! Два!"
70007020-7 = "П-простите!"
70007020-8 = "Да, милая? Что такое?"
70007020-9 = "(Ах! Зачем я её прервала? Это серьёзное нарушение этикета спортзала!)"
70007020-10 = "Н-ничего! П-просто хотела пожелать хорошей тренировки!"
70007020-11 = "Хе-хе, какая же ты милая."
70007020-12 = "..."
70007020-13 = "Восемь, девять — и всего двадцать!"
70007020-15 = "(Разве в прошлый раз она не сказала, что было тридцать?!)"
70007020-21 = ""
70007020-22 = ""
70007020-23 = "И вот уже... сто! Фух! Как освежает!"
70007020-24 = "(Это было 785 повторов... Я чуть не потеряла сознание, пока пыталась повторять за ней!)"
70007020-25 = "(У неё сверхчеловеческая выносливость... и весьма сомнительные навыки счёта!)"
70007020-26 = ""
70007020-27 = "День ног пропускать нельзя. Как насчёт разминки на беговой дорожке?"
70007020-28 = "(Она уже бежит на дорожке с подъёмом, будто взбирается на гору!)"
70007020-29 = ""
70007020-30 = "Теперь гребля!"
70007020-31 = "(С такой скоростью ей вообще не нужен был бы мотор!)"
70007020-32 = ""
70007020-33 = "А теперь всерьёз возьмёмся за жим ногами!"
70007020-39 = ""
70007020-40 = "Великолепно! А теперь..."
70007020-41 = "(Я не смогу и дальше держать такой темп!)"
70007020-42 = "(Так вот каково это — «устать»! Я уже так давно этого не чувствовала...)"
70007020-43 = "(Хотя моё тело вот-вот развалится, я чувствую, как страсть пылает во мне сильнее, чем когда-либо!)"
70007020-44 = ""
70007020-49 = "Посетители!"
70007020-50 = "Уже почти одиннадцать — время закрываться! Заканчивайте бодро и хорошего вам здорового вечера!"
70007020-51 = ""
70007020-52 = "Ох, как летит время! А мне казалось, ещё только полдень!"
70007020-53 = "*тяжело дышит* *тяжело дышит* Ага... Я... почти... не вспотела!"
70007020-54 = "Это я вам двоим! У меня всё болит уже от одного взгляда на вас! Пожалуйста, уходите!"
70007020-55 = "Хех. Какая жалость расставаться, но всё хорошее когда-нибудь заканчивается!"
70007020-56 = "Что ж, мне пора откланяться."
70007020-57 = ""
70007020-59 = ""
70007020-60 = ""
70007020-61 = ""
70007020-64 = ""
70007020-65 = "Угх..."
70007020-66 = "Такое чувство, будто всё моё тело прокрутили в стиральной машине..."
70007020-67 = "Эм..."
70007020-68 = "Что?!"
70007020-69 = "Надеюсь, это не слишком неловко прозвучит..."
70007020-70 = "Но я была рада, что сегодня вы тренировались вместе со мной."
70007020-71 = "Видите ли, я наблюдала за вами ещё с утра."
70007020-72 = "Когда наши взгляды встретились, я почувствовала ауру родственной души."
70007020-73 = "Я сразу поняла: передо мной настоящая леди, которая во всём стремится к силе и изяществу."
70007020-74 = "Простите, что так на вас смотрела! Я просто была настолько... впечатлена, что—"
70007020-75 = "И такая вежливая! В этом жестоком, бессердечном мире редко встретишь подобное!"
70007020-76 = "В-Вы слишком добры!"
70007020-77 = "Хи-хи. Какая прелесть. Как мило!"
70007020-78 = ""
70007020-80 = ""
70007020-81 = ""
70007020-82 = "Ой, уже столько времени!"
70007020-83 = "Мне нужно разрубить нескольких бандиток в шлемах натрое. Долг зовёт!"
70007020-84 = "Прошу простить мою невежливость, но я вынуждена удалиться."
70007020-85 = "Разрубить на три части... Конечно! Обычная тренировка."
70007020-86 = "Не знала, что персональные тренеры работают так допоздна. Вот это усердие!"
70007020-87 = "...?"
70007020-88 = "Простите. Я всего лишь хотела представиться..."
70007020-89 = "Я Отохана Сумирэ, президент Клуба спортивной подготовки Миллениум!"
70007020-90 = "...А я всё это время вела себя так невоспитанно! Даже не назвала своё имя!"
70007020-91 = "Я Акэми из семьи Курихама. Рада была познакомиться, госпожа Сумирэ."
70007020-92 = ""
70007020-94 = ""
70007020-95 = "Как... грубо. Эти люди вечно куда-то спешат!"
70007020-96 = "Какая жалость расставаться после такой чудесной встречи."
70007020-97 = "И всё же... спасибо, что составили мне компанию на кардиотренировке. Часы пролетели совершенно незаметно!"
70007020-98 = "Мир тесен. Пусть судьба ещё сведёт нас однажды!"
70007020-99 = ""
70007020-101 = ""
70007020-102 = "Она была такой... здоровой! И не только телом — какой у неё позитивный настрой!"
70007020-103 = "И всё это только потому, что меня заставили сменить спортзал."
70007020-104 = "Какое благословение — случайно встретить такого человека."
70007020-105 = ""
70007020-107 = ""
70007020-108 = "Ч-Что...?"
70007020-109 = ""
70007020-110 = "Какая жалость расставаться после такой чудесной встречи."
70007020-111 = ""
70007020-112 = "Так она и сказала..."
70007020-113 = ""
70007020-114 = "И всё же... спасибо, что составили мне компанию на кардиотренировке. Часы пролетели совершенно незаметно!"
70007020-115 = ""
70007020-116 = ""
70007020-117 = "Мы семнадцать часов тягали железо, а для неё всё это было просто кардио!"
70007020-119 = "...Вот, значит, как всё прошло в другом спортзале."
70007020-120 = "Это было... одновременно ужасающе и невероятно вдохновляюще..."
70007020-121 = "Сумирэ, ты уверена, что тебе не привиделась эта тренировка в кошмарном бреду?"
70007020-122 = "Она должна быть невероятной, раз сумела вымотать даже ТЕБЯ."
70007020-123 = "Я не вымоталась."
70007020-124 = "Просто получила... больше стимуляции, Рэй."
70007020-125 = "...Ну конечно. Так как её там звали? Из какой она школы?"
70007020-126 = "«Курихама Акэми». Она не учится здесь."
70007020-127 = "Курихама... Акэ...ми..."
70007020-128 = "А?"
70007020-129 = ""
70007020-131 = ""
70007020-132 = "Я никогда не видела её ни в одном бейсбольном составе..."
70007020-133 = "Я и не говорила, что она бейсболистка!"
70007020-134 = "Неважно. Это ты даже номер у неё взять не смогла."
70007020-135 = "Рэй, мы с ней «родственные души». Мы уже выше таких вещей... хотя нам ещё столько предстоит узнать друг о друге..."
70007020-136 = "Не волнуйся. Настолько родственные души просто обречены встретиться снова."
70007020-137 = ""
70007020-139 = ""
70007020-140 = ""
70007020-141 = "Позову тебя в следующий раз, когда найду её, Рэй. Уверена, она сможет сделать из тебя звезду бейсбола."
70007020-142 = "С-Сумирэ? Но я же только вернулась с тренировки!"
70007020-143 = "Сумирэ?"
70007020-144 = ""
70007020-146 = ""
70007020-149 = "Сумирэ!"
70007020-150 = "Случайная встреча"
