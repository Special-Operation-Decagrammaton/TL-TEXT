[translation]
1010605-1 = "При ближайшем рассмотрении"
1010605-2 = "Я ждал Сакурако в месте, где мы договорились встретиться."
1010605-3 = "...Вы рано, Сенсей."
1010605-4 = ""
1010605-7 = "Удивительно. Уже довольно давно вы не предлагали встретиться здесь..."
1010605-8 = "А, я вовсе не против. Наоборот, сама мысль о том, что мы вот так проведём время вместе, даже придаёт мне сил."
1010605-9 = "...Хм? Что такое...?"
1010605-10 = "А, вам интересно, почему я до сих пор в этом костюме, хотя сегодня у меня выходной?"
1010605-11 = "Прошу прощения. Возникло недоразумение."
1010605-12 = "К сожалению, сегодня у меня нет полностью свободного графика. Скорее, просто появилось немного свободного времени."
1010605-13 = "Возможно, мне даже придётся уйти раньше вас, хотя вы пожертвовали частью своего драгоценного отдыха ради встречи со мной."
1010605-14 = "Хм?"
1010605-15 = "Мне не нужно об этом беспокоиться? Что вы...?"
1010605-16 = "[s1] «Может, немного прогуляемся?»\n[s2] «Моё дело здесь тоже много времени не займёт.»"
1010605-19 = "Что...? Что это значит?"
1010605-20 = "П-Понятно. Полагаю, у вашего безумия есть свой метод, Сенсей."
1010605-21 = "Идём, Сенсей. Я полагаюсь на вас."
1010605-22 = "[s3] «Уверен, тебе тоже понравится.»\n[s4] Двинуться с места."
1010605-28 = "...Эм... Сенсей?"
1010605-29 = "Не хочу выражать сомнение, но если можно..."
1010605-30 = "Не могли бы вы сказать, куда мы направляемся?"
1010605-31 = "[s5] «Мы почти пришли.»\n[s6] «Вон там.»"
1010605-34 = "...?"
1010605-35 = "Сюда... вы имеете в виду?"
1010605-36 = "Разве у вас не было конкретного места назначения? Мы стоим посреди улицы."
1010605-37 = "Хм? Позади меня...?"
1010605-38 = "Обернуться? ...На другую сторону... улицы?"
1010605-39 = "О чём вы..."
1010605-40 = "...?"
1010605-41 = "...А?"
1010605-43 = "...?!"
1010605-46 = "― [log=사쿠라코 아이돌]Э-Это...?![/log][wa:1030]"
1010605-48 = "― [log=사쿠라코 아이돌]Ч-Что это...?! [/log][wa:1290]"
1010605-51 = "― [log=사쿠라코 아이돌]Мой... плакат?[/log][wa:2280]"
1010605-53 = "― [log=사쿠라코 아이돌]Я-я и сама это вижу...! [/log][wa:300]"
1010605-56 = "[ns7] «Сёстры попросили меня помочь им его сделать.»\n[ns8] «Я только выбрал фотографию и место.»"
1010605-59 = "― [log=사쿠라코 아이돌]Вы вместе с остальными сёстрами...?[/log][wa:2140]"
1010605-61 = "― [log=사쿠라코 아이돌]Что... Что мне вообще сказать...?[/log][wa:1400]"
1010605-64 = "[ns9] «...Сакурако?»\n[ns10] «Ты удивлена?»"
1010605-67 = "― [log=사쿠라코 아이돌]Я лишь хотела... Нет, простите. [/log][wa:3040]"
1010605-68 = "― [log=사쿠라코 아이돌]Я не хотела, чтобы это прозвучало как критика...[/log][wa:790]"
1010605-71 = "― [log=사쿠라코 아이돌]Просто мне трудно подобрать слова... [/log][wa:980]"
1010605-74 = "― [log=사쿠라코 아이돌]Однако да... Одно я могу сказать совершенно точно.[/log][wa:4360]"
1010605-77 = "― [log=사쿠라코 아이돌]Правда... От всего сердца,[/log][wa:1220]"
1010605-79 = "― [log=사쿠라코 아이돌]я очень, очень благодарна.[/log][wa:480]"
1010605-82 = "Серьёзно, я даже представить такого не могла. Чтобы что-то подобное..."
1010605-83 = "Я всегда считала, что остальные ощущают между нами некую стену."
1010605-84 = "Вообще-то... если подумать, в последнее время произошло довольно много всего."
1010605-85 = "Возможно, только я одна продолжала упрямо цепляться за эти мысли."
1010605-86 = "[s11] «Это плоды твоего тяжёлого труда, Сакурако.»\n[s12] «Все знают, что ты хороший человек.»"
1010605-89 = "...Вот как? Мне очень приятно это слышать."
1010605-90 = "Я была уверена... что все видят во мне просто странную руководительницу. Хи-хи."
1010605-91 = "[s13] «(Ну, в какой-то степени это правда...)»\n[s14] «Но это уже совсем другой вопрос...»"
1010605-94 = "Конечно, эти события не обязательно создали что-то новое... скорее, они просто помогли мне заметить то, чего я раньше не осознавала."
1010605-95 = "Как бы то ни было, вероятно, всё это стало возможным благодаря этому мероприятию... и этому костюму."
1010605-96 = "...Я рада, что решилась."
1010605-97 = "...Да."
1010605-98 = "Я очень рада, что набралась смелости записаться."
1010605-99 = ""
1010605-101 = ""
1010605-102 = "И всё же... мне кажется, сегодня настал день проявить ещё больше смелости."
1010605-103 = "...Сенсей."
1010605-104 = "Как я уже говорила, сегодня в моём расписании есть немного свободного времени."
1010605-105 = "И на оставшуюся его часть..."
1010605-106 = ""
1010605-108 = ""
1010605-109 = "...может, мы вместе посмотрим новые образы, которые вы для меня подобрали?"
1010605-111 = "Оставшееся время нашего перерыва мы вдвоём провели за просмотром фотографий."
