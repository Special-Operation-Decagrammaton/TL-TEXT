[translation]
10008005-101 = "#video;10007"
10008005-1 = "Пролог;Конец финансового года «Решателя проблем 68»"
10008005-4 = ""
10008005-6 = "Так, все слушайте!"
10008005-7 = "У меня есть объявление."
10008005-8 = ""
10008005-10 = ""
10008005-12 = ""
10008005-14 = "Как мы все знаем, наступает новый год."
10008005-15 = "Ага. Время летит."
10008005-16 = "Без сомнений. Если оглянуться назад, за прошлый год произошло очень многое."
10008005-17 = "Были моменты счастья, боли, грусти и даже сожаления."
10008005-18 = "Мне кажется или болезненных моментов было заметно больше всего остального?"
10008005-19 = "..."
10008005-20 = "В-В любом случае! Главное, что мы преодолели все трудности и всё ещё стоим на ногах. Пора встречать новый год!"
10008005-21 = "Поэтому я и предложила сходить куда-нибудь в особенное место, чтобы отпраздновать."
10008005-22 = "И-И куда же...?"
10008005-23 = "Учитывая, что ты заставила нас нарядиться и потащила сюда на рассвете, наверняка на какое-то новогоднее мероприятие."
10008005-24 = ""
10008005-25 = "Как всегда быстро соображаешь, Каёко, но это ещё не всё."
10008005-26 = ""
10008005-27 = "Мы идём не в какое-то обычное место. Говорят, там исполняются желания."
10008005-28 = "Е-Есть такое место?"
10008005-30 = "О-о-о. Ты, наверное, про то место, которое сейчас в трендах соцсетей."
10008005-31 = "Если оно стало популярным из-за соцсетей, у меня уже плохое предчувствие..."
10008005-32 = "Ты уверена, что это не развод? Уже звучит как какой-то рекламный трюк ради шумихи."
10008005-33 = "Ару на такие штуки всегда ведётся!"
10008005-34 = "Я-Я не говорила, что верю слухам! Мы идём туда совсем по другой причине!"
10008005-35 = "И по какой же?"
10008005-36 = "Любопытно?"
10008005-37 = "Ну, это секрет. Пока вам достаточно знать, что это поднимет наш бизнес на ещё большую высоту."
10008005-38 = "Моё плохое предчувствие только усилилось."
10008005-39 = "Кто знает, какую странную схему Ару придумала на этот раз?"
10008005-40 = "Прекратите! Хоть раз поверьте в меня!"
10008005-41 = "Ладно, неважно. Вы подготовили то, о чём я просила?"
10008005-43 = "Ну да. Ты сказала принести побольше наличных, верно?"
10008005-44 = "Я тоже. Приказ босса."
10008005-45 = "Я-Я тоже немного принесла!"
10008005-47 = "Хе-хе. Хорошо. Хорошо..."
10008005-48 = "Для нашей цели это крайне важно, так что берегите деньги."
10008005-49 = ""
10008005-51 = ""
10008005-53 = ""
10008005-54 = "Постой. Ты ведь не собираешься...?"
10008005-55 = "Ару. Только не говори, что твой план — пожелать процветания, пожертвовав все эти деньги."
10008005-56 = "Т-Теперь понятно! Мы отдадим деньги, чтобы пожелать ещё больше денег!"
10008005-58 = "Ч-Что?! Нет! Не думайте, что я придумала бы что-то настолько тупое!"
10008005-60 = "Фух. Точно?"
10008005-61 = "*вздыхает*"
10008005-63 = "Дело в том, что на этом мероприятии будет целая куча магнатов преступного мира!"
10008005-64 = "А кто такие магнаты?"
10008005-65 = "Ну знаешь. Всякие крупные шишки преступного мира: из банд, преступных синдикатов, компаний по отмыванию денег... В общем, злодеи отовсюду собираются в одном месте, прикрываясь Новым годом!"
10008005-66 = "Подумайте сами. Они что, идут туда просто загадать новогодние желания и поздороваться друг с другом?"
10008005-67 = "Конечно нет! Только дурак так подумает! Они собираются, чтобы оценить перспективы нового финансового года!"
10008005-68 = "И как они собираются это делать?"
10008005-69 = "Просто. Смотрят, сколько денег жертвуют остальные участники, насколько дорогая на них одежда и так далее. По сути это арена, где самые хваткие из хватких оценивают друг друга, чтобы получить преимущество над конкурентами."
10008005-70 = "Они прикинут возможности друг друга и затем составят планы на новый финансовый год!"
10008005-71 = "Так что если какой-нибудь бизнесмен особенно шикарно одет или делает безумно большое пожертвование, сразу понятно: денег у него хватает и иметь с ним дело выгодно!"
10008005-73 = "Кажется, я понимаю..."
10008005-74 = "Ты заставила нас арендовать эти дорогие кимоно и наскрести всю наличку, какую смогли, чтобы..."
10008005-75 = "Именно! Это наш шанс продемонстрировать преступному миру мощь Решал 68!"
10008005-76 = "Хи-хи-хи..."
10008005-77 = "Э-Это совершенно логично! Настолько гениально, что придумать такое могла только ты!"
10008005-78 = "Кажется, это называется «делать вид, пока не добьёшься успеха»."
10008005-79 = "Э-Это не притворство! Мы просто создаём имидж бренда!"
10008005-80 = "В общем, план такой: мы, как настоящие крупные шишки, бросаем в ящик для пожертвований огромную пачку налички."
10008005-81 = "И сделать это надо с таким видом, будто говоришь: «Это? Да просто карманные деньги!»"
10008005-83 = "К-Конечно! Карманные деньги!"
10008005-84 = "Неплохая идея! Я в деле!"
10008005-85 = "*вздыхает*"
10008005-87 = "Хорошо. Значит, вы все поняли моё гениальное видение."
10008005-88 = "Повторю ещё раз. Это не обычное новогоднее мероприятие."
10008005-89 = "Считайте это битвой, которая решит будущее Решал 68. Мы вступаем на поле боя с единственной целью — оставить хорошее впечатление на коллег и конкурентов!"
10008005-91 = ""
10008005-92 = "П-Поняла!"
10008005-93 = "Ладно."
10008005-94 = "Звучит весело! Ну же, пошли!"
10008005-95 = "Я всё равно собиралась прийти и загадать новогоднее желание."
10008005-97 = "Что ж. Тогда в путь, мои дорогие Решалы 68."
10008005-98 = "На празднование Нового года!"