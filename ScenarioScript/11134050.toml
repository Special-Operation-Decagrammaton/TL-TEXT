[translation]
11134050-1 = "#Y-04"
11134050-2 = ""
11134050-3 = "Теперь, когда я осмотрелась, все носят футболки и никто не жалуется."
11134050-4 = "Я думала, Казуса устроит из-за этого истерику. Даже немного ждала этого. Жаль."
11134050-5 = "Потому что Айри сказала: «Она милая, потому что похожа на Казусу»."
11134050-6 = "...Это тут вообще ни при чём."
11134050-7 = ""
11134050-9 = ""
11134050-10 = "...Может, мне снять свою."
11134050-11 = "Почему?!"
