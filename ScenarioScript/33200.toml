[translation]
33200-1 = "Episódio 20;O Nome do Paraíso (1)"
33200-2 = "O centro está livre, nós vamos pelo lado oeste."
33200-3 = "Entendido!"
33200-4 = "...Eu também vou ajudar."
33200-5 = "Hasumi-san...!"
33200-6 = "Chinatsu-san, não lutamos lado a lado assim desde aquela época, não é?"
33200-7 = "Ihihihihi..."
33200-8 = "Argh, até a Presidente do Comitê de Justiça..."
33200-13 = "...Entendido, conto com vocês."
33200-14 = "Ora, ora, Chefezinha do Comitê Disciplinar. Nós também vamos ajudar~."
33200-15 = "A vice-presidente de Abydos...!"
33200-16 = "Opa, opa, assim eu fico triste. É \"Hoshino\". A gente já se viu outro dia, então este tiozão ficaria feliz se você lembrasse!"
33200-17 = "Diz a Hoshino-senpai, que tá chamando ela de \"Chefezinha do Comitê Disciplinar\". Você por acaso lembra o nome dela direito?"
33200-18 = "Imagina, que isso... ééé, hmmm..."
33200-19 = "...Chega de conversa."
33200-21 = "Vamos."
33200-22 = "Entendido!"
