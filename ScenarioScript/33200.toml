[translation]
33200-1 = "Эпизод 20;Имя рая, часть 1"
33200-2 = "Центральный путь свободен. Сосредоточьте усилия на западе!"
33200-3 = "Поняла!"
33200-4 = "Позвольте нам помочь."
33200-5 = "Хасуми!"
33200-6 = "Давно не сражались бок о бок, Чинацу. В последний раз это было, когда мы помогали Сенсею вернуть здание Шале."
33200-7 = "Ке-ке-ке..."
33200-8 = "С-Серьёзно? Похоже, даже председатель Отряда правосудия решила присоединиться."
33200-9 = ""
33200-11 = ""
33200-13 = "Понятно. Помогайте."
33200-14 = "Эй, госпожа глава Дисциплинарного комитета! Мы тоже в деле."
33200-15 = "З-Заместитель председателя студсовета Абидоса..."
33200-16 = "Да ладно тебе. Ты должна помнить, что меня зовут Хошино. Когда меня называют титулами, я чувствую себя ещё старше, чем уже есть!"
33200-17 = "Ты сама начала, назвав её по должности. Ты вообще помнишь ЕЁ имя?"
33200-18 = "Эм, ну... понимаешь, в моём возрасте..."
33200-19 = "Хватит болтать."
33200-21 = "Пойдёмте."
33200-22 = "Есть!"
