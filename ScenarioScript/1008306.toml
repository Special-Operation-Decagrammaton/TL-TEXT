[translation]
1008306-1 = "С открытым сердцем"
1008306-6 = "[ns] «Ну вот, я в регуляторном офисе Хяккарёран!»"
1008306-11 = "«По прибытии пройдите в кладовую в задней части здания.»"
1008306-13 = "[ns] «Хм. Я даже не знал, что там вообще есть комната.»"
1008306-16 = "Вскоре мне удалось найти место, о котором говорила Кикё, в задней части клубной комнаты Хяккарёран."
1008306-17 = ""
1008306-20 = "[ns] «Я вхожу, Кикё.»"
1008306-21 = ""
1008306-27 = "― [log=키쿄]Вы пришли, Сенсей.[/log][wa:1460]"
1008306-29 = "― [log=키쿄]Вы выглядите весьма озадаченным.[/log][wa:710]"
1008306-32 = "[ns] «Я никогда не видел тебя такой расслабленной.»"
1008306-33 = "― [log=키쿄]Ну... Один человек как-то сказал мне то же самое.[/log][wa:1120]"
1008306-36 = "― [log=키쿄]Находить время для отдыха жизненно важно.[/log][wa:1130]"
1008306-38 = "― [log=키쿄]Возможно, даже важнее, чем я осознавала.[/log][wa:1680]"
1008306-41 = "― [log=키쿄]Ха. Хороший офицер[/log][wa:1620]"
1008306-43 = "― [log=키쿄]не станет так легко отмахиваться от хорошего совета других.[/log][wa:10]"
1008306-46 = "― [log=키쿄]Подойдите, взгляните. Здесь много книг,[/log][wa:1280]"
1008306-48 = "― [log=키쿄]которые я хотела бы вам порекомендовать, Сенсей.[/log]"
1008306-51 = "― [log=키쿄]Однако прежде всего...[/log][wa:10]"
1008306-53 = "― [log=키쿄]Прошу помочь мне с уборкой. И принести чашку зелёного чая.[/log][wa:1100]"
1008306-56 = "― [log=키쿄]Разве не вы сами сказали?[/log][wa:10]"
1008306-58 = "― [log=키쿄]Что будете заботиться обо мне.[/log]"
1008306-61 = "[ns] «Сказал. И я сдержу это обещание, Кикё!»"
1008306-62 = "― [log=키쿄]Полагаю... в этом и заключается суть вашего характера.[/log][wa:1120]"
1008306-64 = "― [log=키쿄]Впрочем, это я и так уже знала.[/log]"
1008306-67 = "― [log=키쿄]В конечном счёте это неважно.[/log]"
1008306-69 = "― [log=키쿄]Я не из тех, кто упускает редкую возможность.[/log][wa:1890]"
1008306-72 = "― [log=]Я постараюсь стать вашим самым избалованным студентом,[/log]"
1008306-74 = "― [log=키쿄]так что вам лучше приготовиться... Ха.[/log][wa:910]"
1008306-77 = "Мне понравился день, проведённый с такой Кикё. Выражение её лица казалось мягче обычного."
