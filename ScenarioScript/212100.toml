212100-41 = "Ah――"
212100-42 = "......A Shoko-chan parece que tá pensando bem diferente da gente."
212100-43 = ""
212100-46 = ""
212100-47 = "Até dentro do Comitê de Disciplina as opiniões se racharam ao meio, né......"
212100-48 = "[s] \"Muito obrigado a todas por comparecerem mesmo nessa situação crítica.\""
212100-50 = "(Expliquei detalhadamente tudo o que tínhamos descoberto)"
212100-53 = ""
212100-54 = "Lavagem cerebral...... uma monstruosidade dessas é possível......?"
212100-55 = "Foi por isso que as alunas do 3º ano mudaram da água pro vinho......?"
212100-57 = "Esse tal de Projeto NK-Ultra realmente existiu?! Por quê? Pra que inventaram isso?!"
212100-58 = "[s1] \"Sei que é muita informação e que assusta.\"\n[s2] \"Mas nós precisamos impedir isso a todo custo.\""
212100-61 = "Sim, com certeza."
212100-62 = "E tem como desfazer essa lavagem cerebral?"
212100-63 = "Quanto a isso...... ainda está sendo pesquisado."
212100-64 = "......Será que dá certo?"
212100-65 = "Mesmo sem conhecer o princípio exato, soube que não é um feito impossível."
212100-66 = "E se a gente não conseguir quebrar o transe......?"
212100-67 = "......"
212100-68 = "Eu me recuso a deixar as coisas seguirem esse rumo e ver Kivotos inteira virar Gehenna!"
212100-69 = "Isso não é uma Gehenna de dar orgulho pra ninguém!"
212100-70 = "A Gehenna que eu queria construir era uma escola altiva, digna, onde a gente pudesse andar de cabeça erguida sem vergonha!#nNão um covil de valentões pisoteando os outros!"
212100-71 = "Por mais forte que ela seja, eu NUNCA aceitaria uma porcaria dessas!"
212100-72 = "Falou e disse! Nossas armas não servem pra sair fuzilando inocente por aí!"
212100-73 = "......É, não desgosto dessa atitude."
212100-74 = "Eu também concordo plenamente com as palavras da líder Mayumi."
212100-75 = "Nós entramos para o Comitê de Disciplina para resguardar a linha que jamais deve ser ultrapassada."
212100-76 = "Essa linha nem sempre vem escrita em regulamentos.#nÀs vezes, é nossa obrigação moral discernir e traçá-la com as próprias mãos."
212100-77 = "E esse momento é agora. Mesmo que quem tente cruzar a linha seja a própria Gehenna, nós nos manteremos firmes."
212100-78 = "......Mesmo que tenhamos que enfrentar as nossas próprias veteranas."
212100-79 = "Presidente Hina...... Diretora Ako......"
