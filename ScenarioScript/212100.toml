[translation]
212100-1 = "Эпизод 10;Сопротивление"
212100-3 = ""
212100-4 = ""
212100-6 = ""
212100-7 = "[ns] «Полагаю, вы уже знакомы?»"
212100-9 = "...Серьёзно? ВОТ наша команда...?"
212100-11 = "То есть «объединить силы» означает работать с... Префектурой и Пандемониумом...?"
212100-12 = "Погодите-ка! С чего нам им доверять?"
212100-13 = "Это ведь их старшие всё и устроили."
212100-15 = "О-о! Резко, прямо, но в самую точку...!"
212100-16 = "Эй, Лига наследия. Ну и наглость у вас такое говорить."
212100-17 = "Вы сами ничуть не менее подозрительны."
212100-18 = "Правда? А что с нами не так, Иори?"
212100-19 = "Разве это не вы постоянно трещали о «славной Геенне»?"
212100-20 = "После всего случившегося как поверить, что вы тут ни при чём?"
212100-21 = "Эй! Мы не хотели, чтобы так вышло, и ничего этого не устраивали!"
212100-22 = "Прошу всех успокоиться."
212100-23 = ""
212100-25 = ""
212100-26 = ""
212100-27 = ""
212100-28 = "Сенсей поговорил с каждым из нас и собрал нас здесь."
212100-29 = "Уже одно это должно служить достаточной гарантией."
212100-30 = "...Хм."
212100-32 = "...Это правда."
212100-34 = "Сенсей... Вы пользуетесь огромным доверием. И, думаю, всем нам понятно почему..."
212100-35 = "Главное, мы все понимаем, что происходит в Геенне, и собрались здесь, чтобы это остановить."
212100-36 = "Кстати... Разве с вами не был ещё один человек?"
212100-37 = ""
212100-40 = ""
212100-41 = "Ах..."
212100-42 = "...У Шоуко возникли... разногласия."
212100-43 = ""
212100-46 = ""
212100-47 = "Хм... Ну, в Префектуре тоже раскол."
212100-48 = "[s] «Знаю, вы все заняты. Спасибо, что пришли»."
212100-50 = "Я подробно объяснил ситуацию и её неожиданную причину."
212100-53 = ""
212100-54 = "...Промывание мозгов...? Так такое и правда бывает...?"
212100-55 = "Поэтому студенты третьего курса так сильно изменились...?"
212100-57 = "П-погодите. «НК Ультра» существует на самом деле?! Что? Как? Почему?!"
212100-58 = "[s1] «Знаю, вы все растеряны...»\n[s2] «Но мы должны как-то с этим справиться»."
212100-61 = "Да. Безусловно."
212100-62 = "Кстати, а как... «отмыть» мозги обратно?"
212100-63 = "Мы... как раз это выясняем."
212100-64 = "...Это вообще возможно?"
212100-65 = "Я не знаю точного механизма, но не стала бы утверждать, что это НЕВОЗМОЖНО."
212100-66 = "А если нам не удастся это исправить?"
212100-67 = "..."
212100-68 = "Я не могу поддерживать нынешнюю Геенну, даже если мы завоюем весь Кивотос!"
212100-69 = "Такой академией невозможно гордиться!"
212100-70 = "Я хотела создать Геенну, за которую не было бы стыдно ни перед кем, а не академию, которая подминает всех под себя «кровью и железом»!"
212100-71 = "Какой бы сильной и «славной» мы ни стали, это всё равно недопустимо!"
212100-72 = "Яха! Точно! То, что у нас есть оружие, ещё не значит, что можно палить во все стороны!"
212100-73 = "А у тебя есть характер... Мне нравится."
212100-74 = "Я согласна с председателем Маюми."
212100-75 = "Мы с Иори вступили в Префектуру, чтобы охранять границу, которую нельзя переступать."
212100-76 = "Но эта граница далеко не всегда очевидна, поэтому приходится полагаться на собственное суждение."
212100-77 = "Верно. И если сама Геенна решит её перейти, я остановлю её, даже если придётся сражаться до конца."
212100-78 = "Даже из последних сил, истекая кровью, я буду кричать, чтобы эту черту не переступали."
212100-79 = "...Глава Префектуры и старший администратор..."
212100-80 = ""
212100-84 = ""
212100-86 = ""
212100-87 = ""
212100-90 = ""
212100-91 = "Эврика, дамы! Я нашла зацепку!"
212100-92 = ""
212100-95 = "Кто-то из Пандемониума?!"
212100-96 = "Погодите, разве она не на третьем курсе?"
212100-98 = "А, я знала, что пригласили всех, но... не думала, что все придут вовремя."
212100-99 = "Разве все третьекурсники не стали вести себя странно?"
212100-100 = "Нет, Сацуки всегда такая. Как я уже говорила, у неё иммунитет. Наверное, потому, что она исследовала «НК Ультра»."
212100-101 = "...Понятно. Извините, она меня напугала."
212100-102 = ""
212100-104 = ""
212100-106 = ""
212100-107 = "Хм, значит, Чиаки тоже примкнула к сопротивлению..."
212100-108 = "Именно! Не могла же я просто смотреть, как ведёт себя Макото."
212100-109 = "Но не ожидала увидеть Сацуки на нашей стороне! Какой сюрприз!"
212100-110 = "«На нашей стороне»... Пожалуй, удачно сказано."
212100-111 = ""
212100-113 = ""
212100-114 = "Постойте... Вы оставили Ибуки одну?"
212100-115 = "..."
212100-116 = "Ну... Ибуки ещё слишком мала для такого."
212100-117 = "К тому же здесь ей было бы опаснее. Мы ведь теперь «Клуб предателей», верно?"
212100-119 = "«Предателей»..."
212100-121 = "Возможно, Ибуки лучше ничего не знать."
212100-122 = "Сацуки, ты говорила, что нашла зацепку?"
212100-123 = "А, точно. Фу-фу."
212100-124 = "[s] «Что ты нашла, Сацуки?»"
212100-125 = "Я исследовала понятие «частоты» и пришла к одному открытию. А теперь слушайте внимательно!"
212100-126 = "Всем ведь известно, что нейронная сеть каждого человека обладает собственной уникальной резонансной частотой?"
212100-127 = "...Нет? По крайней мере, мне это неизвестно."
212100-128 = "А. Тогда позвольте объяснить."
212100-129 = "Предположим, настоящий проект «НК Ультра», тот самый, в котором Император-тиран промывала людям мозги, принудительно синхронизировал индивидуальную частоту мозга с внешним сигналом."
212100-130 = "А теперь задумайтесь вот над чем."
212100-131 = "Если мозговые волны человека насильно зафиксировали в определённом состоянии, можно ли отменить воздействие, вызвав их разрушительную интерференцию?"
212100-132 = "...Эм... Что, прости?"
212100-133 = "Теоретически возможно! Именно так!"
212100-134 = "Но есть одна серьёзная проблема."
212100-135 = "Для этого нам нужно выяснить точную частоту, которую использовали для промывания мозгов..."
212100-136 = "Вот только я не знаю, как её найти. Не можем же мы попросить виновника ещё раз захватить чей-нибудь разум..."
212100-137 = "...Ничего себе, Сацуки! Почти ничего не поняла, но, кажется, у меня есть догадка!"
212100-138 = "Просвети нас, Чиаки."
212100-139 = "А разве ответ не в радиорубке?"
212100-140 = ""
212100-142 = ""
212100-143 = "Речь Макото ведь передавали через новое оборудование радиорубки?"
212100-144 = "А ещё из динамиков, или оборудования, или откуда-то ещё доносились странные звуки и слова..."
212100-145 = "Может, если обыскать радиорубку, мы что-нибудь найдём..."
212100-146 = ""
212100-148 = "..."
212100-149 = "Ой, я что-то не то сказала?"
212100-151 = "Нет! Вовсе нет, Чиаки! Как я сама до этого не додумалась?!"
212100-153 = "Ты очень метко подметила, Чиаки...!"
212100-154 = "А-ха, ну... Журналистское чутьё."
212100-155 = "Значит, стоит нам попасть в радиорубку, и мы сможем всё исправить?!"
212100-156 = "Пока не доберёмся, ничего нельзя обещать. Но анализ оборудования хотя бы даст нам зацепку."
212100-157 = "Мне понадобится устройство для выделения несущих частот и..."
212100-163 = "[ns] «Кажется, у нас есть шанс...!»"
212100-165 = "Выводы делать было рано, но я невольно почувствовал проблеск надежды..."
212100-167 = "Следующий эпизод;Я хочу быть рядом с тобой"
