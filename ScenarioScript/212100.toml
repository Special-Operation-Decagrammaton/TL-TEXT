[translation]
212100-1 = "Episode 10;Resistance Formed"
212100-7 = "[ns] \"We all know each other, right?\""
212100-9 = "……Are you serious about this combination?"
212100-11 = "Joining forces... between the Prefect Team and Pandemonium Society?"
212100-12 = "Wait, wait! Can we really trust them?"
212100-13 = "The ones at the center of this problem are their seniors, aren't they?"
212100-15 = "That's a blunt way to put it, but I can't argue with that...!"
212100-16 = "Hey, Gehenna Re-establishment Committee, watch your tone."
212100-17 = "Besides, you guys are just as suspicious, aren't you?"
212100-18 = "Oh? And what exactly is suspicious about us?"
212100-19 = "You were always saying it, weren't you? 'A Gehenna united as one.'"
212100-20 = "You can't tell me you're unrelated to this situation."
212100-21 = "Th-that, we don't know either...! We never wanted anything like this!!"
212100-22 = "Everyone, please calm down."
212100-28 = "The only people here are the students Sensei has gathered."
212100-29 = "Isn't that reason enough to trust them?"
212100-30 = "Hmph……."
212100-32 = "……Well, I suppose that's true."
212100-34 = "As expected of Sensei. You have their deep trust. ……Well, I agree with you as well."
212100-35 = "Regardless, those who feel there is a problem with the current situation have gathered here. That is what it comes down to."
212100-36 = "Actually…… you guys, wasn't there one more person?"
212100-41 = "Ah—"
212100-42 = "……It seems Shouko-chan has a different opinion."
212100-47 = "I mean, even within the Prefect Team, opinions are divided……."
212100-48 = "[s] \"Thank you all for coming despite the difficult circumstances.\""
212100-50 = "(Explained everything that is currently known)"
212100-54 = "Brainwashing…… is that even possible……?"
212100-55 = "Is that the reason the third-years changed, too……?"
212100-57 = "Was NK-Ultra actually real!? Why? For what purpose?"
212100-58 = "[s1] \"I know this is sudden and confusing.\"\n[s2] \"But we have to stop it, no matter what.\""
212100-61 = "Yes, we will."
212100-62 = "Is there a way to undo the brainwashing?"
212100-63 = "That is…… currently being researched separately."
212100-64 = "……Is it even possible?"
212100-65 = "I've heard that even if the principles are unknown, it is not entirely impossible."
212100-66 = "What if the brainwashing can't be undone……?"
212100-67 = "……."
212100-68 = "If things keep going this way and all of Kivotos becomes Gehenna, I don't want that!"
212100-69 = "That's not a Gehenna I could ever be proud of!"
212100-70 = "The Gehenna I wanted to build was one where we could always stand tall and have nothing to be ashamed of. It wasn't meant to be one that tramples over others!"
212100-71 = "No matter how strong it is, I absolutely hate that!"
212100-72 = "Yeah! Exactly! Our guns aren't for shooting just anyone!"
212100-73 = "……I don't hate that sentiment."
212100-74 = "I also agree with what Committee Chair Mayumi said."
212100-75 = "We joined the Prefect Team to protect the lines that must not be crossed."
212100-76 = "Those lines aren't necessarily written down anywhere. I believe that sometimes, you have to judge for yourself."
212100-77 = "Now is that time. Even if it's Gehenna itself trying to cross that line, I will stand my ground."
212100-78 = "……Even if the ones on the other side are our own people."
212100-79 = "Committee Chair…… Administrative Officer……."
212100-91 = "I found a clue!"
212100-95 = "Whoa, a member of the Pandemonium Society!!"
212100-96 = "Hey, isn't this person a third-year?"
212100-98 = "Oh my, you're all here too. I heard you were being called, but still."
212100-99 = "Weren't we told that all the third-years had gone crazy?"
212100-100 = "Satsuki-senpai is an exception. I told you earlier, didn't I? She was researching NK-Ultra."
212100-101 = "Oh, right. You startled me."
212100-107 = "Hmm, so Chiaki came too."
212100-108 = "Yes! Even though Makoto-senpai ended up like that, I couldn't just sit still!"
212100-109 = "I didn't expect Satsuki-senpai to be on this side, though!"
212100-110 = "This side or that side…… that might not be an incorrect way to put it."
212100-114 = "So, where is Ibuki right now?"
212100-115 = "……."
212100-116 = "She's still too young to be brought here, after all."
212100-117 = "Since this is the 'Rebel Club,' as it were."
212100-119 = "Rebels, you say……."
212100-121 = "Perhaps it's better if Ibuki remains unaware of everything."
212100-122 = "……Anyway, didn't Satsuki-senpai say you found a clue?"
212100-123 = "Ah, yes, that's right. Fufu. Prepare to be surprised."
212100-124 = "[s] \"Did you find something?\""
212100-125 = "Yes. Listen closely from here on out."
212100-126 = "Every human neural network has its own unique resonant frequency. You know that, right?"
212100-127 = "No, not at all."
212100-128 = "I see…… well, it doesn't matter if you don't."
212100-129 = "The true NK-Ultra project—in other words, the Thunder Emperor's brainwashing—I hypothesized that it forcibly synchronized these natural frequencies with an external one."
212100-130 = "If that's the case, one hypothesis emerges."
212100-131 = "If they are forcing brain waves into a specific state, could we potentially undo that fixation through wave cancellation?"
212100-132 = "……Uh, excuse me, what?"
212100-133 = "It's possible! Theoretically, at least!"
212100-134 = "But the real problem starts here."
212100-135 = "This method requires knowing the exact frequency used for the brainwashing as a prerequisite."
212100-136 = "The problem is how to determine it. It's not like we can just ask them to brainwash us again."
212100-137 = "……Ah. I didn't understand most of what you said, but I might have a lead on that last part!"
212100-138 = "Do tell."
212100-139 = "Couldn't that be in the broadcasting room?"
212100-143 = "Makoto-senpai used the equipment in the broadcasting room for her speeches."
212100-144 = "Maybe the noise or the strange words that were playing the whole time are the same?"
212100-145 = "If we search the broadcasting room, maybe we'll find something……."
212100-148 = "……."
212100-149 = "Ah, was that completely off the mark?"
212100-151 = "No, it's the opposite! That's a huge breakthrough! Why didn't I think of that?"
212100-153 = "I think that's a very sharp observation."
212100-154 = "Haha, I guess that's my reporter's intuition at work."
212100-155 = "So if we go to the broadcasting room, can we fix this!?"
212100-156 = "I can't say for sure yet, but if we can analyze the equipment used, we should be able to find a clue."
212100-157 = "To do that, we need a device capable of extracting the carrier wave, and—"
212100-163 = "[ns] \"It feels like this might actually work……!\""
212100-165 = "(Optimism is forbidden, but I felt as though a small hope had sprouted……)"
212100-167 = "Next Episode;I Want to Stay by Your Side"