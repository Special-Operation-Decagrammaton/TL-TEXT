212100-27 = ""
212100-28 = "Todas as presentes nesta sala foram reunidas pelo próprio Sensei."
212100-29 = "Acredito que isso seja motivo mais do que suficiente para confiarmos umas nas outras."
212100-30 = "Humph......"
212100-32 = "......É, pensando por esse lado, tem razão."
212100-34 = "Como esperado do nosso Sensei: confiança inabalável. Bem, compartilho do mesmo parecer."
212100-35 = "Em todo caso, quem está aqui é porque enxerga o absurdo da situação. É isso que nos une."
212100-36 = "Aliás...... vocês não tinham uma terceira integrante no grupo?"
