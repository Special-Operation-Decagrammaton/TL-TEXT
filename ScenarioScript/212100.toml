212100-95 = "Eita, a parlamentar da Pandemonium!!"
212100-96 = "Ué, mas essa garota aí não é do 3º ano?!"
212100-98 = "Ora, vocês também vieram? Disseram que vocês viriam, afinal."
212100-99 = "Não tinham dito que todo o 3º ano tinha enlouquecido?!"
212100-100 = "A Satsuki-senpai é exceção à regra. Lembra que expliquei que ela pesquisava o NK-Ultra?"
212100-101 = "Ah, é mesmo! Que susto!"
212100-102 = ""
212100-104 = ""
212100-106 = ""
212100-107 = "Ora, Chiaki, você por aqui também?"
212100-108 = "Com certezaaa! Com a Makoto-senpai naquele estado lamentável, eu não ia ficar sentada de braços cruzados!"
212100-109 = "Só não esperava encontrar a Satsuki-senpai jogando do nosso lado da cerca!"
212100-110 = "Nosso lado, outro lado...... bem, em termos práticos, acho que é uma definição justa."
212100-111 = ""
212100-113 = ""
212100-114 = "E onde está a Ibuki agora?"
212100-115 = "......"
212100-116 = "Ela é jovem demais para ser arrastada para cá, não acham?"
212100-117 = "Afinal de contas, nos tornamos o 'Clube das Rebeldes'."
212100-119 = "Rebeldes......"
212100-121 = "Talvez seja mais misericordioso que a Ibuki continue alheia a tudo isso."
212100-122 = "......Mas enfim, Satsuki-senpai, você não tinha dito que encontrou uma pista?"
212100-123 = "Ah, sim! Exatamente! Fufufu, preparem os queixos para caírem."
212100-124 = "[s] \"Descobriu alguma coisa concreta?\""
212100-125 = "Sim. Prestem muita atenção no que vou explicar agora."
212100-126 = "A rede neural humana possui frequências de ressonância características inerentes. Vocês já devem saber disso, certo?"
212100-127 = "Não faço a mais remota ideia."
212100-128 = "Compreensível...... não faz diferença se não sabem os pormenores técnicos."
212100-129 = "O verdadeiro Projeto NK-Ultra―― a lavagem cerebral da Imperatriz do Trovão―― funcionava forçando a sincronização dessa frequência neural através de uma onda externa."
212100-130 = "Disso, surge uma hipótese brilhante:"
212100-131 = "Se as ondas cerebrais foram aprisionadas à força em um padrão fixo,#não seria possível quebrar esse bloqueio através do efeito de interferência destrutiva de ondas?"
212100-132 = "......Pera, você falou em grego agora, pode repetir?"
212100-133 = "É perfeitamente possível! Pelo menos na teoria!"
212100-134 = "Mas o verdadeiro problema começa aqui:"
212100-135 = "Esse método pressupõe que saibamos com precisão cirúrgica a frequência exata usada na lavagem cerebral."
212100-136 = "E descobrir essa frequência é o nó górdio.#nNão temos como pedir gentilmente para nos lavarem o cérebro de novo só pra gente medir."
212100-137 = "......Opa! Não entendi nem metade das palavras difíceis,#nmas acho que tenho uma resposta pra essa última pergunta!"
212100-138 = "Conte para nós, querida."
212100-139 = "Isso aí não estaria guardado lá na sala da rádio escolar?"
212100-140 = ""
212100-142 = ""
212100-143 = "O pronunciamento da Makoto-senpai foi transmitido usando os equipamentos da rádio da escola."
212100-144 = "Aquele chiado constante e as palavras esquisitas que tocaram no fundo saíram de lá também, não saíram?"
212100-145 = "Se a gente invadir a sala da rádio e revirar os consoles, com certeza achamos os registros da transmissão......"
212100-146 = ""
212100-148 = "......"
212100-149 = "Ué, falei besteira? Viajei na maionese?"
212100-151 = "Besteira nada, foi um lance de gênio absoluto! Como é que eu não pensei nisso antes?!"
212100-153 = "Um raciocínio formidável e perspicaz, Chiaki."
212100-154 = "Hahaha! Faro de jornalista que chama, né!"
212100-155 = "Então se a gente invadir a sala da rádio dá pra salvar todo mundo?!"
212100-156 = "Ainda é cedo para comemorar vitória, mas se analisarmos o maquinário usado na transmissão, teremos a frequência exata nas mãos."
212100-157 = "Para isso precisaremos de um módulo extrator de ondas portadoras e――"
212100-163 = "[ns] \"Parece que as coisas vão dar certo......!\""
212100-165 = "(O otimismo cego é perigoso, mas senti uma pequena e brilhante centelha de esperança nascer ali......)"
212100-167 = "Próximo Episódio;Quero Ficar ao Seu Lado"
