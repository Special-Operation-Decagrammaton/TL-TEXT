212100-7 = "[ns] \"Acho que todo mundo aqui já se conhece, né?\""
212100-9 = "......Vocês tão falando sério com essa escalação?"
212100-11 = "Juntar forças quer dizer... Comitê de Disciplina e Sociedade Pandemônio juntas......?"
212100-12 = "Opa, peraí, peraí! Dá pra confiar nelas mesmo?"
212100-13 = "As mandachuvas que tão causando todo esse estrago são as veteranas delas, não são?!"
212100-15 = "O tom foi ácido, mas não posso negar os fatos......!"
212100-16 = "Ei, Comitê de Restauração, mede esse linguajar antes de apontar o dedo!"
212100-17 = "Sem contar que as mais suspeitas aqui são vocês duas, sabiam?"
212100-18 = "Hãã?! Suspeitas de quê, ô sem noção?!"
212100-19 = "Vocês viviam enchendo a boca pra berrar 'Gehenna Unida' pelos corredores!"
212100-20 = "Acha que cola dizer que não tem dedo de vocês nessa lambança?!"
212100-21 = "M-Mas a gente não fazia ideia de nada disso......! Ninguém aqui queria esse horror, caramba!!"
212100-22 = "Meninas, por favor, vamos manter a calma."
