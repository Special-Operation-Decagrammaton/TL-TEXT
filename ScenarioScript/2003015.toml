[translation]
2003015-1 = "Назовём это сменой обстановки"
2003015-2 = ""
2003015-3 = "Ах, Сенсей. Сюда, пожалуйста."
2003015-4 = "[s] «Ты не устала?»"
2003015-5 = "..."
2003015-6 = "В другое время я, возможно, и чувствовала бы себя так."
2003015-7 = "Но любопытно. Усталость исчезла, как только я увидела ваше лицо."
2003015-8 = "[s] «В моём лице есть что-то любопытное?»"
2003015-9 = "Фу-фу. Разве я это сказала?"
2003015-10 = "В любом случае, Сенсей..."
2003015-11 = "Я сегодня выгляжу иначе?"
2003015-13 = "И в тот момент, когда она это сказала..."
2003015-14 = "По моей спине пробежал холодок..."
2003015-15 = "Это было словно сцена из фильма!"
2003015-16 = ""
2003015-17 = "[ns] «Н-Не знаю? Может, одежда?»"
2003015-18 = "Фу-фу. Это само собой, но слишком обобщённо."
2003015-19 = "Что-то ещё. Что-то... большее."
2003015-20 = "Хотя Харуна улыбалась, я почти физически услышал невидимого судью, объявляющего мне страйк!"
2003015-21 = ""
2003015-22 = "[ns] «Т-Т-Тогда волосы?!»"
2003015-23 = "Ранее я заходила в свой любимый салон."
2003015-24 = "Но вы всё ещё не заметили. Смотрите дальше очевидного."
2003015-25 = "И нет, дело не только в солнцезащитных очках."
2003015-26 = "Она продолжала улыбаться, а мне уже послышалось громкое: «Страйк два!»"
2003015-27 = "Фу-фу-фу..."
2003015-28 = "Я не собираюсь вас мучить, Сенсей. Мне лишь захотелось немного поиграть."
2003015-29 = "Но, если честно, я надеялась, что вы заметите..."
2003015-30 = "...Не то чтобы это было жизненно важно. Но было бы приятно, если бы вы... приятно меня удивили."
2003015-31 = "А теперь, Сенсей. Позвольте спросить ещё раз."
2003015-32 = "Я сегодня кажусь вам другой?"
2003015-33 = "Это был... последний бросок...!"
2003015-34 = ""
2003015-35 = "[ns] «О! На твоём крыле украшение!»"
2003015-36 = ""
2003015-37 = "?!?!"
2003015-38 = "[ns] «(А...?)»"
2003015-39 = "К-Как и ожидалось... Сенсей..."
2003015-40 = "Тот, кого я выбрала... сердцем..."
2003015-41 = "Это словно выбирать лучшие блюда высокой кухни..."
2003015-43 = "Что-то показалось мне серьёзным, и я спросил Харуну, всё ли с ней в порядке."
2003015-44 = "Она неестественно вздрогнула. Её улыбка дрогнула."
2003015-45 = ""
2003015-46 = "Хм..."
2003015-47 = "Я ношу разные украшения на крыле в зависимости от случая."
2003015-48 = "В обычный день я ношу подвеску с лентами."
2003015-49 = "Когда ситуация требует чуть большей официальности, я надеваю круглое сердечко."
2003015-50 = "Ни одно из этих решений не высечено в камне. Всё зависит от моего настроения и обстоятельств."
2003015-51 = "[s] «П-Понятно?»"
2003015-52 = "Да. Что-то вроде того."
2003015-53 = "А сегодня... я надела украшение в виде бабочки, которым особенно дорожу."
2003015-54 = ""
2003015-56 = ""
2003015-57 = ""
2003015-58 = "Спасибо, что заметили его, Сенсей."
2003015-59 = "[ns] «Ага...»"
2003015-60 = "Если присмотреться, эта бабочка состоит из двух соединённых половин."
2003015-61 = "Одна половина — желтушка, другая — стеклянница."
2003015-62 = "Вы знаете, что каждая из них символизирует?"
2003015-63 = "[s] «Не знаю... Расскажешь?»"
2003015-64 = "Фу-фу. Если я сама укажу вам ответ, это уменьшит радость открытия от этого изысканного гастрономического опыта. Оставим ответ лакомством на будущее."
2003015-65 = "Но, Сенсей, то, что одна половина — одна бабочка, а другая — другая, несёт ещё более глубокий смысл."
2003015-66 = "Это значит, что они пара. Вместе."
2003015-67 = "А пара бабочек символизирует..."
2003015-68 = ""
2003015-70 = ""
2003015-71 = "..."
2003015-72 = "П-Простите. Давайте сменим тему."
2003015-73 = "[s] «Что случилось, Харуна?»"
2003015-74 = "Н-Ничего! Всё в порядке."
2003015-75 = "[s] «Я не очень понимаю, но раз ты так говоришь, Харуна...»"
2003015-76 = ""
2003015-79 = "[ns1] «Кстати, ты сказала, что очень дорожишь им?»\n[ns2] «Но это стадион. Ты не боишься, что оно повредится?»"
2003015-82 = "?!?!"
2003015-83 = "Э-Это..."
2003015-84 = "Такой риск действительно вполне реален..."
2003015-85 = "Но я подумала, что здесь будет тот единственный человек, который сможет оценить его красоту."
2003015-86 = "[s] «П-Понятно?»"
2003015-87 = "...Конечно, тот человек в таких вопросах бывает немного тугодумом, так что я сомневаюсь, что он уловит подтекст."
2003015-88 = "..."
2003015-89 = "Разве это не увлекательно, Сенсей?"
2003015-90 = "Человек, который замечает изменения в мелких украшениях вроде подвесок..."
2003015-91 = "Когда дело доходит до того, чтобы заметить... то, что находится всего в шаге..."
2003015-92 = "Отказывается посмотреть на то, что прямо перед ним. Это кажется... почти намеренным."
2003015-93 = "[s] «Харуна? Ты... злишься?»"
2003015-94 = "А, н-н-нет! Ничуть! Ни капельки."
2003015-95 = "Я скорее чувствую..."
2003015-96 = "...Скорее..."
2003015-97 = "..."
2003015-98 = "Фу-фу. Ничего."
2003015-99 = "Даже эту сторону Сенсея я..."
2003015-100 = "А теперь, Сенсей. Что касается сегодняшней высокой кухни..."
2003015-101 = "Нет."
2003015-102 = "Предлагаю нам с вами провести здесь ещё немного времени вдвоём."
2003015-103 = "Я хотела бы наградить вас за то, что вы заметили моё изменение."
2003015-104 = "Раз Сенсей всегда угощает нас такими вкусными вещами, полагаю, теперь моя очередь дать вам что-нибудь вкусное взамен."
2003015-105 = "Говорят, доброта учителя безгранична, как небо."
2003015-106 = "[s3] «Такие слова от Харуны...»\n[s4] «Я так тронут, что могу расплакаться...»"
2003015-109 = "Вы довольны?"
2003015-110 = "Идёмте, я поведу вас."
2003015-111 = ""
2003015-113 = ""
2003015-114 = ""
2003015-115 = ""
2003015-116 = ""
2003015-118 = "Харуна взяла меня под руку."
2003015-119 = "Мы исследовали каждый уголок стадиона."
