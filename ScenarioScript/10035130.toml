[translation]
10035130-1 = "Послесловие;Ошибка Инженерного департамента 2"
10035130-2 = "И вот, в день тестового запуска Развлекательного Мехагатора..."
10035130-3 = ""
10035130-6 = "Корпус готов. Осталось загрузить поведенческую программу."
10035130-7 = "Ага! И топливный бак полный!"
10035130-8 = "И водяной бак тоже. Тест погружения можно начинать когда угодно!"
10035130-10 = "Отлично. Тогда загружаем программу."
10035130-11 = "Погодите, разве мы не решили, что программирование «ещё требует доработки»?"
10035130-12 = "С такими сроками компромиссы неизбежны."
10035130-13 = "Прошлой ночью я нашла в интернете подходящую поведенческую программу. Она должна нормально заполнить пробелы."
