10035130-165 = "...А, нашла проблему."
10035130-166 = "Что-то было не так с поведенческим алгоритмом?"
10035130-167 = "Судя по всему, вы собирались установить развлекательную программу, но по журналам сервера фактически загрузили алгоритм для сноса зданий."
10035130-168 = ""
10035130-170 = ""
10035130-172 = "Как ТАКОЕ вообще произошло?"
