10035130-176 = "У файла нет подписи и непонятно, откуда он вообще взялся."
10035130-177 = "Я СТОЛЬКО РАЗ говорила вам следить за безопасностью!"
10035130-178 = "Но у вас бардак с безопасностью, и теперь бардак ещё и в МАСТЕРСКОЙ."
10035130-179 = ""
10035130-181 = ""
10035130-182 = ""
10035130-183 = "Урок усвоен! Больше никаких неавторизованных программ!"
10035130-184 = "Отныне используем только подлинное сертифицированное ПО, честно купленное у надёжного продавца!"
10035130-185 = "Да! Инженерный департамент «Миллениума» призывает вас безопасно серфить интернет и ответственно скачивать файлы!"
10035130-186 = "Ба-да-ба-да-дам!"
10035130-187 = ""
10035130-190 = ""
10035130-191 = "Эй, не пытайтесь замять всё социальной рекламой!"
10035130-192 = "А теперь за уборку!"
