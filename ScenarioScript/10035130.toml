10035130-84 = ""
10035130-86 = ""
10035130-88 = ""
10035130-89 = "Вот он и ушёл, прямо сквозь стену."
10035130-90 = "Посмотрите на эту мощь, эту скорость... Он работает далеко за пределами расчётных характеристик."
10035130-91 = "И ведёт себя тоже далеко за пределами расчётов."
10035130-92 = "Что теперь делать...?"
10035130-93 = ""
10035130-97 = "Что это был за звук?! Бомба взорвалась?!"
10035130-98 = ""
10035130-100 = ""
10035130-101 = "Этот голос похож на..."
10035130-102 = ""
10035130-104 = ""
10035130-107 = ""
10035130-108 = "Я проходила мимо и услышала громкий шум, вот и зашла проверить. Ну конечно, это вы."
10035130-109 = "Почему мастерская затоплена? И что за огромная дыра в стене?"
