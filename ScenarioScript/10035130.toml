10035130-43 = "Эм, ну..."
10035130-44 = ""
10035130-50 = ""
10035130-51 = "А-а! Кофемашина с реактивным ускорителем! Я месяц над ней работала!"
10035130-52 = ""
10035130-57 = "Моя сверхзвуковая водяная ракетница!"
10035130-58 = "Ч-Что происходит? Почему он взбесился?!"
10035130-59 = "Ты! В водяной резервуар, как и запрограммировано!"
10035130-60 = ""
10035130-64 = "А?!"
10035130-65 = ""
10035130-72 = "...Он атакует резервуар!"
