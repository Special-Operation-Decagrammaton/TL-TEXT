10035130-74 = ""
10035130-79 = "Аргх!"
10035130-80 = "В-Выключите это существо!"
10035130-81 = "А-а! Никак, он слишком сильно мечется!"
10035130-82 = "Ц! Придётся использовать Громопушку!"
