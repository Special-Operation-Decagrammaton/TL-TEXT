10035130-35 = "Да, и выглядит вполне естественно. Отдать приоритет алгоритму инстинктов было мудрым решением."
10035130-36 = "Он даже хвостом виляет!"
10035130-37 = "Кстати, исследования показывают, что когда аллигатор машет хвостом, он либо угрожает атакой, либо уже собирается атаковать."
10035130-38 = ""
10035130-40 = ""
