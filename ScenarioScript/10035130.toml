10035130-145 = "Ну, теперь уже не скроешь. Пора признаться..."
10035130-152 = ""
10035130-153 = "Так ваш «Развлекательный Мехагатор» взбесился и убежал?"
10035130-154 = "Думаете, в конструкции была ошибка?"
10035130-155 = "Невозможно!"
10035130-156 = "Клянусь своей гордостью мастера! Наш механический аллигатор-флорист был собран безупречно!"
