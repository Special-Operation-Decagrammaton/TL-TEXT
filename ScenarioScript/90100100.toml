[translation]
90100100-1 = "Эпизод 10;Во тьму"
90100100-4 = "[ns1] «Жарко...»\n[ns2] «И темно...»"
90100100-7 = ""
90100100-8 = "Простите за неудобства, Сенсей."
90100100-9 = "На этой миссии мы работаем при ограниченном освещении. Необходимо сохранять полное затемнение."
90100100-10 = "Мы бы с радостью выдали вам прибор ночного видения, но запасных у нас нет."
90100100-11 = "[s3] «Ничего. Я всё ещё немного вижу.»\n[s4] «Так где мы?»"
90100100-14 = "Это подземный проход, ведущий в вентиляционную комнату станции Широ Унаги."
90100100-15 = "Здесь душно, потому что это своего рода вентиляционный канал. Он отводит тепло от соседних зданий. И, что важнее всего, должен стать хорошей приманкой."
90100100-16 = "[s] «Жару я переживу. Вам всем куда тяжелее.»"
90100100-17 = ""
90100100-20 = "[ns5] «Как кунэ-кунэ появится здесь?»\n[ns6] «Я думал, он выходит только в ясные дни.»"
90100100-23 = "Вполне понятный вопрос."
90100100-24 = "...Однако, изучив записи происшествий, я пришла к выводу, что погода, возможно, не является ключевым фактором."
90100100-25 = "Во время прошлой миссии мы заметили кое-что странное. FOX 4 увидела марево, затем кунэ-кунэ и подверглась воздействию. FOX 3, которая марево не видела, оказалась в порядке."
90100100-26 = "Если легенда о кунэ-кунэ действительно служила предупреждением о болезнях от жары, значит, мы должны суметь обнаружить его в любом достаточно жарком месте, где появляется марево."
90100100-27 = "И самое главное — здесь далеко от гражданских."
90100100-28 = "[s] «Это успокаивает.»"
90100100-29 = ""
90100100-32 = "[ns7] «Кстати, Юкино. Может, мне кажется...»\n[ns8] «Но ты очень переживаешь о возможном вреде гражданским.»"
90100100-35 = "...Возможно. Я действительно не хочу доставлять неприятности невиновным людям."
90100100-36 = "В SRT нас учат избегать решений, которые могут подвергнуть граждан опасности."
90100100-37 = ""
90100100-40 = "В конце концов, у каждой миссии есть последствия и сопутствующий ущерб."
90100100-41 = ""
90100100-44 = "А SRT состоит из специальных подразделений, отвечающих за безопасность жителей Кивотоса."
90100100-45 = "Если мы не можем гарантировать безопасность граждан, тогда наша работа теряет смысл."
90100100-46 = ""
90100100-49 = "Если отпустишь их сейчас, они вернутся, и станет ещё хуже!"
90100100-50 = "Хочешь потом жить с этим на совести? Это ТВОЯ ответственность!"
90100100-51 = ""
90100100-54 = "Мы... и так достаточно навредили гражданским. Мы не справились со своими обязанностями и не должны увеличивать свой долг перед людьми."
90100100-55 = ""
90100100-58 = "Ты просто ребёнок! Трусиха! У тебя даже смелости нет признать то, что ты натворила!"
90100100-59 = ""
90100100-60 = "...Даже если нам кажется, что наша цель благородна."
90100100-61 = ""
90100100-64 = "[ns] «(Кажется, я услышал что-то странное...)»"
90100100-66 = "[ns9] «...Хорошо.»\n[ns10] «Но что бы ни случилось, ваша безопасность важнее всего.»"
90100100-69 = "Я это учту."
90100100-70 = ""
90100100-72 = ""
90100100-73 = "Говорит FOX 2. Я прибыла в точку Чарли."
90100100-74 = "Текущая температура — 34 градуса Цельсия... Из-за темноты я плохо вижу, но чувствую, как над вентиляционными трубами поднимается марево."
90100100-75 = "Подтверждаю. Всем надеть снаряжение. НЕ смотрите на марево без защиты."
90100100-76 = "[s] «Неужели то снаряжение, о котором вы говорили вчера, это...?»"
90100100-77 = ""
90100100-79 = ""
90100100-80 = "Приборы ночного видения!"
90100100-81 = "Мы не знаем, как кунэ-кунэ околдовывает людей, но решили, что принцип может быть похож на действие моего светозащитного щитка. Он перегружает зрительный нерв."
90100100-82 = ""
90100100-84 = ""
90100100-85 = "Ладно. Но разве приборы ночного видения тоже не засвечивает светошумовой гранатой?"
90100100-86 = "Будем использовать то, что есть."
90100100-87 = "Приборы ночного видения цифровые. В них есть ограничители, поэтому при обнаружении опасного количества света они автоматически отключаются."
90100100-88 = "Но ты уверена, что всё будет нормально? Очки защитят нас от воздействия кунэ-кунэ?"
90100100-89 = "Кто-то должен набраться смелости и проверить."
90100100-90 = "Почему бы не нам."
90100100-91 = "О, забавно. Может, нас следовало назвать отрядом КАНАРЕЕК? Или ПОДОПЫТНЫХ КРОЛИКОВ?"
90100100-92 = "Что такое, FOX 4? Уже страшно?"
90100100-93 = "Нет, я в восторге! Жду приказов!"
90100100-94 = ""
90100100-96 = ""
90100100-97 = ""
90100100-98 = ""
90100100-99 = "Обеспечим точку входа."
90100100-100 = "FOX 4, запрашиваю координаты цели."
90100100-101 = "Поняла, сейчас!"
90100100-102 = ""
90100100-104 = ""
90100100-108 = "Подтверждаю источник тепла по азимуту 0-8-5 от точки Ромео."
90100100-109 = ""
90100100-112 = "Зафиксировано несколько участков марева над вентиляционными трубами. Координаты..."
90100100-113 = "Что? Скорректируй масштаб расстояния. Цель должна быть намного дальше."
90100100-114 = ""
90100100-117 = ""
90100100-118 = ""
90100100-119 = "Похоже на правду..."
90100100-120 = ""
90100100-122 = ""
90100100-123 = "...FOX 2, в готовности."
90100100-126 = "Я вижу травяное поле, которого никак не может быть в этой вентиляционной комнате. А за полем могу подтвердить неравномерное покачивание..."
90100100-127 = ""
90100100-131 = ""
90100100-132 = ""
90100100-133 = ""
90100100-135 = "...и появление белого пугала."
90100100-137 = "FOX 4! Слышишь меня? Ты в сознании? Знаешь, кто я?"
90100100-138 = "А! Не кричи так. Конечно, знаю тебя... мелкая."
90100100-139 = "Чего?! Я не—"
90100100-140 = "FOX 1, она свихнулась! Миссия провалена!"
90100100-141 = ""
90100100-142 = "Похоже, FOX 4 ведёт себя как обычно. Цель обнаружена."
90100100-143 = "Всем включить ночное видение. Переключиться в ИК-режим и проверить фокус."
90100100-144 = ""
90100100-146 = ""
90100100-148 = ""
90100100-149 = ""
90100100-150 = ""
90100100-152 = ""
90100100-153 = ""
90100100-154 = "С этого момента ночь принадлежит лисам."
