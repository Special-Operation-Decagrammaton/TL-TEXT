[translation]
90100100-1 = "Episódio 10;Adentrando as Trevas"
90100100-4 = "[ns1] \"Que calorão...\"\n[ns2] \"Que breu danado...\""
90100100-7 = ""
90100100-8 = "Peço desculpas pelo desconforto."
90100100-9 = "Nesta operação precisamos manter disciplina de blecaute rigorosa, por isso a iluminação foi reduzida ao mínimo."
90100100-10 = "Se tivéssemos um visor de visão noturna sobrando, eu emprestaria ao senhor, mas infelizmente não temos nem reserva..."
90100100-11 = "[s3] \"Tudo bem, consigo enxergar mais ou menos.\"\n[s4] \"Mas me diz... onde estamos exatamente?\""
90100100-14 = "Num túnel subterrâneo que dá acesso à casa de máquinas da Estação Shirounagi."
90100100-15 = "O ar aqui é pesado e abafado porque expele o calor das instalações do metrô, tornando este o ambiente perfeito para atrair o [ruby=Kunekune]alvo[/ruby]. #nConto com a sua compreensão."
90100100-16 = "[s] \"Não se preocupe comigo. Quem está no aperto de verdade são vocês.\""
90100100-17 = ""
90100100-20 = "[ns5] \"Mas falando sério, o Kunekune aparece num lugar assim?\"\n[ns6] \"Não disseram que ele só surgia em dias ensolarados de céu limpo?\""
90100100-23 = "Era o que acreditávamos a princípio."
90100100-24 = "Porém, ao reanalisar os boletins de ocorrência, notamos que o clima lá fora talvez não seja o fator determinante."
90100100-25 = "Na última incursão, a FOX4 percebeu o Kunekune e foi enfeitiçada, #nmas a FOX3, que não fitou a miragem de calor, saiu completamente ilesa."
90100100-26 = "Se a lenda do Kunekune remonta à entidade eslava da [ruby=Poludnitsa]Dama do Meio-Dia[/ruby], usada como alerta contra insolações... #nentão desde que o ambiente seja abafado e propício à formação de miragens térmicas, ele pode se manifestar até no subterrâneo."
90100100-27 = "E o melhor de tudo: aqui embaixo, nenhum civil corre o risco de ser pego no fogo cruzado."
90100100-28 = "[s] \"A ideia é excelente, mas...\""
90100100-29 = ""
90100100-32 = "[ns7] \"Pode ser só impressão minha, mas...\"\n[ns8] \"Você não está evitando os civis de propósito?\""
90100100-35 = "...Será?"
90100100-36 = "Se a preocupação é expor civis ao perigo, #nevitar qualquer risco dessa natureza a todo custo é a nossa obrigação elementar como agentes da SRT."
90100100-37 = ""
90100100-40 = "Toda operação sempre traz danos colaterais inevitáveis."
90100100-41 = ""
90100100-44 = "Nós somos a SRT — a tropa especial que carrega nos ombros a segurança dos cidadãos de Kivotos."
90100100-45 = "Uma operação que não garanta a proteção da população civil perde todo o seu propósito."
90100100-46 = ""
90100100-49 = "Se deixarmos aquele alvo escapar agora, o estrago mais tarde será infinitamente maior!"
90100100-50 = "Você tem peito pra assumir a responsabilidade por essa decisão?!"
90100100-51 = ""
90100100-54 = "No passado causamos transtornos imperdoáveis a essa cidade. Não cometeremos o mesmo erro duas vezes."
90100100-55 = ""
90100100-58 = "Quem não tem coragem de assumir o peso das próprias escolhas não tem moral pra cantar de galo!"
90100100-59 = ""
90100100-60 = "Não importa o quão nobre seja a justificativa—"
90100100-61 = ""
90100100-64 = "[ns] (Por que... parece que ouvi vozes do passado ecoando por cima das palavras dela...?)"
90100100-66 = "[ns9] \"...Compreendo.\"\n[ns10] \"Mas não importa o que aconteça, a segurança de vocês é a prioridade número um.\""
90100100-69 = "Guardarei isso com firmeza."
90100100-70 = ""
90100100-72 = ""
90100100-73 = "Aqui é a FOX2. Cheguei ao Ponto Charlie."
90100100-74 = "Temperatura local em 34 graus Celsius... Tá escuro pra dedéu, mas sinto o ar tremulando em cima da tubulação de exaustão."
90100100-75 = "Copiado. Todas as unidades, não olhem para a miragem a olho nu até equiparem os aparelhos."
90100100-76 = "[s] \"Por acaso o equipamento de ontem que vocês falaram é...\""
90100100-77 = ""
90100100-79 = ""
90100100-80 = "Exatamente, óculos de visão noturna!"
90100100-81 = "Não sabemos bem como o Kunekune hipnotiza as pessoas, mas se for interferência direta no nervo óptico, #nacho que o princípio é parecido com o do meu escudo estroboscópico de choque."
90100100-82 = ""
90100100-84 = ""
90100100-85 = "Se levar um clarão na cara, a gente fica cega do mesmo jeito, não?"
90100100-86 = "Mas pelo menos evita danos permanentes à retina."
90100100-87 = "O óculos de visão noturna capta a luz com sensores e projeta na tela um sinal digital reconstruído. #nEntão se entrar uma intensidade luminosa prejudicial aos olhos, ele corta o sinal na hora."
90100100-88 = "Tomara que isso baste de verdade... #nNão temos garantia nenhuma de que o visor vá nos blindar contra a loucura do Kunekune..."
90100100-89 = "Mas se a gente não testar, outra pessoa vai ter que pagar pra ver."
90100100-90 = "Sendo assim, melhor nós servirmos de cobaia agora."
90100100-91 = "Se soubesse que ia ser assim, devia ter pedido pra mudar o nome do pelotão de Raposa pra Canário da Mina."
90100100-92 = "Que papo é esse? Amarelou antes da hora, FOX4? Nem tentou ainda."
90100100-93 = "Tô é louca pra começar...! Manda a ordem logo, comandante, não enrola!"
90100100-94 = ""
90100100-96 = ""
90100100-97 = ""
90100100-98 = ""
90100100-99 = "Muito bem, iniciemos a aproximação tática."
90100100-100 = "FOX4, confirme as coordenadas do alvo."
90100100-101 = "Positivo, deixa comigo!"
90100100-102 = ""
90100100-104 = ""
90100100-108 = "Assinatura térmica detectada a azimute 0-8-5 a partir do Ponto Romeo."
90100100-109 = ""
90100100-112 = "Miragem confirmada sobre a tubulação de ar condicionado. Coordenadas em—"
90100100-113 = "Ué? O zoom de alcance tá doido. A projeção tá focando muito mais longe do que a distância real."
90100100-114 = ""
90100100-117 = ""
90100100-118 = ""
90100100-119 = "Como imaginei..."
90100100-120 = ""
90100100-122 = ""
90100100-123 = "...FOX3, em espera."
90100100-126 = "Tô vendo um descampado florido que não devia existir nessa casa de máquinas... e lá no fundo, uma silhueta se contorcendo de um jeito todo irregular—"
90100100-127 = ""
90100100-131 = ""
90100100-132 = ""
90100100-133 = ""
90100100-135 = "Manifestação do \"espantalho branco\" confirmada."
90100100-137 = "FOX4! Tá me ouvindo?! Responde, sabe quem eu sou?!"
90100100-138 = "Ai, que susto! Não precisa berrar no rádio que eu tô te ouvindo muito bem!"
90100100-139 = "Então responde direito, cabeçuda!"
90100100-140 = "FOX1, ela já tá ficando pancada da cabeça de novo! A operação gorou!"
90100100-141 = ""
90100100-142 = "Se ela conseguiu fixar a posição do alvo sem perder a consciência, já é um excelente resultado."
90100100-143 = "Todas as operadoras, equipar visores noturnos. Alternar para canal infravermelho e ajustar foco."
