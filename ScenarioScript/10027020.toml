[translation]
10027020-1 = "Часть 2;Финальный том"
10027020-2 = ""
10027020-3 = "Ух... Эта зараза."
10027020-4 = "Ах... Детские обзывательства от самопровозглашённого автора. Как... предсказуемо. В следующий раз, когда захочешь меня оскорбить, Мэрури, попробуй заглянуть в словарь синонимов. Может, получится лучше."
10027020-5 = "М-Мне он не нужен! К тому же любой словарь, который понравился бы тебе, наверняка снился бы мне в кошмарах."
10027020-6 = "Для тебя это была довольно изящная шутка, Мэрури. Возможно, лишь в этот раз я снисхожу до комплимента."
10027020-7 = "Снисходишь, значит? Знаешь, эти заумные словечки делают тебя скорее высокомерной, чем утончённой."
10027020-8 = "А! Так ты всё-таки УМЕЕШЬ читать между строк! Очень хорошо! Я уже боялась, что не поймёшь."
10027020-10 = "...!"
10027020-11 = "...!"
10027020-12 = ""
10027020-14 = ""
10027020-17 = "[ns1] «Так, хватит — обе.»\n[ns2] «Постоянно огрызаться друг на друга вредно.»"
10027020-20 = "А это ещё кто?"
10027020-21 = "А, точно. Вы впервые встречаетесь с Таканэ. Почему бы мне вас не представить?"
10027020-22 = "Какая жалость, что именно ТЕБЕ придётся нас представлять."
10027020-23 = "Но не могу же я просить вас представляться самостоятельно. Подобная невоспитанность ниже моего достоинства."
10027020-24 = "Правда? В таком случае я с удовольствием позволю тебе встать на колени и со слезами умолять нас простить твою наглость."
10027020-25 = ""
10027020-27 = ""
10027020-29 = "Ты зашла слишком далеко!"
10027020-31 = ""
10027020-33 = ""
10027020-34 = ""
10027020-35 = ""
10027020-37 = "П-Перестань! Нельзя просто стрелять в людей каждый раз, когда злишься! Знаешь, поэтому тебя никто и не любит. Ну, ещё потому, что никто не хочет дружить с саркастичной всезнайкой."
10027020-38 = "Мэрури... дорогая... ты ничем от меня не отличаешься. Ты — начинающий автор, которая наконец пришла на клубное мероприятие, а все участники тебя проигнорировали. Тебе пришлось делать вид, что всё равно, лишь бы сохранить лицо."
10027020-39 = "Я предупреждаю! Если скажешь ещё хоть слово—"
10027020-40 = ""
10027020-42 = ""
10027020-45 = "[ns3] «Кхм-КХМ!»\n[ns4] «Вы двое ничего не забыли?»"
10027020-48 = "О."
10027020-49 = "Ох."
10027020-50 = "Точно... Это..."
10027020-52 = ""
10027020-58 = ""
10027020-59 = "Боже мой..."
10027020-60 = "Я невероятно рада наконец познакомиться с вами, Сенсей. Я столько о вас слышала."
10027020-61 = "Меня зовут Миёси Таканэ. Я работаю в Издательском отделе Красной Зимы и пишу рецензии на новые произведения для «Красного медведя»."
10027020-62 = "[s] «Издательский отдел...?»"
10027020-63 = "Да. Это закрытый клуб для студентов Красной Зимы, желающих посвятить себя писательству и издательскому делу."
10027020-64 = "Не хочу хвастаться, но с гордостью могу сказать, что как рецензент прочитала и оценила каждую книгу, изданную в Красной Зиме."
10027020-65 = "И всё же ты хвастаешься..."
10027020-66 = "Хи-хи! В следующий раз, когда будет свободная минутка, обязательно загляните в Издательский отдел."
10027020-67 = "Даже не думай приглашать Сенсея и игнорировать меня. Я первая заняла очередь!"
10027020-68 = "Любопытно... Я думала, ты так решительно намерена оставаться затворницей, что никогда не выползешь из своей норы. Но вот ты здесь."
10027020-69 = "Ты— Я— Вообще-то существуют выездные исследования, знаешь ли!"
10027020-70 = "Разве подобное обычно не поручают помощнице?"
10027020-71 = "Ах, но сейчас я её рядом не вижу."
10027020-73 = "Скажи-ка, где Момидзи?"
10027020-74 = "Эм... Э-Это... У неё сегодня другие дела!"
10027020-76 = "С каких пор вы проводите время порознь? Вы так часто вместе, что я уже начала думать, будто вы срослись бедром."
10027020-77 = "..."
10027020-78 = "Что такое, Мэрури? Ты вдруг непривычно молчалива. Куда делись твои фирменные дерзкие огрызания?"
10027020-79 = "Если совсем честно, я даже слегка обеспокоена. Тебе стоит быть благодарной, что мне не всё равно."
10027020-80 = "Хотя нет, не благодари. Не хочу видеть, как ты унижаешься."
10027020-81 = "Да определись уже с одним настроением! Эти метания утомляют."
10027020-82 = "[s5] «Книги, которые выходят в Красной Зиме...»\n[s6] «Ты сказала, что прочитала их все?»"
10027020-85 = "Да. Но опять же, я не хвастаюсь."
10027020-86 = "Вот так выглядит, когда ты НЕ хвастаешься?"
10027020-87 = "[s] «Значит, ты знакома с „Луной“?»"
10027020-88 = "«Луна»...?"
10027020-89 = "Да, я знакома с этим произведением."
10027020-90 = "Почему вы с Мэрури так им заинтересовались?"
10027020-91 = "[s] «Мы ищем финальный том.»"
10027020-93 = "Тот самый печально известный финальный том «Луны»?"
10027020-95 = ""
10027020-101 = ""
10027020-102 = ""
10027020-103 = "Понятно. И именно тогда, когда Момидзи нигде нет..."
10027020-104 = "..."
10027020-105 = "Что ж, мне неприятно оказаться правой, но я знала, что однажды это случится, Мэрури."
10027020-106 = "Ч-что?!"
10027020-107 = "Ты слышала. Посмотри, как ты ведёшь свои личные дела. Честно говоря, удивлена, что это не случилось раньше."
10027020-108 = "У ТЕБЯ хватает наглости критиковать МОЮ личную жизнь?! У тебя, которая критикует всё и всех и говорит такими кругами, что тебя никто не понимает?!"
10027020-109 = "Для твоего сведения, критика — это искусство. Я вижу то, чего не замечают другие. Я проливаю свет на произведения, которые иначе остались бы недооценёнными. Тебе давно пора это понять!"
10027020-110 = "Тц! Критики вроде тебя были бы никем без таких авторов, как я!"
10027020-111 = "Глупости. Хорошая рецензия заставляет произведение сиять! Что хорошего в отличном романе, если его некому прочесть?"
10027020-113 = "Это такая же чушь Красной Зимы, как пропаганда президента Черины!"
10027020-114 = "Чушь или нет, но это правда!"
10027020-115 = ""
10027020-117 = ""
10027020-119 = "[ns7] «Так-так, хватит!»\n[ns8] «Можем вернуться к последнему тому „Луны“?»"
10027020-122 = "А, точно..."
10027020-123 = "..."
10027020-124 = "Я понимаю вашу ситуацию, Сенсей."
10027020-125 = "Хотя не понимаю, почему вы так упорно помогаете этому нелюдимому существу."
10027020-126 = "Ты теперь сравниваешь меня с диким животным?!"
10027020-127 = "Суть вот в чём, Сенсей."
10027020-128 = "Финальный том «Луны», 22-й, имеет очень сложную историю."
10027020-129 = "Он не появится сам собой только потому, что вы твёрдо решили его найти."
10027020-130 = "Что, чёрт возьми, это значит?!"
10027020-131 = "Знаешь что? Похоже, ты слишком много знаешь о «Луне». Спорю, ты тоже её ищешь и пытаешься сбить нас со следа! Ха! Так ведь?!"
10027020-132 = "Перестань задавать кучу вопросов одновременно. Тебя вообще кто-нибудь учил разговаривать?"
10027020-133 = "..."
10027020-134 = "А теперь я дам тебе важное указание, Мэрури."
10027020-135 = "Посети Издательский отдел."
10027020-136 = "А? Зачем?"
10027020-137 = "Потому что там есть зацепка, которая поможет найти 22-й том «Луны»."
10027020-138 = "Если хотите найти 22-й том..."
10027020-139 = "Вот как это делается."
10027020-140 = "Погодите. Что?"
10027020-142 = "Я пойду. Искренне надеюсь, что у меня ещё будет возможность увидеться с вами, [USERNAME] Сенсей."
10027020-143 = "...без Мэрури рядом."
10027020-144 = "Всё, это была последняя капля, ты—"
10027020-146 = ""
10027020-149 = ""
10027020-150 = "Эй, п-подожди! СТОЙ!"
