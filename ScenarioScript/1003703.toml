[translation]
1003703-1 = "Дедукция председателя Комитета безопасности"
1003703-2 = "Вход в Академию Красной Зимы"
1003703-3 = "После последнего сообщения Марины в MomoTalk я приехал в Академию Красной Зимы."
1003703-4 = "Сенсей, вы прибыли. Идёмте, ситуация срочная."
1003703-5 = "Это место преступления, где коварный шпион проник в Секретариат и украл пудинг."
1003703-6 = "Подумать только — этот шпион осмелился украсть особый пудинг президента Черино!"
1003703-7 = "[s] «Почему ты решила, что пудинг украл шпион?»"
1003703-8 = "Пудинг — один из самых ценных и любимых наших ресурсов. Украв столь важную вещь, преступник пытается посеять внутренний раздор и привести нашу академию к падению!"
1003703-9 = "К несчастью для него, я председатель Комитета безопасности Академии Красной Зимы."
1003703-10 = "Видите эти царапины? Шпион, должно быть, пробрался через окно."
1003703-11 = "Следы маленькие, значит, рост шпиона меньше метра.#nОн схватил пудинг и выбрался обратно на четвереньках, держа его#nво рту."
1003703-12 = "[s1] «Это больше похоже на животное.»\n[s2] «Шпион ползал на четвереньках?»"
1003703-13 = "Внешность обманчива, Сенсей!"
1003703-14 = "Внешность обманчива, Сенсей!"
1003703-15 = "Этот шпион наверняка настоящий мастер маскировки."
1003703-16 = "Должно быть, он специально оставил такие улики, чтобы сбить нас со следа."
1003703-17 = "Начнём расследование. К счастью, шпион не слишком хорошо скрыл свой след."
1003703-18 = "Пойдём по отпечаткам и, надеюсь, найдём шпиона до заката."
1003703-19 = "[s] «До заката?!»"
1003703-20 = "Академия Красной Зимы — одна из крупнейших школ Кивотоса."
1003703-21 = "Настолько большая, что, если быть неосторожным, можно заблудиться и оказаться съеденным медведем."
1003703-22 = "Хотя что за бездарный студент умудрится заблудиться в собственной академии? Даже смешно представить."
1003703-23 = "[s3] «Вообще-то я могу вспомнить одного такого студента...»\n[s4] «Мне внезапно стало очень тревожно...»"
1003703-24 = "Не беспокойтесь ни о чём, Сенсей! Я знаю Академию Красной Зимы как свои пять пальцев. Даже лучше! Мы никак не можем заблудиться."
1003703-25 = "Не беспокойтесь ни о чём, Сенсей! Я знаю Академию Красной Зимы как свои пять пальцев. Даже лучше! Мы никак не можем заблудиться."
1003703-27 = "Некоторое время спустя..."
1003703-30 = ""
1003703-31 = "М-Может быть, мы заблудились."
1003703-32 = "Как такое могло случиться? Я ведь просто шла по следу подозреваемого!"
1003703-33 = "[s] «Ты же сказала, что знаешь эту академию как свои пять пальцев!»"
1003703-34 = "Ха-ха! Ха! К-Конечно! Как председатель Комитета безопасности Красной Зимы,#nя обязана знать план территории."
1003703-35 = "Т-Тут где-то точно есть тропа, по которой я часто хожу по утрам..."
1003703-36 = "Вообще никакой тропы? Даже маленькой?"
1003703-37 = "А теперь я ещё и потеряла следы! Как мне теперь найти шпиона?!"
1003703-38 = "[s] «Следы ведут к тому складу.»"
1003703-40 = "О-Они правда туда ведут?!"
1003703-41 = "Ага! Вот они!"
1003703-42 = "След ведёт к складу, где мы храним особый пудинг президента Черино."
1003703-43 = "Шпион, должно быть, решил перекрыть наши запасы прямо у источника."
1003703-45 = "У вас острый глаз, Сенсей. Подумать только, вы заметили улику, которую даже я не увидела."
1003703-46 = "Я подам рекомендацию наградить вас специальной медалью с усами!"
1003703-47 = "А теперь идём устроим этому шпиону чистку!"
1003703-48 = "Ха!"
1003703-51 = "Руки вверх!"
1003703-52 = "Э-Это что...?!"
1003703-53 = ""
1003703-56 = "[ns] «Котёнок.»"
1003703-57 = "..."
1003703-58 = "Шпион — это чудовищный зверь?!"
1003703-59 = "[s] «Успокойся, Марина. Это просто бездомная кошка.»"
1003703-60 = "Эти острые когти и зубы разорвут мою форму в клочья."
1003703-61 = "Мы думали, что нашли лазутчика Красной Зимы, но теперь столкнулись с ещё большей угрозой."
1003703-62 = "Что мне доложить президенту Черино? Что мы выследили преступника, но он героически прогнал нас?"
1003703-63 = "Президент не терпит неудач. Нас немедленно подвергнут чистке.#nМожет, мне усыпить её транквилизатором?"
1003703-64 = "[s5] «Марина, тебе сейчас страшно?»\n[s6] «Ты боишься кошек?»"
1003703-65 = "Что? Как председатель Комитета безопасности Красной Зимы может бояться какой-то кошки?!"
1003703-66 = "Что? Как председатель Комитета безопасности Красной Зимы может бояться какой-то кошки?!"
1003703-67 = "Я одна отвечаю за безопасность Секретариата! Будь то медведь, кошка или нарушитель, я бесстрашно встану перед ним—"
1003703-68 = ""
1003703-71 = "А-А-А!"
1003703-72 = ""
1003703-74 = ""
1003703-75 = "Ладно, хорошо. Возможно, рядом с кошками я чувствую себя не слишком комфортно."
1003703-76 = "В детстве меня поцарапала бездомная кошка. Я всего лишь хотела её покормить."
1003703-77 = "С тех пор я с опаской приближаюсь к этим зверям."
1003703-78 = "[s] «Что ж, может, с этой кошкой получится начать всё сначала. »"
1003703-79 = "Начать сначала?! В-Вы хотите, чтобы я её погладила, Сенсей?!"
1003703-80 = "Я скорее голыми руками повалю голодного медведя, чем подойду к этому чудовищу!"
1003703-81 = "Даже если президент лично прикажет, я не смогу—"
1003703-82 = ""
1003703-85 = "О-Отойдите от меня!"
1003703-86 = ""
1003703-91 = "Она ушла...?"
1003703-92 = "[s7] «К счастью, она увернулась от твоего шквала пуль.»\n[s8] «Думаю, стрельба её всё-таки отпугнула.»"
1003703-93 = "..."
1003703-94 = "..."
1003703-95 = "Ч-Что ж, поздравляю с раскрытием дела!"
1003703-96 = "Мы не только установили личность похитителя пудинга, но и вселили ужас в сердце этой кошки! Больше она никогда не нападёт на Секретариат!"
1003703-97 = "Надеюсь, теперь президент Черино перестанет угрожать устроить чистку половине школы, если ей не вернут пудинг."
1003703-98 = "Но, кажется, с полки только что что-то упало. В-Вы же не думаете, что это кошка, да?"
1003703-99 = ""
1003703-102 = "Э-Это статуя президента Черино?!"
1003703-103 = "Почему эта статуя здесь? Кто посмел повредить лик нашего великого лидера?"
1003703-104 = "Погодите... Это из-за моей стрельбы?"
1003703-105 = "О нет. Я так старалась ещё сильнее доказать свою верность президенту Черино,#nа в итоге сама отколола кусочек её авторитета..."
1003703-106 = "Пожалуйста, не подвергайте меня чистке!"
1003703-108 = "Хотя пудинг украла кошка, наказание за разбитую статую Черино получила Марина..."
