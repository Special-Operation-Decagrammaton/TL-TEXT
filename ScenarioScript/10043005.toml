[translation]
10043005-162 = "#video;10043"
10043005-1 = "Пролог;Традиции и история"
10043005-7 = "Здравствуйте, любители бейсбола! Сегодня у нас матч между «Героями Корги» и «Абиссинскими мародёрами»."
10043005-8 = "Мы искренне благодарим всех болельщиков, которые сегодня пришли на наш стадион."
10043005-9 = ""
10043005-13 = ""
10043005-14 = ""
10043005-15 = ""
10043005-16 = "Матч вот-вот начнётся! Поддержим наших игроков!"
10043005-17 = ""
10043005-22 = "[ns] «Прямо чувствуешь этот азарт.»"
10043005-23 = "Конечно! У «Героев» и «Мародёров» долгая общая история. Именно поэтому серия Ширатори так захватывает!"
10043005-24 = "Это всего лишь товарищеский матч, но страсти здесь кипят не слабее, чем в любой настоящей лиге!"
10043005-25 = "Немного предыстории: «Герои» представляют компанию Corgi Electronics. Это их корпоративная бейсбольная команда."
10043005-26 = "«Мародёры» тоже корпоративная команда. Они представляют гильдию торговцев из района порта Канэсаки."
10043005-27 = "Видите ли, гильдия торговцев поставляет сырьё для продукции электронной компании. Сначала они просто устраивали дружеские игры по выходным..."
10043005-28 = "Но теперь каждый их матч обязан посмотреть весь город Ширатори!"
10043005-29 = "Обе команды вкладывают в игру всю душу. И постоянно ищут новых игроков среди сотрудников своих компаний."
10043005-30 = "Если интересно, я сама болею за «Героев». Мне кажется, у них много общего с Бейсбольным клубом Миллениума."
10043005-31 = ""
10043005-33 = ""
10043005-34 = "Вперёд, Герои! У-у-у!"
10043005-35 = ""
10043005-37 = ""
10043005-39 = "Я обычно не хожу на стадион, но ради своего тренера с радостью пришла."
10043005-40 = "Хотя мне кажется, эту страсть лучше направить во что-то долгосрочное, например в здоровье и выносливость."
10043005-41 = "Сумирэ, ты сейчас говоришь о тренировках? Здесь?"
10043005-42 = "Конечно, Рэй. Выносливость — основа всего."
10043005-43 = "Посмотри на этих игроков. Представь, какая дисциплина нужна, чтобы натренировать себя до такого уровня."
10043005-44 = ""
10043005-46 = ""
10043005-47 = "Хм... В этом есть смысл."
10043005-48 = "[s] «Ты звучишь... не очень уверенно.»"
10043005-49 = ""
10043005-51 = ""
10043005-52 = "Р-разве, Сенсей?!"
10043005-53 = "...Ну, возможно, со стороны и правда так показалось."
10043005-54 = "Вы спрашиваете, в чём именно я сомневаюсь?"
10043005-55 = ""
10043005-57 = ""
10043005-58 = "..."
10043005-59 = "Ну, насколько хорошо вы знаете статистику серии Ширатори?"
10043005-60 = "Не то чтобы я ожидала, что вы помните её наизусть..."
10043005-61 = ""
10043005-63 = ""
10043005-65 = ""
10043005-66 = ""
10043005-67 = "О, эта серия идёт уже очень давно, да? ...Погодите, здесь опечатка?"
10043005-69 = "С-Сумирэ?! Ну... да, наверное, это и правда легко найти..."
10043005-70 = "[s] «Что именно опечатка?»"
10043005-71 = "Согласно этим данным, «Герои» сыграли против «Мародёров» 189 матчей... и проиграли каждый."
10043005-72 = "[s] «Каждый? Почти двести матчей — и все?!»"
10043005-73 = "Н-ну... это просто сухая статистика!"
10043005-74 = "И... да, цифры ВАЖНЫ... но ведь не зря же существуют награды за участие, правда?"
10043005-75 = "Так что... ладно, да. Пока матчи заканчивались именно так."
10043005-76 = "Но они всегда очень близкие! Обычно разница всего одно-два очка!"
10043005-77 = "Иногда «Герои» ведут в счёте — пока вдруг не перестают. Иногда всё кажется безнадёжным, а потом они почти догоняют. Вот почему болельщики снова и снова возвращаются!"
10043005-78 = "Мы любим называть «Героев» «Гончими», потому что они вечно гонятся за победой!"
10043005-79 = "Но если они за ней «гонятся», значит, пока так и не поймали."
10043005-80 = ""
10043005-82 = ""
10043005-83 = "Ну ДА, они над этим работают!"
10043005-84 = "В этом и вся прелесть. Даже когда они проигрывают, нам всем хочется увидеть, получится ли в следующий раз."
10043005-85 = "«В следующий раз», понимаете? «Следующий матч точно наш»."
10043005-86 = ""
10043005-88 = ""
10043005-89 = "Вот я и снова здесь, болею за них. Вперёд, Герои! Вы сможете!"
10043005-90 = ""
10043005-93 = "[ns] «...Бейсбол — глубокая штука.»"
10043005-94 = "О, я знаю, людям, которые не следят за спортом, он может казаться глупостью."
10043005-95 = "Но для тех, кто следит, спорт может значить целый мир!"
10043005-96 = "Это лишь доказывает, что мне нужно тренироваться ещё усерднее."
10043005-97 = ""
10043005-99 = ""
10043005-100 = "Не всё в мире сводится к твоим тренировкам!"
10043005-101 = "[s] «Д-давайте, Герои...?»"
10043005-102 = ""
10043005-104 = ""
10043005-105 = "Спасибо, Сенсей! Я знала, что «Гончие» вам понравятся!"
10043005-106 = "Не уверен, что именно это сейчас происходит..."
10043005-107 = ""
10043005-111 = "Эй, вы трое попали в кадр! Поздравляю, время для фото!"
10043005-112 = ""
10043005-114 = ""
10043005-115 = "Что это?"
10043005-116 = "О, у нас время для фото?"
10043005-117 = "А, вы двое, наверное, не знаете. Это такая игра для болельщиков..."
10043005-118 = "Если камера ловит вас вместе во время матча, нужно сбиться поближе и позировать."
10043005-119 = ""
10043005-121 = ""
10043005-122 = "Ну же, прижмитесь друг к другу и покажите лучшую позу!"
10043005-123 = "Хм, значит, у зрителей есть собственная культура. Интересно, правда, Тренер?"
10043005-124 = "Фуфу, тогда я не могу отказаться."
10043005-125 = ""
10043005-127 = ""
10043005-128 = ""
10043005-129 = "Я тоже..."
10043005-130 = "Хи-хи... Давайте хорошо получимся, Сенсей."
10043005-131 = ""
10043005-133 = ""
10043005-134 = ""
10043005-139 = ""
10043005-140 = ""
10043005-142 = ""
10043005-144 = "Да! Отличная поза, спасибо! А теперь возвращаемся к игре!"
10043005-145 = ""
10043005-150 = "А, пока мы разговаривали, «Мародёры» сделали первый хит. И-и-и уже вышли вперёд."
10043005-152 = ""
10043005-153 = "Э-эй, это не...?"
10043005-154 = "Похоже, Сенсей из Шале. Раньше я их здесь не видел. Что они тут делают?"
10043005-155 = "Не знаю, но, может, это знак. Возможно, это наш шанс..."
10043005-156 = ""
10043005-158 = ""
10043005-160 = "...наконец всё изменить!"