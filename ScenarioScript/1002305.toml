[translation]
1002305-1 = "Смена обстановки для Дисциплинарного комитета"
1002305-2 = "Эй, почему в этом дзэндзай нет сладких рисовых лепёшек?"
1002305-3 = "И вдобавок оно не горячее. Вместо красной фасоли манго, и всё забито льдом! Это что, шутка?"
1002305-4 = "Н-Но... это не горячий сладкий суп дзэндзай. Это какигори-дзэндзай с фруктами с юга."
1002305-5 = "Какая разница?! Мы хотим горячий сладкий суп из красной фасоли!"
1002305-6 = "Немедленно принесите нам дзэндзай с красной фасолью и сладкими рисовыми лепёшками!"
1002305-7 = "Вы пришли за супом из красной фасоли в магазин какигори..."
1002305-8 = ""
1002305-11 = "На этом ваши выходки закончились!"
1002305-13 = "Она из Дисциплинарного комитета Геенны?!"
1002305-14 = "Как она так быстро сюда добралась?"
1002305-15 = "У нас против неё нет шансов. Бежим!"
1002305-16 = ""
1002305-18 = ""
1002305-19 = "Ц. Убегают как трусы."
1002305-20 = "А ну стой!"
1002305-21 = ""
1002305-23 = ""
1002305-26 = "Иори погналась за хулиганками вдоль пляжа."
1002305-27 = ""
1002305-35 = ""
1002305-36 = "*вздох* На этом всё."
1002305-37 = "[s1] «Отличная работа.»\n[s2] «Ты не ранена?»"
1002305-38 = "Хмф. Пешком их оказалось сложнее догнать, чем я думала, но ничего особенного."
1002305-39 = "Хмф. Пешком их оказалось сложнее догнать, чем я думала, но ничего особенного."
1002305-40 = "Этим идиоткам вообще не надоедает? Ни дня не проходит без того, чтобы они не устроили очередную сцену."
1002305-41 = "У меня даже не было времени намазаться кремом и спокойно позагорать."
1002305-42 = "[s] «Что ты сказала?»"
1002305-43 = "Н-Ничего!"
1002305-44 = "Просто жаловалась, что пришлось гоняться за этими идиотками."
1002305-45 = ""
1002305-46 = "В любом случае, не мог бы ты присмотреть за этим местом, Сенсей? Я пойду патрулировать вон тот пустынный пляж..."
1002305-47 = "Ты ведь понимаешь? Никогда не знаешь, какие нарушители могут прятаться в таких, казалось бы, безлюдных местах."
1002305-48 = "Как специалист Дисциплинарного комитета я должна своими глазами проверить места, куда обычно сама не хожу."
1002305-49 = "[s] «Почему бы нам не пойти вместе?»"
1002305-50 = "Что?! Нет, ты мне не нужен. Абсолютно нет!"
1002305-51 = "Я и сама справлюсь! Это опасно, так что жди меня здесь."
1002305-52 = "[s] «Хорошо.»"
1002305-53 = "Ты правда понял?"
1002305-54 = "Тебе категорически нельзя идти за мной!"
1002305-55 = "Я тебе доверяю!"
1002305-56 = ""
1002305-58 = ""
1002305-59 = "[ns] Проследить за Иори."
1002305-62 = "Иори лежит в тени валуна и загорает там, где её никто не увидит."
1002305-63 = "*вздох* Было бы обидно, если бы, приехав так далеко на пляж, я только и делала, что работала."
1002305-64 = "Нет ничего плохого в том, чтобы иногда спокойно отдохнуть и—"
1002305-67 = "― А? Что?![wa:690]"
1002305-71 = "― К-Когда ты сюда пришёл?[wa:560]"
1002305-74 = "― Ты всё это время на меня смотрел?[wa:1210]"
1002305-76 = "― Т-Ты...! Извращенец! Умри![wa:920]"
1002305-79 = "― Чтобы ты знал, я здесь не бездельничаю![wa:760]"
1002305-81 = "― Всё это ради поддержания порядка на пляже![wa:640]"
1002305-84 = "― И вообще, сколько ты ещё собираешься так пялиться?![wa:10]"
1002305-86 = "― Уходи!"
1002305-89 = "Я-Я делала это не ради развлечения, ясно?"
1002305-90 = "[s] «Я услышал тебя с первого раза.»"
1002305-91 = "Отдых — тоже часть моих обязанностей на пляже. Я собиралась лишь немного отдохнуть и восстановить силы перед возвращением к работе."
1002305-92 = "К тому же ты купил мне солнцезащитный крем. Было бы жалко им не воспользоваться..."
1002305-93 = "Очевидно же, я должна была это сделать ради защиты порядка на пляже."
1002305-94 = "...Почему я вообще оправдываюсь?"
1002305-95 = "Ты бы никогда не увидел меня в таком виде, если бы не пошёл за мной, хотя я просила этого не делать."
1002305-96 = "Я тебя просто ненавижу, Сенсей!"
1002305-98 = "Расстояние между мной и Иори снова увеличилось."
