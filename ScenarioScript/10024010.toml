[translation]
10024010-1 = "Эпизод 1;Редкие деликатесы, вкусные угощения"
10024010-2 = "Променад Чёрной Черепахи"
10024010-3 = ""
10024010-4 = "Как вам суп «Искушение Будды»? Перейдём к основному блюду?"
10024010-5 = "Я приготовила «Счастливую семью». Там сушёный морской огурец, морское ушко и рапан, обжаренные с овощами. Ещё есть кусочки свинины и креветки."
10024010-6 = ""
10024010-11 = "[ns] «О-о-очень вкусно! Я никогда ничего подобного не пробовал!»"
10024010-12 = "Прекрасно. Для шеф-повара нет ничего приятнее, чем слышать, что гостю нравится еда."
10024010-13 = "Когда закончите с этим, следующим блюдом будет хороший суп с вонтонами и креветками."
10024010-14 = "[s] «Ты хочешь сказать, что будет ещё?!»"
10024010-15 = "Конечно будет. Мы только начали!"
10024010-16 = "После основного супа будут ещё лапша и десерт."
10024010-17 = "Я распределила порции так, чтобы вы максимально насладились вкусом каждого блюда, так что приятного аппетита."
10024010-18 = "[s1] «С-спасибо, но я не уверен, что смогу столько съесть...»\n[s2] «Желудок взрослого не сравнится с желудком старшеклассницы...»"
10024010-21 = "А, вот как?"
10024010-22 = "В таком случае... желаю удачи!"
10024010-23 = ""
10024010-25 = ""
10024010-26 = "Президент, суп готов. Выносить?"
10024010-27 = "Ещё нет. Наш гость... Сенсей, похоже, пока не готов."
10024010-28 = "Но раз уж ты здесь, почему бы не поздороваться? Рэйдзё усердно работает, чтобы обеспечивать мою безопасность."
10024010-29 = "Меня зовут Рэйдзё. Приятно познакомиться, Сенсей."
10024010-30 = "[s] «Очень приятно, Рэй.»"
10024010-31 = "Вы назвали меня... Рэй...?"
10024010-32 = "Любопытно. Меня ещё никто так не называл."
10024010-33 = "Рэй... Может, и мне теперь тебя так называть?"
10024010-34 = "...Пощадите, Президент."
10024010-36 = "Но Сенсей, я впечатлена. Своим первым ходом вы сразу выбили меня из равновесия."
10024010-37 = "В фильмах лишить противника равновесия — один из базовых приёмов кунг-фу."
10024010-38 = "[s] «Да ничего подобного! Я просто дружелюбно общаюсь...»"
10024010-40 = "А, скромностью заставляете противника потерять бдительность... Вы знаете своё дело!"
10024010-41 = "Хватит, Рэйдзё. Ты заставляешь Сенсея нервничать."
10024010-42 = "[s] «Я что-то не так сказал...?»"
10024010-43 = "Не обращайте внимания. Рэйдзё умнее некуда... пока речь не заходит о кунг-фу."
10024010-44 = "Хотя признаюсь, мне было забавно смотреть, как она загнала вас в угол..."
10024010-45 = "[s3] «В любом случае! Ты закрыла ресторан сегодня только ради меня?»\n[s4] «Честно говоря, я ожидал, что здесь будет больше людей.»"
10024010-48 = "А... Вообще-то именно поэтому я вас и позвала..."
10024010-49 = "Пожалуй, вам лучше увидеть всё своими глазами. Если что-то случится..."
10024010-50 = "...Рэйдзё вас защитит."
10024010-51 = "Я прослежу за этим, Президент."
10024010-52 = ""
10024010-54 = ""
10024010-55 = "Руми указала большим пальцем себе за спину."
10024010-56 = "А потом..."
10024010-57 = ""
10024010-59 = ""
10024010-60 = "А? У вас какие-то проблемы?"
10024010-62 = ""
10024010-64 = ""
10024010-65 = "Показывать пальцем невежливо. Вы что, не знаете, что мы клиенты?"
10024010-66 = "Обслуживание на Променаде Чёрной Черепахи просто ужасное!"
10024010-67 = "Вот поэтому им и приходится заниматься грязными делами."
10024010-69 = ""
10024010-71 = "Ну... Как видите..."
10024010-72 = "[s] «Кто они?»"
10024010-73 = "Они... члены Генрюмон."
10024010-74 = "Заказывают одну тарелку жареных яиц, а потом часами торчат в ресторане."
10024010-75 = "Все остальные клиенты пугаются и уходят..."
10024010-76 = "И конечно, не из-за жареных яиц!"
10024010-77 = "Наши блюда из яиц недорогие, но вкусом не уступают любому деликатесу. Прекрасная вещь..."
10024010-78 = "Но вы ведь понимаете, в чём проблема, когда кто-то занимает столик, заказав всего одно блюдо?"
10024010-79 = "Они мешают нашей работе."
10024010-80 = "Ну, ради этого они сюда и пришли, разве нет?"
10024010-81 = "[s] «Вы не можете попросить их уйти?»"
10024010-82 = "Эм... Они из Генрюмон..."
10024010-83 = "Возможно, вы не знаете об отношениях между Променадом Чёрной Черепахи и Генрюмон."
10024010-84 = "[s5] «Полагаю, вы не очень ладите.»\n[s6] «Я слышал, никто не хочет вставать между вами...»"
10024010-87 = "Если кратко — да. Конечно, на деле всё немного сложнее..."
10024010-89 = ""
10024010-91 = ""
10024010-92 = "Генрюмон — по сути ученический совет Шаньхайцзина."
10024010-93 = ""
10024010-95 = ""
10024010-96 = "Для них нет ничего важнее чести и традиций."
10024010-97 = ""
10024010-99 = ""
10024010-100 = "Кто-то мог бы сказать, что традиции они ценят даже слишком сильно..."
10024010-102 = "Они не «ценят» традиции. Они ими одержимы."
10024010-104 = "Будь их воля, Променад Чёрной Черепахи тысячу лет готовил бы одни и те же блюда по одним рецептам!"
10024010-105 = "Кулинария должна развиваться! Должна двигаться вперёд! Если каждый день есть одно и то же, разве это вообще жизнь?!"
10024010-106 = "Они вообще не понимают, чем мы здесь занимаемся! Мы раздвигаем сами границы кулинарии...!"
10024010-107 = "Рэйдзё, возможно, тебе стоит говорить потише..."
10024010-108 = "Эй! Вы там про нас говорите?"
10024010-109 = "Вы ещё пожалеете, черепашьи придурки. Мы вас так повяжем, что ваши внуки родятся в наручниках."
10024010-110 = "...Я как раз пыталась этого избежать."
10024010-111 = "У Генрюмон есть свои причины так усердно поддерживать традиции..."
10024010-112 = "Но иногда мне хочется, чтобы они относились к этому хоть немного гибче."
10024010-113 = "Крупной организацией невозможно хорошо управлять без небольшой гибкости, знаете ли."
10024010-114 = "[s] «Понятно. Всё и правда сложно...»"
10024010-115 = "...Да. Я не могу открыто это обсуждать, но часто слышу недовольство тем, как Генрюмон ведёт дела."
10024010-116 = "И Генрюмон, мягко говоря, не смотрит на нас доброжелательно."
10024010-117 = "Но в последнее время всё дошло до предела. Ходит один слух..."
10024010-118 = "[s] «Что за слух?»"
10024010-119 = "Есть растение, которое растёт только в Шаньхайцзине. Десятитысячелетний женьшень."
10024010-120 = "Поскольку выращивать его невероятно трудно, его распространение и использование строго контролируются. А экспорт женьшеня запрещён."
10024010-121 = "Но по слухам, Променад Чёрной Черепахи контрабандой вывозит десятитысячелетний женьшень за пределы академии."
10024010-122 = "С тех пор члены Генрюмон стали нашими постоянными «клиентами», пока «расследуют нас»."
10024010-123 = "И благодаря их очаровательному поведению все настоящие клиенты разбежались..."
10024010-124 = ""
10024010-126 = ""
10024010-127 = ""
10024010-128 = "Называйте это слухами сколько хотите. Нас не обманете."
10024010-129 = "Променад Чёрной Черепахи думает, что ему всё сойдёт с рук!"
10024010-130 = "Но вы тащите сюда всякий мусор извне. Рано или поздно это вам аукнется!"
10024010-131 = "Если бы вы с самого начала соблюдали правила Генрюмон, нам не пришлось бы здесь сидеть!"
10024010-132 = ""
10024010-134 = ""
10024010-135 = ""
10024010-136 = "Рэйдзё уже объяснила, но кулинария, которая не развивается, уже мертва."
10024010-137 = "Это верно для всего! Обществу нужно принимать новое."
10024010-139 = "Думайте как хотите. Это не значит, что можно просто игнорировать приказы Генрюмон."
10024010-140 = "Да Променада Чёрной Черепахи вообще не существовало бы без Генрюмон!"
10024010-142 = "Ладно, ладно. Генрюмон так много для нас делает. Можем уже закончить?"
10024010-143 = "Уже сдаётесь? Такие же бесхребетные, как я и думала!"
10024010-144 = "Так легко от нас не отделаетесь. Мы знаем, что вы что-то скрываете!"
10024010-145 = "Как скажете. Хорошего дня."
10024010-147 = "Итак... Вы нам поможете? Я хочу разобраться, откуда взялось это напряжение между Генрюмон и Променадом Чёрной Черепахи."
10024010-148 = "Они приходят сюда и нарываются на драку, а ты называешь это «напряжением»? Надо дать сдачи!"
10024010-149 = "Успокойся, Рэйдзё. Если сорвёмся, в долгосрочной перспективе нам будет только сложнее."
10024010-150 = ""
10024010-152 = ""
10024010-154 = ""
10024010-156 = "[ns] «Вы двое из Генрюмон, верно?»"
10024010-157 = "Хм? Кто спрашивает? Не думайте, что мы будем снисходительны только потому, что вы взрослый!"
10024010-158 = "Может, вы не отсюда, но здесь все соблюдают правила Шаньхайцзина. И вы тоже."
10024010-159 = "А значит... Я бы на вашем месте осторожнее выбирала компанию, чужак. Вас могут принять за врага Генрюмон."
10024010-160 = "Так что друзей выбирайте с умом... Хе-хе-хе..."
10024010-161 = ""
10024010-163 = ""
10024010-164 = "Следите за манерами! Это Сенсей из Шале."
10024010-165 = "Ч-что? Из Шале...?"
10024010-166 = "Ой, вот беда. Что нам делать...?"
10024010-167 = "[s] «Я хотел бы встретиться с руководителем Генрюмон.»"
10024010-168 = "Вы хотите встретиться с госпожой Кисаки? Даже если вы действительно ТОТ Сенсей..."
10024010-169 = "Д-да! Не каждый может просто взять и попасть на встречу с президентом! Даже мы..."
10024010-171 = "Любопытно. Не знала, что ВЫ двое можете принимать такие решения."
10024010-172 = "Это ещё что должно значить?"
10024010-174 = "Я слышала, Президент Генерального ученического совета предоставила Шале внесудебные полномочия."
10024010-175 = "И если Генрюмон откажется встречаться с Сенсеем... Интересно, что тогда будет?"
10024010-176 = "Ну... если об этом прознает Кронос, получится громкая новость..."
10024010-177 = "Ой! Полагаю, тогда в Шаньхайцзин хлынут всевозможные журналисты и следователи извне."
10024010-179 = "П-погодите! Стойте! Дайте подумать..."
10024010-180 = "Только недолго. Хорошая предпринимательница сразу хватает идею за хвост."
10024010-181 = "Хотя нет, думайте сколько хотите. Променад Чёрной Черепахи сможет отлично заработать, кормя всех этих приезжих..."
10024010-182 = "Надо бы поблагодарить вас за такую замечательную деловую возможность!"
10024010-183 = "Тц..."
10024010-184 = "Л-ладно! Я передам ваше сообщение, но потом не говорите, что я не предупреждала!"
10024010-185 = "[s] «Мне только это и было нужно.»"
10024010-187 = "Хмпф...! Это ещё не конец, Променад Чёрной Черепахи!"
10024010-189 = ""
10024010-193 = ""
10024010-194 = ""
10024010-195 = "Сенсей использовал «мягкую силу», чтобы обратить силу этих хулиганок против них же... Надо записать...!"
10024010-196 = "Вернись к нам, Рэйдзё. Не всё на свете — кунг-фу."
10024010-197 = "В любом случае студенты, мешавшие нашему бизнесу, ушли. Спасибо, Сенсей."
10024010-198 = "Хотя мне и понравилось смотреть, как наши друзья из Генрюмон извиваются, полагаю, у вас есть план?"
10024010-199 = "У вас... нет...? Вы просто пойдёте туда и поговорите...?"
10024010-200 = "Надо же. Довольно простолинейно."
10024010-201 = "Ха-ха-ха! Мне нравится! Выдвигаемся, Рэйдзё?"
10024010-202 = "Ты уверена, что это хорошая идея?"
10024010-203 = "Да. К тому же... мне тоже нужно кое-что сказать Кисаки."
10024010-204 = "[s] «Пойдём все вместе.»"
10024010-205 = "Поняла. Я сделаю всё, что в моих силах, чтобы защитить Сенсея."
10024010-206 = "Замечательно. Спасибо."
10024010-207 = "Но... мы ещё не закончили есть! Рэйдзё, вынеси суп с вонтонами и креветками, пожалуйста."
10024010-208 = "Да, госпожа! Сейчас принесу следующее блюдо, Сенсей."
10024010-209 = ""
10024010-211 = ""
10024010-212 = ""
10024010-213 = "[ns] «Надеюсь только, мой желудок выдержит...»"
10024010-214 = "Не заставляйте себя. Всё, что не сможете доесть, можно оставить."
10024010-215 = "В большом количестве остатков нет ничего плохого. Ха-ха-ха!"
