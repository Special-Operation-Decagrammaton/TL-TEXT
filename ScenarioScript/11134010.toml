[translation]
11134010-1 = "#K-01"
11134010-2 = ""
11134010-3 = "Никогда не думала, что действительно буду петь перед другими людьми."
11134010-5 = "Правда? Ты похожа на человека, который постоянно что-нибудь напевает."
11134010-7 = "Напевать и петь — разные вещи... Погоди, а что именно ты сейчас имела в виду?"
11134010-9 = "Может, подробно разберём этот вопрос?"
11134010-11 = "Нет. Я уже жалею, что спросила."
