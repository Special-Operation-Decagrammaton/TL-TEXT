[translation]
1300105-1 = "Небесное вдохновение"
1300105-2 = "Получив сообщение, я отправился в парк и нашёл там Чисэ."
1300105-4 = "*шорох*"
1300105-5 = "*шуршание* *шуршание*"
1300105-6 = "[s] «...Чисэ? Что ты делаешь в траве?»"
1300105-7 = "Мяу?"
1300105-8 = "Сейчас я не Чисэ, Сенсей."
1300105-9 = "Я-я кошка. Мяу..."
1300105-10 = "[s] «Кошка...?»"
1300105-11 = "Теперь я кошка в траве."
1300105-12 = "Это способ увидеть мир по-новому."
1300105-13 = "Единственный способ!"
1300105-14 = "[s] «И почему ты вдруг стала кошкой?»"
1300105-15 = "Мне нужно найти вдохновение для стихотворения."
1300105-16 = "Надо сочинить хайку."
1300105-17 = "[s1] «Вдохновение для стихотворения?»\n[s2] «Хайку?»"
1300105-18 = "Ага. Вдохновение. Что-нибудь вроде этого."
1300105-19 = "Ага. Вдохновение. Что-нибудь вроде этого."
1300105-20 = "Хочу сочинить хайку, которое по-настоящему тронет сердце."
1300105-21 = "Срок уже близко."
1300105-23 = "Выслушав Чисэ и хорошенько обдумав её слова, я начал понимать, что она имеет в виду."
1300105-26 = "[ns3] «Значит, в рамках рекламной деятельности клуба Инь-Ян...»\n[ns4] «...тебе нужно хайку для выступления в рекламном зале?»"
1300105-27 = "(кивает)"
1300105-28 = "(кивает)"
1300105-29 = "Мне нужно прочитать хайку."
1300105-30 = "[s] «Понятно, этим занимается ваш Клуб Инь-Ян.»"
1300105-31 = "Но, Сенсей, это чрезвычайная ситуация."
1300105-32 = "В голове пусто... Ничего не приходит."
1300105-33 = "Поэтому..."
1300105-34 = "Сегодня мне нужна помощь. Чтобы придумать хорошее стихотворение."
1300105-35 = "Поможешь?"
1300105-36 = "[s] «Конечно, помогу.»"
1300105-37 = "Ура! Спасибо, Сенсей."
1300105-38 = "Тогда в честь встречи с тобой, Сенсей..."
1300105-39 = "Попробую выразить в хайку чувства от превращения в кошку."
1300105-41 = "#st;[200,566];smooth;140;#n #nТак приятно быть"
1300105-43 = "#n #n #n #nмаленькою кошечкой,"
1300105-45 = "#n #n #n #n #n #nведь кошечка — я"
1300105-49 = "[ns] «Вот твоё хайку...»"
1300105-50 = "Мне кажется, если ты ещё немного побудешь рядом, я придумаю что-нибудь лучше."
1300105-51 = "Ну что, пойдём, Сенсей."
1300105-53 = ""
1300105-54 = ""
1300105-55 = ""
1300105-56 = "*ква* *ква*"
1300105-57 = "Слышу лягушек."
1300105-58 = "[s] «Ага, здесь, наверное, их много.»"
1300105-59 = "Господин Лягушонок зовёт меня. Сенсей."
1300105-60 = "[s] «Д-Да?»"
1300105-61 = "*ква* *ква*"
1300105-62 = "(наклоняет голову) *ква* *ква*"
1300105-63 = "*ква* *ква* *ква* *ква* *ква*"
1300105-64 = "[s] «Лягушки отвечают Чисэ?!»"
1300105-65 = "Ах."
1300105-66 = "Господин Лягушонок подал мне идею."
1300105-67 = "Это хайку, Сенсей."
1300105-69 = "#st;[200,566];smooth;140;#n #nЛягушка прыгнет на"
1300105-71 = "#n #n #n #nтам, на другом берегу,"
1300105-73 = "#n #n #n #n #n #nрадостно квакнув"
1300105-76 = "Ну как? Думаешь, лягушкам понравится?"
1300105-77 = "*ква* *ква* *ква* *ква* *ква*"
1300105-78 = "[s] «По-моему, им... очень нравится.»"
1300105-79 = "Как здорово! ♪"
1300105-82 = "Добро пожаловать!"
1300105-83 = "[s] «Магазин?»"
1300105-84 = "Ага..."
1300105-85 = "В магазине так много цветов."
1300105-86 = "Может, здесь что-нибудь придёт в голову."
1300105-87 = "[s] «Хм, здесь вроде не особо много вдохновения...»"
1300105-88 = "Ах."
1300105-89 = "Сенсей, смотри."
1300105-90 = "Это особая рамунэ с матча."
1300105-91 = "[s] «Со вкусом матча?»"
1300105-92 = "Матча-рамунэ. Сладости. Яркие цвета..."
1300105-93 = "Придумала, Сенсей."
1300105-94 = "[s] «Ещё одно — прямо в магазине!»"
1300105-97 = "#st;[200,566];smooth;140;#n #nКупить побольше вкусняшек"
1300105-99 = "#st;[-116,455];smooth;140;#n #n #n #nи вкусной газировки на всех"
1300105-101 = "#n #n #n #n #n #nчтобы всем делиться"
1300105-104 = "Ну как, Сенсей?"
1300105-105 = "[s5] «Эм, это твоё хайку?»\n[s6] «По-моему, оно отличное, Чисэ.»"
1300105-106 = "Но... этого мало, Сенсей."
1300105-107 = "Но... этого мало, Сенсей."
1300105-108 = "Чего не хватает?"
1300105-110 = "Весь день я ходил с Чисэ с места на место."
1300105-111 = "Она придумала несколько хайку."
1300105-112 = "Нет. Всё ещё чего-то не хватает, Сенсей."
1300105-113 = "Нужно что-то... что-то, что тронет сердце..."
1300105-114 = "Недовольная Чисэ продолжала качать головой."
1300105-115 = ""
1300105-116 = "А потом село солнце."
1300105-118 = "[ns7] «Сегодня мы много ходили.»\n[ns8] «Ну что, появились хорошие идеи?»"
1300105-119 = "..."
1300105-120 = "..."
1300105-121 = "Не знаю, Сенсей."
1300105-122 = "Пока мы гуляли, у меня появилось много идей."
1300105-123 = "Но во всех будто чего-то не хватает."
1300105-124 = "Почему?"
1300105-125 = "[s] «Хм-м, непросто.»"
1300105-126 = "Ага."
1300105-127 = "[s] «Но хотя бы день был весёлым.»"
1300105-128 = "...Весёлым?"
1300105-129 = "[s9] «Я послушал все твои хайку.»\n[s10] «И смог весело прогуляться.»"
1300105-130 = "Весёлая... прогулка..."
1300105-131 = "Весёлая... прогулка..."
1300105-132 = "...Весело."
1300105-133 = "Эм."
1300105-134 = "[s] «Чисэ?»"
1300105-135 = "Пуф! Вдруг пришло в голову."
1300105-136 = "Мне нужно вернуться ради ещё одного хайку."
1300105-137 = ""
1300105-138 = ""
1300105-139 = ""
1300105-140 = "[ns] «П-Погоди! Чисэ?!»"
1300105-142 = "Старое школьное здание Хяккияко 3"
1300105-143 = "Не знаю, сколько я гнался за Чисэ. Она бегала вокруг, повторяя, что кое-что придумала."
1300105-144 = "[s] «Это старое школьное здание Хяккияко?»"
1300105-145 = "Сенсей, сюда. Здесь."
1300105-150 = "― Добро пожаловать, Сенсей.[wa:2110]"
1300105-152 = "― Здесь тихо...[wa:950]"
1300105-155 = "― Идеально для хайку.[wa:1570]"
1300105-158 = "― Сенсей, провести время с тобой[wa:550]"
1300105-160 = "― было очень весело.[wa:290]"
1300105-163 = "― И благодаря этому я кое-что поняла.[wa:1280]"
1300105-165 = "― Я хочу написать хайку...[wa:4460]"
1300105-168 = "― О чувствах,[wa:2470]"
1300105-170 = "― которые испытала сегодня."
1300105-173 = "После заката"
1300105-175 = "#nтихие шаги двоих"
1300105-177 = "#n #nвсё продолжаются"
1300105-180 = "― Думаю, пока я с тобой, Сенсей,[wa:2300]"
1300105-182 = "― я смогу и дальше писать такие искренние хайку."
1300105-185 = "― Давай ещё погуляем вместе, хорошо?[wa:1380]"
1300105-188 = "― О... Сенсей, посмотри туда.[wa:2900]"
1300105-191 = "[ns] «А? Туда... Ты про луну?»"
1300105-192 = "― Разве луна не прекрасна?[wa:2060]"
1300105-195 = "[ns] «Погоди, Чисэ. Ты хочешь сказать...?»"
1300105-196 = "― Она и правда прекрасна...[wa:1640]"
1300105-199 = "[ns] «Некоторые вещи прекрасны и без хайку, которое их описывает.»"
1300105-201 = "[ns11] «Да, всё как ты сказала...»\n[ns12] «Луна прекрасна.»"
1300105-205 = "Я сел рядом с Чисэ, и некоторое время мы вместе смотрели на луну."
