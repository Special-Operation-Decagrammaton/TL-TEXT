103130-280 = "Вот что значит быть отважным героем...?"
103130-283 = "...Вы не можете исчезнуть. Я этого не хочу."
103130-284 = "Нет. Вы не умрёте. Я не позволю этому случиться."
103130-287 = "Исчезнуть должен не герой, а орудие, предназначенное для уничтожения мира."
103130-288 = "Так и должно быть..."
103130-291 = "С вами всё будет хорошо, принцесса."
103130-293 = "И ещё..."
103130-294 = "Не чувствуйте вины из-за меня."
