103130-251 = "Теперь я..."
103130-253 = "...Мне очень жаль."
103130-254 = ""
103130-256 = ""
103130-273 = "...Принцесса."
103130-274 = "Вы знали, насколько опасно использовать эту силу..."
103130-275 = "..."
103130-276 = "Хотя это могло разрушить вашу жизнь... стереть само ваше существование..."
