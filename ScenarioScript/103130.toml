[translation]
103130-1 = "Эпизод 13;Право света 2"
103130-2 = "...Началось."
103130-3 = "Основная концепция Ковчега Атрахасис — собирать и преобразовывать окружающие данные."
103130-4 = "Более того, если вмешивается не копия, а оригинал... то, независимо от многомерного анализа, мы должны суметь пробить этот барьер."
103130-6 = "Тогда Ковчег, который собирались создать из данных Города-крепости, был похож на гигантское убежище."
103130-7 = "Наверное, потому что он был построен на основе Города-крепости, отражавшего страхи в твоём сердце, Рио."
103130-8 = "...О, тогда каким будет Ковчег, который сейчас создаёт Алиса...?"
103130-9 = "Хи-хи. Разве ответ не очевиден?"
103130-10 = ""
103130-12 = ""
103130-20 = "Данные Утнапиштим разбираются и перестраиваются в одном месте! Это точно нормально?"
103130-21 = "Э-Это...?!"
103130-22 = "Для пушки это слишком огромное... Неужели...?!"
103130-23 = "А? Это же шедевр Инженерного отдела..."
103130-24 = "Но он гораздо, гораздо больше!"
103130-25 = "Это..."
103130-26 = "Меч Света?!"
103130-28 = "Это и есть настоящий Ковчег Атрахасис — доказательство героя, рождённое сердцем Алисы."
103130-29 = "Верно. Если бы мне пришлось дать ему имя..."
103130-30 = "Я бы назвала его Меч Света: Атрахасис Super Nova."
103130-32 = "Цель подтверждена. Превышаем порог мощности!"
103130-33 = "Заряд MP... сто процентов! Вперёд!"
103130-34 = "Удар справедливости, сокрушающий зло...!"
103130-35 = ""
103130-38 = "Отличная работа, Арис."
103130-39 = "Я буду болеть за тебя отсюда."
103130-40 = ""
103130-42 = ""
103130-43 = "Вперёд, герой! Спаси наш мир!"
103130-45 = "Конечно! Я никогда не подведу друзей!"
103130-46 = "Све—"
103130-47 = ""
103130-50 = "—ет!!!"
103130-51 = ""
103130-58 = "Высокоэнергетический выброс из Меча Света!!!"
103130-59 = "Выпущенная энергия летит прямо к Ковчегу Атрахасис!"
103130-60 = "Рассчитываю траекторию! Погрешность 0,003%! Всё в пределах нормы!"
103130-61 = "Выпущенная энергия скоро достигнет самого центра Ковчега Атрахасис! Но..."
103130-62 = ""
103130-67 = "Да, но... сможет ли Меч Света пробить многомерный барьер Ковчега?"
103130-68 = ""
103130-76 = ""
103130-78 = "Арис...!"
103130-79 = "Арис—!"
103130-80 = ""
103130-100 = "Попадание! Многомерный барьер разрушен!"
103130-101 = "[s] «Успех!!!»"
103130-102 = "...!!!"
103130-103 = "Невероятно. Мы пробили многомерный барьер, который противоречит известным нам законам физики."
103130-104 = "Многомерный барьер больше не может поддерживать состояние квантовой суперпозиции и разрушается!"
103130-105 = ""
103130-107 = ""
103130-108 = ""
103130-109 = ""
103130-110 = ""
103130-113 = "О-Ох...?!"
103130-114 = "А-Алиса?!"
103130-115 = "Арис! Проснись...!"
103130-117 = "А-Арис? Что с ней?"
103130-118 = "Мы унесём Арис в безопасное место!"
103130-119 = "Что-то случилось? Она в порядке?"
103130-120 = "Н-Нет! Она без сознания, но не ранена!"
103130-121 = "Да, она просто спит... Мы отнесём её в лазарет и присмотрим за ней..."
103130-122 = "Слава богу! Пожалуйста, позаботьтесь о ней!"
103130-123 = ""
103130-129 = "Все, приготовьтесь! Примерно через пять секунд нас накроет ударной волной!"
103130-130 = "Многомерный барьер потерял состояние квантовой суперпозиции! Барьер заклинило!"
103130-131 = "Отлично! Значит, Ковчег теперь беззащитен?"
103130-132 = ""
103130-136 = "А-Ааа!"
103130-137 = "Э-Эй...!"
103130-138 = "Нельзя упускать этот шанс!"
103130-139 = "Ч-Что вы делаете?!"
103130-141 = "Утнапиштим! Полный вперёд, максимальная скорость!"
103130-142 = "Прямо отсюда?!"
103130-144 = "Да! Нам нужно прорваться как можно быстрее, пока враг снова не применил какую-нибудь контрмеру!"
103130-145 = "Хорошо! Поняла!"
103130-146 = "Разгоняемся на максимальной мощности!"
103130-147 = ""
103130-157 = "До столкновения с барьером около трёх секунд!"
103130-158 = "У-Ух... М-Мы успеем?"
103130-159 = "Всё будет хорошо! Благодаря Арис мы отключили барьер!"
103130-160 = "Проходим границу и высаживаемся на Ковчег!"
103130-161 = "В-Вот оно! Держитесь крепче!"
103130-164 = ""
103130-173 = "Мы прошли! Аяна, экстренное торможение!"
103130-174 = "Есть! Активирую последовательность экстренного торможения!"
103130-175 = ""
103130-183 = "Корабль Утнапиштима, обратная тяга на максимальной мощности! Предупреждение о перегрузке двигателя!"
103130-184 = "Скоро столкнёмся с основным корпусом Ковчега! Все, приготовьтесь ко второму удару!"
103130-185 = "Столкновение! Держитесь!"
103130-186 = ""
103130-201 = ""
103130-202 = "..."
103130-203 = "*тяжело дышит*"
103130-204 = "П-Получилось? Мы прошли?"
103130-205 = "Д-Думаю, да."
103130-206 = "М-Мы... внутри Ковчега?"
103130-207 = "Да... Мы наконец проникли внутрь Ковчега."
103130-208 = "[s] «Отличная работа, все!»"
103130-210 = "*вздох* ...Я чуть не умерла от страха...!"
103130-211 = "Я не думала, что всё пройдёт именно так..."
103130-212 = "*вздох* ...Ноги не держат... и дрожат... Мне надо сесть..."
103130-214 = "Мы справились с одним Ковчегом с помощью другого Ковчега... Совершенное безумие."
103130-215 = "Да. Арис действительно спасла мир."
103130-217 = "Арис бы сказала..."
103130-218 = "Она сделала это только благодаря помощи своих друзей."
103130-219 = "..."
103130-220 = "Если точнее, всё получилось благодаря твоей идее, Рио."
103130-221 = "Даже я, прекрасный гений, не додумалась бы до такого."
103130-222 = "... Я..."
103130-223 = "...Пока ещё рано говорить, но если нам удастся спасти мир..."
103130-224 = "Это будет благодаря тебе, Рио."
103130-225 = "[s] «Да, Рио. Ты спасёшь мир.»"
103130-227 = "Я..."
103130-228 = "..."
103130-229 = "..."
103130-230 = ""
103130-232 = ""
103130-233 = "Рио...?"
