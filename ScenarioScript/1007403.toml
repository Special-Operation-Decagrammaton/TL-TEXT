[translation]
1007403-1 = "Нет свидетелей — нет смысла"
1007403-2 = "Я прогуливался по лесу и незаметно забрался гораздо глубже, чем собирался."
1007403-3 = ""
1007403-6 = "Вдалеке послышался шум воды, и я пошёл на звук, надеясь найти водопад."
1007403-7 = "♪~♬~~♪~♬~"
1007403-8 = "[ns1] «Это... пение?»\n[ns2] «Этот голос...»"
1007403-11 = "♪~~~~♬♪~~♬~"
1007403-12 = ""
1007403-15 = "[ns] Пойти на звук пения."
1007403-19 = "А...?"
1007403-20 = "Сенсей...?"
1007403-23 = "― [log=하나코 수영복]Какая удачная случайность — встретить вас здесь.[/log][wa:10]"
1007403-25 = "― [log=하나코 수영복]Или... случайность ли?[/log][wa:1400]"
1007403-28 = "― [log=하나코 수영복]С вами никогда не знаешь наверняка...[/log][wa:10]"
1007403-30 = "― [log=하나코 수영복]Давайте просто спишем это на совпадение.[/log][wa:680]"
1007403-33 = "― [log=하나코 수영복]Хи-хи... Не переживайте так.[/log][wa:2120]"
1007403-35 = "― [log=하나코 수영복]Я всё ещё прилично одета.[/log][wa:1260]"
1007403-38 = "― [log=하나코 수영복]Мне захотелось почувствовать прохладную воду на коже.[/log][wa:460]"
1007403-41 = "― [log=하나코 수영복]Не хотите... присоединиться ко мне?[/log][wa:3980]"
1007403-44 = "― [log=하나코 수영복]Обещаю...[/log][wa:10]"
1007403-46 = "― [log=하나코 수영복]Эта ситуация совсем не похожа на фонтан в Тринити. [/log][wa:2880]"
1007403-49 = "― [log=하나코 수영복]Вокруг никого, и мы на природе...[/log][wa:2900]"
1007403-51 = "― [log=하나코 수영복]Да. Всё именно так, как должно быть, без всяких безвкусных украшений.[/log][wa:4240]"
1007403-54 = "― [log=하나코 수영복]Так что я просто хочу побыть с вами. Здесь, в этот момент.[/log][wa:2540]"
1007403-56 = "― [log=하나코 수영복]...Если вы не против.[/log][wa:1540]"
1007403-59 = "Хи-хи. Наверное, я и не рассчитывала, что вы согласитесь зайти в воду."
1007403-60 = "Как бы ни расслабляла природа, вы всё равно должны соблюдать свои правила как наш учитель."
1007403-61 = "Вы, должно быть, устали... Я ведь уже не впервые вот так задерживаю вас."
1007403-62 = "Забавно: здесь я чувствую себя совсем иначе, а Сенсей всегда остаётся... Сенсеем."
1007403-63 = ""
1007403-65 = ""
1007403-66 = "Я думала застать вас врасплох и заставить хоть немного отпустить себя. Хи-хи."
1007403-67 = "[s3] «Ты никогда меня не утомляешь.»\n[s4] «А вот мысль о том, чтобы оторваться вместе с тобой, меня и правда пугает.»"
1007403-70 = "Да-да. Конечно. Как всегда, одни и те же ответы..."
1007403-71 = "Знаете, Сенсей. Я начинаю думать, что это вы держите меня на расстоянии."
1007403-72 = "...И что это был за смешок?"
1007403-73 = "...Ха-ха. Наверное, мне и правда здесь весело."
1007403-74 = "Правда, Сенсей..."
1007403-75 = "..."
1007403-76 = "Неважно. Думаю, на этот раз оставлю свои мысли при себе."
1007403-77 = "Мне будет грустно прощаться с этим местом."
1007403-78 = "Хотя, думаю, у нас ещё осталось немного времени."
1007403-79 = "...О чём это я? Хи-хи. Хотите узнать?"
1007403-80 = "Немного неловко говорить это вслух. Подойдите ближе, я прошепчу."
1007403-81 = "[s5] «...?»\n[s6] Подойти к Ханако."
1007403-82 = ""
1007403-83 = ""
1007403-85 = ""
1007403-87 = "Хи-хи."
1007403-88 = ""
1007403-90 = ""
1007403-91 = "Ях!"
1007403-92 = ""
1007403-96 = "Хи-хи-хи. Теперь вы весь мокрый, Сенсей!"
1007403-97 = "Ах. Так гораздо лучше."
1007403-98 = "Теперь такое чувство, будто..."
1007403-99 = "Мы в равных условиях."
