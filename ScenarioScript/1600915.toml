[translation]
1600915-1 = "Девушка-ниндзя хочет, чтобы её запомнили!"
1600915-2 = "Вход в торговый район"
1600915-3 = "Фуфу, вы пришли, достопочтенный Сенсей."
1600915-4 = "Естественно, тех, кто идёт по пути ниндзя, тянет к таким вещам..."
1600915-5 = "[s] «Я тоже иду по этому пути?!»"
1600915-6 = "Фуфу, чему вы так удивляетесь, Сенсей?!"
1600915-7 = "В любом случае, древний носитель записи, который я принесла...!"
1600915-8 = "Вот это!"
1600915-9 = ""
1600915-12 = "[ns] «...Видеокассета?!»"
1600915-13 = "Именно, Сенсей."
1600915-14 = "Вы правы. Это... древний носитель записи, который больше не используется... Реликвия под названием «видеокассета»!"
1600915-15 = "[s1] «Она определённо старая...»\n[s2] «Но что на ней записано?»"
1600915-18 = "Фуфу, любопытно? Естественно."
1600915-19 = "На этой кассете..."
1600915-20 = "...находится..."
1600915-21 = "[s] «Домашнее видео с твоими первыми шагами?»"
1600915-22 = "А! Ничего подобного!"
1600915-23 = "Почему это вообще первое, что пришло вам в голову?"
1600915-24 = "[s] «Эх, жаль...»"
1600915-25 = "Чему вы вообще расстроились?!"
1600915-26 = "В-В любом случае, на этой кассете...!"
1600915-27 = "...То, что знает достопочтенный Сенсей — нет, ВООБЩЕ любой, кто идёт по пути ниндзя..."
1600915-28 = "Это копия самой ранней работы уважаемого режиссёра Кроу Нян-Няна... снятая в чёрно-белом формате... Вы же знаете, что это..."
1600915-29 = "...«Три ниндзя из скрытого класса»!"
1600915-30 = ""
1600915-33 = "[ns] «А. Понятно...»"
1600915-34 = "Что за отсутствие энтузиазма?"
1600915-35 = "В такие моменты настоящие ниндзя говорят: «Так ты тоже знаком!» — обмениваются взглядами, лёгкими улыбками и короткими кивками узнавания."
1600915-36 = "О... Вы впервые о нём слышите?"
1600915-37 = "Я-я понимаю, работы Кроу Нян-Няна немного винтажные... Поэтому вся эта классика снята в чёрно-белом и её так трудно найти."
1600915-38 = "Но всё же, вы ведь обращали внимание на уроках!"
1600915-39 = "[s] «Разве этому вообще должны учить в школе?!»"
1600915-40 = "Хм! Не могу поверить, что вы до сих пор не посмотрели «Трёх ниндзя из скрытого класса»..."
1600915-41 = "Достопочтенный Сенсей, это трагедия, что вы прожили столько лет, не испытав такой радости."
1600915-42 = "Он просто настолько... хорош."
1600915-43 = "[s] «Это настолько важно...?»"
1600915-44 = "Конечно."
1600915-45 = "Потому что... именно этот фильм поставил меня на путь ниндзя!"
1600915-46 = "[s3] «Эта видеокассета сделала тебя ниндзя...?»\n[s4] «Теперь это внезапно звучит невероятно!»"
1600915-49 = "Ня-ха-ха! Правда? Правда?"
1600915-50 = "[s] «Может, устроим просмотр прямо сейчас?»"
1600915-51 = "Как бы мне ни хотелось поставить экран посреди улицы и застать всех врасплох этим великолепием..."
1600915-52 = "...Сегодня этого не будет. Я здесь по другой причине."
1600915-53 = "Видите ли, я пришла сделать копию этой кассеты. Настоящий ниндзя всегда имеет резервную копию."
1600915-54 = "[s] «Резервную копию?»"
1600915-55 = "Я слышала, что ближайшее фотоателье запустило новую услугу..."
1600915-56 = "...Они могут архивировать и оцифровывать старые видеокассеты. Представьте, я смогу сохранить копию на компьютер! В облако!"
1600915-57 = "Тогда этот фильм будет доступен в любое время, в любом месте и невероятно легко."
1600915-58 = "Вот почему я принесла кассету."
1600915-59 = "Считайте это... процессом сохранения! Драгоценные вещи нужно беречь и защищать."
1600915-60 = "Знаете, это как ниндзя разминали еду и сладости в маленькие шарики, чтобы они хранились месяцами! Даже годами."
1600915-61 = "В общем, мы называем их походными пилюлями... На вкус они... своеобразные."
1600915-62 = "[s] «Ну тогда! Пойдём!»"
1600915-63 = "А! Это моя реплика!"
1600915-66 = ""
1600915-67 = ""
1600915-69 = "Не уверен насчёт этой кассеты. Будет сложно."
1600915-70 = "П-Почему...?!"
1600915-71 = "Я взяла недостаточно денег?"
1600915-72 = "Нет, дело не в деньгах. В самой кассете."
1600915-73 = "Я не могу извлечь с неё данные."
1600915-74 = "[s] «Есть какие-нибудь другие способы?»"
1600915-75 = "Эх, понимаете, проблема вот в чём... Эта кассета СТАРАЯ."
1600915-76 = "И она уже сильно физически разрушилась."
1600915-77 = "Когда состояние настолько плохое, я ничего не могу сделать."
1600915-78 = ""
1600915-80 = ""
1600915-81 = "Уф... Понятно."
1600915-82 = "Что ж, мы попытались. Пойдёмте, достопочтенный Сенсей."
1600915-83 = ""
1600915-85 = ""
1600915-87 = "*вздыхает* Как жаль."
1600915-88 = "[s] «Ты на удивление спокойна, Мичиру.»"
1600915-89 = "Хм? А, я знала, что кассета сломана. Уже давно."
1600915-90 = "[s] «...Ты знала?»"
1600915-91 = "Конечно. Я прокручивала эту кассету сотни раз."
1600915-92 = "Со временем заметила, что фильм... стал воспроизводиться неправильно."
1600915-93 = "Я надеялась, что профессионалы что-нибудь придумают... Но, похоже, нет."
1600915-94 = "[s] «Разве ты... не расстроена?»"
1600915-95 = "Ня-ха-ха! Конечно расстроена!"
1600915-96 = "Некоторые из моих самых дорогих воспоминаний теперь запечатаны в этом прямоугольном свитке. Конечно мне грустно!"
1600915-97 = "...И другую копию найти почти невозможно."
1600915-98 = "[s] «Мичиру...»"
1600915-99 = "Иногда я думаю об этом, достопочтенный Сенсей..."
1600915-100 = "Вот бы я делилась этой радостью с другими..."
1600915-101 = "Вот бы я советовала фильм большему числу людей и позволила им разделить это воспоминание со мной. Вот бы я не берегла его настолько, что оставила только себе..."
1600915-102 = "...Такие вот мысли."
1600915-103 = "[s] Молча погладить Мичиру по голове."
1600915-104 = "Хи-хи, спасибо, достопочтенный Сенсей."
1600915-105 = "..."
1600915-106 = "А! Если подумать, тот магазин ниндзюцу, куда мы ходили в прошлый раз, всего в паре кварталов!"
1600915-107 = "[s] «Какой МГНОВЕННЫЙ переход!»"
1600915-108 = "Ничего не могу поделать! Я ещё слышала, что у хозяина есть и «Зловещий Мураматлинг», И настоящий «Зловещий Масамунад», легендарная проклятая злая граната!"
1600915-110 = "Масамунад часто критикуют за копирование Мураматлинга под предлогом оммажа. Но для меня они совершенно разные. Он сам по себе культовый!"
1600915-112 = "Мы гуляли по торговому району, пока Мичиру взволнованно пересказывала лор ниндзя."
1600915-114 = "...Всё это время она крепко прижимала кассету к груди."
