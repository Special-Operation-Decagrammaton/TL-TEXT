[translation]
1014803-1 = "Ausflüglerin and a Special Summer Vacation"
1014803-3 = "[ns1] \"Hehehe!\"\n[ns2] \"Gotcha!\""
1014803-6 = "...I'm glad you seem to be having fun, Sensei."
1014803-7 = "I never imagined I’d be brought right out to the sea like this…"
1014803-8 = "You're not going to say you've already achieved your goal, are you?"
1014803-9 = "[s3] \"It's a special summer vacation, after all.\"\n[s4] \"We have to do something special!\""
1014803-12 = "I did think you were acting awfully enthusiastic, but..."
1014803-13 = "So that's what it was..."
1014803-14 = "So. Why Toramaru?"
1014803-15 = "Doesn't it have nothing to do with the sea?"
1014803-16 = "[s5] \"No?\"\n[s6] \"When you think of the summer sea, you think of tanks! That's common sense, right?\""
1014803-19 = "You're saying things like those winged girls..."
1014803-20 = "Well, since we came all this way."
1014803-24 = "It would be a waste to go home just like this."
1014803-25 = "I'll keep you company just for today."
1014803-27 = "(After a while...)"
1014803-29 = "..."
1014803-33 = "..."
1014803-34 = "[s7] \"We're at the sea, and yet...\"\n[s8] \"Isn't that just the same as always?\""
1014803-37 = "I think it's completely different."
1014803-38 = "Even if it's the same reading, it becomes special if the location is different."
1014803-39 = "To begin with, you thought—I was going to play in the water, didn't you."
1014803-40 = "I appreciate the thought, but I think I'll just enjoy myself like this. #nIt's not often I get to read a book in a place like this."
1014803-41 = "..."
1014803-46 = "..."
1014803-47 = "[s9] \"Aren't you hungry? Aren't you thirsty?\"\n[s10] (Before she gets too deep on her reading...!)"
1014803-52 = "...Haa. I did say I'd keep you company today."
1014803-56 = "Shall we at least take a walk?"
1014803-59 = "Welcome!"
1014803-60 = "There's a lot of stuff here."
1014803-64 = "...Then I'll have an iced coffee."
1014803-69 = "[ns11] \"...Is that all?\"\n[ns12] \"You can order more.\""
1014803-72 = "No, I'm fine."
1014803-73 = "I'm not hungry, and I have potato chips when we get back."
1014803-74 = "Besides—"
1014803-79 = "Eating in places like this... isn't really to my liking."
1014803-81 = "Here, one iced coffee!"
1014803-88 = "...Thanks."
1014803-89 = "This is more than enough."
1014803-91 = "(We continued our walk after that)"
1014803-92 = "(And then...)"
1014803-95 = "..."
1014803-99 = "..."
1014803-100 = "[s13] \"She went back to reading...\"\n[s14] \"It's exactly the same as earlier, no?\""
1014803-103 = "It's completely different."
1014803-104 = "An iced coffee. A floaty that's just right for resting my arms. #nPlus, there's even a large parasol."
1014803-105 = "This is surprisingly nice in its own way."
1014803-110 = "(I enjoyed reading together with Iroha until the sun went down.)"