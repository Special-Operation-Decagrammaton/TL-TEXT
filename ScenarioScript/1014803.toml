[translation]
1014803-1 = "Ausflug and a Special Summer Vacation"
1014803-3 = "[ns1] \"Heh heh heh!\"\n[ns2] \"Gotcha!\""
1014803-6 = "……I'm just glad you're having fun, Sensei."
1014803-7 = "I never expected to be dragged all the way to the beach like this……."
1014803-8 = "You aren't going to tell me that our goal has already been achieved, are you?"
1014803-9 = "[s3] \"Since it's summer vacation, after all.\"\n[s4] \"We have to do something special!\""
1014803-12 = "I did think you were acting awfully enthusiastic, but……."
1014803-13 = "So that's what this is about……."
1014803-14 = "And why bring Toramaru?"
1014803-15 = "That doesn't have anything to do with the beach, does it?"
1014803-16 = "[s5] \"What do you mean?\"\n[s6] \"Tanks and the summer beach go hand in hand! It's common sense, right?\""
1014803-19 = "You sound just like those winged ones……."
1014803-20 = "Well, since we're already here."
1014803-24 = "It would be a waste to just go home now."
1014803-25 = "I'll humor you for today."
1014803-27 = "(A while later……)"
1014803-29 = "……."
1014803-33 = "……."
1014803-34 = "[s7] \"But we're at the beach…….\"\n[s8] \"Isn't this just the same as always?\""
1014803-37 = "I think it's completely different."
1014803-38 = "Even if it's the same book, it becomes special when the location changes."
1014803-39 = "Besides, you actually thought I would go play in the water, didn't you?"
1014803-40 = "I appreciate the thought, but I think I'll just enjoy things as they are. #nIt's not often I get to read in a place like this."
1014803-41 = "……."
1014803-46 = "……."
1014803-47 = "[s9] \"Aren't you hungry? Thirsty?\"\n[s10] (Before she gets too focused on her book……!)"
1014803-52 = "……*Sigh*. I did say I would humor you today."
1014803-56 = "I suppose we can go for a walk."
1014803-59 = "Welcome!"
1014803-60 = "There's quite a variety here."
1014803-64 = "……Then I'll have an iced coffee."
1014803-69 = "[ns11] \"……Just that?\"\n[ns12] \"You can order more if you want.\""
1014803-72 = "No, I'm fine."
1014803-73 = "I'm not hungry, and I have potato chips back home."
1014803-74 = "Besides—"
1014803-79 = "I don't really care for eating in places like this."
1014803-81 = "Here you go, one iced coffee!"
1014803-88 = "……Thanks."
1014803-89 = "This is plenty."
1014803-91 = "(We continued our walk after that)"
1014803-92 = "(And then……)"
1014803-95 = "……."
1014803-99 = "……."
1014803-100 = "[s13] \"You're back to reading…….\"\n[s14] \"Isn't this the same as before?\""
1014803-103 = "It's completely different."
1014803-104 = "I have an iced coffee, a floatie that's perfect for resting my hands on, #nand even a large parasol."
1014803-105 = "This is actually surprisingly nice."
1014803-110 = "(I enjoyed reading with Iroha until the sun went down)"