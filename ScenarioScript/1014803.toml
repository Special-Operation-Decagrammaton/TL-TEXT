[translation]
1014803-1 = "Неожиданная встреча путешественницы"
1014803-2 = ""
1014803-3 = "[ns1] «Хе-хе-хе!»\n[ns2] «Наконец-то мне удалось застать ТЕБЯ врасплох!»"
1014803-6 = "...Ну да, ну да. Радуйтесь, пока можете."
1014803-7 = "Кого бы не удивило, если бы учитель вдруг ни с того ни с сего потащил его на пляж?"
1014803-8 = "Вы привели меня сюда только ради того, чтобы посмеяться надо мной?"
1014803-9 = "[s3] «Я привёл тебя сюда, потому что сейчас летние каникулы!»\n[s4] «Жалко же проводить их дома!»"
1014803-12 = "...Так вот зачем вы притащили меня в такую даль."
1014803-13 = "..."
1014803-14 = "А как же Торамару?"
1014803-15 = "Зачем вообще тащить танк на пляж?"
1014803-16 = "[s5] «Эм... Пляж же, значит, нужен танк...?»\n[s6] «Танки — непременная часть любого отдыха на пляже»."
1014803-19 = "С каких это ПОР? Говорите прямо как эти пернатые снобы."
1014803-20 = "...Ну ладно, раз уж мы здесь."
1014803-21 = ""
1014803-23 = ""
1014803-24 = "Возвращаться сейчас было бы пустой тратой бензина."
1014803-25 = "Ладно, ладно. Сегодня я подыграю вашему капризу."
1014803-27 = "Некоторое время спустя."
1014803-28 = ""
1014803-29 = "..."
1014803-30 = ""
1014803-32 = ""
1014803-33 = "..."
1014803-34 = "[s7] «Эм, вообще-то мы на пляже...»\n[s8] «Не хочешь заняться чем-нибудь, кроме привычных дел?»"
1014803-37 = "А? Но для меня это совсем не то же самое, что дома."
1014803-38 = "Приятно почитать в другой обстановке."
1014803-39 = "Что? Вы думали, я начну с хихиканьем плескаться в воде?#n...А. Кажется, так и думали."
1014803-40 = "Мне редко удаётся читать в разных местах. Хочу насладиться моментом, пока могу."
1014803-41 = "..."
1014803-42 = ""
1014803-44 = ""
1014803-45 = ""
1014803-46 = "..."
1014803-47 = "[s9] «Может, ты проголодалась? Или хочешь пить?»\n[s10] «(Пока она снова не ушла с головой в книгу...!)»"
1014803-48 = ""
1014803-49 = ""
1014803-51 = ""
1014803-52 = "Я же говорила, что сегодня готова вам подыграть, верно?"
1014803-53 = ""
1014803-55 = ""
1014803-56 = "Хотите немного осмотреться?"
1014803-58 = ""
1014803-59 = "Добро пожаловать! Что будете заказывать?"
1014803-60 = "Ого. Какое большое меню."
1014803-61 = ""
1014803-63 = ""
1014803-64 = "...Мне один кофе со льдом, пожалуйста."
1014803-65 = ""
1014803-67 = ""
1014803-68 = ""
1014803-69 = "[ns11] «...И всё?»\n[ns12] «Можешь заказать всё, что захочешь»."
1014803-72 = "Хм... Спасибо, но пока воздержусь."
1014803-73 = "Я ещё не особо голодна, да и в сумке у меня есть чипсы."
1014803-74 = "К тому же..."
1014803-75 = ""
1014803-77 = ""
1014803-79 = "Только никому не говорите, но я не люблю покупать еду в таких местах."
1014803-81 = "Ваш кофе со льдом!"
1014803-82 = ""
1014803-85 = ""
1014803-86 = ""
1014803-87 = ""
1014803-88 = "...*кашель*"
1014803-89 = "Кхм! Мне достаточно одного кофе. Спасибо."
1014803-91 = "Мы с Ирохой обошли несколько популярных мест на пляже."
1014803-92 = "А потом..."
1014803-95 = "..."
1014803-96 = ""
1014803-98 = ""
1014803-99 = "..."
1014803-100 = "[s13] «...И-и-и мы вернулись?»\n[s14] «Значит, опять будем читать»."
1014803-103 = "М-м? Вовсе нет."
1014803-104 = "В отличие от прошлого раза, теперь у меня есть кофе со льдом, плавательный круг, на который удобно положить книгу, и даже большой пляжный зонт."
1014803-105 = "Я обещала вам подыграть, но всё это оказалось куда приятнее, чем я ожидала."
1014803-106 = ""
1014803-108 = ""
1014803-110 = "Так что я сдался, лёг рядом с Ирохой и читал вместе с ней до самого заката."
