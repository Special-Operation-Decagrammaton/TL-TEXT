[translation]
10053010-1 = "Эпизод 1;Недопонимание и ещё одно недопонимание"
10053010-2 = "Огромное спасибо! Я тебе по гроб жизни обязана! Только не спали тут всё и НЕ ТРОГАЙ мой стол!"
10053010-3 = ""
10053010-5 = ""
10053010-6 = ""
10053010-7 = "Что ещё?"
10053010-8 = "Я еду в поездку. В поля, на природу. В ОЧЕНЬ глухое место."
10053010-9 = "Если через неделю не вернусь, считайте, что меня больше нет. Не ищите и для— выберите фото получше—"
10053010-10 = "О, а это кто? Такое лицо я бы точно запомнила."
10053010-11 = "Если бы ты не ворвалась с криками, я бы вас познакомила."
10053010-12 = "Это Сенсей [USERNAME]. Из Шале."
10053010-13 = "Сенсей, эта нарушительница спокойствия — заместитель директора Бюро общественной безопасности, Шима Коноха."
10053010-14 = ""
10053010-16 = "О-о! Так ВОТ он какой, Сенсей! Я о вас слышала от нашей главной шишки!"
10053010-17 = "...? Но почему она надела на вас наручники?"
10053010-18 = "[s1] «Эм... Надеюсь, ты не поймёшь неправильно.»\n[s2] «Можно сказать, произошло небольшое... недоразумение.»"
10053010-21 = ""
10053010-23 = ""
10053010-24 = ""
10053010-25 = "Их поймали с чужим школьным альбомом одного конкретного студента, который они незаконно хранили и перевозили. Не думаю, что здесь есть какое-то «недоразумение»."
10053010-26 = "Ну, учитывая, что это вы, Сенсей, уверена, ваши намерения... были благими..."
10053010-27 = "..."
10053010-28 = "Я свяжусь с пострадавшей, объясню ситуацию и решу, нужны ли дальнейшие меры."
10053010-29 = "[s3] «Всё нормально! Мне нечего скрывать!»\n[s4] «Иори поймёт!»"
10053010-32 = "*вздох* Сенсей, учитывая, что вы, строго говоря, публичная фигура, я была бы признательна, если бы вы не привлекали к себе подобное внимание..."
10053010-33 = "Но сначала к главному, Коноха."
10053010-34 = "Что ты там говорила про поездку?"
10053010-35 = "А, дело в том..."
10053010-36 = "Надеюсь, ТЫ тоже не поймёшь неправильно. И не будешь осуждать..."
10053010-37 = ""
10053010-40 = "Но у меня всего одна неделя, чтобы поймать Цучиноко!"
10053010-41 = ""
10053010-43 = ""
10053010-44 = ""
10053010-45 = "...Ах. Ну как я вообще могла бы понять это неправильно?"
10053010-46 = "Просто из вежливости уточню. Это та самая «Цучиноко», о которой я знаю, или какое-то преступное кодовое имя?"
10053010-47 = "Да! Именно ТА Цучиноко! Знаменитая. Змея."
10053010-48 = "...Мифическое существо? Криптид?"
10053010-49 = "Точно! Неуловимая легенда, существо, о котором часто говорят, которое иногда видят, но, несмотря на награды, конкурсы и реалити-шоу... так и не поймали!"
10053010-50 = "Сейчас общая награда составляет 100 миллионов иен! Можно сказать, это ходячая — то есть ПОЛЗАЮЩАЯ — золотая трубка!"
10053010-51 = "...Да."
10053010-52 = "Теперь я понимаю, что тема может быть деликатной."
10053010-53 = "Коноха, тебе срочно нужны деньги?"
10053010-54 = "А? За кого ты меня принимаешь? Правда думаешь, что я из тех, кто гонится за лёгкой иеной?"
10053010-55 = "Полагаю, нет."
10053010-56 = "Тогда... Наверное, опять твои суеверия."
10053010-57 = "Да ладно. Я разве ещё не заработала достаточно стажа, чтобы обойтись без допроса? Посмотри, сколько отпускных дней у меня накопилось."
10053010-58 = "А, не переживай. Я и не собиралась тебя останавливать."
10053010-59 = "Вообще-то ты склонна доводить себя до изнеможения. Если наконец решила отдохнуть, я не стану мешать."
10053010-60 = "Однако..."
10053010-61 = "Однако?"
10053010-62 = "Если уж собираешься гоняться за какой-то дикой змеёй, возьми с собой Сенсея."
10053010-63 = "А?"
10053010-64 = "[s] «...А? Меня?»"
10053010-65 = "Сенсей, можно вас на минуту?"
10053010-67 = ""
10053010-68 = ""
10053010-69 = "Если вы сопроводите Коноху в этой поездке, я закрою сегодняшнее расследование и отпущу вас."
10053010-70 = "[s5] «Ты закроешь дело?!»\n[s6] «Но я невиновен! Дай мне поговорить с Иори!»"
10053010-73 = "Нет. Дело не в этом. Считайте это личной просьбой."
10053010-74 = "...Коноха на самом деле не нарушительница спокойствия. Конечно, я не могу сказать, что у неё безупречная репутация..."
10053010-75 = "Но она усерднее, чем кажется, и заслуживает должности заместителя директора, несмотря на то что учится лишь на втором курсе. В отличие от меня, она общительная и подчинённые её любят."
10053010-76 = "Но у неё есть склонность сходить с у... то есть чрезмерно увлекаться чем-то одним."
10053010-77 = ""
10053010-79 = "Суевериями."
10053010-82 = ""
10053010-84 = "Ого, не думала, что знаменитый Сенсей присоединится ко мне!"
10053010-85 = "А, в качестве «меры предосторожности»? Канна и правда слишком меня опекает."
10053010-86 = "Но всё равно я чувствую себя очень любимой!"
10053010-87 = "Не думаете? Ха! Ха-ха-ха!"
10053010-88 = "[s7] «Д-Да!»\n[s8] «(Она больше переживает о том, как защитить мир от тебя...)»"
10053010-91 = "О, надо сказать остальным! Скоро вы с ними познакомитесь и наверняка полюбите."
10053010-92 = "Вы ведь понимали, да? Я не собиралась одна охотиться в глуши."
10053010-93 = "Мы встретимся с Гурумин и директором Мо."
10053010-94 = "[s9] «Гурумин и директор Мо...?»\n[s10] «Какие необычные имена...»"
10053010-97 = "А, это не имена, а ID, ники, псевдонимы. Ну, вы поняли."
10053010-98 = "[s11] «Ты познакомилась с ними в интернете?»\n[s12] «А если они опасные люди...?»"
10053010-101 = "Что?"
10053010-102 = "..."
10053010-103 = "Пф! Ха-ха-ха!"
10053010-104 = "Ой, простите. Не стоило так громко смеяться. Увидите их — сами поймёте."
10053010-105 = "Сенсей, как думаете, чем я занимаюсь в Валькирии?"
10053010-106 = "Так называемые «опасные люди» сами должны меня бояться."
10053010-107 = "Ни секунды не переживайте. Я знаю девочек, с которыми мы встречаемся. Они отличные."
10053010-108 = "Серьёзно, мы ещё и взаимно подписаны друг на друга в соцсетях. Даже встречались лично несколько раз."
10053010-109 = "Вы вообще интересуетесь таким, Сенсей? Ну... паранормальным?"
10053010-110 = "Вот, взгляните на этот аккаунт. Они занимаются городскими легендами и нераскрытыми тайнами! Круто, да?"
10053010-111 = "Сначала я использовала его, чтобы следить за обстановкой. Но, если честно, исследования у них довольно впечатляющие..."
10053010-112 = ""
10053010-114 = ""
10053010-115 = ""
10053010-116 = "А, мы приехали! Остальное расскажу потом."
10053010-117 = ""
10053010-124 = ""
10053010-125 = "*шмыг*"
10053010-126 = "Я раньше только слышала об этом. Так ВОТ она какая, сельская местность..."
10053010-127 = ""
10053010-129 = ""
10053010-130 = ""
10053010-131 = "Хорошо. Она здесь."
10053010-132 = "...? Хм. Она привела кого-то с собой?"
10053010-133 = "Похоже на то."
10053010-134 = ""
10053010-136 = ""
10053010-137 = "Извините? Вы двое—"
10053010-138 = ""
10053010-140 = ""
10053010-141 = ""
10053010-142 = "Э, что?! Что?! СЕНСЕЙ?!"
