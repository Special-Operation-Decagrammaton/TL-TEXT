[translation]
2003705-1 = "Полицейская история: эпизод о потерянном рае"
2003705-2 = "Фубуки пригласила меня в «рай.» Я согласился, не зная, чего ожидать..."
2003705-3 = ""
2003705-5 = ""
2003705-6 = ""
2003705-7 = "Я нашёл её лежащей на шезлонге и напевающей себе под нос."
2003705-9 = "[ns1] «Фубуки.»\n[ns2] «Попалась! Опять отлыниваешь!»"
2003705-10 = ""
2003705-11 = ""
2003705-12 = ""
2003705-13 = ""
2003705-14 = ""
2003705-15 = "А, вы меня напугали."
2003705-16 = ""
2003705-17 = "А! Вы меня напугали!"
2003705-18 = "О, это вы, Сенсей. Я уж подумала, что меня правда поймали."
2003705-19 = "[s] «Так это и есть тот „рай“, о котором ты говорила?»"
2003705-20 = "О ней самой."
2003705-21 = "Открытый детский бассейн, спрятанный здесь, в самом дальнем уголке парка."
2003705-22 = "Все дети ходят в крытый детский бассейн, а взрослые сюда вообще не заходят."
2003705-23 = "Так что следить тут не за кем. Можно просто расслабиться."
2003705-24 = "Когда получаешь это назначение, твоя работа — весь день отдыхать здесь, а потом отметиться об окончании смены."
2003705-25 = "А знаете, что самое лучшее?"
2003705-26 = "*помехи* *помехи*"
2003705-27 = "Мы далеко от штаба, поэтому рации здесь почти не работают."
2003705-28 = "[s] «И это самое лучшее...?»"
2003705-29 = "Ага, именно!"
2003705-30 = "Понимаете, управляющий парком любит звонить спасателям, у которых мало работы, и давать им дополнительные поручения."
2003705-31 = "А здесь я могу просто не отвечать и потом сказать, что сигнал был плохой."
2003705-32 = "[s3] «А так вообще можно?»\n[s4] «А если случится что-то срочное?»"
2003705-35 = "Всё нормально. Если бы было СРОЧНО, мне бы позвонили на телефон."
2003705-36 = "А до тех пор... как я и сказала, рай."
2003705-37 = "Вот, для вас тоже есть шезлонг, Сенсей."
2003705-38 = "[s5] «Но я не люблю загорать. Слишком жарко...»\n[s6] «Здесь нет места в тени?»"
2003705-41 = "К сожалению, зонтик сломан, так что от солнца не спрятаться."
2003705-42 = "И да, ждать под солнцем тяжеловато, но..."
2003705-43 = "...лучшего места, чтобы расслабиться, тут всё равно нет."
2003705-44 = "А если станет совсем жарко, у меня здесь холодильник, полный напитков."
2003705-45 = ""
2003705-47 = ""
2003705-48 = "Почему бы вам не взять один?"
2003705-49 = "...Погодите, что?!"
2003705-50 = "Кто оставил холодильник открытым?! Вся газировка тёплая!"
2003705-51 = ""
2003705-53 = ""
2003705-54 = "В-Всё равно... хотя бы расслабиться здесь можно."
2003705-55 = "[s] «...»"
2003705-56 = "Вы опять так на меня смотрите."
2003705-57 = "Никаких обязанностей, никаких приказов. Ага, настоящий рай."
2003705-58 = "Вот, смотрите."
2003705-59 = "Представьте, как здорово просто лечь на шезлонг и вздремнуть..."
2003705-60 = ""
2003705-62 = ""
2003705-63 = ""
2003705-64 = "Ай, горячо!"
2003705-65 = "Наверное, он успел нагреться, пока мы разговаривали."
2003705-66 = "[s] «...»"
2003705-67 = ""
2003705-69 = ""
2003705-70 = ""
2003705-71 = ""
2003705-72 = ""
2003705-73 = "Но если серьёзно, здесь же здорово, правда?"
2003705-74 = "[ns7] «(Вынужден лежать и пить тёплую колу...)»\n[ns8] «(Как же неудобно...)»"
2003705-77 = "Не работать — это, эм, здорово... Я прямо... счастлива, честно..."
2003705-78 = "П-Правда ведь, Сенсей?"
2003705-79 = "[s] «Думаю, немного поработать было бы приятнее.»"
2003705-80 = "Да ну! Мне сейчас невероятно удобно! Это... просто великолепно!"
2003705-81 = "Если вам здесь что-то не нравится, даже не знаю, что сказать, Сенсей!"
2003705-82 = "Вот увидите! Я могу так бездельничать часами!"
2003705-84 = "Пару часов спустя..."
2003705-85 = ""
2003705-87 = ""
2003705-88 = "Угх..."
2003705-89 = "Если честно, я уже немного, эм, немного устала..."
2003705-90 = "Но я-то лежу, пока все остальные работают, значит, всё равно выигрываю, верно?"
2003705-91 = "Ведь что такое рай, если не это?"
2003705-92 = "*помехи* *помехи*"
2003705-93 = "[s] «Наверное, это тебя вызывают.»"
2003705-94 = "Да нет, оно уже давно так трещит. Просто игнорируйте. Наверняка ищут кого-нибудь, кто ничем не занят."
2003705-95 = "А мы совершенно заняты отдыхом..."
2003705-96 = "*динь*"
2003705-97 = "А?"
2003705-98 = "О, мне кто-то написал. Секунду..."
2003705-99 = ""
2003705-101 = ""
2003705-102 = ""
2003705-103 = "Не могли бы вы подойти в комнату отдыха спасателей?"
2003705-104 = "[s] «Звучит срочно. Тебе, наверное, стоит пойти.»"
2003705-105 = "Хм, да, в этот раз они всё-таки связались со мной по телефону..."
2003705-106 = "Наверное, действительно стоит пойти. Вы правы."
2003705-107 = "Н-Но для протокола: я ухожу отсюда не по своей воле."
2003705-111 = "Комната отдыха спасателей аквапарка"
2003705-112 = ""
2003705-113 = "Приветики."
2003705-114 = "Ого, кондиционер так сильно дует... Наконец-то можно дышать..."
2003705-115 = "О, наконец-то пришла."
2003705-116 = "Я вызывала тебя по рации. Почему так долго?"
2003705-117 = "Ну, мой рай, то есть рабочий участок... довольно далеко отсюда, поэтому сигнал был плохой."
2003705-118 = "Но всё это время я выполняла свои обязанности."
2003705-119 = "Даже без указаний я усердно работала и исполняла обязанности спасателя!"
2003705-120 = "Ой, а я и не знала!"
2003705-121 = "Если бы знала, сразу бы позвонила на телефон!"
2003705-122 = "Не ожидала, что ты будешь работать даже во время перерыва!"
2003705-123 = "Ну, я просто делала то, что должна была—"
2003705-124 = ""
2003705-126 = ""
2003705-127 = "А?"
2003705-128 = "Видишь ли, последний час у меня был перерыв."
2003705-129 = "Я принесла пончики, чтобы угостить всех за хорошую работу... а потом поняла, что один человек ничего не получил."
2003705-130 = "Пончики?!"
2003705-131 = "К сожалению, пока я это поняла, их уже все съели."
2003705-132 = "Но у нас есть холодные напитки— Нет, и они тоже закончились."
2003705-133 = "Э-Это..."
2003705-134 = "Ну послушай. Даже без перерыва ты ведь всё это время усердно работала ради парка, правда?"
2003705-135 = "Давайте все поаплодируем Фубуки, которая ради нас работала даже во время своего перерыва!"
2003705-136 = ""
2003705-138 = ""
2003705-140 = "Образцовый спасатель во всех отношениях! Нэмугаки Фубуки!"
2003705-141 = "Эм... Н-Ну, я... я вообще-то не это... имела в виду..."
2003705-142 = ""
2003705-145 = "Угх..."
2003705-146 = "Что я вообще тут делаю...?"
