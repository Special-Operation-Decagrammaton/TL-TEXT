[translation]
10050010-1 = "Эпизод 1;Купи две — получи третью бесплатно"
10050010-5 = ""
10050010-6 = "..."
10050010-7 = "..."
10050010-8 = "А-алло? Нам... можно?"
10050010-9 = "Т-так... В некоторых округах можно просто свободно входить на территорию кампуса и выходить с неё."
10050010-10 = "Хм. А я-то представляла двенадцатиэтапный досмотр. Я даже продумала наш дерзкий побег, приправленный небольшой взяткой и парой фальшивых личностей."
10050010-11 = "...Вы собирались прибегнуть к настолько нечестным методам, президент?"
10050010-12 = "Нечестным? В каждом плане нужно учитывать худший сценарий и путь отхода."
10050010-13 = "В принципе, я согласна..."
10050010-14 = "Но всё же мы вошли так легко, будто шагнули в другое измерение."
10050010-15 = "А вот что ТОЧНО реально — так это этот тираж, от которого нужно избавиться... Кхм, продать. Этот тираж, который нам нужно продать."
10050010-16 = "Какая разница, если это VR? Тогда я просто соберу всю виртуальную валюту, какую смогу!"
10050010-17 = ""
10050010-22 = ""
10050010-23 = "Здравствуйте. Могу я вам чем-нибудь помочь? Кажется, мы раньше не встречались."
10050010-24 = "Ч-что нам делать, президент?!"
10050010-25 = "..."
10050010-26 = "О, здравствуйте. Должно быть, сама судьба свела нас. Мы с моей очаровательной спутницей из Федеральной академии «Красная Зима» и пришли в Тринити, чтобы... конечно же, осмотреть школу!"
10050010-27 = "В-вы сразу же раскрыли все карты!"
10050010-28 = "Не нервничай, Таканэ. Максимум, что они могут, — попросить нас уйти."
10050010-29 = "Именно попытки скрыть правду обычно и приводят к раздражающим недоразумениям."
10050010-30 = "Красная Зима! Как интересно. Очень приятно познакомиться. Я слышала... весьма занятные вещи о вашей школе."
10050010-31 = "Правда ли, что ваши тренировки включают бои с медведями в снегу?"
10050010-32 = "Я-я не знаю никого, кто... так делает...?"
10050010-33 = "Кивай и улыбайся, Таканэ. Кивай и улыбайся."
10050010-34 = "Т-так и есть! Бои с медведями! Ахаха! Хаха! В любом случае, признаю нашу невежливость: мы явились в Общую школу Тринити без предупреждения."
10050010-35 = "Не могли бы вы найти в себе силы простить нас?"
10050010-36 = "О нет! Ничего страшного. Пожалуйста, чувствуйте себя как дома."
10050010-37 = "Признаюсь, в слухах о Тринити есть доля правды. Иногда мы бываем немного... избалованными."
10050010-38 = "Но не все. И мы все стараемся меняться настолько, насколько можем."
10050010-39 = "Даже будучи одной из трёх крупнейших академий, мы стремимся относиться к ученикам других школ с добротой."
10050010-40 = "Нам повезло встретить вас! Ещё один вопрос: вы случайно любите книги? Хорошие сюжеты?"
10050010-41 = "Книги? Да, среди учеников Тринити это распространённое увлечение. А ещё в часовне мы обязаны читать священные писания."
10050010-42 = "Кроме того, Центральная библиотека Тринити — одна из крупнейших в Кивотосе! Здесь наверняка можно найти почти любую книгу, когда-либо изданную в Академгороде."
10050010-43 = "Мне нравится ход ваших мыслей! Видите ли, сегодня я принесла вам... особенную книгу."
10050010-44 = ""
10050010-46 = ""
10050010-48 = "Ну же, почему бы вам не заглянуть? Разве вам не любопытно, какие книги бывают в Красной Зиме?"
10050010-49 = "О? Похоже, госпожа Удача и правда улыбнулась мне, когда наши пути пересеклись. С удовольствием посмотрю, какая у вас литература."
10050010-50 = "Тогда посмотрим..."
10050010-51 = ""
10050010-53 = ""
10050010-54 = ""
10050010-55 = "С-содержание этой книги...!"
10050010-56 = "(падает в обморок)"
10050010-57 = ""
10050010-59 = ""
10050010-61 = ""
10050010-62 = "Президент? Что только что произошло?"
10050010-63 = "У меня ответов примерно столько же, сколько у тебя..."
10050010-64 = "Для начала приведём её в чувство. Этот компот — особый, от ребят из №227. Должен сработать."
10050010-65 = "Угх...?! О-ох, боже. Как крепко... Это точно меня разбудило, спасибо. Эм, но важнее другое — эта книга..."
10050010-66 = "..."
10050010-67 = "Как бы это выразить...? Эм, мне она не не понравилась..."
10050010-68 = "Если уж быть совсем откровенной... возможно, мне даже понравилось..."
10050010-69 = "О-она довольно... откровенная, не так ли?"
10050010-70 = "А? Это...?"
10050010-71 = "(Ого...? В Тринити даже такое считается «откровенным»?)"
10050010-72 = "Мне всегда нравилось, когда в жизни есть немного остроты. Разве это плохо?"
10050010-73 = "А самые важные места всё равно заретушированы! Не волнуйтесь, я позаботилась о цензуре— то есть редактуре!"
10050010-74 = "Д-да, но иногда эта ретушь..."
10050010-75 = "...в каком-то смысле делает отдельные места ещё более откровенными..."
10050010-76 = "Мы говорим на одном языке, дорогой покупатель. Искренне благодарю."
10050010-77 = "(Покупатель...?)"
10050010-78 = "Именно. В таких случаях недосказанность — не просто выбор, а необходимость!"
10050010-79 = "...Творцы всегда пытаются раздвинуть границы... Но за двумя зайцами погонишься — ни одного не поймаешь!"
10050010-80 = "В современном медиапространстве нет ничего важнее, чем оставить место воображению читателя!"
10050010-81 = "П-Правда?!"
10050010-82 = "Подумайте сами. Прелесть воображения в том, что у него нет границ! Для воображения не существует понятия «слишком откровенно»."
10050010-83 = "Оставьте воображению пространство для полёта — и откроете совершенно новый уровень остроты!"
10050010-84 = "Д-да! В этом определённо есть смысл!"
10050010-85 = "...Вы сказали, что «цензурировали» книги, президент?"
10050010-86 = "Редактировала. Я их редактировала."
10050010-87 = "Но..."
10050010-88 = "Если тебе так важно цепляться к словам, то да, я их, можно сказать, цензурировала. Сама понимаешь. Приказ сверху."
10050010-89 = "Но, Таканэ! Настоящий издатель даже цензуру способен обратить себе на пользу при продаже товара."
10050010-90 = "То есть вы «цензурировали» так, чтобы книга стала ещё привлекательнее для покупателей?"
10050010-91 = "И она всё равно остаётся цензурированной, так что начальство никак не сможет придраться."
10050010-92 = "А мы тем временем поставляем довольным покупателям ещё более качественный продукт!"
10050010-93 = "И доказательство прямо перед тобой. Взгляни на этого студента Тринити!"
10050010-94 = "*пых* *пых* *АХ*"
10050010-95 = ""
10050010-97 = ""
10050010-98 = "..."
10050010-99 = "Ваше деловое чутьё не перестаёт меня впечатлять, президент! Вот в этом я могу доверять вам безоговорочно!"
10050010-100 = "Э-эм. Это серия...? Есть ещё?"
10050010-101 = "Да, мой замечательный покупатель! Разумеется, есть!"
10050010-102 = "Кья?!"
10050010-103 = "Книги могут перенести куда угодно, но сами страницы остаются в физическом мире. Естественно, одна книга не может одновременно находиться в двух местах."
10050010-104 = "Похоже, единственное решение этой проблемы — купить ещё одну, не так ли?"
10050010-105 = "Но зачем мне вообще две одинаковые?"
10050010-107 = "Если собираетесь продолжать серию, нет ничего лучше, чем наслаждаться такой книгой вместе с друзьями."
10050010-108 = "Разве не обмен частичками культуры с близкими укрепляет наши связи?"
10050010-109 = "Я-я никогда не думала об этом с такой стороны!"
10050010-110 = "А, раз уж берёте, возьмите ещё одну запасную."
10050010-111 = "Неизвестно, когда мы снова сможем сюда приехать. А вдруг вы порвёте страницу? Или, ещё хуже, кто-нибудь прольёт на неё кофе?"
10050010-112 = "Акх!"
10050010-113 = "Для таких случаев у нас даже есть совершенно новые экземпляры, всё ещё в упаковке."
10050010-114 = "Могу предложить вам купить резервный экземпляр — на всякий случай?"
10050010-115 = "Возможно, вы и сами знаете, но такие вещи принято покупать по три: один себе, один на витрину и один для распространения молвы."
10050010-116 = "(Это правда принято...?)"
10050010-117 = "Н-но разве тогда я не покупаю одну и ту же книгу три раза?"
10050010-118 = "Эй, ты мне нравишься. Если возьмёшь прямо сейчас набор «Купи две — получи третью бесплатно», сделаю скидку 15%!"
10050010-119 = "Берите мои деньги."
10050010-120 = "Спасибо! И обязательно расскажите другим!"
10050010-121 = ""
10050010-123 = ""
10050010-124 = ""
10050010-125 = ""
10050010-126 = "Ну что скажешь, Таканэ?"
10050010-127 = "Хотя мне определённо есть что сказать..."
10050010-128 = "...я вынуждена признать ваши несокрушимые способности продавца."
10050010-129 = "Хе-хе-хе. Засчитаю это как комплимент."
10050010-130 = ""
10050010-132 = ""
10050010-133 = "Тогда начнём? Раскрасим Тринити в цвета Красной Зимы!"
10050010-135 = "...Слышала? Про ту книгу, которая в последнее время стала популярной?"
10050010-136 = "Всегда что-нибудь становится популярным. Ты о чём?"
10050010-137 = "Это..."
10050010-138 = "Oh MY..."
10050010-139 = "Ну как тебе? Вообще-то у меня есть запасной экземпляр..."
10050010-140 = "Тогда можно одолжить? Всего на день."
10050010-141 = "Конечно. Я только рада дать другим возможность прикоснуться к этой красоте."
10050010-143 = "Но это точно нормально? Нам вообще можно читать такие истории..."
10050010-144 = "...Тебе неловко из-за этого?"
10050010-145 = "Нисколько. Любой имеет право наслаждаться подобной красотой."
10050010-146 = "В таком случае я воспользуюсь твоей добротой..."
10050010-147 = ""
10050010-149 = ""
10050010-150 = ""
10050010-151 = ""
10050010-152 = ""
10050010-154 = ""
10050010-155 = "Что это?"
10050010-156 = "Н-надеюсь, ты не подумаешь, что это странно. У меня появилась другая идея для концовки, и я написала свою версию."
10050010-157 = "К-конечно, до оригинала ей далеко..."
10050010-158 = "Я с удовольствием прочитаю. Хочешь вместе?"
10050010-159 = "Да, конечно."
10050010-160 = ""
10050010-162 = ""
10050010-163 = ""
10050010-164 = ""
10050010-165 = ""
10050010-166 = ""
10050010-167 = ""
10050010-168 = ""
10050010-171 = "...Чай превосходный."
10050010-172 = "Спасибо, Нагиса. Достать его было непросто."
10050010-173 = ""
10050010-175 = ""
10050010-177 = "Не удивлена. Вкус, аромат — всё идеально сбалансировано. Смесь эрл грея на основе дарджилинга?"
10050010-178 = "Пряный цитрусовый аромат, проступающий из-за лёгкой ноты зелёного винограда, оставляет сильное впечатление. Это доказывает, что бергамотовое масло свежее."
10050010-179 = "Правда, тебе, должно быть, пришлось немало постараться. Спасибо."
10050010-180 = "Я рада, что тебе нравится, Нагиса."
10050010-183 = "Так спокойно... Почти целительно."
10050010-184 = "Если бы здесь был Сенсей, послевкусие, несомненно, было бы идеальным... но мне следует научиться довольствоваться тем, что есть."
10050010-186 = "Кстати, я слышала, что в Тринити набирает популярность какая-то интересная книга. Ты о ней слышала?"
10050010-187 = "Интересная...? Ах! Да, у меня тоже есть экземпляр."
10050010-188 = "Я ещё не успела сесть и прочитать её, но отзывы повсюду восторженные."
10050010-189 = "Я рада это слышать."
10050010-190 = "Однако я заметила кое-что немного... странное."
10050010-191 = "Люди будто не хотят обсуждать книгу публично. Вместо этого они собираются небольшими группами и перешёптываются, словно скрывают какой-то постыдный секрет."
10050010-192 = "Фуфу. Похоже, она помогает ученикам укреплять связи."
10050010-193 = "Когда мы сталкиваемся с чем-то интеллектуально стимулирующим, нам инстинктивно хочется поделиться этим с единомышленниками."
10050010-194 = "Согласна, должно быть, дело именно в этом."
10050010-195 = "Однако ты весьма разожгла моё любопытство. Твой экземпляр с собой?"
10050010-196 = "Да. Вот он, Нагиса."
10050010-197 = ""
10050010-199 = ""
10050010-200 = "Что ж, посмотрим..."
