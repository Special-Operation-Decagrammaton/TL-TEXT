[translation]
84300300500-5 = "Разрушить Выставку Миллениума... и каким-то образом на этом заработать..."
84300300500-6 = "...Возможно, кто-то собирается сыграть на понижение акций. По крайней мере, это одна из базовых версий."
84300300500-7 = "Ты не выглядишь удивлённой."
84300300500-8 = "Потому что я и не удивлена."
84300300500-9 = "Я заранее составила несколько гипотез. Эта была одной из них или достаточно близка к одной из них."
84300300500-10 = "Теперь всё зависит от наших дальнейших действий."
84300300500-11 = ""
84300300500-13 = ""
84300300500-14 = "Давай изложу то, что мы знаем. Считай это кратким брифингом."
84300300500-15 = "Прямо сейчас Миллениум проводит крупное мероприятие под названием «Выставка Миллениума». И ещё на этапе подготовки я обнаружила серию подозрительных пакетов данных."
84300300500-16 = "К сожалению, кто-то действительно готовит заговор против фестиваля, и теперь нам нужно найти их раньше, чем они приведут план в исполнение."
84300300500-19 = "Юризоно Сейя. Используй статус приглашённой гостьи, чтобы исследовать зал мероприятия и окрестности. Даже если будешь задавать вопросы, не думаю, что тебя кто-то заподозрит."
84300300500-20 = "Твоя задача — собрать любую информацию о том, кто за этим стоит, и немедленно передавать её нам. Это очень важная роль."
84300300500-21 = "Пока ты этим занимаешься, мы с Нэру проверим Центр данных Миллениума и проследим путь тех пакетов. Учитывая обстоятельства, мне придётся оставаться незамеченной."
84300300500-24 = "Раз их агенты уже здесь, сомневаюсь, что у нас много времени. Нужно приступать немедленно."
84300300500-25 = ""
84300300500-27 = ""
84300300500-28 = "Начинаем «Операцию Пэйнт»."
84300300500-29 = ""
84300300500-31 = ""
84300300500-32 = "...? Что? Операцию какую...?"
84300300500-33 = "«Операцию Пэйнт». Игра слов с английским «feint» — «финт»..."
84300300500-34 = "..."
84300300500-35 = "Она всегда такая. Привыкай."
84300300500-36 = "..."
84300300500-37 = "...Хорошо, тогда понятно."
