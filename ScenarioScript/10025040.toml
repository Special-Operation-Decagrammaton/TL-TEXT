10025040-82 = ""
10025040-86 = ""
10025040-87 = "...неужели нельзя уже перестать это делать?"
10025040-88 = "Запах... распространился по всему городу... голова раскалывается!"
10025040-89 = "...думаешь, мы делаем это потому, что нам нравится?"
10025040-90 = "...креветки не продаются... надо же как-то зарабатывать."
10025040-91 = "К тому же... традиции и фольклор этого города... старейшины понимают."
10025040-92 = "Может, для тех, кто здесь родился и вырос, это и так, но для нас—"
10025040-93 = "Да ладно, ты здесь уже больше года. Привыкай."
10025040-94 = "Ты уже почти одна из нас. Хватит сопротивляться."
10025040-95 = "Угх..."
10025040-96 = "Ладно, а что случилось с... о чём я просил?"
10025040-97 = "Уже месяц прошёл, а мы всё ещё ждём."
10025040-98 = "Только вчера... серьёзно пострадал. Ему повезло, что вообще остался жив..."
10025040-99 = "Слушай, мне жаль, но я ничего не могу сделать..."
10025040-100 = "Нельзя же просто оставить всё как есть!"
10025040-102 = "Ты угрожаешь погрузить всю деревню во тьму..."
10025040-104 = ""
10025040-106 = ""
10025040-107 = ""
10025040-108 = "Значит, рыбный запах вызван чем-то, что они делают... специально?"
10025040-109 = "И что он имел в виду под «погрузить всю деревню во тьму»?"
10025040-110 = "М-Мы точно будем в порядке...?"
10025040-111 = "З-Земля не уйдёт под воду? Волны не поднимутся и не поглотят нас...?"
10025040-112 = "Дыши глубже, Мию. Ничего такого не случится."
