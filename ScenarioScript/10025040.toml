10025040-127 = "Принято. Возражений нет."
10025040-128 = "Признаюсь, я тоже начинаю немного нервничать..."
10025040-129 = "Зловещая атмосфера в городе, жуткие слова и поступки местных... Здесь явно дело не только в креветках."
10025040-130 = "Что думаете, Сенсей?"
10025040-131 = "[s3] «Да, местные и правда ведут себя немного странно...»\n[s4] «Сначала нужно проверить, всё ли в порядке с Мию.»"
10025040-134 = "Верно. Улики разберём позже."
