10025040-1 = "Эпизод 4;Блуждая во тьме"
10025040-3 = ""
10025040-4 = ""
10025040-5 = ""
10025040-7 = ""
10025040-8 = "RABBIT 1 докладывает. Текущее время — 20:30. Я прибыла к точке встречи."
10025040-9 = "До конца сумерек тридцать минут. Из-за новолуния ночь будет тёмной, подготовьтесь соответственно."
10025040-10 = "RABBIT 2 докладывает. Для этой операции ночь идеальная."
10025040-11 = "Местные нас не увидят, но мы должны суметь отличить своих от чужих."
10025040-12 = "RABBIT 4, ты переключилась на ночной прицел?"
10025040-13 = "Д-Да... Здесь темнее, чем я ожидала, поэтому использую прицел NL-4."
10025040-14 = "Инфракрасный маячок тоже работает хорошо, но..."
10025040-15 = "Да? Что-то не так?"
10025040-16 = "В-Вы не чувствуете этот запах...? Рыбный... Он стал сильнее..."
10025040-17 = "Трудно описать, но... это такой рыбный, затхлый запах, который я чувствую повсюду..."
10025040-18 = "...Я тоже заметила."
10025040-19 = "Появляется рыбный запах, а потом кожа начинает чесаться, будто на меня чем-то брызнули."
10025040-20 = "Как вы себя чувствуете, [USERNAME] Сенсей?"
10025040-21 = ""
10025040-23 = ""
10025040-26 = "[ns1] «Просто неприятно пахнет.»\n[ns2] «Но зуда или чего-то такого у меня нет...»"
10025040-30 = "А вдруг этот запах... какое-то предзнаменование...?"
10025040-31 = "Мне это не нравится..."
10025040-32 = "Это рыбацкая деревня. Конечно здесь будет пахнуть рыбой."
10025040-33 = "А если кажется, что запах усиливается, ну... Может, ветер несёт его со стороны океана."
10025040-34 = "Ох, Саки, дурочка."
10025040-35 = "Ночью ветер дует с суши к морю."
10025040-36 = "Ты что, спала на уроках естествознания? Ночью суша остывает быстрее моря, из-за чего возникает разница давления."
10025040-37 = "[s] «Обязательно запиши. Это будет на контрольной.»"
10025040-38 = "Не надо меня поучать! Я и сама это знаю...!"
10025040-39 = "RABBIT 1! Какая цель?"
10025040-41 = "Выдвигаемся к Рифу Дьявола."
10025040-42 = "Похоже, для местных это нечто вроде священного места, поэтому лучший шанс обследовать его — под покровом темноты."
10025040-43 = "Сейчас новолуние, так что отлив будет самым сильным... Если директор Ред Хук Экспресс права, это наш лучший шанс проверить, скрывают ли местные что-нибудь."
10025040-44 = "RABBIT 2, иди впереди и обследуй местность пешком. RABBIT 4, обеспечь наблюдение с утёса на западной стороне."
10025040-46 = "Поняла."
10025040-47 = "М-Мияко — то есть RABBIT 1... Пожалуйста, н-ни в коем случае не выключайте рацию...!"
10025040-49 = "Принято. RABBIT 4, немедленно докладывай о любой подозрительной активности."
10025040-50 = "RABBIT 3, оставайся у точки встречи и прикрывай наш тыл."
10025040-51 = "Если кто-то из жителей заметит, что нас нет в лагере, я не хочу, чтобы они пошли за нами."
10025040-52 = "Оставь это мне. Буду смотреть в оба."
10025040-54 = "Выдвигаемся. До рассвета встретимся у точки сбора."
10025040-56 = ""
10025040-61 = ""
10025040-62 = ""
10025040-63 = ""
10025040-65 = "...Погоди."
10025040-66 = "RABBIT 2, на три часа два человека. Можешь опознать?"
10025040-68 = "Вижу. Один в рыбацких сапогах и с удочкой. Должно быть, местный рыбак."
10025040-69 = "Он разговаривает с сотрудницей Береговой охраны Валькирии. Кажется, она преграждает ему путь."
