10025040-114 = "А т-теперь... я ещё что-то слышу..."
10025040-115 = "Что ты слышишь?"
10025040-117 = "Будто кто-то читает священный текст... или распевает заклинание..."
10025040-118 = "Мияко! То есть RABBIT 1! М-Мы... точно будем в порядке...?"
10025040-119 = ""
10025040-121 = ""
10025040-123 = ""
10025040-124 = ""
10025040-125 = "Оставайся на месте. Мы сейчас будем."
