[translation]
2000402-1 = "Милота — это справедливость!"
2000402-2 = "Магазин купальников возле Тринити"
2000402-3 = "Хм, этот купальник красивый, но на нём слишком много оборок. Наверное, будет неудобно."
2000402-4 = ""
2000402-5 = ""
2000402-6 = "Этот купальник слишком открытый. Не думаю, что мне такое подойдёт."
2000402-7 = "Интересно, найдётся ли такой, который был бы достоин имени Отряда справедливости."
2000402-8 = "Вы ищете что-нибудь конкретное?"
2000402-9 = "О, нет... Ничего определённого."
2000402-10 = "А как насчёт вот этого купальника с оборками?"
2000402-11 = "Сейчас это самый популярный дизайн среди девушек!"
2000402-12 = "Не спорю, он милый. Просто... не думаю, что будет хорошо на мне смотреться."
2000402-13 = "Ничего подобного. Какая девушка будет плохо выглядеть в таком милом купальнике?"
2000402-14 = "Ведь в конце концов..."
2000402-16 = "...милота — это справедливость!"
2000402-17 = "С-Справедливость?!"
2000402-18 = "Конечно. Милый купальник одним своим существованием способен привлечь всеобщее внимание."
2000402-19 = "Наденьте милый купальник и покажите своё очарование тому, кто вам нравится!"
2000402-20 = ""
2000402-21 = ""
2000402-23 = "(Кажется, я чего-то не понимаю.)"
2000402-24 = "(Я думала, что знаю о справедливости всё. Не могу поверить, что ничего не знала о справедливости, которую несёт милый купальник!)"
2000402-25 = "(Но что именно делает его справедливым? Может, есть какое-то школьное правило о милых купальниках, которого я не знаю?)"
2000402-26 = "(...)"
2000402-27 = "(Как бы я ни думала, не могу понять, какое отношение милый купальник имеет к справедливости.)"
2000402-28 = "(Надо спросить кого-нибудь, кто разбирается в этой области.)"
2000402-29 = ""
2000402-31 = "[ns] «Что случилось?»"
2000402-32 = "О, это ты, Сенсей. Ну..."
2000402-33 = "Я нашла хороший купальник, который соответствовал бы имени Отряда справедливости..."
2000402-34 = "...но в процессе поняла, как многого ещё не знаю о справедливости."
2000402-35 = "[s] «О чём ты говоришь?»"
2000402-38 = "После этого Маширо объяснила мне ситуацию."
2000402-40 = "Я уже некоторое время думаю о связи между милыми купальниками и справедливостью, но так ни к чему и не пришла."
2000402-41 = "Наверное, я всё ещё очень многого не понимаю в справедливости."
2000402-42 = "Сенсей, можешь объяснить, какое отношение милый купальник имеет к справедливости?"
2000402-43 = "[s] Развеять заблуждение Маширо."
2000402-44 = "Ты думаешь, продавщица просто имела в виду, что этот купальник будет хорошо на мне смотреться?"
2000402-45 = "Тогда... ношение милого купальника никак не связано с деятельностью Отряда справедливости."
2000402-46 = "Какое облегчение. Я уже думала, что не понимаю чего-то фундаментального в справедливости."
2000402-47 = "[s] «Когда речь о справедливости, ты иногда бываешь немного странной.»"
2000402-48 = "Правда? А мне казалось, я веду себя совершенно нормально."
2000402-49 = "В любом случае, я рада, что моё понимание справедливости не нужно исправлять."
2000402-50 = "Тогда, пожалуй, я верну купальник."
2000402-51 = ""
2000402-52 = ""
2000402-53 = "[ns] «Не будем спешить!»"
2000402-54 = "А? Есть проблема?"
2000402-55 = "Ты сам сказал. Купальник никак не связан со справедливостью."
2000402-56 = "[s1] «Мне кажется, он и на тебе будет хорошо смотреться, Маширо.»\n[s2] «Просто милый купальник связан с ДРУГИМ видом справедливости.»"
2000402-57 = "Тебе не кажется, что на нём слишком много оборок?"
2000402-58 = "С чего ты вдруг это говоришь?"
2000402-59 = "Хм..."
2000402-60 = "Боюсь, в нём будет неудобно. Оборки могут мешать во время тренировок."
2000402-61 = "Но, с другой стороны, ты ведь одобрил его..."
2000402-62 = "Хорошо. Я оставлю этот купальник."
2000402-63 = ""
2000402-64 = "Возможно, продавщица была права. Может, этот купальник и правда отдаёт мне должное!"
2000402-66 = "Мы вернулись в кампус с новым купальником Маширо."
