[translation]
83304200300-5 = ""
83304200300-6 = "О, глава префектов. Спасибо за вашу работу."
83304200300-7 = "Да, и тебе спасибо, Ако. Я пришла проверить материалы для антитеррористической тренировки перед вечеринкой..."
83304200300-8 = "«Нулевая терпимость к насилию»... «Мир всей Геенне»..."
83304200300-9 = ""
83304200300-11 = ""
83304200300-13 = "И «Прекратите драться» от... Ханумы Макото?"
83304200300-14 = "...Что это?"
83304200300-15 = "...Она снова что-то затевает. Как всегда."
83304200300-16 = "И эти листовки не просто свалены здесь. Такими же оклеили всю Академию Геенна. Интересно, что она задумала."
83304200300-17 = "Что бы это ни было, на наши планы это не влияет."
83304200300-18 = "Идём, Ако. Начнём подготовку к тренировке."
83304200300-19 = "Ты знаешь, где остальные члены команды?"
83304200300-20 = "Хм, Иори должна ждать в классе. Пойдём к ней?"
83304200300-21 = "Да."
