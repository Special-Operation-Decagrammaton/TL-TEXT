[translation]
61010-1 = "Эпизод 1;Цепи"
61010-4 = "*задыхается* *задыхается*"
61010-10 = ""
61010-11 = "*задыхается* Ух...! Ах!"
61010-16 = "Ц...! *кашляет* *кашляет* *кашляет* *кашляет*...!"
61010-17 = ""
61010-19 = ""
61010-21 = "...Может, стоит передохнуть..."
61010-22 = "*тяжело дышит*... *пыхтит*..."
61010-29 = ""
61010-30 = "...Хех."
61010-31 = "Я думала, что если только доберусь сюда, всё как-нибудь наладится."
61010-32 = "Обязано."
61010-33 = "Снаружи ВСЁ должно быть иначе."
61010-35 = "Ведь..."
61010-36 = "Если этим путём прошёл Squad..."
61010-37 = "...то даже я наверняка смогу пойти по их следам..."
61010-38 = ""
61010-39 = "...Дождь начался?"
61010-40 = "(Мне... так холодно...)"
61010-41 = "(Я не чувствую пальцев...)"
61010-42 = "Просто... продолжай идти..."
61010-43 = ""
61010-45 = ""
61010-52 = ""
61010-53 = "Тебе пять дней не платили?"
61010-54 = "Хм... Ну, договора мы не подписывали, так что, с моей точки зрения, ты вообще не работала!"
61010-55 = ""
61010-56 = "Ариус...? Не-а, не слышал."
61010-57 = "То есть у тебя вообще нет никаких учебных записей? Хм. С этим можно работать."
61010-58 = ""
61010-59 = "Эй. Есть для тебя работёнка без оформления."
61010-60 = "Что значит «не будешь»? Ты разве не привыкла пачкать руки?"
61010-61 = "Откуда я знаю? Думаешь, я правда нанял бы тебя без проверки прошлого? У меня есть способы добывать информацию."
61010-62 = "Пытаешься начать честную жизнь? Поэтому отказываешься?"
61010-63 = "Ха! Слушай, мелкая. Ты годишься только для одного, так что лучше выжать из этого максимум."
61010-64 = "Что? Думаешь, какой-нибудь магазин мороженого возьмёт тебя обслуживать добропорядочных граждан?"
61010-65 = "Пошла с глаз моих. Мне такие, как ты, не нужны."
61010-66 = ""
61010-67 = "...Всё было ложью."
61010-68 = "Ничего хорошего мне никогда не достанется."
61010-69 = "Ничего хорошего не свалится мне в руки так легко."
61010-70 = "Ничего хорошего... никогда не происходит так, как хочется."
61010-71 = "Мечтать бесплатно, но от последствий реальности не убежишь."
61010-73 = "[log=마이아 언노운]Для беглецов рая не существует.[/log]"
61010-75 = "[log=마이아 언노운]Я знала это. Правда знала.[/log]"
61010-77 = "[log=마이아 언노운]Но всё равно цеплялась за мечты.[/log]"
61010-80 = "[log=마이아 언노운]Я отчаянно хваталась за то, что называют «надеждой».[/log]"
61010-82 = "[log=마이아 언노운][ff4444]...Всё это было лишь сном.[-][/log]"
61010-84 = ""
61010-85 = "Ха..."
61010-86 = "Я вернулась."
61010-87 = "Уверена, ничего не изменится, но хотя бы стало немного легче."
61010-88 = "Школа-сателлит Ариус."
61010-90 = "Место, где я выросла."
61010-91 = "Где меня заставляли терпеть."
61010-92 = "Где меня... обучали."
61010-93 = "Наша «школа»."
61010-94 = ""
61010-98 = ""
61010-100 = "Ты вернулась."
61010-101 = ""
61010-103 = ""
61010-106 = "А...?"
61010-107 = "Наверняка тебе многое хочется сказать, но пока иди отдохни."
61010-108 = "Это...?"
61010-109 = "Субару...!"
61010-110 = "Да, это я, Какэхаси Субару."
61010-111 = "Татиги Майя, верно? Тебе не о чем беспокоиться."
61010-112 = "Даже если мир тебя бросил, я — нет. Ариус — нет."
61010-113 = "Д-Да...!"
61010-115 = "[log=스바루]С возвращением.[/log]"
61010-117 = "[log=스바루][ff4444]В наш Ариус.[-][/log]"
61010-121 = "Следующий Эпизод;Обязанности студента!"
