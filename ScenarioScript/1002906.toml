[translation]
1002906-1 = "Перерыв: Магазин сладостей"
1002906-3 = "(Как и говорила Нацу, день был ясным и солнечным.)"
1002906-4 = "(Солнце приятно грело, не обжигая, а ветер освежал, не становясь слишком сильным.)"
1002906-5 = "Хи-хи. Сенсей. Сюда, сюда."
1002906-6 = "В такие дни многие стараются занять хорошие места."
1002906-7 = "Поэтому важно приходить пораньше."
1002906-8 = ""
1002906-10 = ""
1002906-12 = "Ну же, ну же! Ничего особенного, но надеюсь, вам понравятся молоко и черничный пирог!"
1002906-13 = "[s1] «Молоко и черничный пирог. Мне нравится.»\n[s2] «Какое вкусное сочетание!»"
1002906-14 = "Хи-хи. У вас хороший вкус, Сенсей."
1002906-15 = "Хи-хи. У вас хороший вкус, Сенсей."
1002906-16 = ""
1002906-18 = ""
1002906-19 = "...Хм."
1002906-20 = "[s3] «...Нацу?»\n[s4] «Что такое?»"
1002906-21 = "Ничего. Просто..."
1002906-22 = "Ничего. Просто..."
1002906-23 = "Обычно вы начинаете с чего-то вроде: «Что-то случилось?»"
1002906-24 = "Будто вы можете понять, всё ли в порядке, просто посмотрев человеку в лицо, Сенсей. Впечатляет."
1002906-25 = "Я вышла на улицу просто потому, что сегодня такая хорошая погода."
1002906-26 = "И вдруг мне пришла одна мысль!"
1002906-27 = "Что бы вы сделали, если бы я позвала вас, а на самом деле ничего не случилось? Как обычно спросили бы: «Что-то не так?»?"
1002906-28 = "Но вместо этого, как только получили моё сообщение, вы спросили, не устроила ли я пикник на улице, верно?"
1002906-29 = "В MomoTalk я написала: «Хорошо! Вы уже ко мне привыкли!», но про себя подумала: «Ого...»"
1002906-30 = "Хм..."
1002906-31 = "Интересно, что было иначе."
1002906-32 = "Как вы догадались?! Вы за мной шпионите? Умеете читать мысли?!"
1002906-33 = "...Хаха."
1002906-34 = "Ладно. Неважно. Главное, что сейчас вы сидите здесь со мной."
1002906-35 = "Погода прекрасная, а черничный пирог и молоко оказались такими же вкусными, как я надеялась. Я довольна."
1002906-36 = "Я просто буду наслаждаться этим маленьким кусочком совершенства."
1002906-37 = "Что думаете, Сенсей?"
1002906-38 = "Я не мешаю вам, когда зову сюда, хотя вы заняты?"
1002906-39 = "Думаю, мне было бы немного грустно, если бы это было так."
1002906-40 = "[s5] «Вовсе нет. Мне здесь очень комфортно.»\n[s6] «Нет. Если не сейчас, то когда?»"
1002906-41 = "Хахаха. Какое облегчение. Спасибо, Сенсей."
1002906-42 = "Хахаха. Какое облегчение. Спасибо, Сенсей."
1002906-43 = "Ну... у меня не так много людей, которым я могу просто позвонить и позвать куда-нибудь без особой причины."
1002906-44 = "...Хм."
1002906-45 = ""
1002906-47 = ""
1002906-48 = "Хорошо! Всё! Больше никаких серьёзных разговоров."
1002906-49 = "Это вообще-то должен был быть просто пикник. Простите, простите. Я увлеклась."
1002906-50 = "Итак, раз мы с этим разобрались..."
1002906-51 = "Ну что, начнём наш самый обычный, ничем не примечательный пикник?"
1002906-52 = ""
1002906-54 = ""
1002906-55 = ""
1002906-57 = "Еды много, так что ешьте сколько хотите!"
1002906-59 = "Не раздумывая, Нацу взяла первый кусок черничного пирога и отправила его в рот."
1002906-60 = "(Когда мы с Нацу доели весь черничный пирог и выпили молоко, я вернулся в Шале.)"
