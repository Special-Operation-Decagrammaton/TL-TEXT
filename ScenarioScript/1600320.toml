[translation]
1600320-1 = "Особые спутники"
1600320-2 = "Я связался с Сузуми после того, как прибыл в Тринити."
1600320-3 = ""
1600320-6 = "Вскоре я увидел вдали приближающийся силуэт."
1600320-7 = ""
1600320-11 = "Простите, что заставила ждать, Сенсей. Не ожидала, что вы доберётесь так быстро."
1600320-12 = "...А!"
1600320-13 = ""
1600320-18 = ""
1600320-20 = "...П-простите, Сенсей."
1600320-21 = "[s1] «Хм? Тебя что-то напугало?»\n[s2] «Ты только что что-то спрятала за спиной...?»"
1600320-24 = "А, эм, ничего такого..."
1600320-25 = "Просто... вот это."
1600320-26 = ""
1600320-28 = ""
1600320-29 = ""
1600320-30 = ""
1600320-32 = "Это, эм..."
1600320-33 = "Просто наушники, которые я использую во время патрулей..."
1600320-34 = "Я не собиралась надевать их при вас! Я торопилась и забыла снять. Но, конечно, музыка не играла, я просто..."
1600320-35 = "Эм, неважно. Я опять болтаю. Пойдёмте. Раз вы прислали наше расписание, я поведу."
1600320-36 = "Сюда..."
1600320-37 = ""
1600320-39 = ""
1600320-42 = ""
1600320-43 = ""
1600320-44 = "..."
1600320-45 = "[s3] «Сузуми? Ты в порядке?»\n[s4] «Кажется, тебя что-то тревожит.»"
1600320-48 = ""
1600320-50 = ""
1600320-51 = "А-а?! Ой, эм, ну..."
1600320-52 = "Э-э..."
1600320-53 = "Простите. Это неважно, поэтому я не хотела поднимать тему, но... похоже, из-за меня вам неловко."
1600320-54 = "Как я сказала, это неважно. Просто... мои наушники..."
1600320-55 = "Если честно..."
1600320-56 = "Я немного переживаю, что произвела на вас плохое впечатление."
1600320-57 = "[s5] «Плохое впечатление?»\n[s6] «Ты об этом переживаешь?»"
1600320-60 = "Ну да. Я явно была на патруле. Это было видно любому. И всё же наушники выглядят..."
1600320-61 = "Конечно, я не слушаю музыку постоянно и всегда держу громкость низкой. В основном включаю её на перерыве или когда нужно чем-то занять себя..."
1600320-62 = "Во время долгих патрулей мне просто нужно хоть что-то."
1600320-63 = "Но даже так..."
1600320-64 = "Мне кажется, со стороны я могу выглядеть безответственной или невнимательной. Вот и всё. Наверное... я сама не замечала, насколько сильно из-за этого переживаю."
1600320-65 = "А?"
1600320-66 = "О, вам так не показалось... Ну, замечательно, но—"
1600320-67 = "[s7] «Я не просто так говорю. Я серьёзно.»\n[s8] «Тебе ведь никто не назначал маршрут патруля.»\n[s9] «И ты делаешь это не ради благодарности или славы.»"
1600320-71 = "Это..."
1600320-72 = "..."
1600320-73 = "...Ха..."
1600320-74 = "Я никогда не думала об этом с такой стороны, но, наверное, вы правы."
1600320-75 = "Я сама начала патрулировать, просто чтобы присматривать за районом."
1600320-76 = "Хм, обычно такие вещи меня не тревожат. Наверное, я заметила это только потому, что была рядом с вами, Сенсей."
1600320-77 = "Это... немного на меня не похоже. Надо обдумать."
1600320-78 = "Но я успокоилась."
1600320-79 = "Спасибо, Сенсей. Правда."
1600320-80 = "Что?"
1600320-81 = "Мои наушники? Думаете, я специально их модифицировала или вообще сделала сама?"
1600320-82 = "Нет, ничего такого. У меня нет таких навыков. Это обычные наушники из магазина."
1600320-83 = "Единственное, что в них необычного — насколько они старые и потрёпанные."
1600320-84 = "Я купила их довольно давно и часто беру с собой на долгие патрули."
1600320-85 = "Иногда я даже носила их во время боя. Наверное, мне повезло, что они до сих пор не сломались."
1600320-86 = "Если бы они когда-нибудь сломались..."
1600320-87 = ""
1600320-89 = ""
1600320-90 = "Эм, не знаю. Покупать новые мне не хочется, так что, наверное, попробовала бы отремонтировать эти."
1600320-91 = "[s10] «Что ж, ты провела с ними много времени.»\n[s11] «Эти наушники — одни из твоих напарников по патрулю.»"
1600320-94 = "Вы... говорите о них так, будто они живые."
1600320-95 = "Но... кажется, я понимаю, что вы имеете в виду."
1600320-96 = "...Ха-ха..."
1600320-97 = "Пока я рассказывала, всё звучало довольно скучно... Как вы умудрились сделать из этого что-то особенное, Сенсей?"
1600320-98 = "Странное чувство, но..."
1600320-99 = "С наушниками, и с оружием тоже... получается, всё это время я всё-таки патрулировала не одна."
1600320-100 = "[s12] «Я тоже всегда рядом!»\n[s13] Можешь звонить когда угодно. Не обязательно ради патруля."
1600320-103 = "Что..."
1600320-104 = ""
1600320-106 = ""
1600320-107 = "Ах."
1600320-108 = "Ну, я... Эм..."
1600320-109 = "П-простите. Я на секунду не смогла подобрать слов."
1600320-111 = "Спасибо, что сказали это, но всё в порядке."
1600320-112 = "Я знаю, вы очень заняты, Сенсей. У вас и так полно важных дел."
1600320-113 = "Поэтому..."
1600320-115 = ""
1600320-116 = "...М-м..."
1600320-117 = "Вообще-то, забудьте. Простите, но не могли бы вы забыть то, что я только что сказала?"
1600320-118 = "Или... сейчас мне скорее хочется сказать спасибо, чем извиниться."
1600320-119 = "Я правда очень ценю ваши слова. Если вы действительно не против, иногда..."
1600320-120 = "Я хотела бы— нет."
1600320-121 = ""
1600320-123 = ""
1600320-124 = ""
1600320-126 = "Мне правда хотелось бы иногда просить вас сопровождать меня, Сенсей."
