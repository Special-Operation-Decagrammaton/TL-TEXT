[translation]
1301203-1 = "Стрельба и цирконий"
1301203-2 = "Ювелирный магазин в Шиба-таун"
1301203-3 = "*бум*"
1301203-4 = ""
1301203-5 = "Не подходите ближе! Я серьёзно!"
1301203-6 = "Сделаете что-нибудь подозрительное — и ей конец!"
1301203-7 = "С-Спасите меня!"
1301203-9 = "Преимущество на их стороне. Все заложенные ими бомбы можно взорвать из любого места с помощью этого беспроводного детонатора."
1301203-10 = "Можно было бы рискнуть, если бы дело было только в заложнике, но малейшая ошибка может уничтожить весь соседний торговый центр."
1301203-11 = "[s] «Может, стоит дождаться профессионального переговорщика.»"
1301203-12 = "На это нет времени. Преступник может потерять терпение в любую секунду. Нужно начинать переговоры сейчас."
1301203-13 = "К тому же в Бюро общественной безопасности я ещё ни разу не проигрывала переговоры из-за пончиков!"
1301203-14 = ""
1301203-16 = ""
1301203-18 = "[ns] «Разве это не немного отличается от спора из-за сладостей?»"
1301203-20 = ""
1301203-22 = ""
1301203-23 = "Прекрати сопротивляться! Просто сдавайся, и твоя безопасность будет гарантирована!"
1301203-24 = "Что это было? Переговорщик уже прибыл?"
1301203-25 = "Кто ты? Немедленно представься!"
1301203-26 = "Я Кирино из Бюро общественной безопасности Полицейской школы «Валькирия»!"
1301203-27 = "Я пришла вести с тобой переговоры об освобождении заложника."
1301203-28 = "Бюро общественной безопасности? Не Бюро безопасности и не Бюро общественного порядка? Зачем они прислали кого-то вроде тебя?!"
1301203-29 = "Ты меня за идиота держишь?! Хватит шутить и пришлите сюда настоящего переговорщика!"
1301203-30 = "П-Прошу прощения! Да, я из Общественной безопасности, но всё равно достойный член «Валькирии»!"
1301203-31 = "Чёрт. И что мне делать с такой мелюзгой?"
1301203-32 = "Похоже, выбора нет. Выкладывай. Говори, что хотела, но если замечу хоть что-то подозрительное — взорву всё это место к чертям!"
1301203-33 = "Хорошо. Теперь нужно просто следовать инструкции и продолжить переговоры..."
1301203-34 = "Д-Для начала, что вообще заставило тебя совершить это преступление?"
1301203-35 = "Деньги, конечно!"
1301203-36 = "На прошлой неделе я слишком сильно потратилась в кошачьем кафе..."
1301203-37 = "На еду в эту неделю почти ничего не осталось, потому что я покупала актинидию и кошачью мяту для новой трёхцветной кошки."
1301203-38 = "Если бы у меня были деньги, я бы никогда этого не сделала!"
1301203-39 = "Но ведь это... твоя ответственность, разве нет?"
1301203-40 = ""
1301203-41 = "А?!"
1301203-42 = "Ты идиотка?! Ты пытаешься провоцировать человека, который держит заложника?!"
1301203-43 = "Никто ведь не заставлял тебя так тратить деньги?"
1301203-44 = "Нужно разумно распоряжаться деньгами, а если расходов слишком много — устройся на подработку."
1301203-45 = "Э-Это правда, но..."
1301203-46 = "Но это неважно! Все знают, что на месте преступления нельзя провоцировать человека, захватившего заложника!"
1301203-47 = "Вот поэтому коротышки из Бюро общественной безопасности...!"
1301203-48 = ""
1301203-49 = "У тебя тоже есть здравое замечание. Дай запишу."
1301203-50 = "[s] «Ты что, записываешь советы по переговорам у самого преступника?»"
1301203-51 = "А дальше у меня...«Проверить, есть ли у преступника требования.» Хм."
1301203-52 = "У тебя есть какие-нибудь требования в обмен на заложника?"
1301203-53 = "Рад, что спросили! Я требую наличными сумму, равную стоимости этих бриллиантов, и спортивную машину для побега."
1301203-54 = "И ещё побольше плодов серебряной лозы!"
1301203-55 = "С этим будет сложно..."
1301203-56 = "Что? Почему?! Вам что, всё равно, если все здешние бриллианты разнесёт в клочья?!"
1301203-57 = "Ну, из-за пробок достать машину будет непросто. Даже если мы дадим тебе спорткар, сбежать на нём будет трудно."
1301203-58 = "Кроме того, ты украл вовсе не бриллианты. У тебя куча дешёвых фианитов, так что..."
1301203-59 = "Забудь о деньгах с продажи драгоценностей. Пожалуй, просто арендовать спорткар выйдет выгоднее."
1301203-60 = ""
1301203-61 = "Чёрт! Тогда какого хрена я вообще всё это делаю...?"
1301203-62 = ""
1301203-64 = ""
1301203-66 = "А-А-А-А!"
1301203-67 = "А-А?"
1301203-69 = "Он взбесился! Нужно срочно что-то делать!"
1301203-70 = "[s] «Кирино, вообще-то это ты до этого довела.»"
1301203-71 = "Н-Неправда! Это преступник во всём виноват!"
1301203-72 = "Другого выхода нет. Придётся выстрелить в детонатор, прежде чем преступник успеет взорвать бомбу."
1301203-73 = "Целюсь в руку преступника... Огонь!"
1301203-74 = ""
1301203-76 = ""
1301203-82 = ""
1301203-83 = ""
1301203-84 = "УАААХ!"
1301203-85 = "З-Зачем ты это сделала? Почему ты выстрелила в заложника, а не в меня?"
1301203-87 = "Угх... Опять промахнулась."
1301203-88 = "Но теперь-то точно!"
1301203-90 = ""
1301203-96 = ""
1301203-97 = ""
1301203-98 = "Акх!"
1301203-99 = "Х-Хватит в меня стрелять! Я заложник!"
1301203-100 = "Да что НЕ ТАК с этой девчонкой...?"
1301203-101 = "(Это худшие переговоры, что я когда-либо видел. Она постоянно меня провоцирует, а теперь ещё и стреляет в заложника.)"
1301203-102 = "(Обычно переговорщик, наоборот, цепенеет от страха случайно ранить заложника...)"
1301203-103 = "(Постой. Это она так показывает, что вообще не собирается вести переговоры, что бы ни случилось с заложником?)"
1301203-104 = ""
1301203-105 = ""
1301203-106 = "(Точно. Говорят, в Полицейской школе «Валькирия» есть какая-то безумная мелкая, которой плевать на безопасность заложников и которая яростно преследует преступников.)"
1301203-107 = "(Неужели эта пустоголовая переговорщица и есть ТА психопатка?!)"
1301203-108 = "(Такими темпами всё закончится ужасно ещё до того, как я хоть что-нибудь получу от захвата заложника.)"
1301203-110 = "Л-Ладно! Я-я сдаюсь!"
1301203-111 = "Я верну мопса, драгоценности, всё... Только пощадите меня!"
1301203-113 = "А? Преступник вдруг бросил детонатор и отпустил заложника."
1301203-114 = "У него что, внезапно проснулась совесть?"
1301203-115 = ""
1301203-116 = "Наверное, всё благодаря моим превосходным навыкам переговорщика!"
1301203-117 = "[s1] «Не думаю, что дело в этом...»\n[s2] «Что-то тут не так...»"
1301203-118 = "Порой даже закоренелому преступнику нужен лишь разговор по душам."
1301203-119 = "Порой даже закоренелому преступнику нужен лишь разговор по душам."
1301203-120 = "Сегодня справедливость победила!"
1301203-122 = "В конце концов прибыл профессиональный переговорщик, и студенты Бюро безопасности благополучно арестовали преступника."
1301203-123 = "Тем временем Кирино написала письмо с извинениями за ранение заложника."
