[translation]
2001803-1 = "Пропавшие без вести"
2001803-2 = "Однажды, когда я пришёл на работу, офисный компьютер был мёртв..."
2001803-4 = "Боюсь, он полностью вышел из строя. Плата обгорела, её придётся менять целиком."
2001803-5 = "Наверное, ночью во время грозы произошло короткое замыкание."
2001803-6 = "[s] «...Можно спасти хоть какие-то данные?»"
2001803-7 = "Если бы это был программный сбой из-за взлома или вируса — возможно... но устройство практически полностью сгорело..."
2001803-8 = "Восстановить данные с него — всё равно что пытаться прочитать буквы на сгоревшей бумаге."
2001803-9 = "...У вас были резервные копии?"
2001803-10 = "[s] «Вчера я ушёл в спешке, сохранив всё прямо на компьютере...»"
2001803-11 = "Не хочу приносить плохие новости, но..."
2001803-12 = "вернуть данные никак не получится."
2001803-14 = "Хм... Это довольно трагично."
2001803-15 = "Вы спрашивали учеников из других школ?"
2001803-16 = "[s] «Я спросил всех, но они сказали то же самое.»"
2001803-17 = "Тогда, как и сказал техник, придётся восстанавливать всё с нуля."
2001803-18 = "Что именно вы потеряли? Отчёты об операциях за этот месяц?"
2001803-19 = ""
2001803-21 = ""
2001803-22 = "...Посмотрим. Только начиная с GPS-данных, привязанных к карте, там были отчёты, отфильтрованные и упорядоченные для удобного просмотра, с такими данными, как места конфликтов и масштаб ущерба."
2001803-23 = "Ого... Наверное, на упорядочивание ушло много времени..."
2001803-24 = "[s] «...Да. Около трёх дней.»"
2001803-25 = "Жесть. Теперь понимаю, почему вы так расстроены."
2001803-26 = "Эм..."
2001803-27 = "Хотите, я помогу всё восстановить?"
2001803-28 = "[s] «...Правда, Моэ?!»"
2001803-29 = "Что? Почему вы так удивлены?"
2001803-30 = "На первый взгляд, большая часть — простые данные, которые нужно механически распределить по категориям. Вдвоём будет быстрее."
2001803-31 = "У меня ведь не такой уж забитый социальный график."
2001803-32 = "И таким образом Сенсей будет мне должен. Хи-хи-хи."
2001803-33 = "[s1] «Это, скорее всего, займёт много времени...»\n[s2] «Может понадобиться больше одного дня.»"
2001803-34 = "Не волнуйтесь. С моей помощью закончите меньше чем за полдня."
2001803-35 = "Не волнуйтесь. С моей помощью закончите меньше чем за полдня."
2001803-36 = "Операторы SRT обязаны быть экспертами как в бумажной работе, так и в бою."
2001803-37 = "Позвольте продемонстрировать мои навыки... Хи-хи-хи..."
2001803-39 = "После этого Моэ начала обрабатывать данные с пугающей скоростью."
2001803-41 = "...Я упорядочила все записи связи, полученные до пятнадцатого числа."
2001803-42 = "Если вы ещё не закончили с этими документами, я возьму их."
2001803-43 = "[s] «Ты уже просмотрела все эти записи?»"
2001803-44 = "Это было несложно. Между строкой, отправителем и целью есть определённая закономерность."
2001803-45 = "Нужно просто написать и доработать программу, проверить только исключения — и всё."
2001803-46 = "Хорошо, Сенсей. Здесь проверяйте только то, что отмечено красным. У этого есть кодовое имя Генерального студенческого совета, так что у меня нет доступа."
2001803-47 = ""
2001803-48 = "Сенсей. Насчёт списка припасов, который вы мне дали... Я сравнила его с записями расхода боеприпасов, и десяти патронов не хватает."
2001803-49 = "...Может, вы неправильно посчитали?"
2001803-50 = "[s3] «О нет... Наверное, я ошибся.»\n[s4] «Мне придётся проверять всё заново с самого начала...?»"
2001803-51 = "Подождите минутку. Я проверю рукописные отчёты через OCR-программу."
2001803-52 = "Подождите минутку. Я проверю рукописные отчёты через OCR-программу."
2001803-53 = ""
2001803-55 = ""
2001803-56 = "...Нашла. Похоже, шестьдесят патронов ошибочно записали как пятьдесят."
2001803-57 = "На всякий случай я ещё проверю другой список припасов. Это недолго."
2001803-58 = ""
2001803-59 = "Сенсей. Вы отправляете запросы на совместные тренировки каждому получателю по одному?"
2001803-60 = "Вы снова и снова вставляете одно и то же предложение. Это настолько неэффективно, что меня прямо раздражает."
2001803-61 = "Так, где там программа слияния, которую я сделала для рассылки официальных документов...?"
2001803-62 = "О, нашла."
2001803-63 = "Сенсей, дайте сюда данные адресатов. Если отправить через макрос, всё займёт меньше минуты."
2001803-65 = "...С помощью Моэ восстановление данных завершилось за полдня."
2001803-67 = "И вот, проще простого! Я просто слишком хороша в своей работе."
2001803-68 = "[s] «Огромное спасибо, Моэ! Серьёзно, спасибо!»"
2001803-69 = "Да не за что. Для оператора SRT это пустяк."
2001803-70 = "Немного напомнило школьные дни... Было весело."
2001803-71 = "[s] «У бойцов SRT много талантов.»"
2001803-72 = "Конечно. Управление припасами и административная работа в мирное время не менее важны, чем бой."
2001803-73 = "Если не запасаться припасами и строго их не учитывать, в нужный момент нормально отреагировать не получится."
2001803-74 = "Поэтому операторы SRT должны изучать не только радиоэлектронную борьбу, но и компьютерные навыки, необходимые для административной работы."
2001803-75 = "Хотя до этих ботанов из «Миллениума» нам, конечно, ещё далеко..."
2001803-76 = "Я загружу созданную мной макропрограмму в публичное облако, чтобы вы могли использовать её позже, если понадобится."
2001803-77 = "Теперь осталось только сделать резервную копию, чтобы больше не переживать из-за потери данных..."
2001803-78 = "А...? Что это за кнопка?"
2001803-79 = "[s] «Это кнопка аварийного форматирования.»"
2001803-80 = "Кнопка аварийного форматирования? Почему она здесь?"
2001803-81 = "А, понятно. Поскольку на компьютерах «Шале» хранится много конфиденциальной информации об учениках, это кнопка для быстрого стирания данных в экстренной ситуации."
2001803-82 = "Если я нажму её, все данные на компьютере, включая сегодняшнюю работу, исчезнут..."
2001803-83 = "Хи-хи, хи-хи-хи..."
2001803-84 = "[s5] «...Эм, Моэ? Пожалуйста... Я тебя умоляю...»\n[s6] «Ты ведь не собираешься её нажимать, да?»"
2001803-85 = "Кнопка, которая одним нажатием может смыть в унитаз целый день тяжёлой работы..."
2001803-86 = "Кнопка, которая одним нажатием может смыть в унитаз целый день тяжёлой работы..."
2001803-87 = "Кнопка, зовущая разрушение... Если нажать её, будет так, так приятно..."
2001803-88 = "*тяжело дышит* *тяжело дышит* *тяжело дышит* Ч-Что мне делать, Сенсей? Рука сама движется... Я не могу её контролировать!"
2001803-89 = "[s] «Стой! Нет!»"
2001803-90 = "Нет! Я должна это сделать!"
2001803-91 = ""
2001803-93 = ""
2001803-95 = "Начинается аварийное форматирование общего компьютера «Шале»..."
2001803-96 = "Три... Два... Один..."
2001803-97 = "Поздравляем! Ваши данные удалены!"
2001803-98 = "Простите, Сенсей..."
2001803-99 = "Но это разрушительное чувство... Этот катарсис... Я не могу ему сопротивляться!"
2001803-100 = ""
2001803-104 = "...Я связал Моэ, прежде чем начал восстанавливать данные в третий раз."
2001803-105 = "*тяжело дышит* *тяжело дышит* Сенсей связал мне руки и ноги и работает один..."
2001803-106 = "Это невероятно унизительно... Для элитного агента SRT такое невыносимо..."
2001803-107 = "Но по-своему это даже немного возбуждает... *тяжело дышит* *тяжело дышит*"
2001803-109 = "С этого момента Моэ была не особо полезна, но..."
2001803-110 = "К счастью, благодаря программе, которую она мне дала, это не заняло много времени. С третьего раза повезло."
