[translation]
1000006-1 = "Вакансия консультанта по управлению"
1000006-2 = "Офис «Решалы 68»"
1000006-3 = "Вот ты где, Сенсей."
1000006-4 = "[s] «Что за важное дело ты упоминала, Ару?»"
1000006-5 = "О, ничего особенного. Просто недавно я придумала новый бизнес-план."
1000006-6 = "Часть умения быть отличным начальником — признавать собственные слабости."
1000006-7 = "В конце концов, идеальных людей нет."
1000006-8 = "Поэтому для бизнеса лучше привлекать помощь извне, чтобы закрывать мои слабые стороны."
1000006-9 = "[s] «К чему ты ведёшь?»"
1000006-10 = "Если мне чего-то и не хватает больше всего, так это опыта руководства."
1000006-11 = "И тут я поняла... я не знаю никого с большим опытом, чем у тебя."
1000006-12 = "В конце концов... здесь ты взрослый."
1000006-13 = "Т-Ты наверняка многое умеешь и знаешь из того, чего не знаю я..."
1000006-14 = "К-Конечно, когда-нибудь я тебя догоню, но пока..."
1000006-15 = "То есть, кхм..."
1000006-16 = ""
1000006-17 = ""
1000006-18 = "Я хочу сказать, что официально предлагаю тебе стать консультантом по управлению нашей компании."
1000006-19 = "[s] «Консультантом по управлению? Но это...»"
1000006-20 = "О, я не прошу отвечать прямо сейчас."
1000006-21 = "Хи-хи. У нас полно времени."
1000006-22 = "Думай столько, сколько нужно, пока не поймёшь, чего действительно хочет твоё сердце."
1000006-23 = "Так же, как я уверена, что я лучший лидер Геенны — что бы кто ни говорил."
1000006-24 = ""
1000006-26 = "(Хе-хе. Получилось. Я прозвучала так по-взрослому! Осталось красиво завершить.)"
1000006-27 = "*звонок* *звонок*"
1000006-28 = "О, минутку."
1000006-29 = "Работа. Закончу разговор после звонка."
1000006-30 = "(Идеально. Нужно лишь показать Сенсею, насколько профессионально я решаю деловые вопросы, и дело сделано!)"
1000006-33 = "― Алло. Решалы 68, Рикухачима слушает.[wa:1260]"
1000006-37 = "― (Хе. Один взгляд на мою профессиональную сторону — и ты влюбишься. Надеюсь, ты готов!)[wa:1100]"
1000006-39 = "― (Погодите, они номером ошиблись?! Мы не суши-ресторан!)[wa:620]"
1000006-42 = "― Хм. Боюсь, это будет сложно. Сейчас мы очень загружены.[wa:1860]"
1000006-44 = "― (Доставка? Это уже бред какой-то!)[wa:120]"
1000006-47 = "― Угу. Верно. Конечно. Понимаю.[wa:2080]"
1000006-49 = "― (Почему этот идиот просто не положит трубку? Почему мы всё ещё разговариваем?)[wa:1080]"
1000006-52 = "― Хм. Непростая задача. Если посмотреть прогноз на квартал, текущая процентная ставка...[wa:2960]"
1000006-54 = "― (Сколько стоят наши суши? Мы вообще их не продаём!)"
1000006-57 = "― О, да. Понятно. Вижу.[wa:4520]"
1000006-59 = "― (Кому вообще не всё равно, какие суши ты любишь...? Угх. Что не так с этим психом?)[wa:1620]"
1000006-62 = "― А? Думаешь, они ошиблись номером?[wa:80]"
1000006-65 = "― Ч-Что ты такое говоришь? Это нормальный деловой звонок![wa:180]"
1000006-67 = ""
1000006-68 = "Т-Так ты всё слышал... да?"
1000006-69 = "Ну как? Сенсей, надеюсь, ты не СЛИШКОМ впечатлён моим профессионализмом."
1000006-70 = "Только не стой слишком близко."
1000006-71 = "Не хочу, чтобы тебя обожгло моё пылающее стремление!"
1000006-72 = "[s1] «Это точно был рабочий звонок?»\n[s2] «Я бы не отказался от суши.»"
1000006-73 = "Ч-Что ты такое говоришь, Сенсей?!"
1000006-74 = "Ч-Что ты такое говоришь, Сенсей?!"
1000006-75 = "Хватит дурачиться!"
1000006-76 = "В любом случае, хотя бы подумай над моим предложением."
1000006-77 = "Я с нетерпением жду, когда ты станешь моим консультантом по управлению. Хи-хи-хи!"
1000006-79 = "(В конце я уже импровизировала на ходу, но вроде сработало, да?)"
