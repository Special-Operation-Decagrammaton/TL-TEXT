[translation]
80000039-1 = "Особый жест в особый день"
80000039-2 = "Гостиная Шале"
80000039-3 = "Я отдыхал в гостиной Шале."
80000039-4 = "[s] «Как я вообще закончу всю эту работу?»"
80000039-5 = "Я был слишком измотан и напряжён из-за работы, чтобы готовить.#nПоэтому решил просто перекусить шоколадом из#nмагазина."
80000039-6 = ""
80000039-9 = "[ns] «К-Кто там?»"
80000039-10 = "О, это я, Сенсей."
80000039-11 = "[s] «Ф-Фуука?! Подожди секунду!»"
80000039-12 = ""
80000039-15 = "З-Здравствуйте."
80000039-16 = "[s] «Что ты здесь делаешь, Фуука?!»"
80000039-17 = "Ну, эм... Я хотела узнать, ели ли вы сегодня."
80000039-18 = "Не ели, да? Но..."
80000039-19 = "...что у вас в руке?"
80000039-20 = "[s] «Шоколад.»"
80000039-21 = "Купили шоколад по скидке в магазине, потому что сегодня День святого Валентина, да?"
80000039-22 = "Я так и знала, что вы что-нибудь подобное устроите."
80000039-23 = "Хорошо, что я пришла!"
80000039-24 = "[s] «Что значит «подобное»?»"
80000039-25 = "Пожалуйста, подождите здесь, Сенсей."
80000039-26 = ""
80000039-28 = ""
80000039-29 = ""
80000039-30 = ""
80000039-31 = "Вот многоярусный бэнто."
80000039-32 = ""
80000039-34 = ""
80000039-35 = "И не забыть термос."
80000039-36 = ""
80000039-38 = ""
80000039-39 = "Обед подан!"
80000039-40 = "[s] «Зачем всё это?»"
80000039-41 = "А? Для вас, конечно."
80000039-42 = "Я приготовила еду, потому что слышала, что в последнее время вы очень заняты.#nУ меня было чувство, что вы пропускаете приёмы пищи."
80000039-43 = "И вот я нахожу вас за тем, что вы пропускаете еду ради одного шоколада!#nЭто неприемлемо, даже если сегодня День святого Валентина!"
80000039-44 = "Это что, какой-то глупый валентиновский челлендж — весь день есть только шоколад?#nА?"
80000039-45 = "[s] «Нет, всё не так...»"
80000039-46 = "В любом случае нельзя есть столько сладкого, даже если праздник!"
80000039-47 = "Я не позволю вам угробить здоровье. Ай-яй-яй!"
80000039-48 = "[s] «Ты сейчас сказала мне «ай-яй-яй»?»"
80000039-49 = "Помимо того, что я пришла проверить, нормально ли вы едите..."
80000039-50 = "...я ещё просто переживала, потому что в последнее время вы выглядите совсем измотанным."
80000039-51 = "Вы забыли моё приглашение?"
80000039-52 = "Я говорила, что вы всегда можете прийти ко мне, если соскучитесь по домашней еде."
80000039-53 = "Вот поэтому я и пришла!"
80000039-54 = "Без вкусной еды у вас не будет сил закончить всю эту работу."
80000039-55 = "Позвольте мне немного позаботиться о вас, ладно, Сенсей?"
80000039-56 = "[s] «Спасибо, Фуука.»"
80000039-57 = "Хи-хи. Это всего лишь моя обязанность как главы Клуба школьного питания."
80000039-58 = "[s] «Поешь со мной?»"
80000039-59 = "Хотите, чтобы я присоединилась?"
80000039-60 = "Наверное, я немного перестаралась. Для одного человека слишком много."
80000039-61 = "Хорошо! Если вы хотите, давайте поедим вместе, Сенсей."
80000039-67 = "После того как мы с Фуукой поужинали..."
80000039-69 = "[ns] «Фух! Было отлично!»"
80000039-70 = "Рада, что вам понравилось."
80000039-71 = "И напоследок..."
80000039-72 = ""
80000039-74 = ""
80000039-76 = "[ns] «Это какао?»"
80000039-77 = "Да. А на десерт — ваш подарок ко Дню святого Валентина."
80000039-78 = "Я сама собрала и обработала шоколад, чтобы сделать какао."
80000039-79 = "Как я уже говорила, сегодня День святого Валентина, поэтому..."
80000039-80 = "Пейте, пока тёплое. Это поможет немного расслабиться."
80000039-81 = "[s] «Я люблю тебя, Фуука!»"
80000039-82 = "С-Сенсей! Л-Любите?!"
80000039-83 = "[s] «Кстати, кружки немного похожи на парные.»"
80000039-84 = "Я-Я выбирала их вовсе не поэтому!"
80000039-85 = "Просто это всё, что осталось в комнате Клуба школьного питания..."
80000039-86 = "В-В любом случае. Я-Я рада, что вы хорошо поели! Мне пора!"
