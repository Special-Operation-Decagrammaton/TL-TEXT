80000039-91 = ""
80000039-93 = ""
80000039-94 = "О! Не забудьте сложить остатки в контейнер и поставить в холодильник."
80000039-95 = "Д-До встречи!"
80000039-96 = ""
80000039-98 = ""
80000039-99 = "[ns] «Хорошо. Пока...»"
80000039-101 = "Фуука ушла так быстро, как только смогла. Я размышлял, что могло заставить её так резко уйти, допивая горячий шоколад."
80000039-103 = "[ns] «М-м-м. Сладко.»"
