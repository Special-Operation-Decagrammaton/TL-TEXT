[translation]
1301105-1 = "Воспоминания Момои!"
1301105-2 = "(Я пришёл туда, где мы договорились встретиться с Момои.)"
1301105-3 = "Бип! Сенсей, вы опоздали на пять минут! Уровень симпатии снижен!"
1301105-4 = "[s1] «Прости, Момои. На дороге были пробки...»\n[s2] «Что значит „уровень симпатии снижен“?»"
1301105-5 = "Кхм! Сейчас я расскажу, зачем позвала вас сюда."
1301105-6 = "Кхм! Сейчас я расскажу, зачем позвала вас сюда."
1301105-7 = "Я хочу вместе с вами изучить старые симуляторы свиданий, Сенсей."
1301105-8 = "[s] «Ретро... симуляторы свиданий?»"
1301105-9 = "В Отделе разработки игр мы обсуждали, что стоит изучить побольше жанров ретро-игр."
1301105-10 = "И ещё говорили о том, чтобы сделать прототип."
1301105-11 = "Одной из идей был симулятор, где можно встречаться с красивыми девушками."
1301105-12 = "[s] «Да, я знаю такие игры.»"
1301105-13 = "Да, именно!"
1301105-14 = "Симуляторы свиданий и романтические приключения в основном сосредоточены на сюжете, знаете ли."
1301105-15 = "В зависимости от того, какой вариант вы выбираете в определённом событии,"
1301105-16 = "меняется уровень симпатии, а вместе с ним и концовка."
1301105-17 = "[s] «Так вот почему ты раньше упомянула симпатию...»"
1301105-18 = "Ага! Сейчас уровень симпатии Сенсея — минус пять!"
1301105-19 = "Он уже опасно низкий!"
1301105-20 = "Если не выбрать правильный вариант, не увидишь сцену события и не попадёшь на счастливую концовку!"
1301105-21 = "Итак, Сенсей!"
1301105-22 = "Помогите мне, чтобы мы смогли сделать настоящий симулятор свиданий!"
1301105-23 = "[s] «...Ну почему бы и нет? Ладно.»"
1301105-24 = "Хи-хи, тогда идём!"
1301105-25 = ""
1301105-28 = "[ns] «Это же... игровой зал.»"
1301105-29 = "Именно!"
1301105-30 = "И вот здесь вам предстоит сделать первый выбор!"
1301105-31 = "Вы пришли в игровой зал вместе с героиней."
1301105-32 = "Что хотите сделать первым делом?"
1301105-33 = "[ns3] «Автомат с клешнёй?»\n[ns4] «Конечно же Wonder Girl in Monster World!»"
1301105-34 = ""
1301105-35 = "Бу-у! Симпатия минус пять!"
1301105-36 = "Героиню не слишком заинтересовал автомат с клешнёй!"
1301105-37 = "[s5] «Но я хотел выиграть тебе подарок.»"
1301105-38 = "О... правда?"
1301105-39 = "Хм, раз вы так говорите, Сенсей..."
1301105-40 = "Ну, пожалуй, можно сделать исключение..."
1301105-41 = "Раз уж вы так мило захотели выиграть мне плюшевую игрушку, прибавлю десять очков симпатии!"
1301105-42 = "[s6] «Какая-то случайная у тебя система...»"
1301105-43 = "Не тратьте время на раздумья. Пошли, пошли!"
1301105-44 = "Ух ты! Мы с вами думаем одинаково, Сенсей!"
1301105-45 = "Симпатия плюс пятьсот!"
1301105-46 = "[s7] «По-моему, шкала тут вообще не соблюдается...»"
1301105-47 = "Ну, я давно хотела пройти испытание «одна монета» в Wonder Girl!"
1301105-48 = "[s8] «Да? Тогда давай посоревнуемся, кто пройдёт первым!»"
1301105-49 = "Хорошо! Вызов принят!"
1301105-50 = ""
1301105-51 = "Сойдёмся один на один!"
1301105-54 = "Я так усердно играла в автоматах. Проголодалась... *подглядывает*"
1301105-55 = ""
1301105-56 = ""
1301105-57 = "*подглядывает*"
1301105-58 = "[s] «Знаю. Теперь обед, да?»"
1301105-59 = "Да! Правильно!"
1301105-60 = "Итак, героиня проголодалась!"
1301105-61 = "Какую еду вы выберете?"
1301105-62 = "[s9] «Разве паста не стандартный выбор для романтического свидания?»\n[s10] «Момои, смотри. У них проходит событие по Legend of Zinda!»"
1301105-63 = "С-стандартный выбор для свидания...! (вздрагивает)"
1301105-64 = "[s11] «А? Что такое?»"
1301105-65 = "Н-ничего, Сенсей!"
1301105-66 = "Откуда вы знаете стандартный вариант? Это правильный ответ!"
1301105-67 = "Теперь ваша симпатия плюс сто пятьдесят! Пойдём!"
1301105-68 = "[s12] «Эм, тут написано, что если съесть всё из меню для пары за тридцать минут...»"
1301105-69 = "...то еда полностью бесплатная?!"
1301105-70 = "Как геймер, я не могу отказаться от такой возможности, Сенсей!"
1301105-71 = "[s13] «Погоди, причём тут геймер?»"
1301105-72 = "Вызов принят!"
1301105-73 = "Что? Серьёзно?! Это правда!"
1301105-74 = "Если съесть их фирменное острое карри, в награду дают воздушный шар в форме Высшего меча из Legend of Zinda..."
1301105-75 = "Идём, Сенсей!"
1301105-76 = "[s14] «Эм, я вообще правильный вариант выбрал?»"
1301105-77 = "Ага! Симпатия плюс сто миллионов! Быстрее!"
1301105-78 = "Тут написано: «пока есть в наличии.»"
1301105-79 = "Надо идти, пока всё не разобрали!"
1301105-80 = "[s15] «А система симпатии вообще что-нибудь значит?»"
1301105-81 = "Давайте, быстрее! Это будет отличным испытанием для нас обоих!"
1301105-82 = "Мы обязаны его пройти!"
1301105-85 = "(Мы с Момои взялись за испытание со специальным меню.)"
1301105-86 = ""
1301105-87 = ""
1301105-88 = ""
1301105-89 = "*глоток* *жует* *глоток* В-вкусно!"
1301105-90 = "[s] В-вкусно, но... Момои... Я больше ни кусочка не могу..."
1301105-91 = "Ещё немного, Сенсей! Мы почти справились!"
1301105-92 = "[s] «Момои, когда этот обед закончится... я вернусь в родной город и...»"
1301105-93 = "Нет, Сенсей!"
1301105-94 = "Хватит нести чепуху, иначе я начислю вам штрафные очки!"
1301105-96 = "(Каким-то образом нам с Момои удалось съесть всё до конца.)"
1301105-98 = "Ух ты, мы с вами провели вместе весь день, Сенсей!"
1301105-99 = "Было очень весело!"
1301105-100 = "[s] «Рад это слышать. Так что там с концовкой?»"
1301105-101 = "С концовкой...? О чём вы?"
1301105-102 = "[s] «Ты сказала, что концовка зависит от симпатии.»"
1301105-103 = "О... А, точно! Я ведь правда так сказала!"
1301105-104 = "Мне было так весело, что я совсем забыла... *шепчет*"
1301105-105 = "С учётом набранной сегодня симпатии, эм, получается..."
1301105-106 = "...х-хорошая концовка! *хлоп* *хлоп* *хлоп*"
1301105-107 = "П-поздравляю, Сенсей! Вам удалось завоевать сердце героини!"
1301105-108 = "[s] «Хм?»"
1301105-109 = "А, ха-ха-ха..."
1301105-110 = "[s] «Ну, раз тебе было весело, неважно.»"
1301105-111 = "О, и вы вот так просто это оставите?"
1301105-112 = "*глоток* В-вы такой в-взрослый..."
1301105-113 = "[s16] «Но сегодняшняя система начисления симпатии...»\n[s17] «В итоге всё основывалось на твоих предпочтениях, да?»"
1301105-114 = "А...?"
1301105-115 = "А...?"
1301105-116 = "[s] «Иными словами, героиня, которую я сегодня завоевал, — это...»"
1301105-117 = ""
1301105-118 = "(Ой, секунду...)"
1301105-119 = "П-простите, Сенсей. Мне пора возвращаться!"
1301105-120 = ""
1301105-122 = "(И с этими словами Момои мгновенно исчезла.)"
