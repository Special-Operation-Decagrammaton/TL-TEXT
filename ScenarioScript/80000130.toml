[translation]
80000130-1 = "Холодные кончики пальцев"
80000130-5 = ""
80000130-6 = "Здравствуйте, Сенсей."
80000130-7 = "Рада застать вас в Шале. Было бы жаль проделать путь зря."
80000130-8 = "[s1] «Добро пожаловать, Нагуса.»\n[s2] «Сегодня ты не дежуришь как представительница учеников, так что привело тебя сюда?»"
80000130-11 = "Нет, сегодня не моё дежурство... но ведь сегодня День святого Валентина?"
80000130-12 = "Во время патрулирования с Хяккарёран я многое услышала об этом празднике."
80000130-13 = "Вот, это традиционный валентиновский шоколад. Я хотела вручить его лично."
80000130-14 = "[s3] «Шоколад Нагусы ко Дню святого Валентина...!»\n[s4] «Для меня большая честь, что ты проделала весь путь, чтобы вручить его.»"
80000130-17 = "Вы мне льстите... Ничего особенного."
80000130-18 = "На самом деле я давно хотела вас поблагодарить. Вы всегда так помогаете."
80000130-19 = "И всё же я не решалась просто прийти и сказать это прямо. Слишком неловко было появиться без повода."
80000130-20 = "Поэтому этот праздник показался хорошим оправданием."
80000130-21 = "[s] «Да. Кажется, понимаю.»"
80000130-22 = ""
80000130-25 = "[ns] «Кстати, этот шоколад кажется подозрительно знакомым.»"
80000130-26 = ""
80000130-28 = "Конечно. Это шоколадное печенье — фирменное лакомство Хяккияко. Возможно, вы видели его во время визитов в академию."
80000130-29 = "Для покрытия используют ремесленные сливки из Эбису. Оно мягкое, насыщенное и ровно настолько сладкое, чтобы дополнять печенье."
80000130-30 = "Это одно из моих любимых лакомств, но остальным в Хяккарёран оно почему-то не нравится."
80000130-31 = "Поэтому обычно я в итоге съедаю почти всё сама."
80000130-32 = "[s] «Ну, попробуем...»"
80000130-33 = ""
80000130-36 = ""
80000130-37 = "[ns5] «Ух ты! Очень вкусно.»\n[ns6] «Насыщенный шоколад мгновенно растаял на языке.»"
80000130-40 = "Правда? И сладость ровно такая, как я и говорила."
80000130-41 = "Хотите ещё?"
80000130-42 = "[s] «А, прямо сейчас есть руками немного...»"
80000130-43 = ""
80000130-45 = ""
80000130-46 = "...Ах."
80000130-47 = "Понятно. Тогда... а. Не нужно притворяться ради меня."
80000130-48 = "Простите. Надо было понять, что у меня странные вкусы, особенно раз другим девушкам они тоже не нравятся."
80000130-49 = "...Они гораздо более... нормальные. Не как я."
80000130-50 = "[ns] «Н-Нет, дело не в этом!»"
80000130-52 = "[ns] «Просто я сейчас разбираюсь с документами...»"
80000130-53 = "О? И правда. У вас кончики пальцев все в растаявшем шоколаде."
80000130-54 = "Конечно, это печенье Ivory Lady покрыто очень мягким шоколадом. Он должен таять во рту... но на моих руках никогда не тает."
80000130-55 = ""
80000130-57 = ""
80000130-58 = "...А, точно. Наверное, из-за температуры тела."
80000130-59 = "[s] «Температуры тела?»"
80000130-60 = "Да. У меня она ниже средней. Мне часто говорят, что руки и ноги ненормально холодные."
80000130-61 = "Я никогда не думала, что это может быть полезно. Благодаря этому, наверное, у меня никогда не оставались шоколадные отпечатки пальцев."
80000130-62 = "[s7] «Говоришь как настоящий мастер суши.»\n[s8] «Почему-то я тебе завидую.»"
80000130-65 = "Фу-фу, да. Спасибо."
80000130-66 = "Никогда не думала, что «холоднокровность» может быть преимуществом."
80000130-67 = "Когда прижимаюсь к друзьям, никак не могу согреться, а в жару мне становится дурно..."
80000130-68 = "Но, похоже, есть и плюсы."
80000130-69 = "[s9] «Если подумать, раз я не могу пользоваться руками...»\n[s10] «Может, ты меня покормишь?»"
80000130-72 = "С-Своими руками...?"
80000130-73 = "Если вы не против, я буду рада помочь."
80000130-74 = ""
80000130-76 = ""
80000130-77 = ""
80000130-78 = "Вот, Сенсей. Посмотрите сюда и скажите «а-а»."
80000130-79 = ""
80000130-81 = ""
80000130-83 = "[ns11] «Как и ожидалось, восхитительно...»\n[ns12] «Будто мой мозг исцеляется...»"
80000130-86 = "Фу-фу, правда?"
80000130-87 = "Похоже, я нахожу всё новые преимущества..."
80000130-89 = "После этого я наслаждался тем, как Нагуса кормила меня печеньем с рук, будто птенца."
