[translation]
1014002-1 = "Осторожная лисица"
1014002-2 = "Исполнительный офис Шале"
1014002-3 = "Куруми пришла в Исполнительный офис Шале на смену Представителя Студентов."
1014002-4 = "[ns1] «Добро пожаловать, Куруми!»\n[ns2] «Я тебя ждал!»"
1014002-7 = "Доброе утро, Сенсей."
1014002-8 = "Итак... С чего начать?"
1014002-9 = "[s] «Только что вышел новый шутер на двоих. Хочешь сыграть вместе?»"
1014002-10 = "...Что?"
1014002-11 = "Вы же не серьёзно. Разве вы только что не жаловались, что работы бесконечная гора?"
1014002-12 = "Это не шанс бездельничать. Время РАБОТАТЬ!"
1014002-13 = "Я помогу с отчётами."
1014002-14 = "[s] «Какая злая!»"
1014002-15 = "Может, заслужили! Почему у вас так мало мотивации?"
1014002-17 = "И пока я приятно проводил время с Куруми, разбираясь с задачами Шале..."
1014002-18 = ""
1014002-23 = "[USERNAME] Сенсей, вы здесь?"
1014002-24 = "[s] «Простите, а вы кто...?»"
1014002-25 = "А, я владелец магазина у станции. В прошлый раз вы мне помогли."
1014002-26 = "Тогда студенты, которых я нанял на подработку, оказались хулиганками и захватили магазин. Они разоряли меня, съедая весь хлеб и снеки."
1014002-27 = "Но Сенсей из Шале помог мне. Вы правда спасли меня."
1014002-28 = "[s] «Такое было...?»"
1014002-29 = "Да. Вы уговорили этих нарушительниц уйти и даже помогли потом всё убрать."
1014002-30 = "Наверняка для вас такие проблемы обычное дело, так что понимаю, если не помните."
1014002-31 = ""
1014002-33 = ""
1014002-34 = "..."
1014002-35 = ""
1014002-36 = "Это немного, но я принёс снеки в знак благодарности. Пожалуйста, возьмите."
1014002-37 = "[s3] «Спасибо. Обязательно съем с удовольствием.»\n[s4] «Нет, правда, всё нормально.»"
1014002-39 = "Если откажетесь, мне станет ещё неловче."
1014002-40 = "[s5] «Но...»"
1014002-41 = "Если продолжите отказываться, даже Будда разозлится."
1014002-42 = "[s6] «Ладно-ладно. Большое спасибо.»"
1014002-43 = "Фуфу, рада, что смогла хоть немного отплатить."
1014002-44 = "В следующий раз принесу что-нибудь ещё!"
1014002-45 = "До свидания!"
1014002-46 = ""
1014002-48 = ""
1014002-49 = "..."
1014002-50 = "Сенсей, вы знаете этого человека?"
1014002-51 = "[s7] «Хм... Мне приходится решать самые разные проблемы.»\n[s8] «Толком не помню, но уверен, мы когда-то пересекались.»"
1014002-54 = "Что? Вы впустили в Шале человека, которого даже НЕ ПОМНИТЕ?"
1014002-55 = "А если он собирался причинить вам вред?"
1014002-56 = "[s] «Да брось, сомневаюсь.»"
1014002-57 = ""
1014002-60 = "[ns] «И ты ведь здесь, Куруми. Что может случиться?»"
1014002-61 = "Конечно, я успела бы обезвредить нападающего ещё до того, как он достал оружие..."
1014002-62 = "Но дело не в этом! У вас слишком слабая безопасность."
1014002-63 = "Что вы делаете, когда меня нет?"
1014002-64 = "[s9] «Смотри, Куруми. Я сначала не заметил...»\n[s10] «...но в этой красивой упаковке печенье выглядит очень вкусно.»"
1014002-67 = "И правда похоже на дорогое печенье."
1014002-68 = "Но если оно домашнее, а не фабричное..."
1014002-69 = "[s] «Спасибо за еду!»"
1014002-70 = "СТОЙТЕ!"
1014002-71 = "Сенсей! Нельзя есть домашнее печенье от незнакомого человека!"
1014002-72 = "[s] «Почему...?»"
1014002-73 = "Потому что вы чрезвычайно важный V-VIP, известный по всему Кивотосу!"
1014002-74 = "В это печенье могли подмешать дурные намерения!"
1014002-75 = "В борьбе за власть в преступном мире некоторые боссы отправляют другим шоколад с сывороткой правды или даже ядом, чтобы получить преимущество в переговорах."
1014002-76 = "Что мешает кому-то поступить так с вами, [USERNAME] Сенсей?"
1014002-77 = "Нужно лучше оценивать и предотвращать потенциальные опасности!"
1014002-78 = "До уровня бойца спецназа вроде меня вам не дотянуться, но хотя бы немного осознавайте своё положение."
1014002-79 = "[s11] «В этом тоже есть смысл, но...»\n[s12] «Трудно завоевать доверие студентов, если быть слишком жёстким.»"
1014002-82 = "Нет. У меня приказ президента Генерального студенческого совета обеспечить вашу безопасность."
1014002-83 = "Это значит, что исключений быть не может. Именно в исключениях и случаются происшествия."
1014002-84 = ""
1014002-88 = "[ns] «...Тогда поможешь мне, Куруми?»"
1014002-89 = "Я? А что я могу сделать?"
1014002-90 = "[s13] «Сначала попробуй это подаренное печенье, Куруми.»\n[s14] «Если с тобой ничего не случится, значит, мне тоже безопасно его есть, верно?»"
1014002-93 = "Как дегустатор яда? Может сработать..."
1014002-94 = "Но если речь о печенье, у нас есть и другие участницы..."
1014002-95 = "[s15] «Пожалуйста, помоги, Куруми!»\n[s16] «Я не могу доверить свою безопасность никому другому!»"
1014002-98 = "Хмф. Похоже, выбора нет. Раз вы так говорите, Сенсей."
1014002-99 = "Тогда, на всякий случай, я попробую первой."
1014002-100 = ""
1014002-102 = ""
1014002-103 = "[ns] «...Ну как?»"
1014002-104 = "...Вкусно."
1014002-105 = "Ммм. Оно просто тает во рту. Наверняка использовали очень дорогое масло."
1014002-106 = "О, яда нет! Думаю, это печенье безопасно есть."
1014002-107 = "[s] «Слава богу, не отравлено.»"
1014002-108 = ""
1014002-111 = "[ns17] «Кстати, у меня накопилась куча подарков, насчёт которых я нервничал...»\n[ns18] «Можешь и для них побыть дегустатором?»"
1014002-114 = "П-Подарков, насчёт которых вы нервничаете...?"
1014002-115 = "Для этого я здесь, Сенсей. Используйте меня для любых проверок!"
1014002-117 = "Я водил Куруми по всему Шале, давая ей разные подарки, которые у нас накопились."
1014002-119 = "Это чайные листья...?"
1014002-120 = "Ну, подмешать яд в чайные листья — древний способ убийства. Такое нельзя игнорировать."
1014002-121 = "Так, посмотрим..."
1014002-122 = ""
1014002-124 = ""
1014002-125 = "Проблем нет. Этот чай безопасно пить."
1014002-126 = ""
1014002-128 = "Торт Miracle 5,000?! Даже в Тринити его трудно достать! Кто вам это подарил?!"
1014002-129 = "Дайте проверю на яд..."
1014002-130 = ""
1014002-132 = ""
1014002-133 = ""
1014002-134 = "Ого... Никогда не пробовала ничего настолько роскошного."
1014002-135 = ""
1014002-137 = ""
1014002-138 = "Ч-Чисто! Яда нет."
1014002-140 = "Что? Вы хотите, чтобы я понюхала духи и проверила, не отравлены ли они?"
1014002-141 = "Н-Наверное, такая возможность есть... Хорошо."
1014002-142 = ""
1014002-144 = ""
1014002-145 = "Мм, пахнет приятно... Лёгкий запах берёзы помогает расслабиться..."
1014002-146 = "И с этим всё нормально.#nНо Сенсей, правда ли все эти проверки были необходимы?"
1014002-147 = "[s] «Теперь сюда!»"
1014002-152 = "Комната ночной смены Шале"
1014002-153 = ""
1014002-154 = ""
1014002-155 = "Э-Это спальня?"
1014002-156 = "С-Сенсей? О чём вы думали, приводя меня сюда?!"
1014002-157 = "[s19] «Я купил новую подушку.»\n[s20] «Полежишь на ней и проверишь, не отравлены ли волокна, Куруми?»"
1014002-160 = ""
1014002-162 = ""
1014002-163 = "...Меня обманули."
1014002-164 = "Я так увлеклась дегустацией всего подряд, что не заметила..."
1014002-165 = "Проверка на яд была просто предлогом, чтобы не работать!"
1014002-166 = "[s] «Чёрт. Меня раскрыли.»"
1014002-167 = "Вы сейчас серьёзно?! Немедленно обратно к работе!"
1014002-169 = "После этого я с удовольствием закончил дела Шале вместе с немного сердитой Куруми."
