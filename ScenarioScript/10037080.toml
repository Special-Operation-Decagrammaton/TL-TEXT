[translation]
10037080-1 = "Эпизод 8;Послушай куклу"
10037080-3 = "Премьера совершенно новой постановки, да ещё так внезапно... Как интересно."
10037080-4 = "Раз первое представление было хорошим, уверена, и это будет отличным!"
10037080-5 = "Да. Я тоже жду. И Кагуя уже очень давно не была настолько увлечена какой-либо постановкой."
10037080-6 = "Мм! Кажется, я уже привыкаю к этому звучанию!"
10037080-7 = "О, актёры в доспехах выбежали на сцену одной линией и аккуратно выстроились."
10037080-8 = ""
10037080-10 = ""
10037080-11 = "Главная роль снова в чёрных доспехах! Я начинаю узнавать больше деталей!"
10037080-12 = "Фуфу! Правда? Рада это слышать."
10037080-13 = ""
10037080-19 = ""
10037080-21 = ""
10037080-22 = "Жизнь подобна большому сну."
10037080-24 = ""
10037080-25 = "Как можно так отчаянно бороться за жизнь?"
10037080-26 = "Что бы ни случилось, я лежу под колонной."
10037080-27 = "Внезапно я просыпаюсь. Смотрю во двор."
10037080-29 = "Среди цветов кричит одинокая птица."
10037080-31 = "Давайте спросим, какое сейчас время."
10037080-32 = "Песня соловья подобна течению весеннего ветра."
10037080-34 = "Он поёт громко и ждёт прихода луны!"
10037080-35 = ""
10037080-37 = ""
10037080-39 = "Так... Всё всегда начинается с описания места вокруг персонажей."
10037080-40 = "Пекинская опера всегда следует установленной форме — будто ей приказано так делать."
10037080-41 = "Но Кагуя ведь написала это с нуля, да?"
10037080-42 = "Да, она написала всю постановку всего за несколько дней. Впечатляет."
10037080-43 = ""
10037080-45 = ""
10037080-47 = "Над озером расцветает лёгкий туман."
10037080-48 = "Пятнистый солнечный свет обещает хороший урожай в этом году."
10037080-49 = "Мир спокоен, и мне больше нечего желать."
10037080-50 = "Дракон и феникс держали в своих устах благоприятную силу."
10037080-52 = "Смотрите, люди. Тёмный Монарх идёт через двор."
10037080-53 = "Она умна и проницательна, но узколоба и глупа."
10037080-54 = "Она царствует и правит, но не способна опустить взгляд."
10037080-55 = ""
10037080-58 = "Хотя достаточно мудра, чтобы понимать собственные слабости."
10037080-59 = "Но ей не хватает смелости их преодолеть!"
10037080-60 = ""
10037080-63 = ""
10037080-64 = "Ч-Что...?! П-Подождите. Это сейчас было...?"
10037080-65 = "Вы слишком громко говорите! Мы точно правильно услышали?"
10037080-66 = "Э-Это может быть просто старое выражение или метафора, да? Давайте послушаем дальше..."
10037080-67 = "Но всё же... Они оставили это слишком открытым для толкования... Тёмный Монарх, значит..."
10037080-69 = "Я, Тёмный Монарх, воспользуюсь властью, чтобы говорить."
10037080-70 = "Скрытый конфликт пронизывает двор, а плохо скрываемая обида тянется до самых стропил."
10037080-71 = "В ответ я открою закрытые двери и впущу ветер извне."
10037080-72 = "Таков мой путь, и потому все должны слушать и поступать соответственно."
10037080-73 = ""
10037080-76 = ""
10037080-77 = "(...?! Открыть закрытые двери и впустить ветер извне...?)"
10037080-78 = "(У меня плохое предчувствие... Что подумают другие студенты, особенно члены Генрюмона...?)"
10037080-79 = ""
10037080-81 = ""
10037080-83 = ""
10037080-85 = "(Но члены Генрюмона куда лучше остальных студентов Шаньхайцзина умеют толковать Пекинскую оперу...!)"
10037080-86 = "(Кагуя... О чём ты думаешь?!)"
10037080-88 = "Простите и вспомните прошлое."
10037080-89 = "Те, кто идёт против её воли, познают её гнев."
10037080-90 = "Такова всем сердцем божественная сила небес."
10037080-91 = "Что могут значить перед ней жалкие уловки человека?"
10037080-93 = "Задумайтесь о хрупкости, скрытой в покое."
10037080-94 = "И снова задумайтесь о покое, скрытом в хрупкости."
10037080-95 = "Гармония неба и свода так же непредсказуема."
10037080-96 = "Так откройте то, что сдерживает сила ветра, и вновь сдержите то, что открыто."
10037080-98 = "Смотрите, люди. Вот насколько недолговечна человеческая мудрость."
10037080-99 = "Тот, кто хвастается мудростью, станет глупцом."
10037080-100 = "Остерегайтесь нежданных благ и удачи, без причины переливающейся через край."
10037080-101 = "Следует устремлять взгляд выше, иначе станете жертвой этих уловок."
10037080-103 = "Что вообще с этими девчонками из Клуба Пекинской Оперы?"
10037080-104 = "Они чем-то недовольны госпожой? Если так, им не стоило выносить свои претензии перед гостями из Красной Зимы..."
10037080-105 = "П-Подождите. Они ведут себя так именно из-за гостей из Красной Зимы?!"
10037080-106 = "О... Теперь, когда я думаю об этом, а что, если гостей вообще не стоило принимать...?"
10037080-108 = "Смотрите, люди. Тёмный Монарх впустила ветер."
10037080-109 = "Закрытая дверь распахнулась, и пыль неистовствует внутри."
10037080-110 = "Вода не способна победить ветер, а землю опустошает саранча."
10037080-111 = ""
10037080-115 = "Гордец не способен взглянуть на себя, и землю смачивают не дожди, а слёзы!"
10037080-116 = ""
10037080-119 = ""
10037080-120 = "(...!)"
10037080-121 = "(Неужели Кагуя и правда делает это со мной перед всем Генрюмоном...?! )"
10037080-122 = ""
10037080-124 = ""
10037080-127 = "(Угх... Похоже, я ещё не полностью пришла в норму. Однако...)"
10037080-128 = ""
10037080-131 = ""
10037080-133 = "Я, Тёмный Монарх, снова воспользуюсь властью, чтобы говорить."
10037080-134 = "Гора не отвергает высоту, а океан не отвергает глубину."
10037080-135 = "Оставшаяся земля встретит ветер, а небо обнимет облака."
10037080-136 = "Я могу отвернуться от мира, но не позволю миру отвернуться от меня!"
10037080-137 = "Смиренно прошу вновь. Успокойте дух и позаботьтесь о себе."
10037080-138 = "Она знает, что случится, ещё до того, как это произойдёт, и размышляет о конце уже в самом начале."
10037080-139 = "Принимать честные советы — путь к выживанию."
10037080-140 = "Как можно не плакать, потеряв множество ради малой выгоды!"
10037080-141 = ""
10037080-143 = ""
10037080-145 = "У Тёмного Монарха сильная воля... и решимость! Именно таким и должен быть лидер!"
10037080-146 = "А те вассалы, которые пали из-за этого! Всё было сделано с намерением!"
10037080-147 = "Всегда найдутся недальновидные вассалы, которые не видят замыслов выдающихся лидеров вроде нас. Разве не так, госпожа Кисаки?"
10037080-148 = ""
10037080-150 = ""
10037080-151 = ""
10037080-152 = ""
10037080-153 = "А? Вы плохо выглядите. Всё в порядке, госпожа?"
10037080-154 = ""
10037080-156 = ""
10037080-157 = "Ах... Всё хорошо. Со мной всё в порядке, Великий Вождь Черино."
10037080-158 = "(Неужели тебе настолько не понравилась встреча по обмену, Кагуя?)"
10037080-159 = "(И ещё важнее, ты пытаешься выразить протест через Пекинскую оперу...?)"
10037080-161 = "Теперь, когда Тёмный Монарх призвала ветер."
10037080-162 = "С неба льются проливные дожди, и река выходит из берегов."
10037080-163 = "Горы и поля затоплены, а океан бушует."
10037080-165 = "Молнии и смерчи терзают землю, заставляя крики и обиду эхом разноситься вокруг!"
10037080-166 = ""
10037080-169 = ""
10037080-170 = "Мы ведь не ослышались?!"
10037080-171 = "...Это правда, что президент первой пригласила гостей из Красной Зимы..."
10037080-172 = "Но ведь сама группа гостей не устроила каких-то огромных проблем!"
10037080-173 = "Нет... Кажется, я начинаю понимать. Со временем даже крошечная трещина может разрушить плотину."
10037080-174 = "...Значит, президент начнёт впускать внешнее влияние, начиная с гостей из Красной Зимы."
10037080-175 = "Надеюсь, этого не произойдёт..."
10037080-176 = "То же самое касается инцидента с десятитысячелетним женьшенем, но действительно ли президент пытается защищать традиции Шаньхайцзина... Иногда я немного сомневаюсь..."
10037080-177 = "С-Следи за словами!"
10037080-178 = "Поэтому я и говорю тихо!"
10037080-179 = ""
10037080-181 = ""
10037080-183 = "Боль течёт, словно река, а обида тянется до небес."
10037080-184 = "Хорошее лекарство горько на вкус, но полезно от болезни."
10037080-185 = "Совет неприятен уху, но полезен для поступков."
10037080-186 = "Если даже сейчас изменить сердце и пойти путём добра."
10037080-187 = "Можно вернуться назад, не дав себе увлечься ни вперёд, ни назад."
10037080-189 = "Я не ошибаюсь, поэтому не уступлю!"
10037080-191 = "Прошу вашей милости!"
10037080-192 = "Как воробей может понять волю феникса!"
10037080-193 = "Жизнь воробья и жизнь феникса — всё это одинаково жизнь!"
10037080-194 = ""
10037080-196 = ""
10037080-198 = "(Аааах... Аааах...!)"
10037080-199 = "(О чём вообще думает Кагуя...! Нет, подождите...)"
10037080-200 = ""
10037080-202 = ""
10037080-203 = ""
10037080-205 = "(Гораздо хуже тревожная атмосфера среди членов Генрюмона...!)"
10037080-206 = "(Эффект был бы куда слабее, если бы это сообщение передали прямо, в форме какого-нибудь манифеста...!)"
10037080-207 = "(Но сделать всё настолько публично и при этом завуалированно через представление...!)"
10037080-208 = "(Президента нужно эвакуировать... сейчас же!)"
10037080-209 = ""
10037080-211 = ""
10037080-212 = ""
10037080-214 = "...Теперь актёры держат флаги с нарисованным пламенем и бегают по сцене."
10037080-215 = "Значит, мир охвачен огнём, да?"
10037080-216 = "А флаги с текущей водой..."
10037080-217 = "Они изображают наводнение?"
10037080-218 = "Стаи саранчи и молнии... Кажется, все стихийные бедствия происходят одновременно."
10037080-219 = ""
10037080-221 = ""
10037080-222 = ""
10037080-224 = "(Я всё это время внимательно наблюдала, на всякий случай.)"
10037080-225 = ""
10037080-227 = ""
10037080-228 = "(...Но теперь ясно: это государственный переворот.)"
10037080-230 = "Смотрите, люди. Тёмный Монарх наконец сама рухнула."
10037080-231 = "Монарх должен должным образом править своим народом."
10037080-232 = "Но она пошла против замысла небес из-за жадности и несостоятельности."
10037080-233 = "И сколько бы все ни рыдали и ни скрежетали зубами, что может остаться?"
10037080-235 = "Они упомянули замысел небес...!"
10037080-236 = "...По крайней мере, я понимаю, что пытается сказать Президент Кагуя..."
10037080-237 = "Но... ведь она говорит о нашей президенте..."
10037080-238 = "Ну, это правда... Мне даже думать об этом тяжело, но..."
10037080-239 = ""
10037080-241 = ""
10037080-243 = "А что, если президент и правда больше не хочет защищать традиции Шаньхайцзина...?"
10037080-244 = "Я-Я не могу даже думать о таком!"
10037080-246 = "То место, что вы видите там, — наш дом."
10037080-247 = "Он зарос соснами и деревьями с кедровыми орехами."
10037080-248 = "Дикий заяц часто заглядывает в маленькую нору."
10037080-249 = "Безразличный фазан летает над балками."
10037080-250 = "Очистить и растолочь зёрна в рис."
10037080-251 = "Собрать листья мальвы и сварить из них суп."
10037080-252 = "Суп и рис готовы в мгновение."
10037080-253 = "Но с кем их есть?"
10037080-255 = "Ох... Какие душераздирающие строки..."
10037080-256 = "Подумать только, не осталось ни одного человека, с кем можно разделить еду, потому что всё пришло в упадок..."
10037080-257 = ""
10037080-259 = ""
10037080-260 = "...А что, если это будущее Шаньхайцзина?"
10037080-261 = "...Нет...! Это невозможно...!"
10037080-262 = "Видишь. Даже ты говоришь без уверенности."
10037080-263 = ""
10037080-266 = ""
10037080-268 = "Слушайте внимательно, люди. Всегда будьте скромны, размышляйте о себе и не забывайте совершенствоваться."
10037080-269 = "За всем стоит причина."
10037080-270 = ""
10037080-273 = "Она не знала, что вчерашнее самоосмысление продолжится и завтра."
10037080-274 = "Когда она отвернулась от своей небесной судьбы и притворилась, что не замечает её, судьба стала неизбежной."
10037080-275 = "Чтобы подобное больше никогда не повторилось..."
10037080-276 = ""
10037080-279 = "Во имя Шаньхайцзина и его традиций я осуждаю Рюгэ Кисаки, президента Генрюмона!"
10037080-280 = ""
10037080-282 = ""
10037080-284 = ""
10037080-286 = ""
10037080-288 = "...!"
10037080-289 = ""
10037080-293 = ""
