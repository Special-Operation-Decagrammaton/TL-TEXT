[translation]
901010800340-6 = "Теперь о ящиках, которые я нашла на складе..."
901010800340-7 = "В центре склада была охлаждаемая зона для продуктов. Но там я почти исключительно нашла краба."
901010800340-8 = "Даже для гигантской крабовой вечеринки это слишком много."
901010800340-9 = "Зачем семья Карпаччо купила столько крабов, не собираясь их есть?"
901010800340-10 = "Может, они посредники? Хотят перепродать."
901010800340-11 = "Перепродажа морепродуктов в принципе запрещена. К тому же выбросить на рынок столько краба — гарантированно привлечь внимание."
901010800340-12 = "А если они не планировали получать столько краба? Например, рыбак-должник расплатился крабами вместо денег."
901010800340-14 = "Смело. Но крабы, найденные Нико на складе, скорее всего были официальной и намеренной покупкой."
901010800340-15 = "Я проверила записи последнего аукциона морепродуктов. Оказалось, семья Карпаччо выиграла торги на огромную партию крабов."
901010800340-16 = "Покупка была настолько заметной, что породила подозрительный слух о семье Карпаччо..."
901010800340-17 = "Возможно, именно ради этого они и сделали ставку."
901010800340-18 = "Итак, семья Карпаччо купила столько крабов, чтобы..."
901010800340-19 = ""
901010800340-21 = ""
901010800340-22 = ""
901010800340-25 = ""
901010800340-26 = "#Q;니코;Итак, семья Карпаччо купила столько крабов, чтобы...\n[as1] «Устроить крабовую вечеринку.»\n[as3] «Перепродать их с прибылью.»\n[as2] «Запустить скандальный слух.»"
901010800340-27 = "Ну, не то чтобы они никогда не устраивали вечеринок."
901010800340-28 = "Но сёстры Карпаччо не очень похожи на весёлых любительниц праздников."
901010800340-29 = "И это не объясняет, почему купили только крабов. А лимоны? Масло?"
901010800340-30 = "Должна быть причина получше."
901010800340-31 = ""
901010800340-33 = ""
901010800340-35 = ""
901010800340-36 = ""
901010800340-39 = "Верно. Это должно быть связано со слухами о крабах из бочки."
901010800340-40 = "Уверена, семья Карпаччо понимала, что закупка такого количества крабов вызовет вопросы, особенно раз они не занимаются морепродуктами."
901010800340-41 = "Уже были слухи о крабах-монстрах и случаи исчезновения людей..."
901010800340-42 = "Люди, не знающие деталей, вполне могли предположить о семье Карпаччо самое худшее."
901010800340-43 = "Ахаха... Я бы этого не советовала."
901010800340-44 = "Как сказала Юкино, перепродажа морепродуктов незаконна. Кроме того, рынок крабов сильно упал. Получить прибыль будет очень сложно."
901010800340-45 = "Раз они готовы перейти дорогу Казначейству, разве не стали бы контрабандой возить что-нибудь ценнее?"
901010800340-46 = ""
901010800340-48 = ""
901010800340-49 = ""
901010800340-52 = "Если слух настолько распространённый и жестокий, почему Валькирия им не занимается?"
901010800340-53 = "Семья Карпаччо достаточно умна, чтобы не провоцировать их."
901010800340-54 = "Думаю... потому что они пришли к тому же выводу, что и мы."
901010800340-55 = "И что же?"
901010800340-56 = "Как бы подозрительно ни звучал слух, расследование показало бы, что на самом деле никто не пострадал."
901010800340-57 = "Возможно, у Валькирии просто не было оснований продолжать расследование."
901010800340-59 = "Похоже, даже у Валькирии есть пределы."
901010800340-60 = "Методы семьи Карпаччо гораздо хитрее, чем я думала."
