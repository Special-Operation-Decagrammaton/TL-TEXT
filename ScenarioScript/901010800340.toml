#[!][Data: "20/09"]
[translation]
901010800340-6 = "Quanto às caixas encontradas na área de mantimentos..."
901010800340-7 = "No setor de alimentos do galpão, não havia nenhum outro mantimento, apenas uma pilha enorme de caranguejos."
901010800340-8 = "Dava até pra pensar que estavam organizando um festival gastronômico do caranguejo."
901010800340-9 = "Por que a Família Carpaccio compraria mais caranguejo do que poderiam comer?"
901010800340-10 = "Será que pretendiam revender para lucrar em outro lugar?"
901010800340-11 = "A revenda clandestina de pescados é terminantemente proibida por lei. #nAlém disso, movimentar uma carga maciça de crustáceos chamaria atenção demais, não acha?"
901010800340-12 = "Então... os caranguejos vieram parar lá por acaso? #nTipo algum pescador pagando dívida em caranguejo vivo para os mafiosos?"
901010800340-14 = "Não sei se existe pescador corajoso o bastante pra peitar a máfia com caranguejo, mas as caixas que a Nico encontrou foram compradas legalmente pela própria Família Carpaccio."
901010800340-15 = "Analisei as notas de arremate do mercado do cais, e há registros de lances altíssimos deles comprando toneladas de caranguejo."
901010800340-16 = "Por causa dessa compra sem sentido, os boatos suspeitos ao redor da organização explodiram de vez..."
901010800340-17 = "O que indica que o próprio ato de comprar os caranguejos já era o verdadeiro objetivo deles."
901010800340-18 = "Sendo assim, o motivo para comprarem tantos caranguejos foi—"
901010800340-19 = ""
901010800340-21 = ""
901010800340-22 = ""
901010800340-25 = ""
901010800340-26 = "Sendo assim, o motivo para comprarem tantos caranguejos foi—\n[as1] Para fazer uma festa do caranguejo.\n[as3] Para revender no mercado negro e lucrar.\n[as2] Para espalhar os boatos sobre os caranguejos monstros."
901010800340-27 = "Bom, impossível não é..."
901010800340-28 = "Mas é difícil imaginar os brutamontes da Família Carpaccio sentadinhos fazendo um piquenique alegre de caranguejo."
901010800340-29 = "E não ter nenhum outro ingrediente no depósito reforça que a intenção não era culinária."
901010800340-30 = "Com certeza tem outra explicação por trás."
901010800340-31 = ""
901010800340-33 = ""
901010800340-35 = ""
901010800340-36 = ""
901010800340-39 = "Sim, com certeza foi para fortalecer a lenda do 'Caranguejo de Tambor de Óleo'."
901010800340-40 = "Se uma organização sem nenhuma ligação com o comércio de frutos do mar compra caranguejos aos montes, eles sabem muito bem que isso vai gerar todo tipo de fofoca."
901010800340-41 = "E como já corriam boatos de que o caranguejo gigante devorava pessoas desaparecidas..."
901010800340-42 = "Para quem vê de fora sem saber a verdade, é fácil tomar tudo como fato verídico."
901010800340-43 = "Hahaha... essa hipótese não cola muito."
901010800340-44 = "Como expliquei antes, a revenda não autorizada é proibida e a cotação do caranguejo despencou... seria quase impossível ter lucro com isso."
901010800340-45 = "Se pretendessem desafiar a Receita do Conselho Estudantil Federal, contrabandeariam produtos com margem de lucro muito maior."
901010800340-46 = ""
901010800340-48 = ""
901010800340-49 = ""
901010800340-52 = "Mas com um boato tão absurdo circulando, por que a Valkyrie nunca investigou a fundo?"
901010800340-53 = "Até para a Família Carpaccio, não era arriscado chamar a atenção da polícia?"
901010800340-54 = "Isso não seria... porque chegaram exatamente à mesma conclusão que nós chegamos antes?"
901010800340-55 = "À mesma conclusão?"
901010800340-56 = "Por mais que o boato pareça aterrorizante, quando a polícia vai averiguar, descobre que não há vítima alguma."
901010800340-57 = "Por isso a Academia de Polícia Valkyrie arquivava as ocorrências como meros trotes sem fundamento."
901010800340-59 = "Pois é, o efetivo de oficiais da Valkyrie já é reduzido. #nFicar correndo atrás de fofoca tem limite."
901010800340-60 = "Que jogada ardilosa... Usaram uma brecha perfeita."
