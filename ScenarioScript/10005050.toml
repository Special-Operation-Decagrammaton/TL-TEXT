[translation]
10005050-1 = "Эпизод 5;Решение проблем в стиле C&C"
10005050-4 = "Карцер «Золотого Руна»"
10005050-6 = "Ай, щиплет... Я вся в ссадинах."
10005050-7 = "Вы в порядке, Сенсей? Не ранены?"
10005050-8 = "[s1] «Я в порядке. Не ранен.»\n[s2] «На передовой была именно ты.»"
10005050-11 = "Фух."
10005050-12 = "Я рада. Если бы вы пострадали, пришлось бы проломить ещё больше голов."
10005050-13 = "...В любом случае, клянусь, там было человек сто охраны."
10005050-14 = "Я бы всех уложила, если бы не эти дурацкие туфли."
10005050-15 = "Тц. Я же говорила, что осторожничать не сработает."
10005050-16 = "...Но всё равно простите, Сенсей. Теперь и вас схватили."
10005050-17 = "[s3] «Я в порядке. Не переживай за меня.»\n[s4] «Учитывая обстоятельства, ты довольно спокойна, Нэру.»"
10005050-18 = "Как скажешь..."
10005050-19 = "Как скажешь..."
10005050-20 = "Ну, если честно, для нас это почти обычное дело. В нашей работе к такому привыкаешь."
10005050-21 = "И ситуацию ещё можно спасти."
10005050-22 = "Хотя меня бесит, насколько всё станет муторно дальше..."
10005050-23 = ""
10005050-26 = "Ю-ху! Нэру, я зде-е-есь!"
10005050-27 = "*вздыхает*"
10005050-28 = "Вот это я и называю муторно."
10005050-29 = ""
10005050-31 = ""
10005050-34 = ""
10005050-35 = "Яхахаха! Ну вы меня и поймали!"
10005050-36 = "Милое личико Асуны появилось на табло, а потом прямо за мной возникло твоё!"
10005050-37 = "Но вам не повезло! Посетители здесь полностью защищены."
10005050-38 = "По сути, каждый из этих замечательных охранников — мой личный телохранитель. Даже ты не победишь, Нэру!"
10005050-39 = "Разве что решишься драться со всеми до единого и устроить проблемы в чужой школе."
10005050-40 = "Хм-м... Или..."
10005050-41 = "Можешь попытать счастья и получить VIP-пропуск, вытянув S-класс в розыгрыше."
10005050-42 = "Тогда получишь внесудебные полномочия и неприкосновенность, так что это бы сработало! Яхахаха!"
10005050-43 = "Но такого не случится! Ха! Хотела бы я увидеть, как Нэру тратит свои драгоценные деньги ради S-класса."
10005050-44 = "Даже потратив все эти облигации, я ни разу не видела S-класс. Так что удачи!"
10005050-45 = "На этот раз я, Куросаки Коюки, по-настоящему свободна от зла Миллениума!"
10005050-46 = "Моя прекрасная, великолепная персона захватит этот корабль и будет жить королевской жизнью, которой заслуживает."
10005050-47 = "Ну и энергии в тебе."
10005050-48 = "Но следи за манерами. Разве не видишь, здесь взрослый?"
10005050-49 = "А? Взрослый?"
10005050-50 = ""
10005050-51 = "*ахает*"
10005050-52 = "Ого! Я вас раньше никогда не видела!"
10005050-53 = "Рада знакомству. Я Куросаки Коюки, но мои любимые старшие называют меня кодовым именем Белая Кроличка."
10005050-54 = "[s5] «Привет, Коюки. Похоже, ты к такому привыкла не меньше Нэру.»\n[s6] «Цель знает собственное кодовое имя...»"
10005050-55 = "Яхахаха! Я не впервые в такой ситуации!"
10005050-56 = "Яхахаха! Я не впервые в такой ситуации!"
10005050-57 = "Кстати, что такой взрослый делает здесь? Вы опекун Нэру?"
10005050-58 = "Что...?!"
10005050-59 = "[s7] «Можно сказать и так.»\n[s8] «Хотелось бы, но, к сожалению, нет.»"
10005050-60 = "З-Заткнись! Это не так! Совсем не так!"
10005050-61 = "З-Заткнитесь! Зачем вы говорите такие странные вещи?!"
10005050-62 = "Не подыгрывайте этой мелкой, Сенсей!"
10005050-63 = "А?"
10005050-64 = ""
10005050-65 = "Сенсей...?!"
10005050-66 = "О-о, ничего себе! Вы Сенсей? Я раньше таких не видела!"
10005050-67 = "А что вообще делает Сенсей? Нянчится с Нэру?"
10005050-68 = "Заткнись, мелкая! Не твоё дело!"
10005050-69 = "[s9] «А ты, Коюки?»\n[s10] «Твои старшие переживали. Что ты здесь делаешь?»"
10005050-70 = "Я? Ничего плохого, обещаю, хи-хи."
10005050-71 = "Я? Ничего плохого, обещаю, хи-хи."
10005050-72 = "...Что?"
10005050-73 = "Наверное, я взяла одну-две облигации для розыгрыша, когда деньги закончились..."
10005050-74 = "Я бы сказала, гораздо больше одной-двух..."
10005050-75 = "Ты вообще следила за расходами? Ты понимаешь, сколько потратила?"
10005050-76 = "Следила? А надо было?"
10005050-77 = "Яхахаха! Я просто тратила, когда было нужно, так что узнаете сумму только по счёту!"
10005050-78 = "Сколько же ты играла?! Ты собиралась спустить всю жизнь на азартные игры?"
10005050-79 = "Хмф! Я не считала часы! И вообще, я уже почти должна была выиграть, между прочим!"
10005050-80 = "*вздох* И что будешь делать, когда потратишь все деньги Миллениума?"
10005050-81 = "У других школ тоже есть деньги."
10005050-82 = "..."
10005050-83 = "И ты совсем не видишь в этом ничего плохого?"
10005050-84 = "Плохого...? Если деньги есть... Почему я не могу их потратить?"
10005050-85 = "Для экономики хорошо, когда деньги обращаются. Я ведь помогаю, да?"
10005050-86 = ""
10005050-88 = ""
10005050-89 = "Теперь понимаете, Сенсей? До неё не достучаться."
10005050-90 = "То же могу сказать о тебе, Нэру! Хмф. Вечно вспыльчивая и жестокая."
10005050-91 = "Пусть я и за решёткой, но следи за языком."
10005050-92 = "Остальные скоро придут и вытащат меня отсюда."
10005050-93 = "И как только это случится, мой кулак полетит прямо...!"
10005050-94 = ""
10005050-97 = ""
10005050-98 = ""
10005050-100 = ""
10005050-104 = ""
10005050-105 = "Так и знала, что найдём вас здесь."
10005050-106 = "О боже. Похоже, мы все снова вместе."
10005050-108 = "Ик! В-Вы...?!"
10005050-109 = "Хахаха! Я же говорила!"
10005050-110 = "Я знала, что вы придёте нас вызволять!"
10005050-112 = ""
10005050-114 = ""
10005050-115 = "Чего стоите? Заходите уже!"
10005050-117 = "...?"
10005050-118 = "...Хи-хи."
10005050-119 = "..."
10005050-120 = "Нас тоже поймали."
10005050-121 = ""
10005050-123 = ""
10005050-124 = "Это абсолютный, полный кошмар."
