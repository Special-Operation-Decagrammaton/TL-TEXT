[translation]
211110-1 = "Episode 11;Unfamiliar Peace"
211110-3 = "……."
211110-4 = "Ugh……."
211110-10 = "Hasn't Makoto been acting like that for a while now?"
211110-11 = "Yes. It's quiet, so I'm grateful."
211110-12 = "It's rare for her to be in such a state. I wonder if something happened?"
211110-14 = "That serious expression... It's a photo opportunity!"
211110-24 = "……."
211110-25 = "Whoa, President Makoto strikes a pose immediately! Truly the pride of Pandemonium!"
211110-26 = "Naturally. Those who stand at the pinnacle must be prepared to be exposed to the media at any time."
211110-27 = "Makoto, why the serious face?"
211110-28 = "That is……."
211110-32 = "It's because of *that*, isn't it?"
211110-33 = "Are you feeling threatened because the Gehenna Restoration Committee is getting so much attention?"
211110-37 = "Iroha…… how did you know that……!!"
211110-38 = "Well, you can tell just by watching, you know."
211110-39 = "You talked such a big game before... and now that it's actually happening, you're getting anxious."
211110-41 = "What, is that all? That's so like you, Makoto."
211110-42 = "But does it really matter who's getting attention? It has nothing to do with us, right?"
211110-43 = "No, that's where you're wrong."
211110-44 = "They are desperate to bring irreversible change to Gehenna."
211110-45 = "And…… their struggle is steadily yielding results."
211110-46 = "Until now, no organization in Gehenna could rival Pandemonium in terms of influence. #nAt most, maybe the Prefect Team."
211110-47 = "That is precisely why I was able to realize my governing philosophy: 'Rule by Inaction'!"
211110-48 = "I've never heard of that philosophy once."
211110-49 = "Regardless, we must face the reality that our presence is being fundamentally threatened."
211110-50 = "Iroha! Prepare 'that' immediately!!"
211110-54 = "I don't even know what 'that' is, and I haven't prepared anything to begin with."
211110-55 = "What!?! You should have been able to guess this much and get ahead of it!!"
211110-56 = "Don't be unreasonable……."
211110-57 = "Besides, there aren't any negative effects, are there?"
211110-58 = "If anything, they're taking the troublesome work off our hands."
211110-60 = "That is the problem!!"
211110-61 = "Because they're stirring things up all over Gehenna, our past blunders might get dug up."
211110-62 = "If the various things I left alone just to annoy the Prefect Team come to light…… #nit will definitely become a huge problem!"
211110-63 = "We must absolutely prevent any situation that would damage the prestige and power of Pandemonium!"
211110-65 = "I'm not even sure if we have any prestige or power, and wouldn't things stay the same even if we were criticized?"
211110-66 = "My position as President Makoto might be shaken!!"
211110-67 = "That's the most important thing to you, isn't it, President……."
211110-69 = "But you can feel the changes, right?"
211110-70 = "Yeah. Especially at the kiosks and the cafeteria."
211110-71 = "Everyone started lining up, and they don't cut in line anymore. #nThere are fewer students rushing to be first, too."
211110-72 = "I'm planning to do a feature on it in the weekly Pandemonium soon!"
211110-73 = "How about a headline like... 'Order Comes to Gehenna! What is Our Future?'"
211110-74 = "Denied! Gehenna should be free! #nDiscard those ideologies like those feathered folks!"
211110-75 = "Binding everyone with 'order' only breeds a slave mentality. #nIt would diminish the significance of me, President Makoto, standing at the top."
211110-76 = "A king of slaves is nothing more than a clown!!"
211110-77 = "Wow~! This statement needs to be recorded too!"
211110-83 = "President Makoto…… are you angry?"
211110-84 = "I-Ibuki!?"
211110-85 = "No, I'm not angry. Just a little, ever so slightly anxious……!"
211110-86 = "Oh…… I hope President Makoto doesn't get anxious……."
211110-87 = "J-just a little! #nNot zero... but it's basically zero!"
211110-88 = "Don't worry, Ibuki! #nPresident Makoto isn't so fragile as to be discouraged by this!"
211110-89 = "Really? Then Ibuki is relieved~!"
211110-90 = "Good job, Ibuki. President Makoto has finally quieted down."
211110-91 = "But you know~ I feel like fewer kids are shooting their guns lately."
211110-92 = "No one's blowing up bombs or firing grenades either, right?"
211110-93 = "That's right…… because of the Restoration Committee's activities……."
211110-94 = "Ibuki is happy~ #nBecause there are fewer scary surprises than before!"
211110-95 = "I-I see…… so Ibuki is happy……."
211110-97 = "Oh, their momentum has been completely sapped."
211110-98 = "But it really has become quiet, hasn't it?"
211110-99 = "As a reporter, it's a shame that there are fewer incidents and accidents. #nBut I'm okay with it since it's fun to go outside Gehenna for stories!"
211110-100 = "Grrr……!!"
211110-101 = "A crisis is approaching, yet what is the Prefect Team doinggg~~!!"
211110-104 = "……."
211110-110 = "……."
211110-111 = "……."
211110-113 = "It's peaceful, isn't it……."
211110-115 = "Yeah. I wonder how long it's been since we had time like this."
211110-116 = "Has something happened recently? I don't think the school should be this quiet……."
211110-117 = "It seems to be thanks to the Gehenna Restoration Committee."
211110-118 = "Just a committee…… has this much influence?"
211110-120 = "They seem to be working more energetically than expected. #nThey're gathering the troublemakers in one place and controlling them well."
211110-121 = "Incidents used to happen all over Gehenna, but lately, they've become predictable."
211110-122 = "Even our deployments are mostly small-scale cases. The workload has visibly decreased."
211110-123 = "The number of injuries has visibly decreased. The paperwork has as well."
211110-124 = "And above all else—"
211110-130 = "Such a peaceful sleeping face…… I wonder how long it's been."
211110-131 = "To think the day would come when Prefect Hina could take a nap……."
211110-133 = "I hope it stays peaceful like this."
211110-134 = "Hehe…… if days like this continue, the Prefect Team might not be needed anymore—"
211110-135 = "……."
211110-137 = "……."
211110-141 = "Ah. No…… I don't think that will happen!"
211110-142 = "Gehenna without the Prefect Team, huh……."
211110-143 = "Perhaps such a future…… wouldn't be so bad. #nThe Prefect has always wanted to retire, after all……."
211110-148 = "……."
211110-151 = "……."
211110-157 = "Yes, here is the activity application."
211110-158 = "I got Pandemonium's approval, so there's no problem, right?"
211110-159 = "Yeah. It's the real deal."
211110-160 = "Heh, we're operating based on legitimate and legal procedures."
211110-161 = "That's surprisingly sensible for your club."
211110-162 = "It's annoying and it pisses me off, but you have to do what you have to do."
211110-163 = "Doing whatever you want is no different from a child throwing a tantrum."
211110-164 = "Just to be clear…… don't cause any trouble."
211110-165 = "I know. #nWait, is it okay for you to be saying that?"
211110-166 = "What?"
211110-167 = "Because the Prefect Team's work might disappear."
211110-168 = "What are you trying to say?"
211110-169 = "Huh, you don't get it?"
211110-173 = "Think about it. A Gehenna where everyone follows the rules and there are no troublemakers."
211110-174 = "Is the Prefect Team needed there?"
211110-175 = "That is……."
211110-176 = "No, that's not necessarily true. The deterrent force for when things go wrong is—"
211110-177 = "Sooooo, what if it becomes a place where that deterrent isn't needed?"
211110-178 = "……."
211110-179 = "Well, it's just a goal for now. For the time being."
211110-180 = "……At least, that's not the case right now."
211110-181 = "If you cause trouble, we will deploy. Don't forget that."
211110-182 = "I don't even have any intention of causing trouble, though……."
211110-183 = "Hey. What happens after you guys arrive?"
211110-184 = "……What?"
211110-185 = "You arrive, and just watch? That's not it, right? Hey, what happens?"
211110-186 = "Would you like a demonstration if you're so curious?"
211110-187 = "Oh. You'll do it? You're really gonna do it?"
211110-188 = "I didn't really trust anyone but the Prefect. #nIsn't this a good chance to check your skills firsthand?"
211110-189 = "……."
211110-192 = "That is precisely why we are here, to draw the line."
211110-195 = "……Never mind."
211110-199 = "Huh?"
211110-200 = "Should I take that as you running away?"
211110-204 = "……No, you have eyes that suggest provoking you like this is pointless."
211110-205 = "……."
211110-206 = "There's a reason, right? #nThe reason for the lax and half-hearted Prefect Team."
211110-207 = "Think what you want."
211110-208 = "Heh. I guess we're done for today then."
211110-209 = "I'd be happy if you didn't hold back next time."
211110-214 = "……."
211110-217 = "If a day like that comes……."
211110-219 = "Next Episode;Solving Problems"