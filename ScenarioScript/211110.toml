[translation]
211110-1 = "Episódio 11;Uma Paz Estranha"
211110-2 = ""
211110-3 = "......"
211110-4 = "Guh...!"
211110-5 = ""
211110-7 = ""
211110-9 = ""
211110-10 = "A Makoto-chan não anda com essa mesma cara amarrada há dias?"
211110-11 = "Sim. O silêncio dela tem sido uma verdadeira bênção para os meus ouvidos."
211110-12 = "É tão raro ver ela desse jeito... Será que aconteceu alguma coisa grave?"
211110-14 = "Semblante grave e pensativo... Oportunidade perfeita para um clique fotográfico!"
211110-15 = ""
211110-19 = ""
211110-21 = ""
211110-22 = ""
211110-24 = "......"
211110-25 = "Uau! Fez pose no reflexo do flash sem nem pestanejar! Essa é a nossa ilustre líder da Pandemônio!"
211110-26 = "Elementar! A soberana absoluta no ápice do poder deve estar pronta para a imprensa a qualquer milésimo de segundo!"
211110-27 = "Makoto-chan, por que você tava com essa cara de enterro affinal?"
211110-28 = "Ora, isso é..."
211110-29 = ""
211110-31 = ""
211110-32 = "Com certeza é por causa 'daquilo', não é?"
211110-33 = "O Comitê de Restauração de Gehenna tá chamando atenção demais, e a senhora tá morrendo de medo de perder o trono."
211110-34 = ""
211110-36 = ""
211110-37 = "I-Iroha... como você descobriu isso...?!!"
211110-38 = "Basta ter dois olhos funcionais na cara, veterana."
211110-39 = "Depois de encher a boca com aquele discurso arrogante... agora fica tremendo de pânico quando o plano delas dá certo."
211110-41 = "Ah, era só isso? Que bobagem, a cara da Makoto-chan mesmo."
211110-42 = "Mas que mal tem as meninas receberem os holofotes? Não interfere em nada na nossa vidinha mansa."
211110-43 = "Não, você está redondamente enganada!"
211110-44 = "Aquelas insolentes estão obcecadas em deflagrar uma transformação irreversível no ecossistema de Gehenna!"
211110-45 = "E o pior de tudo... as estripulias delas estão colhendo resultados concretos e visíveis!"
211110-46 = "Até hoje, jamais existiu em Gehenna qualquer agremiação capaz de rivalizar com a influência monumental da Pandemônio!#nNo máximo dos máximos, aquelas chatas do Comitê de Disciplina!"
211110-47 = "Era unicamente graças a esse equilíbrio que eu podia materializar a sublime diretriz da minha gestão: a 'Governança pelo Não-Agir'!"
211110-48 = "Eu nunca ouvi falar nessa diretriz na minha vida inteira."
211110-49 = "Enfim! Devemos encarar a realidade crua: a nossa própria existência política está sob ameaça iminente!"
211110-50 = "Iroha! Prepare 'aquilo' agora mesmo!!"
211110-51 = ""
211110-53 = ""
211110-54 = "Eu não faço a menor ideia do que seja 'aquilo', e pra começo de conversa não preparei absolutamente nada."
211110-55 = "O QUÊÊÊ?! Você deveria deduzir minhas ordens com clarividência e antecipar meus passos!!"
211110-56 = "Tenha dó, não me venha com maluquices sem pé nem cabeça..."
211110-57 = "E afinal de contas, qual é o prejuízo prático para nós?"
211110-58 = "Se bobear, elas estão assumindo todo o trabalho chato que sobraria pra gente."
211110-60 = "ESSE É EXATAMENTE O PERIGO!!"
211110-61 = "Com aquelas fedelhas fuçando cada canto de Gehenna, os podres e as trapalhadas da nossa administração podem vir à tona!"
211110-62 = "Todas aquelas crises que varremos pra debaixo do tapete de propósito só pra atazanar o Comitê de Disciplina...#nSe aquilo estourar na mídia, será o colapso do nosso mandato!"
211110-63 = "O prestígio e a soberania da Pandemônio jamais podem sofrer uma única avaria!"
211110-65 = "Se a gente tem prestígio ou poder já é um mistério cósmico, e sermos criticadas não mudaria nada do que já acontece."
211110-66 = "O MEU TRONO SOBERANO COMO MAKOTO-SAMA PODE CAIR POR TERRA, NÃO ENTENDE?!!"
211110-67 = "É, no fundo o que importa pra senhora é só o próprio ego mesmo..."
211110-69 = "Mas que a escola mudou bastante, isso não dá pra negar."
211110-70 = "Pois é. Especialmente na cantina e no refeitório."
211110-71 = "Todo mundo faz fila comportada agora, sem furar a vez de ninguém.#nQuase não se vê mais alunas se estapeando pra pegar o lanche primeiro."
211110-72 = "Inclusive, pretendo lançar uma matéria especial no 'Semanário da Pandemônio' em breve!"
211110-73 = "A manchete de capa vai ser... 'A Ordem Desembarca em Gehenna! O Que Nos Reserva o Futuro?' O que acham?"
211110-74 = "VETADO TERMINANTEMENTE! Gehenna deve ser livre, porca miséria!#nJogue fora esse ideário nojento típico daquelas galinhas de asas brancas de Trinity!"
211110-75 = "Amarrar o povo com regras rígidas só engendra mentalidade de gado servil!#nE isso enfraquece o sentido da magnífica Makoto-sama estar no topo!"
211110-76 = "Afinal, o soberano de um bando de escravos não passa de um mero palhaço!!"
211110-77 = "Uaaaau! Esta citação filosófica exige transcrição obrigatória na íntegra!"
211110-78 = ""
211110-80 = ""
211110-82 = ""
211110-83 = "Makoto-senpai... você tá com raiva?"
211110-84 = "I-Ibuki...?!"
211110-85 = "N-Não, de forma alguma! Eu não estou brava! É só uma... uma pequenina e insignificante pontinha de preocupação, só isso...!"
211110-86 = "Ufa... Ibuki não quer ver a Makoto-senpai preocupada..."
211110-87 = "É quase nada, juro!#nZero vírgula zero zero por cento... praticamente inexistente!"
211110-88 = "Fique tranquila, querida Ibuki!#nMakoto-sama não se deixa abalar por turbulências tão medíocres!"
211110-89 = "Sério?! Ebaaa! Agora a Ibuki ficou feliz!"
211110-90 = "Ponto pra você, Ibuki. Finalmente a veterana fechou o bico barulhento dela."
211110-91 = "Mas sabe... ultimamente quase não vejo ninguém disparando armas pelo pátio."
211110-92 = "Nem detonando bombas ou jogando granadas perto das salas de aula!"
211110-93 = "Pois é... Tudo culpa das atividades daquele maldito comitê..."
211110-94 = "A Ibuki acha tão bom～!#nPorque agora a gente quase não toma mais susto do nada!"
211110-95 = "É... é mesmo...? A Ibuki... fica feliz com isso...?"
211110-97 = "Olha só, perdeu o rebolado por completo agora."
211110-98 = "Mas falando sério: a calmaria no campus é assustadoramente real, não é?"
211110-99 = "Como jornalista investigativa, a queda drástica de tragédias e desastres me deixa sem pauta, é verdade...#nMas como agora tenho tempo de sobra pra cobrir matérias fora de Gehenna, pra mim tá ótimo!"
211110-100 = "Gnuuuh...!!"
211110-101 = "O apocalipse institucional batendo à nossa porta e o que diabos o Comitê de Disciplina tá fazendo que não ageee?!!"
211110-103 = ""
211110-104 = "......"
211110-105 = ""
211110-107 = ""
211110-109 = ""
211110-110 = "......"
211110-111 = "......"
211110-113 = "Que tranquilidade..."
211110-115 = "É verdade. Fazia quanto tempo que não tínhamos uma tarde tão serena assim?"
211110-116 = "Aconteceu algum milagre recente? Não é nem um pouco natural o colégio ficar em tamanha calmaria..."
211110-117 = "Dizem que é graças às ações do Comitê de Restauração de Gehenna."
211110-118 = "Um comitê estudantil recém-fundado... com tamanha força de transformação?"
211110-120 = "Elas estão operando com muito mais vigor do que as estimativas preliminares.#nConcentraram os baderneiros num único perímetro e instituíram um controle surpreendente."
211110-121 = "Antes, estouravam incidentes imprevisíveis por todos os cantos; agora, o fluxo ficou perfeitamente mapeável."
211110-122 = "Nossos chamados de emergência caíram para casos pontuais e pequenos. O fardo de patrulha diminuiu visivelmente."
211110-123 = "O índice de alunas feridas despencou de forma estrondosa. E o volume de relatórios disciplinares acompanhou a queda."
211110-124 = "E acima de tudo..."
211110-125 = ""
211110-127 = ""
211110-129 = ""
211110-130 = "Faz quanto tempo que não víamos a Presidente dormir com uma expressão tão mansa e tranquila...?"
211110-131 = "Quem diria que veríamos com nossos próprios olhos o dia em que Hina-sama conseguiria tirar um cochilo em paz..."
211110-133 = "Seria maravilhoso se essa paz se prolongasse para sempre."
211110-134 = "Fufufu... Se dias assim continuarem, quem sabe o Comitê de Disciplina nem seja mais necessário――"
211110-135 = "......"
211110-137 = "......"
211110-138 = ""
211110-140 = ""
211110-141 = "Ah! Quer dizer... Não que algo assim vá acontecer de verdade, claro!"
211110-142 = "Uma Gehenna sem a necessidade de um Comitê de Disciplina, é...?"
211110-143 = "Talvez um futuro assim... Não seja um devaneio ruim.#nAfinal, a Presidente sempre sonhou com a tão sonhada aposentadoria..."
211110-144 = ""
211110-146 = ""
211110-147 = ""
211110-148 = "......"
211110-150 = ""
211110-151 = "......"
211110-152 = ""
211110-154 = ""
211110-156 = ""
211110-157 = "Prontinho, aqui está o formulário oficial de atividades."
211110-158 = "Com a homologação assinada da Pandemônio e tudo mais nos trinques. Nenhum problema, certo?"
211110-159 = "Sim. O selo institucional é autêntico, de fato."
211110-160 = "Hahaha! A gente opera estritamente sob trâmites legais e legítimos, meu bem."
211110-161 = "Uma conduta surpreendentemente sensata vinda de um clube de Gehenna."
211110-162 = "É um porre ter que lidar com burocracia, mas dever cumprido é dever cumprido."
211110-163 = "Sair tocando o terror sem rumo é coisa de criancinha mimada fazendo birra."
211110-164 = "Vou avisar por precaução mandatória:#ncuidem para não deflagrarem motins nem badernas."
211110-165 = "Já tô cansada de saber.#nMas me diz uma coisa: você tem certeza de que quer continuar dizendo isso?"
211110-166 = "O quê?"
211110-167 = "Porque o trabalho do Comitê de Disciplina pode simplesmente evaporar no ar."
211110-168 = "O que você está insinuando?"
211110-169 = "Ué, ainda não caiu a ficha?"
211110-170 = ""
211110-172 = ""
211110-173 = "Pensa comigo: uma Gehenna onde todo mundo segue o regimento e não existe uma única delinquente armada."
211110-174 = "Nesse cenário utópico... pra que diabos serviria o Comitê de Disciplina?"
211110-175 = "Isso é..."
211110-176 = "Não seja ingênua. Um poder de dissuasão militar para contenção de emergências sempre será――"
211110-177 = "E-U! J-Á! D-I-S-S-E! E quando este lugar não precisar de poder de dissuasão nenhum?!"
211110-178 = "......"
211110-179 = "Bom, por enquanto isso não passa de um ideal distante, é claro."
211110-180 = "...Ao menos neste momento, a realidade presente é outra."
211110-181 = "Se causarem o menor alvoroço, nós interviremos com força letal. Não se esqueça."
211110-182 = "A gente nem tem intenção de fazer gracinha mesmo..."
211110-183 = "Mas vem cá: o que acontece depois que vocês chegam?"
211110-184 = "...Como disse?"
211110-185 = "Vocês chegam e ficam só olhando com pose de bravas? Claro que não, né? O que acontece depois, hein?!"
211110-186 = "Se está tão curiosa, quer que eu faça uma demonstração prática agora mesmo?!"
211110-187 = "Opa! Vai encarar? Bora trocar tiro?!"
211110-188 = "Eu nunca botei muita fé em ninguém além da Presidente de vocês.#nSeria uma chance de ouro pra ver se o seu cartaz aguenta o tranco!"
211110-189 = "......"
211110-192 = "'É precisamente por isso que existimos: para traçar a linha divisória.'"
211110-193 = ""
211110-195 = "...Deixa pra lá. Não vou morder a sua isca."
211110-196 = ""
211110-198 = ""
211110-199 = "Ué?"
211110-200 = "Arregou no meio do caminho?"
211110-201 = ""
211110-203 = ""
211110-204 = "...Não, pelo olhar dos seus olhos vejo que provocações baratas não abalam a sua postura."
211110-205 = "......"
211110-206 = "Você tem os seus motivos, não tem?#nUma razão de ser própria desse Comitê de Disciplina frouxo e tolerante."
211110-207 = "Pense o que quiser."
211110-208 = "Hahaha! Encerramos por aqui então."
211110-209 = "Na próxima, não engula o seu orgulho tão fácil assim, ouviu?"
211110-210 = ""
211110-212 = ""
211110-213 = ""
211110-214 = "......"
211110-215 = ""
211110-217 = "Se um dia desses realmente raiar..."
211110-219 = "A Seguir;Problema Resolvido"
