[translation]
211110-1 = "Эпизод 11;Непривычное спокойствие"
211110-2 = ""
211110-3 = "..."
211110-4 = "Тц..."
211110-5 = ""
211110-7 = ""
211110-9 = ""
211110-10 = "Макото в последнее время такая сосредоточенная."
211110-11 = "Ага. Приятно, когда вокруг тихо и спокойно."
211110-12 = "Давненько я не видела Макото такой задумчивой и проницательной. Неужели что-то случилось?"
211110-14 = "Ахаха, Макото такая серьёзная! Получится ОТЛИЧНЫЙ портрет!"
211110-15 = ""
211110-19 = ""
211110-21 = ""
211110-22 = ""
211110-24 = "..."
211110-25 = "Ого, Макото даже почувствовала камеру и встала в позу. Вот это лицо Пандемониума!"
211110-26 = "Разумеется, я прекрасно получаюсь на фотографиях. В моём положении никогда не знаешь, когда попадёшь в объектив журналистов."
211110-27 = "Что ты такая серьёзная, Макото?"
211110-28 = "...Эм... Ну..."
211110-29 = ""
211110-31 = ""
211110-32 = "Всё из-за тех младших студентов, да?"
211110-33 = "Тебя задевает, что Лига наследия Геенны в последнее время привлекает больше внимания, чем ты, верно?"
211110-34 = ""
211110-36 = ""
211110-37 = "И-Ироха...! Как ты догадалась...!!!"
211110-38 = "Мы давно работаем вместе. Конечно, я вижу тебя насквозь."
211110-39 = "Макото, ты отчитала тех студентов, а теперь их план действительно приносит плоды. И тебя это раздражает, да?"
211110-41 = "И всего-то? Это так на тебя похоже, Макото."
211110-42 = "Но какое нам дело до их популярности? К Пандемониуму это вообще не относится."
211110-43 = "Вот тут ты ошибаешься, Сацуки."
211110-44 = "Лига наследия неустанно трудится, чтобы навсегда изменить Геенну."
211110-45 = "И, насколько мне известно, их упорная борьба уже приносит желаемые результаты."
211110-46 = "Кроме ненавистной Префектуры, в Геенне прежде не существовало организации, способной соперничать с Пандемониумом по влиянию. До сих пор..."
211110-47 = "Столько лет я правила, следуя философии «невмешательства в управление»!"
211110-48 = "Да у тебя НИКОГДА не было никакой философии!"
211110-49 = "Э-э, замолчи! Что ты понимаешь в управлении государством? Главное, что перед нами возникла угроза самому нашему существованию!"
211110-50 = "Ироха! Хватит стоять столбом! Приготовь ЭТУ ШТУКУ!"
211110-51 = ""
211110-53 = ""
211110-54 = "Понятия не имею, что за «штуку» ты имеешь в виду. И ты прекрасно знаешь, что я ничего не готовила."
211110-55 = "Что?! Ты должна была сама догадаться, что мне понадобится, и всё подготовить заранее!"
211110-56 = "Будь хоть немного разумнее..."
211110-57 = "Макото, а чем вообще их деятельность нам вредит?"
211110-58 = "Откровенно говоря, они снимают с нас немалую часть работы. Всё идёт как по маслу."
211110-60 = "Так это тоже проблема!"
211110-61 = "Пока эти высокомерные младшие студенты будоражат Геенну, может начаться смута. А ещё они могут взяться за прошлое Пандемониума."
211110-62 = "Если студенты узнают, сколько раз мы «сопротивлялись» Префектуре, они могут отвернуться от нас."
211110-63 = "Мы обязаны сохранить репутацию и власть Пандемониума в неприкосновенности!"
211110-65 = "Не уверена, что у нас вообще есть какая-то «репутация» или «власть». Да и что с того, если нас станут критиковать? Не впервой."
211110-66 = "Моё положение окажется под угрозой!"
211110-67 = "А, ну конечно. Как же я упустила из виду, что для тебя НА САМОМ ДЕЛЕ важно...?"
211110-69 = "Хотя я её понимаю. Атмосфера здесь определённо меняется."
211110-70 = "Я тоже это заметила. Особенно в общественных местах, вроде магазинов и столовых."
211110-71 = "Студенты перестали лезть без очереди и расталкивать друг друга. Теперь говорят, что «стоять по порядку эффективнее»."
211110-72 = "Точно! Я расскажу об этой новой тенденции в следующем выпуске «Еженедельного Пандемониума»."
211110-73 = "Думаю назвать статью «В Геенну наконец пришёл порядок! Что ждёт нас в будущем?»"
211110-74 = "Запрещаю! Геенна ВСЕГДА должна быть свободной! Говоришь как зазнавшиеся любители чая из Тринити!"
211110-75 = "Подавление студентов под предлогом «порядка» воспитывает в них рабское мышление. А тогда моё величие потеряет всякий смысл!"
211110-76 = "Король рабов — не более чем шут!"
211110-77 = "Ого, какая драма! Надо записать."
211110-78 = ""
211110-80 = ""
211110-82 = ""
211110-83 = "Макото, ты злишься?"
211110-84 = "И-Ибуки...!"
211110-85 = "Нет, я не «злюсь». Просто на меня на мгновение нахлынуло лёгкое беспокойство...!"
211110-86 = "Бу-у... Ибуки не хочет, чтобы Макото тревожилась..."
211110-87 = "О-оно совсем слабое! Если честно, не то чтобы его совсем нет, но его ПОЧТИ нет!"
211110-88 = "Не волнуйся, Ибуки! Я, Ханума Макото, вовсе не так слаба!"
211110-89 = "Хорошо! Тогда Ибуки рада!"
211110-90 = "Молодец, Ибуки. Ты заставила Макото перестать кричать."
211110-91 = "Кстати, в последнее время студенты почти перестали стрелять."
211110-92 = "Ибуки давно не слышала взрывов... И не видела, чтобы студенты бросали гранаты."
211110-93 = "Именно. Всё из-за этой назойливой Лиги наследия..."
211110-94 = "И это хорошо! Ибуки теперь гораздо реже пугается!"
211110-95 = "Д-да... Значит, тебе это нравится, Ибуки...?"
211110-97 = "У Макото совсем пропал запал..."
211110-98 = "И правда, в последнее время здесь стало гораздо спокойнее."
211110-99 = "Для журналиста, конечно, обидно, что происшествий и несчастных случаев стало меньше. Зато теперь я могу выбираться за пределы Геенны ради интервью!"
211110-100 = "Ух...!"
211110-101 = "И ЧТО СОБИРАЕТСЯ ДЕЛАТЬ ЭТА ПРОКЛЯТАЯ ПРЕФЕКТУРА В СВЯЗИ С КРИЗИСОМ?!"
211110-103 = ""
211110-104 = "..."
211110-105 = ""
211110-107 = ""
211110-109 = ""
211110-110 = "..."
211110-111 = "..."
211110-113 = "...Как спокойно."
211110-115 = "Да. Давно у нас не было таких минут."
211110-116 = "Что-то произошло? Для нашего кампуса такая тишина весьма необычна..."
211110-117 = "Похоже, всё благодаря Лиге наследия Геенны."
211110-118 = "Неужели всего один клуб... способен так сильно на всё повлиять?"
211110-120 = "Они затеяли грандиозный проект. Сосредоточили всех нарушителей спокойствия в одном районе."
211110-121 = "Раньше мы боролись с хаосом по всей Геенне, а теперь ситуация стала куда более предсказуемой."
211110-122 = "Даже вызовы, которые мы получаем, чаще всего связаны с мелкими происшествиями. В целом работы у нас стало гораздо меньше."
211110-123 = "Число пострадавших сотрудников сократилось... как и количество бумажной работы."
211110-124 = "И самое главное..."
211110-125 = ""
211110-127 = ""
211110-129 = ""
211110-130 = "Давненько мы не видели главу Префектуры такой спокойной."
211110-131 = "Хина, которая вечно завалена работой, так безмятежно дремлет..."
211110-133 = "Да, надеюсь, так будет и дальше."
211110-134 = "Фу-фу... Если всё продолжится в том же духе, возможно, Префектура вообще перестанет быть нужна."
211110-135 = "..."
211110-137 = "..."
211110-138 = ""
211110-140 = ""
211110-141 = "...Нет, я вовсе не говорю, что такое когда-нибудь случится!"
211110-142 = "Геенна без Префектуры..."
211110-143 = "Будет ли такое будущее... правильным...? Ведь глава Префектуры всегда мечтала уйти на покой..."
211110-144 = ""
211110-146 = ""
211110-147 = ""
211110-148 = "..."
211110-150 = ""
211110-151 = "..."
211110-152 = ""
211110-154 = ""
211110-156 = ""
211110-157 = "А вот и официальное заявление о регистрации нашего клуба."
211110-158 = "Мы получили одобрение Пандемониума. Есть проблемы?"
211110-159 = "Нет. Всё в порядке. На удивление тщательно оформлено."
211110-160 = "Йаха! И уверяю вас, вся наша деятельность будет осуществляться в рамках честных и законных процедур."
211110-161 = "Поразительно здравый подход для клуба из Геенны."
211110-162 = "Даже если это сплошная морока, что поделать."
211110-163 = "Если бы я просто творила всё, что вздумается... ничем бы не отличалась от капризного малыша!"
211110-164 = "Ладно... Только постарайтесь не создавать проблем."
211110-165 = "Всё под контролем. Кстати, членам Префектуры, пожалуй, пора подыскивать себе другое занятие."
211110-166 = "А?"
211110-167 = "Ведь скоро Геенне вы больше не понадобитесь."
211110-168 = "О чём ты говоришь?"
211110-169 = "О, ещё не догадалась?"
211110-170 = ""
211110-172 = ""
211110-173 = "Всё просто... Мы создаём Геенну, в которой каждый соблюдает правила. Нарушителей порядка больше НЕ БУДЕТ."
211110-174 = "Так... зачем тогда нужна Префектура?"
211110-175 = "...Ну..."
211110-176 = "Нет, всё не так. Нужно быть готовыми к любой ситуации, а Префектура сдерживает тех, кто готов нарушить порядок..."
211110-177 = "Да, но что, если Геенна станет местом, где больше не нужно никого «сдерживать»?"
211110-178 = "..."
211110-179 = "А, пока что это всего лишь высокая цель!"
211110-180 = "...Идея благородная, но нынешняя Геенна ещё далека от этого."
211110-181 = "И помните: если устроите неприятности, Префектура к вам наведается."
211110-182 = "Фу-фу. Нам бы такое и в голову не пришло..."
211110-183 = "Но теперь мне любопытно... Что именно вы сделаете?"
211110-184 = "...Что?"
211110-185 = "Что вообще случится, если вы явитесь к нашему порогу? М-м?"
211110-186 = "Любопытно, значит? Могу прямо здесь показать."
211110-187 = "О? М? Правда? Может, попробуем?"
211110-188 = "Я не против. Честно говоря, я доверяю только главе Префектуры, а её здесь нет. Но разве это не прекрасная возможность узнать вашу команду получше?"
211110-189 = "..."
211110-192 = "Именно поэтому существует команда Префектов. Мы проводим черту, которую нельзя переступать."
211110-193 = ""
211110-195 = "...Нет. Забудь."
211110-196 = ""
211110-198 = ""
211110-199 = "А?"
211110-200 = "То есть... ты отступаешь?"
211110-201 = ""
211110-203 = ""
211110-204 = "...Нет. Я вижу это по твоим глазам. Ты не поддашься на провокацию, верно?"
211110-205 = "..."
211110-206 = "Уверена, у тебя есть причины. Какой-нибудь кодекс, расплывчатый и непоследовательный, как и всё, что делает Префектура."
211110-207 = "Думай что хочешь."
211110-208 = "Йаха! В таком случае мне пора. Пока-пока!"
211110-209 = "И терпеть не могу, когда меня так дразнят, так что в следующий раз не сдерживайся, ладно? Надеюсь, мы ещё встретимся."
211110-210 = ""
211110-212 = ""
211110-213 = ""
211110-214 = "..."
211110-215 = ""
211110-217 = "...День, когда Префектура больше не понадобится..."
211110-219 = "Следующий эпизод;В поисках решения"
