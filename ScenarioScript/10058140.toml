10058140-142 = "Geez... How are we even supposed to return this!?"
10058140-143 = "It's easy. It's a Kaiser Loan tank, after all..."
10058140-144 = "Let's park it in front of the bank."
10058140-145 = "You're going to cause a misunderstanding!!!"
10058140-149 = "Wait!!"
10058140-150 = "Waaaaah!!"
10058140-152 = "Nooo!! Stop with the swimsuit hugs!!"
10058140-156 = "Ein!♡ Ein!♡"
10058140-158 = "Now, now, no more crying~!"
10058140-159 = "Waaaaah!"
10058140-160 = "Hiiiiin!"
10058140-163 = "And thus, the Gehenna Cup has successfully drawn to a close!"
10058140-164 = "Sensei! A final word, please!"
10058140-165 = "[ns] \"Yeah!\""
