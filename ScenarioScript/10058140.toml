[translation]
10058140-1 = "Afterword Part 2;Warriors' Paradise"
10058140-3 = "Closing Celebration Party"
10058140-4 = "It's time!"
10058140-5 = "Party time~!"
10058140-9 = "It's still too early to celebrate!!#nIroha's group got away, and the culprit who stole the clothes hasn't been caught yet!"
10058140-10 = "Now, now! The race ended safely, so isn't it fine?"
10058140-11 = "Still, it really is strange.#nWhen I received the luggage, I could definitely feel the weight..."
10058140-13 = "Your clothes were stolen...? Gehenna seems to be having financial troubles, too."
10058140-14 = "A person can live just fine with a single swimsuit, though..."
10058140-15 = "You, hurry up and put on some clothes!! Is that all you have?!"
10058140-16 = "The race is already over, so why are you in a swimsuit again?!"
10058140-17 = "The swimsuit I was wearing earlier got soaked with sweat...#nSo I figured it's only polite to wear a clean, refreshing swimsuit to an occasion like this."
10058140-18 = "Or do you prefer me drenched, Koharu-chan?"
10058140-19 = "N-No way!! Stay away from me!!"
10058140-23 = "Waaaaah!"
10058140-25 = "Ahaha...#nStill, I'm glad the race ended safely without anyone getting hurt."
10058140-26 = "Hm?"
10058140-31 = "You're from back then..."
10058140-32 = "Hmm."
10058140-33 = "We met again, so now we're enemies."
10058140-34 = "Yeah, that's right."
10058140-38 = "You're reading the same manga as Lana~."
10058140-39 = "Birds of a feather flock together, after all."
10058140-40 = "Come to think of it, we've met before, so#nnow we've come full circle and become friends."
10058140-41 = "An immutable law. Meet again and you're enemies, meet yet again and you're comrades-in-arms."
10058140-42 = "Though last time you were more of an ally than an enemy."
10058140-46 = "Good evening, everyone from District 183!"
10058140-47 = "Once again, congratulations on your victory."
10058140-48 = "Hifumi-san! Hanako-san! Thank you so much for taking care of us since yesterday!"
10058140-49 = "Uu...#nI thought I didn't have a single tear left, but seeing everyone's faces makes me tear up again..."
10058140-50 = "S-Stop it. You're gonna make me cry, too... Hiiin..."
10058140-51 = "Fufu. This is a celebration, after all, so let's have fun and celebrate together!"
10058140-52 = "Those two are such crybabies."
10058140-53 = "They have many other sides to them, but... sigh... right now they seem like crybabies."
10058140-54 = "Uaaah! Thank you so much!!"
10058140-56 = "Ah—! That felt great! Having a party after cutting loose as much as you want isn't half bad!"
10058140-57 = "Right? You guys!"
10058140-67 = "You went wild all over us, of course it felt great to you..."
10058140-68 = "The spot where I got flicked on the forehead looks like it's gonna turn into a bump..."
10058140-69 = "What is Aris supposed to have done?! I'm just an innocent bystander!"
10058140-70 = "Chibi Maid-sama is stronger than a tank, I swear!"
10058140-71 = "How is firing guns not against the rules? This race is messed up..."
10058140-72 = "Stop your bitching! A match is a match, damn it!"
10058140-75 = "...Does it really hurt? ...My bad."
10058140-76 = "It hurts!! That's way too rough!! Apologize properly!!"
10058140-77 = "Tch. I guess I might've gone a bit too far. My ba—"
10058140-78 = "Are you in here, Neru? How was the Prism Tank?"
10058140-79 = "Ah, hold on a second you guys. Utaha, the tank ran fine."
10058140-80 = "The beam going 'Baban!' was super cool,ー!"
10058140-81 = "If you're satisfied, then as an engineer I couldn't be happier."
10058140-82 = "Now then, your signature here."
10058140-83 = "Ah, come to think of it, it was on tab..."
10058140-89 = "Ha? Why are there two bills?"
10058140-90 = "Because the order from C&C was for two units."
10058140-91 = "No way in hell!! There was only one..."
10058140-94 = "Hey, Toki Asuma."
10058140-95 = "Yes, it is Toki."
10058140-96 = "Is something the matter?"
10058140-97 = "You've got some nerve! Charging it openly under C&C's name!!"
10058140-98 = "I thought it was a brilliant idea, but#n failing to think ahead was my mistake."
10058140-99 = "You, today of all days...!"
10058140-100 = "Neru-senpai's signature that you forged for me was flawless, though...#nSorry, Momoi."
10058140-101 = "Ahah!! You shouldn't just blurt that out!!"
10058140-104 = "...Ah!"
10058140-105 = "...Haha."
10058140-109 = "Naturally, you're prepared to get beaten up for this, right?"
10058140-117 = "Gyaaaaaah!"
10058140-122 = "Hm, fireworks. Amazing."
10058140-123 = "Wait, didn't I just hear a scream?!"
10058140-124 = "Hwaa... Old man here would rather sleep than go to a party."
10058140-125 = "Senpai! Don't say things like that, let's enjoy the party together☆"
10058140-126 = "Though it would've been nice if it was a pajama party."
10058140-127 = "It's great that everyone finished the race safely, but..."
10058140-128 = "Our tank is completely broken. What should we do about the repair costs...?"
10058140-129 = "The barrel is broken, and driving under its own power is stuck in second gear...#nThere's hardly any part of it left in one piece."
10058140-130 = "If that's the case, no problem. It's free anyway."
10058140-131 = "What do you mean, free?"
10058140-132 = "Because this is the one Kaiser Loan parked in front of the school gate."
