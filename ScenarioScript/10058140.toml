10058140-134 = "Does that mean you stole it?!"
10058140-135 = "Parking illegally means the owner of the land agreed for us to use it."
10058140-136 = "We clean up the trash Kaiser Loan illegally dumps every day, after all."
10058140-137 = "Th-That's completely different from this!"
10058140-138 = "It reminds me of the old days~."
10058140-139 = "Our junior... whenever she went somewhere, she'd always pick something upー."
10058140-140 = "She was like a cat repaying a favor☆"
