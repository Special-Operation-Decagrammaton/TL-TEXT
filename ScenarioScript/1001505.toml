[translation]
1001505-1 = "Выбор Арис"
1001505-2 = ""
1001505-3 = "Арис сидела в углу кафе и что-то нажимала на телефоне."
1001505-4 = "Она так сосредоточилась на экране, что даже не заметила, как я подошёл."
1001505-5 = "[s1] «Привет, Арис.»\n[s2] «Играешь?»"
1001505-6 = ""
1001505-7 = ""
1001505-8 = "Доброе утро, Сенсей."
1001505-9 = "Эта игра в последнее время популярна среди других студентов, но она довольно сложная. Я не знаю, что выбрать."
1001505-10 = "Она заставляет меня принимать такие трудные решения... Какая сложная игра."
1001505-11 = "[s3] «Что это за игра?»\n[s4] «Какие решения тебе приходится принимать?»"
1001505-12 = "Главный герой — второй принц королевства Хромати. Его также называют Принцем Волосатой Груди."
1001505-13 = "Главный герой — второй принц королевства Хромати. Его также называют Принцем Волосатой Груди."
1001505-14 = "[s] «Вот как...»"
1001505-15 = "Говорят, его фирменная волосатая грудь — самая привлекательная черта во всём королевстве."
1001505-16 = "[s] «Любопытно...»"
1001505-17 = "Все короли соседних государств соперничают за руку принца..."
1001505-18 = "...и теперь остались только Бородатый Король и Лысый Император."
1001505-19 = "Кого должен выбрать Принц Волосатой Груди — Бородатого Короля или Лысого Императора? Кто сделает его счастливым?"
1001505-20 = "Оба кажутся хорошими вариантами, поэтому решение очень трудное."
1001505-21 = "[s5] «Ага...»\n[s6] «Понимаю, почему это сложно.»"
1001505-22 = "Бородатый Король обожает бегать по улицам голым, так что у него с принцем одно и то же хобби."
1001505-23 = "Бородатый Король обожает бегать по улицам голым, так что у него с принцем одно и то же хобби."
1001505-24 = "Но Лысый Император — один из самых красивых мужчин мира. Он много раз выигрывал Фестиваль Качков и помогает принцу тренировать грудные мышцы, отчего его волосы на груди сияют ещё сильнее."
1001505-25 = "[s7] «Напомни, где ты вообще нашла эту игру...?»\n[s8] «Похоже на претендента на „Игру года“.»"
1001505-26 = "Они оба отлично подходят принцу... так как же мне выбрать? Это слишком сложно."
1001505-27 = "Они оба отлично подходят принцу... так как же мне выбрать? Это слишком сложно."
1001505-28 = "[s9] «Думаю, решать тебе.»\n[s10] «Просто знай: какой бы выбор ты ни сделала, я тебя поддержу.»"
1001505-29 = ""
1001505-30 = ""
1001505-31 = "Спасибо, Сенсей. Я знаю, что должна принять решение."
1001505-32 = "Волосатая грудь или голый забег?"
1001505-33 = "Борода или лысина?"
1001505-34 = "[s11] «Игра года. Без вариантов.»\n[s12] «Надеюсь, она справится...»"
1001505-38 = "Арис долго и вдумчиво читала разные форумы со стратегиями."
1001505-39 = ""
1001505-40 = ""
1001505-41 = ""
1001505-42 = "Эврика!"
1001505-43 = "Я хотела бы вернуться в академию и кое-что проверить."
1001505-44 = ""
1001505-45 = "После этого Арис с улыбкой вернулась в академию."
