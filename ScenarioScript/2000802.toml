[translation]
2000802-1 = "Неважно, здесь заговор!"
2000802-2 = "После недружелюбного сообщения Ако в MomoTalk я пришёл в условленное место и увидел на столе огромную гору документов."
2000802-3 = ""
2000802-5 = ""
2000802-6 = "Эм, это потому что... здесь связано вот с этой частью..."
2000802-7 = ""
2000802-9 = ""
2000802-10 = "*вздыхает* Да серьёзно! Как я должна справиться со ВСЕМ ЭТИМ?!"
2000802-11 = "[s] «Привет?»"
2000802-12 = "С-Сенсей?!"
2000802-13 = "Когда вы успели прийти? Не пугайте меня так..."
2000802-14 = "*вздыхает* Серьёзно."
2000802-15 = "[s] «Похоже, у тебя дел по горло. Всё в порядке?»"
2000802-17 = "А?"
2000802-18 = "Это примерно моя обычная нагрузка."
2000802-19 = "И всё это нужно закончить к вечеру. Одну стопку я уже обработала, так что заодно могу проверить и её."
2000802-20 = "Пустяки. Большую часть я закончу в мгновение ока. Хи-хи."
2000802-21 = "[s] «(Твоё выражение лица минуту назад говорило совсем другое...)»"
2000802-22 = "Я не смогу называть себя управляющей Префекторской команды, если начну ныть из-за такого жалкого объёма работы."
2000802-23 = "О, но неважно. Я позвала вас сюда не просто так."
2000802-24 = ""
2000802-26 = ""
2000802-27 = ""
2000802-28 = ""
2000802-29 = "Не могли бы вы проверить эти документы?"
2000802-30 = "[s] «Запрос отчёта Шале о подозрительной деятельности Префекторской команды?»"
2000802-31 = "Да. Оказалось, что это можете сделать только вы."
2000802-32 = "Я хотела узнать, есть ли у Шале какие-либо жалобы на нашу Префекторскую команду."
2000802-33 = "[s1] «Да, но...»\n[s2] Вежливо отказаться."
2000802-34 = "Хмф. Не хотите сотрудничать, да?"
2000802-35 = "Хмф. Не хотите сотрудничать, да?"
2000802-36 = "Но вы уверены? Я думала, вам захочется отплатить мне за всё, что я для вас сделала."
2000802-37 = "[s] «И что это должно значить?»"
2000802-38 = "Не притворяйтесь, будто не понимаете."
2000802-39 = "Я ежедневно за вами присматриваю. Вы вообще представляете, насколько трудно администратору Префекторской команды — то есть мне — разбираться ещё и с вашей работой?!"
2000802-40 = "[s3] «Правда?»\n[s4] «Наверное, в этом есть доля правды. Может быть. Возможно.»"
2000802-41 = "Что за такая вялая реакция?"
2000802-42 = "Что за такая вялая реакция?"
2000802-43 = "А?! Подождите."
2000802-44 = "Так взрослые поступают, когда не хотят признаваться в чём-то компрометирующем?! Там что-то было про право... «право не...»?"
2000802-45 = "[s] «Не знаю, существует ли такое право в Кивотосе...»"
2000802-46 = ""
2000802-48 = ""
2000802-49 = "Хм-м. В любом случае, прямого ответа я и не ожидала."
2000802-50 = "Тогда в следующий раз."
2000802-51 = ""
2000802-53 = ""
2000802-54 = ""
2000802-55 = ""
2000802-56 = "[ns] «Опишите свои мысли и идеи относительно Префекторской команды не более чем в 20 тысячах символов?»"
2000802-57 = "Это лёгкая проверка. Считайте её простым документом для выяснения ваших истинных намерений."
2000802-58 = "О, и само собой разумеется — даже не думайте лгать."
2000802-59 = "Неужели вы думаете, что такому способному администратору, как я, будет трудно определить ценности человека по контексту, словарному запасу, манере речи и прочему?"
2000802-60 = "[s] «Неужели нужно заходить так далеко?»"
2000802-61 = "А?"
2000802-62 = "Конечно нужно! Нельзя ни на секунду прекращать наблюдение за опасными силами!"
2000802-63 = "Кроме того, Шале — одна из самых скрытных организаций! Её назначение, структура и история подозрительны, так что дальнейшее расследование вполне естественно."
2000802-64 = "[s] «Ты понимаешь, что Шале, о котором говоришь, — это я?»"
2000802-65 = "Наша Префекторская команда сражалась с врагами, ненавидящими нас, повсюду и во всех возможных формах!"
2000802-66 = "Но мы никогда не проигрывали и не страдали."
2000802-67 = "Что мне скрывать...?"
2000802-68 = "Да, мне! Потому что я не терплю никаких неопределённостей!"
2000802-69 = "[s5] «Понятно.»\n[s6] «Мне кажется, дело не только в этом, но ты действительно очень стараешься.»"
2000802-70 = "Ну, если не считать главу префектов... Но, честно говоря, даже этого, по-моему, недостаточно."
2000802-71 = "Ну, если не считать главу префектов... Но, честно говоря, даже этого, по-моему, недостаточно."
2000802-72 = "Только вчера на Префекторскую команду совершили террористическую атаку. Расслабляться нельзя."
2000802-73 = "[s] «Террористическую атаку? Что произошло?»"
2000802-74 = "Ну, дело было так..."
2000802-75 = "Рано вчера утром я работала сверхурочно в дополнительном корпусе, когда внезапно..."
2000802-76 = "Отключилось электричество!"
2000802-77 = "[s] «...»"
2000802-78 = "Отключение электричества посреди работы... У меня нет никаких сомнений."
2000802-79 = "Это мог быть только теракт, организованный мятежниками, которые знали, что я, администратор Префекторской команды, одна работаю сверхурочно."
2000802-80 = "Они отключили генераторы здания, чтобы помешать работе Префекторской команды."
2000802-81 = "Из-за их коварного плана я не смогла нормально закончить работу!"
2000802-82 = "[s] «...Может, это просто совпадение?»"
2000802-83 = "Нет! Ни за что! В любом случае, в Геенне полно людей, которые только и ищут слабости Префекторской команды, знаете ли?!"
2000802-84 = "Стоит оставить хоть малейшую брешь — и они сожрут вас живьём!"
2000802-85 = "Эта ситуация тоже определённо, бесспорно и вне всяких сомнений является саботажем против Префекторской команды!"
2000802-86 = "Давайте поспорим, Сенсей! Если я найду виновника, вы пройдёте десять кругов вокруг спортзала на руках."
2000802-87 = "[s] «У-Успокойся.»"
2000802-88 = "Подозреваемых уже больше десяти!"
2000802-89 = "Так... Да! Другого выхода нет! Как только вернусь в академию, установлю сто камер наблюдения, чтобы поймать виновника!"
2000802-90 = ""
2000802-92 = ""
2000802-93 = "Фух."
2000802-94 = "Простите. Кажется, я немного увлеклась. Хи-хи."
2000802-95 = "Боже мой, как же так вышло?"
2000802-96 = "Похоже, я показала вам сторону себя, которую показывать не стоило."
2000802-97 = "[s] «Нет, я совсем не против, но насчёт...»"
2000802-98 = "Пожалуйста, забудьте о сегодняшнем."
2000802-99 = "Тогда займитесь, пожалуйста, документами, которые мы обсудили. Мне нужно переходить к следующему делу, так что..."
2000802-100 = ""
2000802-102 = ""
2000802-104 = "[s] «П-Простите?»"
2000802-106 = "(Почему-то Ако поспешно ушла.)"
