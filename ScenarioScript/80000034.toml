[translation]
80000034-1 = "Неуверенно, но хочется поделиться"
80000034-2 = "Вечером Дня святого Валентина я договорился встретиться с Хиной."
80000034-3 = "[ns] «Она сказала встретиться где-то здесь...»"
80000034-4 = ""
80000034-7 = "О... Здравствуйте, Сенсей."
80000034-8 = "[s] «Хина!»"
80000034-9 = "Н-Не кричите так!"
80000034-10 = "Пожалуйста, говорите тише. Я тайком ушла от обязанностей.#nМеньше всего мне хочется привлекать ненужное внимание."
80000034-11 = "Полагаю, вам тоже."
80000034-12 = "[s1] «От тебя мне нечего скрывать.»\n[s2] «Ради тебя я готов на любые хлопоты.»"
80000034-13 = "*вздох* И что вообще отвечать на такое?"
80000034-14 = "*вздох* И что вообще отвечать на такое?"
80000034-15 = "Хотя от вас я уже ничего другого и не ожидала."
80000034-16 = "В любом случае... Простите, что позвала так внезапно,#nно я благодарна, что вы нашли время прийти."
80000034-17 = "Ну..."
80000034-18 = "Спасибо."
80000034-19 = "[s] «Хорошо, но если ты не хочешь, чтобы нас видели, значит...?»"
80000034-20 = ""
80000034-25 = "Ч-Что вы намекаете?!"
80000034-26 = "[s3] «(Что на самом деле происходит, Хина?)»\n[s4] «(Это какая-то тайная встреча?)»"
80000034-27 = "Я сказала говорить тише, но вовсе не нужно шептать мне прямо в ухо!"
80000034-28 = "Я сказала говорить тише, но вовсе не нужно шептать мне прямо в ухо!"
80000034-29 = "О-Отойдите!"
80000034-30 = "[s] «Что случилось?»"
80000034-31 = "Давайте оба просто... сначала успокоимся."
80000034-32 = "Хотя, может, успокоиться нужно только мне."
80000034-33 = "В-В любом случае! Я позвала вас сегодня вечером из-за этого."
80000034-34 = ""
80000034-36 = ""
80000034-38 = "[ns] «Это то, о чём я думаю?»"
80000034-39 = "Раз сегодня День святого Валентина, я попробовала... сделать шоколад сама."
80000034-40 = "Я знаю, выглядит он не очень аппетитно."
80000034-41 = "Это лучшее, что получилось после нескольких попыток..."
80000034-42 = "Наверное, даже символично, что снаружи он некрасивый и совсем не милый."
80000034-43 = "Но внутри он всё равно должен..."
80000034-44 = "...быть на вкус как обычный шоколад."
80000034-45 = "Т-Так что, если вы не против принять его, я..."
80000034-46 = "[s] «Домашний шоколад от тебя, Хина? Для меня честь!»"
80000034-47 = "Э-Это не такое уж большое дело, Сенсей! Не надо говорить так..."
80000034-48 = "[s] «Мне правда достался домашний шоколад от Хины! Я буду его беречь!»"
80000034-49 = "Глупец! Шоколад нужно есть, а не хранить как какую-то древнюю реликвию."
80000034-50 = "*вздох* Серьёзно..."
80000034-51 = "Хех..."
80000034-52 = "Конечно, именно это вы и скажете. И чего я так переживала?"
80000034-53 = "Спасибо, Сенсей. Надеюсь, вам понравится."
80000034-54 = "Я... очень старалась."
80000034-55 = "[s] «Нет, это ТЕБЕ спасибо, Хина!»"
80000034-56 = "Но обязательно съешьте его. Не хочу поймать вас на том, что вы храните его как семейную реликвию."
80000034-57 = "[s] «Постараюсь.»"
80000034-58 = "Не уверена, что это должно означать..."
80000034-59 = "Ну, если вам понравится, мне всё равно."
80000034-60 = "Хи-хи."
