[translation]
83306075100-5 = ""
83306075100-6 = "Странное место для собрания. Вы поднимаете немало шума."
83306075100-7 = "А?! Глава префектов?! Что вы здесь делаете?!"
83306075100-8 = "Я просто патрулировала территорию Академии Геенна."
83306075100-9 = "Н-н-но мы ещё ничего не сделали!"
83306075100-10 = "Д-да! Мы пока не совершили никаких преступлений! Вы не имеете права нас арестовывать!"
83306075100-12 = "...Я ведь не хватаю людей сразу, как только их вижу."
83306075100-13 = "Хотя понимаю, откуда такое заблуждение, учитывая, что при каждой нашей встрече я обычно вас арестовываю."
83306075100-14 = "Так почему вы все столпились у дверей вместо того, чтобы лежать на больничных койках?"
83306075100-15 = "...Жук."
83306075100-16 = "Хм?"
83306075100-17 = "Жук! Огромный жук залез под мою кровать!"
83306075100-18 = "Я туда не вернусь! Ни за что! Даже Клуб неотложной помощи не спасёт меня от ж-ж-жука!"
83306075100-20 = "Вот как. Жук?"
