[translation]
90000150-1 = "Эпизод 16;Ледниковое Море 2"
90000150-2 = ""
90000150-3 = "Спасибо за вашу работу, Эйми, Токи. Есть что доложить?"
90000150-4 = ""
90000150-6 = ""
90000150-8 = ""
90000150-9 = "Да. Мы обнаружили последователей Декаграмматона, бродящих по району. Однако похоже, что никакой конкретной цели они не преследуют."
90000150-10 = "Они похожи на пчелиный улей, потерявший матку."
90000150-11 = ""
90000150-13 = ""
90000150-15 = ""
90000150-16 = "В координатах сигнала мы нашли только лёд и море."
90000150-17 = "Хм... Интересно..."
90000150-18 = ""
90000150-22 = "... Мэйдэй, мэйдэй... Раз, два. Меня слышно?"
90000150-23 = "Связь?!"
90000150-24 = "Мэйдэй? Сигнал бедствия?"
90000150-25 = "Нет-нет-нет! Так говорят только когда люди попали в беду. Дай я!"
90000150-26 = "Большое спасибо, что проделали весь этот путь. А теперь, пожалуйста, умрите."
90000150-27 = "Ч-Что?! Вы?!"
90000150-28 = ""
90000150-32 = "Что происходит?"
90000150-33 = "Землетрясение?"
90000150-34 = ""
90000150-36 = ""
90000150-37 = ""
90000150-38 = ""
90000150-39 = ""
90000150-40 = "Нет! Характер волн не сейсмический. Это..."
90000150-41 = ""
90000150-43 = ""
90000150-44 = ""
90000150-45 = ""
90000150-46 = "Президент! На глубине 15 м под землёй обнаружена мощный всплеск энергии! И он приближается к нам!"
90000150-48 = "Он под водой! Подо льдом!"
90000150-49 = "Этот сигнал… это пророк! Приближается новый пророк Декаграматона!"
90000150-50 = "Чего? А эти ребята не такие тупые, как я думала!"
90000150-51 = "Любопытно. Тогда повышу оценку с \"Абсолютно никчёмных\" до \"Немного никчёмных\"."
90000150-52 = "Да пофиг на это. Ну, удачи вам. Позже я станцую на ваших могилах. Пока-пока~"
90000150-53 = "Кто они такие, разберёмся потом. Сейчас нужно остановить пророка, который приближается к нам!"
90000150-54 = "[s] «Готовьтесь к бою!»"
