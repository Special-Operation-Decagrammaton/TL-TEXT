[translation]
1601702-1 = "Ненавижу людей"
1601702-2 = "Я зашёл в магазин канцтоваров за принадлежностями для работы."
1601702-3 = ""
1601702-7 = ""
1601702-8 = ""
1601702-9 = ""
1601702-10 = "Прошу прощения."
1601702-11 = ""
1601702-13 = ""
1601702-15 = ""
1601702-16 = "Ах..."
1601702-17 = ""
1601702-19 = ""
1601702-20 = ""
1601702-21 = ""
1601702-22 = ""
1601702-23 = ""
1601702-24 = "Угх..."
1601702-25 = "В-Вот поэтому я ненавижу людные места... Слишком много людей, чтобы избить их всех самой..."
1601702-26 = "[s] «Привет, Аоба. Рад тебя видеть.»"
1601702-27 = ""
1601702-29 = ""
1601702-30 = "Ах..."
1601702-31 = ""
1601702-33 = ""
1601702-34 = "А? А-А??? Сенсей?"
1601702-35 = "Простите, что беспокою вас так поздно ночью!"
1601702-36 = "Я... Я не ожидала тебя встретить..."
1601702-37 = "[s] «Ты пришла что-то купить?»"
1601702-38 = "А-А... Да..."
1601702-39 = "Мне нужно составить список всех деталей, которые мы отправляем, но в офисе закончилась бумага..."
1601702-40 = "[s] «То есть пришла забрать канцтовары по заявке?»"
1601702-41 = ""
1601702-43 = ""
1601702-44 = "А-А? Нет... Я плачу из своего кармана..."
1601702-45 = "[s] «За канцтовары для работы?»"
1601702-46 = "Д-Да... Н-Ну, то есть да, но..."
1601702-47 = "Чтобы получить компенсацию расходов, нужно соблюдать кучу строгих правил и сроков..."
1601702-48 = "Каждый раз, когда я пыталась, в документах обязательно чего-нибудь не хватало... поэтому теперь я просто покупаю всё за свои деньги."
1601702-49 = "[s] «Звучит несправедливо.»"
1601702-50 = "Т-Так уж устроен Хайлендер..."
1601702-51 = "Если произнести это вслух, звучит и правда довольно раздражающе..."
1601702-52 = "Там полно странной бюрократии. Это... выматывает."
1601702-55 = "Например: «Все отчёты в целях экономии ресурсов должны писаться на черновиках.»"
1601702-56 = "А если черновиков нет, мне приходится что-нибудь распечатывать, чтобы ПОТОМ использовать лист как черновик."
1601702-59 = "Н-Немного смешно, правда? Хи-хи..."
1601702-60 = "А ещё был случай... Ну, офицеры должны ставить печати на документах для утверждения, и одна офицер потеряла свою печать, так что мы все несколько недель ждали, пока она закажет новую."
1601702-61 = "Или вот: «Если офицер заказывает бенто, мы все обязаны выбирать из того же меню.»"
1601702-62 = "Иногда на нас вообще без предупреждения сваливают задачи со сроком на следующий день..."
1601702-63 = "[s] «Похоже, тебе приходится очень многое терпеть.»"
1601702-64 = "Постоянно, да."
1601702-65 = "Д-Даже сейчас наверняка кто-то в офисе страдает так же, как я."
1601702-66 = "...Но я более-менее смирилась, что такова жизнь."
1601702-67 = "Если ничего не ждёшь, то и разочаровываться не приходится, верно? Фуфу..."
1601702-68 = "Жизнь — просто один длинный отрезок усталости и скуки..."
1601702-69 = "[s] «Раз уж мы сегодня оба здесь, можно я подарю тебе немного канцтоваров?»"
1601702-70 = ""
1601702-72 = ""
1601702-73 = "А-А?! Т-Ты правда сделаешь это для меня, Сенсей?"
1601702-74 = "Я... Ну, здесь есть всё, что мне нужно..."
1601702-75 = "Н-Нет! Я-Я не могу... Это слишком большая услуга...!"
1601702-76 = "[s1] «Ты заслужила передышку.»\n[s2] «Ты ничего не будешь мне должна. Просто выбери всё, что тебе нужно.»"
1601702-79 = "Э-Эм... Ну..."
1601702-80 = "Если подумать, мне нужна бумага... Я потеряла почти все письменные принадлежности, так что... О, и скотч, мне нужен скотч..."
1601702-81 = ""
1601702-83 = ""
1601702-85 = ""
1601702-86 = ""
1601702-87 = "Ладно, тогда я ВСЁ-ТАКИ останусь у тебя в долгу!"
1601702-88 = "И-И только сегодня! Спасибо... Сенсей..."
1601702-91 = ""
1601702-92 = "Всё, что мне нужно. Всё прямо здесь..."
1601702-93 = "С-Спасибо, Сенсей..."
1601702-94 = "[s3] «Иногда хорошие вещи всё-таки случаются — со всеми нами.»\n[s4] «Надеюсь, однажды ты снова сможешь радоваться обычной жизни.»"
1601702-97 = "Ах..."
1601702-98 = "Н-Ну, может быть..."
1601702-99 = "Но если я снова начну надеяться на лучшее, то опять разочаруюсь. С меня хватит..."
1601702-100 = ""
1601702-102 = ""
1601702-103 = ""
1601702-104 = "Огромное спасибо за сегодня, Сенсей."
1601702-105 = "Я не забуду, что ты для меня сделал."
1601702-107 = "Аоба ещё несколько раз поблагодарила меня, а затем ушла."
