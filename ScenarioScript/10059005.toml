[translation]
10059005-1 = "Prologue;A Chance(?) Encounter"
10059005-3 = "(One sunny day—)"
10059005-4 = "(Having been invited to a ballet performance, I visited the perfoming arts center.)"
10059005-7 = "Performing Arts Center"
10059005-8 = "[ns] \"Good afternoon.\""
10059005-11 = "What a pleasure to see you. Welcome and thank you for coming, Sensei"
10059005-12 = "We sincerely thank you for your contributions to the performing arts."
10059005-13 = "We have for you today a gala concert— #na wide assortment of programs to enjoy to your heart's content."
10059005-17 = "Right this way, please. We have prepared the best seat in the house for you. #nDo make yourself comfortable and enjoy the show."
10059005-19 = "(I was shown inside—)"
10059005-23 = "(And took my assigned seat.)"
10059005-25 = "[ns] \"...I'm looking forward to this.\""
10059005-30 = "Oh... What a surprise. You are Sensei, are you not?"
10059005-31 = "Hehe, what are the odds of that? It is an honor to meet you here."
10059005-32 = "[s] \"Hello. It seems you know who I am.\""
10059005-33 = "Heheh. I never would've thought to imagine such a fortutious coincidence."
10059005-34 = "In truth, I have somewhat been in your care previously, and I've been looking#nforward to meeting again."
10059005-39 = "Let me explain... What she means is that she's been plotting her revenge against#nyou this entire time."
10059005-43 = "[ns] \"Reveng—!?\""
10059005-44 = "Heheh, Secretary Kanon. #nYou make it sound as if I bear a grudge against Sensei."
10059005-45 = "Rest assured. I do hold you in high regards."
10059005-49 = "...Truly."
10059005-53 = "[ns] \"What... What in the world did I do...?\""
10059005-54 = "Heheh. What, I wonder?"
10059005-55 = "At the very least, there's not a shred of falsehood in my heart."
10059005-56 = "As such..."
10059005-61 = "Would you mind signing this ticket for me?"
10059005-62 = "It shall be a reminder of the chance encounter between us."
10059005-66 = "Let me explain... What she means is that she wants to verify your penmanship."
10059005-67 = "If your handwriting is easy to forge, then we will have to be cautious during our#ndealings."
10059005-68 = "Heheh, secretary Kanon. #nYou make it sound as if I have no confidence in Sensei."
10059005-69 = "Rest assured. I do trust you to a certain degree."
10059005-70 = "...For now."
10059005-71 = "Now, if you could sign here."
10059005-75 = "[ns] \"All right...\""
10059005-79 = "Heheh, many thanks. #nI will be sure to keep it safe in my museum."
10059005-80 = "[s] \"Your museum?\""
10059005-81 = "I possess a personal museum for myself. #nIt is a hobby of mine to collect a wide assortment of objects."
10059005-85 = "Collecting is... an art of the senses."
10059005-86 = "Even with the passage of time, the emotions imbued within those works, their#nhistories—all of it can be felt."
10059005-87 = "—Much like this ticket."
10059005-88 = "What was once an unremarkable ticket has now taken on new meaning."
10059005-89 = "When I look upon this ticket now, I can think back to the time we spend together."
10059005-90 = "For the perfectly mundane to transform into something extraordinary—is that not romantic?"
10059005-91 = "[s] \"That's true.\""
10059005-92 = "Under the right circumstances, even a piece of rubbish can become a memento."
10059005-93 = "...And I just so happen to have a tissue in my pocket that I was planning to dispose of later."
10059005-94 = "Perhaps I will keep it as a memento of today as well."
10059005-95 = "When I look upon this tissue now, I can think back to this conversation we had."
10059005-96 = "[s] \"Is a tissue really the best thing to remember this by...?\""
10059005-97 = "Heheh. I'll say, I meant that in jest."
10059005-98 = "I will dispose of this tissue later."
10059005-99 = "It is slightly unfortunate that a fragment of our memories will be left behind in the garbage though."
10059005-100 = "[s] \"You're throwing the memory away too!?\""
10059005-101 = "As I have mentioned, the art of collecting is an art of the senses. #nTo part with an object is to let go of the emotions tied to it—a natural#nconsequence of its nature."
10059005-102 = "However, please rest assured. #nThere are ways to renew its value, such that it need not be thrown away."
10059005-106 = "Let me explain... What she means is that the rest will depend on you, Sensei.#nShe holds high expectations for you."
10059005-110 = "[ns1] (What an unusual student...)\n[ns2] \"By the way, judging from your uniforms... are you from Wildhunt?\""
10059005-113 = "Oh my. It seems we've yet to introduce ourselves."
10059005-114 = "How terribly rude of me. Allow me to introduce myself properly."
10059005-115 = "My name is Uruwashi Manami."
10059005-119 = "I serve as the president of the Wildhunt Art Academy's Assembly of Arts."