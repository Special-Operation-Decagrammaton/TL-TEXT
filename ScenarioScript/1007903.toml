[translation]
1007903-1 = "Врождённая аура"
1007903-2 = "Услышав звуки, похожие на драку, я поспешил в ближайший парк."
1007903-3 = "Когда я приблизился, издалека донёсся встревоженный голос Мисаки."
1007903-5 = "Н-Нет... Пожалуйста, прекратите."
1007903-6 = "Это уже слишком..."
1007903-7 = "Я уже сказала. Если продолжите, я..."
1007903-8 = ""
1007903-10 = "[ns1] «Мисака!!»\n[ns2] «Стоять! Что происходит?!»"
1007903-14 = ""
1007903-15 = ""
1007903-16 = ""
1007903-17 = "А? Сенсей...?"
1007903-18 = "Слава богу, вы здесь. У меня небольшие проблемы."
1007903-19 = "Сенсей, вы должны что-нибудь сделать. Эти люди всё время..."
1007903-20 = "[s3] «Для начала всем успокоиться.»\n[s4] «Наверняка мы все можем поладить.»"
1007903-24 = "...называют меня «Сестрёнкой...»"
1007903-25 = ""
1007903-29 = "[ns5] «А?»\n[ns6] «Ты сказала...»"
1007903-32 = ""
1007903-33 = "Эм. Ну... Понимаете..."
1007903-34 = "Это сокращённо от «старшая сестра»! Посмотрите на неё, у неё прям такая аура!"
1007903-35 = "Ага, ага. Выглядит молодо, но главное ведь то, что внутри!"
1007903-36 = "И послушайте, как она с вами разговаривает, Сенсей... Так неформально со взрослым, будто вы равные!"
1007903-37 = "Что это вообще должно значить...?"
1007903-38 = "А, хотите, чтобы я рассказала, что именно случилось...?"
1007903-39 = "Ну... Это долгая история..."
1007903-40 = "Если коротко, у них возникла небольшая проблема, и я помогла... электричеством."
1007903-41 = "Это ещё мягко сказано! У нас были большие проблемы! Со стройки рухнула целая куча арматуры."
1007903-42 = "Если бы Сестрёнка не сбила её своей сумасшедшей молнией, нас бы раздавило!"
1007903-43 = "Сестрёнка вот так сделала, и...! Бах! Бум! А потом...!"
1007903-44 = ""
1007903-46 = ""
1007903-47 = "...Хватит."
1007903-48 = "С тех пор они ведут себя так. Хотят знать, зачем я им помогла, но кто не поможет человеку в беде?"
1007903-49 = "Ты говоришь так, будто это пустяк! Но это не пустяк!"
1007903-50 = "Нас называют отморозками... Большинство людей скорее полезет с нами драться, чем поможет!"
1007903-51 = "С чего бы мне вообще с вами драться...?"
1007903-52 = "Я подумала, что ваши наряды немного странные, но не решила, что вы бандиты. Просто приняла это за местную моду."
1007903-53 = "Какая широта взглядов! Никто ещё не относился ко мне настолько справедливо! Какая широта взглядов!"
1007903-54 = "Она и правда наша Сестрёнка...!!"
1007903-55 = ""
1007903-57 = ""
1007903-58 = "[ns7] «Я боялся, что ты ввязалась в драку.»\n[ns8] «Рад, что в итоге всё нормально.»"
1007903-61 = ""
1007903-63 = ""
1007903-64 = "Нет, это совсем НЕ нормально! Это вообще-то очень плохо!"
1007903-65 = "Я ещё учусь в средней школе. Я не хочу, чтобы кучка старшеклассниц называла меня старшей сестрой!"
1007903-66 = "Возраст — всего лишь цифра!"
1007903-67 = "Эй, почему бы нам не познакомить тебя с остальными? С такой силой ты могла бы захватить весь этот район...!"
1007903-68 = "А-а! Хватит! Если кто-нибудь вас услышит, подумает, что я какой-то босс преступной банды!"
1007903-69 = "Перестаньте за мной ходить. Я предупреждаю. Больше этой ерунды я терпеть не буду!"
1007903-70 = "Ого... Как и ожидалось от Сестрёнки... Настоящий волк-одиночка..."
1007903-71 = "Я-Ясно... Значит, держаться группой — удел таких слабаков, как мы..."
1007903-72 = "Нам ещё столько предстоит у тебя научиться..."
1007903-73 = "Всё не так! Я же говорю, всё НЕ ТАК!!"
1007903-74 = "Сенсей!! Скажите хоть что-нибудь! Вас они послушают!"
1007903-75 = ""
1007903-77 = ""
1007903-78 = "Сенсей?"
1007903-79 = ""
1007903-82 = "[ns9] Оторваться от телефона.\n[ns10] «Прости, я работал. Что случилось?»"
1007903-85 = "Обратите внимание!!"
1007903-87 = "Пришлось немного поубеждать их, но в итоге мы уговорили их оставить Мисаку в покое."
1007903-88 = "Я также посоветовал им не делать о людях поспешных выводов."
