[translation]
1007202-1 = "Подводная операция по добыче припасов 1"
1007202-3 = "Получив сообщение от Саки, я схватил рыболовные снасти и отправился к причалу."
1007202-4 = ""
1007202-6 = "Немного странно строить с вами планы, не связанные с миссией."
1007202-7 = "Вы принесли всё, что я просила?"
1007202-8 = ""
1007202-10 = ""
1007202-11 = "Рыболовная сеть... Складной нож... Сачок..."
1007202-12 = "Да, этого хватит!"
1007202-13 = "Дайте мне только немного размяться перед тем, как лезть в воду."
1007202-14 = "[s] «Конечно, но что ты там собираешься делать?»"
1007202-15 = "Разве я не говорила? Мы добываем провизию."
1007202-16 = "Жители деревни сказали, что я могу оставить себе любую рыбу, которую мы поймаем."
1007202-17 = "[s] «То есть... рыбалка?»"
1007202-18 = "Верно. Этот участок моря принадлежит деревне. Без разрешения забирать их рыбу было бы незаконно."
1007202-19 = "Поэтому я спросила у ответственного, можем ли мы поймать немного к ужину, и он разрешил."
1007202-20 = "Нам повезло, что они такие щедрые и позволяют пользоваться своими рыболовными угодьями."
1007202-21 = "Сенсей, какую-нибудь конкретную рыбу хотите съесть?"
1007202-22 = "Я хочу отблагодарить вас за то, что сегодня пришли мне помочь."
1007202-23 = "Что-нибудь вроде морского окуня или красного снаппера в ресторане стоит дорого, но если поймать самим — бесплатно..."
1007202-24 = "[s] «Ты правда сможешь что-нибудь поймать, просто нырнув в воду?»"
1007202-25 = "Вы сомневаетесь в моих навыках?"
1007202-26 = "Ещё в академии я получила квалификацию мастера-водолаза на тренировках по амфибийным операциям."
1007202-27 = "В воде я смертельно опасный боец. Поймать немного рыбы — проще простого."
1007202-28 = "[s] «Вы, студенты SRT, потрясающие...»"
1007202-30 = "[ns1] «Но я не привередлив.»\n[ns2] «Не напрягайся. Поймай что-нибудь, что легко достать.»"
1007202-33 = "Хмф. Как скучно..."
1007202-34 = ""
1007202-36 = ""
1007202-37 = "Пусть будет по-вашему. Я скоро вернусь!"
1007202-38 = ""
1007202-40 = ""
1007202-48 = "Прошло несколько минут..."
1007202-53 = ""
1007202-54 = "Ух ты... Давненько я не ныряла."
1007202-55 = ""
1007202-57 = ""
1007202-58 = "Вот. Я уже кое-что поймала."
1007202-59 = "[s] «Это ламинария.»"
1007202-60 = "Ну, её здесь и правда много..."
1007202-61 = "А ламинария — дорогой ингредиент! В дорогих ресторанах сашими оборачивают ламинарией на время выдержки, чтобы вкус стал насыщеннее."
1007202-62 = "Для первого погружения неплохо."
1007202-63 = ""
1007202-65 = ""
1007202-66 = "Ну что... Ныряю снова!"
1007202-67 = ""
1007202-69 = ""
1007202-77 = "Прошло ещё несколько минут..."
1007202-78 = ""
1007202-81 = ""
1007202-82 = "...Это сложнее, чем я думала."
1007202-83 = ""
1007202-85 = ""
1007202-86 = "Вот. Держите. Я набрала много..."
1007202-87 = "[s] «И-и-и... это морская капуста.»"
1007202-88 = "Чтобы вы знали, морская капуста богата железом и кальцием, и её можно использовать в самых разных блюдах."
1007202-89 = "Её ещё удобно хранить: после сушки она уменьшается примерно до одной десятой обычного размера."
1007202-90 = "Стоит собрать ещё немного про запас, чтобы использовать как паёк, когда мы вернёмся в парк Коусаги..."
1007202-91 = ""
1007202-93 = ""
1007202-94 = "Хорошо. На этот раз я поймаю настоящую рыбу!"
1007202-96 = "Некоторое время спустя..."
1007202-100 = ""
1007202-101 = "Вот. Держите."
1007202-102 = "[s] «Это... красные водоросли?»"
1007202-103 = "Красные водоросли, их ещё называют агар-агаром, сами по себе почти безвкусные, но если их сварить и процедить, они застывают в желеобразную массу...!"
1007202-104 = "Можно приготовить их и использовать как... замену пудингу...?"
1007202-105 = "[s3] «Ты определённо хорошо разбираешься в водорослях...»\n[s4] «Я начинаю замечать закономерность.»"
1007202-108 = "Я не специально это делаю!"
1007202-109 = "Ламинария и морская капуста съедобны, разве нет? Это важная работа!"
1007202-110 = "Я сто лет не ныряла и немного растеряла навык! Сначала собираю то, что проще! Для разминки!"
1007202-111 = "В-В следующий раз я поймаю морского окуня! Огромного!"
1007202-112 = ""
1007202-114 = ""
1007202-116 = "Некоторое время спустя..."
1007202-117 = ""
1007202-122 = ""
1007202-123 = "Я вернулась..."
1007202-124 = ""
1007202-126 = ""
1007202-127 = "Ну... По крайней мере, в этот раз это не водоросль..."
1007202-128 = ""
1007202-131 = "[ns5] «Это морская звезда.»\n[ns6] «Не думаю, что её можно есть...»"
1007202-134 = "З-Знаю я!"
1007202-135 = "Просто она показалась мне красивой!"
1007202-136 = "А что до рыбы, которую я вам обещала..."
1007202-137 = ""
1007202-139 = ""
1007202-140 = ""
1007202-141 = "Простите. Они всё время выскальзывают из рук."
1007202-142 = "Раньше я взрывала заряды и стреляла под водой, поэтому думала, что поймать несколько дурацких рыб будет легко..."
1007202-143 = "Но они такие быстрые. И скользкие."
1007202-144 = "Я думала, без проблем поймаю огромную рыбину. А не смогла даже мелочь..."
1007202-145 = "[s7] «Не переживай. Давай я угощу тебя сашими.»\n[s8] «Может, просто купим рыбу на рынке?»"
1007202-146 = ""
1007202-147 = ""
1007202-149 = ""
1007202-150 = "Не может быть!"
1007202-151 = "Я обещала вам свежую рыбу. После такого нельзя соглашаться на магазинную..."
1007202-152 = "Я этого никогда себе не прощу как мастер-водолаз!"
1007202-153 = ""
1007202-155 = ""
1007202-156 = "Всё. В это погружение я беру с собой оружие!"
1007202-157 = ""
1007202-159 = ""
1007202-160 = "[ns] «Саки, стой—»"
1007202-161 = ""
1007202-166 = ""
1007202-167 = "[ns] «...Ну? Как прошло?»"
1007202-168 = "Я поймала одну, но..."
1007202-169 = ""
1007202-171 = ""
1007202-172 = "Теперь в ней огромная дыра."
1007202-173 = "Не думаю, что в таком виде её получится приготовить и съесть..."
1007202-174 = "[s] «Пожалуй, нет.»"
1007202-176 = "[ns] «Уже поздно. Уверен, из всех этих водорослей мы что-нибудь приготовим.»"
1007202-177 = ""
1007202-179 = ""
1007202-180 = "...Ладно."
1007202-181 = "Но в следующий раз я точно поймаю для вас рыбу, Сенсей!"
1007202-183 = "Мы вернулись и сварили большую кастрюлю супа."
1007202-184 = "Хотя из ингредиентов были только морская капуста и ламинария, суп оказался намного вкуснее, чем я ожидал. Вообще-то я даже немного переел..."
