[translation]
52160-1 = "Episódio 16;Flor Artificial"
52160-4 = "...A fuligem se acumulou bastante, não é?"
52160-5 = "Será que isto também já foi um galho tingido de neve?"
52160-6 = "Que aroma agradável... Você também aceita uma xícara, Shuro?"
52160-7 = "S-Sim! Se foi a Sra. Kokuriko quem preparou...!"
52160-12 = "Você se esforçou bastante na noite passada, minha cara."
52160-13 = "Uniu forças com a Azami, repeliu o Hyakkaryouran usando o \"Toutei Bukkairoku\"... e, de quebra, ainda capturou o Sensei de Schale."
52160-14 = "Eu temia que vocês duas acabassem se desentendendo... mas você foi uma ótima menina, Shuro."
52160-15 = "N-Não, foi ela quem decidiu agir por conta própria..."
52160-16 = "Hmm... Aconteceu alguma coisa?"
52160-17 = "Ah, é que..."
52160-18 = "...Eu me esforcei pela senhora, Sra. Kokuriko."
52160-19 = "Para que uma história tenha um belo desfecho, as provações são inevitáveis."
52160-20 = "Não sei o que houve, mas considero a captura do Sensei de Schale um mérito todo seu."
52160-21 = "Aquela pessoa é como um tronco à deriva que turva um grande rio.#nTransforma desespero em esperança, troca tragédia por comédia e se intromete na história—"
52160-22 = "Para nós, que transformamos rumores em histórias de terror... é, por assim dizer, nosso inimigo natural."
52160-23 = "Se tivéssemos que enfrentar aquela pessoa e o Hyakkaryouran ao mesmo tempo...#nMesmo com o poder do Livro Maldito, vencer teria sido difícil."
52160-24 = "Mas, graças a você que o separou das alunas, conseguimos capturá-lo.#nVocê é mesmo uma boa menina, Shuro."
52160-25 = "Sra. Kokuriko...!"
52160-26 = "Contudo— há uma única coisa que ainda não entendi, sabe?"
52160-27 = "Ouvi dizer que o Sensei sempre coloca as alunas acima de si mesmo.#nMas, naquele momento, foi atrás de você, que deveria ser a inimiga... Por acaso você tinha alguma carta na manga?"
52160-32 = "I-Isso é..."
52160-36 = "...Hã?"
52160-37 = "...Sensei de Schale?"
52160-38 = "Por que você se jogou aqui na frente...?"
52160-39 = "\"Vim te salvar.\""
52160-40 = "Mas..."
52160-41 = "Eu... eu tentei te matar..."
52160-42 = "Q-Que tipo de bobagem você está pensando?!"
52160-43 = "Acha mesmo que eu vou virar uma boa menina só por causa disso?!"
52160-44 = "\"Não preciso de motivo para ajudar uma criança em perigo.\""
52160-45 = "\"Como ser humano, é o mínimo a se fazer.\""
52160-49 = "...Na verdade, nem eu mesma entendi direito."
52160-50 = "Ouvi dizer que o Sensei costuma ter atitudes excêntricas.#nSerá que naquela hora também não foi só um capricho...?"
52160-54 = "...É bem possível.#nImprevisível... talvez seja essa a força daquela pessoa, e também a sua fraqueza."
52160-55 = "Hum, Sra. Kokuriko..."
52160-56 = "O que foi?"
52160-60 = "Na hora em que capturamos o Sensei de Schale..."
52160-64 = "Vamos, atira logo de uma vez!"
52160-75 = "Hã...?"
52160-78 = "O tsukumogami criado pelo \"Toutei Bukkairoku\" atacou a mim, e não o Hyakkaryouran."
52160-79 = "Em princípio, uma criatura nascida do Livro Maldito não deveria fazer mal a uma \"aliada\"..."
52160-84 = "...Pois é."
52160-85 = "N-Não é verdade? Por que ele me atacou de repente...?"
52160-86 = "Se o coração que serve de semente para a história de terror for frágil e efêmero,#no que nasce dele também será."
52160-87 = "Se não se pode confiar no coração humano, que vacila com tanta facilidade... que razão haveria para confiar na assombração que brota dele?"
52160-88 = "No fim das contas, é como uma miragem que se dissipa assim que os rumores cessam.#nNão há sentido algum em se preocupar com isso."
52160-93 = "A \"Ayame\" que estava com o Hyakkaryouran é um Hyakumonogatari nascido do coração da Nagusa... não é?"
52160-94 = "Vê-la rindo e sofrendo ao lado da Nagusa... parecia tão real..."
52160-95 = "Pelo menos ela mesma não parecia em nada diferente de uma aluna comum."
52160-96 = "...Sra. Kokuriko."
52160-97 = "É possível que um Hyakumonogatari nascido de uma história de terror acredite de verdade que é uma aluna?"
52160-101 = "...Que pergunta tola."
52160-102 = "É uma questão que não tem sentido nem necessidade de eu responder, mas..."
52160-103 = "Por que está me perguntando isso?"
52160-104 = "Se por acaso... eu, que não tenho nenhuma lembrança além da Sra. Kokuriko—"
52160-105 = "O que aconteceria comigo... quando os rumores cessarem?#nEu só fiquei curiosa..."
52160-110 = "Ora... o chá esfriou."
52160-111 = "E então— já terminou de falar?"
52160-112 = "Pois bem... vou dar uma olhada em como andam as coisas."
52160-113 = "Tanto o Hyakkaryouran quanto o Sensei de Schale estão aqui.#nNão há mais ninguém para nos atrapalhar."
52160-114 = "Continuaremos esta conversa— quando o mundo tiver ardido em cinzas... Tudo bem assim?#nShuro."
52160-121 = "...Sim."
52160-123 = "Próximo;O Retorno da Presidente"
