[translation]
52160-1 = "Эпизод 16;Гармония"
52160-2 = ""
52160-4 = "...От кипятка истощённые угли белеют."
52160-5 = "Ветка, укрытая белым снегом, превращается в уголь."
52160-6 = "Как чудесно пахнет этот чай. Выпьешь чашку, Сюро?"
52160-7 = "Да, да! Если вы предлагаете, госпожа Кокурико...!"
52160-8 = ""
52160-10 = ""
52160-12 = "Прошлой ночью ты была просто великолепна."
52160-13 = "Ты объединилась с Азами. Использовала «Фантомные иллюстрации Тоутэй» против Хяккарёран и захватила Сенсея Шале."
52160-14 = "Я боялась, что вы с ней начнёте спорить. Но вместо этого безмерно рада видеть ваше единство и успех."
52160-15 = "Е-Единство? Ни за что! Эта заклинательница змей просто делала что хотела!"
52160-16 = "Я чувствую разлад между вами?"
52160-17 = "Н-Ну... Скорее..."
52160-18 = "...Я ничего не делала ради этой заклинательницы змей. Я делала это ради вас, госпожа Кокурико."
52160-19 = "Ни одна великая история не обходится без великих трудностей."
52160-20 = "Я не знаю, какие страницы вы с Азами написали вместе. Но пленение Сенсея Шале — твоя победа и только твоя, Сюро."
52160-21 = "Сенсей Шале — противоположность слухам, на которых мы существуем. Непрошеный персонаж в нашей истории, само присутствие которого превращает отчаяние в надежду, трагедию — в комедию."
52160-22 = "Для нас, придающих слухам материальную форму, такой чужак — естественный враг."
52160-23 = "Если бы Хяккарёран натравил на нас этого учителя, никакое количество томов не гарантировало бы нам желанной победы."
52160-24 = "Именно поэтому твой успех настолько велик. Ты с лёгкостью заманила Сенсея в плен. Моё сердце переполняет гордость, Сюро."
52160-25 = "Госпожа Кокурико...!"
52160-26 = "Но одного я не понимаю."
52160-27 = "Сенсей Шале всегда ставит учеников выше собственной безопасности, но в этот раз оставил их и погнался за врагом. Ты применила какой-то трюк, Сюро?"
52160-28 = ""
52160-30 = ""
52160-32 = "Это..."
52160-36 = "...А?"
52160-37 = "...Сенсей Шале?"
52160-38 = "Почему вы толкнули меня себе за спину?"
52160-39 = "«Ты была в опасности»."
52160-40 = "Но..."
52160-41 = "Я... пыталась тебя убить. Идиот!"
52160-42 = "Я даже не одна из твоих жалких студентов! Ты бредишь?"
52160-43 = "Что, думаешь, теперь я тебе должна? Что посвящу жизнь добрым делам и стану скучной?"
52160-44 = "«Я просто хотел, чтобы ты была в безопасности»."
52160-45 = "«Ты была ребёнком в беде»."
52160-47 = ""
52160-48 = ""
52160-49 = "...Я сама не знаю."
52160-50 = "Он огромный чудик, так что, может, просто поступил по очередной странной прихоти?"
52160-51 = ""
52160-53 = ""
52160-54 = "...Возможно. Непредсказуемость — наш яд, но одновременно и его величайшая уязвимость."
52160-55 = "Эм, госпожа Кокурико, можно спросить?"
52160-56 = "Разрешаю."
52160-57 = ""
52160-59 = ""
52160-60 = "Когда мы захватили Сенсея Шале..."
52160-62 = ""
52160-63 = ""
52160-64 = "Что вы делаете? Нападайте на учителя!"
52160-65 = ""
52160-67 = ""
52160-69 = ""
52160-70 = ""
52160-73 = ""
52160-74 = ""
52160-75 = "П-Почему...?"
52160-77 = ""
52160-78 = "...Духи артефактов, призванные «Фантомными иллюстрациями Тоутэй», напали на меня вместо Хяккарёран."
52160-79 = "Раз том контролируем мы, существа не должны нападать на нас... Вы знаете, почему так произошло? С томом что-то не так?"
52160-80 = ""
52160-82 = ""
52160-83 = ""
52160-84 = "...Возможно."
52160-85 = "П-Правда? Иначе это вообще не имеет смысла."
52160-86 = "Сердца хрупки, а желания мимолётны. Именно такие сердца и пишут истории о призраках."
52160-87 = "Они настолько уязвимы, что одно слово, пустяковое недопонимание — и их уже качнуло в неуверенность. Как же доверять монстру, рождённому из подобной хрупкости?"
52160-88 = "Монстры исчезают так же, как слухи. Не тревожь себя этим."
52160-89 = ""
52160-91 = ""
52160-92 = ""
52160-93 = "Та Аямэ, что была с Хяккарёран, тоже была ненастоящей. Каким-то Фантомным сказанием, созданным Нагусой."
52160-94 = "Но она казалась такой настоящей... Смеялась и плакала вместе с друзьями... с Нагусой."
52160-95 = "То есть, по крайней мере, сама она считала себя настоящей."
52160-96 = "...Госпожа Кокурико."
52160-97 = "Как думаете... Фантомное сказание, рождённое из истории о призраках, способно обрести человеческое сознание?"
52160-98 = ""
52160-100 = ""
52160-101 = "...Бессмысленные размышления."
52160-102 = "Не вижу необходимости отвечать — нет, даже размышлять над подобным."
52160-103 = "Зачем ты вообще исследуешь такую ерунду?"
52160-104 = "Потому что... а как же я? Я не знаю ничего, кроме вас, госпожа Кокурико."
52160-105 = "И если мой слух исчезнет, а вместе с ним и я..."
52160-106 = ""
52160-108 = ""
52160-109 = ""
52160-110 = "...Чай остыл."
52160-111 = "У тебя было что-то важное для обсуждения?"
52160-112 = "Тогда я отправлюсь в главное здание."
52160-113 = "Хяккарёран и Сенсей Шале находятся под нашим контролем. Нам больше ничего не мешает."
52160-114 = "Слухи будут разрастаться, пока мир сгорает в пепел. И наша история восторжествует."
52160-115 = ""
52160-117 = ""
52160-119 = ""
52160-120 = ""
52160-121 = "...Да, мэм."
52160-123 = "Следующий эпизод;Возвращение президента"
