[translation]
2601403-1 = "Самозабвенное безделье"
2601403-4 = "Прошу прощения."
2601403-5 = "А, Сенсей. Простите, что отвлекаю вас от работы."
2601403-6 = "Просто, как я уже писала в MomoTalk, я совсем не знаю, чем теперь заняться."
2601403-7 = "[s] «Сегодня тебе стоит отдохнуть в Шале.»"
2601403-8 = "Отдохнуть? Без каких-нибудь особых занятий, как в прошлый раз?"
2601403-9 = "Хотя, если подумать, отдыхать в выходной вполне логично."
2601403-10 = "[s1] «Иногда лучшее, что можно сделать, — это ничего не делать.»\n[s2] «Тебе ведь нужно восстановить и тело, и дух.»"
2601403-13 = "М-м, понятно."
2601403-14 = "Мне нужно отдыхать, чтобы эффективно действовать во время заданий."
2601403-15 = "Хорошо. Тогда я последую вашему совету, Сенсей."
2601403-16 = "[s] «Если хочешь, можешь отдохнуть на этом диване.»"
2601403-17 = "Похоже, вы всё ещё работаете, Сенсей."
2601403-18 = "А вы сами не собираетесь сделать перерыв?"
2601403-19 = "[s] «У меня ещё осталась работа.»"
2601403-20 = ""
2601403-23 = "[ns] «Но ты просто расслабься и отдохни.»"
2601403-24 = "П-поняла."
2601403-25 = "Надеюсь, вы быстро закончите и тоже сможете отдохнуть."
2601403-26 = ""
2601403-28 = "..."
2601403-29 = ""
2601403-33 = "[ns] «Алло, офис Шале слушает.»"
2601403-35 = "[ns] «А, простите, я отправлю этот документ сегодня!»"
2601403-36 = "..."
2601403-37 = "Эм... Если вы заняты, я могла бы немного помочь..."
2601403-38 = "[s] «Не переживай, не переживай! Я же сказал: просто расслабься и отдыхай, Карин!»"
2601403-39 = "П-понятно..."
2601403-40 = "М-м..."
2601403-42 = "Плохое качество воздуха в помещении."
2601403-43 = "[ns] «А, я сегодня забыл прибраться.»"
2601403-44 = "О, ну в ТАКОМ случае я—"
2601403-45 = "[s] «Всё нормально! Я сам всё сделаю! У тебя выходной, так что отдыхай!»"
2601403-46 = ""
2601403-49 = "Угх..."
2601403-51 = "[ns] «Хоп! Если переставить мебель вот так...»"
2601403-52 = "..."
2601403-53 = "[s] «А! Тебе не обязательно помогать мне!»"
2601403-55 = "[ns] «У тебя же выходной, помнишь?»"
2601403-56 = "..."
2601403-57 = "[s] «К-Карин?»"
2601403-58 = "...Сенсей?"
2601403-59 = "Если вы не хотите, чтобы я вам помогала, просто скажите прямо."
2601403-60 = "А не ходите вокруг да около вот так..."
2601403-61 = "[s3] «Ч-что ты имеешь в виду?»\n[s4] «Я просто хотел, чтобы у тебя был настоящий выходной и ты отдохнула.»"
2601403-64 = "Тогда позвольте мне помочь вам!"
2601403-65 = "Выходной или нет, мне неловко смотреть, как вы работаете в одиночку!"
2601403-66 = "[s] «П-понятно... Прости.»"
2601403-67 = "К тому же рядом с вами я отдохну гораздо лучше."
2601403-68 = "Так что, если есть работа, давайте быстро закончим её, а потом отдохнём вместе."
2601403-69 = ""
2601403-72 = "[ns] «Хорошо, тогда рассчитываю на тебя.»"
2601403-73 = "...Да. Предоставьте это мне. Уборка — моя специальность."
2601403-75 = "Мы с Карин вместе убрались в офисе Шале."
2601403-76 = "...А перерыв после этого оказался куда приятнее обычного."
