[translation]
70012010-1 = "В ЭФИРЕ: Геенна 1"
70012010-3 = ""
70012010-4 = ""
70012010-5 = "Не хватает!"
70012010-6 = "Не хватает... чего именно?"
70012010-7 = "Блестяшек!"
70012010-8 = "И под этим ты имеешь в виду..."
70012010-9 = "...что у Клуба «Блести-блести» почти нет занятий, в которых мы могли бы участвовать?"
70012010-10 = "Ты всегда меня понимаешь, Эри! Да-да, именно!"
70012010-11 = "Ну типа вообще ничего весёлого в последнее время не происходит! Почему в Геенна стало та-а-ак тихо?"
70012010-12 = "На прошлой неделе вроде взорвали клубное здание."
70012010-13 = "Ага, на ПРОШЛОЙ неделе! Всего один раз, и, кажется, его уже починили."
70012010-14 = "*вздох* Хочу найти что-нибудь ВЕСЁЛОЕ."
70012010-15 = "Ха. Развлекать тебя — та ещё задача."
70012010-16 = ""
70012010-18 = ""
70012010-19 = "О-о-о, Эри! Смотри туда!"
70012010-20 = "А? Какой?"
70012010-21 = ""
70012010-23 = ""
70012010-25 = ""
70012010-26 = "Слушай, просто сядь туда и говори всё, что захочешь."
70012010-27 = "Ух, какая морока."
70012010-28 = "Найди кого-нибудь другого. Меня дома карри ждёт."
70012010-29 = ""
70012010-31 = ""
70012010-32 = "*вздох* «Морока», значит..."
70012010-33 = "...Ну да. Не могу её винить. Я и пытаюсь найти кого-то другого именно потому, что сама не хочу с этим возиться..."
70012010-34 = ""
70012010-36 = ""
70012010-37 = "Подождите."
70012010-38 = "Пытаясь избежать работы, я создаю себе ещё больше работы?"
70012010-39 = "То есть что бы я ни делала, всё равно окажусь в рутине?"
70012010-40 = "..."
70012010-41 = "Ух. Если слишком много об этом думать, меня вырвет."
70012010-42 = "Но где я вообще найду в Геенна человека, который добровольно согласится на это?"
70012010-43 = "Мне даже нечего предложить в награду... Если не считать «автограф» Макото, но кому в здравом уме он нужен?"
70012010-44 = ""
70012010-46 = ""
70012010-47 = "Эй-эй! Ты же... Ироха, да? Из Общества Пандемониума!"
70012010-48 = "Выглядишь немного напряжённой — можем чем-нибудь помочь?"
70012010-49 = "Вы двое..."
70012010-50 = "..."
70012010-51 = "Ах!"
70012010-52 = "Ответ на мои молитвы."
70012010-54 = "Ранее..."
70012010-55 = "Ки-хе-хе-хе. Вот так всё и есть."
70012010-56 = "ЧТО именно «так»? Обычно эту фразу говорят ПОСЛЕ того, как объяснят мысль."
70012010-57 = "Ну, я просто хотела это сказать. Всем иногда хочется."
70012010-58 = "Чувства куда важнее, чем ты думаешь, Ироха."
70012010-59 = "Ага, ладно. Как скажешь, Макото."
70012010-60 = "Ки-хе-хе. Кстати! Доложи мне о нашей школьной радиопередаче, организованной, поставленной и произведённой никем иным, как НАМИ — Обществом Пандемониума!"
70012010-61 = "Особенно мне нравится рубрика, где мы читаем настоящие истории настоящих студентов Геенна!"
70012010-62 = "Да, всё идёт хорошо. Отлично. Наверное."
70012010-63 = "А вот рубрику «Чтение стихов во славу Макото» надо убрать. Пустая трата бюджета."
70012010-64 = "Да и передачу всё равно никто не слушает."
70012010-65 = "Тебе ещё учиться и учиться, Ироха! Именно поэтому она так прекрасна! Ки-хе-хе!"
70012010-66 = "И что именно прекрасного в отсутствии слушателей?"
70012010-67 = "Нет слушателей — значит, ни перед кем не надо отчитываться! Можно делать и говорить ЧТО УГОДНО!"
70012010-68 = "Например, невзначай вставлять объявления о перераспределении бюджета..."
70012010-69 = "Можно заявить: «О сокращении бюджета Префектурной команды уже сообщили по официальным каналам Геенна». Ки-хе-хе."
70012010-70 = "Мелочно. И невероятно бессмысленно."
70012010-71 = "СМЫСЛ в том, что никому нет дела до передачи, а потому для нас это отличный инструмент! Для Общества Пандемониума!"
70012010-72 = ""
70012010-75 = ""
70012010-76 = "Доклад!"
70012010-77 = "Студент, который вёл школьную передачу, только что уволился!"
70012010-78 = "ЧТО ТЫ СКАЗАЛА?! Почему??"
70012010-79 = "Я-Я пыталась спросить, но она только повторяла: «Личные причины...» и выглядела совершенно отрешённой!"
70012010-80 = "Конечно, мы уже ищем замену, но подбор нового ведущего может занять время!"
70012010-81 = "Н-Никто не мог такого предвидеть!"
70012010-82 = "*вздох* Ничего не поделаешь. Видимо, сегодняшнюю передачу придётся отменить."
70012010-83 = "НЕТ! Нет, Ироха, этого нельзя допустить!"
70012010-84 = "А? Почему? Ты же сама сказала, что самое прекрасное в ней — то, что её никто не слушает."
70012010-85 = "Ты опять не понимаешь сути!"
70012010-86 = "Аудитория неважна! Но если передача вообще НЕ выйдет... это будет катастрофа!"
70012010-87 = "Это вопрос величайшей важности, затрагивающий достоинство Общества Пандемониума и, что ещё важнее, МЕНЯ!!"
70012010-88 = "Кроме тебя так никто не думает."
70012010-89 = "Найди замену!! ПРЯМО СЕЙЧАС!!"
70012010-90 = "Ты серьёзно? Я не могу просто выдернуть кого-то из толпы. Где в Геенна я найду человека с опытом радиовещания...?"
70012010-91 = "А я откуда знаю?! Да зачем вообще опыт?! Мне всё равно!"
70012010-92 = "Главное — не отменяй передачу!!"
70012010-93 = "Это невероятно несправедливо!!"
70012010-95 = "П-Понятно..."
70012010-96 = "*вздох* Теперь понимаете мою боль? Тратить время на подобную ерунду..."
70012010-97 = "Звучит ОФИГЕННО!"
70012010-98 = "..."
70012010-99 = "Что?!"
70012010-100 = "Тебе тоже так кажется, Эри? Давай сделаем? Давай?"
70012010-101 = "Ну, сказали же, опыт не нужен. Может быть весело."
70012010-102 = "Серьёзно...?"
70012010-103 = "Ага!! К какому времени нам надо быть готовыми?"
70012010-104 = "Ну... Вам вообще-то ничего готовить не надо..."
70012010-105 = "Но вы правда серьёзно?"
