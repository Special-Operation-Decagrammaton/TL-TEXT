[translation]
2002103-1 = "Особая тренировка! Цель — Санта!"
2002103-2 = "Итак, Сенсей!"
2002103-3 = "Я долго и очень серьёзно думала, как стать лучшим Сантой, каким только могу!"
2002103-4 = "[s1] «Почему-то мне уже страшно...»\n[s2] «Это вообще под силу... обычным людям?»"
2002103-5 = "Сенсей! Не драматизируйте!"
2002103-6 = "Сенсей! Не драматизируйте!"
2002103-7 = "Это может сделать кто угодно! Мы можем начать тренировку прямо сейчас!"
2002103-8 = "[s] «Мне от этого совсем не легче...»"
2002103-9 = "Да вы должны радоваться! Я решила, что следующий этап моего пути Санты — научиться паркуру!"
2002103-10 = "Да-да! Паркур — это спорт, где перепрыгивают препятствия, взбираются по стенам и преодолевают собственные пределы!"
2002103-11 = "Это же совершенно логично! Как иначе я заберусь на крышу, спущусь по дымоходу и выберусь обратно?"
2002103-12 = "Чтобы стать идеальным Сантой, нужно обязательно освоить паркур!"
2002103-13 = "Поэтому, Сенсей! Будете тренироваться со мной?"
2002103-14 = "[s] Сбежать."
2002103-15 = "Эй! Вернитесь, Сенсей! Взрослые не должны убегать от своих проблем!"
2002103-16 = "[s] «Н-Но здесь всё равно негде тренировать паркур!»"
2002103-17 = "В этом и прелесть паркура! Тренироваться можно где угодно!"
2002103-18 = "Вы только посмотрите на Шале! Тут даже лучше, чем я думала!"
2002103-19 = "Стены идеальной высоты, и вокруг полно прочных конструкций."
2002103-20 = "Главное качество Санты — непоколебимая решимость, так что и я должна испытать свои пределы!"
2002103-21 = "Хорошо, пора! Просто следуйте за мной, Сенсей!"
2002103-27 = "Я не успел даже возразить, а Ханаэ уже полезла на стену."
2002103-28 = ""
2002103-32 = "Сразу было понятно, что она понятия не имеет, что делает."
2002103-33 = "К-Кажется, руку сюда... Теперь поднять ногу..."
2002103-34 = "А-А-А!"
2002103-35 = ""
2002103-37 = ""
2002103-39 = "Мне едва удалось поймать Ханаэ, когда она сорвалась со стены."
2002103-41 = "[ns] «Я же пытался сказать, что это слишком опасно...»"
2002103-42 = "Но вы ведь меня поймали, правда?"
2002103-43 = "Пока вы рядом, Сенсей, это не опасно!"
2002103-44 = "Хорошо! К следующему месту!"
2002103-45 = ""
2002103-47 = ""
2002103-49 = "Ханаэ таскала меня с места на место в поисках площадок для своей новой страсти — паркура."
2002103-51 = "Хм... Эти стены не подходят... Гладкие как шёлк, и ухватиться вообще не за что!"
2002103-52 = "Но разве Санта здесь сдастся? Не думаю!"
2002103-53 = "[s] «Думаю, Санта как раз бы сдался, Ханаэ!»"
2002103-54 = "Хорошо, что я взяла специальные цепкие перчатки для лазания! Осталось только следить, куда ставлю ноги..."
2002103-55 = "Понемногу... осторожно..."
2002103-57 = "На зданиях Тринити много украшений — за них удобно цепляться!"
2002103-58 = "Но мне ужасно влетит, если я хоть что-нибудь повредю..."
2002103-59 = "Значит, нужно двигаться очень осторожно!"
2002103-60 = "[s] «А если вообще не лезть, то и повредить ничего не получится!»"
2002103-61 = ""
2002103-62 = "Я справлюсь... Просто держать равновесие и не зависать на месте слишком долго..."
2002103-63 = "Нужно работать И ногами, И руками..."
2002103-64 = "Сенсей, Сенсей! Вы смотрите?! Правда, у меня здорово получается?"
2002103-65 = "[ns] «Смотри вперёд! Ханаэ! Стой...!»"
2002103-67 = "Старые жилые корпуса"
2002103-68 = "Наверное, лучше места я уже не найду."
2002103-69 = "Тут немного старо... и кое-где всё разваливается, но..."
2002103-70 = "Паркур-Санта преодолеет всё!"
2002103-71 = "[s] «Не существует никакого Паркур-Санты!»"
2002103-73 = "К моему удивлению, Ханаэ покоряла одно здание за другим."
2002103-74 = "Хотя она постоянно оказывалась в невероятно опасных ситуациях, нам удавалось обходиться без катастроф. А потом..."
2002103-76 = "Я сделала это! Спасибо за помощь, Сенсей!"
2002103-77 = "[s] «Мне плохо...»"
2002103-78 = "После такой тренировки я могу с гордостью надеть костюм Санты!"
2002103-79 = "А теперь — к следующему испытанию!"
2002103-80 = "Что вы имеете в виду? У меня ещё есть испытания?"
2002103-81 = "Конечно! Мне ещё далеко до настоящего Санты!"
2002103-82 = "Следующая цель — летать по небу со скоростью в два Маха!"
2002103-83 = "Но... как мне этого добиться, Сенсей? Может, ученики Миллениума знают..."
2002103-84 = "Я слышала, их Инженерный отдел умеет вообще всё."
2002103-85 = "[s] «Я на коленях умоляю! Пожалуйста, не надо!»"
