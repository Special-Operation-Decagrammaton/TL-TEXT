[translation]
1301306-1 = "Небольшое отклонение"
1301306-2 = "Получив приглашение от Момидзи, я отправился в библиотеку Красной Зимы..."
1301306-3 = "В библиотеке"
1301306-4 = ""
1301306-6 = ""
1301306-7 = "Чем могу помочь сегодня?"
1301306-8 = "[s] «А? Сегодня больше никого нет?»"
1301306-9 = "А, насчёт этого... Сегодня выходной."
1301306-10 = "Что? Зачем я позвала вас в выходной?"
1301306-11 = "..."
1301306-12 = "Просто скорее заходите! Ну же!"
1301306-14 = ""
1301306-15 = "Ну как, Сенсей? Здесь тепло, правда?"
1301306-16 = "[s1] «Да. Здесь... тепло и уютно.»\n[s2] «Так зачем ты позвала меня сегодня?»"
1301306-19 = "Н-Насчёт этого!"
1301306-20 = "Ну, понимаете! Сегодня на самом деле не официальный выходной. Скорее временный."
1301306-21 = "Я ухожу от ответа? Ладно, вы меня поймали..."
1301306-22 = ""
1301306-24 = ""
1301306-25 = "Эм, Сенсей..."
1301306-26 = "Вы... Вы не хотите... поспать в библиотеке?"
1301306-27 = "[s] «Что?! Библиотекарю вообще разрешено такое предлагать?!»"
1301306-28 = "Ах! Ну, понимаете..."
1301306-29 = "Иногда... студенты или даже президент Черина приходят в библиотеку просто поспать!"
1301306-30 = "И мне приходится всех их будить. Однажды мне даже пришлось физически выпроводить президента Черину! Хотя с её ростом это было не так уж сложно..."
1301306-31 = "..."
1301306-32 = "В общем! Мне стало интересно, почему люди идут такую даль только ради сна, и я решила попробовать сама..."
1301306-33 = "[s] «И поняла, что библиотека — идеальное место для сна?»"
1301306-34 = "...Да."
1301306-35 = "П-Почему вы спрашиваете, зачем библиотека закрыта?"
1301306-36 = "П-Потому что...!"
1301306-37 = "[s] «Понятно. Ты хотела хотя бы сделать вид, что всё официально.»"
1301306-38 = "Если так говорить, всё звучит ужасно!"
1301306-39 = "Хотя вы... не ошибаетесь..."
1301306-40 = "Уф... Это ведь плохо с моей стороны, да? Может, идея была неудачная..."
1301306-41 = "Что люди скажут, если узнают, что библиотекарь использует библиотеку ради такой ерунды?"
1301306-42 = "Н-Но всё-таки я выделила отдельное место специально для сна."
1301306-43 = "В других академиях так тоже делают! Мы просто следуем их примеру!"
1301306-44 = ""
1301306-46 = ""
1301306-47 = "..."
1301306-48 = "Простите, Сенсей. Я просто оправдываюсь..."
1301306-49 = "[s3] «Да уж, после ночи без сна я ужасно устал.»\n[s4] «Я зеваю? В холодную погоду меня всегда клонит в сон.»"
1301306-52 = "П-Правда?"
1301306-53 = "Вы просто пытаетесь меня подбодрить, Сенсей?"
1301306-54 = ""
1301306-57 = "Эй! Уберите эту улыбку с лица! Вы меня смущаете!"
1301306-58 = "..."
1301306-59 = "Эм, Сенсей?"
1301306-60 = ""
1301306-62 = ""
1301306-64 = ""
1301306-65 = "Ну, если вы и правда так устали... может, хотите вздремнуть вместе?"
1301306-66 = "[s] «Да, пожалуйста. Глаза уже сами закрываются.»"
1301306-67 = "Хи-хи-хи... Тогда прошу сюда, в совершенно новое спальное место библиотеки Красной Зимы!"
1301306-68 = ""
1301306-72 = "Место для сна, которое подготовила Момидзи, и правда оказалось тёплым и уютным."
1301306-73 = "Там было много мягких подушек и одеял, а книжные шкафы она расставила так, чтобы солнце не светило мне в глаза."
1301306-75 = "Вам удобно, Сенсей?"
1301306-76 = "Ваше дыхание уже замедлилось. Наверное, вы очень устали..."
1301306-77 = "..."
1301306-78 = "Знаете, Сенсей."
1301306-79 = "Мне... Мне правда нравятся люди, которые меня понимают."
1301306-80 = ""
1301306-83 = "Надеюсь, вы хорошо отдохнёте."
1301306-84 = ""
