[translation]
1015005-1 = "Drifting Killer Whale"
1015005-3 = "The Rhodes"
1015005-4 = "(Finished with my work at Trident, I headed for the Rhodes, where #nKotone was said to be resting.)"
1015005-5 = "(However, upon arriving, there was no sign of Kotone, and hardly any students milling about either.)"
1015005-6 = "[ns] \"...Kotone?\""
1015005-9 = "Oh, Sensei? I thought you went back..."
1015005-10 = "Are you looking for someone, perhaps?"
1015005-11 = "[s] \"I am looking for the vice president of the diving club...\""
1015005-12 = "Uhm... You mean Fuchigami-san?"
1015005-13 = "She was around here just a little while ago, but..."
1015005-14 = "The last time I saw her, she was drifting away with the current, so I have no idea where she is now..."
1015005-15 = "[s1] \"Drifting away with the current!?\"\n[s2] \"That is a huge emergency!!\""
1015005-18 = "Ah, yes. Well, I suppose so..."
1015005-19 = "Though I think Fuchigami-san will be fine, probably."
1015005-20 = "She usually just rests while floating like that, so--"
1015005-23 = "...She left."
1015005-25 = "(A short while later, after running along the deck for about ten minutes...)"
1015005-26 = "(I found Kotone lying in the middle of the calm sea, her eyes closed.)"
1015005-27 = "[ns] \"Kotone!\""
1015005-28 = "(Perhaps my voice could not reach her, as Kotone bobbed up and down on the water with her eyes still closed.)"
1015005-29 = "[ns] \"Kotone--!\""
1015005-31 = "Hm? Did someone call...?"
1015005-32 = "Oh... Sensei?"
1015005-36 = "[wa:1740]- [log=코토네]Ah, [wa:1300]Sensei.[/log]"
1015005-38 = "- [log=코토네]You came to see me.[/log]"
1015005-41 = "- [log=코토네]Sorry.[/log]"
1015005-43 = "- [log=코토네]I was in the water, so I did not notice...[/log]"
1015005-46 = "[ns] \"Are you really going to be okay doing that?\""
1015005-47 = "[wa:1000]- [log=코토네]Hm? [wa:1480]Oh... [wa:1260]This book?[/log]"
1015005-49 = "- [log=코토네]It is waterproof, [wa:2160]so it is fine.[/log]"
1015005-52 = "[ns] \"I am not talking about the book, Kotone. I mean you.\""
1015005-53 = "[wa:1370]- [log=코토네]Is that so...?[/log]"
1015005-55 = "- [log=코토네]Is sleeping on the water dangerous?[/log]"
1015005-58 = "- [log=코토네]Do not worry, [wa:1890]I am used to it.[/log]"
1015005-60 = "- [log=코토네]Besides... [wa:1780]it feels [wa:2190]so nice out here.[/log]"
1015005-63 = "[wa:1080]- [log=코토네]I can soak up the sun [wa:2180]while listening to the sounds underwater...[/log]"
1015005-66 = "- [log=코토네]In a way, [wa:2360]reading and diving [wa:2270]are kind of similar.[/log]"
1015005-68 = "- [log=코토네]Because both let you listen to the voices of sinking things.[/log]"
1015005-71 = "[wa:1500]- [log=코토네]Hey, [wa:2050]would you like to try it together, Sensei?[/log]"
1015005-73 = "- [log=코토네]I can tell you... [wa:2210]so many stories [wa:3570]about the world at the bottom of the sea.[/log]"
1015005-77 = "[ns3] \"If Kotone says so...\"\n[ns4] \"...Maybe I should try it too?\""
1015005-80 = "(Following Kotone's example, I entered the water wearing a life jacket.)"
1015005-81 = "(After some trial and error, I managed to get into a reclining position on the water, but...)"
1015005-86 = "How is it, Sensei?"
1015005-87 = "[s] \"Ugh...\""
1015005-91 = "[ns5] \"Waves keep splashing in my face, I cannot relax...\"\n[ns6] \"If I lose my balance even a little, I feel like I will sink...\""
1015005-94 = "Hmm, was it a bit too difficult?"
1015005-95 = "You know, Sensei, you look less like a predator... and more like prey."
1015005-96 = "Even if other students tempt you with sweet words... #nplease do not just follow along so easily like this."
1015005-101 = "Luring prey into the water with bait is a classic way killer whales hunt."
1015005-102 = "[s] \"Don't tell me you are trying to hunt me, Kotone?\""
1015005-103 = "Fufu. Well, who knows?"
1015005-104 = "If that were the case--"
1015005-105 = "You better struggle your hardest so you do not become bait."
