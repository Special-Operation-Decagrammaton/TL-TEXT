[translation]
2004605-1 = "Гнев переворачивает Небо и Землю"
2004605-6 = "Ния больше не отвечала."
2004605-7 = "Я не мог ждать дальше, поэтому отправился по адресу, который она прислала последним."
2004605-8 = ""
2004605-9 = "Я слышала, Моурё снова устраивают неприятности."
2004605-10 = "У нас и так забот по горло! Что им теперь нужно?!"
2004605-11 = "Не знаю. Они внезапно требуют денег..."
2004605-12 = "Они нас ограбить решили? Я думала, им хотя бы фестивали нравятся..."
2004605-14 = "Я шёл по улице, где становилось всё хаотичнее."
2004605-16 = "Уааа! Почему никто не хочет меняться с нами клубными комнатами?"
2004605-17 = "Ну, учитывая, что наша стоит у чёрта на куличках и ещё эти истории о призраках..."
2004605-18 = "Вообще-то нам сделали пару предложений, но их комнаты слишком маленькие для наших работ по оригами."
2004605-19 = "Нам конец! Нашему клубу будет негде вообще ничего делать. Придётся распуститься! Уааа!"
2004605-20 = "Хватит плакать! Ты сейчас и МЕНЯ доведёшь!"
2004605-22 = "Миновав студентов, оплакивавших проблемы своих клубов..."
2004605-24 = "Понятно, понятно... Хм. Много всего случилось, пока я отошла."
2004605-25 = "Что значит «А чего ты ожидала?»?"
2004605-26 = "Ньяха, я ведь не умею видеть будущее, Сенсей. Ну же."
2004605-27 = ""
2004605-29 = ""
2004605-30 = "Фуфу... Ладно, хотите правду?"
2004605-31 = "Да. Всё то недоразумение между Моурё и торговой гильдией... если бы я устроила им встречу, они, ВЕРОЯТНО, могли бы его избежать."
2004605-32 = "И я уже знаю несколько клубов, которые могли бы согласиться поменяться с Клубом оригами."
2004605-33 = "Я знаю, что эти проблемы решаемы."
2004605-34 = "Но я не вмешиваюсь, и уже объяснила почему."
2004605-35 = "Клуб Инь-Ян прежде всего защищает гармонию. Если начнём кому-то благоволить, это уже не гармония."
2004605-36 = "К тому же, знаете..."
2004605-37 = "...гораздо веселее, когда вокруг немного суматохи, не думаете?"
2004605-38 = "[s] «...Кстати, ты говорила о какой-то большой проблеме?»"
2004605-39 = "А, насчёт этого..."
2004605-40 = "...моя проблема в том, что придумывать новые оправдания становится всё труднее. Но с вами это намного проще, Сенсей."
2004605-41 = ""
2004605-44 = "..."
2004605-45 = "[ns] «Ния, сядь и выпрямись.»"
2004605-46 = "А?"
2004605-47 = "[ns] «Сейчас тебя будут отчитывать.»"
2004605-50 = "― [log=니야]Н-Ньяхаха...[/log][wa:1260]"
2004605-51 = "― [log=니야]Эм, Сенсей?[/log][wa:2990]"
2004605-54 = "― [log=니야]Ого, какое страшное лицо...[/log][wa:550]"
2004605-55 = "― [log=니야]Вам оно не идёт, знаете?[/log][wa:1180]"
2004605-58 = "― [log=니야]...Вы правда злитесь?[/log][wa:3150]"
2004605-61 = "― [log=니야]Ну, то есть,[/log][wa:330]"
2004605-62 = "― [log=니야]я и так уже понимаю, но, ахаха...[/log][wa:2970]"
2004605-65 = "― [log=니야]Так что, эм...[/log][wa:3710]"
2004605-66 = "― [log=니야]Да, я... я прошу прощения...[/log][wa:890]"
2004605-69 = "― [log=니야]Но всё-таки, как бы это сказать...?[/log][wa:80]"
2004605-70 = "― [log=니야]У всех есть свои причины поступать так или иначе... [/log][wa:3520]"
2004605-73 = "― [log=니야]А?! Нет-нет![/log][wa:1520]"
2004605-76 = "― [log=니야]Я не оправдываюсь![/log]"
2004605-77 = "― [log=니야]Я занимаюсь саморефлексией! Ага, ага![/log][wa:1750]"
2004605-80 = "― [log=니야]Да... Я сейчас совершенно точно всё переосмысливаю.[/log][wa:1230]"
2004605-81 = "― [log=니야]Так что, может, простите меня хотя бы в этот раз? [/log][wa:3270]"
2004605-84 = "...Я прочитал ей долгую нотацию."
