[translation]
51110-1 = "Episódio 11;Apenas uma Aluna"
51110-5 = "Ei, vocês! Cerquem ela! Não deixem escapar desta vez!"
51110-13 = "Antes teve um pequenino imprevisto, né!"
51110-14 = "Mas desta vez, finalmente te achamos!"
51110-23 = "...Nham, nham."
51110-24 = "Você fugiu da outra vez, mas hoje pode desistir!#nTrouxemos muito mais gente do que antes!"
51110-25 = "...Nham, nham."
51110-26 = "Líder! Ela tá comendo alguma coisa!"
51110-27 = "Hah! Tá tirando com a nossa cara!"
51110-30 = "Nham, nham..."
51110-32 = "Glup."
51110-33 = "Não tem nenhuma última palavra pra dizer?"
51110-34 = "Se pedir desculpas direitinho, talvez a gente até pegue um pouco mais leve—"
51110-38 = "—Nham, nham."
51110-43 = "Líder! Ela começou a comer de novo?!"
51110-45 = "Hyakkaryouran...! Até onde você vai fazer a gente de trouxa...?!"
51110-46 = "...Eu já disse antes, mas eu não sou do Hyakkaryouran."
51110-47 = "Só vim dar uma olhada no festival por acaso..."
51110-49 = "...Isso mesmo, uma aluna comum de Hyakkiyako, mas com um ar misterioso e frágil... só isso."
51110-51 = "Como é que uma aluna comum conseguiria fazer uma coisa daquelas?!"
51110-52 = "Já chega, não vou perdoar!"
51110-53 = "Todo mundo, avanç—"
51110-54 = "[s] \"Esperem!\""
51110-62 = "Líder?!"
51110-63 = "A-Atirar assim do nada...!"
51110-70 = "Senpai?!"
51110-71 = "Droga..."
51110-72 = "T-Todo mundo, ataquem!!"
51110-103 = "Ugh..."
51110-107 = "M-Maldição!"
51110-108 = "Cerquem ela!! Pressionem com a vantagem numérica!!"
51110-114 = "...!"
51110-121 = "(Quanto tempo será que já se passou...?)"
51110-132 = "Te peguei...!"
51110-133 = "Ah?!"
51110-134 = "[ns] \"Direita!\""
51110-146 = "Já entendi..."
51110-147 = "Na direita! Mirem na direita!!"
51110-148 = "A reação dela só é lenta pelo lado direito!"
51110-149 = "Encontrar o ponto fraco do inimigo e focar todos os ataques lá...#nÉ assim que a Trupe Chimi age!"
51110-150 = "Que problemático..."
51110-152 = "O lança-foguetes tá pronto!"
51110-156 = "Uah! N-Não dá pra ver nada!"
51110-157 = "Cof, cof..."
51110-164 = "[ns] \"Vamos recuar por enquanto.\""
51110-165 = "...Quem é você?"
51110-170 = "E-Espera, eu..."
51110-177 = "[ns1] \"Arf, arf... Acho que até aqui já estamos seguros.\"\n[ns2] \"Que bom que você não parece estar muito ferida.\""
51110-180 = "...Quem é você?"
51110-184 = "O Sensei... de Schale?"
51110-185 = "O Sensei de Schale, se não me engano..."
51110-186 = "...Não precisava ter me ajudado."
51110-187 = "Daquele tanto eu dava conta sozinha—"
51110-192 = "[ns] \"Seu braço direito está machucado?\""
51110-193 = "...!"
51110-194 = "Meus movimentos do lado direito estavam lentos...?"
51110-195 = "A ponto de alguém que acabei de conhecer perceber... entendi."
51110-196 = "...Isso aqui."
51110-200 = "..."
51110-201 = "[s3] \"Desculpa se é algo que você não quer que perguntem.\"\n[s4] \"Não tenho intenção de te forçar a falar.\""
51110-204 = "E então... o que o Sensei de Schale quer comigo?"
51110-205 = "Não estava me procurando, só tinha assuntos a resolver em Hyakkiyako?#nE estava ali por acaso? ...Entendi."
51110-206 = "[s] \"Pelo seu uniforme, por acaso você...\""
51110-210 = "Ah... bem... o Hyakkaryouran..."
51110-211 = "[s] \"Então você é mesmo do Hyakkaryouran.\""
51110-212 = "..."
51110-213 = "É mesmo. Pensando bem, com o Sensei de Schale eu ainda..."
51110-214 = "...Sim."
51110-217 = "Você tem razão."
51110-218 = "Eu sou... do Hyakkaryouran."
51110-219 = "Não... para ser mais exata, o correto seria dizer que eu era do Hyakkaryouran."
51110-220 = "...Porque agora eu já me afastei."
51110-221 = "[s] \"Sim, eu ouvi dizer. Que muitos membros saíram na época da Ordem de Dissolução.\""
51110-222 = "Ordem de Dissolução..."
51110-223 = "Entendi, então o Hyakkaryouran já..."
51110-224 = "...Sim, claro."
51110-225 = "Depois de eu tentar devolver aquilo, é natural que aquelas meninas..."
51110-226 = "..."
51110-227 = "Isso mesmo. Eu também saí do Hyakkaryouran... e resolvi dar uma volta pela cidade."
51110-228 = "Queria ver os preparativos do festival para espairecer um pouco."
51110-232 = "Obrigada por me ajudar."
51110-233 = "Então eu já vou—"
51110-234 = "[s] \"Já está ficando tarde, vamos voltar por hoje.\""
51110-238 = "Hã...? Por que eu iria com você...?"
51110-244 = "Ei, espera...!"
51110-251 = "(Afastados da agitação, o silêncio pairou entre nós dois)"
51110-252 = "..."
51110-253 = "..."
51110-254 = "Você disse... que veio a Hyakkiyako porque tinha assuntos a resolver, né?"
51110-255 = "E também sabia sobre a \"Ordem de Dissolução\"."
51110-256 = "Nesse caso, por acaso... sobre o Hyakkaryouran..."
51110-257 = "[s] \"Você está curiosa sobre como estão as coisas?\""
51110-258 = "...Sim. Já faz bastante tempo desde que me afastei."
51110-259 = "Fiquei um pouco curiosa."
51110-261 = "(Como não havia motivo para esconder, contei a ela o que aconteceu hoje)"
51110-263 = "...O \"Torneio de Sucessão\", é?"
51110-264 = "Entendi, então isso aconteceu enquanto eu estava fora."
51110-265 = "...Por que chegar a esse ponto?"
51110-266 = "...Não, acho que não tenho o direito de dizer uma coisa dessas."
51110-267 = "[s] \"Acho que a Yukari sentiu que as coisas não podiam continuar como estavam.\""
51110-268 = "Entendi, a Yukari..."
51110-270 = "Área Residencial de Hyakkiyako"
51110-273 = "Até aqui já está bom."
51110-274 = "Obrigada por me acompanhar, Sensei de Schale."
51110-275 = "...Então, até."
51110-276 = "[s] \"Você não pensa em voltar para o Hyakkaryouran?\""
51110-280 = "...Entendi."
51110-281 = "Você esperou eu baixar a guarda para perguntar isso."
51110-282 = "É uma pessoa mais astuta do que eu pensava."
51110-283 = "...Desculpa, mas eu não posso voltar."
51110-284 = "[s] \"Porque já saiu...?\""
51110-285 = "...Isso mesmo."
51110-286 = "Naquele dia, eu tentei devolver aquilo... então aquelas meninas não vão mais me perdoar."
51110-287 = "Voltar para o Hyakkaryouran a essa altura... eu nem tenho coragem para isso."
51110-288 = "Porque eu não sou tão forte assim."
51110-289 = "Do jeito que estou agora... eu nem tenho qualificação para isso."
51110-290 = "Eu não sou \"aquela garota\"..."
51110-295 = "Não quero decepcionar todo mundo que ficou..."
51110-296 = "Esse é o único motivo pelo qual não posso voltar... então..."
51110-301 = "[log=???]<Mentira>[/log]"
51110-304 = "<Mentira>"
51110-307 = "<Mentira>"
51110-310 = "<Mentira>"
51110-313 = "...Então, tchau."
51110-317 = "[ns] \"Talvez eu não devesse ter perguntado isso logo na primeira vez que nos vimos...\""
51110-321 = "[ns] \"Na próxima vez que nos encontrarmos... espero pelo menos poder perguntar o nome dela.\""
51110-323 = "(Enquanto repassava mentalmente a conversa de antes, fiquei observando o sol se pôr)"
51110-325 = "Próximo;Kikyou Kiryuu e o Torneio de Sucessão (1)"
