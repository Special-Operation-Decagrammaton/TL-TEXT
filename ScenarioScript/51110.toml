51110-196 = "Это... Ну..."
51110-197 = ""
51110-199 = ""
51110-200 = "..."
51110-201 = "[s3] «Прости, если вопрос был бестактным.»\n[s4] «Необязательно рассказывать, если не хочешь.»"
51110-204 = "...Что привело Сенсея из Шале в нашу академию?"
51110-205 = "Вас пригласили в Хяккияко? И на обратном пути вы случайно наткнулись на ту драку..."
51110-206 = "[s] «Я уже видел студентов в такой одежде...»"
51110-207 = ""
51110-209 = ""
51110-210 = "А, да... Хаори Хяккарёран..."
51110-211 = "[s] «Значит, ты состоишь в Хяккарёран?»"
51110-212 = "..."
51110-213 = "...Если подумать, Сенсей..."
51110-214 = "Да."
51110-217 = "Полагаю, ты прав."
51110-218 = "Я... действительно состою в Хяккарёран."
51110-219 = "Или, во всяком случае, в том, что от него осталось."
51110-220 = "Хотя, возможно, мне уже не стоит так себя называть... после того как я ушла."
51110-221 = "[s] «Я слышал, что после объявления приказа о роспуске многие студенты ушли.»"
51110-222 = "Декларация о роспуске..."
51110-223 = "Конечно... Значит, Хяккарёран уже..."
51110-224 = "Нет. Мне следовало этого ожидать."
51110-225 = "Какой ещё выбор у них был после того, как я попыталась вернуть..."
51110-226 = "..."
51110-227 = "Прошу прощения, Сенсей. После роспуска Хяккарёран я немного сама не своя."
51110-228 = "Можно сказать, мне хотелось перевести дух и посмотреть на праздник..."
51110-229 = ""
51110-231 = ""
51110-232 = "Ещё раз благодарю вас за помощь."
51110-233 = "Но теперь..."
51110-234 = "[s] «Тогда, раз уже поздно, пойдём обратно?»"
51110-235 = ""
51110-237 = ""
51110-238 = "Ч-Что? Вы проводите меня обратно...? Зачем—"
51110-239 = ""
51110-241 = ""
51110-243 = ""
51110-244 = "Тогда, ну... Я буду весьма признательна."
51110-245 = ""
51110-251 = "Некоторое время, пока мы шли рядом, слышались лишь наши шаги."
51110-252 = "..."
51110-253 = "..."
51110-254 = "...Вы сказали, что вас пригласили разобраться с некоторыми делами Хяккияко."
51110-255 = "И вы уже знали о Декларации о роспуске."
51110-256 = "Тогда, насчёт Хяккарёран... Может быть, вы..."
51110-257 = "[s] «Я знаю последние новости о Хяккарёран?»"
51110-258 = "...Да. С тех пор как я ушла, прошло уже некоторое время. Можно сказать, мне... любопытно."
51110-259 = "Я хотела бы узнать больше о других членах Хяккарёран, если можно."
51110-261 = "Поскольку Юкари не просила меня держать что-либо в секрете, я в общих чертах рассказала ей о том, что произошло с остальными студентами Хяккарёран."
51110-263 = "Значит, Поединок за преемство..."
51110-264 = "Понятно. Значит, пока меня не было, ситуация ухудшилась настолько, что..."
51110-265 = "Как всё могло развалиться до такой степени..."
51110-266 = "...Нет. Я не имею права задавать этот вопрос."
51110-267 = "[s] «В нынешнем состоянии клуб не может продолжать существовать. По крайней мере, уверен, именно так чувствует Юкари.»"
51110-268 = "Верно. Юкари..."
51110-270 = "Жилой район Хяккияко"
51110-273 = "Дальше достаточно."
51110-274 = "Благодарю, что проводили меня, Сенсей из Шале."
51110-275 = "Что ж..."
51110-276 = "[s] «Ты совсем не собираешься возвращаться в Хяккарёран?»"
51110-277 = ""
51110-279 = ""
51110-280 = "Устроить внезапный допрос прямо в момент прощания, рассчитывая, что сердце собеседника смягчилось от проявленной к нему доброты..."
51110-281 = "Задать такой вопрос именно сейчас, когда отказ отвечать выглядел бы крайней невежливостью..."
51110-282 = "Вы куда хитрее, чем я ожидала, Сенсей."
51110-283 = "...Но да. Мне стало ясно, что возвращение было бы ужасной ошибкой."
51110-284 = "[s] «Потому что ты больше не член клуба?»"
51110-285 = "...Да."
51110-286 = "Я пыталась... вернуть кое-что важное, и остальные никогда меня за это не простят."
51110-287 = "Боюсь, моё сердце не настолько бесстыдно..."
51110-288 = "И не настолько сильно, чтобы снова вынести эту боль."
51110-289 = "Я... не имею права."
51110-290 = "В конце концов, я не она."
51110-293 = ""
51110-295 = "Я уже достаточно разочаровала остальных."
51110-296 = "Именно поэтому я никогда не смогу вернуться..."
51110-297 = ""
