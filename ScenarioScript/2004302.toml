[translation]
2004302-1 = "Приключения высокой кухни"
2004302-3 = ""
2004302-4 = "А, Сенсей! Сюда, я здесь!"
2004302-5 = "[s] «Привет, Изуми! Как обычно, сегодня ты в отличном настроении!»"
2004302-6 = "Ага! Новый год, новый наряд, и я вижусь с вами, Сенсей!"
2004302-7 = "Конечно я в отличном настроении!"
2004302-8 = ""
2004302-10 = ""
2004302-11 = ""
2004302-12 = "Изуми внезапно бросилась мне в объятия."
2004302-13 = "[ns] «Ого, Изуми. Ты сегодня очень возбуждённая.»"
2004302-14 = "Ага! А ещё я нашла новое сочетание продуктов!"
2004302-15 = ""
2004302-17 = ""
2004302-18 = "[ns] «...Выглядит немного страшно. Что это...?»"
2004302-19 = "Это? Смотрите внимательно, Сенсей! Это..."
2004302-20 = "«Мятно-шоколадные такояки с сардинами и лимоном». Я сама придумала, как эксперимент!"
2004302-21 = "[s] «Мятно... что?»"
2004302-22 = "«Мятно-шоколадные такояки с сардинами и лимоном»! Видите ли, эм..."
2004302-23 = "...и такояки, и сардины сами по себе очень вкусные, но если есть их вместе, получается немного рыбный привкус."
2004302-24 = "Поэтому я подумала..."
2004302-25 = "...если добавить лимон и полить сверху мятно-шоколадным соусом, то свежий вкус лимона..."
2004302-26 = "...и вкус мятного шоколада перекроют рыбный запах!"
2004302-27 = "И вот, та-дам! Видите? Рыбой вообще не отдаёт!"
2004302-28 = "[s1] «Ну ещё бы, если есть ЭТО так!»\n[s2] «Спорю, теперь вкус вообще совсем другой!»"
2004302-31 = "Правда? Правда? Классно, когда всё получается по плану, да?"
2004302-32 = "Хотите узнать, зачем я вообще пыталась есть сардины и такояки одновременно?"
2004302-33 = ""
2004302-35 = ""
2004302-36 = "Ну потому что и то и другое вкусное, конечно! Если к вкусной еде добавить ещё одну вкусную еду, вкусность умножится, верно?"
2004302-37 = "[s] «Ты всегда пробуешь что-нибудь новое, Изуми...»"
2004302-38 = "Хм? Ага, конечно. Я же не просто так состою в Обществе гурманов!"
2004302-39 = "Это прямо в названии! Мы исследуем еду!"
2004302-40 = "Наша миссия — прокладывать путь к тому, как есть еду ещё вкуснее и необычнее!"
2004302-41 = "...По крайней мере, так мне сказала Харуна."
2004302-42 = "Но вообще у каждого члена Общества свои цели и методы."
2004302-43 = "Например, Харуна всегда хочет сохранить исходный вкус."
2004302-44 = "Но при этом она учитывает и другие элементы, которые могут освежить впечатления."
2004302-45 = "Акари больше всего заботит чувство насыщения, а это, думаю, значит размер порций!"
2004302-46 = "А, но ей всё равно важно, чтобы еда выглядела вкусно, иначе она не сможет съесть так много."
2004302-47 = "Что касается Джунко... эм..."
2004302-48 = "Ну, она в основном старается устроить всё так, чтобы ей никто не мешал спокойно поесть!"
2004302-49 = "А я в основном пытаюсь открывать новые вкусы!"
2004302-50 = "[s] «Понятно. Значит, у каждого свои цели.»"
2004302-51 = "Ага! Мы, конечно, доверяем вкусам друг друга и пробуем блюда друг друга, но..."
2004302-52 = "Я хочу найти что-нибудь новое."
2004302-53 = "В каком-то смысле в этом и есть жизнь, правда?"
2004302-54 = "Я знаю, у меня необычные вкусы. Но исследовать вкус — это ведь и значит изучать самую суть высокой кухни, разве нет?"
2004302-55 = "[s] «Пожалуй. Ты превращаешь еду в настоящее приключение.»"
2004302-56 = "Приключение...?"
2004302-57 = ""
2004302-59 = ""
2004302-60 = ""
2004302-61 = "Идеально! Ага, Сенсей! Вот поэтому вы мне так нравитесь!"
2004302-62 = "Раз уж мы так на это посмотрели, как насчёт..."
2004302-63 = "...отправиться со мной в новое гастрономическое приключение?"
2004302-64 = ""
2004302-67 = "Меня из прошлого окатило дурным предчувствием..."
2004302-68 = "...но я не смог устоять перед её сияющей улыбкой и кивнул."
2004302-69 = "Хорошо, Сенсей! Тогда... давайте попробуем эти мятно-шоколадные такояки с сардинами и лимоном!"
2004302-70 = ""
2004302-74 = "С вот этими хлопьями!"
2004302-75 = "Какими хлопьями, спрашиваете? Это «порошок из солёных лакричных конфет»!"
2004302-76 = "[s3] «И... что это вообще такое?»\n[s4] «На что это похоже по вкусу?»"
2004302-79 = "О, это не просто обычные солёные лакричные конфеты!"
2004302-80 = "В лакрице есть... аммоний? Хлорид? Что-то такое!"
2004302-81 = "[s] «...Ты уверена, что это вообще безопасно есть...?»"
2004302-82 = "Конечно! Забавный факт: раньше такие конфеты использовали как лекарство от кашля!"
2004302-83 = "Так что они МОГУТ быть даже полезны для здоровья, знаете?"
2004302-84 = "Вот, попробуйте одну, Сенсей!"
2004302-85 = ""
2004302-89 = "В итоге я попробовал конфету, которую она мне дала."
2004302-90 = "Это была странная маленькая конфета в форме чёрного ромба..."
2004302-91 = "[ns] «...А?»"
2004302-92 = ""
2004302-94 = "Ну как, Сенсей? Как?"
2004302-95 = "Хм? Вкус сладкий, но совсем не такой, как у обычной сладости..."
2004302-96 = "...и солёный, но не как обычная соль?"
2004302-97 = "Сладко и солёно одновременно, но почему-то это невозможно нормально объяснить?"
2004302-98 = "Ага! Именно такой у неё вкус! Вот такие это конфеты!"
2004302-99 = "Ударный привкус идёт не от обычной соли. Он от... аммония или хлорида, или чего там!"
2004302-100 = "А теперь, если посыпать этим порошком такояки..."
2004302-101 = ""
2004302-103 = ""
2004302-104 = ""
2004302-105 = "*ням* *ням*"
2004302-106 = ""
2004302-108 = ""
2004302-109 = "Ого! ВОТ это вкус, Сенсей!"
2004302-110 = "[ns] «Д-да уж...»"
2004302-112 = "После этого Изуми продолжила посыпать своими особыми специями разную еду из уличных лавок."
2004302-113 = "А я в итоге пообещал когда-нибудь снова отправиться с ней в гастрономическое приключение..."
