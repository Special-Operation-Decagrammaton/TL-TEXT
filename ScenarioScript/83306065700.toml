[translation]
83306065700-5 = ""
83306065700-6 = "Похоже, слухи были правдой. Здесь и правда есть кошка."
83306065700-7 = "Наверное, проголодалась... Думаю, пришла сюда на запах нашей еды..."
83306065700-8 = "Фуука... Кошка..."
83306065700-9 = "Не дуйся, Джури. Если эта кошка пришла сюда в надежде получить еду от Клуба школьных обедов... мы не можем оставить её голодной."
83306065700-10 = "Покормим её, а потом я найду кого-нибудь, кто сможет забрать её к себе."
83306065700-11 = "Ты необычный посетитель, маленькая, но голод бывает у всех."
83306065700-12 = "Спасибо, Фуука...! Тогда пока я за ней присмотрю!"
83306065700-13 = "Хорошо. Спасибо вам обеим."
