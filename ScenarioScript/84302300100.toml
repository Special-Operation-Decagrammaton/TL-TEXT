[translation]
84302300100-5 = "Рио получила краткий отчёт о том, что произошло в Центре данных."
84302300100-6 = ""
84302300100-8 = "...Понятно."
84302300100-9 = "Хорошо. Ясно. Звучит тяжело."
84302300100-10 = "Не то чтобы я сама этого хотела. Если бы этот чёртов коммуникатор не отрубился..."
84302300100-11 = "Ты отлично справилась. Ты определённо была подходящим человеком для этой работы."
84302300100-12 = ""
84302300100-14 = ""
84302300100-15 = "Это что, лесть? От тебя?"
84302300100-16 = "Я серьёзно."
84302300100-18 = "Ты столкнулась с неожиданной переменной и сразу адаптировалась. Как и ожидалось от лидера C&C."
84302300100-19 = "Эй-эй. Хватит. На меня комплименты не действуют. В общем, задание выполнено... вроде бы. Дальше справишься?"
84302300100-20 = "Конечно. Благодаря тебе я без проблем вижу потоки данных по всему Миллениум. Дальше уже моя работа."
84302300100-21 = "...Прежде чем продолжим, у тебя есть какие-то сомнения насчёт Коюки?"
84302300100-22 = "Я ведь связалась с Семинар и рассказала им всё об изменении данных и прочем..."
84302300100-23 = "...но если подумать, это не нарушает твоё обещание?"
84302300100-24 = ""
84302300100-26 = ""
84302300100-27 = "Хм? О чём ты? Я в точности выполнила обещание."
84302300100-28 = "«Нельзя рассказывать Юке или Ноа»."
84302300100-29 = "И я ни одной из них ничего не сказала."
84302300100-30 = ""
84302300100-32 = ""
84302300100-33 = "Понятно. Значит, технически это не ложь."
84302300100-34 = "Но ты не могла оставить изменённые данные Семинар как есть, поэтому рассказала Рио, а она уже передала информацию Семинар..."
84302300100-35 = "Не переживай. Если её поймают, она может сдать и меня, но она на удивление скользкая."
84302300100-36 = "Она сможет убегать от них как минимум день. А к тому времени мы уже закончим."
84302300100-37 = "Однако..."
84302300100-38 = ""
84302300100-42 = ""
84302300100-43 = "А, вот и оно."
84302300100-46 = "«Непростительно...! Я никогда тебя не прощу, Нэру!!»"
84302300100-47 = "«Мои проклятия будут эхом разноситься по пещерам Ада!!»"
84302300100-48 = ""
84302300100-50 = ""
84302300100-51 = "Хаха. Ну, мы знали, что так и будет."
84302300100-52 = "Надо ответить."
84302300100-53 = "«Это... не я... рассказала... так что я... не нарушила... обещание»."
84302300100-54 = "Отправлено."
84302300100-55 = ""
84302300100-59 = "«Чума на весь Миллениум!!»"
84302300100-60 = "Ну что, мы будем двигаться дальше или как?"
84302300100-61 = "А, да... Сейчас подготовлю брифинг."
84302300100-62 = "Микамо Нэру..."
84302300100-63 = "Опытный и основательный лидер C&C..."
84302300100-65 = "...и ужасный человек, если оказался у неё во врагах."
