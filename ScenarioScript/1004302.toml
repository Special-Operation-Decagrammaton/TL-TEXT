[translation]
1004302-1 = "Потому что это для тебя"
1004302-2 = "Была середина лета, и Шале был завален разными делами."
1004302-6 = "[ns] «В это время года особенно много работы из-за фестивалей...»"
1004302-7 = ""
1004302-10 = "Сотрудничество с жителями при подготовке местного фестиваля фейерверков, общие приготовления, проверка безопасности оборудования для фестиваля и так далее... Делам не было конца."
1004302-11 = "Я пытался упорядочить все задачи, порученные Шале."
1004302-12 = ""
1004302-15 = "[ns1] «Хм, уже обед...»\n[ns2] «Надо заказать еду с собой.»"
1004302-22 = "[ns] «У входа что-то происходит...»"
1004302-23 = ""
1004302-24 = "Кто вообще ходит в купальнике посреди улицы? Ого."
1004302-25 = "Может, там что-то снимают?"
1004302-26 = "Но камеры не видно... Кстати, разве это не прямо перед офисом Шале?"
1004302-27 = "Не может быть... Сенсей из Шале попросил её так одеться?"
1004302-28 = "Ого, ого... С ними явно что-то не так."
1004302-29 = "[s3] «Это недоразумение!»\n[s4] «Эй, что здесь делает Вакамо?!»"
1004302-30 = ""
1004302-31 = ""
1004302-33 = ""
1004302-34 = "О, Сенсей...!"
1004302-35 = ""
1004302-37 = ""
1004302-39 = ""
1004302-41 = "Хи-хи-хи. Я вас ждала."
1004302-42 = "[s5] «Нельзя просто прийти сюда в купальнике!»\n[s6] «Я чем-то тебя обидел, Вакамо?!»"
1004302-43 = "А?"
1004302-44 = "А?"
1004302-45 = "Нет, я просто..."
1004302-46 = "Лето достигло пика жары, и мои чувства стали сильнее, чем когда-либо."
1004302-47 = "Я услышала, что вы весь день и всю ночь сидите в офисе, и подумала, что должна что-нибудь сделать..."
1004302-48 = "[s] «Что значит „должна что-нибудь сделать“?»"
1004302-49 = "Это первое лето, которое мы проводим вместе..."
1004302-50 = "Это очень особенное время, и я не могу вынести мысли, что вы тратите его впустую, сидя один в офисе."
1004302-51 = "Время ограничено. Когда сезон закончится, придётся ждать ещё целый год, пока он вернётся."
1004302-52 = ""
1004302-54 = ""
1004302-55 = "Конечно, ожидание следующего лета тоже может быть частью удовольствия, но..."
1004302-56 = "Но если я могу хоть что-то сделать, чтобы достучаться до вас..."
1004302-57 = "Я обязана хотя бы попытаться!"
1004302-58 = "Я хочу, чтобы каждый миг, проведённый нами вместе, сиял."
1004302-59 = "Я хочу, чтобы сегодняшний день стал идеальным и навсегда остался в вашей памяти."
1004302-60 = "Поэтому я и вышла сюда в таком виде, хотя мне немного неловко."
1004302-61 = "[s] «Причина, по которой ты в купальнике...»"
1004302-62 = "Хи-хи-хи, да! Я хотела подарить вам незабываемое летнее воспоминание!"
1004302-63 = "[s] «Незабываемое летнее воспоминание...»"
1004302-64 = "Ну как? Разве это не идеально, чтобы запомнить именно это лето?"
1004302-65 = "Я долго выбирала, потому что хотела убедиться, что вам понравится. Пожалуйста, скажите, что думаете."
1004302-66 = "[s] «О, да. Понимаю. Очень красиво. Тебе идёт.»"
1004302-67 = ""
1004302-69 = ""
1004302-70 = "Ух...?!"
1004302-71 = "[s] «...Вакамо?»"
1004302-72 = "К-Комплимент, который вы сказали... таким сладким голосом."
1004302-73 = "О, это плохо. Когда я слышу такое от вас, мне почти невозможно себя сдерживать..."
1004302-74 = ""
1004302-77 = "Неужели Сенсею из Шале и правда нравится такое?"
1004302-78 = "О боже. Как неприлично."
1004302-79 = "[s7] «Я же говорю, это недоразумение!»\n[s8] «Вакамо! Уходим отсюда!»"
1004302-80 = "А? Ого, х-хорошо..."
1004302-81 = "А? Ого, х-хорошо..."
1004302-82 = ""
1004302-84 = ""
1004302-87 = "Пока всё не стало ещё хуже, я отступил вместе с Вакамо в комнату отдыха Шале."
1004302-88 = ""
1004302-94 = ""
1004302-95 = "Вы так поспешно затащили меня в офис Шале с таким паническим выражением..."
1004302-96 = ""
1004302-98 = ""
1004302-100 = ""
1004302-101 = "Мне хочется снять маску и любоваться вашим лицом сбоку..."
1004302-102 = "Хи-хи-хи... Может, я позволяю себе быть уязвимой, потому что вы меня понимаете..."
1004302-103 = "[s] «Да. Совершенно ясно, что ты думаешь обо мне слишком много и слишком по-разному.»"
1004302-104 = "О, правда? Я так рада..."
1004302-105 = ""
1004302-107 = ""
1004302-108 = ""
1004302-110 = "Хорошо. Что теперь будем делать, Сенсей?"
1004302-111 = "Чтобы создать наше идеальное летнее воспоминание — чем займёмся?"
1004302-112 = "Я готова выполнить любую просьбу, лишь бы сделать вас счастливым."
1004302-113 = "[s] «О, просьбу...»"
1004302-114 = "Да. Конечно... я могла бы заранее подготовить что-нибудь для вашего удобства, но..."
1004302-115 = "Но, подумав, я не была уверена, что это гарантирует идеальное летнее воспоминание..."
1004302-116 = "Раз уж мы здесь вместе, я хочу убедиться, что у вас будет по-настоящему идеальный день."
1004302-117 = "О... Простите... Я недостаточно хороша для вас, да...?"
1004302-118 = "Простите, Сенсей..."
1004302-119 = "[s9] «Нет, всё нормально! Спасибо, что так обо мне заботишься!»\n[s10] «(Какие же безумные планы придумывает Вакамо!)»"
1004302-120 = "Я рада это слышать. Хи-хи."
1004302-121 = "О? Вы на самом деле рады, что я здесь? Я вижу по вашему лицу!"
1004302-122 = "Хорошо, говорите что угодно. Что вы хотите сделать?"
1004302-123 = "[s] «Идеальное летнее воспоминание... Думаю, можно поесть колотый лёд?»"
1004302-124 = "Колотый лёд...?"
1004302-125 = "Хм, понятно."
1004302-126 = "Действительно... колотый лёд... Летнее лакомство, которым мы можем насладиться вместе."
1004302-127 = "Мы будем кормить друг друга. Когда лёд коснётся наших губ, сладость и ледяная боль в голове захлестнут наши чувства."
1004302-128 = "А когда я скорчу лицо от ледяной боли, вы улыбнётесь и пошутите надо мной. Хи-хи-хи..."
1004302-129 = "[s11] «Я представлял это немного иначе...» \n[s12] «(Она ушла в фантазии...)»"
1004302-130 = "Хорошо. По дороге сюда я увидела идеальное место."
1004302-131 = "Хорошо. По дороге сюда я увидела идеальное место."
1004302-132 = "[s] «О, ты видела какой-то знаменитый магазин колотого льда?»"
1004302-133 = "Хи-хи, нет. По дороге сюда я увидела вот это."
1004302-134 = ""
1004302-136 = ""
1004302-137 = "Вакамо улыбнулась и показала мне телефон. Неподалёку проходило мероприятие."
1004302-138 = "Оно называлось..."
1004302-139 = "[s] «Летняя специальная выставка ледяных скульптур Красной Зимы?»"
1004302-140 = "Да. Я видела, что академия Красная Зима выставляет всевозможные особые ледяные скульптуры."
1004302-141 = "Говорят, самая знаменитая скульптура выражает достоинство усов..."
1004302-142 = "[s] «Эм, но при чём здесь колотый лёд?»"
1004302-143 = "Говорят, скульптуры сделаны из натурального льда, который не тает даже в пик лета."
1004302-144 = "Поэтому, если мы тайком заберём лёд и сделаем из него колотый лёд..."
1004302-145 = "Получится особенный десерт, который сделает ваш день идеальным!"
1004302-146 = "[s] «Стой, стой! Ладно, забудем про колотый лёд, Вакамо!»"
1004302-147 = "А? Это плохая идея?"
1004302-148 = "Лёд от скульптуры недостаточно чистый, чтобы его есть?"
1004302-149 = "О... Да... Вы правы."
1004302-150 = "Я так сосредоточилась на том, чтобы сделать вас счастливым, что упустила такую важную деталь. Простите..."
1004302-151 = "[s] «Не извиняйся. Как насчёт плавания?»"
1004302-152 = "Плавания..."
1004302-153 = "Это очевидно самое популярное летнее занятие. И я уже одета по случаю."
1004302-154 = "У Шале есть надувной бассейн или что-нибудь такое? Не припомню..."
1004302-155 = "Где мы можем поплавать?"
1004302-156 = ""
1004302-158 = ""
1004302-159 = "О, понимаю. Вы имели в виду что-то другое..."
1004302-160 = "Теперь всё понятно."
1004302-161 = "[s] «Нет, я не имел в виду ничего другого! Что значит „понятно“?!»"
1004302-162 = "Хи-хи-хи... Иногда вы так озорно надо мной подшучиваете."
1004302-163 = "Вы испытываете меня даже сейчас?"
1004302-164 = "Даже эта ваша сторона кажется мне милой... О! Мне пришла гениальная идея."
1004302-165 = "На крыше этого здания ведь есть резервуар с водой?"
1004302-166 = "[s] «Да, но при чём тут...?»"
1004302-167 = "Если мы его взорвём, всё здание затопит водой..."
1004302-168 = "И очень скоро у нас появится место для плавания. Именно на это вы намекали, верно?"
1004302-169 = "[s13] «Прости, что разочарую, но... нет.»\n[s14] «Я вообще не это имел в виду! Этот план тоже забудь! Отмена!»"
1004302-172 = "О, правда...?"
1004302-173 = "Это сложно..."
1004302-175 = "После этого мы с Вакамо продолжили обсуждать, как создать идеальное летнее воспоминание..."
1004302-178 = "Смотреть на светлячков... То есть вы хотите видеть огонь в темноте..."
1004302-179 = "Хи-хи-хи. Больше ни слова. Я могу превратить всё это место в море огня."
1004302-180 = ""
1004302-182 = ""
1004302-183 = "Для меня это легко!"
1004302-184 = "А? Вы этого не хотите?!"
1004302-185 = "Но если вы хотите..."
1004302-186 = "Я могу уничтожить всё!"
1004302-187 = "Нет? И это тоже не то?"
1004302-190 = "Ох, как сложно. Я не знаю, что делать."
1004302-191 = "Наверное, ваша мечта об идеальном лете со мной требует чего-то ещё более глубокого..."
1004302-192 = "Моё сердце переполнено счастьем..."
1004302-193 = "О, мои чувства разливаются повсюду!"
1004302-194 = "[s] «Л-Ладно! Хорошо...!»"
1004302-195 = "Что бы я ей ни говорил, в итоге оказался окружён образными минами. Я усиленно думал, что делать."
1004302-196 = ""
1004302-200 = "И тут мне пришла идея."
1004302-201 = "[s] «Точно, Вакамо. Есть кое-что, что я хочу сделать с тобой этим летом!»"
1004302-202 = "Хм?"
1004302-206 = "Это здесь вы работаете?"
1004302-207 = "Вы хотите провести время со мной здесь...?"
1004302-208 = ""
1004302-210 = ""
1004302-211 = "...О!"
1004302-212 = "Хи-хи-хи. Понятно... Здесь никто не сможет отвлекать нас друг от друга..."
1004302-213 = "Да! Я готова ко всему."
1004302-214 = "Хорошо, что именно? Что вы хотите сделать со мной?"
1004302-215 = ""
1004302-217 = ""
1004302-218 = ""
1004302-220 = "Дорогой!"
1004302-221 = "Я придумал отчаянный план, чтобы удержать Вакамо на одном месте и не дать ей носиться снаружи, выворачивая мои слова."
1004302-224 = "[ns] «Давай вместе завалим себя работой в этот летний день!»"
1004302-225 = ""
1004302-227 = ""
1004302-228 = "Простите?"
1004302-229 = "[s15] «Знаешь, лучшие друзья летом именно так и делают. Работают вместе.»\n[s16] «У меня накопилось много работы, и я подумал, что мы могли бы заняться ей вдвоём.»"
1004302-232 = "А? Эм, это..."
1004302-233 = "Вы уверены, что этого достаточно?"
1004302-234 = "Это станет идеальным воспоминанием вашего особенного лета?"
1004302-235 = "[s] «Конечно. Главное, что мы проводим время вместе!»"
1004302-236 = ""
1004302-238 = ""
1004302-239 = "Проводим... время вместе... Только мы вдвоём..."
1004302-240 = "Х-Хорошо! Е-Е-Если вы так говорите...!"
1004302-241 = ""
1004302-243 = ""
1004302-244 = ""
1004302-246 = "Хи-хи-хи! ♡"
1004302-248 = "Вот так я и провёл с Вакамо очень... особенный день."
