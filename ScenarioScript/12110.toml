[translation]
12110-1 = "Episódio 11;Uma Batalha Perdida"
12110-2 = "(Risc, risc...)"
12110-3 = "Chefe, hum... até quando exatamente eu preciso continuar escrevendo isso...?"
12110-4 = "...Você deve estar por volta da página 200 agora. Não foi você mesma quem disse que ia escrever 1000 páginas?"
12110-5 = "Isso foi, bem, uma figura de linguagem para expressar o quanto estou arrependida..."
12110-6 = "Mexa mais a mão e menos a boca."
12110-7 = "V-Vou me esforçar..."
12110-8 = "(Risc, risc...)"
12110-9 = "A propósito..."
12110-12 = "Aquela tal de Hoshino de Abydos... a senhora a conhece?"
12110-13 = "Não, foi a primeira vez que a encontrei pessoalmente."
12110-14 = "Entendo. É que, de certa forma, pareceu que a senhora falava dela como alguém que conhece bem..."
12110-15 = "..."
12110-16 = "...Takanashi Hoshino."
12110-17 = "Uma verdadeira elite, chamada de \"gênio\". Na análise do Departamento de Inteligência de dois anos atrás, ela foi listada como uma das ameaças em potencial para Gehenna."
12110-18 = "Nossa... Ela não me passou essa impressão de jeito nenhum..."
12110-21 = "Ela tinha um ar bem... digamos, tranquilo e descontraído..."
12110-23 = "Ako, não se deve julgar alguém pela aparência."
12110-24 = "...Mas, de fato, o ar dela estava bem diferente de dois anos atrás."
12110-25 = "Originalmente, ela era um tipo bem combativo, especialista em táticas ofensivas... dava uma impressão áspera e afiada."
12110-26 = "...Bem, deixando isso de lado."
12110-27 = "Se tivéssemos continuado a lutar naquela hora, com certeza a maioria do Comitê Disciplinar teria ficado fora de combate. Tudo por causa da sua precipitação, Ako."
12110-28 = "Além disso, a \"Schale\" também estava lá. Os danos poderiam ter sido ainda mais graves."
12110-29 = "Eu tinha certeza de que havia analisado bem o poderio deles, mas esse tipo de informação..."
12110-30 = "...Bem. De um dia para o outro, os relatórios de atividade dela simplesmente pararam."
12110-31 = "Afinal, é uma escola pequena, então talvez o Departamento de Inteligência tenha deixado de considerá-la uma ameaça no meio do caminho."
12110-32 = "Se quiser saber os detalhes, dê uma olhada nos arquivos antigos do Departamento de Inteligência."
12110-36 = "Mesmo assim, Takanashi Hoshino... continuar em Abydos até hoje sem ir embora..."
12110-37 = "Por que será...?"
12110-39 = "O credor de quem Abydos pegou o empréstimo..."
12110-40 = "D-Da Kaiser Corporation..."
12110-42 = "Para me apresentar corretamente, sou membro do conselho da Kaiser Corporation, da Kaiser Loans e da Kaiser Construction."
12110-43 = "Atualmente, também atuo como diretor-presidente da Kaiser PMC."
12110-44 = "Isso não importa, mas em resumo, você é o responsável por enganar e explorar o Colégio Abydos, certo?"
12110-45 = "...Oh."
12110-46 = "Isso mesmo! É você o culpado que mandou a Gangue dos Capacetes e a Faz-Tudo atrás da gente e ficou nos atormentando esse tempo todo, não é?!"
12110-47 = "Hmm...?"
12110-48 = "Por sua culpa, nós... Abydos...!!"
12110-49 = "Ora, ora... E essas são as primeiras palavras que saem da sua boca?"
12110-50 = "Depois de invadirem uma propriedade privada sem permissão, atacarem os bons funcionários da nossa PMC e destruírem as instalações desse jeito..."
12110-51 = "...Hehe, interessante."
12110-53 = "Mas é melhor tomarem cuidado com o jeito como falam. Este é um local onde a Kaiser PMC opera legalmente. Antes de mais nada, vocês deveriam entender que estão invadindo ilegalmente a propriedade privada de uma empresa."
12110-54 = "...!"
12110-55 = "...Ngh!"
12110-56 = "Bem, voltando ao assunto... As terras do Distrito Autônomo de Abydos? Sim, de fato nós as compramos."
12110-57 = "E daí? Tudo foi feito através de transações legais, e todos os registros estão devidamente arquivados."
12110-58 = "Poderiam parar de falar como se estivéssemos cometendo algum ato ilegal? Não vieram até aqui só para provocar, vieram?"
12110-59 = "Vieram até aqui porque ficaram curiosas sobre o que estamos fazendo? Querem saber o motivo de termos comprado as terras de Abydos?"
12110-60 = "Pois então eu lhes digo: estamos procurando um tesouro que dizem estar enterrado em algum lugar de Abydos."
12110-61 = "...!"
12110-62 = "...Quem acreditaria numa mentira dessas?!"
12110-63 = "É verdade. Se fosse isso, não explicaria o poderio militar desta PMC."
12110-64 = "Essas tropas são para ocupar nosso distrito autônomo à força. Não é?"
12110-67 = "..."
12110-68 = "Centenas de tanques, centenas de soldados de elite. Centenas de toneladas de pólvora e munição."
12110-69 = "Acham mesmo que prepararíamos tudo isso para uma escola com apenas cinco alunas?"
12110-70 = "Não me façam rir. Isso é apenas para o caso de algum grupo tentar atrapalhar nossa caça ao tesouro. Nada mais que isso; não foi preparado para vocês."
12110-71 = "Com gente do nível de vocês, podemos fazer o que quisermos, quando quisermos... Por exemplo, assim."
12110-73 = "...Sou eu... Sim, prossiga."
12110-74 = "O-O quê...? Uma ligação do nada... E o que quer dizer com \"prosseguir\"?"
12110-75 = "Tenho uma má notícia. Parece que a classificação de crédito da escola de vocês acabou de despencar."
12110-78 = "(Triiim-triiim)"
12110-79 = "...?"
12110-81 = "Aqui é da Kaiser Loans. A partir deste momento, estaremos rebaixando a avaliação de crédito de Abydos para o nível mínimo."
12110-82 = "!?"
12110-83 = "Ajustamos a taxa de juros variável com um aumento de 3000%. Aplicando todos os encargos, o valor dos juros a partir do próximo mês será de 91,3 milhões de ienes."
12110-84 = "Contamos com a continuação dos seus pagamentos dentro do prazo."
12110-85 = "Oi?! E-Espera, por que isso tão de repente...?!"
12110-87 = "N-Noventa milhões de ienes?!"
12110-88 = "...Hehehe."
12110-89 = "Agora entenderam? Nas mãos de quem está a corda amarrada no pescoço de vocês."
12110-90 = "...!"
12110-91 = "Ei, só pode ser mentira, né?! Você tá falando sério?!"
12110-92 = "..."
12110-93 = "Ah, estou falando muito sério. Mas só isso não teria muita graça..."
12110-94 = "Já sei, vamos cobrar um depósito caução pela dívida de 900 milhões de ienes. Que tal depositarem 300 milhões de ienes na nossa Kaiser Loans dentro de uma semana?"
12110-95 = "Afinal, precisam provar que conseguem pagar a dívida mesmo com essa taxa de juros."
12110-96 = "Não pode ser...!"
12110-97 = "...Ngh."
12110-98 = "Não tem como arranjarmos tanto dinheiro assim... Já estamos no limite só para pagar os juros atuais..."
12110-100 = "Então por que não desistem da escola e vão embora?"
12110-101 = "!!"
12110-102 = "Basta pedir transferência ou abandonar a escola por conta própria. Isso resolveria tudo; afinal, a dívida nem é de vocês pessoalmente."
12110-103 = "É uma dívida pela qual a escola deve se responsabilizar. Não há motivo algum para vocês se voluntariarem a carregar esse fardo, não acham?"
12110-104 = "N-Nós jamais poderíamos fazer uma coisa dessas!"
12110-105 = "Isso mesmo, é a nossa escola!! Não tem como a gente abandoná-la!"
12110-106 = "Abydos é a nossa escola e a nossa cidade."
12110-108 = "E então, o que vão fazer? Têm alguma outra boa ideia?"
12110-109 = "...Pessoal, vamos embora."
12110-110 = "Hoshino-senpai...?!"
12110-111 = "...Não adianta nada ficar discutindo aqui, ele só está brincando com a gente."
12110-112 = "Oh... Vice-presidente do Conselho Estudantil, você realmente parece ser esperta."
12110-113 = "...Ah, agora me lembrei. Também me lembro daquela presidente do Conselho Estudantil completamente idiota que vivia andando com você, que parece tão esperta."
12110-114 = "..."
12110-115 = "Pois bem, conto com o depósito caução e os pagamentos a partir do próximo mês. Caras clientes."
12110-116 = "Huhu, huhahahahaha...!!"
12110-117 = "Até que foi um tempo nada mal. Vamos, acompanhem nossas clientes até a entrada."
12110-122 = "..."
12110-124 = "Próximo;Alguns Segredos"
