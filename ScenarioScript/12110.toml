[translation]
12110-1 = "Эпизод 11;Проигранная битва"
12110-2 = "*шурх* *шурх*"
12110-3 = "Президент... сколько нам ещё писать?"
12110-4 = "Ты только на двухсотой странице. Разве не ты сказала, что напишешь тысячу?"
12110-5 = "Это было просто выражение! Я не думала, что ты реально заставишь меня писать тысячу страниц..."
12110-6 = "Хватит разговоров."
12110-7 = "А-Ахаха... Хорошо, продолжу..."
12110-8 = "*шурх* *шурх*"
12110-9 = "Кстати..."
12110-10 = ""
12110-11 = ""
12110-12 = "Насчёт Хошино из Абидоса — ты её знаешь?"
12110-13 = "...Нет. Сегодня я впервые увидела её лично."
12110-14 = "Понятно... Ты говорила так, будто хорошо её знаешь..."
12110-15 = "..."
12110-16 = "...Таканаши Хошино."
12110-17 = "Сверхэлитный студент, которого хвалили как гения. Два года назад Разведывательный комитет отметил её как потенциальную угрозу Геенне."
12110-18 = "Правда? Она совсем не выглядела такой!"
12110-20 = ""
12110-21 = "Казалась такой расслабленной..."
12110-23 = "Нельзя судить людей по внешности, Ако."
12110-24 = "...Но сейчас она совсем не такая, какой была два года назад."
12110-25 = "Раньше она была куда агрессивнее и жестче... Очень сильная и острая."
12110-26 = "...Ну, неважно."
12110-27 = "Если бы мы сражались с той её версией, Префектурная команда была бы уничтожена из-за твоих поспешных действий, Ако."
12110-28 = "А с Шале там ущерб мог быть ещё хуже."
12110-29 = "Н-Но разведданные были надёжные... Мы всё проанализировали..."
12110-30 = "Потому что они надолго прекратили деятельность."
12110-31 = "Школа настолько маленькая, что Разведывательный комитет, видимо, решил: угрозы больше нет."
12110-32 = "Если хочешь подробностей, Ако, придётся копаться в старых файлах Разведывательного комитета."
12110-36 = "Значит, ты всё-таки не покинула Абидос... Таканаши Хошино."
12110-37 = "Почему...?"
12110-39 = "Кредитор Абидоса..."
12110-40 = "...из корпорации Кайзер."
12110-41 = ""
12110-42 = "А, пожалуй, стоит представиться как следует. Я старший руководитель корпорации Кайзер, Кайзер Кредит и Кайзер Construction."
12110-43 = "А сейчас ещё и генеральный директор ЧВК Кайзер."
12110-44 = "Хватит. Мы знаем, что именно ты эксплуатировал нашу школу."
12110-45 = "...А?"
12110-46 = "Точно! Ты тот, кто нанял Банду шлемов и Решатели проблем 68 напасть на нас! Да?!"
12110-47 = "Хм?"
12110-48 = "Это из-за тебя Абидос... из-за тебя Абидос..."
12110-49 = "Боже-боже... Какие голословные обвинения."
12110-50 = "Вы вторгаетесь на частную территорию, нападаете на моих ни в чём не виноватых сотрудников PMC, разрушаете наши объекты — и после этого обвиняете МЕНЯ?"
12110-51 = "...Ха. Хахахаха. Вот это комедия."
12110-52 = ""
12110-53 = "Скажу прямо. Это законное место деятельности ЧВК Кайзер, а вы вторглись на частную собственность."
12110-54 = "...!"
12110-55 = "...!"
12110-56 = "Ах да. Район Абидоса. Конечно, мы купили землю."
12110-57 = "Каждый этап сделки был законным. У нас есть бухгалтерские книги и записи, которые это доказывают."
12110-58 = "Мне крайне неприятно, что вы ведёте себя так, будто мы совершаем преступление."
12110-59 = "Интересно, что мы здесь делаем? Зачем купили вашу драгоценную землю?"
12110-60 = "Хорошо. Скажу. Мы ищем сокровище, погребённое где-то в Абидосе."
12110-61 = "...!"
12110-62 = "...Наглая ложь!"
12110-63 = "Да. Тогда как объяснить всех этих солдат PMC?"
12110-64 = "Разве они не здесь, чтобы силой забрать наш район?"
12110-65 = ""
12110-67 = "..."
12110-68 = "Сотни танков, сотни элитных солдат. Неисчислимые тонны пороха и боеприпасов."
12110-69 = "Вы правда думаете, что мы подготовили всё это ради школы, где осталось всего пять студентов? Не смешите."
12110-70 = "Это лишь защита от тех, кто может помешать нашим поискам сокровища. Она не предназначена для вас."
12110-71 = "А чтобы разобраться с вами... Ну, вот этого более чем достаточно."
12110-72 = ""
12110-73 = "...Это я. Да. Приступайте."
12110-74 = "Ч-Что? Кому ты звонил? «Приступайте»?"
12110-75 = "С сожалением сообщаю: кредитный рейтинг вашей школы только что снова снизился."
12110-78 = "*бип* *бип*"
12110-79 = "З-Звонок? Сейчас?"
12110-80 = ""
12110-81 = "Это Кайзер Кредит. С этого момента кредитный рейтинг Абидоса устанавливается на минимальном уровне."
12110-82 = "?!"
12110-83 = "Это увеличило плавающую процентную ставку на три тысячи процентов, поэтому со следующего месяца вы должны выплачивать 91,3 миллиона иен."
12110-84 = "Пожалуйста, обязательно внесите следующий платёж до конца месяца."
12110-85 = "Что?! П-Погодите... С-Стойте... Вот так внезапно? Уже к следующему месяцу?"
12110-87 = "Ты сказала 90 миллионов иен?! Ч-Что за бред?!"
12110-88 = "...Хе-хе-хе."
12110-89 = "Именно. Теперь понимаете? Наконец видите, в чьей руке поводок на ваших шеях?"
12110-90 = "...!"
12110-91 = "А, п-погодите... Это..."
12110-92 = "..."
12110-93 = "Слишком жестоко? Ах, но это ещё не всё."
12110-94 = "Мы так и не получили обеспечительный взнос по первоначальному кредиту в 900 миллионов иен. В течение недели внесите 300 миллионов в Кайзер Кредит."
12110-95 = "Вам придётся доказать, что вы способны выплатить долг даже при такой ставке. Если это вообще ВОЗМОЖНО."
12110-96 = "..."
12110-97 = "..."
12110-98 = "Н-Мы не можем найти такие деньги. Мы едва успеваем платить проценты. Как...?"
12110-99 = ""
12110-100 = "Тогда вам остаётся отказаться от академии и уйти."
12110-101 = "!!"
12110-102 = "Бросьте школу и переведитесь. Разве это не разумно? Этот долг изначально даже не ваш."
12110-103 = "Это долг школы. Вы не обязаны за него отвечать."
12110-104 = "Э-Это...!! Ни за что мы не сделаем такого!"
12110-105 = "Это НАША школа! Мы не можем просто её бросить!"
12110-106 = "Абидос — наш дом."
12110-107 = ""
12110-108 = "Какая глупость. И что вы собираетесь делать? Стоять здесь и дальше спорить?"
12110-109 = "...Возвращаемся, все."
12110-110 = "Хошино?!"
12110-111 = "Здесь мы не можем драться. Именно этого они хотят."
12110-112 = "Мудрое решение, вице-президент."
12110-113 = "Теперь вспомнил. Ваша президент была не настолько умна, как ты, правда? Ха-ха."
12110-114 = "..."
12110-115 = "Что ж, буду ждать платёж в следующем месяце, дорогие клиенты!"
12110-116 = "Ха-ха-ха!"
12110-117 = "Ах, как освежает. А теперь проводите наших гостей к выходу."
12110-118 = ""
12110-119 = ""
12110-121 = ""
12110-122 = "..."
12110-124 = "Следующий эпизод;Секреты"
