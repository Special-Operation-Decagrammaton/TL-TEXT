[translation]
212080-1 = "Эпизод 8;Чиаки"
212080-3 = ""
212080-4 = "..."
212080-5 = "*вздох* Ироха..."
212080-6 = "Мне так не хватает её... как человека, на которого можно свалить все эти нудные бумаги."
212080-7 = "Ц, и где пропадает Сацуки...?! Кажется, я её уже несколько дней не видела!"
212080-8 = ""
212080-12 = ""
212080-13 = ""
212080-14 = "Ничего себе, Макото работает не покладая рук!"
212080-15 = "Вот это сенсация..."
212080-16 = "..."
212080-17 = "Но даже если я сделаю снимок, смогу ли использовать его в статье?"
212080-18 = "«Еженедельник Пандемониума» временно не выходит... Всё-таки подготовка к войне важнее..."
212080-19 = "...Хм, ну и ладно! Сделаю пару кадров. Наверняка когда-нибудь они станут историческими!"
212080-20 = ""
212080-22 = ""
212080-26 = ""
212080-28 = ""
212080-30 = ""
212080-34 = "...Макото как будто одиноко."
212080-35 = "Ироха ушла, Сацуки чем-то занимается..."
212080-36 = "Ибуки в последнее время совсем притихла..."
212080-37 = "*вздох* Как же наш шумный Пандемониум дошёл до такого?"
212080-41 = ""
212080-42 = ""
212080-43 = "М? Это ведь...?"
212080-46 = "...Да."
212080-47 = "...рошо. ...Подтверждаю."
212080-48 = "...рожнее. Конец связи."
212080-51 = ""
212080-52 = ""
212080-55 = ""
212080-57 = ""
212080-61 = "Секретарь Лиги наследия... Нет, теперь её правильнее называть «оперативным офицером»."
212080-62 = "Похоже, она держится молодцом."
212080-63 = "...Хотя, кажется, работает больше всех..."
212080-64 = ""
212080-66 = ""
212080-67 = ""
212080-68 = "А, привет! А-ха-ха..."
212080-69 = "...Чиаки."
212080-70 = "Ага, это я. Похоже, у тебя был долгий разговор по связи, да?"
212080-71 = "...А, верно."
212080-72 = "Я не собиралась тут задерживаться. Не хотела мешать твоим важным делам. Ха-ха."
212080-73 = "У ТЕБЯ ко мне какое-то дело?"
212080-74 = "Эм. Ничего особенного..."
212080-75 = ""
212080-77 = ""
212080-78 = "Но вообще-то можно задать один вопрос? Считай это коротким интервью! Мне нужна лишь одна цитата!"
212080-79 = "...Спрашивай."
212080-80 = "Забавно получается. Я секретарь Пандемониума, а ты секретарь Лиги наследия! Ура! Секретарские подружки! Прямо близняшки..."
212080-81 = "..."
212080-82 = "Кхм... Итак, мой вопрос!"
212080-83 = "Что ты думаешь о нынешнем положении Геенны, Шоуко?"
212080-84 = "...А мой ответ имеет значение?"
212080-85 = "М-м, мне почему-то кажется, что да! Назовём это... журналистской интуицией."
212080-86 = "Шоуко, ты кажешься не только старательной, но и осмотрительной. Умеешь всё просчитать, прямо настоящий стратег!"
212080-87 = "..."
212080-88 = "Ты спросила моё мнение о нынешнем положении Геенны, верно? Вот мой ответ."
212080-89 = ""
212080-91 = ""
212080-92 = "Геенна вновь обрела величие."
212080-93 = "Здесь все шагают в ногу, мыслят одинаково и знают, куда направлять оружие, объединённые общей целью. Слава Геенне."
212080-94 = "А..."
212080-95 = "Все делают всё возможное, чтобы воплотить мечту, которую мы не смогли осуществить в прошлом."
212080-96 = "Мечту прошлого... О, а у нас была такая?"
212080-97 = "...Разумеется. Старая Геенна мечтала о полном завоевании Кивотоса."
212080-98 = "Вот как? Впервые об этом слышу."
212080-99 = "Фу-фу... Тебе необязательно это понимать."
212080-100 = "Ну да, ну да... Но в последнее время мне кажется, что атмосфера в академии изменилась. Стало даже слишком тихо."
212080-101 = "Будто без неожиданных взрывов и драк Геенна уже не совсем Геенна."
212080-102 = "Ты говоришь об ушедшей эпохе, когда царила несовершенная свобода."
212080-103 = "Ага. Пожалуй, вся эта неразбериха давала отличные сюжеты! Сейчас сенсацию днём с огнём не сыщешь."
212080-104 = "Чиаки, ты считаешь, что наша нынешняя славная Геенна хуже той, по которой ты скучаешь?"
212080-105 = "Эм... По правде?"
212080-106 = "..."
212080-107 = ""
212080-109 = ""
212080-110 = "Сейчас всё какое-то слишком тяжёлое. Словно на плечи каждого легла давящая ноша."
212080-111 = "Студенты ходят на цыпочках и только выполняют приказы... Разве не кажется, что во всём этом не хватает... веселья?"
212080-112 = "«Веселья»..."
212080-113 = "О, Чиаки. Ты хоть представляешь, сколько возможностей Геенна упустила, гоняясь за детским «весельем»?"
212080-114 = "А? Не уверена..."
212080-115 = "И чего же добились те, кто гнался за бессмысленным «весельем»?"
212080-116 = "Геенна топталась на месте. Одни студенты рыли горячие источники, взрывали рестораны и попусту тратили ценные боеприпасы."
212080-117 = "А теперь что? Все объединились и идут вперёд. Геенна превыше всего."
212080-118 = "Хм... Но разве нападение на Кивотос — правильный выбор?"
212080-119 = "Председатель Макото высказалась однозначно. Война необходима."
212080-120 = "Когда старая эпоха будет разрушена, начнётся правление истинного порядка Геенны. Все академии окажутся под её славным знаменем."
212080-121 = "...Хм... Да, насчёт этого..."
212080-122 = "Тогда спрошу иначе: а зачем это нужно?"
212080-123 = "Разве разнообразие не делает мир интереснее? Не думаю, что было бы весело, если бы Тринити превратилась в Геенну, а Миллениум перенял наш стиль."
212080-124 = "Сохранение своеобразия и разнообразия отдельных академий лишь приведёт к распылению сил."
212080-125 = "Конфликты возникают, когда все говорят вразнобой. На разрешение неизбежных разногласий из-за непонимания впустую уходят ресурсы."
212080-126 = "Но ведь небольшие конфликты делают жизнь интереснее. Тут искры посыплются, а таким, как я, достанется горячая сенсация!"
212080-127 = "Шоуко, ты правда хочешь, чтобы все академии стали частью Геенны? Все же будут ходить в одинаковой чёрной форме!"
212080-128 = "Именно. Завоевать Кивотос — предназначение Геенны и конечная цель её пути."
212080-129 = "Хм... Тут мы не сойдёмся, но позволь задать ещё один вопрос."
212080-130 = "Шоуко, а какое место ты отводишь себе в этой «идеальной» Геенне?"
212080-131 = "Что ты имеешь в виду?"
212080-132 = "Ты так чётко видишь свою цель. Наверняка у тебя есть планы и на то, что будешь делать после её достижения?"
212080-133 = "Я..."
212080-134 = "...хочу лишь укрепить новый порядок в совершенной и славной Геенне..."
212080-135 = ""
212080-137 = ""
212080-138 = "...А ты никогда не думала, что будет потом?"
212080-139 = "...У меня уже голова болит от необходимости объяснять такие очевидные вещи. Больше никаких вопросов. Интервью окончено."
212080-140 = "А, вот как? Ладно, спасибо! Поправляйся!"
212080-141 = ""
212080-143 = ""
212080-144 = "Хм... Похоже, она об этом никогда не думала."
212080-145 = "...Цель — окончательное завоевание? Или сама бесконечная война...?"
212080-146 = "Журналистская интуиция подсказывает, что тут что-то нечисто! Может, она что-то скрывает..."
212080-147 = "Хм..."
212080-148 = "Знаю лишь одно: я не хочу жить в том сером, скучном мире, о котором она мечтает."
212080-149 = ""
212080-151 = ""
212080-152 = "...А мои старшие товарищи...? Они действительно хотят именно этого?"
212080-153 = ""
212080-156 = "Неужели так плохо было вместе смеяться и болтать...?"
212080-158 = "Следующий эпизод;Сацуки"
