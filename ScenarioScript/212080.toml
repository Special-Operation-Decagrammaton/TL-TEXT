[translation]
212080-1 = "Episode 8;Chiaki"
212080-4 = "……."
212080-5 = "Phew……."
212080-6 = "To think that with Iroha gone, I'd be forced to do the actual work myself."
212080-7 = "And where on earth is Satsuki wandering off to now……!#nShe's never around when I need her!"
212080-14 = "Whoa! Makoto-senpai is actually doing work!"
212080-15 = "This is a scoop—"
212080-16 = "……."
212080-17 = "But, even if I take a picture, can I even use it for an article?"
212080-18 = "The Weekly Pandemonium has been suspended, after all……."
212080-19 = "Hmm, I don't know! I'll just take it for now; I'm sure I can use it someday!"
212080-34 = "……She looks kind of lonely, doesn't she?"
212080-35 = "Iroha-chan left, and Satsuki-senpai is hardly ever around."
212080-36 = "Even Ibuki-chan doesn't have any energy……."
212080-37 = "Sigh…… how did the Pandemonium, which used to be so noisy, end up like this?"
212080-43 = "Hm? What's that……."
212080-46 = "—Yes."
212080-47 = "—and, ……is."
212080-48 = "—please."
212080-61 = "The secretary of the Gehenna Re-education Committee…… no, I suppose you're an operations officer now, aren't you?"
212080-62 = "You don't seem fazed at all, even in this situation."
212080-63 = "If anything, you seem more eager than ever……."
212080-68 = "Oh, hello there~ Ahaha."
212080-69 = "……Chiaki-san."
212080-70 = "Was that an important phone call?"
212080-71 = "……I suppose so."
212080-72 = "The atmosphere was a little hard to interrupt, you know?"
212080-73 = "Did you need something?"
212080-74 = "No, no, it's not really anything like that, but……."
212080-78 = "Since I'm here, could I ask you one thing?#nJust a bit of light chatter, you know?"
212080-79 = "……Go ahead."
212080-80 = "Ah. Come to think of it, we're both 'Secretaries'!#nOne from Pandemonium, and one from the Gehenna Re-education Committee!"
212080-81 = "……."
212080-82 = "Ahem…… then here is my question!"
212080-83 = "Shouko-san, what do you think of Gehenna right now?"
212080-84 = "……Why do you ask?"
212080-85 = "I just have a feeling it's important. Call it a reporter's intuition!"
212080-86 = "I mean, Shouko-san, you're what you might call a planner…… a sharp person, right?"
212080-87 = "……."
212080-88 = "What I think of Gehenna right now, was it."
212080-92 = "I think it has become great. Once again."
212080-93 = "Everyone's thoughts are unified, walking toward the same goal.#nNow that we clearly recognize who we are pointing our muzzles at, Gehenna is truly great."
212080-94 = "Oh……."
212080-95 = "Because everyone is giving their all to turn a dream that was once unreachable into reality."
212080-96 = "……Hm? Was there such a dream?"
212080-97 = "Yes. I have heard that there was a dream to dye Kivotos in the colors of Gehenna."
212080-98 = "Huh…… that's news to me."
212080-99 = "It is fine if you were unaware."
212080-100 = "Hmm…… but, my opinion is a little different, I suppose…….#nHonestly, I don't really like this atmosphere. It's too quiet."
212080-101 = "There should be explosions going off everywhere, incidents happening left and right!#nDoesn't that feel more like Gehenna?"
212080-102 = "You are speaking of the days when 'imperfect freedom' ruled."
212080-103 = "I don't really know about that, but…… I never had trouble finding scoops back then."
212080-104 = "Are you against the current Gehenna, Chiaki-san?"
212080-105 = "That is…… well……."
212080-106 = "……."
212080-110 = "It feels like a heavy atmosphere is suppressing everything."
212080-111 = "Everyone is watching their surroundings, following orders and conforming to control……#nDoesn't this seem a bit boring to you?"
212080-112 = "Boring, you say……."
212080-113 = "Are you aware?#nBecause of that 'fun,' Gehenna has been suffering from lost opportunities for two whole years."
212080-114 = "Eh? Is that so?"
212080-115 = "What have those who chased the hollow value of 'fun' actually accomplished?"
212080-116 = "While they were digging hot springs, destroying cafeterias, or wasting ammunition and explosives.#nThe massive engine that is Gehenna was merely spinning its wheels."
212080-117 = "But finally, all the gears have meshed together.#nPower is being transmitted to every corner of Gehenna without waste, and we are taking that first step."
212080-118 = "But does that mean we have to attack Kivotos……?"
212080-119 = "It is essential. Chairman Makoto said as much, did she not?"
212080-120 = "That when every academy flies the flag of Gehenna, the true order led by Gehenna will begin."
212080-121 = "Umm……."
212080-122 = "Do we really have to do that?"
212080-123 = "I think it's good that everyone is different.#nI don't think it would be fun if Trinity or Millennium became Gehenna."
212080-124 = "Individuality and diversity result in the dispersion of power."
212080-125 = "Different voices create friction, and resolving conflicts costs resources.#nEnergy is used not to create something, but to bring the negatives back to zero."
212080-126 = "No, no, friction is exactly what creates scoops!"
212080-127 = "Shouko-san, do you really want to turn every academy into Gehenna?"
212080-128 = "Of course. That is the proof of Gehenna's existence, and the final goal we must reach."
212080-129 = "It's different from what I think, but…… then, one last question."
212080-130 = "Once you've painted everything in Gehenna's colors, what do you want to do, Shouko-san?"
212080-131 = "……Excuse me?"
212080-132 = "If you have such a strong sense of purpose, isn't there something you want to do after that?"
212080-133 = "I……."
212080-134 = "In a perfect Gehenna, establishing a new order……."
212080-138 = "……Don't tell me, you haven't thought about it?"
212080-139 = "……Let's end the interview here.#nI am not free enough to explain things that should be obvious."
212080-140 = "That's a shame. Thanks for your cooperation~"
212080-144 = "……I guess she hadn't thought about it."
212080-145 = "Does that mean…… the means and the ends have been reversed?#nOr is the act of attacking itself the goal……?"
212080-146 = "Something feels suspicious…… my reporter's intuition is tingling like crazy."
212080-147 = "Uuuuugh……."
212080-148 = "Well, regardless, it doesn't seem to be to my taste."
212080-152 = "Are the seniors…… really……?"
212080-156 = "Was the Pandemonium like it used to be not good enough……."
212080-158 = "Next Episode;Satsuki"