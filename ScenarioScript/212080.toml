212080-61 = "A secretária do Comitê de Restauração de Gehenna...... ou melhor, a atual assessora de operações de guerra."
212080-62 = "Olha só pra ela: não tá nem um pingo abalada com toda essa confusão."
212080-63 = "Parece até a mais animada com tudo isso......"
212080-64 = ""
212080-66 = ""
212080-67 = ""
212080-68 = "Oiê, bom diaaa! Hahaha."
212080-69 = "......Chiaki-san."
212080-70 = "Era alguma ligação importante?"
212080-71 = "......Pode-se dizer que sim."
212080-72 = "Poxa, o clima tava tão denso que quase fiquei com vergonha de te interromper!"
212080-73 = "Deseja alguma coisa comigo?"
212080-74 = "Não, não, nada formal não......"
212080-75 = ""
212080-77 = ""
212080-78 = "Já que estamos aqui, posso te fazer uma perguntinha?#nTipo um bate-papo descontraído, sabe?"
212080-79 = "......À vontade."
212080-80 = "Ah, pensando bem, nós somos a 'Dupla de Secretárias', né?!#nSecretária da Pandemonium e secretária da Restauração!"
212080-81 = "......"
212080-82 = "Cof, cof...... lá vai a pergunta!"
212080-83 = "Shoko-san, o que você tá achando dessa Gehenna de agora?"
212080-84 = "......Por que essa pergunta de repente?"
212080-85 = "Ah, meu faro de repórter apitou dizendo que isso é importante! Sabe como é, intuição feminina de jornalista!"
212080-86 = "Afinal, você é daquelas pessoas metodicamente calculistas...... ou digamos, de raciocínio afiadíssimo!"
212080-87 = "......"
212080-88 = "O que penso sobre a Gehenna atual, não é?"
212080-89 = ""
212080-91 = ""
212080-92 = "Acho que ela se tornou grandiosa. Mais uma vez."
212080-93 = "Todas as vontades alinhadas em um único propósito, marchando rumo ao mesmo objetivo.#nSaber exatamente para onde apontar as armas é a prova definitiva de uma Gehenna grandiosa."
212080-94 = "Ooooh......"
212080-95 = "Todas estão dando a própria vida para transformar em realidade o sonho outrora inalcançado."
212080-96 = "......Pera aí. Existia um sonho desses?"
212080-97 = "Sim. Ouvi dizer que havia o sonho supremo de tingir Kivotos inteira com as cores de Gehenna."
212080-98 = "Puxa...... pra mim isso é novidade completa."
212080-99 = "Não faz diferença se você não conhecia."
212080-100 = "Hummm...... mas a minha opinião é meio divergente da sua, sabe?#nPra ser bem sincera, eu não tô curtindo esse clima nem um pouco. Tá tudo quieto demais pro meu gosto."
212080-101 = "Coisa explodindo pra lá e pra cá, confusão estourando em cada esquina!#nNão acha que é isso que faz Gehenna ser Gehenna de verdade?"
212080-102 = "Você se refere à época em que a escola era governada por uma 'liberdade imperfeita'."
212080-103 = "Eu não entendo muito desses termos difíceis...... só sei que antes nunca faltava pauta pra render notícia boa."
212080-104 = "Você se opõe à nova Gehenna, Chiaki-san?"
212080-105 = "Ah...... bem......"
212080-106 = "......"
212080-107 = ""
212080-109 = ""
212080-110 = "Sinto como se um cobertor pesado e sufocante tivesse esmagando todo mundo."
212080-111 = "Todo mundo pisando em ovos, olhando pros lados com medo e obedecendo como robôs......#nFala a verdade: isso não é chato pra caramba?"
212080-112 = "Chato, é......?"
212080-113 = "Você faz ideia?#nPor conta dessa dita 'diversão', Gehenna jogou no lixo dois anos inteiros de oportunidades."
212080-114 = "Ué? É sério?"
212080-115 = "O que conseguiram aquelas que perseguiram esse valor vazio chamado 'diversão'?"
212080-116 = "Enquanto cavavam termas, explodiam refeitórios e torravam munição à toa,#no imenso motor de Gehenna girava em falso no vácuo."
212080-117 = "Mas finalmente todas as engrenagens se encaixaram com perfeição.#nA força motriz agora se propaga sem perdas até o último canto da academia, rumo ao grande salto."
212080-118 = "Mas precisava declarar guerra contra Kivotos inteira só por causa disso......?"
212080-119 = "É um passo indispensável. A própria líder Makoto afirmou isso com todas as letras."
212080-120 = "Quando todas as academias hastearem a bandeira de Gehenna, a verdadeira ordem liderada por nós terá início."
212080-121 = "Uuuuuum......"
212080-122 = "Mas tem mesmo que fazer isso?"
212080-123 = "Eu acho que a graça tá em cada escola ser diferente da outra.#nSe Trinity ou Millennium virassem uma cópia de Gehenna, ia perder a graça total."
212080-124 = "Individualidade e diversidade resultam na dispersão de poder."
212080-125 = "Vozes divergentes geram atritos, e resolver atritos custa tempo e recursos valiosos.#nEm vez de criar algo novo, a energia é gasta apenas para trazer o negativo de volta ao zero."
212080-126 = "Opa, pera lá! É exatamente no atrito que nascem os melhores furos de reportagem!"
212080-127 = "Shoko-san, você quer mesmo transformar todas as escolas em Gehenna?"
212080-128 = "Com certeza. Essa é a razão de ser de Gehenna e o nosso objetivo final."
212080-129 = "Minha visão é bem diferente da sua, mas...... deixa eu fazer só mais uma última pergunta."
212080-130 = "Depois que você pintar Kivotos inteira com as cores de Gehenna...... o que você pretende fazer?"
212080-131 = "......Como?"
212080-132 = "Se você tem um senso de propósito tão forte assim, deve ter planejado o que vem depois, não é?"
212080-133 = "Eu......"
212080-134 = "Em uma Gehenna perfeita, consolidarei a nova ordem de forma inabalável...... e......"
212080-135 = ""
212080-137 = ""
212080-138 = "......Não me diga que você nem pensou nisso?"
212080-139 = "......Encerramos nossa entrevista por aqui.#nNão tenho tempo a perder explicando o óbvio."
212080-140 = "Poxa, que pena. Muito obrigada pela colaboração～"
212080-141 = ""
212080-143 = ""
212080-144 = "......Ela realmente não pensou em nada pro depois."
212080-145 = "O que significa que...... os meios e os fins tão invertidos?#nOu será que o ataque violento em si é o único objetivo......?"
212080-146 = "Tem caroço nesse angu...... meu faro de jornalista tá apitando sem parar."
212080-147 = "Hummmmm......"
212080-148 = "Seja como for, isso definitivamente não é a minha praia."
212080-149 = ""
212080-151 = ""
212080-152 = "As veteranas tão mesmo concordando com isso......?"
212080-153 = ""
212080-156 = "Será que a antiga Sociedade Pandemônio não era boa o bastante......?"
