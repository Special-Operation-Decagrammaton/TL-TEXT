212080-15 = "Isso aqui é o furo jornalístico do ano――"
212080-16 = "......"
212080-17 = "Mas se eu tirar a foto, onde é que vou publicar?"
212080-18 = "O Semanário da Pandemonium foi cancelado por tempo indeterminado......"
212080-19 = "Ah, quer saber? Dane-se! Vou tirar a foto mesmo assim, uma hora ela vai ser útil!"
