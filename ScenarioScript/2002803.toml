[translation]
2002803-1 = "Неудержимая"
2002803-2 = "Я осматривал лагерь в поисках Хинаты, чтобы помочь ей переносить багаж."
2002803-6 = "Наконец я нашёл её в лесу: она без особых усилий таскала багаж вдвое больше себя."
2002803-7 = ""
2002803-9 = ""
2002803-10 = "Так... Хм. Это нужно отнести туда..."
2002803-11 = ""
2002803-13 = ""
2002803-14 = ""
2002803-15 = "Это оказалось намного легче, чем я думала."
2002803-16 = "Может, потому что это гораздо меньше того, с чем я привыкла иметь дело в Соборе?"
2002803-17 = ""
2002803-19 = ""
2002803-20 = "...А?"
2002803-21 = ""
2002803-23 = ""
2002803-24 = "...А?! С-Сенсей...?!"
2002803-25 = "Вы давно здесь стоите?"
2002803-26 = "Только что пришли?"
2002803-27 = "Понятно... Какое облегчение."
2002803-28 = "О? Вы искали меня, чтобы помочь?"
2002803-29 = "Не нужно! Я ведь снова и снова говорила, что справлюсь сама, потому что боялась именно такого исхода!"
2002803-30 = "Мне и так было нелегко отказаться от помощи остальных, а теперь ещё и вы..."
2002803-31 = "Теперь мне кажется, что своим упрямым желанием всё делать самой я только создаю всем проблемы."
2002803-32 = "Наверное, моё упрямство — порок..."
2002803-33 = "[s1] «Я правда просто хотел тебе помочь.»\n[s2] «Ты мне услугу делаешь, позволяя помочь!»"
2002803-36 = "Ну... На это мне нечего возразить..."
2002803-37 = "Хм..."
2002803-38 = ""
2002803-40 = ""
2002803-41 = ""
2002803-42 = "*вздох* Хорошо... Полагаю, ничего не поделаешь."
2002803-43 = "В таком случае я очень рада поработать вместе с вами, Сенсей."
2002803-44 = ""
2002803-47 = ""
2002803-48 = "Но при одном условии! Пожалуйста, пообещайте, что будете носить только лёгкие вещи. Я не хочу, чтобы вы травмировались."
2002803-49 = "Хорошо...?"
2002803-50 = "[s3] «Спасибо, так и сделаю.»\n[s4] «Отлично! Работаю вместе с Хинатой!»"
2002803-53 = "Пф."
2002803-54 = "Хи-хи. Хи-хи-хи...!"
2002803-55 = ""
2002803-57 = ""
2002803-58 = "Ох. Простите. Даже не знаю, что на меня нашло."
2002803-59 = "Почему-то у вас действительно есть талант помогать мне чувствовать себя спокойнее."
2002803-60 = "Я знаю, что, несмотря на ваши слова, вы по-своему проявляете заботу. Поэтому... спасибо."
2002803-61 = ""
2002803-63 = ""
2002803-64 = "Ну что ж, давайте переносить вещи, Сенсей! Раз уж вы предложили своё время, я точно не хочу отнимать у вас слишком много!"
2002803-65 = "Я пойду впереди. Позвольте мне..."
2002803-66 = "Оп!"
2002803-67 = ""
2002803-69 = ""
2002803-74 = ""
2002803-75 = "...А? Это..."
2002803-76 = "[s5] «Огромный валун.»\n[s6] «Проход перекрыт... Что же делать...»"
2002803-79 = "Это наш лучший путь обратно в лагерь..."
2002803-80 = "...Что? Нужно поискать другой путь?"
2002803-81 = "Хм-м."
2002803-82 = "Не думаю, что в этом есть необходимость."
2002803-83 = "Похоже, никто не ставил его сюда намеренно, а валун такого размера передвинуть не должно быть проблемой."
2002803-84 = "[s] «А, вот как...?»"
2002803-85 = ""
2002803-88 = "[ns7] «...Погоди, что?»\n[ns8] «Что именно ты собралась передвигать?»"
2002803-91 = "Одну минутку. Позвольте мне сначала поставить эти коробки."
2002803-92 = ""
2002803-94 = ""
2002803-95 = ""
2002803-96 = "А теперь просто отодвину это в сторону!"
2002803-97 = ""
2002803-100 = "Ух... оп!"
2002803-101 = ""
2002803-108 = ""
2002803-109 = "Фух! Проход свободен!"
2002803-110 = ""
2002803-112 = ""
2002803-113 = ""
2002803-114 = "Простите за ожидание, Сенсей. Пойдём?"
2002803-115 = ""
2002803-117 = ""
2002803-118 = "[ns] «...»"
2002803-122 = ""
2002803-123 = "Хм... На этот раз на дороге упавшее дерево..."
2002803-124 = ""
2002803-126 = ""
2002803-127 = "Похоже, оно рухнуло от старости. Думаю, обойти его не получится."
2002803-128 = "И оно слишком большое, чтобы просто столкнуть его в сторону..."
2002803-129 = "...Что? Думаю ли я, что нам стоит поискать обходной путь?"
2002803-130 = "Ха-ха... Ну, конечно, можно и так, но тогда возвращение займёт гораздо больше времени."
2002803-131 = "Хм. Как же лучше поступить?"
2002803-132 = ""
2002803-134 = ""
2002803-135 = "Раз дерево старое и это не валун, может, я просто..."
2002803-136 = ""
2002803-138 = ""
2002803-139 = "Уп... ха!"
2002803-140 = ""
2002803-147 = ""
2002803-148 = "[ns9] «Ствол просто сломался как веточка...»\n[ns10] «...Ох... эм...»"
2002803-151 = "...Фух! Оно оказалось не таким уж крепким! Как удачно!"
2002803-152 = "Ну что, Сенсей! Продолжим? Мы почти пришли!"
2002803-153 = ""
2002803-156 = "...А?"
2002803-157 = "Сенсей...? У вас какое-то странное выражение лица..."
2002803-158 = "[s] «...Хината.»"
2002803-159 = "Д-Да?"
2002803-160 = ""
2002803-162 = ""
2002803-164 = ""
2002803-165 = "[ns11] «Я очень рад, что ты хороший студент.»\n[ns12] «Если когда-нибудь столкнёшься с проблемой, сначала расскажи мне.»"
2002803-166 = ""
2002803-167 = ""
2002803-169 = ""
2002803-170 = "Д-Да?"
2002803-171 = "Ох, эм... спа...сибо...?"
2002803-172 = ""
2002803-175 = "...Сенсей?"
2002803-177 = "Мы благополучно вернулись в лагерь, хотя Хината так и не поняла, что именно я хотел сказать."
2002803-178 = "После того как я увидел, как она передвинула огромный валун и голыми руками переломила ствол дерева, я просто не смог подобрать слов, чтобы всё объяснить."
