[translation]
1011103-1 = "Спокойный выходной"
1011103-2 = ""
1011103-4 = "О, вы рано, Сенсей. До назначенного времени ещё есть время."
1011103-5 = "А? Я тоже пришла рано?"
1011103-6 = "Хахаха! Ну, если уж рассказывать, я уже несколько дней хожу в школьной форме, и это довольно весело."
1011103-7 = "Вот мне и захотелось узнать, чем ещё можно заняться без бомбера!"
1011103-8 = "Хех, наверное, я немного поторопилась."
1011103-9 = "[s] «То есть сегодня ты хотела провести особенный день?»"
1011103-11 = "[ns] «С чего это вдруг?»"
1011103-12 = "Я знала, что вы спросите."
1011103-13 = "Посмотрите на меня. На мне школьная форма, верно?"
1011103-14 = "Сейчас я не президент C&C, и мне не нужно ни за кем присматривать."
1011103-15 = "Я просто обычный студент, понимаете?"
1011103-16 = "И сегодня я могу прожить день только для себя."
1011103-17 = "Есть много вещей, которые мне хотелось сделать, но я не могла из-за своего положения."
1011103-18 = "...А? Сенсей? Что это за взгляд?"
1011103-19 = "[s1] «Так ты всё это время принимала это во внимание.»\n[s2] «Ты на удивление заботливая.»"
1011103-20 = "А? Конечно."
1011103-21 = "И не думайте, что сможете заговорить мне зубы, Сенсей!"
1011103-22 = "В общем, есть много вещей, которые я могу сделать только сейчас."
1011103-23 = "Так что я собираюсь воспользоваться возможностью."
1011103-24 = "И я подумала, что вам тоже будет весело пойти со мной."
1011103-25 = "Ну как? Круто, да? Тогда идём!"
1011103-30 = ""
1011103-31 = "Добро пожаловать в Queen Burger Миллениума!"
1011103-32 = ""
1011103-33 = "[ns] «Фастфуд?»"
1011103-34 = "Ну да."
1011103-35 = "Я иногда прихожу сюда с другими членами клуба. Еда вкусная."
1011103-36 = "[s] «То есть для тебя это... не что-то новое?»"
1011103-37 = "Наоборот, сегодня меню совсем другое."
1011103-38 = "Давайте закажем. Вы первый, Сенсей."
1011103-39 = "[s] «Я возьму комбо с чизбургером.»"
1011103-40 = "А я возьму..."
1011103-41 = "Детский набор B!"
1011103-42 = "[s] «Детский набор?»"
1011103-43 = "Я же сказала: сегодня делаю что хочу!"
1011103-44 = "Вот и весь наш заказ!"
1011103-46 = "Так, вот ваше комбо с чизбургером..."
1011103-47 = "А вот мой детский набор..."
1011103-48 = "[s] «Почему тебе захотелось взять детский набор?»"
1011103-49 = "Ну, мне нравятся детские наборы, но при других людях я никогда не могла их заказать. Начали бы гладить меня по голове и говорить, что я милая, или ещё что-нибудь."
1011103-50 = "А если бы ещё разошёлся слух, что я ем детские наборы..."
1011103-51 = "Мне, конечно, всё равно, что говорят другие, но звучит это вообще не круто."
1011103-52 = "[s] «То есть ты просто ждала подходящего шанса?»"
1011103-53 = "Ага."
1011103-54 = "К тому же это не просто какой-то детский набор. Смотрите."
1011103-55 = "Это дают бесплатно вместе с едой!"
1011103-56 = ""
1011103-58 = ""
1011103-61 = "[ns] «...Игрушечный робот?»"
1011103-62 = "Не просто «игрушечный робот». Посмотрите внимательнее. Я не просто так хотела именно его."
1011103-63 = "Если повернуть вот этот сустав так и поставить вот это сюда, робот..."
1011103-64 = ""
1011103-66 = ""
1011103-67 = ""
1011103-68 = "...трансформируется!"
1011103-69 = "[ns] «Ого!»"
1011103-70 = "Круто, да? У вас аж глаза загорелись, Сенсей."
1011103-71 = "Хахаха! Но нет, ни за что, даже не думайте. Детский набор заказала я, значит, это моё!"
1011103-72 = "Хотите себе такого — заказывайте сами."
1011103-78 = "Уф, я объелась. Пойдём дальше!"
1011103-79 = "Дальше по этой дороге есть парк. Давайте немного прогуляемся."
1011103-80 = "Погода хорошая."
1011103-81 = "А? Ну да, я МОГУ и обычно гулять по парку, но..."
1011103-82 = "...это немного другое. Объясню, когда придём."
1011103-84 = "Как здесь тихо и спокойно. Ни души."
1011103-85 = "Если пройти по этой дорожке, дальше будет тропинка, а потом небольшой пруд."
1011103-86 = "Я там, правда, ещё не была."
1011103-87 = "[s] «Для человека, который там не был, ты неплохо знаешь дорогу.»"
1011103-88 = "А, дело в том, что этот парк рядом с клубной комнатой C&C."
1011103-89 = "Маршруты пересекаются, поэтому я каждый раз прохожу здесь, когда ухожу или возвращаюсь."
1011103-90 = "Но сколько бы раз я тут ни проходила, ни разу толком не останавливалась осмотреться."
1011103-91 = "Мне нравилась атмосфера, и я думала, что когда-нибудь неплохо бы спокойно прогуляться, но случая всё не было."
1011103-92 = "Так когда ещё это делать, если не сегодня?"
1011103-93 = "Вы ведь пойдёте со мной, Сенсей?"
1011103-94 = "[s] «Разумеется»."
1011103-95 = "Отлично! Вы наверняка много работали, так что для нас обоих это будет хорошей передышкой."
1011103-97 = "О-о, и правда здорово. Не знала, что здесь настолько просторно!"
1011103-98 = ""
1011103-100 = ""
1011103-101 = "О, Сенсей, смотрите, в пруду рыба!"
1011103-102 = "Вон та просто огроменная! Хахаха! ЧЕМ она питается, чтобы так вымахать?!"
1011103-103 = "[s] «Эй, Нэру? Не стоит так наваливаться на перила.»"
1011103-104 = "Да всё нормально, нормально!"
1011103-105 = "Они же не развалятся только потому, что я их немного толкну."
1011103-106 = "Не делают их настолько хлипкими—"
1011103-107 = ""
1011103-110 = "УА-А-А!"
1011103-111 = ""
1011103-113 = ""
1011103-114 = ""
1011103-115 = "[ns] «Поймал!»"
1011103-117 = ""
1011103-118 = ""
1011103-119 = "Фух. Вот это неожиданность."
1011103-120 = "[s] «А я тебя предупреждал.»"
1011103-121 = "Я-я не знала, что они настолько расшатаны!"
1011103-122 = "..."
1011103-123 = "И ещё, Сенсей? Сколько вы собираетесь меня держать?"
1011103-124 = "Можете уже отпустить. Со мной всё нормально..."
1011103-125 = "[s] «А, прости!»"
1011103-126 = "..."
1011103-127 = "С-серьёзно, вы слишком сильно переживаете, Сенсей!"
1011103-128 = "Я просто немного испугалась. Я бы не упала."
1011103-129 = "То есть... спасибо, что всё-таки подхватили."
1011103-130 = "Ай, ладно! Давайте сядем на ту скамейку."
1011103-132 = ""
1011103-133 = "Хорошая удобная скамейка, красивый вид... Тут и задремать можно, знаете?"
1011103-134 = "Даже просто сидеть здесь уже ощущается как отдельный выходной."
1011103-135 = "А вы как, Сенсей? Не скучаете?"
1011103-136 = "[s3] «С тобой всё становится интереснее, Нэру.»\n[s4] «Всем иногда нужна такая передышка.»"
1011103-137 = "Н-неужели?"
1011103-138 = "...Ха! Вы ОЧЕНЬ хорошо умеете красиво говорить, Сенсей."
1011103-139 = "Погодите, вы серьёзно?"
1011103-140 = "Ну, мне тоже нравится быть рядом с вами."
1011103-141 = "Ага. Ага..."
1011103-142 = "Я знала, что вам понравится, Сенсей."
1011103-143 = "*зевок*"
1011103-144 = "М-м, солнце сейчас такое приятное, вокруг так красиво... Меня и правда в сон клонит..."
1011103-145 = ""
1011103-147 = ""
1011103-148 = ""
1011103-149 = ""
1011103-150 = "*zzz*"
1011103-151 = "[ns] Подставить ей плечо."
1011103-152 = "З-з-з... Тепло..."
1011103-154 = "Спустя некоторое время..."
1011103-155 = ""
1011103-161 = "[ns] «...Нэру?»"
1011103-162 = "..."
1011103-163 = "[ns] «Если слишком долго проспишь днём, ночью можешь плохо уснуть.»"
1011103-164 = "...А?"
1011103-165 = ""
1011103-168 = ""
1011103-169 = "Чего—?!"
1011103-170 = "Я что, уснула, или...?"
1011103-171 = "Сколько я... В смысле «несколько часов»?!"
1011103-172 = "[s] «Ну как, отдохнула?»"
1011103-173 = "Эм... Вообще-то да."
1011103-174 = "Погодите, Сенсей, это значит, вы всё это время не могли встать из-за меня?"
1011103-175 = "Надо было сказать! Я не хотела задерживать вас НАСТОЛЬКО надолго..."
1011103-176 = "Просто было так тепло и удобно, что я сама не заметила, как..."
1011103-177 = "[s] «Всё нормально, главное, что ты хорошо отдохнула.»"
1011103-178 = "Э-эм... Мне всё равно неловко."
1011103-179 = "Хорошо, с этого момента, Сенсей, когда ВАМ захочется вздремнуть, можете использовать МОЁ плечо сколько угодно."
1011103-180 = "...Хотя сегодня для этого уже, наверное, поздновато."
1011103-181 = "[s] «Не переживай.»"
1011103-183 = "[ns] «Есть ещё что-нибудь, что ты хотела сделать, прежде чем закончим?»"
1011103-184 = "Нет, на сегодня всё!"
1011103-185 = "Фух, было весело и очень-очень освежающе."
1011103-186 = "В основном благодаря вам, Сенсей."
1011103-187 = ""
1011103-189 = ""
1011103-190 = ""
1011103-191 = "Так что спасибо. За то, что провели со мной этот особенный день."
