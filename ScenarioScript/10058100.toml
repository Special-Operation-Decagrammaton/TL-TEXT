[translation]
10058100-1 = "Episode 10;Spec Ops No. 183, Disbanding!"
10058100-2 = "*Cough, cough!*"
10058100-3 = "The volcanic ash is getting even worse..."
10058100-4 = "Let's curl up small inside for now."
10058100-5 = "*Cough,* I thought we'd be able to see a little better like this, though..."
10058100-6 = "Are you okay?"
10058100-7 = "*Cough, cough!* I'm fine. What about you, Rana?"
10058100-8 = "...Rana?"
10058100-9 = "Just a thought..."
10058100-10 = "Rana!? What's wrong? Does something hurt?"
10058100-11 = "That's not it."
10058100-12 = "I was thinking about us winning."
10058100-13 = "Already celebrating? Ahaha!"
10058100-14 = "That's not it."
10058100-15 = "If we win, then I'll have to part ways with you two."
10058100-16 = "I don't want to say goodbye to my friends."
10058100-17 = "Huh?"
10058100-18 = "Did you think we'd never see each other again after being released from 183?"
10058100-19 = "But didn't you two want 183 to be disbanded?"
10058100-20 = "Oh my gosh, Rana! You're sooo CUTE!"
10058100-21 = "Rana. Even when 183 no longer exists, we'll always be friends!"
10058100-22 = "Exactly! Even if I cut ties with Anna, I'll always be friends with you!"
10058100-23 = "That's my line!"
10058100-24 = "So does that mean we'll always be friends?"
10058100-25 = "Yeah! Think about it this way—we want to disband Spec Ops No. 183 to create#n\"Research Lab No. 183\" instead!"
10058100-26 = "That's basically the same thing as our current Spec Ops though! Seriously!"
10058100-29 = "...All right, that's enough. I think we're gonna run into them—"
10058100-33 = "—soon..."
10058100-34 = "W-Weird..."
10058100-35 = "I don't remember us adding this hole here for ventillation..."
10058100-36 = "S-Surely I just didn't notice it when we were building this thing... right...? H-Haha..."
10058100-39 = "They're here!"
10058100-40 = "Rana! Hard right, now!"
10058100-45 = "Loaded!"
10058100-46 = "I see. Their armor's even thinner than I expected."
10058100-47 = "An APHE shell will pass right through without causing any critical damage. #nSeems we need to aim for the chassis then."
10058100-48 = "Gunner, aim the next shot with the tip of the reticle triangle, not the center."
10058100-49 = "Roger!"
10058100-50 = "Driver. Shift to fourth gear and advance towards 1 o'clock. Full acceleration."
10058100-51 = "G-Got it!"
10058100-52 = "I'd thought the design was crude, but it seems to have a few tricks up its sleeve."
10058100-53 = "If you spot the enemy, don't wait for my signal—fire at will."
10058100-54 = "I'll let you know right away when to cease fire."
10058100-55 = "Roger! Breech clear! Target in sight!"
10058100-56 = "Firing!"
10058100-63 = "That one landed right next to us!"
10058100-64 = "R-Ranaa! Could you drive a little less aggressively!? I'm gonna puuuke, bweeegh!"
10058100-65 = "It's really impressive that you're dodging those shells and all, but...! U-Urgh...!"
10058100-66 = "I'll make sure they won't appear in our rear-view mirror again."
10058100-67 = "Isn't that the same thing as running away!?"
10058100-68 = "For now, just get into cover! We don't have a turret, so we can't shoot while#nrunning!"
10058100-69 = "There! Drive us into that cloud of ash in front!"
10058100-71 = "Tsk...!"
10058100-72 = "Commander! We've lost sight of the enemy tank in that ash cloud!"
10058100-73 = "So we won't be able to see more than 100 meters ahead of us..."
10058100-74 = "Gunner, rotate 32 degrees. Aim where the ash is drifting... then fire."
10058100-75 = "Firing!"
10058100-79 = "Eeek! That nearly hit us again!"
10058100-80 = "Pull it together! That shell just blew away all the ash!"
10058100-81 = "We can see the enemy!"
10058100-82 = "Rana, full stop! Erina, enemy at our 12! Load AP!"
10058100-83 = "AP loaded! Firing!"
10058100-89 = "It's a hit! We did it!"
10058100-90 = "Yaaay! Smack dab in the center!"
10058100-91 = "..."
10058100-92 = "Hold on tight!"
10058100-95 = "Huh!?"
10058100-99 = "Eeek... I thought we hit them..."
10058100-100 = "How is that possible!? Their tank looks completely unscathed!"
10058100-101 = "Is that even allowed!? That's gotta be cheating!"
10058100-103 = "Tsk. They're quick..."
10058100-104 = "Damage report."
10058100-105 = "The shell hit the front of the tank but did not penetrate. Most likely AP."
10058100-106 = "The front of Toramaru is the most heavily armored part.#nThat wouldn't even leave a scratch."
10058100-107 = "Gunner, report."
10058100-108 = "Apologies. They've fled into the ash again; I've lost sight of them."
10058100-109 = "Hmph."
10058100-110 = "Full stop. Shift to neutral and hold at our current position."
10058100-111 = "We'll find their position through sound."
10058100-113 = "No more running away—it's time you face us head-on."
10058100-114 = "I'll gladly take you on, just as you wanted."
10058100-116 = "*Cough cough...*"
10058100-117 = "Are you all right, Erina?"
10058100-118 = "Yeah. *cough* I'm fine..."
10058100-119 = "Rana, how's the engine?"
10058100-120 = "The filter got clogged with ash and stalled."
10058100-121 = "I removed the filter and replaced it with Anna's tights. #nIt should hold for the time being."
10058100-122 = "Waah... That was the pair I wore whenever something good happened...#nAt least it's for a good cause."
10058100-123 = "*Cough* It's all right. With or without tights, your legs still look fat."
10058100-124 = "Maybe you should just paint your legs instead. *Cough* Hahaha..."
10058100-125 = "...If you have the energy to say something like that, then you're defnitely fine."
10058100-126 = "(The volcanic ash has gotten really bad. I don't think we can stall any longer...)"
10058100-127 = "It's hot..."
10058100-128 = "(All of us, including Puppy, are at our limits...)"
10058100-130 = "Let's just give up"
10058100-131 = "It's too dangerous to continue."
10058100-133 = "(I... don't want to give up...)"
10058100-134 = "We only have one HVAP round left..."
10058100-135 = "No point shooting them in the front, but they're not just gonna let us hit their#nsides or back."
10058100-136 = "I suppose they don't call her the undefeated champion for nothing. #nDespite having a turret, they're always facing their front towards us."
10058100-137 = "Even though they can't see us, they shoot at us as if they can."
10058100-138 = "This ash's swirling like a blizzard. #nExcept this blizzard's STUPID hot... *Cough cough!*"
10058100-139 = "..."
10058100-141 = "*Cough cough!*"
10058100-143 = "*Cough...*"
10058100-146 = "!"
10058100-147 = "Sound..."
10058100-148 = "...This might just work."
10058100-149 = "Anna?"
10058100-150 = "Time to confirm my hypothesis!"
10058100-151 = "Let's give her one heck of a surprise!"
10058100-156 = "I can't hear them anymore. Did they run away?"
10058100-157 = "Let's slowly pull back. Shift to second gear and move silently..."
10058100-158 = "Ah—"
10058100-164 = "Is that..."
10058100-167 = "I forgot to tell them to cease fire...!"
10058100-168 = "It's a trap! Cease fir—"
10058100-169 = "Firing!"