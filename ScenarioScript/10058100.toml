[translation]
10058100-1 = "Episode 10;Class 183, Disbanding!"
10058100-2 = "*Cough*, *cough*!"
10058100-3 = "The volcanic ash is getting even worse..."
10058100-4 = "Should we curl up small inside?"
10058100-5 = "*Cough*, I thought this would at least let us see a little better..."
10058100-6 = "Are you okay?"
10058100-7 = "*Cough*, *cough*! I'm fine. What about Rana?"
10058100-8 = "...Rana?"
10058100-9 = "Suddenly..."
10058100-10 = "Rana!? What's wrong? Does something hurt?"
10058100-11 = "That's not it."
10058100-12 = "I was thinking about winning."
10058100-13 = "Are you getting all excited already? Ahaha!"
10058100-14 = "That's not it."
10058100-15 = "If we win, I'll have to part ways with Anna and Elina."
10058100-16 = "I don't want to say goodbye to my friends."
10058100-17 = "Eh?"
10058100-18 = "Did you think we wouldn't see each other anymore once we won and got our pardons?"
10058100-19 = "Elina and Anna want Class 183 to be disbanded, right?"
10058100-20 = "Oh gosh, Rana! You're so cute~!"
10058100-21 = "Rana. Even if Class 183 is freed from the special classes, we'll still be friends!"
10058100-22 = "Of course! Even if I cut ties with Anna, I'll still be friends with Rana!"
10058100-23 = "That's my line, you know!?"
10058100-24 = "So we're going to be friends forever, right?"
10058100-25 = "That's right! Let's tell them to disband Special Class 183 and create the #n'Class 183 Research Institute' instead!"
10058100-26 = "That's just the same as a special class~! Oh come on!"
10058100-29 = "...I feel like we'll be running into them around here soon--"
10058100-33 = "--or so I thought..."
10058100-34 = "H-Huh...?"
10058100-35 = "Was there always a ventilation shaft here...?"
10058100-36 = "I didn't notice it while we were building it... Huh... Ah, haha..."
10058100-39 = "Oh no!!!"
10058100-40 = "Rana!! Hard turn right! Hurry!!"
10058100-45 = "Loaded!"
10058100-46 = "I see, the armor is thinner than expected."
10058100-47 = "APHE shells will just pass right through without causing fatal damage. #nWe'll have to target the hull after all."
10058100-48 = "Gunner. Next, aim for the triangle at the top of the reticle. #nNot the center."
10058100-49 = "Understood!"
10058100-50 = "Driver. Shift to 4th gear, move forward at the 1 o'clock direction. Accelerator to the floor."
10058100-51 = "Y-Yes, ma'am!"
10058100-52 = "I thought their design was sloppy, but they caught us off guard."
10058100-53 = "If you see the enemy, you don't need to wait for a signal to fire."
10058100-54 = "I'll tell you immediately if we need to abort."
10058100-55 = "Got it! Breech secure! Taking aim, perfect!"
10058100-56 = "Firing!!"
10058100-63 = "It landed right beside us!!"
10058100-64 = "R-Rana!! Drive a little slower!! I'm gonna puke, uwaaah!!"
10058100-65 = "Dodging cannonballs is amazing, but!! U-Ugh...!!"
10058100-66 = "I'm going to make sure you never show up in my rearview mirror again."
10058100-67 = "Doesn't that just mean we're running away!?"
10058100-68 = "Just hide!! We don't have a turret, so we can't attack while retreating!"
10058100-69 = "I know! Let's charge into that volcanic ash cloud ahead!"
10058100-71 = "Tch...!"
10058100-72 = "Commander! Enemy tank lost behind the volcanic ash cloud!"
10058100-73 = "We can't even see 100 meters ahead like this..."
10058100-74 = "Gunner. 32 degrees, in the direction the volcanic ash is drifting... Fire."
10058100-75 = "Firing!"
10058100-79 = "Eep!! That almost hit us again!!"
10058100-80 = "Get a hold of yourselves!! That last shell blew the volcanic ash away!"
10058100-81 = "A chance to see the enemy!"
10058100-82 = "Rana, stop! Elina! Enemy at 12 o'clock, AP shell!"
10058100-83 = "Loaded! Fire!!"
10058100-89 = "We did it!! It hit!!"
10058100-90 = "Yesss~! Right in the bullseye~!"
10058100-91 = "..."
10058100-92 = "Hold on tight!!"
10058100-95 = "Eh!?"
10058100-99 = "Gah... I thought we were goners..."
10058100-100 = "What is this!? The enemy tank looks completely fine!?"
10058100-101 = "Is that even allowed!? That's cheating!"
10058100-103 = "Tch, slippery little pests..."
10058100-104 = "Report the damage situation."
10058100-105 = "A shell hit the front of the hull, but it didn't penetrate. It was probably an AP shell."
10058100-106 = "The front is Tiger Maru's thickest armor. It didn't even scratch us."
10058100-107 = "Gunner, report."
10058100-108 = "Sorry. They escaped back into the volcanic ash and I lost sight of them."
10058100-109 = "Hmph."
10058100-110 = "Vehicle stop. Shift to neutral, stand by at current position."
10058100-111 = "Let's listen for their sounds and track them down."
10058100-113 = "Stop running away and come face us head-on."
10058100-114 = "We'll be happy to play with you, just as you wanted."
10058100-116 = "*Cough*, *cough*..."
10058100-117 = "Elina, are you okay?"
10058100-118 = "Yeah, *cough*. I'm fine..."
10058100-119 = "Rana, how's the engine?"
10058100-120 = "The filter clogged with volcanic ash and it stalled."
10058100-121 = "I took the filter off and stretched Anna's stockings over it instead... #nI think it'll hold out for a while."
10058100-122 = "Geez... I only wore those whenever something good happened... Oh well, can't be helped."
10058100-123 = "*Cough*, you'll be fine. Anna's legs are too thick for stockings anyway."
10058100-124 = "Maybe I should just paint my legs instead? *Cough*, hahaha..."
10058100-125 = "...If you have the energy to joke around like that, you must still be okay."
10058100-126 = "(The volcanic ash is way too bad. Can we really not stall for any more time...)"
10058100-127 = "It's so hot..."
10058100-128 = "(Everyone, and Puppy-go too... we're at our limit...)"
10058100-130 = "Let's stop."
10058100-131 = "Any longer than this is just too dangerous."
10058100-133 = "(I don't want... to give up...)"
10058100-134 = "We only have one high-velocity armor-piercing shell left..."
10058100-135 = "A frontal breakthrough is impossible. But they aren't going to let us flank them or hit their rear."
10058100-136 = "They aren't called the absolute champions for nothing. #nEven though they have a turret, they always come at us head-on."
10058100-137 = "They shouldn't be able to see us, yet they shoot as if they can."
10058100-138 = "The volcanic ash is swirling around like a blizzard. #nExcept for the fact that it's ridiculously hot... *cough*, *cough*!"
10058100-139 = "..."
10058100-141 = "*Cough*, *cough*!"
10058100-143 = "*Cough*..."
10058100-146 = "!!"
10058100-147 = "Sound..."
10058100-148 = "...With this, we might actually pull it off."
10058100-149 = "Anna?"
10058100-150 = "Hypotheses are meant to be tested!"
10058100-151 = "Let's give them a nasty surprise!!"
10058100-156 = "The sound stopped. Did they run away?"
10058100-157 = "Let's back away slowly. Shift to 2nd gear, quietly..."
10058100-158 = "Ah--"
10058100-164 = "That is..."
10058100-167 = "I forgot to tell them to cease fire...!"
10058100-168 = "It's a trap!!! Cease fir--"
10058100-169 = "Fire!"
