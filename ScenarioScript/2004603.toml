[translation]
2004603-1 = "Бесплодная земля не отвечает"
2004603-2 = "Клуб Инь-Ян Хяккияко"
2004603-3 = "Ния? С ней всё нормально, а что?"
2004603-4 = "[ns1] «НИЯ-А-А!!»\n[ns2] «Да чтоб тебя, она опять меня обманула!»"
2004603-7 = "Она принимает посетителей внутри, я скажу вам, когда она... Вообще, хотите зайти и посмотреть на заседание клуба?"
2004603-8 = "Даже наша президент не сможет бездельничать, пока вы смотрите, Сенсей, хи-хи..."
2004603-10 = "Поддавшись на предложение члена Клуба Инь-Ян с весьма сомнительными намерениями, я решил понаблюдать за работой Нии."
2004603-12 = "Ньяхаха! Все говорят, что фестиваль превзошёл все ожидания и прошёл с огромным успехом! Я впечатлена!"
2004603-13 = "Хаха, да ничего особенного! Видео в соцсетях действительно привлекли толпы!"
2004603-14 = "Итак, что привело занятого представителя торговой гильдии в Клуб Инь-Ян?"
2004603-15 = "А, немного неловко признавать, но мы стали жертвами собственного успеха."
2004603-16 = "На улицах полно оставшегося мусора... и много украшений оказалось повреждено..."
2004603-17 = "Значит, вы хотите одолжить ресурсы нашего клуба для уборки."
2004603-19 = "Да, именно! Клуб Инь-Ян ведь помогает людям, верно?"
2004603-20 = "М-м, я бы с радостью, но поручение торговой гильдии... трудно будет провести это по бюджету..."
2004603-21 = "Ну, если можно проявить гибкость в этой части... Нам сейчас ужасно не хватает людей. Даже несколько членов клуба очень помогли бы."
2004603-22 = "...Мне правда жаль, но это не входит в сферу нашей деятельности."
2004603-23 = "*вздох* И что же нам теперь делать...?"
2004603-25 = "Затем пришёл следующий посетитель..."
2004603-27 = "З-Здравствуйте! Вы президент Клуба Инь-Ян?"
2004603-28 = "Амачи Ния, да. Что бы вы ни слышали, я всё ещё президент. И... ого, вы довольно почётная гостья, не так ли?"
2004603-29 = "Говорят, в Клубе оригами собрались искусные мастерицы, которые день и ночь занимаются оригами в своей клубной комнате в горах..."
2004603-30 = "Х-Хм? Мастерицы? В-Вы нам льстите. Мы просто складываем оригами, потому что нам это нравится... Эхе-хе."
2004603-31 = "Итак, что привело столь выдающуюся леди в Клуб Инь-Ян?"
2004603-33 = "А, точно! Дело в том... мы хотим сменить клубную комнату."
2004603-34 = "В последнее время мы слышим там странные звуки, а снаружи по ночам всегда ужасно темно."
2004603-35 = "Даже ходят слухи о призраках! Весь клуб перепуган, и вся наша деятельность остановилась."
2004603-36 = "Понятно, понятно. И правда неприятно."
2004603-37 = "Что ж, чтобы не давать вам ложной надежды: мы не можем помочь."
2004603-38 = "П-Почему?!"
2004603-39 = "Скажем так: кого вы хотите, чтобы я выгнала из ИХ клубной комнаты, чтобы вы могли занять её?"
2004603-40 = "Н-Ну, эм..."
2004603-41 = "...Вот, видите проблему?"
2004603-42 = "Вижу."
2004603-43 = "Клуб Инь-Ян не может просто взять и поменять людям клубные комнаты."
2004603-44 = "Если найдётся другой клуб, который САМ захочет поменяться с вами, это другое дело, но тогда это будет уже между вами и ними, а не с нами."
2004603-45 = "И что нам теперь делать...?"
2004603-47 = "Затем пришёл последний посетитель..."
2004603-49 = "Эй! Вы нам кое-что должны объяснить!"
2004603-50 = "Мы пахали на фестивале как проклятые, а вы до сих пор не заплатили нам ни гроша!"
2004603-51 = "Да, мы массовка, но тоже гордимся своей работой! Думаете, нас можно просто игнорировать?"
2004603-52 = "...Разве ваш контракт не с торговой гильдией, а не с нами?"
2004603-53 = "А-А? Но Клуб Инь-Ян разве не решает такие вопросы?"
2004603-54 = "Мы решаем вопросы в пределах нашей юрисдикции. К сожалению, взыскание невыплаченного вознаграждения сторонним подрядчикам туда не входит."
2004603-56 = "И так все ушли."
2004603-58 = "Ого, простите, что заставила вас ждать."
2004603-59 = "Не думала, что вы доберётесь так быстро. И, эм, простите за всё, что вы только что увидели."
2004603-60 = "[s3] «М-м...»\n[s4] «У вас всегда так?»"
2004603-63 = "Хм? Вы про работу? Почти всегда."
2004603-64 = "Если говорить о традициях, Клуб Инь-Ян выступает посредником в конфликтах Хяккияко..."
2004603-65 = "О, вы спрашиваете, как именно мы работаем?"
2004603-66 = "Ну, уверена, вы успели посетить множество разных академий."
2004603-67 = "Вы наверняка знаете самые разные студсоветы. Возможно, наш немного отличается от привычных вам."
2004603-68 = "Хм-м, это будет скучная история."
2004603-69 = "Что скажете, если сначала прогуляемся?"
2004603-70 = "Может, красивые виды сделают урок истории чуть интереснее."
2004603-71 = "[s5] «Я не против, но...»\n[s6] «...разве ты не сказала, что у тебя какая-то проблема?»"
2004603-74 = "Если точнее, я была заперта в трагедии. История девушки в расцвете сил, прикованной к работе, пока лучшие годы её жизни утекают сквозь пальцы."
2004603-75 = "Но теперь, когда вы здесь, всё в порядке. Ньяхахаха!"
2004603-77 = "Обычно улицы Хяккияко чистые, но на этот раз кое-где я заметил мусор."
2004603-78 = "Ньяха... да, простите, что вам приходится это видеть."
2004603-79 = "Фестиваль прошёл с огромным успехом — куда масштабнее, чем кто-либо планировал. Уборщики просто не справлялись с количеством посетителей."
2004603-80 = "Но рано или поздно они всё уберут."
2004603-81 = "Они ведь так усердно работают. Ньяхаха!"
2004603-82 = "Ах да, урок истории. С чего бы начать...?"
2004603-83 = "А, знаю. История старая, так что начнём вот так..."
2004603-84 = "Давным-давно..."
2004603-85 = ""
2004603-87 = ""
2004603-88 = ""
2004603-89 = "...когда Хяккияко ещё не было Хяккияко..."
2004603-91 = "...существовало бесчисленное множество академий, и все они кипели в котле конфликтов."
2004603-92 = "Пока наконец они не прекратили воевать и не объединились, создав известное нам сегодня Хяккияко. И на многие поколения воцарился мир."
2004603-93 = "...По крайней мере, так звучит сказочная версия. Реальность, конечно, не настолько проста."
2004603-94 = ""
2004603-95 = "Позвольте спросить, Сенсей: что вы думаете о Хяккияко?"
2004603-96 = "[s7] «Это красивое место.»\n[s8] «Но „мирным“ я бы его не назвал...»"
2004603-99 = "Ньяхаха! Правда?"
2004603-100 = "Это словно дом, построенный на песке. В этом, конечно, есть своё очарование..."
2004603-101 = "...но толкни — и он рухнет, потяни — и развалится."
2004603-102 = "Академии больше не воюют открыто, но студенты и клубы всё равно постоянно конфликтуют друг с другом."
2004603-103 = "А Клуб Инь-Ян находится прямо посередине. По сути, все остальные клубы здесь передали часть полномочий новому клубу — нашему — и в теории мы посредники. В теории. На практике наше влияние существует ровно настолько, насколько обе стороны готовы его признавать."
2004603-104 = "Чаще всего мы оказываемся между молотом и наковальней."
2004603-105 = "Поэтому, когда у людей возникают конфликты и проблемы, нам обычно выгоднее просто наблюдать и не вмешиваться."
2004603-106 = "В лучшем случае нам везёт, и всё решается само собой..."
2004603-107 = "[s9] «И часто это действительно происходит?»\n[s10] «Хотелось бы, чтобы всё работало именно так, но...»"
2004603-110 = "Ньяха! Да, знаю. Ничего никогда не бывает настолько просто."
2004603-111 = "Она опять исчезла!"
2004603-112 = "Что?! Но она только-только закончила ВЧЕРАШНЮЮ работу!"
2004603-113 = ""
2004603-115 = ""
2004603-116 = "А, и вот снова мои очаровательные младшие."
2004603-117 = "Пожалуй, на сегодня пора заканчивать."
2004603-119 = "С этими словами Ния быстрым шагом направилась в противоположную от клубной комнаты Инь-Ян сторону."
2004603-120 = "Я ещё долго слышал, как её младшие разыскивают её на улицах."
