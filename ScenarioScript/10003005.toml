[translation]
10003005-218 = "#video;10003"
10003005-1 = "Главному префекту нужен отдых"
10003005-2 = ""
10003005-3 = "Пора в отпуск!"
10003005-4 = ""
10003005-5 = ""
10003005-7 = "Простите?"
10003005-8 = "Отпуск? О чём вы говорите?"
10003005-10 = "Я ожидала более бурной реакции. Это прозвучало так, будто я шучу?"
10003005-12 = "Мы не это имели в виду..."
10003005-13 = "Вы позвали нас сюда и сказали, что дело срочное."
10003005-14 = "Мы совсем не ожидали, что вы с такой гордостью объявите об отпуске, который нас никак не касается."
10003005-15 = "Ага, и куда вы вообще собираетесь?"
10003005-17 = "А? Простите?"
10003005-18 = "Вы всё не так поняли! Не я собираюсь в отпуск!"
10003005-19 = "Имейте обо мне хоть немного лучшего мнения. Я похожа на человека, который станет хвастаться отпуском?"
10003005-20 = "Вот как вы меня воспринимаете?!"
10003005-21 = "Я хочу сказать, что в отпуск отправимся мы, Дисциплинарный комитет."
10003005-22 = "Точнее, мы устроим отпуск главному префекту!"
10003005-24 = "Вы хотите, чтобы главный префект взяла отпуск?"
10003005-25 = "С чего вдруг?"
10003005-27 = "В последнее время она сама не своя..."
10003005-28 = "Я боюсь, что стресс добрался до неё и её состояние ухудшается."
10003005-29 = "Она настолько напряжена?"
10003005-30 = "Ну, когда сегодня утром я зашла к ней в кабинет..."
10003005-32 = ""
10003005-33 = ""
10003005-34 = "Вот расписание на эту неделю и краткий отчёт, госпожа главный префект."
10003005-35 = "И ещё чашка горячего кофе. Сделайте глоток."
10003005-36 = ""
10003005-37 = "Хм-м."
10003005-39 = "К счастью, у нас были в запасе отличные зёрна."
10003005-40 = "Я сама медленно заварила его. Уверена, вам понравится."
10003005-41 = "Вот как."
10003005-43 = "Хм..."
10003005-44 = "(Главный префект, должно быть, так сосредоточена на работе, что даже не замечает, как остывает её кофе...)"
10003005-45 = "Ако, что это за «Запрос на совместное патрулирование Шале и Кивотоса»?"
10003005-46 = "А, это документ на утверждение, который я подготовила, чтобы получить помощь Шале во время следующего планового патруля Дисциплинарного комитета."
10003005-47 = "Патруль вместе с Шале?"
10003005-48 = "Да. Это всего лишь документ для соблюдения процедуры. Конечно, если вы не хотите получать помощь Шале, тогда..."
10003005-49 = "Нет, дело не в этом. Уверена, работа с Шале, как всегда, будет полезной."
10003005-50 = "Да... С Шале..."
10003005-51 = ""
10003005-52 = "Хм? Госпожа главный префект, вы пьёте из моей кружки!"
10003005-53 = "О. Прошу прощения."
10003005-54 = "Так необычно видеть, как вы совершаете подобную ошибку."
10003005-55 = "Подождите. Вы говорите, что главный префект слишком напряжена только потому, что случайно отпила из ВАШЕЙ кружки?"
10003005-56 = "Это вполне могла быть обычная ошибка. Она ведь не идеальна."
10003005-57 = "Пожалуйста, скажите, что вас насторожило что-то ещё."
10003005-58 = "Конечно, это ещё не всё!"
10003005-59 = ""
10003005-60 = "Так вот, как я и говорила."
10003005-61 = ""
10003005-62 = ""
10003005-63 = ""
10003005-65 = "Этот кофе превосходный, Ако."
10003005-66 = "Да ладно! Вы это выдумали!"
10003005-67 = "Главный префект похвалила ваш кофе?"
10003005-68 = "Зачем вам так нам врать, старший администратор?"
10003005-69 = "Я не вру! Я собственными ушами слышала, как она это сказала!"
10003005-71 = "Тогда, похоже, вы правы. С президентом и правда что-то не так."
10003005-72 = "Я и раньше слышала её комментарии о еде и напитках, но никогда не слышала, чтобы она называла что-то «превосходным»."
10003005-73 = "Вы уверены, что не ослышались? Может, она сказала что-то вроде «удовлетворительно» или «приемлемо»?"
10003005-75 = "Это домогательство. Настоящее, сертифицированное домогательство высшего класса."
10003005-76 = "Успокойтесь. Если то, что вы говорите, правда..."
10003005-77 = "...тогда у нас действительно серьёзная проблема."
10003005-78 = "Я именно это и пытаюсь вам всё это время объяснить."
10003005-79 = "Это чрезвычайная ситуация! Она вполне может означать конец Дисциплинарного комитета!"
10003005-80 = "Это ещё как?"
10003005-82 = "Если главный префект свалится от переутомления, Дисциплинарный комитет могут уничтожить в считанные часы!"
10003005-83 = "Что?"
10003005-84 = "И я даже представить не могу, как Общество Пандемониума отреагирует, если узнает, что главный префект выбыла из строя."
10003005-85 = "Они без сомнений воспользуются шансом захватить контроль над Геенной!"
10003005-86 = "Если это произойдёт, академия — нет... весь Кивотос погрузится в хаос!"
10003005-87 = "Теперь понимаете?! На кону судьба Кивотоса!"
10003005-88 = ""
10003005-89 = ""
10003005-90 = "По-моему, вы немного преувеличиваете."
10003005-91 = "Ты отрицаешь, что главному префекту отчаянно нужен отпуск, Иори?"
10003005-92 = "Именно поэтому я, Амау Ако, старший администратор Дисциплинарного комитета, решила, что нашему лидеру нужен отпуск!"
10003005-93 = "Ради главного префекта, Дисциплинарного комитета и всего Кивотоса!"
10003005-94 = ""
10003005-95 = "Операция: «Главному префекту нужен отдых»!"
10003005-97 = "Вы не слишком уж раздуваете всё это?"
10003005-98 = "Ако всегда такая, когда дело касается здоровья президента."
10003005-99 = "Всё это прекрасно, но я не думаю, что главный префект так легко согласится на отпуск. Она не из тех, кто берёт выходные."
10003005-100 = "Ага, даже если заставить её отказаться от работы Дисциплинарного комитета, она наверняка просто утонет в школьных делах."
10003005-102 = "Я прекрасно это понимаю. Стоит нам только заговорить об отпуске, и она наверняка скажет что-нибудь вроде: «Я и так отдыхаю по пять минут в день. Разве этого недостаточно?»"
10003005-103 = "Она всё-таки трудоголик."
10003005-104 = "Тогда эта миссия обречена на провал?"
10003005-105 = "Нет! Если она не хочет идти в отпуск, мы придумаем причину, по которой у неё не останется выбора, кроме как согласиться!"
10003005-106 = "Это возможно?"
10003005-107 = "Конечно! Кстати, Общество Пандемониума недавно прислало ещё один запрос."
10003005-108 = "Они хотят, чтобы мы предоставили подробности ежегодного летнего лагеря Дисциплинарного комитета."
10003005-109 = "Тц."
10003005-110 = "*вздох* Опять?"
10003005-111 = "Они действительно умеют действовать нам на нервы."
10003005-112 = "Зачем им наше расписание тренировок?"
10003005-113 = "Наверняка хотят изучить его и придраться к каждой мелочи. А потом снова заставят нас тренироваться в каком-нибудь безумном месте."
10003005-114 = "Как в прошлом году, когда они пытались отправить нас к подножию вулкана Хинном. Кто вообще тренируется у вулкана посреди лета?!"
10003005-115 = "К сожалению, у нас нет полномочий просто проигнорировать их запрос..."
10003005-116 = "Изначально я планировала устроить в летнем лагере лёгкие тактические тренировки с остальными членами."
10003005-117 = "Но раз уж всё так сложилось, попробуем обратить это в нашу пользу."
10003005-118 = "Вы хотите убедить главного префекта? Но как?"
10003005-119 = "Верно, Чинацу. И хороший вопрос."
10003005-120 = "Я воспользуюсь назойливостью Общества Пандемониума и организую для Дисциплинарного комитета летний тренировочный лагерь!"
10003005-121 = "Президент не сможет отказаться, если Общество Пандемониума будет на нас давить."
10003005-122 = "Но тренировка в итоге всё равно остаётся тренировкой, разве нет?"
10003005-123 = "Как это должно стать отпуском для президента?"
10003005-124 = "Ответ очень прост, Иори."
10003005-127 = "Мы проведём летний тренировочный лагерь на пляже!"
10003005-128 = "А пока будем там, главного префекта запрем в уютном гостиничном номере!"
10003005-129 = "А?"
10003005-130 = "Вы хотите запереть её в отеле на всю поездку? Разве это не должно быть отпуском?"
10003005-131 = "Это называется отельным отпуском!"
10003005-132 = "Отельным чем?"
10003005-133 = "Кажется, это вид отпуска, когда человек отдыхает исключительно в отеле, верно?"
10003005-134 = "Да, именно."
10003005-135 = "Сначала под предлогом летних тренировок мы берём главного префекта и едем на пляж."
10003005-136 = "Затем, сразу после того как запираем её в отеле, не назначаем ей никакой работы, включая тренировки."
10003005-137 = "И наконец, не позволяем ей выходить из номера!"
10003005-138 = "С каждой минутой это всё меньше похоже на отпуск."
10003005-139 = "Люди, которым нечем заняться, в конце концов теряют концентрацию и начинают отдыхать. Если забрать у неё всю работу, она хотя бы сможет отоспаться!"
10003005-140 = "Мы не оставим ей другого выбора, кроме как отдыхать. Подумайте, сколько времени прошло с тех пор, как она нормально высыпалась."
10003005-141 = "Ладно, ладно. Я поняла."
10003005-142 = "Этот план правда сработает на ней? Как мы её убедим?"
10003005-143 = "Хе-хе. Не беспокойся об этом, Чинацу. У меня как раз есть подходящий козырь..."
10003005-145 = "Сенсей из Шале!"
10003005-146 = "Мы рассчитываем на вашу помощь, Сенсей."
10003005-147 = "[s1] «Стойте, а зачем вы вообще позвали меня сюда?»\n[s2] «Я вообще не понимаю, что происходит.»"
10003005-148 = "П-Подождите. Почему Сенсей здесь?"
10003005-149 = "П-Подождите. Почему Сенсей здесь?"
10003005-150 = "Благодаря полномочиям Шале Сенсей может давать рекомендации по тренировочным планам Дисциплинарного комитета."
10003005-151 = "При содействии Сенсея мы сможем назначить тренировки на пляже."
10003005-152 = "Я знала, что у Шале много власти, но оно и правда может почти всё, да?"
10003005-153 = "Мы ведь говорим о Сенсее. Им доверили направлять учеников, поэтому действия Шале имеют немалый вес."
10003005-154 = "[s] «Эту часть я понимаю, но неужели всё будет настолько просто?»"
10003005-155 = "Передумали? Надеюсь, вы не собираетесь отказываться."
10003005-156 = "Но если откажетесь, у меня есть другой план."
10003005-157 = "Разведывательный комитет выяснил несколько интересных вещей о ваших привычках, Сенсей..."
10003005-158 = "Если у кого и есть дурные привычки, так это у тебя, Ако."
10003005-159 = "Нельзя просто так шантажировать Шале, старший администратор."
10003005-160 = "[s] «Нет, всё нормально.»"
10003005-161 = "А?"
10003005-162 = "[s3] «Это ведь ради Хины, верно?»\n[s4] «И так очевидно, что я помогу.»"
10003005-163 = "Я... не ожидала, что вы так охотно согласитесь."
10003005-164 = "Я... не ожидала, что вы так охотно согласитесь."
10003005-165 = "Ну, мы ведь говорим о Сенсее."
10003005-166 = "Даже Ако нашла достойного соперника."
10003005-167 = "[s] «Я ведь тоже еду, да? Увижу вас всех в купальниках?»"
10003005-168 = "Вот знала же, что не стоит тебя хвалить, извращенец!"
10003005-170 = "*качает головой*"
10003005-171 = "Э-Это не имеет значения. Раз у нас есть помощь Сенсея, остаётся только убедить главного префекта!"
10003005-173 = "Хорошо. Понятно."
10003005-174 = "В-Вы уверены, главный префект? Всё в порядке?"
10003005-175 = "В чём проблема? Летний лагерь проводится каждый год. Нет причин возражать."
10003005-176 = "Д-Да. Я так и знала."
10003005-178 = "*вздыхает*"
10003005-179 = "(Можно ещё очевиднее показывать, что ты что-то задумала, Ако?)"
10003005-180 = "Кстати, я уже осмотрела место для лагеря этого года."
10003005-181 = "Адский пансион у подножия вулкана Хинном в районе 94-13 Геенны."
10003005-182 = "Даже Обществу Пандемониума нечего будет возразить против такого места. Раз уж тренироваться, то основательно."
10003005-183 = "Вы опять хотите к вулкану?! Даже если Общество Пандемониума нас туда не заставляет?!"
10003005-184 = "...?"
10003005-185 = "Подождите минутку, главный префект. Вы уже всё организовали?"
10003005-186 = "Да. Я предполагала, что примерно сейчас Общество Пандемониума начнёт на нас давить."
10003005-187 = "(Плохо! Наш план может провалиться ещё до начала...)"
10003005-188 = "(Что же делать?)"
10003005-189 = ""
10003005-190 = ""
10003005-191 = "[ns5] «Зачем нам вулкан, когда есть пляж! Купальники!»\n[ns6] «Лето — это пляж, а пляж — это купальники! Лагерь!»"
10003005-192 = "Пляж? Купальники? О чём вы вообще говорите, Сенсей?"
10003005-193 = "Пляж? Купальники? О чём вы вообще говорите, Сенсей?"
10003005-194 = "Это ты хотела со мной обсудить, Ако? Новое место для тренировочного лагеря?"
10003005-195 = "Д-Да! Именно! Я как раз обсуждала это с Сенсеем."
10003005-196 = "Я хотела сама заняться планированием лагеря, потому что знаю, как вы всегда заняты."
10003005-197 = "Не позволите ли мне взять на себя организацию лагеря этого года? Только в этот раз, чтобы немного разгрузить вас?"
10003005-198 = "Хм. Но мы никогда раньше не проводили тренировочный лагерь у моря."
10003005-199 = "Сенсей отлично знает эти места! С ним наши тренировки наверняка станут ещё эффективнее!"
10003005-200 = "Понятно."
10003005-201 = "Хорошо."
10003005-202 = "Раз ты настаиваешь, Ако."
10003005-203 = "В-Вы одобряете?"
10003005-204 = "Да, я оставлю организацию тренировочного лагеря тебе. В конце концов, именно поэтому ты наш старший администратор."
10003005-205 = "И, как ты говоришь, неэффективно, если я буду брать на себя каждую обязанность Дисциплинарного комитета."
10003005-206 = ""
10003005-207 = "В этот раз последуем твоему плану."
10003005-208 = "Постарайся."
10003005-209 = ""
10003005-210 = ""
10003005-211 = "(Это сейчас...?)"
10003005-212 = "(Да, похоже на то.)"
10003005-213 = "(Сработало!)"
10003005-214 = "[ns] «Мы едем на пляж!»"
10003005-216 = "Так было решено, что летние тренировки Дисциплинарного комитета в этом году пройдут на пляже."