[translation]
1010706-1 = "Расследование секретаря"
1010706-4 = ""
1010706-5 = "Здравствуйте!"
1010706-6 = "[s] «Привет, Чиаки.»"
1010706-7 = "Как вы сегодня себя чувствуете, Сенсей?"
1010706-8 = "Хорошо спали прошлой ночью? Не заболели случайно?"
1010706-9 = "[s1] «Я в порядке...»\n[s2] «Почему спрашиваешь?»"
1010706-12 = "Хи-хи, ну..."
1010706-13 = "Всё из-за нового большого материала для «Еженедельника Общества Пандемониума», над которым я работаю!"
1010706-14 = "...И мне очень нужна ваша помощь, Сенсей!"
1010706-15 = "[s] «Помощь... снова есть десерты?»"
1010706-16 = ""
1010706-19 = "[ns] «Не уверен, что мой желудок сейчас выдержит ещё десертов.»"
1010706-20 = "А-ха-ха! Нет-нет, не это!"
1010706-21 = "Вообще-то я думала над заголовком для следующего большого материала «Еженедельника Общества Пандемониума»!"
1010706-22 = "Как вам такое: «Репортаж с места событий! Тайная миссия в Шале!»"
1010706-23 = "[s] «Тайная... миссия... в Шале?»"
1010706-24 = "Хи-хи, именно!"
1010706-25 = "[USERNAME]-Сенсей из Шале — знаменитость, о которой говорят все!"
1010706-26 = "Репортаж из первых рук об обычном дне Сенсея в Шале!"
1010706-27 = "Ну как? Такой заголовок сразу цепляет, правда?"
1010706-28 = "[s] «Эм...»"
1010706-29 = "То есть сегодня я здесь как представитель учеников, и у меня ЕСТЬ кодекс журналистской этики."
1010706-30 = "Разумеется, без вашего разрешения я бы такую статью не написала!"
1010706-31 = "Никакого давления. Если вы против, я всегда могу найти другую тему."
1010706-32 = "[s] «Ну, я не против репортажа, но...»"
1010706-33 = "Правда? Отлично, спасибо!"
1010706-34 = "...«Но»? Есть проблема?"
1010706-35 = "[s] «Не то чтобы проблема, просто...»"
1010706-37 = "[ns3] «Тебе станет скучно это писать.»\n[ns4] «Я в основном просто каждый день сижу здесь и работаю.»"
1010706-40 = ""
1010706-41 = "Не переживайте об этом! За кого вы меня принимаете?"
1010706-42 = "Я Мотомия Чиаки, секретарь студенческого совета Академии Геенна — Общества Пандемониума — и репортёр, редактор и издатель «Еженедельника Общества Пандемониума»!"
1010706-43 = "Где бы ты ни оказался, новости найдутся всегда!"
1010706-44 = "[s] «Эм... мне тогда нужно что-нибудь делать?»"
1010706-45 = "Нет, вовсе нет! Ведите себя как обычно!"
1010706-46 = "МОЯ работа — найти новость!"
1010706-47 = "И именно когда человек ведёт себя естественно, происходит самое интересное!"
1010706-48 = "[s] «Ну, если ты так хочешь...»"
1010706-49 = "Ага! Значит, разрешение у меня есть, да?"
1010706-50 = "Можно я похожу по Шале и сделаю несколько фотографий?"
1010706-51 = "[s] «Конечно, сколько захочешь.»"
1010706-52 = "Спасибо!"
1010706-54 = "Я оставил Чиаки заниматься своим делом и принялся за срочную работу."
1010706-55 = ""
1010706-57 = ""
1010706-58 = ""
1010706-59 = ""
1010706-60 = ""
1010706-61 = ""
1010706-62 = ""
1010706-63 = "А, эту марку стульев я узнаю где угодно. Ничего от меня не скроешь, Шале!"
1010706-64 = "Хм, хотя для новости этого маловато..."
1010706-65 = "Хоп! Может, под диваном найдётся что-нибудь интересное!"
1010706-66 = ""
1010706-68 = ""
1010706-70 = ""
1010706-71 = "Эм... Нет, только пыль..."
1010706-72 = "А, это геймпад?! Может, я выясню, в какие игры любит играть Сенсей!"
1010706-73 = "А? Он не ваш, его оставил кто-то из других представителей учеников? Понятно..."
1010706-74 = "М-м, иногда хорошую новость найти непросто..."
1010706-75 = "[s] «Я же говорил, ничего захватывающего тут не будет...»"
1010706-76 = "Я-я всё равно не сдамся!"
1010706-78 = "Несколько мгновений спустя..."
1010706-80 = "Эй, Сенсей? Простите, что отвлекаю от работы..."
1010706-81 = "Но вы обычно просто весь день сидите и печатаете?"
1010706-82 = "[s] «Просто сегодня у меня много срочных дедлайнов.»"
1010706-83 = "Ух, это превращается в худшую мою статью за всё время."
1010706-84 = "М-Может, стоит найти другую тему?"
1010706-85 = "Ха, мой острый как бритва репортёрский инстинкт..."
1010706-86 = "...всегда найдёт самый потрясающий эксклюзив!"
1010706-89 = "Несколько часов спустя..."
1010706-93 = "[ns] «Хр-р-р...»"
1010706-100 = "― [log=치아키]А-ха-ха! Да! Есть! Идеальный кадр! [/log][wa:2230]"
1010706-103 = "― [log=치아키]Сонное лицо Сенсея! Отлично подойдёт на обложку следующего выпуска![/log][wa:1820]"
1010706-106 = "― [log=치아키]На этом специальный выпуск «Еженедельника Общества Пандемониума» готов![/log][wa:860]"
1010706-109 = "― [log=치아키]Я, Чиаки, добыла ещё один эксклюзивный репортаж![/log][wa:1310]"
1010706-112 = "[ns] «Залезая под мой стол.»"
1010706-114 = "― [log=치아키]Хи-хи! Никогда не недооценивайте решимость секретаря![/log][wa:1400]"
1010706-117 = "― [log=치아키]О-о! А заодно, может, я смогу узнать и ваши секреты...![/log][wa:1520]"
1010706-119 = "― [log=치아키]Например, почему у вас дырки на носках?[/log][wa:1870]"
1010706-122 = "― [log=]Что?! Ваш секрет в том, что вы запираете непослушных студентов под своим столом...?[/log][wa:160]"
1010706-125 = "― [log=치아키]П-Простите! Пожалуйста, простите меня![/log][wa:2620]"
1010706-128 = "Ух... Иногда работа под прикрытием опасна..."
1010706-129 = "Меня за такое могли и запереть..."
1010706-130 = "[s] «Ты правда собираешься поставить моё сонное лицо на обложку?»"
1010706-131 = "Хи-хи, ну, я СОБИРАЛАСЬ..."
1010706-132 = "..."
1010706-133 = "...но могу использовать что-нибудь другое!"
1010706-134 = "Как бы я ни любила делать «Еженедельник Общества Пандемониума», мне хочется, чтобы читателям он тоже нравился! И вы в их числе, Сенсей!"
1010706-135 = "Так что да, найду фотографию получше!"
1010706-136 = "Хи-хи, вообще-то, может, вы поможете мне её найти?"
1010706-137 = "Думаю, с вами мне повезёт больше."
1010706-138 = "[s] «Да, и мне это поможет не заснуть. Пойдём посмотрим, что там происходит.»"
1010706-139 = "Ура! Спасибо!"
1010706-141 = "После этого мы с Чиаки ходили по разным местам Шале в поисках историй."
