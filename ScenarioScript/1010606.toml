[translation]
1010606-1 = "Я слышала, вам такое нравится"
1010606-2 = "Собор Тринити"
1010606-3 = "После разговора с Сакурако в MomoTalk я отправился в собор Тринити."
1010606-4 = "Кья-а-а! О нет, Сенсей? Вы уже здесь?"
1010606-5 = "Тревога, тревога! Сакурако ещё не готова!"
1010606-6 = "[s1] «...Сакурако?»\n[s2] «То, как ты говоришь...»"
1010606-9 = ""
1010606-10 = "Та-дам! Айдол Сакурако здесь!"
1010606-11 = "Ради Сенсея айдол Сакурако освободила весь день только для Сенсея!"
1010606-12 = "Что Сенсей хочет делать? Айдол Сакурако готова на всё вместе с тобой!"
1010606-13 = "Только скажи, ладно? А, но всё-таки..."
1010606-14 = ""
1010606-16 = ""
1010606-17 = ""
1010606-18 = "Сакурако"
1010606-19 = "[7cd0ff]   Сестринство[-]"
1010606-20 = "Нет!"
1010606-22 = "Нет! Разврату!"
1010606-24 = "Нет! Развратным! Делам!"
1010606-26 = "Нет! Развратным! Делам! Здесь! ♡"
1010606-29 = "[ns3] «Ч-Что за...?»\n[ns4] «С-Сначала объясни, что происходит, Сакурако!»"
1010606-32 = ""
1010606-33 = "...?"
1010606-34 = "Хм... Как странно."
1010606-35 = "Остальные уверяли меня, что это сработает. Неужели моя методика была неверна?"
1010606-36 = "Ведь я не получила желаемой реакции. Значит, что-то было не так..."
1010606-37 = "Хм?"
1010606-38 = "Вы хотите подробно услышать, что именно мне сказали остальные?"
1010606-39 = "Мм..."
1010606-40 = "*вздыхает* Полагаю, ничего не поделаешь. Если вспомнить всё, что происходило до сих пор..."
1010606-41 = "Я расскажу вам правду, пока ситуация окончательно не вышла из-под контроля."
1010606-42 = "Хотя правда совсем не такая уж невероятная. Мы просто хотели, чтобы вам было весело, Сенсей."
1010606-43 = "[s5] «Мне...?»\n[s6] «Весело...?»"
1010606-46 = "Да. Именно так."
1010606-47 = "Во время недавних событий вы очень помогли и Сестринству, и лично мне."
1010606-48 = "Поэтому мы все решили, что обязаны как-нибудь вас отблагодарить."
1010606-49 = "Но не смогли договориться, как именно. В конце концов, никто из нас толком не знает вас как человека, Сенсей."
1010606-50 = "Что вам нравится? Что приносит вам радость?"
1010606-51 = "Кто-то предлагал помочь вам с работой или вместе заняться волонтёрством — тем, чем обычно занимается сестра."
1010606-52 = "Но это был особый случай. Казалось, нужно что-то новое. И результат... что ж, вы сами его видели."
1010606-53 = "[s7] «Понятно, вот как вы к этому пришли...»\n[s8] «И поэтому ты ждала меня одна, Сакурако.»"
1010606-56 = "Да. Именно. Все сёстры помогали и предлагали свои идеи."
1010606-57 = "Так мы подготовили всё: мой костюм, сценарий и план действий. Даже составили для вас «Маршрут свидания с айдолом»."
1010606-58 = ""
1010606-60 = ""
1010606-61 = "Туда вошло несколько совсем-совсем маленьких деталей, которые я нашла во время поисков в интернете."
1010606-62 = "[s9] «(...Ну конечно.)»\n[s10] «(Совсем-совсем маленьких...?)»"
1010606-65 = "В любом случае, все сёстры согласились: «Сенсею точно понравится провести день с девушкой-айдолом»."
1010606-66 = "И почему-то именно меня выбрали исполнять этот план."
1010606-67 = "Полагаю, логично было поручить благодарность мне, ведь я представляю Сестринство."
1010606-68 = "Но... похоже, меня оказалось недостаточно. Прошу прощения."
1010606-69 = "[s11] «...Вовсе нет. Мне правда понравилось.»\n[s12] «...Спасибо, Сакурако. Я действительно счастлив.»"
1010606-72 = "...Сенсей? Вам совершенно не нужно изображать такой восторг."
1010606-73 = "...Что? Вы не притворяетесь? Вы серьёзно?"
1010606-74 = "Боюсь, я не понимаю. Когда вы впервые меня увидели, вы выглядели довольно озадаченным, так что именно вас порадовало...?"
1010606-75 = "...Намерение?"
1010606-76 = "Ах. Наше намерение выразить благодарность."
1010606-77 = "Но разве мы не выражаем его постоянно? Разве мы не говорим об этом довольно часто?"
1010606-78 = "Это как раз единственная часть всей ситуации, которая совершенно обычна."
1010606-79 = "Я могу сделать лишь один вывод: дело в этом костюме."
1010606-80 = "Хм?"
1010606-81 = "Костюм, конечно, новый, но дело не совсем в нём? Что вы имеете в виду?"
1010606-82 = "...Такое событие само по себе всегда даёт новые впечатления? Я не совсем понимаю."
1010606-83 = "[s13] «Ничего страшного, что сейчас ты не понимаешь.»\n[s14] «Это то, что чувствуют взрослые.»"
1010606-86 = "Эм... Вот как...?"
1010606-87 = ""
1010606-89 = ""
1010606-90 = "Хи-хи. Что ж, хорошо. Не вижу причин спорить с вашими чувствами. И, признаться, мне довольно приятно это слышать."
1010606-91 = "Хи-хи... Хи-хи..."
1010606-92 = "Хи-хи-хи-хи..."
1010606-93 = "[s15] «...Сакурако?»\n[s16] «У тебя вдруг лицо...?»"
1010606-96 = "Тогда... я приму ваши слова искренне и..."
1010606-97 = "...Сенсей?"
1010606-98 = "С этого момента начинается ваше особое время с айдолом Сакурако!"
1010606-99 = "Мы так зажжём, что вы ни о чём другом думать не сможете, так что готовьтесь! ♡"
1010606-101 = "После этого я прошёл особый маршрут свидания с айдолом(?), который Сакурако и Сестринство подготовили вместе."
1010606-102 = "Хотя большая часть происходящего была довольно странной для предполагаемого свидания с айдолом, мы всё равно отлично провели время."
