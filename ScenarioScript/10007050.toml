[translation]
10007050-1 = "Эпизод 5;Труд для Рабочей партии!"
10007050-3 = ""
10007050-4 = "Наш курорт горячих источников №227 может похвастаться не только отличными купальнями, но и прекрасным садом для прогулок гостей."
10007050-5 = "Конечно, поддерживать зелёный сад довольно сложно, ведь в академии Красной Зимы круглый год идёт снег, поэтому вместо этого..."
10007050-6 = "На нашем курорте №227 есть сухой сад, созданный из камней и песка с руин бывшего института."
10007050-7 = "[s] «Сухой сад?»"
10007050-8 = "Да! Сухой сад — это традиционный сад, состоящий только из камней, песка и мха."
10007050-9 = "Как учит дзен-буддизм, все стили садоводства в итоге возвращаются к земле; такой сад отличается сдержанностью и создаётся в духе строгого минимализма без излишеств."
10007050-10 = "Когда я смотрю на этот сад, мне становится так спокойно, что кажется, будто все мирские проблемы вообще не имеют значения..."
10007050-11 = ""
10007050-14 = "Порицаем! Порицаем!"
10007050-15 = "С-Спокойствие..."
10007050-16 = "Вон! Вон!"
10007050-17 = "Уф. Кто там ещё?! Я наслаждалась временем наедине с Сенсеем!"
10007050-18 = "Не могу поверить, что кто-то устраивает такой шум на курорте, созданном для отдыха. Даже если это гость, я всё равно выскажу ему всё, что думаю!"
10007050-19 = ""
10007050-21 = ""
10007050-23 = "Вход на курорт горячих источников №227"
10007050-24 = ""
10007050-25 = "Долой курорт горячих источников №227, попирающий права рабочих!"
10007050-26 = "Вон! Вон!"
10007050-27 = "Курорт горячих источников №227 должен компенсировать убытки Рабочей партии."
10007050-28 = "Компенсацию! Компенсацию!"
10007050-30 = "Я же говорю, это всё недоразумение!"
10007050-31 = ""
10007050-33 = ""
10007050-34 = "Ч-Что за шум? Почему здесь Рабочая партия?!"
10007050-35 = "Похоже, произошло какое-то недоразумение."
10007050-37 = "Хмф, наконец-то ты показалась."
10007050-38 = "Нодока, ты злобная буржуазная управляющая!"
10007050-39 = "Злобная буржуазная управляющая? Э-Это уже словесные оскорбления!"
10007050-40 = "Я даже не могу наслаждаться роскошной жизнью, потому что постоянно занята управлением этим местом!"
10007050-41 = ""
10007050-43 = ""
10007050-44 = "К-Кхм."
10007050-45 = ""
10007050-47 = ""
10007050-48 = "Что привело Рабочую партию на наш курорт горячих источников №227?"
10007050-49 = "П-Посмотрите на это лицо!"
10007050-50 = "Товарищи! Посмотрите на улыбку этой злобной буржуйки, насквозь пропитанной капитализмом!"
10007050-51 = "Не могу поверить, что раньше не замечала этого, когда мы вместе влачили жизнь в этих холодных и суровых землях..."
10007050-52 = "Но теперь, разбогатев, ты наконец показала своё истинное лицо, перебежчица!"
10007050-53 = "Постой! Когда это мы вообще вместе страдали?! И не придумывай мне странных прозвищ!"
10007050-54 = ""
10007050-56 = ""
10007050-57 = "Глубоко вдохни и объясни, почему вы протестуете, Минори. Вы мешаете окружающим."
10007050-58 = "Хмф, ты до сих пор не поняла, в чём проблема этого курорта."
10007050-59 = "Ну так просвети меня."
10007050-60 = "Наша претензия заключается в..."
10007050-62 = "Самом существовании этого курорта!"
10007050-64 = "Что?! Что это ещё за бред?!"
10007050-65 = "Мы что-то сделали Рабочей партии?! Мы с вами даже не разговаривали!"
10007050-66 = "Не притворяйся, будто ничего не знаешь! Мы всё это время наблюдали!"
10007050-67 = "Мы видели, как злой клуб горячих источников Геенны построил здесь курорт!"
10007050-68 = "...И в чём проблема?"
10007050-69 = "И-И в чём проблема?!"
10007050-70 = "Не могу поверить, что ты ещё и спрашиваешь! Клуб горячих источников никак не связан с академией Красной Зимы. Они..."
10007050-72 = "Внешняя рабочая сила!"
10007050-73 = "[s] «...Внешняя рабочая сила?»"
10007050-74 = "Когда в академии Красной Зимы начинались крупные общественные работы, именно мы, Рабочая партия, выполняли их, какими бы тяжёлыми и неприятными они ни были."
10007050-75 = "Условия труда были тяжёлыми и изнурительными, но... мы выдерживали, потому что гордились тем, что все здания академии Красной Зимы построены нашими руками."
10007050-76 = "Но новый курорт горячих источников, лучшая туристическая достопримечательность Красной Зимы, построила внешняя рабочая сила, а не Рабочая партия..."
10007050-77 = "Это серьёзно задело гордость членов Рабочей партии!"
10007050-78 = "Нас ранили! Нашу гордость ранили!"
10007050-79 = "Рабочая партия решительно протестует против произвола курорта горячих источников №227!"
10007050-80 = "Протестуем! Протестуем!"
10007050-82 = "П-Подождите. Этот курорт построили не потому, что мы этого хотели! Члены клуба горячих источников просто не оставили нам выбора!"
10007050-83 = "Сенсей, не стой просто так. Скажи что-нибудь!"
10007050-84 = "[s1] «Именно! Нодока тоже жертва клуба горячих источников!»\n[s2] «Нодока наверняка изначально вообще не хотела такого курорта.»"
10007050-85 = "Студенты спецотряда тоже жертвы клуба горячих источников?"
10007050-86 = "Хм, об этом я не подумала."
10007050-87 = "И-Именно! Если посмотреть с этой стороны, мы тоже жертвы, которые потеряли бывший институт из-за проекта клуба горячих источников!"
10007050-88 = "Верно, было бы неприятно, если бы в жилом районе без спроса возвели нежелательное незаконное сооружение."
10007050-89 = "Что ж, товарищ Нодока. Как собратья по несчастью, давай объединим силы против этого зла!"
10007050-90 = "И-Именно. Мы тоже не хотели этот курорт!"
10007050-91 = "О, тогда можно снести это незаконное сооружение, построенное без одобрения Рабочей партии?"
10007050-92 = "Чего-о-о?!"
10007050-93 = "Да ни за что мы собственными ногами не отпихнём от себя такой редкий шанс быстро разбогатеть!"
10007050-94 = "Так я и знала! Тебе не скрыть свою злобную натуру, мелкая буржуйка!"
10007050-95 = "Хмф, я была слишком добра! Я что, похожа на человека, которым можно помыкать?"
10007050-96 = "Я больше не потерплю ваших оскорблений! Рабочая партия, мы выставляем вас силой!"
10007050-97 = "Я знала, что этим всё и закончится. А мы не боимся каких-то отстранённых студентов спецотряда!"
10007050-98 = "Товарищи! За гордость и трудовые права Рабочей партии, а ещё..."
10007050-99 = "Э-э, за прочие важные вещи то тут, то там..."
10007050-100 = "В бой!"
