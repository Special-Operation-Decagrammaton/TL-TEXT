10028040-211 = "Сенсей...?"
10028040-212 = "...А? Почему Сенсей здесь?"
10028040-213 = "[s5] «Привет, Иори.»\n[s6] «Я тоже рад тебя видеть!»"
10028040-216 = "Привет, Сенсей. Почему мне кажется, что вас опять втянули в очередную нелепую и бессмысленную авантюру?"
10028040-217 = "Но куда важнее то, кто рядом с вами..."
10028040-218 = ""
10028040-219 = "...А, здравствуйте. Меня зовут Ичика."
10028040-220 = "Если позволите, я всё объясню..."
10028040-221 = "Ну надо же, ну надо же. Иори из Дисциплинарного комитета. Какая счастливая встреча!"
10028040-222 = "Как поживаешь? Как там Ако?"
10028040-223 = ""
10028040-225 = ""
10028040-226 = "Отлично, рада слышать. Так вот, раз уж ты здесь, не окажешь мне одну ма-а-аленькую... услугу?"
10028040-227 = "Мы ведь столько всего пережили вместе, правда? Ради старых времён... прошу?"
10028040-228 = "Секунду. Может, мне и не стоит вмешиваться, но..."
10028040-229 = ""
10028040-231 = ""
10028040-232 = ""
10028040-233 = "Разве вы двое не должны быть врагами?"
10028040-234 = ""
10028040-235 = ""
10028040-236 = "...Что..."
10028040-237 = "На что я вообще смотрю?! Что это за компания такая?"
10028040-238 = "Почему Отряд справедливости Тринити находится в поезде, который едет в Геенну?"
10028040-239 = "И... Касуми?"
10028040-240 = "Касуми, Сенсей?! Клянусь, если выяснится, что вы всё это время водились с ней..."
10028040-241 = "Ты всегда быстро всё схватывала, Иори!"
10028040-242 = "Хоть раз в жизни заткнись нахрен!"
10028040-243 = "Сенсей! Скажите мне правду! Вы ведь не помогаете Касуми сбежать?!"
10028040-244 = "Вы лучше всех знаете, сколько сил Дисциплинарный комитет потратил, пытаясь её поймать!"
10028040-245 = "...Что?"
10028040-246 = "Это вы сейчас обиделись?! Потому что я вам не доверяю??"
10028040-247 = "Сейчас НЕ время для шуток, Сенсей! Я вообще не понимаю, как всё это воспринимать! Вы же понимаете, насколько плохо всё это выглядит!"
10028040-248 = ""
10028040-250 = ""
