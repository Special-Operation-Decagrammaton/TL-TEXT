[translation]
10028040-1 = "Эпизод 4;Хороший, плохой, Тринити"
10028040-9 = ""
10028040-11 = ""
10028040-12 = "...А где вообще сейчас находится этот поезд?"
10028040-13 = "В трёх километрах позади нас, мэм, движется со скоростью 300 километров в час."
10028040-14 = "...Простите, 310... нет, уже 315 километров! Он быстро ускоряется."
10028040-15 = "Тц. Ускориться! Сравняемся с ним!"
10028040-16 = ""
10028040-18 = ""
10028040-19 = "Они едут больше 300 километров в час! Мы не успеем."
10028040-20 = "Это безумие... Через две минуты мы будем прямо рядом с ними!"
10028040-21 = "Возьми себя в руки! Страх нам здесь ничем не поможет!"
10028040-22 = "Скоро выходим на контакт! Всем машинам сохранять текущую скорость!"
10028040-23 = "Честно говоря, я не верила сообщениям о неуправляемом поезде, который пролетает станции..."
10028040-24 = "Что там происходит? Если так продолжится, они мигом доберутся до Геенны..."
10028040-25 = ""
10028040-27 = ""
10028040-28 = "Похоже, выбора нет. Придётся расследовать самим."
10028040-29 = "Остановить поезд и считать подозреваемыми всех! Готовиться к высадке!"
10028040-30 = "Есть, госпожа!"
10028040-31 = ""
10028040-33 = ""
10028040-36 = "Он ускоряется ещё сильнее?!"
10028040-37 = "Контакт через 15 секунд!"
10028040-38 = "Все! Приготовьтесь!"
10028040-39 = "Готовьтесь прыгать!"
10028040-40 = ""
10028040-42 = ""
10028040-43 = "...Начали!"
10028040-44 = ""
10028040-45 = ""
10028040-49 = ""
10028040-50 = ""
10028040-51 = ""
10028040-52 = ""
10028040-53 = "Сколько вагонов нам ещё осталось...?"
10028040-55 = "Хм. Сейчас посмотрим... Четыре? Нет, три!"
10028040-56 = "Мы почти на месте! Вахаха! Хорошо, хорошо!"
10028040-58 = "Хаха... И правда, как я вообще здесь оказалась?"
10028040-59 = "Мы продвигаемся благодаря хаосу, который устроили разозлённые пассажиры... Решение бригады пропускать станции оказалось скрытым благословением."
10028040-60 = ""
10028040-62 = ""
10028040-63 = "Но без неё, поднявшей толпу, мы бы не справились... В ней есть определённая харизма."
10028040-64 = "...Касуми не обычная преступница."
10028040-65 = "Чутьё говорит мне, что связываться с ней ещё сильнее может обернуться проблемами..."
10028040-66 = "Если бы я не потеряла сумку, мы бы сейчас вообще здесь не были..."
10028040-67 = "Угх..."
10028040-68 = "[ns1] «Не нужно тащить всё на себе одной, Ичика...»\n[ns2] «Давай. Пойдём найдём твою сумку.»"
10028040-71 = "Ты знаешь, что часто разговариваешь сама с собой?"
10028040-72 = "И знаешь что ещё? Мне кажется, мы с тобой очень похожи."
10028040-74 = "Простите?"
10028040-75 = "Какое странное заявление. Мы? Похожи?"
10028040-76 = "Мы буквально из двух разных миров. Я член Спецотряда правосудия из Общей школы Тринити. А ты преступница из Геенны."
10028040-77 = "Мы скорее полные противоположности."
10028040-79 = "Вот как ты думаешь? А у меня совсем другой взгляд!"
10028040-80 = "Глу-у-убоко внутри ты на самом деле не чувствуешь, что вписываешься среди других очаровательных студентов Тринити."
10028040-81 = "В моём мире тебе немного комфортнее, правда? Вахахаха!"
10028040-83 = "Ха. Я всё ждала, какую чушь ты сейчас выдашь."
10028040-84 = "Ты смешная. Я бы бросила тебя без секунды раздумий, если бы мне не нужна была сумка."
10028040-86 = "Вахахаха! Хорошо-хорошо! Пока пусть будет так."
10028040-87 = "Но тебе не нужно так спешить спрыгивать с поезда, ясно? Только неопытные новички торопятся во время преступления."
10028040-88 = "Когда до цели всего три вагона, надежда резко растёт, да? Будто финиш уже совсем рядом."
10028040-89 = ""
