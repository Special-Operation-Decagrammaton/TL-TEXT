10028040-126 = "Хотя даже я скажу: пушка — это немного драматично!"
10028040-128 = "Это не пушка! Это артиллерийское устройство подавления беспорядков!"
10028040-130 = "А смысл пролетает прямо над их головами..."
10028040-131 = ""
