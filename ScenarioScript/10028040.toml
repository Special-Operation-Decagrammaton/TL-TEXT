10028040-106 = "Хочу ли я знать, что именно значит «это» ?"
10028040-107 = "Это для меня сюрприз-вечеринка? Как волнительно!"
10028040-108 = "Вы, негодяи! Думали, мы и дальше будем просто отступать перед вами?!"
10028040-109 = "Мы подготовились! Выжидали! Всё ради этого самого момента!"
