10028040-199 = "О, о! И правда вы! Рада видеть вас здесь, Дисциплинарный комитет!"
10028040-200 = "Вы не слышали, что я сказала? Немедленно прекратите двигаться!"
10028040-201 = ""
10028040-202 = ""
10028040-203 = ""
