10028040-182 = "Бросить оружие и поднять руки!"
10028040-183 = "Никому не двигаться!"
10028040-184 = "Ч-Что происходит? Почему они здесь?!"
10028040-185 = "Они... запрыгнули на движущийся поезд?! Это уже какой-то особый вид безумия!"
10028040-186 = "На такой скорости? С другого поезда?!"
10028040-187 = "Я просто не верю своим глазам. Поезд всё ещё едет!!"
