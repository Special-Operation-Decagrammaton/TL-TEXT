[translation]
34050-1 = "Episódio 5;Buscadores Incompreensíveis"
34050-3 = "..."
34050-4 = "..."
34050-5 = "Você se lembra de que, a seu pedido, emprestei o meu poder a você, não é?"
34050-6 = "Refiro-me a quando repliquei as guardiãs dos preceitos para colaborar com o seu plano."
34050-7 = "Sim, e sou muito grata por isso, Maestro. Graças a você, consegui obter um poder ainda maior em meu domínio."
34050-8 = "Não me lembro de ter autorizado que você usasse aquilo em causa própria. Para começo de conversa, jamais permiti que minhas obras fossem utilizadas dessa maneira."
34050-9 = "Aquele fenômeno não é propriedade sua, Maestro."
34050-10 = "...Que insolência. Eu não estou reivindicando posse sobre ele, aquilo é—"
34050-11 = "Insolência? Como ousa... falar comigo nesse tom?"
34050-12 = "Ora, ora... Acalmem-se, vocês dois. Não vamos criar um tumulto por causa disso."
34050-13 = "É isso aí!"
34050-14 = "...Peço desculpas. Certamente, o Maestro acredita que realizar uma interpretação original através de um fenômeno universal é a sua própria forma de expressão."
34050-15 = "..."
34050-16 = "Contudo, da perspectiva da Madame, esse talvez seja um detalhe que não precisa ser levado em consideração. Afinal, todos nós temos maneiras diferentes de interpretar este mundo."
34050-17 = "— Em outras palavras, você está incomodado porque eu tomei as armas do Maestro por conta própria, não é?"
34050-18 = "...O que você faz não é arte. Não há estética nem nada parecido nisso, é apenas o ato de produzir armas de guerra."
34050-19 = "Sim, exatamente. Algum problema com isso?"
34050-23 = "Além do mais, não foi só com você. Estou usando da mesma forma tanto a tecnologia fornecida pelo Terno Preto quanto o texto interpretado por Golconde."
34050-25 = "..."
34050-26 = "..."
34050-27 = "Eu não tenho o menor interesse na arte de vocês. Acredito que deixei isso claro desde o momento em que me tornei membro da \"Gematria\"."
34050-28 = "Hehehe... Exatamente. E, por mim, não há problema algum nisso."
34050-29 = "Não há necessidade de brigarmos entre companheiros."
34050-30 = "Ela garantiu um domínio próprio em Kivotos. Para o nosso plano, ela é a presença mais indispensável no momento."
34050-31 = "O Distrito Autônomo de Arius, certo? Colocar todas as alunas e a academia daquele lugar sob o seu controle é, sem dúvida, um grande feito."
34050-32 = "(...!!)"
34050-34 = "O que houve com o Terno Preto em Abydos foi uma pena, mas... opa, perdão. Não tive a intenção de ser irônico."
34050-35 = "Hehe... Não se preocupe. De fato foi uma pena, mas... a existência daquele Sensei não estava nos meus cálculos."
34050-36 = "...A \"Schale\". Aquela pessoa, não é? O nosso adversário."
34050-37 = "É isso aí!"
34050-39 = "(...!!)"
34050-40 = "Não. Não devemos nos opor àquela pessoa. Pelo contrário, seria muito melhor trazê-la para o nosso lado."
34050-41 = "Pessoalmente, também tenho um enorme apreço por ele. Aquela pessoa pode vir a ser alguém capaz de nos compreender."
34050-42 = "Eu ainda estou reservando o meu julgamento, mas... se ele pudesse se juntar a nós como a Beatrice fez..."
34050-44 = "Que pensamento tolo e indolente. O Sensei da \"Schale\" deve ser eliminado a qualquer custo."
34050-45 = "..."
34050-46 = "..."
34050-47 = "..."
34050-49 = "Vejo que preciso me explicar. Pois bem, já que estamos aqui, vamos repassar tudo passo a passo."
34050-50 = "Desde que Misono Mika visitou o Distrito Autônomo de Arius, ela tem me ajudado com muitas coisas."
34050-51 = "(...A Mika?)"
34050-52 = "Sim... Por assim dizer, Misono Mika é quem me traz inspiração... Poderíamos chamá-la de minha musa."
34050-53 = "Tanto a ideia de usar o \"Tratado do Éden\" para assegurar a majestade ancestral, quanto a decisão de eliminar primeiro o arcanjo dos sonhos proféticos, só puderam ser concretizadas graças a ela."
34050-54 = "Afinal, o melhor a se fazer com uma existência tão incômoda quanto uma profetisa é descartá-la o mais rápido possível. Agradeço a Decalcomanie... digo, a Golconde, por fornecer uma técnica tão rara."
34050-55 = "É isso aí!"
34050-56 = "Eu apenas forneci o texto; quem deu forma a ele foi a Madame."
34050-57 = "Além disso, essa mesma técnica não acabou atrapalhando os seus próprios passos, Madame?"
34050-58 = "Sim... porém, graças ao sistema de defesa que plantei previamente no corpo do sacrifício, consegui me salvar. Eu lhe agradeço, Terno Preto."
34050-59 = "...Hehehe. Fico feliz que a tecnologia dos Sacerdotes Sem Nome tenha sido útil."
34050-60 = "E a última inspiração que Misono Mika me deu... foi justamente sobre o Sensei da \"Schale\"."
34050-61 = "Como ela convidou o Sensei para Trinity, pude tomar conhecimento de sua existência e analisá-lo."
34050-63 = "O único motivo pelo qual escolhi o Distrito Autônomo de Arius como alvo foi puramente por ser um local oculto, sem nenhum significado além disso."
34050-64 = "\"Trinity\" ou \"Gehenna\"... A raiva e o ódio direcionados a elas... não têm a menor importância para mim."
34050-66 = "O \"ódio\" não passa de um meio para controlar as crianças, o \"Tratado do Éden\" é apenas um método para obter o poder das guardiãs, e o \"Esquadrão\" não é nada mais que uma ferramenta descartável."
34050-67 = "Se Misono Mika não tivesse trazido o Sensei para Trinity, eu provavelmente sequer teria dado atenção àquela pessoa. Contudo... eu vi a atuação dele com os meus próprios olhos..."
34050-69 = "Quando aquilo intervém, todo o significado que detenho acaba sendo alterado. Aquela pessoa é perigosa."
34050-70 = "..."
34050-71 = "Foi então que percebi. Para concretizar o meu plano, a primeira coisa que devo fazer é apagar o \"Sensei\"."
34050-72 = "Um verdadeiro antagonista, não é..."
34050-73 = "Hum..."
34050-74 = "Parece que a minha decisão não lhes agrada, mas... de qualquer forma, somos seres que apenas buscam seus próprios objetivos. Vocês não têm o direito de interferir no meu caminho."
34050-75 = "...Sim, não temos esse direito. Faça como bem entender, Beatrice."
34050-76 = "..."
34050-77 = "..."
34050-78 = "No entanto, você nunca nos contou em detalhes no que consiste exatamente o seu plano. Madame, o que você está fazendo no Distrito Autônomo de Arius?"
34050-79 = "Estou preparando um altar."
34050-80 = "Um altar...?"
34050-81 = "Em essência, não é diferente do que você estava tentando fazer em Abydos. A única diferença é que não tenho a intenção de firmar um contrato."
34050-82 = "Oh, um ritual em vez de um contrato, é...? Embora originalmente se possa considerar que os dois são a mesma coisa..."
34050-83 = "E para executar isso, a existência do Sensei certamente será um obstáculo?"
34050-84 = "Sim, exato... E já tomei as devidas providências."
34050-85 = "O \"Esquadrão\" cuidará de eliminar o Sensei."
34050-87 = "(...!!!)"
34050-88 = "..."
34050-89 = "...Entendo, o Esquadrão, hein."
34050-90 = "São peças descartáveis das quais eu já pretendia me livrar, mas disse a elas que lhes daria uma chance de perdão caso matassem o Sensei. Para elas, é uma proposta irrecusável."
34050-91 = "N-Não pode ser...! O Sensei está... em perigo...!"
34050-92 = "(...Argh!?)"
34050-93 = "...Ao que parece, há um rato escondido por aqui."
34050-94 = "...!!"
34050-95 = "Aqui? Mas não há ninguém aqui além de nós..."
34050-96 = "Parece que falei um pouco demais. Vou me retirar por hoje."
34050-100 = "..."
34050-101 = "..."
34050-110 = "...Hah, hah."
34050-111 = "...Hah, hah, hah... hah..."
34050-112 = "(Aquela cena de agora há pouco... O que foi aquilo...?)"
34050-113 = "U-Ugh...!"
34050-114 = "Cof, cof, cof...!"
34050-115 = "(O Distrito Autônomo de Arius já estava sob o domínio da Gematria...!?)"
34050-116 = "Cof, cof..."
34050-118 = "(...Meu corpo não me obedece. Minha consciência está... Mas...)"
34050-119 = "(A \"educação\" das alunas de Arius, o fato de não termos conseguido encontrar a localização do Distrito Autônomo até hoje... aquela tecnologia desconhecida... e até a bomba que destrói halos... Tudo...)"
34050-120 = "(Se tudo isso estiver conectado à Gematria... então todas as peças se encaixam...)"
34050-121 = "(Se o \"Esquadrão\" está atrás do Sensei...)"
34050-122 = "(O Sensei está em perigo... Preciso avisar alguém depressa...)"
34050-124 = "(Elas já atacaram o Sensei uma vez... Provavelmente, a coisa mais perigosa de toda Kivotos...)"
34050-125 = "(...A bomba que destrói halos.)"
34050-126 = "(O atentado contra a minha vida... o colapso do Tratado do Éden... todas que saíram feridas... e o Sensei ter sido colocado em perigo... Tudo isso...)"
34050-128 = "(Se existe um ponto de partida... para tudo isso... então foi...)"
34050-135 = "Hã... Ér, olá, Seia-chan..."
34050-137 = "...Mika."
34050-142 = "Próximo;Asas Quebradas"
