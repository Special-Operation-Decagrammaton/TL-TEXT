[translation]
34050-1 = "Эпизод 5;Непостижимые искатели"
34050-2 = ""
34050-3 = "..."
34050-4 = "..."
34050-5 = "Я великодушно позволил вам воспользоваться моим искусством. Самим выражением моей души."
34050-6 = "Чтобы помочь вам, я даже воплотил хранителей заповедей как Мимесисы. Я воплотил ваш грубый план в жизнь."
34050-7 = "И я так, так благодарна за вашу помощь. Только взгляните, насколько теперь сильны мои владения."
34050-8 = "Мне не нужна ваша банальная благодарность. То, как вы сейчас присвоили мою работу, — прямое оскорбление меня. А оскорблять меня неразумно."
34050-9 = "О! Приношу самые искренние, глубочайшие извинения. Я не знала, что именно вы лично разработали феномен Мимесиса!"
34050-10 = "Вы смеете насмехаться? Вашей наглости нет предела."
34050-11 = "Ха! Меня ещё никогда не обвинял в наглости кто-то ниже меня."
34050-12 = "Ха-ха-ха! Может, все вместе попробуем дыхательные упражнения? Возможно, это поможет говорить потише."
34050-13 = "Конечно!"
34050-14 = "Какое забавное противоречие! С одной стороны, наш уважаемый Маэстро утверждает, что процесс Мимесиса принадлежит тому, кто его обуздал."
34050-15 = "..."
34050-16 = "А с другой — наша дорогая Мадам утверждает, что владеть поводком ещё не значит владеть зверем! Поразительно, поразительно!"
34050-17 = "Хоть раз за всё своё безмозглое существование научись держать мнение при себе, Голконда. Ты выдумываешь смысл там, где есть лишь истерика."
34050-18 = "Вы оскверняете мою работу, а затем смеете принижать меня? Вы создаёте оружие, не думая об искусстве! Вы ничего не понимаете в метафорах! В страсти!"
34050-19 = "Прошу, ваша истерика вам не к лицу. Там, где есть сила, искусство не нужно. И ваше так называемое искусство никогда бы не увидело свет без помощи Чёрного костюма и Голконды."
34050-20 = ""
34050-22 = ""
34050-23 = "Скажите, Маэстро. Вы боитесь? Боитесь силы, которую я накопила с помощью вашей работы? ...Может, боитесь, что вы нам больше не нужны."
34050-25 = "..."
34050-26 = "..."
34050-27 = "Запомните мои слова: ещё раз заговорите со мной о своём маленьком художественном проекте — и я уйду отсюда вместе со своими владениями. А вам останется лишь ваша страсть."
34050-28 = "Ха-ха-ха! Что сделано, то сделано. Оба успокойтесь."
34050-29 = "Не будем терять голову из-за терминологии. Без обид, Голконда."
34050-30 = "Беатриче получила собственные владения в Кивотосе. Уже одно это делает её бесценной для нашего плана, Маэстро."
34050-31 = "Она подчинила всех этих злых маленьких студентов в районе Ариуса! Ха-ха-ха! Прекрасный шаг вперёд для всех нас."
34050-32 = "(...!)"
34050-34 = "В конце концов, все мы видели катастрофу Чёрного костюма в Абидосе... Ой! Кажется, это было грубо!"
34050-35 = "Ха-ха! Ты всего лишь сказал правду, Голконда. Признаю, я не учла учителя в своих планах."
34050-36 = "...Шале. Этот Сенсей — помеха."
34050-37 = "Конечно!"
34050-39 = "(...!)"
34050-40 = "Помеха, да. Но она может стать бесценным активом, если убедить перейти на нашу сторону."
34050-41 = "Ах, Сенсей! Вот кто понимает искусство!"
34050-42 = "А что, если превратить их в одного из нас? Как мы сделали с Беатриче! Ей как раз не помешает друг."
34050-44 = "Вы все непостижимо глупы. Нужно устранить преподавателя Шале, иначе всё сделанное нами будет напрасно."
34050-45 = "..."
34050-46 = "..."
34050-47 = "..."
34050-49 = "*вздох* Неужели я всегда должна быть окружена некомпетентностью?"
34050-50 = "Позвольте объяснить словами, которые вы трое сможете понять. Всё начинается с Мисоно Мики."
34050-51 = "(...Мика?)"
34050-52 = "Мика — моя муза, моё вдохновение. Вот метафора, которая вам понравится."
34050-53 = "Именно благодаря ей я придумала получить древнюю силу через Эдемский договор. Без Мики я бы никогда не осознала, а затем не устранила подавляющую угрозу пророческого архангела."
34050-54 = "Я снова должна поблагодарить вас и Декалькоманию, Голконда, за столь редкую технологию."
34050-55 = "Конечно!"
34050-56 = "Ох, прошу! У меня был лишь рецепт. Без нашего уважаемого повара никакой бомбы бы не получилось."
34050-57 = "Если честно, мне даже было немного совестно! Ха-ха-ха! Разве наш маленький шедевр не доставил вам неприятностей?"
34050-58 = "Почти. Но благодаря Чёрному костюму мне удалось встроить защитную систему в тело подношения."
34050-59 = "Всегда рад помочь. Технологии безымянных жрецов оказались полезнее, чем я ожидал."
34050-60 = "Именно. И это подводит меня к последнему вдохновению, которое дала мне Мисоно Мика: Сенсей."
34050-61 = "Если бы эта девчонка не обратилась к Шале, я бы не получила возможности наблюдать за Сенсеем собственными глазами."
34050-63 = "Тогда я и увидела силу Сенсея. Я выбрала Ариус целью лишь из-за их изоляции и анонимности. Там меня никто не нашёл бы."
34050-64 = "Тринити, Геенна, Ариус... Мне было всё равно, кто из них кто. Их маленькие конфликты и гниющая между ними ненависть меня совсем не заботили."
34050-66 = "Важно было лишь то, что ненависть удобна для контроля. Эдемский договор был всего лишь способом получить новую силу. Отряд и остальные в лучшем случае были расходным материалом."
34050-67 = "Но Сенсей... Они ворвались в мою идеально выстроенную сцену, неся чушь о спасении студентов и их мечтаний. И каким-то образом их методы сработали."
34050-68 = ""
34050-69 = "Я больше не стану недооценивать Шале и их учителя. Их вмешательство меняет сам смысл нашей работы."
34050-70 = "..."
34050-71 = "Сенсея нужно устранить."
34050-72 = "Беатриче разошлась! Наконец нашла достойного противника!"
34050-73 = "Хм... Не могу сказать, что полностью согласен."
34050-74 = "Ты собираешься меня остановить? Может, нас и свела общая цель, но выполнять приказы — не моя сильная сторона."
34050-75 = "...Я прекрасно знаю. Делай как хочешь, Беатриче."
34050-76 = "..."
34050-77 = "..."
34050-78 = "Куда больше меня интересует другое: что ты собираешься делать с районом Ариуса?"
34050-79 = "Я готовлю алтарь."
34050-80 = "Любопытно. С какой целью?"
34050-81 = "С той же, которую ты пытался достичь в Абидосе. Просто я предпочла ритуал... более соответствующий моему вкусу."
34050-82 = "Ха-ха! Ты точно не из тех, кто заключает честные сделки. Но условия твой метод всё равно выполняет. Отличная работа."
34050-83 = "И ты правда считаешь Сенсея достаточно сильным, чтобы помешать?"
34050-84 = "Да. Именно поэтому я уже приняла меры."
34050-85 = "Я отправляю отряд устранить Сенсея."
34050-87 = "(...!!!)"
34050-88 = "..."
34050-89 = "...Отряд, значит?"
34050-90 = "Я пообещала им прощение в обмен на голову Сенсея. Получат они его или нет — зависит от моего настроения."
34050-91 = "Сенсей в опасности! Нужно кого-нибудь предупредить!"
34050-92 = "(...Что?!)"
34050-93 = "...Какая-то ничтожная муха подслушивает."
34050-94 = "...!"
34050-95 = "Один, два, три, четыре... Я насчитываю только четверых!"
34050-96 = "Хватит. На этом закончим."
34050-97 = ""
34050-99 = ""
34050-100 = "..."
34050-101 = "..."
34050-102 = ""
34050-105 = ""
34050-107 = ""
34050-108 = ""
34050-110 = "*тяжело дышит* *тяжело дышит*"
34050-111 = "*задыхается* *задыхается*"
34050-112 = "(Что... я сейчас увидела...?)"
34050-113 = "У-Ух!"
34050-114 = "*кашель* *кашель*"
34050-115 = "(Районом Ариуса управляла Гематрия?!)"
34050-116 = "*кашель* *кашель-кашель*"
34050-118 = "(Всё такое... мутное... Соберись, Сэя...!)"
34050-119 = "(Подготовка студентов Ариуса, причина, почему район невозможно было найти... иностранные технологии... бомба, разрушающая нимб...)"
34050-120 = "(Всё... всё связано с Гематрией... Теперь всё сходится.)"
34050-121 = "(И отряд охотится за жизнью Сенсея.)"
34050-122 = "(Сенсей в опасности...! Я должна кому-нибудь сказать!)"
34050-124 = "(Во время атаки на Эдемский договор он едва не погиб...)"
34050-125 = "(...А их бомба... во всём Кивотосе нет ничего опаснее.)"
34050-126 = "(Мне угрожали смертью... Эдемский договор рухнул... Все пострадали... Сенсей чуть не умер...)"
34050-128 = "(Отправная точка всего этого... это...)"
34050-129 = ""
34050-131 = ""
34050-135 = "Эм... Привет, Сэя..."
34050-137 = "Мика."
34050-138 = ""
34050-140 = ""
34050-142 = "Следующий эпизод;Сломанные вещи"
