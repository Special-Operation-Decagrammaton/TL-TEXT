[translation]
80000114-1 = "Секрет на двоих"
80000114-2 = "Поздним днём я работал в офисе, когда ко мне пришла посетительница."
80000114-3 = ""
80000114-7 = ""
80000114-8 = "Ибуки пришла, Сенсей!"
80000114-9 = "Как дела?"
80000114-10 = "[s] «Давно не виделись, Ибуки!»"
80000114-11 = "Хи-хи-хи, вопрос!"
80000114-12 = "Почему Ибуки сегодня пришла в Шале?"
80000114-13 = "[s1] «Хм... Чтобы увидеть Сенсея?»\n[s2] «Легко! Ты хотела поиграть с Сенсеем!»"
80000114-16 = "Почти! Вчера это было бы правильно... но сего-о-одня всё иначе!"
80000114-17 = "Сегодня Ибуки пришла кое-что подарить вам, Сенсей!"
80000114-18 = "Та-дам! Вот!"
80000114-19 = ""
80000114-21 = ""
80000114-22 = ""
80000114-25 = "Ибуки слышала, что сегодня Варен...? Валента...? Какой-то День В!"
80000114-26 = "Хи-хи, Ибуки не знает, что это значит, но слышала, что в этот день надо делиться с Сенсеем чем-нибудь сладким!"
80000114-27 = "Поэтому Ибуки сделала это для вас!"
80000114-28 = "Особый шоколадный пудинг Ибуки!"
80000114-29 = "[s] «Выглядит потрясающе!»"
80000114-30 = "Правда? Правда?"
80000114-31 = "Ибуки добавила туда самый сладкий шоколад и самые вкусные сладости, которые когда-либо пробовала!"
80000114-32 = "Будет супер-пупер вкусно, Сенсей! Вы обязаны попробовать!"
80000114-33 = "[s3] «Хорошо, попробовать?»\n[s4] Приятного аппетита."
80000114-34 = ""
80000114-35 = ""
80000114-39 = "Как вам, Сенсей? Вкусно?"
80000114-40 = "[s5] «Сладко и вкусно!»\n[s6] «Очень сладко! Вкусно... потому что так сладко!»"
80000114-43 = "(пристально смотрит)"
80000114-44 = "[ns] Откусить ещё."
80000114-45 = ""
80000114-47 = "*глоть*"
80000114-48 = ""
80000114-51 = "[ns] «Ты тоже хочешь, Ибуки?»"
80000114-52 = "Н-Нет!"
80000114-53 = "Шоколадный пудинг — подарок для Сенсея... Но... Но..."
80000114-54 = "Ибуки ещё не ужинала."
80000114-55 = "Старшие сказали Ибуки не есть сладости перед ужином..."
80000114-56 = "Ибуки надо вернуться и поужинать, так что весь шоколадный пудинг можете съесть вы."
80000114-57 = "[s] «Я очень горжусь, что ты слушаешься старших, Ибуки.»"
80000114-58 = "Д-Да..."
80000114-59 = "[s] «Но раз старших здесь нет... может, один маленький кусочек можно?»"
80000114-60 = "*ахает*"
80000114-61 = "Н-Но... старшие сказали... Ибуки тогда не сможет нормально поужинать..."
80000114-62 = "*глоть*"
80000114-63 = "[s] «Поэтому и надо попробовать крошечный кусочек так, чтобы они не узнали.»"
80000114-64 = "Чтобы они не узнали?"
80000114-65 = "[s] «Да, это будет наш секрет!»"
80000114-66 = "Секрет... с Сенсеем..."
80000114-67 = "О-о! Ибуки нравится!"
80000114-68 = "Но, Сенсей, вы должны держать это в секрете, хорошо? Ибуки тоже никому не скажет!"
80000114-69 = "[s] «Конечно!»"
80000114-70 = "Хи-хи, спасибо за угощение!"
80000114-72 = "После этого я поделился пудингом с Ибуки. Старшие так ничего и не заподозрили."
