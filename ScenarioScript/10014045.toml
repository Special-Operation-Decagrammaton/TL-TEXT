10014045-5 = "А разговоров-то было... Она оказалась не такой уж сильной."
10014045-6 = "Она не двигается. Потеряла сознание?"
10014045-7 = "Ну, нас всё-таки четверо... и даже Сенсей нас поддерживает..."
10014045-8 = "Господи. Во что мы вообще ввязались?"
10014045-9 = "Нашу банду уже не остановить! На этой волне захватим все окрестности!"
10014045-10 = "Кат..."
10014045-11 = "Кат Па..."
10014045-12 = "...Кат Палуг."
10014045-14 = "К-Крутое имя, но это ведь... неправда, да? Случайно?"
