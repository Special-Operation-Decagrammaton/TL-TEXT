10014045-18 = "Пожалуйста..."
10014045-19 = "Пожалуйста, прекратите это..."
10014045-20 = "[s1] «Все просто пытаются найти способ стать тебе ближе, Казуса.» \n[s2] «Пусть они немного заблуждаются, но намерения у них хорошие.»"
10014045-21 = "*вздыхает* ...Конечно, вы бы именно так это и подали."
10014045-22 = "*вздыхает* ...Конечно, вы бы именно так это и подали."
