10014045-25 = ""
10014045-26 = "Нет. Я так больше не могу."
10014045-27 = "Простите, но с меня хватит. Мне нужно высказать всё, что я думаю."
10014045-28 = "...Все."
10014045-29 = "Хватит этого! Это незрело и по-детски."
10014045-30 = ""
10014045-33 = ""
10014045-35 = "Та идиотка и без того достаточно усложняет мне жизнь. Пожалуйста, не делайте ещё хуже."
10014045-36 = "...!"
10014045-37 = "...?!"
10014045-38 = "К-Казуса! Всё не так! Пожалуйста, дай нам объяснить."
10014045-39 = "Если ты благородно переживаешь, что втягиваешь нас в опасные дела, то уже поздно."
10014045-40 = "Мы уже ввязались в это вместе с тобой."
10014045-41 = "А-А-А!! Хватит! Все замолчите! Дайте сначала ей сказать!"
10014045-42 = "...Да, мэм."
10014045-43 = ""
10014045-45 = ""
10014045-46 = "*вздыхает* ...Спасибо, Ёшими. От тебя я меньше всего ожидала благоразумия."
10014045-47 = "Я понимаю, правда, и ценю это. Но мне действительно нужно, чтобы вы прекратили."
10014045-48 = "Жест хороший, но быть бандитом — не то, чем стоит хвастаться."
10014045-49 = "Я бы предпочла сделать вид, что ничего этого не было. Пусть прошлое останется в прошлом."
10014045-50 = "Н-Но..."
10014045-51 = "Вы уже слышали мою историю, но позвольте сказать, что я сама об этом думаю."
10014045-52 = "Я пытаюсь стереть всё это. Всё, что произошло, и всех, кого раньше знала. Вот и всё."
10014045-53 = "Я не хочу раздувать из этого проблему. Давайте просто вернёмся к тому, как всё было до того, как вы узнали. Пожалуйста?"
10014045-54 = "А насчёт неё..."
10014045-55 = "...Неважно. Я слишком устала. Если понадобится, поговорим потом."
10014045-56 = "Тогда... я пойду."
