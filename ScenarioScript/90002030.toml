[translation]
90002030-1 = "Эпизод 3;Мобилизация"
90002030-2 = "Итак, давайте разберём ситуацию."
90002030-3 = "Мы узнали кое-что новое и получили новую проблему. С чего начнём?"
90002030-5 = "Разбираться с «проблемой» обычно сложнее, поэтому начнём с того, что выяснили."
90002030-7 = "Наконец у нас появились проверяемые данные о новых подразделениях Декаграмматона, которые атаковали нас в хранилище семян Тиферет и здесь."
90002030-8 = "Это конкретное подразделение называется Рабочий."
90002030-10 = "«Рабо...чий»?"
90002030-11 = ""
90002030-15 = "Да. Работник. Подходящее название для его функции."
90002030-16 = "По собранным данным нам удалось подтвердить три разных типа Рабочих."
90002030-17 = "Да. Я тоже это заметила. Прямоугольная модель была оснащена тяжёлой бронёй."
90002030-18 = "Да! Именно! Её было очень трудно пробить!"
90002030-19 = "Проще говоря, Защитный Рабочий."
90002030-20 = "Далее, у этого Рабочего броня была легче, чем у Защитного, но на нём была установлена большая турель."
90002030-22 = "Дизайн немного... Ну, назовём его Турельным Рабочим!"
90002030-23 = "А-А ещё... Был Рабочий поменьше, похожий на базовую форму двух остальных..."
90002030-25 = "Тогда его можно назвать Базовым Рабочим. Остальные, скорее всего, созданы на его основе."
90002030-26 = "Хотя вещи меньше обычного обычно считают милыми, эта паукообразная... штука не обладает в этом плане ни одним достоинством."
90002030-27 = "Разве не все считают пауков милыми?"
90002030-28 = "Большинство — нет... Хотя в вопросах эстетики ты вообще мало похожа на «большинство» людей..."
90002030-30 = "Президент. Рио, давайте продолжим."
90002030-31 = "[s] «Вы выяснили что-нибудь ещё?»"
90002030-32 = ""
90002030-34 = ""
90002030-35 = "Да. И это самое важное открытие."
90002030-36 = "Похоже, Рабочие отвечают за преобразование органического вещества в материал для Стального континента."
90002030-37 = "То есть...?"
90002030-38 = "Так это они... строили эту штуку под названием Стальной континент?"
90002030-39 = "Вероятно, не с самого начала."
90002030-40 = "Рабочих, скорее всего, начали массово производить уже после создания Стального континента."
90002030-41 = "Однако я предполагаю, что Рабочие подошли к нашему транспортному кораблю, чтобы превратить его в часть Стального континента."
90002030-42 = "Мы не смогли просмотреть журналы данных каждого Рабочего. При таком их количестве это было бы невозможно."
90002030-43 = "Но по тому, что мы видели, похоже, Рабочие реорганизуют внутреннюю структуру Стального континента, который расширился с невероятной скоростью."
90002030-44 = "Что ты имеешь в виду под... «реорганизуют»?"
90002030-45 = "Они возводят его внешнюю структуру и одновременно ремонтируют повреждённые участки."
90002030-46 = "И всё это, параллельно преобразуя неорганическое вещество, которое Стальной континент затем поглощает."
90002030-47 = "Вот почему они набросились на наш корабль..."
90002030-49 = "Понятно. Тогда в чём проблема, президент?"
90002030-50 = "Ну, сказать гораздо проще, чем сделать."
90002030-51 = ""
90002030-53 = ""
90002030-54 = "Нам придётся прорваться через оборону Йесода."
90002030-55 = "[s] «...»"
90002030-56 = "Давайте ещё раз рассмотрим имеющиеся данные о Йесоде, девятом пророке."
90002030-57 = "Как ни странно, у Йесода нет исходной формы."
90002030-58 = "Что это значит, Рио?"
90002030-59 = "Например, Ход когда-то был «Hub», модулем коммуникационной сети Миллениума."
90002030-60 = "Хокма раньше был вспомогательным кораблём, а Гебура — беспилотным исследовательским зондом."
90002030-61 = "Все пророки, с которыми мы встречались до сих пор, появились после того, как Декаграмматон взломал уже существующую систему ИИ."
90002030-62 = "Исключение — Бина, поскольку это необъяснимое явление, впервые замеченное в Пустыне Абидос десятки лет назад."
90002030-63 = "Но ты говоришь, что Йесод устроен иначе, Рио."
90002030-64 = "Да. Это лишь моё предположение..."
90002030-65 = "Но наиболее вероятное объяснение — Йесод родился из Стального континента."
90002030-68 = "Это объяснило бы, почему мы не смогли отличить сигнал такого гиганта до самого момента его атаки."
90002030-69 = "Да. Думаю, это справедливый вывод."
90002030-71 = "То есть, в отличие от других пророков, Йесод — не ИИ, эволюционировавший ради адаптации к целям Декаграмматона..."
90002030-72 = "...а пророк, изначально созданный и оптимизированный под эти цели."
90002030-73 = "...Мне так кажется."
90002030-74 = "Если его создали исключительно для защиты Стального континента, это объясняет его чудовищные размеры и силу."
90002030-76 = "Похоже, у нас одни проблемы и ни одного решения."
90002030-77 = "Н-Не беспокойтесь! Я— Мы! Мы справимся!"
90002030-78 = "Г-Герой... никогда не боится... перед приключением... *шмыг*"
90002030-79 = "[s] «(По-моему, она уже немного боится...)»"
90002030-81 = "Не всё так плохо. Если он часть Стального континента, у него будут слабости, которыми можно воспользоваться."
90002030-82 = "Например?"
90002030-83 = "Смотрите. Похоже, он закреплён на стене."
90002030-84 = "Д-Да... Даже в играх гигантские боссы не могут свободно двигаться..."
90002030-85 = "...Я ведь не каждый раз, когда говорю, ссылаюсь на видеоигры..."
90002030-87 = "Фуфу. Возможно, Юзу права."
90002030-88 = "Пока у него есть масса, даже пророк Декаграмматона или «оптимизированное существо» всё равно подчиняется законам физики."
90002030-89 = "Подчиняется...?"
90002030-90 = "Ах. Значит, дело в скорости и прочности."
90002030-91 = "Верно. Чтобы перемещать огромную массу, требуется много энергии."
90002030-92 = "Чем быстрее нечто движется, тем менее прочным оно будет. И наоборот."
90002030-93 = "Конечно, нужно учитывать, что мы ещё даже не выяснили, из какого сплава состоит Стальной континент. О его твёрдости и прочности мы практически ничего не знаем."
90002030-94 = "Но пока у него есть масса и форма, он не может быть непробиваемым."
90002030-95 = "[s] «Тогда это значит...?»"
90002030-96 = "Хорошо, Сенсей."
90002030-97 = "Главное ограничение Йесода — его скорость."
90002030-98 = "И если строить план, исходя из этого факта..."
90002030-99 = "...Вы хотите использовать приманку."
90002030-100 = "Да. Если это вы... Ну, неудивительно, что вы пришли к тому же выводу."
90002030-101 = "Атака Йесода, когда он обрушивает руку, невероятно мощная и разрушительная."
90002030-102 = "Значит, нам неизбежно придётся противопоставить ей манёвренность и скорость."
90002030-103 = "Приманка должна быть достаточно подвижной, чтобы реагировать на любую ситуацию, и, вероятно, сможет уклониться как минимум от двух атак."
90002030-104 = "В сущности, его огромные размеры пугают, но они же означают, что и у Йесода есть пределы."
90002030-105 = "Если цель будет слишком быстрой, чтобы он мог попасть, она отвлечёт его внимание достаточно надолго."
90002030-106 = "Достаточно, чтобы мы перелетели над ним на транспортном корабле..."
90002030-107 = "...и устроили засаду с вершины стены."
90002030-108 = ""
90002030-110 = ""
90002030-112 = ""
90002030-113 = "Я вынуждена рационально согласиться с твоим планом, Химари."
90002030-114 = "Раньше ты бы осуществила его, даже не посоветовавшись с нами, разве нет?"
90002030-115 = "И всё же теперь мы дошли до того, что ты сама предлагаешь его без моих подсказок..."
90002030-116 = "Полагаю, это значит, что мы подошли к краю."
90002030-117 = "...У нас заканчивается время, Рио."
90002030-118 = "Да. Я знаю."
90002030-119 = "[s1] «Подождите, все. Дайте секунду.»\n[s2] «Кажется, я не до конца понял, поэтому хочу уточнить...»"
90002030-122 = "..."
90002030-123 = "Вы правы, Сенсей."
90002030-124 = "Мы говорим о том, что единственный способ одолеть Йесода — использовать кого-то как приманку."
90002030-125 = "Мы не можем гарантировать ни безопасность этого человека, ни то, что план вообще сработает."
90002030-126 = "Если говорить прямо, мы отправим кого-то в опасность с небольшими шансами на победу."
90002030-127 = "[s3] «Я... не думаю, что могу согласиться на такой метод.»\n[s4] «Как... как ваш учитель.»"
90002030-130 = "Других вариантов у нас нет."
90002030-132 = "В-В таком случае...! Тогда снова я...!"
90002030-133 = "..."
90002030-135 = "Нет, Арис. Тебе нельзя."
90002030-136 = "П-Почему? Пусть я всего лишь ученик героя, я всё равно герой, поэтому должна...!"
90002030-137 = "Именно поэтому. Потому что ты герой."
90002030-138 = "Ты наш скрытый козырь. Наша последняя карта для решающего боя."
90002030-139 = "...Меня это тоже касается?"
90002030-140 = "...Да."
90002030-141 = "Ты всё такая же холодная и по-риовски прямолинейная."
90002030-142 = "...Я привыкла быть такой."
90002030-143 = "Ненавижу эту твою черту!"
90002030-144 = ""
90002030-146 = ""
90002030-147 = "Она меня правда, по-настоящему бесит! Я больше не могу сдерживаться!"
90002030-148 = "Разве ты не всегда злишься, Кей?"
90002030-149 = "Ну, да, но... Сейчас другое! Другое, понятно!"
90002030-150 = "Огонь горячий, и магма тоже горячая! Но магма горячее! П-Почему вы только всё ухудшаете?!"
90002030-151 = "[s] «Неужели... правда нет другого способа?»"
90002030-153 = "..."
90002030-154 = "..."
90002030-155 = "В комнате повисла тяжёлая атмосфера, пока все осмысливали серьёзность ситуации."
90002030-156 = "Но, как сказала Химари, времени у нас почти не осталось."
90002030-157 = ""
90002030-161 = "Я пойду. Я справлюсь."
90002030-162 = ""
90002030-164 = ""
90002030-165 = "[ns] «Что?!»"
90002030-166 = "Ч-Что? Эйми?!"
90002030-167 = ""
90002030-169 = ""
90002030-171 = "Моя задача — отвлечь его внимание и выиграть время, чтобы ударная группа заняла позиции, верно?"
90002030-173 = "Т-Ты говоришь об этом так просто!"
90002030-174 = "О-Она права, Эйми! Сенсей будет волноваться за тебя, но и я тоже!"
90002030-176 = "Это самый эффективный метод. Здесь нет места для «наверное» или «может быть»."
90002030-177 = "Мне всё равно комфортнее в полевых условиях. И я сильная. И быстрая."
90002030-178 = "Н-Но...! Если что-то пойдёт не так...!"
90002030-179 = "[s5] «Тебе нужно передумать, Эйми...!»\n[s6] «Я не могу смотреть, как ты пострадаешь!»"
90002030-182 = "..."
90002030-183 = ""
90002030-185 = ""
90002030-187 = ""
90002030-190 = "?!"
90002030-191 = "?!"
90002030-192 = "Объятие Эйми было мягким и нежным, прямо как она сама."
90002030-193 = "[s] «Э-Эйми...?»"
90002030-194 = ""
90002030-196 = "Как я и думала, Сенсей. Вы тёплый. И мягкий."
90002030-197 = "Не волнуйтесь так сильно, Сенсей."
90002030-198 = "[s] «Но...!»"
90002030-199 = "Я знаю."
90002030-200 = "Но со мной всё будет хорошо."
90002030-201 = "Если вы обо мне заботитесь, доверьтесь мне."
90002030-202 = "Помогать ученикам, может, и долг учителя, но желание ученика — помогать своему учителю."
90002030-203 = "В любом случае, если я всё-таки пострадаю..."
90002030-204 = "...тогда я просто свалю всю вину на вас, Сенсей. И вам придётся заботиться обо мне до конца моей жизни."
90002030-205 = "Тогда скоро увидимся."
90002030-206 = ""
90002030-210 = "[ns] «Эйми!»"
90002030-213 = "...Начинаем операцию."
90002030-214 = "Поняла."
90002030-215 = "Мы НЕ растратим шанс, который дала нам Эйми."
90002030-216 = "Верно, Сенсей?"
90002030-217 = "[s] «...Скажи, где я нужен.»"
90002030-224 = "[ns] «Все, по местам.»"
90002030-225 = "Докладываю о состоянии ремонта двигателя. Аварийный взлёт и посадка должны быть возможны."
90002030-226 = "Я отправлюсь в ангар и подготовлюсь к высадке."
90002030-228 = "Да! Я пойду с Токи!"
90002030-229 = "Я-я постараюсь...!"
90002030-231 = "Остальное оставляю тебе, Химари."
90002030-232 = "...Я понимаю, что Токи и Арис сейчас наши сильнейшие бойцы."
90002030-233 = "И Юзу уже не раз доказала себя в этой операции..."
90002030-234 = "Но и ты тоже, Рио?"
90002030-235 = "...Нам также понадобится оператор и стратег на месте."
90002030-236 = "И ты ведь не пытаешься снова расплатиться за какой-то воображаемый долг из-за прошлых ошибок?"
90002030-237 = "...Скоро увидимся, Химари."
90002030-238 = ""
90002030-244 = "*вздох* Полагаю, придётся оставить всё как есть. Сенсей, вам не кажется, что рядом со мной слишком мало хороших и верных подчинённых?"
90002030-245 = "[s] «Эм... А как же я?»"
90002030-246 = "Фуфу. Услышав это, кажется, я всё же самый удачливый человек здесь."
90002030-247 = "Десантная капсула готова к спуску."
90002030-248 = "Ну что, Сенсей?"
90002030-249 = "[s] «Выдвигаемся!»"
90002030-250 = "Ангар, вы меня слышите? Как обстановка?"
90002030-256 = "Прибыли в ангар. Скоро сядем в десантные капсулы."
90002030-257 = "Арис. Ты помнишь порядок действий?"
90002030-259 = "Да! Я очень хорошо всё запомнила!"
90002030-260 = "Эм... Только напомните первый шаг!"
90002030-261 = "Я-я помогу тебе, Арис... Это вроде... инструкции к игре..."
90002030-263 = "Тогда поручаю Арис тебе, Юзу."
90002030-266 = "Готовы к спуску, Химари."
90002030-267 = "Ну что ж."
90002030-268 = "Направляю корабль к целевой точке высадки."
90002030-269 = ""
90002030-278 = "Вблизи он ещё больше."
90002030-279 = "Сейчас не время нервничать."
90002030-280 = "Сейчас время действовать эффективно."
90002030-281 = "Начнём с..."
90002030-282 = ""
90002030-284 = ""
90002030-289 = ""
90002030-290 = ""
90002030-291 = ""
90002030-293 = "...тех сил, что размещены здесь."
