[translation]
52100-1 = "Episódio 10;Memórias Incompletas"
52100-3 = "Logo a Nagusa-chan...!"
52100-4 = "Levei uma surra da Nagusa-chan, e duas vezes!!"
52100-5 = "Se não fosse a Schale naquela hora... não, se a Ayame não estivesse lá...!"
52100-6 = "Uuuuh..."
52100-7 = "Que raivaaaa!!"
52100-11 = "Aliás, por que aquela lá tava aqui? A Ayame tinha ido pro Crepúsculo naquela vez..."
52100-12 = "Alguém fingindo ser a Ayame? Ou tá acontecendo alguma coisa que eu não sei...?"
52100-16 = "...Tanto faz! Com certeza usaram algum truque sujo!"
52100-17 = "Um plano tão caprichado não podia acabar fácil assim—"
52100-22 = "Vai estragar esse rostinho fofo, pequenininha."
52100-27 = "...Ayame?!"
52100-28 = "Hm? A gente se conhece de algum lugar?"
52100-29 = "Ah, entendi..."
52100-30 = "Até no Distrito Autônomo do Norte eu tenho fãs! Ai, ai, que problemão!"
52100-34 = "Quem disse que eu sou sua fã?!"
52100-35 = "Se eu estivesse com o Livro Maldito, uma impostora como você—"
52100-43 = "...Terminou de falar?"
52100-49 = "Argh... drogaaa!!"
52100-52 = "Então, Presidente Ayame... o que você queria mostrar?"
52100-53 = "Não é uma esquete com a baixinha amarrada ali no chão, né?"
52100-54 = "Haha, claro que não. Só tem uma coisa da luta de ontem que eu queria confirmar."
52100-55 = "Deixa eu ver..."
52100-61 = "Achei, achei."
52100-68 = "Isso é o Tsukumogami Ilusório de ontem...?"
52100-69 = "É. Ficou quase todo destruído, só isso aqui manteve a forma original."
52100-70 = "Renge, o que você acha que é isso?"
52100-71 = "O que é... um guarda-chuva velho?"
52100-72 = "Isso. Só um guarda-chuva surrado."
52100-73 = "Mas, ontem à noite, isso aqui saiu atacando a gente como se fosse um ser vivo."
52100-74 = "Como será que o Livro Maldito do \"Clube Beleza da Natureza\" transformou isso em uma assombração?"
52100-79 = "Hmph, que pergunta idiota."
52100-80 = "Nada é impossível para o Livro Maldito. Fantasma de guarda-chuva eu faço quantos eu quiser—"
52100-81 = "Então, por que não fazer um tsukumogami com um guarda-chuva novo e resistente?"
52100-82 = "Quem sabe não virava uma assombração de guarda-chuva bem forte, com varetas de metal?"
52100-86 = "I-Isso..."
52100-87 = "Não dá, né?"
52100-88 = "Porque o \"fantasma do guarda-chuva\" que todo mundo imagina é um guarda-chuva caindo aos pedaços."
52100-89 = "Não vem pagar de sabichona—"
52100-90 = "Eu não conheço o poder do Livro Maldito.#nMas de histórias de terror... de narrativas, eu entendo."
52100-91 = "Na verdade, uma história não tem sentido se for contada sozinha."
52100-92 = "Ela só ganha vida quando quem ouve sente empatia e a compreende."
52100-93 = "Por isso, elementos que todo mundo já viveu ou sentiu são indispensáveis."
52100-94 = "Uma história de terror só funciona porque todo mundo acha sinistro um guarda-chuva velho jogado na beira da estrada."
52100-95 = "Se não mexer com o coração, não dá medo desde o começo, não é?"
52100-99 = "..."
52100-100 = "Quando eu já estava quase desistindo de procurar a Sra. Kuzunoha, ouvi um rumor por aqui."
52100-101 = "Que tinha aparecido um Hyakumonogatari capaz de mudar de forma dependendo de quem o via..."
52100-102 = "Eu até podia ter achado que era só boato exagerado... mas se o Clube Beleza da Natureza que controla o Hyakumonogatari existe mesmo, então a lendária Presidente que o derrotou também devia existir."
52100-103 = "Foi por isso que comecei a investigar a verdade."
52100-104 = "...Então foi por isso."
52100-105 = "...Que você sumiu sem dar nem um sinal de vida até agora?"
52100-106 = "...É. Sei que causei problemas. Nem espero que vocês aceitem isso facilmente."
52100-108 = "Bom... é bem a sua cara, né."
52100-109 = "Lembra daquela vez que a Presidente entrou na montanha procurando um gato fujão e ficou dois dias incomunicável?"
52100-110 = "Dar tudo de si no trabalho é uma das melhores qualidades da Presidente Ayame, afinal!"
52100-111 = "Quando decide fazer algo, segue em frente sem olhar para os lados... É verdadeiramente a líder ideal!"
52100-112 = "...A Ayame não muda mesmo."
52100-113 = "E já que pegamos essa garota, a base do Clube Beleza da Natureza também—"
52100-118 = "Até parece que eu vou contar para vocês!"
52100-119 = "Façam o que fizerem, eu nuuunca vou trair a Sra. Kokuriko!"
52100-123 = "Ah, é? Então..."
52100-124 = "Azami-san, posso pegar a lareira emprestada rapidinho?"
52100-125 = "Sim. M-Mas para o que vai usá—"
52100-130 = "S-Será que...?!"
52100-131 = "N-Não...!"
52100-132 = "Tá falando sério?!"
52100-137 = "Sim! Vamos comer yakitori!"
52100-138 = "Pensei que ela pudesse estar com fome. Essa garota não come nada desde ontem à noite, né?"
52100-146 = "...Falei alguma coisa estranha?"
52100-147 = "N-Não. Não é nada estranho, mas..."
52100-149 = "É super estranho, sim?! Quem é que come yakitori de manhã cedo?!"
52100-150 = "E outra, já esqueceu o que eu acabei de dizer?! Não importa o que vocês façam, é inútil, inútil, inútil!"
52100-151 = "Achar que vai me subornar com yakitori... Eu não sou nenhuma pirralha qualquer!"
52100-152 = "Não... você é criança, sim."
52100-153 = "Nem é pra fazer acordo."
52100-154 = "Eu já tenho uma boa ideia de onde fica o esconderijo do Clube Beleza da Natureza."
52100-158 = "Q-Que mentirada...!"
52100-159 = "E comer yakitori de manhã é normal, ué."
52100-160 = "Frango suculento com o aroma da cebolinha, nossa...! Espetinho de frango com cebolinha combina tanto com festival quanto com acampamento!"
52100-161 = "Concordo totalmente."
52100-165 = "Então, Shuro-chan, né? Você prefere peito ou coxa?"
52100-166 = "..."
52100-167 = "Ah... você não curte só no sal? Hm, agora eu não tenho molho..."
52100-171 = "E-Eu gosto de frango, sim, mas não como essa coisa molenga e nojenta que é cebolinha!"
52100-172 = "Ah, não gosta de cebolinha? Mas experimenta uma vez, confia em mim!"
52100-173 = "Isso mesmo. Quando a gordura do frango assado na brasa se mistura com a cebolinha, o sabor fica super rico."
52100-174 = "O ardido e o amargo somem, e o doce e o umami se destacam. Não é exagero dizer que quem não come tá perdendo metade da vida..."
52100-179 = "N-Nem se a Sra. Kokuriko pedir eu como cebolinha...!"
52100-193 = "P-Por que vocês estão chegando perto...?!"
52100-194 = "N-Não... tira isso de perto de mim... s-seus monstros...!"
52100-203 = "Pessoal... e [USERNAME]-sensei também."
52100-204 = "Venham aqui um pouco..."
52100-214 = "[ns1] \"O que houve de repente, Kikyou?\"\n[ns2] \"Quer conversar longe da Nagusa...?\""
52100-217 = "Sim. Preciso falar sobre a Presidente Ayame."
52100-218 = "A Nagusa-senpai..."
52100-219 = "Sinto que, mesmo se eu falasse agora, ela não ia conseguir aceitar."
52100-220 = "Sensei, você não sentiu nada de estranho naquela Presidente Ayame? Ficou em silêncio por um tempo..."
52100-221 = "[s3] \"Mesmo que você pergunte...\"\n[s4] \"Eu nunca conheci a Ayame de antes.\""
52100-224 = "...Ah."
52100-225 = "Desculpa, é verdade."
52100-226 = "Indo direto ao ponto, sinto que ela está um pouco diferente da Presidente Ayame que eu conheço."
52100-231 = "N-Não pode ser...! Alguém está se passando pela Presidente Ayame?!"
52100-232 = "Ainda é cedo para afirmar. Mas não podemos descartar essa possibilidade."
52100-233 = "Mas também nunca ouvi falar de uma aluna idêntica à Presidente Ayame..."
52100-234 = "E pra mim ela pareceu igualzinha a antes. Tinha alguma coisa tão estranha assim?"
52100-235 = "É mais uma impressão, mas..."
52100-236 = "Sinto que ela tem menos \"brechas\" do que antes."
52100-238 = "Brechas...?"
52100-240 = "Ei, ei, a Presidente Ayame sempre foi toda certinha, não?"
52100-241 = "Qualquer missão complicada ou pedido chato, ela aceitava sorrindo e resolvia num instante. Essa sempre foi a Ayame-senpai, Presidente do Hyakkaryouran..."
52100-242 = "Claro, eu também penso assim."
52100-243 = "Mas a Presidente Ayame também tinha seus pontos fracos, né?"
52100-244 = "Por exemplo, diferente da Nagusa-senpai, ela comia pouco."
52100-245 = "Sempre deixava um restinho de comida no prato... e quando eu via, vivia dando bronca nela."
52100-246 = "...Será que hoje ela só não tava morrendo de fome?"
52100-247 = "Além disso, se ela tem mesmo essa personalidade de \"dar tudo de si no trabalho\", como a Renge disse agora há pouco..."
52100-248 = "Por que ela se juntou a nós em vez de ir atrás do Hyakumonogatari que apareceu no Distrito Autônomo do Norte?"
52100-249 = "Hm... talvez ela estivesse no meio da investigação da base do Clube Beleza da Natureza?"
52100-250 = "Chamar ela de impostora só por isso é forçar a barra, né."
52100-251 = "É verdade, eu mesma acho que estou sensível demais."
52100-252 = "Mas depois de tudo o que aconteceu, quero ser cautelosa.#n...Qual é a opinião de vocês?"
52100-259 = "Não faço parte do Hyakkaryouran, então fico sem jeito de me intrometer, mas..."
52100-260 = "Eu também acho difícil confiar em uma Presidente Ayame que surgiu assim, do nada."
52100-264 = "Ela disse que passou os últimos meses perseguindo o Hyakumonogatari perto da Filial Ebisu... mas eu nunca ouvi nenhum rumor sobre uma aluna usando um haori azul."
52100-265 = "E, acima de tudo, dizem que o Hyakumonogatari pode até assumir a mesma aparência que nós..."
52100-267 = "Mas será que um Hyakumonogatari se transformaria na Ayame-senpai?"
52100-268 = "Ontem, a Ayame-senpai veio correndo salvar a Nagusa-senpai... Um inimigo não faria isso, né?"
52100-269 = "E mesmo que seja uma armadilha do Clube Beleza da Natureza, desafio lançado é desafio aceito! Assim até fica mais empolgante!"
52100-273 = "...Se deixar cegar pelo entusiasmo é um péssimo hábito seu."
52100-274 = "Ué, mesmo que seja falsa, o que a gente pode fazer?"
52100-279 = "Eu... não sei dizer ao certo."
52100-280 = "A Ayame-senpai, depois de tanto tempo, parecia tão radiante e perfeita quanto o sol, como sempre foi, mas..."
52100-281 = "Eu também entendo o que a Kikyou-senpai sente."
52100-282 = "É difícil colocar em palavras, mas... é como se não tivesse o calor do sol...#nUma frieza artificial, quase como a de uma lâmpada."
52100-283 = "Se me perguntarem se consigo confiar plenamente na Ayame-senpai de agora... não posso dizer que sim com tranquilidade."
52100-288 = "...Mas faz tanto tempo que não vemos a Nagusa-senpai sorrir daquele jeito."
52100-289 = "Até agora, mesmo nos momentos felizes, a Nagusa-senpai sempre parecia meio solitária, tão frágil que dava a impressão de que ia desaparecer a qualquer instante..."
52100-290 = "Mas, ao lado da Ayame-senpai, a Nagusa-senpai parece verdadeiramente feliz."
52100-291 = "Mesmo que a existência da Ayame-senpai agora seja algo incerto..."
52100-292 = "Eu não quero mais... ver a Nagusa-senpai triste."
52100-293 = "Eu também... sinto o mesmo."
52100-294 = "[s] \"Para você, Kikyou, que tipo de senpai a Ayame era?\""
52100-295 = "Para mim...?"
52100-296 = "Sim... Para mim, a Presidente Ayame era uma senpai realmente excelente."
52100-297 = "Fazia tudo com maestria e era gentil com todo mundo, sem distinção. Eu entendia perfeitamente por que todos gostavam dela."
52100-298 = "Mas ela estava longe de ser perfeita. Ela também tinha seus limites."
52100-299 = "[s5] \"Sim. Também acho que todo mundo tem seus limites.\"\n[s6] \"Talvez ela só estivesse se esforçando para parecer perfeita.\""
52100-302 = "É verdade. Mas, desde ontem, senti que a Presidente Ayame não tem mais nenhuma dessas brechas."
52100-303 = "...Sensei, o que você acha da Presidente Ayame de agora?"
52100-307 = "[ns] \"Acho que não consigo responder agora, desculpa.\""
52100-311 = "...Por quê?"
52100-312 = "[s7] \"Da mesma forma que não existe nada perfeito no mundo...\"\n[s8] \"Também não dá para julgar alguém com exatidão.\""
52100-315 = "[ns] \"Além disso, ainda não convivi com a Ayame o suficiente para conquistar a confiança dela.\""
52100-316 = "...? Eu estou perguntando se \"você consegue confiar na Presidente Ayame\", Sensei."
52100-317 = "[s9] \"Confiança se constrói aos poucos.\"\n[s10] \"Talvez ainda tenha faltado tempo para isso.\""
52100-320 = "...\"Faltado tempo\"?"
52100-321 = "Achei que já tivéssemos passado bastante tempo juntas..."
52100-322 = "[s11] \"Por enquanto, vamos encarar a Ayame que está diante de nós.\"\n[s12] \"Mesmo parecendo toda certinha, talvez ela ainda tenha um lado imprudente.\""
52100-327 = "...Entendi. Realmente, ainda é cedo para tirar conclusões."
52100-328 = "Mas eu pretendo continuar desconfiada.#nComo Estrategista do Hyakkaryouran, quero eliminar qualquer risco possível..."
52100-329 = "...Pelo menos, essa Kikyou aqui é com certeza a verdadeira!"
52100-330 = "Ouvir você dizer isso nos deixa muito mais tranquilas, senpai!"
52100-332 = "E além disso..."
52100-337 = "Ela deixou a Nagusa-senpai daquele jeito e voltou toda sorridente—"
52100-339 = "Eu ainda não perdoei isso."
52100-341 = "Próximo;O Caminho para a Outra Margem"
