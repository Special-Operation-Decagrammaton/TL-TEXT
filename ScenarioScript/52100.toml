[translation]
52100-1 = "Эпизод 10;Неполная память"
52100-2 = ""
52100-3 = "Ух... Эта Нагуса..."
52100-4 = "Нагуса? ОНА? Эта девчонка уже дважды меня достала?"
52100-5 = "Во всём виноват Сенсей. Нет... Аямэ! Что она вообще делала?"
52100-6 = "У-у-у..."
52100-7 = "Как же бесит!"
52100-8 = ""
52100-10 = ""
52100-11 = "Но разве госпожа Кокурико не утащила Аямэ в мир духов...?"
52100-12 = "Может, это самозванка? Призрак с платиновыми волосами?"
52100-13 = ""
52100-15 = ""
52100-16 = "...Что бы это ни было, это трюк. Уж я-то знаю трюки..."
52100-17 = "В остальном мой план был идеален—!"
52100-18 = ""
52100-22 = "Какая дерзкая."
52100-23 = ""
52100-25 = ""
52100-26 = ""
52100-27 = "Ух... Аямэ...?"
52100-28 = "А? Мы знакомы?"
52100-29 = "О, как приятно познакомиться. Как дела?"
52100-30 = "Не знала, что у меня есть поклонники так далеко на севере! Боже мой."
52100-31 = ""
52100-33 = ""
52100-34 = "Кого ты назвала поклонницей?!"
52100-35 = "Я верну тот том, а фальшивая президентша вроде тебя, которая даже не смогла использовать Сотню Лотосов, будет—"
52100-36 = ""
52100-38 = ""
52100-39 = ""
52100-40 = ""
52100-42 = ""
52100-43 = "...Какая ты интересная."
52100-44 = ""
52100-46 = ""
52100-48 = ""
52100-49 = "Ух... Чёрт! Кто-нибудь, остановите её."
52100-52 = "Президент Аямэ, пожалуйста, проясните свои намерения."
52100-53 = "Вы ведь позвали нас сюда не для того, чтобы мы слушали, как вы разговариваете с ребёнком?"
52100-54 = "Разумеется. Я лишь хотела кое-что проверить..."
52100-55 = "Так, посмотрим..."
52100-56 = ""
52100-58 = ""
52100-59 = ""
52100-60 = ""
52100-61 = "Нашла."
52100-62 = ""
52100-64 = ""
52100-67 = ""
52100-68 = "Зонт, которым раньше владели Духи артефактов...?"
52100-69 = "Да. Он в основном сломан, но хотя бы сохранил форму."
52100-70 = "Итак, Рэнгэ. На что это похоже?"
52100-71 = "Эм... на сломанный зонт. Очевидно."
52100-72 = "Верно. Старый и потрёпанный, но в остальном обычный зонт."
52100-73 = "Но каким образом «Красота природы» заставила его нападать на нас?"
52100-74 = "Как они превратили обычный зонт в... монстра?"
52100-75 = ""
52100-78 = ""
52100-79 = "Хмф, что за глупый вопрос."
52100-80 = "Наши тома безграничны. Монстр-зонт — элементарно—"
52100-81 = "Разве не разумнее было бы использовать крепкий новый зонт, а не старый потрёпанный, если хочешь создать Духа артефакта?"
52100-82 = "Или, может, заставить его ходить на двух ногах, чтобы он был устойчивее?"
52100-83 = ""
52100-85 = ""
52100-86 = "О-О... Ну... Это..."
52100-87 = "То есть, это же очевидно, разве нет?!"
52100-88 = "Гораздо страшнее, когда монстр-зонт приближается к тебе на одной ноге."
52100-89 = "Ты... Ты думаешь, можешь МЕНЯ учить? Это мой том!"
52100-90 = "Может, я и не разбираюсь в томах, зато кое-что понимаю в хороших историях о призраках."
52100-91 = "Каждую хорошую историю и слух нужно рассказывать другим. Именно так они набирают силу."
52100-92 = "Проще говоря, истории нужна общая тема, к которой могут отнестись хотя бы два человека."
52100-93 = "Например... конкретный образ, понятный всем, или универсальный опыт."
52100-94 = "...Как печаль от вида мокрого брошенного зонта, лежащего на земле."
52100-95 = "Нельзя бояться того, чего не понимаешь. Верно?"
52100-96 = ""
52100-98 = ""
52100-99 = "..."
52100-100 = "Когда я уже собиралась отказаться от поисков Кузунохи, по району пополз слух."
52100-101 = "Люди говорили о монстре, который меняет облик в зависимости от того, кто на него смотрит."
52100-102 = "Я могла принять это за простой слух... Но подумала: если этот монстр реален, и «Красота природы» тоже реальна, значит, возможно, реальна и Кузуноха, победившая их когда-то."
52100-103 = "С тех пор я оставалась в городе и расследовала эту историю."
52100-104 = "...Аямэ."
52100-105 = "То есть вы говорите, что бросили пост без единого звонка или сообщения, чтобы засесть здесь и расследовать «Красоту природы»?"
52100-106 = "...Да. Теперь понимаю, что могла позвонить и избавить вас от огромного количества проблем."
52100-108 = "Ну, эм... Это действительно похоже на тебя."
52100-109 = "Помнишь, как ты пошла искать пропавшую кошку торговца и исчезла на два дня?"
52100-110 = "У тебя всегда было... туннельное зрение, Аямэ. Увлечёшься — и больше ничего не видишь."
52100-111 = "Воля крепче стали... У неё характер идеального лидера!"
52100-112 = "...Это Аямэ."
52100-113 = "Потребовалось время, но мы поймали эту маленькую барда. Уверена, сможем убедить её показать базу «Красоты природы»."
52100-114 = ""
52100-117 = ""
52100-118 = "Ещё чего, придурки!"
52100-119 = "Я никогда не предам госпожу Кокурико!"
52100-120 = ""
52100-122 = ""
52100-123 = "А, совсем забыла."
52100-124 = "Азами, в очаге остался огонь? Мне нужен горячий уголь."
52100-125 = "...Да! Я быстро разожгу, но зачем вам—?"
52100-126 = ""
52100-129 = ""
52100-130 = "Ты хочешь сказать?.."
52100-131 = "Ни за что..."
52100-132 = "...Аями?"
52100-133 = ""
52100-136 = ""
52100-137 = "Да! Я как раз в настроении приготовить куриный шашлык!"
52100-138 = "Эта маленькая девочка выглядит такой голодной, и я хочу приготовить для нее что-нибудь простое."
52100-139 = ""
52100-141 = ""
52100-142 = ""
52100-144 = ""
52100-146 = "..Хм? Почему вы все так на меня смотрите?"
52100-147 = "...Ни для чего. В этой просьбе нет ничего странного..."
52100-149 = "Ещё как есть! Кто ест куриные шашлычки с утра пораньше?"
52100-150 = "И вы забыли, что я сказала? Ни за что не расскажу вам ничего о «Красоте природы»!"
52100-151 = "Думаете, меня можно подкупить? Будто я какой-то глупый ребёнок?"
52100-152 = "...Разве она не ребёнок?"
52100-153 = "Вы ошибаетесь. Я не пытаюсь тебя подкупить или выманить сведения."
52100-154 = "Я уже примерно знаю, где находится база «Красоты природы»."
52100-155 = ""
52100-157 = ""
52100-158 = "Блефуешь!"
52100-159 = "И ничего странного в том, чтобы начать день с куриных шашлычков, нет."
52100-160 = "Жирную курятину освежает острота зелёного лука... Очень бодрит."
52100-161 = "Хорошо сказано, Аямэ."
52100-162 = ""
52100-164 = ""
52100-165 = "Итак, Сюро, верно? Какой кусочек тебе дать? Грудку или бедро?"
52100-166 = "..."
52100-167 = "Или тебе не нравятся шашлычки с солью? Не уверена, что у нас есть соус..."
52100-168 = ""
52100-170 = ""
52100-171 = "Замолчи! Не хочу я ваш мерзкий зелёный лук! Фу!"
52100-172 = "Попробуй. Может, понравится! Когда лук немного размягчится от жара, он становится очень вкусным."
52100-173 = "Она права. Жир капает на угли, и лук словно поджаривается."
52100-174 = "Острота и горечь уходят, а сладость и вкус умами усиливаются... Сюро, доверься мастерству Аямэ."
52100-175 = ""
52100-178 = ""
52100-179 = "Нет. Даже если бы госпожа Кокурико попросила, я ни за что не стала бы есть этот гадкий зелёный лук!"
52100-180 = ""
52100-183 = ""
52100-184 = ""
52100-185 = ""
52100-186 = ""
52100-187 = ""
52100-190 = ""
52100-192 = ""
52100-193 = "Стой, что ты делаешь с этой шпажкой? Я же сказала, что не хочу!"
52100-194 = "Вы заставляете меня есть то, что я ненавижу... Злодейки! Это пытка!"
52100-195 = ""
52100-202 = ""
52100-203 = "Все. И Сенсей [USERNAME]... Можно вас на минутку?"
52100-204 = "Я хотела бы кое о чём спросить... пока они заняты погоней за этим ребёнком."
52100-205 = ""
52100-208 = ""
52100-214 = "[ns1] «Что случилось, Кикё?»\n[ns2] «Не хочешь, чтобы Нагуса услышала?»"
52100-217 = "Да. Ясно, что появление президента Аямэ стало для неё потрясением."
52100-218 = "А Нагуса..."
52100-219 = "Думаю, ей не понравится то, что я хочу сказать."
52100-220 = "Тебе тоже показалось, что с Аямэ что-то... не так? Ты была такой тихой. Я подумала, ты что-то заметила."
52100-221 = "[s3] «Не знаю насчёт „не так“.»\n[s4] «Я встретил её впервые.»"
52100-224 = "...Ах."
52100-225 = "Конечно. Наверное, я слишком многого от вас ждала."
52100-226 = "Честно говоря, ЭТА президент Аямэ ведёт себя не так, как я помню."
52100-227 = ""
52100-230 = ""
52100-231 = "Т-Ты хочешь сказать, что это какая-то самозванка?"
52100-232 = "Не знаю наверняка, но исключать это нельзя."
52100-233 = "Но она выглядит точно как Аямэ. И близнеца у той не было."
52100-234 = "И, насколько я видела, вела она себя как обычно. Что тебе не понравилось?"
52100-235 = "Повторяю, я не уверена..."
52100-236 = "...Но президент Аямэ кажется... слишком идеальной."
52100-238 = "Слишком идеальной?.."
52100-240 = "Ой, да брось! Аямэ всегда была такой! Она на другом уровне."
52100-241 = "Она бралась за любое задание с улыбкой и никогда не жаловалась. Идеальный президент, настоящая легенда!"
52100-242 = "Согласна: на первый взгляд президент Аямэ казалась безупречной."
52100-243 = "Однако даже у неё были свои предпочтения и недостатки."
52100-244 = "Например, в отличие от Нагусы, президент Аямэ была разборчива в еде."
52100-245 = "Она никогда не доедала рис и всегда оставляла немного в миске. Я постоянно её за это бранила."
52100-246 = "Может, сегодня она просто сильнее проголодалась?"
52100-247 = "И ещё: как сказала Рэнгэ, если Аямэ действительно была такой собранной и решительной..."
52100-248 = "...почему она сама не нашла и не остановила этого оборотня? Он здесь уже две недели, а она всё это время ждала?"
52100-249 = "Потому что... Она выжидала. Сказала, что искала базу «Красоты природы»."
52100-250 = "Ты обязательно должна во всём сомневаться?"
52100-251 = "Понимаю, что, возможно, преувеличиваю."
52100-252 = "Но мне не всё равно, что будет с нами, поэтому я хотела услышать ваше мнение."
52100-253 = ""
52100-255 = ""
52100-257 = ""
52100-259 = "Ну, я понимаю, что не состою в Хяккарёран..."
52100-260 = "Но мне трудно полностью доверять президенту Аямэ, ведь она появилась так внезапно."
52100-261 = ""
52100-263 = ""
52100-264 = "Эбису — совсем небольшой городок. Если она уже несколько месяцев здесь, почему я её не видела? Никто даже не упоминал девушку в синем хаори, сияющую от счастья."
52100-265 = "А главное, мы знаем, что оборотень способен принимать облик человека."
52100-267 = "Верно, но он вроде бы принимает облик самого сильного страха человека. А в этой Аямэ нет ничего страшного."
52100-268 = "И эта Аямэ спасла Нагусу! Она явно на нашей стороне."
52100-269 = "Даже если это хитрая ловушка «Красоты природы»... нам всё равно нужно посмотреть, что будет дальше! Я не боюсь!"
52100-270 = ""
52100-272 = ""
52100-273 = "...И снова твой неудержимый пыл мешает тебе заметить очевидную ловушку."
52100-274 = "Ну а что ты предлагаешь, Кикё? Кроме как портить всем настроение?"
52100-275 = ""
52100-277 = ""
52100-279 = "Прошу... хватит ссориться."
52100-280 = "Эта Аямэ и правда казалась идеальной — такой же приветливой и жизнерадостной, как о ней говорят."
52100-281 = "Но Кикё поднимает обоснованные вопросы."
52100-282 = "Трудно объяснить... Да, она весёлая и лучезарная, но ей недостаёт какого-то тепла. Она напоминает мне... электрическую свечу."
52100-283 = "Признаюсь, мне, Юкари, трудно довериться ей полностью."
52100-284 = ""
52100-286 = ""
52100-288 = "...Но Нагуса так счастлива! Она улыбалась..."
52100-289 = "В последние дни ей было так тоскливо. Даже рядом с нами она казалась одинокой."
52100-290 = "А сейчас... сейчас Нагуса выглядит счастливой и спокойной."
52100-291 = "Даже если мы не до конца доверяем Аямэ..."
52100-292 = "...я не вынесу, если Нагуса снова загрустит!"
52100-293 = "Ну... Конечно, я не хочу, чтобы ей было грустно..."
52100-294 = "[s] «Кем для тебя была Аямэ, Кикё?»"
52100-295 = "Для меня?.."
52100-296 = "Дайте подумать. Та президент Аямэ, которую я знала, несомненно, была примером для всех, но... она была обычным человеком."
52100-297 = "Она была очень талантлива и многое умела. Она ко всем относилась с добротой, поэтому почти все её любили."
52100-298 = "Но и у НЕЁ были свои пределы."
52100-299 = "[s5] «Верно. Невозможно нравиться всем.»\n[s6] «...Даже если она казалась идеальной, скорее всего, это была лишь видимость.»"
52100-302 = "Да. Но тогда я не испытывала ни нынешней неуверенности, ни тем более этого беспокойства."
52100-303 = "...Теперь понимаете, почему мне трудно ей доверять? А вы доверяете?"
52100-304 = ""
52100-307 = "[ns] «Прости, но я не могу на это ответить.»"
52100-308 = ""
52100-310 = ""
52100-311 = "...Почему?"
52100-312 = "[s7] «Как не бывает идеальных людей...»\n[s8] «...так и идеального способа судить о человеке не существует.»"
52100-315 = "[ns] «Я недостаточно хорошо её знаю, чтобы судить.»"
52100-316 = "Сенсей, вопрос был прост. Я спросила, доверяете ли вы президенту Аямэ."
52100-317 = "[s9] «Доверие нужно строить вместе.»\n[s10] «Нам надо узнать друг друга получше.»"
52100-320 = "...У нас нет на это времени."
52100-321 = "Я знала её так долго. Неужели этого не хватило, чтобы... по-настоящему её понять?"
52100-322 = "[s11] «Пока отложим наши суждения.»\n[s12] «Будем внимательны и открыты новому.»"
52100-323 = ""
52100-324 = ""
52100-326 = ""
52100-327 = "...Хорошо. Пока воздержусь от выводов."
52100-328 = "Но подозрения остаются. Как член Хяккарёран, я не позволю опасности застать нас врасплох."
52100-329 = "Узнаю тебя. По крайней мере, теперь мы знаем, что Кикё не самозванка!"
52100-330 = "Вот это обнадёживает!"
52100-332 = "И всё же..."
52100-333 = ""
52100-335 = ""
52100-337 = "...Я видела эту бесстыдную улыбку. Будто всё в порядке, даже после того, как ты сломала Нагусу..."
52100-339 = "...Я пока не готова простить."
52100-341 = "Следующий Эпизод;Путь в потусторонний мир"
