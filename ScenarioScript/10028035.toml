[translation]
10028035-4 = ""
10028035-5 = "Вахаха! Вот это жизнь!"
10028035-6 = "Что это, что это? У маленькой Мисс Милашки есть зубки!"
10028035-7 = "Я знаю, как работает Сенсей, так что тут не сомневалась..."
10028035-8 = ""
10028035-9 = ""
10028035-11 = ""
10028035-12 = "А вот перед тобой, пожалуй, даже стоит извиниться! Кто бы мог подумать, что студент Тринити так двигается?"
10028035-13 = "О-о-о, должно быть, тебя страшно бесило, когда я называла тебя очаровашкой, Мисс Милашка. Хорошо, что ты не попыталась меня избить!"
10028035-14 = "...Ты..."
10028035-15 = "Если бы ты правда сожалела, то перестала бы называть меня этим прозвищем, нет?"
10028035-16 = "Идём-идём! Помни, что мы говорили раньше! Что было — то прошло, или как там!"
10028035-17 = ""
10028035-19 = ""
10028035-20 = "В награду за то, что вы такие отличные союзники, я дам вам небольшой приз! Знание!"
10028035-21 = ""
10028035-23 = "Сейчас мы находимся в вагоне, который раньше был предпоследним. Теперь, очевидно, он последний!"
10028035-24 = "Багажный вагон, который вы ищете, находится са-а-амым первым, прямо рядом с кабиной машиниста."
10028035-25 = "У меня острый глаз и ещё более острый ум, так что общую схему этого бешеного поезда я уже вычислила."
10028035-26 = "Хотим мы остановить поезд или найти драгоценные потерянные вещи — путь один..."
10028035-27 = "Вперёд! Все ответы находятся в голове поезда!"
10028035-28 = "По первоначальному плану, если бы мне не удалось отцепить транспортный вагон и сбежать, я бы сразу перешла к плану Б..."
10028035-29 = "Который включал сход поезда с рельсов с помощью бомбы, использование хаоса и связь с другими членами клуба, чтобы организовать мой побег, но..."
10028035-30 = "[s] «Пустить поезд под откос... Логично...»"
10028035-31 = ""
10028035-34 = "[ns1] «...Стой! Повтори?!»\n[ns2] «Нет! Нет, это не логично! Объясни!»"
10028035-37 = "Вахахаха! Если будете так на меня смотреть, вы заденете мои чувства, Сенсей!"
10028035-38 = "Не волнуйтесь. Пока я здесь, я не позволю им этого сделать! Пока я здесь!"
10028035-39 = "Мы ведь создали совместную компанию! Даже я не предаю коллег!"
10028035-40 = "Смотри, в той сумке у тебя что-то важное, да?"
10028035-41 = "И Сенсей тоже в этом поезде. Сход поезда с рельсов точно не в моих интересах, верно?"
10028035-42 = "Думаю, вы понимаете. Придётся идти долгим путём и замедлить поезд."
10028035-43 = "Когда живёшь такой жизнью, как мы здесь..."
10028035-44 = "Ну, начинаешь замечать, кто держит слово, а кто нет."
10028035-45 = "Нужно знать, кому можно доверять. Поэтому я всегда держу слово."
10028035-46 = "В общем, всё ведь удачно сложилось, правда?"
10028035-47 = ""
10028035-49 = ""
10028035-50 = ""
10028035-51 = ""
10028035-52 = ""
10028035-53 = "Хотя признаю... Маленькая милашка меня впечатлила. Едва поверила, что она из Тринити!"
10028035-54 = ""
10028035-56 = ""
10028035-57 = ""
10028035-58 = "[ns3] «С-Сумка! Сосредоточься на сумке, Ичика!»\n[ns4] «У неё просто проблемы с общением! Вот и всё!»"
10028035-61 = "Я... Ахахаха... Да. Хорошо."
10028035-62 = "Хм? Опять задела твои чувства? У тебя маленькая складка над бровью. Прямо вот здесь!"
10028035-63 = "Я вообще не понимаю, о чём ты думаешь, когда глаза закрыты! Злишься? Если да, прости! Вахахаха!"
10028035-64 = "Не знаю, что именно сделала не так, но извиняюсь и всё такое! Теперь мир?"
10028035-65 = "..."
10028035-66 = "..."
10028035-67 = "Фух! Отличная работа! Более-менее поспеваете!"
10028035-68 = "Вы справитесь! Давайте и дальше работать вместе вот так!"
10028035-69 = "...Ха. Ха."
10028035-70 = "Точно. Сначала нужно... найти сумку..."
10028035-71 = "Ха-ха..."
10028035-72 = "[s5] «...»\n[s6] «После всего этого угощу тебя чем захочешь.»"
10028035-75 = "Хватит тянуть время! У нас жёсткий график, вы двое!"
10028035-76 = "Спорим, полно пассажиров злится, что теперь поезд идёт без остановок! Давайте объединим народ и устроим вечеринку!"
10028035-77 = "Хорошо, хорошо! Помните: если не доберётесь до головы поезда, всё это было зря!"
10028035-78 = "Итак. От самого последнего вагона..."
10028035-79 = "...вплоть до первого!"
