[translation]
1001303-1 = "Мир селфи"
1001303-2 = ""
1001303-3 = ""
1001303-4 = ""
1001303-5 = "[ns1] «Привет, Цуруги.»\n[ns2] «Что происходит?»"
1001303-6 = "О-О, здравствуй, Сенсей."
1001303-7 = "О-О, здравствуй, Сенсей."
1001303-8 = "К-Какая сегодня хорошая погода! Т-Так... эм..."
1001303-9 = "Я позвала тебя сегодня потому, что..."
1001303-10 = "[s] Выслушать её."
1001303-13 = ""
1001303-14 = "Э-Эм... В общем... Цуруги, нам нужна твоя фотография, чтобы обновить документы."
1001303-15 = "Фотография?"
1001303-16 = "Д-Да! Подойдёт даже снимок, сделанный на телефон..."
1001303-17 = "Понятно."
1001303-18 = "А-А-а! Для меня это слишком. ПростоОтправьМнеФотоЛадноПока!"
1001303-19 = ""
1001303-20 = ""
1001303-21 = "Фотография..."
1001303-23 = "[ns] «Ты ведь не умеешь делать селфи, да?»"
1001303-24 = "П-Похоже на то."
1001303-25 = "Сама идея фотографировать себя кажется мне такой странной..."
1001303-26 = "Последний раз меня фотографировали для ученического билета, и всё закончилось тем, что я разрушила здание."
1001303-27 = "[s] «Вот как...»"
1001303-28 = "Я-я надеялась... что ты научишь меня, Сенсей..."
1001303-29 = "[s3] «Конечно, без проблем!»\n[s4] «Я научу тебя искусству селфи!»"
1001303-30 = "С-Спасибо!"
1001303-31 = "С-Спасибо!"
1001303-33 = "[ns5] «Главное в хорошем фото — освещение!»\n[ns6] «Обязательно снимай там, где много света!»"
1001303-34 = "Освещение..."
1001303-35 = "Освещение..."
1001303-36 = "Значит, нужно повернуться лицом к солнцу."
1001303-37 = "Тогда попробую."
1001303-39 = ""
1001303-40 = "*щелчок*"
1001303-41 = "Так нормально?"
1001303-42 = "[s7] (...М-да.)\n[s8] «...Может, попробуешь другое выражение лица?»"
1001303-43 = "Поняла. Нужно сделать выражение мягче."
1001303-44 = "Поняла. Нужно сделать выражение мягче."
1001303-46 = "[s] «Попробуй улыбнуться чуть сильнее.»"
1001303-47 = "Улыбнуться... Я могу."
1001303-48 = "Так... вот так...?"
1001303-50 = ""
1001303-51 = "*щелчок*"
1001303-52 = "[s9] (...Не хочется говорить, но мне это будет сниться в кошмарах.)\n[s10] «На этот раз не напрягайся. Пусть всё будет естественно.»"
1001303-53 = "Естественно улыбнуться..."
1001303-54 = "Естественно улыбнуться..."
1001303-55 = "Вот... так?"
1001303-57 = ""
1001303-58 = "*щелчок*"
1001303-59 = "[s11] (...Я чуть не описался.)\n[s12] «Попробуй представить что-нибудь, что делает тебя счастливой.»"
1001303-60 = "Думаешь, мне стоит представить что-то, что делает меня счастливой?"
1001303-61 = "Думаешь, мне стоит представить что-то, что делает меня счастливой?"
1001303-62 = "Хм. Может... вот так?"
1001303-64 = ""
1001303-65 = "*щелчок*"
1001303-66 = "[s13] (Не получается.)\n[s14] «Давай попробуем что-нибудь другое.»"
1001303-67 = "П-Прости. Я просто не знаю, как вести себя естественно..."
1001303-68 = "П-Прости. Я просто не знаю, как вести себя естественно..."
1001303-69 = "Я-я не могу понять."
1001303-71 = "Это место...?"
1001303-72 = "[s15] «Попробуем сфотографироваться на фоне заката.»\n[s16] (С этого угла тени немного скроют её лицо!)"
1001303-73 = "Ты уверена, что так будет лучше?"
1001303-74 = "Ты уверена, что так будет лучше?"
1001303-75 = "Если ты думаешь, что сработает, значит, я тоже верю."
1001303-76 = "И что мне делать в этот раз...?"
1001303-77 = "[s] «Попробуем динамичную позу!»"
1001303-78 = "Д-Динамичную позу?"
1001303-80 = "Я-я готова."
1001303-81 = "[s] «Отлично! Представь, что ты маленькая девочка и бежишь по саду!»"
1001303-82 = "(Дададададада!)"
1001303-84 = ""
1001303-85 = ""
1001303-86 = "*щелчок*"
1001303-87 = ""
1001303-89 = "Н-Ну как?"
1001303-91 = ""
1001303-94 = ""
1001303-97 = ""
1001303-100 = "[ns17] (Это тоже не работает.)\n[ns18] «Давай попробуем что-нибудь ещё.»"
1001303-101 = "В-Всё ещё плохо...?"
1001303-102 = "В-Всё ещё плохо...?"
1001303-104 = "Небольшой парк развлечений на окраине Тринити"
1001303-105 = "Почему именно сюда...?"
1001303-106 = "[s] «Ночная съёмка полностью скроет твоё лицо!»"
1001303-107 = "П-Полностью скроет?"
1001303-108 = "Я-я не фотограф, но разве это не лишает снимок смысла?"
1001303-109 = "[s19] «Всё будет хорошо.»\n[s20] «Просто доверься мне. Я справлюсь!»"
1001303-110 = "Л-Ладно. Не знала, что фотография — такая сложная вещь..."
1001303-111 = "Л-Ладно. Не знала, что фотография — такая сложная вещь..."
1001303-113 = "[s21] (Это уже едва ли можно назвать портретом.)\n[s22] (Уверен, всё будет хорошо. Нужно верить!)"
1001303-114 = "Была не была!"
1001303-115 = "Была не была!"
1001303-120 = "Каждый снимок выглядит как фотография паранормального явления..."
1001303-122 = "[ns] «Прости... Я оказался не очень полезен.»"
1001303-123 = "В-Всё нормально!"
1001303-124 = "Попробовать что-то такое заставило меня почувствовать себя намного взрослее..."
1001303-125 = "Так что это мне нужно благодарить тебя за сегодняшний день!"
1001303-127 = "Когда Цуруги ушла, она выглядела не такой разочарованной, как я ожидал."
