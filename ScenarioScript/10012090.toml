10012090-63 = "...Чего-о-о?!"
10012090-65 = "...Отказываюсь."
10012090-66 = "Я так это не оставлю! Вы вообще знаете, кто я?!"
10012090-67 = "Я захвачу ещё больше островов! Увеличу свои силы так, что вам и не снилось."
10012090-68 = "Я отберу это место у вас! ...Когда-нибудь."
10012090-69 = "Я исполню свою мечту! Объединю все курорты архипелага и буду ими править!"
10012090-70 = "Нет-нет-нет-нет. Подожди!"
10012090-71 = "Захватить это? Не принять поражение? Да что во имя Кивотоса ты несёшь?!"
10012090-72 = "Мы здесь только потому, что Серика выиграла отпуск в розыгрыше... Что ты имеешь в виду под «курортами архипелага»?"
10012090-73 = "Объясняй! Ты нам это должна!"
10012090-74 = ""
10012090-77 = ""
10012090-78 = "...Вы... серьёзно...?"
10012090-79 = "Вы даже не Охотники за курортами? Уgh. Меня правда победила кучка обычных людей?"
10012090-80 = "Уgh! Вы и правда ничего не понимаете, так что я объясню."
10012090-81 = "Хотите вы того или нет, вы наши конкуренты. И не только наши."
10012090-82 = "Пока вы на этом архипелаге, вы участвуете в игре."
10012090-84 = "Охотники... за чем?"
10012090-85 = "...Архипелаг?"
10012090-86 = "Простите. Конкуренты?"
10012090-87 = "Вы правда ничего не понимаете?! Смотрите, вот наши билеты!"
10012090-89 = "Это вы ничего не понимаете! У меня то же самое!"
10012090-90 = "Вот! Если не верите — смотрите!"
10012090-91 = ""
10012090-92 = "В-Выглядит совершенно одинаково..."
10012090-93 = "Правда?! Какого чёрта? И правда одинаково!"
10012090-95 = "Очевидно! Серьёзно, зачем вы вообще сюда приехали?! Вы что, контракт не получили?"
10012090-97 = "...!"
10012090-98 = "Откуда ты знала?"
10012090-99 = "Потому что только так можно попасть на этот архипелаг."
10012090-100 = "Теперь дошло?! Люди с правами на курорт..."
10012090-102 = "...разбросаны по всему архипелагу!"
10012090-105 = "Чего-о-о?!"
10012090-106 = ""
10012090-108 = ""
10012090-110 = ""
10012090-113 = "Н-Не может быть! Аяне, контракт!"
10012090-114 = "Он у меня... Посмотрим... условия в самом низу..."
10012090-115 = "Владелец этого контракта получает право пользования курортом «Потерянный рай»."
10012090-116 = "Вышеупомянутое «право пользования» означает права на всю землю, товары и объекты курорта, а также..."
10012090-117 = "...Всю прибыль и ресурсы, производимые курортом..."
10012090-118 = "Я думала, все эти бумажки нужны просто чтобы дать нам кровать и горячую еду!"
10012090-119 = "К сожалению, похоже, формулировки намеренно составлены так, чтобы спровоцировать хаос."
10012090-120 = "На первый взгляд всё выглядит законно. На каждом отдельном острове был свой победитель."
10012090-121 = "Однако в контракте указан «курорт Потерянный рай», то есть весь архипелаг."
10012090-122 = "Нигде прямо не сказано, что островов несколько."
10012090-123 = "Но люди, видимо, заметили лазейку в контракте и начали нападать на другие острова, чтобы присваивать их курорты."
10012090-124 = "Так всё и превратилось в Охоту на курорты! Наконец-то поняли!"
10012090-125 = "Да. Мрачная игра ради денег и власти."
10012090-126 = "Здесь опасно, все. Мне это совсем не нравится."
10012090-127 = "Нам нужно уйти отсюда, пока всё не стало ещё хуже."
10012090-129 = "...!"
10012090-130 = "Попались!"
10012090-131 = ""
10012090-134 = "...! *кашляет*"
10012090-135 = "Дымовая бомба...?! Где она её прятала?"
10012090-136 = "В следующий раз, когда мы встретимся, вам конец! Ха-ха-ха!"
10012090-137 = "Вставайте! Отступаем! Все, отступаем!"
10012090-138 = "А-А?! О! О-Отступаем!"
10012090-139 = "Назад к судну на воздушной подушке!"
10012090-143 = ""
10012090-144 = "Они ушли так же внезапно, как и появились."
10012090-146 = "...Хех."
10012090-148 = "Какой хаотичный летний отпуск."
