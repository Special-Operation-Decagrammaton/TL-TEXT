10012090-17 = "Вы... издеваетесь... Это же нелепо."
10012090-18 = "Хотите сказать, что все наши силы не смогли справиться с этой маленькой группой?"
10012090-19 = "Мы, Бандиты в шлемах, были действующими победителями Охоты на курорты. Откуда вы такие сильные?!"
