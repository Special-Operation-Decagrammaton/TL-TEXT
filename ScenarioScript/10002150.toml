[translation]
10002150-1 = "Послесловие;Как построить идеальный песочный замок"
10002150-2 = "Жаль, что песочный замок так быстро развалился, пусть даже из-за нападения тех нарушителей."
10002150-3 = "Возможно, Азуса была права."
10002150-4 = "[s] «Жаль. Ты правда построила крутой песочный замок.»"
10002150-5 = "Как он выглядел, для меня не важно."
10002150-6 = "Ценность песочного замка определяет лишь один фактор..."
10002150-7 = "...насколько хорошо он защищает!"
10002150-8 = "В конце концов, мокрого песка на пляже сколько угодно. Его недостаток — низкая прочность конструкции и неспособность выдерживать внешнее воздействие."
10002150-9 = "Но что, если смешать его с чем-то более связующим...?"
10002150-10 = "Представьте, какой замок можно построить, смешав песок с бетоном. Настоящий песчано-бетонный замок!"
10002150-11 = ""
10002150-13 = ""
10002150-14 = ""
10002150-15 = "Он выдержит сжатие, но всё равно разрушится при достаточно сильном ударе."
10002150-16 = "Этого недостаточно, чтобы построить песочный замок, способный отбиться от этих проблемных студентов."
10002150-17 = "Тогда какой материал нам НУЖЕН?"
10002150-18 = "Можно использовать раствор. Он дешёвый и его легко достать."
10002150-19 = "Хотя сам по себе он тоже не самый прочный и потребует армирования. Поэтому я рекомендую..."
10002150-20 = "...добавить стальную арматуру."
10002150-21 = "Арматура не только повысит прочность раствора на растяжение, но и увеличит связность конструкции, позволив построить более крепкий замок."
10002150-22 = "Гениально."
10002150-23 = "У тебя всегда гениальные идеи, Азуса."
10002150-24 = "Когда мы впервые встретились, я думала, что ты просто извращенка. На деле же ты гениальный стратег и прекрасно разбираешься в укреплениях. Я никогда так не ошибалась."
10002150-25 = "Не только ты была во власти предубеждений. Я думала, что ты всего лишь ещё один упрямый член Комитета правопорядка..."
10002150-26 = "...но твоя способность быстро переоценивать ситуацию заставила меня изменить мнение."
10002150-27 = "[s] «Как всё это вообще связано с песочными замками?»"
10002150-28 = ""
10002150-29 = "Надеюсь, вы не намекаете, что наше творение технически не будет песочным замком. Пока песок остаётся одним из строительных материалов, всё считается."
10002150-30 = ""
10002150-31 = "А поскольку оно будет служить оборонительным целям, его всё ещё справедливо называть «замком»."
10002150-33 = ""
10002150-34 = "Следовательно, это ВСЁ ЕЩЁ песочный замок!"
10002150-35 = "[s] «Когда вы двое успели так спеться...?»"
10002150-36 = ""
10002150-37 = "Сходим за бетоном и арматурой для раствора?"
10002150-38 = "Я заложу фундамент!"
10002150-39 = ""
10002150-41 = ""
10002150-43 = "(После этого Маширо и Азуса объединились и начали строить на пляже свой так называемый песочный замок...)"
