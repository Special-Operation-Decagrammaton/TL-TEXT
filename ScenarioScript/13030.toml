[translation]
13030-1 = "Episódio 3;Academia Ferroviária Highlander"
13030-2 = "Ahahaha, isso aí, mandaram bem demais!"
13030-3 = "Que barulheira..."
13030-4 = "Mas deu um alívio, né não?#nE aí, como tá?"
13030-5 = "Demolição da rocha que bloqueava os trilhos concluída!#nConforme consta no plano do projeto, os trilhos continuam adiante."
13030-6 = "Os reparos no trem também já terminaram, então podemos partir imediatamente!"
13030-7 = "Beleza, então vamos finalizar isso logo. Manda ver no teste de operação."
13030-8 = "Sim, deixe conosco!"
13030-14 = "Uou, tá se mexendo~."
13030-15 = "Pahaha, tá indo de vento em popa! Acho que dá pra adiantar o prazo em uma semana!"
13030-16 = "Hum, a propósito...#nIsso não vai dar problema mesmo?"
13030-17 = "Hm?"
13030-18 = "O quê...?"
13030-20 = "A-Aqui é o distrito autônomo de outra escola, não é...?"
13030-22 = "E daí?"
13030-23 = "Qual é o problema?"
13030-25 = "N-Não tem essa de \"qual é o problema\"!"
13030-26 = "Se fizermos uma obra dessas sem permissão,#nquem sabe o que vão dizer..."
13030-27 = "Desse jeito, existe até o risco de um conflito armado..."
13030-28 = "Aah, deixa pra lá, tá tudo bem~"
13030-29 = "Aha, isso aí.#nAfinal, esta \"Ferrovia Transdesértica\" já é nossa mesmo."
13030-30 = "Como é?!"
13030-31 = "Ferrovia Transdesértica de Abydos: mais de 51% garantiido~"
13030-32 = "Ou seja, esta ferrovia já é propriedade nossa, do CCC.#nBom, tecnicamente é um pouquinho diferente, mas quem se importaa~"
13030-33 = "M-Mas avançar com a obra sem nem um contrato..."
13030-34 = "Relaxa, relaxa!"
13030-35 = "Se ficarmos nessa, não vamos cumprir o prazo, né não? Tempo é dinheiro, afinal."
13030-37 = "Obra a todo vapor e burocracia a gente vê depois, né~"
13030-38 = "Se o CCC decidiu assim, então deve estar tudo bem..."
13030-39 = "T-Tem certeza mesmo disso?"
13030-40 = "Maybe."
13030-41 = "Já disse que tá tudo bem! Vamos, acelera!"
13030-42 = "O que vocês pensam que estão fazendo?!"
13030-50 = "Fomos descobertaas~"
13030-51 = "Uau, chegaram bem mais rápido do que eu esperava."
13030-53 = "Eu sabia que ia dar problema!"
13030-54 = "Pessoal da Academia Ferroviária Highlander! Aqui é o Distrito Autônomo de Abydos!#nParem imediatamente!"
13030-56 = "É mesmo?"
13030-58 = "Conduzir atividades administrativas no Distrito Autônomo de Abydos sem a nossa permissão é um absurdo!"
13030-59 = "Primeiro o pessoal de Gehenna, agora vocês... Por que será..."
13030-60 = "Que existe tanta gente sem um pingo de bom senso?!"
13030-61 = "C-Calma, Ayane-chan..."
13030-63 = "Ela tá bravaa?"
13030-64 = "Tá sim."
13030-65 = "[s] \"Posso perguntar o que vocês estão fazendo?\""
13030-66 = "Quem é vocêe?"
13030-67 = "Um adulto...?"
13030-68 = "A-Aquele é... o Sensei da Schale!"
13030-69 = "Schale?"
13030-70 = "Sensei?"
13030-71 = "É a pessoa que anda por aí cometendo atos de sabotagem sob o pretexto de resolver conflitos entre escolas!"
13030-72 = "[s] \"...\""
13030-73 = "Dizem que quem explodiu o nosso trem daquela outra vez#ntambém foi o Sensei da Schale!"
13030-74 = "E ainda tem outros boatos assustadores...#nDizem até que, pelado..."
13030-75 = "[s1] \"A-Acho que vocês me confundiram com outra pessoa...\"\n[s2] \"B-Boatos são mesmo assustadores, né...\""
13030-78 = "O que você anda aprontando pelas costas deste velhote, hein, Sensei...?"
13030-79 = "Nn, não esperava menos do Sensei."
13030-80 = "Por que você tá toda orgulhosa, Shiroko-senpai?!"
13030-85 = "De qualquer forma, este é o nosso distrito autônomo!#nParem agora mesmo!"
13030-86 = "Seja qual for o motivo, o correto não seria começar por uma negociação?!"
13030-88 = "Nozomi, o que a gente faz?"
13030-89 = "Como assim o que a gente faz? O de sempre, ué."
13030-94 = "...Hã?#nO-O que vocês...?"
13030-99 = "U-Uau?! Isso é perigoso, suas loucas?!"
13030-101 = "Como sempre, o pessoal da administração dá um jeito na bagunça depois.#nPaha, esquenta não, esquenta nãoo~"
13030-102 = "Genial, geniaal~"
13030-106 = "Espera, a Ferrovia Transdesértica está funcionando...?!"
13030-107 = "O pessoal da Highlander embarcou no trem!#nDesse jeito, elas vão escapar!"
13030-108 = "O que vamos fazer?!"
13030-109 = "— Vamos atrás delas."
13030-110 = "...Ah, então elas estavam consertando o trem.#nA gente pergunta o motivo depois...#nPrimeiro, vamos atrás delas."
13030-111 = "Não podemos fazer vista grossa para esse comportamento abusivo em Abydos!#n...Elas vão ter que nos dar uma boa explicação!"
13030-113 = "Sensei, dê as ordens!"
13030-114 = "[s3] \"Eu já estava sentindo que ia acontecer alguma coisa...\"\n[s4] \"Vamos lá, pessoal!\""
