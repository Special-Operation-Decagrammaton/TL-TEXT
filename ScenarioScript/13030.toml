[translation]
13030-1 = "Эпизод 3;Железнодорожная академия Хайлендер"
13030-2 = "Пахяхяхя! Вот это кайф!"
13030-3 = "Громко... Очень громко..."
13030-4 = "Это называется самовыражение! Са-мо-вы-ра-же-ни-е! Ладно, какая обстановка?"
13030-5 = "Валун, перекрывавший путь, больше не существует! И вишенка на торте — мы откопали узкоколейку! Всё как было описано в договорах!"
13030-6 = "Мы только что закончили ремонт поезда! Можно устроить тестовый заезд? Пожалуйста-пожалуйста-пожалуйста!"
13030-7 = "У нас сроки горят, так что поехали! Нужно добраться до заброшенного маршрута во-о-он там!"
13030-8 = "Все на борт!"
13030-9 = ""
13030-11 = ""
13030-12 = ""
13030-14 = "Ого. Поехали."
13030-15 = "Пахяхяхя! Такими темпами мы закончим на целую неделю раньше графика!"
13030-16 = "Э-Это, конечно, здорово, но вы уверены, что с бумажками всё чисто?"
13030-17 = "Хм?"
13030-18 = "Что это вообще значит...?"
13030-20 = "Мы ведь сейчас незаконно на территории другого района?"
13030-22 = "А. Правда?"
13030-23 = "И...?"
13030-25 = "Что?! Почему вас это вообще не волнует?!"
13030-26 = "Точного названия не знаю, но мы сейчас в другом районе... Если начать стройку без разрешений и документов, это фактически вторжение."
13030-27 = "Мы можем развязать настоящую войну!"
13030-28 = "О. И что... в этом плохого...?"
13030-29 = "Пахяхя! Серьёзно! Чего ты переживаешь из-за мелочей? Транс-пустынная железная дорога теперь и так наша."
13030-30 = "Что?!"
13030-31 = "Агась. У нас 51% производных облигаций Транс-пустынной железной дороги Абидоса. Да-да."
13030-32 = "Так что теперь всё это принадлежит CCC! Технически! Почти! Да какая разница, всё будет нормально!"
13030-33 = "Одних прав на железную дорогу недостаточно! Нужны договоры! Разрешения! Согласование строительства!"
13030-34 = "Бла-бла-бла. Скука! Такая скука!"
13030-35 = "Если будем столько времени распутывать бюрократию, никогда не уложимся в сроки. Никогда не забывай: для железнодорожников время — деньги!"
13030-37 = "Агась... Девиз Хикари примерно такой... Быстро строим, администрацию игнорируем. Кому вообще нужны бумажки?"
13030-38 = "Всё это звучит невероятно проблемно, но если CCC так говорит, поверю, что проблем не будет..."
13030-39 = "Эм... ведь не будет, да?"
13030-40 = "Наверное?"
13030-41 = "Не-а! Ни одной! Ха-ха-ха!"
13030-42 = "Кто вы, мать вашу, такие?!"
13030-44 = ""
13030-45 = ""
13030-46 = ""
13030-47 = ""
13030-49 = ""
13030-50 = "Ой. Сестрёнка, нас раскрыли."
13030-51 = "Как быстро!"
13030-53 = "Ты же сказала, что проблем вообще не будет!"
13030-54 = "Железнодорожная академия Хайлендер! Вы незаконно находитесь на территории Абидоса! Объяснитесь!"
13030-56 = "Хм-м."
13030-58 = "Никакие работы в районе Абидоса нельзя проводить без прямого разрешения Комитета по выплате долга! Это закон! Нет, это здравый смысл!"
13030-59 = "Я думала, только в Геенне живут невежественные громилы, плюющие на элементарные нормы приличия! Но нет! Весь Кивотос — что, зверинец грубых безмозглых академий?"
13030-60 = "Мне вообще позволено хоть каплю логики увидеть в этом мире?! Или мы теперь все психопаты?!"
13030-61 = "Тише-тише, Аяне. Дыши."
13030-63 = "Смотри. Она злая. Очень злая."
13030-64 = "Ещё бы...!"
13030-65 = "[s] «Что Железнодорожной академии Хайлендер нужно в этом районе?»"
13030-66 = "Кто это...?"
13030-67 = "Взрослый?"
13030-68 = "Э-Это Сенсей! Сенсей Шале!"
13030-69 = "Сенсей?"
13030-70 = "Шале?"
13030-71 = "Вы не слышали? Они печально известны! По слухам, под предлогом решения конфликтов между академиями сжигают всё на своём пути! Ужасающий инструктор, который поддерживает порядок!"
13030-72 = "[s] «...»"
13030-73 = "Однажды кто-то их разозлил, и они взорвали целый поезд! Один из наших! Я бы никогда не стала с ними связываться!"
13030-74 = "И слухи становятся всё хуже и хуже. Я слышала, они бегали голышом—"
13030-75 = "[s1] «Не будем преувеличивать...»\n[s2] «Хорошо, что это всего лишь слухи, да? Ха-ха!»"
13030-78 = "Ну-ну. Во что только наш уважаемый учитель умудряется вляпаться?"
13030-79 = "Хех. Давай, Сенсей."
13030-80 = "Широко! В том, что они сказали, вообще ничего хорошего нет!"
13030-81 = ""
13030-83 = ""
13030-85 = "Ваши оправдания не имеют значения! Мы обладаем юрисдикцией в своём районе и требуем немедленно прекратить эту деятельность!"
13030-86 = "Права на железную дорогу не освобождают вас от обязанности сотрудничать с органом управления района!"
13030-88 = "Что делаем, Нозоми?"
13030-89 = "Дурной вопрос. Что всегда, Хикари!"
13030-90 = ""
13030-92 = ""
13030-94 = "...А?! Вы что собираетесь—"
13030-95 = ""
13030-99 = "Эй! Это опасно!"
13030-101 = "Будем делать что хотим, а бумажные крысы потом пусть разгребают! Пахяхяхяхя!"
13030-102 = "Хикари нравится...!"
13030-103 = ""
13030-105 = ""
13030-106 = "Поезд... Движется?! По Транс-пустынной железной дороге?"
13030-107 = "Все студенты Хайлендер уже в поезде! Они пытаются сбежать!"
13030-108 = "Что делать?"
13030-109 = "Преследовать."
13030-110 = "Значит, их целью было починить поезд... Зачем — разберёмся после того, как поймаем."
13030-111 = "Пошли! Я не позволю так обращаться с Абидосом! Выясним, что они задумали."
13030-113 = "За вами, Сенсей!"
13030-114 = "[s3] «Чувствовал, что всё этим и закончится...»\n[s4] «Комитет по выплате долга, выдвигаемся!»"
