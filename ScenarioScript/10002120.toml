[translation]
10002120-1 = "Эпизод 12; Фейерверки"
10002120-2 = "В итоге нам удалось выполнить пять пунктов из списка."
10002120-3 = "Последний пункт нельзя было выполнить до темноты, поэтому у нас осталось немного свободного времени."
10002120-5 = "Сегодняшний день пролетел незаметно, правда?"
10002120-6 = "До темноты ещё есть время, но интересно, где остальные."
10002120-7 = "[s] «Кажется, Хифуми и Азуса пошли покупать фейерверки.»"
10002120-8 = "Да, но интересно, почему они так долго. Изначально я собиралась пойти вместе с Цуруги."
10002120-9 = "Ке-ке-ке! Хи-хи!"
10002120-10 = "Кажется, она этого очень ждала."
10002120-11 = "Надеюсь, с ними всё хорошо, а пока у нас есть время заняться чем захочется."
10002120-12 = "А когда закончим с фейерверками, я отправлю Хасуми отчёт и фотографии."
10002120-13 = "На этом их задания закончатся, и всё благодаря вашей помощи, Сенсей."
10002120-14 = "[s1] «А тебе самой разве не было весело, Маширо?»\n[s2] «Ты уверена? Можешь ещё повеселиться, если хочешь.»"
10002120-15 = "Я вообще попала в эту поездку лишь по случайности."
10002120-16 = "Я вообще попала в эту поездку лишь по случайности."
10002120-17 = "Но признаю, я тоже поддалась настроению и хорошо провела время."
10002120-18 = "Я должна в любой момент быть готова защищать справедливость, но сегодня, кажется, несколько раз позволила себе расслабиться."
10002120-19 = "Так что, пожалуй, я поняла, что мне ещё есть куда расти."
10002120-20 = "В любом случае пойду искать Хифуми и Азусу, чтобы убедиться, что с ними всё хорошо."
10002120-21 = ""
10002120-23 = ""
10002120-25 = ""
10002120-26 = "[ns3] «А ты, Цуруги?»\n[ns4] «Ну как, тебе сегодня было весело?»"
10002120-27 = "...!"
10002120-28 = "...!"
10002120-29 = "Я-я? Ну, эм..."
10002120-30 = "Эм..."
10002120-31 = "Честно говоря, не знаю. Значит, вот как ощущается веселье?"
10002120-32 = "Наверное, всё было не так, как я ожидала..."
10002120-33 = "...но часть меня чувствует, что всё вышло именно так, как надо."
10002120-34 = "[s5] «Не думаю, что тут бывает правильно или неправильно.»\n[s6] «Всё, что ты чувствовала, нормально. Это твой опыт.»"
10002120-35 = "Наверное, ты права."
10002120-36 = "Наверное, ты права."
10002120-37 = "Пляж оказался не таким, как я читала в книгах, но все, похоже, действительно веселились."
10002120-38 = "Но больше всего мне, наверное, понравилось..."
10002120-39 = "Эм..."
10002120-40 = "То, что ты—"
10002120-42 = "Мы верну-у-улись!"
10002120-43 = "...?!"
10002120-44 = ""
10002120-46 = ""
10002120-48 = ""
10002120-49 = "Простите, что так долго. Нам пришлось поискать поблизости лавку с фейерверками."
10002120-50 = "У них небольшая дальность и слабая огневая мощь, но технически это всё-таки фейерверки."
10002120-51 = "Лично я не понимаю, почему за то, что совершенно бесполезно в бою, берут столько денег."
10002120-52 = "Азуса, они нужны для развлечения, а не чтобы причинять людям вред."
10002120-53 = "Именно поэтому я на всякий случай подготовила немного самодельной взрывчатки. Имейте в виду, у нас есть альтернатива, если понадобится."
10002120-54 = "Я же говорю, нам не нужна настоящая взрывчатка!"
10002120-55 = ""
10002120-56 = "Эм...?"
10002120-57 = "Всё в порядке? Мы чему-то помешали?"
10002120-58 = "Эм..."
10002120-60 = "Ке-ке-ке! Хи-хи!"
10002120-62 = "А-а-а! Простите, простите, простите, простите!"
10002120-63 = "[s] «...»"
10002120-65 = "Вскоре солнце село, и наконец стемнело."
10002120-68 = "Когда солнце скрылось за горизонтом, на небе появились звёзды."
10002120-69 = "Местные лавки закрывались, и на пляже остался лишь шум разбивающихся волн."
10002120-70 = "Теперь так тихо. Все остальные уже ушли домой?"
10002120-71 = "Нет, пляжные хулиганы всё ещё где-то вдалеке. Правда, понятия не имею, чем они там занимаются."
10002120-72 = "Правда? Они довольно далеко, но, может, нанесём упреждающий удар, прежде чем они снова устроят нам засаду?"
10002120-73 = "П-Пожалуйста, не начинай ещё одну драку. Будем надеяться, они усвоили урок."
10002120-74 = "Как скажешь, но, по-моему, мы рискуем."
10002120-75 = "Сегодня они сорвали каждую нашу миссию. Что помешает им сделать это снова?"
10002120-76 = "[s7] «Кто знает? Случится — так случится.»\n[s8] «Может, они ждут фейерверков.»"
10002120-78 = "Правда? Думаешь, они просто будут сидеть и смотреть?"
10002120-80 = "Правда? Думаешь, они просто будут сидеть и смотреть?"
10002120-81 = "Такую возможность отрицать нельзя. Мы встретили их, когда покупали фейерверки."
10002120-82 = "Но если предположить, они наверняка тоже купили себе фейерверки."
10002120-83 = "Хотя, возможно, они запасались взрывчаткой, чтобы использовать её против нас. Я не стану возражать против упреждающей атаки."
10002120-84 = "Я всё ещё не думаю, что нужно заходить так далеко."
10002120-85 = "Я так и думала, что ты это скажешь. Тогда просто будем настороже."
10002120-86 = "Поняла. Если тебя устраивает этот план, то и меня тоже."
10002120-87 = ""
10002120-90 = ""
10002120-96 = "Фейерверки..."
10002120-97 = "Ошибки быть не может."
10002120-98 = "Они летят со стороны пляжных хулиганов. Значит, они и правда собирались запускать свои фейерверки..."
10002120-100 = ""
10002120-101 = "Как сверкает..."
10002120-105 = "...?!"
10002120-106 = ""
10002120-112 = "*бум* *бум* *бум*"
10002120-113 = "Так не пойдёт. Азуса, мы должны устроить шоу ещё лучше, чем у них!"
10002120-114 = "Уже. Мы не проиграем. Я отказываюсь проигрывать в соревновании по огневой мощи."
10002120-115 = "Не-е-ет! Что вы двое творите?"
10002120-116 = "Зачем вы превращаете это в соревнование?!"
10002120-120 = "Они там тоже наращивают темп?!"
10002120-121 = "Сенсей! Сделайте что-нибудь!"
10002120-122 = "[s] «Как красиво...»"
10002120-124 = "Значит, они хотят помериться артиллерией?"
10002120-125 = "Я покажу им, как выглядит настоящая тотальная война."
10002120-126 = "Такими темпами у нас закончатся фейерверки!"
10002120-127 = "*БУ-У-УМ*"
10002120-128 = "...?"
10002120-129 = "...!"
10002120-130 = "Это было...?"
10002120-131 = "Звучало как напалм."
10002120-132 = "Его взрывная мощь намного выше, чем у обычного фейерверка. Отлично."
10002120-133 = "Потому что это вообще НЕ фейерверк..."
10002120-134 = "А у нас? Есть напалм?"
10002120-135 = "Нет."
10002120-137 = "Они запускают ещё один!"
10002120-139 = "А?"
10002120-140 = "Он что, не сработал? Летит слишком низко и должен был взорваться уже давно."
10002120-141 = "Хм?"
10002120-142 = "Что...?"
10002120-143 = "О."
10002120-144 = "Летит сюда."
10002120-145 = ""
10002120-148 = "*бум*"
10002120-149 = "Это означает войну."
