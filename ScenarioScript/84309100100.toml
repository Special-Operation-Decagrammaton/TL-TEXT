[translation]
84309100100-5 = "Добро пожаловать. Спасибо, что так быстро откликнулись."
84309100100-6 = "Без проблем. Звучало срочно. Что случилось?"
84309100100-7 = "Действительно срочно. Настолько, что я позвала вас обеих ещё ДО того, как провела расчёты."
84309100100-8 = "ДО расчётов? О, тогда это ТОЧНО что-то серьёзное."
84309100100-9 = "Там уже бардак или что?"
84309100100-10 = "Думаю, она не это имела в виду..."
84309100100-11 = "В каком-то смысле именно это. Ситуация уже произошла. Это не превентивная операция, а ликвидация последствий."
84309100100-12 = "Что?"
84309100100-13 = "О чём ты? Что произошло?"
84309100100-15 = "Спокойно. Никто не пострадал."
84309100100-16 = "Просто... внутренняя система безопасности дала сбой и теперь работает в режиме атаки. Всё ещё управляемо, если мы сможем избегать наблюдения системы и отключить её."
84309100100-17 = "К счастью, сейчас в выставочном зале никого нет."
84309100100-18 = "Понятно. Логично. Уже после закрытия. Но если оставить всё до завтра, кто-нибудь может пострадать."
84309100100-19 = "Хм... Может, на этот раз стоит позвать Семинар? Не похоже, что это работа именно для нас."
84309100100-20 = "Нет, Нэру. Наверное, не для вас."
84309100100-21 = "...Хотя если позвать Семинар, то Семинар позовёт C&C..."
84309100100-22 = "...и это всё равно станет моей работой."
84309100100-23 = "Ц."
84309100100-25 = "Раз мы МОЖЕМ справиться сами, я решила, что не нужно будить членов Семинар в такой час."
84309100100-26 = "У них и так хватает забот с управлением мероприятием. А если они ещё и не выспятся..."
84309100100-28 = "...Ты просто не хотела будить своих младших во время их сладкого-сладкого сна?"
84309100100-29 = "Как заботливо. ТЕПЕРЬ я хочу помочь."
84309100100-30 = ""
84309100100-33 = ""
84309100100-34 = "...Я..."
84309100100-35 = "Я бы не стала так это формулировать..."
84309100100-37 = "Слушай, можешь говорить с нами прямо. Мы не будем тебя за это осуждать."
84309100100-38 = "Ну, я готова. Давайте разберёмся с этим."
84309100100-39 = "Ты говоришь так, будто само собой разумеется, что идёшь с нами."
84309100100-40 = "...?? Ты не хочешь, чтобы я шла?"
84309100100-41 = ""
84309100100-43 = ""
84309100100-44 = "...Ха!"
84309100100-45 = "Конечно хочу. Я просто дразнила тебя."
84309100100-46 = "Я рада. Не хотела быть обузой."
84309100100-47 = "Ты и есть обуза. Просто лучше, чем ничего."
84309100100-48 = "Фуфу, тогда постараюсь сильнее."
84309100100-50 = "...Я подготовлю инструмент для взлома. Вам нужно будет подойти к панели управления и установить его."
84309100100-51 = "И пожалуйста, постарайтесь свести ущерб имуществу к минимуму. Члены Семинар..."
84309100100-52 = ""
84309100100-54 = ""
84309100100-55 = "...Ну, я не хочу, чтобы Юука и Ноа с утра были уставшими."
84309100100-56 = "А Коюки?"
84309100100-57 = "...Коюки, наверное..."
84309100100-58 = "Неважно. Я ничего такого не имела в виду."
