[translation]
1002902-1 = "Тема лекции: Романтика"
1002902-6 = "Следуя указаниям Нацу, я зашёл в один из классов Тринити."
1002902-7 = "Поскольку был выходной, других студентов вокруг не было."
1002902-8 = "О! Вы как раз вовремя."
1002902-9 = ""
1002902-12 = ""
1002902-13 = "Именно этого я и ожидала от учителя. Вы так же готовы получать уроки, как и давать их. Великолепно!"
1002902-14 = "[s1] «Простите? Теперь ученик — я?»\n[s2] «Когда ты сказала: „Я тебя научу“, я думал, ты имела в виду не это.»"
1002902-15 = "Хаха, конечно. Разве я не сказала об этом с самого начала? Я из тех девушек, что держат слово."
1002902-16 = "Хаха, конечно. Разве я не сказала об этом с самого начала? Я из тех девушек, что держат слово."
1002902-17 = "Но не волнуйтесь. Здесь не будет той скукоты, от которой клонит в сон, как на большинстве уроков."
1002902-18 = "Хотя... мне вообще можно говорить такое учителю?"
1002902-19 = "...Хаха."
1002902-20 = "Да ладно вам. Честность — лучшая политика!"
1002902-21 = "Даже вы наверняка засыпали на одном-двух уроках, когда были помоложе. Хотя... забудьте, если не засыпали."
1002902-22 = "Когда два разума без притворства раскрывают друг другу самые искренние и сокровенные мысли — это тоже основа романтики."
1002902-23 = "В общем. Именно поэтому я сегодня вас позвала."
1002902-24 = "Тема сегодняшней лекции — романтика."
1002902-25 = "Что такое романтика? Что делает человека романтичным?"
1002902-26 = "Наверняка вы уже думаете: «Что эта мелкая вообще может знать о романтике?»"
1002902-27 = "Сначала она присылает загадочные цитаты и говорит о печенье в MomoTalk, а теперь ещё читает мне лекцию о сердечных делах?!"
1002902-28 = "Но отбросьте сомнения! Для начала позвольте вручить вам учебные материалы."
1002902-29 = "Позвольте представить..."
1002902-30 = "учебные материалы к сегодняшнему уроку!"
1002902-31 = ""
1002902-33 = ""
1002902-34 = ""
1002902-35 = "[ns3] «Домашнее печенье.»\n[ns4] «Выглядит вкусно.»"
1002902-38 = "Хи-хи. Однако вкус здесь не самое важное."
1002902-39 = "Гораздо важнее их внешний вид."
1002902-40 = "Хм? Не ожидали?"
1002902-41 = "Только представьте: участница Клуба сладкоежек после школы заявляет, что вкус не главное!"
1002902-42 = "Хахаха."
1002902-43 = "Сенсей, потому я и состою в Клубе сладкоежек после школы, а не в Клубе гастрономических путешествий."
1002902-44 = "И я сказала, что это не самое важное, а вовсе не то, что вкус совсем не важен!"
1002902-45 = "Я лишь имела в виду, что есть кое-что ещё важнее вкуса."
1002902-46 = "А именно — внешний вид."
1002902-47 = ""
1002902-49 = ""
1002902-50 = ""
1002902-51 = "Посмотрите на это печенье. У каждого домашнего печенья своя форма и украшение."
1002902-52 = "В них заключены не только свобода и творческий замысел пекаря, но и его бессознательные чувства в момент создания каждого кусочка."
1002902-53 = "Когда полностью сосредотачиваешься на деле и больше ни о чём не думаешь..."
1002902-54 = "чувства, переполняющие тебя при мыслях о ком-то, словно воспоминание запечатлеваются в печенье."
1002902-55 = "Вот что получается, когда позволяешь чувствам и мыслям вести тебя: изделие, отражающее твой искренний внутренний мир."
1002902-56 = "Можно сказать, это и есть воплощение настоящей романтики!"
1002902-57 = "Вот почему я люблю печенье. Мне нравятся и другие дорогие десерты, но в печенье есть своё особое очарование."
1002902-58 = "Пока я готовила это печенье, мне ужасно захотелось поделиться с вами этой философией, Сенсей."
1002902-59 = "Честно говоря, это единственная причина, по которой я вас позвала. Когда мне в голову приходят такие мысли, я просто не могу не поделиться ими с кем-нибудь."
1002902-60 = "Я не слишком утомила вас своей болтовнёй? Хаха."
1002902-61 = "Спасибо, что выслушали. Награда, конечно, небольшая, но можете забрать эти учебные материалы в подарок."
1002902-62 = ""
1002902-64 = ""
1002902-65 = ""
1002902-67 = ""
1002902-68 = "Я знаю, что сказала, будто вкус не так важен, но обещаю: они вкусные."
1002902-69 = "А? Вы хотите съесть их прямо сейчас? Вместе?"
1002902-70 = "*вздыхает*"
1002902-71 = "Сенсей, вы вообще меня слушали?"
1002902-72 = "Я ведь уже говорила, разве нет? Эти печенья воплощают подсознательные чувства того, кто их приготовил."
1002902-73 = "Так что простите, но я вынуждена отказаться. По крайней мере, подождите, пока меня не будет рядом, прежде чем есть их."
1002902-74 = "Что ж, на этом сегодняшняя лекция окончена!"
1002902-75 = "Я пойду первой. Пожалуйста, подождите, пока я уйду, прежде чем выходить, Сенсей."
1002902-76 = "Или можете остаться здесь и повторить учебный материал, который получили сегодня."
1002902-77 = "Хи-хи-хи. Тогда я пошла!"
1002902-78 = ""
1002902-80 = ""
1002902-82 = "После того как Нацу ушла, я остался в классе и съел печенье самых разных необычных форм."
1002902-83 = "...Честно говоря, я так и не был уверен, что означала каждая из этих форм."
