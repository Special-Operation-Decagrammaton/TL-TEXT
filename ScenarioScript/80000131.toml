[translation]
80000131-1 = "Она не открыла коробку"
80000131-3 = "[log=니야]Дорогой Сенсей,[/log]"
80000131-5 = "[log=니야]Надеюсь, это сообщение застанет вас в добром здравии.[/log]"
80000131-7 = "[log=니야]Мне нужно обсудить с вами очень важные дела.[/log]"
80000131-9 = "[log=니야]Как обычно, буду ждать в комнате клуба.[/log]"
80000131-11 = ""
80000131-13 = "[log=니야]Президент Клуба Инь-Ян, Амачи Ния.[/log]"
80000131-15 = ""
80000131-19 = ""
80000131-20 = "...Не прошло и дня с тех пор, как я отправила сообщение."
80000131-21 = "А вы примчались так быстро!"
80000131-22 = "Надёжны, как всегда, Сенсей!"
80000131-23 = "...Подходящее ли это слово? Или вы так торопились, потому что ожидали чего-то особенного?"
80000131-24 = "..."
80000131-25 = "Ня-ха! Пожалуй, хватит дразнить."
80000131-26 = "Нет смысла прощупывать друг друга, правда?"
80000131-27 = "Полагаю, вы знаете, какой сегодня день, а если я позвала вас именно сегодня... причина может быть только одна."
80000131-28 = "Пожалуйста, примите мой скромный подарок."
80000131-29 = "[s1] «Постой, разве это не невероятно роскошно?»\n[s2] «Я бы не назвал это „скромным подарком“...»"
80000131-32 = "Ну, даже подарок — всего лишь предлог."
80000131-33 = "Я многим вам обязана, но возможностей отплатить почти не было."
80000131-34 = "Не скромничайте. Считайте это и знаком благодарности, и небольшим валентиновским подарком."
80000131-35 = "А, но не волнуйтесь, внутри коробки действительно шоколад."
80000131-36 = "...Или хотите открыть прямо сейчас?"
80000131-37 = "Да, вообще-то хорошая идея. Ну-ну. Открывайте. Прямо передо мной."
80000131-38 = ""
80000131-40 = ""
80000131-42 = "...Ну как?"
80000131-43 = "Это действительно шоколад, правда?"
80000131-44 = "...Неужели вы разочарованы?"
80000131-45 = ""
80000131-47 = ""
80000131-48 = "[ns3] «Я никогда не разочаруюсь в подарке студенты.»\n[ns4] «И всё же я думал, что это будет розыгрыш.»"
80000131-51 = "Ня-ха! Какая великодушная душа!"
80000131-52 = "Тогда, раз случай особый, может, расскажете, как вам вкус?"
80000131-53 = "Да, прямо здесь и сейчас."
80000131-54 = "Ну-ну. Вы ведь не откажете в маленькой просьбе своего очаровательного студента?"
80000131-55 = "[s5] «Хорошо.»\n[s6] Положить шоколад в рот."
80000131-58 = ""
80000131-60 = ""
80000131-61 = "...Как я и думала. Ни секунды сомнений."
80000131-62 = "Между прочим, этот шоколад домашний."
80000131-63 = "Домашний шоколад от вашего очаровательного студента."
80000131-64 = "Ну как, вам по вкусу?"
80000131-65 = ""
80000131-67 = ""
80000131-68 = "...Ня-ха-ха. По лицу видно, что совсем нет."
80000131-69 = "Конечно нет. Наверняка очень горько... ведь это тёмный шоколад с полынью. Улыбнитесь. Это полезно!"
80000131-70 = "[s7] «Зачем ты это сделала?»\n[s8] «Объяснись.»"
80000131-73 = "Да, конечно."
80000131-74 = "Потому что вы слишком хороший человек, Сенсей."
80000131-75 = ""
80000131-78 = "Этого мало... Вы не выглядите убеждённым."
80000131-79 = "Объяснить подробнее?"
80000131-80 = "Сенсей, вы когда-нибудь думали, как выглядите в глазах других?"
80000131-81 = "Вы получили шоколад от других студентов? Не от меня?"
80000131-82 = "Что вполне ожидаемо. Вы ведь такой хороший человек."
80000131-83 = ""
80000131-85 = ""
80000131-86 = ""
80000131-87 = "Добрый ко всем, лёгкий в общении, решающий любую проблему..."
80000131-88 = "Совсем как эта коробка шоколада."
80000131-89 = "Но действительно ли вы такой? Способны ли вы ответить взаимностью на каждую доброту каждого студента?"
80000131-90 = "...Ня-ха! Наверное, трудно. Даже Сенсей из Шале остаётся всего одним человеком."
80000131-91 = "Младшие студенты об этом забывают. Судят по внешности и начинают... ожидать."
80000131-92 = "А потом открывают коробку и пробуют единственную маленькую шоколадку."
80000131-93 = "Сколько студентов почувствуют эту горечь и кое-что поймут?"
80000131-94 = "...Я не хочу сказать, что во всём виноваты вы, Сенсей."
80000131-95 = "Вы просто хороший человек. В отличие от меня, вы не привыкли строить планы... и искать выгоду."
80000131-96 = "Но я именно такой студент."
80000131-97 = "И я ненавижу горький вкус, ня-ха-ха!"
80000131-98 = ""
80000131-100 = ""
80000131-101 = ""
80000131-102 = ""
80000131-103 = "И всё же хочу сказать одну вещь."
80000131-104 = "Пожалуйста, не забывайте вкус этого шоколада."
80000131-105 = ""
80000131-108 = "[ns] «...Хорошо, я понял.»"
80000131-110 = "[ns9] «В клубе Инь-Ян есть кухня?»\n[ns10] «Я ненадолго её одолжу.»"
80000131-113 = "...Ч-Что?! Зачем? Зачем она вам?"
80000131-114 = "[s11] «Какими бы ни были твои намерения...»\n[s12] «Я не потерплю игр с едой.»"
80000131-117 = ""
80000131-120 = "[ns] «Я заставлю ТЕБЯ съесть горький шоколад!»"
80000131-121 = "...Ч-Что-о-о...?!"
80000131-123 = "Я нашёл на кухне остатки полыни и приготовил для Нии «особый» шоколад."
80000131-124 = "...Я ошибся в пропорциях и сделал слишком много. В итоге мы поделили всё между собой."
80000131-125 = "Шоколад был ужасно горьким..."
