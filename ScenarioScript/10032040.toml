[translation]
10032040-1 = "Эпизод 4;Не ожидала настолько многого"
10032040-15 = ""
10032040-16 = ""
10032040-17 = ""
10032040-20 = ""
10032040-21 = "С дороги! Если посмеете встать у нас на пути, мы за ваши травмы не отвечаем!"
10032040-22 = "Этот Оперный театр весьма величественен. Превосходно."
10032040-23 = "Где моё место? Я не могу опоздать, ведь я человек утончённый."
10032040-24 = "Вы точно уверены, босс?"
10032040-25 = "Даже сейчас нам поступают сведения об оперативниках, которые охотятся за вами."
10032040-26 = "Вы правда собираетесь остаться и смотреть представление? Тут уже всё кишит врагами."
10032040-27 = "...Хватит."
10032040-28 = "..."
10032040-29 = "Дон не может показывать слабость. Только тогда наши враги действительно победят."
10032040-30 = "Я не прячусь. Я не бегу. Если я хочу посмотреть оперу, значит, я её посмотрю."
10032040-31 = "К тому же у меня есть запасной план на случай, если что-то пойдёт не так."
10032040-32 = "...Запасной план, босс? А это что?"
10032040-33 = "Хо-хо. Я бы рассказал, но тогда мне пришлось бы тебя убить."
10032040-34 = "А теперь сколько ещё вы будете заставлять меня стоять здесь, словно какого-то простолюдина?"
10032040-35 = "П-Простите, босс! Сюда!"
10032040-36 = ""
10032040-38 = ""
10032040-43 = ""
10032040-44 = "Разве с такой огромной свитой они не слишком выделяются?"
10032040-45 = "Человеку с таким титулом, как у него, невозможно скрыться. Они предпочли запугивание скрытности."
10032040-46 = "Я уважаю их решение, но нам оно заметно усложняет работу. Придётся обходить довольно серьёзную охрану."
10032040-47 = "Начинаю понимать, почему та мелкая сошка хотела просто взорвать всё здание и покончить с этим."
10032040-48 = "Я-я могу сделать это прямо сейчас! Разнесу этих бандитских отбросов на кусочки!"
10032040-49 = "[s1] «Д-Давай выдохнем и ещё раз всё обдумаем, Харука!»\n[s2] «Так ты сведёшь на нет всю работу, которую Ару проделала до сих пор!»"
10032040-50 = ""
10032040-51 = ""
10032040-53 = ""
10032040-55 = "Можно не торопиться и дождаться подходящего момента. Не то чтобы мы не ожидали чего-то подобного."
10032040-56 = "Меня больше беспокоит упомянутый ими запасной план... и нынешняя атмосфера здесь..."
10032040-57 = "Ну, мы знали, что в их системе безопасности остаются неизвестные, но—"
10032040-58 = ""
10032040-60 = ""
10032040-61 = "Погоди. Что ты сказала?"
10032040-62 = "Нынешняя атмосфера? А что с ней не так? У меня отличное настроение!"
10032040-63 = "...Босс. Просто оглянись."
10032040-64 = ""
10032040-66 = ""
10032040-67 = ""
10032040-68 = ""
10032040-70 = "О? Напряжение здесь хоть ножом режь."
10032040-71 = "А чего ты ожидала? Такова аура, которую источает босс банды."
10032040-72 = "Я не об этом."
10032040-73 = "Посмотри на всех, кроме Аранчино, на обычных посетителей. Они следят за Доном, за всем, что происходит вокруг него, оценивают ситуацию."
10032040-74 = "Я хочу сказать..."
10032040-75 = "[s3] «Это ещё конкуренты?»\n[s4] «Разве вы не избавились от всех них?»"
10032040-78 = "...? А?"
10032040-79 = "...Ч-Что?"
10032040-80 = "Т-Такого ведь не может быть?"
10032040-81 = "Я-я имею в виду, мы всё сделали точно по плану! Устранили всех, кто не был зарегистрированным гостем или артистом... Все оставшиеся должны быть в списке..."
10032040-82 = "Ты... хочешь сказать, что все эти люди с подозрительным прищуром, которые притворяются занятыми... охотятся за нашей целью?"
10032040-83 = "Если ты... именно это хочешь сказать..."
10032040-84 = ""
10032040-86 = ""
10032040-87 = "Разве это не... Ну, разве это не... вообще все здесь?"
10032040-88 = ""
10032040-90 = ""
10032040-92 = ""
10032040-93 = ""
10032040-94 = "...Ну..."
10032040-95 = "Ага..."
10032040-96 = "На этом этапе отрицать уже бессмысленно."
10032040-97 = ""
10032040-99 = ""
10032040-100 = "...Что..."
10032040-101 = "ЧТО ТЫ СКАЗАЛА?!"
10032040-102 = "Ха-ха-ха! Потрясающе!"
10032040-103 = "Ару, Ару! Только послушай! Ты ведь хотела защитить всех этих случайных людей, да? Поэтому охотилась на каждого, кто выглядел хоть немного подозрительно! А в итоге подозрительны вообще все!"
10032040-104 = "Это самое смешное, что я когда-либо слышала! Я сейчас живот надорву! Ха-ха-ха!"
10032040-105 = "Э-Эй! Хватит смеяться! Тут вообще ничего смешного!"
10032040-106 = "Ты просишь меня не смеяться? Да как тут не смеяться? Кто мог такое предугадать?"
10032040-107 = "Спорю, даже Сенсей не смог бы предусмотреть подобное. Да, Сенсей?"
10032040-108 = "[s5] «Для этого мне понадобился бы уровень фантазии, которого у меня нет.»\n[s6] «Пожалуй, „смешно“ — тоже подходящее слово!»"
10032040-111 = "Я отказываюсь верить, что это происходит! Мне вообще не так всё описывали! Разве личности не проверяли? Я думала, вход только по приглашениям!"
10032040-112 = ""
10032040-114 = ""
10032040-116 = "Попасть в список не так уж сложно, если знаешь нужных людей. Не стоило настолько слепо ему доверять."
10032040-117 = "Нам ведь тоже пришлось тайком вписать себя в список! Помнишь, Ару?"
10032040-118 = "Как вы вообще можете быть такими спокойными?!"
10032040-119 = "Ух... У меня уже живот от этого болит."
10032040-120 = "Нужно просто успокоиться. Давайте ещё раз посмотрим на факты... Думай, Ару. Думай!"
10032040-121 = "Никто не станет действовать в открытую. Пока все ждут, кто сделает первый ход."
10032040-122 = "И охрана ведь здесь не просто так, верно? Точно! Они же не начнут просто палить во все стороны."
10032040-123 = "Учитывая это, что нам делать? Может, ударить первыми? Подождать, пока начнёт кто-то другой, и ответить? У нас вообще есть время? Может, кто-нибудь—"
10032040-124 = "А-А-А! Тебе конец, Дон Аранчино!"
10032040-125 = ""
10032040-127 = ""
10032040-128 = "[ns7] «Первый номер программы!»\n[ns8] «Ару, тут уже всё горит.»"
10032040-131 = "Почему?! КАК?!"
10032040-132 = "Какой вообще смысл в охране? Они здесь просто для декорации?!"
10032040-133 = ""
10032040-135 = ""
10032040-137 = ""
10032040-138 = "Несколько охранников против всего Оперного театра... Как думаете, кто победит?"
10032040-139 = "Будем драться, босс? Или переждём?"
10032040-140 = ""
10032040-142 = ""
10032040-144 = "Нам стоит, эм, ладно... Ладно. Просто успокойся... Мне нужно оценить ситуацию, а потом мы сможем—"
10032040-145 = "Ты мне мешаешь, грязная шваль!"
10032040-146 = "...Шваль?"
10032040-147 = "...Я?"
10032040-148 = "Ах."
10032040-149 = "Босс, если ты так отреагируешь—"
10032040-151 = "ШВАЛЬ?! Ты смеешь так разговаривать с Ару?!?!"
10032040-152 = "Я разорву тебя на куски! Ты больше никогда не заговоришь! Это работа Ару! Цель Ару! Проваливай!!"
10032040-153 = ""
10032040-155 = ""
10032040-168 = ""
10032040-178 = "*вздыхает*"
10032040-179 = "Ха-ха-ха-ха!! Это наша Харука! С ней никогда не соскучишься!"
10032040-180 = ""
10032040-181 = ""
10032040-182 = "..."
10032040-183 = "Э... Эм... Э-э-эм...!"
10032040-184 = "[s9] «...Ару? Ты там вообще есть?»\n[s10] «Какой план, босс?»"
10032040-187 = "А-а-а!"
10032040-188 = "План? Учитывая... ситуацию, мы сделаем то, что делаем всегда! Доведём дело до конца!"
10032040-189 = "Решалы 68, за ними! Мы валим босса банды!"
