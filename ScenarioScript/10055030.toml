[translation]
10055030-1 = "Episode 3;The Reason I'm Here, and the Ship Must Depart"
10055030-3 = "[log]Day 6 of Drifting[/log]"
10055030-6 = "Don't make me repeat myself."
10055030-7 = "No countermeasures are needed. A Gehenna rescue team will arrive shortly."
10055030-8 = "When are you going to face reality?"
10055030-9 = "It's been nearly a week, and we haven't seen a single ship, let alone a rescue vessel."
10055030-10 = "Actually, I have a theory about that."
10055030-11 = "This is undoubtedly the work of the Prefect Team!"
10055030-12 = "Hina Sorasaki, the Prefect Prefect, is always well-prepared. She likely knows the fact that we're stranded, and perhaps even our current location."
10055030-13 = "And she's likely interfering with search efforts so that no one can reach us."
10055030-14 = "Oppression and control... those are their specialties, after all."
10055030-15 = "However, that won't last long. #nThe more Gehenna is oppressed, the stronger the backlash. Aren't the other students starting to catch on by now?"
10055030-16 = "Who is the leader Gehenna truly needs? #nA despicable tyrant like Hina Sorasaki? Or perhaps Lord Makoto Hanuma?"
10055030-17 = "The masses will crush the Prefect Team with unstoppable momentum and set out to rescue us! Kishishi!"
10055030-21 = "...Makoto-senpai, are you aware of how much supplies are left on this ship?"
10055030-22 = "How would I know?"
10055030-23 = "Then you don't know how many days we have left, do you?"
10055030-24 = "Indeed. I have no interest in such things to begin with."
10055030-25 = "Managing such trivial matters is your job, isn't it? Iroha."
10055030-29 = "Ah... um, Makoto-senpai... #nThat was a bit..."
10055030-30 = "Trivial...?"
10055030-32 = "Au... Iroha-chan..."
10055030-36 = "...Ah! Sensei."
10055030-37 = "I don't know if I should say 'good timing' or the opposite..."
10055030-38 = "[s1] \"What's wrong?\"\n[s2] \"It sounds noisy over here...\""
10055030-41 = "Well, how should I put this..."
10055030-42 = "If you feel that way, why don't you do it yourself, Makoto-senpai?"
10055030-43 = "A foolish question. I have much more important work to do."
10055030-44 = "Important...? What kind of important work?"
10055030-45 = "Aah...!"
10055030-46 = "[s3] \"What happened?\"\n[s4] \"Did you two have a fight?\""
10055030-49 = "No, the two of them... well, to be precise, Iroha-chan..."
10055030-50 = "You know how it is, Sensei... Iroha-chan really values her privacy and personal space."
10055030-51 = "But we've been stuck together in this small ship for days now..."
10055030-52 = "It seems she's built up quite a bit of stress..."
10055030-53 = "Usually, she'd avoid fighting because it's too much of a hassle, but..."
10055030-58 = "..."
10055030-59 = "What is it? If you have something to say, just say it."
10055030-60 = "Never mind."
10055030-61 = "I wasn't expecting anything to begin with. #nIf you don't have expectations, you won't be disappointed."
10055030-62 = "Hmm... are you implying there's a problem with my actions, Lord Makoto?"
10055030-63 = "Yes. There always is, and there is right now."
10055030-67 = "I'm not the only one on this ship. #nSensei and Ibuki are here too."
10055030-68 = "What do you intend to do if something goes wrong?"
10055030-69 = "A foolish question. With me here, nothing will go wrong."
10055030-70 = "That's exactly what I'm saying is happening right now!"
10055030-74 = "I'm sorry, I raised my voice."
10055030-75 = "...I'm going to go check on Ibuki."
10055030-80 = "That's rare, Iroha yelling at Makoto-chan."
10055030-81 = "Ah, Satsuki-senpai..."
10055030-82 = "So, what are you going to do, Makoto-chan?"
10055030-83 = "You won't be able to ask Iroha for anything for a while, you know?"
10055030-84 = "...Hmph, nothing to worry about."
10055030-85 = "If I leave her alone, she'll come back crying and apologizing."
10055030-86 = "We can just do it ourselves until then."
10055030-87 = "The things Iroha was doing? I wonder if you can."
10055030-88 = "Iroha was doing it all by herself until now. There's no way I can't."
10055030-89 = "In the hands of Lord Makoto, it'll be done in an instant."
10055030-90 = "Is that so? Well, if Makoto-chan says so..."
10055030-95 = "...Iroha-chan."
10055030-98 = "[log]Day 7 of Drifting[/log]"
10055030-104 = "Wa... waaaater...!"
10055030-109 = "[ns5] \"MAKOTO!! Stay strong! Makotooo!!\"\n[ns6] \"H-how did it come to this...!!!\""
10055030-113 = "To think the situation would deteriorate this much in just one night..."
10055030-114 = "Chiaki, how did the negotiation with Iroha go?"
10055030-115 = "Ah, about that..."
10055030-120 = "I see, so you sent Chiaki to persuade me."
10055030-121 = "I'm sorry, but I absolutely won't do it."
10055030-122 = "Not unless Makoto-senpai apologizes first. Absolutely not."
10055030-124 = "Ehh!? There's no way Makoto-chan is going to apologize!"
10055030-125 = "Ahaha... I guess Satsuki-senpai thinks so too, huh?"
10055030-126 = "I wonder what on earth Iroha is thinking..."
10055030-130 = "Um, how about Satsuki-senpai tries to persuade her?"
10055030-131 = "Me? Should I try hypnotizing Iroha? #nWell, I don't mind, but..."
10055030-132 = "N-no, that's not it! Not her, I mean Makoto-senpai!"
10055030-133 = "I don't know the details, but I heard you two have known each other for a long time. #nSo, um... can't you do something...?"
10055030-134 = "Well, let's see..."
10055030-135 = "But even if I succeed in making Makoto-chan apologize... do you think everything will be resolved neatly?"
10055030-136 = "There's no way Makoto-chan would actually be remorseful, and I wonder if Iroha would be satisfied with a superficial apology?"
10055030-137 = "That is..."
10055030-138 = "...You're right. I'm sorry, please just forget I said anything."
10055030-139 = "If it were easy to solve, I'd lend a hand too."
10055030-140 = "But for now, we should do what we can. #nWe have to manage until Makoto-chan and Iroha calm down."
10055030-141 = "...First, let's see, could you bring Makoto-chan here? #nAnd bring Sensei, who looks free, while you're at it."
10055030-142 = "Ahaha, I don't think they're just playing around, though."
10055030-144 = "Ugh... why must I, the Chairman of Pandemonium, be catching fish...!"
10055030-148 = "Whoa!?"
10055030-149 = "Ah, the fish got away, Satsuki-senpai!"
10055030-150 = "Kyaa!? W-what should I do, Makoto-chan!? It's gross!!"
10055030-151 = "Help me, Sensei!? No, please, Sensei! Help me!"
10055030-159 = "..."
10055030-160 = "...Iroha-senpai?"
10055030-161 = "Ah, sorry. I was just thinking about something..."
10055030-162 = "...It's boring being inside all the time, isn't it?"
10055030-163 = "No. I'm having fun because I'm with Iroha-senpai, Ibuki."
10055030-164 = "That's good to hear."
10055030-165 = "But Iroha-senpai doesn't look like she's having much fun."
10055030-166 = "Me?"
10055030-167 = "...That shouldn't be."
10055030-169 = "There's no annoying senpai, and no busywork. #nEven though I'm here with Ibuki..."
10055030-170 = "There's no way I'm not having fun."
10055030-176 = "............"
10055030-182 = "............"
10055030-183 = "Thank you for the meal."
10055030-188 = "..."
10055030-189 = "Iroha-chan, is she going to quit Pandemonium like this?"
10055030-190 = "...She can do whatever she wants."
10055030-191 = "Why don't you just order her? #nTo not leave."
10055030-192 = "Iroha doesn't like change, so I think that would be enough."
10055030-193 = "No—that's the one thing I can't do."
10055030-194 = "Whoever respects me, Lord Makoto, should follow of their own free will. #nThat is something I cannot compromise on."
10055030-195 = "If I use my authority as a shield to strip away free will, wouldn't I be no different from the Gehenna of the past?"
10055030-196 = "...That's true, too."
10055030-197 = "Fine, do as you like, Makoto-chan. #nJust tell me if you need my hypnosis."
10055030-198 = "If I make them truly believe they 'follow' me, it's no different from free will."
10055030-199 = "No, that's not necessary. Those who want to leave can leave. #nI have nothing to say to her."
10055030-200 = "...Tch, that Iroha."
10055030-201 = "How long does she intend to sulk..."
10055030-204 = "...Sigh."
10055030-205 = "What on earth am I trying to do?"
10055030-206 = "[ns7] \"Iroha.\"\n[ns8] \"I've been looking for you.\""
10055030-209 = "...Sensei."
10055030-210 = "Saying random things again. #nThere's nowhere to look around on a ship this small."
10055030-214 = "I know what you want to say."
10055030-215 = "[s9] \"Did you read my mind...!?\"\n[s10] \"Empty mind, no thoughts...!\""
10055030-218 = "Ahaha, what is that?"
10055030-219 = "..."
10055030-220 = "Do you think I should apologize, Sensei?"
10055030-221 = "The other party is that Makoto-senpai, after all..."
10055030-222 = "There's no way that person would apologize first... besides."
10055030-223 = "..."
10055030-224 = "I think things would finally start moving if I apologized."
10055030-225 = "...But."
10055030-229 = "Haaah............"
10055030-230 = "Compared to usual, it wasn't even something worth getting angry over..."
10055030-231 = "Why am I even in Pandemonium?"
10055030-235 = "...Hm?"
10055030-236 = "The 'reason I joined Pandemonium'?"
10055030-237 = "Well."
10055030-238 = "I can't really remember."
10055030-239 = "It probably wasn't a big reason. #nI thought I could have an easy life if I joined the student council."
10055030-240 = "Maybe I thought my reputation would improve, something like that."
10055030-241 = "...Do I look like an unlikable student even to you, Sensei?"
10055030-242 = "[s11] \"Not really. I think everyone lives while calculating things.\"\n[s12] \"It's just that people who don't are amazing.\""
10055030-245 = "You always have a silver tongue."
10055030-246 = "...I'm sorry. I didn't intend to say such things to you, Sensei."
10055030-247 = "But once I actually joined Pandemonium... Makoto-senpai is noisy about this and that, and problems keep happening one after another."
10055030-248 = "Sometimes I wonder why I joined. I can't deal with it."
10055030-249 = "Haaah............"
10055030-250 = "I just want to disappear like this."
10055030-251 = "Want to go on a journey?"
10055030-255 = "Eh, what did you just...?"
10055030-256 = "Didn't you hear something? #nSomeone's voice..."
10055030-261 = "Wh-what is it!?"
10055030-262 = "Are you okay, Sensei!?"
10055030-263 = "[s13] \"Are you okay, Iroha?\"\n[s14] \"What happened?\""
10055030-266 = "The ship hit something."
10055030-267 = "But there wasn't a single ship in sight until just now..."
10055030-268 = "Maybe we hit a reef..."
10055030-272 = "Impossible..."
10055030-273 = "...A ghost ship?"