[translation]
10055030-1 = "Эпизод 3;Зачем я здесь и почему корабль должен плыть"
10055030-3 = "[log]Шестой день в открытом море[/log]"
10055030-6 = "Не заставляй меня повторять."
10055030-7 = "Никакой план нам не нужен. Спасатели из Геенны скоро прибудут."
10055030-8 = "Пора взглянуть правде в глаза, Макото."
10055030-9 = "Мы торчим здесь почти НЕДЕЛЮ. Ты хоть один спасательный корабль видела? Хоть одну проходящую лодку? Хотя бы буй?"
10055030-10 = "На этот счёт у меня есть теория."
10055030-11 = "Несомненно, это всё происки Префектов!"
10055030-12 = "В частности, Сорасаки Хина очень расчётлива. Наверняка она уже выяснила наше точное местоположение и специально оставляет нас здесь."
10055030-13 = "Спасатели ещё не пришли исключительно по ЕЁ вине."
10055030-14 = "Префекты занимаются тем, что умеют лучше всего: подавлять и контролировать."
10055030-15 = "Но Геенна такова, что чем сильнее её пытаются растоптать, тем яростнее она сопротивляется. Возможно, потребовалось время, но студенты наверняка уже всё поняли."
10055030-16 = "Они осознали, кто на самом деле должен править Геенной! Не жестокий диктатор по имени Сорасаки Хина, а единственная и неповторимая великая Макото!!"
10055030-17 = "Как только они свергнут Префектов, сразу отправятся нас спасать! Кихехехе!"
10055030-18 = ""
10055030-20 = ""
10055030-21 = "...Макото, ты хоть знаешь, сколько еды осталось на лодке?"
10055030-22 = "Нет."
10055030-23 = "Значит, и понятия не имеешь, через сколько она закончится?"
10055030-24 = "Нет. Да мне, откровенно говоря, всё равно."
10055030-25 = "Следить за такими пустяками — ТВОЯ работа, разве нет? Так займись ею, Ироха."
10055030-26 = ""
10055030-28 = ""
10055030-29 = "М-Макото! Лучше бы тебе не говорить так..."
10055030-30 = "«Пустяками»...?"
10055030-31 = ""
10055030-32 = "А, ох... Эм... Ироха...!"
10055030-33 = ""
10055030-35 = ""
10055030-36 = "...А, Сенсей!"
10055030-37 = "Очень вовремя! Или очень не вовремя, смотря как посмотреть!"
10055030-38 = "[s1] «Что происходит?»\n[s2] «Я почувствовал приближение опасности...»"
10055030-41 = "Хм, ну с чего бы начать...?"
10055030-42 = "Раз всё, что я делаю, такие пустяки, САМА ими займись, Макото!"
10055030-43 = "Что за глупости. У меня есть дела куда важнее."
10055030-44 = "ВАЖНЕЕ?! Что на этой лодке может быть НАСТОЛЬКО важным?!"
10055030-45 = "Ик!"
10055030-46 = "[s3] «Что случилось?»\n[s4] «Они ссорятся?»"
10055030-49 = "Ну, эти двое... Нет, точнее, Ироха..."
10055030-50 = "Как вы знаете, Сенсей, Ироха очень ценит личное пространство и уединение."
10055030-51 = "Поэтому постоянная теснота на этой лодке и общество остальных начинают её изматывать..."
10055030-52 = "Мелкие трещины будто понемногу накапливались одна за другой..."
10055030-53 = "Обычно Ироха из принципа избегает споров, ведь это слишком утомительно."
10055030-54 = ""
10055030-56 = ""
10055030-57 = ""
10055030-58 = "..."
10055030-59 = "Что такое? Если хочешь что-то сказать, говори."
10055030-60 = "Забудь."
10055030-61 = "Я давно поняла, что от тебя лучше ничего не ждать. Тогда и разочаровываться больше не придётся."
10055030-62 = "Хочешь сказать, что я, великая Макото, что-то делаю неправильно?"
10055030-63 = "Да. А когда ты вообще хоть что-нибудь делала правильно?"
10055030-64 = ""
10055030-66 = ""
10055030-67 = "На этот раз ты подвергаешь опасности не только нас. А как же Ибуки и Сенсей?"
10055030-68 = "Собираешься отвечать за последствия, если что-то случится?"
10055030-69 = "Сам вопрос глуп, ведь всё, что я делаю, всегда заканчивается успехом."
10055030-70 = "СЕЙЧАС ВСЁ ИДЁТ НАПЕРЕКОСЯК, МАКОТО!"
10055030-71 = ""
10055030-73 = ""
10055030-74 = "Не стоило повышать голос. Простите."
10055030-75 = "Я... пойду посмотрю, не нужно ли чего Ибуки."
10055030-76 = ""
10055030-78 = ""
10055030-79 = ""
10055030-80 = "Боже мой. Неужели я только что слышала, как Ироха кричала? На Макото?"
10055030-81 = "А, Сацуки..."
10055030-82 = "Ну что ж. И что теперь, Макото?"
10055030-83 = "Как ты собираешься просить Ироху что-то для тебя сделать?"
10055030-84 = "Ничего страшного."
10055030-85 = "Скоро она поймёт, как ошибалась, и приползёт просить прощения."
10055030-86 = "А пока мы сами возьмём на себя её обязанности."
10055030-87 = "ВСЕ её обязанности? Ты точно уверена?"
10055030-88 = "Если она с ними справлялась, почему я не справлюсь?"
10055030-89 = "И потом, я же великая Макото! У меня всё получится вдвое быстрее!"
10055030-90 = "Ну, раз ты так говоришь, Макото..."
10055030-91 = ""
10055030-93 = ""
10055030-94 = ""
10055030-95 = "Ироха..."
10055030-98 = "[log]Седьмой день в открытом море[/log]"
10055030-101 = ""
10055030-102 = ""
10055030-103 = ""
10055030-104 = "Воды... Во-о-оды...!"
10055030-105 = ""
10055030-107 = ""
10055030-109 = "[ns5] «Макото! Держись, Макото!»\n[ns6] «Как с нами могло случиться такое несчастье...?!»"
10055030-112 = ""
10055030-113 = "Не думала, что всё пойдёт под откос НАСТОЛЬКО быстро..."
10055030-114 = "Чиаки! Ты успела поговорить с Ирохой?"
10055030-115 = "Э-э-э, ну, технически да!"
10055030-117 = ""
10055030-118 = ""
10055030-119 = ""
10055030-120 = "Понятно... Значит, вас прислали поговорить со мной?"
10055030-121 = "Простите, но нет. В этот раз я умываю руки."
10055030-122 = "По крайней мере, пока Макото не извинится."
10055030-123 = ""
10055030-124 = "Извинится?! Макото?!"
10055030-125 = "А-ха... У меня была такая же реакция..."
10055030-126 = "На что она вообще надеется...?"
10055030-127 = ""
10055030-129 = ""
10055030-130 = "Может, ты попробуешь поговорить с ней?"
10055030-131 = "Понимаю. Если пожелаете, я загипнотизирую Ироху и заставлю её сотрудничать..."
10055030-132 = "Нет, нет, нет!! Я имела в виду поговорить с МАКОТО, а не с Ирохой!"
10055030-133 = "Это всего лишь моя догадка, но вы ведь довольно близки? Если кто-то и сможет до неё достучаться..."
10055030-134 = "Знаешь..."
10055030-135 = "Даже если я каким-то образом её уговорю или даже загипнотизирую..."
10055030-136 = "...Это что-нибудь решит? Неужели Ирохе нужны только произнесённые вслух извинения?"
10055030-137 = "Это..."
10055030-138 = "Прости, ты права. Не стоило тебя просить..."
10055030-139 = "У тебя были добрые намерения. Я чувствую то же самое."
10055030-140 = "Но боюсь, у этого конфликта нет простого решения. Пока эти двое не уладят разногласия, нам придётся делать всё, что в наших силах."
10055030-141 = "С чего-то нужно начать. Не могла бы ты позвать Макото? И Сенсея, они сейчас вместе..."
10055030-142 = "А-ха-ха... Справедливости ради, не думаю, что Сенсей просто с ней отдыхает..."
10055030-144 = "Ух! Я председатель Общества Пандемониум! Личность моего уровня не должна возиться с рыбой!"
10055030-145 = ""
10055030-148 = "А-А-А!"
10055030-149 = "Ай! Упустила! Сацуки, рыбу!"
10055030-150 = "М-мне?! И-и! Какая гадость! Макото, сделай что-нибудь!"
10055030-151 = "Помогите, Сенсей! Пожалуйста, помогите нам, Сенсей!"
10055030-152 = ""
10055030-158 = ""
10055030-159 = "..."
10055030-160 = "...Эм, Ироха."
10055030-161 = "А, да, прости. Я задумалась."
10055030-162 = "...Тебе здесь не скучно?"
10055030-163 = "Совсем нет! Ибуки всегда весело, когда Ироха рядом!"
10055030-164 = "Рада слышать. Мне тоже."
10055030-165 = "Правда? А по тебе не скажешь!"
10055030-166 = "А? По мне?"
10055030-167 = "...Ничего подобного."
10055030-169 = "Никто из этих мучителей меня не дёргает, всю скучную работу я спихнула на других и теперь могу побыть с тобой."
10055030-170 = "Как тут не радоваться?"
10055030-175 = ""
10055030-176 = "..."
10055030-177 = ""
10055030-179 = ""
10055030-180 = ""
10055030-181 = ""
10055030-182 = "..."
10055030-183 = "Спасибо за еду."
10055030-184 = ""
10055030-186 = ""
10055030-187 = ""
10055030-188 = "..."
10055030-189 = "Как думаешь, Ироха и правда может после этого уйти из Общества Пандемониум?"
10055030-190 = "...Если она этого хочет, значит, так и поступит."
10055030-191 = "Почему бы просто не приказать ей остаться?"
10055030-192 = "Ироха не любит перемен, так что если дать ей повод..."
10055030-193 = "Нет. Я не могу."
10055030-194 = "Все, кто служит великой Макото, делают это по собственной воле. Я никогда не стану принуждать своих последователей."
10055030-195 = "Если люди подчиняются моей власти лишь из страха, чем мы лучше тех, кто правил до нас?"
10055030-196 = "...В этом есть смысл."
10055030-197 = "Понимаю. Поступай по-своему, Макото. Но если понадобятся мои услуги, только попроси."
10055030-198 = "Если я загипнотизирую её так, что она поверит, будто сама сделала выбор, разве формально это будет считаться принуждением?"
10055030-199 = "Нет! Кто хочет остаться — остаётся. Кто хочет уйти — уходит. Этот принцип для меня неизменен."
10055030-200 = "...Цк. Эта Ироха..."
10055030-201 = "Сколько она ещё собирается дуться из-за пустяка?"
10055030-203 = ""
10055030-204 = "*вздыхает*"
10055030-205 = "Чего же я вообще хочу...?"
10055030-206 = "[ns7] «Ироха».\n[ns8] «Я повсюду тебя искал»."
10055030-209 = "...Сенсей."
10055030-210 = "Не преувеличивайте. Сколько времени вообще можно искать кого-то на такой крошечной лодке?"
10055030-211 = ""
10055030-213 = ""
10055030-214 = "Я знаю, что вы хотите сказать."
10055030-215 = "[s9] «Ты умеешь читать мысли...?!»\n[s10] «Ни о чём не думать!»"
10055030-218 = "Ха-ха, да что с вами такое?"
10055030-219 = "..."
10055030-220 = "Так... Думаете, мне тоже стоит извиниться, Сенсей?"
10055030-221 = "То есть, мы же говорим о Макото..."
10055030-222 = "Ни за что она не извинится первой... И что ещё важнее..."
10055030-223 = "..."
10055030-224 = "В общем, если я не извинюсь, мы так и будем топтаться на месте."
10055030-225 = "Но..."
10055030-226 = ""
10055030-228 = ""
10055030-229 = "У-у-ух."
10055030-230 = "Она делала вещи и похуже. Не знаю, почему именно сейчас меня так задело."
10055030-231 = "Если честно, я даже не понимаю, зачем до сих пор состою в этом дурацком клубе."
10055030-232 = ""
10055030-234 = ""
10055030-235 = "...Хм?"
10055030-236 = "...Почему я вступила в Общество Пандемониум?"
10055030-237 = "Кто знает."
10055030-238 = "Уже и не помню."
10055030-239 = "Наверное, по какой-нибудь глупой причине. Например, думала, что в студсовете школьная жизнь будет легче..."
10055030-240 = "Может, хотела больше нравиться окружающим... Не знаю."
10055030-241 = "Когда произношу это вслух, сама себе кажусь эгоисткой."
10055030-242 = "[s11] «Заботиться о себе — естественно».\n[s12] «Скорее уж странно, когда человек о себе совсем не заботится»."
10055030-245 = "Как всегда, идеальный ответ из учебника."
10055030-246 = "...Простите. Не стоило и на вас срываться."
10055030-247 = "Но я вступила, и Макото стала постоянной занозой. Стоило решить одну проблему, как на её месте появлялось ещё пять."
10055030-248 = "В такие моменты я особенно остро задумываюсь, зачем вообще сюда вступила."
10055030-249 = "У-у-ух..."
10055030-250 = "Хочется просто куда-нибудь исчезнуть на время."
10055030-251 = "Хочешь сбежать?"
10055030-252 = ""
10055030-255 = "М? Что вы сейчас сказали?"
10055030-256 = "Вы ничего не говорили? Нет, я отчётливо слышала чей-то голос..."
10055030-258 = ""
10055030-261 = "Ч-что это было?!"
10055030-262 = "Сенсей! Вы в порядке?!"
10055030-263 = "[s13] «Ты в порядке, Ироха?»\n[s14] «Что только что произошло?»"
10055030-266 = "Мы во что-то врезались."
10055030-267 = "Но вокруг на многие километры было открытое море."
10055030-268 = "Может, плавучие обломки? ...Риф?"
10055030-271 = ""
10055030-272 = "Не может быть... Это же..."
10055030-273 = "Корабль... призрак...?!"
