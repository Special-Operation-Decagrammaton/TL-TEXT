[translation]
52115-1 = "Episódio 11;O Caminho para a Outra Margem"
52115-2 = "Distrito Autônomo do Norte - Planície Nevada"
52115-4 = "— É sério mesmo que você descobriu onde eles estão?"
52115-9 = "Sim. Eu não tinha explicado?"
52115-11 = "Não explicou."
52115-12 = "V-Você saiu correndo tão de repente que foi bem difícil acompanhá-la..."
52115-17 = "Desculpa, desculpa! É que dizem que os espíritos malignos e o Crepúsculo ficam mais fortes na escuridão..."
52115-18 = "Acabei me apressando para chegarmos antes do anoitecer."
52115-19 = "O esconderijo do Clube Beleza da Natureza fica tão perto assim?"
52115-20 = "A Shuro-san não disse nada sobre isso, mas..."
52115-21 = "Percebi enquanto olhava para aquele Tsukumogami Fantasma ali."
52115-26 = "Olhem o cabo. Tem uma marca gravada, não tem?"
52115-27 = "Antes, quando um Tsukumogami apareceu perto da cidade e causou alvoroço, eu gravei marcas diferentes em vários objetos velhos por aí e os coloquei nas entradas e saídas da cidade."
52115-28 = "Se os Tsukumogami nascem dos livros malditos do Clube Beleza da Natureza, basta checar a marca do objeto original para saber por onde eles passaram."
52115-30 = "Entendi, que sacada..."
52115-32 = "Não se deixar abater e ainda bolar uma estratégia tão engenhosa... Como esperado da Presidente da Hyakkaryouran!"
52115-33 = "Então estamos indo na direção onde você deixou esse guarda-chuva?"
52115-35 = "Isso mesmo. Este guarda-chuva com esse emblema eu deixei na saída norte da cidade."
52115-36 = "Como podem ver, ao norte há apenas uma planície nevada a perder de vista, sem nenhum esconderijo aparente, mas..."
52115-37 = "Segundo o pessoal da cidade, há uma casa antiga a cerca de meio dia de caminhada daqui."
52115-38 = "Além da planície nevada... Está falando da \"Mansão Higan\", não é?"
52115-43 = "...Cara, só o nome já dá um arrepio esquisito."
52115-44 = "Dizem que costumava ser a residência de uma família ilustre que governava toda esta região.#nFoi abandonada há décadas e hoje está em ruínas."
52115-45 = "Mas justamente por ser um lugar assim..."
52115-46 = "Pode ser perfeito como esconderijo."
52115-47 = "Talvez o Hyakumonogatari avistado por perto também esteja lá..."
52115-48 = "[s1] \"Será que tudo bem irmos sem preparo?\"\n[s2] \"E se houver alguma armadilha...?\""
52115-54 = "Relaxa! Não deixe para amanhã o que se pode fazer hoje, né?"
52115-55 = "Não aguento mais ver eles escaparem!"
52115-56 = "Além disso, Mestre, desta vez a Presidente Ayame, a mais forte de todas, também está com a gente!"
52115-57 = "Sim! Vamos gravar aqui mais uma página na invencível lenda da Hyakkaryouran!"
52115-58 = "Contudo, o Hyakumonogatari não deve ser um oponente simples..."
52115-62 = "Exato. Vocês duas não esqueceram, né? Armas comuns não surtem efeito contra o Hyakumonogatari."
52115-63 = "Os únicos capazes de derrotar um \"Conto Macabro\" nascido de um livro maldito são aqueles qualificados pela Grande Profetisa Kuzunoha-sama."
52115-64 = "Não me leve a mal, mas mesmo sendo a Presidente Ayame, sem a Hyakuren você não pode lutar contra ele."
52115-65 = "S-Será mesmo? A Ayame é muito mais capaz do que alguém como eu—"
52115-66 = "Aliás... sem nós, como exatamente a Presidente achou que conseguiria derrotar o Hyakumonogatari?"
52115-68 = "É, pois é..."
52115-69 = "Mesmo que eu não pudesse enfrentar o \"Conto Macabro\" de frente, pensei que daria um jeito na garota que controla o livro maldito."
52115-70 = "\"Dar um jeito\"...? A Presidente da Hyakkaryouran ia partir para a luta sem plano nenhum?"
52115-71 = "Mas sabe como dizem, né? \"Só arriscando tudo é que se encontra uma saída\"."
52115-72 = "Além disso... eu acreditava na Nagusa."
52115-77 = "...Em mim?"
52115-78 = "Quando vi você dominando a Hyakuren, eu percebi."
52115-79 = "Que essa é a verdadeira sucessora reconhecida pela Grande Profetisa Kuzunoha."
52115-80 = "Sem dúvida alguma, você parecia digna de ser a Presidente do Comitê de Mediação de Conflitos Hyakkaryouran."
52115-81 = "I-Isso não... Comparada a você, Ayame, eu não passo de..."
52115-82 = "Não se diminua assim, Nagusa."
52115-87 = "Não quero ver uma amiga minha falando assim de si mesma."
52115-92 = "Eu sei o quanto você tem se esforçado esse tempo todo, sabia? Já até me superou e conquistou o reconhecimento de todos... Isso é realmente incrível..."
52115-93 = "Eu sempre soube que um dia você ia desabrochar, Nagusa, então fico muito feliz."
52115-94 = "Infelizmente, eu não fui reconhecida por Kuzunoha-sama.#nMas você, Nagusa... você tem algo que eu não tenho."
52115-95 = "E além disso, eu prometi, não foi?#nQue ficaria sempre ao seu lado, Nagusa."
52115-96 = "Por isso... quero que você me empreste a sua força na minha última missão como Presidente."
52115-103 = "Sim. Obrigada, Ayame..."
52115-105 = "Aaah! Isso sim é juventude...!"
52115-106 = "...Beleza! A gente também não pode ficar para trás! Vamos aproveitar esse embalo e acabar com o Clube Beleza da Natureza!"
52115-107 = "Nos mangás de esporte que eu li, também havia reviravoltas empolgantes assim!"
52115-108 = "Agora compreendo perfeitamente por que o coração da Renge-senpai vibra tanto com a \"juventude\"!"
52115-110 = "Haha... De algum jeito, tudo acabou se ajeitando bem, né."
52115-111 = "...Bom, se a Nagusa-senpai está de acordo, não vou forçar para impedir."
52115-112 = "...E por que essa garota veio junto?"
52115-118 = "Não vim porque eu quis! Vocês que me arrastaram pra cá sem pedir!"
52115-119 = "É perigoso tirar os olhos de uma criança... nunca se sabe o que ela pode aprontar."
52115-120 = "Não queremos que ela aproveite nossa ausência para invocar o Hyakumonogatari de novo com um livro maldito."
52115-122 = "Ah, quanto a isso tudo bem, né? O livro maldito que a baixinha tinha, o \"Inou Mononokeroku\", foi destruído antes..."
52115-126 = "...Espera aí! Então por que apareceu um Tsukumogami ontem também?"
52115-130 = "...P-Por acaso existem vários livros malditos?!"
52115-132 = "...É bem possível. Se só existisse um, não confiariam a uma garota dessas, né?"
52115-133 = "Hã?! A Kokuriko-sama diz que eu sou uma boa menina!"
52115-137 = "Renge, Yukari. Segurem ela."
52115-147 = "O-O que vocês pensam que vão fazer?!"
52115-149 = "Revista. Seria um problemão se você estivesse escondendo outro livro maldito."
52115-150 = "Então eu fico com a parte das pernas."
52115-158 = "M-Me soltem! Seus desgraçados, acham mesmo que vão sair impunes depois de—"
52115-164 = "...Ihi?! Hihi... kyahaha! Kyahahaha! P-Para com isso...!"
52115-165 = "Não tem nada aqui... Então que tal por aqui...?"
52115-166 = "P-Paraaa...!!#nE-Eu juro, kyaha... não vou perdoar... ihihihi!"
52115-173 = "Kikyou-senpai! Tem um livro de bolso aqui!"
52115-174 = "Mandou bem, Yukari."
52115-179 = "E-Esse não! Esse não pode de jeito nenhum...!!!"
52115-180 = "Hoooh? Se está desesperada assim, deve ser algo bem importante."
52115-181 = "Nagusa-senpai, vamos ver logo o que é!"
52115-183 = "Tá, deixa eu ver..."
52115-193 = "[log]Título[/log]"
52115-194 = "[log]A Contadora de Histórias Mais Forte[/log]"
52115-198 = "[log]Autora[/log]"
52115-199 = "[log]Kuchiki Shura[/log]"
52115-203 = "[log]Nem chuvas de balas, nem bombas,[/log]"
52115-205 = "[log]têm poder diante de seu corpo de aço.[/log]"
52115-207 = "[log]Os rumores da Contadora de Histórias mais forte ecoam por toda Hyakkiyako.[/log]"
52115-211 = "[log]Com olhos frios como o gelo, ela[/log]"
52115-213 = "[log]se esgueira hoje também nas trevas da noite,[/log]"
52115-215 = "[log]perturbando a mente das pessoas.[/log]"
52115-219 = "[log]Quem ousar desafiá-la pagará o preço com o próprio sangue.[/log]"
52115-221 = "[log]Com um único movimento de seus dedos, seus monstros subordinados[/log]"
52115-223 = "[log]saltam sobre os tolos patéticos que ousaram enfurecer a Contadora de Histórias.[/log]"
52115-227 = "[log]Em especial, ela não tem piedade da insolente Hyakkaryouran.[/log]"
52115-229 = "[log]Elas saem correndo para casa aos prantos.[/log]"
52115-233 = "[log]Essa é aquela que todos[/log]"
52115-234 = "[log]temem: a Contadora de Histórias suprema.[/log]"
52115-238 = "Ah..."
52115-239 = "...Certo."
52115-240 = "Nossa..."
52115-241 = "[s] \"Err... Kuchiki Shura-san...?\""
52115-247 = "...Anda, Yukari, não pare de procurar."
52115-252 = "Vocês acabaram de fingir que não viram nada, né?!"
52115-253 = "Por acaso... isso é um romance que você mesma escreveu?"
52115-254 = "Tem um monte de palavras rebuscadas esquisitas nisso aqui, hein."
52115-255 = "U-Uuuugh...!"
52115-256 = "V-Vocês estão tirando sarro de mim! Mexeram nas minhas coisas sem permissão e ainda leram meu manuscrito precioso em voz alta?!"
52115-257 = "E se alguém plagiar esta obra-prima e ela fizer um sucesso estrondoso—"
52115-258 = "Vocês vão se responsabilizar por isso?!"
52115-259 = "[s] \"Peço desculpas...\""
52115-260 = "...Q-Quanto a isso, pode ficar tranquila!"
52115-261 = "Não tem muita gente por aí capaz de escrever sobre um tema desses... né?!"
52115-265 = "...Ora? Parece que você entende das coisas, né?#nIsso mesmo, por melhor que seja o tema, o que realmente importa é a habilidade na escrita—"
52115-269 = "E então, o que acharam de entrar em contato com o meu gênio literário?"
52115-270 = "Ficaram tão emocionadas que perderam até a fala, né?"
52115-271 = "Eu, Kuchiki Shura, autora de \"A Contadora de Histórias Mais Forte\"...#nAté eu me assusto com o meu próprio talento."
52115-276 = "Err... bem... eu..."
52115-277 = "...Vamos logo. Precisamos chegar à \"Mansão Higan\" antes do anoitecer."
52115-278 = "É-É verdade! Eu dou a minha opinião d-depois...!"
52115-280 = "No fim, ela não tinha nenhum outro livro maldito... Foi pura perda de tempo."
52115-281 = "B-Bom... pelo menos... ainda bem que era uma história que não sai atacando as pessoas por conta própria."
52115-282 = "[s] \"O importante é continuar lendo bastante e escrevendo bastante...!\""
52115-288 = "Uuu... uuuuugh..."
52115-289 = "NA~GU~SAAAAAAAA!!!"
52115-291 = "Próximo;A Sacerdotisa da Família Kadenokouji"
