[translation]
52115-1 = "Эпизод 11;Путь в потусторонний мир"
52115-2 = "Окраина школы-спутника Эбису, снежное поле"
52115-4 = "...Значит, их база здесь?"
52115-5 = ""
52115-8 = ""
52115-9 = "А, разве я вам не сказала?"
52115-11 = "Нет."
52115-12 = "Ты выбежала, не сказав ни слова, и нам оставалось только последовать за тобой."
52115-13 = ""
52115-16 = ""
52115-17 = "Простите-простите! Просто я хотела закончить до темноты..."
52115-18 = "После заката выходят духи предметов, вы же знаете."
52115-19 = "И ты уверена, что база «Красоты природы» поблизости?"
52115-20 = "Сюро ничего нам не сказала. Откуда ты знаешь, что она здесь?"
52115-21 = "Помните, утром я осматривала духа предмета?"
52115-22 = ""
52115-24 = ""
52115-25 = ""
52115-26 = "Видите зарубку на ручке этого зонта?"
52115-27 = "Я специально оставляла метки на старых вещах и раскладывала их у входа в деревню."
52115-28 = "Так я отслеживала перемещения духов предметов. И все они двигались в эту сторону."
52115-30 = "Понятно. Очень умно."
52115-32 = "Поистине вдохновляющий план, как и ожидалось от президента Хяккарёран!"
52115-33 = "То есть мы идём по следам сломанных зонтов?"
52115-35 = "Можно и так сказать. Этот зонт я оставила у северного входа в деревню."
52115-36 = "И хотя на картах здесь обозначено лишь пустынное снежное поле..."
52115-37 = "...жители сказали, что в нескольких часах отсюда стоит старый особняк."
52115-38 = "Особняк на северном снежном поле... Ты имеешь в виду Потусторонний особняк."
52115-39 = ""
52115-42 = ""
52115-43 = "...Потусторонний особняк? Звучит драматично."
52115-44 = "Да. Согласно записям, давным-давно там жила знатная семья."
52115-45 = "Лично я там никогда не была, поэтому не знаю, в каком он состоянии."
52115-46 = "Думаю, «Красота природы» могла бы там обосноваться."
52115-47 = "Возможно, там мы найдём источник духов предметов."
52115-48 = "[s1] «Вы правда считаете, что стоит вот так врываться?»\n[s2] «Там могут быть ловушки...»"
52115-49 = ""
52115-50 = ""
52115-53 = ""
52115-54 = "Куй железо, пока горячо, верно?"
52115-55 = "Если будем медлить, они опять сбегут. Пора действовать!"
52115-56 = "К тому же непобедимая Аямэ снова с нами!"
52115-57 = "Её мастерству поистине нет равных!"
52115-58 = "Но духи предметов неуязвимы для пуль?"
52115-59 = ""
52115-61 = ""
52115-62 = "Именно. Ни численное превосходство, ни боевой дух нам не помогут."
52115-63 = "Одолеть духов можно только Властью, дарованной Кузунохой..."
52115-64 = "Не хочу показаться резкой, но даже талантливая президент Аямэ мало чем поможет без Сотни Лотосов."
52115-65 = "Н-Неправда. Аямэ многое умеет..."
52115-66 = "Каков был твой план, Аямэ? Что бы ты делала, если бы мы за тобой не пошли? Как бы сражалась с «Красотой природы» в одиночку?"
52115-68 = "Ну..."
52115-69 = "С духами предметов я бы не справилась, но подумала, что смогу как-нибудь добраться до самих томов."
52115-70 = "Как-нибудь?.. Для тебя это звучит немного безрассудно, Аямэ."
52115-71 = "Ты права! Наверное, такая погода сделала меня смелее!"
52115-72 = "Но правда в том... я верила, что Нагуса пойдёт за мной. Она такая надёжная подруга."
52115-73 = ""
52115-76 = ""
52115-77 = "...Я?"
52115-78 = "Вчера вечером я видела, как искусно ты управлялась с Сотней Лотосов."
52115-79 = "Думаю, именно тебя имела в виду великая прорицательница Кузуноха, когда передавала Власть."
52115-80 = "Ты выглядела настоящим президентом Хяккарёран."
52115-81 = "Н-Неправда, Аямэ. По сравнению с тобой я даже..."
52115-82 = "Не принижай себя, Нагуса."
52115-83 = ""
52115-85 = ""
52115-87 = "Ты моя лучшая подруга."
52115-88 = ""
52115-90 = ""
52115-92 = "Ты столько трудилась, чтобы исполнить свою роль. Ты сильнее меня, и я тобой горжусь."
52115-93 = "Знаешь, Нагуса, я всегда думала, что однажды ты расцветёшь прекрасным цветком."
52115-94 = "Жаль, я так и не нашла Кузуноху... но, значит, она увидела в тебе то, чего нет во мне."
52115-95 = "Я ведь обещала всегда быть рядом с тобой?"
52115-96 = "Так побудь сейчас рядом со мной. Помоги мне выполнить задание."
52115-97 = ""
52115-99 = ""
52115-101 = ""
52115-102 = ""
52115-103 = "Конечно."
52115-105 = "Ах... Как это вдохновляет!"
52115-106 = "...Отлично! Давайте с этим пылом разгромим «Красоту природы»!"
52115-107 = "Ой, как весело! Прямо как в манге!"
52115-108 = "Видишь, Рэнгэ! Мы вместе НАСЛАЖДАЕМСЯ молодостью!"
52115-110 = "Ха-ха... Рада видеть, что вы так воодушевлены."
52115-111 = "Что ж, если Нагусу всё устраивает, я тоже пойду."
52115-112 = "...Но обязательно было брать с собой эту малявку?"
52115-113 = ""
52115-115 = ""
52115-117 = ""
52115-118 = "Я не по своей воле гуляю с вами, неудачницы! Вы сами потащили меня в этот дурацкий поход!"
52115-119 = "Не могли же мы оставить несовершеннолетнюю без присмотра. Кто знает, что бы она натворила?"
52115-120 = "К тому же деревне будет спокойнее, если она с нами. Не хотим, чтобы она применила к жителям свой том."
52115-122 = "Об этом можно не беспокоиться. В прошлый раз мы уничтожили её «Призрачные записи»."
52115-123 = ""
52115-125 = ""
52115-126 = "...Погодите. Тогда КАК она призвала духов предметов вчера вечером?"
52115-127 = ""
52115-129 = ""
52115-130 = "У «Красоты природы» может быть ещё один том?"
52115-132 = "...Возможно. Если бы у них был лишь один том, они бы не доверили его этой дурочке."
52115-133 = "Кого ты назвала дурочкой?! Госпожа Кокурико мне доверяла, и я прекрасно справилась..."
52115-134 = ""
52115-136 = ""
52115-137 = "Рэнгэ, Юкари. Держите её за руки."
52115-138 = ""
52115-140 = ""
52115-142 = ""
52115-145 = ""
52115-146 = ""
52115-147 = "Ч-Что вы делаете?!"
52115-149 = "Обыщем её. Вдруг она прячет маленький том?"
52115-150 = "Я возьму ноги."
52115-151 = ""
52115-153 = ""
52115-157 = ""
52115-158 = "Ч-Что вы делаете?! Если думаете, что это сработает, то сильно ошибаетесь..."
52115-159 = ""
52115-164 = "И-и-и?! Уф... Аха-ха! Аха-ха-ха! П-Прекратите!.."
52115-165 = "Здесь? Или тут?.."
52115-166 = "П-Прекратите... Кто-нибудь! Помогите! Эти странные девицы меня грабят!"
52115-167 = ""
52115-171 = ""
52115-172 = ""
52115-173 = "Кикё, я нашла тетрадь!"
52115-174 = "Отлично, Юкари."
52115-175 = ""
52115-178 = ""
52115-179 = "Н-Нет... Только не ЭТУ тетрадь! Пожалуйста!"
52115-180 = "О, это должно быть интересно! Она совсем запаниковала!"
52115-181 = "Нагуса, открой!"
52115-183 = "Хорошо. Посмотрим..."
52115-184 = ""
52115-186 = ""
52115-193 = "[log]Название[/log]"
52115-194 = "[log]Самый крутой бард на свете[/log]"
52115-198 = "[log]Автор[/log]"
52115-199 = "[log]Кузуки Сюро[/log]"
52115-203 = "[log]Град пуль и даже бомбы[/log]"
52115-205 = "[log]бессильны перед её мощью.[/log]"
52115-207 = "[log]Слухи о самом сильном и крутом барде разлетелись по Хяккияко.[/log]"
52115-211 = "[log]Её прекрасные глаза холодны, как лёд,[/log]"
52115-213 = "[log]она проникает в разум и выпускает наружу таящуюся в нём тьму.[/log]"
52115-215 = "[log]Все, кто встанет на её пути, заплатят КРОВЬЮ.[/log]"
52115-219 = "[log]Одним движением пальца, лёгким щелчком[/log]"
52115-221 = "[log]она создаёт полчища существ,[/log]"
52115-223 = "[log]что набрасываются на жалких глупцов, посмевших перейти ей дорогу.[/log]"
52115-227 = "[log]Особенно беспощадна она к ничтожным членам Хяккарёран.[/log]"
52115-229 = "[log]Те бегут домой в слезах и соплях.[/log]"
52115-233 = "[log]Ибо она — величайший бард,[/log]"
52115-234 = "[log]которого все боятся.[/log]"
52115-237 = ""
52115-238 = "Ах."
52115-239 = "Ах..."
52115-240 = "Ха..."
52115-241 = "[s] «...Хм.»"
52115-242 = ""
52115-244 = ""
52115-246 = ""
52115-247 = "Юкари, ищи дальше. Эта писанина не может представлять ценности."
52115-248 = ""
52115-251 = ""
52115-252 = "Да ладно вам! Это всё, что вы скажете?"
52115-253 = "Ты... написала этот роман?.."
52115-254 = "Это роман? Звучало как... А про себя можно писать фанфики?"
52115-255 = "Ух... У-у-ух!.."
52115-256 = "Как вы смеете! Рыться в чужих вещах без разрешения, а потом вслух читать драгоценное произведение перед всеми!"
52115-257 = "Это моя интеллектуальная собственность! Представьте: кто-то это услышит, украдёт идею и выпустит бестселлер!"
52115-258 = "Вы хоть понимаете, что натворили?!"
52115-259 = "[s] «И ТОЛЬКО это тебя волнует?»"
52115-260 = "Хм. Понимаю, почему ты взяла псевдоним..."
52115-261 = "...но я бы не боялась, что кто-то украдёт твою идею, Сюро."
52115-262 = ""
52115-264 = ""
52115-265 = "Наверное... К тому же книга — это не просто идея! Чтобы воплотить мой замысел, нужен талант."
52115-266 = ""
52115-268 = ""
52115-269 = "Кхм. Ну... Что вы все думаете? Вам... понравилось?"
52115-270 = "Понимаю, вы лишились дара речи от восхищения, но всё же поделитесь добрыми отзывами."
52115-271 = "Как вам мой шедевр?"
52115-272 = ""
52115-275 = ""
52115-276 = "Эм, ну... Мне кажется..."
52115-277 = "...Прости, Юкари. Нужно ускорить шаг, если хотим добраться до особняка до заката."
52115-278 = "Д-Да, Нагуса! Сейчас не время для литературных обсуждений!"
52115-280 = "Тома нет. Зря потратили время."
52115-281 = "Ну, по крайней мере, она никому не навредила. Хотя мне не нравится, как она нас описала..."
52115-282 = "[s] «...Может, тебе стоит побольше читать?»"
52115-283 = ""
52115-285 = ""
52115-287 = ""
52115-288 = "Угх... А-а-ах..."
52115-289 = "ЗАТКНИТЕСЬ!"
52115-291 = "Следующий Эпизод;Мико рода Кадэнокодзи"
