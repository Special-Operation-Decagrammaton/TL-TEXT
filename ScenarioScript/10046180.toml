[translation]
10046180-2 = ""
10046180-3 = "Хи-хи."
10046180-4 = "...Пожалуйста, пощади меня."
10046180-5 = "Я ещё даже ничего не сказала..."
10046180-6 = "Только не сегодня! Пожалуйста, Ханако! Я работаю!"
10046180-7 = "Ох... Ты и правда ужасно занята."
10046180-8 = "Но не волнуйся. Я пришла не для того, чтобы... мешать. Наоборот."
10046180-9 = "Я пришла помочь тебе, Ичика!"
10046180-10 = "..."
10046180-11 = "...Подозрительно?"
10046180-12 = "«Ох уж эта непослушная Урава Ханако... Наверняка она что-то задумала.»"
10046180-13 = "Вот о чём ты думаешь. Я читаю тебя как открытую книгу."
10046180-14 = "...!"
10046180-15 = "...Шучу."
10046180-16 = "Как всегда, у тебя выдающееся лицо для покера."
10046180-17 = "Чего ты на самом деле хочешь?"
10046180-18 = "Я же сказала! Я всё время была абсолютно честна. Как мне заставить тебя поверить?"
10046180-19 = "Я здесь, чтобы помочь. Ни больше ни меньше."
10046180-20 = "Да, это на меня не похоже. Идея была не моя... но мне она нравится."
10046180-21 = "У тебя такие хорошие друзья... ♥"
10046180-22 = "То есть... придут ещё помощники?"
10046180-23 = "Хм, не знаю. Это секрет."
10046180-24 = "В любом случае я честна. Можно сказать, я перед тобой практически обнажена..."
10046180-25 = "...Да, я поняла."
10046180-26 = "*вздох* ...Ладно. Только, пожалуйста, веди себя нормально."
10046180-27 = "Ох, как легко ты сдалась."
10046180-28 = "Пожалуйста, следи за формулировками."
10046180-29 = "Честно говоря, я не знаю, зачем ты это предлагаешь, но лишние руки мне нужны."
10046180-30 = "Так что я с радостью приму твою помощь."
10046180-31 = "Хи-хи. Как приятно раскрыть перед тобой всё, без каких-либо ограничений!"
10046180-32 = "Да-да, только перестань говорить такие вещи так громко!"
10046180-33 = "Хи-хи, но ведь это сама правда. А теперь..."
10046180-34 = ""
10046180-36 = ""
10046180-37 = ""
10046180-38 = "Заставим наши голые, горячие тела поработать!"
