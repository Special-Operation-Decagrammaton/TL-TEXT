[translation]
2005705-1 = "Бок о бок"
2005705-6 = "Я пришёл в место, где мы с Аканэ договорились встретиться."
2005705-7 = "...Которым оказался совершенно пустой... жутко тихий... класс."
2005705-8 = ""
2005705-12 = "Угадай кто?"
2005705-13 = "[s] «А-А-А?!?!»"
2005705-15 = "[ns] «А-Аканэ?!?!»"
2005705-16 = "Верно."
2005705-19 = "Добро пожаловать, Сенсей. Фуфу."
2005705-20 = "О боже... Кажется, я немного переборщила. Прошу прощения."
2005705-21 = "[s1] «Всё нормально. Просто... здесь очень тихо.»\n[s2] «Похоже, класс пустой, да?»"
2005705-24 = "Да, этот класс..."
2005705-25 = "..."
2005705-26 = "Я зарезервировала его на следующие два часа. Сюда никто не придёт."
2005705-27 = "О? Почему вы так паникуете?"
2005705-28 = "Неужели... вы мне не доверяете?"
2005705-29 = "[s] «Нет! Доверяю! Правда! Просто...!»"
2005705-30 = "Разумеется, доверяете! Значит, паниковать незачем."
2005705-31 = ""
2005705-33 = ""
2005705-35 = ""
2005705-36 = "Потому что и я доверяю вам больше всех."
2005705-37 = "Я кивнул в ответ на добрый, успокаивающий голос Аканэ."
2005705-40 = "Почему я попросила встретиться в пустом классе? Позвольте объяснить..."
2005705-41 = "Помните, я говорила, что благодаря вашей помощи смогла изменить отношения с одноклассницами?"
2005705-42 = "Я хотела передать вам послание... специально для вас."
2005705-43 = "[s3] «Но всё же... Когда в классе только два человека...»\n[s4] «Как именно ты собираешься... передать это послание?»"
2005705-46 = "Мне пришла одна мысль."
2005705-47 = "Знаете поговорку: «лучше один раз увидеть, чем сто раз услышать»?"
2005705-48 = "Так какой способ лучше, чем... показать вам новую меня лично?"
2005705-49 = "Как именно, спрашиваете?"
2005705-50 = "Фу-фу."
2005705-51 = ""
2005705-53 = ""
2005705-54 = "Сенсей."
2005705-55 = "Пока мы в этом классе, не могли бы вы..."
2005705-56 = "...стать моим одноклассником?"
2005705-57 = ""
2005705-60 = "[ns] «?!»"
2005705-63 = "Я согласился поучаствовать с Аканэ в ролевой игре «одноклассники» (?)."
2005705-64 = "Пока я размышлял, подобает ли учителю вообще заниматься чем-то подобным..."
2005705-69 = "Угадай кто?"
2005705-70 = "[s] «Аканэ...?»"
2005705-71 = "Да. Это я."
2005705-72 = ""
2005705-75 = ""
2005705-76 = "Хм? Что-то случилось?"
2005705-77 = "[USERNAME]?"
2005705-78 = "У вас много вопросов, но сначала вы хотите знать, куда делись мои очки?"
2005705-79 = "Хм, пожалуй, просто захотелось перемен."
2005705-80 = "А. Я слишком непривычно выгляжу без очков? Не могу не почувствовать лёгкое разочарование."
2005705-81 = "[s] «Нет-нет-нет. Совсем НЕТ!»"
2005705-82 = "Фуфу. Спасибо."
2005705-83 = "Вы никогда не угадаете, что сегодня утром произошло на уроке..."
2005705-86 = "Аканаэ плавно перешла к болтовне и сплетням, словно занималась этим всю жизнь."
2005705-87 = "...У меня действительно начало возникать чувство, будто я просто разговариваю с ровесницей."
2005705-90 = "А. Знаю. Почему я всё это время держалась на расстоянии от одноклассниц, если явно умею с ними дружить?"
2005705-91 = "..."
2005705-92 = "Если честно, общение всё ещё вызывает у меня тревогу."
2005705-93 = "Даже когда я пытаюсь показать вам свою «новую» сторону, [USERNAME], не могу избавиться от мысли, что всё это искусственно."
2005705-94 = "Наверное, поддерживать внешний образ — часть человеческой жизни."
2005705-95 = "Возможно, мне просто... немного страшно."
2005705-96 = "[s] «Боишься, что людям не понравится настоящая ты?»"
2005705-97 = "Возможно, отчасти..."
2005705-98 = ""
2005705-100 = ""
2005705-102 = "Но больше всего я боюсь, что люди узнают: я сама даже не понимаю, кто я."
2005705-103 = "Мне довольно легко соответствовать чужим ожиданиям."
2005705-104 = "А вот понять себя, похоже, совершенно другая задача."
2005705-105 = ""
2005705-107 = "Я... хорошо ориентируюсь в ситуациях. Говорю правильные вещи, веду себя внимательно и вежливо..."
2005705-108 = "Это естественная часть моей работы."
2005705-109 = "Но это не значит быть собой. Это значит быть той, какой, как мне кажется, хотят видеть меня окружающие."
2005705-110 = "Люди говорят «будь собой», но я толком не знаю, кто это."
2005705-111 = "Из-за этого мои связи кажутся пустыми. Я могу вот так разговаривать и постоянно говорить правильные вещи, но за ними нет собственного намерения."
2005705-112 = "Поэтому я чувствовала, будто застряла."
2005705-113 = "Эту невидимую стену перед собой построила я сама, но всё равно не могу найти путь вокруг."
2005705-114 = "Я стараюсь двигаться медленно, как вы советовали, и чувствую, что кое-что меняется..."
2005705-115 = "Но кажется, будто это лишь временная заплатка."
2005705-116 = ""
2005705-118 = ""
2005705-119 = "...Простите, [USERNAME]."
2005705-120 = "Несмотря на все наши усилия, похоже, дальше я не смогу."
2005705-122 = "Я потратила впустую все ваши старания, [USERNAME]."
2005705-123 = ""
2005705-126 = "Почему я всегда такая...?"
2005705-129 = "[ns] «Я всё равно очень рад, что ты смогла об этом рассказать.»"
2005705-130 = "...?"
2005705-131 = "..."
2005705-132 = "...Вы очень особенный человек, [USERNAME]."
2005705-133 = "Вы один из немногих, с кем я могу говорить о таком."
2005705-134 = "Возможно, единственный..."
2005705-135 = "Вот кем вы для меня являетесь."
2005705-136 = "[s5] «Я хочу, чтобы в твоей жизни было больше таких „меня“!»\n[s6] «Уверен, это не будет легко.»\n[s7] «Честно говоря, я сам не очень в этом хорош.»"
2005705-140 = "...Вы тоже, [USERNAME]?"
2005705-141 = "..."
2005705-142 = "Вот как..."
2005705-143 = "Наверное, вы тоже не родились способным на всё, [USERNAME]."
2005705-144 = "[s] «Поэтому я так ценю то, что ты только что сказала.»"
2005705-145 = "..."
2005705-146 = "Фу-фу."
2005705-147 = "Иногда я кое о чём задумываюсь."
2005705-148 = "В другой жизни, при совершенно других отношениях..."
2005705-149 = "Интересно... насколько иначе сложились бы наши жизни."
2005705-150 = "[s] «В каком-то смысле именно это мы сейчас и делаем, разве нет?»"
2005705-151 = "Фуфуфу."
2005705-152 = "Вы правы. Пока что мы просто одноклассники."
2005705-153 = "..."
2005705-154 = "Знаете, [USERNAME]."
2005705-155 = "[s] «Хм?»"
2005705-156 = "Просто стойте здесь и не двигайтесь."
2005705-157 = ""
2005705-160 = "Я уже хотел спросить зачем, когда—"
2005705-161 = ""
2005705-164 = "Оп!"
2005705-165 = "[ns] «А?!?!?»"
2005705-166 = "Все мои чувства... были заняты Аканэ...!"
2005705-167 = "Тссс."
2005705-168 = "Пусть класс и пуст, кто-нибудь может пройти мимо."
2005705-169 = ""
2005705-172 = "...Спасибо, [USERNAME]."
2005705-173 = "За то, что поговорили со мной."
2005705-174 = "И выслушали всё, что я хотела сказать."
2005705-175 = "Это сделало меня очень счастливой."
2005705-176 = "Да... Я правда счастлива."
2005705-178 = "..."
2005705-179 = "[s] «...»"
2005705-180 = "Здравствуйте, Сенсей."
2005705-181 = "[s] «Да, здравствуй, Аканэ.»"
2005705-184 = "― [log=아카네 교복]Фуфу.[/log][wa:270]"
2005705-187 = "― [log=아카네 교복]Ситуация оказалась немного[/log]"
2005705-189 = "― [log=아카네 교복]смущающей, чем я ожидала.[/log]"
2005705-192 = "― [log=아카네 교복]Быть честной с самой собой...[/log][wa:3250]"
2005705-194 = "― [log=아카네 교복]Похоже, я никак не могу к этому привыкнуть.[/log][wa:340]"
2005705-197 = "[ns] «Н-Ну, уязвимость даётся тяжело!»"
2005705-198 = "― [log=아카네 교복]Да. Именно так.[/log][wa:1290]"
2005705-201 = "― [log=아카네 교복]Но для меня...[/log]"
2005705-203 = "― [log=아카네 교복]Похоже, это было действительно необходимо.[/log]"
2005705-206 = "― [log=아카네 교복]Во многих смыслах я у вас в долгу, Сенсей.[/log][wa:2020]"
2005705-209 = "― [log=아카네 교복]Несмотря ни на что, думаю, встреча с вами была...[/log][wa:3890]"
2005705-212 = "― [log=아카네 교복]Настоящей большой удачей.[/log][wa:2110]"
2005705-215 = "― [log=아카네 교복]Жизнь всё время движется вперёд,[/log][wa:890]"
2005705-217 = "― [log=아카네 교복]и по пути некоторые вещи забываются.[/log][wa:10]"
2005705-220 = "― [log=아카네 교복]То, что произошло сейчас, возможно, тоже...[/log][wa:2440]"
2005705-223 = "― [log=아카네 교복]Но я буду помнить.[/log][wa:3010]"
2005705-225 = "― [log=아카네 교복]Даже если вы забудете, Сенсей.[/log][wa:520]"
2005705-228 = "― [log=아카네 교복]По-настоящему драгоценные воспоминания...[/log]"
2005705-230 = "― [log=아카네 교복]Никогда не исчезают окончательно.[/log]"
2005705-233 = "Как и в тот момент, когда Аканэ впервые вошла..."
2005705-234 = "Она исчезла без следа, будто её здесь никогда и не было."
2005705-235 = "На мгновение я даже подумал, не приснилось ли мне всё."
2005705-236 = "Но маленькие вещи, оставленные ею, подтверждали, что всё случилось на самом деле."
