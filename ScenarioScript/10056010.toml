[translation]
10056010-1 = "Episode 1; Sardine Ice Cream"
10056010-2 = "Floating Port - Terminal 3 East Side Pier"
10056010-4 = "(Terminal 3 was full of energy.)"
10056010-5 = "(There were students fishing, students transporting fish, students servicing#nships...)"
10056010-6 = "(Although everyone seemed busy, I couldn't find anyone who seemed to be a part of the Diving Club.)"
10056010-8 = "(Then, I spotted a girl crouched down at the end of the pier.)"
10056010-10 = "(She wore a white swimsuit and was counting up while staring at the water's#nsurface.)"
10056010-11 = "101… 102… 103…"
10056010-12 = "[s1] \"Excuse me…\"\n[s2] \"Could you spare a second?\""
10056010-15 = "111… 112… 113…"
10056010-16 = "[s3] \"The student over there wearing a white swimsuit…\"\n[s4] \"What exactly are you counting?\""
10056010-19 = "…Who's \"The Student Over There?\""
10056010-20 = "This student has a name."
10056010-25 = "Call mee Sayuriii."
10056010-29 = "[ns5] \"Sayuri, is it?\"\n[ns6] \"Nice to meet you. I'm Schale's Sensei.\""
10056010-33 = "[ns] \"What're you looking at?\""
10056010-37 = "…The sea."
10056010-41 = "The bubbles going bubble bubble."
10056010-42 = "[s] \"Bubble bubble.\""
10056010-43 = "The sea is fun to look at."
10056010-44 = "Sardines, lobsters, whales... They're all underwater."
10056010-45 = "There's nothing but birds above the water."
10056010-49 = "It's so much more fun underwater..."
10056010-50 = "[s] \"Have you ever seen a whale?\""
10056010-51 = "Yeah. Go a little towards the open sea and there's a lot. Won't be any by the port."
10056010-52 = "Whales are full of curiosity, so they like to swim alongside the boats. #nIf they're excited, they might even do a big jump."
10056010-53 = "If the boat is too close, it might capsize, so be careful."
10056010-54 = "[s7] \"A whale jumping...\"\n[s8] \"I'd love to see that some day.\""
10056010-57 = "You like whales too?"
10056010-58 = "Okey. Happy to hear. #nBut the other students at Odyssey don't seem to like them that much..."
10056010-59 = "[s] \"They're cool and got some cute parts to them too...\""
10056010-63 = "[ns9] \"...Sorry, I got sidetracked.\"\n[ns10] \"Do you mind if I ask you something?\""
10056010-67 = "What will you give?"
10056010-71 = "Nene-chan said this before."
10056010-72 = "Ask for compensation when an adult asks for something, or you will regret it later."
10056010-73 = "[s11] \"...That's true, I suppose.\"\n[s12] \"How about some snacks then?\""
10056010-76 = "...Snacks!"
10056010-77 = "Sayuri would like an ice cream from Aqua Seal then."
10056010-78 = "Sayuri loooves sardine ice cream."
10056010-79 = "[s13] (Sounds fishy...)\n[s14] \"Sure thing. Where do they sell them?\""
10056010-82 = "The nearest shop is at deck 2―"
10056010-83 = "Pwah!"
10056010-88 = "You see that? D'you see that? I can dive too!"
10056010-89 = "Hey, c'mon, how many seconds was that? #nAs promised, if I win, you're treating me to ice cream at Aqua Seal..."
10056010-93 = "...Who are you?"
10056010-94 = "Come quick, Makina."
10056010-95 = "Schale's Sensei's gonna buy use ice cream."
10056010-96 = "Huh, why? That's really fishy..."
10056010-97 = "[s15] \"Hello. I'm not suspicious.\"\n[s16] \"There was just something I wanted to ask, so―\""
10056010-100 = "More importantly than that, how many seconds was that? #nThat HAD to be at least 180 seconds, right?"
10056010-104 = "...Err."
10056010-105 = "...Huh?"
10056010-106 = "Was talking to Sensei and forgot."
10056010-107 = "I was diving for my LIFE here!"
10056010-108 = "This was your fault, so we're counting this as my win!"
10056010-109 = "No way. Makina's a noob that can't even dive 10 meters without weights."
10056010-110 = "If you're mad, how about you try again?"
10056010-111 = "What'd you saaay!?"
10056010-112 = "[s17] \"That's enough, you two.\"\n[s18] \"Since it was my fault, I'll treat both of you to ice cream\""
10056010-118 = "Mngh... It seems really fishy, but..."
10056010-119 = "Whatever, should be fine. I know this place like the back of my hand. Also, Sensei#nseems like a weakling."
10056010-120 = "Very well. You're headed to Aqua Seal, right? I'm tagging with."
10056010-121 = "[s] \"...Are you getting sardine ice cream too?\""
10056010-122 = "No way I am!"
10056010-124 = "Terminal 3, Downtown by Deck 2"
10056010-125 = "(We sat on a bench and ate our ice cream.)"
10056010-126 = "(Sayuri chose the sardine ice cream, while Makina chose the double chocolate#nice cream.)"
10056010-127 = "(Out of curiosity, I also picked the sardine ice cream, but... #nThere were actual sardines in it, and the ice cream itself tasted briny and fishy.)"
10056010-132 = "Sardine ice cream really is the best. Sweet, salty, and so addicting~"
10056010-136 = "Like I said before, that stuff does NOT smell like ice cream."
10056010-137 = "The classic chocolate is the real number one."
10056010-138 = "For a snack after a swim, nothing beats some sweet, sweet chocolate ice cream."
10056010-139 = "[s19] \"You two sure are good at swimming.\"\n[s20] \"Is everyone at Odyssey this good?\""
10056010-142 = "Not really? Being a student here doesn't mean you're good at it."
10056010-143 = "Like, some of the students from the Cruise Operations Department don't even#nwanna get into the water."
10056010-144 = "Well, I do think Sayuri and I are pretty good at it, though."
10056010-145 = "Sayuri is next level good."
10056010-146 = "Wha!? Let's have a match then to settle things straight!"
10056010-147 = "Know this though, Sensei... There's no one else who can even compare to us."
10056010-148 = "After all, we're not ordinary students. We're Special―"
10056010-149 = "Hey hey! Whoa!"
10056010-150 = "[s] \"Special...?\""
10056010-151 = "I-it's nothing!"
10056010-152 = "Anyways, let's get back to the original topic... You wanted to ask us something, #nright? I'll tell you what I know about it, as thanks for the ice cream."
10056010-153 = "[s] \"Alright, let's see.\""
10056010-157 = "[ns] \"Do you know where the students from the Diving Club are?\""
10056010-159 = "T-the Diving Club?"
10056010-160 = "Why do you want to know that...?"
10056010-161 = "[s21] \"The Captain mentioned something earlier.\"\n[s22] \"She's curious about their funding.\""
10056010-167 = "[ns23] \"So I'd like to meet with them and have a talk.\"\n[ns24] \"I heard they've been avoiding contact with other people though...\""
10056010-170 = "I-I suppose so. The Diving Club does have a lot of members that act all secretive..."
10056010-171 = "Steaalth moode."
10056010-175 = "Last time we saw them was like, what?... Last month, I think?"
10056010-176 = "Don't think they're around these parts. #nHow about you try searching some of the other terminals?"
10056010-177 = "[s] \"I see...\""
10056010-181 = "Diving Club!"
10056010-185 = "I finally found you!"
10056010-186 = "You were the ones who tore through the net in area 3 last week, weren't you? #nThere were traces that a sharp knife was used to cut through it."
10056010-187 = "You can't be diving in other people's workplaces without permission, you know?"
10056010-188 = "But they're the ones who didn't install any buoys after setting up their net in the#ncommon area."
10056010-189 = "Imagine how bad it would be if you weren't paying attention and your fins got#nentagled in them!"
10056010-190 = "I've got a lot more other things to say!"
10056010-191 = "We've also been receiving complaints that schools of fish are being scared away#nby your sea scooters."
10056010-192 = "You better explain yourselves properly, or don't expect us to let you off the hook#nnext time."
10056010-197 = "[ns] \"...Diving Club?\""
10056010-198 = "...Ah."
10056010-199 = "Busted."
10056010-200 = "Craaap! We were doing so well..."
10056010-201 = "No other choice. We gotta use that [ruby=tactic]plan[/ruby]."
10056010-202 = "Sayuri, plan D is a go. You remember plan D, right?"
10056010-203 = "Yep."
10056010-207 = "Dash away!"
10056010-211 = "[ns] \"Ho-hold on a second, you two!\""