[translation]
10056010-1 = "Episode 1;Sardine Ice Cream"
10056010-2 = "Floating Pier - East Side Pier of Terminal 3"
10056010-4 = "(Terminal 3 was full of life.)"
10056010-5 = "(Students fishing, students carrying fish, students maintaining boats...)"
10056010-6 = "(Everyone looked busy, but there were no students who looked like they were from the diving club.)"
10056010-8 = "(Just then, a girl squatting at the edge of the pier caught my eye.)"
10056010-10 = "(A girl in a white swimsuit was looking at the sea surface and counting numbers.)"
10056010-11 = "101, 102, 103..."
10056010-12 = "[s1] \"Um...\"\n[s2] \"Got a second?\""
10056010-15 = "111, 112, 113..."
10056010-16 = "[s3] \"Student in the white swimsuit...?\"\n[s4] \"What are you counting?\""
10056010-19 = "...Not \"student in the white swimsuit.\""
10056010-20 = "I have a proper name."
10056010-25 = "Call me, Sayuri..."
10056010-29 = "[ns5] \"Sayuri, right?\"\n[ns6] \"Nice to meet you. I am the Sensei from Schale.\""
10056010-33 = "[ns] \"What are you looking at?\""
10056010-37 = "...The ocean."
10056010-41 = "Looking at bubbles... Blub, blub."
10056010-42 = "[s] \"Blub, blub.\""
10056010-43 = "Watching the ocean is fun."
10056010-44 = "Sardines, langoustines, whales... they are all in the water."
10056010-45 = "There are only birds above the water."
10056010-49 = "Even though it is much more fun in the water..."
10056010-50 = "[s] \"Have you ever seen a whale, Sayuri?\""
10056010-51 = "I have. You can meet lots of them if you go out a bit offshore. Near the port is no good."
10056010-52 = "Whales are very curious, so they like to swim alongside ships.#nSometimes they jump high when they get excited."
10056010-53 = "You have to be careful because if the boat gets too close, it might flip over."
10056010-54 = "[s7] \"A whale jumping...\"\n[s8] \"I would love to see that someday.\""
10056010-57 = "Do you like whales too, Sensei?"
10056010-58 = "I see, I am glad.#nThough the students from Odyssey do not seem to like them very much..."
10056010-59 = "[s] \"They are cool, and they have their cute moments too...\""
10056010-63 = "[ns9] \"--Wait, I forgot.\"\n[ns10] \"Can I ask you one thing?\""
10056010-67 = "What will you give me?"
10056010-71 = "Nene-chan said this before."
10056010-72 = "When adults ask you for favors, you have to get something in return or you will regret it."
10056010-73 = "[s11] \"...That is true.\"\n[s12] \"How about a snack, then?\""
10056010-76 = "...A snack!"
10056010-77 = "Then, ice cream from Aqua Seal."
10056010-78 = "Sayuri loves sardine ice cream the most~"
10056010-79 = "[s13] (That sounds fishy...)\n[s14] \"Sure. Where can I buy it?\""
10056010-82 = "The closest shop is on the 2nd deck, but--"
10056010-83 = "Puh!"
10056010-88 = "Were you watching? You were watching, right? I managed to free-dive too!"
10056010-89 = "Hey, hey, how many seconds was it?#nIf I win, you have to treat me to ice cream at Aqua Seal as promised--"
10056010-93 = "...Who is that?"
10056010-94 = "Makina, hurry up and come over."
10056010-95 = "The Sensei from Schale is going to buy us ice cream."
10056010-96 = "Huh, why? That sounds super sketchy..."
10056010-97 = "[s15] \"Hello. I am not sketchy.\"\n[s16] \"Actually, there is something I want to ask--\""
10056010-100 = "Never mind that! How many seconds was I holding my breath?#nI think it was over 180 seconds."
10056010-104 = "...Ah."
10056010-105 = "...Huh?"
10056010-106 = "I was talking to Sensei and forgot."
10056010-107 = "I was diving for my life over here, you know!?"
10056010-108 = "This is your mistake, so my win!"
10056010-109 = "No way. Makina is a wimp who cannot even dive 10 meters without a weight."
10056010-110 = "If you are upset, why not try again?"
10056010-111 = "What...l!?"
10056010-112 = "[s17] \"You two, that is enough.\"\n[s18] \"It is my fault, so I will treat you to ice cream.\""
10056010-118 = "Hmm... Sounds kind of sketchy, but..."
10056010-119 = "Well, whatever. I know this area inside and out, and Sensei looks weak anyway."
10056010-120 = "Fine. Aqua Seal, right? I am going too."
10056010-121 = "[s] \"...Makina, sardine ice cream too?\""
10056010-122 = "No way in hell!"
10056010-124 = "Terminal 3, shopping street in front of the 2nd deck"
10056010-125 = "(We decided to sit on a bench and eat our ice cream.)"
10056010-126 = "(Sayuri chose sardine ice cream, and Makina chose double chocolate ice cream.)"
10056010-127 = "(Curious, I tried getting sardine ice cream myself, but...#nIt had actual pieces of sardine in it and was salty and fishy.)"
10056010-132 = "Sardine ice cream is truly supreme. Sweet and salty, totally addictive~"
10056010-136 = "Before that, the smell is not even ice cream."
10056010-137 = "Classic chocolate is the best."
10056010-138 = "There is nothing better than sweet chocolate ice cream as a post-swim snack."
10056010-139 = "[s19] \"You two are really good at swimming.\"\n[s20] \"Are all the students at Odyssey like that?\""
10056010-142 = "Nah? Just because we go to school here does not mean everyone is good at it."
10056010-143 = "Apparently, a lot of students in the Cruise Operations Department hate even getting in the water."
10056010-144 = "Well, I suppose Sayuri and I are on the better side."
10056010-145 = "Sayuri is on a completely different level of good."
10056010-146 = "Wha--!? Let us settle this contest once and for all!"
10056010-147 = "But you see, Sensei... if anyone else were our opponent, there would be no competition."
10056010-148 = "Because Sayuri and I are not normal students, we are special--"
10056010-149 = "Wah! Wah!"
10056010-150 = "[s] \"Special...?\""
10056010-151 = "N-Nothin'!"
10056010-152 = "Anyway, back to what we were talking about... What did you want to know?#nI will answer if I know. Thanks for the ice cream."
10056010-153 = "[s] \"Then, let us start over.\""
10056010-157 = "[ns] \"Do you know where the diving club students are?\""
10056010-159 = "Th-The diving club?"
10056010-160 = "Why are you asking about that...?"
10056010-161 = "[s21] \"The captain mentioned it earlier.\"\n[s22] \"She is curious about the diving club's funding sources.\""
10056010-167 = "[ns23] \"So I wanted to meet and talk with them for a bit.\"\n[ns24] \"Though they seem to avoid interacting with others...\""
10056010-170 = "W-Well, yeah. A lot of students in the diving club are secretive..."
10056010-171 = "Stealth mode~"
10056010-175 = "As for us... I think we last saw them last month."
10056010-176 = "Are they not around here?#nWhy don't you try going to another terminal?"
10056010-177 = "[s] \"I see...\""
10056010-181 = "Diving club!"
10056010-185 = "Found you...!"
10056010-186 = "You guys were the ones who tore the net in the 3rd area last week, right?#nThere were traces of it being cut with a sharp blade."
10056010-187 = "You should not be diving in someone else's work area without permission, right?"
10056010-188 = "Those guys set up a net in the common area without setting up any buoys, didn't they?"
10056010-189 = "We couldn't see it, our fins got tangled, and it was a huge pain!"
10056010-190 = "We have a ton of other things we want to ask!"
10056010-191 = "We have complaints that schools of fish are running away because of your underwater scooter."
10056010-192 = "If you don't explain yourselves properly, this time we really won't let you off easy--"
10056010-197 = "[ns] \"...The diving club?\""
10056010-198 = "...Ah."
10056010-199 = "We got caught."
10056010-200 = "Damn it, things were going so well..."
10056010-201 = "Guess we have no choice but to use that plan."
10056010-202 = "Sayuri, it is Plan D. Remember it?"
10056010-203 = "Got it."
10056010-207 = "Dash!"
10056010-211 = "[ns] \"W-Wait a minute!\""
