[translation]
1012203-1 = "Возвращаясь к прошлому"
1012203-3 = ""
1012203-4 = "Ага, Сенсей! Привет!"
1012203-5 = "Ты так задумался, да? А-ха-ха."
1012203-6 = "[s1] «Просто смотрю на прилив.»\n[s2] «Здесь очень красиво.»"
1012203-9 = "Пожалуй. И сегодня не слишком жарко."
1012203-10 = "Хи-хи. Ты любишь море, Сенсей?"
1012203-11 = "[s3] «Мне нравится, какое оно бескрайнее.»\n[s4] «Мне нравится запах солёного воздуха.»"
1012203-12 = "А, мне тоже!"
1012203-13 = "В море есть что-то такое искреннее и вечное."
1012203-14 = "Будто от него и в сердце становится просторнее. А-ха-ха!"
1012203-15 = "О, мне тоже!"
1012203-16 = "У него очень необычный запах. Не то чтобы свежий..."
1012203-17 = "...он солёный и даже немного рыбный. Но в этом нет ничего плохого!"
1012203-18 = "И ещё забавно смотреть, как волны накатывают и отступают."
1012203-19 = "Вот так...!"
1012203-20 = ""
1012203-22 = ""
1012203-24 = "А-ха-ха, стоять между волнами так странно!"
1012203-25 = "Когда вода уходит и уносит песок из-под ног... кажется, будто меня сейчас затянет!"
1012203-26 = "О, думаешь, мне стоит быть осторожнее?"
1012203-27 = "Ладно. Но тебе не о чем волноваться, Сенсей!"
1012203-28 = "Я регулярно тренируюсь плавать."
1012203-29 = ""
1012203-32 = "[ns] «Если подумать...»"
1012203-33 = ""
1012203-34 = "[ns] «У нас ведь однажды был урок плавания, да?»"
1012203-35 = "А... Ага."
1012203-36 = "Нас тогда поймал охранник, и мы удирали как беглецы!"
1012203-37 = ""
1012203-38 = ""
1012203-39 = ""
1012203-41 = "Хи-хи, было весело. А ты довольно быстро бегаешь, Сенсей."
1012203-42 = "[s] «Пришлось!»"
1012203-43 = "А-ха-ха. Это точно. Но всё равно не быстрее меня!"
1012203-44 = "После этого я стала заниматься ещё усерднее — всё благодаря тому, что ты помог починить мой купальник."
1012203-45 = "И оценки у меня были хорошие, знаешь? Я даже начала увереннее чувствовать себя в воде."
1012203-46 = ""
1012203-48 = ""
1012203-49 = "Я даже думала надеть тот купальник и сюда."
1012203-50 = "[s] «На частный пляж?»"
1012203-51 = "Ага! Может, он и не очень подходит к атмосфере, но мне всё равно нравится."
1012203-52 = "Ведь он напоминает мне о тебе."
1012203-53 = "...Но место, которое мы зашивали, довольно заметно."
1012203-54 = "Я переживала, что скажут остальные."
1012203-55 = "[ns] «А...»"
1012203-56 = "Они ведь не знают всей этой истории, а мне не хочется отвечать на кучу вопросов..."
1012203-57 = "...В конце концов, это уже давно было."
1012203-58 = ""
1012203-60 = ""
1012203-61 = "Хотя... может, и нет! М-м, м-м."
1012203-62 = "В любом случае!"
1012203-63 = "Вот поэтому я в итоге надела этот! А-ха-ха! ☆"
1012203-64 = "По-моему, он неплохо смотрится, да?"
1012203-65 = "Что думаешь? Милый?"
1012203-66 = "[s] «Да, очень милый, Мика.»"
1012203-67 = ""
1012203-70 = ""
1012203-71 = "...Ого."
1012203-72 = "Не ожидала такого прямого ответа."
1012203-73 = "...Э-э?!"
1012203-74 = ""
1012203-76 = ""
1012203-78 = "Тебе совсем не стыдно? Ты просто берёшь и говоришь такое вслух?"
1012203-79 = "[s5] «Ого. Дежавю...»\n[s6] «Не дай себя унести, Мика!»"
1012203-82 = "О, тут совсем мелко. Я в порядке, видишь? Вода только до колен."
1012203-83 = "Хи-хи. Не хочешь присоединиться, Сенсей?"
1012203-84 = ""
1012203-87 = ""
1012203-89 = "[ns] «Знаешь, мы ведь так и не закончили тот урок!»"
1012203-91 = ""
1012203-92 = "Ага."
1012203-93 = "В таком случае..."
1012203-94 = ""
1012203-96 = ""
1012203-97 = ""
1012203-98 = "...продолжи урок плавания, пожалуйста, Сенсей."
1012203-100 = "И так мы вместе играли на мелководье."
