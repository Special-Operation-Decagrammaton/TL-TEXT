[translation]
103110-1 = "Эпизод 11;Начало истории"
103110-11 = "...Вина лежит на мне."
103110-12 = ""
103110-16 = "Причина и следствие моих решений."
103110-18 = ""
103110-21 = "Только когда всё дошло до этого, я наконец поняла, что вы всё это время были правы..."
103110-22 = "Простите мою дерзость, но мне нужна ваша помощь."
103110-24 = ""
103110-27 = "Сенсей [USERNAME]."
103110-29 = ""
103110-32 = "Вы не запомните этих слов, но это неважно."
103110-33 = "Даже без воспоминаний вы, скорее всего, примете то же решение в той же ситуации..."
103110-34 = ""
103110-38 = "Потому что важен выбор, который мы делаем, а не прожитый нами опыт."
103110-39 = "Есть решения, которые можете принять только вы."
103110-40 = ""
103110-44 = "Раньше я уже говорила об ответственности."
103110-45 = "Тогда я не понимала этого по-настоящему, но теперь понимаю."
103110-46 = ""
103110-49 = "Взросление, ответственность, обязательства... и решения, которые вы принимаете, выходя за рамки этих понятий."
103110-50 = "Я даже понимаю, что всё это означает."
103110-52 = ""
103110-59 = "― ..."
103110-65 = "― Поэтому, [wa:900]Сенсей."
103110-71 = "― ...вы единственный, [wa:1800]кому я могу доверять."
103110-77 = "― Только вы"
103110-82 = "― Только вы можете освободить нас от этой искривлённой, искажённой судьбы..."
103110-88 = "― Пожалуйста, найдите решения, которые приведут нас"
103110-93 = "― к новому будущему."
103110-97 = "Поэтому, Сенсей. Прошу вас..."
103110-98 = ""
103110-101 = "Ваши отношения со всеми нами..."
103110-102 = "Драгоценные воспоминания, которые мы создали... Все те дни, что провели вместе... Пожалуйста..."
103110-103 = ""
103110-115 = "Ч-что?!"
103110-116 = "Ошибка в системе многомерного анализа...!"
103110-117 = "Состояние квантовой суперпозиции Утнапиштима... не совпадает с Ковчегом!"
103110-118 = "Что?! Наша система сломалась?"
103110-119 = "Н-Нет... Это..."
103110-121 = "Проблема не у нас! Это Ковчег Атрахасис отклонился!"
103110-122 = ""
103110-128 = ""
103110-129 = ""
103110-130 = "П-Президент Рио?!"
103110-132 = "...!"
103110-133 = "Н-Невозможно... Неужели...?"
103110-134 = "Состояние Ковчега Атрахасис изменилось?! Он отклонился от рассчитанного нами значения...?!"
103110-135 = "...Он создал новую ось, которая не входит в ту многомерность, в которой существуем мы."
103110-136 = "Это как пытаться объяснить трёхмерный мир двумерному существу. Как ни старайся, оно никогда не сможет этого понять..."
103110-137 = "С-Серьёзно...?"
103110-138 = "То есть... вычисления, превосходящие многомерный анализ, всегда были возможны...? Просто мы... не способны их понять?"
103110-139 = "Ты хочешь сказать... весь наш анализ и все расчёты до сих пор были..."
103110-140 = ""
103110-142 = ""
103110-143 = "...Всё было напрасно?"
103110-145 = "Следующий эпизод; Право света 1"
