[translation]
70015030-1 = "Исчезновение Ибуки, часть 3"
70015030-4 = ""
70015030-5 = "Н-ну... Добро пожаловать."
70015030-6 = "Прошу прощения, что привела столь скромных гостей в это выдающееся место..."
70015030-7 = ""
70015030-9 = ""
70015030-10 = "Ты всё перепутала, босс."
70015030-11 = ""
70015030-13 = ""
70015030-14 = ""
70015030-15 = ""
70015030-16 = ""
70015030-17 = ""
70015030-18 = "Ух ты! Как здесь здорово!"
70015030-19 = ""
70015030-21 = ""
70015030-22 = "Хи-хи... Т-тебе нравится, Ибуки...?"
70015030-23 = "Да, да! Прямо настоящий офис! Как те, где работают взрослые!"
70015030-24 = ""
70015030-26 = ""
70015030-27 = "О-хо-хо! Именно так и выглядит, правда? Ведь он и ЕСТЬ настоящий!"
70015030-28 = "(Как хорошо, что мы вовремя заплатили аренду в этом месяце... Иначе принимали бы их в палатке.)"
70015030-29 = ""
70015030-31 = ""
70015030-32 = "Знаешь, мы уже не раз сталкивались, но я впервые оказалась в этом офисе."
70015030-33 = "...Лично я надеялась, что у тебя никогда не появится повода сюда прийти."
70015030-34 = "Да, я так и думала. Чувства взаимны."
70015030-35 = "Хмф."
70015030-36 = "Ну, раз уж ты здесь, располагайся поудобнее."
70015030-37 = "..."
70015030-38 = "Значит, вот какое место ты себе нашла."
70015030-39 = ""
70015030-41 = ""
70015030-42 = "...Ага."
70015030-43 = "Что скажешь?"
70015030-44 = "...Тесно, всё завалено вещами, пыльно и полный беспорядок."
70015030-45 = "...Мне нравится."
70015030-46 = "Спасибо."
70015030-47 = ""
70015030-49 = ""
70015030-50 = "Ару! Красивая Ару! Ибуки хочет это прочитать!"
70015030-51 = "А? Т-ты умеешь это читать?"
70015030-52 = "Конечно! Одно... Сложные иероглифы! Одно... Злодеяние в день, да?"
70015030-53 = "В-всё верно..."
70015030-54 = "А что это значит?"
70015030-55 = "Н-ну, это...!"
70015030-56 = "Погоди, босс. Ты что, собралась ей объяснять? Думаешь, ребёнку можно такое рассказывать?"
70015030-57 = "Ух...!"
70015030-58 = "Ибуки маленькая, но это не значит, что Ибуки не поймёт!"
70015030-59 = "Ку-фу-фу, правда? Тогда Ару... то есть наш босс тебе всё объяснит! Давай, Ару!"
70015030-60 = "Да! Ибуки хочет знать!"
70015030-61 = "Н-ну... Это значит..."
70015030-62 = "Это значит... каждый день совершать по одному злодеянию..."
70015030-63 = "..."
70015030-64 = "Э-это наш девиз! Мы крутые преступники, которые ничего не боятся и не признают никаких ограничений...!"
70015030-65 = "(Я-я сказала! А вдруг она теперь нас испугается...?!)"
70015030-66 = ""
70015030-68 = ""
70015030-69 = "А?"
70015030-70 = "Потому что мы злодеи! Очень страшные, плохие злодеи!"
70015030-71 = "Вы совсем не плохие."
70015030-72 = ""
70015030-74 = ""
70015030-75 = ""
70015030-76 = "Все были так добры к Ибуки."
70015030-77 = "Когда вы нашли Ибуки, ей было так страшно, грустно и одиноко. А вы все играли с Ибуки и развеселили её!"
70015030-78 = "Э-эм, ну это..."
70015030-79 = "И вы покупали Ибуки вкусности, а ещё мы вместе качались на качелях и качелях-балансире!"
70015030-80 = "И всё это время вы ни разу не отпустили руку Ибуки."
70015030-81 = "..."
70015030-82 = "Поэтому Ибуки знает! Вы друзья! Вы очень добрые и совсем не плохие!"
70015030-83 = "Ку-фу-фу... Ну что думаешь о словах Ибуки, босс?"
70015030-84 = "...Хм-м..."
70015030-85 = "...В последнее время вы заметно поутихли."
70015030-86 = "...!"
70015030-87 = "Не поймите неправильно: вы всё ещё доставляете нам хлопоты, и мы не раз оказывались по разные стороны баррикад..."
70015030-88 = "...но я никогда не считала вас людьми без принципов."
70015030-89 = "В-вот как...?"
70015030-90 = "О-хо? Значит, вы наконец перестанете за нами гоняться?"
70015030-91 = "Ничего подобного я не говорила. Нарушителям правил мы спуску не дадим."
70015030-92 = "Ну да, ну да."
70015030-93 = ""
70015030-94 = "Ой, ой! Смотрите! Ибуки хорошо умеет играть в эту игру! Харука, давай поиграем вместе!"
70015030-95 = "Игра на равновесие...? Конечно. Сейчас достану. Хи-хи."
70015030-96 = ""
70015030-98 = ""
70015030-99 = ""
70015030-100 = ""
70015030-101 = "Н-ну, раз ты у нас в гостях, чувствуй себя как дома."
70015030-102 = "Хочешь что-нибудь выпить?"
70015030-103 = "А, тогда кофе, пожалуйста."
70015030-104 = "С сахаром? Со сливками?"
70015030-105 = "Зачем вообще спрашивать? Ничего не добавляйте. Чёрный, пожалуйста."
70015030-106 = "А-а? Х-хорошо..."
70015030-107 = "Без сахара и сливок...? Она пьёт такую горечь...? Э-это даже круто..."
70015030-109 = "Немного позже..."
70015030-111 = ""
70015030-112 = "Ура! На этот раз Ибуки победила! Хи-хи!"
70015030-113 = "П-потрясающе. Хи-хи. Т-тогда попробуем сыграть по другим правилам?"
70015030-114 = "Да! Харука, научи Ибуки новым правилам!"
70015030-115 = ""
70015030-117 = ""
70015030-118 = ""
70015030-119 = "...Удивительно приятно здесь находиться."
70015030-120 = "Н-но сколько ещё Ибуки может тут оставаться? Уверена, Пандемониум всё ещё ищет её!"
70015030-121 = ""
70015030-123 = ""
70015030-124 = "Кстати, они должны прийти с минуты на минуту."
70015030-125 = "Что ещё за «минуту»?"
70015030-126 = "Я сообщила им, как только Ибуки решила остаться. Не думаю, что они заставят себя долго ждать."
70015030-127 = "К-кому именно? Кому конкретно ты «сообщила»?"
70015030-128 = "А ты как думаешь? Пандемониуму, разумеется."
70015030-129 = "ЧЕГО-О-О?!"
70015030-130 = "А. Вот это поворот."
70015030-131 = "Т-ты просто выдала им наше убежище?! И именно ИМ? Мы же тебе доверяли!"
70015030-132 = "Что? Нет-нет. Ты правда думала, что они не знают?"
70015030-133 = "А?"
70015030-134 = "Серьёзно? Конечно, Пандемониум и Префектура знают о вашем офисе."
70015030-135 = "Вы же открыто ведёте дела, а не подпольную лавку на чёрном рынке."
70015030-136 = "Ах."
70015030-137 = "Если так посмотреть... И правда."
70015030-138 = "Мы неофициальный клуб. Но вполне официальная компания..."
70015030-139 = "Стоп, нет! Меня опять уводит в сторону!! Ты сказала, что Пандемониум идёт сюда..."
70015030-141 = ""
70015030-144 = "ИБУКИ-И-И-И!"
70015030-145 = ""
70015030-148 = ""
70015030-149 = ""
70015030-151 = ""
70015030-152 = "ИИИБУКИ!!"
70015030-153 = "А-А-А! Макото!"
70015030-154 = "Ибуки! Я виновата! Прости меня, Ибуки! Пожалуйста, прости!"
70015030-155 = "М-Макото... И-Ибуки нечем дышать..."
70015030-156 = "Ого, вот это выражение лица!"
70015030-157 = "П-председатель Макото...!"
70015030-158 = "Б-босс! Ч-что нам делать...? Мне её убить? Надо её убить? Надо?!"
70015030-159 = "НЕТ! Ни в коем случае! Отставить, Харука! Отставить!"
70015030-160 = ""
70015030-162 = ""
70015030-166 = ""
70015030-167 = ""
70015030-168 = ""
70015030-169 = "Что ж, прошу простить за вторжение."
70015030-170 = "Ха-ха, привет! Мы слышали, что Ибуки здесь!"
70015030-171 = "...Прошу прощения."
70015030-172 = "Вся верхушка Пандемониума... в нашем офисе..."
70015030-173 = ""
70015030-175 = ""
70015030-177 = "Б-босс!"
70015030-178 = "Босс! Босс! Возьми себя в руки!"
70015030-180 = "И-Ибуки... Мне правда очень жаль... Обещаю, больше никогда так не поступлю..."
70015030-181 = "...Т-ты ПРАВДУ обещаешь?"
70015030-182 = "Разумеется! Клянусь от всего сердца!"
70015030-183 = "Тогда пообещай, что Макото будет есть только пудинг Макото. Не Ибуки, не Ирохи, ничей другой."
70015030-184 = "Ух! Э-это..."
70015030-185 = "...Л-ладно. Обещаю."
70015030-186 = ""
70015030-188 = ""
70015030-189 = "Хорошо, давай скрепим обещание мизинчиками!"
70015030-190 = "...И обещание скреплено."
70015030-191 = "Ага! Хи-хи."
70015030-192 = "Ну всё. Ибуки прощает Макото!"
70015030-193 = ""
70015030-195 = ""
70015030-196 = "П-правда...?! Ибуки! Какая же ты великодушная... и добрая!!"
70015030-197 = "Т-тогда вернёмся в Пандемониум. Я купила тебе десять пудингов, чтобы загладить вину."
70015030-198 = "Но Ибуки ещё нужно попрощаться с новыми друзьями!"
70015030-199 = "С-с новыми друзьями?"
70015030-200 = "Ага! Они играли с Ибуки, покупали ей всякие вкусности и не давали скучать!"
70015030-201 = ""
70015030-203 = ""
70015030-204 = ""
70015030-205 = "А, так это были вы. «Проблема 68»."
70015030-206 = "В-вы нас знаете?"
70015030-207 = "Ки-хе-хе... Разумеется, Рикухачима Ару. Вы ведь все у нас на особом счету."
70015030-208 = "В-вы даже моё имя знаете?!"
70015030-209 = "Однако..."
70015030-210 = "Я, великая Макото, не собираюсь вам мешать."
70015030-211 = "А...?"
70015030-212 = "То, чем вы занимаетесь, тоже своего рода свобода."
70015030-213 = "Независимо от того, числитесь вы в академии или нет, студенты должны иметь возможность следовать за мечтой."
70015030-214 = "...!!"
70015030-215 = "О... Босс...? Это что же...?"
70015030-216 = "А если результаты вашего дела говорят сами за себя, кто вправе их у вас отнять?"
70015030-217 = "Я великодушный лидер и при необходимости готова закрыть глаза на мелкие нарушения закона. Ки-хе-хе."
70015030-218 = "Ведь Общество Пандемониума совсем не похоже на эту занудную Префектуру!"
70015030-219 = "ЧТО?! Мы часами помогали вам искать Ибуки, и ВОТ ваша благодарность?!"
70015030-220 = "Макото! Ако ведь специально пришла помочь Ибуки!"
70015030-221 = "А... Т-точно. Это старший администратор Амау Ако подсказала нам, где искать Ибуки..."
70015030-222 = "..."
70015030-223 = "..."
70015030-224 = "Забираю свои слова обратно!"
70015030-225 = "А?! Нельзя просто взять свои слова обратно и считать вопрос закрытым!"
70015030-227 = ""
70015030-228 = "В любом случае... Спасибо, что присмотрели за Ибуки."
70015030-229 = "Д-да не за что... На моём месте так поступил бы любой."
70015030-230 = "И всё же Ибуки для нас очень дорога. Поэтому спасибо."
70015030-231 = "Ку-фу-фу, раз уж вы так хотите нас поблагодарить, не будем отнекиваться!"
70015030-232 = ""
70015030-234 = ""
70015030-235 = "А, вижу, ваш стол уже староват. Хотите, я пришлю вам новый из штаб-квартиры Пандемониума?"
70015030-236 = "А? П-правда?"
70015030-237 = "Изящный руководительский стол из массива дерева. Впрочем, если он не в вашем вкусе, не стесняйтесь отказаться."
70015030-238 = "(Если я сразу соглашусь, будет совсем не круто... Надо держаться невозмутимо...!)"
70015030-239 = ""
70015030-241 = ""
70015030-242 = "Ну, понимаете... Интерьер нашего офиса отличается от того, что в Обществе Пандемониума, так что... даже не знаю."
70015030-243 = "Хм, вы правы. Теперь, когда я подумала, он, пожалуй, сюда не впишется. Прошу прощения, надо было проявить больше такта."
70015030-244 = "П-погодите, а настаивать вы не будете?"
70015030-246 = ""
70015030-247 = "..."
70015030-248 = "..."
70015030-249 = "Ониката Каёко... Давно не виделись. Ки-хе-хе."
70015030-250 = ""
70015030-252 = ""
70015030-253 = "Да... Похоже, у тебя всё хорошо."
70015030-254 = "Естественно. Как лидер Геенны, я несу тяжёлое бремя ответственности и долга. Ки-хе."
70015030-255 = "...Ты совершенно не изменилась."
70015030-256 = "Хмф. Побег Ибуки оказался настолько серьёзным происшествием, что сегодня пришлось поднять на ноги всё Общество Пандемониума..."
70015030-257 = "Но раз уж выпал такой редкий случай, я хотела бы с тобой поговорить."
70015030-258 = "..."
70015030-259 = "Что ты сейчас думаешь об Обществе Пандемониума? Не тянет ли тебя обратно к месту, которое по праву должно было принадлежать тебе?"
70015030-260 = "...Я слышала, что после прежнего студсовета тебе удалось многое изменить к лучшему."
70015030-261 = "Пока я здесь, так и будет."
70015030-262 = "Рада слышать это."
70015030-263 = "Я просто обычный студент. Моё мнение ничего не решает."
70015030-264 = "Ты председатель Общества Пандемониума, и можешь строить Геенну такой, какой пожелаешь."
70015030-265 = "...Ке-ке-ке. Понятно. Значит, вот как."
70015030-266 = "К тому же моё место здесь."
70015030-267 = "Здесь у меня крутой босс, которая за суровым видом скрывает доброту, надёжный управляющий, оживляющий всё своими шутками, и сотрудник, из-за которого постоянно переживаешь, но на которого невозможно сердиться..."
70015030-268 = "Здесь царит хаос, и жизнь непростая, но «Проблема 68» — моё место. Дом, который я выбрала сама."
70015030-269 = "...Хорошо."
70015030-270 = "Мне этого достаточно. Ки-хе-хе."
70015030-271 = "Ага."
70015030-272 = ""
70015030-273 = "А, кстати! Может, сфотографируемся все вместе с Ибуки?"
70015030-274 = "А?! Ф-фотографироваться?"
70015030-275 = "Да! Ведь сама судьба свела нас вместе! Как думаешь, Ибуки?"
70015030-276 = "Ага! Ибуки хочет сфотографироваться со всеми!"
70015030-277 = "Ку-фу-фу, весело будет! Иди сюда, Каёко! Ты тоже в кадре!"
70015030-278 = "...Ух."
70015030-280 = "Так, все сюда! Встаньте вот здесь!"
70015030-281 = "В-вот так? Здесь?"
70015030-282 = "Отлично, начинаем! Сейчас вылетит птичка!"
70015030-283 = "Улыбаемся пошире! Сы-ы-ыр!"
70015030-284 = ""
70015030-291 = "Хех... На этот раз мы у вас в долгу, «Проблема 68»."
70015030-292 = "Не забывайте, я буду за вами присматривать."
70015030-293 = "Ух... Вот это ответственность..."
70015030-294 = "Ну а теперь!"
70015030-295 = ""
70015030-297 = ""
70015030-298 = ""
70015030-299 = "Всем до свидания!"
70015030-300 = "Пришлю вам нашу фотографию, как только она будет готова!"
70015030-301 = "Пока-пока, все! Спасибо вам за всё! Скоро снова поиграем! Обещаю!"
70015030-302 = "М-мне было очень весело... До встречи, Ибуки."
70015030-303 = "Приходи к нам ещё! Ку-фу-фу."
70015030-304 = ""
70015030-306 = ""
70015030-307 = ""
70015030-308 = "..."
70015030-309 = "...Ты хочешь что-то сказать?"
70015030-310 = "Да. Я не была уверена, стоит ли об этом говорить, но..."
70015030-311 = "Решила, что тебе лучше знать."
70015030-312 = "Ты ведь не о том, что..."
70015030-313 = ""
70015030-315 = ""
70015030-316 = "...Мы заметили активность «Шторма»."
70015030-317 = "...!!"
70015030-318 = "Я говорю тебе об этом, потому что теперь у тебя нет прежнего доступа к разведданным. Ты должна знать. Не отмахивайся."
70015030-319 = "...Не стану. Спасибо."
70015030-320 = "И... будь осторожна. Я не хочу, чтобы кому-то из нас снова пришлось пережить то, что случилось тогда."
70015030-321 = "Знаю. Я тоже. ...Береги себя."
70015030-322 = "Ха. И ты тоже."
70015030-323 = "До встречи."
70015030-324 = ""
70015030-326 = ""
70015030-327 = "..."
70015030-328 = ""
70015030-329 = "Кхе-кхе! К-какая горечь!"
70015030-330 = "Ару, ты чего вдруг взялась пить чёрный кофе? Ку-фу-фу!"
70015030-331 = "Б-босс...! В-вы в порядке?! Э-это всё из-за кофе?! Может, мне его пристрелить?!"
70015030-332 = "..."
70015030-333 = "Ха-ха."
70015030-335 = "Босс, вот. Запейте молоком."
70015030-336 = "Фу-у, бе-е!"
70015030-337 = "Побег Ибуки"
