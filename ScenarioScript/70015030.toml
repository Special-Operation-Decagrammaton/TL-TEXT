[translation]
70015030-1 = "Ibuki's Runaway Incident (3)"
70015030-5 = "W-welcome. This is our office... I'll go get some tea."
70015030-6 = "Yes. A lovely way to serve it, isn't it?"
70015030-10 = "That second part is something the person receiving the tea says."
70015030-18 = "Wow! So cool!!"
70015030-22 = "Hehe, do you like it... Ibuki...?"
70015030-23 = "Yeah! It feels like a place where adults do their work!"
70015030-27 = "W-well, yes! I suppose it is!"
70015030-28 = "(I'm so glad I managed to pay the rent this month... If I hadn't, I might've had to show her a tent...)"
70015030-32 = "...We've met a few times outside, but this is my first time coming here."
70015030-33 = "That's true. #n...To be honest, I never wanted a situation where you'd have to come here, Ako."
70015030-34 = "Yes, I agree. The feeling is mutual."
70015030-35 = "Hmph."
70015030-36 = "But, since the situation has arrived... please, make yourself at home."
70015030-37 = "..."
70015030-38 = "So this is the place you found for yourself."
70015030-42 = "...Yeah."
70015030-43 = "...What do you think?"
70015030-44 = "...It's cramped, and it's so cluttered that it's distracting, but..."
70015030-45 = "Well, it's not bad."
70015030-46 = "...I see."
70015030-50 = "Big sister! Ibuki wants to try reading this!"
70015030-51 = "O-oh. It's a bit difficult, but do you think you can read it?"
70015030-52 = "Yeah! O-one... one evil a day, right?"
70015030-53 = "Y-you got it right..."
70015030-54 = "What does that mean?"
70015030-55 = "W-well, that is...!"
70015030-56 = "Aru-chan, you aren't actually going to teach that to a child, are you?"
70015030-57 = "Ugh...!"
70015030-58 = "Hmm? Ibuki is still a kid, but I know lots of things!"
70015030-59 = "Kufufu, is that so? Then, I guess it's fine if Aru-chan... our President, teaches you."
70015030-60 = "Yeah! Teach me, Big Sister Aru!"
70015030-61 = "U-uhm... well, this is..."
70015030-62 = "...It means... to do one bad thing every day..."
70015030-63 = "..."
70015030-64 = "It's the motto of our Problem Solver 68! #nWe are hard-boiled outlaws who fear nothing and are bound by nothing...!"
70015030-65 = "(I-I said it! What if I scared her...!?)"
70015030-69 = "Hmm?"
70015030-70 = "S-so, we're villains! We're very scary people!"
70015030-71 = "You guys aren't villains, though?"
70015030-76 = "Everyone is super kind!"
70015030-77 = "You played with Ibuki when I was lonely and all by myself..."
70015030-78 = "Uhm, well, that's..."
70015030-79 = "You bought me lots of snacks, and let me ride on the seesaw and the swings."
70015030-80 = "You even held my hand, right?"
70015030-81 = "..."
70015030-82 = "Yeah! You guys definitely aren't villains!"
70015030-83 = "Kufufu. See, Aru-chan?"
70015030-84 = "Grrr..."
70015030-85 = "...It's true that they've become better than they used to be."
70015030-86 = "...!"
70015030-87 = "They're troublemakers, and we do clash with them sometimes, but..."
70015030-88 = "I believe they are people who won't cross the line."
70015030-89 = "I-it's complicated to hear that, but..."
70015030-90 = "Wait? Does that mean you're not going to arrest us anymore?"
70015030-91 = "Don't be ridiculous. If you cross the line, you'll be arrested immediately."
70015030-92 = "Aww."
70015030-94 = "Ah! Ibuki is good at this! Haruka-oneechan, let's play together?"
70015030-95 = "A balance game? ...Sure, I'd love to, ehehe."
70015030-101 = "Phew... Uhm... You're a guest, so please, make yourself comfortable."
70015030-102 = "Would you like something to drink?"
70015030-103 = "Thank you. I'll have a coffee, then."
70015030-104 = "With sugar and milk?"
70015030-105 = "? No, black is fine, thank you."
70015030-106 = "Oh? Oh, I see..."
70015030-107 = "No sugar or milk...!? #nTo drink something that bitter just like that... h-how cool...!"
70015030-109 = "(Time passes...)"
70015030-112 = "Yay! Ibuki wins this time!!"
70015030-113 = "Y-you're amazing, Ibuki. Would you like to try another game?"
70015030-114 = "Yeah!"
70015030-119 = "...It's strangely healing."
70015030-120 = "B-by the way, is it really okay for Ibuki to stay here? #nI'm sure Pandemonium Society is looking for her..."
70015030-124 = "In that case, they should be arriving any moment now."
70015030-125 = "W-what? What do you mean?"
70015030-126 = "I told them where Ibuki-chan was a little while ago, so..."
70015030-127 = "T-to who!?"
70015030-128 = "To the Pandemonium Society, of course."
70015030-129 = "W-what did you say!?"
70015030-130 = "Isn't this a little bit bad?"
70015030-131 = "W-what do you mean by exposing our address without asking us!? #nAnd to the Pandemonium Society, of all people...!"
70015030-132 = "Exposing it? ...They've known about this place for a long time, you know?"
70015030-133 = "Huh?"
70015030-134 = "The Prefect Team and the Pandemonium Society... they're both well aware of it."
70015030-135 = "It's not like you're operating in secret, after all."
70015030-136 = "Ah."
70015030-137 = "Now that you mention it, that's true...?"
70015030-138 = "We aren't an officially recognized club, but we are registered as a business."
70015030-139 = "N-no! That's completely different! Besides, if the Pandemonium Society is coming here, that means...!"
70015030-144 = "IBUKIIII!!"
70015030-152 = "IBUKIIII!!!"
70015030-153 = "M-Makoto-senpai!"
70015030-154 = "Ibuki! I was wrong! I beg of you!! Please forgive me!!!"
70015030-155 = "Makoto-senpai... a-are you okay...?"
70015030-156 = "Whoa, what a face."
70015030-157 = "Chairman Makoto...!"
70015030-158 = "A-Aru-sama! W-what should we do...!? S-should we kill them after all?"
70015030-159 = "C-calm down, Haruka!"
70015030-169 = "Pardon the intrusion."
70015030-170 = "Nice to meet you, everyone at Problem Solver 68! We heard Ibuki-chan was here, so we came!"
70015030-171 = "...Excuse me."
70015030-172 = "The entire executive board of the Pandemonium Society..."
70015030-177 = "A-Aru-sama~!!"
70015030-178 = "Aru-chan! Deep breaths, deep breaths!!"
70015030-180 = "I-Ibuki... I was truly wrong... I'll never do it again..."
70015030-181 = "...Really?"
70015030-182 = "Yes! Really!"
70015030-183 = "Then, promise me you won't just eat my pudding... #nbut that you won't eat everyone else's pudding without asking either."
70015030-184 = "Guh! T-that is..."
70015030-185 = "...Understood. I promise."
70015030-189 = "Okay, pinky swear~"
70015030-190 = "...Hmph. If you break your promise, you'll have to swallow a thousand needles."
70015030-191 = "Yeah! Ehehe."
70015030-192 = "I forgive you, Makoto-senpai."
70015030-196 = "R-really...!? Ah, what a heart as vast as the ocean...!"
70015030-197 = "Now, let's return to the Pandemonium Society. I bought 10 puddings as an apology, after all."
70015030-198 = "Wow~! Oh, but... I have to say goodbye to the big sisters."
70015030-199 = "B-big sisters, you say...?"
70015030-200 = "Yeah! They played with Ibuki and bought me snacks!"
70015030-205 = "Hmph, Problem Solver 68, is it..."
70015030-206 = "D-do you know who we are?"
70015030-207 = "Kishishi... Obviously. Rikuhachima Aru. #nYou lot are persons of interest, after all."
70015030-208 = "You even know our names...!"
70015030-209 = "However..."
70015030-210 = "This Hanuma Makoto-sama has no intention of bossing you around."
70015030-211 = "Huh...?"
70015030-212 = "What you are doing is also a form of freedom."
70015030-213 = "Regardless of your academic status, students should be encouraged to pursue their own dreams."
70015030-214 = "...!!"
70015030-215 = "Aru-chan, what does this mean...?"
70015030-216 = "And if you possess unique business acumen on top of that, there's nothing more to say."
70015030-217 = "This generous Makoto-sama will overlook minor illegal activities. Kishishi."
70015030-218 = "We in the Pandemonium Society are different from that stubborn Prefect Team!"
70015030-219 = "Huh? We went out of our way to help you, and this is how ungrateful you are!"
70015030-220 = "Makoto-senpai! Ako-senpai came all the way here to look for Ibuki~!"
70015030-221 = "...Come to think of it, it was Administrative Officer Amau Ako who told me where Ibuki was..."
70015030-222 = "..."
70015030-223 = "..."
70015030-224 = "Forget what I just said!"
70015030-225 = "How could we possibly forget that!?"
70015030-228 = "Thank you... so very much for everything."
70015030-229 = "N-no... I only did what was expected."
70015030-230 = "You don't have to be so humble. #nIbuki-chan is a precious underclassman to us, so it's only natural that we'd be grateful."
70015030-231 = "Kufufu, then I'll accept your gratitude without hesitation~!"
70015030-235 = "This desk... it looks a bit old. Would you like us to give you one we use at the Pandemonium Society?"
70015030-236 = "E-eh? Really?"
70015030-237 = "It's a desk made of solid wood, but let me know if it's not your style."
70015030-238 = "(It wouldn't look cool to accept it right away... I should decline at least once...)"
70015030-242 = "Hmm, I'm not sure. This office is very particular about its interior design—"
70015030-243 = "I see, that's fair. My apologies."
70015030-244 = "O-oh, wait?"
70015030-247 = "..."
70015030-248 = "..."
70015030-249 = "It's been a while... Onikata Kayoko."
70015030-253 = "...Glad to see you're doing well."
70015030-254 = "Naturally. As the head of Gehenna, I carry heavy responsibilities and a mission. Kishishi."
70015030-255 = "You haven't changed a bit, have you."
70015030-256 = "Hmph. I came here unexpectedly today because of Ibuki, but..."
70015030-257 = "Now that we've met in person, there's one thing I want to ask."
70015030-258 = "..."
70015030-259 = "Why didn't you come to the Pandemonium Society? You should have belonged there, originally."
70015030-260 = "...It sounds like it's completely different from the previous student council."
70015030-261 = "Of course. As long as I, Makoto-sama, am here, it will never be like the old days."
70015030-262 = "...Then that's fine."
70015030-263 = "I'm an outsider now, so my opinion shouldn't matter to you."
70015030-264 = "You're the Chairman of the Pandemonium Society, and you're the one building the future of Gehenna."
70015030-265 = "Kiki, I see... I suppose so."
70015030-266 = "Besides, this is where I belong."
70015030-267 = "A president who aims to be hard-boiled but is a natural-born pushover, a chief who loves pranks but #ngets things done when it counts, and a staff member who makes me worry sometimes but is delicate and pure..."
70015030-268 = "This Problem Solver 68, where everyone is... this is where I belong."
70015030-269 = "...Hmm."
70015030-270 = "That's fine, then. Kishishi."
70015030-271 = "Yeah."
70015030-273 = "Oh, that's right. Everyone, why don't we take a picture with Ibuki-chan?"
70015030-274 = "Ehh!? A-a picture...?"
70015030-275 = "Yes! It's a special occasion, after all! What do you think, Ibuki-chan?"
70015030-276 = "Yeah! Ibuki wants to take a picture with the big sisters too~!!"
70015030-277 = "Kufufu, sounds fun~! Come on, Kayoko-chan, hurry up~!"
70015030-278 = "...Yeah."
70015030-280 = "Alright! Please stand over here!"
70015030-281 = "I-is here okay?"
70015030-282 = "Taking it now~!"
70015030-283 = "Say cheese!"
70015030-291 = "...I'm in your debt this time, Problem Solver 68."
70015030-292 = "Kiki, don't forget that I, Makoto-sama, am keeping an eye on you!"
70015030-293 = "Ugh..."
70015030-294 = "Now, let's go!"
70015030-299 = "Pardon the intrusion."
70015030-300 = "I'll send the photo later~!"
70015030-301 = "Thank you, big sisters! Let's definitely play again!"
70015030-302 = "I-I had fun too... Let's meet again, Ibuki!"
70015030-303 = "See ya~! Kufufu."
70015030-308 = "..."
70015030-309 = "...You look like you have something to say."
70015030-310 = "Yes..."
70015030-311 = "I thought it would be best to let you know this much."
70015030-312 = "...Don't tell me."
70015030-316 = "...Movements of the 'Storm' have been confirmed."
70015030-317 = "...!!"
70015030-318 = "You are currently in a position where it's difficult to gather this kind of information."
70015030-319 = "...Yeah, thank you."
70015030-320 = "...Please be careful. I don't want to go through what happened in the past again."
70015030-321 = "Me neither. ...You be careful too, Ako."
70015030-322 = "Hmph, we're both in the same boat."
70015030-323 = "Until next time."
70015030-327 = "............"
70015030-329 = "Ugh... *cough*, *cough*! I-it really is bitter!!"
70015030-330 = "What's wrong, Aru-chan? Drinking black coffee all of a sudden."
70015030-331 = "A-Aru-sama...! Are you okay!? #nThis coffee is the culprit! Should I shoot it!?"
70015030-332 = "..."
70015030-333 = "Fufu."
70015030-335 = "President, drink some milk and calm down."
70015030-336 = "Uuu...!"
70015030-337 = "Ibuki's Runaway Incident"