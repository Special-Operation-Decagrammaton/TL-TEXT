[translation]
70015030-1 = "The Ibuki Runaway Incident (3)"
70015030-5 = "W-Welcome. This is our office... I'll get you some tea."
70015030-6 = "Here you go. My tea serving skills are quite fine."
70015030-10 = "The person receiving the tea should be the one to say that."
70015030-18 = "Wooow! So cool!!"
70015030-22 = "Hehe, Ibuki... It seems you like this place..."
70015030-23 = "Yeah! It feels like somewhere adults work!"
70015030-27 = "Y-Yeah! That's exactly right!"
70015030-28 = "(Thank goodness I paid the rent last month... Otherwise, we'd be stuck showing#nher a tent instead...)"
70015030-32 = "...I've passed by this place multiple times, but this is the first time I've ever been#ninside it."
70015030-33 = "That's right. #n…To be honest, I was hoping that you would never have to come here."
70015030-34 = "Indeed. The feeling is mutual."
70015030-35 = "Hmph."
70015030-36 = "But, I suppose now that you're here… I hope you'll enjoy your time here."
70015030-37 = "…."
70015030-38 = "So this is the place you've found for yourself."
70015030-42 = "…Yeah."
70015030-43 = "…What do you think?"
70015030-44 = "…Cramped, messy, and distracting..."
70015030-45 = "But, It's not so bad."
70015030-46 = "...I see."
70015030-50 = "Onee-chan! Ibuki's going to try reading this!"
70015030-51 = "S-Sure. But it's a little hard to read. Do you think you can do it?"
70015030-52 = "Yeah! One evil... One evil deed a day, is that right?"
70015030-53 = "Th-that's correct..."
70015030-54 = "What does that mean?"
70015030-55 = "W-Well...!"
70015030-56 = "Aru-chan, no way you're actually gonna teach a kid this, riiiight?"
70015030-57 = "Urk...!"
70015030-58 = "Huh? Ibuki might be small, but she knows many things!"
70015030-59 = "Kufufuh, is that so? Then it'll be fine if Aru-cha... our boss explains it to you."
70015030-60 = "Yeah! Please teach me, Aru Onee-chan!"
70015030-61 = "U-umm... Well, you see..."
70015030-62 = "...You do a single bad thing every single day... That's what it means..."
70015030-63 = "..."
70015030-64 = "That's our motto as Problem Solver 68! #nWe are hardboiled outlaws without fear, beholden to none...!"
70015030-65 = "(I-I actually said it! I hope she doesn't get scared after this...!)"
70015030-69 = "Huh?"
70015030-70 = "B-Basically, we are villains! We're very scary people!"
70015030-71 = "You aren't villains?"
70015030-76 = "You're all too nice for that!"
70015030-77 = "When Ibuki was feeling all alone, you played with her..."
70015030-78 = "Umm, that's..."
70015030-79 = "You also bought Ibuki lots of candy, and we rode the seesaw and swings together#ntoo."
70015030-80 = "You even held hands with Ibuki."
70015030-81 = "..."
70015030-82 = "Yep! Looks like we aren't villains after all!"
70015030-83 = "Kufufuh. Right, Aru-chan?"
70015030-84 = "Grrr..."
70015030-85 = "...Certainly, you've all been a lot more well-behaved these days."
70015030-86 = "...!"
70015030-87 = "As troublemakers, we've certainly clashed a number of times before..."
70015030-88 = "However, I believe you're also individuals who know when to not cross the line."
70015030-89 = "Y-You're giving me very mixed signals by saying that..."
70015030-90 = "Wait? So does that mean you're not trying to arrest us anymore?"
70015030-91 = "Dream on. Cross the line and I'm throwing you all straight to prison."
70015030-92 = "Booo."
70015030-94 = "Ah! Ibuki's good at this! Haruka Onee-chan, do you want to play together?"
70015030-95 = "This balance game? ...Sure thing. Eheheh."
70015030-101 = "Phew... I suppose since you're also a guest here, you should make yourself#ncomfortable."
70015030-102 = "Would you like something to drink?"
70015030-103 = "Thank you. I'll have a coffee then."
70015030-104 = "Sugar and milk?"
70015030-105 = "? No, I'll have it black, thank you."
70015030-106 = "Huh? S-Sure, understood..."
70015030-107 = "No sugar nor milk...!? #nShe's drinking something that bitter straight...? Th-that's so metal...!"
70015030-109 = "(After some time...)"
70015030-112 = "Yippie! Ibuki wins this time!!"
70015030-113 = "G-Good game, Ibuki. Would you like to try using different rules?"
70015030-114 = "Yeah!"
70015030-119 = "...This is surprisingly quite relaxing."
70015030-120 = "B-By the way, is it all right to be keeping Ibuki here? #nI thought the Pandemonium Society was searching for her..."
70015030-124 = "If that's what you're asking, then they should be almost here."
70015030-125 = "Huh? Who's almost where?"
70015030-126 = "I let them know where Ibuki's whereabouts were, so they should be arriving soon."
70015030-127 = "Wh-who is!?"
70015030-128 = "The Pandemonium Society. Who else?"
70015030-129 = "Y-You did what!?"
70015030-130 = "Isn't this kinda bad?"
70015030-131 = "Y-You could've at least asked before leaking our address! #nTo the Pandemonium Society, no less!"
70015030-132 = "Leaking, you say... They've already known about this place for ages."
70015030-133 = "Huh?"
70015030-134 = "The Prefect Team and Pandemonium Society both... We're well aware of these#nsorts of things."
70015030-135 = "You haven't exactly been operating in secret, after all."
70015030-136 = "Ah."
70015030-137 = "Now that you mention it, that is true...?"
70015030-138 = "We may not have received approval as a club, but we did register as business."
70015030-139 = "N-no! These are completely different matters! Actually, if the Pandemonium#nSociety's coming, then that means...!"
70015030-144 = "IBUKII!!"
70015030-152 = "IBUKIII!!!"
70015030-153 = "M-Makoto-senpai!"
70015030-154 = "Ibuki! I was wrong! I'm begging you! Forgive meee!!"
70015030-155 = "Makoto-senpai... A-are you okay...?"
70015030-156 = "Wow, what a face."
70015030-157 = "Chairman Makoto...!"
70015030-158 = "A...Aru-sama! Wh-what should we do...!? M-Maybe I should kill them?"
70015030-159 = "C-Calm down, Haruka!"
70015030-169 = "Pardon the intrusion."
70015030-170 = "Nice to meet you, Problem Solver 68! We heard Ibuki-chan was here, so we've#ncome to check it out!"
70015030-171 = "...Excuse me."
70015030-172 = "All of the Pandemonium Society's big shots are here..."
70015030-177 = "A...Aru-samaaaa!!"
70015030-178 = "Deep breaths, Aru-chan! Deep breaths!!"
70015030-180 = "I-Ibuki... This was entirely my fault... I promise to not do it again..."
70015030-181 = "...Really?"
70015030-182 = "Yes! Really!"
70015030-183 = "Then promise that you won't only not eat Ibuki's pudding... #nPromise that you won't eat anyone's pudding without asking."
70015030-184 = "Guh! Th-that would be..."
70015030-185 = "...Very well. I promise."
70015030-189 = "Okay, pinky-promise! Cross my heart aaand!"
70015030-190 = "...Hmph. And hope to die."
70015030-191 = "Yay! Ehehe."
70015030-192 = "I forgive you, Makoto-senpai."
70015030-196 = "R-Really...!? Ahh, your heart truly is as vast as the ocean itself!"
70015030-197 = "Then let us return to the Pandemonium Society. I have bought you ten puddings#nas my apology."
70015030-198 = "Yaaay! Ah, but... Ibuki has to say goodbye to the Onee-chans here first."
70015030-199 = "The O...Onee-chans...?"
70015030-200 = "Yeah! They played with Ibuki and even bought her candy!"
70015030-205 = "Hmph, so you four are Problem Solver 68..."
70015030-206 = "Y-You know about us?"
70015030-207 = "Kishishi... That's only natural, Rikuhachima Aru. #nYou lot are all individuals of interest."
70015030-208 = "Y-You even know my name...!"
70015030-209 = "However..."
70015030-210 = "I, the great Hanuma Makoto, have no intention to control you."
70015030-211 = "Huh...?"
70015030-212 = "What you lot do is but a form of freedom."
70015030-213 = "Regardless of your enrollment status, students ought to be encourged to pursue#ntheir own dreams."
70015030-214 = "...!!"
70015030-215 = "Aru-chan, does that mean...?"
70015030-216 = "Furthermore, with your capabilities as an independent business, there is nothing more to be said."
70015030-217 = "The great and magnanimous Makoto is willing to overlook a few minor illegalities. Kishishi."
70015030-218 = "We of the Pandemonium Society are nothing like the hardheaded fools of the#nPrefect Team!"
70015030-219 = "Excuse me? We went out of our way to help you and this is how you repay us?#nThere's a limit to how ungrateful you can be!"
70015030-220 = "Makoto-senpai! Ako-senpai came all the way out here to find Ibuki!"
70015030-221 = "...Come to think of it, the one who informed us of Ibuki's whereabouts was Senior Administrator Amau Ako as well... #n"
70015030-222 = "..."
70015030-223 = "..."
70015030-224 = "Forget what I just said!"
70015030-225 = "How do you expect me to just forget that!?"
70015030-228 = "My deepest gratitude for your help in this matter."
70015030-229 = "N-No... We just did what anyone else would've done."
70015030-230 = "There's no need to be so humble. #nIbuki-chan is our precious kouhai, so it's only natural for us to thank you over this."
70015030-231 = "Kufufuh. Then we'll accept your thanks without holding back!"
70015030-235 = "This desk is quite old. If you'd like, we could give you one of ours."
70015030-236 = "H-Huh? Really?"
70015030-237 = "It's made of raw timber though, so let me know if that's not to your liking."
70015030-238 = "(It'd be pretty uncool to accept immediately... I'll turn down the offer once first...)"
70015030-242 = "Hmmm, I wonder. We're quite particular with the interior design of this office, so..."
70015030-243 = "I thought so. I apologize for bringing this up then."
70015030-244 = "W-What?"
70015030-247 = "..."
70015030-248 = "..."
70015030-249 = "It has been a while... Onikata Kayoko."
70015030-253 = "...Good to see you're doing well."
70015030-254 = "Naturally. Being the head of Gehenna comes with heavy responsibilities and#nobligations. Kishishi."
70015030-255 = "You're still the same as always."
70015030-256 = "Hmph. It was by pure coincidence that I ended up here today because of the whole#nsituation with Ibuki..."
70015030-257 = "However, now that we stand face to face, I have a question I must ask."
70015030-258 = "..."
70015030-259 = "Why did you not join the Pandemonium Society? This should have been where you#nbelonged."
70015030-260 = "...It seems to be completely different from the last student council."
70015030-261 = "Naturally it is. So long as the great Makoto remains, the academy shall not fall#nback to its former ways."
70015030-262 = "...That's all I wanted to hear."
70015030-263 = "I am just an outsider now. What I say no longer matters."
70015030-264 = "You are the chairman of the Pandemonium Society; Gehenna should be yours to make."
70015030-265 = "Keke, I see... You are correct."
70015030-266 = "Besides, this is where I belong."
70015030-267 = "I've got a boss that wants to be hardboiled but is too good of a person by nature,#na chief of staff that loves pranks but knows when to get down to business,#nand a senior member who I worry about sometimes but is also delicate and pure..."
70015030-268 = "With such company... Problem Solver 68 is a place I can call home."
70015030-269 = "...Hm."
70015030-270 = "I can accept that. Kishishi."
70015030-271 = "Yeah."
70015030-273 = "Ah, right. Would everyone like to take a picture with Ibuki-chan?"
70015030-274 = "Ehh!? A... a picture?"
70015030-275 = "Yeah! It must be fate that we've all gathered here! Ibuki-chan, what do you think?"
70015030-276 = "Mhm! Ibuki wants to take a picture with her Onee-chans as well!!"
70015030-277 = "Kufufuh, sounds like fun! Kayoko-chan, hurry up and c'mere!"
70015030-278 = "...Sure."
70015030-280 = "Okay! Stand over here for me please!"
70015030-281 = "I-is this spot fine?"
70015030-282 = "Alright, I'm taking the picture!"
70015030-283 = "Everyone say cheese!"
70015030-291 = "...Thank you for your help this time, Problem Solver 68."
70015030-292 = "Keke. But do not forget that the great Makoto will always be watching you!"
70015030-293 = "Urk..."
70015030-294 = "Let us depart!"
70015030-299 = "Sorry for bothering you."
70015030-300 = "I'll send you all the pictures later!"
70015030-301 = "Thank you, Onee-chans! I'll come over to play again someday! For sure!"
70015030-302 = "I-I had fun too... Let's meet again someday, Ibuki!"
70015030-303 = "Bye bye! Kufufuh!"
70015030-308 = "..."
70015030-309 = "...It seems like you have something to say."
70015030-310 = "Indeed..."
70015030-311 = "I think it would be wise to let you know this."
70015030-312 = "...It can't be."
70015030-316 = "We've confirmed that the \"Storm\" is on the move."
70015030-317 = "...!!"
70015030-318 = "I'm telling you this because you're currently in a position where gathering intel is difficult."
70015030-319 = "...Yeah. Thanks for that."
70015030-320 = "...Watch yourself out there. I don't want a repeat of what happened in the past."
70015030-321 = "Neither do I... You stay safe out there as well, Ako."
70015030-322 = "Heh. The same goes both ways."
70015030-323 = "Now then, until next time."
70015030-327 = "..."
70015030-329 = "Urgh... Cough, cough! I-It's just as bitter as I thought!"
70015030-330 = "What's wrong, Aru-chan? Why'd you suddenly decide to drink black coffee?"
70015030-331 = "A-Aru-sama...! Are you all right!? #nIt's all because of this coffee, isn't it!? Should I shoot it!?"
70015030-332 = "..."
70015030-333 = "Heheh."
70015030-335 = "Boss, why don't you have some milk and calm down."
70015030-336 = "Urgh...!"
70015030-337 = "The Ibuki Runaway Incident"