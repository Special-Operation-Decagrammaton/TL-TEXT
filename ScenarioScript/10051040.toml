[translation]
10051040-1 = "Эпизод 4;Ниндзя и вор"
10051040-2 = "Банкетный зал модного показа"
10051040-3 = ""
10051040-4 = "Ля-ля."
10051040-5 = "Ля-ля-ля."
10051040-6 = "(Я так нервничала... а делать почти нечего...)"
10051040-7 = "(Все милые и добрые, никаких проблем... Просто едят закуски и нахваливают друг друга.)"
10051040-8 = "(Может, просто поболтать с девочками по связи?)"
10051040-9 = "(Можно обсудить что-нибудь вроде... «Какие основные принципы должен соблюдать ниндзя во время скучного внедрения?»)"
10051040-10 = "(«Чтобы оставаться незаметным, лучше взять онигири или сухпаёк?»)"
10051040-11 = "(Что-то такое, наверное...? Звучит... по-ниндзя, да?)"
10051040-12 = "[s] «О, вот ты где, Мичиру!»"
10051040-13 = "Ааа! В-Вы меня напугали!"
10051040-14 = "Сенсей? Достопочтенный Сенсей, вы тоже здесь?"
10051040-15 = "Стойте, вы же не пришли сюда... ПОДГЛЯДЫВАТЬ, как в прошлый раз?"
10051040-16 = "[s] «Конечно нет!»"
10051040-17 = "Тогда наверняка... вы пришли сюда дебютировать в качестве модели!"
10051040-18 = "Ого! Достопочтенный Сенсей, вы и правда невероятны!"
10051040-19 = "[s] «Нет, меня просто пригласили!»"
10051040-20 = "А, вот и всё? Эх, какая скучная причина."
10051040-21 = "А я уже надеялась увидеть, как вы вышагиваете по подиуму."
10051040-22 = "[s] «Не думаю, что это для меня...»"
10051040-23 = "Хм? Значит, Сенсей не считает себя моделью..."
10051040-24 = "Тогда, естественно, Сенсей должен хотеть заняться ниндзюцу!"
10051040-25 = "[s] «Как ты вообще пришла к такому выводу?!»"
10051040-26 = "Ня-ха-ха! В любом случае, достопочтенный Сенсей, рада вас видеть."
10051040-27 = "...Потому что я как раз изнывала от невыносимой скуки."
10051040-28 = "Я даже фантазировала о том, чтобы устроить засаду случайным прохожим!"
10051040-29 = "[s] «И этим, по-твоему, должен заниматься ниндзя?!»"
10051040-30 = "Хотя одна засада до официального представления допускается..."
10051040-31 = "...очевидно, здесь мне этого делать не стоит."
10051040-32 = "Так что, если честно, я просто бесцельно бродила."
10051040-33 = "Может, дело в том, что это официальное мероприятие, но похоже, ничего не произойдёт."
10051040-34 = "[s] «Не сглазь такими словами...»"
10051040-35 = "А? Достопочтенный Сенсей, вы правда верите в такие вещи?"
10051040-36 = "Даже если здесь что-то случится, уверена, ничего серьё—"
10051040-38 = "Бип! Бип! Бип!"
10051040-40 = ""
10051040-41 = "Э."
10051040-42 = "Ээээээ?!"
10051040-43 = "Это сигнал тревоги?!"
10051040-44 = "Секретный скрытный отряд ниндзя под прикрытием, приём?"
10051040-45 = "«Сверкающий сюрикен», на связи!"
10051040-46 = "Слушайте внимательно. Фирменная работа Шайнкэт пропала! Её украли!"
10051040-47 = "Если так оставить, наш показ обречён!"
10051040-48 = "При всём уважении к другим дизайнерам, люди НА САМОМ ДЕЛЕ пришли посмотреть на захватывающий дизайн Шайнкэт! Каждая его работа — незаменимое произведение искусства, вы меня понимаете?!"
10051040-49 = "И-и-и!!"
10051040-50 = "Если судить по времени, ясно, что преступление произошло буквально ТОЛЬКО ЧТО. Виновник, скорее всего, всё ещё в здании!"
10051040-51 = "Т-Тогда что мне делать...?"
10051040-52 = "Что значит «что»?! Задержать вора! Как думаешь, зачем мы вас наняли?!"
10051040-53 = "В-Вы правы, но...!"
10051040-54 = "Схватите его любой ценой! Поняла?"
10051040-55 = "П-Подождите! Есть хоть какие-то зацепки? Как он выглядит?"
10051040-57 = "Если бы я знала, как он выглядит, он уже БЫЛ бы у меня! А теперь идите и принесите мне результат!"
10051040-58 = "Да! Поняла."
10051040-59 = "Т-Тогда мы займёмся этим!"
10051040-60 = ""
10051040-62 = ""
10051040-63 = "*выдыхает*"
10051040-64 = "Вы были правы, достопочтенный Сенсей... Сглазила. Что нам делать?"
10051040-65 = "А...? Достопочтенный Сенсей, вы тоже поможете?"
10051040-66 = "Фух..."
10051040-67 = "Фу... Фу-фу..."
10051040-68 = "Т-Тогда сомнений быть не может! Нам остаётся лишь показать всем истинную силу ниндзя!"
10051040-69 = "«Кружащаяся кукла»! «Ожидающая беседка»! Доклад!"
10051040-70 = "«Кружащаяся кукла», к службе готова! Нин-нин!"
10051040-71 = "«Ожидающая беседка». Я... здесь! И... жду."
10051040-72 = "Вы ведь все слышали новости, да? Теперь наш главный приоритет — поймать вора!"
10051040-73 = "Да, мы не знаем, как он выглядит. Но это нас не остановит! Мы предадим его правосудию и спасём показ!"
10051040-74 = "Вы и сами знаете правило! Ниндзя...!"
10051040-75 = "...никогда не сдаётся!"
10051040-76 = "Н-Невзирая на трудности!"
10051040-77 = ""
10051040-79 = ""
10051040-80 = "Именно! Выдвигаемся!"
10051040-82 = "Сад скульптур у места проведения модного показа"
10051040-84 = ""
10051040-85 = ""
10051040-86 = "Чисто."
10051040-87 = "И это было так легко. Всего-то нужно было притвориться доставщиком, и... я проскользнула внутрь."
10051040-88 = "И всё же... Почему Шайнкэт сегодня явился так модно рано? Я едва не столкнулась с ним и его великолепно ухоженными коготками."
10051040-89 = "Ну... По крайней мере, я спасла эту вещь. Со мной она будет в безопасности."
10051040-90 = "И я сама буду в безопасности, пока прячусь в этой густой растительности."
10051040-91 = "Ах, только посмотрите на неё! Вдохните аромат! Работа Шайнкэт — абсолютное совершенство."
10051040-92 = ""
10051040-93 = "Ах, Шайнкэт. Свет моей жизни, уголёк моей души...!"
10051040-94 = "Единственная в своём роде работа, созданная самым гениальным умом Кивотоса."
10051040-95 = "И всё же одежду создают, чтобы её носили, а значит — оскверняли..."
10051040-96 = "Трагедия, что подобное произведение искусства могут считать настолько расходным."
10051040-97 = ""
10051040-98 = "Именно поэтому Дадаистская банда Шлемников приняла вызов!"
10051040-99 = "По-настоящему великолепные наряды обретают бессмертие лишь тогда, когда их никогда не носят."
10051040-100 = "Поэтому я идеально сохраню эту вещь и повешу её в нашем офисе! Навечно! Во славу!"
10051040-101 = "Хи-хи, хи-хи-хи, хи-хи-хи..."
10051040-102 = ""
10051040-104 = ""
10051040-105 = ""
10051040-106 = ""
10051040-107 = "Стоп, откуда здесь взялось это странное дерево?"
10051040-108 = "Я... Я не дерево..."
10051040-109 = "Ах, ну конечно, не дерево. С чего бы дереву внезапно появляться и преграждать мне путь?"
10051040-110 = "Тогда я пойду дальше. Хорошего дня."
10051040-111 = "В-Вы не можете уйти...!"
10051040-112 = "Почему?"
10051040-113 = "Вы украли это платье, да...?"
10051040-114 = "Украла?! Прошу вас."
10051040-116 = "Я всего лишь ПЕРЕМЕЩАЮ это платье туда, где оно сможет полностью раскрыть свой потенциал!"
10051040-117 = "...Туда, где величие этой работы не будет принижено!"
10051040-118 = "Подумайте: если кто-то наденет этот великолепный наряд, он износится и повредится... Разве это не трагедия? Я просто даю ему хороший дом."
10051040-119 = "К-Какими бы ни были ваши причины, это кража..."
10051040-120 = "Тц, клянусь... сейчас никто не умеет ценить искусство."
10051040-121 = "Как вы смеете называть меня вором? Я хранительница! Вы бы не узнали искусство, даже если бы оно ударило вас по лицу."
10051040-122 = "Погодите. ...Почему я вообще с вами разговариваю?!"
10051040-123 = ""
10051040-125 = ""
10051040-127 = "Э-Это «Ожидающая беседка»! Я обнаружила вора в саду скульптур!"
10051040-128 = "Чёрт! Она из охраны! С дороги! Пропусти!"
10051040-129 = "Н-Не пропущу!"
10051040-130 = "...Потому что я ниндзя!!"
10051040-131 = "И я должна понимать, что это значит?"
10051040-132 = ""
10051040-134 = ""
10051040-142 = "Внутри места проведения модного показа"
10051040-143 = ""
10051040-144 = "Слышали?! Цукуё нашла вора! В саду скульптур сзади!"
10051040-145 = "Выдвигаемся, Президент!"
10051040-147 = "Сад скульптур у места проведения модного показа"
10051040-148 = "*пыхтит* *пыхтит* ...Откуда у тебя столько силы?!"
10051040-149 = ""
10051040-151 = ""
10051040-156 = ""
10051040-157 = ""
10051040-159 = "Н-Ниндзя никогда не сдаётся!"
10051040-160 = "Э-Это не ответ на вопрос. Отпусти меня!"
10051040-161 = "Н-Не отпущу!!"
10051040-163 = "[ns] «Вообще-то, можешь немного ослабить хватку, Цукуё.»"
10051040-164 = "Потому что!"
10051040-165 = "Твои друзья вступили в бой! Нин-нин!"
10051040-166 = ""
10051040-168 = ""
10051040-169 = "Вместе! Мы сражаемся как одно целое!"
10051040-170 = "Президент...! Изуна...!"
10051040-171 = "Трусы! Как вы смеете нападать толпой на одного невинного человека?"
10051040-172 = "А как ТЫ смеешь красть чужой труд!"
10051040-173 = "З-Заткнись! Я это не крала! Я же сказала. Я переселяю вещь туда, где её будут уважать как положено."
10051040-174 = "Эх, неважно! Мои слова всё равно пропадут на вас впустую!"
10051040-176 = "Дадаистская банда Шлемников! Собраться!!"
10051040-177 = ""
10051040-180 = ""
10051040-182 = ""
10051040-183 = ""
10051040-184 = ""
10051040-185 = "А теперь, товарищи! Пока это бесценное произведение искусства не окажется в безопасности..."
10051040-186 = "...защитите меня ценой своих жизней!"
