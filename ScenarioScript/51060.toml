[translation]
51060-1 = "Episódio 6;O Próximo Destino"
51060-4 = "(Após concluir os trâmites necessários, saí pelas ruas de Hyakkiyako com a Yukari.)"
51060-9 = "Hm-hm-hmmm~♪"
51060-10 = "[s] \"Bom, pra começar...\""
51060-14 = "(Mesmo que eu atue como a \"testemunha\" externa...)"
51060-15 = "[ns] (Ainda precisamos de mais uma oficial da Hyakkaryouran para julgar se os critérios são válidos...)"
51060-16 = "Se puder contar com o apoio do Clube Yin-Yang... e ainda por cima do Sensei da Schale, a vitória já está praticamente garantida!"
51060-17 = "A partir de agora, começa o avanço triunfal da Yukari!!"
51060-18 = "[s] \"Ei, Yukari, que tipo de comitê é a Hyakkaryouran?\""
51060-19 = "Hã...?"
51060-20 = "Que tipo, o senhor diz..."
51060-21 = "[s1] \"Antes do Torneio de Sucessão, que tipo de comitê é a Hyakkaryouran...\"\n[s2] \"Eu gostaria de conhecer direitinho.\""
51060-24 = "Entendo, de fato..."
51060-25 = "......"
51060-26 = "[s] \"Ah, claro, não precisa falar se não quiser...!\""
51060-31 = "Hihi, de jeito nenhum!#nDeixe tudo com esta que é a maior elite de toda a Hyakkaryouran!"
51060-41 = "Hyakkaryouran... O nome oficial é Comitê de Mediação de Conflitos Hyakkaryouran."
51060-42 = "Fico até um pouco envergonhada de dizer isso eu mesma... mas somos um comitê que reúne apenas a mais fina elite de toda a Academia Aliada Hyakkiyako."
51060-44 = "É um comitê tão tradicional que sua origem remonta à época em que Hyakkiyako ainda nem era \"Aliada\"..."
51060-45 = "E nossa principal atividade é mediar disputas e conflitos entre facções e comitês que surgem dentro da academia."
51060-46 = "[s] \"Então é tipo um Comitê de Disciplina, né?\""
51060-49 = "Sim. É verdade que a \"Grande Profetisa\" também nos confiou o papel de deter e orientar alunas problemáticas, mas..."
51060-50 = "O que mais valorizamos não é punir ou dar lições, mas sim a \"mediação\"."
51060-51 = "Na maioria dos conflitos que acontecem dentro da Aliança, ambos os lados têm sua parcela de culpa."
51060-52 = "Por isso, ouvimos os sentimentos de cada lado, servimos de ponte e mediamos para que ambos cheguem a um acordo satisfatório."
51060-53 = "...Esse é o nosso papel."
51060-54 = "[s] \"...Parece bem trabalhoso.\""
51060-55 = "Há momentos difíceis, sim, mas é justamente por isso que podemos ajudar a todos!"
51060-56 = "Por esse motivo, tenho um orgulho imenso das atividades da Hyakkaryouran!"
51060-57 = "[s] \"Você realmente ama a Hyakkaryouran, né, Yukari?\""
51060-58 = "Sim!"
51060-59 = "A Hyakkaryouran é—"
51060-60 = "Para mim, algo que sempre admirei."
51060-72 = "Alto lá! Parem aí mesmo!"
51060-77 = "Hã? Quem é essa pirralha?"
51060-78 = "Se não quiser se machucar, dá o fora logo."
51060-80 = "Fiquei só observando em silêncio e..."
51060-81 = "O que acham que estão fazendo?!"
51060-83 = "Hã?!"
51060-85 = "Eu só tô dizendo que essa redinha de pescar peixinho é muito vagabunda, então eu quero usar a minha Super Ultra Hiper Milagrosa, pô."
51060-86 = "Isso não passa de um motivo totalmente egoísta!#nParem já com isso!"
51060-88 = "Essa fedelha só vai aprender depois de levar uma—"
51060-93 = "Toma essa!!"
51060-102 = "Argh...?! E-Essa garota?!"
51060-104 = "Oprimir os mais fracos e estragar o festival...#nMesmo que todos perdoem, eu, Yukari, jamais perdoarei!"
51060-110 = "Hah! Se vai falar grosso assim, espero que esteja preparada!"
51060-111 = "Sua moleca insolente!"
51060-115 = "Ei, vocês aí!"
51060-132 = "Ghh...!!"
51060-153 = "Q-Quem está aí?!"
51060-160 = "Se machucou?"
51060-165 = "A-Ah, sim... estou bem."
51060-167 = "Que bom... fico aliviada."
51060-169 = "S-Sair atirando assim do nada, sua...!"
51060-170 = "Você sabe com quem está se metendo?!"
51060-171 = "Sei, sim. Vocês sempre causam confusão nos festivais."
51060-172 = "As insolentes aqui — são vocês."
51060-181 = "Eek!! Que precisão absurda é essa...!"
51060-182 = "Cabelos brancos absurdamente longos e um haori azul-claro... Não pode ser...?!"
51060-191 = "C-Corram! É a Hyakkaryouran, a Hyakkaryouran chegou!!"
51060-196 = "Toma essa! Acham que vão escapar?!#nA associação comercial já denunciou vocês!"
51060-197 = "Estão todas prontas pra levar um sermão a noite inteira?"
51060-198 = "Chega de conversa fiada."
51060-202 = "Vamos logo atrás delas."
51060-203 = "Eu sei, eu sei! Tô indo na frente!#nNagusa-senpai, deixo o resto com você!"
51060-208 = "Ah... bem..."
51060-210 = "Essa postura de não recuar nem diante de uma injustiça..."
51060-215 = "Foi muito legal."
51060-216 = "...!"
51060-217 = "Deixe o resto conosco. Até mais."
51060-225 = "O primeiro lugar ao qual eu mesma escolhi pertencer..."
51060-226 = "Um dia, eu também quero ser como a Nagusa-senpai..."
51060-230 = "Cof, cof! De qualquer forma, eu senti com toda a força que não podia deixar a Hyakkaryouran como está agora!"
51060-231 = "Mais uma vez, como naquela época..."
51060-232 = "Eu quero trazer a Hyakkaryouran de volta..."
51060-233 = "Eu, uma integrante de elite, vencerei o \"Torneio de Sucessão\" com minhas próprias mãos e conquistarei a qualificação de Presidente!"
51060-234 = "[s3] \"Aliás, você tinha falado sobre receber uma prova.\"\n[s4] \"O que seria essa prova, exatamente?\""
51060-237 = "Pois bem..."
51060-238 = "Para a Presidente da Hyakkaryouran, existe uma \"Prova de Qualificação\" passada de geração em geração pela \"Grande Profetisa\"..."
51060-239 = "Dizem que quem herda essa prova é quem assume o posto de Presidente."
51060-240 = "E o \"Torneio de Sucessão\" seria justamente o evento para herdá-la!"
51060-241 = "Embora eu mesma nunca tenha visto essa prova pessoalmente..."
51060-242 = "[s] \"Ah, você nunca chegou a ver de perto, então.\""
51060-243 = "Sim... desde que entrei, não tive a oportunidade de vê-la..."
51060-244 = "Porém, dá para ver como ela é no site oficial de divulgação da Hyakkaryouran, então..."
51060-248 = "(Mal tive tempo de me surpreender com o fato de elas terem até um site de divulgação...)"
51060-252 = "A prova... é esta aqui!"
51060-257 = "[ns] \"Isso é uma... arma?\""
51060-258 = "Sim. Exatamente."
51060-259 = "Passada adiante pela Grande Profetisa Kuzunoha, que apenas as Presidentes de cada geração podem empunhar..."
51060-260 = "É a \"arma capaz de capturar fantasmas\"!"
51060-261 = "[s5] \"Capturar fantasmas...?\"\n[s6] \"Uma arma...?\""
51060-264 = "Hihi, não é de se estranhar que fique surpreso."
51060-265 = "A história de que \"a Presidente da Hyakkaryouran pode se encontrar com a senhorita Kuzunoha\" e —"
51060-266 = "A história de que \"a Presidente da Hyakkaryouran consegue capturar fantasmas!\" são segredos de estado que apenas algumas pessoas dentro da própria Hyakkaryouran conhecem!"
51060-267 = "[s] \"Isso já não é praticamente uma lenda urbana...?\""
51060-271 = "M-Mas que absurdo o senhor está dizendo...?!"
51060-272 = "Nossa... que crueldade! Uma arma especial passada de Presidente em Presidente... existe história mais empolgante do que essa?!"
51060-273 = "[s] \"É, pois é...\""
51060-274 = "Bem... ainda assim, é apenas algo que ouvi dizer... No fim das contas, não passa de um rumor.#nNão sei se é verdade ou não."
51060-275 = "Mas, se eu vencer o Torneio de Sucessão sem problemas e colocar as mãos nessa arma..."
51060-276 = "...Nem terei mais medo de andar nas ruas à noite!"
51060-277 = "[s] \"É um ótimo objetivo.\""
51060-281 = "[ns7] \"Sobre o 'Torneio de Sucessão', eu posso ser a testemunha, mas...\"\n[ns8] \"Você tem alguma ideia de qual membro da Hyakkaryouran chamar?\""
51060-284 = "Pessoas que poderiam me ajudar..."
51060-289 = "Tenho duas em mente."
51060-290 = "Uma é a Líder de Vanguarda da Hyakkaryouran, Renge-senpai.#nE a outra é a Kikyou-senpai, que atuava como nossa reservada Estrategista."
51060-292 = "As duas foram as que ficaram mais furiosas quando a Nagusa-senpai desapareceu."
51060-293 = "Se eu explicar a situação, com certeza vão ficar felizes em ajudar no Torneio de Sucessão!"
51060-295 = "Depois disso, só falta eu vencer!"
51060-296 = "Os problemas da Hyakkaryouran estarão todos resolvidos, tudo certinho!"
51060-297 = "[s] \"E onde será que as duas estão agora?\""
51060-298 = "Hmm... A Kikyou-senpai provavelmente está na Sala de Mediação da Hyakkaryouran, mas..."
51060-299 = "Como a casa da Renge-senpai fica perto daqui, vamos até lá primeiro!"
51060-303 = "Venha, por aqui!"
51060-305 = "Área Residencial de Hyakkiyako"
51060-308 = "Seguindo por esta avenida e virando à esquerda no final, chegamos à casa da Renge-senpai!"
51060-311 = "Chegamos, é aqui."
51060-312 = "Pois bem, vou chamá-la."
51060-317 = "Bom dia, Renge-senpai! Sou eu, a Yukari!"
51060-321 = "[ns] \"...Ninguém responde.\""
51060-322 = "O-Ora...? Não pode ser..."
51060-329 = "[ns] \"Espera, Yukari, tem um bilhete colado na porta...\""
51060-330 = "Um bilhete...?"
51060-334 = "Vejamos, o que diz aqui..."
51060-335 = "Humm, humm... Sim, entendo."
51060-340 = "......Como é que é?"
51060-341 = "[s] \"O que está escrito?\""
51060-342 = "Bem... é que..."
51060-349 = "(No papel que Yukari me entregou com uma expressão perplexa, estava escrito o seguinte)"
51060-352 = "<Pra quem tiver assunto comigo>"
51060-353 = "<Fui viajar pra recuperar a minha juventude!>"
51060-357 = "[log=렌게 실루엣]<Não tenho previsão de voltar tão cedo!>[/log]"
51060-361 = "[ns] \"......Juventude?\""
51060-363 = "Próximo;Garota da Juventude (?) (1)"
