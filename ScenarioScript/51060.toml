[translation]
51060-1 = "Эпизод 6;Следующее назначение"
51060-4 = "Закончив со всеми необходимыми бумагами, я последовал за Юкари по улицам Хяккияко."
51060-5 = ""
51060-7 = ""
51060-8 = ""
51060-9 = "Хм, хм-хм. ♪"
51060-10 = "[s] «Итак, чтобы начать поединок...»"
51060-11 = ""
51060-14 = "«(Нам нужны два свидетеля... Один не связан с Хяккарёран и подтверждает, что ритуал проводится по уважительной причине...)»"
51060-15 = "[ns] «(А второй — офицер Хяккарёран, который следит, чтобы бой был честным.)»"
51060-16 = "С помощью Клуба Инь-Ян... и даже Сенсея из Шале остаётся только двигаться вперёд!"
51060-17 = "Только вперёд! Другого пути нет!"
51060-18 = "[s] «Юкари, а что вообще представляет собой Хяккарёран?»"
51060-19 = "Хм?"
51060-20 = "Что вы имеете в виду... что представляет собой клуб?"
51060-21 = "[s1] «Я хочу узнать больше о Хяккарёран.»\n[s2] «Не хочу удивляться, когда начнётся Поединок за преемство.»"
51060-24 = "Ах..."
51060-25 = "..."
51060-26 = "[s] «Можешь не отвечать, если не хочешь...»"
51060-27 = ""
51060-29 = ""
51060-30 = ""
51060-31 = "Хи-хи! Всё в порядке! Раз вам интересно, я, Юкари, расскажу вам о Хяккарёран!"
51060-32 = ""
51060-41 = "Хяккарёран... Его полное название — Совет урегулирования Хяккарёран."
51060-42 = "Немного неловко так хвастаться, но клуб приглашает только лучших студентов Объединённой академии Хяккияко. В элитной академии мы — элита среди элит!"
51060-44 = "История клуба очень длинна и началась ещё до создания альянса Хяккияко..."
51060-45 = "В наши дни наша главная задача — вмешиваться в конфликты между различными фракциями и клубами Хяккияко и помогать им прийти к соглашению."
51060-46 = "[s] «То есть вы выполняете роль... дисциплинарного комитета из других академий.»"
51060-49 = "Верно, Пророчица поручила нам останавливать нарушителей порядка и направлять их на путь исправления..."
51060-50 = "Но дипломатию мы ценим гораздо выше, чем наказания или навязывание правил."
51060-51 = "Альянс — это дом, укрывающий множество разных групп и идеалов. Конфликты здесь редко возникают лишь из-за проступка или злого умысла одной стороны."
51060-52 = "Хяккарёран — это основание, на котором спорящие стороны строят компромисс. Мы следим, чтобы никто не оказался в проигрыше и никто не добивался своего силой."
51060-53 = "В этом и состоит наша задача."
51060-54 = "[s] «...Наверное, это нелегко.»"
51060-55 = "Ну... компромисс редко делает абсолютно всех счастливыми... но, усаживая стороны за один стол, мы становимся связующим звеном, которое удерживает Хяккияко вместе."
51060-56 = "Я, Юкари, горжусь тем, что состою в Хяккарёран!"
51060-57 = "[s] «Ты правда любишь свой клуб, Юкари.»"
51060-58 = "Конечно!"
51060-59 = "Это естественно."
51060-60 = "Хяккарёран... это клуб, которым я всегда восхищалась."
51060-64 = ""
51060-65 = ""
51060-66 = ""
51060-67 = ""
51060-69 = ""
51060-72 = "Эй ты! А ну стой!"
51060-73 = ""
51060-76 = ""
51060-77 = "А? Это ещё что за мелочь?"
51060-78 = "Тебе бы мамочку найти, прежде чем реветь начинаешь."
51060-80 = "Вы жульничаете и пристаёте к людям!"
51060-81 = "Это неправильно! Так что прекратите!"
51060-82 = ""
51060-83 = "Да брось ты, мелкая."
51060-84 = ""
51060-85 = "Ты правда думаешь, что можно доверять сачку для золотых рыбок, который дают в киоске? Что плохого в том, чтобы использовать наш собственный супер-ультра-мега-люксовый сачок?"
51060-86 = "Именно это и есть проблема!"
51060-87 = ""
51060-88 = "Ты что, из средней школы? Лучше беги домой, пока не пострадала..."
51060-89 = ""
51060-91 = ""
51060-93 = "Хия-а!!!"
51060-94 = ""
51060-96 = ""
51060-101 = ""
51060-102 = "Угх?! Т-Ты только что...?!"
51060-104 = "Я, Юкари, не потерплю тех, кто портит фестивали или обижает слабых!"
51060-105 = ""
51060-107 = ""
51060-109 = ""
51060-110 = "Ладно. Если сама напросилась..."
51060-111 = "Я научу тебя, почему мелким надо знать своё место!"
51060-112 = ""
51060-114 = ""
51060-115 = "Окружить её!"
51060-116 = ""
51060-120 = ""
51060-121 = ""
51060-123 = ""
51060-125 = ""
51060-126 = ""
51060-129 = ""
51060-132 = "Уф!"
51060-133 = ""
51060-146 = ""
51060-148 = ""
51060-149 = ""
51060-151 = ""
51060-152 = ""
51060-153 = "К-Кто вы такая?!"
51060-154 = ""
51060-156 = ""
51060-159 = ""
51060-160 = "Вы не пострадали?"
51060-162 = ""
51060-164 = ""
51060-165 = "А, эм, д-да..."
51060-167 = "Мне? Мне идеально. Не слишком жарко и не слишком холодно."
51060-169 = "В-Вы в нас стреляли! Вы правда в нас выстрелили!"
51060-170 = "Да как вы смеете! Вы вообще знаете, кто мы?!"
51060-171 = "Прекрасно знаю. Вы те нарушители порядка, которые постоянно появляются и мешают нашим фестивалям."
51060-172 = "И слова «как вы смеете» вам совершенно не подходят."
51060-173 = ""
51060-177 = ""
51060-179 = ""
51060-181 = "И-и-и! Одним точным выстрелом молча уложила человека..."
51060-182 = "Э-Эти белые волосы... И-и это небесно-голубое хаори!"
51060-183 = ""
51060-191 = "Б-Б-Бежим! Это Хяккарёран! Хяккарёран здесь!"
51060-192 = ""
51060-196 = "Хия! Только попробуйте убежать! Торговая гильдия уже передала нам ваши приметы!"
51060-197 = "Надеюсь, вы готовы выслушать лекцию всей своей жизни!"
51060-198 = "Хватит болтать."
51060-199 = ""
51060-201 = ""
51060-202 = "Пока ты стоишь и разглагольствуешь, они убегают."
51060-203 = "А! Вперёд! Нагуса, остальное оставляем тебе!"
51060-204 = ""
51060-206 = ""
51060-208 = "А, эм, ну..."
51060-210 = "Ваша непоколебимая смелость выступить против несправедливости."
51060-211 = ""
51060-213 = ""
51060-214 = ""
51060-215 = "Это было весьма впечатляюще."
51060-216 = "...!"
51060-217 = "Дальше предоставьте всё Хяккарёран. А теперь..."
51060-218 = ""
51060-220 = ""
51060-222 = ""
51060-223 = ""
51060-225 = "Впервые в жизни я встретила людей, которыми искренне восхищалась..."
51060-226 = "Я хотела стать такой, как Нагуса..."
51060-227 = ""
51060-229 = ""
51060-230 = "В-Вот почему я не могу оставить Хяккарёран в таком ужасном состоянии!"
51060-231 = "Чтобы всё снова стало как раньше..."
51060-232 = "Чтобы вернуть Хяккарёран роль маяка справедливости..."
51060-233 = "Я, Юкари, элита Хяккарёран, спасу наш клуб собственными руками! Я одержу победу в Поединке за преемство и получу Полномочие президента!"
51060-234 = "[s3] «Ты уже несколько раз упоминала какое-то полномочие.»\n[s4] «То есть это „Полномочие“ вроде... официальной печати?»"
51060-237 = "Ах, следовало ожидать, что вы это заметите, Сенсей!"
51060-238 = "Каждый президент Хяккарёран передавал своему преемнику Полномочие, впервые дарованное нам самой Великой Пророчицей."
51060-239 = "Только тот, кто владеет Полномочием, имеет право называть себя президентом Хяккарёран..."
51060-240 = "Помню, мне рассказывали, что Поединок за преемство — это ритуал, посредством которого Полномочие управлять Хяккарёран передаётся от одного поколения к следующему!"
51060-241 = "...По крайней мере, кажется, именно так говорили!"
51060-242 = "[s] «Кажется...?»"
51060-243 = "Н-Ну... Последний Поединок за преемство состоялся задолго до моего вступления в Хяккарёран... Большинство президентов добровольно передавали титул выбранному преемнику..."
51060-244 = "А, но я могу показать вам Полномочие президента, на сайте Хяккарёран есть фотография..."
51060-245 = ""
51060-247 = ""
51060-248 = "Рекламный сайт клуба впечатляюще оформлен, и один предмет на нём особенно выделяется."
51060-249 = ""
51060-251 = ""
51060-252 = "Вот оно — Полномочие президента!"
51060-253 = ""
51060-255 = ""
51060-257 = "[ns] «Это что... пистолет?»"
51060-258 = "Да, но не просто пистолет!"
51060-259 = "Это не что иное, как легендарное оружие, которым когда-то владела Великая Пророчица Кузуноха и которое способен носить лишь президент Хяккарёран..."
51060-260 = "Легендарный заклинательный пистолет экзорциста!"
51060-261 = "[s5] «Экзорциста... что?»\n[s6] «Легендарный... заклинательный пистолет?»"
51060-264 = "Хи-хи, вы ошеломлены! Я понимаю ваши чувства!"
51060-265 = "Эта легенда неразрывно связана с рассказами о том, что только президент Хяккарёран может удостоиться аудиенции у Кузунохи..."
51060-266 = "Лишь избранные знают: достигнув уровня президента Хяккарёран, можно изгонять призраков и духов!"
51060-267 = "[s] «...Звучит как городская легенда.»"
51060-268 = ""
51060-270 = ""
51060-271 = "Ч-Что вы такое говорите?!"
51060-272 = "Я только что раскрыла вам секрет легендарного заклинательного пистолета экзорциста, который наследует каждый президент Хяккарёран! Как вы можете реагировать настолько холодно?!"
51060-273 = "[s] «П-Прости...»"
51060-274 = "Ну, слухи остаются слухами... Трудно понять, что из этого правда."
51060-275 = "Но... если я выиграю Поединок за преемство и завладею заклинательным пистолетом..."
51060-276 = "...я больше не буду бояться тёмных улиц, когда иду домой после занятий!"
51060-277 = "[s] «Неплохая цель.»"
51060-281 = "[ns7] «Тогда я выступлю твоим первым свидетелем.»\n[ns8] «А другой член Хяккарёран согласится быть судьёй?»"
51060-284 = "У меня есть мысли, кто из офицеров мог бы помочь мне с Поединком за преемство..."
51060-285 = ""
51060-287 = ""
51060-288 = ""
51060-289 = "Есть две старшекурсницы, на которых я могу положиться."
51060-290 = "Рэнгэ, командир штурмового отряда Хяккарёран, и Кикё, которую называют безмолвным офицером по операциям."
51060-291 = ""
51060-292 = "Из всех членов клуба именно они сильнее всего расстроились, когда Нагуса покинула нас..."
51060-293 = "Уверена, они помогут с моим Поединком за преемство, если я поговорю с ними о Нагусе...!"
51060-295 = "А после этого мне останется только победить!"
51060-296 = "Тогда Хяккарёран снова будет вместе, и всё станет как прежде!"
51060-297 = "[s] «Эм, а где нам их найти?»"
51060-298 = "Уверена, Кикё сейчас в административном офисе..."
51060-299 = "Но дом Рэнгэ ближе, так что сначала отправимся туда!"
51060-300 = ""
51060-302 = ""
51060-303 = "Сюда!"
51060-305 = "Жилой район Хяккияко"
51060-308 = "Теперь, если повернуть налево в конце этой дороги, мы окажемся у дома Рэнгэ!"
51060-311 = "Вот. Здесь живёт Рэнгэ..."
51060-312 = "Теперь постучим в дверь и..."
51060-313 = ""
51060-315 = ""
51060-316 = ""
51060-317 = "Прошу прощения! Рэнгэ! Я, Юкари, прибыла!"
51060-318 = ""
51060-321 = "[ns] «...Никто не отвечает.»"
51060-322 = "А-А? Н-Не может быть..."
51060-323 = ""
51060-329 = "[ns] «Постой, Юкари. Это записка на двери?»"
51060-330 = "Записка...?"
51060-331 = ""
51060-333 = ""
51060-334 = "Так, посмотрим..."
51060-335 = "Хм. Хм. Хм-м."
51060-336 = ""
51060-338 = ""
51060-339 = ""
51060-340 = "...Что?"
51060-341 = "[s] «Что там написано?»"
51060-342 = "Эм... Ну, понимаете..."
51060-343 = ""
51060-345 = ""
51060-347 = ""
51060-348 = ""
51060-349 = "Юкари долго смотрела на записку в своей руке с растерянным выражением лица, а затем повернулась и протянула её мне."
51060-352 = "Если вы пришли ко мне по делу..."
51060-353 = "Забудьте. Меня здесь нет."
51060-354 = ""
51060-357 = "[log=렌게 실루엣]Я отправилась в приключение, чтобы вернуть свою юность![/log]"
51060-361 = "[ns] «...Юность?»"
51060-363 = "Следующий эпизод;В погоне девушки за юностью(?) 1"
