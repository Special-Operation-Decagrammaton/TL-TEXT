10055080-48 = "Какая эффективная дальность у дульнозарядной корабельной пушки?"
10055080-49 = "Да это же музейный экспонат! Откуда КОМУ-ТО знать такое наизусть?"
10055080-50 = "У их ядер огромный калибр! Мы в невыгодном положении."
10055080-51 = "Но у нас современное вооружение и технологии!"
10055080-52 = "И что, они нам помогают?! Хватит одного попадания такого ядра, и нам конец!"
10055080-53 = "Сделайте что-нибудь, капитан!"
10055080-54 = ""
10055080-56 = ""
