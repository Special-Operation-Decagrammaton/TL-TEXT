[translation]
10055080-1 = "Episode 8: Life of Bismarck"
10055080-10 = "We missed everything!"
10055080-11 = "Tch! They're small and fast."
10055080-12 = "Or rather, I feel like we're just bad at this!"
10055080-13 = "If you miss, keep firing until you hit! Keep it up!"
10055080-15 = "Hmm..."
10055080-16 = "Ah!"
10055080-21 = "If I do this, and then that..."
10055080-25 = "Ta-da!"
10055080-27 = "Not yet, one more time!"
10055080-28 = "Makoto-senpai, Makoto-senpai!"
10055080-29 = "Ah, wait, I'm the Captain now...!"
10055080-30 = "Captain Makoto!"
10055080-31 = "Hm? What is it, Ibuki?"
10055080-32 = "...Oh!? Is this, by any chance, a ballistic table for the naval guns?"
10055080-33 = "Yep! Now we can lecture the bad guys!"
10055080-34 = "Well done, Ibuki! But... where did you get this?"
10055080-35 = "Ibuki made it!"
10055080-36 = "...You calculated this all by yourself in an instant...!?"
10055080-37 = "Yep! These kinds of cannons don't have much rifling, so I couldn't calculate it perfectly, but..."
10055080-38 = "The way the distance changed when I adjusted the aim was consistent!#nSo I calculated what angle we should fire at to make it easier to hit!"
10055080-39 = "How is it? Is Ibuki a good girl? Am I smart?"
10055080-41 = "I knew it, but... this talent is truly terrifying...!"
10055080-42 = "Well done, Ibuki! Everyone, attention!"
10055080-43 = "The time has come to make them regret messing with us!#nFollow the instructions and adjust the angle of all cannons!"
10055080-47 = "Whoa, did their marksmanship suddenly improve!?"
10055080-48 = "Does anyone know the effective range of a muzzle-loader?"
10055080-49 = "Who would know the range of such a fossil?"
10055080-50 = "Their caliber is bigger, so we might be at a disadvantage in a long-range battle...?"
10055080-51 = "No, but we have modern weaponry here!?"
10055080-52 = "But machine guns won't work on them! If we take one hit, we're sinking!?"
10055080-53 = "Captain! Do something!"
10055080-58 = "...Eh? Me?"
10055080-62 = "No, no, 'Captain' is too much!#nWe're just each doing our own part!"
10055080-71 = "Hey, they're running away! Catch them!"
10055080-72 = "Are you trying to slip away all by yourself!?"
10055080-79 = "W-wait, stop that! I'm the Captain, you know!?#nThis is mutiny, isn't it!?"
10055080-84 = "...Let's try ramming them."
10055080-88 = "...Eh?"
10055080-90 = "Our current weapons won't work, right? And we don't know the range difference."
10055080-91 = "In other words, we should just shove our best weapon into them at point-blank range."
10055080-92 = "...No, why would you conclude that?"
10055080-93 = "No! That might actually be correct!?"
10055080-94 = "In naval warfare, both now and in the past, ramming is the best!"
10055080-95 = "I don't know about the past, but it's different now..."
10055080-96 = "Eh? I'm not the only sane person here, right?"
10055080-97 = "...You're right."
10055080-102 = "'Speed x Mass = Power'!!"
10055080-104 = "Now! Full speed ahead!!"
10055080-105 = "Aye aye!"
10055080-106 = "..."
10055080-112 = "Waaaaah!?"
10055080-114 = "They rammed us!? Are they idiots!?"
10055080-115 = "What!? There's a hole in the Bismarck!?"
10055080-116 = "When did they even name it that..."
10055080-121 = "Captain! They're trying to seize our ship!!"
10055080-122 = "They're invading through the hole in the hull!!"
10055080-124 = "This is... an insult to my Pandemonium ship."
10055080-125 = "You lot!! Give them a proper welcome!!!!"