10055080-28 = "Макото! Макото!"
10055080-29 = "А, Ибуки забыла! Кхм... Капитан! Капитан!"
10055080-30 = "Капитан Макото!"
10055080-31 = "Что такое, Ибуки?"
10055080-32 = "...О?! Неужели это... таблица стрельбы корабельных пушек?!"
10055080-33 = "Да, капитан! Теперь мы сможем проучить этих плохих ребят!"
10055080-34 = "Молодец, Ибуки! Но... откуда она у тебя?"
10055080-35 = "Ибуки сама сделала!"
10055080-36 = "...Ты всё это рассчитала? За такое короткое время?!"
10055080-37 = "Угу! Эти пушки такие старые, что у них даже нарезов нет, поэтому точно прицелиться сложно..."
10055080-38 = "Ибуки удивилась, когда узнала, что при изменении угла выстрела дальность меняется на одинаковую величину! В таблице указаны углы, при которых больше всего шансов устроить БАБАХ!"
10055080-39 = "Ну как Ибуки справилась? Ибуки очень умная?"
10055080-41 = "Да тут не просто умная! Это... даже немного пугает! Но потрясающе!"
10055080-42 = "Молодец, Ибуки! Команда, внимание!"
10055080-43 = "Теперь покажем им нашу настоящую огневую мощь! Устанавливайте углы возвышения орудий по моей команде!"
10055080-44 = ""
10055080-45 = ""
10055080-46 = ""
