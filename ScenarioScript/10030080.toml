10030080-45 = "Кажется, после новогоднего рассвета мы вас в клубной комнате не видели. Были заняты?"
10030080-47 = "Да. С началом нового года довольно много компаний записались на консультации по безопасности..."
10030080-48 = "У меня даже голос немного охрип от того, сколько раз пришлось представляться и поздравлять с Новым годом... и это не потому, что я кричала."
10030080-49 = "Эй, ты ведь не слишком себя загоняешь?"
