[translation]
70006020-1 = "Изысканная кухня, печенье и помощь. Эпизод 2"
70006020-2 = "Всё началось со странного слуха... обо мне."
70006020-4 = "Вестибюль Главной больницы Святой Терезы"
70006020-5 = "Эм..."
70006020-6 = ""
70006020-8 = ""
70006020-9 = "Капитан? Что-то не так? Вы выглядите грустной."
70006020-10 = "О, давайте Я вас развеселю!"
70006020-12 = "Не волнуйтесь. Я в порядке. ...Просто обо мне ходит один слух."
70006020-14 = "Слух?"
70006020-15 = "Тот, где вы любите собирать медицинские принадлежности, потому что вам нравится запах пластырей?"
70006020-17 = "Не тот."
70006020-18 = "А что насчёт слуха, будто регистратура — лишь прикрытие, чтобы выискивать новые цели?"
70006020-19 = "И не этот..."
70006020-20 = "А ещё я слышала, что на чаепитиях вы тайком едите протеиновое печенье, чтобы накачаться..."
70006020-21 = "Нет...!"
70006020-22 = "Да откуда вы вообще всё это слышите?! Всё неправда! ПОЛНЕЙШАЯ неправда!"
70006020-23 = "Не переживайте так! Мы-то знаем, что на самом деле вы вовсе не такая!"
70006020-24 = "И всё же тревожит, как быстро расходятся эти истории."
70006020-25 = "Ведь всё, чего я когда-либо хотела, — привить дух помощи как можно большему числу людей."
70006020-27 = "Жаль это слышать..."
70006020-28 = "Как нам всё исправить?"
70006020-29 = ""
70006020-31 = ""
70006020-32 = "О, знаю!"
70006020-33 = "Давайте напечём кучу печенья и раздадим как можно большему числу людей."
70006020-34 = "Когда они почувствуют всю любовь, которую мы вложили в это печенье, все недоразумения насчёт капитана сразу исчезнут!"
70006020-36 = "О, а ещё печенье должно быть милым! В виде зверушек. Например, цыплят."
70006020-37 = "Печенье в форме цыплят. Отличная идея!"
70006020-39 = "...Так мы и решили испечь печенье-цыплят, но возникла одна проблема."
70006020-40 = "Я никогда раньше не пекла печенье."
70006020-41 = "Сэрина и Ханаэ помогли, но первая попытка обернулась полной катастрофой."
70006020-42 = "На цыплят они не были похожи. Скорее на каких-то искорёженных чудовищ из ада..."
70006020-43 = "Тогда я обратилась за советом в известную пекарню Тринити, но..."
70006020-44 = "Их рецепты оказались слишком сложными: начинки, глазурь и всё такое. Похоже, они решили, что мой уровень куда выше, чем на самом деле."
70006020-45 = "Так что вам всё же больше хотелось печенье-цыплят."
70006020-46 = "Как говорится, милота — это справедливость."
70006020-47 = "Но вернёмся к делу. Я отправилась искать другие советы и встретила Фууку в торговом районе."
70006020-48 = "Торговый район Шале, конечно, настоящий плавильный котёл. Здесь запросто можно увидеть студентов Тринити и Геенна, делающих покупки бок о бок."
70006020-49 = "Так знаменитые Рыцари спасения встретили Фууку."
70006020-51 = "Именно. Но не будем забегать вперёд..."
70006020-53 = "Сегодня я купила много свежих продуктов."
70006020-54 = "На какое-то время этого хватит..."
70006020-55 = "...если только ОНИ снова не заявятся."
70006020-56 = ""
70006020-59 = ""
70006020-60 = "Хм..."
70006020-61 = ""
70006020-63 = ""
70006020-64 = "О... Здравствуйте. Я могу чем-то помочь...?"
70006020-65 = "Здравствуйте. Скажите, вас случайно не интересует помощь нуждающимся?"
70006020-66 = "...Простите?"
70006020-67 = "Я Мине, капитан Рыцарей спасения Старшей школы Тринити."
70006020-69 = "Т-Тринити? Капитан?!"
70006020-70 = "Именно. Едва увидев вас издалека, я почувствовала странное родство душ."
70006020-71 = "С какой заботой вы выбирали продукты... Это напомнило мне, как я сама мучительно выбираю медицинские принадлежности."
70006020-72 = "В-вот как...?"
70006020-73 = "Увидев тревогу на вашем добром лице, я решила, что вы занимаетесь помощью людям. Это так?"
70006020-74 = "Эм... Я президент Клуба школьного питания Геенна..."
70006020-75 = ""
70006020-77 = ""
70006020-78 = ""
70006020-79 = "Я так и знала...! Мои глаза меня не обманули!"
70006020-80 = "Не уделите мне немного времени? Чувствую, мы прекрасно поладим."
70006020-81 = "А? Но... вы из Тринити, а я из Геенна..."
70006020-82 = "На фоне великого дела помощи это бессмысленное различие. Разве нет?"
70006020-83 = "Ну... да, тут вы правы. Я тоже считаю, что голодных нужно кормить, кем бы они ни были..."
70006020-85 = "...хотя с некоторыми бывает непросто."
70006020-86 = "Непросто...?"
70006020-88 = "Так вот как вы о нас узнали."
70006020-89 = "Они ещё и попросили меня помочь испечь печенье."
70006020-90 = "Я подумала: если Рыцари спасения хотят подружиться, почему бы и нет?"
70006020-91 = "Так что сегодня, пожалуйста, дайте мне передышку. Мы с Рыцарями пойдём покупать ингредиенты для печенья."
70006020-92 = "Как скажешь. Наш заказ на обед пока отложен."
70006020-93 = "Вместо этого у нас появился новый план."
70006020-94 = "Мине, с вашего позволения, может Общество исследования гурманов заняться дегустацией ваших печений-цыплят?"
70006020-95 = "Я ощутила ауру изысканной еды в ту же секунду, как услышала эту историю."
70006020-96 = "Хи-хи, я тоже хочу попробовать! ★"
70006020-97 = "Ага, я обожаю печенье!"
70006020-98 = "Дегустация ведь бесплатная, да? Хе-хе-хе..."
70006020-100 = "Смотрю, вы все уже снова на ногах."
70006020-101 = "Дегустация... Возможно, Общество исследования гурманов и правда разбирается во вкусе лучше нас."
70006020-102 = "Не думаю, что из их участия выйдет что-то хорошее..."
70006020-104 = "Не волнуйся. Нам всего лишь любопытно попробовать печенье, вот и всё."
70006020-105 = "А с твоей помощью, Фуука, оно получится идеальным."
70006020-106 = "Ну... получится, конечно, но..."
70006020-107 = "Что скажете, капитан?"
70006020-108 = "Я только за! Готовить печенье вместе с вами — звучит замечательно!"
70006020-110 = "Хорошо. Тогда пойдём все вместе."
70006020-111 = "Ах, у меня плохое предчувствие..."
70006020-113 = ""
70006020-114 = ""
70006020-115 = ""
70006020-116 = ""
70006020-117 = ""
70006020-118 = ""
70006020-120 = ""
70006020-121 = ""
70006020-123 = ""
70006020-124 = ""
70006020-125 = ""
70006020-126 = ""
70006020-128 = "Немного позже..."
70006020-130 = "Кухня Тринити"
70006020-131 = "Ах, как вкусно пахнет. Сколько ещё ждать?"
70006020-132 = "Совсем немного. Почти готово."
70006020-134 = "Хорошо, тогда давайте подготовимся."
70006020-135 = "А нам точно сейчас можно здесь находиться?"
70006020-137 = "Конечно. Просто наслаждайтесь, как и планировали."
70006020-138 = ""
70006020-140 = ""
70006020-141 = "...Ка-а-ак и планировали."
70006020-142 = "То есть если они окажутся невкусными, вы всё здесь взорвёте?"
70006020-143 = "Хе-хе-хе, кто знает..."
70006020-145 = "Наконец-то ожидание окончено!"
70006020-146 = "Милые печенья капитана Мине готовы!"
70006020-147 = ""
70006020-149 = ""
70006020-150 = ""
70006020-151 = ""
70006020-152 = "..."
70006020-154 = "Ну же, покажите нам!"
70006020-155 = "Уверена, всем понравится."
70006020-157 = "Х-хорошо."
70006020-158 = "Все...! Вот печенье, которое я приготовила."
70006020-159 = ""
70006020-161 = ""
70006020-162 = ""
70006020-164 = "О-о, мне становится тепло уже от одного взгляда на них."
70006020-165 = "С подачей всё отлично, это точно. ★"
70006020-166 = "Они такие милые! Даже жалко есть!"
70006020-167 = "Но нам уже можно? Можно их есть?"
70006020-169 = "Ха, столько похвалы... Наверное, мои щёки уже совсем красные..."
70006020-170 = "Как говорится, дыма без огня не бывает. Иными словами, мы все говорим правду."
70006020-171 = "В отличие от слухов, из-за которых вы так переживали. Нельзя всю жизнь принимать всё за чистую монету. Мы видим настоящую Мине такой, какая она есть."
70006020-172 = "...!"
70006020-174 = "Ух ты! Получилось, капитан!"
70006020-175 = "Теперь все смогут узнать вас настоящую!"
70006020-177 = "З-замечательно..."
70006020-178 = "Ну всё, давайте уже пробовать!"
70006020-179 = ""
70006020-181 = ""
70006020-183 = "Хе-хе-хе, сначала съесть голову? Или тело?"
70006020-184 = "Начни с головы. Так гуманнее."
70006020-186 = "Тогда... приятного аппетита!"
70006020-187 = ""
70006020-189 = ""
70006020-191 = ""
70006020-193 = ""
70006020-194 = ""
70006020-195 = ""
70006020-197 = "Погодите, этот вкус...!"
70006020-198 = "Это опасно... ★"
70006020-199 = "Я в жизни не ела такого печенья...!"
70006020-200 = "Как бы это сказать... В общем..."
70006020-201 = "ЭТО НЕВЕРОЯТНО ВКУСНО!!"
70006020-203 = "Насыщенный сладковатый вкус яйца, который раскрывается во рту. Невозможно устоять!"
70006020-204 = "Мне очень нравится эта юная, задорная нотка хрустящей текстуры."
70006020-205 = "Это печенье на вкус милое! Я ела много чего, но никогда раньше не ПРОБОВАЛА милоту!"
70006020-206 = "...Конечно, удовольствие от еды — это не только вкус. Важно ещё и то, сколько заботы вложили в приготовление."
70006020-207 = "А эти печенья наполнены вашей заботой, Мине."
70006020-208 = "Без сомнений, это настоящая изысканная еда."
70006020-209 = "...С-столько похвалы."
70006020-210 = "Большое вам спасибо. Признание Общества исследования гурманов придаёт мне огромную уверенность."
70006020-211 = "Если честно, я ужасно боялась провала..."
70006020-212 = "Фу-фу, как же хорошо, что я не взорвала это место."
70006020-213 = "Я ТАК И ЗНАЛА, что вы об этом думали!"
70006020-214 = "Но ведь всё вкусно, правда?"
70006020-215 = "Ещё бы! Можно мне ещё?"
70006020-217 = "Конечно. Ешьте сколько хотите. Я приготовила достаточно для всех."
70006020-218 = "Ух ты...!"
70006020-220 = "Капитан, это печенье обязательно покажет всем ваши чувства."
70006020-221 = "Точно! Уверена, даже вице-президент Хасуми из Комитета справедливости оценит их."
70006020-223 = "Вице-президент Хасуми... Надеюсь, она не станет надо мной смеяться."
70006020-225 = "О, к десертам она привередлива, но над такими точно не посмеётся!"
70006020-226 = "Надеюсь, благодаря этому вы станете ближе."
70006020-228 = "Х-хм...!"
70006020-229 = "В любом случае, огромное вам спасибо. Благодаря всем вам я испытала нечто новое."
70006020-230 = "И особенно я обязана Фууке. Благодаря её невероятным наставлениям это печенье..."
70006020-231 = ""
70006020-233 = ""
70006020-234 = "...А? Фуука?"
70006020-236 = "А? Куда она делась? Когда мы готовили, она была здесь."
70006020-237 = "Кажется, я не видела её с самого начала дегустации..."
70006020-239 = "Ну что ж, Рыцари спасения, мы пойдём."
70006020-240 = "Ммф...! Мммф!"
70006020-241 = "Фуука?! Почему ты вся связана?!"
70006020-242 = "Когда они успели...!"
70006020-243 = "Когда вы забрали печенье и вышли из кухни."
70006020-244 = "Печенье было таким хорошим, что отвлекло вас... ★"
70006020-245 = "И они успели за столь короткое время...?"
70006020-247 = "Хе-хе-хе, ты знаешь, сколько раз мы уже проделывали это с Фуукой? Проще простого."
70006020-248 = "Не ХВАСТАЙСЯ этим...!"
70006020-249 = "Ммф! Мммф...!"
70006020-250 = "О, она говорит, что хочет поскорее приготовить нам обед!"
70006020-251 = "Тогда двигаемся. Ах да, сначала надо позвонить Джури..."
70006020-252 = ""
70006020-254 = ""
70006020-255 = ""
70006020-256 = "Харуна. Вы нашли Фууку?"
70006020-257 = "Да. Она благополучно находится под нашей защитой."
70006020-258 = "Мы нашли её, когда она выбирала продукты."
70006020-259 = "А, вот где она была. Отлично, просто продолжайте за ней присматривать."
70006020-260 = "О, положитесь на нас. Мы непременно присмотрим."
70006020-261 = ""
70006020-263 = ""
70006020-264 = "Что ж, полагаю, это всё."
70006020-265 = "Спасибо за печенье! ★"
70006020-266 = ""
70006020-268 = ""
70006020-269 = ""
70006020-270 = ""
70006020-271 = ""
70006020-272 = "Как вы смеете так обращаться с подругой?!"
70006020-273 = "Медицина не знает границ! Мы будем преследовать вас, куда бы вы ни побежали!"
70006020-274 = ""
70006020-278 = "О-она пробила дыру в стене..."
70006020-279 = "А-ха-ха... Похоже, эта затея со «сменой имиджа» будет сложнее, чем мы думали."
70006020-281 = "Общество исследования гурманов...! Вам не уйти!"
70006020-282 = "Фу-фу, на этот раз вы нас не поймаете!"
70006020-283 = "Ммф! Ммммф!"
70006020-284 = ""
70006020-290 = "Так началась великая погоня..."
70006020-291 = "Изысканная кухня, печенье и помощь"
