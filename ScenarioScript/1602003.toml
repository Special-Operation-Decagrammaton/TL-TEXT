[translation]
1602003-1 = "Радиопередача одного снайпера"
1602003-2 = "Исполнительный офис Шале"
1602003-3 = "Это был обычный день..."
1602003-4 = "Отоги пришла на смену Представителя Студентов, и мы вместе разбирали журнал операций SRT."
1602003-5 = ""
1602003-7 = ""
1602003-8 = ""
1602003-9 = ""
1602003-10 = ""
1602003-11 = "«Перейти на радиоканал 3.»"
1602003-12 = "«Говорит FOX 4. Связь чистая?»"
1602003-13 = "«Номер операции M-X-9-2... Не S, X как X-ray.»"
1602003-14 = "Подтверждаю. Код прекращения операции — November, Kilo..."
1602003-15 = ""
1602003-16 = "[ns] «Как идёт отчёт?»"
1602003-17 = "Не очень. На этой операции связь была ужасной, поэтому трудно разобрать, что говорят."
1602003-18 = "Перед операцией мы установили глушилку, но помехи всё равно очень сильные."
1602003-19 = "Мне нужно говорить громче, хотя бы чтобы потом проще было писать отчёты."
1602003-20 = "[s1] «Мы сейчас слушаем твой голос, да?»\n[s2] «Вы все звучите очень впечатляюще.»"
1602003-23 = "Звучит сложнее, чем есть на самом деле."
1602003-24 = "Сначала мы ещё раз подтверждаем местоположение цели и код операции. Это стандартная процедура, так что разобраться сможет почти любой."
1602003-25 = "А, фонетический код может немного запутать, если его не изучал."
1602003-26 = "[s] «Фонетический код»?"
1602003-27 = "Да. Например Alpha, Charlie, Mike."
1602003-28 = "В обычной речи много слов, которые звучат похоже, правда? Например английские «two» и «to»."
1602003-29 = "Представьте, что из-за этого кто-то перепутает всего одну букву или цифру. Мы можем разбомбить не то место."
1602003-30 = "Поэтому мы проговариваем буквы словами, чтобы исключить такие ошибки."
1602003-31 = "Например, FOX из FOX Squad будет Foxtrot-Oscar-X-ray."
1602003-32 = "[ns] «Интересно.»"
1602003-34 = "[ns3] «Но когда так перечисляешь каждую букву...»\n[ns4] «Разве передавать сообщение не становится ужасно долго?»"
1602003-37 = "Мы используем это только там, где нельзя допустить путаницы: например Tango down или точка Alpha. Если проговаривать фонетическим кодом всё подряд, это займёт вечность."
1602003-38 = "Хотите попробовать, Сенсей?"
1602003-39 = "[s] «Я не успею за вами.»"
1602003-40 = "Вот, просто идите по алфавиту. И никакого риска всё равно нет. Это же не настоящая операция."
1602003-41 = ""
1602003-43 = ""
1602003-45 = ""
1602003-46 = "Говорит FOX 4. Штаб, ответьте."
1602003-47 = "[s] «Г-Говорит Шале... То есть Sierra 1. Сообщение принято.»"
1602003-48 = "FOX 4. Подтверждаю."
1602003-49 = "Sierra 1. Что входит в доставку дневного перекуса?"
1602003-50 = "[s5] «...Перекуса?»\n[s6] «Если хочешь, в холодильнике есть торт.»"
1602003-53 = "Что? Не слышу!"
1602003-54 = "Тррр, тррр! Слишком много помех! Вы сказали cake или shake?"
1602003-55 = "[ns] «Повторяю передачу, FOX 4.»"
1602003-57 = "[ns] «Сегодняшний перекус — Charlie-Alpha-Kilo-Echo. Приём.»"
1602003-58 = "Фуфу. Значит, торт."
1602003-59 = "Sierra 1, пожалуйста, проверьте, какие есть вкусы."
1602003-60 = "[s] «Предпочитаешь Charlie или Sierra?»"
1602003-61 = "Шоколад или клубника... Конечно Sierra!"
1602003-63 = ""
1602003-64 = "[ns7] «На самом деле это довольно весело, когда попробовал.»\n[ns8] «Может, всё не так сложно.»"
1602003-67 = "Да. Некоторые термины немного специфические, но ничем не отличаются от военного жаргона."
1602003-68 = "С практикой фонетический код может начать использоваться совершенно естественно."
1602003-69 = "[s] «Вообще-то мне кажется, мне не стоит им пользоваться.»"
1602003-70 = "А? Почему? Он полезен для безопасности и связи."
1602003-71 = "[ns] «Но я учитель.»"
1602003-73 = "[ns9] «Я хочу говорить со студентами максимально честно, без кодов.»\n[ns10] «Хочу, чтобы они знали: я никогда ничего не пытаюсь скрыть.»"
1602003-76 = "Ого, то, что вы сказали, — прямо Sierra Hotel."
1602003-77 = "[s11] «...S, H?»\n[s12] «Это сокращение от чего?»"
1602003-80 = ""
1602003-82 = ""
1602003-83 = "А, н-ну..."
1602003-84 = "Я имею в виду, это подходит S-Сенсей из Шале!"
1602003-85 = "О, если подумать... Мы слишком долго болтали."
1602003-86 = "Вернусь на место и продолжу отчёт."
1602003-87 = ""
1602003-89 = ""
1602003-90 = ""
1602003-92 = "Отоги неловко сменила тему на отчёт, явно чего-то смутившись."
