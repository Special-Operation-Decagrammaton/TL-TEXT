[translation]
1013605-1 = "Помехи сигнала"
1013605-2 = "Я нашёл координаты последнего сигнала Эйми и поспешил туда настолько быстро, насколько мог."
1013605-3 = "Всю дорогу я молился, чтобы худшее не случилось."
1013605-5 = ""
1013605-6 = "Я-хо! Сюда, Сенсей. Я вас ждала."
1013605-7 = "[ns] «...!»"
1013605-9 = "[ns] «Эйми!»"
1013605-10 = "?!"
1013605-11 = "Ч-Что случилось, Сенсей?"
1013605-12 = "Вы... злитесь?"
1013605-13 = "[s] «...»"
1013605-14 = "..."
1013605-15 = "А, понятно..."
1013605-16 = "..."
1013605-17 = "Простите, Сенсей. Я..."
1013605-18 = "[s] «Пока что давай поговорим по дороге обратно.»"
1013605-19 = "..."
1013605-20 = "Принято..."
1013605-21 = "[s] «...Я рад, что ты цела.»"
1013605-22 = "Д-Да..."
1013605-24 = ""
1013605-25 = "Ну... Я была на разведывательной миссии. Но на обратном пути попала в стычку."
1013605-26 = "Я переборщила с огневой мощью, и батарея рюкзака разрядилась."
1013605-27 = "Всё моё оборудование работает от энергетических элементов, питающих рюкзак."
1013605-28 = "Вражеский отряд я уничтожила, но ценой... Ну, дальше вы уже знаете."
1013605-29 = "[s1] «...Понятно. Вот что произошло.»\n[s2] «А если бы с тобой что-нибудь случилось...?»"
1013605-32 = "Это... Простите."
1013605-33 = "Но мне пришлось учитывать все факторы."
1013605-34 = "Самым эффективным было уничтожить разведгруппу до того, как она нашла нашу базу."
1013605-35 = "А? Никакая эффективность не компенсирует недостаток безопасности?"
1013605-36 = "..."
1013605-37 = "Понятно."
1013605-38 = "Теперь вижу это с вашей точки зрения."
1013605-39 = "Простите, Сенсей. Пожалуйста, не сердитесь."
1013605-40 = "Вы сейчас выглядите довольно страшно, Сенсей."
1013605-41 = "Обещаю. Отныне я всегда буду ставить свою безопасность на первое место, хорошо?"
1013605-42 = "Больше никогда так не сделаю. Обещаю."
1013605-44 = ""
1013605-45 = "И всё же..."
1013605-46 = "Я не ожидала, что всё закончится именно так."
1013605-47 = "База была достаточно близко, и я успела отправить сигнал бедствия до того, как батарея села."
1013605-48 = "Я понимала, что лучше не двигаться с места."
1013605-49 = "..."
1013605-50 = "...Знаю. Теперь я оправдываюсь."
1013605-51 = "..."
1013605-52 = "Странно."
1013605-53 = "Раньше я считала оправдания неэффективными по самой своей сути."
1013605-54 = "Время, потраченное на придумыванием оправданий, можно было бы направить на решение ситуации. Поэтому для меня они не имели смысла."
1013605-55 = "..."
1013605-56 = "Но теперь я, возможно..."
1013605-57 = "Я просто не хочу, чтобы вы меня ненавидели, Сенсей."
1013605-58 = "[s3] «Это неправда. Я никогда не смогу тебя ненавидеть, Эйми.»\n[s4] «Я просто... очень, очень переживал. И боялся.»"
1013605-61 = "..."
1013605-62 = "Хи-хи. Спасибо."
1013605-63 = "Иногда мне трудно понять, что правильно, а что нет."
1013605-64 = "Иногда мне трудно понять, что правильно, а что нет."
1013605-65 = "Поэтому у меня есть просьба."
1013605-66 = "[s] «Просьба?»"
1013605-67 = ""
1013605-68 = "Эйми на мгновение замялась."
1013605-69 = "Закрыв глаза, она глубоко вдохнула, чтобы успокоиться."
1013605-70 = ""
1013605-72 = ""
1013605-73 = ""
1013605-74 = ""
1013605-75 = "Пожалуйста, присматривайте за мной."
1013605-76 = "Пожалуйста, не спускайте с меня глаз."
1013605-77 = "Пожалуйста, помогайте мне не сбиться с правильного пути."
1013605-78 = "Я всегда делала всё по-своему."
1013605-79 = "И иногда я забывала, что мои поступки могут волной затрагивать тех, кому я небезразлична."
1013605-80 = "А теперь?"
1013605-81 = "Когда вы рядом со мной, Сенсей, я..."
1013605-82 = "Я точно знаю, что всё получится."
1013605-83 = ""
1013605-85 = ""
1013605-86 = ""
1013605-87 = ""
1013605-88 = "А? Птицы однажды должны покинуть гнездо и полететь сами?"
1013605-89 = "Это так, но..."
1013605-90 = "Я всё ещё на первом году старшей школы. У меня ведь ещё есть немного времени посидеть в гнезде, верно?"
1013605-91 = "[s] «А? Если подумать, ты права.»"
1013605-92 = "Хи-хи."
1013605-93 = "И даже если однажды я всё-таки покину гнездо..."
1013605-94 = "Сейчас это чисто гипотетически."
1013605-95 = "Мне всё равно придётся найти партнёра, с которым я проведу жизнь, правда?"
1013605-96 = "[s] «Ч-Что ты имеешь в виду?!»"
1013605-97 = ""
1013605-99 = "Ничего. Просто захотелось сказать."
1013605-100 = "Да. Правда, мне просто хотелось попробовать."
1013605-101 = "Но знаете, Сенсей?"
1013605-102 = ""
1013605-104 = ""
1013605-105 = ""
1013605-107 = "Ваше лицо уже не такое страшное."
