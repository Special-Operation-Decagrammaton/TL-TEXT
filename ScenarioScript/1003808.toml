[translation]
1003808-1 = "SRT, перерыв!"
1003808-2 = "Парк Коусаги"
1003808-3 = ""
1003808-4 = "Мияко выглядела необычайно расслабленной, положив подбородок на сложенные руки."
1003808-5 = "Она совсем не заметила, как я подошёл."
1003808-6 = "Какой хороший день."
1003808-7 = "[s] «Привет, Мияко.»"
1003808-8 = "С-Сенсей? Давно вы здесь?"
1003808-9 = "Что-то случилось? Новая миссия?"
1003808-10 = "Простите? Вы... волновались?"
1003808-11 = "А. Моё сообщение. Ха-ха-ха, прошу прощения."
1003808-12 = "Мне стало неловко писать вам без особой причины, поэтому я остановилась."
1003808-13 = "Мне показалось странным связываться с вами, когда ничего не случилось."
1003808-14 = "[s1] «Чтобы написать мне, не обязательно должно что-то случиться.»\n[s2] «Мне даже приятнее, когда ты пишешь просто так.»"
1003808-15 = "Хи-хи. Спасибо, что успокоили меня, Сенсей."
1003808-16 = "Хи-хи. Спасибо, что успокоили меня, Сенсей."
1003808-17 = "Тогда, если у вас есть время, посидите со мной на солнце."
1003808-18 = "Его тепло расслабляет."
1003808-19 = ""
1003808-21 = "[s] Сесть рядом с Мияко."
1003808-23 = ""
1003808-25 = ""
1003808-26 = "Вам не обязательно садиться так далеко."
1003808-27 = "Кролики, возможно, и не умирают от одиночества, но я ведь не кролик."
1003808-29 = "Я провёл спокойный день вместе с Мияко, а затем вернулся в Шале."
