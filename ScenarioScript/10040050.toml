10040050-361 = "[ns27] «(...Она правда ушла?)»\n[ns28] «(...Всё закончилось? Правда закончилось?)»"
10040050-368 = "УА-А-А...!!"
10040050-369 = "Я думала, мне КОНЕЦ! Причём сразу во многих смыслах!"
10040050-370 = "Всё это было настолько жутко, будто по сценарию. Как сцена из хоррор-игры или что-то такое."
10040050-371 = "Я никогда раньше не смотрела на что-то настолько заворожённо. Честно, это было невероятно."
10040050-372 = "Как бы то ни было, мы каким-то образом преодолели и это препятствие."
10040050-373 = "И с хорошей стороны — они, скорее всего, решат, что это место уже проверено. Так что теперь оно для нас вроде безопасной зоны."
10040050-374 = "Похоже, звонок был срочный. Некоторое время она не будет нам мешать."
10040050-375 = "Мне очень, очень хочется взломать местные камеры и посмотреть, что происходит, но..."
10040050-376 = "...это просто приведёт Чихиро прямо к нам."
10040050-377 = "Именно. Так что пока придётся обходиться имеющейся информацией."
10040050-378 = "...Что дальше, Сенсей?"
10040050-379 = "[s29] «Уходим отсюда прямо сейчас.»\n[s30] «Нет смысла задерживаться.»"
10040050-382 = "Согласна. Мы всё ещё можем вывести вас, просто следуйте указаниям."
10040050-383 = "Верно. Мы с вами до самого конца."
