[translation]
10040050-1 = "Эпизод 5;Гремящий шкаф"
10040050-10 = "*тяжело дышит*... Мы как-то... добрались..."
10040050-11 = "Я уже думала, нам конец, когда Сенсей запретил ломать дронов, но мы справились!"
10040050-13 = "Отличная работа, вы обе. Всё прошло гораздо легче, чем я ожидала."
10040050-14 = "Это задние ворота. Ну, не ТЕ САМЫЕ задние ворота. Их тут куча, потому что здание огромное."
10040050-15 = "Мы выбрали эти, потому что ими раньше вообще не пользовались. Так что шанс кого-то встретить здесь почти нулевой."
10040050-16 = "Если просто открыть ворота..."
10040050-17 = ""
10040050-22 = "...?"
10040050-23 = "...Хм?"
10040050-24 = "Просто... открыть... ворота...?"
