10040050-30 = ""
10040050-31 = ""
10040050-32 = "А?"
10040050-33 = "Не работает."
10040050-34 = "Что? Почему не работает?"
10040050-35 = "Дай я попробую. Эм..."
10040050-36 = ""
10040050-38 = ""
10040050-41 = "А? Как такое возможно? Почему не работает?"
10040050-42 = ""
10040050-44 = ""
10040050-47 = "Какого чёрта? Кто-то разворачивает код в обратную сторону!"
10040050-48 = "Харе, нужно немедленно оборвать соединение! Кто бы это ни был, он пытается вычислить наше местоположение!"
10040050-49 = "Не может быть! Я не успеваю! Он на один... нет, на два шага впереди меня!"
10040050-50 = "[s1] «Обратный взлом...?» \n[s2] «Кто-то лучше Котамы и Харе?!»"
10040050-53 = "Сенсей! Вам нужно уходить оттуда, сейчас же! Скоро камеры снова заработают!"
10040050-54 = "Мы не можем противостоять им напрямую. Нас просто разносят. Это как..."
10040050-55 = "Погоди. Я знаю этот стиль... этот метод..."
10040050-56 = ""
10040050-58 = ""
10040050-60 = "...Это вице-президент?!"
10040050-61 = "Уходите, уходите! Сейчас!"
10040050-63 = "Ч-что за...? Вы серьёзно?!"
10040050-64 = "Мы наконец дошли сюда, а теперь вы хотите, чтобы мы вернулись?! Вы вообще ничего не можете сделать?!"
10040050-65 = "Знаю, знаю! Но другого выхода нет!"
10040050-66 = ""
10040050-68 = ""
10040050-69 = ""
10040050-70 = ""
10040050-71 = ""
10040050-72 = ""
10040050-73 = ""
10040050-75 = "...Быстрее!"
10040050-76 = ""
10040050-78 = ""
10040050-79 = "[ns3] Схватить Коюки за руку и бежать.\n[ns4] «Давай пока убираться отсюда, Коюки!»"
10040050-82 = "УВА-А-А! Да не может быть!!"
10040050-83 = ""
10040050-103 = "*тяжело дышит* Мне что, теперь вечно бегать?!"
10040050-105 = "Я потеряла бдительность. Если подумать, это было неизбежно."
10040050-106 = "Да. В последнее время Чихиро прочёсывала множество систем безопасности Миллениум... включая Семинар."
10040050-107 = "Естественно, она вмешалась в такой ситуации, даже удалённо..."
10040050-108 = "Это серьёзно усложняет наш план."
10040050-109 = "Да... В хакерстве мне вице-президента не победить."
10040050-111 = "И что это значит для нас? Мы теперь застряли здесь до утра?"
10040050-112 = "Не согласна! Даже если наступит утро, я всё равно найду способ! Так или иначе!!"
10040050-114 = "...Нет."
10040050-115 = "Это не совсем невозможно. В лоб вице-президента нам не победить..."
10040050-116 = "...но и необязательно. Парадоксально, но решением может стать более аналоговый подход."
10040050-117 = "[s5] «Аналоговый...?»\n[s6] «Что ты имеешь в виду?»"
10040050-120 = "В конце концов, вице-президент управляет системой безопасности удалённо. Это кибербитва."
10040050-121 = "А значит, там, где нет цифровой системы безопасности, даже она ничего не сможет сделать."
10040050-122 = "Например, то место, где вы сейчас, — частная зона, поэтому системы там нет."
10040050-124 = "...Или можно вспомнить старые помещения, которые давно не ремонтировали. В их планировке наверняка полно заброшенных и забытых проходов."
10040050-125 = "Забытых проходов...? Каких старых помещений?"
10040050-126 = "Здание Семинар может быть центром Миллениум, но оно также самое старое и самое большое."
10040050-128 = "Из-за бесконечных расширений и перестроек старые помещения неизбежно оказывались забыты."
10040050-129 = "В здании полно проходов, которыми не пользовались годами."
10040050-130 = "Я следила за маршрутами, пока мы двигались, и нашла несколько вариантов."
10040050-131 = "[ns7] «Ты и правда быстро работаешь.»\n[ns8] «Потрясающе, вы обе.»"
10040050-134 = "Там может быть темно и страшно, но... выбора у нас сейчас нет."
10040050-135 = "Угх, не люблю грязные места. Совсем нет нормальных ухоженных проходов?"
10040050-136 = "И мне может стать холодно, я же в пижаме."
10040050-137 = "О-о-о, а можно найти маршрут с автоматами? Я проголодалась!"
10040050-138 = ""
10040050-141 = ""
10040050-142 = ""
10040050-143 = "Сенсей..."
10040050-144 = "...Она обязательно должна идти с нами?"
10040050-146 = "Чееееего?! Это ещё что значит? Что я вообще сделала?"
10040050-147 = "[s9] «Прости... Она просто такая...»\n[s10] «Постарайтесь понять... Она ещё молодая...»"
10040050-150 = "Отныне я буду добрее к Маки."
10040050-151 = "В любом случае другого пути нет. Более того, вам стоит быть благодарными, что в такой ситуации вообще есть хоть какой-то путь."
10040050-152 = "Итак, для начала..."
10040050-153 = "...Погоди."
10040050-154 = "Минутку... Я фиксирую звуковые волны с противоположного конца коридора. Они быстро приближаются."
10040050-155 = "Этот звук..."
10040050-156 = ""
10040050-158 = ""
10040050-161 = ""
10040050-162 = "Это шаги...!!"
10040050-163 = "Прячьтесь, сейчас же! Кто-то идёт!"
10040050-164 = ""
10040050-167 = "Ш-шаги, ШАГИ?! Кто это?! Кто вообще может быть?!"
10040050-168 = "А кто ещё?! Хватит задавать тупые вопросы и прячься!"
10040050-170 = "Г-где спрятаться?! Где мне прятаться?!"
10040050-171 = "...Стена? Может, если вот так прижаться к стене?!"
10040050-172 = "Тебя прекрасно видно. Тебя поймают моментально."
10040050-173 = ""
10040050-177 = "Угх...! Что делать?!"
10040050-178 = "[ns11] «Сбоку какая-то дверь.»\n[ns12] «Давайте пока зайдём туда.»"
10040050-181 = "Правда?! ...Ладно!"
10040050-182 = "Быстрее! Времени нет!"
10040050-183 = "Скорее...!!"
10040050-184 = ""
