[translation]
1007702-1 = "Хорошее поручение"
1007702-2 = "Я заехал в Тринити по делам Шале."
1007702-3 = "У главных ворот меня уже ждала Ичика."
1007702-4 = "..."
1007702-5 = "...Ах."
1007702-6 = "Сенсей, сюда!"
1007702-7 = "Как вы умудряетесь приходить точно вовремя, когда у вас столько работы? Я думала, вы задержитесь."
1007702-8 = "[s1] «Это часть моей работы.»\n[s2] «Но даже если бы не была, я бы не заставил тебя ждать.»"
1007702-11 = "Ахаха! Ну, ради меня так стараться было необязательно."
1007702-12 = "Но приятно это слышать. И есть ощущение, что это поручение понравится мне больше обычной работы."
1007702-13 = "Пожалуй, сегодня мой счастливый день."
1007702-14 = "...Хм?"
1007702-15 = "А, ну, моя обычная работа — это..."
1007702-16 = "Обычно я связываюсь со студентами разных академий, патрулирую места возможных столкновений, разнимаю драки..."
1007702-17 = "Знаете, в основном охрана и посредничество. Хаха."
1007702-18 = "Но сегодня никто другой из команды не смог выкроить на это время, так что вот я здесь."
1007702-19 = "Не то чтобы это плохо. Вообще-то я даже рада, что всё так сложилось!"
1007702-20 = "Так лучше."
1007702-21 = "Патрулировать или предотвращать драки в напряжённых ситуациях скучно по сравнению с этим поручением."
1007702-22 = "Даже сравнивать смешно."
1007702-23 = "[s3] «Верно. Хотя ни то ни другое не шутка...»\n[s4] «Понимаю тебя. Я такой же.»"
1007702-26 = "Ахахаха! Какой честный ответ! С вами легко себя ассоциировать."
1007702-27 = "Рада, что вы понимаете. Но всё же..."
1007702-28 = "Надеюсь, вы останетесь таким же понимающим, если сегодня всё пойдёт не по плану, Сенсей. Иногда мне кажется, что я притягиваю проблемы! Хаха."
1007702-29 = "Кхм... В общем, нам стоит идти, пока не стало неловко."
1007702-30 = "Сюда."
1007702-31 = ""
1007702-33 = ""
1007702-36 = "Мы почти пришли. Сразу за—"
1007702-37 = "А?"
1007702-38 = ""
1007702-39 = "Ты шутишь, да? Драку хочешь начать?"
1007702-40 = "Ты же не думаешь всерьёз, что тайяки и лунные пирожки со сливовым цветом — одно и то же..."
1007702-41 = "И то и другое — выпечка с красной бобовой пастой, разве нет? В чём разница?"
1007702-42 = "Да что за...?! Невежественный ребёнок! Я бы тебе—"
1007702-43 = "Ты бы что? Подралась с нами? Пф! Будто у тебя вообще есть шанс!"
1007702-45 = "Эм, простииите?!"
1007702-46 = ""
1007702-47 = "Уф. Опять они. Можно было подумать, что они уже переросли эти бесконечные перепалки..."
1007702-48 = "...Хм?"
1007702-49 = "Не уверена, что моё вмешательство необходимо."
1007702-50 = "...Хм. Да, как член Отряда правосудия..."
1007702-51 = "Наверное, мне стоит вмешаться."
1007702-52 = "Но что я вообще могу сделать?"
1007702-53 = ""
1007702-55 = ""
1007702-56 = "...Сейчас моё поручение — сопровождать Сенсея, а не поддерживать порядок."
1007702-57 = "Было бы странно лезть в спор, пока никто ещё не начал стрелять."
1007702-58 = "А если всё выйдет из-под контроля, на дежурстве достаточно других членов Отряда правосудия, которые смогут вмешаться... Моё сегодняшнее поручение — вы, Сенсей."
1007702-59 = "Если мы с вами будем вмешиваться в каждую мелочь, вы никогда не закончите всю свою работу."
1007702-60 = "[s5] «Спасибо, что думаешь о моём расписании.»\n[s6] «Ты очень гибкая.»"
1007702-63 = "Ну да. Если дело не совсем серьёзное, лучше просто принимать удары судьбы как есть. Как говорят, всё хорошо, что хорошо кончается, верно?"
1007702-64 = "...Хм?"
1007702-65 = "Не часто такое слышите? А, вы имеете в виду — от других членов Отряда правосудия."
1007702-66 = "Ахахаха! Кажется, я понимаю, о чём вы."
1007702-67 = "Остальные в Отряде правосудия могут быть немного... упрямыми."
1007702-68 = "Не то чтобы это плохо. По-моему, в этом есть что-то крутое."
1007702-69 = "Но я предпочитаю относиться ко всему проще."
1007702-70 = "Ну что же. Пойдём к следующей точке! Если будем весь день стоять и болтать, ничего не сделаем."
1007702-71 = "Я пойду впереди. Следуйте за мной!"
1007702-72 = ""
1007702-74 = ""
1007702-76 = "По дороге нам встретилось ещё несколько проблем, но Ичика легко с ними справлялась."
1007702-77 = "Однако к тому моменту, когда мы закончили всё по расписанию Шале, день уже перевалил далеко за полдень."
1007702-79 = "Хм... Кажется, всё."
1007702-80 = "Хорошая работа, Сенсей! Мы сумели закончить всё за один день!"
1007702-81 = "[s7] «И всё благодаря тебе, Ичика.»\n[s8] «Ты сегодня очень помогла.»"
1007702-84 = "Кто? Я?"
1007702-85 = "А-а-а... Хватит меня хвалить. Это смущает..."
1007702-86 = "К тому же для меня это была приятная смена обстановки. Если бы работа всегда была такой, она бы мне даже нравилась."
1007702-87 = "Вообще-то, если вы не против, Сенсей..."
1007702-88 = "Я бы с удовольствием помогла вам и в следующий раз, когда вы придёте. Хаха..."
1007702-89 = "...Уф. Я лишнего сказала, да?"
1007702-90 = "Может, я просто... провожу вас сейчас?"
1007702-91 = "А потом смогу закончить свою работу."
1007702-92 = "А?"
1007702-93 = "О, ничего серьёзного. Нужно лишь разобраться с теми незавершёнными делами, что остались раньше."
1007702-94 = "Ну, с той дракой и другими проблемами, на которые мы наткнулись."
1007702-95 = "Как член Отряда правосудия, я должна проверить, что всё окончательно улажено."
1007702-96 = "Я ничего не забыла. Просто решила... что ваша работа важнее. Моя могла подождать."
1007702-97 = "...А?"
1007702-98 = "Вы уверены, что хотите пойти со мной?"
1007702-99 = ""
1007702-101 = ""
1007702-102 = "То есть я ценю этот жест, но... зачем?"
1007702-103 = "Это моя проблема, мне с ней и разбираться..."
1007702-104 = "[s9] «Это такая же часть моей работы, как и всё остальное.»\n[s10] «Технически именно из-за меня ты обнаружила все эти проблемы.»"
1007702-107 = "Правда? По-моему, ко мне это вообще не относится."
1007702-108 = "Но если вам так будет спокойнее..."
1007702-109 = "Эм... М-м... Эм..."
1007702-110 = "..."
1007702-111 = "...Хаха."
1007702-112 = "Ладно. На этом этапе с моей стороны уже было бы грубо отказаться."
1007702-113 = "Но мне всё равно кажется, будто я пользуюсь вашей добротой..."
1007702-114 = "Хи-хи! Ну же! Пойдём разберёмся вместе!"
1007702-115 = "О, и я знаю, что сказала, будто ничего серьёзного, но..."
1007702-116 = "Это всё равно займёт время. Скорее всего, к тому моменту, когда закончим, уже стемнеет, так что я провожу вас обратно, Сенсей."
1007702-117 = "Так..."
1007702-118 = "Мне будет гораздо спокойнее, если я буду знать, что вы благополучно добрались домой."
1007702-120 = "Я помог Ичике закончить последние обязанности, а потом она с удовольствием проводила меня до самого Шале."
