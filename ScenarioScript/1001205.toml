[translation]
1001205-1 = "Время с Тренером"
1001205-2 = "Спортзал Миллениума"
1001205-3 = "Тренер! Ты пришёл."
1001205-4 = "Я ждала тебя."
1001205-5 = "Как себя сегодня чувствуешь?"
1001205-6 = "[s] «А? Нормально, вроде.»"
1001205-7 = ""
1001205-8 = ""
1001205-9 = ""
1001205-10 = "Да, выглядишь хорошо."
1001205-11 = "Думаю, ты в отличной форме для моего большого плана."
1001205-12 = "А? О чём я?"
1001205-13 = ""
1001205-14 = ""
1001205-15 = "Хи-хи. Вот об ЭТОМ!"
1001205-16 = "(Сумирэ протягивает мне телефон с планом тренировок.)"
1001205-17 = "[s] «Ты составила ещё один план тренировок?»"
1001205-18 = "Я решила, что моя тренировка может быть слишком тяжёлой."
1001205-19 = "А? А что со старым планом?"
1001205-20 = "Ну... мне ведь всё равно придётся его придерживаться, правда?"
1001205-21 = "[s] «То есть ты собираешься выполнять два плана тренировок в день?»"
1001205-22 = "Эм..."
1001205-23 = "Кажется, мы друг друга не поняли, Тренер."
1001205-24 = "План, который я тебе показала, не для меня. Посмотри внимательнее."
1001205-25 = "[s] Ещё раз посмотреть план по просьбе Сумирэ."
1001205-26 = ""
1001205-28 = "(«План тренировок Тренера». Вроде обычный — подождите-ка!)"
1001205-29 = "[s] «Под „Тренером“ имеется в виду...?»"
1001205-30 = "Ага! Это план для моего тренера, [USERNAME]!"
1001205-31 = "Хи-хи. Ну как? Нравится?"
1001205-32 = "Я составила программу специально для тебя, используя весь свой опыт фитнес-тренировок!"
1001205-33 = "Сначала десять минут лёгкой растяжки для разминки."
1001205-34 = "Потом примерно двадцать минут на беговой дорожке..."
1001205-35 = "[s1] «П-постойте секунду!»\n[s2] «Протестую!»"
1001205-36 = "Что? Что не так?"
1001205-37 = "Что? Что не так?"
1001205-38 = "А, понимаю. Для персонального тренера такая тренировка была бы слишком лёгкой."
1001205-39 = "После разминки я добавила только несколько лёгких упражнений с весами."
1001205-40 = "Наверное, стоит на всякий случай сделать альтернативную версию."
1001205-41 = ""
1001205-42 = ""
1001205-43 = ""
1001205-44 = "Хорошо, Тренер! Что скажешь об этой?"
1001205-45 = "[s] «З-Знаешь что? По-моему, первый вариант был идеален!»"
1001205-46 = "Хм? Уверен?"
1001205-47 = "Ты выглядишь не совсем убеждённым."
1001205-48 = "[s] «Конечно! Мне очень нравится первый вариант! Ты гений, Сумирэ!»"
1001205-49 = "Ахаха! Ну хватит, Тренер."
1001205-50 = "В таком случае сегодняшний день стоит запомнить."
1001205-51 = "Мне выпала возможность быть тренером собственного тренера."
1001205-52 = "Хм? А моя тренировка?"
1001205-53 = "Ты всегда такой внимательный."
1001205-54 = "Конечно, я закончила её заранее, чтобы освободить время для тебя."
1001205-55 = "А? Что это у тебя за выражение...?"
1001205-56 = "О, поняла! Ты просто не можешь дождаться начала, да?"
1001205-57 = "Отлично! Тогда начинаем!"
1001205-58 = "Давай, быстрее!"
1001205-60 = "(После обязательной растяжки Сумирэ мне в итоге пришлось встать на беговую дорожку.)"
1001205-62 = "*тяжело дышит* *тяжело дышит*"
1001205-63 = "Я думала, что смогу немного побегать вместе с тобой."
1001205-64 = "Может, я так быстро устала потому, что уже тренировалась раньше."
1001205-65 = "Ты тоже выглядишь уставшим. Может, немного отдохнём?"
1001205-66 = "[s] «*тяжело дышит* *тяжело дышит* Ладно.»"
1001205-69 = "― Ну как, Тренер? Тебе нравится твой план тренировок?[wa:2900]"
1001205-71 = "― Чувствуешь, как горят мышцы?[wa:1260]"
1001205-74 = "― О-О... Тренер, ты на меня смотришь.[wa:3060]"
1001205-76 = "― (Я знаю, после тренировки выгляжу ужасно...)"
1001205-79 = "― Ч-Что... ты рассматриваешь?[wa:560]"
1001205-82 = "― Тренер, у меня к тебе просьба.[wa:1660]"
1001205-84 = "― Я хочу, чтобы ты пообещал продолжать тренироваться вместе со мной.[wa:1380]"
1001205-87 = "― Я хочу, чтобы ты оставался здоровым.[wa:1800]"
1001205-89 = "― П-Почему? П-Потому что... Хи-хи.[wa:5780]"
1001205-92 = "― Разве не очевидно?"
1001205-95 = "(Мы закончили оставшуюся часть плана тренировок Сумирэ.)"
1001205-97 = "Школа Миллениум"
1001205-98 = "Тебе понравилось тренироваться со мной сегодня, Тренер?"
1001205-99 = "[s3] «Хе-е, хе-е-е-е... Д-да.»\n[s4] «Хм. Мне этого было недостаточно.»"
1001205-100 = "Хи-хи. Рада, что тебе понравилось."
1001205-101 = "Я много думала над этой тренировкой."
1001205-102 = "...?!"
1001205-103 = "Т-Тренер, это потрясающе."
1001205-104 = "Может, всё-таки стоит перейти на более тяжёлый план, который я составила..."
1001205-105 = "[s5] «О, ахаха. Я просто пошутил!»"
1001205-106 = "Хи-хи. Я тоже."
1001205-107 = "В любом случае мне нравится, когда мы тренируемся вместе."
1001205-108 = "Я знаю, работа держит тебя занятым, поэтому не буду заставлять..."
1001205-109 = "Но если найдёшь время, я бы очень хотела продолжать тренироваться с тобой..."
1001205-110 = "...Тренер."
