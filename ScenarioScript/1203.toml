[translation]
1203-1 = "Горничные в смятении, часть 2"
1203-4 = "Пожалуйста, не двигайся. Волосы растрёпываются."
1203-5 = "Это... правда происходит...? Кто-нибудь, пожалуйста... разбудите меня..."
1203-7 = "Костюмы были прикрытием... просто прикрытием..."
1203-8 = "Считай это обычной работой. Мы получили заказ. Подписали контракт. Теперь надо просто сделать то, для чего нас наняли."
1203-9 = "А? Ты что... рада? Тебе это нравится?"
1203-10 = "Ну... Эм..."
1203-11 = "В любом случае с твоей стороны было безответственно явиться в таком растрёпанном виде."
1203-12 = "Это не моя вина! По дороге я наткнулась на толпу хулиганок!"
1203-13 = "Ну-ну. Пожалуйста, не двигайтесь обе. Особенно ты, Нэру. Твои косички запутываются."
1203-14 = "Хмф. Я нормально выгляжу."
1203-15 = ""
1203-18 = "Обычно я бы согласилась, но это не обычная миссия. Нам нужно обслуживать клиентов!"
1203-19 = "Я уже почти закончила. Просто посиди спокойно ещё немного, чтобы мой труд не пропал зря, хорошо?"
1203-20 = "И... ещё кое-что... Может, сегодня снимешь куртку?"
1203-21 = "Ты! Решила меня разозлить? Куртку не трогай."
1203-22 = "Я вообще-то могу уйти. Мы с курткой всегда можем вернуться домой."
1203-23 = "Ха-ха! Ладно-ладно. Оставляй куртку. Просто немного приведём в порядок волосы."
1203-24 = "*вздыхает*"
1203-25 = "Всё равно. Делай что хочешь."
1203-26 = "Хи-хи..."
1203-29 = "Готово! Выглядит чудесно."
1203-30 = "Отлично. Выглядит... ровно так же."
1203-31 = "Хм, по-моему, ты стала гораздо опрятнее."
1203-32 = "Ты... не видишь разницы?"
1203-33 = "Ну, может, ты и права."
1203-34 = "Возможно, мне не хватает навыков, чтобы полностью раскрыть твой потенциал..."
1203-35 = "Аргх! Нет! Всё нормально! Просто прекрати!"
1203-36 = ""
1203-38 = ""
1203-39 = "Кстати, где позывной Ноль-Один?"
1203-40 = "Асуна втянула нас в этот бардак, а потом просто исчезла?"
1203-41 = ""
1203-44 = ""
1203-45 = ""
1203-50 = ""
1203-51 = "Нет, я здесь! Вы уже закончили готовиться? Ого!"
1203-53 = "Ты где, чёрт возьми, была?"
1203-54 = "А, я?"
1203-55 = "Снаружи искала клиентов! Вы же просили меня приводить людей, помните?"
1203-56 = "Ч-Что? Клиентов?"
1203-57 = "Обычно клиентов приглашают ПОСЛЕ открытия заведения."
1203-58 = ""
1203-60 = ""
1203-62 = "Хотя... толпа впечатляющая."
1203-64 = "Столько людей! Невероятно. Что ты сделала, Асуна?"
1203-65 = "...? А? Да ничего особенного."
1203-66 = "Я просто сказала, что у нас работает мейд-кафе. И все пошли за мной!"
1203-67 = "Понятно. Наверное, именно об этом и говорила Юука."
1203-68 = "Раз большинство наших кафе немного необычные, конечно люди потянутся к обычному мейд-кафе."
1203-69 = "Я примерно этого ожидала, но..."
1203-70 = "Что ж, надеюсь, все готовы к очень загруженному дню!"
1203-71 = "Времени нет. Нужно сосредоточиться..."
1203-72 = "Давайте разберёмся... то есть обслужим господ."
1203-73 = "Карин... Я знаю, ты в восторге, но при гостях обязательно используй правильные выражения."
1203-75 = "Ты уже вообще не пытаешься скрывать свой восторг!"
1203-76 = "Все готовы? Открывать дверь?"
1203-77 = "С-Стой! Подожди. Мы и правда будем называть их «господами»? Я вообще не готова!"
1203-79 = "Ладно! Мы официально открыты!"
1203-80 = ""
1203-83 = ""
1203-85 = "Добро пожаловать, господа!"
1203-86 = ""
1203-96 = "(Неделю спустя...)"
1203-100 = ""
1203-101 = "Ни за что..."
1203-102 = "Эта цифра верная? Такая выручка... Мы столько заработали за одну неделю?!"
1203-103 = "Если бы наши школьные фестивали с самого начала были такими, тогда—"
1203-104 = ""
1203-106 = ""
1203-107 = "Нет, простите. Сейчас не время. Я пришла поблагодарить вас."
1203-108 = "Я знаю, это был заказ, но от имени торгового района и Семинар — спасибо. Вы проделали невероятную работу."
1203-109 = "Не могу поверить, что мы больше не в минусе... Этого хватит даже оплатить ремонт всего, что вы взрывали!"
1203-110 = "Прекрасно слышать. Приятно хоть раз увидеть улыбку на твоём лице!"
1203-111 = "Ой, да я не всегда в плохом настроении. Я умею ценить редкие хорошие новости!"
1203-112 = "Однако..."
1203-113 = "...Хотя?"
1203-114 = "Что такое? Ещё на что-то пожаловаться хочешь?"
1203-115 = "Нет! Нет, ничего подобного."
1203-116 = "Просто... Эм..."
1203-117 = "Мне кажется, одной недели было мало... Можно с этим что-нибудь сделать?"
1203-118 = "Сделать...? Ты о чём?"
1203-119 = "Ну, эм..."
1203-120 = ""
1203-122 = ""
1203-123 = ""
1203-124 = ""
1203-125 = ""
1203-127 = "Уважаемый президент C&C, позвольте сказать—"
1203-129 = "Что?!"
1203-130 = "Не называй меня так! Это суперстранно!"
1203-131 = "Случайно..."
1203-132 = "Ну, раз уж мы доказали, что это работает..."
1203-133 = ""
1203-135 = ""
1203-136 = ""
1203-137 = ""
1203-139 = "Вы не думали распустить своё шпионское агентство и преобразовать его в мейд-кафе?"
1203-140 = ""
1203-143 = ""
1203-144 = "А?"
1203-145 = ""
1203-147 = ""
1203-149 = "Что?"
1203-150 = "Простите?"
1203-152 = "Ну, как казначей скажу: в виде мейд-кафе вы, похоже, куда полезнее для Миллениум."
1203-153 = "Мы могли бы даже расшириться, открыть кафе в другом районе..."
1203-154 = "Или на школьных фестивалях! Только представьте: вы можете стать эксклюзивными горничными Миллениум..."
1203-155 = ""
1203-158 = "О боже..."
1203-159 = "...Ах."
1203-161 = "Н-Ну? Неплохая идея, правда?"
1203-162 = ""
1203-164 = ""
1203-166 = ""
1203-167 = "...Ха..."
1203-168 = "...А-ха-ха... ха-ха-ха..."
1203-169 = "...Ха... ха?"
1203-170 = "Ха."
1203-171 = ""
1203-173 = ""
1203-175 = "Вон отсюда!!"
