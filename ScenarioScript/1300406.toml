[translation]
1300406-1 = "Игры — это весело"
1300406-2 = "Комната Комитета по предотвращению закрытия"
1300406-3 = "Что? Хочешь помочь мне потренироваться в реверси?"
1300406-4 = "Хорошо... но..."
1300406-5 = "Н-Неважно. Я буду рада! Как мило с твоей стороны, Сенсей..."
1300406-6 = "Но я всё ещё не очень хороша... Может, я безнадёжна в этом."
1300406-7 = "..."
1300406-8 = "Да, ты прав. Повторение — мать учения."
1300406-9 = "Хорошо, Сенсей. Научи меня всему, что знаешь!"
1300406-11 = "..."
1300406-12 = "[s] «Ты победил...»"
1300406-13 = "..."
1300406-14 = "Десять партий... десять побед."
1300406-15 = "Сенсей. Ты играешь даже хуже меня."
1300406-16 = "Ну... может, остальные просто слишком сильные."
1300406-17 = "Но теперь, когда я узнала, каково это — побеждать, я больше никогда не хочу проигрывать!"
1300406-18 = "Так что благодаря тебе я всё равно усвоила кое-что важное, Сенсей. ☆"
1300406-20 = "(Нономи ласково меня утешила.)"
