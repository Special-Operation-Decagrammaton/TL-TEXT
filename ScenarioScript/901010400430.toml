901010400430-55 = "Alguém sem relação nenhuma com o preço...? Por que diz isso?"
901010400430-56 = "...Eu concordo plenamente com o Sensei."
901010400430-57 = "Espalhar uma história difamatória dessas sabendo que vai abalar o consumo, justo quando o atacado já está no chão..."
901010400430-58 = "Indica que o autor dos boatos não tem interesses financeiros no comércio de pescados. É quase certo ser um terceiro alheio ao setor."
901010400430-59 = "Cada vez mais bizarro... Se não dá lucro nenhum, por que cargas d'água inventar calúnias sobre caranguejos?"
901010400430-60 = "...Será que o criador do boato tem alergia mortal a caranguejo?"
901010400430-61 = "Tipo, passou mal comendo um ensopado no passado e jurou vingança eterna contra toda a indústria pesqueira!"
