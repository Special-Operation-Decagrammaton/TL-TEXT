[translation]
901010400430-6 = ""
901010400430-7 = "Обнаружилось несоответствие между объёмом вылова крабов и ожидаемой рыночной ценой..."
901010400430-8 = "Розничные цены почти не изменились, но оптовые резко рухнули из-за, похоже, неустойчиво большого объёма вылова."
901010400430-9 = "Дошло до того, что краболовы думают сократить число выходов в море."
901010400430-10 = "Хм? Не понимаю..."
901010400430-11 = "Если цены на краба упали, разве им не нужно ловить и продавать больше, чтобы заработать больше?"
901010400430-12 = "Ты слишком недальновидна, FOX 3."
901010400430-13 = ""
901010400430-15 = ""
901010400430-16 = "С морепродуктами избыток предложения означает МЕНЬШЕ денег. Спрос ограничен, а срок хранения очень короткий."
901010400430-17 = "Если просто продавать их дёшево, ты не только не окупишь расходы, но ещё и большую часть крабов придётся выбросить."
901010400430-18 = "Да-да. Наверное, здорово быть такой опытной и мудрой."
901010400430-20 = "Недавнее падение цен на краба поставило рыбаков в тяжёлое финансовое положение."
901010400430-21 = "Кроме того, слух о крабах в бочке только ухудшает ситуацию, из-за него людям ещё меньше хочется покупать краба."
901010400430-22 = "Кто-то распространил этот слух не просто так. Но какое отношение это имеет к ценам на краба?"
901010400430-23 = ""
901010400430-25 = ""
901010400430-26 = ""
901010400430-29 = ""
901010400430-30 = "#Q;쿠루미;Кто-то распространил этот слух не просто так. Но какое отношение это имеет к ценам на краба?\n[as1] «Они должны получать прибыль, когда цена на краба падает.»\n[as2] «Они должны получать прибыль, когда цена на краба растёт.»\n[as3] «Это может быть вообще не связано с ценой.»"
901010400430-31 = "Я об этом и говорю. Владелец магазина мог распространить слух, чтобы покупать краба дешевле."
901010400430-32 = "Но если цены на краба упадут, он и сам будет получать меньше прибыли..."
901010400430-33 = "Отталкивающие слухи снизят не только цену, но и спрос. В итоге владельцы магазинов сами понесут убытки."
901010400430-34 = "Если рыбаки уже сокращают выходы в море, ниже цены, скорее всего, уже не опустятся."
901010400430-35 = "Уф... Может, ты и права."
901010400430-36 = "Сенсей, можете пересмотреть ответ?"
901010400430-37 = ""
901010400430-39 = ""
901010400430-40 = ""
901010400430-43 = "...Нет? Этот слух только обрушит цены. Как вы пришли к противоположному выводу?"
901010400430-44 = "Сенсей... Вы ведь не дремали, пока мы разговаривали?"
901010400430-45 = "Пожалуйста, отнеситесь к этому серьёзнее."
901010400430-46 = ""
901010400430-48 = ""
901010400430-49 = ""
901010400430-52 = ""
901010400430-54 = ""
901010400430-55 = "Просто никак не связано...? Никакой выгоды? Почему вы так думаете?"
901010400430-56 = "...Вообще-то, я согласна."
901010400430-57 = "У нас есть слух, который снижает спрос на краба, в то время как оптовые цены уже падают. Значит, тем, кто распространяет слух, цены безразличны."
901010400430-58 = "Скорее всего, это третья сторона, получающая выгоду из источника, совершенно не связанного с ценами на краба."
901010400430-59 = "Я запуталась ещё сильнее. То есть эти люди просто рушат рынок крабов без всякой причины?"
901010400430-60 = "Может, у них аллергия на морепродукты."
901010400430-61 = "Трагическая история: в детстве они чуть не умерли, съев краба. И теперь поклялись отомстить."
901010400430-62 = "Не слишком ли драматично?"
