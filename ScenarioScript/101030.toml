[translation]
101030-1 = "Эпизод 3; Трещина в повседневности 1"
101030-2 = "Раскопки в Пустыне Абидос"
101030-3 = ""
101030-5 = "К-кажется, я нашёл!"
101030-6 = "...! Нашёл?!"
101030-7 = "Д-Да, похоже! В указанных координатах обнаружена некая подземная конструкция размером примерно 132 м × 23 м × 13 м."
101030-8 = "Должно быть, это оно! Немедленно свяжитесь с генералом! Это вопрос первостепенной важности!"
101030-9 = "Есть! Уже!"
101030-10 = "И свяжитесь по защищённой от шпионажа сети с начальником обороны Генерального студенческого совета."
101030-11 = "Да!"
101030-12 = ""
101030-14 = ""
101030-16 = "Центр Абидоса"
101030-17 = "..."
101030-18 = ""
101030-20 = ""
101030-23 = "Быстрее! Вперёд, вперёд!"
101030-24 = "Да!"
101030-25 = ""
101030-29 = "ЧВК «Кайзер»..."
101030-30 = ""
101030-32 = ""
101030-35 = "Войска PMC движутся к пустыне?"
101030-36 = "Угу. В невиданных масштабах."
101030-37 = "Что же они задумали? Лучше бы и дальше сидели тихо."
101030-38 = "Широко права. В последнее время я тоже замечаю мобилизацию сил ЧВК Кайзер по всему району."
101030-39 = "Эти придурки и правда думают, что могут топтаться по нашему району, будто это их задний двор."
101030-40 = "Они наверняка что-то делают в Пустыне Абидос. Мы ничего там не видим, поскольку она до сих пор считается собственностью Кайзер."
101030-41 = "Мы можем неофициально осмотреть местность так, чтобы нас не заметили."
101030-42 = "Широко..."
101030-43 = "Мне нравится твой энтузиазм, малышка, но давай попробуем учиться на прошлых ошибках. В прошлый раз это тоже закончилось не очень."
101030-44 = "Т-Ты права..."
101030-45 = "Я согласна с Хошино! Может, спросим Сенсея, что нам делать дальше."
101030-46 = ""
101030-48 = ""
101030-49 = "Я тоже хотела бы посоветоваться с Сенсеем, но в последнее время он особенно занят... Вдруг мы только помешаем..."
101030-50 = "Что за ерунду ты несёшь?! Сенсей найдёт для нас время."
101030-51 = "Давай немного ему доверять, Аяне. Сенсей всегда помогал нам, когда это было нужно."
101030-52 = "Они правы. Сенсей не стал бы писать мне и спрашивать, как я, если бы не был готов помочь."
101030-53 = "Тебе Сенсей написал?!"
101030-54 = "Широко, хвастунишка! Не надо нам этим в лицо тыкать!"
101030-55 = "Я вовсе не хвасталась. Просто сообщила факты."
101030-56 = "Хи-хи. Раз Широко счастлива, пусть радуется. Хотя... я бы тоже хотела, чтобы Сенсей поинтересовался, как у меня дела..."
101030-57 = ""
101030-59 = ""
101030-60 = "Ещё чего! Широко такая избалованная именно потому, что ты всё ей спускаешь! Иногда надо проявлять строгость!"
101030-61 = "Т-Ты правда так думаешь?"
101030-62 = "Эм... Я..."
101030-63 = "Ты только посмотри в эти огромные щенячьи глазки! Ну как на неё сердиться? ☆"
101030-64 = "Ха-ха-ха... Но важнее другое: что сказал Сенсей?"
101030-65 = "Просто спросил, как у меня дела. Ничего особенного, правда?"
101030-66 = "Любопытно... Вот так внезапно? Без причины?"
101030-67 = "Легко выясним. Я отправлю Сенсею приглашение приехать в Абидос."
101030-68 = "Идеальный план! Спасибо, Аяне!"
101030-69 = ""
101030-71 = ""
101030-73 = "Департамент Разработки Игр Милленниума"
101030-74 = ""
101030-75 = "Эта концепция не годится."
101030-76 = "Что? Почему?! По-моему, она отличная!"
101030-77 = "Мы выбрали фэнтезийную RPG с боевой системой на мечах и магии."
101030-78 = "Да, и...?"
101030-79 = "А главный герой нашей фэнтезийной RPG летает на межгалактическом линкоре."
101030-80 = "Он сражается со злыми космическими пиратами! Как герой должен восстать против зла и победить его без линкора?!"
101030-81 = "А я пытаюсь объяснить тебе, что герои RPG не летают на космических кораблях..."
101030-83 = "Ну почему нет? По-моему, «Космический герой» звучит очень круто!"
101030-84 = ""
101030-86 = ""
101030-87 = "Что думаешь, Юзу?"
101030-88 = "Я-я... Не так уж плохо... В этом есть какой-то дадаистский дух, который сейчас нравится людям..."
101030-89 = "Видишь?! Я понятия не имею, что это значит, но она сказала, что это супер-круто!"
101030-90 = "И ты туда же, Юзу?"
101030-91 = ""
101030-93 = ""
101030-95 = "Мне тоже нравится космический герой."
101030-96 = "Алиса?"
101030-97 = "Алиса! Ты вернулась!"
101030-98 = "Как прошёл визит в Инженерный отдел?"
101030-99 = "Они провели простой физический осмотр и различные проверки здоровья, но никаких отклонений не обнаружили."
101030-100 = "Веритас попросили меня регулярно проходить обследования. Как еженедельные квесты."
101030-101 = "Э-Это хорошо... Надеюсь, ты нормально себя чувствуешь..."
101030-102 = "А что с той странной штукой, которая пыталась захватить твоё тело... Кей? Вы сумели найти Кей?"
101030-103 = "Ты вообще когда-нибудь слушаешь? Её зовут Кей, а не Кей."
101030-104 = "Хватит придираться к мелочам! Кей всё равно звучит лучше, чем Кей!"
101030-105 = "Нет. Мы не нашли Кей."
101030-106 = "Так и будем называть её Кей? Ну, наверное, уже неважно..."
101030-107 = "У Инженерного отдела пока нет технологии, способной определить, находится ли Кей всё ещё внутри меня, поэтому теперь мне также помогают Веритас."
101030-109 = "...Главное, чтобы тебя это устраивало."
101030-110 = "Да конечно её это не устраивает! Эта психованная штука пыталась превратить Алису в какую-то робо-принцессу! Не волнуйся, Алиса, если она ещё раз к тебе сунется — я ей зад надеру!"
101030-111 = "Но серьёзно. Ты точно в порядке, Алиса?"
101030-112 = "У меня всё хорошо. В следующий раз, когда я увижу Кей, я выпущу лазерный луч на триста процентов. Нет, на сто тысяч процентов!"
101030-113 = ""
101030-115 = ""
101030-116 = "И мне очень нравится космический герой Момои. Отряд героев на межгалактическом линкоре! Это хорошая идея."
101030-117 = "Вот! Ты меня понимаешь! Мне ужасно нравится эта идея, потому что прокатиться на межгалактическом линкоре — мечта всей моей жизни!"
101030-118 = "А я когда-нибудь смогу прокатиться на линкоре?"
101030-119 = "Не думаю, что это возможно, Алиса..."
101030-120 = "Почему? В Инженерном отделе мне сказали, что строят огромный корабль, который сможет плавать по небу благодаря очень продвинутой технологии — вроде той, что используется в рельсотроне Алисы."
101030-121 = "В Кивотосе нет настолько продвинутой технологии, чтобы сделать летающий линкор. Это пустая мечта, которая только заставит тебя хотеть невозможного."
101030-122 = "П-Правда...?"
101030-123 = "Ничего страшного! Мечты нужны, чтобы добиваться невозможного. Я узнала это в своих приключениях."
101030-124 = "Алиса права! Меня осенило! Ладно, новая история нашей игры будет космической оперой про отряд космических героев!"
101030-125 = "Да! Мне очень нравится эта идея!"
101030-126 = "Давайте сменим жанр на bullet hell-шутер с чудовищной сложностью... без продолжений и без бомб, уничтожающих всё на экране..."
101030-127 = ""
101030-129 = ""
101030-130 = ""
101030-131 = ""
101030-132 = "*вздох* ...Я знала, что так и будет."
101030-135 = "..."
101030-136 = "Кей..."
101030-137 = "Принцесса... Вы отрицаете... само предназначение своего существования... И моего?"
101030-138 = "Ключ, лишённый своей функции, больше не является ключом. Он отвергается."
101030-139 = ""
101030-142 = "...Понятно."
101030-143 = "Я буду наблюдать за вами из тени, принцесса... Алиса."
101030-144 = "Но однажды вы достигнете конца пути и больше не сможете отрицать своё предназначение. Алиса, вам придётся принять нашу судьбу."
101030-145 = ""
101030-147 = ""
101030-148 = "И когда этот момент настанет..."
101030-151 = "Исполнительный офис Семинара"
101030-152 = ""
101030-153 = "...Хм."
101030-154 = "Рио, ты ведь просто сваливаешь на меня самую мерзкую часть своей работы?"
101030-155 = "Сначала ты задействуешь опасное наследие Безымянных богов, терпишь неудачу, а теперь разворачиваешься и просишь меня обработать и проанализировать горы данных."
101030-156 = "Ну, полагаю, бесстыдство без малейших угрызений совести после того, как едва не устроила конец света, — привилегия нашей Старшей Сестры."
101030-157 = "Ты благословлена моим присутствием в своей жизни, ведь я чиста и прекрасна, словно минеральная вода с ледниковой шапки. Я великодушно окажу тебе услугу."
101030-158 = "Итак, что ты хотела мне сказать?"
101030-159 = "..."
101030-160 = "..."
101030-161 = "Это..."
101030-162 = "Это не доказательство. Скорее интерпретация догадки, основанной на гипотезе, но я всё равно это вижу..."
101030-163 = "Теперь... я могу проникнуться твоими, казалось бы, параноидальными заблуждениями, которые толкнули тебя на столь крайние меры."
101030-164 = "Должна признать, имя Старшая Сестра тебе действительно подходит."
101030-165 = "Я почти так же впечатлена тобой, как самой собой — хрупкой гениальной красавицей, известной своим мастерством Всеведения."
101030-166 = "Но степень по Всеведению ты сама выдумала."
101030-167 = ""
101030-169 = ""
101030-170 = "Ты меня напугала...! Эйми, к-как давно ты здесь...?"
101030-171 = "С тех пор, как ты начала нести какую-то ерунду про ледяные шапки?"
101030-172 = "..."
101030-173 = "Разве Отряд Исследования Сверхъестественного изначально не подчинялся напрямую президенту Рио? Я знаю, где это."
101030-174 = "Так президент оставила нам сообщение?"
101030-175 = "Я ещё не всё просмотрела. Самые важные данные заперты в её чёрном ящике, поэтому на их разбор потребуется время."
101030-176 = "Но главный вывод такой: нам нужно готовиться к сверхъестественному явлению колоссального масштаба."
101030-177 = "Что ты имеешь в виду?"
101030-178 = "Считай это предупреждением от Старшей Сестры."
101030-179 = "Предупреждением о том, что на горизонте таится нечто зловещее."
101030-180 = "..."
101030-182 = "Каков наш следующий шаг?"
101030-183 = ""
101030-185 = ""
101030-186 = "И-и-и! Как ты тоже смогла так незаметно подкрасться? Если будете продолжать меня пугать, на моём идеальном лице появится морщина!"
101030-187 = "Личная горничная президента, Токи...?"
101030-188 = "Я была здесь с самого начала. Здесь много мест, где можно укрыться."
101030-189 = "Ух ты, должно быть, это навыки спецагента. Я вообще не заметила твоего присутствия."
101030-190 = "Ты не ушла вместе с президентом?"
101030-191 = "Нет. Она сказала мне отныне поступать как хочу и исчезла."
101030-192 = "Я всё ещё пытаюсь понять, что означал этот приказ."
101030-193 = "Я надеялась найти ответы в месте, где президент проводила большую часть времени, когда пришли вы двое."
101030-194 = "Хм..."
101030-196 = "Разве после ухода Рио ты не присоединилась к C&C? Ты ведь изначально была одной из них... Они тебя отвергли?"
101030-197 = "Нет. Старшие были очень добры ко мне, однако..."
101030-198 = "Однако?"
101030-199 = "Как бы это сказать..."
101030-200 = "..."
101030-201 = "А. Я понимаю ситуацию."
101030-203 = "..."
101030-204 = "Не думала, что ты из застенчивых."
101030-205 = "Заводить друзей, возможно, не моя сильная сторона, но если Кивотосу угрожает опасность — вот тут мои таланты пригодятся. Я могу помочь."
101030-206 = "...Что думаете, президент?"
101030-207 = "Столь мудрая особа, как я, прекрасно знает, что нельзя отвергать искреннее предложение помощи."
101030-208 = "Спасибо!"
101030-209 = "Хи-хи. Превосходно. Теперь наши дальнейшие шаги ясны."
101030-210 = "Эйми, чтобы двигаться дальше, нам понадобится помощь Шале."
101030-211 = "Поняла."
101030-212 = "..."
101030-214 = "Следующий Эпизод; Трещина в повседневности 2"
