[translation]
2003906-1 = "Просто забрасывая удочку"
2003906-2 = "Перед главными воротами Шале"
2003906-4 = "Ох. И Гэнрюмон, и Общество восточной алхимии... Все устроили настоящий переполох."
2003906-5 = "И всё из-за прогулки с вами, Сенсей."
2003906-6 = "[s] «Эм... Что случилось?»"
2003906-7 = "Ничего особенно важного."
2003906-8 = "Просто подготовка Гэнрюмон к сегодняшней прогулке заняла три дня и две ночи."
2003906-9 = "[s] «Три дня и две ночи?! Без остановки?!»"
2003906-10 = "Именно поэтому я и назвала это «переполохом»."
2003906-11 = "Тем временем Общество восточной алхимии подготовило для нас вот это."
2003906-12 = ""
2003906-14 = ""
2003906-16 = "[ns] «Что... это?»"
2003906-17 = "Хм. Кажется, это ингалятор для вдыхания лечебных благовоний."
2003906-18 = "Чтобы успеть к сегодняшнему дню, они даже заключили исследовательское соглашение с зарубежной организацией, не доложив об этом Гэнрюмон."
2003906-19 = "[s] «Тогда нужно особенно беречь эту штуку.»"
2003906-20 = "Хм... Вы тоже собираетесь чрезмерно меня опекать, Сенсей?"
2003906-21 = "*вздох* И долго ещё вы будете обращаться со мной как с ребёнком?"
2003906-22 = "[s1] «Все заботятся о тебе, Кисаки.»\n[s2] «И я тоже.»"
2003906-25 = "Не то чтобы я этого не понимала, однако..."
2003906-26 = "Неважно. Оставим эту тему."
2003906-27 = "Итак. Куда мы сегодня пойдём? Что вы мне покажете?"
2003906-28 = "Так как обед уже прошёл, у нас осталось лишь около половины дня."
2003906-29 = "[s] «Положитесь на меня!»"
2003906-30 = "Я поверю вам и «предоставлю это вам», Сенсей."
2003906-32 = "Это...?"
2003906-33 = "Разумеется, я о нём слышала. Это называется «метро» — разновидность общественного транспорта."
2003906-34 = "...Разве это не новый для меня опыт?"
2003906-35 = "..."
2003906-36 = "Хи-хи. Да. Это я признаю."
2003906-37 = "...Трясёт сильнее, чем я ожидала, и довольно шумно...?"
2003906-39 = "...Это парк развлечений?"
2003906-40 = "Моя реакция спокойнее, чем вы ожидали? Ну, в конце концов, это..."
2003906-41 = "...детские забавы для меня!"
2003906-42 = "Даже я способна справиться с подобным."
2003906-43 = "Будет лучше, если я постараюсь получить удовольствие...?"
2003906-44 = "Понятно. И снова я доверюсь вам, Сенсей. Но вон та улица... выглядит довольно знакомо."
2003906-45 = "Ах, понятно. Значит, это тематические улицы, воссоздающие особенности районов каждой академии."
2003906-46 = "Я вижу улицу Шаньхайцзина."
2003906-47 = ""
2003906-49 = ""
2003906-50 = "Мне крайне не по вкусу представленная здесь историческая недостоверность!"
2003906-52 = "Несмотря на не самое гладкое начало, Кисаки очень понравился парк развлечений."
2003906-53 = "Она даже уговорила меня пять раз прокатиться на одних американских горках. Меня чуть не вырвало..."
2003906-55 = "Это... игровой зал?"
2003906-56 = "Я не особенно умела в подобных вещах..."
2003906-57 = "А? Есть игры для новичков?"
2003906-58 = "Что мне нужно делать? «Нажимай три кнопки разных цветов в зависимости от того, что видишь на экране! Проходи мини-игры и поднимайся по башне!»"
2003906-59 = "...Бояться незнакомого — значит остановить прогресс."
2003906-60 = "Понятно. Что бы там ни было — пусть приходит!"
2003906-62 = ""
2003906-63 = ""
2003906-64 = ""
2003906-67 = ""
2003906-68 = "...Я всё же думала, что мы поднимемся выше седьмого этажа."
2003906-69 = "Сенсей. Разве вы тоже не считаете, что эта игра использует нечестные методы? Вы действительно, совершенно искренне настаиваете, что всё честно?"
2003906-70 = "Скорость, с которой требовалось нажимать кнопки, незаметно менялась на протяжении игры — то быстрее, то медленнее."
2003906-71 = "Хм...? Даже это часть дизайна? Реагировать на такие изменения — в этом и заключается прелесть игры...?"
2003906-72 = "...Полагаю, мне не стоит спорить с разработчиками игры."
2003906-73 = "Однако это ничуть не уменьшает моего раздражения. Ещё раз! Позвольте попробовать ещё раз!"
2003906-74 = "У нас ещё есть дела? Я ведь попросила всего ещё одну попытку, разве нет?!"
2003906-76 = "Это магазины? Понятно..."
2003906-77 = "В старых магазинах вроде этих часто скрываются настоящие сокровища?"
2003906-78 = "Хотя я понимаю вашу мысль, для меня это неизведанная территория."
2003906-79 = "Фу-фу. Ничего не поделаешь. И снова доверюсь вашему выбору, Сенсей."
2003906-80 = "Хм? Уверена ли я, что не... пожалею?"
2003906-81 = "..."
2003906-82 = "Вы ведь не думаете ни о чём... странном, правда?"
2003906-85 = "...?!"
2003906-86 = "Э-Это что...?!"
2003906-87 = "Нет, я благодарна за подарок, но..."
2003906-88 = "Я переживаю, что он мне не подойдёт?"
2003906-89 = "Скорее... я не думаю, что в Шаньхайцзине будет много возможностей это надеть..."
2003906-90 = "Это неважно? Даже если рядом никого не будет, вы просто надеетесь, что я это надену?"
2003906-91 = "Х-хорошо. Как... пожелаете, Сенсей."
2003906-92 = "Хм? Даже если совсем немного, мне стоит вспоминать о вас, когда я буду это носить?"
2003906-93 = "..."
2003906-94 = "Я постараюсь..."
2003906-96 = "Мы едим позже, чем я ожидала. Хотя пища необходима для выживания..."
2003906-97 = "Фу-фу. На какое-то время я совсем забыла о голоде."
2003906-98 = "А? Мне было настолько весело?"
2003906-99 = "..."
2003906-100 = "А что вы сделаете, если я соглашусь?"
2003906-101 = "Полагаю, вы наверняка запланировали ещё множество мест для посещения."
2003906-102 = "Мы прошли лишь около половины расписания? Жду продолжения с нетерпением."
2003906-103 = "Вы думаете, ради безопасности мне стоит воспользоваться ингалятором?"
2003906-104 = "Мне кажется, я уже давала понять, что такая чрезмерная опека мне не нравится..."
2003906-105 = "Ладно. Понятно. Я продолжу следовать вашим указаниям, Сенсей."
2003906-106 = ""
2003906-108 = ""
2003906-110 = "Теперь вы довольны?"
2003906-111 = "Вот ваш заказ."
2003906-112 = "Мм. Тогда спасибо за еду."
2003906-113 = "Все эти блюда я прежде только слышала по названию."
2003906-115 = ""
2003906-116 = "[ns] «...»"
2003906-117 = "Я требую объяснений."
2003906-118 = "Вы «думали, что мне понравится»? Какие факты, в какой вселенной убедили вас прийти к такому выводу?"
2003906-119 = "Смотреть, как играют дети, «весело»? Серьёзно?"
2003906-120 = "...И даже взрослые хотят играть в бассейнах с шариками?"
2003906-124 = "И это всё, что вы можете сказать в своё оправдание, Сенсей?!"
2003906-126 = "..."
2003906-127 = "Не то чтобы я не ценила вашу заботу."
2003906-128 = "Полагаю... только в этом конкретном случае я могу принять вашу попытку проявить внимание к моим чувствам."
2003906-129 = "Бассейн с шариками... Значит, бассейн с шариками..."
2003906-130 = "..."
2003906-131 = ""
2003906-133 = ""
2003906-137 = ""
2003906-138 = "Я скоро вернусь."
2003906-140 = "И вот так... Кисаки, к моему удивлению..."
2003906-141 = "...хотя, пожалуй, вполне ожидаемо..."
2003906-142 = "...очень хорошо повеселилась."
2003906-144 = "Уже вечер."
2003906-145 = "Фу-фу... День был очень насыщенным. Он останется в моей памяти."
2003906-146 = ""
2003906-148 = ""
2003906-149 = "Да-да... Я понимаю. Сделаю, сделаю."
2003906-150 = ""
2003906-152 = ""
2003906-154 = "Я открыла для себя новую признательность к жизни."
2003906-155 = "Я и представить не могла, что проведу день подобным образом."
2003906-156 = "Спасибо, Сенсей."
2003906-157 = "Если бы не вы, я бы так и осталась там, воспринимая мир через свою узкую перспективу."
2003906-158 = ""
2003906-160 = ""
2003906-161 = ""
2003906-163 = "Хм? Почему вы вздрогнули? Я всего лишь подошла к вам ближе."
2003906-164 = "Солнце уже село, и стало холодно."
2003906-165 = "..."
2003906-167 = "Мне нравится ночь? Так кажется?"
2003906-168 = "Пожалуй, можно и так сказать. Особенно сумерки."
2003906-169 = "Это хрупкое равновесие дня и ночи. Уже не одно, но ещё не другое."
2003906-170 = "Мимолётный миг, который всё же не проходит слишком быстро. Красота, которой можно любоваться, но невозможно удержать."
2003906-171 = "..."
2003906-172 = "Сенсей, могу я попросить вас об одолжении?"
2003906-173 = "Я хотела бы увидеть ночь."
2003906-174 = "Ночь вашего мира, рядом с вами."
2003906-177 = ""
2003906-178 = ""
2003906-180 = ""
2003906-181 = ""
2003906-183 = ""
2003906-184 = ""
2003906-185 = ""
2003906-186 = ""
2003906-187 = ""
2003906-189 = ""
2003906-190 = ""
2003906-196 = "День был насыщенным, Сенсей."
2003906-197 = "[s] «Ты насладилась им сполна?»"
2003906-198 = "Да. Сегодня был... день, который останется со мной на всю жизнь."
2003906-199 = "Фу-фу. Не смотрите так ошеломлённо. Я лишь говорю—"
2003906-200 = ""
2003906-202 = ""
2003906-203 = ""
2003906-204 = ""
2003906-205 = ""
2003906-206 = ""
2003906-207 = ""
2003906-208 = "[ns] «Кисаки?!»"
2003906-209 = "...Ух."
2003906-210 = "...Спасибо, что поймали меня."
2003906-211 = "Я перестаралась?"
2003906-212 = ""
2003906-214 = ""
2003906-215 = "Простите, Сенсей. Возможно, мне нужно немного отдохнуть."
2003906-216 = "[s] «Подожди минутку!»"
2003906-222 = "С Кисаки на спине я помчался к первому попавшемуся отелю."
2003906-223 = "Я усадил Кисаки в кресло, чтобы она могла отдохнуть."
2003906-225 = "[ns] «Подожди... Я зажгу лечебные благовония!»"
2003906-227 = "*вздох* Спасибо, Сенсей. Головокружение прошло."
2003906-228 = "Искренне прошу прощения, что наш день закончился вот так."
2003906-229 = "Мне не стоит об этом переживать? Фу-фу. Это так на вас похоже."
2003906-230 = "Тогда, Сенсей..."
2003906-231 = "Можно мне всего несколько минут?"
2003906-236 = "― [log=키사키]Фу-фу... Наконец-то вы смотрите прямо на меня.[/log][wa:2140]"
2003906-237 = "― [log=키사키]Но, Сенсей. Возможно, стоит кое о чём задуматься.[/log][wa:4960]"
2003906-240 = "― [log=키사키]Может быть, прямо сейчас я действительно беззащитна.[/log][wa:3020]"
2003906-241 = "― [log=키사키]...А может, я лишь притворяюсь? [/log][wa:2520]"
2003906-244 = "― [log=키사키]Или я проверяю, как вы отреагируете? [/log][wa:3690]"
2003906-245 = "― [log=키사키]А может... я просто глубоко вам доверяю.[/log][wa:6570]"
2003906-248 = "― [log=키사키]Но... одно я могу сказать наверняка.[/log][wa:3870]"
2003906-251 = "― [log=키사키]Даже если здесь что-то случится... [/log][wa:440]"
2003906-252 = "― [log=키사키]Я не стану вас винить... никогда.[/log][wa:6620]"
2003906-256 = ""
2003906-257 = "[ns] «...»"
2003906-259 = "[ns3] «Нет, Кисаки.»\n[ns4] «Тебе, может, и стало немного лучше...»"
2003906-262 = "С-Сенсей?"
2003906-263 = "[s] «...но нездоровым студентам нужно как следует отдыхать.»"
2003906-264 = ""
2003906-266 = ""
2003906-267 = "...Вот как."
2003906-268 = "Фу-фу. Получать выговор — непривычное... и приятное чувство."
2003906-269 = "Тогда теперь вы можете уложить меня спать, Сенсей."
2003906-270 = "[s5] «Ч-что?!»\n[s6] «Разве... это так работает?!»"
2003906-273 = "Ох-ох. Педагог отказывается от собственного слова?"
2003906-274 = ""
2003906-276 = ""
2003906-277 = ""
2003906-278 = "Ну же, Сенсей. Я доверяюсь вам."
2003906-279 = "[s] «Что?!»"
2003906-283 = "Кисаки внезапно приблизилась ко мне, и мне кое-как удалось уложить её."
2003906-285 = "..."
2003906-286 = "Спасибо."
2003906-287 = ""
2003906-289 = "Думаю, сегодня я... хорошо отдохну..."
2003906-290 = ""
2003906-293 = ""
2003906-295 = "Я гладил Кисаки по голове, пока её дыхание не стало медленным и ровным."
2003906-296 = "Когда она уснула, я лёг на диван..."
