[translation]
10045040-1 = "Эпизод 4;Раунд 3: Гонка по надувной полосе препятствий"
10045040-2 = "Ужасная поездка на катере, полная криков, наконец закончилась."
10045040-4 = "Вот наши 10 победителей второго раунда Водного фестиваля Хяккияко!"
10045040-5 = "Поприветствуем их громкими аплодисментами!"
10045040-6 = ""
10045040-9 = ""
10045040-11 = ""
10045040-13 = ""
10045040-14 = ""
10045040-15 = "Эти любимцы публики выделялись ещё в первом матче. Надеюсь, всем так же интересно, как и мне, увидеть, что они покажут дальше!"
10045040-16 = "Отдохните, пока у нас небольшой перерыв перед следующим матчем!"
10045040-17 = "А! Как раз вовремя. Пора обедать!"
10045040-18 = "Загляните в пляжную хижину «Момоёдо» и перекусите!"
10045040-19 = "Я лично отобрала это вкусное и доступное меню, так что не пропустите!"
10045040-20 = "Увидимся там, ня!"
10045040-21 = "...Я так ловко вставила рекламу! Хи-хи!"
10045040-22 = ""
10045040-23 = ""
10045040-24 = "Кто-нибудь... голоден?"
10045040-25 = "Ух, простите. Сейчас я ничего не смогу съесть."
10045040-26 = "...Я чувствую примерно то же."
10045040-28 = "Такое чувство... будто мы едва избежали самой смерти..."
10045040-29 = "Я намерена... полностью стереть это воспоминание, если возможно..."
10045040-30 = ""
10045040-31 = "[ns1] «Все из Хяккарёран прошли дальше!»\n[ns2] «Поздравляю!»"
10045040-34 = "С-Спасибо..."
10045040-35 = "Сенсей. Каким будет следующий матч?"
10045040-36 = "(Я выдержу... пока не потребуется заходить в воду...)"
10045040-37 = "[ns] «Следующий матч — это...!»"
10045040-39 = "[log]Гонка по надувной полосе препятствий![/log]"
10045040-41 = ""
10045040-42 = ""
10045040-43 = "...Бесконечный град ударов."
10045040-45 = "Момент, которого вы ждали! Долгожданная надувная полоса препятствий!"
10045040-46 = ""
10045040-49 = "В отчаянном рывке к финишу все игроки стартуют одновременно, но лишь двое пройдут в финальный матч!"
10045040-50 = "Им придётся преодолеть каждое препятствие на пути к победе!"
10045040-51 = "Вращающийся мост погибели!"
10045040-52 = "Изнурительный подъём по рампе под градом водяных шариков!"
10045040-53 = "Ужасающая дорожка из буёв, окружённая водой!"
10045040-54 = "И кто вообще знает, куда ведут эти горки?!"
10045040-55 = "Преодолейте все препятствия и доберитесь до финиша раньше остальных!"
10045040-56 = ""
10045040-57 = "...*вздох*"
10045040-58 = "Мне достаточно не упасть, чтобы не промокнуть?"
10045040-59 = "Именно это я и собиралась делать с самого начала."
10045040-60 = "(...Мне не нужно побеждать. Я просто не должна упасть.)"
10045040-62 = "Тем временем..."
10045040-63 = "Чёрт! Вы серьёзно?! Все наши цели до единой прошли в полуфинал."
10045040-64 = "Мы полностью профукали шанс победить."
10045040-65 = "В финал проходят всего двое. Может, просто сдадимся..."
10045040-66 = "Но нас двое, разве нет?! Не думала, что ты такая трусиха!"
10045040-67 = "Я не трусиха! Ты просто не знаешь, каково это — выступать против этих ребят!"
10045040-68 = "Не хочу их нахваливать или типа того, но они реально сильные."
10045040-69 = "И вообще они ко мне довольно добры... так что мне даже неловко с ними драться..."
10045040-71 = "Я слышу только слабость! Просто придерживайся моего плана, и всё получится!"
10045040-72 = "Кекеке... Кекекекек!"
10045040-73 = "Т-Ты точно освоила злодейский смех... Это уж точно."
10045040-74 = "На этот раз... Это будет наш большой прорыв!!"
10045040-76 = "Некоторое время спустя..."
10045040-77 = "Вы-ы-ы ГОТОВЫ-Ы-Ы?! Раунд с полосой препятствий вот-вот начнётся!"
10045040-78 = ""
10045040-81 = ""
10045040-82 = "Наконец-то..."
10045040-83 = "Кто бы это ни был, увидимся в финале!"
10045040-84 = "Фуфу, или... может, все четверо одновременно прорвёмся через финишную черту! И тогда все пройдём в финал!"
10045040-85 = "Сильно сомневаюсь, что это разрешат."
10045040-86 = ""
10045040-88 = "(*вздох*)"
10045040-89 = "(...Не только для меня, но и для остальных участников было бы лучше, если бы я просто выбыла.)"
10045040-90 = "(Я уже создала общее впечатление, что мне не нравится это мероприятие...)"
10045040-91 = "(Нужно лишь выбыть так, чтобы не вызвать подозрений. Но как это сделать? Думай, Кикё!)"
10045040-92 = "...Кикё? Эй, Кикё?"
10045040-93 = "Она думает ещё напряжённее обычного."
10045040-94 = "Игроки! Пожалуйста, встаньте на стартовую линию!"
10045040-95 = ""
10045040-96 = ""
10045040-97 = ""
10045040-99 = ""
10045040-101 = "Надувная полоса препятствий! На старт, внимание..."
10045040-102 = "[ns] «...Начнётся!!»"
10045040-105 = "Ни для кого не удивительно, что Хяккарёран сразу вырываются вперёд!"
10045040-106 = "Первым идёт вращающийся мост! Смотрите, чтобы вас не раскрутило!"
10045040-107 = "По моему сигналу, все!"
10045040-108 = "Бегите быстрее вращающихся платформ!"
10045040-109 = "Это ничто по сравнению с моими обычными тренировками!"
10045040-110 = "(Не смотри вниз. Не смотри вниз. Не смотри вниз...!)"
10045040-111 = ""
10045040-112 = "Ого! Они перепрыгнули в идеальной синхронизации!"
10045040-113 = "Та-дам! Изуна не проиграет!"
10045040-114 = "Вжух!"
10045040-115 = "Хоп!"
10045040-116 = ""
10045040-118 = ""
10045040-119 = "Ого, идут нос к носу! Для этих атлетов препятствия — не помеха!"
10045040-120 = "[ns] «На этом этапе победить может кто угодно!»"
10045040-121 = "Верно. Просто продолжайте стараться, все..."
10045040-122 = "Эй. Готово?"
10045040-123 = "Эм... Ага... Я сделала, как ты сказала..."
10045040-125 = "И похоже, Хяккарёран первыми добрались до рампы с водяными шарами! Огонь!"
10045040-127 = ""
10045040-128 = "Снова по моему сигналу..."
10045040-129 = ""
10045040-132 = ""
10045040-133 = "Уф!"
10045040-134 = ""
10045040-136 = ""
10045040-137 = "Ч-Что это? Липкое. И скользкое."
10045040-138 = "Пахнет... кокосовым маслом?!"
10045040-139 = "Как вообще предполагается взбираться по рампе, залитой маслом?!"
10045040-140 = ""
10045040-142 = "[ns] «Эм... Шизуко? Ты решила добавить сюжетный поворот?»"
10045040-143 = "Н-Нет, конечно нет!"
10045040-144 = "Судья? Сделайте что-нибудь, судья!!"
10045040-145 = ""
10045040-146 = "Кекеке, хорошая работа, мелочь из Моурё. Уже не такие важные, да?"
10045040-147 = "А мы просто проскользнём дальше!"
10045040-148 = ""
10045040-151 = "Ч-У них есть абордажный крюк?! Откуда вы его взяли?"
10045040-152 = "Хмф! В отличие от некоторых неудачников, мы готовы к любой ситуации!"
10045040-153 = "Хи-хи, удачи вам там скользить."
10045040-154 = ""
10045040-156 = ""
10045040-157 = "Негодяи! Они перерезали верёвку, чтобы остальные не смогли ей воспользоваться!"
10045040-158 = "Если будем работать вместе, быстро смоем всё это масло!"
10045040-159 = "Изуна поможет! Техника фонтана в стиле Изуны!"
10045040-160 = ""
10045040-163 = ""
10045040-164 = ""
10045040-165 = "...Я промокла."
10045040-166 = "Пойдём! Мы ещё можем их догнать!"
10045040-167 = ""
10045040-170 = "Ч-Что?! Как они прошли через масло?!"
10045040-171 = "Всё нормально! У меня всегда есть план Б! На следующем препятствии мои подручные приготовили для них сюрприз."
10045040-173 = "[log]Следующее препятствие![/log]"
10045040-175 = "[log]Дорожка из буёв![/log]"
10045040-177 = ""
10045040-178 = "Мы установили мины нажимного действия во все буи! Кекеке!"
10045040-179 = "Я отметила безопасные, а остальные — покойники!"
10045040-180 = "Т-Тогда иди первой! Я не знаю, какие безопасны!"
10045040-181 = ""
10045040-183 = ""
10045040-184 = ""
10045040-186 = "Вернись сюда, ты...!"
10045040-188 = ""
10045040-189 = "Это не—"
10045040-190 = ""
10045040-192 = ""
10045040-195 = "...А?"
10045040-196 = ""
10045040-199 = "Ты идиотка?! Я думала, ты знаешь, какие безопасные!"
10045040-200 = ""
10045040-202 = ""
10045040-204 = ""
10045040-205 = "...Бу."
10045040-206 = ""
10045040-209 = "И вот наши две лидирующие участницы выбывают!"
10045040-210 = "Но важнее: кто установил мины в буях?!"
10045040-211 = "[ns] «Это не ты, Шизуко?»"
10045040-212 = "За кого вы меня принимаете?!"
10045040-213 = ""
10045040-215 = "Изуна поняла! Тогда Изуна вообще не будет наступать на буи!"
10045040-216 = "Техника хождения по воде в стиле Изуны!"
10045040-217 = ""
10045040-220 = "О-Она бежит по воде?! Как это возможно?"
10045040-221 = "[s] «Она должна справиться!»"
10045040-222 = ""
10045040-223 = "Я не отстану! Я следующая!"
10045040-224 = "Рэнгэ! Не беги так безрассудно...!"
10045040-225 = "Капитана штурмового отряда Хяккарёран не остановят какие-то жалкие мины!"
10045040-226 = ""
10045040-229 = "И Рэнгэ с лёгкостью проходит минное поле, даже не вспотев!"
10045040-230 = "Твоя очередь, Кикё!"
10045040-231 = ""
10045040-233 = "(...Мне всего лишь нужно идти по пути Рэнгэ через буи. Простая задача...)"
10045040-234 = ""
10045040-236 = ""
10045040-237 = ""
10045040-238 = ""
10045040-240 = "...А?"
10045040-241 = ""
10045040-244 = ""
10045040-245 = ""
10045040-246 = ""
10045040-247 = ""
10045040-248 = "*урчит* *урчит*"
10045040-249 = "(Ч-Что случилось? Я неправильно оценила путь?)"
10045040-250 = "(Такая ошибка в такой решающий момент...)"
10045040-251 = "(Воздух. Мне нужен воздух...)"
10045040-252 = "(Ах... Тьма...)"
10045040-254 = "(...Все... Простите...)"
10045040-255 = ""
10045040-256 = "...Кикё?"
10045040-257 = "КИКЁ!!"
