[translation]
600-1 = "Совместные огневые учения"
600-2 = "Полигон тактического экзамена Кивотос"
600-3 = "Итак, судьбоносный день наконец настал, Сенсей."
600-4 = "*хрум* А? Вы не знаете, что сегодня за день?"
600-5 = "Сегодня экзамен, конечно. Это же город академий — о чём ещё я могла говорить?"
600-6 = "Студенты Кивотос должны участвовать в огневых учениях, чтобы подтверждать свои навыки."
600-7 = "А значит, даже знаменитый Шале не исключение. *хрум*"
600-8 = "Это шанс доказать навыки, которые вы оттачивали как наставник.#nПоддержите студентов, чтобы они хорошо выступили на экзамене."
600-9 = "Удачи, Сенсей. Не то чтобы я собиралась тут оставаться.#nОт этого места у меня настроение портится. *хрум*"
600-10 = "Я пошла."
