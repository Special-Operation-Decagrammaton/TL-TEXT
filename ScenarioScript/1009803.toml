[translation]
1009803-1 = "Геройский патруль"
1009803-3 = ""
1009803-4 = "А, Сенсей! Сюда! Я здесь!"
1009803-5 = "Вы сегодня прям бодрее обычного. Что-то хорошее случилось?"
1009803-6 = "[s] «Потому что я рядом с Хошино в геройской форме!»"
1009803-7 = "Хех. В геройской форме? Звучит так, будто я во что-то трансформировалась."
1009803-8 = "Ладно, ближе к делу. К сегодняшнему патрулю готовы?"
1009803-9 = "Наверняка вы знаете, но сегодня маршрут пройдёт через тяжёлую песчаную местность."
1009803-10 = "Если отстанете — кто знает, сможете ли вообще вернуться?!"
1009803-11 = "[s] «Да! Я готов!»"
1009803-12 = "Хорошо. Тогда выдвигаемся."
1009803-18 = "Улицы всё ещё довольно пустые."
1009803-19 = "А? Почему мы зашли так далеко?"
1009803-20 = "Очевидно же: я пытаюсь вымотать вас до последней капли, чтобы у вас не осталось сил меня смущать!"
1009803-21 = "[s] «Что?!»"
1009803-22 = "Шучу, Сенсей, шучу. Вас слишком весело подкалывать."
1009803-23 = "На самом деле дело в прошлом разе."
1009803-24 = "Помните тех бандитов, которые пытались украсть школьную доску объявлений?"
1009803-25 = "[s] «И их прогнала Хошино, Герой Абидоса!»"
1009803-26 = "Я вот подумала: у той Банды Шлемов было очень хорошее снаряжение. Откуда оно у них?"
1009803-27 = "Деньгами они обычно не разбрасываются. По крайней мере, раньше."
1009803-28 = "Странно, правда?"
1009803-29 = "Поэтому я решила, что сегодня стоит прочесать район получше."
1009803-30 = "[s] «Так вот о чём ты думала...»"
1009803-31 = "Так-так. Нам ещё много идти, так что прибавим шагу."
1009803-32 = ""
1009803-34 = ""
1009803-40 = ""
1009803-41 = "А? Посмотрите на тот дом. В прошлый мой патруль с ним всё было нормально..."
1009803-42 = "[s] «Теперь там песка больше, чем дома...»"
1009803-43 = "Должно быть, это из-за последней песчаной бури."
1009803-44 = ""
1009803-48 = "*вздыхает* В одиночку мне с этим не справиться..."
1009803-49 = ""
1009803-51 = ""
1009803-52 = ""
1009803-54 = ""
1009803-55 = "Наверное, пора сдаться..."
1009803-56 = ""
1009803-59 = ""
1009803-60 = "Эй! Похоже, у вас неприятности. Можем чем-нибудь помочь?"
1009803-61 = "Ч-Что? Вы кто?"
1009803-62 = "Я просто прохожая..."
1009803-63 = "[s] «Герой-прохожая.»"
1009803-64 = ""
1009803-66 = ""
1009803-67 = "Не начинайте, Сенсей!"
1009803-68 = "Герой...?"
1009803-69 = "Ну, кем бы вы ни были, помощь мне очень пригодится."
1009803-70 = "Я вернулась домой спустя долгое время, просто чтобы забрать несколько вещей."
1009803-71 = "Но, похоже, песчаные бури добрались даже до моего старого дома."
1009803-72 = "Я пыталась его откопать, но сдвинуть столько песка просто невозможно."
1009803-74 = "Хм, в одном вы правы. Для одного человека это слишком много."
1009803-75 = ""
1009803-77 = ""
1009803-78 = "Ладно. Пора размяться."
1009803-79 = "[s] «Я тоже помогу.»"
1009803-80 = "Хех. Спасибо, Сенсей."
1009803-87 = ""
1009803-88 = "Фух. Думаю, готово."
1009803-89 = "Невероятно! Так быстро!"
1009803-91 = "Вы настоящий герой! Спасибо!"
1009803-92 = ""
1009803-94 = ""
1009803-95 = "Да Сенсей просто шутил..."
1009803-96 = "[s1] «Не закрывать глаза на чужую беду...»\n[s2] «...вот что значит быть героем!»"
1009803-99 = "Хех..."
1009803-100 = "Вы умеете сказать что-нибудь такое, Сенсей."
1009803-102 = "Мы с Хошино ещё довольно долго продолжали патрулировать район Абидоса."
1009803-106 = "Хм, клянусь, где-то здесь должна быть дорожка."
1009803-107 = "Песок добрался и до неё."
1009803-108 = "[s] «Может, найдём обходной путь?»"
1009803-109 = "..."
1009803-110 = "Нет, это всего лишь песок. Давайте расчистим путь."
1009803-111 = "Нужно только немного поработать руками."
1009803-116 = ""
1009803-117 = "А, смотрите. В том фонаре перегорела лампа."
1009803-118 = ""
1009803-120 = ""
1009803-121 = "Подставьте плечи, пожалуйста, Сенсей!"
1009803-122 = "Я быстро починю!"
1009803-123 = ""
1009803-125 = ""
1009803-127 = ""
1009803-128 = ""
1009803-129 = ""
1009803-137 = "Хех. Мы уже так далеко зашли? Должно быть, почти конец маршрута."
1009803-138 = "[s] «Давай немного отдохнём.»"
1009803-139 = "Да, давайте. Сегодня я вас хорошенько погоняла, Сенсей."
1009803-140 = "Не жалеете, что пошли со мной?"
1009803-141 = "[s] «Конечно нет.»"
1009803-143 = "[ns] «Мне понравилось смотреть, как ты заботишься об Абидосе.»"
1009803-144 = "Хех. Вы правда решили меня засмущать, да?"
1009803-145 = "Но я и правда вам обязана, Сенсей."
1009803-146 = "Без вас я, наверное, устала бы намного раньше."
1009803-147 = "Спасибо, Сенсей."
1009803-148 = "А? Помогать Герою Абидоса было честью...?"
1009803-149 = "Вы ведь не собираетесь прекращать, да?"
1009803-150 = "Ну, раз вы так настаиваете..."
1009803-151 = "Получается, вы мой напарник, Сенсей?"
1009803-152 = "[s] «Напарник?»"
1009803-153 = "Ну, тот, кто вместе с героем защищает справедливость."
1009803-154 = "Хо-о-отя... обычно злодей похищает напарника, и это наконец мотивирует героя принять свою роль и вступить в бой."
1009803-155 = "[s] «Что?!»"
1009803-156 = "Хе-хе. Шучу."
1009803-157 = ""
1009803-159 = ""
1009803-160 = "Вот. Можете это съесть. Считайте извинением."
1009803-161 = "Ой. Оно немного помялось у меня в боевом жилете, но—"
1009803-162 = ""
1009803-166 = "Э-Эм..."
1009803-167 = ""
1009803-169 = ""
1009803-170 = ""
1009803-172 = ""
1009803-173 = ""
1009803-174 = "Это вы помогаете людям в округе? Я искала вас с тех пор, как услышала слухи..."
1009803-175 = "Ч-что?!"
1009803-176 = "[s] «Слухи и правда разносятся как пожар...»"
1009803-177 = ""
1009803-179 = ""
1009803-180 = "Ну... наверное, это я, но..."
1009803-181 = "Вам нужна помощь?"
1009803-182 = "Видите ли... Простите за беспокойство, но я подумала, что вы, возможно, поможете мне кое-что найти."
1009803-183 = "Несколько дней назад меня застала песчаная буря, когда я шла по окраине города. Я окончательно заблудилась и укрылась в заброшенном поезде, пока буря не стихла."
1009803-184 = "Домой я всё-таки вернулась, но сумку потеряла в поезде."
1009803-185 = "Я пыталась найти её сама... но в пустыне так легко потеряться."
1009803-187 = "Там все мои самые дорогие вещи. Для меня будет очень много значить, если вы поможете. Я-я даже заплачу!"
1009803-188 = ""
1009803-190 = ""
1009803-192 = ""
1009803-193 = "Хм, что же делать?"
1009803-194 = "Вы всё-таки проделали такой путь, чтобы нас найти, да и мы формально всё ещё на патруле..."
1009803-195 = "Что думаете, Сенсей?"
1009803-196 = "[s] «Как верный напарник, я пойду за своим героем куда угодно!»"
1009803-197 = "Хех. Всегда готовы сорваться с места."
1009803-198 = "Кажется, я знаю, о каком заброшенном поезде вы говорите. Просто покажите направление."
1009803-199 = "Есть, госпожа!"
1009803-200 = "Так... Когда я наконец вернулась, было утро, и солнце находилось у меня за спиной..."
1009803-201 = "Значит, похоже на восток!"
1009803-202 = ""
1009803-204 = ""
1009803-205 = "Готовы идти, Сенсей?"
1009803-207 = "Мы отправились на окраину Абидоса искать потерянную сумку жительницы."
1009803-215 = ""
1009803-216 = "Хех! Нашла!"
1009803-217 = ""
1009803-219 = ""
1009803-220 = "Теперь осталось только вернуться в город и отдать сумку!"
1009803-221 = "Отличная работа, Сенсей!"
1009803-222 = "[s] «Всю тяжёлую работу сделала ты, Хошино.»"
1009803-223 = ""
1009803-225 = ""
1009803-226 = "Хех."
1009803-227 = "Но у нас проблема."
1009803-228 = "Если посмотреть на небо..."
1009803-229 = ""
1009803-231 = ""
1009803-237 = "[ns] «Уже так поздно...»"
1009803-238 = "Ага. Проблема."
1009803-239 = "Когда в пустыне темнеет, лучше оставаться на месте. Иначе можно уйти совсем не туда, даже не заметив."
1009803-240 = "...Выбора нет."
1009803-241 = "Придётся разбить лагерь здесь на ночь."
1009803-242 = "Что поделать. Давайте отдохнём, Сенсей."
1009803-249 = "― [log=호시노 무장 모드 4]Ух. Я совсем потеряла счёт времени. [/log][wa:1470]"
1009803-250 = "― [log=호시노 무장 모드 4]Придётся посидеть здесь до рассвета.[/log][wa:3140]"
1009803-253 = "[ns] «Пока я с тобой, Хошино.»"
1009803-254 = "― [log=호시노 무장 모드 4]...А? [/log][wa:350]"
1009803-255 = "― [log=호시노 무장 모드 4]Да ладно, что хорошего в том, чтобы застрять тут с такой старушкой, как я? [/log][wa:3140]"
1009803-258 = "[ns] «В смысле, я же с Героем Абидоса!»"
1009803-259 = "― [log=호시노 무장 모드 4]Хех... хи-хи...[/log][wa:610]"
1009803-260 = "― [log=호시노 무장 모드 4]И долго вы ещё будете продолжать эту игру? Уже слишком далеко зашли.[/log][wa:3680]"
1009803-263 = "― [log=호시노 무장 모드 4]...Ну, если вы правда хотите и дальше быть моим напарником,[/log][wa:2660]"
1009803-264 = "― [log=호시노 무장 모드 4]пожалуй, я подыграю.[/log][wa:830]"
1009803-267 = "― [log=호시노 무장 모드 4]Тогда как насчёт ужина героя и напарника? Правда, у нас только аварийный паёк...[/log][wa:2060]"
1009803-270 = "[ns] «Рыбное желе... Оно ведь популярно у детей, да?»"
1009803-271 = "― [log=호시노 무장 모드 4]Ну, можно и так сказать, но...[/log][wa:1830]"
1009803-272 = "― [log=호시노 무장 모드 4]Эта старушка тоже его любит. Сделайте мне одолжение![/log][wa:6510]"
1009803-276 = "Хех. Повезло, что у меня осталось немного рыбного желе."
1009803-277 = "Оно уже какое-то время лежит в моём боевом жилете, но хотя бы немного насытит нас."
1009803-278 = "Хорошо, что я не доела его раньше."
1009803-279 = "[s] «Ты так спокойно ко всему этому относишься, Хошино.»"
1009803-280 = ""
1009803-282 = ""
1009803-283 = "Ну, я не впервые оказываюсь в такой ситуации."
1009803-284 = "Знаете, когда-то эта старушка вообще ночевала без крыши над головой!"
1009803-285 = "Заброшенный поезд вроде этого? Да это будто вы забронировали нам пятизвёздочный отель!"
1009803-286 = "[s] «Сейчас ты прозвучала очень старо.»"
1009803-287 = "Хе-хе. От вас я такого слышать не хочу."
1009803-288 = "Давайте готовиться ко сну."
1009803-289 = ""
1009803-291 = ""
1009803-292 = ""
1009803-293 = "Для начала нам понадобятся дрова..."
1009803-294 = ""
1009803-296 = ""
1009803-297 = ""
1009803-301 = "А-а-а. Как тепло."
1009803-302 = "Вот, Сенсей. Я постелю аварийное одеяло прямо рядом с огнём."
1009803-303 = "Ночью в пустыне важно поддерживать нормальную температуру тела."
1009803-304 = "Не самое удобное место, но можно прислониться к стене и накрыться одеялом, чтобы не замёрзнуть."
1009803-305 = "А? Рядом с вами есть место?"
1009803-306 = "Как всегда заботливы. Я же говорила: эта старушка — опытный ветеран походной жизни. Не волнуйтесь."
1009803-307 = "А теперь ложитесь пораньше, если хотите вырасти большим."
1009803-308 = "[s] «Тогда почему бы нам не разделить одеяло?»"
1009803-309 = ""
1009803-311 = ""
1009803-312 = "А? Нет, всё нормально, это одеяло довольно маленькое."
1009803-313 = "[s3] «Разве ты не говорила, что нужно поддерживать температуру тела?»\n[s4] «Тогда тебе просто придётся прижаться поближе.»"
1009803-314 = ""
1009803-315 = ""
1009803-317 = ""
1009803-318 = "Н-Наверное, да, но..."
1009803-319 = "Как же вы умеете уговаривать, Сенсей."
1009803-320 = "...*вздох*"
1009803-321 = ""
1009803-323 = ""
1009803-325 = ""
1009803-326 = "Тогда... ещё чуточку ближе, ладно?"
1009803-328 = "Мы с Хошино дождались рассвета, а затем вернулись в город."
