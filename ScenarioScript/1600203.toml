[translation]
1600203-1 = "Вы обратились по адресу!"
1600203-2 = "..."
1600203-3 = ""
1600203-4 = "З-Здравствуйте, Сенсей! Отличная сегодня погода, правда?"
1600203-5 = ""
1600203-6 = "I can't believe it's evening already. Haha..."
1600203-7 = "[s1] «Выглядишь неважно.»\n[s2] «Что случилось?»"
1600203-8 = "Что? Н-Ничего. Я как обычно."
1600203-9 = "Что? Н-Ничего. Я как обычно."
1600203-10 = "Люди, которым я пыталась кое-что объяснить, убежали... как обычно."
1600203-11 = "Но такое происходит постоянно. Ахаха..."
1600203-12 = "Я подумала, может, на этой неделе плохо всё объясняла."
1600203-13 = "Из-за этого, возможно, не смогла удержать внимание до конца, но может, дело вообще не в этом..."
1600203-14 = "А вдруг всё проще? Может, никто вообще не хочет слушать мои объяснения. Вот что я думаю."
1600203-15 = "Сколько бы я ни исследовала и ни училась..."
1600203-16 = "...никому не нужны мои лекции. Я не знаю, что делать."
1600203-17 = "Я ведь не болтаю без остановки, чтобы казаться всезнайкой."
1600203-18 = "Я просто хочу быть... немного похожей на тебя... Вот и всё."
1600203-19 = "..."
1600203-20 = "Наверное, я действительно слишком много говорю. Ахаха..."
1600203-21 = "Всё равно никому не интересно, что я говорю! Может, мне вообще рот не открывать..."
1600203-22 = "[s] «...»"
1600203-24 = "[s] «...Почему банка солонины трапециевидная?»"
1600203-25 = "Что?"
1600203-26 = "Консервированная солонина? С чего вдруг?"
1600203-27 = "[s3] «Раньше я был занят и не смог об этом услышать.»\n[s4] «Я уже давно об этом думаю.»"
1600203-28 = "Раньше...? Ты не услышал..."
1600203-29 = "Солонина... не выходит у тебя из головы?"
1600203-30 = "..."
1600203-31 = "...!"
1600203-32 = "Э-Это... Ого, значит, тебе действительно стало интересно!"
1600203-33 = "Ахаха! Если хочешь это узнать, ты обратился по адресу! Позволь объяснить...!"
1600203-34 = "Раньше еду нагревали в бутылках из-под шампанского, чтобы она не портилась, а когда содержимое начинало сжиматься, бутылку закупоривали пробкой для герметизации. Но проблема была в том, что..."
1600203-35 = ""
1600203-36 = ""
1600203-38 = "Kotori eyes lit up with excitement again, and she proceeded to talk for another hour, barely stopping to take a breath."
1600203-39 = "The more she was able to divulge her knowledge, the more excited she grew."
1600203-41 = "...и именно поэтому банки солонины имеют трапециевидную форму и открывалку снизу, а не сверху! Кстати, причина, по которой большинство открывалок сверху, заключается в..."
1600203-42 = "...способе..."
1600203-43 = "..."
1600203-44 = "[s] «...Котори?»"
1600203-45 = "..."
1600203-46 = "Сенсей, ты... это...?"
1600203-47 = "Неважно! Нет, вообще-то важно!"
1600203-48 = "Вообще-то! Я только что поняла, что ты спросил... чтобы мне стало лучше!"
1600203-49 = "..."
1600203-50 = "Хи-хи."
1600203-51 = "Спасибо."
1600203-53 = "Kotori smiled a little, and then proceeded with her lecture."
1600203-54 = "I listened to her explanations and stories until she felt satisfied. Eventually, I returned to the club room."
