[translation]
10029010-1 = "Эпизод 1;Нарушитель спокойствия?"
10029010-2 = "По просьбе Эйми я отправился в Миллениум."
10029010-3 = "А. Сенсей. Сюда."
10029010-4 = "Вы прибыли как раз вовремя. Нам нужно действовать немедленно."
10029010-5 = "Президент подготовила для нас эту больничную палату. Именно сюда я принесла незнакомцев, которых нашла в руинах."
10029010-6 = "...К сожалению, возникла проблема."
10029010-7 = "[s1] «Какая проблема?»\n[s2] «Что-то случилось?»"
10029010-10 = "Я вернулась сюда вскоре после того, как связалась с вами."
10029010-11 = "Наверное, будет лучше показать."
10029010-12 = ""
10029010-14 = ""
10029010-18 = "[ns3] «Хм? Странно...»\n[ns4] «Здесь никого нет.»"
10029010-21 = "В этом и проблема."
10029010-22 = "Когда я вернулась, как видите, здесь уже никого не было."
10029010-23 = "Хм? Моего объяснения недостаточно?"
10029010-24 = "Всё именно так, как я сказала. Здесь спали три человека, а теперь они исчезли."
10029010-25 = "Возможно, они проснулись и вышли наружу, или..."
10029010-26 = "Я сообщила президенту. По интонации было понятно, что она пытается скрыть волнение из-за ситуации."
10029010-27 = "...«Возможно, это пустяк, а возможно — дело огромного масштаба.»"
10029010-28 = "Именно так она сказала. Мы просто слишком мало знаем об этих незнакомцах."
10029010-29 = "Поскольку вы уже были в пути, она посоветовала дождаться вас и искать их вместе."
10029010-30 = "Теперь вы здесь. Не поможете мне?"
10029010-31 = "[s5] «Конечно. Нужно немедленно начать поиски.»\n[s6] «Можешь их описать?»"
10029010-34 = "Как и ожидалось от Сенсея: быстро и по делу."
10029010-35 = "Их было трое. Их форма не принадлежит ни одной известной мне академии Кивотоса. И да, ни у кого из них не было оружия."
10029010-36 = "И последнее: пока их перевозили сюда, одна из них... Всё ещё без сознания..."
10029010-37 = "...выпустила..."
10029010-38 = ""
10029010-42 = "...разряд электричества."
10029010-43 = ""
10029010-45 = ""
10029010-46 = "О. Звучало почти так же."
10029010-47 = "[s7] «За этим звуком! Быстро!»\n[s8] «Самую важную деталь ты оставила напоследок!»"
10029010-53 = "Мы с Эйми поспешили к источнику взрыва."
10029010-54 = "Звук точно доносился откуда-то неподалёку..."
10029010-55 = ""
10029010-57 = ""
10029010-58 = "Вон там, Сенсей."
10029010-59 = ""
10029010-60 = ""
10029010-61 = ""
10029010-62 = "*вздыхает*"
10029010-63 = "Где я? Почему все лезут ко мне с дракой? Стоп, важнее другое: почему они все ходят с оружием...?"
10029010-64 = "...О?"
10029010-65 = "По тому, как вы на меня смотрите, кажется, у вас тоже ко мне дело."
10029010-66 = "Хм... Почему-то вы кажетесь знакомой."
10029010-67 = "В обоих случаях ты права. У меня к тебе дело, и мы уже встречались. Не думала, что ты запомнишь."
10029010-68 = "Именно я нашла тебя в руинах. Тогда ты была без сознания..."
10029010-69 = "Не ожидала, что ты устроишь происшествие сразу после пробуждения."
10029010-70 = "...?!"
10029010-71 = "Говоришь, это я устроила происшествие? По твоему тону можно подумать, будто я в чём-то виновата!"
10029010-72 = "Я просто защищаюсь! Эти девчонки здесь..."
10029010-73 = "Ух... Что это вообще было...?"
10029010-74 = "Что-то сверкнуло... потом что-то взорвалось... а потом..."
10029010-75 = "[s9] «Кажется, я уже представляю, что произошло.»\n[s10] «Хорошо, что мы успели до того, как всё стало серьёзнее.»"
10029010-79 = "Именно. Студент, гуляющий без оружия на публике, неизбежно привлечёт нежелательное внимание."
10029010-80 = "Что вы там вдвоём бормочете...? Я вообще ничего не понимаю."
10029010-81 = "В любом случае, раз уж вы разгуливаете с такой серьёзной огневой мощью, сомневаюсь, что вы пришли просто поговорить..."
10029010-82 = "Совсем как те ребята вон там..."
10029010-83 = ""
10029010-85 = ""
10029010-86 = ""
10029010-87 = "...А?"
10029010-88 = "Что за...? Моя сила..."
10029010-89 = "Похоже, это именно ты не заинтересована в разговоре."
10029010-90 = "[s11] «Мы пришли не драться.»\n[s12] «Почему бы нам не разобраться во всём как цивилизованным людям?»"
10029010-93 = "Эм..."
10029010-94 = "Ну, ладно, тогда поговорим. Так в чём вообще ваше дело...?"
10029010-95 = "Вообще-то сначала: где я? Это совсем не похоже ни на одну часть Академгорода, которую я знаю."
10029010-96 = "У вас у всех... оружие какое-то, а над головами парят странные штуки..."
10029010-97 = "Это всё часть Индийского покера...?"
10029010-98 = "Нет, не может быть. Если бы это был Индийский покер, я бы для начала не была самой собой."
10029010-99 = "Что здесь происходит...? Если это не сон, тогда что..."
10029010-100 = "[s13] «Индийский покер...?»\n[s14] «Она разговаривает сама с собой...»"
10029010-103 = "Бессвязное бормотание самому себе — характерный признак психического расстройства."
10029010-104 = "Но если исключить подобное расстройство... Сенсей, полагаю, президент всё-таки была права."
10029010-105 = "[s15] «Она определённо выглядит потерянной.»\n[s16] «...Она не из Кивотоса.»"
10029010-108 = "...А?"
10029010-109 = "Сенсей...?"
10029010-110 = "Значит, этот взрослый..."
10029010-111 = "...учитель?"
10029010-112 = "Если вы учитель..."
10029010-113 = "Тогда человек рядом с вами...?"
10029010-114 = "Изумимото Эйми, первый курс Научной школы Миллениум, член Отряд Исследования Сверхъестественного."
10029010-115 = "...П-Первый курс...?!"
10029010-116 = ""
10029010-118 = ""
10029010-119 = "Ты... студент... в таком наряде?"
10029010-120 = "...?"
10029010-121 = "[s17] «...Ох.»\n[s18] «Она спросила. Она действительно спросила...»"
10029010-124 = ""
10029010-126 = ""
10029010-127 = "Вы преподаёте в школе, где студенты ТАК одеваются?!"
10029010-129 = "Несмотря на несколько неудобных вопросов, так я познакомился с первой из трёх заблудших..."
10029010-131 = "...Понятно."
10029010-132 = "Общую ситуацию я поняла. Не знаю, как это произошло, но, видимо, тут уже ничего не поделаешь."
10029010-133 = "Руины Миллениума — место, где возможны самые разные эзотерические и необычные вещи."
10029010-134 = "То, что люди из другого мира переместились в наш..."
10029010-135 = "Полагаю, какая-то ещё не обнаруженная машина глубоко в руинах вызвала некую энергетическую реакцию."
10029010-136 = "Ты говоришь об этом так спокойно, но понимаешь, насколько безумно всё это звучит?"
10029010-137 = "Путешествие в другой мир? Энергетические реакции...? Ты правда ждёшь, что я в это поверю?"
10029010-138 = "Если честно, всё звучит крайне неправдоподобно. Я даже начинаю думать, что ты всё выдумываешь."
10029010-139 = "Признаю, своих теорий у меня тоже особо нет, но..."
10029010-140 = "Боже мой. Ты сомневаешься во мне, из всех людей? В нежной, но прекрасной гениальной хакерше..."
10029010-141 = "Я понимаю, что манера речи и поведения президента может вызывать сомнения, но, к сожалению, в этом случае я с ней согласна."
10029010-142 = "Эйми...?!"
10029010-143 = "К тому же Отряд Исследования Сверхъестественного не впервые сталкивается с аномалиями."
10029010-144 = "Ещё одно загадочное происшествие не так уж сложно принять."
10029010-145 = "Если уж на то пошло, самое необычное здесь..."
10029010-147 = "...это ты, Мисака Микото."
10029010-148 = "Подумать только, Микото — «эспер», способный управлять электричеством..."
10029010-149 = "Наверное, это я сама тебе рассказала, но сразу обращаться ко мне по имени..."
10029010-150 = "Ну ладно. Хорошо."
10029010-151 = "Так или иначе... Если коротко, существуют два разных Академгорода, хотя внешне они похожи."
10029010-152 = "И в этом нет ни эсперов, ни организаций или учреждений, которые занимаются их изучением?"
10029010-153 = "Я не знаю ни одного случая вроде того, который ты описываешь. Идея эксперимента, способного создать эспера, если честно, мне даже в голову не приходила."
10029010-154 = "Логично. Но я тоже не могла представить место, где у всех студентов над головами светящиеся фигуры и повсюду стреляют из оружия."
10029010-155 = "Ох. Но для студента носить огнестрельное оружие — это ведь здравый смысл, правда, Эйми?"
10029010-157 = "Да. Никто бы с этим не спорил."
10029010-158 = "...???"
10029010-159 = "Что...? И после этого странной считаете меня...?!"
10029010-160 = "А насчёт нимба над моей головой... У тебя тоже такой есть, Микото."
10029010-161 = "...А?"
10029010-162 = "Ч-Что?! И правда...! Откуда он вообще взялся?!"
10029010-163 = "[s19] «Кстати, Эйми говорила, что с тобой были ещё двое.»\n[s20] «Можешь что-нибудь рассказать об остальных?»"
10029010-166 = "...? Моя... группа...?"
10029010-167 = "Хм. Ну... Я почти ничего не помню."
10029010-168 = "Последнее, что помню до попадания сюда, — я использовала Индийский покер. В тот момент рядом со мной никого не было."
10029010-169 = "Что ты подразумеваешь под Индийским покером?"
10029010-170 = "А, конечно. У вас здесь такого, должно быть, нет."
10029010-171 = "Индийский покер... Это карточная игра. По крайней мере, в этом мире это просто игра."
10029010-172 = "Ну да, там, откуда я, так тоже называется карточная игра, но..."
10029010-173 = "Если коротко, это штука, с помощью которой можно увидеть чужие сны."
10029010-174 = "Сначала я именно так и подумала — что это чей-то сон."
10029010-175 = "Те двое... Я не знаю, кто они, но если появились одновременно со мной, скорее всего, они тоже использовали Индийский покер."
10029010-176 = "И эффект так называемого «Индийского покера,» вместе с каким-то механизмом в руинах Миллениума — это и есть..."
10029010-177 = "Понятно. Интересная теория. Нужно будет её изучить."
10029010-178 = "«Интересная?» Это тебе не игра!"
10029010-179 = "Ну, нам незачем быть врагами. Думаю, я должна помочь вам найти тот механизм, чтобы вернуться домой..."
10029010-180 = "Полагаю, можно сказать, что мы на одной стороне, да? Тогда что мне делать? Искать остальных двоих? Вернуться в руины?"
10029010-181 = "Рада твоему энтузиазму, но мне всё ещё нужно изучить этот механизм. Руины настолько огромны, что, если бесцельно по ним бродить, ты только заблудишься."
10029010-182 = "Что касается поиска остальных двоих... Хм. Если я всерьёз возьмусь, это не должно быть сложно."
10029010-183 = "Есть куда более срочный вопрос..."
10029010-184 = "Эйми."
10029010-185 = "Верно."
10029010-186 = "Я уже передала сообщение. Если пойдём сейчас, успеем достать для неё одну."
10029010-188 = "Вы опять говорите загадками. Что именно мне собираются достать?"
10029010-189 = "Иди за мной. Объясню по дороге."
10029010-190 = "Даже если ты из другого мира..."
10029010-191 = "Если продолжишь привлекать внимание, наша работа станет крайне неэффективной. Ты ведь этого не хочешь?"
10029010-192 = "Если хочешь свободно ходить по Кивотосу, сначала нужно выглядеть так, будто ты отсюда."
10029010-193 = "[s21] «...Ага. Понял.»\n[s22] «В Кивотосе поступай как в Кивотосе...»"
10029010-196 = "...? Что вы..."
10029010-197 = "Именно потому, что у тебя этого не было, ты раньше так выделялась, что и привело к той... ситуации."
10029010-198 = "Чтобы решить эту проблему..."
10029010-200 = "...мы познакомим тебя с «обычаями» Кивотоса."
