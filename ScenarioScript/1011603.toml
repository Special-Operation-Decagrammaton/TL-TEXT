[translation]
1011603-1 = "Урок для двоих"
1011603-2 = "Я прибыл по адресу, который прислала Саори, и оказался в ослепительно красивой студии."
1011603-3 = ""
1011603-5 = ""
1011603-6 = "Сенсей. Сюда."
1011603-7 = "[s1] «Так вот эта студия?»\n[s2] «Какое крутое место!»"
1011603-10 = "Мне сказали, что сегодня съёмок нет, поэтому я могу пользоваться помещением свободно."
1011603-11 = "Так что... пожалуйста."
1011603-12 = "Научи меня танцевать."
1011603-13 = "Танец с партнёром... Я понятия не имею, как это делается. Я никогда раньше не танцевала."
1011603-14 = "[s] «О, значит, я твой первый партнёр?»"
1011603-15 = ""
1011603-17 = ""
1011603-18 = "Да."
1011603-19 = "Ты мой первый..."
1011603-20 = ""
1011603-22 = ""
1011603-23 = "Верно. Я рада, что у меня такой... надёжный партнёр."
1011603-24 = "Так что, пожалуйста, веди меня... аккуратно."
1011603-25 = "[s] «К-Конечно...!»"
1011603-26 = "Хм? Что такое? Ты нервничаешь, Сенсей?"
1011603-27 = "...Понятно. Если честно, я тоже немного волнуюсь."
1011603-28 = "Эта комната такая большая..."
1011603-29 = "И всё же мы стоим настолько близко, что чувствуем дыхание друг друга."
1011603-30 = "[s] «Х-Хватит разговоров! Давай уже танцевать!»"
1011603-31 = "...Возможно, это прозвучало слишком интимно. Для тебя это тоже впервые?"
1011603-32 = "Но кроме тебя мне было не к кому обратиться за помощью."
1011603-33 = "...Я бы также хотела, чтобы ты стал моим партнёром на съёмке. Ты не против?"
1011603-34 = "А, можешь отказаться. Я понимаю, что прошу слишком многого."
1011603-35 = "[s3] «Вовсе нет! Позволь мне!»\n[s4] «Я как раз собирался сам тебя об этом попросить!»"
1011603-38 = "...Поняла. Спасибо, Сенсей."
1011603-39 = "Раз мы решили, давай начнём."
1011603-40 = "...Хм, а как вообще начинают танец?"
1011603-41 = "Хм? С приветствия? С вежливого поклона?"
1011603-42 = "Понятно. Хорошо. Я научусь."
1011603-44 = "Приветствие для Сенсея... нет, для моего партнёра."
1011603-49 = "― [log=사오리 드레스 비무장]В-Вот так...?[/log][wa:3620]"
1011603-52 = "― [log=사오리 드레스 비무장]Раз ты так говоришь... Но это немного...[/log][wa:3610]"
1011603-53 = "― [log=사오리 드레스 비무장]Обычно я никогда не принимаю такую позу.[/log][wa:4450]"
1011603-56 = "― [log=사오리 드레스 비무장]Мне немного не по себе, когда обе руки заняты.[/log][wa:3120]"
1011603-57 = "― [log=사오리 드레스 비무장]Было бы довольно трудно, если бы не доверяешь своему партнёру.[/log][wa:4710]"
1011603-60 = "― [log=사오리 드레스 비무장]Может быть... реверанс делают именно так, чтобы показать доверие?[/log][wa:4160]"
1011603-63 = "― [log=사오리 드레스 비무장]Тогда... я буду держать эту позу, пока ты не останешься доволен.[/log][wa:3660]"
1011603-66 = "― [log=사오리 드레스 비무장]Это... доказательство моего доверия.[/log][wa:3310]"
1011603-69 = ""
1011603-70 = "Значит, у реверанса смысл глубже, чем я думала. Полезный урок."
1011603-71 = "Хм? Почему ты улыбаешься? Я что-то неправильно поняла?"
1011603-72 = "...В любом случае, перейдём к следующему шагу."
1011603-73 = "Дальше... нужно взяться за руки?"
1011603-74 = ""
1011603-76 = ""
1011603-77 = "П-Поняла! Я готова! Когда скажешь, Сенсей!"
1011603-78 = "[s] «Поехали, Саори!»"
1011603-79 = ""
1011603-81 = ""
1011603-82 = ""
1011603-83 = "Мы всего лишь держимся за руки... Тогда почему я дрожу?"
1011603-84 = ""
1011603-86 = ""
1011603-87 = ""
1011603-88 = "...Я уже видела такое раньше, издалека, когда работала охраной на вечеринке."
1011603-89 = "Никогда не думала, что сама буду делать то же самое."
1011603-90 = "...И всё благодаря тебе."
1011603-91 = "До сих пор я знала только сражения..."
1011603-92 = ""
1011603-94 = ""
1011603-95 = "Ах..."
1011603-96 = "...Понятно. Так вот отчего я дрожала..."
1011603-97 = "Потому что мы незаметно для меня стали ещё ближе."
1011603-98 = "Мне ещё многому нужно научиться, но хотя бы у меня есть твоя поддержка, Сэн..."
1011603-99 = ""
1011603-102 = ""
1011603-103 = "П-Погоди! Почему ты держишь меня за талию?"
1011603-104 = "Я-Я к такому ещё не готова...!"
1011603-105 = ""
1011603-107 = ""
1011603-108 = "А... В-Вот как? Это часть танца? Прошу прощения."
1011603-109 = "Наверное, я слишком всё усложняю."
1011603-110 = "Значит, теперь... я кладу руку тебе на плечо?"
1011603-111 = "*вдох* Хорошо."
1011603-112 = "П-Поехали, Сенсей!"
1011603-114 = "Я усердно тренировался танцевать вместе с Саори."
