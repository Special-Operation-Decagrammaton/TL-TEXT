[translation]
1008505-1 = "Крупнейший сервер в мире"
1008505-2 = "Хакерская комната Веритас"
1008505-3 = "Прошлой ночью, когда Харэ проводила техническое обслуживание безопасности в клубной комнате Веритас..."
1008505-4 = ""
1008505-6 = ""
1008505-7 = ""
1008505-9 = "Нагрузка системы нормальная. Процессы аварийного восстановления тоже работают как надо..."
1008505-10 = "В логах приложений проблем нет. Думаю, можно смело сообщать, что всё в полном порядке."
1008505-11 = "Только быстро проверю почту."
1008505-12 = ""
1008505-15 = ""
1008505-16 = "А? Что это за сообщение?"
1008505-17 = ""
1008505-19 = ""
1008505-20 = ""
1008505-22 = "...Анонимный вызов?"
1008505-23 = ""
1008505-25 = ""
1008505-28 = "[ns1] «То есть кто-то бросил тебе вызов?»\n[ns2] «Они отправили это вчера во время обслуживания безопасности?»"
1008505-31 = "Да. Отправитель не указан, да и само сообщение довольно расплывчатое..."
1008505-32 = "Но в заголовке совершенно ясно написано «письмо-вызов»."
1008505-33 = "[s] «Может, это просто розыгрыш?»"
1008505-34 = "Я тоже так подумала, но письмо внезапно появилось прямо во время обслуживания сервера."
1008505-35 = "К тому же это письмо-вызов вообще не проходило через сервер обычным способом."
1008505-36 = "Значит, хакер проник на мой компьютер, написал свой вызов, а затем полностью замёл следы."
1008505-37 = "Взломать меня именно во время обслуживания сервера... Этого я им не прощу."
1008505-38 = "[s3] «Кто-то, способный в реальном времени взломать сеть Веритас...»\n[s4] «Должно быть, он очень умелый.»"
1008505-41 = "В Кивотосе не так много людей, достаточно опытных, чтобы взломать сервер Веритас."
1008505-42 = "Как хакер, я не могу просто стерпеть такое оскорбление своего достоинства."
1008505-43 = "[s] «Что было написано в сообщении?»"
1008505-44 = "Эм... Ну..."
1008505-45 = "Там было указано местоположение «сервера с наибольшим объёмом данных во всём Кивотосе» и приложены зашифрованные координаты."
1008505-46 = "Если у них действительно есть «сервер с наибольшим объёмом данных в Кивотосе», то я ещё и мост могу им продать..."
1008505-47 = "В остальном эти координаты — единственная информация, которая у нас есть об этом хакере."
1008505-48 = "[s] «Тогда давай сходим и навестим его.»"
1008505-49 = "Таков план. Но с этими координатами есть одна крошечная, совсем маленькая и огромная проблема."
1008505-50 = "Эти координаты..."
1008505-52 = "...ведут прямо в середину горы."
1008505-53 = "[s5] «Ты выдержишь подъём в горы?»\n[s6] «Только не говори, что гора очень высокая?»"
1008505-54 = "Клянусь, если мы залезем на вершину и там ничего не окажется, я закричу."
1008505-55 = "К счастью, на вершину нам не нужно. Просто приятная прогулка до нужной точки."
1008505-56 = "...Клянусь, если нам всё-таки придётся лезть на вершину и там ничего не будет, я закричу."
1008505-57 = "Вы наверняка знаете, что занятия на природе вроде походов — моя ахиллесова пята. Абсолютная слабость."
1008505-58 = "Я буду выглядеть полной дурой, если клюну на эту очевидную приманку и зря полезу на гору."
1008505-59 = "Сенсей, наверняка мы можем проверить этот сервер без моего подъёма на гору?"
1008505-60 = "Можно отправить дрон. Или взломать спутниковую камеру."
1008505-61 = ""
1008505-64 = "[ns] «...Зашнуровывай походные ботинки.»"
1008505-65 = "Угх... Сенсей, пожалуйста, я ПРАВДА не хочу идти."
1008505-66 = "Ладно, ладно! Пойду! Только дайте найти ботинки."
1008505-67 = "...Куда я вообще положила ботинки?"
1008505-68 = ""
1008505-70 = ""
1008505-73 = "Мы с Харэ отправились подниматься на гору, к которой нас направил анонимный хакер."
1008505-78 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
1008505-79 = "[s7] «Харэ, ты в порядке?»\n[s8] «Тебе нужна вода?»"
1008505-82 = "Всё... нормально... но я едва держусь..."
1008505-83 = "Если после всего этого... мы наткнёмся на какую-нибудь глупость вроде призрака..."
1008505-84 = "Кем бы ни был этот хакер... ему лучше быть осторожнее..."
1008505-87 = "[ns] «Мы почти пришли...»"
1008505-88 = "Эм..."
1008505-89 = "Здесь всегда было какое-то здание на горе?"
1008505-90 = ""
1008505-93 = "По карте здесь вообще ничего не должно быть."
1008505-94 = "[s] «Может, это заброшенный дата-центр?»"
1008505-95 = "Нет. Не думаю."
1008505-96 = "Архитектура не подходит. У дата-центра должно быть множество кондиционеров, чтобы отводить тепло от серверов."
1008505-97 = "И ещё почти никакой охраны. Будто это..."
1008505-98 = "[s] «Давай проверим.»"
1008505-99 = "...Да. Что бы это ни было, правду мы узнаем только внутри."
1008505-100 = ""
1008505-102 = ""
1008505-108 = "Как и ожидалось... Для дата-центра тут слишком много пустого пространства. Процессоры должны были бы стоять от стены до стены."
1008505-109 = "И посмотрите на эту пыль. Здесь годами не было ни гостей, ни работников... Не очень похоже на «сервер с наибольшим объёмом информации в Кивотосе»."
1008505-110 = ""
1008505-112 = ""
1008505-113 = "А? Что это за компьютер, вмонтированный в стену?"
1008505-114 = "[s] «Может, это терминал сервера?»"
1008505-115 = "Возможно... Давайте посмотрим..."
1008505-116 = ""
1008505-118 = ""
1008505-119 = ""
1008505-120 = ""
1008505-121 = ""
1008505-122 = "...А?"
1008505-123 = ""
1008505-127 = "[ns9] «П-Потолок двигается!»\n[ns10] «Харэ, осторожно!»"
1008505-130 = "Подождите, это... Стойте секунду, Сенсей!"
1008505-131 = ""
1008505-133 = ""
1008505-134 = ""
1008505-135 = ""
1008505-136 = "Угх... Нас обманули. Как я и думала."
1008505-137 = "Сенсей, можете прочитать, что там написано?"
1008505-138 = "[s] «Добро пожаловать в третий общественный планетарий Кивотоса...»"
1008505-139 = "Именно. Думаю, это обсерватория, которую давно закрыли."
1008505-140 = "Если подумать... В детстве я слышала историю о радиообсерватории, закрытой после того, как её телескоп устарел... Может, это она."
1008505-141 = "Тот терминал открывает крышу для наблюдения за небом. А раз обсерватория была общественной, понятно, почему тут столько следов пребывания людей."
1008505-142 = "Эх... Этот хакер и правда выставил нас дураками."
1008505-143 = "[s11] «Значит, все эти слова про „сервер с наибольшим объёмом информации в Кивотосе“...»\n[s12] «Мы проглотили наживку целиком...»"
1008505-146 = "Ну, благородными его намерения я бы не назвала."
1008505-147 = "Но и полностью нам не солгали."
1008505-148 = "Если перевести всю лучистую энергию, приходящую от звёзд, в данные, объём затмит возможности любого обычного сервера."
1008505-149 = "...Так что назвать обсерваторию «крупнейшим сервером Кивотоса» — вообще-то довольно остроумно."
1008505-150 = ""
1008505-152 = ""
1008505-154 = ""
1008505-155 = "О, Сенсей. Солнце уже садится."
1008505-156 = "Если вы не против, может, перед спуском посмотрим на звёзды через местный телескоп?"
1008505-157 = "Тогда, возможно, поездка всё-таки была не зря."
1008505-158 = "[s] «Конечно. Давай посмотрим на звёзды.»"
1008505-159 = ""
1008505-161 = ""
1008505-162 = ""
1008505-165 = "Мы с Харэ поднялись к огромному телескопу, закреплённому под потолком обсерватории."
1008505-168 = "― [log=하레 캠핑]Небо просто переполнено светом...[/log][wa:2080]"
1008505-171 = "― [log=하레 캠핑]Кажется, это первый раз,[/log][wa:10]"
1008505-173 = "― [log=하레 캠핑]когда я вижу, как ночное небо сияет вот так.[/log]"
1008505-176 = "― [log=하레 캠핑]Меня поражает мысль о том, что[/log][wa:2590]"
1008505-178 = "― [log=하레 캠핑]каждая из этих сияющих точек — это узел,[/log][wa:460]"
1008505-181 = "― [log=하레 캠핑]содержащий колоссальный объём данных.[/log][wa:2370]"
1008505-184 = "― [log=하레 캠핑]Даже если собрать всё, что я знаю,[/log][wa:1190]"
1008505-186 = "― [log=하레 캠핑]я всё равно не смогу сравниться с этими огнями.[/log][wa:540]"
1008505-189 = "― [log=하레 캠핑]...Но я не сдамся.[/log][wa:3250]"
1008505-191 = "― [log=하레 캠핑]Потому что истина — это свет, который освещает всё.[/log][wa:320]"
1008505-194 = "― [log=하레 캠핑]Я приветствую[/log][wa:3070]"
1008505-196 = "― [log=하레 캠핑]все звёзды, сияющие в небе.[/log][wa:70]"
1008505-199 = "― [log=하레 캠핑]Привет. Как поживаете?[/log][wa:1890]"
1008505-202 = "Я слушал приятную беседу Харэ с небесами. В школу мы вернулись уже под утро."
