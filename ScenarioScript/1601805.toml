[translation]
1601805-1 = "Сила капитана"
1601805-2 = "[ns] «*тяжело дышит* *тяжело дышит*»"
1601805-3 = "..."
1601805-4 = "[s] «*пыхтит* *задыхается* *пыхтит*»"
1601805-5 = ""
1601805-8 = "[ns] «*тяжело дышит* *пыхтит* *задыхается* *пыхтит*»"
1601805-10 = "[ns] «Ух... *пыхтит*»"
1601805-11 = "Да ладно! Теперь ты просто привлекаешь внимание."
1601805-12 = "Вообще... сколько ты бежал?"
1601805-13 = "[s] «Я бежал всю дорогу от Шале.»"
1601805-14 = "Ты знаешь, что существуют автобусы? Поезда? Даже такси? *вздыхает*"
1601805-15 = "Стоило мне только упомянуть Чёрный рынок, и ты понёсся как идиотский щенок."
1601805-16 = "Ты реально слишком себя накрутил!"
1601805-17 = "Прости, но тут правда ничего такого особенного."
1601805-18 = "Вот, посмотри."
1601805-19 = "[s1] «Торговый автомат?»\n[s2] «Ты купила торговый автомат? Невероятно!»"
1601805-20 = "Ага, точно."
1601805-21 = "Будь серьёзен. Я купила кое-что ИЗ него."
1601805-22 = "Смотри. Видишь, как дёшево?"
1601805-23 = "20 йен! За целую бутылку, и не какую-нибудь крошечную."
1601805-24 = "Я просто подумала, что тебе стоит знать. Вдруг будешь проходить мимо и захочешь пить."
1601805-25 = ""
1601805-27 = ""
1601805-28 = "П-Просто говорю."
1601805-29 = "[s3] «Совершенно секретная информация Чёрного рынка от Рабу...»\n[s4] «Надо записать...»"
1601805-32 = "Ну ты и драматизируешь!"
1601805-33 = "Ладно, раз уж ты проделал весь путь сюда, куплю тебе одну. Да и выглядишь ты... немного вспотевшим."
1601805-34 = "Работа идёт неплохо, так что 20 йен я, думаю, могу себе позволить, да?"
1601805-35 = "[s] «Сок от Рабу. Надо выставить его на пьедестал!»"
1601805-36 = "З-Заткнись!"
1601805-37 = ""
1601805-41 = "Вот. Просто выпей и успокойся."
1601805-42 = "[s5] «Я так благодарен за особый сок от Рабу!»\n[s6] «Чувствую, как его сила проникает в мои кости.»"
1601805-45 = "После такого забега даже обычная вода показалась бы вкусной."
1601805-46 = "Уф."
1601805-47 = "Ур-р, почему не открывается...? Угххх!"
1601805-48 = "[s7] «Ты поранилась?»\n[s8] «Ты заболела?»\n[s9] «Ты... голодная?!»"
1601805-52 = "Сенсей, тебе кто-нибудь когда-нибудь говорил расслабиться?"
1601805-53 = "Просто... Этот сок... Крышка так туго закручена. Они её что, ПРИКЛЕИЛИ?"
1601805-54 = "Ур-р-р-р!"
1601805-55 = "Ух! Какая морока! Может, просто ПРОСТРЕЛИТЬ её?"
1601805-56 = "[s] «Дай сюда.»"
1601805-57 = "Осторожно. На тебе нет перчаток, как у меня. Ладонь обдерёшь."
1601805-58 = "Если заело, нужно взять резинку и, может быть..."
1601805-59 = ""
1601805-62 = ""
1601805-63 = "[ns] «Держи.»"
1601805-64 = "..."
1601805-65 = "Не смей смеяться! Ни слова!"
1601805-66 = "[s] «Но я даже не...»"
1601805-67 = "*вздыхает*"
1601805-68 = "Я знаю, что могу долго продержаться в драке. Ты сам видел."
1601805-69 = "Но хватка у меня ужасно слабая. Я стараюсь не рисковать и не открывать бутылки при ребятах."
1601805-70 = "Я просто не подумала. Теперь ты знаешь..."
1601805-71 = "[s] «Я буду открывать тебе бутылки в любой день недели.»"
1601805-72 = "Ч-Что ты несёшь?!"
1601805-73 = "В любом случае! Если хоть кому-нибудь шепнёшь, как я пыталась и не смогла открыть это, разрежу тебя на кусочки и отправлю посылкой обратно в Шале!"
1601805-74 = "А теперь отдай мой сок!"
1601805-75 = "[s] «Эм...»"
1601805-76 = ""
1601805-78 = ""
1601805-80 = "Рабу выхватила у меня бутылку с соком и скрылась в толпе."
1601805-81 = "...Я почти не успел его попробовать."
