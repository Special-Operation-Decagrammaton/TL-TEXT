[translation]
1008305-1 = "Моя тайная сторона"
1008305-2 = "Торговый квартал Хяккияко"
1008305-4 = "Поскольку встречу с Кикё отменили, я заглянул в торговый квартал Хяккияко по нескольким делам."
1008305-5 = ""
1008305-8 = "[ns] «С просьбой Клуба Инь-Ян разобрались. Что дальше?»"
1008305-9 = ""
1008305-12 = ""
1008305-13 = "О? Разве вы не Сенсей из Шале?"
1008305-14 = "Какими судьбами сегодня в нашем торговом квартале?"
1008305-15 = "[s] «Просто заканчиваю кое-какую работу для Шале.»"
1008305-16 = "Ха-ха. Как всегда трудолюбивы!"
1008305-17 = "От лица всех местных жителей — спасибо. Ваша тяжёлая работа приносит пользу всем нам."
1008305-18 = "У нас здесь замечательные студенты, правда? Члены Хяккарёран так старались защищать нас во время той неразберихи с Фестивалем фонарей."
1008305-19 = "Особенно мне запомнилась одна девушка... Кикё, кажется? Она словно была повсюду одновременно и всем помогала. Это было впечатляюще!"
1008305-20 = "[s] «Очень похоже на Кикё.»"
1008305-21 = "А! Так вы её знаете! Вы близки со студентами Хяккарёран, Сенсей?"
1008305-22 = "Тогда вы как раз вовремя!"
1008305-23 = ""
1008305-25 = ""
1008305-27 = ""
1008305-28 = ""
1008305-29 = "Я бы хотел угостить вас этими вагаси нашего собственного приготовления! Берите сколько хотите... и буду очень признателен, если немного отнесёте и Хяккарёран."
1008305-30 = "[s] «С удовольствием.»"
1008305-31 = "Как-нибудь приходите вместе с Кикё. За счёт заведения!"
1008305-37 = "[ns] «Каким-то образом бесплатные сладости достались и мне.»"
1008305-38 = "Стоило мне отойти после этой неожиданной встречи..."
1008305-39 = ""
1008305-41 = ""
1008305-42 = "А! Это же Сенсей!"
1008305-43 = "Здравствуйте, здравствуйте! Сегодня тоже патрулируете?"
1008305-44 = "А, нет? Значит, Кикё с вами нет. Жаль."
1008305-45 = "...Ой, нет, ничего такого! У меня к ней нет никаких дел. Просто хотела поблагодарить за помощь в прошлый раз."
1008305-46 = ""
1008305-48 = ""
1008305-49 = "Я знаю!"
1008305-50 = ""
1008305-52 = ""
1008305-53 = "Эм, не могли бы вы передать Кикё этот благодарственный подарок, который я сделала? Я немного стесняюсь вручать его лично..."
1008305-54 = "[s] «Без проблем.»"
1008305-55 = ""
1008305-57 = ""
1008305-58 = "Правда?! Спасибо! Огромное спасибо!"
1008305-60 = "О, да это же Сенсей. Опять по делам? Не забывайте: одна работа без отдыха ещё никому пользы не приносила!"
1008305-61 = "Хотя я слышал, что после возвращения Хяккарёран дела идут куда спокойнее! Какое облегчение."
1008305-62 = "В последнее время на улицах стало безопаснее. Недавно одна из Хяккарёран даже помогла мне с неприятным клиентом."
1008305-63 = "Как же её звали? Кажется, Кикё?"
1008305-64 = ""
1008305-66 = ""
1008305-68 = "Вот, за счёт заведения! Сегодня как раз свежая поставка! А знаете что, возьмите ещё одну для Кикё!"
1008305-70 = "[ns] «Все так рады возвращению Хяккарёран.»"
1008305-71 = "Встречая всё новых жителей, которым помогли члены Хяккарёран, я всё сильнее гордился ими."
1008305-72 = ""
1008305-75 = "[ns] «Руки уже заняты. Пора отнести все эти подарки.»"
1008305-76 = ""
1008305-82 = "Я отправился в Хяккарёран, но внутри было тихо."
1008305-83 = ""
1008305-87 = "[ns] «Я думал, Кикё уже будет здесь. И трубку она не берёт...»"
1008305-88 = ""
1008305-92 = "[ns] «Не могу же я просто вломиться. Придётся отдать подарки в другой раз.»"
1008305-93 = "Я уже решил, что ничего не остаётся, кроме как вернуться в офис Шале..."
1008305-94 = ""
1008305-99 = "У-ух..."
1008305-100 = ""
1008305-103 = "[ns] «А? Это было...?»"
1008305-104 = ""
1008305-112 = "*тяжело дышит*... *тяжело дышит*..."
1008305-114 = "[ns] «Кикё?! Ты в порядке?!»"
1008305-115 = ""
1008305-118 = ""
1008305-119 = "[ns] «У тебя сильный жар! Нужно перенести тебя туда, где будет удобнее!»"
1008305-120 = ""
1008305-122 = ""
1008305-139 = ""
1008305-140 = ""
1008305-141 = "Это... клубная комната? Как...?"
1008305-142 = "[s] «Ты проснулась! Как себя чувствуешь?»"
1008305-143 = ""
1008305-145 = ""
1008305-146 = "...Сенсей? Почему вы здесь?"
1008305-147 = "...У вас были другие дела, поэтому вы зашли в торговый квартал Хяккияко?"
1008305-148 = "Ваша привычка вмешиваться куда не просят действительно—"
1008305-149 = ""
1008305-151 = ""
1008305-153 = "*кашляет* *кашляет*"
1008305-154 = "[ns] «Ты ужасно выглядишь! Что случилось?»"
1008305-155 = "Прекратите драматизировать. Это обычная болезнь."
1008305-156 = "[s1] «Так вот что значили те странные сообщения...»\n[s2] «И вот почему ты отменяла наши встречи...»"
1008305-157 = "Не придавайте этому лишнего значения."
1008305-158 = "Те сообщения были ошибкой. Всё не настолько серьёзно."
1008305-159 = "Не просто так это называют «обычной» простудой."
1008305-160 = "Перестаньте переживать из-за таких мелочей."
1008305-161 = "Я бы предпочла, чтобы вы не видели меня в таком состоянии."
1008305-162 = "Это просто..."
1008305-163 = "Полагаю, оправдываться уже слишком поздно."
1008305-166 = "И всё же... зачем вам было видеть меня именно такой?"
1008305-167 = "Я поступила безответственно. Отменила встречи, которые сама же назначила..."
1008305-168 = "...и даже потеряла сознание из-за жара."
1008305-169 = "Похоже, я никогда не перестану доставлять вам неприятности, Сенсей."
1008305-170 = "Я не должна валиться с ног из-за простой простуды."
1008305-171 = "[s] «Кикё, ты разве не чувствуешь усталость?»"
1008305-172 = ""
1008305-174 = ""
1008305-175 = "Усталость? Что за обвинение..."
1008305-176 = "Я оперативный офицер Хяккарёран. Я не устаю."
1008305-177 = ""
1008305-182 = ""
1008305-183 = "...Что всё это?"
1008305-184 = "[s] «Мне это дали жители торгового квартала по пути сюда.»"
1008305-185 = ""
1008305-187 = ""
1008305-188 = "Пожалуй, впервые в жизни я увидел, как глаза Кикё искренне расширились от шока при виде всех знаков благодарности, подаренных Хяккарёран."
1008305-189 = "[ns] «Ты никогда не перестаёшь стараться изо всех сил.»"
1008305-190 = "...Само собой."
1008305-191 = "Из-за внутренних конфликтов Хяккарёран нам пришлось приостановить всю обычную деятельность клуба."
1008305-192 = "Поэтому нашей... естественной обязанностью... было приложить все силы, чтобы вновь заслужить их доверие."
1008305-193 = "Даже сейчас... мы не должны прекращать попытки искупить прошлое."
1008305-194 = "[s] «Кикё...»"
1008305-195 = "*кашляет* *кашляет*"
1008305-196 = "*вздох* Вот и всё."
1008305-197 = "Я ненавижу, когда меня недооценивают. И совершенно не выношу демонстрировать такую слабость."
1008305-198 = "Оправдания по поводу неудач Хяккарёран раздражают меня."
1008305-199 = "Я наш оперативный офицер... Я не могу подвести здесь... ни при каких обстоятельствах."
1008305-200 = "Что я вообще болтаю? У вас есть собственные обязанности, Сенсей. Теперь со мной всё совершенно нормально."
1008305-201 = ""
1008305-203 = ""
1008305-205 = ""
1008305-206 = ""
1008305-208 = "[ns] «Кикё, ложись.»"
1008305-210 = ""
1008305-211 = "Ч-Ч-Что вы делаете? Я не позволю так мной командовать...!"
1008305-212 = "[s] «Разве ты сама не говорила, что отдых очень важен?»"
1008305-213 = ""
1008305-215 = ""
1008305-220 = "Это не...!"
1008305-221 = "Вы намеренно так открыто игнорируете мои желания? Я не хочу, чтобы вы видели мои слабости!"
1008305-222 = "[s] «Я не считаю тебя слабой, Кикё.»"
1008305-223 = "Ну..."
1008305-224 = "[s3] «Я просто хочу протянуть руку помощи студенту, которому тяжело.»\n[s4] «Моя обязанность как твоего учителя — заботиться о тебе.»"
1008305-227 = "[ns5] «Но если тебе неприятно полагаться на меня...»\n[ns6] «Можешь считать меня ресурсом в своём распоряжении.»"
1008305-228 = ""
1008305-229 = ""
1008305-230 = "[ns] «В конце концов, чем больше ресурсов, тем лучше. Разве нет?»"
1008305-231 = "...Используете мои же слова против меня."
1008305-232 = "Эта ситуация..."
1008305-233 = "Вы ставите меня в тупик. Что вы получаете, помогая мне?"
1008305-234 = "Мне нечем вам отплатить."
1008305-235 = "Я не являюсь полезным ресурсом."
1008305-236 = ""
1008305-238 = ""
1008305-239 = "..."
1008305-240 = "...Мне ещё никогда не доводилось иметь несчастье встретить кого-то вроде вас."
1008305-241 = ""
1008305-243 = ""
1008305-244 = "Странный..."
1008305-245 = "И правда..."
1008305-246 = "Просто очень, очень странный человек."
1008305-247 = "[s] «Немного обидно, когда ты называешь меня странным!»"
1008305-248 = "Хмф. Я лишь честно выразила свои мысли."
1008305-249 = "...*кашель* *кашель*"
1008305-250 = "Ха. Делайте что хотите."
1008305-251 = "Но, Сенсей..."
1008305-252 = "То, что вы сказали... о заботе обо мне... убедитесь, что..."
1008305-253 = "...однажды вы об этом не пожалеете..."
1008305-254 = "Оперативный офицер... Хяккарёран..."
1008305-255 = "...вы ещё не знаете, насколько страшной она может быть..."
1008305-258 = "..."
1008305-259 = "[s] «Я никогда об этом не пожалею.»"
1008305-260 = ""
1008305-266 = "[ns] «Спокойной ночи, Кикё.»"
