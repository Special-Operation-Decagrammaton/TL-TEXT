[translation]
1006306-1 = "Ожидаемое поведение"
1006306-3 = "Бродя по центру города, я наткнулся на Коюки в игровом зале, полностью поглощённую игрой."
1006306-4 = "Ну же! Пожалуйста, пожалуйста, пожалуйста! Это мой шанс!"
1006306-5 = ""
1006306-9 = "...Эм...?"
1006306-10 = ""
1006306-15 = "Ого! Нет! О! Ладно... Ой-ой!"
1006306-16 = ""
1006306-20 = "Стой... Пожалуйста! Ну же, ну же..."
1006306-21 = ""
1006306-25 = ""
1006306-26 = ""
1006306-27 = ""
1006306-29 = "АААААААААРГХ!"
1006306-30 = "Нет-нет-нет! Ха. Ниха-ха. Как?! Как это могло произойти?"
1006306-31 = "Невозможно! Столько раз подряд проиграть... Это просто невозможно!"
1006306-32 = "Это вообще НЕ имеет смысла! Ух!"
1006306-33 = ""
1006306-39 = "АААААААААРГХ!"
1006306-40 = ""
1006306-48 = ""
1006306-49 = "[ns1] «Привет, Коюки.»\n[ns2] «Бить вещи — не самый здоровый способ выражать раздражение.»"
1006306-52 = "*вздох* П-простите!"
1006306-53 = ""
1006306-55 = ""
1006306-56 = "О! Сенсей?! Что вы здесь делаете?"
1006306-57 = "Просто проходили мимо? П-понятно. Каковы шансы?"
1006306-58 = "...О, хотите знать, чем я занимаюсь? Разве не очевидно? Играю! Она называется Teatime Hiking, и..."
1006306-59 = "Это мусор! Мусорная игра. Она супертяжёлая, и всё зависит от рандома!"
1006306-60 = "*вздыхает* Большинство людей без всяких усилий доходят до пятого уровня, а я даже третий пройти не могу..."
1006306-61 = "[s3] «Ты правда любишь игры, да?»\n[s4] «Эта сцена почему-то кажется знакомой...»"
1006306-64 = "Ну да, наверное, но..."
1006306-65 = "Да ладно! Надо быть ужасно скучным человеком, чтобы не любить игры. ...О, вы ведь тоже любите игры?"
1006306-66 = "Любите? Я так и знала! Я же говорила!"
1006306-67 = "...А?"
1006306-68 = "Хотите узнать, какие игры мне нравятся? Хм... Наверное, проще сказать, какие не нравятся..."
1006306-69 = "Иногда старшекурсницы предлагают сыграть со мной в шахматы, и мне приходится срочно отступать."
1006306-70 = "Не люблю игры, где нужно сидеть, продумывать стратегию или решать кучу логических задач."
1006306-71 = "Разве не веселее играть в непредсказуемые игры? Вам не нравится это чувство, когда происходит что-то совсем маловероятное?"
1006306-72 = "Это же так захватывает! Когда что-то вообще не имеет логического смысла, но всё равно случается — вот это я люблю больше всего!"
1006306-73 = "[s5] «Довольно рискованное увлечение.»\n[s6] «Кажется, я понимаю, о чём ты.»"
1006306-76 = "Ниха-ха..."
1006306-77 = "Ага. Ну, вы же знаете, я не самая везучая девушка! Почти всегда в итоге проигрываю."
1006306-78 = "Но зато, когда всё-таки получается, это становится ещё захватывающее!"
1006306-79 = "Прямо как когда я сбегаю, а C&C уже наступает мне на пятки..."
1006306-80 = "[s7] «Ты уверена, что хочешь привести именно такое сравнение?»\n[s8] «В прошлый раз ты вроде не особо веселилась.»"
1006306-83 = "Блин, это же просто сравнение! Не надо воспринимать всё настолько буквально. Я лишь хотела сказать, что всё в жизни зависит от того, как на неё смотреть!"
1006306-84 = "...А? Это не имеет смысла."
1006306-85 = "Почему вы говорите о посеве и жатве? Я не фермер."
1006306-86 = "О, думаете... моя удача улучшится, если я начну нормально вести себя каждый день?"
1006306-87 = "Хм, звучит всё равно нелогично."
1006306-88 = "Я просто не вижу связи между играми и моим повседневным поведением."
1006306-89 = "Я понимаю, что вы учитель и хотите превратить это в урок—"
1006306-90 = ""
1006306-92 = ""
1006306-93 = "Стойте, стойте."
1006306-94 = "Мы можем это проверить! Если ваши слова правдивы..."
1006306-95 = "Такой человек, как вы, который постоянно помогает другим, должен иметь невероятную удачу в играх, верно? Верно?"
1006306-96 = "...А?"
1006306-97 = "О, вы не это имели в виду? Ладно, понимаю. Вижу, что вы делаете."
1006306-98 = "Честно говоря, я примерно этого и ожидала. Но надеялась ошибиться."
1006306-99 = "В итоге, наверное, вы просто..."
1006306-100 = "Не..."
1006306-101 = "Думаете, что сможете меня победить?"
1006306-102 = "[s9] «...?»\n[s10] «...Что?»"
1006306-105 = "Я лишь говорю, что ужасно играю, но даже я могу пройти второй уровень. А вы тут изо всех сил избегаете игры."
1006306-106 = "Но если вы действительно имели в виду то, что сказали, и правда думаете, что удача зависит от поведения..."
1006306-107 = "Кажется, такой человек, как вы, без проблем доберётся до десятого уровня."
1006306-108 = "Но кто знает. Было бы разочаровывающе, но, может, вы только говорить умеете."
1006306-109 = "Если нет, то мой рекорд вы точно побьёте, правда?"
1006306-110 = ""
1006306-112 = ""
1006306-113 = ""
1006306-114 = "...Хотите, чтобы я подвинулась?"
1006306-115 = "[s11] «Отойди.»\n[s12] «Я покажу, на что способен.»\n[s13] «Ты ещё возьмёшь свои слова обратно.»"
1006306-119 = ""
1006306-121 = ""
1006306-126 = "Итак, я начал играть в Teatime Hiking, а Коюки внимательно наблюдала."
1006306-128 = "Я потратил все деньги, которые были в карманах, но так и не смог пройти второй уровень."
1006306-129 = ""
