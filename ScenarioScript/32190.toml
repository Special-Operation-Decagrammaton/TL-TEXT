[translation]
32190-1 = "Episódio 19;3º Exame Especial de Proficiência Acadêmica"
32190-3 = "A-Auu... Aconteceu tanta coisa que estou completamente exausta..."
32190-4 = "Finalmente tudo se acalmou, não é...?"
32190-5 = "Sim..."
32190-10 = "Koharu-chan!?"
32190-11 = "D-Desculpa, minhas forças sumiram de repente... O-Obrigada."
32190-12 = "Também não é para menos, corremos de um lado para o outro a noite inteira..."
32190-13 = "E na última semana também não conseguimos dormir direito. Mas agora, finalmente..."
32190-17 = "Do que está falando, Hifumi? É agora que tudo começa."
32190-19 = "...Oi?"
32190-20 = "Ah..."
32190-21 = "É-É mesmo, o exame..."
32190-22 = "...Eu tinha esquecido."
32190-24 = "O horário atual é 7h50 da manhã."
32190-25 = "Precisamos chegar ao local do exame em uma hora. Vamos correr."
32190-30 = "Quêê!? Vamos correr!? Espere, Azusa-chan, você é rápida demais! Isso lá é distância para ir correndo daqui!?"
32190-31 = "Hmm, se corrermos com tudo, acho que chegamos bem em cima da hora, não? Vamos lá, Hifumi-chan, Koharu-chan! Força!"
32190-35 = "Uuu, minhas pernas já estão doendo só de andar... Me esperem...!"
32190-36 = "P-Por que tem que ser assim até o último segundo...!?"
32190-39 = "Arf, arf, haa, haa... haa... haa... Não, aguento mais..."
32190-40 = "F-Finalmente chegamos..."
32190-41 = "Estava aguardando por vocês, pessoal do Clube de Aulas de Reforço. Tenho um recado da vice-presidente Hasumi."
32190-42 = "Ela disse... \"Dêem o seu melhor\"."
32190-43 = "Ora, ora."
32190-44 = "H-Hasumi-senpai...!"
32190-45 = "E também disse... \"Me desculpem por não ter podido ajudar. Eu certamente compensarei vocês por isso algum dia\"."
32190-46 = "...Entendo."
32190-47 = "[s] \"Certo. Então, vamos entrar?\""
32190-51 = "..."
32190-52 = "..."
32190-53 = "..."
32190-54 = "..."
32190-55 = "[s] \"Este é o último exame.\""
32190-56 = "...Sim. Qualquer que seja o resultado, este exame decidirá tudo."
32190-57 = "É verdade."
32190-58 = "Auu..."
32190-59 = "...!"
32190-60 = "...Passamos por tanta coisa até chegar aqui, não é?"
32190-61 = "...Eu entendo como se sente, mas vamos deixar o sentimentalismo para depois que o exame acabar."
32190-62 = "Sim, você tem razão... De qualquer forma, vamos mostrar todo o fruto do nosso esforço."
32190-63 = "Sim, não vamos desistir até o fim."
32190-64 = "Sim, eu também. Afinal, a Azusa-chan se deu ao trabalho de me ensinar."
32190-65 = "D-Dessa vez eu vou tirar nota máxima! Vocês vão ver só!"
32190-67 = "[ns] \"Muito bem, 3º Exame Especial de Proficiência Acadêmica... Comecem!\""
