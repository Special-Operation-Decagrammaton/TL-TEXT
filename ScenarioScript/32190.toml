[translation]
32190-1 = "Эпизод 19;Третий экзамен"
32190-3 = "Э-Эм..."
32190-4 = "Наконец всё закончилось?"
32190-5 = "Думаю, да."
32190-6 = ""
32190-8 = ""
32190-9 = ""
32190-10 = "Кохару?!"
32190-11 = "Я-Я там чуть не отключилась."
32190-12 = "Неудивительно. Мы всю ночь бегали."
32190-13 = "Не говоря уже о том, как поздно ложились всю прошлую неделю из-за учёбы."
32190-14 = ""
32190-16 = ""
32190-17 = "Чего вы все так расслабились? Ещё ничего не закончилось."
32190-19 = "А?"
32190-20 = "О."
32190-21 = "Т-Точно! Нам ещё экзамен сдавать."
32190-22 = "Я забыла..."
32190-24 = "Сейчас 7:50."
32190-25 = "Значит, у нас чуть больше часа, чтобы добраться до места экзамена. Бежим!"
32190-26 = ""
32190-28 = ""
32190-30 = "П-Подождите! Даже если побежим, мы успеем до самой окраины?!"
32190-31 = "Шансы небольшие, но не узнаем, пока не попробуем! Давайте, девочки, двигаемся!"
32190-32 = ""
32190-34 = ""
32190-35 = "Но я почти не чувствую ног! Подожди-и-ите!"
32190-36 = "*вздох* Почему у нас всегда всё заканчивается вот так...?"
32190-39 = "*тяжело дышит* Больше... не... могу..."
32190-40 = "М-Мы добрались..."
32190-41 = "Мы ждали вас, Клуб дополнительных занятий. У меня сообщение от заместителя председателя Хасуми."
32190-42 = "Она сказала: «Удачи»."
32190-43 = "Ну что ж."
32190-44 = "Х-Хасуми пожелала мне удачи...?"
32190-45 = "Она также просила передать, как сильно сожалеет, что не смогла помочь сегодня утром, и обещала всё компенсировать."
32190-46 = "Интересно."
32190-47 = "[s] «Все готовы войти?»"
32190-51 = "..."
32190-52 = "..."
32190-53 = "..."
32190-54 = "..."
32190-55 = "[s] «Вот и всё. Третий и последний экзамен.»"
32190-56 = "Именно. На кону всё."
32190-57 = "Ты права."
32190-58 = "Я довольно сильно нервничаю."
32190-59 = "..."
32190-60 = "Мы столько всего пережили вместе."
32190-61 = "Это правда, но после того, как сдадим экзамен, у нас будет сколько угодно времени на сентиментальность."
32190-62 = "Именно. Пора показать, насколько далеко мы продвинулись."
32190-63 = "Конечно. Я не собираюсь довольствоваться ничем меньше идеального результата."
32190-64 = "И я. Всё, чему меня научила Азуса, иначе будет потрачено впустую."
32190-65 = "Я наберу сто! Вот увидите!"
