[translation]
90000040-1 = "Эпизод 5;Исследование, Часть 4: Бина"
90000040-4 = ""
90000040-5 = "Готово. Я разработала алгоритм прогнозирования перемещений Бины."
90000040-6 = "Нормализовав координаты появлений, я выявила закономерности и определила область с наибольшей вероятностью встречи."
90000040-7 = "Отличная работа, Президент. Если мы пойдём в эту сторону, то сможем встретить Бину?"
90000040-8 = "Да, мой алгоритм даёт вероятность более 90%."
90000040-9 = "Но если она поймёт, что мы прогнозируем её движения, то она может изменить схему поведения, так что у нас всего один шанс."
90000040-10 = "Быстро встретимся с Биной и соберем данные."
90000040-11 = "Эйми и Сенсей, теперь ваша очередь."
90000040-12 = "Подтверждаю. Я готова."
90000040-13 = "[s] «За дело.»"
