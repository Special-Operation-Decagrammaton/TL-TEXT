[translation]
211120-1 = "Episódio 12;A Voz de Gehenna"
211120-2 = "Comitê de Restauração de Gehenna"
211120-3 = "Sendo assim――"
211120-4 = ""
211120-6 = ""
211120-7 = "Declaro aberta a vigésima oitava reunião ordinária para 'Tornar Gehenna Grande de Novo'!!"
211120-8 = "[s] \"Ebaaa!\""
211120-9 = "Caraca, já é a vigésima oitava? A gente até que trabalhou pra caramba, hein."
211120-10 = "Noventa por cento não passou de pura conversa fiada, devo ressaltar."
211120-11 = "Gostaria que se compadecessem de quem é incumbida de redigir atas desprovidas de conteúdo substantivo."
211120-12 = ""
211120-14 = ""
211120-15 = "Opa, peraí! Shoko-chan, esse já é o segundo pacote de biscoito que você abre?!#nEu não comi nem uma migalha ainda!"
211120-16 = "Exercendo minhas prerrogativas de secretária, confisco todo o estoque de doces."
211120-17 = "Ué, você não vivia dizendo que a secretária era só uma humilde coitada pisoteada pelos outros?!"
211120-18 = "Em matéria de doces, sou onipotente. Sou a tesoura que tritura até mesmo a rocha mais sólida."
211120-19 = "Quer que eu triture a sua cara na base do soco pra testar essa teoria?!"
211120-20 = ""
211120-23 = ""
211120-24 = "Atenção, atenção aqui, por favor!"
211120-26 = "Presente..."
211120-27 = "Ahaaaam..."
211120-28 = "Mastiga antes de falar com a boca cheia de farelo, criatura."
211120-30 = "A pauta primordial que trago hoje é――"
211120-31 = "'O Caminho Que Devemos Trilhar'!!"
211120-32 = "Pomposa e grandiloquente como de praxe."
211120-33 = "Exatamente! Eu acho que ficar só no pomposo virou o nosso maior problema!"
211120-34 = ""
211120-36 = ""
211120-37 = "O andamento das nossas atividades até agora tem sido um sucesso estrondoso."
211120-38 = "Mais alunas conhecem o comitê, e a adesão aos nossos projetos só cresce a cada dia."
211120-39 = "Todo mundo dando o sangue, que orgulho!"
211120-40 = "Isso é ótimo, claro."
211120-41 = "Mas fiquei pensando... será que ficar só nisso é o suficiente?"
211120-42 = "Lá vem mais uma epifania súbita..."
211120-43 = "A gente tem tentado transformar Gehenna pela raiz, não tem?"
211120-44 = "Mas o que realmente importa de verdade não seriam os pequenos detalhes do dia a dia?"
211120-45 = "Como assim, na prática?"
211120-46 = "Tipo assim, vejam bem..."
211120-47 = "Todo mundo tem seus perrengues, suas aflições e inseguranças, né?#nNós temos sentimentos à flor da pele! O Sensei também!"
211120-48 = "[s] \"Me chamou?\""
211120-49 = "E apesar disso, não existe em toda Gehenna um único lugar ou órgão que acolha o desabafo das alunas!"
211120-50 = "A Pandemônio não dá a mínima, e o Comitê de Disciplina só sabe policiar e reprimir!"
211120-51 = "...Então quem é que deve arregaçar as mangas e assumir essa bronca?!"
211120-52 = "ISSO MESMO!! [ruby=Nos]O Comitê de Restauração de Gehenna[/ruby]!!"
211120-54 = "Quer dizer então que..."
211120-55 = "A gente vai bancar os terapeutas e resolver os perrengues da galera?"
211120-56 = "Pretende incorporar as atribuições de uma ouvidoria e suporte psicossocial ao comitê, portanto."
211120-58 = "Exatamente! Uma jornada de mil passos começa no primeiro degrau――e a Grande Gehenna começa ouvindo os alunos!#n...O que acham?!"
211120-60 = "Não é uma abordagem desprovida de mérito. Grandes ordens estatais sustentam-se sobre o cumprimento de microrregramentos.#nDisciplinar unidades menores e controláveis constitui o bê-á-bá de uma administração eficiente."
211120-61 = "Eu topo na hora. Vale a pena tentar qualquer coisa nova."
211120-63 = "Pode ser que essa fosse uma tarefa típica do Sensei, mas desta vez queremos que você deixe em nossas mãos!#nVamos mostrar a nossa competência!"
211120-64 = "[s] \"Então pra que foi que eu vim aqui hoje...?\""
211120-65 = "Pra torcida organizada! Fica ali nos apoiando e emanando energia positiva!"
211120-67 = "O senhor funcionará como o nosso amuleto da sorte."
211120-68 = "Só de você existir ali do lado já tranquiliza o coração de todo mundo! Hahaha!"
211120-71 = ""
211120-72 = "Se eu tenho algum problema ultimamente?"
211120-74 = "Qualquer aflição, queixa contra o colégio, angústia existencial..."
211120-75 = "Ou aquele aperto no peito sem explicação... pode soltar o verbo! A gente tá prestando consultoria completa!"
211120-77 = "Olha... sinceramente? Não tenho nada não."
211120-78 = "COMO ASSIM?! Puxa pela memória, mulher! Alguma coisa tem que ter! Um estresse acumulado qualquer!"
211120-79 = "Bem... o meu maior estresse agora tá sendo essa sua pressão, sabia...?"
211120-80 = "Ah... entendi... Bom, que ótimo que você tá em paz então!"
211120-81 = "É... valeu. Tô vazando, beijo."
211120-82 = ""
211120-84 = ""
211120-85 = "A gente já abordou um mundaréu de alunas, mas ninguém tem problema nenhum na vida!"
211120-87 = "De certa forma, isso é a cara do desapego de Gehenna."
211120-88 = "A redução drástica dos índices de estresse discente decorrente dos nossos projetos também opera como fator causal."
211120-90 = "Quer dizer que o nosso próprio sucesso tá sabotando a nossa nova iniciativa?!!"
211120-92 = "Deixa de ser doida. Não ter problema é a melhor coisa que tem no mundo!"
211120-93 = "Ficar obcecada pelo dogma de 'resolver queixas a qualquer custo' aniquilou sua lucidez crítica.#nUm espetáculo deplorável de se assistir."
211120-95 = "Ai, acabou a minha glicose. Shoko, me dá um doce aí."
211120-96 = "É o derradeiro caramelo do pacote. Nego peremptoriamente."
211120-97 = "Eu te devolvo em dobro depois, prometo de dedinho!"
211120-98 = ""
211120-100 = ""
211120-101 = ""
211120-102 = "Pelo menos divide na metade, vai! Não precisa fazer esse drama todo!"
211120-103 = ""
211120-105 = ""
211120-108 = "Eu também desejo consumi-lo neste exato segundo!"
211120-109 = "...Espera um momento.#nSe eu exercitar a abstinência agora, colherei uma gratificação duplicada no futuro...?"
211120-110 = ""
211120-112 = ""
211120-113 = "Ah, sim. O célebre 'Experimento do Marshmallow'."
211120-114 = "...Muito bem. Concedo o doce à Presidente."
211120-115 = ""
211120-121 = ""
211120-122 = "Hummm..."
211120-123 = "Acho que vou dar calote nela."
211120-124 = ""
211120-126 = ""
211120-129 = ""
211120-130 = ""
211120-131 = "Com licença... O plantão de ouvidoria ainda tá atendendo?"
211120-132 = ""
211120-135 = ""
211120-136 = "Sim! Tamo a tendendo sim!"
211120-137 = "[s] \"Engole a comida antes de falar, Mayumi.\""
211120-138 = "A senhora honrará a promessa do retorno em dobro, confio eu?!"
211120-140 = "Gente, recomponham a postura, por favor..."
211120-141 = "Desculpa a bagunça. O que aconteceu de grave?"
211120-142 = "Ah, então..."
211120-143 = "Várias meninas da minha sala andam ouvindo vozes esquisitas depois da aula."
211120-144 = "Que tipo de voz?"
211120-145 = "É uma história de dar calafrios na espinha..."
211120-151 = ""
211120-152 = "'Ué?! A aula já acabou?! Caraca, ninguém teve a decência de me acordar... Mas pera.#nCadê todo mundo? Foi embora todo mundo já?!'"
211120-153 = "'Que droga... vou me mandar logo pra casa...'"
211120-154 = ""
211120-156 = ""
211120-159 = "'――tsu...'"
211120-160 = ""
211120-162 = ""
211120-164 = "......"
211120-165 = "'Será que foi coisa da minha cabeça...?'"
211120-166 = ""
211120-170 = "'――jo...'"
211120-171 = ""
211120-173 = ""
211120-174 = "'NÃO É COISA DA MINHA CABEÇA!!'"
211120-175 = "'Não tem mais ninguém nessa sala além de mim...!'"
211120-176 = ""
211120-180 = ""
211120-181 = "'SOCORROOO!!'"
211120-182 = ""
211120-184 = ""
211120-188 = ""
211120-190 = "...E foi basicamente isso o que aconteceu."
211120-192 = "Não me diga que... É UMA HISTÓRIA DE FANTASMA?!"
211120-193 = "Ah, certeza que foi só paranoia. Acontece direto quando a gente acorda assustada."
211120-195 = "Não é invenção! Uma porção de alunas já ouviu a mesmíssima voz em horários diferentes!"
211120-196 = "Poderia precisar as coordenadas espaciais exatas da ocorrência?"
211120-197 = "Claro que sim!"
211120-204 = "Local do Boato"
211120-205 = ""
211120-206 = "É esta sala aqui."
211120-207 = "À primeira vista, parece uma sala de aula perfeitamente comum..."
211120-208 = ""
211120-210 = ""
211120-212 = "......"
211120-213 = ""
211120-215 = ""
211120-218 = ""
211120-219 = "Que trambolho é esse aí?"
211120-220 = "Trata-se de um espectrômetro calibrado para aferição de ondas eletromagnéticas."
211120-221 = "Pra que serve essa parafernália?"
211120-222 = "Rastrear o epicentro de oscilações anômalas.#nSe o ruído decorrer de falhas no cabeamento ou estática de equipamentos, este visor o mapeará."
211120-223 = "Zero emoção, hein, Shoko? Fantasma é muito mais maneiro de investigar!"
211120-224 = "Entidades ectoplasmáticas não possuem utilidade em uma 'Gehenna Unida' e, ademais, inexistem faticamente."
211120-225 = ""
211120-228 = ""
211120-229 = "Ué? Mas eu já vi um fantasma de verdade, sabia?"
211120-230 = "...Farsa pueril."
211120-231 = "Tô falando seríssimo! Apareceu na minha frente com cara de alma penada!"
211120-232 = "A-Almas do além... não têm respaldo na física quântica.#nEu me limitarei a rastrear ondas eletromagnéticas, com licença."
211120-233 = "Olha só... você tá com medinho de assombração, é?!"
211120-234 = "Silêncio! Em vez de tagarelar bobagens, exijo que honre a devolução dobrada do meu doce."
211120-235 = ""
211120-237 = ""
211120-238 = ""
211120-239 = ""
211120-242 = ""
211120-243 = "...A intensidade do sinal acusou acréscimo nesta direção."
211120-245 = "Dizem que quando tem fantasma por perto, as luzes e aparelhos eletrônicos enlouquecem, né?"
211120-246 = "Pois é. Fica piscando, estalando e dando choque."
211120-247 = "Exatamente como tá acontecendo agora..."
211120-249 = "Humph, trote infantil. Julgam que vão me desestabilizar com uma cretinice dessas――"
211120-250 = ""
211120-254 = "BUUUUUUÚ!!!!!!"
211120-255 = ""
211120-257 = ""
211120-259 = "Hahaha! Levou um susto daqueles, né?! Travou até a respiração!"
211120-260 = ""
211120-262 = ""
211120-264 = ""
211120-265 = "EU JÁ NÃO FALEI MIL VEZES PARA PARAR COM ESSAS PALHAÇADAS INFANTIS?!!"
211120-267 = "Eita! Nunca vi a Shoko berrar com tanta fúria na vida!"
211120-268 = "Hihihi! Morre de medinho de fantasma! Que gracinha a nossa Shoko-chan!"
211120-269 = "EU NÃO ESTOU COM MEDO NENHUM!!#nFoi apenas uma reação biológica involuntária a um ruído estridente e repentino!!"
211120-270 = "Sei, sei... foi só um sustinho biológico involuntário!"
211120-271 = "Urrrgh..."
211120-272 = ""
211120-276 = "'――tou...'"
211120-277 = ""
211120-279 = ""
211120-281 = ""
211120-282 = "Vocês... ouviram isso agora?"
211120-283 = "[s] \"Sim... veio um som dali...\""
211120-284 = "Eu também ouvi clarinho..."
211120-285 = "Só tem a gente no corredor... S-Será que é alma penada mesmo...?!"
211120-286 = ""
211120-288 = ""
211120-290 = "......"
211120-291 = ""
211120-293 = ""
211120-294 = ""
211120-295 = ""
211120-298 = "A amplitude espectral disparou violentamente por aqui."
211120-300 = "Ué... A Shoko perdeu o medo do nada?"
211120-301 = "Até agorinha ela tava quase subindo pelas paredes."
211120-303 = "Shiu! Calem a boca."
211120-304 = ""
211120-307 = "A fonte da emanação massiva... repousa além desta alvenaria...?"
211120-308 = "E os fonemas sussurrados há instantes correspondiam, com precisão fática, a..."
211120-309 = ""
211120-311 = ""
211120-313 = ""
211120-314 = "Ei! Pra onde você tá indo?!"
211120-315 = "Parece que ela descobriu alguma coisa cabulosa!"
211120-319 = ""
211120-320 = "O epicentro da interferência eletromagnética é..."
211120-322 = "Aqui...?"
211120-323 = "É a Sala de Transmissão da escola."
211120-325 = "......"
211120-327 = "Parece completamente abandonada, né?"
211120-328 = "Faz sentido. A rádio da escola tá suspensa há semanas."
211120-330 = "Não resta a menor dúvida: a anomalia reside no interior desta sala."
211120-331 = "Contudo... a tranca da porta encontra-se devidamente lacrada."
211120-333 = "Então aquela voz esquisita tava vazando daqui de dentro?"
211120-334 = "Bora averiguar de perto agora mesmo!"
211120-335 = "E como a gente entra?"
211120-336 = "Ué, arrombando a porta na base da voadora――"
211120-338 = "NEM PENSE NISSO! Poderá danificar os consoles de transmissão sensíveis. Vandalismo é proibido."
211120-340 = "Ah, qual é..."
211120-342 = "Se estragarmos o equipamento antes de decifrar o mistério, o trabalho terá sido em vão."
211120-344 = "Além disso: você já se esqueceu de quem nós somos?"
211120-345 = "Nós não destruímos patrimônio público nem causamos transtornos aos outros.#nTemos que praticar o que pregamos na marra."
211120-346 = "Putz... pior que é verdade. Desculpa."
211120-347 = "Que mico passar essa vergonha na frente do Sensei..."
211120-348 = "[s] \"Muito bem, segurou o impulso com maturidade.\""
211120-349 = "Mas e agora? Como a gente entra sem a chave?"
211120-350 = "É o primeiro caso oficial da nossa ouvidoria! Não dá pra simplesmente dizer 'não conseguimos resolver'..."
211120-351 = "Ué, a gente avisa que a culpa era da sala de transmissão e pronto!"
211120-353 = "Dificilmente configurará o desfecho almejado pela solicitante, mas... ao menos desvendamos a pista crucial."
211120-354 = ""
211120-357 = "[ns1] \"Pensando bem...\"\n[ns2] \"Lembro de ter ouvido algo parecido recentemente...\""
211120-358 = ""
211120-359 = ""
211120-361 = ""
211120-363 = ""
211120-364 = "Sério?! Onde você ouviu isso, Sensei?!"
211120-365 = "[s] \"Então... foi o seguinte...\""
211120-369 = "A Seguir;Árvore na Floresta"