[translation]
211120-1 = "Эпизод 12;В поисках решения"
211120-2 = "Лига наследия Геенны"
211120-3 = "Что ж..."
211120-4 = ""
211120-6 = ""
211120-7 = "ОБЪЯВЛЯЮ ОТКРЫТЫМ НАШЕ 28-Е СОБРАНИЕ «ВО ИМЯ ВОЗРОЖДЕНИЯ ВЕЛИЧИЯ ГЕЕННЫ»!"
211120-8 = "[s] «Ура!»"
211120-9 = "Уже двадцать восьмое? Мы и правда немало потрудились."
211120-10 = "По большей части мы просто болтали."
211120-11 = "Уж мне-то знать. Это я записываю протоколы наших бессодержательных заседаний."
211120-12 = ""
211120-14 = ""
211120-15 = "Эй, Шоуко! Ты уже вторую пачку сладостей открываешь? А мне ещё ничего не досталось!"
211120-16 = "Потому что всё это моё. Таково моё право как секретаря."
211120-17 = "Разве ты не говорила, что секретари — бесправные подручные, которыми все помыкают?"
211120-18 = "Когда дело касается добычи сладостей, секретари непобедимы. Считай нас ножницами, способными РАЗДРОБИТЬ камень."
211120-19 = "Хочешь проверить эту теорию на практике?"
211120-20 = ""
211120-23 = ""
211120-24 = "Тише, тише! Порядок!"
211120-26 = "Да! Порядок!"
211120-27 = "Поря... ням-ням..."
211120-28 = "Сначала прожуй, потом говори."
211120-30 = "Как председатель, я предлагаю посвятить сегодняшнюю повестку..."
211120-31 = "...пути, по которому нам предстоит идти!"
211120-32 = "Как всегда, мыслишь масштабно."
211120-33 = "Ага! Вот видите, наша беда в том, что собрания порой уходят не в ту сторону. Надо сосредоточиться!"
211120-34 = ""
211120-36 = ""
211120-37 = "На данный момент наши программы выполняются успешно."
211120-38 = "О Лиге наследия знают как никогда много людей. Множество студентов с удовольствием участвуют в наших проектах."
211120-39 = "Похоже, все хорошо справляются со своей работой."
211120-40 = "И я согласна! Всё это «хорошо»."
211120-41 = "Но тут меня осенила мысль. Разве «хорошо» достаточно? Разве мы не стремимся к «величию»?"
211120-42 = "Говоришь прямо как руководство какой-нибудь корпорации..."
211120-43 = "Всё, что мы делали, было частью великого плана коренного преобразования Геенны..."
211120-44 = "Но не упускаем ли мы из виду мелочи?"
211120-45 = "«Мелочи»?"
211120-46 = "Так вот... Выслушайте меня!"
211120-47 = "Многих наших товарищей мучают тревоги и сомнения! Они очень чувствительны, прямо как Сенсей!"
211120-48 = "[s] «Я?»"
211120-49 = "Ага! Но в Геенне нет ни учреждения, ни организации, куда могли бы обратиться эти несчастные студенты."
211120-50 = "Пандемониуму всё равно, а Префектура только следит за безопасностью."
211120-51 = "Так кто же возьмёт на себя эту задачу? Кто заполнит эту душевную пустоту?"
211120-52 = "Конечно же, мы!"
211120-54 = "Ну..."
211120-55 = "Ты предлагаешь нам решать проблемы студентов?"
211120-56 = "Тебя интересует психологическая поддержка ровесников."
211120-58 = "Именно! Пусть это кажется мелочью, но мы докажем, что великая Геенна заботится даже о пустяках! Что скажете?"
211120-60 = "В этом есть смысл. В конечном счёте порядок складывается из множества мелких правил. Для эффективного управления необходимо контролировать небольшие, обозримые элементы."
211120-61 = "Я за. Почему бы хоть раз не попробовать?"
211120-63 = "Это уже ваша специальность, Сенсей, так что можете отдохнуть. Мы покажем ВАМ, на что способны САМИ!"
211120-64 = "[s] «Тогда зачем вы вообще меня позвали...?»"
211120-65 = "Подбадривать нас! Присматривать за нами и поддерживать боевой дух!"
211120-67 = "По сути, вы наш счастливый талисман."
211120-68 = "Ага, вы помогаете одним своим присутствием и... хорошим настроением! Йаха!"
211120-71 = ""
211120-72 = "Мои «проблемы» за последнее время...?"
211120-74 = "Ага! Может, у тебя что-то случилось или тебя что-нибудь расстраивает..."
211120-75 = "Или просто тревожно и не по себе без всякой причины! С этим мы тоже поможем!"
211120-77 = "У меня вроде всё нормально."
211120-78 = "Нет! Подумай хорошенько, покопайся в себе! Ну должно же что-то быть! Неужели тебя вообще ничто не тревожит?"
211120-79 = "Эм... Ну вот этот разговор...?"
211120-80 = "А, понятно... Знаешь, я рада, что у тебя... всё в порядке."
211120-81 = "Д-да, я тоже. Пока."
211120-82 = ""
211120-84 = ""
211120-85 = "Мы опросили столько студентов, но, похоже, никого ничего не беспокоит!"
211120-87 = "Студенты Геенны не славятся откровенностью."
211120-88 = "Возможно, наши недавние программы успешно снизили тревожность среди студентов."
211120-90 = "Ц, так мы теперь страдаем от собственного успеха?"
211120-92 = "Что вы имеете в виду, председатель? Разве не хорошо, что все довольны?"
211120-93 = "Она настолько увлеклась своим походом против проблем студентов, что окончательно утратила здравый смысл. Какая жалость."
211120-95 = "Уф, мне срочно нужно сладкое. Шоуко, передай что-нибудь."
211120-96 = "Нет, это всё, что я принесла."
211120-97 = "Я потом возмещу тебе. В двойном размере!"
211120-98 = ""
211120-100 = ""
211120-101 = ""
211120-102 = "Чего ты тянешь? Хочешь, чтобы я ещё сильнее мучилась?"
211120-103 = ""
211120-105 = ""
211120-108 = "Но я хочу съесть это прямо сейчас!"
211120-109 = "И всё же страдания, которые я испытываю сейчас, могут обернуться вдвое большей радостью в будущем..."
211120-110 = ""
211120-112 = ""
211120-113 = "А, это прямо как в «зефирном эксперименте»."
211120-114 = "Именно... Понимаю. Можете взять, председатель."
211120-115 = ""
211120-121 = ""
211120-122 = "Хм..."
211120-123 = "Я сказала, что МОГУ возместить... А могу и не возместить."
211120-124 = ""
211120-126 = ""
211120-129 = ""
211120-130 = ""
211120-131 = "Эм, вы ещё проводите консультации? Или я уже опоздала?"
211120-132 = ""
211120-135 = ""
211120-136 = "М-мф! Мы фсё ешшо аткрыты!"
211120-137 = "[s] «Сначала прожуй, потом говори!»"
211120-138 = "Но вы обещали вернуть мне вдвое больше!"
211120-140 = "Не обращай на них внимания."
211120-141 = "Мы ЕЩЁ работаем. Что-то случилось?"
211120-142 = "О, замечательно."
211120-143 = "Эм... Некоторые ребята из нашего класса говорят, что слышали странный звук."
211120-144 = "А? Какой ещё?"
211120-145 = "История немного жутковатая..."
211120-151 = ""
211120-152 = "Уроки закончились? Все ушли без меня? Даже не подумали разбудить?"
211120-153 = "Ух. Ладно, соберу вещи..."
211120-154 = ""
211120-156 = ""
211120-159 = "...по."
211120-160 = ""
211120-162 = ""
211120-164 = "..."
211120-165 = "А? Здесь кто-то есть?"
211120-166 = ""
211120-170 = "...рядок."
211120-171 = ""
211120-173 = ""
211120-174 = "Ч-что?! Кто здесь?!"
211120-175 = "Но ведь я совсем одна...!"
211120-176 = ""
211120-180 = ""
211120-181 = "А-а-а! Да что за чертовщина?!"
211120-182 = ""
211120-184 = ""
211120-188 = ""
211120-190 = "...Вот что случилось."
211120-192 = "О, проблема с призраком? Давайте разберёмся!"
211120-193 = "Да ладно, наверняка ей что-то послышалось. Может, сонный паралич..."
211120-195 = "Нет, дело не в этом! Слышала эти звуки не я одна!"
211120-196 = "Вот как? А где это произошло?"
211120-197 = "А, это было..."
211120-204 = "Место, о котором ходят слухи"
211120-205 = ""
211120-206 = "Значит, вот тот самый класс..."
211120-207 = "На первый взгляд всё как обычно..."
211120-208 = ""
211120-210 = ""
211120-212 = "..."
211120-213 = ""
211120-215 = ""
211120-218 = ""
211120-219 = "Что это у тебя, Шоуко?"
211120-220 = "Измеритель электромагнитного поля. Он измеряет электромагнитное излучение вокруг нас."
211120-221 = "А? Зачем он тебе?"
211120-222 = "Если здесь неоднократно слышали странные звуки, скорее всего, их издаёт неисправное оборудование."
211120-223 = "Фу, скукота. Я-то думала, мы призраков ищем."
211120-224 = "В нашей единой Геенне призракам не место. К тому же их не существует."
211120-225 = ""
211120-228 = ""
211120-229 = "А? Тогда как же я однажды видела призрака?"
211120-230 = "...Врёшь."
211120-231 = "Серьёзно! Я правда видела! Шоуко, ты что, вообще ни разу не встречала призраков?"
211120-232 = "Н-не может быть... Их не существует. Лучше не мешай мне работать."
211120-233 = "Ахаха! Шоуко, ты что, боишься привидений и всякой нечисти?"
211120-234 = "За...молчи. И верни долг за сладости. В двойном размере!"
211120-235 = ""
211120-237 = ""
211120-238 = ""
211120-239 = ""
211120-242 = ""
211120-243 = "...Здесь сигнал сильнее."
211120-245 = "Председатель, знаете, что говорят? Когда рядом призрак, вся электроника выходит из строя!"
211120-246 = "А, ты о том, как мигает свет и вдруг начинают трещать динамики?"
211120-247 = "Ага. Вот как сейчас..."
211120-249 = "Хмф, хватит детских розыгрышей. Не может такого быть..."
211120-250 = ""
211120-254 = "БУ-У-У!!!"
211120-255 = ""
211120-257 = ""
211120-259 = "Йахаха! Попалась, Шоуко?! Ты аж оцепенела от страха!"
211120-260 = ""
211120-262 = ""
211120-264 = ""
211120-265 = "Серьёзно?! Повзрослей уже!"
211120-267 = "Ничего себе. Шоуко и правда разозлилась..."
211120-268 = "Йаха! По-моему, это мило. Шоуко боится призраков!"
211120-269 = "Я НЕ боюсь, ясно?! Ты просто НАПУГАЛА меня своим криком!"
211120-270 = "Ну да, ну да! Конечно!"
211120-271 = "Угх..."
211120-272 = ""
211120-276 = "...лик."
211120-277 = ""
211120-279 = ""
211120-281 = ""
211120-282 = "Все слышали? Только что..."
211120-283 = "[s] «Я что-то слышал...»"
211120-284 = "Я тоже..."
211120-285 = "Но здесь ведь только мы... Если никто из нас не говорил... Неужели это и правда призрак?"
211120-286 = ""
211120-288 = ""
211120-290 = "..."
211120-291 = ""
211120-293 = ""
211120-294 = ""
211120-295 = ""
211120-298 = "Здесь прибор показывает ещё более сильное электромагнитное излучение..."
211120-300 = "Шоуко... совсем не боится?"
211120-301 = "Ага. Не то что раньше."
211120-303 = "Тс-с. Тише."
211120-304 = ""
211120-307 = "По ту сторону стены очень сильный сигнал..."
211120-308 = "...И то слово, которое я услышала... Это точно было..."
211120-309 = ""
211120-311 = ""
211120-313 = ""
211120-314 = "Эй! Ты куда?"
211120-315 = "Кажется, Шоуко что-то поняла!"
211120-319 = ""
211120-320 = "Этот шум... Разгадка уже близко..."
211120-322 = "Это..."
211120-323 = "...Радиорубка."
211120-325 = "..."
211120-327 = "Разве радиорубка не закрыта уже какое-то время?"
211120-328 = "Ага. И объявления по школьному радио тоже перестали делать."
211120-330 = "Я уверена, внутри что-то есть..."
211120-331 = "Но нам туда не попасть."
211120-333 = "Так ведь именно отсюда доносился тот странный звук, да?"
211120-334 = "Значит, мы не можем сейчас сдаться!"
211120-335 = "Как...?"
211120-336 = "Очень просто. Берём колонну и тараним..."
211120-338 = "Категорически нет. Силовые методы могут повредить оборудование радиорубки, поэтому мы от них воздержимся."
211120-340 = "...Ладно."
211120-342 = "...Мы не можем рисковать с таким трудом найденной уликой. Мало ли что."
211120-344 = "Карен, ты что, забыла, чем занимается наш клуб?"
211120-345 = "Студенты не должны бездумно ломать вещи и нарушать порядок. А мы тем более обязаны подавать пример."
211120-346 = "Уф, ты права... Ой. Я... совсем голову потеряла."
211120-347 = "Простите, что вам пришлось это увидеть, Сенсей... Йахаха..."
211120-348 = "[s] «Всё в порядке. Молодец»."
211120-349 = "Ну, раз внутрь не попасть, что нам делать?"
211120-350 = "Просто скажем тому студенту, что мы не смогли разобраться? И это на первом же задании по оказанию помощи?!"
211120-351 = "Давайте скажем, что это были какие-то технические неполадки в радиорубке."
211120-353 = "Возможно, это не решит проблему, но хотя бы успокоит пострадавшего студента. Главное, что мы нашли зацепку."
