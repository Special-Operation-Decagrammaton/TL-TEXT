211120-58 = "Yes! A journey of a thousand miles begins with a single step—a great Gehenna begins with solving problems, right!#n...What do you think?"
211120-60 = "It's not a bad approach. A massive order is built upon trivial rules.#nManaging things from small, controllable units is the basis of efficient administration."
211120-61 = "I agree too. It's worth trying anything, right?"
