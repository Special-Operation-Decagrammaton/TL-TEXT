[translation]
1011403-1 = "Приключения официантки"
1011403-2 = "Сцена конкурса торгового района"
1011403-3 = "Спасибо всем, что присоединились к нам сегодня на «Конкурсе официантки месяца»!"
1011403-4 = "Мы хотим сделать «Конкурс официантки месяца» ещё престижнее, и для этого мы—"
1011403-6 = ""
1011403-7 = "Что мне делать, Сенсей?!"
1011403-8 = "[s] «Успокойся, Джури. Спокойно. Давай подышим.»"
1011403-9 = "Но... но! Я никогда раньше не стояла на сцене перед таким количеством людей..."
1011403-10 = "И я знаю, вы сказали, что я справлюсь, но я даже не знаю, что здесь вообще оценивают..."
1011403-11 = "Если нас попросят что-нибудь приготовить, боюсь, я не смогу...!"
1011403-12 = "Дорогие зрители! Как вы думаете, что самое важное в обслуживании посетителей кафе?"
1011403-13 = "Верно! Единственная основа, на которой держится любая задача официантки, — это..."
1011403-14 = "...грубая физическая сила!"
1011403-15 = "Что? Сила...?"
1011403-16 = "[ns1] «...А?»\n[ns2] «…Вот этого я точно не ожидал...»"
1011403-19 = "Работа в кафе бывает изнурительной. Она бывает тяжёлой."
1011403-20 = "Вода тяжелее, чем думает большинство людей, а официантке всё равно приходится переносить и таскать стеклянную посуду целыми партиями!"
1011403-21 = "А иногда официанткам приходится иметь дело с грубыми посетителями, которые появляются как случайные встречи в видеоигре!"
1011403-22 = "Но в последнем примере им ведь не стоит применять силу?!"
1011403-23 = "[s] «Это ОЧЕНЬ хорошее замечание.»"
1011403-24 = "Если учитывать всё, сила крайне важна для любой официантки в хорошо работающем кафе!"
1011403-25 = "Поэтому первым испытанием конкурса «Официантка месяца» станет... проверка обслуживания на силу!"
1011403-26 = "Мы подготовили огромные стеклянные кружки, до краёв наполненные кофе!"
1011403-27 = "Официантки должны нести по шесть таких кружек в каждой руке — всего двенадцать..."
1011403-28 = "...а затем подать их на соответствующие столы!"
1011403-29 = "[ns] «Это вообще нормально?!»"
1011403-30 = "Н-нет же. Как вообще можно нести двенадцать таких кружек одновременно...?"
1011403-31 = "Даже ШЕСТЬ было бы невозможно, не то что двенадцать. Это испытание вообще бессмысленное!"
1011403-32 = "Я думала, этот конкурс должен быть престижным..."
1011403-33 = ""
1011403-35 = ""
1011403-36 = "..."
1011403-37 = "Сенсей, думаю, я справлюсь."
1011403-38 = "[s] «Что? Правда?»"
1011403-39 = "Да. Я вижу, что они тяжёлые, но..."
1011403-40 = "...всё равно они легче мешков картошки, которые я таскаю в Клубе школьного питания!"
1011403-41 = "Я пошла, Сенсей! Скоро вернусь!"
1011403-43 = "Похоже, участницам трудно даже поднять кружки! Неужели среди них нет никого достаточно сильного, чтобы завоевать титул Официантки месяца?!"
1011403-44 = "Но посмотрите сюда! Участница Ушимаки Джури! Она поднимает кружки так, словно они пустые!"
1011403-45 = ""
1011403-47 = ""
1011403-48 = "Значит, мне просто нужно отнести их на тот стол..."
1011403-49 = ""
1011403-51 = ""
1011403-52 = ""
1011403-53 = ""
1011403-54 = ""
1011403-55 = "И... готово! Теперь надо правильно расставить."
1011403-56 = ""
1011403-58 = ""
1011403-59 = ""
1011403-60 = ""
1011403-61 = "Эту сюда, а ту туда..."
1011403-62 = "Впечатляющее выступление участницы Джури! Она не просто подаёт кружки, но ещё и думает, как расставить их так, чтобы посетителю было приятно смотреть!"
1011403-63 = "Блестящий пример того тонкого, но необходимого сервиса, без которого не бывает отличного кафе!"
1011403-65 = "Перейдём к следующему испытанию?"
1011403-66 = "Любой опытный сотрудник кафе знает о страшном «часе пик»."
1011403-67 = "Заказы идут один за другим и не прекращаются, каждый посетитель держит персонал в напряжении, а чеки каждую секунду накапливаются десятками..."
1011403-68 = "Поэтому в такие моменты важнее всего быстро и точно принимать решения."
1011403-69 = "Мы проверим эти способности в игре «Подними флаг»!"
1011403-70 = "[ns3] «Они эти испытания случайно выбирают?»\n[ns4] «Как это вообще связано?»"
1011403-73 = "«Подними флаг»..."
1011403-74 = "Сенсей, думаю, и с этим я справлюсь."
1011403-75 = "Не хочу звучать СЛИШКОМ самоуверенно, но..."
1011403-76 = "...я каждый день распределяю самые разные товары по столовой Геенны. Я смогу!"
1011403-78 = ""
1011403-79 = "Подними синий флаг."
1011403-80 = "Синий!"
1011403-81 = "Не опускай белый флаг."
1011403-82 = "Белый!"
1011403-83 = "Не опускай синий флаг и подними белый."
1011403-84 = "Оба подняты!"
1011403-85 = "Подними синий флаг, но вообще-то не поднимай, белый не поднимай, синий оставь внизу, белый не опускай, синий подними, белый опусти, синий не опускай и белый не поднимай."
1011403-86 = "Эм... так! Синий вверх, белый вниз!"
1011403-87 = "Как она вообще с этим справляется?!"
1011403-88 = "К какому аду она привыкла в обычной жизни...?"
1011403-89 = "Дамы и господа, аплодисменты! Участница Ушимаки Джури набрала идеальный балл!"
1011403-90 = ""
1011403-94 = ""
1011403-95 = ""
1011403-97 = "Следующее испытание — уборка! Она нужна в любом кафе постоянно!"
1011403-98 = "А специально для этого испытания мы пригласили... особого робота-уборщика прямо из Миллениума!"
1011403-99 = "Робот-уборщик из Миллениума... Интересно, насколько хорошо он работает."
1011403-100 = "Даже немного жду этого..."
1011403-101 = "[ns] «(Миллениум... Ну, если это обычный робот-уборщик, всё должно быть нормально...)»"
1011403-102 = "Пожалуйста, всех участниц в подсобное помещение!"
1011403-104 = "Уборка. Уборка."
1011403-105 = "Подмести, пропылесосить, сжечь, уничтожить, удалить, очистить, продезинфицировать."
1011403-106 = "Этот модуль не оставит ни единого пятна или следа в назначенной зоне."
1011403-107 = "М-мне послышались какие-то страшные слова..."
1011403-108 = "Ладно, как бы то ни было, в столовой я каждый день убираю примерно такие объёмы."
1011403-109 = "Поехали!"
1011403-111 = ""
1011403-112 = "...Непостижимо. Непостижимо."
1011403-113 = "Производительность этого модуля ниже, чем у человеческого модуля."
1011403-114 = "Вывод: данный модуль недостаточен. Данный модуль дефектен. У данного модуля нет причины существовать. Самоуничтожение через 10, 9, 8..."
1011403-115 = "Нет, не надо!"
1011403-116 = "...У этого модуля всё ещё есть причина существовать, несмотря на подтверждённую несостоятельность? Люди называют это «состраданием»?"
1011403-117 = "Если ты самоуничтожишься здесь, в подсобке снова будет бардак!"
1011403-118 = "..."
1011403-119 = "Логика принята. Последовательность самоуничтожения остановлена. Оборудование переведено в режим ожидания."
1011403-121 = "Спасибо за ожидание, дамы и господа! Наконец настало время объявить Официантку месяца!"
1011403-122 = "Кто завоюет славу? Кто получит корону лучшей из лучших?!"
1011403-123 = "И победительница... Ушимаки Джури!"
1011403-124 = ""
1011403-128 = ""
1011403-129 = ""
1011403-130 = "[ns] «Поздравляю, Джури! Ты сделала это!»"
1011403-131 = "Я правда победила...! Не думала, что действительно... Это всё благодаря вам, Сенсей!"
1011403-132 = ""
1011403-134 = ""
1011403-135 = "Эм, Сенсей? Теперь, когда я победила... я тут подумала..."
1011403-136 = "Я думаю обо всех этих разных испытаниях и о том, как они связаны друг с другом..."
1011403-137 = "И кое в чём я всё ещё не уверена..."
1011403-139 = "Я утешал Джури, которая, похоже, всё ещё была чем-то озадачена."
1011403-140 = "О собственных мыслях насчёт того, насколько странным был весь конкурс, я решил не упоминать."
1011403-141 = "Тем не менее, я оставался рядом, пока она получала кубок и приз. После этого мы отправились обратно."
