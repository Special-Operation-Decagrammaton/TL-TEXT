[translation]
10013090-1 = "Эпизод 9;Конец лета"
10013090-5 = "Я иду! ☆"
10013090-6 = ""
10013090-8 = ""
10013090-9 = "Аргх! Ублюдки! Какие же они сильные!"
10013090-10 = "Хех! Можно я посплю?"
10013090-11 = "Мы почти у цели, все!"
10013090-12 = "Шизуко! Шизуко!! Господин пропал!"
10013090-13 = "А?"
10013090-14 = ""
10013090-18 = ""
10013090-19 = "Уgh! К-Как до этого дошло? Я вообще не планировал встретить здесь этих ублюдков из Абидоса!"
10013090-20 = "Почему... они тащились за мной аж сюда?! Абидос!! Только когда всё начало складываться!"
10013090-21 = "[s] «Ага. Сегодня явно не твой день.»"
10013090-22 = "...Но я кое-чему научился из прошлого!"
10013090-23 = "Потрясающее единство и сила студентов стали возможны благодаря вам, Сенсей!"
10013090-24 = "Значит, если избавиться от вас, я смогу перевернуть ситуацию!"
10013090-25 = "[s] «Поэтому ты меня похитил.»"
10013090-26 = "Ха! Делаете вид, будто всё под контролем. Забавно."
10013090-27 = "Именно! Я использую вас как заложника и щит против этих соплячек из Абидоса!"
10013090-28 = "Уже поздно жалеть, что вы в это вмешались!"
10013090-29 = "[s] «Ну, мне не впервой попадать в такие ситуации.»"
10013090-30 = "...?"
10013090-31 = "[s1] «Вспоминаются неприятные вещи.» \n[s2] «Хотя... пожалуй, момент подходящий.»"
10013090-34 = "Что ты несёшь?!"
10013090-35 = ""
10013090-39 = ""
10013090-42 = "Ч-что происходит?!"
10013090-43 = "Бандиты в шлемах сумели подавить соплячек из Абидоса?"
10013090-45 = ""
10013090-51 = "Б-Босс! Докладываю! Н-Неизвестные противники приближаются с окраины!"
10013090-52 = "Багровый... узор!"
10013090-53 = "Багровый...? Узор...? Что это за чушь?"
10013090-54 = ""
10013090-60 = ""
10013090-61 = "Хи-хи-хи."
10013090-62 = ""
10013090-64 = ""
10013090-65 = ""
10013090-66 = "Хи-хи-хи-хи."
10013090-67 = ""
10013090-69 = ""
10013090-70 = "Хи-хи-хи-хи-и-и!"
10013090-72 = "Вражеское подкрепление?!"
10013090-73 = ""
10013090-74 = "[ns] «Привет, Вакамо. Спасибо, что так быстро пришла.»"
10013090-75 = "Разумеется! Я прибежала сразу же, как получила ваше сообщение!"
10013090-76 = "Я обещала не повторять ошибку прошлого раза!"
10013090-77 = "Но в этот раз вы сами меня позвали! Хи-хи!"
10013090-78 = "Я прямо сейчас спасу вас от злодеев!"
10013090-79 = "Ч-Чёрт!"
10013090-80 = ""
10013090-82 = ""
10013090-83 = "Хи-хи. Бесполезно! Против меня это не сработает!"
10013090-84 = ""
10013090-86 = ""
10013090-87 = "Ничто не остановит мою любовь к Сенсею!"
10013090-88 = ""
10013090-96 = ""
10013090-97 = ""
10013090-98 = ""
10013090-99 = "Чёрт!"
10013090-100 = ""
10013090-102 = ""
10013090-103 = "[ns] «О, они убегают.»"
10013090-104 = ""
10013090-107 = "Уgh! Выбора нет. Отступаем! Запускайте вертолёт!"
10013090-108 = "П-Поняла!"
10013090-109 = ""
10013090-113 = "Уgh! Абидос! Сенсей из Шале! И соплячки из Момоёдо!"
10013090-114 = "Сегодня я, может, и проиграл, но войну не проиграю!"
10013090-120 = "Думаете, сможете от меня уйти?"
10013090-121 = "Вы пытались навредить моему любимому Сенсею. Позвольте объяснить вам, в чём вы ошиблись."
10013090-125 = "Эм..."
10013090-126 = ""
10013090-134 = ""
10013090-136 = "После небольшого переполоха с бывшим директором Кайзер..."
10013090-141 = "[ns] «Спасибо, Вакамо. И прости, что побеспокоил.»"
10013090-142 = "Н-Не извиняйтесь! Я просто рада, что смогла исправить ошибку прошлого раза."
10013090-143 = "Так... Эм..."
10013090-144 = ""
10013090-146 = ""
10013090-148 = ""
10013090-149 = "Я... помогла Сенсею?"
10013090-150 = "[s] «Да, ты спасла меня. Ты спасла мне жизнь.»"
10013090-151 = "Я... спасла вам жизнь?"
10013090-152 = "О-О боже! Я так боялась, что после прошлой ошибки вы меня никогда не простите! Но доброта Сенсея бесконечна!"
10013090-153 = "[s] «Да... Если хочешь, можем вернуться вместе и...»"
10013090-154 = "Я так счастлива, что не могу сдержаться!"
10013090-155 = "М-Мне н-нужно у-уйти!"
10013090-156 = ""
10013090-158 = ""
10013090-159 = "[ns] «О, хорошо... Пока.»"
10013090-160 = ""
10013090-164 = "После ухода Вакамо я вернулся на место, где ситуация уже в основном разрешилась."
10013090-165 = "О, господин!"
10013090-166 = "Изуна так волновалась, когда вы внезапно исчезли!"
10013090-167 = "Сенсей... Вы были в туалете?"
10013090-168 = "[s] «Нет. Просто нужно было кое с чем разобраться.»"
10013090-169 = "Сенсей?! А что с директором Кайзер? То есть продавцом? Я его побью!"
10013090-170 = "[s] «Его настигло правосудие.»"
10013090-171 = "А-А? Кто его осудил?!"
10013090-172 = "Что, чёрт возьми, это значит?"
10013090-173 = "[s] «Не переживайте. Как здесь дела?»"
10013090-174 = "Мы победили большую часть Бандитов в шлемах."
10013090-175 = "Но потом они убежали!"
10013090-176 = "[s] «Ушли?»"
10013090-178 = ""
10013090-181 = "Нас оттесняют, хотя у нас столько бойцов?!"
10013090-182 = "И это всё, на что способны новые новобранцы Бандитов в шлемах? Кто их вообще принял?!"
10013090-183 = "О, вообще-то это я их выбрала."
10013090-184 = "Странно! Обычно у меня глаз на такие вещи."
10013090-185 = "В конце концов, я Комаказэ Рабу, офицер Бандитов в шлемах!"
10013090-186 = "Мы знаем, кто ты! Куда важнее, нас сейчас уничтожат! Капитан Рабу?!"
10013090-187 = "Уgh! На этом этапе... Все, отступаем!"
10013090-188 = "Я ещё встречусь с вами, ублюдки! Если смотреть на картину шире, это маленькое поражение означает..."
10013090-189 = "Это просто означает поражение!"
10013090-190 = "Угх?!"
10013090-191 = ""
10013090-193 = ""
10013090-196 = "[ns] «Ну, я не расстроен, что они ушли.»"
10013090-197 = "Сенсей!"
10013090-198 = "[s] «Шизуко! Никто не ранен?»"
10013090-199 = "Мы в порядке! Жертв нет, и благодаря помощи Абидоса мы смогли решить проблему..."
10013090-200 = "Но куда важнее!"
10013090-201 = ""
10013090-203 = ""
10013090-204 = "Наконец-то Момоёдо... нет, мы все победили!"
10013090-205 = "[s] «Да, отличная работа. Вы добились этого, действуя вместе.»"
10013090-206 = "Потрясающе, Шизуко!"
10013090-207 = "Теперь мы сможем управлять всем курортом «Потерянный рай»! Как одним огромным фестивалем!"
10013090-208 = "Ага! Путь был неровный, но теперь мы можем вести настоящий бизнес Момоёдо!"
10013090-209 = ""
10013090-214 = "А?"
10013090-215 = "Кажется, я услышала откуда-то громкий шум."
10013090-216 = ""
10013090-222 = "Мы прибыли на место! М-м-м, запах лета!"
10013090-223 = "Момока, мы здесь по делу. Пожалуйста, веди себя как член Генерального студенческого совета."
10013090-224 = "Да-да. Поняла. Не веселиться."
10013090-225 = "[s] «Рин и Момока? Что вы здесь делаете?»"
10013090-226 = "Сенсей? Что вы здесь делаете?"
10013090-227 = "Похоже, где конфликт — там и Шале."
10013090-228 = "П-Погодите! Что здесь делает Генеральный студенческий совет? Что значит «конфликт»?"
10013090-230 = "Хех! Вот теперь будет весело."
10013090-231 = "Мы подтвердили продолжающийся конфликт, связанный с правами собственности на курорт «Потерянный рай»."
10013090-232 = "Об этом весь интернет гудел. Все спорили, кто победил, а кто проиграл."
10013090-233 = "Однако права на эту землю принадлежат Генеральному студенческому совету."
10013090-234 = "Мы узнали о драках здесь, вызванных поддельными правами на землю, и приехали разобраться лично."
10013090-235 = "Другими словами, это место принадлежит нам, и мы пришли его забрать."
10013090-236 = "[s] «О, значит... это означает...»"
10013090-238 = "...Что?"
10013090-239 = "Я понимаю, что всё внезапно и есть определённая процедура, поэтому мы не просим вас уйти прямо сейчас."
10013090-240 = ""
10013090-242 = ""
10013090-243 = "Мы можем дать вам три дня на освобождение территории..."
10013090-245 = "Эм... Эм-м..."
10013090-246 = "Значит, вся наша работа... всё, что мы сделали..."
10013090-247 = "Всё было зря?"
10013090-248 = "[s] «Похоже, права, которые продал Банк „Осьминог“, были поддельными.»"
10013090-250 = "Хех! Очень в стиле корпорации Кайзер."
10013090-251 = "Не пытайся просто отмахнуться своим «хех», Хошино!"
10013090-252 = "Но мы так много работали... Я правда проявляла инициативу..."
10013090-254 = "Мне очень жаль это слышать, но я не могу обходить установленный порядок и правила."
10013090-255 = ""
10013090-257 = ""
10013090-258 = "[ns] «Шизуко.»"
10013090-259 = "Шизуко..."
10013090-260 = "Shizuko!"
10013090-262 = "Босс!"
10013090-263 = "Енотиха?"
10013090-264 = "Милашка?"
10013090-266 = "Хватит! Я не енот и не милашка... и больше не босс."
10013090-267 = "Со мной всё нормально! Ясно!"
10013090-268 = "[s] «Ты уверена?»"
10013090-269 = "Ага! Правда! Я вообще-то довольно легко приспосабливаюсь."
10013090-270 = "Но у меня есть одна просьба!"
10013090-271 = "Какая?"
10013090-272 = "Прежде чем мы уйдём..."
10013090-273 = "Момоёдо хотел бы устроить банкет!"
10013090-274 = "Мы столько всего пережили! Даже прогнали плохих парней. Мы заслужили хотя бы одну вечеринку... правда?"
10013090-275 = "Ага! Я за!"
10013090-276 = "Момока?!"
10013090-277 = "[s] «Пожалуйста, Рин.»"
10013090-278 = "Даже Сенсей..."
10013090-279 = ""
10013090-282 = ""
10013090-283 = ""
10013090-284 = ""
10013090-285 = ""
10013090-286 = ""
10013090-287 = ""
10013090-288 = ""
10013090-289 = "Хорошо. Думаю, можно..."
10013090-290 = ""
10013090-293 = ""
10013090-295 = "Ура! Нужно немедленно начать подготовку!"
10013090-297 = "Ага!"
10013090-310 = "Хорошо! Все, начинаем!"
10013090-311 = "Давайте устроим банкет в честь нашей победы!"
10013090-315 = "Угощайтесь! Еды более чем достаточно!"
10013090-318 = "Ого! То что надо! Очень вкусно!"
10013090-319 = "О, господин! Хотите попробовать тоже?!"
10013090-322 = "Хи-хи-хи. Все отлично проводят время."
10013090-329 = "...Шух-шух, ветер?"
10013090-330 = ""
10013090-334 = "Ах! Ну и лето выдалось!"
10013090-336 = "Но тренировка была отличная."
10013090-337 = "Ха-ха. Широко счастлива, пока может тренироваться."
10013090-339 = "Этот банкет действительно впечатляет, Шизуко. Ты профессионал в подготовке фестивалей."
10013090-340 = "Знаю! Обязательно приходи помогать, когда мы наконец снова проведём Фестиваль Оазиса!"
10013090-341 = "Было бы здорово!"
10013090-342 = "Да! Когда-нибудь, когда состоится Фестиваль Оазиса, мы будем очень рады."
10013090-344 = "Хи-хи, было бы весело снова поработать вместе. Правда, Широко?"
10013090-345 = "...Ага."
10013090-346 = ""
10013090-349 = ""
10013090-350 = "О, это вкусно."
10013090-351 = "Точно..."
10013090-353 = "Это... вкус Хяккияко."
10013090-354 = ""
10013090-358 = "[ns] «...Вот так всё и получилось.»"
10013090-360 = "О, да. Действительно, я ошибалась, а Шизуко была права!"
10013090-361 = "Бу-ха-ха! Мне, как президенту Клуба Инь-Ян, стыдно."
10013090-362 = "[s] «Но средства, которые Шизуко вложила в Банк „Осьминог“, могут быть потеряны.»"
10013090-363 = "О, об этом не волнуйся."
10013090-364 = "Я заморозила все активы, связанные с этими средствами."
10013090-365 = "Хи-хи. Я тут не просто сидела сложа руки! Корпорация Кайзер не идеальна. Обойти их оказалось легко."
10013090-366 = "Может потребоваться время, но мы вернём всё до последней монеты."
10013090-367 = "[s] «Ты с самого начала отправила меня сюда помогать Шизуко?»"
10013090-369 = "...Ха-ха-ха. Не понимаю, о чём вы."
10013090-371 = "[ns] «Ты знала, что Шизуко попытается решить всё без твоей помощи.»"
10013090-372 = ""
10013090-375 = "[ns] «Если бы ты не позвала меня, ей пришлось бы справляться одной.»"
10013090-377 = "Вы обвиняете меня в том, что я специально помогала?"
10013090-378 = "Хи-хи. Понятия не имею, о чём вы!"
10013090-379 = "Я была глупой соперницей Шизуко, которая в неё не верила."
10013090-380 = "Я бы не стала строить предположения... Они создают нереалистичные ожидания."
10013090-381 = "Хотя думать можете что угодно."
10013090-382 = "[s] «Как пожелаешь, Ния.»"
10013090-383 = ""
10013090-385 = ""
10013090-387 = "[ns] «Но хотя бы один человек должен признать твой добрый поступок.»"
10013090-388 = "И напоследок..."
10013090-389 = ""
10013090-396 = "[ns] «Шизуко, вот ты где.»"
10013090-397 = "О, Сенсей..."
10013090-398 = ""
10013090-400 = ""
10013090-401 = ""
10013090-402 = ""
10013090-403 = "Я немного устала обслуживать банкет. Обычно у меня выносливости на такое побольше."
10013090-404 = "Хотя, наверное, слишком многое произошло."
10013090-405 = "[s] «Ты отлично справилась, Шизуко.»"
10013090-406 = "Аргх! Я вымоталась!"
10013090-407 = "Так что мне нужно больше утешения! И комплиментов! Ещё, пожалуйста, Сенсей."
10013090-408 = "[s] «Без тебя группа не зашла бы так далеко.»"
10013090-409 = "Я сама попросила, но теперь краснею."
10013090-410 = "Но я горжусь, что сама исправила свой бардак! Теперь всё хорошо!"
10013090-411 = "[s] «Разве это не немного горько-сладкое чувство?»"
10013090-412 = "А? Что ты имеешь в виду, Сенсей?"
10013090-413 = "[s] «Хм?»"
10013090-414 = "Я ни о чём не жалею!"
10013090-416 = "Когда вспоминаю свои трудности и ошибки..."
10013090-417 = "...становится очень больно..."
10013090-418 = "Я упрямилась перед Нией, потому что не хотела признавать, как мне было страшно."
10013090-420 = "Но все меня поддержали, и я поняла, что сделала правильный выбор."
10013090-421 = "А больше всех меня поддержали вы, Сенсей."
10013090-423 = "Благодаря вам я смогла по-настоящему почувствовать лето."
10013090-424 = "Может, оно и правда немного горько-сладкое."
10013090-425 = "Но сладкого в нём больше, чем горького... У меня осталось много отличных воспоминаний!"
10013090-427 = "Так что я ни о чём не жалею. По-моему, это успех."
10013090-428 = "[s] «Да? Это здорово.»"
10013090-429 = ""
10013090-432 = "[ns] «Я думаю так же.»"
10013090-433 = "Хи-хи-хи. Да!"
10013090-434 = "Охота на курорты заканчивается здесь! Важно то, что будет дальше!"
10013090-435 = ""
10013090-437 = ""
10013090-438 = ""
10013090-440 = "Пожалуйста, продолжайте присматривать за Отделом фестивалей Хяккияко."
10013090-441 = "И за мной, Кававой Шизуко, конечно!"
10013090-442 = "Сенсей!"
10013090-443 = "Командировка! План франшизы пляжной хижины Момоёдо"
