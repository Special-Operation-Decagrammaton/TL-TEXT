[translation]
1600703-1 = "Работа рождает приятный отдых"
1600703-2 = "Исполнительный офис Шале"
1600703-5 = "Доброе утро, Сенсей."
1600703-6 = "Я отложила отчёт, о котором мы говорили вчера в MomoTalk, так что никто ничего не заметит."
1600703-7 = "Если принесёте его к следующей неделе, я как-нибудь..."
1600703-9 = "[s1] «Вот отчёт.»\n[s2] «Я закончил его ещё вчера вечером.»"
1600703-10 = "Ого, вы закончили всё за один день?"
1600703-11 = "Ого, вы закончили всё за один день?"
1600703-12 = "Я ведь говорила, что это не срочно..."
1600703-13 = "Вы и правда взрослый. Такой ответственный."
1600703-14 = "[s3] «Изначально это была моя ошибка.»\n[s4] «Я почти забыл об этом. Спасибо, что напомнила, Томоэ.»"
1600703-15 = "Хи-хи, теперь и у меня стало меньше работы. Спасибо, Сенсей."
1600703-16 = "Хи-хи, теперь и у меня стало меньше работы. Спасибо, Сенсей."
1600703-17 = "Но, Сенсей, у вас тёмные круги под глазами, вы выглядите уставшим..."
1600703-18 = "Вы не спали всю ночь, чтобы закончить отчёт?"
1600703-19 = "[s] «Просто лёг немного позже обычного...»"
1600703-20 = "Вот почему я и говорила вам не переусердствовать."
1600703-21 = "Простите. Возможно, я слишком на вас надавила, Сенсей."
1600703-22 = "Для начала вздремните, чтобы компенсировать поздний отход ко сну."
1600703-23 = "[s] «Но спать во время рабочего дня как-то...»"
1600703-24 = "Нет, дневной сон — тоже часть работы."
1600703-25 = "Исследования показывают, что после короткого сна работать гораздо эффективнее, чем пытаться трудиться уставшим."
1600703-26 = "Даже президент Черино всегда спит после обеда, чтобы повысить продуктивность."
1600703-27 = "Можно я подготовлю вам кровать в жилом корпусе, чтобы вы могли хорошо и удобно поспать?"
1600703-28 = "[s] «...Это было бы замечательно.»"
1600703-29 = "Хорошо, дайте мне минутку."
1600703-30 = ""
1600703-32 = ""
1600703-45 = "Сенсей, всё для вашего дневного сна готово."
1600703-46 = "(Я следую за Томоэ в жилой корпус.)"
1600703-50 = "Жилой корпус Шале"
1600703-51 = "[ns] «Ч-Что это?!»"
1600703-53 = "Очевидно, это кровать, подготовленная специально для вас ради идеального сна."
1600703-54 = "Я подготовила первоклассные постельные принадлежности, чтобы не нагружать спину, хлопковую пижаму лёгкую как перышко, травяной чай для крепкого сна и успокаивающую классическую музыку."
1600703-55 = "Простите, если этого недостаточно. Будь мы в офисе Красной Зимы, я смогла бы подготовить для вас кровать получше."
1600703-56 = "Ну же, Сенсей. Пожалуйста, переоденьтесь в эту пижаму и ложитесь."
1600703-57 = "[s5] «Неужели для дневного сна нужно столько подготовки?»\n[s6] «Это уже слишком, я, кажется, вообще не смогу заснуть...»"
1600703-58 = "Странно. Президент Черино отказывается спать днём, если ей не обеспечить такой уровень комфорта."
1600703-59 = "Странно. Президент Черино отказывается спать днём, если ей не обеспечить такой уровень комфорта."
1600703-60 = "Возможно, передумаете, когда ляжете."
1600703-61 = "Драгоценное время для сна уходит прямо сейчас, поэтому прошу."
1600703-63 = "Следуя указаниям Томоэ, я переоделся в пижаму, выпил чай и лёг в кровать."
1600703-65 = "Теперь я выключу свет, чтобы вам было удобно спать."
1600703-66 = ""
1600703-68 = "Баю-бай, Сенсей, на макушке дерева. ♪"
1600703-69 = "[s] «Ты мне колыбельную поёшь?!»"
1600703-70 = "Да. Президент Черино не может уснуть, если я не спою ей колыбельную."
1600703-71 = "Эта вам не нравится? Я могу спеть другую."
1600703-72 = "[s] «Нет... Всё нормально.»"
1600703-73 = "Хи-хи, тогда продолжу."
1600703-74 = "Баю-бай, Сенсей, на макушке дерева... ♪"
1600703-76 = "(Возможно, благодаря роскошной подготовке я быстро уснул, несмотря на её пристальный взгляд.)"
1600703-77 = "(С помощью Томоэ я вздремнул лучше, чем когда-либо в жизни.)"
