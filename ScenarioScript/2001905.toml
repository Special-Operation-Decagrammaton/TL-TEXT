[translation]
2001905-1 = "Случай 3. Кроличья учёба"
2001905-3 = "Я гулял по городу, спасаясь от горы работы в офисе."
2001905-4 = "И тут..."
2001905-5 = ""
2001905-7 = ""
2001905-8 = "Здравствуйте, Господин!"
2001905-9 = ""
2001905-12 = "[ns] «А-Аканэ?»"
2001905-13 = "Да! Единственная и неповторимая Аканэ вашего Господина!"
2001905-14 = "Я ждала здесь, чтобы случайно с вами встретиться."
2001905-15 = "[s] «Ждала меня... чтобы встретить случайно?»"
2001905-16 = "Да. Случайно."
2001905-17 = "«Это не то, что значит „случайно“»?"
2001905-18 = "Но ведь ощущается совсем как случайность."
2001905-19 = "Как я узнала, что вы придёте сюда?"
2001905-20 = "Ну, есть одно устройство..."
2001905-21 = "Ах. Я сказала «случайно»? Вообще-то это была судьба."
2001905-22 = "Безопасностью Шале ведь занимаются, верно?"
2001905-23 = "Попросить Веритас поделиться спутниковыми снимками..."
2001905-24 = ""
2001905-26 = ""
2001905-27 = "То есть да, никакого другого объяснения, кроме судьбы."
2001905-28 = ""
2001905-30 = ""
2001905-31 = ""
2001905-33 = "И правда чудо, что мы вот так встретились здесь."
2001905-34 = "Чем я могу сегодня помочь вам, Господин?"
2001905-35 = "[s] «И ты пришла сюда в костюме девушки-кролика?»"
2001905-36 = "А что с ним не так?"
2001905-37 = "Это одна из моих рабочих форм, и, как я сказала, я знала, что мы встретимся случайно... То есть, эм, по воле судьбы."
2001905-38 = ""
2001905-42 = "Все, кажется, на нас смотрели."
2001905-43 = ""
2001905-45 = ""
2001905-46 = ""
2001905-50 = "Я схватил Аканэ за руку и помчался в ближайшее кафе."
2001905-51 = ""
2001905-57 = "Ого..."
2001905-58 = "[s] «Ты, должно быть, шутишь...»"
2001905-59 = "Кафе с девушками-кроликами! Я и не знала, что такое существует!"
2001905-60 = "А, поняла. Тебе и правда очень нравятся девушки-кролики..."
2001905-61 = "Я неправильно поняла? Не нужно так скромничать."
2001905-62 = "Хи-хи... Смущение тебе идёт, Сенсей."
2001905-63 = "Но не переживай, я и так знала, какой ты милый."
2001905-64 = ""
2001905-67 = "Что будете заказывать, Господин, Госпожа?"
2001905-68 = "«А? Похоже, здесь я „Госпожа“.»"
2001905-69 = "Как интересно. Быть госпожой, у которой есть господин..."
2001905-70 = "Я знаю, что это только пока мы здесь, но не волнуйтесь, я не забуду, кто мой настоящий господин..."
2001905-71 = ""
2001905-73 = ""
2001905-74 = "Что случилось, Господин?"
2001905-75 = "Вы выглядите уставшим, поэтому я закажу за вас."
2001905-76 = "Для начала..."
2001905-81 = "Так вот оно какое — искусство быть девушкой-кроликом..."
2001905-85 = "Когда они стоят, осанка ровная как стрела, а тарелки они носят без единого скольжения или звона..."
2001905-86 = "К-Кхм."
2001905-90 = "Похоже, быть девушкой-кроликом — это не только носить костюм."
2001905-91 = "Движения, слова, обслуживание..."
2001905-92 = "Всё должно быть безупречно, прежде чем можно назвать себя настоящей девушкой-кроликом!"
2001905-96 = "Как говорится, тематические кафе — лучшие учителя."
2001905-97 = "Спасибо, Господин."
2001905-98 = "Всё это время... Я и не знала, что вы настолько любите девушек-кроликов."
2001905-99 = "Я вас не подведу, Господин. Я буду работать ещё усерднее, чтобы овладеть искусством девушки-кролика!"
2001905-100 = ""
2001905-102 = ""
2001905-103 = ""
2001905-105 = "Вы так много знаете, Господин!"
2001905-106 = "[s1] «Хахаха...»\n[s2] «Аканэ, серьёзно, ты всё неправильно поняла...»"
2001905-110 = "Аканэ до самого конца отказывалась верить, что всё это было лишь недоразумением..."
