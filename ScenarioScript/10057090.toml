10057090-19 = "What kind of mistake leads you pour every last drop into the heater?#nWhat was going on in your head for that to happen?"
10057090-20 = "C'mon... stop messing around already, Class Prez. You've got another fuel tank#nsomewhere, riiight?"
10057090-21 = "..."
10057090-26 = "HEY!! SAY SOMETHING!!"
