[translation]
10057090-1 = "Episode 9;For Each Other's Sake"
10057090-3 = "W-What are you talking about? Haha,ha..."
10057090-4 = "The stove... it ran out this morning, remember?"
10057090-5 = "..."
10057090-6 = "You are joking, right? You have to be. Are you messing with me?"
10057090-12 = "..."
10057090-13 = "Are you serious...?"
10057090-14 = "You used it all for the stove? I-Is that even possible...?"
10057090-15 = "..."
10057090-17 = "Erina, everyone makes mistakes."
10057090-19 = "You made a mistake and left not a single drop? What kind of math led to that?"
10057090-20 = "Come on... Stop messing with me, class rep. There are other fuel tanks, right...?"
10057090-21 = "..."
10057090-26 = "Hey!! Say something, damn it!!!"
10057090-27 = "Argue back and yell at me like you always do!!!"
10057090-34 = "...Sorry."
10057090-38 = "Huh?"
10057090-39 = "I-I am sorry. I am sorry that you had to end up stuck with miserable old me in this miserable deep mountain..."
10057090-40 = "Um, Erina..."
10057090-46 = "(Bam!)"
10057090-48 = "[ns1] \"Erina!!\"\n[ns2] \"Anna, are you okay?\""
10057090-51 = "Anna."
10057090-52 = "I knew something was wrong."
10057090-53 = "...Anna."
10057090-54 = "There is no way something I made would ever work out so well."
10057090-55 = "Anna."
10057090-56 = "I thought we would find a defect before we even started the engine..."
10057090-57 = "It is wrong for things to go this smoothly--"
10057090-62 = "Anna!!"
10057090-66 = "[ns] \"Rana, calm down...!\""
10057090-67 = "I am fine, Sensei. I am not angry."
10057090-68 = "I just want to snap Anna back to her senses."
10057090-72 = "Anna, I am not going to ask what happened."
10057090-73 = "But you need to pull yourself together now."
10057090-78 = "A blizzard is coming."
10057090-79 = "..."
10057090-80 = "E-Erina is going to catch a cold. It is only going to get colder outside..."
10057090-81 = "This is all because of me..."
10057090-82 = "What do I do...?"
10057090-89 = "Sensei."
10057090-90 = "I always rely on you, ask you questions... and act selfishly. I am sorry."
10057090-91 = "However, I cannot just leave things I do not understand as they are--"
10057090-92 = "May I ask you a question?"
10057090-93 = "[s3] \"Adults are supposed to answer their students' questions.\"\n[s4] \"I like students who ask a lot of questions.\""
10057090-96 = "...Then, I have a question."
10057090-100 = "Sensei, can the three of us at District 183 be considered friends?"
10057090-101 = "..."
10057090-102 = "There are only three of us, yet we argue every single day."
10057090-103 = "Being together makes me angry, sometimes it makes me resentful... and it even makes me cry."
10057090-104 = "These two are the first people I can truly call \"friends.\" #nThat is why I still do not understand what being \"friends\" really means."
10057090-105 = "We are sick of each other every day, and we never have a moment of peace... #nAre we really friends?"
10057090-106 = "Rana..."
10057090-111 = "[ns] \"There is no correct answer when it comes to human relationships, but--\""
10057090-113 = "[ns5] \"I think you are friends.\"\n[ns6] \"And extremely close ones at that.\""
10057090-116 = "What makes you say we are friends?"
10057090-117 = "[s7] \"You argue because you care about each other.\"\n[s8] \"You turn on the stove so she does not catch a cold.\"\n[s9] \"You traveled a long way to find me so I could help stop your fights.\""
10057090-121 = "[ns10] \"And you worry about what it means to be friends.\"\n[ns11] \"You could never do any of that if you were not friends.\""
10057090-124 = "Sensei..."
10057090-125 = "Sensei."
10057090-126 = "Thank you."
10057090-131 = "Anna. Sensei."
10057090-136 = "...Yeah."
10057090-138 = "[ns] \"Let us go welcome our friends back!\""
