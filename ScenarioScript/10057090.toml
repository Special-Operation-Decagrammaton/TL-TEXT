10057090-40 = "Erina, hold on..."
10057090-46 = "(SLAM!!)"
10057090-48 = "[ns1] \"Erina!!\"\n[ns2] \"Anna, are you alright?\""
10057090-51 = "Anna."
10057090-52 = "I kept telling myself that it was inevitable for something to go wrong."
10057090-53 = "...Anna."
10057090-54 = "How could something I made ever work this well?"
10057090-55 = "Anna."
