[translation]
10057090-1 = "Episode 9; Together to be Together"
10057090-3 = "Wh-what're you saying? Aha...ha..."
10057090-4 = "The heater... It ran out of gas this morning, y'know?"
10057090-5 = "..."
10057090-6 = "...You're kidding. This's all just a joke, right? A prank?"
10057090-12 = "..."
10057090-13 = "Seriously...?"
