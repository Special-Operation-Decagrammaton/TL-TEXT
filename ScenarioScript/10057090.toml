10057090-57 = "But if things were going to go this well, then it's pointless..."
10057090-62 = "ANNA!!"
10057090-66 = "[ns] \"Rana, calm down...!\""
10057090-67 = "It's all right, Sensei. I'm not angry."
10057090-68 = "That was only to get Anna back into her right mind."
10057090-72 = "Anna, I won't ask you what happened."
10057090-73 = "I, however, will ask that you pull yourself together."
10057090-78 = "The blizzard has come."
10057090-79 = "..."
10057090-80 = "E-Erina's going to catch a cold. Even though she knew it was even colder out there,#nshe still left..."
10057090-81 = "It's my fault that this happened..."
10057090-82 = "What do I do...?"
10057090-89 = "Sensei."
10057090-90 = "I already ask a lot from you, both in requests and in questions... so I apologize for being selfish here."
10057090-91 = "However, I cannot leave things as they are without understanding them..."
10057090-92 = "Therefore, may I ask you a question?"
10057090-93 = "[s3] \"It's an adult's duty to answer a student's question.\"\n[s4] \"I like students that ask many questions.\""
10057090-96 = "...Then, I'll ask."
10057090-100 = "Sensei. Can the three of us in 183 really be considered friends?"
10057090-101 = "..."
10057090-102 = "There are only the three of us here, yet we spend every single day fighting."
10057090-103 = "Being together makes us angry, and sometimes we hate each other... There are#neven times when tears start to fall."
10057090-104 = "For me, these two are the first people I've ever been able to call my friends. #nConsequently, I still do not yet understand what it means to be \"friends.\""
10057090-105 = "If we're always sick of each other such that there's never a moment of peace#nbetween us... Can you really say that we're friends?"
10057090-106 = "Rana..."
10057090-111 = "[ns] \"There's no one-right-answer when it comes to human relations.\""
10057090-113 = "[ns5] \"However, I think you're all friends.\"\n[ns6] \"Extremely good friends too, at that.\""
10057090-116 = "What makes you say that we're friends?"
10057090-117 = "[s7] \"You fight because you care about each other.\"\n[s8] \"You turn on the heater so the others don't get sick.\"\n[s9] \"You came all the way to me to stop each other from fighting.\""
10057090-121 = "[ns10] \"And, you're worried about your friendship.\"\n[ns11] \"That's something only friends would ever do.\""
10057090-124 = "Sensei..."
10057090-125 = "Sensei."
10057090-126 = "Thank you very much."
10057090-131 = "Anna. Sensei."
10057090-136 = "...Yeah."
10057090-138 = "[ns] \"Let's go pick up our friend!\""