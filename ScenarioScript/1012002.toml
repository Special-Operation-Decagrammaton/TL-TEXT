[translation]
1012002-1 = "Особый урок: палочка"
1012002-2 = "Я пришёл в десертное кафе и заметил Нацу, махавшую мне из дальнего угла."
1012002-3 = ""
1012002-5 = ""
1012002-6 = ""
1012002-7 = "Сенсей, вы рано."
1012002-8 = "Я рада. Значит, можем заказывать."
1012002-9 = "Кстати, шоколадно-банановый тарт мы будем делить на двоих."
1012002-10 = "То, как его готовят здесь, — симфония вкусов и торжество двойственности."
1012002-11 = "Мягкий банан и твёрдые шоколадные кусочки гармонично оттеняют друг друга..."
1012002-12 = "...а разные оттенки сладости сливаются во что-то новое."
1012002-13 = "Он... так подходит сегодняшнему дню. Я сегодня прямо банановая."
1012002-14 = "[s] «Чувствуешь себя... бананом?»"
1012002-15 = "О, вы не понимаете? Или вам просто нравится получать уроки?"
1012002-16 = "Понимаете, иногда эйфорическую сладость невозможно выразить обычными словами."
1012002-17 = "Обычные метафоры никогда не передадут это чувство. Это... «банан»."
1012002-18 = "В общем, всё это я к тому, что это лакомство должно неплохо помочь расслабиться."
1012002-19 = "Стресс напрягает разум, а сахар — лучший способ снять это напряжение."
1012002-20 = "...Следовательно, судьбой предначертано, чтобы мы встретились здесь ради десертов."
1012002-21 = "Хм? Была ли я в стрессе? Как любопытно."
1012002-22 = "Я никогда не считала себя особенно обеспокоенной..."
1012002-23 = "...К чему вы клоните, Сенсей?"
1012002-24 = "[s1] «Разве ты не занимаешься организацией группы?»\n[s2] «Все эти расписания наверняка выматывают!»"
1012002-27 = "Хм? Нет-нет, Сенсей."
1012002-28 = "Я бы не стала использовать слово «стресс»."
1012002-29 = "Мои друзья, мои товарищи по группе, вполне сговорчивы."
1012002-30 = "Настоящий стресс — это что-то вроде..."
1012002-31 = "Пропустить возможность попробовать лимитированное парфе из-за болезни и заложенного носа..."
1012002-32 = "ВОТ это было бы стрессом."
1012002-33 = "Но всё же..."
1012002-34 = "И всё же я дала понять, что именно «стресс» привёл нас сюда, к этому моменту."
1012002-35 = "Так что, возможно, было нечто, благодаря чему мы заслужили это лакомство, даже если не можем выразить это словами."
1012002-36 = "Не кажется ли вам, что наличие цели делает вкус ещё слаще?"
1012002-38 = "Вскоре официант принёс шоколадно-банановый тарт на безупречно белой тарелке."
1012002-39 = "Он был восхитительным."
