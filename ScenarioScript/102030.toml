[translation]
102030-1 = "Эпизод 3; Планирование операции 1"
102030-2 = "Первый Ложный Санктум"
102030-3 = "Пустынный Район Абидос"
102030-5 = "Говорит Окусора Аяне, ответственная за операцию у первого Ложного Санктума."
102030-6 = "Все на назначенных позициях? Первый отряд, ответьте."
102030-7 = ""
102030-9 = ""
102030-10 = "Да, Аяне. Мы готовы."
102030-11 = "Ага, ага! Мы в ожидании."
102030-13 = "Подтверждаю. Хошино?"
102030-15 = "Всё готово."
102030-16 = "Так это Ложный Санктум, Аяне?"
102030-17 = "Да. Чтобы уничтожить его... нужно заманить сюда Бину."
102030-19 = "Решатели проблем 68 выступит приманкой и заманит Бину сюда. Все знают план?"
102030-20 = "Д-Да! Мы разгоним этот сломанный поезд на полную и взорвём его! Я-Я поняла! М-Мы все умрём!"
102030-21 = "Ха-ха-ха! Харука, обожаю твой энтузиазм."
102030-22 = "Мы не умрём, Харука. Второй отряд заманит Бину и присоединится к первому, чтобы атаковать вместе."
102030-23 = "Миссия будет опасной, всё-таки мы на крыше поезда, так что присматривайте друг за другом, ладно?"
102030-24 = "Хи-хи. Похоже, Решалам 68 досталась самая опасная позиция. Мы же крутые преступницы, в конце концов."
102030-25 = "Хи-хи-хи. Будет как на американских горках. Вот это повеселимся!"
102030-26 = "Сразу предупреждаю: во время операции мы будем взрывать эти поезда как захотим."
102030-27 = "И не пытайтесь нам запретить, ясно?"
102030-28 = ""
102030-30 = ""
102030-31 = "Но проблемо! Это просто старый брошенный металлолом. И кроме того..."
102030-32 = ""
102030-33 = "Транспустынная железная дорога была тем проектом, который ускорил падение Абидоса..."
102030-34 = "Если мы сможем использовать её, чтобы спасти мир..."
102030-35 = "Для меня не было бы ничего приятнее. ♧"
102030-36 = "Нономи..."
102030-37 = "Я не знала, что Транспустынная железная дорога принадлежит Saint Нефтис."
102030-38 = "И вдобавок..."
102030-39 = ""
102030-41 = ""
102030-42 = "Ладно, ладно. Выдвигаемся!"
102030-44 = "Да! Шале Control Zero, ответьте! Команда первого Санктума в ожидании!"
102030-46 = "Подтверждаю. Маки, как у вас там?"
102030-49 = "Всё готово. Но прежде чем вы начнёте, одно предупреждение..."
102030-50 = "Ни в коем случае не попадите под лазер, который Бина выпускает изо рта."
102030-51 = "Это сверхвысокотемпературный лазер, способный испарять даже камень. Так что осторожнее!"
102030-52 = ""
102030-56 = "Хорошо. Команда второго Санктума, доложите обстановку."
102030-58 = "Второй Ложный Санктум"
102030-59 = "Район руин Миллениума"
102030-61 = "Да, говорит Изумимото Эйми, ответственная за второй Санктум."
102030-62 = "Мы будем атаковать Хеседа, находящегося внутри оружейного завода в руинах Миллениума..."
102030-63 = "Перед заводом размещён оборонительный отряд. Он будет сдерживать бесконечный поток сил Хеседа."
102030-64 = "Мы готовим десантный отряд: транспортный самолёт поднимет его на три километра, после чего бойцы в свободном падении войдут через вентиляционную шахту прямо в центр завода."
102030-65 = "Поняла. Десантный отряд сформирован? Кто будет на транспортном самолёте?"
102030-66 = "...Эм. Вот здесь и возникла проблема."
102030-67 = "А? В чём проблема?"
102030-69 = "Ты что, слов не понимаешь?! А?!"
102030-70 = "Кекеке."
102030-71 = "Ке-ке-ке."
102030-72 = "Эм... Я..."
102030-73 = "Это... мягко говоря, проблема."
102030-74 = "Double O из C&C и председатель Оперативной группы правосудия никак не могут прийти к согласию."
102030-75 = "..."
102030-76 = ""
102030-77 = "Председатель, уже пора... Нам нужно выдвигаться..."
102030-78 = "Заткнись! Мне плевать! Я злая! Она меня бесит, слышишь?!"
102030-79 = ""
102030-81 = ""
102030-82 = "*вздох* ...Случайно не можешь как-нибудь успокоить своего председателя?"
102030-83 = "Если бы могла — успокоила бы, но не могу. Когда Цуруги такая, её никто не переубедит."
102030-84 = "Но почему они вообще дерутся? Почему более сильная сторона просто не займёт передовую?"
102030-85 = "А-Асуна! Не говори такое вслух! Пожалуйста!!!"
102030-86 = "Уф. Поздно."
102030-87 = ""
102030-89 = ""
102030-90 = ""
102030-91 = ""
102030-92 = "...Эй, ты. Выйдем."
102030-93 = ""
102030-95 = ""
102030-96 = "...Ке-ке-ке."
102030-97 = ""
102030-99 = ""
102030-100 = "О-о-о, они подерутся! Хи-хи. Давайте смотреть! Будет весело."
102030-101 = ""
102030-103 = ""
102030-104 = "*вздох* Ну вот, началось..."
102030-105 = "Полагаю, нам стоит пойти и проследить."
102030-106 = ""
102030-108 = ""
102030-110 = "Эм..."
102030-111 = "Всё равно я ничего не смогу сделать, чтобы их остановить."
102030-112 = ""
102030-114 = ""
102030-115 = ""
102030-117 = ""
102030-118 = "Эйми? Что происходит?"
102030-119 = "...Обе председательницы дерутся, выясняя, кто сильнее."
102030-120 = "..."
102030-121 = ""
102030-129 = "Ого, председатель Оперативной группы правосудия впечатляет!"
102030-130 = "Она держится против Нэру в ближнем бою... Никогда такого не видела."
102030-131 = "Это Цуруги из Оперативной группы правосудия. Не зря её называют секретным оружием Тринити."
102030-133 = "Ого, впечатляет. Давненько я не видела кого-то, кого Цуруги совсем не пугает."
102030-134 = ""
102030-136 = ""
102030-137 = ""
102030-139 = ""
102030-140 = ""
102030-141 = "Ке-ке-ке..."
102030-142 = "Кья-я-я-я!"
102030-143 = ""
102030-147 = "Ха-ха-ха! Неплохо! А теперь попробуй вот это!"
102030-148 = ""
102030-153 = ""
102030-154 = ""
102030-160 = "Ха-ха-ха! Похоже, председателю очень весело."
102030-161 = "Понятно. В последнее время столько всего произошло... Наверное, она и правда сильно нервничала."
102030-162 = "Хм. Цуруги и сегодня в отличной форме."
102030-163 = ""
102030-164 = "Ха-ха-ха! Неплохо! Но надеюсь, это не всё, на что ты способна! Ты получила больше урона, чем я!"
102030-165 = ""
102030-166 = "Ке-ке-ке... Какая разница...?"
102030-167 = "...Я уже исцелилась."
102030-168 = "...Ха-ха-ха! Мне нравится твой настрой!"
102030-169 = "Кья-я-я-я-я-я!"
102030-170 = "Простите! Вы вообще что здесь делаете?!"
102030-171 = ""
102030-172 = ""
102030-173 = "А...! Юука..."
102030-174 = "Вы должны были разделить команды, как мы обсуждали! А вместо этого решили устроить драку? Я поражена вашей незрелостью!"
102030-175 = "Простите, все. Но я решила, что остановить эту драку сможет только Юука..."
102030-176 = "..."
102030-177 = "Ух... А ведь только стало интересно..."
102030-179 = "А? Но нам ведь нужно решить, кто сильнее, чтобы разделить команды!"
102030-180 = "Ты сейчас серьёзно?!"
102030-181 = "Так, вы двое!"
102030-182 = "А?"
102030-183 = "?"
102030-184 = "Камень, ножницы, бумага!"
102030-185 = ""
102030-187 = ""
102030-188 = "Что?! Нельзя же решать такое вот так!"
102030-189 = "Заткнулись! У нас нет на это времени! Вы хотите, чтобы из-за ваших выходок весь план пошёл наперекосяк?"
102030-190 = "Хмф... Ладно."
102030-191 = ""
102030-193 = ""
102030-194 = ""
102030-196 = "Ладно... Камень..."
102030-197 = "...Бумага."
102030-198 = "...Ножницы!"
102030-199 = ""
102030-200 = "..."
102030-201 = "Решено."
102030-203 = "Момои! Мидори! Юзу! У нас срочный квест — нужно зачистить подземелье!"
102030-204 = "З-Знаю. Нужно сохранять спокойствие, Алиса! Это важный квест."
102030-205 = "В-Всё точно будет в порядке?"
102030-206 = "К-Конечно... Сенсей сказал, что собрал всех сильнейших людей Кивотоса."
102030-207 = "Да! Я слышала, что в нашей группе будут очень могущественные союзники, так что всё будет хорошо!"
102030-208 = "Ага... Очень могущественные союзники..."
102030-209 = "Некоторые из них вроде даже из спецназа, да?"
102030-210 = ""
102030-212 = ""
102030-215 = ""
102030-216 = "Это Слампия? Жутковатое место."
102030-217 = "Отряд RABBIT. Мы прибыли в район цели и присоединились к основному отряду."
102030-219 = "П-Они здесь! SRT...!"
102030-220 = "З-Здрасьте..."
102030-222 = "Здравствуйте. Надеемся на плодотворное сотрудничество сегодня."
102030-223 = "RABBIT 3, RABBIT 4, доложите свои позиции."
102030-224 = "RABBIT 3, воздушная поддержка в готовности. Жду приказа. Как там у тебя, Мию?"
102030-225 = "RABBIT 4. Эм, видимость плохая... Ветер тридцать пять узлов с юго-востока... Так что условия, м-мягко говоря, не самые приятные..."
102030-226 = "Н-Но... На моей точности это н-не скажется."
102030-227 = ""
102030-229 = ""
102030-231 = ""
102030-232 = "Речь идёт о ветре почти ураганной силы. Ты уверена?"
102030-234 = "В-Вот она! Ещё один мощный союзник! Сорасаки Хина, глава Префектурной команды Геенны!"
102030-235 = "П-Приятно познакомиться."
102030-237 = "Снайпер. Как далеко ты от цели?"
102030-238 = "А-А?! Я-я? З-Здесь? Эм... Примерно девятьсот пятьдесят метров..."
102030-239 = "Характеристики оружия?"
102030-240 = "Это снайперская винтовка RABBIT Type 39...! Использует патроны 7,62×53 мм R, внутренний магазин на пять патронов, а номер оружия..."
102030-242 = "Прошу прощения, но..."
102030-244 = "...Ой, извини. Я не хотела прозвучать грубо."
102030-245 = "Мне просто стало любопытно. Ты стреляешь с дистанции, вдвое превышающей эффективную дальность своей винтовки, да ещё и почти в невозможных условиях. Редко встретишь снайпера твоего уровня."
102030-246 = "Т-Ты правда так думаешь?"
102030-247 = "Ух ты...! С-Спасибо!"
102030-248 = "Мию невероятная. Однажды она успешно поразила цель с расстояния 1 980 метров."
102030-249 = "...Впечатляет. Снайпера определяет мастерство, а не оружие. Уверена, она станет ещё лучше."
102030-250 = "Похоже, слухи о том, что именно благодаря отряду RABBIT Сенсей смог вернуть Шале, не преувеличены."
102030-252 = "Д-Да ничего особенного..."
102030-253 = "А ещё..."
102030-254 = ""
102030-256 = ""
102030-257 = "Ты, должно быть, Тэндоу Алиса..."
102030-258 = "(Та самая, из того инцидента в Миллениум...)"
102030-259 = ""
102030-261 = ""
102030-263 = "Та-дам! Эксперт максимального уровня присоединился к группе!"
102030-264 = "..."
102030-265 = "А-А?! Алиса!"
102030-266 = "П-Простите! Алиса не очень умеет чувствовать атмосферу..."
102030-267 = "Сенсей рассказывал мне о главе Префектурной команды Геенны!"
102030-269 = "...Сенсей? Обо мне?"
102030-270 = "*шёпотом* Я слышала, глава Префектурной команды — очень страшная и безжалостно расправляется со всеми, кто ей перечит..."
102030-271 = "*шёпотом* С-Страшно... Она может накричать на меня, если я что-нибудь сделаю не так..."
102030-272 = "Вы все ошибаетесь! Сенсей говорит, что глава Префектурной команды очень добрая!"
102030-273 = "П-Правда...?"
102030-274 = "Сенсей так сказал?"
102030-275 = ""
102030-277 = ""
102030-278 = "...Е-Ещё что-нибудь?"
102030-279 = "И что она — один из людей, на кого Сенсей полагается больше всего! Что он полностью ей доверяет!"
102030-280 = "Так что для нас огромная честь, что глава Префектурной команды присоединилась к нашей группе! Я очень рада!"
102030-281 = "Эм..."
102030-282 = ""
102030-284 = ""
102030-285 = "...Неважно. Ничего."
102030-286 = "Третья команда святилища докладывает. Отряд RABBIT и Отдел разработки игр в полной готовности. Кто руководит операцией?"
102030-287 = "А. Руководитель операции..."
102030-288 = ""
102030-290 = ""
102030-292 = "Я-я Ханаока Юзу... Руководитель операции третьего святилища..."
102030-293 = "П-Почему я...?"
102030-294 = "Юзу, мы за тебя болеем!"
102030-295 = "Ага! Только ты справишься с этой операцией, Юзу!"
102030-297 = "Принято. Юзу, удачи."
102030-299 = "Х-Хорошо... Ух..."
102030-301 = "Следующий эпизод; Планирование операции 2"
