10018070-40 = "Вы, председатель Няо."
10018070-41 = ""
10018070-43 = ""
10018070-45 = "Ты всегда делаешь всё, что тебе говорят?!"
10018070-46 = "Я... Что? Ну, если мне за это платят, то да?"
