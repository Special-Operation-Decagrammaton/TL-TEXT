[translation]
1008215-1 = "Белая лента юности"
1008215-2 = "В назначенное время я пришёл в торговый квартал."
1008215-3 = ""
1008215-7 = ""
1008215-8 = "Идеальная синхронизация и безупречная пунктуальность."
1008215-9 = "...Как и ожидалось от Наставника!"
1008215-10 = "Ну что ж! Давай не спешить и хорошенько всё осмотрим."
1008215-12 = ""
1008215-13 = ""
1008215-14 = "О, вот это мило!"
1008215-15 = ""
1008215-17 = ""
1008215-18 = ""
1008215-19 = "Смотри, эта маска хёттоко..."
1008215-20 = "...на тебе она будет смотреться уморительно, Наставник!"
1008215-21 = ""
1008215-23 = ""
1008215-25 = ""
1008215-26 = "Ахаха! Ой, ну это прекрасно!"
1008215-27 = "А теперь давай повяжем тебе на голову этот фуросики!"
1008215-28 = ""
1008215-30 = ""
1008215-31 = "Ахахахаха...!"
1008215-32 = "Всё, теперь мы обязаны это купить. Простите, можете нас рассчитать?!"
1008215-33 = "Большое спасибо! Скидки для пар у нас нет, но примите, пожалуйста, эту многоразовую сумку в подарок!"
1008215-34 = "П-Пара?! Ой, нет, мы просто..."
1008215-35 = "[s1] «Учитель и студент...»\n[s2] «На тайном свидании.»"
1008215-38 = "В-Всё не так!"
1008215-39 = "И хватит отпускать странные шуточки в этой смешной маске!"
1008215-40 = "[s3] «Фу-фу-фу, а что насчёт тебя, Рэнгэ?»\n[s4] «Давай я тоже куплю тебе подарок, фу-фу-фу!»"
1008215-43 = "Ладно! Только прекрати этот жуткий смех!"
1008215-44 = "...Ах, какая живая реакция. Как весело!"
1008215-45 = "...Радости юности..."
1008215-46 = ""
1008215-48 = ""
1008215-49 = "[ns] «Если подумать...»"
1008215-51 = "[ns5] «Похоже, тебе нравится носить ленты.»\n[ns6] «Мне стало интересно, что за бант у тебя в волосах.»"
1008215-54 = "Моя лента...?"
1008215-55 = "А, это?"
1008215-56 = "[s] «За ней стоит какая-то история?»"
1008215-57 = "История... Мм... да. Но это не МОЯ история."
1008215-58 = "...Хотя, пожалуй, могу рассказать."
1008215-59 = "Есть один роман, который мне нравится. Он о юности и про очень энергичную девушку."
1008215-60 = "И главная героиня носит такую же белую ленту."
1008215-61 = "Она выглядит совершенно обычно, но это её отличительный знак. Лента придаёт ей сил."
1008215-62 = "Она символизирует жизненную энергию, беззаботное веселье и... ещё очень многое."
1008215-63 = "Мне показалось это очень красивой идеей... поэтому я тоже решила попробовать носить такую."
1008215-64 = "[s] «Тогда давай купим ещё одну точно такую же!»"
1008215-65 = "Ха-ха! Спасибо, что рассказала. Я точно знаю, чем она вдохновлена!"
1008215-66 = "У нас много лент с таким дизайном, так что выбирайте. Прошу!"
1008215-67 = "Вы всё это слышали?"
1008215-68 = ""
1008215-70 = ""
1008215-72 = "[ns] «Хорошо. Я решил!»"
1008215-75 = "Ты точно хочешь её купить?"
1008215-76 = "Угх, но получить это от тебя значит...!"
1008215-77 = "[s] «Тебе не нравится дизайн?»"
1008215-78 = "Н-Не в этом дело! М-Мне очень нравится, и я ужасно благодарна, но...!"
1008215-79 = "М-Ммм..."
1008215-80 = "Ей явно нравится, так что просто купи ей одну."
1008215-81 = "А-а-ам...!"
1008215-82 = "Л-Ладно. Я возьму её. Раз уж это... особенное..."
1008215-83 = "[s] «Такое же особенное, как та лента из твоего романа?»"
1008215-84 = "Я-я не знаю! Можем больше об этом не говорить?"
1008215-85 = ""
1008215-87 = ""
1008215-89 = ""
1008215-90 = "Д-Думаю, покупок уже достаточно, так что пора заканчивать с этими юношескими занятиями."
1008215-91 = ""
1008215-93 = ""
1008215-94 = "Спасибо за подарок! Увидимся! Эм... ПОКА!"
1008215-95 = ""
1008215-97 = ""
1008215-98 = "[ns] «Почему она так смутилась?»"
1008215-99 = "Случайно не читали роман, о котором она говорила?"
1008215-100 = ""
1008215-103 = "Хм, похоже, вы не знали."
1008215-104 = "Есть причина, по которой я держу такие ленты в продаже. Их ищет очень много молодых пар."
1008215-105 = "Дело в том, что эта белая лента символизирует..."
1008215-107 = "Я выслушал, как продавец рассказал всю историю..."
1008215-109 = "Угх, а я ведь просто взяла её!"
1008215-110 = "Я её приняла..."
1008215-111 = ""
1008215-113 = ""
1008215-114 = "Ленту, которую подарили главной героине..."
1008215-115 = ""
1008215-117 = ""
1008215-118 = "Ленту, ставшую первым подарком от её возлюбленного...!"
1008215-119 = "Ч-Что мне теперь делать? Я не собиралась, но почему Наставник..."
1008215-120 = "Он знал про роман? Вроде не похоже..."
1008215-121 = "Или притворялся? Это была шутка? Мы ведь смеялись..."
1008215-122 = "Только не говори..."
1008215-123 = ""
1008215-125 = ""
1008215-126 = ""
1008215-127 = "А-а-а-а! Не знаю! Почему именно я?!"
1008215-128 = ""
1008215-130 = ""
1008215-131 = "[ns] «Рэнгэ, можно войти?»"
1008215-132 = ""
1008215-133 = "Д-Да, конечно, но..."
1008215-134 = ""
1008215-137 = "[ns] «Вот ты где.»"
1008215-138 = "Наставник? Ч-Что случилось?"
1008215-139 = "[s] «Это насчёт ленты и того романа...»"
1008215-140 = "Наставник..."
1008215-141 = "Так ты всё понимал, когда это делал?!"
1008215-142 = "[s7] «Фу-фу-фу, не понимаю, о чём ты.»\n[s8] «Понятия не имею, фу-фу-фу.»"
1008215-145 = "Ты всё это время знал?"
1008215-146 = "[s] «...Я подумал, что воссоздать твою историю будет весёлым юношеским занятием.»"
1008215-147 = "...!"
1008215-148 = "В-В этом есть смысл...!"
1008215-149 = "Э-Эм! Н-Не то чтобы мне не нравилась лента, но...!"
1008215-150 = "Я-я бы хотела, чтобы ты завязал её на мне... но только если сам хочешь, Наставник."
1008215-151 = "И перестань меня дразнить, ладно?"
1008215-152 = ""
1008215-154 = ""
1008215-155 = ""
1008215-158 = "Я завязал ленту на Рэнгэ, и мы вместе наслаждались нашей юностью."
