[translation]
10055160-1 = "Для бешеного пса нет выходных"
10055160-2 = "Ух ты! Словно целый фестиваль!"
10055160-3 = "По сравнению с пустынным пляжем, где мы были раньше, это неожиданно."
10055160-4 = "Как здорово! Здесь и правда идёт турнир!"
10055160-5 = "А запах какой вкусный!"
10055160-6 = "А, тут ларьки с едой. Наконец-то что-то кроме морепродуктов."
10055160-7 = "Эй-эй-эй, красавицы, вы там!"
10055160-8 = ""
10055160-10 = ""
10055160-11 = ""
10055160-12 = ""
10055160-13 = "Подойдёте на секундочку?"
10055160-14 = "В-Валькирия здесь?! Чиаки, что ты натворила?!"
10055160-15 = "А?! Я ничего не делала!"
10055160-16 = ""
10055160-18 = ""
10055160-20 = ""
10055160-21 = "Конока, нельзя вот так выскакивать перед людьми, напугаешь их."
10055160-22 = "Виновата!"
10055160-23 = "И ЭТО всё твоё извинение? ...Кхм. Прошу прощения."
10055160-24 = "Мы из Бюро общественной безопасности «Валькирии»."
10055160-25 = ""
10055160-26 = "Для бешеного пса нет выходных"
10055160-29 = ""
10055160-31 = "Сейчас мы обеспечиваем порядок на этом острове."
10055160-32 = "Мы о вас слышали. Говорят, вы победили Комитет контрмер."
10055160-33 = "Да, но... откуда вы узнали?"
10055160-34 = "А-ха! На таком маленьком острове слухи быстро разносятся!"
10055160-35 = "Особенно если учесть, что Оперативную группу по борьбе с долгами считали одним из фаворитов..."
10055160-36 = "Да, тут всё серьёзно."
10055160-37 = "К тому же среди крабов и речных раков, похоже, есть своя иерархия."
10055160-38 = "А поддержание естественного порядка тоже часть нашей работы здесь!"
10055160-39 = "...Кихехе. Понятно."
10055160-40 = "Значит, вот какую отговорку вы придумали, чтобы встать у нас на пути."
10055160-41 = "Что ж, раз вы пришли бросить нам вызов, я принимаю!"
10055160-42 = "Хм. Хм-хм."
10055160-43 = "Что смешного?"
10055160-44 = "О, надо было уточнить. Оперативная группа по борьбе с долгами была ОДНИМ из фаворитов..."
10055160-45 = "...но в рейтинге она стояла намного ниже нас."
10055160-46 = "Здесь вызов бросаете именно вы."
10055160-47 = "Какая... Какая несусветная чушь!"
10055160-48 = "Вы всерьёз ждёте, что мы будем напрягаться ради парочки прислужников Генерального Студенческого Совета?"
10055160-49 = "Вы всего лишь жалкие неудачники."
10055160-50 = "Хватит, Ироха."
10055160-51 = "Чиаки! Секретарь Общества Пандемониум! Покажи им свою доблесть!"
10055160-52 = "А-а?! Я?!"
10055160-53 = "Ого!"
10055160-54 = "Вперёд, Чиаки. Буду изо всех сил за тебя болеть."
10055160-55 = "Ч-чего ты вдруг так обрадовалась?"
10055160-56 = "Я рада, что на этот раз могу наблюдать со стороны, пока кто-то другой лезет вперёд."
10055160-57 = "Ироха-а!! Ну ты и вредина!"
10055160-58 = "Ух... Ладно, раз уж дошло до этого, придётся делать что надо!"
10055160-59 = "Вперёд, Чёрная Долли! Мы справимся вместе!"
10055160-60 = "Хи-хи. Хорошо, бойца вы выбрали."
10055160-61 = "Крабы, на исходные позиции!"
10055160-62 = ""
10055160-64 = ""
10055160-65 = "Крабовый поединок!"
