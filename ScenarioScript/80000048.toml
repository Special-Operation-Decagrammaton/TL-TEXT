[translation]
80000048-1 = "Вкусы господина и ниндзя"
80000048-2 = "О, мой господин! Как вы узнали, что я о вас думаю?"
80000048-3 = "Вы появились именно тогда, когда я хотела вас увидеть. Н-Неужели это новая техника ниндзюцу?!"
80000048-4 = "[s1] «Да, мою способность ходить по улице.»\n[s2] «Я просто совершал обычный патруль для Шале.»"
80000048-5 = "О. Если это были не вы..."
80000048-6 = "О. Если это были не вы..."
80000048-7 = "Ух ты! Значит, моё желание увидеть вас пробудило одну из моих скрытых способностей!"
80000048-8 = "В последнее время я особенно усердно изучаю ниндзюцу!"
80000048-9 = "[s] «Хорошо... Так что тебе от меня нужно?»"
80000048-10 = "О, точно! Господин! Сегодня День святого Валентина!"
80000048-11 = "А значит, нельзя забывать о шоколаде!"
80000048-12 = "[s] «Ну да, наверное.»"
80000048-13 = "Поэтому я раздобыла вещи, о которых давно мечтала, господин!"
80000048-14 = ""
80000048-16 = ""
80000048-18 = "[ns] «Сюрикены?»"
80000048-19 = "Не только сюрикены, но ещё макебиси, кунаи и многое другое!"
80000048-20 = "Мне удалось собрать кучу вещей, которыми ниндзя пользуются каждый день!"
80000048-21 = "Это 49-й специальный шоколадный набор ниндзя, очень популярный в Кинодеревне Водоворота Хяккияко!"
80000048-22 = "Этот легендарный товар появился в шедевре Шиба Дог Ван Вана «Шиба Дог и ниндзя»!"
80000048-23 = "Я встала на рассвете, чтобы занять очередь!"
80000048-24 = "[s] «Шиба Дог... шоколадный набор? А?»"
80000048-25 = "Посмотрите на насыщенный цвет. Почувствуйте аромат шоколада."
80000048-26 = "Один взгляд на этот шоколадный набор вдохновляет меня тренироваться ещё усерднее!"
80000048-27 = "Разве инструменты ниндзя не великолепны? Смотря на них, я чувствую себя настоящей ниндзя!"
80000048-28 = "Н-Ну, то есть я и так настоящая ниндзя, поэтому и чувствую!"
80000048-29 = "Хи-хи! Ну как, господин?"
80000048-30 = "[s] «Если ты счастлива, то и я счастлив.»"
80000048-31 = "Отлично, потому что я ОЧЕНЬ счастлива! Хи-хи!"
80000048-32 = "Ой, что же я делаю? Вот, господин! Возьмите шоколад!"
80000048-33 = ""
80000048-35 = ""
80000048-36 = "[ns3] «Ты уверена, что хочешь отдать это мне?»\n[ns4] «Я не могу взять твои особенные шоколадки...»"
80000048-37 = "Я это понимаю, но…"
80000048-38 = "Я это понимаю, но…"
80000048-39 = "...главная причина, почему я так хотела этот набор, — чтобы поделиться с вами,#nгосподин."
80000048-40 = "[s] «Изуна!»"
80000048-41 = "Именно поэтому я так страстно желала вас увидеть."
80000048-42 = "Вам понравится, господин! Вкус заставит вас почувствовать себя настоящим ниндзя!"
80000048-43 = "[s] «Значит, вкус ниндзя!»"
80000048-44 = "В-Вы уже постигли истину ниндзя, даже не попробовав шоколад?!"
80000048-45 = "Я не проиграю, господин! Если вы выберете сюрикен,#nя возьму шоколадные макебиси!"
80000048-46 = "А теперь, господин. Приступим! Нин-нин!"
80000048-47 = ""
80000048-49 = ""
80000048-50 = "Изуна всё время улыбалась, пока мы делили шоколад ниндзя."
