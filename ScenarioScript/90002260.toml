[translation]
90002260-1 = "Эпизод 26;Эпилог 2"
90002260-12 = "Ч-что думаешь, Кей...? О нашей новой игре «Арктическое приключение: Финал»...?"
90002260-13 = "Очевидно же, она объявит её шедевром! Она невероятная и... вдохновлена реальными недавними событиями!"
90002260-14 = "Ага. Мы ещё и улучшили художественное оформление по ходу разработки."
90002260-16 = "Я усердно училась и помогала с кодом! Уверена, получится отлично!"
90002260-17 = ""
90002260-19 = ""
90002260-21 = ""
90002260-22 = "...Эм."
90002260-23 = "Что это...?"
90002260-24 = "Видеоигра. Ну конечно. Мы тут этим занимаемся."
90002260-25 = "Момои, если это видеоигра, тогда муха тоже птица."
90002260-26 = "Хотя нет. Это было бы оскорблением для мухи."
90002260-27 = "Что?!"
90002260-29 = "Почему...?"
90002260-30 = "А-Ах..."
90002260-32 = "Уа-а!"
90002260-34 = "Для начала, в какой вселенной в фэнтезийном снежном мире безо всякой причины внезапно появляется гигантский робот-монстр?"
90002260-35 = "Хи-хи... Наша Кей совсем не понимает «романтику» разработки игр..."
90002260-36 = "Нет. Даже «романтика» требует элементарной логики."
90002260-37 = "То, что происходит совершенно случайно, как здесь, нужно называть не «романтикой», а «бредом»."
90002260-38 = ""
90002260-40 = ""
90002260-41 = "Даже если я закрою глаза на гигантского робота-монстра... Что здесь вообще происходит?!"
90002260-43 = "Почему я внезапно попадаю в какое-то воображаемое пространство?! И почему управление такое УБОГОЕ?!"
90002260-44 = "Н-ну, понимаешь, гигантским роботом-монстром ведь непросто управлять, да?! Даже эта неповоротливость — часть «романтики»!"
90002260-45 = "Понимаешь, анахронизмы и причуды — это часть... романтического очарования!"
90002260-46 = "Тогда это САМОВЛЮБЛЁННЫЙ бред!"
90002260-47 = "Не может быть!"
90002260-48 = "И что с этими врагами? Это уже седьмая космическая креветка, которую я встретила с тех пор, как попала в эту воображаемую зону!"
90002260-49 = "Н-но у них разные цвета и... типы атак."
90002260-50 = "Они всё равно креветки! Безлимитный шведский стол из креветок, которых можно избивать!"
90002260-51 = "Э-это техника называется «смена палитры», Кей! Она помогает экономить ресурсы и оптимизировать игровые ассеты..."
90002260-52 = "Но семь цветов? Целая радуга креветок?"
90002260-53 = "Мне плевать на ваши техники, оптимизацию или что там ещё! Должен же быть хоть какой-то смысл делать... спектр креветок!"
90002260-54 = "Я немного слишком увлеклась дизайном пингвинов, и к моменту, когда мы закончили..."
90002260-55 = "Ты ведь согласна, что пингвины милее креветок, правда?"
90002260-56 = ""
90002260-58 = ""
90002260-60 = "Так это всё просто ЛИЧНАЯ САМОВЛЮБЛЁННАЯ ПРЕДВЗЯТОСТЬ?"
90002260-61 = "У-Ух...!"
90002260-62 = "И ещё наземный бой перед тем, как нас засасывает в эту воображаемую зону или что там!"
90002260-63 = "Почему «рывок», «перекат» и «прыжок» назначены на одну и ту же кнопку?!"
90002260-64 = "Н-ну, управление основано на ритме. Для «переката» нажимаешь и сразу отпускаешь. А «прыгнуть» можно, если удерживать примерно три кадра."
90002260-65 = "А «рывок» делается... если удерживать ещё три кадра."
90002260-66 = "Видишь, это всё действия уклонения. Интуитивно назначить их на одну кнопку."
90002260-67 = "К-кроме того, жаль, что ты не заметила..."
90002260-68 = "Но если парировать во время переката и попасть в идеальный кадр..."
90002260-69 = "Ты мгновенно оказываешься за спиной босса и можешь нанести огромный урон. Тебе стоит потренироваться..."
90002260-70 = "Юзу, почему ты проектируешь управление по своим невозможным и бессмысленным стандартам?! И кто вообще считает кадры? И это парирование..."
90002260-71 = "Если даже я не могу нормально вводить настолько точные команды, гарантирую, что большинство других людей тем более не сможет!"
90002260-72 = "Т-ты сможешь, если продолжишь тренироваться, Кей! Конечно! Наверное..."
90002260-73 = "Пожалуйста, послушай меня... Не все в этом мире находятся на твоём уровне, Юзу..."
90002260-74 = "И разве тот промежуточный босс не был слишком нечестным? Я перекатывалась, прыгала и каким-то чудом победила его несмотря на ваше ужасное управление... а потом он ВОСКРЕС?!"
90002260-75 = "Ага, допустим, он может воскреснуть один раз. Но потом снова? И в третий раз?! Я чуть не швырнула контроллер!"
90002260-76 = "Н-но ведь... было весело?"
90002260-77 = ""
90002260-79 = ""
90002260-81 = "Спасите меня от этой пытки!"
90002260-82 = "Уа-а..."
90002260-83 = "А что насчёт этой части... Почему экран так сильно дёргается?"
90002260-84 = "Меня чуть не задел метеор, который бросила космическая креветка из воображаемого пространства — то есть, особая, ЖЁЛТАЯ космическая креветка!"
90002260-85 = "Э-эту часть писала я... Прости, Кей."
90002260-86 = ""
90002260-88 = ""
90002260-89 = "Ага. Тогда это не твоя вина. Ожидаемо. Ты ведь только начала программировать."
90002260-90 = ""
90002260-93 = ""
90002260-95 = "Вообще-то нам всем стоит похвалить Арис за то, что она вообще довела всё до такого состояния. Ты отлично справилась, Арис!"
90002260-97 = "Эй! Угх! Серьёзно, ты...!"
90002260-98 = "Что? Почему? Что? Если уж на то пошло, это ТЫ должна извиниться передо МНОЙ за этого гигантского робота-монстра и воображаемое пространство, Момои."
90002260-99 = "Укх..."
90002260-100 = ""
90002260-102 = ""
90002260-104 = "Так когда я смогу сыграть в официальный релиз?"
90002260-105 = "И что ты вообще здесь делаешь, Токи...?"
90002260-106 = "Есть проблема?"
90002260-107 = "Разве ты не состоишь и в Отряде Исследования Сверхъестественного, И в C&C? У тебя дел нет? Почему ты здесь?"
90002260-108 = "В Миллениуме способный человек может состоять сразу в нескольких клубах."
90002260-109 = "Кроме того, сейчас это моя игровая площадка."
90002260-111 = "«Игровая площадка»...? Но мы вообще-то клуб разработки игр..."
90002260-112 = "Сестрёнка, ты больше всех остальных ПРОВОДИШЬ время за видеоиграми..."
90002260-113 = "Ч-чтобы сделать отличную игру, нужно протестировать самые разные игры и...!"
90002260-114 = "Да, поняла. Я слышала это от тебя уже раз сто."
90002260-116 = "Токи, я думала, ты говорила, что у тебя нет никаких хобби..."
90002260-117 = "Я никогда не говорила, что у меня нет хобби. Я сказала, что изучаю возможные варианты."
90002260-118 = "Недавно у меня появился небольшой интерес к видеоиграм, манге и интернет-трансляциям."
90002260-119 = "...«Небольшой»? И тебе не стыдно так говорить? Ты здесь постоянно."
90002260-120 = ""
90002260-122 = ""
90002260-123 = ""
90002260-124 = ""
90002260-125 = "Токи постучала себя по груди."
90002260-127 = "Здравствуйте, Кей. Я — стыд Асума Токи. «V» — значит победа."
90002260-128 = "Ты идиотка?!"
90002260-130 = "Я не идиотка. Я воплощение скромности и стыда."
90002260-131 = "Серьёзно, у меня от тебя голова болит!"
90002260-133 = "К-Кей?! Пожалуйста, только не падай здесь в обморок, Кей!"
90002260-134 = "Я это запишу! Сделаем следующим сценарием!"
90002260-135 = "ДАЖЕ НЕ ДУМАЙ!!"
90002260-136 = ""
90002260-140 = ""
90002260-141 = "..."
90002260-142 = "Я так счастлива, что могу весело проводить время со всеми!"
90002260-148 = ""
90002260-149 = "Давно не виделись. А, полагаю, Рио, ты здесь впервые?"
90002260-150 = "Да. Значит, вот... где всё началось."
90002260-151 = "Именно. И вот мы описали полный круг и вернулись туда, где всё началось."
90002260-152 = "Спасибо, Химари."
90002260-153 = "...Правда, спасибо."
90002260-154 = "...Не за что."
90002260-155 = "Кхм! Итак, с учётом всего сказанного, полагаю, очевидно, что Отряд Исследования Сверхъестественного успешно выполнил свою основную задачу."
90002260-157 = "Ага. Поначалу я думала, что вы двое просто гоняете меня на какие-то странные поручения."
90002260-158 = "Конечно нет, Эйми! В отличие от этой упрямой и твердолобой Рио..."
90002260-159 = "...я внимательная, открытая, заботливая..."
90002260-160 = "...терпимая, житейски подкованная и утончённая. Я бы никогда не попросила вас сделать что-то неразумное."
90002260-161 = "(...Правда?)"
90002260-162 = "Ты оставила последние остатки стыда на замёрзшем море?"
90002260-163 = "Вы всегда были... своеобразной, президент. Я просто рада, что всё закончилось хорошо."
90002260-164 = "Я также согласна. По уровню своеобразности между вами двумя разница всего в 2–3 пункта."
90002260-165 = "Ради дипломатии я не стану уточнять, у кого счёт выше. Мир, мир."
90002260-166 = "Это чудовищная грубость! Есть огромная разница между... эксцентричной личностью С планом и чудаком, который импровизирует наугад!"
90002260-167 = "Даже если мы обе... «странные,» фундаментально мы разные."
90002260-168 = "[s] «...Значит, ты хотя бы признаёшь, что странная. Я так тобой горжусь.»"
90002260-169 = "И вы туда же, Сенсей?!"
90002260-170 = "(Приятно знать, что не только я так думала.)"
90002260-171 = "А ТЫ чего улыбаешься?!"
90002260-172 = "[s] «Ну-ну. Давайте все дружить...»"
90002260-173 = "К-кхм..."
90002260-174 = "Хотя я благодарна за то, что мы добились такого успеха... и совершенно потрясающего, безусловно..."
90002260-175 = "...Жаль, что никому нельзя об этом рассказать."
90002260-176 = "Наши подвиги хотя бы заслуживают записи в Библиотеке преданий — коллекции городских легенд, гуляющих по Кивотосу."
90002260-178 = "Хм? Разве недостаточно, что мы отбились от угрозы самому существованию? Как можно хотеть большего?"
90002260-179 = "Пожалуйста, Рио, вся эта здравомыслящая банальность заставляет меня чувствовать себя неуютно..."
90002260-180 = "Чтобы исполнить твоё желание, сначала пришлось бы раскрыть существование Отряда Исследования Сверхъестественного."
90002260-181 = "...А потом объяснить, почему ты исчезла..."
90002260-182 = "А ещё раньше пришлось бы объяснить сверхъестественное явление... Декаграмматон. Если бы это случилось, твоё положение—"
90002260-183 = "Знаю! Очевидно же! Я просто сказала! Мне что, даже немного пофантазировать нельзя?"
90002260-185 = "Мне кажется, Рио рассуждает правильно..."
90002260-187 = "Спасибо, Кей."
90002260-188 = "Ну что ж... Мне снова пора. Было приятно снова побывать в Миллениуме."
90002260-189 = ""
90002260-191 = ""
90002260-192 = "Хм?"
90002260-194 = "Что?"
90002260-195 = "Госпожа Рио?"
90002260-196 = "Подожди, серьёзно... *вздох* ...Сенсей?"
90002260-197 = "[s] «Думаю, тебе нужно немного сбавить скорость, Рио!»"
90002260-198 = "А-а? Я... снова сказала что-то не то? Кто знает, когда появится очередная угроза..."
90002260-199 = "И почему же? Потому что снова действовать тайно эффективнее, рациональнее и результативнее?"
90002260-200 = "...Откуда вы знали, что я собиралась это сказать?"
90002260-202 = "Рио. Давай серьёзно поговорим."
90002260-203 = "Для начала ты можешь тайно скрываться прямо здесь, в Миллениуме."
90002260-204 = "Я это гарантирую. В конце концов, я сама так делаю."
90002260-205 = "Разве это не только потому, что у вас характер немного... извращённый?"
90002260-206 = "Пф-ф?!"
90002260-207 = "...Эйми? Боюсь, я постепенно теряю желание жить."
90002260-208 = "Не переживайте, президент. С вами всё будет хорошо. Вы слишком бесстыжая — то есть, «стойкая», чтобы так просто сломаться."
90002260-209 = "Верно. Та президент Химари, которую я знаю, никогда не потеряет своё возвышенное самомнение — даже если ради этого придётся затянуть весь мир в воронку собственного эго."
90002260-210 = "Я начинаю беспокоиться о том, какое у всех впечатление обо мне..."
90002260-213 = "В любом случае, Рио. С моей точки зрения... причина, по которой ты снова пытаешься спрятаться, в том, что..."
90002260-214 = "...тебе некомфортно от одной мысли встретиться с остальными учениками Миллениума."
90002260-215 = "..."
90002260-216 = "Конечно, ты социально неуклюжа, но в последнее время добилась некоторого прогресса в попытках понимать других."
90002260-217 = "...И поэтому..."
90002260-218 = "...я не думаю, что в своей основе ты плохой человек."
90002260-219 = "Так что именно ты пытаешься сказать?"
90002260-220 = "...Серьёзно, не верится, что ты заставляешь меня буквально вытягивать из себя эти слова...!"
90002260-221 = "Слушай внимательно. Я скажу это только один раз. Так что..."
90002260-222 = "...Неважно, что ты сделала! Даже если ты жестоко обошлась с нашей милой маленькой Арис!"
90002260-223 = "Даже если нанесла Токи огромную и непоправимую эмоциональную травму...!"
90002260-224 = "Даже если ты узколобая, параноидальная, одержимая и слишком упрямая, чтобы кого-либо слушать...!"
90002260-225 = "В глубине души ты НЕ плохой человек! Ты помогла нам всем. В конце концов ты спасла нас."
90002260-227 = "Но... я..."
90002260-228 = "Что-то не даёт тебе покоя? Что? Тебе жаль? Или ты чувствуешь вину? Так скажи это вслух вместо того, чтобы снова убегать!"
90002260-229 = "Послушай, всё, что я хочу сказать..."
90002260-230 = "ТЫ! МОЖЕШЬ! ОСТАТЬСЯ! ЗДЕСЬ! РИО! Ты меня понимаешь?!"
90002260-231 = "Вообще-то тебе ЛУЧШЕ остаться здесь! Хотя бы так мы сможем держать твои проблемы под контролем!"
90002260-232 = ""
90002260-234 = ""
90002260-236 = ""
90002260-237 = "Президент..."
90002260-238 = "Верно."
90002260-239 = "...Хмф."
90002260-240 = ""
90002260-242 = ""
90002260-243 = "...Что это сейчас было? Что случилось?"
90002260-245 = "Меня тронуло такое признание. Думаю, мне стоит пустить пару слезинок, так что пойду найду глазные капли."
90002260-246 = "Можешь взять мои, Эйми. Как у идеальной горничной и агента, они у меня всегда с собой."
90002260-247 = "Я всё записала. Потом поделюсь записью с Арис."
90002260-248 = "...!"
90002260-249 = "Вот почему мне не стоит говорить с ходу..."
90002260-250 = "[s1] «Но Химари права.»\n[s2] «...Рио, разве Юука тебя уже не отругала...?»"
90002260-253 = "...!!"
90002260-254 = "Д-да... Мне нужно менять своё поведение."
90002260-255 = "Точно..."
90002260-257 = ""
90002260-258 = "Можно уверенно сказать, что риска взлома Декаграмматоном больше нет. Но есть ещё одна причина, по которой мы все здесь."
90002260-259 = "Мы должны скрыть существование Малкут от учеников Миллениума..."
90002260-260 = "...и от всех учеников Кивотоса. Верно, Малкут?"
90002260-261 = ""
90002260-263 = ""
90002260-265 = "Я давно смирилась с тем, что моя судьба — быть забытой."
90002260-266 = "И если такая участь постигнет меня, в общей картине это не будет иметь значения."
90002260-267 = "[s] «Прости... мы тебя разозлили?»"
90002260-268 = "Я не понимаю вопрос. Возможно, у этого слова есть другое значение? «Разозлили»?"
90002260-269 = "Я не понимаю, о чём вы спрашиваете, Сенсей. Прошу, поясните."
90002260-270 = "Вы говорите, что «ничего страшного» не знать? Теперь я запуталась ещё сильнее."
90002260-271 = "[s3] «Г-главное!»\n[s4] «Что ты хочешь делать теперь, Малкут?»"
90002260-274 = "Фуфу. Это всего лишь предложение и НИКАКОГО давления..."
90002260-275 = "Если захочешь, мы можем найти тебе место в Отряде Исследования Сверхъестественного."
90002260-276 = "Опять же — только если ты сама этого хочешь. По собственной свободной воле. Что скажешь?"
90002260-277 = "Я..."
90002260-278 = "(Неужели Химари хочет сказать...)"
90002260-280 = "Она говорит, что хочет, чтобы ты осталась и мы все могли дружить."
90002260-281 = "Верно. Президенту Химари трудно говорить прямо. И честно."
90002260-282 = "...Это ведь ТОЧНО не потому, что она хочет тебя изучать, правда?..."
90002260-284 = "(Великие умы мыслят одинаково.)"
90002260-285 = "Может, вы все перестанете бросаться дикими обвинениями? Обязательно всегда предполагать худшее?"
90002260-286 = ""
90002260-288 = ""
90002260-290 = "Нюансы языка даются мне трудно..."
90002260-291 = "..."
90002260-292 = "Спасибо за вашу заботу и щедрое предложение."
90002260-293 = "Но я хотела бы некоторое время оставаться в укрытии... в другом месте."
90002260-294 = "[s] «Зачем?!»"
90002260-295 = "..."
90002260-296 = "До сих пор я не знала, что вообще может означать «моя собственная жизнь»..."
90002260-297 = "Мне не требовалось об этом думать, и необходимости в этом не было."
90002260-298 = ""
90002260-300 = ""
90002260-302 = "Эйн, Соф и Ор..."
90002260-303 = "Мои сёстры попросили меня жить. Такая просьба заставляет меня попытаться."
90002260-304 = "И всё же мне кажется, что нужно время, чтобы определить, упорядочить и выстроить то, чем станет моя «жизнь»."
90002260-305 = "Я не знаю, почему и как пришла к этой мысли..."
90002260-306 = "...Но, если воспользоваться одним из ваших выражений, у меня есть «внутреннее чувство», что мне необходимо всё это обдумать."
90002260-307 = "..."
90002260-308 = "Если ты сама этого хочешь, я не собираюсь тебя останавливать."
90002260-309 = "Но если снова попробуешь устроить неприятности..."
90002260-310 = "Я использую все свои ресурсы, чтобы снова тебя победить... и зачислить в Миллениум."
90002260-311 = ""
90002260-313 = ""
90002260-315 = ""
90002260-316 = "...Фуфу."
90002260-317 = "Да. Я действительно «усвоила» необходимую степень осмотрительности."
90002260-322 = "...Я правда жалею, что в конце не попыталась её остановить."
90002260-323 = "М-м... Но, кажется, я в какой-то степени понимаю чувства Малкут."
90002260-324 = "Мы все знаем, как сильно ты любишь уходить в подполье."
90002260-325 = "Именно. Госпожа Рио талантлива в искусстве залечь на дно, оборвать связь и тайно строить планы."
90002260-326 = "...Токи, тебе когда-нибудь предлагали думать прежде, чем говорить?"
90002260-327 = "Откуда ты знала, Кей? Ты всё это время тайно за мной шпионила?"
90002260-328 = "Знаешь, некоторые вещи просто очевидны!"
90002260-329 = "Что такое, Кей? Токи всего лишь констатировала факты."
90002260-330 = "Кажется, я понимаю, почему вы двое ладите..."
90002260-333 = "Интересно, куда она направилась... и как долго её не будет."
90002260-334 = "[s] «Думаю, ей просто нужно время.»"
90002260-335 = "То есть «время, чтобы всё обдумать и лучше понять себя»?"
90002260-336 = "Она могла сделать это и здесь. У нас есть оборудование..."
90002260-337 = "Значит, ты по ней скучаешь."
90002260-338 = "...Не скучаю."
90002260-340 = "Ага, значит, скучает."
90002260-341 = "Вы не можете просто признаться в своих чувствах?"
90002260-343 = "..."
90002260-344 = "Ты дрожишь."
90002260-347 = "Есть вещи, которым можно научиться только в одиночестве."
90002260-348 = "Возможно, однажды она выберется наружу. И сама выберет свой путь."
90002260-349 = ""
90002260-352 = "Я удивлена. Слышать такое от тебя, Рио..."
90002260-353 = "Это так странно?"
90002260-354 = "[s] «Да. Я впечатлён.»"
90002260-355 = "...Пожалуйста, не дразните меня..."
90002260-356 = "Редко услышишь от президента такую похвалу."
90002260-357 = "Это правда. Даже я ни разу не получала подобного комплимента, хотя заслуживаю его."
90002260-358 = "Вот почему мне нужен Сенсей. В последнее время я ничего не делала, но, пожалуйста, похвалите меня."
90002260-359 = "[s] «Эм, подожди...»"
90002260-360 = "Прыг-прыг?"
90002260-361 = "[s] «Токи, пожалуйста? Токи...»"
90002260-362 = "Токи, ты что, настоящий РЕБЁНОК?!"
90002260-365 = "И всё-таки это... приятно, разве нет?"
90002260-366 = "Что именно?"
90002260-367 = "Не знаю. Может, это похоже на зависть, которую чувствуешь, глядя на птицу, свободно летящую в небе."
90002260-368 = "Рано или поздно птице всё равно придётся спуститься, да."
90002260-369 = "Чтобы попить воды, поесть и дать крыльям отдохнуть."
90002260-370 = "Но всё же, пока она летит, небо принадлежит птице."
90002260-371 = "Даже если ей приходится лететь одной по пустому небу."
90002260-372 = "...Да. Но я не думаю, что она одна."
90002260-373 = "О, и почему же?"
90002260-374 = ""
90002260-377 = "Потому что наверняка... должен быть... кто-то, кто за ней наблюдает."
90002260-378 = "...Ты права."
90002260-379 = ""
90002260-383 = "[ns] «Отличная работа, все.»"
90002260-386 = "Спасибо."
90002260-387 = "И отличная работа, Отряд Исследования Сверхъестественного."
