[translation]
10015045-4 = "Хакерская комната Веритас"
10015045-7 = ""
10015045-8 = ""
10015045-9 = ""
10015045-10 = ""
10015045-11 = "Это... неожиданно."
10015045-12 = "Я знаю, что согласилась помочь с фестивалем."
10015045-13 = "Но если вы попробуете надеть на меня один из этих костюмов чирлидеров, я прямо сейчас отключу все брандмауэры серверов «Семинара»."
10015045-15 = "О нет-нет. Мы совсем не за этим, Ти."
10015045-16 = "Мы надели это по собственной воле, а не по чьему-то приказу."
10015045-17 = "Ха-ха-ха! Ну, скорее, мы по собственной воле принимаем последствия своих поступков."
10015045-18 = "Это костюмы-наказания... Это наказание..."
10015045-19 = ""
10015045-22 = ""
10015045-23 = "...Сенсей. Вы заставляете этих студентов носить такую форму в наказание?!"
10015045-24 = "[s] «Почему ты обязательно должна была сформулировать это максимально ужасно?!»"
10015045-25 = "Хи-хи. Как бы весело ни было поддразнивать Сенсея, у нас сейчас небольшая чрезвычайная ситуация."
10015045-26 = "Вот что произошло..."
10015045-27 = ""
10015045-31 = ""
10015045-33 = "Итак, всё шло по плану, без каких-либо проблем..."
10015045-34 = "Но вы потеряли контроль над роботом сразу после подключения модуля беспроводной связи малого радиуса?"
10015045-35 = "Да. Ноа даже проверила наши чертежи и сказала, что проект идеален."
10015045-36 = ""
10015045-38 = ""
10015045-39 = "Минимальное значение энтропии в протоколе согласования ключей шифрования было достаточно высоким?"
10015045-40 = "...Нет."
10015045-41 = "Вы провели проверку целостности пакета при повторном подключении к серверу безопасности?"
10015045-42 = "Нет..."
10015045-43 = "Вы обновили прошивки систем, как я просила вас... целый месяц назад? Хотя не отвечайте. Я уже знаю."
10015045-44 = ""
10015045-47 = ""
10015045-48 = ""
10015045-49 = "На ненужные функции в своих изобретениях вы выкладываетесь по полной, а кибербезопасность — так, задняя мысль?"
10015045-50 = "Называть их ненужными функциями немного жестоко..."
10015045-51 = "Нам нужно было, чтобы робот мог взаимодействовать с большой аудиторией и одновременно управлять сложным оборудованием, поэтому безопасность... стала первым, что мы урезали..."
10015045-52 = "...И я признаю, что это было не самое разумное решение."
10015045-53 = "Мы ещё и решили, что в нескольких дверях отсюда сидит блестящий советник по безопасности на случай проблем... и потому кое-где срезали углы."
10015045-55 = "Не используйте меня как костыль. От каждой из вас у меня мигрень."
10015045-56 = "Подожди, подожди! Хибики, ты сама это спроектировала?"
10015045-57 = "Это так круто! Цвета просто потрясающие! И мне очень нравится дизайн верха!"
10015045-58 = "Но юбка... Она не слишком короткая?"
10015045-59 = "Она идеальной длины! Согласно отчёту Отдела исследований спортивной науки, чем короче юбка чирлидера, тем выше эффективность поддержки!"
10015045-60 = "Отчёты никогда не ошибаются! Короткие юбки — логичный результат их исследований!"
10015045-62 = "Не слушайте Котори... Это старая юбка, я просто немного из неё выросла..."
10015045-63 = "После того как я сделала форму Утахи, у меня просто не осталось времени удлинить эту юбку."
10015045-64 = "У вас правда есть время переживать о длине юбок, когда где-то разгуливает преступник, который взламывает и саботирует роботов?"
10015045-65 = "Спасибо, Харэ. Нужно как можно скорее установить личности виновных и задержать их."
10015045-66 = "Прости за ещё одну просьбу в последнюю минуту, но можешь найти больше информации о том, кто взломал робота-болельщика?"
10015045-67 = "Не извиняйся. Я уже согласилась помочь. А отследить источник будет легко."
10015045-68 = "Котама, получи доступ к радиочастотным модулям, установленным вокруг учебного центра «Миллениума»."
10015045-69 = "Если они взломали беспроводной модуль малого радиуса издалека, значит, использовали направленную антенну. По помехам мы сможем вычислить примерное местоположение источника."
10015045-70 = "Ч-что...? Радиомодули? В учебном центре? К-кто вообще мог установить там такое?"
10015045-71 = "К этому моменту ты уже должна понимать, Котама, что от меня ничего не скроешь. Раньше ты подслушивала Сенсея через внешний модуль."
10015045-72 = "[s] «А? Что? Поподробнее, пожалуйста?»"
10015045-73 = "Слушай, Котама. Если ты не сделаешь, сделаю я."
10015045-74 = ""
10015045-77 = "Ладно, ладно. Я подключилась. Что проверять первым?"
10015045-78 = "[s] «Эм... Алло? Котама? Кто-нибудь?»"
10015045-79 = "Простите, Сенсей. Я потом с ней поговорю, обещаю."
10015045-80 = ""
10015045-82 = ""
10015045-83 = "Котама, расположи по времени модули с частыми помехами вокруг промышленной лаборатории. Самые свежие — первыми."
10015045-84 = ""
10015045-86 = ""
10015045-87 = "Заодно проверим, не было ли аномального доступа к серверу. Временной промежуток у нас довольно точный, так что долго это не займёт."
10015045-88 = "Спасибо, Чихиро. Признаюсь, я не ожидала от «Веритас» такой готовности сотрудничать. Я приятно удивлена."
10015045-89 = "Ничего особенного."
10015045-90 = "Я и правда считаю, что Фестиваль Хало должен быть праздником для всех."
10015045-91 = "Но... меня не покидает ощущение, будто я что-то упускаю."
10015045-93 = "Будто... прямо у нас под носом происходит что-то большое, чего мы не замечаем."
