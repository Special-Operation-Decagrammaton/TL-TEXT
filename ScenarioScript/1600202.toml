[translation]
1600202-1 = "Слушайте сюда!"
1600202-2 = "Откуда-то доносится бормотание."
1600202-3 = "Ух... Это уже слишком. Выпустите меня отсюда!"
1600202-4 = "Голова... Уши больше не выдерживают! Помогите...! ПОМОГИТЕ!"
1600202-5 = "[s] «...?»"
1600202-6 = "А, это ты, Сенсей?"
1600202-7 = "Мой спаситель. Я сделаю что угодно, Сенсей! Только, пожалуйста, поменяйся со мной местами!!"
1600202-8 = "Стой! Ты куда? У нас ещё много осталось! Мы только начали!"
1600202-9 = "И-и-и-и!"
1600202-10 = "Простите! Не знаем, что сделали не так, но пощадите нас!"
1600202-11 = "Пощадить? Незнание не грех! То есть оно опасно и может привести к греху..."
1600202-12 = "...но именно поэтому нужно бороться и всегда быть открытыми к знаниям!"
1600202-13 = "Итак, как я говорила! Консервы начали не с банок, а с бутылок — как способ хранения военных припасов. Позже из-за конкуренции на рынке..."
1600202-14 = "...эпоха еды в бутылках закончилась и началась эпоха жестяных банок. А если интересно, почему банка солонины имеет форму трапеции, в отличие от других плоских мясных консервов..."
1600202-15 = "А-а-а-а!!"
1600202-16 = "[s] «Я что-то слышал про консервированную солонину?»"
1600202-17 = "О. Здравствуйте, Сенсей!"
1600202-18 = "Что здесь происходит...? Не понимаю, о чём ты. Ничего необычного."
1600202-19 = "Они спросили, почему банка солонины трапециевидная, и я просто объясняла..."
1600202-20 = "П-Просто?! Уже два часа!"
1600202-21 = "Ты уже дошла до истории добычи алюминия и методов шахтёров!"
1600202-22 = "Конечно! Это важный исторический контекст!"
1600202-23 = "Как можно понять общую картину, не зная мелких деталей?"
1600202-24 = "Но это не значит, что нам нужно знать ВООБЩЕ ВСЁ!"
1600202-25 = "Да! Мы всего лишь хотели узнать, почему банка такой формы!"
1600202-26 = "...!"
1600202-27 = "...Неважно."
1600202-28 = "Возможно, кое-где я немного переборщила..."
1600202-29 = "Значит, вам нужно более научное объяснение! Это моя специальность!"
1600202-30 = "Тогда начнём с того, почему вообще используется алюминий. Как вы знаете, алюминий, или «Al», — металл с атомным номером 13 в периодической таблице."
1600202-31 = "По сравнению с металлами, применявшимися раньше, он лучше сопротивляется внешней среде благодаря реакционной способности и пассивации поверхности..."
1600202-32 = "А-а-а! Хватит! Прекрати! Ар-р-ргх!"
1600202-33 = "У меня уже ПТСР начинается! Я годами не смогу смотреть на солонину!"
1600202-35 = "П-Погодите! Куда вы? Стоять! Я сказала, стоять!"
1600202-36 = "..."
1600202-37 = "Хм. Они ушли до самого важного..."
1600202-38 = "Интересно, почему все так не хотят учиться. Разве не приятно узнавать то, чего раньше не знал?"
1600202-39 = "Ты ведь понимаешь, правда, Сенсей? Всё-таки ты учитель."
1600202-40 = "[s1] «Конечно. Знание — сила!»\n[s2] «Часть работы учителя — понимать темп обучения студенты.»"
1600202-41 = "Я знала, что могу рассчитывать на тебя на передовой войны с невежеством!"
1600202-42 = "Я всегда уважала в тебе это. Особенно потому что..."
1600202-43 = "П-Правда? Хм. Наверное, это действительно так."
1600202-44 = "Поэтому я и пыталась начать с основ..."
1600202-45 = "..."
1600202-46 = "[s] «...Котори?»"
1600202-47 = "Кстати, Сенсей. Ученики задают тебе самые разные вопросы."
1600202-48 = "Некоторые даже сами хотят отвечать на уроке, когда ты их не вызываешь."
1600202-49 = "Как ты это делаешь?! Как мне стать такой же?!"
1600202-50 = "Это потрясающе! Я хочу быть таким же учителем, как ты!"
1600202-51 = "Моя мечта — однажды читать лекции в зале, полном людей, которые хотят учиться!"
1600202-52 = ""
1600202-53 = "...Эм."
1600202-54 = "Я-я немного увлеклась, да? Ахаха..."
1600202-55 = "А? Думаешь, мне правда нравится всё объяснять?"
1600202-56 = "Не то чтобы ты ошибался, но дело не только в этом."
1600202-57 = "Ну, отрицать не буду..."
1600202-58 = "...но точнее будет сказать, что мне нравится видеть лица людей, когда они узнают что-то новое."
1600202-59 = "Мне нравится учить людей новому, чтобы потом, когда они разберутся, было с кем это обсудить."
1600202-60 = "...Некоторые вещи я объясняю хорошо, но свои чувства — ужасно."
1600202-61 = "Как думаешь, я... слишком много говорю?"
1600202-62 = "[s3] «Нет ничего плохого в разговорчивости, когда ты увлечена.»\n[s4] «Ты похожа на цыплёнка. По-моему, это мило.»"
1600202-63 = "Правда? Ты так думаешь?"
1600202-64 = "(По крайней мере, Сенсей не считает меня странной...)"
1600202-65 = "М-маленький ц-цыплёнок...? П-Правда?"
1600202-66 = "(Никогда не думала, что кто-то назовёт меня милой...!)"
1600202-67 = "Как хорошо. Я боялась, что произвела плохое впечатление..."
1600202-68 = "Я так рада, что хотя бы ты меня понимаешь, Сенсей!"
1600202-69 = "Хи-хи..."
1600202-70 = "..."
1600202-71 = "[s] «...Котори?»"
1600202-72 = "Кстати, о понимании..."
1600202-73 = "Чтобы человек мог что-то понять, необходима самосознательность..."
1600202-74 = "...а самосознательность означает осознавать свои действия, чувства и решения, верно?"
1600202-75 = "Получается, всё, что мы замечаем и понимаем в себе, позволяет нам замечать и принимать это и в других..."
1600202-76 = ""
1600202-77 = ""
1600202-78 = "...Сенсей?"
1600202-79 = "Алло? Сенсей?"
1600202-80 = ""
1600202-81 = ""
1600202-82 = ""
1600202-83 = "Наверное, он ушёл в туалет."
