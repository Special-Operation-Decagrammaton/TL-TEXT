[translation]
1600605-1 = "Девушка сражается с океаном"
1600605-2 = "Весь день мы с Изуми ходили по пяти знаменитым пляжным ресторанам."
1600605-3 = "Ух ты, было очень вкусно!"
1600605-4 = "Правда, Сенсей?!"
1600605-5 = "[s1] «Ну, было неплохо.»\n[s2] «Вкусно — это точно, но...»"
1600605-6 = "Почему так неуверенно? Тебе не понравилось, Сенсей?!"
1600605-7 = "Почему так неуверенно? Тебе не понравилось, Сенсей?!"
1600605-8 = "Или тебе просто трудно выбрать любимое блюдо."
1600605-9 = "Может, какигори со вкусом тонкоцу-рамэна?"
1600605-10 = "Или жареная лапша со вкусом дыни?!"
1600605-11 = "[s3] «Жареная лапша со вкусом дыни была не очень...»\n[s4] «Ладно, неважно. Речь вообще не об этом.»"
1600605-14 = "[s] «Мы на пляже, Изуми. Хочешь поплавать?»"
1600605-15 = "Поплавать?"
1600605-16 = "Хм. И правда, пока мы были на пляже, мы только и делали, что ели."
1600605-17 = "Но ведь нет правила, что раз ты на пляже, обязательно нужно плавать, да?"
1600605-18 = "[s] «Конечно, но тебе не кажется, что ты многое упускаешь?»"
1600605-19 = "Упускаю что? Возможность нормально использовать купальник?"
1600605-20 = "Хммм..."
1600605-21 = "Ну и ладно. Раз ты настаиваешь, Сенсей!"
1600605-22 = "Сейчас я немного объелась, но слышала, что после плавания снова естественным образом хочется есть."
1600605-23 = "Хочу проверить, правда ли это! Давай попробуем!"
1600605-24 = "В воду!"
1600605-25 = "[s] «Так вот единственная причина, почему ты хочешь плавать?!»"
1600605-30 = ""
1600605-31 = "Ух ты, какая красивая вода!"
1600605-32 = "Пляж — это здорово!"
1600605-33 = "Уууу!"
1600605-34 = ""
1600605-35 = ""
1600605-36 = ""
1600605-38 = "Ааа! Какая огромная волна!"
1600605-39 = "Ха-ха. Смотри, Сенсей!"
1600605-40 = "Всё, что перед нами, — сплошной океан!"
1600605-41 = "[s] «Верно.»"
1600605-42 = "Морская вода простирается до самого горизонта."
1600605-43 = "И морская вода солёная, да?"
1600605-44 = "А кто не любит солёненькое, правда?"
1600605-45 = "Например, сёю-рамэн и сио-рамэн!"
1600605-46 = ""
1600605-47 = "*хлюп*"
1600605-48 = "[s] «Морскую воду нельзя пить, Изуми!»"
1600605-49 = "Да ладно, я не настолько глупая. Я бы никогда не стала пить морскую воду."
1600605-50 = "Просто она напомнила мне о рамэне, вот и всё!"
1600605-53 = ""
1600605-54 = "Ааа! Такая холодная."
1600605-55 = "Эй, Сенсей, иди сюда. Сюда!"
1600605-56 = "[s] «Похоже, тебе весело, Изуми.»"
1600605-57 = "Ещё как!"
1600605-58 = "Я думала, что поездка сюда будет совсем неинтересной..."
1600605-59 = "...но теперь, когда я здесь, мне невероятно весело."
1600605-61 = "Хм. Почему же?"
1600605-62 = "Это..."
1600605-63 = "Хммм. Кажется, я поняла..."
1600605-64 = "Хи-хи. ♪"
1600605-65 = ""
1600605-66 = "*обнимает*"
1600605-67 = "А?"
1600605-68 = ""
1600605-69 = "*обнимает*"
1600605-70 = "Какого...?!"
1600605-71 = "[s] «Изуми? Что случилось?»"
1600605-72 = "Эм, э-э-э..."
1600605-73 = "Ааа! На мне что-то странное, Сенсей!"
1600605-74 = "[s] «Изуми?!»"
1600605-77 = "― С-Сенсей. Помоги...[wa:1430]"
1600605-80 = "[ns] «Ты в порядке, Изуми?!»"
1600605-81 = "― Такое странное ощущение.[wa:810]"
1600605-83 = "― Оно мокрое и липкое...[wa:1720]"
1600605-86 = "[ns] «Я помогу тебе!»"
1600605-87 = "― Отстань![wa:560]"
1600605-89 = "― Тебе меня не съесть![wa:580]"
1600605-92 = "― Я ещё столько всего должна попробовать![wa:440]"
1600605-95 = "― Ух...[wa:720]"
1600605-97 = "― Я не могу просто так сдаться...![wa:50]"
1600605-100 = "[ns] «......Изуми?»"
1600605-101 = "― *вздох*[wa:980]"
1600605-103 = "― Если уж меня всё равно собирается съесть осьминог, тогда я могу...![wa:520]"
1600605-106 = "― А что если я сама съем осьминога?![wa:650]"
1600605-109 = "Вот оно!"
1600605-110 = "Я выиграю, если съем его раньше, чем он съест меня, да?!"
1600605-111 = ""
1600605-113 = ""
1600605-114 = "Фууу!!!"
1600605-115 = "[s] «Не думаю, что это хорошая идея, Изуми!»"
1600605-117 = "Мне с трудом удалось снять осьминога с Изуми и безопасно вернуть его в море."
