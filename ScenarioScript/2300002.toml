[translation]
2300002-1 = "Десерт вместо обеда"
2300002-2 = "Исполнительный офис Шале"
2300002-4 = "Вернувшись из командировки, я обнаружил на столе в «Шале» гору документов."
2300002-5 = "Я решил пропустить обед, чтобы разобрать все бумаги на столе."
2300002-8 = "Сенсей, вы там?"
2300002-12 = "Привет, Сенсей!"
2300002-13 = "Как проходит ваш день?"
2300002-14 = "[s1] «А-ха-ха, ну...»\n[s2] Молча смотреть на свой стол."
2300002-15 = "А? Это всё ваши документы?"
2300002-16 = "А? Это всё ваши документы?"
2300002-17 = "Ого. У взрослых и правда столько обязанностей..."
2300002-18 = "О! Вы уже обедали?"
2300002-19 = "*ах* Вы всё ещё не ели?"
2300002-20 = "О нет. Так нельзя."
2300002-21 = "Я почему-то чувствовала, что вы пропустите обед, поэтому принесла вам десерт!"
2300002-22 = "Сегодня в Cafe Mille-Feuille появились новые позиции!"
2300002-23 = "Мне хотелось попробовать их вместе с вами, поэтому я принесла их сюда."
2300002-24 = ""
2300002-25 = "Та-дам!"
2300002-26 = "Айри достала из сумки несколько разных пирожных."
2300002-27 = "Это их новые капкейки!"
2300002-28 = "Ну как, Сенсей? Разве не выглядят вкусно?"
2300002-29 = "Этот с малиновой начинкой!"
2300002-30 = "Раньше мне дали попробовать кусочек... Интересно, это точно была малина?"
2300002-31 = "Вкус был такой кисловатый и необычный!"
2300002-32 = ""
2300002-33 = "А этот капкейк сделан с бананами!"
2300002-34 = "Пробников не было, но цвет был настолько красивым, что я просто не смогла удержаться!"
2300002-35 = "А этот..."
2300002-36 = ""
2300002-37 = "...мятно-шоколадный капкейк!"
2300002-38 = "Вообще-то он даже не новый."
2300002-39 = "Просто мне захотелось один."
2300002-40 = "Сладость шоколада в сочетании с освежающим вкусом мяты..."
2300002-41 = "..."
2300002-42 = "[s3] «Айри?»\n[s4] «Земля вызывает Айри.»"
2300002-43 = "А?!"
2300002-44 = "А?!"
2300002-45 = "Ха-ха... Простите. Я немного задумалась."
2300002-46 = "В общем, какой хотите попробовать первым, Сенсей?"
2300002-48 = "Мы довольно долго ели капкейки, пока Айри рассказывала мне о разных вкусах."
2300002-49 = "Похоже, к документам придётся вернуться позже."
