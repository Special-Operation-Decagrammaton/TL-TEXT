[translation]
1006215-1 = "Знак связи"
1006215-3 = "Офис Шале"
1006215-5 = "Мне позвонили с неизвестного номера."
1006215-6 = "Я ответил, собираясь вежливо отказаться, если это окажется рекламный звонок, но затем..."
1006215-7 = "Здравствуйте, Сенсей."
1006215-8 = "[s] «Токи?!»"
1006215-9 = "Соединение подтверждено."
1006215-10 = "Попытка успешна. Я рада. Я действительно превосходна."
1006215-11 = "Теперь я также подтвердила, что связана с вами двадцать четыре часа в сутки, Сенсей."
1006215-12 = "[s] «Это можно очень неправильно понять...»"
1006215-13 = "Но это всего лишь правда."
1006215-14 = "Разве прямо сейчас вы не разговариваете со мной по неизвестному каналу связи?"
1006215-15 = "Учитель никогда не должен отрицать очевидные истины."
1006215-16 = "Разве обязанность педагога не состоит в том, чтобы вести учеников к правильным выводам, основанным на фактах?"
1006215-17 = "[s] «Не могу сказать... что ты неправа...»"
1006215-18 = "Как и ожидалось, вы настоящий учитель. Умение быстро менять ход мыслей — прекрасное качество."
1006215-19 = "В любом случае, я связалась с вами, чтобы договориться о встрече. У меня есть кое-что для вас."
1006215-20 = "[s] «Что-то для меня?»"
1006215-21 = "Верно. Я, добрая и идеальная горничная, собираюсь вручить вам эти цифровые оковы—"
1006215-22 = "...Я хотела сказать, символ нашей связи."
1006215-23 = "[s] «Мне показалось, ты сказала что-то очень зловещее...»"
1006215-24 = "Вы ослышались."
1006215-25 = "...Не думаете? Это правда. Вы ослышались."
1006215-26 = "Можете спорить сколько угодно, моё мнение не изменится."
1006215-27 = "Послушайте, Сенсей. Говорят, человек в среднем проглатывает восемь пауков в год."
1006215-28 = "Если так, разве не логично, что человек в среднем сто раз в год что-нибудь неверно расслышит?"
1006215-29 = "...Хм? Какая связь между этими двумя вещами?"
1006215-30 = "..."
1006215-31 = "Никакой. Но вы всё равно ослышались. Я уверена."
1006215-32 = "[s] «Ладно... Будем считать, что ты права...»"
1006215-33 = "Спасибо."
1006215-34 = "Так вот, я хотела бы навестить вас."
1006215-35 = "Я приду и передам вам этот знак нашей связи. Хорошо?"
1006215-36 = "[s] «Ладно, конечно... Ты где...?»"
1006215-37 = "Это согласие прозвучало не слишком воодушевлённо..."
1006215-38 = "Нет. Разумеется, вы хотите, чтобы я пришла. На самом деле я уже стою перед офисом Шале."
1006215-39 = "[s1] «Ты проделала весь путь сюда и только потом позвонила мне?»\n[s2] «Ты всё это время разговаривала со мной снаружи?»"
1006215-42 = "Верно."
1006215-43 = ""
1006215-49 = ""
1006215-50 = "Здравствуйте, Сенсей. Рада снова вас видеть."
1006215-51 = "[s3] «Эм... ладно...» \n[s4] «Ты могла просто зайти с самого начала...»"
1006215-54 = "Могла, но это была моя стратегия, чтобы вызвать у вас сочувствие."
1006215-55 = "Кроме того, я хотела, чтобы прохожие подумали..."
1006215-56 = "...«Как Сенсей мог заставить такую идеальную и замечательную горничную ждать снаружи? Как ужасно.»"
1006215-57 = "...Правда, была одна существенная проблема."
1006215-58 = "Спросите, какая? Перед вашим офисом оказалось значительно меньше прохожих, чем я ожидала."
1006215-59 = "Вот это промах. В следующий раз я тщательнее поищу способы как следует вызвать сочувствие и у вас, и у прохожих."
1006215-60 = "[s] «Зачем тебе вообще понадобилось сочувствие?!»"
1006215-61 = "О нет. Вы ослышались."
1006215-62 = "[s] «Ладно... Будем считать, что ты права...»"
1006215-63 = "Но продолжим. Позвольте раскрыть цель моего сегодняшнего визита."
1006215-64 = ""
1006215-66 = ""
1006215-67 = ""
1006215-69 = "Да, теперь скрывать уже бессмысленно. Это гарнитура, идеально подходящая и горничной, и безупречному агенту."
1006215-70 = "Шумоизоляция здесь основательная, а несмотря на внутриканальную конструкцию, специальная акустическая обработка защищает слух от повреждений."
1006215-71 = "Разумеется, предусмотрены базовые меры против помех и взлома канала. Но даже в маловероятном случае компрометации канала есть дополнительные меры защиты."
1006215-72 = "Она автоматически обойдёт скомпрометированный канал и создаст новый."
1006215-73 = "Есть и другие функции, но из-за нехватки времени я их пропущу."
1006215-74 = "Главное, что теперь у нас будет отдельный защищённый канал связи."
1006215-75 = "Это значит, что вы сможете связаться со мной напрямую в любое время."
1006215-76 = "Одна для вас, одна для меня. Две образуют пару."
1006215-77 = "[s] «Мне правда можно принять такую вещь?»"
1006215-78 = "Да. Я этого хочу."
1006215-79 = "Это уникальное особое устройство, которое человек, которому я раньше служила, разработал специально для меня."
1006215-80 = "...Мне стоит сохранить его до возвращения того человека?"
1006215-81 = "Зачем? Не использовать все доступные ресурсы неразумно. Та особа сказала бы то же самое."
1006215-82 = "Поэтому я считаю, что правильное решение — отдать его вам. Та особа тоже согласилась бы."
1006215-83 = "Кроме того, сама гарнитура будет рада, что её используют."
1006215-84 = "Срок службы инструментов сокращается, если они простаивают без дела."
1006215-85 = "Поэтому, Сенсей, пожалуйста, наденьте гарнитуру и оставайтесь на связи со мной двадцать четыре часа в сутки."
1006215-86 = "[s] «Это уже немного чересчур...»"
1006215-87 = "...Почему? Вы, случайно, нашли кого-то другого?"
1006215-88 = "Наши отношения..."
1006215-90 = "...неужели для вас всё это было лишь игрой?!"
1006215-91 = "[s] «Токи, что это вообще значит?!»"
1006215-92 = "Прошу прощения, Сенсей. Это была шутка, призванная разрядить обстановку."
1006215-93 = "Точнее, реплика из дорамы."
1006215-94 = "Мои знания дорам и фильмов пока недостаточны, но я изо всех сил учусь."
1006215-95 = "Эту реплику мне удалось вспомнить."
1006215-96 = "В любом случае, сказать я хочу простую вещь."
1006215-97 = "Пожалуйста, примите её. И всегда будьте со мной."
1006215-98 = "Это всё, о чём я вас прошу."
1006215-99 = ""
1006215-102 = "[ns] «Я ценю твоё внимание... так что приму.»"
1006215-103 = ""
1006215-104 = ""
1006215-105 = "Спасибо, Сенсей."
1006215-106 = "[s] «Но не думаю, что смогу носить её круглые сутки.»"
1006215-107 = "Почему нет? Я разочарована. Нет, я покажу вам, насколько разочарована."
1006215-108 = "Смотрите, Сенсей. Видите, как опустились мои плечи? Требую, чтобы вы взяли на себя ответственность. Немедленно."
1006215-109 = "[s5] «Нет, дело в том... что эта вещь тебе дорога.»\n[s6] «Поэтому я хочу беречь её как можно лучше.»\n[s7] «Я воспользуюсь ею, когда наступит идеальный момент.»"
1006215-113 = "Понятно. Если причина в этом..."
1006215-114 = "Да. Такую логику я понимаю."
1006215-115 = "В любом случае, теперь у нас..."
1006215-116 = "...парная гарнитура."
1006215-117 = "[s] «Где ты вообще научилась таким выражениям, Токи...?»"
1006215-118 = "Из фильма."
1006215-119 = "[s] «Подбирай слова осторожнее. Так можно вызвать ненужные недоразумения...»"
1006215-120 = "Что вы имеете в виду? Я как раз хочу, чтобы окружающие неправильно поняли..."
1006215-121 = "[s] «Токи, пожалуйста. Алло? Токи...?»"
1006215-124 = "Токи ещё некоторое время осталась и развлекалась, пока наконец не удовлетворилась и не ушла."
1006215-125 = "...Я решил надёжно убрать гарнитуру Токи в ящик."
