[translation]
1601602-1 = "Съёмка фотобука"
1601602-5 = "Получив сообщение Минэ, я последовал её указаниям и отправился в фотостудию в Тринити."
1601602-6 = ""
1601602-14 = "[ns1] «Здесь, похоже, довольно оживлённо.»\n[ns2] «Они снимают фотобук... или что-то вроде того?»"
1601602-22 = ""
1601602-24 = ""
1601602-26 = ""
1601602-28 = ""
1601602-29 = "...О, здравствуйте, Сенсей."
1601602-30 = "Одну минуту."
1601602-31 = ""
1601602-33 = ""
1601602-34 = "Все! Сделаем короткий перерыв. Вернуться через десять минут!"
1601602-35 = "Все свободны!"
1601602-37 = "Есть, госпожа!"
1601602-38 = ""
1601602-43 = ""
1601602-44 = "*тяжело дышит* Спасибо, что так быстро откликнулись на мой вызов, Сенсей."
1601602-45 = "Да. Как видите, мы снимали фотобук."
1601602-46 = "Возможность надеть такой костюм выпадает крайне редко. Поэтому Рыцари исцеления провели внутреннее совещание, чтобы решить, как лучше всего воспользоваться этим событием."
1601602-47 = "В конце концов, эту возможность мне предоставили, чтобы улучшить общественный образ Рыцарей исцеления. В последнее время, по неизвестным причинам, вокруг нас постоянно возникают какие-то заблуждения."
1601602-48 = ""
1601602-51 = "[ns3] «(Как...?)»\n[ns4] «(Заблуждения...?)»"
1601602-54 = "Поэтому ради этой цели мы пытаемся подготовить фотобук со мной. Мы будем использовать его в материалах, продвигающих деятельность Рыцарей исцеления."
1601602-55 = "Следовательно, мне нужен ваш совет, как лучше повысить выразительность и эффективность снимков."
1601602-56 = "С вашей точки зрения, какие позы и ракурсы лучше всего будут—"
1601602-57 = ""
1601602-59 = ""
1601602-60 = "...? Что?"
1601602-61 = "Направление? Что вы имеете в виду?"
1601602-62 = "...А. Общая эстетика фотографий. Заданное направление."
1601602-63 = "[s5] «Именно. Например, что-нибудь утончённое или крутое...»\n[s6] «Можно отталкиваться от изначальной идеи и развивать её.»"
1601602-66 = "Хм. Понятно. До сих пор мы бесцельно блуждали в этом начинании."
1601602-67 = ""
1601602-69 = ""
1601602-70 = ""
1601602-71 = "Хм...? Но..."
1601602-72 = "Если подумать, это странно. Несмотря на отсутствие «концепции», мы уверенно продвигались вперёд без каких-либо сомнений."
1601602-73 = "Я принимала позы без должного намерения. Однако никто ничего не возражал."
1601602-74 = "Стоит спросить рыцарей, которые помогают нам со съёмкой? Возможно, у них уже было какое-то направление."
1601602-75 = ""
1601602-80 = ""
1601602-81 = "Вижу их там. Отлично. Давайте спросим."
1601602-82 = ""
1601602-84 = ""
1601602-85 = "Все. Возможно, это покажется внезапным, но у нас возникла проблема со съёмкой, которую необходимо решить."
1601602-86 = "До сих пор мы действовали довольно вольно, но теперь определим стиль фотографий, пока не стало слишком поздно что-либо менять."
1601602-87 = ""
1601602-89 = ""
1601602-90 = "А? Что вы имеете в виду?"
1601602-91 = "Мы же уже всё решили. Как бы мы иначе вообще проводили съёмку?"
1601602-92 = "Вы... не знали? Вы так идеально позировали, что мы решили, будто знали."
1601602-93 = ""
1601602-95 = ""
1601602-96 = "Простите? Концепция уже была определена? И... какая же?"
1601602-97 = "...Милота?"
1601602-98 = "Выбранным направлением была «милота»? Полагаю, костюм и правда милый..."
1601602-99 = "Ой, ну вот. Опять она за своё."
1601602-100 = "Мы ведь не фотобук костюма делаем! Вам стоит быть немного честнее с собой, особенно в такой особый день."
1601602-101 = "Почему вы стесняетесь и делаете вид, будто всё это время ничего не знали? Вы ведь явно позировали с учётом этой концепции, правда?"
1601602-102 = "Ч-Что? Меня сбивают с толку ваши реакции! В-Ваши лица..."
1601602-103 = ""
1601602-106 = ""
1601602-107 = "...Сенсей?! Почему и вы улыбаетесь?!"
1601602-108 = ""
1601602-110 = ""
1601602-111 = "Я сейчас совершенно не понимаю, что происходит. Объяснитесь!"
1601602-112 = ""
1601602-114 = ""
1601602-115 = "Хм?"
1601602-116 = "Та «милота», о которой все говорят..."
1601602-117 = ""
1601602-119 = ""
1601602-120 = "...это я?"
1601602-121 = "...Я?"
1601602-122 = "Не костюм... а... я?"
1601602-123 = "[ns7] «Милый не костюм, а ты в этом костюме.»\n[ns8] «Разве ты сама не говорила, что любишь милые вещи?»\n[ns9] «И так мило позировать, даже не осознавая этого...»"
1601602-124 = ""
1601602-125 = ""
1601602-126 = ""
1601602-128 = ""
1601602-129 = "...Э-э..."
1601602-130 = "...Э-э?! Э-Э-э...?!"
1601602-131 = "Э-Это... Это...!"
1601602-132 = "...Это...!"
1601602-135 = "― [log=미네 아이돌]Э-Это... Оно...[/log][wa:2000]"
1601602-137 = "― [log=미네 아이돌]Это совсем... не то, чего я ожидала...! [/log][wa:1600]"
1601602-140 = "― [log=미네 아이돌]Н-Нет![/log][wa:1100]"
1601602-142 = "― [log=미네 아이돌]Я-я вовсе не против этого или чего-то подобного...[/log][wa:240]"
1601602-145 = "― [log=미네 아이돌]О-Однако![/log][wa:610]"
1601602-147 = "― [log=미네 아이돌]Я вовсе не намекаю, что мне это нравится...![/log][wa:10]"
1601602-150 = "― [log=미네 아이돌]То есть это факт, что я ценю милые вещи... [/log][wa:2660]"
1601602-153 = "― [log=미네 아이돌]Но чтобы «милой» была я сама...[/log][wa:870]"
1601602-156 = "― [log=미네 아이돌]Я... Я хочу сказать...! Я не...[/log][wa:2150]"
1601602-158 = "― [log=미네 아이돌]...предполагала, что всё именно так...![/log][wa:10]"
1601602-161 = "[ns10] «Ты очень милая, так что не переживай!»\n[ns11] «Расслабься. Отличная же возможность!»"
1601602-162 = "― [log=미네 아이돌]В-Вы издеваетесь надо мной, Сенсей?[/log][wa:2330]"
1601602-163 = "― [log=미네 아이돌]В-Вы издеваетесь надо мной, Сенсей?[/log][wa:2330]"
1601602-165 = "― [log=미네 아이돌]Н-Не говорите таких вещей...![/log][wa:2280]"
1601602-168 = "― [log=미네 아이돌]Ч-Что... мне теперь делать...?![/log][wa:1220]"
1601602-171 = "Чем сильнее Минэ смущалась, тем восторженнее реагировали рыцари."
1601602-172 = "В итоге осознанное смущение Минэ даже сделало фотосессию ещё лучше."
1601602-173 = ""
1601602-175 = ""
1601602-176 = ""
1601602-177 = "Однако из-за яростных возражений Минэ фотобук так и не стали распространять, и он остался личным памятным альбомом рыцарей."
