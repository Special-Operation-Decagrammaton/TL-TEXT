[translation]
1301315-1 = "То, чего вы не помните"
1301315-2 = "Я отправился в библиотеку Красной Зимы."
1301315-4 = "О, вы пришли, Сенсей?"
1301315-5 = "Мне неловко беспокоить вас из-за такой мелочи..."
1301315-6 = "Хм? Даже мелочи могут быть важны? Ну, эм..."
1301315-7 = "[s] «Всё в порядке. Давай займёмся этим!»"
1301315-8 = "В-Вы уверены, Сенсей? Х-Хорошо, спасибо..."
1301315-9 = "Хм? Спрашиваете, что я ищу?"
1301315-10 = "..."
1301315-11 = "...!"
1301315-12 = "Я-Я-Я-Я... В общем, мне нужно найти...!"
1301315-13 = "Мой ограниченный комплект переиздания дебютной манги Луриэль..."
1301315-14 = "[s] «Это вообще-то совсем не мелочь, правда?!»"
1301315-15 = "Ну, для меня точно не мелочь, всё-таки я фанатка, но..."
1301315-16 = "...для кого-то другого это всего лишь комплект манги..."
1301315-17 = "Вы говорите, что именно поэтому это сокровище личное и незаменимое?"
1301315-18 = "...!"
1301315-19 = "Очень мило с вашей стороны так говорить. Спасибо, Сенсей."
1301315-20 = "Ну что, тогда попробуем найти его!"
1301315-22 = "И мы начали обыскивать каждый уголок библиотеки в поисках коллекции Момидзи."
1301315-23 = ""
1301315-27 = "И спустя некоторое время..."
1301315-29 = "[ns] «Хм!»"
1301315-31 = "[ns] «Момидзи, это оно?»"
1301315-32 = "Хм...?"
1301315-33 = "Д-Да! Это оно! Спасибо, Сенсей!"
1301315-34 = "Я уже боялась, что больше никогда его не увижу."
1301315-35 = "Потерять книгу среди других книг... Да какой из меня после этого библиотекарь?"
1301315-36 = "Хм? Спрашиваете, почему она выглядит такой новой, всё ещё в оригинальной упаковке?"
1301315-37 = "Я очень бережно её хранила. Спасибо, что заметили!"
1301315-38 = "Всё-таки это моя любимая коллекция!"
1301315-40 = "Похвалив навыки и аккуратность Момидзи как коллекционера, я заинтересовался и решил поискать эту коллекцию в интернете."
1301315-41 = "И вдруг...!"
1301315-43 = "[ns1] «Что?!»\n[ns2] «Момидзи, посмотри на это!»"
1301315-46 = "Что такое, Сенсей?"
1301315-47 = "Хм? Вы нашли рыночную цену этой коллекции? Давайте посмотрим..."
1301315-48 = "..."
1301315-49 = "*глубокий вдох*"
1301315-50 = "С-Сенсей? Сенсей...? Вы УВЕРЕНЫ, что это правильная цифра? Может, сайт взломали, или он сломался, или..."
1301315-51 = "[s] «Я проверил несколько раз и на разных сайтах. Цена именно такая.»"
1301315-52 = "Н-Ну, ограниченные первые издания иногда и правда могут стоить довольно дорого..."
1301315-53 = "...но всё равно, это...!"
1301315-54 = ""
1301315-56 = ""
1301315-58 = "(Мне больше не пришлось бы просить новые книги. Я могла бы покупать их сама!)"
1301315-59 = "(И заменить тот разваливающийся старый обогреватель.)"
1301315-60 = "(А может, даже построить пристройку, если удастся убедить Трудовую партию...)"
1301315-61 = "(О, и пудинг...)"
1301315-62 = "(После всего этого у меня, возможно, ещё и деньги останутся! Это... Это страшно!)"
1301315-63 = "[ns] «Момидзи?»"
1301315-64 = "Д-Да?!"
1301315-65 = "П-Простите, я... немного задумалась..."
1301315-66 = "..."
1301315-67 = "..."
1301315-68 = "...!!"
1301315-69 = "Ч-Что я вообще думаю? Я не могу расстаться со своей коллекционной вещью!"
1301315-70 = ""
1301315-71 = "[ns] «Понятно...»"
1301315-72 = "Точно..."
1301315-73 = "Это первое, на что я когда-либо специально копила деньги."
1301315-74 = "Конечно, тогда цена ещё не была такой безумной."
1301315-75 = "Поэтому я не могу относиться к ней просто как к инвестиции или товару."
1301315-76 = "В каком-то смысле она олицетворяет мою решимость."
1301315-77 = "И мою гордость коллекционера."
1301315-78 = "А главное, она воплощает мою веру в то, что некоторые вещи нельзя измерить материальной ценностью."
1301315-79 = "Это ведь... хорошее убеждение, правда?"
1301315-80 = "[s3] «Да, конечно.»\n[s4] «Иногда в жизни важно придерживаться такого убеждения.»"
1301315-83 = "Э-хе-хе. Спасибо, Сенсей. Мне нравится, как вы мыслите."
1301315-84 = "..."
1301315-85 = "..."
1301315-86 = "Ч-Что?! А теперь что не так?"
1301315-87 = "...Уа-а..."
1301315-88 = "Сенсей, кажется, я плохой коллекционер..."
1301315-89 = "Я уже решила, что не буду это продавать, но одна мысль всё равно не выходит из головы..."
1301315-90 = "«Сколько же пудинга можно было бы купить на эти деньги...?»"
1301315-91 = "[s5] «Я куплю тебе много пудинга!»\n[s6] «Сколько хочешь? Мм? Я угощаю.»"
1301315-94 = "П-Правда?!"
1301315-95 = "Спасибо, Сенсей! Вы лучший!!"
1301315-97 = "После этого мы с Момидзи весело перекусили вместе."
