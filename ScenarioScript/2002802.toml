[translation]
2002802-1 = "Тревожные чувства"
2002802-2 = "Я направился на пляж, где меня ждала Хината."
2002802-3 = ""
2002802-9 = "Я заметил её: она неловко стояла рядом с шезлонгом и раскрытым пляжным зонтом."
2002802-10 = ""
2002802-12 = ""
2002802-13 = ""
2002802-15 = "[ns1] «Хината? Всё в порядке?»\n[ns2] «Ты хорошо себя чувствуешь? Выглядишь неважно.»"
2002802-16 = ""
2002802-17 = ""
2002802-19 = ""
2002802-20 = "О-О! Сенсей!"
2002802-21 = "Спасибо, что пришли. Простите, что заставила вас волноваться из-за такой мелочи..."
2002802-22 = "...Хм? А это для чего?"
2002802-23 = "О, это..."
2002802-24 = ""
2002802-27 = ""
2002802-29 = "Так, это шезлонг, а... это пляжный зонт..."
2002802-30 = "Как видите, конечно же! А-а! Разумеется, вы и так знаете, что это! Простите!"
2002802-31 = "Но вы, наверное, не знаете, почему они здесь..."
2002802-32 = "Так... Как бы мне это объяснить... Ха-ха..."
2002802-33 = "Ну..."
2002802-34 = "У меня... нет хорошего ответа... Даже я сама немного не понимаю, чего именно пыталась добиться."
2002802-35 = "Я считала, что должна это сделать, но..."
2002802-36 = "[s3] «Можешь объяснить подробнее?»\n[s4] «Ты думала, что должна?»"
2002802-39 = "Пытаясь это объяснить, я только ещё больше запутываюсь..."
2002802-40 = "В Сестринстве у нас крайне редко бывает свободное время. Поэтому я поклялась себе, что здесь отпущу всё и позволю себе отдохнуть..."
2002802-41 = "Даже остальные Сёстры сказали: когда я помогаю с исследованием, нужно выкладываться полностью, но и когда приходит время восстанавливаться — тоже нужно отдыхать изо всех сил..."
2002802-42 = "Но у меня не получается. Как бы это сказать... Когда я пыталась лечь, меня всё время не покидало смутное чувство неловкости."
2002802-43 = "Будто, отдыхая и ничего не делая, я совершаю какой-то грех."
2002802-44 = "Ха-ха... ха... Наверное, мне просто не по себе от того, что я так сильно отклонилась от привычного распорядка."
2002802-45 = "Обычно я встаю ещё до рассвета, а потом у меня множество обязанностей."
2002802-46 = "К тому времени, как я заканчиваю, уже вечер, поэтому я помогаю Сёстрам прибраться."
2002802-47 = "...И сейчас все в Соборе делают именно это, верно? Занимаются своими обычными обязанностями... заканчивают день и убираются..."
2002802-48 = "Я переживаю, что кому-то пришлось взять на себя ещё и мою долю работы..."
2002802-49 = "..."
2002802-50 = "[s5] «Тебе неловко, потому что только ты отдыхаешь?»\n[s6] «Кажется, будто ты свалила свою работу на кого-то другого?»"
2002802-51 = ""
2002802-52 = ""
2002802-54 = ""
2002802-55 = "К-Конечно, я понимаю, что так думать неправильно."
2002802-56 = "Но всё же..."
2002802-57 = "Будто разум говорит мне одно, а чувства никак не хотят с ним соглашаться!"
2002802-58 = "А теперь я ещё и не смогу выполнить просьбу Сестёр как следует отдохнуть."
2002802-59 = ""
2002802-61 = ""
2002802-62 = "...Хм?"
2002802-63 = "Я вообще уже ложилась?"
2002802-64 = "Н-Не совсем. Я несколько раз пыталась, но мне становилось слишком неуютно."
2002802-65 = "Мне просто начать с того, чтобы лечь на шезлонг?"
2002802-66 = "Эм... Я не совсем понимаю, почему..."
2002802-67 = ""
2002802-69 = ""
2002802-70 = "Ах! Простите, Сенсей. Не мне ставить под сомнение методы учителя."
2002802-71 = "Как скажете. Я попробую лечь."
2002802-72 = ""
2002802-74 = ""
2002802-75 = "Так... сяду вот здесь, вытяну ноги..."
2002802-76 = ""
2002802-78 = ""
2002802-82 = "― [log=히나타 수영복]М-м-м... Хм...? Странно...[/log][wa:1850]"
2002802-85 = "― [log=히나타 수영복]Это...[/log]"
2002802-87 = "― [log=히나타 수영복]Вообще-то здесь довольно удобно...[/log][wa:340]"
2002802-90 = "― [log=히나타 수영복]Как раз достаточно тепло, и всё ещё дует приятный ветерок.[/log][wa:950]"
2002802-92 = "― [log=히나타 수영복]В тени солнце не бьёт в глаза.[/log][wa:10]"
2002802-95 = "― [log=히나타 수영복]Здесь довольно уютно...[/log]"
2002802-97 = "― [log=히나타 수영복]Кажется, я могла бы так и уснуть.[/log][wa:630]"
2002802-100 = "― [log=히나타 수영복]Но всё равно...[/log][wa:960]"
2002802-102 = "― [log=히나타 수영복]Ну, если лежу только я, а Сенсей не отдыхает...[/log][wa:360]"
2002802-105 = "― [log=히나타 수영복]Мне всё ещё кажется, будто я делаю что-то неправильное.[/log][wa:1070]"
2002802-108 = "[ns7] «Нет-нет. Не обращай на меня внимания.»\n[ns8] «Просто сосредоточься на своих ощущениях.»"
2002802-109 = "― [log=히나타 수영복]А, хорошо.[/log][wa:960]"
2002802-110 = "― [log=히나타 수영복]А, хорошо.[/log][wa:960]"
2002802-112 = "― [log=히나타 수영복]Тогда, как скажете... [/log][wa:840]"
2002802-115 = "― [log=히나타 수영복]Я отпущу всё и расслаблюсь.[/log][wa:1240]"
2002802-118 = "― [log=히나타 수영복]М-м... Хр-р... Хи-хи-хи...[/log][wa:5450]"
2002802-121 = "― [log=히나타 수영복]...А?! Ч-Что это было?![/log][wa:1120]"
2002802-124 = "― [log=히나타 수영복]П-Пожалуйста, забудьте это.[/log][wa:20]"
2002802-126 = "― [log=히나타 수영복]Умоляю, забудьте то, что только что услышали! Сенсей!![/log][wa:10]"
2002802-129 = ""
2002802-130 = "Сенсей, ну пожааалуйста!"
2002802-132 = "Понадобилось немного времени, чтобы её успокоить, а потом я помог устроить всё так, чтобы ей было проще расслабиться."
2002802-133 = "В конце концов Хината снова легла на шезлонг. Вскоре она уснула."
