34070-208 = "[ns] Выбросить обломки детонатора в мусорку."
34070-211 = "..."
34070-212 = "[s8] «Времени мало. Идём.»\n[s9] «Сначала найдём Мисаки и Хиёри.»"
34070-213 = "Ч-Что происходит...? А? Что...?"
34070-214 = "Ч-Что происходит...? А? Что...?"
34070-215 = "[s] Уйти."
34070-216 = "Сенсей! Да что с вами не так?!"
34070-218 = "П-Подождите...!"
