[translation]
34070-1 = "Episódio 7;Escolha e decisão"
34070-3 = "C-Como está o estado da Seia-sama...!?"
34070-4 = "Não adianta, as convulsões e o sangramento não param..."
34070-5 = "Entrem em contato com as Cavaleiras Socorristas com urgência...!! Pode ser a Irmandade ou qualquer outro lugar, só confirmem logo como devemos agir...!"
34070-6 = "E a Nagisa-sama?"
34070-7 = "Está a caminho do hospital agora! Também estamos entrando em contato com as outras pessoas, mas..."
34070-8 = "E a \"Schale\"?"
34070-9 = "Não conseguimos contato já faz um tempo! ...N-Não me diga que aconteceu alguma coisa com o Sensei também...!?"
34070-10 = "Não diga coisas de mau agouro, continue tentando o contato!"
34070-11 = "E a culpada?! É a Misono Mika?! Aquela bruxa!!"
34070-15 = "Esperem, por favor! A Mika-sama não fez nada..."
34070-16 = "Isso tudo não aconteceu justamente porque ela foi visitar o quarto da Seia-sama? É óbvio que aquela mulher fez alguma coisa!"
34070-21 = "Parem com isso! Brigar aqui e agora não vai...!?"
34070-22 = "Assassina! Sua bruxa maldita!!"
34070-27 = "Apareça!!"
34070-30 = "[ns] \"Saori...?\""
34070-31 = "..."
34070-40 = "..."
34070-41 = "[s1] \"...!?\"\n[s2] \"...\""
34070-42 = "...Sensei."
34070-43 = "...Sensei."
34070-44 = "A Atsuko... foi levada."
34070-45 = "As outras companheiras também sofreram um ataque de Arius e acabaram se espalhando... Não sei nem se estão vivas ou mortas..."
34070-46 = "Passei vários dias... fugindo desde então, mas..."
34070-47 = "Sozinha, eu não pude detê-la..."
34070-48 = "Se continuar assim... a Atsuko... a Princesa vai morrer..."
34070-49 = "Amanhã de manhã... ao raiar do dia, ela será morta por \"ela\"..."
34070-50 = "Você provavelmente não deve acreditar no que eu digo, mas... só isso é a mais pura verdade..."
34070-52 = "A Atsuko foi criada com esse propósito desde o princípio..."
34070-53 = "Desde pequena, o destino dela era ser oferecida assim como um \"sacrifício\"..."
34070-54 = "\"Ela\" disse..."
34070-55 = "Que, se eu quisesse mudar o destino da Princesa, deveria obedecer às ordens dela..."
34070-56 = "E que, se eu fizesse isso, ela pouparia não só a Princesa... mas também as minhas outras companheiras."
34070-57 = "Se tomássemos o Tratado do Éden à força, tornássemos o poder da Congregação de Justina propriedade de Arius — e tivéssemos Trinity e Gehenna na palma da mão..."
34070-58 = "A Atsuko não precisaria mais se tornar um \"sacrifício\"..."
34070-59 = "Mas..."
34070-61 = "Eu falhei..."
34070-62 = "O Esquadrão Arius... não conseguiu cumprir a missão."
34070-63 = "Além de falharmos em tomar o Tratado do Éden,"
34070-64 = "a conquista dos Distritos Autônomos de Trinity e de Gehenna,"
34070-65 = "salvar as minhas companheiras,"
34070-66 = "e até mesmo proteger a Atsuko,"
34070-67 = "tudo isso... ficou além das minhas forças, e eu não consegui realizar nada."
34070-68 = "...Agora não passo de uma fracassada. Não posso pedir ajuda a Trinity, nem a Gehenna — e muito menos à própria Arius."
34070-69 = "Por isso, a única pessoa a quem ainda posso recorrer é você, [USERNAME]-sensei..."
34070-70 = "Eu imploro..."
34070-71 = "...Prometo pela minha própria vida: obedecerei a qualquer instrução sua."
34070-72 = "...A \"bomba que destrói halos\", eu também a entrego a você. Não me importo que tenha a minha vida em suas mãos."
34070-73 = "Se julgar que não pode confiar em mim, pode usá-la... Por isso, eu imploro."
34070-74 = "..."
34070-75 = "Por favor... salve a Atsuko..."
34070-76 = "Salve... a Princesa..."
34070-80 = "Apareça!! Misono Mika! Sua criminosa da pior espécie! Tudo isso é culpa sua!"
34070-81 = "Por você ter entrado em contato com Arius..."
34070-82 = "O Sensei... está na mira do Esquadrão..."
34070-83 = "Porque você trouxe o Sensei para cá...!"
34070-84 = "Foi por minha causa... que as coisas acabaram assim, né..."
34070-85 = "...Por minha causa."
34070-86 = "Porque eu sou uma idiota, a Seia-chan... Eu não tinha sido perdoada coisa nenhuma..."
34070-87 = "...Eu achei que talvez ainda tivesse uma chance de me redimir."
34070-88 = "Que, quando esta noite passasse... amanhã de manhã, eu estaria com a Nagi-chan, a Seia-chan e o Sensei... todo mundo junto..."
34070-89 = "Era para ter sido assim... Então por que isso aconteceu...?"
34070-90 = "..."
34070-91 = "...Uma chance de me redimir, como se um conto de fadas desses pudesse existir... Que idiota. Tudo porque eu fui acreditar numa coisa dessas..."
34070-92 = "Como eu sou uma idiota, só servi para ser usada por Arius... pelo \"Esquadrão Arius\"... pela Saori..."
34070-93 = "E, por causa disso... acabei magoando e ferindo as pessoas importantes para mim... Desse jeito, é quase como se eu fosse..."
34070-94 = "Sua bruxa!!"
34070-95 = "..."
34070-96 = "Parem! Alguém traga o Comitê de Justiça aqui depressa!"
34070-100 = "...É mesmo. Então era isso..."
34070-108 = "..."
34070-109 = "...Ora, pensando bem, é uma coisa tão simples."
34070-110 = "...Joumae Saori, do \"Esquadrão Arius\"... Tudo isso..."
34070-114 = "Começou por culpa daquela mulher."
34070-115 = "Aquela mulher me usou — tentou destruir o halo da Seia-chan, disparou um míssil contra a Nagi-chan, feriu o Sensei..."
34070-116 = "Tudo... tudo, tudo, tudinho! Foi tudo planejado por aquela garota."
34070-117 = "...É verdade. Se é para tudo terminar assim... eu já sei bem o que devo fazer."
34070-118 = "Enquanto as pessoas importantes para mim estão passando por tudo isso, não é estranho que só a Joumae Saori continue vivendo em paz?"
34070-119 = "Uhum, isso. É isso mesmo — aquela mulher também..."
34070-120 = "Na mesma medida em que tudo foi tirado de mim, seria injusto se eu não tirasse o mesmo dela, não acha?"
34070-121 = "As pessoas importantes para aquela mulher também, do mesmíssimo jeito... tudo."
34070-127 = "Me solta! Apareça, Misono Mika!!"
34070-128 = "Não façam tumulto aqui! Ainda estamos verificando a situação..."
34070-135 = "Gah!?"
34070-136 = "O-O que foi isso...!? A parede... quebrou!?"
34070-138 = "Foi mal~★"
34070-139 = "Hã... onde é que estava a minha arma mesmo......"
34070-140 = "Era para lá? Bom, então vamos indo."
34070-144 = "A-A parede... com as mãos nuas...?"
34070-145 = "...M-Misono Mika... A Misono Mika..."
34070-146 = "A Misono Mika fugiu da prisão!!"
34070-152 = "..."
34070-153 = "[s] \"Levante-se, Saori.\""
34070-154 = "M-Mas..."
34070-155 = "[s] \"Quero conversar com você de igual para igual, Saori.\""
34070-156 = "..."
34070-158 = "..."
34070-159 = "[s] \"Deixe-me perguntar uma coisa primeiro. Quem é 'ela'?\""
34070-160 = "\"Ela\" é a representante do Distrito Autônomo de Arius e a senhora da Filial Arius. Nós a chamamos de \"ela\", mas as outras alunas também a chamam de \"Madame\"."
34070-161 = "Eu mesma só a vi poucas vezes... É uma adulta alta, de pele vermelha, vestida com um traje branco."
34070-162 = "Seu nome é Beatrice... A Princesa se encontrava com ela com muito mais frequência do que eu."
34070-163 = "[s] \"...O que houve com o resto do 'Esquadrão' agora?\""
34070-164 = "...Logo depois que a Princesa foi levada, sofremos um ataque... Como nos separamos naquele momento, não sei do paradeiro delas."
34070-165 = "Talvez ainda estejam sendo perseguidas pelas alunas de Arius."
34070-166 = "[s] \"Você sabe onde está a Atsuko agora que foi levada?\""
34070-167 = "Na Basílica de Arius — que fica no Distrito Autônomo de Arius. No subsolo de lá, existe um Santo dos Santos secreto preparado por \"ela\". Provavelmente está lá."
34070-168 = "[s] \"A Basílica de Arius... Por que levaram a Atsuko para lá...?\""
34070-169 = "Isso eu já não sei. Só sei que aquele lugar também foi preparado há tempos para a Princesa..."
34070-170 = "No entanto, a Princesa já dizia há algum tempo que, um dia, seria oferecida como \"sacrifício\" naquele lugar..."
34070-171 = "Ao que parece, \"ela\"... realizará o ritual amanhã, ao raiar do dia..."
34070-172 = "...Talvez já não reste quase nenhum tempo para a Princesa."
34070-173 = "[s] \"...Entendi. Já compreendi a situação no geral.\""
34070-175 = "[ns3] Estender a mão para a Saori.\n[ns4] Atender ao pedido da Saori.\n[ns5] Ajudar a Saori."
34070-176 = "..."
34070-177 = "..."
34070-178 = "..."
34070-179 = "...De... verdade?"
34070-180 = "Você vai mesmo... me ajudar...?"
34070-181 = "[s] \"Não posso ignorar o pedido de uma aluna, afinal.\""
34070-182 = "...Só por esse motivo? ...Não pode ser."
34070-183 = "V-Você esqueceu? Eu atirei em você!"
34070-184 = "Eu tentei tirar a sua vida, então como pode aceitar tão facilmente assim...? Não consigo entender... Por quê...?"
34070-185 = "[s] \"Mas a bomba está confiscada.\""
34070-186 = "...Ah, é verdade. Como prometido."
34070-192 = "Este é o detonador. Pode apertá-lo quando quiser."
34070-193 = "[s] \"...Não só o detonador, tudo. A bomba inteira está confiscada.\""
34070-194 = "A-A bomba também...?"
34070-195 = "...Entendi. Se é o que você está dizendo..."
34070-199 = "[ns] Receber a bomba."
34070-200 = "Mas pode ficar tranquilo. Sem esse detonador, ela jamais vai explodir."
34070-201 = "[s6] \"Que bom.\"\n[s7] \"Afinal, não posso fazer vista grossa para uma aluna portando um objeto perigoso.\""
34070-202 = "...?"
34070-203 = "...?"
34070-204 = "[ns] Quebrar o detonador."
34070-207 = "O-O que está fazendo...!?"
34070-208 = "[ns] Jogar os pedaços do detonador quebrado na lata de lixo."
34070-211 = "..."
34070-212 = "[s8] \"Vamos, não temos tempo. Precisamos nos apressar.\"\n[s9] \"Vamos nos juntar à Misaki e à Hiyori primeiro.\""
34070-213 = "Mas o que você...?"
34070-214 = "Mas o que você...?"
34070-215 = "[s] Partir."
34070-216 = "E-Espere um pouco, Sensei. Eu ainda não ouvi o motivo..."
34070-218 = "E-Espere...!!"
34070-226 = "Próximo;\"Esquadrão Arius\""
