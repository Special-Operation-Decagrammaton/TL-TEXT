[translation]
34070-1 = "Эпизод 7;Выборы и решения"
34070-2 = ""
34070-3 = "К-Как она?!"
34070-4 = "Плохо. Её постоянно сводит судорогами, и она кашляет кровью."
34070-5 = "Кто-нибудь немедленно свяжитесь с Рыцарями спасения! Или с Сестринством! Просто позовите хоть кого-нибудь!"
34070-6 = "А Нагиса?!"
34070-7 = "Она уже получила известие и едет в больницу! Я пытаюсь связаться и с другими, но..."
34070-8 = "Вы связались с Шале?!"
34070-9 = "Не могу дозвониться! Странно... Н-Неужели с Сенсеем что-то случилось?!"
34070-10 = "Не говори так! Просто продолжай звонить!"
34070-11 = "Кто это сделал? Наверняка та ведьма!"
34070-12 = ""
34070-15 = "Подождите! По показаниям Мика ничего не могла сделать!"
34070-16 = "Нет! Это произошло после того, как она вошла в комнату! Она виновата!"
34070-17 = ""
34070-21 = "Хватит! Это бессмысленно... Ах!"
34070-22 = "Убийца! Ты убийца!"
34070-23 = ""
34070-27 = "Выходи!"
34070-29 = ""
34070-30 = "[ns] «Саори...?»"
34070-31 = "..."
34070-32 = ""
34070-40 = "..."
34070-41 = "[s1] «...?!»\n[s2] «...»"
34070-42 = "...Сенсей."
34070-43 = "...Сенсей."
34070-44 = "Химэ... Они забрали Ацуко."
34070-45 = "А затем напали на нас... В бою нас разделили... Я не знаю, что с ними случилось."
34070-46 = "Я уже несколько дней... бегу от Ариуса..."
34070-47 = "Я оказалась совершенно бесполезной."
34070-48 = "Пожалуйста... Ацуко... Ацуко умрёт!"
34070-49 = "Завтра на рассвете её казнят!"
34070-50 = "Я не имею права просить вас мне верить... но умоляю..."
34070-52 = "Ацуко растили специально ради этого момента..."
34070-53 = "Подробностей я не знаю, но с самого рождения ей было предначертано умереть."
34070-54 = "Та женщина... Она сказала..."
34070-55 = "Я смогу изменить судьбу Химэ... если буду верно выполнять её приказы."
34070-56 = "Она сказала, что я смогу... спасти не только Химэ... но и остальных."
34070-57 = "Она дала мне обещание. Если я украду Эдемский договор и дам Ариусу силу Совета Святой Юстины... Если смогу захватить районы Тринити и Геенны..."
34070-58 = "Ацуко не придётся умирать."
34070-59 = "В итоге..."
34070-61 = "Я провалилась."
34070-62 = "Я подвела отряд Ариуса."
34070-63 = "Мы не смогли украсть Эдемский договор."
34070-64 = "Не смогли захватить районы Тринити и Геенны."
34070-65 = "Не смогли спасти товарищей."
34070-66 = "Я не смогла защитить Ацуко! Чёрт!"
34070-67 = "Я была бесполезна. Я провалилась."
34070-68 = "Мне не к кому обратиться. Тринити, Геенна и даже Ариус хотят моей крови."
34070-69 = "Я не знаю, кого ещё просить... Сенсей [USERNAME]... Больше никто её не спасёт."
34070-70 = "Пожалуйста..."
34070-71 = "Я сделаю что угодно. У меня всё ещё есть бомба, разрушающая нимбы. Я отдаю свою жизнь в ваши руки."
34070-72 = "Можете использовать её, чтобы убить меня."
34070-73 = "Если хоть немного заподозрите меня — убейте."
34070-74 = "..."
34070-75 = "Пожалуйста... помогите Ацуко..."
34070-76 = "Умоляю..."
34070-79 = ""
34070-80 = "Убийца! Выведите убийцу! Во всём виновата она!"
34070-81 = "Потому что ты связалась с Ариусом..."
34070-82 = "Отряд... пошёл за Сенсеем... и..."
34070-83 = "Это всё потому, что ты привела сюда Сенсея!"
34070-84 = "Это... моя вина?"
34070-85 = "Это всё из-за меня..."
34070-86 = "Сэя пострадала... потому что я глупая. Потому что совершила непростительные вещи."
34070-87 = "На один короткий миг... я подумала, что могу получить второй шанс... искупить вину."
34070-88 = "Пусть даже ради слушания, я хотела увидеть всех... Наги, Сэю и Сенсея..."
34070-89 = "Почему... Почему всё настолько сломано?"
34070-90 = "..."
34070-91 = "Я жила мечтой дурочки, думая, что у меня будет второй шанс."
34070-92 = "Настоящая дурочка... Ариус... отряд Ариуса... Джомаэ Саори лгала мне... и использовала меня..."
34070-93 = "А в итоге я ранила дорогих мне людей."
34070-94 = "Вытащите ведьму наружу!"
34070-95 = "..."
34070-96 = "Пусть Отряд правосудия зайдёт и выведет её!"
34070-97 = ""
34070-99 = ""
34070-100 = "Понятно. Теперь я понимаю..."
34070-101 = ""
34070-102 = ""
34070-107 = ""
34070-108 = "..."
34070-109 = "Я не видела этого до сих пор. Хм."
34070-110 = "...Джомаэ Саори из отряда Ариуса."
34070-111 = ""
34070-114 = "Во всём виновата она, верно?"
34070-115 = "Она лгала мне и пыталась убить Сэю. Она запускала ракеты в Наги и ранила Сенсея..."
34070-116 = "Всё, всё, всё... было её кознями."
34070-117 = "Теперь я всё прекрасно понимаю. Я знаю, что нужно сделать."
34070-118 = "Я должна заставить Джомаэ Саори ответить за свои поступки."
34070-119 = "Это справедливо."
34070-120 = "Я хочу, чтобы она почувствовала всю мою боль."
34070-121 = "Я заберу всё, что ей дорого. Пока у неё не останется ничего."
34070-122 = ""
34070-124 = ""
34070-125 = ""
34070-126 = ""
34070-127 = "Не пытайтесь меня остановить! Выходи, Мисоно Мика!"
34070-128 = "Пожалуйста! Сейчас не время!"
34070-129 = ""
34070-131 = ""
34070-132 = ""
34070-135 = "И-и-и!"
34070-136 = "С-Стена! Стена рухнула!"
34070-137 = ""
34070-138 = "Прошу прощения. ★"
34070-139 = "Так, а где там моя пушка?"
34070-140 = "Ой, глупенькая я. Вот же она! Хи-хи!"
34070-141 = ""
34070-143 = ""
34070-144 = "О-Она только что голыми руками сломала стену?"
34070-145 = "М-М-М-Мисоно...! М-Мика...!"
34070-146 = "Мисоно Мика сбежала!"
34070-147 = ""
34070-152 = "..."
34070-153 = "[s] «Вставай, Саори.»"
34070-154 = "Н-Но..."
34070-155 = "[s] «Моим студентам никогда не нужно передо мной стоять на коленях.»"
34070-156 = "..."
34070-157 = ""
34070-158 = "..."
34070-159 = "[s] «У меня вопрос. Кто эта „она“, которую ты постоянно упоминаешь?»"
34070-160 = "Представитель района Ариуса и владелица филиала Ариуса. Обычно мы зовём её Мадам."
34070-161 = "Я видела её всего несколько раз... но это высокая взрослая женщина с красной кожей... и в белом платье..."
34070-162 = "Её зовут Беатриче. Химэ чаще всего общалась именно с ней."
34070-163 = "[s] «Что случилось с Хиёри и Мисаки?»"
34070-164 = "После того как они забрали Химэ, на нас напали... и нас разделили. Мне не удалось их найти."
34070-165 = "Наверное, они всё ещё скрываются."
34070-166 = "[s] «Ты знаешь, куда она забрала Ацуко?»"
34070-167 = "В базилику Ариуса... в районе Ариуса. Там есть тайное святое место, которое она долго готовила к этому моменту. Ацуко должна быть там."
34070-168 = "[s] «Чем важна эта базилика?»"
34070-169 = "Не знаю, для чего она. Только знаю, что её очень давно готовили для Химэ."
34070-170 = "Химэ всегда говорила, что именно там встретит свой конец."
34070-171 = "Беатриче сказала, церемония будет завтра на рассвете."
34070-172 = "Пожалуйста, у Химэ почти не осталось времени."
34070-173 = "[s] «Хорошо. Спасибо за доклад.»"
34070-175 = "[ns3] Решить помочь Саори.\n[ns4] Принять решение помочь Саори.\n[ns5] Помочь Саори."
34070-176 = "..."
34070-177 = "..."
34070-178 = "..."
34070-179 = "Что?"
34070-180 = "Правда?! Вы решили помочь мне?"
34070-181 = "[s] «Разве не этого ты хотела?»"
34070-182 = "Д-Да... но... Я не ожидала, что вы..."
34070-183 = "Вы уже забыли? Я в вас стреляла!"
34070-184 = "Зачем помогать тому, кто прострелил вас?"
34070-185 = "[s] «По той же причине, по которой я конфискую эту бомбу. Чтобы ты была в безопасности.»"
34070-186 = "О... Эм... Хорошо."
34070-187 = ""
34070-189 = ""
