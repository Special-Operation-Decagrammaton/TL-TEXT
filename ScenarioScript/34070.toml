34070-194 = "В-Вы хотите, чтобы я сняла бомбу? Вашу страховку?"
34070-195 = "Я не понимаю, что вы задумали..."
34070-196 = ""
34070-198 = ""
34070-199 = "[ns] Забрать бомбу."
34070-200 = "Но не волнуйтесь. Без детонатора она не взорвётся."
34070-201 = "[s6] «Спасибо за информацию.»\n[s7] «Я не могу позволить студенту носить такую опасную вещь.»"
