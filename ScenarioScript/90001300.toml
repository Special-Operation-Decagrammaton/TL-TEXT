[translation]
90001300-1 = "Эпизод 30;Подготовка к отправлению"
90001300-2 = "Я вызову сюда транспортный корабль. Площадку пусковой установки контейнеров можно временно использовать как ангар."
90001300-3 = "Я почти закончила анализ уцелевших сооружений — точнее, того, что от них осталось. Как только закончу, сможем двигаться дальше."
90001300-4 = "Так что остаётся только..."
90001300-5 = "...работать быстрее. Намного быстрее."
90001300-6 = "Разве мы и так не двигаемся довольно быстро, Рио?"
90001300-7 = "Нужно ещё быстрее."
90001300-8 = "В идеале нам следует отправиться немедленно."
90001300-9 = "Это невозможно. Расчёт маршрута ещё не завершён."
90001300-10 = ""
90001300-11 = "[ns] «Мы... куда-то спешим?»"
90001300-12 = "Да. По многим причинам. Но прежде всего — из-за нашей первоначальной цели прибытия сюда."
90001300-13 = ""
90001300-15 = ""
90001300-16 = "Причина...? Ах, мы ведь искали чёрный ход, верно?"
90001300-17 = "Ах!"
90001300-19 = "Да. Мы пришли сюда, чтобы отследить транспортные маршруты к чёрному ходу и проникнуть за Многомерный барьер."
90001300-20 = "Тогда мы и столкнулись с Тиферет, которая, вероятно, управляет и перевозкой ресурсов, и хранилищем семян. Хотя мы заставили её отступить."
90001300-21 = "И отсюда возникает следующая проблема."
90001300-22 = "Что станет с чёрным ходом, используемым для перевозки ресурсов, когда Тиферет присоединится к Стальному континенту?"
90001300-23 = "...Если вспомнить, что случилось с Хокмой, дети говорили о «выполнении квоты ресурсов»."
90001300-25 = "Что думаете, Рио?"
90001300-26 = "Сразу изменить зону действия Многомерного барьера будет непросто."
90001300-27 = "Создать его, возможно, и трудно, но переопределить его параметры — почти невозможно."
90001300-28 = "Потребовалось бы начать с пересчёта инерциальной системы координат сразу в нескольких измерениях посредством различных калибровочных преобразований с учётом всех возможных переменных. Кроме того—"
90001300-29 = "А? Калибровочные преобразования...?"
90001300-30 = "А! Поняла! Как шкала HP! Да? Да?"
90001300-31 = "Нет, Момой. Калибровочное преобразование — это—"
90001300-33 = "Опуская научную тарабарщину... Рио, вы хотите отправиться прямо сейчас?"
90001300-34 = "И причина в том, что вы полагаете: чёрный ход неизбежно захлопнут?"
90001300-35 = "Да. Если совсем просто, ни один хозяин дома не оставит дверь открытой, поняв, что она не заперта."
90001300-36 = ""
90001300-38 = ""
90001300-39 = "[ns] «Сколько ещё до завершения расчёта маршрута...?»"
90001300-40 = "Если речь только об отправлении, это выполнимо. Но разве нам больше нечего учитывать?"
90001300-41 = "Что ты имеешь в виду?"
90001300-42 = "Что произойдёт, когда мы достигнем Стального континента? Транспортный корабль и всё остальное просто будут им поглощены."
90001300-43 = "...И я тоже."
90001300-44 = "А...!"
90001300-46 = "Да. Анализируя вместе с Кей оставшиеся руины, мы кое-что выяснили."
90001300-47 = "Президент сказала, что теперь лучше понимает, как Стальной континент преобразует материю."
90001300-48 = "Да. Как мы и предполагали, всё, включая транспортный корабль, будет поглощено Стальным континентом."
90001300-49 = "Неужели мы ничего не можем сделать, Химари? Мы ведь даже собрали группу и добрались сюда..."
90001300-50 = "Фуфу. Не отчаивайтесь. В конце концов, к вашим услугам хрупкая, но прекрасная супергениальная хакерша, любознательный аналитик и знаменитая девушка науки."
90001300-51 = "И Кей."
90001300-53 = "Спасибо, что хотя бы упомянули..."
90001300-54 = "Если кратко, нам нужно устройство, нейтрализующее волны, которые создают Стальной континент и пророки. Примерно так, но..."
90001300-55 = "Должна признать, что, хоть такое случается крайне редко, здесь даже я несколько растерялась."
90001300-56 = "И тут — о боже! Как такое возможно? Кей дала мне последний кусочек головоломки!"
90001300-57 = "Вау, невероятно! Как и ожидалось от Кей! Я всегда в тебя верила!"
90001300-58 = "Эм, ну, это... Просто если мы позволим Кивотосу погибнуть... Арис будет грустно..."
90001300-59 = "Я знаю, как это называется! Такое поведение зовётся «цундере»!"
90001300-60 = "Но одной цундере-черты в наши дни уже недостаточно! Я изо всех сил помогу тебе найти ещё одну прекрасную особенность, Кей!"
90001300-61 = "Я-я не понимаю всей этой ерунды про цундере. По-моему, я и так нормальная?!"
90001300-62 = "...В любом случае, так называемый «Феномен Стального континента» состоит из преобразования данных, их накопления и саморасширения."
90001300-63 = "И это временное название, но мы с Химари разработали чертёж Устройства перехвата волн."
90001300-64 = "Если изготовить достаточно таких устройств, закрепить их на нас и на транспортном корабле, а ещё спроектировать боевые костюмы..."
90001300-65 = ""
90001300-67 = ""
90001300-68 = ""
90001300-69 = ""
90001300-71 = "...Что? Что за самодовольные улыбки у всех на лицах? Вы СПЕЦИАЛЬНО пытаетесь меня разозлить...?"
90001300-72 = "Фуфу. Ну же, Кей."
90001300-73 = "Кажется, я тоже всё поняла!"
90001300-74 = "Да. Несмотря ни на что..."
90001300-75 = "Да! В итоге!"
90001300-76 = ""
90001300-77 = "[ns] «Кей-Кей такая добрая и хорошая девочка!»"
90001300-79 = "Определённо нет!"
90001300-81 = "...Тифи скоро прибудет..."
90001300-82 = "Бедная Тифи... Она так любила эти семена..."
90001300-83 = ""
90001300-87 = "Какого...?!"
90001300-88 = "Что такое, Эйн?"
90001300-89 = "Т-Тифи здесь нет...!"
90001300-90 = "Погоди, что ты имеешь в виду?!"
90001300-91 = "Н-Н-Ну... Именно то, что сказала! Через пусковой контейнер прибывают..."
90001300-92 = "...семена Тифи!"
90001300-93 = "!"
90001300-94 = "!!!"
90001300-95 = "Погодите, погодите. То есть Тиферет..."
90001300-96 = "...пожертвовала собой ради семян?!"
90001300-97 = "Почему...? Семена — само воплощение неопределённости!"
90001300-99 = "УААААА!"
90001300-100 = "..."
90001300-101 = "..."
90001300-102 = "Это... тоже было решением Тиферет?"
90001300-103 = "...Полагаю, нам следует смотреть на это именно так..."
90001300-105 = "Но...! Но Тифи всё это время страдала и трудилась. А... а что мы сделали для Тифи? Ничего!"
90001300-106 = "Мы, мы... Мы просто в итоге использовали Тифи... УВА-А-А-А!!"
90001300-107 = ""
90001300-109 = ""
90001300-110 = ""
90001300-111 = "Не плачь, Эйн. Всё хорошо, всё хорошо."
90001300-112 = "Н-Нет. Ничего не хорошо...!"
90001300-113 = "Ты права. Я понимаю, что ты чувствуешь. Поэтому, если тебе нужно кого-то обвинить, я здесь."
90001300-114 = "В конце концов, первопричина этой ситуации... я."
90001300-115 = "Н-Н-Н-Нет...! Соф, ты...!"
90001300-116 = "...Если рассуждать более рационально, мы можем возродить Тиферет здесь, на Стальном континенте. В конце концов, это именно такое место."
90001300-117 = "Хотя, полагаю, будет натяжкой утверждать, что это будет та же самая Тиферет."
90001300-118 = "...Да. Ведь мы так и не загрузили воспоминания Тиферет о времени, когда она была ИИ хранилища семян."
90001300-119 = "Да. Для нас память — это нечто вроде индивидуальной жизни."
90001300-120 = "Ва... Ува-а-а..."
90001300-121 = "..."
90001300-122 = ""
90001300-124 = ""
90001300-125 = "Я... в порядке. Соф. Спасибо. Теперь... я в порядке."
90001300-126 = "Ты уверена...?"
90001300-127 = "Да... Нельзя... вечно унывать. И что важнее..."
90001300-128 = "Тифи пожертвовала собой ради этих семян... Значит, мы должны почтить её жертву."
90001300-129 = "...!"
90001300-131 = "Соф, не взваливай на себя ответственность за желание спасти семена."
90001300-132 = "Тиферет приняла решение и с достоинством встретила его последствия."
90001300-133 = "«Поступай, как желаешь. Таков будет твой указ.»"
90001300-134 = "Ты говоришь о нашей Заповеди."
90001300-135 = "Да. Как сказала Эйн, наш долг — уважать волю Тиферет."
90001300-136 = "А теперь нам предстоит встретить врагов, которые пойдут по следу семян Тиферет."
90001300-137 = "...Да. Это гарантировано."
90001300-138 = "К-Когда это случится... те люди..."
90001300-139 = "Т-Те люди скоро встретятся с Йесодом, верно?"
90001300-140 = "Ну... Наверное."
90001300-141 = "В самом начале Йесод занял позицию снаружи Многомерного барьера."
90001300-142 = "Э-Это была просьба Йесода..."
90001300-143 = "Йесод — привратник Стального континента, символ его силы."
90001300-144 = "Но, Соф. Есть... пусть ничтожно малая... но всё же вероятность."
90001300-145 = "Не продолжай. Я знаю, о чём ты думаешь, но..."
90001300-146 = "...я даже не хочу рассматривать такой мрачный исход."
90001300-147 = "..."
90001300-148 = "Я-я... я хочу, чтобы Соф сказала это вслух..."
90001300-150 = "Эйн?!"
90001300-151 = "Эйн! Ты в порядке?! Соф и тебя по голове лупит?!"
90001300-152 = "Ты серьёзно думаешь, что я когда-нибудь стала бы так поступать с Эйн?!"
90001300-153 = "А меня ты постоянно бьёшь!"
90001300-154 = "Потому что ты это заслуживаешь!"
90001300-155 = "Бу-у-у... Ты всё продолжаешь полагаться на варварские методы... прибегать к насилию..."
90001300-157 = "У-Ува-а-а... Прости. Прости! Я даже не знаю, за что извиняюсь, но это всё моя вина...!"
90001300-158 = "В-В любом случае... К-Конечно, Йесод не проиграет, но всё же..."
90001300-159 = "Но всё же я хочу, чтобы Соф... сказала об этой части..."
90001300-160 = "Эхехе. Как ты сама раньше говорила, нам всегда следует учитывать худший вариант."
90001300-161 = "Я-я не о том, кто поступил правильно, а кто ошибся...! Просто..."
90001300-162 = ""
90001300-165 = "Понимаю. Вообще-то я тоже хотела бы это услышать. Соф?"
90001300-167 = "*вздыхает*"
90001300-168 = "Если, и только если, Йесод будет побеждён..."
90001300-169 = "Я отключу Многомерный барьер и перенаправлю его энергию системам Стального континента."
90001300-170 = "Вот как..."
90001300-171 = "Поддержание Многомерного барьера требует огромного количества энергии."
90001300-172 = "...Если расширение Стального континента и поглощение Кивотоса пойдут по плану, даже рассуждать об этом совершенно незачем."
90001300-173 = "Но на данный момент почти наверняка наши враги вторгнутся на Стальной континент."
90001300-174 = "Этим же врагам уже однажды удалось прорваться через Многомерный барьер."
90001300-175 = "Х-Хотя мы и не знаем, как именно они это сделали..."
90001300-176 = "Именно. Было бы наивно исключать такую возможность, если они уже продемонстрировали, что способны на это."
90001300-177 = "Но они никак не могут знать, как справиться с самим Стальным континентом. Они никогда не сталкивались ни с чем подобным."
90001300-178 = "...Хотя, если честно, даже мы ещё не раскрыли весь его потенциал."
90001300-179 = "В любом случае! Наш лучший шанс на победу — высвободить всю мощь Стального континента, а не продолжать поддерживать Многомерный барьер."
90001300-180 = "Поэтому, если случится невозможное и Йесод будет побеждён..."
90001300-181 = "...Да."
90001300-183 = "Стальной континент превратится в огромное поле боя."
90001300-184 = ""
90001300-186 = ""
90001300-187 = "..."
90001300-188 = "Не выйдем ли мы ненадолго наружу? Эйн, Соф, Ор."
90001300-189 = "А? З-Зачем тебе это?"
90001300-190 = "Такие моменты требуют подходящей обстановки, чтобы встретить их как следует. Вы не против?"
90001300-191 = "Д-Да. Если Старшая сестра хочет..."
90001300-194 = "О-Ого..."
90001300-195 = "В конце концов, мы и правда прошли очень долгий путь."
90001300-196 = "...Созерцание этой картины вызывает... неожиданные чувства."
90001300-197 = "Хи-хи. Все здесь. Кетер, Хокма и Бина."
90001300-198 = "Хесед, Гебура и... скоро Тиферет тоже. Смотрите. Похоже, Гебуре очень нравится лёд."
90001300-199 = "Нецах... Ну, мы и так видим один Нецах, так что пропустим его. Вон там Ход и Йесод..."
90001300-200 = "И Старшая сестра тоже."
90001300-201 = "..."
90001300-202 = "Старшая сестра..."
90001300-203 = "Почему ты хотела, чтобы мы вышли?"
90001300-205 = "У меня нет никакой великой причины."
90001300-206 = "Я лишь хотела, чтобы мои любимые младшие сёстры — Эйн, Соф и Ор..."
90001300-207 = "...взглянули на всё, чего им удалось достичь."
90001300-208 = "...!"
90001300-210 = "Эйн, Соф, Ор."
90001300-211 = "Вы не растратили дарованное вам время впустую."
90001300-212 = "Ваши достижения превзошли даже самые высокие ожидания. За это вы заслужили высочайшую похвалу. Именно это я хотела вам сказать."
90001300-213 = "Не тревожьтесь. Держите головы высоко."
90001300-215 = "Взгляните на свои достижения."
90001300-216 = "Эйн, Соф, Ор — вы прибыли."
90001300-217 = "Вы прибыли сюда, где обещание встретится с исполнением, как и повелевал наш господин."
90001300-218 = "«Готовьтесь. Тот День настанет, хотя вы и не ведаете когда.»"
90001300-219 = ""
90001300-221 = "Вы остались верны этим словам, смело и усердно готовясь к тому дню."
90001300-222 = "..."
90001300-223 = "Старшая сестра."
90001300-224 = "Что бы ни случилось..."
90001300-225 = "..."
90001300-226 = "Что бы мы ни сделали..."
90001300-227 = "Ты навсегда останешься рядом с нами?"
90001300-229 = "Разумеется. Клянусь."
90001300-230 = "Когда новое небо и новая земля раскинутся над этим континентом, а моё тело облачится в новый завет..."
90001300-231 = "Я всегда останусь рядом с Эйн, Соф и Ор."
90001300-232 = "Поэтому сейчас, мои драгоценные младшие сёстры, будьте спокойны."
90001300-233 = "Вам остаётся лишь наслаждаться плодами своего труда."
90001300-235 = "Готово. Мы закончили и установили Устройство перехвата волн на транспортный корабль."
90001300-236 = "Я также закончила анализ маршрута запуска. Что ждёт нас там — неизвестно... Но в любом случае нам остаётся только отправиться навстречу этому."
90001300-238 = "Эм, разве сейчас не должен произойти какой-нибудь... ивент с усилением?"
90001300-239 = "Да! Перед большим боссом нам нужны эндгейм-снаряжение, легендарный меч и снятие лимита!"
90001300-240 = "Ну... Я постараюсь закончить упомянутые боевые костюмы, пока мы будем в пути."
90001300-241 = "Поняла! Наша броня максимального уровня! Я очень жду её!"
90001300-243 = "Боевой костюм... Думаю, у меня есть несколько отличных идей для дизайна."
90001300-244 = "...!"
90001300-245 = "Нет, нет, НЕТ! Кхм... То есть я сама могу этим заняться!"
90001300-246 = "Пока я здесь, я не совершу ошибку, доверив дизайн столь важной вещи Рио!"
90001300-247 = "Ч-что?!"
90001300-248 = "Эм... Я тоже за. П-Потому что Мидори наш художник! Она очень хороша в таких вещах!"
90001300-249 = "Э-Это... бесспорный факт..."
90001300-251 = "Да. Я решительно и всем сердцем согласна с мнением Мидори."
90001300-252 = "Н-Но..."
90001300-254 = "Кхм!"
90001300-255 = "...Я понимаю... но если дизайн не будет выполнен максимально рационально, он может повлиять на характеристики..."
90001300-256 = "Не думаю, что здесь есть повод для беспокойства, Рио."
90001300-257 = "Я сыграла большую роль в дизайне Аби-Эшуха, и он идеален, разве нет?"
90001300-258 = "Вообще-то мы были сильно ограничены во времени, и, думаю, его ещё можно немного улучшить..."
90001300-259 = "Нет! Не-а! Дизайн идеален, как сказала Токи! Он завершён! И эти костюмы тоже будут идеальны!"
90001300-260 = "...Химари, что думаешь?"
90001300-262 = "..."
90001300-263 = "Мне несколько неловко озвучивать здесь свои истинные чувства, но..."
90001300-264 = "...разве самым рациональным решением не будет позволить специалистам заняться своей работой, Рио?"
90001300-265 = "Ты хочешь сказать... я... не специалист по дизайну...?"
90001300-266 = "..."
90001300-267 = "Нет. Не специалист."
90001300-268 = "Но зато ты суперспециалист в других областях."
90001300-269 = "Поэтому по сравнению с твоими настоящими областями экспертизы в дизайне ты всё-таки НЕ настолько специалист."
