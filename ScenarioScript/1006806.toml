[translation]
1006806-1 = "Пожелай спокойной ночи, Рейса"
1006806-2 = "Трущобы"
1006806-3 = "На всякий случай я отправился проверить маршрут патруля Рейсы."
1006806-4 = ""
1006806-7 = "Как она и говорила, вокруг не было ни души."
1006806-8 = ""
1006806-9 = ""
1006806-11 = "Хи-хи-хи... Ещё поесть? Я больше не могу... Хи..."
1006806-12 = ""
1006806-14 = ""
1006806-16 = ""
1006806-17 = "[ns1] Осторожно потрясти её за плечо.\n[ns2] «Ты можешь простудиться, если будешь спать в таком месте.»"
1006806-20 = "Хи-хи-хи... Сенсей тоже пришёл на вечеринку..."
1006806-21 = "Сенсей..."
1006806-22 = "...Сенсей?"
1006806-23 = "А?"
1006806-24 = "А-а-а!"
1006806-25 = "С-Сенсей? А? Что? Что вы здесь делаете?"
1006806-26 = "Вы пришли... потому что подумали, что я буду одна? Но... я почти всегда патрулирую одна?"
1006806-27 = "Н-Нет, я просто хочу сказать... Вам правда незачем здесь быть! Здесь никогда ничего не происходит. Я просто нахожусь тут на всякий случай!"
1006806-28 = "[s3] «Я тоже просто перестраховываюсь.»\n[s4] «Не обращай на меня внимания. Я просто побуду рядом.»"
1006806-31 = "П-Правда? Хм... Звучит странно, но, наверное..."
1006806-32 = "Что? Нет, я не так уж часто этим занимаюсь..."
1006806-33 = "Подождите! Не отвлекайте меня! Вам слишком холодно торчать здесь, Сенсей. Возвращайтесь!"
1006806-34 = "[s5] «Не хочу.»\n[s6] «Я подготовился к холоду.»"
1006806-37 = "В-Вы ведёте себя так, будто мы в походе или типа того..."
1006806-38 = "Хм... если нас двое, мы сможем не давать друг другу уснуть? Эм..."
1006806-39 = "Ну, в этом есть смысл... Но всё же..."
1006806-40 = ""
1006806-42 = ""
1006806-43 = "Я-я не знаю..."
1006806-44 = "Наверное, ничего страшного? Тогда... приступим!"
1006806-46 = "Мы с Рейсой патрулировали вместе и не давали друг другу уснуть."
1006806-47 = "Как Рейса и ожидала, никаких происшествий или инцидентов, в которые пришлось бы вмешиваться, не случилось. В предрассветном свете мы спокойно отправились обратно."
1006806-49 = ""
1006806-52 = ""
1006806-53 = ""
1006806-54 = "Ничего не произошло. Хи-хи. Я же говорила, Сенсей."
1006806-55 = "А? Нет! С чего мне расстраиваться? Ха-ха, это же замечательно!"
1006806-56 = "Каждый день должен быть таким, чтобы в группах вроде Патрульной команды вообще не было необходимости."
1006806-57 = "...Один человек, которым я восхищаюсь, постоянно говорит что-то в таком духе!"
1006806-58 = "После бессонной ночи я немного сонная, но..."
1006806-59 = "Хи... Хи-хи..."
1006806-60 = ""
1006806-62 = ""
1006806-65 = "[ns7] Поддержать Рейсу, чтобы она не упала.\n[ns8] «Тебе ещё нельзя засыпать, Рейса.»"
1006806-69 = "А! Простите! Простите! Что я творю? Нельзя отлынивать у вас на глазах!"
1006806-70 = "Но погодите, вы выглядите совершенно нормально! Как у вас это получается? Вы разве не устали?"
1006806-71 = "Хм... Вы всегда нормально держитесь примерно сутки? Ну, это хорошо, но... Вы вообще не должны знать такое на собственном опыте! Что у вас за образ жизни такой?"
1006806-72 = "...О."
1006806-73 = "[ns9] «...Рейса?»\n[ns10] «Что такое?»"
1006806-76 = ""
1006806-78 = ""
1006806-79 = "Смотрите, Сенсей!"
1006806-80 = ""
1006806-82 = ""
1006806-84 = "Солнце восходит."
1006806-87 = "― Это немного странно. Это...[wa:5220]"
1006806-89 = "― Впервые я встречаю рассвет вместе с кем-то...[wa:1860]"
1006806-92 = "― Возможно, это даже...[wa:3820]"
1006806-94 = "― Самое долгое время, которое я когда-либо проводила с кем-то ещё... ха-ха.[wa:3960]"
1006806-97 = "― Эм...[wa:200]"
1006806-99 = "― Я опять сказала что-то странное?[wa:1160]"
1006806-102 = "― Я всё ещё немного сонная...[wa:1530]"
1006806-104 = "― Наверное, я просто несу всякую ерунду.[wa:3000]"
1006806-107 = "― Но даже так вы всегда, кажется, понимаете меня, Сенсей.[wa:2120]"
1006806-110 = "― Поэтому, эм...[wa:580]"
1006806-112 = "― Пожалуйста, поймите меня и в этот раз. Хи-хи.[wa:3000]"
1006806-115 = "― М-м... Как приятно...[wa:1680]"
1006806-118 = "― Сенсей... Спасибо... Хи-хи...[wa:4380]"
1006806-122 = "М-м... Сенсей..."
1006806-124 = "Я донёс уснувшую Рейсу до Шале на спине."
1006806-125 = "Я уложил её поспать в гостиной, а когда она проснулась, отправил домой."
