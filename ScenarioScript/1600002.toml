[translation]
1600002-1 = "Не тот номер"
1600002-3 = "Вот вы где. Спасибо, что пришли. Итак, бомбу я установила здесь..."
1600002-4 = "Но я переживаю, что она маловата. Хотела узнать ваше мнение."
1600002-5 = "...?"
1600002-6 = "[s] «...?»"
1600002-7 = "Сенсей?"
1600002-8 = "[s] «Харука»."
1600002-9 = "...?"
1600002-10 = "С-с-с-Сенсей?! Что вы здесь делаете...?"
1600002-11 = "Ч-что? Это я попросила вас прийти?"
1600002-12 = "Сообщение...?"
1600002-13 = "..."
1600002-14 = "..."
1600002-15 = "Я-я-я совершила огромную ошибку! Ужасную ошибку!"
1600002-16 = "Э-это сообщение было не вам."
1600002-17 = "Колоссальная ошибка! Что делать что делать что делать?!"
1600002-18 = "Из-за моей ошибки вы тратите драгоценное время на такого человека, как я."
1600002-19 = "Простите. Мне так, так жаль."
1600002-20 = "Простите простите простите простите простите..."
1600002-21 = "...?"
1600002-22 = "Вы... не против? Просто хотите знать, чем я занималась?"
1600002-23 = "Я-я..."
1600002-24 = "..."
1600002-25 = "Б-бомбы..."
1600002-26 = "Я тайно устанавливала бомбы."
1600002-27 = "[s] «Бомбы»."
1600002-28 = "Это для заказа, который мы взяли. Есть один человек... которому завтра нужно уйти пораньше."
1600002-29 = "Поскольку цель проходит здесь... я собиралась взорвать их, когда она будет проходить мимо."
1600002-30 = "Так цель точно уйдёт пораньше... и навсегда..."
1600002-31 = "Кто приказал мне установить бомбы? Н-никто..."
1600002-32 = "Э-это была... моя идея."
1600002-33 = "П-поэтому я хотела убедиться, что всё делаю правильно, но по ошибке отправила сообщение вам!"
1600002-34 = "Ещё раз простите. Простите, простите..."
1600002-35 = "Вы правда... не против?"
1600002-36 = "О-о. Вы имели в виду, что не против, если я вам пишу. Понятно..."
1600002-37 = "Мне... нужно убрать все бомбы, да?"
1600002-38 = "Д-да, Сенсей! Как скажете..."
1600002-40 = "(Мы собрали больше десяти бомб, которые установила Харука.)"
1600002-42 = "Готово... Жалко, что вся эта работа оказалась зря."
1600002-43 = "Установила ли я бомбы ещё где-нибудь? Д-да, конечно. Нужно было гарантировать, что цель покинет бренный мир пораньше..."
1600002-44 = "В-вы хотите сказать, что не нужно было заходить так далеко? Хотите узнать, где остальные бомбы, да?"
1600002-45 = "Эм... Подвал, фитнес-клуб, парк..."
1600002-46 = "Мне правда нужно обезвредить их все? Ладно... Поняла."
1600002-47 = "П-погодите, я сама справлюсь! Честно! Н-не нужно тратить силы, сопровождая такого человека, как я!"
1600002-48 = "[s1] «Я иду с тобой, потому что хочу.»\n[s2] «Ты не хочешь быть рядом со мной?»"
1600002-49 = "...?!"
1600002-50 = "Но зачем вам хотеть идти со мной...?"
1600002-51 = "Н-нет, я просто...! Я не это хотела сказать!"
1600002-52 = "Вы правда не против...? Даже будете настаивать?"
1600002-53 = "Н-ну... Если вы так говорите."
1600002-54 = "Т-тогда нам пора."
1600002-56 = "И ещё одна возле этого столба. Вот. Теперь обезврежена..."
1600002-57 = "[s] «Хорошая работа»."
1600002-58 = "Я-я не сделала ничего особенного."
1600002-59 = "...!"
1600002-60 = ""
1600002-61 = ""
1600002-62 = "(Харука тут же пошла впереди, почти будто пыталась убежать.)"
1600002-64 = "Здесь тоже."
1600002-65 = "Какая жалость. Если бы она взорвалась здесь, цель точно бы не пережила..."
1600002-66 = "А? Н-ничего. Просто разговаривала сама с собой."
1600002-67 = "[s] «Идём дальше»."
1600002-68 = "Д-да, Сенсей."
1600002-70 = "Это все бомбы, которые были установлены здесь."
1600002-71 = "В-вы наверняка думаете, что я зря трачу ваше время, да, Сенсей?"
1600002-72 = "Такое разочарование, как я, заставляет вас не спать и работать до рассвета..."
1600002-73 = "Простите... за все проблемы, которые я создаю."
1600002-74 = "Я просто хотела впечатлить всех и заставить их полюбить меня."
1600002-75 = "[s3] «Но мне всё равно было по-своему весело.»\n[s4] «Я считаю это приятной ночной прогулкой.»"
1600002-76 = "Ч-что вы имеете в виду...?"
1600002-77 = "Ч-что вы имеете в виду...?"
1600002-78 = "Вам не нужно говорить такое ради меня..."
1600002-79 = "Мне не стоит так сильно себя ругать?"
1600002-80 = "Думаете, мне не нужно делать подобное, чтобы меня любили?"
1600002-81 = "Н-не может быть! Люди бы меня не любили, если бы я не...!"
1600002-82 = "Я-я никогда не стану спорить с вами, Сенсей, я просто...!"
1600002-83 = "П-просто я...!"
1600002-84 = "Никто раньше мне такого не говорил!"
1600002-85 = "..."
1600002-86 = "Хех..."
1600002-87 = "Спасибо, Сенсей... Вы правда очень добрый человек."
1600002-88 = "Удивительно, что вы вообще хотите проводить время с таким человеком, как я, и давать мне советы."
1600002-89 = "Так что спасибо. Правда."
1600002-90 = "Если это ради вас, Сенсей..."
1600002-91 = "...тогда я могу..."
1600002-92 = ""
1600002-93 = "Я могу убрать всё, что встанет у нас на пути."
1600002-94 = "[s] «...?»"
1600002-95 = "Хе-хе... Ха-ха-ха..."
1600002-97 = "(Несколько раз подряд поклонившись, Харука исчезла с загадочной улыбкой.)"
