[translation]
10015075-1 = "Эпилог;Рассвет спортивного фестиваля"
10015075-2 = ""
10015075-7 = "Угх... А-а-ах..."
10015075-8 = "Только не тот робот... Нет... На спортивном фестивале нет соревнования «стрельба противотанковыми ракетами»..."
10015075-9 = "Дорогие арендованные машины... требования о возмещении ущерба от других школ..."
10015075-11 = "Мы обанкротимся! Мои бухгалтерские книги!"
10015075-12 = ""
10015075-15 = ""
10015075-16 = "А-а? Это был всего лишь сон?"
10015075-17 = "Фух, слава богу. Давно мне не снился такой ужасный кошмар."
10015075-18 = "Студенты Кивотоса могут быть эксцентричными, но уж точно не станут бездумно стрелять противотанковыми ракетами или взрывать бомбы вместо фейерверков."
10015075-19 = "Секунду... Почему на улице так светло? ...К-который час?!"
10015075-20 = "СЕМЬ? УТРА?!"
10015075-21 = "Мне конец! Всё пропало! Где мой список? До церемонии открытия ещё столько всего надо сделать!"
10015075-22 = "С чего начать? Где моя форма? Нет, подождите, сначала надо отправить официальное письмо!"
10015075-23 = ""
10015075-25 = ""
10015075-32 = "Н-Ноа! Ноа, я уснула, прости меня."
10015075-33 = "Тс-с, Юука. Всё в порядке."
10015075-34 = "...Что?"
10015075-35 = "Давайте говорить потише. Дети только что уснули."
10015075-36 = "О... П-прости..."
10015075-39 = "Хи-хи... Спортивный фестиваль — мой холст, и я его раскрашу..."
10015075-40 = "Н-нет, Сенсей... Даже если это вы просите... Я не стану делать купальник для чирлидинга... Не стану."
10015075-41 = "Видите ли... Фестиваль ореолов зародился много лет назад... Всё началось с Морской академии «Одиссея»... А потом в программу добавили спортивные соревнования, чтобы развивать физическую силу..."
10015075-42 = "Глаз... дёргается... Нужно больше... энергетиков... ещё..."
10015075-44 = "Ха-ха. Какие милые. Они правда выложились по полной, работая всю ночь."
10015075-45 = "Я ничего не понимаю. Что здесь происходит?"
10015075-46 = ""
10015075-48 = ""
10015075-49 = ""
10015075-50 = "Вот список инвентаря и все заявки, которые мы обработали от других школ. «Веритас» помогли мне всё организовать."
10015075-51 = "Это сделали «Веритас»? Они сотрудничали с «Семинаром»?"
10015075-52 = "Именно. Мы также восстановили все повреждённые объекты и вернули украденное спортивное оборудование."
10015075-53 = "С роботом-болельщиком... всё ещё есть некоторые трудности, но, надеюсь, ты поймёшь."
10015075-55 = "Подожди, а расходы на ремонт и выплаты по претензиям уже обработаны?"
10015075-56 = "Я ведь должна была всё это сделать. Что ты—"
10015075-57 = "*зевает* Что ж, думаю, пойду посплю. Я очень устала."
10015075-58 = "Вернусь, когда немного отдохну. Осталось ещё несколько дел, если ты не против."
10015075-59 = ""
10015075-60 = "П-подожди. Ноа!"
10015075-61 = ""
10015075-66 = ""
10015075-68 = "[ns] «Как спалось, Юука?»"
10015075-69 = "О... [USERNAME]-сенсей."
10015075-70 = "Спала нормально, но... Мне так стыдно. Не могу поверить, что я спала, когда оставалось столько работы."
10015075-71 = "Обычно я не настолько безответственная. Даже не знаю, что сказать."
10015075-72 = "[s1] «Всё хорошо, главное, что ты отдохнула.» \n[s2] «Ты достаточно отдохнула?»"
10015075-75 = "Не помню, когда в последний раз так спала всю ночь, поэтому чувствую себя очень бодрой."
10015075-76 = "Но ценой отдыха стали мои товарищи. Я спокойно спала, пока они работали всю ночь."
10015075-77 = "Они должны были меня разбудить. Я не хотела, чтобы они так себя загоняли."
10015075-78 = "Если они настолько вымотаны, то не смогут насладиться фестивалем."
10015075-79 = "[s] «Может, они все думали то же самое.»"
10015075-80 = "Что ты имеешь в виду?"
10015075-81 = "[s3] «Фестиваль Хало очень важен для всех, и никто не работал усерднее тебя.»\n[s4] «Может, все хотели, чтобы ты смогла насладиться плодами своего труда.»"
10015075-84 = ""
10015075-86 = ""
10015075-87 = "Я всё равно могла бы насладиться им, не заставляя их работать до изнеможения!"
10015075-89 = "Ну... Наверное, это не совсем правда."
10015075-90 = ""
10015075-94 = "Вы правы. Если бы я пыталась закончить весь список одна, уснула бы сразу после церемонии открытия."
10015075-95 = "...Они действительно обо мне заботились. Я всем им за это должна."
10015075-97 = "Значит, теперь мне нужно быть ещё внимательнее."
10015075-98 = "Уверена, во время фестиваля возникнет ещё немало происшествий."
10015075-99 = "Как член руководства «Миллениума», я не позволю их труду пропасть зря. Использую всю восстановленную энергию и прослежу, чтобы дальше всё шло гладко."
10015075-100 = "[s5] «Отличная идея. Это так на тебя похоже.»\n[s6] «Только не перенапрягайся.»"
10015075-103 = "И вы тоже следите, чтобы не перерабатывать, Сенсей."
10015075-104 = "Вы ведь всю ночь не спали вместе со студентами, верно?"
10015075-105 = "Времени осталось немного, но перед церемонией открытия хотя бы ненадолго прикройте глаза."
10015075-106 = ""
10015075-108 = ""
10015075-109 = ""
10015075-110 = "Когда я сказала, что всем должна, я имела в виду и вас."
10015075-111 = "Так что пообещайте мне, хорошо? Дальше я справлюсь сама."
10015075-123 = "Оставшаяся подготовка к спортивному фестивалю прошла гладко благодаря отдохнувшей Юке, и церемония открытия состоялась без происшествий."
10015075-124 = "Ну, почти без происшествий. Несколько студентов взбунтовались, когда объявили, что в программу добавили новые соревнования."
10015075-125 = ""
10015075-130 = "Представители участников, пожалуйста, поднимитесь на стадион, чтобы зачитать клятву спортивного фестиваля."
10015075-131 = ""
10015075-132 = "Представителями участников Фестиваля Хало в Кивотосе выступают Окусора Аяне из старшей школы «Абидос» и..."
10015075-133 = ""
10015075-134 = ""
10015075-137 = ""
10015075-139 = "Урава Ханако из объединённой школы «Тринити»."
10015075-140 = ""
10015075-143 = ""
10015075-144 = ""
10015075-145 = ""
10015075-147 = "В целом церемония открытия прошла гладко как по маслу по сравнению с суматохой, которая началась затем во время соревнований."
