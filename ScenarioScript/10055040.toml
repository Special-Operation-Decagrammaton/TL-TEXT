[translation]
10055040-1 = "Эпизод 4;Корабль-призрак"
10055040-2 = ""
10055040-3 = "...Итак, если я правильно поняла, этот огромный корабль внезапно появился из тумана?"
10055040-4 = "Это точь-в-точь тот корабль-призрак из слухов..."
10055040-5 = "Обычно я была бы в восторге. Паранормальное расследование! Сенсация всей жизни! Но, э-э-эм..."
10055040-6 = "Такому кораблю место в музее или на обложке книги, а не в океане."
10055040-7 = ""
10055040-9 = ""
10055040-10 = ""
10055040-11 = "Ибуки знает! Это называется «галеон»!"
10055040-12 = "Ибуки читала про такие! На них плавают, гребя вёслами!"
10055040-13 = "Не-а! Это галеры! Они тоже военные корабли, но гора-а-аздо древнее."
10055040-14 = "Ой! Хотела блеснуть знаниями, а сама села в лужу. Только не выкладывайте это! А-ха-ха!"
10055040-15 = "Не стоит стесняться. И галеры, и галеоны вышли из употребления очень давно."
10055040-16 = "Давно? Но тогда..."
10055040-17 = "Да, это и есть главная загадка. Кораблям такого типа неоткуда взяться в водах Кивотоса."
10055040-18 = "И всё же он перед нами."
10055040-19 = "Это почти как..."
10055040-20 = ""
10055040-22 = ""
10055040-23 = ""
10055040-24 = "...Понятно. Значит, вот какая правда скрывается за легендой о корабле-призраке."
10055040-25 = ""
10055040-27 = ""
10055040-28 = "Отлично. Я решила."
10055040-29 = "Мы захватим этот корабль и доплывём на нём до берега."
10055040-30 = ""
10055040-32 = ""
10055040-33 = "...А?"
10055040-34 = "П-постой, Макото! Ты... Ты же не всерьёз?!"
10055040-35 = "Не понимаю твоего вопроса."
10055040-36 = "Это же корабль-призрак, ПРИЗРАК! На нём могут быть привидения!"
10055040-37 = "Не ожидала от тебя таких глупостей, Сацуки. Привидений не существует."
10055040-38 = "Для такого большого корабля нужна многочисленная команда. Если бы в него что-то врезалось, кто-нибудь обязательно вышел бы посмотреть."
10055040-39 = "Раз никто не появился, скорее всего, он заброшен. Люди видели, как он дрейфует, а потом нафантазировали всяких небылиц о призраках."
10055040-40 = "Очень... разумное объяснение! Ты кто такая и куда дела настоящую Макото?!"
10055040-41 = "И всё же..."
10055040-42 = "Если так боишься, можешь не идти."
10055040-43 = "...Хм?"
10055040-44 = "Я так и сказала. Хочешь остаться на этой лодке — оставайся."
10055040-45 = "А кто хочет идти со мной, следуйте за мной. Я поведу."
10055040-46 = ""
10055040-48 = ""
10055040-49 = "Макото, подожди! Одной идти опасно!"
10055040-50 = ""
10055040-52 = ""
10055040-53 = "..."
10055040-54 = "Макото кажется какой-то странной..."
10055040-55 = "Хм, ну посмотрим. Эгоистка? Есть. Безрассудная? Есть. По-моему, обычная Макото."
10055040-56 = "Нет, нет. Не в этом дело."
10055040-57 = "Макото боится боли и всяких жутких вещей не меньше меня. С каких это пор она первой бросается на корабль, от одного вида которого мурашки по коже?!"
10055040-58 = "Если подумать... Обычно она отправила бы меня вперёд."
10055040-59 = "...У меня плохое предчувствие."
10055040-60 = "Словно в ней что-то переключилось, когда появился этот корабль."
10055040-61 = "Может, в неё... кто-то вселился? Или на неё как-то воздействуют?"
10055040-62 = ""
10055040-64 = ""
10055040-65 = ""
10055040-66 = "Ибуки тоже пойдёт!"
10055040-67 = "А? Это слишком опасно."
10055040-68 = "Ибуки понимает, что происходит. Мы ведь... дрейфуем? Ибуки правильно сказала?"
10055040-69 = "Поэтому вы так сердитесь на Макото."
10055040-70 = "Ибуки, откуда ты узнала...?"
10055040-71 = "Ибуки хочет помочь своим друзьям!"
10055040-72 = "Ибуки тоже полноправный член Общества Пандемониум, как и вы!"
10055040-73 = ""
10055040-75 = ""
10055040-76 = ""
10055040-77 = "Ибуки..."
10055040-78 = "...Ладно. Но ни на шаг от меня не отходи, хорошо?"
10055040-79 = "Что?! Ты тоже идёшь?!"
10055040-80 = "А. Ну да, иду. П-потому что волнуюсь за Чиаки."
10055040-81 = "И вы собираетесь оставить меня здесь одну?"
10055040-82 = "Просто останься и присмотри за лодкой."
10055040-83 = "...Ух!"
10055040-84 = ""
10055040-86 = ""
10055040-87 = "..."
10055040-88 = "Я не пытаюсь на тебя давить. Можешь не идти."
10055040-89 = "Подожди! Я ещё думаю!"
10055040-90 = ""
10055040-92 = ""
10055040-93 = "...Я тоже иду."
10055040-94 = "Что? Правда? Ты уверена?"
10055040-95 = "«Уверена ли я»?! Конечно! Кто в здравом уме останется тут один, рядом с кораблём-призраком?! Уж точно не я!"
10055040-96 = "По-моему, всё не настолько страшно..."
10055040-97 = "Сацуки! Возьми Ибуки за руку!"
10055040-98 = ""
10055040-100 = ""
10055040-101 = ""
10055040-102 = ""
10055040-103 = "Если мы будем крепко-крепко держаться за руки и не отпускать друг друга, бояться будет нечего!"
10055040-104 = "Ибуки..."
10055040-105 = ""
10055040-107 = ""
10055040-108 = "Фух... Л-ладно. Я готова. Привидения или кто там ещё, выходите!"
10055040-109 = "Некому выходить, потому что привидений не существует."
10055040-110 = "..."
10055040-116 = ""
10055040-117 = ""
10055040-118 = ""
10055040-119 = "...Ну вот мы и здесь."
10055040-120 = "Где Макото...?"
10055040-121 = ""
10055040-125 = ""
10055040-126 = "Засада?! Все назад!"
10055040-127 = "...А. Это вы."
10055040-128 = ""
10055040-130 = ""
10055040-132 = ""
10055040-133 = "Макото...?"
10055040-134 = "Что это сейчас за стрельба была...?"
10055040-135 = "А. Это я стреляла."
10055040-136 = "Я приняла вас за призраков..."
10055040-137 = "...Ты же только что утверждала, что не веришь в призраков?"
10055040-138 = "Ироха-а! Ура, ты пришла!"
10055040-139 = ""
10055040-141 = ""
10055040-142 = "Похоже на то."
10055040-143 = "Тебе следовало её остановить. С нами Сенсей и Ибуки. Они ведь могли серьёзно пострадать."
10055040-144 = "Ахаха, прости... Она начала стрелять раньше, чем я успела хоть что-нибудь сделать!"
10055040-145 = "...Кстати, кажется, я вообще впервые увидела, как она стреляет из своего оружия."
10055040-146 = "Ты совершенно уверена, что здесь никого нет? Мы в безопасности?"
10055040-147 = "Да. Совершенно уверена."
10055040-148 = "Даже после всего этого шума никто не появился."
10055040-149 = "На этом корабле не может быть команды."
10055040-150 = ""
10055040-153 = ""
10055040-154 = ""
10055040-155 = ""
10055040-156 = ""
10055040-157 = ""
10055040-158 = "А-а..."
10055040-159 = ""
10055040-161 = ""
10055040-162 = ""
10055040-163 = "Сацуки! Держись!"
10055040-164 = "Так здесь и правда есть пираты-призраки?!"
10055040-165 = "Пусть я такого и не предвидела, но я всегда готова ко всему!"
10055040-166 = "Ироха, пора! Немедленно приготовь «это»!"
10055040-167 = "Я понятия не имею, о чём ты, да даже если бы знала, мы вообще-то дрейфуем посреди моря!!"
10055040-168 = ""
10055040-172 = "И-и! Они в нас стреляют!!"
10055040-173 = "С каких пор призраки пользуются оружием... Нет, сейчас не до этого!"
10055040-174 = "Всем назад, к лодке!"
10055040-175 = ""
10055040-178 = ""
10055040-179 = ""
10055040-180 = ""
10055040-181 = ""
10055040-182 = "Смотрите! Сзади их ещё больше!"
10055040-183 = "Что?! Когда они успели появиться?"
10055040-184 = ""
10055040-186 = ""
10055040-187 = "А...? Что случилось? Мне казалось, мне снился ужасный кошмар..."
10055040-188 = ""
10055040-190 = ""
10055040-191 = "Это был не сон?!"
10055040-192 = ""
10055040-194 = ""
10055040-196 = "А-а! Мы попали в бесконечную петлю!"
10055040-197 = "Чиаки, помоги Сацуки! Мы идём вглубь корабля! Ибуки, за мной!"
10055040-198 = "Есть! Держись, Сацуки!"
10055040-199 = ""
10055040-201 = ""
10055040-202 = ""
10055040-205 = ""
10055040-206 = ""
10055040-209 = ""
10055040-210 = ""
10055040-212 = "[ns1] «...? \"Треск\"?»\n[ns2] «Это нехорошо»."
10055040-215 = "А, пол проваливается... Сенсей! Сацуки!"
10055040-216 = ""
10055040-220 = "Всё хорошо! Я вас поймала...!"
10055040-221 = "И-или нет!! А-а-а!!"
10055040-222 = ""
10055040-224 = ""
10055040-228 = "...И вот так мы провалились сквозь обрушившийся пол."
