[translation]
10055040-1 = "Episode 4: Ghost Ship"
10055040-3 = "…So, you're saying that massive ship appeared along with the fog?"
10055040-4 = "It’s exactly like the ghost ship from the rumors… isn't it?"
10055040-5 = "Usually, I’d be thrilled, thinking 'A paranormal special! What a scoop!' but…"
10055040-6 = "It looks old enough to be in a museum."
10055040-11 = "Ibuki knows this! It's a galleon, right?"
10055040-12 = "A galleon? Oh, I've heard of that! #nThat's the kind of ship that moves by rowing oars, right?"
10055040-13 = "Nope, that's a galley! This is a much older type of ship!"
10055040-14 = "Ah, shoot, I got it wrong… #nHow embarrassing, haha."
10055040-15 = "Both galleys and galleons are things that have long since vanished, after all."
10055040-16 = "Vanished…? #nBut…"
10055040-17 = "Exactly. A vessel that shouldn't exist, one that isn't found in any of the seas across Kivotos."
10055040-18 = "And yet, that ship has appeared right before us."
10055040-19 = "That’s just like…"
10055040-24 = "…I see. So this is the truth behind the ghost ship legend."
10055040-28 = "Alright, I've decided."
10055040-29 = "We’re going to seize that ship and head back to land."
10055040-33 = "…Huh?"
10055040-34 = "W-wait a minute, Makoto! Are you serious!?"
10055040-35 = "Hm? Is there a problem?"
10055040-36 = "It's a ghost ship! A ghost ship! What are you going to do if there are actual ghosts on board!?"
10055040-37 = "Don't say such ridiculous things. #nThere's no way ghosts exist."
10055040-38 = "A ship of that size should have a crew. #nIf they felt something was wrong with the ship, they would have come out by now."
10055040-39 = "But no one has appeared yet… which means it must be an abandoned ship. #nThe rumors about it being a ghost ship are just people seeing a desolate vessel and saying whatever they want."
10055040-40 = "Whoa, Makoto-senpai is acting like a rational person with a straight face!?"
10055040-41 = "Besides—"
10055040-42 = "If you're anxious, you don't have to come along."
10055040-43 = "…Eh?"
10055040-44 = "I mean exactly what I said. If you want to stay on this ship, feel free."
10055040-45 = "Only those who wish to come with me, follow behind. #nI, the great Makoto, shall lead the way."
10055040-49 = "Ah, Makoto-senpai! It's dangerous to go alone!"
10055040-53 = "…………"
10055040-54 = "Makoto-chan is acting strange."
10055040-55 = "You think so? I think she's the same as always. #nSelfish, overbearing…"
10055040-56 = "No. That's not what I mean."
10055040-57 = "Makoto-chan and I are actually quite similar. We both hate painful things and are terrified of scary things… #nThat's why she would never, ever go into such a dangerous place on her own."
10055040-58 = "That's true… usually she'd be telling me to go instead."
10055040-59 = "…I have a bad feeling about this."
10055040-60 = "The ghost ship appeared, and Makoto-chan's demeanor changed."
10055040-61 = "Could that ship be affecting her mind…?"
10055040-66 = "Ibuki wants to go too!"
10055040-67 = "Eh…? But, it's dangerous."
10055040-68 = "Ibuki knows! #nWe're actually drifting… right?"
10055040-69 = "And Iroha-senpai was fighting with Makoto-senpai…"
10055040-70 = "How does Ibuki know about that…"
10055040-71 = "Ibuki wants to be useful to everyone too!"
10055040-72 = "Because Ibuki is a member of Pandemonium, too!"
10055040-77 = "Ibuki…"
10055040-78 = "…I understand. But in exchange, you must never leave my side, okay?"
10055040-79 = "Wait, what!? You guys are going too!?"
10055040-80 = "Yes, well… I am worried about Chiaki, after all."
10055040-81 = "Hey! That means I'm the only one left behind!?"
10055040-82 = "I suppose so. #nWell, I think one person staying behind to guard the ship is fine."
10055040-83 = "Uuu…!"
10055040-87 = "…………"
10055040-88 = "No, really. You don't have to force yourself to come along."
10055040-89 = "Wait a second! I'm thinking about it!"
10055040-93 = "…I'm going too."
10055040-94 = "Eh, really? Are you sure?"
10055040-95 = "There's no way I can stay here all by myself in this situation! #nThat's what a normal person would do! A sane human being would do that!"
10055040-96 = "I don't think it's quite that extreme…"
10055040-97 = "Satsuki-senpai! Let's hold hands, Ibuki!"
10055040-103 = "Squeeze tight! If we hold hands the whole time, it won't be scary at all!"
10055040-104 = "Ibuki-chan…"
10055040-108 = "Phew… o-okay. I've prepared myself mentally. #nGhosts or whatever, bring it on!"
10055040-109 = "I told you, there aren't any. There's no way ghosts exist."
10055040-110 = "…"
10055040-119 = "…In the end, we all came along."
10055040-120 = "Makoto-senpai is…"
10055040-126 = "An ambush!? Everyone, get down!"
10055040-127 = "…Oh, it's just you lot."
10055040-133 = "Makoto-senpai…?"
10055040-134 = "What was that gunfire just now…?"
10055040-135 = "Ah, that was me."
10055040-136 = "I thought for sure it was a ghost…"
10055040-137 = "…? But you said earlier you didn't believe in ghosts…"
10055040-138 = "Ah, Iroha-chan! You came!"
10055040-142 = "Yes, well, that's how it turned out."
10055040-143 = "And honestly, you could have tried to stop us a little. Setting aside myself and Satsuki-senpai, Sensei and Ibuki are in real danger."
10055040-144 = "Haha, sorry… but before that, the gunshots?"
10055040-145 = "…? Come to think of it, is this the first time I've seen Makoto-senpai use a gun…?"
10055040-146 = "So, there's no one here, right? It's safe, right?"
10055040-147 = "Yeah, no doubt about it."
10055040-148 = "Even with all this commotion, not a single person has come out…"
10055040-149 = "Which means this ship is…"
10055040-158 = "Ah…"
10055040-163 = "Satsuki-senpai! Pull yourself together!!"
10055040-164 = "Ghosts!?"
10055040-165 = "To think they'd actually appear… but we have countermeasures!"
10055040-166 = "Iroha, 'that thing'!! Prepare 'that thing'!!"
10055040-167 = "I don't know what you're talking about, but we have nothing while we're drifting!!"
10055040-172 = "Whoa! They're shooting at us!?"
10055040-173 = "Why would a ghost use a gun… no, now is not the time to be saying that!"
10055040-174 = "Everyone, let's head back to our ship!"
10055040-182 = "Senpai! There are ghost girls behind us too!"
10055040-183 = "Eh, when did they get there!?"
10055040-187 = "U-uugh… what? I feel like I just had a really scary dream…"
10055040-191 = "…Wait, this is reality!?"
10055040-196 = "Ahhh! This is an infinite loop!"
10055040-197 = "Chiaki, support Satsuki! We're escaping inside! Ibuki, come here!"
10055040-198 = "Yes!! Satsuki-senpai, stay with us!!"
10055040-212 = "[ns1] \"…Crack?\"\n[ns2] \"Oh, this is the end…\""
10055040-215 = "Ah, the floor is…!! #nSensei, Satsuki-senpai!"
10055040-220 = "It's okay, I've got—"
10055040-221 = "I guess I can't do it alone after all…!"
10055040-228 = "(…And so, we fell into the bottom of the ship.)"