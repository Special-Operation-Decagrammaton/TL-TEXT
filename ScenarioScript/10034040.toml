[translation]
10034040-1 = "Эпизод 4;Новая и другая я"
10034040-2 = "Несколько дней спустя..."
10034040-3 = "На работе выдался спокойный день. Хороший момент, чтобы расслабиться."
10034040-4 = ""
10034040-9 = "Алло, Сенсей? Простите, что звоню так внезапно. Вы сейчас заняты?"
10034040-10 = "Нет, у нас ничего не случилось. Я просто хотела... отчитаться перед вами, наверное? Как представитель группы."
10034040-11 = "Репетиционная комната очень хорошая, и места много! Так что начало отличное. Я просто хотела вам об этом сказать."
10034040-12 = "Вообще-то мы прямо сейчас начинаем репетицию. Я просто хотела сначала позвонить и поблагодарить вас."
10034040-13 = "...А? Что вы сказали?"
10034040-14 = "Вы хотите прийти прямо сейчас? Н-не нужно..."
10034040-15 = "[s1] «Просто захотелось тебя увидеть, Ёшими.»\n[s2] «Хочу посмотреть на ваше выступление.»"
10034040-18 = "...Серьёзно? Что вы такое говорите?"
10034040-19 = "Неважно. Уверена, у вас полно работы. Мы и сами справимся."
10034040-20 = "Я кладу трубку. Хорошо? Вы меня услышали, да? Даже не думайте приходить!! Мы сейчас начнём репетицию!"
10034040-21 = ""
10034040-25 = "[ns3] «Ага, конечно. Уже иду!»\n[ns4] Немедленно собраться и выйти."
10034040-31 = "Выйдя из Шале, я отправился искать репетиционную комнату, которую арендовал для студентов."
10034040-32 = "Было не очень громко, потому что комната находилась под землёй и была звукоизолирована, но я всё же слышал слабое эхо их репетиции."
10034040-33 = "[ns5] «Похоже, они усердно репетируют.»\n[ns6] Спуститься в репетиционную комнату."
10034040-41 = "Быстрее!! Давай, ещё быстрее!!"
10034040-42 = ""
10034040-44 = ""
10034040-45 = "Э-это уже мой предел... Это не... рок..."
10034040-46 = "Быстрее!!"
10034040-47 = "Уаааа!!"
10034040-48 = ""
10034040-50 = ""
10034040-51 = ""
10034040-52 = "Быстрее!!"
10034040-53 = "Гуууо-о-о! Рооок!!"
10034040-54 = ""
10034040-56 = ""
10034040-57 = ""
10034040-58 = ""
10034040-59 = "Да! ВОТ такой темп!! Ещё раз!! Ещё раз!!"
10034040-60 = "Уааа..."
10034040-61 = ""
10034040-63 = ""
10034040-64 = ""
10034040-65 = ""
10034040-66 = "Быстрее!!"
10034040-67 = "РОООК!!"
10034040-68 = ""
10034040-70 = ""
10034040-71 = ""
10034040-72 = ""
10034040-73 = ""
10034040-74 = "Ё-Ёшими, Нацу уже играет настолько быстро, насколько может..."
10034040-75 = "Ничего не поделаешь. Она играет слишком медленно, это факт."
10034040-76 = "Если хочет быть барабанщицей, ей придётся держать темп."
10034040-77 = "Даже если мы делаем всё это только ради semla."
10034040-78 = "Я... Наверное, ты права."
10034040-79 = ""
10034040-81 = ""
10034040-82 = "...Точно... Именно это они и сказали..."
10034040-83 = "Хм? Айри, что ты сказала?"
10034040-84 = "Ч-что?! Ничего! Ничего..."
10034040-85 = ""
10034040-87 = ""
10034040-88 = "...Хм...?"
10034040-89 = "...О? ...Сенсей?"
10034040-90 = ""
10034040-92 = ""
10034040-93 = ""
10034040-94 = "Сенсей! Вы пришли посмотреть на нашу репетицию?!"
10034040-95 = "[s7] «У вас уже отлично получается.»\n[s8] «Вы выглядите как настоящая группа.»"
10034040-98 = "А-ахаха... Правда? Спасибо! Очень приятно слышать это от вас."
10034040-99 = "Эм... С-сенсей...? Мне просто интересно..."
10034040-100 = "К-как давно вы там стоите...? Вы ведь не... слышали, как я пела, правда...?"
10034040-101 = "...О, не слышали? ...Только что пришли? Ха-ха, фух."
10034040-102 = "Нет, просто... я много ошибалась..."
10034040-103 = "Она правда отлично пела! У Казусы прекрасный голос!!"
10034040-104 = "...Айри."
10034040-105 = ""
10034040-107 = ""
10034040-108 = ""
10034040-109 = "...А? Что за шум?"
10034040-110 = "...А, Сенсей...?"
10034040-111 = "...О."
10034040-112 = ""
10034040-114 = ""
10034040-115 = ""
10034040-116 = "Погодите, что? Что здесь делает Сенсей?!"
10034040-117 = "Здесь не на что смотреть! Мы только начали, и всё ещё полный бардак! Мы пока не готовы вам что-то показывать!"
10034040-118 = "Я же сказала вам не приходить, потому что мы не можем нормально репетировать, если будем стесняться! Я специально вас предупредила!"
10034040-119 = "[s9] «Ёшими... ты меня стесняешься...?»\n[s10] «*шмыг* *шмыг* Не так я тебя воспи...»"
10034040-122 = "Вы всё превращаете в какую-то странность! Просто уходите!"
10034040-123 = "Не приходите, пока мы репетируем! Поняли? Я совершенно серьёзно!! Не возвращайтесь, пока мы сами не скажем, что можно!!"
10034040-124 = "Вы пришли помочь...? Да всё у нас нормально! Правда, мы справимся!!"
10034040-125 = "Вон отсюда! Просто уходите!!"
10034040-126 = "Прямо сейчас!"
10034040-127 = "ВОН!!"
10034040-128 = ""
10034040-135 = "Ёшими буквально вытолкнула меня из комнаты."
10034040-136 = "В любом случае было очевидно, что с комнатой и оборудованием всё в порядке, так что я ушёл удовлетворённый."
10034040-138 = "Во время ужина, когда я закончил работу и репетиционная комната, по идее, уже должна была опустеть, я снова туда заглянул."
10034040-139 = ""
10034040-142 = "[ns11] «Кто-то всё ещё репетирует в такой час?»\n[ns12] Войти в репетиционную комнату."
10034040-149 = "[ns13] «Айри...?»\n[ns14] «Ты всё это время репетировала одна?»"
10034040-152 = "О? Сенсей?"
10034040-153 = ""
10034040-155 = ""
10034040-156 = "Что вы здесь делаете? Уже поздно..."
10034040-157 = "...Я? Хе-хе... Я просто, ну... просто..."
10034040-158 = "...решила ещё немного потренироваться играть на клавишах. Мы ведь должны выступить как можно лучше! Хи-хи."
10034040-159 = "[s15] «Здесь много книг для начинающих... и ещё по теории.»\n[s16] «Ты очень серьёзно к этому относишься.»"
10034040-162 = "В-вы так думаете? Ха-ха... Я просто не знала, что делать, ведь для меня это впервые."
10034040-163 = "Но такая возможность выпадает не каждый день... поэтому я хочу использовать её по максимуму! Да!"
10034040-164 = "...А?"
10034040-165 = "...Репетировать... весело...?"
10034040-166 = "Эм... Я-я не уверена. Я даже не задавала себе такого вопроса."
10034040-167 = "Да, я правда об этом не думала. Весело ЛИ мне? Ну..."
10034040-168 = "...Пока не знаю. Хм... Весело или нет?"
10034040-169 = "Сейчас я просто выполняю упражнения для начинающих."
10034040-170 = "Начать было несложно, но, кажется, из нас всех я медленнее всего осваиваюсь. Ха..."
10034040-171 = "Все остальные словно веселятся, но они все такие умелые..."
10034040-172 = "Поэтому..."
10034040-174 = "«Чего-то не хватает», значит..."
10034040-177 = ""
10034040-178 = ""
10034040-179 = "[ns] «...Айри?»"
10034040-180 = "А-а! Да, эм... поэтому пока мне нужно освоить основы, А ПОТОМ уже я смогу начать получать удовольствие!"
10034040-181 = "Сначала ведь нужно освоить основы, да? Ну, как нажимать на клавиши и всё такое?"
10034040-182 = "Мне просто нужно всё это освоить, и тогда я как-нибудь их догоню! Ха-ха!"
10034040-183 = "Н-но насчёт веселья... Хм..."
10034040-184 = "Когда я стану хорошо играть... всё же наладится, правда?"
10034040-185 = "Да! Когда я научусь, будет здорово. А пока надо репетировать, репетировать и ещё раз репетировать!!"
10034040-186 = "..."
10034040-187 = "Хм, погодите. Это... не то?"
10034040-188 = "Кажется, это был не тот ответ, которого вы ожидали, Сенсей..."
10034040-189 = "[s17] «Пока всё нормально.»\n[s18] «Не нужно выдавливать из себя ответ.»"
10034040-192 = "Хм? О, х-хорошо..."
10034040-193 = ""
10034040-195 = ""
10034040-196 = "Что ж..."
10034040-197 = "Раз уж мы здесь, вообще-то я хотела кое-что вам сказать, Сенсей."
10034040-198 = "Может быть, вы уже и так знаете, о чём речь..."
10034040-199 = "Я сказала друзьям, что мы делаем это ради semla..."
10034040-200 = "Но на самом деле semla для меня не так уж важна."
10034040-201 = "Сенсей, я..."
10034040-202 = "...Я хочу СТАТЬ человеком, который умеет играть на музыкальном инструменте."
10034040-203 = "И даже больше... Я хочу, чтобы у меня было что-то, в чём я хороша. Вот моя цель."
10034040-204 = "Мои друзья говорят, что достаточно научиться играть настолько хорошо, чтобы получить semla... но для меня всё не так."
10034040-205 = "Вы же меня знаете, я... застенчивая, нерешительная и бесхребетная."
10034040-206 = "Но даже у такой, как я, должно быть что-то, что у неё хорошо получается, разве нет?"
10034040-207 = "Если честно, я даже не знаю, нравится ли мне всё это. Но я знаю, что не могу оставаться такой, какая я сейчас."
10034040-208 = "[s19] «Почему ты не можешь оставаться такой, какая ты сейчас?»\n[s20] «Понятно. Значит, вот в чём дело.»"
10034040-211 = "Знаете, как говорят! Музыка может изменить человека! Она даст мне то, чем я смогу гордиться, то, за что я смогу нравиться людям!"
10034040-212 = "Вот... что значит для меня это прослушивание. Я попросила друзей пойти со мной, потому что боялась делать это одна."
10034040-213 = ""
10034040-215 = ""
10034040-216 = "Наверное, я ужасный человек. Я... использовала друзей ради собственной выгоды."
10034040-217 = "Ужасный? По крайней мере, эгоистичный..."
10034040-218 = "...А?"
10034040-219 = "Вы так не думаете? Я не... использую их...? Но..."
10034040-220 = "[s21] «Это не называется „использовать“.»\n[s22] «Они делают это вместе с тобой, потому что им весело.»"
10034040-223 = "П-правда...? Мм... мне и правда становится легче, когда вы так говорите..."
10034040-224 = "Вот как-то так. Я хочу измениться и думаю, что эти клавиши смогут мне в этом помочь."
10034040-225 = "Если я научусь играть достаточно хорошо, я... стану человеком, которым смогу гордиться."
10034040-226 = "Сенсей, я говорю вам это только потому, что вы зашли так далеко и выслушали меня..."
10034040-227 = "...Но, эм... больше я никому не смогла бы это сказать. Только вам, Сенсей. Пожалуйста, сохраните это в секрете."
10034040-228 = "В общем... присматривайте за мной. Я буду стараться изо всех сил."
10034040-229 = "Я научусь играть хорошо..."
10034040-230 = "...и стану по-настоящему крутой!"
10034040-231 = "Хм?"
10034040-232 = "Сенсей...?"
10034040-233 = "Что такое? Вы хотели что-то сказать...?"
10034040-234 = ""
10034040-237 = "[ns23] «Всё нормально. Скажу в следующий раз.»\n[ns24] «Я буду за тебя болеть. Только не переусердствуй.»"
10034040-240 = "...Повтори?"
10034040-241 = "...А, вы про то, чтобы рассчитывать силы? Хе-хе, не волнуйтесь! Я знаю, что нельзя перенапрягаться!"
10034040-242 = "Я правда выложусь на полную, Сенсей!!"
10034040-243 = "...Я серьёзно!!"
10034040-245 = "Несколько дней спустя..."
10034040-246 = ""
10034040-250 = ""
10034040-251 = "Сенсей...? Вы там, Сенсей?"
10034040-252 = "[s25] «О, ты сама мне звонишь. Значит, стала увереннее?»\n[s26] «А я думал, ты не хотела, чтобы я был рядом во время репетиций.»"
10034040-255 = "Хватит дразниться! Сейчас вообще не время для этого!!"
10034040-256 = "Только не поймите неправильно, Сенсей..."
10034040-257 = "Я просто... Просто хотела спросить..."
10034040-258 = "...Айри случайно не приходила к вам? Ну, недавно?"
10034040-259 = ""
10034040-263 = "[ns27] «...А что с ней?»\n[ns28] «...Что-то случилось?»"
10034040-266 = "Н-Ну...! Насчёт этого...!"
10034040-267 = "...Я..."
10034040-269 = "...Я не могу связаться с ней с позавчерашнего дня."
