[translation]
1014806-1 = "Ausflüglerin and a Summer Patrol?"
1014806-3 = "（On the way to Schale, I encountered Toramaru on patrol.）"
1014806-4 = "[ns] \"Hey, Iroha.\""
1014806-5 = "（...）"
1014806-6 = "[ns] \"...Iroha?\""
1014806-7 = "（...）"
1014806-8 = "（It is definitely Toramaru, but there is no reply.）"
1014806-9 = "Hmm..."
1014806-10 = "Well, I guess it's fine."
1014806-11 = "Sensei, could you come inside?"
1014806-12 = "It's unlocked."
1014806-13 = "[s1] \"Sure, but...\"\n[s2] （Enter the tank）"
1014806-24 = "[ns3] \"...Eh?\"\n[ns4] \"Why...?\""
1014806-27 = "I had unavoidable circumstances."
1014806-28 = "It's so hot, the air conditioner broke down."
1014806-29 = "Even if we try to fix it, I heard it will take over a week for the parts to arrive..."
1014806-30 = "So, I can't just skip partrolling..."
1014806-31 = "[s5] \"So, a swimsuit.\"\n[s6] \"Is it really okay to take off your uniform?\""
1014806-34 = "I patrol alone."
1014806-35 = "No one will see me, so I figured it wouldn't matter."
1014806-36 = "[s] \"I'm here, you know?\""
1014806-37 = "...As long as you keep quiet, there's no problem, right?"
1014806-38 = "Besides—"
1014806-42 = "It's not exactly a bad thing for you, is it, Sensei?"
1014806-43 = "...Um. #nWhen you look away like tha..."
1014806-47 = "It's embarrassing for me too, you know..."
1014806-48 = "..."
1014806-49 = "...I see."
1014806-53 = "So you're choosing to remain silent."
1014806-54 = "Then it can't be helped."
1014806-55 = "Shall we go to the sea just like this?"
1014806-59 = "Because after all, you were the one who taught me, Sensei."
1014806-60 = "That summer means the sea, and the sea means tanks."
1014806-61 = "[s7] \"Iroha?\"\n[s8] \"Weren't you on patrol...?\""
1014806-64 = "It's fine. Just for one day."
1014806-65 = "Well then—"
1014806-69 = "Let's slack off."
1014806-75 = "（I was taken to the sea just like that.）"
1014806-76 = "（I was only able to return to Schale past noon the next day.）"