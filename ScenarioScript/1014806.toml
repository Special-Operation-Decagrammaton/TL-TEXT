[translation]
1014806-1 = "Ausflug and a Summer Patrol?"
1014806-3 = "(On the way to Schale, I encountered Toramaru out on patrol.)"
1014806-4 = "[ns] \"Hey there, Iroha.\""
1014806-5 = "(...)"
1014806-6 = "[ns] \"...Iroha?\""
1014806-7 = "(...)"
1014806-8 = "(It’s definitely Toramaru, but there’s no response.)"
1014806-9 = "Hmm..."
1014806-10 = "Oh well."
1014806-11 = "Sensei, could you come inside?"
1014806-12 = "The hatch is unlocked."
1014806-13 = "[s1] \"Sure, but...\"\n[s2] (Enter the tank)"
1014806-24 = "[ns3] \"...Huh?\"\n[ns4] \"Why are you...\""
1014806-27 = "I have my reasons."
1014806-28 = "It’s so hot out, and the air conditioning broke."
1014806-29 = "Even if I try to fix it, the parts won't arrive for over a week..."
1014806-30 = "Still, I can't just skip my patrol..."
1014806-31 = "[s5] \"So, a swimsuit?\"\n[s6] \"Is it okay to just take your clothes off?\""
1014806-34 = "I'm the only one on patrol."
1014806-35 = "There's no one around to see, so I don't see the problem."
1014806-36 = "[s] \"I'm here, aren't I?\""
1014806-37 = "...It wouldn't be a problem if you just kept quiet about it, would it?"
1014806-38 = "Besides—"
1014806-42 = "This isn't exactly a bad thing for you, is it, Sensei?"
1014806-43 = "...Hey. #nIf you turn your face away like that now..."
1014806-47 = "I'm embarrassed too, but..."
1014806-48 = "..."
1014806-49 = "...I see."
1014806-53 = "So you're going to play the silent type."
1014806-54 = "In that case, I have no choice."
1014806-55 = "Shall we head straight to the beach?"
1014806-59 = "After all, you were the one who told me."
1014806-60 = "That summer means the beach, and the beach means tanks."
1014806-61 = "[s7] \"Iroha?\"\n[s8] \"Weren't you on patrol...?\""
1014806-64 = "It's fine. Just for one day."
1014806-65 = "Now then—"
1014806-69 = "Shall we slack off?"
1014806-75 = "(I was taken to the beach just like that.)"
1014806-76 = "(I didn't make it back to Schale until the afternoon of the next day.)"