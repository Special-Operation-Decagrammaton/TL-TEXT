[translation]
1014806-1 = "Возвращение фройляйн?"
1014806-3 = "По дороге в офис Шале я встретил Торамару, который патрулировал улицы."
1014806-4 = "[ns] «Привет, Ироха»."
1014806-5 = "..."
1014806-6 = "[ns] «...Ироха?»"
1014806-7 = "... ..."
1014806-8 = "Это точно был Торамару, но его хозяйка сначала никак не откликалась."
1014806-9 = "Эм."
1014806-10 = "У нас проблема."
1014806-11 = "Сенсей, залезайте на минутку внутрь."
1014806-12 = "Люк открыт."
1014806-13 = "[s1] «...?»\n[s2] Забраться в танк."
1014806-16 = ""
1014806-22 = ""
1014806-24 = "[ns3] «...?»\n[ns4] «...Почему ты в купальнике?»"
1014806-27 = "Даже не спрашивайте."
1014806-28 = "Жара адская, а кондиционер сломался."
1014806-29 = "Запчасти для ремонта будут доставлять больше недели."
1014806-30 = "И я не могу прекратить патрулирование только потому, что жарко."
1014806-31 = "[s5] «Но разве РАЗДЕВАТЬСЯ — нормальная реакция?!»\n[s6] «...Хотя, если подумать, наверное, да...»"
1014806-34 = "Я почти всегда патрулирую одна."
1014806-35 = "Какая разница, если меня никто не видит?"
1014806-36 = "[s] «Но я-то видел! Я тебя увидел!»"
1014806-37 = "Но вы же не кто-нибудь. Пока не проболтаетесь, всё в порядке."
1014806-38 = "К тому же..."
1014806-39 = ""
1014806-41 = ""
1014806-42 = "Разве для вас это не своего рода удача?"
1014806-43 = "А? Почему это ВЫ отводите взгляд?"
1014806-44 = ""
1014806-46 = ""
1014806-47 = "...Это мне сейчас должно быть стыдно?"
1014806-48 = "..."
1014806-49 = "...Понятно."
1014806-50 = ""
1014806-52 = ""
1014806-53 = "Значит, вы решили воспользоваться правом хранить молчание?"
1014806-54 = "Ну, что поделать!"
1014806-55 = "Хотите на пляж?"
1014806-56 = ""
1014806-59 = "Помнится, один учитель мне говорил..."
1014806-60 = "Лето плюс танк равно пляж, верно?"
1014806-61 = "[s7] «Звучит заманчиво, но...»\n[s8] «Разве ты сейчас не на патруле...?»"
1014806-64 = "От одного пропущенного патруля Геенна не развалится."
1014806-65 = "Ну..."
1014806-66 = ""
1014806-68 = ""
1014806-69 = "Не хотите прогулять его вместе со мной?"
1014806-70 = ""
1014806-72 = ""
1014806-75 = "Я согласился, и Ироха отвезла нас на Торамару до самого пляжа."
1014806-76 = "...В Шале я вернулся только к полудню следующего дня."
