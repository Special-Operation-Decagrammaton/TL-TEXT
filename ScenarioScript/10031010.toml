[translation]
10031010-1 = "Эпизод 1;Предложение о сотрудничестве"
10031010-3 = ""
10031010-5 = ""
10031010-7 = ""
10031010-9 = ""
10031010-12 = "После того как суета наконец улеглась..."
10031010-13 = ""
10031010-14 = "Кихехе. Жаль, что пока мне не удалось получить окончательный ответ на моё предложение, но это лишь вопрос времени."
10031010-15 = "...Что-то ты притих. Уже жалеешь?"
10031010-16 = "Не волнуйся. У меня полно времени, чтобы тебя убедить... Возможно, после большого, огромного, титанического, гигантского события, которое я планирую!"
10031010-17 = "[s] «Разве все эти слова не означают одно и то же?»"
10031010-18 = "О! Ты как раз сейчас это упомянул! Как идеально вовремя! От Макото другого и не ожидалось!"
10031010-19 = "*ахает*! Погодите, весь тот бред раньше был всего лишь предвестником этого момента?!"
10031010-20 = "Ч-Что?"
10031010-21 = "А, да. Именно, Чиаки!"
10031010-22 = "Нет. Не ведитесь. По её лицу видно, что она даже не думала об этом."
10031010-23 = "Так или иначе! Мы правда собираемся это делать?!"
10031010-24 = "Конечно, Ироха! Подготовка идёт полным ходом!"
10031010-25 = "Я, Великая Макото, предусмотрела всё. Этот план принесёт славу Обществу Пандемониума и разнесёт весть о моём величии по всему Кивотосу!"
10031010-26 = "Ага! Ибуки тоже очень ждёт!"
10031010-27 = "[ns] «Эм... А к чему именно вы все готовитесь?»"
10031010-28 = "Кихехе... Через пять дней Общество Пандемониума проведёт Особую вечеринку Геенны в новом зале собраний Общества Пандемониума. Его почти достроили..."
10031010-29 = "И именно на этой вечеринке все ученики Геенны поймут, что мы, Общество Пандемониума..."
10031010-30 = ""
10031010-32 = ""
10031010-33 = "...одна из величайших организаций Геенны! Они наконец увидят, что мы куда надёжнее этих тупых тормозов из Дисциплинарной комиссии! Кихехехе!!"
10031010-34 = ""
10031010-35 = ""
10031010-36 = "Если развернуть её мысль..."
10031010-37 = "Общество Пандемониума каждый год проводит вечеринку ко Дню святого Валентина, приглашая влиятельных людей из Кивотоса и Геенны."
10031010-38 = "Но масштаб вечеринки в этом году больше, чем в прошлом или позапрошлом. Всё ощущается гораздо грандиознее... А может, Макото просто разошлась."
10031010-39 = "В этом году вечеринка будет совершенно не похожа на предыдущие."
10031010-40 = "Не забывай, Ироха. В этом году нам помогает Сенсей из Шале!"
10031010-41 = ""
10031010-43 = ""
10031010-44 = "[ns] «...Я?»"
10031010-45 = "Да. Если мы заручимся сотрудничеством Сенсея, эта вечеринка ко Дню святого Валентина будет богаче и... могущественнее, чем любая раньше!"
10031010-46 = "Это шанс показать миру великое и великолепное правление Макото!"
10031010-48 = "Боже! Она прямо признаёт, что нам нужен Сенсей на нашей стороне! Вот это наша Макото!"
10031010-49 = "Эм, Макото. Что вообще значит «вечеринка станет могущественнее»?"
10031010-51 = "Вот на чём ты зацепилась?"
10031010-52 = "Кеке. О, Сенсей. Не тревожься."
10031010-53 = "С твоей помощью успех вечеринки практически гарантирован!"
10031010-54 = "Если вечеринка пройдёт успешно, ученики Геенны будут меня обожать! Даже Сенсей увидит меня в новом свете... и примет моё предложение! Так родится блистательный союз Шале и Общества Пандемониума!"
10031010-55 = "А дальше всё пойдёт как по маслу! Кекекеке!"
10031010-56 = "[s] «...Хорошая ли идея — раскрывать истинные намерения человеку, которого пытаешься убедить?»"
10031010-57 = "...Именно. Кто угодно заметит, как ты постоянно мечешься между просьбой о помощи и планами использовать человека, Макото. Бедному Сенсею, должно быть, противно."
10031010-58 = "[s] «Я помогу.»"
10031010-59 = "Ох?!"
10031010-60 = "Правда?! Ты уверен?!"
10031010-61 = "[s9] «Если ученику нужна помощь, я помогаю.»\n[s10] «Мне ещё и интересно посмотреть, какие вечеринки устраивает Геенна.»"
10031010-64 = "Вот... как."
10031010-66 = "Какое облегчение!"
10031010-67 = "Хм..."
10031010-69 = "Сенсей нам поможет? Ура! Ибуки так рада!"
10031010-70 = "Ибуки тоже будет очень стараться, чтобы вместе с Сенсеем сделать отличную вечеринку!"
10031010-71 = "Кихехе. Хорошо."
10031010-72 = "Превосходно! [USERNAME] Сенсей! С нетерпением жду совместной работы... следующие 5 дней! Кекекекеке!!"
10031010-74 = "Так и началась подготовка к вечеринке ко Дню святого Валентина вместе с Обществом Пандемониума."
