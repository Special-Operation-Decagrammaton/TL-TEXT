[translation]
2005306-1 = "Девушка-ниндзя не отстаёт от трендов!"
2005306-3 = "[ns] «Мичиру?»"
2005306-7 = ""
2005306-8 = "Домо, Почтенный Сенсей. Да, это Мичиру."
2005306-9 = ""
2005306-12 = "[ns] «К-Кто ты такая?!»"
2005306-13 = "Э?! Что вы такое говорите?!"
2005306-14 = "Что я только что сказала? Я Мичиру!"
2005306-15 = "[s1] «Постучала, потом вежливо вошла...»\n[s2] «Это не та „Мичиру“, которую я знаю!»"
2005306-18 = "Ах! За кого вы меня вообще принимаете?!"
2005306-19 = "...Н-Нет! Не уточняйте. Кажется, я и так знаю."
2005306-20 = "В любом случае, сегодня!"
2005306-21 = "Я подготовила кое-что под названием «брифинг»!"
2005306-22 = "[s] «Брифинг?»"
2005306-23 = "Хи-хи, именно."
2005306-24 = "«Брифинг-презентация секретов и дорожной карты роста канала „Мичиручи: Свиток девушки-ниндзя“»...!"
2005306-25 = "Ну как, Почтенный Сенсей? С нетерпением ждёте, что я расскажу?"
2005306-26 = "[s] «А, так ВОТ о чём было то сообщение в MomoTalk...»"
2005306-27 = "Вот именно!"
2005306-28 = "Мой секретный план, основанный на честных, совершенно обычных методах!"
2005306-29 = "Итак, без лишних задержек я начинаю презентацию!"
2005306-30 = "И сразу перейдём к волнующему заключению!"
2005306-31 = "[s] «К заключению? Ты только начала.»"
2005306-32 = "Ну, эм, в любом случае!"
2005306-33 = "Итак, итог: отныне я буду добавлять в видео больше самых свежих, горячих, новых и модных трендов."
2005306-34 = "Даже если ради этого придётся... сократить количество тем про ниндзя!"
2005306-35 = "[s3] «Сократить разговоры о ниндзя на канале про ниндзя...»\n[s4] «Ты уверена, что это хорошая идея?»"
2005306-38 = "Фуфу, считайте это шагом назад ради огромного прыжка вперёд, Сенсей. Тактический манёвр!"
2005306-39 = "Подумайте сами. Почему люди вообще нажимают на видео?"
2005306-40 = "Это... потому что видят большое число просмотров!"
2005306-41 = "[s5] «То есть для большого числа просмотров сначала нужно большое число просмотров...»\n[s6] «Мичиру, в этом нет смысла.»"
2005306-44 = "Есть! Мне нужно лишь временно поднять просмотры, чтобы больше людей заинтересовалось, из-за чего весь шум!"
2005306-45 = "Пока это не незаконно... вроде программ для накрутки цифр... я должна использовать любые возможные методы!"
2005306-46 = "Тогда люди, заходящие на канал, смогут смотреть без сомнений в нашей легитимности! И не задаваясь вопросами о морали."
2005306-47 = "Чтобы этого добиться, я решила загружать видео с самыми свежими трендами!"
2005306-48 = "[s] «И какие именно тренды ты собираешься использовать?»"
2005306-49 = "Фуфу, хороший вопрос, Почтенный Сенсей."
2005306-50 = "Для первого выпуска я выбрала тренд под названием... «мода»!"
2005306-51 = "[s] «Мода...?»"
2005306-52 = "Да. «Мода» сейчас очень горячая тема."
2005306-53 = "Недавно я анализировала вкладку «В тренде», и знаете что..."
2005306-54 = "Все самые популярные видео были о мо-де!"
2005306-55 = "«7 футболок, которые вы полюбите», «Как подобрать гранату под свой цветотип», «Дизайны пальто, с которыми ваше оружие будет ВЫДЕЛЯТЬСЯ» и так далее..."
2005306-56 = "Вот поэтому я и запланировала модное видео!"
2005306-57 = "[s] «О, и о чём оно будет?»"
2005306-58 = "Да..."
2005306-59 = "Разумеется, о пересечении моды и ниндзюцу!"
2005306-60 = "Я собираюсь придумать несколько ниндзюцу, связанных с модой. Это будет серия. По одному видео в неделю."
2005306-61 = "А когда соберу как можно больше подписчиков..."
2005306-62 = "Тогда понемногу начну добавлять настоящий контент про ниндзя...!"
2005306-63 = "И люди сами не заметят, как окажутся очарованы миром ниндзюцу! Полное погружение. Ловушка захлопнется!"
2005306-64 = "...Как лягушки, сидящие в постепенно закипающей воде!"
2005306-65 = "[s] «Какая жуткая аналогия!»"
2005306-66 = "В общем! На этом мой брифинг окончен, Сенсей!"
2005306-67 = "А что будет дальше... Я уверена, результаты скажут сами за себя."
2005306-68 = "Так что не переключайтесь, Сенсей. Смотрите, комментируйте, ставьте лайки и подписывайтесь!"
2005306-69 = "Я, Мичиру, стану суперпопулярным инфлюенсером! А потом вы сможете быть моим менеджером!"
2005306-70 = "На сегодня всё! Адиос! До свидания! МИР!"
2005306-71 = ""
2005306-76 = "Несмотря на дымовую бомбу, я всё равно понял, через какую дверь она ушла."
2005306-78 = "Прошло несколько дней."
2005306-80 = "Я разбирался с обычной горой документов..."
2005306-81 = "Почтенный Сенсей..."
2005306-82 = ""
2005306-84 = ""
2005306-85 = "Помогите-е-е..."
2005306-86 = "[s7] «Мичиру! Уже добилась успеха? Мне становиться твоим менеджером?»\n[s8] «Спаси меня от этого бумажного ада...!»"
2005306-89 = "Нет... Я... тоже пришла за помощью. Ну, как и говорила."
2005306-90 = "[s] «...А?»"
2005306-91 = "Я попробовала загрузить видео про моду и... немного про ниндзюцу."
2005306-92 = "И реакция сообщества настолько плохая, что это уже почти подозрительно..."
2005306-93 = "Я тону в дизлайках, их даже больше обычного!"
2005306-94 = "[s] «Может, видео сломалось? Ты читала комментарии?»"
2005306-95 = "...Нет."
2005306-96 = "Вообще-то мне слишком страшно заходить на страницу."
2005306-97 = "Поэтому я здесь, Почтенный Сенсей... Я хотела попросить вас... посмотреть страницу вместе со мной."
2005306-98 = "[s] «...Если ты этого хочешь, я помогу.»"
2005306-99 = "Спасибо, Почтенный Сенсей..."
2005306-101 = "Я начал просматривать видео Мичиру..."
2005306-102 = ""
2005306-105 = ""
2005306-106 = "Класс в старом школьном здании Хяккияко 38"
2005306-107 = "«Мичиручи: Свиток девушки-ниндзя»!"
2005306-108 = "Домо, с вами Мичиру."
2005306-109 = "Сегодняшняя тема ниндзюцу — «Техника мгновенного переодевания»!"
2005306-110 = "Это практичная секретная техника, освоив которую вы сможете в мгновение ока переодеться даже в самую капризную одежду!"
2005306-111 = "Пока не увидите — не поверите!"
2005306-112 = "...И сейчас я покажу, как это делается!"
2005306-113 = "Но, на всякий случай..."
2005306-114 = "Хия!"
2005306-115 = ""
2005306-119 = "[ns] «(Она закрыла крышкой объектив камеры?!)»"
2005306-121 = "Та-дам!"
2005306-122 = "Смотрите! Я переоделась мгновенно!"
2005306-123 = "А теперь поговорим о том, как именно работает это ниндзюцу..."
2005306-124 = "...Крышка объектива так и осталась надета до самого конца видео."
2005306-125 = "Большая часть загруженного ролика представляла собой чёрный экран."
2005306-126 = "Офис Шале"
2005306-127 = "..."
2005306-128 = "[ns] «...»"
2005306-129 = "А, я-я-я не могу поверить, что допустила такую любительскую ошибку...!"
2005306-130 = "Ааааааа...!"
2005306-131 = ""
2005306-134 = ""
2005306-136 = "Наверное, из-за сильного смущения Мичиру ушла, даже не бросив свою обычную дымовую бомбу."
