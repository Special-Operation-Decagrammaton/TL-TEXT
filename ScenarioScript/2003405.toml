[translation]
2003405-1 = "Сам куёшь свою удачу"
2003405-2 = "Слышали когда-нибудь о новогоднем удоне?"
2003405-3 = "[s] «А? Ты, наверное, имеешь в виду новогоднюю собу?»"
2003405-4 = "Нет! Я говорю именно о новогоднем удоне."
2003405-5 = "Среди множества разновидностей новогоднего удона есть одна особенно популярная!"
2003405-6 = "Я знаю... Не стоит верить каждой вирусной рекламе, которую видишь в интернете."
2003405-7 = "Но рейтингу 4 звезды при 500 отзывах я доверяю больше, чем 5 звёздам при десяти."
2003405-8 = "А у этого новогоднего удона рейтинг 4,3 звезды и больше 872 отзывов."
2003405-9 = "[s] «Невероятно!»"
2003405-10 = "Ух ты, пока мы разговаривали, отзывов стало ещё больше."
2003405-11 = "«Лапша чуть толще и плотнее обычного удона, но всё равно очень нежная.»"
2003405-12 = "«Простой рецепт, верный настоящему вкусу удона.»"
2003405-13 = "«Бульон немного пресноват, зато начинки кладут от души.»"
2003405-14 = "«Удон украшен розовым рыбным пирожком и креветочной тэмпурой... Будто пожелание удачи в новом году. Тэмпура, кстати, тоже неплохая.»"
2003405-15 = "[s1] «Ты не преувеличивала насчёт отзывов.»\n[s2] «Где можно его купить?»"
2003405-18 = "Ну... Он продаётся на одной станции отдыха довольно далеко отсюда."
2003405-19 = "About two hours away, I think?"
2003405-20 = "И это в глуши, куда не ходят прямые поезда."
2003405-21 = "[s] «Вот это проблема. И как нам тогда туда добраться?»"
2003405-22 = "Хи-хи..."
2003405-23 = ""
2003405-25 = ""
2003405-27 = "На одолженной машине!"
2003405-28 = "[s3] «Э-э, чего?!»\n[s4] «Ты ведь правда её одолжила, да?»"
2003405-31 = "Да! Конечно же я её «одолжила». ★"
2003405-32 = "Когда закончим, я поставлю её обратно. Не волнуйтесь! ★"
2003405-33 = "[s] «Ты уверена, что одалживать вещи нужно именно так?!»"
2003405-37 = "Мы приехали! Станция отдыха должна быть где-то рядом."
2003405-38 = "Хм... Здесь так тихо и спокойно."
2003405-39 = "...Для такого популярного места тут как-то совсем не оживлённо. ★"
2003405-40 = "[s] «Удон! Удон! Пойдём есть удон!»"
2003405-41 = "Да-да, конечно, Сенсей. Мы ведь за этим сюда и приехали!"
2003405-42 = "Так... Судя по онлайн-карте... ресторан должен быть в той стороне."
2003405-44 = "Два новогодних удона для вас."
2003405-45 = "Хорошо, приятного аппетита!"
2003405-46 = "[s] «Спасибо!»"
2003405-47 = ""
2003405-49 = ""
2003405-50 = ""
2003405-51 = "Хм..."
2003405-52 = "..."
2003405-53 = ""
2003405-55 = ""
2003405-56 = "Вкусно!"
2003405-57 = "[s] «Он определённо отличается от удона, который я пробовал раньше!»"
2003405-58 = "Думаю, секрет в том, что горячий бульон заливают на холодную лапшу. Так её легче быстро есть."
2003405-59 = "А поскольку лапша оставалась холодной, она всё ещё упругая."
2003405-60 = "Though, noodles are thicker than usual. Cooking them while keeping them firm must've been difficult."
2003405-61 = "То, что им это удалось, многое говорит о мастерстве этого ресторана."
2003405-62 = "И рыбный пирожок, и креветочная тэмпура приготовлены отлично. А кажущийся простым бульон на самом деле ещё сильнее подчёркивает вкус начинки и лапши."
2003405-63 = "[s] \"Wow, you sounded different from usual, Akari!\""
2003405-64 = "Хи-хи. Я ведь не просто так состою в Обществе гурманов."
2003405-65 = "Правда, количество я всё ещё предпочитаю качеству, но..."
2003405-66 = "По крайней мере, я понимаю, что такое изысканная еда."
2003405-67 = "Конечно... Стать номером один не так-то просто."
2003405-68 = "[s] «По-моему, ты и так хороша, Акари.»"
2003405-69 = "Хи-хи. Спасибо, Сенсей."
2003405-70 = ""
2003405-72 = ""
2003405-73 = ""
2003405-74 = ""
2003405-75 = "И всё же..."
2003405-76 = "...Не могу отделаться от ощущения, что этого удона слишком мало."
2003405-77 = "[s] «...Ага. Я так и думал, что ты это скажешь.»"
2003405-78 = "Вы двое тоже идёте в удон-тур?"
2003405-79 = "Удон-тур? А это что?"
2003405-80 = "Этот регион славится своим удоном... Здесь по всей округе множество удонных."
2003405-81 = "Некоторые путешественники даже говорят, что удонных у нас больше, чем магазинов у дома."
2003405-82 = "...!"
2003405-83 = "Понимаете, найти все хорошие, знаменитые или секретные удонные..."
2003405-84 = "...это и есть часть удон-тура!"
2003405-85 = "Именно. Если зайдёте на наш туристический сайт, там есть список всех местных ресторанов с удоном."
2003405-86 = "Не могу поверить, что мы случайно наткнулись на такой классный тур! ★"
2003405-87 = "Вы слышали, Сенсей?"
2003405-88 = "[s5] «...Ага, слышал.»\n[s6] «И даже знаю, что ты сейчас заставишь нас делать...»"
2003405-91 = "Начнём удон-тур прямо сейчас!"
2003405-92 = "[s] «Ладно, ладно...»"
2003405-94 = "Так и начался наш с Акари удон-тур."
2003405-95 = ""
2003405-96 = ""
2003405-97 = ""
2003405-98 = ""
2003405-100 = "В какой-то момент... я перестал считать, сколько удонных мы уже посетили..."
2003405-101 = ""
2003405-102 = ""
2003405-103 = ""
2003405-105 = "И это ещё не всё. Туристический сайт обещал сертификат тем, кто покорит все знаменитые удонные региона..."
2003405-106 = "Стоило Акари об этом узнать, как её глаза загорелись. Она ещё глубже погрузилась в мир удона!"
2003405-107 = ""
2003405-109 = "[ns] «Эй, Акари...»"
2003405-110 = "Да? Что такое, Сенсей?"
2003405-111 = "Ты правда собираешься поесть во всех знаменитых удонных этого региона?"
2003405-112 = "..."
2003405-113 = "Сенсей... Вы разве не слышали, что тех, кто не доедает новогоднюю собу, ждёт несчастье?"
2003405-114 = "[s] «Серьёзно?»"
2003405-115 = "Да, поэтому важно не оставлять на тарелке ни одной одинокой лапшинки."
2003405-116 = "По той же логике... мы ведь приехали сюда есть новогодний удон, верно?"
2003405-117 = "Значит, если мы оставим хоть немного удона... Если не покорим каждую удонную до единой..."
2003405-118 = "I have a feeling that something catastrophic might happen in the new year! ★"
2003405-119 = "[s] «По-моему, это просто оправдание, чтобы съесть как можно больше удона!»"
2003405-120 = "Да как вы могли такое подумать! За кого вы меня принимаете? ★"
2003405-123 = "С этими словами удон-тур Акари... продолжался до самого заката..."
2003405-125 = "И наконец..."
2003405-126 = ""
2003405-127 = "Мы сделали это, Сенсей! Мы получили сертификат покорителя удона!"
2003405-128 = "[s7] «Не думал, что мы справимся...»\n[s8] «Нет. Мне вообще не стоило в тебе сомневаться!»"
2003405-131 = "...Только вот день уже закончился."
2003405-132 = ""
2003405-134 = ""
2003405-135 = ""
2003405-136 = "Что делать, Сенсей?"
2003405-137 = "I'm...not too confident about driving at night."
2003405-138 = ""
2003405-142 = "В итоге мы заночевали в скромной гостинице неподалёку."
2003405-143 = "Нас накрыла, пожалуй, самая эпичная пищевая кома в жизни..."
