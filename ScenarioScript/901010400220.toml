[translation]
901010400220-6 = "Эм..."
901010400220-7 = "А, ты та самая девушка-курьер, что была здесь раньше?"
901010400220-8 = "Нашла пропавший мешок с опилками?"
901010400220-9 = "Да, он лежал в пустом переулке вместе с другими вещами."
901010400220-10 = "Если предположить... Может, кто-то принял его за мусорный пакет? Там рядом лежало ещё несколько, вон там."
901010400220-11 = ""
901010400220-13 = ""
901010400220-14 = "Правда? Какое облегчение... Огромное спасибо!"
901010400220-15 = "Мы уже боялись, что придётся выбросить всех этих крабов... Ты нас спасла!"
901010400220-16 = "Да что вы. Я просто рада помочь!"
901010400220-17 = "Кстати, почему крабов перевозят в опилках? Звучит довольно... сухо."
901010400220-18 = "Для перевозки. Крабы очень чувствительны к ударам."
901010400220-19 = "Несмотря на твёрдый панцирь, даже небольшая встряска или удар могут убить краба."
901010400220-20 = "Поэтому мы укладываем вокруг них толстый слой опилок. Он смягчает удары по панцирю и поглощает вибрации."
901010400220-21 = "И ты верно заметила! Мы их ещё и смачиваем. Опилки удерживают влагу, поэтому для перевозки крабов подходят ещё лучше. Им так... относительно комфортно и всё такое."
901010400220-23 = "Понятно...! Как интересно."
901010400220-24 = "А, точно. Кстати, вы когда-нибудь слышали о перевозке крабов в бочках?"
901010400220-25 = "Крабы в бочке...? Никогда о таком не слышал."
901010400220-26 = "Правда? Странно. Кажется, бочка была бы намного устойчивее ящика..."
901010400220-27 = "Может быть... Но бочки слишком тяжёлые."
901010400220-28 = "Чем больше вес, тем выше стоимость доставки. Так что нет смысла использовать бочку вместо дешёвого деревянного ящика, разве нет?"
901010400220-29 = "К тому же, если набить бочку крабами, воздух не будет циркулировать. Те, что окажутся внизу, задохнутся. Уф... жестоко."
901010400220-30 = "Понятно... Если так подумать, история о крабах в бочке действительно звучит как нечто, во что поверит только человек, ничего не понимающий в биологии крабов."
901010400220-31 = "Ты серьёзно хочешь сказать, что люди сплетничают о логистике перевозки крабов? Видимо, совсем скучно живут."
901010400220-32 = "Фуфу, у всех разные интересы."
901010400220-33 = "А, точно. Чуть не забыла."
901010400220-34 = ""
901010400220-36 = ""
901010400220-37 = "В знак благодарности за вашу увлека— кхм, ПОЗНАВАТЕЛЬНУЮ историю хочу предложить вам этот бэнто с инаризуси от Yoshino Inarizushi. На FOX EATS он настоящий хит!"
901010400220-38 = "Я... я не могу! Как я могу отнять у тебя еду, если ты нам помогал?"
901010400220-39 = "Всё входит в работу, мэм! Считайте это специальной акцией."
901010400220-40 = "Если уж на то пошло... Если оставите положительный отзыв в соцсетях и отметите нас, это будет просто замечательно!"
901010400220-41 = "Конечно оставлю. Огромное спасибо! Выглядит отлично!"
901010400220-42 = "Хорошего дня!"
