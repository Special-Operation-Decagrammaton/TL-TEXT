[translation]
901010400220-6 = "Com licença..."
901010400220-7 = "Opa! Achou os sacos de serragem?!"
901010400220-8 = "Foi rápido demais, menina!"
901010400220-9 = "Sim, tinham jogado tudo num terreno baldio ali perto."
901010400220-10 = "Acho que alguém confundiu com sacos de entulho."
901010400220-11 = ""
901010400220-13 = ""
901010400220-14 = "É sério?! Puxa vida, salvou a minha pele... muito obrigado!"
901010400220-15 = "No pior dos cenários a carga inteira de caranguejos ia pro lixo... Você foi um anjo!"
901010400220-16 = "Imagina, fico muito feliz em poder ter ajudado."
901010400220-17 = "A propósito, por que vocês colocam os caranguejos no meio da serragem?"
901010400220-18 = "É porque o caranguejo é um bicho muito frágil a impactos."
901010400220-19 = "Mesmo com a carapaça durinha, qualquer solavanco mais forte no transporte já pode matar o bicho."
901010400220-20 = "Por isso a gente forra os caixotes com uma camada grossa de serragem, pra amortecer o balanço do caminhão."
901010400220-21 = "Sem falar que a serragem retém umidade. #nCria o ambiente perfeito pra manter o caranguejo respirando e fresco."
901010400220-23 = "Entendi... que interessante!"
901010400220-24 = "E me diz uma coisa... você já ouviu alguma história sobre transportar caranguejos dentro de tambores de óleo?"
901010400220-25 = "Caranguejo dentro de tambor de óleo...? Nunca ouvi falar de uma sandice dessas."
901010400220-26 = "Não daria certo num tambor?"
901010400220-27 = "Poder, até pode... mas tambor de metal é pesado pra dedéu."
901010400220-28 = "Mais peso encarece o frete do combustível, ninguém jogaria dinheiro fora desse jeito sem motivo."
901010400220-29 = "E diferente da caixa de madeira, tambor não tem fresta de ventilação. Se empilhar um monte, os caranguejos do fundo morrem sufocados em minutos."
901010400220-30 = "Faz todo sentido... Então o tal \"Caranguejo de Tambor de Óleo\" é o tipo de história que só quem não entende nada de caranguejo acreditaria."
901010400220-31 = "Caranguejo de tambor? Que conversa de doido. O povo tem tempo sobrando pra inventar besteira, viu..."
901010400220-32 = "Hihi, cada um com sua imaginação, né."
901010400220-33 = "Ah, quase me esqueci!"
901010400220-34 = ""
901010400220-36 = ""
901010400220-37 = "Como forma de agradecimento por essa explicação tão enriquecedora... #nGostaria de lhe presentear com esta marmita de inarizushi do famoso Yoshino Inari pelo FOX EATS!"
901010400220-38 = "O quê?! Mas eu nem te agradeci direito por achar os sacos de serragem... não posso aceitar assim!"
901010400220-39 = "Não se acanhe, é parte da nossa campanha promocional."
901010400220-40 = "Se quiser retribuir a gentileza... basta deixar uma avaliação positiva nas redes sociais!"
901010400220-41 = "Pode deixar, com certeza farei isso! Muito obrigado pelo rango!"
901010400220-42 = "Imagina, tenha um excelente dia de trabalho!"
