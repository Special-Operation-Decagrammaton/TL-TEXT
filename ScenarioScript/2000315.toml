[translation]
2000315-1 = "Урок из прошлого"
2000315-3 = "Я проходил через площадь и увидел Маширо, сидевшую на скамейке."
2000315-4 = "[ns1] «Похоже, она что-то читает...»\n[ns2] «(Надо поздороваться.)»"
2000315-5 = ""
2000315-6 = ""
2000315-9 = ""
2000315-10 = "[ns] «Привет, Маширо!»"
2000315-11 = ""
2000315-12 = "О, Сенсей."
2000315-13 = "Я не знала, что вы собираетесь посетить Тринити. Если бы вы сообщили мне, я бы пришла вас встретить."
2000315-14 = "...Хотя теперь это уже неважно, раз мы всё равно встретились здесь."
2000315-15 = "[s3] «Я тоже рад тебя видеть.»\n[s4] «Что за книгу ты читала?»"
2000315-18 = "О, моя книга?"
2000315-19 = "Н-немного неловко, но..."
2000315-20 = ""
2000315-22 = ""
2000315-23 = ""
2000315-25 = "Это... вот такая... книга."
2000315-26 = "В ней собраны разные пословицы и четырёхзнаковые идиомы."
2000315-27 = "...Вам кажется это интересным?"
2000315-28 = "..."
2000315-29 = ""
2000315-31 = ""
2000315-33 = ""
2000315-34 = "Фу-фу, да. Мне она кажется очень увлекательной."
2000315-35 = "Недавно я даже посоветовала её Хасуми."
2000315-36 = "Правда, не думаю, что она её прочитала..."
2000315-37 = "[s] «Наверное, тебе очень нравятся пословицы и старые истории.»"
2000315-38 = "Да, очень. Пословицы и четырёхзнаковые идиомы хороши, но сильнее всего меня увлекают старые истории."
2000315-39 = "В старых историях заключены уроки, передававшиеся из поколения в поколение."
2000315-40 = "Как говорится, через прошлое можно увидеть будущее. Старые истории способны указать нам правильный путь."
2000315-41 = "[s] «Ух ты...»"
2000315-42 = "А самое лучшее в них то, что..."
2000315-43 = "...большинство пословиц несут мысль о неизбежности справедливости и награде за добрые дела!"
2000315-44 = "[s] «А, и правда. По крайней мере большинство...»"
2000315-45 = "Да, это универсальная истина: справедливость всегда побеждает."
2000315-46 = "Поэтому я любила пословицы с самого детства."
2000315-47 = "[s5] «Понимаю.»\n[s6] «Наверное, они действительно тебя заворожили.»"
2000315-50 = ""
2000315-52 = ""
2000315-53 = ""
2000315-54 = ""
2000315-55 = "Даже во время клубных занятий я часто цитирую пословицы или поговорки..."
2000315-56 = "Правда, тогда меня дразнят старушкой или вообще полностью игнорируют..."
2000315-57 = "Но я знала, что вы меня поймёте."
2000315-58 = ""
2000315-60 = ""
2000315-61 = "...Вам интересно, и вы хотите одолжить её?"
2000315-62 = "Да, конечно!"
2000315-63 = "Хи-хи..."
2000315-64 = "Подумать только, вам нравится то же, что и мне. От этого я чувствую себя..."
2000315-65 = "..."
2000315-66 = "Эм... Это замечательное чувство."
2000315-67 = "Д-да, очень замечательное."
2000315-69 = "Перед моим уходом мы с Маширо ещё немного поговорили о её любимых старых историях."
