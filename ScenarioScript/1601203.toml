[translation]
1601203-1 = "Больше еды, больше веселья! Больше меня?"
1601203-2 = "Ты опоздал, Сенсей!"
1601203-3 = ""
1601203-5 = ""
1601203-6 = "Мне придётся отплатить вам за это!"
1601203-7 = "[s] «Твоё обещание звучит так страшно... *всхлип*»"
1601203-8 = "Э-Эй! Чего вы плачете? Всё будет нормально!"
1601203-9 = "Я-Я просто пошутила..."
1601203-10 = "Так что хватит фальшиво всхлипывать! Я вижу, что вы делаете!"
1601203-11 = "[s] «Почему мы не пошли на новогодний фестиваль?»"
1601203-12 = "Зачем идти туда, если можно прийти на..."
1601203-13 = "...эту с виду совершенно случайную улицу!"
1601203-14 = "[s] «С виду случайную?»"
1601203-15 = "Когда слышите «новогодняя еда», что первым приходит в голову?"
1601203-16 = "Что? Капуста? Нет, я хотела, чтобы вы сказали осэти, озони... что-нибудь такое."
1601203-17 = "И не поймите меня неправильно, всё это, конечно, очень вкусно."
1601203-18 = "Но... мне это уже надоело! Иногда буквально до отвала! Я состою в Обществе исследования гурманов! Я не просто ем — я исследую еду!"
1601203-19 = "А когда исследовать лучше, чем в начале нового года?"
1601203-20 = "[s] «Теперь, когда я осмотрелся, эта улица...?!»"
1601203-21 = "Хе-хе-хе... Вы заметили!"
1601203-22 = "Да! Здесь можно найти особые новогодние блюда, которых больше нигде не достать!"
1601203-23 = "Итак, Сенсей! Какую еду исследуем первой?"
1601203-24 = "Я задолжала вам после прошлого раза в L'Oiseau Bleu, так что сегодня плачу я!"
1601203-25 = "Эм, я-то задолжала... но давайте всё-таки в пределах моего бюджета, хорошо?"
1601203-28 = "О... Что это за пельмени?"
1601203-29 = "Они называются цзяоцзы!"
1601203-30 = "Тофу и капуста — для года без несчастных случаев, а арахис — для семейной удачи."
1601203-31 = "Лапша — для долголетия, а клейкий рисовый пирог — чтобы желания исполнились!"
1601203-32 = "Так какую удачу вы хотели бы получить?"
1601203-33 = "П-Понятно... Что возьмём, Сенсей?"
1601203-34 = "Главное — избежать любых несчастных случаев, чтобы спокойно наслаждаться вкусной едой? Это правда..."
1601203-35 = "Тогда две порции цзяоцзы с тофу и капустой!"
1601203-37 = "О? Что это так аппетитно пахнет?"
1601203-38 = ""
1601203-40 = ""
1601203-41 = "Это называется «Хоппин Джон»."
1601203-42 = "Обжаренные и тушёные бобы, свинина и листовая зелень."
1601203-43 = "Бобы символизируют монеты, а зелень — бумажные деньги."
1601203-44 = "Это блюдо едят, желая богатства."
1601203-45 = "Тогда мне нужно съесть как можно больше..."
1601203-46 = "Две порции, пожалуйста!"
1601203-48 = "...Что это за невероятный пирог?"
1601203-49 = "Он называется Galette des Rois. Это значит «Королевский пирог»."
1601203-50 = "Хрустящее слоёное тесто, начинённое масляно-миндальным кремом."
1601203-51 = "Ого..."
1601203-52 = "Внутри пирога спрятан маленький талисман, называемый fève."
1601203-53 = "Если найдёшь его, сможешь стать королём."
1601203-54 = "А что я получу, став королём?"
1601203-55 = "Ещё один пирог."
1601203-56 = "Хм... Тогда два кусочка!"
1601203-58 = "Было вкусно!"
1601203-59 = "[s] «Похоже, тебе очень понравилось!»"
1601203-60 = "Да! Всё было вкусным и необычным..."
1601203-61 = "Необычным..."
1601203-62 = ""
1601203-64 = ""
1601203-65 = ""
1601203-67 = ""
1601203-68 = "[s] «Джунко?»"
1601203-69 = "У-Ух...!"
1601203-70 = "Не могу... Не могу дышать..."
1601203-71 = "[s] «Ч-Что случилось?!»"
1601203-72 = "Ч-Что мне делать, Сенсей?!"
1601203-73 = "Кажется... я переела!"
1601203-75 = "Джунко побледнела, поэтому я принёс ей лекарство, которое вполне могло оказаться плацебо."
1601203-77 = "Фух... Спасибо, Сенсей. Мне намного лучше."
1601203-78 = "Уф... Простите, что испортила наше гастрономическое путешествие..."
1601203-79 = "[s] «Главное, что тебе понравилось, Джунко.»"
1601203-80 = "Правда? ...Вы не просто так говорите?"
1601203-81 = "В любом случае до завтра я больше ничего не смогу съесть."
1601203-82 = "Почему?! Почему я не могу есть столько же, сколько Акари?! Будь проклято это маленькое тело!"
1601203-84 = "По дороге обратно в Шале я утешал Джунко."
