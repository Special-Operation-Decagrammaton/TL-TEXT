[translation]
1009303-1 = "Уверенный подход Кирары"
1009303-9 = ""
1009303-10 = "Эй, Учитель... Эй..."
1009303-11 = "*вздыхает*"
1009303-12 = "[ns1] «Куда делась вся твоя обычная энергия?!»\n[ns2] «Никогда не видел тебя такой подавленной, Кирара!»"
1009303-15 = ""
1009303-17 = ""
1009303-18 = "Ха-ха... Я надеялась, что смогу сделать вид, будто всё нормально, но, похоже, не вышло."
1009303-19 = "В общем, помните тот тест, о котором я говорила в MomoTalk? Тот, который я полностью завалила...?"
1009303-20 = "То есть я никогда не была образцовым студентом, но всегда хотя бы следила за тем, чтобы не провалиться."
1009303-21 = "Наверное, это было... немного шокирующе?"
1009303-22 = "[s] «Вопросы были сложными?»"
1009303-23 = "Не особо... Они были не такие уж трудные, но..."
1009303-24 = "Я не поняла, сколько всего будет охвачено!"
1009303-25 = "[s] «Что ты имеешь в виду?»"
1009303-26 = "Ну, эм, как сказать? Хи-хи! В ночь перед тестом я устроила пижамную вечеринку с подругами... учебную пижамную вечеринку!"
1009303-27 = "[s] «Это прямо на тебя похоже, Кирара!»"
1009303-28 = "Мы тусовались, немного болтали, много занимались..."
1009303-29 = "Я правда очень усердно училась!"
1009303-30 = "А потом на следующий день открыла тест... и поняла, что там гораздо больше материала, чем я думала! Понимаете?!"
1009303-31 = "[s] «А... Такое иногда бывает...»"
1009303-32 = "Вот поэтому я и провалилась! Разве это не супернесправедливо?"
1009303-33 = "В общем, в общем!"
1009303-34 = "Помогите мне с учёбой! Ладно? Пересдача через неделю!"
1009303-35 = "Если буду заниматься одна, точно усну, а если с подругами — мы реалистично просто будем тусоваться и веселиться."
1009303-36 = "Так что помочь мне можете только вы, Учитель!"
1009303-37 = "[s3] «Хорошо. Я в деле.»\n[s4] «Конечно! Репетиторское занятие начинается!»"
1009303-40 = ""
1009303-42 = ""
1009303-43 = "Спасибо, Учитель! Суперобещаю очень стараться."
1009303-45 = "При таких обстоятельствах я начал заниматься с Кирарой в комнате отдыха Шале."
1009303-46 = ""
1009303-52 = ""
1009303-53 = "Ого! Поняла... Если использовать это уравнение, всё вообще легко!"
1009303-54 = "Откуда вы всё это знаете, Учитель?"
1009303-55 = "[s] «Потому что у меня есть лист с ответами?»"
1009303-56 = "Что за дела! Это же читерство!"
1009303-57 = "Ха-ха-ха! Я шучу! Шучу!"
1009303-58 = ""
1009303-60 = ""
1009303-61 = ""
1009303-62 = "[ns] «(А...?)»"
1009303-63 = "Помогите и со следующим вопросом! Когда вы объясняете, всё идёт намного быстрее!"
1009303-64 = "Если повернуть фигуру боком, будет проще?"
1009303-65 = "Куда? Как?"
1009303-66 = ""
1009303-68 = ""
1009303-69 = "Ого! Если самой повернуться и посмотреть сбоку, действительно понятнее! Как круто!"
1009303-70 = "Ха-ха-ха! Как я раньше этого не замечала?"
1009303-71 = "[s] «(Эм, Кирара так близко ко мне... Э-э...)»"
1009303-72 = ""
1009303-74 = ""
1009303-75 = "Учитель."
1009303-76 = "[s] «...Да?»"
1009303-77 = ""
1009303-78 = "Ваши руки выглядят намного больше моих, давайте сравним?"
1009303-79 = "Так, положите ручку! Всего на секундочку."
1009303-80 = ""
1009303-82 = ""
1009303-83 = "Вытяните руку, а я приложу к ней свою..."
1009303-84 = "Ва?! Они почти одинаковые..."
1009303-85 = "Ха-ха-ха! Но ваши руки теплее моих! Приятно!"
1009303-86 = "[ns] «(Как и ожидалось, у неё вообще нет чувства личных границ...!)»"
1009303-87 = ""
1009303-89 = ""
1009303-90 = "Что у вас за лицо, Учитель? Будто призрака увидели. Что такое?"
1009303-91 = "Ха-ха-ха! Случайно..."
1009303-92 = "Вы не НЛО за окном увидели?!"
1009303-93 = "[s] «Вообще-то... Эм, Кирара. По-моему, мы сейчас... немного слишком близко...»"
1009303-94 = "Что близко? Близко к тому, чтобы сдать пересдачу? Надеюсь!"
1009303-95 = "[s5] «Д-Да! Именно это я и имел в виду...» \n[s6] «(Кирара просто сосредоточена на том, чтобы сдать тест...)»"
1009303-98 = "Ха-ха-ха! Хватит так переживать, Учитель! Я отплачу за ваши старания идеальным баллом!"
1009303-99 = "Ладно! Следующий вопрос!"
1009303-101 = "Занятие и правда закончилось хорошо..."
1009303-102 = "...но полное отсутствие личных границ у Кирары оказалось довольно ошеломляющим. Всё прошло как в тумане."
