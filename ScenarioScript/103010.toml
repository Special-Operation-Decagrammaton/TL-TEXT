[translation]
103010-1 = "Эпизод 1; Роли"
103010-2 = ""
103010-4 = "Где-то на Великом снежном поле Хяккияко"
103010-7 = "Мы должны быть уже близко к месту, о котором говорила Ния..."
103010-8 = "Президент! Цукуё! Я заметила, что монстров уже какое-то время становится меньше. Правда?"
103010-9 = "Хм? Если подумать, действительно похоже на то..."
103010-10 = "Да-да! С тех пор как мы вошли на Великое снежное поле, враги встречаются всё реже..."
103010-11 = ""
103010-13 = ""
103010-14 = ""
103010-15 = "О, президент! Небо странное! Посмотрите!"
103010-16 = "П-Подождите...!"
103010-17 = ""
103010-25 = "Небо..."
103010-27 = "О-Оно снова стало нормальным!"
103010-28 = "Да! Господин справился!"
103010-30 = "Д-Думаешь?!"
103010-32 = "Сенсей из Шале сделал это!"
103010-33 = ""
103010-36 = "Ч-Что?! Враги появились ровно в тот момент, когда я начала праздновать?"
103010-37 = "Н-Нет! Это просто звук выстрелов..."
103010-38 = ""
103010-40 = ""
103010-43 = ""
103010-44 = "...Похоже, это был не враг. Прости."
103010-47 = "!"
103010-48 = "Аргх!"
103010-49 = "Ты на меня напала! Думаешь, одного извинения будет...!"
103010-50 = ""
103010-52 = ""
103010-53 = "...А?"
103010-55 = "К-Кто вы такие?"
103010-57 = "Мой вопрос к вам. Что ученики Хяккияко делают в такой глуши?"
103010-58 = "М-Мы..."
103010-59 = "Мы идём к Сумеречному храму! Пытаемся найти президента Хяккарёран!"
103010-60 = "Д-Да...! Сенсей из Шале... Он попросил нас..."
103010-62 = "...Вот как?"
103010-63 = ""
103010-65 = ""
103010-67 = ""
103010-68 = ""
103010-69 = "О! Я вспомнила, где уже видела это!"
103010-71 = "П-Президент...?!"
103010-73 = "Я думала, твоя форма выглядит знакомо!"
103010-74 = ""
103010-76 = ""
103010-78 = "Наверняка это форма Хяккарёран! Я права?!"
103010-79 = ""
103010-81 = ""
103010-83 = ""
103010-85 = "А? Хяккарёран?"
103010-86 = "Т-Тогда... вы...?"
103010-88 = "Н-Не думаю..."
103010-89 = "Хотя я не очень хорошо помню, Аямэ, президент Хяккарёран... была не такой... холодной? Она была скорее... элегантной светской дамой..."
103010-90 = "О. Но вице-президент как раз была похожа на неё!"
103010-92 = "Вице-президент?"
103010-93 = "В-Вы вице-президент Хяккарёран?"
103010-95 = "Нет."
103010-97 = "А? Вы не она?"
103010-99 = "Верно. Вы ошиблись человеком."
103010-100 = "Не может быть! Не врите нам! Я знаю, что это форма Хяккарёран! Тогда почему вы её носите?!"
103010-101 = "Это..."
103010-102 = "...это косплей."
103010-104 = "Хм..."
103010-105 = "Понятно...! Это..."
103010-107 = "Изуна, не ведись! Слишком уж невероятное совпадение!"
103010-108 = "Ну, подобные совпадения всё же возможны."
103010-109 = "Упорные косплееры готовы отправиться куда угодно — хоть на Великое снежное поле Хяккияко, хоть в огромную пустыню Абидос, хоть в океан Odyssey — ради идеального снимка."
103010-111 = "Ч-Что... Как круто! Дух настоящего косплеера!"
103010-112 = "Э-Это потрясающе...!"
103010-114 = "Ну... наверное, ты права..."
103010-115 = "Но если это правда, где твоя камера?! У тебя вообще нет оборудования!"
103010-117 = "Это..."
103010-118 = "Мне не нужны столь материальные проявления моего косплея. Я сохраняю драгоценные воспоминания в своём сердце."
103010-120 = "Тогда какой смысл тащиться сюда ради косплея и фотографировать воображаемой камерой сердца?!"
103010-121 = "Вы... Вы просто пытаетесь нас обмануть?!"
103010-123 = "...!"
103010-124 = "У-ух..."
103010-126 = "П-Президент?! Уверена, у неё есть объяснение!"
103010-127 = "Я-я не хотела её обидеть... просто странно, что у неё нет камеры. Если хочет, я могу дать ей свою..."
103010-129 = "Я... просто..."
103010-130 = ""
103010-132 = ""
103010-134 = "*кашляет*...!"
103010-136 = "Э-Эм, вы в порядке?"
103010-137 = "Думаю, ничего страшного, если не делать фотографии. Просто н-носить хороший косплей уже приятно, и это нормально...!"
103010-138 = "...Оставьте меня в покое."
103010-140 = "Ой! П-Простите...!"
103010-142 = "Я Горё Нагуса, вице-президент Хяккарёран."
103010-143 = "Я пришла сюда одна из-за... обстоятельств."
103010-144 = "...Так вы всё-таки из Хяккарёран."
103010-145 = "Думаю, я понимаю вашу ситуацию, Клуб исследования ниндзюцу. Но всё бессмысленно, так что возвращайтесь туда, откуда пришли."
103010-146 = "Ч-Что?! Почему...?"
103010-147 = "Сумеречный храм был уничтожен очень давно. Скорее всего, он погребён под многими метрами снега где-то на этих полях."
103010-149 = "Что?! Э-Это..."
103010-151 = "Есть другой способ найти президента...?"
103010-153 = "Нет."
103010-154 = "Так что повторяю: возвращайтесь. И никому не рассказывайте о встрече со мной здесь."
103010-155 = "Н-Но мы не можем вернуться с пустыми руками... Мы пришли сюда по просьбе Шале..."
103010-156 = "Шале... Да... Я слышала о Шале."
103010-157 = "Если так... Тогда..."
103010-158 = ""
103010-160 = ""
103010-161 = "Передайте это вашему Сенсею."
103010-163 = "...Старый свиток?"
103010-164 = "...Не спрашивайте. Я не знаю его содержимого."
103010-165 = "Президент Аямэ хотела, чтобы он достался Сенсею из Шале. Внутри есть послание для него."
103010-166 = "К-Кто вам это сказал? Откуда они знали, что мы сюда придём...?"
103010-167 = "..."
103010-168 = ""
103010-170 = ""
103010-171 = "Теперь это ваша ответственность. Тогда..."
103010-172 = ""
103010-174 = ""
103010-176 = "Она ушла..."
103010-177 = "Что там написано?"
103010-178 = "М-Можно прочитать?"
103010-179 = "Почему нет? Он ведь даже не запечатан."
103010-180 = ""
103010-182 = ""
103010-183 = "Так, посмотрим..."
103010-184 = ""
103010-186 = ""
103010-187 = ""
103010-194 = ""
103010-195 = "[ns] «...Широко?»"
103010-196 = "..."
103010-197 = "Впечатляет. Вы добрались так далеко, Сенсей."
103010-198 = "Но будущее уже определено. Вы не можете изменить то, что записано судьбой. Кивотос падёт."
103010-199 = "[s] «Широко! Подожди, ты...»"
103010-200 = "Вы ошибаетесь, Сенсей."
103010-201 = "[s] «Если ты не... Тогда откуда знаешь, кто я?»"
103010-202 = "...Вы можете обманывать себя, думая, что я попала под контроль Chroma. Но вы ошибётесь."
103010-203 = ""
103010-205 = ""
103010-206 = "Это я. Это моя воля."
103010-207 = "Мне была дарована роль привести этот мир к предопределённому будущему, а Chroma — лишь один из многих доступных мне способов."
103010-208 = "Не я под контролем Chroma. Это Chroma под моим."
103010-209 = "[s] «...!»"
103010-210 = "Моя роль — провести всю жизнь в загробный мир. Судьба этого мира была предрешена в тот момент, когда в нём появилась Сунаоками Широко."
103010-211 = ""
103010-215 = ""
103010-217 = "Мир... Вселенная вращается согласно нерушимым законам. Будущее предопределено. Ваше сопротивление тщетно."
103010-218 = "...Я прошу вас покинуть Кивотос — без протеста, без борьбы. Я не хочу причинять вам вред."
103010-219 = "Не все будущие предопределены. Если вы уйдёте, будущее, где мне придётся застрелить Сенсея из Шале, не наступит."
103010-220 = "[s] «...!!!»"
103010-221 = "Эта роль была дарована мне — привести вас сюда и сопроводить к последним мгновениям."
103010-228 = "Вы должны понимать. Когда наконец придёт время исполнить мою роль, я не поколеблюсь нажать на спуск."
103010-229 = "Поэтому..."
