[translation]
2005905-1 = "Бесёнок и глэмпинг"
2005905-2 = "Я не мог перестать думать о сообщении и отправился в отель Муцуки."
2005905-3 = ""
2005905-7 = ""
2005905-8 = "Лобби отеля"
2005905-9 = ""
2005905-10 = ""
2005905-12 = "[ns] «(Эта комната?)»"
2005905-14 = "А? Кто там?"
2005905-15 = "Сенсей? В такой час?"
2005905-19 = "Хм? Так вы и правда пришли."
2005905-20 = "Вы серьёзно? Просто приходите в номер отеля, где одна остановилась милая девушка?"
2005905-21 = "Куфуфу. Смело, Сенсей."
2005905-22 = "[s] «Ты правда в порядке? Ничего не случилось?»"
2005905-23 = "...А? Вы переживали?"
2005905-24 = "Ахаха. Да ничего. Дело было так..."
2005905-27 = ""
2005905-28 = ""
2005905-29 = ""
2005905-30 = ""
2005905-31 = ""
2005905-37 = "Я совершенно невинно... проверяла, не осталось ли ещё перекупщиков бомб. И нашла одну банду."
2005905-38 = "Оказалось, они хотели купить оружие. А потом с его помощью взять ВАС в заложники и, может, потребовать выкуп."
2005905-39 = "Но не переживайте. Я всех уничтожила. Вы в безопасности!"
2005905-40 = "И ещё конфисковала все деньги, которые они заработали на перепродаже."
2005905-41 = "Вот. Смотрите."
2005905-43 = ""
2005905-46 = "Её сумка была набита деньгами."
2005905-47 = ""
2005905-49 = ""
2005905-50 = "[ns] «Э-Это намного больше, чем я ожидал.»"
2005905-51 = "Куфуфу. Правда?"
2005905-52 = "Поэтому я решила на всякий случай залечь на дно в отеле. И подумала, почему бы не выбрать хороший."
2005905-53 = "Здесь отличная охрана. Да и они наверняка ищут пропавшую добычу."
2005905-54 = "[s] «Что ты собираешься делать с деньгами?»"
2005905-55 = "Это бесхозные деньги, владельца которых нельзя установить, разве нет?"
2005905-56 = "Разве я своим трудом не заслужила достойную компенсацию?"
2005905-57 = "Правда ведь, Сенсей?"
2005905-58 = "[s1] «Ты уверена, что так можно?»\n[s2] «Присваивать деньги вот так — немного...»"
2005905-59 = "О? Правда?"
2005905-60 = "Куфуфу. Я знала, что вы так скажете."
2005905-61 = "Но я уже об этом подумала."
2005905-62 = "Мне кажется, если я оставлю деньги себе..."
2005905-63 = "...это будет скучно!"
2005905-64 = "[ns] «...А?»"
2005905-65 = "Подумайте. Если заберу их, придётся вложить в бюджет клуба. А это так... уныло."
2005905-66 = "Решалам 68 нужны свои проблемы. Именно поэтому с нами весело!"
2005905-67 = "Так что держите это в секрете, хорошо? Куфуфу."
2005905-68 = "[s] «Тогда что ты с ними сделаешь?»"
2005905-69 = "И это я уже решила! Все эти деньги..."
2005905-70 = "...должны достаться вам, Сенсей!"
2005905-73 = "― [log=무츠키 드레스]Знаете? Несмотря ни на что...[/log][wa:1930]"
2005905-75 = "― [log=무츠키 드레스]...я очень вам доверяю, Сенсей.[/log][wa:1450]"
2005905-78 = "― [log=무츠키 드레스]А? Удивила?[/log][wa:818]"
2005905-80 = "― [log=무츠키 드레스]Потому что я постоянно разыгрываю людей?[/log][wa:10]"
2005905-83 = "― [log=무츠키 드레스]Куфуфу. Я не каждому такое говорю.[/log][wa:1555]"
2005905-86 = "― [log=무츠키 드레스]Поэтому... что делать с деньгами, решать вам.[/log][wa:4456]"
2005905-88 = "― [log=무츠키 드레스]Уж вы-то точно найдёте им хорошее применение.[/log][wa:2028]"
2005905-91 = "― [log=무츠키 드레스]Можете пожертвовать...[/log][wa:434]"
2005905-93 = "― [log=무츠키 드레스]...или даже потратить на свои увлечения.[/log][wa:609]"
2005905-96 = "― [log=무츠키 드레스]Если ничего не нравится, просто оставьте себе.[/log][wa:1045]"
2005905-98 = "― [log=무츠키 드레스]Никогда не рано начинать копить на наше будущее, правда?[/log][wa:1522]"
2005905-101 = "― [log=무츠키 드레스]Хм? Что это значит?[/log][wa:1600]"
2005905-104 = "― [log=무츠키 드레스]Куфуфу! Интересно.[/log][wa:1515]"
2005905-106 = "― [log=무츠키 드레스]Что бы это могло значить? ♪[/log][wa:10]"
2005905-110 = "Даже после этого я подыгрывал шалостям Муцуки в отеле."
2005905-111 = "На всякий случай я остался до позднего вечера... Но ничего опасного не произошло."
2005905-113 = ""
2005905-114 = ""
2005905-116 = "В знак поддержки я оплатил номер."
2005905-117 = "Хорошо, что ничего серьёзного не случилось."
