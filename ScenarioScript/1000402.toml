[translation]
1000402-1 = "Ночная встреча"
1000402-2 = "Я прибыл в центр Геенны на ночную встречу с Хиной."
1000402-3 = "В этот час вокруг никого не было."
1000402-4 = "Пустые улицы выглядели почти жутко."
1000402-5 = "[ns] «(Что Хина могла хотеть от меня посреди ночи?)»"
1000402-7 = ""
1000402-8 = "Сенсей."
1000402-9 = "[s1] «Привет, Хиниатюра!»\n[s2] «Похоже, ты пришла раньше меня.»"
1000402-10 = "Х-Хина-малютка? В смысле маленькая?"
1000402-11 = "Больше никогда меня так не называй. Мне от этого не по себе."
1000402-12 = ""
1000402-13 = "(кивает)"
1000402-14 = "Извини, что позвала тебя так поздно."
1000402-15 = "Я... довольно известна в Геенне. Меня узнают, куда бы я ни пошла."
1000402-16 = "Иногда мне кажется, что за каждым моим шагом следят."
1000402-17 = "Если нас увидят вместе, это только создаст проблемы."
1000402-18 = "Поэтому я и попросила встретиться в такое время."
1000402-19 = "[s] «Почти как будто ты айдол, Хина.»"
1000402-20 = "А-Айдол...? Я бы так не сказала..."
1000402-21 = "Я не из тех, кого называют милыми или эффектными."
1000402-22 = "..."
1000402-23 = "Но не могу сказать, что сравнение совсем неверное. Я знаю, каково это — не иметь времени на себя и постоянно следить за окружающими."
1000402-24 = "[s3] «Милой тебе определённо удаётся быть.»\n[s4] «Ты и сама довольно эффектная.»"
1000402-25 = "Ты правда умеешь говорить вещи, за которые потом хочется провалиться сквозь землю, да?!"
1000402-26 = "Ты правда умеешь говорить вещи, за которые потом хочется провалиться сквозь землю, да?!"
1000402-27 = "То, что ты здесь взрослый, не даёт тебе права говорить всё, что вздумается.#nНаучись себя вести!"
1000402-28 = "Хина ещё долго отчитывала меня."
1000402-29 = "[s5] «Но я говорил искренне.»\n[s6] «Я был серьёзен.»"
1000402-30 = "...А?"
1000402-31 = "...А?"
1000402-32 = "Почему ты... вдруг такой серьёзный?"
1000402-33 = "..."
1000402-34 = "Я-я не хотела сказать, что ты врёшь. Просто..."
1000402-35 = "...Я лучше всех знаю, что не милая."
1000402-36 = "...Хватит. Я позвала тебя не для разговоров о такой ерунде!"
1000402-37 = "Перейдём к делу."
1000402-38 = "(Рядом с Сенсеем я постоянно теряю концентрацию.)"
1000402-39 = ""
1000402-40 = "Позволь объяснить, зачем я тебя позвала."
1000402-41 = "Я хотела обсудить безопасность Геенны за этот квартал и попросить совета по плану совместного расследования на следующий квартал."
1000402-42 = "[s] «То есть поговорить о работе.»"
1000402-43 = "Разумеется. Зачем ещё мне тайно встречаться с тобой посреди ночи?"
1000402-44 = "[s] «Я думал, это свидание.»"
1000402-45 = ""
1000402-46 = "Сенсей..."
1000402-47 = "[s] «То есть... давай работать!»"
1000402-49 = "Я прочитал документы, которые принесла Хина, и обсудил их с ней."
1000402-51 = "Интересный взгляд. Спасибо за совет."
1000402-52 = "[s] «Мне кажется, я не особо помог...»"
1000402-53 = "Глупости. Взгляд со стороны помогает нам сохранять объективность."
1000402-54 = "Разумеется, твоё мнение для меня ценно."
1000402-55 = "Не каждый день удаётся получить прямую оценку от человека с опытом."
1000402-56 = "[s] «То есть ты мне доверяешь?»"
1000402-57 = ""
1000402-58 = "П-Почему бы мне не доверять...? Хотя для человека твоего возраста ты порой довольно легкомысленный."
1000402-59 = "Но не настолько, чтобы я отказалась снова просить твоего совета. Конечно, при условии, что мы будем встречаться только ночью."
1000402-60 = "[s7] «Конечно, можешь на меня рассчитывать.»\n[s8] «Звони в любое время.»"
1000402-61 = "Спасибо, Сенсей."
1000402-62 = "Спасибо, Сенсей."
1000402-63 = "*вздох* Уже поздно. Мне пора возвращаться и немного поспать."
1000402-64 = "До встречи, Сенсей."
1000402-66 = "Уставшая Хина попрощалась и отправилась домой."
