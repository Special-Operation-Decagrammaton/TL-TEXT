[translation]
11050-2 = "Episódio 5;Um Dia Comum de Serika"
11050-3 = "Área Residencial de Abydos - Distrito do Bloco 45"
11050-6 = "(Encontrei um rosto conhecido na área residencial de Abydos.)"
11050-7 = "Urgh... O-O quê...?!"
11050-8 = "[s] \"Bom dia.\""
11050-9 = "C-Como assim \"bom dia\"?! Dá pra não bancar o íntimo comigo?"
11050-10 = "Eu ainda não te aceitei, Sensei!"
11050-11 = "Francamente, zanzando por aí tranquilão logo de manhã.#nQue vida boa a sua, hein?"
11050-12 = "[s] \"Você está indo pra escola agora, Serika-chan?\""
11050-13 = "O-O quê?! Por que tá me chamando de \"-chan\"?!"
11050-14 = "O que eu faço ou deixo de fazer não é da sua conta, Sensei!"
11050-15 = "Se ficar perambulando por aqui logo de manhã, vão achar que você é o exemplo perfeito de adulto irresponsável, sabia?"
11050-16 = "Tchau! Aproveita aí pra ficar de boa, porque eu sou uma pessoa ocupada."
11050-17 = "Hã? Se eu estiver indo pra escola, é pra irmos juntos?"
11050-18 = "Olha aqui, por que diabos eu teria que ir pra escola de boas com você?!"
11050-19 = "Além do mais, sinto muito, mas hoje é dia de frequência livre, então nem preciso ir pra escola."
11050-20 = "Hã? Então pra onde eu tô indo? ...Até parece que eu vou te contar!"
11050-21 = "Então tchau, até mais."
11050-23 = "(Serika saiu correndo, levantando uma nuvem de poeira.)"
11050-24 = "[s] Ir atrás dela."
11050-26 = "Hyaaah?! P-Por que você tá me seguindo?!"
11050-27 = "\"Porque se eu te seguir, vou descobrir pra onde você vai\"?!"
11050-28 = "Que papo é esse?! Sai pra lá! Você é um stalker, por acaso?!"
11050-29 = "Tá bom! Tá bom, já entendi! Se eu te disser pra onde tô indo, você me deixa em paz, né?"
11050-30 = "...É pro meu trabalho de meio período."
11050-31 = "E-Eu não posso ficar de bobeira que nem você! Preciso ganhar nem que seja um pouquinho de dinheiro!"
11050-32 = "Satisfeito agora? Para de me seguir!"
11050-34 = "[s] Ir atrás dela."
11050-37 = "Uugh... Como você é insistente."
11050-38 = "...Hã? Você tá curioso pra saber onde eu trabalho?"
11050-39 = "Aaah, que saco! Não faz o menor sentido! Sai daqui! Adulto inútil!! Eu mandei sair daqui! Quer que eu acabe com você?!"
11050-41 = "(Serika saiu correndo, levantando poeira.)"
11050-43 = "Bem-vindo ao Lámen Shibasaki!"
11050-44 = "Mesa para quantos? Vou acompanhá-lo até um lugar livre!"
11050-45 = "Só um momento, por favor! Mesa 3, mais uma porção extra de macarrão!"
11050-46 = "(Porta abrindo)"
11050-47 = "Bem-vindos ao Lámen Shibasa..."
11050-48 = "U-Uwah?!"
11050-49 = "Com licença~ ☆ Somos em 5 pessoas~!"
11050-50 = "A-Ahaha... Bom trabalho, Serika-chan..."
11050-51 = "Bom trabalho."
11050-52 = "P-Pessoal... Como vocês sabem que eu tô aqui...?!"
11050-53 = "Uhee~ Sabia que ia ser aqui."
11050-54 = "[s] \"Olá.\""
11050-55 = "A-Até você, Sensei... Você é mesmo um stalker?!"
11050-56 = "Uhee, a culpa não é do Sensei, não~ Se a Serika-chan fosse fazer um bico, só podia ser aqui, né? Então resolvemos dar uma passada."
11050-57 = "Foi você, Hoshino-senpai...!! Uugh...!"
11050-59 = "São alunas de Abydos? Serika-chan, chega de papo e vai anotar o pedido delas."
11050-60 = "A-Argh... Sim, Mestre. Pois bem, vou acompanhá-los até uma mesa maior... Por aqui, por favor..."
11050-62 = "Aqui, Sensei, venha pra cá! O lugar do meu lado está livre!"
11050-63 = "...Nn, o lugar do meu lado também tá livre."
11050-64 = "[s1] Sentar ao lado de Nonomi.\n[s2] Sentar ao lado de Shiroko."
11050-65 = "(Ploft)"
11050-66 = "Hmm, está um pouquinho apertado, mas tudo bem, né?"
11050-67 = "Ah, está desconfortável? Se quiser, pode sentar no meu colo, viu?"
11050-68 = "O que vocês tão fazendo na loja dos outros?!"
11050-69 = "Ahaha, é brincadeira, Serika-chan ☆"
11050-70 = "Tem um monte de outros lugares livres! Sentem direito, todo mundo!"
11050-71 = "A-Ahaha... Tá boom."
11050-73 = "(Ploft)"
11050-74 = "Hmm..."
11050-75 = "Tá apertado demais! Shiroko-senpai, se ficar grudada assim o Sensei vai ficar espremido! Chega mais pra cá!"
11050-76 = "Não, eu tô de boa. Né, Sensei?"
11050-77 = "Por que você tá fazendo cerimônia justo agora?! Tem um monte de lugar livre! Senta direito!"
11050-78 = "T-Tá bom..."
11050-81 = "Serika-chan, seu uniforme de trabalho é tão fofo ☆"
11050-82 = "Caramba~ Então a Serika-chan é desse tipo? Do tipo que escolhe o bico pelo uniforme?"
11050-83 = "N-N-N-Não é nada disso! Não tem nada a ver!#nE-Eu só já era cliente daqui..."
11050-84 = "Acho que daria pra faturar uma boa grana tirando foto da Serika-chan de uniforme, né~#nQue tal, Sensei? Não quer comprar uma?"
11050-85 = "Por favor, pare com esses bicos estranhos, Senpai..."
11050-86 = "Quando você começou a trabalhar aqui?"
11050-87 = "F-Faz cerca de uma semana..."
11050-88 = "Então era isso ☆ Quando você sumia de vez em quando, era porque estava trabalhando!"
11050-89 = "J-Já chega, né?! Qual vai ser o pedido?!"
11050-90 = "Não é \"já decidiram o pedido?\", Serika-chan~? Você tem que atender os clientes com um sorriso e educação, sabia~?"
11050-91 = "Auu... J-Já decidiram o pedido...?"
11050-92 = "Eu vou querer um lámen de chashu, por favor!"
11050-93 = "Pra mim, lámen shio."
11050-94 = "Hum... Eu vou querer o de missô..."
11050-95 = "Eu quero~ o lámen de missô especial! Com cobertura de chashu maçaricado!"
11050-96 = "Não faz cerimônia não, Sensei, pede à vontade~#nA comida daqui é boa demais! É a especialidade de Abydos, o Lámen Shibasaki!"
11050-97 = "...Aliás, vocês têm dinheiro pra pagar? Por acaso,#ntão pensando em fazer a Nonomi-senpai pagar tudo de novo?"
11050-98 = "Sim, por mim tudo bem ☆ Esse cartão ainda tem bastante limite sobrando."
11050-99 = "Nada disso, não dá pra gente aceitar mais uma rodada dela, né~ Com certeza o Sensei vai pagar pra gente. Né, Sensei?"
11050-100 = "...Hã? Primeira vez que ouve isso? Ahaha, agora já ouviu, então tá valendo!"
11050-101 = "[s] Fugir."
11050-102 = "Nem vem, não vou deixar~"
11050-103 = "(Fui pego.)"
11050-105 = "Uhee~ Você tem o Cartão de Adulto aí, né? Chegou a hora dele brilhar~!"
11050-106 = "Não me parece o tipo de lugar pra usar o Cartão de Adulto, mas...#nSenpai, você já chamou a gente pra comer pensando nisso desde o começo, né?"
11050-107 = "Pro Sensei, é a chance de ouro de encher a barriguinha das suas alunas fofas, né~?"
11050-108 = "..."
11050-112 = "(Sussurrando) Sensei, pague escondido com isto aqui."
11050-113 = "Hã...? Tem certeza? Mas..."
11050-115 = "(Paguei a conta de todo mundo.)"
11050-116 = "Aaah! Valeu pela comida, Sensei!"
11050-117 = "Obrigada pela comida."
11050-118 = "Sim, graças a você tô de barriga cheia."
11050-119 = "Vão logo embora! E nunca mais voltem! Vocês só atrapalham o meu trabalho!"
11050-120 = "A-Ahaha... Até amanhã, Serika-chan..."
11050-121 = "Eu odeio vocês!! Morram todos!!"
11050-122 = "Ahaha, que bom que ela tá cheia de energia~"
11050-123 = "[s] Ir embora."
11050-126 = "(Bom trabalho hoje!)"
11050-127 = "Haah... Finalmente acabou. Que dia agitado."
11050-128 = "Aparecerem todas juntas daquele jeito... Não podiam fazer mais barulho."
11050-129 = "Eu lá trabalhando e elas só sabiam ficar paparicando: \"Sensei pra cá, Sensei pra lá\". Que incômodo, qual é a daquilo?"
11050-130 = "Com certeza a Hoshino-senpai trouxe o Sensei de propósito por causa do que rolou ontem!"
11050-131 = "...Nem pensar. Se acham que vou ceder tão fácil assim, tão muito enganadas."
11050-136 = "..."
11050-137 = "É ela?"
11050-138 = "...Sim, é ela. Membro do Comitê de Contramedidas de Abydos."
11050-139 = "Prontos? Vamos capturá-la no próximo bloco."
11050-142 = "..."
11050-143 = "Ufa..."
11050-144 = "...Pensando bem, essa região ficou bem vazia. Antes não era assim."
11050-145 = "Parece que a segurança também piorou..."
11050-146 = "Não pode continuar assim. A gente precisa se esforçar... e reerguer a nossa escola..."
11050-147 = "Por enquanto, assim que o pagamento do bico cair, vou usar pra pagar os juros..."
11050-152 = "...?!"
11050-153 = "Quem são vocês?"
11050-154 = "Serika Kuromi... certo?"
11050-155 = "...A Gangue dos Capacetes Katakata? Vocês ainda tão rondando por aqui?"
11050-156 = "Veio bem a calhar, eu já tava de mau humor mesmo. Vou fazer vocês nunca mais pisarem por aqui...!!"
11050-157 = "(Ratatatatatata!!)"
11050-158 = "Ghh, ugh!!"
11050-159 = "(Inimigos atrás de mim também?! ...Eles estavam atrás de mim desde o começo...)"
11050-160 = "Capturem-na."
11050-161 = "(Pshhhhhh!!)"
11050-162 = "KABOOOOOOOM!!!"
11050-163 = "Cof, cof..."
11050-164 = "(Canhão antiaéreo...? Não... esse estrondo é de um Flak41 Mod...?)"
11050-165 = "(Fogo de suporte? De onde...? N-Não, isso é... não pode ser...)"
11050-166 = "(E-Esses caras não são qualquer um... Isso tá muito ruim...)"
11050-167 = "(Minha consciência...)"
11050-168 = "(...)"
11050-170 = "(Baque)"
11050-172 = "..."
11050-173 = "Devemos continuar?"
11050-174 = "Não, ela não nos serve morta. Isso já basta. Coloquem-na no carro, vamos para o ponto de encontro."
11050-177 = "(Vruuum...)"
11050-179 = "Próximo;Operação de Resgate!"
