[translation]
11050-2 = "Эпизод 5;Один день из жизни Сэрики"
11050-3 = "Жилой район Абидоса, 45-й квартал"
11050-5 = ""
11050-6 = "Гуляя по району неподалёку от Абидоса, я заметил знакомое лицо."
11050-7 = "Угх. Опять вы."
11050-8 = "[s] «Доброе утро»."
11050-9 = "Доброе утро! Погодите, нет! Не ведите себя так, будто мы друзья!"
11050-10 = "Вы ещё не заслужили моего доверия."
11050-11 = "Вам что, с утра пораньше совсем заняться нечем, кроме как без дела слоняться? И ещё называете себя взрослым..."
11050-12 = "[s] «В школу идёшь, Сэрика?»"
11050-13 = "Да что с вами?! Перестаньте вести себя так, будто хорошо меня знаете!"
11050-14 = "Куда я иду — не ваше дело."
11050-15 = "Вот же, болтаетесь без дела, будто других забот нет. Надеюсь, я никогда не вырасту такой же бесцельной."
11050-16 = "Почему бы вам не отстать и не пойти приставать к кому-нибудь ещё? Я занята."
11050-17 = "Что? Хотите вместе дойти до школы?"
11050-18 = "С какой стати мне идти с вами?"
11050-19 = "К тому же сегодня выходной. У меня нет занятий."
11050-20 = "А? Тогда куда я иду? А с чего мне вам это рассказывать?"
11050-21 = "Я пошла. Пока!"
11050-23 = "Сэрика умчалась прочь, оставляя за собой шлейф пыли."
11050-24 = "[s] Последовать за ней."
11050-26 = "А? Почему вы идёте за мной?!"
11050-27 = "Хотите знать, куда я направляюсь?"
11050-28 = "Вы вообще о чём? Отстаньте, сталкер!"
11050-29 = "Угх! Ладно! Просто скажу."
11050-30 = "Я иду на подработку."
11050-31 = "Я не могу позволить себе целыми днями бездельничать, как вы. Мне нужно зарабатывать."
11050-32 = "Ну что, довольны? А теперь перестаньте за мной ходить!"
11050-34 = "[s] Последовать за ней."
11050-36 = ""
11050-37 = "Угх. Какой же вы настырный."
11050-38 = "Что? Где я работаю?"
11050-39 = "Да отстанете вы уже, идиот?! Если не оставите меня в покое, напроситесь на неприятности."
11050-41 = "Сэрика умчалась прочь, оставляя за собой шлейф пыли."
11050-43 = "Добро пожаловать в «Шиба Сэки Рамэн»!"
11050-44 = "Сколько вас человек? Я провожу вас к столу."
11050-45 = "Минутку! Дополнительная порция лапши для третьего столика!"
11050-46 = "(дверь открывается)"
11050-47 = "Добро пожаловать в «Шиба Сэки»..."
11050-48 = "Какого...?!"
11050-49 = "Привет! Столик на пятерых! ☆"
11050-50 = "Ха-ха. Привет, Сэрика..."
11050-51 = "Привет."
11050-52 = "Что вы здесь делаете?"
11050-53 = "Хех! Мы знали, что ты будешь здесь."
11050-54 = "[s] «Привет»."
11050-55 = "И Сенсей с вами...? Я так и знала, что вы меня преследовали!"
11050-56 = "Хех. Не вини Сенсея. Мы решили, что работать ты можешь только здесь, вот и заглянули."
11050-57 = "Так это ты, Хошино? Угх."
11050-58 = ""
11050-59 = "Это твои одноклассницы из Абидоса, Сэрика? Хватит болтать, прими у них заказ."
11050-60 = "Д-да, хозяин. Идите за мной. Я провожу вас к столику."
11050-62 = "Хорошо! Сюда, Сенсей! Садитесь рядом со мной!"
11050-63 = "Эм... Или можете сесть сюда, если хотите."
11050-64 = "[s1] Сесть рядом с Нономи.\n[s2] Сесть рядом с Широко."
11050-65 = "(scooch)"
11050-66 = "Тесновато, но вам нормально, да?"
11050-67 = "А? Вам неудобно? Хотите сесть ко мне на колени?"
11050-68 = "Что ты творишь на людях?!"
11050-69 = "Ха-ха! Я просто пошутила, Сэрика. ☆"
11050-70 = "Здесь достаточно мест для всех, так что сядьте уже как НОРМАЛЬНЫЕ люди!"
11050-71 = "Ха-ха. Ладно, ладно."
11050-73 = "(scooch)"
11050-74 = "Эм..."
11050-75 = "Места совсем нет! Сенсею не может быть удобно сидеть так близко. Подвинься немного."
11050-76 = "Нет, всё должно быть нормально. Правда, Сенсей?"
11050-77 = "Здесь полно свободных мест! Вы не можете просто сесть как НОРМАЛЬНЫЕ люди?!"
11050-78 = "Хм..."
11050-81 = "Какая у тебя милая форма, Сэрика! ☆"
11050-82 = "Не знала, что тебе такое нравится. Небось выбрала эту работу только из-за формы, да?"
11050-83 = "Ч-что ты несёшь? Форма тут вообще ни при чём!#nЯ просто раньше часто сюда заходила, вот и всё..."
11050-84 = "Спорим, я смогу неплохо заработать, продавая фотографии Сэрики в этой форме. Что скажете, Сенсей? Будете моим первым покупателем?"
11050-85 = "Прекрати, Хошино..."
11050-86 = "И давно ты здесь работаешь?"
11050-87 = "Наверное, около недели."
11050-88 = "Теперь понятно, почему ты время от времени куда-то убегала.#nОказывается, работала. ☆"
11050-89 = "Вы уже можете заткнуться и сделать заказ?!"
11050-90 = "По-моему, ты хотела сказать: «Могу я принять ваш заказ?» Верно, Сэрика?#nМы всё-таки посетители."
11050-91 = "Угх... Могу я принять ваш заказ?"
11050-92 = "Мне тясю-рамэн, пожалуйста!"
11050-93 = "Один сио-рамэн."
11050-94 = "Хм... А мне мисо-рамэн."
11050-95 = "Я хочу фирменный мисо! И побольше жареного тясю!"
11050-96 = "Заказывайте что хотите, Сенсей. «Шиба Сэки Рамэн» — один из лучших ресторанов, которые ещё остались в Абидосе!"
11050-97 = "Вы все принесли свои деньги? Не собираетесь опять заставлять Нономи платить за всех?"
11050-98 = "Да мне не жалко. До лимита на карте ещё очень далеко. ☆"
11050-99 = "Не-е, нельзя постоянно тебя напрягать. Сегодня за всех платит Сенсей! Правда?"
11050-100 = "Что? Никто вам не сказал? Ха-ха-ха! Ну, теперь знаете!"
11050-101 = "[s] Сбежать."
11050-102 = "И КУДА это вы собрались?"
11050-103 = "Хошино догнала меня так, будто это было проще простого."
11050-105 = "У вас ведь полно доступного кредита, да? Самое время им воспользоваться."
11050-106 = "Нельзя заставлять Сенсея платить. Мы вообще пришли только потому, что ты сказала, что угощаешь, Хошино."
11050-107 = "Это идеальная возможность дать Сенсею нас угостить. Такое каждый день не случается."
11050-108 = "..."
11050-109 = ""
11050-110 = ""
11050-112 = "Пс-с. Вот, Сенсей. Просто расплатитесь этой картой."
11050-113 = "А? Точно не хотите? Но..."
11050-115 = "В итоге мне пришлось заплатить за всех."
11050-116 = "Было очень вкусно, Сенсей!"
11050-117 = "Спасибо, что угостили нас."
11050-118 = "Спасибо за еду."
11050-119 = "Да уходите вы уже отсюда?! И больше не возвращайтесь!#nОдни только любители совать нос не в своё дело."
11050-120 = "Ха-ха-ха! До завтра, Сэрика!"
11050-121 = "Ненавижу вас! Я этого не забуду!"
11050-122 = "Ха-ха-ха! Вот характер, а?"
11050-123 = "[s] Уйти."
11050-126 = "(закрывает дверь)"
11050-127 = "Фух. Наконец-то всё. Какой же суматошный день."
11050-128 = "Не могу поверить, что они все вот так заявились. И ещё столько шума устроили."
11050-129 = "Им обязательно было тащиться сюда только ради того, чтобы всё время трещать? «Сенсей! Сенсей!» Угх. Какие же они раздражающие."
11050-130 = "Чёртова Хошино! Наверняка после вчерашнего специально решила привести сюда Сенсея."
11050-131 = "Хмф. Думаете, я так легко куплюсь? Ну уж нет..."
11050-132 = ""
11050-133 = ""
11050-134 = ""
11050-136 = "..."
11050-137 = "Это она?"
11050-138 = "Да. Она из Комитета по предотвращению закрытия Абидоса."
11050-139 = "Приготовьтесь. Схватим её в следующем квартале."
11050-142 = "..."
11050-143 = "Хм..."
11050-144 = "Этот район с каждым днём всё пустее. Раньше здесь было гораздо больше людей."
11050-145 = "И безопаснее тоже уже не становится..."
11050-146 = "Нет. Нельзя падать духом. Именно от нас зависит, сможем ли мы вытащить школу из этого кризиса."
11050-147 = "Когда получу зарплату, смогу ещё немного погасить долг, а потом..."
11050-149 = ""
11050-150 = ""
11050-152 = "...?!"
11050-153 = "Вы кто такие?!"
11050-154 = "Ты Куроми Сэрика?"
11050-155 = "Банда шлемов Ката-Ката? И у вас ещё хватило наглости сюда вернуться!"
11050-156 = "Вообще-то даже хорошо, что вы здесь. У меня сегодня паршивое настроение.#nЯ заставлю вас пожалеть, что вы вообще снова показались!"
11050-157 = "*пах* *пах* *пах* *пах* *тат*!"
11050-158 = "Ч-что?!"
11050-159 = "(Ещё и сзади? Это засада.)"
11050-160 = "Хватайте её."
11050-161 = "*бабах*"
11050-162 = "*БА-А-АХ*"
11050-163 = "*кашляет* *кашляет*"
11050-164 = "(Зенитка? Нет... Это звучало как модернизированная Flak 41.)"
11050-165 = "(Огневая поддержка? Откуда они стреляют...? Плохо.)"
11050-166 = "(На этот раз они не шутят. Это опасно...)"
11050-167 = "(Я... теряю сознание...)"
11050-168 = "(...)"
11050-169 = ""
11050-170 = "(падает)"
11050-172 = "..."
11050-173 = "Может, ещё немного её отделаем?"
11050-174 = "Не, хватит. Кидайте её в машину и везите к месту встречи."
11050-175 = ""
11050-176 = ""
11050-177 = "*вр-р-рум*"
11050-179 = "Следующий Эпизод;Спасательная операция!"
