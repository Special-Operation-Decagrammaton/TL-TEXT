[translation]
212060-1 = "Эпизод 6;Отдел горячих источников"
212060-3 = ""
212060-4 = "...таков приказ председателя. Всё понятно?"
212060-5 = "...Ха-ха. Ну и бред."
212060-6 = "Что?"
212060-7 = "С каких пор мы слушаемся Пандемониум? Да мы никогда вас не слушали, даже если бы вы хоть раз попросили по-хорошему."
212060-8 = "А ещё эти забавные подробности. Вы хотите, чтобы за неделю мы построили ВОСЕМЬ военных складов класса М?"
212060-9 = "Мы копаем горячие источники. Мы вам не... Клуб чёрной строительной работы какой-нибудь. Поняла, о чём я?"
212060-10 = "Это не имеет значения. Вам отдан приказ, и вы обязаны его исполнить."
212060-11 = "Ха-а..."
212060-12 = "Вы намерены отвергнуть распоряжение Пандемониума, когда наш священный поход против Кивотоса уже на пороге?"
212060-13 = "Подобные действия запрещены. Вас объявят предателями Геенны, а что бывает с предателями, вы, полагаю, знаете."
212060-14 = "Твоя доброта прямо до слёз трогает."
212060-15 = ""
212060-17 = ""
212060-19 = ""
212060-20 = "О! Нам дали новую работу? Поступил заказ?"
212060-21 = ""
212060-24 = ""
212060-25 = "Мегу...!"
212060-26 = "Именно. Это исключительно важная работа во славу великой Геенны."
212060-28 = "Ладно! Значит, нужно её сделать! Ура! Наконец-то!"
212060-29 = "Мегу, нельзя просто..."
212060-30 = "Вы не слышали, председатель Касуми?! Она сказала, что это «исключительно важная» работа!"
212060-31 = "Ну, эм..."
212060-32 = "Председатель Касуми, вы-то знаете это лучше меня, вы же такая умная! Чтобы вернуть Геенне былую славу, мы должны... Эм, как там было?"
212060-33 = "..."
212060-34 = "Ну да, вот именно! Главное, что мы завоёвываем Кивотос, верно? Будем воевать с другими академиями!"
212060-35 = "Так что и нам нужно помочь, каждый внесёт свой вклад! Может, это даже важнее, чем копать горячие источники!"
212060-36 = "...Мегу...!"
212060-38 = "В таком случае отмечу ваше «восторженное согласие» и откланяюсь."
212060-39 = "Разумеется, каждый день после полудня мы будем присылать сотрудников для проверки хода работ."
212060-40 = "Конечно! Мы отлично строим, так что не волнуйтесь! Хи-хи."
212060-41 = ""
212060-43 = ""
212060-45 = "..."
212060-46 = "А? Председатель Касуми, вы как будто не рады."
212060-47 = "...Я-я что-то сделала не так? М-м?"
212060-48 = "...Нет, всё хорошо. Конечно."
212060-49 = "И потом! Раз капитан Мегу хочет этим заниматься, значит, так и сделаем! Ха-ха! Верно ведь?"
212060-50 = "Ура! Вот теперь узнаю прежнюю энергичную Касуми! Спасибо!"
212060-51 = "...Ага."
212060-52 = "Тогда лучше вернуться и приготовить материалы..."
212060-53 = "Мегу."
212060-54 = "М? Что такое?"
212060-55 = ""
212060-57 = ""
212060-58 = "Ты правда предпочла бы заниматься этим... вместо поиска горячих источников?"
212060-59 = "..."
212060-60 = "Да!!! Сейчас — да!!!"
212060-61 = "Потому что... это нужно для войны!"
212060-62 = "...И завоевания Кивотоса! Верно?"
212060-63 = "...Да. Верно."
212060-64 = "Значит, всё это мы делаем ради славы Геенны, поэтому я очень хочу взяться за работу!"
212060-65 = "Понимаю. Тогда давай готовить площадку."
212060-66 = "Хорошо! Все сюда, собираемся!"
212060-67 = ""
212060-69 = ""
212060-70 = ""
212060-71 = "..."
212060-72 = ""
212060-76 = "[ns] «Касуми»."
212060-77 = ""
212060-79 = ""
212060-80 = "О, Сенсей."
212060-81 = "Ну надо же, я так увлеклась, что даже не заметила прибытия ОЧЕНЬ важного гостя. Ха-ха."
212060-82 = "...Постойте. Сенсей, вам носильщика позвать, чтобы унёс эти мешки под глазами? Серьёзно, вы выглядите... ужасно."
212060-83 = "А... Ну ещё бы вам не терять сон. В Геенне сейчас полный бардак. И НЕ из тех, что мне нравятся."
212060-84 = "Наверняка забот у вас выше крыши..."
212060-85 = ""
212060-87 = ""
212060-88 = "...А, похоже, у меня самой тоже дел невпроворот?"
212060-89 = ""
212060-91 = ""
212060-92 = "От вас всё равно никогда ничего не удавалось скрыть, Сенсей..."
212060-93 = "Ну... Ничего такого страшного..."
212060-94 = "А раз вы так ВЫМОТАЛИСЬ, можем поговорить позже! Поспите немного. Ха-ха. С вашего позволения..."
212060-95 = "[s1] «Не выйдет».\n[s2] «Я не уйду, пока ты не расскажешь, Касуми»."
212060-96 = ""
212060-97 = ""
212060-99 = ""
212060-100 = "..."
212060-101 = "Серьёзно. Да это ЗА ВАС стоит беспокоиться..."
212060-102 = ""
212060-104 = ""
212060-105 = "Но ладно. Раз уж вы НАСТАИВАЕТЕ, пожалуй, утомлю вас своими мелкими заботами."
212060-109 = "Касуми рассказала мне подробнее о своём нынешнем положении."
212060-110 = ""
212060-112 = "[ns] «Ну...»"
212060-113 = "...Ведь я сделаю всё, о чём попросит Мегу."
212060-114 = "Всё как сказала эта мерзкая... ой, простите, наша блистательная госпожа Электрошок."
212060-115 = "Но то, что Мегу говорит сейчас..."
212060-116 = "У неё то же лицо и тот же голос. Но даже глядя ей прямо в глаза, я не могу понять, действительно ли она этого хочет."
212060-117 = "Знакомая мне Мегу... МОЯ Мегу... никогда бы такого не сказала."
212060-118 = "...Но я снова и снова задумывалась."
212060-119 = ""
212060-121 = "«Имею ли я право так поспешно судить о Мегу?»"
212060-122 = "«Правильно ли решать за Мегу, во что она верит, и толковать её чувства как мне удобно?»"
212060-123 = ""
212060-125 = "Вы и сами знаете, Мегу предельно честна в своих чувствах."
212060-126 = "Поэтому её поступки не расходятся со словами."
212060-127 = "А значит, то, что она говорит и собирается делать, действительно должно быть её собственным желанием."
212060-128 = "[s] «Но ты ведь сказала, что с ней что-то не так, Касуми»."
212060-129 = "Ага."
212060-130 = "Она была не такой, как обычно. Знакомая мне Мегу никогда бы... Мне КАЖЕТСЯ, не стала бы..."
212060-131 = "..."
212060-132 = "Вот почему я сейчас совершенно растеряна! Ха-ха-ха!"
212060-133 = ""
212060-135 = ""
212060-136 = ""
212060-137 = "И что же мне делать, Сенсей? Я ведь никогда не славилась здравомыслием."
212060-138 = "Лучше и дальше поступать так, как хочет Мегу, верно? Как я и делала? Да?"
212060-139 = "[s3] «Не думаю, что Мегу действительно этого хочет».\n[s4] «По какой-то причине её мысли изменились»."
212060-140 = ""
212060-141 = ""
212060-143 = ""
212060-144 = "..."
212060-145 = "Мегу изменилась...?"
212060-146 = "И «не только Мегу, но почти все третьекурсники» тоже...?"
212060-147 = "...Сенсей. Вы шутите?"
212060-150 = ""
212060-151 = "А-А-А! Я же знала, что что-то не так!"
212060-152 = "Сначала Макото с Хиной вдруг пожимают друг другу руки и нежно воркуют о завоеваниях..."
212060-153 = "А теперь остальные студенты послушно выстраиваются в ряд, будто только и мечтали о войне все эти годы."
212060-154 = "Сенсей, вы знаете, что стало причиной?"
212060-155 = ""
212060-160 = "Я рассказал Касуми обо всём, что выяснил."
212060-161 = "...Понятно."
212060-162 = "Всё из-за разогретых остатков проекта Императора-тирана... Ага, многое объясняет."
212060-163 = "Использовать пусковой сигнал, чтобы разом изменить взгляды множества студентов. Поразительно."
212060-164 = ""
212060-166 = ""
212060-167 = "...Сенсей. Я не хочу, чтобы Мегу так страдала."
212060-168 = "И если всё продолжится..."
212060-169 = "Эта академия превратится в то, что я ненавижу."
212060-170 = "Знаете, чего я ненавижу больше всего? Когда меня принуждают подчиняться чужой воле, лишая собственной свободы."
212060-171 = "Бездумно исполнять приказы и трусливо оправдываться: «Я всего лишь выполняла распоряжения»."
212060-172 = "...Хотите верьте, хотите нет, но когда-то я сама была такой. Считала это совершенно естественным."
212060-173 = "Я жила, принимая за собственный голос тот, что кто-то вложил мне в голову."
212060-174 = "[s] «Касуми...»"
212060-175 = "Ха-ха... Знаете, это долгая и мрачная история."
212060-176 = "Если действительно хотите услышать... Может, расскажу, когда мы всех спасём."
212060-177 = "[s] «Расскажешь, когда сама захочешь»."
212060-178 = "...Ага. Запомню."
212060-179 = "Главное, теперь я знаю, что делать."
212060-180 = "Я не могу просто сидеть и смотреть, как моя драгоценная подруга остаётся пустой оболочкой, правда?"
212060-181 = "«Ради Геенны? Ради завоеваний?» Ха-ха! Как бы не так. Настоящей Мегу вся эта чепуха даром не нужна."
212060-182 = "Настоящая Мегу хочет лишь чувствовать, как из-под земли с напором вырывается горячая вода. Ей плевать на бессмысленное насилие."
212060-183 = ""
212060-185 = ""
212060-186 = "...Я не позволю теням прошлого омрачить ту дорогую мне жизнь, которую сумела построить."
212060-187 = ""
212060-189 = ""
212060-190 = ""
212060-191 = "Сенсей, скажите, чем я могу помочь."
212060-193 = "Мы с Касуми обсудили дальнейшие действия."
212060-195 = "Следующий эпизод;Я не уверена"
