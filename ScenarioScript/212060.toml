[translation]
212060-1 = "Episódio 06;O Departamento de Fontes Termais"
212060-3 = ""
212060-4 = "――E essas são as ordens expressas da líder Makoto."
212060-5 = "......Hahaha, tô tão estupefata que perdi até as palavras."
212060-6 = "O que foi?"
212060-7 = "Desde quando nós viramos serviçais particulares da Sociedade Pandemônio?#nNão me lembro de ter aceitado ser capacho de ninguém."
212060-8 = "Pra começo de conversa, o pedido é um disparate completo. Erguer oito galpões classe M em uma mísera semana?"
212060-9 = "Conta outra piada aí pra eu rir mais um pouco.#nNós somos o Departamento de Fontes Termais, não uma empreiteira de obras públicas."
212060-10 = "Não interessa. A ordem foi emitida. Vocês só têm que obedecer."
212060-11 = "Ah, é mesmo......?"
212060-12 = "Diante da iminente guerra total contra Kivotos, vocês ousam desobedecer a uma diretriz da Sociedade Pandemônio?"
212060-13 = "Se for esse o caso, serão taxadas de traidoras de Gehenna.#nE acho que não preciso desenhar qual é o destino de quem trai a escola, preciso?"
212060-14 = "Nossa, quanta gentileza! Tô quase chorando de emoção."
212060-15 = ""
212060-17 = ""
212060-19 = ""
212060-20 = "Uhuuu! Trabalho novo?! Já decidiram a nossa próxima missão?!"
212060-21 = "Megu......!"
212060-24 = ""
212060-25 = "Megu......!"
212060-26 = "Exatamente. É uma missão de vital importância para os alicerces da gloriosa Gehenna."
212060-28 = "Então bora dar o sangue! Finalmente chegou a nossa vez de brilhar!"
212060-29 = "Megu, espera, essa decisão não pode ser tomada no calor da emoção――"
212060-30 = "Chefa! Isso é super hiper importante!"
212060-31 = "Mas Megu, presta atenção――"
212060-32 = "A chefa é a cabeça pensante, sabe mil vezes mais do que eu!#nA gente tá fazendo isso pela grandeza de Gehenna...... como é que era mesmo?"
212060-33 = "......"
212060-34 = "Disseram que vamos invadir Kivotos, né? Lutar contra as outras academias!"
212060-35 = "Então a gente tem que arregaçar as mangas e ajudar com tudo!#nTalvez seja uma causa ainda mais importante do que perfurar poços termais!"
212060-36 = "......Megu......?"
212060-38 = "Considero então a ordem aceita."
212060-39 = "A partir de amanhã, enviaremos fiscais todas as tardes para acompanhar o andamento das obras."
212060-40 = "A gente constrói como ninguém! Pode deixar com a gente～!"
212060-41 = ""
212060-43 = ""
212060-45 = "......"
212060-46 = "Ué? Chefa, você tá pálida."
212060-47 = "......S-Será que eu falei alguma besteira?"
212060-48 = "......Não."
212060-49 = "Se a encarregada Megu quer tanto fazer isso, o que nos resta é construir!#nNão é verdade? Hahaha."
212060-50 = "Ebaaa! Chefa, você é demais!"
212060-51 = "......Pois é."
212060-52 = "Então bora correr com as britadeiras――"
212060-53 = "Megu."
212060-54 = "Oieee?"
212060-55 = ""
212060-57 = ""
212060-58 = "Fazer isso...... é mesmo melhor do que perfurar águas termais?"
212060-59 = "......"
212060-60 = "Sim! AGORA SIM!!"
212060-61 = "Porque se a gente erguer esses galpões, o ataque vai ser um sucesso estrondoso!"
212060-62 = "E isso é pelo bem de toda Gehenna, não é? Acertei?"
212060-63 = "......É, acertou sim."
212060-64 = "Sendo assim, eu quero fazer isso com todas as minhas forças!"
212060-65 = "Muito bem. Então vamos iniciar os preparativos."
212060-66 = "Galeraaaa, reunião geral agora!"
212060-67 = ""
212060-69 = ""
212060-70 = ""
212060-71 = "............"
212060-72 = ""
212060-76 = "[ns] \"Kasumi.\""
212060-77 = ""
212060-79 = ""
212060-80 = "Opa, Sensei?"
212060-81 = "Caramba, eu não percebi sua aproximação até você falar. Será que meus sentidos tão enferrujando?"
212060-82 = "......Peraí, Sensei, que olheiras fundas são essas? Você tá com uma cara péssima."
212060-83 = "Ah, nem preciso perguntar. O clima em Gehenna ultimamente tá o puro suco do azedo."
212060-84 = "Tá todo mundo correndo de um lado pro outro feito barata tonta."
212060-85 = ""
212060-87 = ""
212060-88 = "......Hum? Eu, preocupada? Com a cabeça cheia?"
212060-89 = ""
212060-91 = ""
212060-92 = "Hahaha, você não deixa passar nada mesmo, né, Sensei."
212060-93 = "Mas não esquenta, não é nada demais."
212060-94 = "Você já tá exausto, não quero ficar alugando seus ouvidos com picuinha minha. Deixa pra outra hora.#nBom, vou indo nessa――"
212060-95 = "[s1] \"Nada disso, nem pense em fugir.\"\n[s2] \"Vou te seguir até você desabafar tudo.\""
212060-96 = ""
212060-97 = ""
212060-99 = ""
212060-100 = "......"
212060-101 = "Ai, ai...... do jeito que você tá acabado, era eu quem devia cuidar de você, e você aí querendo bancar o protetor......"
212060-102 = ""
212060-104 = ""
212060-105 = "Fazer o quê, né? Vou aceitar seu ombro amigo e despejar esse chorume sem graça nos seus ouvidos."
212060-109 = "(Ouvi com atenção o relato de Kasumi sobre a situação atual)"
212060-110 = ""
212060-112 = "[ns] \"Hummm......\""
212060-113 = "......Por mim, eu realizo qualquer capricho que a Megu quiser no mundo."
212060-114 = "Exatamente como aquela aluna insuportável disse...... ah, perdão, como era o nome dela mesmo? Molho Shoyu-chan?"
212060-115 = "Mas a questão é:#no que a Megu tá dizendo agora......"
212060-116 = "Não tenho certeza nenhuma se é o que ela realmente quer."
212060-117 = "......A Megu nunca falaria aquelas coisas. Jamais."
212060-118 = "Só que, ao mesmo tempo, bate aquela dúvida cruel:"
212060-119 = ""
212060-121 = "Será que eu tenho o direito de julgar o que ela deve ou não sentir?"
212060-122 = "Será que não tô sendo arrogante de medir os sentimentos dela com a minha régua?"
212060-123 = ""
212060-125 = "Como você bem sabe, a Megu é o ser mais transparente que existe."
212060-126 = "A pureza dela faz as palavras e as atitudes andarem de mãos dadas o tempo todo."
212060-127 = "Por isso pensei: vai que, na cabecinha dela de agora, essa é mesmo a coisa que ela mais quer fazer na vida?"
212060-128 = "[s] \"Mas mesmo assim, você sentiu algo muito errado no ar, não sentiu?\""
212060-129 = "Exatamente."
212060-130 = "Aquela não é a minha Megu. A Megu que eu amo e conheço nunca diria aquelas palavras. É o que o meu instinto grita."
212060-131 = "......"
212060-132 = "Que baita sinuca de bico."
212060-133 = ""
212060-135 = ""
212060-136 = ""
212060-137 = "E aí, Sensei? O que você me diz?"
212060-138 = "Devo continuar fingindo que tá tudo bem e atender os caprichos dela?"
212060-139 = "[s3] \"Acredito que não seja a verdadeira vontade da Megu.\"\n[s4] \"A mente da Megu foi adulterada por algo sinistro.\""
212060-140 = ""
212060-141 = ""
212060-143 = ""
212060-144 = "......O quê?!"
212060-145 = "Adulterada......?"
212060-146 = "E não só a Megu, mas quase todas as alunas do 3º ano......?!"
212060-147 = "Pela sua cara...... não parece brincadeira."
212060-150 = ""
212060-151 = "Faz todo sentido. Eu já tava achando o cúmulo da bizarrice."
212060-152 = "A líder da Sociedade Pandemônio e a líder da Disciplina de mãos dadas papagaiando os mesmos delírios de grandeza."
212060-153 = "E certas figuras agindo com uma agilidade suspeita demais, como se já estivessem esperando exatamente por esse momento."
212060-154 = "......Sensei, o que você sabe sobre isso?"
212060-155 = ""
212060-160 = "(Expliquei detalhadamente a situação atual de Gehenna)"
212060-161 = "......Entendi."
212060-162 = "Se tem a mão podre do legado da Imperatriz do Trovão por trás, as peças finalmente se encaixam."
212060-163 = "Lavagem cerebral em massa...... que nojeira medonha."
212060-164 = ""
212060-166 = ""
212060-167 = "Eu me recuso...... a ver a Megu transformada nessa marionete vazia."
212060-168 = "E se as coisas continuarem nesse rumo――"
212060-169 = "Gehenna vai virar exatamente a aberração que eu mais abomino nesta vida."
212060-170 = "Pessoas sem vontade própria, sendo manobradas como fantoches ao bel-prazer de outrem."
212060-171 = "Seguindo ordens cegamente sem pensar, soltando a clássica desculpinha esfarrapada de 'eu só estava cumprindo ordens'."
212060-172 = "......E a verdade amarga é que eu mesma já fui uma pessoa assim no passado."
212060-173 = "Eu vivia achando que aquela voz enfiada na minha cabeça era a minha própria voz."
212060-174 = "[s] \"Kasumi......\""
212060-175 = "Hahaha! Como te disse antes, essa história é longa demais."
212060-176 = "Se você quer tanto escutar essa lengalenga......#ndeixa pra quando a poeira baixar e esse inferno for resolvido, combinado?"
212060-177 = "[s] \"Quando você se sentir à vontade, vou adorar ouvir tudo.\""
212060-178 = "......Pode deixar, vou cobrar o cafezinho."
212060-179 = "Enfim, agora tudo ficou cristalino como água mineral."
212060-180 = "Estão tentando transformar a minha companheira mais preciosa em uma carcaça oca. Eu não vou deixar barato nem por cima do meu cadáver."
212060-181 = "Pela glória de Gehenna? Hah! Que piada de mau gosto. A Megu não quer saber dessa palhaçada."
212060-182 = "O que aquela menina ama do fundo da alma é o calor fumegante da água termal brotando das entranhas da terra."
212060-183 = ""
212060-185 = ""
212060-186 = "......Não vou deixar um fantasma do passado imundo manchar a nossa rotina preciosa."
212060-187 = ""
212060-189 = ""
212060-190 = ""
212060-191 = "Sensei, pro que você precisar de ajuda, pode contar comigo e com toda a minha dinamite."
212060-193 = "(Traçamos as diretrizes da nossa aliança e dos próximos passos)"
212060-195 = "Próximo Episódio;Não Entendi Nada"
