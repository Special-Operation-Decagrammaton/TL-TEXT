[translation]
212060-1 = "Episode 6;Hot Spring Development Department"
212060-4 = "—That is the order from the President."
212060-5 = "…Ugh, I’m so disgusted I don’t even know what to say."
212060-6 = "What was that?"
212060-7 = "Nothing, nothing. Since when did we become errand boys for the Pandemonium Society? I don't recall ever agreeing to a single request from you lot."
212060-8 = "Besides, the content is absurd. Eight M-class warehouses in one week?"
212060-9 = "Take a break from the jokes. We are the Hot Spring Development Department, not the Civil Engineering Department."
212060-10 = "Irrelevant. The order has been issued. You just need to follow it."
212060-11 = "Oh…?"
212060-12 = "Do you intend to defy the Pandemonium Society's instructions right before a battle involving all of Kivotos?"
212060-13 = "If so, you are traitors to Gehenna. You know what the end result of that is, don't you?"
212060-14 = "How kind of you, I’m almost moved to tears."
212060-20 = "Oh! Work? Have we decided what to do next?"
212060-21 = "Meg…!"
212060-25 = "Meg…!"
212060-26 = "That’s right. It’s an important job that will become the foundation of a great Gehenna."
212060-28 = "Then let’s do our best! Our turn has finally come!"
212060-29 = "Meg, this isn't something we should just decide on a whim—"
212060-30 = "President! This is important!"
212060-31 = "I’m telling you, that’s—"
212060-32 = "You’re smart, President, so you must understand it better than I do! We’re doing this for the sake of a great Gehenna… uh, what was it again?"
212060-33 = "…."
212060-34 = "We said we were going to attack Kivotos, right? Like, fight other schools!"
212060-35 = "Then we have to help out! It might even be more important than digging for hot springs!"
212060-36 = "…Meg…?"
212060-38 = "Then I will consider this accepted."
212060-39 = "Starting tomorrow, I will send personnel every afternoon to check on the progress."
212060-40 = "We’re great at construction too! Leave it to us!"
212060-45 = "…."
212060-46 = "Huh? President, you don't look so good."
212060-47 = "…D-did I do something wrong?"
212060-48 = "…No."
212060-49 = "If Team Leader Meg says she wants to do it, then we have no choice! Right? Haha."
212060-50 = "Yay! Thank you, President!"
212060-51 = "…Yeah."
212060-52 = "Then we have to get ready quickly—"
212060-53 = "Meg."
212060-54 = "Yeah?"
212060-58 = "Is this… better than digging for hot springs?"
212060-59 = "…."
212060-60 = "Yeah! Right now, it is!"
212060-61 = "Because if we build this, the attack will go well, right?"
212060-62 = "It’s for the sake of Gehenna, right? Isn't it?"
212060-63 = "…Yeah, I suppose so."
212060-64 = "Then I definitely want to do it!"
212060-65 = "Understood. Then let’s get to work on the preparations."
212060-66 = "Everyone, gather 'round!"
212060-71 = "…………."
212060-76 = "[ns] \"Kasumi.\""
212060-80 = "Hm, Sensei?"
212060-81 = "Good grief, I didn't even notice you until you called out to me. Have I lost my touch?"
212060-82 = "…Wait, Sensei, what happened? You look terrible. The bags under your eyes are huge."
212060-83 = "Ah, I suppose I didn't need to ask. Things in Gehenna haven't been right lately."
212060-84 = "Everyone seems so busy with this and that."
212060-88 = "…Hm? Am I troubled? Me?"
212060-92 = "Haha, you see right through everything, Sensei."
212060-93 = "But well, it’s nothing major."
212060-94 = "I shouldn't bother a tired Sensei with this. Let’s talk about it another time. Now, if you’ll excuse me—"
212060-95 = "[s1] \"I can't let you do that.\"\n[s2] \"I'll follow you until you tell me.\""
212060-100 = "…."
212060-101 = "Sigh… in your state, you’re the one who should be worried about, Sensei…."
212060-105 = "Fine. I suppose I’ll let you listen to my boring troubles."
212060-109 = "(I heard from Kasumi about the current situation.)"
212060-112 = "[ns] \"Hmm….\""
212060-113 = "…I intend to grant any wish Meg has."
212060-114 = "Just like that unpleasant student… ah, excuse me. What was her name? Shoyu-chan? Just like she said."
212060-115 = "But… what Meg is saying right now…."
212060-116 = "I can't be sure if it’s truly what she wants."
212060-117 = "…Meg would never say something like that."
212060-118 = "But at the same time, this thought crossed my mind."
212060-121 = "Do I have the right to judge Meg on my own?"
212060-122 = "Should I be deciding how Meg feels and measuring her by my own standards?"
212060-125 = "As you know, Meg is a girl who is honest with her feelings."
212060-126 = "Her words and actions are consistent, almost to a fault."
212060-127 = "That’s why, perhaps this current Meg is simply saying what she wants to do most right now."
212060-128 = "[s] \"But you felt something was off, didn't you?\""
212060-129 = "Exactly."
212060-130 = "That isn't the Meg I know. The Meg I know wouldn't say things like that. That’s what I think."
212060-131 = "…."
212060-132 = "Ugh, what a headache."
212060-137 = "So, what would you do, Sensei?"
212060-138 = "Just keep granting Meg’s wishes as usual? Is that it?"
212060-139 = "[s3] \"I don't think it's Meg's true heart.\"\n[s4] \"Meg's thoughts have been altered.\""
212060-144 = "…Huh?"
212060-145 = "Altered…?"
212060-146 = "Not just Meg, but most of the third-years…?"
212060-147 = "That doesn't sound like a joke…."
212060-151 = "I see. I did think it was strange."
212060-152 = "Even when the Pandemonium Society President and the Prefect Team Leader teamed up and started spouting nonsense."
212060-153 = "And how there are people moving far too efficiently, as if they were waiting for this very moment."
212060-154 = "…What do you know, Sensei?"
212060-160 = "(I told her about the current state of Gehenna.)"
212060-161 = "…I see."
212060-162 = "It makes sense if it’s the legacy of the Thunder Empress."
212060-163 = "Cognitive alteration of a group, huh? That’s chilling."
212060-167 = "I… I don't want to see Meg like that."
212060-168 = "And if things keep going like this—"
212060-169 = "Gehenna is going to become the very thing I despise most."
212060-170 = "Having no will of one's own, being swayed by the whims of others."
212060-171 = "Following orders without thinking, claiming 'I was just following orders'."
212060-172 = "…I was that kind of person once, too."
212060-173 = "I lived mistaking the voice embedded in my head for my own."
212060-174 = "[s] \"Kasumi….\""
212060-175 = "Haha, like I said before, that’s a long story."
212060-176 = "If you really want to hear it… let’s save the discussion, including whether or not I should tell you, for after this is all over."
212060-177 = "[s] \"I'd like to hear it when you're ready to talk.\""
212060-178 = "…Yeah, let’s do that."
212060-179 = "Anyway, this makes things clear."
212060-180 = "A dear friend is about to be turned into a hollow shell. I can't just stand by and watch."
212060-181 = "For the sake of Gehenna? Hah! No. Meg isn't the kind of girl who wants that."
212060-182 = "What she wants is the warmth of the hot water gushing from the earth."
212060-186 = "…I won't let the ghosts of the past stain my daily life."
212060-191 = "Sensei, I’ll cooperate with anything you need help with."
212060-193 = "(We discussed our future course of action.)"
212060-195 = "Next Episode;I Don't Really Get It"