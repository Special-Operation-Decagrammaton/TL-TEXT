[translation]
1000506-1 = "Полуночный рейнджер"
1000506-2 = "Пригород Абидоса"
1000506-3 = ""
1000506-4 = "Гуляя ночью по улице, я встретил Хошино."
1000506-5 = "А? Сенсей?"
1000506-6 = "Что случилось? Что вы делаете здесь в такой час?"
1000506-7 = "[s1] «Я вышел прогуляться.»\n[s2] «Немного патрулировал.»"
1000506-9 = "Хм. Ночью в Абидосе бывает страшновато, Сенсей. Вы точно справитесь один?"
1000506-11 = "Хм. Ночью в Абидосе бывает страшновато, Сенсей. Вы точно справитесь один?"
1000506-12 = "Это не как в других академиях, здесь бывает действительно опасно. А вдруг встретите бандитов?"
1000506-13 = "Я? Ну, я... патрулировала... То есть, наверное, просто гуляла..."
1000506-14 = "О, вот ты где!"
1000506-15 = "А? Что?"
1000506-16 = "Ты тот студент, который спас меня от тех бандитов! Я хотела поблагодарить, но ты так внезапно ушла..."
1000506-17 = "Спасибо тебе. Если бы не ты, я бы не смогла заплатить аренду за этот месяц."
1000506-18 = "О, я... Да это просто..."
1000506-19 = "О, ты студент Абидоса. Я слышала, что ты патрулируешь каждую ночь, но не ожидала встретить тебя вот так."
1000506-20 = "Спасибо!"
1000506-21 = "..."
1000506-23 = "*вздыхает*..."
1000506-24 = "[s] «Ты занимаешься ночным патрулированием?»"
1000506-25 = "Это просто совпадение... Эм..."
1000506-26 = "Мне кажется, чем больше я говорю, тем запутаннее всё становится..."
1000506-27 = "Сенсей... можете просто сделать вид, что ничего не видели? Мне так неловко. Я правда не знаю, что сейчас делать..."
1000506-28 = "[s] «А чего здесь стесняться, Хошино?»"
1000506-29 = "Аргх! Вам нравится меня дразнить или что?!"
1000506-30 = ""
1000506-31 = "О, точно нравится! Вы надо мной смеётесь!"
1000506-32 = "[s] «Не стоит так себя загонять. Даже тебе нужен хороший ночной сон.»"
1000506-33 = "...Хи-хи-хи."
1000506-34 = "Я ведь и правда люблю поспать, да? Это одно из моих хобби. Так что поверьте: я себя не перегружаю."
1000506-35 = "...Вы волновались за меня, да? Никто не заботится обо мне так сильно, как вы."
1000506-36 = "Хе-хе."
1000506-37 = ""
1000506-38 = ""
1000506-39 = "Хошино повисла у меня на руке и пошла рядом."
1000506-40 = "Ой, меня вдруг так закружило! Голова совсем лёгкая..."
1000506-41 = "Кажется, по дороге домой вам придётся поддерживать меня за руку. Ужас как кружится голова."
1000506-42 = "Ну же, пойдёмте. Вы ведь не откажете невинной юной деве в такой просьбе?"
1000506-44 = "Каждый раз, когда мимо проходили люди, мне приходилось отпускать руку Хошино, но в итоге я всё же проводил её домой."
