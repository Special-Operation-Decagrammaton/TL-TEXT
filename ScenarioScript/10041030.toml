[translation]
10041030-1 = "Эпизод 3;Как разозлить человека"
10041030-6 = "Часом ранее..."
10041030-9 = "Убежище Рио, сразу после ухода Сэи..."
10041030-12 = "..."
10041030-13 = ""
10041030-16 = ""
10041030-17 = "...??"
10041030-18 = ""
10041030-20 = ""
10041030-21 = "Что... Что тебя так беспокоит?"
10041030-22 = ""
10041030-25 = ""
10041030-26 = "Я ничего не говорила о том, что беспокоюсь."
10041030-27 = "Не всё обязательно произносить вслух. У тебя всё на лице написано."
10041030-28 = "Ничего подобного."
10041030-29 = "...Ничего."
10041030-30 = ""
10041030-32 = ""
10041030-33 = ""
10041030-34 = "Неужели я НАСТОЛЬКО очевидна?"
10041030-35 = "Есть две вещи, которые меня бесят. Первая — когда люди начинают что-то говорить, а потом не заканчивают, а вторая—"
10041030-36 = "Я не собиралась тебя злить."
10041030-37 = "...А вот это бесит меня ЕЩЁ СИЛЬНЕЕ, особенно когда ты говоришь с таким лицом."
10041030-38 = "*вздыхает*"
10041030-39 = "Да это СУПЕРОЧЕВИДНО. Настолько, что игнорировать уже невежливо."
10041030-40 = "Просто выкладывай, что у тебя в голове. Хватит ходить вокруг да около."
10041030-42 = "Я... Мне нечего сказать. По крайней мере, ничего рационального."
10041030-43 = "К тому же, если я скажу это сейчас, не уверена, как ты отреагируешь. Сначала соберём больше информации, а потом, когда обстоятельства будут подходящими—"
10041030-45 = "Вот! Теперь ты бесишь меня ещё сильнее! Хватит уже!"
10041030-46 = ""
10041030-48 = ""
10041030-49 = "Хочешь сказать — говори! Не собираешься — забудь об этом!"
10041030-50 = "Может настать момент, когда мне придётся поднять эту тему—"
10041030-51 = "Тогда говори сейчас!! Здесь только мы вдвоём. Чего ты боишься?!"
10041030-52 = "Только мы вдвоём..."
10041030-53 = ""
10041030-55 = ""
10041030-56 = "...Можно... я расскажу только тебе...?"
10041030-57 = "Если бы я тебя хуже знала, уже врезала бы за то, что ты так меня дёргаешь."
10041030-58 = "Ты меня до смерти довести хочешь или что?"
10041030-59 = ""
10041030-61 = ""
10041030-62 = ""
10041030-63 = "Если бы я не собиралась помогать, давно бы так и сказала. И не то чтобы ты раньше никогда не рассказывала мне ничего странного."
10041030-64 = "В худшем случае я просто скажу тебе заткнуться. Так что давай. В чём проблема?"
10041030-66 = "...Ладно."
10041030-67 = "Проблема — Юризоно Сэя. Она переменная, которую мы не учитывали."
10041030-69 = "А, я так и думала, что речь о ней."
10041030-70 = "Боишься, что она не справится со своей работой? Что создаст проблемы? Или что сольёт нашу информацию?"
10041030-71 = "Нет, по крайней мере в её компетентности и порядочности я уверена. Не то чтобы в нынешних обстоятельствах у меня был другой выбор."
10041030-72 = "На бумаге она должна справиться, и я не ожидаю, что её действия как-то навредят конкретно нам."
10041030-73 = "Но она из тех людей, которые... склонны действовать по собственной инициативе."
10041030-74 = "И? Молодец. Тогда в чём наша проблема с ней?"
10041030-75 = "...У нас с ней проблем нет. Проблема у неё с самой собой."
10041030-76 = ""
10041030-78 = ""
10041030-79 = ""
10041030-81 = "В душе она всё тот же человек, но... недавние события дались ей тяжело."
10041030-82 = ""
10041030-84 = "Теперь она кажется тревожной и постоянно оглядывается через плечо."
10041030-85 = "И она одержима необходимостью доказать себя. Она почти не замечает даже того, что Сенсей приехал вместе с ней."
10041030-88 = "Это странно. Обычно, когда рядом Сенсей, всё проходит куда гладче."
10041030-89 = "И она действительно много болтает о том, что хочет себя доказать."
10041030-90 = "Наверное, совсем в себе не уверена."
10041030-91 = "...В любом случае."
10041030-92 = "Даже если она лишилась своих сил, её интуицию и способность принимать решения нельзя недооценивать. Возможно, она и правда принесёт полезную информацию."
10041030-93 = "Но даже тогда будем считать это лишь приятным бонусом. Полагаться на неё не стоит."
10041030-94 = "Я благодарна за её предложение, но мы продолжим по изначальному плану."
10041030-95 = ""
10041030-97 = ""
10041030-98 = "К слову, тебе нужно проникнуть в Центр данных Миллениум и проверить общий поток данных за весь период подготовки мероприятия."
10041030-99 = "Непростое задание. Из всех мест — именно Центр данных."
10041030-100 = "Разве это не самое защищённое место во всей школе? Туда почти никто не способен пробраться."
10041030-101 = "Я учла это, когда выбрала тебя для задания. Видишь какие-то проблемы?"
10041030-102 = ""
10041030-104 = ""
10041030-105 = "...Ха!"
10041030-106 = "А ты иногда умеешь быть обаятельной. Никаких проблем. Я всё-таки Микамо Нэру."
10041030-107 = "Сиди здесь и жди, госпожа заказчица."
10041030-108 = ""
10041030-110 = ""
10041030-111 = "Я мигом управлюсь! ♪"
