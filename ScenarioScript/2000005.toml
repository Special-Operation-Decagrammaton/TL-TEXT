[translation]
2000005-1 = "Порази сердце"
2000005-2 = "12-й стадион Миллениума"
2000005-3 = "Вот ты где!"
2000005-4 = "Спортивный отдел впервые прислал мне заявку."
2000005-5 = "Вот только я ничего не знаю о бейсболе."
2000005-6 = "Знаю лишь, что нужно ударить битой по мячу и сделать хоум-ран."
2000005-7 = "[s1] «Что ж, для начала неплохо.»\n[s2] «Да что ты?»"
2000005-8 = "Во всяком случае, кажется. Нужно отбить мяч питчера, чтобы заработать очки для команды."
2000005-9 = "Во всяком случае, кажется. Нужно отбить мяч питчера, чтобы заработать очки для команды."
2000005-10 = "Когда дело касается изобретений, самое важное..."
2000005-11 = "...понимать, для какой «цели» оно создаётся."
2000005-12 = "Поэтому я спросила себя: «Как помочь бейсбольному клубу Миллениума попасть на чемпионат Interhigh?»"
2000005-13 = "И пришла к одному простому выводу:"
2000005-14 = "Для этого они должны научиться выбивать хиты даже против лучшего питчера."
2000005-15 = "И я принялась создавать кое-что особенное."
2000005-16 = "Я назвала это «Адская питчинг-машина»."
2000005-17 = "Осталось только протестировать и настроить."
2000005-18 = "Сенсей."
2000005-19 = ""
2000005-20 = "Окажешь мне честь и встанешь в зону отбивающего?"
2000005-21 = "[s3] «Ты пытаешься отправить меня в ад?»\n[s4] «Один хоумран, сейчас будет.»"
2000005-22 = "Об этом можешь не беспокоиться."
2000005-23 = "Даже я знаю, что цель бейсбола — не убить отбивающего."
2000005-24 = "Вот как ты думаешь, да...?"
2000005-25 = ""
2000005-26 = "Начнём."
2000005-27 = "Первым делом режим уничтожения... Погоди, я же решила его не добавлять."
2000005-28 = "Ещё раз."
2000005-29 = "Огонь! Ой, то есть..."
2000005-30 = "Начинаем подачу!"
2000005-32 = "Средняя скорость подачи питчера высшей лиги — около 140 километров в час."
2000005-33 = "Питчер, получивший титул MVP чемпионата Interhigh, наверняка бросает не медленнее."
2000005-34 = "Но не забывай: скорость относительна."
2000005-35 = "Если тренироваться на мячах ещё быстрее... отбивать подачи на 140 километрах в час станет проще простого."
2000005-36 = "Готов? Первая подача."
2000005-37 = "Поскольку это всего лишь разминка, поставлю только Мах 2."
2000005-38 = "[s5] «Стой! Это плохая идея!»\n[s6] «В бейсболе важно не только бросать сильно и быстро.»"
2000005-39 = "Не волнуйтесь."
2000005-40 = "Я знаю."
2000005-41 = "Что это за питчинг-машина, если она не умеет кидать крученый мяч?"
2000005-42 = "Питчеров, которые бросают только фастболы, легко отбивать, да?"
2000005-43 = "Есть ещё форкболы, синкеры, слайдеры... даже наклболы."
2000005-44 = "Часть игры — подавать по непредсказуемой траектории..."
2000005-45 = "Чейнджап медленнее фастбола, но может быть не менее опасным."
2000005-46 = "Но просто отбивать обычные чейнджапы и прямые подачи недостаточно."
2000005-47 = "Одного этого не хватит, чтобы команда вышла на чемпионат Interhigh."
2000005-48 = "Поэтому я ломала голову, пока не придумала специальную функцию."
2000005-49 = "Только не пугайся."
2000005-50 = "Эта питчинг-машина умеет бросать так называемый «Мэджикбол»."
2000005-51 = "Как только мяч покидает руку питчера... он исчезает."
2000005-52 = "Или Мэджикбол — это тот, который загорается? Уже не помню."
2000005-53 = "Погоди... Есть ещё тот, что разделяется на множество мячей, чтобы невозможно было понять, какой отбивать."
2000005-54 = "А ещё тот, что создаёт магнитное поле и бьёт отбивающего током..."
2000005-55 = "[s7] «Невероятно! Как это вообще возможно?!»\n[s8] «Уверен, что последний бросок технически был жульничеством.»"
2000005-56 = "Вообще-то всё довольно просто."
2000005-57 = "Вообще-то всё довольно просто."
2000005-58 = "Принцип базовый: Мэджикбол использует оптический камуфляж, а горящий мяч покрыт воспламеняющимся материалом."
2000005-59 = "В Мэджикболе используется знакомая тебе технология: голограмма нескольких мячей, летящих с одинаковой скоростью."
2000005-60 = "А что касается магнитного мяча..."
2000005-61 = "А? Думаешь, это читерство?"
2000005-62 = "*вздох* Никогда не пойму спорт."
2000005-63 = "Но твою мысль я поняла. Постараюсь улучшить чейнджапы, не выходя за рамки правил."
2000005-64 = "Спасибо за помощь, Сенсей."
2000005-65 = "И я хотела добавить ещё кое-что..."
2000005-66 = "Беспроводной динамик."
2000005-67 = "Опытным питчерам не нужно тратить время на броски к первой базе."
2000005-68 = "Они могут выбивать страйки даже без подачи — словами и психологическими играми."
2000005-69 = "Поэтому я научила свою машину треш-току."
2000005-70 = "Послушай."
2000005-71 = "«Ну же, трус! Шевелись!»"
2000005-72 = "«Ух ты, какой медленный! Я выбью три страйка, прежде чем ты вообще махнёшь битой!»"
2000005-73 = "«Сейчас отправлю тебя домой плакаться мамочке!»"
2000005-74 = "Ну как? Какой отбивающий сохранит спокойствие, когда машина орёт на него такое?"
2000005-75 = "Надо быть одним из лучших отбивающих в мире, чтобы выдержать такой треш-ток!"
2000005-76 = "Хе-хе."
2000005-77 = "Ты впечатлён так же, как и я?"
2000005-78 = "Отлично. Какое-то время всё висело на волоске, но, кажется, я двигаюсь в правильном направлении."
2000005-79 = "После финальных тестов отдам машину бейсбольному клубу!"
2000005-81 = "(И действительно, питчинг-машина помогла бейсбольному клубу Миллениума отобраться на чемпионат Interhigh.)"
