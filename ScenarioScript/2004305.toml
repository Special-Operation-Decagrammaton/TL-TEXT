[translation]
2004305-1 = "Доказательство счастья"
2004305-2 = "Я отправился туда, куда сказала прийти Изуми."
2004305-3 = ""
2004305-12 = "Когда я добрался до крыши..."
2004305-13 = ""
2004305-17 = ""
2004305-18 = ""
2004305-21 = "Изуми снова бросилась мне в объятия."
2004305-22 = ""
2004305-24 = "Добро пожаловать, Сенсей!"
2004305-25 = "[s] «Я пришёл, Изуми!»"
2004305-26 = "Ну как? Интересный парк, правда?"
2004305-27 = "Парк прямо на крыше! Его открыли в прошлом месяце!"
2004305-28 = "Обычно, когда люди слышат слово «парк», они ожидают больше зелени — деревьев и всего такого..."
2004305-29 = "Но, как видите, это место немного другое!"
2004305-30 = "Здесь построили длинное здание у самой реки."
2004305-31 = "А потом решили сделать искусственный парк на крыше четвёртого этажа!"
2004305-32 = "Посмотрите! Река такая широкая! Я едва вижу другой берег!"
2004305-33 = ""
2004305-35 = ""
2004305-36 = "...Апчхи!"
2004305-37 = "Эхехе. Зимой у реки ветер немного прохладный."
2004305-38 = ""
2004305-40 = ""
2004305-41 = "Хм? Да, я в порядке, Сенсей! Ничего страшного."
2004305-42 = "Но всё равно, как вам такие новые впечатления?"
2004305-43 = "[s] «Кажется, это именно такое место, которое тебе понравится, Изуми.»"
2004305-44 = "Ага! Ну, понимаете, город мы видим каждый день..."
2004305-45 = "Но стоит совсем немного изменить место и пейзаж..."
2004305-46 = "...и атмосфера становится совершенно другой!"
2004305-47 = "Ой, я совсем ушла от темы. Давайте покажу, зачем я вас сюда позвала!"
2004305-48 = ""
2004305-50 = ""
2004305-51 = "Та-дам! Вот, Сенсей, я приготовила еду специально для вас!"
2004305-52 = "[s] «Хм? Это не... что-то вроде осэти?»"
2004305-53 = "Осэти хорошо подходит к Новому году, но само по себе может быть скучновато..."
2004305-54 = "Поэтому я принесла разные новогодние блюда со всего Кивотоса!"
2004305-55 = "Тут сладкая молочная каша, моти, завёрнутые в банановые листья, запечённая свинина..."
2004305-56 = "А на десерт — сушёные измельчённые фрукты со специями и минс-пай с орехами!"
2004305-57 = "Рисовую кашу я приготовила так: сначала нагрела молоко на слабом огне, потом добавила замоченный молотый рис и дала всему немного покипеть."
2004305-58 = "Говорят, если в конце посыпать сахаром и корицей, получается ещё вкуснее!"
2004305-59 = "А про моти в банановых листьях говорят, что рис способен отгонять неудачи и злых духов..."
2004305-60 = "...и ещё я слышала, что будет вкусно, если положить внутрь свинину и маш!"
2004305-61 = "Что до запечённой свинины, это не какое-то специальное новогоднее блюдо..."
2004305-62 = "...но говорят, новогоднюю свинину готовят с особой тщательностью!"
2004305-63 = "И наконец, минс-пай! Вообще это скорее рождественский десерт, но..."
2004305-64 = "...если съедать по одному минс-паю каждый день начиная с Рождества и до 6 января, это якобы приносит удачу!"
2004305-65 = "[s] «А ты сама ничего не будешь, Изуми?»"
2004305-66 = ""
2004305-68 = ""
2004305-69 = "Я? Со мной всё нормально. Я хочу, чтобы это съели вы, Сенсей."
2004305-70 = ""
2004305-72 = ""
2004305-74 = ""
2004305-75 = "Потому что... Эхехе. Я всё это приготовила для вас!"
2004305-78 = "― [log=이즈미 새해]Как видите, Сенсей...[/log][wa:10]"
2004305-81 = "― [log=이즈미 새해]...помимо осэти существует много других[/log]"
2004305-83 = "― [log=이즈미 새해]новогодних блюд.[/log][wa:780]"
2004305-86 = "― [log=이즈미 새해]Поэтому я приготовила всё, что смогла придумать! [/log][wa:720]"
2004305-89 = "― [log=이즈미 새해]Я? Я...[/log][wa:1840]"
2004305-92 = "― [log=이즈미 새해]Мне достаточно просто смотреть, как вы едите, знаете? [/log][wa:735]"
2004305-95 = "― [log=이즈미 새해]А ещё то, что мы здесь вдвоём...[/log][wa:590]"
2004305-98 = "― [log=이즈미 새해]...только я и вы, Сенсей, делает меня ещё счастливее! [/log][wa:10]"
2004305-101 = "― [log=이즈미 새해]А! Ну...[/log][wa:1200]"
2004305-104 = "― [log=이즈미 새해]Я сказала что-то немного смущающее...[/log][wa:105]"
2004305-107 = "― [log=이즈미 새해]В-в любом случае! Раз я счастлива...[/log][wa:1020]"
2004305-109 = "― [log=이즈미 새해]...значит, всё нормально! Никаких проблем![/log][wa:90]"
2004305-112 = "Ну как вам, Сенсей?"
2004305-113 = "[s1] «Было отлично! Очень необычно.»\n[s2] «Этот вид, твоя еда — мне всё понравилось.»"
2004305-116 = "Я рада! Эхехе. Именно это я и хотела услышать."
2004305-117 = "Хм? Почему в этот раз я приготовила обычную еду?"
2004305-118 = ""
2004305-120 = ""
2004305-121 = "..."
2004305-122 = "Знаете, Сенсей. Для меня... жизнь — это процесс поиска чего-то нового."
2004305-123 = "Наверное, поэтому я хочу пробовать новые вещи и искать вкусы, которых раньше не испытывала."
2004305-124 = "Но я знаю, что мои вкусы необычные."
2004305-125 = "Поэтому для вас я хотела приготовить обычную еду, которая всё равно ощущалась бы особенной."
2004305-126 = "Как я уже сказала, когда я смотрю, как вы едите с удовольствием, у меня становится тепло на душе!"
2004305-127 = ""
2004305-130 = "Яркая улыбка Изуми..."
2004305-131 = "...словно несла в себе бесконечную заразительную энергию."
2004305-132 = "[ns] «Изуми?»"
2004305-133 = ""
2004305-135 = ""
2004305-136 = "Хм? Что такое, Сенсей?"
2004305-137 = ""
2004305-140 = "[ns] «Мне хорошо вот так быть здесь вместе с тобой.»"
2004305-141 = ""
2004305-143 = ""
2004305-144 = "А...?"
2004305-145 = "Ага! Мне тоже!"
