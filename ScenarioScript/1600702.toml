[translation]
1600702-1 = "Недопонимания и ложь"
1600702-2 = "Большой торговый район возле Шале"
1600702-4 = "(На обратном пути после покупки вещей, необходимых для работы Секретариата...)"
1600702-6 = "Спасибо, Сенсей. Благодаря вам я купила всё необходимое и ни разу не заблудилась."
1600702-7 = "Я знаю, что вы хорошо знаете этот район, но меня действительно впечатлило, насколько быстро вы находили всё необходимое и продумали наш маршрут покупок."
1600702-8 = "Как и ожидалось от Сенсея из Шале, на которого полагаются и за которым следуют все студенты."
1600702-9 = "[s1] «Я всего лишь показывал дорогу...»\n[s2] «То, что я сделал, не заслуживает таких похвал...»"
1600702-10 = "Напротив, способность быстро принимать решения и хорошо ориентироваться в пространстве крайне важна для лидера."
1600702-11 = "Напротив, способность быстро принимать решения и хорошо ориентироваться в пространстве крайне важна для лидера."
1600702-12 = "Увидев ваши замечательные навыки в деле, я даже захотела попросить вас обучить сотрудников нашего Секретариата."
1600702-13 = "Я была по-настоящему поражена вашими способностями, Сенсей."
1600702-14 = "[s] «Ты слишком хорошо умеешь делать комплименты, Томоэ...»"
1600702-15 = "Хи-хи, я ведь главный секретарь президента Черино."
1600702-16 = "Хотя мне ещё многого не хватает, мне часто говорят, что я хорошо владею словом."
1600702-17 = "В любом случае, в награду за помощь я куплю вам напиток."
1600702-18 = "Я видела вон там милое кафе!"
1600702-19 = ""
1600702-21 = ""
1600702-23 = "Это ведь он, да? Тот самый Сенсей из Шале, о котором ходят слухи."
1600702-24 = "Наверное. Хотя выглядит совершенно обычно..."
1600702-25 = "Говорят, Сенсей из Шале обладает сверхчеловеческой силой. Может голыми руками раздавить танк. Но лучше не злить его: целая банда головорезов исчезла за одну ночь только за то, что не так на него посмотрела."
1600702-26 = "Неудивительно, что все, с кем я говорила, боятся Сенсея."
1600702-27 = "И правда, внешность бывает обманчива."
1600702-28 = "Как страшно."
1600702-29 = "Почему люди верят в такие нелепые слухи?"
1600702-30 = "[s3] «Наверное, потому что...»\n[s4] «Может, из-за того, что случилось на прошлой неделе.»"
1600702-31 = "Вы можете представить, откуда это взялось?"
1600702-32 = "Вы можете представить, откуда это взялось?"
1600702-33 = "Если не возражаете, расскажите мне."
1600702-34 = "Может быть, я смогу помочь."
1600702-36 = "Я рассказал Томоэ, что произошло на прошлой неделе."
1600702-38 = "Значит, историю о том, как вы вместе с дежурными студентами разобрались с хулиганами, сильно преувеличили? И теперь распространяется заблуждение, будто вы победили их в одиночку?"
1600702-39 = "А, так вот почему распространяются слухи о ваших сверхспособностях."
1600702-40 = "[s] «А на самом деле с хулиганами разобрались студенты.»"
1600702-41 = "Не соглашусь. Пусть студенты и были на передовой, именно Сенсей принимал решения и руководил боем."
1600702-42 = "Поэтому не будет преувеличением сказать, что именно вам полагается признание за победу над хулиганами."
1600702-43 = "Вам нужно больше гордиться собой, Сенсей [USERNAME]."
1600702-44 = "Но как бы то ни было. Пока вы защищали Кивотос, появились слухи, будто вы отъявленный хулиган, который готов подраться с любым, кто на вас посмотрит."
1600702-45 = "Я не могу просто стоять и ничего не делать, пока эти слухи продолжают распространяться."
1600702-46 = "[s5] «...И что ты собираешься делать?»\n[s6] «Будешь протестовать?»"
1600702-47 = "Я произнесу речь."
1600702-48 = "Пытаться убеждать каждого по отдельности было бы неэффективно."
1600702-49 = "Я произнесу речь."
1600702-50 = "Если я расскажу правду с трибуны на многолюдной площади, меня услышит большая аудитория и слухи исчезнут."
1600702-51 = "Итак, начиная прямо сейчас... я начну рассказывать правду о Сенсее!"
1600702-55 = ""
1600702-56 = ""
1600702-57 = "(Томоэ поднимается на трибуну и начинает говорить.)"
1600702-58 = "Дорогие жители Кивотоса, добрый день."
1600702-59 = "Сегодня я пришла рассказать вам правду, о которой многие из вас, возможно, не знают."
1600702-60 = "В последнее время Шале ведёт активную деятельность, и, похоже, вокруг его Сенсея ходят самые разные слухи."
1600702-61 = "Говорят, Сенсей голыми руками раздавил танк, сверхчеловеческой силой отбивал пули или спокойно облизывал ногу студенты прямо во время боя..."
1600702-62 = "Всё это бессмысленные, ничем не подтверждённые слухи!"
1600702-63 = "То есть вы утверждаете, что все эти слухи выдуманы?"
1600702-64 = "Да, все эти слухи — ложь, в которой нет ни крупицы правды."
1600702-65 = "Потому что Сенсей..."
1600702-66 = "...слабак, который не может поднять даже одну палочку для еды!"
1600702-67 = "Что?!"
1600702-68 = "Что?!"
1600702-69 = "[s] «Что?!»"
1600702-70 = "Я понимаю, правду может быть трудно принять. Я понимаю вашу реакцию."
1600702-71 = "Пожалуйста, выслушайте все причины, почему Сенсей — слабак!"
1600702-73 = "После этого Томоэ принялась подробно объяснять, почему Сенсей такой слабак."
1600702-75 = "...И поэтому Сенсей — слабак, который даже о себе позаботиться не может!"
1600702-76 = "Я-Я и не знала, что всё настолько плохо. Очевидно, тех хулиганов избил не он."
1600702-77 = "Получается, слух о сверхчеловеческой силе и скверном характере Сенсея из Шале был ложью..."
1600702-78 = "[s7] «Похоже, недоразумение прояснилось, но...»\n[s8] «Мне кажется, теперь распространится другое странное заблуждение.»"
1600702-79 = "Перекрывать одну ложь другой — основа пропаганды."
1600702-80 = "Перекрывать одну ложь другой — основа пропаганды."
1600702-81 = "Раз негативное заблуждение устранено, новое со временем тоже исчезнет."
1600702-82 = "[s] «Это правда, но...»"
1600702-84 = "[s] «Ты так убедительно говорила, что даже я чуть не поверил.»"
1600702-85 = "Хи-хи, если даже тот, кто знает правду, почти поверил, значит, мои ораторские навыки ещё не заржавели."
1600702-86 = ""
1600702-88 = ""
1600702-91 = "Но, Сенсей! Если вы в таком ужасном состоянии, как же вы собираетесь нормально руководить студентами?"
1600702-92 = "В качестве извинения за ложные слухи вот вам много качественного мяса. Заберите в Шале и насладитесь!"
1600702-93 = "Вот, возьмите приготовленного угря! Когда речь идёт о полезной еде, лучше угря ничего нет."
1600702-94 = "[s] «Я-Я не смогу съесть столько...»"
1600702-95 = "Если будете есть как птичка, никогда не станете здоровым! Ешьте много, как сумоист!"
1600702-96 = "И раз уж на то пошло, возьмите ещё курицу и удон для тянконабэ."
1600702-98 = "Благодаря речи Томоэ слухи о моей сверхчеловеческой силе и скверном характере полностью исчезли, но..."
1600702-99 = "я внезапно начал получать множество посылок с полезной едой..."
