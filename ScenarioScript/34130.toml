[translation]
34130-1 = "Episódio 13;Nossa jornada até aqui"
34130-3 = "[ns1] (Seia...)\n[ns2] (Mika...)"
34130-8 = "S-Sensei?"
34130-9 = "...Desculpa, a gente te acordou?"
34130-10 = "Estava sonhando?#n— Bom, num ambiente desses é difícil dormir profundamente mesmo. A gente já está acostumada, mas..."
34130-11 = "[s] \"...O que vocês estavam fazendo?\""
34130-12 = "Estávamos cuidando da Líder. Parece que o antitérmico fez efeito, ela não está mais com febre. Agora está dormindo..."
34130-13 = "Mas não dá pra ficar descansando pra sempre.#n...Os perseguidores ainda não vieram, então vamos partir daqui a uns 30 minutos."
34130-14 = "[s] \"30 minutos, é...?\""
34130-15 = "É. Precisa de alguma coisa?"
34130-16 = "[s3] \"...Podem me contar o resto daquela conversa de antes?\"\n[s4] \"Quero ouvir a história de vocês.\""
34130-17 = "Er... I-isso é..."
34130-18 = "Er... I-isso é..."
34130-19 = "Pra que você quer saber disso...? Não é uma história agradável de ouvir."
34130-23 = "...Bom, se o que eu sei servir, eu conto. Temos tempo sobrando mesmo."
34130-24 = "..."
34130-26 = "— A minha primeira lembrança é a figura da \"Madame\" declarando o fim da guerra civil que durou tantos anos."
34130-27 = "Como éramos muito pequenas, não sabíamos nada sobre a guerra civil nem sobre a \"Madame\".#nApenas aceitamos vagamente que as coisas eram assim."
34130-28 = "A \"Madame\" disse que ela era a nova presidente do conselho estudantil de Arius, nossa mestra e governante. E assim, ela passou a ensinar muitas coisas às alunas que restaram."
34130-30 = "Tudo é vão. Não importa aonde se vá, tudo não passa de pura vaidade."
34130-32 = "Várias técnicas de combate... e a verdade de que \"tudo é vão\"..."
34130-33 = "F-fomos ensinadas que todo o sofrimento que passamos é culpa de \"Trinity\"...#ne que \"Gehenna\" é uma existência com a qual jamais poderíamos coexistir..."
34130-34 = "[ns] \"...\""
34130-36 = "C-como carregamos a \"intenção de matar\", odiando e desprezando os outros...#ndisseram que somos iguais a \"assassinas\"..."
34130-37 = "E também que, fora deste distrito autônomo, não existe lugar para \"assassinas\"..."
34130-38 = "\"Ela\" dizia que era a única e verdadeira existência capaz de ensinar a verdade, e a adulta que as alunas deviam obedecer e respeitar..."
34130-39 = "C-como eram palavras de uma adulta... nós aceitávamos tudo, sem nunca duvidar..."
34130-41 = "Todas seguiam esses ensinamentos.#nPorque, se alguém se rebelasse, era punida... como a Azusa-chan e a Princesa-chan."
34130-42 = "[s] \"...\""
34130-43 = "Hii...?! S-Sensei?! Você está com uma expressão assustadora...?!"
34130-44 = "...Eu avisei, não foi? Que não era uma história agradável."
34130-45 = "Que medo... Adultos dão muito medo..."
34130-46 = "[s5] \"...Me desculpem. Podem me falar sobre a Atsuko?\"\n[s6] \"Por que a Atsuko é chamada de 'Princesa'?\""
34130-47 = "O-o motivo da Princesa-chan ser chamada assim..."
34130-48 = "O-o motivo da Princesa-chan ser chamada assim..."
34130-49 = "Er... p-porque ela é uma princesa...?"
34130-50 = "A Princesa... já era uma princesa desde que éramos pequenas."
34130-52 = "Dizem que ela carrega o sangue da antiga presidente do conselho estudantil de Arius, que governava o distrito autônomo.#nPor isso parece que a chamavam de \"Sangue Real\"."
34130-53 = "Parece que a presidência do distrito autônomo de Arius era hereditária até então.#n— Originalmente, ela é quem deveria ter se tornado a presidente do conselho estudantil da Filial Arius."
34130-54 = "...A Líder, a Hiyori e eu levávamos uma vida miserável nas favelas desde pequenas."
34130-55 = "Nas minhas lembranças, a Princesa-chan... sempre vestia roupas cheias de elegância.#nT-totalmente diferente da gente... e-ehehe..."
34130-57 = "Para mim e para a Líder, a Princesa-chan era alvo de admiração.#n...Embora a Misaki-san não parecesse muito interessada..."
34130-58 = "...Não, também não é como se eu não tivesse interesse nenhum. Eu só não demonstrava."
34130-59 = "É-é mesmo?!"
34130-60 = "A Princesa era muito gentil. Ela estendeu a mão até para alguém como eu..."
34130-61 = "Pensando bem, na época em que ela não usava máscara, ela sorria bastante...#nA Atsuko... também é uma pessoa muito importante pra mim."
34130-62 = "..."
34130-63 = "— Depois que a guerra civil terminou, começou a circular o boato de que a Princesa seria oferecida como sacrifício pelas mãos \"dela\"."
34130-64 = "Nós não entendíamos direito o porquê disso, mas..."
34130-65 = "Achávamos que ela tinha sido escolhida por ser alguém nobre e respeitada por todas."
34130-66 = "..."
34130-67 = "Mas a Líder não aceitou isso.#nPor isso, ela trouxe a Princesa, que deveria ser oferecida como sacrifício, para junto de nós."
34130-68 = "Eu não sei como ela conseguiu trazê-la, mas..."
34130-69 = "Não consigo imaginar \"aquela mulher\" libertando a Princesa tão facilmente... então acho que a Líder deve ter feito algum tipo de acordo com \"ela\"."
34130-70 = "[s] \"...\""
34130-73 = "Que, se quisesse mudar o destino da Princesa, teria que obedecer às ordens dela..."
34130-74 = "E que, se fizesse isso, ela pouparia não só a Princesa... mas as outras companheiras também."
34130-76 = "E foi assim que a Princesa passou a esconder o rosto e a voz, e começou a treinar junto com a gente."
34130-77 = "A Líder... treinou pessoalmente a mim, a Hiyori, a Princesa — e a Azusa, que se juntou a nós depois. Mesmo lembrando disso agora, só tenho recordações dolorosas."
34130-78 = "Não quero nem lembrar... A Líder dava muito medo naquela época..."
34130-79 = "Depois disso, passamos a ser chamadas de \"Esquadrão\" e realizamos muitas missões para Arius."
34130-80 = "...Mas, no fim das contas, falhamos na missão, e a Princesa acabou sendo capturada como \"sacrifício\", exatamente como no acordo."
34130-81 = "..."
34130-82 = "...Além do mais, agora estamos voltando para Arius como traidoras, junto com o Sensei da \"Schale\", que era o nosso alvo original — é mesmo uma piada de mau gosto."
34130-87 = "Que conversa interessante."
34130-88 = "L-Líder?!"
34130-89 = "...Você acordou. Como está se sentindo?"
34130-90 = "Não estou a ponto de não conseguir me mexer... Vocês me salvaram."
34130-91 = "Q-que alívio... ehehe... Eu achei que tudo tinha acabado..."
34130-92 = "Entendo... Se a febre baixou, acho que vai ficar tudo bem."
34130-93 = "Mas não se esqueça de que você não está em condições normais agora, tá?"
34130-94 = "...Então, o que vamos fazer agora?"
34130-95 = "Nós vamos salvar a Princesa-chan agora, não é...?"
34130-96 = "Sim."
34130-97 = "Vamos até a Basílica de Arius e resgatar a Princesa. Desde o início, nosso único objetivo é esse."
34130-98 = "..."
34130-99 = "..."
34130-100 = "E como você pretende entrar na Basílica?#nEla já sabe que nós nos infiltramos no distrito autônomo."
34130-101 = "Já pensei numa rota. — Vamos para o antigo prédio escolar da Filial Arius."
34130-106 = "O-o antigo prédio escolar?#nA-aquilo lá é uma ruína que está abandonada há muito tempo...?!"
34130-107 = "O que tem lá?"
34130-108 = "...Foi algo que ouvi da Princesa. Parece que, no passado, quando o Concílio das Santas construiu a Filial Arius, fizeram um corredor subterrâneo ligando a Basílica à filial."
34130-109 = "[s] \"O Concílio das Santas construiu a Filial Arius...?\""
34130-110 = "...Sim. Há muito tempo — quem apoiou a fuga de Arius, que se opôs à coalizão de Trinity, foi o Concílio das Santas de Justina."
34130-111 = "Aquelas que mais condenaram Arius foram justamente as que lideraram a fuga de Arius para fora do distrito autônomo de Trinity e a sua reconstrução."
34130-112 = "Como o corredor foi construído há muito tempo, é bem provável que \"ela\" também não saiba da existência dele."
34130-113 = "Vai ser um caminho mais longo, mas devemos conseguir entrar na Basílica em segurança."
34130-114 = "Você sabe onde fica esse corredor?"
34130-115 = "Não... Vamos começar procurando por ele."
34130-116 = "Entendo..."
34130-117 = "M-mas não temos outra alternativa, né?#nO-ou será que vamos tentar invadir a Basílica à força mesmo...? Isso é totalmente impossível..."
34130-118 = "Invadir à força é impossível. ...Pois é. Normalmente eu jamais procuraria algo confiando só num boato desses, mas agora o Sensei está com a gente... Acho que dá pra tentar, não?"
34130-119 = "[s] \"Sim. Vamos lá ver por enquanto.\""
34130-120 = "S-sim!"
34130-127 = "O antigo prédio escolar não fica muito longe daqui. Vamos avançar sem chamar atenção."
34130-132 = "Entendido."
34130-133 = "Vamos partir!"
34130-140 = "Em algum lugar do Distrito Autônomo de Arius"
34130-143 = "(Cof, cof...)"
34130-144 = "Hmm... Será que eu enferrujei porque fiquei trancada no quarto ultimamente...? Ou será que é culpa dos rocamboles?"
34130-150 = "...Bom, de qualquer forma, parece que cheguei."
34130-158 = "O-o quê?! Quem é você?!"
34130-159 = "V-você é...?!"
34130-160 = "Ahaha, olá☆ ...Ah, que ótimo timing!"
34130-161 = "Ei, ei, pra que lado fica a Basílica de Arius?"
34130-162 = "T-tem uma intrusa aqui! Rápido, avisem a tropa principal..."
34130-169 = "Ei, não pode — fazer barulho no meio da noite incomoda os outros, sabia? Não te ensinaram boas maneiras?"
34130-171 = "A-atirem!! Todas as unidades, fogo!!"
34130-175 = "Aii..."
34130-176 = "Bom, eu já imaginava que ia acabar assim mesmo."
34130-183 = "Próximo;Reencontro"
