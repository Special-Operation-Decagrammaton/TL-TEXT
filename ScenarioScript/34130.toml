[translation]
34130-1 = "Эпизод 13;Старая история"
34130-3 = "[ns1] «(Сэя...)»\n[ns2] «(Мика...)»"
34130-7 = ""
34130-8 = "С-Сенсей?"
34130-9 = "Простите, что разбудила."
34130-10 = "Плохой сон? Мы привыкли, но в таком месте спать нелегко."
34130-11 = "[s] «...Что-то вроде сна. Как ситуация?»"
34130-12 = "Я-я внимательно следила за состоянием лидера. Жар спал, но она всё ещё отдыхает..."
34130-13 = "Долго тянуть нельзя. Пока тихо, но в следующие тридцать минут нужно уходить."
34130-14 = "[s] «Тридцать минут...»"
34130-15 = "Да. Что-то не так?"
34130-16 = "[s3] «Можешь рассказать остальную часть вашей истории?»\n[s4] «Я хочу услышать вашу историю.»"
34130-17 = "А? Э-Это..."
34130-18 = "А? Э-Это..."
34130-19 = "Почему такой интерес? Мы были врагами Шале. История неприятная."
34130-20 = ""
34130-22 = ""
34130-23 = "...Ладно. Всё равно есть время."
34130-24 = "..."
34130-26 = "Моё первое воспоминание — как Мадам объявила, что гражданская война наконец закончилась."
34130-27 = "Мы были слишком маленькими, чтобы понимать. Не знали ни о гражданской войне, ни даже о том, кто такая Мадам."
34130-28 = "Она объявила себя новым председателем студсовета, а также хозяйкой и правительницей Ариуса. И сразу начала прививать академии Ариуса своё учение."
34130-30 = "Всё тщетно. Жизнь в конечном счёте пуста."
34130-32 = "Её философия... боевые навыки... гнев и ненависть... Она учила нас всему этому, превращая в идеальную армию."
34130-33 = "Она также учила, что источник наших страданий — Тринити... и что Геенна никогда не снизойдёт до сосуществования с нами."
34130-34 = "[ns] «...»"
34130-36 = "Мадам вбивала в нас ненависть и учила убивать. Делала из нас убийц."
34130-37 = "И заставляла верить, что убийц вроде нас никогда не примут в другой школе."
34130-38 = "Она была нашей госпожой. Говорила, что взрослая и учит истине мира. Что мы обязаны ей следовать и уважать её."
34130-39 = "Она была взрослой. Мы не знали ничего другого, кроме как принимать её учение."
34130-40 = ""
34130-41 = "Всех, кто восставал, жестоко наказывали. Как Азусу и Химэ."
34130-42 = "[s] «...»"
34130-43 = "С-Сенсей?! Почему вы так страшно смотрите? Мы что-то сделали?"
34130-44 = "Я ведь предупреждала: приятной история не будет."
34130-45 = "Т-Твоя история разозлила Сенсея, Мисаки..."
34130-46 = "[s5] «Прости. Можешь рассказать подробнее об Ацуко?»\n[s6] «Почему вы зовёте её „Химэ“?»"
34130-47 = "П-Почему зовём Химэ?"
34130-48 = "П-Почему зовём её Химэ...?"
34130-49 = "Ну... Эм... П-Потому что она Химэ, наверное?"
34130-50 = "Для нас Химэ... всегда была Химэ."
34130-52 = "Прямой потомок предыдущего председателя студсовета Ариуса... В ней королевская кровь."
34130-53 = "Когда-то пост председателя передавался по наследству, так что при обычных обстоятельствах она стала бы председателем филиала Ариуса."
34130-54 = "А вот лидер, Хиёри и я с детства были мелкими воровками из трущоб. Хотя нас всегда таскала за собой лидер."
34130-55 = "Я помню красивые платья Химэ... На нашем фоне она выглядела такой изящной. Хи-хи."
34130-56 = ""
34130-57 = "Мы с лидером всегда ею восхищались... А Мисаки будто было всё равно."
34130-58 = "...Не совсем. Я просто не видела смысла это показывать."
34130-59 = "П-Правда? Всё это время?!"
34130-60 = "Химэ прежде всего добрая. Она протянула руку мрачному ребёнку вроде меня."
34130-61 = "Когда она снимала маску, её улыбка согревала меня. Ацуко... мне тоже дорога."
34130-62 = "..."
34130-63 = "Когда гражданская война закончилась, я узнала, что Мадам собирается принести Химэ в жертву."
34130-64 = "Мы толком ничего не понимали. Умели лишь слепо принимать то, что нам давали."
34130-65 = "Казалось естественным, что человеку, которым мы восхищались сильнее всего, досталась такая честь."
34130-66 = "..."
34130-67 = "Но лидер... лидер это не приняла. Она украла Химэ и вернула её к нам."
34130-68 = "Я даже не знала, что так вообще можно."
34130-69 = "Думаю, лидер заключила с ней сделку. Мадам никогда бы просто так не отдала Химэ."
34130-70 = "[s] «...»"
34130-73 = "Я смогу изменить судьбу Химэ... если буду верно выполнять её приказы."
34130-74 = "Она сказала, что я смогу... спасти не только Химэ... но и остальных."
34130-75 = ""
34130-76 = "Так Химэ стала скрывать лицо и голос и вместе с нами прошла суровую подготовку."
34130-77 = "Лидер обучала всех нас: меня, Хиёри, Химэ и Азусу, которая присоединилась позже. Если оглянуться назад, времена были тяжёлые."
34130-78 = "Мне до сих пор снятся кошмары... Лидер тогда была очень страшной."
34130-79 = "Потом нас назвали отрядом и стали использовать для множества миссий Ариуса."
34130-80 = "Но последнюю миссию мы не выполнили, и Химэ забрали."
34130-81 = "..."
34130-82 = "Мы стали предателями, объединились с Сенсеем, который изначально был нашей целью, и вернулись в Ариус. Ситуация абсурдная."
34130-83 = ""
34130-85 = ""
34130-87 = "Мне понравилась ваша история."
34130-88 = "Л-Лидер?!"
34130-89 = "...Ты проснулась. Сможешь идти дальше?"
34130-90 = "Смогу. Простите, что доставила всем неудобства."
34130-91 = "Я-я так рада...! Сейчас заплачу... Я не знала, что делать...!"
34130-92 = "По крайней мере жар спал."
34130-93 = "Помни, ты ещё не восстановилась полностью. Не злись, что не на все сто."
34130-94 = "Так какой план, лидер?"
34130-95 = "Идём спасать Химэ...?"
34130-96 = "Чего бы это ни стоило."
34130-97 = "Цель прежняя. Идём в базилику Ариуса и спасаем Химэ."
34130-98 = "..."
34130-99 = "..."
34130-100 = "Как проникнем в базилику? Она знает, что мы здесь."
34130-101 = "Я подумала об этом. Поэтому пойдём через Старый институт филиала Ариуса."
34130-102 = ""
34130-104 = ""
34130-106 = "С-Старый институт? Он в руинах! Уже десятилетиями разваливается!"
34130-107 = "Почему туда?"
34130-108 = "Химэ однажды рассказывала, что когда Совет строил первоначальное здание академии Ариуса, между базиликой и академией сделали подземный коридор."
34130-109 = "[s] «Совет построил академию Ариуса?!»"
34130-110 = "А. Вы не знаете? Именно Совет Святой Юстины поддержал выход Ариуса из союза Тринити."
34130-111 = "Те, кто громче всех осуждал Ариус, сами возглавили наш исход и восстановление."
34130-112 = "Коридор — древняя история, так что сомневаюсь, что даже она о нём знает."
34130-113 = "Если повезёт, незаметно проникнем в базилику."
34130-114 = "Ты там была? Уверена?"
34130-115 = "Я только слышала о нём от Химэ. Придётся как-нибудь найти."
34130-116 = "Мне не нравится столько неизвестных в плане."
34130-117 = "Н-Но какой ещё выбор? Студентов слишком много, чтобы просто пробиться силой."
34130-118 = "Верно. Обычно я бы не согласилась, но у нас есть Сенсей как страховка, если всё пойдёт плохо."
34130-119 = "[s] «Это лучший вариант. Делаем.»"
34130-120 = "Ох, жизнь и правда сплошное страдание."
34130-121 = ""
34130-123 = ""
34130-125 = ""
34130-126 = ""
34130-127 = "Старый институт недалеко, но не выдавайте нас. Иначе упустим шанс спасти Химэ."
34130-128 = ""
34130-130 = ""
34130-131 = ""
34130-132 = "Поняла."
34130-133 = "Вперёд, отряд!"
34130-134 = ""
34130-136 = ""
34130-140 = "Где-то в районе Ариуса"
34130-143 = "*кашляет* *кашляет*"
34130-144 = "Ух... Я слишком долго сидела взаперти и ела рулеты. Уже устала."
34130-145 = ""
34130-147 = ""
34130-148 = ""
34130-149 = ""
34130-150 = "По крайней мере я добралась до района Ариуса. Первый этап выполнен!"
34130-151 = ""
34130-153 = ""
34130-156 = ""
34130-157 = ""
34130-158 = "К-Кто здесь?"
34130-159 = "Разве ты не Мисоно Мика?"
34130-160 = "Да я прямо знаменитость! Привет, как удачно!"
34130-161 = "Подскажите, пожалуйста, в какой стороне базилика? Просто покажите направление."
34130-162 = "Н-Нарушитель! Я свяжусь с основными силами!"
34130-163 = ""
34130-165 = ""
34130-166 = ""
34130-169 = "Как грубо! Если так орать посреди ночи, можно потревожить чей-нибудь прекрасный сон!"
34130-171 = "О-Огонь! В атаку!"
34130-172 = ""
34130-174 = ""
34130-175 = "Больно..."
34130-176 = "Чёрт. Я знала, что всё к этому придёт."
34130-177 = ""
34130-179 = ""
34130-180 = ""
34130-183 = "Следующий эпизод;Лицом к лицу"
