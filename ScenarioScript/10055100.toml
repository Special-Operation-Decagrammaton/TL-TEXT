[translation]
10055100-1 = "Afterword Part 1;Romantic Cruising (For Real)"
10055100-3 = "Hehehe! Sensei."
10055100-4 = "Are you enjoying yourself? Sorry for the wait, but I've prepared a cruise trip just as promised!"
10055100-5 = "[s1] \"Oh, I see.\"\n[s2] \"Though, it's the Odyssey that you've prepared...\""
10055100-8 = "Ultimately, receiving this kind of treatment is only possible because it's Pandemonium Society."
10055100-9 = "In other words, it's no different from something prepared by Pandemonium Society!"
10055100-10 = "Well said! Oh Chairperson of Pandemonium Society!"
10055100-11 = "Sensei, please make yourself at home! Enjoy your stay!"
10055100-12 = "Hehehe! That wonderful attitude—you must be the department head of Trident."
10055100-13 = "…Eh? Ah, well, something like that. Hehe."
10055100-14 = "I'm in a good mood right now. I'll pretend that rude preemptive strike by the Odyssey never happened."
10055100-15 = "Thank you very much!!"
10055100-17 = "…Is 'department head' really the right title for her?"
10055100-18 = "She's probably just an idiot, for sure."
10055100-27 = "Whoa!"
10055100-28 = "So this is the famous Odyssey Maritime School!"
10055100-29 = "That said..."
10055100-30 = "It feels a bit smaller than what I heard. Are rumors usually exaggerated?"
10055100-31 = "Ah, we are mainly security personnel, so we operate separately."
10055100-32 = "The school itself is probably on its way back from an expedition right about now, isn't it?"
10055100-33 = "The school itself...!? You mean the entire campus is out on a voyage!? It was even bigger than the rumors!"
10055100-34 = "Oh, if you don't mind, could I take a picture?"
10055100-35 = "Photography is... I'm sorry. #nWe are an organization similar to the Prefect Team in Gehenna. #nFor security reasons, I'd prefer it if you didn't take too many photos of this ship..."
10055100-36 = "Ah, no, it's my first time on the Odyssey, so I wanted to take a picture with you!"
10055100-37 = "Eh, m-me!? I'm just in my usual outfit, so it's embarrassing..."
10055100-38 = "I want to capture that 'usual' look on camera!"
10055100-39 = "Ah, of course, it's not mandatory! Please tell me if you're really uncomfortable with it."
10055100-40 = "Ah... then, okay."
10055100-41 = "Peace sign."
10055100-50 = "Wow! That's so cute! Great shot!"
10055100-51 = "Is it okay if we take one together?"
10055100-52 = "Ah, yes."
10055100-59 = "Thank you! Another treasure for my life has been added!"
10055100-60 = "Wait...?"
10055100-61 = "Hmm... looking at the photo, I feel like I've met you somewhere before."
10055100-65 = "Ah, I remember! You're the one we fought on the ship earlier, right?"
10055100-66 = "Ah... actually, yes."
10055100-67 = "I didn't realize it... though that might not be a good excuse..."
10055100-68 = "Oh! Then I'd love to interview you!"
10055100-69 = "…Eh?"
10055100-70 = "It's not every day you get to hear a tale of heroism firsthand! Especially from the person themselves!"
10055100-71 = "Like, how did it feel to defeat the vicious pirates that appeared at sea! I'd love to hear your story!"
10055100-72 = "Um... weren't you the pirates?"
10055100-75 = "Sensei, so you were here."
10055100-76 = "Or were you looking for me?"
10055100-77 = "[s3] \"You did a great job this time.\"\n[s4] \"Thank you for all your hard work.\""
10055100-80 = "That's right!?"
10055100-81 = "I was so..."
10055100-82 = "It was so scary and difficult, you know!?"
10055100-83 = "It would be a waste if we didn't enjoy this place 200 percent."
10055100-88 = "Naturally, you'll join me, right Sensei?"