[translation]
10055100-1 = "Послесловие;Романтический круиз (настоящий)"
10055100-2 = ""
10055100-3 = "Кихехе! Сенсей!"
10055100-4 = "Наслаждаетесь роскошным круизом? Пусть и с опозданием, но я всегда исполняю обещания!"
10055100-5 = "[s1] «А, ну да... Всё замечательно...»\n[s2] «Но ведь поездку организовала \"Одиссея\"...»"
10055100-8 = "А почему, по-вашему, они это сделали? Потому что мы Общество Пандемониум, разумеется!"
10055100-9 = "Следовательно, технически можно сказать, что именно мы, Общество Пандемониум, устроили всё это!"
10055100-10 = "Да! Вы совершенно правы, великий председатель!"
10055100-11 = "Чувствуйте себя как дома, Сенсей!"
10055100-12 = "Кихехе! Судя по твоему превосходному отношению, ты, должно быть, председатель «Трезубца»."
10055100-13 = "...Я-я? Ну да, что-то вроде того! Так и есть! Хе-хе."
10055100-14 = "Поскольку я сегодня в хорошем настроении, прощу «Одиссее» её дерзкое внезапное нападение!"
10055100-15 = "Это огромная честь для меня!"
10055100-16 = ""
10055100-17 = "...Что именно она имела в виду под «что-то вроде того»?"
10055100-18 = "Полагаю, она просто ещё одна дурочка."
10055100-20 = ""
10055100-21 = ""
10055100-22 = ""
10055100-23 = ""
10055100-24 = ""
10055100-25 = ""
10055100-26 = ""
10055100-27 = "О-о!"
10055100-28 = "Так вот она какая, знаменитая Морская академия «Одиссея»!"
10055100-29 = "Но всё же..."
10055100-30 = "Она несколько меньше, чем рассказывают! Впрочем, людям свойственно преувеличивать!"
10055100-31 = "Нет-нет. «Трезубец» — небольшой отдельный экипаж, который самостоятельно следит за безопасностью."
10055100-32 = "Сама академия... Ну, наш главный корабль и его флотилия как раз должны возвращаться из плавания. Их давно не было."
10055100-33 = "Вся ваша академия находится в море?! Это даже больше, чем я представляла!"
10055100-34 = "Можно мне сделать несколько фотографий? Ну пожалуйста!"
10055100-35 = "Как дисциплинарный комитет, боюсь, мы не можем этого позволить. Пусть это и не наш флагман «Родос», на борту много закрытых и охраняемых помещений."
10055100-36 = "А, нет! Я не об этом! Я имела в виду тебя! Ты первый человек из «Одиссеи», которого я встретила, поэтому хочу сфотографироваться вместе!"
10055100-37 = "С-со мной?! Мне немного неловко перед камерой... Я ведь сегодня даже толком не наряжалась..."
10055100-38 = "Но именно поэтому я и хочу запечатлеть этот момент! Такую тебя, какая ты сейчас!"
10055100-39 = "Но ты совершенно не обязана! Я просто спросила, так что не переживай!"
10055100-40 = "А, эм, тогда..."
10055100-41 = "Сыр!"
10055100-42 = ""
10055100-44 = ""
10055100-45 = ""
10055100-46 = ""
10055100-47 = ""
10055100-48 = ""
10055100-49 = ""
10055100-50 = "О-о! Ура, какая прелесть! Ты отлично получилась!"
10055100-51 = "Может, ещё селфи сделаем?"
10055100-52 = "А, конечно."
10055100-53 = ""
10055100-55 = ""
10055100-56 = ""
10055100-57 = ""
10055100-58 = ""
10055100-59 = "Спасибо! Ещё одно сокровище на всю жизнь!"
10055100-60 = "Погоди-ка...!"
10055100-61 = "Теперь, когда я внимательно разглядела тебя на снимке... Ты мне знакома..."
10055100-62 = ""
10055100-64 = ""
10055100-65 = "А, вспомнила! Я видела тебя на палубе во время нашего сражения!"
10055100-66 = "Эм... Да, вообще-то."
10055100-67 = "Знаю, оправдание «мы не поняли, кто вы» звучит неубедительно..."
10055100-68 = "О-о! Тогда я просто обязана взять у тебя интервью!"
10055100-69 = "...Хм?"
10055100-70 = "Не каждый день услышишь рассказ о подвиге из уст самого героя!"
10055100-71 = "Расскажи, пожалуйста, что ты почувствовала, когда победила тех грозных пиратов, что неожиданно возникли прямо перед вами!"
10055100-72 = "...Ты ведь понимаешь, что говоришь о самой себе?"
10055100-74 = ""
10055100-75 = "Сенсей, вот вы где."
10055100-76 = "Или это вы меня искали?"
10055100-77 = "[s3] «Ты столько всего сделала на этот раз, Сацуки».\n[s4] «Ты очень постаралась»."
10055100-80 = "Постаралась!"
10055100-81 = "А-а, ещё как постаралась!"
10055100-82 = "Было так страшно! И так утомительно!"
10055100-83 = "Избавиться от дурных воспоминаний можно лишь одним способом: повеселиться здесь в сто раз сильнее!"
10055100-84 = ""
10055100-86 = ""
10055100-87 = ""
10055100-88 = "И вы, конечно же, составите мне компанию, правда, Сенсей?"
