[translation]
2005808-1 = "Эрика, секретная база"
2005808-2 = "Закончив дела, я решил встретиться с Эрикой."
2005808-5 = "Немного рановато. До готовности ещё далеко."
2005808-6 = "Разве у вас нет дел? Что вы опять делаете в Геенне?"
2005808-7 = "[s1] «Я очень занят!»\n[s2] «Я не бездельничаю!»"
2005808-10 = "Знаю-знаю."
2005808-11 = "Приятно снова случайно встретиться."
2005808-12 = "[s] «Да. И небо сегодня красивое.»"
2005808-13 = "А, правда? Погода просто отличная."
2005808-14 = "Кстати, Сенсей, у вас есть время... немного посидеть вместе?"
2005808-15 = "Ничего серьёзного. Просто хочу кое-куда вас отвести."
2005808-16 = "Есть? Отлично."
2005808-17 = ""
2005808-19 = ""
2005808-20 = "Тогда за мной."
2005808-22 = "Я последовал за Эрикой наверх тихого здания."
2005808-26 = "Тихо и спокойно, правда? К этому времени почти все уже ушли."
2005808-27 = "Никто не любит задерживаться в школе, особенно в Геенне."
2005808-28 = "Мне нравится, когда здесь вот так никого нет."
2005808-29 = ""
2005808-31 = ""
2005808-32 = "[ns] «Эрика, ты сменила духи?»"
2005808-33 = ""
2005808-35 = ""
2005808-36 = "Ч-Что??"
2005808-37 = "[s3] «Ты пахнешь иначе, чем обычно.»\n[s4] «Очень приятно.»"
2005808-40 = "Мне их кое-кто посоветовал."
2005808-41 = "Мне их кое-кто посоветовал."
2005808-42 = "Ну, рада, что вам нравится. Да... Значит, не зря."
2005808-43 = "Обычно люди такие вещи не замечают. Не могу понять, вы просто очень наблюдательны или здесь что-то ещё, Сенсей."
2005808-44 = "В любом случае сюда."
2005808-45 = ""
2005808-47 = ""
2005808-48 = "Вот, дайте руку."
2005808-50 = "Эрика за руку повела меня к месту, которое хотела показать..."
2005808-51 = ""
2005808-56 = "― [log=에리카]Добро пожаловать, Сенсей.[/log][wa:1276]"
2005808-58 = "― [log=에리카]Это моя секретная база.[/log][wa:1189]"
2005808-61 = "― [log=에리카]Сюда я прихожу, когда хочу побыть одна.[/log][wa:2862]"
2005808-63 = "― [log=에리카]Фуфу. Может, она слишком большая, чтобы называть её «секретной» базой.[/log][wa:3006]"
2005808-66 = "― [log=에리카]Я просто... хотела поделиться этим местом с вами, Сенсей.[/log][wa:2036]"
2005808-68 = "― [log=에리카]Тем, что я здесь вижу, тем, что чувствую...[/log][wa:4570]"
2005808-71 = "― [log=에리카]Если спросите почему, хорошего ответа у меня нет...[/log][wa:2160]"
2005808-73 = "― [log=에리카]Наверное... если рассказываешь кому-то о тайном месте... значит, этот человек тоже особенный.[/log][wa:2366]"
2005808-76 = "― [log=에리카]Вы для меня особенный человек, Сенсей.[/log][wa:2381]"
2005808-79 = "― [log=에리카]...Фуфу...[/log][wa:11]"
2005808-81 = "― [log=에리카]Здесь тихо и спокойно, правда?[/log][wa:10]"
2005808-84 = "― [log=에리카]Но несмотря на это... кажется, моё сердце сейчас стучит немного громко.[/log][wa:2834]"
2005808-88 = ""
2005808-89 = "Сюда приходит не так много людей."
2005808-90 = "Вообще никто. По крайней мере с тех пор, как я нашла это место."
2005808-91 = "Приятно иметь уголок только для себя в такой шумной школе."
2005808-92 = "Вам здесь нравится?"
2005808-93 = "Тогда разрешаю и вам занимать здесь место."
2005808-94 = "Фух..."
2005808-95 = "Закат я вижу далеко не впервые, но сегодня он ощущается иначе."
2005808-96 = "Я знаю почему, но почувствовать это лично всё равно приятно."
2005808-98 = "Мы с Эрикой некоторое время смотрели на закат."
2005808-99 = "К тому моменту, как мы спустились с крыши, уже стемнело."
2005808-101 = "Ого, когда успела наступить ночь?"
2005808-102 = "[s] «Ты обычно остаёшься так поздно?»"
2005808-103 = "Нет, никогда."
2005808-104 = "У нас комендантский час, да и коридоры после темноты немного пугают."
2005808-105 = "Обычно стараюсь спуститься до того, как солнце совсем сядет."
2005808-106 = ""
2005808-108 = ""
2005808-109 = ""
2005808-110 = "Но сегодня немного задержалась, потому что вы были рядом."
2005808-111 = "Само ваше присутствие успокаивает, поэтому время совсем ускользнуло."
2005808-112 = "К-Кстати, вам не слишком поздно? Мы не засиделись?"
2005808-113 = "[s5] «Нет-нет, мне тоже понравилось.»\n[s6] «Я давно не чувствовал такого покоя.»"
2005808-116 = ""
2005808-118 = "Ха. Вы всегда умеете сказать именно то, что нужно."
2005808-119 = "Эта ваша сторона..."
2005808-120 = "В любом случае тёмный коридор немного страшный..."
2005808-121 = ""
2005808-123 = ""
2005808-124 = ""
2005808-125 = "Так что вот, дайте мне руку."
2005808-127 = "И мы пошли вниз по тёмным тихим коридорам и лестницам."
2005808-128 = "Но даже когда мы вышли в освещённую луной ночь, Эрика так и не отпустила мою руку."
