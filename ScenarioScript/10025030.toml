[translation]
10025030-1 = "Эпизод 3;Нарушители"
10025030-3 = ""
10025030-4 = "Приступим к докладу о ходе операции."
10025030-5 = ""
10025030-7 = ""
10025030-8 = "После опроса рыбаков деревни Ятоура никаких проблем с самой ловлей креветок, похоже, нет."
10025030-9 = "Уловы меньше обычного, но нет никаких признаков, что это должно было полностью прекратить поставки в Д.У."
10025030-10 = "Я также проверила, нет ли проблем на перерабатывающем заводе Ред Хук Экспресс, но и там всё выглядит нормально."
10025030-11 = "Единственное, что могу отметить: город неприятно тихий."
10025030-12 = ""
10025030-14 = ""
10025030-16 = "Я проверила все камеры наблюдения в городе. Единственный транспорт, который въезжает и выезжает, — автобус, ходящий дважды в день."
10025030-17 = "Грузовик с пятью тоннами замороженных креветок никак не мог бы проскочить так, чтобы я его не заметила..."
10025030-18 = "Думаю, можно исключить версию, что кто-то тайно вывозит креветки из-под носа Ред Хук Экспресс."
10025030-19 = "Это совпадает с тем, что видела я. Кроме нас, здесь только местные жители."
10025030-20 = "А, вообще-то у пирса я встретила ещё одного человека не из города..."
10025030-21 = "Он сказал, что п-пришёл рыбачить, но ничего не знал о рыбе и будто был чем-то отвлечён..."
10025030-22 = ""
10025030-24 = ""
10025030-27 = "[ns] «Тут что-то пахнет...»"
10025030-28 = "...рыбным."
10025030-29 = "У нас нет доказательств нарушений, но мы всё ещё не можем объяснить, почему креветки не доходят до Д.У."
10025030-31 = "Будто весь город околдован..."
10025030-32 = "Кто-то в этом городе врёт. Это точно."
10025030-33 = "[s] «И вы правда больше ничего не узнали?»"
10025030-34 = "Мы можем задавать вопросы до посинения..."
10025030-35 = "Но здесь все настороженно относятся к чужакам. Большинство даже не хотели со мной разговаривать."
10025030-36 = "Даже студенты Полицейской школы Валькирии вели себя отвратительно."
10025030-38 = "М-Может... у г-города есть тёмная тайна..."
10025030-39 = "Хи-хи-хи... Конечно есть, Мию."
10025030-40 = "Люди, которые без причины выглядят злыми, обычно что-то скрывают."
10025030-42 = "Как тогда, когда Саки пошла на задание без нижнего белья, потому что стирка не успела высохнуть..."
10025030-43 = "Эй! Зачем ты вспоминаешь об этом СЕЙЧАС?!"
10025030-44 = ""
10025030-46 = ""
10025030-48 = ""
10025030-49 = "Кстати, Сенсей, я слышала, как местные упоминали кого-то под названием «Глубинные.»"
10025030-50 = "О, студент Валькирии тоже об этом говорил."
10025030-51 = "Она сказала мне быть осторожнее и не злить «Глубинных.»"
10025030-52 = "А... Тот другой приезжий что-то бормотал, будто «Глубинные» могут помочь ему поймать рыбу..."
10025030-54 = "Какие-то там Глубинные, которые помогают рыбачить? Ничего не понимаю..."
10025030-55 = "Может, они дрессировали дельфинов нырять глубоко и приносить рыбу...?"
10025030-56 = ""
10025030-58 = ""
10025030-60 = "Глубинные — старое местное суеверие. Древние существа, живущие под морем."
10025030-61 = ""
10025030-63 = ""
10025030-64 = ""
10025030-67 = ""
10025030-68 = ""
10025030-70 = "Кто здесь?"
10025030-71 = "Надеюсь, я не мешаю."
10025030-72 = "Здесь так редко появляются новые лица. Я так обрадовалась, что просто влезла в разговор."
10025030-73 = "Обычно я вижу только рыбаков, которые привозят мне креветки для отправки в Д.У."
10025030-75 = "Вы отвечаете за отправку? Значит..."
10025030-76 = "Вы генеральный директор Ред Хук Экспресс?"
10025030-77 = "Ха-ха... Поймали."
10025030-78 = "Наверное, мне стоило бы гордиться своим скромным бизнесом, но старые морские волки Ятоуры, похоже, невысокого о нём мнения."
10025030-80 = ""
10025030-82 = ""
10025030-83 = "Что ж, приятно познакомиться."
10025030-84 = "От имени Д.У. хочу поблагодарить Ред Хук Экспресс за все вкусные креветки, которые вы нам отправляли."
10025030-85 = "Ха-ха! Похоже, мой тяжёлый труд всё-таки окупился."
10025030-86 = "Но почему-то в последнее время в Д.У. совсем нет креветок..."
10025030-87 = "Ни в ресторанах, ни в магазинах... Значит, проблема должна быть в поставках, верно?"
10025030-88 = "..."
10025030-89 = "Раз это ваша компания, возможно, вы знаете, что происходит?"
10025030-90 = "Потому что креветок не ловят. Очевидно же."
10025030-91 = "Может, дело в этой необычной жаре, но в последнее время рыбаки всё чаще возвращаются с пустыми руками."
10025030-92 = "Если креветок нет, то и отправлять в Д.У. нечего."
10025030-93 = "Креветки скоро вернутся. Я уверена."
10025030-94 = "Интересно... Когда мы разговаривали с рыбаками, они сказали, что креветок всё ещё ловят."
10025030-95 = "О, наверное, это из-за... их гордости. Не хотят признавать, что у них проблемы."
10025030-96 = "И ведь другую рыбу они по-прежнему могут ловить."
10025030-97 = "Если подумать, многое бывает сезонным. Наверное, это просто часть естественного цикла промысла креветок."
10025030-98 = "Ну, может быть, но..."
10025030-100 = "Вообще-то, если кто и должен жаловаться на эту ситуацию с креветками, так это я!"
10025030-101 = "Вы не представляете, сколько денег я теряю из-за этой нехватки креветок..."
10025030-102 = "Вот бы Глубинные помогли и вернули креветок!"
10025030-103 = "Эм... А кто вообще такие эти Глубинные...?"
10025030-104 = "Я ведь сказала, что это местное суеверие, верно? Скорее народная легенда."
10025030-105 = "Говорят, под Рифом Дьявола у восточного побережья города есть подводный город."
10025030-106 = "Его жители покрыты рыбьей чешуёй и способны выживать на любой глубине."
10025030-107 = "Они не стареют и не испытывают голода, поэтому многие искатели бессмертия приезжают сюда в надежде найти их."
10025030-108 = "Хотя никто не знает, что происходит с теми, кто действительно встречает Глубинных..."
10025030-109 = "Эм... Э-э..."
10025030-110 = "Говорят, Глубинные властвуют над морской рыбой, а тем, кто заслужит их благосклонность, обещаны все богатства океана."
10025030-111 = "Короче говоря, Глубинные — морские боги."
10025030-112 = "[s1] «Как Морской царь драконов...?»\n[s2] «Как тот супергерой, который разговаривает с рыбами...?»"
10025030-113 = "А, из мифологии? Не совсем то же самое, но довольно похоже."
10025030-114 = "А? Что это ещё за супергерой такой...?"
10025030-115 = "В любом случае... Возможно, из-за ситуации с креветками местные в последнее время часто говорят о Глубинных."
10025030-116 = "Я слышала шёпот, что городу, возможно, придётся принести Глубинным жертву... или прогнать назойливых чужаков..."
10025030-118 = "Какие ещё жертвы...?"
10025030-120 = "Какие же? Человеческие."
10025030-122 = "...!"
10025030-124 = "Ха-ха-ха! Да шучу я, конечно. Не надо так пугаться!"
10025030-125 = "В старых легендах действительно упоминаются жертвоприношения, но это всего лишь сказки."
10025030-126 = "Не думаете ли вы, что в наше время о маленькой рыбацкой деревушке, приносящей людей в жертву, уже трубили бы все новости?"
10025030-127 = "Все местные просто хотят спокойно заниматься своими делами."
10025030-128 = "(Именно это всегда говорят перед человеческим жертвоприношением...)"
10025030-129 = "Если хотите узнать больше о Глубинных, почему бы самим не сходить к Рифу Дьявола?"
10025030-130 = "Только не ходите туда ночью, когда отлив самый сильный."
10025030-131 = "Почему...?"
10025030-132 = "По легенде, в ночи необычно сильного отлива Глубинные выходят на поверхность собирать дань."
10025030-133 = "Конечно, всё это выдуманная ерунда, но... Ну, вдруг в ней есть крупица правды..."
10025030-134 = "Сомневаюсь, что Глубинным понравится, если группа чужаков начнёт копаться в тайнах города."
10025030-136 = "...!"
10025030-138 = "А, возможно, я сказала слишком много..."
10025030-139 = "Вовсе нет. Вы очень помогли нам лучше узнать город. Спасибо."
10025030-140 = "Хотя некоторые вещи лучше оставить неизвестными."
10025030-142 = "Что ж, не буду больше мешать вашему отдыху!"
10025030-144 = ""
10025030-148 = ""
10025030-149 = ""
10025030-150 = "Этот г-город проклят... Я д-должна была понять это, когда они заговорили о Г-Глубинных..."
10025030-151 = "Н-Нас выбрали Г-Глубинные... Н-Нас принесут в жертву, чтобы вернуть рыбу... Н-Нам не спастись..."
10025030-152 = "Никто нас не выбирал. Мы сами решили приехать сюда."
10025030-153 = "Н-Но... именно так всегда начинаются фильмы ужасов!"
10025030-154 = "Н-Нас заманило сюда любопытство, н-но в конце мы не сможем сбежать, даже если з-захотим..."
10025030-155 = "У-Ужасные чудовища поднимутся из волн и пожрут наш р-разум..."
10025030-156 = "Н-Нас вечно будут преследовать невозможные чудовища, и мы н-навсегда окажемся заперты в собственном безумии...!"
10025030-157 = "Очнись! В реальном мире таких чудовищ не бывает."
10025030-158 = "Монстры. Проклятия. Всё равно. Это просто история, которую придумали, чтобы нас отпугнуть."
10025030-159 = "Согласна."
10025030-160 = "Если бы Глубинные существовали, Генеральный студсовет Кивотоса уже знал бы о них."
10025030-161 = "Эй, Мию, разве ты не знаешь?"
10025030-162 = "Самое страшное существо в мире живёт не под морем... Оно сидит в казначействе Генерального студсовета!"
10025030-164 = "Мне всё равно, насколько круты эти Глубинные. Если они контрабандой вывозят креветки, им придётся отвечать перед четвёртой налоговой следственной группой!"
10025030-165 = "Как конкретно..."
10025030-167 = "До сих пор не понимаю, как они узнали о торпеде, которую я тайно купила у Морской академии «Одиссея»..."
10025030-168 = "Что ты вообще собиралась делать с торпедой?!"
10025030-169 = "В общем! От SRT не уйдёт даже призрак."
10025030-171 = "Я лично развенчаю эту байку и выясню, что здесь на самом деле происходит!"
10025030-173 = "Но сейчас будет сложно продвинуться, пока за нами наблюдает весь город."
10025030-174 = "Сомневаюсь, что прямые допросы тоже дадут полезные ответы."
10025030-175 = "А пока разобьём лагерь и немного отдохнём."
10025030-176 = "Сегодня ночью, когда город уснёт..."
10025030-177 = "...мы продолжим расследование!"
