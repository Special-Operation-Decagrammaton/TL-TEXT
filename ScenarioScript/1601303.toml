[translation]
1601303-1 = "Кризис Кохару"
1601303-3 = "Следуя указаниям Кохару, я пришёл к валуну на краю пляжа."
1601303-4 = ""
1601303-6 = ""
1601303-7 = "Она неуверенно устроилась на его вершине и смотрела на горизонт."
1601303-8 = "[s1] «Вот ты где.»\n[s2] «Что ты здесь делаешь, Кохару?»"
1601303-9 = ""
1601303-10 = ""
1601303-12 = ""
1601303-13 = "О, Сенсей...?"
1601303-14 = "Ну, видите ли…"
1601303-15 = "На самом деле я не знаю. Просто сижу здесь без какой-то особой причины."
1601303-16 = "[s3] «Просто сидишь?»\n[s4] «Тебе что-то от меня нужно?»"
1601303-19 = "Нет. Да. Не знаю. Мне просто почему-то захотелось здесь посидеть."
1601303-20 = "Если честно, и причины звать вас у меня тоже особо не было..."
1601303-21 = "Я просто сидела здесь и захотела вам позвонить. Так можно?"
1601303-22 = "[s5] «Конечно. Спасибо, что поделилась со мной этим видом.»\n[s6] «Я бы тоже захотел разделить такой вид с кем-нибудь.»"
1601303-25 = "Хм... В этом что-то есть."
1601303-26 = "Это напоминает мне, как я нашла вас у водопада."
1601303-27 = "Вы просто смотрели в пустоту, как я сейчас смотрю на океан."
1601303-28 = "А?"
1601303-29 = "В таком месте это вполне нормально?"
1601303-30 = "Даже если для других это «нормально», не знаю... Мне кажется, это пустая трата времени."
1601303-31 = "Мы проделали такой путь, а теперь я просто буду ничего не делать? Как-то нелогично."
1601303-32 = "Но вы сказали, что это нормально... Значит, наверное, совсем уж пустой тратой это быть не может."
1601303-33 = ""
1601303-35 = ""
1601303-36 = "Хорошо. Попробую просто чувствовать то, что чувствую. Наверное."
1601303-37 = "[s7] «Мне нравится эта идея. Я тоже так сделаю.»\n[s8] «Я буду прямо рядом с тобой.»"
1601303-38 = ""
1601303-39 = ""
1601303-41 = ""
1601303-42 = "Т-Только попробуйте не быть рядом! Вы что, собирались уйти куда-нибудь один?"
1601303-43 = "Наверняка пойдёте искать несчастных жертв, раз знаете, что я застряла здесь."
1601303-44 = "А потом будете творить всякие странности, пока я не вижу!"
1601303-45 = "Ни за что, Сенсей! Сядьте и не двигайтесь ни на сантиметр! Ни! На! Сантиметр!"
1601303-46 = "[s9] «Я же сказал, что останусь...»\n[s10] «Да-да. Понял.»"
1601303-49 = "Угх! Вас вообще ничем не проймёшь."
1601303-52 = "Чтобы Кохару не подозревала меня ещё сильнее, я сел рядом с ней на валун."
1601303-56 = "Хм. И сколько нам смотреть в пустоту?"
1601303-57 = "Я всё ещё не совсем понимаю. Может, это ваше «витание в облаках» доступно только взрослым."
1601303-58 = "Мне не нужно понимать? Тут нужно чувствовать, а не думать?"
1601303-59 = "Вы меня дурой назвали?! Хмпф! Неважно, я поняла. Теперь всё совершенно ясно!"
1601303-60 = "В любом случае! Мне очень понравилось вот так ничего не делать! Было здорово!"
1601303-61 = "Но я уже закончила. Пойдём обратно, Сенсей."
1601303-62 = "Когда вернёмся в лагерь, я всем расскажу, как я—"
1601303-63 = ""
1601303-65 = ""
1601303-66 = ""
1601303-67 = ""
1601303-68 = "...А?!"
1601303-69 = "...Что за?! Сенсей! Позади вас! Вода!"
1601303-70 = "Что случилось с пляжем?! Песка нет! Нас со всех сторон окружил океан!"
1601303-71 = "[s11] «И правда. Значительная часть пляжа исчезла.»\n[s12] «А, похоже, начался прилив. Упс.»"
1601303-74 = "Почему вы так спокойно к этому относитесь?! У нас проблемы! Как мы вернёмся?!"
1601303-75 = "Вы всё это время знали? И всё равно решили остаться со мной? Н-Но это...!"
1601303-76 = "А! Я знаю, что вы задумали! Я читала про такое! Вы заманили меня туда, куда никто другой не доберётся, а теперь собираетесь творить ужасные вещи!"
1601303-77 = "[s13] «Успокойся, Кохару. Мы можем пройти обратно по воде.»\n[s14] «Прилив идёт, но здесь всё ещё мелко.»"
1601303-80 = "УСПОКОИТЬСЯ?! Я не буду успокаиваться!"
1601303-81 = "Я знала, что у вас скрытые мотивы!"
1601303-82 = "Не могу поверить, что рядом с вами я потеряла бдительность!"
1601303-83 = ""
1601303-87 = ""
1601303-88 = "Погодите, Сенсей? Куда вы? Не оставляйте меня!"
1601303-89 = ""
1601303-92 = "Нельзя просто так лезть в воду, Сенсей! А если вы утонете?! Вы можете утонуть, Сенсей!"
1601303-93 = "[s15] «Она мне даже до пояса не достаёт. И идти совсем недалеко.»\n[s16] «Идём, Кохару. Чем дольше ждём, тем выше будет вода.»"
1601303-96 = "Н-Но... Но...!"
1601303-97 = ""
1601303-101 = "А-А-А-А-А-А!"
1601303-102 = "Н-Не уходите! Не оставляйте меня! Возьмите меня с собой!"
1601303-103 = ""
1601303-105 = ""
1601303-108 = "Так мы с Кохару прошли по воде и вернулись на пляж острова."
1601303-109 = "Кохару наотрез отказалась верить, что вода такая мелкая, как я говорил, поэтому до суши мне фактически пришлось нести её на спине."
1601303-114 = ""
1601303-115 = "*шмыг* *всхлип* *шмыг*"
1601303-116 = "*всхлипывает*"
1601303-117 = ""
1601303-119 = ""
1601303-122 = "[ns17] «Ты отлично справилась, Кохару.»\n[ns18] «Нам на самом деле ничего не угрожало...»"
1601303-125 = "Замолчите! Вы такой дурак, Сенсей!"
1601303-126 = "Мне правда было страшно!"
1601303-127 = "Я думала, что что-нибудь случится! Я не ожидала, что вода вдруг так быстро поднимется..."
1601303-128 = "...А?"
1601303-129 = "В воде по пояс ничего не могло случиться?"
1601303-130 = ""
1601303-135 = "Да не в этом дело! Вы не знаете, что там водится! Мне всё равно пришлось заходить в океан!"
1601303-136 = "Я к этому не готовилась... Это совсем не похоже на бассейн в Тринити..."
1601303-137 = "Угх... Ладно... всё равно... *всхлип*"
1601303-138 = ""
1601303-140 = ""
1601303-143 = "С-Сенсей..."
1601303-144 = "Только не уходите никуда... Хорошо? Пожалуйста, останьтесь со мной."
1601303-146 = "Я остался с Кохару и гладил её по спине, пока она плакала."
1601303-147 = "Когда она наконец успокоилась, я отвёл её обратно в лагерь."
