[translation]
84306100200-5 = "Здравствуйте, Юризоно Сэя. К сожалению... вы были правы."
84306100200-6 = "Я проверила экспонаты на Экспо, и здесь определённо есть вещи, которых быть не должно."
84306100200-7 = ""
84306100200-10 = ""
84306100200-11 = "Такие вещи, которые могут вызвать новые происшествия?"
84306100200-12 = "К счастью, не серьёзные. Даже если оставить всё как есть, максимум будет небольшая суматоха."
84306100200-13 = "Хотя понятие «небольшая суматоха» в Миллениум может отличаться от вашего."
84306100200-14 = "Особенно студентам Тринити General School это может показаться немного чрезмерным."
84306100200-15 = "О чём именно речь...?"
84306100200-16 = "Как бы то ни было, похоже, я не могу просто подойти и конфисковать их."
84306100200-17 = "Значит, это будет скрытная операция?"
84306100200-18 = "Верно. Как я и сказала, предметов несколько. Нэру уже отправилась за частью из них."
84306100200-19 = "А остальные собирать мне?"
84306100200-20 = "Если решите принять это задание — да."
84306100200-21 = "Как раз хотела спросить. Я с радостью соглашусь, но тебя устраивает отправлять именно меня?"
84306100200-22 = "Абсолютно. Тебя рекомендовала сама Микамо Нэру."
84306100200-23 = "Если точно, она сказала: «С правильным снаряжением она справится»."
84306100200-24 = "И ты уже доказала свои способности. У меня нет никаких сомнений насчёт того, чтобы отправить тебя."
84306100200-25 = "Понятно. Фуфу... Лестно, что ты настолько мне доверяешь."
84306100200-26 = "Хотя, похоже, Нэру дала мне точную оценку. Она быстро меня раскусила. Неудивительно, что она лидер C&C. Она пугающе проницательна."
84306100200-27 = "Когда мне отправляться? После закрытия Экспо на сегодня, полагаю?"
84306100200-28 = "Да. И, как я сказала, тебе понадобится правильное снаряжение."
84306100200-29 = "...Вот."
84306100200-30 = ""
84306100200-32 = ""
84306100200-34 = "Что это...?"
84306100200-35 = "Тебе придётся обойти большую территорию, поэтому я сделала для тебя сканер. Он поможет найти нужные предметы."
84306100200-36 = "Сканер..."
84306100200-37 = ""
84306100200-39 = ""
84306100200-40 = "Это успокаивает. Спасибо."
84306100200-41 = "...На этом брифинг окончен."
84306100200-42 = "Остальное зависит от тебя, Юризоно Сэя."
