[translation]
41190-1 = "Эпизод 19;Пора взрослеть"
41190-2 = "Крыша главного здания Полицейской школы Валькирии"
41190-4 = "RABBIT 1 докладывает. Сейчас 01:00. Мы прибыли."
41190-5 = "Лагерь RABBIT, можем рассчитывать на воздушную эвакуацию?"
41190-6 = "Мы выбились из графика из-за смены точки сбора."
41190-7 = "Продержитесь пять минут! Мы вас оттуда вытащим!"
41190-8 = "Поняла."
41190-9 = "RABBIT 2, перекрой проход на крышу и установи баррикады."
41190-10 = ""
41190-12 = ""
41190-14 = "Баррикады уже стоят... и я на всякий случай добавила противопехотные мины."
41190-15 = ""
41190-18 = "...Будем надеяться, этого хватит."
41190-19 = "О-Они уже у двери на крышу?"
41190-20 = "Мы вообще продержимся пять минут?"
41190-21 = ""
41190-23 = ""
41190-25 = "Безнадёжная ситуация, враги приближаются, дверь еле забаррикадирована, а мы в напряжении ждём вертолёт..."
41190-26 = "Прямо как в том фильме про зомби, который смотрели на прошлой неделе."
41190-27 = "Чем там фильм закончился?"
41190-28 = "Все зомби прыгнули на вертолёт, он разбился и... все умерли?"
41190-29 = "Это последнее, что я хотела сейчас услышать!"
41190-30 = "Х-Хорошо, что в реальности зомби не существует..."
41190-32 = "...Снова вы."
41190-33 = "И-и-и! Н-настоящий зомби!"
41190-34 = ""
41190-36 = ""
41190-38 = ""
41190-39 = "Серьёзно, вам стоит обращаться ко мне как к директору Бюро общественного порядка. Хотя бы «директор»."
41190-40 = "Директор Канна?!"
41190-41 = "Все проходы на крышу должны быть перекрыты. Как вы сюда попали?"
41190-42 = "Поднялась по ливневым трубам снаружи здания."
41190-43 = "...?! Здесь этажей десять минимум."
41190-44 = "Студент без подготовки к спуску и без снаряжения просто вскарабкался по стене здания?"
41190-45 = "Девиз Бюро общественного порядка — задерживать преступников любой ценой."
41190-46 = "Думаете, вам это сойдёт с рук? Что я просто позволю вам уйти после того, как вы проникли в школу, отвечающую за правоохранительную систему Кивотоса?"
41190-47 = ""
41190-49 = ""
41190-50 = "Бежать больше некуда. Сдавайтесь спокойно."
41190-52 = "..."
41190-53 = "Когда вы, дети, наконец устанете от своих глупых игр?"
41190-54 = "Пора принять реальность. Кивотосу больше не нужна SRT. Она стала бельмом на глазу, а теперь ещё и общественной угрозой."
41190-55 = "Я арестую вас здесь и доложу обо всех ваших грязных делах Генеральному студенческому совету. Даже глава отдела не сможет помешать удалить ваши записи."
41190-56 = "Тогда, похоже, утонем вместе, директор Канна."
41190-57 = ""
41190-59 = ""
41190-61 = ""
41190-62 = "Цель нашей операции — получить реестр Бюро общественного порядка."
41190-63 = "Это доказательство незаконных скидок, которые вы получали от Кайзер Group в обмен на выселение бездомных из города Коусаги."
41190-64 = "Как вы узнали?"
41190-65 = "Полицейская школа Валькирии была вооружена самой дешёвой стандартной экипировкой и уже страдала от сокращения бюджета. Конечно, внезапное появление целого арсенала вызывает вопросы."
41190-66 = "Отвечая за безопасность Кивотоса, Полицейская школа Валькирии обязана исполнять официальные обязанности справедливо и в соответствии с правилами Генерального студенческого совета. Именно такое доверие вам оказали граждане."
41190-67 = "Но вы, директор Бюро общественного порядка, превратили этот инструмент правосудия в жалкий отряд наёмников, вступив в сговор с частными корпорациями ради собственной выгоды."
41190-69 = "Это тяжкое преступление высшего порядка и плевок в лицо справедливости, которую якобы защищает Полицейская школа Валькирии!"
41190-70 = ""
41190-72 = ""
41190-74 = ""
41190-75 = "...Почему..."
41190-76 = "...Почему вы, дети, всегда так выпячиваете грудь и разбрасываетесь красивыми пустыми словами?"
41190-77 = "Справедливо и одинаково... Идеал общественной службы."
41190-78 = "Да, Валькирия служит обществу и должна вести себя соответственно."
41190-79 = "Но угадайте что? Мир не состоит из радуг и бабочек."
41190-80 = "Дисциплина? Справедливость? Ха! Вы прячетесь за иммунитетом и смотрите на всех свысока. А мы каждый день пачкали руки, чтобы реально решать проблемы. ВОТ что такое настоящий мир! Пора вытащить носы из учебников!"
41190-81 = "Думаете, я этого хотела?! Думаете, мне нравится быть плохой?"
41190-82 = "Идеалы не служат правосудию! Служат поступки — неважно, на что приходится идти по пути!"
41190-83 = "Что такие тепличные дети, как вы, вообще знают? Ничего!"
41190-84 = ""
41190-87 = "[ns] «Это всё оправдания, Канна.»"
41190-88 = "Это..."
41190-89 = "[USERNAME] Сенсей..."
41190-90 = "[s1] «Цель никогда не оправдывает средства, Канна. Никогда.»\n[s2] «Убеждения ничего не стоят, если отказываешься от них при первой трудности.»"
41190-91 = "Вы не понимаете. Если бы я держалась за убеждения, потеряла бы всё!"
41190-92 = "Вы не понимаете. Если бы я держалась за убеждения, потеряла бы всё!"
41190-93 = "Я маленькая шестерёнка в огромном механизме! У меня руки связаны! Что мне делать, Сенсей?!"
41190-94 = "[s] «У отряда RABBIT было то же самое, знаешь.»"
41190-95 = ""
41190-97 = ""
41190-98 = "..."
41190-99 = "[s] «Поступать правильно никогда не бывает легко...»"
41190-101 = "[ns] «Но это решение ты должна принять сама.»"
41190-102 = ""
41190-104 = ""
41190-105 = ""
41190-107 = "Похоже, наш тупой Сенсей иногда всё-таки говорит умные вещи."
41190-108 = "Верно! Никто не может решить за тебя, кроме тебя самой!"
41190-109 = "М-Мы тоже боялись и сомневались, когда всё началось..."
41190-110 = "Но мы, психи, всё равно выбрали SRT."
41190-111 = "...Как всегда, спасибо, Сенсей."
41190-112 = ""
41190-114 = ""
41190-116 = ""
41190-118 = ""
41190-119 = "Директор Канна. Я недавно поняла одну вещь: если ваше определение «справедливости» отличается от моего, это ещё не значит, что оно неправильное."
41190-120 = "Но я не могу принять испорченную справедливость, которой прикрываются, чтобы избегать ответственности."
41190-121 = "Вот та огромная стена, которая стоит между нами."
41190-122 = "Я..."
41190-123 = ""
41190-126 = "Мияко, вертолёт приближается!"
41190-127 = "Как быстро летит время, когда болтаешь со старым знакомым."
41190-128 = "Пристегивайтесь к страховкам. Отряд RABBIT, отступаем!"
41190-129 = ""
41190-131 = ""
41190-133 = ""
41190-134 = "Мы закрепились, погнали!"
41190-135 = "Держитесь крепче, чтобы никого не потерять!"
41190-136 = ""
41190-138 = ""
41190-140 = "Нам пора, директор."
41190-141 = "Надеюсь, в следующий раз встретимся при более приятных обстоятельствах."
41190-142 = ""
41190-144 = ""
41190-145 = ""
41190-146 = ""
41190-147 = "Ну... Пожалуй, лучше заранее начать писать письмо с извинениями за всё это..."
41190-149 = "Парк Коусаги"
41190-152 = ""
41190-153 = "Текущее время 01:45. RABBIT 1 прибыла в лагерь RABBIT."
41190-154 = "Потерь нет, «Клевер» получен."
41190-155 = ""
41190-157 = ""
41190-158 = ""
41190-160 = "На этом операция «Клевер» завершена. Отличная работа, все."
41190-161 = "[s] «Я так вами горжусь!»"
41190-162 = ""
41190-164 = ""
41190-166 = "Я вымоталась. Могу уснуть прямо здесь."
41190-167 = "Т-Так хочется спать..."
41190-168 = "Я просто лягу вот тут..."
41190-169 = ""
41190-171 = ""
41190-173 = "Мию, хотя бы сними снаряжение перед сном."
41190-174 = "А ещё напиши отчёт об операции и умойся."
41190-175 = "Кто бы говорил. Я сама сейчас стоя усну."
41190-176 = "Адреналин был бодрящим... но теперь я готова расслабиться."
41190-177 = "Я только... выключу оборудование связи... перед сном..."
41190-178 = ""
41190-180 = ""
41190-183 = ""
41190-184 = "Хи-хи. Сегодня все действительно выложились."
41190-185 = ""
41190-187 = ""
41190-188 = ""
41190-189 = ""
41190-191 = "И как мы заранее договорились, «Клевер» я доверяю вам, Сенсей."
41190-192 = "Мы нашли доказательства, но тот, кто дёргает за ниточки, должен быть довольно влиятельным, раз смог загнать директора Канну в такой угол."
41190-193 = "Мы, может, и обученные агенты, но всё равно студенты и ещё наивны в делах взрослого мира. Здесь наша роль заканчивается."
41190-194 = "Остальное оставляем вам, Сенсей."
41190-195 = "[s] «Спасибо, Мияко. Я не позволю вашим усилиям пропасть зря.»"
41190-197 = "Помогив перенести уснувших студентов в палатки, я вернулся в Шале."
41190-198 = ""
41190-201 = "И, используя доказательства Мияко, разобрался с ситуацией так, как и подобает учителю."
41190-203 = "Следующий эпизод;Лиса в норе"
