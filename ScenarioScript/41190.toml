[translation]
41190-1 = "Episódio 19;Hora dos Adultos"
41190-2 = "Academia de Polícia Valkyrie — Terraço"
41190-4 = "Aqui é RABBIT 1, hora atual 0100. Acabamos de chegar ao ORP."
41190-5 = "Acampamento RABBIT, o apoio aéreo ainda vai demorar?"
41190-6 = "Desculpa, o ponto mudou e acabou atrasando tudo!"
41190-7 = "Aguentem só mais 5 minutos!"
41190-8 = "Entendido."
41190-9 = "RABBIT 2, por favor, monte a barricada. Vamos bloquear o acesso ao terraço."
41190-14 = "Já fiz isso. Por garantia, também espalhei umas minas terrestres na escada, mas..."
41190-18 = "...Foram rápidos."
41190-19 = "J-Já chegaram até a porta...?!"
41190-20 = "Será que isso aguenta por 5 minutos...?"
41190-25 = "Encurraladas no terraço, uma porta trancada, gente batendo na porta e um helicóptero que nunca chega..."
41190-26 = "É igualzinho ao filme de zumbi que eu vi semana passada, hehe..."
41190-27 = "...Só por curiosidade, como é que esse filme terminava?"
41190-28 = "Um zumbi se pendurou no helicóptero, ele caiu e morreu todo mundo."
41190-29 = "Eu que fui idiota de perguntar!"
41190-30 = "M-Mas não tem nenhum zumbi aqui, então..."
41190-32 = "...Vocês de novo?"
41190-33 = "U-Um zumbi?!"
41190-39 = "Quem você está chamando de zumbi? Ao menos me chame de Diretora do Departamento de Segurança Interna."
41190-40 = "Diretora do Departamento de Segurança Interna...!"
41190-41 = "A porta nem foi aberta, como você chegou até aqui?"
41190-42 = "Escalei a parede externa do prédio."
41190-43 = "Sério isso? Esse prédio tem mais de 10 andares... Que loucura..."
41190-44 = "Valkyrie nem deve ter um treinamento desses, e ela veio sem nem usar arnês?"
41190-45 = "O Departamento de Segurança Interna faz o que for preciso para capturar criminosos."
41190-46 = "Não acham mesmo que vão invadir Valkyrie e sair andando tranquilamente, não é?"
41190-50 = "Vocês já estão praticamente cercadas. Parem com essa resistência inútil."
41190-52 = "..."
41190-53 = "Depois de tudo pelo que acabaram de passar e ainda não aprenderam a lição? Perderam o juízo?"
41190-54 = "A Kivotos de hoje não precisa de vocês. Parem de resistir inutilmente e de continuar causando problemas."
41190-55 = "Cometendo esse tipo de crime, se dessa vez o Conselho Estudantil Geral apagar de vez os seus registros estudantis—"
41190-56 = "Diretora do Departamento de Segurança Interna, e quanto aos seus próprios crimes? O que a senhora pensa sobre eles?"
41190-62 = "Encontramos os registros de transações do Departamento de Segurança Interna."
41190-63 = "Expulsar os moradores de rua para a revitalização de \"Kousagi Town\". Em troca, houve propinas ilegais envolvendo o Grupo Kaiser... Não é verdade?"
41190-64 = "Como vocês sabem disso...?"
41190-65 = "Ora, Valkyrie apareceu do nada com equipamentos novos. É natural suspeitar que tinha alguma coisa errada."
41190-66 = "A Academia de Polícia Valkyrie, responsável pela segurança de Kivotos, sujando as mãos com atos criminosos em acordos com uma empresa privada... Isso é, sem dúvida, um problema grave."
41190-67 = "Procedimentos que violam as normas oficiais estabelecidas pelo Conselho Estudantil Geral... Diretora, é impossível que a senhora não soubesse disso."
41190-69 = "Isso é um crime grave que vai contra os próprios ideais da Academia de Polícia Valkyrie!"
41190-75 = "Tsc..."
41190-76 = "...Vocês realmente falam o que bem entendem, não é?"
41190-77 = "Normas oficiais... Pois é."
41190-78 = "Como você disse, Valkyrie deveria seguir as normas oficiais e agir com justiça."
41190-79 = "...Mas o mundo não é tão justo quanto vocês pensam."
41190-80 = "Vocês têm privilégios. E enquanto ficavam aí no alto discursando sobre justiça, sabem o que nós estávamos fazendo? Sabem o quanto tivemos que nos sujar em campo e engolir concessões para cumprir o nosso dever?!"
41190-81 = "Essa é a sociedade! Essa é a realidade!"
41190-82 = "Não dá para continuar defendendo a justiça sem sujar as mãos!"
41190-83 = "O que pirralhas como vocês sabem sobre isso?! O que sabem sobre o peso de ser forçada a tomar uma decisão dessas?!"
41190-87 = "[ns] \"...Kanna.\""
41190-88 = "Essa voz..."
41190-89 = "...Era você, Sensei?"
41190-90 = "[s1] \"Pode ser difícil manter suas convicções. Mesmo assim...\"\n[s2] \"No fim das contas, é você quem continua decidindo o próprio futuro.\""
41190-91 = "Mesmo assim... se eu seguir apenas as minhas convicções, vou acabar perdendo tudo...!"
41190-92 = "Mesmo assim... se eu seguir apenas as minhas convicções, vou acabar perdendo tudo...!"
41190-93 = "Nessa posição medíocre em que estou, eu não consigo fazer nada!!"
41190-94 = "[s] \"O pessoal do Esquadrão RABBIT começou praticamente do zero.\""
41190-98 = "..."
41190-99 = "[s] \"Tudo bem. A situação pode ser difícil, pode ser dolorosa.\""
41190-101 = "[ns] \"Ainda assim, você pode escolher o seu próprio caminho.\""
41190-107 = "...Hmpf, até que falou bonito."
41190-108 = "Mas é verdade. No fim, somos nós que decidimos."
41190-109 = "Eu estive com medo e insegura o tempo todo, mas..."
41190-110 = "Bom, foi uma decisão nossa, afinal."
41190-111 = "...Obrigada, Sensei."
41190-119 = "Diretora. A \"justiça\" de que a senhora fala provavelmente não está errada. É apenas diferente daquela em que eu acredito."
41190-120 = "Porém, se continuar culpando outras pessoas pela origem dela, acho que um dia ela vai acabar perdendo o sentido. \"Que decisões continuamos tomando\" — acredito que seja isso..."
41190-121 = "a diferença entre nós e a senhora."
41190-122 = "..."
41190-126 = "Miyako, desculpa a demora! Cheguei acima do ponto!"
41190-127 = "...Ela chegou."
41190-128 = "Todas, preparem os arneses. Vamos iniciar a extração em ordem."
41190-134 = "Presa e pronta, pode puxar!"
41190-135 = "Se segura firme!"
41190-140 = "...Então, com licença, Diretora."
41190-141 = "Na próxima vez, espero que nos encontremos em circunstâncias melhores."
41190-147 = "Acho que é melhor já ir preparando o relatório de ocorrência."
41190-149 = "Parque Kousagi"
41190-153 = "Aqui é RABBIT 1, hora atual 0145. Chegamos ao Acampamento RABBIT."
41190-154 = "Sem feridos, sem baixas, e o \"Clover\" foi recuperado com segurança."
41190-160 = "...Operação encerrada. Bom trabalho a todas."
41190-161 = "[s] \"Que bom que estão bem. Bom trabalho.\""
41190-166 = "Nossa, estou acabada de verdade, acho que vou desmaiar..."
41190-167 = "Eu também,"
41190-168 = "estou com tanto sono... que já não aguento..."
41190-173 = "Miyu, pelo menos tira o equipamento antes..."
41190-174 = "Ainda tem o relatório da operação, lavar o rosto, escovar os dentes..."
41190-175 = "E depois, hum... Ah, já deu, não aguento..."
41190-176 = "Aah, que cansaço... Também estou ficando com sono."
41190-177 = "Vou só desligar os equipamentos de comunicação por enquanto..."
41190-184 = "Todas se esforçaram muito, afinal."
41190-191 = "...Então, como combinado, vou entregar o \"Clover\" para você, Sensei."
41190-192 = "Não conseguimos descobrir quem é a mente por trás do incidente... mas, se até a Diretora do Departamento de Segurança Interna foi envolvida, tenho a impressão de que há alguém muito astuto puxando os fios."
41190-193 = "Ainda não entendo o mundo dos adultos... mas, como ainda sou uma criança, o que eu podia fazer termina aqui por enquanto."
41190-194 = "Sensei, deixo o resto com você."
41190-195 = "[s] \"Certo, pode deixar comigo.\""
41190-197 = "(Depois disso, levei as alunas adormecidas para dentro das barracas e voltei para a Schale)"
41190-201 = "(...Vou dar um jeito nas provas que recebi da Miyako)"
41190-203 = "Próximo;Toca da Raposa"
