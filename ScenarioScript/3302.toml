[translation]
3302-1 = "Замах на хоум-ран 2"
3302-2 = ""
3302-3 = ""
3302-4 = ""
3302-5 = ""
3302-6 = ""
3302-7 = ""
3302-8 = ""
3302-9 = ""
3302-10 = "*тяжело дышит* Четыр...надцать!"
3302-11 = "Давай, Рэй. Ещё совсем немного."
3302-12 = "Всего одно. Ещё одно — и этот подход закончен!"
3302-13 = "*тяжело дышит* Держу три, два, один..."
3302-14 = ""
3302-16 = ""
3302-17 = ""
3302-18 = "...Пятнадцать!"
3302-19 = "Очень хорошо!"
3302-20 = "Ещё одно!"
3302-21 = "Подождите! Вы же сказали, это было последнее!"
3302-22 = "Почему осталось ещё одно?"
3302-23 = "Ты говоришь, что устала, но я знаю — на ещё одно у тебя сил хватит."
3302-24 = "Сегодняшняя боль приносит завтрашний результат."
3302-25 = "Представь, какой потрясающий рельеф и тонус будут у тебя завтра. До них всего один последний бёрпи!"
3302-26 = "Вы и раньше так говорили!"
3302-27 = "Если подумать, вы даже тайком добавили ещё один подход..."
3302-28 = "Я... сдаюсь..."
3302-29 = "Ладно. Перерыв!"
3302-30 = "Попьём воды и сразу перейдём к следующему упражнению, пока мышцы не остыли!"
3302-31 = ""
3302-33 = ""
3302-38 = ""
3302-39 = ""
3302-40 = "Фух..."
3302-41 = "Кстати, эти упражнения ведь должны помогать с бейсболом, да?"
3302-42 = "Такое чувство, что я больше тренирую бёдра и икры, чем руки и плечи..."
3302-43 = "Не волнуйся. Бёрпи предназначены для тренировки всего тела. Руки, ноги, даже мышцы кора, которые держат тебя вертикально."
3302-44 = "Одними только бёрпи можно и нарастить мышцы, и улучшить кардиореспираторную выносливость!"
3302-45 = "Особенно для человека вроде тебя, который раньше мало занимался фитнесом, стимулировать всё тело эффективнее, чем сосредотачиваться на нескольких случайных группах мышц."
3302-46 = "Но..."
3302-47 = "Я пытаюсь стать королевой хоум-ранов, а не бодибилдером."
3302-48 = "Есть знаменитые слаггеры, которые качали только мышцы рук. Возможно, их кардиовыносливость и была выше среднего... но она им не требовалась!"
3302-49 = ""
3302-51 = ""
3302-52 = "...Рэй."
3302-53 = "Почему ты так сильно хочешь сделать хоум-ран?"
3302-54 = "Потому что это круто! Очевидно же..."
3302-55 = "Хоум-ран — как вершина бейсбольной игры, разве нет?"
3302-56 = "Большинство обычных ударов сами по себе не приносят ни одного очка. А одним замахом можно полностью перевернуть ход игры..."
3302-57 = "Для отбивающего естественно мечтать о хоум-ране."
3302-58 = "Я думаю о них с тех пор, как решила вступить в бейсбольный клуб."
3302-59 = "Я знаю, однажды я выбью сияющий хоум-ран, который приведёт мою команду к победе!"
3302-60 = ""
3302-62 = ""
3302-63 = "Когда ты в последний раз видела, как кто-то сделал хоум-ран?"
3302-64 = "Кажется, на общественном бейсбольном поле. Мы ходили с друзьями в конце прошлого сезона."
3302-65 = "Я никогда не забуду прекрасную дугу, которую мяч прочертил над ограждением."
3302-66 = "Благодаря тому удару домашняя команда сумела отыграться в матче, который почти проиграла, и вырвать победу..."
3302-67 = "...Стой. Ты болела за хозяев или за гостей?"
3302-68 = ""
3302-70 = ""
3302-71 = ""
3302-72 = "(Это была... Стой, какая именно команда?!)"
3302-73 = "(Я помню поле, помню итоговый счёт. Но всё остальное расплывчато...)"
3302-74 = "(Был тот хоум-ран, словно падающая звезда. А что происходило в остальной игре, Рэй?!)"
3302-75 = ""
3302-76 = "...На сегодня, пожалуй, закончим."
3302-77 = "Хорошо. Спасибо за помощь сегодня."
3302-78 = "Кстати... Сегодня вечером есть бейсбольный матч, Рэй?"
3302-79 = "Ммм. По понедельникам матчей регулярного сезона нет. Но на окраине Геенна играет команда младшей лиги."
3302-80 = "Тогда пойдём посмотрим матч!"
3302-81 = "А? Прямо сейчас?!"
3302-82 = "Мы освободили много времени, сократив программу тренировки."
3302-83 = "Так почему бы не компенсировать это выездным занятием!"
3302-84 = ""
3302-86 = ""
3302-88 = ""
3302-89 = ""
3302-90 = ""
3302-91 = "Готова к бодрой пробежке до района Геенна?"
3302-93 = "Отсюда?! Пешком?! Мы никогда не успеем!"
