[translation]
2600502-1 = "Угощение от Сенсея"
2600502-2 = "..."
2600502-3 = "Я знаю, что сама вас позвала, но не ожидала, что вы доберётесь так быстро!"
2600502-4 = "Хм. Похоже, у вас много свободного времени, Сенсей."
2600502-5 = "[s1] «Конечно! Тебе ведь нужна была помощь?»\n[s2] «Ну, если я тебе на самом деле не нужен...»"
2600502-6 = "Угх, вы...!!!"
2600502-7 = "Ладно! Ладно! Я поняла! Можете уже прекратить!"
2600502-8 = "Вы невозможны! Я вообще ничего вам сказать не могу!"
2600502-9 = "Итак, зачем я вас позвала? Ну, как уже говорила: мне нужна услуга."
2600502-10 = "Сегодня в Cafe Mille-Feuille выходит новое ограниченное меню."
2600502-11 = "Поскольку люди наверняка будут закупаться впрок, ввели ограничение на количество покупок."
2600502-12 = "То есть каждому можно купить только один десерт."
2600502-13 = "Ага. Поэтому мне нужна ваша помощь, чтобы купить больше одного."
2600502-14 = "Почему я позвала вас, а не других членов клуба? Да как я могла позвать их?!"
2600502-15 = "У них ведь тоже есть желудки! Слушайте внимательно, Сенсей... Обычно мы все союзники..."
2600502-16 = "Но во время таких событий мы враги! Враги! Они мои соперники!"
2600502-17 = "[s] «Значит... сегодня мне придётся притвориться твоим другом»."
2600502-18 = "Господи! Почему вы обязательно должны говорить именно так?!"
2600502-19 = "В общем... ваш десерт я куплю в знак благодарности. Договорились?"
2600502-20 = "Спасибо за ожидание. Что будете заказывать?"
2600502-21 = "Нам две новые «Coco Paw Mille-Feuille»."
2600502-22 = ""
2600502-23 = "Без проблем. Две «Coco Paw Mille-Feuille»... С вас 6800 иен."
2600502-24 = "Эм, простите? ...6800 иен?"
2600502-25 = "(Ч-Что?! Я не ожидала, что будет настолько дорого!)"
2600502-26 = "(То есть по 3400 иен за штуку?! Быть не может!)"
2600502-27 = "...Мадам?"
2600502-28 = "Эм... Ну..."
2600502-29 = "[s] (Достать банковскую карту и заплатить.)"
2600502-30 = "...Что?!"
2600502-31 = "Спасибо. Оплата прошла."
2600502-32 = ""
2600502-33 = "Сенсей! Что вы делаете?! Зачем вы заплатили?!"
2600502-34 = "Вы платите потому, что вы учитель? Н-но ведь это я вас пригласила!"
2600502-35 = "...Ух!"
2600502-36 = "Ладно... Сегодня я вам это спущу. Но в следующий раз плачу я!"
2600502-37 = "Поняли?! В следующий раз плачу я! Ясно?!"
2600502-38 = "[s3] «Конечно. Я буду здесь, когда позовёшь.»\n[s4] Передать мильфей Ёшими."
2600502-39 = "...!"
2600502-40 = "...!"
2600502-41 = "...Хаха."
2600502-42 = "Ладно, спасибо, Сенсей. До следующего раза! Потом напишу!"
2600502-43 = ""
2600502-44 = ""
2600502-45 = ""
2600502-47 = "(Получив свой мильфей, Ёшими радостно ушла.)"
