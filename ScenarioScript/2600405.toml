[translation]
2600405-1 = "Загадочная охота за сокровищами"
2600405-2 = "Вы пришли, Сенсей! Сюда!"
2600405-3 = "Ха-ха... Что-то случилось? Вы выглядите немного удивлённым."
2600405-4 = "Удивляет, что сегодня в библиотеке никого нет? Сегодня выходной, глупенький."
2600405-5 = "Даже библиотеке нужны выходные, чтобы привести всё в порядок и заняться подобными вещами."
2600405-6 = "В общем, я позвала вас сегодня потому, что..."
2600405-7 = "...мы будем заняты вот этим!"
2600405-8 = "[s1] «Книжный сканер?»\n[s2] «Пистолет?!»"
2600405-9 = "Бинго! Рада, что вы узнали!"
2600405-10 = "Н-нет! Это всего лишь сканер книг!"
2600405-11 = "Если положить книгу под луч..."
2600405-13 = "*пип* *пип* Книга № 00002853, «Свойства и приготовление полыни»."
2600405-14 = "Видите? Он сканирует книгу и автоматически определяет для неё категорию."
2600405-15 = "На сегодня я приготовила небольшую охоту за сокровищами. Я называю её «Поиск спрятанных книг»."
2600405-16 = "Это публичная библиотека, поэтому сюда приходит много студентов из разных академий."
2600405-17 = "Из-за этого поддерживать идеальный порядок во всех книгах довольно сложно."
2600405-18 = "Я часто нахожу на полках книги, которые вообще не зарегистрированы в этой библиотеке!"
2600405-19 = "За годы здесь накопились сотни таких «спрятанных книг»!"
2600405-20 = "Простите?"
2600405-21 = "Я звучу взволнованно? Эм, правда? Н-ну, я..."
2600405-22 = "Ха-ха... Кажется, я только что забыла говорить библиотечным голосом."
2600405-23 = "Только подумайте. Если по библиотеке разбросано столько незарегистрированных книг..."
2600405-24 = "...то среди них наверняка есть загадочная книга, которую даже я никогда раньше не видела."
2600405-25 = "Представьте! Совершенно новая книга! Для меня такие возможности выпадают далеко не каждый день."
2600405-26 = "...Ха."
2600405-27 = "Я опять немного увлеклась..."
2600405-28 = "В-в общем! Поэтому я и попросила вас помочь."
2600405-29 = "Ну что... вы согласны, Сенсей? Знаю, надо было спросить раньше, но вы сегодня свободны?"
2600405-30 = "Если так говорить, звучит, будто я ваш менеджер или что-то вроде того."
2600405-31 = "Мне нравится сортировать книги, но для вас это, наверное, звучит как скучная рутинная работа..."
2600405-32 = "[s3] «Я согласен. Звучит весело.»\n[s4] «Я ни за что не пропущу охоту за сокровищами!»"
2600405-33 = "Ура! Я так рада это слышать!"
2600405-34 = "Ура! Я так рада это слышать!"
2600405-35 = ""
2600405-36 = ""
2600405-37 = "Шимико быстро протянула мне похожий на пистолет сканер книг."
2600405-38 = ""
2600405-39 = "Мы сразу начали искать книги по всей библиотеке, а Шимико шла впереди."
2600405-41 = "Мы обыскали всю библиотеку и нашли больше тысячи незарегистрированных книг — гораздо больше, чем ожидала Шимико."
2600405-43 = "..."
2600405-44 = "Это..."
2600405-45 = "...это уже выходит из-под контроля. И многие книги ещё и повторяются."
2600405-46 = "Мы так и не нашли книгу, которую я раньше не видела. Может, такой вообще нет."
2600405-47 = "Неужели студенты и правда случайно оставили здесь столько книг?"
2600405-48 = "Или это был их способ пожертвовать книги, от которых они не знали, как избавиться."
2600405-49 = "..."
2600405-50 = "Ну... вот это разочарование."
2600405-51 = "*вздыхает*"
2600405-52 = "Простите, Сенсей. Я обещала вам охоту за сокровищами, а получилось только зря потратить время."
2600405-53 = "[s5] «Мне всё равно было весело.»\n[s6] «Но я рад, что ты закончила работу.»"
2600405-54 = "А? Вы правда так думаете?"
2600405-55 = "А? Вы правда так думаете?"
2600405-56 = "Но... сегодня вы только помогали мне сортировать книги."
2600405-57 = "Вы уже нашли сокровище, которое искали? Где?"
2600405-58 = "А?"
2600405-59 = "К чему вы ведёте?"
2600405-60 = "Почему вы так радуетесь?"
2600405-61 = "..."
2600405-62 = "...!"
2600405-63 = "О-откуда это вообще взялось?! Нельзя просто так внезапно говорить подобные вещи!"
2600405-64 = "Я знаю, мы друзья, но вы заставляете меня краснеть!"
2600405-65 = "Ну вы...!"
2600405-66 = "..."
2600405-67 = "Хи-хи..."
2600405-68 = "Ха-ха-ха! Ну вы даёте. На этот раз я вас прощу."
2600405-69 = "Но мне стало легче от того, что вам было весело. Спасибо, Сенсей."
2600405-70 = "И ещё..."
2600405-71 = "...если подумать, я тоже нашла кое-что, чем дорожу."
2600405-72 = "И для меня это очень ценно."
2600405-73 = "Хотите узнать, что именно? Хи-хи."
2600405-74 = "Секрет."
2600405-76 = "После этого Шимико вернулась к своему обычному весёлому настроению и начала сортировать найденные нами книги."
2600405-77 = "В конце концов я покинул библиотеку, проведя весь день за помощью Шимико с книгами."
