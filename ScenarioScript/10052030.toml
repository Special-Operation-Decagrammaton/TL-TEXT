[translation]
10052030-2 = "Прокля-я-я-я-тые!!"
10052030-3 = "Вы ещё пожалеете! Химари, Рио и Сенсей! Вы ещё не победили!"
10052030-4 = ""
10052030-6 = ""
10052030-8 = "Ну что, Рио?"
10052030-9 = "...Да."
10052030-10 = ""
10052030-12 = ""
10052030-13 = ""
10052030-14 = ""
10052030-17 = ""
10052030-18 = "[ns] «Химари! Рио! Вы в порядке?»"
10052030-19 = "О боже. Какая честь, что вы беспокоились обо мне, Сенсей. Все усилия стоили того."
10052030-20 = "Благодаря вашей заботе со мной всё было совершенно хорошо! ♪"
10052030-21 = "На самом деле я дорожу вашим вниманием! Может, стоит почаще заставлять вас волноваться. ♬"
10052030-22 = "Эм... Что бы ты там ни предлагала, думаю, не стоит этого делать."
10052030-23 = "[ns] «Ага. Как Рио сказала.»"
10052030-24 = "Ну вот..."
10052030-25 = "...Хватит дуться, Химари."
10052030-26 = "Я рада, что вы обе целы."
10052030-27 = "Боже мой. Кей тоже обо мне беспокоилась? Я чувствую внезапный прилив восторга!"
10052030-28 = "...!! П-прекрати! В конце концов, ничего особенного!"
10052030-29 = ""
10052030-31 = ""
10052030-32 = "Президент? Госпожа Рио? Думаю, я достала ядро."
10052030-33 = ""
10052030-35 = ""
10052030-37 = "Это... ядро?"
10052030-39 = "Кей? Можешь подтвердить через экран?"
10052030-40 = "Попробую... Эйми, пожалуйста, положи его на землю."
10052030-41 = "Хм? Хорошо."
10052030-42 = ""
10052030-44 = ""
10052030-45 = "..."
10052030-46 = "Анализ... Наблюдатель... Иегова Элохим... Тишина и алчность, изобилие и печаль..."
10052030-47 = "...!"
10052030-48 = "Да. Я уверена. Это ядро Бины."
10052030-49 = "Ты всё это определила отсюда?"
10052030-50 = "Здесь и сейчас — да."
10052030-51 = "...! Понятно. Пока мы ещё только захватываем территорию Бины, область вокруг этой ямы уже интегрируется...!"
10052030-52 = "Именно. Кроме того, это место похоже на вход в Стальной континент, поэтому такое подключение возможно."
10052030-53 = "И... я получила дополнительную информацию из ядра пророка."
10052030-54 = "Какая?"
10052030-55 = "Информация ядра... То есть нематериальные данные..."
10052030-56 = "Высший уровень доступа сети и божественная сила... личность каждой Сефиры можно загрузить в моё тело. Я уже упоминала это раньше."
10052030-57 = "Но если пойти ещё дальше..."
10052030-58 = "Если установить ядра пророков на транспортный корабль и использовать их, мы сможем модифицировать и усиливать сам корабль."
10052030-59 = "Каким образом...?"
10052030-60 = "Ну... Например, если установить ядро Бины на транспортный корабль, корабль сможет использовать часть способностей и мощности Бины."
10052030-61 = "С ядрами других пророков должно быть так же."
10052030-62 = ""
10052030-64 = ""
10052030-65 = ""
10052030-66 = "...? Не может быть!"
10052030-67 = "Это как тот парень, Кей! Круглое существо, которое засасывает врагов и копирует их способности!"
10052030-68 = "Нет, Арис... *вздох*"
10052030-69 = "Я бы предпочла сравнение вроде... оружия на руке, функции которого расширяются установкой специальных чипов."
