[translation]
80000074-1 = "Совершенно новый опыт"
80000074-2 = "Получив сообщение от Казусы, после занятий я пришёл в пустой класс."
80000074-3 = "О, Сенсей. Вы вовремя."
80000074-4 = "Хм? Да ничего особенного. Я не собираюсь просить об услуге или типа того..."
80000074-5 = "Э-Эм... Не задавайте вопросы, на которые и так знаете ответ! Причина очевидна, да?"
80000074-6 = "Я позвала вас из-за праздника, так что... Вот."
80000074-7 = ""
80000074-9 = ""
80000074-11 = "[ns1] «Шоколадно-клубничный торт.»\n[ns2] «Понятно, потому что сегодня День святого Валентина.»"
80000074-12 = "Ну да... Такие дни бывают не каждый день, поэтому..."
80000074-13 = "Ну да... Такие дни бывают не каждый день, поэтому..."
80000074-14 = "В-Вот и всё. Вам наверняка подарили кучу шоколада разные люди. Я не жду, что мой будет чем-то особенным..."
80000074-15 = "...Я ошибаюсь? Вы рады?"
80000074-16 = "Говорите, что всегда будете помнить...?"
80000074-17 = ""
80000074-19 = ""
80000074-20 = "Угх, Сенсей, нельзя просто говорить такие вещи... Не зная..."
80000074-21 = "*вздох* Неважно. Не хочу тратить силы на такое. Давайте просто пойдём дальше."
80000074-22 = "В общем, я не знаю, что вам нравится, поэтому просто выбрала что-то... Простите, если это не то, что вы хотели."
80000074-23 = "...А?"
80000074-24 = "А, почему я взяла торт, а не просто шоколад?"
80000074-25 = "Э-Эм. Не знаю... Я особо не думала."
80000074-26 = "Наверное, он довольно похож на клубничный торт, который я обычно беру. Просто вкус немного другой...?"
80000074-27 = "Что?"
80000074-28 = "Думаете, я просто прихватила его заодно, пока выбирала десерт себе?"
80000074-29 = "К-Как вы можете такое говорить?!"
80000074-30 = "Угх, я... у меня слов нет! Для человека, который получает подарок, у вас слишком много претензий! Вот, отдайте, если не хотите. Я сама съем."
80000074-31 = "Я вообще-то долго его выбирала! Вы хоть раз видели, чтобы я кому-то дарила подарок или покупала что-то на двоих?"
80000074-32 = "Я такого не делаю! Никогда! Не могу поверить, что вы сидите и дразните меня после того, как я—"
80000074-33 = "Что?"
80000074-34 = "О чём вы? Я часто делюсь десертами?"
80000074-35 = "Мы раньше ели вместе?"
80000074-36 = "Это... нелепость..."
80000074-37 = "Эм..."
80000074-38 = "...?"
80000074-39 = "Хм. Вообще-то, Сенсей, разве мы правда делаем это впервые?"
80000074-40 = "[s3] «Да, мы постоянно делимся едой.»\n[s4] «Похоже, ты сама не замечала, что делаешь это...»"
80000074-43 = ""
80000074-45 = ""
80000074-46 = "Эм... Ну, э-э..."
80000074-47 = "Сенсей."
80000074-48 = "Неужели я... может быть. Это просто мысль, ясно?"
80000074-49 = "Я... на самом деле..."
80000074-50 = "Я флиртую со всеми...?"
80000074-51 = "[s5] «Ты слишком много об этом думаешь. »\n[s6] «Хватит говорить и съешь немного торта.»"
80000074-52 = "..."
80000074-53 = "..."
80000074-54 = "Х-Хорошо..."
80000074-55 = "Да. Хорошо."
80000074-57 = "Оставшееся время мы с Казусой провели вместе, деля шоколадный торт."
80000074-58 = "И, забыв, что это вообще-то подарок на День святого Валентина, Казуса забрала клубничную часть себе."
