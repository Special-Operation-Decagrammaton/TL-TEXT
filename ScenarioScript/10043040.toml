[translation]
10043040-1 = "Эпизод 4;Неожиданная встреча"
10043040-2 = "Ого, здесь настоящий хаос. Столько людей."
10043040-3 = "Хотя это логично. Здесь ведь много фанатов «Мародёров»."
10043040-4 = "Такими темпами игра закончится раньше, чем мы успеем проверить хотя бы половину—"
10043040-5 = ""
10043040-9 = "У-у, давайте все отлично проведём день! Время вечеринки!"
10043040-10 = ""
10043040-12 = ""
10043040-13 = "ВОТ это я называю поддержкой. Даже не знаю, кто это, но её энергия передаётся."
10043040-14 = "Может, мне не стоит такое говорить, но болеть за «Героев» иногда довольно выматывающе..."
10043040-15 = "[s] «Погоди, я знаю, кто это...»"
10043040-16 = "Сенсей?"
10043040-19 = "Вперёд! Вперёд! Вы наши..."
10043040-20 = ""
10043040-22 = ""
10043040-23 = "Эм... как там дальше? Неважно!"
10043040-24 = "Крылья нашей мечты! Выше небес!"
10043040-25 = ""
10043040-29 = ""
10043040-30 = "О?"
10043040-31 = "Сенсей!"
10043040-32 = ""
10043040-34 = ""
10043040-35 = "Хи-хи. Ого, просто случайно встретить вас здесь? Вот это удача!"
10043040-36 = "[s] «Ого! Полегче, Ханаэ!»"
10043040-37 = "Эм... Сенсей, кто это...?"
10043040-38 = "Привет! Я Асагао Ханаэ! Первогодка из Рыцарей спасения Генеральной школы Тринити! Медицина не знает границ!"
10043040-39 = "[s] «И правда не знает. Рад тебя видеть!»"
10043040-40 = "Я тоже рада! А кто ваша подруга?"
10043040-41 = "Мы тут обращаемся с Сенсеем как с мячиком для пинг-понга..."
10043040-42 = "Ага, привет! Я Номаса Рэй, первогодка из Научной школы Миллениума. Пока что... *вздох*... состою в Клубе спортивных тренировок."
10043040-43 = "Но ещё я в Бейсбольном клубе Миллениума! Я четвёртый отбивающий!"
10043040-44 = "Ого, правда? Круто!"
10043040-45 = "Ты много знаешь о бейсболе?"
10043040-46 = "Не-а, вообще ничего!"
10043040-47 = "П-Понятно..."
10043040-48 = "Пока что я просто пришла поболеть, но если понадобится медицинская помощь — зовите! Я Рыцарь спасения!"
10043040-49 = "И... почему-то у многих здесь внезапно начала болеть голова..."
10043040-50 = "...но я уже занимаюсь этим! Я нашла старую медицинскую книгу в библиотеке Тринити!"
10043040-51 = "Там было написано: «Головные боли вызывают злые духи, которые проникают в голову и занимают место в черепе»!"
10043040-52 = "Но если РАСКОЛОТЬ череп и налить внутрь немного уксуса — ну, для дезинфекции..."
10043040-53 = "...все злые духи тут же вылетят наружу! И головной боли больше нет!"
10043040-54 = "[s] «Так, НЕТ. Это мы сразу прекращаем.»"
10043040-55 = "Правда? О. Ну, во второй главе была ещё одна теория. Там говорилось: «Головные боли возникают из-за чрезмерного выделения чёрной желчи»."
10043040-56 = "Нужно растолочь семена шлемника и съесть их с мёдом. Это точно вылечит!"
10043040-57 = "(Хм, впервые такое слышу...)"
10043040-58 = "(Но Тринити всё-таки престижная школа. Может, они разработали собственные методы лечения?)"
10043040-59 = ""
10043040-61 = ""
10043040-63 = ""
10043040-64 = "[ns] «В любом случае, что привело тебя сюда, Ханаэ?»"
10043040-65 = "Просто пришла поболеть, как вы и видели."
10043040-66 = "Хотите посмотреть, как я болею, Сенсей? Ты тоже, Рэй!"
10043040-67 = "Выше нос! Вперёд! Дальше, быстрее, сражайтесь!"
10043040-68 = "Ещё раз! Ещё раз! Сделайте завтра ярче!"
10043040-69 = ""
10043040-71 = ""
10043040-73 = "Ты действительно со всей душой болеешь за «Героев»."
10043040-74 = "Спасибо. Им сейчас именно это и нужно."
10043040-75 = "Рада помочь! А кто такие «Герои»?"
10043040-76 = "Ч-Что?"
10043040-77 = "Ну, эм... это название команды... которая сейчас играет."
10043040-78 = "...Или ты болела за «Мародёров»?"
10043040-79 = "...Я НЕ понимаю вопрос!"
10043040-80 = "Я просто услышала, что кому-то нужна хорошая поддержка."
10043040-81 = "Я ведь не могла просто сидеть без дела, правда? Поэтому прибежала!"
10043040-82 = "...Вот так просто, да?"
10043040-83 = "Ага! Всё так просто! Мне нравится поддерживать других людей!"
10043040-84 = "Надеюсь, мои крики помогают им чувствовать себя лучше. Может, они продолжат стараться вместо того, чтобы сдаться."
10043040-85 = "Пока они продолжают стараться, шанс всегда остаётся!"
10043040-86 = "Что может быть лучше, правда?"
10043040-87 = "Если бы капитан была здесь..."
10043040-88 = "...она, наверное, со мной согласилась бы! Сказала бы, что поддержка — это тоже своего рода лекарство, а медицина не знает границ!"
10043040-89 = "[s] «Наверное, она действительно так сказала бы.»"
10043040-90 = "...Знаешь, если честно, на этих трибунах выплёскивается много... сильных эмоций."
10043040-91 = "Но такую чистую страсть, как у тебя, здесь почти не увидишь."
10043040-92 = "Я серьёзно."
10043040-93 = "Может... Может, мы что-то потеряли. Что-то важное."
10043040-94 = "[s] «Теперь у меня будто сердце очистилось. Это точно.»"
10043040-95 = "О, эм, Ханаэ? Ты случайно... может, где-нибудь здесь видела..."
10043040-96 = "...кого-то немного подозрительного или странного?"
10043040-97 = "Или, может, кого-то, кто ОЧЕНЬ-ОЧЕНЬ хочет, чтобы определённая команда победила или проиграла."
10043040-98 = ""
10043040-101 = ""
10043040-102 = "Хм... Не припоминаю, простите!"
10043040-104 = "Вот как..."
10043040-105 = "Забавно. ТЫ выделяешься, и некоторые сказали бы, что из-за этого именно ТЫ самая подозрительная."
10043040-106 = "Но в данном случае я бы сказала, что по иронии это делает тебя НАИМЕНЕЕ вероятным преступником."
10043040-107 = "А? Каким преступником?"
10043040-108 = "Да так, расследуем небольшое местное происшествие. Но если отвлечься от этого: мы только познакомились, а ты уже кажешься мне потрясающей."
10043040-109 = "Спасибо, что делишься своим энтузиазмом со всеми."
10043040-110 = "Как я и сказала, «Героям» сейчас это очень нужно."
10043040-111 = "Я... не уверена, что до конца понимаю, но рада, что смогла помочь. Правда рада!"
10043040-112 = ""
10043040-116 = "Эй, Ханаэ? Можешь быстро помочь нам с кричалкой?"
10043040-117 = ""
10043040-119 = ""
10043040-120 = "А! Мне пора. Кому-то нужна помощь!"
10043040-121 = "Увидимся в следующий раз, Сенсей! Рада была познакомиться, Рэй! Пока-пока!"
10043040-122 = ""
10043040-124 = ""
10043040-125 = "[ns] «И вот она уже убежала, а я даже не успела попрощаться.»"
10043040-126 = "Она просто переполнена энергией. ...Не уверена, что метафора совсем точная..."
10043040-127 = "...но она как хоум-ран."
10043040-128 = "[s] «Хоум-ран?»"
10043040-129 = "..."
10043040-130 = "Для меня хоум-раны — словно коронные драгоценности бейсбола."
10043040-131 = "Некоторые считают, что одиночные хиты стратегически полезнее."
10043040-132 = "Они держат питчера в напряжении и могут приводить к ошибкам защиты."
10043040-133 = "Другие говорят, что хоум-раны лучше, потому что гарантируют очко..."
10043040-134 = "...что бы ещё ни происходило."
10043040-135 = "Но мне всё это неважно. В смысле, я ЛЮБЛЮ всю эту статистику и расчёты..."
10043040-136 = ""
10043040-138 = ""
10043040-139 = "...но для меня хоум-раны — исключение."
10043040-140 = "Трудно объяснить почему. Наверное, можно сказать так..."
10043040-141 = "...для команды, которая ведёт, хоум-ран закрепляет победу. А проигрывающей команде он даёт надежду начать камбэк."
10043040-142 = "Мне нравится дуга, по которой летит мяч после хоум-рана."
10043040-143 = "Та маленькая белая точка, взлетающая высоко в небо."
10043040-144 = "А потом отбивающий спокойно пробегает по базам, и никто ему не мешает? Для меня это потрясающе."
10043040-145 = "И помимо самой игры хоум-раны дают всем надежду, что одним великим моментом мы способны совершить нечто невероятное. Один удар — а в нём столько жизни, энергии и стремления."
10043040-146 = "Такую жизненную силу я нечасто вижу в людях."
10043040-147 = "Но Ханаэ не просто носит её внутри. Она передаёт её другим."
10043040-148 = "...И это вызывает у меня только искреннюю симпатию и восхищение."
10043040-149 = "[s] «Знаешь, ты тоже такая.»"
10043040-150 = "...Ну, иногда, наверное."
10043040-151 = "Поражения всё равно больно бьют по мне. Я знаю, это часть игры."
10043040-152 = "В любой игре иногда выигрываешь, иногда проигрываешь."
10043040-153 = "И, хех, как вы, наверное, знаете, Бейсбольный клуб Миллениума не самая сильная команда."
10043040-154 = "Мы даже с трудом выигрываем тренировочные матчи у роботов, которых собирает Инженерный отдел."
10043040-155 = "Но даже со всеми этими поражениями в статистике я всё равно люблю бейсбол."
10043040-156 = "Это просто значит, что мне нужно принять и победы, И поражения."
10043040-157 = "Хотя побеждать, конечно, приятно. Хи-хи."
10043040-158 = "И я хочу увидеть победу «Героев»."
10043040-159 = "По крайней мере хочу, чтобы они сыграли так, чтобы в конце мы все могли сказать: «Хорошая игра»."
10043040-160 = "Не думаю, что я единственная болельщица «Героев», которая так чувствует."
10043040-161 = "А фанаты «Героев» вообще ОСОБЕННО страстные."
10043040-162 = "Просто подумайте: в любой момент кто-нибудь из них МОЖЕТ выбить хоум-ран. Изменить ход игры, задать новый темп."
10043040-163 = "Может, даже привести к победе. Разве это не потрясающе?"
10043040-164 = ""
10043040-168 = "Говоришь как настоящая спортсменка."
10043040-169 = "Когда смотришь игру «Героев», иначе и нельзя думать, правда?"
10043040-170 = ""
10043040-172 = ""
10043040-173 = "Мы знакомы?"
10043040-174 = "О, он болеет за «Героев» уже двадцать лет. Его называют Улыбающимся монахом!"
10043040-175 = "Это прозвище он получил потому, что всегда смотрит игру и болеет с улыбкой на лице."
10043040-177 = "Ха-ха-ха, вы меня смущаете. Я всего лишь обычный фанат бейсбола."
10043040-178 = "Вот как."
10043040-179 = "Что ж, в этом мы похожи."
10043040-180 = "Мне нравится, что болельщики могут впервые встретиться и сразу вот так открыться друг другу."
10043040-181 = "У нас так много общего. Одинаковый взгляд на игру, одинаковые чувства к ней..."
10043040-182 = "В этом и одна из прелестей бейсбола — да и спорта вообще. Правда, Сенсей?"
10043040-183 = ""
10043040-188 = "Счёт по подачам — три бола и один страйк... и удар! Неглубокий флай на вторую базу!"
10043040-189 = "О боже!"
10043040-190 = "Они уронили мяч! Второй бейсмен «Героев» уронил мяч! Бегун идёт домой!"
10043040-191 = "Не могу поверить, что он уронил этот мяч, друзья!"
10043040-192 = "Это что сейчас было, а?"
10043040-195 = "..."
10043040-196 = ""
10043040-199 = "ВЫ, НЕУДАЧНИКИ! Вы себя бейсболистами называете?!"
10043040-200 = "Пропустить такой простой флай — и ВОТ что происходит!"
10043040-201 = "Да ну вас! Да пошло оно всё! А-А-А!!"
10043040-202 = "[s] «Г-господин Улыбающийся монах?!»"
10043040-203 = ""
10043040-205 = ""
10043040-206 = "..."
10043040-207 = "Ну, Сенсей, похоже..."
10043040-208 = "...даже у монахов терпение не бесконечное..."
