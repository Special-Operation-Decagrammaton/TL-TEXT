[translation]
2004303-1 = "Свежий старт"
2004303-2 = "На Новый год обязательно нужно попробовать новый вид осэти, как думаете?"
2004303-3 = "[s] «Это совершенно в твоём духе, Изуми!»"
2004303-4 = "Правда?"
2004303-5 = "Но знаете что? С обычным осэти мне всегда кажется, будто чего-то не хватает."
2004303-6 = "Обычно осэти состоит из тушёных блюд, которые не требуют использования огня, верно?"
2004303-7 = "Конечно, тушёные блюда вкусные... но!"
2004303-8 = "Но у этого есть побочный эффект: в итоге всё начинает быть похожим по вкусу..."
2004303-9 = "Поэтому я думаю, для нашего гастрономического приключения нужно выбрать другое направление!"
2004303-10 = "[s] «Того самого гастрономического приключения, которое всё ещё продолжается.»"
2004303-11 = "Ага, именно!"
2004303-12 = "Конечно, остатки осэти можно использовать как добавку к набэ, карри с рисом или блюдам с лапшой."
2004303-13 = "Это обогатит вкус, но..."
2004303-14 = "...так ведь можно сделать и в другой раз, да?"
2004303-15 = "Поэтому... сегодня! Я попробовала придумать собственное блюдо осэти!"
2004303-16 = "Я называю его «Особое осэти в стиле Изуми»!"
2004303-17 = "[s] «То есть ты сама приготовила осэти, Изуми?»"
2004303-18 = ""
2004303-20 = ""
2004303-21 = "Ну, сначала я пыталась..."
2004303-22 = "...но для меня это оказалось слишком сложно! Эхехе!"
2004303-23 = "Поэтому я немного поискала информацию."
2004303-24 = "И оказалось, что есть рестораны, которые готовят блюда на заказ. Они сделают почти всё, что попросишь!"
2004303-25 = "Харуна сказала, что тоже иногда ими пользуется! Интернет такой полезный!"
2004303-26 = "В общем, я отправила туда запрос и заказала собственное осэти."
2004303-27 = "Идём, Сенсей!"
2004303-28 = ""
2004303-30 = ""
2004303-32 = "[ns] «Изуми? Изуми?! Хотя бы подожди меня!»"
2004303-33 = ""
2004303-41 = "Ну как, Сенсей? Атмосфера приятная, правда?"
2004303-42 = "Хм? Не похоже на место, где готовят осэти?"
2004303-43 = "Ну, я же говорила, здесь готовят не только осэти. Они делают всё, что закажешь!"
2004303-44 = ""
2004303-46 = ""
2004303-47 = ""
2004303-48 = "Шишидо Изуми, верно? Ваше «Особое осэти в стиле Изуми» готово."
2004303-49 = "Мы принесём его через минуту!"
2004303-50 = ""
2004303-52 = ""
2004303-54 = ""
2004303-55 = "Вот, пожалуйста. Приятного аппетита."
2004303-56 = ""
2004303-58 = ""
2004303-59 = "[ns] «По виду это вполне хорошее осэти.»"
2004303-60 = ""
2004303-62 = ""
2004303-63 = "Правда? Я рада! Говорят ведь, что осэти сначала едят глазами, да?"
2004303-64 = "Так что каким бы необычным оно ни было, если я называю его осэти, оно должно выглядеть как осэти!"
2004303-65 = "Итак... для начала попробуем эти тушёные чёрные бобы!"
2004303-66 = ""
2004303-68 = ""
2004303-69 = ""
2004303-70 = ""
2004303-71 = ""
2004303-72 = "Ага! Такой свежий вкус! Вкусно!"
2004303-73 = "Хм? Выглядят как обычные тушёные чёрные бобы?"
2004303-74 = "Эхехе. Есть маленькая разница. Видите ли..."
2004303-75 = "...ЭТИ бобы, разумеется, сделаны из бобов, плюс уксус и шоколад с 99% какао!"
2004303-76 = ""
2004303-79 = "[ns] «99%... какао? Зачем вообще добавлять его сюда...?!»"
2004303-80 = ""
2004303-82 = ""
2004303-83 = "Ну, это же ЧЁРНЫЕ тушёные бобы, верно? А 99% какао — самый тёмный шоколад. Всё логично!"
2004303-84 = "А дальше... тушёные креветки! Эти креветки на самом деле..."
2004303-85 = "...тушатся с маринованными анчоусами вместо соевого соуса и сахара!"
2004303-86 = ""
2004303-88 = ""
2004303-89 = ""
2004303-90 = "Ого! Этот солёный, насыщенный вкус просто... вдохновляет!"
2004303-91 = "Вы любите камабоко, Сенсей? Я люблю!"
2004303-92 = "А это вообще сделано с клубникой!"
2004303-93 = "[s] «С клубникой?! Почему с клубникой?!»"
2004303-94 = ""
2004303-96 = ""
2004303-97 = "О, вы не знаете? Потому что она розовая."
2004303-98 = "Ага! Я чувствую, как рыбный вкус смешивается с клубничным. Совершенно новый вкус!"
2004303-99 = "Теперь попробуем тушёный батат с каштанами."
2004303-100 = ""
2004303-102 = ""
2004303-103 = ""
2004303-104 = "Ух, сколько острого имбиря!"
2004303-105 = "Почему я добавила имбирь? Эм... ну... Потому что батат, каштаны и имбирь — всё жёлтое! Я же говорила, осэти сначала едят глазами, да?"
2004303-106 = "Хотите попробовать, Сенсей? Ещё здесь есть корень лотоса, тушёный со светлой горчицей. По-английски оба начинаются с буквы «L», поэтому я подумала, что они тоже подойдут друг к другу."
2004303-107 = "А здесь маринованная икра сельди. Я добавила корицу, солёного кальмара и голубой сыр... просто потому, что захотелось!"
2004303-108 = "[s] «Спасибо за предложение, но, пожалуй, я пас!»"
2004303-109 = "Правда...? А ведь это необычно..."
2004303-110 = "А на десерт обязательно нужно что-нибудь мягкое и сладкое. Самая мягкая еда в осэти — рулет из омлета, верно?"
2004303-111 = "Поэтому омлеты в стиле Изуми идут с фиолетовыми чернилами морского зайца и мороженым внутри!"
2004303-112 = "[s] «Мороженое я ещё понимаю, но зачем морской заяц?!»"
2004303-113 = "Посмотрите, Сенсей. Сочетание фиолетового и жёлтого..."
2004303-114 = ""
2004303-116 = ""
2004303-117 = "...вообще-то выглядит не очень красиво. Я представляла иначе. Эх."
2004303-118 = "Но я подумала, что мороженое сможет скрыть рыбный и горький вкус чернил морского зайца..."
2004303-119 = "...и получится ощущение, будто одновременно ешь сладкие вагаси и горький маття!"
2004303-121 = "Изуми продолжила с радостью пробовать своё экспериментальное осэти."
2004303-122 = "По крайней мере, она выглядела по-настоящему счастливой."
2004303-125 = ""
2004303-126 = "Фух! Было вкусно! Вот это я поела!"
2004303-127 = "Столько свежих и разных впечатлений от одного осэти! Иногда я сама себя удивляю!"
2004303-128 = "Кстати... Сенсей? У меня почему-то ощущение, что наслаждаюсь этим только я..."
2004303-129 = "Уф, я так увлеклась едой, что совсем не подумала, нравится это вам... или нет."
2004303-130 = "[s1] «Да нет, Изуми! Со мной всё нормально, правда!»\n[s2] «Я рад твоему экспериментаторскому духу!»"
2004303-133 = "Правда? Но всё же..."
2004303-134 = ""
2004303-136 = ""
2004303-137 = "...Хорошо, Сенсей! В следующий раз я приготовлю что-нибудь вкусное специально для вас!"
2004303-138 = ""
2004303-140 = ""
2004303-141 = "Так что ждите с нетерпением. Хорошо?"
2004303-143 = "Совру, если скажу, что совсем не тревожился..."
2004303-144 = "...но, опять же, перед такой улыбкой трудно устоять."
