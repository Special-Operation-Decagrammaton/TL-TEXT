[translation]
10029055-5 = "Их больше, чем я ожидала...?! Эйми, раньше ты одна отбивалась от всех этих?!"
10029055-6 = "Нет. Сейчас их больше обычного. Реальной угрозы они не представляют, но это займёт больше времени, чем мне хотелось бы."
10029055-7 = "Было бы неплохо иметь больше огневой мощи."
10029055-8 = "...Больше огневой мощи?"
10029055-9 = "...! Больше огневой мощи!"
10029055-10 = "Точно! Вот он, момент! Идеальная возможность!!"
10029055-11 = "Микото! Рейлган, который мы для тебя сделали!"
10029055-12 = "Что? Я?!"
10029055-13 = "К этому времени он уже должен быть полностью заряжен. Просто переключи его в режим рейлгана."
10029055-15 = "Переносной рейлган. Чудо инженерной мысли."
10029055-16 = "Наконец-то я увижу это собственными глазами! Рейлган, который можно держать в руках...!"
10029055-17 = "Аха-ха... Они многого от тебя ждут, Мисака."
10029055-18 = "Ч-Что на вас троих вдруг нашло?! Мне надо переключить режим оружия...?"
10029055-19 = "В-Вот так...? И это?"
10029055-20 = "Быстрее. Они идут."
10029055-21 = "Ладно! Не торопите меня...!"
10029055-22 = ""
10029055-24 = ""
10029055-25 = "...Я сделала это!"
10029055-26 = "Смена режима завершена! ...Огонь!!"
10029055-28 = "Рей...!!"
10029055-30 = "...лган...!!"
10029055-32 = "...!!"
10029055-33 = ""
10029055-35 = ""
10029055-36 = "[ns] «...Огонь!!»"
10029055-39 = ""
10029055-40 = ""
10029055-41 = "...?"
10029055-42 = "...Что?"
10029055-43 = "...А?"
10029055-44 = "Эм..."
10029055-45 = "Он выстрелил...? Только что?"
10029055-47 = "...Ты нажала на спуск?"
10029055-48 = "Ч-Что-то вылетело... По звуку это было похоже... на комара..."
10029055-49 = "П-По сравнению с обычным, это даже немного... мило..."
10029055-50 = "Жаль, что Ширай этого не видела..."
10029055-51 = ""
10029055-54 = "...Они приближаются."
10029055-55 = "Огневой мощи недостаточно, чтобы их сдержать. Нужно сменить тактику."
10029055-56 = "На бой с ними нет времени. Если другого выхода нет, используем взрывчатку, перекроем этот путь и пойдём по маршруту B."
10029055-57 = "..."
10029055-58 = "Ц. Ничего не поделаешь."
10029055-59 = ""
10029055-61 = ""
10029055-62 = "[ns1] «Мисака? Это... монета?»\n[ns2] «Она достала монету из кармана?»"
10029055-65 = "Ты говоришь, нам нужно просто разобраться с этими автоматонами, которые несутся на нас? Тогда сможем продолжить по этому пути?"
10029055-66 = "...Все, отойдите. Сейчас я не в лучшей форме, но..."
10029055-67 = "Если это будет один выстрел, я справлюсь, если сосредоточусь."
10029055-68 = "...?"
10029055-69 = "Один выстрел? Чем ты собираешься стрелять?"
10029055-70 = ""
10029055-72 = ""
10029055-73 = "...!"
10029055-74 = "Назад, все назад, пожалуйста! Стоять слишком близко опасно! Отойдите!"
10029055-75 = "Эм? Ладно..."
10029055-76 = "Ч-Что это за атмосфера?! Все такие напряжённые!"
10029055-77 = "Прямо как перед тем, как кто-то собирается запустить тяжёлую технику."
10029055-79 = "Ну..."
10029055-80 = "...Не скажу, что ты совсем не права."
10029055-81 = ""
10029055-82 = "...Начинаю."
10029055-83 = ""
10029055-85 = ""
10029055-87 = "...!"
10029055-90 = ""
10029055-91 = "...Фух."
10029055-92 = "Ай... Голова."
10029055-93 = "Я правда не могу слишком часто использовать это здесь. Голова просто раскалывается..."
10029055-94 = ""
10029055-95 = ""
10029055-96 = ""
10029055-98 = ""
10029055-99 = ""
10029055-100 = "[ns] «...»"
10029055-102 = "[ns3] «То, что мы сейчас увидели...»\n[ns4] «...это и был рейлган?»"
10029055-105 = ""
10029055-107 = ""
10029055-108 = "Вы бы видели свои лица."
10029055-109 = "Впрочем, понимаю. Меня саму это каждый раз удивляет."
10029055-110 = "Да, впечатляюще грубая сила. Весьма подходит мисс Мисаке."
10029055-111 = "Сенсей? Все?"
10029055-112 = "Они в шоке..."
10029055-113 = ""
10029055-115 = ""
10029055-116 = ""
10029055-117 = "..."
10029055-118 = "..."
10029055-120 = "Она... выстрелила из рейлгана... голой рукой...?"
10029055-121 = "Это буквально... рейлган у неё в руке..."
10029055-122 = "Такова сила... эспера...!"
10029055-123 = "Верно. Вот это настоящий рейлган...!"
10029055-124 = "...?!"
10029055-125 = "Э-Эм?! Что за странная реакция?"
10029055-126 = "Это было потрясающе...! Как ты это сделала? Твоя рука правда способна создать такую мощность?"
10029055-127 = "Котори, я понимаю твоё любопытство, но такие вопросы невежливы."
10029055-128 = "Если ты не против... Можешь показать нам ещё раз? Тот приём, который только что использовала?"
10029055-129 = "П-Показать? Ещё раз...?"
10029055-130 = "Это вообще не та вещь, которой стоит разбрасываться направо и налево."
10029055-131 = "А... Простите."
10029055-132 = "Было бы невежливо просить вас тратить собственные деньги."
10029055-133 = "Хибики, у тебя случайно нет с собой монет? У меня ничего нет..."
10029055-135 = "...А?"
10029055-136 = "Мм... У меня только монета в десять иен."
10029055-137 = "Понятно. Если сила способности зависит от номинала монеты, мы будем ограничены той мелочью, которая сейчас у нас в карманах."
10029055-138 = "П-Погодите. С чего это вообще логичный вывод?"
10029055-139 = "Нет, вообще-то! Проблема даже не в этом...!"
10029055-141 = "У меня есть монета в 500 иен!"
10029055-142 = "...!! Котори...! Пойти на такую жертву ради всех нас...!!"
10029055-143 = "Эй? Алло? Меня вообще кто-нибудь слушает?"
10029055-144 = "Я стреляла не деньгами... Это был обычный жетон из игрового автомата..."
10029055-145 = "Тратить монету в 500 иен было бы расточительством...!"
10029055-146 = "[s5] «Не обращай на них внимания.»\n[s6] «Можно сказать, они легко заводятся...»"
10029055-150 = "По-моему, они нас вообще не слушают..."
10029055-151 = "Разве это не прекрасно, мисс Мисака? Вы наконец-то завели новых друзей, и для этого всего-то пришлось попасть в другой мир."
10029055-153 = "В каком смысле прекрасно?!"
10029055-154 = "Прошу вас. Котори поставила на кон весь свой бюджет на ужин! Если этого недостаточно, возьмите и мои десять иен...!"
10029055-155 = "Пожалуйста!"
10029055-156 = "Примите наши 500 иен!"
10029055-157 = "510 иен!"
10029055-158 = "...510 иен!"
10029055-160 = "Да говорю же..."
10029055-161 = ""
10029055-164 = "...!"
10029055-165 = "*вздыхает*"
10029055-166 = "Сделаю это только один раз. Давайте 500..."
10029055-167 = ""
10029055-169 = ""
10029055-170 = "...510 иен."
10029055-171 = "...И в следующий раз не выбрасывайте деньги впустую."
