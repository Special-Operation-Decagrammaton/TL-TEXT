[translation]
1001502-1 = "Квест Арис: приключение начинается"
1001502-2 = "Улицы Миллениум"
1001502-3 = "Из-за беспокойства я отправился на улицы Миллениум."
1001502-4 = ""
1001502-5 = ""
1001502-6 = ""
1001502-7 = "Мне быстро удалось найти Арис, идущую по улице."
1001502-8 = "Сенсей?"
1001502-9 = "[s1] «Арис. Рад, что с тобой всё хорошо.»\n[s2] «Я волновался за тебя.»"
1001502-10 = "Ба-ба-ба-бам! Бам-бам!"
1001502-11 = "Ба-ба-ба-бам! Бам-бам!"
1001502-12 = "[s3] «...?!»\n[s4] «Это была фанфара?!»"
1001502-13 = "Сенсей присоединился к отряду."
1001502-14 = "Сенсей присоединился к отряду."
1001502-15 = "Наконец у героя появился союзник. Теперь у неё есть собственный отряд."
1001502-16 = "[s5] «Погоди, я не соглашался вступать в отряд.»\n[s6] «Герой...? Мы теперь вот так играем?»"
1001502-17 = "Но в бою вы бесполезны, Сенсей. У вас нет снаряжения и всего одно ОЗ."
1001502-18 = "Но в бою вы бесполезны, Сенсей. У вас нет снаряжения и всего одно ОЗ."
1001502-19 = "Но ничего страшного. Чтобы помогать союзникам, необязательно быть сильным в бою."
1001502-20 = "[s7] «То есть я поддержка.»\n[s8] «Получается, я лекарь?»"
1001502-21 = "Нет. Вы талисман."
1001502-22 = "Нет. Вы талисман."
1001502-23 = "В бою от вас нет пользы, но вы поднимаете настроение всему отряду."
1001502-24 = "[s] «У меня совсем никаких навыков нет...?»"
1001502-25 = "Нет. Вы подбадриваете людей. И всё."
1001502-26 = "[s9] «...»\n[s10] «...!»"
1001502-27 = "Но это всё равно хороший навык."
1001502-28 = "Но это всё равно хороший навык."
1001502-29 = "Теперь, когда вы здесь, мне гораздо лучше. Этого доказательства достаточно."
1001502-30 = "Не каждый способен настолько радовать членов своего отряда."
1001502-31 = "Именно поэтому вы такой замечательный, Сенсей."
1001502-32 = "[s] «С-спасибо, наверное.»"
1001502-33 = "Теперь, когда вы зарегистрированы в отряде, пора отправляться в приключение."
1001502-34 = "Так что с этого момента мы будем..."
1001502-35 = "..."
1001502-36 = ""
1001502-37 = "...двигаться вперёд."
1001502-38 = "[s] «И всё?»"
1001502-39 = "Да. Мы будем двигаться вперёд. Приключение героя всегда начинается с движения вперёд."
1001502-40 = "[s11] «По-моему, это называется просто ходить.»\n[s12] «...Ладно, тогда начинаем.»"
1001502-43 = ""
1001502-45 = "Я неспешно прогулялся с Арис, которая казалась необычно взволнованной."
