[translation]
1001302-1 = "Главное — дистанция!"
1001302-2 = "Окраина района Тринити"
1001302-3 = "..."
1001302-4 = ""
1001302-5 = ""
1001302-6 = ""
1001302-7 = "Я встретил Цуруги, которая бродила вокруг словно зомби."
1001302-8 = "Ранее Цуруги по ошибке отправила мне сообщение. Стоит поговорить с ней."
1001302-9 = "[s1] Сделать вид, что только что её заметил.\n[s2] Помахать ей."
1001302-10 = "...?"
1001302-11 = "...?"
1001302-12 = "?!"
1001302-13 = "..."
1001302-14 = "Ч-Что-о-о-о-о?!"
1001302-15 = ""
1001302-16 = "*вжух*"
1001302-17 = "Цуруги в мгновение ока убежала."
1001302-18 = "[s3] Нужно пойти за ней. Может быть весело.\n[s4] Нужно пойти за ней. Я беспокоюсь."
1001302-23 = "*тяжело дышит* *тяжело дышит*"
1001302-24 = "[s5] «Я думал, что никогда тебя не догоню.»\n[s6] «Почему ты убегаешь?!»"
1001302-25 = "...?!"
1001302-26 = "...?!"
1001302-27 = "Гх. Хаааааа?!"
1001302-28 = ""
1001302-29 = "*вжух*"
1001302-30 = "Цуруги снова убежала изо всех сил."
1001302-32 = ""
1001302-33 = ""
1001302-35 = "[ns] «Стой!»"
1001302-37 = ""
1001302-39 = "[ns] «Подожди!»"
1001302-41 = "*гудок*"
1001302-42 = "Извините!"
1001302-43 = "[s7] «П-постой! Поезд...!»\n[s8] «Цуруги, осторожно!»"
1001302-44 = "...?!"
1001302-45 = "...?!"
1001302-46 = "*бах*"
1001302-47 = "А-а-а-а!"
1001302-48 = "Цуруги сбил поезд, и её отбросило метров на десять."
1001302-49 = "[s9] «...?!»\n[s10] «Цуруги?!»"
1001302-53 = ""
1001302-54 = "(встаёт)"
1001302-55 = "..."
1001302-56 = "П-Прости за это, Сенсей..."
1001302-57 = "[s11] Она выглядит совершенно здоровой...\n[s12] «Это было потрясающе, Цуруги...»"
1001302-58 = "Н-Насчёт того сообщения... Даже не знаю, что сказать..."
1001302-59 = "Н-Насчёт того сообщения... Даже не знаю, что сказать..."
1001302-60 = "Я работала над ним... часов пять..."
1001302-61 = ""
1001302-62 = "*плюх*"
1001302-63 = "[s13] «Пять часов?!»\n[s14] «Цуруги?!»"
1001302-68 = "За пять часов до того, как Цуруги отправила сообщение Сенсею..."
1001302-69 = "..."
1001302-70 = ""
1001302-71 = "*фьюить*"
1001302-72 = "«Главная статья! Семь способов встречаться с кем-то старше!»"
1001302-73 = "«Как завести отношения с человеком старше! Идеальное сообщение, чтобы привлечь внимание!»"
1001302-74 = "«Как не дать ему воспринимать тебя ребёнком!»"
1001302-75 = "«Сохраняйте идеальную дистанцию со старшей пассией! Отстраняйтесь, когда человек приближается, и сближайтесь, когда он отдаляется!»"
1001302-76 = "..."
1001302-77 = "(Сообщение должно быть провокационным? И как это сделать?!)"
1001302-78 = "(Это как выслеживать врагов...?)"
1001302-79 = "Кекекекеке! Кихехехехе!"
1001302-80 = "..."
1001302-81 = "(...Нет, что-то не то.)"
1001302-82 = "(И что мне делать...?)"
1001302-83 = "(Я просто хочу впечатлить Сенсея...)"
1001302-85 = "*тап* *тап* Дав-но. Не. Ви-де-ли-сь. Это. Кен. За. Ки. Цу. Ру. Ги..."
1001302-86 = "Чёрт! Так я никогда не привлеку внимание Сенсея!"
1001302-87 = "Сначала..."
1001302-89 = "(Пять часов спустя...)"
1001302-90 = "А-а-а! Я не знаю, что отправить!"
1001302-91 = "Киааак! Кьяаак!"
1001302-92 = "А-а-а-а... Кьяаоах..."
1001302-93 = "*бип*"
1001302-94 = "(Голос успешно записан. Сообщение отправлено.)"
1001302-95 = "Ч-Что...?"
1001302-96 = "..."
1001302-97 = "Кьяаак?!"
1001302-99 = "..."
1001302-100 = "[s] «Так вот что случилось.»"
1001302-101 = "Я-я прошу прощения за всё это!"
1001302-102 = "[s] «Всё нормально»."
1001302-103 = "...Т-Ты уверен?"
1001302-104 = "Но то странное сообщение, которое я отправила..."
1001302-105 = "Цуруги нервничает."
1001302-106 = "[s15] Погладить её по голове и попросить успокоиться.\n[s16] Успокаивающе погладить её по голове."
1001302-109 = ""
1001302-110 = ""
1001302-111 = "*шорох*"
1001302-112 = "...О?"
1001302-113 = ""
1001302-114 = "*гладит*"
1001302-115 = "[s] Сказать ей, что она может обратиться к тебе в любое время."
1001302-116 = "..."
1001302-117 = "(краснеет)"
1001302-118 = "О... х-хорошо..."
1001302-119 = "П-понятно..."
1001302-120 = "[s] «Но пообещай смотреть по сторонам перед тем, как переходить железную дорогу.»"
1001302-121 = "Я-я запомню..."
1001302-122 = "[s] «Я ведь не хочу, чтобы ты пострадала.»"
1001302-123 = "Ах, уф... Ладно."
1001302-124 = "Цуруги вежливо опускает голову и краснеет."
1001302-126 = ""
1001302-127 = "Хотя за устроенный переполох нам всё равно пришлось извиняться перед сотрудниками станции."
