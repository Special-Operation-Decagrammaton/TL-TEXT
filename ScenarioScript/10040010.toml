10040010-198 = "Пффф... Ниха... Нихахаха!"
10040010-200 = "Тем временем в Шале..."
10040010-201 = ""
10040010-207 = "[ns1] «Ах... Работы слишком много...» \n[ns2] «Не могу поверить, что занимаюсь этим в последний день года...»"
10040010-211 = "Что?! Ты ещё не закончил годовую отчётность? Ч-что значит? Год уже заканчивается!"
10040010-212 = "О... Боже мой. Тут ЕЩЁ столько работы! Почему ты ничего не сказал?!"
10040010-213 = "Сенсеээй!"
10040010-215 = "...Что?"
10040010-216 = "...Срок на следующей неделе, так что всё нормально? Что это за настрой вообще?"
10040010-217 = "Это называется «ГОДОВАЯ» отчётность! Она уже должна быть закончена!"
10040010-218 = "А? Хочешь сдаться?! Нет! Это не игра!"
10040010-219 = "Нельзя просто взять и сдаться! Быстро за работу!"
10040010-220 = "Я зайду проверить, как ты продвигаешься!"
10040010-221 = "...И не думай, что не зайду!"
10040010-223 = "..."
10040010-224 = "Хм... Ты сам себя в это загнал."
10040010-225 = ""
10040010-229 = "[ns3] «...? Кто может звонить мне в такое время?»\n[ns4] Ответить на звонок."
10040010-233 = ""
10040010-234 = "Ура! Ты ответил!"
10040010-235 = "Йаху! Сенсей! Привееет!"
10040010-236 = "[s5] «Коюки? Что случилось?»\n[s6] «Неожиданно слышать тебя в такое время.»"
10040010-239 = "Эй! Не будь таким. Конец года! Что плохого в том, чтобы позвонить лучшему другу?"
10040010-240 = ""
10040010-242 = ""
10040010-243 = "Чем занимаешься? Дай угадаю! Работаешь? Ну потому что это твоя работа и всё такое."
10040010-244 = "А? Нет-нет. Я просто подумала, что ты обычно только этим и занят..."
10040010-245 = "...А?"
10040010-246 = "...? Что? Нет, Сенсей, серьёзно...?!"
10040010-247 = "Да я бы никогда не стала звонить тебе только ради того, чтобы поиздеваться! Вот что ты обо мне думаешь?!"
10040010-248 = "Ну..."
10040010-249 = "Но я, конечно, звоню не просто так! Фуфу..."
10040010-250 = "И не чтобы поддразнить тебя. На самом деле у меня есть кое-что, что тебе понравится."
10040010-251 = "Это..."
10040010-252 = "Барабанная дробь...!"
10040010-253 = ""
10040010-255 = ""
10040010-257 = "[ns7] «Это... набор карточек Mushiqueen?!» \n[ns8] «Вышел новый набор?!»"
10040010-260 = "Нихахаха! Я знала, что ты сразу поймёшь. Именно так: полностью распроданная, свежайшая, только что вышедшая коробка первого издания наборов Mushiqueen!"
10040010-261 = "И прямо сейчас я буду открывать каждый пакет из этой коробки, один за другим! Разве тебе не ужасно интересно, какие легендарки прячутся под фольгой?"
10040010-262 = "...Что?"
10040010-263 = "Как я её достала? Как всё достают — купила за деньги... Дууух..."
10040010-264 = "За чьи деньги? А... Ну, насчёт этого..."
10040010-265 = ""
10040010-267 = ""
10040010-268 = "...Да какая тебе разница?!"
10040010-269 = "[s9] «Тебя опять отругают...»\n[s10] «И как ты собираешься потом с этим разбираться?»"
10040010-272 = "Потом...? Потом...?"
10040010-273 = "Нихахаха! Сенсей! Ох, Сенсей! Ты такие смешные вещи говоришь. Что вообще значит «потом»?"
10040010-274 = "Сегодня последний день года! Значит, «потом» — это уже в следующем году, разве нет?"
10040010-275 = "Так зачем ты уже переживаешь о проблемах следующего года? Вот тревожный!"
10040010-276 = "Надо жить настоящим! А в нашем нынешнем настоящем, прямо в этот самый момент, важно только открыть этот набор! Да? Да?!"
10040010-277 = "[s11] «Твоя логика — это нечто...» \n[s12] «Хотя она довольно оригинальная...»"
10040010-280 = "В любом случае! Ты зациклился на бесполезной ерунде! Важно то, что я прямо сейчас открываю этот набор!"
10040010-281 = "Я специально решила разделить с тобой этот исторический момент, а ты вот так реагируешь! Угх, Сенсей!"
10040010-282 = "...Что? Где я сейчас?"
10040010-283 = "Ну, там же, где и всегда, наверное... В Комнате самоанализа."
10040010-284 = ""
10040010-287 = "[ns13] «Всегда... всегда...»\n[ns14] «Когда Комната самоанализа наконец начнёт выполнять своё настоящее предназначение?»"
10040010-290 = "Нихахаха! У тебя на лице написано: «Ого! Коюки такая крутая!»"
10040010-291 = "Так когда будем открывать? У нас вся ночь впереди! Я могу тебя подождать."
10040010-292 = "...Что?"
10040010-293 = "Ты... не можешь прийти? Тебе нужно закончить работу?"
10040010-294 = "...Юука тебя отругает, если сегодня не закончишь?"
10040010-295 = "Что вообще...?"
10040010-296 = ""
10040010-298 = ""
10040010-299 = "*вздыхает*..."
10040010-300 = "Ты вообще хоть одно моё слово услышал, Сенсей?!"
10040010-301 = "Я же уже сказала! Проблемы следующего года — забота следующего года!"
10040010-302 = "Это совсем на тебя не похоже, Сенсей. Так бояться какого-то далёкого неизвестного будущего."
10040010-303 = "[s15] «На меня не похоже?»\n[s16] «А кем ты вообще меня считаешь...?»"
10040010-306 = "Ц. Это... Это проблема!"
10040010-307 = "Ладно! Я всё поняла! Ты не оставил мне выбора. Посмотрим, сколько ты выдержишь, прежде чем сдашься!"
10040010-308 = "Фуфу... Готовься увидеть..."
10040010-309 = "[s17] «...Коюки?»\n[s18] «Что ты задумала...?»"
10040010-312 = ""
10040010-314 = ""
10040010-315 = "...мою прямую трансляцию распаковки! Поехали!"
10040010-316 = "Вот первый пакет!"
10040010-317 = "Открываю!"
10040010-318 = ""
10040010-320 = ""
10040010-321 = "[ns] «...»"
10040010-323 = "[ns19] «...!»\n[ns20] «Прямой эфир, прямо сейчас...?!»"
10040010-326 = ""
10040010-327 = "Хммм. Ничего хорошего."
10040010-328 = "Нихахаха! Ни одной нормальной карты! А я-то была уверена, что хотя бы одна выпадет!"
10040010-329 = "Ну, наверное, я немного жадничала. Всё-таки это только первый пакет из многих!"
10040010-330 = "Многих... но не бесконечных... Возможно, придётся открыть вообще все, чтобы найти что-то хорошее..."
10040010-331 = ""
10040010-333 = ""
10040010-334 = ""
10040010-335 = ""
10040010-336 = "А потом... они исчезнут навсегда, правда, Сенсей?"
10040010-337 = "[s21] «Ах ты...!»\n[s22] «Это грязный приём, чтобы меня спровоцировать!»"
10040010-340 = "Хм, хихи. Ну. КОНЕЧНО же я хотела пережить этот исторический момент вместе со своим дорогим учителем."
10040010-341 = "Жаль, что ты такой прилежный взрослый, которого карты совершенно не интересуют."
10040010-342 = "Похоже, у меня просто нет другого выбора! Придётся открыть их все самой, один за другим."
10040010-343 = "Интересно, какие новые карты будут в этом совершенно новом наборе? Какие у них характеристики?"
10040010-344 = "Знаешь, если бы мы занялись этим сегодня, то могли бы даже собрать новые колоды и сразу испытать их вместе... с этими блестящими новыми картами..."
10040010-345 = "Но, о ужас, раз все наборы распроданы, новая поставка будет минимум через неделю. К тому времени остальные уже раскроют все новые карты."
10040010-346 = "Похоже, самостоятельно собрать новую колоду у тебя не получится... Придётся просто скопировать чужие, наверное."
10040010-347 = "...Если тебя это устраивает, Сенсей..."
10040010-348 = "Ты же такой, такой, та-а-акой занятый, правда? И работа невероятно-супер-пупер-важная, да-а-а?"
10040010-349 = "...Именно так ты и думаешь, ДА?"
10040010-350 = "[s23] «Угх... *скрежет* *скрежет*»\n[s24] «Куросаки... КОЮКИ...! (щёлк)»"
10040010-353 = "...Хи-хи-хи."
10040010-354 = "Твой разум говорит быть хорошим и сосредоточиться на работе, но хотя бы сердце у тебя честное. Так что спрошу в последний раз."
10040010-355 = "Это последняя ночь года, когда мы можем впервые пережить это вместе... Ну что скажешь?"
10040010-356 = ""
10040010-358 = ""
10040010-359 = "...Зелёный свет?"
10040010-360 = ""
