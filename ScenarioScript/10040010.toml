10040010-147 = "...Гья!"
10040010-149 = "Не понимаю. По-твоему, Ноа трудно прочитать?"
10040010-150 = "Это полная бессмыслица. Ты думаешь, Ноа такая же, как ты?"
10040010-151 = "Ноа иногда любит пошутить, но она не такая, как ты! Вот тебя прочитать невозможно!"
