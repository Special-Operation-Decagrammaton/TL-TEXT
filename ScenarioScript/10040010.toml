10040010-108 = "Коюки, тебе не нужно знать, просто... потерпи."
10040010-109 = "Прости, что прошу, Ноа, но ты сегодня занята?"
10040010-110 = "О? Нет, я совершенно свободна."
10040010-111 = "Тогда одолжи мне немного своего времени. Спасибо!"
10040010-112 = "Коюки! Если ещё хоть раз выкинешь что-нибудь, в этот раз я точно это не спущу, поняла?!"
10040010-113 = "«Н-не спущу»? И что ты со мной сделаешь?!"
10040010-114 = ""
10040010-116 = ""
10040010-117 = "...Гья!"
10040010-118 = "П-пожалуйста! Только не натравливай на меня Ноа! Только не снова!"
10040010-119 = "Н-Ноа? Почему именно ЕЁ ты боишься?"
10040010-120 = "Ты хоть понимаешь, что к Ноа и ко мне относишься совершенно по-разному?! Ты меня вообще всерьёз не воспринимаешь?!"
10040010-121 = "Неважно, насколько хороша память Ноа...!"
10040010-122 = "Нет, дело не только в этом..."
10040010-123 = "Хм. Как бы объяснить? Ну ты ведь тоже это чувствуешь!"
10040010-124 = "У Ноа есть особый способ... давить? Типа того?"
10040010-125 = "Она может говорить одно, но у меня всё равно ощущение, что думает она совсем другое."
10040010-126 = "...Знаете?"
