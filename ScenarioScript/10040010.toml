[translation]
10040010-1 = "Эпизод 1;Соучастник"
10040010-2 = "Хи-хи-хи..."
10040010-4 = "Наконец-то... конец года. Последний день."
10040010-5 = "Какой же бурный год, полный потрясений. Этот благословенный покой кажется почти галлюцинацией."
10040010-6 = "...И несмотря на всё это, я выжила."
10040010-7 = "Именно! Я! Я одолела все препятствия, которые сговорились преградить мне путь к счастью!"
10040010-8 = "И я даже немного собой горжусь! Поэтому..."
10040010-9 = "...Я позволю себе эту маленькую награду за то, что пережила такую тяжёлую и бурную жизнь."
10040010-10 = ""
10040010-14 = "Подниму же этот одинокий тост!"
10040010-15 = "За мир, в котором всё шиворот-навыворот, и за меня — бедную одинокую душу, жаждущую свободы, но вынужденную подчиняться."
10040010-16 = ""
10040010-19 = "...«За здоровье!»"
10040010-20 = ""
10040010-24 = ""
10040010-25 = ""
10040010-26 = "...Ах."
10040010-30 = ""
10040010-31 = "В смысле «Ах»? Ты вообще что делаешь? И ещё этот странный фон на мониторе..."
10040010-32 = "На фото красивый ночной пейзаж. Ты решила подстроиться под его настроение, Коюки?"
10040010-34 = "С-странный?! В какой вселенной это странно? Имей хоть немного вкуса, господи!"
10040010-35 = "Не хочу слышать от тебя обвинения в отсутствии вкуса."
10040010-36 = "Не видишь, что я сейчас лечу свою измученную душу? Я устраивала одинокую вечеринку в честь конца года! В одиночку! Только для себя!"
10040010-37 = "Нет, не устраивала. Ты в Комнате самоанализа. Здесь ты должна размышлять о своих поступках, а не устраивать вечеринки."
10040010-38 = "И от чего именно ты так устала?! Ты тут живёшь припеваючи, и довольно комфортно, между прочим!"
10040010-39 = "Ха! Комфортно?! Чушь собачья! Конечно, тому, кто меня сюда запихнул, кажется, что мне комфортно!"
10040010-40 = "Ты! Ты преступница! Ты здесь только потому, что спустила бюджет Семинар! СНОВА!"
10040010-41 = "Колись! На что ты вообще потратила все эти деньги?!"
10040010-42 = "Я тебе снова и снова говорила: средства Семинар — не твой личный кошелёк!"
10040010-43 = ""
10040010-45 = ""
10040010-46 = "*вздыхает*"
10040010-47 = "Учитывая твою полную неспособность к самоанализу, я уже сомневаюсь, есть ли вообще смысл держать тебя здесь."
10040010-49 = "...?!"
10040010-50 = "Т-так ты меня отпускаешь?!"
10040010-51 = "...? Это ещё что...?"
10040010-52 = "Ты полностью извратила мои слова. Ты такая..."
10040010-53 = "Чееееего?! Но ты же только что сказала, что держать меня взаперти бессмысленно!"
10040010-54 = "ГЬЯ! Ты меня обманула! Лгунья! Злюка! Это жестокое и необычное наказание!"
10040010-55 = "...Ты настолько нелогична, что мне даже отвечать не хочется."
10040010-57 = "Но это так на неё похоже, разве нет?"
10040010-59 = "Ха...!"
10040010-60 = "Л-ладно, просто выслушай. Конечно, возможно, я сделала что-то совсем-совсем чуточку неправильно, но—"
10040010-61 = "Чуточку...? Совсем...?"
10040010-62 = "НО! Даже если я немного ошиблась, ты знаешь, какой сегодня день? Последний день года! Праздник!"
10040010-63 = "И быть запертой в этой тюрьме под видом Комнаты самоанализа в такой день..."
10040010-64 = "Даже ты должна понимать, насколько ужасно и жестоко видеть меня такой именно — подчеркну — в самый последний день года!"
10040010-65 = "Разве я... не заслуживаю хоть чего-нибудь?"
