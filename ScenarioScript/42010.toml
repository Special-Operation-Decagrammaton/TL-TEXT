[translation]
42010-1 = "Эпизод 1;Сон лисы"
42010-14 = "У второго завода боеприпасов Кайзер Индастриз, окраина D.U."
42010-17 = "...Два года назад."
42010-18 = "Добрый вечер! Добро пожаловать на канал Школы журналистики «Кронос» — единственный настоящий источник самых горячих новостей!"
42010-19 = "Сейчас мы находимся прямо перед вторым заводом боеприпасов Кайзер Индастриз!"
42010-20 = "Этот завод производит почти треть всех боеприпасов Кайзер Индастриз, и в последнее время вокруг этого промышленного гиганта ходят странные слухи."
42010-21 = "По слухам, второй завод боеприпасов разрабатывает оружие массового поражения, напрямую нарушая правила Генерального студенческого совета!"
42010-22 = "Однако Кайзер Индастриз категорически всё отрицает, а слухи пока ничем не подтверждены. Но наша история только начинается!"
42010-23 = "Поскольку расследование Полицейской школы Валькирии застопорилось, другой источник сообщает, что председатель Генерального студенческого совета направила недавно созданную специальную следственную группу, чтобы—"
42010-24 = ""
42010-27 = "А! Вы это сняли? Огромный взрыв! Мы в прямом эфире! Повторяю, мы в прямом эфире!"
42010-28 = "Мы выясняем причину взрыва! Неужели это побочный эффект незаконной разработки оружия?!"
42010-30 = "*кашель* *кашель*"
42010-31 = "Какого чёрта, Отоги? Ты не сообщила о ловушке у выхода!"
42010-32 = "О...? Ах! Ах да. Я собиралась сказать."
42010-33 = "В следующий раз говори ДО того, как мы активируем бомбу!"
42010-34 = "Куруми, как всегда, заряжена!"
42010-35 = "Это случилось уже после завершения операции, никто не пострадал. Всё нормально."
42010-37 = "Мы видим несколько тяжеловооружённых студентов, выходящих из облака пыли!"
42010-38 = "Неужели это та самая Группа специального реагирования, которую недавно создала председатель Генерального студенческого совета?"
42010-39 = "Простите, здравствуйте! Можно пару слов? Кто вы?!"
42010-41 = "Хи-хи. Похоже, папарацци нас догнали."
42010-42 = "Ну, лучшего момента и не придумать. Председатель как раз хотела официально представить SRT."
42010-43 = "Я услышала SRT? Значит, слухи правдивы?"
42010-45 = "Приветствую граждан Кивотоса."
42010-46 = "Я Шичидо Юкино, лидер отряда FOX академии SRT."
42010-47 = "Председатель Генерального студенческого совета создала SRT и отряд FOX, чтобы Кивотос мог эффективнее бороться с угрозами, слишком серьёзными для одного района или полиции Валькирии."
42010-48 = "Если вас отправили бороться с преступностью в D.U., означает ли это, что академия SRT в итоге собирается заменить Полицейскую школу Валькирии?!"
42010-49 = "Мы никогда не смогли бы заменить бесценную работу Валькирии по защите общества. Мы — специализированные оперативные группы, обученные быстро реагировать на преступников или ситуации, непосредственно угрожающие безопасности Кивотоса, как сегодня."
42010-51 = "Кстати о сегодня: что вы делали на заводе боеприпасов Кайзер?! Что стало причиной только что произошедшего взрыва?"
42010-52 = "Можете подтвердить, что здесь действительно разрабатывают оружие массового поражения?!"
42010-54 = "Ну..."
42010-55 = ""
42010-58 = "То есть... запрета на разглашение нам не давали. Раз операция закончена, не думаю, что будет вред рассказать."
42010-59 = "Несколько дней назад мы получили от анонимного источника доказательства, что на заводе боеприпасов Кайзер Индастриз в нарушение правил Генерального студенческого совета хранится мощная бомба."
42010-60 = "В прошлом году Кайзер объявила проект A.N.T.I.O.C.H. по модернизации старых термобарических гранат. На деле здесь разрабатывали и хранили термобарические боеголовки для баллистических ракет."
42010-62 = "Наша сегодняшняя миссия заключалась в нейтрализации этой взрывчатки, и я рада сообщить об успехе."
42010-63 = "Термобарическая боеголовка?! Насколько серьёзной была опасность для жителей Кивотоса?"
42010-64 = "Это предсерийный прототип, и мы всё ещё его анализируем..."
42010-66 = "Но по имеющимся данным и просто размеру боеголовки мы предполагаем, что радиус поражения A.N.T.I.O.C.H. при взрыве мог составлять несколько километров."
42010-67 = "Несколько километров?! И одного вашего отряда хватило, чтобы справиться с такой взрывчаткой?"
42010-68 = "Разве для этого не потребовалось бы целое подразделение с кучей защитного снаряжения?"
42010-70 = "Если бомба настолько опасна, сколько пехоты ни бросай — это ничего не решит."
42010-71 = "Вот именно. Ради таких ситуаций SRT и существует."
42010-72 = "SRT состоит из небольших элитных групп, обученных захватывать или нейтрализовывать цель ещё до того, как она поймёт, что происходит. Как в этой операции."
42010-73 = "И у нас неплохо получается! После проникновения в здание нам понадобилось меньше трёх минут, чтобы захватить боеголовку."
42010-74 = "...Если точно, две минуты сорок пять секунд."
42010-75 = "Было бы две минуты тридцать секунд, если бы нам не пришлось разбираться с неожиданным столкновением у входа."
42010-76 = "«Неожиданным столкновением»... Пф. Ты про то, как Куруми случайно бросила дымовую гранату вместо светошумовой в сторону точки «Дельта»?"
42010-77 = "Случайно?! На охране были визоры с защитой от вспышек!"
42010-78 = "Я приняла тактическое решение сократить дистанцию дымовой гранатой и обезвредить их."
42010-79 = "А это вообще не понадобилось бы, если бы ты сняла охранника, как было указано в плане!"
42010-80 = "О. Хи-хи. Ну, иногда я забываю считать, сколько патронов зарядила."
42010-81 = "Милая маленькая ошибка, очень распространённая среди снайперов. Как можно считать всех этих крошечных врагов?"
42010-82 = "Не пытайся строить из себя милашку, чтобы отвлечь от ошибки!"
42010-83 = "Ну-ну. Отоги, Куруми, не ссорьтесь перед камерами!"
42010-85 = "Подведём итог: операция завершилась успешно благодаря скрытному и своевременному выполнению плана. Бомба обезврежена, подозреваемый задержан."
42010-86 = "Также удалось установить имена нескольких руководителей Кайзер Индастриз и членов Оборонного отдела, фигурирующих в секретных документах, найденных на заводе..."
42010-87 = "Похоже, эти руководители брали взятки перед запуском проекта A.N.T.I.O.C.H. в обмен на подделку отчётов безопасности завода боеприпасов."
42010-88 = ""
42010-91 = "Разве Оборонный отдел не является подразделением Генерального студенческого совета, отвечающим за безопасность Кивотоса?"
42010-92 = "То есть в конечном счёте вы раскрываете дыру в системе безопасности самого Генерального студенческого совета?! И SRT, подчиняющаяся непосредственно председателю, имеет право раскрывать такую информацию?!"
42010-93 = "...Вы неправильно понимаете."
42010-94 = "Справедливость - это путь к сохранению истины."
42010-96 = "Каким бы ни было препятствие, справедливость SRT не колеблется."
42010-97 = ""
42010-107 = "..."
42010-108 = "О! Доброе утро, Юкино."
42010-109 = ""
42010-110 = "Утро? Который час?"
42010-111 = "03:15 по стандартному времени Кивотоса..."
42010-112 = "До следующей смены ещё есть время. Отдохни, пока можешь."
42010-113 = "Я в порядке. Спасибо за дежурство."
42010-116 = "...Тебе снился хороший сон?"
42010-117 = "Хм... С чего ты взяла?"
42010-118 = "Мне показалось, во сне у тебя мелькнула едва заметная улыбка."
42010-119 = "Ха. Скорее кошмар."
42010-120 = "Горько-сладкое воспоминание, которое до сих пор звучит в голове."
42010-121 = "Ах... Это я понимаю."
42010-124 = "FOX 4. Статус?"
42010-125 = "FOX 4 на связи. Генеральный студенческий совет всё ещё дрыхнет."
42010-126 = "После башен апокалипсиса совет так и не восстановился. Там до сих пор хаос."
42010-127 = "Хуже всех временной председатель Рин. Её критикуют со всех сторон за то, что во время кризиса её будто вообще не было."
42010-128 = "Из-за этого никто не хочет принимать её Политику восстановления D.U. Полный тупик."
42010-129 = "Значит, план работает. Если бы мы не атаковали башню Санктум прямо перед закрытием SRT и не вывели из строя всех сторонников Рин, сейчас она не сидела бы в львином логове."
42010-130 = "А что с Административным советом?"
42010-131 = "Скука. Руководители Культурного и Медицинского отделов всё ещё не оправились после ранений во время налёта. Их обязанности тихо выполняют старшие менеджеры."
42010-132 = "На повседневной работе это не сказывается, но у Административного совета сейчас фактически нет официально уполномоченного руководства."
42010-133 = "Хорошо. Немедленно сообщайте о любых изменениях."
42010-134 = ""
42010-136 = ""
42010-137 = "Эм... командир... То есть FOX 1."
42010-138 = "Но что если..."
42010-139 = "Что если главы отделов поправятся и вернутся в совет?"
42010-140 = "Тогда Кае конец, разве нет?"
42010-141 = "Я дала тебе чрезвычайные протоколы на изучение, FOX 4."
42010-142 = "«В любой момент глава обороны Кая должна иметь поддержку большинства Административного совета против главного администратора Рин»."
42010-143 = "«Если сторонники главного администратора Рин попытаются вернуться в совет, отряд FOX уполномочен любыми необходимыми средствами вывести их из строя на достаточно продолжительный срок»."
42010-144 = ""
42010-146 = ""
42010-147 = "...FOX 4, конец связи."
42010-148 = ""
42010-150 = ""
42010-151 = ""
42010-152 = "FOX 3. Статус?"
42010-153 = "FOX 3, докладываю. Мы взорвали ЭМИ-бомбу на железнодорожной базе района Китаяма и отключили систему управления движением. Всё ключевое электронное оборудование выведено из строя."
42010-154 = "ЭМИ-бомбу тоже удалось сразу забрать, так что установить причину сбоя будет почти невозможно."
42010-155 = "СМИ уже подхватили? Как освещают?"
42010-156 = "Генеральный студенческий совет официальных заявлений не делал, вероятно, потому что сам не знает причины. Общество считает это аварией по вине совета."
42010-157 = "Основной удар критики приняли директор Транспортного отдела и временная председатель Генерального студенческого совета Рин. От внимания СМИ им ещё долго не уйти."
42010-158 = "Принято. FOX 3, немедленно возвращайся в штаб."
42010-159 = ""
42010-161 = ""
42010-162 = "FOX 1, у меня вопрос... Ты думаешь... это справедливость?"
42010-163 = "Во время операции мы встретили гражданина, который не мог добраться до больницы и получить помощь из-за остановки поездов. Если продолжим подобные—"
42010-164 = "Этот гражданин каким-либо образом помешал твоей операции?"
42010-165 = ""
42010-167 = ""
42010-168 = "...Нет. Не помешал. Поняла. FOX 3 возвращается в штаб."
42010-169 = ""
42010-171 = ""
42010-172 = ""
42010-174 = ""
42010-175 = "Юкино... Ну же..."
42010-176 = "Мне сейчас не нужны твои язвительные замечания, Нико."
42010-177 = "Тогда без язвительности. Я пойду за тобой хоть в ад ради возрождения SRT, но то, что мы сейчас делаем? Мы причиняем вред невинным гражданским."
42010-178 = ""
42010-180 = ""
42010-181 = "Куруми была права. Это не та справедливость, за которую сражается SRT. Разве нет?"
42010-182 = "Я отказалась от таких вопросов, когда приняла эту операцию. Советую тебе сделать то же."
42010-183 = "SRT всегда была оружием. Куда владелец направит оружие и выстрелит — его привилегия и ответственность."
42010-184 = "Никому не нужно оружие с собственной волей. С собственным мнением."
42010-185 = "Мораль... Этика... Это проклятие, которое несёт владелец."
42010-186 = "..."
42010-187 = "Если не можешь принять свою роль — уходи. Я... Отряд FOX продолжит."
42010-188 = ""
42010-190 = ""
42010-191 = ""
42010-192 = "...FOX 2, конец связи."
42010-193 = ""
42010-195 = ""
42010-196 = "Хорошо. Последний пункт..."
42010-197 = "Нам нужно выйти на контакт с отрядом RABBIT."
42010-198 = "Из Отряд RABBIT?"
42010-199 = "Пойдёшь увидеться с малышами?"
42010-200 = "...FOX 3, FOX 4. Не говорите без разрешения."
42010-202 = "Прости-прости. Я просто радуюсь перспективе повеселиться."
42010-203 = "Я тоже хочу увидеть младших..."
42010-204 = "*вздыхает*"
42010-206 = "Мы выполнили все срочные миссии... Почему бы не устроить совместное мероприятие? Когда мы последний раз были все вместе?"
42010-207 = "FOX 3 и 4 уже выполнили все приказы. Четвёртой вообще не придётся двигаться до дня «Д»."
42010-208 = "Вот именно! А у кроликов ещё даже церемонии посвящения не было."
42010-209 = "Мы предадим традиции SRT, если не устроим хотя бы лёгкую дедовщину."
42010-210 = "Хи-хи. Тогда мне нужно начинать сейчас, если хочу приготовить достаточно инаризуси на всех."
42010-211 = ""
42010-213 = ""
42010-214 = ""
42010-215 = "...Ладно-ладно. Убедить младших будет непросто, поэтому единый фронт всё равно лучше."
42010-216 = "FOX 3 и FOX 4, возвращайтесь в штаб и начинайте готовиться к нашей приветственной вечеринке."
42010-217 = ""
42010-220 = ""
42010-221 = "Есть!"
42010-222 = ""
42010-224 = ""
42010-225 = "Давно мы не встречались, так что устроим им тёплый приём."
42010-227 = "Следующий эпизод;Сон RABBIT"
