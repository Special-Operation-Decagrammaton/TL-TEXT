[translation]
42010-1 = "Episódio 1;O Sonho da Raposa"
42010-14 = "Arredores do D.U., em frente à Fábrica nº 2 da Kaiser Industry"
42010-17 = "(— 2 anos atrás)"
42010-18 = "Olá a todos! Aqui é o Clube de Jornalismo Kronos, trazendo#nas notícias mais precisas de Kivotos em primeira mão!"
42010-19 = "Hoje estamos transmitindo ao vivo diretamente daqui,#nem frente à Fábrica nº 2 da Kaiser Industry."
42010-20 = "A Fábrica nº 2 responde por cerca de 30% da produção de munição da Kaiser Industry, porém—"
42010-21 = "Recentemente, espalharam-se suspeitas de que armas de destruição em massa estariam sendo desenvolvidas aqui, violando os regulamentos do Conselho Estudantil Geral."
42010-22 = "A Kaiser Industry nega veementemente essas acusações, mas sem provas#nque refutem a suspeita, a apreensão dos cidadãos só aumenta."
42010-23 = "Todos cobram uma solução rápida, mas a investigação da Academia de Polícia Valkyrie parece ter empacado. Também correm boatos de que a Presidente do Conselho Estudantil Geral enviou uma equipe especial de investigação—"
42010-27 = "U-Uau! A-Acabou de acontecer uma explosão dentro da fábrica...!"
42010-28 = "O que será que aconteceu?!#nSerá que foi a tal arma de destruição em massa—"
42010-30 = "Cof, cof..."
42010-31 = "Otogi, que história é essa?#nNinguém me avisou que tinha uma armadilha explosiva na saída!"
42010-32 = "Poxa, eu ia avisar agora mesmo."
42010-33 = "Avise antes, né!"
42010-34 = "Arf, arf... Kurumi-chan, você sempre sai correndo na frente..."
42010-35 = "Ninguém se feriu... parece que estamos todas bem.#nAinda bem que isso aconteceu só depois do fim da operação."
42010-37 = "Neste exato momento, alunas armadas acabam de sair da fábrica de munição!"
42010-38 = "Seriam elas a tal equipe especial de investigação?!"
42010-39 = "Aqui é do Clube de Jornalismo Kronos!#n— Com licença! Podem dar uma palavrinha?!"
42010-41 = "Ahaha... parece que fomos cercadas, né?"
42010-42 = "...Não tem jeito.#nAté que não é má ideia aproveitar a ocasião para apresentar a SRT."
42010-43 = "Falando em SRT... trata-se da unidade especial fundada pela Presidente do Conselho Estudantil Geral, certo?"
42010-45 = "Sim, exatamente."
42010-46 = "— Prazer em conhecê-los, cidadãos de Kivotos.#nSou Yukino Shichido, líder do Esquadrão FOX da Academia Especial SRT."
42010-47 = "A Academia Especial SRT foi fundada com autorização da Presidente do Conselho Estudantil Geral#npara combater crimes no distrito do D.U. que fogem ao alcance da Academia de Polícia Valkyrie#ne dos Comitês Disciplinares dos distritos autônomos."
42010-48 = "Combater crimes no D.U.... Quer dizer que, daqui em diante,#na Academia Especial SRT vai substituir a Academia de Polícia Valkyrie?"
42010-49 = "...Não.#nNós somos apenas uma equipe voltada para crimes fora do alcance da Academia de Polícia Valkyrie#ne para casos como este, em que é necessário agir de forma preventiva."
42010-51 = "Entendo, obrigada pela explicação.#nAgora, gostaria de perguntar sobre esta Fábrica nº 2."
42010-52 = "Indo direto ao ponto: é verdade que armas de destruição em massa ilegais estavam sendo desenvolvidas aqui?"
42010-54 = "Bom..."
42010-58 = "Ah, não nos mandaram manter sigilo sobre este caso, então acho que não tem problema."
42010-59 = "...Há alguns dias, recebemos uma denúncia anônima e obtivemos provas contundentes#nde que uma bomba poderosa, em violação aos regulamentos, estava armazenada na Fábrica nº 2 da Kaiser Industry."
42010-60 = "Durante o projeto de modernização das antigas granadas termobáricas <A.N.T.I.O.C.H.>,#nanunciado no ano passado, a Kaiser Industry fabricou uma bomba termobárica para míssil balístico.#nO que estava guardado aqui era justamente o protótipo dela."
42010-62 = "Mas nós já a neutralizamos, então podem ficar tranquilos."
42010-63 = "Uma bomba termobárica para míssil balístico...#nQual seria exatamente o poder destrutivo de algo assim?"
42010-64 = "Por se tratar de um protótipo, não temos números exatos, mas—"
42010-66 = "Pelo tamanho da ogiva e pelos dados de pesquisa existentes,#nestimo que o raio da explosão chegaria a vários quilômetros."
42010-67 = "L-Lidar com uma bomba desse porte usando apenas um esquadrão...#nNão é perigoso demais...?"
42010-68 = "Parece um caso para mobilizar uma companhia inteira de engenheiros com trajes de proteção..."
42010-70 = "Não... pelo contrário, contra uma bomba dessa escala, não adianta nada mobilizar um grande contingente."
42010-71 = "É aí que entra!#nÉ justamente para isso que nós, da SRT, existimos!"
42010-72 = "Os esquadrões da SRT são formados por pequenas equipes de elite.#nPor isso, conseguimos assegurar o alvo e neutralizar a ameaça antes mesmo que o inimigo perceba, como fizemos hoje."
42010-73 = "Na verdade, nesta operação levamos menos de três minutos para assegurar a ogiva."
42010-74 = "...Dois minutos e quarenta e cinco segundos."
42010-75 = "Se não tivéssemos entrado em combate no caminho, dava para ter cortado mais uns quinze segundos."
42010-76 = "Ah, mas isso foi porque a Kurumi confundiu granada de fumaça com granada de luz e jogou errado nos guardas, né?"
42010-77 = "Eu não confundi nada!#nAquele cara estava usando um visor especial antiflash."
42010-78 = "Além disso, se eu não tivesse dado o tiro duplo, era a gente que ia se dar mal."
42010-79 = "Aliás, nada disso teria acontecido se a Otogi tivesse derrubado o guarda primeiro, né?"
42010-80 = "Aquilo lá... é que eu esqueci de contar a munição sem querer..."
42010-81 = "Sabe como é, coisa clássica de atiradora fofa#nquando não dá para prever o número de inimigos..."
42010-82 = "Leva isso a sério!"
42010-83 = "Otogi-chan, Kurumi-chan... brigar na frente das câmeras pega mal..."
42010-85 = "...Aham.#nDe qualquer forma, justamente por termos conduzido a operação com um efetivo reduzido,#nconseguimos capturar os responsáveis e apurar os fatos rapidamente."
42010-86 = "Nos documentos confidenciais apreendidos durante esta operação...#nconstava que diversos envolvidos receberam suborno para falsificar os relatórios de segurança da fábrica de munição."
42010-87 = "E, entre os nomes citados, não havia apenas executivos do Grupo Kaiser,#nmas também membros ligados ao Gabinete de Defesa."
42010-91 = "Gabinete de Defesa... isso não faz parte do Conselho Estudantil Geral?"
42010-92 = "No fim das contas, acabou sendo exposta uma brecha na segurança do próprio Conselho Estudantil Geral...#nA SRT, que age sob ordens da Presidente, pode mesmo divulgar esse tipo de informação?"
42010-93 = "...Sem problema algum."
42010-94 = "Justiça é o caminho reto, guiado pela razão."
42010-96 = "A justiça da SRT não vacila sob nenhuma circunstância."
42010-107 = "..."
42010-108 = "Ah, Yukino-chan. Bom dia."
42010-110 = "...Que horas são?"
42010-111 = "No Horário Padrão de Kivotos... 03:15."
42010-112 = "Ainda falta tempo para o último turno de vigília. Por que não dorme um pouco mais?"
42010-113 = "Não precisa, já dormi o suficiente."
42010-116 = "...Você teve um bom sonho, né?"
42010-117 = "Por que acha isso?"
42010-118 = "Porque você parecia tão feliz enquanto dormia."
42010-119 = "...Não, foi um pesadelo."
42010-120 = "Um doce pesadelo de quando vivíamos protegidas dentro de uma estufa."
42010-121 = "...Entendi."
42010-124 = "— FOX 4, relatório."
42010-125 = "Sim, sim, aqui é a FOX 4.#nNo momento, nenhuma movimentação incomum no Conselho Estudantil Geral."
42010-126 = "Continuam em pânico total, como sempre.#nEstá assim desde que aquela torre gigante caiu, né?"
42010-127 = "Especialmente a Administradora Rin, Presidente Interina do Conselho Estudantil Geral. Como ela não estava lá no auge da crise,#nvirou o principal alvo de críticas dentro do próprio Conselho."
42010-128 = "Por conta disso, a Política Geral de Reconstrução do D.U. que ela propôs também parece estar empacada."
42010-129 = "Bom... também tem o fato de que, quando atacamos a Torre Sanctum logo antes do fechamento da Academia Especial SRT,#nnós miramos bem nos apoiadores da Administradora Rin, então não sobrou quase ninguém para defendê-la."
42010-130 = "Entendido.#n— Qual a situação dos principais departamentos do Comitê Administrativo?"
42010-131 = "Hmm, por lá também continua na mesma.#nComo os chefes do Gabinete de Cultura e do Gabinete de Saúde se feriram no último ataque, os vice-chefes estão assumindo as funções."
42010-132 = "Mas, né, na posição de vice-chefes não dá para esperar que tenham muita voz ativa.#nEmbora o trabalho em si continue andando sem problemas."
42010-133 = "Ótimo, menos uma preocupação... Continue monitorando."
42010-137 = "Ei... líder, quer dizer, FOX 1."
42010-138 = "Só por curiosidade, mas..."
42010-139 = "O que a gente faz se os chefes afastados voltarem ao serviço?"
42010-140 = "Se isso acontecer... a Chefe Kaya vai ficar numa enrascada, né...?"
42010-141 = "Haa... eu já passei o protocolo de emergência para esse tipo de situação antes."
42010-142 = "\"Entre os oficiais do Comitê Administrativo, o número de apoiadores da Administradora Nanagami#njamais poderá superar o número de apoiadores da Chefe Shiranui.\""
42010-143 = "Se algum membro da facção da Administradora Nanagami tentar retornar,#ntome providências \"o suficiente para impedi-lo de se mexer\"."
42010-147 = "...FOX 4, entendido."
42010-152 = "— FOX 3, relatório."
42010-153 = "Aqui é a FOX 3. Conforme o plano, plantei a bomba EMP no pátio ferroviário do Distrito de Kitayama e neutralizei o sistema de controle de tráfego. A sabotagem dos principais equipamentos eletrônicos também foi concluída."
42010-154 = "Recolhi a bomba EMP logo após a detonação,#nentão os engenheiros não vão descobrir a causa da falha tão cedo."
42010-155 = "Bom trabalho. Qual a reação dos cidadãos?"
42010-156 = "Como a causa do incidente não foi divulgada,#nparecem achar que foi incompetência do Conselho Estudantil Geral."
42010-157 = "Estou olhando as redes sociais agora e a coisa está pegando fogo.#nEstá chovendo críticas contra a Chefe do Gabinete de Trânsito e a Presidente Interina."
42010-158 = "Entendido.#nFOX 3, retorne imediatamente ao QG."
42010-162 = "Ei, pode parecer estranho eu falar isso, mas... tem certeza de que está tudo bem continuarmos assim...?"
42010-163 = "Agora há pouco mesmo, com os trens parados, tinha gente desesperada sem conseguir chegar ao hospital..."
42010-164 = "— Isso é relevante para o andamento da operação?"
42010-168 = "...Não é nada.#nFOX 3, fim do relatório."
42010-175 = "Yukino-chan... será que estamos mesmo fazendo a coisa certa?"
42010-176 = "...Como assim?"
42010-177 = "Mesmo que seja para reabrir a Academia Especial SRT, causar tantos danos aos cidadãos assim..."
42010-181 = "Afinal... sinto que isso não é justiça."
42010-182 = "...Essa dúvida é desnecessária para o andamento da operação."
42010-183 = "Nós somos armas que seguem ordens e cumprem missões.#nQuem escolhe contra quem apontar a lâmina não é a arma, mas sim quem segura o cabo."
42010-184 = "Uma arma que hesita ao olhar para o alvo— não tem valor como arma."
42010-185 = "Julgar o que é certo ou errado cabe apenas a quem pode arcar com a responsabilidade."
42010-186 = "..."
42010-187 = "Se estiver incomodada, pode sair.#nEu— o Esquadrão FOX vai continuar a operação."
42010-192 = "...FOX 2, ciente."
42010-196 = "Bem, agora só resta..."
42010-197 = "Lidar com o Esquadrão RABBIT, certo?"
42010-198 = "Esquadrão RABBIT?"
42010-199 = "Opa, o que é isso? Estão falando das nossas calouras?"
42010-200 = "...FOX 3, FOX 4. Eu não chamei vocês agora."
42010-202 = "Desculpa, é que do nada a conversa ficou interessante demais~"
42010-203 = "A gente vai lá ver as calouras?#nEu também quero ir junto!"
42010-204 = "Haa..."
42010-206 = "Ah, aproveitando que as coisas acalmaram um pouco,#nnão seria legal atuarmos todas juntas de novo depois de tanto tempo?"
42010-207 = "A operação da FOX 3 já acabou,#ne a FOX 4 também não precisa fazer nada em especial depois do Dia D..."
42010-208 = "Ah! Pensando bem, o Esquadrão RABBIT nem teve aquela festa de boas-vindas ainda, né?"
42010-209 = "Ah, sim, a tradição da SRT de \"brincar\" com as novatas."
42010-210 = "Fufu, é verdade.#nEntão vou preparar um monte de inarizushi para a festa!"
42010-215 = "...Bem, quanto mais gente, melhor."
42010-216 = "Nesse caso, FOX 3 e FOX 4, assim que concluírem suas tarefas atuais, retornem ao QG,#nreabasteçam e comecem imediatamente os preparativos para a \"festa de boas-vindas\"."
42010-221 = "Entendido!"
42010-225 = "É um reencontro há muito esperado. Vamos receber nossas calouras em grande estilo."
42010-227 = "Próximo;O Sonho do Coelho"
