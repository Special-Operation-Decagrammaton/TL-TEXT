[translation]
41050-1 = "Эпизод 5;Нерешённое недоверие"
41050-2 = "Главное здание Полицейской Школы Валькирия, вестибюль"
41050-5 = ""
41050-8 = "Как у всех... дела?"
41050-9 = "Не знала, что ты тоже здесь, Мияко."
41050-10 = "Мияко... Слава богу."
41050-12 = "Вся банда в сборе. Похоже, они наконец-то отстанут от нас со своими вопросами."
41050-13 = "У них закончились леденцы, так что мне здесь уже совершенно нечего делать"
41050-14 = "Мое, они вряд ли отпустят нас просто так."
41050-15 = "То, что мы все собрались здесь вместе, означает лишь одно - нам вынесли приговор."
41050-16 = "А после всего, что мы устроили… Думаю, наши академические награды будут аннулированы."
41050-17 = "Ой, подумаешь, какая жалость. Академия SRT сделала ба-бах, так что теперь абсолютно неважно, что они там решат."
41050-19 = "Н-но что, если приговор будет даже страшнее обычного отчисления?"
41050-20 = "Хм. Давай подумаем."
41050-21 = "Берегись, Мию. Они точно собираются отправить нас в подземную лабораторию и ставить на нас странные, нелегальные эксперименты. И тебя пустят первой, так как ты у нас самая маленькая."
41050-22 = "Я-Я-Я?!"
41050-23 = "...Нам конец."
41050-24 = ""
41050-26 = ""
41050-28 = ""
41050-29 = "Прошу прощения. Если бы я была лучшим командиром…"
41050-30 = "Вы все не оказались бы в этой ситуации."
41050-31 = "С чего это ты вдруг извиняешься перед нами?"
41050-32 = "Ты правда думаешь, что мы стали бы делать то, чего сами не хотим, даже если бы ты командовала отрядом?"
41050-33 = "Не пойми меня неправильно. Или пойми, мне вообще всё равно. Но, Мияко, ты больше не командир, забудь - академии-то больше нет."
41050-34 = "Так что не веди себя высокомерно, пытаясь всё взять на себя. Мы с самого начала от тебя ничего сверхъестественного не ожидали."
41050-35 = "Я… Я просто…"
41050-36 = "[s] «Всем привет.»"
41050-37 = "Этот чудак?!"
41050-38 = "Сенсей из Шале?"
41050-39 = "И-и-ик!"
41050-40 = "[s] «Полагаю, мне здесь не очень рады.»"
41050-42 = "Вы ещё здесь, Сенсей?"
41050-43 = "У Вас ещё остались какие-то дела в Валькирии?"
41050-44 = "…Мы и есть это незаконченное дело?"
41050-45 = "[s] «Ага. Я здесь, чтобы огласить решение Административного Комитета.»"
41050-47 = "...Н-Не-е-ет!"
41050-48 = "Выкладывайте уже. Мы примем любое решение."
41050-49 = "*глоть*"
41050-50 = ""
41050-53 = "[ns1] «Отряд RABBIT свободен.»\n[ns2] «Вы можете идти.»"
41050-56 = "А?"
41050-57 = "Впервые у меня просто нет слов."
41050-58 = "Это означает, что мы можем вернуться в Академию SRT?"
41050-59 = "[s] «Вы можете идти куда угодно, кроме SRT.»"
41050-60 = "На секунду я уже было обрадовалась."
41050-63 = ""
41050-64 = "Нас, должно быть, передали под опеку Шале, раз Сенсей смог нас утихомирить."
41050-65 = "Теперь ситуация мне ясна."
41050-66 = "Какой Ваш приказ, Сенсей?"
41050-67 = "[s] «Каким бы вы хотели, чтобы был этот приказ?»"
41050-68 = "Не думаю, что это так работает."
41050-69 = "Я-я просто хочу вернуться домой…"
41050-70 = "Я хочу в пышную кроватку и душик. Моя батарея социализации пуста после всех этих дебильных допросов."
41050-71 = "[s] «Почему бы вам ненадолго отдохнуть в общежитии Шале?»"
41050-72 = "...Подозрительно."
41050-73 = "Какой порядочный учитель приглашает к себе в общежитие учениц? А?"
41050-75 = "Должна признать, мне тоже трудно довериться Вам."
41050-76 = "Вы определённо ненавидите нас из-за того, что случилось…"
41050-77 = "У Вас ведь появился какой-то злодейский план, не так ли?"
41050-78 = "Я слышала слухи, что в Шале всё буквально кишит прослушкой."
41050-79 = "Вы… Вы собрались нас шантажировать?"
41050-80 = "Хи-хи. Сенсей просто хочет использовать нас для своих постыдных желаний."
41050-81 = "[s3] «Зачем мне так поступать?! Я же учитель!»\n[s4] «За кого вы меня вообще принимаете?!»"
41050-84 = "Мы не можем принять Ваше предложение."
41050-85 = "Наша миссия с самого начала заключалась в том, чтобы противостоять решению Генерального Студенческого Совета о закрытии Академии SRT. Поиск комфорта в общежитии Шале перечеркнул бы всё, ради чего мы боролись."
41050-87 = "Да и где бы мы там, в Шале, продолжили наши регулярные тренировки?"
41050-88 = "Отдых и расслабление в общежитии не способствуют той строгости и дисциплине, в которые мы верим в SRT."
41050-89 = "А Вы разрешите мне взрывать всякое в Шале? А?"
41050-90 = "Я всё ещё считаю, что Сенсей пугающий…"
41050-91 = "[s] «Тогда почему бы вам не разбить лагерь в парке?»"
41050-93 = "В парке Коусаги? Там, где проходил наш протест?"
41050-94 = "…А это неплохая идея. Парк напоминает мне о наших полигонах для боевых тренировок. Довольно комфортно."
41050-95 = "И все мои игрушки всё ещё там!"
41050-96 = "Мне кажется, сейчас это место ближе всего к дому для нас…"
41050-98 = "Однако если мы вернёмся обратно, то со стороны это будет выглядеть не лучшим образом. Подумают, будто нам официально разрешили продолжить протест."
41050-99 = "Вы уверены, что не против этого?"
41050-100 = "[s5] «Конечно. Я помогу вам собрать вещи.»\n[s6] «Когда выдвигаемся?»"
41050-101 = "Мы не обычные слабые студенты, которых нужно защищать, Сенсей."
41050-102 = "Мы не обычные слабые студенты, которых нужно защищать, Сенсей."
41050-103 = "Мы всё ещё не доверяем Вам и не нуждаемся в Вашей помощи."
41050-104 = "Никакие слова и поступки не изменят нашего мнения."
41050-105 = "[s7] «Я знал об этом с самого начала.»\n[s8] «Я действительно здесь только ради того, чтобы помочь.»"
41050-106 = ""
41050-107 = ""
41050-109 = ""
41050-110 = "…Вы ставите меня в тупик."
41050-111 = "Что ж, тогда до встречи."
41050-112 = "В следующий раз Вы будете нашим врагом!"
41050-113 = "Разве мы не были ими с самого начала?!"
41050-114 = ""
41050-116 = ""
41050-120 = "М-Мияко! Подожди меня!"
41050-122 = "Следующий эпизод;Операция по доставке еды"
