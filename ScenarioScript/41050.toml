[translation]
41050-1 = "Episódio 5;Desconfiança que Não Se Apaga"
41050-2 = "Academia de Polícia Valkyrie - Saguão"
41050-8 = "Ah... Vocês todas estão bem?"
41050-9 = "Ah, você também estava aí, Miyako."
41050-10 = "Miyako-chan..."
41050-12 = "Finaaalmente acabou... Acabou mesmo, né?"
41050-13 = "Quero ir embora logo, até minhas balas já acabaram..."
41050-14 = "Agora é hora de ficar falando com essa calma toda?"
41050-15 = "Eles ainda vão anunciar a nossa punição, não vão?"
41050-16 = "Pelo jeito... bem, no mínimo temos que nos preparar pra sermos expulsas."
41050-17 = "Mesmo que você diga isso, a Academia Especial SRT já era mesmo, né? Mesmo se a gente for expulsa, não muda nada."
41050-19 = "M-Mas, se isso é \"no mínimo\", quer dizer que..."
41050-20 = "Bom, sempre tem a chance de ser algo bem pior, né."
41050-21 = "Tipo nos levarem pra alguma instalação subterrânea sinistra pra fazer um monte de coisa, ou virarmos cobaias de experimentos..."
41050-22 = "!?!?"
41050-23 = "E-Eu tô perdida..."
41050-29 = "Me desculpem. Se eu tivesse lidado um pouco melhor com a situação..."
41050-30 = "Nenhuma de vocês teria passado por isso..."
41050-31 = "...Ei, por que é você quem está pedindo desculpas?"
41050-32 = "O quê, tá se sentindo responsável ou algo assim?"
41050-33 = "Não se engane, Miyako. Desde o instante em que o fechamento da academia foi decidido, você não é mais líder de esquadrão nem nada."
41050-34 = "Então não vem assumir responsabilidade por conta própria, isso só atrapalha. A gente nem espera isso de você agora."
41050-35 = "Isso é... Mas eu..."
41050-36 = "[s] \"Bom trabalho.\""
41050-37 = "V-Você é..."
41050-38 = "D-Da Schale...?"
41050-39 = "Ai...!?"
41050-40 = "[s] \"...Já vou pedindo desculpas adiantado.\""
41050-42 = "Ainda está aqui, Sensei?"
41050-43 = "Tem algum assunto a tratar na Valkyrie?"
41050-44 = "...Ou será que... não pode ser. Tem algum assunto conosco?"
41050-45 = "[s] \"Sim. É do Comitê Administrativo, sobre a punição de vocês desta vez.\""
41050-47 = "...!"
41050-48 = "Bom, tanto faz qual for a punição, pra mim não importa."
41050-49 = "..."
41050-53 = "[ns1] \"Por enquanto, todas estão liberadas.\"\n[ns2] \"Vocês já estão livres. Podem ir para onde quiserem.\""
41050-56 = "...Como?"
41050-57 = "...Liberadas? E a punição?"
41050-58 = "Espera, isso quer dizer que podemos voltar para a SRT?"
41050-59 = "[s] \"Não. Isso eu não posso fazer...\""
41050-60 = "Tsc, me animei à toa."
41050-64 = "O sucesso da operação no parque... Quer dizer que, por conta desse mérito, ficou a cargo da Schale decidir a nossa punição?"
41050-65 = "...É difícil de compreender, mas entendi a situação."
41050-66 = "E então, o que o Sensei quer que nós façamos?"
41050-67 = "[s] \"Mesmo que você pergunte isso... O que vocês querem fazer?\""
41050-68 = "Por que está devolvendo a pergunta pra gente...?"
41050-69 = "Se não podemos voltar para a SRT, tanto faz para onde a gente vá..."
41050-70 = "Por enquanto, eu só quero descansar em algum lugar. Tô só o pó..."
41050-71 = "[s] \"Podem descansar na Schale, ou até morar lá, se quiserem.\""
41050-72 = "...Hã?"
41050-73 = "O que você pretende fazer reunindo alunas no seu próprio prédio?"
41050-75 = "...Inacreditável."
41050-76 = "E-Eu sabia, está guardando rancor daquela vez..."
41050-77 = "Nossa, aposto que ia obrigar a gente a fazer um monte de coisas indecentes~."
41050-78 = "Falando nisso, já ouvi boatos de que a Schale é cheia de escutas escondidas por todo lado."
41050-79 = "E-Espionar a nossa rotina pra quê...!?"
41050-80 = "Vai que obriga a gente a fazer coisas que nem podem ser desenhadas num mangá normal?"
41050-81 = "[s3] \"NÃO, NÃO, NÃO!!\"\n[s4] \"Essa conversa tá descarrilando rápido demais!!\""
41050-84 = "...Agradeço a gentileza, mas não podemos aceitar essa proposta."
41050-85 = "Se vivermos confortavelmente na Schale, nosso objetivo original — \"protestar contra o Conselho Estudantil Geral\" — perderia o sentido."
41050-87 = "Mesmo que a gente fosse pra Schale, lá nem deve ter disciplina nem treinamento decente, né?"
41050-88 = "Por um ou dois dias até vai, mas não aguentaria ficar num lugar desses o tempo todo."
41050-89 = "Aposto que também proíbem o manuseio de materiais perigosos lá..."
41050-90 = "C-Confiar assim de repente é um pouco..."
41050-91 = "[s] \"Então, que tal acampar naquele parque?\""
41050-93 = "Aquele parque... O lugar onde fizemos o protesto?"
41050-94 = "O \"Parque Kousagi\"... Por mim, tudo bem. Pelo ambiente, é quase como o campo de treinamento de campanha da SRT."
41050-95 = "Por mim também tanto faz. Na verdade, a gente deixou nossos equipamentos lá mesmo."
41050-96 = "E-Eu também..."
41050-98 = "De certa forma, seria uma continuação do protesto, então por nós tudo bem, mas..."
41050-99 = "Tudo bem para o Sensei?"
41050-100 = "[s5] \"Por mim, claro que está tudo bem, mas...\"\n[s6] \"E vocês, têm certeza de que vai ficar tudo bem assim? Se houver algo em que eu possa ajudar...\""
41050-101 = "Não se preocupe. Nós não somos crianças indefesas."
41050-102 = "Não se preocupe. Nós não somos crianças indefesas."
41050-103 = "Além disso... reforçando o que já dissemos, nós não confiamos no Sensei."
41050-104 = "Mesmo que nos demonstre essa benevolência agora, isso não vai mudar."
41050-105 = "[s7] \"Sim, quanto a isso, tudo bem.\"\n[s8] \"Se vocês não estiverem sofrendo, já é mais do que suficiente para mim.\""
41050-110 = "...Que pessoa estranha."
41050-111 = "Com licença..."
41050-112 = "Da próxima vez que nos encontrarmos, seremos inimigas!"
41050-113 = "Ué, a gente já era inimiga desde o começo."
41050-120 = "E-Esperem...!? Não me deixem para trás...!"
41050-122 = "Próximo;Vamos Iniciar a Busca por Comida"
