[translation]
34145-4 = "[ns] \"Mika...!?\""
34145-5 = "...Não acredito que ela nos perseguiu até aqui."
34145-6 = "Quanto tempo... quer dizer, nem faz tanto tempo assim, né? Que bom te ver de novo, Saori."
34145-7 = "Eu fiquei pensando em como poderia vencer o Esquadrão sob o comando do Sensei, sabe... mas não tive nenhuma ideia muito boa."
34145-8 = "Aí pensei: \"Que tal tentar bater de frente uma vez pra ver no que dá?\" e vim até aqui, mas..."
34145-9 = "...É, não deu certo mesmo."
34145-11 = "Você continua forte como sempre, né, Sensei?"
34145-13 = "Próximo;O que Restou"
