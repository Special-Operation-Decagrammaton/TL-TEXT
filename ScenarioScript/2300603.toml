[translation]
2300603-1 = "Президент Отдела организации фестивалей!"
2300603-2 = "Улицы Хяккияко"
2300603-3 = "(Я опаздываю на встречу с Шизуко на десять минут.)"
2300603-4 = "(Почему-то у места нашей встречи собралась огромная толпа.)"
2300603-6 = "Ух ты! Шизуко, давай сфотографируемся вместе!"
2300603-7 = "Я тоже! Я тоже! Можно и мне фотографию?"
2300603-8 = "Хи-хи. С удовольствием!"
2300603-9 = ""
2300603-10 = ""
2300603-11 = "[s] «Похоже, Шизуко популярна даже за пределами Момоёдо.»"
2300603-12 = "Сенсей! Сюда! ♪"
2300603-13 = "Эм, мне нужно кое с чем разобраться. Прошу прощения!"
2300603-14 = ""
2300603-15 = "(улыбается) Я вас ждала, Сенсей!"
2300603-16 = "[s1] «Шизуко, идол Момоёдо...»\n[s2] «Она идеальна!»"
2300603-17 = ""
2300603-18 = ""
2300603-19 = ""
2300603-20 = ""
2300603-21 = ""
2300603-22 = "[ns] «Н-не надо так сильно щипать меня!»"
2300603-23 = "Сенсей..."
2300603-24 = "Не говорите такие глупости!"
2300603-25 = "[s] «Я больше никогда не буду мыть эту щёку.»"
2300603-26 = "Разбираться с непослушными посетителями — часть работы."
2300603-27 = "В любом случае, это вы опоздали на десять минут."
2300603-28 = "[s3] «Прости. Я пришёл так быстро, как только смог.»\n[s4] «Ты готовишься к фестивалю?»"
2300603-29 = "Хе-хе."
2300603-30 = "Хе-хе."
2300603-31 = "Сенсей, вы знаете, кто я такая?"
2300603-32 = "[s5] «Идол Момоёдо?»\n[s6] «Главная растяпа Момоёдо?»"
2300603-33 = "Нет! Всё, что связано с Момоёдо, — это просто образ!"
2300603-34 = "Нет! Всё, что связано с Момоёдо, — это просто образ!"
2300603-35 = "Я работаю там, чтобы зарабатывать деньги на деятельность клуба."
2300603-36 = "Во мне есть и другие стороны, знаете ли."
2300603-37 = "Я ещё и президент Отдела организации фестивалей!"
2300603-38 = "[s] «А, точно. Я что-то об этом слышал.»"
2300603-39 = "Вы слышали?!"
2300603-40 = "*вздох* Вот как...?"
2300603-41 = "В любом случае, сегодня я позвала вас сюда, потому что у отдела есть к вам просьба."
2300603-42 = "[s] «Ко мне?»"
2300603-43 = "Да. В эти выходные в 23-м торговом квартале Хяккияко пройдёт небольшой фестиваль."
2300603-44 = "Торговый квартал прислал официальный запрос с просьбой, чтобы Отдел организации фестивалей занялся проведением фестиваля."
2300603-45 = "[s] «Так вот почему ты готовишься.»"
2300603-46 = "Да. Хяккияко — академический район, специализирующийся на туризме."
2300603-47 = "А самые важные туристические достопримечательности Хяккияко — это фестивали."
2300603-48 = "Они должны быть безупречными, совершенными и элегантными."
2300603-49 = "Главная задача Отдела организации фестивалей — следить, чтобы так и оставалось."
2300603-50 = "Идёмте, нам нельзя терять время."
2300603-51 = ""
2300603-52 = "Ну что, пойдём, Сенсей?"
2300603-54 = ""
2300603-55 = "Здравствуйте!"
2300603-56 = "Да? Чем могу помочь?"
2300603-57 = "Мы будем проводить фестиваль в 23-м торговом квартале Хяккияко."
2300603-58 = "Я хотела бы арендовать оборудование для фестиваля..."
2300603-59 = ""
2300603-61 = ""
2300603-62 = ""
2300603-63 = "Конечно. Мы доставим оборудование в соответствии с вашими требованиями."
2300603-64 = "Спасибо, что выбрали нас. ♪"
2300603-65 = ""
2300603-66 = ""
2300603-68 = "[ns] «Ух ты. Это было быстро.»"
2300603-69 = "Пустяки! В конце концов, я президент."
2300603-70 = "Но мы ещё не закончили."
2300603-71 = "Теперь, когда мы арендовали оборудование для выступления..."
2300603-72 = "...остаётся только найти группу, которая им воспользуется."
2300603-74 = ""
2300603-75 = "Прошу прощения!"
2300603-76 = "Чем могу помочь?"
2300603-77 = "Нам нужна группа для выступления на фестивале в 23-м торговом квартале Хяккияко."
2300603-78 = "Вот расписание и остальные условия."
2300603-79 = "Хм, но нам потребуется немного больше..."
2300603-80 = "Тогда как насчёт такого предложения?"
2300603-81 = "Вы сможете записать выступление на фестивале и провести онлайн-трансляцию."
2300603-82 = "Что касается дохода от продаж фестивальной версии песни..."
2300603-83 = "...я могу гарантировать канал продаж через это. То же самое касается контрактов на будущие концерты."
2300603-84 = "В-в таком случае мы можем подписать договор прямо сейчас!"
2300603-85 = "Да, спасибо!"
2300603-86 = "[s] «Это было потрясающе!»"
2300603-89 = "(Я продолжил ходить за Шизуко, пока она выполняла свои дела.)"
2300603-90 = "(Договоры с уличными киосками на время фестиваля, согласование регулирования движения в день мероприятия, планирование спонтанных событий вместе с соседними магазинами — и так далее, и так далее...)"
2300603-91 = "(Шизуко справлялась со всем этим, даже не вспотев.)"
2300603-93 = "Отлично! Думаю, на этом почти всё."
2300603-94 = "Какое приятное чувство выполненного долга!"
2300603-95 = "Подождите. Вы в порядке, Сенсей? Вы выглядите неважно."
2300603-96 = "[s7] «*тяжело дышит* *тяжело дышит* М-мы весь день ходили туда-сюда...»\n[s8] «Я вымотался, пытаясь не отставать от тебя...»"
2300603-97 = "Хм, вот как?"
2300603-98 = "Хм, вот как?"
2300603-99 = "[s] «Подготовка к фестивалю — это не шутки...»"
2300603-100 = "Хех... Только сейчас поняли?"
2300603-101 = "И это всего лишь маленький фестиваль!"
2300603-102 = "Фестивали, которые непосредственно проводит Отдел организации фестивалей, ещё безумнее."
2300603-103 = "[s] «Ты серьёзно?»"
2300603-104 = "Да. Проведение фестиваля требует времени и сил."
2300603-105 = "Чтобы всё получилось, нужно проделать очень много работы."
2300603-106 = "Нужна самоотдача множества людей, не говоря уже о деньгах."
2300603-107 = "Ежедневная работа в Момоёдо — лишь один из способов, которыми я зарабатываю деньги на фестивали."
2300603-108 = "Работы много."
2300603-109 = "Дел просто невпроворот!"
2300603-110 = "[s] «Тогда почему ты продолжаешь этим заниматься?»"
2300603-111 = "Ну..."
2300603-112 = "Потому что мне это нравится."
2300603-113 = "Даже если из-за этого я постоянно занята."
2300603-114 = "Работать в Момоёдо весело. Посетители меня любят, и мне нравятся все мои коллеги."
2300603-115 = "А ещё лучше — когда фестиваль наконец начинается..."
2300603-116 = "...и я вижу, как загораются лица гостей, вся проделанная работа сразу становится не напрасной."
2300603-117 = "Кроме того..."
2300603-118 = "[s] «Кроме того?»"
2300603-119 = "Сегодня вы были рядом со мной."
2300603-120 = "Я так рада, что смогла показать вам и эту свою сторону."
2300603-121 = "Ну и как вам?"
2300603-122 = ""
2300603-123 = "Вы увидели президента Отдела организации фестивалей за её любимым делом!"
2300603-124 = "[s9] «Ты настоящий профессионал.»\n[s10] «Я правда впечатлён.»"
2300603-125 = "Мне только это и нужно было услышать. Хи-хи!"
2300603-126 = "Мне только это и нужно было услышать. Хи-хи!"
2300603-128 = "(Всю дорогу обратно мы с Шизуко разговаривали о фестивале.)"
