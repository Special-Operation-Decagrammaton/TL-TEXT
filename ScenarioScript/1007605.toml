[translation]
1007605-1 = "Это и то — разные вещи"
1007605-2 = "После сообщений Котори я отправился проверить комнату, где она отдыхала."
1007605-3 = ""
1007605-6 = "Там стояла мёртвая тишина, и я чуть не решил, что вошёл не в ту комнату."
1007605-7 = "О, С-Сенсей..."
1007605-8 = "Я здесь... Сюда..."
1007605-9 = "[s1] «...Котори?»\n[s2] Пойти на звук её голоса."
1007605-15 = "Вы всегда умудряетесь находить меня в самых неожиданных обстоятельствах... Хаха..."
1007605-16 = "Ничего серьёзного... но..."
1007605-17 = "Я не очень привыкла к... физической активности. Немного... закружилась голова... Хи-хи."
1007605-18 = "..."
1007605-19 = "...Эм..."
1007605-20 = "...Если подумать..."
1007605-21 = "...Головокружение..."
1007605-22 = "...возникает из-за... ограниченного сенсорного восприятия и чувства нестабильности..."
1007605-23 = "[s3] «Ты и сейчас собираешься это объяснять...?!»\n[s4] «В каком-то смысле тебя правда не остановить...»"
1007605-26 = "Ха... Хаха... Правда?"
1007605-27 = "Это как... навязчивая потребность... Мне просто нужно было вам рассказать..."
1007605-28 = "Но, кажется, это было... слишком тяжело для меня..."
1007605-29 = ""
1007605-32 = "[ns] «...»"
1007605-34 = "[ns5] «...Головокружение — это нарушение сенсорного восприятия или ощущение неустойчивости.»\n[ns6] «Среди симптомов — чувство движения при отсутствии реального физического перемещения.»\n[ns7] «Основные причины — гипервентиляция, стресс, анемия, низкий уровень сахара в крови...»"
1007605-38 = "...?!"
1007605-39 = "А-А...? Сенсей...? Чт...?"
1007605-40 = "В-Вы буквально сняли слова у меня с языка..."
1007605-41 = "[s8] «Я подумал, что это поможет с твоей навязчивой потребностью.»\n[s9] «Я подумал, что так тебе не придётся ничего объяснять.»"
1007605-42 = ""
1007605-43 = ""
1007605-45 = ""
1007605-46 = "...Ха-ха..."
1007605-47 = "...Понятно..."
1007605-48 = "Конечно. Как удивительно..."
1007605-49 = "От этого я чувствую..."
1007605-50 = "Мне нравится мысль, что вы делитесь со мной своими знаниями, от этого мне и правда спокойнее..."
1007605-51 = "Вам правда... не нужно было делать для меня всё это..."
1007605-52 = "Вы такой... добрый... Всегда... видите меня насквозь."
1007605-53 = "Я совсем не ожидала такой помощи..."
1007605-54 = "...Хаха."
1007605-55 = "...Сенсей."
1007605-56 = "Я всегда... благодарна... вам..."
1007605-57 = "...Ммм... Хр-р..."
1007605-58 = "*зевок*"
1007605-59 = "[ns10] Положить Котори на голову тёплое полотенце.\n[ns11] Уложить Котори в более удобное положение."
1007605-64 = "Я остался рядом со спящей Котори, следя, чтобы её состояние не ухудшилось."
1007605-65 = "После сна она уже снова была своей обычной энергичной собой."
