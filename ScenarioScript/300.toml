[translation]
300-1 = "Тактическое испытание!"
300-2 = "Главный стадион Кивотос"
300-3 = "Наконец-то началось Тактическое испытание — традиция Кивотос!"
300-4 = "Я уже чувствую в воздухе воодушевление студентов!"
300-5 = "А теперь попросим почётного гостя, самого учителя Шале, рассказать нам о руководстве студентами на этом мероприятии."
300-6 = "Насколько сильно вы горите желанием победить в соревновании?"
300-7 = ""
300-8 = "...Что? Вы не знаете, что такое Тактическое испытание?"
300-9 = "Это... такой... горячий материал!"
300-10 = "(Сенсей из Шале, о котором говорит весь город, заявляет, что ему неинтересно Тактическое испытание... Какой скандал!)"
300-11 = "Фейковые новости? Ещё чего. Кивотос Monthly публикует только факты!"
300-12 = "Ну... иногда мы, пожалуй, немного сгущаем краски."
300-13 = "Но неважно. Настоящая история здесь в том, что ВЫ вообще ничего не знаете об испытании..."
300-14 = "Что ж, учиться никогда не поздно. Я помогу!"
300-15 = "Тактическое испытание — соревнование между студентами, организованное Генеральным студенческим советом."
300-16 = "Несколько мест по всему Кивотос используются как боевые площадки, а студенты получают награды в зависимости от рейтинга!"
300-17 = "Среди возможных призов есть очень редкое снаряжение, которое нельзя купить за деньги, поэтому конкуренция между клубами жёсткая."
300-18 = "Интересно посмотреть, как справятся ваши студенты и сколько очков смогут заработать!"
300-19 = "Так что удачи! И я не против, если вы заодно сделаете ещё что-нибудь, о чём можно написать!"
