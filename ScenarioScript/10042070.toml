10042070-59 = "Получается, Сенсей!"
10042070-61 = "[ns1] «Оно перестало носиться и пошло прямо к ней!»\n[ns2] «Сейчас! Нужно стрелять прямо сейчас!»"
10042070-64 = "Н-Но приказ может отдать только...!"
10042070-65 = "Старший администратор. Которая сейчас не может говорить. ...И, вполне возможно, без сознания."
10042070-66 = "Без надлежащей передачи полномочий орудия вынуждены оставаться в режиме ожидания."
10042070-67 = "Да какой в этом смысл?! Вы же из Дисциплинарного комитета, разве нет?! Почему ВЫ не отдадите приказ?!"
10042070-68 = "Ну... я правда хотела бы, но..."
10042070-69 = "Вы, видимо, не знаете. Любая армия и любая больница — это лабиринт бюрократии. Такова уж природа системы."
10042070-70 = "И поэтому сейчас нормально НИЧЕГО не делать?!"
10042070-71 = "Я невольно услышала ваш разговор."
10042070-72 = "Удивительно, во что Ако иногда умудряется вляпаться..."
10042070-73 = "[ns] «Я знаю этот голос!»"
10042070-75 = "С этого момента я официально передаю оперативные полномочия Ако и право отдавать приказ на открытие огня Сенсею из Шале."
10042070-76 = "Всем подразделениям выполнять приказы Сенсея до завершения операции. Это всё."
10042070-77 = "[s3] «Хина!»\n[s4] «Как же вовремя...!»"
