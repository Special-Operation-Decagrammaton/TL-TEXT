[translation]
1000403-1 = "Повод для гордости"
1000403-2 = "Трущобы на окраине Геенны"
1000403-3 = "Здравствуйте, Сенсей."
1000403-4 = "[s] «Почему именно здесь?»"
1000403-5 = "Из-за недавней операции Префектурной команды студентам запрещено сюда приходить."
1000403-6 = "Здесь и раньше было опасно, а после операции людей, скорее всего, не будет ещё несколько дней."
1000403-7 = "Значит, меня никто не заметит..."
1000403-8 = "...и мы сможем встретиться без лишних переживаний."
1000403-9 = "[s] «Ты не слишком переживаешь о том, что подумают другие?»"
1000403-10 = "..."
1000403-11 = "Они не оставляют мне выбора. К тому же это в твоих интересах."
1000403-12 = "Ты ведь знаешь, что у меня хватает врагов — и в школе, и за её пределами."
1000403-13 = "Безопаснее считать, что за мной постоянно следят."
1000403-14 = "Ты можешь оказаться в серьёзной опасности... если тебя увидят рядом со мной."
1000403-15 = "[s1] «Почему тогда просто не встретиться онлайн?»\n[s2] «Ты могла отправить письмо или сообщение.»"
1000403-16 = ""
1000403-17 = ""
1000403-18 = "..."
1000403-19 = "Я-я полагаю, да, но..."
1000403-20 = "То есть..."
1000403-21 = "..."
1000403-22 = "[s] «Некоторые вещи лучше обсуждать лично.»"
1000403-23 = "...О нет..."
1000403-24 = "...Надеюсь, ты не говоришь со мной свысока."
1000403-25 = "Но да, ты прав! Некоторые вещи нужно обсуждать лицом к лицу."
1000403-26 = "Например, вот это!"
1000403-27 = "Нет ничего плохого в том, чтобы встретиться лично и обсудить дела!"
1000403-28 = "[s3] «Но если бы нас УВИДЕЛИ вместе поздно ночью...»\n[s4] «Разве это не создало бы проблем?»"
1000403-29 = "Н...наверное? Я не совсем понимаю, к чему ты клонишь..."
1000403-30 = "Н...наверное? Я не совсем понимаю, к чему ты клонишь..."
1000403-31 = "Поздно ночью..."
1000403-32 = "Может создать проблему..."
1000403-33 = "И...ными словами..."
1000403-34 = ""
1000403-35 = "...?!"
1000403-36 = "Наконец до неё дошло, на что я намекал."
1000403-37 = "Ч-Что ты вообще такое предлагаешь? Мы с тобой, Сенсей...?!"
1000403-38 = "Ты думаешь, у меня совсем нет стыда?!"
1000403-39 = "Я бы с радостью разобралась с недоразумением, если бы дело было только в этом..."
1000403-40 = "..."
1000403-41 = "Но мысль я поняла. Люди действительно любят такие сплетни."
1000403-42 = "Встречаться с тобой ночью опасно само по себе."
1000403-43 = "Возможно, лучше встречаться днём..."
1000403-44 = "...но именно днём я всегда занята сильнее всего. Хм."
1000403-45 = "..."
1000403-46 = "Тогда когда нам лучше встречаться, Сенсей?"
1000403-48 = "Хина всё ещё была озадачена и глубоко задумалась."
