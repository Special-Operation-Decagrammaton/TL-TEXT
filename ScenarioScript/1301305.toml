[translation]
1301305-1 = "Сцена фестиваля"
1301305-2 = "Получив очень возбуждённое сообщение от Момидзи, я направился на площадь Красной Зимы."
1301305-3 = ""
1301305-5 = ""
1301305-6 = ""
1301305-7 = "О, Сенсей! Добро пожаловать."
1301305-8 = "Хи-хи. Не могу поверить, что мы вместе идём на книжный фестиваль Красной Зимы, Сенсей."
1301305-9 = "[s] «Что за книжный фестиваль?»"
1301305-10 = "Именно то, о чём говорит название! Он проходит раз в год и длится два дня!"
1301305-11 = "Студенты Красной Зимы приносят книги отовсюду, выставляют их, а ещё покупают и продают понравившиеся."
1301305-12 = ""
1301305-14 = ""
1301305-15 = "По крайней мере, так всё должно выглядеть."
1301305-16 = "На деле это скорее блошиный рынок для клубов, где они распродают остатки запасов за прошлый год."
1301305-17 = "Если честно, в академии Красная Зима не так уж много мероприятий... Поэтому мы стараемся сделать это событие максимально похожим на настоящий фестиваль."
1301305-18 = "Хотя он и называется книжным фестивалем, многие студенты приходят сюда просто ради атмосферы и вкусной еды."
1301305-19 = "[s] «Мне от этого... немного грустно.»"
1301305-20 = "Да что вы! В этом-то и вся прелесть!"
1301305-21 = "[s] «Ч-Что?»"
1301305-22 = "Раз большинство книгами не интересуется, для Фронта освобождения знаний это идеальное время для охоты за сокровищами!"
1301305-23 = "Мы можем просматривать самые разные книги! И не нужно отличать выставочные образцы от настоящих экземпляров! Вообще-то большинство студентов даже не понимают, что такое выставочный образец!"
1301305-24 = "А иногда... нам даже попадаются легендарные издания!"
1301305-25 = "[s] «П-Понятно...»"
1301305-26 = "Не время мешкать, Сенсей! У нас всего два дня, чтобы войти в историю!"
1301305-27 = "Наша цель на следующие два дня — исследовать каждый уголок этого фестиваля!"
1301305-28 = "Ладно! Возможно, это слишком амбициозно! Но мы прочитаем столько, сколько сможем!"
1301305-30 = "Так мы с невероятно воодушевлённой Момидзи и отправились осматривать фестиваль."
1301305-31 = "Площадь Красной Зимы"
1301305-32 = ""
1301305-34 = ""
1301305-35 = "Смотрите сюда, Сенсей! Полная коллекция «Two Piece»!"
1301305-36 = ""
1301305-38 = ""
1301305-40 = "Не могу поверить, что нашла это здесь!"
1301305-41 = "Ах! Я думала, коллекция полная, а здесь не хватает одного тома!"
1301305-42 = "Вот теперь всё сходится... Полная коллекция — огромная редкость и стоит целое состояние!"
1301305-43 = "И вдобавок отсутствует именно тот том, который обычно особенно трудно найти..."
1301305-44 = "Ничего не поделаешь. Пока куплю этот набор, чтобы постепенно собрать всю коллекцию."
1301305-45 = ""
1301305-46 = "Это...! Ограниченное специальное издание «Джейсона и карамельной фабрики»?!"
1301305-47 = "Такие драгоценные знания просто лежат на фестивале... Я так рада быть частью Фронта освобождения знаний!"
1301305-48 = "А? Рукописное предисловие автора, которое должно быть на внутренней стороне обложки... вырезано!"
1301305-49 = "Какое варварство! Как они посмели?! Это не только портит книгу, но и оскорбляет автора!"
1301305-50 = "Я в ярости! Наверняка они вырезали его, чтобы отдельно продать автограф рядом с предисловием! Враги общества."
1301305-51 = ""
1301305-52 = "Ого, обычное издание «Ишмаэля»!"
1301305-53 = "На момент выхода она была совсем непопулярна. Продали всего 3200 томов!"
1301305-54 = "Тема была слишком нишевой, да и все 135 глав мало кто мог осилить."
1301305-55 = "Но со временем её прочитало всё больше людей, и теперь её признают одной из классических работ в истории."
1301305-56 = "Это не специальное издание и не юбилейная печать или что-то подобное, но..."
1301305-57 = "Хи-хи. Мне всё равно нравится. Может, возьмём и её."
1301305-60 = "Переходя от одного прилавка к другому, Момидзи продолжала складывать в руки всё новые и новые книги."
1301305-61 = "Никогда ещё я не видел её такой счастливой — погребённой под опасно покачивающейся стопкой книг."
1301305-62 = ""
1301305-66 = "― [log=모미지]Сенсей! Я наконец-то нашла её![/log][wa:1130]"
1301305-69 = "― [log=모미지]Страницы совсем не повреждены,[/log][wa:10]"
1301305-70 = "― [log=모미지]и даже специальная иллюстрация из ограниченного издания на месте![/log][wa:2050]"
1301305-73 = "― [log=모미지]Целое ограниченное издание![/log][wa:10]"
1301305-76 = "― [log=모미지]Может быть... вся моя жизнь[/log][wa:2860]"
1301305-77 = "― [log=모미지]вела именно к этому моменту. К тому, чтобы найти эту книгу.[/log][wa:2400]"
1301305-80 = "― [log=모미지]Хи-хи-хи... И всё это[/log][wa:980]"
1301305-81 = "― [log=모미지]благодаря тому, что вы пришли со мной, Сенсей.[/log][wa:1520]"
1301305-84 = "― [log=모미지]Когда я рядом с вами...[/log][wa:10]"
1301305-85 = "― [log=모미지]со мной обычно случаются хорошие вещи.[/log][wa:2200]"
1301305-88 = "― [log=모미지]Так что... Эм... Сенсей.[/log][wa:3360]"
1301305-91 = "― [log=모미지]Если вы не против... Эм,[/log][wa:1310]"
1301305-93 = "― [log=모미지]пусть даже не каждый день...[/log][wa:960]"
1301305-96 = "― [log=모미지]Пусть хотя бы время от времени...[/log][wa:1480]"
1301305-99 = "― [log=모미지]Пожалуйста, приходите навещать[/log][wa:1280]"
1301305-100 = "― [log=모미지]Фронт освобождения знаний...[/log][wa:1570]"
