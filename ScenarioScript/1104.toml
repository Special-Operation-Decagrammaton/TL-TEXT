[translation]
1104-1 = "Налёт на Клуб школьных обедов"
1104-2 = "Сегодняшний обед опять отстой! Мне сказали, что будет яичница! Где она?!"
1104-3 = "Это варёное яйцо. Зачем нам его дали? В меню же было написано..."
1104-4 = "Да сколько можно ныть! Просто съешь! Варёные яйца тоже вкусные!"
1104-5 = "Вот именно. Если не будешь есть — отдай мне. Я люблю варёные яйца."
1104-6 = ""
1104-7 = "Дело не в этом."
1104-8 = "Нам подали варёные яйца, хотя в меню была указана яичница..."
1104-9 = "...это неуважение не только к ученикам, но и к самой еде."
1104-10 = "Это недопустимо. Я собираюсь пожаловаться Клубу школьных обедов!"
1104-12 = "(Кухня Клуба школьных обедов)"
1104-13 = "Знаю, знаю. Но я не могу одна приготовить 4000 яичниц за два часа. Особенно сегодня, когда Джури отсутствует."
1104-14 = "У меня нет растительного масла и всего одна сковорода."
1104-15 = "Я так и предполагала."
1104-16 = ""
1104-17 = "Тогда вы не оставляете нам выбора. Позвольте помочь. Мы приготовим эти яичницы."
1104-18 = "Мы даже принесли своё масло."
1104-19 = "Вы серьёзно?"
1104-20 = "Доброе Общество гурманов пришло на помощь Клубу школьных обедов в трудную минуту. Какая трогательная картина."
1104-21 = "Вот она — настоящая дружба. ☆"
1104-22 = "Уф, ладно. Я так и знала, что вы что-то задумали."
1104-23 = "Ну что, пора показать наши кулинарные навыки?"
1104-24 = "Что?! П-Погодите! Не трогайте ничего без моего разрешения!"
1104-27 = "Ого! То есть мы сможем съесть все эти яйца?"
1104-28 = "Эй, погоди! Сначала их надо приготовить! Есть будем потом!"
1104-29 = "А я не против. Я всегда добавляю сырое яйцо в рис."
1104-30 = "Давайте просто возьмём эту корзину с яйцами..."
1104-31 = "О-Ой?!"
1104-32 = ""
1104-33 = "*ГРОХОТ*"
1104-34 = "Уф, яйца! Как жалко!"
1104-35 = "Смотри под ноги, Джунко! Масло...!"
1104-36 = "Что? У-Ух! Тут так скользко!"
1104-38 = "Х-Хватай меня за руку, Харуна!"
1104-40 = ""
1104-41 = "О-Ой? Поймала!"
1104-42 = "Ох! Мы не останавливаемся!"
1104-44 = ""
1104-45 = "Там опасно, Харуна! В угол!"
1104-46 = "...!"
1104-48 = ""
1104-49 = "*грохот*"
1104-50 = "Уф. Я вся в яйце!"
1104-51 = "Стойте! Шкаф наклоняется! А-А-а! Осторожно, мешок с мукой!"
1104-52 = "*туп* *бах*"
1104-53 = ""
1104-54 = "*кашляет* *кашляет*"
1104-55 = "*барахтается* Уф, что это? Яйца и мука... Такое чувство, будто нас замешивают в тесто."
1104-56 = "*кашель* *кашель* Не двигайся, Изуми! Чем больше двигаешься, тем сильнее всё липнет!"
1104-57 = "Такими темпами Общество гурманов превратится в один гигантский такояки!"
1104-58 = "Хм. На этот раз начинкой такояки будем мы, а не наоборот. Как глубокомысленно..."
1104-59 = "А-а-а! Я не хочу быть такояки! То есть есть его я люблю, но БЫТЬ им не хочу!"
1104-60 = ""
1104-61 = "*ГРОХОТ*"
1104-62 = "*барахтается*"
1104-63 = "*туп*"
1104-64 = ""
