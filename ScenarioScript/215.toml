[translation]
215-1 = "Nostalgic Extraordinary"
215-24 = "Welcome to Mr. Orwell's 'Midnight with Roa'."
215-25 = "That's how it is!"
215-26 = "Bringing you tonight a late-night broadcast for all you wanderers..."
215-27 = "I am your host, the authority defining the world of a new era—the one who brings you all the panoply of this world, Mr. Orwell."
215-28 = "The text we are introducing tonight is a familiar creepypasta born from the boundary separating the ordinary and the extraordinary."
215-29 = "Its name—\"Nightmare Train\"."
215-30 = "That's how it is! That's how it is!"
215-31 = "A train running on rails with many passengers could be said to represent one of the spaces of modern civilization's daily life."
215-32 = "Perhaps some of you even came here today by train to watch this public recording of the show?"
215-33 = "Now, amidst that usual daily routine—have you ever felt a sudden sense of discordance at a station, on a platform, or inside a train?"
215-34 = "The location is the same, yet changes in objects or time make the ordinary feel extraordinary—a strange jamais vu."
215-35 = "The \"Nightmare Train\" we introduce tonight could also be said to be an aesthetic of transitional spaces born from that jamais vu."
215-36 = "That's how it is!"
215-37 = "The replicated train is a space born from the passengers' memories. By lingering there too long, the jamais vu may fade—and you might even feel a sense of nostalgia."
215-38 = "However—do not intoxicate yourself with nostalgia and lower your guard here. #nFor the \"Nightmare Train\" never tolerates freeloaders. A strict and terrifying conductor is stationed there!"
215-39 = "That's how it is!"
215-44 = "Why does an animatronic in the shape of a monkey exist in such a space of memories?"
215-45 = "Did a malicious dream secretly sneak into the memories of the masses—"
215-46 = "Or is it the trace of the trauma of \"someone\" who first defined this space manifesting—"
215-51 = "I hope you will all discuss the answer amongst yourselves. #nDeduced theories about the origin of the symbols is part of the show's fun!"
215-52 = "For those of you who know the correct answer, please send your theories to this address."
215-53 = "To those who guess correctly, we will send a feather of the \"Black Swan\" by lottery. #nWe look forward to your entries!"
215-54 = "That's how it is!"
215-59 = "Now, let's take a commercial break."
215-60 = "Stay tuned until we introduce the next text!"
215-61 = "That's how it is!"
