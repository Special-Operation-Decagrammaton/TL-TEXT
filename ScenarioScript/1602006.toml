[translation]
1602006-1 = "Маскировка одного снайпера"
1602006-2 = "Вход в Corgi Town"
1602006-3 = ""
1602006-4 = ""
1602006-5 = "Немного странно строить с вами планы, не связанные с миссией."
1602006-6 = "Немного странно строить с вами планы, не связанные с миссией."
1602006-7 = "А, я ведь не испортила ваши выходные?"
1602006-8 = "Если подумать, на этой неделе вы были ужасно заняты."
1602006-9 = "[s1] «Нет. Я тоже хотел пройтись по магазинам.»\n[s2] «Мне ещё было интересно, как выглядит маскировка SRT.»"
1602006-12 = "...А? Вы никогда не видели снайперскую маскировку?"
1602006-13 = "[s3] «Не то чтобы я совсем никогда не видел маскировку...»\n[s4] «Но магазин, где продают именно маскировку, я не встречал.»"
1602006-16 = "А. Простите, но вообще-то..."
1602006-17 = "Магазин, куда я хотела вас отвести, не какой-то особый военный. Это обычный магазин одежды."
1602006-18 = "Для маскировки эффективнее переделывать обычную одежду. Думаю, вы представляли камуфляжные костюмы для полевых условий."
1602006-19 = "На прошлой миссии мне достался подарочный сертификат, действующий в Corgi Town, поэтому я решила пройтись по магазинам."
1602006-20 = "Фуфу. Хочу купить разные наряды для разных условий."
1602006-21 = "[s5] «Те рваные камуфляжные костюмы, о которых я думал...»\n[s6] «Их можно использовать и в городе?»"
1602006-24 = "А, вы про маскировочный костюм «гилли»."
1602006-25 = "По сути он покрыт сеткой, поэтому его можно адаптировать под миссию, вплетая разные виды ткани."
1602006-26 = "Лучше всего он подходит для открытой местности и природы, где можно использовать листья и подобное. Но и в городе бывают места, где можно слиться с окружением — например возле ярких рекламных щитов, так что мы подстраиваемся под место."
1602006-27 = "Иногда для этого даже разрываем старую форму, но..."
1602006-28 = "После закрытия Академии SRT мне не хочется так делать. Форм осталось ограниченное количество."
1602006-29 = "Вообще-то я давно не делала костюм гилли."
1602006-30 = "[s] «...Значит, ухода и подготовки с ним больше, чем с обычной одеждой.»"
1602006-31 = "Конечно. Подготовка к миссии всегда должна быть идеальной."
1602006-32 = "Ну что, пойдём по магазинам?"
1602006-33 = ""
1602006-35 = ""
1602006-37 = ""
1602006-38 = "Хм. Эта рубашка слишком яркая."
1602006-39 = "Мне очень нравится этот узор..."
1602006-40 = "О, какое милое платье. И цвет подойдёт к моим волосам."
1602006-41 = "Как думаете, Сенсей? Мне пойдёт?"
1602006-42 = "[s7] «Хм...»\n[s8] «Неплохо...»"
1602006-45 = "Что это за ответ?"
1602006-46 = "...Вы правы. Такие воздушные платья и правда не в моём стиле."
1602006-47 = "Ну ладно. Тогда безопаснее взять что-нибудь вроде денима или вельве—"
1602006-48 = "[s9] «Н-Нет, я не это имел в виду!»\n[s10] «Я правда думаю, что тебе идёт...»"
1602006-51 = "Тогда зачем?"
1602006-52 = "[s] «Разве не жалко рвать его и превращать в маскировку?»"
1602006-53 = "А?"
1602006-54 = "Что вы..."
1602006-55 = ""
1602006-57 = ""
1602006-58 = ""
1602006-59 = "Ах. Это моя вина. Наверное, я плохо объяснила."
1602006-60 = "Я просто ищу повседневную одежду для обычных миссий проникновения."
1602006-61 = "Если одеться непривычно для местных, ты сразу бросаешься в глаза."
1602006-62 = "Вот это я и называю «маскировкой». Просто одежда, позволяющая раствориться в толпе."
1602006-63 = "Да, я говорила, что подготовка к миссии должна быть идеальной, но новую одежду ради одной операции я рвать не буду..."
1602006-64 = "[ns] «Фух. Рад, что неправильно понял.»"
1602006-66 = "[ns11] «Я уже так переживал, что ты разорвёшь одежду...»\n[ns12] «Я всерьёз думал отдать тебе что-нибудь из своих старых вещей.»"
1602006-69 = "О? Звучит неплохо."
1602006-70 = "Можно я заберу свои слова обратно?"
1602006-71 = "[s] «Неа.»"
1602006-72 = "Шучу, шучу."
1602006-73 = ""
1602006-75 = ""
1602006-76 = ""
1602006-77 = "В общем, как вам вот это?"
1602006-78 = "[s] «Вообще-то предыдущий наряд мне нравился больше.»"
1602006-79 = "О, у вас неожиданно чёткие вкусы."
1602006-80 = "Хорошо. Тогда берём тот!"
1602006-82 = "Мы с Отоги отлично повеселились, выбирая одежду."
