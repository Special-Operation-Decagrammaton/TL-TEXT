[translation]
1601-1 = "Наспех проведённая проверка Клуба школьных обедов, часть 1"
1601-2 = "(Ученическая столовая академии Геенна)"
1601-3 = "(За три часа до завтрака...)"
1601-4 = ""
1601-5 = ""
1601-6 = ""
1601-7 = "*нюх* *нюх*"
1601-8 = ""
1601-9 = "Судя по запаху, мы уже близко."
1601-10 = ""
1601-11 = ""
1601-12 = ""
1601-13 = "О! Нашла...!"
1601-14 = ""
1601-15 = "О-о! Давай посмотрим."
1601-16 = ""
1601-17 = "Джури, лови!"
1601-18 = "Поняла!"
1601-19 = ""
1601-20 = "А?! Ч-Что...?!"
1601-21 = ""
1601-25 = "Попалась! Вот и воровка печенья!"
1601-26 = "Взяли с поличным!"
1601-27 = "Мм?! *жует* *жует* Мф!"
1601-28 = "*жует* *жует* *глоток* Кх! З-Зачем вы это делаете?!"
1601-29 = "Это мы должны спрашивать."
1601-30 = "Почему ты шныряешь по ученической столовой в такую рань?"
1601-31 = "Вот именно!"
1601-32 = "П-Потому что...!"
1601-33 = "Вчера я услышала, что сегодня утром на десерт будут печенья."
1601-34 = "Эм, вот я и..."
1601-35 = ""
1601-36 = ""
1601-38 = ""
1601-39 = "А, точно! Я просто хотела заранее провести дегустацию печенья!"
1601-40 = "Я считала это своим долгом как члена Общества гурманов!"
1601-41 = ""
1601-42 = "О. Теперь понятно."
1601-43 = "*вздыхает* Я понимаю, что ты голодная, но это на завтрак, ясно?"
1601-44 = "Придётся подождать до завтрака."
1601-45 = "Уф! Ну дайте хотя бы одно! Я даже на крошки согласна!"
1601-46 = "А если для печенья ещё слишком рано, я согласна на основное блюдо!"
1601-47 = "Ты уже завтрак заказываешь?!"
1601-48 = "*вздыхает* У меня нет на это времени. Возвращайся, когда начнётся завтрак."
1601-49 = "А? Чем вы вообще занимаетесь в такую рань?"
1601-50 = "Ну, сегодня у Клуба школьных обедов санитарная проверка."
1601-51 = "То есть сегодня придёт санитарный инспектор."
1601-52 = "21;후우카;01;Он проверит чистоту помещений, сроки годности ингредиентов..."
1601-53 = "...и ещё несколько аспектов нашей работы, прежде чем выставить итоговую оценку."
1601-54 = "На прошлой проверке мы получили низкую оценку, и в результате наш бюджет урезали вдвое..."
1601-55 = "Я до сих пор не понимаю, как так вышло. Мне казалось, мы подготовились."
1601-56 = "Когда инспектор уходил, он даже улыбался. Что же произошло...?"
1601-57 = "Успокойся, Фуука! Глубоко вдохни! Вдохни!"
1601-58 = ""
1601-59 = "Да. Ты права. Это уже в прошлом! Надо двигаться дальше и не зацикливаться."
1601-60 = "Уверена, в прошлый раз нам просто не повезло!"
1601-61 = "В общем, надеюсь, теперь всё понятно. А тебе пора возвращаться и..."
1601-62 = ""
1601-63 = "Руки вверх! Не двигаться!"
1601-64 = "А?"
1601-67 = ""
1601-69 = "Ох."
1601-70 = "Какого...?"
1601-71 = "Кто-то из Общества гурманов? Значит, мои подозрения были верны."
1601-72 = "Эй, это ещё что значит?!"
1601-73 = "Что здесь делает Префектурная команда?"
1601-74 = "Решила прикинуться дурочкой? Прозвучало настолько естественно, что я почти поверила."
1601-75 = "А? Ты о чём вообще?!"
1601-76 = "Я проведу санитарную проверку Клуба школьных обедов от имени Префектурной команды."
1601-77 = "Префектурная команда? А почему они...?"
1601-78 = "Разве это не очевидно?"
1601-79 = "Последний инспектор, посетивший Клуб школьных обедов, получил пищевое отравление."
1601-80 = "П-Пищевое отравление?!"
1601-81 = "А значит, где-то в этой столовой могут находиться опасные бактерии."
1601-82 = "Например, в том печенье, которое она сейчас ест!"
1601-84 = "...? *ням*"
1601-85 = "*глоть*"
1601-86 = "Тебя это вообще ни капли не беспокоит?!"
1601-87 = "Не обращай на неё внимания. Что ещё за пищевое отравление? Тут какая-то ошибка!"
1601-88 = "Да, признаю, иногда наша еда бывает..."
1601-89 = "Ну... это самое..."
1601-90 = "Не очень вкусной?!"
1601-91 = "Как ты можешь такое говорить?! Да ещё так легко?!"
1601-92 = "В-В любом случае, недостатки у нас есть, но до пищевого отравления дело бы никогда не дошло."
1601-93 = "Вот именно! Фуука очень серьёзно относится к гигиене!"
1601-94 = "Говорить легко."
1601-95 = "Но тогда как вы объясните то, что случилось после прошлой проверки?"
1601-96 = "Предыдущий инспектор бежал в туалет, держась за живот, и сказал вот что:"
1601-97 = ""
1601-99 = "«В Клубе школьных обедов живёт монстр!»"
1601-100 = "Монстр?! Ты вообще о чём? Это же нелепость!"
1601-101 = "Хмф. Единственное объяснение — санитарное состояние этой столовой отвратительно."
1601-102 = "Сегодня я докопаюсь до истины!"
1601-103 = "(Что вообще здесь происходит?)"
1601-104 = "Я-Я не отступлю!"
1601-105 = "Мне всё равно, что ты из Префектурной команды!"
1601-106 = ""
1601-108 = "Я покажу тебе, что Клуб школьных обедов нельзя недооценивать!"
1601-109 = "Хм. Вижу, ты настроена решительно. Хорошо."
1601-110 = "Я принимаю твой вызов!"
1601-111 = "Есть!"
1601-112 = ""
1601-113 = ""
1601-115 = ""
1601-116 = "(Но санитарная проверка — это не соревнование! Мы же не заклятые соперники какие-нибудь.)"
1601-118 = "(Так началась беспощадная санитарная проверка Иори.)"
