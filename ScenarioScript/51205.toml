[translation]
51205-5 = "Configuração da transmissão, tudo OK..."
51205-9 = "Agora só falta..."
51205-14 = "Uma ligação...? Do Clube Yin-Yang?"
51205-18 = "Ué... desligou."
51205-19 = "Será que não era nada importante...?"
51205-23 = "Pina, Umika! Vou deixar as coisas aqui com vocês duas!#nVou dar uma olhada no equipamento de transmissão!"
51205-25 = "Sim, Presidente!#nPode deixar comigo! Vou dar conta disso com muito estilo!"
51205-26 = "Vou configurar tudo perfeitamente para atender às expectativas da Chefe!"
51205-28 = "Já disse que eu não sou a chefe!"
51205-29 = "Ora, francamente!"
51205-33 = "Bom, já vou indo!"
51205-38 = "Então, Umika, antes da meia-noite, técnica especial!#nVamos começar os preparativos!"
51205-39 = "Sim, Pina!"
51205-45 = "— Enfim vai começar."
51205-46 = "O desejo acalentado que a família Kadenokouji não pôde realizar há 20 anos..."
51205-47 = "Ah, que maravilha!#nSim, este é o verdadeiro caminho que a família Kadenokouji deve trilhar!"
51205-48 = "...Há 20 anos."
51205-52 = "Ouvi dizer que, no dia do festival que acabou sendo abolido, a família Kadenokouji também deveria realizar a dança da sacerdotisa."
51205-53 = "Contudo, a dança nunca aconteceu e o próprio festival acabou sendo deixado de lado... não foi?"
51205-54 = "Por que isso aconteceu?"
51205-55 = "Ah... isso...#nComo posso dizer, seria uma vergonha se pessoas de fora soubessem..."
51205-56 = "Acredito que eu tenho o direito de saber..."
51205-57 = "...Hmm, tem razão."
51205-58 = "Acho que já passou tempo suficiente."
51205-60 = "Como a senhorita disse, naquele dia há 20 anos, a família Kadenokouji também deveria realizar a dança."
51205-61 = "Porém, no exato momento em que a dança estava prestes a começar..."
51205-64 = "A sacerdotisa desapareceu subitamente...#nE acabou não aparecendo até o fim do festival."
51205-67 = "Se foi pela pressão do ritual..."
51205-68 = "Ou por causa das disputas internas da família..."
51205-69 = "Como já faz muito tempo, não sabemos os motivos nem as circunstâncias."
51205-70 = "Resta apenas o registro de que, a partir daquele dia, a sacerdotisa daquela geração desapareceu sem deixar vestígios."
51205-72 = "Isso é..."
51205-73 = "Sim, de fato..."
51205-75 = "É uma mancha na história da família Kadenokouji."
51205-79 = "Uma mancha...?"
51205-80 = "Ah, mas agora está tudo bem."
51205-81 = "Pois hoje, passados 20 anos, a senhorita Yukari apagará essa mancha por nós."
51205-82 = "...Então é isso."
51205-83 = "Hã...?"
51205-84 = "O motivo de eu estar subindo ao palco..."
51205-89 = "Ótimo! Os preparativos estão prontos!"
51205-90 = "Sim! Pode subir agora mesmo!"
51205-92 = "Ah, já está na hora."
51205-93 = "Pois bem, senhorita Yukari! Contamos com a senhorita!"
51205-94 = "Para lavar a mancha de 20 anos atrás e restaurar a honra dos Kadenokouji...! Por favor, presenteie-nos com uma dança magnífica!"
51205-101 = "(Desde o início... quando pediram para eu voltar para casa...)"
51205-102 = "(O motivo de precisarem de mim como sacerdotisa dos Kadenokouji...)"
51205-103 = "(Era apenas para apagar o fracasso — a desonra — de 20 anos atrás...?)"
51205-104 = "(Se era só por isso... então por quê...)"
51205-105 = "Por que eu..."
51205-107 = "Por que estou aqui...?"
51205-111 = "Eu entendo esse seu sentimento... entendo muuuito bem, sabia?"
51205-117 = "Eles diziam tanto que precisavam de você, mas no fim das contas, do que precisavam mesmo... era de alguém que limpasse a desonra de 20 anos atrás. Alguém que aliviasse o ressentimento deles!"
51205-118 = "Ninguém... ninguééém! Ninguém se importa com o que você sente, nem com o que está fazendo você sofrer."
51205-120 = "Ah, ah! Que pena de você...#nDói, não dói? Dá tanta raiva, não dá?"
51205-126 = "Esse sentimento dentro de você..."
51205-128 = "[log=???][ff4444]Você não tem vontade de devolver tuuudinho para eles... na mesma moeda?[-][/log]"
51205-132 = "...Eu..."
51205-135 = "Ouço uma voz..."
51205-137 = "Próximo;Mesmo Assim, Para Você"
