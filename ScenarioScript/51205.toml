[translation]
51205-4 = ""
51205-5 = "Похоже, со всем оборудованием для прямой трансляции закончили."
51205-6 = ""
51205-8 = ""
51205-9 = "Так, что дальше?"
51205-10 = ""
51205-14 = "...Телефонный звонок? О, это из Клуба Инь-Ян."
51205-15 = ""
51205-17 = ""
51205-18 = "Алло? Алло? ...Они повесили трубку?"
51205-19 = "Может, случайно набрали задницей."
51205-20 = ""
51205-22 = ""
51205-23 = "Пойду проверю, готово ли всё записывающее оборудование. Пина, Умика! Можете напоследок проверить сцену и реквизит?"
51205-25 = "Можете на меня рассчитывать, президент."
51205-26 = "Я прослежу, чтобы всё соответствовало вашим требованиям, босс!"
51205-28 = "Тебе правда пора перестать называть меня боссом!"
51205-29 = "Уф! В-В общем!"
51205-30 = ""
51205-32 = ""
51205-33 = "Я скоро вернусь, хорошо?"
51205-34 = ""
51205-36 = ""
51205-38 = "Ладно! До полуночи ещё куча дел!"
51205-39 = "За работу, Пина!"
51205-40 = ""
51205-42 = ""
51205-44 = ""
51205-45 = "Наконец-то, госпожа."
51205-46 = "Мы наконец завершим историю, начатую Кадэнокодзи двадцать лет назад."
51205-47 = "Я так рада, что мы исправляем историю семьи."
51205-48 = "Не могу не любопытствовать... Двадцать лет назад..."
51205-49 = ""
51205-51 = ""
51205-52 = "Я слышала, что мико Кадэнокодзи должна была провести ритуал и танец — как я сегодня."
51205-53 = "Но фестиваль постигло несчастье, и он был сорван."
51205-54 = "Почему? Что произошло?"
51205-55 = "Эм... Ну, об этом не принято говорить..."
51205-56 = "Я всё же хотела бы знать. В конце концов, теперь я оказалась в том же положении, что и та мико много лет назад."
51205-57 = "С этим трудно спорить."
51205-58 = "Это случилось так давно, а вы приняли свою роль нашей госпожи. Не вижу причин скрывать."
51205-60 = "Как вы сказали, двадцать лет назад семья Кадэнокодзи должна была провести ритуал."
51205-61 = "Всё было подготовлено. Но в день фестиваля..."
51205-64 = "Мико Кадэнокодзи исчезла."
51205-67 = "Возможно, она не выдержала давления и отказалась участвовать."
51205-68 = "...А возможно, помешали многочисленные конфликты внутри семьи."
51205-69 = "Мы можем лишь гадать, что именно произошло в тот день."
51205-70 = "Но последствия были однозначными. С тех пор у нас больше не было мико."
51205-72 = "Наверное, это было..."
51205-73 = "Да... Это было невероятно."
51205-75 = "Она опозорила семью. Имя Кадэнокодзи ещё очень долго шло рука об руку с позором."
51205-76 = ""
51205-78 = ""
51205-79 = "...Позором?"
51205-80 = "Ах, но теперь всё это уже не имеет значения."
51205-81 = "Ведь сегодня ночью вы наконец очистите имя Кадэнокодзи."
51205-82 = "Так вот почему?"
51205-83 = "Хм?"
51205-84 = "Причина, по которой я должна выступать на сцене и терпеть всё это, лишь в том, чтобы—"
51205-85 = ""
51205-89 = "Та-дам! Сцена для вас готова!"
51205-90 = "Прошу сюда, госпожа Кадэнокодзи!"
51205-92 = "Ах. Пора..."
51205-93 = "Мы все на вас рассчитываем, госпожа! Пожалуйста, верните нам честь!"
51205-94 = "Ваше выступление наконец смоет пятно позора двадцатилетней давности!"
51205-95 = ""
51205-97 = ""
51205-99 = ""
51205-100 = ""
51205-101 = "(Так вот почему я здесь?)"
51205-102 = "(Моё присутствие здесь в роли мико Кадэнокодзи нужно просто... ради этого?)"
51205-103 = "(Из-за происшествия двадцатилетней давности...)"
51205-104 = "(Я не могу этого понять.)"
51205-105 = "Я здесь..."
51205-107 = "..Почему я здесь?"
51205-108 = ""
51205-111 = "Бедная, бедная маленькая Кадэнокодзи."
51205-112 = ""
51205-114 = ""
51205-116 = ""
51205-117 = "Они говорили, что ценят тебя. Ты отказалась ради них от всего, что было тебе дорого. Но всё, чего они хотели, — использовать тебя, чтобы очистить имя Кадэнокодзи."
51205-118 = "На твоём месте мог быть кто угодно. Им нет дела до тебя как до человека. Твои страдания волнуют их не больше мухи, севшей на их хаори."
51205-119 = ""
51205-120 = "У меня сердце кровью обливается за тебя! Какая трагедия!"
51205-121 = ""
51205-123 = ""
51205-125 = ""
51205-126 = "Вся эта боль, всё это возмущение..."
51205-128 = "[log=???][ff4444]Заставь их страдать так же, как страдала ты.[-][/log]"
51205-131 = ""
51205-132 = "Я—"
51205-135 = "Я услышала шёпот."
