[translation]
103030-1 = "Эпизод 3; Методы и механизмы"
103030-2 = "...Высота 75 000 метров. Будет непросто."
103030-3 = "Как оно вообще держится на такой высоте...?"
103030-4 = "Как бы то ни было, с нашими нынешними технологиями атаковать что-либо на такой высоте невозможно."
103030-5 = ""
103030-7 = ""
103030-8 = "Есть идеи, президент?"
103030-9 = "Не знаю... Такая высота выходит за рамки моей специализации. Мы всё-таки хакеры, а не инженеры."
103030-10 = "И не только это. Даже если захотим изучить его конструкцию, оно окружено сферическим барьером, так что внутрь не заглянуть."
103030-11 = ""
103030-13 = ""
103030-14 = "...Тогда попробуем воспользоваться наследием старшей сестры."
103030-16 = "Наследием президента?"
103030-17 = "Да. Среди мер, которые она подготовила на случай уничтожения мира... было кое-что и против угроз над небом."
103030-18 = "Чи, сможешь взломать оружие, которое мы нашли в Эриде, чтобы мы могли его использовать? Я начну подготовку со своей стороны."
103030-19 = "Ту ракету? Не уверена, что это хорошая идея..."
103030-20 = "Хотя... может, сработает."
103030-21 = "Я поговорю с остальными."
103030-23 = "И ещё понадобится помощь Инженерного отдела."
103030-25 = "Хорошо, будем готовы."
103030-26 = "Да. Выложимся по полной."
103030-28 = "Ух...! Пуск!"
103030-31 = "Расстояние — 2 000 метров..."
103030-34 = "Расстояние — 1 000 метров... 500 метров..."
103030-35 = ""
103030-38 = "Мы достигли координат цели! Есть контакт?!"
103030-40 = "Комната Инженерного отдела"
103030-41 = ""
103030-42 = "...Нет. Она прошла прямо сквозь него."
103030-43 = "Что...! Снова?!"
103030-44 = "Расстояние до цели... 1 000 метров... 1 500 метров..."
103030-45 = "Она удаляется."
103030-46 = "*вздыхает* ...Это была наша последняя стратегия... Такое чувство, будто стреляем по теням..."
103030-48 = "..."
103030-49 = "Что? Значит, контрмера президента не сработала?"
103030-50 = "Нет. Похоже, мы физически не можем повредить структуру."
103030-51 = "*вздыхает* ...Крылатая ракета такого масштаба превосходит возможности технологий Миллениум... Если даже это не сработало, тогда..."
103030-52 = "Откуда у президента вообще взялось что-то подобное?"
103030-54 = "...Продолжать дальше бессмысленно."
103030-55 = "Если на это нельзя воздействовать физически, оно уже выходит за рамки природного явления. Значит, Инженерный отдел ничего сделать не может."
103030-56 = "...У нас то же самое. Это был последний козырь, который мы нашли в Эриде."
103030-57 = "Химари? Есть решение?"
103030-59 = "Пока ничего не приходит в голову..."
103030-60 = "*вздыхает*"
103030-61 = "Как типично для старшей сестры..."
103030-62 = "Мало того что она никак не помогла миру, так ещё и оставленное ею наследие оказалось бесполезным."
103030-63 = "Эм... немного грубо говорить о живом человеке так, словно он умер..."
103030-64 = "Она заслуживает и похуже!"
103030-65 = "Ну, президент и правда много чего натворила, но это уже чересчур..."
103030-66 = "Так, следующий вариант... Эм..."
103030-68 = "У нас есть хоть какое-то решение? Что-нибудь?"
103030-69 = "*вздыхает* ...Невозможно."
103030-70 = "Все пути перекрыты."
103030-71 = ""
103030-73 = ""
103030-74 = ""
103030-76 = ""
103030-77 = "*трррк* Я проверила данные по материалам святилища, которые анализировал Миллениум."
103030-78 = ""
103030-81 = ""
103030-82 = "Кажется, я поняла природу явления структуры."
103030-83 = ""
103030-86 = ""
103030-87 = "Что это? Если мы поймём механизм, может, хотя бы сможем что-то придумать."
103030-89 = ""
103030-90 = ""
103030-92 = ""
103030-94 = ""
103030-95 = ""
103030-97 = ""
103030-98 = ""
103030-100 = "С помощью исследователей Сестринство, библиотекарей старой библиотеки и Чаепития я собрала информацию из всех архивов Кивотос."
103030-101 = "Однако это лишь гипотеза, она не проверена."
103030-102 = "Подойдёт всё. У нас всё равно нет средств проверить любую гипотезу."
103030-103 = "Если вкратце, повторное появление святилищ в Кивотос и структуры над Кивотос..."
103030-104 = ""
103030-106 = ""
103030-107 = "...поддерживают некое состояние квантовой суперпозиции. По сути, это способность системы одновременно находиться в нескольких состояниях."
103030-108 = ""
103030-110 = ""
103030-112 = "Вот оно что...! Тогда всё сходится..."
103030-113 = "Что? Это связано с квантовой механикой?"
103030-115 = "И да, и нет... Я использую наиболее похожую теорию, чтобы объяснить явление."
103030-116 = "Так что просто держите эту предпосылку в голове."
103030-117 = "Это многомировая интерпретация... нет, точнее будет сказать многомерный анализ, существование, основанное на этой теории."
103030-118 = "Многомерный анализ..."
103030-119 = "...Эм, то есть многомировая интерпретация — это гипотеза, согласно которой вселенная разветвляется при каждом возможном распределении вероятностей или варианте во всей вселенной..."
103030-120 = "Но если говорить о многомерном анализе..."
103030-121 = "Если подбросить монету, у которой может выпасть орёл или решка, в этом мире появится только один результат, верно?"
103030-122 = "Но эта теория предполагает, что возможности других вселенных, обычно неспособные проявиться здесь, существуют одновременно с нашей вселенной?"
103030-124 = "Ха-ха-ха. Что??"
103030-125 = "Типа параллельной вселенной? Как в научной фантастике, где мир разветвляется каждый раз, когда подбрасывают монету? *хрусть*"
103030-126 = "Сама теория основана на науке."
103030-128 = "Однако внутри этого пространства все вероятные возможности смешиваются и перекрываются, не расходясь по отдельным ветвям."
103030-129 = "Другими словами, это хаотическое пространство, где существование и несуществование в бесконечной многомерности смешаны со всеми возможными вероятностями."
103030-130 = "Именно поэтому мы не можем вмешаться физически. Это... почти отдельный мир, одновременно поддерживающий и существование, и несуществование."
103030-131 = "Ты его видишь, но не можешь коснуться..."
103030-132 = "С нашими технологиями решения нет..."
103030-135 = "Но думаю, только внешняя оболочка структуры способна поддерживать такое состояние."
103030-136 = "Если бы внутренняя часть тоже была нестабильной, передавать энергию каждому святилищу, как сейчас, было бы невозможно."
103030-137 = "...То есть, по сути, это барьер."
103030-138 = "Разворачивая непобедимую многомерность, известную как состояние квантовой суперпозиции, словно барьер, оно защищается от всех физических законов."
103030-140 = "Теория смелая, но я понимаю. Использовать перекрывающуюся многомерность как защиту... Если всё так, это имеет смысл."
103030-141 = "Если мы сможем убрать барьер..."
103030-142 = "...тогда можно будет атаковать основное тело внутри."
103030-144 = "Но как уничтожить такой барьер?"
103030-145 = "Есть одно решение..."
103030-146 = "Если мы сможем реализовать то же состояние квантовой суперпозиции, что и у этого барьера, мы сможем войти, не подвергаясь его воздействию."
103030-147 = "То же состояние...?"
103030-148 = "О, понимаю. Если рассматривать квантовую суперпозицию, возникающую в этом многомерном пространстве, как некую величину колебаний..."
103030-149 = "Объект с той же величиной колебаний сможет пройти сквозь него, верно?"
103030-150 = "...Да, потому что независимо от вероятности или состояния суперпозиции внутри этого многомерного пространства они будут находиться в одном пространстве."
103030-151 = "Как шумоподавление?"
103030-152 = "Немного иначе, но концепции похожи."
103030-154 = "Если мы сможем проанализировать многомерность и воспроизвести такое же состояние... мы нейтрализуем барьер..."
103030-155 = "Но как...?"
103030-156 = "Чтобы это стало возможным, нам нужно уметь выполнять многомерные вычисления."
103030-157 = "Это вообще возможно?"
103030-158 = "Это..."
103030-160 = "...невозможно."
103030-161 = "Для многомерного анализа понадобится квантовый компьютер, который существует только в теории."
103030-162 = "Т-Тогда мы ничего не можем сделать?"
103030-163 = "Ложные святилища вот-вот проявятся снова, а нам остаётся только смотреть?!"
103030-164 = ""
103030-166 = ""
103030-167 = ""
103030-169 = "..."
103030-170 = "Даже если нам снова удастся уничтожить появившиеся святилища..."
103030-171 = "...если оставить ту структуру в небе как есть, она просто будет снова и снова рассчитывать вероятность существования святилищ в разных измерениях и проявлять их здесь."
103030-173 = "...Серьёзно?!"
103030-174 = "Т-Тогда даже если мы уничтожим святилища..."
103030-176 = "Святилища можно воссоздавать столько раз, сколько существует измерений во вселенной... Верно?"
103030-177 = "Ч-Что..."
103030-178 = "Это бессмыслица! А как же первый закон термодинамики?"
103030-179 = "*вздыхает* ...Как только в дело вступает многомерность, всё наше знание о мире теряет смысл."
103030-181 = "..."
103030-182 = "И что тогда? Ч-Что нам делать? То есть даже зная, что нужно сделать, мы совершенно беспомощны?"
103030-183 = "..."
103030-184 = "Хм?"
103030-185 = "Сенсей здесь? Когда он успел уйти?"
103030-186 = ""
103030-188 = ""
103030-189 = "Ч-Что...? Куда делся Сенсей...?"
103030-196 = "...Есть способ."
103030-197 = "[s] «Чёрный костюм.»"
103030-198 = "Есть один метод. Единственный способ добраться до Phrenapates."
103030-199 = "[s] «...Скажи, как это сделать.»"
103030-200 = "Хи-хи-хи-хи..."
103030-201 = "А что вы дадите мне взамен за эту информацию?"
103030-202 = "...Хм, ну что ж."
103030-203 = "То, что вы склонили передо мной голову и просите, означает: ради своей цели вы готовы почти на всё, какой бы ни была цена."
103030-204 = "Вы даже пришли сюда, готовые сотрудничать с Гематрия."
103030-205 = "[s] «...»"
103030-206 = "Хе-хе, тогда чего же мне потребовать от вас? ...Точно, как насчёт вступить в Гематрия?"
103030-207 = "...Хи-хи-хи. Шучу."
103030-208 = "Гематрия распущена, так что в этот раз вам повезло. Один-единственный раз я окажу вам услугу."
103030-209 = ""
103030-211 = ""
103030-212 = ""
103030-214 = "...Но я обязан предупредить."
103030-215 = "Сенсей [USERNAME], если вы это сделаете, ваше тело получит необратимые повреждения."
103030-216 = "Вы не сможете вернуться в прежнее состояние... и можете даже умереть."
103030-217 = "И всё равно готовы идти дальше?"
103030-219 = "[ns] «Это не имеет значения.»"
103030-221 = "Даже зная, что это может закончиться вашей смертью?"
103030-222 = "..."
103030-223 = "Ваша решимость непоколебима. Понимаю."
103030-224 = ""
103030-226 = ""
103030-227 = ""
103030-229 = "Сенсей... То, что вы ищете..."
103030-231 = "...находится в Абидос."
103030-233 = "Следующий эпизод; Что скрыто в Абидос 1"
