[translation]
1003103-1 = "Та сторона, которую хочется показать"
1003103-3 = "(Я сдержал обещание Ару и пришёл к месту встречи в назначенное время.)"
1003103-4 = "(Неподалёку я заметил Ару, которая что-то бормотала себе под нос.)"
1003103-6 = "Так. Я-я ведь не выгляжу в этом странно, правда?"
1003103-7 = "Я сама выбрала его благодаря своему выдающемуся деловому чутью."
1003103-8 = "...У вас случайно нет с собой зеркала?"
1003103-9 = "[s] «Ару?»"
1003103-10 = "Ах! С-Сенсей?!"
1003103-11 = "К-Когда вы успели прийти? Напугали меня."
1003103-12 = "Н-Но всё же я рада, что вы пришли вовремя. Сегодня очень важный день."
1003103-13 = "Если бы вы опоздали, это стало бы большой проблемой! Поэтому..."
1003103-14 = "[s] «...»"
1003103-15 = "Эм... Сенсей?"
1003103-16 = "Что с вами? Вы просто смотрите на меня и ничего не говорите."
1003103-17 = ""
1003103-19 = "(Пусть оно и дорогое, но элегантная аура этого кимоно наконец завладела вами, Сенсей! От зрелого очарования его первоклассной ткани не сбежать!)"
1003103-20 = "(Теперь вам придётся признать, что я совершила удачную покупку и вовсе не попалась на уловки того продавца.)"
1003103-21 = "(Моим решением руководило исключительно выдающееся деловое чутьё!)"
1003103-22 = "[s] «Ару, ты выглядишь...»"
1003103-23 = "П-Подождите, тайм-аут! Я ещё морально не готова!"
1003103-24 = "(Надо было понимать, что моё сердце не выдержит честного мнения Сенсея о том, как я выгляжу!)"
1003103-25 = "(Сенсей никогда не скажет ничего неподобающего, но что, если...?)"
1003103-26 = "(Что, если Сенсей скажет, что это выглядит странно или мне не идёт?)"
1003103-28 = ""
1003103-29 = "*вдох* *выдох* Глубоко дыши. Хорошо!"
1003103-30 = "Итак, Сенсей. Как я и говорила в MomoTalk, сегодня вечером мы отправимся в престижное и изысканное место. Давайте пока сосредоточимся именно на этом."
1003103-31 = "Я получила эксклюзивное приглашение от одного своего знакомого!"
1003103-32 = "Что вы сказали? С каких это пор у меня появились влиятельные знакомые?! К-Как грубо!"
1003103-33 = "Это приглашение на особый новогодний ужин, который устраивает известный в Кивотосе бизнесмен!"
1003103-34 = "[s1] «Так вот почему ты выбрала это кимоно. Понятно.»\n[s2] «Значит, вот какое важное дело тебя ждало.»"
1003103-35 = "Именно! Взять это кимоно напрокат мне подсказало моё острое деловое чутьё.#nРада, что вы наконец поняли! ♪"
1003103-36 = "Именно! Взять это кимоно напрокат мне подсказало моё острое деловое чутьё. Рада, что вы наконец поняли! ♪"
1003103-37 = "Я всегда одеваюсь для успеха!"
1003103-38 = ""
1003103-40 = ""
1003103-41 = "Но неважно. Нам нужно идти, иначе опоздаем на вечеринку, Сенсей! ♪"
1003103-44 = "Ну и толпа здесь собралась, да?"
1003103-45 = "Сегодня здесь собрались одни из самых влиятельных деловых людей всего Кивотоса."
1003103-46 = "Именно здесь титаны разных отраслей обменяются идеями и мнениями, которые будут определять развитие будущих проектов на годы вперёд."
1003103-47 = "Другими словами, это наш шанс завязать новые связи и найти новых клиентов, которые помогут Решалам 68 развиваться дальше."
1003103-48 = "[s] «И как ты вообще получила приглашение сюда?»"
1003103-49 = "Я Рикухатима Ару, босс и глава Решал 68! Меня пригласили, потому что всё больше людей наконец признают, что я за женщина."
1003103-50 = "[s] «Ты потрясающая, Ару.»"
1003103-51 = "В-Вы правда считаете меня потрясающей, Сенсей...?"
1003103-52 = ""
1003103-54 = "(Да, вот мой шанс! Если сегодня я продемонстрирую свои деловые навыки, тогда Сенсей наверняка...)"
1003103-55 = "(Пусть я и не услышала мнения Сенсея о своём внешнем виде, но когда я покажу себя в своей стихии, он точно в меня влюбится. Я справлюсь!)"
1003103-56 = ""
1003103-58 = "Хи-хи! Продолжайте меня хвалить! Здесь также присутствуют некоторые клиенты «Решателей проблем»."
1003103-59 = "Я заодно присмотрю за ними. Ну, знаете... проведу консультации."
1003103-60 = "Эм, буду говорить о делах! Да, всё исключительно ради бизнеса!"
1003103-61 = "Так уж вышло, что у «Решателей проблем» уже намечено важное предприятие, поэтому мне нужно встретиться здесь с клиентом!"
1003103-62 = "Вы будете поражены моей безупречной рабочей этикой даже в Новый год, Сенсей."
1003103-63 = "[s] «Меня больше интересует, кто этот клиент.»"
1003103-64 = "Не хочу слишком завышать ваши ожидания, но встречи с ним определённо стоит ждать."
1003103-65 = "Я покажу вам, что значит быть настоящим профессионалом!"
1003103-66 = "Хи-хи-хи."
1003103-67 = "Хи... хи..."
1003103-68 = "Хи..."
1003103-69 = ""
1003103-71 = "(О-О нет!)"
1003103-72 = "(П-Правда в том, что я совершенно случайно нашла своё приглашение! У меня здесь нет никаких клиентов!)"
1003103-73 = "(И зачем я только распустила язык?! Почему меня всегда заносит и я никогда сразу не говорю правду?!)"
1003103-74 = "(Но если я сейчас отступлю или меня разоблачат, я буду выглядеть ужасно!)"
1003103-75 = "[ns] «Так где же твой клиент?»"
1003103-76 = "Ч-Что? Ну, эм..."
1003103-77 = "(Что же мне делать?!)"
1003103-78 = "(О! А если сказать, что мы должны были встретиться, но он, к сожалению, не смог прийти...)"
1003103-79 = "(Да, так и скажу!)"
1003103-80 = "Я раньше просматривала список гостей. К сожалению, похоже, сегодня вечером он не смог к нам присоединиться."
1003103-81 = "...А? Его имя?"
1003103-82 = "О-О, кажется, я и правда не упоминала. Потому что, эм... конфиденциальность!#nМы обязаны защищать конфиденциальность клиентов, поэтому часто используем для них#nпсевдонимы."
1003103-83 = "Например... граф Новогоднего Кагами-моти...?"
1003103-85 = ""
1003103-86 = ""
1003103-88 = "О, как же я рада, что в этот раз вы смогли прийти на ужин, граф Новогоднего Кагами-моти."
1003103-89 = "Ха-ха-ха! Давненько не виделись, босс Я-Обожаю-Осэти!"
1003103-90 = "Граф Новогоднего Кагами-моти действительно существует?!"
1003103-91 = "А?! Ну, дело в том..."
1003103-92 = "Точно! Э-Это мой клиент! Мне следует его поприветствовать..."
1003103-93 = "Я скоро вернусь, Сенсей. Просто перекинусь с ним парой слов..."
1003103-94 = "(Что же делать?! Д-Думай. Должен быть какой-то способ выбраться из этого...)"
1003103-95 = ""
1003103-97 = ""
1003103-98 = ""
1003103-99 = ""
1003103-101 = ""
1003103-102 = ""
1003103-103 = ""
1003103-104 = ""
1003103-105 = "Хм?"
1003103-106 = "Мы можем вам чем-нибудь помочь, юная леди?"
1003103-107 = "Д-Да, эм, дело в том..."
1003103-108 = ""
1003103-110 = ""
1003103-111 = "(Я не могу!)"
1003103-112 = "Э-Эм! П-Простите!"
1003103-113 = ""
1003103-114 = "Ах!"
1003103-115 = ""
1003103-118 = "Ай... С-Сенсей? Вы в порядке?!"
1003103-119 = "П-Простите! Я не привыкла к этой одежде и оступилась. Сейчас встану!"
1003103-122 = ""
1003103-123 = "А-а-ай! Лодыжка!"
1003103-124 = "Кажется, я её подвернула. Я-я не могу встать."
1003103-125 = ""
1003103-128 = ""
1003103-130 = ""
1003103-132 = ""
1003103-133 = "А? Подождите. Сенсей, ч-что вы делаете?!"
1003103-134 = "(М-Меня несут на руках как принцессу?! Но все же смотрят!)"
1003103-135 = "[s3] «Прости, но я не могу просто оставить тебя лежать здесь.»\n[s4] «Поставить тебя обратно?»"
1003103-136 = "Не то чтобы я не ценю это, но...!"
1003103-137 = "Не то чтобы я не ценю это, но...!"
1003103-138 = "Н-Неважно. Меня это совсем не смущает."
1003103-139 = "Но серьёзно, Сенсей! Не нужно быть настолько заботливым."
1003103-140 = "[s] «Я хочу, чтобы в такие моменты ты могла на меня положиться.»"
1003103-141 = "Эм..."
1003103-142 = "Л-Ладно."
1003103-143 = "Тогда... ведите."
1003103-145 = "(Я вынес Ару с вечеринки на руках, и мы решили немного отдохнуть перед зданием.)"
1003103-148 = "Можете уже перестать меня нести! Это так неловко!"
1003103-149 = "К тому же моей лодыжке уже гораздо лучше."
1003103-150 = "*тяжело дышит* *тяжело дышит* Итак..."
1003103-151 = ""
1003103-153 = ""
1003103-154 = "Насчёт сегодняшнего дня, Сенсей."
1003103-155 = "[s5] «Прости. Кажется, я немного переборщил, да?»\n[s6] «Тебя так весело дразнить, Ару.»"
1003103-158 = "Ч-что?!"
1003103-159 = "*вздох* Почему я так вымоталась? Ну, я потратила немало сил на блеф, но всё же..."
1003103-160 = "Мой план впечатлить вас полностью обернулся против меня."
1003103-161 = "[s] «Ты всегда меня впечатляла, Ару.»"
1003103-162 = "...!"
1003103-163 = "Как у вас всегда получается говорить такие вещи так непринуждённо, Сенсей?"
1003103-164 = "А я, как обычно, всё порчу."
1003103-165 = "Так что... да! Давайте считать, что мы квиты!"
1003103-166 = "Что было, то было. В следующий раз я точно вас по-настоящему поражу!"
1003103-167 = "[s] «Буду рассчитывать на это.»"
1003103-168 = "Не... давите на меня так! *вздох* Ладно. Раз уж так, я обязательно вас впечатлю."
1003103-169 = "Н-Не то чтобы вы снова застали меня врасплох. Я просто подумала, что мой надёжный деловой партнёр умеет красиво говорить. Поэтому я и держу вас рядом."
1003103-170 = "В-В любом случае!"
1003103-171 = "До встречи."
1003103-172 = "Буду ждать его с нетерпением, Сенсей. ♪"
