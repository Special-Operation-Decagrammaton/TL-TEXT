[translation]
80000015-1 = "Закуски оптимизатора"
80000015-2 = "Кампус Миллениум"
80000015-3 = ""
80000015-4 = "Я заметил Эйми, которая одна сидела во дворе Миллениум и что-то ела."
80000015-5 = "[s] «Привет, Эйми.»"
80000015-6 = "О. Здравствуйте, Сенсей."
80000015-7 = "Какое совпадение. Я как раз отдыхаю после недавней миссии."
80000015-8 = "[s] «Что ты ешь?»"
80000015-9 = "Шоколад."
80000015-10 = "В полевых условиях я трачу много энергии, поэтому после миссии эффективно есть высококалорийный шоколад с большим количеством сахара."
80000015-11 = ""
80000015-13 = ""
80000015-16 = "Хотите один?"
80000015-17 = ""
80000015-18 = ""
80000015-22 = "[ns] «О. Эм...»"
80000015-23 = "Что-то не так?"
80000015-24 = "Если подумать, даже студенты, которые любят сладкое, почему-то неохотно покупают именно эти."
80000015-25 = "Наверное, поэтому в магазине был избыток и я смогла купить их со скидкой."
80000015-26 = "[s] «Ну, форма у них немного...»"
80000015-27 = "Форма? Какая разница, как они выглядят?"
80000015-28 = "Значение имеют только ингредиенты. Внешний вид неважен."
80000015-29 = "А если из-за формы их продают со скидкой, это делает их ещё более выгодным выбором."
80000015-30 = "Хотя признаю, я купила слишком много. Не хочу, чтобы шоколад пропал,#nтак что вот. Возьмите, Сенсей."
80000015-32 = "На обратном пути в Шале меня остановила для проверки студент Полицейской школы Валькирия из-за подозрительной формы шоколада Эйми."
