[translation]
1006902-1 = "Сытный обед"
1006902-2 = "Исполнительный офис Шале"
1006902-3 = ""
1006902-4 = "...Понимаете, если Променад Чёрной Черепахи официально обратится в Шале, это будет... не лучшим вариантом... для Шаньхайцзина."
1006902-5 = "Поэтому я и попросила о консультации для студента. Так я могла обратиться к вам за «личной» помощью."
1006902-6 = "Простите, Сенсей. Надеюсь, я не доставила вам проблем..."
1006902-7 = "[s] «Никаких проблем.»"
1006902-9 = "[ns] «Чем я могу помочь Променаду Чёрной Черепахи?»"
1006902-10 = "У нас возникли проблемы с поставками ингредиентов для нашего фирменного соуса. Я сама всё проверила и..."
1006902-11 = "Похоже, к этому причастен Чёрный рынок."
1006902-12 = "Если бы это была исключительно проблема Шаньхайцзина, мы смогли бы разобраться сами."
1006902-13 = "Но раз дело касается Чёрного рынка, это немного выходит за пределы нашей юрисдикции... Поэтому нам и нужна помощь Шале."
1006902-14 = "[s1] «Хм. Тут ты не ошибаешься. Хорошо, я займусь этим.»\n[s2] «Раз это просьба от тебя, Руми, я постараюсь изо всех сил.»"
1006902-17 = "Спасибо, Сенсей. Я понимаю, что и так многого прошу, но буду благодарна, если вы поторопитесь."
1006902-18 = "Соуса у нас осталось примерно на месяц..."
1006902-20 = ""
1006902-27 = "Но... Сенсей, у вас ведь и без того полно дел, правда?"
1006902-28 = "Даже эту консультацию для студента было непросто вписать в ваше расписание."
1006902-29 = "[s3] «Я стараюсь находить время для каждого своего студента. Правда стараюсь...»\n[s4] «В последнее время моё время всем очень нужно...»"
1006902-32 = "Я могу вам чем-нибудь помочь?"
1006902-33 = "[s] «Мне достаточно уже того, что ты доверяешь мне свои проблемы!»"
1006902-34 = "Иными словами, вы не думаете, что я могу хоть чем-то помочь..."
1006902-35 = "Ну, это ужасно разочаровывает. Наверняка есть хоть что-нибудь, что я могу сделать..."
1006902-36 = "О, вы уже обедали? Конечно же да, правда?"
1006902-37 = "[s5] «О... Сегодня я не был голоден, так что нет.»\n[s6] «Сегодня не было времени ни приготовить, ни заказать еду.»"
1006902-40 = ""
1006902-41 = ""
1006902-42 = "...Вы шутите."
1006902-43 = "[s7] «Эм... Руми...?»\n[s8] «Э-э... Здесь внезапно стало как-то напряжённо...»"
1006902-46 = "Тс-с!"
1006902-47 = "Чтобы вы знали! Пропускать приём пищи! Я КАТЕГОРИЧЕСКИ не позволю!"
1006902-48 = "[s] «А... Вот как...?»"
1006902-49 = "Решено. Если вы сами себя кормить не будете, Сенсей, тогда это сделаю я!"
1006902-51 = "Руми закатала рукава и решительно направилась в гостиную Шале."
1006902-52 = ""
1006902-55 = "Гостиная Шале"
1006902-57 = "[ns] На всякий случай пойти за Руми."
1006902-58 = "Так, посмотрим... Лук! Уже пророс и немного размяк, но съедобные части я вырезать смогу."
1006902-59 = "А эта картошка... Как вы вообще умудрились сделать так, чтобы она позеленела, пока лежала в холодильнике...?"
1006902-60 = "О, а этот хлеб... Плесени нет, но он твёрдый как камень. Хм... Может, если раздробить его и использовать как панировку...?"
1006902-61 = "А в морозилке у вас... мясо с морозильным ожогом. Им человека вырубить можно."
1006902-62 = "Даже сакэ и соевый соус скоро просрочатся. Я вообще впервые вижу, чтобы сакэ успело испортиться..."
1006902-63 = "[s9] «Пожалуйста... Хватит...»\n[s10] «Тебе нравится издеваться над своим учителем?»"
1006902-66 = "Хорошо. Всё необходимое у меня есть."
1006902-67 = "[s] «Серьёзно?!»"
1006902-68 = "Не недооценивайте Променад Чёрной Черепахи, Сенсей. Ваша кладовая здесь подкинула мне несколько... испытаний... но от этого только интереснее."
1006902-69 = "Дайте мне 30 минут. Скоро я приготовлю для вас вкусный обед."
1006902-71 = ""
1006902-77 = ""
1006902-79 = "[ns] «Не могу поверить...»"
1006902-80 = "Ну как? Заодно я опустошила ваш холодильник."
1006902-81 = "Я приготовила много, так что угощайтесь."
1006902-82 = ""
1006902-84 = ""
1006902-86 = "[ns] «С-Спасибо за еду!!»"
1006902-91 = "Готовит Руми на удивление хорошо. Нет, потрясающе хорошо!"
1006902-92 = "Трудно было поверить, что она приготовила всё это из того, что лежало у меня в холодильнике..."
1006902-93 = "Было непросто, но видеть, как вы с удовольствием едите хорошую еду, того стоит."
1006902-94 = "Когда я готовлю, я стараюсь сделать как можно больше еды с максимально необычным вкусом из самых обычных ингредиентов."
1006902-95 = "С каждым новым рецептом я спрашиваю себя: «Станет ли это хитом? Поможет ли это развитию бизнеса?»"
1006902-96 = "Всё сводится к тому, чтобы находить проблемы в каждом блюде — во вкусе, впечатлении и даже стоимости."
1006902-97 = "Именно этого требует управление рестораном, поэтому так и работает Променад Чёрной Черепахи."
1006902-98 = "[s] «Всё это здорово, но ты не слишком много приготовила...?»"
1006902-99 = "Что вы такое говорите? Вы знаете, насколько мы все от вас зависим? Вам нужно как следует наесться!"
1006902-100 = "Вы только посмотрите на себя! Кожа да кости!"
1006902-101 = "Кстати, вот, возьмите ещё! Вы ведь пропустили обед? Готова поспорить, что и завтрак тоже!"
1006902-102 = "Пожалуй, на всякий случай я приготовлю вам ещё и ужин!"
1006902-103 = "[s] «С-Спасите!»"
1006902-105 = "Она накормила меня так сильно, что казалось, мой желудок вот-вот лопнет..."
