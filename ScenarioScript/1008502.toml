[translation]
1008502-1 = "Цифровой кочевник"
1008502-2 = "Лесной парк возле Миллениума"
1008502-3 = "Получив сообщение от Харэ, я пришёл в лесной парк неподалёку от Миллениума."
1008502-4 = ""
1008502-6 = ""
1008502-7 = ""
1008502-8 = ""
1008502-9 = ""
1008502-10 = "А, Сенсей. Добро пожаловать."
1008502-11 = "Как я и писала в MomoTalk, я собираюсь немного наверстать программирование, наслаждаясь природой."
1008502-12 = "Я пришла так рано, чтобы убедиться, что правильно подготовила всё необходимое для работы с кодом в лесу."
1008502-13 = "Скоро закончу, так что подождите минутку."
1008502-14 = "[s] «Ты сказала, что нужно правильно всё подготовить?»"
1008502-15 = "Да. Чтобы пользоваться компьютером снаружи, нужно немало дополнительной техники."
1008502-16 = "Роутер для постоянного соединения с облаком..."
1008502-17 = "Портативный пауэрбанк с быстрой зарядкой на случай, если сядет батарея..."
1008502-18 = "А, нельзя забыть мини-холодильник, чтобы энергетики оставались холодными."
1008502-19 = "[s] «Тебе правда всё это нужно ради небольшого программирования на улице?»"
1008502-20 = "Конечно. Программирование похоже на решение логических задач. Крайне важно иметь окружение, в котором можно полностью сосредоточиться."
1008502-21 = "Вся работа здесь потеряет смысл, если хорошая идея упрётся в отсутствие оборудования, разве нет?"
1008502-22 = "...И даже не предлагайте мне пить тёплый энергетик."
1008502-23 = "Я бы ещё взяла монитор и клавиатуру, но решила, что это уже перебор. Пока хватит и этого."
1008502-24 = ""
1008502-27 = "[ns] «(Не уверен, что таскать всю эту технику на улицу — это и есть цифровое кочевничество.)»"
1008502-28 = ""
1008502-31 = "Фух... Какой освежающий ветерок."
1008502-32 = "Немного прохладно, но я рада, что вышла наружу."
1008502-33 = ""
1008502-35 = ""
1008502-36 = "Ну что ж. Пора работать."
1008502-38 = ""
1008502-40 = ""
1008502-42 = ""
1008502-44 = "Несколько мгновений спустя..."
1008502-48 = ""
1008502-49 = "...Мм."
1008502-50 = "Кажется, это была ошибка..."
1008502-51 = "[s] «Что случилось?»"
1008502-52 = "О, с работой всё нормально, но..."
1008502-53 = "В этой одежде неудобно печатать и двигаться."
1008502-54 = "Но если я собираюсь работать здесь, нужно одеваться теплее. Так неудобно."
1008502-55 = "И сидеть в этом походном кресле тоже. Ай, спина."
1008502-56 = "[s1] «Может, сделаешь перерыв и разомнёшься?»\n[s2] «Жалко просто работать и совсем не наслаждаться красивым лесом.»"
1008502-59 = "Наверное, вы правы. Немного разомнусь."
1008502-60 = ""
1008502-62 = ""
1008502-63 = "Мм... Здесь такой красивый пейзаж, да и погода хорошая."
1008502-64 = "Но разве это вообще имеет значение? Чтобы работать, мне всё равно приходится смотреть в монитор."
1008502-66 = "Харэ потянулась около двух секунд, а затем вернулась в свою прежнюю кривую позу."
1008502-71 = "...И готово."
1008502-72 = "Сегодняшний код закончен. Осталось только синхронизировать его с облачным сервером."
1008502-73 = "[s] «Молодец!»"
1008502-74 = "Спасибо, что терпите меня в свой выходной, Сенсей."
1008502-75 = "Работать было ужасно неудобно... Но из-за этого сложнее отвлекаться, так что я сэкономила время. Может, не всё так плохо."
1008502-76 = "По крайней мере, не зря тащила сюда всё это оборудование."
1008502-77 = "Теперь остаётся добавить новый код в исходники, нажать обновить и..."
1008502-78 = ""
1008502-80 = ""
1008502-81 = ""
1008502-82 = ""
