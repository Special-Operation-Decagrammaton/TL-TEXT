1008502-123 = "[ns] «Ч-что случилось?»"
1008502-124 = "...Произошёл откат."
1008502-125 = "Облачный сервер перезаписал мой новый код предыдущей версией."
1008502-126 = "Полдня работы... полностью впустую..."
1008502-127 = "[s] «Можно его восстановить? Например, из резервной копии?»"
1008502-128 = "Насчёт этого..."
1008502-129 = "На компьютере, которым я обычно пользуюсь, есть автосохранение. Но сегодня я работала напрямую через командную оболочку облака... Какая беспечность."
1008502-130 = "Это уже не восстановить. Похоже, код придётся писать заново."
1008502-131 = "Такого бы никогда не случилось, если бы я просто осталась в клубной комнате."
1008502-132 = ""
1008502-134 = ""
1008502-135 = "Больше никогда не буду работать на улице!"
1008502-137 = "И я отвёл расстроенную Харэ обратно в клубную комнату Веритас."
