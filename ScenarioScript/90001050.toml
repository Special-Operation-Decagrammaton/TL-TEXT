[translation]
90001050-1 = "Эпизод 5;Переменная"
90001050-9 = ""
90001050-10 = "Сработала тревога?"
90001050-11 = "Ещё одно сообщение от Гебуры... О?"
90001050-12 = "Н-Наша дорогая Гебура проиграла?!"
90001050-13 = "Ну надо же. Понятно. Приступим к плану Б?"
90001050-14 = "Я не возражаю. Уважим желание Гебуры до самого конца."
90001050-15 = "З-Значит, нам придётся заманить их... в то место."
90001050-16 = "Гебура всё-таки отлично поработала, направляя врагов в нужную сторону."
90001050-17 = "Вот наша Гебура! Скрупулёзная! Усердная! И, конечно же, горячая голова!"
90001050-18 = "Проанализируем журналы... О? Надо же. Неожиданная переменная."
90001050-19 = "Имя... Я правильно читаю? Цукацуки Рио...?"
90001050-20 = "Ц-Цукацуки Рио?!"
90001050-21 = "Раздражает! Раздражающий противник. Уф. Возможно, стоило это предвидеть."
90001050-22 = "Но почему именно сейчас? ...Ещё один бесполезный вопрос."
90001050-23 = "В-В конце концов... именно она первой заметила присутствие господина... и первой осмелилась исследовать его следы."
90001050-24 = "Как бы то ни было, нужно подготовить способ справиться с этой переменной."
90001050-25 = "Даже если учесть её, если вспомнить, куда их заманивают и что мы там подготовили..."
90001050-26 = "Вот вопрос. В уравнении появилась переменная, которую нельзя просто проигнорировать. Продолжаем действовать прежним методом?"
90001050-27 = "К-Как думаешь, что нам делать, Соф?"
90001050-28 = "Решения... решения... Нужно быть решительными."
90001050-29 = ""
90001050-31 = ""
90001050-32 = ""
90001050-33 = "Да. Ага. Продолжаем план тем же методом."
90001050-35 = "...Как и ожидалось. Вообще-то, я именно это и предполагала."
90001050-36 = "Т-Т-Ты уверена? Это же Цукацуки Рио!"
90001050-37 = "Да. Ага. Признаю, она грозный противник. Но, с другой стороны..."
90001050-38 = "С-С другой стороны...?"
90001050-39 = "Этот ребёнок ничуть не менее грозный! Правда ведь, Эйн?"
90001050-40 = "А-А? Что я думаю?"
90001050-41 = "Наши дети непобедимы, верно?"
90001050-42 = "...!"
90001050-43 = "Д-Да! Ты права! Эта малышка непобедима!"
90001050-44 = "В любом случае, стоит Цукацуки Рио войти в то место — и она станет совершенно бесполезна."
90001050-45 = "Ах...! Точно! Ведь Цукацуки Рио присутствует здесь только по беспроводной связи!"
90001050-46 = "Совершенно верно. И последнее: нужно правильно оценить уровень угрозы, которую представляет новая переменная."
90001050-47 = "...Цукацуки Рио. Та, что осмелилась потянуться к запретной технологии, лежащей далеко за пределами её положения."
90001050-48 = "Я-я знала её данные."
90001050-49 = "Кроме того, она основала Отряд Исследования Сверхъестественного, которая посмела вмешиваться в операции господина. Хотя, полагаю, саботажем руководила Акебоши Химари."
90001050-50 = "До сих пор она скрывала своё местоположение и действовала из самых тёмных теней. Что заставило её внезапно показаться?"
90001050-51 = "Чтобы она вдруг вышла прямо на передовую..."
90001050-52 = "Верно. По той или иной причине она ждала, пока к ним присоединится их учитель."
90001050-53 = "Это всё грязные домыслы Соф!"
90001050-54 = "Замолчи."
90001050-55 = "В любом случае, является ли Цукацуки Рио такой же опасной переменной, как Сенсей..."
90001050-56 = "...или её можно просто исключить из уравнения — увидим."
90001050-57 = ""
90001050-59 = ""
90001050-60 = "Итак, вывод Соф..."
90001050-61 = "Ты собираешься с помощью ребёнка оценить значимость новой переменной, одновременно полностью уничтожив всех остальных врагов?"
90001050-63 = "Мне нужно повторять?"
90001050-64 = "Н-Но... это правда нормально...? Если они встретятся с тем ребёнком, даже эти люди..."
90001050-65 = "...наверняка погибнут?"
90001050-66 = "Да... Это весьма сложная проблема."
90001050-67 = "Мы ещё ни разу не причиняли вреда человеку, не желали этого и даже не думали об этом..."
90001050-68 = ""
90001050-70 = ""
90001050-71 = "Если говорить честно, признаюсь, даже я чувствую..."
90001050-72 = "..."
90001050-73 = "Эйн, Соф. Я думаю... это бремя, которое нам придётся нести."
90001050-75 = "А?!"
90001050-76 = "..."
90001050-78 = "Я ведь говорю правду, разве нет? Заманив людей в Ледниковое море, мы уже заявили о своей решимости в этом вопросе."
90001050-79 = "Разве мы уже не сказали им: «Пожалуйста, умрите»?"
90001050-80 = "Р-Р-Разве это было не просто для драматического эффекта?"
90001050-81 = "А. Да. Ага. Я тоже так думала..."
90001050-82 = "Послушайте обе. Укрепите свой дух. Ради Старшей Сестры."
90001050-83 = ""
90001050-86 = ""
90001050-87 = "Но..."
90001050-88 = "Я знаю, Эйн. Знаю. Мы не планировали... Наша конечная цель была в том, чтобы избежать такого решения уравнения."
90001050-89 = "Но кто первым пришёл на нашу территорию? Сенсей и остальные люди вторглись сюда, замечу, без разрешения."
90001050-90 = "..."
90001050-91 = "Да. Я... понимаю."
90001050-92 = "Мне нужно укрепить решимость, чтобы не отставать."
90001050-93 = "..."
90001050-94 = ""
90001050-96 = ""
90001050-97 = ""
90001050-98 = "Да. Всё будет так, как должно быть."
90001050-99 = "Д-Да...!"
90001050-101 = "Хотя само такое заявление — воплощение безответственности."
90001050-102 = "ВА-А-А?!"
90001050-103 = "Ор!"
90001050-104 = "Прошу прощения, правда. Эйн демонстрирует такой широкий спектр реакций. Искушение поэкспериментировать с разными переменными просто слишком велико!"
90001050-105 = "О-хо? А меня страшно тянет проверить прочность твоих логических цепей! Хочешь стать моим подопытным?"
90001050-106 = ""
90001050-108 = ""
90001050-111 = "Вместо того чтобы позволить тебе проводить такой увлекательный эксперимент— Ай! Хватит насилия!"
90001050-112 = ""
90001050-116 = "С-Соф... Всё нормально, не надо..."
90001050-119 = ""
90001050-120 = "Как я уже говорила, я исследовала следы, оставленные силой Безымянных богов."
90001050-121 = "И в ходе этого расследования я неожиданно столкнулась с Гебурой, пятым пророком Декаграмматона."
90001050-122 = ""
90001050-124 = ""
90001050-125 = ""
90001050-126 = "Хм-м."
90001050-127 = "Хм..."
90001050-128 = ""
90001050-130 = ""
90001050-131 = ""
90001050-132 = "Это связывает её со следом, который мы нашли в Ледниковом море?"
90001050-133 = "Но до сих пор мы не могли провести связь между Декаграмматоном и Безымянными богами."
90001050-134 = "Верно, Эйми. Уверена, уже в одном этом скрывается какая-то истина."
90001050-135 = "А пока разберём то, что совершенно точно является фактом."
90001050-136 = "Я также собрала информацию о другом пророке, обитающем в Ледниковом море. Похоже, он добывает здесь ресурсы."
90001050-137 = "Добывает ресурсы?"
90001050-138 = "Подозреваю, этот пророк принял форму какого-то корабля. Ледокола или тактического судна."
90001050-139 = "Понятно. Такая гипотеза соответствует обнаруженным нами следам."
90001050-140 = "Ледниковое море... Люди здесь почти не бывают, но известно, что оно богато ресурсами."
90001050-141 = "Зная это, можно предположить, что роль Гебуры здесь — патрулировать окрестности в поисках потенциальных врагов..."
90001050-142 = "...и охранять другого пророка."
90001050-143 = "[s] «Хм... Вообще-то, это имеет смысл.»"
90001050-144 = "Ты выяснила личность пророка в форме корабля?"
90001050-145 = "...Пока нет. Как ни странно, он почти не излучает сигналов, которые можно считать."
90001050-146 = "Я пыталась фотографировать местность с помощью AMAS, переоборудованных в скоростные разведывательные аппараты. Но при необходимости оставаться незамеченной возможности ограничены."
90001050-147 = "Понятно. Добавим твои данные к гипотезе, которую мы разрабатывали."
90001050-148 = "Какой гипотезе?"
90001050-149 = "Судя по нашим наблюдениям, инженеры Декаграмматона не только знают о силе Безымянных богов..."
90001050-150 = "...но, вероятно, уже получили её."
90001050-151 = "Да. Похоже на наиболее вероятный вывод."
90001050-152 = "Во время боя мы поняли, что инженеры записывали данные с Аби-Эшуха Токи."
90001050-153 = "Можно лишь заключить, что они хотели проверить те данные о силе Безымянных богов, которые успели собрать."
90001050-154 = "Кроме того, согласно твоей информации, в Ледниковом море есть ещё один пророк в форме корабля, добывающий ресурсы..."
90001050-155 = "А покидая район, он оставил за собой огромный след."
90001050-156 = "И это подводит нас к вопросу..."
90001050-158 = "Какому вопросу?"
90001050-159 = "С назначением Гебуры мы более-менее разобрались: патрулирование и сбор данных."
90001050-160 = "Но зачем этот загадочный пророк добывает ресурсы?"
90001050-161 = "Это..."
90001050-162 = "[s] «Думаешь, его мотив отличается от мотива Гебуры?»"
90001050-163 = ""
90001050-165 = ""
90001050-166 = ""
90001050-167 = "Думаю, да."
90001050-168 = "Но это лишь моё мнение. Повторюсь, всё это догадки и гипотезы."
90001050-169 = "Ответы мы найдём только на месте, в конце следа, по которому идём."
90001050-170 = "По моим расчётам, велика вероятность, что корабль-пророк ждёт именно там."
90001050-171 = ""
90001050-173 = ""
90001050-174 = "...? Подождите. У меня доклад."
90001050-175 = "Пока мы разговаривали, похоже, местность под нами изменилась."
90001050-176 = "Я снижу высоту. Пожалуйста, пристегните ремни и будьте готовы к турбулентности."
90001050-180 = ""
90001050-181 = ""
90001050-183 = ""
90001050-184 = "..."
90001050-185 = ""
90001050-187 = ""
90001050-188 = "?"
90001050-189 = "...?"
90001050-190 = ""
90001050-192 = ""
90001050-193 = ""
90001050-194 = "Что случилось, Президент?"
90001050-195 = "ЧТО ЭТО?! Я по глупости решила, что мы наконец-то вырвались из лап Ледникового моря, только чтобы попасть в замёрзшую тундру?!"
90001050-196 = "В тундре нет ничего тёплого! Я не могу снять утеплённый костюм! В нём трудно двигаться!"
90001050-197 = "Да. Здесь холодно. Мне нравится."
90001050-198 = ""
90001050-200 = ""
90001050-201 = ""
90001050-202 = ""
90001050-203 = ""
90001050-204 = ""
90001050-205 = ""
90001050-206 = "[ns] «Может, здесь самую малость лучше, чем в Ледниковом море?»"
90001050-207 = "Мне не нужна «самая малость»! Я хочу, чтобы основная проблема была решена!"
90001050-208 = "Однако здесь теплее. В среднем температура поднялась примерно на три градуса Цельсия."
90001050-209 = "Вообще-то, море здесь уже не так легко замерзает."
90001050-210 = "Я хотела бы подчеркнуть, что моря здесь вообще нет!"
90001050-212 = "Перейдём к более важным вещам. Я обнаружила кое-что странное."
90001050-213 = ""
90001050-216 = "[ns] «Что... это такое?»"
90001050-217 = "Похоже на след, оставленный чем-то, способным... передвигаться."
90001050-218 = "С определённой точки зрения это даже нормально. Мы добрались сюда, следуя едва заметному следу, так почему бы не продолжить следовать по следу?"
90001050-219 = "Но этот... ну...?"
90001050-220 = "Похоже на гигантские ямы, расположенные через совершенно одинаковые промежутки."
90001050-221 = "Разве корабль оставляет такие следы?"
90001050-222 = "[s] «Я знаю, звучит нелепо, но...»"
90001050-223 = "...Да. Даже не знаю, как это сказать."
90001050-224 = "Однако, как сказал Сенсей, это похоже на..."
90001050-225 = "Что-то вроде..."
90001050-226 = "..."
90001050-227 = "Следов о-о-огромного чудовища?"
90001050-228 = "То, как ты умеешь вслух сказать то, чего остальные боятся... иногда действительно достойно похвалы."
90001050-229 = "Современные корабли умеют ходить на ногах?"
90001050-230 = "Нет. Ты сама себя слышишь? Корабли не умеют ходить. Какой смысл приделывать кораблю ноги? Не существует никого, кто действовал бы настолько иррационально и неэффективно."
90001050-231 = "Но вам нравятся иррациональные и неэффективные вещи, президент. Например, астрология. И нумерология. И—"
90001050-232 = "Хи-хи. Ты просто не способна понять мою гениальность, Эйми. Астрология — огромная наука, объединяющая исследования множества разных дисциплин..."
90001050-233 = "...включая небесную статистику и события, философию изменчивости судьбы, математику и физику!"
90001050-234 = "Но гигантские монстры — это область, которую невозможно объяснить наукой... Чистый плод фантазии. Не может быть, чтобы они существовали. Ну же, Эйми."
90001050-236 = "(Сейчас-то вы так говорите...)"
90001050-237 = ""
90001050-239 = ""
90001050-240 = ""
90001050-241 = "Как нам к этому подойти...?"
90001050-242 = "Других зацепок получить не удалось."
90001050-243 = "Просто разворачиваться сейчас было бы неэффективно."
90001050-244 = "[s] «Я тоже так думаю. Спасибо за сводку, Токи.»"
90001050-245 = "Спасибо, Сенсей. Кстати, говорят, комплименты заставляют мир вращаться. Я не мир, но я Асума Токи."
90001050-247 = "Что вы сделали, Сенсей? Токи опять говорит странные вещи."
90001050-248 = "[s] «То есть это теперь моя вина...?»"
90001050-249 = "Я оценила ситуацию. Рио, пожалуйста, сообщай о любых изменениях."
90001050-250 = "Поняла."
90001050-251 = "Токи, можешь постоять на страже? Нужно быть готовыми к любой возможной угрозе."
90001050-252 = "Поняла, президент Химари."
90001050-253 = ""
90001050-255 = ""
90001050-260 = "Следующий эпизод;Пламя"
