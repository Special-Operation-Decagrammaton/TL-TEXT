[translation]
1007905-1 = "Из одного теста"
1007905-2 = "Мисака попросила встретиться с ней в большом игровом центре неподалёку от места, где она остановилась."
1007905-3 = "Когда я пришёл, она стояла перед полкой с призами, где была выставлена целая линейка кукол."
1007905-4 = ""
1007905-6 = ""
1007905-7 = ""
1007905-9 = ""
1007905-10 = "Ч-Что это... Что это такое...?"
1007905-11 = "[s1] «Мисака?»\n[s2] «На что ты смотришь?»"
1007905-14 = "Что это вообще... такое..."
1007905-15 = "Что это за персонаж? Он специально... так выглядит...?"
1007905-16 = "Чтобы это попало в игровой центр... Нет, чтобы это вообще с гордостью выставляли..."
1007905-17 = ""
1007905-21 = "[ns3] «А.»\n[ns4] «По-моему, это вполне нормальная реакция на этого персонажа.»"
1007905-24 = "Ч-Что?"
1007905-25 = "О-Он правда должен выглядеть именно так? Это законченный дизайн? Серьёзно?"
1007905-26 = "Он немного... Наверное, можно назвать дизайн выдающимся. Во многих смыслах..."
1007905-27 = "...Хм? Есть ещё такие? П-Правда...?"
1007905-28 = "Так, посмотрим..."
1007905-29 = ""
1007905-34 = ""
1007905-35 = "О-Ого... И правда... Ха... Хаха..."
1007905-36 = "...А? Что вы сказали?"
1007905-37 = "Такие есть не только здесь? Их ещё больше в торговом районе...?"
1007905-38 = "Этот персонаж правда настолько знаменит...? Вот ЭТО?! Вы шутите!"
1007905-39 = "П-Понятно... Хм..."
1007905-40 = "...Сенсей."
1007905-41 = "Это и правда совершенно другой мир. Впервые я по-настоящему это осознаю."
1007905-42 = "[s5] «С момента твоего появления здесь я ещё не видел тебя настолько удивлённой.»\n[s6] «Э-Это настолько шокирует...?»"
1007905-45 = "Н-Ну... Ладно. Полагаю, у каждого мира своя эстетика..."
1007905-46 = "В этом мире свои правила. Кто я такая, чтобы так строго судить...?"
1007905-47 = "А? Всё не так?"
1007905-48 = "То есть... этот персонаж и здесь довольно спорный?"
1007905-49 = "Вот как..."
1007905-50 = "[s7] «Вкус довольно специфический.»\n[s8] «Некоторые даже будут дразнить тебя просто за то, что он тебе нравится.»"
1007905-53 = "Понятно... Странный вкус... И будут дразнить..."
1007905-54 = "Хм..."
1007905-55 = ""
1007905-57 = ""
1007905-58 = "[ns9] «Эм, Мисака?»\n[ns10] «Мне кажется, твоё настроение изменилось...»"
1007905-61 = "Просто..."
1007905-62 = "У меня появилось какое-то дежавю..."
1007905-63 = "О."
1007905-64 = "Гекота..."
1007905-65 = "[s11] «Гекота?»\n[s12] «Кто это?»"
1007905-68 = "Конечно..."
1007905-69 = "Да. Вот оно что."
1007905-70 = "Сенсей, я чуть не совершила ужасную ошибку."
1007905-71 = "Этот персонаж... Даже если я пока его не понимаю, кому-то он дорог."
1007905-72 = "Мне самой иногда приходилось терпеть неодобрительные взгляды одноклассников в Академгородке..."
1007905-73 = "Может быть... Как вы сказали его зовут?"
1007905-74 = "...Пероро? Из Momo Friends?"
1007905-75 = "Этот Пероро из Momo Friends... Может, он Гекота этого мира."
1007905-76 = "Хм-м."
1007905-77 = "Если думать об этом так, наверное, он даже немного милый..."
1007905-78 = "[s13] «Какая резкая перемена!»\n[s14] «Тебе его жалко...?!»"
1007905-81 = "К-Какая разница! Милый значит милый!"
1007905-82 = "Я решила. К тому же я пересекла целые миры, чтобы оказаться здесь, так что, может, это судьба."
1007905-83 = "Нужно проявить уважение и купить себе одного."
1007905-84 = "Это призы... А, но вот этих можно купить."
1007905-85 = ""
1007905-87 = ""
1007905-88 = "Эм... Хорошо. Выбираю этого. Сенсей! Где платить?"
1007905-89 = "...Вы купите его мне? Вы уверены, что не против...?"
1007905-90 = "Вы..."
1007905-91 = "...Но нормально ли мне это принимать?"
1007905-92 = ""
1007905-94 = ""
1007905-95 = "Ну... не знаю..."
1007905-96 = "Если немного похожу с ним, может, начну по-настоящему его любить... Я постараюсь, чтобы мы подружились!"
1007905-97 = "[s15] «Будешь стараться, значит?»\n[s16] «Похоже на начало великой дружбы.»"
1007905-100 = "Хорошо..."
1007905-101 = "Д-Давай дружить, Пероро!"
1007905-104 = "― [log=미사카]М-м-м...[/log][wa:580]"
1007905-107 = "― [log=미사카]Если присмотреться,[/log][wa:10]"
1007905-109 = "― [log=미사카]он и правда вроде бы немного милый...[/log][wa:2060]"
1007905-112 = "― [log=미사카]Так это свинья...?[/log][wa:1190]"
1007905-114 = "― [log=미사카]Или, может, бегемот?[/log]"
1007905-117 = "― [log=미사카]...Что?! Птица?! Вы шутите![/log][wa:330]"
1007905-120 = "[ns17] «Если присмотреться, форма примерно птичья...»\n[ns18] «У него есть клюв и крылья.»"
1007905-124 = "― [log=미사카]Н-Наверное, но...[/log][wa:820]"
1007905-126 = "― [log=미사카]Хаха... Ну, думаю, ничего страшного. [/log][wa:1430]"
1007905-129 = "― [log=미사카]Знаете, если подумать... [/log][wa:1160]"
1007905-131 = "― [log=미사카]Это ведь подарок от Сенсея.[/log][wa:1260]"
1007905-134 = "― [log=미사카]...Я обязательно буду им дорожить.[/log][wa:620]"
1007905-136 = "― [log=미사카]Спасибо, Сенсей.[/log][wa:80]"
1007905-139 = "После этого я заплатил за плюшевую игрушку, которую выбрала Мисака."
1007905-140 = "Когда мы вышли из игрового центра, она продолжала разглядывать её с любопытным выражением."
