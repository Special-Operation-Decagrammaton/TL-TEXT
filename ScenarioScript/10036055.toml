[translation]
10036055-2 = ""
10036055-3 = "Я думала, мне конец, а в итоге я единственная осталась на ногах..."
10036055-5 = "Т-Так всё не должно было закончиться..."
10036055-6 = "Что? Просто продолжать? Это ещё что значит?"
10036055-7 = "Эм... *кхм* Когда пыль улеглась, у Флаппи Банды шлемов, эм... победила подработка?"
10036055-8 = "Подработка Флаппи Банды шлемов победила всех и выходит победителем!"
10036055-9 = ""
10036055-10 = "(Дымовая завеса сработала ровно в нужный момент, и даже те, в кого я не стреляла, всё равно упали...)"
10036055-11 = "(Что вообще только что произошло...?)"
10036055-12 = ""
10036055-13 = "Эм... Это считается нашей победой?"
10036055-14 = "Вообще-то мы не должны были, но... да, наверное?"
10036055-15 = "Победа есть победа, верно? Эй, давайте поднимем её все вместе!"
10036055-16 = "Уууу!"
10036055-17 = ""
10036055-19 = ""
10036055-21 = "П-Погодите! Если вы меня поднимете, они же...!"
10036055-22 = ""
10036055-28 = ""
10036055-29 = ""
10036055-30 = ""
10036055-31 = "...увидят нас? Нет, отсюда не увидит."
10036055-32 = "Х-Хи-хи, думаете, она понимает, что мы ей помогли?"
10036055-33 = "Судя по выражению лица — нет, вообще."
10036055-34 = "Да, выглядит довольно озадаченной."
10036055-35 = "[s1] «Д-Да.»\n[s2] Сочувственно поморщиться."
10036055-38 = "Ну, она всё-таки победила, так что наверняка счастлива. Хи-хи... Ох, как же приятно от всего этого."
10036055-39 = "Зная её характер, она, скорее всего, больше смущена, чем счастлива."
10036055-40 = "Хотя я не жалуюсь."
10036055-41 = "Сейчас ей, может, неловко, но думаю, потом она будет вспоминать это с теплом."
10036055-42 = "Я рада, что на этом пляже у неё появилось столько воспоминаний."
10036055-43 = "Хотя, возможно, было бы лучше, если бы мы все были вместе..."
10036055-44 = "[s] «...»"
10036055-45 = ""
10036055-47 = ""
10036055-48 = ""
10036055-49 = "И всё же всё хорошо, что хорошо кончается. Как всегда, спасибо за помощь, Сенсей."
