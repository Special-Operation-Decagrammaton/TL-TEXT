[translation]
10048040-1 = "Эпизод 4;Алебастровая переменная"
10048040-2 = "Общежитие Картеля свободной торговли"
10048040-3 = "До-бро-е утро! Ми-Ё-утро!"
10048040-4 = "Утро, Миё!"
10048040-5 = "Пора в школу!"
10048040-6 = ""
10048040-9 = "Уф... Ещё пять минут..."
10048040-10 = ""
10048040-12 = ""
10048040-13 = "О, это ты, Рицу...?"
10048040-14 = "Ага! Пора вставать, Миё!"
10048040-15 = "Ха..."
10048040-16 = "Кстати, Рицу, если не возражаешь, я хотела спросить..."
10048040-17 = "Хм?"
10048040-18 = "Эм... Почему ты держишь молоток у меня над головой?"
10048040-19 = "А. О, это..."
10048040-20 = ""
10048040-22 = ""
10048040-24 = "Это на случай, если ты не встанешь! Разбить при чрезвычайной ситуации."
10048040-25 = "А ТЫ лучше перестань нести чушь и займись своим завтраком."
10048040-26 = "Так, Рицу, а этот молоток...?"
10048040-27 = "Я как раз собиралась в скульптурную мастерскую. Вот и забирала инструменты!"
10048040-28 = "Молоток, зубило, стамеска..."
10048040-29 = "...Ага."
10048040-30 = "Фуфу. Как всегда усердна, Рицу."
10048040-31 = "Пока ты спала и храпела на всю комнату."
10048040-32 = "Я... ВЫМОТАЛАСЬ из-за вас!"
10048040-33 = "Я всю ночь придумывала план. Думаете, проникнуть на выставку будет легко?!"
10048040-34 = "О блистательный писец, твой труд ошеломляющего гения наконец завершён?"
10048040-35 = "Вот только в такие моменты мой талант и признают..."
10048040-36 = "...*вздыхает* Я поступала в Вайлдхант не для того, чтобы писать подобное..."
10048040-38 = "А? Тебе не нравится собственная работа, Миё?"
10048040-39 = "Ну, эм..."
10048040-40 = "Скажем так, то, чем я занимаюсь сейчас, совсем не то, что я представляла изначально..."
10048040-41 = "А мне нравится, как ты пишешь!"
10048040-42 = "Ты мой любимый автор, Миё!"
10048040-43 = "Рицу... Ты такая милая. Спасибо."
10048040-45 = "Ого. Какая резкая смена настроения."
10048040-46 = "Может, и со мной поделишься этой нежностью?"
10048040-47 = "..."
10048040-48 = "*вздыхает*"
10048040-49 = "В любом случае."
10048040-50 = "Что? Меня просто пропустили?!"
10048040-51 = "Я набросала наш план."
10048040-52 = "Самое важное: операция пройдёт не в выставочном зале."
10048040-54 = "А? Но картина ведь будет там."
10048040-55 = "Да... «будет»... когда выставка откроется, разумеется."
10048040-56 = "Но «Любовь пурпурного и синего света» СЕЙЧАС ещё не выставлена."
10048040-57 = "Скорее всего, она находится в хранилище академии."
10048040-58 = "Вероятнее всего, там она и останется до вечера открытия выставки."
10048040-59 = "А...!"
10048040-60 = "Значит, всё будет куда менее заметно. Мы сможем подменить картину в тихом хранилище."
10048040-61 = "А, ты про то Художественное хранилище? Про склад?"
10048040-62 = "Поняла! Мы проломим стену и просто заберём картину, да?"
10048040-63 = "Рицу, боюсь, нам придётся действовать куда незаметнее."
10048040-64 = "В конце концов, клиентка не станет платить за ремонт стены..."
10048040-66 = "Да. Звучит сложнее, чем я надеялась."
10048040-67 = "И как ты предлагаешь нам проникнуть в хранилище?"
10048040-68 = "У меня уже есть наброски заговора — то есть плана! Позже всё расскажу."
10048040-69 = "А пока... боюсь, нам всем пора на занятия."
10048040-70 = "Приятной лепки, Рицу."
10048040-71 = "Хорошо!"
10048040-72 = ""
10048040-74 = ""
10048040-75 = ""
10048040-76 = "Что со мной?"
10048040-77 = "Как угодно."
10048040-78 = ""
10048040-80 = ""
10048040-81 = "Эх."
10048040-85 = "Учебный класс Вайлдханта"
10048040-86 = ""
10048040-87 = "Хм..."
10048040-88 = "Уже всё...?"
10048040-90 = "Ты в порядке, Миё?"
10048040-91 = ""
10048040-93 = ""
10048040-94 = "А, Хироми."
10048040-95 = ""
10048040-97 = ""
10048040-98 = ""
10048040-99 = "Ты выглядишь ещё уставшей, чем обычно."
10048040-100 = "Не выспалась?"
10048040-101 = "А... Как всегда проницательна. Да, я... занималась."
10048040-102 = "Но, эм, ты тоже выглядишь немного уставшей, Хироми."
10048040-103 = "А, да. Ассамблея сваливает на нас всё больше обязанностей... а людей больше не становится."
10048040-104 = "Точно, ты ведь заместитель капитана Префектурного совета..."
10048040-105 = "Что происходит...?"
10048040-106 = "Всё из-за этой выставки Вероники. Видела листовки?"
10048040-107 = "*вздрог*"
10048040-108 = "О, а-а, да... Это очень крупное событие..."
10048040-109 = "Экспонаты для выставки прибыли раньше срока, поэтому мы пока держим их в хранилище."
10048040-110 = "И, конечно же, Префектурный совет должен охранять его круглосуточно."
10048040-111 = "Ох, значит охрана там плотная и всесторонняя..."
10048040-112 = "Н-Наверное, тебе очень тяжело, Хироми..."
10048040-113 = "(Ох, прости меня, Хироми...! Ничего личного!)"
10048040-114 = "Какая ты добрая. Да, тяжело, но таков долг Совета, верно?"
10048040-115 = "Из-за всей этой дополнительной работы наш отдел по борьбе с мошенничеством буквально разрывается..."
10048040-116 = "...Хотя даже так они на этой неделе нашли кучу запрещённых предметов."
10048040-117 = "*вздрог*"
10048040-118 = "П-Понятно..."
10048040-119 = "Контрабандисты! В Вайлдханте! Хотя тебе этого не понять, Миё. У тебя такая безупречная репутация."
10048040-120 = "Наверное, поэтому рядом с тобой я так расслабляюсь."
10048040-121 = "Когда ты заместитель капитана Префектурного совета, почти каждый кажется подозреваемым."
10048040-122 = "Но только не ты, и это здорово! Готова поспорить, единственные преступления, о которых ты думаешь, — те, что происходят в твоих рассказах..."
10048040-123 = "(А-А-А-А, ПРОСТИ МЕНЯ...!)"
10048040-124 = "*вздыхает*..."
10048040-125 = "Ладно... Вот такая у меня жизнь."
10048040-126 = "Но, эм, Хироми?"
10048040-127 = "Хм?"
10048040-128 = "Ты... Это всё, что тебя беспокоит?"
10048040-129 = "..."
10048040-130 = "...Ты заметила?"
10048040-131 = "Эм, твой голос был немного более... подавленным, чем обычно."
10048040-132 = "Фу-фу..."
10048040-133 = "Писатели бывают такими наблюдательными..."
10048040-134 = "Ты права. Совет... столкнулся с необычной проблемой."
10048040-135 = "Посмотрите."
10048040-136 = "Конверт... Неброский, слегка кремового оттенка..."
10048040-137 = "Да. Художественный комитет Вероники получил его два дня назад."
10048040-138 = "Можешь прочитать."
10048040-139 = "А, если ты настаиваешь..."
10048040-140 = ""
10048040-142 = ""
10048040-144 = "[log]Улитки заплачут,[/log]"
10048040-145 = "[log]твёрдое небо смягчится,[/log]"
10048040-146 = "[log]лишь король улыбнётся.[/log]"
10048040-147 = "[log]Когда двери закроются и радуга сольётся воедино, в тот волшебный миг —[/log]"
10048040-149 = "[log]я явлюсь.[/log]"
10048040-151 = ""
10048040-152 = ""
10048040-153 = "Погоди. Э-Это же...!"
10048040-154 = "Есть..."
10048040-156 = "...Это визитная карточка Благородной воровки."
