[translation]
22220-1 = "Episódio 22;Pavana para uma Princesa (1)"
22220-4 = "Ah! Ali! Olha!"
22220-5 = "...Ela derrotou mesmo."
22220-6 = "Neru-senpai, você é incrível!"
22220-8 = "A Yuzu-chan também foi incrível! Foi tudo graças ao plano da Yuzu-chan!"
22220-9 = "E-Eu... n-não fiz nada de mais, sabe..."
22220-13 = "......"
22220-19 = "[ns] \"Neru...! Você está bem?!\""
22220-21 = "...Tô toda dormente."
22220-22 = "[s] \"...Hã?\""
22220-23 = "Meu corpo tá formigando... Não consigo me mexer..."
22220-24 = "Droga, não faz tanto barulho... tá ecoando na minha cabeça...#n...Tô bem, é só descansar um pouco que melhora."
22220-25 = "Aliás, cadê o pessoal do meu clube?"
22220-26 = "[s1] \"Estão todas bem. Acho que não vão conseguir se mexer por um tempo.\"\n[s2] \"Disseram pra gente subir na frente e pediram pra cuidar da Neru.\""
22220-27 = "...Entendi.#nHmpf, quem é que devia cuidar de quem aqui?"
22220-28 = "...Entendi.#nHmpf, quem é que devia cuidar de quem aqui?"
22220-29 = "...Ei, pirralhas."
22220-30 = "S-Sim?"
22220-31 = "A Akane, a Asuna, a Karin... e eu. Nós abrimos caminho até aqui."
22220-32 = "Agora só falta uma coisa, né?"
22220-33 = "Tragam ela de volta de qualquer jeito."
22220-39 = "Sim!"
22220-40 = "[s] \"Obrigado, Neru... Pessoal, vamos!\""
22220-42 = "Chegamos!"
22220-43 = "Então este é o último andar da torre central de Eridu..."
22220-44 = "(...Engole em seco)"
22220-46 = "Segundo o mapa, a Aris deve estar em algum lugar por aqui."
22220-51 = "Sim, a Aris está aqui."
22220-52 = "Presidente...!"
22220-53 = "...!"
22220-54 = "Ainda pretende lutar?!"
22220-56 = "Não. No momento em que a Toki caiu, todas as cartas que eu tinha na mão desapareceram."
22220-57 = "Eu admito... Foi minha derrota."
22220-58 = "[s] \"Rio...\""
22220-59 = "Vocês... realmente chegaram até aqui."
22220-60 = "Para salvar aquela garota que certamente se tornará uma ameaça para Kivotos em um futuro próximo..."
22220-61 = "Varrendo tudo o que se colocou no caminho..."
22220-62 = "É claro! A gente já tinha decidido isso desde o começo!"
22220-63 = "Mesmo que a Aris traga o fim de Kivotos?"
22220-64 = "Que papo é esse do nada?! Não fala assim da Aris!"
22220-65 = "Eu só..."
22220-66 = "[ns3] \"Não sei em que você se baseou para agir, Rio.\"\n[ns4] \"Mas tem uma coisa que posso dizer com clareza.\""
22220-69 = "[ns5] \"Você não consultou ninguém, julgou e concluiu tudo sozinha, Rio.\"\n[ns6] \"E impôs aos outros aquilo que você acreditava ser o certo.\""
22220-70 = "...!!"
22220-71 = "...!!"
22220-75 = "Sensei... Você também diz que as minhas ações foram arbitrárias...?"
22220-76 = "Mas... eu...!!"
22220-77 = "Eu..."
22220-78 = "Sensei, descobrimos onde a Aris está."
22220-79 = "No canto dessa sala deve haver uma instalação onde a energia está concentrada. A Aris está lá."
22220-80 = "Midori! Yuzu!"
22220-81 = "Sim, mana!"
22220-86 = "[ns] \"Rio, vamos continuar essa conversa depois.\""
22220-87 = "......"
22220-93 = "Aris! Desculpa a demora!"
22220-94 = "Aris-chan!"
22220-96 = "Aris-chan..."
22220-97 = "......"
22220-98 = "[ns] \"Aris...?\""
22220-102 = "O-O que está acontecendo?!"
22220-103 = "A-Aquele monitor ali...!"
22220-105 = "Isso é...!!"
22220-119 = "Ag-Agora... de repente... o qu... está...?!"
22220-121 = "A comunicação... tá..."
22220-123 = "...Pes...soal... respon...dam...?!"
22220-127 = "[ns] \"Chihiro...!\""
22220-128 = "Todo o sistema de Eridu está sendo... hackeado......"
22220-129 = "Não, isso não é um simples hack..."
22220-130 = "A cidade inteira está se transformando em \"alguma coisa\"?"
22220-131 = "Não é hora pra isso! Vamos tirar esses cabos logo e pegar a Aris...!"
22220-132 = "Essa ação não é recomendada."
22220-133 = "!!"
22220-136 = "Atualmente, a personalidade superficial da \"Princesa\" encontra-se isolada nas camadas profundas do banco de dados interno."
22220-137 = "Desconectar à força causará danos irreversíveis."
22220-138 = "Aris...?! O que está fazendo...?!"
22220-139 = "Mana, essa não é a Aris..."
22220-140 = "Aris...?"
22220-141 = "Esse é o nome pelo qual vocês chamam a nossa \"Princesa\"..."
22220-142 = "A \"Princesa\" não precisa de um nome.#nNomes corrompem o propósito e a essência da existência."
22220-143 = "Do que você está falando?! Ei, quem é você?! Devolve a Aris-chan!"
22220-145 = "Meu nome individual é <Key>."
22220-148 = "Sou a asceta deixada pelos Sacerdotes Sem Nome para auxiliar a Princesa,#ne a \"Chave\" <Key> que conduz ao trono onde ela será coroada."
22220-149 = "[s] \"...O quê?\""
22220-150 = "Ela é a \"Princesa\", e eu sou a \"Chave\".#nEssa é a nossa existência e o nosso propósito."
22220-151 = "Confirmado o cessar dos ataques que nos obstruíam."
22220-152 = "A partir deste momento, corrigiremos o erro e guiaremos a \"Princesa\" ao trono que lhe pertence por direito."
22220-154 = "Executando busca global para assegurar os recursos disponíveis conectados a AL-1S."
22220-156 = "Expandindo área de recursos."
22220-158 = "Nome do recurso: totalidade dos recursos da cidade-fortaleza \"Eridu\" — 10.000 exabytes de dados confirmados."
22220-159 = "...A partir deste instante, ativando o Protocolo ATRAHASIS."
22220-161 = "Iniciando o processo de ativação do codinome \"Arca de Atrahasis\"."
22220-163 = "...!!#nAtrahasis...?!"
22220-168 = "Invocando Divi:Sion para dar suporte ao processo."
22220-182 = "...Aparição de Divi:Sion por toda Eridu...?"
22220-183 = "[s] \"Rio... O que exatamente está acontecendo? E a Aris...?\""
22220-184 = "Não, isso não pode ser... Meus cálculos... Mas...!"
22220-185 = "Eu... construí esta cidade-fortaleza, Eridu,#ntemendo que o fim fosse trazido a Kivotos."
22220-186 = "Reuni aqui toda a tecnologia, poder, energia#ne recursos de Millennium que eu podia mobilizar..."
22220-187 = "E, no entanto... foi justamente por causa disso que... esta cidade se tornou..."
22220-188 = "O estopim do fim...?"
22220-189 = "Eu..."
22220-190 = "— Estava errada?"
22220-191 = "Recursos necessários para a construção da Arca assegurados: 23%......"
22220-192 = "...46%......"
22220-193 = "Sensei! Desse jeito...!"
22220-194 = "Se todos os recursos de Eridu forem tomados assim,#nserá o fim de Kivotos."
22220-195 = "Preciso tomar uma decisão...!"
22220-196 = "[s] \"...Uma decisão?\""
22220-199 = "A Princesa obteve a Chave, e a Arca foi preparada."
22220-200 = "Conforme o pedido dos Sacerdotes Sem Nome, ergueremos um novo \"Sanctum\" nesta terra."
22220-201 = "Somente com a sua chegada, todo o Mistério será arquivado —"
22220-202 = "Desse jeito, o mundo vai ser destruído...!!"
22220-206 = "Fuja junto com todo mundo, Sensei."
22220-207 = "[s] \"Fugir? Rio... o que você pretende fazer?\""
22220-208 = "A partir de agora, esta cidade vai se transformar e ser distorcida no novo conceito chamado Arca.#nSe isso acontecer... Kivotos..."
22220-209 = "A culpa é minha..."
22220-210 = "Se eu não tivesse construído esta cidade, nada disso teria acontecido desde o começo..."
22220-211 = "Eu... Por minha culpa..."
22220-212 = "Por isso, sou eu quem precisa impedir..."
22220-214 = "O-O que você quer dizer com isso...?"
22220-215 = "...Eu mesma vou parar o sistema sozinha."
22220-216 = "[s] \"...Rio.\""
22220-217 = "Se apenas a minha vida... for capaz de impedir o fim do mundo,#nentão é isso que eu farei — é o que eu devo fazer."
22220-218 = "...Rápido!! Esta é uma escolha extremamente lógica, Sensei!"
22220-226 = "[ns] \"A gente conversou sobre o dilema do bonde, não foi?\""
22220-228 = "[ns7] \"No dilema do bonde, só existem duas escolhas.\"\n[ns8] \"E você tentou escolher a que teria menos sacrifícios.\""
22220-229 = "Eu..."
22220-230 = "Eu..."
22220-231 = "[ns] \"...Essa é a sua gentileza, Rio.\""
22220-233 = "[ns] \"Mas se as duas escolhas só levam a um resultado em que alguém precisa ser sacrificado...\""
22220-235 = "[ns] \"Eu respondo que a própria pergunta está errada.\""
22220-236 = "Isso não é... uma resposta para o problema, Sensei. É apenas um sofisma."
22220-237 = "Negar as premissas de um experimento mental não passa de uma desculpa esfarrapada."
22220-238 = "[s] \"Será que quem puxa a alavanca não deixou passar alguma coisa?\""
22220-239 = "...?!"
22220-240 = "[s] \"Tipo, será que não havia mesmo ninguém por perto disposto a estender a mão?\""
22220-241 = "...?!"
22220-242 = "...73%......89%......"
22220-244 = "Recursos assegurados: 99%......"
22220-246 = "[ns] \"Eu quero escolher a opção de unir forças com todo mundo para \"salvar a todos\".\""
22220-247 = "N-Não existe uma escolha assim..."
22220-248 = "Noa! Agora!#nDerruba absolutamente toda a energia!"
22220-249 = "Siiim, Yuuka-chan.#nEu estava esperando por essas palavras♪"
22220-250 = "E... já!"
22220-256 = "Próximo;Pavana para uma Princesa (2)"
