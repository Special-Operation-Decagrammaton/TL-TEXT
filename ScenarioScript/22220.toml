22220-182 = "Divi:Sion появляется по всему Эриду...?"
22220-183 = "[s] «Рио... Что происходит? Алиса...»"
22220-184 = "Невозможно! Мои расчёты не могли быть неверными."
22220-185 = "Я создала Город-крепость Эрид, потому что боялась уничтожения Кивотоса."
22220-186 = "Здесь собраны все навыки, мощь, энергия и ресурсы Миллениум, которые я смогла мобилизовать..."
22220-187 = "Но вместо этого... этот город..."
22220-188 = "Этот город станет источником разрушения?!"
22220-189 = "Я..."
22220-190 = "Я ошибалась...?"
22220-191 = "«Получено 23% ресурсов, необходимых для постройки Ковчега...»"
22220-192 = "«...46%...»"
22220-193 = "Сенсей! Такими темпами...!"
22220-194 = "Если ему удастся получить все ресурсы Эрида, всё будет кончено."
22220-195 = "Мы... Мы должны принять решение!"
22220-196 = "[s] «Решение?»"
22220-199 = "Принцесса получила ключ, и Ковчег готов."
22220-200 = "По просьбе Безымянных жрецов на этой земле будет возведено новое святилище."
22220-201 = "С его прибытием все тайны впервые будут занесены в архив..."
22220-202 = "Если мы не остановим это сейчас, миру конец."
22220-203 = ""
22220-205 = ""
22220-206 = "Бегите отсюда вместе со всеми, Сенсей."
22220-207 = "[s] «Бежать? Что ты имеешь в виду...?»"
22220-208 = "Сам город исказится, преобразуясь в новую концепцию под названием Ковчег. А затем Кивотос..."
22220-209 = "Это моя вина..."
22220-210 = "Если бы я не стала жертвой собственной гордыни... Если бы не построила этот город..."
22220-211 = "Я... Я сделала это..."
22220-212 = "Значит, я должна это остановить..."
22220-214 = "Ч-Что ты имеешь в виду?"
22220-215 = "Я перегружу систему, чтобы остановить процесс."
22220-216 = "[s] «...Рио.»"
22220-217 = "Моя жизнь ничего не значит перед выживанием всего мира! Я обязана!"
22220-218 = "...Скорее! Это единственный логичный выбор, Сенсей!"
