22220-56 = "Теперь, когда Токи выведена из строя, у меня нет средств сопротивления."
22220-57 = "Я признаю поражение."
22220-58 = "[s] «Рио...»"
22220-59 = "Вы все... правда пришли сюда..."
22220-60 = "Проделали весь этот путь лишь ради того, чтобы спасти робота, угрожающего будущему Кивотоса..."
22220-61 = "Преодолели все препятствия на пути..."
22220-62 = "Конечно! Мы же сказали, что так и сделаем!"
22220-63 = "Даже если Алиса принесёт Кивотосу разрушение?"
22220-64 = "Ты просто не умеешь проигрывать! Не смей так говорить об Алисе!"
22220-65 = "У меня никогда не было злого умысла. Я лишь..."
22220-66 = "[ns3] «Не знаю, какой логикой ты оправдывала свои поступки, но...»\n[ns4] «...по крайней мере, одно я могу сказать уверенно.»"
22220-69 = "[ns5] «Ты одна всё оценивала и решала, не советуясь с другими.»\n[ns6] «Ты пыталась навязать нам то, что считала правильным.»"
