22220-127 = "[s] «Чихиро...!»"
22220-128 = "Вся система Эрида... взломана..."
22220-129 = "И это не обычный взлом..."
22220-130 = "Весь город меняет форму?!"
22220-131 = "Нужно что-то делать! Отсоединить кабели и забрать Алису...!"
22220-132 = "Я бы не рекомендовала этого."
22220-133 = "...!"
22220-136 = "В данный момент поверхностная личность принцессы изолирована в глубинах внутренней базы данных."
22220-137 = "Принудительное отключение причинит необратимый ущерб."
22220-138 = "Алиса...?! О чём ты говоришь? Ты буквально висишь на кабелях! Дай нам тебя снять!"
22220-139 = "Нет, Момои, это не Алиса..."
22220-140 = "Алиса...?"
22220-141 = "Да. Так вы называете нашу принцессу."
22220-142 = "Но принцессе имя не нужно. Оно мешает её предназначению и природе её существования."
22220-143 = "Что ты несёшь?! Ты кто?! Верни Алису!"
22220-145 = "Имя моего объекта — Кей."
22220-148 = "Я стажёр, оставленный Безымянными жрецами, помогавшими принцессе исполнять её обязанности. Я — ключ, соединяющий её с троном, который ей предстоит унаследовать."
22220-149 = "[s] «...Что?»"
22220-150 = "Она — принцесса, а моя роль — ключ. В этом причина и предназначение нашего существования."
22220-151 = "Подтверждено прекращение атаки, нарушавшей её обработку."
22220-152 = "Теперь я исправлю ошибки и проведу принцессу к трону, где ей надлежит быть."
22220-154 = "«Выполнить полный поиск доступных ресурсов, подключённых к AL-1S.»"
22220-156 = "«Расширение области доступных ресурсов.»"
22220-158 = "«Подтверждено имя ресурса: Город-крепость Эрид. Доступные информационные ресурсы: 10 000 эксабайт.»"
22220-159 = "«...С этого момента будет активирован протокол ATRAHASIS.»"
22220-161 = "«Инициализация процесса активации кодового имени Ark of Атрахасис.»"
22220-162 = ""
22220-163 = "...! Атрахасис...?!"
22220-164 = ""
22220-168 = "«Вызов последователей для поддержки процесса.»"
