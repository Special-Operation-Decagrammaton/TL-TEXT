[translation]
903-1 = "Тиферет, Искупитель красоты,#nЧтящий страдание"
903-2 = "Добро пожаловать, Сенсей. Я вас ждала."
903-3 = "У нас обоих нет лишнего времени, верно? Тогда сразу к делу."
903-4 = "Мы обнаружили странное сооружение в полярном регионе Кивотос."
903-5 = "Местность совершенно необитаема, и какой-либо транспортной инфраструктуры там нет."
903-6 = "Обычно подобное не заслуживало бы нашего внимания. Но, похоже, оттуда передаётся некий сигнал бедствия."
903-7 = "По результатам расследования мы считаем, что сооружение — «хранилище семян», давно построенное Федеральной академией Красная Зима."
903-8 = "Мы попытались связаться с академией, но официальный ответ был лишь: «Мы ничего об этом не знаем»."
903-9 = "...Что само по себе вызывает множество вопросов, но сначала нужно разобраться с текущей проблемой."
903-10 = "Ситуация кажется мне крайне подозрительной. Сигнал бедствия передаётся непрерывно."
903-11 = "Здание настолько изолировано, что к нему нет ни одного искусственного маршрута, а те, кто его построил, утверждают, будто ничего о нём не знают."
903-12 = "Невозможно представить, что... там кто-то есть, правда?"
903-13 = "Но если есть хотя бы малейшая вероятность... что кто-то потерялся и нуждается в срочном спасении... тогда..."
903-14 = "Однако ситуацию дополнительно усложняет то, что сигнал передаёт административный ИИ хранилища семян."
903-15 = "Он просит нас забрать хранящиеся семена, поскольку срок службы хранилища истёк."
903-16 = "И это тоже кажется мне подозрительным."
903-17 = "Для начала, шаблон сигнала бедствия устаревший — он использовался ещё до обновления системы."
903-18 = "Более того, в то время высокофункциональных ИИ-систем вообще не существовало."
903-19 = "Поэтому, как ни посмотри, ничего не сходится. Но в конце концов... само хранилище семян — ценный ресурс."
903-20 = "С его помощью можно обеспечить будущее почти исчезнувших или даже уже вымерших растений."
903-21 = "Отсюда наша просьба. Мы хотим, чтобы Шале исследовал хранилище семян."
903-22 = "Всё-таки я глава финансов. Моя обязанность — быть хорошо осведомлённой обо всех доступных ресурсах Кивотос."
903-23 = "Есть проблема: если моё расследование верно, технически хранилище семян всё ещё принадлежит Федеральной академии Красная Зима."
903-24 = "Но вопрос собственности вторичен. Мой приоритет — выявить и зарегистрировать все ресурсы Кивотос в максимально подробном виде."
903-25 = "Ах. На всякий случай вооружитесь для собственной безопасности во время расследования. Нам удалось перевести обрывки... странных сообщений в сигнале бедствия."
903-26 = "«Мой путь — „преданность, рождённая жертвой“, а мой титул — „Искупитель красоты, Чтящий страдание“», — вот что там говорилось."
903-27 = "Понятия не имею, что это значит. Возможно, ничего — просто последние слова человека, покинувшего хранилище."
903-28 = "...Или, хотя это трудно представить, административный ИИ мог развиться во что-то странное..."
903-29 = "Узнать можно только одним способом — исследовать."
903-30 = "Оставляю это вам, Сенсей."
903-31 = "Генеральный студенческий совет рассчитывает на ваши дальнейшие успехи — во многих смыслах."
