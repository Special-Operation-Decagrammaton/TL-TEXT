[translation]
80000077-1 = "Цветы и шоколад"
80000077-2 = "Цветочный сад Ацуко"
80000077-3 = "Здравствуйте! Доброе утро, Сенсей."
80000077-4 = "[s] «Доброе утро, Ацуко. Приветствия важны, правда?»"
80000077-5 = "Согласна! Я рада, что вы тоже так думаете, Сенсей."
80000077-6 = "О, хотите узнать, что происходит?"
80000077-7 = "Это..."
80000077-8 = "...секрет."
80000077-9 = "Ой, не переживайте, Сенсей. Я пошутила!"
80000077-10 = "Вот. Дам вам это в качестве извинения."
80000077-11 = ""
80000077-13 = ""
80000077-15 = "[ns] «О, это... валентиновский шоколад?»"
80000077-16 = "Хи-хи. Это тоже секрет!"
80000077-17 = "Чего ждёте? Попробуйте!"
80000077-18 = "По настоянию Ацуко я развернул шоколад."
80000077-19 = "Обёртка была немного небрежной, а сам шоколад выглядел чуть кривоватым."
80000077-20 = "[ns] «Ты что...»"
80000077-21 = "Я сама его сделала?"
80000077-22 = "Хи-хи. А что, если да?"
80000077-23 = "[s] «И где ты вообще его приготовила?»"
80000077-24 = "Где? Хм... Как думаете, что я отвечу?"
80000077-25 = "Это ещё один секрет!"
80000077-26 = "[s] «У тебя слишком много секретов...»"
80000077-27 = "Правда? Мои друзья всегда говорят мне..."
80000077-28 = "«Химэ полезно иметь секреты.»"
80000077-29 = "Забавно, правда? Ведь я больше не принцесса!"
80000077-30 = "[s] «Для меня ты всегда будешь Химэ!»"
80000077-31 = "Ага?"
80000077-32 = "Наверное... мне немного приятно это слышать."
80000077-33 = "Ну тогда! Это приказ принцессы."
80000077-34 = "Пожалуйста, съешьте шоколад!"
80000077-35 = "И этот цветок очень дорог мне, поэтому заботьтесь о нём, пока не опадут все лепестки."
80000077-36 = "[s] «А если я засушу его и сохраню навсегда?»"
80000077-37 = "Засушите? А это как?"
80000077-39 = "Я объяснил Ацуко, что цветок можно засушить под прессом и хранить его так долгое время."
80000077-41 = "Понятно... Я не знала, что так можно!"
80000077-42 = "[s] «Иначе цветы очень трудно сохранить.»"
80000077-43 = "Да... Понимаю."
80000077-44 = "Тогда, Сенсей, пожалуйста, берегите его."
80000077-45 = "Шоколад исчезнет, но цветок останется на память."
80000077-46 = "[s] «Теперь мне кажется, что и шоколад есть не стоит.»"
80000077-47 = "Ну, тогда возникнет проблема, Сенсей."
80000077-48 = "Проблема в том, что..."
80000077-49 = "Я хотела, чтобы мы вместе ели шоколад и смотрели на цветы, Сенсей."
80000077-50 = "[s] «Поэтому ты привела меня сюда?»"
80000077-51 = "Да. Я очень старалась над этим садом. Красиво, правда?"
80000077-52 = "...Думаете, у меня хорошо получилось?"
80000077-53 = "Ну... спасибо. Я надеялась, что вы это скажете."
80000077-55 = "Мы с Ацуко поделили шоколад и любовались цветочным садом."
