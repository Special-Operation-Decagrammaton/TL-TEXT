[translation]
10003110-1 = "Начинается тренировочный лагерь Дисциплинарного комитета!"
10003110-4 = "Быстрее! Эй, ты! Я всё ещё вижу твои ноги, прибавь темп!"
10003110-5 = "Х-Хорошо!"
10003110-6 = "П-Поняла!"
10003110-7 = "Отвечать только одним словом!"
10003110-8 = "*вздох* Эх..."
10003110-9 = "Как идут тренировки, Иори?"
10003110-10 = "О. Ако."
10003110-11 = "Нормально, наверное. Хотелось бы увеличить темп."
10003110-12 = "Кто знает, когда снова случится такой бой, как прошлый. Если будем настолько медленными, окажемся в беде."
10003110-13 = "Вот как? Тогда послушай, Иори."
10003110-14 = "Хм?"
10003110-15 = "Как остальные должны брать с тебя пример, если ты просто сидишь здесь и раздаёшь приказы?"
10003110-16 = "А?"
10003110-17 = "Поэтому я хочу, чтобы во время стрелковой практики ты лично показала пример. Ты не против, да?"
10003110-18 = "Ты хочешь, чтобы Я показывала пример?"
10003110-19 = "Да."
10003110-20 = "Я-я не знаю, Ако. Не думаю, что подхожу для этого..."
10003110-21 = "Ты ведь помнишь, что я вторая по командованию?"
10003110-22 = ""
10003110-23 = ""
10003110-25 = "Делай."
10003110-26 = "Ладно! Сделаю, хорошо? Ничего особенного."
