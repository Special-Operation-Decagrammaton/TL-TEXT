[translation]
31110-1 = "Эпизод 11;Генеральная уборка!"
31110-2 = "Начнём с сорняков вокруг здания!"
31110-3 = "И не забывайте пить воду. Тепловой удар — не шутка."
31110-4 = ""
31110-6 = ""
31110-8 = "Ладненько!"
31110-9 = "Вырывать сорняки? Это должно быть несложно."
31110-10 = "Поняла. Разумно убрать кусты вокруг лагеря, чтобы врагу негде было прятаться."
31110-11 = ""
31110-13 = ""
31110-15 = "Когда закончим с территорией вокруг зданий, перейдём к уборке внутри."
31110-16 = "За работу!"
31110-20 = "Мы вырвали все сорняки вокруг корпуса и убрали разбросанный мусор."
31110-22 = "Коридор общежития"
31110-23 = "Думаю, перед шваброй этот коридор стоит быстро подмести."
31110-24 = "Это одно из самых проходных мест здания, так что естественно, здесь быстро становится грязно. Придётся стараться, чтобы содержать его в чистоте!"
31110-25 = "Так точно."
31110-26 = "Когда закончим здесь, не против убрать душевые, туалет и прачечную?"
31110-27 = "Конечно. Сделаю."
31110-30 = "После этого коридор общежития подмели и вымыли."
31110-31 = "А следом — остальные помещения, которыми девочкам предстояло пользоваться."
31110-33 = "Вестибюль дополнительного корпуса"
31110-34 = "*кашель* *кашель* Здесь столько пыли."
31110-35 = "Ага. Здесь много мебели, неудивительно, что пыль быстро копится. Чтобы поддерживать чистоту, придётся убираться регулярно."
31110-36 = "Я это знаю! Я привыкла следить за такими комнатами в Комитете правосудия!"
31110-37 = "Надеть маску, пройтись метёлкой, а остальное вытереть шваброй! Я умею!"
31110-38 = "П-Прости. Ладно, оставлю это тебе, Кохару."
31110-41 = "Кохару принялась вычищать каждый уголок вестибюля."
31110-43 = "Это место..."
31110-44 = "Не переживай, Хифуми. Спальней займусь я."
31110-45 = "Мы будем проводить здесь много времени, так что ей нужна особая забота."
31110-46 = "Если постирать и развесить постельное бельё сейчас, к вечеру высохнет. А старые матрасы стоит заменить неиспользованными из других комнат."
31110-47 = "Поскольку мы здесь спим, вентиляция тоже крайне важна."
31110-48 = "Похоже, ты знаешь, что делаешь, так что спальню доверю тебе, Ханако."
31110-49 = "Хи-хи-хи. Конечно. ♥"
31110-53 = "Класс дополнительного корпуса"
31110-56 = "Спортзал дополнительного корпуса"
31110-59 = "Столовая"
31110-62 = "[ns] «Думаю, почти всё.»"
31110-63 = "Ага, закончили! Всё сияет чистотой, и сразу стало намного приятнее."
31110-64 = "Да. Согласна."
31110-65 = "Я тоже. Спасибо всем за помощь!"
31110-66 = ""
31110-68 = ""
31110-69 = "Погоди, Хифуми. Кажется, одно место мы всё-таки пропустили."
31110-70 = "Что? Где?"
31110-71 = "Открытый бассейн."
31110-72 = "О-Ой. Точно..."
31110-75 = "Это место..."
31110-76 = "...довольно большое. Мне даже в голову не приходило, что бассейн понадобится для наших дополнительных занятий."
31110-77 = "Потому что он не понадобится! Зачем нам чистить то, чем мы вообще не будем пользоваться?!"
31110-78 = ""
31110-80 = ""
31110-81 = "Уверена? Даже если он нам не нужен, всё равно приятно видеть бассейн правильно наполненным водой."
31110-82 = "Представь: лагерь блестит от полного бассейна, девочки бегают и играют вокруг..."
31110-83 = ""
31110-85 = ""
31110-86 = ""
31110-87 = "Разве одна эта картина не поднимет нам настроение?"
31110-88 = "Ч-Что ты несёшь?! Какие девочки?! Это вообще не имеет смысла!"
31110-89 = "Нет, я вроде понимаю. Смотреть на сухой заброшенный бассейн как-то неправильно..."
31110-90 = "Такой бассейн строили не для того, чтобы он стоял пустым. Когда-то он был наполнен водой и смехом людей, которые наслаждались этим местом."
31110-91 = "Но такой конец был неизбежен. Vanitas vanitatum. Такова истина мира."
31110-92 = ""
31110-94 = ""
31110-95 = "Эм... ага."
31110-96 = "Vanitas vanitatum. Это выражение означает «суета сует» — иными словами, всё тщетно. Есть такое древнее мудрое изречение..."
31110-97 = "..."
31110-98 = "Слушайте, Азуса! И вы, Хифуми и Кохару!"
31110-99 = ""
31110-101 = ""
31110-103 = "Мы будем плавать и играть в воде вместе!"
31110-104 = "П-Плавать?! В какой воде?!"
31110-105 = "Очевидно, мы почистим бассейн, наполним его и прыгнем туда!"
31110-106 = "Учиться можно начать завтра, правда? Сегодня мы и так хорошо поработали, давайте немного отдохнём."
31110-107 = "Если будем только учиться без остановки, быстро выгорим!"
31110-108 = "Ну же, девушки! Пора чистить бассейн. Идите переоденьтесь и приготовьтесь промокнуть!"
31110-109 = "Да. Даже если всё тщетно, это не повод не жить изо всех сил."
31110-110 = "Я на всякий случай взяла купальник. Скоро вернусь."
31110-111 = ""
31110-113 = ""
31110-115 = "Азуса! Уже ушла... Великолепно."
31110-116 = "Ну, чего стоишь! Ты тоже, Кохару. Иди за ней и переоденься. Купальник или что угодно. Как я сказала, главное — будь готова промокнуть."
31110-117 = "[s] «Мне очень не нравится, как ты постоянно это говоришь...»"
31110-118 = "Ладно. Но только потому, что неправильно оставлять единственным неубранным местом бассейн."
31110-119 = "Мы правда это делаем?! Это вообще не относится к дополнительным занятиям. Ух."
31110-120 = "Не будь такой, Кохару. ♥"
31110-121 = ""
31110-123 = ""
31110-124 = ""
31110-125 = ""
31110-127 = "Д-Да ладно уже! Просто не лезь в моё личное пространство!!!"
31110-129 = "..."
31110-130 = "..."
31110-131 = "..."
31110-132 = ""
31110-134 = ""
31110-135 = "Мне нравится! Вы все сделали именно как я просила. ♥"
31110-136 = "Да. Я готова к водным процедурам."
31110-137 = "Мы просто надели школьные купальники. Для чистки бассейна это вполне обычно..."
31110-138 = "Отлично! Все готовы хорошенько испачкаться? ♥"
31110-139 = ""
31110-141 = ""
31110-142 = "Погоди-ка!"
31110-143 = "Что такое, Кохару?"
31110-144 = "Почему ты единственная всё ещё в школьной форме?! Ты же сказала переодеться во что-то, что не жалко намочить!"
31110-145 = "Да. Не вижу противоречия."
31110-146 = "Что ты несёшь?! Ты всё ещё в форме! Почему ИМЕННО сейчас ты решила не надевать этот дурацкий купальник, который постоянно таскаешь?!"
31110-147 = "Хм. Сложно ответить. Людям нравятся разные вещи. Можно сказать, это моё... предпочтение."
31110-148 = "Предпочтение...?"
31110-149 = "Как думаешь, в чём приятнее промокнуть: в купальнике или школьной форме?"
31110-150 = "Что значит «приятнее»?! И кому?!"
31110-151 = "Я просто дразню тебя. Под формой у меня купальник. Бикини, купленное на карманные деньги."
31110-152 = "А? Правда...?"
31110-153 = "Не помнишь? Раньше ты запретила мне носить школьный купальник, но я решила, что личный — это лазейка."
31110-154 = "К тому же школьный сейчас в стирке, так что другого нет. Закроешь на это глаза?"
31110-155 = "П-Почему ты спрашиваешь меня? Делай что хочешь..."
31110-156 = ""
31110-157 = "Хи-хи. Ну что, все готовы?"
31110-158 = "За уборку!"
31110-171 = "Смотрите! Я могу сделать радугу из шланга!"
31110-172 = "О-Ого! Эй, холодно!"
31110-173 = "Потому что эта вода идёт прямо из озера рядом с Тринити. Наверное, её даже пить можно!"
31110-174 = "И зачем мы вообще это делаем...?"
31110-175 = "Этот участок почти закончен. Скоро двигаюсь дальше."
31110-177 = "Все закончили чистить бассейн и вскоре начали наполнять его водой."
31110-178 = "Это заняло больше времени, чем ожидалось, и к моменту завершения солнце уже село."
31110-180 = "Следующий эпизод;Первая ночь в учебном лагере"
