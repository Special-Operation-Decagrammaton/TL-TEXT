[translation]
31110-1 = "Episódio 11;Grande Faxina!"
31110-2 = "Muito bem, vamos começar arrancando o mato ao redor do prédio!"
31110-3 = "O sol está bem forte hoje, então tomem cuidado com a insolação, tá?"
31110-8 = "Siiim♪"
31110-9 = "Arrancar... mato... B-Bom, tanto faz..."
31110-10 = "Entendo. De fato, faz todo sentido começar eliminando os pontos ao redor da base principal onde o inimigo poderia se esconder."
31110-15 = "Hum... E-Enfim, depois que dermos um jeito nos arredores do prédio, vamos seguir a ordem e limpar um cômodo de cada vez, por favor!"
31110-16 = "Vamos lá, mãos à obra!"
31110-20 = "Arrancamos todo o mato ao redor do alojamento do acampamento e recolhemos as tralhas que estavam largadas por lá."
31110-22 = "Área Residencial - Corredor"
31110-23 = "Aqui parece melhor varrer a poeira primeiro e depois passar o esfregão."
31110-24 = "Como é um lugar que acumula muita poeira, talvez uma vez só não seja suficiente, mas..."
31110-25 = "Tudo bem, sem problemas."
31110-26 = "Azusa-chan, quando terminar este corredor, você poderia cuidar da área dos chuveiros e dos banheiros?"
31110-27 = "Sim, entendido. Deixe comigo."
31110-30 = "Varrendo e passando pano várias vezes..."
31110-31 = "Começamos a limpar os outros lugares também, um por um."
31110-33 = "Alojamento do Acampamento - Saguão"
31110-34 = "Cof, cof...! Que lugar é esse, quanta poeira..."
31110-35 = "Pois é, talvez seja porque tem muitos móveis... Hum, então aqui também vamos varrer a poeira e—"
31110-36 = "E-Eu sei muito bem como se limpa! Faço isso o tempo todo no Comitê de Justiça!"
31110-37 = "É só colocar uma máscara, tirar o pó e depois passar um pano úmido, né?! Não me subestime!"
31110-38 = "E-Eu não tive a intenção de te subestimar...? Então vou deixar este lugar com você, Koharu-chan!"
31110-41 = "A poeira do saguão foi varrida num instante, e os móveis também ficaram limpinhos."
31110-43 = "Hum, e aqui..."
31110-44 = "Hifumi-chan, pode deixar este quarto comigo."
31110-45 = "É um lugar que vamos usar bastante de agora em diante, então precisamos deixá-lo bem limpinho, não é?"
31110-46 = "Se lavarmos e estendermos as roupas de cama agora, elas já devem secar à tarde..."
31110-47 = "Como também havia colchões nos outros quartos, vou trocar os que parecerem velhos... e depois ventilar o ambiente..."
31110-48 = "Nossa, você entende mesmo do assunto! Então conto com você, Hanako-chan."
31110-49 = "Ufufu, pode deixar♡"
31110-53 = "Alojamento do Acampamento - Sala de Aula"
31110-56 = "Alojamento do Acampamento - Ginásio"
31110-59 = "Alojamento do Acampamento - Cozinha Compacta e Refeitório"
31110-62 = "[ns] \"Acho que é isso...?\""
31110-63 = "Não ficou ótimo? Sinto que ficou bem mais limpo. É, dá uma sensação muito boa."
31110-64 = "...Sim, nada mal."
31110-65 = "Verdade, bom trabalho a todos!"
31110-69 = "Ah, ainda falta um único lugar, sabia?"
31110-70 = "Ué, falta mesmo...?"
31110-71 = "Sim, a piscina externa♡"
31110-72 = "P-Piscina...? Ah, agora que você falou, antes..."
31110-75 = "Isso é..."
31110-76 = "É bem grande, por onde será que devemos começar...? Não, para começo de conversa, não deveria haver natação nas matérias das aulas de reforço, certo?"
31110-77 = "Se não tem nada a ver com a prova, pode ficar assim mesmo. Precisa mesmo limpar?"
31110-81 = "Ora, pense bem, Koharu-chan."
31110-82 = "Uma piscina cheia de água brilhante, um acampamento divertido, alunas brincando e se divertindo..."
31110-87 = "...Só de pensar já não começa a ficar divertido?"
31110-88 = "...?! Hã, o quê?! Não entendi, você tá falando de alguma coisa avançada demais pra eu entender?!"
31110-89 = "Mas é verdade que, olhando para uma piscina abandonada assim... dá uma sensação meio triste, né?"
31110-90 = "Com esse tamanho todo, com certeza houve uma época em que ela era usada. Talvez originalmente fosse um lugar onde ecoavam vozes animadas."
31110-91 = "Mesmo assim, acabou mudando desse jeito. \"Vanitas vanitatum\"... Essa é a verdade deste mundo."
31110-95 = "Hum...?"
31110-96 = "É um ditado antigo, não é? \"Tudo é vaidade\"... Realmente, talvez seja verdade."
31110-97 = "..."
31110-98 = "...Azusa-chan, Hifumi-chan, Koharu-chan!"
31110-103 = "Vamos brincar agora mesmo!"
31110-104 = "H-Hããã?!"
31110-105 = "Vamos limpar agora, encher a piscina de água e pular todas juntas!"
31110-106 = "A partir de amanhã vamos ter que nos esforçar e estudar sem parar, então hoje pode ser a nossa última chance, não acham?"
31110-107 = "Temos que aproveitar para nos divertir aqui enquanto é tempo! Mais para o meio do acampamento, podemos acabar ficando cansadas por causa de várias outras coisas...!"
31110-108 = "Vamos, vamos, vão logo colocar roupas que possam molhar! Vamos começar a limpar a piscina!"
31110-109 = "...Sim. Mesmo que tudo seja em vão, isso não é motivo para não darmos o nosso melhor hoje."
31110-110 = "Sem problemas, eu também trouxe um maiô direitinho. Me esperem."
31110-115 = "A-Azusa-chan?! Que rápida...?!"
31110-116 = "Vamos, Hifumi-chan também! Koharu-chan, vá logo colocar um maiô... quer dizer, qualquer roupa que possa molhar!"
31110-117 = "[s] \"O olhar da Hanako está meio assustador...\""
31110-118 = "Hum, mas realmente dá uma agonia deixar só este lugar sem limpar... Eu também vou me trocar!"
31110-119 = "H-Hããã?! Isso não tem nada a ver com as aulas de reforço... Uuu, por quê...?"
31110-120 = "Fufu, Koharu-chan♡"
31110-127 = "T-Tá bom! Já entendi!! Não se aproxime em silêncio desse jeito!"
31110-129 = "..."
31110-130 = "..."
31110-131 = "..."
31110-135 = "Pronto, agora não tem problema nenhum ficarmos todas encharcadas, não é?♡"
31110-136 = "Sim, sem problemas."
31110-137 = "B-Bom, pelo menos..."
31110-138 = "Então, vamos começar a limpeza todas juntas?"
31110-142 = "Espera, espera, espera!!"
31110-143 = "Koharu-chan? Aconteceu alguma coisa?"
31110-144 = "Na hora da faxina você tava de maiô, por que agora tá de uniforme escolar?! Você é idiota mesmo?! Não foi você que disse para colocar \"roupas que possam molhar\"?!"
31110-145 = "Mas esta é uma \"roupa que pode molhar\", sabia?"
31110-146 = "Eu já não entendo mais nada do que você diz! Tem certeza de que tudo bem molhar o uniforme?!"
31110-147 = "Koharu-chan, isso pode ser uma questão da estética de cada um, mas..."
31110-148 = "Hã, estética...?"
31110-149 = "Entre um maiô e um uniforme escolar, qual dos dois você acha que fica \"mais interessante\" quando está molhado?"
31110-150 = "H-Hãã?! Como assim \"mais interessante\"?! Do que você tá falando?!"
31110-151 = "Fufu, bom, é metade brincadeira. Olhe só, na verdade estou usando por baixo. Um biquíni que comprei com a minha mesada♡"
31110-152 = "Hã, hã...?"
31110-153 = "Ainda há pouco a Koharu-chan me disse que eu estava \"proibida de usar maiô\", e é verdade que na escola o maiô escolar é o clássico, mas... você não poderia me perdoar por hoje com este aqui?"
31110-154 = "O meu maiô escolar está lavando agora, então se este também for proibido, eu vou ter que ficar sem nada por baixo..."
31110-155 = "P-Por que você tá jogando essa decisão pra cima de mim...?! F-Faça o que quiser, ué...?!"
31110-157 = "Ufufu, então está combinado♪"
31110-158 = "Agora sim, vamos começar a limpeza!"
31110-171 = "Olhem só, é um arco-íris! Um arco-íris!"
31110-172 = "Kyaa?! E-Ei, Hanako-chan, está gelada!"
31110-173 = "Fufu, parece que essa água vem direto do lago da Trinity, então pode até abrir a boca e beber direto que não tem problema, viu?"
31110-174 = "C-Como as coisas foram acabar assim...?"
31110-175 = "Este setor foi concluído. Prosseguindo imediatamente para a sua posição."
31110-177 = "Assim, depois que todas terminaram a limpeza, começamos a encher a piscina de água, porém..."
31110-178 = "Demorou muito mais do que imaginávamos e, quando a piscina finalmente encheu, o sol já havia se posto."
31110-180 = "Próximo;A Primeira Noite do Acampamento"
