10012045-38 = "..."
10012045-39 = "Иногда нужно уметь признать поражение."
10012045-40 = "...?!"
10012045-41 = "Мы никак не сможем победить!"
10012045-43 = "Должно быть, вы ошибаетесь. Как это может быть всей вашей силой?"
10012045-44 = "У вас ведь ещё кое-что осталось, разве нет?"
10012045-45 = "Что-то большое..."
10012045-46 = ""
10012045-48 = ""
10012045-49 = "И очевидное..."
10012045-51 = "Ты опять несёшь какую-то чушь?!"
10012045-52 = "Что-то большое и очевидное?"
10012045-53 = "...! Не может быть!"
10012045-54 = "Нет! Мы ведь именно на этом сюда и прибыли!"
10012045-55 = "Капитан! Сделайте что-нибудь! Она же разнесёт наш корабль!"
10012045-57 = "Этот корабль — наш дом."
10012045-58 = "Мне плевать, кто ты такая! Я не позволю тебе прикоснуться к нему ни одним пальцем!"
10012045-59 = ""
10012045-62 = ""
10012045-64 = "И-и-ик!"
10012045-65 = "О-Она вырубила капитана одним ударом!"
10012045-67 = "Хи-хи."
10012045-68 = "Хи-хи-хи! Глупые идиотки..."
10012045-69 = "Я не спрашивала разрешения."
10012045-70 = "Не заставляйте меня повторяться."
10012045-71 = "Начинайте подготовку к переоборудованию его для боя."
