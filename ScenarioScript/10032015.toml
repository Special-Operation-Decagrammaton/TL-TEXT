[translation]
10032015-3 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
10032015-4 = "В этот раз всё прошло в миллион раз легче, чем в первый!"
10032015-5 = "Вы привели нас прямо к победе, Сенсей! Может, всё будет не так уж плохо."
10032015-7 = "Нет, всё определённо плохо, Муцуки."
10032015-8 = "Это едва ли можно назвать победой. Скорее началом войны."
10032015-9 = "На самом деле, с точки зрения босса, это может быть худший сценарий."
10032015-10 = ""
10032015-12 = ""
10032015-13 = "...Я права, Сенсей?"
10032015-14 = "[s1] «Можно сказать и так.»\n[s2] «А теперь вы ничего не утаите.»"
10032015-17 = ""
10032015-18 = ""
10032015-19 = "О-о, Сенсей сейчас даже немного страшный. Заставите нас стоять с поднятыми руками и размышлять над поведением?"
10032015-20 = "Проститепроститепроститепроститепростите..."
10032015-21 = "Что делаем, босс? Как будем объясняться?"
10032015-22 = "Я могу рассказать, если хочешь."
10032015-23 = ""
10032015-24 = ""
10032015-25 = ""
10032015-26 = "...Нет."
10032015-27 = "Абсолютно неверно. Твоя точка зрения максимально далека от настоящей крутизны, Каёко."
10032015-28 = "Мы не собираемся «объясняться» или заниматься другой подобной чепухой."
10032015-29 = "Мы Решалы 68! Мы никому не обязаны отвечать, особенно когда всё делали ради выполнения задания!"
10032015-30 = "Самоанализ? Извинения и объяснения? Это не про нас."
10032015-31 = ""
10032015-33 = ""
10032015-34 = "Ну..."
10032015-35 = "Полагаю, как босс этой компании, я обязана извиниться за наши проступки. Простите за небольшое неудобство и за то, что мы получили совсем крошечную помощь от нашего консультанта."
10032015-36 = "Учитывая, что вы один из наших ценных деловых партнёров..."
10032015-37 = "Я посвящу вас в детали задания — в знак доброй воли."
10032015-38 = "Но знайте: как только присягнёте, пути назад не будет, пока мы не закончим."
10032015-39 = "...Вы принимаете условия, Сенсей?"
10032015-40 = "[s3] «Хотя бы пока.»\n[s4] «Да, но теперь выкладывай всё.»"
10032015-43 = "*вздыхает*"
10032015-44 = "Надеюсь, вы готовы к этому, Сенсей."
10032015-45 = ""
10032015-47 = ""
10032015-48 = "Мы получили заказ от большой шишки. Одного из самых громких имён преступного мира."
10032015-49 = "Работа настолько опасная, что они знали: справится только Решалы 68."
10032015-50 = "Для Решал 68..."
10032015-52 = "Это задание станет фундаментом нашего сурового будущего."
