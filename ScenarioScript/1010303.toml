[translation]
1010303-1 = "Красота тишины"
1010303-2 = "Вот вы где, Сенсей. Сюда!"
1010303-3 = "[s] «Прости, что опоздал, Марина!»"
1010303-4 = "Ничего страшного. Я не против."
1010303-5 = "Продолжим экскурсию по Шаньхайцзину?"
1010303-7 = "Смотри, вон она! Я ведь права, да?"
1010303-8 = "Ещё как! Вау. Глаз не отвести."
1010303-10 = "Эм..."
1010303-11 = "[s] «Что-то здесь кажется странным.»"
1010303-12 = "Я думала, это только мне кажется... Вы тоже заметили, Сенсей?"
1010303-13 = "Пока я ждала вас, на меня постоянно смотрели..."
1010303-15 = "Никогда раньше её здесь не видела. У неё такая суровая... почти линчевательская притягательность?"
1010303-16 = "Короткие волосы отлично подчёркивают её стройную фигуру!"
1010303-17 = "Нас всегда учили, что классическая красота — это длинные тёмные волосы. А виски должны быть тонкими, словно крылья цикады."
1010303-18 = "Но она... одним своим существованием задаёт совершенно новый стандарт, о котором я даже не могла представить."
1010303-20 = "Может, я ошибаюсь, но мне кажется, после вашего появления взгляды стали ещё настойчивее..."
1010303-21 = "С-Сенсей, вы понимаете, что здесь происходит?"
1010303-22 = "[s] «Кажется, начинаю понимать...»"
1010303-23 = "Вот как..."
1010303-25 = "Похоже, она впервые носит традиционную одежду Шаньхайцзина."
1010303-26 = "Но выглядит на ней очень естественно! Хотя видно, что ей не совсем удобно..."
1010303-28 = "...и именно эта неловкость только усиливает её очарование."
1010303-29 = "Вау. Как здорово. Честно говоря, я немного завидую."
1010303-31 = "...Может, пока перейдём в другое место."
1010303-32 = "Тоже так думаете? Хорошо. Тогда пойдём."
1010303-33 = "...Ещё немного здесь — и я взорвусь от смущения."
1010303-34 = "Стойте! Вы двое, стойте!"
1010303-35 = "[s] «Эм... Вы кто?»"
1010303-36 = ""
1010303-38 = ""
1010303-39 = "Я просто проходящий мимо фотограф! Мне обязательно нужно поговорить со студенткой рядом с вами!"
1010303-40 = "Эм... со мной?"
1010303-41 = "Да! Когда я вижу что-то прекрасное, меня охватывает художественный порыв увековечить это!"
1010303-42 = "Сейчас я путешествую по Кивотосу и собираю портфолио изысканных пейзажей и захватывающих дух людей."
1010303-43 = "А, сначала я должен узнать ваше имя! Для названия альбома!"
1010303-44 = "Моё имя? Икекура Марина."
1010303-45 = "Марина! Вау! Большое спасибо. Ну что скажете? Станете моей моделью?"
1010303-47 = "Ч-Ч-Что?!"
1010303-48 = "Я некоторое время наблюдал за вами. Ваше выражение лица... задумчивая тоска человека, ожидающего своего спутника!"
1010303-49 = "Это напомнило мне древнюю историю Шаньхайцзина, воспевающую прекрасных муз прошлого!"
1010303-50 = "Д-Древнюю историю?"
1010303-51 = "Да! В Шаньхайцзине есть старое выражение: луна прячется, а цветы вянут от стыда."
1010303-52 = "Оно происходит из истории о красавице настолько исключительной, что даже луна поняла, что не может с ней сравниться, и скрылась, увидев её!"
1010303-53 = "Затем она пришла в сад и протянула руку к цветам..."
1010303-54 = "...но те отвернулись, стыдясь своей бледности рядом с её великолепием!"
1010303-55 = "...Я вообще не понимаю, о чём вы говорите!"
1010303-56 = "Когда я увидел вас, Марина, я сразу подумал, что ваша красота не уступает той героине!"
1010303-57 = "Вы явно обратились не к тому человеку! Я-я, пожалуй, откажусь!"
1010303-58 = "Хм... а если договоримся? Если вы попозируете мне, я отдам вам этот альбом с пандами, полный фотографий, которые я сделал в Шаньхайцзине!"
1010303-59 = "А-А-Альбом с пандами?! Я не знала, что такое вообще существует!"
1010303-61 = "Разве это не хорошая сделка? Фотографии в обмен на фотографии! Ну как?"
1010303-62 = "Ч-Что мне делать, Сенсей?!"
1010303-63 = "[s1] «Делай то, чего сама хочешь!»\n[s2] «Хотя я бы хотел увидеть твои модельные фотографии...»"
1010303-66 = "Ч-Ч-Что вы такое говорите, Сенсей!"
1010303-67 = "...Но... если этого хочет Сенсей...."
1010303-68 = "И я смогу получить альбом с пандами... панда... панда...!"
1010303-69 = "Га-а-а! Ладно! Я справлюсь! Давайте!"
1010303-70 = "Я не могу отступить перед такой мелочью, как фотосессия! Иначе я больше никогда не смогу с гордостью носить звание председателя службы безопасности Красной Зимы!"
1010303-71 = "Прекрасно! Отличное решение! Тогда сюда!"
1010303-74 = "― [log=마리나 치파오]В-Вот так?[/log][wa:1110]"
1010303-76 = "― [log=마리나 치파오]А? Поставить ноги шире...? И руки тоже...?[/log][wa:2230]"
1010303-79 = "― [log=마리나 치파오]У-Уф... Я совсем к этому не привыкла...[/log][wa:2960]"
1010303-82 = "― [log=마리나 치파오]Эй... Сенсей...[/log][wa:2230]"
1010303-84 = "― [log=마리나 치파오]Как я сейчас выгляжу...?[/log][wa:1260]"
1010303-87 = "― [log=마리나 치파오]*вздыхает*... [/log][wa:10]"
1010303-89 = "― [log=마리나 치파오]Я очаровательная... просто по-другому, чем обычно...?[/log][wa:570]"
1010303-92 = "― [log=마리나 치파오]Д-Дурак! Не говорите того, чего не думаете![/log][wa:930]"
1010303-95 = "― [log=마리나 치파오]...Правда? В-Вы действительно так думаете...?[/log][wa:1320]"
1010303-98 = "― [log=마리나 치파오]Вы ждёте не дождётесь увидеть фотографии...? [/log][wa:10]"
1010303-101 = "― [log=마리나 치파오]Га...![/log][wa:280]"
1010303-103 = "― [log=마리나 치파오]Вы сегодня всё время меня дразните... Сенсей... [/log][wa:2020]"
1010303-106 = "Вы отлично справились! Прекрасная работа!"
1010303-107 = "..."
1010303-108 = "А, ещё сейчас принято добавлять под фотографией небольшую подпись. Можете рассказать, о чём думали во время съёмки? Хотя подождите, кажется, я и так знаю!"
1010303-109 = "Наверняка вы восхищались собственной красотой — настолько смертоносной, что из-за неё может пасть целая страна!"
1010303-110 = "Скорее... о том, что буду есть на обед?"
1010303-111 = ""
1010303-113 = ""
1010303-114 = "...Такое я использовать не могу. Это определённо убило всю её загадочность..."
1010303-116 = "Так первая фотосессия Марины прошла без проблем."
1010303-117 = "Кроме того, альбом с фотографиями Марины обрёл культовую популярность. В итоге фотограф распродал все экземпляры."
