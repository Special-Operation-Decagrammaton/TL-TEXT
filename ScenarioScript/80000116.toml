[translation]
80000116-1 = "Подарок, достойный класса"
80000116-2 = "Утром в День святого Валентина мне позвонила Макото."
80000116-3 = ""
80000116-7 = "Ки-хе-хе. Сегодня День святого Валентина..."
80000116-8 = "Особый день, когда друзья, пары, знакомые... люди, связанные бесчисленными отношениями, обмениваются шоколадом, доказывая друг другу искренность."
80000116-9 = "Некоторые клевещут, будто это всего лишь схема кондитерских корпораций для заработка..."
80000116-10 = "Ки-хе-хе-хе! Но что значат такие жалобы перед течением времени? Перед мимолётным развлечением? Отрицать настолько забавное событие — удел скучных людей!"
80000116-11 = "Лидер, достойный своего звания, должен уметь праздновать вместе с теми, кто празднует!"
80000116-12 = "В конце концов, именно поэтому Общество Пандемониума каждый год раздаёт шоколад по всей Геенне."
80000116-13 = "Кстати, сегодня вы свободны, Сенсей?"
80000116-14 = "Я хотела бы одарить вас лучшим шоколадом, который вы когда-либо пробовали."
80000116-15 = "[s] «Да, на это я найду время.»"
80000116-16 = "Ки-хе-хе. Вот как? Радостно слышать."
80000116-17 = "Я сообщу, где получить подарок. Буду ждать, Сенсей!"
80000116-18 = ""
80000116-20 = ""
80000116-24 = "[ns] «Вот место, о котором говорила Макото...»"
80000116-25 = ""
80000116-28 = ""
80000116-29 = "Ки-хе-хе. Значит, вы пришли, Сенсей."
80000116-30 = "[s1] «Привет, Макото... Почему ты в платье?»\n[s2] «И почему мы в банкетном зале?»"
80000116-33 = "Я всё это подготовила для вас, Сенсей."
80000116-34 = "Хм? Что именно подготовила?"
80000116-35 = "Ки-хе-хе. Лучше один раз увидеть, чем сто раз услышать."
80000116-36 = "Конечно же, это приготовления ко Дню святого Валентина!"
80000116-37 = "Большинство сегодня просто дарят шоколад тем, кто им дорог... Но я задумала нечто иное."
80000116-38 = "Да, это валентиновская традиция, но просто раздать шоколадки и разойтись..."
80000116-39 = "Разве это не скучно?!"
80000116-40 = "Кроме отсутствия развлечения, здесь нет ни неожиданности, ни размаха. И вообще это..."
80000116-41 = "Слишком мелко!"
80000116-42 = "[s] «...А если мне нравятся вещи поменьше масштабом?»"
80000116-43 = "Нет! Либо по-крупному, либо никак!"
80000116-44 = "Поэтому я задумалась. Какой валентиновский подарок превзойдёт ожидания и будет достоин Великой Макото?"
80000116-45 = "Какой подарок выбрать, чтобы выделиться среди всех остальных?!"
80000116-46 = "После долгих размышлений, раздумий, обдумываний и рассуждений─"
80000116-47 = "Ки-хе-хе! Я наконец нашла ответ!"
80000116-48 = "Да. Такому человеку моего уровня недостаточно просто вручить кусочек шоколада. Поэтому я использовала особый банкетный зал Геенны, чтобы подготовить..."
80000116-49 = "Валентиновское мероприятие только для Сенсея!"
80000116-50 = "[s] «Я правда благодарен за всё это, но это уже слишком!»"
80000116-51 = "Ки-хе-хе! Не нужно так скромничать."
80000116-52 = "Я ведь ещё даже не показала главное украшение этого валентиновского мероприятия... Смотрите!"
80000116-53 = ""
80000116-57 = "[ns] «Это шоколадный фонтан?»"
80000116-58 = "Да. Именно так."
80000116-59 = "Только Великая Макото могла преподнести вам подарок такого масштаба."
80000116-60 = "Ки-хе-хе... Ну как, Сенсей? Потрясены? Удивлены? В восторге?"
80000116-61 = "Это единственный шоколадный фонтан в Геенне... Нет! Во всём Кивотосе! Сделанный из лучшего какао Геенны!"
80000116-62 = "[s3] «...Д-да. Я очень удивлён. Совсем не ожидал такого.»\n[s4] «Мне следовало бы быть потрясённым, но это так на тебя похоже, Макото.»"
80000116-65 = "[ns] «Но я очень благодарен за подарок, который ты приготовила, Макото.»"
80000116-66 = "Хммм?!"
80000116-67 = "[s] «...А? Макото? Что случилось?»"
80000116-68 = "Ничего, просто... после этих слов... слева в груди как-то заболело..."
80000116-69 = "Ки-хе-хе. Понятно. Наверное, это..."
80000116-70 = "...шум в сердце! От усталости после подготовки этого валентиновского праздника!"
80000116-71 = "В любом случае, после таких мучительных трудов было бы преступлением не насладиться этим валентиновским подарком."
80000116-72 = "[s] «И что мне делать с шоколадным фонтаном?»"
80000116-73 = "Похоже, вы растерялись, Сенсей..."
80000116-74 = "Ки-хе-хе. Тогда позвольте показать, как правильно наслаждаться шоколадным фонтаном."
80000116-75 = ""
80000116-77 = ""
80000116-78 = ""
80000116-79 = "Возьмите любую закуску... А, да. Для новичка отлично подойдёт маршмэллоу."
80000116-80 = "Затем медленно окуните его в фонтан..."
80000116-81 = ""
80000116-85 = "...А?"
80000116-86 = "[s] «А! Макото! Осторожно!»"
80000116-87 = "Пва-а-а-а-а!!!"
80000116-88 = "Угхх?! Ч-Что?! Что происходит?!"
80000116-89 = "П-Подождите! Стойте!"
80000116-90 = ""
80000116-93 = "Пууууугх?!"
80000116-94 = ""
80000116-96 = ""
80000116-101 = "Что—? Машина вышла из-под контроля из-за перегрева батареи? Как?!"
80000116-102 = "Может, потому что я гоняла её пять часов на репетиции до прихода Сенсея?"
80000116-103 = "Или потому что я модернизировала машину, увеличив мощность на 500%, чтобы она выглядела ещё величественнее?!"
80000116-104 = "[s5] «Всё вышло из-под контроля, потому что ты сама неуправляема!»\n[s6] «Забудь об этом... Ты в порядке, Макото?!»"
80000116-107 = "Ки, ки-хе... Ки-хе..."
80000116-108 = "Пустяки."
80000116-109 = "Не надо поднимать шум из-за нескольких капель шоколада."
80000116-110 = "[s] «Я бы не назвал это несколькими каплями... Ты мокрая от головы до туфель.»"
80000116-111 = "Нет! Всё совершенно нормально! Великой Макото не проиграть какому-то шоколаду из фонтана!"
80000116-112 = "Более того, оказавшись вся в шоколаде, я кое-что поняла!"
80000116-113 = "[s] «И какое же?»"
80000116-114 = ""
80000116-116 = ""
80000116-117 = "Как и ожидалось от шоколадного фонтана, подготовленного мной..."
80000116-118 = "Я использовала лучший шоколад на рынке, поэтому он сладкий и вкусный!"
80000116-119 = "[s] «Вот это оптимизм! Тоже очень в твоём стиле, Макото!»"
80000116-120 = "Ну, пропадать добру нельзя. Вот, Сенсей из Шале."
80000116-121 = "Попробуйте слизать шоколад с моего пальца."
80000116-122 = "Мой палец не маршмэллоу, но шоколад от этого не станет менее сладким!"
80000116-123 = "Лизните мой указательный палец, Сенсей из Шале! Сейчас же!"
80000116-124 = "[s] «Эм... Я лучше по старинке!»"
80000116-125 = "...Хм? Вот как?"
80000116-126 = "Можно было и не отказывать так резко. Теперь в груди болит ещё сильнее..."
80000116-127 = "К счастью, День святого Валентина ещё не закончился!"
80000116-128 = "Шоколадный фонтан был лишь верхушкой айсберга. Главное событие начинается сейчас!"
80000116-129 = "Я переоденусь и вернусь, Сенсей!"
80000116-130 = "Ки-хе-хе-хе! Несмотря на эту мелкую неудачу... Я заставлю вас полностью насладиться особым валентиновским праздником, который подготовила сама Великая Макото!"
80000116-131 = "До самого ухода домой будет только День святого Валентина!"
80000116-132 = ""
80000116-135 = "[ns] «Ну... сезон всё-таки такой.»"
80000116-137 = "[ns] «Буду ждать всего, что ты подготовила.»"
80000116-138 = ""
80000116-140 = ""
80000116-142 = "Хотя остальные декорации тоже меня удивили, весь шоколад, приготовленный Макото, был вкусным. Я прекрасно провёл время."
