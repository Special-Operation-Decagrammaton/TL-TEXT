[translation]
51180-1 = "Эпизод 18;Уличные слухи 2"
51180-4 = "Я просто... хотела вернуться..."
51180-5 = "Я просто хотела вернуться в те времена, когда мы были вместе...!"
51180-7 = ""
51180-8 = "Ложь ради защиты другого всё равно остаётся ложью..."
51180-9 = "Что они тогда сказали? ...Всё, что я сделала, — причинила ей боль?"
51180-10 = "Мы размахиваем знаменем оправданий, твердя, что делали это ради неё."
51180-11 = "Но наша защита оказалась отравленным кинжалом..."
51180-12 = ""
51180-14 = ""
51180-15 = ""
51180-17 = "Нагуса..."
51180-18 = "Почему... Почему ты—"
51180-21 = ""
51180-22 = "Кто это?"
51180-23 = ""
51180-27 = ""
51180-28 = ""
51180-29 = "Сколько времени прошло, Кикё?"
51180-30 = "Н-Нагуса?!"
51180-31 = "Спустя столько времени ты—"
51180-32 = "Неважно. Прошу прощения. С возвращением."
51180-33 = "Исчезновение тебя и Аямэ стало причиной массового ухода членов Хяккарёран."
51180-34 = "Мы на грани того, чтобы потерять всё. Если бы ты поговорила с ними..."
51180-35 = ""
51180-37 = ""
51180-38 = ""
51180-39 = ""
51180-40 = "Не могу. Я пришла лишь затем, чтобы отдать тебе это, Кикё."
51180-41 = "Это передавалось от президента к президенту... Каковы твои намерения?"
51180-42 = ""
51180-44 = ""
51180-46 = "Всё просто. Твоя работа операционным офицером Хяккарёран принесла тебе и влияние, и уважение."
51180-47 = "Не только среди рядовых членов, но и у меня."
51180-48 = "Они искренне последуют за тобой. А ты поведёшь их твёрдой рукой."
51180-49 = "Таково моё намерение. Чтобы Кирю Кикё заняла должность президента Хяккарёран."
51180-50 = ""
51180-52 = ""
51180-55 = "Пожалуйста, возьми."
51180-56 = ""
51180-59 = ""
51180-60 = "Прошло два сезона... и с таким решением ты возвращаешься?"
51180-62 = "Я не вижу другого пути."
51180-63 = "Ты... Почему?!"
51180-64 = ""
51180-66 = ""
51180-68 = "Отсутствие Аямэ подобно чёрной дыре."
51180-69 = "Я не могу её заполнить. Мне это не под силу."
51180-70 = ""
51180-72 = ""
51180-73 = ""
51180-75 = "Когда ты ушла... моя обида... гнев и горечь..."
51180-76 = "Не из-за того, что ты не исполнила обязанности президента... Нет..."
51180-77 = ""
51180-81 = "Мы верили, будто именно ты повесила на небо луну и сами звёзды."
51180-82 = "Хяккарёран всегда был готов последовать за тобой. Твой путь был нашим путём."
51180-83 = "А потом ты исчезла."
51180-85 = "Аямэ? Кто вообще говорил об Аямэ?"
51180-86 = "Так легкомысленно относиться к нашему восхищению тобой..."
51180-87 = "Мы смотрели не на пустое место Аямэ. Мы искали тебя и только тебя, Нагуса."
51180-88 = ""
51180-90 = ""
51180-92 = "Я ошибалась? Мы все... ошибались?"
51180-94 = "Какой путь тогда был правильным? Неужели я просчиталась?"
51180-95 = ""
51180-98 = ""
51180-99 = "...Хаос опускается на Хяккияко."
51180-105 = "Мир был охвачен огнём, а последние посетители фестиваля бежали в безопасное место."
51180-106 = ""
51180-109 = ""
51180-111 = ""
51180-112 = ""
51180-113 = ""
51180-115 = "Уааааа!"
51180-116 = "Чудовищ так много! П-Помогите!"
51180-117 = ""
51180-121 = ""
51180-122 = ""
51180-124 = "Ты ранена?"
51180-126 = ""
51180-127 = "[ns] «Все эвакуируются туда, откуда мы пришли! Там будет безопасно!»"
51180-128 = "С-Спасибо вам огромное!"
51180-129 = ""
51180-131 = ""
51180-133 = ""
51180-135 = "Они не прекращаются."
51180-136 = "[s] «Там могут оставаться люди. Идём.»"
51180-137 = "Вы предлагаете бежать прямо к горящим зданиям?"
51180-138 = "Возможно, вы опять шутите..."
51180-139 = "Мне едва ли нужно объяснять вам, насколько тяжёлая здесь ситуация."
51180-140 = "Почему вы упорно бежите навстречу неизвестной опасности?"
51180-141 = "[s] «Ещё не все успели выбраться.»"
51180-142 = "Жизни безымянных жителей давят на вашу совесть? Они не ваша ответственность."
51180-143 = "Самосохранение — человеческая природа."
51180-144 = "Как вам удаётся так сознательно идти против собственных инстинктов?"
51180-145 = "[s1] «Безопасность каждого студента — моя ответственность.»\n[s2] «Я познакомился здесь, в Хяккияко, со многими хорошими людьми.»"
51180-149 = "[ns3] «Неважно, кто это.»\n[ns4] «Я не могу проигнорировать того, кому нужна помощь.»"
51180-152 = "Эти идеалистичные ответы—"
51180-153 = "[ns] «И всё же вы сами тоже бежите прямо в огонь, Нагуса.»"
51180-154 = ""
51180-156 = ""
51180-157 = "[ns] «Вы не можете их бросить. В этом мы с вами одинаковы.»"
51180-158 = "...!!"
51180-159 = "Это..."
51180-160 = "Я просто..."
51180-161 = "[s5] «Нагуса, всем нужна ваша помощь.»\n[s6] «Вы ведь знаете, кто это устроил и что это за существа, верно?»"
51180-164 = "...Значит, вот ваш ответ."
51180-165 = "...Ладно."
51180-166 = ""
51180-168 = ""
51180-170 = ""
51180-172 = "Они... Духи артефактов."
51180-173 = "Духи артефактов — это обычные предметы быта, одержимые злом и ожившие. На это уходит больше ста лет. Хяккарёран уже побеждал их раньше, но по-настоящему они никогда не умирают."
51180-174 = "Злые духи рождаются из слухов и историй о призраках, переходя из мира духов в наш, чтобы сеять ужас и причинять боль."
51180-175 = "[s] «...Историй о призраках?»"
51180-176 = ""
51180-179 = "Сплетни, слухи, домыслы. А если описывать их более громкими словами..."
51180-182 = "Это авторы «Ста историй о призраках», которые передаются из поколения в поколение."
51180-183 = "Одни называют их злодейским клубом, восставшим против альянса Хяккияко, другие утверждают, что это чудовища, околдовывающие людей странными фолиантами..."
51180-186 = "Это всё, что мне известно."
51180-187 = "Их присутствие здесь противоречит всякой логике."
51180-188 = "То, что они здесь, не просто необычно. Это вообще не должно быть возможно."
51180-189 = "[s] «...Это может быть делом „Красоты природы“?»"
51180-190 = ""
51180-192 = ""
51180-193 = "Это название не должно быть вам известно, Сенсей."
51180-194 = ""
51180-198 = ""
51180-199 = "Сзади!"
51180-200 = ""
51180-205 = "А-а! Не стреляйте! Пожалуйста! Мы друзья! Друзья!"
51180-206 = "Это разве не..."
51180-207 = ""
51180-209 = ""
51180-212 = ""
51180-214 = ""
51180-215 = "Сенсей! Мы вас нашли!"
51180-216 = "Вы нигде не ранены?"
51180-217 = "[s] «Не переживайте за меня. Все остальные в порядке?!»"
51180-219 = "...Да. Мы все целы."
51180-220 = "Но ситуация..."
51180-222 = "Сенсей!"
51180-223 = "Что происходит?! Мы дрались с этой огромной страшной штукой, потом я упала, а потом..."
51180-224 = "УААА! Как же страшно!"
51180-226 = "Главное, что мы вместе и в безопасности, Каэдэ! Я не позволю, чтобы с тобой что-нибудь случилось."
51180-227 = "*шмыгает носом* Мимори... Ты лучшая."
51180-228 = "[s] «Я рад, что никто из Клуба внутренней дисциплины не пострадал.»"
51180-229 = ""
51180-231 = ""
51180-233 = ""
51180-235 = ""
51180-236 = "Какая неожиданная встреча, Нагуса."
51180-237 = "Рэнгэ, я..."
51180-238 = "Нет. Злюсь здесь я. А тебе придётся меня выслушать."
51180-239 = "...Но позже. Сейчас ты мне нужна."
51180-240 = ""
51180-242 = ""
51180-243 = ""
51180-245 = ""
51180-247 = ""
51180-249 = ""
51180-251 = "Чудовища нарушают покой Хяккияко!"
51180-252 = "Защита нашего дома прежде всего. Правда, Нагуса?!"
51180-253 = ""
51180-256 = ""
51180-257 = "Я..."
51180-258 = ""
51180-262 = ""
51180-263 = "Зверь..."
51180-264 = "Вой, разрывающий сам воздух..."
51180-269 = "(Куда ни посмотри — всё охвачено огнём.)"
51180-270 = "(По улицам разносится этот призрачный визг.)"
51180-271 = ""
51180-276 = "Если к этому причастна «Красота природы»..."
51180-278 = "На Духах артефактов всё не закончится."
51180-280 = "Бегите. Бегите как можно скорее."
51180-281 = "Ты серьёзно, Нагуса?"
51180-282 = "Это всё, что ты умеешь? Убегать, когда становится трудно?"
51180-283 = "[s] «Рэнгэ, успокойся хотя бы на секунду.»"
51180-284 = "Успокоиться? УСПОКОИТЬСЯ?!"
51180-285 = "Рэнгэ, послушай. Духи артефактов меня не беспокоят."
51180-286 = ""
51180-288 = ""
51180-289 = ""
51180-290 = "Это лишь осколки «Ста историй о призраках». Сами по себе настоящей силой они не обладают."
51180-291 = "Но есть зверь совершенно иной природы..."
51180-292 = "Эта история может закончиться только тем, что слух превратится в Фантомное сказание... Существо, которое скоро появится..."
51180-293 = ""
51180-301 = ""
51180-302 = "Что это, чёрт возьми, такое?"
51180-303 = "...Кошка?"
51180-304 = "Да ладно! Это самая огромная кошка, какую я когда-либо видела."
51180-306 = "Оно здесь..."
51180-307 = "Фантомное сказание воплотилось."
51180-308 = "История о призраке превратилась в настоящий кошмар... С ним невозможно сражаться."
51180-309 = "Аямэ смогла бы..."
51180-310 = ""
51180-314 = "[ns] «С дороги! Оно идёт!»"
