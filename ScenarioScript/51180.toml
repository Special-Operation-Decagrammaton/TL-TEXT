[translation]
51180-1 = "Episódio 18;O Conto Macabro que Caminha pela Cidade (2)"
51180-4 = "Ainda assim... ainda assim, eu só queria recuperar aquilo..."
51180-5 = "Eu só sentia tanta saudade do tempo que passávamos todas juntas...!"
51180-8 = "\"Se for só uma desculpa pensando no outro..."
51180-9 = "isso só acaba machucando os dois lados\"..."
51180-10 = "...Eu disse aquilo pela Yukari, mas..."
51180-11 = "No fim, quem mais sofreu fui..."
51180-17 = "Nagusa-senpai..."
51180-18 = "Por que você, naquela hora..."
51180-22 = "...Quem está aí?"
51180-29 = "Kikyou, quanto tempo."
51180-30 = "Nagusa-senpai...?!"
51180-31 = "Onde você esteve esse tempo todo...?"
51180-32 = "Não... deixa isso pra lá.#n— Bem-vinda de volta, senpai."
51180-33 = "A situação atual do Hyakkaryouran é deplorável...#nDepois que a Presidente Ayame e você sumiram, as outras integrantes foram saindo uma após a outra."
51180-34 = "Desse jeito... o Hyakkaryouran pode mesmo acabar desaparecendo.#nAinda não é tarde demais... Se você conversar com todo mundo—"
51180-40 = "— Kikyou, pegue isto."
51180-41 = "Isto é... a \"Prova\"?#nPor quê?"
51180-46 = "Kikyou, você é brilhante.#nComo estrategista do Hyakkaryouran, todas confiam em você."
51180-47 = "Não só as outras integrantes... eu também."
51180-48 = "Por isso eu pensei: mais do que eu... você é quem merece ser a Presidente do Hyakkaryouran."
51180-49 = "Então... vou devolver a Prova."
51180-55 = "Quero que você fique com ela, Kikyou."
51180-60 = "Ficou seis meses sem dar notícias e...#né essa a sua resposta?"
51180-62 = "Sim."
51180-63 = "...Por quê?"
51180-68 = "...Porque eu não sou a Ayame."
51180-69 = "Porque eu não consigo substituir a Ayame."
51180-75 = "Eu fiquei furiosa."
51180-76 = "Não por ela ter devolvido a Prova e tentado fugir."
51180-81 = "Você era quem nós admirávamos."
51180-82 = "Eu gostava de ver você caminhando à nossa frente.#nEu a respeitava de todo coração."
51180-83 = "E ainda assim... mesmo assim..."
51180-85 = "Eu não me importo nem um pouco com a Presidente Ayame."
51180-86 = "Eu nunca pensei em você como uma substituta da Presidente, Nagusa-senpai..."
51180-87 = "Nunca quis que você a substituísse... nem uma única vez."
51180-92 = "Eu... estava errada?"
51180-94 = "O que você espera que eu faça...?!"
51180-99 = "...A cidade está agitada."
51180-105 = "(O fogo se espalhava por toda parte, mergulhando a cidade no caos)"
51180-115 = "Uwaaah!"
51180-116 = "S-Socorro, u-um monstro...!!"
51180-124 = "Ufa... Você está bem?"
51180-127 = "[ns] \"Já derrotamos os monstros desse lado, está seguro! Vamos, evacuem!\""
51180-128 = "S-Sim...!#nM-Muito obrigado!"
51180-135 = "...Não tem fim."
51180-136 = "[s] \"Vamos procurar ver se ainda tem alguém preso sem conseguir fugir.\""
51180-137 = "...! O que você está dizendo numa situação dessas?"
51180-138 = "Sensei... você está falando sério?"
51180-139 = "Eu achava que você pelo menos tinha noção de que isso é uma emergência."
51180-140 = "Numa hora dessas, precisamos garantir uma rota de fuga e evacuar... Mesmo assim, por quê?"
51180-141 = "[s] \"Porque todos estão correndo perigo.\""
51180-142 = "Quem ficou para trás ou o que quer que aconteça aqui não tem nada a ver com você...#nSão completos estranhos..."
51180-143 = "Normalmente, numa situação dessas, a prioridade é a própria vida. Não é assim?"
51180-144 = "Então por que você...?"
51180-145 = "[s1] \"Incluindo as alunas...\"\n[s2] \"Eu conheço o pessoal de Hyakkiyako.\""
51180-149 = "[ns3] \"Mesmo que fossem estranhos...\"\n[ns4] \"Eu não posso ignorar quem está em perigo.\""
51180-152 = "No fim das contas, isso é só conversa bonita...!"
51180-153 = "[ns] \"Além disso, você também veio comigo, não veio, Nagusa?\""
51180-157 = "[ns] \"Você não consegue simplesmente ignorar, né? Eu também não.\""
51180-158 = "...!!"
51180-159 = "Isso é..."
51180-160 = "Eu só..."
51180-161 = "[s5] \"Quero que você me conte.\"\n[s6] \"Você sabe o que aquelas coisas realmente são, não sabe?\""
51180-164 = "...Você não tem a menor intenção de ir embora, né?"
51180-165 = "......"
51180-172 = "Aquilo são... \"Tsukumogami Espectrais\"."
51180-173 = "Lendas e rumores que antigamente o Hyakkaryouran exterminava—"
51180-174 = "— Um dos \"Contos Macabros\" vindos do \"Crepúsculo\"."
51180-175 = "[s] \"...Contos Macabros.\""
51180-179 = "Por assim dizer, uma espécie de lenda urbana, uma existência meio fofoqueira... Não, se eu colocar de um jeito mais dramático..."
51180-182 = "\"Hyakumonogatari\" — talvez?"
51180-183 = "Eles às vezes são chamados — ou não — de \"um clube perverso que não reconhece a forma atual da Aliança de Hyakkiyako\", ou de \"demônios que manipulam livros macabros para enganar as pessoas\"..."
51180-186 = "Mesmo assim, é estranho..."
51180-187 = "Por que estão aqui...?"
51180-188 = "Eles não deveriam estar num lugar como este... Por quê..."
51180-189 = "[s] \"Isso também é obra do Clube Beleza da Natureza...?\""
51180-193 = "Onde você ouviu esse nome...!"
51180-199 = "Atrás de nós...?!"
51180-205 = "Uau, espera, espera!#nEu não sou nenhum monstro, não!"
51180-206 = "Essa voz..."
51180-215 = "Ah, é o Sensei~!"
51180-216 = "Sensei! Você não se machucou...?!"
51180-217 = "[s] \"Sim, estou bem. E vocês?\""
51180-219 = "...Nós estamos bem~"
51180-220 = "Mais importante..."
51180-222 = "Sensei, escuta só!"
51180-223 = "Foi a maior confusão, a gente lutou com umas coisas estranhas e eu até caí!"
51180-224 = "Eu já não entendo mais nada! Buááá!"
51180-226 = "Está tudo bem, Kaede-chan.#nEstamos com todo mundo agora, então não tenha medo."
51180-227 = "Snif... Mimori-senpai~!"
51180-228 = "[s] \"Que bom que ninguém se machucou. Além do Clube de Disciplina Interior...\""
51180-236 = "Nagusa-senpai, então você estava aqui."
51180-237 = "...Renge."
51180-238 = "Eu tenho um monte de coisas pra falar e perguntar... uma montanha delas."
51180-239 = "Mas antes disso—"
51180-251 = "Temos que dar um jeito nesses monstros!"
51180-252 = "Então... você vai ajudar também, né, Nagusa-senpai?"
51180-257 = "Eu..."
51180-263 = "Uma fera..."
51180-264 = "Esse rugido... será que...!"
51180-269 = "(A cidade inteira está em chamas)"
51180-270 = "(Um rugido ecoa pelo ar)"
51180-276 = "Se o Clube Beleza da Natureza veio até aqui, isso significa que..."
51180-278 = "Os Tsukumogami não são o fim...?"
51180-280 = "Vamos fugir."
51180-281 = "Hã?! Espera aí, Nagusa-senpai, fugir...?"
51180-282 = "Ei! Espera aí, você vai fugir de novo?!"
51180-283 = "[s] \"Renge, calma...\""
51180-284 = "Como eu posso ficar calma?!#nEla vai fazer isso de novo...!"
51180-285 = "Se forem Tsukumogami, tudo bem...#n— Mas só se parar nos Tsukumogami."
51180-290 = "Aqueles são apenas parte do Hyakumonogatari... existências derivadas de histórias, criadas por \"rumores\"..."
51180-291 = "Mas se \"aquilo\" apareceu..."
51180-292 = "Se a história ultrapassar o \"rumor\" e se tornar um \"Conto Macabro\"...#nO que vem a seguir é—"
51180-302 = "O que é... aquilo?"
51180-303 = "......Um gatinho?"
51180-304 = "Quê?! Existe um gato gigante daquele tamanho?!"
51180-306 = "Tarde demais..."
51180-307 = "O \"Hyakumonogatari Espectral\" está... aqui."
51180-308 = "Aquilo — o Hyakumonogatari que se tornou um Conto Macabro...!"
51180-309 = "Sem a Ayame, não tem mais jeito...!"
51180-314 = "[ns] \"Cuidado, pessoal! Lá vem...!\""
