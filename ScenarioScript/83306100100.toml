83306100100-11 = ""
83306100100-12 = "Ты... считаешь?"
83306100100-13 = "О, глава префектов."
83306100100-14 = "Чем я занята? Ничем особенным."
83306100100-15 = "Просто играю в прятки с Ибуки и Кирарой. Если не очевидно, я вожу."
83306100100-16 = "Ибуки сказала, что хочет поиграть, а Кирара тут же вызвалась вместе со мной."
83306100100-17 = "Кирара любит играть с детьми. Ну, возможно, это часть взросления."
83306100100-18 = "Хм, но мы обещали скоро встретиться с другими студентами. Надо заканчивать побыстрее."
83306100100-19 = "Тогда хочешь, я помогу?"
83306100100-20 = "Прятки... с главой префектов?"
83306100100-21 = ""
83306100100-24 = "А... Кстати, я слышала, люди говорят, что когда речь идёт о поиске нарушителей, у вас зрение острее орлиного."
83306100100-25 = "А значит... вы прирождённый эксперт по пряткам."
83306100100-26 = "Это всего лишь слух... Не знаю, почему люди всё так преувеличивают."
83306100100-27 = "Ха-ха, ну, я просто прочитала это в интернете."
83306100100-28 = "Но если предлагаете помощь — да, она пригодится."
