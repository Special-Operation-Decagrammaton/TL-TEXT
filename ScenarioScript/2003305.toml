[translation]
2003305-1 = "Досуг Великого председателя"
2003305-2 = "В один из моих редких выходных я делал покупки в магазине неподалёку от Шале..."
2003305-3 = "[ns] «Цены неплохие... Давненько я не ел стейк, может— Хм?»"
2003305-4 = ""
2003305-5 = ""
2003305-6 = ""
2003305-7 = ""
2003305-8 = "[ns] «Это... Макото?»"
2003305-9 = "Хм... Нет. Не это. И то тоже не подходит."
2003305-10 = "...*шмыгает носом*"
2003305-11 = "Они одного производителя, но взять делюкс, имперский премиум или специальную лимитированную версию..."
2003305-12 = "А-А-А! Что...? Почему?"
2003305-13 = "Зачем всё так бессмысленно усложнять..."
2003305-14 = "А-А-Апчхи!"
2003305-15 = "Угх! Неужели нельзя сделать что-нибудь попроще?! ...*шмыгает носом*"
2003305-16 = "[s] «Макото? Всё в порядке?»"
2003305-17 = "Чего?!"
2003305-18 = "...Апчхи! *кашель* А-Апчхи! *кашель* *кашель*"
2003305-19 = "[s] «А! Ты в порядке?!»"
2003305-20 = "*кашель* *кашель* *задыхается*... Я... в порядке. *шмыгает носом*"
2003305-21 = "О, Сенсей. Я как раз думала, какой дурак осмелился потревожить человека, который так спокойно делает покупки."
2003305-22 = "[s] «(Не думаю, что кто-нибудь назвал бы это спокойным...)»"
2003305-23 = "А, что я здесь делаю? Как я и сказала... *шмыг*"
2003305-24 = "У меня выходной, поэтому я решила немного закупиться."
2003305-25 = "Ап-чхи!"
2003305-26 = "Угх... *шмыгает носом*"
2003305-27 = "...Мне нужны кое-какие... предметы первой необходимости."
2003305-28 = "[s] «Ты сама покупаешь продукты? Неожиданно.»"
2003305-29 = "Ургх... *шмыг*"
2003305-30 = "...Люди охотнее идут за лидером, который делает что-то сам, а не перекладывает работу на других."
2003305-31 = "Кихехехех... *шмыг* А вы тоже за покупками, Сенсей?"
2003305-32 = "...Пришли за новым мерчем Пероро? Пероро... это вот этот гиппопотам?"
2003305-33 = "А-А-А! Что...? Почему?"
2003305-34 = "Пероро не гиппопотам...? Какая чепуха..."
2003305-35 = "[s1] «К-Как бы то ни было, Макото, ты сказала, что пришла за необходимым?»\n[s2] «У тебя в сумке довольно много всего.»"
2003305-38 = "Кихехехех... Да. Я нашла упаковку мышек-игрушек для кошек и новый вкус лакомств Purr Purr."
2003305-39 = "Всё это предметы первой необходимости для Его Величества, Императора Лайонмару-младшего III."
2003305-40 = "[s] «А... Лайонмару — тот кот из твоего офиса?»"
2003305-41 = "Полагаю, вы и правда видели Его Величество, Императора Лайонмару раньше."
2003305-42 = "Кихехехех... Император Лайонмару требователен, как и положено монарху. Он отказывается есть любой корм, кроме марки Purr Purr. Найти его бывает трудно, но в этом магазине обычно есть запас."
2003305-43 = "[s] «О, так вот что значили твои сообщения в MomoTalk... Ты души не чаешь в Лайонмару, да?»"
2003305-44 = "Вы намекаете, что я дорожу каким-то простым котом?"
2003305-45 = "Нет, не поймите меня неправильно, Сенсей."
2003305-46 = "[s] «...А?»"
2003305-47 = "Его Величество, Император Лайонмару-младший III — ключевая часть моих планов..."
2003305-48 = "Можно сказать, это инвестиция. Император Лайонмару станет символом всего, что я олицетворяю."
2003305-49 = "Свирепость, бушующая в его сердце... царственная аура и королевские манеры... С первого взгляда я поняла: он великий лидер кошек, как я — великий лидер студентов. Скоро он затмит всех прочих кошачьих на свете."
2003305-50 = "Я воспитаю Его Величество, Императора Лайонмару как идеального представителя Общества Пандемониума..."
2003305-51 = "А-А-А! Что...? Почему?"
2003305-52 = "...И правой рукой Великой Макото!"
2003305-53 = "Кихехех... Да... *шмыгает носом* Император Лайонмару..."
2003305-54 = "Я продолжу кормить и растить Его Величество... и однажды совсем скоро он станет великолепным львом с харизмой, равной моей!"
2003305-55 = "[s] «Макото, кошки не вырастают во львов...»"
2003305-56 = "А-Апчхи!"
2003305-57 = "Кихехех... Только потому, что им не хватает духа."
2003305-58 = "Я буду взращивать свирепость Императора Лайонмару! У него появится собственный стриминговый канал, полный рекламного контента с Лайонмару! А потом Его Величество и я будем трудиться до изнеможения, вместе продвигая Общество Пандемониума!"
2003305-59 = "Кихехехех! Что скажете о моём великом плане, Сенсей?"
2003305-60 = "Наверняка вы понимаете, что в ваших же интересах объединиться с Обществом Пандемониума до того, как наше влияние затмит даже ваше!"
2003305-61 = "Более того, если присоединитесь к нам прямо сейчас... я разрешу вам потрогать мягкие подушечки лап Императора Лайонмару — привилегию, которая до сих пор принадлежала лишь мне! Кихехехех..."
2003305-62 = "Ч-Что? Мягких подушечек лап недостаточно, чтобы вас убедить?"
2003305-63 = "Вы так не скажете, когда увидите фотографию, которую я сделала, Сенсей! Вот, смотрите, чего лишаетесь!"
2003305-64 = "[s] «Так ты всё-таки любишь своего кота!»"
2003305-65 = "К-Как я и сказала, у меня нет никаких личных..."
2003305-66 = "Ч-Чувств..."
2003305-67 = "Чув..."
2003305-68 = ""
2003305-70 = ""
2003305-71 = "[ns] «...Макото? Ты в порядке? Выглядишь неважно...»"
2003305-72 = "А-А-А-Апчхи!"
2003305-73 = "*кашель* *кашель* *кашель*"
2003305-74 = ""
2003305-76 = ""
2003305-78 = "[ns] «Макото?!»"
2003305-80 = "Больница скорой помощи Геенны"
2003305-81 = "У вас аллергия на кошек."
2003305-82 = "Что? Аллер—"
2003305-83 = "А-Апчхи!"
2003305-84 = "Апчхи! Апчхи!"
2003305-85 = "А-А-А-А-А-А—пчхи-и-и!"
2003305-86 = "[s] «Я так и думал...»"
2003305-87 = "Нет... Не может быть..."
2003305-88 = "[s] «Макото, ты раньше не замечала проблем со здоровьем?»"
2003305-89 = "Конечно нет... Ну, кожа чесалась всякий раз, когда я трогала Его Величество, Императора Лайонмару, а когда он тёрся головой о моё лицо, из носа начинало течь..."
2003305-90 = "А когда он спал в моей кровати, в горле начинало щекотать, и я не могла перестать чихать, пока пыталась заснуть..."
2003305-91 = "Но у меня просто не может быть аллергии на кошек! Это наверняка ошибочный диагноз!"
2003305-92 = "[s] «Это совершенно точно симптомы аллергии!»"
2003305-93 = ""
2003305-95 = ""
2003305-96 = "С лёгкой аллергией можно было бы справляться лечением, но при такой силе симптомов..."
2003305-97 = "Боюсь, в вашем случае это невозможно."
2003305-98 = "[s] «Тогда... жить вместе с кошкой...»"
2003305-99 = "Да. Мне тяжело это говорить..."
2003305-100 = "Но сильные аллергические реакции могут вызвать серьёзные проблемы со здоровьем. Содержать питомца при таких обстоятельствах было бы..."
2003305-101 = "Кихехех."
2003305-102 = "Кихехех. Кихехехех...!"
2003305-103 = "Кихехех..."
2003305-104 = "*кашель* *кашель* *кашель*"
2003305-105 = "[s] «М-Макото?»"
2003305-106 = "Я должна перестать жить с кошкой только потому, что у меня аллергия?"
2003305-107 = "...Ни за что."
2003305-108 = "Когда Великая Ханума Макото даёт обещание, она следует ему до самого конца! Я взяла этого кота под свою опеку, и мне всё равно, есть у меня аллергия или нет!"
2003305-109 = "Я просто сделаю вид, что вы ничего не говорили."
2003305-110 = "[s] «...Макото, ты уверена?»"
2003305-111 = "Кихехех! Абсолютно! Конечно, мне придётся избегать личного контакта с Его Величеством, Императором Лайонмару... но я наверняка что-нибудь придумаю..."
2003305-112 = "К тому же мои великие замыслы не рухнут из-за какой-то жалкой аллергии!"
2003305-113 = "Совсем скоро видео с Императором Лайонмару станет вирусным, а вместе с ним по всему Кивотосу разнесётся имя Общества Пандемониума! Ждите этого дня, Сенсей!"
2003305-114 = "[s] «...Хех. Очень на тебя похоже, Макото. Я буду болеть за тебя.»"
2003305-115 = "Кихехех. Кихехехехех!!!"
2003305-116 = "... *кашляет*"
2003305-118 = "Через несколько дней, когда я работал в Шале..."
2003305-119 = ""
2003305-122 = "[ns] «Хм...? Фотография от Макото?»"
2003305-124 = "К сожалению, из-за моей аллергии Его Величество, Император Лайонмару вынужден жить у нескольких членов клуба..."
2003305-125 = "Но его отважный дух не сломлен! А я продолжу присылать вам новости о Лайонмару, навещая его каждый день!"
2003305-126 = "Если объединитесь с Обществом Пандемониума... я даже поделюсь тайной коллекцией фотографий Императора Лайонмару в котячьем возрасте!"
2003305-127 = "[ns] «...Я рад, что ей не пришлось навсегда прощаться с любимым Лайонмару.»"
2003305-128 = "Листая фотографии Лайонмару, которые прислала Макото, я почувствовал, как усталость в сердце понемногу отступает."
