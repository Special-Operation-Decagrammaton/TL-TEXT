[translation]
1003602-1 = "Хранительница собора"
1003602-2 = "Внутри собора Тринити"
1003602-3 = "Я был в Тринити по делам и решил заглянуть в собор после последнего сообщения Хинаты."
1003602-4 = "До мессы ещё оставалось время, поэтому студентов внутри не было."
1003602-5 = "*грохот*"
1003602-6 = "[ns] «...?»"
1003602-7 = "*грохот* *грохот*"
1003602-8 = "*тук*"
1003602-9 = "Я услышал шум из открытой двери с одной стороны собора."
1003602-10 = "[ns1] «Там кто-нибудь есть?»\n[ns2] Пойти на звук."
1003602-14 = "Длинный коридор за дверью вёл к потрёпанному складскому зданию."
1003602-15 = ""
1003602-18 = "А? Сенсей, это вы?"
1003602-19 = "[s] «...?»"
1003602-20 = "И правда вы! Что привело вас сюда?"
1003602-21 = "Или лучше спросить: как вы сюда попали? Это закрытая зона!"
1003602-22 = "Посторонних сюда обычно вообще не пускают!"
1003602-23 = "А? Вы пошли на странный шум? Наверное, слышали, как я переносила вещи."
1003602-24 = "А дверь в коридор была распахнута настежь?"
1003602-25 = "О."
1003602-26 = "Э-Это моя вина! Я совсем забыла закрыть её за собой!"
1003602-27 = "У-Угх... Не могу поверить, что так облажалась! В последнее время я совсем рассеянная."
1003602-28 = "Хм?"
1003602-29 = "Вы никому об этом не скажете?"
1003602-30 = "Н-Не в этом дело! Я-Я имею в виду, было бы плохо, если бы остальные узнали,#nно я не об этом..."
1003602-31 = "А? Что я здесь делала?"
1003602-32 = "Э-Эм, ну..."
1003602-33 = "Как вы, наверное, и сами видите, я разбирала вещи, которые здесь хранятся."
1003602-34 = "Даже когда собор тихий и безлюдный, за кулисами всегда есть работа."
1003602-35 = "Некоторые вещи здесь принадлежат собору, некоторые — отдельным сёстрам, а что-то даже оставили посетители..."
1003602-36 = "Чтобы разобрать работу всего за один день, здесь нужны десятки коробок."
1003602-37 = "[s3] «И ты всё это делаешь одна?»\n[s4] «Ты прямо как управляющая этого места.»"
1003602-38 = "Х-Хаха. Наверное... Но это ничего особенного."
1003602-39 = "Х-Хаха. Наверное... Но это ничего особенного."
1003602-40 = "Я отвечаю за обслуживание и инвентарь..."
1003602-41 = "...но это не значит, что я всегда работаю одна. Иногда помогают другие сёстры."
1003602-42 = "Я предпочитаю заниматься такой работой сама. Так проще."
1003602-43 = "А? Вы хотите мне помочь?"
1003602-44 = "Эм... Я ценю предложение, но, наверное, не стоит."
1003602-45 = "С-Сенсей?!"
1003602-46 = ""
1003602-49 = "[ns5] «Она не двигается!»\n[ns6] «М-Моя спина!»"
1003602-50 = "Вы в порядке, Сенсей? П-Пожалуйста, поставьте её обратно!"
1003602-51 = "Вы в порядке, Сенсей? П-Пожалуйста, поставьте её обратно!"
1003602-52 = ""
1003602-55 = "Я пыталась предупредить. Эти коробки гораздо тяжелее, чем выглядят.#nОбычно одну переносят втроём."
1003602-56 = "Поэтому лучше, если этим занимаюсь я — тогда остальные могут работать над другими делами."
1003602-57 = "[s7] «Теперь понятно, почему именно тебя назначили ответственной.»\n[s8] «Да. Похоже, ты и правда единственная, кто может это делать.»"
1003602-58 = "А-Ахаха..."
1003602-59 = "А-Ахаха..."
1003602-60 = "Немного неловко, когда вы так говорите, но мне приятно это слышать.#nСпасибо."
1003602-61 = "Я не так талантлива в утешении и консультировании, как другие сёстры..."
1003602-62 = "Поэтому я стараюсь компенсировать это физической работой и управлением."
1003602-63 = "Это почти всё, что у меня действительно хорошо получается. Так что... Хаха..."
1003602-64 = "[s] «...»"
1003602-65 = "..."
1003602-66 = "Ч-Что я вообще такое говорю?"
1003602-67 = "Простите. Не хотела портить настроение."
1003602-68 = "Д-Думаю, нам пора. Я покажу дорогу обратно в собор."
1003602-69 = "Нет-нет. Это вовсе не неудобство."
1003602-70 = "Да, я уверена. С удовольствием вас провожу."
1003602-71 = "Вообще-то у меня и самой есть несколько дел в часовне,#nтак что никаких проблем."
1003602-72 = "Только подниму эту коробку перед уходом."
1003602-73 = "Ха-а-а!"
1003602-74 = "*тяжело дышит* *тяжело дышит*"
1003602-75 = "Хорошо. Пойдём?"
1003602-76 = ""
1003602-78 = "[ns] Пойти за Хинатой."
1003602-80 = ""
1003602-82 = "*тяжело дышит* *тяжело дышит* Вот и всё!"
1003602-83 = "Фух. Я изрядно вспотела."
1003602-84 = "Это совсем недолго заняло. Х-Хаха..."
1003602-85 = "Вообще-то немного неловко."
1003602-86 = "Разгорячиться и вспотеть рядом именно с вами..."
1003602-87 = ""
1003602-90 = "А? Ч-Что происходит? Почему в соборе вдруг столько людей?"
1003602-91 = "Почему-то кажется, что они смотрят на нас..."
1003602-92 = "Сенсей? Вам неуютно... Что случилось?"
1003602-93 = "Недоразумение? Что тут можно неправильно понять?"
1003602-94 = "Не меня? Вы имеете в виду их всех? А...?"
1003602-95 = "[s9] «М-Мне пора!»\n[s10] «Потом объясню! Пока!»"
1003602-96 = ""
1003602-97 = ""
1003602-100 = "Что...?"
1003602-101 = "С-Сенсей?! Сенсей!"
1003602-103 = "Я со всех ног побежал обратно в Шале, чтобы избежать новых недоразумений."
1003602-104 = "Хината так и не поняла, в чём именно могло быть недоразумение."
