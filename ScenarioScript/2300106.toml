[translation]
2300106-1 = "Особое блюдо дня для Сенсея"
2300106-2 = "После нескольких ночей подряд за работой в Шале Фуука связалась со мной."
2300106-3 = "Получив её сообщение, я сразу отправился к месту встречи."
2300106-4 = "Но как только я пришёл, мне показалось, что небо закружилось вокруг."
2300106-9 = "Медпункт академии Геенна, палата 12"
2300106-10 = "С-Сенсей? Ты в порядке?"
2300106-11 = "Ты очнулся! Ты меня слышишь?"
2300106-12 = "[s] «Фуука? Что случилось?»"
2300106-13 = "Я нашла тебя лежащим без сознания на месте встречи."
2300106-14 = "Медсестра сказала, что ты потерял сознание от усталости."
2300106-15 = "[s] «Теперь вспомнил. Вчера я опять работал допоздна.»"
2300106-16 = "Это... всё моя вина."
2300106-17 = "[s] «Это неправда.»"
2300106-18 = "Правда. Я должна была учитывать твоё расписание в Шале."
2300106-19 = "Если бы я не попросила тебя встретиться со мной за ужином, ты бы не потерял сознание."
2300106-20 = "Мне так жаль..."
2300106-21 = "[s] «Ты не виновата, Фуука.»"
2300106-22 = "Не виновата...?"
2300106-23 = "[s] «Я согласился, потому что люблю твою готовку, Фуука.»"
2300106-24 = "Каждый раз..."
2300106-25 = "Ты всегда говоришь мне такие вещи."
2300106-26 = "Пока ждала, когда ты проснёшься, я успела напридумывать себе всякого."
2300106-27 = "Я так увлеклась тем, чтобы кормить тебя тем, что сама считала нужным, что забыла подумать о том, чего хочешь ты."
2300106-28 = "Поэтому на этот раз хочу, чтобы выбирал ты."
2300106-29 = "Сенсей, есть что-нибудь, что ты хотел бы поесть?"
2300106-30 = "[s] «Мне можно выбрать...?»"
2300106-33 = "Дом Шале"
2300106-34 = "Ты хочешь только домашнюю еду? Точно не чего-нибудь более изысканного?"
2300106-35 = "[s] «Это не просто домашняя еда. Это домашняя еда, которую ты приготовила для меня.»"
2300106-36 = "Если ты этого хочешь, Сенсей. Решать тебе."
2300106-37 = "Хорошо, сейчас всё приготовлю!"
2300106-40 = "― Я так и знала. Ты опять ел замороженную еду![wa:3580]"
2300106-43 = "― Это вредно. Нужно думать о здоровье.[wa:1440]"
2300106-46 = "― Приготовить что-нибудь получше совсем недолго, так что просто подожди немного.[wa:320]"
2300106-49 = "― Серьёзно, Сенсей. Твоя худшая привычка — полностью игнорировать своё здоровье.[wa:1260]"
2300106-52 = "― А? Хочешь, чтобы я готовила тебе каждый день?[wa:4360]"
2300106-54 = "― О, ахаха. Я... Если ты правда этого хочешь, я не против...[wa:5700]"
2300106-56 = ""
2300106-57 = "Дом Шале"
2300106-58 = "Если когда-нибудь снова захочешь домашней еды, просто скажи."
2300106-59 = ""
2300106-60 = ""
2300106-61 = "Проси сколько хочешь... Я всегда буду рада приготовить для тебя."
