90002040-117 = "Могу дать три секунды. Этого хватит?"
90002040-118 = "Делай! Прямо сейчас!"
90002040-119 = "Поняла. Вывожу двигатель на максимальную мощность."
90002040-120 = ""
90002040-125 = ""
90002040-126 = "Тогда увидимся над Йесодом."
90002040-127 = "Арис выдвигается!"
90002040-128 = ""
90002040-133 = "Подтверждаю безопасный запуск ударной группы Йесода."
