90002040-75 = "Как нога? Сейчас вроде всё нормально, но..."
90002040-77 = "Я в порядке. Спасибо вам обеим."
90002040-78 = "А ещё..."
90002040-79 = ""
90002040-82 = ""
90002040-83 = "Хм?"
90002040-84 = "Хм?"
90002040-86 = "Сейчас мне нужно, чтобы вы побежали направо как можно быстрее. Не оглядывайтесь."
90002040-88 = "Что...? А?!"
90002040-89 = ""
90002040-95 = ""
90002040-96 = "КЯ-А-А!!"
90002040-97 = ""
90002040-99 = ""
90002040-103 = ""
90002040-104 = "Я-я уклонилась..."
90002040-105 = "С-Спасибо, Эйми."
90002040-107 = "Не за что. Это мне стоит вас благодарить."
90002040-108 = "Итак, Сенсей."
90002040-109 = "Теперь ваша очередь."
90002040-114 = "Кей, мы не можем быстрее?!"
