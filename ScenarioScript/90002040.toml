90002040-37 = "...!!"
90002040-38 = "(Йесод снова поднимает руки.)"
90002040-39 = "(И отправил войска окружить меня и удержать на месте.)"
90002040-40 = "(В каком-то смысле эффективно. Его войска расходные и бесконечные.)"
90002040-41 = "(А я, с другой стороны...)"
90002040-42 = "Это пустяк! Я утащу тебя за собой, Йесод!"
90002040-43 = ""
90002040-47 = ""
90002040-49 = ""
90002040-51 = ""
90002040-54 = "Э...?"
90002040-55 = ""
90002040-58 = ""
90002040-59 = "Эйми! Ты в порядке?!"
90002040-60 = "Момой! Давай сдвинем это, быстрее! На счёт три...!"
90002040-61 = "Раз, два..."
90002040-62 = ""
90002040-64 = ""
90002040-65 = ""
90002040-66 = "ТРИ!!"
90002040-67 = ""
90002040-72 = "...Момой? Мидори?"
