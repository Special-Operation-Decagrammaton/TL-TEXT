[translation]
1011203-1 = "Свидание в столовой"
1011203-6 = "Я закончил работу в Миллениуме как раз к обеду."
1011203-7 = ""
1011203-10 = "[ns] «Я...»"
1011203-12 = "[ns] «Голоден!»"
1011203-16 = "Я долго размышлял, что бы поесть."
1011203-17 = ""
1011203-23 = "[ns] «Стоит заглянуть в столовую.»"
1011203-24 = "Пока я осматривался в поисках чего-нибудь съедобного..."
1011203-25 = ""
1011203-28 = "[ns] «Хм? Это же...»"
1011203-32 = ""
1011203-33 = ""
1011203-34 = ""
1011203-35 = ""
1011203-38 = "[ns1] «Привет, Асуна!»\n[ns2] «Выбираешь, что взять на обед?»"
1011203-39 = ""
1011203-40 = ""
1011203-42 = ""
1011203-43 = "А, Сенсей!!"
1011203-44 = "Привет-привет!!"
1011203-45 = "Ахаха, какова вероятность встретить вас прямо здесь, в столовой? Круто."
1011203-46 = "[s] «И не говори. А я вот встретил тебя.»"
1011203-47 = "Ага! Вот я и думала, что взять на обед."
1011203-48 = ""
1011203-50 = ""
1011203-51 = ""
1011203-52 = "Вот между этой дынной булочкой..."
1011203-53 = ""
1011203-55 = ""
1011203-56 = "...и этой булочкой с якисобой — какую мне взять?"
1011203-57 = "М-м, сложный выбор. Очень сложный."
1011203-58 = "[s] «Почему бы не взять обе?»"
1011203-59 = ""
1011203-61 = ""
1011203-62 = "А? И правда."
1011203-63 = "Я же могу просто взять обе, да? Проблема решена. Ахаха!"
1011203-64 = "Я никогда раньше не ела сразу два вида булочек! Но уверена, как-нибудь справлюсь!"
1011203-65 = ""
1011203-67 = ""
1011203-68 = "Сенсей, Сенсей! Вы ведь пообедаете со мной, правда?"
1011203-69 = "[s] «Эм... конечно.»"
1011203-71 = "Я выбрал себе обед и вместе с Асуной вышел наружу."
1011203-76 = "Вы ещё и мой обед оплатили?! У меня с собой был кошелёк..."
1011203-77 = "[s3] «Не каждый день мы вот так случайно встречаемся.»\n[s4] «Позволь мне хотя бы это для тебя сделать.»"
1011203-80 = "М-м, хорошо! Тогда в следующий раз плачу я."
1011203-81 = ""
1011203-83 = ""
1011203-84 = "А, давайте сядем вон там! Мне нравится та скамейка."
1011203-85 = ""
1011203-87 = ""
1011203-93 = "Хи-хи, ну как вам это место?"
1011203-94 = "[s5] «Хорошо. Солнца как раз в меру.»\n[s6] «Отличное место.»"
1011203-97 = "Правда? Я иногда люблю просто сидеть здесь и ни о чём не думать."
1011203-98 = ""
1011203-101 = "О, булочки."
1011203-104 = "Дынная булочка и булочка с якисобой — угощение от Сенсея!"
1011203-105 = ""
1011203-107 = ""
1011203-108 = "Но с какой начать...? Какую съесть первой?"
1011203-109 = "[s7] «Дынную булочку.»\n[s8] «Булочку с якисобой.»"
1011203-112 = "Хорошо! Хи-хи."
1011203-113 = "Сенсей, с вами всё сложное становится простым!"
1011203-114 = "Ахаха, вот бы вы могли принимать за меня вообще все решения."
1011203-115 = "[s] «Разве не веселее самой принимать решения, Асуна?»"
1011203-116 = "Думаете? Хм..."
1011203-117 = ""
1011203-119 = ""
1011203-120 = "Может быть?"
1011203-121 = "Ладно, тогда вот моё решение! Буду чередовать булочки — по одному укусу от каждой!"
1011203-122 = ""
1011203-124 = ""
1011203-125 = "Спасибо за еду!"
1011203-126 = ""
1011203-128 = ""
1011203-129 = ""
1011203-130 = ""
1011203-131 = "Ахаха, вкусно!"
1011203-132 = "А вместе с вами, Сенсей, ещё вкуснее!"
1011203-134 = "Асуна наелась булочками, и от каждой у неё осталось по половине."
1011203-135 = ""
1011203-138 = "Выбрасывать было жалко, поэтому остатки в итоге доел я."
