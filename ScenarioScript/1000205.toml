1000205-25 = "[s] «Что случилось?»"
1000205-26 = "Как я и сказала, история долгая... Но..."
1000205-28 = ""
1000205-29 = "Ресторан «Pierre Garnish»"
1000205-30 = "Добро пожаловать в «Pierre Garnish». У вас есть бронь?"
1000205-31 = "Да. Столик на имя Куродатэ Харуны."
1000205-32 = "Хорошо. Прошу за мной."
1000205-33 = "Позвольте взять вашу сумку."
1000205-34 = "О, спасибо."
1000205-35 = ""
1000205-36 = ""
1000205-37 = "(крадётся)"
1000205-38 = "Вы должны кое-что знать. Наш ресторан специализируется на полноценных сет-меню, поэтому мы не принимаем одиночных посетителей."
1000205-39 = "Вот как. Я не знала о таком правиле. Но я бронировала столик на одного..."
1000205-40 = "Правило ввели только вчера."
1000205-41 = "..."
1000205-42 = "Но, как вы и сказали, бронь была сделана до изменения правил, поэтому мы сделаем исключение."
1000205-43 = "О, спасибо! Тогда что мне заказать...?"
1000205-44 = "Рекомендую «Pierre». Это лучший сет в нашем меню."
1000205-45 = "О... Хорошо. Возьму его."
1000205-46 = "Пожалуйста, подождите немного."
1000205-47 = ""
1000205-48 = ""
1000205-49 = "...Хм."
1000205-50 = ""
1000205-51 = "Ваш хлеб с закуской из фуа-гра."
1000205-52 = "Хм..."
1000205-53 = ""
1000205-54 = "А вот салат с устрицами — часть основного блюда."
1000205-55 = "М-м..."
1000205-56 = ""
1000205-57 = "Ваше главное блюдо — стейк шатобриан."
1000205-58 = "..."
1000205-59 = ""
1000205-60 = "И на десерт — фруктовый сорбет."
1000205-61 = "..."
1000205-62 = ""
1000205-63 = "...Да. Вот ваш счёт. Спасибо."
1000205-64 = "..."
1000205-65 = "Как вам ужин? Понравилось каждое блюдо?"
1000205-66 = "Блюда..."
1000205-67 = "...Хе-хе-хе-хе-хе-хе."
1000205-68 = "...?"
1000205-69 = "Мы принесём вам контейнер навынос."
1000205-70 = "Хех. В этом нет необходимости."
1000205-71 = "Простите?"
1000205-72 = "*напрягается*"
1000205-73 = "Д-детонатор?"
1000205-74 = "*БА-А-А-АХ*"
1000205-75 = ""
1000205-76 = "..."
1000205-77 = "[s] «Ты хочешь сказать, что взорвала ресторан просто потому, что тебе не понравилась еда?!»"
1000205-78 = "Дело не только в этом, Сенсей."
1000205-79 = "Когда подаёшь еду, важен не только вкус."
1000205-80 = "Их высокомерие, когда они заявили, что не принимают бронь на одного человека."
1000205-81 = "Их наглость, когда они не позволили мне, клиенту, самой выбрать блюдо."
1000205-82 = "Не было аперитива — ни коктейля перед едой. Даже амюз-буша не было. Перед трапезой ОБЯЗАТЕЛЬНО нужна маленькая закуска."
1000205-83 = "Они даже не спросили, какой прожарки я хочу стейк. Какая грубость!"
1000205-84 = "Все знают, что шатобриан нужно готовить до medium rare!"
1000205-85 = "В ресторане высокой кухни я ожидаю роскоши И в обслуживании, И в еде."
1000205-86 = "[s3] «Не уверен, что хоть что-то понимаю...»\n[s4] «Но вижу, что ты ужасно расстроена.»"
1000205-87 = "..."
1000205-88 = "..."
1000205-89 = "Но одно я им всё же засчитаю. Я не люблю есть хорошую еду в одиночестве."
1000205-90 = "Хе-хе."
1000205-91 = "Мне пора домой и в душ. От меня дымом пахнет..."
1000205-92 = "Я чувствую себя пережаренным якитори!"
1000205-93 = "Тогда ладно... Сенсей. В следующий раз мы встретимся уже с новой мной."
