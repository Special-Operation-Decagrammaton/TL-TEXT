1000205-15 = "...Хех. Сенсей! Не ожидала увидеть тебя здесь."
1000205-16 = "[s1] «Харуна! От тебя идёт дым?»\n[s2] «Ты вся в саже!»"
1000205-17 = "А, да. Это долгая история."
