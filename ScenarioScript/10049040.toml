10049040-127 = "(С-Страшно. О-Очень страшно.)"
10049040-128 = "(Я не могу... Я не могу это сделать. Слишком сильное давление, я...)"
10049040-129 = "Затвор вперёд! Термитовая Розовая здесь!"
10049040-130 = "А-А-А!!"
10049040-131 = "Рейса?!"
10049040-132 = "Сузуми! Время главной героини!"
