10049040-75 = "...а Жезл Списывания!"
10049040-76 = "Абракадабра!"
10049040-77 = "Я сделаю так, чтобы твои реплики появились у тебя на руке!"
10049040-78 = ""
10049040-80 = ""
10049040-81 = ""
10049040-82 = "Погоди! Нельзя просто... А-а!"
10049040-83 = ""
10049040-85 = ""
