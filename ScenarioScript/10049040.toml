10049040-100 = "Это никак не может сработать..."
10049040-101 = ""
10049040-105 = "Эй, вы двое? Ваш выход. Идите на сцену."
10049040-107 = "Есть!"
10049040-108 = "П-Погоди секунду. Я ещё даже не прочитала это!"
10049040-109 = "Разве Шимико тоже не должна это делать?!"
10049040-110 = "По расписанию здесь только мы вдвоём. Это наша вступительная сцена."
10049040-111 = ""
10049040-112 = "[ns5] «Выложитесь на полную!»\n[ns6] «Сияй ярче, Термитовая Белая!»"
10049040-115 = "А-А-а!!"
10049040-118 = ""
10049040-119 = ""
10049040-121 = "Это Термитовая Белая!!"
10049040-122 = "И Термитовая Розовая тоже!"
10049040-123 = "Белая такая красивая, как принцесса!!"
10049040-125 = "(Откуда вообще взялись все эти люди?)"
