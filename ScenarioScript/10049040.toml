[translation]
10049040-1 = "Эпизод 4;Мы — волшебницы!"
10049040-2 = "За кулисами"
10049040-3 = "Ух ты, мы правда здесь!"
10049040-4 = "Мы действительно будем участвовать в шоу про волшебниц!"
10049040-5 = "Т-Тсс! Тише, Рейса!"
10049040-7 = "Хм..."
10049040-8 = "Вы двое ТОЧНО пришли на выступление, да?"
10049040-9 = "Не помню ваших имён в списке, но чтобы проверить, мне пришлось бы идти обратно в офис, а прямо сейчас я этого делать не собираюсь."
10049040-10 = "!!"
10049040-11 = ""
10049040-13 = ""
10049040-15 = "(Если они узнают, что мы не из их команды...)"
10049040-16 = "(Мы раскроем прикрытие, и цели тоже всё поймут...)"
10049040-17 = "(Что делать...? Что делать...?)"
10049040-18 = "(Нужно что-то придумать...)"
10049040-19 = ""
10049040-21 = ""
10049040-22 = "От подающего лотка к патроннику: магия шести правых нарезов! Дай мне силу никогда не колебаться!"
10049040-23 = ""
10049040-26 = ""
10049040-28 = "Затвор вперёд! Термитовая Розовая здесь!"
10049040-29 = "Хорошо! Думаю, получилось!"
10049040-30 = "Рейса?!"
10049040-31 = "Ну же, Сузуми. Просто встань в позу..."
10049040-32 = "У-ух..."
10049040-33 = ""
10049040-35 = ""
10049040-36 = ""
10049040-38 = "Магическая, лирическая... Термитовая Белая!"
10049040-39 = ""
10049040-41 = ""
10049040-42 = "Х-Хорошо, отлично. Вы выходите через десять минут."
10049040-43 = ""
10049040-45 = ""
10049040-46 = "А-Ах..."
10049040-47 = "Фух, кризис миновал!"
10049040-48 = "Ты отлично справилась, Рейса, но что теперь?"
10049040-49 = "Мы правда будем это делать? НА СЦЕНЕ через десять минут?"
10049040-50 = "[s1] «Вообще-то, это даже хорошо.»\n[s2] «Со сцены у вас будет лучше обзор.»"
10049040-53 = "Ну, может быть..."
10049040-54 = "Но... я не смотрела шоу про волшебниц с детства..."
10049040-55 = "И стоять перед такой толпой... В ЭТОМ... Я уже потею от одной мысли!"
10049040-56 = "Не переживай, Сузуми! Ты крутая! Ты справишься!"
10049040-57 = "Когда ты работаешь линчевателем, ты СИЯЕШЬ перед людьми!"
10049040-58 = "Э-Это... СОВСЕМ другое."
10049040-59 = "Что делать...? Что делать...?"
10049040-60 = ""
10049040-61 = "[ns3] «Просто плыви по течению. Импровизируй.»\n[ns4] «Говори любые реплики, лишь бы дотянуть сцену.»"
10049040-64 = "Я вообще не знаю, КАК должны разговаривать волшебницы!"
10049040-65 = "О-о, реплики волшебниц? Я всё устрою."
10049040-66 = "Оставь мне!"
10049040-67 = ""
10049040-69 = ""
10049040-70 = ""
10049040-71 = ""
10049040-72 = ""
10049040-73 = "Рейса, откуда у тебя этот маркер?"
