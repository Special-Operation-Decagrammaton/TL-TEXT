[translation]
1010802-1 = "Бессонница"
1010802-2 = "На следующий день рано утром Юука пришла в офис Шале помочь с работой."
1010802-3 = "С виду она ничем не отличалась от обычной себя, но..."
1010802-4 = ""
1010802-6 = ""
1010802-7 = "[ns] «Юука, насчёт финансового отчёта, который ты прислала вчера...»"
1010802-8 = "..."
1010802-9 = "[ns] «Юука...?»"
1010802-10 = "П-Простите, Сенсей. Вы что-то говорили?"
1010802-11 = "[s1] «Да. Говорил, но...»\n[s2] «...тебя что-то беспокоит?»"
1010802-14 = "О, нет. Ничего. Я просто немного отвлеклась."
1010802-15 = "Вы спрашивали о вчерашнем отчёте, верно? Секундочку."
1010802-17 = "Всё утро ей было трудно сосредоточиться на работе."
1010802-18 = ""
1010802-20 = ""
1010802-21 = ""
1010802-22 = "А потом Юука внезапно уснула, что совсем не похоже на её обычно усердную натуру."
1010802-23 = "[ns] «Юука... Ты в порядке?»"
1010802-24 = "Да-да? Конечно, всё нормально... Ах!"
1010802-25 = ""
1010802-27 = ""
1010802-29 = ""
1010802-30 = "[ns3] «Юука, ты хорошо себя чувствуешь?»\n[ns4] «Сегодня тебе, похоже, трудно сосредоточиться.»"
1010802-33 = "Я-я совершенно здорова! Я нормально ем и не пропустила ни одного дня тренировок!"
1010802-34 = "Может, я немного устала, но никогда не позволю этому повлиять на мои обязанности представителя учеников!"
1010802-35 = "[s5] «Если тебе плохо, пожалуйста, скажи мне честно.»\n[s6] «Работа никуда не денется, а здоровье нужно беречь.»"
1010802-38 = "Э-э... Если вы так говорите..."
1010802-39 = "Правда в том..."
1010802-40 = ""
1010802-42 = "[ns] «...Бессонница?»"
1010802-43 = "Да, однажды на прошлой неделе работа Семинара не дала мне спать всю ночь..."
1010802-44 = "И, кажется, это сильно сбило мой режим сна. С тех пор каждую ночь я ворочаюсь и не могу уснуть."
1010802-45 = "На следующий день я настолько уставшая, что постоянно клюю носом, а потом этот порочный круг повторяется..."
1010802-46 = "Вчера я даже попыталась лечь пораньше, но в итоге всю ночь только ворочалась. Уснула уже когда начало светать."
1010802-47 = ""
1010802-50 = "[ns] «На сегодня хватит работы.»"
1010802-52 = "[ns7] «Юука, переоденься во что-нибудь удобное и встреть меня в гостиной.»\n[ns8] «Давай проведём тренировку сна, чтобы сегодня ночью ты нормально выспалась.»"
1010802-55 = "Вы хотите, чтобы я вздремнула в такое время дня?"
1010802-56 = "Если я посплю так рано, разве бессонница не станет ещё хуже?"
1010802-57 = "По-моему, я именно потому и не могу заснуть ночью, что режим сна уже сбился..."
1010802-58 = "[s9] «По крайней мере, прямо сейчас ты немного избавишься от усталости.»\n[s10] «Пока просто доверься мне.»"
1010802-61 = "Недопустимо, чтобы моё состояние мешало работе в Шале, поэтому..."
1010802-62 = "...Хорошо. Ладно. Сделаю. Я переоденусь и вернусь."
1010802-64 = ""
1010802-65 = ""
1010802-66 = "Как-то странно находиться в Шале в пижаме."
1010802-67 = "Так как работает эта «тренировка сна»?"
1010802-68 = "[s11] «Просто. Не напрягайся так из-за того, что нужно уснуть.»\n[s12] «Ляг на кровать и расслабься.»"
1010802-71 = "Что? И это всё, что я должна делать?"
1010802-72 = "Я уже перепробовала все мыслимые способы, но ничего не помогло."
1010802-73 = "И к тому же я не в привычной обстановке, так что, думаю, здесь уснуть будет ещё труднее, чем дома."
1010802-74 = "[s13] «Я же сказал: не переживай о том, уснёшь ты или нет.»\n[s14] «Просто попробуй отдохнуть. Не обращай внимания на окружающее.»"
1010802-77 = "(Хм... Лежать перед Сенсеем, когда мы здесь только вдвоём, как-то... странно...)"
1010802-78 = ""
1010802-80 = ""
1010802-81 = ""
1010802-82 = "(Я всё равно так не усну, так что, наверное, просто приведу мысли в порядок...)"
1010802-83 = "(В конце концов, я ни за что не смогу ус...)"
1010802-84 = "..."
1010802-85 = "..."
1010802-86 = ""
1010802-88 = ""
1010802-89 = ""
1010802-97 = "Хи-хи."
1010802-98 = "Давно я не чувствовала себя настолько отдохнувшей."
1010802-99 = "[s] «Хорошо поспала, Юука?»"
1010802-100 = "С-С-Сенсей? Я правда уснула?"
1010802-101 = "Сколько я спала? Уже ночь—"
1010802-102 = "[s] «Не переживай. Прошёл всего примерно час.»"
1010802-103 = "Слава богу... Даже представить страшно, если бы я проспала всю свою смену представителя учеников."
1010802-104 = ""
1010802-106 = ""
1010802-107 = ""
1010802-108 = "Но всё равно странно. Ночью я вообще не могу уснуть, а днём вот так запросто засыпаю..."
1010802-109 = "[s] «Может, тебе мешает именно давление от необходимости обязательно уснуть.»"
1010802-110 = "Давление?"
1010802-111 = "...Понимаю, к чему вы. Каждый раз, когда я лежу в постели, думаю только о том, что если не усну, следующий день будет испорчен, и начинаю тревожиться всё сильнее."
1010802-112 = "Наверное, это давление и мешает мне спать."
1010802-113 = "Но что, если сегодня ночью я не смогу уснуть из-за того, что сейчас так крепко поспала?"
1010802-114 = "[s] «Не пытайся всё время поддерживать себя в идеальном состоянии.»"
1010802-115 = ""
1010802-118 = "[ns] «Можешь пользоваться этой кроватью когда угодно, так что просто отдыхай, когда устала.»"
1010802-119 = "О... Вы всегда так добры ко мне, Сенсей..."
1010802-120 = "Спасибо. Но я не хочу обзавестись плохой привычкой, поэтому постараюсь не слишком часто спать днём."
1010802-121 = "Но и ваши слова игнорировать не стану. Я постараюсь помнить, что могу позволить себе перерыв, когда он нужен."
1010802-122 = ""
1010802-124 = ""
1010802-125 = ""
1010802-126 = "...И что ещё важнее! Сенсей! Вы ведь не говорите подобное другим студентам, правда?"
1010802-127 = "Какими бы хорошими ни были ваши намерения, предлагать студенту кровать — неподобающе. Вам следует лучше понимать, как могут истолковать ваши слова."
1010802-128 = ""
1010802-131 = "...Погодите, почему вы отводите взгляд?"
1010802-132 = "Ответьте прямо! Вы и другим студентам предлагаете эту кровать?"
1010802-133 = "СЭЭЭНСЭЭЭЙ!"
