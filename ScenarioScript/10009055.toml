[translation]
10009055-3 = "Ещё немного. Почти..."
10009055-4 = "Пожалуйста, подожди меня. Скоро... Своими собственными руками я..."
10009055-5 = ""
10009055-8 = "...!"
10009055-9 = ""
10009055-12 = ""
10009055-13 = "Достаточно."
10009055-14 = "Ты та, кто сопровождала Сенсея..."
10009055-15 = "Я не понимаю, почему ты нацелилась на Сенсея, но можешь не сомневаться — его уже отвели в безопасное место."
10009055-16 = "Я разберусь с этой проблемой здесь и сейчас, чтобы в будущем не случилось настоящей чрезвычайной ситуации."
10009055-17 = "Вот как? Хотела бы я посмотреть, как ты попытаешься."
10009055-18 = "Сопротивление бесполезно. Просто—"
10009055-19 = ""
10009055-22 = "Вот она! На этот раз тебе не сбежать, Лиса Бедствий!"
10009055-23 = ""
10009055-27 = "*тяжело дышит* Бежать больше некуда."
10009055-28 = "Готовься к аресту, Вакамо!"
10009055-29 = "Нашим оценкам конец, если мы снова позволим тебе сбежать!"
10009055-31 = "Р-руки вверх!"
10009055-32 = ""
10009055-34 = ""
10009055-35 = "*вздыхает* Я вымоталась..."
10009055-37 = "Полагаю, это мат."
10009055-38 = "Так и есть..."
10009055-39 = "...для меня. Хи-хи-хи."
10009055-40 = "...?"
10009055-41 = ""
10009055-43 = ""
10009055-44 = "Ещё совсем немного."
10009055-45 = ""
10009055-47 = ""
10009055-51 = "О-она убегает!"
10009055-52 = "Л-ловите её!"
10009055-62 = "Хорошо, что нам удалось остановить её, пока не стало слишком поздно."
10009055-63 = "На этот раз она сопротивлялась ещё сильнее."
10009055-64 = "Да, и это заставляет меня задуматься о том, что она сказала раньше."
10009055-65 = "[s] «Что ты имеешь в виду?»"
10009055-66 = "Простите. Ничего."
10009055-67 = "Но если отвлечься от этого, это уже пятый раз, когда она сбегает из-под стражи."
10009055-68 = "Поневоле начинаешь сомневаться в компетентности Полицейской академии Валькирии."
10009055-70 = "Это ещё мягко сказано. Они вообще ничего не понимают в безопасности."
10009055-71 = "[s] «Чихиро!»"
10009055-72 = "Здравствуйте, Сенсей. Я только что закончила проверку всех систем безопасности фестиваля."
10009055-73 = "Не ожидала, что мы встретимся снова так скоро — прежде всего потому, что недооценила, насколько всё станет плохо."
10009055-74 = "Веритас пришла к выводу, что с протоколами безопасности самих торговцев фестиваля проблем нет..."
10009055-75 = "...а вот Валькирия и её неспособность поддерживать общественный порядок — совсем другое дело."
10009055-76 = "Что здесь вообще происходит?"
10009055-77 = "[s] «Ты даже не представляешь, насколько права.»"
10009055-79 = "Н-ну да, она... говорит разумные вещи."
10009055-80 = "Но всё же...!"
10009055-81 = "По крайней мере, в поимке Вакамо у нас идеальная статистика!"
10009055-82 = "К тому же капитан сказала, что после последнего инцидента будут приняты особые меры!"
10009055-83 = "[s] «Какие именно особые меры?»"
10009055-84 = "Ну, капитан тоже уже недовольна тем, сколько раз Вакамо сбегала."
10009055-85 = "Она готова признать, что своими силами мы не справляемся, поэтому попросим помощи у сил других школ."
10009055-86 = "Говорят, мы привлекаем серьёзных бойцов, которые помогли остановить Лису Бедствий, когда та впервые сбежала из тюрьмы."
10009055-87 = "[s] «Хм. Это ведь означает...?»"
10009055-88 = ""
10009055-91 = ""
10009055-93 = ""
10009055-94 = "Именно. Поэтому с нами и связались, Сенсей."
10009055-95 = "Подумать только, Лиса Бедствий выбрала именно День святого Валентина для своего буйства."
10009055-96 = "Мы не можем позволить ей и дальше нарушать мир в такой важный день."
10009055-98 = "Кроме того случая, у меня не так много опыта взаимодействия с Лисой Бедствий. Но я здесь, чтобы оказать помощь от имени дисциплинарного комитета."
10009055-99 = "Не нужно так скромничать, Чинацу."
10009055-100 = "Вовсе нет. Давайте сделаем всё возможное, чтобы защитить фестиваль."
10009055-101 = "Давно мы вчетвером вот так не собирались."
10009055-102 = "Но ладно. Только скажите — и на этот раз мы вас выручим."
10009055-103 = "[s] «Понял. Спасибо всем.»"
10009055-105 = "Да!"
10009055-106 = "Валькирия тоже усиливает охрану, так что на этот раз Лисе Бедствий точно не сбежать!"
10009055-107 = "Дело в шляпе!"
10009055-109 = "А я пойду с ними проверить их протоколы безопасности."
10009055-110 = "Просто на всякий случай."
10009055-111 = "[s] «Вы с Юкой составите отличную команду!»"
10009055-112 = "Что...? А, вице-президент Веритас."
10009055-113 = "Д-да. Пожалуй, знать, что ты здесь, немного успокаивает..."
10009055-114 = "Лесть от казначея Семинар? Ты всегда такая кроткая рядом с Сенсеем?"
10009055-115 = "Впрочем, помощь я приветствую."
10009055-116 = "Х-ха-ха...#n(Гр-р-р-р!)"
10009055-117 = ""
10009055-119 = ""
10009055-120 = "Ну что, пойдём?"
10009055-121 = "Мы вернёмся, Сенсей."
10009055-122 = "[s] «Хорошо. Закончим это.»"
10009055-123 = ""
10009055-125 = ""
10009055-128 = "С таким численным преимуществом нам не о чем беспокоиться."
10009055-129 = "Предлагаю закончить патруль. Как вам, Сенсей?"
10009055-130 = "[s] «Ага... Хорошо.»"
