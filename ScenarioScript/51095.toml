[translation]
51095-8 = "...!"
51095-14 = "[ns] \"Yukari, você está bem?!\""
51095-20 = "M-Mesmo assim... eu..."
51095-23 = "Agora você entendeu, né? Eu não vou voltar."
51095-24 = "O Hyakkaryouran...#nNós—já não podemos mais voltar ao que éramos."
51095-25 = "..."
51095-27 = "Mas não me entenda mal, Yukari."
51095-28 = "Para começo de conversa, você é diferente de nós. Não tem necessidade nenhuma de voltar para o Hyakkaryouran."
51095-29 = "Não é verdade?#nAfinal, você tem um lugar para onde voltar—"
51095-30 = "...!"
51095-31 = "Ngh...!"
51095-32 = "[s1] \"A Yukari veio até aqui acreditando que você a ajudaria, Renge.\"\n[s2] \"Será que você não pode ouvi-la só mais um pouco?\""
51095-35 = "Não..."
51095-40 = "Não há mais nada para conversar."
51095-41 = "Yukari, deixe eu te dar um conselho como sua senpai."
51095-42 = "Desista de coisas inúteis e aproveite a sua juventude enquanto ainda pode."
51095-43 = "Ficar se apegando ao passado só faz o tempo passar à toa."
51095-48 = "...Era só isso que eu tinha para dizer. Até mais."
51095-53 = "R-Renge-chan! Espere, por favor!"
51095-54 = "Aah... O-O que a gente faz?!"
51095-55 = "...Sensei, nós já vamos indo."
51095-56 = "[s] \"Certo, cuidem bem da Renge, meninas.\""
51095-63 = "...Renge-senpai."
51095-65 = "(Mesmo depois que a Renge e o Clube de Disciplina Interior desapareceram de vista, Yukari não conseguiu se mover do lugar)"
51095-67 = "Próximo;Bochechas Ruborizadas"
