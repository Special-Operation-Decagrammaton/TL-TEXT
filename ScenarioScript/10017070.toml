[translation]
10017070-1 = "Эпизод 7;Грозовой перевал"
10017070-2 = "Вход в White & Mason"
10017070-3 = "Хмф. Это сложнее, чем я думала!"
10017070-4 = "Ничего! Они почти готовы! Ещё один серьёзный удар — и мы их добьём!"
10017070-6 = "Ч-что вообще сейчас происходит?"
10017070-8 = "Правда хотите знать? Конечно хотите!"
10017070-9 = "К вашему счастью, я обожаю монологи! Всё просто! Боевая группа Правосудия действительно украла нашу курицу!"
10017070-10 = "И мы использовали это абсолютно правдивое утверждение, чтобы стравить Рыцарей скорой помощи с Боевой группой Правосудия!"
10017070-11 = "Но я не ожидала, что всё сработает настолько хорошо. Хахаха!"
10017070-12 = "[s] «Хасуми, вы правда украли их курицу?»"
10017070-14 = "Мы забрали нечто, что они называли курицей, Сенсей, да..."
10017070-15 = "Но я не уверена, что это вообще можно было считать курицей."
10017070-17 = ""
10017070-19 = ""
10017070-20 = "Н-не смейте клеветать на нашу курицу!"
10017070-21 = "Ага! Не смейте не уважать творческий труд, вложенный в нашу «Адскую курицу»!"
10017070-23 = "Адская... что?"
10017070-24 = "Ваша что?!"
10017070-25 = "[s] «Простите, можете повторить?»"
10017070-27 = "Вы уже впечатлены! И правильно! «Адская курица» проверяет сами физические пределы остроты!"
10017070-28 = "И ни капли искусственного капсаицина!"
10017070-29 = "Точно! Вместо этого мы достигли 2,2 миллиона единиц Сковилла с помощью печально известного «Жнеца Кивотоса» — самого уничтожающего рот перца во всём Кивотосе!"
10017070-30 = "Я принесла последние кусочки «Адской курицы». Хотите посмотреть?"
10017070-31 = ""
10017070-33 = ""
10017070-37 = "О! У меня глаза жжёт уже от одного взгляда."
10017070-38 = "Ух... У меня слёзы. *шмыгает носом*"
10017070-39 = "Эй, плохо, что я её потрогала и теперь чувствую покалывание в руке?"
10017070-40 = "Ого! Кожа опухает! Охлаждающие пластыри! Где охлаждающие пластыри?!"
10017070-41 = "[ns1] «Я чувствую, как вкусовые рецепторы горят уже от запаха!»\n[ns2] «Это считается биологической войной?!»"
10017070-44 = "Разумеется, никто не хотел это есть."
10017070-45 = "Или точнее, никто не мог это есть."
10017070-46 = "Даже тогда мы не вмешивались, пока они не начали давить на прохожих, заставляя покупать эту курицу."
10017070-48 = ""
10017070-50 = ""
10017070-51 = "О-они просто не понимали искусства «Адской курицы»! Мы лишь пытались бросить вызов их предубеждениям и вкусовым рецепторам!"
10017070-52 = "Даже какая-то студент Геенны с нами согласился!"
10017070-54 = "Естественно, Боевая группа Правосудия должна была остановить их запугивание и кулинарный террор."
10017070-55 = "Нам пришлось наказать их за то, что они буквально навязывали свои вкусы прохожим."
10017070-56 = "И, конечно, мы решили заодно избавиться от промышленных отходов, которые они называли курицей."
10017070-57 = "Промышленные отходы?! Извинитесь перед духом «Адской курицы»!"
10017070-58 = "Вы пытались вымогать деньги у людей!"
10017070-59 = "Ну, расходы ведь надо как-то покрывать, понимаете? Разработка соуса, закупка ингредиентов, компенсации за несчастные случаи на работе..."
10017070-60 = "Ага! Мы инвесторы! В передовые куриные технологии! Вполне справедливо, что мы должны получать прибыль!"
10017070-62 = "Прибыль, превышающую ваши расходы на четыреста процентов?"
10017070-63 = "А как насчёт слов людям: «Если не хотите почувствовать жжение от этой курицы, я сама вас поджарю»?"
10017070-64 = "Как видите, капитан Майн, именно в этом и была настоящая проблема."
10017070-65 = "..."
10017070-67 = ""
10017070-69 = ""
10017070-70 = "Мы закончили разговоры? Можно перейти к весёлой части? И Боевая группа Правосудия, и Рыцари скорой помощи уже в полном раздрае."
10017070-71 = "Мы достаточно ждали. Пусть они начнут, или сами дадим старт?"
10017070-72 = "Если честно, стратегия «разделяй и властвуй» такая весёлая, знаете?"
10017070-74 = "Как бессердечно!"
10017070-75 = "М-мы вам доверяли!"
10017070-76 = "Вы воспользовались нашей добротой, чтобы устроить драку!"
10017070-77 = "И ещё на Рождество, когда все должны быть счастливы! Вы ужасны!"
10017070-78 = "От Санта-Клауса вы получите только кусок угля!"
10017070-80 = ""
10017070-82 = ""
10017070-83 = "Простите, что? Ты реально до сих пор веришь в Санту?"
10017070-84 = "О, отлично, ещё один шанс произнести монолог. Санта—"
10017070-86 = "Достаточно."
10017070-87 = ""
10017070-89 = ""
10017070-90 = "Что? Сверли меня взглядом сколько хочешь, я не боюсь таких, как ты!"
10017070-91 = "Я заставлю тебя убежать в слезах! И буду кричать правду о Санте тебе вслед!"
10017070-93 = "Я сказала прекратить!"
10017070-95 = "[ns3] «Пожалуйста, не злите Сэрину и Ханаэ ещё сильнее.»\n[ns4] «Пользоваться чужой добротой... Я тоже этого не терплю!»"
10017070-98 = ""
10017070-99 = "Эм, Сенсей?"
10017070-100 = "Э-это лицо!"
10017070-101 = ""
10017070-103 = ""
10017070-106 = ""
10017070-107 = "Сэрина, Ханаэ."
10017070-109 = "Капитан..."
10017070-110 = "Капитан!"
10017070-112 = "Не уверена, что сейчас заслуживаю этого звания."
10017070-113 = "Но мне нужна ваша помощь. Вы сможете мне помочь?"
10017070-115 = "Да! Конечно, капитан!"
10017070-116 = "Мы всегда будем верить в вас, капитан!"
10017070-118 = "Спасибо. Начнём?"
10017070-119 = "Кррааагх..."
10017070-121 = ""
10017070-123 = ""
10017070-125 = "Я... тоже..."
10017070-127 = ""
10017070-129 = ""
10017070-130 = "И-и-и!"
10017070-131 = "Ч-что происходит? Я думала, она потеряла сознание во время боя!"
10017070-132 = "Я-я понятия не имею! Ещё мгновение назад она выглядела точь-в-точь как отключившийся новорождённый муравьед!"
10017070-133 = "У нас нет выбора, придётся разбираться! Она наверняка хотя бы ранена!"
10017070-135 = "...В итоге наше самое ценное оружие, Цуруги, сохранилось. Пусть и случайно."
10017070-137 = "Кекекекеке!"
10017070-138 = "Пора положить конец этой чепухе!"
10017070-140 = "Ступайте вперёд с верой и честью в сердце!"
