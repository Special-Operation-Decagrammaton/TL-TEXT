[translation]
2300205-1 = "Радиогимнастика"
2300205-2 = "Дом Шале"
2300205-3 = "В выходной я решил поспать подольше, как вдруг..."
2300205-4 = ""
2300205-5 = "Время радиогимнастики!"
2300205-6 = "Сенсей! Скорее вставай!"
2300205-7 = "[s] «Можно мне хотя бы в выходной отдохнуть...»"
2300205-8 = "Нет! Если всё свободное время проводить во сне, превратишься в корову."
2300205-9 = "Сейчас ты вялый, но стоит подвигаться — сразу станет лучше!"
2300205-11 = "...А если продолжишь лениться, я хорошенько пну тебя под зад!"
2300205-12 = "[s] Неохотно встать с кровати."
2300205-14 = "Начинаем радиогимнастику! Следуй ритму и повторяй за мной!"
2300205-15 = "Сначала растяжка! Раз, два!"
2300205-16 = "Не так, Сенсей! Выпрями руки и подними их к голове!"
2300205-17 = "Если будешь делать спустя рукава, золотую звёздочку не получишь."
2300205-18 = "С самого начала! Раз, два!"
2300205-20 = "После этого мы с Ханаэ вместе сделали радиогимнастику."
