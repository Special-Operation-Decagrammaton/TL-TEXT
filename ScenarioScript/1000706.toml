[translation]
1000706-1 = "Эстетическое обслуживание"
1000706-2 = "Город Кивотос"
1000706-3 = "Ура! Спасибо за мороженое, Сенсей."
1000706-4 = "[s] «Считай это подарком за успешно сданную пересдачу.»"
1000706-5 = "Мне кажется, это я должна подарить тебе что-нибудь за то, что ты со мной занимался..."
1000706-6 = "Но я ни за что не откажусь от еды от тебя, Сенсей!"
1000706-7 = "Кстати, вспомнила, Сенсей. Ты знал, что неподалёку открылся новый магазин одежды?"
1000706-8 = "Когда я проходила мимо, там было много модной одежды для людей твоего возраста."
1000706-9 = "Уверена, мы найдём для тебя что-нибудь идеальное. Я помогу выбрать, так что пошли!"
1000706-10 = "[s] «Договорились.»"
1000706-11 = "Ля-ля-ля! Шопинг с Сенсеем! ♪"
1000706-12 = "Хм. Что это за запах?"
1000706-13 = ""
1000706-14 = "Фу. Кто-то опять выбросил мусор у той стены."
1000706-15 = "[s] «Опять? Такое часто бывает?»"
1000706-16 = "Ага. Это место не видно с улицы и стена вся в граффити, поэтому сюда часто сваливают мусор."
1000706-17 = "Будто у людей вообще совести нет, раз стена и так грязная."
1000706-18 = "Может, если бы здесь было чище, мусорить так охотно не стали бы..."
1000706-19 = "[s] «Логично. Понимаю, почему это проблема.»"
1000706-20 = "Ага. Большая проблема..."
1000706-21 = ""
1000706-22 = "..."
1000706-24 = ""
1000706-25 = ""
1000706-26 = ""
1000706-27 = "Ля-ля-ля! ♪ Вот и весь мусор. Теперь здесь должно быть намного чище."
1000706-28 = "[s] «Что ты делаешь?»"
1000706-29 = "А-а-а! С-Сенсей, когда ты пришёл?"
1000706-30 = "Клянусь, я ничего подозрительного не делала..."
1000706-31 = "[s] «...Ты рисуешь на стене?»"
1000706-32 = "Н-Ну... стена вся грязная и старая... Я подумала, если нарисовать на ней что-нибудь красивое, люди перестанут бросать здесь мусор."
1000706-33 = "Я знаю, что нарушаю наше обещание. Прости."
1000706-34 = "Ты злишься на меня, Сенсей? *стон*..."
1000706-35 = "[s] «Только в этот раз.»"
1000706-36 = "А?"
1000706-37 = "[s] «Только в этот раз я закрою глаза.»"
1000706-38 = "Сенсей... Ты лучший!"
1000706-39 = "[s] «Но когда закончишь, мы вместе извинимся перед владельцем.»"
1000706-40 = "Угх, ладно. Наверное, я хотя бы это ему должна."
1000706-41 = "Но я рада, что ты будешь со мной. Не хочу снова одна попасть в участок."
1000706-42 = "Поможешь оттащить последнюю кучу хлама, Сенсей?"
1000706-43 = "[s] «Конечно.»"
1000706-44 = "Ха. Спасибо."
1000706-45 = "Надеюсь, люди перестанут бросать здесь мусор."
