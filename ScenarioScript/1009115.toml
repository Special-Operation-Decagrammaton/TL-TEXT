[translation]
1009115-1 = "Тёплый тон"
1009115-2 = "На следующий день я пришёл встретиться с Казусой в месте, которое отправил ей заранее."
1009115-4 = "Фойе аудиокомнаты"
1009115-5 = ""
1009115-7 = ""
1009115-8 = "Ч-Что это за место...?"
1009115-9 = "Приветствуем гостей."
1009115-10 = "Добро пожаловать в аудиокомнату «Демингтон»."
1009115-11 = "«Аудиокомната»...?"
1009115-12 = "«Пространство, созданное для того, чтобы аудиофилы могли наслаждаться музыкой в разных формах с помощью нашей коллекции винтажной аудиотехники.»"
1009115-13 = "Не знала, что такие места вообще существуют. Круто."
1009115-14 = "Почему-то ощущается как-то... по-взрослому."
1009115-15 = "Что будете пить?"
1009115-16 = "Н-Напиток? Нам?"
1009115-17 = ""
1009115-18 = "[ns] «Два холодных чая, пожалуйста.»"
1009115-19 = "Подойдёт смесь Тринити Candy Blend?"
1009115-20 = "Сейчас принесу два стакана со льдом."
1009115-21 = "Пожалуйста, следуйте за мной в аудиокомнату."
1009115-23 = "Внутри аудиокомнаты"
1009115-24 = "Так, значит, сюда приходят слушать музыку..."
1009115-25 = "Но, Сенсей, там вы были таким ВЗРОСЛЫМ."
1009115-26 = "[s] «Потому что я взрослый?»"
1009115-27 = "Хм? Что вы сказали?"
1009115-28 = "Так вы уже бывали здесь? Вели себя так, будто вам тут всё принадлежит."
1009115-29 = "...Ха-ха, шучу, шучу."
1009115-30 = "Чт—? Вы изучили всё в интернете перед тем, как прийти?"
1009115-31 = "А, ну, эм..."
1009115-32 = ""
1009115-34 = ""
1009115-35 = "Простите..."
1009115-36 = "[s] «Не нужно извиняться!»"
1009115-37 = "Л-Ладно, если вы так говорите..."
1009115-38 = "Именно поэтому я и хотела сюда прийти."
1009115-39 = ""
1009115-41 = ""
1009115-43 = "Хм? Я выпустила альбом?"
1009115-44 = "Ха! Да ну. Это всего лишь одна пластинка, которую я записала для личной коллекции."
1009115-45 = "Сейчас есть места, где тебе могут отпечатать пластинку, если отправить аудиофайл."
1009115-46 = ""
1009115-48 = ""
1009115-49 = "..."
1009115-50 = "Я прямо увидела эту мысль у вас в голове! «Зачем делать пластинку, если у тебя нет проигрывателя?» Да?"
1009115-51 = "[s] «Я?!»"
1009115-52 = "Ну... если честно, мне нечего сказать в своё оправдание..."
1009115-53 = "[s] «Мне такое даже в голову не приходило!»"
1009115-54 = "Знаете, Сенсей, я тут подумала. В жизни бывают моменты, когда эмоции побеждают логику."
1009115-55 = "Например, люди покупают торт из-за внешнего вида, даже если им не нравится его вкус."
1009115-56 = "Думаю, поэтому мне и понравилась идея сделать пластинку."
1009115-57 = "Для нынешних учеников это довольно непривычная вещь, и именно поэтому в ней есть такой винтажный шарм."
1009115-58 = "Вот я и заказала одну. По-моему, получилось довольно неплохо."
1009115-59 = "В любом случае, мне показалось жалко просто повесить её на стену и никогда не дать ей выполнить своё настоящее предназначение."
1009115-60 = "Я слышала, что у пластинок звук бывает немного более... «тёплым», чем у цифровых треков, и мне стало любопытно."
1009115-61 = "Я пыталась придумать, как её послушать, не покупая целый проигрыватель..."
1009115-62 = "И тогда я написала вам."
1009115-63 = "Что, очевидно, было правильным решением. Хи-хи."
1009115-64 = "Ну что, попробуем её поставить?"
1009115-65 = "Нужно аккуратно достать, чтобы не оставить отпечатков пальцев."
1009115-66 = ""
1009115-68 = ""
1009115-69 = "Кладём её на проигрыватель..."
1009115-70 = "А потом... Эм..."
1009115-71 = "Сенсей... Иглу ставить на самую внутреннюю или внешнюю дорожку пластинки?"
1009115-72 = "[s] «Эм, ну...»"
1009115-73 = ""
1009115-75 = ""
1009115-77 = "К счастью, сотрудник как раз принёс наш холодный чай, и в итоге нам удалось запустить пластинку."
1009115-78 = "Мы вместе послушали песню Казусы."
1009115-80 = "М-м, немного неловко."
1009115-81 = "Слушать собственное пение, когда вы ещё и сидите рядом..."
1009115-82 = "Ну как вам, Сенсей?"
1009115-83 = "[s1] «Немного неуклюже...»\n[s2] «Но зато по-молодому и приятно.»"
1009115-86 = ""
1009115-88 = ""
1009115-89 = "«Неуклюже»..."
1009115-90 = "Вот как вы говорите..."
1009115-91 = "[s] «Я-Я что-то не то сказал?!»"
1009115-92 = "Нет, всё именно так."
1009115-93 = "Это первый раз, когда Sugar Rush смогли сыграть песню от начала до конца, ни разу не остановившись."
1009115-94 = "Так что, конечно, местами всё немного неуклюже. Главное, что несмотря ни на что мы всё-таки сделали это."
1009115-95 = "Кто-то немного переборщил, кто-то другой полностью запорол целый куплет..."
1009115-96 = "...а я кучу раз сыграла не ту ноту."
1009115-97 = "И именно поэтому мне и захотелось... «записать» всё это на пластинку."
1009115-98 = "Обычно выпускают только чистую, идеально отполированную версию записи. Закулисные варианты услышишь нечасто."
1009115-99 = "Но я хочу сохранить и воспоминания обо всех неровностях и провалах, через которые мы прошли в процессе."
1009115-100 = "Короче говоря..."
1009115-101 = "[s] «Вся суть в вайбе.»"
1009115-102 = "Вся суть в вайбе."
1009115-103 = "..."
1009115-104 = "А, песня закончилась."
1009115-105 = "[s] «Хм? Пластинка всё ещё играет...»"
1009115-106 = ""
1009115-107 = "Раздался знакомый голос, поющий знакомую песню."
1009115-108 = "Но это был не голос Казусы."
1009115-109 = "Это был..."
1009115-110 = ""
1009115-111 = "[ns] «Погоди, это же...?!»"
1009115-112 = "Фу-фу, я знала, что вы сразу заметите, Сенсей."
1009115-113 = "[s3] «Конечно замечу! Это мой голос!»\n[s4] «Когда ты это записала?!»"
1009115-116 = "В прошлый раз, в караоке."
1009115-117 = "Разве вы не знали, что современные караоке-машины умеют записывать и даже отправлять аудиофайлы одним нажатием кнопки, Сенсей?"
1009115-118 = "Если прислушаетесь, возможно, даже услышите, как я подыгрываю вам на тамбурине."
1009115-119 = "[s5] «Мир развивается так быстро...»\n[s6] «Но погоди, почему моя песня тоже на пластинке?»"
1009115-122 = "...Потому что всё это время вы усердно работали рядом с нами."
1009115-123 = "Разве не очевидно, что вы тоже заслуживаете быть на этой записи, Сенсей?"
1009115-124 = "В общем..."
1009115-125 = "Какой тёплый голос."
1009115-126 = "..."
1009115-127 = ""
1009115-129 = ""
1009115-130 = "Нет! Я имела в виду тон пластинки! Этот особый аналоговый шум, которого не почувствуешь в цифровом треке, — да! Вот! Всё из-за этого старомодного звучания!"
1009115-132 = "...Тепло."
