211160-1 = "Эпизод 16;Чему суждено случиться, того не миновать"
211160-3 = ""
211160-4 = "Что происходит?"
211160-5 = "Без понятия. Пандемониум уже сто лет не показывался на публике."
211160-8 = "Нам ОБЯЗАТЕЛЬНО это слушать?"
211160-9 = "Наверное. Вон сколько огромных колонок поставили. Должно быть, скажут что-то важное."
211160-10 = "Похоже на пустую трату времени... Ну ладно. Хотя бы послушаем."
211160-13 = "[ns] «Сколько же здесь студентов...!»"
211160-14 = "Ки-хе-хе...! Да, именно этого я и добивалась."
211160-15 = "Вся слава Геенны должна доставаться только мне!"
211160-16 = "Все купаются в лучах величия Макото! Такая огромная толпа, а она даже не волнуется."
211160-17 = "Как впечатляет! Кажется, столько народу не собиралось уже очень давно! В следующем «Еженедельном Пандемониуме» будут потрясающие репортажи!"
211160-18 = "Такой шанс выпадает редко! Ну-ка, покажите ваши улыбки!"
