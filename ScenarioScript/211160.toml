211160-16 = "Impressionante, Makoto-chan. Com essa multidão toda diante de você e nem um pingo de nervosismo～"
211160-17 = "Incrível! Fazia tempo que o pátio não ficava tão abarrotado assim!#nUma oportunidade de ouro para registrar essa massa em fotos panorâmicas!"
