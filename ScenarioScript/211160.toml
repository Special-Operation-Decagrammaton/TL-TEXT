211160-200 = ""
211160-204 = ""
211160-205 = "..."
211160-206 = "С этого мгновения я, Ханума Макото, председатель Пандемониума Геенны, объявляю всей Геенне..."
211160-207 = "Геенна..."
211160-208 = ""
211160-210 = ""
211160-211 = "...вступает в полномасштабную войну со всем Кивотосом!!!"
211160-212 = ""
211160-214 = ""
211160-215 = "Э...?"
211160-216 = "[s] «Макото...?»"
211160-217 = "Бойцы! Соратники! Поднимите головы и слушайте!"
211160-218 = "Чем мы занимались всё это время? Невзирая на наши славные традиции железа и крови, мы растрачивали своё благородство на ничтожные отклонения и бессмысленные тревоги."
211160-219 = "Теперь этому легкомыслию конец."
211160-220 = "Проблемы Геенны невозможно решить ни голосованием большинства, ни пустыми переговорами, ни жалкими компромиссами."
211160-221 = "Железо и кровь! Только эти силы способны вращать колёса истории!!!"
211160-222 = "Поднимите мечи и ружья!!! Законные владения Геенны не должны ограничиваться стенами нашей академии!"
211160-223 = "Куда бы ни ступили наши сапоги, куда бы ни были направлены наши орудия, все эти земли станут нашим законным жизненным пространством. Нашей славной, единой Геенной!"
211160-225 = "Слабаки из Кивотоса задрожат от страха и преклонят колени перед нашим единством!"
211160-228 = ""
211160-229 = "..."
211160-230 = "...Э-эта дура снова несёт какую-то чушь...!!!"
211160-231 = "[ns] «...Макото, что ты вообще...»"
211160-234 = ""
211160-235 = ""
211160-239 = ""
211160-240 = "О-о-о!"
211160-241 = "Вперёд!!! Единая Геенна! Единое знамя!"
211160-242 = "Вернём Геенне её законные земли!!! Сражайтесь! Завоёвывайте!"
211160-243 = "Ч-Что за?!"
211160-244 = "Что происходит?"
211160-245 = ""
211160-249 = "Э-это розыгрыш?! Ну... флешмоб? Ладно, меня удивили! Попалась!"
211160-250 = "Макото...?"
211160-251 = "..."
211160-252 = ""
211160-253 = "Вперёд! В бой! Во славу Геенны!!!"
211160-254 = ""
211160-258 = ""
211160-259 = ""
211160-261 = ""
211160-263 = "Г-глава Префектов...!"
211160-264 = "Она пришла арестовать председателя?"
211160-266 = "[ns] «Хина...!»"
211160-267 = ""
211160-269 = ""
211160-270 = "..."
211160-271 = ""
211160-273 = "..."
211160-275 = "...Пора."
211160-276 = ""
211160-278 = ""
211160-280 = "Наконец-то..."
211160-281 = "Эпоха величия Геенны началась вновь."
211160-283 = "[ns] «Хина?»"
211160-284 = "Как я могла понять это только сейчас?"
211160-285 = "Истинное предназначение Префектуры не в том, чтобы подавлять беспорядки внутри Геенны, а в том, чтобы воплощать её волю. Мы установим единственный порядок во всём Кивотосе."
211160-286 = ""
211160-288 = ""
211160-289 = "...Председатель...?"
211160-290 = ""
211160-293 = "Фу-фу, превосходно сказано, председатель!"
211160-294 = "Э...?"
211160-295 = ""
211160-297 = ""
211160-298 = ""
211160-299 = "Своевременное и решительное решение. Она указывает нам путь, по которому мы должны идти."
211160-300 = "Старший администратор...? Что вы...?"
211160-304 = ""
211160-305 = "Председатель Ханума Макото. Ваше заявление совершенно обоснованно."
211160-306 = "Не могу сказать, что раньше мы хорошо ладили, но лишь потому, что я не понимала своего истинного предназначения."
211160-307 = "Отныне Префектура станет острейшим мечом Геенны и её самой быстрой пулей. Мы возглавим завоевание Кивотоса."
211160-308 = ""
211160-310 = ""
211160-312 = ""
211160-317 = "Ки-хе-хе... Добро пожаловать, Сорасаки Хина."
211160-318 = "И теперь... Геенна действительно стала единым целым."
211160-320 = "Вместе обрушим ужас на ненавистных врагов за нашими стенами."
211160-321 = "А. Разумеется."
211160-322 = ""
211160-325 = "Во имя великой Геенны развяжем священную войну, чтобы исправить этот извращённый Кивотос и установить истинный порядок."
