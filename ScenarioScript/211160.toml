211160-214 = ""
211160-215 = "Hã... quê?!"
211160-216 = "[s] \"Makoto...?!\""
211160-217 = "Erguei vossas cabeças, discentes!"
211160-218 = "Apesar de carregarmos no peito a tradição sagrada de ferro e sangue, o que fizemos até hoje?#nDesperdiçamos nossa nobreza em transgressões mesquinhas e algazarras insignificantes!"
211160-219 = "Porém, essa era de covardia encerra-se aqui."
211160-220 = "Gehenna――não marchará por deliberações de maioria, pactos ocos ou concessões frouxas!"
211160-221 = "Ferro e sangue! Esta é a única e verdadeira força motriz capaz de girar as engrenagens da história humana!!"
211160-222 = "Empunhem as baionetas!!#nGehenna jamais se curvará aos limites destes muros acanhados!"
211160-223 = "Toda a terra sob os nossos passos deve consagrar-se como território de Gehenna!"
211160-225 = "E diante do nosso exército unificado, a frouxa Kivotos estremecerá em pavor e cairá de joelhos aos nossos pés!!"
