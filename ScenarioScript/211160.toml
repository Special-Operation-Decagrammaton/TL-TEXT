211160-300 = "Diretora Ako...? Mas do que você tá falando...?"
211160-304 = ""
211160-305 = "Presidente Hanuma Makoto: sua proclamação foi impecável."
211160-306 = "Jamais nutrimos simpatia mútua... Mas apenas porque ambas ignorávamos o horizonte para onde devíamos convergir."
211160-307 = "Doravante, o Comitê de Disciplina será a lâmina mais afiada e o projétil mais veloz na vanguarda do exército de Gehenna."
