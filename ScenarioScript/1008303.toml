[translation]
1008303-1 = "Разорвать связи с убеждённостью"
1008303-4 = ""
1008303-5 = "Как и обещала, я пришла."
1008303-6 = "[s1] «Всё это происходит так внезапно...»\n[s2] «Да. Ты и правда здесь...»"
1008303-9 = "Ваша реакция довольно вялая."
1008303-10 = "Неужели неожиданный визит студенты здесь не приветствуется?"
1008303-11 = "Сильно сомневаюсь. Я слышала, что Шале принимает с распростёртыми объятиями абсолютно всех студентов."
1008303-12 = "Тогда, методом исключения..."
1008303-13 = "Вас не устраивает именно моё присутствие?"
1008303-14 = "[s3] «Нет! Совсем нет! Ни в коем случае! Всё не так!»\n[s4] «Я безумно рад, что ты здесь!»"
1008303-17 = "...Понятно."
1008303-18 = "Эм."
1008303-19 = "Нет нужды так показательно меня заверять."
1008303-20 = "Я пошутила."
1008303-21 = "[s] «П-Правда? Кажется, твои шутки для меня слишком высокого уровня...»"
1008303-22 = "Звучит почти как насмешка, но я пропущу это мимо ушей."
1008303-23 = "Довольно любезностей."
1008303-24 = "Я пришла сюда по делу."
1008303-25 = "Вам интересно, каковы мои мотивы?"
1008303-26 = "Всё довольно просто."
1008303-27 = ""
1008303-29 = ""
1008303-30 = "Ваш ремонт нашей клубной комнаты вызвал бурное одобрение."
1008303-33 = "Студенты восклицают что-то вроде: «Теперь нам не придётся расставлять вёдра во время дождя!» и «Я могу ходить, не боясь провалиться сквозь пол!»"
1008303-34 = "Одна даже сказала: «Ого! А я не знала, что двери вообще должны не пропускать дождь и ветер!»"
1008303-35 = "[s] «Эм, да что у вас вообще за жизнь была?!»"
1008303-38 = "Возможно, наши студенты слегка приукрасили свои рассказы. Как бы то ни было, они благодарны. Как и я."
1008303-39 = "Как я уже говорила, я не из тех, кто забывает о своих долгах."
1008303-40 = "Поэтому я, Кирю Кикё, сегодня помогу Сенсею из Шале с вашими обязанностями."
1008303-41 = ""
1008303-43 = ""
1008303-45 = ""
1008303-46 = "Возможно, это единственный в жизни шанс отдавать приказы оперативному офицеру Хяккарёран."
1008303-47 = "Этого будет достаточно, чтобы должным образом вернуть вам долг?"
1008303-48 = "[s5] «Я помогал тебе не ради какой-либо компенсации.»\n[s6] «Того ужина в прошлый раз было более чем достаточно.»"
1008303-51 = "...Ложь."
1008303-52 = "[s] «...А?»"
1008303-53 = "Вы напоминаете мне мальчика, который кричал «волк». Лжеца."
1008303-54 = "На этой планете нет настолько бескорыстного существа, чтобы довольствоваться одним ужином в качестве платы за целый день тяжёлой работы."
1008303-55 = "Не нужно изображать такую скромность."
1008303-56 = "Человеческие отношения строятся на взаимном обмене."
1008303-57 = "Если одна сторона только отдаёт, а другая лишь принимает... это уже не отношения вовсе."
1008303-58 = "Люди жадны. Они используют других для достижения собственных целей и в ответ позволяют использовать себя."
1008303-59 = "Можете сколько угодно изображать невинность и простодушие. Меня вам не обмануть."
1008303-60 = "Давайте не будем продолжать этот танец формальностей. Я ненавижу тратить время впустую."
1008303-61 = "Я использовала Шале как средство для достижения своих целей. Теперь у вас есть возможность использовать Кирю Кикё ради своих."
1008303-62 = "Такую возможность я предоставляю далеко не каждому."
1008303-63 = ""
1008303-66 = "[ns7] «Хорошо. Раз ты так говоришь, Кикё.»\n[ns8] «Ты права. Глупо было бы упускать такую возможность.»"
1008303-69 = "...Вот так всё и должно быть."
1008303-70 = "Я, Кирю Кикё, исполню свой долг и доведу до совершенства любую задачу, которую вы мне поручите."
1008303-71 = ""
1008303-73 = ""
1008303-75 = "(...Этого должно хватить.)"
1008303-76 = "(Я выполню просьбу Сенсея, и мой долг будет погашен.)"
1008303-77 = "(Баланс сил в наших отношениях снова восстановится.)"
1008303-78 = "[ns] «Моя задача для тебя — сегодня отдохнуть.»"
1008303-79 = ""
1008303-81 = ""
1008303-82 = "...Простите?"
1008303-83 = "Это жалкая попытка пошутить?"
1008303-84 = "Или вам ещё и уши прочистить?"
1008303-85 = "Я предлагаю вам воспользоваться выдающимися услугами оперативного офицера Хяккарёран."
1008303-86 = "Вы снова надо мной издеваетесь?"
1008303-87 = "[s] «Нет! Я совершенно серьёзно поручаю тебе отдохнуть.»"
1008303-88 = ""
1008303-90 = ""
1008303-91 = "[ns] «Разве ты не оперативный офицер? Ты должна знать, насколько важен отдых!»"
1008303-92 = ""
1008303-94 = ""
1008303-95 = "К-Конечно я это знаю!"
1008303-96 = "Можно даже утверждать, что отдых важнее, чем эффективность процессов во время операции."
1008303-97 = "Но я не позволю вашей уловке меня отвлечь."
1008303-98 = "Вы цепляетесь за формальности."
1008303-99 = "[s] «Ты велела дать тебе задачу. Я дал. А что будет дальше — уже решать тебе.»"
1008303-100 = "То есть право выбора снова возвращается ко мне?"
1008303-101 = "Вы непостижимы."
1008303-102 = "[s] «Мне без разницы, сдержишь ты своё слово или нет.»"
1008303-103 = "...!"
1008303-104 = "Ха."
1008303-105 = "Если такова ваша воля..."
1008303-106 = ""
1008303-108 = ""
1008303-109 = ""
1008303-111 = "[ns] «П-Постой! Кикё! Только не бей меня! Прости!»"
1008303-112 = ""
1008303-114 = ""
1008303-115 = "Не говори глупостей."
1008303-116 = "Я делаю, как вы сказали, и выбираю книгу с вашей полки."
1008303-117 = "[s] «То есть ты...»"
1008303-118 = ""
1008303-120 = ""
1008303-121 = "Я уступлю."
1008303-122 = "По просьбе Сенсея сегодня я спокойно отдохну в Шале."
1008303-123 = ""
1008303-130 = ""
1008303-131 = "Для этого я присваиваю себе эту книгу и этот диван."
1008303-132 = "[s] «Конечно! Я только что сварил кофе, если хочешь.»"
1008303-133 = "...Да."
1008303-134 = ""
1008303-139 = ""
1008303-140 = "И всё же вы отказались нагружать меня работой..."
1008303-141 = "Вы и правда загадка, Сенсей."
1008303-142 = "И правда..."
1008303-143 = ""
1008303-145 = ""
1008303-146 = "Очень, очень странный учитель."
1008303-148 = "Остаток дня мы с Кикё провели, просто отдыхая."
