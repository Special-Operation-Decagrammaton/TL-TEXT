[translation]
51010-1 = "Episódio 1;Prólogo"
51010-6 = "O-Onde ela está?!#nOnde diabos ela se meteu...?!"
51010-13 = "...!"
51010-19 = "Líder! Atrás de você!"
51010-20 = "Tsc, não vou deixar você escapar!"
51010-26 = "Heh! Toma essa!"
51010-27 = "Demais, Líder! Assim a gente vai...!"
51010-28 = "Não, ela ainda não...!"
51010-41 = "G-Guaaah?!"
51010-51 = "— Acabou.#nRendam-se, Trupe Chimi."
51010-52 = "O quê...?! Nós não fizemos nada...!"
51010-53 = "Nada...?"
51010-54 = "Até agora há pouco vocês estavam incomodando um monte de gente."
51010-56 = "Que absurdo! Isso é falsa acusação!"
51010-57 = "Nós só estávamos agindo pelo grandioso plano da nossa Líder!"
51010-62 = "Líder! Conta logo o nosso plano pra ela!"
51010-64 = "Quando ouvir o plano, não me responsabilizo se você cair pra trás de tanto choque!"
51010-70 = "...?"
51010-71 = "Ah, bem... como posso dizer...#nFico meio sem jeito quando vocês me elogiam tanto assim..."
51010-72 = "Eu ia começar o \"Plano de Causar o Maior Caos Antes do Festival da Semana Que Vem\"..."
51010-73 = "..."
51010-74 = "Bom, se ninguém estiver muito a fim, eu estava pensando em cancelar, sabe..."
51010-76 = "Isso sim! É o plano perfeito da nossa Líder!"
51010-77 = "Não vamos deixar ninguém atrapalhar!!"
51010-79 = "E-Então esse plano é mesmo incrível...?"
51010-81 = "Faz tempo que eu não voltava, mas... continua tudo igual por aqui."
51010-82 = "Mas, já que acabei vendo..."
51010-86 = "Não vou deixar vocês fazerem o que bem entendem."
51010-88 = "Ugh...!"
51010-89 = "E-Espera aí!"
51010-90 = "Quem diabos é você pra ficar no nosso caminho?!"
51010-91 = "Hm...?"
51010-92 = "Aquele haori azul-claro..."
51010-93 = "Ah, eu sabia!#nEla é da \"Hyakkaryouran\"!"
51010-94 = "O quê?!"
51010-95 = "Se você é da Hyakkaryouran, então—"
51010-97 = "Não."
51010-99 = "E-Eu nem terminei de falar—?!"
51010-101 = "Não é o que vocês estão pensando."
51010-102 = "Isto é..."
51010-104 = "...É só um cosplay."
51010-108 = "Já que eu voltei para devolver \"aquilo\"..."
51010-115 = "Eu... já não faço mais parte da Hyakkaryouran."
51010-121 = "Schale - Escritório"
51010-124 = "(Enquanto eu cuidava do trabalho de sempre na Schale...)"
51010-130 = "[ns] \"Alô, aqui é da Schale.\""
51010-132 = "Nyahaha. Quanto tempo, Sensei~"
51010-133 = "Como tem passado?"
51010-134 = "[s] \"Estava cuidando da papelada.\""
51010-137 = "(Todos os documentos espalhados sobre a mesa eram relacionados aos acontecimentos recentes, como \"Relatório de Danos por Distrito Autônomo\" e \"Diretrizes de Uso do Orçamento de Auxílio\".)"
51010-139 = "Entendo~#nÉ sobre aqueles documentos que enviamos de Hyakkiyako outro dia, né?"
51010-140 = "Afinal... aconteceu tanta coisa, não é mesmo?"
51010-145 = "[ns] \"Enfim... o que houve?\""
51010-146 = "Ah, é verdade, é verdade."
51010-147 = "Parece que você continua atolado de trabalho como sempre, né, Sensei~?"
51010-148 = "Então, pensando no Sensei que só vive trabalhando!#nFiquei matutando em como eu poderia ajudar... e tive uma ideia."
51010-149 = "[s] \"Obrigado pela consideração...?\""
51010-150 = "Nfufu... Se não se importar, gostaria de fazer uma visita a Hyakkiyako?"
51010-151 = "Logo mais teremos um festival por aqui."
51010-152 = "É importante descansar de vez em quando, então pensei que você poderia se divertir#ne mudar um pouco de ares~"
51010-153 = "Além disso, gostaria de te atualizar sobre como estão as coisas por aqui...#ne também tenho um pedidinho pessoal para fazer~"
51010-154 = "[s] \"Um pedido pessoal?\""
51010-155 = "Fufu.#nSe vier a Hyakkiyako, você vai poder fazer carinho na adorável Chise-nyan, sabia?"
51010-160 = "Miau?"
51010-162 = "Nyahahaha~♪"
51010-163 = "Pois bem, estarei te esperando, tá?"
51010-169 = "[ns] \"...Hyakkiyako.\""
51010-173 = "Não há método algum para restaurar aqueles que foram invertidos pelo \"Chroma\"."
51010-174 = "Pois isto é— assim como os mortos não podem retornar à vida.#nUma lei absoluta deste mundo."
51010-175 = "Contudo... se ainda assim afirmas haver alguém que desejas salvar,"
51010-179 = "— Venha visitar-me."
51010-182 = "[ns] \"Talvez eu consiga encontrar alguma pista sobre ela...\""
51010-185 = "Próximo;Um Encontro Inesperado (1)"
