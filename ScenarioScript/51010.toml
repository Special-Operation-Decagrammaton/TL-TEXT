51010-41 = "Г-Гах?!"
51010-42 = ""
51010-50 = ""
51010-51 = "На этом твои бесчинства заканчиваются, Моурё."
51010-52 = "К-Какие бесчинства...?"
51010-53 = "Ты хочешь сказать..."
51010-54 = "...что вы не прошли через весь торговый квартал, приставая ко всем встречным?"
51010-56 = "Пристаём к людям?! Да как ты смеешь!"
51010-57 = "Мы просто выполняли великий план босса!"
51010-58 = ""
51010-61 = ""
51010-62 = "Ага, босс! Расскажите ей свой великий план!"
51010-63 = ""
51010-64 = "Она от одного рассказа в обморок грохнется!"
51010-65 = ""
51010-67 = ""
51010-69 = ""
51010-70 = "...?"
51010-71 = "Н-Ну, эм, я-я бы не сказала, что он прям великий..."
51010-72 = "Но это только первый шаг моего плана «Устроим хаос перед фестивалем на следующей неделе и захватим его!»!"
51010-73 = "..."
51010-74 = "...Я вообще собиралась всё бросить, если людям не понравится."
51010-76 = "Очередной идеальный план, босс!"
51010-77 = "Мы никому не позволим встать у вас на пути!"
51010-79 = "О-Он правда настолько потрясающий...?"
51010-81 = "Вижу, за время моего отсутствия вы ничуть не изменились..."
51010-82 = "Прошу прощения. Но даже если наша встреча была лишь совпадением..."
51010-83 = ""
51010-85 = ""
51010-86 = "Я не могу позволить вам продолжать беспорядки."
51010-88 = "Ух...!"
51010-89 = "П-Постой минутку!"
51010-90 = "Ты вообще кто такая, чтобы внезапно к нам п-приставать?! Если подумать, это нечестно!"
51010-91 = "...Хм?"
51010-92 = "Босс, гляньте на её одежду... Это сияющее небесно-голубое хаори..."
51010-93 = "Ага! Она точно из Хяккарёран!"
51010-94 = "Что?!"
51010-95 = "Воин Хяккарёран! Хяккияко—!"
51010-97 = "Нет."
51010-99 = "Э-Эй, дай нам хотя бы закончить боевые заявления!"
51010-101 = "Вы заблуждаетесь."
51010-102 = "Эта одежда..."
51010-104 = "...это косплей."
51010-105 = ""
51010-107 = ""
51010-108 = "...Да. Костюм, который я пришла вернуть."
51010-111 = ""
51010-113 = ""
51010-115 = "Я... больше не состою в Хяккарёран."
51010-116 = ""
51010-121 = "Исполнительный офис Шале"
51010-124 = "Это был ещё один тихий день в Шале. Медленное тиканье часов нарушал лишь тихий скрип моей ручки."
51010-125 = ""
51010-130 = "[ns] «А, да. Алло?»"
51010-131 = ""
51010-132 = "Ня-ха-ха! Здравствуйте, Сенсей. Давно не виделись!"
51010-133 = "Чем занимаетесь в такой чудесный день?"
51010-134 = "[s] «Просто заканчиваю с бумагами.»"
51010-137 = "Я просматривал отчёты об ущербе академиям и рекомендации по бюджету на восстановление, утверждённые Шале. После всего случившегося рука уже начинала болеть от бесконечного подписывания форм."
51010-139 = "Ага, понятно! Значит, всё ещё разбираетесь с последствиями. К слову, надеюсь, вы одобрите запрос на финансирование, который мы отправили для Хяккияко!"
51010-140 = "Несмотря на все наши усилия, устранение всех повреждений занимает время."
51010-143 = ""
51010-145 = "[ns] «Поэтому ты звонишь, Ния?»"
51010-146 = "О нет, я просто подумала, что сейчас вам было бы полезно отвлечься!"
51010-147 = "Вы ведь из тех, кто работает нездорово долго и не делает перерывов, правда, Сенсей?"
51010-148 = "И когда я задумалась, чем можно помочь учителю, который совсем о себе не заботится, мне пришло в голову..."
51010-149 = "[s] «...И что же?»"
51010-150 = "Ня-ха-ха, вместо того чтобы чахнуть в помещении, почему бы не приехать в Хяккияко?"
51010-151 = "Скоро у нас будет фестиваль. Приезжайте отпраздновать вместе с нами."
51010-152 = "Перерывы не менее важны, чем законченная работа, знаете ли!"
51010-153 = "Заодно обсудим ситуацию в Академии Хяккияко, и у меня есть небольшая просьба."
51010-154 = "[s] «Какая просьба, Ния?»"
51010-155 = "А когда придёте в Клуб Инь-Ян, сможете даже погладить нашу очаровательную Чисэ!"
51010-156 = ""
51010-158 = ""
51010-160 = "...Мяу?"
51010-162 = "Ня-ха-ха! Хорошо?"
51010-163 = "Буду ждать!"
51010-164 = ""
51010-166 = ""
51010-169 = "[ns] «...Хяккияко.»"
51010-173 = "Вернуть сущность, обращённую Chroma, в исходное состояние невозможно."
51010-174 = "Это естественный закон этого мира, как и невозможность вернуть мёртвых к жизни."
51010-175 = "Но... если вы всё же хотите кого-то спасти..."
51010-176 = ""
51010-179 = "...приходите ко мне, Сенсей."
51010-182 = "[ns] «Может, я найду какие-нибудь зацепки о Кузунохе...»"
