[translation]
80000041-1 = "Расслабляемся вдвоём"
80000041-2 = ""
80000041-3 = ""
80000041-4 = ""
80000041-5 = "У-Угх. Сегодня подработка была тяжелее обычного."
80000041-6 = "[s] «Народу и правда было много.»"
80000041-7 = "Я знала, что это кафе популярно, но такого наплыва в обед вообще не ожидала."
80000041-8 = "Заказы всё шли и шли. Я уже думала, им конца не будет."
80000041-9 = "Не успела я заметить, как продолжила работать даже после конца смены.#nМне заплатили за переработку, так что, наверное, всё нормально."
80000041-10 = "Но я не хотела втянуть в это ещё и вас."
80000041-11 = "Простите, Сенсей."
80000041-12 = "Из-за меня вы потратили весь день."
80000041-13 = "Я не хотела, чтобы так получилось. Знаю, у вас и без того достаточно забот."
80000041-14 = "[s1] «Работать с тобой весь день было не так уж плохо.»\n[s2] «Мне очень повезло провести этот день с тобой!»"
80000041-15 = "Ч-Что вы такое говорите, Сенсей?!"
80000041-16 = "Ч-Что вы такое говорите, Сенсей?!"
80000041-17 = "Разве я не говорила, что лесть со мной не работает!"
80000041-18 = "[s] «Серьёзно?! А я бы обрадовался, если бы ты меня похвалила!»"
80000041-19 = "П-Признание этого ничего не меняет!#nЭто слишком неловко!"
80000041-20 = "И свои грустные щенячьи глазки оставьте для кого-нибудь другого.#nЯ сказала, что не буду, и точка."
80000041-21 = "Вот же."
80000041-22 = ""
80000041-24 = ""
80000041-25 = "Пф."
80000041-26 = "Ха-ха. Какая я глупая, раз думала, что вы будете злиться на меня за неудобства."
80000041-27 = "[s3] «Да, всё хорошо. Не беспокойся.»\n[s4] «Я совсем не против!»"
80000041-28 = "Ну... сегодня я попросила вас работать со мной не только ради денег."
80000041-29 = "Ну... сегодня я попросила вас работать со мной не только ради денег."
80000041-30 = "[s] «Что ты имеешь в виду?»"
80000041-31 = "Не удивляйтесь слишком сильно. ♪"
80000041-32 = "Я ведь говорила, что это кафе довольно известное?"
80000041-33 = "Так что, та-дам! Вот!"
80000041-34 = ""
80000041-36 = ""
80000041-39 = "[ns] «Шоколадный торт?»"
80000041-40 = "Ага, их фирменный торт."
80000041-41 = "Он настолько популярен, что на День святого Валентина его не получить без брони хотя бы за месяц."
80000041-42 = "Но мне сказали, что если я отработаю там день, его дадут мне вдобавок к зарплате!"
80000041-43 = "[s] «Так это с самого начала был твой план?»"
80000041-44 = "Ага. Ну как? Идеально для Дня святого Валентина, правда?"
80000041-45 = "[s] «Он потрясающий, Серика!»"
80000041-46 = "Хех! Вот так, осыпай меня комплиментами! Я принимаю всю похвалу!"
80000041-47 = "[s] «Ещё? Могу немного погладить тебя по голове. Как тебе?»"
80000041-48 = ""
80000041-50 = ""
80000041-51 = "Ч-Что?! Нет! То есть, эм... я просто не хочу испортить причёску!"
80000041-52 = "П-Постойте! Мне там щекотно! А-а-а-а!"
80000041-54 = "Л-Ладно, хватит уже! Я поняла!"
80000041-55 = "В-В любом случае уже поздно."
80000041-56 = "Так что... если хотите, может, вместе съедим торт?"
80000041-57 = "[s] «Конечно! С удовольствием!»"
80000041-58 = "Отлично! Найдём где сесть. За хорошо сделанную работу."
80000041-60 = "Мы с Серикой вместе наслаждались насыщенным шоколадным тортом на закате."
