[translation]
2600105-1 = "Невыразимые секреты"
2600105-2 = "Комната Котамы"
2600105-3 = "Если в нужный момент взломать серверы станции, можно услышать много интересных телефонных разговоров."
2600105-4 = "Посмотрим. Какие звонки сегодня перехватить..."
2600105-5 = "Подозрительный звонок от неизвестного. Получатель..."
2600105-6 = "Сенсей из Шале?"
2600105-7 = "Кто-то звонит Сенсею так поздно. Я обязана послушать!"
2600105-8 = ""
2600105-9 = "Начинаю прослушивание через пять... четыре... три..."
2600105-10 = ""
2600105-12 = "Не ожидал, что вы позвоните напрямую. Наверное, дело срочное."
2600105-13 = "(Связь плохая. Придётся слушать внимательнее...)"
2600105-14 = "...Да, мы действительно специалисты в этом. Если доверить дилетанту, красным может оказаться не предмет, а он сам."
2600105-15 = "(Красным...? О чём они говорят?)"
2600105-16 = "Последующая обработка тоже важна. Будет неудобно, если оно всплывёт обратно, поэтому нужно завернуть его в пластик и придавить тяжёлым камнем."
2600105-17 = "(После? Тяжёлый камень? Они что, говорят о...)"
2600105-18 = "Я пришлю отличный готовый продукт, который не сгниёт, так что ждите. Ахаха!"
2600105-20 = "..."
2600105-21 = "Похоже... Сенсей ввязался во что-то страшное."
2600105-23 = "Исполнительный офис Шале"
2600105-24 = "..."
2600105-25 = ""
2600105-26 = "(Согласно перехваченным данным, предмет доставят сегодня в два часа.)"
2600105-27 = "(Нужно достучаться до Сенсея, пока это не превратилось в ещё более серьёзное преступление.)"
2600105-28 = "(Иначе... весь Кивотос может захлебнуться кровью...)"
2600105-29 = ""
2600105-31 = "[ns] «Котама, ты плохо выглядишь. Всё нормально?»"
2600105-32 = "Я-Я в порядке. Просто не выспалась."
2600105-33 = "Сенсей, ты выглядишь немного возбуждённым. Чего-то ждёшь?"
2600105-34 = "[s] «Сегодня придёт то, что я заказал по телефону.»"
2600105-35 = "Этот предмет..."
2600105-36 = "Сенсей... Нам нужно поговорить."
2600105-38 = "Ваша доставка."
2600105-40 = "Сенсей, подожди. Эта посылка..."
2600105-42 = "[ns] «Этот умэбоси приготовлен настоящим мастером.»"
2600105-43 = "...Что? Умэбоси?"
2600105-44 = "То есть эта коробка не доказательство кровавого преступления?"
2600105-45 = "[s] «...Котама, о чём ты вообще говоришь?»"
2600105-47 = "А-а. «Покрасить в красный» означало замариновать, а камень нужен, чтобы придавить в рассоле."
2600105-48 = "А я решила, что ты пытаешься избавиться от улик преступления."
2600105-49 = "[s1] «Я бы никогда так не поступил.»\n[s2] «Котама, за кого ты меня принимаешь?»"
2600105-50 = "Ахаха, хорошо, что Сенсей оказался тем Сенсеем, которого я знаю."
2600105-51 = "Ахаха, хорошо, что Сенсей оказался тем Сенсеем, которого я знаю."
2600105-52 = "...А. Этот умэбоси действительно вкусный."
2600105-53 = "Идеально кислый и красивого красного цвета. Сделано мастерски."
2600105-54 = "[s] «Кстати, откуда ты узнала о моём телефонном разговоре?»"
2600105-55 = "Ну..."
2600105-56 = "...Совпадение?"
2600105-58 = "После этого я отчитал Котаму за подслушивание без разрешения."
