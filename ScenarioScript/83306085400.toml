[translation]
83306085400-5 = ""
83306085400-6 = "Я нашла пропавший пудинг."
83306085400-7 = "Что?! Правда?!"
83306085400-8 = "Так кто же эта обречённая душа, осмелившаяся совершить преступление, потрясшее даже Великую Макото?!"
83306085400-9 = "Назови мне имя, и я обрушу всю свою власть на возмездие!"
83306085400-10 = "Насчёт этого..."
83306085400-11 = ""
83306085400-13 = ""
83306085400-15 = ""
83306085400-16 = "А! Макото! Хина! И пудинг!"
83306085400-17 = "А, Ибуки! Как вовремя! Я раскрыла преступника, укравшего наш пудинг!"
83306085400-18 = "Хм? Но Ибуки раньше нашла этот пудинг в нашей палатке!"
83306085400-19 = "Ибуки подумала, что мистер Муравей, мистер Медведь или мистер Кролик могут прийти и откусить кусочек, если оставить его там!"
83306085400-20 = "Поэтому Ибуки положила его в сумку с сокровищами Ибуки!"
83306085400-21 = "Чтобы Макото, Ироха, Сацуки и Чиаки могли разделить его с Ибуки, когда все вернутся!"
83306085400-22 = "Так вот что случилось."
83306085400-23 = "И-и-и-Ибуки..."
83306085400-24 = "Хм? Что такое?"
83306085400-25 = "Я-я-я-я... Я-я не знала..."
83306085400-26 = "Прости меня, Ибуки! Я была совершенно слепа к твоему доброму сердцу! Преступницей была я-а-а!!!"
83306085400-27 = "...А?"
