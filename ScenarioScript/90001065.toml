[translation]
90001065-2 = ""
90001065-3 = "Прорвите оборону противника! Токи, пожалуйста!"
90001065-4 = "Да. Вы все можете оставаться позади."
90001065-5 = ""
90001065-7 = ""
90001065-11 = ""
90001065-12 = "Объект уничтожен... Успех! Мы отключили сигнал подавления!"
90001065-13 = ""
90001065-16 = "Все в порядке? Мой сигнал только что восстановился."
90001065-17 = "Я была бы крайне разочарована, если бы нет. Что ж... Пока, пожалуй, скажу, что это облегчение."
90001065-18 = "Да. Я также восстановила контроль над AMAS."
90001065-19 = "У меня снова есть доступ к прицепу Рио. Работа выполнена хорошо."
90001065-20 = "Где вы сейчас...?"
90001065-22 = ""
90001065-23 = "У объекта, который отвечал за сигнал подавления. Мы переместились сюда, когда поняли, что произошло."
90001065-24 = "Однако после уничтожения первого здания мы обнаружили за ним ещё одно огромное."
90001065-25 = "Ладно бы такое существовало на суше, но в Ледниковом море?"
90001065-26 = "Сооружение такого масштаба... Неужели...?"
90001065-27 = "Ты что-то поняла, Рио?"
90001065-28 = ""
90001065-30 = ""
90001065-31 = ""
90001065-32 = "Ничего, что я могла бы утверждать с полной уверенностью."
90001065-33 = "Но одно могу сказать точно. Количество ресурсов, добываемых в этом районе..."
90001065-34 = "...намного превышает объёмы добычи пророка, которого я исследовала в Ледниковом море."
90001065-35 = "Никто не стал бы задействовать столько рабочей силы для добычи без причины. Эти ресурсы должны быть нужны для чего-то конкретного."
90001065-36 = "Но тогда возникает вопрос... для чего им может понадобиться столько материала?"
90001065-37 = "Может, те дети и Декаграмматон...?"
90001065-38 = ""
90001065-39 = "(Неужели они действительно планируют построить новое царство?)"
90001065-40 = ""
90001065-41 = ""
90001065-42 = ""
90001065-43 = "...Что будем делать теперь, Сенсей?"
90001065-44 = "[s] «...Давайте исследуем этот объект.»"
90001065-45 = "Разве это не довольно опасно?"
90001065-46 = "Наши шансы улучшились. И госпожа Рио снова с нами."
90001065-47 = "Да. Задача — выследить пророка и исследовать местность."
90001065-48 = "Если снова появятся вражеские силы, я вновь их уничтожу. Я сильнейшая горничная и секретный агент."
90001065-49 = "Это... вызывает какое-то дурное предчувствие..."
90001065-50 = "Как бы то ни было, я поддерживаю предложение. Кто-то потрудился построить такой объект в заброшенной тундре."
90001065-51 = "Уже одно это стоит расследования."
90001065-52 = "Как сказала Рио, под всем этим что-то скрывается, и мы ещё не вытащили это на поверхность."
90001065-53 = "Подтверждаю. Президент ответила ожидаемо."
90001065-54 = "Да. Я уже говорила, у президента Химари есть такая сторона."
90001065-55 = "В последнее время вокруг меня становится всё больше теорий заговора..."
90001065-56 = ""
90001065-58 = ""
90001065-59 = "Кхм! В любом случае. Все, двигайтесь осторожно."
90001065-61 = "Следующий эпизод;Исследование объекта"
