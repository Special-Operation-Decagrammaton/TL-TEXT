[translation]
10029060-1 = "Эпизод 6;Ремонт"
10029060-2 = "Глубже в руинах Миллениума"
10029060-4 = "Мы почти на месте. Судя по координатам..."
10029060-5 = "Значит, мы почти нашли оборудование, да? Добрались быстрее, чем я ожидала."
10029060-6 = "Это благодаря маршруту, который дала нам Президент. Без этой информации мы бы потеряли время, блуждая здесь."
10029060-7 = "Похоже, объект размером примерно с промышленный парк."
10029060-8 = "И нечто настолько огромное просто стояло здесь незамеченным?"
10029060-9 = "Невероятно...! Это и правда совершенно другой мир!"
10029060-10 = "Ну, я не уверена, что наши миры настолько уж разные..."
10029060-11 = "А? Что это значит?"
10029060-13 = "...Шокухо."
10029060-14 = "Я ничего не говорила."
10029060-15 = "Раз уж мы почти пришли, может, вы поведёте нас, мисс Рейлган 5-го уровня?"
10029060-16 = "Я-я же сказала перестать так меня называть!"
10029060-17 = "У тебя самой хватает впечатляющих прозвищ, знаешь ли...!"
10029060-18 = "*вздыхает*"
10029060-19 = "Забудь. Не стоит того..."
10029060-20 = "Да-да. Вы ведь понимаете? Я не из тех, кого принято ставить на передовую."
10029060-22 = "Думаю, лучше всего, если мисс Мисака пойдёт первой! Вы ведь не хотите разочаровать своих поклонников?"
10029060-23 = "Что вы..."
10029060-24 = ""
10029060-26 = ""
10029060-27 = ""
10029060-29 = "...Честно."
10029060-30 = "Согласна. По моему анализу, Микото и я лучше всего подходим для передовой."
10029060-32 = "Вот видите? Мисс Мисака, вы ведь сказали, что будете сотрудничать, верно?"
10029060-33 = "Да, но я не имела в виду, что буду..."
10029060-34 = "...Ладно, хорошо."
10029060-35 = "Мы откроем дверь, а потом ты и я войдём первыми? Такой план, да?"
10029060-36 = "...Меня зовут Эйми."
10029060-37 = "А?"
10029060-38 = "Если ты просто называешь меня «ты,» это оставляет место для двусмысленности. К тому же ты сказала, что я могу называть тебя Микото, так что, пожалуйста, называй меня Эйми."
10029060-39 = ""
10029060-41 = ""
10029060-42 = "Н-Ну... Думаю, я действительно так сказала, так что жаловаться не могу."
10029060-43 = "Хорошо, Эйми."
10029060-44 = "Пойдёмте."
10029060-45 = "...Хм."
10029060-49 = "Это оно?"
10029060-50 = "Мы точно пришли куда надо? Здесь очень просторно и выглядит всё довольно важно..."
10029060-51 = "Но здесь ничего нет..."
10029060-52 = "А! Может, вот оно? Та большая машина вон там выглядит довольно важной!"
10029060-54 = "Верно. Да. Должно быть, это то самое оборудование, о котором мы говорили."
10029060-55 = "Оно гораздо больше, чем я думала. Не терпится разобрать его."
10029060-56 = "...?"
10029060-57 = "Простите, но вы сказали «разобрать»? Разве мы не собирались его чинить?"
10029060-59 = "...?! Э-Это—"
10029060-60 = "К-Конечно же, чтобы нормально починить его, сначала придётся разобрать! Конечно!"
10029060-61 = "Именно. Это я и имела в виду. Определённо ничего другого."
10029060-62 = "А-а. Ну конечно, конечно."
10029060-63 = ""
10029060-65 = ""
10029060-67 = "Мы определённо не пускаем слюни от возможности узнать, как устроена эта машина."
10029060-68 = "[s1] «...Д-Да.»\n[s2] «Сосредоточьтесь!»"
10029060-71 = ""
10029060-73 = ""
10029060-75 = "...? Что это за звук?"
10029060-76 = "Оборудование...! Оно запускается!!"
10029060-77 = "Ну, мы и правда подняли приличный шум..."
10029060-78 = "Тогда это..."
10029060-79 = "...снова..."
10029060-80 = "...наш звёздный час?!"
10029060-81 = "Почему вы так этому радуетесь?"
10029060-82 = "Наверное, им не терпится снова увидеть маленькое магическое шоу мисс Мисаки."
10029060-83 = "Магическое шоу? Что ты называешь «магическим шоу»?!"
10029060-85 = "...Погоди."
10029060-86 = "Это странно. Дроны движутся не в своём обычном построении."
10029060-87 = ""
10029060-90 = "Я никогда раньше не видела такого построения. Это..."
10029060-91 = ""
10029060-93 = ""
10029060-94 = "[ns3] «Это и есть тот перенос, о котором предупреждала Химари...?»\n[ns4] «Что это за странный свет...?!»"
10029060-99 = ""
10029060-100 = ""
10029060-101 = "...! Оборудование излучает какое-то..."
10029060-103 = "П-Погодите!! Разве нам не нужно что-то сделать?! А вдруг оно отправит нас куда-нибудь непонятно куда или...!"
10029060-104 = "Это вполне вероятный исход. Мы знаем, что оно на такое способно."
10029060-105 = "Когда системе угрожают, самое эффективное решение — отправить угрозу как можно дальше."
10029060-106 = "Вероятно, дроны нужны лишь для того, чтобы выиграть время, пока оборудование выполняет функцию переноса."
10029060-107 = ""
10029060-109 = ""
10029060-110 = ""
10029060-112 = "...И оно защищено пуленепробиваемым барьером. Мы не сможем его остановить, пока не подойдём вплотную и не разрушим барьер в ближнем бою."
10029060-113 = "Как ты можешь говорить об этом так спокойно?!"
10029060-114 = "Сенсей!"
10029060-115 = "[s5] «Хорошо!»\n[s6] «Сначала остановим оборудование!»"
10029060-118 = "Мы идём вперёд. Пожалуйста, командуйте нами."
10029060-119 = ""
10029060-121 = ""
10029060-130 = "..."
10029060-131 = "Угх..."
10029060-132 = "Простите. Мы..."
10029060-133 = "...вообще-то пришли сюда его чинить... Разве нет...?"
