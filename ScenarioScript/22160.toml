22160-18 = ""
22160-20 = ""
22160-21 = "Я передала Токи полномочия по перестройке Эриду, чтобы она смогла удерживать C&C."
22160-22 = ""
22160-23 = "Теперь, когда C&C — сильнейшее сопротивление — нейтрализованы, остаётся лишь Сенсей..."
22160-24 = ""
22160-25 = "Даже Сенсею в конце концов придётся принять ситуацию..."
22160-26 = "...и признать, что правильно, а что нет."
22160-27 = ""
22160-29 = ""
22160-30 = "И как выглядит справедливое, рациональное решение."
22160-31 = "Шах и мат."
22160-32 = ""
22160-34 = ""
22160-35 = "Хм, понятно... Рио."
22160-36 = "Твой план хорошо продуман, и ради своей цели ты пошла на крайние меры."
22160-37 = "В каком-то смысле это, возможно, рационально."
22160-38 = "Химари..."
22160-39 = "Но я всё равно не согласна с твоей самоуверенной праведностью."
22160-40 = "...Понятно."
22160-41 = "Рио, позволь дать тебе один совет."
22160-42 = "Ты выдающаяся... тут сомнений нет."
22160-43 = "Впечатляет, как ты присвоила средства Миллениума и построила этот город."
22160-44 = "И твоё бесстыдство впечатляет ничуть не меньше."
22160-45 = "...Что ты хочешь этим сказать?"
22160-46 = "Если ты веришь, что что-то правильно, ты ни секунды не сомневаешься и идёшь вперёд, не оглядываясь."
22160-47 = "Это твоё сильнейшее качество..."
22160-48 = "И твоя главная слабость."
22160-49 = "Слабость? У меня нет такой..."
22160-50 = "Рио, ты хоть раз обсуждала свои проблемы с младшекурсницами? Хоть с кем-нибудь?"
22160-51 = "..."
22160-52 = "Твоя слабость вовсе не уникальна."
22160-53 = "Поскольку ты настолько выдающаяся, ты никогда не хочешь идти на компромисс или ждать остальных."
22160-54 = "Вот твоя главная слабость."
22160-55 = ""
22160-58 = ""
22160-59 = ""
22160-60 = "Взрыв?! Не может быть..."
22160-61 = "Это только начало."
22160-62 = "Химари, подожди...!"
22160-63 = ""
22160-66 = ""
22160-67 = "...Атака извне именно сейчас?"
22160-68 = "Не может быть."
22160-69 = "Мы определили все силы, способные представлять для нас угрозу."
22160-70 = "Кто это может быть...?"
22160-73 = "Сюда, Президент Химари."
22160-74 = "Ха-ха, Эйми... Не ожидала, что ты придёшь меня спасать..."
22160-75 = "Если сделаешь это, предашь Рио. Ты уверена?"
22160-76 = "Хм. Возможно."
22160-77 = "Вы сказали: \"Если я не вернусь в течение двадцати четырёх часов после того, как пойду к Рио, можешь съесть пудинг в холодильнике\"."
22160-78 = "Но подумав, я решила, что пудинг лучше есть вместе."
22160-79 = "Вот и вся причина."
22160-80 = "Ты такая непредсказуемая. Ха-ха-ха..."
22160-81 = "Что ж, увидеть реакцию Рио было довольно забавно. Я довольна."
22160-82 = "...И кто теперь отвратительный?"
22160-83 = "Пфф, кто посмеет назвать изящные действия хрупкой гениальной хакерши отвратительными?"
22160-84 = "Но президент... ситуация всё ещё плохая."
22160-85 = "Такими темпами всех победят. Не знаю, сможем ли мы помочь..."
22160-86 = "О, об этом не волнуйся."
22160-87 = "Почему? У вас есть решение?"
22160-88 = "Разумеется."
22160-89 = "Так же, как ты пришла спасать меня..."
22160-90 = "У меня тоже много надёжных младшекурсниц."
22160-92 = "...?"
22160-94 = "Клубная комната Веритас"
22160-95 = "Воу! Что нам делать?! Связь пропала!"
22160-96 = ""
22160-98 = ""
22160-100 = "...Не получится. Сеть полностью замолчала."
22160-101 = "Я не могу найти решение..."
22160-102 = "Что делать...? Надо думать... Надо..."
22160-103 = "Такими темпами и C&C, и Сенсея победят."
22160-104 = "...Тц, мы недооценили их контрмеры."
22160-105 = "При любых обстоятельствах нужно быть готовыми к каждой контрмере или попытке взлома."
22160-106 = "Неужели... это конец?"
22160-107 = "Я не могу с этим смириться! Алиса всё ещё там!"
22160-109 = "Должен быть какой-то способ..."
22160-112 = "..."
22160-114 = "Подождите, Маки, Котама."
22160-115 = "Что такое, Харе?"
22160-116 = "Строка символов... на мониторе..."
22160-117 = "..."
22160-119 = "..."
22160-121 = "Это..."
22160-122 = "...<Optimus Mirror System>"
22160-125 = "<Mirror> активирован."
22160-127 = ""
22160-128 = ""
22160-129 = "...А?"
22160-140 = "Его огневая мощь просто беспощадна!"
22160-141 = "...Такими темпами нас действительно могут уничтожить."
22160-142 = "Да. Возможно, это конец."
22160-143 = "[ns] «Вы сейчас слишком спокойны!»"
22160-147 = "Вааа! В-В нас целятся!"
22160-148 = "[s] «Все! Осторожно...!»"
22160-149 = ""
22160-154 = ""
22160-155 = "Движения Авангарда..."
22160-156 = "Он просто... остановился?"
22160-157 = ""
22160-159 = ""
22160-160 = ""
22160-163 = ""
22160-164 = "*вздох* ...Слава богу. Мы успели."
22160-165 = "Все целы?"
22160-166 = "[s] «...Чихиро!»"
22160-168 = "Следующий Эпизод: Переломить ход битвы"
