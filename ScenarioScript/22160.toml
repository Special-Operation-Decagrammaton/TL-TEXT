[translation]
22160-1 = "Episódio 16;Xeque-Mate"
22160-17 = "......"
22160-21 = "A divisão da C&C que confiei à Toki —"
22160-23 = "Se neutralizarmos a C&C, a maior força de combate deles, só restará o Sensei..."
22160-25 = "Mesmo sendo o Sensei da Schale,#nno fim das contas não terá escolha senão aceitar."
22160-26 = "O que é certo, e então —"
22160-30 = "Qual é a \"decisão racional\"."
22160-31 = "— Xeque-mate."
22160-35 = "Entendo... Rio, compreendo a sua linha de pensamento."
22160-36 = "Um plano meticulosamente elaborado, assim como seus métodos..."
22160-37 = "De certa forma, talvez isso seja mesmo \"racional\"."
22160-38 = "Himari..."
22160-39 = "Contudo, ainda assim não posso concordar com essa sua presunção."
22160-40 = "...... Entendo."
22160-41 = "— Deixe-me lhe dar apenas um conselho."
22160-42 = "Você é, sem dúvida, brilhante."
22160-43 = "Como conseguiu construir uma cidade dessas sem ninguém descobrir..."
22160-44 = "De certa forma, chega a ser admirável."
22160-45 = "...O que quer dizer com isso?"
22160-46 = "Você... quando acredita estar certa, segue em frente sem nunca olhar para trás, não é?"
22160-47 = "Essa é a sua maior virtude..."
22160-48 = "E, ao mesmo tempo, a sua fraqueza."
22160-49 = "Fraqueza? Isso não faz..."
22160-50 = "Rio... você já compartilhou suas preocupações com uma caloura alguma vez?"
22160-51 = "..."
22160-52 = "Uma fraqueza não precisa ser nada tão grandioso."
22160-53 = "Por ser brilhante demais — você não acompanha o passo dos outros, nem se dispõe a esperar por ninguém.#nÉ exatamente esse seu lado..."
22160-54 = "...que é a sua maior fraqueza."
22160-60 = "Uma explosão?!#nDe onde veio isso...?"
22160-61 = "O verdadeiro espetáculo começa agora."
22160-62 = "Himari, espere...!"
22160-67 = "...Um ataque externo?"
22160-68 = "Impossível."
22160-69 = "Todas as forças que poderiam representar uma \"ameaça\" já foram monitoradas de antemão."
22160-70 = "Mesmo assim, quem poderia ser...?"
22160-73 = "Por aqui, presidente Himari."
22160-74 = "Fufu, quem diria, Eimi... que justamente você viria me resgatar..."
22160-75 = "Isso provavelmente será visto como uma traição à Rio. Tem certeza de que não há problema?"
22160-76 = "Hmm... quem sabe?"
22160-77 = "\"Se eu não voltar em 24 horas depois de ir me encontrar com a Rio, pode comer o pudim da geladeira\"#n— foi o que você disse, não foi, presidente?"
22160-78 = "Só achei que, já que é pra comer, seria melhor comermos juntas."
22160-79 = "Entendo..."
22160-80 = "Fufu... esperar imaginando como minha caloura viria me resgatar acabou sendo mais divertido do que eu pensava."
22160-81 = "Graças a você, pude ver uma expressão bem interessante no rosto da Rio.#nEstou satisfeita."
22160-82 = "...Sinceramente, não sei qual das duas tem o gosto mais duvidoso."
22160-83 = "Ora, que grosseria dizer gosto duvidoso.#nPoderia corrigir para \"o hobby refinado de uma beldade hacker frágil, pura e supergênio\"?"
22160-84 = "Tá, tá. Mas, presidente, a situação continua péssima, não acha?"
22160-85 = "Desse jeito, é uma batalha perdida.#nMesmo se entrarmos para ajudar, mal sei se conseguimos empatar..."
22160-86 = "Ora, quanto a isso, não se preocupe."
22160-87 = "Hmm? Você tem algum trunfo na manga?"
22160-88 = "Sim, é claro."
22160-89 = "Assim como você veio me resgatar, Eimi..."
22160-90 = "Eu tenho muiiitas calouras confiáveis, sabia?"
22160-92 = "...?"
22160-94 = "Sala do Clube Veritas"
22160-95 = "Uaaah! O que a gente faz agora?! A conexão caiu toda?!"
22160-100 = "...Não dá. A rede silenciou completamente."
22160-101 = "Assim não temos o que fazer..."
22160-102 = "O que podemos fazer... preciso pensar... o que fazer..."
22160-103 = "Se continuar assim, não só a C&C, mas até o Sensei vai acabar perdendo."
22160-104 = "...Tsc, subestimei a resposta do inimigo."
22160-105 = "Independente da rota escolhida desde o início, eu devia ter preparado contramedidas de bloqueio direito..."
22160-106 = "...Será que, só nós... chegamos ao nosso limite?"
22160-107 = "Nem pensar! Eu me recuso a desistir da Aris-chan... de jeito nenhum!"
22160-109 = "Algum jeito... tem que haver algum jeito..."
22160-112 = "..."
22160-114 = "Esperem um segundo.#nMaki, Kotama-senpai."
22160-115 = "Hã? O que houve de repente, Hare-senpai?"
22160-116 = "No monitor... apareceu um texto..."
22160-117 = "......"
22160-119 = "............"
22160-121 = "Isso é..."
22160-122 = ".................. \"Optimus Mirror System\""
22160-125 = "Ativando \"Espelho\"."
22160-129 = "...Hã?"
22160-140 = "É... é forte demais..."
22160-141 = "...Se continuar assim, a coisa vai ficar realmente feia."
22160-142 = "Parece que estamos por um fio, hein."
22160-143 = "[ns] \"Como você consegue ficar tão calma...?\""
22160-147 = "Uaaah! A-agora tá mirando na gente?!"
22160-148 = "[s] \"Atenção! Cuidado...!\""
22160-155 = "Os movimentos do Avant-Garde..."
22160-156 = "De repente... ficaram... lentos?"
22160-164 = "Ufa... acho que cheguei bem na hora."
22160-165 = "Estão todos bem?"
22160-166 = "[s] \"...... Chihiro!\""
22160-168 = "Próximo;O Trampolim para a Virada"
