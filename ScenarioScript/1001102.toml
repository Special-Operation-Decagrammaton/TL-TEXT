[translation]
1001102-1 = "Время перекуса"
1001102-2 = "Вход в Сад цветущей сливы"
1001102-3 = "Какая неожиданность, Сенсей. Какими судьбами?"
1001102-4 = "Перекус? Да, я как раз собиралась раздать угощения студентам Сада цветущей сливы..."
1001102-5 = "Ох. Похоже, я случайно отправила письмо тебе. Прошу прощения."
1001102-6 = "Ничего страшного. Раз уж ты здесь, почему бы не присоединиться?"
1001102-7 = "Не стесняйся. Фруктов хватит на всех!"
1001102-8 = "К тому же у меня есть к тебе просьба... Ну-ну, иди сюда."
1001102-9 = ""
1001102-11 = "Кухня Сада цветущей сливы"
1001102-12 = "Правда всё выглядит свежим? В «Променаде» любезно пожертвовали столько фруктов, когда узнали, что они для студентов Сада цветущей сливы."
1001102-13 = "Я одна ни за что не успею всё нарезать и подготовить. Не поможешь?"
1001102-14 = "Так... Я займусь хурмой и грушами. А ты почистишь яблоки, Сенсей?"
1001102-15 = "[s] «Без проблем.»"
1001102-17 = "Надо же, Сенсей. Эти яблоки выглядят восхитительно."
1001102-18 = "Знаешь, когда вырастешь, этот навык тебе пригодится."
1001102-19 = "Ой, прости. Я прекрасно знаю, что ты уже взрослый. Просто привыкла так говорить, потому что постоянно занимаюсь с детьми."
1001102-20 = "А теперь взгляни на фрукты, которые почистила я. Ну как?"
1001102-21 = "[s] «Выглядят отлично.»"
1001102-22 = "Правда? Приятно получить твоё одобрение. Хи-хи..."
1001102-23 = ""
1001102-24 = "Тогда сначала попробуем? Вот, Сенсей. Скажи: «А-а-ам»."
1001102-25 = "Не стесняйся. Давай, попробуй кусочек."
1001102-26 = "...Ты не хочешь есть тот, что я выбрала для тебя?"
1001102-27 = "Хорошие мальчики и девочки никогда не привередничают в еде. И к тебе это тоже относится!"
1001102-28 = "Итак, ещё раз. Скажи: «А-а-ам»."
1001102-29 = ""
1001102-30 = ""
1001102-31 = "Вот. Так лучше. Ну как на вкус?"
1001102-32 = "[s] «Свежее и очень сладкое.»"
1001102-33 = "Правда? Тогда и я не отказалась бы от кусочка."
1001102-34 = "Не стесняйся. Будет нечестно, если кормить буду только я."
1001102-35 = ""
1001102-36 = "Теперь моя очередь! А-а-ам..."
1001102-37 = ""
1001102-38 = "[s] Положить дольку яблока Шун в рот."
1001102-39 = ""
1001102-40 = "М-м-м! Когда меня кормишь ты, оно ещё слаще."
1001102-41 = "Хотя, чтобы составить мнение, мне, пожалуй, нужен ещё один кусочек... Ох, посмотри на время."
1001102-42 = ""
1001102-43 = "Если будем медлить, время перекуса закончится. Надо спешить."
1001102-44 = "Ты отнеси те тарелки, а я возьму эти."
1001102-45 = "Хи-хи. Уже жду сегодняшний перекус."
