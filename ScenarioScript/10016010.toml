[translation]
10016010-1 = "Эпизод 1;Исполнительный комитет в огне"
10016010-2 = "Офис Исполнительного комитета Фестиваля Хало"
10016010-3 = ""
10016010-5 = ""
10016010-6 = ""
10016010-8 = ""
10016010-9 = ""
10016010-10 = "...Спасибо всем, что, несмотря на плотный график, помогаете с Фестивалем Хало в Кивотосе."
10016010-11 = "Церемония открытия завершена, так что давайте пройдёмся по расписанию на сегодня и ключевым моментам, которые нужно помнить."
10016010-12 = "Хотя на церемонии открытия были небольшие накладки..."
10016010-13 = "Интересно. То, что для «Геенны» было бы катастрофой, по стандартам «Миллениума» всего лишь «небольшая накладка»?"
10016010-14 = "Н-Ну..."
10016010-15 = "Лично я считаю, что нельзя игнорировать тот факт, что выбранная «Тринити» представительница публично высказалась так, что подорвала авторитет и значимость почитаемого Фестиваля Хало."
10016010-16 = "Объединённая школа «Тринити» должна понести ответственность."
10016010-17 = "..."
10016010-18 = "О-о боже...! Мне так жаль."
10016010-19 = "Это слабое утешение, но никто из нас в Сестринстве ни в одной вселенной не мог подумать, что она произнесёт настолько отвратительные и наглые вещи!"
10016010-20 = "Н-ну, может, в одной-двух вселенных... можно было бы ожидать... Но... Мы думали, ей можно доверить прочитать текст с бумажки!"
10016010-21 = "То есть вероятность была не нулевая..."
10016010-22 = "Хи-хи. Вы слышали сестру. Учитывая такую халатность, я предлагаю «Тринити» немедленно выйти из состава Исполнительного комитета."
10016010-23 = "Дисциплинарный комитет с радостью предоставит людей, чтобы заполнить, я уверена, очень большую дыру, оставленную «Тринити»."
10016010-24 = "Что, простите?! Вы пытаетесь создать большинство «Геенны»!"
10016010-25 = "По-моему, именно вы подрываете честность этого фестиваля, старший администратор!"
10016010-26 = "Его честность, вице-президент, изначально была разорвана в клочья благодаря непристойности ВАШЕЙ школы!"
10016010-27 = "В-все! Пожалуйста! Давайте успокоимся!"
10016010-28 = "Фестиваль Хало в Кивотосе должен быть праздником мира. Нейтральным местом, где студенты самых разных школ могут дружески соревноваться и укреплять отношения между академиями."
10016010-29 = "Представьте на минуту, что почувствуют обычные студенты, если узнают, что члены руководства грызутся между собой, словно школьницы на детской площадке!"
10016010-30 = "Они почувствуют себя преданными и раздавленными!"
10016010-31 = "...Я понимаю, Мари."
10016010-32 = "Хмф. Если студенты узнают, что мы все дерёмся, они, скорее всего, будут в восторге."
10016010-33 = ""
10016010-35 = ""
10016010-36 = "Иочи Мари, верно? Ты хорошо разрядила ситуацию. Иного от члена Сестринства я и не ожидала."
10016010-37 = "О нет, вы слишком высоко нас оцениваете. Мы тоже несём значительную часть ответственности за эту ситуацию."
10016010-38 = "И не нужно так официально. Мы все собрались здесь с добрыми намерениями. Пожалуйста, называйте меня Мари!"
10016010-39 = "(Начинаю понимать, почему Тринити выбрала её членом этого Исполнительного комитета...)"
10016010-45 = "...Именно поэтому мы внесли изменения в указанные соревнования. Также пришлось немного переставить расписание, чтобы учесть дополнительное время подготовки к этим изменениям."
10016010-46 = "Мы понимаем, что изменения были внесены в последний момент, но на протяжении всего процесса открыто общались с участвующими академиями, и ни одна из них не высказала возражений."
10016010-47 = "Есть ли у студентов ещё вопросы или опасения?"
10016010-48 = "[s] «Можно кое-что спросить?»"
10016010-49 = "Технически вы не студент, но для вас я сделаю исключение, Сенсей [USERNAME]."
10016010-50 = "Какой у вас вопрос?"
10016010-51 = "[s1] «Фестиваль Хало проводит Миллениум, тогда почему...?» \n[s2] «Студентам других академий разрешено входить в Исполнительный комитет?»"
10016010-52 = "Почему здесь присутствуют студенты других школ? Чтобы Фестиваль Хало Кивотоса проводился честно и беспристрастно и ни одна академия не получила слишком много власти."
10016010-53 = "Да. Чтобы Фестиваль Хало Кивотоса проводился честно и беспристрастно и ни одна академия не получила слишком много власти."
10016010-54 = "Если бы в Исполнительном комитете была только принимающая академия, не существовало бы системы сдержек и противовесов, гарантирующей честность. Участники из разных школ позволяют студентам доверять справедливости мероприятия."
10016010-55 = "Есть и вопросы безопасности. Такое крупное мероприятие неизбежно привлекает нарушителей. Если появятся студенты, угрожающие безопасности фестиваля, представители соответствующей академии в Исполнительном комитете смогут отреагировать намного быстрее и эффективнее."
10016010-56 = "Поэтому отдельным академиям не просто разрешено отправлять представителей в Исполнительный комитет — это важная традиция Фестиваля Хало, которую для нас честь поддерживать."
10016010-57 = ""
10016010-58 = "Что, кстати, подводит меня к собственному вопросу... Учитывая важность Исполнительного комитета, почему сегодня не явились ни Общество Пандемониума, ни «Чаепитие»?"
10016010-59 = "Вот именно. Как член Дисциплинарного комитета, я и сама почти готова подать жалобу."
10016010-60 = "Этот енот из Общества Пандемониума... Кхм. То есть председатель Макото отказалась участвовать по следующей причине:"
10016010-62 = "Вы хотите, чтобы Общество Пандемониума, верхушка «Геенны», сидело в Исполнительном комитете и убирало за кучкой скучных обычных студентов?"
10016010-63 = "Я, великая Макото, никогда не опущусь до такой тупой и раздражающей работы! Категорически нет!"
10016010-64 = "А ещё лучше — пусть Дисциплинарный комитет несёт всю ответственность за комитет! Бахахаха!"
10016010-65 = ""
10016010-66 = "...А что насчёт «Чаепития»?"
10016010-67 = "Нагиса, нынешняя хозяйка «Чаепития», отправила нас как представителей и передала сообщение."
10016010-69 = "К сожалению, из-за множества разнообразных общественных обязательств я не могу лично участвовать в Фестивале Хало в Кивотосе."
10016010-70 = "Через Хасуми прошу принять мои искренние извинения вместе с чаем высочайшего качества."
10016010-71 = "Я искренне буду издалека болеть за успешное проведение Фестиваля Хало в Кивотосе."
10016010-72 = ""
10016010-73 = "Очень политичный способ сказать: «Мне вообще плевать.»"
10016010-74 = "Не говорите о том, чего не знаете! Обязанности хозяйки «Чаепития» неизмеримы."
10016010-75 = "Уверена, Нагиса долго мучилась с решением, прежде чем с сожалением отказаться от участия в Фестивале Хало."
10016010-76 = "Если преподносить так, то и Общество Пандемониума, наверное, тоже ужасно занято..."
10016010-77 = "...Уф. Нет, я просто не могу заставить себя защищать эту шайку енотов."
10016010-78 = "Они просто свалили всю сложную и важную работу на президента Хину, пока сами придумывают очередную бесполезную схему."
10016010-79 = "Кстати, мы сейчас пьём тот самый чай, который прислала Нагиса?"
10016010-80 = "Надеюсь, нам потом не выставят за него какой-нибудь безумный счёт!"
10016010-81 = "Об этом можете не переживать. Чай специально для студентов «Геенны» был взят с самой нижней полки магазина у дома."
10016010-82 = "Ух ты, как мило. Я уже благодарна, что это не вода из-под крана, хотя разницы почти не чувствую."
10016010-83 = "П-простите... Не думаю, что эта едва прикрытая враждебность помогает эффективному общению..."
10016010-84 = ""
10016010-86 = ""
10016010-87 = "Да, давайте успокоимся. Я поняла ситуацию."
10016010-88 = "Однако..."
10016010-89 = "Неужели даже президент Дисциплинарного комитета или Боевой группы Правосудия не соизволили прийти?! Хотя бы одна из них?"
10016010-90 = "Лучшей пары для запугивания хулиганов и нарушителей не найти. Одного их присутствия было бы достаточно."
10016010-91 = "Н-ну... внимание президента Хины требовалось в другом месте..."
10016010-92 = "В другом месте? В смысле?"
10016010-93 = "Она применяет свои таланты там, где они нужнее. Просить человека её уровня выполнять эту роль — всё равно что... стрелять из гранатомёта по мухе."
10016010-94 = "Хотя Цуруги официально президент Боевой группы Правосудия, внешние дела вроде Исполнительного комитета всегда находились в моём ведении."
10016010-95 = "И если Цуруги будет работать в Исполнительном комитете, число соревнований, в которых сможет участвовать «Тринити», значительно сократится..."
10016010-96 = "Ах."
10016010-97 = "Позвольте уточнить..."
10016010-98 = "Обе ваши президентки участвуют в соревнованиях? Каждая академия специально отправила в Исполнительный комитет самых неспортивных и нескоординированных неуклюжих студентов? И всё только ради того, чтобы... победить?"
10016010-100 = "Называть нас нескоординированными неуклюжими немного грубо! Мои таланты лежат в менее... грубых занятиях."
10016010-101 = "Согласна. Может, с рефлексами у меня совсем чуточку хуже, зато выносливость хорошая!"
10016010-102 = "Да и вообще, в «Геенне» полно выдающихся спортсменок на выбор!"
10016010-103 = "Да-да. Логично, что каждая академия отправляет лучших спортсменок независимо от должности. Чтобы выиграть общий зачёт, нужно показывать высокий результат во всех дисциплинах."
10016010-104 = ""
10016010-106 = ""
10016010-107 = "Вы двое сейчас серьёзно?!"
10016010-108 = "С точки зрения академии — ладно! Я понимаю, насколько важна победа на фестивале. Но это событие должно преодолевать школьные границы! Вы ставите личные желания выше настоящего долга — проведения спортивного фестиваля!"
10016010-109 = "Будто «Миллениум» сам не мечтает забрать победу!"
10016010-111 = "Правда? А я думала, студенты «Миллениума» традиционно избегают спорта и настаивают на превосходстве науки и технологий."
10016010-112 = "Это правда. Они даже ни разу не попадали в рейтинг межшкольного чемпионата по бейсболу. «Миллениум» всегда был известен скорее странными выходками, чем спортивными достижениями..."
10016010-114 = "Э-Это правда, но...!"
10016010-115 = "Но на поле мы будем стараться не меньше, чем старались за кулисами, чтобы этот фестиваль состоялся!"
10016010-116 = "Научная школа «Миллениум» применит передовые научные анализы и спортивную подготовку, чтобы выиграть общий чемпионат! Вот увидите!"
10016010-117 = ""
10016010-119 = ""
10016010-120 = ""
10016010-121 = ""
10016010-122 = ""
10016010-124 = "Кажется, мой совет про продуктивное общение раньше никто не услышал..."
10016010-125 = "Я добровольно вызвалась, воодушевлённая возможностью участвовать в фестивале, символизирующем мир Кивотоса. Наверное, стоило ожидать подобного."
10016010-126 = "[s3] «Разве все не выглядят такими энергичными?»\n[s4] «Перед соревнованием люди иногда немного напрягаются, правда?»"
10016010-127 = "Да, пожалуй..."
10016010-128 = "Да, пожалуй..."
10016010-129 = ""
10016010-131 = ""
10016010-132 = "И почему твой спортивный костюм так подчёркивает грудь?! Студенты «Тринити» даже одеваться нормально не умеют?"
10016010-133 = "Молния на куртке не застёгивалась до конца... Я пыталась..."
10016010-134 = "И вообще, кто бы говорил про мою одежду?! В зеркало посмотри!"
10016010-135 = "Надеюсь, сегодня всё пройдёт гладко."
