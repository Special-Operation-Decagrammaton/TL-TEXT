10027115-8 = ""
10027115-14 = "Съезд фанфиков"
10027115-15 = ""
10027115-16 = "..."
10027115-17 = "Значит... После всего этого Фронт освобождения знаний всё-таки пропустил дедлайн."
10027115-18 = "Не скажу, что удивлена. Чтобы они успели, понадобилось бы чудо."
10027115-19 = "Жаль, что я не могу помочь. Но как критик и президент клуба я обязана сохранять беспристрастность."
10027115-20 = "Возможно, в будущем наши пути пересекутся в более значимых обстоятельствах. Всего доброго..."
10027115-21 = ""
10027115-23 = ""
10027115-25 = "Стойте!!"
10027115-26 = "Фронт освобождения знаний прибыл и готов подать свою работу!"
10027115-28 = "Вы закончили рукопись?!"
10027115-30 = "Именно! Вот!"
10027115-31 = ""
10027115-33 = ""
10027115-35 = "Что ж, появляться эффектно вы умеете."
10027115-43 = ""
10027115-44 = "Считайте, что рукопись принята."
10027115-45 = "Хотя я всё ещё не могу поверить. Вы ведь не сделали ничего незаконного, правда?"
10027115-47 = "За кого вы нас принимаете?!"
10027115-48 = ""
10027115-50 = ""
10027115-53 = "[ns] «Мы все очень старались над ней...»"
10027115-54 = "С-Сенсей?! Вы выглядите так, будто сейчас рухнете!"
10027115-55 = "[s] «Всё нормально. Я ещё не упал!»"
10027115-56 = "Хм... Если вы уверены..."
10027115-58 = "Без вашей помощи мы бы точно не справились, Сенсей..."
10027115-59 = "...Даже добраться сюда было целым сражением. Сначала Секретариат, потом Трудовая партия... Фух!"
10027115-61 = "Не совсем понимаю, при чём здесь Секретариат и Трудовая партия."
10027115-62 = "Но рада видеть, что вы двое помирились."
10027115-64 = "О, это было всего лишь небольшое разногласие. В масштабах всего происходящего — сущая мелочь—"
10027115-65 = "Эм, Мэру?"
10027115-66 = "Прости. Да, мы извинились друг перед другом и помирились..."
10027115-68 = "Тогда поздравляю. Что касается содержания и качества рукописи..."
10027115-69 = "..."
10027115-70 = "Мне даже не нужно её читать, чтобы представить результат. Судя по вашему состоянию—"
10027115-72 = "Хмф! Ты опять включила свою старую неискреннюю манеру, а значит... На самом деле ты удивлена, что у меня получилось, да? И неужели это лёгкий намёк на... восхищение?!"
10027115-73 = "Наверняка думаешь: «Типичная Мэрури... Она настолько гениальна и великолепна, что мой ограниченный разум просто не способен её понять!»"
10027115-74 = "А-а-а! Да кто ты вообще такая?!"
10027115-75 = ""
10027115-77 = ""
10027115-78 = ""
10027115-79 = "А, вот она, Таканэ, которую мы все знаем и терпеть не можем!"
10027115-80 = "Кто бы говорил! Ты вообще ни капли не изменилась!"
10027115-81 = "Ты буквально сняла слова с моего языка!"
10027115-83 = "После всего, через что ты прошла, я думала, ты хоть немного повзрослеешь."
10027115-84 = "Я постоянно взрослею! Вообще-то взрослее уже некуда!"
10027115-85 = ""
10027115-87 = ""
10027115-89 = "[ns1] «Ну-ну. Мы наконец закончили рукопись.»\n[ns2] «Нам нужно лишь вести себя цивилизованно достаточно долго, чтобы Таканэ её оценила.»"
10027115-92 = ""
10027115-93 = "Хм... Теперь, когда вы двое помирились, похоже, роли поменялись."
10027115-94 = "В любом случае, процедура есть процедура, а критик обязан оставаться беспристрастным."
10027115-95 = "Хорошо, Мэрури. Сейчас я оценю твою рукопись."
10027115-96 = ""
10027115-98 = ""
10027115-101 = ""
10027115-103 = "Эй-эй! Тайм-аут!"
10027115-105 = "А? Кто...?"
10027115-106 = "О?"
10027115-107 = ""
10027115-109 = ""
10027115-111 = ""
10027115-112 = "Ух ты! Я знала, что у тебя получится, Мэру."
10027115-114 = "Якумо?!"
10027115-115 = "Это... президент?!"
