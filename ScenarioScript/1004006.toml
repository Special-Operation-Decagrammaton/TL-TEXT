[translation]
1004006-1 = "Мой шанс показать навыки ниндзя!"
1004006-2 = "Я направлялся помочь Цукуё с её тренировкой ниндзя."
1004006-3 = "Чоко! Куда ты делся, Чоко?!"
1004006-4 = "О... Та девочка..."
1004006-5 = "[s] «Это та маленькая девочка, которой Цукуё помогала раньше.»"
1004006-6 = "Ч-Что случилось...?"
1004006-7 = "О! Это та девушка, которая помогла мне в прошлый раз, плюс ещё один человек!"
1004006-8 = "[s] «Я всего лишь „плюс один“...»"
1004006-9 = "*рыдает* Что мне делать? Чоко пропал."
1004006-10 = "К-Кто такой Чоко?"
1004006-11 = "Мой щенок! Только что был здесь..."
1004006-12 = "Но я случайно отпустила поводок, и он убежал..."
1004006-13 = "Что мне делать?! А вдруг он никогда не вернётся? *рыдает*"
1004006-14 = "О, у-успокойся! Пожалуйста, не плачь..."
1004006-15 = "Э-Это совсем не помогает... Уф!"
1004006-16 = "Она не перестаёт плакать! Ч-Что мне делать, Сенсей?!"
1004006-17 = "[s] «Всё нормально. Мы поможем найти Чоко.»"
1004006-18 = ""
1004006-19 = "А?"
1004006-20 = "А-А?"
1004006-21 = "[s1] «Цукуё! Это отличный шанс!»\n[s2] «Ты сможешь вырасти как ниндзя, выполнив просьбу клиента!»"
1004006-22 = "...О! К-Как умно, Сенсей!"
1004006-23 = "...О! К-Как умно, Сенсей!"
1004006-24 = "Х-Хорошо! Поняла! Это тот момент, когда мне нужно выйти из зоны комфорта, чтобы вырасти как ниндзя!"
1004006-25 = "Н-Не волнуйся, девочка! Я-я... то есть мы с Сенсеем поможем найти Чоко! Обещаю!"
1004006-26 = "*шмыгает носом* ...Правда...?"
1004006-27 = "Да! Ниндзя всегда выполняют обещания!"
1004006-28 = "...Хорошо!"
1004006-30 = "Основы выслеживания начинаются с мест, где цель, скорее всего, появится!"
1004006-31 = "Согласно нашим данным, стоит проверить маршруты, по которым его обычно выгуливают!"
1004006-32 = "[s] «О! Цукуё! Ты ведёшь себя как настоящий ниндзя!»"
1004006-33 = "Хи-хи, хи-хи-хи. Вообще-то я изучала такие навыки выслеживания."
1004006-34 = "Это шанс проверить, чему я научилась! Пожелайте удачи!"
1004006-35 = "(Хи-хи, хи-хи-хи... Сегодня я покажу Сенсею, насколько выросла.)"
1004006-36 = "[s] «Кстати, Цукуё...»"
1004006-37 = "Да, Сенсей!"
1004006-38 = "[s] «Это случайно не Чоко вон там?»"
1004006-39 = "А?"
1004006-40 = ""
1004006-44 = "[ns] «О, он убегает.»"
1004006-45 = "В-Вааа?! Он убегает! М-Мои навыки выслеживания!"
1004006-46 = "П-Подожди...! Ч-Чоко...!"
1004006-47 = ""
1004006-49 = ""
1004006-52 = ""
1004006-53 = "Пожалуйста, стоооой!"
1004006-54 = ""
1004006-56 = ""
1004006-59 = ""
1004006-60 = "П-Пожалуйста... о-остановись..."
1004006-61 = ""
1004006-63 = ""
1004006-66 = "С-Стой..."
1004006-67 = ""
1004006-73 = "[ns] «Хорошо... Стой там. Стой.»"
1004006-75 = "[ns] «Сейчас!»"
1004006-82 = "К счастью, мы без проблем поймали Чоко."
1004006-84 = "[ns3] «Цукуё, я его поймал! Цукуё?»\n[ns4] «...А? Где Цукуё?»"
1004006-90 = "С-Сенсей... П-Помогите..."
1004006-92 = "[ns] «Она написала, что где-то здесь...»"
1004006-93 = "С-Сенсеээээй... Я здееесь..."
1004006-94 = "[s] «Я слышу её голос отсюда...»"
1004006-97 = "― У-Уф...[wa:860]"
1004006-99 = "― Я хотела сократить путь и пройти здесь...[wa:2880]"
1004006-102 = "― Но, как видите, я...[wa:2080]"
1004006-104 = "― полностью застряла..."
1004006-107 = "― Не волнуйтесь! Это идеальный момент...[wa:1490]"
1004006-109 = "― использовать ниндзюцу![wa:1680]"
1004006-112 = "― Уф... У-у-уф!!![wa:1580]"
1004006-114 = "― Н-Не получается...[wa:2220]"
1004006-117 = "― У-уф... Уф![wa:2140]"
1004006-119 = "― С-Сенсей... М-Можете помочь...? Пожалуйста?[wa:2520]"
1004006-124 = ""
1004006-125 = "О! Чоко!"
1004006-127 = "Спасибо, что снова помогли мне! Вы нашли Чоко!"
1004006-128 = "О-О, без проблем. Для ниндзя это пустяк!"
1004006-129 = "Чоко... Больше не заставляй её волноваться, хорошо?"
1004006-131 = "Ч-Чоко? П-Подожди, щекотно! О, п-пожалуйста, не лижи меня там..."
1004006-132 = "Мои ноздри! А-Апчхи!"
1004006-133 = "Кстати... одежда вся помята, а волосы растрёпаны. Где ты нашла Чоко?"
1004006-134 = "О, ну... Эм..."
1004006-135 = "Мне пришлось через многое пройти!"
1004006-136 = "Что это значит?"
1004006-138 = ""
1004006-139 = "Пока, вы двое! Пойдём, Чоко!"
1004006-141 = "*вздыхает* ...Я рада, что мы нашли Чоко, но..."
1004006-142 = "Я... я думала, что навсегда застряну между этими стенами."
1004006-143 = "Я не могла двигаться и... я запаниковала!"
1004006-144 = "[s5] «Я рад, что мы нашли собаку и ты не пострадала.»\n[s6] «Ты успешно выполнила просьбу.»"
1004006-145 = "Д-Да! Я выполнила просьбу клиента как ниндзя!"
1004006-146 = "Д-Да! Я выполнила просьбу клиента как ниндзя!"
1004006-147 = "Я-я не оправдала всех ожиданий от ниндзя... но благодаря вам хотя бы смогла сдержать слово!"
1004006-148 = "Сегодня я многому научилась! Говорят, путь в тысячу миль начинается с одного шага..."
1004006-149 = "Чтобы подготовиться к следующему разу, я изучу ниндзюцу побега на случай, если снова застряну между стенами!"
1004006-150 = "[s] «А? Вот какой вывод ты сделала?»"
1004006-151 = "С вашей поддержкой..."
1004006-152 = "Мне кажется, однажды я стану великим, полноценным ниндзя!"
1004006-153 = "Эм, С-Сенсей!"
1004006-154 = "Я с нетерпением жду будущего... Пожалуйста, продолжайте за мной присматривать!"
1004006-155 = "[s] «Да, я тоже жду, когда ты станешь великим ниндзя.»"
1004006-156 = "Хи-хи... Хи-хи-хи!"
