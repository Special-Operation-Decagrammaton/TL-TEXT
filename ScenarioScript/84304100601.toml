[translation]
84304100601-5 = "Если когда-нибудь заинтересуешься — скажи!"
84304100601-6 = "О, вот это будет весёлая тренировка!"
84304100601-7 = "Рада, что ты так это воспринимаешь..."
84304100601-8 = "...но ты ведь не знаешь, кто я, да?"
84304100601-9 = "...А? Что ты имеешь в виду?"
84304100601-10 = "Ты какой-то известный тренер или...?"
84304100601-11 = "...Нет, всё нормально. Не бери в голову."
