[translation]
80000010-1 = "Несчастливая гурманка"
80000010-2 = "Кондитерская в районе Хяккияко"
80000010-5 = "Это та традиционная лавка, о которой ты говорил? Где продают данго в шоколаде?"
80000010-6 = "Я сильно сомневалась, когда ты сказал, что знаешь место, о котором даже я никогда не слышала."
80000010-7 = "Но оно и правда в глуши. Неудивительно, что многие студенты о нём не знают. Спасибо за подсказку."
80000010-8 = "Посмотрим... Ты был прав, тут много интересных видов данго."
80000010-9 = "Похоже, это сделано с черничным порошком."
80000010-10 = "А в том что, заварной крем?"
80000010-11 = "Всё меню выглядит таким интересным.#nВот бы попробовать всё!"
80000010-12 = "[s] «Так почему бы и нет?»"
80000010-13 = "Да ни за что! В этом месяце я и так слишком часто ела вне дома.#nКошелёк уже еле жив!"
80000010-14 = "К тому же я не Акари. Есть вещи, которые даже я не смогу съесть."
80000010-15 = "Вот бы мне взрослый желудок и взрослый бюджет, как у тебя!"
80000010-16 = "[s] «Это не у всех моего возраста так.»"
80000010-17 = "Да? Ну и ладно. Суть в том, что все данго я взять не могу,#nтак что придётся выбирать."
80000010-18 = "Сначала попробую их фирменное шоколадное данго."
80000010-19 = "Может, будет похоже на митараси-данго: соус тоже горько-сладкий... Ладно, узнаю, когда попробую."
80000010-20 = ""
80000010-21 = "Простите. Можно нам два шоколадных данго?"
80000010-22 = "[s] «Два? Я думал, ты решила выбирать.»"
80000010-23 = "А? Я не оба себе заказываю."
80000010-24 = "Второй тебе. Я угощаю."
80000010-25 = "Без тебя я бы вообще не узнала об этом месте, так что считай это благодарностью."
80000010-26 = "К тому же сегодня День святого Валентина..."
80000010-27 = "Так что... неважно. Просто замолчи и ешь!"
80000010-28 = ""
80000010-30 = ""
80000010-32 = "Пожалуйста. Две порции шоколадного данго."
80000010-33 = "А! Наконец-то!"
80000010-34 = "Приступим!"
80000010-35 = ""
80000010-37 = ""
80000010-38 = ""
80000010-42 = "Это здесь продают ту мерзость, которую называют шоколадным данго?"
80000010-43 = "Как они СМЕЮТ так позорить доброе имя данго?!#nБанда «Моти-Моти Шлемов» этого не потерпит!"
80000010-44 = "Хорошему данго нужны только соевая мука и соевый соус!"
80000010-45 = "Начнём с уничтожения этих преступлений против природы, которые они называют данго."
80000010-46 = ""
80000010-47 = "Моё данго..."
80000010-48 = "Оно упало на пол. Я даже кусочка не успела откусить..."
80000010-49 = "К-Кто вы такие?"
80000010-50 = "Неужели девушка не может спокойно насладиться данго?"
80000010-51 = "Ничто не бесит меня сильнее, чем уроды вроде вас, которые встают между мной и моим данго!"
80000010-52 = "Ч-Что ты несёшь?! Мы тебя вообще не знаем!"
80000010-53 = "Забудьте про шоколадное данго..."
80000010-54 = "Я нажрусь вашими слезами!"
80000010-61 = "После этого Джунко избила шлемоносцев до полной капитуляции."
80000010-62 = "К сожалению, в перестрелке все данго были уничтожены, так что Джунко так их и не попробовала..."
