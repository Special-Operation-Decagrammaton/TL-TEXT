[translation]
21100-1 = "Episódio 10;De Volta às Ruínas"
21100-2 = "Ruínas"
21100-3 = "...Sensei!"
21100-4 = "Abaixe-se!!"
21100-5 = "(KABUUUUM!)"
21100-6 = "Ugh... Pessoal, estão bem?"
21100-7 = "Eu estou bem, mas o poder de fogo deles é maior do que eu pensava... Sensei, você está bem?!"
21100-9 = "[ns] \"Sim, estou bem.\""
21100-10 = "Aí vêm eles, os robôs...!"
21100-11 = "Tudo bem, ainda consigo atraí-los...!"
21100-12 = "...Beleza,"
21100-13 = "Aris-chan!"
21100-14 = "Manda ver!"
21100-16 = "(Acena com a cabeça)"
21100-17 = "Meu papel hoje é de atacante em área do elemento Luz..."
21100-18 = "Vou aniquilar os monstros à frente."
21100-19 = "...Luz!"
21100-20 = "(KABUUUUM!)"
21100-21 = "Isso, deu certo!"
21100-22 = "Aris-chan, incrível!"
21100-23 = "A-Ainda não! A segunda onda de inimigos está se aproximando!"
21100-24 = "Uma onda atrás da outra aqui já é demais... Estamos em desvantagem, vamos recuar! O Sensei também está aqui, então segurança em primeiro lugar — com certeza é melhor repensar o plano...!"
21100-25 = "...Não."
21100-26 = "...Não podemos recuar agora. Vamos abrir caminho."
21100-27 = "Quê?!"
21100-28 = "Mesmo se recuarmos agora, a situação só vai piorar. Os robôs devem ter ouvido o barulho da batalha e vão continuar se juntando cada vez mais."
21100-29 = "Não sei quantos existem ao todo, mas provavelmente agora é quando a defesa está mais fraca... Acho que esta é a nossa melhor chance de entrar naquela \"fábrica\" indicada pelas coordenadas do G.Bible."
21100-31 = "M-Mas..."
21100-32 = "Vai ficar tudo bem."
21100-33 = "Aris-chan...?"
21100-34 = "Até agora, nós completamos juntas 27 explorações de masmorra e 139 batalhas de raide com sucesso."
21100-35 = "Com certeza desta vez também... com este grupo, nós conseguiremos vencer."
21100-36 = "M-Mas isso era nos jogos, né?!"
21100-37 = "Aconteça o que acontecer, vai ser perigoso... Eu também vou dar o meu melhor."
21100-38 = "M-Mas e o Sensei? Diferente da gente, se ele levar um golpe...!"
21100-39 = "Não se preocupe."
21100-40 = "Hã?"
21100-41 = "Não importa o quão perigosa seja a situação, a Aris vai proteger o Sensei."
21100-43 = "Sensei... você confia na Aris e vem junto com a gente?"
21100-44 = "[s1] \"Claro.\"\n[s2] \"Sim. Como parte do grupo, vou fazer o que estiver ao meu alcance.\""
21100-45 = "...!"
21100-46 = "...!"
21100-47 = "Pan-paka-paaan! O Sensei entrou novamente para o grupo!"
21100-48 = "Ufa... Tá bom, eu também vou me preparar pra valer!"
21100-49 = "Clube de Desenvolvimento de Jogos, vamos romper a linha inimiga!"
21100-50 = "Sensei, contamos com o seu comando!"
