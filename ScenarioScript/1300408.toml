[translation]
1300408-1 = "В погоне за здоровьем"
1300408-2 = "Спортивная площадка школы Абидос"
1300408-3 = "О, вот вы где, Сенсей!"
1300408-4 = "Вот. Гантели."
1300408-5 = "Так... двадцать пять пятикилограммовых... десять десятикилограммовых... и пять пятнадцатикилограммовых."
1300408-6 = "Что? Ты не знал, что мы купили столько?"
1300408-7 = "Забавно, что ты это сказал... Кажется, Широко сказала то же самое."
1300408-8 = "Хм... Может, я переборщила. Откуда мне было знать, сколько гантелей нам понадобится...?"
1300408-9 = "Нам хватило бы одной пятикилограммовой? М-Может быть..."
1300408-10 = "Наверное, лишние можно отдать в школьный спортзал Абидоса."
1300408-11 = "К сожалению, сейчас он всё ещё закрыт... Надеюсь, мы снова сможем им пользоваться, когда школа вернётся в норму."
