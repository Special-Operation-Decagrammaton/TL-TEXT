[translation]
1002306-1 = "Погребённые в песке"
1002306-3 = "Что ты делаешь?"
1002306-4 = "[s1] «То, на что похоже.»\n[s2] «Принимаю песочную ванну.»"
1002306-5 = "*вздыхает*"
1002306-6 = "*вздыхает*"
1002306-7 = "Когда я услышала, что ты валяешься на пляже, я ожидала, что ты придумываешь способ заглядывать девушкам под юбки."
1002306-8 = "Приятно видеть, что хоть раз ты занимаешься чем-то нормальным."
1002306-9 = "[s3] «За кого ты меня принимаешь — за какого-то извращенца?»\n[s4] «Под юбки не заглянешь, когда на людях вообще нет юбок!»"
1002306-10 = "Пожалуй, в этом есть смысл. Здесь все будут в купальниках..."
1002306-11 = "Пожалуй, в этом есть смысл. Здесь все будут в купальниках..."
1002306-12 = "...но от этого ты не становишься менее подозрительным."
1002306-13 = "Серьёзно, закапываться в песок в такой раскалённый день."
1002306-14 = "Ты что, мазохист?"
1002306-15 = "[s] «Хочешь попробовать, Иори?»"
1002306-16 = "Нет, спасибо. Мне хватает и того, что я наступаю на горячий песок."
1002306-17 = "[s5] «Ты удивишься. Тут не так жарко, как кажется.»\n[s6] «Под песком на самом деле прохладнее.»"
1002306-18 = "Что-то здесь не так..."
1002306-19 = "Что-то здесь не так..."
1002306-20 = "...но ты вроде не страдаешь и не выглядишь перегретым."
1002306-21 = "Наверное, можно попробовать совсем ненадолго."
1002306-22 = "[s] «Хорошо, ложись здесь.»"
1002306-23 = ""
1002306-25 = ""
1002306-26 = ""
1002306-27 = ""
1002306-28 = "[ns] Засыпать тело Иори песком."
1002306-30 = "Ты прав. Намного прохладнее, чем я ожидала."
1002306-31 = "Наверное, потому что песок защищает меня от прямых солнечных лучей."
1002306-32 = "[s] «Так ещё и приятно вздремнуть.»"
1002306-33 = "Я не могу. Что подумают другие студенты, если увидят, что член Дисциплинарного комитета спит на пляже?"
1002306-34 = "Хотя это и правда очень расслабляет. Мне даже немного хочется спать..."
1002306-35 = "Кстати, прошлой ночью я допоздна работала и почти не спала."
1002306-36 = "..."
1002306-38 = "А? Когда я успела уснуть?"
1002306-39 = "Под прохладным песком было так приятно, что я сама не заметила, как заснула."
1002306-40 = "Лучше встать, пока никто не увидел."
1002306-43 = ""
1002306-44 = ""
1002306-45 = "Что происходит?! Я вообще не могу двигаться!"
1002306-46 = "Меня ведь просто засыпали песком. Почему нижняя половина тела ощущается так, будто её завалило обломками?!"
1002306-47 = ""
1002306-49 = ""
1002306-52 = "Что. За. Чёрт. Это. ТАКОЕ?!"
1002306-54 = "[ns] «О, ты уже проснулась?»"
1002306-55 = "Сенсей! Что ты, чёрт возьми, со мной сделал?!"
1002306-56 = "[s7] «Красиво ведь, правда?»\n[s8] «Нелегко было аккуратно сделать все мелкие детали.»"
1002306-57 = "Я не спрашивала твоего мнения! Как ты мог устроить такую грубую шутку над спящим человеком?!"
1002306-58 = "Я не спрашивала твоего мнения! Как ты мог устроить такую грубую шутку над спящим человеком?!"
1002306-59 = ""
1002306-60 = "Что происходит? Почему песок не разваливается?!"
1002306-61 = "[s] «Я добавил цемент, чтобы было прочнее.»"
1002306-62 = "Ты использовал цементный порошок? Это не то, чем шутят!"
1002306-63 = "Кто вообще ради забавы смешивает цемент с песком?!"
1002306-64 = "[s] «Я подумал, будет жалко, если всё развалится до того, как ты проснёшься...»"
1002306-65 = "Делай свои художественные проекты где-нибудь ещё!"
1002306-66 = "Чёрт... Вот бы до бомбы дотянуться."
1002306-67 = "[s] Достать телефон и сфотографировать Иори."
1002306-68 = ""
1002306-70 = ""
1002306-74 = "Ч-Что ты делаешь?! Прекрати!"
1002306-76 = "Я сказала прекрати! Не смей меня фотографировать!"
1002306-77 = "Только дождись, пока я выберусь! Я тебя убью!"
1002306-79 = "Я ещё немного понаблюдал за Иори, а затем помог ей выбраться из песчаной статуи."
1002306-80 = ""
1002306-84 = "...Как только освободилась, она сразу меня ударила."
