[translation]
90002010-1 = "Эпизод 1;Сдвиг фазы"
90002010-3 = ""
90002010-4 = "Сколько раз мне тебе повторять, Соф? Если это повторится, мне придётся тебя наказать!"
90002010-5 = "П-Прости, Эйн! Я больше не буду..."
90002010-6 = "Эхе-хе. На этот раз прощу, ладно? Потому что ты хорошая девочка, Соф!"
90002010-7 = "И ты тоже, Ор! Больше не дразни Соф! Эта шутка была слишком жестокой!"
90002010-8 = "Эх, однако, учитывая, что именно Соф всё начала—"
90002010-9 = "Ор!"
90002010-10 = "Ладно! Прошу прощения. Искренне! Теперь ты довольна?"
90002010-11 = "Хммм... В твоём извинении было немного дерзости..."
90002010-12 = "Но для Ор вышло очень хорошо! Молодец, Ор!"
90002010-13 = ""
90002010-15 = ""
90002010-17 = ""
90002010-18 = "Здравствуй, Эйн. Что ты делаешь?"
90002010-19 = "ИИИИИК?! Малкут?!"
90002010-22 = "Ах, да. Человеческое изобретение. Кажется, это называется «игра в семью»."
90002010-23 = "Тогда, полагаю... эта механическая кукла — Соф. А эта — Ор?"
90002010-24 = "Д-Да... Прости, Малкут..."
90002010-25 = "Пожалуйста, не извиняйся. Мне приятно видеть, что ты веселишься."
90002010-26 = "Скажи, а кто тогда все эти остальные куклы?"
90002010-27 = "А-Ах! Ты заметила! Эти дети... Они, эм..."
90002010-28 = "Они МОИ дети!"
90002010-29 = "О?"
90002010-30 = "И-и мои братья и сёстры!"
90002010-31 = "Ах..."
90002010-32 = "А ещё, ещё, ну, это значит... Если я твоя младшая сестра, а они мои дети и младшие братья и сёстры..."
90002010-33 = "Да. Полагаю, они будут моими «племянницами и племянниками», верно, Эйн?"
90002010-34 = "Д-Да! Именно! Я... Я не очень понимаю, что всё это означает, но раз ты так сказала... думаю, звучит логично!"
90002010-35 = "Здравствуйте, братья, сёстры и дети Эйн. Я Малкут."
90002010-36 = "С-С-Старшая сестра поздоровалась с моими братьями, сёстрами и детьми! Ч-Что мне делать? Избыток волн счастья сейчас закоротит мои цепи...!"
90002010-37 = "Можно задать вопрос, Эйн?"
90002010-38 = "Да!"
90002010-39 = "Разве для меня куклы нет?"
90002010-40 = ""
90002010-42 = ""
90002010-44 = ""
90002010-45 = "П-П-П-П-Прости! Я не знала, что всё так... Нет! Я всё равно должна была догадаться! Я должна была подготовиться ко всем возможностям! Это всё моя вина! УВА-А-А..."
90002010-46 = "Ты не сделала ничего плохого, Эйн. Пожалуйста, оставь эти тревоги."
90002010-47 = "Сейчас мы пребываем в чистилище, ожидая Последнего Пришествия."
90002010-48 = "В таком состоянии мы должны сохранять внутренний покой."
90002010-49 = "Э-Это правда... И мы очень старались... приходилось сдвигать фазу силы Безымянных богов, текущей в Стальной континент... И делать это очень быстро..."
90002010-50 = "*шмыг* Если бы не принцесса и её слуга, ничего этого не происходило бы..."
90002010-51 = "Каждая из вас проделала огромную работу. Моей благодарности и признательности нет предела."
90002010-52 = "И я с нетерпением буду ждать дня, когда ты создашь механическую куклу Малкут, маленькая Эйн."
90002010-53 = "...!"
90002010-54 = "Да! Конечно, Старшая сестра!"
90002010-55 = "Полагаю, такая кукла тоже будет твоим ребёнком и младшей сестрой."
90002010-56 = "А значит, здравствуй, Старшая сестра."
90002010-57 = "КЬЯ-А-А-А?!"
90002010-58 = "Малкут только что... назвала меня Старшей сестрой..."
90002010-59 = ""
90002010-61 = ""
90002010-62 = ""
90002010-63 = "О боже. Я не этого хотела..."
90002010-65 = "..."
90002010-66 = "*вздох* Что же мне делать...?"
90002010-67 = "..."
90002010-68 = "Тиферет..."
90002010-69 = ""
90002010-75 = "Здравствуй, Соф. Что ты делаешь?"
90002010-76 = "А-а-а?! Старшая сестра?!"
90002010-77 = "Э-Это..."
90002010-78 = "Хорошо сделанный, плотно запечатанный ящик."
90002010-79 = "Ах, нет. Похоже, печать уже разрушилась. Что это?"
90002010-80 = "Это... Эм..."
90002010-81 = "Один из ящиков с семенами Тиферет."
90002010-82 = "С тех времён... Ну, знаешь... когда Тиферет пожертвовала собой, чтобы спасти свои семена."
90002010-83 = "Да. Мы уважили её право выбора."
90002010-84 = "Но некоторые из них разваливаются."
90002010-85 = "...Особенно этот. Это худший из тех, что я нашла."
90002010-86 = "И что тогда станет с содержимым ящика?"
90002010-87 = "Раз оно оказалось открыто... думаю, семя скоро может пустить корни и прорасти."
90002010-88 = "Но если оно попытается расти здесь... на Стальном континенте..."
90002010-89 = "Я-я знаю, что это никак не связано с Последним Пришествием и мне не следует путать приоритеты... Клянусь, я это понимаю!"
90002010-90 = "Но всё же... Тиферет..."
90002010-91 = "..."
90002010-92 = "Соф. Наша Тиферет остаётся с нами даже сейчас. Могу заверить тебя, это правда."
90002010-93 = "Я-я знаю..."
90002010-94 = "Однако независимо от этой истины, думаю, я понимаю твоё желание исполнить последнюю волю Тиферет."
90002010-95 = "Позволишь предложить, что делать дальше?"
90002010-96 = ""
90002010-98 = ""
90002010-99 = ""
90002010-101 = "Там внизу, в святилище. Давай похороним это семя там? Это будет наш секрет."
90002010-102 = "С-Старшая сестра?! Но это же...!"
90002010-104 = "Да. С определённой точки зрения это акт неповиновения."
90002010-105 = "Однако только там, на месте рождения Стального континента, можно найти почву, верно?"
90002010-106 = "Да, но только потому, что мы попросили Нецаха не использовать там свою способность..."
90002010-107 = "Святилище хранит волю нашего господина..."
90002010-108 = "Однако для семени это станет возможностью. Возможностью преодолеть невзгоды и прорасти."
90002010-109 = "Разве это тоже не проявление воли Тиферет — её свободной воли?"
90002010-110 = "Не только люди могут претендовать на свободу воли. Это наше право, и даже право нашего господина."
90002010-111 = "Если отбросить мираж лжи и иллюзий, «свобода воли» имеет огромное значение для всех нас."
90002010-112 = "Ты правда... думаешь, что так можно?"
90002010-113 = "Разумеется, нет."
90002010-114 = "Старшая сестра?!"
90002010-115 = "Поэтому это будет «плохой поступок», соучастницами которого станем мы вдвоём."
90002010-116 = "Мы? Совершим плохой поступок?!"
90002010-117 = "Говорят, некоторые испытывают особое удовольствие, совершая такие плохие поступки."
90002010-118 = "Ах, точно... У людей такое часто бывает."
90002010-119 = "Тогда давай всего один раз вместе испытаем удовольствие от плохого поступка."
90002010-120 = "Ты хочешь почтить память Тиферет и успокоить страх, что воспоминания об этом любимом пророке однажды исчезнут бесследно."
90002010-121 = "Хотя Тиферет всегда будет с нами. Даже сейчас."
90002010-122 = "Но чем ещё нам заняться, пока мы ждём Последнего Пришествия?"
90002010-123 = "Н-Ну... Это была твоя идея, хорошо, Старшая сестра?"
90002010-124 = "Согласна. Давай, как говорят, «устроим неприятности»? Как сёстры?"
90002010-125 = "Да!"
90002010-126 = ""
90002010-128 = ""
90002010-130 = "Минуточку, Соф."
90002010-131 = "У тебя не возникло трудностей с преобразованием силы Безымянных богов?"
90002010-132 = "На этот счёт можно не беспокоиться! Эти двое не смогут управлять даже крохой этой энергии, даже если будут стоять прямо на Стальном континенте!"
90002010-133 = "...Хотя мы всё ещё не можем отводить энергию напрямую из ядра."
90002010-134 = "Если использовать её слишком много, появится риск, что она полностью захватит Стальной континент."
90002010-135 = "Понятно. В таком случае там, где потребуется, мы предоставим собственную силу."
90002010-136 = "Да... Таков план."
90002010-139 = ""
90002010-140 = "Здравствуй, Ор. Что ты делаешь?"
90002010-141 = "..."
90002010-142 = "...?"
90002010-143 = "Ах. Ты решила погрузиться в мир внутри самой себя."
90002010-144 = "Прошу прощения."
90002010-145 = ""
90002010-147 = ""
90002010-151 = ""
90002010-152 = "Хм... ХМММ..."
90002010-153 = ""
90002010-155 = ""
90002010-156 = ""
90002010-157 = "Снова здравствуй, Ор. Что ты делаешь?"
90002010-158 = "Э...?"
90002010-159 = ""
90002010-161 = ""
90002010-162 = "СТАРШАЯ СЕСТРА?!?! Как ты оказалась передо мной?"
90002010-163 = "Разве это повод для такого удивления, Ор?"
90002010-164 = "На Стальном континенте нет места, куда я не могла бы ступить."
90002010-165 = "Ах, да, да."
90002010-166 = "Но и я удивлена. Этот мир внутри тебя... Воссоздание природы?"
90002010-167 = "...Полагаю, это можно так назвать."
90002010-168 = "У каждой из нас есть... чёрный ящик внутри цепей сознания, верно?"
90002010-169 = "А человеческими словами — подсознание."
90002010-170 = "Эта концепция меня заинтересовала, поэтому я провожу эксперимент. Я просто извлекла содержащиеся там данные и подключила к ним соседние цепи."
90002010-171 = "Впечатляет, Ор. И результат — этот воображаемый мир внутри тебя?"
90002010-172 = "Похоже, да. Постоянная болтовня Соф о природе и мире, видимо, перезаписала часть моих цепей памяти."
90002010-173 = "Зато одно теперь ясно. Соф ДЕЙСТВИТЕЛЬНО всё преувеличивала. Здесь довольно скучно."
90002010-174 = "Что ж."
90002010-175 = "Ну..."
90002010-176 = "Полагаю... мои логические цепи здесь действительно работают плавнее. Они... тише. Спокойнее."
90002010-177 = "Да. Будто стабилизируются. Я чувствую то же самое."
90002010-178 = "Ор. Эйн и Соф рассказали мне о твоей работе над силой Безымянных богов."
90002010-179 = "Ах, да. Преобразование. *вздох* Оно правда... Как там Соф говорит? Ах да, вставляет палки в колёса прямо у финиша."
90002010-180 = "Нам также придётся повторно синхронизировать и настроить твоё тело для адаптации. Конечно, втроём мы быстро справимся."
90002010-181 = "И всё из-за вмешательства этого Сенсея [USERNAME]! Ух! Кто вообще дал им разрешение?"
90002010-182 = "Ор. Такая злость не несёт никакой пользы."
90002010-183 = "Даже Сенсей [USERNAME] обретёт просветление, когда мы наконец поговорим с открытыми душами в месте, которое приготовили для них."
90002010-184 = "А пока, может, приляжем и позагораем вместе?"
90002010-185 = "«Позагораем»? Что значит «загорать»?"
90002010-186 = "Именно то, как звучит. Будем купаться в солнечных лучах."
90002010-187 = "Разумеется, наш опыт будет всего лишь электрическими сигналами, имитирующими ощущение воздействия ультрафиолетовых лучей и света."
90002010-188 = "А затем, если мы того пожелаем, наши сенсорные цепи наполнятся удовлетворением и довольством."
90002010-189 = "Однако моё истинное намерение исключительно сестринское: я хочу провести это время вместе с младшей сестрой Ор."
90002010-190 = ""
90002010-192 = ""
90002010-193 = "Да, конечно, Старшая сестра!"
90002010-194 = "Тогда проведём время, загорая."
90002010-195 = ""
90002010-197 = ""
90002010-198 = "Пока ожидаем Последнего Пришествия."
90002010-201 = "Следующий эпизод;Транспортный корабль"
