[translation]
10007030-1 = "Эпизод 3;Подозрительный взгляд"
10007030-2 = "Курорт горячих источников №227 — особая приватная купальня"
10007030-4 = "Пока я наслаждался приятной ванной в горячем источнике..."
10007030-5 = "[s] «Какой хороший источник!»"
10007030-6 = "Хи-хи-хи!"
10007030-7 = ""
10007030-9 = ""
10007030-10 = ""
10007030-11 = ""
10007030-12 = "[ns1] «К-Кто там?!»\n[ns2] «...Нодока? Это ты?»"
10007030-15 = "Ой, чёрт. Похоже, ты меня поймал."
10007030-16 = "Полагаю, мне ничего не остаётся, кроме как показаться..."
10007030-17 = ""
10007030-21 = ""
10007030-22 = "[ns] «...Ты кто?»"
10007030-23 = "Я много о тебе слышала, но лично встречаю впервые, Сенсей."
10007030-24 = "Я Химэки Мэру из Фронта освобождения знаний! Можешь звать меня по псевдониму — Мэрури. ★"
10007030-25 = "[s3] «Фронт освобождения знаний — это...»\n[s4] «Сборище, которое коллекционирует странные книги?»"
10007030-26 = "Ага! Ты ведь уже встречал Момидзи, да?"
10007030-27 = "У нас немного разные вкусы в додзинси, но в этой проблемной академии Красной Зимы она одна из немногих, на кого я могу положиться. Хи-хи..."
10007030-28 = "Что значит «странные книги»? Как грубо!"
10007030-29 = "Пока к ним относятся как к странным жанрам, но..."
10007030-30 = "Настанет день, когда произведения BL и GL признают великим искусством!"
10007030-31 = "К-Кхм."
10007030-32 = "В любом случае, ты тот самый Сенсей, которому доверяют и за которым следуют студенты Кивотоса?"
10007030-33 = ""
10007030-35 = ""
10007030-36 = ""
10007030-37 = "Хи-хи... Ты выглядишь именно так, как я и представляла."
10007030-38 = "Если я не сохраню запись о твоём теле и фигуре..."
10007030-39 = ""
10007030-41 = ""
10007030-42 = "О, не обращай на меня внимания и продолжай купаться."
10007030-43 = "Я просто рисую фигуру Сенсея."
10007030-44 = "[s] «От этих слов мне только ещё неуютнее...»"
10007030-45 = "Я всего лишь тебя рисую. Я даже не фотографирую. Что тут такого неприятного?"
10007030-46 = "Рисование — творческое искусство, которое просто выражает взгляд художника!#nТак что нечего стесняться."
10007030-47 = "[s] «Зачем ты здесь, Мэру?»"
10007030-48 = "Разумеется, я пришла за вдохновением для своего додзинси."
10007030-49 = "Уверена, мне не нужно тебе это объяснять, но скоро Comic Center. Или, как мы, авторы додзинси, его называем — Комисэн."
10007030-50 = "Это событие, где одновременно распространяют додзинси со всего Кивотоса, очень важно для Фронта освобождения знаний."
10007030-51 = "Мы читаем новые работы, оцениваем их и выставляем в библиотеке так, чтобы президент Черино не заметила."
10007030-52 = "Момидзи говорит, что достаточно читать работы других академий, но этого не должно быть достаточно!"
10007030-53 = "Вместо того чтобы пассивно потреблять, как буржуазия, мы, студенты академии Красной Зимы, сами должны стать инновацией и создавать новые произведения!"
10007030-54 = "И тут я совершенно случайно услышала о новом великолепном курорте горячих источников неподалёку."
10007030-55 = "Горячие источники — классическая зимняя сцена, которая постоянно встречается в аниме!"
10007030-56 = "Я сразу же примчалась сюда, подумав, что здесь будет полно отличного материала для Комисэна!"
10007030-57 = "Сенсей, ты видел здесь что-нибудь, что могло бы попасть в мой додзинси?"
10007030-58 = "Например, сцену, где старшая администраторша Геенны и вице-президент Боевой группы справедливости Тринити целуются в купальне, прилипнув друг к другу как слизни..."
10007030-59 = "[s] «...Они никогда бы такого не сделали.»"
10007030-60 = "Никогда не говори «никогда», Сенсей!"
10007030-61 = "К тому же мир творчества бездонен, поэтому даже что-то совсем маленькое может вдохновить на любую ситуацию."
10007030-62 = "«Два врага встречаются в неожиданном месте. Они смотрят друг на друга с презрением...»"
10007030-63 = "«Ах, но на самом деле они тайные любовники!» #n*тяжело дышит* *тяжело дышит*..."
10007030-64 = "[s5] «(Эта девушка... опасна...)»\n[s6] «(Надо что-то с ней делать...)»"
10007030-65 = ""
10007030-66 = ""
10007030-70 = ""
10007030-71 = "Что ты вообще творишь?!"
10007030-72 = "Ой, это Нодока."
10007030-73 = "Как управляющая смеет врываться к гостям в купальню! На этом курорте вообще проводят обучение гостеприимству?"
10007030-74 = "Это тебе обучение нужно! Почему ты постоянно пробираешься в чужие купальни и подглядываешь за другими студентами?"
10007030-75 = "Нам уже пожаловались и из большой общей купальни, и из открытой: люди чувствуют на себе подозрительный взгляд, пока моются!"
10007030-76 = "Что? Но я ещё даже не ходила в открытые купальни."
10007030-77 = "Разве это не ты тяжело дышала и смотрела, как купаются другие студенты, Нодока?!"
10007030-78 = "Э-Это была я...?"
10007030-79 = "Н-Но ты не только смотрела, как другие купаются — ты ещё и зарисовывала их, Мэру!"
10007030-80 = "Я всего лишь выполняла обязанности управляющей!"
10007030-81 = "Если так рассуждать, то я выполняла обязанности художника!"
10007030-82 = "Вообще-то злоупотреблять властью ради подглядывания куда хуже, Нодока!"
10007030-83 = "В любом случае! Если гости, приехавшие насладиться купальнями, уйдут из-за рисунков Мэру, огромные убытки понесём именно мы!"
10007030-84 = "Прости, но тебе придётся покинуть наш курорт горячих источников!"
10007030-85 = "Хмф! Здесь на кону и моя жизнь!"
10007030-86 = "Это шанс добыть отличный материал для моего додзинси, так что я не отступлю!"
10007030-87 = "Аргх! Если ты продолжишь так упираться..."
10007030-88 = "Мне придётся выставить тебя силой!"
10007030-89 = "[s] «Я просто хочу, чтобы вы обе ушли...»"
