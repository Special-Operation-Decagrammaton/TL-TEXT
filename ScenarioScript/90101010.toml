90101010-10 = "Realmente, não é uma quantia tão grande assim. #nSó que..."
90101010-11 = ""
90101010-14 = ""
90101010-15 = "Essa não é uma fala muito bonita pra quem não tem nem um tostão furado pra pagar, não acha?"
90101010-16 = "Hiiik...?!"
90101010-17 = "M-me desculpa! Eu... aquilo lá foi só da boca pra—"
90101010-18 = "Ah, não precisa se desculpar."
90101010-19 = "Pouco me importa se é seu desabafo sincero ou só bravata de covarde."
90101010-20 = "Acontece que... precisamos dar um \"exemplo\". #nNão importa o valor, todo mundo precisa ver o fim que leva quem tenta dar calote na gente."
90101010-21 = "D-dar o exemplo... não me diga que..."
90101010-22 = "Ah, então você já sabe? #nFacilita bastante o serviço."
