90101010-28 = "Aqueles bichinhos têm um apetite voraz, sabe? Não sossegam até se empanturrarem..."
90101010-29 = "Pois bem... quanto tempo será que você dura desta vez?"
90101010-30 = ""
90101010-33 = "H-haha... qual é, tá brincando comigo, né?! Fala que é brincadeira, por favor!"
90101010-34 = "O tal do \"caranguejo monstro\" que devora tudo que vê pela frente não existe de verdade dentro de um tambor, existe?!"
