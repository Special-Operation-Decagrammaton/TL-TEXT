[translation]
90101010-1 = "Эпизод 1;Обида не должна быть выпущена наружу"
90101010-2 = "Порт Канэсаки: причал 4"
90101010-4 = ""
90101010-5 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
90101010-6 = "Они что, совсем психи?"
90101010-7 = "Ага. Должны быть психами. Иначе никак. Это... шутка. Ни один нормальный человек не стал бы делать... такое."
90101010-8 = "Ладно, признаю, я немного просрочил пару платежей. Но у меня было столько дел! Я бы достал деньги!"
90101010-9 = "Но всё это из-за каких-то карманных денег? Да ладно! Имейте совесть!"
90101010-10 = "Карманных денег, говоришь...? Конечно, большинству людей эта сумма может показаться небольшой."
90101010-11 = ""
90101010-14 = ""
90101010-15 = "Но ведь именно ты из-за неё сейчас убегаешь. Так что... возможно, сумма всё-таки НЕМАЛЕНЬКАЯ."
90101010-16 = "И-и-и...?!"
90101010-17 = "П-Простите. Я хотел сказать—"
90101010-18 = "Не извиняйся."
90101010-19 = "Неважно, что ты имел в виду. Мы уже достаточно тебя выслушали."
90101010-20 = "Это МЫ должны отправить сообщение. И начнём с показательного примера одного ублюдка, который решил сбежать с НАШИМИ деньгами."
90101010-21 = "П-Под показательный пример вы ведь не имеете в виду...?"
90101010-22 = "А, так ты в курсе? Отлично. Не хотелось всё объяснять."
90101010-23 = ""
90101010-25 = ""
90101010-26 = ""
90101010-27 = "Видишь ли, ты ОЧЕНЬ близко познакомишься со своими новыми лучшими друзьями. Они пригласили тебя на ужин... на дне этой бочки."
90101010-28 = "И они просто умирают с голоду. И съедят. Каждый. Последний. Кусочек."
90101010-29 = "Интересно, сколько ты продержишься?"
90101010-30 = ""
90101010-33 = "П-Постойте. Нет, это не может быть правдой. Это невозможно!"
90101010-34 = "Неужели крабы-монстры, о которых все говорят, действительно существуют? Они же не должны уметь—"
90101010-35 = "Кто знает? Я не биолог."
90101010-36 = "Так давай выясним вместе. Прямо сейчас."
90101010-37 = ""
90101010-40 = ""
90101010-41 = "Пожалуйста, дайте ещё немного времени! Неделю! День! Я заплачу втрое... Нет, впятеро больше! Клянусь! Сделаю всё что угодно!"
90101010-42 = ""
90101010-45 = ""
90101010-46 = ""
90101010-47 = "ТОЛЬКО НЕ САЖАЙТЕ МЕНЯ В БОЧКУ!"
90101010-49 = "Следующий эпизод;Краб и рыбная сосиска"
