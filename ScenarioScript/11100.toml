[translation]
11100-2 = "Эпизод 10;В поисках зацепки"
11100-3 = "Жилой район Абидоса"
11100-5 = ""
11100-6 = "О, доброе утро, Сенсей."
11100-7 = "Куда я так рано направляюсь?"
11100-8 = "А. Сегодня нужно внести проценты по школьному долгу.#nДля этого много чего надо подготовить."
11100-9 = "Мне нужно заранее попасть в школу, всё оформить... и ещё продумать, что будем делать дальше."
11100-10 = "Ах, точно. Я ещё собрала информацию о студентах, с которыми мы столкнулись вчера. Буду признательна, если позже посмотрите."
11100-11 = "Эти девушки действительно студенты Академии Геенна, и..."
11100-12 = ""
11100-13 = "Ого! Сенсей! Приветик!"
11100-14 = ""
11100-15 = "Какого...?!"
11100-16 = "Как дела? Вот совпадение — встретиться с вами с самого утра."
11100-17 = "*прыгает* *обнимает* Хм? Я ведь не слишком тяжёлая? Уверена, вы всё ещё можете дышать, Сенсей, так что придётся потерпеть."
11100-18 = ""
11100-19 = ""
11100-20 = "Ч-что ты делаешь?! Немедленно отпусти Сенсея!"
11100-21 = "Эй, хватит тянуть!"
11100-22 = "Ну надо же. Да это же маленькая мисс Очкарик из Абидоса. Ты очень любишь совать нос в чужие дела, да?"
11100-23 = "Вчера в рамэн-баре ты была куда вежливее. Не помнишь?"
11100-24 = "Это было до того, как вы напали на нашу школу! Что ты задумала? Почему вдруг ведёшь себя так дружелюбно?"
11100-25 = "И я не «мисс Очкарик»! Меня зовут Аяне!"
11100-26 = "Что? Мы же ничего лично против вас не имеем."
11100-27 = "Мы уже говорили: это просто работа. Когда не дерёмся, можем нормально общаться."
11100-28 = "Т-ты серьёзно предлагаешь мне «не принимать близко к сердцу» то, что вы сделали?!"
11100-29 = "А почему нет? Шале ведь работает не только на вас, детей Абидоса.#nВерно, Сенсей?"
11100-30 = "[s] «Может, просто будем ладить друг с другом?»"
11100-31 = "Ха-ха! Хорошая шутка. Ещё чего. У нас бизнес. Ару многого от нас ждёт."
11100-32 = "Ну да ладно. Заглядывайте к нам в офис когда захотите, Сенсей. Уверена, Ару и остальные будут очень рады."
11100-33 = "Ну, пока-пока! До встречи, мисс Аяне."
11100-34 = "Никакой «до встречи»! Ещё раз увижу тебя в нашем районе — стреляю без предупреждения!"
11100-35 = "Как скажешь."
11100-37 = "*вздыхает*"
11100-38 = "Вот же наглая девчонка!"
11100-40 = "Платёж по вашему кредиту в размере 7 883 250 иен, включая плавающую ставку и дополнительные проценты, подтверждён."
11100-41 = "Оплата наличными. Нарушений не выявлено."
11100-42 = "Благодарим, что снова пользуетесь услугами «Кайзер Кредит».#nДо встречи в следующем месяце."
11100-43 = ""
11100-44 = "*вр-р-рум*"
11100-46 = "..."
11100-47 = "..."
11100-48 = "Ещё один месяц как-то пережили."
11100-49 = "Сколько нам ещё осталось?"
11100-50 = "По графику выплат — 309 лет. При нынешнем темпе..."
11100-51 = "Не говори! Если услышу подробности, меня просто разорвёт!"
11100-52 = "Признайте уже. Мы никогда не выплатим это при жизни!#nЗачем вообще считать?!"
11100-53 = "..."
11100-54 = "Вам никогда не казалось странным, что они принимают только наличные? Зачем им вообще возиться с бронированными грузовиками?"
11100-55 = "..."
11100-56 = ""
11100-57 = "Надеюсь, ты не планируешь их ограбить, Широко."
11100-58 = "Не переживай. Не планирую."
11100-59 = "Это не значит, что можно даже мечтать об этом!"
11100-60 = "Ладно..."
11100-61 = "Давайте, народ. Мы можем только сосредоточиться на том, что прямо перед нами."
11100-62 = "Идём внутрь."
11100-64 = "Ну что, начнём? Нам нужно обсудить два вопроса."
11100-65 = "Первый — вчерашнее нападение."
11100-67 = "Виновницы состоят в клубе под названием «Решалы 68»."
11100-68 = "Это печально известная группа студентов-хулиганок из Академии Геенна."
11100-69 = "Они называют себя агентством решал, но по сути просто выполняют любые поручения за деньги."
11100-70 = "Президент клуба — девушка по имени Ару."
11100-71 = "Именно она называла себя боссом, когда вы с ней столкнулись."
11100-72 = ""
11100-74 = ""
11100-75 = "У Ару трое подчинённых: начальник штаба, начальник отдела и рядовой сотрудник."
11100-76 = ""
11100-78 = "Они реально подходят к делу по-взрослому, да?"
11100-79 = "Она уже в таком возрасте руководитель? Как круто! ☆"
11100-80 = "Повторюсь: титул она присвоила себе сама. Думаю, сейчас они действуют откуда-то неподалёку от Абидоса — особенно учитывая, что одну из них мы встретили сегодня утром."
11100-81 = "То, чем они занимаются, официально признано Академией Геенна?"
11100-82 = "Сомневаюсь. Наверняка взяли этот контракт просто потому, что захотелось."
11100-83 = "Значит, они нарушают школьные правила... Странно. Мне они не показались настолько уж плохими или злобными."
11100-84 = "Как раз наоборот. Они известны как проблемные студенты и в самой Геенне тоже постоянно создают головную боль."
11100-85 = "А теперь они нацелились на нашу школу! К этому нужно отнестись серьёзно!"
11100-86 = "Может, стоит поймать их и допросить..."
11100-87 = "На этот раз я согласна. Надо действовать первыми и пресечь проблему в зародыше."
11100-88 = "Ну и ну, Аяне. Ты будто воспринимаешь это лично. Хочешь нам что-то рассказать?"
11100-89 = "Следующий вопрос — кто стоял за нападением Банды шлемов на Сэрику!"
11100-90 = "Проанализировав оружие, которое мы забрали после последнего боя... я выяснила, что эта модель больше не продаётся."
11100-91 = "То есть её сняли с производства?"
11100-92 = "Тогда откуда она у них?"
11100-93 = "Такое оружие можно достать только на Чёрном рынке Кивотоса."
11100-94 = "Разве это место не считается очень опасным?"
11100-95 = "Да. Бросившие школу, выгоревшие студенты в академическом отпуске, двоечницы... Чёрный рынок — настоящий котёл из разного отребья. Не говоря уже о несанкционированных клубах, которые занимаются там незаконными делами."
11100-96 = "Вроде Решал 68?"
11100-97 = "Именно. По слухам, Решалы 68 уже были замешаны в нескольких происшествиях на Чёрном рынке."
11100-98 = "Вот и связь!"
11100-99 = "Согласна. Нужно искать зацепку там."
11100-100 = "Следующий шаг очевиден. Отправимся на Чёрный рынок и осмотримся."
11100-101 = "Кто знает, какие улики там удастся найти."
11100-103 = "Следующий Эпизод;На Чёрный рынок! Часть 1"
