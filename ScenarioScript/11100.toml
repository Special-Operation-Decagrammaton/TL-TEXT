[translation]
11100-2 = "Episódio 10;Em Busca de Pistas"
11100-3 = "Abydos — Área Residencial"
11100-6 = "Ah, Sensei. Bom dia."
11100-7 = "Hein? Onde estou indo tão cedo assim?"
11100-8 = "Bem, hoje é o dia de pagar os juros da dívida... então tem várias coisas para preparar."
11100-9 = "Preciso chegar mais cedo na escola para organizar o pagamento e também revisar nossos planos futuros..."
11100-10 = "Ah, por falar nisso, encontrei informações sobre o pessoal de ontem.#nPoderia conferir os detalhes na escola mais tarde?"
11100-11 = "Eram alunas da Academia Gehenna, mas—"
11100-13 = "Ah, é o Sensei! Bom diaaa!"
11100-15 = "Q-Quê?!"
11100-16 = "Tcharam! Oi, oiii! Que coincidência te encontrar por aqui!"
11100-17 = "(Esfrega, esfrega) Ahaha! Hum? Estou pesada? Sufocando? Aguenta só um pouquinho, Sensei."
11100-20 = "O-O que você está fazendo?! Afaste-se, por favor!"
11100-21 = "Opa, não precisa puxar não!"
11100-22 = "...Olha só quem é! Não é a garota de óculos de Abydos?"
11100-23 = "Bom diaaa! A gente se viu ontem na casa de lámen, né?"
11100-24 = "E também nos vimos depois, quando vocês atacaram a nossa escola! O que significa isso?!#nChegar assim cheia de intimidade do nada..."
11100-25 = "E não é \"garota de óculos\", meu nome é Ayane!"
11100-26 = "Ué? Mas a gente não odeia vocês, garota de óculos."
11100-27 = "É só um trabalho que o nosso clube aceitou, sabe? Fora do expediente a gente pode se dar bem, não é?"
11100-28 = "A-Agora você quer separar o profissional do pessoal?!"
11100-29 = "Qual o problema? Além disso, o Sensei da \"Schale\" não é propriedade exclusiva de vocês, né? Não é mesmo, Sensei?"
11100-30 = "[s]\"Eu ficaria feliz se vocês parassem de brigar e se dessem bem.\""
11100-31 = "Ahaha, acho que isso não vai rolar, não. Afinal, é trabalho. A Aru-chan anda super empolgada, então se a gente fizer corpo mole, ela vai ficar brava."
11100-32 = "Mas bem, aparece lá na nossa Faz-Tudo um dia desses para fazer uma visita, Sensei. A Aru-chan e o pessoal com certeza vão adorar."
11100-33 = "Então, tchauzinho! Até a próxima, Ayane-chan."
11100-34 = "Não vai ter próxima vez nenhuma!! Se nos encontrarmos de novo, eu atiro na hora!"
11100-35 = "Tá boooom."
11100-37 = "Arf... arf..."
11100-38 = "Mas quem aquela garota pensa que é...!"
11100-40 = "...Desculpem a espera. Aplicando as taxas de juros variáveis e encargos diversos, os juros ficam em 7.883.250 ienes."
11100-41 = "Confirmamos o pagamento integral em dinheiro vivo. Isso é tudo."
11100-42 = "Agradecemos mais uma vez por fazer negócios com a Kaiser Loans. Contamos com vocês no mês que vem."
11100-44 = "(Vrummm...)"
11100-46 = "..."
11100-47 = "..."
11100-48 = "Ah, conseguimos sobreviver a mais um mês, né..."
11100-49 = "...Quanto falta para quitar tudo?"
11100-50 = "Como o parcelamento é em 309 anos... somando o que já pagamos até agora..."
11100-51 = "Nem precisa falar, ouvir o número exato só vai me deixar ainda mais estressada..."
11100-52 = "A gente nunca vai conseguir pagar isso até morrer mesmo! Nem adianta fazer as contas!!"
11100-53 = "..."
11100-54 = "Por falar nisso, por que será que a Kaiser Loans só aceita pagamento em dinheiro vivo?#nDando-se ao trabalho de mandar até um carro-forte..."
11100-55 = "..."
11100-57 = "Shiroko-senpai, não pode assaltar aquele carro, viu?"
11100-58 = "Nn, eu sei."
11100-59 = "E nem pensar em planejar!"
11100-60 = "Nn..."
11100-61 = "Bom, por enquanto o que precisamos resolver primeiro é o problema bem diante dos nossos olhos, né?"
11100-62 = "Enfim, vamos voltar para a sala de aula."
11100-64 = "Como já estamos todos aqui, vou começar. Primeiro, gostaria de falar sobre dois assuntos."
11100-65 = "Em primeiro lugar, sobre o ataque de ontem à noite."
11100-67 = "Quem nos atacou foi um clube chamado \"Faz-Tudo 68\"."
11100-68 = "Em Gehenna, elas são conhecidas como alunas bastante perigosas e de péssima conduta."
11100-69 = "Uma \"faz-tudo\" é uma prestadora de serviços que aceita qualquer trabalho que pedirem..."
11100-70 = "O nome da líder do clube é Aru-san."
11100-71 = "Parece que ela mesma se intitula \"Presidente\"."
11100-75 = "Abaixo dela há três integrantes,#ncom os cargos de Diretora, Gerente e Funcionária Comum, respectivamente."
11100-78 = "Nossa, que profissionalismo, hein..."
11100-79 = "Então ela é presidente mesmo☆ Que incrível!"
11100-80 = "Não, é apenas \"autoproclamada\"... E, pelo visto, elas estão escondidas em alguma área de Abydos agora. Até encontrei uma delas hoje de manhã..."
11100-81 = "A Academia Gehenna permite que alunas abram empresas?"
11100-82 = "Acredito que não... Provavelmente abriram por conta própria mesmo."
11100-83 = "Nossa... então é violação das regras da escola, né? Mas elas nem pareciam garotas más..."
11100-84 = "Na verdade, parece que elas já aprontaram de tudo e são tratadas como alunas problemáticas até em Gehenna."
11100-85 = "Uma organização tão perigosa está de olho na nossa escola! Precisamos redobrar a atenção!"
11100-86 = "Da próxima vez, que tal a gente pegar uma delas e fazer um interrogatório?"
11100-87 = "Sim, se tivermos a oportunidade, com certeza..."
11100-88 = "Aliás, Ayane-chan, aconteceu alguma coisa? Estou sentindo um rancor fora do comum aí..."
11100-89 = "...Não, nada em especial. Prosseguindo, sobre quem está por trás da Gangue dos Capacetes que atacou a Serika-chan!"
11100-90 = "Após analisar os fragmentos da arma estratégica recolhidos na batalha do outro dia...#ndescobrimos que se trata de um modelo que não é mais comercializado hoje em dia."
11100-91 = "Quer dizer que não fabricam mais?"
11100-92 = "Como será que conseguiram uma dessas?"
11100-93 = "Em Kivotos, só existe um jeito de conseguir um modelo fora de linha... no \"Mercado Negro\"."
11100-94 = "O Mercado Negro... Esse lugar não é super perigoso?"
11100-95 = "Exatamente. Ouvi dizer que lá diversas alunas que abandonaram, trancaram ou foram expulsas da escola formam grupos, e também há muitos clubes não autorizados operando sem permissão do Conselho Estudantil Geral."
11100-96 = "Tipo a Faz-Tudo 68?"
11100-97 = "Sim. Além disso, ouvi dizer que a Faz-Tudo 68 também já causou#nvárias confusões no Mercado Negro."
11100-98 = "Então esse é o ponto-chave, né!"
11100-99 = "Sim. Investigar a ligação entre os dois acontecimentos pode ser um bom caminho."
11100-100 = "Beleza, então está decidido. Vamos investigar o Mercado Negro."
11100-101 = "Vai que a gente encontra uma pista inesperada, né?"
11100-103 = "Próximo;Rumo ao Mercado Negro (1)"
