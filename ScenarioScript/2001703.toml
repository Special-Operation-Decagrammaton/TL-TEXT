[translation]
2001703-1 = "Девушка всё ещё не сдаётся"
2001703-2 = "Заброшенное здание в зоне строительства"
2001703-3 = "Ик?"
2001703-4 = "Сенсей?! Что вы здесь делаете?"
2001703-5 = "Мне суждено быть у вас на ладони, куда бы я ни убежала?"
2001703-6 = "Взрослые страшные... Очень страшные..."
2001703-7 = "[s] «Я просто пришёл узнать хорошие новости.»"
2001703-8 = "О, хи-хи. В этой жизни, полной страданий, нужно отмечать маленькие победы."
2001703-9 = "Если бы мой телефон умел отправлять фотографии, было бы проще... но хотя бы вы теперь здесь."
2001703-10 = "Я... хотела показать вам, что сегодня раздобыла... Хи-хи-хи."
2001703-11 = "[s] «Мне стоит беспокоиться?»"
2001703-12 = "Конечно нет! Смотрите!"
2001703-13 = ""
2001703-15 = ""
2001703-16 = "Хиёри достаёт связку макулатуры."
2001703-17 = "[s] «О... Очень симпатичная куча мусора.»"
2001703-18 = "Вы сказали м-мусора?! Может, я и нашла это в мусорном баке, но это неважно! Это коллекция прошлогодних выпусков уважаемого журнала Ren-ro!"
2001703-19 = "Они невероятно редкие, Сенсей! Можно обойти крупнейшие книжные магазины и не найти ни одного."
2001703-20 = "А... бездомные студенты без академии вроде нас не могут их заказать или читать в интернете. Я думала, даже подержать один выпуск такого журнала — несбыточная мечта."
2001703-21 = "Представляете, что я почувствовала, когда нашла в мусорке целых восемь выпусков!"
2001703-22 = "[s1] «О... Поздравляю.»\n[s2] «Значит, тебе нравятся такие журналы?»"
2001703-23 = "Хи-хи-хи... Там интересные тематические статьи, а фотографии моды — моя любимая часть. Они облегчают вечное бремя существования."
2001703-24 = "Хи-хи-хи... Там интересные тематические статьи, а фотографии моды — моя любимая часть. Они облегчают вечное бремя существования."
2001703-25 = "Кроме Ren-ro, однажды мне даже удалось собрать больше двадцати выпусков BiBi."
2001703-26 = "...Но бумаги для костра у нас не было, поэтому они все отправились в огонь."
2001703-27 = "Я любила их всем сердцем... но не замёрзнуть насмерть тоже люблю..."
2001703-28 = "Я до сих пор думаю о статьях, которые не успела прочитать. «Смертельное очарование! Обзор 20 новых купальников!» и «Подробный репортаж! Топ-5 обязательных вещей для модников D.U.»..."
2001703-29 = "Они все сгорели... Пепел к пеплу, прах к праху... Страдания жизни неудивительны... У меня столько сожалений... столько мыслей, которые не дают уснуть... Можно ли было этого избежать?"
2001703-30 = "[s] «У-Успокойся, Хиёри!»"
2001703-31 = "..."
2001703-32 = "Простите, я снова увлеклась."
2001703-33 = "В общем, я просто хотела показать вам свои счастливые находки, Сенсей."
2001703-34 = "Я не знала, кому ещё позвонить... Больше никому до меня нет дела..."
2001703-35 = "О, подождите! Ещё кое-что!"
2001703-36 = ""
2001703-38 = ""
2001703-39 = "Хиёри достала ржавый стальной ящик."
2001703-40 = "[s] «Это... ржавая аптечка?»"
2001703-41 = "Хе... хе. Верно! Может, выглядит старой, но лекарства внутри не тронуты. Средство от желудка, лекарство от простуды, свечи от температуры, медицинский спирт..."
2001703-42 = "Медицинские принадлежности очень ценны. Их трудно найти, и они далеко за пределами нашего бюджета."
2001703-43 = "Очень важно поддерживать здоровье отряда, знаете ли. Это средство для желудка пригодилось бы, когда я съела то гнилое яблоко... Я болела три дня."
2001703-44 = "[s3] «Это немного тревожно...»\n[s4] «Ты съела гнилое яблоко?»"
2001703-45 = "Я была очень голодна... У меня не было выбора."
2001703-46 = "Я была очень голодна... У меня не было выбора."
2001703-47 = "Но теперь мои страдания хотя бы уменьшатся! Можно просто есть испорченную еду, а потом принимать лекарство от желудка."
2001703-48 = "[s] «(Это очень плохо! Надо что-то сделать, пока она не умерла!)»"
2001703-49 = "А ещё эти свечи..."
2001703-50 = "Сенсей? Что случилось?"
2001703-51 = "[s] «Хиёри, тебе нужно пойти со мной. Прямо сейчас.»"
2001703-52 = "Почему сейчас? Что? К-Куда?!"
2001703-55 = "Жидкое лекарство от простуды, средство от желудка, дезинфицирующее средство, жаропонижающее..."
2001703-56 = "Оплата прошла. Спасибо, уважаемый покупатель!"
2001703-57 = "..."
2001703-58 = "[s] «Даже запечатанные лекарства имеют срок годности.»"
2001703-59 = "Я не знала, что лекарства можно вот так просто купить."
2001703-60 = "Вы снова мне помогли. Я неудачница?! Для меня нет надежды? Без чужой помощи я бы зачахла и исчезла в бесполезном ничто!"
2001703-61 = ""
2001703-63 = ""
2001703-64 = "*плачет* Я попалась в сети взрослого?"
2001703-65 = "Н-Н-Но ещё я хочу вот это, пожалуйста!"
2001703-66 = "[s] «...И это тоже.»"
2001703-67 = ""
2001703-69 = ""
2001703-70 = "Последние выпуски Ron-ro и BiBi... Держи."
2001703-71 = "УАААА!! Я не могу перестать вести себя ужасно! Но спасибо! Даже если я неудачница!"
2001703-73 = "Хиёри продолжала бессвязно рыдать, пока мы выходили из магазина."
