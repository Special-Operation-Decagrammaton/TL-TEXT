[translation]
2003206-1 = "Холодная ванна"
2003206-2 = "В рамках особой операции мне поручили миссию в Ледяном море."
2003206-3 = "Я вспомнил, что у Эйми там тоже была миссия, и решил проверить место, о котором она говорила."
2003206-6 = "И что же я там обнаружил...?"
2003206-7 = "А, Сенсей. Сюда."
2003206-8 = "Эйми прорубила отверстие во льду и погрузилась в ледяную воду."
2003206-11 = "[ns] «Ты что творишь?! Ты же замёрзнешь насмерть!»"
2003206-12 = "― [log=에이미 수영복]Хм?[/log][wa:260]"
2003206-14 = "― [log=에이미 수영복]Мне не холодно. Всё в порядке.[/log][wa:870]"
2003206-17 = "― [log=에이미 수영복]Наоборот,[/log][wa:1040]"
2003206-19 = "― [log=에이미 수영복]эта температура просто идеальна.[/log][wa:120]"
2003206-22 = "― [log=에이미 수영복]Так приятно...[/log][wa:1160]"
2003206-24 = "― [log=에이미 수영복]Хотите ко мне, Сенсей?[/log]"
2003206-27 = "[ns] «Я, пожалуй, откажусь...»"
2003206-28 = "― [log=에이미 수영복]Эх. Ну ладно.[/log][wa:1880]"
2003206-31 = "― [log=에이미 수영복]Я выйду через минутку.[/log][wa:1060]"
2003206-33 = "― [log=에이미 수영복]Так что немного подождите, Сенсей.[/log][wa:1140]"
2003206-35 = ""
2003206-36 = "А-а-а... это было прекрасно."
2003206-37 = "Хочу ещё... Может, когда вернусь домой, устроить ледяную ванну?"
2003206-38 = "Вот это был бы рай."
2003206-39 = "[s] «Мне кажется, даже ты простудишься, если каждый день принимать ледяные ванны...»"
2003206-40 = "Всё в порядке, Сенсей. Я никогда не простужалась просто из-за погоды."
2003206-41 = "Смотрите... даже при такой температуре я совершенно здорова..."
2003206-42 = "А-а-а..."
2003206-43 = "А-А-А! Что...? Почему?"
2003206-44 = "А?"
2003206-45 = ""
2003206-48 = "[ns] «Никогда не простужалась, говоришь?!»"
2003206-49 = "Нет, никогда... Это было просто чихание."
2003206-50 = "[s] «Нет уж! Это простуда! Эйми простудилась!»"
2003206-51 = "Это был просто чих!"
2003206-52 = "[s] «Даже для тебя эта погода слишком суровая!»"
2003206-53 = "Нет! Она прекрасная! У меня нет простуды!"
2003206-55 = "Мы спорили всю дорогу до базового лагеря, и никто из нас не хотел уступать."
2003206-56 = ""
2003206-59 = "Эйми, которая обычно терпеть не может горячее, в тот день выпила весь наш горячий чай."
