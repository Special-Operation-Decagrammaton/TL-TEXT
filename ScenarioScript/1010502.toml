[translation]
1010502-1 = "Где твой бэнто?"
1010502-2 = "Чтобы подбодрить Мари во время репетиции, я направился в тренировочную комнату."
1010502-3 = ""
1010502-8 = "А...? Там кто-то есть...?"
1010502-9 = "...Сенсей?"
1010502-10 = "...Сенсей, что вы здесь делаете?"
1010502-11 = "Что это было?"
1010502-12 = "Вы просто пришли меня подбодрить? Ой, нет, не стоило..."
1010502-13 = "А, это из-за сообщения?"
1010502-14 = "Простите. Такое чувство, будто я зря вас сюда притащила."
1010502-15 = "Нет? Фух, какое облегчение."
1010502-16 = "...Остальные? А-а, сейчас здесь только я."
1010502-17 = "Они ещё недавно репетировали вместе со мной, но у обеих есть и другие дела."
1010502-18 = "А у меня сейчас ничего другого нет, так что я решила ещё немного потренироваться сама."
1010502-19 = ""
1010502-21 = ""
1010502-22 = "А, всё идёт хорошо. И песня, и танец продвигаются довольно гладко."
1010502-23 = "Я просто хочу стать ещё лучше, поэтому продолжаю тренироваться при любой возможности."
1010502-24 = "Кстати, немного не по теме: вы уже ели, Сенсей? Скоро обед."
1010502-25 = "Если хотите, у меня есть бэнто, которым мы можем поделиться..."
1010502-26 = "Хм?"
1010502-27 = "Еды немного, поэтому вы хотите, чтобы я съела всё сама?"
1010502-28 = "Ну, её и правда немного, это верно..."
1010502-29 = "[s1] «На голодный желудок не потренируешься.»\n[s2] «Я могу взять себе что-нибудь другое.»"
1010502-32 = "Эм... Ну, пожалуй, вы правы."
1010502-33 = "Но всё равно будет невежливо, если я стану есть перед вами..."
1010502-34 = "Я могу съесть это потом, ну... позже."
1010502-35 = "Хм?"
1010502-36 = "В-Вы тогда уйдёте?! П-Почему...?!"
1010502-37 = "[s3] «Хочу дать тебе спокойно поесть.»\n[s4] «Я не хотел добавлять тебе поводов для беспокойства.»"
1010502-40 = "Н-Ну...! У-Ух..."
1010502-41 = "Отлично, теперь мне ПРИДЁТСЯ есть прямо перед вами. Вы вредный."
1010502-42 = "Но ладно, хорошо. Просто поверю, что вы поедите позже."
1010502-43 = ""
1010502-45 = ""
1010502-46 = "Т-Тогда я... пожалуй, сейчас поем."
1010502-47 = ""
1010502-49 = ""
1010502-50 = ""
1010502-51 = "[ns5] Разложить ближайшие принадлежности.\n[ns6] Поправить мебель."
1010502-54 = "Хм? Сенсей, зачем вы это делаете?"
1010502-55 = "Чтобы потом было удобнее тренироваться? Н-Нет, я не об этом. Почему именно ВЫ это делаете?"
1010502-56 = "Вообще-то это моя работа."
1010502-57 = "Хм?"
1010502-58 = "Вы пришли поддержать меня, поэтому мне стоит позволить вам хотя бы это...?"
1010502-59 = "И вы не хотите смущать меня, наблюдая, как я ем? Н-Ну..."
1010502-60 = "Д-Думаю, это и правда может быть неловко..."
1010502-61 = "Но всё это кажется таким односторонним. Я даже не знаю, как вас отблагодарить."
1010502-62 = "[s7] «Просто расслабься.»\n[s8] «Давай пока сосредоточимся на репетиции.»"
1010502-65 = "Даже если вы так говорите..."
1010502-66 = "М-м..."
1010502-67 = ""
1010502-69 = ""
1010502-70 = ""
1010502-71 = "[ns9] «...Мари?»\n[ns10] «Ты зачем встаёшь?»"
1010502-74 = ""
1010502-75 = ""
1010502-76 = "...Сенсей."
1010502-77 = "Если вы могли бы всего минутку потакать моему упрямству..."
1010502-78 = "Считайте это..."
1010502-79 = "...самым минимумом, который нужен мне, чтобы успокоиться и сосредоточиться на репетиции."
1010502-80 = "...Вот. Вполне разумно."
1010502-81 = "Так что, пожалуйста, вот, возьмите..."
1010502-82 = ""
1010502-84 = ""
1010502-85 = "[ns11] «Твой тамагояки?»\n[ns12] «Разве ты не собиралась съесть его сама?»"
1010502-88 = "...Нет. Он не мой."
1010502-89 = "Он для вас, Сенсей. Всего один кусочек. Ничего страшного."
1010502-90 = "Если вы продолжите помогать мне, ничего не поев, я только об этом и буду думать."
1010502-91 = "Так что если вы и правда хотите, чтобы мне было спокойно во время репетиции..."
1010502-92 = "...просто откусите кусочек, и мне станет легче."
1010502-93 = "...Нет, правда, я настаиваю. Я же сказала — упрямство."
1010502-94 = "Хорошо. Тогда, Сенсей..."
1010502-95 = "..."
1010502-97 = "...Скажите «а-а»."
1010502-98 = "А-а-а..."
