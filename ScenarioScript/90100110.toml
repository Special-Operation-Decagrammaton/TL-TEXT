[translation]
90100110-1 = "Эпизод 11;Слухи и непостижимое"
90100110-2 = "Исполнительный офис Генерального ученического совета"
90100110-3 = ""
90100110-4 = "Хорошие новости, командир отряда Юкино."
90100110-5 = "Пострадавшие от белого пугала, также известного как кунэ-кунэ, начали приходить в себя."
90100110-6 = "Если не считать жалоб на лёгкую боль в мышцах, большинство чувствует себя хорошо."
90100110-7 = "В больницах говорят, что не знают, почему состояние пациентов внезапно улучшилось, но..."
90100110-8 = "Полагаю, причина в том, что ваш отряд FOX успешно устранил аномалии, верно?"
90100110-9 = ""
90100110-11 = ""
90100110-12 = ""
90100110-13 = "Президент, вы полностью доверяете всему, что написано в нашем отчёте?"
90100110-14 = "Разве его писали не вы, командир отряда Юкино? К тому же Сенсей из Шале подтвердил сказанное..."
90100110-15 = "...Так что причин не доверять нет."
90100110-16 = "Как я указала в отчёте, во время миссии мы, честно говоря, сами не были уверены, с чем сражаемся."
90100110-17 = "Наши враги Лора были загадками без ясной причины появления и без очевидных слабостей."
90100110-18 = "Мы просто пробовали всё, что могли. К счастью, случайно наткнулись на рабочее решение."
90100110-19 = "Но эта попытка найти решение спасла бесчисленное количество людей."
90100110-20 = ""
90100110-22 = ""
90100110-23 = "Это... неважно."
90100110-24 = ""
90100110-26 = ""
90100110-27 = "Нет... Простите. Я не хотела сказать, что мне безразличны люди."
90100110-28 = "В Кивотосе происходит много загадочных вещей. Но... столько пострадавших..."
90100110-29 = "Люди вполне справедливо захотят ответов. Захотят знать, почему они заболели и что стало причиной. Начнут искать виноватых и даже..."
90100110-30 = ""
90100110-32 = ""
90100110-33 = "...обратят внимание на вас."
90100110-34 = ""
90100110-36 = ""
90100110-37 = ""
90100110-38 = "Юкино."
90100110-39 = "Можешь догадаться, о чём я сейчас думаю?"
90100110-40 = "Вы... считаете, что мои опасения беспочвенны?"
90100110-41 = "Нет! Неправильно."
90100110-42 = "Прямо перед тем, как ты вошла в мой кабинет, Оки принесла какие-то снеки, которых я раньше не видела."
90100110-43 = "У этих сладкий и почему-то ностальгический цитрусовый аромат. На упаковке не написан состав. Я решила попробовать их с чаем."
90100110-44 = "На самом деле, пока мы разговаривали, я думала именно об их составе."
90100110-45 = "Должна извиниться за свою рассеянность."
90100110-46 = "Н-Нет. Всё в порядке."
90100110-47 = "Я вообще не заметила... Я тоже иногда ухожу в свои мысли."
90100110-48 = "Да. Совершенно нормально, когда какая-нибудь мелочь неожиданно заполняет все мысли."
90100110-49 = "Дети легко признаются в таких вещах, но... среди людей вроде нас это редкость, правда?"
90100110-50 = "В конце концов, никто не хочет показаться грубым или странным."
90100110-51 = "В итоге мало что получишь, если так открыто демонстрировать свои чувства."
90100110-52 = "Люди склонны скрывать эмоции, чтобы сохранить отношения. В конечном счёте именно поэтому одному человеку так трудно понять другого. Конфликты неизбежны."
90100110-54 = "...Интересно, не рождаются ли эти аномалии Кивотоса из самой этой фундаментальной преграды в общении."
90100110-55 = "А что, если существует способ говорить прямо с сердцами людей...? Возможно, чем-то, что находится за пределами слов и текста?"
90100110-57 = ""
90100110-58 = "Не понимаю."
90100110-59 = "Вы хотите сказать, что кунэ-кунэ пытался передать сообщение?"
90100110-60 = "Фуфу. Ты ведь знаешь, что да, командир отряда Юкино."
90100110-62 = "Ты сама написала в отчёте: в жаркие дни следует избегать прогулок на улице."
90100110-63 = "Одним своим существованием этот кунэ-кунэ служил активным предупреждением тем, кто выходит наружу в палящий летний день."
90100110-64 = ""
90100110-65 = "Но люди пострадали. Вы хотите сказать, что это сообщение того стоило?"
90100110-66 = "В некотором смысле... да."
90100110-67 = ""
90100110-69 = ""
90100110-70 = "Командир отряда Юкино, у меня ещё остались те снеки, о которых я говорила. Хотите попробовать?"
90100110-71 = "Если мы вместе попробуем их и поразмышляем над составом..."
90100110-72 = ""
90100110-74 = ""
90100110-75 = ""
90100110-76 = "...Возможно, мы сможем лучше понять друг друга."
90100110-78 = ""
90100110-79 = "Как же жарко..."
90100110-80 = ""
90100110-82 = ""
90100110-83 = ""
90100110-84 = "Эй, Нико. Почему мы ждём снаружи?"
90100110-85 = "Не можем подождать в холле, пока Юкино не закончит встречу?"
90100110-86 = "А, это..."
90100110-87 = "Хм. Смелая ты, Куруми."
90100110-88 = "Мы сражались с немалым числом членов Студсовета. Ты правда готова рискнуть и встретиться с ними взглядом?"
90100110-89 = "Уф... Ладно, поняла."
90100110-90 = "К тому же мы на условном освобождении. Лучше не привлекать внимания."
90100110-91 = "Просто потерпи. Ты достаточно крепкая."
90100110-92 = "Но серьёзно, почему мы стоим посреди площади? Прямо под солнцем!"
90100110-93 = "Мы хотя бы не можем зайти в кафе или купить что-нибудь попить в автомате?"
90100110-94 = "Нет. Кредитка у Юкино."
90100110-95 = "Почему? Нико, я думала, расходами занимаешься ты!"
90100110-96 = "На миссию нам выделили суточные... Она сказала, что должна взять карту на разбор операции. Ты же знаешь, она всё делает строго по правилам."
90100110-97 = "А, ладно. Как угодно."
90100110-98 = ""
90100110-100 = ""
90100110-101 = "Как же жарко... Хочу обратно в Шале. Просто пустите меня под землю. Мне всё равно, хоть в тайное логово."
90100110-102 = "Вот как? Думаешь, разумно на всю улицу объявлять, что ты живёшь в Шале?"
90100110-103 = "Да ладно. Тут всё равно никого нет. Какая разница?"
90100110-104 = "Хм? А вы разве не...?"
90100110-105 = "Слушай! Я говорила про Шале, но не говорила, что живу там! Ну... кто вообще стал бы там жить? Это же... административное здание!"
90100110-106 = "...О чём ты?"
90100110-107 = ""
90100110-109 = ""
90100110-111 = ""
90100110-112 = "Давно не виделись, Hyperade."
90100110-113 = "О... Да."
90100110-114 = "Ага. Привет всем. Я Эрика... из академии Геенна. Рада снова вас встретить."
90100110-115 = "О-О. Конечно. Какое совпадение."
90100110-116 = "Тебя заставили продавать напитки прямо здесь? Наверное, от академии Гиацинт сюда далековато."
90100110-117 = "Д-Да! А это мои коллеги. Они тоже... продают напитки."
90100110-118 = "Так, насчёт того, что случилось раньше..."
90100110-119 = ""
90100110-121 = ""
90100110-122 = "...Прости. Я тебе соврала. Дала фальшивый аккаунт MomoTalk."
90100110-123 = "I know. I checked on MomoTalk and the ID wasn't there."
90100110-124 = "А потом узнала, что Hyperade вообще не существует. Кирара была в шоке. Решила, что я разговаривала с призраком на электролитах."
90100110-125 = "Но, похоже, ты жива. Так что я рада."
90100110-126 = ""
90100110-128 = ""
90100110-129 = "Простите..."
90100110-130 = "Да ладно. Извиняться не за что."
90100110-131 = "У всех есть свои секреты. Просто я случайно встретила тебя в день, когда ты что-то скрывала."
90100110-132 = "...Ты не злишься?"
90100110-133 = "Не особо. Мне от этого ни холодно ни жарко. Если честно, знакомство с тобой было весёлым."
90100110-134 = "Я всё думала... Кто была эта девушка? И Почему она раздаёт несуществующие напитки? И Что за секретный рецепт?"
90100110-135 = "Пару недель строила догадки. Было забавно."
90100110-136 = "Уверена, у тебя были причины, и никому ты не навредила. Наверное, ты просто знаешь что-то, чего не знаю я."
90100110-137 = "Для хорошей лжи ведь нужна серьёзная самоотдача, да?"
90100110-138 = ""
90100110-140 = ""
90100110-141 = ""
90100110-142 = "Спасибо за понимание."
90100110-143 = "By the way, if you're just standing out here... How about we all go to that cafe and hang?"
90100110-144 = "Там делают отличный лимонад."
90100110-145 = "Проблема в том, что мы забыли кошельки..."
90100110-146 = "Прошу. Считайте, я угощаю."
90100110-147 = ""
90100110-149 = ""
90100110-150 = "Я просто... хочу узнать одну вещь, если ты не против."
90100110-151 = ""
90100110-153 = ""
90100110-154 = "Что делать, Нико? Кажется, она нас раскусила."
90100110-155 = "...Может, бросить дымовую шашку и свалить?"
90100110-156 = "Д-Даже не думай!"
90100110-157 = ""
90100110-159 = ""
90100110-160 = ""
90100110-161 = "Так что вообще было в том напитке? В Hyperade?"
90100110-162 = "Я хотела дать попробовать друзьям, но... в магазинах ничего похожего нет."
90100110-163 = "О, это просто! Смешай 500 мл воды с витаминной таблеткой Beluga и..."
90100110-164 = "Отоги! Не выдавай секреты! Она сказала, что купит нам напитки! Не теряй рычаг для переговоров."
90100110-165 = "О, вы весёлая компания."
90100110-166 = "Пойдём в кафе и уберёмся с солнца, а?"
90100110-167 = ""
90100110-169 = ""
90100110-170 = ""
90100110-171 = "Да, ты права."
90100110-173 = "...В конце концов, в такой жаркий день опасно долго стоять под солнцем."
