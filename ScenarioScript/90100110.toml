[translation]
90100110-1 = "Episódio 11;Incompreensível"
90100110-2 = "Gabinete da Presidente do Conselho Estudantil Federal"
90100110-3 = ""
90100110-4 = "Trago boas notícias."
90100110-5 = "As vítimas do espantalho branco — o chamado \"Kunekune\" — já começaram a despertar nos hospitais."
90100110-6 = "Felizmente, os médicos constataram que não restaram sequelas graves em sua saúde."
90100110-7 = "Embora a equipe médica não compreenda a razão da melhora tão repentina..."
90100110-8 = "Tenho convicção de que tudo isso só foi possível porque vocês expurgaram a anomalia."
90100110-9 = ""
90100110-11 = ""
90100110-12 = ""
90100110-13 = "A Presidente realmente confia em cada linha daquele relatório que entreguei?"
90100110-14 = "Mas é claro. Foi a Comandante Yukino quem o redigiu, não foi? #nAlém disso, vinha com o selo de aprovação do Sensei de Schale."
90100110-15 = "Eu não teria motivo algum para duvidar."
90100110-16 = "...Como relatei por escrito, nem mesmo nós temos certeza absoluta do que enfrentamos lá."
90100110-17 = "Lore é uma incógnita sem causa aparente nem remédio definido."
90100110-18 = "Tentamos tudo que estava ao nosso alcance... e o sucesso final não passou de um desfecho fortuito."
90100110-19 = "Mesmo assim, no fim das contas, muitas vidas foram salvas."
90100110-20 = ""
90100110-22 = ""
90100110-23 = "O resultado... não é o essencial."
90100110-24 = ""
90100110-26 = ""
90100110-27 = "...Não estou menosprezando a integridade dos cidadãos."
90100110-28 = "O ponto é que... incidentes inexplicáveis em Kivotos não são raros. #nContudo, quase nunca testemunhamos tantas vítimas civis desabando em sequência."
90100110-29 = "Ao perceberem que há variáveis incontroláveis rondando seu cotidiano... as pessoas caem em pânico. #nComeçam a procurar culpados, exigir motivações, empurrar responsabilidades e, em último caso..."
90100110-30 = ""
90100110-32 = ""
90100110-33 = "Podem acabar apontando os canos de suas armas na direção da senhora."
90100110-34 = ""
90100110-36 = ""
90100110-37 = ""
90100110-38 = "Yukino."
90100110-39 = "Gostaria de tentar adivinhar no que estou pensando agora?"
90100110-40 = "...A senhora está achando que minhas preocupações são meros delírios infundados?"
90100110-41 = "Que pena. Resposta errada."
90100110-42 = "Agora há pouco, a [ruby=Oki]senhorita Oki[/ruby] me trouxe um doce para acompanhar o chá. #nSó que era uma guloseima que eu nunca tinha visto na vida."
90100110-43 = "Tinha um sabor adocicado com um perfume cítrico nostrólgico que harmonizava perfeitamente com o chá... #nmas a embalagem não trazia ingrediente nenhum listado."
90100110-44 = "Enquanto conversávamos, eu fiquei me perguntando intimamente o que seria aquilo afinal de contas."
90100110-45 = "Hihi, perdoe a indiscrição."
90100110-46 = "N-não... não tem problema algum."
90100110-47 = "Eu nem desconfiei... e coisas desse tipo acontecem comigo também de vez em quando."
90100110-48 = "Ficar com o pensamento dominado por uma bobagem sem importância... #nEsse tipo de distração corriqueira ocorre com mais frequência do que imaginamos."
90100110-49 = "Porém, quase ninguém tem coragem de admitir isso abertamente em voz alta."
90100110-50 = "Pelo medo de ofender o interlocutor, ou de parecer uma pessoa estranha... os motivos são muitos."
90100110-51 = "No fundo, já que expor as verdadeiras emoções raramente traz vantagens práticas—"
90100110-52 = "As pessoas mantêm laços escondendo o que sentem no coração... e acabam incapazes de se compreender de verdade. #nÉ dessa brecha que brota a imensa maioria dos mal-entendidos."
90100110-54 = "...Talvez o fenômeno Lore seja justamente uma manifestação nascida dessa falta de comunicação."
90100110-55 = "Sentimentos que não viraram palavras nem texto... #nmas sim uma mensagem transfigurada a partir dos anseios derramados do coração humano."
90100110-57 = ""
90100110-58 = "Não consigo compreender."
90100110-59 = "Uma alucinação grotesca que confunde as mentes e arranca a fala das pessoas... que tipo de mensagem poderia carregar?"
90100110-60 = "A resposta para isso já saiu da sua própria boca, Comandante Yukino."
90100110-62 = "—\"Em dias escaldantes, evite atividades físicas ao ar livre\"."
90100110-63 = "Talvez a mera presença aterradora do \"Kunekune\" já fosse o aviso suficiente."
90100110-64 = ""
90100110-65 = "...Apenas por um motivo tão banal assim?"
90100110-66 = "Sim. Apenas por isso."
90100110-67 = ""
90100110-69 = ""
90100110-70 = "Comandante Yukino. Aquele doce do chá ainda tem alguns pedaços na caixa. #nAceitaria experimentar um?"
90100110-71 = "Quem sabe se provar o sabor e tentar decifrar os ingredientes junto comigo—"
90100110-72 = ""
90100110-74 = ""
90100110-75 = ""
90100110-76 = "Nós duas possamos nos compreender um pouquinho melhor."
90100110-78 = ""
90100110-79 = "Que calorão..."
90100110-80 = ""
90100110-82 = ""
90100110-83 = ""
90100110-84 = "Por que cargas d'água a gente tem que esperar do lado de fora?"
90100110-85 = "Não podia ser no saguão com ar-condicionado?"
90100110-86 = "Ah, isso é porque..."
90100110-87 = "Olha só, que ousada."
90100110-88 = "Quer dizer que você não liga de trombar de frente com as diretoras que você mandou pro hospital da outra vez?"
90100110-89 = "Ugh... aí ia pegar mal mesmo..."
90100110-90 = "Lembrem-se de que ainda estamos tecnicamente em liberdade condicional. Fazer escândalo aqui dentro seria péssimo."
90100110-91 = "Mesmo com esse calor, aguenta as pontas mais um cadinho."
90100110-92 = "Então vamos pelo menos pra debaixo da árvore, gente! Pra que ficar mofando bem no meião da praça sob o sol rachando?"
90100110-93 = "Podíamos até ir num café pedir um suco geladinho... não podia?"
90100110-94 = "Nem pensar. A carteira com o cartão corporativo de apoio tático tá com a Yukino."
90100110-95 = "Ué? Mas quem sempre cuidou do cofre do esquadrão foi a Niko!"
90100110-96 = "O relatório da operação inclui a prestação de contas dos gastos... por isso ela pediu pra levar o cartão com ela."
90100110-97 = "Ah, bom... se é assim, não tem jeito."
90100110-98 = ""
90100110-100 = ""
90100110-101 = "Ai, que sauna... quero voltar logo pra Schale."
90100110-102 = "Ouvindo você falar desse jeito até parece que Schale virou nossa casa~"
90100110-103 = "Ninguém tá escutando mesmo. Numa quentura dessas, quem em sã consciência anda na rua—"
90100110-104 = "Ué? Meninas...?"
90100110-105 = "Eita, quê?! N-não é nada disso que você tá pensando! #nEu só quis dizer que queria ir lá resolver umas coisas, não que seja minha casa nem nada—"
90100110-106 = "...Do que você tá falando?"
90100110-107 = ""
90100110-109 = ""
90100110-111 = ""
90100110-112 = "Garota do bico! Quanto tempo, hein!"
90100110-113 = "Você é... aquela aluna..."
90100110-114 = "Isso aí! Erika, da Academia Gehenna. Quem diria que nos encontraríamos de novo por aqui!"
90100110-115 = "A-ahahaha... pois é, né? Que baita coincidência."
90100110-116 = "Tá fazendo bico hoje também? #nÉ um chão bem puxado até a Academia Jacinto, não?"
90100110-117 = "S-sim! Hoje vim acompanhar umas amigas!"
90100110-118 = "Er... sobre aquele dia lá..."
90100110-119 = ""
90100110-121 = ""
90100110-122 = "Me desculpa, eu inventei uma história. #nO MomoTalk que passei também era uma conta falsa descartável..."
90100110-123 = "Ah, lembrei! Foi isso mesmo! #nQuando cheguei e fui pesquisar, apareceu \"usuário inexistente\" e eu fiquei de queixo caído."
90100110-124 = "E pra completar, aquele tal de \"Hyper-Aid\" nem sequer existia nas lojas. #nQuando contei pras minhas amigas, elas juraram que eu tinha conversado com um fantasma e foi o maior bafafá!"
90100110-125 = "Mas que alívio ver que você é de carne e osso afinal de contas!"
90100110-126 = ""
90100110-128 = ""
90100110-129 = "Eu sinto muito mesmo..."
90100110-130 = "Relaxa, não precisa pedir desculpa desse jeito!"
90100110-131 = "Todo mundo tem seus segredinhos, não é? #nNaquela hora você só... devia estar querendo manter a discrição, acertei?"
90100110-132 = "...Você não ficou chateada comigo?"
90100110-133 = "Por que ficaria? Não tive prejuízo nenhum, pelo contrário, foi uma experiência divertidíssima."
90100110-134 = "\"Quem será que era aquela garota misteriosa?\" \"Por que ela tava distribuindo uma bebida inexistente naquele descampado?\""
90100110-135 = "Passei as últimas semanas bolando mil teorias mirabolantes na cabeça, foi um passatempo ótimo!"
90100110-136 = "Além disso, você devia ter seus motivos. Não gosto de guardar rancor sem saber o quadro completo."
90100110-137 = "Lembra daquele ditado? \"Se sustentar a mentira até o fim, ela vira verdade\"!"
90100110-138 = ""
90100110-140 = ""
90100110-141 = ""
90100110-142 = "Muito obrigada por compreender..."
90100110-143 = "Que tal a gente bater um papo no café logo ali na esquina?"
90100110-144 = "O refresco artesanal deles é bom pra caramba."
90100110-145 = "O problema é que... esquecemos a carteira em outro lugar..."
90100110-146 = "Então deixa que eu pago a rodada!"
90100110-147 = ""
90100110-149 = ""
90100110-150 = "Só tem uma coisinha que eu quero que me responda com sinceridade em troca."
90100110-151 = ""
90100110-153 = ""
90100110-154 = "E-e agora? Ela tá querendo investigar nossa identidade secreta!"
90100110-155 = "...Que tal jogar uma granada de fumaça e vazar antes da prosa engrossar? Eu tô com uma aqui no bolso."
90100110-156 = "N-nem sonhando!"
90100110-157 = ""
90100110-159 = ""
90100110-160 = ""
90100110-161 = "—Aquele \"Hyper-Aid\" que tomei... como é que faz?"
90100110-162 = "Eu tentei fazer minhas amigas provarem, mas não achei nada no mercado que chegasse perto daquele gosto!"
90100110-163 = "Ah, isso aí é moleza! Você pega um comprimido de vitamina Beluga e joga em 500ml de água—"
90100110-164 = "Otogi, cala a boca! Não abre o bico antes de garantirmos o suco de graça! #nIsso é informação confidencial até sentarmos na mesa de negociação!"
90100110-165 = "Hihihi, vocês são muito mais engraçadas do que eu imaginava! Vai valer a pena bater esse papo."
90100110-166 = "Bora logo que o mormaço lá fora tá de lascar."
90100110-167 = ""
90100110-169 = ""
90100110-170 = ""
90100110-171 = "Com certeza."
90100110-173 = "...Ficar de bobeira no sol quente por muito tempo é pedir pra passar mal."
