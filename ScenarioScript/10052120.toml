[translation]
10052120-1 = "Ритуал"
10052120-10 = ""
10052120-11 = "УВА-А-А-А-А?!"
10052120-12 = "Наша вторая линия обороны. Серьёзно?! Правда?!"
10052120-13 = ""
10052120-15 = ""
10052120-17 = "..."
10052120-18 = "Не надо сразу паниковать. Давайте разберём, что мы знаем."
10052120-20 = "В-верно! Сейчас осталось только два пророка."
10052120-21 = "70% или больше Стального континента, нашего Нецаха, уже перешло в руки врага."
10052120-22 = "...Скорее всего, оставшиеся два региона смогут лишь немного их задержать."
10052120-24 = "Да. Мы поняли закономерность, поэтому игнорировать её нельзя. Они скоро прорвутся."
10052120-25 = "*шмыг* *шмыг* *всхлип*...!"
10052120-26 = "Успокойся, Эйн. Мы не сможем придумать план, если не признаем ситуацию, в которой оказались."
10052120-27 = "Г-где мы... ошиблись...?"
10052120-28 = "Я-я-я-я-это потому, что я их недооценила...?!"
10052120-29 = "Прости... Прости, Соф. Прости, Ор. Прости... старшая сестра. УА-А-А-А-А!!"
10052120-30 = ""
10052120-32 = ""
10052120-34 = "Тише, моя милая Эйн. Успокой страхи, ведь эти обстоятельства породили внешние силы, пляшущие вне нашей досягаемости."
10052120-35 = "Возвращение Цукацуки Рио. Непредвиденная переменная, и разрушительная."
10052120-36 = "Может, дело было в принцессе и её слуге, том ключе."
10052120-37 = "Может, центром всего был Сенсей."
10052120-38 = "..."
10052120-39 = "Или... может, они просто оказались сильнее нас."
10052120-41 = "М-может, мы развернули Стальной континент... слишком рано?"
10052120-43 = "Если бы мы этого не сделали... старшей сестры сегодня не было бы рядом с нами."
10052120-44 = "Это правда..."
10052120-46 = "Да. И пусть мои младшие сёстры Эйн, Соф и Ор знают о моей глубокой благодарности."
10052120-47 = "Старшая сестра..."
10052120-48 = "Соф, Ор, подойдите. Давайте все обнимемся."
10052120-49 = ""
10052120-52 = ""
10052120-53 = "Ч-Что...?"
10052120-54 = ""
10052120-61 = "Чтобы продолжать идти выбранным нами путём, этот человеческий жест может казаться мало полезным."
10052120-62 = "Кто-то может встать и осудить его как бессмысленный."
10052120-63 = "Но разве вы не чувствуете, как это тепло успокаивает уставшие уголки души?"
10052120-64 = "И это тоже поможет нам в пути."
10052120-65 = ""
10052120-68 = "*шмыг* Уа-а-а..."
10052120-69 = "Вот так. С каждой слезой выпускай боль, которую несёшь. Ведь ты с нами."
10052120-70 = "Оставь свои тревоги у моих ног. Я никогда тебя не покину. Наша встреча — моя великая гордость, радость и умиротворение."
10052120-76 = "Мы теряем контроль над Стальным континентом... Мы теряем Нецах."
10052120-77 = "Однако пока это ещё не стало нерешаемой проблемой."
10052120-78 = "Ключ... «Кей». Если мы вернём тело Кей, то сможем вернуть всё потерянное."
10052120-79 = "Е-если подумать, это всего лишь вопрос... безопасности и полномочий!"
10052120-80 = "Они также остановили расширение Стального континента, но и это не проблема."
10052120-81 = "Как только мы вернём захваченные ими области, Нецах снова сможет продолжить расширение."
10052120-82 = "Из наших сил осталось два пророка..."
10052120-83 = "И ещё..."
10052120-84 = "Я."
10052120-85 = "..."
10052120-86 = "Сила, которой я обладаю... Это тело было подавлено её мощью."
10052120-87 = "Если укрепить мою силу и прочность, я смогу выдавать мощность на пределе возможностей."
10052120-88 = "И мы уже работаем над этим!"
10052120-89 = "Д-да! Мы обязательно сделаем так, чтобы ты могла летать в завершённой форме!!"
10052120-90 = "И даже побеждённым пророкам ещё предстоит сыграть свою роль."
10052120-92 = "А? Правда?"
10052120-94 = "Да. Эйн, пожалуйста, объясни."
10052120-95 = ""
10052120-97 = ""
10052120-98 = "Т-так вот... Дело в том...!"
10052120-99 = "Пророки, находившиеся во внутренних частях Стального континента, вернутся и станут частью Нецаха...!"
10052120-100 = "Но во внешней части Стального континента... останки пророков в тех изолированных местах просто останутся там."
10052120-101 = "Ты рассказываешь мне то, что я и так знаю. И что?"
10052120-102 = ""
10052120-104 = ""
10052120-105 = "Погоди, ты намекаешь, что...?"
10052120-106 = "Динь-динь-динь! Именно!"
10052120-107 = "Так вообще бывает?!"
10052120-108 = "Н-ну, есть проблема с тем, чтобы доставить их останки сюда."
10052120-109 = "А, значит транспортировка."
10052120-111 = "И в идеале сделать это, не предупредив врагов."
10052120-113 = "Невозможные условия поверх невозможных условий..."
10052120-114 = "Я-я знала, что это слишком..."
10052120-115 = "..."
10052120-116 = "Но что может быть веселее, чем добиться невозможного, правда?"
10052120-117 = ""
10052120-120 = ""
10052120-121 = "О, вот теперь ты говоришь дело, Соф!"
10052120-123 = "П-Правда?"
10052120-124 = "Серьёзно. У нас достаточно Рабочих, чтобы это осуществить."
10052120-125 = "Я рада! Тогда я тоже...!"
10052120-126 = "Нет. Ты должна остаться здесь, Эйн."
10052120-127 = "Я-я должна? Ах... знаю... Такой бесполезный ребёнок, как я, не сможет—"
10052120-128 = "Нет, нет. Наоборот. Потому что сейчас нет никого важнее тебя, Эйн, а совсем скоро не будет и никого занятее."
10052120-129 = "...М-Меня?"
10052120-130 = "Не могу поверить, но я согласна с Соф. Ты критически важна для всех наших дальнейших планов."
10052120-131 = ""
10052120-134 = ""
10052120-135 = "ЧТООО?!"
10052120-136 = "Именно, Эйн. Нам от тебя нужны две вещи."
10052120-143 = ""
10052120-144 = "...Поняла?"
10052120-145 = ""
10052120-147 = ""
10052120-149 = "..."
10052120-150 = "Эйн? Ты в порядке?"
10052120-151 = ""
10052120-153 = ""
10052120-156 = "Э-Эйн?!"
10052120-157 = "О боже, кажется, мы слишком на неё надавили."
10052120-158 = "Но наша просьба искренняя и от всего сердца, Эйн."
10052120-159 = "Без тебя наши возможности резко сократятся."
10052120-160 = "Первую задачу — улучшение Малкут — мы, возможно, ещё сможем как-то рассмотреть, когда вернёмся."
10052120-161 = "Но другая... Другая — исключительно твоя область, Эйн. Ты это знаешь, мы все это знаем."
10052120-162 = ""
10052120-164 = ""
10052120-166 = "..."
10052120-167 = "Я-я попробую! Нет, Я СДЕЛАЮ!"
10052120-168 = "Чего бы это ни стоило! Я поставлю жизнь на кон, лишь бы справиться!"
10052120-169 = "Я УМРУ РАДИ ЭТОГО!!"
10052120-170 = "Глубоко дыши, Эйн. Смысл всего этого в том, чтобы никто не умер. Так что не надо. Пожалуйста."
10052120-171 = "Д-да, это тоже правда...! Но всё же..."
10052120-172 = "Я серьёзно! Я правда сделаю это!!"
10052120-173 = "Пусть это и было очевидным фигуральным преувеличением, мы действительно делаем всё возможное, чтобы такого не случилось."
10052120-174 = ""
10052120-176 = ""
10052120-178 = "..."
10052120-179 = "Спасибо тебе, Эйн."
10052120-180 = "Моё тело будет в твоих умелых руках."
10052120-181 = "Да!!"
10052120-187 = ""
10052120-190 = "Что есть реальность? Что есть вымысел? Такие размышления — лишь призраки прошлого. Попытка определить эти два понятия всего лишь отразит воспринимаемые субъектом ценности."
10052120-191 = "Отсюда можно заключить, что они едины. Что воображаемое на самом деле существует."
10052120-192 = "Существуют бесконечные возможности, вселенные внутри вселенных. Где лево — право, а право — лево. Где время течёт назад."
10052120-193 = ""
10052120-195 = ""
10052120-196 = "?!"
10052120-197 = "Ты слышала это, Арис?"
10052120-198 = "Д-да! Слышала! И то, что оно сказало на этот раз...!"
10052120-199 = "То, что оно... сказало..."
10052120-200 = "Ух! Я помню, но одновременно не могу вспомнить!"
10052120-201 = "Всё хорошо. На этот раз я тоже услышала. В широком смысле это была аналогия с CPT-симметричной вселенной."
10052120-202 = "Что? Симметричной... вселенной?"
10052120-203 = "Да. Вселенной, где лево и право поменяны местами, а время течёт назад."
10052120-204 = "Нам сложно это представить, но и ничто не доказывает, что такая вселенная не может существовать."
10052120-205 = "...Значит, тот голос был от...?"
10052120-206 = "Кей? Ты... знаешь, что это?!"
10052120-207 = "Не могу сказать, что... совсем не знаю. Но это просто... сложная тема."
10052120-208 = "Прости, Арис. Я никогда не стала бы скрывать от тебя тайну без необходимости. Особенно от тебя..."
10052120-209 = "..."
10052120-210 = "Кей. Эта тайна меняет то, что Сенсей, все остальные и я... должны делать?"
10052120-211 = "Хм? Нет... Ничего такого. Но..."
10052120-212 = "Ух... Но если эта штука вмешается здесь—"
10052120-213 = "Понятно. Тогда я продолжу делать именно это. То, что должна."
10052120-214 = "Нет смысла тревожиться о чём-то, чего мы даже не знаем."
10052120-215 = ""
10052120-217 = ""
10052120-218 = "...Как обычно, верно, Арис. Сосредоточимся на том, что можем контролировать: двух оставшихся областях."
10052120-219 = ""
