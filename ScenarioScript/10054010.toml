[translation]
10054010-1 = "Эпизод 1;Неожиданные новости"
10054010-2 = ""
10054010-3 = "Сенсей, прошло слишком много времение. Вам стоит навещать меня чаще."
10054010-4 = "Ваш текущий показатель удручающе низок. Я одобряю... три дня в неделю."
10054010-5 = "[s] «Э-Это может быть для меня совершенно невозможно...»"
10054010-6 = "Как и ожидалось. В таком случае нам придётся составить план посольства Шаньхайцзин, построенного прямо на территории Шале, чтобы я могла вести оттуда свою работу."
10054010-7 = "Фуфу, пожалуйста, расслабьтесь. Конечно же, я шутила."
10054010-8 = "...По большей части."
10054010-9 = "[s] «...Мне придётся отомстить за этот пранк!»"
10054010-10 = "Хм? Что именно за «месть»...?"
10054010-11 = ""
10054010-13 = ""
10054010-14 = ""
10054010-15 = "С-Сенсей? В-Вы слишком близко..."
10054010-16 = "Ай...!"
10054010-17 = "[ns] «Ты выглядишь нездоровой, Кисаки.»"
10054010-18 = "...Что?"
10054010-20 = "Понятно. Вы беспокоились о моём здоровье."
10054010-21 = "Хотя я ценю вашу заботу... *вздыхает*"
10054010-22 = "Ничего. Просто проекция моих собственных желаний. Что более важно..."
10054010-23 = "..."
10054010-24 = "...Генрюмон доставил вам неприятности?"
10054010-25 = "[s1] «Э-Э-Э?!»\n[s2] «В-Вообще нет! Всё не так...!»"
10054010-28 = "Хм?"
10054010-29 = "..."
10054010-30 = "Я даже... разочарована. Разве наша связь не выше подобного обмана? С каких это пор мы начали лгать друг другу?"
10054010-32 = "Когда она это сказала, мне пришлось рассказать Кисаки правду."
10054010-34 = "*вздыхает*"
10054010-35 = "[s] «Н-Не ругай их слишком сильно, хорошо...?»"
10054010-36 = "Я понимаю. Они не замышляли ничего плохого."
10054010-37 = "Хотя это не обязательно смягчает последствия их действий."
10054010-38 = "Я также несу определённую ответственность, поскольку являюсь первопричиной их беспокойства."
10054010-39 = "[s] «Ты... правда плохо себя чувствуешь?»"
10054010-40 = "Ничего серьёзного. Просто... тепловой удар."
10054010-41 = "Объяснение Руми было вполне точным. В это время года моё здоровье страдает довольно предсказуемо."
10054010-42 = "Фуфу. Сенсей, пожалуйста, вам не нужно так волноваться. Это не связано с моим обычным состоянием."
10054010-43 = "Вы же не думаете, что Сая стала бы сидеть сложа руки, если бы всё было иначе?"
10054010-44 = "[s] «Если ты говоришь правду, я спокоен...»"
10054010-45 = "Что она сказала? «Отдохнуть морально и физически»?"
10054010-46 = "[s] «Тут я с ней согласен.»"
10054010-47 = "...Мне трудно возразить. Однако мой объём работы может со мной не согласиться."
10054010-48 = "Вы говорите, я должна взять отпуск на летние каникулы?"
10054010-49 = "Фуфу. Заманчивое предложение... для любого другого студента. Однако я — президент Генрюмон."
10054010-50 = "Я не могу просто так сбежать по своему желанию, оправдываясь лишь «отдыхом»."
10054010-51 = ""
10054010-53 = ""
10054010-54 = ""
10054010-55 = ""
10054010-56 = ""
10054010-57 = "Здравствуйте, госпожа Президент! Как вы себя чувствуете?"
10054010-58 = "Менеджер по связям с общественностью Канаэ. Ты редко пишешь первой. Что-то случилось?"
10054010-59 = "Госпожа, вы меня ранили! Возможно, я просто хотела с вами поговорить! Обязательно должна быть какая-то чрезвычайная ситуация, чтобы я вам позвонила?"
10054010-60 = "Говорят же, что можно трижды посетить пустой дом, чтобы заполучить талант, необходимый для великого плана, верно?"
10054010-61 = "А-а? Это не подходит к данной ситуации?"
10054010-62 = "Вовсе нет. Эта поговорка означает, что талантливые люди стоят того, чтобы приложить усилия для их привлечения."
10054010-63 = "Аргх!"
10054010-64 = "Возвращаясь к нашей теме... Я бы поверила в это от кого угодно, но не от вас."
10054010-65 = "Вы знаете лучше всех о текущем состоянии моих дел, а также о моём здоровье. И любое сообщение для меня пришло бы через третье лицо, не так ли?"
10054010-66 = "Вот что вы называете «романтикой»."
10054010-67 = "Как и ожидалось от госпожи! Вы меня так хорошо знаете!"
10054010-68 = "...Полагаю, моё восторженное согласие лишь ещё больше подчёркивает противоречие между моими словами и действиями."
10054010-69 = "Однако я не дрогну!! Ведь говорят, что нужно иметь силу, чтобы вырвать горы с корнем, и мощь, чтобы затмить весь мир!"
10054010-70 = "А-а? Здесь это тоже не работает?"
10054010-71 = "Верно... Кажется, теперь я вспоминаю, что концовка той истории не особенно счастливая. Кагуя во мне разочаруется."
10054010-72 = "Я никогда от этого не оправлюсь!"
10054010-73 = "К-Кхм! Несмотря на то, насколько противоречиво и, возможно, даже грубо я себя веду, у меня есть просьба!"
10054010-74 = "Не могли бы мы все собраться в моём офисе — то есть, в приёмной!"
10054010-75 = "..."
10054010-76 = "Говори мне правду, Канае. Неужели на Шаньхайцзин надвигается какая-то неминуемая гибель?"
10054010-77 = "...Прошу прощения?"
10054010-78 = "А... Теперь я понимаю, что мой подход к этой теме был в лучшем случае вводящим в заблуждение... Прошу прощения."
10054010-79 = "Однако! Никакая неминуемая гибель нам не грозит! Пожалуйста! Что мне сделать, чтобы вы мне поверили?"
10054010-80 = "Я всего лишь хотела организовать трапезу в кругу друзей..."
10054010-81 = "..."
10054010-82 = "А президент Променада Чёрной Черепахи... Руми тоже придёт?"
10054010-83 = "А? А... Вы правы! С определённой точки зрения, её можно считать связующей нитью, проходящей через это полотно..."
10054010-84 = "Фуфу. И пазл складывается. Однако, Канае..."
10054010-85 = "Да?"
10054010-86 = "оспользуйся моментом и прибери приёмную. Она давно пустовала и пришла в запустение."
10054010-87 = "Это правда..."
10054010-88 = ""
10054010-89 = "[ns] «Кто это вообще была?»"
10054010-90 = "Я забыла, что вы ещё не встречались с ней. Ошибка в моих суждениях, учитывая, насколько близки мы стали в последнее время."
10054010-91 = "Надеюсь, это запоздалое знакомство не породит недоверия между нами. Я искренне извиняюсь."
10054010-92 = ""
10054010-94 = ""
10054010-95 = "[ns] «Мне становится всё любопытнее...»"
10054010-96 = "Канае — очень важный член Генрюмон. Она работает вместе с Миной, чтобы поддерживать нашу повседневную деятельность."
10054010-97 = "Пока Мина занимается внешними делами, Канае прекрасно знакома с тонкой паутиной наших внутренних процессов."
10054010-98 = "Как инь и ян, Генрюмон не смог бы существовать без одного из них."
10054010-99 = "Должно казаться странным, что вы не встретили её даже случайно, учитывая, сколько времени вы провели здесь."
10054010-100 = "Мне испортить вам сюрприз...?"
10054010-101 = ""
10054010-103 = ""
10054010-104 = "Фуфу, думаю, нет. Вы получите удовольствие, раскрыв это самостоятельно, как только встретитесь с ней."
10054010-106 = "Кейтеринг-буфет Променада Чёрной Черепахи прибыл!"
10054010-107 = "Не ждите изысков, но мы подготовили несколько популярных летних блюд. Надеюсь, вам понравится."
10054010-108 = ""
10054010-110 = ""
10054010-111 = ""
10054010-113 = ""
10054010-114 = ""
10054010-115 = ""
10054010-116 = "Добро пожаловать, добро пожаловать, все и каждый! Я бесконечно благодарна вам за то, что вы нашли время в своём плотном графике, чтобы разделить со мной эту трапезу!"
10054010-117 = "Фуфу. Прошло немало времени, не так ли, Канае? Спасибо, что пригласила нас."
10054010-118 = "Спасибо, Канае!#nСтоп, Сенсей тоже здесь? Здравствуйте, Сенсей!"
10054010-119 = "[s] «Привет, Кокона!»"
10054010-120 = "Сколько раз мне нужно повторять! Называйте меня Инструктор Кокона!"
10054010-121 = "[s] «Ах, точно! Кокона... Нет, я имел в виду Инструктор Кокона!»"
10054010-122 = "Э-э-э? Угх! Вы издеваетесь надо мной, Сенсей? Иногда сложно понять!"
10054010-123 = ""
10054010-125 = ""
10054010-126 = ""
10054010-127 = "И вот наконец мы встретились, Сенсей! Я Мияучи Канае! Приятно познакомиться!"
10054010-128 = "Я встретила Сенсея, а Сенсей встретил меня... Это как рыба в воде!"
10054010-129 = "Ха! Ну, как вам это? Госпожа, я правильно использовала идиому в этой ситуации?"
10054010-130 = "Полагаю... Однако тебе не стоит так навязываться Сенсею."
10054010-131 = "П-Правда...? Оуу."
10054010-132 = "[s] «Канае, верно? Приятно познакомиться.»"
10054010-133 = "...Знаешь, сколько времени прошло с тех пор, как Сенсей впервые пришёл в Шаньхайцзин? Ты не торопилась представляться!"
10054010-134 = "Х-Хотя я и не буду искать себе оправданий... Но я считаю, что мои причины абсолютно справедливы! Ты же понимаешь меня, Мина?"
10054010-135 = "«Справедливы» — это слишком громко сказано."
10054010-136 = ""
10054010-137 = "[ns] «Не будь такой суровой! Я рад встрече с ней сейчас.»"
10054010-138 = "Хотя ваша предупредительность и умение прощать — это ваша сильная сторона, Сенсей..."
10054010-139 = "Вы не можете распространять это на Канае. Абсолютно нет."
10054010-140 = "Позвольте мне объяснить, почему она всё это время запирается в своём кабинете..."
10054010-141 = "Потому что она сумасшедшая! У неё есть странная вера в то, что стратеги должны работать в крошечной комнатке, чтобы раскрыть свой максимальный потенциал!"
10054010-142 = "С-Сумасшедшая?! Я?! Мина, не говори о том, в чём не разбираешься!"
10054010-143 = "У каждого стратега должно быть подходящее кресло-качалка, чтобы качаться в нём во время разработки стратегий! На самом деле, это желание нашего сердца!"
10054010-144 = "Письменность может лишь записывать имена, а владение мечом хорошо лишь для победы над врагом, стоящим перед тобой."
10054010-145 = "Но стратегии и искусство войны — это меры для победы над десятками тысяч врагов!"
10054010-146 = "А? Это прозвучало так, будто было отчасти правильным... Разве нет?"
10054010-147 = "Это не так. Эту цитату произнёс генерал, а не стратег."
10054010-148 = "П-Правда?!"
10054010-149 = "И это даже неправда, ты, одержимая идиомами идиотка! Никто так не думает!"
10054010-150 = ""
10054010-152 = ""
10054010-153 = "Ну, ну. Почему бы нам всем не сделать глубокий вдох и не успокоиться? В конце концов, здесь присутствует госпожа Кисаки."
10054010-154 = "Ах! Да, да, прошу прощения, госпожа и гости!"
10054010-155 = "Моему поведению нет оправданий. Я не позволю этому повториться."
10054010-157 = "[ns] «Значит ли это... что Канае никогда не выходит из своей комнаты?»"
10054010-158 = "Фуфу. Нет, только когда она выполняет свои «стратегические» обязанности."
10054010-159 = "Одно из твоих хобби — путешествия, верно?"
10054010-160 = "Как и сказала госпожа! Сенсей, вы любите путешествовать? Нам стоит отправиться в поездку вместе! В идеале, когда у вас будет выходной в понедельник или пятницу!"
10054010-161 = "Иногда я задаюсь вопросом, не нужно ли тебе поставить какой-нибудь диагноз."
10054010-162 = "Как жестоко, Мина! У меня просто чёткие границы между профессиональной и личной жизнью!"
10054010-163 = "Вне офиса мне позволено быть кем угодно! И это также..."
10054010-164 = "...мечта стратега! Разве не удовольствие — изучать и практиковать то, что ты выучил?"
10054010-165 = "Какое это имеет ОТНОШЕНИЕ к тому, о чём мы говорим?!"
10054010-166 = "О... Эта поговорка здесь не сработала?"
10054010-167 = "Совсем нет!"
10054010-168 = "Слушай, живи своей мечтой или чем угодно. Но тебе нужно выходить из своей комнаты и время от времени помогать другим отделам!"
10054010-169 = "О, дорогая Мина! Без чётко определённых ролей и обязанностей организация развалится по швам!"
10054010-170 = "«Роли»...? «Обязанности»...?"
10054010-171 = ""
10054010-173 = ""
10054010-176 = "HELP! WITH!ПОМОГИ! С!"
10054010-177 = ""
10054010-182 = "ДРУГИМИ! ЗАДАЧАМИ!"
10054010-183 = ""
10054010-188 = "ЭТО наша роль! НАХОДИТЬ и ВЫПОЛНЯТЬ задачи, которые нужно сделать!"
10054010-189 = ""
10054010-194 = "Если я услышу, как ты говоришь об обязанностях ЕЩЁ РАЗ, чтобы попытаться спихнуть СВОЮ работу на МЕНЯ—!!"
10054010-195 = "Ай!! АЙЙЙ! Помогите, больно!!"
10054010-196 = "Фуфу. Хотя я рада видеть, что Мина и Канае здоровы и счастливы, мы ведь здесь, чтобы приятно провести время за едой, верно?"
10054010-197 = "Именно! Хорошо, что дети из Сада Цветущей Сливы не здесь, но представь, какой пример это им подаёт."
10054010-198 = "...Опять же, у меня нет оправданий. Прошу прощения."
10054010-199 = "*всхлип* *шмыг* Шун, видишь, как мне тяжело? Мина всегда такая, когда видит меня!"
10054010-200 = "Однако довольно редко вы двое видитесь."
10054010-201 = "Потому что она всегда меня изводит, когда мы встречаемся... Хе-хе."
10054010-202 = "Я готова нести ответственность за то, что я ДЕЙСТВИТЕЛЬНО сделала..."
10054010-203 = "[ns] «Дыши глубже, Мина. Молодец.»"
10054010-204 = "*вздох* Спасибо, Сенсей."
10054010-205 = "Фуфу. Не ругайте её слишком сильно, Сенсей, и ты тоже, Мина."
10054010-206 = "У неё есть недостатки, но никто во всём Генрюмоне не предан более тщательной административной работе и адаптации новичков так, как она."
10054010-207 = "Каждый документ, попадающий на мой стол, сначала просматривает Канае."
10054010-208 = "Когда дело доходит до её работы, я испытываю к ней непоколебимое доверие."
10054010-209 = "Я признаю, что если Генрюмон снова постигнет кризис, Канае придётся удалиться в свой кабинет, чтобы полностью посвятить себя бумажной работе и административным задачам, как в прошлый раз."
10054010-210 = "Да, я болезненно это осознаю..."
10054010-211 = "Хи-хи..."
10054010-212 = "Кроме того, сфера деятельности Канае, как она сама её определяет, признаться, довольно узка."
10054010-213 = "Бу-у..."
10054010-215 = ""
10054010-217 = ""
10054010-218 = "Итак, какова причина этой встречи? Еда была восхитительной, а собрание — занимательным."
10054010-219 = "Однако, рискуя повториться, всё это совсем не в твоём характере, Канае."
10054010-220 = "Ах, да! Я понимаю!"
10054010-221 = ""
10054010-223 = ""
10054010-224 = "Да, согласно моим данным..."
10054010-225 = "Променад Чёрной Черепахи инвестировал средства во внешнее учреждение, госпожа."
10054010-226 = "Променад Чёрной Черепахи?"
10054010-227 = "Средства?"
10054010-228 = "О?"
10054010-229 = "А?"
10054010-230 = "..."
10054010-231 = "..."
