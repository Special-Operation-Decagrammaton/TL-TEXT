[translation]
10024040-1 = "Эпизод 4;Дорога длиннее, гора выше"
10024040-9 = "Гора Куньлунь"
10024040-10 = ""
10024040-11 = "Вы в порядке, Сенсей?"
10024040-12 = "[s1] «*задыхается* *задыхается* Я уже... не... молод...»\n[s2] «Помедленнее... вы... дети...»"
10024040-15 = "Сенсей, когда всё закончится, хотите потренироваться со мной в кунг-фу?"
10024040-16 = "Хм. В случае Сенсея это, возможно, не такая уж плохая идея..."
10024040-17 = ""
10024040-19 = ""
10024040-20 = "[ns] «С чего вдруг?!»"
10024040-21 = "Во всём, что делаешь, выносливость и стойкость — главное. Это верно даже для готовки."
10024040-22 = "И... думаю, то же самое касается вашей работы, Сенсей."
10024040-23 = "[s] «...Похоже, вы просто хотите привести меня в форму.»"
10024040-24 = "И это тоже."
10024040-25 = "[s] «Не-е-ет! Я не хочу заниматься спортом!»"
10024040-26 = "«Действуй прежде, чем подумаешь, иначе обязательно проиграешь.»"
10024040-27 = "Это идеально вас описывает! Видите, дух кунг-фу уже живёт в вас!"
10024040-28 = "Становится интересно. Надо было взять танхулу и улун..."
10024040-29 = ""
10024040-31 = "[ns] «Я делаю это не ради вашего развлечения!»"
10024040-32 = ""
10024040-34 = ""
10024040-36 = ""
10024040-37 = ""
10024040-39 = ""
10024040-40 = "Вы опоздали, Променад Чёрной Черепахи."
10024040-41 = "Это же вы...!"
10024040-42 = "Позвольте представиться официально."
10024040-43 = "Я Коноэ Мина, исполнительный офицер Генрюмон."
10024040-44 = "Ты правая рука Кисаки. Полагаю, на этот раз она действительно тебя прислала?"
10024040-45 = "...Возможно."
10024040-46 = "Преступники не могут удержаться от возвращения на место преступления. Я знала, что вы рано или поздно появитесь."
10024040-47 = "Опять беспочвенные обвинения! Вы, члены Генрюмон, просто невыносимы!"
10024040-48 = "Нет, признаки очевидны. Теперь я уверена в вашей виновности без всяких сомнений."
10024040-49 = "Может, тебе и кажется, что ты уверена, но я считаю, что ты слишком беспечна."
10024040-50 = "Я не делаю ни единого беспечного шага... Другие студенты, возможно, могут себе это позволить, но не Генрюмон."
10024040-52 = "Ты довольно самоуверенная, знаешь?"
10024040-53 = "Это усердие, а не самоуверенность."
10024040-54 = "Давно пора закрыть это дело раз и навсегда."
10024040-55 = "Путь к разгадке был трудным. Но чем глубже путь, тем приятнее результат."
10024040-56 = ""
10024040-58 = ""
10024040-59 = ""
10024040-60 = "[ns3] «Эм... Ты только что подожгла талон на еду?»\n[ns4] «Нет, Мина! Не сжигай драгоценный талон на еду!»"
10024040-63 = "...Не волнуйтесь, Сенсей. Он поддельный."
10024040-64 = "Хмпф. Было бы круче, если бы у меня была настоящая сигарета..."
10024040-65 = ""
10024040-67 = "[ns] «Нет, не было бы. Курение — это не круто.»"
