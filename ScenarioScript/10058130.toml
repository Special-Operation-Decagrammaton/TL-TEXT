[translation]
10058130-1 = "Afterwards 01;0-Cylinder Air Cooled"
10058130-2 = "(The day before the race.)"
10058130-3 = "Gehenna Cup Lodging"
10058130-6 = "It's hot."
10058130-7 = "It's so hot in there that it pisses me off! I can't take it anymore!"
10058130-8 = "Ahaha... It's too bad we weren't able to fix Crusader-chan's AC."
10058130-9 = "I don't think it's so bad being all sticky and wet."
10058130-10 = "It's horrible! Being all sweaty and having your clothes stick to you is the absolute worst feeling!"
10058130-11 = "I suppose you'd rather prefer to see that sort of stuff it in a book instead."
10058130-12 = "Wh-what are you talking about!? I don't know anything about that kind of stuff!"
10058130-13 = "If that's the case... Then I suppose you wouldn't mind if we sat down together#nright now and read that \"Tank Equipment Manual\" inside your bag."
10058130-14 = "W-Well...! Well that book is too challenging for you, so just forget it!"
10058130-15 = "I see..."
10058130-16 = "What's with that look!?"
10058130-17 = "Using a different book cover as camoflauge—how classic."
10058130-18 = "!!!"
10058130-19 = "Even before we left, you've been going through it very intently.#nI guess manuals do act as the foundation for all tactics."
10058130-20 = "If you don't mind, I'd like to read it too."
10058130-21 = "I said forget it, so just forget it already!"
10058130-22 = "Ahaha, it's all right. Even without the manual, there are other ways to repair the#nAC."
10058130-23 = "I ordered something that should help us cool down. It should be arriving soon..."
10058130-24 = "Something to cool us down?"
10058130-28 = "Who could it be at this hour? Perhaps someone from next door?"
10058130-29 = "Koharu-chan. #nIf the doorbell rings at night... Well, I'm sure you know what happens next, right?"
10058130-30 = "I know you're fishing for something impure with that question!#nYou're the absolute worst!"
10058130-31 = "Stay back, they might throw tear gas inside."
10058130-32 = "I see you've brought your gas mask again."
10058130-37 = "Hellooo! It's the Pandamonium Societey!"
10058130-38 = "Ibuki has a package for you!"
10058130-41 = "Wah! I-Is that an alien!? I'm scaaared!"
10058130-42 = "I'm not an alien. I'm Shirasu Azusa. Nice to meet you."
10058130-43 = "Hurry up and take that thing off already! You're scaring the poor girl!"
10058130-44 = "Koharu-chan, would you like to me to take something off for you too...? ♡"
10058130-45 = "Death sentence, death sentence—I'm sentencing you to DEATH!"
10058130-46 = "Death sentence? Did Ibuki... do something wrong...?"
10058130-47 = "Th-that's not what I meant...!"
10058130-50 = "I see! Thank you for the yummy candies!"
10058130-54 = "Onee-chan, this is room 616, right? Could you sign here?"
10058130-55 = "Thank you! Sorry we had to trouble you with something this heavy!"
10058130-56 = "The Pandemonium Society is Gehenna's student council, right?#nDo you all handle delivery work as well?"
10058130-57 = "Yep! Everyone is busy, so Ibuki is helping out!"
10058130-58 = "Ehehe! It's fun meeting all sorts of people while doing this!"
10058130-59 = "Oh my, what a good girl."
10058130-60 = "You're all grown-up, just like Koharu-chan."
10058130-61 = "Of course! As an elite, I'm obviously all grown-up..."
10058130-64 = "Hm? Wait, are you messing with me...?"
10058130-65 = "I'd neeever do something like that!"
10058130-70 = "Why are you suddenly hugging me!?"
10058130-72 = "So sign right here... And there! Thanks for your work!"
10058130-73 = "Yep! And good luck with the race tomorrow!"
10058130-77 = "Come to think of it, what did you order anyway?"
10058130-81 = "What broke in the AC was the evaporator, so... #nI figured if we directly cooled the refrigerant, it should blow out cold air..."
10058130-82 = "So I ordered dry ice!"
10058130-83 = "Which means I need to quickly move it into a cooler..."
10058130-88 = "What is this...?"
10058130-89 = "It's not dry ice, but it certainly seems like it would cool us down."
10058130-90 = "Did they mix up the order? #nIt does say 616, which means this WAS sent to the correct room, right?"
10058130-94 = "Yes, it should be right..."
10058130-95 = "I did mention that the AC was faulty during the vehicle inspections.#nPerhaps the organizers sent this as a solution?"
10058130-96 = "Well that sounds... not that unlikely, actually? Still a little weird that they would#nsend THIS, but..."
10058130-97 = "So then... is this a racing suit?"
10058130-98 = "A racing suit?"
10058130-99 = "Yes! You've seen people wearing these before in advertisements, haven't you?"
10058130-100 = "But those aren't for the competitors to wear! They're more of something the#npresenters would wear..."
10058130-101 = "Maybe the custom here is different from Trinity. It seems good to me—it's both#ncool and functional."
10058130-102 = "Hmm... Well without the dry ice, the AC won't be of any use anyway..."
10058130-103 = "If we wear our usual uniforms, it might lead to heatstroke as well, so maybe it is#nbetter for us to wear it."
10058130-104 = "But aren't there only two of them?"
10058130-105 = "Maybe they only provided it for the commander and deputy tank commander."
10058130-106 = "Then those will be for Hifumi-chan and Azusa-chan!"
10058130-107 = "As for us, we'll just wear the swimsuits we brought along just in case,#nKoharu-chan!"
10058130-108 = "What are you saying? I didn't pack a swimsuit."
10058130-109 = "I brought yours with me. It's only natural to be prepared for emergencies."
10058130-110 = "What kind of emergency needs a swimsuit!?"
10058130-111 = "An armor meant for a battlefield—I like it."
10058130-112 = "Well I AM worried about heatstroke... and the organizers did go out of their way to prepare these for us, so I guess we'll gladly accept it."
10058130-113 = "But isn't it weird to be riding around in a tank while wearing a swimsuit!?"
10058130-114 = "Is it!?"
10058130-116 = "Hum hum~ La-la-la~ ♪"
10058130-117 = "Let's see!"
10058130-118 = "Dry ice for room 616, delivered!"
10058130-119 = "Next is to deliver Makoto-senpai's uniform to room 919, and then Ibuki's all done!"
10058130-120 = "Ehehe!"