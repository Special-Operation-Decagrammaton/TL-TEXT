[translation]
10058130-1 = "Afterword Part 1;Air-cooled 0-cylinder"
10058130-2 = "(The Day Before the Race)"
10058130-3 = "Gehenna Cup Lodging"
10058130-6 = "It's hot."
10058130-7 = "It's seriously hot! This is so annoying! I can't take this anymore!!!"
10058130-8 = "Ahaha... In the end, we couldn't fix Crusader-chan's air conditioner."
10058130-9 = "I think clinging together and getting all sticky has its own charm, though."
10058130-10 = "No way! It's gross sticking to people when you're all sweaty!"
10058130-11 = "You prefer that kind of thing when you see it in books, right?"
10058130-12 = "W-What are you talking about?! I don't know anything about that!"
10058130-13 = "In that case... Is it okay if we look at the #n'Tank Equipment Manual' in Koharu-chan's bag together right now?"
10058130-14 = "T-That is...! It's too hard for you, so no!"
10058130-15 = "I see..."
10058130-16 = "What's with that look!?"
10058130-17 = "Camouflaging it with a different cover is pretty classic."
10058130-18 = "!!!"
10058130-19 = "You were reading it so hard before we left. Manuals are the basis of all tactics."
10058130-20 = "If you don't mind, I'd like to read it too."
10058130-21 = "I said no means no!!!"
10058130-22 = "Ahaha, it's fine. Even without the manual, there's a way to fix it."
10058130-23 = "The \"cooling item\" I ordered should be arriving any minute now..."
10058130-24 = "A cooling item?"
10058130-28 = "Who could that be at this hour? The neighbors?"
10058130-29 = "Koharu-chan. #nWhen the doorbell rings at night, you know very well what happens next... right?"
10058130-30 = "Your intent with that question is so impure! Absolutely the worst!"
10058130-31 = "They might distance themselves and toss in a tear gas canister."
10058130-32 = "You brought your gas mask this time too, I see."
10058130-37 = "Yhoo! It's the Pandemonium Society~!"
10058130-38 = "I came to deliver a package!"
10058130-41 = "Wah! A-Alien?! Scary~!!"
10058130-42 = "I'm not an alien. I'm Shirasu Azusa. Nice to meet you."
10058130-43 = "Take that off already! You're scaring her!"
10058130-44 = "I'll take Koharu-chan's off for her too... ♡"
10058130-45 = "Execution, execution, execution!!"
10058130-46 = "E-Execution? Is Ibuki a bad girl...?"
10058130-47 = "N-No, that's not it...!"
10058130-50 = "Yay! Thanks for the delicious candy!"
10058130-54 = "Big sis, this is Room 616, right? Can you sign here?"
10058130-55 = "Thank you very much! Thanks for your hard work even though it's heavy!"
10058130-56 = "The Pandemonium Society is a Gehenna student council, right? Do you guys do delivery work too?"
10058130-57 = "Yup! Everyone's busy, so Ibuki is helping out!"
10058130-58 = "Ehehe! It's fun getting to meet all sorts of people!"
10058130-59 = "My, how admirable."
10058130-60 = "Just like Koharu-chan, she's an a-d-u-l-t!"
10058130-61 = "Obviously, I'm an elite, so I'm an adult..."
10058130-64 = "Hm? Are you teasing me...?"
10058130-65 = "I'm not teasing you at all~"
10058130-70 = "Why are you suddenly hugging me!?"
10058130-72 = "Sign here, right... There! Thank you very much!"
10058130-73 = "Yup! Good luck in tomorrow's race!"
10058130-77 = "By the way, what did you order?"
10058130-81 = "The part that broke is the AC's evaporator, so... #nI figured if we cooled the refrigerant directly, it would blow cold air..."
10058130-82 = "So I ordered some dry ice earlier!"
10058130-83 = "We need to hurry and move it to the cooler bag..."
10058130-88 = "This is..."
10058130-89 = "It's not dry ice, but it certainly looks cool."
10058130-90 = "Did they get the contents wrong? #nIt says 616 on it, so it is addressed to this room, right?"
10058130-94 = "Yes, it should be..."
10058130-95 = "We mentioned the breakdown during the vehicle inspection, so did the committee send this to us?"
10058130-96 = "Is that... actually possible? For the committee to send something like this..."
10058130-97 = "These are... racing suits."
10058130-98 = "Racing suits?"
10058130-99 = "Yes! You see people wearing outfits like this in commercials, right?"
10058130-100 = "Those look like what the event staff wear, not the participating drivers..."
10058130-101 = "It might be a different custom from Trinity. It looks cool and functional, so I think it's good."
10058130-102 = "Ugh... If there's no dry ice, the AC won't work anyway..."
10058130-103 = "There's a risk of heatstroke in our uniforms, so we might be better off wearing these."
10058130-104 = "But there are only two sets?"
10058130-105 = "Perhaps they're only for the tank commander and vice-commander."
10058130-106 = "If that's the case, these are for Hifumi-chan and Azusa-chan!"
10058130-107 = "Let's wear the swimsuits we brought just in case, Koharu-chan!"
10058130-108 = "What are you talking about? I didn't bring any swimsuit."
10058130-109 = "I brought Koharu-chan's share as well. It's only natural to prepare for emergencies."
10058130-110 = "What kind of emergency!?"
10058130-111 = "Armor for stepping onto the battlefield. I like it."
10058130-112 = "Heatstroke is a concern too... And since the committee went out of their way to prepare them, #nwe might as well wear them without hesitation."
10058130-113 = "Riding in a tank wearing swimsuits is ridiculous!"
10058130-114 = "Eh!?"
10058130-116 = "La-la-la~♪"
10058130-117 = "Uhm~"
10058130-118 = "Dry ice for Room 616, delivery complete!"
10058130-119 = "And once I deliver Makoto-senpai's clothes to Room 919, work is done!"
10058130-120 = "Ehehe!"
