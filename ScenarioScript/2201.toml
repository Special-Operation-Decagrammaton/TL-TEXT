[translation]
2201-1 = "Сомнительный бизнес-план"
2201-2 = "Торговый район Тринити"
2201-4 = "Ха-ха-ха! Правда?"
2201-5 = "Да! В кондитерской в самом конце торгового района..."
2201-7 = ""
2201-8 = "Хмф! Все здесь такие беззаботные."
2201-9 = "Наверное, это само воплощение женственности."
2201-10 = "О-Они будто светятся!"
2201-11 = "М-Можно ли такой, как я, вообще здесь находиться?"
2201-12 = "Ха-ха-ха. Было бы весело взорвать бомбу прямо посреди этого места, правда?"
2201-13 = "*качает головой*"
2201-14 = "Только если поступит заказ взорвать центр улиц Тринити."
2201-15 = "Ну же, Муцуки. Мы сегодня здесь по делу."
2201-16 = "Какое у нас может быть дело в районе Тринити, Ару?"
2201-17 = "Хи-хи. Расскажу, только не слишком удивляйтесь."
2201-18 = "Всё нормально. Меня уже почти ничем из твоих слов не удивить."
2201-19 = "Ладно."
2201-20 = "Я люблю сюрпризы! Я полностью готова!"
2201-21 = "Ой, погоди... ты же не хочешь, чтобы я удивлялась... Эм, тогда что мне делать?"
2201-22 = "Уф! Да неважно!"
2201-23 = "*прочищает горло* В общем, расскажу, зачем мы сегодня пришли в Тринити."
2201-24 = ""
2201-25 = "Мы здесь ради презентации нового бизнеса."
2201-26 = "Что?! Бизнес-презентация?"
2201-27 = "Почему такое вообще проводят в Тринити?"
2201-28 = "Ну, я узнала об этом от одного своего знакомого..."
2201-29 = "Знакомого?"
2201-30 = "*дуется*"
2201-31 = "Почему вы так недовольно выглядите?!"
2201-32 = "Информация надёжная! Клиент, с которым я познакомилась на прошлом заказе, сказал..."
2201-33 = "«Здесь намечается отличная деловая возможность. Никому, кроме тебя, Ару, я об этом не расскажу. Поняла?»"
2201-34 = ""
2201-35 = "Это сверхсекретная информация, доступная только самым закрытым кругам Кивотоса!"
2201-36 = "Бизнес-секрет, которым делятся между собой преступники..."
2201-37 = "Разве не круто?!"
2201-38 = "Хм... Если Ару так говорит, значит, всё правда."
2201-39 = "Ага, это потрясающе, босс!"
2201-40 = "...Ну?! Не стесняйтесь! Хвалите меня ещё!"
2201-41 = "Только благодаря моим выдающимся деловым навыкам мне удалось заполучить такую ценную возможность!"
2201-42 = "...Надеюсь только, что всё это не окажется слишком хлопотным."
2201-43 = "Поспешим на презентацию! Нельзя опаздывать!"
2201-46 = "Ого, сколько людей."
2201-47 = "Все они тоже пришли на бизнес-презентацию?"
2201-48 = "Вот тебе и «редкая» возможность..."
2201-49 = "Говорят, собравшиеся здесь бизнесмены — лучшие в своих областях... Невероятно успешные предприниматели!"
2201-50 = "Если заведём полезные знакомства и заявим о себе, это точно окупится."
2201-51 = "А если ещё и найдём инвесторов, «Решатель проблем» сможет вырасти ещё сильнее."
2201-52 = "Смотрите, кто-то вышел к трибуне..."
2201-53 = ""
2201-55 = ""
2201-56 = "Прежде всего я хотел бы поблагодарить всех генеральных директоров, посетивших сегодня нашу бизнес-презентацию."
2201-57 = "Такие возможности выпадают не каждый день."
2201-58 = "Могу без колебаний заявить вам..."
2201-59 = "...вы — избранные!"
2201-60 = "Хм... Вот как?"
2201-61 = "Серьёзно?"
2201-62 = "О! Я так и знала! Знала, что это особая возможность!"
2201-64 = "А теперь позвольте представить..."
2201-65 = "...наше новейшее и величайшее достижение!"
2201-66 = "Это..."
2201-67 = "(Та-дам!)"
2201-68 = "Экологичная кашемировая батарея «Эко-Прайд»!"
2201-70 = "Эко..."
2201-71 = "Кашемировая...?"
2201-72 = "...Батарея?"
2201-73 = "...?"
2201-75 = "Обратите внимание: это вовсе не обычная батарея!"
2201-76 = "Созданная из натуральных материалов, добытых самыми эффективными методами с применением ИИ глубокого обучения..."
2201-77 = "...она стала потрясающим достижением: продукт эффективнее любой другой батареи в мире, да ещё и изготовлен из экологичных материалов!"
2201-78 = "О, Ару, по-моему, это..."
2201-79 = ""
2201-80 = "..."
2201-81 = "Нет, погодите! Давайте послушаем ещё немного!"
2201-82 = ""
2201-83 = "Самый успешный бизнесмен из всех моих знакомых лично меня заверил!"
2201-84 = "Кроме того, наше предложение не ограничивается одним этим товаром!"
2201-85 = "Мы хотим максимально увеличить вашу прибыль при помощи проверенной маркетинговой системы..."
2201-86 = "...и бизнес-стратегии, полностью учитывающей хеджирование рисков..."
2201-87 = "*делает записи* Система... Хеджирование рисков..."
2201-88 = "..."
2201-89 = "Мы заложили основу, позволяющую гибко реагировать на любую ситуацию, тщательно отслеживая экономическую кривую Кивотоса и её крупные колебания..."
2201-90 = "Кривая... Кивотоса?"
2201-91 = "*трясётся*"
2201-92 = "Хм..."
2201-93 = "*в шоке*"
2201-95 = "Итак, с объяснениями закончили..."
2201-96 = "Теперь поговорим о том, как вы можете инвестировать в наш бизнес."
2201-97 = "Всё очень просто. Вам нужно лишь приобрести членскую карту, чтобы присоединиться к нашей системе."
2201-98 = "Да, вы можете стать частью системы, просто купив членскую карту!"
2201-100 = "Вот, если вы приобретёте эту членскую карту за пять миллионов иен, вас немедленно повысят до ранга Сефирот!"
2201-101 = "А счастливые покупатели сразу получат бонус — сотню ангелов!"
2201-102 = "Уф! Это же смесь секты и финансовой пирамиды!"
2201-103 = "Ха-ха! Ну всё, Ару, теперь уже не отвертишься!"
2201-104 = "Ты сама признала, что этот бизнес — финансовая пирамида!"
2201-105 = "*вздыхает* ...Босс. Тот бизнесмен, о котором ты говорила..."
2201-106 = "...Знаю! Не хочу об этом говорить!"
2201-107 = "Эм, хочешь, я избавлюсь от этого твоего знакомого?"
2201-108 = "*грустно смотрит*"
2201-109 = "А я всё думала, что за бизнес-презентацию могут проводить рядом с Тринити."
2201-110 = "Они специально выбрали девушек, которые совсем не знают жизни!"
2201-111 = "Ха-ха! Не могу поверить, что тебя так провели! *хихикает*"
2201-112 = "Я ведь правда им доверяла... Мне сказали, что это информация высшего уровня, предназначенная только для меня..."
2201-113 = "Как они посмели воспользоваться моим доверием?!"
2201-115 = "Простите? Что за шум?"
2201-116 = "Мы всего лишь делимся надёжным бизнес-планом с теми, кто способен мыслить открыто..."
2201-117 = "Стойте!"
2201-118 = "Как вы смеете тратить моё драгоценное время..."
2201-119 = "Что? О чём вы, уважаемый клиент? Это крайне редкая возможность!"
2201-120 = "Хватайте её и воплотите свои мечты..."
2201-121 = ""
2201-122 = ""
2201-123 = "*протягивает руку*"
2201-124 = "А? Я не имел в виду буквально хватать меня за плечо!"
2201-125 = "Харука."
2201-126 = ""
2201-128 = "Да!"
2201-129 = "Разберись."
2201-130 = ""
2201-131 = "Хе-хе-хе!"
2201-132 = "Поняла, босс! Всё что скажешь, Ару!"
2201-134 = "А-а?! Что вы делаете?!"
2201-135 = "Как вы смеете тратить драгоценное время Ару?! Проваливайте отсюда все!"
2201-136 = "...Как вы посмели пытаться нажиться на «Решателе проблем»! Я этого не позволю!"
2201-137 = "Если бы мы повелись на их тупую схему, могли бы потерять все деньги!"
2201-138 = "Вы почти провернули это — благодаря Ару."
2201-139 = "А-а-а! С меня хватит! Муцуки! Каёко!"
2201-140 = ""
2201-141 = "Хм... Ну, мне всё равно было весело. Ладно, начинаем!"
2201-142 = "*вздыхает* Похоже, выбора нет."
2201-143 = ""
2201-144 = "Все! Взять их!"
2201-153 = "Комитет справедливости прибыл!"
2201-154 = "Нам сообщили, что здесь проводится незаконная бизнес-презентация!"
2201-155 = "И вот я здесь!"
2201-156 = "...Ч-Что? Что здесь вообще произошло?"
2201-157 = "Хм, Хасуми... Здесь никого нет!"
2201-160 = ""
2201-161 = "Не ожидала, что вмешается Комитет справедливости Тринити!"
2201-162 = "Они могут быть такими же назойливыми, как Префектурная команда. Не связывайтесь с ними."
2201-163 = "Ну, если удалось выбесить главу префектов, я уже довольна."
2201-164 = "П-Просто скажите, что делать! Я со всем разберусь...!"
2201-167 = "А-а! Ненавижу, когда всё усложняется!"
2201-168 = "Угх..."
2201-169 = "На сегодня закончили, но запомните мои слова... такого больше никогда не повторится!"
2201-170 = "Больше никогда не поверю туманным деловым советам какого-то случайного знакомого!"
2201-171 = "Я сама возьму всё в свои руки и сделаю свой бизнес успешным!"
2201-172 = "А-ха-ха! Вот это наша Ару!"
2201-173 = "*вздыхает* ...Я знала, что всё закончится чем-то таким."
2201-174 = "Все... Отступаем!"
2201-177 = ""
2201-178 = "Д-Да!"
2201-180 = "Едва избежав Комитета справедливости, «Решатель проблем» понёсся по ночным улицам района Тринити."
2201-181 = "Сомнительный бизнес-план"
