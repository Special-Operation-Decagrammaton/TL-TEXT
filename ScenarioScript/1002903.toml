[translation]
1002903-1 = "Сегодняшняя лекция: Объятия"
1002903-3 = "Вскоре после сообщения Нацу лично пришла в Шале искать меня."
1002903-4 = "Похоже, разговор мог затянуться, поэтому я отвёл её в лаунж."
1002903-5 = ""
1002903-11 = ""
1002903-12 = "М-м. Здесь приятно. Такое уютное место."
1002903-13 = "Может, сделаем это нашей клубной комнатой и поселимся здесь."
1002903-14 = "Хаха, шучу. Слишком много мороки."
1002903-15 = "Я пришла сегодня, потому что надеялась, что вы поможете мне разобраться с одной грустной вещью, которую я случайно услышала."
1002903-16 = "Хм? Что за сумка у меня в руке?"
1002903-17 = "Хаха, ну. Всё как в прошлый раз."
1002903-18 = ""
1002903-20 = ""
1002903-21 = "Это учебные материалы на сегодня! Вообще-то, это только половина."
1002903-22 = "А?"
1002903-23 = "Хотите убедиться, что всё в порядке? Переживаете из-за того, что я написала вам в MomoTalk?"
1002903-24 = "Простите. Но со мной правда всё хорошо! Как я и сказала, со мной ничего особенного не случилось."
1002903-25 = "Когда утром я смотрела новости, меня вдруг захватила мысль, что однажды нечто подобное может произойти."
1002903-26 = "Бесчисленные истории о людях, которые ссорятся, не понимают и отвергают друг друга... и о трагедиях, что следуют за этим."
1002903-27 = "То, чего уже никогда не поймёшь. Печаль от утраченного."
1002903-28 = "Они почти как фанатики десертов, которые считают собственные вкусы абсолютной истиной и отказываются признавать всё остальное."
1002903-29 = "Это прозвучало немного внезапно, но мне хотелось выговориться."
1002903-30 = "Вы единственный, кому я могу по-настоящему довериться, Сенсей."
1002903-31 = "Как ни странно, я постоянно сталкиваюсь с маленькими конфликтами вроде этого."
1002903-32 = "Каким должен быть вкус мятного шоколада или почему эспрессо — настоящий кофе, а американо — зло..."
1002903-33 = ""
1002903-35 = ""
1002903-36 = "В итоге разговор всё-таки затянулся."
1002903-37 = "Наверное, быстрее будет просто показать, что я имею в виду."
1002903-38 = ""
1002903-40 = ""
1002903-46 = "Нацу включила кофемашину в углу лаунжа и приготовила чашку кофе."
1002903-50 = ""
1002903-51 = ""
1002903-52 = "Вы любите эспрессо, Сенсей?"
1002903-53 = "[s1] «Очень люблю. Пью его во время работы.»\n[s2] «Горькие вкусы мне не особо нравятся.»"
1002903-54 = "Хаха. Вот как?"
1002903-55 = "Тогда как насчёт этого? Вообще-то, это моё любимое."
1002903-56 = "Хаха. Вот как?"
1002903-57 = "Тогда, думаю, это понравится вам больше. Мы довольно похожи!"
1002903-58 = "Это нечто с совершенно другим вкусом, чем то, что я принесла."
1002903-59 = ""
1002903-61 = ""
1002903-62 = ""
1002903-63 = "Нацу порылась в принесённой сумке и достала белое ванильное мороженое."
1002903-64 = "Вот оно — воплощение простой сладости."
1002903-65 = "Ванильное мороженое! Та-дам!"
1002903-66 = "Как бы я ни выглядела, я всё ещё школьница."
1002903-67 = "Эта холодная сладость, которая тает во рту... и совсем не липнет к чашке, позволяя насладиться каждой последней ложкой!"
1002903-68 = "Это лучший ингредиент для десертов на свете! Да и само по себе это полноценный десерт! Разве не потрясающе?"
1002903-69 = "Однако, Сенсей..."
1002903-70 = "Эспрессо. Ванильное мороженое. Знаете ли вы, что те, кто признаёт лишь одно из них, упускают величайшее удовольствие жизни?"
1002903-71 = "[s3] «Величайшее удовольствие жизни?»\n[s4] «И что же это?»"
1002903-72 = "Некоторые вещи в жизни нужно испытать самому. Я покажу."
1002903-73 = "Некоторые вещи в жизни нужно испытать самому. Я покажу."
1002903-74 = ""
1002903-76 = ""
1002903-77 = ""
1002903-79 = "Нацу положила немного ванильного мороженого в чашку и начала поливать его приготовленным эспрессо."
1002903-80 = "Когда горячий кофе полился сверху и начал растапливать ванильное мороженое, родилось нечто новое."
1002903-81 = "Аффогато."
1002903-82 = "Это слияние ванили — воплощения сладости — и эспрессо — воплощения горечи."
1002903-83 = "Среди бесчисленных тысяч существующих десертов этот считается одним из высших."
1002903-84 = "Посмотрите, как великолепно это выглядит. Настоящая гармония, которую могут принять и любители сладкого, и любители горького."
1002903-85 = "Такого нового вкуса никогда не достигнут те, кто закрыт для чужого мнения."
1002903-86 = "Это поистине идеально."
1002903-87 = "Если бы все были чуть более открытыми..."
1002903-88 = "не было бы причин ни ссориться, ни стыдить друг друга."
1002903-89 = "..."
1002903-90 = "[s5] «Ты очень добрая, Нацу.»\n[s6] «Сочувствие к другим — тоже часть открытого мышления.»"
1002903-91 = "Эм. Ну..."
1002903-92 = "Эм. Ну..."
1002903-93 = "Хм..."
1002903-94 = ""
1002903-96 = ""
1002903-97 = "Хахаха. Я пришла не за тем, чтобы услышать такое."
1002903-98 = "Просто... люди обычно говорят мне только о том, какая я странная или непредсказуемая."
1002903-99 = "Конечно, я доверяюсь вам именно потому, что вы другой."
1002903-100 = "Но я не ожидала, что вы скажете что-то подобное. Мне немного неловко."
1002903-101 = "Теперь, когда я подумала, похоже, сегодняшний урок был не так уж нужен. Вы, кажется, знаете о сегодняшней теме гораздо больше меня."
1002903-102 = "Хахаха."
1002903-103 = "Что ж, раз мы дошли до конца плана урока, давайте закончим на этом и..."
1002903-104 = ""
1002903-106 = ""
1002903-107 = ""
1002903-109 = "...съедим это аффогато вместе. Как вам?"
1002903-111 = "(После этого я приготовил ещё одну порцию аффогато, и мы с Нацу съели его вместе.)"
1002903-112 = "(Когда Нацу уходила, выражение её лица было заметно светлее и веселее, чем когда она пришла.)"
