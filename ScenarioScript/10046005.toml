[translation]
10046005-160 = "#video;10046"
10046005-1 = "Пролог;Вот незадача"
10046005-15 = ""
10046005-16 = ""
10046005-18 = ""
10046005-21 = "[log]В предыдущих сериях Blue Archive...[/log]"
10046005-24 = ""
10046005-25 = "Это простая задача по доставке. Нужно забрать и доставить Чаепитию чрезвычайно важную сумку. Сегодня."
10046005-26 = "Единственная настоящая проблема — место получения немного дальше, чем ожидалось..."
10046005-27 = ""
10046005-29 = ""
10046005-32 = "Вахаха!"
10046005-33 = ""
10046005-36 = ""
10046005-37 = "Что вы делаете так далеко в этой глуши?"
10046005-38 = "Кинугава Касуми...?"
10046005-39 = ""
10046005-41 = ""
10046005-42 = "Известная преступница в розыске из академии Геенна, Кинугава Касуми?"
10046005-45 = "Каким-то образом чемодан оказался в руках Кинугавы Касуми, главы Кружка горячих источников."
10046005-48 = ""
10046005-49 = "На что я вообще смотрю?! Что это за компания такая?"
10046005-50 = "Почему Отряд справедливости Тринити находится в поезде, который едет в Геенну?"
10046005-51 = "И... Касуми?"
10046005-52 = "Касуми, Сенсей?! Клянусь, если выяснится, что вы всё это время водились с ней..."
10046005-55 = "Мы неожиданно встретили Иори в поезде. А потом..."
10046005-58 = ""
10046005-59 = "Девушка из Тринити и Сенсей вынуждены меня слушать. Правда ведь, Милашка?"
10046005-60 = "Ты правда зациклилась совсем не на том. Я затаив дыхание жду её решения. Через пару мгновений она застрелит тебя ради этой чайной чашки...? Ночного горшка? Короче, этой штуки."
10046005-61 = "Ведь так? Наша подруга из Отряда справедливости... Как тебя там звали?"
10046005-62 = "...Ника?"
10046005-63 = "В общем, тебе ведь нужно, чтобы это осталось целым, да?"
10046005-64 = ""
10046005-66 = ""
10046005-68 = ""
10046005-69 = "..."
10046005-70 = "Хватит уже про эту сумку! Чайник то! Сумка это! Серьёзно!!"
10046005-71 = "..."
10046005-72 = "Да кому вообще сдалась эта дурацкая сумка?!"
10046005-73 = ""
10046005-77 = ""
10046005-79 = ""
10046005-81 = ""
10046005-82 = "...Ого!"
10046005-83 = "...Ха-ха..."
10046005-84 = "ВАХАХАХА!"
10046005-85 = "Я пыталась тебя предупредить! Пыталась, а ты мне не поверила!"
10046005-86 = "Не то что моя очаровательная и послушная Милашка. Пока я не отдам эту сумку..."
10046005-87 = "Она ничего не сможет—"
10046005-88 = ""
10046005-93 = ""
10046005-95 = "Кья-а-а...?!"
10046005-96 = ""
10046005-98 = ""
10046005-101 = ""
10046005-102 = "...А."
10046005-103 = "...Я в неё выстрелила."
10046005-105 = "И вот так наша небольшая поездка на поезде в Геенну закончилась катастрофой."
10046005-106 = ""
10046005-112 = ""
10046005-113 = "Ой-ой. Так вот кого привёл Сенсей! Свою маленькую подружку!"
10046005-114 = "Кто бы мог подумать, что САМА Ичика явится лично? И такая прелестная!"
10046005-115 = "..."
10046005-116 = "Хм, так зачем ты здесь, Милашка? Захотела немного «личного» времени?"
10046005-117 = "Неужели ты присоединилась к заданию ради меня бедной... Какое такое «важное» дело у тебя намечено? М-м?"
10046005-118 = "..."
10046005-119 = "...омогите."
10046005-120 = ""
10046005-122 = ""
10046005-123 = "Хм?"
10046005-124 = ""
10046005-126 = ""
10046005-127 = "Помогите нам. Пожалуйста, помоги хотя бы в этот раз. Я прошу тебя."
10046005-128 = ""
10046005-130 = ""
10046005-132 = ""
10046005-133 = "О?"
10046005-134 = "Ха, хаха! ...Вахаха!"
10046005-135 = "Ой-ой! Что же могло заставить мою дорогую Ичику произнести такие милые слова?"
10046005-136 = "Конечно, я помогу. Даже просить не нужно. Мы ведь друзья, правда?"
10046005-137 = "..."
10046005-138 = "Но сперва — Сенсей, разве вы не гордитесь нашей Милашкой? В поезде она по-настоящему взяла всё в свои руки."
10046005-139 = "Однако должна предупредить: я всего лишь невинная мирная гражданка. Мои возможности ограничены!"
10046005-140 = "...То, что тогда произошло..."
10046005-141 = "...было моей виной."
10046005-142 = "Пожалуйста, прости меня."
10046005-143 = "...А-а. Понятно. Значит, вот чему ты научилась?"
10046005-144 = "Помнишь, что я говорила в прошлый раз? Мы с тобой так похожи."
10046005-145 = ""
10046005-147 = ""
10046005-148 = "...А я не забываю даже самой мелкой обиды."
10046005-149 = "Так почему ты меня не ненавидишь? Что изменилось?"
10046005-150 = "..."
10046005-151 = "О? Ты только посмотри. У меня аж мурашки! Всё как прежде. Эта бурлящая, кипящая ненависть!"
10046005-152 = "..."
10046005-153 = "И всё же ты продолжаешь стоять передо мной на коленях. Так зачем именно ты пришла?"
10046005-154 = ""
10046005-156 = ""
10046005-157 = "Выкладывай каждую... малейшую... деталь."