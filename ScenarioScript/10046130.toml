[translation]
10046130-2 = ""
10046130-3 = ""
10046130-4 = "Ты в порядке, Ичика? Разговариваешь сама с собой."
10046130-5 = "О, Хасуми... Хаха, неловко вышло."
10046130-6 = "Но как же я рада, что ты здесь!"
10046130-7 = "Да, я пришла помочь."
10046130-8 = "Прошу прощения."
10046130-9 = "Нет. Ты хорошо справилась. Никто не мог предвидеть, что ситуация так быстро выйдет из-под контроля."
10046130-10 = "Ситуация...?"
10046130-11 = "Да, мы ожидали, что соберётся несколько головорезов из разных районов..."
10046130-12 = "А теперь, когда замешана прибыль, всё становится жестоким."
10046130-13 = "На пляже замечено несколько враждебных групп. Мы пришли к выводу, что одному нормальному человеку с этим не справиться."
10046130-14 = "...О."
10046130-15 = "Конечно, Цуруги, возможно, и смогла бы всё исправить, но... мы стараемся не создавать ЕЩЁ больше проблем."
10046130-17 = "Хаха... Представляю. Нас ждёт непростая задача."
10046130-18 = "Хи-хи. Мы давно знакомы. Не думаю, что это нас сломает."
10046130-19 = "Так что, если ты не против..."
10046130-20 = "Против чего?"
10046130-21 = "Позволь мне взять твою смену. Тебе нужно отдохнуть."
10046130-22 = "Хотя и этого всё равно слишком много для одного человека. После перерыва, пожалуйста, присоединись ко мне."
10046130-23 = "Да! Конечно!"
10046130-24 = "Хи-хи. Как всегда, надёжная."
10046130-25 = "А теперь вернём себе пляж."
