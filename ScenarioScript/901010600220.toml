[translation]
901010600220-6 = ""
901010600220-7 = "FOX 3, приём?"
901010600220-8 = ""
901010600220-10 = ""
901010600220-11 = "Говорит FOX 3. Нахожусь в режиме ожидания в точке Сьерра."
901010600220-12 = "Что вам нужно?"
901010600220-13 = "Сможешь проникнуть в систему управления транспортом академии Хайлендер? Мне нужны данные о посадках."
901010600220-14 = "Напрямую взломать базу академии Хайлендер, наверное, не смогу... Но данные об оплате проезда передаются Транспортному управлению Генерального студенческого совета. Проверю там."
901010600220-15 = "Что именно ищешь?"
901010600220-16 = "Миягучи. Хочу узнать, садился ли он на рабочий поезд из порта Канэсаки в день исчезновения."
901010600220-17 = "И на всякий случай проверь дни до и после его исчезновения."
901010600220-18 = "Поняла."
901010600220-19 = "Мне понадобится время, чтобы вскрыть сервер... Думаю, к нашему возвращению в штаб будет точный ответ."
901010600220-20 = "Ага. Оставляю это тебе."
