[translation]
1005603-1 = "Подарок от всего сердца"
1005603-6 = "Это был снежный день."
1005603-7 = ""
1005603-10 = "Исполнительный офис Шале"
1005603-14 = "Я закончила работу и уже собиралась отдохнуть, когда мне показалось, что я увидела кого-то знакомого."
1005603-15 = ""
1005603-18 = "[s] «Серина?»"
1005603-19 = "*шуршание* *шуршание*"
1005603-20 = ""
1005603-24 = "[ns] «Серина...?»"
1005603-25 = "С-Серины здесь нет!"
1005603-26 = ""
1005603-29 = "[ns1] «Понятно. Здесь нет никакой Серины.» \n[ns2] «Тогда что Серина здесь делает?»"
1005603-32 = ""
1005603-39 = ""
1005603-40 = "Угх..."
1005603-41 = "Не дразните меня, Сенсей!"
1005603-42 = "[s] «Прости, прости.»"
1005603-43 = "Знаете, мне потребовалось немало смелости, чтобы прийти сюда..."
1005603-44 = "Мне всегда можно приходить? Я знаю... но в этот раз всё иначе."
1005603-45 = "Я... простите, что так и не отблагодарила вас за тот шарф."
1005603-46 = "[s] «Это был подарок. Не нужно отплачивать мне.»"
1005603-47 = "В-Вы не понимаете! Для меня это было очень важно."
1005603-48 = "Даже если это подарок... я не могу просто принять его и ничего не сделать..."
1005603-49 = "Поэтому, пожалуйста, позвольте мне вас отблагодарить!"
1005603-50 = "Я не смог отказать Серине и в итоге согласился."
1005603-53 = "Ля-ля-ля-ля!"
1005603-54 = "Вот подарок, который я приготовила в благодарность!"
1005603-55 = "[s] «Ты приготовила мне подарок?»"
1005603-56 = "Это комплексный оздоровительный набор Рыцарей скорой помощи!"
1005603-57 = "Аптечка, влажные салфетки, охлаждающие пластыри и пищевые добавки!"
1005603-58 = "Это особая версия, сделанная специально для вас, чтобы никакая медицинская чрезвычайная ситуация не застала вас врасплох."
1005603-59 = "[s] «Это... очень серьёзно...»"
1005603-60 = "Конечно! Ваше здоровье — очень серьёзная вещь, Сенсей."
1005603-61 = "Вы совсем о себе не заботитесь."
1005603-62 = "Я не могу быть спокойна, не зная, всё ли у вас хорошо со здоровьем."
1005603-63 = "[s] «Тогда я постараюсь внимательнее следить за собой...»"
1005603-64 = "Да! Спасибо! А теперь, пожалуйста, ложитесь сюда."
1005603-65 = "[s] «Ч-Что...? Зачем?»"
1005603-66 = "Это часть подарка! Последний этап комплексного оздоровительного набора Рыцарей скорой помощи."
1005603-67 = "Ваш набор будет неполным без особого точечного массажа от Серины."
1005603-68 = "Хорошо, пожалуйста, ложитесь. Рубашку можете снять."
1005603-69 = "Скорее! Мы упускаем подходящее время для процедуры!"
1005603-70 = "У всех лекарств и процедур есть идеальный момент, когда их нужно применять."
1005603-71 = "Я никогда не мог отказать Серине, поэтому лёг на живот на диван."
1005603-73 = "Хорошо, начинаю точечный массаж."
1005603-74 = ""
1005603-81 = "Как ощущения здесь?"
1005603-82 = "Сенсей, ваша спина ужасно напряжена, столько зажимов. Если целый день сидите за столом, нужно обязательно растягиваться."
1005603-83 = ""
1005603-88 = "Больно? Это лишь значит, что массаж работает. Пожалуйста, потерпите ещё немного."
1005603-89 = "Знаю, больно, но ведь одновременно и приятно, правда? Боль — всего лишь средство для достижения цели."
1005603-90 = "Хорошо, хорошо! Ещё совсем немного. Я почти закончила, только немного надавлю вот здесь..."
1005603-91 = "Сенсей! Пожалуйста, не ёрзайте так. Не двигайте плечами."
1005603-92 = "Я извивался от боли, пока Серина делала свой особый точечный массаж..."
1005603-93 = "Похоже, Серина получала от этого чуть слишком много удовольствия."
1005603-95 = "Ну как вы себя чувствуете, Сенсей? Стало немного лучше?"
1005603-96 = "[s] «Вообще-то да. Спине стало намного лучше.»"
1005603-97 = "Замечательно! В следующий раз, когда снова почувствуете скованность, можете позвать меня."
1005603-98 = "Обещайте, что так и сделаете, хорошо?"
1005603-99 = "[s] «Мне неловко, что всю работу сделала ты. Теперь я должен отплатить тебе.»"
1005603-100 = "Отплатите мне тем, что будете отдыхать и заботиться о своём теле."
1005603-101 = "Ваши проблемы — мои проблемы, Сенсей."
