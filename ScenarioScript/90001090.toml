[translation]
90001090-1 = "Эпизод 9;Тактическая победа"
90001090-2 = "[ns] «Мы сделали это!»"
90001090-3 = ""
90001090-5 = ""
90001090-6 = "Что с активностью вулкана?"
90001090-7 = ""
90001090-9 = ""
90001090-10 = "Магнитуда землетрясений значительно снизилась. Поток лавы практически отсутствует."
90001090-11 = "Вулкан начинает стабилизироваться. Но это наименьшая из наших проблем. Что с Хокмой?"
90001090-12 = ""
90001090-14 = ""
90001090-15 = "Н-Не может быть...! Пусть Хокма ещё не была завершена, не могу поверить, что она проиграла...!"
90001090-16 = "Подождите. Что это? Мы выполнили квоту ресурсов?"
90001090-17 = "Вот как всё было. Она поставила защиту доставки ресурсов выше уничтожения переменных."
90001090-18 = ""
90001090-20 = ""
90001090-21 = "Если это был её план, могла бы и сказать!"
90001090-22 = "Н-Наша малышка Хокма стеснительная. Хех. Хех-хех."
90001090-23 = "Тогда пусть Хокма отступает. С точки зрения стратегии мы уже победили."
90001090-24 = ""
90001090-26 = ""
90001090-29 = "[ns] «Хокма...»"
90001090-30 = "Да. Она отступает. В сторону Ледникового моря."
90001090-31 = "Как бы то ни было... Как это сказать? Кто бы мог подумать, что у неё есть вторая форма..."
90001090-32 = "Да. Те гигантские ямы, которые мы видели, и правда были следами чудовища."
90001090-33 = "[s] «Точно! Гигантское трансформирующееся чудовище!!»"
90001090-34 = "Сенсей... вы сейчас как-то подозрительно воодушевлены."
90001090-35 = "[s1] «Ну это же гигантское! Трансформирующееся! Чудовище!»\n[s2] «Кто бы от такого не пришёл в восторг?!»"
90001090-38 = ""
90001090-40 = ""
90001090-41 = ""
90001090-42 = "Хи-хи-хи. У одного из них всё-таки хороший вкус! Хотя то, что это странный учитель... неприятно. Проблематично."
90001090-43 = "Хе-хе-хе. Я просто рада, что хоть кто-то понимает, насколько великолепна наша малышка Хокма."
90001090-44 = "Эй-эй. Почему мы вдруг хвалим врагов?"
90001090-46 = "Ладно. Рада за вас. Но мы всё-таки победили эту робо-штуку."
90001090-48 = ""
90001090-50 = ""
90001090-51 = "Уф! Ладно, как хотите! Можете убеждать себя в этом! Но мы-то знаем правду: это мы отступили ради вас! А не наоборот!"
90001090-52 = "*всхлипывает*"
90001090-53 = "Н-Не расстраивайся, Эйн! Всё нормально! Ты хорошо справилась!"
90001090-54 = "Не будем будить спящих собак. Это чувство якобы «победы»... Наслаждайтесь им сполна. Смакуйте, пока можете."
90001090-55 = "Запомните мои слова. Тактическая победа ещё не означает стратегического триумфа."
90001090-56 = ""
90001090-58 = ""
90001090-59 = ""
90001090-61 = "[ns] «Они ушли...»"
90001090-62 = "Вы выглядите разочарованным, Сенсей."
90001090-63 = "Естественно, я тоже надеялась ещё поговорить с этими детьми."
90001090-64 = "Возможно, удалось бы узнать больше — хотя бы крошечную крупицу зацепки."
90001090-65 = "[s3] «Ты права, сейчас у нас почти нет зацепок.»\n[s4] «Я хотел ещё поговорить о трансформирующемся чудовище...»"
90001090-66 = "Да. Верно. Иногда с врагом приходится общаться."
90001090-67 = "Если бы мы смогли унять их враждебность, они, естественно, стали бы самым прямым источником информации."
90001090-68 = "Да, жаль и всё такое, но мы что-нибудь придумаем, верно?"
90001090-69 = "По крайней мере, самый большой пожар мы потушили. Кстати о пожаре — мне жарко. Я ухожу. До свидания."
90001090-70 = "Хорошо..."
90001090-71 = "Э-Это была твоя главная забота?"
90001090-72 = "Я трансформирующаяся боевая горничная, Сенсей."
90001090-73 = "Вам разрешается любить трансформирующихся монстров. Но часть этой любви и внимания следует уделять и мне."
90001090-74 = "(Почему-то... Токи кажется немного... другой?)"
90001090-75 = ""
90001090-77 = ""
90001090-78 = ""
90001090-79 = "Пока вернёмся. Нам самим нужно залечить раны."
90001090-80 = "Согласна. Нам нужно время перевести дух и провести обслуживание."
90001090-81 = "Да. Как и в случае с Гебурой, я не могу уверенно утверждать, что Хокма полностью выведена из строя. А череда боёв израсходовала значительную часть наших ресурсов."
90001090-82 = "Однако при необходимости я могу продолжить. Ведь я идеальная горничная."
90001090-83 = ""
90001090-85 = ""
90001090-86 = ""
90001090-87 = "Отрицательно. Стой, Токи. Даже тебе нужен отдых. Немедленно отключи Аби-Эшух."
90001090-88 = ""
90001090-90 = ""
90001090-94 = ""
90001090-95 = "...Поняла, госпожа Рио."
90001090-98 = "Хорошая работа, все."
90001090-99 = "Пожалуй, я выживу. Но можно сильнее включить кондиционер, президент?"
90001090-100 = "Пощади меня, Эйми. Здесь уже становится холодно..."
90001090-101 = "Твоя жёлтая куртка рассчитана на холод. Можешь надеть её."
90001090-102 = "Ты предлагаешь мне надеть куртку только ради того, чтобы самой включить кондиционер на максимум? Это чудовищная трата энергии. Куда делась твоя любимая «эффективность»?"
90001090-103 = "Вы ошибаетесь, президент. В данном случае неэффективность — это когда ваш оператор не может раскрыть сто процентов своего потенциала из-за неподходящей температуры."
90001090-104 = "Энергию можно пополнить. Машины можно обслужить и даже заменить. Человеческое тело — нет."
90001090-106 = "Мы покинем этот вулканический район на полной скорости. А после вы двое найдёте компромисс."
90001090-107 = "[s] «Отличное решение, Токи. Молодец.»"
90001090-108 = "Пустяки. Мир-мир."
90001090-109 = "М-Мир...?!"
90001090-110 = "Да. Я научилась этому у самой президента Химари."
90001090-111 = "Именно! Посмотри, как выросла и изменилась твоя Токи!"
90001090-112 = "Это, то, вообще всё, что ты видишь собственными глазами! Всё благодаря этому наставнику Миллениум — сверхгениальной, нежной и шикарной красавице."
90001090-113 = "Что будете с этим делать, госпожа Рио? У президента опять раздулась голова."
90001090-115 = "Н-Нет. Я..."
90001090-116 = "[s5] «Перевод: Химари рада, что увиделась с тобой.»\n[s6] «Спасибо тебе за всё, что ты сделала.»"
90001090-119 = "Откуда ты вообще это взял? Такая мысль ни разу не приходила мне в голову за всю жизнь."
90001090-120 = "...Пожалуй, я не могу отрицать, что твоё присутствие оказалось полезно для этого задания во многих смыслах."
90001090-121 = "Спасибо, Рио. Ты нас спасла."
90001090-122 = "...Да."
90001090-125 = ""
90001090-126 = "Мы над районом тундры. Воздушный поток стабилен, но прошу оставаться настороже на случай чрезвычайной ситуации."
90001090-127 = "Похоже, от оставшихся сил и объектов Декаграмматона... ничего не осталось."
90001090-128 = "Кстати. Я собрала образцы и того, и другого."
90001090-129 = "...Когда вы успели, президент? Собираетесь добавить «белку» к своему длинному списку титулов?"
90001090-130 = "Ох. Белка звучит мило."
90001090-131 = "...Кажется, это редкий случай, когда я случайно её подбодрила. Прошу прощения, Сенсей."
90001090-132 = "[s] «Если я соглашусь, получится, что я согласен с тем, что Химари... ну...»"
90001090-133 = "Мне не удаётся понять это взаимодействие. Однако похоже, мы считаем, что Эйми сделала что-то не так. Я соглашусь."
90001090-134 = "(Немного неловко, так что, думаю, лучше не вмешиваться...)"
90001090-135 = ""
90001090-138 = ""
90001090-139 = ""
90001090-140 = "[ns] «В-В любом случае, что ты имела в виду под образцами?»"
90001090-141 = "Именно то, что сказала. Хокма, объекты добычи ресурсов и, похоже, силы Декаграмматона, которые их защищали..."
90001090-142 = "Всё это достойно анализа."
90001090-143 = "Особенно подозрительно, что они поддерживали силы и объекты такого масштаба без Хеседа, их оружейного завода."
90001090-144 = "Нужно посадить вертолёт, чтобы начать анализ."
90001090-145 = "Поняла. Давайте сделаем это где-нибудь очень прохладном."
90001090-146 = "Место, прохладное для Эйми... может оказаться пыткой для меня..."
90001090-147 = "Возможно, но мы также беспокоимся о перегреве двигателя вертолёта."
90001090-148 = "...Ничего не поделаешь. В этот раз уступлю."
90001090-149 = ""
90001090-151 = ""
90001090-152 = ""
90001090-153 = "Не обязательно сразу начинать дуться, президент..."
90001090-155 = "Следующий эпизод;Наследие Безымянных богов"
