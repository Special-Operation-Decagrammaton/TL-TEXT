[translation]
1601103-1 = "Лимоны в мёду"
1601103-2 = "Хасуми ждала в кулинарной комнате."
1601103-3 = ""
1601103-6 = "Спасибо, что пришли, Сенсей. Сюда."
1601103-7 = ""
1601103-12 = ""
1601103-13 = "[ns1] «...Хасуми? Твоя спортивная куртка...»\n[ns2] «Тебе... нравится носить её так?»"
1601103-16 = "А? Ты это о чём?"
1601103-17 = "Вы... просто разговаривали сами с собой?"
1601103-18 = "О... Понятно."
1601103-19 = "Хм? Это?"
1601103-20 = ""
1601103-22 = ""
1601103-23 = "Просто лимоны в мёду. Ничего особенного. Хотя именно из-за них вы здесь..."
1601103-24 = "Я готовила их для членов Отряда правосудия. Подумала, что вам тоже понравится баночка."
1601103-25 = "И не нужно из вежливости отказываться. У меня их много."
1601103-26 = "Завтра у вас, скорее всего, не будет времени что-то себе готовить, так что если думаете, что вам понравится..."
1601103-27 = "[s3] «Конечно понравится.»\n[s4] «Спасибо. С удовольствием съем.»"
1601103-30 = "Рада это слышать."
1601103-31 = "Спасибо, что приняли. Я положу немного в этот контейнер..."
1601103-32 = ""
1601103-34 = ""
1601103-35 = ""
1601103-36 = "Что?"
1601103-37 = "Я... как менеджер?"
1601103-38 = "А. Понятно."
1601103-39 = "Хм. Полагаю, я действительно создаю такое впечатление..."
1601103-40 = ""
1601103-42 = ""
1601103-43 = "..."
1601103-44 = "[s5] «...Хасуми?»\n[s6] «(Кажется, я где-то серьёзно ошибся.)»"
1601103-47 = "Так... вот как..."
1601103-48 = ""
1601103-50 = ""
1601103-51 = "Я правда так выгляжу? Вы так думаете?"
1601103-52 = "Вы хотите сказать, что я больше похожа на надзирателя, чем на студента...?"
1601103-53 = "Или... вы думаете, я похожа на родителя?!"
1601103-54 = "[s7] «Х-Хасуми, пожалуйста, успокойся...!»\n[s8] «Я-я вовсе не это имел в виду!»"
1601103-57 = "О. Вы уверены?"
1601103-58 = "Понятно. Тогда простите, что так разволновалась."
1601103-59 = "Хех."
1601103-60 = "Я всё время выставляю себя глупо перед вами. Знаю, не должна, но ничего не могу поделать с этой неловкостью."
1601103-61 = "Хотелось бы, чтобы люди всегда видели только мою лучшую сторону..."
1601103-62 = "*вздыхает*"
1601103-63 = "...Хм?"
1601103-64 = "«Тогда что вы имели в виду, говоря „менеджер“?»"
1601103-65 = "[s9] «Одну из многих твоих лучших сторон.»\n[s10] «Вообще-то я завидую студентам, о которых ты заботишься.»"
1601103-66 = ""
1601103-67 = ""
1601103-69 = ""
1601103-70 = "Я-я сейчас не понимаю, о чём вы... Ничего особенного."
1601103-71 = "К тому же я бы заботилась о вас чаще, если бы вы попросили..."
1601103-72 = "...Ах."
1601103-73 = "Я, эм, ничего такого не имела в виду."
1601103-74 = "Я просто хотела сказать... Эм..."
1601103-75 = "[s11] «Тогда я приму это предложение.»\n[s12] «Я всегда благодарен тебе за всё, Хасуми.»"
1601103-76 = ""
1601103-77 = ""
1601103-79 = ""
1601103-80 = "Сенсей..."
1601103-81 = "Не знаю, как на это ответить..."
1601103-82 = "Обычно сейчас я бы сказала, что вам не стоит говорить такие вещи..."
1601103-83 = "Но почему-то совсем не хочется говорить ничего подобного."
1601103-84 = "Вообще-то я забираю свои прошлые слова обратно. Я буду заботиться о вас, даже если вы не попросите."
1601103-85 = "Буду считать, что вы не против, если время от времени я буду приносить вам что-нибудь подобное."
1601103-86 = "Хи-хи."
1601103-87 = "[s13] «Сейчас в тебе что-то изменилось.»\n[s14] «Это потому, что на тебе куда более повседневная одежда, чем форма?»"
1601103-88 = "Понимаю, почему так может показаться. Хи-хи..."
1601103-89 = "Но нет. Одежда тут ни при чём."
1601103-90 = "Это всё ваша вина."
1601103-91 = "Обязательно запомните это."
1601103-92 = "Спасибо, что всегда заботитесь обо мне..."
1601103-93 = ""
1601103-95 = ""
1601103-96 = ""
1601103-98 = "И за то, что позволяете мне заботиться о вас."
1601103-100 = "После этого я помог Хасуми приготовить оставшиеся лимоны в мёду."
1601103-101 = "Мы сделали достаточно для всего Отряда правосудия, поэтому работы было много, но Хасуми была счастлива каждую минуту."
