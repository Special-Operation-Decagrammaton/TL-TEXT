[translation]
10048080-1 = "Эпизод 8;Обмен правдой"
10048080-2 = "Парк Вайлдханта"
10048080-3 = ""
10048080-4 = ""
10048080-5 = "Благородная воровка...!"
10048080-6 = "Как ты...?!"
10048080-7 = "В хранилище я обнаружила такие изящные ловушки... которых сама не ставила..."
10048080-8 = "А воздух всё время заволакивает дымом необычного состава..."
10048080-9 = "Столько механизмов было размещено в идеальных местах, с тщательным расчётом движений Префектурного совета."
10048080-10 = "...Как я могла не заметить незримую руку сторонней помощи?"
10048080-11 = "Полагаю, я должна вас поблагодарить."
10048080-12 = "Милые мои, вы сделали мою работу НАМНОГО проще."
10048080-13 = "В-вот как...?"
10048080-14 = "Я-я рада, что вы... довольны."
10048080-15 = "(Судя по всему, картина уже у неё...)"
10048080-16 = "Нам лучше п-пойти спать, правда...?"
10048080-17 = "Одну минуту. Нет ничего опаснее услуги, условия которой не были оговорены."
10048080-18 = "Ничто не даётся бесплатно, и ни один поступок не бывает без мотива."
10048080-19 = "Скажите мне, все вы."
10048080-20 = "Почему вы решили мне помочь?"
10048080-21 = "Мы, конечно, большие поклонницы вашей работы! Просто проявили доброту."
10048080-22 = "Спонтанная доброта? Не верю."
10048080-23 = "Врождённое добро, обычная вежливость..."
10048080-24 = "...В моём мире таких вещей не существует."
10048080-25 = "Да ладно. Это уже довольно цинично, тебе не кажется?"
10048080-26 = "Фуфу, хорошая попытка. Меня не отвлечь."
10048080-27 = "Видите ли, даже если бы я поверила в ваши добрые, невинные намерения..."
10048080-28 = "...Это не то же самое, что придержать кому-то дверь. Такое ненормально."
10048080-29 = "Что за люди будут так заботливо расставлять ловушки, чтобы помочь незнакомой воровке?"
10048080-30 = "Так что... потешьте моё любопытство."
10048080-31 = "...Какими были ваши намерения... и какова ваша НАСТОЯЩАЯ цель?"
10048080-32 = ""
10048080-34 = ""
10048080-36 = ""
10048080-37 = "(...Очевидно, правду я ей сказать не могу.)"
10048080-38 = "(Если скажу, что она забрала подделку, вопросов станет ещё больше.)"
10048080-39 = "(...Но что мне делать?)"
10048080-40 = "(Как мне выкрутиться?)"
10048080-42 = "Ох, похоже, ты разучилась говорить."
10048080-43 = ""
10048080-45 = ""
10048080-46 = "Н-Ну, нет, я..."
10048080-47 = "Ничего страшного. Просто немного боязни сцены."
10048080-48 = "Раз ты так нервничаешь, я сама растоплю лёд."
10048080-49 = "Что?"
10048080-50 = ""
10048080-52 = ""
10048080-53 = ""
10048080-54 = ""
10048080-55 = ""
10048080-56 = "...Картина?"
10048080-57 = ""
10048080-61 = "Погоди, почему мой кейс открыт?!"
10048080-62 = "А...! Она вытащила её из моего портфеля!"
10048080-63 = "Когда она... КАК она...?"
10048080-64 = "О нет...!"
10048080-65 = "Ты так крепко держалась за ручку! А нервные взгляды сказали всё остальное!"
10048080-67 = "Вот вы и выдали себя, девочки! Я поняла, что это важно, хотя вы не прошептали ни слова!"
10048080-68 = "А теперь посмотрим, что же в ней ТАКОГО особенного..."
10048080-69 = "(Ах, нет...!)"
10048080-70 = "(Всё кончено...!)"
10048080-72 = ""
10048080-73 = "О...?"
10048080-74 = "Фуфу. Что это за грубая подделка? Учебный проект?"
10048080-75 = ""
10048080-77 = ""
10048080-78 = "...Что?"
10048080-79 = "Мой вопрос прост. Почему у вас была такая дешёвая копия «Любви пурпурного и синего света»?"
10048080-80 = "...Прошу прощения?"
10048080-81 = "(Ч-Ч-Что она несёт?)"
10048080-82 = "(Она думает, что это подделка?)"
10048080-83 = "(Клиентка подсунула мне фальшивку...? Зачем?)"
10048080-84 = "(Не может быть. Зачем? Зачем? Что она с этого получит? Зачем? Это невозможно. Но, но —)"
10048080-85 = "(А-а-а-а-а...?!)"
10048080-86 = ""
10048080-88 = ""
10048080-89 = "(Мы всё это время держали подделку...?)"
10048080-90 = "(...Нет, наверняка Благородная воровка ошибается.)"
10048080-91 = "(В конце концов, она думает, что украла из хранилища НАСТОЯЩУЮ картину...!)"
10048080-92 = "(Хотя на самом деле та, конечно, была подделкой...)"
10048080-93 = "(...Верно, тогда её слова имеют смысл.)"
10048080-94 = "(Воровка украла подделку у Фонда Вероники, но считала её настоящей. Потом она украла нашу и, естественно, решила, что подделка была у НАС.)"
10048080-95 = ""
10048080-96 = ""
10048080-97 = ""
10048080-98 = ""
10048080-99 = ""
10048080-100 = "(...Но, но что, если...?)"
10048080-101 = "(Что, если она права? Она ведь ЭКСПЕРТ...)"
10048080-102 = "(Что, если именно нам подсунули подделку?)"
10048080-103 = "(...А клиентке было всё равно, если мы уничтожим подлинник...?)"
10048080-104 = "(Кто же говорит правду..?)"
10048080-105 = ""
10048080-108 = "[ns] «Здравствуйте, все.»"
10048080-109 = ""
10048080-110 = "Сенсей?! Что вы—"
10048080-111 = "[s] «Я подумал, что вы можете быть здесь.»"
10048080-112 = ""
10048080-114 = ""
10048080-115 = "...Сенсей?"
10048080-116 = "[s] «Как поживаешь, Ак—»"
10048080-117 = ""
10048080-120 = "[ns] «...точнее, Благородная воровка?»"
10048080-121 = "...Вы меня помните, Сенсей."
10048080-122 = "Фу-фу..."
10048080-123 = "Фу, фуфу, фухи, фуфуфуфу..."
10048080-124 = "Э...?"
10048080-125 = "Она меня пугает."
10048080-126 = "С-Сенсей, вы знаете Благородную воровку...?"
10048080-127 = "[s] «Конечно. Она одна из моих студентов.»"
10048080-128 = "Студент..."
10048080-129 = ""
10048080-131 = ""
10048080-132 = "О. Тогда, Сенсей, можно спросить...?"
10048080-133 = "...Она говорит правду?"
10048080-134 = "[s] «Не мне решать, что здесь правда, а что ложь.»"
10048080-135 = ""
10048080-138 = "[ns] «Но, поскольку она мой студент, я верю ей всем сердцем.»"
10048080-139 = "Верите всем сердцем... Ого."
10048080-140 = "У меня тоже есть вопрос, Сенсей."
10048080-141 = "Эти девушки тоже ваши студенты?"
10048080-142 = "[s] «Разумеется»."
10048080-143 = "...Фуфу, как я и думала."
10048080-144 = "Разочаровывает, но такова их доверчивая натура."
10048080-145 = "Сенсей, увидеть вас с этой стороны, я..."
10048080-146 = "..."
10048080-147 = "Тогда ответ должен быть прост."
10048080-148 = "В определённом смысле Сенсей ручается за достоверность рассказов каждой из нас."
10048080-149 = "...Следовательно, разумнее всего всем сторонам раскрыть карты."
10048080-150 = "Итак, мои подозрительные помощницы, я спрошу ещё раз."
10048080-151 = "Почему вы помогли мне?"
10048080-152 = "И почему у вас подделка «Любви пурпурного и синего света»?"
10048080-153 = ""
10048080-155 = ""
10048080-157 = "..."
10048080-158 = "...Ты считаешь, что картина, которую ты достала из кейса, — поддельная."
10048080-159 = "Да. Без сомнений."
10048080-160 = "Серьёзно?"
10048080-161 = "Мои глаза, по крайней мере в вопросах искусства, ещё ни разу меня не подводили."
10048080-162 = "..."
10048080-163 = "Если так, нам стоит быть честными."
10048080-164 = "М-Миё, погоди...!"
10048080-165 = "Это самый разумный вариант, Фую."
10048080-166 = "Если она говорит правду, значит клиентка солгала тебе... нам."
10048080-168 = "Хорошо. Вот вся история."
