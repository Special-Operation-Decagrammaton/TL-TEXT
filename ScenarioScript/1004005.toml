[translation]
1004005-1 = "Думаете, я смогу стать великой куноити?"
1004005-2 = "С-С-Сенсей...!"
1004005-3 = "Я-я думаю, наконец нашла это!"
1004005-4 = "Способ, как я могу стать..."
1004005-5 = "Великим, полноценным ниндзя!"
1004005-6 = "[s] «Звучит интересно! Рассказывай, Цукуё.»"
1004005-7 = "О, т-так...!"
1004005-8 = "*тяжело дышит* *вдох* *выдох* *тяжело дышит* Мне нужно подышать..."
1004005-9 = "Фух... С чего начать?"
1004005-10 = "Вы помогаете мне тренироваться, но не можете быть рядом каждый день."
1004005-11 = "Я-я имею в виду, к-конечно, потому что вы заняты..."
1004005-12 = "[s] «Мне жаль это признавать, но да.»"
1004005-13 = "Н-Но я совсем вас не виню! Надеюсь, я не заставила вас чувствовать себя плохо."
1004005-14 = "Просто мне хотелось бы проводить с вами чуть больше времени..."
1004005-15 = "И-Иногда я даже ловлю себя на мысли, как бы продлить время наших тренировок..."
1004005-16 = "[s] «Д-Да... Я рад помочь.»"
1004005-17 = "П-Простите! Я просто пытаюсь объяснить...!"
1004005-18 = "Я н-не могу видеться с вами всё время, но тренироваться всё равно нужно."
1004005-19 = "Я решила изучать ниндзя, когда остаюсь одна... Например... искать информацию в интернете или читать книги о ниндзя."
1004005-20 = "Я слышала слух, что есть «обшарпанный книжный магазин с самой могущественной книгой ниндзюцу, написанной легендарным ниндзя,» поэтому ходила по книжным..."
1004005-21 = "*глоток* И вот наконец в букинистическом магазине я сделала великое открытие!"
1004005-22 = "[s] «Великое открытие...?»"
1004005-23 = ""
1004005-25 = ""
1004005-26 = ""
1004005-27 = ""
1004005-28 = ""
1004005-29 = ""
1004005-30 = "Я-я нашла эту книгу!"
1004005-31 = "[s1] «Книга ниндзюцу для куноити?»\n[s2] «Такие книги вообще существуют?»"
1004005-32 = "П-Правда ведь?! Я так обрадовалась!"
1004005-33 = "П-Правда ведь?! Я так обрадовалась!"
1004005-34 = "Обложка выглядит странно... Наверняка внутри куча секретов... Может, это и есть та великая книга ниндзюцу, которую я искала!"
1004005-35 = "Особенно вот здесь, смотрите, Сенсей! Написано: «Книга для особых ниндзя, известных как куноити!»"
1004005-36 = "[s] «И что...?»"
1004005-37 = "Судя по этому, куноити..."
1004005-38 = "Наверное, означает «особые ниндзя»!"
1004005-39 = "[s] «...Эм.»"
1004005-40 = "Вы тоже удивлены, да? Э-Это просто невероятно."
1004005-41 = "Но посмотрите на предисловие. Здесь сказано: «Искусная куноити способна подчинить кого угодно!»"
1004005-42 = "Значит, куноити — сила, с которой нельзя не считаться."
1004005-43 = "Среди всех ниндзя... куноити даже называют особым именем..."
1004005-44 = "Я не всё знаю о ниндзя... но Мичиру говорила, что бывают «средние» и «продвинутые» ниндзя..!"
1004005-45 = "Куноити, возможно, прозвище для... людей, которые настолько же велики, как эти ниндзя!"
1004005-46 = "[s] «Нет, Цукуё. Куноити просто означает...»"
1004005-47 = "С-Сенсей! Поможете мне освоить ниндзюцу из этой книги?!"
1004005-48 = "Я... хочу с её помощью стать великим, полноценным ниндзя..."
1004005-49 = "Да! Я хочу стать лучшей куноити!"
1004005-50 = "Глядя на сияющие глаза Цукуё, я не смог заставить себя рассказать ей настоящее значение этого слова."
1004005-51 = "[ns] «...Можешь на меня рассчитывать! Я постараюсь помочь изо всех сил!»"
1004005-52 = "Хорошо. Хи-хи! Хи-хи-хи!"
1004005-54 = "Мы с Цукуё начали испытывать ниндзюцу, описанные в книге для куноити."
1004005-55 = "Хм, первое ниндзюцу в книге — это... Техника любовного связывания... К-Какое странное название..."
1004005-56 = "Как применять это ниндзюцу... Сначала найти верёвку такой длины... завязать узел, похожий на петлю..."
1004005-57 = "Хорошо! Готово. Л-Ладно, Сенсей... Я-я начинаю!"
1004005-58 = "[s] «(Как мне из этого выкрутиться...)»"
1004005-59 = "Ниндзюцу! Техника любовного связывания!"
1004005-60 = ""
1004005-62 = ""
1004005-63 = ""
1004005-64 = ""
1004005-65 = ""
1004005-66 = "Это ещё не всё! Согласно книге ниндзюцу, теперь верёвку нужно связать вот так!"
1004005-67 = "Дальше... следующий шаг..."
1004005-68 = "«После успешного связывания другого человека активно прижмитесь к нему грудью»...?"
1004005-69 = "В-Вот так?"
1004005-70 = ""
1004005-72 = ""
1004005-74 = ""
1004005-75 = ""
1004005-76 = "*прижимается*"
1004005-77 = "[ns] «П-Подожди, Цукуё. Стой!»"
1004005-78 = "А?"
1004005-79 = "А-А-а?! Я-я простите! Вам было тяжело дышать?"
1004005-80 = "О, в-в-а-а?!"
1004005-81 = ""
1004005-83 = ""
1004005-85 = "У-ух..."
1004005-87 = "[ns] «Ты в порядке, Цукуё? Не ушиблась?»"
1004005-88 = "Я-я в порядке!"
1004005-89 = "Ниндзюцу куноити из этой книги..."
1004005-90 = "[s] «Да, Цукуё. Так вот...»"
1004005-91 = "Эти ниндзюцу такие сложные! Наверное, очень продвинутый уровень."
1004005-92 = "Мне стыдно, что я вообще попыталась!"
1004005-93 = "[s] «Д-Да... Может, нам стоит остановиться.»"
1004005-94 = "В-Всё нормально! Ниндзя не сдаются!"
1004005-95 = "После этого мы с Цукуё продолжили пытаться изучать ниндзюцу куноити из книги."
1004005-96 = "Следующее — это! Техника тихого совместного сна!"
1004005-97 = "...Хм? Совместный сон? Что это за ниндзюцу?"
1004005-98 = "Может, с его помощью атакуют противника во сне! Как Спящая красавица!"
1004005-99 = "Давайте попробуем!"
1004005-101 = "Ну, даже попробовав, я всё равно не понимаю... Перейдём к следующему..."
1004005-102 = "Следующее ниндзюцу — вот это..."
1004005-103 = "Техника сжатия бёдрами... Сжать лицо противника... бёдрами...? И что это даёт?"
1004005-104 = "Может, чтобы обезвредить противника, если потеряла оружие?"
1004005-105 = "Наверное, попробую..."
1004005-106 = "Сжать ваше лицо... моими бёдрами...?"
1004005-107 = "Н-Нет, нет! Сделаем вид, что этого здесь вообще нет!"
1004005-108 = "Т-Тогда перейдём к следующему ниндзюцу! С-Следующее!"
1004005-110 = "Я уже не знаю, сколько ниндзюцу куноити мы попробовали."
1004005-111 = "С-Странно. Я тренирую ниндзюцу, но будто ничему не учусь..."
1004005-112 = "Наверное, мой уровень ниндзя настолько низок... Мне стыдно..."
1004005-113 = "[s] «Цукуё, так вот... Прости, что не сказал раньше, но...»"
1004005-114 = "Куноити означает не «выдающийся ниндзя», а обычного ниндзя-женщину?"
1004005-115 = "Н-Но если это просто обычная женщина-ниндзя, почему здесь написано: «Искусная куноити способна подчинить кого угодно!» Что это значит?"
1004005-116 = "Я думала, это означает, что они супервеликие..."
1004005-117 = "[s] «Погоди, Цукуё. Под этим есть ещё одна строка.»"
1004005-118 = "О! Она такая маленькая, я не заметила."
1004005-119 = "«Искусная куноити способна подчинить кого угодно!»"
1004005-120 = "«Игра соблазнения! Используйте техники из „Ниндзюцу куноити: как соблазнить особенного человека“!»"
1004005-121 = "..."
1004005-122 = "..."
1004005-123 = "Ч-Ч-Ч-Ч-Что..."
1004005-124 = "То, что я всё это время делала... было игрой соблазнения куноити?!"
1004005-125 = "[s] «Ого! Цукуё, успокойся!»"
1004005-126 = "ААААА! Нет! И-Игра соблазнения?! Э-Это...!"
1004005-127 = "Это так стыдно... Я ещё слишком маленькая для такого!!!"
1004005-128 = ""
1004005-130 = ""
1004005-131 = "[ns] «О... Она ушла.»"
1004005-133 = "Я остался стоять и мысленно попрощался с Цукуё. Кажется, она поняла, что до полноценного ниндзя ей ещё далеко."
