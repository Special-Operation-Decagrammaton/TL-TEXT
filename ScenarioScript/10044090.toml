10044090-12 = "Наверное, из-за всех этих взрывов. *вздох*"
10044090-13 = "То есть мы НЕ МОЖЕМ это починить?"
10044090-14 = "Если мы не замедлимся, типа, ПРЯМО СЕЙЧАС..."
10044090-15 = "...мы пролетим мимо станции доставки и уедем прямо на конечную."
10044090-16 = "Миссия провалена, игра окончена! Пахяхя!"
10044090-17 = "Наказание всем!"
10044090-19 = "После всего, через что мы прошли..."
10044090-20 = "Если бы я знала, что так будет, придумала бы отговорку и осталась дома."
10044090-21 = "Ух! Глупая я из прошлого! Ты же ЗНАЛА, что не надо связываться с офицерами!"
10044090-22 = "Хочу вернуться в прошлое и треснуть себя по голове разводным ключом!"
10044090-23 = "И знаете, как раз когда у меня появилась КРОШЕЧНАЯ надежда..."
10044090-24 = "...мы вот здесь, спотыкаемся прямо на финише."
10044090-25 = "[ns1] «Давайте переведём дух и проанализируем ситуацию.»\n[ns2] «Наверняка есть что-то, о чём мы ещё не подумали.»"
10044090-28 = "О-о, Сенсей. Вы можете выстрелить паутиной в здания, потом выпрыгнуть вперёд..."
10044090-29 = "[s] «Но я не умею стрелять паутиной.»"
10044090-30 = "Ладно, тогда просто выпрыгните вперёд, упритесь ногами и толкайте поезд, пока он не остановится?"
10044090-31 = "[s] «Мне приятно, что ты обо мне такого мнения, но нет, этого я тоже не могу.»"
