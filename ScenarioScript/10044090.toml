10044090-1 = "Эпизод 9;Поломка тормозов"
10044090-4 = ""
10044090-5 = "Аоба, что делать?"
10044090-7 = "П-Почему вы спрашиваете меня?!"
10044090-8 = "Ты инженер! МЫ умеем ВОДИТЬ эту штуку, но в механике не разбираемся."
10044090-9 = "Отлично, я бесполезна в единственном деле, которое должна уметь..."
10044090-10 = "Я не... Я не это имела в виду, но...!"
