[translation]
1001406-1 = "Вместе с моим господином"
1001406-3 = "[ns1] «Это твоё „исследование“ явно не даёт тебе скучать.»\n[ns2] «Что именно ты пытаешься узнать?»"
1001406-4 = ""
1001406-5 = ""
1001406-6 = "Истинный смысл того, что значит быть ниндзя."
1001406-7 = "Я постоянно ищу ответ."
1001406-8 = "Исторические драмы — интересный источник..."
1001406-9 = "...но Изуна знает, что этот вопрос куда глубже простого просмотра сериалов!"
1001406-10 = "[s3] «Тут не поспоришь.»\n[s4] «Чем больше материалов для исследования, тем лучше.»"
1001406-11 = "Вопрос вот в чём: куда нам пойти, чтобы узнать о ниндзя больше?"
1001406-12 = "Вопрос вот в чём: куда нам пойти, чтобы узнать о ниндзя больше?"
1001406-13 = "Так уж совпало, что благодаря своим обширным исследованиям я составила список мест."
1001406-14 = "Всё, что вам нужно, — пойти со мной!"
1001406-15 = "[s] «После тебя.»"
1001406-16 = "Хорошо!"
1001406-18 = ""
1001406-19 = "[ns5] «Разве это не кафе с десертами?»\n[ns6] «Здесь можно узнать о ниндзя?»"
1001406-20 = "Да, мой господин! Посмотрите сюда."
1001406-21 = "Да, мой господин! Посмотрите сюда."
1001406-22 = ""
1001406-23 = "(В меню, которое показывает мне Изуна, написано...)"
1001406-24 = "...«Сладкий фестиваль 77 ниндзя» — совместная акция с сериалом про ниндзя от Шиба Дога Ван Вана."
1001406-25 = "[s] «С... совместная акция?»"
1001406-26 = "Ага! Это коллаборация с режиссёром Шиба Догом Ван Ваном!"
1001406-27 = ""
1001406-28 = "Что вы хотите, мой господин?"
1001406-29 = "Изуна рекомендует Парфе Странника, но..."
1001406-30 = "О! Но думаю, Одинокий креп и Печенье-сюрикен тоже будут хороши!"
1001406-31 = "*вдох* Если заказать четыре или больше позиций, дадут цветной постер с важной сценой из сериала!"
1001406-32 = "[s] «Д-Да?»"
1001406-33 = "Давайте скорее сделаем заказ, мой господин!"
1001406-35 = "(Мы с Изуной заказали четыре позиции, чтобы получить специальный рекламный сувенир...)"
1001406-37 = ""
1001406-38 = "[ns] «После десерта мы ещё идём есть рамэн?!»"
1001406-39 = "О, Изуна вам не сказала?"
1001406-40 = "Здесь в рамках коллаборации ещё продают ниндзя-рамэн!"
1001406-41 = "[s] «И как вообще сделать рамэн „ниндзя“?!»"
1001406-42 = "Это будет хорошая возможность узнать!"
1001406-43 = "Вот что написано в буклете."
1001406-44 = "«Когда ниндзя едят рамэн, они предпочитают бульон тонкоцу...»"
1001406-45 = "«...с тонкой лапшой, большим количеством чеснока и дополнительной порцией тясю.»"
1001406-46 = "Тогда Изуна знает, что заказать!"
1001406-47 = "[s] «П-правда...?»"
1001406-48 = ""
1001406-49 = ""
1001406-50 = "*хлюп*"
1001406-52 = "(Изуна таскала меня по всему городу в поисках всевозможных рекламных товаров с ниндзя.)"
1001406-53 = "(Ниндзя-такояки, ниндзя-рамунэ, ниндзя-баскетбол и так далее...)"
1001406-55 = "Угу! Сегодня я узнаю столько нового о господах и ниндзя!"
1001406-56 = "[s] «Я... не уверен, что это считается исследованием ниндзя...»"
1001406-57 = "Посмотрите туда, мой господин!"
1001406-58 = "Там есть лодка, на которой можно получить настоящий опыт ниндзя!"
1001406-59 = "[s] «Это ведь просто обычная лодка... правда?»"
1001406-60 = ""
1001406-61 = ""
1001406-62 = "(Изуна уже изучает табличку рядом с причалом.)"
1001406-63 = "Хм. Понятно..."
1001406-64 = "Значит, ниндзя гребут на лодках, чтобы тренировать мышцы."
1001406-65 = ""
1001406-66 = "Мой господин!"
1001406-67 = "[s7] «Ладно...»\n[s8] «Ты хочешь, чтобы я прокатился с тобой на лодке, да?»"
1001406-68 = "Вы читаете мои мысли!"
1001406-69 = "Вы читаете мои мысли!"
1001406-70 = "Это ваша тайная сила ниндзя?!"
1001406-71 = "[s] «Тогда я скорее экстрасенс, разве нет?!»"
1001406-72 = "Хи-хи! Хорошо, мой господин."
1001406-73 = "Пошли!"
1001406-74 = ""
1001406-78 = "― О, мой господин, мой господин! Вы видели?![wa:1780]"
1001406-80 = "― Карп! Он выпрыгнул из воды![wa:240]"
1001406-83 = "[ns] «Успокойся, Изуна. Ты раскачиваешь лодку.»"
1001406-84 = "― О, понятно. Спокойно, Изуна... Спокойно...[wa:3300]"
1001406-86 = "― Хех. Хи-хи.[wa:880]"
1001406-89 = "[ns] «Похоже, тебе весело.»"
1001406-90 = "― Угу! Думаю, мне весело, потому что...[wa:1820]"
1001406-92 = "― Я провожу время с самым любимым человеком — моим господином![wa:2000]"
1001406-95 = "― Этот день подарил Изуне воспоминания, которые она будет хранить вечно.[wa:2820]"
1001406-98 = "[ns9] «И он будет не последним.»\n[ns10] «Ничто не мешает нам продолжать тренировки и создавать новые воспоминания.»"
1001406-101 = "― Я бы хотела! Я знаю, что порой со мной бывает непросто...[wa:2260]"
1001406-103 = "― ...но надеюсь, вы позволите своему ниндзя и дальше оставаться рядом, мой господин![wa:1080]"
1001406-106 = "(Мы с Изуной ещё долго молча гребли на лодке.)"
