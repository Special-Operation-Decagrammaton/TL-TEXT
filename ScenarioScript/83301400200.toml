[translation]
83301400200-5 = ""
83301400200-6 = "Г-г-г-глава префектов...! Вы рушите наши планы!"
83301400200-7 = "Глава префектов, как всегда, страшная...! Как же унизительно!"
83301400200-8 = "Чтобы операция «Пузырь Геенны» вот так провалилась!"
83301400200-9 = ""
83301400200-11 = ""
83301400200-15 = ""
83301400200-16 = "Кстати... а что вообще такое операция «Пузырь Геенны»?"
83301400200-17 = "Что за операция требовала раскопать горячий источник прямо на парковке Общества Пандемониума...? Я не понимаю."
83301400200-18 = ""
83301400200-20 = ""
83301400200-21 = "Это была просто... очередная ваша выходка?"
83301400200-22 = "Нет!"
83301400200-23 = "Никакой загадки! Операция «Пузырь Геенны» — это... ровно то, что следует из названия! План по созданию потрясающих горячих источников по всей Геенне!"
83301400200-24 = "...?"
83301400200-25 = "Когда я, как обычно, копала новый горячий источник на окраине Геенны, то обнаружила кое-что."
83301400200-26 = "Под всей Академией Геенна проходят водяные жилы... и все они сходятся в одной точке."
83301400200-27 = "И эта точка должна быть..."
83301400200-28 = "Именно! Парковка Общества Пандемониума!"
83301400200-29 = "Если мне удастся превратить эту бесполезную парковку в горячий источник... все источники академии соединятся между собой!"
83301400200-30 = "Тогда вся Геенна станет одним гигантским горячим источником, способным вместить всех студентов разом — и ещё сто раз столько же!"
83301400200-31 = ""
83301400200-33 = ""
83301400200-34 = "Моя величайшая, самая невероятная мечта наконец станет реальностью!"
83301400200-35 = "...Безумие."
83301400200-36 = "Пожалуй, сейчас нам придётся отступить...!"
83301400200-37 = "Но не думайте, что мы сдались! Даже если этот план провалился..."
83301400200-38 = "В следующий раз мы вскроем тайную жилу горячей воды под Клубом школьных обедов и начнём операцию «Бум яиц из горячих источников»!"
83301400200-39 = "*вздыхает* Ладно. А пока просто сидите спокойно и подумайте над своим поведением."
83301400200-40 = ""
83301400200-42 = ""
83301400200-46 = "И-и-и?!"
