[translation]
1300205-1 = "Право отказывать обжорам"
1300205-2 = "Ресторанный квартал Кивотоса"
1300205-3 = "Hmm, hmm! Which restaurant should we go to today?"
1300205-4 = "Сегодня кошелёк совсем лёгкий, так что, думаю, пойду в безлимитный ресторан и наемся до отвала."
1300205-5 = "На ужин... безлимит не безлимит без якинику, а якинику не якинику, если оно не безлимитное!"
1300205-6 = "Ещё рановато, но пойду поем жареных рёбрышек."
1300205-7 = ""
1300205-10 = "Здравствуйте. Одну порцию рёбрышек, пожалуйста."
1300205-11 = ""
1300205-12 = "Добро пожалова— *вздох*"
1300205-13 = ""
1300205-14 = "(Это же Ванибучи Акари, чемпионка по скоростному поеданию еды?!)"
1300205-15 = "(Говорят, на прошлом мероприятии она в мгновение ока съела тридцать порций рёбрышек...)"
1300205-16 = "(Плохо дело... Если пустить такую клиентку, ресторан точно разорится!)"
1300205-17 = ""
1300205-18 = "Э-эм... Простите, госпожа, но на сегодня рёбрышки закончились. Мы больше не принимаем гостей."
1300205-19 = "Правда? Но я только что видела, как вошёл другой клиент."
1300205-20 = "Он был последним, кого мы могли принять... Простите!"
1300205-21 = "Ну, если закончились, ничего не поделаешь. А я так хотела сегодня якинику."
1300205-22 = "Придётся поискать что-нибудь другое..."
1300205-24 = "Так, где-то рядом должно быть безлимитное суши..."
1300205-25 = "Якинику всё ещё на первом месте... но суши я в последнее время ем нечасто."
1300205-26 = "Сегодня на ужин будут суши!"
1300205-27 = ""
1300205-30 = "Здравствуйте, одну порцию суши с тунцом!"
1300205-31 = ""
1300205-32 = ""
1300205-33 = "(Э-Это же Ванибучи Акари, чемпионка по скоростному поеданию?!)"
1300205-34 = "(Плохо дело! Чтобы её накормить, понадобится целый тунец и ещё сверху!)"
1300205-35 = ""
1300205-36 = "П-Простите! Сегодня все столики забронированы. Гостей без брони принять не можем!"
1300205-37 = "Правда? Да ладно..."
1300205-38 = "Ну, если всё занято, ничего не поделаешь. Найду другое место..."
1300205-40 = "Ух... Я умираю с голоду..."
1300205-41 = "Почему-то сегодня в каждом месте либо кончалась еда, либо всё было забронировано."
1300205-42 = "But seriously, did the god of all-you-can-eat restaurants curse me for eating too much or something?"
1300205-43 = "[s] «Чего такая грустная?»"
1300205-44 = "А, Сенсей. Ты тоже пришёл поужинать?"
1300205-45 = "Я хотела наесться в безлимитном ресторане, но куда ни зайду — везде отказываются меня обслуживать..."
1300205-46 = "Так что я до сих пор даже не смогла сесть и поужинать."
1300205-47 = "[s] «Почему бы не пойти в обычный ресторан вместо безлимитного?»"
1300205-48 = "К сожалению, с таким пустым кошельком я там нормально не наемся."
1300205-49 = "Ух... Я так голодна, что еле двигаюсь... Ладно, брошу поиски безлимита и съем хоть что-нибудь в обычном ресторане."
1300205-50 = "[s] «Если тебя устраивают суши с конвейера, можешь есть сколько хочешь.»"
1300205-51 = "Правда? Конечно! Я обожаю суши с конвейера."
1300205-52 = "Но ты обещал, что я могу есть сколько захочу... Ты точно выдержишь, Сенсей?"
1300205-53 = "*хихикает* Обещание есть обещание. Я сдерживаться не буду. ♥"
1300205-55 = "Вскоре после входа в суши-бар я понял, что имела в виду Акари."
1300205-58 = "― М-м-м. Вкусно![wa:1010]"
1300205-61 = "― Я могла бы есть эти суши[wa:10]"
1300205-63 = "― каждый день![wa:600]"
1300205-66 = "― Сколько я уже съела?[wa:2420]"
1300205-69 = "― Хи-хи."
1300205-71 = "― Сенсей, ты помнишь, сколько кусочков суши съел за всю жизнь?[wa:2140]"
1300205-74 = "― Кажется, я уже съела около ста тарелок...[wa:1550]"
1300205-76 = "― Но сегодня я ем меньше обычного.[wa:1000]"
1300205-79 = "― Я ещё даже наполовину не сыта![wa:1080]"
1300205-82 = "― Точно не против, если я продолжу?[wa:850]"
1300205-84 = "― Ты весь вспотел. У тебя пот прямо со лба капает![wa:530]"
1300205-87 = "― О-о... Интересно, какие на вкус суши[wa:700]"
1300205-89 = "― на этой золотой тарелке![wa:10]"
1300205-92 = "― Сенсей, ты точно в порядке?"
1300205-94 = "― Если ты не против, я съем эти суши за 1000 иен![wa:1780]"
1300205-97 = "Ресторанный квартал Кивотоса"
1300205-98 = "Спасибо за угощение, Сенсей!"
1300205-99 = "Не ожидала, что у них закончится вообще весь запас суши на день. Кто бы мог подумать?"
1300205-100 = "Ты наелся, Сенсей? А я бы ещё штук пятьдесят осилила..."
1300205-101 = ""
1300205-102 = "Может, пойдём в другой суши-бар?"
1300205-104 = "Ахаха! Шучу. Не хочу подвергать опасности твой кошелёк."
1300205-105 = "Наверное, этого всё равно будет мало, чтобы отплатить, но в следующий раз я оплачу столько еды, сколько ты захочешь."
1300205-106 = "Что? Одного приёма пищи не хватит, чтобы покрыть сегодняшние расходы?"
1300205-107 = "Ахаха! И правда. Ты ешь далеко не столько, сколько я, так что оплатить всего один твой обед было бы нечестно."
1300205-108 = "Тогда... придётся нам съесть вместе ещё очень много обедов. ♥"
