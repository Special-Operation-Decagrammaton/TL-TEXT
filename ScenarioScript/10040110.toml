[translation]
10040110-1 = "Послесловие;Идеальный напиток"
10040110-2 = "Пока Чихиро, Юука и Ноа ушли покупать снеки..."
10040110-3 = "Ого, это было весело!"
10040110-4 = "«BOOM» и правда шедевр. Я проходила эту игру десятки раз, но каждый раз ощущения всё равно свежие."
10040110-5 = "Хотя в этот раз источник напряжения был совсем другим..."
10040110-6 = "Если Чихиро когда-нибудь захочет сменить своё оружие на дробовик, мы должны будем остановить её любой ценой..."
10040110-8 = "А-ха... ха-ха... Наверное, у некоторых людей характер меняется, когда они играют в видеоигры. Ну, как бывает дорожная ярость за рулём."
10040110-9 = "От всего этого напряжения я ужасно захотела пить!"
10040110-10 = "Эй, Харе! Можно мне этот Frenzy MAX?"
10040110-11 = "Мне-то всё равно, но это—"
10040110-12 = ""
10040110-14 = ""
10040110-17 = ""
10040110-18 = "...*кашель* *кашель*"
10040110-19 = "Что это вообще такое? Кислятина! Он что, просроченный?!"
10040110-20 = "Я пыталась тебя предупредить. Это новый вкус Frenzy MAX — умэбоси."
10040110-21 = "Умэбоси?!"
10040110-23 = "У Frenzy MAX вообще очень много разных вкусов. В прошлом месяце все соцсети гудели, когда они выпустили вкус каши из красной фасоли."
10040110-25 = "Ко вкусу довольно трудно привыкнуть, но зато он помогает проснуться. Эта кислинка прямо бодрит."
10040110-26 = "Бле-е. Теперь мне хочется миску риса..."
10040110-27 = "...или, типа, какого-нибудь гамджу из риса..."
10040110-28 = ""
10040110-30 = ""
10040110-31 = ""
10040110-32 = "Эй, Котама, Харе. Мне тут идея пришла."
10040110-33 = "Если смешать этот Frenzy MAX со вкусом умэбоси с гамджу, разве не получится что-то вроде умэбоси с белым рисом?"
10040110-35 = "Нет."
10040110-36 = "Думаю, вкус будет совершенно другим..."
10040110-38 = "Но ведь именно так и появляются новые вкусы, да? Если смешать два разных вкуса, может получиться совершенно новый!"
10040110-39 = "Мы можем обнаружить неожиданно удачное сочетание и сделать супер-вкусный напиток!"
10040110-40 = ""
10040110-42 = ""
10040110-43 = "Фуфуфу. Мне нравится эта идея."
10040110-44 = "А-а! Ты меня напугала! Давно ты не спишь?!"
10040110-45 = "С тех пор, как вы начали играть в BOOM?"
10040110-46 = "Я почувствовала опасность со стороны телевизора, поэтому притворилась, что всё ещё сплю..."
10040110-48 = "...Вице-президент и правда продемонстрировала некоторую харизму во время игры."
10040110-49 = "Короче, я тоже хочу помочь смешать Frenzy MAX с умэбоси и гамджу!"
10040110-50 = "Вообще у нас куча напитков, так что давайте попробуем всякие сочетания!"
10040110-51 = "Тебе это кажется весёлым? Ты что, тайная миксологиня?"
10040110-52 = "Я уже экспериментировала со случайными напитками из холодильника Семинар! Но умэбоси с гамджу ещё никогда не смешивала!"
10040110-53 = "В интернете ведь постоянно такое пишут, да? Капни табаско в томатный сок — и получится вкус пиццы! Или добавь соевый соус в молоко — и будет вкус рисовых крекеров—"
10040110-54 = "Бле-е... А ты получила разрешение у сотрудников Семинар на эти эксперименты?"
10040110-55 = ""
10040110-57 = ""
10040110-58 = "...А? Да они бы никогда в жизни такое не разрешили!"
10040110-59 = "...Что?"
10040110-61 = "Если спрашивать разрешение на каждую мелочь, вообще ничего никогда не сделаешь! Лучше потом просить прощения, чем заранее разрешения!"
10040110-63 = "...Поразительный образ мышления."
10040110-64 = "Перед глазами прямо проносятся все страдания Юки..."
10040110-66 = "И что, прощение ты получила?"
10040110-67 = "А... Ну, тот, у кого мне пришлось просить прощения, был не особо добр ко мне..."
10040110-68 = "Не сомневаюсь..."
10040110-69 = "Короче! Мне ещё ни разу не доводилось экспериментировать с Frenzy MAX, так что приступим!"
10040110-70 = "Надо успеть до того, как вернутся эти ворчливые старшеклассницы!"
10040110-71 = "Мы точно можем так делать? Чихиро нас прибьёт за перевод еды, если узнает."
10040110-72 = "...Чего-о-о-о-о?"
10040110-73 = "Вот ЭТО неожиданно. Хакерши Веритас, которые исследуют науку и ищут истину, колеблются на пороге свежей инновации из-за возможности какого-то там... ворчания?"
10040110-74 = "Не хотелось бы спрашивать, но вы что..."
10040110-75 = ""
10040110-77 = ""
10040110-78 = "...боитесь?"
10040110-80 = "К-кто сказал, что я боюсь?!"
10040110-81 = "Ты прямо задела мою соревновательную натуру..."
10040110-82 = "Как и ходят слухи, у самой младшей участницы Семинар исключительный талант провоцировать людей."
10040110-83 = "Я вообще ничего не боюсь! Всё равно собиралась это сделать!"
10040110-84 = "Если смешать Frenzy MAX со вкусом умэбоси и гамджу в пропорции один к одному..."
10040110-85 = ""
10040110-87 = ""
10040110-88 = "...Не хотелось бы говорить это после того, как мы уже так далеко зашли, но выглядит странно."
10040110-89 = "Пожалуйста, не говорите так."
10040110-91 = "Хм. Ну, получился довольно приятный оттенок розового, так что, может, всё не так плохо, как я сначала думала."
10040110-92 = "Следующий шаг. Каково это на вкус? Подходит ли под критерий «есть умэбоси с рисом»?"
10040110-93 = ""
10040110-96 = ""
10040110-98 = ""
10040110-99 = "...Совсем нет."
10040110-100 = "Сладость риса усиливается кислым вкусом умэбоси..."
10040110-101 = "Как будто пьёшь сладкий рисовый напиток... только сделанный из кислого, просроченного риса."
10040110-103 = "То есть провал?"
10040110-104 = "Как смесь звуков, которые сливаются в дисгармоничную гармонию."
10040110-106 = "А, а! Ещё я слышала, что если смешать кислый напиток с молоком, получится вкус йогурта!"
10040110-107 = "Значит, если нейтрализовать умэбоси молоком, а потом смешать всё с гамджу, получится совершенно новый вкус йогурта, которого ещё никто не пробовал!"
10040110-108 = "Это невозможно. Для йогурта используют совсем другой тип уксус—"
10040110-109 = ""
10040110-111 = ""
10040110-112 = ""
10040110-113 = "Маки, ты что...?"
10040110-114 = "Фуфу. Мы уже так далеко зашли, разве нет? Какая разница, если поэкспериментируем ещё чу-у-уточку?"
10040110-115 = "Тогда! Будем смешивать! Смешаем все напитки, какие только придут в голову, и поэкспериментируем!"
10040110-117 = "ПОГНА-А-АЛИ!!"
10040110-118 = ""
10040110-123 = ""
10040110-124 = ""
10040110-125 = "Хм."
10040110-126 = "Эм..."
10040110-127 = "Странно. Мы ведь не добавляли ничего острого..."
10040110-128 = "Но тут есть этот... запах, от которого в носу всё колется."
10040110-129 = "И на цвет посмотрите. Будто тёмно-фиолетовый червяк извивается. Мне страшно такое в живот заливать."
10040110-130 = "Даже если это самое вкусное вещество на свете, Чихиро взбесится, если увидит."
10040110-131 = "Если она узнает, что мы потратили половину напитков на эксперименты..."
10040110-132 = "...Вы половину напитков потратили на что, простите?"
10040110-133 = ""
10040110-135 = ""
10040110-137 = ""
10040110-138 = "Ч-Ч-Чихиро?! К-когда ты вернулась?"
10040110-139 = "Только что. Но важнее другое: мне ведь не послышалось, что вы сейчас говорили что-то странное?"
10040110-140 = "И что это за подозрительный сок в этой ёмкости?"
10040110-141 = "Н-ну, это..."
10040110-142 = "К-Коюки! Это Коюки заставила меня смешать все разные напитки! Сказала, что будет вкусно!"
10040110-144 = "ЧЕГО?! П-предательница!"
10040110-146 = "Коюки-и-и? Ты правда умудрилась устроить проблемы за то время, пока мы ходили в магазин?"
10040110-147 = "На этот раз я серьёзно так просто тебя не отпущу!"
10040110-149 = "Н-не-е-ет! Всё не так! Пожалуйста...!"
10040110-151 = "УА-А-А-А!!"
