[translation]
2004902-1 = "Море — это совсем не весело"
2004902-2 = "Я подошёл к Мисаки, сидевшей под зонтом на пляже."
2004902-3 = ""
2004902-6 = ""
2004902-7 = "Похоже, у тебя полно свободного времени, раз ты пришёл ко мне, Сенсей."
2004902-8 = "[s1] «Ты звучала так, будто скучаешь. Я подумал, тебе не помешает компания.»\n[s2] «Ну же, давай вместе поиграем во что-нибудь пляжное!»"
2004902-11 = "Я пас."
2004902-12 = "Вообще не понимаю, почему кому-то здесь нравится."
2004902-13 = "Солнце жарит, чайки орут, ветер солёный..."
2004902-14 = "Не понимаю, что всем этим людям здесь вообще должно нравиться."
2004902-15 = "[s] «Ты впервые одна на пляже, Мисаки?»"
2004902-16 = "Именно."
2004902-17 = "...Что ты имеешь в виду под «ты просто ещё не знаешь, как здесь веселиться»?"
2004902-18 = "[s3] «Ну, для начала ты вся вспотела.»\n[s4] «Тебе стоит охладиться в воде.»"
2004902-21 = "Я привыкла к жаре."
2004902-22 = "Там, где мы обычно живём, кондиционера нет. Мне и сейчас не нужно охлаждаться."
2004902-23 = "[s] «Но я хочу поплавать вместе с тобой!»"
2004902-24 = "И какой в этом смысл?"
2004902-25 = "[s] «Ну, например, это будет очень весело.»"
2004902-26 = "Точно нет."
2004902-27 = "..."
2004902-28 = "Грустное лицо не заставит меня передумать."
2004902-29 = "[s] «Миса-а-аки... Пла-а-авать...»"
2004902-30 = "Серьёзно..."
2004902-31 = "Я не *кашляет* -мею."
2004902-32 = "[s] «Что?»"
2004902-33 = "Я не умею. Плавать!"
2004902-34 = "Ну что, доволен?"
2004902-35 = "[s] «Не переживай. Я тебя научу.»"
2004902-36 = "Серьёзно?"
2004902-37 = "Ты ведь почти никогда не бываешь здесь, да? И хочешь потратить свой день на то, чтобы учить меня плавать? Почему?"
2004902-38 = "...Учить меня наслаждаться пляжем — это твой способ наслаждаться пляжем?"
2004902-39 = "Для меня в этом нет никакого смысла."
2004902-40 = ""
2004902-42 = ""
2004902-44 = "*вздыхает*"
2004902-45 = "Ладно, ладно. Ты победил."
2004902-46 = "Не то чтобы это имело значение, но раз уж ты так стараешься, я подыграю."
2004902-47 = "[s] «Отлично! Тогда пойдём возьмём круг напрокат?»"
2004902-48 = "Круг? Я не ребёнок..."
2004902-51 = "Остаток времени я учил Мисаки плавать."
