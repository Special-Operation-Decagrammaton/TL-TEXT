[translation]
221100-1 = "Episode 10;Chase on the Deck"
221100-2 = "(A few days later)"
221100-3 = "(After completing the formal administrative procedures and exchanging a few documents...)"
221100-4 = "(Everything was ready for Sammy to disembark.)"
221100-9 = "Olympus - Island Officer Room"
221100-11 = "We have been waiting for you, Sensei. #n...And the General Student Council President, too."
221100-12 = "Welcome to the Island."
221100-13 = "[s1] \"You two must be exhausted.\"\n[s2] \"Holding up okay?\""
221100-16 = "Yes, thanks to you."
221100-17 = "There was a bit of a commotion regarding Sammy's disembarkation, #nbut thanks to Trident's prompt response, it did not turn into a major incident."
221100-18 = "[s] \"A bit of a commotion?\""
221100-19 = "Some of the students caused a fuss, saying they would miss Sammy."
221100-20 = "Some tried to cure Sammy with dubious folk remedies, #nwhile others sneaked onto the Island to make cat's cradle toys out of Sammy's fur..."
221100-21 = "It is true that Sammy sheds quite a bit, but... that is asking too much."
221100-22 = "That aside, that was about the extent of our problems. #nEveryone is complying since it is a decision by the General Student Council."
221100-23 = "We should have sought the General Student Council President's opinion from the start."
221100-28 = "No."
221100-29 = "I merely lent my name, you see?"
221100-30 = "But thanks to that, I was able to use the remaining time to sort out my feelings. #nContinuing that endless, futile argument would have led nowhere."
221100-31 = "It seems taboos and customs are truly inescapable after all."
221100-32 = "..."
221100-37 = "[ns] \"So, where is Sammy...?\""
221100-38 = "She should be in her usual spot."
221100-39 = "After breakfast, she invariably takes a nap on the cushion under the table."
221100-45 = "I am sure she is right now..."
221100-49 = "Sammy!?"
221100-50 = "Sammy is gone!? Where did she go?"
221100-51 = "I do not know... She is always here at this hour..."
221100-52 = "Has anyone seen Sammy?"
221100-53 = "W-Well, actually... I saw Sammy head out to the deck after finishing breakfast..."
221100-54 = "I am terribly sorry. I thought she was just going for her morning walk..."
221100-55 = "That is strange."
221100-56 = "Why of all days..."
221100-57 = "Could she have realized we were planning to take her off the ship...?"
221100-58 = "[s] \"Can Sammy understand human speech?\""
221100-59 = "No. But she is quite perceptive for her age."
221100-60 = "Whenever we prepare for a shower or try to give her vaccinations, she vanishes immediately..."
221100-61 = "Odysseus has many places to hide, #nso she once stayed out of sight for a whole week..."
221100-63 = "That was when she was healthier than she is now. #nConsidering Sammy's current health, there is no telling what might happen."
221100-64 = "It seems we cannot afford to stand around."
221100-65 = "Let us all search for Sammy."
221100-71 = "Sammy!"
221100-72 = "Come on out!"
221100-73 = "Where are you..."
221100-78 = "Meow."
221100-79 = "[ns] \"There! On the rope!\""
221100-81 = "I will draw her attention."
221100-82 = "Heeere, Sammy. It is your favorite treat~"
221100-83 = "Come over here~ It is delicious~"
221100-87 = "Meow."
221100-88 = "Ugh."
221100-89 = "[ns] \"She leaped to the other ship!?\""
221100-90 = "Her footwork is still remarkably agile. #nNot a single hesitation, even though she might fall into the sea."
221100-91 = "To Sammy, the entire ship is like a giant cat tree."
221100-92 = "She has been running back and forth between the ships and all over the academy almost every day... #nSammy might know the geography of the Odysseus better than anyone."
221100-93 = "Anyway, let us chase her!"
221100-95 = "(After that, the game of tag with Sammy continued.)"
221100-96 = "(However, she kept slipping away by skillfully using handrails and narrow passageways...)"
221100-98 = "Ha!"
221100-99 = "Oh."
221100-100 = "[s] \"Did you catch her?\""
221100-101 = "I lost her!"
221100-102 = "Meooow."
221100-104 = "(To make matters worse, unexpected interruptions occurred.)"
221100-107 = "Hah, hah... #nDid, did Sammy come by here?"
221100-108 = "Sammy? You mean the cat?"
221100-109 = "I am sorry, but I have not seen her today."
221100-110 = "That is strange. She should have run off in this direction..."
221100-115 = "Meow."
221100-116 = "Shh! I told you to be quiet!"
221100-117 = "...Could you possibly be hiding Sammy!?"
221100-118 = "I-I am sorry! #nWe just wanted to see her face one last time before she disembarked..."
221100-120 = "Meooow~"
221100-121 = "Wait right there!"
221100-126 = "Um..."
221100-127 = "Huh? The Captain and Executive Officer... and even Sensei from Schale?"
221100-128 = "Why are you in such a rush?"
221100-129 = "Sammy came this way, did she not?"
221100-130 = "..."
221100-131 = "...No?"
221100-132 = "...Really?"
221100-137 = "Surely, Trident, the guardians of discipline on this ship, would not lie--"
221100-138 = "Meow~"
221100-143 = "...Busted."
221100-144 = "Even you guys!"
221100-145 = "[s] \"Sorry, just passing through!\""
221100-148 = "(Because some students hid Sammy and hindered the search, #nthe game of chase dragged on much longer than expected.)"
221100-150 = "Hah, hah..."
221100-151 = "Everyone... why are you hiding Sammy? #nUntil yesterday, you had no complaints, did you!"
221100-152 = "Not voicing complaints does not mean there were none..."
221100-153 = "I never expected even the Trident students to join in."
221100-157 = "Why are you all acting so out of character..."
221100-158 = "That is probably because this is an out-of-the-ordinary situation."
221100-162 = "More importantly... Sammy seems to think of this as a game, and she looks like she is having a great time."
221100-163 = "Roll, roll... purr-meow."
221100-168 = "That stupid cat..."
221100-169 = "This is getting us nowhere. Let us split up into two groups."
221100-170 = "Executive Officer Ami and Sensei, could you flush Sammy out from the port side?"
221100-171 = "I will wait on the starboard side and catch her at the dead end of the bow."
221100-172 = "There is a risk she might fall into the sea if we are not careful, but... we have no other choice."
221100-173 = "Captain, I wish you luck. #nLet us go, [USERNAME] Sensei. This way."
221100-174 = "[s] \"Leave it to me!\""
221100-178 = "Sammy... stop right there!"
221100-179 = "[ns] \"Roar! I am going to eat you up!\""
221100-180 = "Myafu...!"
221100-181 = "Sammy went to the bow...!"
221100-182 = "Captain! Now is our chance!"
221100-186 = "Gotcha--"
221100-187 = "Meow!"
221100-188 = "Huh!?"
221100-194 = "[ns] \"Minato...!\""
221100-195 = "Captain! Are you okay!?"
221100-196 = "I-I am fine!"
221100-197 = "I can swim just fine, and there are things I can grab onto!"
221100-198 = "Even so..."
221100-199 = "Executive Officer, did you forget? #nWe do not rescue those who float vertically and drown on the water surface. I am sure I said that many times."
221100-200 = "Anyway... could you throw down a ladder or something I can climb?"
221100-201 = "I will get one right away! Please wait a moment!"
221100-207 = "Meow--"
221100-208 = "Eh...?"
221100-210 = "Hey, Sammy!? It is dangerous! Get back up on the deck!"
221100-211 = "Meow... meow-un..."
221100-212 = "What is it, are you worried about me because I fell in?"
221100-213 = "Acting all concerned when you cannot even swim yourself."
221100-214 = "Meooow--"
221100-215 = "After making us chase you all over, you look lively enough."
221100-216 = "Good grief... We can swim yet we fear the sea, and yet you cannot swim and yet you show no fear of the water."
221100-217 = "Heh, I suppose this is what they call being fearless?"
221100-218 = "...No, wait. #nWater scares you too, does it not? You were always terrified during baths."
221100-219 = "But even more than that... you are worried about me."
221100-221 = "Sammy... thank you."
221100-222 = "And I am sorry..."
221100-223 = "Captain! We have lowered the ladder! Over here!"
221100-224 = "Well then, Sammy. It is time."
221100-225 = "Meow--"
221100-230 = "Next Episode;A Change of Heart"
