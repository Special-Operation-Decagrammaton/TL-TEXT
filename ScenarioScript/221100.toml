[translation]
221100-1 = "Episódio 10;Pega-Pega a Bordo"
221100-2 = "（Alguns dias depois――）"
221100-3 = "（Após concluirmos as formalidades protocolares e trocarmos os despachos necessários――）"
221100-4 = "（Todos os preparativos para o desembarque de Sammy estavam devidamente finalizados.）"
221100-5 = ""
221100-8 = ""
221100-9 = "Olympos - Sala de Oficiais do Island"
221100-11 = "Estávamos à sua espera, Sensei.#n......E a sua também, ilustre Presidente."
221100-12 = "Sejam muito bem-vindos à sede do Island."
221100-13 = "[s1] \"Bom trabalho pelo empenho de vocês.\"\n[s2] \"Tudo calmo por aqui?\""
221100-16 = "Sim, felizmente correu tudo dentro dos conformes."
221100-17 = "Houve um pequeno alvoroço quando a notícia do desembarque se espalhou,#nmas graças à intervenção ágil do esquadrão Trident, a situação não fugiu do controle."
221100-18 = "[s] \"Um pequeno alvoroço...?\""
221100-19 = "Algumas alunas inconformadas com a despedida acabaram causando certo rebuliço pelos corredores."
221100-20 = "Algumas tentaram aplicar terapias holísticas caseiras duvidosas no Sammy, outras invadiram o Island tentando colher pelos dele para fazer bolinhas de lembrança..."
221100-21 = "É fato que o Sammy solta bastante pelo nessa época do ano... mas aquilo já era passar de todos os limites do bom senso."
221100-22 = "Contudo, fora essas pequenas excentricidades, não tivemos maiores problemas.#nComo se tratava de uma diretriz oficial do Conselho Estudantil Federal, todas acataram com disciplina."
221100-23 = "Deveríamos ter recorrido ao parecer da Presidente desde o primeiro instante."
221100-24 = ""
221100-26 = ""
221100-27 = ""
221100-28 = "De modo algum."
221100-29 = "Eu apenas emprestei a chancela do meu nome, não fiz nada demais."
221100-30 = "Mas graças a isso, pudemos usar o tempo que nos restava para colocar os sentimentos em ordem.#nSe continuássemos daquele jeito, estaríamos até hoje em uma discussão estéril sem fim."
221100-31 = "No fim, parece que é mesmo inútil remar contra a força dos tabus e costumes."
221100-32 = "......"
221100-33 = ""
221100-35 = ""
221100-36 = ""
221100-37 = "[ns] \"E onde é que o Sammy tá agora?\""
221100-38 = "Deve estar no cantinho de sempre."
221100-39 = "Depois de tomar o café da manhã, ele religiosamente tira uma soneca em cima da almofada debaixo daquela mesa."
221100-40 = ""
221100-42 = ""
221100-43 = ""
221100-44 = ""
221100-45 = "Com certeza deve estar lá até ago――"
221100-46 = ""
221100-48 = ""
221100-49 = "Sammy?!"
221100-50 = "O Sammy sumiu?! Pra onde ele foi?!"
221100-51 = "Não faço a menor ideia... Ele nunca sai daqui nesse horário, é o cantinho sagrado dele..."
221100-52 = "Alguém aí fora viu o Sammy passar?!"
221100-53 = "É-É que... agora há pouco, vi o Sammy saindo em direção ao convés logo após terminar a ração..."
221100-54 = "Peço mil perdões, achei que fosse apenas o passeio matinal dele..."
221100-55 = "Que estranho..."
221100-56 = "Por que logo no dia de hoje ele foi inventar isso...?"
221100-57 = "Não me diga que... ele percebeu que nós íamos desembarcá-lo do navio?!"
221100-58 = "[s] \"O Sammy entende o que a gente fala?\""
221100-59 = "Não a nossa língua, mas com a idade ele desenvolveu uma sensibilidade impressionante para captar o clima no ar."
221100-60 = "Sempre que a gente preparava água morna para o banho ou pegava a seringa para vacinação, ele evaporava na mesma hora..."
221100-61 = "A Odisseia tem centenas de esconderijos e tubulações secretas.#nUma vez ele conseguiu ficar uma semana inteira desaparecido sem deixar rastro..."
221100-63 = "Mas isso foi na época em que ele ainda tinha energia de sobra!#nNo estado de saúde atual dele, não temos como prever o que pode acontecer num esforço desses!"
221100-64 = "Não podemos perder tempo paradas aqui lamentando."
221100-65 = "Vamos nos mobilizar e procurar o Sammy imediatamente por todo o navio!"
221100-70 = ""
221100-71 = "Sammy!"
221100-72 = "Aparece, garoto!"
221100-73 = "Onde é que você se meteu――"
221100-74 = ""
221100-76 = ""
221100-78 = "Myao."
221100-79 = "[ns] \"Olha lá! Em cima daquele cabo de aço!\""
221100-80 = ""
221100-81 = "Deixem comigo, eu atraio ele."
221100-82 = "Veeem cá, Sammy! Olha o petisco delicioso que eu trouxe pra você～"
221100-83 = "Vem aqui pegar, tá quentinho e crocante～"
221100-84 = ""
221100-86 = ""
221100-87 = "Mya!"
221100-88 = "Droga!"
221100-89 = "[ns] \"Ele pulou pro outro navio?!\""
221100-90 = "A agilidade dele continua impressionante para a idade.#nSaltar de uma embarcação para outra sem o menor medo de cair no abismo das águas..."
221100-91 = "Para o Sammy, os conveses de todos os navios são como um arranhador gigante interligado."
221100-92 = "Ele passou mais de uma década pulando de passarela em passarela pelo colégio todo...#nÉ bem provável que conheça a planta da Odisseia melhor do que qualquer uma de nós."
221100-93 = "Não vamos desistir, atrás dele!"
221100-95 = "（E assim começou uma perseguição frenética atrás do velho felino）"
221100-96 = "（Porém, aproveitando-se de corrimãos estreitos e vãos diminutos, ele escapava de todas as investidas――）"
221100-97 = ""
221100-98 = "Peguei!"
221100-99 = "Ora vejam."
221100-100 = "[s] \"Conseguiu segurar?\""
221100-101 = "Escorregou pelos meus dedos!"
221100-102 = "Myaaoooon～"
221100-104 = "（Para complicar ainda mais, começamos a enfrentar sabotagens inesperadas da própria tripulação）"
221100-105 = ""
221100-106 = ""
221100-107 = "Arf, arf... Por favor... vocês viram o Sammy passar correndo por aqui?"
221100-108 = "O Sammy...? Está falando do gatinho marinheiro?"
221100-109 = "Lamento muito, mas hoje ainda não cruzei com ele por este setor."
221100-110 = "Que estranho... eu tinha certeza absoluta de que ele tinha disparado pra este lado..."
221100-111 = ""
221100-115 = "Myao."
221100-116 = "Shiiiu! Fica quieto, criatura, eu mandei não fazer barulho!"
221100-117 = "......Vocês estavam escondendo o Sammy debaixo do casaco?!"
221100-118 = "M-Mil perdões, Vice-Capitã!#nÉ que a gente queria dar só mais um abracinho nele antes dele ir embora pra terra firme..."
221100-120 = "Myaau～"
221100-121 = "Volta já aqui!"
221100-122 = ""
221100-125 = ""
221100-126 = "Com licença..."
221100-127 = "Ué? A Capitã e a Vice-Capitã... e até o Sensei da Schale?!"
221100-128 = "Qual o motivo de tanta pressa e correria pelos conveses?"
221100-129 = "O Sammy... ele veio em direção a vocês, não veio?"
221100-130 = "......"
221100-131 = "......Não? Nem sombra dele por aqui."
221100-132 = "......Têm certeza absoluta disso?"
221100-133 = ""
221100-135 = ""
221100-136 = ""
221100-137 = "Até parece que nós, as sentinelas de elite do Trident que zelamos pela disciplina de bordo, ousaríamos mentir para as nossas superior――"
221100-138 = "Myaau～"
221100-139 = ""
221100-141 = ""
221100-142 = ""
221100-143 = "......Eita, fomos desmascaradas."
221100-144 = "Até vocês do Trident entraram nessa conspiração?!"
221100-145 = "[s] \"Desculpem, com licença, preciso passar!\""
221100-148 = "（Com as alunas acobertando o paradeiro e atrapalhando a busca,#o pega-pega pelo navio se estendeu muito além do que qualquer um poderia prever）"
221100-150 = "Arf, arf... que loucura..."
221100-151 = "Por que todas vocês estão escondendo o Sammy?!#nAté ontem ninguém tinha levantado uma única palavra contra a decisão!"
221100-152 = "Não dizer nada não significa que não houvesse revolta no peito..."
221100-153 = "Só não imaginei que até as sentinelas do Trident fossem aderir a essa resistência."
221100-154 = ""
221100-156 = ""
221100-157 = "Por que todo mundo começou a agir de forma tão atípica do nada...?"
221100-158 = "Será porque a situação em si fugiu totalmente da normalidade rotineira?"
221100-159 = ""
221100-161 = ""
221100-162 = "E vejam só... parece que o Sammy está achando tudo isso uma grande brincadeira de esconde-esconde, olha a cara de felicidade dele."
221100-163 = "Rola, rola... purrrr, myaaan."
221100-164 = ""
221100-166 = ""
221100-167 = ""
221100-168 = "Esse gato descarado......"
221100-169 = "Se continuarmos correndo em círculos não vamos a lugar nenhum. Vamos nos dividir em duas frentes!"
221100-170 = "Vice-Capitã Ami e Sensei, poderiam encurralar o Sammy pelo lado de bombordo?"
221100-171 = "Eu aguardo de tocaia em boreste e capturo ele quando ele alcançar o beco sem saída na proa!"
221100-172 = "Há o risco de alguém cair na água se dermos um passo em falso... mas é a única alternativa viável que nos resta."
221100-173 = "Desejo-lhe boa sorte na manobra, Capitã.#nVenha comigo, Sensei. Por aqui, rápido!"
221100-174 = "[s] \"Pode deixar com a gente!\""
221100-175 = ""
221100-177 = ""
221100-178 = "Sammy... para aí agora mesmo!"
221100-179 = "[ns] \"Rwaaar! Um monstro feroz vai te pegar!\""
221100-180 = "Nyaf...?!"
221100-181 = "Ele correu direto em direção à proa...!"
221100-182 = "Capitã! Agora!"
221100-183 = ""
221100-185 = ""
221100-186 = "Te pegue――"
221100-187 = "Myaa!"
221100-188 = "Eitaaa?!"
221100-189 = ""
221100-194 = "[ns] \"Minato......!\""
221100-195 = "Capitã! A senhorita está bem?!"
221100-196 = "T-Tô... tô bem!"
221100-197 = "Eu sei nadar perfeitamente, e tem uma boia perto pra me apoiar!"
221100-198 = "Mas mesmo assim..."
221100-199 = "Ami, você se esqueceu do tabu?#n'Nunca tente resgatar quem estiver boiando na vertical'. Eu já repeti isso mil vezes!"
221100-200 = "Apenas joguem uma escada de corda ou algo firme por onde eu possa subir, por favor!"
221100-201 = "Vou providenciar agora mesmo! Aguente firme!"
221100-202 = ""
221100-207 = "Myaaa――"
221100-208 = "Hã......?"
221100-210 = "Espera aí, Sammy?! É perigoso demais ficar aí na beirada! Sobe de volta pro convés agora!"
221100-211 = "Mya... myaawn, myaawn..."
221100-212 = "O que foi...? Tá tão preocupado assim porque me viu caindo na água?"
221100-213 = "Você nem sabe nadar, e ainda assim fica aí todo aflito tentando me alcançar..."
221100-214 = "Myaaa――"
221100-215 = "Depois de fazer todo mundo correr feito louco pelo navio, você parece tão cheio de energia."
221100-216 = "É irônico demais... nós, que sabemos nadar, vivemos tremendo de medo do mar; enquanto você, que não sabe nadar nada, não tem medo de se debruçar sobre o abismo..."
221100-217 = "Fufufu... será que é isso que chamam de bravura dos inocentes?"
221100-218 = "......Não, que besteira a minha.#nVocê tem pavor de água sim. Sempre entra em pânico na hora do banho."
221100-219 = "Mas mesmo morrendo de medo d'água... a sua preocupação comigo foi maior."
221100-221 = "Sammy... muito obrigada."
221100-222 = "E me perdoa......"
221100-223 = "Capitã! Lançamos a escada de embarque! É só segurar aqui!"
221100-224 = "Venha, Sammy. Chegou a nossa hora."
221100-225 = "Myaaa――"
221100-226 = ""
221100-230 = "A Seguir;Mudança de Ideia"
