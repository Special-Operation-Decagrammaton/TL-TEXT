[translation]
83306050400-5 = ""
83306050400-7 = ""
83306050400-9 = ""
83306050400-11 = "Похоже, это последний блокнот, в котором писал тот музыкант..."
83306050400-14 = "«Мне тяжело это признавать... но пора посмотреть правде в глаза. Моя мечта никогда не сбудется»."
83306050400-15 = "«У этого нет какой-то драматичной причины. Просто между тем, что я хочу делать... и тем, на что способен, лежит непреодолимая пропасть»."
83306050400-16 = ""
83306050400-20 = "«...Поэтому, когда уйду отсюда, навсегда оставлю здесь и свою мечту. Но положу в этот блокнот последнее написанное мной произведение»."
83306050400-21 = "«Если ты случайно наткнулся на эту комнату и читаешь эти слова... Просто знай: я любил играть на этом пианино...»"
83306050400-22 = ""
83306050400-26 = "«Даже если моя мечта так и не сбылась... всё это не было бессмысленным»."
83306050400-27 = ""
83306050400-31 = ""
83306050400-33 = "...Ты ушёл, так и не осуществив мечту."
83306050400-34 = "Но, как ты и написал, время, проведённое здесь, всё равно имело смысл."
83306050400-35 = "Вот твои ноты... Написаны очень аккуратно."
83306050400-36 = ""
83306050400-38 = ""
83306050400-42 = "Сегодня попробую сыграть их."
