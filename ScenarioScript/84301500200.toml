[translation]
84301500200-5 = "...Таинственный чип, найденный в блоке Avant Guard."
84301500200-6 = "Судя по данным, его, вероятно, установили за последние сутки, и, скорее всего, это сделали НЕ Инженерный отдел и не Семинар."
84301500200-7 = "Кто бы это ни сделал, он действовал намеренно: хотел сорвать демонстрацию и доставить проблемы обеим группам."
84301500200-8 = "Но зачем? Какая выгода? Привлечь внимание? Отвлечь? Что-то связанное с короткими продажами?"
84301500200-9 = "Пока у нас недостаточно данных. Но если я сопоставлю этот чип с другими похожими данными, возможно, смогу найти производителя. ...Хотя это займёт время."
84301500200-10 = "Я была полезна?"
84301500200-11 = "Очень."
84301500200-12 = "В зависимости от ситуации это может оказаться ключевой уликой."
84301500200-13 = "Отлично! *кхм* То есть, это облегчение."
84301500200-14 = ""
84301500200-16 = ""
84301500200-17 = "Простите, то, что я говорю, не всегда соответствует ситуации."
84301500200-18 = "Не беспокойся. Какими бы ни были твои личные дела, они явно весьма серьёзны."
84301500200-19 = "Если сотрудничество с нами тебе хоть как-то помогает, меня это тоже устраивает."
84301500200-20 = "...Похоже, ты значишь куда больше, чем говорит твоя репутация, Цукацуки Рио."
84301500200-21 = "То же самое я могла бы сказать о тебе, Юризоно Сэя."
84301500200-22 = "Нэру скоро вернётся. Давайте ещё немного подождём."
