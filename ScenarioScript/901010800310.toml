901010800310-8 = ""
901010800310-9 = "FOX 2, докладываю."
901010800310-10 = ""
901010800310-12 = ""
901010800310-13 = "О! Ты вернулась!"
901010800310-14 = "Хорошая работа сегодня."
901010800310-15 = "Кстати, что ты читала? Выглядела такой серьёзной."
901010800310-16 = "Я систематизировала дела о пропавших людях в D.U."
901010800310-17 = "Хотя нам удалось выяснить судьбу нескольких людей, пропавших в порту Канэсаки..."
901010800310-18 = "ещё остаётся много тех, чьё местонахождение неизвестно."
901010800310-19 = "Думаешь, работы слишком много?"
901010800310-20 = "Нет, дело не в этом."
901010800310-21 = ""
901010800310-23 = ""
901010800310-24 = ""
901010800310-25 = "Я всё ещё не уверена, могу ли взять ответственность за все эти дела."
901010800310-26 = "Как всегда, правда не удовлетворит всех."
901010800310-27 = "Рано или поздно мне придётся сделать выбор. И снова взять ответственность за своё решение..."
901010800310-28 = "Смогу ли я нести эту ответственность одна? Или снова потерплю неудачу?"
901010800310-29 = ""
901010800310-31 = ""
901010800310-32 = "Почему тебе вообще нужно нести её одной?"
901010800310-33 = "Потому что я не могу вечно позволять другим брать ответственность за мои поступ—"
901010800310-34 = ""
901010800310-39 = ""
901010800310-41 = "Но это не ТВОЯ ответственность. Это наша."
901010800310-42 = ""
901010800310-44 = ""
901010800310-45 = "...Ты права."
901010800310-46 = "Пока давай разбираться с тем, что перед нами, шаг за шагом."
901010800310-47 = "Склонность нашего лидера всё переосмысливать — её сильная сторона, но одновременно и слабость."
901010800310-48 = "Ага."
901010800310-49 = "Ты права. Сначала разберёмся с текущей ситуацией."
