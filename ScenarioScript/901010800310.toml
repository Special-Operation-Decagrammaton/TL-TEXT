901010800310-31 = ""
901010800310-32 = "E quem disse que você tem que aguentar tudo sozinha?"
901010800310-33 = "Mas eu não posso jogar o peso da minha liderança nas costas de vocês—"
901010800310-34 = ""
901010800310-39 = ""
901010800310-41 = "Não é uma responsabilidade só sua, Yukino. É de todas nós, juntas."
