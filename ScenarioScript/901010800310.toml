901010800310-20 = "Não, não é essa a questão..."
901010800310-21 = ""
901010800310-23 = ""
901010800310-24 = ""
901010800310-25 = "Ainda não tenho certeza... se sou capaz de carregar o peso da responsabilidade por todos esses casos."
901010800310-26 = "Mesmo revelando a verdade nua e crua como sempre fizemos, nem todos sairão satisfeitos ou em paz."
901010800310-27 = "E quando chegar o momento inevitável em que eu tiver que arcar com as consequências dessas escolhas—"
