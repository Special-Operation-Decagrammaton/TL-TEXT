[translation]
1012102-1 = "Дресс-код моря!"
1012102-5 = "Юкари прибыла!"
1012102-6 = "И всё же... раз мы встречаемся здесь, на вашем рабочем месте..."
1012102-7 = "А-а-а! Ой, вы заняты? Я вам мешаю?"
1012102-8 = "[s1] «Считай это консультациего студента.»\n[s2] «Я всё равно собирался сделать перерыв.»"
1012102-11 = "Ага! Понятно! Как удачно совпало!"
1012102-12 = "В последнее время я переживаю, что слишком часто навязываюсь другим."
1012102-13 = "...А! Вообще-то это одна из причин, почему я здесь!"
1012102-14 = "[s3] «Рассказывай подробнее.»\n[s4] «Ты говорила, что собираешься к морю?»"
1012102-17 = "Ха-ха! Пусть я, Юкари, ещё молода, но успела многое испытать. Море не должно стать для меня испытанием."
1012102-18 = "В прошлом я много раз плавала на круизных судах! Если честно, я... в каком-то смысле морячка."
1012102-19 = "[s] «Круизы...?»"
1012102-20 = "Да. Сесть на большой корабль или даже яхту, пообедать в ресторане, а потом отдыхать на палубе!"
1012102-21 = "Именно так и наслаждаются морем!"
1012102-22 = ""
1012102-25 = "А-А...? Разве это неправильно?"
1012102-26 = "Пункт назначения менялся, но обычно программа была именно такой."
1012102-27 = "Предстоящая поездка к морю чем-то отличается от привычного?"
1012102-28 = "Как и ожидалось! Сенсей, вы знаете всё. Я так рада, что спросила."
1012102-29 = "Тогда, пожалуйста, расскажете мне об этой «предстоящей поездке к морю»?"
1012102-30 = "Хм? Что я собиралась надеть...? Конечно, кимоно!"
1012102-31 = ""
1012102-33 = ""
1012102-34 = ""
1012102-35 = "О! Куда вы так срочно меня ведёте?"
1012102-37 = "Это... бутик?"
1012102-38 = "Что? Купальник? Я не взяла его с собой, но..."
1012102-39 = "Как странно. Вы говорите так, будто мы собираемся заходить в воду. Какая нелепость!"
1012102-40 = "Да?"
1012102-41 = "Вы хотите сказать, что мы собираемся..."
1012102-42 = "...В море?"
1012102-43 = "[s5] «Ты не любишь плавать?»\n[s6] «Это... плохо?»"
1012102-46 = "Совсем наоборот! Я бы с радостью купила купальник!"
1012102-47 = "Понятно, хм... Это вам не отдых в семье Кадэнокодзи. Здесь всё нужно делать иначе!"
1012102-48 = "..."
1012102-49 = "В таком случае... как мне следует поступить?"
1012102-50 = "Просто выбрать купальник, который мне понравится...?"
1012102-51 = "И ВСЁ это — купальники? Не может быть!"
1012102-52 = "А-а! И правда! Они такие разные, такие стильные!"
1012102-53 = "То есть я могу выбрать любой, какой захочу?"
1012102-54 = "Хм-м! Какой же будет моим? ♪"
1012102-55 = "А! На этом оборки! Как мило!"
1012102-56 = "А этот такой яркий, и узор словно на изысканной бумаге для оригами..."
1012102-57 = "Тогда, эм... вот этот..."
1012102-58 = ""
1012102-60 = ""
1012102-61 = "...Вы уверены, что в таком вообще... законно появляться на людях?"
1012102-62 = "А-а! Сенсей, помогите! Как мне выбрать любимый?"
1012102-64 = "После долгих раздумий Юкари наконец выбрала купальник."
1012102-65 = ""
1012102-68 = "Сенсей...? Я его примерила..."
1012102-69 = ""
1012102-70 = ""
1012102-71 = "Он выглядит прилично? Я впервые надеваю что-то подобное..."
1012102-72 = "Вам не кажется, что тут... маловато ткани?"
1012102-73 = "Н-нет! Мне нравится! Я просто растерялась, потому что для меня всё это впервые."
1012102-74 = "Но, думаю... он мне подходит!"
1012102-75 = "В нём удобно двигаться, а сзади ткань так эффектно развевается, будто у меня выросли крылья."
1012102-76 = "А! Придумала."
1012102-77 = "Это как разнашивать новую пару обуви. Чем чаще я буду его носить, тем привычнее он станет!"
1012102-78 = "Значит, ради практики я буду ходить в нём до самого дома!"
1012102-79 = "[s7] «Юкари, нет!»\n[s8] «Он только для бассейна и моря!»"
1012102-82 = "Да?"
1012102-83 = "..."
1012102-84 = "Ага! Теперь я всё поняла!"
1012102-85 = "Значит, это морской дресс-код! Униформа!"
1012102-86 = "А поскольку я, Юкари, сегодня плавать не собираюсь, мне следует переодеться во что-нибудь более подходящее."
1012102-88 = "Юкари с улыбкой вышла из магазина в школьной форме... а купальник аккуратно лежал в пакете."
