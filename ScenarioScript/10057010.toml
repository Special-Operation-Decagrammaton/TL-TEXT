10057010-97 = "The feature article on the \"Red Bear.\" #nOf course, we don't believe it, but still."
10057010-98 = "Exactly! The \"Red Bear\" is full of nothing but shady rumors!"
10057010-99 = "Well, I heard there's no such thing as a complete lie, though..."
10057010-104 = "[ns9] (...)\n[ns10] (I need to ask Yakumo about this later.)"
10057010-109 = "A-ahahaha..."
10057010-112 = "I-I see... #nSo you had your own circumstances, Sensei."
10057010-113 = "Oh, excuse me. #nI haven't introduced myself yet."
10057010-117 = "I am Anna, the class representative of Special Class 183 and head of mechanical engineering. #nNice to meet you."
10057010-118 = "I am the Chief Activity Committee Member of the Red Winter Science Academy, a Federal Honorary Inventor, #nrecipient of the First-Class Beard Medal, and—"
10057010-119 = "So long! How long are you going to keep going!?"
10057010-120 = "Hi-hi! I'm Erina!"
