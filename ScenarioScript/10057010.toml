10057010-124 = "Huh~? #nI'm not jealous! If you like introducing yourself so much, why don't you just keep doing it forever!"
10057010-125 = "[s11] \"Special Class 183?\"\n[s12] \"Does that have anything to do with Special Class 227?\""
10057010-130 = "Class 227?"
10057010-131 = "What's that?"
