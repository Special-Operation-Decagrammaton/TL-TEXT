10057010-81 = "I'm glad Rana is safe, too."
10057010-85 = "Wait, so you're Sensei...?"
10057010-89 = "Wait, the Sensei from Schale!? For real!?"
10057010-90 = "[s7] \"Y-yes, that's me...\"\n[s8] \"Is it really that surprising...?\""
10057010-93 = "Whoa, no way!"
10057010-94 = "I thought you looked like someone I'd seen in a magazine... but I never imagined..."
10057010-95 = "Oh, right! Sensei, Sensei! Is \"that article\" true!?"
