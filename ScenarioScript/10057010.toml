[translation]
10057010-1 = "Episode 1;Special Class 183"
10057010-6 = "[ns1] \"Brr...\"\n[ns2] \"Are you sure this is the right way?\""
10057010-9 = "Yes. The direction is correct."
10057010-10 = "The problem is the distance. It will still take some time."
10057010-11 = "It is because I insisted..."
10057010-12 = "I am truly sorry, Sensei."
10057010-13 = "[s3] \"I-It is okay...\"\n[s4] \"It is not Lana's fault...\""
10057010-16 = "I will fire a flare..."
10057010-23 = "With this... someone should come to help us."
10057010-24 = "Assuming... they are looking..."
10057010-28 = "The wind is so strong..."
10057010-29 = "I am getting sleepy..."
10057010-34 = "[ns5] \"Do not fall asleep... absolutely...\"\n[ns6] \"I will be your windbreak...\""
10057010-40 = "(Sleepy...)"
10057010-53 = "Hey, wake up."
10057010-54 = "Whoa?! I-I was not sleeping!"
10057010-55 = "Hah... As soon as I turn on the heater, you fall right asleep."
10057010-56 = "I was not sleeping! Uh, what was it... Oh, right! I was just playing dead!"
10057010-60 = "Unknown Place"
10057010-63 = "Where is Lana?"
10057010-64 = "She woke up a bit ago and went to wash her face~"
10057010-65 = "She went out shopping and I thought she would not be back for a while... Why did she come back with a stranger?"
10057010-66 = "This person... they give me a-a de... deja..."
10057010-67 = "\"Deja vu?\""
10057010-68 = "That is it! Does this not give you major deja vu?"
10057010-69 = "Now that you mention it, it feels like I have seen them somewhere before... Who could it be..."
10057010-74 = "[ns] \"I am Schale's Sensei...\""
10057010-76 = "W-Whaaaaaat?!"
10057010-77 = "W-Were you awake?!"
10057010-78 = "You startled me~! Are you okay now?"
10057010-79 = "[s] \"Yeah, my body warmed up so I am fine.\""
10057010-80 = "When I rushed over after seeing the flare and found you passed out in the snow with Lana, I was truly shocked."
10057010-81 = "I am glad Lana is safe too."
10057010-85 = "Wait, you are Sensei...?"
10057010-89 = "Um, Schale's Sensei?! Really?!"
10057010-90 = "[s7] \"Y-Yeah...\"\n[s8] \"Is it really that surprising...?\""
10057010-93 = "Whoa, no way."
10057010-94 = "I thought you looked like someone I saw in a magazine, but... no way..."
10057010-95 = "Oh, right! Sensei, Sensei! Is \"that article\" really true?!"
10057010-96 = "[s] \"W-Which article...?!\""
10057010-97 = "The feature article about the \"Red Bear.\" Of course, we do not believe it."
10057010-98 = "Totally! Articles about the \"Red Bear\" are all so sketchy!"
10057010-99 = "Well, I heard there are no outright lies in it, though..."
10057010-104 = "[ns9] (...)\n[ns10] (I need to ask Yakumo about this later.)"
10057010-109 = "Ah, ahahaha..."
10057010-112 = "I-I see... Sensei had your own circumstances as well."
10057010-113 = "Ah, excuse me. I have not introduced myself yet, have I?"
10057010-117 = "My name is Anna, class representative of Special Class 183 and head of mechanical engineering. A pleasure to make your acquaintance."
10057010-118 = "Chief activity committee member of Redwinter Academy, federal honorary inventor, recipient of the First Class Beard Medal, and--"
10057010-119 = "So long! How long are you going to keep going?!"
10057010-120 = "Hi-hii! I am Erina!"
10057010-121 = "Also from Special Class 183... acting as vice class representative and head of chemistry~! That is it!"
10057010-122 = "Aren't you glad your title was short?"
10057010-123 = "If you worked harder on your research, you could give an even longer self-introduction, you know?"
10057010-124 = "Hah~? I am not jealous! If you like self-introductions so much, you should just keep doing them!"
10057010-125 = "[s11] \"Special Class 183?\"\n[s12] \"Does it have any relation to Special Class 227?\""
10057010-130 = "Special Class 227?"
10057010-131 = "What is that?"
10057010-135 = "Achoo!"
10057010-136 = "Geez, that is what happens when you sleep without a blanket."
10057010-137 = "Ugh... Is someone talking about me?"
10057010-140 = "I know nothing about Special Class 227, but... we of Special Class 183 are Redwinter's premier research organization."
10057010-141 = "Redwinter's finest scientists gather here to develop all kinds of core technologies--"
10057010-142 = "Starting with screws and food... as well as electronic devices, electrical appliances, and various other things."
10057010-143 = "Hmph!"
10057010-145 = "[s] (They are so in sync...)"
10057010-148 = "Hey, let us show Sensei \"that\"!"
10057010-149 = "Eh, \"that\"?! Right now?!"
10057010-150 = "W-Well... we just met, so it might be a bit too early..."
10057010-151 = "Things like this... are better done after building some trust..."
10057010-152 = "What are you talking about? We have to show it now! It is better to get them on our side early!"
10057010-153 = "N-No! It is still a bit embarrassing!!"
10057010-154 = "Come on, resolve yourself! Showing it will not take anything away from you!"
10057010-159 = "Sensei! Please take my hand and follow me with your eyes closed!"
10057010-160 = "[s] \"Eh? O-Okay...?\""
10057010-164 = "N-No way!! Please wait a moment!!"
10057010-170 = "Sensei~, not yet~!"
10057010-171 = "Hey, let us just call it off!"
10057010-172 = "Geez, how long are you going to keep complaining? Hurry up and get ready!"
10057010-173 = "Ugh, I am done with you!!"
10057010-177 = "Sensei, you can open them now!"
10057010-178 = "Please try not to fall over from shock, okay?"
10057010-179 = "[ns13] (Opens eyes timidly)\n[ns14] (Has no choice but to open eyes)"
10057010-184 = "[ns] \"What is this?\""
10057010-186 = "Ta-da!! What do you think? Amazing, right!"
10057010-187 = "Showing it in this state is only going to let them down...! Geez!"
10057010-188 = "No way! Hey, Sensei! You know what this is, right?"
10057010-189 = "[s15] \"Hmm... A cool tractor... perhaps?\"\n[s16] \"Ah... Amazing, an armored vehicle... perhaps?\""
10057010-194 = "How rude!"
10057010-195 = "How on earth does that look like anything other than a tank!"
10057010-196 = "This is why laymen are the worst!"
10057010-197 = "[s] \"A tank...?\""
10057010-198 = "Yes, it is a tank currently under construction by us."
10057010-199 = "This is the hull, and we just need to install the turret..."
10057010-200 = "This is already enough! Sensei should understand!"
10057010-201 = "[s] \"Looking at it again... it is really cool!\""
10057010-205 = "Right?!"
10057010-206 = "I was thinking of slanting the turret armor so shells would slide off, increasing defense."
10057010-207 = "Huh? But we discussed making it hemispherical because slanting it would make the interior too cramped!"
10057010-208 = "Eh? Did we?"
10057010-209 = "Don't play dumb with me~!"
10057010-216 = "Sensei."
10057010-217 = "[s17] \"Lana! Is your health okay?\"\n[s18] \"What on earth is this...?!\""
10057010-220 = "That was an \"exchange of opinions.\""
10057010-221 = "We have two more rounds until \"persuasion.\""
