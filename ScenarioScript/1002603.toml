[translation]
1002603-1 = "Маленькая просьба"
1002603-2 = "Нэру позвала меня в небольшой спортзал на окраине Миллениума."
1002603-3 = "Наверное, из-за того, что место было маленьким и труднодоступным, вокруг не было видно ни души."
1002603-4 = "Тц."
1002603-5 = "[s] «...?»"
1002603-6 = "Э-Эм. Ах!"
1002603-7 = "Тц. Опять."
1002603-8 = "[s] «...?»"
1002603-9 = "Да как этим вообще пользоваться?!"
1002603-10 = "У всех остальных вроде получается без проблем."
1002603-11 = "Ай... Я опять поранилась?"
1002603-12 = "[s1] «Нэру?!»\n[s2] Поспешить на звук."
1002603-15 = ""
1002603-21 = ""
1002603-22 = ""
1002603-23 = "[ns] «Нэру?»"
1002603-24 = "А? Сенсей?"
1002603-25 = "Вы добрались быстрее, чем я ожидала. Вы принесли то, что я просила, да?"
1002603-26 = "А? Не поранилась ли я?"
1002603-27 = "*вздох* Вы вообще меня слушали, Сенсей? Я же сказала не переживать!"
1002603-28 = "Просто немного содрала кожу на ноге. Ничего серьёзного."
1002603-29 = "А?!"
1002603-30 = "Хотите знать, почему я в этом наряде? И как поранила ногу?"
1002603-31 = "По одному вопросу за раз, Сенсей!"
1002603-32 = "Ладно уж. Раз вы проделали такой путь, хотя бы отвечу."
1002603-33 = "Я просто тренируюсь."
1002603-34 = "Я обычно такое не ношу, но хочу выглядеть естественно, когда приходится."
1002603-35 = "А вдруг для работы придётся надеть что-нибудь подобное?"
1002603-36 = "Но эти туфли..."
1002603-37 = "Ненавижу эти туфли! Я почти их не ношу, но каждый раз это настоящая пытка."
1002603-38 = "Думала, может, смогу их разносить, а в итоге только ноги натёрла."
1002603-39 = "Теперь вы всё знаете. Ничего серьёзного, так что скорее дайте пластырь! Всё ещё щиплет."
1002603-40 = "Что? Вы хотите сами его наклеить?"
1002603-41 = "Хватит ерундой заниматься и просто дайте мне пластырь!"
1002603-42 = "Если я не разрешу вам наклеить его самому, вы просто уйдёте? Ч-Что за хрень?! Что с вами не так?"
1002603-43 = "То есть какого чёрта вы вообще это делаете?!"
1002603-44 = "..."
1002603-45 = "*вздыхает*"
1002603-46 = "Тц, ладно! Похоже, выбора у меня нет."
1002603-47 = "Делайте что хотите."
1002603-50 = "― Ч-Что? Почему вы так на меня смотрите?[wa:2980]"
1002603-53 = "― Да, ладно.[wa:1980]"
1002603-56 = "― Уже наклеили?"
1002603-58 = "― А. Хорошо. Спасибо.[wa:2250]"
1002603-61 = "[ns3] «Кстати...»\n[ns4] «Непривычно видеть тебя такой.»"
1002603-62 = "― Сразу говорю,[wa:760]"
1002603-63 = "― Сразу говорю,[wa:760]"
1002603-65 = "― Обычно я не прошу людей о таком.[wa:30]"
1002603-68 = "― Я попросила именно потому, что это вы, Сенсей.[wa:100]"
1002603-71 = "― Ну, ладно.[wa:1730]"
1002603-73 = "― Вы всё-таки странный человек, Сенсей.[wa:230]"
1002603-76 = "― Ну... как бы это сказать?[wa:5530]"
1002603-79 = "― Это само собой.[wa:10]"
1002603-81 = "― Никому ни слова об этом, ясно?![wa:300]"
1002603-84 = "Знаете, я тоже увидела совершенно новую вашу сторону, Сенсей."
1002603-85 = "Ваше лицо, когда вы внезапно ворвались в дверь!"
1002603-86 = "Это было зрелище! Ха-ха!"
1002603-87 = "Хмпф! Вам вообще-то полагается хоть немного смущаться."
1002603-88 = "Ну, как бы там ни было..."
1002603-89 = "Спасибо, что приехали сюда ради меня, Сенсей."
1002603-91 = "Проведя ещё немного времени с Нэру, я вернулся в Шале."
