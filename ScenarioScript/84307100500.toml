[translation]
84307100500-5 = ""
84307100500-6 = "С возвращением. Время выполнения оказалось ни быстрее, ни медленнее моих расчётов."
84307100500-7 = "Это комплимент или критика? Знаешь, когда человек возвращается с работы, надо сказать ему что-нибудь приятное!"
84307100500-8 = "...Это был комплимент..."
84307100500-9 = "Чтобы было ясно: я имела в виду, что ты закончила очень быстро, как для тебя обычно."
84307100500-10 = ""
84307100500-12 = ""
84307100500-13 = "Хех, прости."
84307100500-14 = "Теперь поняла, что ты имела в виду."
84307100500-15 = "В общем, лидера я сдала, и меня спросили: «А ты вообще что там делала?»"
84307100500-16 = "...И что ты ответила?"
84307100500-17 = "Если из-за этого у тебя могут быть проблемы, я могу подготовить для тебя железное алиби..."
84307100500-18 = "...Я просто сказала, что тусовалась там, потому что захотелось, и спросила, есть ли у них с этим проблемы."
84307100500-19 = "И что дальше?"
84307100500-20 = "В смысле «что дальше»? Я это сказала — и они заткнулись."
84307100500-21 = ""
84307100500-23 = ""
84307100500-24 = "...Понятно."
84307100500-25 = "Эй, тебе это снаряжение прямо сейчас обратно не нужно, да? Я попользовалась им там, и оно мне понравилось."
84307100500-26 = "Думаю, оставлю его у себя до конца всей этой истории. Ты не против?"
84307100500-27 = "Совсем не против. Именно это я и хотела услышать."
84307100500-28 = "Буду ждать нашей следующей совместной миссии, Нэру."
84307100500-29 = "Ого, ты посмотри на себя. Учишься."
84307100500-30 = ""
84307100500-32 = ""
84307100500-33 = "...Э-Это..."
84307100500-34 = "Комплимент. Правда."
