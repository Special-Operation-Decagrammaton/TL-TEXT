[translation]
10028020-1 = "Эпизод 2;Всё под контролем!"
10028020-7 = "*тяжело дышит* *тяжело дышит*"
10028020-8 = "М-Мне просто нужно... отдышаться..."
10028020-9 = ""
10028020-12 = ""
10028020-13 = "Мы успели... Мы правда успели. Хах..."
10028020-14 = ""
10028020-16 = ""
10028020-17 = ""
10028020-19 = ""
10028020-20 = "А-а! Сенсей! Вы совсем выдохлись. Всё хорошо? Ничего не растянули?"
10028020-21 = "[s1] «Н-Не волнуйся. Я в порядке...»\n[s2] «Возможно... мне пора... начать тренироваться.»"
10028020-24 = "Главное, что вы не ранены..."
10028020-25 = "Как это вообще случилось? Хасуми просила меня хорошо о вас позаботиться..."
10028020-26 = ""
10028020-28 = ""
10028020-29 = "Похоже, я действительно всё испортила. Простите."
10028020-30 = "...Всё в порядке? Я ценю, что вы так говорите, но..."
10028020-31 = "Не могу не расстраиваться, что наше путешествие начинается вот так."
10028020-32 = "Я всё ещё в шоке, насколько быстро всё пошло наперекосяк..."
10028020-33 = ""
10028020-35 = ""
10028020-36 = "Но, ну, по крайней мере мы не потеряли сумку!"
10028020-37 = "Похоже, тот спринт всё-таки стоил того! Хаха..."
10028020-38 = "[s3] «Именно. Главное, что мы успели.»\n[s4] «Для этих мест это довольно обычное дело.»"
10028020-41 = "Да! У меня всё полностью под контролем. Ахахаха!"
10028020-42 = "Нужно лишь забрать сумку из багажного вагона, а на следующей станции пересесть на линию до Тринити."
10028020-43 = "Хорошо, мы справимся. Нужно только вернуться сегодня вечером."
10028020-44 = ""
10028020-46 = ""
10028020-47 = "Конечно, ситуация далеко не идеальна, учитывая, что мы едем в Геенну, но могло быть и хуже!"
10028020-48 = ""
10028020-51 = ""
10028020-52 = "...?"
10028020-53 = "Эй. Глянь на форму. Разве это не Тринити? Какого чёрта ребёнок из Тринити здесь делает?"
10028020-54 = "Это не просто студент Тринити. Такие нарукавные повязки носят только члены Спецотряда правосудия."
10028020-55 = "Что коп из Тринити забыл так далеко отсюда? Нам мало собственной полиции Геенны."
10028020-57 = ""
10028020-59 = ""
10028020-61 = ""
10028020-63 = ""
10028020-65 = ""
10028020-68 = ""
10028020-69 = ""
10028020-70 = "Эм..."
10028020-71 = "Мне кажется, или здесь немного напряжённо?"
10028020-72 = "Наверное, не стоило говорить, что могло быть хуже..."
10028020-73 = "[s5] «Эти ребята явно не рады видеть офицера...»\n[s6] «Тринити и Геенна, мягко говоря, не в лучших отношениях.»"
10028020-76 = "Эй! В поезде не шуметь! Что тут происходит?"
10028020-77 = ""
10028020-79 = ""
10028020-80 = "Опять вы, хулиганы из Геенны! Вам вообще возможно хоть раз спокойно проехать на поезде? А? Хотя бы один раз?!"
10028020-83 = ""
10028020-84 = "А? Вы не те, кого я ожидала увидеть."
10028020-85 = "Что студент Тринити здесь делает? Этот поезд вообще-то идёт в Геенну."
10028020-86 = ""
10028020-88 = ""
10028020-89 = "Уф, мне всё равно. Ваша потеря. Или приобретение. Не моё дело. Мне просто нужно увидеть билет."
10028020-90 = "Б-Б-Билет?! Ну, у нас его нет, но..."
10028020-91 = "Вы сели в этот поезд без билета?"
10028020-92 = "А вы, странный взрослый? Тоже без билета?!"
10028020-93 = "Это что, шутка? Розыгрыш?"
10028020-94 = "Понимаю, выглядит плохо, но я могу объяснить."
10028020-95 = "А. Понятно, что здесь происходит."
10028020-96 = "«Это всего лишь убогий старый поезд до Геенны. Всё равно тут бардак.»"
10028020-97 = "...?"
10028020-98 = "А?"
10028020-99 = "Вот что вы подумали, да?! Поезд до Геенны наверняка набит бесполезными работниками! Никто ни за что не отвечает!"
10028020-100 = "Я н-ничего такого вообще не говорила!"
10028020-101 = "Но именно это вы и думали! Поэтому решили, что можно просто запрыгнуть внутрь как ни в чём не бывало и бесплатно прокатиться на нашем поезде!"
10028020-102 = "П-Пожалуйста, просто выслушайте... Мы не хотели проявить неуважение..."
10028020-103 = "А я всё равно оскорблена! Я точно знаю, что именно так вы, хитрые безбилетные зайцы, и думали!"
10028020-104 = "Ты тут буквально делаешь выводы из ничего..."
10028020-105 = "Даже если... Даже если...!!"
10028020-106 = "Даже если в этом поезде иногда хаос...! И у нас немного не хватает персонала...! Это не значит, что кто угодно может ездить бесплатно когда захочет!"
10028020-107 = "Я правда... ничего... такого... не говорила!"
10028020-108 = "Нет! Я больше не могу это терпеть! У нас, работников поезда, тоже есть права! Теперь даже студенты Тринити думают, что могут просто прийти и вытирать об нас ноги? Больше нет!"
10028020-109 = "*БИП* *БИП* ВОССТАНЬТЕ, МОИ ТОВАРИЩИ ПО ЭКИПАЖУ!"
10028020-110 = "Я обнаружила двух безбилетных зайцев, которые пытаются нас унизить и бесплатно прокатиться! Выполнить экстренную процедуру C!"
10028020-112 = ""
10028020-113 = "Безбилетники?! Уф! Вот же мелкие...!"
10028020-114 = "Опять?! Я больше этого не потерплю! Сровнять всё с землёй! Никакой пощады! Мы посадим в тюрьму каждого последнего безбилетника!"
10028020-115 = "ГОТОВЬТЕ ОРУЖИЕ!"
10028020-117 = ""
10028020-119 = ""
10028020-120 = "Эм..."
10028020-121 = "Э-эм..."
10028020-122 = "Это вообще реально происходит? Что, чёрт возьми, сейчас творится?"
10028020-123 = "Я..."
10028020-124 = ""
10028020-126 = ""
10028020-128 = "У меня... всё под контролем...?"
