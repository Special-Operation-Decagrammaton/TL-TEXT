[translation]
1010505-1 = "После выступления"
1010505-2 = "Выслушав историю, я отправился искать Мари, которая готовилась к выходу на сцену."
1010505-4 = "Да, а. ...Да. Всё готово."
1010505-5 = "Секундочку..."
1010505-6 = "...? Хм?"
1010505-7 = "С-Сенсей?! Что привело вас в такое место...?"
1010505-8 = "...Хм? Вы просто хотели убедиться, что всё идёт хорошо? А..."
1010505-9 = "М-м. Я не хотела заставлять вас волноваться. Простите."
1010505-10 = "[s1] «Вовсе нет. Не переживай.»\n[s2] «Я ещё и хотел посмотреть выступление.»"
1010505-13 = "Мне очень приятно это слышать, но..."
1010505-14 = "Хм?"
1010505-15 = "Где остальные? А. Сейчас здесь только я."
1010505-16 = "Похоже, идея в том, чтобы во время Карнавала устраивать небольшие внезапные концерты по всему Тринити."
1010505-17 = "Поэтому все разошлись по разным местам и проводят собственные выступления!"
1010505-18 = "[s3] «А, множество одиночных партизанских концертов.»\n[s4] «Хорошая идея. Куда ни пойдёшь — везде будет музыка.»"
1010505-21 = "...Хи-хи..."
1010505-22 = "Как же здорово. Я могу выступать перед всеми, и даже вы здесь, Сенсей."
1010505-23 = "Столько людей пришло, и всем весело..."
1010505-24 = "Стоит только об этом подумать..."
1010505-25 = "Т-Тут даже больше людей, чем я обычно вижу в комнате консультаций..."
1010505-26 = "...Эм..."
1010505-27 = "Надеюсь, я справлюсь..."
1010505-28 = "[s5] «Это лишь значит, что вокруг станет ещё больше счастья.»\n[s6] «Ты консультируешь СТОЛЬКО людей разом? Ничего себе!»"
1010505-31 = "Вы слишком добры ко мне..."
1010505-32 = "...Хи-хи."
1010505-33 = "А, уже пора. Простите, Сенсей. Мне нужно выходить."
1010505-34 = "Но... если захотите поговорить позже, когда концерт закончится..."
1010505-35 = ""
1010505-37 = ""
1010505-38 = ""
1010505-39 = "Н-Нет, забудьте. Не обращайте внимания. Я не хочу заставлять вас ждать всё это время!"
1010505-40 = "[s7] «Не переживай. Просто выходи и покажи им класс!»\n[s8] «Всё нормально, просто сосредоточься.»"
1010505-43 = "...!"
1010505-44 = "..."
1010505-45 = "...Да!"
1010505-48 = "После этого Мари вышла на сцену. Я ждал её за кулисами до самого конца концерта."
1010505-49 = "Даже из-за кулис выступление Мари выглядело таким же милым и светлым, будто я сидел среди зрителей."
1010505-50 = ""
1010505-53 = "А потом..."
1010505-54 = "...Сенсей!"
1010505-55 = ""
1010505-63 = "После концерта Мари вернулась за кулисы, и её голос звучал звонко и радостно."
1010505-66 = "― [log=마리 아이돌]Сенсей, вы меня дождались! [/log][wa:1320]"
1010505-68 = "― [log=마리 아이돌]Не могу поверить, что вы правда всё это время ждали меня здесь...[/log][wa:40]"
1010505-71 = "― [log=마리 아이돌]Эм... Вам было хорошо видно? [/log][wa:3880]"
1010505-73 = "― [log=마리 아이돌]Похоже, отсюда сцену почти не видно...[/log][wa:1330]"
1010505-76 = "― [log=마리 아이돌]Но я знаю, что вы всегда присматриваете за мной... [/log][wa:1960]"
1010505-78 = "― [log=마리 아이돌]Так что, наверное, вид не так уж и важен...[/log][wa:120]"
1010505-81 = "― [log=마리 아이돌]Я... хорошо выступила? Я была...[/log][wa:3000]"
1010505-83 = "― [log=마리 아이돌]Я была... настоящим... айдолом?[/log][wa:1650]"
1010505-86 = "[ns9] «Конечно! Я тобой горжусь!»\n[ns10] «Для всех ты всегда была айдолом.»\n[ns11] «Как твой первый фанат, я это гарантирую.»"
1010505-90 = "― [log=마리 아이돌]...![/log][wa:670]"
1010505-92 = "― [log=마리 아이돌]...Спасибо, Сенсей...![/log][wa:2140]"
1010505-95 = "― [log=마리 아이돌]...Хи-хи.[/log][wa:790]"
1010505-98 = "И всё закончилось хорошо."
1010505-99 = "После этого мы отлично провели время за разговорами."
