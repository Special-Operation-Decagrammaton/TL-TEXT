[translation]
11070-2 = "Эпизод 7;Новая угроза?"
11070-3 = "Комната Комитета по предотвращению закрытия"
11070-4 = "Отличная работа, все."
11070-5 = "Сэрика, ты в порядке?"
11070-6 = "Угу. Я в порядке. Лучше не бывает..."
11070-7 = "(пошатывается)"
11070-8 = ""
11070-9 = "(падает)"
11070-10 = "Сэрика!"
11070-11 = "Я отнесу её в медпункт."
11070-12 = ""
11070-15 = "Я бы больше удивилась, если бы она ВСЁ ЕЩЁ стояла после попадания артиллерийского снаряда Flak 41. Ей лучше отдохнуть."
11070-16 = "Если бы Сенсея не было рядом, всё могло закончиться гораздо хуже..."
11070-17 = "Ага-ага. Благодаря вам отследить Сэрику было проще простого, Сенсей. На вас всегда можно положиться! ☆"
11070-18 = "О, правда? Обычный рабочий день сталкера, да?"
11070-19 = "...Простите, все. Можно минутку внимания?"
11070-20 = "Я изучала детали танка, которые мы собрали после боя. Оказалось, они от незаконной модели, запрещённой в Кивотосе."
11070-21 = "Мне придётся покопаться глубже, но пока похоже, что Банда шлемов получила доступ к технике, которая обычно ей недоступна."
11070-22 = "Спорим, если проследить каналы поставок этих деталей, мы выясним, кому подчиняются эти хулиганы!"
11070-23 = "В точку. А заодно узнаем, почему мелкая преступная организация так одержимо преследует нашу школу..."
11070-24 = "Звучит разумно. Будем действовать осторожно и посмотрим, куда это нас приведёт."
11070-25 = ""
11070-26 = "Офис в высотном здании"
11070-27 = "..."
11070-28 = "И это всё, на что способна организованная преступная группа? Зря я снабдила их тактическим танком."
11070-29 = "Казалось бы, банда студентов должна суметь справиться с другими студентами. В таком случае мне просто придётся нанять более умелых профессионалов."
11070-30 = ""
11070-31 = "*звонок* *звонок*"
11070-32 = "*щелчок*"
11070-33 = "Здравствуйте. Решалы 68. Ваши деньги — наши преступления."
11070-34 = "У меня есть особое задание для вас, мои дорогие решалы."
11070-35 = "..."
11070-37 = "База Банды шлемов Ката-Ката"
11070-38 = ""
11070-39 = ""
11070-40 = "*тяжело дышит* *тяжело дышит*"
11070-41 = "Какого...?!"
11070-42 = "*пах* *пах* *пах* *тат*!"
11070-43 = "Гх!"
11070-44 = "...!"
11070-45 = ""
11070-46 = "(падает)"
11070-47 = "Хмф. Здесь чисто."
11070-48 = "У меня тоже всё готово, босс."
11070-50 = "Г-гх... Вы кто такие?"
11070-51 = "Хе-хе-хе."
11070-52 = ""
11070-53 = "(прижимает к ней винтовку)"
11070-54 = ""
11070-55 = "Гра-а! Вы мелюзга из Абидоса? Как вы смеете...?"
11070-56 = "Ой, прошу тебя. И это грязное вонючее логово вы называете своей базой? Жалкое зрелище."
11070-57 = "Ну да ладно. Не переживай, я избавлю тебя от страданий."
11070-58 = "Ч-что?!"
11070-59 = "Расслабься. Мы всего лишь пришли сообщить, что вы освобождены от обязанностей. Теперь Абидосом займёмся мы."
11070-60 = "Ч-что за...?! Да вы вообще кто такие?!"
11070-61 = ""
11070-62 = "*удар*"
11070-63 = "Гаааргх!"
11070-64 = "..."
11070-67 = "..."
11070-68 = "Решалы 68."
11070-69 = "Ваши деньги — наши преступления."
11070-72 = "Лучшие решалы во всём Кивотосе."
11070-74 = "(дверь открывается)"
11070-75 = "А?"
11070-76 = "Погодите... Сенсей?! Что вы здесь делаете?!"
11070-77 = "[s] «Пришёл узнать, как ты себя чувствуешь»."
11070-78 = "А. Я в порядке. Всё равно не стоит столько валяться без дела."
11070-79 = "Не хочу слишком беспокоить Аяне и остальных. К тому же мне ещё на подработку идти."
11070-80 = "Н-не нужно так обо мне беспокоиться! Правда, я в порядке."
11070-81 = "[s]«Это хорошо»."
11070-82 = "..."
11070-83 = "Эм, так... Кстати!"
11070-84 = "Д-дело в том..."
11070-85 = "Если подумать, я ведь так и не поблагодарила вас, Сенсей..."
11070-86 = "Т-так что... спасибо. За помощь и всё такое..."
11070-87 = "Но всё равно! Не думайте, что этим вы как-то решили проблемы нашей школы! Мы выплатим этот долг, даже если это будет последнее, что мы сделаем!"
11070-88 = "..."
11070-89 = "Ч-что?! Что это ещё за самодовольная ухмылка?!"
11070-90 = "*вздыхает* Ну и ну."
11070-91 = "Неважно... Увидимся завтра!"
11070-92 = "Сэн..."
11070-93 = "...Сенсей."
11070-94 = ""
11070-97 = "Следующий Эпизод; Мощь Решал 68"
