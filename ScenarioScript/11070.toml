[translation]
11070-2 = "Episódio 7;Uma Nova Ameaça?"
11070-3 = "Comitê de Contramedidas — Sala de Aula"
11070-4 = "Bom trabalho, pessoal."
11070-5 = "Serika-chan, você não se machucou?"
11070-6 = "Sim, eu tô bem. Olha só, tô inteirinha..."
11070-7 = "(Cambaleia...)"
11070-9 = "(Baque!)"
11070-10 = "Serika-chan!"
11070-11 = "Eu levo ela pra enfermaria."
11070-15 = "Ela levou um tiro de canhão antiaéreo Flak 41, seria estranho se conseguisse andar. Vamos deixar ela descansar bem."
11070-16 = "Quase aconteceu algo terrível. Se não fosse pelo Sensei..."
11070-17 = "Sim, sim! Graças ao Sensei, conseguimos rastrear o paradeiro da Serika-chan sem perdê-la de vista. Você é mesmo incrível! ☆"
11070-18 = "Pois é, então não era só um stalker qualquer, né?"
11070-19 = "...Além disso, pessoal, deem uma olhada nisto."
11070-20 = "Ao verificar as peças de tanque espalhadas que recolhemos durante o combate, descobrimos que são de um modelo ilegal cujo uso é proibido em Kivotos."
11070-21 = "Ainda precisamos investigar um pouco mais, mas... parece que a Gangue dos Capacetes possui armas que jamais conseguiria obter por conta própria."
11070-22 = "Se analisarmos a rota de distribuição dessas peças, vamos conseguir descobrir quem está por trás da Gangue dos Capacetes!"
11070-23 = "Sim. Talvez assim também fique claro por que meros arruaceiros estão mirando a nossa escola com tanta insistência."
11070-24 = "Certo, entendido. Vamos investigar isso com calma, então."
11070-26 = "Arranha-céu Comercial"
11070-27 = "..."
11070-28 = "...Então esse é o limite de arruaceiros de segunda categoria.#nMesmo depois de enviarmos um tanque de guerra principal, olha só esse fiasco."
11070-29 = "Hum... Nesse caso, olho por olho, aluna por aluna... não é?#nVamos contratar especialistas."
11070-31 = "(Trim-trim, trim-trim)"
11070-32 = "(Clac)"
11070-33 = "Alô, resolvemos qualquer problema. Aqui é a Faz-Tudo 68."
11070-34 = "Quero contratar um serviço, Faz-Tudo."
11070-35 = "..."
11070-37 = "Esconderijo da Gangue dos Capacetes Kata-Kata"
11070-40 = "Arf... arf..."
11070-41 = "Aaaah!!"
11070-42 = "(Ratatatatatatá!!)"
11070-43 = "Guh!!"
11070-44 = "!"
11070-46 = "(Baque)"
11070-47 = "Alô, alô, aqui já terminou~"
11070-48 = "Aqui também já está tudo sob controle, chefe."
11070-50 = "U-Ugh... Quem diabos são vocês...?"
11070-51 = "...Hehehe."
11070-53 = "(Pisa com força)"
11070-55 = "Uaaah!! N-Não pode ser, vocês são de Abydos?! Como ousam fazer isso conosco..."
11070-56 = "Ah, usar um lugar tão imundo e fedorento como esconderijo...#nVocês são mesmo patéticos."
11070-57 = "...Tudo bem. Eu vou libertar vocês desse trabalho."
11070-58 = "O-O quê?!"
11070-59 = "Em outras palavras, estão demitidos. A partir deste momento, Abydos fica por nossa conta."
11070-60 = "N-Não brinquem comigo! Afinal, quem são vocês...?!"
11070-62 = "(Pancada!!)"
11070-63 = "Aaaah!!"
11070-64 = "..."
11070-67 = "..."
11070-68 = "Nós somos a Faz-Tudo 68."
11070-69 = "Contanto que paguem bem, fazemos qualquer coisa..."
11070-72 = "Somos faz-tudo."
11070-74 = "(Porta se abrindo)"
11070-75 = "Ah..."
11070-76 = "U-Ué...? Sensei?! O-O que houve?"
11070-77 = "[s] \"Vim te visitar.\""
11070-78 = "...Ah, eu tô bem. Não posso ficar deitada aqui pra sempre."
11070-79 = "A Ayane-chan e todo mundo estão preocupados... e eu também preciso ir pro meu trabalho de meio período."
11070-80 = "P-Por isso, não precisa de visita nem nada! Olha só, tô cheia de energia!"
11070-81 = "[s] \"Que bom.\""
11070-82 = "..."
11070-83 = "E-Então!!"
11070-84 = "...É-É que..."
11070-85 = "Pensando bem, eu ainda não tinha agradecido direito ao Sensei..."
11070-86 = "O-Obrigada... por tudo..."
11070-87 = "...Mas olha! Não vai achando que ajudou Abydos só com isso, viu?!#nUm dia eu ainda vou pagar essa dívida com certeza!"
11070-88 = "..."
11070-89 = "O-O que foi?! Por que você tá com esse sorrisinho bobo?!"
11070-90 = "Ah, francamente..."
11070-91 = "Então... até amanhã!"
11070-92 = "Hum, Se..."
11070-93 = "...Sensei."
11070-97 = "Próximo;A Faz-Tudo Chegou!"
