[translation]
1301303-1 = "Зачем мы коллекционируем"
1301303-2 = "Чёрный рынок"
1301303-3 = "В итоге я помог нескольким студентам «Валькирии» патрулировать окрестности чёрного рынка..."
1301303-4 = ""
1301303-6 = ""
1301303-7 = "Спасибо за помощь, Сенсей."
1301303-8 = "Благодаря вам сегодняшнее патрулирование прошло спокойно."
1301303-9 = "[s] «Обращайся. Хотя я почти ничего не сделал.»"
1301303-10 = "Не говорите так! Одного вашего присутствия достаточно, чтобы работать стало легче."
1301303-11 = "Стоит разойтись слуху, что вы будете поблизости, как все преступники поджимают хвост и разбегаются!"
1301303-12 = "Конечно, всегда найдутся безрассудные нарушители, решившие испытать удачу."
1301303-13 = "Вот как она! Выходи!"
1301303-14 = ""
1301303-16 = ""
1301303-18 = ""
1301303-19 = ""
1301303-20 = "Уааа..."
1301303-21 = "[ns] «Момидзи?!»"
1301303-22 = ""
1301303-23 = "О! Вы знакомы с этим студентом, Сенсим?"
1301303-24 = "Понятно. В таком случае я передаю Акиизуми Момидзи под вашу ответственность, Сенсей."
1301303-25 = "Мне меньше бумажной работы!"
1301303-26 = ""
1301303-28 = ""
1301303-29 = "Наставление и наказание этой особы оставляю на вас, Сенсей!"
1301303-30 = ""
1301303-32 = ""
1301303-33 = "С-Спасибо, Сенсей!"
1301303-34 = "Если бы меня просто отправили обратно в Красную Зиму... За самовольное проникновение на чёрный рынок..."
1301303-35 = "Меня бы приговорили минимум к двум неделям уборки самых дальних и страшных туалетов..."
1301303-36 = "[s1] «Подумать только, Момидзи оказалась преступницей...»\n[s2] «Хотя я немного в тебе разочарован.»"
1301303-39 = "Н-Нет! Всё не так... То есть да, я была здесь!"
1301303-40 = "Но клянусь, я не делала ничего плохого. Пожалуйста, поверьте мне, Сенсей!"
1301303-41 = "Тогда что я здесь делаю...? А..."
1301303-42 = ""
1301303-44 = ""
1301303-45 = "Ну, я слышала слух, что на чёрном рынке видели одну из старых книг Луриэль."
1301303-46 = "Да... Те самые, которые я коллекционирую."
1301303-47 = "[s] «Хм... И ты нашла то, что искала?»"
1301303-48 = "Да! Причём в идеальном состоянии!"
1301303-49 = "Хи-хи-хи. Было опасно, страшно и дороже, чем я ожидала, но..."
1301303-50 = "Я так, так счастлива, что смогла её заполучить..."
1301303-51 = "А? Что делает её такой ценной?"
1301303-52 = "Эм... Я бы не сказала, что она ценная именно в таком смысле. Большинство людей вообще не придают ей особого значения."
1301303-53 = "Это всего лишь вторая опубликованная работа Луриэль, ещё до того, как она стала популярной. Поэтому экземпляров осталось немного."
1301303-54 = "Если ты не настоящий фанат... то даже не узнаешь, что её стоит искать."
1301303-55 = "[s3] «То есть она ценна именно для тебя.»\n[s4] «То есть это что-то вроде ограниченного коллекционного издания.»"
1301303-58 = "Именно! Значит, вы всё-таки понимаете, Сенсей."
1301303-59 = "ЧТО?! Вы потратили 100 000 иен на игрушечного робота-трансформера?!"
1301303-60 = "Ого... Это уже совсем другой уровень... Вот на что способны взрослые...? Какая сила...?"
1301303-61 = "[s5] «В общем... давай уйдём от этой крайне непедагогичной темы.»\n[s6] «Так ты собираешь вещи, связанные с Луриэль?»"
1301303-64 = "Мне просто нравится собирать её опубликованные работы. Признаю, увлечение довольно нишевое."
1301303-65 = "Почему? Ну..."
1301303-66 = ""
1301303-68 = ""
1301303-69 = "Во-первых, я член Фронта освобождения знаний. Я выполняю свой долг по сбору информации, отдавая книгам особый приоритет."
1301303-70 = "Старые издания часто потрёпаны или с загнутыми страницами, поэтому люди считают, что они почти ничего не стоят."
1301303-71 = "Но почему-то... именно такие вещи мне особенно нравятся."
1301303-72 = "Ведь книги созданы для того, чтобы их читали, верно? Если книгу любили, она и не должна выглядеть идеально новой."
1301303-73 = "[s] «Вообще-то меня очень тронула твоя преданность делу...»"
1301303-74 = "Н-Не нужно так уж растрогиваться, Сенсей!"
1301303-75 = "Есть ещё и проблема бюджета."
1301303-76 = "Конечно, кроме книг бывают и другие классные коллекционные вещи."
1301303-77 = "Но, как вы знаете, студенты Красной Зимы живут далеко не в лучших бытовых условиях."
1301303-78 = "Мне приходится внимательно следить за расходами, иначе это приведёт к бунтам и проблемам."
1301303-79 = "Из-за того, что мне приходится так тщательно выбирать, моя коллекция в итоге почти полностью состоит из работ, которые много для меня значат."
1301303-80 = "Я время от времени подаю в Секретариат заявки на дополнительные книги и другие издания."
1301303-81 = "Но их почти всегда отклоняют! Уф! Это так бесит!"
1301303-82 = "Хотя библиотека находится довольно далеко и мало кто вообще знает, где она..."
1301303-83 = "И посетителей здесь, прямо скажем, немного..."
1301303-84 = "Я всё равно хочу расширять выбор ради тех преданных студентов, которые всё-таки сюда приходят!"
1301303-85 = "*вздох* Но я уже поняла, что в жизни нельзя получить всё, чего хочется..."
1301303-86 = "[s] «Погоди, ты сказала, что подаёшь заявки на книги и другие издания для библиотеки вместе?»"
1301303-87 = "Д-Да. А что?!"
1301303-88 = "[s7] «Значит, среди заявок наверняка есть и книги, которые хочешь лично ты!»\n[s8] «То есть ты и коллекцию пополняешь, и студентам книги предоставляешь!»"
1301303-91 = ""
1301303-93 = ""
1301303-94 = ""
1301303-95 = ""
1301303-96 = "Прости меня... УААА!"
1301303-97 = "Вы правы! Я использую Секретариат и библиотеку ради собственной выгоды!"
1301303-98 = "Я ужасный библиотекарь! Как я вообще могу называть себя членом Фронта освобождения знаний?"
1301303-99 = "Когда остальные об этом узнают, они меня не простят..."
1301303-100 = "[s] «Это останется нашим маленьким секретом.»"
1301303-101 = "...Правда?"
1301303-102 = ""
1301303-104 = ""
1301303-105 = ""
1301303-106 = ""
1301303-107 = "Тогда получается, вы мой сообщник, да, Сенсей? Хи-хи-хи..."
1301303-109 = "Я вернулся в Красную Зиму, держа за руку смущённую, но почему-то очень счастливую Момидзи."
