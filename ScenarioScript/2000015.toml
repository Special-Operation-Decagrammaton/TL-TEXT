[translation]
2000015-1 = "Форма привязанности"
2000015-2 = "В Инженерном отделе стоял гул работ и обслуживания."
2000015-3 = "[ns] «Я пришёл, Хибики!»"
2000015-4 = ""
2000015-7 = "А, Сенсей. Секунду..."
2000015-8 = ""
2000015-11 = ""
2000015-12 = "Вот. Твой отремонтированный велосипед."
2000015-13 = "[s1] «Это... идеально.»\n[s2] «Спасибо, Хибики!»"
2000015-16 = "Я правда подумывала добавить несколько модификаций."
2000015-17 = "Но потом вспомнила, сколько раз ты прямо говорил мне «только ремонт», и остановилась."
2000015-18 = "Хотя очень хотелось поставить высокоскоростной гранатомёт или огнемёт. Исключительно ради безопасности, конечно..."
2000015-19 = "[s] «По-моему, это создаёт ещё больше угроз безопасности!»"
2000015-20 = "Ты хотя бы мог перейти на безвоздушные титановые шины."
2000015-21 = "Что ты будешь делать, если попадёшь на полосу с шипами? Обычные шины разорвёт в клочья."
2000015-22 = "[s3] «Нет, всё хорошо...»\n[s4] «Обычного велосипеда вполне достаточно...»"
2000015-25 = "Ну, если ты правда этого хочешь... на этот раз я уступлю."
2000015-26 = "[s] «Спасибо, что считаешься с моим мнением, Хибики.»"
2000015-27 = "Но... модификации — мечта любого инженера. Почему ты их так боишься?"
2000015-28 = "Думаешь, иногда лучше сохранить чистую форму...? Хм..."
2000015-29 = "В этом есть своя красота, и я могу её уважать. Сохранение изначального облика тоже имеет смысл."
2000015-30 = "Однако! Добавлять новые функции модификациями — тоже прекрасно! Довести эффективность до предела..."
2000015-31 = "Да и неудобно таскать с собой целый зоопарк инструментов. Разве не лучше объединить несколько функций в одном?"
2000015-32 = "Чем больше думаю, тем сильнее хочется всё-таки прокачать твой велосипед."
2000015-33 = "[s5] «Я начинаю понимать твою точку зрения.»\n[s6] «Кажется... ты меня убеждаешь? Пожалуйста, продолжай...»"
2000015-36 = "Хи-хи. Вот теперь ты понимаешь, Сенсей!"
2000015-37 = "Например... Сейчас..."
2000015-38 = ""
2000015-40 = ""
2000015-41 = "А, да. Полюбуйся на этих красавцев."
2000015-42 = ""
2000015-44 = ""
2000015-46 = "[ns] «Это... твои очки, Хибики?»"
2000015-47 = "Можно сказать и так. Но после бесконечных модификаций..."
2000015-48 = "...они стали бесценным шедевром. Воплощением универсальности и функциональности."
2000015-49 = "Теперь у них столько применений, что без них моя работа серьёзно пострадала бы."
2000015-50 = "[s] «Гордость мастера, значит.»"
2000015-51 = ""
2000015-53 = ""
2000015-54 = "Именно. Разумеется, их базовая функция — защита глаз."
2000015-55 = "Но не только от искр при сварке. Они выдерживают и песчаные бури в пустыне, и давление воздуха при свободном падении."
2000015-56 = "Эти очки также защищают от синего света, ультрафиолета и пуль."
2000015-57 = "А функция увеличения очень полезна, когда я шью."
2000015-58 = "[s] «Шьёшь... костюмы для косплея?»"
2000015-59 = "Именно. Любой хороший косплей начинается с шитья."
2000015-60 = "От раскроя ткани до обработки швов — каждый раз нужно выбирать и применять подходящий метод."
2000015-61 = "Даже на современных швейных машинах снова и снова прокладывать плотную строчку на маленьком участке — настоящая проверка чувств. Идеальное зрение необходимо."
2000015-62 = "Поэтому я добавила 15-уровневую мультифокальную линзу. На максимуме можно рассматривать швы и ткань буквально на молекулярном уровне."
2000015-63 = "[s7] «Ты слышала выражение „избыточная мощь“?!»\n[s8] «Зачем при шитье молекулярное зрение?!»"
2000015-66 = "Технически мне оно пока ни разу не понадобилось, но важно знать, что такая возможность есть."
2000015-67 = "Сможешь угадать другие функции, Сенсей?"
2000015-68 = "[s] «Предположу... что-нибудь боевое?»"
2000015-69 = "Хи-хи. В точку. Я добавила функцию наведения, включая GPS."
2000015-70 = "С этими очками тебе больше никогда не понадобится отдельный оператор для стрельбы из миномёта."
2000015-71 = "Инфракрасная навигация? Конечно. Ночные операции не проблема."
2000015-72 = "Клянусь гордостью мастера: я добавила все возможные функции, которые могут понадобиться студенту."
2000015-73 = "[s] «Тогда у этих очков ещё есть...»"
2000015-75 = "[ns] «...твоя любимая функция? Самоуничтожение?»"
2000015-76 = ""
2000015-77 = "О-Ох... Эм... Самоуничтожение...?"
2000015-78 = "[s] «Это же обязательная модификация для любого изобретения, правда?»"
2000015-79 = "Эм... В этих очках..."
2000015-80 = "Нет, систему самоуничтожения я не устанавливала."
2000015-81 = "Ты прав, обычно мастер почти автоматически добавляет её в свои изобретения."
2000015-82 = "Но... почему-то с этим конкретным шедевром такого желания у меня не было."
2000015-83 = "..."
2000015-84 = "Не могу объяснить. Может, я ещё не до конца прониклась настоящим мышлением мастера."
2000015-85 = ""
2000015-88 = "[ns] «Кажется, я знаю почему.»"
2000015-89 = "Почему?"
2000015-90 = "[s9] «Потому что эти очки тебе дороги, Хибики.»\n[s10] «Ты просто не хотела даже думать, что они могут взорваться.»"
2000015-93 = "..."
2000015-94 = "Вы правы, Сенсей."
2000015-95 = "Я пользуюсь этими очками уже... очень давно."
2000015-96 = "Сначала мне просто нравился их внешний вид. Но потом я вложила в них много труда, модифицируя каждый раз, когда возникала необходимость."
2000015-97 = "За всё это время..."
2000015-98 = "Ты прав. Где-то по пути они стали мне действительно дороги."
2000015-99 = "Именно эти чувства... остановили меня от установки самоуничтожения."
2000015-100 = "Я не хотела даже допускать ситуацию, в которой они могут взорваться. Наверное, я действительно к ним привязалась."
2000015-101 = "Даже если бы я никогда не использовала эту функцию, сама мысль мне неприятна."
2000015-102 = "[s11] «Ага. Надеюсь, они останутся с тобой столько, сколько захочешь.»\n[s12] «И не взорвутся.»"
2000015-105 = "...Да. Я тоже надеюсь."
2000015-106 = ""
2000015-108 = ""
2000015-109 = ""
2000015-110 = "[ns] «Хибики?»"
2000015-111 = "Хм... Ничего."
2000015-112 = "Я просто подумала..."
2000015-113 = "Тебе тоже не нужна функция самоуничтожения, Сенсей."
2000015-114 = "[s] «Разве это не очевидно?!»"
2000015-116 = "Так что, пожалуйста, оставайся со мной столько, сколько я захочу."
