[translation]
10025090-1 = "Эпизод 9;Кролики в воде"
10025090-2 = ""
10025090-3 = "Быстрее! Шевелитесь!"
10025090-4 = "Мы должны заменить всё содержимое ящиков с креветками, пока туман не рассеялся!"
10025090-5 = "Есть, капитан!"
10025090-7 = "Хорошо, что туман такой густой. Можно не бояться, что местные увидят нас на палубе..."
10025090-8 = "Хотя немного не по себе от того, что и деревню не видно, но..."
10025090-9 = "Если возникнут проблемы, раскрутим двигатель и уйдём в открытое море."
10025090-10 = ""
10025090-13 = ""
10025090-14 = "Эй, Босс — то есть Капитан. Что делать со всеми этими креветками?"
10025090-15 = "Зачем ты отвлекаешь меня такими бесполезными вопросами?"
10025090-16 = "Это всего лишь креветки. Выброси обратно в море."
10025090-17 = "Как-то расточительно, не? Столько совершенно нормальных креветок."
10025090-18 = "Мама всегда говорила, что еду выбрасывать плохо..."
10025090-20 = "Не упускай главную цель. Никогда не разбогатеешь, если переживать о такой ерунде, как «расточительство.»"
10025090-22 = "К тому же, когда закончим здесь, будем на каждый приём пищи есть лучшего красного пагра."
10025090-23 = "Не трать время на переживания о дешёвом мусоре вроде креветок."
10025090-24 = "Честно говоря, я вообще не понимаю людей, которые тратят время на поедание этих странных морских жуков..."
10025090-25 = "Понял..."
10025090-26 = ""
10025090-28 = ""
10025090-30 = "Капитан, к нам кто-то приближается. Маленькая резиновая лодка."
10025090-31 = "Что делать? Просто проигнорировать?"
10025090-32 = "Кто, чёрт возьми, в деревне Ятоура осмелился приблизиться к Стигийскому кораблю...?"
10025090-33 = "Трудно сказать, но, похоже, они не местные... Они все в... купальниках...?"
10025090-34 = "Опять эти туристки."
10025090-36 = "Машинное отделение, полный вперёд. Хочу увеличить дистанцию между нами и этими любителями совать нос не в своё дело."
10025090-37 = "Полный вперёд—"
10025090-39 = ""
10025090-42 = "Взрыв...? Что, чёрт возьми, происходит?!"
10025090-43 = "Какой-то удар под корпусом... Винты не отвечают!"
10025090-44 = "Почему это происходит ИМЕННО СЕЙЧАС...?"
10025090-45 = "Полный стоп. Переходите на ручное управление и вытаскивайте нас отсюда!"
10025090-46 = "Ничего не работает... Думаю, винты разнесло на куски!"
10025090-47 = "Мы ведь не врезались в риф?"
10025090-48 = "Капитан, лодка... Она ускоряется!"
10025090-49 = "Гах...!"
10025090-51 = "К оружию, команда! Сейчас нас возьмут на абордаж!"
