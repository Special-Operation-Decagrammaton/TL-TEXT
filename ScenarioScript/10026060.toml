10026060-27 = "Похоже, остальные ещё не совсем закончили... Давайте подождём их здесь, хорошо?"
10026060-28 = "Вы очень помогли, Сенсей. Ещё раз спасибо."
10026060-29 = ""
10026060-32 = "Подождите... Вы это слышали? Вон! У деревьев..."
