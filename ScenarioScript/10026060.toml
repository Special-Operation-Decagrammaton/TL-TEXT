[translation]
10026060-1 = "Эпизод 6;Участок D: Забытый маяк"
10026060-3 = "По одной сумке за раз..."
10026060-4 = "Оп-ля..."
10026060-5 = "Фух! Не ожидала, что внутри маяка они найдут столько всего для исследования."
10026060-6 = "Удивительно, что древний Совет, который пользовался этим местом, оставил после себя так много..."
10026060-7 = "О!"
10026060-8 = "Сенсей? Давно вы здесь? Я думала, вы внутри с остальными..."
10026060-9 = "[s1] «Я подумал, тебе может пригодиться помощь, Хината.»\n[s2] «Похоже, таскать весь этот багаж одной тяжело.»"
10026060-12 = "А, в-всё хорошо! Вам не нужно делать это за меня!"
10026060-13 = "Я ведь постоянно говорю, что мне нравится заниматься такими вещами. Просто оставьте это мне!"
10026060-14 = "Или вы потому не можете пройти мимо, что вы Сенсей?"
10026060-15 = "Что значит «дело не в этом»?"
10026060-16 = "...Хи-хи."
10026060-17 = "Хорошо, я понимаю, почему вы так сказали. Наверное, спорить не стоит."
10026060-18 = "Тогда спасибо. Можете помочь с маленькими сумками вон там."
10026060-19 = "Большие... очень тяжёлые. Так что оставьте их мне."
10026060-20 = ""
10026060-22 = ""
10026060-23 = "Вот. Пойдём?"
