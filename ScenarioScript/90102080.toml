[translation]
90102080-1 = "Episode 8;Looking for a Friend"
90102080-3 = "Eh? You met Miyako-chan?"
90102080-4 = "You met... Miyako-chan?"
90102080-5 = "Miyako!?"
90102080-9 = "Yeah. I ran into her while asking around at the station."
90102080-10 = "By pure chance, the Tsukiyuki platoon leader seems to be investigating this disappearance case as well."
90102080-11 = "Thanks to that, we got the opportunity to make contact with a student who claims to have witnessed that train."
90102080-12 = "Once we hear what they have to say, we might find a lead."
90102080-13 = "I see... But you know... I'm kind of a little disappointed."
90102080-14 = "We've made progress, so what's there to be disappointed about?"
90102080-15 = "About Miyako! I wanted to talk to her, too..."
90102080-16 = "Me too. It feels like it's been ages since we last spoke directly with the RABBIT platoon."
90102080-17 = "I wonder how our timid little sniper is doing~"
90102080-18 = "I share your desire to see them, but we're in the middle of an operation right now."
90102080-19 = "Let's finish the operation first, and then we can go say hello properly."
90102080-20 = "That's right. Once everything is over, I'm sure we'll have the chance to talk."
90102080-21 = "Both about our past, and our future."
90102080-27 = "Um..."
90102080-28 = "I came after hearing from Miyako-san...#nAre you seniors who run the Problem Solver business?"
90102080-29 = "So you're the one who asked us to find your missing friend?"
90102080-30 = "Leave it to us. Since our underclassman introduced you, we'll search with everything we've got."
90102080-31 = "First... let's hear the story about your missing friend."
90102080-32 = "Y-Yes!"
90102080-35 = "Takahashi and I have been together ever since we were little."
90102080-36 = "We lived in the same town, attended the same academy, and always went to school and back together."
90102080-37 = "But the Hyacinth Academy we attended suddenly closed down...#nAnd we were separated into different academies."
90102080-38 = "Come to think of it, I feel like I saw an article about that before."
90102080-39 = "Why was it shut down?#nIt's not like there was a shortage of students, right?"
90102080-40 = "I don't know all the details, but it seems there were issues with their financial situation."
90102080-41 = "The number of incoming students kept dropping, and the academy's management went downhill..."
90102080-42 = "Since Hyacinth Academy was a private institution run for the foundation's profits, the student council apparently couldn't find a legitimate excuse to oppose it."
90102080-43 = "Looking back now, it's just full of regrets.#nI keep wondering if there was something I could have done to stop the academy from closing..."
90102080-44 = "Right... Having your academy suddenly disappear is impossible to accept, of course."
90102080-45 = "I totally get it... We felt pretty much the same way."
90102080-46 = "Don't tell me... the academy you all attended was closed down, too?"
90102080-47 = "Closed down, or rather..."
90102080-48 = "It's a bit complicated to explain..."
90102080-49 = "So, when did your friend go missing?"
90102080-50 = "Ah, yes.#nUhm, it was last Friday."
90102080-51 = "Actually, I hadn't been in touch with Takahashi until recently.#nI was too busy trying to get used to my new academy... so it got harder to meet, and we talked less."
90102080-53 = "But on Friday night, I suddenly received a message saying, 'The train to the past has arrived.'"
90102080-54 = "I asked what she meant, but there was no reply...#nAnd just like that, Takahashi went missing."
90102080-56 = "A longtime friend suddenly vanishing... you must be worried."
90102080-57 = "I am worried, but... the contents of that message keep weighing on my mind."
90102080-58 = "If she really did ride a train to the past and vanish from the 'present'—"
90102080-59 = "Then maybe Takahashi wasn't satisfied with her life right now."
90102080-60 = "[s] \"Why do you think that?\""
90102080-61 = "Because I... sometimes wish I could go back to the past, too."
90102080-63 = "Like when I try to avoid everyone's gaze and eat lunch all by myself in an empty classroom."
90102080-65 = "Like when I tasted a new crepe shop and thought it couldn't hold a candle to the crepes of my memories."
90102080-67 = "Like when the season comes around, red spider lilies bloom all at once, and I start to miss the path to school dyed in a blazing red."
90102080-69 = "At times like those, I want to go back to the past and make a different choice."
90102080-70 = "If I had just been a bit more proactive, the academy might not have vanished..."
90102080-71 = "If only I had kept in touch with Takahashi more often... maybe she wouldn't have disappeared... or so I think."
90102080-72 = "That is nothing more than a meaningless hypothesis."
90102080-73 = "The past is the past. It is something that has already come and gone."
90102080-74 = "Then... do you all really not have any?"
90102080-75 = "A past you want to go back to... Not even a shred of regret for the decisions you've made?"
90102080-76 = "That is..."
90102080-80 = "This is all your fault, isn't it!?"
90102080-81 = "An operation for the citizens? You've got to be kidding me!#nI suffered damages because of that operation!"
90102080-84 = "Why do I have to be the only one to make sacrifices!? I'm a citizen, too! Somebody help me!"
90102080-85 = "...We should have just left this case alone."
90102080-91 = "[ns] \"No matter how painful the present is, the past won't come back.\""
90102080-93 = "I... I know that."
90102080-94 = "But when the present gets too tough and painful... I can't help but look back."
90102080-95 = "Do you think looking back... and agonizing over it are meaningless?"
90102080-96 = "[s1] \"It doesn't mean you shouldn't look back at the past.\"\n[s2] \"Because memories and experiences are what push us forward.\""
90102080-102 = "[ns] \"But we're living in the present, right?\""
90102080-103 = "What do you... mean by that?"
90102080-104 = "[s3] \"Even if you retrace your steps from the past, you still have to pass through the 'present' in the end.\"\n[s4] \"If you turn away from the 'present', you won't be able to take a single step toward the future.\""
90102080-107 = "There are countless examples outside of the manual where people got intoxicated by past victories and failed, after all."
90102080-108 = "It would completely defeat the purpose if yesterday's experience caused today's operation to fail."
90102080-109 = "But if Takahashi really did go back to the past..."
90102080-110 = "[s] \"Is it okay to leave your precious friend stranded in the past?\""
90102080-111 = "N-No, it's not!#nThere are so many reasons why I have to meet Takahashi again!"
90102080-112 = "I want to talk about all the things we couldn't talk about until now, go to that new crepe shop together..."
90102080-116 = "...And I want to apologize for not being able to stay in touch."
90102080-117 = "Alright, then it's settled."
90102080-118 = "You also saw a suspicious train at the station, right?"
90102080-119 = "Yes. Three days ago after school, when I went to Kawanishi Station to look for clues,#na train that wasn't on the timetable and shouldn't have been there arrived."
90102080-120 = "...It was a train I knew very well, one I recognized instantly."
90102080-121 = "It was—the train bound for Hyacinth Academy that I used to take to school."
90102080-122 = "Was there anything suspicious about it?#nLike a different train number, or a different interior layout?"
90102080-123 = "It happened in the blink of an eye, so I'm not entirely sure...#nBut it was strange that nobody was on board."
90102080-124 = "Kawanishi Station is a transfer station, so even at late hours, there's always at least one or two people riding."
90102080-125 = "Yet there wasn't a single person on that train... It gave me the creeps, so I couldn't bring myself to board it."
90102080-126 = "Could it be that it only appears in front of students from Hyacinth Academy?"
90102080-127 = "Maybe so.#nWe don't have any emotional attachment to that line, nor do we know what it looks like."
90102080-128 = "Rua is such a pain, seriously. Even though we waited on the platform all night the day before yesterday, it didn't show up at all."
90102080-129 = "That might be precisely why it's called an inexplicable phenomenon."
90102080-130 = "Still, does this mean we've cleared the conditions for the train's appearance... for now?"
90102080-131 = "Could you come to the Kawanishi Station platform with us again tonight?"
90102080-132 = "I don't mind, but... um, what are you going to do?"
90102080-133 = "Don't worry. It's nothing major."
90102080-135 = "...Let's go face our happy past."
90102080-137 = "Next Episode;Express Train for Private Hyacinth Academy"
