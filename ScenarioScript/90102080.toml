[translation]
90102080-1 = "Эпизод 8;Ищу подругу"
90102080-2 = ""
90102080-3 = "Э? Ты встретила Мияко?"
90102080-4 = "Мияко?.."
90102080-5 = "Мияко!?"
90102080-6 = ""
90102080-8 = ""
90102080-9 = "Ага. Я наткнулась на неё, когда опрашивала людей на станции."
90102080-10 = "Оказалось, командир отряда [ruby=つきゆき]Цукиюки[/ruby] тоже, по случайности, расследовала это дело об исчезновениях."
90102080-11 = "Благодаря этому удалось получить возможность связаться со студентом, которая, как говорят, видела тот самый поезд."
90102080-12 = "Если поговорим с ней, может, найдём зацепку."
90102080-13 = "Вот как... но всё же... как-то немного обидно."
90102080-14 = "Есть прогресс, так чему ты огорчаешься?"
90102080-15 = "Из-за Мияко! Я тоже хотела с ней поговорить..."
90102080-16 = "Я тоже. Кажется, прошло уже много времени с тех пор, как мы напрямую говорили с отрядом RABBIT."
90102080-17 = "Интересно, как поживает та робкая снайперша~"
90102080-18 = "Я тоже сожалею, но сейчас мы на операции."
90102080-19 = "Когда операция закончится, сходим поздороваться."
90102080-20 = "Точно. Когда всё закончится, обязательно будет возможность поговорить."
90102080-21 = "И с нашим прошлым, и с будущим."
90102080-22 = ""
90102080-24 = ""
90102080-26 = ""
90102080-27 = "Эм..."
90102080-28 = "Я пришла, услышав о вас от Мияко...#nВы те, которые занимаются решением проблем?"
90102080-29 = "Это ты просила найти пропавшую подругу?"
90102080-30 = "Положись на нас. Раз уж это по рекомендации младшей, будем искать изо всех сил."
90102080-31 = "Сначала... расскажи нам о пропавшей подруге."
90102080-32 = "Д-да!"
90102080-35 = "С Такахаси мы были вместе с самого детства."
90102080-36 = "Жили в одном городе, ходили в одну академию, и в школу, и обратно — всегда вместе."
90102080-37 = "Но академия Гиацинт, куда мы ходили, внезапно закрылась...#nи мы оказались в разных академиях."
90102080-38 = "Кстати, кажется, я видела статью об этом."
90102080-39 = "Почему её закрыли?#nВедь учеников не то чтобы не было, да?"
90102080-40 = "Я тоже не знаю подробностей, но, похоже, были проблемы с финансами."
90102080-41 = "Число новичков постоянно сокращалось, и финансовое положение академии ухудшалось..."
90102080-42 = "Академия Гиацинт была частной и управлялась ради прибыли фонда, поэтому студсовет, похоже, не смог найти веских оснований для протеста."
90102080-43 = "Сейчас, оглядываясь назад, я чувствую только сожаление.#nМол, разве нельзя было что-то сделать, чтобы академия не закрылась..."
90102080-44 = "Да... когда твоя академия внезапно исчезает, это естественно — не принять."
90102080-45 = "Понимаю... мы чувствовали то же самое."
90102080-46 = "Неужели академия, в которой учились вы, тоже закрылась?"
90102080-47 = "Скорее закрыли, чем..."
90102080-48 = "Если рассказывать, то всё немного сложно..."
90102080-49 = "Итак, когда пропала твоя подруга?"
90102080-50 = "А, да.#nЭм, в прошлую пятницу."
90102080-51 = "Вообще-то до недавнего времени мы с Такахаси не поддерживали связь.#nЯ тоже была занята привыканием к новой академии... встречаться стало трудно, и переписка сократилась."
90102080-53 = "Но в пятницу вечером вдруг пришло сообщение: «Прибыл поезд в прошлое»."
90102080-54 = "Я спросила, что это значит, но ответа не было...#nи с тех пор Такахаси пропала."
90102080-55 = ""
90102080-56 = "Когда подруга, с которой дружишь много лет, внезапно исчезает... это тревожно, да."
90102080-57 = "Тревожно — это да, но... меня всё время цепляет содержание того сообщения."
90102080-58 = "Если она правда села в поезд в прошлое и исчезла из «настоящего»―"
90102080-59 = "Может, Такахаси не была довольна нынешней жизнью."
90102080-60 = "[s] «Почему ты так подумала?»"
90102080-61 = "Потому что я... тоже иногда хочу вернуться в прошлое."
90102080-63 = "Когда избегаешь чужих взглядов и обедаешь одна в пустом классе."
90102080-65 = "Когда понимаешь, что вкус новой креп-бара не сравнится с тем, что остался в памяти."
90102080-67 = "Когда приходит сезон, ликорисы расцветают разом, и я тоскую по дороге в школу, залитой пылающим красным."
90102080-68 = ""
90102080-69 = "В такие моменты хочется вернуться в прошлое и сделать другой выбор."
90102080-70 = "Может, если бы я действовала чуть активнее, академия не закрылась бы..."
90102080-71 = "По крайней мере, если бы я чаще переписывалась с Такахаси...#nможет, и она бы не пропала..."
90102080-72 = "Это всего лишь бессмысленные догадки."
90102080-73 = "Прошлое — это прошлое. Оно прошло."
90102080-74 = "Тогда... у вас совсем такого нет?"
90102080-75 = "Прошлого, куда хотелось бы вернуться... и ни капли сожаления о принятых решениях?"
90102080-76 = "Это..."
90102080-77 = ""
90102080-80 = "Это всё ваша вина!?"
90102080-81 = "Операция ради горожан? Шутки в сторону!#nЯ пострадала из-за этой операции!"
90102080-82 = ""
90102080-84 = "Почему жертвой должна быть именно я!? Я тоже горожанка! Спасите и меня!"
90102080-85 = "...Лучше было бы вообще не связываться с этим делом."
90102080-86 = ""
90102080-89 = ""
90102080-90 = ""
90102080-91 = "[ns] «Как бы ни было тяжело сейчас, прошлое не вернуть.»"
90102080-92 = ""
90102080-93 = "Это... я понимаю."
90102080-94 = "Но когда сейчас тяжело и больно... поневоле оглядываешься назад."
90102080-95 = "Вы думаете, что оглядываться назад... и мучиться — бессмысленно?"
90102080-96 = "[s1] «Я не говорю, что нельзя оглядываться на прошлое.»\n[s2] «Ведь воспоминания и опыт помогают нам двигаться вперёд.»"
90102080-99 = ""
90102080-102 = "[ns] «Но мы ведь живём в настоящем, верно?»"
90102080-103 = "Это... что значит?"
90102080-104 = "[s3] «Даже если начать заново из прошлого, в конце концов придётся пройти через «настоящее».»\n[s4] «Если отвести взгляд от «настоящего», не сможешь сделать ни шагу в будущее.»"
90102080-107 = "Примеров, когда упоение прошлыми победами приводило к провалу, предостаточно и за пределами уставов."
90102080-108 = "Если из-за вчерашнего опыта провалить сегодняшнюю операцию — это будет полная нелепица."
90102080-109 = "Но если Такахаси вернулась в прошлое..."
90102080-110 = "[s] «Разве можно оставить дорогую подругу в прошлом?»"
90102080-111 = "Н-нет!#nУ меня есть много причин снова встретиться с Такахаси!"
90102080-112 = "Рассказать ей о многом, о чём мы не могли поговорить, сходить в новую блинную..."
90102080-113 = ""
90102080-115 = ""
90102080-116 = "...и извиниться за то, что так долго не поддерживала связь."
90102080-117 = "Отлично, тогда решено."
90102080-118 = "Ты ведь тоже видела подозрительный поезд на станции?"
90102080-119 = "Да. Три дня назад после уроков я пошла на станцию Каваниши искать зацепки,#nи тогда приехал поезд, которого нет в расписании и которого быть не должно."
90102080-120 = "...Это был очень знакомый, виденный ранее поезд."
90102080-121 = "Это был―поезд до академии Гиацинт, на котором я ездила в школу."
90102080-122 = "Не было ничего подозрительного?#nМожет, номер поезда отличался или устройство вагона было другим?"
90102080-123 = "Всё было мгновенно, так что подробно...#nно странно было то, что никто не ехал."
90102080-124 = "Станция Каваниши — пересадочная, поэтому даже поздно там всегда есть хоть один-два пассажира."
90102080-125 = "Но в том поезде не было никого... и было жутко, так что садиться не хотелось."
90102080-126 = "Может, он действительно появляется только перед выпускницами академии Гиацинт?"
90102080-127 = "Может быть.#nУ нас нет привязанности к этой линии, и мы не знаем, как он выглядит."
90102080-128 = "Вот уж действительно, с аномалиями одни хлопоты. Позавчера мы всю ночь ждали на платформе, а он так и не появился."
90102080-129 = "Может, поэтому это и называют непостижимым явлением."
90102080-130 = "Но теперь, кажется, условие появления поезда прояснилось...?"
90102080-131 = "Можешь сегодня вечером ещё раз прийти на платформу станции Каваниши?"
90102080-132 = "Хорошо... эм, что вы собираетесь делать?"
90102080-133 = "Не волнуйся. Ничего особенного."
90102080-135 = "...Пойдём встретимся лицом к лицу с весёлым прошлым."
90102080-137 = "Следующий эпизод;Поезд до частной академии Гиацинт"
