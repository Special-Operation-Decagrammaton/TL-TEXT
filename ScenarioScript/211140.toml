[translation]
211140-1 = "Эпизод 14;Тень под пламенем"
211140-2 = "Зал заседаний Пандемониума"
211140-4 = ""
211140-5 = "Эй, Макото-о-о!"
211140-6 = ""
211140-8 = ""
211140-10 = ""
211140-11 = "Да, Сацуки?"
211140-12 = "Лига наследия Геенны просит о встрече с тобой. И они привели Сенсея."
211140-13 = "Ха! У этих наглых младших студентов хватило дерзости явиться ко мне без приглашения."
211140-14 = "В прошлый раз им удалось улизнуть, но теперь так просто не отделаются... даже если ПРИВЕЛИ Сенсея."
211140-16 = "Как любопытно..."
211140-18 = "Впустите их!"
211140-19 = "Хорошо! Можете войти!"
211140-24 = ""
211140-25 = "Здравствуйте, председатель!"
211140-26 = "[s] «Привет, Макото»."
211140-28 = "Мне, великой Макото, сейчас не до любезностей..."
211140-29 = "Но ВАШЕ приветствие я приму, Сенсей. Ведь вы — величайший союзник Пандемониума."
211140-30 = "Фу-фу..."
211140-31 = ""
211140-33 = ""
211140-34 = "Ты смеёшься?"
211140-35 = "Смелости тебе не занимать. А теперь... назовите причину вашего визита в Пандемониум!"
211140-36 = "Опять пришли с прежней просьбой? Сегодня вероятность её удовлетворения равна НУЛЮ, так что готовьтесь к отказу!"
211140-37 = "Ух... Не думаю, что справлюсь...!"
211140-38 = "Председатель, с вашего позволения."
211140-39 = "О, Шоуко снова пустит в ход своё красноречие."
211140-40 = "Тихо. У меня есть план."
211140-42 = "Вы пришли сюда мямлить? Если не способны уверенно говорить, тогда УБИРАЙТЕСЬ!"
211140-43 = ""
211140-45 = ""
211140-46 = ""
211140-47 = "Что касается причины нашего визита..."
211140-48 = "Посмотрим. Что, если мы скажем, что пришли восстановить авторитет Пандемониума?"
211140-49 = "И что ты под этим понимаешь?"
211140-50 = "Как вы, несомненно, заметили, влияние Лиги наследия Геенны растёт день ото дня."
211140-51 = "А результаты опросов об удовлетворённости студентов жизнью в Геенне достигли невиданных прежде высот."
211140-52 = "И-и что с того?!"
211140-53 = "Число происшествий на территории академии резко сократилось, а местная торговля в районе начала бурно развиваться."
211140-54 = "Некоторые студенты спрашивают, почему Пандемониум за СТОЛЬКО лет так и не проявил подобной инициативы."
211140-55 = "Поговаривают даже о том, что нам, возможно, следует провести... выборы."
211140-56 = "Подумать только, некоторые студенты считают, что Лига наследия должна заменить Пандемониум..."
211140-57 = "У-ух..."
211140-59 = "Она не лжёт. Я тоже это слышала."
211140-60 = "Макото, твоё переизбрание под угрозой?"
211140-62 = "Ты..."
211140-63 = ""
211140-65 = ""
211140-66 = "Откровенно говоря, нам бы очень не хотелось, чтобы наши отношения до этого дошли."
211140-67 = "Почему?"
211140-68 = "Мы считаем, что Лиге наследия Геенны следует ограничиться... «поддержкой» Пандемониума."
211140-69 = "...И что это означает?"
211140-71 = "Шоуко? О чём она говорит?"
211140-72 = "Председатель, у Шоуко всегда есть план. Давайте её выслушаем."
211140-73 = "Хм..."
211140-75 = "В конце концов, в Лиге наследия работают любители. Благодаря энтузиазму и упорству мы добились результатов, но нам не хватает опыта."
211140-76 = "Мы не умеем разрабатывать масштабную политику академии и воплощать далекоидущие замыслы."
211140-77 = "Если мы займём место студенческого совета, то неизбежно начнём ошибаться. Как бы ни были благородны наши намерения, мы подорвём репутацию, которую с таким трудом заслужили."
211140-78 = "Хм..."
211140-79 = "Поэтому мы убеждены, что именно Пандемониум способен привести Геенну к величайшему процветанию, как вы уже и делаете."
211140-80 = "Такая задача не по силам ни Лиге наследия, ни Префектуре. Только Пандемониум способен воплотить эту мечту."
211140-81 = "..."
211140-82 = "Ки-хе-хе, понимаю. Думаю, мы с вами прекрасно поладим!"
211140-83 = ""
211140-85 = ""
211140-86 = ""
211140-87 = "Признать, что я, Ханума Макото, истинный лидер! Что только мне под силу исправить весь бардак, который вы натворили! Весьма проницательно, Лига наследия Геенны!"
211140-88 = "Вообще-то она ничего такого не говорила."
211140-89 = "А, ну... Интересная трактовка."
211140-90 = "Однако."
211140-91 = ""
211140-93 = ""
211140-95 = ""
211140-96 = "Обычные студенты Геенны думают иначе."
211140-97 = "Чушь! Не менее шестидесяти процентов бюджета Пандемониума тратится на пропаганду величия меня, Ханумы Макото!"
211140-98 = "Студенты могут лишь краем уха слышать о Пандемониуме, но каждый студент знает своего лидера, Макото!"
211140-100 = "Макото, по-моему, ты всё перепутала..."
211140-102 = "И вот тут на помощь приходят цифры. Прошу, взгляните."
211140-103 = ""
211140-105 = ""
211140-106 = ""
211140-107 = "Это рейтинги школьной радиопередачи, которую вёл Клуб «Мерцание»."
211140-108 = "Видите, их показатели на 800% выше, чем у трансляции «Гимна председателя Макото»?"
211140-109 = "Ч-что это за график...?!"
211140-111 = "Она добивает Макото голыми фактами. Студентам и правда понравилось выступление Кирары и Эрики."
211140-112 = "Какая жалость. Хотела бы я его послушать."
211140-114 = "Очевидно, студентов привлекает всё новое и неожиданное, а повторы быстро надоедают. К тому, что вы им предлагаете, они совершенно равнодушны."
211140-115 = "Поэтому, чтобы расширить влияние Пандемониума..."
211140-116 = "...нам нужно приспособиться. Пришло время изменить стратегию."
211140-117 = "Что ты пытаешься сказать, Игараши Шоуко?!"
211140-118 = "Прошу вас предоставить Лиге наследия Геенны официальное право вести школьные радиопередачи."
211140-119 = "...Опять за своё."
211140-120 = "Вместо того чтобы использовать школьное радио лишь для объявлений, мы можем превратить его в площадку для создания нового контента и живого общения."
211140-121 = "А ещё мы сможем более профессионально заниматься продвижением Пандемониума."
211140-123 = "Неплохая идея! Школьное радио уже давно молчит."
211140-125 = "Дальнейшая приостановка вещания подрывает авторитет Пандемониума. Тишина заставляет студентов сомневаться в вашей компетентности."
211140-126 = "Кхм... Мы прекратили вещание, потому что не нашлось талантов, достойных столь великой задачи..."
211140-127 = "..."
211140-128 = "Хочешь сказать, ваша Лига наследия способна с ней справиться?"
211140-129 = "Именно. Вы уже убедились в нашем умении увлекать студентов, верно? В конце концов, именно мы задали тон нынешним переменам."
211140-130 = "Я... вынуждена отдать вам должное."
211140-131 = "[s] («Она уже переманила Макото на свою сторону...»)"
211140-133 = "Хм... Что будем делать, Макото?"
211140-134 = ""
211140-136 = ""
211140-138 = ""
211140-140 = ""
211140-141 = ""
211140-142 = "Хмф, так и быть! Раз уж другие так хотят подготовить сцену, именно я, великая Макото, буду блистать в свете софитов!"
211140-143 = "Лига наследия! Я непременно воспользуюсь вашими мечтами о величии!"
211140-145 = "Эта невежественная Префектура никогда бы не додумалась до столь тонкого политического хода! Ки-хе-хе!"
211140-147 = "Ну, это было... совершенно неприятно, но хотя бы теперь мы можем попасть в радиорубку."
211140-148 = "Не нравится мне чувствовать себя какой-то прислужницей Пандемониума..."
211140-150 = "Дамы, всё идёт по плану."
211140-152 = "Хи-хи, давайте сфотографируемся в честь этого исторического момента!"
211140-153 = ""
211140-157 = ""
211140-159 = ""
211140-163 = "Пандемониум и Лига наследия заключают союз! Чувствую, эта новость разлетится по всей Геенне."
211140-164 = "[s] «И снова всё каким-то образом обошлось...»"
211140-165 = "Хм, только будьте осторожны с чувствительным оборудованием радиорубки."
211140-166 = "Там уже случались неприятности. Предыдущий председатель Клуба радиовещания об этом упоминал."
211140-167 = "...Могу я спросить, почему она оставила свой пост?"
211140-168 = "Как же она говорила? А, «по личным причинам». Только это и повторяла, пока уходила."
211140-169 = ""
211140-171 = ""
211140-172 = "Она так и не вернулась, поэтому подробнее рассказать не сможет. Просто будьте там осторожны, ладно?"
211140-173 = "Поняла."
211140-174 = "..."
211140-175 = "Председатель разведывательного комитета Сацуки..."
211140-176 = "Я? Да, слушаю. Чем могу помочь?"
211140-177 = "...Неважно. Спрошу позже."
211140-178 = "О, хочешь заинтриговать меня? Может, хоть намекнёшь?"
211140-179 = "Нет, правда ничего особенного."
211140-180 = ""
211140-182 = ""
211140-184 = ""
211140-185 = "Ну что ж, нам пора."
211140-187 = "Хмф! Знайте: как бы вы ни извивались, вы всё равно на ладони моей изящной руки в перчатке."
211140-189 = "Да она уже начинает действовать на нервы..."
211140-191 = "Если вам что-то не нравится, повышайте свой статус! Хотя предупреждаю: непросто смотреть на мир с той же высоты, что и я, великая Ханума Макото! Ки-хе-хе!"
211140-193 = "Давайте просто уйдём отсюда..."
211140-194 = ""
211140-201 = "Кстати, Макото, ты уверена, что стоило вот так давать им разрешение на вещание?"
211140-202 = "Ки-хе-хе. Ироха, тебе ещё далеко до моей проницательности."
211140-203 = "Лига наследия сейчас у всех на слуху в Геенне."
211140-204 = "Понимаешь, официально предоставив им эфир, мы присвоим себе часть их популярности!"
211140-205 = "А кого, по-твоему, студенты обвинят, когда в эфире неизбежно что-нибудь пойдёт не так?"
211140-206 = "Не Пандемониум, а Лигу наследия. Ведь именно они будут ведущими."
211140-207 = "А я буду спокойно пожинать плоды их популярности, пока они несут всю ответственность..."
211140-208 = "Идеальный план!!!"
211140-210 = "Лучше бы ты направила свой ум на что-нибудь полезное..."
211140-217 = "Радиорубка"
211140-219 = ""
211140-220 = "[ns] «Темно!»"
211140-221 = "Тогда включите свет!"
211140-222 = "Выключатель! Нажмите!"
211140-223 = ""
211140-233 = "Так вот как выглядит радиорубка..."
211140-234 = "Именно так..."
211140-235 = "На вид оборудование старовато, но, кажется, здесь есть всё необходимое."
211140-236 = ""
211140-239 = ""
211140-240 = ""
211140-241 = "Погодите, а это что?"
211140-243 = "Может, лучше ничего не трогать, председатель..."
211140-244 = ""
211140-248 = ""
211140-250 = "Ух...!"
211140-252 = "Ай, Маюми!"
211140-253 = "Прости! Я нечаянно."
211140-254 = "Как-то не по себе рядом с таким количеством огромных и странных приборов..."
211140-255 = ""
211140-257 = ""
211140-258 = "Шоуко... Что ты делаешь?"
211140-259 = ""
211140-261 = ""
211140-263 = ""
211140-264 = "Фу-фу, фу-фу-фу..."
211140-265 = "Ч-что... Что с тобой, Шоуко?"
211140-266 = ""
211140-268 = ""
211140-269 = "...Ах."
211140-270 = "[s] «Ты в порядке, Шоуко?»"
211140-271 = "Да, со мной всё хорошо."
211140-272 = "Просто вы трогали вещи, к которым не стоило прикасаться. Мне показалось это... забавным."
211140-274 = "Ага, виновата!"
211140-275 = "Раз уж мы здесь, поищем следы призрака."
211140-277 = "Я возьму... измеритель электромагнитного поля..."
211140-278 = ""
211140-280 = ""
211140-281 = ""
211140-284 = "Сюда..."
211140-285 = ""
211140-287 = ""
211140-289 = ""
211140-290 = "Шоуко, ты прямо настоящий профессионал. Йаха!"
211140-291 = "Что-нибудь нашла?"
211140-293 = "..."
211140-294 = "Здесь сильный сигнал..."
211140-295 = ""
211140-297 = ""
211140-298 = ""
211140-299 = ""
211140-302 = "..."
211140-304 = "..."
211140-305 = ""
211140-307 = ""
211140-308 = "Карен, только попробуй её напугать!"
211140-309 = "А, поймала."
211140-310 = "Ладно, буду вести себя хорошо... Тем более, похоже, Шоуко что-то нашла."
211140-311 = ""
211140-313 = ""
211140-315 = ""
211140-316 = "Так и знала... Значит, дело было здесь..."
211140-317 = "Что-нибудь нашла?"
211140-318 = ""
211140-320 = ""
211140-321 = "...Да. Похоже, провод, ведущий к динамику, износился."
211140-322 = "Обычная проблема с заземлением."
211140-324 = "А? Ты это поняла, просто взглянув на провод?"
211140-325 = "Я долго и упорно изучала радиосвязь и телекоммуникации."
211140-326 = ""
211140-328 = ""
211140-329 = "Если просто отсоединить этот провод, никаких новых «призрачных явлений» больше не будет."
211140-330 = "...Хотя неисправное оборудование всё равно придётся заменить."
211140-331 = "Серьёзно? И всё так просто?"
211140-332 = "Мы раскрыли наше первое дело!"
211140-333 = "Ещё одна победа Лиги наследия! Ты лучшая, Шоуко!"
211140-334 = "Пойдём расскажем тому, кто к нам обратился! Вот обрадуется! Теперь никому не придётся бояться «призрачных звуков»."
211140-335 = "А председатель снова полна энергии."
211140-337 = "...Я ещё раз осмотрю это место... Возможно, мы упустили другую неисправность."
211140-338 = "[s] «Хочешь, я останусь и помогу?»"
211140-339 = "Нет. Я справлюсь сама."
211140-340 = "...Благодарю за заботу, Сенсей."
211140-341 = "Ладно, только не засиживайся и не получи удар током! У нас ещё столько дел!"
211140-342 = "Я отправляюсь в великое путешествие. Прошу меня не искать."
211140-343 = "Ладно, как хочешь! Главное, не опоздай на собрание!"
211140-344 = ""
211140-351 = "..."
211140-352 = ""
211140-354 = ""
211140-355 = "Вот оно что... Значит, это..."
211140-359 = "Следующий эпизод;Маюми"
