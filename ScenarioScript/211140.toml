[translation]
211140-1 = "Episode 14;Shadows of the Flickering Flame"
211140-2 = "Pandemonium Society - Office"
211140-5 = "Makoto-chaaan."
211140-11 = "What is it?"
211140-12 = "The kids from the Reconstruction Committee are here. Sensei is with them, too."
211140-13 = "Kikiki! Those rude underclassmen? I'd like to see what kind of face they have the nerve to show me."
211140-14 = "I gave them a pass last time for Sensei's sake, but it won't be so easy this time."
211140-16 = "……I wonder about that."
211140-18 = "Fine, let them in!"
211140-19 = "Go ahead, you can come in."
211140-25 = "Hello!"
211140-26 = "[s] \"Hello, Makoto.\""
211140-28 = "I was in a mood far from cheerful, but..."
211140-29 = "I shall accept a greeting from Sensei. After all, you are the greatest collaborator the Pandemonium Society has."
211140-30 = "Hehe..."
211140-34 = "What's so funny?"
211140-35 = "You've grown quite bold since I last saw you. Now, let me hear the reason for your visit."
211140-36 = "Is it another 'request'? Know that the probability of things going your way is practically zero!"
211140-37 = "Ugh... this pressure is still amazing...!"
211140-38 = "Chairwoman Mayumi, leave this to me."
211140-39 = "Are you going into 'flattery mode' again?"
211140-40 = "Quiet. I have a plan."
211140-42 = "What are you whispering about after wasting my time! If you lack confidence, then turn back now!"
211140-47 = "Why have we visited the Chairwoman..."
211140-48 = "To solidify the prestige of the Pandemonium Society—what would you say to that?"
211140-49 = "Oh?"
211140-50 = "Chairwoman Makoto, you must be aware that the influence of the Gehenna Reconstruction Committee is growing by the day."
211140-51 = "At the same time, since we began our activities, the results of life satisfaction surveys have far exceeded previous figures."
211140-52 = "So what of it!"
211140-53 = "Incidents and accidents on campus have decreased significantly, and the district's economy is revitalized."
211140-54 = "Voices are being raised asking why the Pandemonium Society hasn't done anything—"
211140-55 = "In some circles, there is even talk of an 'election'."
211140-56 = "Some are saying it might be better to leave things to the Reconstruction Committee."
211140-57 = "Guh..."
211140-59 = "It's not just hearsay. It's a real conversation happening."
211140-60 = "Looks like Makoto-chan's position is in trouble, huh?"
211140-62 = "How dare these underclassmen..."
211140-66 = "That outcome is not our intention."
211140-67 = "What did you say?"
211140-68 = "We believe the Gehenna Reconstruction Committee should focus on supporting the Pandemonium Society."
211140-69 = "What are you planning?"
211140-71 = "What does that mean...?"
211140-72 = "Let's just listen for now. She must have an idea."
211140-73 = "Hmm..."
211140-75 = "To put it simply, the Reconstruction Committee is a group of amateurs. We have passion and momentum, but we lack experience."
211140-76 = "If forced to make policy decisions or judge the big picture... we aren't guaranteed to handle it flexibly or accurately."
211140-77 = "On the contrary, if we were to take on the role of the student council, we would fail repeatedly... and the trust we've built would crumble in an instant."
211140-78 = "Hmm..."
211140-79 = "We believe the role of making Gehenna great is one that only the Pandemonium Society can fulfill."
211140-80 = "Not the Reconstruction Committee, not the Prefect Team—it is a job only the Pandemonium Society can do."
211140-81 = "..."
211140-82 = "Kishishi, it seems you're a bit more sensible than I thought."
211140-87 = "So you've come to say that I, Makoto Hanuma, am the only one fit to be the true leader! The Gehenna Reconstruction Committee has potential after all!"
211140-88 = "I didn't go that far, though."
211140-89 = "...You may interpret it that way if you wish."
211140-90 = "However."
211140-96 = "The problem is that many Gehenna students don't think so."
211140-97 = "Impossible! Over sixty percent of the Pandemonium Society's budget is used to spread the greatness of Makoto-sama!"
211140-98 = "Even if they only have a vague awareness of the Pandemonium Society, there is no one who doesn't know the name of Makoto-sama—"
211140-100 = "Makoto-chan, I think it's the opposite, actually..."
211140-102 = "This is where the numbers come in. Please look at this."
211140-107 = "These are the ratings from when the Shiny Club was in charge of the school broadcast the other day."
211140-108 = "It recorded an increase of over 800% compared to usual."
211140-109 = "W-what is that graph...!?"
211140-111 = "It was actually quite a hit. That's how it felt, anyway."
211140-112 = "It's a shame I missed it."
211140-114 = "What these figures show is clear. Students are enthusiastic about novel things and get bored with repetitive content."
211140-115 = "Therefore, to expand the influence of the Pandemonium Society beyond what it is now—"
211140-116 = "We need to change our strategy."
211140-117 = "What are you trying to say!"
211140-118 = "Could you let the Gehenna Reconstruction Committee handle the school broadcasts?"
211140-119 = "...That topic again."
211140-120 = "Instead of just playing announcements, we will focus on content production and use it as a window for communication."
211140-121 = "Furthermore, we can promote the Pandemonium Society in a sophisticated way at the same time."
211140-123 = "Oh, isn't that a good idea? It's been inactive for so long."
211140-125 = "It could even damage the authority of the Pandemonium Society. A non-functional system invites distrust in our administrative capabilities."
211140-126 = "I had no choice but to leave it as is because I couldn't find a replacement..."
211140-127 = "..."
211140-128 = "You're saying you can fill that void?"
211140-129 = "Yes. Our track record of capturing the students' hearts is already known to you."
211140-130 = "That... I cannot deny."
211140-131 = "[s] (I think we won...)"
211140-133 = "Makoto-chan, what do you think?"
211140-142 = "Very well! If a stage has been prepared, it must be Makoto-sama who dances upon it!"
211140-143 = "Gehenna Reconstruction Committee. Your wish—I will use it to the fullest!!"
211140-145 = "The ignorant Prefect Team would never understand this kind of blueprint! Kishishi!!"
