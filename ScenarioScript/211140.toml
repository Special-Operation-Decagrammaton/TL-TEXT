[translation]
211140-1 = "Episódio 14;Sombras de Chamas Trêmulas"
211140-2 = "Sociedade Pandemônio - Gabinete da Presidência"
211140-4 = ""
211140-5 = "Makoto-chaaan."
211140-6 = ""
211140-8 = ""
211140-10 = ""
211140-11 = "O que foi?"
211140-12 = "As meninas do Comitê de Restauração estão aqui fora. O Sensei veio junto."
211140-13 = "Kikiki! Aquelas calouras insolentes? Quero só ver com que cara de pau ousaram pisar aqui!"
211140-14 = "Da última vez fiz vista grossa pelo prestígio do Sensei, mas hoje o buraco é mais embaixo!"
211140-16 = "...Veremos."
211140-18 = "Muito bem, mande entrarem!"
211140-19 = "Podem entrar, meninas."
211140-24 = ""
211140-25 = "Com licença! Olá a todas!"
211140-26 = "[s] \"Olá, Makoto.\""
211140-28 = "Meu ânimo estava a anos-luz de querer confraternizar, mas..."
211140-29 = "Acolherei as saudações do Sensei, visto que é o mais ilustre cooperador da Pandemônio!"
211140-30 = "Fufufu..."
211140-31 = ""
211140-33 = ""
211140-34 = "Do que está rindo com essa cara cínica?!"
211140-35 = "Faz pouco tempo que não nos vemos e vocês já criaram uma casca grossa abusada.#nEnfim, desembucha logo o motivo desta audiência!"
211140-36 = "Vieram com mais um 'pedidinho mimado'?!#nFiquem cientes de que as probabilidades de eu conceder qualquer capricho beiram o zero absoluto!"
211140-37 = "Ugh... Que pressão esmagadora vem de cima dela...!"
211140-38 = "Presidente Mayumi, deixe a condução tática comigo."
211140-39 = "Vai ligar o modo puxa-saco de novo?"
211140-40 = "Contenha-se. Há um raciocínio estritamente articulado por trás."
211140-42 = "Estão cochichando o quê enquanto roubam meu precioso tempo real?!#nSe perderam a coragem, dêem meia-volta e sumam do meu gabinete!"
211140-43 = ""
211140-45 = ""
211140-46 = ""
211140-47 = "O propósito da nossa audiência perante Vossa Magnificência..."
211140-48 = "É consolidar e blindar em definitivo o prestígio imperial da Sociedade Pandemônio―― O que acha deste preâmbulo?"
211140-49 = "Como?!"
211140-50 = "A Presidente Makoto decerto já mapeou que a influência pública do Comitê de Restauração de Gehenna expande-se exponencialmente a cada dia."
211140-51 = "Simultaneamente, desde o início das nossas atividades, os índices de aprovação e satisfação discente ultrapassaram com folga todas as médias históricas da instituição."
211140-52 = "E o que eu tenho a ver com essa baboseira estatística?!"
211140-53 = "Os índices de violência e criminalidade escolar despencaram, e a economia do distrito autônomo respira com vigor renovado."
211140-54 = "Com isso, começam a ecoar vozes indagando por que a Pandemônio manteve-se inerte por tanto tempo――"
211140-55 = "E em certos círculos, já se aventa inclusive a deflagração de um processo de 'Eleições Gerais'."
211140-56 = "Muitos ponderam se não seria mais prudente transferir o comando do colégio para o Comitê de Restauração."
211140-57 = "Gnuuuh...!"
211140-59 = "Pior que não é blefe da parte dela. São murmúrios reais que já circulam pelos corredores."
211140-60 = "Sua reeleição tá correndo um perigo danado, Makoto-chan."
211140-62 = "Malditas calouras atrevidas..."
211140-63 = ""
211140-65 = ""
211140-66 = "Todavia, tal desenlace contraria frontalmente as nossas aspirações institucionais."
211140-67 = "O que disse?!"
211140-68 = "O Comitê de Restauração de Gehenna compreende que seu papel histórico deve limitar-se à retaguarda operacional da Sociedade Pandemônio."
211140-69 = "Qual é o seu jogo, garota?"
211140-71 = "Onde ela quer chegar com isso...?"
211140-72 = "Fica quietinha e escuta. A Shoko sabe exatamente o que tá fazendo."
211140-73 = "Huum..."
211140-75 = "Em termos objetivos, o Comitê de Restauração constitui um coletivo amador.#nTransbordamos paixão e vigor juvenil, mas padecemos de manifesta inexperiência de Estado."
211140-76 = "Diante da imposição de deliberar decretos geopolíticos ou traçar o xadrez estratégico em escala macro...#nJamais teríamos o traquejo necessário para agir com maestria."
211140-77 = "Pelo contrário: se assumíssemos a chefia de Gehenna, acumularíamos desastres sucessivos... E toda a confiança arduamente conquistada ruiria feito pó em segundos."
211140-78 = "Hum..."
211140-79 = "A missão sagrada de elevar Gehenna à sua magnitude imperial só pode ser consumada pela Sociedade Pandemônio."
211140-80 = "Nem pelo comitê, nem pelo Comitê de Disciplina―― É uma prerrogativa exclusiva e intransferível da Pandemônio."
211140-81 = "......"
211140-82 = "Kishishi! Vejo que você possui um vislumbre lúcido da hierarquia cósmica!"
211140-83 = ""
211140-85 = ""
211140-86 = ""
211140-87 = "Veio até aqui para proclamar que esta que vos fala, Hanuma Makoto-sama, é a única líder autêntica desta academia!#nO Comitê de Restauração de Gehenna finalmente revelou ter tutano e perspicácia!"
211140-88 = "Não foi bem isso o que ela falou, mas enfim..."
211140-89 = "...Pode interpretar nestes termos, se assim aprouver."
211140-90 = "Contudo."
211140-91 = ""
211140-93 = ""
211140-95 = ""
211140-96 = "O problema reside no fato de que a esmagadora maioria do alunado não compartilha dessa percepção."
211140-97 = "Absurdo inaudito!#nMais de sessenta por cento do orçamento da Pandemônio é drenado exclusivamente para disseminar a grandiosidade de Makoto-sama!"
211140-98 = "Ainda que conheçam a instituição vagamente, não há uma alma viva que ignore o meu glorioso nome――"
211140-100 = "Makoto-chan, acho que na prática a realidade é exatamente o oposto..."
211140-102 = "Recorramos aos dados empíricos. Queiram analisar este gráfico analítico."
211140-103 = ""
211140-105 = ""
211140-106 = ""
211140-107 = "Estes são os índices de audiência aferidos durante a transmissão especial conduzida pelo Clube Kirakira na rádio escolar."
211140-108 = "Registrou-se um salto vertiginoso superior a oitocentos por cento em relação à média habitual."
211140-109 = "M-Mas que curva astronômica é essa no gráfico...?!!"
211140-111 = "Foi um sucesso estrondoso mesmo, todo mundo comentou. Os números refletem a pura realidade."
211140-112 = "Uma lástima eu ter perdido o programa ao vivo."
211140-114 = "A lição que esses dados escancaram é transparente:#no público entusiasma-se com novidades frescas e rejeita enfadonhas repetições burocráticas."
211140-115 = "Logo, para expandir a hegemonia da Pandemônio além das fronteiras vigentes――"
211140-116 = "É mandatório reestruturar a estratégia comunicacional de cabo a rabo."
211140-117 = "Vá direto ao ponto! O que você quer afinal?!"
211140-118 = "Transfira a gestão da Sala de Radiodifusão para o Comitê de Restauração de Gehenna."
211140-119 = "...De novo essa ladainha?"
211140-120 = "Não nos limitaremos a ler circulares monótonas:#nproduziremos programas dinâmicos, convertendo a rádio em um canal direto de ouvidoria discente."
211140-121 = "E, adicionalmente, conduziremos a propaganda institucional de Makoto-sama sob uma roupagem sofisticada e irresistível."
211140-123 = "Olha só, parece uma excelente ideia.#nA rádio tá completamente às moscas mesmo."
211140-125 = "Ademais, manter as transmissões paralisadas corrói o prestígio governamental da Pandemônio.#nUm sistema público inoperante gera desconfiança sobre a capacidade de gestão dos governantes."
211140-126 = "Só deixamos as instalações paradas porque a antiga diretora sumiu e não achamos substituta à altura..."
211140-127 = "......"
211140-128 = "Vocês afirmam que conseguem preencher esse vácuo com excelência?"
211140-129 = "Perfeitamente. Nossa habilidade em conquistar os corações dos alunos já foi provada nos fatos."
211140-130 = "Isso... tenho que admitir a contragosto."
211140-131 = "[s] (Parece que o jogo foi ganho...)"
211140-133 = "E então, Makoto-chan? Qual o veredito?"
211140-134 = ""
211140-136 = ""
211140-138 = ""
211140-140 = ""
211140-141 = ""
211140-142 = "Pois muito bem!#nSe o palco foi erguido sob medida, a estrela que deve brilhar nele não pode ser outra senão Makoto-sama!"
211140-143 = "Comitê de Restauração de Gehenna: eu concedo a autorização, e usarei vossos esforços até a última gota para a minha glória!!"
211140-145 = "Aquelas antas ignorantes do Comitê de Disciplina jamais teriam visão política para conceber tal engenharia! Kishishi!!"
211140-147 = "O jeitão dela me dá nos nervos, mas... pelo menos conseguimos a chave da sala de rádio."
211140-148 = "Parece até que viramos capangas da Pandemônio, que ódio..."
211140-150 = "Tudo faz parte do plano milimetricamente calculado."
211140-152 = "Hahaha! Sorriam pro registro histórico! Digam 'Gehenna'!"
211140-153 = ""
211140-157 = ""
211140-159 = ""
211140-163 = "O instante histórico em que a Pandemônio e o Comitê de Restauração selaram sua união! Isso vai render uma matéria bombástica!"
211140-164 = "[s] \"De um jeito ou de outro, as coisas se ajeitaram com sucesso.\""
211140-165 = "Mas tenham muita cautela ao manusear a aparelhagem técnica daquele estúdio."
211140-166 = "Acidentes estranhos costumam acontecer por lá. A diretora anterior pediu demissão de forma repentina e bizarra."
211140-167 = "...A senhora saberia precisar as razões do ocorrido?"
211140-168 = "Como era mesmo...?#nDizem que ela ficou com o olhar completamente vago, repetindo 'motivos pessoais' em transe."
211140-169 = ""
211140-171 = ""
211140-172 = "Até o momento não há previsão de quando ela recuperará a consciência plena. Portanto, tenham cuidado redobrado."
211140-173 = "Compreendido. Tomaremos as devidas precauções."
211140-174 = "......"
211140-175 = "Diretora de Inteligência Satsuki... Porventura a senhora..."
211140-176 = "O que foi?"
211140-177 = "...Nada. Indagarei em momento oportuno."
211140-178 = "Nossa, que mistério desnecessário. Não me deixe na curiosidade, fale até o fim."
211140-179 = "Asseguro-lhe que não se trata de nada com gravidade imediata."
211140-180 = ""
211140-182 = ""
211140-184 = ""
211140-185 = "Bom, vamos nos retirar por hoje."
211140-187 = "Humph! Não se esqueçam: não importa o quanto corram pelo pátio, vocês dançam na palma da mão de Makoto-sama!"
211140-189 = "Que soberba insuportável..."
211140-191 = "Se têm queixas, subam até o cume!#nEmbora contemplar o universo da mesma altura colossal que Makoto-sama seja privilégio para poucos! Kishishi!"
211140-193 = "Bora embora logo antes que eu dê um tiro nela..."
211140-194 = ""
211140-201 = "Mas vem cá, Makoto-senpai: entregar o controle da rádio de bandeja para elas assim do nada não é arriscado demais?"
211140-202 = "Sua mente ainda é incapaz de enxergar o horizonte com a minha perspicácia divina."
211140-203 = "O Comitê de Restauração é a sensação febril do momento em Gehenna."
211140-204 = "Ao conferir-lhes a chancela oficial da Pandemônio, eu coaduno toda a popularidade delas para o meu próprio manto soberano!"
211140-205 = "E caso a programação da rádio resulte em um fracasso humilhante, quem as massas culparão?"
211140-206 = "EXATAMENTE: a responsabilidade recairá integralmente sobre o comitê!"
211140-207 = "Eu desfruto dos louros promocionais de braços cruzados, e se der errado, o fardo é todo delas...!"
211140-208 = "ESTA É UMA JOGADA ESTRATÉGICA PERFEITA!!"
211140-210 = "Se a senhora usasse essa sua cabecinha pra coisas úteis na vida, a gente não passava tanto perrengue..."
211140-217 = "Sala de Radiodifusão"
211140-219 = ""
211140-220 = "[ns] \"Que breu! Tá tudo escuro!\""
211140-221 = "Acende a luz aí!"
211140-222 = "Cadê o interruptor?! Procura o botão aí!"
211140-223 = ""
211140-233 = "Então é aqui..."
211140-234 = "O estúdio de transmissão..."
211140-235 = "Parece meio empoeirado e antigo, mas tem tudo o que precisamos aqui dentro."
211140-236 = ""
211140-239 = ""
211140-240 = ""
211140-241 = "Nossa, que trambolho bizarro é esse aqui?"
211140-243 = "Ei, Mayumi, é melhor não ficar encostando no que não conhece."
211140-244 = ""
211140-248 = ""
211140-250 = "Uaaaaai...! Que choque!!"
211140-252 = "Mayumi-chan!"
211140-253 = "D-Desculpa! Eu não imaginei que desse estalo de eletricidade!"
211140-254 = "Tem um monte de painéis estranhos aqui... Dá até um friozinho na barriga."
211140-255 = ""
211140-257 = ""
211140-258 = "Ué... O que a Shoko tá fazendo ali parada?"
211140-259 = ""
211140-261 = ""
211140-263 = ""
211140-264 = "Fufufu... Fufufufu..."
211140-265 = "Q-Que risadinha foi essa... Tá tudo bem aí?"
211140-266 = ""
211140-268 = ""
211140-269 = "...Ah."
211140-270 = "[s] \"Você tá bem, Shoko?\""
211140-271 = "Sim, perfeitamente em ordem."
211140-272 = "Foi apenas um reflexo causado pelo susto da Presidente manuseando circuitos indevidos."
211140-274 = "Já pedi desculpa, não precisa jogar na cara!"
211140-275 = "Mas e aí: como é que achamos a pista da tal assombração?"
211140-277 = "Permitam-me... acionar o espectrômetro eletromagnético..."
211140-278 = ""
211140-280 = ""
211140-281 = ""
211140-284 = "É precisamente nesta área."
211140-285 = ""
211140-287 = ""
211140-289 = ""
211140-290 = "Olha só! A Shoko-chan parece uma perita criminal de filme!"
211140-291 = "Descobriu alguma coisa?"
211140-293 = "......"
211140-294 = "O painel acusa oscilações particularmente massivas emanando desta fiação..."
211140-295 = ""
211140-297 = ""
211140-298 = ""
211140-299 = ""
211140-302 = "......"
211140-304 = "......"
211140-305 = ""
211140-307 = ""
211140-308 = "Karen, nem pense em dar outro susto na garota, hein!"
211140-309 = "Droga, fui desmascarada antes da hora."
211140-310 = "Tava zoando, relaxa. Ela parece ter achado algo sério, vou ficar pianinho."
211140-311 = ""
211140-313 = ""
211140-315 = ""
211140-316 = "Compreendo... Então repousava exatamente aqui..."
211140-317 = "Como tá a situação?"
211140-318 = ""
211140-320 = ""
211140-321 = "...O cabo conectado ao amplificador acústico dos alto-falantes encontra-se severamente degradado."
211140-322 = "A hipótese mais provável recai sobre mero mau contato elétrico."
211140-324 = "Dá pra matar a charada só olhando pra fiação assim?"
211140-325 = "Estudei telecomunicações e radiação eletromagnética com afinco técnico, afinal."
211140-326 = ""
211140-328 = ""
211140-329 = "Ao desacoplarmos este terminal, os ecos espectrais cessarão por completo."
211140-330 = "...Embora os equipamentos centrais exijam substituição integral a médio prazo."
211140-331 = "Caraca, foi tão fácil assim?!"
211140-332 = "Caso resolvido com sucesso!!"
211140-333 = "Não tem nada que a gente não consiga resolver! Shoko, você é um gênio!"
211140-334 = "Bora correndo contar pra menina que pediu ajuda!#nEla vai tirar um peso enorme das costas, vai ficar radiante!"
211140-335 = "A empolgação da garota ligou o turbo de novo."
211140-337 = "Permanecerei mais um instante para catalogar se há avarias adicionais no circuito."
211140-338 = "[s] \"Quer que eu fique com você?\""
211140-339 = "Não há necessidade, dou conta sozinha."
211140-340 = "Agradeço sinceramente pelo zelo do Sensei."
211140-341 = "Não demora muito aí dentro, hein! Temos um mundão de coisas pra fazer ainda!"
211140-342 = "Estou prestes a partir para uma longa travessia rumo ao infinito, portanto não me procurem."
211140-343 = "Larga de ser dramática e volta logo pra sede!!"
211140-344 = ""
211140-351 = "......"
211140-352 = ""
211140-354 = ""
211140-355 = "Sim... Neste mesmo recinto――"
211140-359 = "A Seguir;Mayumi"
