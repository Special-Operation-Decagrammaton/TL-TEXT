102080-5 = ""
102080-7 = ""
102080-10 = ""
102080-11 = "Прекрасно! В атаку! Вперёд!"
102080-12 = ""
102080-14 = ""
102080-17 = ""
102080-18 = "Товарищи! Мы сражаемся за права трудящихся! Вперёд!"
102080-19 = ""
102080-20 = "За пудинг!"
102080-21 = ""
102080-23 = ""
102080-24 = ""
102080-25 = "...Президент Черина ушла, сказав, что ей нужно кое-что сделать. Я за неё волнуюсь."
102080-26 = "Может, она сначала отправилась в убежище?"
102080-28 = "Здесь, у Бывшего института, есть убежище!"
102080-29 = "А? Тут одни руины. А где все горячие источники, о которых я слышала?"
102080-30 = "Н-Ну... Горячие источники закрыты по определённым обстоятельствам..."
102080-31 = "А? Правда? А я так хотела искупаться!"
102080-32 = "Но, Момидзи, кто знает? Может, пока мы заперты в таком месте, нам придёт куча хороших идей."
102080-33 = "Можно спокойно посидеть здесь и подготовить выпуск к следующему Komisen. Хи-хи-хи."
102080-34 = "Точно... Это прямо как когда тебя запирают и заставляют закончить работу к дедлайну!"
102080-35 = ""
102080-37 = ""
102080-39 = "Нодока, ты не видела президента Черину?"
102080-40 = "А? Нет, она сюда не приходила."
102080-41 = "В следующий раз, когда увижу её, пожалуюсь на то, как обращаются со Спецоперациями..."
102080-42 = "Вот как?"
102080-43 = "Куда же она могла пойти...?"
