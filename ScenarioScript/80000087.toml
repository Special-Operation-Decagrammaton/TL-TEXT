[translation]
80000087-1 = "Не даём себе уснуть"
80000087-2 = "Исполнительный офис Шале"
80000087-3 = "За несколько дней до Дня святого Валентина..."
80000087-4 = ""
80000087-7 = ""
80000087-8 = "Эм, кхм..."
80000087-9 = "Доброе утро, Сенсей."
80000087-10 = "[s] «Доброе утро, Саки.»"
80000087-11 = "Я... должна спросить."
80000087-12 = "Вы сегодня утром не сонный?"
80000087-13 = "[s1] «Нет, вовсе нет. Со мной всё хорошо!»\n[s2] «На самом деле прошлой ночью я отлично выспался!»"
80000087-14 = "О... Это хорошо."
80000087-15 = "О... Это хорошо."
80000087-16 = "Кажется, свет в Шале всегда горит допоздна. Поэтому я подумала, что вы, наверное, недосыпаете."
80000087-17 = "[s] «Ты за меня переживала...?»"
80000087-18 = "Ч-Что? Ещё чего! С чего бы мне переживать за вас, Сенсей?"
80000087-19 = "Я просто не хочу, чтобы вы заснули, пока я несу службу."
80000087-20 = "Если не устали, хватит валять дурака! Приступим к сегодняшним задачам."
80000087-22 = "Но Саки при любом удобном случае продолжала спрашивать, не хочу ли я спать."
80000087-24 = "После обеда..."
80000087-25 = "Ах! Сегодняшний обед был очень сытным."
80000087-26 = "Обычно после такой плотной еды меня немного клонит в сон. Иногда я даже засыпаю сама того не замечая..."
80000087-27 = "А вы, Сенсей? После такого обеда вас не клонит в сон?"
80000087-28 = "[s] «Нет, не особо...»"
80000087-29 = "О... Отлично. Хорошо, что вы не сонный."
80000087-31 = "Во время просмотра телевизора на перерыве..."
80000087-32 = "Ах... Опять скучный документальный фильм?"
80000087-33 = "Вообще-то я большая поклонница документалок. Мне даже нравится. Но слышала, что некоторых усыпляет один только голос этого диктора."
80000087-34 = "А вы, Сенсей? Эта документалка не усыпляет?"
80000087-35 = "[s] «Да не особо...»"
80000087-36 = "О, правда? Ну... наверное, неважно..."
80000087-38 = "О, это другой плейлист, не тот, что вы обычно включаете?"
80000087-39 = "Классика, да..."
80000087-40 = "Это... неплохо, но в классической музыке слишком много расслабляющих, почти колыбельных мотивов для работы. Под неё очень легко задремать."
80000087-41 = "Так... ну как, Сенсей? Теперь-то вы наконец — то есть, вам хочется спать?"
80000087-42 = "[s] «Раз ты постоянно спрашиваешь, наверное, немного...»"
80000087-43 = ""
80000087-45 = ""
80000087-46 = ""
80000087-51 = "Правда? Я так и знала!"
80000087-52 = "Хи-хи. Как раз кстати у меня есть идеальная закуска, чтобы вас разбудить."
80000087-53 = ""
80000087-55 = ""
80000087-57 = "Вот! Шоколадная карамель."
80000087-58 = "[s] «А? Почему карамель?»"
80000087-59 = "Её легко делать, и в ней много калорий, поэтому она отлично подходит как полевой паёк."
80000087-60 = "Кроме того, карамель не тает сразу во рту. Тягучая текстура очень помогает солдатам не заснуть во время ночной смены."
80000087-61 = "Наверняка вы знаете знаменитую историю о командире отряда, который постоянно кормил водителя карамелью, чтобы тот не заснул во время ночной поездки через опасный перевал. ...Нет?"
80000087-62 = "Ну, неважно. В нашей последней поставке были шоколадные карамельки, поэтому я принесла вам несколько, Сенсей. Их много, можете есть, когда захотите спать."
80000087-63 = "[s] «Саки. Этот шоколадный карамель...»"
80000087-65 = "[ns] «Он вообще-то на День святого Валентина?»"
80000087-66 = ""
80000087-67 = "Ч-Что? Нет! П-Почему вы так решили?"
80000087-68 = "Особый агент SRT всегда должен быть сосредоточен на тренировках. С чего бы мне вообще интересоваться таким легкомысленным и гедонистическим событием, как День святого Валентина?!"
80000087-69 = "Просто так совпало по времени. Я ничего не могу с этим поделать."
80000087-70 = ""
80000087-72 = ""
80000087-73 = "Так что ничего себе не выдумывайте!"
