[translation]
1000202-1 = "Запретное исследование"
1000202-2 = "Столовая Геенны №17"
1000202-3 = "Хе-хе-хе. Столовая закрыта. Больше ни один студент нам не помешает."
1000202-4 = "*щелчок*"
1000202-10 = "Хорошо, что после закрытия здесь всё ещё есть электричество и вода."
1000202-11 = "Идеальное место для небольшого гастрономического исследования. Никто не будет мешать!"
1000202-12 = "[s] «Почему я здесь...?»"
1000202-13 = "Это риторический вопрос?"
1000202-14 = "Мне нужен взрослый, который возьмёт ответственность, если нас поймает Префектурная команда."
1000202-15 = "[s] «Это просто жестоко...»"
1000202-16 = "Хе. Никто не говорил, что жизнь справедлива. Ладно, к делу."
1000202-17 = "Сегодняшняя тема гастрономического исследования — кок-о-вен!"
1000202-18 = "[s1] «Кок-о-вен...?»\n[s2] «Будь здорова.»"
1000202-19 = "Ты наверняка и так знаешь, но позволь объяснить, что такое кок-о-вен..."
1000202-20 = "Кок-о-вен."
1000202-21 = "Это простое рагу из курицы и овощей. Просто кладёшь ингредиенты в кастрюлю и варишь всё вместе."
1000202-22 = "Однако... если бы всё было так просто, исследовать было бы нечего."
1000202-23 = "Главное отличие кок-о-вен в том, что курицу варят не в воде, а в вине."
1000202-24 = "[s] «Вино...?»"
1000202-25 = "Да, алкоголь."
1000202-26 = "Естественно, здесь он запрещён. Ни один студент Кивотоса не может купить вино."
1000202-27 = "А дорогой ресторан, где подают это блюдо, не пускает студентов... так что попробовать его самой у меня нет возможности."
1000202-28 = "А вместо этого..."
1000202-29 = "...я приготовила этиловый спирт и виноградный сок в качестве замены!"
1000202-30 = "[s] «Что?!»"
1000202-31 = "Хе-хе-хе. Я искала сочетание, которое сможет заменить вкус вина."
1000202-32 = "Нужны же всего лишь виноград и алкоголь, разве нет? Это идеально. С таким сочетанием я смогу приготовить собственный кок-о-вен."
1000202-33 = "Смотри, Сенсей."
1000202-34 = "Сначала обжарим бекон на сковороде."
1000202-35 = "*шшшш*"
1000202-36 = ""
1000202-37 = "Потом обжарим панированную курицу на жире от бекона."
1000202-38 = "*шшшш*"
1000202-39 = ""
1000202-40 = "После этого кладём приготовленную курицу, грибы, морковь и лук в кастрюлю."
1000202-41 = ""
1000202-42 = "(льёт)"
1000202-43 = "Затем наливаем виноградный сок."
1000202-44 = ""
1000202-45 = "(льёт)"
1000202-47 = "[s] «Не уверен насчёт этого...»"
1000202-48 = "Хе-хе. Не переживай, Сенсей. План безупречен."
1000202-49 = "И наконец, время алкоголя..."
1000202-50 = "..."
1000202-51 = "Хм... Сколько налить?"
1000202-52 = "Надо было подумать об этом заранее..."
1000202-53 = "Ну, наверняка всё будет нормально. В книге сказано, что при кипении алкоголь испаряется..."
1000202-54 = "Просто вылью всё!"
1000202-55 = ""
1000202-56 = ""
1000202-57 = "*льёт*"
1000202-58 = "Хе-хе-хе. Настоящий гурман никогда не жалеет ингредиентов. Я люблю класть с запасом..."
1000202-59 = ""
1000202-60 = ""
1000202-61 = "*льёт*"
1000202-62 = "Ладно, может, я немного переборщила... но наверняка всё будет нормально..."
1000202-63 = "Прибавим огонь..."
1000202-64 = ""
1000202-65 = "А?"
1000202-67 = "*бах*"
1000202-68 = "(Кастрюля взорвалась.)"
1000202-70 = "...?!"
1000202-71 = "[s] «Харуна, ты в порядке?!»"
1000202-72 = "Да, я-я в порядке... но кок-о-вен..."
1000202-74 = "*БА-БАХ*"
1000202-75 = "Мы включили пожарную тревогу?!"
1000202-76 = "В закрытой столовой произошёл взрыв!"
1000202-77 = "Это нападение?! Немедленно доложить Префектурной команде! Пусть стягивают все силы к столовой!"
1000202-78 = "Упс... Похоже, нас раскрыли."
1000202-79 = "[s] «Быстро, бежим!»"
1000202-80 = "Н-Но... а еда?"
1000202-81 = ""
1000202-82 = ""
1000202-83 = ""
1000202-84 = ""
1000202-86 = "(Мы покинули столовую, и мне пришлось тащить Харуну за руку.)"
1000202-88 = "Ох... Плохо дело."
1000202-89 = "К счастью, взрыв был не таким уж сильным... но теперь секретной исследовательской лаборатории больше нет."
1000202-90 = "*вздыхает*"
1000202-91 = "...Ничего страшного. Я всегда могу найти другое место."
1000202-92 = "Похоже, соотношение алкоголя сыграло большую роль, чем я думала. В следующий раз придётся быть осторожнее."
1000202-94 = "(Там было не только это, но разговаривать с Харуной, когда она в таком состоянии, бесполезно...)"
1000202-95 = "(Позже придётся зайти в администрацию Геенны и извиниться.)"
