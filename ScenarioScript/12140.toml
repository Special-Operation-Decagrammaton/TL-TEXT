[translation]
12140-1 = "Episódio 14;A Batalha por Abydos (1)"
12140-8 = "Seu desgraçado!!!"
12140-9 = "..."
12140-10 = "..."
12140-12 = "Alguém está se aproximando... É o diretor da Kaiser!"
12140-14 = "Hum. Eu planejava ir até a escola, mas que cortesia virem me receber."
12140-15 = "Que palhaçada é essa? Uma empresa atacando a cidade... Mesmo sendo os donos das terras, vocês não têm esse direito!"
12140-16 = "Além disso, a escola ainda pertence a nós, de Abydos! Essa invasão é claramente ilegal! Vou denunciá-los ao Conselho Estudantil Geral!"
12140-17 = "Então aquela história de recrutamento era mentira desde o começo?... Não, mais importante: onde está a Hoshino-senpai?"
12140-18 = "Seu canalha... Devolva a Hoshino-senpai!"
12140-19 = "...Hehehe, mas o que é que você está dizendo?"
12140-20 = "Denunciar ao Conselho Estudantil Geral? Que piada engraçada. Por que não tenta fazer isso agora mesmo?"
12140-21 = "Vocês já não imploraram ajuda ao Conselho Estudantil Geral diversas vezes sobre essa situação? E eles chegaram a mover um dedo sequer?"
12140-22 = "..."
12140-23 = "Claro que não. Afinal, o Conselho Estudantil Geral não tem condições de agir no momento."
12140-24 = "E nem precisa ser o Conselho Estudantil Geral. Alguma outra academia já veio ajudar vocês até hoje?... Já devem ter entendido a essa altura, não?"
12140-25 = "Não existe uma única alma disposta a estender a mão para vocês."
12140-26 = "..."
12140-27 = "..."
12140-28 = "..."
12140-29 = "..."
12140-31 = "A última integrante do conselho estudantil de Abydos, Hoshino Takanashi, pediu transferência. O conselho estudantil de Abydos praticamente deixou de existir."
12140-32 = "Vocês não são mais nada."
12140-33 = "...!!"
12140-34 = "!!"
12140-35 = "Sem clubes oficiais, sem comitês, sem conselho estudantil e até mesmo sem um distrito autônomo, foi determinado que Abydos é incapaz de sobreviver de forma independente como uma escola da cidade acadêmica..."
12140-36 = "Não tem jeito. Como dona deste distrito, a nossa Kaiser Corporation assumirá o controle daquela escola."
12140-37 = "Vejamos... Que tal batizarmos a nova escola de \"Escola Técnica Kaiser\"?"
12140-38 = "!!"
12140-39 = "Hã?... O-O que você está dizendo...?!"
12140-40 = "Mesmo sem conselho estudantil, Abydos tem o Comitê de Contramedidas!! Nós ainda estamos aqui, não tem como esse absurdo ser aceito!"
12140-42 = "É que..."
12140-43 = "...Ayane-chan?"
12140-44 = "O Comitê de Contramedidas não é um comitê oficialmente reconhecido..."
12140-45 = "...Hã?!"
12140-46 = "Quando criamos o Comitê de Contramedidas, Abydos já não tinha mais um conselho estudantil..."
12140-47 = "Q-Quê...?!"
12140-48 = "Exatamente. Afinal, não passa de um comitê não oficial, sem nenhuma aprovação formal registrada. Em outras palavras, não há nada que comprove a existência de vocês."
12140-49 = "Mas alegrem-se. Com o fim do Colégio Abydos, vocês finalmente estarão livres daquele inferno de dívidas."
12140-52 = "P-Por quê?... O que está fazendo?!"
12140-53 = "Por que... por que está atacando Abydos e a cidade?!"
12140-56 = "Mesmo que me pergunte o porquê..."
12140-57 = "Não há nada de estranho acontecendo, Hoshino-san."
12140-58 = "Nós quitaremos a maior parte daquela dívida devidamente, é claro. Afinal, foi esse o acordo firmado entre nós."
12140-59 = "Por outro lado... com a sua saída, infelizmente não resta mais nenhum membro oficial do conselho estudantil no Colégio Abydos. Assim, a escola não pode mais se manter, não concorda?"
12140-60 = "...!!"
12140-61 = "Por que você acha que estávamos apoiando as ações quase fraudulentas de uma empresa tão medíocre?"
12140-62 = "Mesmo que eles tomassem as terras do distrito, seria apenas mais uma terra sem lei como o Mercado Negro."
12140-63 = "Lugares assim existem aos montes por toda Kivotos."
12140-64 = "Porém... e se nascesse uma nova academia controlada diretamente por uma corporação...?"
12140-65 = "Que tipo de impacto essa nova entidade surgida em Abydos causaria em Kivotos?"
12140-66 = "...Argh!"
12140-67 = "...Contudo, isso não passa de um mero entretenimento."
12140-68 = "Hoshino-san, nosso objetivo sempre foi você desde o princípio."
12140-69 = "Fazer você assinar o contrato e obter todos os direitos sobre você."
12140-70 = "Como nossos interesses coincidiam para esse fim, apenas cooperamos com a Kaiser Corporation. Nada mais do que isso."
12140-71 = "Parece ter havido algum mal-entendido... Peço desculpas se causei confusão. No entanto, eu nunca pertenci à Kaiser. Tenho certeza de que jamais disse que \"nossa empresa\" era a Kaiser Corporation."
12140-72 = "Agora que finalmente obtivemos o maior Mistério de Kivotos como você, jamais a desperdiçaríamos de forma tão banal."
12140-75 = "Vamos estudá-la, analisá-la e compreendê-la como nossa cobaia."
12140-76 = "Este experimento fascinante é exatamente o que tanto ansiávamos observar."
12140-77 = "Em resumo, é isso."
12140-83 = "..."
12140-84 = "...Entendi."
12140-85 = "Eu..."
12140-87 = "...fui enganada por um adulto de novo."
12140-89 = "..."
12140-90 = "...Desculpa, pessoal. Por minha culpa, tudo..."
12140-91 = "Shiroko-chan, Nonomi-chan, Serika-chan, Ayane-chan..."
12140-92 = "...Yume-senpai."
12140-93 = "..."
12140-94 = "Me desculpem..."
12140-95 = "..."
12140-96 = "Eu..."
12140-98 = "..."
12140-99 = "Sensei..."
12140-102 = "..."
12140-103 = "Não... Se isso acontecer, todo o nosso esforço até agora..."
12140-104 = "...Ora, não me diga que vocês estavam falando sério?"
12140-105 = "Pretendiam mesmo levar centenas de anos para pagar aquela dívida?"
12140-106 = "Que surpresa. Eu tinha certeza de que só estavam se esforçando o mínimo necessário para terem a desculpa de \"pelo menos tentamos\" quando finalmente desistissem..."
12140-107 = "...Grrr!!"
12140-108 = "Afinal, por que vocês se esforçavam tanto? Para quê?"
12140-109 = "Se você falar mais uma palavra..."
12140-112 = "Eu atiro."
12140-113 = "M-Mas..."
12140-114 = "...Se lutarmos aqui agora, alguma coisa vai mudar?"
12140-115 = "Ayane-chan?!"
12140-116 = "Um número enorme de tropas inimigas está vindo para cá neste exato momento..."
12140-117 = "Mesmo que a gente lute e vença... o que faremos depois?..."
12140-118 = "Se a escola acabar, não tem mais sentido lutar. E mesmo que a gente consiga recuperá-la de algum jeito, ainda vamos continuar com aquela dívida enorme..."
12140-119 = "...Ayane-chan."
12140-120 = "Ayane..."
12140-121 = "As terras que foram vendidas também não vão voltar. E acima de tudo, sem a Hoshino-senpai e sem o conselho estudantil, nessa situação..."
12140-122 = "O que um comitê não oficial como o nosso ainda pode fazer?..."
12140-123 = "Por quê... por que só nós temos que passar por isso?..."
12140-124 = "Hoshino-senpai... o que a gente faz?..."
12140-125 = "Ayane-chan..."
12140-126 = "..."
12140-127 = "..."
12140-128 = "KABOOOOM!!"
12140-129 = "?!"
12140-131 = "O quê?! G-Grande explosão confirmada ao norte!"
12140-132 = "O Pelotão Bravo, que vinha se juntar a nós, foi atingido —!!"
12140-133 = "O quê?!"
12140-134 = "KABOOOOM!!"
12140-135 = "Outra confirmada ao leste! O Pelotão Mike, que também vinha para cá, foi pego por uma explosão massiva de C4...!!"
12140-136 = "O que está acontecendo?! Todo o pessoal de Abydos deveria estar bem aqui...!!"
12140-141 = "Francamente... Fiquei ouvindo quieta, mas o que é toda essa choradeira?..."
12140-142 = "...?!"
12140-152 = "Olho por olho, dente por dente. Impiedosas, solitárias, trilhando o próprio caminho por terras sem lei..."
12140-155 = "Não era esse o lema de vocês, da Gangue dos Maiôs Mascarados?"
12140-156 = "...V-Vocês são?!"
12140-157 = "Não sabem o que fazer, não sabem como agir. Tudo o que tentam acaba dando errado..."
12140-158 = "Mesmo que passem por isso, só há mais adversidades e provações pela frente..."
12140-160 = "E DAÍ, ORA BOLAS?!!!!"
12140-161 = "H-Hã?..."
12140-162 = "Uma companheira de vocês está em perigo, não está?! Mesmo assim, vão ficar pensando nessas besteiras e aceitar que tirem tudo de vocês de braços cruzados?!"
12140-163 = "Vocês sempre foram um bando patético assim?!"
12140-164 = "Calma aí, Aru-chan, pega leve com ela. A garota de óculos é sensível, essas coisas acontecem."
12140-165 = "P-Por que vocês estão aqui...?!"
12140-166 = "Aha! Mas, falando sério, fazer a minha fofa garota de óculos chorar é um crime gravíssimo, sabia? Então agora..."
12140-170 = "Só resta acabar com todos vocês!!!"
12140-171 = "Hehe, hehehehe... Tudo pronto, Aru-sama. Ainda temos muitas bombas plantadas por aí..."
12140-172 = "Suspiro... Era só para a gente vir comer lámen..."
12140-173 = "...Cortamos os reforços inimigos com as bombas enterradas. Enquanto isso, neutralizamos o comandante para derrubar a cadeia de comando."
12140-174 = "Assim desmantelamos o grupo deles de uma só vez... Na verdade, essa tática era para ser usada contra o Comitê Disciplinar, mas enfim, vamos encarar como um ensaio."
12140-176 = "Abram os olhos. Vou mostrar agora mesmo para vocês, que estão aí todas desanimadas, como verdadeiras fora da lei lutam."
12140-177 = "Haruka."
12140-178 = "Sim!"
12140-179 = "KABOOOOM!!"
12140-180 = "BOOM! BOOM! BOOOOM!!"
12140-181 = "KABOOOOOOOOM!!"
12140-183 = "Uaaah?!"
12140-187 = "Vamos lá, chegou a hora da nossa parceria! Você consegue acompanhar o ritmo, né, Sensei?!"
12140-188 = "Vamos mostrar a esses covardes o verdadeiro poder do estilo hard-boiled!"
12140-189 = "[ns] \"...Certo, vamos nessa!\""
