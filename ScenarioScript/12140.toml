[translation]
12140-1 = "Эпизод 14;Осада Абидоса. Часть 1"
12140-2 = ""
12140-3 = ""
12140-4 = ""
12140-5 = ""
12140-6 = ""
12140-8 = "Назад! Если жить не надоело!"
12140-9 = "..."
12140-10 = "..."
12140-11 = ""
12140-12 = "Местоположение директора Кайзера подтверждено!"
12140-14 = "Боже-боже. Мы как раз собирались навестить вашу школу, а вы сами пришли так далеко нас поприветствовать?"
12140-15 = "Что вы творите?! Корпорация нападает на город? Даже если земля ваша, это не даёт вам такого права!"
12140-16 = "И школа всё ещё принадлежит нам, студентам Абидоса! Это откровенно незаконно! Мы донесём это прямо в Генеральный студсовет!"
12140-17 = "...Где Хошино? Значит, вся история с «разведкой» с самого начала была ложью."
12140-18 = "Верните Хошино, ублюдки!"
12140-19 = "...Хех. Ха... Хаха."
12140-20 = "В Генеральный студсовет? О, это смешно."
12140-21 = "Сколько раз вы просили помощи у Генерального студсовета? И сколько этих просьб остались без ответа?"
12140-22 = "..."
12140-23 = "Разумеется, ответа не было. Потому что сейчас они ничего не могут сделать."
12140-24 = "И вообще, кто-нибудь ещё когда-нибудь помогал вам? Может, другие академии? Сомневаюсь."
12140-25 = "Вы всегда были одни."
12140-26 = "..."
12140-27 = "..."
12140-28 = "..."
12140-29 = "..."
12140-30 = ""
12140-31 = "После официального ухода Таканаши Хошино Студсовета Абидоса больше нет."
12140-32 = "Теперь вы ничто."
12140-33 = "...!"
12140-34 = "!!"
12140-35 = "У Абидоса больше нет официального клуба, студсовета и даже признанного района. Значит, как школа в Академгороде он больше не способен существовать."
12140-36 = "Но не волнуйтесь. Как законные владельцы этой земли, корпорация Кайзер великодушно заберёт школу у вас с рук."
12140-37 = "Как вам название «Учебная академия Кайзер»? Вполне подходит новой школе."
12140-38 = "!!"
12140-39 = "Ч-Что ты несёшь?"
12140-40 = "Это бред! Даже если Студсовет распущен, у Абидоса всё ещё есть Целевая группа! Мы прямо здесь!"
12140-42 = "Этого не может быть..."
12140-43 = "Аяне?"
12140-44 = "Целевая группа по взысканию долгов не является официально зарегистрированным клубом."
12140-45 = "Что?!"
12140-46 = "К моменту её создания Студсовета давно уже не существовало."
12140-47 = "Что ты имеешь в виду?!"
12140-48 = "Именно. У такого незарегистрированного клуба, как ваш, нет официальных документов. Вы не более чем призраки."
12140-49 = "Но посмотрите на светлую сторону. Теперь вы наконец свободны от надоевшего долга."
12140-52 = "Что вы делаете?! Мы не об этом договаривались!"
12140-53 = "Почему вы нападаете на Абидос?! Почему?!"
12140-56 = "..."
12140-57 = "Нет, мы сдержали слово, Хошино."
12140-58 = "Долг погашен, в точности как обещано."
12140-59 = "Но поскольку ты сама ушла... похоже, у Абидоса больше нет официального Студсовета, правда?"
12140-60 = "...!"
12140-61 = "Скажи, почему, по-твоему, мы поддержали эту мелкую корпоративную скупку земли?"
12140-62 = "Захватить район Кивотоса бессмысленно. В худшем случае получится ещё одна беззаконная зона, ещё один Чёрный рынок."
12140-63 = "А их у нас и так достаточно."
12140-64 = "Но... что если здесь, в Абидосе, появится совершенно новая школа, принадлежащая корпорации?"
12140-65 = "Как думаешь, какие перемены это принесёт Кивотосу?"
12140-66 = "...!"
12140-67 = "Ах... но это? Это было всего лишь побочным шоу, Хошино."
12140-68 = "Нашей настоящей целью с самого начала была ты."
12140-69 = "Заставить тебя подписать контракт и передать нам все права."
12140-70 = "Только ради этого мы и сотрудничали с Кайзером."
12140-71 = "Пожизненный контракт с ЧВК Кайзер? Ха... Мы ничего подобного не говорили. Если ты неправильно поняла... что ж, прискорбно."
12140-72 = "Неужели мы стали бы тратить нечто настолько ценное, как мистик высшего класса Кивотоса, на обычный труд? Смешно."
12140-73 = ""
12140-74 = ""
12140-75 = "Таканаши Хошино нужно изучать, анализировать, понимать. Иными словами, ты всего лишь подопытный образец."
12140-76 = "Вот за каким экспериментом мы действительно хотим наблюдать."
12140-77 = "Так что не принимай близко к сердцу."
12140-78 = ""
12140-83 = "..."
12140-84 = "Теперь понятно."
12140-85 = "Всё это время..."
12140-87 = "...взрослые снова мной манипулировали."
12140-89 = "..."
12140-90 = "Простите, все. Это моя вина."
12140-91 = "Широко. Нономи. Серика. Аяне."
12140-92 = "и Юмэ..."
12140-93 = "..."
12140-94 = "Мне так жаль."
12140-95 = "..."
12140-96 = "Я..."
12140-98 = "..."
12140-99 = "Сенсей..."
12140-102 = "..."
12140-103 = "...Тогда всё, ради чего мы старались... было напрасно?"
12140-104 = "О? Только не говорите, что вы и правда воспринимали это всерьёз."
12140-105 = "Вы действительно думали, что сможете выплатить этот долг за какие-то несколько сотен лет?"
12140-106 = "Я считал, что это просто отговорка — то, что вы говорили себе, чтобы делать вид, будто пытались, прежде чем в конце концов сдаться."
12140-107 = "...!"
12140-108 = "Но вы не сдались. Продолжали бороться. Почему? Ради чего?"
12140-109 = "...Ублюдок. Закрой рот, пока я сама тебе его не закрыла..."
12140-110 = ""
12140-112 = "Вступаем в бой."
12140-113 = "Но..."
12140-114 = "И что потом? Что будет после того, как мы сразимся?"
12140-115 = "...Аяне?!"
12140-116 = "Они всё ещё шлют на нас одну волну солдат за другой..."
12140-117 = "Даже если мы каким-то чудом победим... что потом?"
12140-118 = "Если школа исчезнет, за что мы вообще сражаемся? И даже если мы её вернём... долг никуда не денется."
12140-119 = "...Аяне."
12140-120 = "Аяне..."
12140-121 = "Земля уже потеряна. Она не вернётся. Хошино нет. Студсовета нет. А мы? Мы всего лишь непризнанный клуб..."
12140-122 = "...Что мы вообще можем сделать...?"
12140-123 = "Почему...?"
12140-124 = "Почему всегда мы...? Почему мы должны так страдать...? Хошино..."
12140-125 = "Ох, Аяне..."
12140-126 = "..."
12140-127 = "..."
12140-128 = "*БА-А-АХ*"
12140-129 = "...?!"
12140-131 = "Что?! К северу зафиксирован мощный взрыв!"
12140-132 = "О-отряд «Браво» попал под взрыв по пути сюда. Они не отвечают!"
12140-133 = "Ч-что?!"
12140-134 = "*БУМ*"
12140-135 = "Отряд «Майк» подорвался на востоке! Зафиксирован мощный взрыв C4!"
12140-136 = "Что происходит? В том районе должны быть только жители Абидоса!"
12140-137 = ""
12140-138 = ""
12140-140 = ""
12140-141 = "Что вы, идиоты, творите?"
12140-142 = "...?!"
12140-143 = ""
12140-146 = ""
12140-148 = ""
12140-150 = ""
12140-151 = ""
12140-152 = "Око за око, зуб за зуб. Отринь милосердие и ступай по пути хаоса."
12140-153 = ""
12140-154 = ""
12140-155 = "Разве это не девиз Банды купальщиков в масках?"
12140-156 = "...Чт— В-вы?!"
12140-157 = "Финиша не видно, дороги к нему не найти, а всё, что ты делаешь, заканчивается провалом за провалом."
12140-158 = "Никто не видит, как ты стараешься, а впереди тебя ждут только новые трудности и тяжёлые дни..."
12140-160 = "Но кому какое дело?!"
12140-161 = "А...?"
12140-162 = "Ты правда позволишь чему-то подобному помешать тебе спасти подругу?!"
12140-163 = "Жалкое зрелище. Просто жалкое!"
12140-164 = "Да ладно тебе, Ару, помягче. Очкастая у нас нервная натура. Ничего не поделаешь."
12140-165 = "А?!"
12140-166 = "Ха-ха! Но довести мою милую Очкастую до слёз — это уже серьёзное преступление. Поэтому..."
12140-167 = ""
12140-169 = ""
12140-170 = "...Я разорву этих уродов на части!"
12140-171 = "Хе-хе-хе. Я готова, Ару. Бомб у нас ещё полно..."
12140-172 = "*вздох* Я вообще-то вернулась только за добавкой рамэна. Почему меня снова втянули в это?"
12140-173 = "Я установила взрывчатку, чтобы перекрыть подход подкреплениям. Пока они застряли, уничтожаем командира и рушим цепочку командования."
12140-174 = "После этого они должны окончательно потерять координацию. Вообще-то эта стратегия предназначалась для борьбы с Префектурной командой, но..."
12140-175 = ""
12140-176 = "Идеально. Пора показать им, как сражаются настоящие преступницы."
12140-177 = "Поджигай, Харука."
12140-178 = "*щелчок*"
12140-179 = "*БА-А-АХ*"
12140-180 = "*БА-А-АХ*"
12140-181 = "*БА-А-АХ*"
12140-183 = "Что за чертовщина?!"
12140-184 = ""
12140-185 = ""
12140-186 = ""
12140-187 = "Прикрой нас, Сенсей!"
12140-188 = "Покажем этим идиотам из Комиссии по взысканию, что значит настоящий хард-бойлд!"
12140-189 = "[ns] «Вперёд, Решатели проблем!»"
