[translation]
1013002-1 = "Старшая для всех"
1013002-2 = ""
1013002-3 = "Ты и правда пришла, Сенсей..."
1013002-4 = "[s] «Здесь всё выглядит немного иначе.»"
1013002-5 = "Ещё как зовёт."
1013002-6 = "[s] «Не знаю, стоит ли это говорить, но...»"
1013002-7 = "Говорите."
1013002-8 = "[s] «Здесь здорово.»"
1013002-9 = "...Ага."
1013002-10 = "Но всё равно пока непривычно."
1013002-11 = "Ха-ха, ну... Всё изменилось слишком быстро."
1013002-12 = "Хм? Мои патрули?"
1013002-13 = "..."
1013002-14 = "Если честно, сложно объяснить, как так вышло."
1013002-15 = "Теперь я, по сути, староста... если считать нас обычной школой."
1013002-16 = "Полагаю, я отвечаю за порядок в школе."
1013002-17 = "Впрочем, это удобно. О нападениях извне почти не приходится беспокоиться."
1013002-18 = "О, почему? Разве не очевидно?"
1013002-19 = "Ха-ха! Подумай сама, Сенсей."
1013002-20 = "Кто осмелится устроить неприятности в Ариусе?"
1013002-21 = "...По целому ряду причин."
1013002-22 = ""
1013002-26 = ""
1013002-27 = "[ns] «Может, ты накаркала, но это сейчас был взрыв?!»"
1013002-28 = "Пойдём посмотрим."
1013002-31 = ""
1013002-32 = "Все сюда! Что происходит? Внешнее вторжение?"
1013002-33 = ""
1013002-35 = ""
1013002-36 = ""
1013002-37 = "О? Вовсе нет, Субару."
1013002-38 = "Она права. Мы просто..."
1013002-39 = "Ведём уважительную дискуссию... в традиционном стиле Ариуса."
1013002-41 = "Ах, понятно..."
1013002-42 = ""
1013002-45 = "[ns1] «Дискуссию...?»\n[ns2] «В стиле Ариуса?»"
1013002-49 = "О, ты не знала, Сенсей?"
1013002-50 = "Прости! Мы забыли, что ты здесь чужая!"
1013002-51 = "Видишь ли, в Ариусе поступки говорят громче слов!"
1013002-52 = ""
1013002-54 = ""
1013002-55 = "[ns] «Со словами я всё понимаю, но что вы имеете в виду под поступками...?»"
1013002-56 = "Точно! Значит..."
1013002-57 = "Когда у нас возникают разногласия, мы проводим уважительную дискуссию..."
1013002-58 = "Мы показываем силу наших слов... и наших действий!"
1013002-59 = "Например, я говорила тебе, что 5,56 миллиметра — лучший выбор!"
1013002-60 = "Да брось, это даже не пощекочет! Патроны 7,62 мм тяжёлые и надёжные."
1013002-61 = "Ой, да ладно! Будто Отряд годами не использовал 5,56 мм!"
1013002-62 = "Это было при особых обстоятельствах! Обычно мы полагались на 7,62 мм."
1013002-63 = "Подумай сама. Какой смысл стрелять, если ты даже отдачу контролировать не можешь, а?"
1013002-64 = "Куда разумнее нанести больше попаданий быстрым огнём!"
1013002-65 = "Ты шутишь, да? Если пламегаситель установлен правильно, ты даже разницы не почувствуешь."
1013002-66 = "Миф о том, что у 7,62 мм слишком сильная отдача, придумали те, кто не умеет нормально держать оружие."
1013002-67 = "Ты забываешь о вместимости боезапаса! Ты сможешь таскать три сотни патронов 7,62 мм, мелкая?"
1013002-68 = "Сейчас точная стрельба — роскошь. Куда важнее вести продолжительный подавляющий огонь!"
1013002-69 = "Ты же знаешь, что патроны не бесплатные, правда?"
1013002-70 = ""
1013002-72 = ""
1013002-75 = ""
1013002-76 = "Обе, хватит."
1013002-78 = "Но...!"
1013002-79 = "Погодите...!"
1013002-81 = "Я внимательно вас выслушала. И правда в том, что ни одна из вас не ошибается."
1013002-82 = "Но с чего вообще началась эта дискуссия?"
1013002-84 = "Э-Это..."
1013002-85 = "Мы пытались решить, какие боеприпасы лучше всего подойдут для защиты нашей школы."
1013002-87 = "Это хорошо. И я вижу, что обе вы больше всего хотите сохранить нашу школу в безопасности. Вот что важно!"
1013002-88 = "И вполне естественно по-разному подходить к одной и той же проблеме."
1013002-89 = "Так что, возможно, пора пересмотреть традиционный стиль дискуссий Ариуса."
1013002-90 = "Дом, разделённый сам в себе, не устоит, верно?"
1013002-92 = "...Она права."
1013002-93 = "Точно... Мы уже не прежний Ариус. Теперь мы новая, более сильная команда!"
1013002-95 = "Именно! Пожалуйста, помните об этом впредь."
1013002-96 = "Вы говорили об экономии на боеприпасах, но во время своей дискуссии сами потратили кучу патронов. И кому от этого польза?"
1013002-98 = "П-Прости, Субару."
1013002-100 = "И всё же я благодарна, что вы обе так переживаете за нашу школу!"
1013002-101 = "Нам предстоит долгий путь восстановления, и я понимаю желание вернуться к прежним порядкам."
1013002-102 = "Но постарайтесь мыслить шире. Обещаю, я тоже буду стараться изо всех сил."
1013002-103 = "Если у вас появятся вопросы или тревоги, не стесняйтесь обращаться ко мне."
1013002-105 = "...! Так и сделаем, Субару!"
1013002-106 = "Поняла! Спасибо!"
1013002-107 = ""
1013002-109 = ""
1013002-110 = ""
1013002-111 = "Фух..."
1013002-112 = "[s] «Ты прирождённый лидер, Субару.»"
1013002-113 = "Д-думаешь...?"
1013002-114 = "Я стараюсь. И мы все меняемся вместе."
1013002-115 = "Раньше я позволяла таким «дискуссиям» идти своим чередом. Всем было полезно выпустить пар."
1013002-116 = "И это был важный вопрос. Эти два типа боеприпасов несовместимы, а 5,56 мм широко используются и за пределами Ариуса."
1013002-117 = "Но мы не можем просто отказаться от 7,62 мм, к которым привыкло большинство из нас."
1013002-118 = "Даже моё оружие переделано под патроны 7,62 мм. В своё время это было практичным решением."
1013002-119 = "..."
1013002-120 = "Но мне всё же стало спокойнее."
1013002-121 = "Я думала, что к этому моменту все уже отвернутся от меня. Я больше не та, какой была раньше."
1013002-122 = "Но... они всё ещё идут за мной. Значит, хоть немного верят."
1013002-123 = "[s3] «Значит, тебя уважают как старшую, Субару.»\n[s4] «Ты хорошо заботишься о студентах Ариуса.»"
1013002-126 = "Ха-ха. Можешь хвалить меня сколько угодно. Мне всё равно нечего предложить."
1013002-127 = "Но... иногда я всё ещё чувствую вину. И, без сомнения, на мне лежит ответственность за наше будущее."
1013002-128 = "Если мне удастся приучить всех к открытым разговорам вместо перестрелок, думаю, всем станет легче."
1013002-129 = "..."
1013002-130 = "И всё же иногда мне кажется, что я едва коснулась поверхности наших проблем."
1013002-131 = "И я думаю: не просто ли я заклеиваю наши проблемы пластырем, вместо того чтобы добраться до их корня?"
1013002-132 = "[s5] «Ладно, теперь я вижу проблему.»\n[s6] «Думаю, тебе самой тоже нужен кто-то, с кем можно поговорить.»"
1013002-135 = "Прости? Почему ты так думаешь?"
1013002-136 = "Эм... Ты говоришь, дело не лично во мне? Это скорее проблема из разряда «кто сторожит сторожей»?"
1013002-137 = "Я понимаю, о чём ты, но..."
1013002-138 = "Я... не уверена, что мне нравится твоя оценка."
1013002-139 = "[s7] «Мне за это платят.»\n[s8] «...Разумеется, я занимаюсь не только советами....»"
1013002-142 = "Ах. Да, я о тебе слышала."
1013002-143 = "Сенсей, которая своей природной харизмой притягивает студентов, а затем безвозвратно их меняет."
1013002-144 = "Хм? Где я услышала такую теорию заговора? Наверное, это был сюжет на канале «Кронос»."
1013002-145 = "[s] «Субару, речь совсем не об этом.»"
1013002-146 = "...Не надо выглядеть НАСТОЛЬКО убитой."
1013002-147 = "..."
1013002-148 = "Да, я понимаю. Тогда, если почувствую необходимость, обращусь к тебе."
1013002-149 = "Почему-то рядом с тобой я всегда начинаю говорить. И рассказываю больше, чем собиралась."
1013002-150 = "Ха-ха-ха. Полагаю, всё идёт по твоему плану, да?"
1013002-151 = "[s] «Субару, речь совсем не об этом.»"
1013002-152 = "...У меня странное чувство дежавю."
1013002-154 = "С противоречивыми чувствами и лёгким ощущением поражения я вернулась в Шале."
