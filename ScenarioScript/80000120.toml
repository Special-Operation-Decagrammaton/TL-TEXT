[translation]
80000120-1 = "Все пять чувств"
80000120-2 = "Ветра внешнего мира наконец начали проникать в Шанхайцзин."
80000120-3 = "Как президент и как студент, я не могла просто позволить этому пройти мимо. Поэтому сочла разумным хотя бы подать вам чашку чая."
80000120-4 = "[s] «Тогда спасибо.»"
80000120-5 = "Фу-фу. Думаю, благодарность должна выражать я."
80000120-6 = "Позвольте тогда заварить вам чай."
80000120-7 = ""
80000120-9 = ""
80000120-11 = "[ns] «Хм? Разве этот аромат не...»"
80000120-12 = "Как вам, Сенсей? В каком-то смысле этот аромат должен быть вам знаком."
80000120-13 = "Верно. Это запах шоколада. Чай сперва оценивают глазами по цвету, а затем носом по аромату."
80000120-14 = "И наконец насладиться вкусом ртом."
80000120-15 = "А чай, который я специально заварила на этот раз, называется «Чай из какао-крупки»."
80000120-16 = "[s] «Какао-крупки...?»"
80000120-17 = "Мгм. Их получают из высушенных и обработанных семян какао-бобов. В каком-то смысле их можно считать самой примитивной формой шоколада."
80000120-18 = "Аромат у них шоколадный, но сам вкус совсем другой. Ну как?"
80000120-19 = "[s] «Немного горький и ореховый... Идеально!»"
80000120-20 = "Вот как? Рада это слышать. Всё-таки сегодня день, когда принято наслаждаться сладким до тех пор, пока вкусовые рецепторы не взмолятся о пощаде."
80000120-21 = "По крайней мере, я хотела предложить вам немного иной вкус."
80000120-22 = "Ну что же, Сенсей, продолжим наслаждаться. В конце концов, искусство чая заключается в том, чтобы медленным долгим завариванием раскрыть насыщенный аромат и вкус."
80000120-24 = "Мы с Кисакой спокойно наслаждались чаем из какао-крупки."
80000120-25 = "Пока я пил, тело одновременно расслаблялось и наполнялось энергией!"
80000120-26 = ""
80000120-27 = "Как чай, Сенсей? Хм? Чувствуете одновременный расслабляющий и бодрящий эффект?"
80000120-28 = "Фу-фу. Одной-двух чашек недостаточно, чтобы ощутить пользу, но семена какао известны тем, что хорошо помогают в профилактике сердечно-сосудистых заболеваний."
80000120-29 = "Говорят, они также замедляют старение и даже помогают снижать вес."
80000120-30 = "[s1] «Какой невероятный эффект...!»\n[s2] «Ещё одну чашку, пожалуйста!»"
80000120-33 = "Разумеется, я дам вам столько, сколько захотите. Но если бы вы чаще посещали Шанхайцзин, я могла бы раздобыть ещё больше."
80000120-34 = "Или мы могли бы отправлять этот чай в Шале."
80000120-35 = "Полагаю, я даже могла бы лично приходить в Шале и заваривать вам чай."
80000120-36 = "Почему бы не воспользоваться случаем и не узнать больше об искусстве чая?"
80000120-37 = "Хм? Вам понравится всё, что я для вас сделаю...?"
80000120-38 = "..."
80000120-39 = "...Думаю, это ваша плохая черта."
80000120-40 = "[s] «Что?!»"
80000120-41 = "Значит, вы сами не замечаете..."
80000120-42 = "Тогда добавлю ещё одну плохую черту."
80000120-43 = "Вы совершенно ничего не понимаете."
80000120-44 = "...Не дуйтесь так. Даже я не могу сделать вам поблажку в этом вопросе."
80000120-45 = "В любом случае, я приму это как ваше согласие..."
80000120-46 = "...и время от времени буду «совершать набеги» на Шале. Чтобы доставлять вам неудобства, Сенсей."
80000120-47 = "[s] «Только умеренно, пожалуйста...»"
80000120-48 = "Мм. На этот раз соглашусь."
80000120-49 = "Но я всё равно потребую возмещения за все «плохие» вещи, которые вы мне сделали."
80000120-50 = "Не смотрите так испуганно. Разумеется, я вас дразню."
80000120-51 = "...В основном."
80000120-52 = "В конце концов, я тоже..."
80000120-53 = "...немного над вами подшутила."
80000120-54 = "[s3] «Что...?!»\n[s4] «А ведь здесь и правда очень сильно пахнет шоколадом!»"
80000120-57 = "Фу-фу. Заметили?"
80000120-58 = "Это небольшая услуга от Общества восточной алхимии. Эти чайные листья были... особым образом обработаны."
80000120-59 = "Ты знала, Сенсей?"
80000120-60 = "Какао-крупка также улучшает кровообращение и оказывает тонизирующий эффект."
80000120-61 = "Конечно, это её базовые свойства. Не те, которые лично я добавила своему чаю."
80000120-62 = "Вернёмся к теме. Вам ведь интересно, какие особые свойства я добавила в чай."
80000120-63 = "Ничего особо зрелищного."
80000120-64 = "Я попросила сделать так, чтобы выпивший его пах насыщенным шоколадом."
80000120-65 = ""
80000120-67 = ""
80000120-68 = ""
80000120-69 = "Внезапно Кисаки поднялась и подошла ко мне..."
80000120-70 = "Что думаете, Сенсей?"
80000120-71 = "И правда пахнет насыщенным шоколадом... правда?"
80000120-72 = "[s] «Д-Да, определённо, но...!»"
80000120-73 = "Fufu. I see."
80000120-75 = "Сегодня День святого Валентина."
80000120-76 = "День, когда дарят шоколад тому, к кому испытывают чувства."
80000120-77 = "Можно ли сказать, что ты по-настоящему насладился чем-то, если не задействовал все пять чувств?"
80000120-78 = "Сильный аромат шоколада от Кисаки полностью захватил мои чувства!"
80000120-79 = "Ну что же."
80000120-80 = "Наслаждайтесь сколько захотите, Сенсей."
