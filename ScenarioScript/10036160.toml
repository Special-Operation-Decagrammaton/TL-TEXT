[translation]
10036160-1 = "Как Отряд создаёт воспоминания"
10036160-2 = ""
10036160-3 = "Всё закончилось...!"
10036160-4 = "Мы сделали это..."
10036160-5 = "Мы правда..."
10036160-6 = "Верно, мы выиграли приз!"
10036160-7 = ""
10036160-9 = ""
10036160-10 = ""
10036160-11 = "Поздравляю!"
10036160-12 = "Вы первые, кто прошёл финальный уровень!"
10036160-13 = "Вот, выберите желаемый приз из списка!"
10036160-14 = "Ты ведь хотела журнал, да?"
10036160-15 = "Поздравляю, Хиёри!"
10036160-16 = "В-Вы правда позволите мне выбрать?"
10036160-17 = "Мы ведь ради этого всё и затеяли."
10036160-18 = "Н-Ну тогда..."
10036160-19 = ""
10036160-21 = ""
10036160-22 = "Я-Я возьму билет в фотобудку!"
10036160-23 = ""
10036160-25 = ""
10036160-26 = "Серьёзно? Разве ты не начала играть из-за журнала?"
10036160-27 = "Не нужно сейчас жертвовать собой. Выбирай то, чего хочешь."
10036160-28 = "Э-Это и есть то, чего я хочу."
10036160-29 = "Новые выпуски журналов выходят каждый месяц... а фотографию нас четверых мы сможем хранить вечно!"
10036160-30 = "Мы не знаем, когда ещё выпадет такой шанс."
10036160-31 = "И, эм, может быть, потом Сенсей сможет заказать старые выпуски журнала, если я попрошу!"
10036160-32 = "Я бы на это не рассчитывала..."
10036160-33 = "Но всё же. Всё же..."
10036160-34 = ""
10036160-36 = ""
10036160-37 = "...Да. В словах Хиёри есть смысл."
10036160-38 = "Нам стоит сохранить воспоминания, которые мы создадим сегодня."
10036160-39 = "Х-Хи-хи, тогда пойдём все вместе и сделаем эту фотографию."
10036160-40 = "С-Сюда!"
10036160-41 = ""
10036160-43 = ""
10036160-45 = ""
10036160-46 = ""
10036160-47 = ""
10036160-48 = ""
10036160-49 = "М-м, если подумать, тесниться всем в одной фотобудке будет как-то неловко..."
10036160-50 = "Нам нужно позировать или...?"
10036160-51 = "Просто расслабьтесь."
10036160-52 = "Хи-хи, постарайся улыбнуться, Сао-Сао. Мисаки, ты тоже."
10036160-54 = "Поехали!"
10036160-55 = "Раз, два, три!"
10036160-56 = ""
10036160-59 = ""
10036160-61 = ""
10036160-62 = ""
10036160-63 = ""
10036160-64 = "Вот и готово, ваша моментальная фотография! Я распечатала по одной для каждой."
10036160-65 = ""
10036160-67 = ""
10036160-68 = "...Хм, получилось довольно неплохо."
10036160-69 = "Да. Все улыбаются."
10036160-70 = "Потому что нам всем весело."
10036160-71 = "Будет отличная память. Спасибо, Хиёри."
10036160-72 = "Х-Хи-хи..."
10036160-73 = "Ладно, куда теперь?"
10036160-74 = "Теперь?"
10036160-75 = "Здесь ещё полно всего, чем можно насладиться!"
10036160-76 = "Ночь только начинается. Правда, Сао-Сао?"
10036160-78 = "П-Правда! Дел ещё полно!"
10036160-79 = "Ты с нами, Мисаки?"
10036160-80 = "Как хотите. Я просто пойду вместе с вами."
10036160-82 = "Ладно, веселимся дальше! Вперёд!"
