22150-126 = "...Сенсей."
22150-127 = "Вы знаете, что такое проблема вагонетки?"
22150-128 = "Проблема...?"
22150-129 = "...вагонетки?"
22150-130 = "Концепция проста."
22150-131 = "Есть неуправляемый поезд, который невозможно остановить... он мчится к группе людей. Но есть рычаг, который переведёт его на другой путь, где стоит только один человек."
22150-132 = "Эта задача заставляет сделать выбор. Пожертвуете одним человеком, чтобы спасти многих, или многими, чтобы спасти одного?"
22150-133 = "Да, кто-то должен потянуть рычаг и спасти большее число людей."
22150-134 = "...И я решила взять эту роль на себя."
22150-135 = "У меня нет злого умысла. Я лишь хочу..."
22150-136 = "Заткнись! Хватит нести эту чушь! Отдай нам Алису!"
22150-137 = "...А? Ты..."
22150-138 = "Я всё слышала!"
22150-139 = "Ты по своей прихоти забрала Алису, наговорив всякой нелепицы!"
22150-140 = "...Это вовсе не было нелепостью."
22150-141 = "Уверена, ты прекрасно это понимаешь как человек, пострадавший от принцессы Безымянных Богов..."
22150-142 = "Нет, не понимаю! Ни капельки!"
22150-143 = "...!"
22150-144 = "Я знаю только одно: мы хотим вернуть Алису!"
22150-145 = "Эй..."
22150-146 = "Момои..."
22150-147 = "Ты похитила Алису и придумала дурацкое оправдание, будто она угрожает Кивотосу! Это чушь!"
22150-148 = "Я писала игровые сценарии, которые реалистичнее твоей постановки!"
22150-149 = "Мне плевать на твой дурацкий сюжет!"
22150-150 = "Теперь я понимаю. Что бы я ни сказала, вы всё равно не захотите увидеть правду."
22150-151 = "Похоже, никто никогда не поймёт ни меня, ни всё, что я делаю."
22150-152 = "Авангард, в бой."
22150-153 = ""
22150-155 = ""
22150-158 = "Ого! Как же убого он выглядит!"
22150-159 = "Дизайн, конечно, весьма необычный..."
22150-160 = ""
22150-162 = ""
22150-163 = ""
22150-164 = "...Его внешний вид не имеет значения для эффективности."
22150-165 = "[s] «Я же вижу: в глубине души тебя саму это не устраивает! Рио!»"
22150-166 = "Тебе не нужно меня понимать. Всё нормально. Никому не нужно. Я делаю то, что правильно."
22150-167 = "В-Вааааа?!"
22150-168 = "[ns] «Все, осторожно! Наступает!»"
