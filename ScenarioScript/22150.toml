[translation]
22150-1 = "Episódio 15;Armadilha"
22150-2 = "Asuna! Lá vamos nós!"
22150-10 = "...!"
22150-21 = "Agora!"
22150-33 = "É inútil!"
22150-42 = "Não vou deixar você escapar!"
22150-46 = "(...Elas são bem fortes.)"
22150-47 = "(Como agentes especializadas em combate em equipe, a C&C é um clube com uma coordenação muito forte...)"
22150-48 = "(Táticas perfeitamente sincronizadas... É o maior diferencial delas em relação às forças de outras escolas —)"
22150-51 = "...Não há brechas nessa estratégia."
22150-52 = "Sendo assim..."
22150-57 = "...Líder, isso é...!"
22150-61 = "Hein? O que é isso?!#nO chão está tremendo todo!!"
22150-62 = "Não é só isso... Akane, tem algo estranho."
22150-63 = "...O prédio está se movendo?"
22150-67 = "Ei...?! Que diabos é isso?!"
22150-68 = "Líder...!! As comportas...!"
22150-74 = "O tremor... parou?"
22150-75 = "Cadê as outras...?"
22150-81 = "Alterei a estrutura urbana desta área para isolá-la das outras senpais."
22150-82 = "Hã? Mas que história é essa?"
22150-83 = "\"Eridu\" originalmente também cumpre o papel de uma fortaleza projetada para repelir invasores."
22150-84 = "Com a autoridade concedida pela senhorita Rio, eu as separei."
22150-85 = "Pois bem, Neru-senpai. Com isso, suas chances de vitória tornaram-se praticamente nulas."
22150-86 = "..."
22150-87 = "Hmph... Chances de vitória... e não sei mais o quê..."
22150-88 = "— Tá tirando com a minha cara."
22150-97 = "Hein?! Es-espera aí! A conexão acabou de...!"
22150-98 = "Isso é..."
22150-99 = "Veritas... Então eram mesmo vocês."
22150-100 = "Não esperava menos das calouras daquela \"Himari\"."
22150-101 = "Hein? Q-quem é?!"
22150-109 = "A comunicação com a Veritas..."
22150-110 = "[s] \"Foi cortada...\""
22150-114 = "Eu já esperava por isso... mas você realmente chegou até aqui, Sensei."
22150-115 = "[s1] \"Rio...\"\n[s2] \"Vim impedir você.\""
22150-116 = "...Entendo."
22150-117 = "...Entendo."
22150-118 = "Como eu imaginava, minhas palavras e ações daquela vez não bastaram para convencer você..."
22150-119 = "Nem para convencer essas garotas."
22150-126 = "...Sensei."
22150-127 = "Você conhece o dilema do bonde?"
22150-128 = "Dilema...?"
22150-129 = "...Do bonde?"
22150-130 = "É uma história simples."
22150-131 = "Quando um trem desgovernado, sem freios, segue pelos trilhos:#nvocê sacrifica uma pessoa para salvar a maioria —"
22150-132 = "ou sacrifica a maioria para salvar uma única pessoa —#né um dilema que impõe essa escolha."
22150-133 = "Sim. Alguém precisa assumir o papel de puxar a alavanca."
22150-134 = "E... eu estou apenas disposta a assumir esse papel."
22150-135 = "Não tenho malícia nem hostilidade desde o início.#nEu só —"
22150-136 = "Ah, chega! Eu não entendo nada disso!!#nDeixa de papo complicado e devolve a Aris!!"
22150-137 = "Ora, você é..."
22150-138 = "Eu já fiquei sabendo de tudo, viu?!"
22150-139 = "Que a Presidente falou um monte de coisa sem sentido e levou a Aris embora!"
22150-140 = "...Não é nada sem sentido."
22150-141 = "Justamente você, que foi atacada pela#n\"Princesa dos Deuses Sem Nome\", não deveria entender melhor do que ninguém?"
22150-142 = "Não entendo, não!"
22150-143 = "...!"
22150-144 = "Eu só quero tirar a Aris das mãos da Presidente e trazer ela de volta!"
22150-145 = "Mana..."
22150-146 = "Momoi..."
22150-147 = "Pra começo de conversa, sequestrar a Aris dando a desculpa de que ela é uma ameaça a Kivotos ou sei lá o quê,#né uma história de escala pequena demais!"
22150-148 = "A escala dos roteiros que eu escrevo normalmente é muuuito maior!"
22150-149 = "Uma historinha dessas não cola de jeito nenhum!"
22150-150 = "...É verdade. Deve ser difícil fazer vocês aceitarem isso agora."
22150-151 = "...Eu mesma compreendo perfeitamente que não serei entendida de imediato."
22150-152 = "— Avant-Garde, avançar."
22150-158 = "Uaaah?!#nQue brega..."
22150-159 = "Realmente, não é um design muito fofo, mas..."
22150-164 = "...A aparência não importa."
22150-165 = "[s] \"...Deu pra perceber um pouquinho o que você realmente pensa, Rio.\""
22150-166 = "Se não conseguem compreender, tudo bem.#nPodem continuar assim."
22150-167 = "U-uaaah?!"
22150-168 = "[ns] \"Cuidado, pessoal... Lá vem ele!\""
