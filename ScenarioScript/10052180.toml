10052180-66 = "...Для начала тебе стоило бы беспокоиться о себе."
10052180-67 = "Ладно. Честно говоря, будто к каждой моей конечности привязали по пятисоткилограммовому грузу. Так ощущается смерть?"
10052180-68 = "И всё потому, что оно спряталось внутри своего драгоценного энергетического столба и питает оттуда второе тело."
10052180-69 = "Я НЕ ПОНИМАЮ этого! Даже самый избалованный и эгоистичный ребёнок не стал бы так себя вести!"
10052180-70 = "К-Кей...? Ты точно в порядке...?"
10052180-71 = "Я в порядке. Мне совсем не хорошо, но я в порядке."
10052180-72 = "Если я не успею как следует врезать этой мелкой...!"
