10052180-13 = "А-а?! Что это?!"
10052180-14 = "Кья-а?! Н-нас... тянет к небу!!!"
10052180-15 = "Энергия Стального континента... Она снова сходится к алтарю!"
10052180-18 = "Перейдя эту землю, воздвигни алтарь на вершине пустынной горы."
10052180-19 = "Пусть тот уголь коснётся твоих уст, и ты очистишься от грехов."
