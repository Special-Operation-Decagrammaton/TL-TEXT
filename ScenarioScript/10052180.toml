10052180-28 = "[s] «Да. Всё так...»"
10052180-30 = "Х-хахаха, но зачем им было приводить... и нас сюда?"
10052180-31 = "Понимаю зачем. Они «пригласили» нас сюда, где у них преимущество своего поля."
10052180-32 = "Я не знаю, как это точно назвать, но, похоже, они очень не уверены в себе."
10052180-33 = "Т-Токи?! Иногда, даже если что-то правда, не обязательно всегда говорить это вслух..."
10052180-34 = ""
10052180-36 = ""
10052180-37 = ""
10052180-38 = "[ns] «Химари! Ты можешь пригнать сюда транспортный корабль??!»"
10052180-39 = "А? Да, мы приземлились совсем рядом."
10052180-40 = "Но почему...?"
10052180-41 = "[ns1] «Пока возвращайтесь на транспортный корабль!»\n[ns2] «Проанализируйте собранные нами ядра пророков!»\n[ns3] «Соберите для нас все данные, какие сможете!»"
10052180-46 = "[ns] «(А если всё пойдёт плохо...!)»"
10052180-47 = "Почему именно сейчас?"
10052180-48 = "(Они думают... что всё пойдёт плохо?)"
10052180-49 = "(Но тогда что будет с вами, Сенсей...?)"
