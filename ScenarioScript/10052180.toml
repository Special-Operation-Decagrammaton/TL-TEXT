10052180-2 = "[log][FF6666]Тогда я увидел новое небо и новую землю,[/log]"
10052180-4 = "[log][FF6666]ибо прежнее небо и прежняя земля миновали,[/log]"
10052180-6 = "[log][FF6666]и моря уже не было.[/log]"
