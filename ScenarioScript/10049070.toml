[translation]
10049070-1 = "Эпизод 7;Моризуки на скорости света 1"
10049070-3 = "35 градусов. Движется медленно."
10049070-4 = "Оценочная дистанция — 70 ярдов."
10049070-5 = "Наблюдаю цель. Цель жёлтая."
10049070-7 = "[ns1] «Жёлтая...?»\n[ns2] «Разве это был цвет Рабу?»"
10049070-10 = "Хм? Я думала, она белая, красная, немного чёрного, серого..."
10049070-11 = "Разве она не похожа на клубничный моти?"
10049070-12 = "Проверим, когда подойдём."
10049070-13 = ""
10049070-15 = ""
10049070-16 = "К-Капитан! Они снова здесь!"
10049070-17 = "Да ладно уже. Вам самим не надоело?!"
10049070-19 = "...Что на вас надето...?"
10049070-20 = "Тебе вообще стоит задавать такой вопрос?!"
10049070-21 = "Хм, похоже, они не знают."
10049070-23 = "Ч-Что происходит? Мы не на то шоу попали?"
10049070-24 = "Это Станаг, милый маскот из Тяжёлого Калибра!"
10049070-25 = "Маленькая проказница, которая помогает Белой и Розовой!"
10049070-26 = "Кекеке, да, именно!"
10049070-27 = "Я посмотрела, что это за штука, в которую вы нарядились."
10049070-28 = "Раньше вы нам помешали, и я подумала, что попытаетесь снова. А потом подумала: «Смогут ли волшебницы напасть на своего маскота прямо перед толпой?»"
10049070-29 = ""
10049070-32 = "О! Дневное шоу начинается!"
10049070-33 = "О, и теперь у них есть Станаг!"
10049070-35 = "Там снова Термитовая Белая и Розовая!"
10049070-36 = "И Станаг тоже!"
10049070-38 = "Ну и что теперь? Может, просто отступите, а?"
10049070-39 = "Всё равно вы нас не остановите!"
10049070-41 = "О-хо-хо!"
10049070-42 = "Тяжёлый Калибр и их жалкий маскот! Все собрались вместе, чтобы вас смело одним ударом!"
10049070-43 = ""
10049070-46 = ""
10049070-48 = ""
10049070-49 = "Кажется, я знаю этот голос..."
10049070-50 = "Правда? А я нет..."
10049070-51 = "[ns] «Это, наверное...»"
10049070-52 = ""
10049070-53 = ""
10049070-54 = ""
10049070-55 = "Какая дерзость — разгуливать тут и делать всё, что вам вздумается."
10049070-56 = "А ты кто?!"
10049070-58 = "Да, кто ты?!"
10049070-59 = ""
10049070-60 = "[ns3] «Это... Шимико из Библиотечного комитета!»\n[ns4] «Это... злая офицерша Эра!»"
10049070-63 = "Шимико, говоришь?!"
10049070-64 = "Где ты всё это время была?!"
10049070-66 = "Термитовая Белая, Термитовая Розовая и этот отвратительный маленький Станаг."
10049070-67 = "Как чудесно видеть вас всех вместе."
10049070-68 = "Трепещите перед силой Эры!"
10049070-70 = "Эра здесь!! Злая офицерша!!"
10049070-71 = "Как думаешь, Белая и Розовая смогут её победить?"
10049070-73 = "Злая... офицерша?"
10049070-75 = "Бедняга Станаг, каждый раз, когда появляется Эра, ей достаётся."
10049070-76 = "Что...?"
10049070-77 = "Это значит..."
10049070-78 = "Держись, Станаг!"
10049070-79 = "Она и мой враг тоже!"
10049070-80 = "Моя тёмная магия разорвёт тебя на куски!"
10049070-81 = "Почему сегодня ВСЁ идёт наперекосяк?!"
