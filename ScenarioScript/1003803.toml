[translation]
1003803-1 = "SRT спешит на помощь!"
1003803-2 = "Центр Кивотоса"
1003803-3 = "Мияко стояла перед витриной магазина, погрузившись в раздумья."
1003803-4 = "..."
1003803-5 = "[s] «Мияко?»"
1003803-6 = "Хм..."
1003803-7 = "[s] «Мияко!»"
1003803-8 = "А! Ох... Здравствуйте, Сенсей."
1003803-9 = "Прошу прощения. Я задумалась."
1003803-10 = "[s] «На что ты смотрела?»"
1003803-11 = "А, на животных в зоомагазине."
1003803-12 = "Когда меня направляют в этот район, я люблю заходить сюда и смотреть на них."
1003803-13 = "Смотрите, недавно у них появились кролики."
1003803-14 = "Вам не кажется, что кролики очаровательны?"
1003803-15 = "Эти коротенькие лапки, висячие ушки... Я могла бы смотреть на них весь день."
1003803-16 = "[s] «Почему бы тебе не взять одного?»"
1003803-17 = "Это..."
1003803-18 = "С возвращением, покупатель!"
1003803-19 = "Вы хотите взять кролика?"
1003803-20 = "Ч-Что? Ой, нет... Я просто..."
1003803-21 = "О... Понятно. Вы так часто заходите их навестить, что я решила, будто вы подумываете забрать одного домой."
1003803-22 = "Вы всегда смотрите на них с такой любовью. Они очень дружелюбные и легко обучаются. Почему бы вам не подумать об одном?"
1003803-23 = "Н-Ну... Я бы хотела... Но у меня нет ни денег, ни подходящих условий. Это было бы безответственно..."
1003803-24 = "[s] «Мы возьмём белого, того, что впереди.»"
1003803-25 = "Сенсей?! Что вы делаете?"
1003803-26 = "Подарок? Я не знаю, готова ли завести питомца..."
1003803-27 = "К тому же отряд RABBIT сейчас живёт в парке... Я не смогу обеспечить ему нормальный дом."
1003803-28 = "[s1] «Разве в парке ему не будет лучше, чем в клетке?»\n[s2] «Ты самый ответственный человек из всех, кого я знаю.»"
1003803-29 = "С-Сенсей..."
1003803-30 = "Это почти как спасательная операция."
1003803-31 = "С-Сенсей..."
1003803-32 = "Грустно видеть, как она живёт за витриной магазина."
1003803-33 = "Спасибо, Сенсей. Правда."
1003803-34 = "Я обязательно буду хорошо о ней заботиться."
1003803-36 = "Мияко выглядела счастливой, возвращаясь с новым кроликом на руках."
