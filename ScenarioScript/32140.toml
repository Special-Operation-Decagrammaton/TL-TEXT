[translation]
32140-1 = "Episódio 14;Confissão"
32140-2 = "Quarto do Sensei"
32140-5 = "B-boa noite, Sensei... V-você ainda estava acordado?"
32140-6 = "[s] \"Você também não consegue dormir, Hifumi?\""
32140-7 = "S-sim..."
32140-12 = "Eu também vim♡"
32140-13 = "Hanako-chan..."
32140-18 = "O que vocês estão fazendo...?"
32140-19 = "Até a Koharu-chan..."
32140-20 = "A prova é amanhã, o que vocês estão fazendo aqui? Não foram vocês que disseram que descansar também é importante...!?"
32140-21 = "Bem, isso é verdade, mas..."
32140-22 = "E parece que a Azusa também saiu pra algum lugar..."
32140-23 = "Bom, eu entendo perfeitamente o nervosismo, mas..."
32140-24 = "..."
32140-25 = "Na verdade, agora há pouco fui me encontrar rapidinho com o pessoal da Irmandade. Havia várias coisas que eu queria investigar..."
32140-26 = "É sobre o Anexo 19, onde está previsto fazermos a prova amanhã..."
32140-27 = "N-não me diga que mudaram o local de novo...!?"
32140-28 = "Não, não é isso. Porém, soube que daqui a pouco um número considerável de membros do Comitê de Justiça será enviado para lá para isolar o prédio inteiro."
32140-30 = "!!?"
32140-31 = "O prédio inteiro...?"
32140-32 = "Houve uma solicitação da Tea Party sob o pretexto de \"proteger documentos importantes necessários para o Tratado do Éden\", e parece que o Comitê de Justiça entrou em estado de alerta máximo para guardar todo o edifício."
32140-33 = "Além disso, ao que tudo indica, também foi decretada lei marcial no prédio principal. Parece que é por isso que estava estranhamente silencioso desde ontem."
32140-34 = "L-lei marcial... É a primeira vez que ouço falar de algo assim..."
32140-35 = "Provavelmente, ninguém terá permissão para entrar ou sair daquele prédio. Durante todo o tempo, até que o Tratado do Éden seja assinado."
32140-36 = "E-espera um pouco! Então o que vai acontecer com a nossa prova!?"
32140-37 = "...Em outras palavras, significa o seguinte: se quisermos fazer a prova, teremos que enfrentar o Comitê de Justiça como inimigas..."
32140-38 = "Ah..."
32140-39 = "N-não pode ser... E-eu vou explicar a situação para a Hasumi-senpai...!"
32140-40 = "...Acho difícil. A Hasumi-san provavelmente não foi informada dos motivos por trás disso."
32140-41 = "Se a Hasumi-san nos ajudar, isso será sinônimo de uma rebelião clara contra a Tea Party. Ela também acabaria sendo expulsa do Comitê de Justiça, não acha?"
32140-42 = "Uh, uuh..."
32140-43 = "Francamente... Parece que a Nagisa-san está mesmo falando sério em nos fazer ser expulsas..."
32140-44 = "Por que ir tão longe...?"
32140-49 = "...É culpa minha."
32140-50 = "Azusa-chan!? O-onde você estava...?"
32140-51 = "..."
32140-52 = "Pessoal, me escutem. Tenho algo para contar."
32140-53 = "Azusa-chan...?"
32140-54 = "..."
32140-55 = "Azusa...? O-o que houve? Está passando mal?"
32140-56 = "Azusa-chan, você está tremendo...?"
32140-57 = "...Há algo que escondi de vocês esse tempo todo."
32140-58 = "Mas, chegando a esse ponto, não posso mais continuar escondendo..."
32140-64 = "...A \"traidora de Trinity\" que a Nagisa da Tea Party está procurando sou eu."
32140-68 = "...Hã?"
32140-69 = "...Quê? D-do que você está falando assim de repente...?"
32140-70 = "..."
32140-71 = "Eu sou originalmente da Filial Arius. No momento, falsifiquei minha identidade nos documentos para me infiltrar em Trinity."
32140-72 = "A-Arius? Infiltrar...?"
32140-73 = "..."
32140-74 = "..."
32140-75 = "Ér... O que é isso? Arius...? Como assim?"
32140-76 = "A Filial Arius... É uma escola dissidente que no passado se opôs à coalizão de Trinity."
32140-77 = "Ouvi dizer que essa oposição causou conflitos e que, depois disso, elas se esconderam em algum lugar de Kivotos e vivem discretamente nas sombras, mas..."
32140-78 = "Isso mesmo. Até vir para cá, eu estive o tempo todo no distrito autônomo de Arius."
32140-79 = "Recebi uma missão como membro de Arius e agora estou infiltrada nesta escola desse jeito..."
32140-81 = "E essa missão é... destruir o halo de Nagisa Kirifuji, da Tea Party."
32140-82 = "...!?"
32140-83 = "Só pode ser mentira!? I-isso quer dizer que..."
32140-84 = "..."
32140-86 = "Arius está determinada a fazer qualquer coisa para eliminar a Tea Party."
32140-87 = "Primeiro, Arius enganou a Mika, membro da Tea Party, para me colocar dentro desta escola. Não sei dos detalhes, mas certamente contaram alguma mentira dizendo que queriam se reconciliar com Trinity."
32140-88 = "Entendo, a Mika-san... De fato, diziam que ela não levava jeito para a política, mas..."
32140-89 = "Provavelmente estão planejando jogar toda a culpa na Mika-san depois que tudo acabar... Seria esse o rumo esperado?"
32140-90 = "Eu sabia que Arius odiava Trinity, mas agora faz sentido..."
32140-91 = "E-espera... Que conversa é essa do nada...? Quer dizer, não acho que seja mentira, mas isso não tem nada a ver com a gente agora, né...?"
32140-92 = "Eu não entendo direito esse negócio de Arius, mas o que isso tem a ver com o nosso Clube de Aulas de Reforço...? Por que você está contando isso assim de repente, Azusa...?"
32140-94 = "..."
32140-95 = "..."
32140-96 = "..."
32140-101 = "Amanhã de manhã, as alunas da Filial Arius vão se infiltrar em Trinity visando a Nagisa."
32140-102 = "...Eu preciso proteger a Nagisa."
32140-103 = "..."
32140-104 = "A-amanhã...!?"
32140-105 = "!?"
32140-106 = "Sim, eu tenho que impedir isso de algum jeito."
32140-107 = "O prédio principal está sob lei marcial... E, por causa do exagero da Nagisa-san para a última prova, é justamente o momento em que o Comitê de Justiça não estará no prédio principal..."
32140-108 = "Entendo, é o dia perfeito para um ataque a uma figura importante. Parece que Arius também sabe usar muito bem a cabeça."
32140-109 = "Hanako-chan..."
32140-110 = "E-espera aí! Isso não tá estranho!?"
32140-111 = "E-eu não entendi muito bem, mas a Azusa veio pra acabar com a Tea Party, não foi? Então como assim proteger? A história não bate!"
32140-113 = "Isso é..."
32140-114 = "...A própria Azusa-chan veio para Trinity com esse objetivo desde o princípio. É isso, não é?"
32140-115 = "..."
32140-116 = "Desde o começo, você participou da missão de atacar a Nagisa-san para protegê-la... Por assim dizer, uma agente dupla."
32140-117 = "Atuando como contato para o lado de Arius, enviando relatórios falsos o tempo todo dizendo que estava tudo bem... quando, na verdade, estava se preparando para traí-las."
32140-122 = "...Por que você está tentando proteger a Nagisa-san? Sob as ordens de quem?"
32140-123 = "...Isso não foi ordem de ninguém. É uma decisão minha."
32140-124 = "Sem Nagisa Kirifuji, o Tratado do Éden será cancelado. Se esse tratado de paz deixar de existir, o caos em Kivotos só vai se aprofundar daqui para frente."
32140-125 = "E, se isso acontecer, não consigo acreditar que outra escola como Arius não vá surgir novamente..."
32140-126 = "Então você quer dizer que é pela paz?"
32140-127 = "...É uma história tão doce, quase como um sonho. Soa tão vazia quanto o próprio nome desse tratado."
32140-128 = "..."
32140-129 = "A Azusa-chan era uma mentirosa e uma traidora..."
32140-130 = "Escondeu sua verdadeira identidade em Trinity e escondeu suas verdadeiras intenções em Arius. Ao redor da Azusa-chan só havia pessoas enganadas por ela, iludindo tudo e todos à sua volta o tempo inteiro... Estou certa?"
32140-132 = "Hanako-chan..."
32140-133 = "...É exatamente como eu disse uma vez. Que eu acabaria traindo todas vocês, a confiança de vocês... e o coração de vocês."
32140-134 = "Azusa-chan..."
32140-135 = "Por isso, a \"traidora de Trinity\" que ela está procurando sou eu. É por minha causa que o Clube de Aulas de Reforço caiu nessa crise."
32140-136 = "Me desculpem de verdade. Quero que sintam raiva de mim. Porque toda essa situação atual foi causada por mim..."
32140-137 = "[s] \"...Não é bem assim.\""
32140-138 = "...Sensei?"
32140-139 = "[s] \"A verdadeira causa original certamente foi a 'falta de confiança'.\""
32140-140 = "..."
32140-144 = "[ns] \"Se a Nagisa tivesse confiado mais na Hifumi, na Hanako, na Azusa, na Hasumi e na Koharu.\""
32140-148 = "[ns] \"Se a Mika tivesse confiado mais na Nagisa.\""
32140-152 = "[ns] \"Se todas tivessem confiado mais profundamente umas nas outras, nada disso teria acontecido.\""
32140-153 = "..."
32140-154 = "É verdade, talvez seja isso mesmo."
32140-155 = "É difícil mudar alguém que deixou de confiar em todo mundo, como a Nagisa-san agora. Até porque confiar em alguém já é difícil por natureza."
32140-156 = "...Mas a Azusa-chan abriu o coração para nós desse jeito. Ela poderia ter continuado calada, mas nos pediu desculpas."
32140-157 = "...Me desculpe, aquilo que eu disse agora há pouco... como posso explicar? Acabei sentindo uma vontade irresistível de ser maldosa. Olhar para o rosto tão sincero da Azusa-chan deixou meu coração inquieto de algum jeito."
32140-158 = "..."
32140-159 = "O Clube de Aulas de Reforço nasceu, de um jeito meio incomum, como uma espécie de palco que atrai os holofotes."
32140-160 = "Normalmente, uma \"espiã\" como a Azusa-chan jamais deveria permanecer por tanto tempo em um lugar que chama tanta atenção."
32140-161 = "Desaparecer sem que ninguém percebesse... Meios e oportunidades para fazer isso não devem ter faltado até agora."
32140-162 = "...No entanto, a Azusa-chan não fez isso."
32140-163 = "..."
32140-164 = "E eu sei o motivo."
32140-165 = "...Porque o tempo que passou no Clube de Aulas de Reforço foi divertido demais. Não é verdade?"
32140-166 = "...!"
32140-167 = "Estudar todas juntas, fazer as refeições, lavar roupa, limpar... Porque tudo o que fazíamos era sempre muito divertido."
32140-168 = "Por isso, você não queria destruir esses momentos felizes..."
32140-169 = "Esforçar-se junto com todas rumo a um objetivo... E aprender coisas que não sabia junto com a Hifumi-chan, a Koharu-chan e o Sensei era tão divertido..."
32140-170 = "Estou errada, Azusa-chan?"
32140-171 = "..."
32140-172 = "Isso é... Eu..."
32140-173 = "..."
32140-174 = "...Não, é verdade."
32140-175 = "...Talvez seja isso mesmo."
32140-176 = "Aprender algo, fazer as coisas junto com todas vocês..."
32140-177 = "Eu não consegui abrir mão desse tempo tão feliz..."
32140-178 = "...Ainda há tantas coisas que eu quero conhecer."
32140-179 = "A praia, os festivais, o parque de diversões... Ainda há tantos lugares aonde quero ir e tantas coisas que quero saber..."
32140-180 = "Azusa-chan..."
32140-181 = "..."
32140-182 = "Acabei falando como se soubesse de tudo, mas... eu entendo esse sentimento. Afinal... sim. Houve uma pessoa que pensou exatamente da mesma forma."
32140-183 = "...?"
32140-187 = "Por algum motivo, ela levava jeito para tudo e era do tipo que recebia bajulações de todos ao redor, não importava o que fizesse..."
32140-190 = "A Urawa-san é mesmo incrível! Resolver uma questão dessas com tanta facilidade...!"
32140-192 = "Urawa-sama, precisamos da sua cooperação para este plano. Fufu..."
32140-194 = "Urawa-san, não quer vir conosco? Para manter aquela Tea Party em xeque, nós precisamos—"
32140-196 = "Por favor, vá se preparando, Hanako Urawa-san. Pois a cadeira da Tea Party do ano que vem já é praticamente sua."
32140-198 = "...Haa."
32140-199 = "Mesmo eu não sendo esse tipo de pessoa..."
32140-201 = "Eu, eu..."
32140-203 = "Para aquela pessoa, a Escola Geral Trinity era um espaço cheio de hipocrisia, enfeitado com mentiras e falsidades."
32140-204 = "Sem poder falar o que realmente sentia para ninguém, sem poder mostrar quem realmente era para ninguém..."
32140-206 = "..."
32140-207 = "...Isso não é solitário?"
32140-209 = "..."
32140-210 = "Para aquela pessoa, tudo era sem sentido... e ela estava tentando largar a escola."
32140-211 = "Afinal, continuar vivendo daquele jeito era o mesmo que estar em uma prisão."
32140-212 = "Mas... a Azusa-chan era diferente daquela pessoa."
32140-213 = "Mudando de assunto por um instante... Azusa-chan, na prática, quando tudo isso acabar, a sua vida nesta escola também vai chegar ao fim, não é?"
32140-214 = "Para começo de conversa, você entrou falsificando documentos e, se vai acabar traindo Arius no final, isso significa que não terá nenhum lugar para onde voltar, certo?"
32140-215 = "Ah..."
32140-216 = "..."
32140-217 = "Mesmo sabendo disso, a Azusa-chan... sempre deu o seu melhor no Clube de Aulas de Reforço."
32140-218 = "Enquanto aquela pessoa arruinava as provas de propósito para tentar fugir da escola... por outro lado, a Azusa-chan viveu sua curta vida escolar com todas as forças."
32140-219 = "Por que ir tão longe? Que sentido haveria nisso...?"
32140-220 = "Quando, como a própria Azusa-chan sempre repetia, tudo deveria ser em vão."
32140-221 = "Mas, ao mesmo tempo... a Azusa-chan sempre acrescentava outras palavras logo depois."
32140-223 = "...Sim. Mesmo que tudo seja em vão, isso não é motivo para não dar o meu melhor hoje."
32140-225 = "Além disso, aquela situação dá pena, mas não podemos ficar apenas sendo oprimidas para sempre. Mesmo que tudo seja em vão, não devemos parar de resistir."
32140-227 = "E assim... finalmente, aquela pessoa também percebeu."
32140-228 = "...A alegria da vida escolar."
32140-229 = "Limpar a piscina de roupa íntima, sair todo mundo de maiô para uma caminhada noturna, desabafar sobre várias coisas nuas... Que fazer essas coisas tão comuns dando tudo de si, ao lado de pessoas com quem você pode se abrir por completo, era tão divertido assim."
32140-230 = "Sim... Quer dizer, não estávamos nuas..."
32140-231 = "A-a caminhada também não foi de maiô...!?"
32140-232 = "Quê, então aquilo era mesmo roupa íntima!?"
32140-234 = "Fufu♡"
32140-235 = "...É exatamente como a Azusa-chan disse. Mesmo que seja em vão, não devemos parar de resistir até o fim."
32140-236 = "Hanako..."
32140-237 = "Azusa-chan, você quer aprender mais, não quer? Quer conhecer mais coisas, não é?"
32140-238 = "Você não disse naquela ocasião que queria experimentar várias coisas com todo mundo? Como ir brincar na praia, ou virar a noite conversando no drink bar."
32140-239 = "Você vai desistir de tudo isso?"
32140-240 = "...Não há necessidade de desistir de nada."
32140-245 = "Nagisa Kirifuji-san... Vamos protegê-la do ataque de Arius."
32140-246 = "E, da nossa parte, faremos a prova em segurança e seremos aprovadas."
32140-247 = "Deixando a armadilha que armaram para nós exatamente como está, para que não possam fazer nenhuma reclamação depois..."
32140-248 = "Mesmo assim chegaremos ao local da prova, todas nós tiraremos mais de 90 pontos e seremos aprovadas de cabeça erguida."
32140-249 = "Essa não é a única resposta capaz de nos salvar agora?"
32140-250 = "...Mas isso deveria ser fisicamente impossível..."
32140-251 = "A prova começa às 9 horas. E o horário previsto para o início da operação de Arius também é exatamente o mesmo."
32140-252 = "Q-quem sabe pedir ajuda para outras pessoas...?"
32140-253 = "..."
32140-254 = "Isso também é verdade, mas... para garantirmos a nossa aprovação na prova, só isso não basta."
32140-255 = "...Primeiro, vamos tomar a iniciativa."
32140-256 = "Até agora fomos manipuladas em meio a várias mentiras e artimanhas... mas agora é a nossa vez de dar o troco."
32140-262 = "Afinal, aqui e agora temos um membro do Comitê de Justiça, uma especialista em guerra de guerrilha, uma pessoa autodeclarada comum que recebe o favoritismo da Tea Party, e alguém que conhece quase tudo sobre Trinity."
32140-263 = "...?"
32140-264 = "F-favoritismo...!?"
32140-265 = "...?"
32140-269 = "E, além de tudo, ainda temos o Sensei [USERNAME] da \"Schale\", que funciona quase como uma chave-mestra, não é?"
32140-270 = "[s] \"B-bom...\""
32140-271 = "Com essa combinação, certamente..."
32140-272 = "...dá para derrubar um lugar como Trinity em meio dia♡"
32140-273 = "...Hã!?"
32140-274 = "Quê, como assim!? O que você pretende fazer!?"
32140-275 = "..."
32140-280 = "Como assim o que eu pretendo fazer? Vamos apenas fazer a prova e passar♡"
32140-281 = "Por ora, deixem os detalhes da operação comigo."
32140-282 = "Vamos, agora é a hora de unirmos forças. Vamos lá!"
32140-283 = "[ns] \"Ér... P-por enquanto, vamos dar o nosso melhor!\""
32140-286 = "Próximo;O Primeiro Disparo"
