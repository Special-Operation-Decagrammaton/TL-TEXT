[translation]
32140-1 = "Эпизод 14;Признание"
32140-2 = "Комната Сенсея"
32140-5 = "Привет, Сенсей... Я подумала, что вы, возможно, ещё не спите."
32140-6 = "[s] «Тоже не можешь уснуть?»"
32140-7 = "Да. Никак не получается заснуть."
32140-8 = ""
32140-12 = "Не забывай обо мне!"
32140-13 = "Ханако..."
32140-14 = ""
32140-16 = ""
32140-18 = "Что вы все здесь делаете?"
32140-19 = "Разве тебе не пора спать, Кохару?"
32140-20 = "На себя посмотри! Завтра у всех экзамен!"
32140-21 = "Тут не поспоришь..."
32140-22 = "Похоже, Азуса тоже куда-то убежала."
32140-23 = "Понимаю, что она волнуется, но..."
32140-24 = "..."
32140-25 = "Вообще-то я тоже выходила. Встретилась со знакомыми из Сестринства. Хотела кое-что выяснить."
32140-26 = "Речь о здании, где должен пройти наш экзамен."
32140-27 = "Н-Неужели место опять изменили?!"
32140-28 = "Нет. Мне сказали, что весь Отряд правосудия отправили охранять это здание."
32140-30 = "...?!"
32140-31 = "Весь отряд?.."
32140-32 = "Чайная партия сказала им, что в здании хранятся важные документы об Эдемском договоре, и велела защищать его любой ценой."
32140-33 = "В кампусе введено военное положение. Теперь понятно, почему там так тихо."
32140-34 = "Т-Ты серьёзно? Такого ещё никогда не случалось."
32140-35 = "До подписания Эдемского договора никому не разрешат входить в кампус или покидать его."
32140-36 = "Тогда как нам завтра сдавать экзамен?!"
32140-37 = "Чтобы попасть на экзамен, нам придётся сразиться со всем Отрядом правосудия."
32140-38 = "Нет..."
32140-39 = "Не может быть... Надо попробовать связаться с Хасуми."
32140-40 = "Не думаю, что это поможет. Скорее всего, Хасуми и остальные не знают истинной цели приказа."
32140-41 = "Если она нам поможет, то нарушит приказ. Как минимум Хасуми исключат из Отряда правосудия."
32140-42 = "..."
32140-43 = "Нагиса не отступит. Она сделает всё возможное, чтобы исключить Клуб дополнительных занятий."
32140-44 = "Неужели всё это необходимо? Почему она так подозрительна?"
32140-45 = ""
32140-47 = ""
32140-49 = "Это из-за меня."
32140-50 = "Азуса?! Где ты была?!"
32140-51 = "..."
32140-52 = "Мне нужно вам кое-что рассказать."
32140-53 = "Азуса?"
32140-54 = "..."
32140-55 = "Ты заболела? Ты такая бледная."
32140-56 = "И дрожишь."
32140-57 = "Я кое-что от вас скрывала..."
32140-58 = "...но больше не могу."
32140-59 = ""
32140-61 = ""
32140-62 = ""
32140-64 = "Нагиса ищет меня. Это я предательница Тринити."
32140-65 = ""
32140-67 = ""
32140-68 = "А?"
32140-69 = "О чём ты говоришь?"
32140-70 = "..."
32140-71 = "Изначально я училась в школе-спутнике Ариуса. Я смогла проникнуть в Тринити благодаря поддельным документам."
32140-72 = "А-Ариус? Проникнуть?.."
32140-73 = "..."
32140-74 = "..."
32140-75 = "Постойте. А что такое Ариус?"
32140-76 = "Школа-спутник Ариуса... это группировка, которая выступила против союза Тринити при его создании много лет назад."
32140-77 = "После этого возникло много осложнений, и с тех пор Ариус скрывается. По крайней мере, так я понимаю."
32140-78 = "Всё верно. До начала этой миссии я ни разу в жизни не покидала район Ариуса."
32140-79 = "Я проникла в Тринити по приказу Ариуса."
32140-81 = "Моя задача... уничтожить нимб Нагисы."
32140-82 = "Что?! Значит, ты...!"
32140-83 = "Твоя... задача — убить её?"
32140-84 = "..."
32140-86 = "Именно. Ариус намерен уничтожить Чайную партию любой ценой."
32140-87 = "Ариус убедил Мику устроить меня в Тринити под предлогом налаживания отношений между академиями."
32140-88 = "Они, должно быть, выбрали её из-за неопытности и наивности. В политике Мика куда менее искушена, чем Нагиса."
32140-89 = "Возможно, они даже собирались свалить на неё вину после покушения."
32140-90 = "Я слышала, что Ариус и Тринити — заклятые враги, но и представить не могла, что в наше время кто-то замышляет такое."
32140-91 = "Зачем ты нам всё это рассказываешь? Какое нам до этого дело?"
32140-92 = "Я понимаю, что за кулисами между Тринити и Ариусом творится многое, но при чём здесь наш клуб?"
32140-94 = "..."
32140-95 = "..."
32140-96 = "..."
32140-97 = ""
32140-99 = ""
32140-100 = ""
32140-101 = "Завтра утром студенты Ариуса пойдут на Тринити, чтобы добраться до Нагисы..."
32140-102 = "...а я буду её защищать."
32140-103 = "..."
32140-104 = "Т-Ты собираешься защищать Нагису?! Но ведь завтра...!"
32140-105 = "...?!"
32140-106 = "Знаю, но другого выхода нет. Я должна их остановить."
32140-107 = "В кампусе военное положение, но Нагиса разместила весь Отряд правосудия у здания, где должен пройти наш экзамен. Главное здание практически беззащитно."
32140-108 = "Лучшего момента для нападения не найти. Поэтому Ариус действует сейчас."
32140-109 = "Ханако..."
32140-110 = "Постойте, тут всё равно что-то не сходится!"
32140-111 = "Ты сказала, что должна убить Нагису! Почему теперь хочешь её защитить?!"
32140-113 = "Потому что..."
32140-114 = "Потому что именно ради этого ты и поступила в Тринити, верно?"
32140-115 = "..."
32140-116 = "Ты согласилась убить Нагису, потому что с самого начала на самом деле хотела её защитить. Ты двойной агент, да?"
32140-117 = "Ты говорила Ариусу то, что они хотели услышать, а сама тайком готовилась их предать."
32140-119 = ""
32140-122 = "Так почему ты защищаешь Нагису? Чьим приказам следуешь?"
32140-123 = "Ничьим. Это моё собственное решение."
32140-124 = "Без Нагисы Эдемский договор сорвётся. Тогда хаос в Кивотосе только усилится."
32140-125 = "И другие академии могут постичь та же участь, что и Ариус."
32140-126 = "Ты хочешь сказать, что делаешь это ради мира?"
32140-127 = "Ты наивна. То, что ты задумала, так же глупо, как и сам договор, Азуса."
32140-128 = "..."
32140-129 = "Ты лгунья и предательница."
32140-130 = "Ты скрывала свою личность от Тринити, а истинные намерения — от Ариуса. Ты лгала всем вокруг, заставляя их думать, будто ты не та, кем являешься. Разве не так?"
32140-132 = "Ханако..."
32140-133 = "Я уже говорила. Я знала, что однажды предам всё, что знала, — друзей, веру и собственное сердце."
32140-134 = "Ах, Азуса. Почему?.."
32140-135 = "Как я и сказала, я та предательница, которую ищет Нагиса. Я подвергла Клуб дополнительных занятий смертельной опасности."
32140-136 = "Простите... Я пойму, если вы меня возненавидите. Даже буду рада. Всё это происходит по моей вине."
32140-137 = "[s] «Это неправда, Азуса.»"
32140-138 = "Сенсей?"
32140-139 = "[s] «Мы оказались в этой передряге, потому что Нагиса никому не доверяла.»"
32140-140 = "..."
32140-142 = ""
32140-144 = "[ns] «Если бы только Нагиса доверилась вам четверым.»"
32140-146 = ""
32140-148 = "[ns] «А если бы Мика поверила Нагисе, то...»"
32140-152 = "[ns] «...ничего бы этого не случилось. Вот к чему приводит недоверие.»"
32140-153 = "..."
32140-154 = "Да, я знаю, Сенсей. И прекрасно это понимаю."
32140-155 = "Я также знаю, что изменить такую циничную девушку, как Нагиса, почти невозможно. Она верит только в себя."
32140-156 = "Но наша милая Азуса совсем другая. Она доверила нам правду и извинилась. Даже не оправдывалась и не огрызалась, когда я её поддразнивала."
32140-157 = "Прости за это. Просто ты была такой милой и невинной, что я не удержалась. Моё сердце чуть не растаяло."
32140-158 = "..."
32140-159 = "Странно. Наш Клуб дополнительных занятий оказался в центре всех событий, и на нас направили огромный прожектор, обнажив все наши маленькие грязные секреты."
32140-160 = "Обычно шпионке вроде Азусы не стоило бы долго оставаться на виду."
32140-161 = "Если бы ты и правда хотела, то могла бы бесследно исчезнуть ещё несколько недель назад..."
32140-162 = "...но не исчезла."
32140-163 = "..."
32140-164 = "И кажется, я знаю почему..."
32140-165 = "Тебе было так весело."
32140-166 = "...!"
32140-167 = "Тебе нравилось вместе заниматься, есть, даже стирать и убираться. Каждый раз тебе было весело."
32140-168 = "Ты не хотела, чтобы наше весёлое время вместе закончилось."
32140-169 = "Тебе нравилось, как мы все вместе шли к одной цели. Ты с удовольствием училась рядом с одноклубницами и Сенсеем."
32140-170 = "Разве не так, Азуса?"
32140-171 = "..."
32140-172 = "Ну, я..."
32140-173 = "..."
32140-174 = "Да. Ты права."
32140-175 = "Другого объяснения я не нахожу."
32140-176 = "Мне нравилось узнавать новое вместе с вами и делить с вами свою жизнь..."
32140-177 = "...и я не хотела, чтобы это изменилось."
32140-178 = "Нам ещё столько всего предстоит узнать и столько мест посетить вместе."
32140-179 = "Например, пляж, фестивали и парки развлечений."
32140-180 = "Азуса..."
32140-181 = "..."
32140-182 = "Понимаю. Я знала человека с похожими чувствами."
32140-183 = "...?"
32140-184 = ""
32140-186 = ""
32140-187 = "Она была такой талантливой и способной. Все невольно восхищались ею и хвалили её за каждое достижение."
32140-189 = ""
32140-190 = "Превосходная работа, Урава! Задача была непростой."
32140-191 = ""
32140-192 = "Хе-хе. Нам бы очень пригодилась твоя помощь, Урава."
32140-193 = ""
32140-194 = "Почему бы тебе не присоединиться, Урава? Только мы можем держать Чайную партию в узде."
32140-195 = ""
32140-196 = "Будь готова, Ханако. В следующем году в Чайной партии почти наверняка освободится место для тебя."
32140-197 = ""
32140-198 = "*вздыхает*"
32140-199 = "Это не я..."
32140-200 = ""
32140-201 = "Я всего лишь хочу..."
32140-203 = "Она считала, что в Главной школе Тринити царят обман, предрассудки и лицемерие."
32140-204 = "Там она не могла никому открыться и оставаться собой."
32140-206 = "..."
32140-207 = "Тебе не одиноко?"
32140-209 = "..."
32140-210 = "Всё казалось ей бессмысленным, и она изо всех сил пыталась бросить академию."
32140-211 = "Для неё это было словно побег из тюрьмы."
32140-212 = "Ты совсем не такая, как она, Азуса. Может, даже лучше."
32140-213 = "Если подумать, выполнив эту миссию, ты положишь конец своей жизни в академии, верно?"
32140-214 = "Ты поступила сюда под чужим именем и собираешься предать место, откуда пришла. Когда всё закончится, тебе некуда будет возвращаться."
32140-215 = "Я-Я даже об этом не подумала..."
32140-216 = "..."
32140-217 = "Ты знала, что так и будет, но всё равно отдавала все силы Клубу дополнительных занятий."
32140-218 = "Та девушка намеренно заваливала экзамены, чтобы сбежать, а ты старалась изо всех сил."
32140-219 = "Почему? Зачем так стараться? Ты сама сказала: vanitas vanitatum. Суета сует — всё суета."
32140-220 = "В этих словах, несомненно, есть доля правды..."
32140-221 = "...но ты сказала не только это. В конце ты добавила ещё кое-что."
32140-223 = "Да. Даже если всё тщетно, это не повод не жить изо всех сил."
32140-225 = "Но не позволяй другим издеваться над собой. Даже если всё бессмысленно, никогда не сдавайся."
32140-226 = ""
32140-227 = "И тогда та девушка поняла кое-что."
32140-228 = "Она поняла, насколько прекрасной может быть жизнь в академии."
32140-229 = "Убирать бассейн в одном белье, гулять посреди ночи в одном купальнике, устраивать симпозиум с подругами, когда на них вообще ничего не надето... Это было так весело."
32140-230 = "Не помню, чтобы всё было именно так..."
32140-231 = "Это был симпозиум В КУПАЛЬНИКАХ! Мы были в купальниках!"
32140-232 = "Так ты всё-таки убиралась в бассейне в одних трусиках! Признаёшься!"
32140-234 = "Хи-хи. ♥"
32140-235 = "Оказалось, что та девушка не так уж отличается от тебя, Азуса. И даже если всё суета сует, думаю, нам пока не стоит сдаваться."
32140-236 = "Ханако..."
32140-237 = "Разве ты не говорила, что хочешь узнать больше? Открыть для себя новое?"
32140-238 = "Что тебе ещё столько всего хочется испытать? Например, съездить на пляж или гулять всю ночь."
32140-239 = "Зачем теперь отказываться от этих мечтаний?"
32140-240 = "Не нужно. Ничего не изменилось."
32140-241 = ""
32140-243 = ""
32140-244 = ""
32140-245 = "Теперь твоя миссия — НАША миссия. Мы защитим Кирифуджи Нагису от нападения Ариуса."
32140-246 = "А затем сдадим экзамен."
32140-247 = "Тогда этой ведьме не к чему будет придраться. Сдадим, несмотря на все нелепые условия, которые она нам поставила."
32140-248 = "Неважно, сколько солдат она выставит у экзаменационного здания и сколько предметов будет в тесте. Каждая из нас наберёт не меньше 90 баллов."
32140-249 = "Какой у нас ещё выбор?"
32140-250 = "Но... как? Это физически невозможно."
32140-251 = "Нападение Ариуса начнётся одновременно с экзаменом."
32140-252 = "Может, попросим кого-нибудь помочь?.."
32140-253 = "Нет."
32140-254 = "Этого не хватит, чтобы помочь нам сдать."
32140-255 = "Если мы и правда на это решимся, нужно опередить противника."
32140-256 = "До сих пор мы только играли по правилам противника. Теперь придумаем собственный план. В этой комнате уже собрались все нужные таланты."
32140-257 = ""
32140-259 = ""
32140-260 = ""
32140-261 = ""
32140-262 = "Член Отряда правосудия, специалист по партизанской войне, обычная на вид студент, которому благоволит Чайная партия, и я — та, кто знает о Тринити всё."
32140-263 = "...?"
32140-264 = "Б-Благоволит?.."
32140-265 = "...?"
32140-266 = ""
32140-268 = ""
32140-269 = "И наконец, с нами Сенсей [USERNAME] — способный наставник Шале."
32140-270 = "[s] «Ну... пожалуй, да.»"
32140-271 = "С такой командой..."
32140-272 = "...мы могли бы захватить Тринити за полдня!"
32140-273 = "Ч-что?!"
32140-274 = "Кто сказал, что мы собираемся это делать?!"
32140-275 = "..."
32140-276 = ""
32140-278 = ""
32140-280 = "Не волнуйся. Я знаю, что план — сдать третий экзамен и избежать провала. ♥"
32140-281 = "Я всё спланирую. Вам останется следовать указаниям и выложиться на полную."
32140-282 = "А теперь покажем им, на что мы способны!"
32140-283 = "[s] «В-Пое-е-ехали?»"
32140-286 = "Следующий Эпизод;Поджигая фитиль"
