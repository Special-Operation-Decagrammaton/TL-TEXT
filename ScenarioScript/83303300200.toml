[translation]
83303300200-5 = ""
83303300200-6 = "С возвращением, глава префектов. Спасибо за вашу работу."
83303300200-7 = "Нам удалось конфисковать все статуи, которые председатель Макото расставила по академии. Ну, кроме тех, которые вы... разобрали."
83303300200-8 = "...Хорошо. Спасибо, Ако. Знаю, у тебя сейчас и своих обязанностей хватает."
83303300200-9 = "Нет, это пустяки... Но..."
83303300200-10 = "Почему мы вообще позволяем председателю Макото делать всё, что ей вздумается? Нужно наконец объяснить ей, что она неправа!"
83303300200-11 = "Я... понимаю, что ты чувствуешь."
83303300200-12 = ""
83303300200-14 = ""
83303300200-15 = "...М-м. Но сейчас не время."
83303300200-16 = "Ако, если это не слишком обременительно, я бы хотела сегодня закончить работу как можно быстрее. Поможешь мне?"
83303300200-18 = "А, конечно! Я немедленно начну!"
