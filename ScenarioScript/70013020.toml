[translation]
70013020-58 = "...Hehe, hehehe."

70013020-1 = "Сорняки не растут в одиночку 2"
70013020-2 = "[i][log]Когда Харука ещё была одна...[/log][/i]"
70013020-5 = "Фу-фу. Ещё одна успешная работа."
70013020-6 = "Но знаешь..."
70013020-7 = "Поиск кошек — это правда то, чем занимается хард-бойлд преступник?"
70013020-8 = "Н-Ну..."
70013020-9 = "В-Видишь ли, эти вещи на самом деле очень тесно связаны!"
70013020-10 = "Эта кошка думала, что наконец обрела свободу, а теперь мы возвращаем её владельцу!"
70013020-11 = "Разве отнять свободу у живого существа — не крайне злодейский поступок?"
70013020-12 = ""
70013020-14 = ""
70013020-15 = ""
70013020-16 = "Ку-фу-фу, раз ты так говоришь!"
70013020-17 = "*вздох* Ну да, раз ты так говоришь."
70013020-18 = "Эй, Кайоко. Почему эта кошка полезла на дерево, если знала, что обратно спуститься не сможет?"
70013020-19 = "Уверена, она не ХОТЕЛА там застрять."
70013020-20 = "...Почему спрашиваешь меня?"
70013020-21 = "Ну, разве ты не знаешь ответ?"
70013020-22 = "..."
70013020-23 = "Причина могла быть любой. Может, за ней гналась собака или даже другие кошки."
70013020-24 = "Она слишком сосредоточилась на побеге и перестала нормально думать."
70013020-25 = "С людьми такое тоже постоянно случается."
70013020-26 = "Ты знаешь, что идёшь неправильной дорогой, но уже оказался на ней, поэтому продолжаешь идти."
70013020-27 = "А потом в какой-то момент оборачиваешься и понимаешь, что уже прошёл точку невозврата."
70013020-28 = "Я видела, как это происходило со многими."
70013020-29 = "О-хо, не ожидала такого глубокого ответа на этот вопрос."
70013020-30 = "...Я тоже, наверное."
70013020-32 = "Фу-фу. Ну, раз мы заработали на жизнь, пойдём есть рамэн."
70013020-33 = "Сегодня всем двойные порции!"
70013020-34 = "Ого! Ару угощает? Тогда можно мне добавить чашу?"
70013020-35 = "К-Конечно. Я хочу построить такую «Решалу 68», которая заботится о своих сотрудниках."
70013020-36 = "...И это хард-бойлд и злодейски?"
70013020-37 = "Я СКАЗАЛА, что угощаю, так что хватит болтать всякую ерунду!"
70013020-38 = ""
70013020-40 = ""
70013020-41 = ""
70013020-42 = ""
70013020-44 = ""
70013020-45 = ""
70013020-46 = ""
70013020-47 = ""
70013020-48 = "А? Это девочка-сорняк."
70013020-49 = "«Девочка-сорняк»?"
70013020-50 = "Ага. Я постоянно вижу, как она ухаживает за сорняками на улице. Вот и начала её так называть."
70013020-51 = "А настоящее имя?"
70013020-52 = "Без понятия. Спрашивала — она не сказала."
70013020-53 = "...Как интересно."
70013020-55 = ""
70013020-56 = ""
70013020-57 = ""
70013020-59 = "...Хе, хи-хи."
70013020-60 = "Ты немного подросла со вчерашнего дня. И листочки так красиво распускаются."
70013020-61 = "Хочешь пить? Не переживай, я принесла тебе ещё воды."
70013020-62 = ""
70013020-64 = ""
70013020-65 = "Хи-хи... Хи-хи-хи..."
70013020-66 = ""
70013020-71 = ""
70013020-73 = "Я весь день тебя ищу. Так вот где ты пряталась?"
70013020-75 = "Н-Нет, я не пыталась прятаться!"
70013020-76 = "Хм? А что ещё можно делать в таком жутком тёмном переулке?"
70013020-77 = "Я-Я проверяла, как тут этот ребёнок..."
70013020-78 = "А? Ты назвала этот сорняк РЕБЁНКОМ?"
70013020-80 = "Ты не можешь говорить серьёзно. Какая вообще польза от сорняка?"
70013020-81 = "Он приносит тебе деньги? Потому что ты, между прочим, задерживаешь дань!"
70013020-82 = "Ребята! Затопчите этот сорняк!"
70013020-83 = "А, ах...!"
70013020-84 = "П-Простите! Только, пожалуйста...!!"
70013020-85 = ""
70013020-88 = ""
70013020-89 = ""
70013020-90 = ""
70013020-91 = ""
70013020-95 = "Н-Нет! Стойте! П-Пожалуйста...! Лучше бейте меня...!!"
70013020-96 = "Если таково твоё желание!"
70013020-97 = "Ха-ха-ха-ха...!!"
70013020-98 = ""
70013020-102 = ""
70013020-103 = "Фу-фу, теперь поняла? Твоё жалкое сопротивление бессмысленно."
70013020-104 = "Так что неси то, что нам должна! СЕЙЧАС ЖЕ!"
70013020-105 = "Иначе мои пули полетят прямо в эту твою уродливую морду!"
70013020-106 = ""
70013020-110 = ""
70013020-111 = ""
70013020-112 = ""
70013020-113 = "Ч-Что! Кто...?!"
70013020-115 = ""
70013020-117 = "..."
70013020-119 = "Ты хоть ПРЕДСТАВЛЯЕШЬ, в кого сейчас стреляешь?!"
70013020-121 = "Без понятия."
70013020-122 = "Но вряд ли это кто-то особенно важный."
70013020-123 = "Не если ты шастаешь по тёмным переулкам и издеваешься над слабыми."
70013020-125 = "К-Как ты смеешь...!"
70013020-126 = ""
70013020-128 = ""
70013020-129 = ""
70013020-130 = "Хм... Если я правильно считаю, вас меньше. Вы то-о-очно хотите затевать эту драку?"
70013020-131 = ""
70013020-133 = ""
70013020-134 = ""
70013020-135 = "..."
70013020-137 = "(Э-Этот взгляд... У меня аж мурашки!)"
70013020-138 = "В-Валим отсюда!"
70013020-139 = "Э-Это ещё не конец...! Далеко не конец!"
70013020-140 = ""
70013020-142 = ""
70013020-143 = ""
70013020-144 = ""
70013020-145 = ""
70013020-146 = "Эй, ты в порядке?"
70013020-147 = "..."
70013020-148 = ""
70013020-150 = ""
70013020-152 = ""
70013020-153 = "Вот уроды. Они всё вытоптали у девочки-сорняка."
70013020-155 = "..."
70013020-156 = "Э-Эй! Теперь всё хорошо. Пока мы их прогнали."
70013020-157 = "Ничего... не хорошо."
70013020-158 = "Они вернутся... Они всегда возвращаются..."
70013020-159 = "...Прости. Мне правда очень жаль..."
70013020-160 = ""
70013020-162 = ""
70013020-163 = "Я не смогла... защитить тебя..."
70013020-165 = "..."
70013020-166 = "В любом случае я не люблю тех, кто издевается над слабыми, а эти именно такими и выглядели."
70013020-167 = "Так что мы с ними разберёмся. Как тебя зовут?"
70013020-168 = ""
70013020-170 = ""
70013020-171 = "...Простите. Я не могу сказать."
70013020-172 = "Вам лучше держаться от меня подальше..."
70013020-173 = "Если вы свяжетесь с таким ужасным человеком, как я... вам тоже будет небезопасно."
70013020-175 = "Почему ты так говоришь—"
70013020-176 = "Пока уйдём."
70013020-177 = "Сейчас с ней бесполезно пытаться говорить разумно."
70013020-178 = "Если слишком сильно прижать загнанную в угол кошку... она прыгнет."
70013020-179 = "..."
70013020-180 = "Хорошо. Пока уйдём."
70013020-182 = "..."
70013020-183 = "Тогда до встречи, девочка-сорняк!"
70013020-184 = "Девочка... сорняк?"
70013020-185 = "Ах...! П-Прости! Я не хотела..."
70013020-186 = "После того как твой драгоценный ребёнок... Я правда не это имела в виду! Прости!"
70013020-187 = "..."
70013020-188 = "...Нет, всё нормально."
70013020-189 = "Я и правда как сорняк... Хи-хи..."
70013020-190 = "Это прозвище мне очень подходит..."
70013020-191 = "Хи-хи-хи..."
70013020-192 = ""
70013020-194 = ""
70013020-195 = "Если честно, мне её даже жалко."
70013020-197 = "Мы не можем просто оставить её так."
70013020-198 = "Ты хочешь помочь ей? Бесплатно?"
70013020-199 = "Р-Работать бесплатно?!"
70013020-200 = "Ни за что! Просто мне не нравится, что эти соплячки хозяйничают на НАШЕЙ территории. Поэтому я не могу это оставить."
70013020-201 = "Ну да, конечно. Пусть будет так."
70013020-202 = "Ты даже имени её не знаешь, Ару. И не знаешь, с чего вообще начинать поиски."
70013020-203 = ""
70013020-205 = ""
70013020-206 = "Н-Ну..."
70013020-207 = "Ладно. У меня есть догадка. Идите за мной."
70013020-209 = ""
70013020-210 = ""
70013020-211 = ""
70013020-212 = ""
70013020-214 = "Кайоко переходила от одного человека к другому, по пути собирая информацию."
70013020-215 = "Некоторое время спустя..."
70013020-216 = ""
70013020-217 = "Идите сюда. Кажется, я взяла их след."
70013020-218 = ""
70013020-220 = ""
70013020-221 = "О-о-о, Кайоко, как всегда впечатляет. Ну же, выкладывай!"
70013020-222 = "Те девчонки, которые издевались над ней, были не просто обычными хулиганками."
70013020-223 = "Похоже, они состоят в какой-то мафии."
70013020-224 = "Хулиганки... из мафии?"
70013020-225 = "Да. Они собирают «дань» с студентов от имени мафии."
70013020-226 = "Самая низшая мелочь в их иерархии."
70013020-227 = "Уберёшь их — на место придут ещё десять. Этой девочке не помочь, если не отрубить мафии голову."
70013020-228 = "Хм-м. Всё серьёзнее, чем мы думали, да?"
70013020-229 = "Как называется группа?"
70013020-230 = "Эта мафия называется..."
70013020-232 = "...семья Ригатони."