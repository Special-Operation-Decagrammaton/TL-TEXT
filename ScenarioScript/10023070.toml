[translation]
10023070-1 = "Эпизод 7;Опасная игра"
10023070-4 = "О нет..."
10023070-5 = "Я ничего не вижу..."
10023070-6 = ""
10023070-10 = "Ай! Кто наступил мне на ногу?"
10023070-12 = "Тсс! Момои! Потише!"
10023070-14 = ""
10023070-17 = ""
10023070-18 = "Хм!? Смотрите под ноги. Здесь скользко."
10023070-19 = "Это не пол скользкий, это мои волосы!"
10023070-20 = "[s] «Этой лестнице будто нет конца...»"
10023070-22 = "Из-за темноты мы идём медленно, но спускаемся уже довольно долго."
10023070-23 = ""
10023070-25 = ""
10023070-27 = ""
10023070-28 = ""
10023070-29 = ""
10023070-30 = ""
10023070-31 = "Ай! На этот раз я ударилась головой о стену!"
10023070-32 = "Стена? Значит, мы пришли в тупик!"
10023070-34 = "Все, пожалуйста, подождите минутку."
10023070-35 = "Кажется, здесь есть дверь... вот... здесь!"
10023070-36 = ""
10023070-38 = ""
10023070-39 = ""
10023070-40 = ""
10023070-45 = ""
10023070-48 = "Что выставят следующим? Выносите уже!"
10023070-49 = "Мы пришли сюда ради зрелища! Покажите что-нибудь, стоящее наших денег!"
10023070-50 = "...Даже если я не выиграю торги, мне бы хотелось увидеть это своими глазами..."
10023070-51 = "Именно!"
10023070-52 = "Тот самый, единственный..."
10023070-54 = "...Корона Короля Часов!"
10023070-56 = "Что...?!"
10023070-57 = "Я думал, аукцион завтра! Что происходит?"
10023070-59 = "Тише, тише. Прошу немного терпения. У нас ещё множество редких лотов."
10023070-60 = "Ночь ещё молода, а лотов предостаточно. Корона Короля Часов станет главным событием аукциона!"
10023070-62 = "Нам плевать на главное событие! Просто покажите её!"
10023070-63 = "Они правы, Мэйтаро! Ты слишком затягиваешь!"
10023070-64 = "Ты вообще собираешься что-то сказать о появлении Благородной Воровки? Можно ли продолжать в такой обстановке?"
10023070-65 = "Не только ты нервничаешь из-за этой воровки, Мэйтаро!"
10023070-66 = "Ха-ха-ха. Прошу, вы поднимаете шум из-за пустяка. Для полной защиты я пригласил не только C&C, но и Шале."
10023070-67 = "Я поручил им разобраться с Благородной Воровкой, чтобы обе стороны отвлекали друг друга достаточно долго и мы успели завершить настоящий аукцион."
10023070-68 = "Если они и правда победят — для нас это замечательно. Если же уничтожат друг друга, я тоже не стану жаловаться."
10023070-69 = "В худшем случае, если Благородная Воровка каким-то образом одолеет Шале и C&C, то всё равно не уйдёт невредимой. Тогда дело довершит моя личная охрана."
10023070-70 = ""
10023070-74 = "Как всегда, Мэйтаро всё предусмотрел. Уверен, мы в безопасности."
10023070-75 = "Хорошо, выносите следующий лот!"
10023070-76 = "Давайте покончим с ними побыстрее. И тогда наконец увидим Корону Короля Часов, верно?"
10023070-77 = "Благодарю вас всех."
10023070-78 = "Следующий лот — не что иное, как Золотая Канарейка!"
10023070-79 = "Единственный в своём роде жёлтый алмаз, добытый из метеорита и отполированный до состояния драгоценного камня!"
10023070-80 = "Когда-то он был причиной бесчисленных конфликтов на Чёрном рынке. После долгого исчезновения рад сообщить, что мне удалось добыть его для этого аукциона!"
10023070-81 = ""
10023070-83 = ""
10023070-85 = "Это... Мэйтаро...?"
10023070-86 = "Казалось, он исчез, но вот он здесь."
10023070-87 = "И каждый лот на этом аукционе, похоже, невероятно особенный или редкий."
10023070-89 = "В RPG аукционы обычно бывают местом, где продают редкие артефакты или проворачивают подозрительные схемы..."
10023070-90 = ""
10023070-92 = ""
10023070-93 = "А! Наверное, чтобы участвовать в аукционе, нужны Кредиты. Чтобы заработать Кредиты, надо выполнять особые задания или побеждать монстров!"
10023070-94 = "Сенсей, те люди — редкие монстры, из которых выпадет много Кредитов?"
10023070-95 = "[s] «Мы пока не уверены, но ради безопасности будем считать, что нет!»"
10023070-96 = ""
10023070-99 = ""
10023070-100 = "Здесь как-то шумно, и совсем не так, как мне нравится на аукционах."
10023070-101 = ""
10023070-103 = ""
10023070-104 = ""
10023070-106 = ""
10023070-108 = "А? C&C? Что вы делаете здесь внизу?!"
10023070-109 = "Почему вы здесь? Вы должны были сражаться с Благородной Воровкой!"
10023070-111 = "C&C здесь?! Что происходит, Мэйтаро!"
10023070-112 = "Ты нас обманул? Это ловушка?"
10023070-113 = "Корона Короля Часов всё-таки была здесь. Это украденный предмет, который C&C разыскивала."
10023070-114 = "...!"
10023070-115 = "И это ещё не всё. «Кронос, пожирающий своего сына», «Собирающая колосья Иштар», «Статуя Венеры»... Слишком много, чтобы перечислять."
10023070-116 = "[s] «Что с ними не так, Токи?»"
10023070-117 = "Каждый предмет, выставленный сегодня на торги, — незаконный лот, который перепродают в преступном мире."
10023070-118 = "[s1] «Благородная Воровка охотится за этими незаконными предметами?» \n[s2] «Это не обычные произведения искусства для кражи...»"
10023070-121 = "Помните, я говорила, что кроме поиска Благородной Воровки у меня есть ещё одна миссия?"
10023070-122 = "Моей задачей было найти эти украденные произведения, включая Корону Короля Часов."
10023070-123 = "Разумеется, я полагала, что обе миссии завершатся задержанием Благородной Воровки. Появление украденных произведений в подвале особняка стало неожиданным поворотом."
10023070-124 = "Ты не сказала мне, что C&C ещё и ищет украденные произведения!"
10023070-125 = "Вы не спрашивали."
10023070-126 = ""
10023070-128 = ""
10023070-129 = "Ух...!"
10023070-131 = "Охрана! Разберитесь с C&C и арестуйте их... аккуратно."
10023070-132 = ""
