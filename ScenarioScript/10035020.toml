[translation]
10035020-1 = "Эпизод 2;Я провожу тебя до водной горки!"
10035020-2 = "А, приятно со всеми вами познакомиться. Я владелец «Эгира»."
10035020-3 = "Нехватка спасателей доставляла нам немало головной боли, поэтому я очень рад, что Полицейская школа «Валькирия» пришла нам на помощь."
10035020-4 = "Спасибо за столь быстрый отклик. С плеч словно груз свалился."
10035020-5 = "Без проблем! На улицах или в аквапарке — общественная безопасность наша ответственность. Это даже в нашем названии!"
10035020-6 = "Предоставьте всё нам!"
10035020-7 = "Ха-ха-ха! Очень обнадёживает."
10035020-8 = "Я действительно благодарен, что вы здесь. Особенно в день открытия."
10035020-9 = "В таком случае, позвольте раздать вам задания."
10035020-10 = "Надеюсь, нам достанется лёгкое место."
10035020-11 = "Достанется. Поскольку вы здесь как вспомогательная сила, я назначу вас туда, где задачи наименее требовательные."
10035020-12 = "Хм-м... это место должно идеально подойти."
10035020-14 = "Главный аттракцион нашего парка — «Аква-бобслей»!"
10035020-17 = "И-Ик!"
10035020-18 = "О-Он намного выше, чем я думала!"
10035020-19 = "От одной мысли, что придётся скользить вниз с такой высоты, мне уже не по себе..."
10035020-20 = "Расслабься. Тебе не придётся спускаться с горки."
10035020-21 = "Это дело посетителей."
10035020-22 = "А-А, точно."
10035020-23 = "Тогда это уже намного менее страшно!"
10035020-24 = "(Хотя спускаться по этой лестнице мне тоже не понравится... но об этом я промолчу.)"
10035020-25 = "Продолжим..."
10035020-26 = "Нам нужно лишь нажать эту кнопку и отправить посетителей вниз, когда они будут готовы."
10035020-27 = "Обожаю, насколько всё просто. Легчайшая работа в мире."
10035020-28 = "Правда, директор?"
10035020-29 = ""
10035020-31 = ""
10035020-33 = "Нам не обязательно это любить, нужно просто выполнять работу."
10035020-34 = "И всё же это не должно быть слишком сложно."
10035020-35 = "Мы на работе."
10035020-36 = "Вот инструкция. Просто следуйте этим указаниям — и всё будет в порядке!"
10035020-37 = "А если возникнет что-то, чего нет в инструкции, не стесняйтесь обращаться ко мне в любое время!"
10035020-38 = "У нас с Фубуки обеих есть опыт работы с гражданами, так что мы справимся!"
10035020-39 = "...Отлично. Спасибо."
10035020-40 = "[s1] «У вас всё получится!»\n[s2] «У тебя всё получится, Канна!»"
10035020-42 = "Да, Сенсей. Спасибо."
10035020-43 = "Ладно, первый посетитель! Поднимайтесь!"
10035020-44 = ""
10035020-46 = ""
10035020-47 = "О-Ого... Отсюда выглядит ещё страшнее..."
10035020-48 = "Я правда смогу это сделать...?"
10035020-49 = "Эй, не нервничай! Сначала просто проверим твой рост и убедимся, что ты достаточно высокая."
10035020-50 = "Встань вот здесь, у ростомера..."
10035020-51 = ""
10035020-53 = ""
10035020-54 = ""
10035020-55 = "Хорошо, всё в порядке!"
10035020-56 = "Поднимитесь, пожалуйста, на эту платформу."
10035020-57 = "Н-Наконец-то...!"
10035020-58 = "Нажму кнопку на счёт три!"
10035020-59 = "Раз, два, три!"
10035020-60 = ""
10035020-62 = ""
10035020-63 = "А-а-а-а!"
10035020-64 = ""
10035020-65 = "[ns] «И-и-и...»"
10035020-66 = "Трясёт куда сильнее, чем я ожидала."
10035020-67 = "Ну что, Сенсей? Хотите попробовать?"
10035020-68 = "[s3] «Д-Для меня это немного слишком.»\n[s4] «Я лучше посмотрю.»"
10035020-71 = "Да, это и правда немного слишком, да?"
10035020-72 = "А я вообще не понимаю, зачем кто-то добровольно на это идёт."
10035020-73 = "Им что, просто хочется пострадать или как?"
10035020-74 = "Следующий посетитель, Фубуки!"
10035020-75 = "Хорошо!"
10035020-76 = ""
10035020-78 = ""
10035020-79 = "..."
10035020-80 = "Похоже, вы принесли собственное защитное снаряжение!"
10035020-81 = "[ns5] «А?»\n[ns6] «Что-то знакомое...?»"
10035020-84 = ""
10035020-85 = "Проверка роста пройдена! Нажму кнопку на три!"
10035020-86 = "Раз, ДВА!"
10035020-87 = ""
10035020-89 = ""
10035020-90 = "Ты же сказала на трииии!"
10035020-92 = "[ns] «(Ах да...)»"
10035020-93 = "Ой! Рука соскользнула!"
10035020-94 = "Ещё одна такая ошибка — и у кого-нибудь могут начаться проблемы с сердцем."
10035020-95 = "Директор, пожалуйста, поменяйтесь с Кирино."
10035020-96 = "Уже."
10035020-97 = "Кирино, пора меняться."
10035020-98 = "Хорошо..."
10035020-99 = ""
10035020-101 = ""
10035020-102 = ""
10035020-103 = "Ладно, наконец-то моя очередь."
10035020-104 = "Такое чувство, будто я ждала вечность."
10035020-106 = "Тише, пожалуйста!"
10035020-107 = "Встаньте сюда, если не затруднит."
10035020-108 = "Перед посадкой мы проведём физический осмотр — точнее, перед тем как вас отсюда увести."
10035020-110 = "Физический осмотр?"
10035020-111 = "Погодите, почему вы так говорите?"
10035020-112 = "Возражения не принимаются."
10035020-113 = "Красный флаг!"
10035020-114 = "К-Красный флаг?"
10035020-115 = ""
10035020-117 = ""
10035020-119 = "В посадке отказано."
10035020-120 = "Пожалуйста, спуститесь обратно по лестнице."
10035020-121 = "Ч-Что? Меня не пустят?"
10035020-122 = "Я целый час ждал, чтобы подняться сюда, а теперь вы говорите, что мне нельзя?!"
10035020-123 = ""
10035020-125 = ""
10035020-126 = "Согласно правилам..."
10035020-127 = "«„Аква-бобслей“ — быстрая горка с петлями и повышенным риском, поэтому кататься могут только посетители, соответствующие требованиям по росту.»"
10035020-128 = "Если посетитель хочет прокатиться, ваша работа — его пропустить!"
10035020-129 = "Позовите начальника!"
10035020-130 = "Эй-эй! Без баловства, здесь наверху это опасно!"
10035020-131 = "Пожалуйста, успокойтесь!"
10035020-132 = "Серьёзно, перестаньте вырываться! Это опасно!"
10035020-133 = "Вы можете упасть!"
10035020-134 = "Послушайте, я всего лишь прошу пустить меня—"
10035020-136 = ""
10035020-138 = ""
10035020-140 = "Ай, АЙ! Больно!"
10035020-141 = "Тихо."
10035020-142 = "Э-э, здесь не на что смотреть, граждане..."
10035020-143 = "Вы имеете право хранить молчание. Вы имеете право на адвоката."
10035020-145 = "Д-Директор! Это посетитель, а не преступник!"
10035020-147 = ""
10035020-148 = "Законы существуют, чтобы защищать безопасность людей."
10035020-149 = "И в аквапарке правила безопасности служат той же цели."
10035020-150 = "Следовательно, правила безопасности по сути равноценны законам."
10035020-151 = "А раз спасатель обязан поддерживать безопасность, вполне разумно наказывать тех, кто нарушает правила..."
10035020-152 = "Ч-Что этот спасатель ТВОРИТ?"
10035020-153 = "ТАК бывает, если ты недостаточно высокий для горки?!"
10035020-154 = "Может, потому что он ещё и спорил, но всё равно..."
10035020-155 = ""
10035020-157 = ""
10035020-158 = "Разве не так всё и должно быть?"
10035020-159 = "...Почему все так расстроились...?"
10035020-160 = "Директор, пожалуйста, отпустите посетителя!"
10035020-161 = ""
10035020-163 = ""
10035020-164 = "*ахает* *тяжело дышит*"
10035020-165 = "Вы меня убить пытались?!"
10035020-166 = "Вы напали на посетителя. У вас будут ОГРОМНЫЕ проблемы, дамочка!"
10035020-167 = ""
10035020-169 = ""
10035020-170 = "..."
10035020-171 = "Эм, директор? Вы в порядке?"
10035020-172 = "Послушайте, работа с общественной безопасностью не настолько буквальна, как вам может казаться..."
10035020-173 = "...и наша работа становится намного сложнее, если люди нас не любят."
10035020-174 = "Это было чрезмерное применение силы."
10035020-175 = "Вот как..."
10035020-176 = "Я опозорила нас всех."
10035020-177 = ""
10035020-179 = ""
10035020-182 = ""
10035020-185 = "О чём ты вообще думала?!"
10035020-186 = "Пыталась арестовать посетителя?!"
10035020-187 = "Этот посетитель проигнорировал все правила безопасности и настаивал, чтобы его пустили на горку—"
10035020-188 = "Даже если так, применять физическую силу к посетителю совершенно недопустимо!"
10035020-189 = "Разве у Бюро общественной безопасности нет опыта работы с людьми?! Я ДУМАЛ, что есть. Я ошибался?"
10035020-190 = "П-Прости..."
10035020-191 = "Мне очень жаль. Пожалуйста, примите мои извинения."
10035020-192 = "...Ладно."
10035020-193 = "На этот раз я закрою на это глаза."
10035020-194 = "И переведу вас в другую зону, где, надеюсь, подобное больше не повторится."
10035020-196 = "В другую зону?"
10035020-197 = "...Куда именно?"
10035020-199 = "В детский бассейн."
