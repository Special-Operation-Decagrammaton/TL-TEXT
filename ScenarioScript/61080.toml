[translation]
61080-1 = "Эпизод 8;По-ариусски"
61080-5 = ""
61080-7 = "Это правда они..."
61080-8 = "Отряд действительно здесь..."
61080-9 = "Какая наглость — вернуться сюда после того, как они нас бросили..."
61080-10 = ""
61080-11 = "Именно им всегда доставались все особые привилегии."
61080-12 = "Хотя, если оглянуться назад, это едва ли можно назвать «привилегиями»."
61080-13 = "Большой человек — это Сенсей? Я раньше никогда не видела его лично."
61080-14 = "Кажется, я видела в прошлый раз. Совсем не запомнился..."
61080-15 = ""
61080-16 = "...У меня кожа покалывает."
61080-17 = "А-А?! Мисаки, ты в порядке? В-Вот! Лосьон! У меня есть лосьон!"
61080-18 = "Это мило с твоей стороны, Хиёри, но она имела в виду не это."
61080-19 = "Она говорила о враждебности, которой пропитан воздух."
61080-20 = ""
61080-22 = ""
61080-23 = ""
61080-25 = ""
61080-26 = ""
61080-27 = "Отряд и Джомаэ Саори."
61080-28 = "Субару."
61080-29 = "Сразу к делу. Зачем вы здесь?"
61080-30 = "У нас здесь дело."
61080-31 = "Наслаждалась жизнью беглянки? Пряталась как крыса?"
61080-32 = "Да, всё ещё этим занимаюсь."
61080-33 = "Так ты вернулась, потому что наконец устала от своей новой роскошной жизни?"
61080-34 = "...Она и правда немного утомляет."
61080-35 = ""
61080-38 = "Сао-Сао...?"
61080-39 = "Прости, Ацуко. Здесь было бы неправильно лгать."
61080-40 = "К лучшему или худшему, пока я стою на земле Ариуса..."
61080-41 = ""
61080-43 = ""
61080-44 = "...кажется, я понимаю."
61080-46 = "Ясно. Значит, приползла обратно, потому что по ту сторону трава оказалась не зеленее?"
61080-47 = "Хм-м-м. Только вот места для тебя здесь уже нет. Так что ужасно жаль."
61080-48 = "Дело не в этом."
61080-49 = "Просто..."
61080-50 = "...Хех."
61080-51 = "Чего ты смеёшься?"
61080-52 = "Ничего. Прошу прощения."
61080-53 = "Я думала, что ответить, и не смогла не рассмеяться собственным мыслям."
61080-54 = "Ты всегда так хорошо умела невыносимо раздражать людей?"
61080-55 = "Если подумать — да. Умела."
61080-56 = "Если так и было, я хотела бы извиниться. Прошлое изменить нельзя, но..."
61080-57 = ""
61080-59 = ""
61080-61 = "Вот именно об этом я и говорю!"
61080-62 = ""
61080-64 = ""
61080-65 = "*вдох*... *выдох*..."
61080-66 = "Ладно, отлично. Тогда зачем вы вернулись?"
61080-67 = "Причина в том..."
61080-68 = "...чтобы мы все вместе сдали экзамен!"
61080-69 = ""
61080-71 = ""
61080-72 = "...Прости?"
61080-74 = "Ч-Что она только что сказала? Экзамен...? Я ведь не ослышалась?"
61080-75 = "Нет-нет. Я услышала то же самое."
61080-76 = "Понятия не имею, о чём она... Может, вот что с людьми делает внешний мир..."
61080-78 = "П-Погодите! Я вообще такого не ожидала. Мне нужна минута, чтобы это переварить!"
61080-79 = ""
61080-81 = ""
61080-82 = "..."
61080-83 = "Сколько ни прокручиваю это в голове, смысла не прибавляется!"
61080-85 = "Пф-ф-ф."
61080-86 = "М-Мисаки?"
61080-87 = "Прости, Химэ. Но теперь я понимаю, почему лидер смеялась."
61080-88 = "В такой ситуации невозможно не рассмеяться."
61080-89 = "А растерянность Субару стала вишенкой на торте."
61080-91 = "Хм. Понятно. Видимо, я неудачно подобрала слова."
61080-92 = "Недавно я слышала, что если сначала озвучить вывод, разговор пойдёт легче."
61080-93 = "Нет, подождите. Нужно было ещё учитывать контекст и момент..."
61080-94 = "Если ты это уже понимаешь, тогда и НАЧИНАЙ с контекста!"
61080-95 = "Эм."
61080-96 = "Другими словами..."
61080-97 = "..."
61080-99 = "Мы хотим, чтобы все вместе сдали экзамен."
61080-100 = "Ты действительно идиотка?!"
61080-101 = "Я-Я не знаю, как ещё это сформулировать."
61080-102 = "Смотрите. Вот экзаменационные листы."
61080-103 = ""
61080-105 = ""
61080-106 = ""
61080-108 = "А я спрашиваю, с чего студентам Ариуса вообще соглашаться на подобное!"
61080-109 = "Эм..."
61080-110 = "Потому что вы студенты?"
61080-111 = "Ты точно знаешь, как вывести человека из себя, Джомаэ Саори!"
61080-112 = ""
61080-114 = ""
61080-115 = "Давно мы не видели, чтобы Субару так взрывалась..."
61080-116 = "Ты что, не помнишь? Эти двое всегда бодались. Словно у них это в крови."
61080-117 = ""
61080-119 = "Н-Нам стоит что-нибудь сделать?"
61080-120 = "Что? Зачем? Она ведь ничего плохого не делает."
61080-121 = "Вообще-то это один из редких случаев, когда мне хочется за неё поболеть."
61080-122 = "Я чувствую то же самое. Давай, Сао-Сао!"
61080-123 = "Х-Хорошо..."
61080-124 = ""
61080-125 = "[ns] «Раз это не сильная сторона Саори, вмешаюсь я!»"
61080-126 = "С-Сенсей?"
61080-127 = "...Так вы и есть Сенсей из Шале."
61080-128 = "Приятно познакомиться."
61080-129 = "Добро пожаловать в Ариус, Сенсей [USERNAME]."
61080-130 = "По крайней мере, пока что."
61080-131 = "[s] «Я слышал о тебе от Саори.»"
61080-132 = "Почему от неё?"
61080-133 = "[s] «И-И от остальных членов отряда, конечно же!»"
61080-134 = "...Но почему?"
61080-135 = "В любом случае, ладно."
61080-136 = "Вы ведь понимаете, почему нам трудно принять, что посторонний приходит на нашу территорию и требует сдавать какой-то экзамен."
61080-137 = "[s] «Для студента учёба и экзамены — часть обязанностей!»"
61080-138 = "Почему вы навязываете Ариусу свой образ жизни и мышления?"
61080-139 = "[s1] «Но разве Ариус — не школа?»\n[s2] «И все вы определённо студенты, верно?»"
61080-142 = "...!"
61080-143 = "Мы... студенты?"
61080-144 = "Н-Ну, технически, наверное, да? Если понимать это совсем буквально."
61080-145 = "Ариус ведь тоже часть Академического города, верно?"
61080-146 = ""
61080-148 = "Н-Но..."
61080-149 = "...Таких, как мы..."
61080-150 = "Разве нас вообще можно считать обычными студентами?"
61080-151 = ""
61080-153 = ""
61080-154 = "...Я не считаю, что студент обязан учиться."
61080-155 = "Это всё, что я хотела вам сказать."
61080-156 = "[s] «...Верно. Возможно, это и правда так.»"
61080-157 = "Что...?"
61080-158 = "[s3] «Выслушайте меня, хорошо?» \n[s4] «Просто попробуйте один раз: учёбу, экзамены, „обычные“ ученические занятия.»\n[s5] «Если после всего этого вы всё ещё сочтёте их бесполезными, я отступлюсь.»"
61080-162 = "Зачем нам всё это делать? Просто чтобы подтвердить то, что мы и так знаем?"
61080-163 = "А? Быть студентом — значит ставить под сомнение свои убеждения и пробовать новое?"
61080-164 = "...Вы что, живёте в мире фантазий? Откуда такие идеалистические взгляды?"
61080-165 = "[s6] «Ты умеешь бить по больному...»\n[s7] «Быть учителем — значит быть хотя бы немного идеалистом.»"
61080-168 = "Вы так говорите, но совершенно не выглядите задетым."
61080-169 = "*вздыхает* Ладно. Я поняла."
61080-170 = "[s] «Правда? Поняла?!»"
61080-171 = "Да."
61080-172 = ""
61080-174 = ""
61080-175 = "Теперь я очень хорошо понимаю, что ваш взгляд на мир и наш движутся по параллельным линиям, которым никогда не пересечься."
61080-176 = ""
61080-179 = "...Ваше разочарование буквально ощущается. Я думала, взрослые зрелее."
61080-180 = "Ладно, раз вы хотите играть так..."
61080-181 = "Вы не войдёте в Ариус, пока сначала не докажете, что имеете право здесь находиться."
61080-182 = ""
61080-184 = ""
61080-185 = "[ns] «Эм...?!»"
61080-186 = "Отряд! Вы были и навсегда останетесь для нас предательницами!"
61080-187 = "Если вы действительно хотите вернуться в Ариус, докажите ценность своего существования здесь и сейчас!"
61080-188 = "Снять с предохранителя!"
61080-189 = ""
61080-195 = ""
61080-197 = "...Значит, другого выхода нет?"
61080-198 = ""
61080-202 = ""
61080-203 = ""
61080-204 = ""
61080-205 = ""
61080-206 = "[ns] «Что вы все сейчас творите?!»"
61080-207 = "Таков путь Ариуса, Сенсей."
61080-208 = "Вам это может не нравиться, но здесь всегда было именно так."
61080-209 = "В конце концов, дети здесь взрослеют через кулаки."
61080-210 = "Удивлены услышать такое от меня? Пожалуй, приму это за комплимент."
61080-211 = "Н-Но, эм... Это даже немного успокаивает! Сразу чувствуется, будто мы правда вернулись домой. Хи-хи."
61080-212 = "Ацуко, ты справишься без маски?"
61080-213 = "Да. В ней немного душно и трудно разговаривать."
61080-214 = "Тебе больше не нужно так обо мне беспокоиться, Саори. Я стала сильнее."
61080-215 = "...Понятно."
61080-216 = "Слушайте внимательно, Сенсей. Найдите себе безопасное место."
61080-217 = "А потом... мы будем действовать по вашим указаниям."
61080-218 = ""
61080-219 = "[ns] «Почему всё всегда заканчивается вот так...?»"
61080-221 = "Это Ариус!"
61080-222 = "Это Ариус!"
61080-223 = "Если вы верите в свои слова — докажите это!"
61080-224 = "Сила — это власть!"
61080-225 = "Без силы нет справедливости, без мощи нет убеждений!"
61080-226 = "И единственный, кто может отвечать за твою жизнь, — ты сама!"
61080-227 = "ГРА-А-А!!"
61080-228 = ""
61080-231 = ""
61080-232 = "..."
61080-233 = "Отряд Ариус."
61080-234 = ""
61080-237 = ""
61080-239 = ""
61080-241 = ""
61080-243 = ""
61080-244 = ""
61080-245 = "Приготовиться к бою."
