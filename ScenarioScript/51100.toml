[translation]
51100-1 = "Эпизод 10;Пылающие щёки"
51100-5 = ""
51100-6 = "[ns] «Юкари, ты немного не в себе. Хочешь передохнуть?»"
51100-7 = ""
51100-9 = ""
51100-10 = "Ах..."
51100-11 = "Я... не в себе?"
51100-12 = "А, ну... Эм..."
51100-13 = "...Я думала обо всём, что произошло сегодня."
51100-14 = "..."
51100-15 = "...Даже в Хяккарёран Рэнгэ всегда отличалась образцовым чувством долга."
51100-16 = "Поэтому, когда Рэнгэ сказала, что Хяккарёран больше нет и он никогда не вернётся..."
51100-17 = "Ну... я немного растерялась."
51100-18 = ""
51100-20 = ""
51100-21 = "...Хия!"
51100-22 = ""
51100-26 = "[ns] «П-Постой, Юкари, не бей себя по щекам!»"
51100-28 = ""
51100-29 = "Хватит этих пораженческих мыслей!"
51100-30 = "Я, Юкари, элита Хяккарёран! Я не поддамся отчаянию!"
51100-31 = "Кхм! Уверена, Рэнгэ просто выплеснула свой гнев, потому что всё ещё потрясена закрытием клуба..."
51100-32 = "Но как представительница элиты я должна готовиться к тому, что впереди, а не зацикливаться на прошлом!"
51100-33 = "Да, мой план заручиться помощью Рэнгэ мог провалиться..."
51100-34 = "Но в Хяккарёран есть и другие офицеры, которых мы можем привлечь!"
51100-35 = "[s] «Кикё... Она ведь была офицером по операциям Хяккарёран, да?»"
51100-36 = "Да! Кикё мыслит ясно... Когда она услышит мои причины провести Поединок за преемство, то с радостью поможет!"
51100-37 = "И... Кикё с Рэнгэ дружат с детства."
51100-38 = "Она точно поможет нам убедить Рэнгэ!"
51100-39 = "М-м! Да! Немного невежливо хвастаться, но... это действительно идеальный план!"
51100-40 = "Итак, Сенсей [USERNAME]! Я могу рассчитывать на вашу дальнейшую помощь?"
51100-41 = "[s] «Ага. Я ведь обещал.»"
51100-42 = "...!"
51100-43 = "Хе-хе-хе! Да!"
51100-44 = ""
51100-46 = ""
51100-47 = "Тогда, не откладывая—!"
51100-48 = ""
51100-51 = ""
51100-54 = "Госпожа. Я пришёл сопроводить вас домой."
51100-55 = ""
51100-57 = ""
51100-59 = ""
51100-60 = "Ах..."
51100-61 = "Похоже, весь день вы были заняты делами, поэтому я дождался этого момента, чтобы предстать перед вами..."
51100-62 = "Уже поздно. Вам пора возвращаться."
51100-63 = "Но мне всё ещё нужно кое-что сделать..."
51100-64 = "В столь поздний час?"
51100-65 = "Это... связано с человеком, стоящим рядом с вами?"
51100-66 = "Кто вы? Вы сопровождали юную госпожу с самого утра."
51100-67 = "Если вы приблизились к ней со злыми намерениями, то как её верный слуга я не останусь в стороне!"
51100-68 = "[s] «А, я Сенсей из Шале.»"
51100-69 = "Тот самый печально известный Сенсей из Шале? ...Правда?"
51100-70 = "Да! Всё верно! Поэтому, пожалуйста, не поймите неправильно!"
51100-71 = "Сенсей просто пытался помочь мне с моими неразумными требованиями... по моей просьбе!"
51100-72 = ""
51100-74 = ""
51100-75 = "...Раз вы так говорите, госпожа. Я понял."
51100-76 = "Прошу прощения, если чем-то вас оскорбил."
51100-77 = ""
51100-79 = ""
51100-80 = "Теперь, что важнее, госпожа... Солнце уже село."
51100-81 = "Но у меня всё ещё есть дело..."
51100-82 = "Госпожа. Пожалуйста, не упрямьтесь."
51100-83 = "..."
51100-84 = "[s1] «Уже поздно. Может, на сегодня вернёмся?»\n[s2] «Я могу встретиться с тобой завтра. Честное слово.»"
51100-85 = ""
51100-86 = ""
51100-88 = ""
51100-89 = "Госпожа, неужели вы всё ещё..."
51100-90 = "Понятно! Это не прощание... Это обещание продолжить борьбу в другой день!"
51100-91 = "Да, я поняла!"
51100-92 = "Тогда до завтра!"
51100-93 = "...Хорошо. Тогда..."
51100-94 = ""
51100-96 = ""
51100-97 = ""
51100-101 = "[ns] «(Сегодня утром мне позвонила Ния, и я встретил Юкари...)»"
51100-103 = "«(С тех пор произошло столько всего, что это кажется далёким воспоминанием.)»"
51100-104 = ""
51100-106 = ""
51100-108 = ""
51100-112 = "Кому какое дело?! Это не помешало ей бросить нас!"
51100-114 = "«(Слова Рэнгэ глубоко ранили Юкари...)»"
51100-116 = ""
51100-117 = "Прежде чем мы уйдём, скажу лишь одно."
51100-118 = "Моя госпожа весьма занята семейными обязанностями."
51100-119 = "Буду признателен, если завтра вы поможете ей вернуться домой пораньше. А теперь мы откланяемся."
51100-120 = ""
51100-122 = ""
51100-124 = "Я брёл по академии, погружённый в мысли о запутанной паутине обстоятельств, в которой оказался..."
51100-125 = ""
51100-128 = "[log=???]<────Сюда!>[/log]"
51100-130 = ""
51100-133 = "[ns] «...?»"
51100-138 = "Что за шум? Фестиваль уже скоро начнётся, нельзя постоянно всё откладывать!"
51100-139 = ""
51100-141 = ""
51100-142 = "Проклятые Моурё затеяли драку с кем-то в западном районе."
51100-144 = "Опять?"
51100-145 = "Тц! Почему они так упорно хотят испортить всем фестиваль? С кем они теперь дерутся?"
51100-146 = "Кажется, со студентом Хяккарёран... Я слышала, что она была в хаори!"
51100-147 = ""
51100-149 = ""
51100-150 = "[ns] «...А?»"
51100-153 = ""
51100-154 = "Ну наконец-то! Мы весь день тебя ищем!"
51100-156 = "Думали, нашли тебя раньше, но в этот раз ни за что не дадим сбежать!"
51100-157 = ""
51100-159 = ""
51100-160 = ""
51100-161 = "[ns] «Это...!»"
51100-164 = "Следующий эпизод;Член Хяккарёран"
