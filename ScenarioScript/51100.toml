[translation]
51100-1 = "Episódio 10;Bochechas Ruborizadas"
51100-6 = "[ns] \"Yukari, que tal descansar um pouco?\""
51100-10 = "Ah..."
51100-11 = "...Eu pareço cansada...?#nEntendo..."
51100-12 = "Não, é que..."
51100-13 = "...Não consigo parar de pensar na Renge-senpai..."
51100-14 = "..."
51100-15 = "...A Renge-senpai sempre foi uma pessoa com um senso de responsabilidade mais forte do que qualquer outra."
51100-16 = "Ouvir justamente da Renge-senpai... que o Hyakkaryouran acabou..."
51100-17 = "O que eu... devo fazer daqui em diante...?"
51100-21 = "...Iá!!"
51100-26 = "[ns] \"Y-Yukari?! Você está bem?!\""
51100-29 = "Chega de ficar me lamentando!"
51100-30 = "Sim! Afinal, eu sou da elite do Hyakkaryouran! Não posso me deixar abater por tão pouco!"
51100-31 = "A Renge-senpai com certeza só está um pouco confusa ainda."
51100-32 = "Não se prender ao passado e seguir olhando para frente — é isso que define uma verdadeira elite!"
51100-33 = "Não conseguimos contar com a ajuda da Renge-senpai, mas..."
51100-34 = "Ainda há outras veteranas com quem podemos contar!"
51100-35 = "[s] \"...Agora vamos falar com a Estrategista?\""
51100-36 = "Sim! A Kikyou-senpai com certeza vai compreender a importância do \"Torneio de Sucessão\"!"
51100-37 = "Além disso... a Kikyou-senpai e a Renge-senpai são amigas de infância."
51100-38 = "Ela com certeza também vai nos ajudar a convencer a Renge-senpai!"
51100-39 = "Hum~! Mas que plano mais perfeito! Com toda certeza!"
51100-40 = "Portanto... Sensei [USERNAME].#nPoderia continuar me acompanhando por mais um pouco?"
51100-41 = "[s] \"Claro, essa sempre foi a minha intenção.\""
51100-42 = "...!"
51100-43 = "Sim! Hihi."
51100-47 = "Então, sem mais delongas...!"
51100-54 = "— Senhorita, vim buscá-la."
51100-60 = "Ah..."
51100-61 = "Estava aguardando que a senhorita concluísse seus afazeres, mas..."
51100-62 = "Já está ficando tarde. Está na hora de voltarmos."
51100-63 = "Mas eu ainda tenho coisas que preciso fazer..."
51100-64 = "A uma hora dessas?"
51100-65 = "Por acaso... essa pessoa ao seu lado tem algo a ver com isso?"
51100-66 = "Quem seria o senhor?#nParece estar acompanhando a senhorita desde esta manhã."
51100-67 = "Como serviçal da família Kadenokouji, não posso fazer vista grossa caso algo aconteça à senhorita."
51100-68 = "[s] \"Meu nome é [USERNAME], sou o Sensei da Schale.\""
51100-69 = "O Sensei da Schale... aquele tão famoso...?"
51100-70 = "Sim, exatamente! Portanto, não tenha nenhum mal-entendido!"
51100-71 = "O Sensei está apenas tendo a gentileza de atender a um capricho meu!"
51100-75 = "Se é a senhorita quem diz... compreendo."
51100-76 = "Peço perdão pela minha intromissão."
51100-80 = "Pois bem, vamos voltar agora, senhorita."
51100-81 = "Mas eu ainda tenho...!"
51100-82 = "— Senhorita."
51100-83 = "..."
51100-84 = "[s1] \"Já está tarde hoje, melhor voltar para casa.\"\n[s2] \"Amanhã continuamos. É uma promessa.\""
51100-89 = "Senhorita... por acaso ainda pretende—"
51100-90 = "É verdade. Não é como se fosse uma despedida definitiva.#nAfinal, ainda temos tempo...!"
51100-91 = "Está bem!"
51100-92 = "Então, nos veremos novamente amanhã!"
51100-93 = "...Agradeço por ter cuidado da senhorita. Com licença."
51100-101 = "[ns] \"Hoje fui chamado pela Niya, conheci a Yukari...\""
51100-103 = "(...Realmente aconteceram muitas coisas.)"
51100-112 = "E eu lá vou saber?! No fim das contas, a gente foi abandonada!"
51100-114 = "(Aquelas palavras da Renge...)"
51100-117 = "...Antes disso, apenas uma coisa."
51100-118 = "A senhorita tem uma agenda ocupada com seus deveres na família Kadenokouji."
51100-119 = "Peço encarecidamente sua colaboração para que amanhã não fique tão tarde.#n...Com licença."
51100-124 = "(Enquanto eu refletia sobre todas aquelas palavras...)"
51100-128 = "[log=???]<— É por aqui>[/log]"
51100-133 = "[ns] \"...?\""
51100-138 = "Hã? O que está acontecendo, logo numa época tão corrida?"
51100-142 = "Estão dizendo que alguém está brigando com a Trupe Chimi no Distrito Oeste!"
51100-144 = "De novo?"
51100-145 = "Sempre, sempre durante um festival importante...!#nCom quem é dessa vez?"
51100-146 = "Pois é... parece que é uma aluna do Hyakkaryouran!"
51100-150 = "[ns] \"...Hã?\""
51100-154 = "A gente passou o dia inteiro procurando por você!"
51100-156 = "De dia pegamos a pessoa errada... mas dessa vez você não escapa!"
51100-161 = "[ns] \"Aquela é...?\""
51100-164 = "Próximo;Apenas uma Aluna"
