[translation]
2600002-1 = "Что нужно сделать"
2600002-2 = "*вздыхает*"
2600002-3 = "Это когда-нибудь закончится? Столько работы навалилось, а остальные даже не пытаются помочь."
2600002-4 = ""
2600002-5 = "(натужно) И всё такое тяжёлое. Хотя к этому моменту меня уже не должно удивлять."
2600002-6 = "А?"
2600002-7 = "[s1] «Помочь?»\n[s2] «Выглядит тяжёлым.»"
2600002-8 = "...?!"
2600002-9 = "...?!"
2600002-10 = "С-Сенсей?! Что вы здесь делаете?"
2600002-11 = "Вы пришли из-за моего последнего сообщения?"
2600002-12 = "Н-ну да, н-но я не ожидала, что вы бросите все дела и сразу прибежите сюда."
2600002-13 = "И-и нет! Я прекрасно справлюсь с этими документами сама."
2600002-14 = "Простите? Нет, я сказала, что всё нормально."
2600002-15 = "Вы... правда хотите взять половину?"
2600002-16 = "Мне не следовало просить учителя делать это вместо меня..."
2600002-17 = "..."
2600002-18 = "Ладно. Раз уж вы сами предлагаете, отказываться было бы невежливо."
2600002-19 = "Тогда, пожалуйста... и спасибо."
2600002-20 = "Вот."
2600002-21 = ""
2600002-22 = ""
2600002-23 = "[s] (Я взял половину документов, которые несла Чинацу.)"
2600002-24 = "Хм?"
2600002-25 = "Тяжелее, чем вы ожидали? Бумага обманчиво тяжёлая, когда её столько складываешь."
2600002-26 = "Вы очень облегчили мне жизнь. Ещё раз спасибо."
2600002-27 = "Хотите знать, куда мы идём? Просто следуйте за мной. Сейчас спустимся прямо по этой лестнице..."
2600002-28 = "Обещаю, недалеко. Буду благодарна, если пройдёте со мной."
2600002-29 = "Не верится, что я собиралась спускаться по лестнице со всеми этими папками?"
2600002-30 = "Не думаю, что это было бы так уж опасно. Ну, может, немного..."
2600002-31 = "Хи-хи..."
2600002-32 = "Если подумать, вы первый человек, который сказал мне что-то подобное. Спасибо."
2600002-33 = "Я бы справилась. Я привыкла к таким вещам."
2600002-34 = "Как вы наверняка заметили, студенты Геенны обладают, мягко говоря, своеобразными характерами..."
2600002-35 = "Многие из них даже не станут связываться с такой рутинной работой. Всегда пытаются её избежать."
2600002-36 = "Поэтому в итоге часто всё приходится делать мне."
2600002-37 = "Так что опыта в подобных делах у меня хватает. Вот и всё."
2600002-38 = "Хм? А что насчёт меня?"
2600002-39 = "Я отвечаю за бумажную работу? Нет, я глава Медицинского комитета."
2600002-40 = "*вздох* Я тоже не понимаю, почему медработнику приходится этим заниматься."
2600002-41 = "Хотелось бы, чтобы у нас было больше людей для такой работы."
2600002-42 = "Не то чтобы мне особенно нравилось этим заниматься. Но, как я уже говорила..."
2600002-43 = "...если никто не будет это делать, работа просто продолжит копиться. Кто-то обязан."
2600002-44 = "..."
2600002-45 = "Хотя такая работа, наверное, подходит скучному человеку вроде меня. Ха-ха..."
2600002-46 = "[s3] «Я бы не назвал тебя скучной. Ты очень добрая.»\n[s4] «Кто назовёт скучной такую красивую девушку в очках?!'»"
2600002-47 = "..."
2600002-48 = "..."
2600002-49 = "...Простите?"
2600002-50 = "Наверное, я на секунду отключилась, потому что вы точно не могли говорить обо мне."
2600002-51 = "Г-гораздо важнее...! Я должна извиниться, что отнимаю у вас столько времени. Вы пришли сюда, а я..."
2600002-52 = "Н-нам стоит поторопиться."
2600002-53 = ""
2600002-54 = "(Чинацу быстрым шагом поспешила вниз по лестнице.)"
2600002-55 = "[s] (Я последовал за ней.)"
2600002-58 = "Вот мы и пришли, Сенсей."
2600002-59 = "Спасибо за помощь. Можете оставить свою стопку здесь. Дальше я сама."
2600002-60 = "Что? Вы хотите помочь до самого конца?"
2600002-61 = "Но... почему?"
2600002-62 = "Не стоит..."
2600002-63 = "Даже не знаю, что сказать. Мне ещё никто такого не предлагал."
2600002-64 = "Хм?"
2600002-65 = "Просто плыть по течению? Сделать вид, будто мы с самого начала работали вместе?"
2600002-66 = "Вы будете помогать, пока всё не закончим?"
2600002-67 = "..."
2600002-68 = "Хи-хи..."
2600002-69 = "Очень мило с вашей стороны, но я не могу согласиться. Меньше всего мне хочется доставлять вам неудобства."
2600002-70 = "...Но кое-что я всё же признаю."
2600002-71 = "Сегодня работа была куда менее утомительной, потому что вы были рядом, Сенсей."
2600002-72 = "Я не стану просить вас помогать каждый день, но если вы будете не против..."
2600002-73 = "...возможно, я обращусь к вам, когда вы не слишком заняты."
2600002-74 = "Так у нас появится возможность... немного пообщаться."
2600002-75 = "..."
2600002-76 = ""
2600002-77 = "Я-я буду ждать этого."
2600002-79 = "(С застенчивой улыбкой Чинацу принялась сортировать оставшиеся документы.)"
2600002-80 = "(Закончив работу на сегодня, мы с Чинацу вместе вышли из аудитории.)"
