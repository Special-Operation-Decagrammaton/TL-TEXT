[translation]
2600506-1 = "Ты — моё солнышко"
2600506-2 = "(Я купил новый десерт, о котором говорила Ёшими, и отправился на первый этаж Тринити, где находился её класс.)"
2600506-3 = "(Урок ещё идёт, значит, её шкафчик для обуви должен быть без присмотра.)"
2600506-4 = "[s] Положить десерт в обувной шкафчик Ёшими."
2600506-6 = "Стоять, извращенец!"
2600506-8 = ""
2600506-9 = "Что вы там делаете? Не знаю, кто вы такой, но просто так отсюда не уйдёте!"
2600506-10 = "Я вас задержу и передам Комитету правосудия, а потом..."
2600506-11 = "...?"
2600506-12 = "Сенсей? Что вы здесь делаете?"
2600506-13 = "Что вы делаете у моего шкафчика для обуви?"
2600506-14 = "[s1] «У меня были дела.»\n[s2] «По-твоему — вынюхивать, как извращенец.»"
2600506-15 = "Я бы даже не удивилась."
2600506-16 = "Хотя не представляю, какие у вас могут быть дела возле обувного шкафчика девушки..."
2600506-17 = "Аргх! Замолчите!"
2600506-18 = "Вы сами на себя это навлекаете, знаете?!"
2600506-19 = "Вы вообще никогда не слушаете, что я говорю!"
2600506-20 = "Стоп. Вы что-то туда положили. Что это?"
2600506-21 = ""
2600506-22 = ""
2600506-23 = "Это же...?!"
2600506-24 = "Новинка Cafe Mille-Feuille: мусс «Sunshine»!"
2600506-25 = "К-как вы его достали? И что ещё важнее..."
2600506-26 = "...вы проделали весь этот путь, чтобы отдать его мне?"
2600506-27 = "Сенсей..."
2600506-28 = "А? Почему я здесь, если урок ещё не закончился?"
2600506-29 = "Я не прогуливала! Урок просто закончился раньше, вот я и пришла к шкафчику!"
2600506-30 = "У робота-преподавателя заболел живот, и ему пришлось идти в медпункт..."
2600506-31 = "...Что?"
2600506-32 = "Думаете, я прибежала сюда, потому что разгадала ваш план и хотела вас увидеть?"
2600506-33 = "Откуда мне было знать?! Если бы знала, я бы не устроила такую сцену! Хватит нести чушь!"
2600506-34 = "Что значит «хотела вас увидеть»? Ну у вас и наглость!"
2600506-35 = "..."
2600506-36 = "..."
2600506-37 = "...Хаха."
2600506-38 = "Ладно, неважно. Давайте уйдём отсюда."
2600506-39 = "А то сейчас придут мои одноклассницы и начнут над нами издеваться."
2600506-40 = "Вам это тоже ни к чему, верно? Вы же тут вроде как профессионал."
2600506-41 = "Я знаю одно место. Куплю вам напиток."
2600506-42 = "[s] Выйти наружу вместе с Ёшими."
2600506-43 = ""
2600506-45 = ""
2600506-49 = "― Ого.[wa:1340]"
2600506-51 = "― Вы никогда не перестаёте меня удивлять.[wa:1100]"
2600506-54 = "― Вы такой непредсказуемый.[wa:700]"
2600506-57 = "― Что это за взгляд?[wa:1480]"
2600506-59 = "― Я знаю, вы опять что-то задумали![wa:1340]"
2600506-62 = "― Не издевайтесь надо мной, Сенсей![wa:1140]"
2600506-64 = "― Лучше прекратите, иначе я правда разозлюсь.[wa:10]"
2600506-67 = "― Ну... Не то чтобы я совсем ненавидела, когда вы меня дразните... Наверное...[wa:2380]"
2600506-69 = "― Хи-хи."
2600506-72 = "― (Может быть, однажды...)[wa:900]"
2600506-74 = "― (...Однажды мы снова сможем идти рядом.)[wa:3340]"
2600506-77 = "Хи-хи."
2600506-78 = "Если подумать, мне впервые кто-то принёс что-то просто так, без просьбы."
2600506-79 = "Будет жалко просто взять и съесть его."
2600506-80 = "Может, оставлю его в вечном холодильнике для десертов."
2600506-81 = "...Хм?"
2600506-82 = "Вы правда хотели узнать, какой на вкус мусс «Sunshine»?"
2600506-83 = "Серьёзно?! Вы себе не купили? Я думала, вы возьмёте один и для себя..."
2600506-84 = "Хм..."
2600506-85 = "Хотя вообще-то так даже лучше."
2600506-86 = "В кафе, куда мы идём, продают только напитки, никаких десертов."
2600506-87 = "Но если закажешь напиток, можно принести с собой любую еду."
2600506-88 = "...Не поняли?"
2600506-89 = "Мы можем взять мусс «Sunshine» с собой и съесть его вместе!"
2600506-90 = "...Ну как?"
2600506-91 = "Что?"
2600506-92 = "Не жалко ли мне съесть мой единственный мусс «Sunshine»?"
2600506-93 = "Ну... если бы не вы, у меня бы его вообще не было."
2600506-94 = "И вдобавок..."
2600506-95 = "С вами я, наверное, не против поделиться, Сенсей."
2600506-96 = "..."
2600506-97 = ""
2600506-98 = "Ч-что это за взгляд? ...Х-хватит смеяться! Угх, какой же вы раздражающий!"
2600506-99 = "Аргх! Хватит, хватит!"
2600506-100 = "Я сказала — хватит!"
2600506-102 = "Всю дорогу до кафе Ёшими колотила меня и кричала."
2600506-103 = "Мы допили напитки, съели мусс «Sunshine», а потом я благополучно проводил Ёшими домой."
