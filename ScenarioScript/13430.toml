[translation]
13430-1 = "Episódio 43;Epílogo (2)"
13430-3 = "Muito obrigada, volte sempre!"
13430-9 = "...Ah, bem-vindos!"
13430-10 = "Mesa para dois, certo? Por favor, anotem o nome aqui e aguardem um instante!"
13430-11 = "Serika-chan, pode cuidar disso aqui também?"
13430-12 = "Sim, já estou indo!"
13430-17 = "[ns] \"Parece bem ocupada, Serika.\""
13430-18 = "Parece que o movimento aumentou ultimamente."
13430-19 = "E novas lojas também têm aberto por aqui."
13430-20 = "Sim, sim!#nAcho que isso é uma coisa maravilhosa!"
13430-25 = "Mas, em compensação, os problemas também aumentam, né.#nUaaah... Por causa disso, estou morrendo de sono."
13430-26 = "Bom, por enquanto nem está tão ruim assim."
13430-27 = "Ladrão!"
13430-32 = "Ei, sai da frente!"
13430-36 = "A-Alguém pega ele, por favor!"
13430-38 = "Vou lá!"
13430-43 = "Ah, volta antes que o lámen amoleça, viu?!"
13430-44 = "Shiroko-chan...!"
13430-45 = "Tranquilo, tranquilo.#nUltimamente, a Shiroko-chan ficou ainda mais forte."
13430-49 = "[ns] \"...\""
13430-50 = "Sensei, aconteceu alguma coisa...?"
13430-51 = "[s] \"Eu também vou lá.\""
13430-52 = "Ah, sim."
13430-54 = "Hihi, já que cheguei até aqui..."
13430-61 = "..."
13430-68 = "[ns] \"Shiroko!\""
13430-69 = "Sensei...?"
13430-70 = "...Fui descoberta."
13430-72 = "..."
13430-75 = "...Nn, vou devolver isso para o dono."
13430-76 = "Tudo bem, eu não vou fugir."
13430-77 = "Pelo visto, você consegue prever todos os meus movimentos."
13430-78 = "Sensei..."
13430-79 = "[s] \"Pode ir. Eu quero conversar um pouco com essa Shiroko aqui.\""
13430-85 = "(...)"
13430-90 = "...Faz tempo... bom, nem tanto assim, né?"
13430-91 = "[s] \"Você esteve no Distrito Autônomo de Abydos esse tempo todo?\""
13430-92 = "Sim... Este é praticamente o único lugar que eu conheço."
13430-93 = "Fiquei passando de uma casa abandonada para outra."
13430-94 = "Até que há vários lugares onde a água e a luz ainda funcionam."
13430-95 = "[s] \"Você não está passando dificuldade para comer?\""
13430-96 = "Eu recolho sucata e troco por dinheiro, então está tudo bem.#nE também tenho feito esse trabalho de vigilante por aí..."
13430-97 = "...Já estou acostumada a ficar sozinha."
13430-109 = "[ns1] \"Se quiser, que tal comer um lámen com a gente?\"\n[ns2] \"Todo mundo também está preocupado com você.\""
13430-115 = "...Não, está tudo bem."
13430-116 = "Eu não tenho coragem de encarar todo mundo..."
13430-117 = "[s] \"Entendo. Então podemos deixar para a próxima, sem problema.\""
13430-118 = "..."
13430-119 = "Não vai perguntar?"
13430-120 = "[s] \"...Sobre o quê?\""
13430-121 = "Sobre o que aconteceu comigo."
13430-122 = "Você deve ter um monte de perguntas."
13430-123 = "[s] \"Eu já sei boa parte.\""
13430-124 = "...Nn."
13430-125 = "[s] \"Além disso, fiquei com medo de acabar te fazendo sofrer de novo.\""
13430-129 = "...Obrigada."
13430-130 = "Mas eu já estou bem."
13430-131 = "...Por que será que a Hoshino-senpai conseguiu voltar do estado de inversão?"
13430-132 = "[s] \"...\""
13430-133 = "Acho que provavelmente foi porque o estado dela ainda estava incompleto."
13430-134 = "Além disso, a senpai abriu mão de uma parte da própria essência..."
13430-135 = "...Por isso, acho que ela conseguiu seguir em frente."
13430-138 = "Não existe meio algum de fazer voltar ao normal alguém que foi invertido pela \"Chroma\"."
13430-139 = "Isso é... tal como o fato de os mortos não voltarem à vida.#nÉ uma regra absoluta deste mundo."
13430-140 = "Ainda assim... se dizes que há alguém a quem desejas salvar... venha visitar-me."
13430-143 = "[ns] \"Quem se foi não volta à vida.\""
13430-149 = "[ns3] (Vou desistir de ir atrás da Kuzunoha...)\n[ns4] \"...Por isso, eu quero te ajudar, Shiroko.\""
13430-153 = "Mas, se eu ficar aqui, isso vai causar uma grande distorção.#nSó pode existir uma \"Shiroko\" em um mesmo mundo..."
13430-154 = "[s] \"Eu dou um jeito nisso.\""
13430-158 = "...Fufu."
13430-159 = "[s] \"Shiroko...?\""
13430-160 = "É que eu já ouvi isso antes."
13430-161 = "Sim. Porque aqui... é um lugar protegido pelo Sensei."
13430-165 = "No fim das contas, o Sensei é mesmo o Sensei..."
13430-166 = "...Faz sentido, assim como eu também sou aquela garota."
13430-167 = "[s] \"Assim como eu sou eu.\""
13430-168 = "Nn... O Sensei sempre nos salvou.#nEm situações parecidas, fazendo as mesmas escolhas..."
13430-172 = "[ns] \"...Vou deixar isso com você.\""
13430-179 = "Um smartphone...?"
13430-180 = "...Que nostalgia."
13430-181 = "[s] \"Entre em contato de novo, quando quiser. Onde eu possa te alcançar.\""
13430-185 = "...Nn."
13430-186 = "Já está na hora de eu ir, Sensei."
13430-187 = "Eu entro em contato de novo."
13430-196 = "[ns] \"Shiroko!\""
13430-198 = "[ns] \"...Está tudo bem. Você mudou de verdade.\""
13430-199 = "...?"
13430-200 = "[s5] \"Porque todo mundo consegue mudar.\"\n[s6] \"Mesmo que cada passo seja pequeno.\""
13430-206 = "...Sim, eu sei."
13430-209 = "...Tanto esse sofrimento quanto essa felicidade são coisas preciosas para a minha vida."
13430-210 = "...Por isso..."
13430-213 = "...Com certeza vai ficar tudo bem."
13430-219 = "Chegamos a uma distância visual!"
13430-220 = "Eu sei!"
13430-227 = "Da última vez que lutamos contra ele, foi no meio do deserto, não foi?!"
13430-228 = "Mas naquela vez foi por causa da Chroma—"
13430-229 = "Resumindo, se a gente deixar ele solto, Abydos vai virar um caos, né?!"
13430-230 = "Nn, vamos neutralizá-lo."
13430-231 = "Vamos flanqueá-lo pelos lados.#nEu também vou dar cobertura, então preparem-se para atacar!"
13430-232 = "Entendido."
13430-233 = "Avançar~☆"
13430-234 = "Espera, cadê a Hoshino-senpai?!"
13430-235 = "...Hã?"
13430-236 = "Eu já cheguei faz tempo."
13430-237 = "Quê?! Desde quando?!"
13430-238 = "Andem logo, pessoal~.#nO velhote aqui já tem idade e não consegue esperar tanto, viu?"
13430-239 = "Nn, já estamos indo."
13430-242 = "Senpai, desculpa a demora!"
13430-243 = "Ah...?!"
13430-246 = "Vocês demoraram."
13430-248 = "...!"
13430-249 = "Você é..."
13430-250 = "A outra Shiroko-senpai!#n...Você veio ajudar a gente, não veio?"
13430-251 = "Nn, só desta vez."
13430-252 = "Por enquanto, vamos focar naquele ali na nossa frente, que tal?"
13430-253 = "Então, vamos com a Operação B."
13430-259 = "...Ei, o que é isso?"
13430-260 = "Sim, sim!#nSerika-chan, se prepare logo também~☆"
13430-261 = "Não é hora de brincar!#nParece que o Binah nos notou!"
13430-262 = "Você também está entrando na brincadeira, Ayane-chan..."
13430-266 = "H-Hmm..."
13430-267 = "Shiroko-senpai, o que foi?"
13430-271 = "Eu não vou dar esta máscara.#nPorque é algo importante para mim."
13430-276 = "Certo, então..."
13430-289 = "Hoshino"
13430-290 = "[7cd0ff]Comitê de Contramedidas[-]"
13430-291 = "[log=호시노]Abydos, vamos lá![/log]"
