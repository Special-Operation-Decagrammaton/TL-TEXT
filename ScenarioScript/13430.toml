13430-131 = "Я поняла, как Хошино смогла вернуться в нормальное состояние."
13430-132 = "[s] «...»"
13430-133 = "В отличие от меня, её состояние было неполным, и преобразила её не Хрома."
13430-134 = "И в конце ей пришлось отказаться от части самой себя, части своей природы..."
13430-135 = "Так она смогла двинуться вперёд."
13430-136 = ""
13430-138 = "Вернуть существование, преобразованное Хромой, в исходное состояние невозможно."
13430-139 = "Это естественный закон этого мира, как и невозможность вернуть мёртвых к жизни."
13430-140 = "Но... если вы всё равно хотите кого-то спасти... ...Приходите ко мне, Сенсей."
13430-141 = ""
13430-143 = "[ns] «Я не могу возвращать людей из мёртвых.»"
13430-145 = ""
13430-149 = "[ns3] «Поэтому я перестану гоняться за Кузунохой.»\n[ns4] «Вместо этого помогу студенту, который прямо передо мной.»"
13430-152 = ""
13430-153 = "Само моё существование здесь нарушает порядок, Сенсей. В этом мире может быть только одна Широко."
