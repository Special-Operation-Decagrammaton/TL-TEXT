[translation]
10045010-1 = "Эпизод 1;Водный фестиваль Хяккияко начинается!"
10045010-3 = "Всем привет! Вы этого ждали!"
10045010-4 = "Величайшее летнее событие от Отдела проведения фестивалей Хяккияко..."
10045010-5 = "...открытие единственного и неповторимого Водного фестиваля Хяккияко!"
10045010-6 = ""
10045010-8 = ""
10045010-9 = "Ого! Спасибо всем за такой тёплый приём, ня!"
10045010-10 = "Водный фестиваль Хяккияко — суровое приключение, где 100 игроков будут соревноваться в разных заданиях. И победителем выйдет лишь один выживший!"
10045010-11 = "Победитель уйдёт с аппетитным денежным призом и ваучером «Момоёдо» на наше эксклюзивное меню!"
10045010-12 = "Ого, с такими бонусами мы вообще сможем получить прибыль? Для «Момоёдо» это точно нормально?"
10045010-13 = "Конечно, ведь нас поддерживает каждый наш замечательный покупатель!"
10045010-14 = ""
10045010-18 = "А теперь... позвольте представить одного особенного гостя, который поможет нам отметить этот знаменательный день!"
10045010-19 = "Они известны неустанной поддержкой учеников по всему Кивотос, сияющей надеждой, появляющейся в самые тёмные времена!"
10045010-20 = "Иногда строгие, иногда мягкие... Их имя звучит по всему городу! Трудно найти кого-то в Кивотос, кто бы их НЕ знал..."
10045010-21 = "Верно, это Сенсей из Шале! Поприветствуйте их громкими аплодисментами!"
10045010-22 = ""
10045010-26 = "[ns] «Эм... Всем привет. Я [USERNAME].»"
10045010-27 = "Ой, Сенсей! Вы забыли сказать в конце «ня»!"
10045010-28 = "[ns1] «Я Сенсей, гав!»\n[ns2] «Я Сенсей, тяв!»"
10045010-31 = "Ч-Что стало с «ня»?!"
10045010-32 = "Итак, как думаете, кто сегодня уйдёт домой с трофеем, Сенсей?"
10045010-33 = "[s] «Здесь столько сильных претендентов, что я не могу выбрать одного!»"
10045010-34 = "Именно! Каждый участник сегодня полон страсти и готов забрать победу. Наверное, поэтому они так долго готовятся, хи-хи!"
10045010-35 = "А теперь, прежде чем праздник начнётся, короткое слово от нашего спонсора!"
10045010-36 = "Оставайтесь с нами, ня!"
10045010-37 = "..."
10045010-38 = "...Фух, я вымоталась! Проводить фестиваль — тяжёлая работа!"
10045010-39 = "[s] «Шизуко! У тебя микрофон всё ещё включён...!»"
10045010-40 = "А-А! Хи-хи-хи!"
10045010-41 = "Какая же я неуклюжая, правда? Простите, все!"
10045010-42 = "Поддерживайте меня, чтобы я не падала духом до самого конца!"
10045010-43 = "А теперь уже правда пока! Ня!"
10045010-44 = ""
10045010-45 = "...Похоже, ведущая подготовилась чрезвычайно тщательно."
10045010-46 = "А? Но разве она только что не допустила огромную ошибку?"
10045010-47 = "Точно?"
10045010-48 = "Скорее это был намеренный ход, чтобы подчеркнуть её неуклюжий, но милый образ."
10045010-49 = "Она очаровала зрителей так, что они нескоро её забудут."
10045010-50 = "Превратить то, что выглядит ошибкой, в просчитанный чистый плюс."
10045010-51 = "Как и ожидалось от идола «Момоёдо»."
10045010-52 = "Ого... Я вообще ничего такого не заметила. Как всегда умница, Кикё."
10045010-53 = "Но я не собираюсь проигрывать!"
10045010-54 = "Пожалуйста, направь свой чрезмерный соревновательный дух на множество других высококлассных участников здесь."
10045010-55 = ""
10045010-56 = ""
10045010-57 = ""
10045010-58 = ""
10045010-59 = ""
10045010-60 = ""
10045010-61 = ""
10045010-62 = "Воистину! Свирепость соревнования разожгла пламя моей страсти!"
10045010-63 = "Да. Нам нельзя терять бдительность."
10045010-65 = "Кстати, ты знаешь, во что мы будем играть?"
10045010-66 = "Чтобы поощрить гибкость и импровизацию, каждую игру объявят прямо перед началом матча."
10045010-67 = "(...Хотя никакая импровизация не поможет, если игра будет связана с плаванием.)"
10045010-69 = "Спустя некоторое время..."
10045010-71 = "Наконец-то ожидание окончено!"
10045010-72 = "Какой же будет первая игра Водного фестиваля Хяккияко?"
10045010-73 = "Сенсей! Вам слово!"
10045010-74 = "[ns] «Первый матч Водного фестиваля Хяккияко — это...!»"
10045010-76 = "[log]Полоса препятствий с водяными пистолетами![/log]"
10045010-78 = ""
10045010-79 = "[ns3] «Правила просты! Промок — выбываешь!»\n[ns4] «Вышел за границы — ВЫЛЕТЕЛ!»"
10045010-82 = "Нас ждёт яростная пляжная битва, где бежать можно только друг на друга! Выживут лишь 30 участников!"
10045010-83 = "Кто останется последним?!"
10045010-84 = "[ns] «Участники, немедленно отправляйтесь на пляж, ня!»"
10045010-85 = ""
10045010-86 = "...Наставница прямо загорелась этим, да?"
10045010-87 = "Отправимся на пляж? Мне нужно оценить рельеф и возможные препятствия."
10045010-88 = "(...Какое облегчение. Обе ноги останутся на твёрдой земле.)"
10045010-90 = ""
10045010-91 = "Этот пляж... слишком открытый!"
10045010-92 = "Может, прижмёмся спинами друг к другу и будем стрелять по кругу, как в кино?!"
10045010-93 = "*вздох* Жизнь не кино, Юкари..."
10045010-94 = "Хахаха! А я едва сдерживаю восторг в ожидании выступления Нагусы на полную мощь!"
10045010-95 = ""
10045010-97 = ""
10045010-98 = "Моя правая рука ещё не полностью зажила..."
10045010-99 = "...но я постараюсь."
10045010-100 = "Ибо печать снята."
10045010-102 = "...У меня мурашки от неловкости. Пожалуйста, не повторяй это при других."
10045010-103 = ""
10045010-105 = ""
10045010-106 = "[ns] «О, вижу знакомые лица. Добро пожаловать!»"
10045010-107 = "О, о! Как приятно вас видеть, Сенсей!"
10045010-108 = "Вы будете судить этот матч?"
10045010-109 = "[s] «Да! С места в первом ряду веселее, правда?»"
10045010-111 = "...Место в первом ряду, чтобы смотреть, как ваши студенты бегают в купальниках?"
10045010-112 = "Как же..."
10045010-113 = "[s5] «Ты совершенно неверно истолковала мои намерения!»\n[s6] «Фуфу, думай что хочешь!»"
10045010-116 = "В любом случае, похоже, теперь все здесь."
10045010-117 = ""
10045010-118 = ""
10045010-119 = ""
10045010-120 = ""
10045010-121 = ""
10045010-122 = ""
10045010-124 = "Ну что, мы ГОТОВЫ?!"
10045010-125 = "Тогда пусть первый раунд Водного фестиваля Хяккияко — Полоса препятствий с водяными пистолетами..."
10045010-126 = "[ns] «...Начнётся!!»"
10045010-128 = ""
10045010-130 = "Водный фестиваль Хяккияко наконец стартовал! Кто переживёт первый раунд?!"
