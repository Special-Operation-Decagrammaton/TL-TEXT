[translation]
2004706-1 = "Хитрая тактика операционного офицера"
2004706-2 = "По просьбе Кикё я пришёл на пляж в условленное время."
2004706-6 = ""
2004706-7 = "Здравствуйте, Сенсей. Я вас ждала."
2004706-8 = "[s] «Всё получилось?»"
2004706-9 = "Да. Так что сегодня мы можем спокойно наслаждаться отдыхом, ни о чём не беспокоясь."
2004706-10 = "Хм? Что будем делать сегодня?"
2004706-11 = "Скоро узнаете."
2004706-12 = "Для начала... я собираюсь зайти в воду по грудь."
2004706-13 = "Мне нужна ваша помощь. Возражений нет, верно?"
2004706-14 = "[s1] «Тебе нужна шлейка?»\n[s2] «Как насчёт нитки для кошачьей колыбели?»"
2004706-17 = "Это не имеет значения."
2004706-18 = "[s] «Э-Это уже не важно?!»"
2004706-19 = "Теперь я прекрасно знакома с вашими шутками, Сенсей."
2004706-20 = "Больше я не собираюсь потакать каждой из них."
2004706-21 = "А теперь скорее."
2004706-22 = ""
2004706-24 = ""
2004706-25 = "Дайте мне руку."
2004706-29 = "*выдыхает*"
2004706-30 = "[s3] «Не волнуйся.»\n[s4] «Я ведь рядом с тобой.»"
2004706-33 = ""
2004706-35 = ""
2004706-36 = "...Да. Спасибо."
2004706-40 = "Мы с Кикё некоторое время играли в воде на новой для неё глубине."
2004706-42 = "Спасибо, Сенсей."
2004706-43 = "Вы во многом избавили меня от тревоги перед входом в море."
2004706-44 = "Во многом благодаря тому, что не отпускали мою руку."
2004706-45 = "[s] «Пустяки.»"
2004706-46 = "Вы не устали?"
2004706-47 = "[s] «Хм? Я в порядке.»"
2004706-48 = "Я вымоталась..."
2004706-49 = "...а вы всё ещё полны энергии?"
2004706-50 = "[s5] «А! Внезапно меня ужасно клонит в сон!»\n[s6] «Уф! Почему я та-а-ак устал?»"
2004706-53 = "...Устали, значит?"
2004706-54 = "Ничего не поделать. Позвольте отвести вас к месту отдыха, которое я заранее подготовила, предвидя вашу слабую выносливость."
2004706-55 = "[s] «О! Так вот о чём ты говорила раньше?»"
2004706-56 = "Фуфу. Придётся узнать самим."
2004706-57 = ""
2004706-59 = ""
2004706-60 = "Сюда. Следуйте за мной."
2004706-61 = ""
2004706-63 = ""
2004706-66 = "[ns] «А, разве это не...?»"
2004706-67 = "Да. Сможете им пользоваться? Пожалуйста, ложитесь вот так."
2004706-70 = "― [log=키쿄 수영복]Ну как? Довольно удобно, правда?[/log][wa:1090]"
2004706-72 = "― [log=키쿄 수영복]Я сделала его для вас.[/log]"
2004706-75 = "― [log=키쿄 수영복]Так что наслаждайтесь сколько душе угодно.[/log][wa:470]"
2004706-78 = "[ns7] «Это лучшее!»\n[ns8] «Мне очень-очень нравится!»"
2004706-81 = "― [log=키쿄 수영복]Если признаться... Для меня это впервые. [/log][wa:2750]"
2004706-84 = "― [log=키쿄 수영복]Создавать что-то, думая о ком-то.[/log][wa:2790]"
2004706-86 = "― [log=키쿄 수영복]И настолько полностью опускать защиту перед кем-то.[/log][wa:130]"
2004706-89 = "― [log=키쿄 수영복]Но я не стану... уточнять, перед кем именно.[/log][wa:1610]"
2004706-92 = "― [log=키쿄 수영복]...Пожалуйста, и дальше оставайтесь рядом со мной.[/log][wa:1320]"
2004706-94 = "― [log=키쿄 수영복]А я останусь рядом с вами.[/log][wa:1300]"
2004706-97 = "― [log=키쿄 수영복]...Этот союз вечен.[/log][wa:1940]"
2004706-100 = "После этого мы весело провели время в гамаке до поздней ночи."
