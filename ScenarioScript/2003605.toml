[translation]
2003605-1 = "Тысячи, миллионы, миллиарды воспоминаний"
2003605-2 = "Я отправился в Абидос, чтобы помочь Серике убрать клубную комнату."
2003605-3 = ""
2003605-7 = ""
2003605-9 = ""
2003605-10 = "Хм."
2003605-11 = "Вы всё-таки пришли. Я же СКАЗАЛА, что не обязательно..."
2003605-12 = "Серьёзно. Я и сама справлюсь."
2003605-13 = "Если хотите, можете просто посидеть и подождать. У меня тут есть перекус, если хотите..."
2003605-14 = "...Ты в порядке?"
2003605-15 = "Вы правда пришли только ради того, чтобы помочь мне с уборкой...?"
2003605-16 = "О, Сенсей..."
2003605-17 = "Так нельзя. Я же не отправляла вам сообщение в MomoTalk только ради того, чтобы заставить работать."
2003605-18 = "Правда, я вовсе этого не хотела."
2003605-19 = "Вы ведь не пытаетесь сделать из меня ТАКОГО студента, правда? Хотите, чтобы я каждый раз переживала, что после сообщения в MomoTalk вы снова придёте работать за меня?"
2003605-20 = "...А? Вы всё равно хотите помочь?"
2003605-21 = "Говорите, если меня это беспокоит, я потом могу что-нибудь сделать для вас?"
2003605-22 = "Например...?"
2003605-23 = ""
2003605-25 = ""
2003605-26 = "...Ладно, неважно. С вами трудно спорить, когда вы так упрямитесь."
2003605-27 = "Хорошо, раз вы постоянно угощаете меня, в этот раз рамэн за мой счёт."
2003605-28 = "Но раз сами захотели помочь, работайте как следует! Никакой халтуры!"
2003605-29 = "Итак..."
2003605-30 = "Пора начинать уборку!"
2003605-33 = "Мы с Серикой вместе принялись убирать клубную комнату."
2003605-34 = "В комнате и так был порядок, поэтому в основном мы протирали труднодоступные места."
2003605-36 = "Да, думаю, этого достаточно..."
2003605-37 = "Хм... Хорошо! Выглядит отлично! Хорошая работа, Сенсей!"
2003605-38 = "[s1] «Ты тоже хорошо потрудилась, Серика.»\n[s2] «После уборки как-то даже легче дышится, правда?»"
2003605-41 = "Ну, вдвоём мы справились в два раза быстрее."
2003605-42 = "Так что спасибо, Сенсей..."
2003605-43 = ""
2003605-46 = "...Хм?"
2003605-47 = "[s3] «Эта коробка...?»\n[s4] «Раньше я её здесь не видел.»"
2003605-50 = "О, это..."
2003605-51 = "Хм, стоит тут так, будто ей самое место. Надо бы её убрать."
2003605-52 = "Забавно, я так сосредоточилась на скрытых местах, что оставила прямо на виду такую очевидную вещь..."
2003605-53 = ""
2003605-55 = ""
2003605-56 = "...Погодите. Сенсей, откуда вы знали, что коробка новая?"
2003605-57 = "Вы что, запомнили все вещи в нашей клубной комнате...?"
2003605-58 = "[s5] «Здесь почти ничего не меняется.»\n[s6] «Если прийти несколько раз, само собой всё запомнится.»"
2003605-61 = "П-Простите! У нас клубная комната такая пустая!"
2003605-62 = "В любом случае, ничего особенного..."
2003605-63 = ""
2003605-65 = ""
2003605-66 = "[ns7] «Купальник...?»\n[ns8] «А, тот самый с курорта.»"
2003605-69 = "Мне просто некуда было его убрать."
2003605-70 = "Я поддалась настроению и купила симпатичный, но с тех пор так и не было случая его надеть..."
2003605-71 = "Вот он и лежит здесь всё это время."
2003605-72 = "А выбрасывать жалко..."
2003605-73 = ""
2003605-75 = ""
2003605-76 = "...А? Сенсей, что вы только что сказали?"
2003605-77 = "...Что?"
2003605-78 = "Думаете, мне стоит его надеть...? Сейчас?"
2003605-79 = "...Прямо сейчас?!"
2003605-80 = "[s9] «Если иногда его надевать, покупка не пропадёт зря.»\n[s10] «Нет же закона, что купальники можно носить только на пляже.»"
2003605-83 = "Что за ерунда? Купальник нужен для плавания! Это же здравый смысл!"
2003605-84 = "Серьёзно, Сенсей, иногда вы просто говорите первое, что приходит в голову."
2003605-85 = "*вздыхает*"
2003605-86 = "Не нужно так стараться, чтобы меня утешить. Я его не выброшу."
2003605-87 = "Просто..."
2003605-88 = "Это... память о том, как хорошо мы провели время вместе. Поэтому..."
2003605-89 = "Как вы всегда говорите..."
2003605-90 = ""
2003605-92 = ""
2003605-93 = "В-Воспоминания..."
2003605-94 = "Так что мне стоит его сохранить. Да..."
2003605-95 = "..."
2003605-96 = "..."
2003605-97 = "Ч-Что?"
2003605-98 = "Что это за выражение...?! Почему вы так странно мне улыбаетесь?!"
2003605-99 = "[s11] «*всхлип* *всхлип* Я так растроган, Серика...»\n[s12] «Ты совсем взрослая стала, Серика...»"
2003605-102 = "А-а-а!"
2003605-103 = "Хватит разговаривать как мой папа!"
2003605-104 = "Всё! Я больше не могу! Забудьте про рамэн! Даже капли бульона не получите!"
2003605-105 = "Х-Хватит смеяться...!"
2003605-107 = "Я серьёзно, перестаньте смеяться!"
