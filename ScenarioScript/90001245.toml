[translation]
90001245-3 = "[ns] «Электричество вернулось!»"
90001245-4 = "Ой, глаза!"
90001245-5 = "[ns] «Все в порядке?»"
90001245-6 = "Мы в порядке! А вы, Сенсей?"
90001245-7 = "...Какое облегчение."
90001245-10 = "Ах ты! Стоять!"
90001245-11 = "Уф, какие жуткие машины..."
90001245-13 = "Они принципиально отличаются от сил Декаграмматона, с которыми мы сталкивались до сих пор."
90001245-14 = "Если бы нам удалось захватить одну, анализ дал бы больше информации, но..."
90001245-15 = "Отрицательно. Все вражеские единицы отступили."
90001245-16 = "Странное ощущение. Будто мы победили, но не совсем."
90001245-18 = "Да... Как будто это обучающий этап игры, где враг намеренно проигрывает и отступает."
90001245-19 = "А. Поэтому нам не выпало никаких предметов. И в таких случаях опыта тоже дают совсем мало."
90001245-21 = "Ну, Арис... здесь всё было не совсем так..."
90001245-22 = ""
90001245-24 = "(Погодите, разве это не значит...?)"
90001245-25 = "(Может, это была какая-то разведка...?)"
90001245-27 = ""
90001245-28 = "..."
90001245-29 = "...!"
90001245-30 = "...!!"
90001245-31 = ""
90001245-33 = ""
90001245-34 = "Эйн, Соф и Ор. Что вас тревожит?"
90001245-35 = "Т-Т-Т-То, что только что произошло, неужели...?!"
90001245-36 = "Д-Да...! Я думала, мне просто показалось, но нет...!"
90001245-37 = ""
90001245-39 = ""
90001245-40 = ""
90001245-42 = "Что ЭТИ ДВОЕ здесь делают?!?!"
90001245-44 = "Следующий эпизод;Непредсказуемое"
