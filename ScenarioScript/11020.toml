[translation]
11020-2 = "Эпизод 2;Первый день в Абидосе"
11020-3 = "Жилой район Абидоса"
11020-4 = "*чирик* *чирик* *чирик*"
11020-5 = "А?"
11020-6 = "*визг тормозов*"
11020-7 = "..."
11020-8 = "Хм..."
11020-19 = "..."
11020-20 = "Вы в порядке?"
11020-21 = "[s1] Кивнуть.\n[s2] Попросить о помощи."
11020-22 = "О, вы живы. Когда я увидела вас лежащим прямо на дороге, подумала, что всё уже кончено."
11020-23 = "Что? Вы потеряли сознание от голода?"
11020-24 = "То есть вы бездомный?"
11020-25 = "Вас ведь не ограбили? Или вы попали в какую-то аварию?"
11020-26 = "Что? Вы потеряли сознание от голода?"
11020-27 = "Значит, вы не бездомный?"
11020-28 = "А..."
11020-30 = "Жилой район Абидоса"
11020-31 = "(осматривает)"
11020-32 = "Вы приехали сюда по делу, но потеряли сознание от голода и обезвоживания, потому что не смогли найти ни одного магазина?"
11020-33 = "Ну, ничего удивительного."
11020-34 = "Здесь такое постоянно случается. Уже давно в этом районе не осталось работающих заведений, где можно купить еду или напитки."
11020-35 = "Больше шансов найти что-нибудь ближе к окраине."
11020-36 = "Не знаете, как туда попасть? Значит, вы здесь впервые."
11020-37 = "Подождите."
11020-38 = ""
11020-39 = "(роется в вещах)"
11020-40 = ""
11020-41 = ""
11020-42 = "Вот. Выпейте моего энергетика."
11020-43 = "Он для велотренировок, но сейчас у меня больше ничего нет. Всё лучше, чем ничего."
11020-44 = ""
11020-45 = "Погодите. Сейчас попробую найти вам стаканчик..."
11020-46 = "[s] Выпить прямо из бутылки."
11020-47 = "*глоть* *глоть*"
11020-48 = "...!"
11020-49 = "Ой, это..."
11020-50 = "Неважно. Не обращайте внимания."
11020-51 = "[s] Поблагодарить её за спасение."
11020-52 = "Эм..."
11020-53 = "Вы похожи на взрослого из Генерального ученического совета. Вы здесь по какому-то делу, связанному с академией?"
11020-54 = "Наша тут единственная... Неужели вы..."
11020-55 = "Так вы приехали в старшую школу Абидос?"
11020-56 = "[s] Кивнуть."
11020-57 = "О. К нам уже очень давно никто не приезжал."
11020-58 = "Я покажу дорогу. Отсюда недалеко."
11020-59 = "Что? Вы слишком голодны, чтобы идти?"
11020-60 = "Это... проблема."
11020-61 = "[s] Попросить подвезти."
11020-62 = "Но у моего велосипеда только одно сиденье."
11020-63 = "[s] Тогда попросить понести на спине."
11020-64 = "..."
11020-65 = "Ладно. Так мне даже проще."
11020-66 = "Только сначала припаркую велосипед."
11020-67 = ""
11020-68 = "Залезайте."
11020-69 = ""
11020-70 = ""
11020-71 = "*шорох*"
11020-72 = "Подождите."
11020-73 = "..."
11020-74 = "Просто... я какое-то время ехала на велосипеде. Я не особо вспотела, но всё же..."
11020-75 = "Обычно после тренировки я принимаю душ в школе и держу там сменную одежду."
11020-76 = "А? Вам всё равно?"
11020-77 = "Вы даже думаете, что от меня приятно пахнет?"
11020-78 = "..."
11020-79 = "И что вообще на такое отвечать? Ладно. Если жаловаться не будете."
11020-80 = "Пойдёмте."
11020-81 = ""
11020-82 = "*шорох*"
11020-83 = "Держитесь крепче."
11020-85 = "Комитет по предотвращению закрытия Абидоса"
11020-87 = "Я вернулась."
11020-88 = "С возвращением, Шир... око?"
11020-89 = "Кто это у тебя на спине?!"
11020-90 = "Ого! Широко кого-то похитила!"
11020-91 = "Или это труп! Что ты натворила, Широко?!"
11020-92 = "Все, спокойно. Надо помочь ей спрятать тело!#nБегом за лопатой и киркой в кладовку!"
11020-93 = "..."
11020-94 = "(падает)"
11020-95 = "Успокойтесь — это просто взрослый. Похоже, посетитель школы."
11020-96 = "Что? Не труп?"
11020-97 = "Посетитель? Ты уверена, что не похитила его?"
11020-98 = "Эм..."
11020-99 = "[s] Улыбнуться и поздороваться."
11020-100 = "Я в шоке. У нас уже целую вечность не было посетителей."
11020-101 = "И правда... но мы разве кого-то ждали?"
11020-102 = ""
11020-103 = "[ns] «Я советник из Шале. Приятно познакомиться»."
11020-104 = ""
11020-105 = "Да ладно! Правда?!"
11020-106 = "Вы из Шале? Федерального следственного клуба?!"
11020-107 = "Ого! Значит, вы получили письмо Аяне! ☆"
11020-108 = "Отлично. Значит, мы наконец сможем пополнить боеприпасы и припасы."
11020-109 = "Надо рассказать Хошино. Погодите... А где она вообще?"
11020-110 = "Она спит в соседней комнате. Я пойду её разбужу."
11020-112 = "*пах* *пах* *пах* *тат*"
11020-113 = "Это стрельба?!"
11020-114 = "...!"
11020-116 = ""
11020-117 = "Ха-ха-ха!"
11020-118 = "У них закончились патроны! Добейте их, а потом захватим школу!"
11020-119 = ""
11020-120 = "*пах* *пах* *пах* *тат*"
11020-121 = ""
11020-123 = "К школе приближается вооружённая группа! Должно быть, это Банда шлемов Ката-Ката!"
11020-124 = "Вот же мерзавцы... И им ещё хватило наглости вернуться."
11020-126 = "Хошино со мной! Осталось только её разбудить!"
11020-127 = "*зевает* Ещё пять минуточек..."
11020-128 = "Хошино! Банда шлемов снова нападает! Кстати, это Сенсей из Шале."
11020-129 = "О-о-о. Вот беда... *зевает* Приятно познакомиться, Сенсей."
11020-130 = "Просыпайся и поднимай задницу, Хошино! В буквальном смысле! Нам школу защищать!"
11020-131 = "*зевает* Они что, не знают, как невежливо будить пожилых во время дневного сна?#nПридётся преподать этим соплякам из Банды шлемов урок."
11020-132 = ""
11020-134 = "Выдвигаемся. Сенсей принёс нам боеприпасы и припасы."
11020-135 = "Хорошо! Все, выдвигаемся! ☆"
11020-136 = ""
11020-138 = "Дальше я буду вести вас."
11020-139 = "Сенсей, оставайтесь в тылу и оказывайте поддержку!"
