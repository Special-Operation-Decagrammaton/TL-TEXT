[translation]
11020-2 = "Episódio 2;Primeiro Dia em Abydos"
11020-3 = "Abydos - Área Residencial"
11020-4 = "(Piu, piu, piu)"
11020-5 = "...Nn?"
11020-6 = "(Freada brusca!)"
11020-7 = "..."
11020-8 = "...Com licença..."
11020-19 = "..."
11020-20 = "...Você está bem?"
11020-21 = "[s1] Acenar com a cabeça.\n[s2] Pedir ajuda."
11020-22 = "Ah, está vivo. Como estava caído no meio da rua, achei que tivesse morrido."
11020-23 = "...Hã? Desmaiou de fome?"
11020-24 = "...É morador de rua?"
11020-25 = "Foi assaltado? Ou sofreu um acidente...?"
11020-26 = "...Hã? Desmaiou de fome?"
11020-27 = "Então não é morador de rua?"
11020-28 = "Hmm..."
11020-30 = "Abydos - Área Residencial"
11020-31 = "(Levanta-se)"
11020-32 = "Então você veio para esta cidade há alguns dias a trabalho, não encontrou nenhuma loja aberta e acabou desmaiando de fome e desidratação."
11020-33 = "Era só um viajante perdido, então."
11020-34 = "Ah. Este lugar já é assim mesmo. Lojas que vendem comida desapareceram daqui faz tempo."
11020-35 = "Se você for mais para os arredores, longe daqui, tem uma área comercial, mas..."
11020-36 = "Não conhece a região?#n...Entendi, é a sua primeira vez por aqui."
11020-37 = "...Espera um pouco."
11020-39 = "(Remexendo)"
11020-42 = "Aqui, pega. É um energético."
11020-43 = "É para quando eu pedalo... mas é tudo o que eu tenho agora. Ainda assim, acho que ajuda a enganar a fome."
11020-45 = "Hmm, um copo..."
11020-46 = "[s] Beber direto do bico."
11020-47 = "(Glub, glub)"
11020-48 = "...!"
11020-49 = "Ah... isso..."
11020-50 = "...Não, não é nada. ...Não liga."
11020-51 = "[s] Agradecer pela ajuda."
11020-52 = "Nn."
11020-53 = "Pela aparência, você parece ser um adulto vindo do Conselho Estudantil Geral... Bom trabalho.#nVeio resolver alguma coisa na escola?"
11020-54 = "Por aqui só existe a nossa escola... Por acaso..."
11020-55 = "Você está indo para \"Abydos\"?"
11020-56 = "[s] Acenar com a cabeça."
11020-57 = "...Entendi. Faz tempo que não recebemos uma visita."
11020-58 = "Então eu te levo até lá. É logo ali."
11020-59 = "Hã? Está com tanta fome que não consegue andar?"
11020-60 = "Hmm... o que eu faço?"
11020-61 = "[s] Pedir uma carona."
11020-62 = "Bem, essa bicicleta é só para uma pessoa..."
11020-63 = "[s] Então pedir para ir nas costas dela."
11020-64 = "..."
11020-65 = "Bom, acho que assim é melhor mesmo."
11020-66 = "Vou estacionar a bicicleta de estrada aqui..."
11020-68 = "Então..."
11020-71 = "(Agacha-se)"
11020-72 = "...Ah, espera."
11020-73 = "..."
11020-74 = "É que... eu estava pedalando até agora há pouco... Não estou tão suada assim, mas..."
11020-75 = "Normalmente eu uso o chuveiro da escola. Também deixo roupas reservas lá..."
11020-76 = "Hã? Não precisa me preocupar?"
11020-77 = "...Na verdade, você disse que o cheiro é bom?"
11020-78 = "..."
11020-79 = "...Hmm. N-Não entendi muito bem, mas...#nse você não se importa, tudo bem."
11020-80 = "Então..."
11020-82 = "(Agacha-se)"
11020-83 = "Segura firme."
11020-85 = "Comitê de Contramedidas - Sala de Aula"
11020-87 = "Cheguei."
11020-88 = "Bem-vinda de volta, Shiroko-senpa... i?"
11020-89 = "Uaaah?! O quê?! Quem é esse nas suas costas?!"
11020-90 = "Uau, a Shiroko-chan sequestrou um adulto!"
11020-91 = "Sequestro?! Por acaso é um cadáver?!#nA Shiroko-senpai finalmente entrou para a vida do crime...!!"
11020-92 = "Calma, pessoal! Vamos procurar um lugar para esconder o corpo rápido!#nTem uma pá e uma picareta no depósito de educação física, vamos pegar..."
11020-93 = "..."
11020-94 = "(Tump)"
11020-95 = "Não... é só um adulto vivo normal. Disse que tem assuntos a tratar na nossa escola."
11020-96 = "Hã? Então... não era um cadáver...?"
11020-97 = "Não foi sequestro, é uma visita?"
11020-98 = "Parece que sim..."
11020-99 = "[s] Cumprimentar com entusiasmo."
11020-100 = "Uau, que susto! Faz tanto tempo que não recebemos#numa visita por aqui."
11020-101 = "É-É verdade... Mas tínhamos alguma visita marcada...?"
11020-103 = "[ns] \"Sou o Sensei conselheiro da 'Schale', prazer em conhecê-las.\""
11020-105 = "...H-Hã?! Não pode ser?!"
11020-106 = "O Sensei do Clube de Investigação Federal \"Schale\"?!"
11020-107 = "Uau☆ O nosso pedido de apoio foi aceito! Que ótimo, Ayane-chan!"
11020-108 = "Sim! Com isso... vamos poder receber apoio de munição e suprimentos."
11020-109 = "Ah, precisamos avisar a Hoshino-senpai logo...#nUé? Cadê a Hoshino-senpai?"
11020-110 = "A presidente está dormindo na sala ao lado. Eu vou lá acordar ela."
11020-112 = "(Ratatatatatata!)"
11020-113 = "T-Tiros?!"
11020-114 = "!!"
11020-117 = "Hyaaaahahaha!"
11020-118 = "Ataquem, ataquem!! Elas já estão sem suprimento de munição! Invadam!! Vamos tomar a escola!!"
11020-120 = "(Ratatatatatatata!!)"
11020-123 = "U-Uau?! Um grupo armado está se aproximando da escola! Parece ser a Gangue dos Capacetes Kata-Kata!"
11020-124 = "Aquelas desgraçadas...!! Não aprendem nunca!"
11020-126 = "Trouxe a Hoshino-senpai! Senpai! Para de dormir e acorda!"
11020-127 = "Mnha... ainda não é hora de acordar..."
11020-128 = "Hoshino-senpai! A Gangue dos Capacetes está atacando de novo! E esta pessoa aqui é o Sensei da Schale."
11020-129 = "Ué~ que problemão, hein... Ah, Sensei? Prazer~, mnha."
11020-130 = "Senpai, se concentra! Vamos entrar em ação! Pega o seu equipamento! Precisamos proteger a escola!"
11020-131 = "Uaaah... mnha. Nem tirar uma soneca em paz a gente consegue, maldita Gangue dos Capacetes..."
11020-134 = "Vamos sair agora. Graças ao Sensei, temos munição e suprimentos de sobra."
11020-135 = "Siiim, vamos todas à luta☆"
11020-138 = "Eu vou ficar responsável pela operação."
11020-139 = "Sensei, por favor, nos dê suporte daqui!"
