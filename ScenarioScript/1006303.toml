[translation]
1006303-1 = "Ящик Пандоры 1"
1006303-2 = ""
1006303-6 = "Коюки пришла в Шале на работу."
1006303-7 = "Так это и есть Шале! О-о-о... Никогда раньше тут не была!"
1006303-8 = "Хм, но вообще-то это просто обычный офис...?"
1006303-9 = "[s1] «Потому что это и есть офис.»\n[s2] «А чего ты ожидала?»"
1006303-12 = "Ха-ха! Да я прикалываюсь. Конечно место, где вы работаете, будет таким, Сенсей."
1006303-13 = "Ну и что мне делать? Я слышала, что сегодня моя очередь по графику, вот и пришла, но..."
1006303-14 = "У меня нет каких-то странных вычислительных способностей, как у одной бессердечной бухгалтерши, чьё имя я называть не буду."
1006303-15 = "О, зато могу сбегать по поручениям! Раз это для вас, Сенсей, я буду о-о-очень стараться!"
1006303-16 = "[s3] «Ты мотивированнее, чем я ожидал.»\n[s4] «Я думал, ты захочешь бездельничать, а ты сама вызвалась работать!»"
1006303-19 = "Ха-ха... Ну, эм... конечно!"
1006303-20 = "Правда в том... что бы это ни было... это будет намного, намного, НАМНОГО лучше любой фигни, которую старшекурсницы из Миллениум заставляют меня делать!"
1006303-21 = "...А?"
1006303-22 = "Думаете, работа в Шале будет такой же скучной, как в Семинаре?"
1006303-23 = "Ха-ха... Сенсей. Вы вообще не понимаете, о чём говорите, да? Тут дело не просто в скуке! Совсем нет!"
1006303-24 = "Там я... по сути просто штампую документы... Документ за документом, конца не видно, а я даже не знаю, что в них написано..."
1006303-25 = "Сидеть на одном месте и делать одно и то же снова, и снова, и снова... Мой мозг этого не выдерживает!"
1006303-26 = "Хотите знать, что именно я делаю? А зачем?"
1006303-27 = "Ну... ничего важного, правда. Просто, например, восстанавливаю потерянные пароли других учеников или разблокирую системы безопасности, которые случайно заблокировали..."
1006303-28 = "Или разбираюсь, как починить настолько старый код, что никто уже не знает, кто его написал... В общем, куча бесполезной ерунды."
1006303-29 = "[s5] «Но разве всё это не очень полезно?»\n[s6] «Ты выполняешь потрясающую работу, Коюки.»"
1006303-32 = "...Нет! Блин! Хватит! Вы вообще не это должны были сказать!"
1006303-33 = "Это ужасно скучно! Ни капли смысла! Никакого удовлетворения!"
1006303-34 = "Я сижу, передо мной кладут проблему, я пишу первое, что приходит в голову, и она сама решается! Я даже не успеваю понять, в чём была проблема, а мне уже приносят следующую, потом ещё одну, и ещё, и ещё..."
1006303-35 = "Они обращаются со мной как с автоматом, но я человек! Целый человек! Я больше не хочу!"
1006303-36 = "Если жизнь такая, как я могу не искать свободы? Даже если каждый раз попадаюсь!"
1006303-37 = "А вдобавок ко всему меня ещё и бросают в одиночное заключение — то в пустую рабочую комнату, то в Комнату самоанализа... Есть ли вообще предел, до которого не опустится Семинар Миллениум? Есть ли пытка, которую они не применят?"
1006303-38 = "[s7] «Мне кажется, часть этого ты сама на себя навлекла...»\n[s8] «Не думаю, что они бы так делали, если бы ты не устраивала проблемы...»"
1006303-41 = "Сенсей, ну вы злой! Вы должны быть на моей стороне! Бедная угнетённая душа рассказывает вам свою трагическую историю, а вы вот так отвечаете?"
1006303-42 = "Ух, ладно..."
1006303-43 = "Короче, что бы вы ни поручили, это хотя бы будет интереснее работы в Семинаре."
1006303-44 = "Ну так что? Какое у меня задание? Или, о нет... Здесь тоже придётся работать с паролями?"
1006303-45 = "...А?"
1006303-46 = "У вас нет такой работы? О, и вы точно не хотите, чтобы я здесь взламывала пароли?"
1006303-47 = ""
1006303-49 = ""
1006303-50 = ""
1006303-51 = "Ха-ха, почему?"
1006303-52 = "[s9] «Что значит „почему“?»\n[s10] «Потому что это Шале... а не Миллениум?»"
1006303-55 = "Хм-м."
1006303-56 = "...И что? Я... не понимаю. Или..."
1006303-57 = "Нет, я что-то упускаю. А? Есть что-то, чего мне знать не положено?"
1006303-58 = "В смысле, есть очень многое, чего мне знать не положено?"
1006303-59 = "[s11] «Что тут непонятного?»\n[s12] «Если бы я мог рассказать, это уже не было бы секретом.»"
1006303-62 = ""
1006303-64 = ""
1006303-65 = "Хмф... Ладно. Наверное."
1006303-66 = "...Хмммм..."
1006303-67 = "[ns13] «...Эм, Коюки?»\n[ns14] «О чём ты сейчас думаешь?»"
1006303-70 = "Нет! То есть, эм, э-э, ни о чём! Я вообще ничего не думаю!"
1006303-71 = "Я точно не думаю: «О, надо посмотреть!»"
1006303-72 = "Я вообще ничего такого не думаю. Не думала и не думаю!"
1006303-73 = "Конечно!"
1006303-74 = "В общем! Похоже, сегодня мне здесь делать нечего, так что..."
1006303-75 = "Эм..."
1006303-76 = "Я просто..."
1006303-77 = "Я, наверное..."
1006303-78 = "На сегодня пойду... Сенсей... Увидимся позже..."
1006303-79 = "[s15] «Коюки, стой...»\n[s16] «Ты сейчас ведёшь себя до смешного подозрительно...»"
1006303-83 = "Ладно! Хорошего дня!"
1006303-84 = ""
1006303-86 = ""
1006303-88 = "[ns] «...»"
1006303-89 = ""
1006303-98 = "Остаток дня я потратил на перевод всех систем безопасности офиса в самый строгий режим."
