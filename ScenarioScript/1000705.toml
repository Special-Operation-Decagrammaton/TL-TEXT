[translation]
1000705-1 = "Гений или безмозглая?"
1000705-2 = "Класс Миллениума"
1000705-3 = "Учёба вообще не имеет отношения к тому, что я завалила тест..."
1000705-4 = "Тесты в Миллениуме изначально слишком сложные! Ни одна задача не рассчитана на обычных старшеклассников!"
1000705-5 = "[s] «Ты смогла бы решить что угодно, если бы просто взялась за учёбу.»"
1000705-6 = "Сенсей, ты начинаешь говорить как учитель... Хотя, погоди. Ты ведь и есть учитель."
1000705-7 = "К тому же чтение учебников вообще не помогает мне понять задания."
1000705-8 = "Особенно по литературе! Откуда мне знать, что чувствует рассказчик, просто прочитав абзац? Я мысли читать не умею!"
1000705-9 = "Что? Как я могу быть хорошим хакером, если не умею отвечать на такие простые вопросы?"
1000705-10 = "Не понимаю, о чём ты. Взлом намного проще."
1000705-11 = "Если налить в ведро слишком много воды, она перельётся. Если у тебя нет ключа, чтобы что-то открыть, просишь его у того, у кого он есть. Всё элементарно!"
1000705-12 = "А литературные задания, значит, должны быть ещё проще взлома? Ну-ну..."
1000705-13 = "А, значит, здесь персонаж счастлив. Хорошо, кажется, я поняла!"
1000705-14 = "А вот это, Сенсей? Что здесь имеется в виду...?"
1000705-16 = "Спасибо, Сенсей! Такими темпами я точно сдам пересдачу на отлично."
1000705-17 = "Удивительно, как просто ты умеешь объяснять сложные вопросы."
1000705-18 = "А? Думаешь, это потому, что я быстро схватываю?"
1000705-19 = "Хаха. Не льсти мне."
1000705-20 = "Может, я и не самая умная в Веритас, но меньше всего мне хочется отставать от программы."
1000705-21 = "И Веритас не считает меня проблемной. Это одно из немногих мест, где мои способности действительно понимают."
1000705-22 = "И ты тоже очень много для меня значишь, Сенсей. Так что... я постараюсь сильнее."
1000705-23 = "Хаха! Это прозвучало слишком неловко. Забудь, что я сказала!"
1000705-24 = "Кхм. Выучила ли я тетрадь, которую ты мне дал?"
1000705-25 = "Здесь написано, что тетрадь состоит из 100 листов белой бумаги типа A плотностью 80 граммов, размером 297 на 210 миллиметров..."
1000705-26 = "Хм? Что я читаю? Начало тетради, которую ты мне дал."
1000705-27 = "*ах* Эту часть не надо было запоминать? Я думала, ты сказал выучить всё, что внутри..."
1000705-28 = "Ч-Что? Ты не можешь понять, я гений или безмозглая? Это ещё что значит, Сенсей?!"
