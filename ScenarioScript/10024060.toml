[translation]
10024060-1 = "Эпизод 6;Открытые сердца, откровенные слова"
10024060-2 = "Улицы Шаньхайцзина"
10024060-3 = ""
10024060-4 = "Сенсей, я хотела поблагодарить вас за то, что ввели нашу знакомую-инструктора в курс дела."
10024060-5 = "[s] «Ну, это была моя идея. Будет справедливо, если я ей всё объясню.»"
10024060-6 = "..."
10024060-7 = "Верите ли вы в высшее благо, Сенсей?"
10024060-8 = "Например, нормально ли жертвовать другими людьми ради дела? Цель оправдывает средства?"
10024060-9 = "Я... сама не знаю, что бы ответила."
10024060-10 = "Члены Генрюмон — истинные верующие до мозга костей."
10024060-11 = "Учитывая её прошлое, вполне логично, что Мина добровольно согласилась на свою роль в этой ловушке."
10024060-12 = "[s1] «Ты кажешься довольно опытным человеком.»\n[s2] «Полагаю, ты предпочитаешь „меньшее допустимое“ „высшему благу“?»"
10024060-15 = "Ха-ха-ха! Сенсей, иногда вы такое говорите..."
10024060-16 = "Как-то так вышло, что я оказалась в кресле президента, но в душе я всё ещё повар."
10024060-17 = "Если бы могла, я бы просто готовила весь день, не думая о расследованиях и политике академии."
10024060-18 = "Еда честная. Чем больше работаешь, тем вкуснее получается. Чем больше учишься, тем больше возможностей открывается."
10024060-19 = "А потом подаёшь блюда, в которые вложил душу, и клиенты хвалят повара."
10024060-20 = "В этом, по сути, и заключается сердце повара."
10024060-21 = "[s] «А что насчёт сердца президента?»"
10024060-22 = "..."
10024060-23 = "Уверена, вы понимаете это лучше меня, но..."
10024060-24 = "...быть главным... тяжёлая ноша."
10024060-25 = "Каждое моё решение влияет на множество студентов."
10024060-26 = "Я ничем не лучше их. Ни в каком смысле."
10024060-27 = "Но эти студенты... опереться им больше не на кого."
10024060-28 = "[s] «Я понимаю это чувство.»"
10024060-29 = "Группы — такая морока!"
10024060-30 = "Они не человек, но иногда ведут себя как человек."
10024060-31 = "Разочарование... Злость... Иногда даже ненависть."
10024060-32 = "И мне приходится их успокаивать, усмирять, а потом делать вид, будто ничего не случилось и всё было пустяком."
10024060-33 = "Когда каким-то образом удаётся всё это провернуть... Наверное, именно это и есть приятная сторона президентства."
10024060-34 = "Но скорее это похоже на... «В этот раз я всё уладила, а дальше посмотрим»."
10024060-35 = "Так что «приятная» даже не совсем подходящее слово, да? Скорее мимолётное облегчение..."
10024060-36 = "[s] «Очень проницательно.»"
10024060-37 = "Нет, совсем нет. Что с вами не так?"
10024060-38 = "Вы из тех людей? Постоянно хвалите других, чтобы хитростью заставлять их что-то вам давать?"
10024060-39 = "Я раскусила вашу игру, Сенсей. Хотя... стратегия действенная..."
10024060-40 = "Только не переусердствуйте. Так можно нажить очень много проблем."
10024060-41 = "[s] «У тебя есть личный опыт, да?»"
10024060-42 = "Хм. Ну... Без комментариев."
10024060-43 = "Что за взгляд? У каждого есть секрет-другой."
10024060-44 = ""
10024060-46 = ""
10024060-47 = "...Но это и правда странно. Я ещё никому такого не рассказывала."
10024060-48 = "[s] «Работа учителя — слушать своих студентов.»"
10024060-49 = "..."
10024060-50 = "Скажи, Сенсей..."
10024060-51 = ""
10024060-53 = ""
10024060-55 = "Если вы так говорите... я могу неправильно это понять."
10024060-56 = "В любом случае, пора. Мне нужно встретиться с нашей знакомой-инструктором."
10024060-57 = "[s] «Пожалуйста, береги её.»"
10024060-58 = "Не волнуйтесь. От этого зависит судьба Променада — никто не тронет у неё ни волоска."
10024060-59 = "Ох. Сколько же хлопот ради доставки одной коробки..."
10024060-60 = "[s] «Но ведь всё упирается именно в эту коробку, верно?»"
10024060-61 = "Да-да. Скоро вернусь."
10024060-63 = ""
10024060-66 = "После того как Руми скрылась вдали..."
10024060-67 = ""
10024060-69 = ""
10024060-70 = "...ко мне присоединился студент Генрюмон с таинственной аурой."
10024060-71 = ""
10024060-75 = "[ns3] «Чем могу помочь?»\n[ns4] «Вы здесь ради Мины?»"
10024060-78 = "Где все?"
10024060-79 = "[s5] «О, тут. Там. Где-то рядом.»\n[s6] «Хотите, я передам сообщение?»"
10024060-82 = ""
10024060-84 = ""
10024060-85 = "Нет... Мне просто нужно было убедиться, что мы одни."
10024060-86 = ""
10024060-88 = ""
10024060-90 = ""
10024060-91 = "Хм. Теперь улизнуть одной сложнее, чем раньше."
10024060-92 = ""
10024060-96 = "[ns] «Кисаки?!»"
10024060-97 = "О, вы удивлены?"
10024060-98 = "Как президент Генрюмон, я естественно хотела лично проверить, как идут дела."
10024060-99 = "Обязательно ли было приходить лично?"
10024060-100 = "Есть вещи, которых не видно с высокого кресла."
10024060-101 = "У каждого свой взгляд. Если забыть об этом, начинаешь упускать важное."
10024060-102 = "Итак... Как всё идёт? Я хочу услышать вашу точку зрения."
10024060-108 = "Я ввёл её в курс нашего расследования."
10024060-110 = ""
10024060-111 = "Поняла."
10024060-112 = "Я правильно сделала, поставив Мину рядом с вами."
10024060-113 = "Может, по ней не скажешь, но у неё хватает решимости."
10024060-114 = "[s] «Так ты действительно отправила её встретиться с нами на горе Куньлунь?»"
10024060-115 = "Верно. Она была там по моему приказу."
10024060-116 = "А если вы четверо не смогли бы поладить? Я и это предусмотрела."
10024060-117 = "Мина сильная, но одна не победит двух членов Променада Чёрной Черепахи."
10024060-118 = "А те двое не стали бы серьёзно вредить ей у вас на глазах."
10024060-119 = "Мине и Променаду Чёрной Черепахи пришлось бы заключить шаткий союз."
10024060-120 = "А вы, Сенсей, удерживали бы всё вместе."
10024060-121 = "Я ошиблась в прогнозе?"
10024060-122 = ""
10024060-125 = "[ns] «Ты угадала точно, Кисаки. Впечатляет.»"
10024060-126 = "Не нужно меня хвалить. Это всего лишь то, что я должна делать как президент Генрюмон."
10024060-127 = "Честно говоря, я бы прекрасно обошлась без этого титула..."
10024060-128 = ""
10024060-130 = ""
10024060-131 = "Нет. Забудьте, что я это сказала."
10024060-132 = "[s] «Так зачем ты вообще хотела, чтобы Мина вступила в союз с Променадом?»"
10024060-133 = "..."
10024060-134 = "Некоторые вещи становятся ясны только вблизи."
10024060-135 = "Мина честная и усердная, но её взгляд слишком узок."
10024060-136 = "Если она научится гибкости, то увидит гораздо более широкий мир."
10024060-137 = "Думаю, вы меня понимаете. Вы хорошо разбираетесь в людях."
10024060-138 = "Когда всё закончится, не хотите задержаться в Шаньхайцзине ещё немного? Я лично позабочусь о вас."
10024060-139 = "[s] «Очень любезное предложение, но вынужден отказаться.»"
10024060-140 = "Хе-хе. Жаль."
10024060-141 = "А вот Руми... Она фигура, которую я не могу двигать по доске как захочу."
10024060-142 = "Наверное, это должно меня раздражать, но не думаю, что её бы это сильно волновало."
10024060-143 = "И она всё равно не ждала бы, что я стану слушать её слова."
10024060-144 = "[s] «У вас двоих есть общее прошлое.»"
10024060-145 = "У нас... хлопотные отношения. Когда-то я думала работать вместе с ней, но..."
10024060-146 = "Нет смысла об этом говорить. Забудьте мои слова."
10024060-147 = "[s] «Ну, ты сама увидела ситуацию. Что думаешь?»"
10024060-148 = "..."
10024060-149 = "Не уверена, что мне стоит рассказывать вам, что я думаю на самом деле."
10024060-150 = "О, считаете, мне лучше сказать это Руми?"
10024060-151 = "Ха..."
10024060-152 = "Обычно я не люблю тех, кто суёт нос не в своё дело. Но вы... вы другой, Сенсей."
10024060-153 = "Правда в том, что почти неважно, что покажет ваше расследование."
10024060-154 = "Не удивляйтесь так. В моём мире подобные ситуации обычны."
10024060-155 = ""
10024060-158 = ""
10024060-159 = "Если за контрабандой стоит Променад Чёрной Черепахи, мы его закроем. Просто."
10024060-160 = ""
10024060-162 = ""
10024060-163 = "А если они невиновны, несложно подставить их в этом или в чём-нибудь ещё и держать под контролем."
10024060-164 = ""
10024060-166 = ""
10024060-167 = "В любом случае Генрюмон остаётся в выигрыше."
10024060-168 = ""
10024060-170 = "[ns] «Может, здесь всё так и работает, но тебе это не нравится.»"
10024060-172 = ""
10024060-173 = "...Почему вы так думаете?"
10024060-174 = "[s] «Если бы нравилось, ты бы не переоделась и не пришла сюда сама.»"
10024060-175 = "Хех... Вы видите меня насквозь, Сенсей."
10024060-176 = "Генрюмон... остаётся Генрюмон."
10024060-177 = "Я могу быть президентом, но не могу просто согнуть Генрюмон под свою волю."
10024060-178 = "[s] «Ты много стараешься, Кисаки.»"
10024060-179 = ""
10024060-181 = ""
10024060-182 = "...Это ещё что значит?"
10024060-183 = "Вы... со всеми так разговариваете? Или именно это и делает вас Сенсеем из Шале?"
10024060-184 = "Вы меня разозлили? Чтобы поколебать президента Генрюмон, нужно нечто большее."
10024060-185 = "По правде..."
10024060-186 = ""
10024060-188 = ""
10024060-190 = ""
10024060-191 = ""
10024060-192 = "[ns] «Ого!»"
10024060-193 = "Кисаки без предупреждения прыгнула мне на спину."
10024060-195 = "Может, есть вещи, которые видны только с вашей точки зрения, но есть и то, что вижу только я."
10024060-196 = "Значит, вот как выглядит мир с точки зрения Сенсея..."
10024060-197 = "..."
10024060-198 = ""
10024060-200 = "[ns] «Ты ведь на самом деле не думаешь, что Руми замешана, да?»"
10024060-201 = "Руми умеет оценивать риски. Она никогда не полезла бы в настолько опасное дело лично."
10024060-202 = "Если Променад и замешан, то кто-то из рядовых членов. Кто-то ниже её поля зрения."
10024060-203 = "Кто-то, кого интересует только собственная выгода."
10024060-204 = "[s] «Согласен.»"
10024060-205 = "..."
10024060-206 = ""
10024060-208 = ""
10024060-209 = ""
10024060-212 = "У меня есть просьба, Сенсей."
10024060-213 = "Защитите Руми и присмотрите за Миной. И за Рэйдзё заодно."
10024060-214 = "По крайней мере, пока правда не раскроется."
10024060-215 = "Если Променад Чёрной Черепахи действительно стоит в центре этого дела, я сама заставлю Руми ответить."
10024060-216 = "Но до тех пор невиновные девушки не должны из-за этого страдать."
10024060-217 = "За ними и правда нужен постоянный уход. Подумать только, даже самой президенту Генрюмон пришлось прийти сюда..."
10024060-218 = "[s] «Если бы я не знал тебя лучше, решил бы, что тебе не всё равно на Руми и Променад Чёрной Черепахи.»"
10024060-219 = "...Может быть."
10024060-220 = ""
10024060-222 = ""
10024060-223 = "Променад Чёрной Черепахи — часть Шаньхайцзина. Как и Генрюмон."
10024060-224 = "Это всё, что я могу сказать."
