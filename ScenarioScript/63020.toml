[translation]
63020-1 = "Эпизод 2;Несмотря ни на что"
63020-2 = ""
63020-3 = "Что ждёт в его конце?"
63020-4 = "...!"
63020-5 = "Раз уж мы заговорили о прошлом, давай немного глубже окунёмся в воспоминания."
63020-6 = "...Говорят, цепляться за старые воспоминания — признак старости и упадка. Ты уже настолько одряхлела?"
63020-7 = "Может быть. В последнее время и правда чувствую себя немного тупее."
63020-8 = "...Хотя при Сенсее так говорить немного невежливо."
63020-9 = "Но взамен я многое получила."
63020-10 = "Это напоминает одну старую историю. Помнишь притчу о суровом инструкторе и добром центурионе?"
63020-11 = "Конечно. Для любой организации это почти обязательные типажи."
63020-12 = "Только не говори, что собираешься выставить себя добрым центурионом."
63020-13 = ""
63020-15 = ""
63020-16 = "Вовсе нет. По любым меркам суровым инструктором была я. Если кто и был добрым центурионом — то ты."
63020-17 = "Люди умеют жить лишь так, как знают."
63020-19 = "Да. Хотя теперь это уже неважно, каждого члена Отряда отобрали по определённой причине."
63020-20 = "А мне как лидеру в плане подготовки досталось хуже всех."
63020-22 = "...И в конце концов я продолжила этот круг. Повернулась и стала обращаться с другими ровно так же, как обращались со мной."
63020-23 = ""
63020-24 = "...Оглядываясь назад, я действительно была дурой."
63020-25 = "Ты всё ещё коришь себя за такое? Честно говоря, не думала, что когда-нибудь именно мне придётся утешать ТЕБЯ."
63020-26 = "Люди и правда живут только так, как умеют."
63020-27 = "Раньше я тоже так думала."
63020-28 = ""
63020-30 = ""
63020-32 = "Пока не покинула Ариус."
63020-33 = ""
63020-35 = ""
63020-36 = "...К чему ты сейчас клонишь?"
63020-37 = "Не у всех, конечно, но образ жизни обычно влияет на мышление человека, а мышление, в свою очередь, ещё сильнее затягивает его в этот образ жизни."
63020-38 = "Так что с этой точки зрения твой взгляд нельзя назвать неправильным."
63020-39 = "Но есть и другие варианты. Люди могут думать и жить так, как сами выберут."
63020-40 = "Это самое важное, чему я научилась после ухода."
63020-41 = ""
63020-43 = ""
63020-44 = "Можешь уже перейти к сути?"
63020-45 = "Я знаю всё, что ты сейчас чувствуешь. На твоём месте я чувствовала то же самое."
63020-46 = "Ты собрала потерянных студентов и повела их за собой. Дала им причину снова жить."
63020-47 = "Постепенно это и тебе дало силы продолжать двигаться."
63020-48 = "Но скажи: к чему именно ты движешься? Что находится в конце твоего «пути Ариуса»?"
63020-49 = ""
63020-51 = ""
63020-52 = "Мы обе знаем ответ. В итоге останутся только ненависть и ярость."
63020-53 = "Больше ничего. Всё бессмысленно. Ничего не останется. Это неизбежный конец этого пути."
63020-54 = "Если бы я осталась в Ариусе, если бы никогда не увидела больше мира..."
63020-55 = "Если бы я не встретила Сенсея, сейчас я стояла бы ровно там, где стоишь ты."
63020-56 = "Я всё ещё играла бы сурового инструктора, отвергая всё за пределами того, чему меня учили."
63020-57 = "Я всё ещё носила бы в сердце ненависть, которую считала «нашей»."
63020-58 = "...И теперь ты вернулась, чтобы сказать, что весь наш образ жизни с самого начала был неправильным?"
63020-59 = "Нет. В таких вещах нет правильного и неправильного. Я всё ещё так считаю."
63020-60 = "Мы просто хотели, чтобы вы хоть немного узнали внешний мир и чуть расширили кругозор."
63020-61 = "Иногда это помогает. А после уже принимайте любое решение, какое захотите."
63020-62 = "...Взгляды человека не так высечены в камне, как может казаться."
63020-63 = "Если бы подобное сказали ничего не понимающие люди вроде тех «девчонок из Тринити», как ты их называешь..."
63020-64 = "...это, наверное, звучало бы как пустая болтовня наивных оптимистов, полная притворства и лицемерия."
63020-65 = "Но... по крайней мере, мне кажется, мы с Отрядом заслужили право хоть немного говорить на эту тему."
63020-66 = "...В конце концов, мы все валялись в одной и той же канаве."
63020-67 = ""
63020-68 = "Я тоже никогда не любила безрассудных оптимистов."
63020-69 = "Если честно, я их ненавидела. Всем сердцем."
63020-70 = "Это люди, которые отворачиваются от всего ужаса, происходящего в мире."
63020-71 = "Ничего не зная, они проповедуют свои убеждения и насильно запихивают их тебе в глотку."
63020-72 = "Но не все такие. На самом деле..."
63020-75 = "[log]«Студент никогда не должен преклонять колени перед учителем».[/log]"
63020-77 = "[log]«Конечно, у тебя есть ещё один шанс».[/log]"
63020-79 = "[log]«А если нет — я его создам».[/log]"
63020-82 = "Даже зная, что в этом мире происходят ужасные вещи..."
63020-83 = "...и даже принимая, что иногда мир бывает жестоким и уродливым..."
63020-85 = "...всё равно существуют люди, которые никогда не колеблются и не сдаются."
63020-86 = "...Не знаю, как тебе, а меня такое убедило окончательно."
63020-87 = "Есть выражение, которое сейчас употребляют не так часто..."
63020-88 = ""
63020-89 = "...но мне всё больше нравятся слова «несмотря ни на что»."
63020-90 = "О, значит, теперь ты у нас такая мудрая? На твоём месте я бы не спешила хвастаться собственной жизнью!"
63020-91 = "Стоит тебе выйти из Ариуса, и ты снова станешь беглянкой, вечно убегающей от возможного ареста!"
63020-92 = ""
63020-95 = ""
63020-96 = "Да. Ты права."
63020-97 = "Поэтому я собираюсь прекратить."
63020-98 = "А?!"
63020-99 = ""
63020-101 = ""
63020-102 = "[ns] «Что?!»"
63020-103 = "Мы вчетвером уже всё обсудили."
63020-104 = ""
63020-106 = ""
63020-107 = "...Да. Всё так, как она сказала."
63020-108 = "Хех, хи-хи. Как скажешь, Саори."
63020-109 = "Да. Мы ведь не можем продолжать так до конца жизни, правда?"
63020-110 = "Простите, Сенсей. Мы хотели сказать вам, когда настанет подходящий момент, но он всё никак не наступал."
63020-111 = "[s1] «Н-не это сейчас важно...!!»\n[s2] «Вы и правда собираетесь сдаться властям?»"
63020-112 = ""
63020-113 = ""
63020-115 = ""
63020-116 = ""
63020-117 = "Да. Когда всё это закончится, именно так мы и намерены поступить."
63020-118 = "Больше всего я просто устала. С меня хватит."
63020-119 = "Я слишком долго жила в тени. Ни разу не могла с гордостью стоять под открытым небом."
63020-120 = "Ты забыла? Вы все террористки."
63020-121 = "То, что вы сделали, было самым настоящим террористическим актом, совершённым со злым умыслом."
63020-122 = "Ты всерьёз хочешь сказать, что не понимаешь, какой срок вас ждёт?"
63020-123 = "Понимаем. Но нас устраивает и это. Мы даже предпочитаем такой исход."
63020-124 = "Мне нужно заплатить за то, что я сделала."
63020-125 = "Я больше не хочу убегать от своего прошлого."
63020-126 = "Не волнуйся. С оставшимися студентами Ариуса всё будет хорошо."
63020-127 = "Я намерена сказать, что именно я была организатором и зачинщицей."
63020-128 = "...И если честно, в определённой степени это правда."
63020-129 = "Так что уверена, ты тоже—"
63020-130 = ""
63020-132 = ""
63020-134 = "[log=니코 스바루][FF6666]Что именно ты сейчас мне говоришь, Джомаэ Саори?[-][/log]"
63020-137 = "Что...?"
63020-138 = "Я спросила, что именно ты сейчас мне говоришь. Хотя нет, не отвечай."
63020-139 = "Мне даже не нужно пытаться читать твои мысли. Ты слишком предсказуема."
63020-140 = "Собираешься сдаться? Больше не хочешь убегать?"
63020-141 = "Теперь хочешь притвориться паинькой? Просто похоронить всё и делать вид, будто ничего не было?"
63020-142 = "Или мне теперь считать тебя просветлённой мудрецом?"
63020-143 = "Ты что, смотришь на нас свысока, будто тебе уже всё в мире безразлично?"
63020-144 = ""
63020-146 = ""
63020-147 = "Не смеши меня. Если ты не познала абсолютно всё, что может предложить этот мир, прекрати строить из себя всезнайку."
63020-148 = "Не смей смотреть на Ариус свысока, будто она твоя, будто ты познала сам смысл жизни."
63020-149 = "Сейчас ты ведёшь себя точь-в-точь как эти мерзкие девчонки из Тринити!"
63020-150 = "Я больше не хочу слышать от тебя ни слова! Хватит нести эту чушь! Ничего не изменилось! НИЧЕГО не стало другим! Наши жизни происходят ПРЯМО СЕЙЧАС!"
63020-151 = "Оглянись! Что-нибудь выглядит иначе? Ариус уже внезапно починили?"
63020-152 = "Ах да! Тут всё ещё одни руины! А внутри всё гниёт ещё сильнее, чем раньше!"
63020-153 = "Ты НИЧЕГО не знаешь о том, через что прошли Ариус, через что прошли МЫ после исчезновения Мадам! Как ты смеешь говорить с таким видом, будто всё понимаешь?!"
63020-154 = "Всё это время никто из вас ни разу о нас не вспомнил! Ни ты. Ни Отряд. Ни даже Сенсей."
63020-155 = "Это я охраняла Ариус, наш дом! Мы это делали!"
63020-156 = ""
63020-158 = ""
63020-159 = "Не ты! Не Отряд! Вы бросили всю свою ответственность и сбежали играть в домик именно тогда, когда были нужны нам больше всего!"
63020-160 = "Субару... Я вовсе не хотела претендовать на что-то настолько великое."
63020-161 = "«Мудрец»? Я всё ещё ничего не знаю. И ничего не сделала, чтобы заслужить такое название."
63020-162 = "Я просто..."
63020-163 = "Просто..."
63020-166 = "(После того дня я помню первое небо, которое когда-либо увидела. Оно было таким синим.)"
63020-167 = "(И тогда же я впервые по-настоящему это почувствовала.)"
63020-168 = "(Я подумала: «А. Может быть, мир вокруг меня всегда был здесь, уже очень-очень давно».)"
63020-169 = "(Глаз не насыщается одним лишь видением, и ухо не наполняется одним лишь слышанием.)"
63020-170 = "(Что было, то будет вновь.)"
63020-171 = "(Что делалось, то снова будет сделано. В этой вселенной не существует ничего «нового».)"
63020-172 = "(Счастье, боль, гордость и смирение, гнев... даже ненависть.)"
63020-173 = "(Воистину.)"
63020-175 = "Vanitas vanitatum. Всё тщетно."
63020-178 = "Я просто... впервые почувствовала, что оставшаяся жизнь слишком драгоценна, чтобы тратить её впустую."
63020-179 = "...!"
63020-180 = ""
63020-182 = ""
