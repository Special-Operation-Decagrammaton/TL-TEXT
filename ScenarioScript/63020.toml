63020-185 = "[log=니코 스바루]Как ты смеешь[/log]"
63020-186 = "[log=니코 스바루]говорить такое?[/log]"
63020-187 = "[log=니코 스바루]Ты предала нас.[/log]"
63020-188 = "[log=니코 스바루]Бросила нас.[/log]"
63020-189 = "[log=니코 스바루]Никогда больше[/log]"
63020-190 = "[log=니코 스바루]не смей так говорить.[/log]"
63020-193 = "[log=니코 스바루][FF6666]Если ваши жизни настолько драгоценны,[-][/log]"
63020-195 = "[log=니코 스바루][FF6666]то что насчёт тех, кто остался здесь, в Ариусе?[-][/log]"
63020-198 = "[log=니코 스바루][FF6666]Что насчёт меня, оставшейся защищать гнездо,[-][/log]"
63020-200 = "[log=니코 스바루][FF6666]ради тех, кто остался и кто ещё мог вернуться?[-][/log]"
63020-203 = "Ты не можешь просто заставить прошлое исчезнуть!"
63020-204 = "Субару?!"
63020-205 = "Прошлое никогда просто не исчезает! Оно цепляется за нас! Оно доказывает настоящее!"
63020-206 = "Это Porta Pacis! Вся история школы-сателлита Ариус сходится в этом месте, во мне!"
63020-207 = "В конце концов, самое важное в этом мире — ты сама! Когда ты умираешь, твой мир умирает вместе с тобой!"
63020-208 = "Если так, значит образ жизни каждого человека — само доказательство его существования! Его мира!"
63020-209 = "Никто не возьмёт ответственность за твою жизнь и не проживёт её вместо тебя! Поэтому я избавила студентов от сомнений!"
63020-210 = "Чтобы, что бы ни случилось, они могли продолжать жить без страха!"
63020-211 = ""
63020-213 = ""
63020-216 = "То, что сделала Мадам, было неправильно. Это честная правда."
63020-217 = "Но не всё, что она оставила после себя... было неправильным."
63020-218 = "Ничто не происходит без смысла. Событие обретает смысл уже просто потому, что случилось."
63020-219 = "Значит, бессмысленного страдания не существует."
63020-220 = "А если бессмысленного страдания не существует, то и бессмысленного прошлого быть не может."
63020-223 = ""
63020-225 = "Эм... Ещё кому-нибудь сейчас становится немного не по себе?"
63020-226 = ""
63020-228 = ""
63020-229 = ""
63020-230 = ""
63020-231 = ""
63020-232 = ""
63020-233 = ""
63020-234 = ""
63020-235 = ""
63020-236 = ""
63020-237 = ""
63020-238 = ""
63020-240 = ""
63020-241 = "Сенсей! За нас!"
63020-242 = ""
63020-246 = ""
63020-247 = "Ты слишком на неё надавила, Лидер."
63020-248 = "Я-Я не пыталась её провоцировать. Правда не пыталась."
63020-249 = "Да-да. Обсудим это потом, Сао-Сао."
63020-250 = "А сейчас..."
