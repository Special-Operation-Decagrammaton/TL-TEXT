63020-258 = "[log]Те, кто губят землю, и те, кто лживы...[/log]"
63020-261 = "[log]...и те, кто произносит имя твоё всуе,[/log]"
63020-263 = "[log]время их погибели наконец придёт.[/log]"
63020-265 = ""
63020-266 = "Думаю, сначала нужно разобраться с самой срочной проблемой."
