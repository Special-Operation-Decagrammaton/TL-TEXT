[translation]
10056105-4 = "Dragon King, explosion confirmed in Area 1... Something is sticking to the hull!"
10056105-5 = "Engine room, pressure dropping! Ballast line damaged!"
10056105-6 = "Areas 2 and 3 hit simultaneously... The damage is severe!"
10056105-7 = "...Are there really only four of them?"
10056105-8 = "And they have already attacked over ten locations...?"
10056105-12 = "What kind of tricks are they using!?"
10056105-13 = "Drainage pumps are at their limit! At this rate, Ryugyu... the entire fleet will sink!"
10056105-14 = "D-Dragon King...!"
10056105-15 = "To think we are losing to mere... diving club members...!"
10056105-19 = "It is a monster... There is a monster!"
10056105-23 = "...Stop it, stop it!"
10056105-26 = "...Did you just say \"stop it\"?"
10056105-27 = "That is right, I said \"stop it\"!"
10056105-28 = "We do not need to rely on ambergris... I have more than enough tribute."
10056105-29 = "I am sick of playing along with your games! I am going home!"
10056105-30 = "[ns1] \"Phew, that is a relief...\"\n[ns2] \"It is finally over...\""
10056105-33 = "You are the Sensei of Schale, are you not?"
10056105-34 = "Since I have not yet regained my true power, I will make an exception and withdraw this time..."
10056105-35 = "Next time, I will make you yield!"
10056105-36 = "[s3] \"Yeah. See you again.\"\n[s4] \"...Just don't cause any trouble until then, okay?\""
10056105-39 = "W-What kind of attitude is that!"
10056105-43 = "Um... Nanami."
10056105-44 = "Call me the Dragon King!"
10056105-45 = "Y-Yes! Dragon King!"
10056105-46 = "W-We are not really that bothered by what happened on the water."
10056105-50 = "However, if by any chance... even a one-in-a-million chance..."
10056105-51 = "You ever point a gun at our Sensei again--"
10056105-52 = "I can only pray that misfortune does not befall you."
10056105-53 = "...Ghk."
10056105-54 = "Fleet, all engines full speed! Fall back!"
10056105-59 = "Phew, going hard, aren't we?"
10056105-64 = "H-Huh...?#nDid I say something weird...?"
10056105-65 = "When Kokoro gets mad, she is really scary."
10056105-66 = "It surprised me so much I almost sank."
10056105-67 = "I-I was just giving a warning..."
10056105-68 = "[s] \"Kokoro, great work out there.\""
10056105-69 = "S-Sensei, great work to you too!"
10056105-70 = "The pirates are gone, so now we just need to head back to Odyssey."
10056105-71 = "[s5] \"About that though...\"\n[s6] \"Where is our boat...?\""
10056105-74 = "Ah, well... about that."
10056105-75 = "It flipped over. When the whale jumped earlier."
10056105-76 = "The impact of a whale breaching is about the same as detonating forty grenades at once, so..."
10056105-77 = "Wh-What should we do...?"
10056105-78 = "Huh? Wait, uwaah... Does this mean we are stranded?#nQ-Quick, send a distress signal--"
10056105-79 = "Kokoro, calm down."
10056105-80 = "I already sent a signal to the island via radio."
10056105-81 = "A rescue boat will come if we wait around here."
10056105-82 = "Oh, thank goodness..."
10056105-83 = "Drifting at sea... It has been a while since I have had to wait for a rescue boat like this."
10056105-84 = "Until the boat arrives, we will wait while doing that."
10056105-85 = "[s] \"...That?\""
10056105-86 = "Yeah. Sensei, come over here."
10056105-92 = "When drifting at sea, you need to maintain body heat and stick close together so you do not get separated."
10056105-104 = "[ns] \"Isn't holding hands enough?\""
10056105-105 = "N-No way!"
10056105-106 = "Because the scariest thing when drifting is your body temperature dropping."
10056105-107 = "A-And it is a safety measure, so..."
10056105-111 = "For now, please follow the president's instructions!"
10056105-114 = "(Afterward, we floated in the sea, hugging each other until the rescue boat arrived.)"
10056105-115 = "(Thanks to that, we did not feel cold, but...)"
10056105-119 = "(We almost got misunderstood by the Trident students on the rescue boat.)"
