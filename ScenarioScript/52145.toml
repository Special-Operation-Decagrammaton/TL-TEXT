52145-52 = "Аямэ сказала, что я всё это вообразила."
52145-53 = "Как любопытно. Тогда откуда ты меня знаешь, Нагуса?"
52145-54 = "Или это тоже сон? Может, я... просто проявление того, что ты сходишь с ума?"
52145-55 = "...У меня нет времени на это. Ты всего лишь чудовище, и каждое твоё слово — ложь."
52145-56 = ""
52145-58 = ""
