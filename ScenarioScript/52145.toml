[translation]
52145-2 = "(Enquanto isso, na \"Mansão Higan\"...)"
52145-15 = "Arf, arf..."
52145-16 = "Você está bem, Ayame?!"
52145-17 = "Vou levando... E você?"
52145-18 = "Sim, eu estou bem."
52145-19 = "Mas não importa quantos a gente derrote, eles não param de vir... Precisamos nos reunir com o pessoal logo... e com o Sensei também..."
52145-20 = "Não... agora a Ayame está aqui, então com certeza vai ficar tudo bem."
52145-21 = "Você sempre resolve até as missões mais difíceis sem esforço nenhum, né? Diferente de alguém como eu."
52145-25 = "..."
52145-30 = "...Ainda não percebeu?"
52145-31 = "Eu não disse? Que o coração humano é algo verdadeiramente misterioso."
52145-39 = "Quanto tempo, senhorita da Hyakkaryouran."
52145-50 = "Você foi quem levou a Ayame naquele dia..."
52145-51 = "Não, espera!#nAquilo... foi só um pesadelo...!"
52145-52 = "Não é nada disso... a Ayame..."
52145-53 = "Então por que será que você sabe quem eu sou, hein?"
52145-54 = "Vai dizer que esta cena também é um pesadelo?"
52145-55 = "...Não vou cair nisso.#nVocê é a presidente do Clube Beleza da Natureza, que engana todo mundo...!"
52145-59 = "Ayame, ao meu sinal vamos atacá-la pelos dois lados—"
52145-63 = "...Hã?"
52145-64 = "...O-Onde ela está?"
52145-69 = "...Desde o começo, eu nunca estive com você."
52145-84 = "Aya... me...?"
52145-85 = "Já acordou do sonho?"
52145-86 = "Você parecia estar se divertindo tanto, Nagusa."
52145-87 = "Mas a realidade começa agora."
52145-88 = "...Não pode ser."
52145-89 = "A Ayame... que eu conh... não é... mentira..."
52145-96 = "Próximo;O Fim do Doce Sonho"
