[translation]
90102030-1 = "Эпизод 3;Поезд, которого не должно существовать"
90102030-2 = "Говорю же, этого не может быть!"
90102030-7 = "Момока, успокойся."
90102030-8 = "Мне тоже есть что не понять.#nНо также факт, что есть несколько свидетельств очевидцев."
90102030-9 = "Именно поэтому, основываясь на мнении [ruby=ゆらき]Юраги[/ruby] Момоки ― выдающегося начальника транспортного отдела, которому все доверяют,#nмы пытаемся убедить горожан."
90102030-10 = "Ugh..."
90102030-11 = "Не могли бы вы ещё раз объяснить конкретно?"
90102030-12 = "Почему поезд, в который, как считается, сел пропавший студент, не мог существовать в это время?"
90102030-13 = "Ну что ж поделать..."
90102030-14 = "Согласно отчёту, в прошлую пятницу в 21:07#nна 4-й путь станции Каваниши прибыл поезд по расписанию."
90102030-15 = "Сразу после этого из-за невыясненной неисправности на 3 минуты отключились камеры наблюдения.#nЕсли верить показаниям, именно здесь и появился тот самый поезд."
90102030-16 = "И когда в 21:10 камеры снова заработали, на станции стоял следующий поезд со всеми остановками. Так?"
90102030-17 = "Именно так."
90102030-18 = "Президент, вы знаете, сколько поезд стоит на станции?"
90102030-19 = "Ну... несколько десятков секунд, разве нет?"
90102030-20 = "Среднее время стоянки на линиях Р.У. — примерно от 30 секунд до минуты."
90102030-21 = "То есть, чтобы проблемный поезд вклинился за те 3 минуты, пока камеры были отключены,#nнужно переключить пути менее чем за минуту."
90102030-22 = "Думаешь, найдётся машинист, который поведёт поезд так опасно?"
90102030-23 = "Действительно.#nСлишком уж короткое время для того, чтобы поезд внезапно появился и исчез."
90102030-24 = "К тому же я проверила камеры на соседних станциях,#nно поезда, которого нет в расписании, на записях не было."
90102030-25 = "Поэтому я и говорю. Невозможно, чтобы поезд ходил вне управления транспортного отдела.#nРазве что кто-то целиком поднял поезд и поставил его на пути."
90102030-26 = "...Судя по словам Момоки, вероятность того, что пропавший студент сел в поезд и исчез, крайне мала."
90102030-27 = "Спасибо, это было полезно.#nПопробую выработать меры на основе вашего рассказа."
90102030-28 = "Серьёзно, мы тут [ruby=саммит глав семи академий]по уши заняты[/ruby] работой, связанной с A7,#nи зачем только распространяются такие пустые страшилки?"
90102030-29 = "Лучше бы, например, набрали популярность пачки чипсов со вкусом ментайко, которые не заканчиваются,#nвот такие вещи."
90102030-30 = "Остаётся только надеяться, что во время сессии не случится крупных проблем."
90102030-31 = "Что ж, Момока тоже старается―"
90102030-32 = "Когда мероприятие благополучно закончится, не сходить ли нам по сладким местам рядом с Тринити?#nТолько Рин не говори."
90102030-33 = "Я, конечно, за..."
90102030-34 = "Ничего, если мы пойдём тайком?"
90102030-35 = "Рин ведь не из тех, кто любит такие сборища?#nДумаю, она откажется, даже если позвать."
90102030-36 = "Но Рин... в последнее время выглядит какой-то одинокой."
90102030-37 = "Может, потому что работы стало меньше?#nЧасто сидит рассеянно... и как будто избегает нас."
90102030-38 = "Вот как..."
90102030-39 = "...Тогда, может, привезём ей в подарок омлет-сэндвич, который продаётся только в Тринити."
90102030-40 = "Я помню, как Рин с аппетитом его ела.。"
90102030-41 = "Как и ожидалось. Председатель хорошо знает вкусы Рин."
90102030-42 = "Ну, если будет хорошая взятка, всё обойдётся. Хе-хе."
90102030-46 = "―Ой, как раз время, когда должна прийти заказанная еда."
90102030-47 = "Ну, я побежала!"
90102030-55 = "...Таково мнение начальника транспортного отдела."
90102030-56 = "Юкино, что вы думаете?"
90102030-62 = "Как и сказала начальник транспортного отдела, это пустая страшилка, далёкая от реальности."
90102030-63 = "Я бы, наверное, подумала, что это ложь, распущенная кем-то, чтобы помешать расследованию исчезновения...#nРаньше."
90102030-64 = "Но―"
90102030-72 = "Сейчас я знаю, что слухи не всегда остаются просто слухами."
90102030-73 = "Да.#nТакже факт, что происходят нападения монстров с использованием нереальных средств."
90102030-74 = "Даже если поначалу это всего лишь бесплотный слух, если горожане воспримут его всерьёз...#nстрашилка может стать реальностью."
90102030-75 = "Особенно поезда, которыми за день пользуется очень много горожан.#nЕсли случится авария, ущерб будет невообразим."
90102030-76 = "...Тем более в замкнутом пространстве вроде станции."
90102030-81 = "Командир отряда Юкино? Вас что-то беспокоит?"
90102030-82 = "Нет. Просто вспомнила прошлое."
90102030-83 = "Кстати, прежде чем начать расследование, я хотела бы спросить.#nЭто происшествие в Р.У. Обычно им занимается Бюро общественной безопасности Валькирии."
90102030-84 = "Тогда почему дополнительное расследование поручили нам?#nПотому что это обсуждают в соцсетях?"
90102030-85 = "И поэтому тоже, но главная проблема в том, что происшествие случилось [ruby=・   ・   ・   ・]на путях[/ruby]."
90102030-86 = "Как вы знаете, у Железнодорожной академии Хайлендер нет автономного района, как у других академий.#nВместо этого она обладает исключительными правами на управление путями и поездами, соединяющими академии."
90102030-87 = "Поэтому [ruby=Railway Safety Department]Отдел безопасности железных дорог[/ruby] Хайлендера―#nсокращённо RSD― традиционно не ладит с Валькирией."
90102030-88 = "Нельзя отправлять студентов Валькирии в ситуацию, которую не признаёт и транспортный отдел."
90102030-89 = "Замешаны интересы академий, и сотрудничества с дисциплинарной организацией не ожидается... так?"
90102030-90 = "Знакомая ситуация."
90102030-91 = "Да. Поэтому это происшествие тоже―"
90102030-97 = "―поручили нам, SRT."
90102030-98 = "[s1] «Вот так...»\n[s2] «В этом деле тоже много загадок...»"
90102030-101 = "Информации из соцсетей недостаточно, нужно собрать данные на месте."
90102030-102 = "Даже неизвестно, существует ли на самом деле тот поезд."
90102030-103 = "Опять опрос свидетелей~"
90102030-104 = "Это лучше, чем бой, но опросы тоже довольно утомляют.#nНу, я же интроверт."
90102030-105 = "Если ты интроверт, то что тогда с экстравертами..."
90102030-110 = "[ns3] «Значит, сегодня снова очередь Нико?\"\n[ns4] «Время \"FOX EATS\"!»"
90102030-113 = "А, насчёт этого..."
90102030-114 = "К сожалению, «FOX EATS» временно закрывается."
90102030-115 = "[s] «Почему!?»"
90102030-116 = "Нико стала своего рода знаменитостью в соцсетях."
90102030-117 = "Некоторые ученики сомневаются, существует ли FOX EATS на самом деле……."
90102030-118 = "Поэтому на время лучше избегать заметных действий."
90102030-119 = "В этой операции она будет отвечать за тыловое обеспечение."
90102030-120 = "[s5] «Значит, костюм подработки Нико откладывается...»\n[s6] «Тогда как поступим на этот раз?»"
90102030-121 = "Ах... если Сенсей желает, в Шале иногда..."
90102030-122 = "Что ты говоришь!?"
90102030-123 = "Так-так, шутки в сторону."
90102030-125 = "Говорят же: «Спрятать дерево — в лесу»?"
90102030-126 = "Как говорится, если хочешь скрыть свою личность на платформе, где ходят поезда―"
90102030-127 = "лучше всего замаскироваться под студента Хайлендера!"
90102030-129 = "Следующий эпизод;Внезапная проверка"

