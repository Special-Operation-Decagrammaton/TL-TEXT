[translation]
90102030-1 = "Episode 3;A Train That Shouldn't Exist"
90102030-2 = "I'm telling you, that's completely impossible!"
90102030-7 = "Momoka, please calm down."
90102030-8 = "There are parts of this I don't understand either. #nHowever, it's also a fact that we have multiple eyewitness accounts."
90102030-9 = "That's why we're trying to persuade the citizens based on the opinion of Yuragi Momoka—an exemplary Traffic Department Director whom everyone trusts."
90102030-10 = "Ugh..."
90102030-11 = "Could you explain the specifics to us one more time?"
90102030-12 = "Why is it that the train the missing student supposedly boarded couldn't have existed at that time?"
90102030-13 = "Sheesh, fine..."
90102030-14 = "According to the report, last Friday at 9:07 PM, #n an express train entered Platform 4 of Kawanishi Station right on schedule."
90102030-15 = "Right after that, an unexplained glitch caused the security cameras to go down for three minutes. #nIf we believe the testimonies, that's when the train in question came in."
90102030-16 = "And then, when the security cameras came back online at 9:10, the next local train was just sitting there at the station. Right?"
90102030-17 = "That is correct."
90102030-18 = "Tell me, General Student Council President, do you know how long a train usually stops at a station?"
90102030-19 = "Let's see... Isn't it about several tens of seconds?"
90102030-20 = "The average stop time on D.U. lines is roughly 30 seconds to a minute."
90102030-21 = "Which means that for the train in question to squeeze in during the three minutes the cameras were down, #n they would have had to switch the tracks in under a minute."
90102030-22 = "Do you really think any driver would pull a stunt that dangerous?"
90102030-23 = "True. #nThat's far too short a window for a train to suddenly appear and vanish."
90102030-24 = "Besides, I checked the security cameras at nearby stations too, #n and there was no footage of an unscheduled train passing through."
90102030-25 = "That's why I'm saying it's impossible for a train outside the Traffic Department's management to be running. #nUnless someone literally picked up an entire train and dropped it on the tracks, anyway."
90102030-26 = "...Judging by what Momoka says, the possibility of the missing student getting on a train and disappearing is extremely low."
90102030-27 = "Thank you, that was very helpful. #nI'll organize our response strategy based on what you've told us."
90102030-28 = "Seriously, we're already worked to the bone with A7-related work for the Joint Academic Summit, #n so why on earth are pointless ghost stories like this spreading?"
90102030-29 = "If anything's going to spread, I wish it were bags of Mentaiko chips that never run out, #n or something actually good."
90102030-30 = "I just hope no major issues arise during the summit."
90102030-31 = "Well, Momoka is working hard for us too—"
90102030-32 = "Once the event goes off without a hitch, how about we go on a Trinity sweets tour? #nWithout Rin knowing, of course."
90102030-33 = "I'm all for it, of course, but..."
90102030-34 = "Will it be alright if we sneak off?"
90102030-35 = "Rin isn't really the type to enjoy gatherings like this, is she? #nI'm sure she'd turn us down if we asked."
90102030-36 = "Still, Rin-senpai... she's been looking kind of lonely lately."
90102030-37 = "Maybe because she has more breathing room with work? #nShe spends a lot of time just spacing out... almost like she's avoiding us."
90102030-38 = "Is that so..."
90102030-39 = "...In that case, shall we bring back some Trinity-exclusive omelet sandwiches as a souvenir?"
90102030-40 = "I remember her eating them with such relish before."
90102030-41 = "Smooth. The General Student Council President really knows Rin-senpai's tastes."
90102030-42 = "Well, as long as we have the proper bribe, we should be fine. Hehe."
90102030-46 = "—Oh, looks like it's time for the food I ordered to arrive."
90102030-47 = "Catch you later!"
90102030-55 = "...That concludes the Traffic Department Director's perspective."
90102030-56 = "What do you think, Yukino?"
90102030-62 = "Just as the Traffic Department Director said, it's an unsubstantiated, pointless ghost story lacking any realism."
90102030-63 = "You'd assume someone fabricated it simply to disrupt the investigation into the disappearance... #nAt least, the old me would have."
90102030-64 = "However—"
90102030-72 = "Now, I know that rumors don't always end as just rumors."
90102030-73 = "Indeed. #nIt is also a fact that we have faced attacks by monsters using unrealistic means."
90102030-74 = "Even if it starts as a baseless rumor, once the citizens take it seriously... #nGhost stories can become reality."
90102030-75 = "Trains, in particular, are used by a vast number of citizens every single day. #nIf an accident were to occur, the casualties would be immeasurable."
90102030-76 = "...Especially in enclosed spaces like station platforms."
90102030-81 = "Squad Leader Yukino? Is something on your mind?"
90102030-82 = "No. Just remembering the past, that's all."
90102030-83 = "Anyway, before we begin the investigation, there's something I'd like to ask. #nThis incident occurred in D.U., which normally falls under the jurisdiction of the Valkyrie Public Safety Bureau."
90102030-84 = "So why is it that we were ordered to conduct a supplementary investigation... #nIs it because it's trending on social media?"
90102030-85 = "That's part of it, but the biggest issue is that this incident occurred on the tracks."
90102030-86 = "As you know, unlike other academies, Highlander Railway Academy has no distinct autonomous district. #nInstead, they hold exclusive operational authority over the tracks and trains connecting the various academies."
90102030-87 = "Because of that, the Highlander Railway Safety Department—#ncommonly known as the RSD—has traditionally had poor relations with Valkyrie."
90102030-88 = "We cannot deploy Valkyrie students while the Traffic Department refuses to acknowledge the situation."
90102030-89 = "Inter-academy conflicting interests getting in the way, making cooperation with disciplinary forces impossible... is that it?"
90102030-90 = "Sound familiar."
90102030-91 = "Yes. That is why this case—"
90102030-97 = "—has been assigned to us, SRT."
90102030-98 = "[s1] \"I can't believe it...\"\n[s2] \"This case has so many mysteries too...\""
90102030-101 = "Social media info only gets us so far, so we need to gather information at the scene."
90102030-102 = "Especially since it's not even clear whether the train in question actually exists."
90102030-103 = "Not questioning people again~"
90102030-104 = "It's way better than combat, but questioning people is still pretty exhausting. #nYou know, since I'm such an introvert."
90102030-105 = "If you're an introvert, what does that make actual extroverts..."
90102030-110 = "[ns3] \"So is it Nico's turn this time?\"\n[ns4] \"It's time for 'FOX EATS'!\""
90102030-113 = "Ah, about that..."
90102030-114 = "Unfortunately, 'FOX EATS' is taking a temporary break."
90102030-115 = "[s] \"Why?!\""
90102030-116 = "Nico became a bit of a minor celebrity on social media."
90102030-117 = "Some students are even starting to doubt whether FOX EATS is a real service..."
90102030-118 = "So it seems best to avoid conspicuous actions for a while."
90102030-119 = "For this operation, I've been assigned to rear support."
90102030-120 = "[s5] \"There goes Nico's part-time uniform...\"\n[s6] \"So what are we going to do this time?\""
90102030-121 = "Ah... If Sensei really wants it, Schale could occasionally..."
90102030-122 = "What are you talking about?!"
90102030-123 = "Alright, alright, jokes aside."
90102030-125 = "You know the saying, 'The best place to hide a leaf is in a forest'?"
90102030-126 = "True to that, if you want to conceal your identity on a busy station platform—"
90102030-127 = "Disguising ourselves as Highlander students is the way to go!"
90102030-129 = "Next Episode;Spot Check"
