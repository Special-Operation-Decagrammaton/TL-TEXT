[translation]
10047030-1 = "Эпизод 3;Оккультизм в искусстве"
10047030-2 = "И Оккультное общество отвело меня в..."
10047030-4 = "Художественную галерею Вайлдханта"
10047030-6 = "[ns] «О... Так вот как выглядит ваша художественная галерея.»"
10047030-7 = "Да. Здесь выставлены любимые всеми, неподвластные времени шедевры."
10047030-8 = "И помимо выставленных работ всё здание само по себе произведение искусства."
10047030-9 = ""
10047030-11 = ""
10047030-12 = "А теперь посмотрите на этот купол. Разве изгиб не прекрасен?"
10047030-13 = "Когда строили здание, в моде были бруталистские, авторитарные сооружения. Но эта галерея была иной."
10047030-14 = "Вместо банальностей она сосредоточилась на природе красоты через изогнутый купол!"
10047030-15 = ""
10047030-17 = ""
10047030-19 = "Видите? Это намеренная золотая пропорция! Поворотный момент в искусстве Кивотоса!"
10047030-20 = "[s] «З-Звучит правдоподобно...»"
10047030-21 = "Хех, давайте отойдём и полюбуемся."
10047030-22 = "Эри... очень хорошо умеет объяснять."
10047030-23 = "Мы и правда будем продолжать в таком духе?"
10047030-25 = "А теперь смотрите сюда! Эта картина называется «Портрет Бытия». Она прекрасно воплощает дух Вайлдханта!"
10047030-26 = "Насладитесь видом бесчисленных призраков, устремляющихся в умирающий закат! Разве не потрясающе?"
10047030-27 = "[s] «Да. Очень впечатляет.»"
10047030-28 = "Я чуть не расплакалась, когда впервые её увидела. «Портрет Бытия» несомненно занимает огромное место и в истории оккультизма!"
10047030-29 = "Хотела бы я однажды создать нечто подобное. Это так оригинально, олицетворяет академию и будет восхищать будущие поколения."
10047030-30 = ""
10047030-32 = ""
10047030-33 = "...Да. Думаю, однажды я смогу написать что-то подобное."
10047030-34 = "[s] «Буду ждать. Покажи мне, когда закончишь!»"
10047030-35 = "Ню-ху-ху. Конечно!"
10047030-36 = "В конце концов... погоня за оккультным наверняка приведёт меня к созданию шедевра."
10047030-37 = "[s] «Так это работает?»"
10047030-38 = "Если честно, я считаю, что искусство и оккультизм родились вместе."
10047030-39 = "Увидев сверхъестественные явления вроде душ, магии и призраков... а затем изучая их, люди захотели выразить немыслимое. И единственным способом стало искусство."
10047030-40 = "Оккультизм — не теория. Он уже глубоко укоренён в нашей культуре и жизни!"
10047030-41 = "И все доказательства можно увидеть в «Портрете Бытия»."
10047030-42 = "Эта картина, кишащая призраками, — жемчужина академии. А значит, сердце академии связано с оккультным!"
10047030-43 = "Кстати, я могу подтвердить всё это доказательствами!"
10047030-44 = "Видите каменную статую рядом с «Портретом Бытия»? Раньше она указывала прямо на старую колокольню, куда никому не разрешалось входить."
10047030-45 = "Её называли «Безымянной колокольней», потому что настоящее имя было утрачено. Но пророчество сохранилось."
10047030-46 = "Оно звучит так... «В Судный день колокол поёт один!»"
10047030-47 = "Марширующая армия призраков практически указывает на обречённую колокольню! Это же не может быть совпадением?"
10047030-48 = "[s] «Может быть...?»"
10047030-49 = "И это ещё не всё! Согласно древнему фольклору, если соединить главные сооружения Вайлдханта, получится магический круг!"
10047030-50 = "Именно. Как магический глиф, Мастер. И если завершить эту фигуру при свете полной луны, случится настоящая магия!"
10047030-51 = "[s] «Ух ты...!»"
10047030-52 = "Правда?! Оккультизм повсюду! А ещё у нас есть статуя, плачущая кровью, портрет, который поворачивает голову, и пианино, играющее само."
10047030-53 = "Даже в этой галерее есть статуя демона, которая двигается самостоятельно!"
10047030-54 = "Как можно смотреть на всю эту магию и не прийти к выводу, что искусство и оккультизм переплетены?"
10047030-55 = "...Чем больше она говорит, тем больше всё это похоже на городские легенды..."
10047030-56 = "Хи-хи. У Эри всегда самые крутые истории."
10047030-57 = "...Погодите, кто-то идёт."
10047030-58 = ""
10047030-60 = ""
10047030-63 = ""
10047030-64 = "О? Эри. Привет, Эри!"
10047030-65 = "Хия!"
10047030-66 = "Ч-Что...?"
10047030-67 = "Хм? А кто твой друг? Кажется, мы не знакомы."
10047030-68 = "Э-Э-Это Сенсей из Шале!"
10047030-69 = ""
10047030-71 = ""
10047030-72 = ""
10047030-73 = "[ns] «Здравствуйте, все.»"
10047030-74 = ""
10047030-75 = "Добро пожаловать, Сенсей. Полагаю, Эри устраивает вам большую экскурсию по галерее."
10047030-76 = "И привет, очаровательные соседки Эри!"
10047030-77 = ""
10047030-79 = ""
10047030-80 = ""
10047030-81 = "Жаль пропускать всё веселье. Эй, Эри, почему ты никогда не тусуешься с НАМИ вот так?"
10047030-82 = "А...! Эм, э-это не специально...!"
10047030-83 = "Ха, я знаю. Просто пошутила."
10047030-84 = "Но нам и правда стоит как-нибудь что-нибудь сделать вместе. Немного грустно, что мы разговариваем только на занятиях."
10047030-85 = "А-А... Ну, эм... Что мне сказать?"
10047030-86 = ""
10047030-88 = ""
10047030-89 = ""
10047030-90 = "А...! Мне нужно посоветоваться с Арканой!"
10047030-91 = ""
10047030-93 = ""
10047030-94 = "Ахаха... О, думаю, гадание на Таро оставим на следующий раз, Эри."
10047030-95 = "У нас полно дел! До встречи!"
10047030-96 = "Давайте как-нибудь... выпьем чаю или что-то такое. Будет весело."
10047030-97 = "К-Конечно! Я-я-я буду ждать с нетерпением!!"
10047030-98 = ""
10047030-100 = ""
10047030-101 = ""
10047030-102 = ""
10047030-103 = "[ns1] «Хм...»\n[ns2] «У вас троих какие-то проблемы?»"
10047030-106 = "Н-Нет! Всё нормально!"
10047030-107 = "Все милые, добрые, нормальные и талантливые... Это я-я..."
10047030-108 = ""
10047030-110 = ""
10047030-111 = "А, ахахахаха! М-Мы можем обсудить это позже..."
10047030-112 = "[ns] «(Похоже, тут есть своя история. Лучше не лезть.)»"
10047030-113 = "Ахаха... Простите, это моя вина."
10047030-114 = ""
10047030-116 = ""
10047030-117 = "...Тогда давайте покажем Сенсею... то самое. Хи-хи."
10047030-118 = "...А, ты имеешь в виду... то самое. Да."
10047030-119 = ""
10047030-121 = ""
10047030-122 = "Нет, только не снова! Это уже слишком! Не надо."
10047030-123 = "[ns] «Что вы собираетесь делать?»"
10047030-124 = "Узнаете... когда мы это сделаем..."
10047030-125 = ""
10047030-127 = ""
10047030-128 = ""
10047030-129 = "Начнём. Все. И вы тоже, Сенсей... Следуйте за нами."
10047030-130 = "А, да...!"
10047030-136 = "...Мы прибыли."
10047030-137 = "[ns] «Хм? Разве это не то же место, что и раньше?»"
10047030-138 = "На вид то же место, но мы вошли в другое измерение."
10047030-139 = "Мы... только что вместе провели ритуал."
10047030-140 = "Мы очертили круг, обойдя художественную галерею. Это был наш собственный магический круг, который наложил небольшой..."
10047030-141 = "[s] «Наложил что...?»"
10047030-142 = "...Наложил заклинание для разговора с демоном!"
10047030-143 = ""
10047030-146 = "Вайлдхант создал эту статую в подарок Тринити много лет назад. Подобно горгулье, она защищает и должна отпугивать других, куда более страшных демонов."
10047030-147 = "Она веками охраняла вершину Собора Тринити, но затем её вернули нам, чтобы мы могли чтить наше культурное наследие."
10047030-148 = "Наши голоса непременно пробудят такого исторического, магического демона!"
10047030-149 = "Хи-хи... Муги, веди нас."
10047030-150 = "Да. Я вступлю в контакт с демоном!"
10047030-151 = ""
10047030-153 = ""
10047030-154 = ""
10047030-155 = ""
10047030-158 = "Я. ТЕРРОРИСТ ИСКУССТВА!!!"
10047030-159 = "Я ПОКОРИЛА ДРЕВНИЕ КРАСКИ И ЗАВОЮЮ ВСЕ КНИГИ!!!"
10047030-160 = ""
10047030-163 = "УОООАААХ!!!"
10047030-165 = "Ого...! Дэт-металлический голос Цумуги такой крутой. Каждый раз пробирает."
10047030-166 = "Это правда достойно восхищения?"
10047030-167 = "[ns] «С-С демоном и правда можно разговаривать вот так?»"
10047030-168 = "Конечно! Смотрите сами."
10047030-169 = ""
10047030-172 = "Статуя двинулась!"
10047030-173 = "Хи-хи... Мы и пальцем не пошевелили."
10047030-174 = "Я знала! Демоны ДЕЙСТВИТЕЛЬНО существуют!"
10047030-175 = "Д-Да, замечательно. Валим отсюда!"
10047030-176 = "Ты же понимаешь, оставаться опасно!"
10047030-177 = "Понятно. Если мы останемся, нас атакует Проклятый, призванный статуей демона!"
10047030-178 = ""
10047030-180 = ""
10047030-181 = "[ns] «Проклятый»...?"
10047030-182 = ""
10047030-183 = "Да. Веселиться хорошо, но нужно знать, когда пора отступать."
10047030-184 = "Все, выдвигаемся."
10047030-185 = ""
10047030-187 = ""
10047030-188 = ""
10047030-189 = ""
10047030-190 = ""
10047030-191 = ""
10047030-192 = ""
10047030-193 = ""
10047030-195 = "Это произошло так внезапно, но статуя демона точно двигалась."
10047030-196 = "И я задумался... кто или ЧТО это за «Проклятый»?"
10047030-197 = ""
10047030-200 = "[ns] «Что вообще происходит в этой академии...?»"
