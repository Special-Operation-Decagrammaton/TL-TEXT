1600206-101 = "Котори внезапно выбежала из аудитории и больше не вернулась."
1600206-102 = "Позже мне всё же пришло сообщение в MomoTalk: она пообещала «подготовить приемлемый ответ и прислать отчёт»."
1600206-103 = "...Срок готовности отчёта был указан как «неопределённый»."
