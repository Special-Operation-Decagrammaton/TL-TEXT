[translation]
1600206-1 = "Полная готовность"
1600206-2 = "Moments later, I arrived at the Millennium Student Lounge, but the classroom was empty."
1600206-3 = "Пустой, если не считать Котори, которая ждала меня с восторженной улыбкой."
1600206-4 = "Вы пришли, Сенсей! Я уже целый час вас жду, хи-хи!"
1600206-5 = "Почему я здесь одна? Погодите..."
1600206-6 = "Как странно! Клянусь, только что здесь было несколько человек."
1600206-7 = "Они меня кое о чём спросили, и я ответила! Но после этого почему-то все вдруг убежали."
1600206-8 = "[s1] «......»\n[s2] «Понятно. Теперь всё сходится.»"
1600206-9 = "Что-то не так, Сенсей? Вы знаете, куда они ушли?"
1600206-10 = "Что-то не так, Сенсей? Вы знаете, куда они ушли?"
1600206-11 = "Ха-ха-ха! Впрочем, неважно. Сегодня всё внимание — Сенсею!"
1600206-12 = "Можете поверить? Я просто потрясена! Никогда не думала, что мне так повезёт."
1600206-13 = "Сам Сенсей! Наш главный решатель проблем, единственный советник «Шале» и взрослый человек!"
1600206-14 = "И именно этот Сенсей пришёл с вопросом ко мне — из всех людей!"
1600206-15 = "Я сплю? Это альтернативная реальность? Величайшая честь всей моей жизни! Моё самое..."
1600206-16 = ""
1600206-18 = ""
1600206-19 = "...А!"
1600206-20 = "Кхм! Я немного увлеклась."
1600206-21 = "Вы пришли ко мне за помощью, а я тут всё болтаю и болтаю. Ох, Котори! Как невежливо с моей стороны."
1600206-22 = "В-в общем! Я хочу отплатить вам за всё, сколько раз вы мне помогали."
1600206-23 = "Поэтому я усердно готовилась! Хотите поговорить о физике? Пулемётах? Механике?"
1600206-24 = "Что бы вы ни спросили, у меня найдётся ответ!"
1600206-25 = "Итак, что выберете, Сенсей? Какую тайну мы раскроем вместе?"
1600206-26 = "Что за знак вопроса у Сенсея? Что это?!"
1600206-27 = "[s3] «...Какие у тебя увлечения, Котори?»\n[s4] «...Что тебе нравится, Котори?»"
1600206-28 = "Ага! Вот какой у вас вопрос! Проще простого!"
1600206-29 = "Ага! Вот какой у вас вопрос! Проще простого!"
1600206-30 = "Так вот, если говорить обо мне..."
1600206-31 = "Что касается меня..."
1600206-32 = "А-ха-ха... Н-ну конечно..."
1600206-33 = ""
1600206-35 = ""
1600206-36 = "...?"
1600206-37 = "Хмм...?"
1600206-38 = "А?"
1600206-41 = "― [log=코토리]Ч-Что...?![/log][wa:1280]"
1600206-43 = "― [log=코토리]Я совсем не такого вопроса ожидала![/log][wa:2520]"
1600206-46 = "― [log=코토리]Простите,[/log]"
1600206-48 = "― [log=코토리]но я всё ещё не совсем понимаю. Не могли бы вы повторить вопрос ещё раз?[/log][wa:10]"
1600206-51 = "[ns5] «Я сказал, что хочу узнать, чем живёт Котори.»\n[ns6] «Я ведь почти совсем тебя не знаю, Котори.»"
1600206-52 = "― [log=코토리]...Значит, я всё-таки услышала правильно. Эм... Ладно, тогда... Что-нибудь обо мне... [/log][wa:540]"
1600206-53 = "― [log=코토리]...Значит, я всё-таки услышала правильно. Эм... Ладно, тогда... Что-нибудь обо мне... [/log][wa:540]"
1600206-55 = "― [log=코토리]И что мне вообще отвечать...?[/log][wa:840]"
1600206-58 = "― [log=코토리]И-и чем обусловлена такая линия вопросов?[/log][wa:1600]"
1600206-60 = "― [log=코토리]Я не могу понять логику![/log][wa:840]"
1600206-63 = "― [log=코토리]Ой, э-эм, не то чтобы вам обязательно нужна была какая-то причина![/log][wa:900]"
1600206-65 = "― [log=코토리]...А? К-конечно, я могу ответить! Рассказать о себе должно быть легко...[/log][wa:10]"
1600206-68 = "― [log=코토리]Т-так, что-нибудь, что-нибудь обо мне?! [/log][wa:1340]"
1600206-71 = "― [log=코토리]В свободное время я люблю... Эм... Ну...! Я люблю исследования! И узнавать новое! [/log][wa:680]"
1600206-73 = "― [log=코토리]И думать о вас, и...![/log][wa:660]"
1600206-76 = "― [log=코토리]...? Стоп. Ч-Что я только что сказала...?[/log][wa:7100]"
1600206-78 = "― [log=코토리]Что я люблю узнавать новое и думать о вас...?[/log][wa:5300]"
1600206-81 = "― [log=코토리]Ага. А, ха-ха-ха...[/log][wa:1540]"
1600206-83 = "― [log=코토리]Я хотела сказать...! То есть, эм-м...![/log][wa:2280]"
1600206-86 = "УГХ! Э-э... А-а-а...!"
1600206-87 = "[s7] «Котори?»\n[s8] «Ты в порядке?»"
1600206-88 = "Я-я, ну, то есть, э-э..."
1600206-89 = "Я-я, ну, то есть, э-э..."
1600206-90 = "...Э..."
1600206-91 = "[s] «Э?»"
1600206-92 = "Э..."
1600206-93 = "[s] «Э...?"
1600206-94 = "ИЗВИНИТЕЕЕЕЕ МЕНЯЯЯЯ!!!"
