[translation]
1011303-1 = "Хобби 2"
1011303-2 = "Здравствуйте, Сенсей. Я вас ждала."
1011303-3 = "[s] «А я думал, что в этот раз пришёл довольно рано!»"
1011303-4 = "О, так и есть. Просто я случайно пришла на 27 минут раньше вас."
1011303-5 = "Я уже упоминала, но сегодня у меня выходной."
1011303-6 = "[s1] «Кстати, у меня был вопрос.»\n[s2] «Почему в свой выходной ты идёшь на работу в повседневной одежде?»"
1011303-9 = "Мм."
1011303-10 = "Для начала пойдём. По дороге всё объясню."
1011303-12 = "Я иду в Клуб скорой медицинской помощи, чтобы разобрать лекарства."
1011303-13 = "Наша работа бывает очень суматошной. Иногда мы не успеваем выполнять обычные обязанности. Сортировать документы, вести журналы..."
1011303-14 = "...и, конечно, поддерживать порядок среди лекарств."
1011303-15 = "[s] «То есть в свой выходной ты идёшь работать сверхурочно?»"
1011303-16 = "...Некоторые могли бы посмотреть на это именно так."
1011303-17 = "Вы спрашиваете, почему я не в форме?"
1011303-18 = "Проще говоря, форма слишком давила бы на остальных членов клуба."
1011303-19 = "Как вы знаете, я президент Клуба скорой медицинской помощи."
1011303-20 = "Если бы стало известно, что я пришла сюда в форме даже в официальный выходной..."
1011303-21 = "...остальные члены клуба не смогли бы спокойно отдыхать, не думая, что и им следовало бы быть здесь."
1011303-22 = "Разумеется, это не значит, что нам стоит терять бдительность — на дежурстве или вне его."
1011303-23 = "[s] «А... Полагаю, из-за „тел“?»"
1011303-24 = "Верно. Никогда не знаешь, когда можешь споткнуться об одно из них. Или когда кто-нибудь получит травму."
1011303-25 = "Конечно, настоящие трупы в Кивотосе встречаются нечасто, поэтому увидеть один... то есть найти пострадавшего..."
1011303-26 = "...может оказаться не настолько тяжело, как вы представляете, Сенсей."
1011303-27 = "Хотя, справедливости ради, прийти в клубную комнату в повседневной одежде в свой выходной само по себе тоже может быть проблемой."
1011303-28 = "Но сортировать лекарства — моё ХОББИ, и в клубе это знают, так что я всего лишь наслаждаюсь занятием в свободное время."
1011303-29 = "[s] «То есть всё сводится к разнице в одежде.»"
1011303-30 = "На это я отвечу..."
1011303-31 = "...одно и то же занятие в другой одежде и с другим настроем может производить совершенно иное впечатление."
1011303-32 = "Но, конечно, вы и сами это знаете. Вы взрослый."
1011303-33 = "[s3] «Знаю, и сам иногда работаю в повседневной одежде.»\n[s4] «Но ты студент. Не стоит СЛИШКОМ себя загонять.»"
1011303-36 = "..."
1011303-37 = "Значит, вы переживаете обо мне. Что ж, спасибо. Мне приятно."
1011303-38 = "Мы пришли. Клуб скорой медицинской помощи здесь."
1011303-40 = "Прошу прощения, если эти стулья немного неудобные."
1011303-41 = "Вы не против? Спасибо. Вы очень добрый человек, знаете ли."
1011303-42 = "...Почему такое лицо? Я сказала что-то не то?"
1011303-43 = "Я была слишком... прямолинейна? Что ж, я просто сказала то, что чувствую, но не хотела создавать неловкость, поэтому прошу прощения."
1011303-44 = "А, дело не в этом? Хорошо, я рада."
1011303-45 = "Разобрать всё это много времени не займёт. Если вы не против немного подождать, я буду благодарна."
1011303-46 = "[s] «Как сортировка лекарств вообще стала твоим хобби?»"
1011303-47 = "..."
1011303-48 = "В основном я просто нахожу это успокаивающим."
1011303-49 = "Некоторые в качестве хобби собирают пластиковые модели."
1011303-50 = "Кто-то увлекается работой по дереву или металлу."
1011303-51 = "Стороннему наблюдателю может показаться, что человек только сильнее себя нагружает..."
1011303-52 = "...усердно занимаясь хобби, хотя мог бы просто отдохнуть."
1011303-53 = "Но зачастую это не так. Добровольная повторяющаяся работа способна успокаивать."
1011303-54 = "А если эта повторяющаяся работа ещё и связана с тем, чем я обычно занимаюсь, тем лучше. По крайней мере, я так думаю."
1011303-55 = "[s] «Значит, тебе приятно сортировать лекарства, Сэна.»"
1011303-56 = "Да. По крайней мере, мне."
1011303-57 = ""
1011303-59 = ""
1011303-60 = "И, как я только что выяснила, когда вы рядом, мне это нравится ещё больше."
1011303-61 = "[s] «В-вот как...?»"
1011303-62 = "Если быть ещё честнее, когда я привела вас сюда, я притворилась, будто не смогла отказать вашей просьбе."
1011303-63 = ""
1011303-65 = ""
1011303-66 = "Разумеется, это тоже был мой собственный выбор."
1011303-67 = "...Мне не нравится использовать неточные выражения, но, кажется, сейчас придётся."
1011303-68 = "Чтобы объяснить моё эмоциональное состояние..."
1011303-69 = "...в целом, думаю, сейчас я веду себя упрямо или избалованно."
1011303-70 = "Я знаю, что вам не нравится переставлять бутылочки или смотреть, как этим занимается кто-то другой."
1011303-71 = "Так что, возможно, мне не стоило тащить вас сюда ради этого."
1011303-72 = "[s5] «Не переживай об этом.»\n[s6] «Мне нравится проводить с тобой время, Сэна.»"
1011303-75 = "Серьёзно?"
1011303-76 = "Что ж, тогда, если всё в порядке, я просто позволю себе насладиться этим моментом."
1011303-77 = "Пока я говорила, мне стало интересно, насколько сегодняшнее занятие вообще меня расслабляет."
1011303-78 = "Или я просто «вознаграждаю» себя за то, что раньше послушала вас."
1011303-79 = "Но я смогла провести с вами время и показать другую сторону себя."
1011303-80 = "Если это награда — пусть так."
1011303-81 = "[s] «Вот как?»"
1011303-82 = "Да, именно так."
1011303-83 = "Иными словами, я очень вам благодарна, Сенсей."
1011303-85 = "Я дождался, пока Сэна закончит своё «хобби». Затем мы вместе пошли обедать."
