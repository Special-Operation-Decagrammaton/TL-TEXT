[translation]
2000920-1 = "Помощник для купания"
2000920-3 = "Черино вызвала меня, и я отправился на курорт с горячими источниками, где она остановилась."
2000920-6 = "А у входа меня встретило..."
2000920-7 = "Добро пожаловать, товарищ!"
2000920-8 = "И... эм... Посмотри сюда."
2000920-9 = ""
2000920-11 = ""
2000920-12 = ""
2000920-13 = "[ns] «Это... игрушечная уточка?»"
2000920-14 = "Игрушечная уточка?! Как ты можешь! У неё есть официальное название!"
2000920-15 = "Она называется резиновая уточка!"
2000920-16 = "[s] «Так... Почему у неё усы?»"
2000920-17 = "Эм-м, ну... Это довольно долгая история..."
2000920-23 = "...И вот в чём вся история."
2000920-24 = "[s1] «В Академии Красной Зимы, где всё записывают от руки, произошла компьютерная ошибка...»\n[s2] «И Секретариат застрял с огромным запасом резиновых уточек...»"
2000920-25 = "Томоэ остановила меня как раз тогда, когда я собиралась устроить чистку в Бюро информатики. Она сказала, что эта резиновая уточка такая же милая, как я."
2000920-26 = "Томоэ остановила меня как раз тогда, когда я собиралась устроить чистку в Бюро информатики. Она сказала, что эта резиновая уточка такая же милая, как я."
2000920-27 = "...Я-Я хотела сказать, такая же величественная, как я, конечно. И предложила приклеить ей усы и превратить в сувенир."
2000920-28 = "Каким-то образом она стала довольно популярной! Продажи оказались достаточными, чтобы компенсировать весь ущерб от компьютерного предательства. Но..."
2000920-29 = "[s] «Тебя что-то не устраивает?»"
2000920-30 = "Эм... Просто..."
2000920-31 = "Эта резиновая уточка только плавает туда-сюда! И всё! Я начала сомневаться... Разве она действительно достойна усов? Всё-таки это символ власти."
2000920-32 = "[s] «Она милая, так что... наверное, всё нормально?»"
2000920-33 = "Одной милоты недостаточно! Усы Красной Зимы не выдают кому попало!"
2000920-34 = "Это символ власти, заслуженный опытом. Считай их медалью, которой награждают старейшин, всю жизнь оттачивавших своё мастерство."
2000920-35 = "Да это практически и есть медаль!"
2000920-36 = "Поэтому отдавать эти усы такой глупо выглядящей утке... неприемлемо! Даже если она и помогает финансам Красной Зимы!"
2000920-37 = "[s3] «Ладно-ладно. Успокойся.»\n[s4] «Если тебя это так беспокоит, почему бы не принять с ней ванну? Проверь сама.»"
2000920-38 = ""
2000920-39 = ""
2000920-41 = ""
2000920-42 = "Хм-м... Не похоже, что это решит проблему..."
2000920-43 = "Но раз ты предложил, пожалуй, стоит попробовать."
2000920-44 = "Хорошо, так и сделаю. Но если я не найду в этой резиновой уточке никаких достоинств..."
2000920-45 = ""
2000920-47 = ""
2000920-48 = "Я устрою чистку всех до единой резиновых уточек вместе со студентами Бюро информатики!"
2000920-52 = "*вздыхает*"
2000920-53 = "В последнее время я всё больше учусь наслаждаться горячими источниками."
2000920-54 = "Просто погрузиться в воду... Понимая, что можно спокойно забыть о тяжёлой рабочей нагрузке..."
2000920-55 = "Но какую ценность может добавить к горячему источнику резиновая уточка?"
2000920-56 = "..."
2000920-57 = ""
2000920-59 = ""
2000920-60 = ""
2000920-61 = "Шлёп-шлёп... Кач-кач..."
2000920-62 = ""
2000920-64 = ""
2000920-65 = ""
2000920-66 = "Хм..."
2000920-67 = "Эй, резиновая уточка. Чего так качаешься?"
2000920-68 = "Похоже, у тебя закружилась голова. Ты в порядке?"
2000920-69 = ""
2000920-71 = ""
2000920-72 = ""
2000920-73 = "О? Говоришь, с помощью усов — символа моей власти и чести — ты сможешь это преодолеть?"
2000920-74 = "Хи-хи-хи."
2000920-76 = "Мне нравится твоя храбрость! Уточка, настоящим я награждаю тебя Бронзовой медалью доблести!"
2000920-77 = ""
2000920-80 = "[ns] «Ну как тебе резиновая уточка?»"
2000920-81 = ""
2000920-83 = ""
2000920-84 = "Ч-Что вы делаете, товарищ?!"
2000920-85 = "Если кто-то принимает ванну, нужно стучать перед входом!"
2000920-86 = "[s5] «Прости, я не хотел мешать.»\n[s6] «Мне показалось, что тебе весело...»"
2000920-87 = "Весело? С резиновой уточкой?"
2000920-88 = "Весело? С резиновой уточкой?"
2000920-89 = "Ну пожалуйста! Я не ребёнок!"
2000920-90 = "Не то чтобы я сидела здесь, разговаривала с этой усатой резиновой уточкой и хихикала!"
2000920-91 = "[s7] «Ладно! Я понял!»\n[s8] «(Не стоит говорить ей, что я всё видел...)»"
2000920-92 = "Но эта резиновая уточка... в конце концов, не так уж плоха."
2000920-93 = "Но эта резиновая уточка... в конце концов, не так уж плоха."
2000920-94 = "Всё-таки ей хватает храбрости помогать мне во время купания."
2000920-95 = ""
2000920-97 = ""
2000920-98 = ""
2000920-99 = "Я решила! Настоящим присваиваю этой резиновой уточке должность Помощника по купанию!"
2000920-100 = "Отныне Помощник по купанию всегда будет помогать мне принимать ванну!"
2000920-101 = "Пожалуй, на этот раз я закрою глаза на ошибку Бюро информатики."
