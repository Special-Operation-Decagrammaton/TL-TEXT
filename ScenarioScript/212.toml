[translation]
212-1 = "Гебура, Правитель безрассудства"
212-2 = "Мм. Ммм..."
212-3 = "А, Сенсей. Добро пожаловать. Я сейчас немного занята..."
212-4 = "Что? Я выгляжу занятой «не как обычно»? Я всегда завалена мелкими раздражающими задачами, вы же знаете!"
212-5 = "Но сейчас чрезвычайная ситуация, и работу нельзя отложить... Поэтому я изучала железнодорожные карты по всему Кивотос."
212-6 = "Почему я так спешу? Эм, у меня нет времени расслабляться и болтать с вами об этом, Сенсей..."
212-7 = "Стойте, а может, вы поможете решить проблему..."
212-8 = "Возможно, вы и так знаете, но большая часть логистики Кивотос зависит от морских перевозок."
212-9 = "Проще говоря, корабли способны перевозить в десятки раз больше, чем поезда."
212-10 = "Через Ледниковое море проходит полярный морской маршрут. Для Кивотос он очень важен, потому что гораздо быстрее остальных."
212-11 = "Но недавно возле этого маршрута появился загадочный гигантский автоматон."
212-12 = "Как можно представить, из-за этого начались всевозможные задержки грузов."
212-13 = "Как глава Транспортного отдела, я в любом случае обязана с этим разобраться, но есть проблема посерьёзнее..."
212-14 = "Из-за него возник дефицит икры минтая, и мои любимые чипсы со вкусом икры минтая могут снять с производства!"
212-15 = "Чего вы на меня так смотрите? Думаете, это мелочь? Ничего подобного, это важно!"
212-16 = "Я и дня не могу без этих чипсов. Проявите хоть немного сочувствия, Сенсей."
212-17 = "Поэтому мы обязаны восстановить полярный маршрут, даже если придётся задействовать всю мощь Шале и Генерального студенческого совета."
212-18 = "Я пока займусь перенаправлением поездов, а вас, Сенсей, прошу разобраться с той машиной в полярном регионе."
212-19 = "Очевидно, на севере будет холодно, так что возьмите обогреватель или что-нибудь такое. Наверняка поможет."
212-20 = "А. Вспомнила: до того, как связь оборвалась, мы получили сообщение от грузового судна. Может, пригодится..."
212-21 = "«Его имя — Гебура, Правитель безрассудства»."
212-22 = "...Не знаю, что именно он там «правит» — по-моему, скорее «вломился на чужую территорию», но имеем что имеем."
212-23 = "В общем, надеюсь, вы разберётесь побыстрее. У меня осталось всего 3 коробки чипсов с икрой минтая."
