[translation]
10035005-57 = "#video;10035"
10035005-1 = "Пролог"
10035005-4 = "Извините!"
10035005-5 = "Сотрудницы Кирино и Фубуки из Бюро общественной безопасности прибыли в Бюро общественного порядка по служебному делу!"
10035005-6 = "Разрешите войти!"
10035005-7 = "Почему ты так нервничаешь?"
10035005-8 = "Мы все учимся в одной школе. Просто зайдём. Всем будет всё равно."
10035005-9 = "Н-Но разве по стандартной процедуре не нужно отметиться, когда входишь в другой секретариат?"
10035005-10 = "Почему вы стоите в дверях?"
10035005-11 = "Вы мешаете. Либо заходите, либо нет."
10035005-12 = "О! Директор Бюро общественного порядка Канна, мэм!"
10035005-13 = "Легка на помине."
10035005-14 = "Как раз вас мы и хотели увидеть, директор."
10035005-15 = "О, у вас ко мне дело?"
10035005-16 = "Ну, что такое?"
10035005-17 = "А, я хотела кое-что спросить!"
10035005-18 = "Я первая! Когда ты купишь мне тот лимитированный пончик из Master Donut, который обещала?"
10035005-19 = "Э-Эй, не говори это так!"
10035005-20 = "«Когда ты купишь мне...» Да ладно тебе, Фубуки!"
10035005-21 = "Так я ведь ради этого сюда и пришла!"
10035005-22 = "Ты же недавно уже ела пончики!"
10035005-23 = "...У меня нет времени на этот бред."
10035005-24 = "Куплю тебе пончик как-нибудь на следующей неделе."
10035005-25 = "Погоди! Я вообще-то пришла по служебному делу!"
10035005-26 = "У нас запрос на поддержку!"
10035005-27 = "Запрос на поддержку?"
10035005-28 = "Там перестрелка? Я никаких сообщений об этом не получала."
10035005-29 = "О нет, дело не в боевых действиях. Нам нужны сотрудники для обеспечения безопасности!"
10035005-30 = "Кхм, как вы, возможно, знаете, директор, аквапарк «Эгир» вот-вот откроется к самому разгару летнего сезона."
10035005-31 = "Но у них не хватает спасателей."
10035005-32 = "Если Полицейская школа «Валькирия» предоставит дополнительных спасателей, парк предлагает бесплатные пропуска."
10035005-34 = "Спасатели, значит...?"
10035005-35 = "То есть частная компания хочет, чтобы наши кадеты подрабатывали у них сотрудниками."
10035005-36 = "Но если они уже сейчас не могут обеспечить безопасность, почему бы им просто не перенести торжественное открытие?"
10035005-37 = "Ну, сами понимаете... сроки, контракты, закулисные договорённости..."
10035005-38 = "Но ведь для нас это тоже может быть полезно, не думаете?"
10035005-39 = "Обычно мы либо патрулируем под палящим солнцем, либо тонем в бумагах, либо разбираемся со злобными жалобами..."
10035005-40 = "Мы были настолько заняты, что даже подумать об аквапарке не успевали."
10035005-41 = "А что, если бы мы могли окунуть ноги в прохладный освежающий бассейн, лечь на круг и покачиваться на волнах...?"
10035005-42 = "Иногда всем нам нужны такие дни, правда?"
10035005-43 = "...Ты сейчас про задание или про отпуск?"
10035005-44 = "Ну, если это официальный рабочий приказ, я не против."
10035005-45 = "Но почему ты пришла с этим ко мне?"
10035005-46 = "Мы с тобой вообще из разных отделов."
10035005-47 = "Если тебе нужно одобрение на отправку сотрудников, разве не к директору Бюро общественной безопасности надо идти?"
10035005-48 = "Ну..."
10035005-49 = "Его уже одобрили."
10035005-50 = "Тогда причин приходить ко мне ЕЩЁ меньше."
10035005-51 = "Нет, простите, директор, я неясно выразилась..."
10035005-52 = "Я здесь потому, что вы входите в состав отправляемой группы."
10035005-53 = ""
10035005-55 = ""
10035005-56 = "...Что?"