[translation]
2004802-1 = "Тайный звонок"
2004802-2 = "По её просьбе я постарался как можно незаметнее добраться до палатки Нагисы."
2004802-4 = "Частный пляж"
2004802-5 = ""
2004802-6 = "...А. Вы пришли, Сенсей."
2004802-7 = "И вас ведь никто не заметил, верно?"
2004802-8 = "[s] «Я был как супершпион!»"
2004802-9 = "Я рада это слышать."
2004802-10 = "Я попросила вас прийти потому, что..."
2004802-11 = ""
2004802-13 = ""
2004802-14 = ""
2004802-15 = "...из-за этого."
2004802-17 = "С этими словами Нагиса положила на стол..."
2004802-18 = "...огромную стопку документов."
2004802-19 = ""
2004802-21 = ""
2004802-22 = "[ns] «...Что это всё такое?»"
2004802-23 = "Это срочные административные документы из Тринити."
2004802-24 = "Большую часть работы я оставила тем, кто остался в школе..."
2004802-25 = "...но некоторые вопросы требуют моего личного внимания."
2004802-26 = "Прошу прощения, но я надеялась, что вы сможете мне помочь."
2004802-27 = "Не слишком ли это, случайно, невежливая просьба?"
2004802-28 = "[s] «Вовсе нет!»"
2004802-29 = "Большое спасибо, Сенсей."
2004802-30 = "Тогда не могли бы вы для начала рассортировать эти документы?"
2004802-32 = "Работая вместе, мы с Нагисой очень быстро расправились с её делами."
2004802-34 = ""
2004802-35 = "С вашей помощью всё пошло гораздо быстрее обычного, Сенсей."
2004802-36 = "Наверное, это та мудрость, которую человек приобретает с возрастом..."
2004802-37 = "[s] «Скорее „мудрость“, приобретённая из-за переработок...»"
2004802-38 = "А-ха-ха. Похоже, у нас есть что-то общее, Сенсей."
2004802-39 = "[s] «Но почему ты не хотела, чтобы кто-то узнал, что я сюда пришёл?»"
2004802-40 = "А. Понимаю, почему вам стало любопытно."
2004802-41 = "Как вы прекрасно знаете, эта поездка на пляж должна была быть отпуском."
2004802-42 = "Временем, когда все оставляют работу позади и отдыхают."
2004802-43 = "Но сделать это трудно, когда рядом с тобой кто-то продолжает работать."
2004802-44 = "Если кто-то начнёт вспахивать поле, на котором вы лежите, разве у вас не появится желание помочь выдернуть хотя бы несколько сорняков?"
2004802-45 = "[s] «Понимаю. Не хочется быть единственным, кто не работает.»"
2004802-46 = "Именно. Поэтому я надеялась закончить всё до того, как остальные заметят."
2004802-47 = "Мне бы не хотелось мешать их отдыху."
2004802-48 = "Именно поэтому я попросила вас помочь как можно незаметнее."
2004802-49 = "[s] «Очень заботливо с твоей стороны, Нагиса.»"
2004802-50 = "Хи-хи. Считайте это обычной вежливостью."
2004802-51 = "Хотя, полагаю, на вас эта вежливость не распространилась, Сенсей."
2004802-52 = "Мне следует вознаградить вас за то, что позволили мне вторгнуться в ваш отпуск."
2004802-53 = "[s] «Награда...?»"
2004802-54 = ""
2004802-56 = ""
2004802-57 = "По счастливому совпадению, в моём холодильнике как раз есть лимитированный карамельный чизкейк. Думаю, на морском воздухе он покажется ещё слаще."
2004802-58 = ""
2004802-60 = ""
2004802-61 = ""
2004802-62 = "И чёрный чай оттуда отлично к нему подойдёт."
2004802-63 = ""
2004802-65 = ""
2004802-66 = ""
2004802-67 = "Не хотите разделить эту награду со мной?"
2004802-68 = "[s] «Конечно. Спасибо за угощение.»"
2004802-70 = "Мы с Нагисой устроили чаепитие с её карамельным чизкейком."
2004802-71 = "Может быть, потому что перед этим мы хорошо поработали, но сладость была в самый раз."
