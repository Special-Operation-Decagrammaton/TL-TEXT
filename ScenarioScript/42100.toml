[translation]
42100-1 = "Episódio 10;Fora de Controle"
42100-2 = "Gabinete da Presidente Interina do Conselho Estudantil Geral"
42100-5 = "Huhu, um café Blue Mountain depois de cumprir a rotina matinal tem um sabor realmente incomparável."
42100-6 = "Essa acidez suave e o aroma refrescante só se obtêm quando os grãos#nsão torrados em alta temperatura e moídos com pressão uniforme."
42100-7 = "...Com as pessoas é a mesma coisa. Se você baixa o fogo por medo de perder algo,#no sabor acaba ficando azedo, adstringente e cheio de impurezas."
42100-9 = "Por ora, alguns não conseguem se adaptar às mudanças e ficam fazendo barulho por aí...#nMas, com o tempo, os cidadãos de Kivotos também vão compreender."
42100-10 = "O quão doce é uma vida em que se abre mão da liberdade para se entregar à disciplina..."
42100-12 = "...Expulsar os apoiadores da Administradora Rin#ne garantir a cooperação da Kaiser Corporation em troca de ajustar suas punições.#n— Tudo está saindo conforme o planejado."
42100-13 = "Continuarei acumulando favores ao meu redor, e logo o posto de próxima Presidente do Conselho Estudantil Geral—"
42100-18 = "Chefe Kaya— digo, Presidente Interina do Conselho Estudantil Geral.#nPeço desculpas por interromper, mas tenho um relatório urgente."
42100-19 = "Vice-Chefe de Defesa, o que houve?"
42100-20 = "Se não for urgente, gostaria que deixasse para depois."
42100-21 = "Sinto muito... mas não podemos adiar a resposta por mais tempo..."
42100-22 = "Sei perfeitamente o quanto está ocupada, mas como a Administradora Rin#nestá ausente, preciso reportar isto agora..."
42100-23 = "...Fazer o quê. Diga logo, o que aconteceu?"
42100-24 = "Por volta das 11h da manhã, um trem de transporte de valores na Linha Central Hokuroku#nfoi sequestrado por assaltantes armados e está desaparecido."
42100-25 = "Pelo procedimento padrão, a Presidente Interina deve contatar o Gabinete de Trânsito#npara ativar o sistema de controle ferroviário de emergência#ne solicitar apoio aos distritos autônomos vizinhos..."
42100-26 = "Entendo. Um sequestro de trem cometido por assaltantes..."
42100-30 = "...Um sequestro de trem?!"
42100-31 = "Por que só está me reportando algo tão grave agora?!"
42100-32 = "S-Sim...?"
42100-33 = "Mas, Chefe, a senhora disse que não receberia nenhum relatório durante toda a manhã..."
42100-34 = "Além disso, sequestros de trem são ocorrências rotineiras que acontecem várias vezes por mês..."
42100-35 = "...Rotineiras? Quer dizer que a Administradora Rin lidava com esse tipo de coisa repetidas vezes no meio do expediente?"
42100-36 = "Sim, exatamente."
42100-37 = "Ah..."
42100-38 = "...Certo. Eu mesma entrarei em contato com o Gabinete de Trânsito."
42100-39 = "Vice-Chefe, coordene-se com as alunas da Academia de Polícia Valkyrie#npara bloquear as estações próximas, impedir a fuga e identificar os suspeitos."
42100-40 = "Bem, sobre isso..."
42100-41 = "...Ainda há mais alguma coisa?"
42100-43 = "A Diretora e as alunas do Departamento de Segurança Interna, que normalmente cuidavam disso,#nestão suspensas por insubordinação..."
42100-44 = "Além disso, devido às ordens administrativas que entraram em vigor hoje,#nquase todas as alunas do Departamento de Guarda estão fora nos postos de controle,#nentão não há efetivo disponível para responder ao sequestro."
42100-46 = "Chame quem estiver de folga ou as alunas do Departamento de Segurança Pública. Dê um jeito de reunir pessoal e manter a ordem. Não é esse o seu trabalho?"
42100-47 = "Se você não consegue cumprir nem o próprio dever#ne pretende manchar o nome do Conselho Estudantil Geral..."
42100-48 = "Qual será a sua posição quando o novo regime se estabilizar, hein?"
42100-49 = "V-Vou resolver isso imediatamente!"
42100-53 = "Ah... Quem diria que o trabalho de Presidente Interina era tão trabalhoso..."
42100-57 = "Gabinete de Trânsito, tem um momento?"
42100-58 = "Chefe Kaya? O que foi a essa hora?"
42100-59 = "Não é mais Chefe, e sim Presidente Interina do Conselho Estudantil Geral."
42100-60 = "Tanto faz, dá na mesma. Enfim, o que manda?#nMeu almoço já está chegando, então tenta ser rápida."
42100-61 = "...Este não é momento para falar de almoço."
42100-62 = "Acabei de receber um relatório da Vice-Chefe de Defesa.#nUm trem de transporte de valores foi sequestrado na Linha Central Hokuroku e está desaparecido."
42100-63 = "Ative imediatamente o sistema de controle ferroviário de emergência e solicite apoio aos distritos autônomos vizinhos."
42100-64 = "Humm..."
42100-65 = "...Que preguiça."
42100-66 = "C-Como é? O que você acabou de dizer...?"
42100-67 = "Ué, sequestro de trem não se resolve em cinco minutos, né?"
42100-68 = "Vai demorar mesmo, então pensei em almoçar primeiro e cuidar disso com calma depois~"
42100-69 = "...Você não faz ideia da gravidade da situação, não é?"
42100-70 = "Ou está pensando em fazer corpo mole?#nSe for o caso, não poderá reclamar se for detida por negligência no cumprimento do dever."
42100-71 = "Fique à vontade~#nSe eu puder ficar sem trabalhar, por mim é só alegria."
42100-72 = "Ah, só um aviso: reescrever do zero a malha ferroviária de Kivotos#né um baita de um trabalho."
42100-73 = "Se você demitir o pessoal do Gabinete de Trânsito agora,#nquem vai se dar muito mal é você, Chefe Kaya, huhu..."
42100-75 = "...Se está tentando me ameaçar, saiba que você—"
42100-79 = "Opa, meu almoço chegou!#nBom, depois eu te ligo, tá~"
42100-83 = "..."
42100-84 = "Ufa..."
42100-85 = "...Não se irrite com uma bobagem dessas, Kaya."
42100-86 = "Você é a representante de Kivotos.#nVocê será a próxima Presidente do Conselho Estudantil Geral, respeitada por todos."
42100-87 = "Acalme-se... Preciso manter a racionalidade e resolver os problemas um por um..."
42100-91 = "...E agora, o que é?"
42100-92 = "...Você parece bem tensa, Presidente Interina do Conselho Estudantil Geral."
42100-94 = "Ah... É você, Chefe do Gabinete de Finanças."
42100-95 = "Não se preocupe. Só estou um pouco cansada porque, logo no primeiro dia como interina,#num monte de problemas chatos caiu no meu colo."
42100-96 = "A Chefe do Gabinete de Finanças é uma pessoa sensata, então não vai me dar dor de cabeça, certo?"
42100-97 = "Isso... veremos."
42100-98 = "É sobre a \"Requisição de Despesas Adicionais Referentes à Aplicação das Novas Ordens Administrativas\"#nque a Presidente Interina enviou ao Gabinete de Finanças hoje de manhã..."
42100-99 = "Sim. São verbas necessárias para estruturar o novo regime, então conto com a sua colaboração."
42100-103 = "...Recusada. Na íntegra."
42100-105 = "O-O quê? Por quê?!"
42100-106 = "Ao revisar o documento, constatei que todos os valores discriminados foram escritos em algarismos arábicos."
42100-107 = "Por risco de falsificação ou erro de leitura,#nnão podemos processar requisições cujos valores não estejam escritos por extenso."
42100-108 = "Além disso, o carimbo está borrado e não dá para ler o nome direito."
42100-109 = "Desse jeito não conta como aprovação formal, portanto—"
42100-110 = "Refaça tudo do zero, por favor."
42100-111 = "Bem... hã... Chefe Aoi...?"
42100-112 = "Peço mil desculpas, mas no momento estou sobrecarregada com assuntos oficiais..."
42100-113 = "Não poderia abrir uma exceção só desta vez?#nQuanto aos pontos que você mencionou, eu corrijo depois—"
42100-115 = "Não."
42100-116 = "Não há exceções, nem mesmo para a Presidente Interina.#nA Administradora Rin sempre corrigia tudo pessoalmente."
42100-117 = "N-Não pode ser..."
42100-118 = "Preciso das correções ainda hoje. Caso contrário, vou desconsiderar a solicitação por completo."
42100-119 = "M-Mas agora..."
42100-124 = "Até depois de amanhã... Não pode esperar até depois de amanhã?"
42100-125 = "......Até amanhã. Nem um dia a mais."
42100-129 = "Sinceramente, parece que combinaram...!"
42100-130 = "Por que não há uma única pessoa decente por aqui?!"
42100-131 = "Afinal, onde foi parar o meu prestígio...?!"
42100-135 = "...Aconteceu algum problema?"
42100-136 = "...Não, não é nada.#nSão apenas questões triviais que nem deveriam exigir a minha intervenção."
42100-137 = "Eu só estava lamentando o fato de ter subordinadas#nincapazes de fazer o básico sem causar problemas."
42100-138 = "As únicas que agem exatamente como eu desejo são você e o seu esquadrão."
42100-139 = "...Executar operações conforme as ordens é o nosso trabalho."
42100-140 = "Uma arma só tem valor porque não toma decisões por conta própria."
42100-141 = "...Huhu, é por isso que eu gosto tanto de você."
42100-142 = "...A propósito."
42100-143 = "Quando poderemos voltar... para a Academia Especial SRT?"
42100-148 = "...Isso é realmente importante agora?"
42100-149 = "Não é, certo?#nAgora, a prioridade absoluta é elevar o índice de aprovação do Gabinete de Defesa e consolidar o poder."
42100-150 = "Assim que eu assumir o controle total do Conselho Estudantil Geral, posso construir quantas escolas novas quiser."
42100-151 = "Não se esqueça da ordem das prioridades."
42100-155 = "...Peço desculpas."
42100-156 = "Não precisa se preocupar.#nSou a única que realmente compreende o valor de vocês."
42100-157 = "Você só precisa continuar seguindo as minhas ordens."
42100-158 = "Pelo bem do seu esquadrão.#nE... pelo bem das suas queridas calouras."
42100-159 = "...Entendido."
42100-166 = "Presidente Interina, é uma emergência!"
42100-167 = "...Já aconteceu tanta coisa hoje que nem me surpreendo mais quando dizem que é uma emergência."
42100-168 = "O que foi desta vez?"
42100-169 = "É que..."
42100-170 = "A Chefe do Gabinete de Recursos Humanos foi atacada por suas subordinadas!"
42100-172 = "O-O quê...?!"
42100-174 = "(Algumas horas antes, em frente ao prédio do Conselho Estudantil Geral)"
42100-178 = "Excelente trabalho, pessoal!"
42100-179 = "Se a Presidente Interina foi destituída em tempo recorde,#nfoi graças a todas vocês que levantaram a voz!"
42100-180 = "Uhuuuul!!"
42100-181 = "Mesmo sendo da mesma academia que eu,#naceitarem conduzir um protesto de vários dias sem cobrar nada...#nVou dever esta para o resto da vida."
42100-184 = "Não esquenta. A luta contra a injustiça e a resistência ao poder são deveres básicos da classe trabalhadora."
42100-185 = "Se for protesto para denunciar os poderosos, estamos sempre dentro!"
42100-186 = "Huhu, digno das alunas de \"Red Winter\"."
42100-187 = "...A propósito, a Administradora Rin caiu mesmo?"
42100-188 = "Sim, com certeza."
42100-189 = "Diante dos nossos protestos, a Administradora Rin assumiu a responsabilidade pelo incidente e renunciou."
42100-191 = "...Então, quem está ocupando o cargo de Presidente Interina do Conselho Estudantil Geral agora?"
42100-192 = "Hm? Bem, Kaya Shiranui, Chefe do Gabinete de Defesa, foi nomeada como sucessora..."
42100-194 = "...Entendi. Sendo assim, a partir deste momento—"
42100-198 = "Iniciamos o protesto contra a Presidente Interina Kaya!"
42100-199 = "Iniciamos! Iniciamos!"
42100-200 = "O quê...?!#nPor que diabos vocês vão protestar contra a Presidente Interina Kaya também?!"
42100-201 = "Nosso alvo não era a Administradora Rin?!"
42100-202 = "...De fato, até pouco tempo atrás era.#nMas agora a Chefe de Defesa Kaya se tornou a maior autoridade de Kivotos, não foi?"
42100-203 = "Portanto—"
42100-204 = "A culpa de tudo é dela!"
42100-205 = "Assuma a responsabilidade! Assuma a responsabilidade!"
42100-206 = "M-Mas que absurdo vocês estão falando?! Vocês comeram alguma coisa estragada?!"
42100-207 = "A Chefe Kaya acabou de assumir como Presidente Interina!#nQue responsabilidade ela poderia ter?!"
42100-208 = "Os erros dos subordinados são culpa do chefe... Ou seja, a responsabilidade por todos os problemas de Kivotos recai sobre a Presidente Interina, Kaya Shiranui!"
42100-209 = "A semana de três dias de trabalho não existir em Kivotos, o frio absurdo dos últimos dias, o fato de não podermos comer dois pudins— é tudo culpa da Presidente Interina Kaya!"
42100-210 = "É isso aí! É isso aí!"
42100-212 = "Direitos para as trabalhadoras! Mais garantias já!"
42100-213 = "Direitos para as trabalhadoras! Mais garantias já!"
42100-215 = "Mas que... que revolucionárias mais sem noção!"
42100-216 = "O protesto já acabou, dispersem-se logo! O papel de vocês terminou!"
42100-217 = "Olhem só! O cão de guarda do poder maligno mostrou as garras!"
42100-218 = "Nem parece diferente da Presidente Cherino e da turma dela, né?"
42100-219 = "É por isso que não dá pra confiar em funcionária pública!"
42100-220 = "Não vamos parar de lutar até que todos os poderosos#ne capitalistas desapareçam desta terra!"
42100-225 = "N-Não cheguem perto!"
42100-226 = "Se derem mais um passo, a Chefe Kaya não vai deixar isso bar—"
42100-231 = "Uma ameaça mixuruca dessas não serve nem de bom-dia lá em Red Winter."
42100-233 = "Pessoal, todas prontas?"
42100-235 = "Pois então, a partir de agora—"
42100-237 = "Nós, do Departamento de Obras Públicas de Red Winter, declaramos o início de uma nova luta!"
42100-238 = "Uaaaaaaah—!"
42100-240 = "Próximo;Café Preto"
