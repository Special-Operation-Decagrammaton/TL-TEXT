[translation]
42100-1 = "Эпизод 10;Выход из-под контроля"
42100-2 = "Кабинет временной председательницы Генерального студенческого совета"
42100-5 = "Ах, что-то есть в аромате бутылочки Blue Mountain после утренних тренировок."
42100-6 = "Процесс обжарки и помола зёрен кропотлив и интенсивен. Но именно он нужен, чтобы получить идеальный вкус: гармоничную смесь кислинки и свежести."
42100-7 = "...Почти как управление людьми. Если руководить нерешительно, боясь мнений и недовольства, во рту останется лишь горечь."
42100-9 = "Сейчас они ропщут, но со временем жители Кивотоса увидят."
42100-10 = "Они поймут, что свобода — небольшая цена за гармонию порядка."
42100-11 = ""
42100-12 = "...Сторонники главного администратора Рин устранены, сотрудничество Корпорация Кайзер обеспечено, всё идёт по плану. Дать им право назначать наказания было очевидной ценой за доступ к их влиянию и деньгам."
42100-13 = "Если продолжу понемногу накапливать власть, возможно, однажды стану следующей председательницей Генерального студенческого совета—"
42100-14 = ""
42100-17 = ""
42100-18 = "Эм, глава Кая— то есть временная председательница Генерального студенческого совета. Прошу прощения, у меня доклад."
42100-19 = "Докладывайте, заместитель главы обороны."
42100-20 = "Надеюсь, это важно. У меня слишком много дел для мелочей."
42100-21 = "Ну, дело в том... Обычно я докладывала бы Надзорному отделу..."
42100-22 = "Но главный администратор Рин... недоступна, поэтому пришла прямо к вам."
42100-23 = "...Тогда быстрее. Что случилось?"
42100-24 = "Сегодня в 11:00 вооружённые преступники захватили поезд с наличностью на центральной линии Хокуроку. Их текущее местоположение неизвестно."
42100-25 = "Согласно протоколу временная председательница должна связаться с Транспортным отделом, активировать систему экстренного реагирования и запросить помощь соседних районов."
42100-26 = "Да-да. Угон поезда, вооружённые грабители..."
42100-27 = ""
42100-29 = ""
42100-30 = "Погодите, поезд угнали?"
42100-31 = "Почему я слышу об этом только сейчас?"
42100-32 = "А-А?"
42100-33 = "Но... угоны в Кивотосе почти рутина... Уже почти ежемесячная традиция."
42100-34 = "А утром вы очень подчёркнуто приказали не приносить доклады, поэтому..."
42100-35 = "Рутина, говоришь? И главный администратор Рин занималась этими угонами помимо всех остальных обязанностей."
42100-36 = "Да, верно."
42100-37 = "*вздыхает*"
42100-38 = "...Ладно. Я займусь транспортом."
42100-39 = "Скоординируйтесь с Полицейской школой Валькирии, установите личности преступников и перекройте возможные пути отхода. Начните со станций."
42100-40 = "Эм, есть небольшая проблема..."
42100-41 = "Что? Что ещё?!"
42100-43 = "Директор Бюро общественного порядка и все её сотрудники, которые обычно этим занимаются, всё ещё на испытательном сроке. Их наказали за неподчинение приказам..."
42100-44 = "Из-за вступления исполнительного указа в силу большинство студентов Бюро безопасности сейчас проводят проверки оружия. Так что, эм, реагировать некому."
42100-45 = ""
42100-46 = "Тогда соберите любых свободных офицеров или членов Бюро общественной безопасности. Разве восстановление порядка не ваша обязанность?"
42100-47 = "Если вы подведёте новый совет..."
42100-48 = "Мне останется лишь задуматься, какую новую должность вы, заместитель главы обороны, займёте после того, как всё уляжется."
42100-49 = "Я-я немедленно займусь!"
42100-50 = ""
42100-53 = "*вздох* ...Не ожидала, что быть председательницей настолько выматывает..."
42100-54 = ""
42100-56 = ""
42100-57 = "Алло? Транспортный отдел?"
42100-58 = "А? Глава Кая? Что вам нужно?"
42100-59 = "Моя должность — временная председательница Генерального студенческого совета, а не глава отдела."
42100-60 = "Хочешь, чтобы я каждый раз так тебя называла? Пока договорю, мой обед уже привезут и он успеет остыть. А его, кстати, скоро доставят, так что я занята."
42100-61 = "Есть дела поважнее твоего обеда."
42100-62 = "Заместитель главы Оборонного отдела доложила об угоне поезда, перевозившего наличные, на Центральной линии Хокуроку."
42100-63 = "Мне нужно, чтобы ты активировала аварийную систему и направила сотрудников. Организуй поиск и возврат поезда, а затем доложи мне."
42100-64 = "Ну..."
42100-65 = "Эм. Думаю, я пас."
42100-66 = "Что, простите?!"
42100-67 = "Угон поезда — это не то дело, которое решается по щелчку пальцев."
42100-68 = "Это будет долгая и муторная возня. Займусь после обеда."
42100-69 = "Ты вообще понимаешь, насколько это срочно?"
42100-70 = "Если думаешь, что здесь сойдёт с рук такое наплевательское отношение, я арестую тебя за халатность и саботаж работы Генерального студенческого совета."
42100-71 = "Конечно, давай. По крайней мере, мне больше не придётся работать. Попросишь их принести мне чипсов?"
42100-72 = "Уф. Очень надеюсь, что тот, кто меня заменит, умеет читать и разбираться во всех этих схемах работы и прочем. Ну, удачи им, наверное!"
42100-73 = "Никто не знает, как устроена работа Кивотоса, лучше меня и моих сотрудников, Кая. Но если хочешь развалить мой отдел — вперёд. Уверена, это прекрасно для тебя закончится."
42100-75 = "Т-Ты пытаешься на меня давить?"
42100-76 = ""
42100-79 = "Мне как раз принесли обед. Бывай!"
42100-80 = ""
42100-82 = ""
42100-83 = "..."
42100-84 = "..."
42100-85 = "...Успокойся, Кая. Глубокий вдох."
42100-86 = "Ты лучшая в Кивотосе и будущая председательница Генерального студенческого совета."
42100-87 = "Сохраняй спокойствие и рассудительность. Решай проблемы по одной..."
42100-88 = ""
42100-91 = "Что?! Какая ещё проблема теперь требует решения?!"
42100-92 = "Вы выглядите напряжённой, временная председательница."
42100-94 = "А. Глава Финансового отдела."
42100-95 = "Просто в первый день на меня свалилась целая лавина проблем. Переходный период неизбежен."
42100-96 = "Ты человек разумный, так что надеюсь, пришла не для того, чтобы добавить мне забот?"
42100-97 = "Э-Эм... Ну..."
42100-98 = "Эм... Насчёт счёта «Расходы по новому исполнительному указу», который вы недавно подали..."
42100-99 = "Да, он необходим новому совету. Проведи его."
42100-100 = ""
42100-102 = ""
42100-103 = "...Отклонено."
42100-105 = "Что?! На каком основании?"
42100-106 = "Я лично его проверила, и все суммы в счёте записаны арабскими цифрами."
42100-107 = "По правилам мы не обрабатываем документы с не-китайскими цифрами, чтобы предотвращать мошенничество."
42100-108 = "Кроме того, печать с разрешением смазана и плохо читается."
42100-109 = "Если я не могу разобрать имя, я не могу его проверить. А если не могу проверить — не могу одобрить."
42100-110 = "Переподайте документ по установленной процедуре, когда вам будет удобно."
42100-111 = "П-Подожди. Аой...!"
42100-112 = "Аой. Я сейчас по уши завалена работой."
42100-113 = "Не могла бы ты всего один раз закрыть на это глаза? Обещаю, я тебе отпла—"
42100-115 = "Нет."
42100-116 = "Никаких исключений, независимо от должности. Даже главный администратор Рин сама исправляла свои ошибки."
42100-117 = "Но..."
42100-118 = "Исправления принимаются в тот же день. Если сегодня документ не будет исправлен, мне придётся отклонить его окончательно."
42100-119 = "А можно мне хотя бы небольшую отсрочку?"
42100-120 = ""
42100-122 = ""
42100-123 = ""
42100-124 = "...Хотя бы до завтра?"
42100-125 = "До завтра. Но ни минутой позже."
42100-126 = ""
42100-128 = ""
42100-129 = "Серьёзно? Сегодня что, все проснулись и решили специально усложнять мне жизнь?!"
42100-130 = "Почему я не могу найти хоть кого-нибудь компетентного? Ни одного человека!"
42100-131 = "Не верится, насколько мне не везёт с людьми!"
42100-132 = ""
42100-135 = "Проблемы?"
42100-136 = "Да, но всё пустяки. Их просто нужно правильно распределить."
42100-137 = "Просто некомпетентность каким-то образом умеет превращать даже мельчайшую проблему в гору."
42100-138 = "Похоже, отряд FOX — единственные мои подчинённые, способные выполнять приказы."
42100-139 = "...Потому что дисциплина и исполнение приказов — наша работа."
42100-140 = "А оружие бесполезно, если не способно выполнять своё предназначение."
42100-141 = "Вот за такой подход я тебя и ценю. Хи-хи..."
42100-142 = "...У меня есть вопрос."
42100-143 = "Когда... Когда вы собираетесь восстановить Академию SRT?"
42100-144 = ""
42100-146 = ""
42100-148 = "...Тебя сейчас действительно волнует именно это?"
42100-149 = "Сейчас нам нужно заручиться доверием Совета и укрепить власть."
42100-150 = "Когда Генеральный студенческий совет будет под моим контролем, я хоть десять новых SRT для тебя создам."
42100-151 = "Приоритеты, Юкино."
42100-152 = ""
42100-154 = ""
42100-155 = "Поняла. Прошу прощения."
42100-156 = "Всё в порядке. Помни: только я по-настоящему понимаю тебя и твою ценность."
42100-157 = "Доверься мне — и получишь то, чего хочешь."
42100-158 = "Выполняя мои приказы, ты единственным возможным способом сможешь дать своим товарищам по отряду и тем восторженным младшекурсницам то, в чём они нуждаются больше всего."
42100-159 = "...Понятно."
42100-160 = ""
42100-162 = ""
42100-166 = "...Временная председательница Генерального студенческого совета. У меня доклад."
42100-167 = "На этом этапе меня уже ничем не удивить."
42100-168 = "Ну, продолжай. Какой кризис на этот раз?"
42100-169 = "Это, эм..."
42100-170 = "Директора Отдела кадров атаковали её собственные подчинённые!"
42100-172 = "Ч-Ч-Что ты сказала?!"
42100-174 = "Несколькими часами ранее, возле здания Генерального студенческого совета."
42100-175 = ""
42100-178 = "Отличная работа, товарищи!"
42100-179 = "Столь быстрое смещение временной председательницы стало возможным благодаря каждому из вас! Мы объединились в один громкий голос — и наши требования наконец услышали!"
42100-180 = "Ура!"
42100-181 = "Прошло уже несколько дней... Пусть они и наши выпускницы, но они так самоотверженно протестуют, что мне даже немного неловко. Ты слышала, что они и правда отказались от оплаты?"
42100-182 = ""
42100-183 = ""
42100-184 = "Нечего их жалеть! Бороться с несправедливостью и властью — путь рабочего!"
42100-185 = "Мы можем протестовать хоть целый день, пока протест направлен против власть имущих!"
42100-186 = "Ха-ха. Видимо, «Красную Зиму» из студента уже не вытравить."
42100-187 = "Так главный администратор Рин правда ушла?"
42100-188 = "А? Это уже старые новости."
42100-189 = "Она не выдержала силы криков наших протестующих! Главный администратор Рин уже подала в отставку."
42100-190 = ""
42100-191 = "...Тогда кто теперь временная председательница Генерального студенческого совета?"
42100-192 = "Эм, кажется, теперь Ширануи Кая. Там всё немного запутанно, но вроде сказали, что прежняя председательница сама её выбрала или что-то такое."
42100-193 = ""
42100-194 = "А это значит..."
42100-195 = ""
42100-197 = ""
42100-198 = "Долой фальшивую председательницу Каю!"
42100-199 = "Долой! Долой! Самозванка! Самозванка!"
42100-200 = "Ч-Что?! Что вы сейчас скандируете?"
42100-201 = "Эй! Мы уже победили! Мы хотели убрать Рин, а не Каю!"
42100-202 = "Именно! Но Рин уже ушла!"
42100-203 = "Теперь Кая — временная председательница. Она представляет высшую власть во всём Кивотосе!"
42100-204 = "А значит... Теперь всё, что происходит в Кивотосе, — её вина!"
42100-205 = "Её вина! Её вина!"
42100-206 = "Я вообще не понимаю вашу логику!"
42100-207 = "Она стала временной председательницей только сегодня! Как она вообще может отвечать за состояние всего Кивотоса?"
42100-208 = "Руководители отвечают за ошибки своих подчинённых. Значит, любые проблемы в Кивотосе должны ложиться на плечи нынешней временной председательницы Генерального студенческого совета, то есть Ширануи Каи."
42100-209 = "Будь то отсутствие трёхдневной рабочей недели, внезапное похолодание или даже ограничение порций пудинга — за всё должна отвечать Кая!"
42100-210 = "Отвечай, Кая! Отвечай!"
42100-212 = "Осуждай всё! Требуй всё!"
42100-213 = "Осуждай всё! Требуй всё!"
42100-215 = "Эти революционерки такие... зацикленные на себе."
42100-216 = "Так, всё, с вас хватит! Убирайтесь!"
42100-217 = "Товарищи, она показывает своё истинное лицо! Они никогда не могут долго скрывать своё зло!"
42100-218 = "Прямо как председательница Черина и вся её разношёрстная компания!"
42100-219 = "Никогда не забывайте! Вот почему мы ненавидим бюрократов!"
42100-220 = "Мы не успокоимся, пока не исчезнут все тираны и капиталисты!"
42100-221 = ""
42100-223 = ""
42100-224 = ""
42100-225 = "Н-нет! Не подходите ближе!"
42100-226 = "Назад! Или я доложу на вас главе Кае!"
42100-227 = ""
42100-231 = "Ха! Это сейчас была угроза? В Академии Красной Зимы мы так говорим «Доброе утро»!"
42100-232 = ""
42100-233 = "Товарищи, вы готовы к борьбе?!"
42100-235 = "Мы! Го! То! Вы!"
42100-237 = "Борьба Рабочей партии Красной Зимы начинается вновь!"
42100-238 = "Ура!!"
42100-240 = "Следующий эпизод: Чёрный кофе"
