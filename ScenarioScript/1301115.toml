[translation]
1301115-1 = "Память геймера"
1301115-2 = ""
1301115-3 = ""
1301115-4 = ""
1301115-5 = "Сенсей! Готово! Зарядка завершена!"
1301115-6 = "[s] «Отлично! Начинаем! Вперёд, Момои!»"
1301115-7 = "Кажется, в занос ты входишь немного криво, но ладно!"
1301115-8 = "И-я-я-а-а–!!"
1301115-9 = ""
1301115-13 = "А, а?!!"
1301115-14 = "[ns1] «А-а, так ты ИЗ ТЕХ игроков.»\n[ns2] «Ты всем телом наклоняешься, когда играешь в гонки.»"
1301115-17 = "К-конечно! Настоящее погружение — признак истинного геймера!"
1301115-18 = "А?"
1301115-19 = ""
1301115-21 = ""
1301115-25 = "Блех?!"
1301115-27 = "Угх! Ну и бардак!"
1301115-28 = "Ну... просто... башня из вещей рядом со мной рухнула."
1301115-29 = "[s] «Ну же. Вставай. Дай руку.»"
1301115-30 = ""
1301115-32 = ""
1301115-33 = "Спасибо, Сенсей... А?"
1301115-34 = ""
1301115-36 = ""
1301115-37 = ""
1301115-39 = "О, вот оно! А я всё думала, куда это делось!"
1301115-40 = "Что это, спрашиваете? Фу. Фу. Фу... Это..."
1301115-41 = "...игровая консоль, которую мы с Мидори купили давным-давно. Она часть парного набора."
1301115-42 = "[s] «Так с неё и начался твой путь геймера?»"
1301115-43 = "А? Нет. Я была геймером задолго до неё!"
1301115-44 = "Просто мы с Мидори купили одинаковые. Мило, правда?"
1301115-45 = "Но, раз уж вы упомянули, возможно, для Мидори это и правда была первая игровая консоль. И это довольно круто."
1301115-46 = "[s3] «Если она настолько важна...»\n[s4] «Почему ты не хранила её как следует...?»"
1301115-49 = "Я-я хранила её как следует!"
1301115-50 = "Видите? Она отлично сохранилась — и подставка есть, и прозрачный футляр!"
1301115-51 = ""
1301115-53 = ""
1301115-55 = "А? Разве это не немного бессмысленно, если я не могу найти её там, где она обычно лежит? Н-ну, в этом есть смысл... неприятный смысл..."
1301115-56 = "Смотрите! По-моему, я неплохо постаралась!"
1301115-57 = "[s] «Да-да...»"
1301115-58 = "А? Хотите знать, почему я так тщательно её сохранила?"
1301115-59 = "..."
1301115-60 = "Ну, как старшая сестра, я должна быть ответственной!"
1301115-61 = "До того как мы начали играть вместе, мы были не особенно близки."
1301115-62 = "Я пыталась найти способ сблизиться... и поэтому предложила купить одинаковые консоли."
1301115-63 = "И... в итоге мы купили их вместе."
1301115-64 = "Я подумала, что если подарю ей консоль, она будет о ней заботиться."
1301115-65 = "Фу. Фу. Фу... А «Операция: сделать Мидори геймером» завершилась оглушительным успехом."
1301115-66 = "Главное, что это нас сблизило, верно? Всё хорошо, что хорошо кончается?"
1301115-67 = "Погодите... А мы вообще близки...? Мне кажется, Мидори постоянно меня дразнит."
1301115-68 = "[s] «Кстати говоря... разве ты не проигрываешь ей большую часть времени?»"
1301115-69 = "Зачем было говорить это вслух?"
1301115-70 = "В любом случае, мне не нравится, что вы сказали, будто в целом я проигрываю. Это правда, Сенсей?"
1301115-71 = "[s] «Иногда старшие сёстры должны позволять младшим побеждать...»"
1301115-72 = "Т-точно! Именно так! Видите, на самом деле я вовсе не хуже играю."
1301115-73 = ""
1301115-76 = ""
1301115-77 = "А...? Ва?!"
1301115-78 = "[s] «Что такое? Что случилось, Момои?»"
1301115-79 = "П-пока мы разговаривали..."
1301115-80 = "Монстр сбежал!"
1301115-81 = "[ns] «Охота провалена?!»"
1301115-82 = "Нет! Теперь снова выслеживать его — такая морока!"
1301115-84 = "Итак, несмотря на несколько происшествий..."
1301115-85 = "...мне было очень весело играть вместе с Момои."
