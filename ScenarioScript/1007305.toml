[translation]
1007305-1 = "Скитальцы"
1007305-5 = "Когда я добрался до пляжа, было уже поздно. На берегу стояла Уй и смотрела вдаль."
1007305-10 = "...О, Сенсей. Сюда."
1007305-11 = ""
1007305-15 = ""
1007305-16 = "Вы пришли быстрее, чем я ожидала. Я много раз сомневалась, стоит ли вообще вам писать."
1007305-17 = "Мне было неловко звать вас сюда без особой причины, но я просто... хотела прогуляться вместе с вами."
1007305-18 = "В общем-то, ради этого я сюда и пришла."
1007305-19 = "Это мало что меняет, но..."
1007305-20 = ""
1007305-22 = ""
1007305-23 = "...Хотите выпить?"
1007305-24 = "[s1] «Американо поздней ночью? Что-то знакомое.»\n[s2] Взять американо."
1007305-25 = ""
1007305-26 = ""
1007305-31 = "Мы шли по пляжу, неспешно потягивая холодный американо."
1007305-34 = "Неожиданно... У старого совета был хороший вкус на пейзажи."
1007305-35 = ""
1007305-37 = ""
1007305-38 = "Они нашли отличное место, правда?"
1007305-39 = "Я думала, это просто сборище упрямцев, но, видимо, иногда и я ошибаюсь в людях."
1007305-40 = "Хи-хи..."
1007305-41 = "...А?"
1007305-42 = "...Сенсей? Что это за взгляд?"
1007305-43 = "[s3] «Просто приятно видеть, что ты так расслаблена.»\n[s4] «Такое чувство, будто нынешняя Уй способна на всё.»"
1007305-44 = ""
1007305-45 = ""
1007305-47 = ""
1007305-48 = "Ох... Я понимаю, о чём вы."
1007305-49 = "Похоже на то, правда? Думаю, без этого ощущения я бы вообще не смогла вам позвонить."
1007305-50 = "Теперь это кажется ещё более уместным."
1007305-51 = "Здесь так темно и тихо, будто может случиться что угодно."
1007305-52 = "Темнота... Она будто разрешает людям перестать так сильно думать о том, как они выглядят со стороны."
1007305-53 = "Может быть, поэтому сейчас мне так спокойно."
1007305-54 = "Если произнести это вслух, я звучу как какой-то вампир из третьесортного ужастика..."
1007305-55 = "Но вы понимаете, о чём я, правда, Сенсей?"
1007305-56 = "Вы много путешествуете и по работе встречаете самых разных людей. Уверена, вам попадался не один студент вроде меня."
1007305-57 = "Студенты без уверенности в себе, которые постоянно думают о каждом своём поступке и о том, как их воспримут другие..."
1007305-58 = "Так я звучу довольно... робкой."
1007305-59 = "[s5] «Ну, я совсем не думаю, что ты похожа на таких студентов.»\n[s6] «Я бы точно не назвал тебя робкой, Уй.»"
1007305-60 = ""
1007305-61 = ""
1007305-63 = ""
1007305-64 = "А..."
1007305-65 = "Это... неожиданно. Вы правда так думаете?"
1007305-66 = "Вообще-то... Я могу это понять..."
1007305-67 = "Да... Наверное, «робкая» — не совсем подходящее слово. Если подумать, для этого я, пожалуй, слишком колючая."
1007305-68 = "Не смотрите так обеспокоенно. Я говорю это не из самоуничижения. Я и правда могу быть довольно колючей."
1007305-69 = "Трудно это отрицать, когда я намеренно так себя веду."
1007305-70 = "Если моя скорлупа достаточно прочная, пробиться через неё смогут только те, кого я сама действительно хочу впустить."
1007305-71 = "От этого ещё страннее, что в последнее время через неё пробилось так много людей..."
1007305-72 = ""
1007305-74 = ""
1007305-75 = "..."
1007305-76 = "Хотя всё это благодаря одному знакомому мне назойливому доброхоту."
1007305-77 = "Хм... Может, мне стоит стать дикобразом."
1007305-78 = "[s7] «Ха-ха. Хорошая шутка.»\n[s8] «Ты ведь сама в это не веришь.»"
1007305-81 = "Как и ожидалось, вы даже глазом не моргнули."
1007305-82 = "Я лишь отчасти шучу. Я всё равно не люблю пустую болтовню и бессодержательные разговоры."
1007305-83 = "Но я знаю, что всё, что вы для меня делали, было искренне."
1007305-84 = "Так что если мне удастся хоть немного измениться, полагаю, благодарить за это придётся вас."
1007305-85 = "Но... та часть меня, которая не любит иметь дело с людьми, уже никогда не изменится."
1007305-86 = "Поэтому... время от времени, если мне захочется на что-нибудь пожаловаться..."
1007305-87 = "Я, возможно, приду к вам поворчать и выплеснуть всё накопившееся."
1007305-88 = "Как сейчас. Так мы сможем проводить время вместе."
1007305-89 = "...Хи."
1007305-90 = "Не знаю, почему говорю всё это так, будто оказываю вам услугу. У меня плохо получается, да?"
1007305-91 = "Наверное, в прошлой жизни вы сделали что-то ужасное, раз теперь приходится помогать кому-то вроде меня. Соболезную."
1007305-92 = "[s9] «Помогать тебе — лучшая часть моей работы.»\n[s10] «По-моему, ты довольно впечатляющая.»"
1007305-95 = "Да-да. С тем же успехом я могла бы сказать это себе перед зеркалом."
1007305-96 = "Наш разговор начинает ходить по кругу, так что сменим тему. Я позвала вас сегодня вечером не ради этого."
1007305-97 = "Я позвала вас сюда, чтобы... прогуляться со мной по пляжу."
1007305-98 = "У нас ещё осталось немного американо..."
1007305-99 = "Можете ничего не говорить, пока мы его не допьём..."
1007305-100 = ""
1007305-102 = ""
1007305-103 = "Так что... просто пойдём прогуляемся."
1007305-104 = "И кстати, это не просьба. Вы обязаны это сделать."
1007305-105 = "...Понятно?"
1007305-106 = ""
1007305-109 = "[ns11] Продолжить пить американо.\n[ns12] Медленно пойти вперёд."
1007305-112 = "Хи-хи."
1007305-114 = "...Здесь приятно."
