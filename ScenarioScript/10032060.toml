[translation]
10032060-1 = "Эпизод 6;Абсурдное недоразумение"
10032060-3 = "...Сюда."
10032060-4 = ""
10032060-6 = ""
10032060-7 = ""
10032060-8 = ""
10032060-9 = ""
10032060-10 = "Казалось бы, защита кого-то должна её замедлять, но она почему-то стала ещё быстрее?"
10032060-11 = "Наверное, мне не стоит недооценивать именно Джомаэ Саори. Но всё же..."
10032060-12 = "И ещё одно..."
10032060-13 = ""
10032060-15 = ""
10032060-16 = "Почему она идёт вниз? Кажется, этот путь ведёт к парковке..."
10032060-17 = "Наверное, пытается встретиться с сообщниками, чтобы те помогли им скрыться. Нам нужно двигаться быстрее."
10032060-18 = "Все эти люди без сознания... Здесь что, была массовая драка?"
10032060-19 = "Не-а. Я бы поставила на то, что Саори вырубила их всех."
10032060-20 = "А, да-да. Звучит логично."
10032060-21 = ""
10032060-23 = ""
10032060-24 = "Погодите? Это правда логично?"
10032060-25 = "В смысле, она сделала всё одна?"
10032060-26 = "[s1] «Ну, это же Саори.»\n[s2] «Судя по всем уликам, я бы сказал, что да.»"
10032060-29 = "Похоже, вы двое близки, Сенсей."
10032060-30 = "...Хотя это же вы. Наверное, вы самый влиятельный в плане связей человек во всём Кивотосе."
10032060-31 = "Дальше всё станет только сложнее. Ещё не поздно отказаться."
10032060-32 = "Мы не хотим заставлять вас выбирать сторону, так что вам лучше просто пойти домой, Сенсей."
10032060-33 = "...А?"
10032060-34 = "Что значит «не можете»...?"
10032060-35 = "[s3] «Я не хочу, чтобы ситуация стала ещё хуже.»\n[s4] «Если я хотя бы смогу не дать кому-то пострадать...»"
10032060-38 = ""
10032060-39 = "Хахаха! Это так на вас похоже, Сенсей!"
10032060-40 = "Но если серьёзно..."
10032060-41 = "Ну, ладно. Тогда идём. Подземная парковка уже совсем близко."
10032060-42 = "Если Джомаэ Саори сбежит вместе с Доном Аранчино... Они победили!"
10032060-43 = "Но если мы поймаем их до того, как они выберутся, победа за нами!"
10032060-45 = "Я-я иду!"
10032060-46 = ""
10032060-49 = ""
10032060-50 = ""
10032060-51 = ""
10032060-52 = ""
10032060-54 = ""
10032060-55 = ""
10032060-56 = "[ns5] «...Ару? Ты в порядке?»\n[ns6] «Что такое? У тебя обеспокоенный вид.»"
10032060-59 = "Я-я? Со мной всё отлично! Почти...!"
10032060-60 = "Просто я тут задумалась... кое о чём..."
10032060-61 = "Я подумала... ну... насчёт Сенсея..."
10032060-62 = "Насчёт документального фильма Сенсея..."
10032060-63 = ""
10032060-66 = "[ns7] «...Моего документального фильма?»\n[ns8] «...А.»"
10032060-69 = "Мне всё сильнее кажется, что мы слишком далеко отошли от первоначальной цели."
10032060-70 = "Ведь именно поэтому вы сюда пришли, верно? А из-за нас..."
10032060-71 = "Я предложила провести вам экскурсию, а в итоге каким-то образом втянула вас в нашу работу."
10032060-72 = ""
10032060-74 = ""
10032060-75 = "А-а ведь вы ещё и ценный консультант «Решателя проблем»!"
10032060-76 = "Чтобы такие отношения работали, между нами должно быть крепкое взаимное доверие! Поэтому...!"
10032060-77 = "...А?"
10032060-78 = "...Вы правда считаете, что мне не о чем беспокоиться? Но ведь ваша важная работа..."
10032060-79 = "[s9] «Заботиться о вас — часть моей работы.»\n[s10] «Работа важна, но не важнее студенты, которая стоит передо мной.»"
10032060-82 = "..."
10032060-83 = "...Сенсей."
10032060-84 = "Хи-хи-хи. Вы всегда знаете, что сказать, Сенсей."
10032060-85 = "Если вы так это ставите, мне трудно отказаться от вашего предложения."
10032060-86 = "Но уверяю вас: Решалы 68 всегда возвращает долги — и хорошие, и плохие."
10032060-87 = "«Решатель проблем» вернёт вам всё, что должна, да ещё и сверху!"
10032060-88 = "Так что идёмте, Сенсей! На подземную парковку!"
