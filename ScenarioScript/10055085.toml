[translation]
10055085-2 = ""
10055085-3 = "Йо-хо-хо! Видели?! Узрите подлинную мощь корабля Пандемониума!"
10055085-5 = ""
10055085-6 = "Это не обычные пираты!"
10055085-7 = "Особенно капитан! С ней шутки плохи! Она одолела Сумику одним ударом!"
10055085-8 = "Мне казалось, Сумика довольно сильная, нет?"
10055085-9 = ""
10055085-11 = ""
10055085-12 = ""
10055085-13 = "Отступаем! Отступаем!"
10055085-14 = "А? Да с ней всё в порядке."
10055085-15 = "Клянусь, я видела, как она упала..."
10055085-16 = "В море всякое случается! Не стану же я раскрывать всю свою силу первым ударом! В таких ситуациях надо держать козыри при себе!"
10055085-17 = "Ты красиво рассказываешь, но, по-моему, тебе просто снова было лень."
10055085-18 = "То есть если бы ты сражалась всерьёз, то победила бы?"
10055085-19 = "...Если честно, я не уверена."
10055085-20 = "Когда я с ней дралась, мне вспомнился... бой с нашим заместителем председателя."
10055085-21 = "Что?! Ты сравниваешь её с настоящим чудовищем!"
10055085-22 = "Нас обходят с флангов! Мы окружены! Бежим!"
10055085-23 = ""
10055085-25 = ""
10055085-26 = ""
10055085-27 = "Вы посмели взять на абордаж мой флагман, «Бисмару», и надеетесь уйти невредимыми?!"
10055085-28 = "Взять их! Скормим акулам!"
10055085-29 = ""
10055085-30 = "...Знаете, я впервые вижу, как Макото дерётся..."
10055085-31 = "И она всегда была настолько чудовищно сильной...?"
10055085-32 = "Она в трансе!"
10055085-33 = "А? Вроде того, что бывает под гипнозом?"
10055085-34 = "Именно. Она полностью вжилась в роль безжалостного пиратского капитана."
10055085-35 = "Вера в это внушение позволяет ей раскрыть гораздо больше сил, чем обычно."
10055085-36 = "И она стала такой сильной лишь потому, что поверила?!"
10055085-37 = "Разумеется. Это как влияние психологического настроя на результаты спортсмена."
10055085-38 = "Мой гипноз, усиливающий подчинённых, основан на том же принципе."
10055085-39 = "Ага! Теперь всё понятно!"
10055085-40 = "Ничего не понятно! Теперь это звучит ещё неправдоподобнее!"
10055085-41 = "Конечно, простое внушение не сработало бы так на любом. В этом Макото особенная."
10055085-42 = "...Другими словами, простодушная дурочка."
10055085-44 = ""
10055085-45 = "Они отступают!"
10055085-46 = "Мы победили!"
10055085-47 = ""
10055085-49 = ""
10055085-50 = ""
10055085-51 = "Капитан! Капитан! Капитан!"
10055085-52 = "Йо-хо-хо-хо! Видели?! Вот она, сила..."
10055085-53 = ""
10055085-55 = ""
10055085-56 = "Ч-что?! Почему корабль так трясёт?!"
10055085-57 = "К-капитан! У нас беда!"
10055085-58 = "Вражеское подкрепление! И у них не пулемёты, а настоящие корабельные орудия!"
10055085-59 = "Подкрепление?! Мы посреди океана! Откуда они взялись?!"
10055085-60 = "[s1] «У меня сильнейшее дежавю...»\n[s2] «Мы уже через такое проходили»."
10055085-63 = "Вон! За горизонтом! Уже видно!"
10055085-64 = "Флот! Огромный флот!"
10055085-65 = "Прибыл основной флот дисциплинарного комитета «Трезубец»!"
10055085-66 = "Трусы! Вызвали подкрепление!"
10055085-67 = "Все открыть ответный огонь! Отправим их всех на дно!"
10055085-68 = "Невозможно! Они вне досягаемости наших пушек!"
10055085-69 = "И это не маленькие патрульные катера! Наши устаревшие ядра даже царапины не оставят!"
10055085-70 = "Я думала, вы усвоили урок! Опять ноете?!"
10055085-71 = "Бесхребетные ничтожества! Я сама всё сделаю!"
10055085-72 = ""
10055085-74 = ""
10055085-75 = "Ой?! Я теряю равновесие..."
10055085-76 = ""
10055085-78 = ""
10055085-80 = "[ns3] «Макото?!»\n[ns4] Броситься к Макото."
10055085-83 = "[ns5] «(Я не успеваю!)»\n[ns6] «(Её смоет за борт!)»"
10055085-87 = "Что вы все делаете?!"
10055085-89 = ""
10055085-90 = ""
10055085-91 = ""
10055085-92 = "Ты с ума сошла?! Чуть в море не свалилась!"
10055085-93 = "И-Ироха?"
10055085-94 = "Я думала, ты меня ненавидишь..."
10055085-95 = "...Да что с тобой!"
10055085-96 = "Не думала, что ты способна стать ещё глупее! Думаешь, я стану припоминать обиды в такой момент?!"
10055085-97 = "Ты же даже плавать не умеешь, Макото!"
10055085-99 = "Ч-ч-ч-что?! Откуда ты знаешь мой самый страшный секрет?!"
10055085-100 = "Ты серьёзно?! Ты каждый раз прогуливала уроки плавания!"
10055085-101 = ""
10055085-103 = ""
10055085-104 = "Да и вообще, дело..."
10055085-105 = "...было не в том, кто первым извинится!"
10055085-106 = ""
10055085-110 = "Ещё одно попадание!"
10055085-111 = "М-мы тонем!"
10055085-112 = ""
10055085-115 = "И так «Бисмару» скрылась под волнами."
