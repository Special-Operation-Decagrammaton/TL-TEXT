[translation]
10055085-3 = "Yo-ho-ho! Did you see that? Behold the true power of my Pandemonium Ship!!"
10055085-6 = "These guys... they aren't just regular pirates!?"
10055085-7 = "Especially that silver-haired captain... she's no amateur. She took out Sumika in one hit!?"
10055085-8 = "Wasn't she actually pretty strong...?"
10055085-13 = "Retreat! Retreat!"
10055085-14 = "Huh? She's perfectly fine."
10055085-15 = "She was down a second ago, right...? I saw it clearly."
10055085-16 = "Obviously, she wouldn't show her true strength right away! The more you hide your true power, the better it is!"
10055085-17 = "She says that like it's some profound wisdom, but doesn't that just mean she was winging it...?"
10055085-18 = "Does that mean she could win if she actually tried?"
10055085-19 = "...Honestly, I don't have much confidence in facing that person."
10055085-20 = "I agree... It feels like going up against the Vice President, doesn't it?"
10055085-21 = "Huh? That just makes her a monster!"
10055085-22 = "Ah, we're surrounded! Run for it!!"
10055085-27 = "How dare you step foot on my Bis-maru... Do you really think you'll make it home in one piece?"
10055085-28 = "Feed every last one of them to the sharks!"
10055085-30 = "Um... this is my first time seeing Makoto-senpai fight, but..."
10055085-31 = "Isn't she a bit too strong...?"
10055085-32 = "That's a trance state!"
10055085-33 = "Huh? You mean that thing from when she was hypnotized?"
10055085-34 = "Exactly. Right now, Makoto-chan is convinced she's a ruthless pirate captain."
10055085-35 = "Thanks to that, she's drawing out more power than usual."
10055085-36 = "You can get stronger just by believing it?"
10055085-37 = "Of course. It's common knowledge in sports that your mental state affects your body."
10055085-38 = "Everyone getting stronger from my hypnosis is just an application of that."
10055085-39 = "I see! That makes perfect sense!"
10055085-40 = "That suddenly sounds a lot less credible, though!?"
10055085-41 = "Still, self-suggestion doesn't usually have this much of an effect... #nI suppose that's just Makoto-chan for you."
10055085-42 = "...Doesn't that just mean she's a simpleton?"
10055085-45 = "They're running away!"
10055085-46 = "We won!!"
10055085-51 = "Captain! Makoto! Captain! Makoto!"
10055085-52 = "Yo-ho-ho! Behold, this is our...!"
10055085-56 = "W-what is this shaking!?"
10055085-57 = "C-Captain Makoto, we have a problem!"
10055085-58 = "Enemy reinforcements! They aren't using machine guns, they're using real naval cannons!"
10055085-59 = "Reinforcements!? We're in the open ocean! Where could they possibly be coming from!?"
10055085-60 = "[s1] \"I'm getting a sense of déjà vu...\"\n[s2] \"This sequence of events feels familiar.\""
10055085-63 = "Beyond the horizon! They've appeared!"
10055085-64 = "A fleet... a massive fleet!"
10055085-65 = "The Trident main fleet has arrived!!"
10055085-66 = "Cowardly wretches... calling for reinforcements, are you?"
10055085-67 = "Everyone, engage! Feed them all to the sharks as well!!"
10055085-68 = "It's impossible! Our cannons can't even reach them!"
10055085-69 = "This isn't a patrol boat anymore! Our shells won't do a thing to them!?"
10055085-70 = "Ugh! More whining!"
10055085-71 = "You spineless cowards! I'll do it myself!"
10055085-75 = "Whoa!? I slipped..."
10055085-80 = "[ns3] \"Ah, Makoto!?\"\n[ns4] Runs toward Makoto."
10055085-83 = "[ns5] (I won't make it in time...!)\n[ns6] (At this rate, Makoto is going to fall into the sea...!)"
10055085-87 = "...What do you think you're doing!!"
10055085-92 = "Have you lost your mind!? You were about to fall into the ocean!"
10055085-93 = "I-Iroha?"
10055085-94 = "I thought you hated me..."
10055085-95 = "...Oh, for heaven's sake!"
10055085-96 = "Are you a complete idiot!? #nIs this really the time to be worrying about something like that!?"
10055085-97 = "Besides, Makoto-senpai, you can't swim, right!?"
10055085-99 = "Wha—how did you know that!? That's Makoto-sama's biggest secret!"
10055085-100 = "You've skipped every single swimming class, of course I'd know that!!"
10055085-104 = "And besides, I never..."
10055085-105 = "I never thought a senpai who would apologize first would be..."
10055085-110 = "Another hit!"
10055085-111 = "W-we're sinking...!!"
10055085-115 = "(And so, the Bis-maru sank to the bottom of the sea.)"