[translation]
1300508-1 = "Магазин пластинок"
1300508-2 = "Перед магазином пластинок"
1300508-3 = "Сенсей! Забавно встретить тебя здесь."
1300508-4 = "Ага. Я сегодня не на дежурстве, вот и пришла послушать музыку."
1300508-5 = "Магазин пластинок отличный, правда? В одном месте можно послушать что угодно."
1300508-6 = "Знаешь... эта песня мне тоже заходит."
1300508-7 = "Хочешь сам послушать?"
1300508-8 = "[s1] «Конечно.»\n[s2] «Когда я пробовал это в прошлый раз, Кайоко...»"
1300508-9 = "Да ладно, не трусь. Просто попробуй!"
1300508-10 = "Да ладно, не трусь. Просто попробуй!"
1300508-14 = "Звучит мягкая мелодия в стиле джаза..."
1300508-15 = "..."
1300508-16 = ""
1300508-18 = "[ns] «Погоди... это не хеви-метал?»"
1300508-19 = "С чего ты взял, что я опять слушаю металл?"
1300508-20 = "То, что я студент Геенны, не значит, что я не могу слушать разную музыку..."
1300508-21 = "У каждой песни есть своя история, независимо от жанра."
1300508-22 = "Я слушаю всё, если в песне есть посыл."
1300508-23 = "А какую музыку любишь ты, Сенсей?"
1300508-24 = "[s] Рассказать о любимой песне."
1300508-25 = "Хм... Никогда не слышала."
1300508-26 = "Но уверена, мне тоже понравится."
1300508-27 = "Ты ведь её рекомендуешь."
1300508-28 = "Ладно. Сейчас найду..."
1300508-30 = "Мы с Кайоко провели день, слушая музыку."
