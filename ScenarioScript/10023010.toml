[translation]
10023010-1 = "Эпизод 1; Супер-торнадо Момои!"
10023010-4 = "А-а! Я промахнулась кнопкой!"
10023010-5 = "Есть! Ещё один удар!"
10023010-6 = "Пытаешься провести сильную атаку в битве кадров?! Смело! Мне нравится!"
10023010-7 = "Но не повезло! Пади жертвой моего нового особого приёма!"
10023010-8 = "Склонись перед Супер-торнадо Момои!"
10023010-10 = "Команда CD! A, A, B, B, C, C, A, B, C, C, C — и отмена!"
10023010-11 = ""
10023010-13 = ""
10023010-20 = "Я ещё не закончила! Супер-комбо Момои!"
10023010-21 = "Влево, вправо, присесть!"
10023010-22 = ""
10023010-24 = ""
10023010-25 = ""
10023010-26 = ""
10023010-27 = "Влево, вправо, присесть, AB!"
10023010-28 = ""
10023010-36 = "Супер-торнадо Момои!"
10023010-37 = ""
10023010-51 = "*бах* *шлёп*"
10023010-52 = "Момория побеждает!"
10023010-55 = "Ха-ха-ха! Победа моя!"
10023010-56 = "Этот бой... длился... вечность..."
10023010-57 = "Мои бесчисленные поражения от Юзу... от Мидори и Арис, и даже... даже от Сенсея!"
10023010-58 = "Наконец-то я прервала череду поражений! Сегодняшняя победа станет катализатором моего перерождения!"
10023010-59 = "Люди навсегда запомнят этот день как начало восхождения Момории к величию!"
10023010-60 = "П-Простите, вы ведь здесь типа постоянно, да?"
10023010-61 = "Люди говорят о студенте, который каждый вечер отказывается уходить из аркады, пока не победит хотя бы раз..."
10023010-62 = "Кто это говорит, а?! И дело не только в том, чтобы получить одну победу!"
10023010-63 = "Видите, это она! Стоит заговорить при ней о победе, она сразу начинает защищаться."
10023010-64 = "Ого... Значит, все слухи правда...?"
10023010-65 = "Моя репутация идёт впереди меня? Я знаменитость?!"
10023010-66 = "Вы, должно быть... Маленькая Угроза!"
10023010-67 = ""
10023010-69 = ""
10023010-70 = "Что?"
10023010-71 = "Кого именно ты называешь Маленькой Угрозой?"
10023010-72 = "Тебя, кого же ещё! В последнее время вся аркада только о тебе и говорит."
10023010-73 = "Это ведь ты начинаешь спамить особыми приёмами, пока какой-нибудь не попадёт, стоит тебя загнать в угол, да?"
10023010-74 = "Точно-точно! Эй, правда, что если проигрываешь, то не отпускаешь соперника домой, пока не победишь? А если так и не можешь выиграть, ломаешь автомат и убегаешь с криками?!"
10023010-75 = "Это уже слишком! Вы выставляете меня каким-то плохим человеком!"
10023010-76 = "И что за чушь про то, что я спамлю особыми приёмами, когда—"
10023010-77 = "Хотя... ладно, это, может быть, немного правда..."
10023010-78 = "Проверь соцсети! Уже пишут, что Маленькая Угроза здесь!"
10023010-79 = "Да ладно? О боже. Ты права! Об этом везде!"
10023010-80 = "Что вообще происходит? Это точно реальность?"
10023010-81 = ""
10023010-84 = "Почему вас так много? Откуда вы все взялись?!"
10023010-85 = "Я же говорила! Это правда она. Маленькая Угроза!"
10023010-86 = "Ладно, хорошо. Ты была права. Теперь можно идти? Я слышала, она заставляет людей играть с ней всю ночь... при необходимости под дулом пистолета!"
10023010-87 = "Кто-нибудь вообще объяснит мне, откуда взялось имя «Маленькая Угроза»?!"
10023010-88 = "Я очень хороший человек и вообще не жестокая! Я просто обычный увлечённый геймер!"
10023010-89 = "Для меня честь наконец встретить печально известную Маленькую Угрозу."
10023010-90 = ""
10023010-92 = ""
10023010-93 = "Я тебя знаю?!"
10023010-94 = ""
10023010-95 = "Я знаю о вас, но вы меня не знаете. Прошу прощения. Я Дода Мэйтаро."
10023010-96 = "Не будем ходить вокруг да около. Я пришёл попросить ваших услуг. Только вы можете мне помочь, Маленькая Угроза."
10023010-97 = "Я же пытаюсь сказать! Я не эта Маленькая Угроза—"
10023010-98 = "Прошу! Это вполне вам по силам. Простая работа по уборке."
10023010-99 = "А? Правда? Просто уборка...?"
10023010-100 = "Да, только это. Для такой, как вы, это наверняка не составит труда?"
10023010-101 = "Н-Ну да, конечно. Наверное, уборка не такая уж сложная. Но мне всё равно кажется, что вы могли попросить вообще кого угодно..."
10023010-102 = "Этот запрос предназначался Маленькой Угрозе и только Маленькой Угрозе."
10023010-103 = "Спасибо, что согласились. Вот дальнейшие инструкции."
10023010-104 = "В письме найдёте всё необходимое, включая назначенное время и место."
10023010-105 = "Эй, подождите секунду! Не так быстро!"
10023010-106 = "Буду рад работать с вами, Маленькая Угроза..."
10023010-108 = "Или, лучше сказать, Микамо Нэру из C&C."
10023010-109 = ""
10023010-111 = ""
10023010-113 = ""
10023010-114 = "...Что?!"
10023010-116 = "...И примерно на этом всё."
10023010-117 = "..."
10023010-118 = ""
10023010-120 = ""
10023010-121 = "..."
10023010-122 = "?"
10023010-123 = ""
10023010-125 = ""
10023010-126 = ""
10023010-127 = "Момои..."
10023010-128 = "Д-Да?!"
10023010-129 = "Почему ты всегда втягиваешь нас в свои проблемы? Тебе нужно научиться говорить людям «нет»!"
10023010-130 = "Тебя там не было, так что ты не понимаешь! Я правда пыталась что-то сказать, но меня полностью задавили..."
10023010-131 = ""
10023010-133 = ""
10023010-134 = "Я тоже не понимаю. Но понимаю, что наша группа приняла новый квест! Бум-бум-бум!"
10023010-135 = "Н-Новый квест... значит... Нам придётся выйти наружу?"
10023010-137 = "Уааа! Я не знаю, как выбраться из этой передряги! Я опять всё испортила!"
10023010-138 = "Ты права! Нужно было просто сказать «нет»! Я-я пгасти...! *шмыг*"
10023010-139 = "*вздох* ...Ты сказала, что это просто уборка?"
10023010-140 = "Ага! Честно-честно! Я даже дважды проверила!"
10023010-141 = "Ну, если просто уборка... Ты ведь сказала, что с этим справится кто угодно."
10023010-142 = "Хотя если кто-то нанимает человека для уборки, обычно это значит, что нужен профессионал... Легко не будет."
10023010-143 = "Погоди! Ты поможешь мне, Мидо? Правда? Правда-правда?!"
10023010-144 = "У тебя всё равно нет способа отказаться, а мы тебя не бросим."
10023010-145 = "Так что да. Сделаем вид, что мы члены C&C, и будем убирать так, будто от этого зависит наша жизнь."
10023010-146 = "Уаааа! Ты самая лучшая! Как же мне повезло делить утробу с таким человеком, как ты!"
10023010-147 = "Отлипни от меня, пока я не передумала!"
10023010-148 = ""
10023010-150 = ""
10023010-151 = "Мне придётся выйти из клубной комнаты... Встретиться с людьми... Разговаривать с ними... И-и... И...! А-а-а...!"
10023010-152 = "Мы будем рядом, Юзу! Ты не останешься одна!"
10023010-153 = "Ярость... Уничтожение... Страх... Конец света всё ближе... На всех нас надвигается отчаяние...!"
10023010-154 = "Квест принят! Время квеста! Время квеста! Хи-хи!"
10023010-155 = "Так что... помоги нам, Сенсей!"
10023010-156 = "[s] «А? Я?!»"
10023010-158 = "Ну да! С полномочиями Сенсея мы можем попасть почти куда угодно!"
10023010-159 = "И нам нужен временный советник на случай, если клиент задаст сложные вопросы."
10023010-160 = "Разве работа взрослого не в том, чтобы придумывать отмазки и всё такое?"
10023010-161 = "[s] «Нам нужно обсудить твой взгляд на взрослых, Момои...»"
10023010-162 = "Если Сенсей пойдёт с нами, я стану бесстрашным героем! Ведь именно маскот помогает герою быть сильным и смелым. Пожалуйста, присоединитесь к нашей группе, Сенсей!"
10023010-163 = "Я-я понимаю, что это неудобно... но я не знаю, откуда возьму смелость... если вас не будет рядом, Сенсей..."
10023010-164 = "[s1] «Ну, если вы так ставите вопрос...» \n[s2] «Быть советником — часть моих обязанностей!»"
10023010-165 = "Правда, Сенсей?! Я знала, что на вас можно рассчитывать!"
10023010-166 = "Правда, Сенсей?! Я знала, что на вас можно рассчитывать!"
10023010-167 = "Отлично! Первым делом у меня есть просьба к нашему новому временному советнику!"
10023010-168 = "[s3] «Становится интересно!» \n[s4] «Давайте! Какой первый шаг?»"
10023010-169 = "Найдите нам формы горничных!"
10023010-170 = "Найдите нам формы горничных!"
10023010-171 = "[s] «...Что-что?»"
10023010-173 = "Офис Токи"
10023010-174 = ""
10023010-175 = "[ns] «...Вот так я здесь и оказался.»"
10023010-176 = "Ситуацию я поняла."
10023010-177 = "[s] «Пожалуйста, не говори Нэру... Она будет очень-очень зла...»"
10023010-178 = "А вы не подумали, что я тоже могу разозлиться?"
10023010-179 = "[s] «Ах... Ну... Я просто подумал, что ты, может быть... захочешь мне помочь?»"
10023010-180 = "...Понятно."
10023010-181 = "Хорошо. Не переживайте. Я сохраню ваш секрет до последней пули."
10023010-182 = "[s] «Спасибо! Когда-нибудь я обязательно отплачу тебе за это. Обещаю.»"
10023010-183 = "Да. Я этого не забуду."
