[translation]
10056100-1 = "Episode 10;Breaching"
10056100-2 = "The next morning..."
10056100-7 = "Ahoy!"
10056100-8 = "Fufu, rejoice. I have brought good news."
10056100-14 = "I got that cylinder you guys were talking about!"
10056100-15 = "With this, you can dive into the \"Graveyard of Whales,\" right?"
10056100-16 = "Come on! Get ready to dive immediately--"
10056100-20 = "Hm? You were already prepared? Perfect timing."
10056100-25 = "The Jiao Long of the tidal waters... No, Guardian Nanami."
10056100-26 = "We cannot disturb the whale's rest."
10056100-27 = "Maintain a proper distance from marine life and do not interfere with their ecosystem.#nThat is a diver's principle."
10056100-28 = "Even if we can no longer dive... we cannot follow your orders."
10056100-33 = "Ha... It seems you are under some misunderstanding."
10056100-34 = "This is an order."
10056100-35 = "I believe I said I would not guarantee Sensei's safety if you resist."
10056100-36 = "Even if you somehow managed to escape, what do you plan to do?"
10056100-37 = "Surely you are not going to say you will swim back?"
10056100-38 = "If there is no path, we will forge one."
10056100-39 = "Because door breaching is not a skill limited to dry land."
10056100-40 = "In this vast ocean?#nWhose door are you planning to open?"
10056100-41 = "--You are planning something."
10056100-42 = "What a futile struggle."
10056100-43 = "Who knows how many hours it will take for Trident to arrive, even if you call for rescue."
10056100-44 = "You would do well to stop playing around--"
10056100-49 = "This is..."
10056100-56 = "What is the meaning of this!?"
10056100-57 = "The whale--!?"
10056100-58 = "I am glad I greeted it with a whistle yesterday."
10056100-59 = "I did not expect it to gather just from blowing it."
10056100-60 = "The Flying Whale."
10056100-61 = "So cool!"
10056100-62 = "Everyone, hold on tight! It is going to shake!"
10056100-63 = "...Alright!"
10056100-64 = "Sensei, now!"
10056100-68 = "You fools... If you leave your posts over a little shaking--"
10056100-72 = "Do not let Sensei escape!"
10056100-77 = "(Fallen into the sea from the violently rocking ship, tossed by the waves caused by the whale's landing.)"
10056100-81 = "(While struggling in the water, someone approached and pulled me up to the surface.)"
10056100-82 = "(...I heard a familiar sound.)"
10056100-85 = "Sensei, are you okay?"
10056100-86 = "[s1] \"Sort of.\"\n[s2] \"Swallowed a bit of seawater, though...\""
10056100-92 = "Catch Sensei before they get away!"
10056100-93 = "Consider that if we miss this chance, there will be no next time!"
10056100-101 = "[ns] \"No, is it too early to say I am safe?\""
10056100-103 = "Sensei. Could you close your eyes?"
10056100-109 = "[ns] \"Nph,ngh...nn...!?\""
10056100-110 = "It is my octopus. Please keep it in your mouth like this.#nIt will only last about 10 minutes, though..."
10056100-111 = "That will be more than enough."
10056100-117 = "Guardian Nanami."
10056100-118 = "We will forge our path for the sake of our goal."
10056100-119 = "Keep struggling all you want."
10056100-120 = "What is that supposed to mean? Are you mocking me!"
10056100-121 = "When you want to surrender, tell me to stop."
10056100-122 = "Until then, I will not."
10056100-123 = "Ha, truly ridiculous! Did you think I would give up with that level of threat?"
10056100-124 = "Prepare for anti-submarine combat--depth charges, commence dropping!"
10056100-125 = "Turn them into food for the fishes!"
10056100-137 = "Regulator check. Final check. All green."
10056100-144 = "All hands, dive."
