[translation]
10011020-83 = "[Battle Start - Delinquent]"
10011020-1 = "Эпизод 2;Большие девочки не плачут"
10011020-2 = "Строящаяся сцена Хяккияко"
10011020-4 = "Помощники представления, собирайтесь здесь!"
10011020-5 = "[s] «Это нас зовут.»"
10011020-6 = "Пропустите!"
10011020-7 = ""
10011020-9 = ""
10011020-11 = "Да!"
10011020-12 = ""
10011020-14 = ""
10011020-15 = ""
10011020-16 = ""
10011020-18 = ""
10011020-19 = "Не верится, что мы правда помогаем с представлением. Я всё время себя щипаю!"
10011020-20 = "Для начала всех помощников распределят по ролям, чтобы мы могли провести учёт оборудования."
10011020-21 = "Распределят по ролям?"
10011020-22 = "Да. Вы — сюда, пожалуйста."
10011020-23 = "О, эм, хорошо."
10011020-24 = ""
10011020-26 = ""
10011020-27 = "И вы. Туда."
10011020-28 = "Хорошо! Нин-нин!"
10011020-29 = ""
10011020-31 = ""
10011020-32 = "А вы, поскольку высокая, пожалуйста, займитесь тем оборудованием."
10011020-33 = "Ох... Хорошо..."
10011020-34 = ""
10011020-36 = ""
10011020-38 = "Отлично. Проследуйте к назначенным местам и выполняйте инструкции персонала."
10011020-40 = "Всё происходит так быстро... но мы сами на это подписались."
10011020-42 = "Ещё бы! Я не посрамлю наши ценности ниндзя!"
10011020-43 = "Я-я тоже...! П-Постараюсь изо всех сил!"
10011020-44 = "[s] «Удачи всем. Увидимся через час.»"
10011020-46 = ""
10011020-48 = "Примерно час и двадцать минут спустя..."
10011020-49 = ""
10011020-52 = "[ns] «Все опаздывают.»"
10011020-53 = "После того как я, казалось, целую вечность ждал возвращения остальных..."
10011020-54 = ""
10011020-58 = "[ns] «Что за шум снаружи?»"
10011020-59 = ""
10011020-64 = "[ns] «Погодите... Это ведь...?»"
10011020-65 = "П-Пожалуйста... Просто пропустите меня..."
10011020-66 = "Что мы сказали? Заткнись и не двигайся."
10011020-67 = "Ни на шаг, каланча."
10011020-68 = "Мы встречаемся с нашими, а ты будешь нашим ориентиром."
10011020-69 = "Ч-Что...? Н-Но... я человек! Н-Не ориентир..."
10011020-70 = "Мне нужно и-идти... Пожалуйста... У меня работа!"
10011020-71 = "[s] «Цукуё?»"
10011020-72 = "...?!"
10011020-73 = ""
10011020-75 = ""
10011020-76 = "Ты ещё кто такой, чёрт возьми?"
10011020-77 = "Хочешь испортить наши планы на фестиваль?"
10011020-78 = "Мы празднуем по-своему. Займём первые ряды и устроим НАСТОЯЩИЙ ШУМ!"
10011020-79 = "Если встанешь у нас на пути, это будет последнее, что ты сделаешь!"
10011020-80 = "[s] «Как хотите. Разберёмся с ними, Цукуё.»"
10011020-82 = "П-П-Простите?"