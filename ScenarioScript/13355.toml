13355-16 = "...Por quê, por quê, por quê!"
13355-17 = "Por quê—!!"
13355-18 = "Como uma trapaça dessas pode ser permitida?!"
13355-19 = "Isso vai contra o Codex! É uma violação das regras...!#nDroga, o que os Sacerdotes Sem Nome estão fazendo... Aqueles inúteis!"
