[translation]
10024045-2 = ""
10024045-3 = "Ц...!"
10024045-4 = ""
10024045-6 = ""
10024045-7 = "Ох... Я не хотела прибегать к силе, но, похоже, этого не избежать."
10024045-8 = "Ну что. Теперь можем поговорить?"
10024045-9 = ""
10024045-11 = ""
10024045-12 = ""
10024045-13 = ""
10024045-14 = "...Я должна учиться на ошибках, иначе никогда не смогу двигаться вперёд. А если не двигаться вперёд, я не смогу расти..."
10024045-15 = ""
10024045-17 = ""
10024045-18 = "Это не унижение, если ты сама не позволишь ему стать унижением...! Мы родились не только ради того, чтобы умереть...!"
10024045-19 = ""
10024045-22 = ""
10024045-24 = ""
10024045-25 = "...Она несёт какую-то бессмыслицу."
10024045-26 = "[s] «Ага, я тоже не всё понял...»"
10024045-28 = "Хм..."
10024045-30 = ""
10024045-33 = "Я устроила засаду здесь, услышав, что вы встречались с Обществом восточной алхимии."
10024045-34 = "Мне было интересно, придёт ли Общество сюда вместе с вами или вы явитесь одни..."
10024045-36 = "Общество восточной алхимии тоже в списке подозреваемых?"
10024045-38 = "Они занимаются лекарствами."
10024045-39 = "Вполне естественно, что они могли обратиться к Променаду Чёрной Черепахи, чтобы заполучить... особые ингредиенты."
10024045-41 = "Воображение у тебя богатое."
10024045-43 = "Это дедукция, а не воображение."
10024045-44 = "[s1] «Ты говоришь прямо как из старого нуарного фильма...»\n[s2] «Настоящий крутой детектив, да?»"
10024045-47 = "Рада, что хоть кто-то заметил."
10024045-48 = "[s] «С нами можешь расслабиться. Не обязательно изображать крутую.»"
10024045-49 = "Я ничего не изображаю. Я... и так крутая."
10024045-51 = "(Она идиотка.)"
10024045-52 = "(Похоже на то.)"
10024045-53 = "Если Общество восточной алхимии такое подозрительное, почему вы и их не достаёте?"
10024045-55 = "У меня нет доказательств против них. А вот против вас у нас есть та коробка с Променада."
10024045-56 = "..."
10024045-57 = "А теперь преступники вернулись на место преступления. Можете сразу писать признание."
10024045-58 = "Осталось решить только одно... что делать с вами, Сенсей..."
10024045-60 = "Ты делаешь поспешные выводы!"
10024045-61 = "Как мы вообще могли собирать женьшень на этой священной горе так, чтобы Генрюмон ничего не заметила?"
10024045-62 = "Легко. Всем известно, что Променад Чёрной Черепахи готов использовать любые грязные приёмы."
10024045-63 = "Взятки... Давление... Ночные вылазки... Способов слишком много, чтобы перечислять."
10024045-65 = "Уверена, вы прекрасно разбираетесь в таких вещах."
10024045-66 = "Пожалуйста, воспользуйся мозгом, если он у тебя есть."
10024045-67 = "Ты всё повторяешь, что преступники всегда возвращаются на место преступления. Но ты ведь тоже сюда вернулась, разве нет?"
10024045-69 = "По-моему, за всем этим стоит Генрюмон, а вы пытаетесь свалить вину на нас."
10024045-70 = "Как ты смеешь!"
10024045-72 = "Но ведь звучит логично, правда? Кто ещё, кроме Генрюмон, мог тайно вывезти женьшень отсюда?"
10024045-73 = "Потом подставляете Променад Чёрной Черепахи и разом избавляетесь от нас."
10024045-74 = "Ты игнорируешь самое очевидное доказательство. Десятитысячелетний женьшень нашли в одной из ВАШИХ коробок."
10024045-75 = "Пф! Променад Чёрной Черепахи делает доставки по всему Шаньхайцзину."
10024045-76 = "И, может, ты забыла, но Генрюмон фактически управляет всем в Шаньхайцзине."
10024045-77 = "Для вас заполучить пару потерявшихся коробок Променада было проще простого!"
10024045-79 = "Чушь!"
10024045-80 = "Сама ты ЧУШЬ!"
10024045-81 = ""
10024045-83 = ""
10024045-84 = ""
10024045-85 = "Хм. Если позволите на минуту отложить титул президента и взглянуть со стороны..."
10024045-86 = "Променад Чёрной Черепахи и Генрюмон следят за каждым движением друг друга, верно?"
10024045-87 = "Не понимаю, как кто-то мог заниматься контрабандой так, чтобы другая сторона ничего не заметила."
10024045-88 = "[s] «Ты права. Кто-нибудь уже должен был что-то увидеть.»"
10024045-90 = "А? Сенсей, вы ведь не встаёте на их сторону?"
10024045-91 = "Сенсей, вы же не можете всерьёз верить, что Генрюмон невиновна!"
10024045-92 = "[s] «Я ничего такого не делаю...»"
10024045-94 = "Бедный Сенсей, его втянули в ваши перепалки."
10024045-95 = "Серьёзно. Вы как две горошины из одного стручка и даже не замечаете этого."
10024045-96 = ""
10024045-98 = ""
10024045-100 = ""
10024045-102 = "[ns] «Есть ли группы, независимые и от Променада Чёрной Черепахи, и от Генрюмон?»"
10024045-103 = "В Шаньхайцзине нет такой организации, Сенсей."
10024045-104 = "Генрюмон влияет на всё, что здесь происходит. Если выбирать группу, я бы сказала — Променад Чёрной Черепахи..."
10024045-106 = "Отличная мысль! Ещё одно доказательство вины Променада Чёрной Черепахи."
10024045-107 = "Спасибо за совет, Сенсей. Хорошая подача."
10024045-109 = "Вы всерьёз хвастаетесь, что ваш клуб суёт нос в чужие дела? Как неловко..."
10024045-110 = "Э-это вы имели в виду? Сенсей, вы меня обманули? Вы... всё-таки враг?!"
10024045-111 = "[s] «Нет!»"
10024045-112 = "Но... ладно. Пока поверю вам."
10024045-114 = "Хороший вопрос. Организация, на которую не влияет ни одна из наших групп..."
10024045-115 = ""
10024045-117 = ""
10024045-119 = ""
10024045-121 = "О... Я могу вспомнить одну."
10024045-122 = "Президент! Вы знаете ответ?"
10024045-123 = "Хм? Что за клуб?"
10024045-124 = "Нет, не может быть... Если это место каким-то образом замешано..."
10024045-126 = "...значит, положение Шаньхайцзина хуже, чем я думала."
10024045-127 = ""
10024045-129 = "[ns] «Бормотать себе под нос и скрывать детали — неподобающее поведение в школе!»"
10024045-130 = "А-а? Сенсей, вы... воспитываете меня...?"
10024045-131 = "[s] «Вообще-то я просто хотел, чтобы ты наконец всё рассказала.»"
10024045-132 = "Сенсей..."
10024045-134 = "Я здесь, Президент! Если трудно сказать вслух, просто прошепчите мне на ухо..."
10024045-135 = "Что ты там бормочешь? Выкладывай, или я покажу, как в Генрюмон заставляют людей говорить!"
10024045-136 = "Кхм! Я поняла, что одна группа всё-таки ЕСТЬ. Группа, о которой никому бы даже в голову не пришло подумать."
10024045-137 = "Никто из нас её даже не рассматривал. То, что вы до сих пор не понимаете, о ком я говорю, это подтверждает."
10024045-138 = "Да само их название стало синонимом невинности..."
10024045-140 = "Так!"
10024045-141 = "Кто!"
10024045-142 = ""
10024045-145 = "[ns] «—же это?!»"
10024045-146 = ""
10024045-149 = "Отдел дисциплинарной поддержки Шаньхайцзина: Сад сливовых цветов."
