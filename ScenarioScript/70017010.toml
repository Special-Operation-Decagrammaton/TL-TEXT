[translation]
70017010-1 = "Episode 1; 183 vs 227"
70017010-4 = "Errand complete. Commencing verification."
70017010-8 = "Starting with Erina's errand. #n\"Buy 3kg of potatoes at the supermarket. #nIf any have sprouted, they're too heavy, so you can just throw them away on the spot.\""
70017010-9 = "\"Purchased 3kg of potatoes. Two had sprouted, so I discarded the entire batch in the supermarket trash bin.\" #nCheck."
70017010-10 = "Next is Anna's errand. \"Go to the hardware store and buy a +5mm/-8mm screwdriver.\""
70017010-11 = "\"Purchased one -3mm screwdriver.\" Check."
70017010-12 = "Finally, mine. \"A colored pencil of a suitable color for writing on punch cards.\""
70017010-13 = "\"Purchased 12 hard oil-based RIS S 6006 colored pencils, easy to write with even on cardboard, #n5R 4/14 Carmine Red, 3.0mm lead.\" Check."
70017010-17 = "No errors on this errand either. Satisfied."
70017010-18 = "Plus, the load is light and easy to carry."
70017010-19 = "However..."
70017010-23 = "Hmm..."
70017010-27 = "Where... am I?"
70017010-33 = "Special Class 227"
70017010-39 = "Phew... that was a terrible blizzard. Thank you for saving me."
70017010-40 = "Don't worry about it. I'm used to being lost."
70017010-41 = "Compared to when I was 11, the frequency has decreased by about 10%. A good trend."
70017010-42 = "I forgot to introduce myself. I am Rana Furuhata, 12 years old. #nI am an errand expert, and my hobbies are knitting and rock climbing."
70017010-44 = "Usually, when someone gets lost, they cry or get anxious... #nThis kid is pretty composed."
70017010-45 = "I'm really glad Shigure-chan found you before the blizzard hit..."
70017010-46 = "You were just standing still in the snow, it surprised me. Are you okay?"
70017010-48 = "My pathfinding failed, so I was waiting in Idle mode."
70017010-49 = "If the Ramune-colored traveler hadn't interrupted me, #nI would have been stranded by now. Thank you."
70017010-51 = "I-interrupt...?"
70017010-52 = "Ahaha, you say funny things."
70017010-53 = "So... Rana-chan, where is your home?"
70017010-55 = "Hmm..."
70017010-62 = "(183 is a Special Class. So, strictly speaking, it's not a home.)"
70017010-63 = "(That is the place where I live with my beloved friends. #nIn other words, it is merely a structure with a group I am attached to.)"
70017010-69 = "I do not have a home."
70017010-74 = "...!"
70017010-75 = "You don't have a home!? But... you're still just a child..."
70017010-76 = "What is the Administration doing!?"
70017010-78 = "It was decided by the Administration. However, it causes no particular inconvenience."
70017010-80 = "That irresponsible brat! How could they!"
70017010-81 = "But then, where do you usually live?"
70017010-83 = "I have a place to stay. I was intending to return there."
70017010-84 = "If you take the side path by the fifth-tallest birch tree on the mountain located west of the Autonomous District, #nthere is our dwelling halfway up where the three of us live."
70017010-86 = "Thank goodness, you do have a place to live..."
70017010-87 = "I'll take you there once the blizzard stops."
70017010-91 = "Oh, we haven't introduced ourselves yet. This is Nodoka, and I'm Shigure. Nice to meet you."
70017010-93 = "Rana-chan, do you want a blanket? I also have some warm cocoa! #nIf there's anything you want, just let me know anytime!"
70017010-95 = "That is very kind of you, thank you."
70017010-99 = "The checklist I made for making friends in preparation for situations like this seems useful."
70017010-100 = "Number one... self-introduction, check. Next is \"small talk.\""
70017010-101 = "Um... what kind of place is this?"
70017010-106 = "It is similar to the place where I am currently staying. #n...They say it is good to start a conversation with light questions like this."
70017010-107 = "It is very old-fashioned, and for some reason, it is calming."
70017010-112 = "Ah, I forgot to mention. We are 22—"
70017010-113 = "!!"
70017010-120 = "Ouch! What was that!?"
70017010-121 = "?"
70017010-122 = "Ah, ahaha! Sorry, Shigure-chan! I stepped on you by mistake!"
70017010-123 = "I have to go clean this off quickly!"
70017010-124 = "Rana-chan, wait there for a second!"
70017010-125 = "Wait... Nodoka!?"
70017010-126 = "Just come here for a second!"
70017010-136 = "What's the rush?"
70017010-137 = "Shigure-chan... you can't talk about the Special Class to an elementary schooler!"
70017010-138 = "E-eh...?"
70017010-139 = "If you do that, they'll ask, \"What's a Special Class?\" won't they!"
70017010-140 = "That people who are punished get sent to a place like this after moving up a grade..."
70017010-141 = "We can't show children that kind of reality."
70017010-142 = "You're right, telling them the facts as they are might not be good."
70017010-143 = "Right? We have to give children hope that their future is bright."
70017010-144 = "Understood. \"Special Class\" is now a forbidden word."
70017010-145 = "Exactly! Zip your lips!"
70017010-146 = "Yeah, zip my lips."
70017010-152 = "Rana-chan, sorry to keep you waiting! I couldn't get the stain out, sorry about that~"
70017010-153 = "Ah, ahaha..."
70017010-155 = "You two seem to get along very well."
70017010-156 = "Since you have returned, I will disable Sleep Mode. Please answer my question."
70017010-157 = "What kind of place is this?"
70017010-159 = "Uh... w-well... hmm..."
70017010-160 = "A, a dormitory! Yes! This is a dormitory!"
70017010-161 = "The place where the two of us live!"
70017010-163 = "..."
70017010-165 = "(It's not a lie, but that's a lie that'll be found out immediately...)"
70017010-170 = "Just the two of you in such a large place. That is impressive."
70017010-171 = "It is harder to find windows that aren't broken here, just like where I am... #nI feel a sense of familiarity with that as well."
70017010-176 = "(She doesn't seem to suspect anything...!)"
70017010-177 = "Phew..."
70017010-179 = "Next, how have you been spending your time lately? #nBy the way, this is the number 2 theme on the small talk ranking."
70017010-180 = "I intend to deepen our friendship by having daily conversations."
70017010-181 = "For example, they say it is good to try and recall recent events."
70017010-182 = "What happened yesterday?"
70017010-183 = "Hmm, yesterday, huh..."
70017010-184 = "The usual, I guess. A bear broke the door and came in, so #nI shivered while managing to fix the door... and then went to sleep."
70017010-185 = "I see. Hungry bears come here as well."
70017010-187 = "Other than that... we ran out of food, so #nShigure-chan went on an errand earlier."
70017010-189 = "That is the same as my job. Having no food is also exactly the same."
70017010-190 = "Sorry, I couldn't buy the pudding Nodoka likes..."
70017010-192 = "Don't worry about it, Shigure-chan! It's hard enough just to get sweets lately!"
70017010-193 = "On top of that... we are also short on sweets."
70017010-197 = "Hmm..."
70017010-220 = "I cannot help but feel this is not someone else's problem."
70017010-221 = "I feel a great sense of kinship."
70017010-223 = "...Is that a good thing?"
70017010-224 = "Come to think of it... what are Rana-chan and these people doing?"
70017010-228 = "Are you talking about my friends?"
70017010-229 = "It is not good to speak based on speculation, but..."
70017010-234 = "They're not here either!!"
70017010-235 = "Hey, Rana? Where are you~?"
70017010-240 = "I already checked that shelf! Where could she have gone... I thought she was sleeping buried in the pile of towels..."
70017010-241 = "What about the fridge? Did you check the vegetable compartment too? #nLook, she was inside the fridge the other day saying it was hot!"
70017010-242 = "I told you I checked! The fridge is completely empty, there's no way I could have missed her!"
70017010-243 = "If everything were normal... she should have been back and taking a nap by now..."
70017010-247 = "Could she be... lost?"
70017010-248 = "With such a blizzard..."
70017010-254 = "No, no, she's probably just napping somewhere."
70017010-255 = "Y-yeah, you're right... #nLately, she's been napping inside things a lot...!"
70017010-256 = "...W-waaaaah! Rana!! Wheeeere are youuuu!!"
70017010-257 = "Calling her name won't do anything! Once that kid falls asleep, she never wakes up!"
70017010-258 = "Waaaaah! It's better than doing nothing! Rana!"
70017010-259 = "...Geez! Rana! It's snack time! Come on out!"
70017010-260 = "If it comes to this, we have to search the attic too!"
70017010-263 = "I agree."
70017010-264 = "Right about now... they are probably searching for me, opening every piece of furniture with a door."
70017010-265 = "What does that mean!?"
70017010-266 = "It's not like we're looking for a cat!"
70017010-267 = "I cannot say for certain, but... #nconsidering the patterns so far, it is likely not far off."
70017010-268 = "I didn't ask what they're doing right now, but... #nfor now, I can tell you all get along well..."
70017010-269 = "That is true. It is a bit noisy, but we spend every day happily."
70017010-270 = "..."
70017010-271 = "Is the offer of \"if there's anything you want, just let me know\" still valid?"
70017010-272 = "Yeah, it's still valid. Is something wrong?"
70017010-273 = "It is time for my routine, so I would like to lie down for a bit."
70017010-274 = "If you don't mind, could I borrow a blanket for my nap?"
70017010-279 = "Of course! I'm sure the blizzard will stop while you're napping!"
70017010-281 = "Here, a blanket. It's the one Nodoka and I usually use, so it's a bit tattered, but..."
70017010-282 = "Thank you. #nActually... I feel more at ease when things are a bit worn out, so it is fine."
70017010-283 = "Also, I would like you to tuck me in. That is also a mandatory condition for me to sleep."
70017010-284 = "Tuck you in? Got it!"
70017010-286 = "H-how cute~! Leave it to me! Would a lullaby be okay?"
70017010-287 = "Sleeep, sleeep~♪"
70017010-289 = "Fufu. Sleeep, sleeep~♪"
70017010-290 = "That is a perfect rhythm. Both of you have a talent for tucking people in."
70017010-291 = "Well then, good... night..."
70017010-292 = "...night..."
70017010-296 = "Zzz... zzz..."
70017010-301 = "There, there. Children need to sleep a lot to grow a lot."
70017010-302 = "Fufu, she seemed really tired."
70017010-303 = "She fell asleep right away."
70017010-304 = "Why does such a small child have to go through such a hard time..."
70017010-305 = "It might be unavoidable for us in the Special Class, but... #nfor a child who isn't to be living the same kind of life..."
70017010-306 = "Don't cry, you'll wake Rana up."
70017010-307 = "Sniff. S-sorry..."
70017010-308 = "I thought we were having such a hard time because we're in the Special Class, but... #nmaybe the situation is the same everywhere."
70017010-309 = "You're right. Let's do our best too. #nSince Rana, who isn't in the Special Class, is working this hard, we can't be moping around either."
70017010-310 = "Yeah...!"
70017010-314 = "In front of Special Class 183"
70017010-318 = "That is my dwelling."
70017010-324 = "Waaaaah!! Ranaaaa!!"
70017010-325 = "I missed you sooooo much!"
70017010-330 = "What happened? Both of them seem to be in a hurry."
70017010-331 = "Fufu, they were worried about Rana."
70017010-335 = "Both of you, nice to meet you! Thank you so much for taking care of Rana...!"
70017010-336 = "I had no idea where she was, and I was so worried...!"
70017010-337 = "I thought she had been kidnapped... I'm reaaaally glad...!"
70017010-342 = "Eh!? Could it be that something like that happened before!?"
70017010-344 = "No, it's not like that, but... I thought it was a possibility. #nI got worried..."
70017010-351 = "Don't pull my cheeks. They stretch."
70017010-355 = "I finished the errand. Here, the screwdriver Anna asked for."
70017010-360 = "Um... just a 3mm flathead screwdriver? #nI wanted a 5mm Phillips screwdriver and an 8mm flathead screwdriver...?"
70017010-361 = "I bought it exactly as written. \"+5mm/-8mm screwdriver,\" right?"
70017010-367 = "..."
70017010-368 = "...Yeah... thank... you."
70017010-369 = "What about the potatoes for dinner? Did you drop them somewhere?"
70017010-370 = "...Well, whatever. There's nothing more important than Rana being safe."
70017010-372 = "I bought 3kg, but #n\"if any have sprouted, throw them away\" was written, so I threw them all away."
70017010-374 = "..."
70017010-375 = "Nothing... more... important... than Rana being safe..."
70017010-377 = "What a touching reunion."
70017010-382 = "Ah, I'm late with my introduction...! I'm Anna. This is Erina!"
70017010-384 = "Nice to meet you. I'm Shigure. This is Nodoka."
70017010-386 = "Nice to meet you! We are Special Class 183—"
70017010-387 = "!!"
70017010-392 = "Ow~!!"
70017010-393 = "Hey! Why did you step on me!!"
70017010-394 = "Shhhhhh!!"
70017010-395 = "It'd be embarrassing if they found out we're in the Special Class, right!?"
70017010-396 = "O-oh, right...! I wasn't thinking. Got it!"
70017010-403 = "Um, well..."
70017010-404 = "Research? A club? Well, something like that, I guess? Ahaha..."
70017010-405 = "Haha, ahaha...!!"
70017010-407 = "A research club, that's amazing!"
70017010-408 = "(Isn't a research club an important club? #nAnd they're in such a poor environment like ours...)"
70017010-409 = "(I hope everyone's environment gets better soon...)"
70017010-415 = "...It's already this late. Another blizzard looks like it's coming, so we should head back."
70017010-416 = "Rana. Listen to your friends and get along with them."
70017010-417 = "See you later, Rana-chan! You two, let's meet again!"
70017010-419 = "Shigure-san, Nodoka-san... take care!"
70017010-421 = "Please be careful not to get lost."
70017010-423 = "Isn't that something you shouldn't be saying, Rana?"
70017010-431 = "Still... that's amazing, Rana! You made new friends!"
70017010-433 = "Friends?"
70017010-434 = "We introduced ourselves, drank warm cocoa while talking... #nwe took a nap together, and promised to meet again."
70017010-435 = "Fufu. I think you can call that being friends."
70017010-436 = "So, how was it? The people outside the Special Class?"
70017010-438 = "That's great~! You talked about the latest trendy sweets and fashion, right!"
70017010-440 = "What about the dorm? I proposed a new construction method, so it must have been quite comfortable, right?"
70017010-444 = "..."
70017010-445 = "They're the same as us. Living in a place like a ruin, fighting bears... shivering from the cold and hunger."
70017010-446 = "...Eh?"
70017010-447 = "They can't eat sweets, and they only have one blanket."
70017010-452 = "No way~!? It's impossible that they're the same as us!!"
70017010-454 = "Even though we worked so hard on our research, they're still living like that!?"
70017010-455 = "That's how it is."
70017010-456 = "I thought only the Special Class was this harsh, but the situation was the same even when I went outside."
70017010-460 = "This academy might be hopeless."
70017010-463 = "183 vs 227"
