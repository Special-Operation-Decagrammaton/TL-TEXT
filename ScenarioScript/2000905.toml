[translation]
2000905-1 = "Водонепроницаемые усы"
2000905-2 = ""
2000905-3 = "Хи-хи-хи!"
2000905-4 = "[s] «Ты в хорошем настроении.»"
2000905-5 = "Ну, я придумала отличное решение проблемы, которая давно меня беспокоила."
2000905-6 = "И всё благодаря тому, что товарищ рассказал мне недавно в MomoTalk."
2000905-7 = "За помощь я награждаю тебя особой Медалью усатых знаний."
2000905-8 = "Почувствуй себя польщённым, товарищ!"
2000905-9 = "[s1] «Если это то, о чём я говорил в прошлый раз, тогда это...»\n[s2] «Почему лебеди не тонут в воде?»"
2000905-10 = "После твоих слов я сразу же изучила всё про лебедей."
2000905-11 = "После твоих слов я сразу же изучила всё про лебедей."
2000905-12 = "Как ты и сказал, лебеди могут держаться на воде благодаря жиру из перьев возле хвоста!"
2000905-13 = "Кроме того, благодаря блестящему жиру их перья становятся ещё более сияющими и белыми. Не будет преувеличением сказать, что сама власть лебедя исходит от масла!"
2000905-14 = "[s] «И какое это имеет отношение к тебе, Черино?»"
2000905-15 = "Честно говоря, мне не слишком нравилось сидеть в горячем источнике."
2000905-16 = "И даже не из-за того, что я уставала от горячей воды: мои усы — символ моей власти — намокали."
2000905-17 = "Мало того что мокрые усы выглядят плохо, так ещё и клей ослабевал, и усы могли отвалиться."
2000905-18 = "Я-Я имею в виду, они не отваливались! Просто отсыревали! Потому что они совершенно настоящие и совсем не поддельные!"
2000905-19 = "В любом случае! После долгих исследований я наконец нашла революционный способ наслаждаться ванной и не мочить усы."
2000905-20 = "И это..."
2000905-21 = "...by putting oil on my mustache!"
2000905-22 = "Если я щедро намажу усы маслом, как перья лебедя, они не намокнут. И сохранят великолепную форму даже в ванне."
2000905-23 = "К тому же масло заставит мои усы сиять ещё ярче, усиливая мою власть!"
2000905-24 = "Хи-хи, не могу дождаться, когда студенты увидят мои великолепные блестящие усы и поразятся исходящей от меня власти."
2000905-25 = ""
2000905-27 = ""
2000905-28 = ""
2000905-29 = "А теперь я начинаю наносить масло!"
2000905-30 = "Обмакнуть кисть в масло и нанести немного на усы..."
2000905-31 = ""
2000905-33 = ""
2000905-34 = ""
2000905-35 = ""
2000905-36 = "Аргх! Как же раздражает!"
2000905-37 = ""
2000905-39 = ""
2000905-40 = ""
2000905-41 = "Так я буду наносить масло целую вечность!"
2000905-42 = "Если оставить усы в бутылке с маслом, оно само как следует пропитает их, верно?"
2000905-43 = "[s] «Твои совершенно настоящие усы отвалились.»"
2000905-44 = "Не обращай внимания на мелочи, товарищ!"
2000905-45 = "А теперь я вздремну, а тебе приказано охранять мои усы!"
2000905-46 = ""
2000905-48 = ""
2000905-51 = "Ну что, мои водонепроницаемые усы наконец готовы?"
2000905-52 = "Любуйся их великолепием — они пропитаны маслом и блестят. Когда я надену эти усы, студенты будут поражены властью, исходящей от меня!"
2000905-53 = "А теперь примерю их."
2000905-54 = ""
2000905-56 = ""
2000905-57 = ""
2000905-58 = ""
2000905-59 = "Воняет!"
2000905-60 = ""
2000905-62 = ""
2000905-63 = ""
2000905-64 = "Ч-Что это, товарищ?! Мои усы воняют!"
2000905-65 = "Запах щиплет нос! У меня голова болит!"
2000905-66 = "[s] «...Ты использовала кунжутное масло?»"
2000905-67 = "Н-неужели?"
2000905-68 = "Но когда я только получила бутылку, запах не был таким сильным..."
2000905-69 = "[s] «Ну, усы ведь находятся прямо под носом.»"
2000905-70 = "Ух, что же делать? Я даже не подумала о таком исходе и не взяла запасные усы."
2000905-71 = "Я не могу носить эти вонючие усы..."
2000905-72 = "[s] «Пока что придётся пожить без усов...»"
2000905-73 = "Подумать только: я, Великий лидер и уважаемый президент студсовета Красной Зимы, проведу отпуск без усов."
2000905-74 = "Это просто невозможно!"
