[translation]
1000805-1 = "Визит Нэру"
1000805-2 = "Шале, комната Сенсея"
1000805-3 = "(Теперь простудился уже я и едва могу двигаться.)"
1000805-4 = "Как раз когда я подумал позвать кого-нибудь на помощь..."
1000805-5 = "*динь-дон*"
1000805-6 = "...?"
1000805-7 = "[s1] «Кто там?»\n[s2] Проигнорировать."
1000805-8 = "*грохот*"
1000805-9 = "*грохот*"
1000805-10 = "...?!"
1000805-11 = "(Дверь взорвалась.)"
1000805-13 = ""
1000805-14 = ""
1000805-15 = "Хе. Вот ты где."
1000805-16 = ""
1000805-17 = "Эй, Сенсей."
1000805-18 = "Я услышала, что ты заболел! Примчалась сюда так быстро, как смогла."
1000805-20 = "[ns3] «Кто тебе сказал?»\n[ns4] «А как же школа? Я думал, у тебя и так едва хватает посещаемости.»"
1000805-21 = "Пф. Не переживай."
1000805-22 = "Пф. Не переживай."
1000805-23 = "Ну и что, что с посещаемостью у меня всё не очень?"
1000805-24 = "Я не могу спокойно сидеть на уроках, зная, что ты болеешь."
1000805-25 = "В общем, вот. Лекарство и еда."
1000805-26 = "Я же сказала, что отплачу тебе."
1000805-27 = "Сегодня тот самый день!"
1000805-29 = "Простужаются только слабые, Сенсей."
1000805-30 = "...Я? Простудилась на прошлой неделе?"
1000805-31 = "Понятия не имею, о чём ты."
1000805-32 = "Неважно. Выкинь всё остальное из головы."
1000805-33 = "Я пришла поставить тебя на ноги!"
1000805-34 = "[s5] «У меня плохое предчувствие...»\n[s6] «Пожалуйста. Просто отпусти меня в больницу.»"
1000805-35 = "Да брось! Просто доверься мне."
1000805-36 = "Да брось! Просто доверься мне."
1000805-37 = "Ты разве не знаешь, что я президент Клуба горничных?"
1000805-38 = "В Миллениуме моим навыкам горничной нет равных."
1000805-39 = "А значит, и ухаживать за больными я умею лучше всех!"
1000805-40 = "Ну да, практического опыта у меня нет... Вообще-то, я всего один раз проходила симуляцию."
1000805-41 = "[s7] «Симуляция...?»\n[s8] «Только один раз?»"
1000805-42 = "Первым делом сварим тебе кашу."
1000805-43 = "Первым делом сварим тебе кашу."
1000805-44 = "[s] Это не предвещает ничего хорошего..."
1000805-46 = "(Тридцать минут спустя...)"
1000805-47 = "Вот! Готово!"
1000805-48 = "Я не слишком долго заставила ждать?"
1000805-49 = "Это фирменная «Энергокаша Микамо Нэру»!"
1000805-50 = "Она гарантированно вылечит твою простуду."
1000805-51 = "[s] «Почему она красная и кипит?»"
1000805-52 = "Хахаха! Я добавила туда кучу особого перца!"
1000805-53 = "Всех секретов рецепта не раскрою, но калорий там более чем достаточно."
1000805-54 = "[s] «Это может стать моей последней трапезой...»"
1000805-55 = "Хватит ныть! Только маленькие дети так перебирают едой. Ты здесь взрослый, Сенсей!"
1000805-56 = "К тому же я уже испытывала этот рецепт на одной из участниц клуба, и ей очень понравилось."
1000805-57 = "[s9] Есть.\n[s10] Есть!\n[s11] Есть...?"
1000805-58 = "(Другого выбора у меня нет.)"
1000805-59 = "(Другого выбора у меня нет.)"
1000805-60 = "(Другого выбора у меня нет.)"
1000805-61 = "*глоть*"
1000805-62 = "...?"
1000805-63 = "[s12] «Это... вкусно?!»\n[s13] Подпрыгнуть от радости."
1000805-64 = "Хаха! Я же говорила, что вкусно!"
1000805-65 = "Хаха! Я же говорила, что вкусно!"
1000805-66 = "Звание президента Клуба горничных у меня не просто для красоты."
1000805-68 = "Острая каша вылечила мою простуду и заставила как следует пропотеть."
