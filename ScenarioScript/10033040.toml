[translation]
10033040-1 = "Эпизод 4;Легко, правда?"
10033040-2 = "Это следующая остановка нашего маршрута! Здесь вы познакомитесь с традиционными ремёслами Хяккияко!"
10033040-3 = "У вас будет возможность слепить уникальные творения из этой прекрасной белой глины, которую добывают здесь, у нас."
10033040-4 = "Это одна из самых известных гончарных мастерских Хяккияко, поэтому их изделия очень популярны в качестве сувениров."
10033040-5 = "Поначалу с глиной может быть трудно, но почувствуйте её пальцами и позвольте ей обратиться к вашему творчеству—"
10033040-6 = ""
10033040-9 = ""
10033040-10 = "Короче, можно слепить всё, что нам вздумается?"
10033040-11 = "Круто! Я сделаю башню с двумя огромными руками!"
10033040-12 = "Почему у твоей башни лицо? Тупо выглядит."
10033040-14 = "Ты душишь мой художественный стиль! Я ещё лица сзади и сверху добавлю..."
10033040-15 = "И последний штрих — руки!"
10033040-17 = "...У тебя дома всё хорошо?"
10033040-18 = "Так и должно быть дерзко, ясно?!"
10033040-20 = "Но моя всё равно круче. Она как... гибрид медузы и амёбы... О! И я добавлю ей ноги динозавра!"
10033040-21 = "Э-эм. Все?! Что вы..."
10033040-22 = "[ns1] «Это очень далеко от традиционного...»\n[ns2] «Вы уверены, что это нормально?»"
10033040-25 = "Хахаха. Они выражают собственную культуру с уникальной точки зрения."
10033040-26 = "Культура расцветает именно при таком обмене идеями. Сегодняшнее открытие — завтрашняя культура."
10033040-28 = "Смотрите! Я использовала глину, чтобы соединить дымовую гранату с белым фосфором и ручную гранату. Но будто не хватает изюминки..."
10033040-29 = "Нужна подставка... Эта противотанковая мина хорошая и плоская, будет идеальным основанием."
10033040-30 = "Неплохо, неплохо. Если я просто смешаю напалм и эти осколочные снаряды..."
10033040-31 = "Но, эм, это вообще можно назвать «декоративно-прикладным искусством»?"
10033040-32 = "Я однажды прочитала в книге: настоящее искусство взрывоопасно!"
10033040-34 = "[ns] «Мы всё ещё считаем, что всё нормально?!»"
10033040-35 = "Э-эм...!"
10033040-37 = "Что ты задумала, Кирара?"
10033040-38 = "Хм! Может, маленькую сумочку? Глиняная сумочка будет на пике моды!"
10033040-39 = "Очень в твоём стиле... Сенсей? Почему вы вдруг так счастливы?"
10033040-40 = "[s3] «Ты такая нормальная... Это исцеляет меня...»\n[s4] «Ты как чашка горячего шоколада холодным зимним днём.»"
10033040-43 = "Хахаха! Вы всегда говорите самые странные вещи, учитель!"
10033040-45 = "Я-я не специалист по взрывчатке, но разве это не взорвётся, если обращаться неправильно?"
10033040-47 = "Успокойся! В этой смеси так мало топлива, что она просто прогорит, как маленький костёр. Чтобы что-то случилось, понадобилось бы гора-а-аздо больше окислителя."
10033040-48 = "И она того же цвета, что белая глина! Значит, идеально подходит для этой мастерской, да?"
10033040-50 = "Зачем ты вообще принесла сюда взрывчатку?!"
10033040-51 = ""
10033040-54 = ""
10033040-55 = "Студенты Геенны, если уж что-то и можно о них сказать, то они... свободолюбивые. Хаха."
10033040-56 = "Поэтому Сенсей и здесь, верно? Вы справитесь!"
10033040-57 = "[s] «Я правда стараюсь...»"
10033040-59 = "Мне очень нравится этот меч, который ты сделала! Он напоминает символ линчевателей, который я видела в фильме!"
10033040-60 = "Не знаю насчёт всего этого, я просто скопировала украшение, которое увидела по дороге сюда."
10033040-61 = "Но он супер-крутой! Давай я дополню тему вот этим воином-жуком-геркулесом!"
10033040-62 = "Воин-жук-геркулес... Ты правда пытаешься меня переплюнуть?! Тогда я отвечу генералом-жуком-оленем!"
10033040-64 = "*зевает* Не забывайте следить... за временем... Хр-р."
10033040-65 = "Ох! Точно... Нужно придерживаться расписания! Маршрут!"
10033040-67 = "Все с головой ушли в творчество, когда внезапно..."
10033040-68 = ""
10033040-69 = "Сейчас!"
10033040-70 = ""
10033040-74 = "[ns] «А? Те куклы, которые стояли у входа...»"
10033040-75 = "...только что начали двигаться?!"
10033040-76 = "О-они идут сюда!"
10033040-77 = "Ах! Я видела очень похожую сцену в «Жизнь кота-мафиози: Ночь оживших кукол»! Там была кровавая вражда с зомби-линчевателями."
10033040-79 = "Ого. Безумие. Эти штуки двигаются сами по себе."
10033040-80 = "Наверное, это часть программы."
10033040-81 = ""
10033040-83 = ""
10033040-85 = "Куда вы идёте? Пожалуйста, не уходите от группы, никого не предупредив!"
10033040-86 = "До следующей остановки осталось всего двадцать три минуты. У нас просто нет времени дурачиться!"
10033040-87 = "Н-но что насчёт двигающихся кукол?"
10033040-88 = "Что? Каких двигающихся кукол?"
10033040-89 = ""
10033040-93 = "А?! Почему они двигаются?! Я такого не планировала. Пина, это ты устроила?"
10033040-95 = "О-о, давайте попробуем потрогать одну. Может, она проклята."
10033040-96 = "У нас ещё есть взрывчатка? Надо их взорвать и посмотреть, что будет!"
10033040-98 = "Им вообще всё равно?! Что это за люди такие?"
10033040-99 = "Я посвятил почти всю жизнь этой мастерской и никогда не видел ничего подобного!"
10033040-100 = ""
10033040-102 = ""
10033040-103 = "Я поняла! Тайна раскрыта!"
10033040-104 = "[ns] «Откуда здесь взялся Отдел горячих источников?!»"
10033040-106 = ""
10033040-107 = "Хи-хи-хи. К счастью для вас, нас не так легко провести, как этих остальных болванов!"
10033040-108 = "Наша президент Касуми, к сожалению, не смогла прийти, поскольку сейчас скрывается от властей...! Кхм! То есть занимается другими деловыми проектами."
10033040-109 = "Но будь она здесь, она наверняка сказала бы что-нибудь вроде: «Горячие источники повсюду! Никогда не отказывайтесь от мечты о горячих источниках!»"
10033040-110 = ""
10033040-113 = ""
10033040-114 = "Именно так!"
10033040-115 = ""
10033040-117 = ""
10033040-120 = "[ns] «К чему ты вообще ведёшь...?»"
10033040-121 = "Ответ прямо перед носом! Ну же, подумайте! Как эти безжизненные куклы могли ожить?!"
10033040-122 = "Под этой самой землёй наверняка проходят жилы горячих источников, настолько мощные, что способны поднимать неодушевлённые предметы!"
10033040-124 = "...Наверное?"
10033040-125 = "[s] «Мне совсем не нравится, куда ты ведёшь!»"
10033040-127 = ""
10033040-128 = "Где есть горячие источники — там и мы! Даже если горячих источников нет — мы всё равно там!"
10033040-129 = "Где текут жилы — там мы начинаем разработку!"
10033040-130 = "Но что делать со всеми куклами, когда строительство закончится?"
10033040-131 = "Я придумала! Они станут маленькими талисманами нашего прекрасного курорта горячих источников!"
10033040-132 = ""
10033040-134 = ""
10033040-135 = "У Мэгу всегда лучшие идеи!"
10033040-136 = "Время разработки! Тащите буровые установки! Всё оборудование! Бах, бам!"
10033040-137 = ""
10033040-139 = ""
10033040-140 = "Горячие источники! Горячие источники!!"
10033040-142 = "Хочешь сказать, мне противостоит целая куча сумасшедших?"
10033040-144 = "Ну вот, понеслись."
10033040-145 = "Хахаха! Они прекрасно умеют подвергать опасности всех вокруг!"
10033040-147 = "Нет. Такими темпами... Такими темпами всё...!"
10033040-148 = "..."
10033040-149 = "Всё происходит не просто так, верно?"
10033040-150 = "Значит, это сама вселенная открывает перед нами новую эпоху культуры! И для меня огромная честь стать частью этого космического урока!"
10033040-151 = "Это правда, совершенно точно..."
10033040-152 = "[ns] «...не то, что здесь происходит!»"
10033040-154 = "[ns] «Нужно что-то делать. Команда экскурсоводов, сбор!»"
10033040-156 = "Д-да! Сенсей!"
10033040-157 = "Мы должны встречать сложные проблемы лицом к лицу! Я поставлю жизнь на кон ради этой миссии, Сенсей!"
10033040-158 = "Вааа! Слава богу, Сенсей здесь!"
10033040-159 = "Хоп! Похоже, моя очередь. Все... стойте позади меня."
10033040-161 = "Йо-хо! Учитель! Умика! Считайте нас почётными членами команды экскурсоводов!"
10033040-162 = "У меня закончились отговорки..."
10033040-163 = "[s] «Эрика? Кирара?»"
10033040-165 = "Мы рассчитываем, что вы приструнёте Отдел горячих источников, Сенсей."
10033040-166 = "А на нас можете рассчитывать, чтобы собрать остальных студентов Геенны!"
