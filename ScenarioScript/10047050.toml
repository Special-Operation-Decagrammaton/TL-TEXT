[translation]
10047050-1 = "Эпизод 5;Появляется нечто проклятое"
10047050-2 = "После экскурсии мы вернулись в их общежитие."
10047050-4 = "Для правильного призыва сначала нужно создать подходящую... атмосферу."
10047050-5 = ""
10047050-7 = ""
10047050-8 = ""
10047050-9 = "[ns] «Д-Думаю, атмосферы и так более чем достаточно...»"
10047050-10 = "Сенсей, любите хорошие школьные страшилки?"
10047050-11 = "Потому что... в этом общежитии есть несколько секретных правил. Посторонним о них знать нельзя, но..."
10047050-12 = "Я немного почитаю. Хотите послушать?"
10047050-13 = "[ns] Кивнуть."
10047050-14 = "Хех, тогда начнём."
10047050-15 = ""
10047050-17 = ""
10047050-18 = "Особые правила общежития, глава №13"
10047050-19 = "В этой тринадцатой главе содержатся крайне важные инструкции. Мы создали этот раздел, чтобы каждый студент Вайлдханта жил в безопасности и добром здравии..."
10047050-20 = "Особые обстоятельства потребовали добавить эту главу. Студенты, пожалуйста, соблюдайте следующие правила."
10047050-21 = ""
10047050-23 = ""
10047050-24 = ""
10047050-25 = ""
10047050-26 = "№1. При использовании красного телефона в вестибюле первого этажа запрещается последовательно нажимать 6."
10047050-27 = "Ни один телефонный номер в академии Вайлдхант не содержит нескольких шестёрок подряд, поэтому не поддавайтесь искушению."
10047050-28 = "Если вы всё же нажали 6 несколько раз подряд, немедленно бегите на чердак, примите защитную позу и прячьтесь как можно лучше не менее десяти минут."
10047050-29 = "Кто бы ни стучал, кто бы ни звал вас по имени, не отвечайте."
10047050-30 = ""
10047050-32 = ""
10047050-33 = "Потому что тот, кто вас зовёт... не тот, кого вы знаете."
10047050-34 = "[ns] «А...»"
10047050-35 = "Дайте мне прочитать №2!"
10047050-36 = ""
10047050-38 = ""
10047050-39 = "Центральная лестница предназначена исключительно для Совета префектов. Всем остальным студентам запрещено пользоваться этими ступенями."
10047050-40 = "Просим продолжать сотрудничать, поскольку это правило необходимо для беспрепятственного движения."
10047050-41 = "Не следуйте никаким противоречащим указаниям. Главное — не пользоваться этой лестницей."
10047050-42 = "[s] «А это правило о чём?»"
10047050-43 = "Ню-ху-ху, кто знает?"
10047050-44 = "Не воспринимай всерьёз. Она раздувает проблему из ничего."
10047050-45 = "Хи-хи... Тогда, может, ты прочитаешь №3, Рэна...?"
10047050-47 = ""
10047050-49 = ""
10047050-50 = "П-Почему я?"
10047050-51 = "Ты же сказала, что это... «ничего», да? Тогда тебе не составит труда прочитать...?"
10047050-52 = "Цк, ты просто пытаешься меня дразнить!"
10047050-53 = "Ладно! Принимаю вызов! Всё равно никакого оккультизма не существует..."
10047050-54 = ""
10047050-56 = ""
10047050-57 = ""
10047050-58 = "№3. Раз в год в этом общежитии проводятся учебные эвакуации."
10047050-59 = "Учения предназначены для подготовки к чрезвычайным ситуациям, поэтому некоторые выходы и лестницы временно блокируются, имитируя реальную аварийную ситуацию."
10047050-60 = "Поэтому студентам рекомендуется пользоваться центральной лест— ...А?"
10047050-61 = "[s1] «Погоди, а как же...?»\n[s2] «Я думал, этой лестницей пользоваться нельзя...»"
10047050-62 = ""
10047050-63 = ""
10047050-65 = ""
10047050-66 = "Рэна... У тебя ведь были учебные эвакуации, когда ты сюда поступила, да?"
10047050-67 = "Да..."
10047050-68 = "Какой лестницей ты пользовалась...?"
10047050-69 = "Кажется, центральной..."
10047050-70 = ""
10047050-72 = ""
10047050-73 = ""
10047050-74 = "Хи-хи, Рэна нарушила второе правило..."
10047050-75 = "А... Тогда, может быть...? Возможно, именно поэтому призрак выбрал тебя! Ты проклята!"
10047050-76 = "Н-Не может быть! Не говори ерунды!"
10047050-77 = "К тому же! Я была на той лестнице не одна! А остальные ничего такого не слышали..."
10047050-78 = "Хи-хи..."
10047050-79 = "Тогда позвольте прочитать последнее правило..."
10047050-80 = ""
10047050-82 = ""
10047050-83 = "№4... И наконец―"
10047050-84 = "Когда вы дочитали все правила до этого пункта... пожалуйста, уничтожьте эту главу, сжёгши её."
10047050-85 = "Если вы не можете выполнить это требование... воспользуйтесь красным телефоном в вестибюле первого этажа и наберите добавочный 666."
10047050-86 = "Вскоре прибудет специалист и поможет с уничтожением."
10047050-87 = "[s3] «Но в Вайлдханте не используют номера с несколькими шестёрками подряд?»\n[s4] «Тогда кто придёт и откуда??»"
10047050-88 = ""
10047050-89 = ""
10047050-91 = ""
10047050-92 = "Э-Это бессмыслица!"
10047050-93 = "Где вы вообще нашли такую странную штуку? Просто выбросьте!"
10047050-94 = "Ну а если выбросим в мусор, кто знает, что случится?"
10047050-95 = "Да... Поэтому... нам следует её сжечь..."
10047050-96 = "И провести особый ритуал..."
10047050-97 = ""
10047050-99 = ""
10047050-100 = "Так вот что вы планировали с самого начала!"
10047050-102 = "Ню-ху-ху, похоже, мы достигли идеальной атмосферы."
10047050-103 = "Итак, теперь мы как следует начнём ритуал призыва демона!"
10047050-104 = "Мастер! Вы ведь поможете, правда?"
10047050-105 = ""
10047050-107 = ""
10047050-108 = "Отказаться нельзя... Хи-хи!"
10047050-109 = "[ns5] «Вы пригласили меня внутрь...»\n[ns6] «Но не позволите уйти...?»"
10047050-112 = "А теперь я нарисую магический круг для призыва!"
10047050-113 = "[s] «Где ты собираешься его рисовать?»"
10047050-114 = "Мастер. Что вы думаете о числе 4?"
10047050-115 = "Разве оно не кажется зловещим и жутким? Пугающим?"
10047050-116 = "У нас больше всего четвёрок во всём кампусе."
10047050-117 = "Поэтому призыв проведём здесь, в общежитии 4, блоке 404."
10047050-118 = "[s] «А здания 6, блока 606 нет...?»"
10047050-119 = "К сожалению, нет. Было бы забавно."
10047050-120 = "В любом случае именно поэтому... эта комната лучше всего подходит для призыва демона."
10047050-121 = "Лучшего места я придумать не могу!"
10047050-122 = "Что? Ты собираешься рисовать на полу нашей комнаты? Мы здесь ЖИВЁМ!"
10047050-123 = "Ню-ху-ху, не волнуйся. Я всё идеально смешала. Вам ничего не угрожает."
10047050-124 = "Будет всего лишь хлопок и облачко дыма."
10047050-125 = "Это ещё и взрывоопасно?!"
10047050-126 = "Хех, разве тебе не любопытно, Рэна? Не хочешь узнать, что произойдёт, если она нарисует глиф и... мы проверим, появится ли демон?"
10047050-127 = "Нет! Всё в порядке!"
10047050-128 = "Мне... любопытно..."
10047050-129 = ""
10047050-131 = ""
10047050-132 = "Может... попробуем...?"
10047050-133 = "Кар..."
10047050-134 = "Мяу..."
10047050-135 = "Даже животные этого ждут?!"
10047050-136 = "Рэна..."
10047050-137 = "Угх...!"
10047050-138 = ""
10047050-140 = ""
10047050-141 = ""
10047050-142 = "Л-Ладно! Делайте что хотите, начинайте! Но мне лучше не пострадать."
10047050-143 = "И если сломаете хоть одну мою вещь, будете платить! С процентами!"
10047050-144 = "Ню-ху-ху, спасибо! Как и ожидалось от нашей дорогой Рэны!"
10047050-146 = "И работа началась..."
10047050-147 = ""
10047050-148 = ""
10047050-149 = ""
10047050-150 = "О... Я никогда раньше не видела такой рисунок... Где ты этому научилась...?"
10047050-151 = "Это уникальный магический круг моего собственного создания, основанный на древней нумерологии."
10047050-152 = "Хи-хи, какое вдохновение!"
10047050-153 = "Пусть я ничего не понимаю, выглядит впечатляюще!"
10047050-154 = "Хватит её подбадривать!"
10047050-156 = "Несколько мгновений спустя..."
10047050-157 = ""
10047050-158 = ""
10047050-159 = "Наконец магический круг завершён."
10047050-160 = "Теперь наложим заклинание и завершим ритуал."
10047050-161 = ""
10047050-163 = ""
10047050-164 = ""
10047050-166 = "Кхм. Пх'нглуи... Мглв'нафх..."
10047050-167 = "Погоди! Стой! Это слишком опасное. Не надо."
10047050-168 = "Не понравилось? Тогда..."
10047050-169 = ""
10047050-171 = ""
10047050-173 = "Асура Балбалта...!"
10047050-174 = "Ты ЭТИМ собираешься призвать демона?"
10047050-175 = "Рэна... Ты знаешь о заклинаниях больше, чем я думала..."
10047050-176 = "Так ты просто... притворяешься... что оккультизм тебе не нравится?"
10047050-177 = ""
10047050-179 = ""
10047050-180 = ""
10047050-181 = "З-Замолчи! Когда постоянно рядом со старшими вроде вас, невольно подхватываешь всякое на слух."
10047050-182 = "Хм, тогда как насчёт того, чтобы вместо классики прочитать оригинальное заклинание?"
10047050-183 = ""
10047050-185 = ""
10047050-186 = "Страж рассвета, следующий указаниям Арканы."
10047050-187 = "Судьба, жаждущая завтрашнего дня и идущая по пути света."
10047050-188 = "Собери все желания и призови запретное пламя. Услышь мой зов и воплотись на этой земле!"
10047050-190 = ""
10047050-192 = ""
10047050-193 = "Пробудись, Пылающее Семя!!"
10047050-194 = "П-Пылающее?! Это...!"
10047050-195 = ""
10047050-198 = "О... Я думала, будет лишь немного дыма. Неплохой такой взрыв получился, да?"
10047050-199 = "Может, я слишком усердно тренируюсь...?!"
10047050-201 = ""
10047050-206 = ""
10047050-207 = ""
10047050-208 = ""
10047050-209 = ""
10047050-211 = "Вы! Что здесь происходит?!"
10047050-213 = "А-а...! Проклятый нас догнал!"
10047050-214 = "[s] «...Так „Проклятым“ всё это время был Совет префектов?»"
10047050-215 = "Наш... величайший враг прибыл."
10047050-216 = "Хех. Каждому успеху предшествует испытание."
10047050-217 = "Но не сдавайтесь. Мы должны помнить, что смелый..."
10047050-218 = ""
10047050-220 = ""
10047050-221 = ""
10047050-222 = "...дух..."
10047050-223 = "...это единственное, что важно."
10047050-224 = "Ой, да хватит уже!"
10047050-225 = "А! Всё кончено! Всё. Всё испорчено..."
10047050-226 = "И они ещё кричали в художественной галерее!"
10047050-228 = "Совет! Заберите их!"
10047050-229 = ""
10047050-231 = ""
10047050-232 = ""
10047050-233 = ""
10047050-235 = "[ns] «А-А? Меня тоже...?»"
10047050-236 = "Для правил исключений нет!"
10047050-238 = ""
10047050-243 = "Меня арестовали вместе с Оккультным обществом."
