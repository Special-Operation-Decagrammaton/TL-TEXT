[translation]
3403-1 = "Слегка необычное утро в Шаньхайцзин 3"
3403-3 = "..."
3403-4 = "..."
3403-5 = "[ns] «Ч-Что... здесь... происходит...?»"
3403-6 = "Разве сегодня я не должна была делать утреннюю зарядку с детьми из Сада цветущей сливы и инструктором Коконой?"
3403-7 = "Кокона...? Госпожа...? Что происходит...?"
3403-10 = ""
3403-11 = ""
3403-14 = ""
3403-15 = ""
3403-17 = ""
3403-18 = ""
3403-20 = ""
3403-21 = ""
3403-23 = ""
3403-24 = "Президент Кагуя...? Что привело сюда Клуб пекинской оперы...?"
3403-25 = "Вообще-то это мой вопрос. Почему здесь Рэйдзё с Променада Чёрной Черепахи и Клуб исследования боевых искусств?"
3403-26 = "Это самое странное совпадение, какое я когда-либо видела."
3403-27 = "Соглашусь. Скитаться по миру, словно ряска, вернуться и встретить... вот это действительно можно назвать «совпадением»."
3403-28 = "Как бы то ни было, ладно. У меня и Клуба исследования боевых искусств здесь есть дело."
3403-29 = "Как и у Клуба пекинской оперы. Мне ещё раз произнести слово «совпадение»?"
3403-30 = ""
3403-32 = ""
3403-34 = "Я, Каяма Рэйдзё, и Клуб исследования боевых искусств! С сегодняшнего дня присоединяемся к тренировкам госпожи по кунг-фу!"
3403-35 = "Клуб пекинской оперы! С сегодняшнего дня будет всеми силами помогать госпоже в тренировках пекинской оперы!"
3403-36 = "Что?"
3403-37 = "А?"
3403-38 = ""
3403-41 = ""
3403-42 = "...Что?"
3403-44 = "Нет-нет. Вы всё совершенно неправильно поняли. Президент каждый день рано утром здесь, в Парке Белого Тигра, практикует кунг-фу."
3403-45 = "Похоже, ошибаешься именно ты, Рэйдзё. Президент занимается пекинской оперой... а точнее, танцем пекинской оперы."
3403-47 = "Нет, я просто—"
3403-49 = "Не знаю, откуда ты услышала эти беспочвенные слухи, но это кунг-фу. Поэтому Клуб исследования боевых искусств и пришёл сюда со мной."
3403-50 = "Это ты распространяешь ложные слухи, Рэйдзё. Это совершенно точно танец пекинской оперы. Разве ты не видишь перед собой весь Клуб пекинской оперы?"
3403-52 = "Сенсей...? Госпожа...?"
3403-54 = "Ложные слухи?! Боюсь, это ты ошиблась адресом! Я знаю, что права, потому что..."
3403-55 = "...видела всё собственными глазами!"
3403-57 = "Что ты такое говоришь? Ты не можешь быть права, ведь у меня то же самое доказательство!"
3403-58 = "Я лично видела, как президент практиковала танец пекинской оперы!"
3403-60 = "[ns] «А. Кажется, я поняла, что произошло.»"
3403-61 = "Ты полностью ошибаешься! Это точно было кунг-фу!"
3403-62 = "Движение, которым отражают атаки врага! Безупречный переход для подготовки следующего приёма! Я даже видела, как она встала в защитную стойку, готовясь к засаде!"
3403-63 = ""
3403-65 = ""
3403-66 = ""
3403-67 = "Если ты утверждаешь, что это не кунг-фу..."
3403-68 = "...то получается, весь тяжёлый труд и усилия, которые вложили мы с Клубом исследования боевых искусств, были бессмысленны!"
3403-69 = ""
3403-72 = ""
3403-73 = ""
3403-74 = ""
3403-76 = "(Опасно... Я едва не ответила: «Именно! Так и есть!»)"
3403-77 = "Это уже не совпадение, а судьба. Я могу сказать нечто столь же весомое, Рэйдзё!"
3403-78 = "Годы преданности пекинской опере. Дни тренировок ради одной цели. То, что мы естественным образом обрели благодаря всей этой самоотдаче, можно назвать «проницательностью»."
3403-79 = "Если ты посмеешь сказать, что это не танец пекинской оперы, значит мы с Клубом пекинской оперы, посвятившие себя ей..."
3403-80 = "...впустую потратили всю свою жизнь!"
3403-81 = ""
3403-84 = ""
3403-85 = ""
3403-86 = "(...! Опасно. Я чуть не ответила: «Разве это не правда?»)"
3403-87 = ""
3403-89 = ""
3403-90 = ""
3403-92 = ""
3403-93 = "У тебя вообще глаза есть? Как это может быть танцем оперы?"
3403-95 = ""
3403-96 = "По-моему, это тебе нужны корректирующие очки! Разве это похоже на какой-то дикий боевой ритуал?"
3403-98 = "Это КУНГ-ФУ!"
3403-99 = "Нет! Это ПЕКИНСКАЯ ОПЕРА!"
3403-100 = ""
3403-102 = ""
3403-103 = "Это... ни то ни другое..."
3403-104 = "А? Госпожа, пришло ещё больше людей..."
3403-105 = "Что?"
3403-106 = ""
3403-108 = ""
3403-110 = ""
3403-111 = ""
3403-114 = ""
3403-115 = ""
3403-116 = ""
3403-117 = "Ого, это и правда президент! Президент здесь! Смотрите!"
3403-118 = "Обычно даже мельком её увидеть сложно, а вот она."
3403-119 = "Кстати, Генрюмон нас за это не отругает или типа того?"
3403-120 = "Похоже, Генрюмон тоже пришёл посмотреть."
3403-122 = "Как восходит и заходит солнце, так многие падут. Просто сегодня настал наш черёд..."
3403-123 = "Что бы вы ни делали и где бы ни были, я, Коноэ Мина... буду следовать за вами до самого конца!"
3403-124 = ""
3403-127 = ""
3403-128 = "...Вообще-то никто не пал...?"
3403-129 = "Тсс! Если укажешь на это, она и правда сделает так, что кто-нибудь из нас падёт!"
3403-131 = "Генрюмон здесь ради вас, госпожа президент!"
3403-132 = "Что бы госпожа президент ни делала... кунг-фу, пекинская опера или что угодно ещё!"
3403-133 = "Генрюмон будет помогать вам до последнего вздоха!"
3403-134 = ""
3403-137 = ""
3403-138 = "Я не очень понимаю, о чём сейчас говорит исполнительный офицер, но воспользуюсь шансом и сфотографирую госпожу..."
3403-139 = ""
3403-142 = ""
3403-144 = ""
3403-147 = "Потом отправь мне."
3403-148 = "5000 иен."
3403-149 = "Слишком дорого!"
3403-150 = "Я слышу, как поднимается неприятный ветер... Тихо!"
3403-151 = "Д-Да!"
3403-153 = "Хм, Кисаки действительно по утрам занималась... кунг-фу, пекинской оперой или чем-то ещё..."
3403-154 = "Ладно! Позже приготовлю ей питательные угощения!"
3403-155 = "Да что вообще...?"
3403-156 = ""
3403-158 = ""
3403-159 = ""
3403-160 = ""
3403-161 = ""
3403-162 = "Спасибо, Сенсей. Было близко."
3403-163 = "[s] «Кисаки, тут уже ничего не поделаешь.»"
3403-164 = "...Что именно ты имеешь в виду?"
3403-165 = "[s] «Ты ведь не можешь... разочаровать всех этих студентов!»"
3403-166 = "...!"
3403-167 = "Это... пожалуй, ты права."
3403-169 = ""
3403-170 = "Кунг-фу!"
3403-171 = "Пекинская опера!"
3403-173 = "Госпожа президент!"
3403-175 = "Хотя разочаровать именно этих троих мне кажется вполне допустимым."
3403-176 = "...Не хотелось прибегать к этому, но словами тут уже не обойтись. Президент Кагуя."
3403-177 = ""
3403-179 = ""
3403-180 = ""
3403-182 = "Своевременно сказано, Рэйдзё. Говорят, лучше всего победить без боя, но если выбора кроме боя нет, лучше победить первой..."
3403-183 = ""
3403-185 = ""
3403-186 = ""
3403-188 = "Ты готова душой и разумом?"
3403-189 = "Лучше переживайте за себя."
3403-190 = "Хм? Я чувствую запах конфликта... где-то рядом..."
3403-192 = "Послушайте все. Я пришла сюда лишь... чтобы сделать утреннюю растяжку банзай вместе с детьми из Сада цветущей сливы. И всё."
3403-193 = "Что? Растяжка...? Не кунг-фу?"
3403-194 = "Растяжка... говорите? Не пекинская опера?"
3403-196 = "Так это была растяжка! Если честно, по-моему, теперь это уже неважно!"
3403-197 = "Я же сказала. Так что прекратите это бессмысленное противостояние и—"
3403-198 = "В-Всё в порядке, госпожа! В зависимости от применения растяжка тоже может перейти в движения кунг-фу!"
3403-199 = "Всё делается шаг за шагом! Мы можем начать прямо сейчас!"
3403-200 = "Разумеется! В первую очередь танец пекинской оперы возник из превращения самой пекинской оперы в танец, а кроме того, возвысился из формы растяжки!"
3403-201 = "На самом деле, если вы дадите нам возможность представить вам нашу пекинскую оперу..."
3403-202 = "Это не пекинская опера!"
3403-203 = "Я говорю, что это не кунг-фу!"
3403-205 = "Госпожа... *шмыг*... Нам страшно..."
3403-206 = "В-Всё хорошо, все! Вытрите слёзы! ...Н-Но если уж говорить о страхе..."
3403-207 = ""
3403-209 = ""
3403-210 = "Уааа! М-Мне тоже... Мне тоже страшно...!"
3403-211 = ""
3403-214 = ""
3403-215 = "..."
3403-216 = "Немедленно прекратите! Дети плачут!"
3403-217 = ""
3403-219 = "?!"
3403-220 = "?!"
3403-221 = "?"
3403-222 = "Хотите сказать, что какие бы цели вы ни преследовали, они важнее этих детей?"
3403-223 = "Эта фантазия, к которой вы стремитесь, важнее самого будущего Шаньхайцзин?"
3403-224 = "Если так, наберитесь смелости и скажите это прямо здесь. И не думайте, что говорите это мне — скажите нашим детям!"
3403-226 = "Г-Госпожа. Мы не хотели...!"
3403-227 = "П-Простите! Мы просто...!"
3403-229 = "Если вы сможете тронуть этих детей своими словами, тогда и я поддержу вашу цель. От имени Генрюмон."
3403-230 = "Однако."
3403-231 = ""
3403-234 = ""
3403-235 = ""
3403-236 = "Если вместо этого вы попытаетесь кормить детей бессмысленной, приукрашенной ложью, уверяю вас — вы заплатите положенную цену!"
3403-239 = "[ns] «Да! Не надо злить госпожу!»"
3403-240 = "П-П-Простите нас, госпожа! Пожалуйста, простите...!"
3403-241 = "Мы забыли своё место! Проявите милосердие к нам, неблагодарным, не знающим своего места...!"
3403-242 = "Ну-ну. Давайте все немного успокоимся. Вы ещё сильнее напугаете детей."
3403-243 = "Руми? Ты была здесь...?"
3403-244 = "Уааа..."
3403-246 = "Госпожа..."
3403-247 = ""
3403-249 = ""
3403-250 = ""
3403-251 = "...Простите. Больше не о чем волноваться. Я отругала тех злых, страшных сестёр. Теперь всё будет хорошо."
3403-252 = "Х-Хорошо..."
3403-253 = "[ns] «Хочешь мой платок, чтобы высморкаться, Кокона?»"
3403-254 = "...! В-Всё нормально! Я уже взрослая леди! Так что всё нормально!"
3403-255 = "И не Кокона! Инструктор Кокона!"
3403-256 = "[s] «Да-да.»"
3403-257 = "Ну что, сделаем все вместе утреннюю зарядку?"
3403-258 = "В-Вместе...?"
3403-260 = "Зарядка с госпожой президент?! Да! Мы готовы!"
3403-261 = "Отдавайте приказы! Генрюмон, приготовиться!"
3403-262 = "Я уже примерно с середины видела, к чему всё идёт, но всё же надеялась..."
3403-263 = "Приказать нам собраться — это одно, но растяжка..."
3403-264 = "Несмотря на все мои старания, похоже, утреннюю зарядку придётся делать на глазах у публики."
3403-265 = "Ну, знаешь."
3403-266 = "Иногда ради общего блага приходится чем-то жертвовать."
3403-267 = "..."
3403-268 = "Понимаю. Похоже, ты права."
3403-269 = "Что ж, начнём наш день с правильной ноги."
3403-270 = ""
3403-274 = "[ns] «Если позволите...»"
3403-275 = ""
3403-276 = "И куда, по-твоему, ты собралась, Сенсей?"
3403-277 = "Ты присоединишься к нам."
3403-278 = "[s] «Я знала, что всё этим закончится!»"
3403-280 = "Так, пусть и немного шумно, студенты Шаньхайцзин бодро начали своё утро."
3403-281 = "К слову..."
3403-282 = "...потом ходили новые слухи о том, что студенты вдруг начали делать утреннюю зарядку в Парке Белого Тигра. Или что-то вроде того."
3403-283 = "Слегка необычное утро в Шаньхайцзин"
