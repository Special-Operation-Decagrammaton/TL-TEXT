83304500200-7 = "Теперь вся Префектурная команда должна быть в сборе."
83304500200-8 = "Да, все здесь. Правда, Иори?"
83304500200-9 = "П-погоди, почему ты отдельно обращаешься ко мне, Ако?!"
83304500200-10 = "Потому что когда с Префектурной командой что-то происходит, ты всегда так или иначе оказываешься в центре событий."
83304500200-11 = "Ты слишком часто попадаешь в ловушки, Иори."
83304500200-12 = "Э-эй! Нечестно критиковать меня за то, с чем я даже спорить не могу!"
83304500200-13 = ""
83304500200-15 = ""
83304500200-16 = ""
83304500200-17 = "Хорошо, глава префектов. Префектурная команда готова к тренировке."
83304500200-18 = "Отлично. Тогда начинаем антитеррористические учения!"
