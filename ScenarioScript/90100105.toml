90100105-16 = ""
90100105-17 = "Neutralização do alvo confirmada... O \"descampado florido\" sumiu do campo de visão."
90100105-18 = ""
90100105-20 = ""
90100105-21 = "Copiado. Fim da operação. Suspensão imediata da disciplina de blecaute."
90100105-22 = ""
90100105-25 = ""
90100105-26 = ""
90100105-27 = "[ns] \"Meninas, estão todas bem?\""
90100105-28 = "Sim, todas inteiras e sem um arranhão. O senhor também está bem, Sensei?"
90100105-29 = "[s1] \"Fiquei coordenando um pouco mais recuado.\"\n[s2] \"Nem poeira caiu na minha roupa.\""
90100105-32 = ""
90100105-34 = ""
90100105-35 = ""
90100105-36 = ""
90100105-37 = "Mas caramba... foi a primeira vez que recebi suporte tático do Sensei, e foi simplesmente impecável."
90100105-38 = "Né? Parecia que tínhamos um drone de reconhecimento... Não, parecia que alguém vigiava nossos passos lá do topo do mundo."
90100105-39 = "Graças a isso conseguimos pacificar a situação com muito mais rapidez do que o habitual. Nossos sinceros agradecimentos."
90100105-40 = "Enxergar o potencial de cada aluna antes de qualquer um e posicioná-la com precisão cirúrgica... Os boatos sobre o Sensei não eram exagero."
90100105-41 = "Agora compreendo perfeitamente por que nossas calouras depositavam tamanha confiança na sua liderança."
90100105-42 = "[s] \"Ouvir isso de veteranas condecoradas da SRT me deixa até envergonhado...\""
90100105-43 = ""
90100105-45 = ""
90100105-46 = "[ns] \"Será que o Kunekune se foi de vez agora?\""
90100105-47 = "Provavelmente. Continuamos monitorando a miragem térmica, mas não há qualquer sinal de anomalia residual."
90100105-48 = "Se isso tiver erradicado o [ruby=fenômeno anômalo]Lore[/ruby] por completo, teremos cumprido nossa missão, mas..."
90100105-49 = "Ainda assim é inacreditável que não tenha sobrado um único furo de bala nas paredes. #nGastamos tanta munição... Dá até a sensação de termos sido feitas de bobas por uma ilusão."
90100105-50 = "Pelo menos descarregar o pente adoidado deu uma bela aliviada no estresse. #nO pior de tudo é gastar energia física contra um troço que você nem sabe se existe."
90100105-51 = "Tipo quando encontramos caixas de munição real não registradas nos inventários do arsenal da academia?"
90100105-52 = "Isso, isso mesmo! Naquela época eu quase enlouqueci tentando achar onde dar baixa sem dar cadeia—"
90100105-53 = "Vocês duas, que conversa é essa aí?"
90100105-54 = "N-nada não!"
90100105-55 = "É-é só uma metáfora de treino... ahaha!"
90100105-56 = ""
90100105-58 = ""
90100105-59 = ""
90100105-60 = ""
90100105-61 = "Mudando de assunto... de onde caíram aqueles cacos de vidro espalhados no chão logo ali?"
90100105-62 = "Verdade. Não tem nenhuma vidraça nem estrutura de cristal perto dessa tubulação."
90100105-63 = "N-não me diga que caiu de dentro do Kunekune...?"
90100105-64 = "Deixa eu ver—"
90100105-65 = ""
90100105-67 = ""
90100105-68 = "Ei! FOX4!!"
90100105-70 = "Nossa... que loucura. Tem uma luz estranha pulsando dentro do vidro."
90100105-71 = "Eu acabei de mandar ter cuidado, criatura! #nSe você for hipnotizada de novo catando lixo do chão, eu não vou te salvar!"
90100105-72 = "Foi mal, foi mal."
90100105-73 = "Mas se a Kurumi tá vigiando minhas costas, sei que fico segura."
90100105-74 = "Eu não sou babá particular pra ficar de vigia o dia todo, tá legal?!"
90100105-75 = "Olhando bem... essa luz não parece refletir uma paisagem?"
90100105-76 = "Pensando por esse lado, me parece familiar..."
90100105-77 = ""
90100105-78 = "Olha só, é o mesmo descampado florido onde o Kunekune apareceu."
90100105-79 = "Parece que olhar pra esse caco não dá dor de cabeça."
90100105-80 = "Tem certeza? De todo jeito, não é nada que dê vontade de ficar encarando. A cor é bizarra e fica tremendo."
90100105-81 = "Um fragmento de vidro que projeta a imagem de outro mundo, é?"
90100105-82 = "Pode ser algo muito próximo de um [ruby=artefato anacrônico inexplicável]OOPArt[/ruby]."
90100105-83 = "Falando nisso, a Presidente do Conselho Estudantil Federal não estava coletando coisas desse tipo?"
90100105-84 = "Então vamos levar isso pra ela?"
90100105-85 = "[s] \"Esse fragmento...\""
90100105-86 = "O senhor reconhece isso de algum lugar, Sensei?"
90100105-87 = ""
90100105-88 = "Este mundo transformou-se repentinamente na noite passada. As [ruby=contradições]penas negras[/ruby] continuam dispersas por todos os cantos."
90100105-89 = "Investigue, recolha e registre cada uma delas."
90100105-91 = "[ns3] (Não me diga que esse caco de vidro...)\n[ns4] (...é a prova da contradição que a Orwell mencionou...?)"
90100105-94 = ""
90100105-95 = "Gostaria de pedir que o senhor fique sob a guarda deste fragmento de vidro, Sensei."
90100105-96 = "[s] \"Tem certeza de que não precisamos reportar à Presidente?\""
90100105-97 = "...Sim. Por ora, não."
90100105-98 = "Essa pontada de estranheza presa na garganta... tenho certeza de que desvendaremos sua essência conforme acumularmos mais evidências."
90100105-99 = "Até lá, prefiro confiar o julgamento ao discernimento do Sensei."
90100105-100 = "[s] \"Entendido. Vou guardá-lo comigo em segurança.\""
90100105-101 = "Obrigada. Bom, agora com a missão concluída—"
90100105-102 = ""
90100105-104 = ""
90100105-105 = ""
90100105-106 = "...Peço perdão pelo barulho do estômago."
90100105-107 = "Aiai, acho que a tensão passou e bateu uma fome de leão de repente~"
90100105-108 = "Verdade. Devíamos ter embrulhado uns bolinhos de inari pra viagem."
90100105-109 = "Nesse mormaço? Ia azedar em meia hora!"
90100105-110 = "Bora comer em qualquer biboca aqui perto antes de voltar."
90100105-111 = "O problema é o dinheiro... Não temos um tostão furado no bolso e nossos cartões da SRT estão bloqueados..."
90100105-112 = ""
90100105-113 = "[ns] \"Parece que essa é a deixa pro adulto entrar em cena!\""
90100105-114 = ""
90100105-115 = "[ns] \"Hoje o banquete é por minha conta, peçam o que quiserem!\""
90100105-116 = "Se for assim, eu quero um udon de raposa lá da frente da estação—"
90100105-117 = "Qual é, vai desperdiçar uma chance de ouro dessas?! Aquele udon custa nem 500 ienes!"
90100105-118 = "Numa hora dessas a gente pede o prato mais caro da casa... tipo um combinado de katsudon duplo com tudo dentro!"
90100105-119 = "E o prato mais chique que passa pela sua cabeça é katsudon duplo...?"
90100105-120 = "Sensei, pode ser naquela churrascaria que você levou a gente da outra vez?"
90100105-121 = "Fiquei com água na boca lembrando daquele espetinho de tripa bovina que não deu pra comer no outro dia."
90100105-122 = "[s] \"Mas é claro!\""
90100105-123 = ""
90100105-125 = ""
90100105-126 = ""
90100105-127 = "A-ah... não precisa gastar tanto com a gente..."
90100105-128 = "[s5] \"Não se sinta em débito de forma alguma.\"\n[s6] \"Garantir que as crianças comam direito é a obrigação sagrada de um adulto.\""
90100105-131 = ""
90100105-133 = ""
90100105-134 = ""
90100105-135 = "...O senhor realmente tem jeito de sobra para lidar com alunas."
90100105-136 = "Sendo assim, aceitamos sua gentileza de bom grado mais uma vez."
90100105-138 = "(E depois disso, a comemoração pós-missão na churrascaria foi repleta de risadas e momentos inesquecíveis)"
90100105-140 = "A Seguir;Incompreensível"
