[translation]
90100105-3 = ""
90100105-4 = ""
90100105-5 = "Зона A: чисто."
90100105-6 = ""
90100105-10 = ""
90100105-11 = "Зона B: чисто."
90100105-12 = ""
90100105-16 = ""
90100105-17 = "Последняя цель подтверждена уничтоженной... Так называемое травяное поле исчезло."
90100105-18 = ""
90100105-20 = ""
90100105-21 = "Принято. Миссия завершена. Немедленно отменяем режим затемнения."
90100105-22 = ""
90100105-25 = ""
90100105-26 = ""
90100105-27 = "[ns] «Все в порядке?»"
90100105-28 = "Ни одной царапины. А вы, Сенсей?"
90100105-29 = "[s1] «О, я всего лишь отдавал приказы.»\n[s2] «Со мной всё в полном порядке.»"
90100105-32 = ""
90100105-34 = ""
90100105-35 = ""
90100105-36 = ""
90100105-37 = "Впервые я работала с вами в бою, Сенсей. Это было невероятно."
90100105-38 = "Точно. Было ощущение, будто за нами следит дрон... НЕТ, что-то гораздо выше дрона."
90100105-39 = "Большое спасибо! Всё закончилось намного легче, чем обычно."
90100105-40 = "Похоже, ваша репутация заслуженна. Вы прекрасно чувствуете расстановку и умеете использовать наши сильные стороны."
90100105-41 = "Теперь я понимаю, почему RABBIT вам доверяли..."
90100105-42 = "[s] «Приятно слышать такую похвалу...»"
90100105-43 = ""
90100105-45 = ""
90100105-46 = "[ns] «Но важнее другое — все кунэ-кунэ уничтожены?»"
90100105-47 = "Похоже на то. Я больше не обнаруживаю аномального марева."
90100105-48 = "Если это значит, что мы полностью решили проблему Лора..."
90100105-49 = "Место боя совершенно цело. Ни одной пулевой отметины. Я уже начинаю сомневаться, происходило ли это вообще."
90100105-50 = "Но после всей этой движухи мне стало намного лучше! Было приятно наконец пострелять во что-то НАСТОЯЩЕЕ, понимаете?"
90100105-51 = "Даже лучше, чем когда мы нашли тот ящик незарегистрированных боеприпасов в оружейной?"
90100105-52 = "О да. Было весело, но разбираться с этим потом было ТАКОЙ головной болью..."
90100105-53 = "Вы о чём вообще говорите...?"
90100105-54 = "Н-Ничего!"
90100105-55 = "Я-я просто представила... Хаха!"
90100105-56 = ""
90100105-58 = ""
90100105-59 = ""
90100105-60 = ""
90100105-61 = "Кстати, откуда взялись эти осколки на полу?"
90100105-62 = "Хмм... Стекла здесь вроде почти нет."
90100105-63 = "М-Может, они выпали из кунэ-кунэ?"
90100105-64 = "Так, посмотрим..."
90100105-65 = ""
90100105-67 = ""
90100105-68 = "Эй, FOX 4!"
90100105-70 = "Хм... Интересно. Он переливается каким-то странным оттенком."
90100105-71 = "Осторожно! Тебя снова может затянуть!"
90100105-72 = "А, прости, прости."
90100105-73 = "Я подумала, всё будет нормально, раз ты за мной присматриваешь."
90100105-74 = "Я не могу следить за тобой круглосуточно, ясно?!"
90100105-75 = "Но важнее другое... Отражение в этом стекле ведь не отсюда, да?"
90100105-76 = "Ага. Но оно знакомое."
90100105-77 = ""
90100105-78 = "Это то самое травяное поле. То, где обитает кунэ-кунэ..."
90100105-79 = "Похоже, всё нормально. На него можно смотреть безопасно."
90100105-80 = "Наверное... Но мне не по себе. Что с этими цветами?"
90100105-81 = "Осколок стекла, отражающий другой мир."
90100105-82 = "Это выглядит... жутковато. Совершенно ясно, что осколок необычный."
90100105-83 = "Разве президент Генерального студенческого совета не коллекционирует подобные вещи?"
90100105-84 = "Что? Думаешь, нам стоит отнести его ей?"
90100105-85 = "[s] «Этот осколок...»"
90100105-86 = "Что-то не так, Сенсей?"
90100105-87 = ""
90100105-88 = "История этого мира была грубо и внезапно переписана лишь прошлой ночью. Противоречия всё ещё разбросаны по подтексту."
90100105-89 = "Исследуйте, собирайте и записывайте их."
90100105-91 = "[ns3] «(Может, этот осколок стекла...)»\n[ns4] «(...доказательство тех противоречий, о которых говорил Оруэлл?)»"
90100105-94 = ""
90100105-95 = "Сенсей. Пожалуйста, пока подержите этот осколок у себя."
90100105-96 = "[s] «Ты не хочешь сообщить о нём президенту Генерального студенческого совета?»"
90100105-97 = "...Думаю, у вас он будет в надёжных руках."
90100105-98 = "Я пока ни в чём не уверена, но знаю, что со временем во всём разберусь."
90100105-99 = "А до тех пор я хотела бы, чтобы вы принимали решения от моего имени."
90100105-100 = "[s] «Хорошо. Тогда я пока сохраню его у себя.»"
90100105-101 = "Да. А теперь..."
90100105-102 = ""
90100105-104 = ""
90100105-105 = ""
90100105-106 = "...Прошу прощения."
90100105-107 = "Я тоже нервничала. Но теперь, когда напряжение спало, начинаю чувствовать голод."
90100105-108 = "Ага. Может, стоило взять с собой инаризуси."
90100105-109 = "Эй, в такую погоду бэнто с собой не потащишь."
90100105-110 = "Мы всё ещё в городе! Может, возьмём что-нибудь навынос по дороге домой?"
90100105-111 = "У меня нет наличных. Да и студенческий билет я светить не могу..."
90100105-112 = ""
90100105-113 = "[ns] «Наконец-то настал звёздный час моей кредитки.»"
90100105-114 = ""
90100105-115 = "[ns] «Что бы вы хотели?»"
90100105-116 = "Тогда я возьму удон с жареным тофу у станции..."
90100105-117 = "Ты правда собираешься потратить такую возможность на дешёвый удон?"
90100105-118 = "Надо просить что-нибудь дорогое... Например, двойной кацудон!"
90100105-119 = "Не могу поверить, что двойной кацудон — предел твоей фантазии."
90100105-120 = "Сенсей, можем сходить в то якинику, где были в прошлый раз?"
90100105-121 = "Я тогда так объелась, что не успела попробовать жареные говяжьи кишки."
90100105-122 = "[s] «Конечно!»"
90100105-123 = ""
90100105-125 = ""
90100105-126 = ""
90100105-127 = "Э-Эм. Сенсей, не обязательно..."
90100105-128 = "[s5] «Ничего страшного.»\n[s6] «У SRT свои миссии. А моя — следить, чтобы вы хорошо ели.»"
90100105-131 = ""
90100105-133 = ""
90100105-134 = ""
90100105-135 = "...Вы и правда умеете с нами обращаться, Сенсей."
90100105-136 = "В таком случае с удовольствием примем ваше угощение."
90100105-138 = "Мы вернулись в ресторан якинику и отпраздновали успешное завершение миссии."
90100105-140 = "Следующий эпизод;Слухи и непостижимое"
