[translation]
10039160-1 = "Послесловие;Школьный боец по еде"
10039160-3 = "Пока я бегал туда-сюда во время Карнавала, решая разные проблемы..."
10039160-4 = ""
10039160-7 = ""
10039160-13 = "...вот, в общем-то, и вся суть."
10039160-14 = "[s1] «Итак, если подвести итог...»\n[s2] «...на Улице палаток не хватает посетителей.»"
10039160-17 = "Да... Не думаю, что проблема в еде. Она очень вкусная."
10039160-18 = "Все продавцы попробовали еду друг у друга, и все согласны, что она вкусная."
10039160-19 = "Значит, проблема в чём-то другом, но мы не знаем в чём. Мы надеялись, что вы сможете помочь."
10039160-20 = "[s3] «Я не очень разбираюсь в продвижении уличных палаток, но...»\n[s4] «Я так или иначе постараюсь привести вам покупателей!»"
10039160-21 = ""
10039160-22 = ""
10039160-24 = ""
10039160-25 = "О-Огромное спасибо, Сенсей!"
10039160-26 = "Мы тоже продолжим искать новых покупателей!"
10039160-29 = "Не зная точно, что делать, я некоторое время бродил по Улице палаток..."
10039160-32 = "[ns5] «Якисоба! Куриные шашлычки! Рамен!»\n[ns6] «Всё очень вкусное!»"
10039160-33 = ""
10039160-34 = ""
10039160-37 = "Как раз когда я начал думать, что это не сработает, я увидел проходящих мимо студентов."
10039160-38 = ""
10039160-42 = "О-о, отличный фон для фото, да?"
10039160-43 = "Ага, давай сфоткаемся! Ты первая!"
10039160-44 = "Хорошо, что я сегодня это надела!"
10039160-45 = "[s] «...»"
10039160-46 = ""
10039160-50 = "[ns7] «Давайте, я подержу камеру.»\n[ns8] «У вас останется бесценное воспоминание о знаменитой Улице палаток!»"
10039160-51 = ""
10039160-52 = ""
10039160-55 = "О, звучит неплохо."
10039160-56 = "Хи-хи, правда ведь?"
10039160-57 = ""
10039160-62 = "Хи-хи, хорошо, одно фото, пожалуйста! Спасибо!"
10039160-63 = "[ns] «Сы-ы-р! Поддержите Улицу палаток!»"
10039160-64 = ""
10039160-78 = "Передвижная фотозона для рекламы. Идея казалась неплохой, но едва я начал..."
10039160-79 = ""
10039160-84 = "...на заднем плане кадра появился знакомый силуэт."
10039160-85 = ""
10039160-88 = "[ns] «...Харуна?!»"
10039160-91 = "«(Харуна из Общества любителей гурманства. Может, они помогут решить проблемы Улицы палаток.)»"
10039160-92 = "«(В конце концов, кто разбирается в хорошей кухне лучше них?»)"
10039160-93 = "«(Посмотрим, есть ли у них какие-нибудь идеи!)»"
10039160-94 = ""
10039160-99 = "Я бросился вслед за Харуной."
10039160-104 = ""
10039160-106 = ""
10039160-108 = "[ns] «*тяжело дышит* *тяжело дышит*»"
10039160-109 = ""
10039160-111 = ""
10039160-112 = "О боже, Сенсей. Не ожидала увидеть вас здесь."
10039160-114 = ""
10039160-115 = "А, Сенсей!"
10039160-116 = "Не думала, что мы встретим вас здесь. Рада видеть! ☆"
10039160-117 = "Вы тоже пришли ради еды?"
10039160-118 = "[s] «А вы? Что привело вас всех на Карнавал?»"
10039160-120 = "Хи-хи... Ну, Карнавал Тринити — это, в некотором смысле, соревнование уличной еды."
10039160-121 = "Поле боя, где уличные палатки и фудтраки соревнуются своими фирменными блюдами."
10039160-122 = "Общество любителей гурманства не может пропустить такое!"
10039160-123 = ""
10039160-126 = ""
10039160-127 = "...Похоже, вам что-то нужно."
10039160-128 = "[s] «Ну...»"
10039160-129 = ""
10039160-131 = ""
10039160-133 = "Я объяснил ситуацию Обществу любителей гурманства и попросил их помочь."
10039160-136 = "Вот как..."
10039160-137 = "Если проблема в этом, вы обратились как раз к тем, кому нужно."
10039160-138 = "Никто не умеет набивать животы лучше нас."
10039160-140 = ""
10039160-141 = "Именно! Вам повезло, что вы нас заметили!"
10039160-142 = "А уличные палатки как раз моя специализация."
10039160-143 = "Можете на нас рассчитывать. ☆"
10039160-144 = "Ага! Хи-хи, надеюсь, у них есть еда, которая мне нравится."
10039160-145 = "[s] «О, только один вопрос заранее...»"
10039160-146 = ""
10039160-148 = ""
10039160-150 = ""
10039160-151 = "[ns] «Если еда вам не понравится, вы и в этот раз всё взорвёте?»"
10039160-152 = "Хм, я об этом не думала..."
10039160-153 = ""
10039160-155 = ""
10039160-156 = "Профессиональные мастера общепита должны отвечать за несоблюдение стандартов, но, думаю, не стоит судить студентов-любителей по тем же критериям."
10039160-157 = "Точно! Мы просто хотим съесть что-нибудь вкусное!"
10039160-158 = "[s9] «Какое облегчение...»\n[s10] «Если студент Геенны устроит нечто подобное на территории Тринити, это станет серьёзным происшествием.»"
10039160-161 = "Что ж, свои «оценки» мы проводим независимо от времени и места..."
10039160-162 = ""
10039160-164 = ""
10039160-166 = "...но сегодня мы постараемся изо всех сил избежать любых происшествий."
10039160-167 = "[s] «Огромное спасибо!»"
10039160-169 = ""
10039160-170 = "..."
10039160-171 = ""
10039160-173 = ""
10039160-177 = ""
10039160-179 = ""
10039160-180 = "..."
10039160-182 = "С-Сенсей?!"
10039160-183 = "[s] «Они лучшие эксперты из всех, кого я знаю.»"
10039160-185 = "[ns] «...Насколько я понимаю.»"
10039160-186 = ""
10039160-188 = ""
10039160-190 = "Но они же студенты Геенны. Это точно нормально...?"
10039160-191 = ""
10039160-193 = ""
10039160-194 = "Погодите, разве это не те террористки...?"
10039160-195 = "А? Что?"
10039160-196 = ""
10039160-198 = ""
10039160-200 = ""
10039160-202 = "...О, кажется, ты права..."
10039160-203 = "О-Они... из Общества любителей гурманства?!"
10039160-204 = "Те самые, что проникли в нашу школу и украли гордость аквариума — Золотого Магуро...!"
10039160-205 = "Террористки, которые взорвали множество ресторанов в районе D.U....!"
10039160-207 = "Что ж, похоже, наша репутация опережает нас даже среди обычных студентов."
10039160-208 = "Хи-хи, раз вы уже всё знаете, нам не придётся ничего объяснять. ☆"
10039160-209 = "А теперь скорее приготовьте нам еды!"
10039160-211 = "С-Сенсей?!"
10039160-212 = "[s11] «Поверьте мне, всё будет хорошо.»\n[s12] «Сегодня они здесь как консультанты, а не террористки.»"
10039160-215 = "...Да, я понимаю вашу ситуацию."
10039160-216 = "По дороге сюда я осмотрела соседние торговые зоны и заметила несколько проблем."
10039160-217 = "Дайте нам немного времени подтвердить наши наблюдения, и тогда мы сможем предложить решение."
10039160-218 = ""
10039160-221 = ""
10039160-222 = "...Хм. Ну, по крайней мере, выглядят они профессионально."
10039160-223 = "Сначала, чтобы проверить наше основное предположение, нужно оценить уровень еды, которую здесь продают."
10039160-224 = "Я слышала, вы довольно уверены в её вкусе, не так ли?"
10039160-225 = "Н-Ну... думаю, она довольно вкусная."
10039160-227 = "Тогда мы её попробуем и вынесем объективную оценку."
10039160-228 = "Во всём Кивотосе нет никого с более утончённым вкусом, чем у Общества любителей гурманства."
10039160-229 = "Ага-ага! Именно! Ни у кого нет более высоких стандартов вкуса!"
10039160-230 = "Мне кажется, наши стандарты несколько отличаются от ваших..."
10039160-232 = "В любом случае, если проблема во вкусе, мы предложим решение для него. Если нет — найдём настоящую проблему и предложим решение уже для неё."
10039160-234 = "Х-Хорошо... Я приготовлю вам еду через минуту!"
10039160-235 = ""
10039160-237 = ""
10039160-239 = "О-о, не могу дождаться!"
10039160-240 = "Не торопись. Не переедай."
10039160-243 = ""
10039160-244 = "Вот! Моя якисоба..."
10039160-245 = ""
10039160-247 = ""
10039160-249 = "Хорошо, тогда..."
10039160-250 = ""
10039160-252 = ""
10039160-254 = ""
10039160-258 = "[ns] «Почему я так нервничаю...?»"
10039160-262 = ""
10039160-263 = ""
10039160-264 = "...Вполне сойдёт."
10039160-265 = ""
10039160-268 = ""
10039160-269 = "Ура! Я прошла!"
10039160-270 = "...Стоп. Почему я так радуюсь тому, что просто прошла?"
10039160-272 = "Я бы не назвала это «изысканной кухней,» но для палатки, которой управляют студенты, уровень значительно выше среднего. Действительно, как и сказал Сенсей, со вкусом проблем нет."
10039160-274 = "Т-Тогда..."
10039160-275 = "Тогда в чём проблема...?"
10039160-277 = "А, у нас есть ответ."
10039160-278 = "И какой же...?"
10039160-279 = ""
10039160-281 = ""
10039160-282 = "Джунко, объяснишь?"
10039160-284 = "С удовольствием!"
10039160-285 = ""
10039160-287 = ""
10039160-288 = "Думаю, проблема в продвижении."
10039160-289 = "Когда еда вкусная, а посетителей всё равно мало..."
10039160-290 = "...обычно это значит, что люди в принципе не знают о существовании этой еды."
10039160-292 = "О... Н-Ничего себе..."
10039160-293 = "Популярные рестораны всегда усердно рекламируют себя где только можно."
10039160-294 = "И что нам тогда делать, чтобы продвигать наше место?"
10039160-295 = "У каждого ресторана по-разному, но для палатки на школьном фестивале самым эффективным способом, по нашему опыту, являются соцсети."
10039160-296 = "В конце концов, именно оттуда большинство студентов получает информацию."
10039160-297 = ""
10039160-299 = ""
10039160-300 = "Смотрите сюда. Когда люди ищут «Карнавал Тринити,» вам нужно попадаться им на глаза. Выложите информацию о палатке, добавьте побольше разных тегов — и начнёте появляться в самых разных поисковых запросах."
10039160-301 = ""
10039160-304 = ""
10039160-305 = "Соцсети. Записала..."
10039160-307 = "Ещё стоит поощрять студентов, которые сюда приходят, писать отзывы в своих соцсетях."
10039160-308 = "К-Как это сделать?"
10039160-309 = "Ну, например, можно давать бесплатный напиток за написанный отзыв."
10039160-310 = "О...! Даже мне захотелось бы так сделать."
10039160-311 = "[s] «Ты говоришь так, будто у тебя большой опыт. Не ожидал, что обычный студент будет так мыслить.»"
10039160-315 = ""
10039160-316 = "Ладно, давайте попробуем ваши решения!"
10039160-317 = "Продвижение. Мы справимся!"
10039160-318 = ""
10039160-320 = ""
10039160-322 = "...Ну что, как у нас дела?"
10039160-328 = ""
10039160-329 = "О, это Улица палаток? Здесь столько всего!"
10039160-330 = "Я слышала, вон там якисоба очень вкусная. Хочешь попробовать острую?"
10039160-331 = "Две порции якисобы, пожалуйста!"
10039160-332 = ""
10039160-336 = "Добро пожаловать! Сейчас будет! Вам точно понравится."
10039160-338 = "Хм, пить немного хочется... Давай ещё возьмём напиток."
10039160-339 = ""
10039160-342 = ""
10039160-343 = "У нас бесплатные напитки, если оставите отзыв в своих соцсетях!"
10039160-344 = ""
10039160-347 = ""
10039160-348 = "О, правда? Ну что, сделаем?"
10039160-349 = "Бесплатно, говоришь? Я напишу отзыв! Хи-хи."
10039160-351 = "Хорошо, спасибо! Вот вам по одному приятному холодному напитку."
10039160-354 = ""
10039160-355 = "Одну жареную кукурузу, пожалуйста!"
10039160-356 = ""
10039160-358 = ""
10039160-359 = "Да! Вот, держите! Спасибо!"
10039160-360 = ""
10039160-362 = ""
10039160-363 = ""
10039160-364 = ""
10039160-368 = "Нам восемь куриных шашлычков! Половину с солью, половину с соевым соусом!"
10039160-370 = "Конечно! Пожалуйста, немного подождите. Сейчас у нас ОЧЕНЬ много заказов!"
10039160-371 = ""
10039160-373 = ""
10039160-375 = "[ns] «Ого, сколько народу!»"
10039160-376 = "Вы опубликовали пост как раз вовремя, когда все начали проголаживаться."
10039160-377 = "Отлично, отлично! Всё работает идеально! Я только что поискала «Карнавал Тринити,» и упоминаний о вас становится всё больше."
10039160-378 = "И большинство отзывов положительные. Как мы и говорили, это не высокая кухня, но для студентов очень даже достойно."
10039160-380 = "О-о, надо было ещё сделать такояки с шоколадным умэбоси."
10039160-381 = "Теперь уже поздно, знаю, но в меню и без того много всего."
10039160-382 = "[s] «Отличная работа, Общество любителей гурманства!»"
10039160-384 = "Хе-хе, мы знаем своё дело."
10039160-385 = "Забавно, что сами мы готовим не особо хорошо, зато консультанты из нас отличные!"
10039160-386 = "Такими темпами у нас могут закончиться ингредиенты! ☆"
10039160-387 = "Может, и мы сами перекусим?"
10039160-388 = "Ага, хорошая идея! Я как раз начинаю проголаживаться!"
10039160-389 = "[s] «Я угощаю! Ешьте сколько хотите!»"
10039160-390 = ""
10039160-392 = ""
10039160-393 = "О боже... Правда сколько захотим?"
10039160-394 = ""
10039160-397 = "[ns] Проверить кошелёк."
10039160-398 = "Хи-хи... Не волнуйтесь, Сенсей. Мы не разорим вас... полностью!"
10039160-399 = "[s] «Эм, ну да...»"
10039160-401 = "После консультации палатка с едой стала пользоваться огромным успехом."
10039160-402 = ""
10039160-405 = "Особенно помогло то, что её знали как «ресторан, который Общество любителей гурманства не взорвало.»"
