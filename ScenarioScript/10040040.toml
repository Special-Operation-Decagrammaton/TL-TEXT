[translation]
10040040-1 = "Эпизод 4;Сказать правду"
10040040-2 = "...Интересно, сколько я уже прошёл под руководством Котамы и Харе."
10040040-3 = ""
10040040-6 = "Отлично, Сенсей. Секундочку..."
10040040-7 = "Так, идите до конца коридора и поверните направо."
10040040-8 = "...Стойте!"
10040040-9 = ""
10040040-12 = ""
10040040-13 = "Я что-то обнаружила. Эти звуковые волны не совпадают с вашим голосом."
10040040-14 = ""
10040040-17 = "[ns1] «С другой стороны!» \n[ns2] «Там кто-то есть!»"
10040040-20 = "Примерно в сорока метрах... Они выйдут из-за угла приблизительно через шесть секунд."
10040040-21 = "Нужно где-то спрятаться...!"
10040040-22 = "Дверь справа! Она ведёт на кухню."
10040040-23 = "Сейчас разблокирую её, так что забегайте туда, как только открою."
10040040-24 = ""
10040040-31 = "[ns3] «Спасибо вам обеим!»\n[ns4] Вбежать на кухню."
10040040-40 = "Кья-а-а! Голова, моя голова...!"
10040040-41 = "[ns5] «Ай, ай, ай...»\n[ns6] «Что это за твёрдая штука...?»"
10040040-44 = ""
10040040-45 = ""
10040040-46 = ""
10040040-47 = ""
10040040-48 = "...А?!"
10040040-49 = "Сенсей?! Сенсей, это ты?! Что ты вообще здесь делаешь?!"
10040040-50 = "Фух... Ты меня напугал."
10040040-51 = "А-а! Я правда решила, что это Юука или Ноа. Кажется, я постарела лет на десять!"
10040040-52 = "[s7] «Ты меня тоже напугала!»\n[s8] «Так вот где ты пряталась.»"
10040040-55 = "Я не могу сбежать, пока окончательно их не оторву от себя."
10040040-56 = "В этом здании, как далеко ни убегай, погоня никогда не заканчивается!"
10040040-57 = "...Что?"
10040040-58 = "...А, эта одежда? Это пижама, которую мне купила Юука!"
10040040-59 = "[s9] «У тебя ещё были силы переодеваться?»\n[s10] «Ты и правда умеешь использовать всё, что можешь.»"
10040040-62 = "...Да, и?"
10040040-63 = "Даже если я в бегах, не вижу причин отказываться от подарка."
10040040-64 = "...С этим что-то не так?"
10040040-65 = "...Нет? Яха! Сенсей, ты такой смешной."
10040040-66 = "Эм... В общем, мы из огня да в полымя. Я от них оторвалась, но настоящее испытание только начинается."
10040040-67 = "...Что я имею в виду? А! Точно! Ты же впервые пытаешься сбежать из Семинар!"
10040040-68 = "Это не обычное здание! Тут есть всё, что можно представить: камеры наблюдения, электронные замки, охранные дроны, автоматические барьеры и ещё куча всего!"
10040040-69 = "...Что?"
10040040-70 = "Откуда я знаю? Эй, вообще-то я сотрудница Семинар."
10040040-71 = ""
10040040-73 = ""
10040040-74 = "И в этом мире нет никого, кто испытал на себе всю мощь безопасности Семинар так, как я. Фуфуфу."
10040040-75 = "[s11] «Ты подозрительно этим гордишься...»\n[s12] «Хотя сейчас нам это на пользу.»"
10040040-78 = "В любом случае, юный падаван, радуйся, что тебя поставили в пару со мной — ветераном среди ветеранов побегов, Куросаки Коюки!"
10040040-79 = "С этого момента просто доверься мне! Когда дело доходит до того, чтобы перехитрить старших, этот лабиринт — моя игровая площадка—"
10040040-80 = ""
10040040-83 = "...А...? Шаги...?"
10040040-84 = "Тсс...! Нужно спрятаться!"
10040040-85 = "Это стеклянная дверь! Если будем просто стоять здесь, нас точно заметят!"
10040040-86 = "...Сюда, быстрее...!"
10040040-87 = ""
10040040-89 = ""
10040040-92 = "...Серьёзно, куда она делась?!"
10040040-93 = "Фуфу. Неожиданная игра в прятки в неожиданном месте. Какой интересный конец года."
10040040-94 = "Ноа! Тут вообще ничего интересного!"
10040040-95 = "Давай разделимся. Ноа, начнёшь с конца коридора? Я проверю кухню здесь."
10040040-97 = "Ч-что, кухню?! Почему, почемууу? Ей обязательно быть настолько дотошной...?"
10040040-99 = "Кухню? Но она заперта."
10040040-100 = "Ноа, ты же знаешь Коюки. Для неё такой замок ничего не значит."
10040040-101 = "Хихи. И правда."
10040040-103 = ""
10040040-104 = "[ns13] «Да, у Юки острое чутьё...» \n[ns14] «Похоже, они тоже ветераны среди ветеранов.»"
10040040-107 = "Сейчас не время восхищаться!"
10040040-108 = "Лишняя тщательность не повредит. После проверки этой зоны я присоединюсь к тебе."
10040040-109 = "Фуфу. Держись, Юука."
10040040-110 = ""
10040040-111 = ""
10040040-114 = "*вздох* Давайте уже закончим с этим."
10040040-115 = ""
10040040-116 = ""
10040040-119 = ""
10040040-121 = "И-и...!"
10040040-122 = "[ns15] Спрятаться в слепой зоне.\n[ns16] «(Нам нужно отсюда выбраться!)»"
10040040-129 = "Хм..."
10040040-130 = "Неужели здесь никого? Может, чутьё меня подвело..."
10040040-131 = ""
10040040-135 = "...!"
10040040-136 = "[ns17] «(А! Во что я врезался?!)»\n[ns18] «Половник на стене! Он упал!»"
10040040-139 = "Э-эй, кто там...? Это ты, Коюки, да?"
10040040-140 = "Я знала, что ты здесь! Сейчас же выходи!"
10040040-141 = ""
10040040-143 = ""
10040040-144 = ""
10040040-145 = "Ах ты...! Коюки!"
10040040-146 = "[ns19] Сглотнуть и приготовиться оправдываться.\n[ns20] «(Вот и всё...?! )»"
10040040-149 = ""
10040040-155 = ""
10040040-156 = "...А?!"
10040040-158 = ""
10040040-159 = ""
10040040-160 = ""
10040040-162 = ""
10040040-163 = ""
10040040-165 = "Нихаха! Глупая Юука! Я здесь!"
10040040-166 = "[ns] «(Коюки!)»"
10040040-168 = "...Ч-что?! Когда ты успела туда?!"
10040040-169 = "Вот попадёшься мне в руки!"
10040040-170 = ""
10040040-172 = ""
10040040-173 = "Нихахаха! Сначала поймай!"
10040040-174 = "Сюда!"
10040040-175 = ""
10040040-183 = "А ну стой!"
10040040-184 = ""
10040040-192 = "[ns21] «...Я буду помнить тебя вечно.»\n[ns22] «...Спасибо. Твоя жертва не будет напрасной.»"
10040040-197 = "...Это была славная жертва."
10040040-198 = "Когда всё закончится, если будет возможность, давайте поставим ей памятник."
10040040-199 = "Хватит говорить так, будто она умерла."
10040040-200 = "Вот именно... *тяжело дышит*"
10040040-201 = "Кто сказал что-то про смерть? Ни... хаха... ха..."
10040040-202 = ""
10040040-206 = "[ns23] «Коюки?!»\n[ns24] «Тебя не поймали?!»"
10040040-209 = "С чего вы... вообще так решили...? Ни... ха..."
10040040-210 = "Я же уже говорила! В побегах из этой тюрьмы лучше меня никого нет! Нихаха!"
10040040-211 = "*тяжело дышит* Мне просто нужно перевести дух..."
10040040-212 = "Похоже, тебе помогают ещё какие-то люди, Сенсей!"
10040040-213 = "Это результат того, что ты всегда называешь «хорошим повседневным поведением»?"
10040040-214 = "Наверное, они имели в виду немного другое..."
10040040-215 = "Впрочем, это логично. Мы двигались по статистически наиболее безопасному маршруту..."
10040040-216 = "...а ты инстинктивно делала то же самое, поэтому наши пути рано или поздно должны были пересечься."
10040040-218 = "Я слышу только одно: теперь мы сообщники! Йаху нашему союзу беглецов! Нихаха!"
10040040-220 = "...Она немного напоминает мне Маки."
10040040-221 = "Я подумала о том же. И, к слову о ней, она скоро должна прибыть."
10040040-222 = ""
10040040-223 = "...Хм? Интересуешься, зачем сюда идёт Маки?"
10040040-224 = "Ничего особенного. Просто запасной план на всякий случай."
10040040-225 = "Я не была уверена, сможем ли мы перехитрить систему безопасности здания. Поэтому, если всё пойдёт плохо, я планировала сломать несколько дверей или окон на первом этаже."
10040040-226 = "[s25] «Не слишком ли это?»\n[s26] «Не-а. Ломать вещи нельзя.»"
10040040-230 = "Но почему? Разве это не отличный план?!"
10040040-231 = "Серьёзно, не переживай! У Семинар куча денег, для них это мелочь!"
10040040-232 = ""
10040040-235 = ""
10040040-236 = "...Хмм. Поразительно."
10040040-237 = "Мы знаем, что Юке приходится много страдать, но ты превзошла даже наши ожидания."
10040040-238 = "Потом придётся извиниться перед Маки за сравнение."
10040040-240 = "Что за внезапная смена отношения?!"
10040040-241 = "Ну, Маки хотя бы—"
10040040-242 = "...А? Сенсей, что ты сказал?"
10040040-243 = "...Всё слишком выходит из-под контроля?"
10040040-244 = "...Сенсей? Ты правда хочешь просто признаться и принять последствия?"
10040040-245 = "ЭЭЭ?! Нет, нет, ни за ЧТО! Нельзя предавать меня в самый последний момент!"
10040040-246 = "Ты идёшь со мной до конца, Сенсей! Ты помогаешь мне сбежать! Между прочим, частично это и твоя вина!"
10040040-247 = "Она вообще не знает границ..."
10040040-248 = "[ns27] «Я объясню и твою ситуацию, Коюки.»\n[ns28] «Если скажу правду, уверен, они поймут.»"
10040040-251 = "Н-Но..."
10040040-252 = "...Хм. Однако, Сенсей."
10040040-253 = "Мне трудно понять ход ваших мыслей. Что именно вы собираетесь им сказать?"
10040040-254 = "Может, примерно так?"
10040040-255 = ""
10040040-257 = ""
10040040-258 = "«Я, взрослый человек, пробрался в Комнату самоанализа, хотя должен был работать.»"
10040040-259 = "«Потом, чтобы меня не поймали за игрой в карты со студентом, я спрятался в шкафу.»"
10040040-260 = "А дальше, может, скажете: «Я довольно долго наблюдал из этого шкафа за студентами в пижамах»?"
10040040-261 = "«А теперь, раз побег не удался, я признаюсь и чистосердечно раскаиваюсь в проступках.»"
10040040-262 = "...Ну..."
10040040-263 = "...И это вы собираетесь «признать»?"
10040040-264 = ""
10040040-268 = ""
10040040-269 = "[ns29] «...В какую сторону был выход?»\n[ns30] «Мне нужно выбраться отсюда! НЕМЕДЛЕННО!!»"
10040040-272 = "Нихаха! Вот это другое дело!"
10040040-273 = ""
10040040-275 = ""
10040040-276 = ""
10040040-277 = ""
10040040-278 = ""
10040040-279 = ""
10040040-280 = ""
10040040-282 = ""
10040040-284 = "Этот звук...?!"
10040040-285 = "Охранные дроны! Они... выпустили всю стаю!"
10040040-287 = "Юука, должно быть, ооочень злая..."
10040040-288 = "Наверное, Коюки своими подколами окончательно её довела."
10040040-290 = "Хватит об этом! Мы должны были быть на первом этаже ещё минут пять назад!"
10040040-292 = "Тут она хотя бы права. Проще было бы просто взломать всех дронов, но я обещала больше так не делать."
10040040-293 = "Вместо этого мы проведём вас по самому быстрому и безопасному маршруту и постараемся скрыть вас от камер."
10040040-294 = "Если придётся сражаться с дронами..."
10040040-296 = "Яхаха! Оставьте это мне, ветерану среди ветеранов, Куросаки Коюки!"
10040040-297 = "Только дайте команду — и я разнесу этих мелких ребят в—"
10040040-298 = "...А? Мне нельзя?"
10040040-299 = "Не ломать дронов...? Опять это..."
10040040-300 = "Но как ещё нам сбежать?"
10040040-301 = "[s31] «Дроны и окна принадлежат Семинар. Ничего не ломать.»\n[s32] «Давайте найдём способ обезвредить их без поломок.»"
10040040-304 = "Эм... И как, чёрт возьми...?"
10040040-305 = "Я смогу. Отключу их вручную, не взламывая."
10040040-306 = "Раз уж мы здесь, эту часть можете оставить нам."
10040040-307 = "Бу-у. А я думала, это идеальный шанс немного сбить спесь с системы безопасности Семинар."
10040040-308 = "Да... *вздох*... Надо было просто их разнести..."
10040040-309 = ""
10040040-312 = ""
10040040-313 = "...Ты... ведь часть Семинар, да?"
10040040-314 = "Ну, думаю, сейчас она примерно в том же положении, что и мы."
10040040-316 = "В любом случае, если решили так — медлить нельзя! Делаем прямо сейчас!"
10040040-317 = "В АТАКУ!!"
