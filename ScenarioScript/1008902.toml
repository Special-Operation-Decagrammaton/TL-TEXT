[translation]
1008902-1 = "Платье на вешалке"
1008902-2 = "Беспокоясь, что могло что-то случиться, я отправился в офис «Проблемы 68»."
1008902-3 = ""
1008902-8 = "[ns1] «...О. Открыто.»\n[ns2] «Есть кто-нибудь?»"
1008902-11 = "...А? Сенсей?"
1008902-12 = ""
1008902-15 = ""
1008902-16 = "Что случилось? У нас сегодня была встреча?"
1008902-17 = "Не может быть. Я помню расписание каждого..."
1008902-18 = "Но, похоже, всё-таки не каждого?"
1008902-19 = "Вы просто решили зайти?"
1008902-20 = "Ну, у меня сейчас ничего не запланировано. Почему бы не поболтать?"
1008902-21 = "Будем считать это возможностью укрепить наше деловое партнёрство. Заходите, Сенсей."
1008902-22 = ""
1008902-28 = ""
1008902-29 = ""
1008902-30 = "...Эм, Сенсей?"
1008902-31 = "Вы правда просто так зашли? На вас это не очень похоже..."
1008902-32 = "Что-то случилось?"
1008902-33 = ""
1008902-35 = ""
1008902-36 = "Говорите честно. Нам с вами незачем притворяться."
1008902-37 = "...А?"
1008902-38 = "О... То сообщение в MomoTalk, которое я отправила утром..."
1008902-39 = ""
1008902-41 = ""
1008902-42 = "...Ах."
1008902-43 = ""
1008902-45 = ""
1008902-46 = "Ага... П-Понятно. Хм... Вы, должно быть, сильно переживали..."
1008902-47 = "Н-На самом деле ничего не случилось... Честно говоря, даже объяснять неловко."
1008902-48 = "...А?"
1008902-49 = "На что вы смотрите, Сенсей?"
1008902-50 = "...А-а. ...На это?"
1008902-51 = ""
1008902-53 = ""
1008902-55 = "[ns3] «...Когда оно так висит, похоже на украшение.»\n[ns4] «Оно такое чистое. Ты с тех пор его ни разу не надевала?»"
1008902-58 = "Э-Эм..."
1008902-59 = "Д-Да, наверное..."
1008902-60 = "После всего, что случилось, и всех мыслей, которые крутились у меня в голове..."
1008902-61 = ""
1008902-63 = ""
1008902-64 = ""
1008902-65 = "Вообще-то утром я как раз хотела поговорить об этом наряде. Похоже, от разговора всё равно не уйти."
1008902-66 = "[s5] «Поговорить?»\n[s6] «О платье?»"
1008902-69 = "Ага..."
1008902-70 = "Во время прошлого задания я так старалась заполучить его. Но теперь, когда могу его носить, чувствую себя странно."
1008902-71 = "И что удивительно... сколько бы раз я его ни надевала, привыкнуть так и не получается."
1008902-72 = "Иногда оно просто поднимает мне настроение. Вот и всё."
1008902-73 = "*вздыхает*"
1008902-74 = "Может, мне просто продать его и потратить деньги на расходы «Проблемы 68»."
1008902-75 = "Оно ведь было таким дорогим..."
1008902-76 = "Но чем больше я об этом думаю, тем сильнее сомневаюсь, стоит ли от него избавляться."
1008902-77 = "Я всё думала, что бы вы на это сказали, и хотела спросить, когда у вас будет свободное время."
1008902-78 = "Вот к чему в итоге привёл наш утренний разговор в MomoTalk. В общем, как-то так."
1008902-79 = "...Это отвечает на ваш вопрос?"
1008902-80 = "...А?"
1008902-81 = "Что значит «жалко продавать»? Одного того, что оно иногда поднимает настроение, недостаточно!"
1008902-82 = "...Я что, на самом деле не люблю этот наряд?"
1008902-83 = "Н-Нет. Не в этом дело. Он мне очень нравится! Я сама его выбрала..."
1008902-84 = "Просто... сейчас от него нет никакой пользы... Управлять «Решалы 68» важнее, чем бегать вокруг в красивом платье."
1008902-85 = "...Даже если мне хотелось бы, чтобы было иначе..."
1008902-86 = "...А?"
1008902-87 = "А для чего ещё мне его надевать?"
1008902-88 = "Эм... Ну... Я об этом никогда толком не думала..."
1008902-89 = "...А?"
1008902-90 = "Мне не стоит его продавать? Почему?"
1008902-91 = "Я даже не знаю, что хочу с ним делать..."
1008902-92 = "[s7] «Не переживай из-за этого. Со временем разберёшься.»\n[s8] «Тебе не нужно искать идеальный повод надеть платье. Просто сохрани его до тех пор, пока такой повод сам не появится.»"
1008902-95 = "...????"
1008902-96 = "Э-Эм...? Вот как...?"
1008902-97 = "И что это вообще значит?"
1008902-98 = "Кажется, я понимаю... но, может, и нет..."
1008902-99 = ""
1008902-101 = ""
1008902-102 = "...Хи-хи."
1008902-103 = "Ладно, я поняла. Похоже, ваше мнение склоняется к тому, чтобы «пока оставить его.»"
1008902-104 = ""
1008902-106 = ""
1008902-107 = "С этим я могу согласиться. Тогда разговор о продаже пока отложим."
1008902-108 = "...Фух!"
1008902-109 = "Не знаю почему... но хотя мы ничего не решили, мне стало легче."
1008902-110 = "Следовало ожидать чего-то подобного, когда дело касается вас, Сенсей..."
1008902-111 = "Думаете, мне стало бы легче, если бы это сказал кто-нибудь другой?"
1008902-112 = "Хи-хи..."
1008902-113 = "Может, стоило просто спросить вас через MomoTalk ещё раньше..."
1008902-114 = ""
1008902-116 = ""
1008902-117 = "Хм..."
1008902-118 = "[s9] «...Ару?»\n[s10] «Что такое?»"
1008902-121 = "...Ничего."
1008902-122 = "Забудьте, что я только что сказала."
1008902-123 = "К тому же при личной встрече общаться понятнее, чем в переписке или по телефону. Так обсуждение получается качественнее."
1008902-124 = "...Хи-хи."
1008902-125 = "Так что впредь..."
1008902-126 = "Если нам когда-нибудь понадобится серьёзно поговорить..."
1008902-127 = ""
1008902-129 = ""
1008902-132 = "Почему бы вам не приходить сюда, чтобы обсудить всё лично, Сенсей."
