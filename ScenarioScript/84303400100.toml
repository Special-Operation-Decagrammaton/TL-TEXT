[translation]
84303400100-5 = "...Это совпадает с моей текущей оценкой."
84303400100-6 = "Передашь мне игру? Перед анализом кода я посмотрю, что можно понять из самого геймплея."
84303400100-7 = ""
84303400100-9 = ""
84303400100-10 = "Многие говорили, что игра доводит их до ярости. С тобой всё будет в порядке?"
84303400100-11 = "Всё нормально. Я долго училась владеть своими эмоциями."
84303400100-23 = ""
84303400100-24 = "..."
84303400100-25 = "...Рио?"
84303400100-26 = "*выдыхает*"
84303400100-27 = "*вдох* *выдох*"
84303400100-28 = "Рио...? Рио, ты в порядке?"
84303400100-29 = "Я в порядке... кажется."
84303400100-30 = "Играть слишком опасно. Я сразу перейду к анализу кода."
