[translation]
31150-1 = "Episódio 15;A Vice-Presidente do Comitê de Justiça (2)"
31150-4 = "...Bom,"
31150-5 = "S-Só pra deixar claro, dessa vez foi mesmo um engano!"
31150-6 = "[s] \"...?\""
31150-7 = "Os de sempre eu escondo direit... quer dizer, eu nem costumo andar com essas coisas por aí..."
31150-8 = "[s] \"Tem que esconder direitinho para não descobrirem, né.\""
31150-9 = "!?!?"
31150-10 = "O-O que você tá dizendo!? Isso é o mesmo que dizer que tudo bem ter, contanto que ninguém descubra!?"
31150-11 = "V-Você é o Sensei, não é!? O que tem na cabeça!? Coisas pervertidas são proibidas! Pena de morte!!"
31150-12 = "[s] \"Por essa lógica, você também seria condenada, Koharu...\""
31150-13 = "Quê, n-não, espera...!?"
31150-14 = "E-Eu, hum..."
31150-15 = "S-Sobre isso, foi mesmo um engano! Ou seja, não conta!!"
31150-16 = "[s] \"Certo, então vamos deixar assim.\""
31150-17 = "...!? Q-Que história é essa!? Está querendo bancar o adulto compreensivo!?"
31150-18 = "[s] \"Acontece muita coisa, mas acho que você não precisa se prender tanto a regras.\""
31150-19 = "Hã...?"
31150-20 = "[s] \"Porque a Koharu é a Koharu.\""
31150-21 = "..."
31150-22 = "Acho que entendi, mas ao mesmo tempo não entendi..."
31150-23 = "É, mas..."
31150-24 = "Deu pra perceber um pouquinho que você está preocupado comigo, Sensei..."
31150-25 = "..."
31150-26 = "E-Então tá!"
31150-27 = "Em troca, vou te contar um segredo meu!"
31150-28 = "[s] \"Um segredo?\""
31150-29 = "..."
31150-34 = "Na verdade, eu..."
31150-35 = "...Sou uma espiã enviada para vigiar se o Clube de Aulas de Reforço está funcionando direito!"
31150-36 = "[s] \"...Uma espiã?\""
31150-37 = "Ou seja, estou cumprindo uma missão secreta. Então, pode até parecer que sou meio burrinha agora, mas tudo isso não passa de um disfarce!"
31150-38 = "[s] \"Uma missão... Sob ordens de quem...?\""
31150-39 = "U-Uh, bom... D-De quem, é que..."
31150-40 = "Hum... D-Da Hasumi-senpai!"
31150-41 = "Isso mesmo! A Hasumi-senpai é superforte até para os padrões da Trinity, além de ser a vice-presidente do Comitê de Justiça!"
31150-46 = "A-Ah, e tem mais, isso! T-Também tem a presidente Tsurugi!"
31150-47 = "[s] \"...Entendo.\""
31150-48 = "A-A presidente Tsurugi é, bom, hum, a presidente... Isso, ela sabe fazer de tudo! E-Excelente nos estudos e nas artes marciais...? É isso! Provavelmente!"
31150-49 = "Só me encontrei com ela algumas vezes, mas... e-enfim, ela é incrível!"
31150-50 = "Então é isso aí. Pode ficar sabendo que não entrei no Clube de Aulas de Reforço porque sou ruim nos estudos de verdade!"
31150-51 = "Eu sou da elite, encarregada de uma importante missão de espionagem!"
31150-52 = "[s] \"Ah, é mesmo?\""
31150-53 = "Hehe."
31150-54 = "[s] \"Mas tudo bem mesmo você me contar isso?\""
31150-55 = "...!!"
31150-56 = "U-Um Sensei não sairia espalhando o segredo de uma aluna por aí, né!? Não vai contar, né!? ...E-Então tá tudo bem!"
31150-61 = "Comitê de Justiça - Sala de Controle de Itens Confiscados"
31150-63 = "...Pronto, assim está bom."
31150-64 = "Por enquanto, que alívio—"
31150-70 = "...Koharu?"
31150-71 = "H-Hasumi-senpai!?"
31150-72 = "E até o Sensei...? Eu tinha ouvido falar que estavam no anexo para o acampamento de estudos. Aconteceu alguma coisa?"
31150-73 = "Você deveria estar proibida de entrar e sair daqui até que suas notas melhorassem..."
31150-74 = "É-É que, não é isso, hum..."
31150-75 = "[s] Inventar uma boa desculpa."
31150-77 = "...Entendo, vieram buscar livros para usar nas aulas."
31150-78 = "Sendo esse o caso, não há o que fazer."
31150-79 = "S-Sim..."
31150-80 = "Mas, de certa forma, vieram em boa hora. Havia algo que eu queria reforçar com a Koharu..."
31150-81 = "Hã? C-Comigo...?"
31150-82 = "Sensei, peço desculpas, mas poderia nos dar licença por um momento? Digamos que é um assunto do Comitê de Justiça..."
31150-83 = "[s] \"Claro, tudo bem.\""
31150-84 = "...Desculpe o incômodo, e muito obrigada."
31150-86 = "Decidi esperar na sala ao lado."
31150-91 = "...Koharu...... por favor..."
31150-92 = "Não se...... do seu verdadeiro........."
31150-94 = "[ns] (Mesmo a essa distância, ainda consigo ouvir um pouco das vozes...)"
31150-96 = "Mas...... para...... é impossível..."
31150-97 = "...Algo assim...... é demais...... para..."
31150-98 = "Assim não pode ser!"
31150-99 = "[ns] (No instante em que pensei em me afastar mais, ouvi o grito da Hasumi...)"
31150-101 = "...Faça......... sempre...... pelo bem de........."
31150-102 = "...O Sensei...... é........."
31150-103 = "...Sim......... entend..."
31150-107 = "D-Desculpa a demora... Sensei?"
31150-108 = "...Você não ia voltar?"
31150-109 = "[s] \"...Koharu, está tudo bem?\""
31150-110 = "Hã? S-Sim? Está tudo bem, por quê...?"
31150-112 = "Voltei ao lado da Koharu..."
31150-113 = "E assim, mais um dia vai chegando ao fim."
31150-115 = "Próximo;Uma Pequena Fresta"
