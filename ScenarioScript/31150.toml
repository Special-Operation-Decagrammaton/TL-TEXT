[translation]
31150-1 = "Эпизод 15;Вице-президент Комитета правосудия, часть 2"
31150-4 = "..."
31150-5 = "П-Просто уточню: всё это действительно большое недоразумение!"
31150-6 = "[s] «А? Что именно?»"
31150-7 = "Т-Та... книга. Обычно я лучше её прячу. Я-я хотела сказать, обычно я её с собой не ношу."
31150-8 = "[s] «В следующий раз не попадайся.»"
31150-9 = "...?!"
31150-10 = "Что вы пытаетесь сказать?! Что нарушать правила нормально, если тебя не поймают?!"
31150-11 = "Вы взрослый! Сенсей! Непристойность запрещена! Вас приговорят к смерти! Смерть!!!"
31150-12 = "[s] «Разве тебе тогда не дадут тот же приговор?»"
31150-13 = "...?!"
31150-14 = "Я-я..."
31150-15 = "Я просто честно ошиблась! Это не считается!"
31150-16 = "[s] «Как скажешь.»"
31150-17 = "Да, как я сказала! Вы издеваетесь?!"
31150-18 = "[s] «Не нужно стыдиться быть собой.»"
31150-19 = "А-А?"
31150-20 = "[s] «Тебе стоит спокойнее относиться к тому, кто ты есть.»"
31150-21 = "..."
31150-22 = "Я-я не понимаю, о чём вы."
31150-23 = "Но..."
31150-24 = "...я знаю, что вы пытаетесь обо мне позаботиться."
31150-25 = "..."
31150-26 = "Хмф!"
31150-27 = "Ладно! Тогда я в ответ расскажу важный секрет!"
31150-28 = "[s] «Секрет?»"
31150-29 = "..."
31150-30 = ""
31150-32 = ""
31150-33 = ""
31150-34 = "Правда в том..."
31150-35 = "...что я шпион, отправленный сюда следить за успехами Клуба дополнительных занятий."
31150-36 = "[s] «...?»"
31150-37 = "Проще говоря, я выполняю секретную миссию. Я только притворяюсь и на самом деле вовсе не такая идиотка!"
31150-38 = "[s] «Кто тебя отправил?»"
31150-39 = "К-Кто отправил...?"
31150-40 = "А, точно. Эм... Хасуми!"
31150-41 = "Именно! Хасуми — могущественный вице-президент Комитета правосудия Тринити!"
31150-42 = ""
31150-44 = ""
31150-45 = ""
31150-46 = "А-А над ней... Президент Цуруги! Она всё поддерживает!"
31150-47 = "[s] «Вот оно как.»"
31150-48 = "П-Потому что президент Цуруги гениальна! Будто видит на тысячу ходов вперёд. Мастер пера и меча!"
31150-49 = "Или, по крайней мере, так говорят. Мне не так часто разрешали её видеть... но я знаю, что это правда!"
31150-50 = "Теперь понимаете? Я оказалась в Клубе дополнительных занятий не потому, что плохо учусь!"
31150-51 = "На самом деле я потрясающий шпион, выполняющий важную тайную миссию!"
31150-52 = "[s] «Как скажешь.»"
31150-53 = "..."
31150-54 = "[s] «Ты уверена, что можно раскрывать мне прикрытие?»"
31150-55 = "...?!"
31150-56 = "В-Вы ведь не выдадите мой секрет, Сенсей? Я рассказала, потому что знаю, что могу вам доверять!"
31150-57 = ""
31150-59 = ""
31150-61 = "Комната контрабанды"
31150-63 = "*вздох* Готово. Я вернула всё на место."
31150-64 = "Слава богу, всё закончилось. Теперь можем—"
31150-65 = ""
31150-69 = ""
31150-70 = "Кохару?"
31150-71 = "Х-Хасуми?!"
31150-72 = "И Сенсей с тобой. Разве вы оба не должны быть в дополнительном корпусе на учебном лагере?"
31150-73 = "Тебе запрещено возвращаться в Комитет правосудия, пока оценки не будут выше проходного."
31150-74 = "Я знаю, но дело в том, эм..."
31150-75 = "[s] Придумать хорошую отговорку."
31150-77 = "А, значит, ты пришла взять книгу для учёбы."
31150-78 = "Конечно. Вполне уважительная причина."
31150-79 = "Д-Да."
31150-80 = "На самом деле очень вовремя. Мне как раз нужно было кое-что с тобой обсудить."
31150-81 = "Что? С-со мной...?"
31150-82 = "Прошу прощения, Сенсей, но можно нам немного поговорить наедине? Это важное дело только для членов Комитета правосудия."
31150-83 = "[s] «Хорошо.»"
31150-84 = "Простите, Сенсей."
31150-86 = "Я решил подождать в соседней комнате."
31150-91 = "Пожалуйста... Кохару."
31150-92 = "Не теряй... свою цель..."
31150-94 = "[ns] «...»"
31150-96 = "Но... не думаю... что смогу..."
31150-97 = "Как... я не... эта миссия..."
31150-98 = "Другого выбора нет! Это нужно сделать!"
31150-99 = "[ns] «(Это сейчас кричала Хасуми...)»"
31150-101 = "Прости... но... единственный способ ты..."
31150-102 = "...для меня... Сенсей... помоги нам..."
31150-103 = "Хорошо. Я... попробую..."
31150-107 = "Простите за ожидание, Сенсей."
31150-108 = "Пойдём обратно."
31150-109 = "[s] «Всё в порядке?»"
31150-110 = "Хм? Да, не о чем переживать."
31150-112 = "Мы с Кохару отправились обратно."
31150-113 = "Второй день учебного лагеря тихо подошёл к концу."
31150-115 = "Следующий эпизод;Трещина на поверхности"
