[translation]
1600302-1 = "Линчеватели Тринити"
1600302-2 = "Магазин на окраине Тринити."
1600302-3 = "Три энергетика, свиной бэнто, чёрный кофе... С вас 1130 иен."
1600302-4 = "Спасибо. Приходите ещё!"
1600302-5 = "*вр-р-р* ... *дзынь*"
1600302-6 = "Ещё один так скоро. Добро пожаловать! Чем могу... помочь..."
1600302-7 = "*бах* *бах* *бах* *бах* *бах* *бабах* *бум*"
1600302-8 = "...?!"
1600302-9 = "Не двигаться! На пол, руки так, чтобы мы их видели! Это ограбление!"
1600302-10 = "Без глупостей! Сидите тихо, если хотите выбраться отсюда живыми!"
1600302-11 = "А-а-ай! Это район Тринити! Вам это с рук не сой—!"
1600302-12 = "Не сойдёт, да? А вот и нет! Уже сходит!"
1600302-13 = "Комитета правосудия нигде нет. Мы всё разведали!"
1600302-14 = "Даже они не могут патрулировать каждый уголок такой глуши!"
1600302-15 = "Даже не надейтесь! Открывайте сейф и отдавайте всё, что есть!"
1600302-16 = "...?"
1600302-17 = "А? Что это?"
1600302-18 = "Ха-ха. Разве ты не знаешь, что в твоём возрасте опасно гулять ночью в одиночку?"
1600302-19 = "Плохие старшеклассницы ещё похитят тебя! Ха-ха! Осторожнее надо быть!"
1600302-20 = "Раз уж так вышло, можно и немного повеселиться."
1600302-21 = "*грохот*"
1600302-22 = "Какого...? Это что...?"
1600302-23 = "Светошумовая граната?"
1600302-25 = "*бах* *звя-я-я-янь*"
1600302-26 = "А! Ай! Ничего не вижу!"
1600302-27 = "Плохо вы разведали. На всякий случай я патрулировала здесь."
1600302-28 = "Э-этот голос! Не может быть! Что здесь делает Патрульная команда?!"
1600302-31 = "*бах* *бах* *бах* *бум* *пуф*"
1600302-32 = "Угх... А-а-аргх... Ай!"
1600302-33 = "Бах...! Ч-что происходит...? Угх!"
1600302-34 = ""
1600302-35 = "Серьёзно. Вам не надоело, что я вас избиваю?"
1600302-36 = "А? Что вы здесь делаете, Сенсей?"
1600302-37 = "[s] «Привет»."
1600302-38 = "З-здравствуйте. Не ожидала увидеть вас здесь."
1600302-39 = "Я хотела снова с вами встретиться, но не думала, что вот так."
1600302-40 = "Это плохо. В вашем возрасте нельзя так поздно гулять одному."
1600302-41 = "Что будете делать, если вас похитит какая-нибудь хулиганка-старшеклассница? Возвращайтесь в клубную комнату."
1600302-42 = "Хотите, чтобы я вас проводила? Это было бы..."
1600302-43 = "...Вы боитесь, что вас может похитить плохая старшеклассница?"
1600302-44 = "*вздыхает*"
1600302-45 = "Хорошо. Если нужно, я вас провожу."
1600302-46 = "Но перед уходом мне следует закончить подавление этих хулиганок."
1600302-47 = "А-а-а-ай! Ч-что вы собираетесь с нами делать?!"
1600302-48 = "Хватит кричать. Я вас разоружу, но больно почти не будет."
1600302-49 = ""
1600302-50 = "Вместо этого я привяжу вас обеих к столбу и оставлю слушать «Baby» Остина Дибера на повторе."
1600302-52 = "...?!"
1600302-53 = "Почему именно эту песню?! Она уже сто лет не популярна!"
1600302-54 = "Ты что, динозавр поп-музыки?!"
1600302-55 = ""
1600302-56 = "А-а-а-а-а-а-а-а-а!"
1600302-57 = ""
1600302-59 = "[ns1] «...Какое жестокое наказание.»\n[ns2] «Отличная работа.»"
1600302-60 = "Они пытались ограбить магазин. Заслужили."
1600302-61 = "Было непросто, но я лишь делаю то, что должна."
1600302-62 = "Пойдёмте, Сенсей. Пока я рядом, ваша безопасность гарантирована."
1600302-63 = "Сюда."
1600302-64 = ""
1600302-65 = "[ns] Следовать за Сузуми."
1600302-68 = "После этого мы с Сузуми полчаса шли до «Шале»."
1600302-69 = "Вот мы и пришли. Вам прямо через этот переулок."
1600302-70 = "Отсюда уже можно идти одному. Уже поздно, так что скорее заходите внутрь."
1600302-71 = "А? Не нужно меня благодарить. Я просто выполняла обязанности Патрульной команды."
1600302-72 = "Даже если это неофициальный клуб..."
1600302-73 = "В Тринити слишком часто происходят такие происшествия, как сегодня.#nМы должны продолжать работать, чтобы сохранять порядок."
1600302-74 = "Что вы сказали? Сегодня было весело?"
1600302-75 = "Я... не понимаю."
1600302-76 = "Вы едва не оказались заложником. Что здесь могло быть весёлого?"
1600302-77 = "Что?"
1600302-78 = "Весело было идти сюда пешком?"
1600302-79 = "Но ведь ничего не произошло. Что тут вообще могло быть весёлого?"
1600302-80 = "[s3] «Меня сопровождала сама Сузуми.»\n[s4] «Я смог прогуляться с тобой, Сузуми.»"
1600302-81 = "...!"
1600302-82 = "...!"
1600302-83 = "Т-тем не менее, моя работа здесь закончена. В-вы должны зайти внутрь!"
1600302-84 = "..."
1600302-85 = ""
1600302-86 = "...Признаю, мне тоже понравилось."
1600302-87 = "Мы почти не разговаривали, но прогулка была приятной."
1600302-88 = "Почему-то, когда я рядом с вами... я забываю, что состою в Патрульной команде."
1600302-89 = "Надеюсь, в следующий раз мы встретимся при более спокойных обстоятельствах."
1600302-90 = "Желательно днём, а не после наступления темноты."
1600302-91 = ""
1600302-92 = ""
1600302-93 = ""
1600302-94 = "Ах да. Вот вам подарок на прощание."
1600302-95 = "[s] «Светошумовая граната?»"
1600302-96 = "Это не оружие, но вы сможете использовать её для самообороны."
1600302-97 = "Пожалуйста, возьмите."
1600302-98 = "Прошу прощения? Почему она вам не нужна?"
1600302-99 = "Потому что у вас есть я, чтобы з-защищать вас...?"
1600302-100 = "К-конечно, я буду! Это само собой...!"
1600302-101 = "..."
1600302-102 = "В этом и состоит задача Патрульной команды."
1600302-103 = "Мне пора, Сенсей. Доброй ночи."
1600302-105 = "Сузуми развернулась и быстро исчезла."
1600302-106 = "И почему-то её походка казалась совсем не такой, как раньше."
