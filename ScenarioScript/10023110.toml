[translation]
10023110-1 = "Эпилог;Счастливый финал уже доступен!"
10023110-2 = ""
10023110-3 = ""
10023110-5 = "..."
10023110-6 = "..."
10023110-7 = "Ик!"
10023110-9 = "А-а-а! Нэру злится! Мне страшно!"
10023110-11 = "Эй, дети..."
10023110-12 = "Мы справились! Прости нас, Нэру!"
10023110-13 = "А? За что вы извиняетесь?!"
10023110-14 = "Ты правда заставишь нас перечислять проступки по одному? Это слишком жестоко!"
10023110-15 = "Вы только что сказали, что вам жаль, а теперь внезапно я слишком жестокая? У неё винтика не хватает, как и у всех вас."
10023110-16 = "И все остальные тоже! Простите меня! Если бы я с самого начала не согласилась... Если бы просто отказалась от заказа и сбежала...!"
10023110-17 = "Теперь всё кончено... Нэру нас уничтожит, а Отдел разработки игр распустят... Мы фактически выдавали себя за другой клуб, тут даже оправдаться нечем..."
10023110-18 = "*шмыг* Мы так старались сохранить нашу клубную комнату... *шмыг* Мы рисковали жизнью, чтобы Юзу и Арис остались вместе..."
10023110-20 = "Момои..."
10023110-21 = "Н-не плачь, Момои..."
10023110-22 = "Смотрите, я не плачу. Потому что поняла: даже если мы будем далеко друг от друга, наши сердца всё равно останутся вместе!"
10023110-24 = "Эй... Кажется, вы тут что-то очень сильно неправильно поняли..."
10023110-25 = "Я ведь даже ничего не ска—"
10023110-26 = "Стойте! Вы правда так обо мне думаете?!"
10023110-27 = "Хи-хи. Интересно, откуда такое взялось."
10023110-28 = "Не смотрите на меня так! Я ничего не делала, чтобы заслужить такую репутацию! По крайней мере, с детьми!"
10023110-30 = "Прости, Нэру."
10023110-31 = "Я вернула улики и Корону, но упустила подозреваемого. Я провалилась."
10023110-33 = "Ты не провалилась. Мы прихлопнули его сразу, как приехали."
10023110-34 = "...! Прошу прощения, что из-за моей некомпетентности вам пришлось пачкать руки."
10023110-35 = "Да расслабься ты. Я уже всё знала. Все довольны и целы, так какая разница, что было между началом и концом?"
10023110-36 = "И ещё..."
10023110-37 = ""
10023110-39 = ""
10023110-41 = "Эй, мелкие."
10023110-42 = ""
10023110-45 = ""
10023110-46 = "И-и-и!!"
10023110-47 = "П-пожалуйста, пощади меня...!"
10023110-49 = "Нэру, пожалуйста, выслушай меня."
10023110-50 = "А-а-а?"
10023110-51 = "Пожалуйста, не вини во всём Отдел разработки игр."
10023110-52 = "Хм."
10023110-53 = "Я виновата не меньше них!"
10023110-54 = "Я должна была сообщить старшекурсницам и ждать подкрепления, но не сделала этого."
10023110-55 = "Вместо этого я работала вместе с Отделом разработки игр как член их отряда и как... как друг!"
10023110-56 = "Поэтому, что бы ни случилось, я разделю с ними всю ответственность."
10023110-58 = "П-правильно, Нэру! Мы с Токи члены одного отряда. Мы друзья!"
10023110-59 = "Я узнала, что друзья помогают друг другу, когда кому-то тяжело, как было с Токи! Поэтому я... я..."
10023110-61 = "Да замолчите уже все! Я ни на кого не злюсь."
10023110-62 = "Уф, как же это сказать?"
10023110-63 = "Ну... Молодцы, все."
10023110-64 = ""
10023110-67 = ""
10023110-68 = "...Стой, что? Н-Нэру, это точно ты?"
10023110-69 = "*вздох* Только не говори, что это двойник, который просто выглядит как Нэру!"
10023110-71 = "ДА ЧТО ВЫ НЕСЁТЕ?! ЗАТКНИТЕСЬ!"
10023110-72 = "Господи. Почему так сложно просто сказать кому-то чёртов комплимент?"
10023110-74 = "Т-ты точно в порядке...?"
10023110-75 = "А-а-а?"
10023110-76 = ""
10023110-78 = ""
10023110-79 = "Может, вы и... одолжили имя C&C, но плохого парня всё-таки посадили."
10023110-80 = "Мне не на что жаловаться. Вы, мелкие, молодцы."
10023110-81 = "Сдадим всё Валькирии — и дело закрыто."
10023110-82 = ""
10023110-85 = ""
10023110-86 = "(Ого... В отличие от её роста, сердце у Нэру, похоже, действительно большое...)"
10023110-87 = "(Момои! Тише! Она может услышать!)"
10023110-88 = ""
10023110-90 = ""
10023110-92 = ""
10023110-93 = "Хм, и ты. Токи. Почему..."
10023110-94 = "Да. Я с радостью приму любое наказание, которое вы сочтёте нужным."
10023110-95 = "Да господи! Я! Ни! На! Кого! Не! Злюсь! Ради всего Кивотоса!"
10023110-96 = "Для начала — почему костюм кролика?"
10023110-97 = "Потому что это форма C&C для проникновения."
10023110-98 = ""
10023110-100 = ""
10023110-101 = "*вздыхает*"
10023110-102 = "Аргх. Вот именно поэтому идея носить такое была идиотской!"
10023110-104 = "Хм? Что ты имеешь в виду, Президент?"
10023110-105 = "Тебе очень шло! Аха-ха! Токи, тебе тоже идёт!"
10023110-106 = ""
10023110-109 = ""
10023110-110 = "Спаси... бо."
10023110-111 = "Уф! Да неважно."
10023110-112 = "Хм, я хочу сказать..."
10023110-114 = "Да. Испытательный срок, самоанализ, домашний арест. Я готова ко всему."
10023110-115 = "БОЖЕ МОЙ!"
10023110-116 = "Я больше не могу это терпеть..."
10023110-117 = "[s1] «Нэру прямо сейчас тоже пытается тебя похвалить, Токи.»\n[s2] «И хочет извиниться за то, что ходила на миссии без тебя.»"
10023110-118 = ""
10023110-119 = ""
10023110-121 = "С-Сенсей?!?!"
10023110-122 = "Уф... Я забыла про Сенсея..."
10023110-124 = "Что... имел в виду Сенсей?"
10023110-125 = "Да ладно! Серьёзно?"
10023110-126 = ""
10023110-128 = ""
10023110-129 = "...Молодец, и прости."
10023110-130 = "Я... Ну, я не хотела оставлять тебя позади."
10023110-131 = "Просто так вышло. И ты хорошо справилась в сложной ситуации."
10023110-132 = "Так что, ну... отличная работа. Вот и всё."
10023110-134 = "Прости, Токи. Она не очень умеет быть честной в таких разговорах."
10023110-135 = "А ТЕБЯ кто просил вмешиваться, а?!"
10023110-136 = "Да, Токи! Отличная работа!"
10023110-137 = ""
10023110-139 = ""
10023110-141 = ""
10023110-142 = "Спасибо, все."
10023110-144 = "Я так устала... Столько работы, и всё впустую..."
10023110-145 = "Ну, по крайней мере, мы получили вдохновение для нового проекта."
10023110-146 = "Нового проекта...?"
10023110-147 = "Наверное... Идей отсюда мы и правда набрали кучу..."
10023110-148 = "[s] «Вы ещё получите награду от Валькирии.»"
10023110-149 = "Что, награду? В смысле, Сенсей? Какую награду?"
10023110-150 = "[s3] «Оказывается, за украденные предметы была назначена награда.»\n[s4] «За украденные предметы полагалась награда.»"
10023110-153 = "Так вот она, награда за задание! Получены призовые деньги! Бум-бум-бум!"
10023110-155 = ""
10023110-156 = "О, тогда на деньги из награды... М-мы должны купить новые FlyStation...!"
10023110-157 = "Уверена, ты знаешь способы потратить их получше, Момои."
10023110-158 = "Эй! Ну же! Мы Отдел разработки игр! Значит, должны тратить деньги на игры!"
10023110-160 = "У меня есть идея!"
10023110-161 = "Президент Отдела разработки игр — Юзу! Пусть она и решает!"
10023110-162 = ""
10023110-164 = ""
10023110-166 = ""
10023110-167 = "У меня... есть идея..."
10023110-168 = "Правда? Какая?!"
10023110-169 = "Я... подумала, что можно вложить их и наконец начать наш новый проект."
10023110-170 = "Вложить... в новый проект?"
10023110-172 = "...Кстати, кажется, бюджет на исследования и разработки от Семинар у нас почти закончился."
10023110-173 = "Юзу всегда на шаг впереди!"
10023110-175 = "Если мы... используем идеи, которые получили здесь..."
10023110-176 = "Думаю, мы сможем придумать... что-нибудь очень крутое."
10023110-178 = "О, тогда у меня есть идея!"
10023110-179 = "Так, слушайте, слушайте. Значит..."
10023110-180 = "Нет. Я уже говорила: если есть идея — оформи предложение!"
10023110-181 = "И-и! Но у меня плохо получается писать такие штуки, Мидори."
10023110-182 = "Ты вообще-то наш сценарист и планировщик! Ты не можешь плохо УМЕТЬ ПИСАТЬ!"
10023110-184 = "Наверное... стоит начать писать код сразу, как вернёмся..."
10023110-186 = "О! О! Стой, Мидо! Меня захлёстывает потоком идей!"
10023110-187 = "...Может, сначала немного поиграем, чтобы упорядочить мысли?"
10023110-188 = "Нет. Халтурить. Нельзя. Думаешь, меня так легко обмануть?!"
10023110-190 = "Я всегда готова! Ко всему, что бы мы ни делали!"
10023110-192 = "Все такие энергичные... Хи-хи..."
10023110-197 = "Весёлая компания сидела вместе, болтала и смеялась."
10023110-198 = "Ночь становилась всё глубже, но, похоже, никого это не волновало."
10023110-200 = "Что ж..."
10023110-204 = "[ns] «Момои.»"
10023110-205 = "А? Что такое, Сенсей?"
10023110-206 = "[s] «Это была безумная череда событий...»"
10023110-207 = "О да, ещё какая..."
10023110-208 = "Пару раз я думала, что мы влипли по-крупному. Уф..."
10023110-209 = "Но, знаешь..."
10023110-210 = "[s] «Хм?»"
10023110-211 = "Юзу, Мидори, Арис и даже... Токи...!"
10023110-212 = "Мне было так весело со всеми!"
10023110-213 = "А вы, Сенсей?"
10023110-214 = "[s] «Ага. Было весело.»"
10023110-215 = "Ага!"
10023110-216 = ""
10023110-219 = ""
10023110-220 = "Улыбки на лицах Момои и остальных членов Отдела разработки игр всё ещё сияли после целого года испытаний и трудностей."
10023110-225 = "«Для меня ты прежде всего мой студент.»"
10023110-229 = ""
10023110-230 = ""
10023110-232 = ""
10023110-233 = "..."
10023110-234 = ""
10023110-236 = ""
10023110-237 = "«Для меня ты прежде всего мой студент.»"
10023110-238 = "Сенсей."
10023110-239 = ""
10023110-242 = "«Для меня ты прежде всего мой студент.»"
10023110-243 = "*вздыхает*"
10023110-244 = "У меня горячее дыхание. В груди тесно. Сердце колотится."
10023110-245 = "Но мне не больно — наоборот, я взволнована."
10023110-246 = "Почему так? Вы знаете ответ, Сенсей?"
10023110-247 = "..."
10023110-248 = "Нет ничего, что нельзя украсть, а красотой должны наслаждаться все."
10023110-249 = "Мы рождаемся без имён, а наша жизнь — долгий путь к следующему выбору."
10023110-250 = "Что ж. До следующей встречи."
10023110-251 = ""
10023110-253 = ""
10023110-254 = ""
10023110-256 = "Когда мы наконец встретимся снова, мы оба уже будем другими..."
10023110-259 = "Алебастровая визитная карточка: Маскарад в особняке и сущность красоты"
