1000502-3 = "Значит, киты задерживают дыхание, когда спят... Разве не удивительно?"
1000502-4 = "[s1] «Как мы вообще заговорили о китах?»\n[s2] «С чем тебе помочь?»"
1000502-5 = "Эх. Расслабьтесь немного, Сенсей."
1000502-6 = "Эх. Расслабьтесь немного, Сенсей."
1000502-7 = "Вообще-то мне нужна помощь с физической работой. Есть кое-что, что я не могу сдвинуть одна."
1000502-8 = "Я пришла к вам, потому что все остальные очень заняты."
1000502-9 = "И я рада, что вы здесь. Я знала, что могу на вас рассчитывать."
