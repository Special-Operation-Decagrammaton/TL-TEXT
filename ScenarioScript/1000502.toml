1000502-17 = "*кхе* *кхе* Вот мы и пришли. Здесь бы не помешало прибраться от пыли..."
1000502-18 = "О, осторожнее там, Сенсей. Смотрите под ноги."
1000502-19 = "[s3] «Разве это место не...?»\n[s4] «Кладовая?»"
1000502-20 = "Ага, это одна из тех складских комнат кампуса, про которые все постоянно забывают. У нас таких довольно много."
1000502-21 = "Ага, это одна из тех складских комнат кампуса, про которые все постоянно забывают. У нас таких довольно много."
1000502-22 = "Большую часть старого оборудования, которым ещё можно пользоваться, продают, так что сюда попадает в основном хлам."
1000502-23 = ""
1000502-24 = "Но если искать в правильных местах, иногда..."
1000502-25 = "*кхе* *кхе* Та-дам!"
1000502-26 = "Можно найти вот такие настоящие сокровища!"
1000502-27 = "[s5] «Коврик для тренировок?»\n[s6] «Зачем он тебе?»"
1000502-28 = "Кхм, это не обычный тренировочный коврик. Он тоже хранит традиции славного и богатого прошлого нашей академии!"
1000502-29 = "Кхм, это не обычный тренировочный коврик. Он тоже хранит традиции славного и богатого прошлого нашей академии!"
1000502-30 = "Это коврик из настоящего утиного пуха!"
