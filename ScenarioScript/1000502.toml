1000502-32 = "Если бы это было одеяло, я бы ещё поняла, но кто вообще набивает тренировочный коврик утиным пухом? Какая странность."
1000502-33 = "Хех, просто некоторые люди такие эксцентричные. Мир полон вещей, существующих лишь ради того, чтобы отличаться от остальных."
1000502-34 = "Если это вообще имеет смысл. Надеюсь, я не слишком ударилась в философию."
1000502-35 = "В любом случае будет жалко, если он пропадёт зря. ♪"
1000502-36 = "Не могли бы вы взять его, Сенсей?"
1000502-37 = ""
1000502-38 = ""
