[translation]
84306100500-5 = "Хорошая работа. Всё прошло куда гладче, чем я ожидала."
84306100500-6 = "Похоже, в вопросах заданий и проникновения интуиция Микамо Нэру точнее моих расчётов. Полагаю, дело в различии наших исходных данных."
84306100500-7 = "Без твоего сканера я бы не справилась. Но спасибо, я рада, что всё получилось."
84306100500-8 = "...Если не возражаешь, что именно я нашла?"
84306100500-9 = "Это выглядело как обычный игрушечный пистолет."
84306100500-10 = "...А, ты про это?"
84306100500-11 = "Это «луч увеличения роста». Он поражает цель огромным количеством энергии, из-за чего она на несколько минут становится выше."
84306100500-12 = "Невероятно."
84306100500-13 = ""
84306100500-15 = ""
84306100500-16 = "...Погоди, тогда зачем нам было его забирать? Разве не такие вещи и ожидаешь увидеть на этом Экспо?"
84306100500-17 = "Обычно — да. Если бы мы могли быть уверены, что устройство останется в допустимых пределах."
84306100500-18 = "Допустимых пределах?"
84306100500-19 = "В этом контексте увеличение роста на несколько десятков сантиметров не повод для тревоги. Как ты и сказала, на таком мероприятии вполне ожидаешь увидеть экспериментальную технологию такого рода."
84306100500-20 = "Но представь, что устройство сломается и увеличит кого-нибудь уже на несколько десятков метров."
84306100500-21 = "О, на несколько десятков метров..."
84306100500-22 = "...Погоди, что?"
84306100500-23 = "З-Зачем вообще разрешили такую штуку в выставочном зале...?!"
84306100500-24 = "Они ищут инвесторов. Исследования стоят огромных денег."
84306100500-25 = "Они утверждают, что когда луч будет закончен, смогут «накормить десятки людей одной клубникой», но..."
84306100500-26 = "...для Экспо это слишком большой риск. К сожалению, пока придётся его конфисковать."
84306100500-27 = "...Я... понимаю. Понятно."
84306100500-28 = "(Теперь мне неловко, что всю дорогу сюда я вертела его в руках. Что было бы, если бы я случайно выстрелила в себя?)"
84306100500-29 = "Уверена, скоро снова с тобой свяжусь."
84306100500-30 = "А пока — хорошая работа. Отдохни немного."
