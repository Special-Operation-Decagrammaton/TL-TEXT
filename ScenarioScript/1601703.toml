[translation]
1601703-1 = "Ненавижу этот мир"
1601703-2 = "Я отправился туда, где Аоба попросила меня встретиться с ней."
1601703-3 = ""
1601703-8 = "[ns] «Это точно то место...?»"
1601703-9 = ""
1601703-12 = "А, Сенсей...!"
1601703-13 = ""
1601703-16 = ""
1601703-17 = "С-Спасибо, что пришёл..."
1601703-18 = "Я не была уверена, что ты действительно придёшь."
1601703-19 = ""
1601703-21 = ""
1601703-22 = "А! С-Сегодня я занимаюсь обслуживанием сигнализации."
1601703-23 = "Мне сказали, что сигнал на этом переезде постоянно как-то странно мигает..."
1601703-24 = "Ну, сигнализация срабатывает даже тогда, когда поезд не идёт..."
1601703-25 = ""
1601703-28 = "А, ага, вот оно..."
1601703-29 = "[s] «Похоже, лучше поскорее это починить.»"
1601703-30 = "В-Верно. Так, сначала диагностика..."
1601703-31 = ""
1601703-33 = ""
1601703-34 = ""
1601703-35 = "Хм-м... С проводкой вроде всё нормально..."
1601703-36 = "Может, проблема в датчике...?"
1601703-37 = ""
1601703-39 = ""
1601703-40 = "Так, посмотрим..."
1601703-41 = ""
1601703-43 = ""
1601703-44 = "Ха-я...!"
1601703-45 = ""
1601703-49 = "Е-Ещё раз...!"
1601703-50 = ""
1601703-54 = "[ns] «Э-Это нормально?»"
1601703-55 = ""
1601703-57 = ""
1601703-58 = "Что именно нормально?"
1601703-59 = "[s] «Бить по сигналу трубным ключом?»"
1601703-60 = "Ах..."
1601703-61 = ""
1601703-63 = ""
1601703-64 = "Н-Ну..."
1601703-65 = "Д-Да, вообще-то! Хи-хи..."
1601703-66 = "Большинство механических проблем решаются хорошим ударом."
1601703-67 = "П-Проблемы с людьми тоже..."
1601703-68 = "[s] «Н-Насчёт последнего мне, пожалуй, придётся кое-что сказать.»"
1601703-69 = "Н-Ну, как бы то ни было, это самый быстрый способ устранить проблему."
1601703-70 = "И нам нужно закончить до прихода следующего поезда, так что..."
1601703-71 = "Д-Давайте ускоримся..."
1601703-72 = ""
1601703-74 = ""
1601703-75 = ""
1601703-78 = "С-Сдохни...!!"
1601703-79 = ""
1601703-90 = ""
1601703-91 = "...Теперь тихо..."
1601703-92 = "[s] «П-Похоже... починилось?»"
1601703-93 = "Д-Давайте немного понаблюдаем, на всякий случай..."
1601703-96 = "Мы с Аобой некоторое время наблюдали за переездом."
1601703-97 = ""
1601703-100 = "Мы убедились, что всё работает как следует и сигнал загорается только при прохождении поезда."
1601703-103 = "Д-Думаю, теперь работает... Хи-хи... Круто, я починила."
1601703-104 = "[s] «Значит, твой способ сработал...»"
1601703-105 = "Следующим шагом пришлось бы разбирать всё целиком."
1601703-106 = "Но, к счастью, сначала сработал план А."
1601703-107 = "Х-Хорошая работа... Сенсей."
1601703-108 = "[s1] «Я ничего не сделал.»\n[s2] «Если честно, не уверен, что я вообще был тебе здесь нужен.»"
1601703-109 = ""
1601703-110 = ""
1601703-112 = ""
1601703-113 = "Д-дело в том..."
1601703-114 = "...если честно..."
1601703-115 = "...я могла бы справиться с этим сама."
1601703-116 = "Н-Но ты ведь говорил, что я могу попросить тебя о помощи в любое время..."
1601703-117 = "Ну..."
1601703-118 = "...и я подумала, что можно написать тебе и попробовать..."
1601703-119 = "Я-Я не знала, придёшь ли ты на самом деле."
1601703-120 = "..."
1601703-121 = "Я-Я надеюсь, ты был не слишком занят!"
1601703-122 = ""
1601703-125 = "[ns3] «В таком случае ты всё сделала правильно.»\n[ns4] «Я всегда отвечаю на зов студентов. Это моя работа.»"
1601703-126 = ""
1601703-127 = ""
1601703-129 = ""
1601703-130 = "П-Понятно."
1601703-131 = "Наверное, поэтому тебя и называют Сенсеем..."
1601703-132 = "[s5] «Х-Хотя не обязательно круглосуточно!»\n[s6] «Может, не буквально ВСЕГДА...»"
1601703-133 = ""
1601703-134 = ""
1601703-136 = ""
1601703-137 = "П-Пф-ф..."
1601703-138 = "Ну... да, конечно. Ты ведь тоже человек."
1601703-139 = "Спасибо, что пришёл сегодня. Даже если только один раз..."
1601703-140 = "Фу-фу."
1601703-142 = "Потом я ещё немного поболтал с Аобой и отправился обратно."
