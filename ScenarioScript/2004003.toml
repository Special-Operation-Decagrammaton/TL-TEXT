[translation]
2004003-1 = "Сацуки спрашивает"
2004003-2 = "Вскоре после того, как я получил сообщение от Сацуки..."
2004003-3 = ""
2004003-6 = ""
2004003-7 = "А вот и я, Сенсей."
2004003-8 = "[s] «Сацуки. Привет...»"
2004003-9 = "У вас тут всегда так тесно, вы знаете?"
2004003-10 = "Если бы вы вступили в Общество Пандемониума, в вашем распоряжении была бы целая площадь."
2004003-11 = "[s1] «Нет, спасибо.»\n[s2] «Если честно, это больше похоже на наказание.»"
2004003-14 = "Хм, значит, сотрудничать вы всё ещё не готовы? Полагаю, этого и следовало ожидать."
2004003-15 = "Как я, возможно, уже упоминала в прошлый раз, у меня ЕСТЬ множество способов атаки."
2004003-16 = "Сегодня испробуем второй метод."
2004003-17 = "Пытка."
2004003-18 = "[s] «Простите?»"
2004003-19 = "Удивлены? Признаю, звучит немного по-средневековому..."
2004003-20 = "Хотя, с другой стороны, Шале явно не стесняется пользоваться подобным."
2004003-21 = "[s] «Ты ошибаешься! Я бы никогда такого не сделал!»"
2004003-22 = "Как бы то ни было, наши методы могут отличаться от тех, к которым вы привыкли. Посмотрим, как вы отреагируете."
2004003-23 = "Начнём? Садитесь сюда."
2004003-24 = "[s] «Всё нормально, нормально. Я пас.»"
2004003-25 = "Я слышала истории о варварстве в Тринити. Чай из корня аконита, близкие встречи с бензопилами..."
2004003-26 = ""
2004003-28 = ""
2004003-30 = ""
2004003-31 = "Но можете не волноваться. Геенна бывает разной, однако мы не бесчеловечны."
2004003-35 = "Сацуки усадила меня на стул..."
2004003-37 = "Итак, первый этап. Сможете это выдержать, Сенсей? Хи-хи-хи."
2004003-38 = ""
2004003-40 = ""
2004003-41 = ""
2004003-42 = "Сацуки взяла меня за руку и..."
2004003-43 = "[ns] «Ч-Что ты делаешь с моими ногтями...?»"
2004003-44 = "СМОЖЕТЕ выдержать, Сенсей?"
2004003-45 = ""
2004003-47 = ""
2004003-48 = ""
2004003-49 = ""
2004003-52 = "[ns3] «...Ты подстригаешь мне ногти?»\n[ns4] «И ЭТО пытка...?»"
2004003-55 = "Хи-хи... Вы так и не заметили?"
2004003-56 = "С такими короткими ногтями..."
2004003-57 = "...для красивого нейл-арта совершенно не останется места!"
2004003-58 = "[s] «...!»"
2004003-59 = "Большинство студентов сдаётся ещё до того, как лишится ногтя на указательном пальце."
2004003-60 = "А сколько продержитесь ВЫ, Сенсей? Хи-хи...!"
2004003-61 = "Я не остановлюсь, знаете ли. Лучше соглашайтесь сотрудничать, если не хотите столкнуться со всей этой катастрофой."
2004003-62 = ""
2004003-64 = ""
2004003-65 = ""
2004003-66 = ""
2004003-68 = "..."
2004003-69 = ""
2004003-71 = ""
2004003-72 = ""
2004003-74 = "В итоге Сацуки подстригла мне все ногти."
2004003-75 = ""
2004003-76 = "Ну как ощущения, Сенсей? Такие короткие ногти... как же вы теперь оправитесь?"
2004003-77 = "[s] «Ага, спасибо. Они как раз уже отросли.»"
2004003-78 = "И вы даже не моргнули, да? Очень сильны. Вдохновляет."
2004003-79 = "Но мы ещё не закончили. Дальше у нас..."
2004003-80 = ""
2004003-82 = "...впрочем, сначала переоденьтесь вот в это."
2004003-83 = "[ns] «...Моя белая футболка?»"
2004003-84 = "Именно. Я принесла её из вашего гардероба."
2004003-85 = "Для этой пытки нужна безупречно белая футболка, поэтому..."
2004003-88 = "Я переоделся, как попросила Сацуки."
2004003-90 = "Хи-хи, вам идёт. Хотя что вам вообще не идёт?"
2004003-91 = "Хорошо, теперь... начинайте есть это."
2004003-92 = "[s5] «Это что...»\n[s6] «Удон с карри...?!»"
2004003-95 = "Ха-ха, именно он! Теперь понимаете опасность? Угрозу?"
2004003-96 = "Согласно опросу, удон с карри входит в ТРОЙКУ самых сложных блюд, которые трудно есть, не испачкав одежду!"
2004003-98 = "И не просто одежду, а эту БЕЛОСНЕЖНУЮ ФУТБОЛКУ, на которой любое пятно будет видно за километр! И нет, прежде чем спросите, фартук я вам не дам!"
2004003-99 = "Ну и что теперь? Всё ещё думаете, что выдержите? Обычные студенты начинают обливаться холодным потом ещё до первого кусочка!"
2004003-100 = "А вы, Сенсей?"
2004003-101 = ""
2004003-105 = ""
2004003-106 = "[ns] «Вкусно!»"
2004003-107 = "Ни капли не колебаться и сразу наброситься на еду. Признаю, вы меня удивляете."
2004003-108 = "Смело с вашей стороны совсем не переживать, что вы испачкаете столь безупречную одежду. Возможно, именно этого от вас и стоило ожидать."
2004003-112 = "Я быстро опустошил миску."
2004003-114 = "Ну вот и всё с этим методом. Признаю, вы достойный противник."
2004003-115 = "Но теперь игры закончились."
2004003-116 = "Вы БУДЕТЕ сотрудничать. Я об этом позабочусь."
2004003-117 = "[s] «М-м...»"
2004003-119 = "После этого Сацуки перепробовала множество разных методов..."
2004003-120 = "...но ни один из них особо не ощущался как пытка."
2004003-122 = ""
2004003-123 = "Значит, даже самые страшные методы пыток Разведывательного комитета Общества Пандемониума на вас не подействовали."
2004003-124 = "Вижу, у вас железная воля."
2004003-125 = "*вздыхает* Я не хотела до этого доводить..."
2004003-126 = "Уберите руки за спину, чтобы я могла их связать."
2004003-127 = "По вашему лицу вижу, вы думаете, что я задумала."
2004003-128 = "Всё просто. Здесь я не могу позволить вам пользоваться руками."
2004003-129 = ""
2004003-131 = ""
2004003-134 = "Хи-хи, вот теперь мы готовы..."
2004003-135 = "Смотрите на экран, Сенсей."
2004003-136 = "[ns] «Это... забавное видео с котиками?»"
2004003-137 = "Хи-хи, очаровательная нарезка кошачьего безумия."
2004003-138 = "Она гарантированно заставит вас улыбнуться раньше, чем вы это заметите."
2004003-139 = "И становится всё лучше и лучше, пока..."
2004003-140 = ""
2004003-144 = "[ns] «...А-а!! Реклама!!»"
2004003-146 = "[ns] «И-и я не могу дотянуться до кнопки „Пропустить“!»"
2004003-147 = "Хи-хи, хи-хи-хи! Ну что теперь? Вы когда-нибудь чувствовали себя настолько беспомощным?"
2004003-148 = "Вам ведь любопытно, правда? Вы хотите узнать, что будет дальше? Вам ТАК сильно хочется нажать эту кнопку «Пропустить»..."
2004003-149 = "...но эта реклама длится целую минуту! И каждые ТРИДЦАТЬ секунд будет появляться новая."
2004003-150 = "[s] «Т-Ты жестокая...»"
2004003-151 = "Это и правда ужасно, да?"
2004003-152 = "Теперь вы можете переживать этот бесконечный кошмар ИЛИ я развяжу вас сразу же, как только вы поклянётесь в верности Обществу Пандемониума. Хи-хи-хи!"
2004003-153 = ""
2004003-155 = ""
2004003-156 = ""
2004003-157 = "..."
2004003-158 = "Ох. Даже мне самой хочется увидеть продолжение."
2004003-159 = "Видео и меня заставило улыбнуться. Я об этом не подумала..."
2004003-160 = "Я бы и сама не отказалась пропустить эту рекламу. Сколько там ещё осталось?"
2004003-162 = "Сацуки наклонилась ко мне сзади."
2004003-163 = ""
2004003-166 = "[ns7] «С-Сацуки...?»\n[ns8] «Ты слишком близко...»"
2004003-169 = "*вдох* *выдох* Вы хотите нажать эту кнопку. Вы НЕНАВИДИТЕ рекламу."
2004003-170 = "Я чувствовал её тяжёлое дыхание у себя на шее..."
2004003-171 = ""
2004003-175 = "[ns] «(Я ей всё расскажу. Есть тайная база? Возможно, я знаю, где она!)»"
2004003-176 = ""
2004003-179 = "[ns] «А, реклама закончилась...»"
2004003-181 = ""
2004003-182 = "...Хм, не знал, что кошки так умеют."
2004003-183 = "Я-я больше не могу. Это мучает меня не меньше, чем вас."
2004003-184 = "[ns] «(К-Какое облегчение...)»"
2004003-185 = "Гордитесь собой, Сенсей. Вы выдержали все мои ужасающие методы пыток."
2004003-186 = "Но вы раскрыли больше, чем думаете."
2004003-187 = "Ждите следующей встречи. Хи-хи."
2004003-188 = ""
2004003-190 = ""
2004003-193 = "[ns] «С-Сацуки? Хотя бы развяжи меня перед уходом!»"
2004003-195 = "Позже меня развязали другие представители учеников."
2004003-196 = "Я переживал, что теперь появится ещё больше странных слухов..."
