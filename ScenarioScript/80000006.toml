[translation]
80000006-1 = "Шоколад снайпера"
80000006-2 = "Склад Рыцарей справедливости"
80000006-3 = "Я пришёл помочь Маширо разобрать склад Рыцарей справедливости."
80000006-4 = "Спасибо, что согласились помочь."
80000006-5 = "Наш склад забит до отказа. Я боялась, что до конца дня одна не закончу."
80000006-6 = "[s] «Не переживай. Сегодня у меня выходной.»"
80000006-7 = "Спасибо, Сенсей. Я снова у вас в долгу."
80000006-8 = "Мне почти нечем вас отблагодарить, но, возможно, здесь найдётся что-то полезное для вас."
80000006-9 = "Эти припасы больше не используются и не числятся в реестре Рыцарей справедливости, так что берите всё, что вам приглянется."
80000006-10 = "[s] «Но их всё равно нужно сортировать?»"
80000006-11 = "Да. Некоторые вещи здесь всё ещё в хорошем состоянии,#nи могут иметь ценность."
80000006-12 = "Кроме того, здесь есть запас аварийного питания. Не сразу, но со временем оно всё же может испортиться."
80000006-13 = ""
80000006-15 = ""
80000006-16 = "Хм? Кстати..."
80000006-17 = ""
80000006-19 = ""
80000006-22 = "[ns1] «Что это?»\n[ns2] «Съедобный кирпич?»"
80000006-23 = "Это шоколад."
80000006-24 = "Нет, это шоколад."
80000006-25 = "Точнее, шоколадный сухпаёк. Его делают из сахара и овса.#nПри небольшом объёме в нём очень много калорий."
80000006-26 = "Отлично. Я как раз думала взять сухпайки на следующую миссию. Этот вполне подойдёт."
80000006-27 = "Хотите попробовать?"
80000006-28 = ""
80000006-31 = "[ns3] «Какая гадость!»\n[ns4] «У них срок годности истёк?!»"
80000006-32 = "Хм. Здесь написано, что до истечения срока годности ещё далеко."
80000006-33 = "Хм. Здесь написано, что до истечения срока годности ещё далеко."
80000006-34 = "Помните: этот шоколад создан для выживания, а не ради вкуса."
80000006-35 = "На самом деле он даже ближе к первоначальной сути шоколада как высококалорийного стимулятора. В этом смысле он куда достойнее называться шоколадом, чем обычная плитка сладостей."
80000006-36 = "У меня идея. Не окажете ли вы мне честь, приняв этот шоколад?"
80000006-37 = ""
80000006-39 = ""
80000006-40 = "Он не очень вкусный и, по сути, состоит из пустых калорий..."
80000006-41 = "...но в некотором смысле он ещё и отражает моё представление о справедливости."
80000006-42 = "И мне будет приятно, если вы примете мою справедливость."
