[translation]
1006203-1 = "Школьная жизнь"
1006203-2 = "Кампус Миллениум"
1006203-3 = "По просьбе Токи я отправился в Миллениум."
1006203-4 = ""
1006203-6 = ""
1006203-7 = "Здравствуйте, Сенсей."
1006203-8 = "Спасибо, что нашли время встретиться со мной."
1006203-9 = "[s] «Так в чём проблема, о которой ты говорила?»"
1006203-10 = "Ах..."
1006203-11 = "Что ж, буду благодарна, если вы взглянете на это письмо."
1006203-12 = "Оно из школы, но я не уверена, что правильно всё поняла."
1006203-13 = "Поэтому я решила обратиться за советом к эксперту. То есть к вам, Сенсей."
1006203-14 = "Я взял письмо Токи и развернул его."
1006203-16 = "[ns1] «Из-за недостаточной посещаемости...»\n[ns2] «Тебя могут оставить на второй год...?»"
1006203-19 = "Понятно. Значит, я поняла всё правильно. В таком случае..."
1006203-20 = "Беспокоиться не о чем."
1006203-21 = "Тогда я начну сопровождать вас уже сегодня."
1006203-22 = ""
1006203-24 = ""
1006203-26 = "[ns3] «Нет-нет! Об этом как раз точно нужно беспокоиться!»\n[ns4] «Я рад, что ты пришла за советом, но что?!»"
1006203-29 = "Меня уже однажды оставляли на второй год. Не думаю, что что-то изменится, если это случится снова."
1006203-30 = "Более того, я смогу чаще сопровождать вас и дольше оставаться действующим членом C&C."
1006203-31 = "Так разве в таком случае это не хорошо?"
1006203-32 = "[s5] «Нет! Точно не хорошо!»\n[s6] «Как ты вообще до сих пор справлялась?!»"
1006203-35 = "Раньше мне начисляли особые баллы посещаемости."
1006203-36 = "Но, похоже, теперь этого больше нет, и мою посещаемость признали недостаточной."
1006203-37 = ""
1006203-39 = ""
1006203-41 = ""
1006203-43 = "Подождите! Мне только что пришла идея."
1006203-44 = "А что, если Миллениум тоже признает сопровождение вас особым исключением?"
1006203-45 = ""
1006203-47 = ""
1006203-49 = "А, теперь, когда я произнесла это вслух, звучит как отличная идея. Сенсей, раз уж вы здесь, почему бы нам не оформить документы на ваш постоянный перевод в Научную школу Миллениум?"
1006203-50 = "[s7] «Нет, это создаст кучу проблем.»\n[s8] «Давай найдём другой способ. В письме сказано...»"
1006203-53 = "Вот как?"
1006203-54 = "А, значит, в письме сказано, что если я начну посещать занятия, лекции и вести обычную повседневную жизнь в школе..."
1006203-55 = "То, учитывая мои прежние обстоятельства, мне дадут послабление по текущей посещаемости."
1006203-56 = "[s] «Понятно! Тебе нужна обычная школьная жизнь!»"
1006203-57 = "Школьная... жизнь?"
1006203-58 = "Почему вы так взволнованы?"
1006203-59 = "[s9] «Боишься?»\n[s10] «Смущаешься?»"
1006203-62 = "..."
1006203-63 = "Я слышала, что перед чем-то новым чувствовать такое вполне естественно."
1006203-64 = "Если честно, я... понятия не имею, как мне следует себя вести."
1006203-65 = "[s] «Я помогу!»"
1006203-66 = "С-Сенсей?"
1006203-67 = "Нельзя просто хватать меня за руку и тащить. Сенсей? Сенсей?!"
1006203-68 = ""
1006203-70 = ""
1006203-72 = "Так началась обычная школьная жизнь Токи."
1006203-73 = "Поскольку я не мог посещать занятия вместе с ней, я решил наблюдать за тем, как она учится."
1006203-75 = "Класс"
1006203-76 = "И это последняя тема сегодняшней дистанционной лекции."
1006203-77 = "Спасибо всем за сосредоточенность и внимание."
1006203-78 = "Асума Токи. Для закрепления материала не хотите решить эту задачу?"
1006203-79 = ""
1006203-81 = ""
1006203-82 = "..."
1006203-83 = "Решить проблему — иными словами, устранить её источник..."
1006203-84 = "Когда на пути встаёт неразрешимая проблема..."
1006203-85 = "Элитный агент всегда знает, как прорваться через неё напролом."
1006203-87 = "Ч-Что вы делаете?! Что вы делаете с экраном?"
1006203-88 = "Нет, Токи! Нельзя использовать инструменты C&C на занятии!"
1006203-89 = "Тем более хакерский инструмент, способный разом отключить все защитные системы Миллениум!"
1006203-90 = "Если вы продолжите, я не смогу засчитать вам сегодняшнее посещение!"
1006203-91 = "?!"
1006203-92 = "Сенсей, что мне делать?"
1006203-93 = "[s] «Нельзя просто решить задачу без всяких хитростей?»"
1006203-94 = "Если бы это было возможно, в мире не было бы конфликтов. Мы наконец познали бы мир. Какая жалость."
1006203-95 = "[s] «Вот именно об этом я и говорю!»"
1006203-96 = "...Хорошо. Если другого выхода нет, я постараюсь решить задачу."
1006203-97 = ""
1006203-99 = ""
1006203-101 = ""
1006203-103 = ""
1006203-104 = ""
1006203-105 = "Эй, Токи. Я после занятий иду в кафе, хочешь со мной?"
1006203-106 = "?!"
1006203-107 = "Сенсей, что мне делать?"
1006203-108 = "[s] «Веселись. Не думай слишком много.»"
1006203-109 = "Но..."
1006203-110 = "[s] «Посидеть с другом в кафе — это школьная жизнь во всей красе!»"
1006203-111 = "П-правда?"
1006203-112 = "Тогда вы присоединитесь к нам, Сенсей?"
1006203-113 = "[s] «Было бы ужасно, если бы учитель вмешивался в дружеское общение учеников.»"
1006203-114 = "Что это значит?"
1006203-115 = "Сенсей? Сенсей?!"
1006203-117 = "Я проводил умоляюще смотревшую на меня Токи с радостью в сердце."
1006203-118 = "Пока вдруг..."
1006203-120 = "*бум*"
1006203-121 = "[ns] «Почему?!»"
1006203-122 = "А-а-а-а-а!"
1006203-123 = ""
1006203-125 = ""
1006203-126 = "Ч-Что с этой горничной..."
1006203-127 = "Эй, мы просто законопослушные граждане, которые пытаются помочь местному заведению избавиться от остатков тортов! Мы великодушно предлагаем... заранее съесть их бесплатно!"
1006203-128 = ""
1006203-130 = ""
1006203-134 = ""
1006203-135 = "Хм... Обычно это называют вымогательством с помощью угроз."
1006203-136 = "Хмф! Неважно. Даже если правда не стоит связываться с горничной из Миллениум, мы так просто не отступим! Только не когда речь идёт о торте!"
1006203-137 = "..."
1006203-138 = "Так вот как выглядит школьная жизнь."
1006203-139 = "Прямо как в книге, которую я видела в клубной комнате C&C."
1006203-140 = "Обязанность ученика — расправляться с нарушителями спокойствия. Ученик должен покорить школу любой ценой... даже если единственное оружие в его руке — ножницы."
1006203-141 = "Простите? Что за чушь вы несёте?!"
1006203-142 = "[ns] «Нет-нет-нет! Это точно не часть обычной школьной жизни!»"
1006203-143 = "Раз уж всё дошло до этого, я отвечу всем, что у меня есть."
1006203-144 = "Даже если мне доступна лишь малая часть максимальной мощности, лучшего способа выразить мои истинные чувства всё равно нет."
1006203-145 = "Активирую систему силового костюма, Аби-Эшух—"
1006203-147 = "После этого мне едва удалось остановить Токи от целой серии погромов."
1006203-149 = ""
1006203-150 = "Сенсей? Вы в порядке?"
1006203-151 = "[s] «Кажется, я только что потерял несколько лет жизни...»"
1006203-152 = "..."
1006203-153 = "Хотя я и не уверена, что именно не так, похоже, я должна перед вами извиниться."
1006203-154 = "Я снова доставила вам неприятности."
1006203-155 = "Немыслимо, чтобы я продолжала быть для вас обузой, когда мой долг — помогать вам."
1006203-156 = "Действительно, это ставит под сомнение мою пригодность в качестве помощницы."
1006203-157 = "[s11] «Ты не виновата. Учиться новому — основа нормальной школьной жизни.» \n[s12] «Так что давай начнём сначала!»"
1006203-160 = "..."
1006203-161 = "Хм... Если вы так говорите, Сенсей."
1006203-162 = "Обычная школьная жизнь..."
1006203-163 = ""
1006203-165 = ""
1006203-167 = "Честно говоря, я не ожидала, что это окажется так сложно, Сенсей."
1006203-169 = "Токи стояла передо мной с мрачным выражением лица."
1006203-170 = "Мне оставалось только согласно кивнуть."
