[translation]
2002402-1 = "Послеобеденное чаепитие"
2002402-2 = "Чтобы успеть на встречу с Нагисой в комнате Чаепития, мне пришлось пройти по казавшимся бесконечными жарким, залитым солнцем коридорам."
2002402-4 = "Комната Чаепития Тринити"
2002402-5 = "Добро пожаловать, Сенсей. Спасибо, что нашли время встретиться со мной."
2002402-6 = "Вы очень пунктуальны. Я как раз закончила готовить наш послеобеденный чай."
2002402-7 = "...Хотя... вы довольно сильно вспотели."
2002402-8 = "Вы бежали сюда всю дорогу?"
2002402-9 = "[s] «Я не хотел опоздать!»"
2002402-10 = "И всё же не стоило так перенапрягаться."
2002402-11 = "И у меня возникла небольшая дилемма. Единственный готовый напиток — горячий чёрный чай, а он явно не поможет вам остыть."
2002402-12 = "Дайте мне минутку. Я позову студента, чтобы он принёс холодный чай."
2002402-13 = "[s] «Всё нормально. У меня есть напиток с собой.»"
2002402-15 = "[ns] Достать бутылку чёрного чая."
2002402-16 = "Что... это за напиток?"
2002402-17 = "О, это чай? Чёрный чай? Уже заваренный и продающийся в таком виде, понятно..."
2002402-18 = "Интересно. Я никогда не пробовала этот бренд."
2002402-19 = ""
2002402-22 = ""
2002402-23 = "...Сенсей, если вам не жалко, можно попробовать немного вашего чая?"
2002402-24 = "Видите ли, я горжусь тем, что знаю абсолютно все бренды чёрного чая в Кивотосе."
2002402-25 = "Все — от популярных ароматизированных чаёв вроде Lepton до дорогих брендов, которые трудно достать в Тринити, вроде Brinings of Кивотос."
2002402-26 = "Я думала, что перепробовала их все, но этот бренд мне незнаком. Значит, мне ещё есть чему учиться."
2002402-27 = "Поэтому ради продолжения моих исследований не поделитесь со мной немного чаем?"
2002402-28 = "[ns] Налить немного чая в чашку Нагисы."
2002402-30 = "Спасибо, Сенсей."
2002402-31 = "А теперь я сделаю глоток."
2002402-32 = ""
2002402-35 = "Хм..."
2002402-36 = ""
2002402-38 = "(...Как же сладко!)"
2002402-39 = "(Что это такое? Настолько сладко, что аж зубы болят! Я чуть не выплюнула!)"
2002402-40 = "(Конечно, существует много сладких видов чёрного чая. Русский чай мне даже нравится... Но этот настолько сладкий, будто пьёшь сахарную воду.)"
2002402-41 = "(И искусственный цитрусовый аромат настолько сильный, что вкус самого чая вообще не чувствуется!)"
2002402-42 = "(Мне очень, очень хочется запить это нормальным чаем...)"
2002402-43 = "(Но это было бы непростительно грубо после того, как Сенсей поделился со мной своим чаем. Придётся продолжать пить...)"
2002402-44 = ""
2002402-45 = "Ха... ха-ха... у него довольно... довольно впечатляющий вкус."
2002402-46 = "Вкус чёрного чая нравится не всем, поэтому его сделали мягче и вместо этого усилили сладость. Это определённо новый, современный вкус..."
2002402-47 = "Похоже, его специально сделали таким, чтобы он нравился даже ученикам Миллениум и Геенны, которые обычно не любят чай. Хи... хи..."
2002402-48 = "[s1] «Ага. Вкусно, правда?»\n[s2] «Я знал, что тебе понравится, Нагиса.»"
2002402-49 = "Да... это действительно был необычный опыт."
2002402-50 = "Да... это действительно был необычный опыт."
2002402-51 = "Не думала, что сегодня мне доведётся попробовать настолько, эм, интересный чёрный чай!"
2002402-52 = "Я очень рада, что вы согласились встретиться со мной. Ха-ха... ха-ха-ха..."
2002402-53 = "[s] «Я так и знал, что ты это скажешь, поэтому принёс ещё один!»"
2002402-54 = "Что? Ещё один бутылочный чёрный чай?"
2002402-55 = "О, и бутылка... довольно большая."
2002402-56 = "Хм, вам не кажется, что пить ещё больше такого чая может быть..."
2002402-57 = "[s3] «Давай по очереди делать глоток этого и заваренного тобой чая.»\n[s4] «Сравнить их будет познавательно, правда?»"
2002402-58 = "Ну, если так посмотреть..."
2002402-59 = "Ну, если так посмотреть..."
2002402-60 = "Пожалуй... налейте мне ещё чашку, пожалуйста."
2002402-62 = "Нагиса выпила почти пять чашек бутылочного чая, а затем сбежала, сославшись на боль в животе."
