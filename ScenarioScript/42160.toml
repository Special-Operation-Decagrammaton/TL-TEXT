[translation]
42160-1 = "Эпизод 16; Затруднительное положение Сенсея"
42160-3 = "Протокол допроса: 001-S-1"
42160-5 = "Дознаватель: Цукийюки Мияко, 1-й курс академии SRT"
42160-7 = "[log]Подозреваемый: [USERNAME] Сенсей, Шале[/log]"
42160-10 = "Комната допросов под тренировочным полигоном"
42160-12 = "Помогите мне понять."
42160-13 = "Как и зачем вы сюда пришли?"
42160-14 = "[s1] «Это была неудачная шутка, простите...»\n[s2] «Я пришёл увидеть тебя, Мияко...»"
42160-17 = "...Мне трудно в это поверить."
42160-18 = "Это военный объект, полностью удалённый от любых городов и посёлков."
42160-19 = "Даже если проявить снисхождение и списать всё на случайность, на эту базу нельзя просто случайно наткнуться. И вы наверняка понимаете, насколько опасно приходить на военный объект совершенно безоружным и в одиночку."
42160-20 = "Вы проделали весь этот путь, избежали обнаружения и рисковали собственной безопасностью. Поэтому да, мне трудно поверить, что причина настолько банальна."
42160-21 = "Так что спрошу ещё раз, Сенсей."
42160-22 = "Зачем вы здесь?"
42160-23 = "[s3] «Причина и правда настолько банальна.»\n[s4] «Я пришёл увидеть Мияко.»"
42160-26 = "...Вы пришли, чтобы переубедить меня?"
42160-27 = "Думаю, в письме я выразилась достаточно ясно. Я уже приняла решение."
42160-28 = "После того как глава Кая гарантировала возрождение SRT, наше пребывание в парке Коусаги закончилось."
42160-29 = "Полностью оборудованная база вроде этой, где есть всё необходимое, оптимальна для моего отряда... точнее, для всего нашего подразделения."
42160-30 = "Я взвесила все обстоятельства и приняла лучшее решение для отряда."
42160-31 = "А теперь я больше не принимаю решений. Я оружие, созданное для исполнения приказов."
42160-32 = "Так что вам нечего мне сказать, Сенсей."
42160-33 = "[ns] «Я правда пришёл не с какой-то целью.»"
42160-34 = ""
42160-35 = "[ns5] «Я просто хотел узнать, весело ли тебе.»\n[ns6] «Тебе здесь нравится, Мияко?»"
42160-38 = "...Какое это имеет отношение к ситуации?"
42160-39 = "Я оперативник SRT. Моя задача — поддерживать справедливость и защищать граждан."
42160-40 = "Удовольствие — роскошь для тех, кто не взял на себя подобные обязанности."
42160-41 = "[s7] «Если тебя это устраивает. Но ты неправильно понимаешь свой долг.»\n[s8] «Не думаешь, что ошиблась в том, что считаешь своим долгом?»"
42160-44 = "Мой долг...? В каком смысле?"
42160-45 = "Разве долг — не выполнение своей ответственности?"
42160-46 = "[ns9] «Исполнение долга не должно требовать страданий и боли.»\n[ns10] «Твой настоящий долг никогда не будет противоречить твоим идеалам.»\n[ns11] «Долг и ответственность — это дар, а не наказание.»"
42160-47 = ""
42160-48 = ""
42160-49 = ""
42160-51 = ""
42160-52 = "[ns12] «У тебя есть ответственность перед самой собой, Мияко.»\n[ns13] «У тебя есть долг радоваться жизни, Мияко.»"
42160-53 = ""
42160-54 = ""
42160-56 = ""
42160-57 = ""
42160-59 = "[ns] «Ну так что? Тебе весело?»"
42160-60 = ""
42160-62 = ""
42160-63 = ""
42160-64 = "...Вот почему я знала, что не должна видеть вас перед уходом."
42160-67 = "Я всегда думала, что взрослеть — значит терпеть трудности."
42160-68 = "Мне казалось, что повзрослеть можно только отбросив всю наивность, доверие и сострадание."
42160-69 = "Сенсей, я... Я сумела убедить себя, что могу отказаться от своих идеалов, от своего правосудия. Что именно так выглядит реальный мир."
42160-72 = "Казалось, будто приближающаяся взрослая жизнь отчитывает мою младшую версию: будь сильнее, жёстче, умнее."
42160-73 = "Я не хотела верить, что любимому мной правосудию нет места во взрослом мире. Но что я вообще знала о взрослении? Наверное, всё именно так..."
42160-74 = "Если бы я поверила в это, если бы моему отряду стало лучше, я думала, что смогу смириться."
42160-75 = "Так почему же вы приходите и говорите, что я не должна отказываться от себя ради высшего порядка? Зачем говорить мне это сейчас, когда я наконец смирилась с тем, что стану оружием Юкино?"
42160-76 = "Можете, пожалуйста, перестать говорить кучке ничего не понимающих детей, чтобы они сами принимали решения?!"
42160-77 = "[ns] «Прости, но в моём взрослом мире для твоего правосудия место точно есть.»"
42160-78 = ""
42160-80 = ""
42160-81 = "Вы... Вы... Вы странный. Из-за вас я уже говорю как Саки."
42160-82 = ""
42160-84 = ""
42160-85 = "Ладно, Сенсей. Вы победили. Теперь я понимаю."
42160-86 = ""
42160-88 = ""
42160-89 = "Идите за мной, сюда."
42160-90 = ""
42160-102 = "Выход в конце этого коридора."
42160-103 = "Не навсегда, но сигнализацию я пока отключила."
42160-104 = "Выйдите отсюда и пообещайте, что сразу пойдёте к автобусной остановке, не попадаясь никому на глаза."
42160-105 = "[s14] «Ты просто так меня отпускаешь?»\n[s15] «И не доложишь лисам?»"
42160-108 = "Да. Сейчас за безопасность отвечаю я."
42160-109 = "...И если они узнают, что вы были здесь, Сенсей, замять это будет непросто."
42160-110 = "Я член SRT, помните? Защищать гражданских вроде вас — часть моей работы."
42160-111 = "[s] «Что ты собираешься делать?»"
42160-112 = "Я... Я собираюсь исполнить свой долг."
42160-113 = "Я не очень понимаю, как делать подобные вещи, поэтому могу всё испортить..."
42160-114 = "[ns16] «В любом случае всё нормально. Ты справишься.»\n[ns17] «Если будут последствия, я возьму ответственность на себя.»"
42160-115 = ""
42160-116 = ""
42160-118 = ""
42160-119 = "Поняла!"
42160-122 = ""
42160-124 = "Поздно."
42160-125 = "Во время дежурства что-нибудь необычное?"
42160-126 = "Нет. Ничего."
42160-127 = "...Вот как?"
42160-128 = ""
42160-130 = ""
42160-131 = ""
42160-133 = ""
42160-134 = "Мы получили новый приказ. Отряд RABBIT присоединится к нам."
42160-135 = "...Это что, карта?"
42160-136 = "Думала, ты её узнаешь. Это чертежи платформ станции Коусаги."
42160-139 = "Завтра в 09:00 грузовой поезд Кайзер Construction прибудет на вторую платформу станции Коусаги и выгрузит термобарическую боеголовку A.N.T.I.O.C.H."
42160-140 = "Станцию закроют до полудня на время разгрузки. Для защиты от возможных угроз отряд RABBIT поможет службе безопасности «Кайзера» оцепить периметр."
42160-142 = "Боеголовка A.N.T.I.O.C.H.? Та самая бомба, которую вы обнаружили и обезвредили во время первой публичной операции отряда FOX!"
42160-143 = "Верно."
42160-144 = "Весь смысл её перемещения за пределы D.U. был в безопасности жителей. А теперь мы возвращаем её в густонаселённый город?"
42160-145 = "Что Совет... Нет. Что ты задумала, Юкино?"
42160-146 = "После разгрузки боеголовку поместят в подземную шахту станции и подорвут. Сначала эвакуируют весь персонал, затем наши отряды."
42160-147 = "...Вы собираетесь взорвать её под землёй, внутри станции метро в самом центре города?"
42160-148 = "Хуже места для подрыва не придумать. Замкнутое пространство усилит—"
42160-149 = "Не нужно мне напоминать. Я знакома с мощностью A.N.T.I.O.C.H. лучше большинства."
42160-150 = "Если это правда, тем более ты должна понимать, насколько это безумно! Какие у тебя вообще могут быть основания продолжать поддерживать такое?"
42160-151 = "Я исполняю приказ. Перед общественностью ответственность возьмёт Генеральный студенческий совет."
42160-152 = "Тогда забудь про ответственность. Ты просишь нас поставить жизни на кон ради опасной и аморальной операции. Мы как минимум заслуживаем объяснения, зачем ты это делаешь."
42160-153 = "Всё, что я делала..."
42160-155 = "Я делала ради возрождения академии SRT."
42160-156 = ""
42160-158 = ""
42160-159 = "Ты себя вообще слышишь, Юкино?"
42160-160 = "Ты собираешься использовать страх и ужас тех самых людей, ради защиты которых и была создана наша академия, чтобы... восстановить SRT?"
42160-161 = "SRT, которая ставит под угрозу безопасность граждан и опирается на чужую власть, не имеет права носить это имя."
42160-163 = "Права не выдают. Их берут сами."
42160-164 = "Если именно это нужно, чтобы выбраться из нынешней ситуации, будущие студенты SRT нас оправдают."
42160-165 = ""
42160-167 = ""
42160-168 = ""
42160-169 = "А оправдают ли? Я помню, как много лет назад ты говорила по телевизору..."
42160-170 = "«Что бы ни вставало у нас на пути, правосудие SRT никогда не поколеблется.»"
42160-171 = "Я сражаюсь за принципы и правосудие, которым училась все эти годы. Можешь сколько угодно порочить имя SRT, но эти ценности никогда не изменятся."
42160-172 = ""
42160-174 = ""
42160-176 = "Это прямой приказ."
42160-177 = "Мне считать это неподчинением?"
42160-179 = "Нет. Вообще-то, не можешь."
42160-180 = "Ты не мой начальник. Более того, я бы сказала, что это ты нарушаешь субординацию, Шичидо Юкино."
42160-181 = ""
42160-183 = ""
42160-184 = "Потому что отдавать нам приказы имеет право только президент Генерального студенческого совета."
42160-185 = ""
42160-187 = ""
42160-189 = ""
42160-190 = ""
42160-193 = ""
42160-195 = ""
42160-196 = "М-Мияко..."
42160-197 = "*вздыхает*"
42160-198 = "Ну... Думаю, в глубине души мы все знали, что всё закончится именно так."
42160-200 = "...Прошу прощения."
42160-201 = ""
42160-203 = ""
