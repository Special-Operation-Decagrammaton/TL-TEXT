[translation]
42160-1 = "Episódio 16;As Circunstâncias do Sensei"
42160-3 = "[log]Registro de Interrogatório: 001-S-1[/log]"
42160-5 = "[log]Responsável: Miyako Tsukiyuki, 1º ano da Academia Especial SRT[/log]"
42160-7 = "[log]Suspeito: Sensei [USERNAME], da Schale[/log]"
42160-10 = "Sala de Interrogatório Subterrânea do Campo de Treinamento"
42160-12 = "...Não consigo entender."
42160-13 = "Por que você veio até aqui?"
42160-14 = "[s1] \"Aquilo de antes era brincadeira, mas...\"\n[s2] \"Vim ver você, Miyako.\""
42160-17 = "...É difícil acreditar nisso."
42160-18 = "Esta é uma base militar a vários quilômetros do centro da cidade."
42160-19 = "Não é um lugar onde se passa por acaso, mesmo fingindo coincidência...#nE acredito que, a esta altura, o Sensei já entendeu o quão perigoso este lugar é."
42160-20 = "Se veio até aqui evitando até o olhar das outras alunas, deve ter algum objetivo especial."
42160-21 = "...Vou perguntar mais uma vez, Sensei."
42160-22 = "— Por que você veio até aqui?"
42160-23 = "[s3] \"Minha resposta não mudou.\"\n[s4] \"Foi para ver você, Miyako.\""
42160-26 = "...Você veio me convencer, não é?"
42160-27 = "Como já disse na carta, minha decisão já está tomada."
42160-28 = "Agora que a Chefe Kaya prometeu a restauração da SRT,#nnão há mais necessidade de continuar protestando no Parque Kousagi."
42160-29 = "Para as outras integrantes do esquadrão... não, do destacamento.#nJulguei que seria melhor ficar em uma instalação com moradia, alimentação e equipamentos adequados."
42160-30 = "...Acredito que esta seja a melhor solução que eu poderia escolher."
42160-31 = "Não... como uma arma que apenas cumpre ordens superiores,#nnão preciso mais julgar nada além disso."
42160-32 = "Por isso... não importa o que o Sensei diga, não posso voltar atrás na minha decisão."
42160-33 = "[ns] \"Não vim aqui para te convencer, Miyako.\""
42160-35 = "[ns5] \"Só queria perguntar uma coisa.\"\n[ns6] \"Você está feliz agora, Miyako?\""
42160-38 = "...Por que está me perguntando isso?"
42160-39 = "Eu sou da SRT — uma integrante de forças especiais que trabalha pela missão de proteger a justiça e a segurança dos cidadãos."
42160-40 = "Para uma integrante da SRT que age sob esse dever,#no sentimento de \"felicidade\" não passa de um luxo."
42160-41 = "[s7] \"Se você estiver satisfeita com a situação atual, não vou dizer nada, mas...\"\n[s8] \"Só não quero que você entenda errado o que é 'responsabilidade'.\""
42160-44 = "Entender errado...?"
42160-45 = "Existe algum outro significado para a palavra responsabilidade além de \"um dever a ser cumprido\"?"
42160-46 = "[ns9] \"'Assumir responsabilidade' não significa carregar um fardo de sofrimento.\"\n[ns10] \"Não é aceitar fazer coisas que você odeia —\"\n[ns11] \"— nem é uma punição por ter agido errado.\""
42160-52 = "[ns12] \"'Assumir responsabilidade' significa agir sem se arrepender das próprias escolhas —\"\n[ns13] \"é aliviar o peso do coração. Tem que ser algo que te faça feliz.\""
42160-59 = "[ns] \"Então... você está feliz agora, Miyako?\""
42160-64 = "...É por isso que eu não queria encontrar o Sensei."
42160-67 = "...Eu achava que crescer e se tornar adulta era algo doloroso."
42160-68 = "Que só dá para amadurecer encarando verdades amargas e duvidando dos outros."
42160-69 = "Que mesmo que isso significasse negar quem eu fui no passado, era inevitável para me tornar adulta..."
42160-72 = "O futuro que caminha à frente sussurra para o meu eu do passado."
42160-73 = "Por mais que eu tente negar,#ncomo não conheço esse mundo, a ansiedade nunca deixa de me perseguir..."
42160-74 = "...Eu tentei acreditar nas palavras da senpai para me sentir aliviada."
42160-75 = "Mesmo assim... por que o Sensei me diz essas coisas?"
42160-76 = "Por que... diz para nós, que não passamos de crianças, decidirmos por conta própria?"
42160-77 = "[ns] \"Ora... porque eu sou um adulto estranho, né.\""
42160-81 = "...Um adulto estranho."
42160-85 = "— Eu decidi."
42160-89 = "Sensei, por favor, venha comigo."
42160-102 = "A saída é por aqui."
42160-103 = "Desativei os alarmes desta área por um curto período."
42160-104 = "Se sair por aqui e seguir em frente, conseguirá chegar à estação mais próxima sem ser notado por ninguém."
42160-105 = "[s14] \"Vai me deixar ir assim mesmo?\"\n[s15] \"Tem certeza de que não precisa relatar ao esquadrão?\""
42160-108 = "Sim. Afinal, a responsável pela segurança hoje sou eu."
42160-109 = "...Além disso, se souberem que o Sensei [USERNAME] está aqui, vai virar uma grande confusão."
42160-110 = "Como integrante da SRT, nada é melhor do que reduzir nem que seja uma única confusão em Kivotos."
42160-111 = "[s] \"O que você vai fazer agora, Miyako?\""
42160-112 = "Eu vou... cumprir com a minha própria responsabilidade."
42160-113 = "É a primeira vez que faço algo assim.#nTalvez as coisas não saiam como eu espero... mas..."
42160-114 = "[ns16] \"Pode ir.\"\n[ns17] \"Se algo acontecer, eu assumo a responsabilidade.\""
42160-119 = "...Sim!"
42160-124 = "...Você demorou."
42160-125 = "Houve alguma anomalia durante a ronda?"
42160-126 = "Não, nenhuma anomalia em particular."
42160-127 = "...Entendo."
42160-134 = "Novas ordens de cima. O Destacamento RABBIT também participará desta operação."
42160-135 = "...O que é este mapa?"
42160-136 = "Você deve reconhecê-lo.#nÉ a planta da Estação Kousagi."
42160-139 = "Amanhã às 09h00, um trem de carga da Kaiser Construction vai parar na plataforma 2 da Estação Kousagi para descarregar a bomba termobárica <A.N.T.I.O.C.H.>."
42160-140 = "Para o procedimento, a plataforma da Estação Kousagi ficará fechada até o meio-dia, mas...#nhá a possibilidade de forças contrárias notarem algo estranho e tentarem invadir a estação.#nPortanto, o Destacamento RABBIT deve cooperar com a Kaiser Security e defender o perímetro externo da estação."
42160-142 = "A bomba termobárica <A.N.T.I.O.C.H.>... É a ogiva que vocês, senpais, neutralizaram em sua primeira operação pública?"
42160-143 = "Exato."
42160-144 = "Trazer para dentro da cidade, logo agora, uma arma de destruição em massa que estava armazenada nos arredores do D.U. pela segurança dos cidadãos..."
42160-145 = "O Conselho Estudantil Geral — não, o que a senpai pretende fazer?"
42160-146 = "Assim que o descarregamento for concluído, a ogiva será instalada no silo subterrâneo da estação — e detonada.#nTodos os envolvidos devem evacuar a instalação imediatamente."
42160-147 = "...Detonar uma bomba termobárica em uma estação de metrô no centro da cidade...?"
42160-148 = "Mesmo sabendo que uma bomba termobárica tem seu poder amplificado quando detonada em um espaço fechado..."
42160-149 = "— Não há necessidade de explicar as especificações novamente.#nEu conheço o poder da ogiva <A.N.T.I.O.C.H.> melhor do que ninguém."
42160-150 = "...Por que você está obedecendo a uma ordem dessas?"
42160-151 = "— Porque é uma ordem.#nToda a responsabilidade pela operação recai sobre o Conselho Estudantil Geral."
42160-152 = "Mesmo que não tenhamos responsabilidade — é uma operação em que arriscamos nossas vidas, e nem sequer nos dizem o objetivo?"
42160-153 = "Todo o plano existe —"
42160-155 = "— para a restauração da Academia Especial SRT."
42160-159 = "...Restauração?#nFazendo algo assim?"
42160-160 = "Como uma academia erguida sobre o medo das pessoas... poderia se chamar Academia Especial SRT?"
42160-161 = "Uma SRT que ameaça a segurança dos cidadãos e depende da autoridade alheia para sobreviver...#nnão tem o direito de ser chamada de SRT."
42160-163 = "Esse direito não é dado.#n— É construído."
42160-164 = "Por ora, contanto que consigamos normalizar este caos...#npodemos criar quantos pretextos quisermos depois."
42160-169 = "...A senpai disse isso várias vezes, não foi?"
42160-170 = "Que a justiça da SRT não se abala em nenhuma circunstância."
42160-171 = "— Mais do que por uma SRT apenas no nome, eu luto por valores imutáveis."
42160-176 = "...Eu disse que é uma ordem."
42160-177 = "Você pretende se rebelar?"
42160-179 = "— Não."
42160-180 = "Quem está se rebelando é você, Yukino Shichido."
42160-184 = "A única que pode nos dar ordens — é a Presidente do Conselho Estudantil Geral."
42160-196 = "M-Miyako-chan..."
42160-197 = "Ah..."
42160-198 = "No fim, acabou nisso mesmo, né."
42160-200 = "...Com licença."
42160-208 = "\nPróximo;Vestes Bordadas na Noite"
