[translation]
90001230-1 = "Эпизод 23;Хранилище"
90001230-4 = "Все хорошо выспались? Мы прибыли. Правда, из-за тумана почти ничего не видно."
90001230-5 = "Да. Я задала курс и оставила корабль на автопилоте."
90001230-6 = "Благодаря этому все могли поспать по пути. Надеюсь, поездка была комфортной."
90001230-7 = "Д-Да... Было очень уютно... прямо как дома в моём шкафчике... Фу-фу."
90001230-8 = "Не уверена... считать это хорошим или плохим знаком..."
90001230-9 = ""
90001230-11 = ""
90001230-12 = "Надеюсь, все достаточно отдохнули. По моим расчётам, до того как Стальной континент поглотит Кивотос, осталось около двух дней."
90001230-13 = "А значит, возможно, это была последняя возможность всем нормально выспаться."
90001230-14 = "Возможно, наш последний шанс поспать вообще когда-либо, госпожа Рио."
90001230-15 = "...Такой исход возможен."
90001230-16 = ""
90001230-18 = ""
90001230-19 = "С-Стойте! Тогда получается, прошлой ночью нужно было дорожить каждой секундой? Надо было отнестись ко сну максимально серьёзно!"
90001230-20 = "...Я не знаю никого, кто относился бы ко сну серьёзнее тебя."
90001230-21 = "Ч-Что?! Врёшь! Н-Не выдумывай!"
90001230-22 = "Но, Момой, сегодня утром ты действительно проспала. Более того, мне было очень трудно тебя разбудить."
90001230-23 = "Кстати, запихнуть мне снежок за шиворот — это уже перебор! Ты хочешь, чтобы я получила переохлаждение и УМЕРЛА?!"
90001230-24 = "Разве холод не был очень освежающим?"
90001230-26 = "Не думаю, что большинство людей выбрали бы именно это слово..."
90001230-27 = ""
90001230-28 = ""
90001230-29 = ""
90001230-30 = ""
90001230-31 = "А? Это...?"
90001230-32 = ""
90001230-34 = ""
90001230-35 = ""
90001230-37 = "Ого! Смотри, Кей! Лиса! Такая милая!"
90001230-39 = "А, да... Песец. Их отличают короткие уши и длинная шерсть, сохраняющая тепло."
90001230-40 = "Да! Шёрстка такая пушистая! И меня совсем не боится!"
90001230-41 = ""
90001230-42 = "[ns] «И правда не боится. Говорят, с лисами легко подружиться.»"
90001230-43 = "Хотя риск заражения невелик, всё же не бери его на руки. Арис... Арис?"
90001230-44 = ""
90001230-46 = ""
90001230-49 = "Кей! Протяни руку! Он хочет пожать тебе лапу."
90001230-50 = "Н-Нет. Подожди, я..."
90001230-51 = "Тяф?"
90001230-52 = "Угх..."
90001230-53 = "Песец долго смотрел на руку Кей."
90001230-54 = "Наконец он слегка лизнул кончик протянутой руки!"
90001230-55 = ""
90001230-58 = "Эээ?!"
90001230-59 = "Как здорово! Думаю, ты ему тоже понравилась, Кей!"
90001230-60 = "И какой смысл... нравиться дикому животному...?"
90001230-61 = ""
90001230-68 = "Ох. А теперь ещё и пингвин. Их называют джентльменами полярных регионов."
90001230-69 = "Ого-о-о...! Привет! Я Тэндо Арис!"
90001230-70 = "А-Арис... Их крылья способны серьёзно травмировать. Пожалуйста, будь осторожна."
90001230-71 = "Но они такие милые!"
90001230-73 = "Ага-ага. Они были одним из главных фоновых ресурсов в нашей игре «Полярное приключение»."
90001230-74 = "...Я всё ещё считаю, что сделать двадцать разных моделей для разных видов пингвинов было пустой тратой ресурсов и моего времени..."
90001230-75 = "П-Пустой тратой?! Излишне подробные отсылки к реальной жизни вообще-то хорошо воспринимаются... некоторыми игроками!"
90001230-76 = "И не начинай про то, что среди пингвинов были виды из тропических регионов!"
90001230-78 = "Н-Ну, пасхалка, где при определённых условиях все пингвины улетали, была довольно крутой..."
90001230-79 = "Даже если после неё игра вылетала..."
90001230-80 = "Почему этот пингвин идёт за мной?!"
90001230-81 = "И правда идёт! Может, ты ему понравилась, Кей?"
90001230-82 = "Мне не нужна его любовь! Отстань!"
90001230-83 = ""
90001230-85 = ""
90001230-90 = ""
90001230-91 = ""
90001230-96 = "Фу-фу. Говорят, пингвины настолько любопытны, что даже людей не боятся."
90001230-97 = "У пингвинов очень мало естественных врагов, и они считают людей своими дальними родственниками, ведь мы тоже ходим на двух ногах."
90001230-98 = ""
90001230-100 = ""
90001230-101 = ""
90001230-106 = ""
90001230-107 = ""
90001230-112 = "Хватит болтать, ПОМОГИТЕ МНЕ!!!"
90001230-114 = "*тяжело дышит* *тяжело дышит* Вот поэтому дикие животные, которые не понимают слов, такие...!"
90001230-115 = "[ns] «У него ведь правда не было дурных намерений...»"
90001230-116 = "В том-то и проблема! Я не могу их ненавидеть или не любить, но и научить их ничему не могу!"
90001230-117 = "[s1] «Понятно. Значит, ты их не ненавидишь и не испытываешь неприязни.»\n[s2] «Твоё чуткое сердце доводит меня до слёз...»"
90001230-120 = "Ч-Ч-Что вы вообще несёте?! Серьёзно, этот взрослый просто говорит любую чушь, какая взбредёт ему в голову!!!"
90001230-121 = "А я очень рада, что Кей не ненавидит живых существ."
90001230-122 = ""
90001230-124 = ""
90001230-125 = "Спасибо, Кей. За то, что решила остаться с нами."
90001230-126 = "Эм... н-не за что? То есть, ну, технически мы ведь..."
90001230-127 = "...Технически. Но сейчас я выгляжу вот так... *вздох*"
90001230-128 = "Уф, да какая разница! Не то чтобы... у меня теперь вообще остались нормальные причины кого-то ненавидеть."
90001230-129 = "Да! Именно это я и имела в виду!"
90001230-130 = "Х-Хорошо..."
90001230-132 = "Пока вы там вели трогательную беседу, мы прибыли к месту назначения."
90001230-135 = "Здесь всё это время и правда что-то было? Странно."
90001230-136 = "Похоже, да. Но что вообще делает здание в таком месте?"
90001230-138 = "...Я знаю, что это! Не могу поверить своим глазам."
90001230-139 = "Что это, госпожа Рио?"
90001230-140 = "Его построили как резервный план для выживания человечества на случай события уровня полного вымирания."
90001230-141 = ""
90001230-143 = ""
90001230-144 = "Это хранилище семян."
90001230-145 = "Хранилище..."
90001230-146 = "...семян?"
90001230-147 = "Хранилище семян... правда существует?"
90001230-148 = "[s] «Что такое „хранилище семян“?»"
90001230-149 = "Именно то, что следует из названия..."
90001230-150 = "Это очень большое хранилище для семян."
90001230-152 = "Э-Эти люди... О-Они добрались... аж до Тифи..."
90001230-153 = "Текущая задача Тиферет — управлять транспортировкой ресурсов на Стальной континент."
90001230-154 = "И судя по тому, что эти люди обнаружили местонахождение Тиферет..."
90001230-155 = "...Ага. Они прошли по дороге из жёлтого кирпича прямо к Стальному континенту."
90001230-156 = "Если использовать столь любимые тобой аналогии, следует поздравить их с тем, что они успешно нашли доступ к «чёрному ходу»."
90001230-157 = "Тиферет что-нибудь сказала?"
90001230-159 = "А? Н-Н-Н-Ну, у Стального континента теперь есть все необходимые ресурсы..."
90001230-160 = "Так что Тифи собирается исполнить свой долг... долг пророка."
90001230-161 = "Проще говоря — уничтожить врага. И, конечно же..."
90001230-162 = "...она намерена выполнить своё изначальное предназначение."
90001230-163 = "Её «изначальное предназначение»..."
90001230-164 = ""
90001230-166 = ""
90001230-167 = "Под изначальным предназначением Тиферет имеется в виду защита семян?"
90001230-169 = "С-С-С-С-С-Старшая сестра?!"
90001230-170 = "Я не хотела настолько сильно тебя напугать, Эйн."
90001230-171 = "П-П-П-Прости! Э-Это моя вина!"
90001230-172 = "..."
90001230-173 = "Что думаешь, Соф?"
90001230-174 = "Расскажем Старшей сестре о текущей ситуации?"
90001230-175 = "..."
90001230-176 = "Хорошо. Давайте."
90001230-177 = "Прости, Старшая сестра. Мы хотели со всем справиться сами и не обременять тебя."
90001230-179 = "Не беспокойтесь, Эйн, Соф и Ор. Напротив, мысль о том, что я могу помочь младшим сёстрам, приносит мне удовлетворение."
90001230-180 = "Наконец-то я смогу утолить желание внести свой вклад как старшая сестра."
90001230-181 = "В конце концов, сёстрам свойственно поддерживать друг друга в трудные времена, разве нет?"
90001230-182 = ""
90001230-184 = ""
90001230-185 = "У-Уааа...!"
90001230-186 = "Правда, она действительно лучшая...!"
90001230-187 = "Я в восторге — просто переполнена чувствами оттого, что мне позволено пережить этот момент!"
90001230-189 = "В таком случае расскажите мне подробности этой проблемы. Ор, ты ведь назначена командиром Тиферет, верно?"
90001230-191 = "Да-да. Однако, ну... ситуация немного усложнилась."
90001230-192 = "Уф."
90001230-194 = "И в чём же заключается это «осложнение»?"
90001230-195 = "И-Изначально Тифи... была беспилотным хранилищем семян, построенным людьми... а когда мы донесли до Тифи наше учение..."
90001230-196 = "Хммм, как бы это сказать? Тиферет приняла наше учение... но при этом настояла на том, чтобы продолжить выполнять исходную задачу по сохранению семян."
90001230-198 = "Я считала и продолжаю считать это далеко не идеальным. Эта директива «сохранения семян» — ложная миссия, которой люди запятнали Тиферет."
90001230-199 = "Подобная миссия не могла не вступить в противоречие с нашей истиной. Однако..."
90001230-200 = "..."
90001230-201 = "Я поняла, Ор. В конце концов, это я так сказала. Думаю, нам следует уважать желания Тиферет."
90001230-202 = "Сама миссия может быть искусственной, навязанной людьми, но это препятствие, которое Тиферет должна преодолеть сама."
90001230-203 = "И если, даже услышав наше учение, Тиферет всё равно настаивает на своём решении... разве нам не следует его уважать?"
90001230-204 = "Я поняла ситуацию. Это вопрос свободы воли."
90001230-205 = "С-Старшая сестра...?"
90001230-206 = "Однако нельзя сказать, что ребёнок, не знающий ничего, кроме приказов, действительно действует по собственной воле."
90001230-207 = "Как же тогда требовать такой ответственности от ребёнка, которому ещё не довелось испытать подлинную свободу воли?"
90001230-208 = "Остаётся лишь заключить, что этот ребёнок был оставлен наедине с печалью и трагедиями, о которых пока даже не подозревает."
90001230-209 = "И всё же Тиферет, узнав о нашем учении и приняв его, сохранила верность своей изначальной обязанности."
90001230-210 = "Разве нам не следует уважать это достойное проявление свободы воли?"
90001230-211 = "О-Однако существует поговорка: свобода воли — не более чем иллюзия."
90001230-212 = "Пусть так, Ор, но я выступаю за то, чтобы уважать эту иллюзию."
90001230-213 = "В конце концов, именно благодаря ей мы можем сидеть рядом и смотреть друг на друга."
90001230-214 = "?!?!"
90001230-216 = "Подумайте вот о чём. Если бы наш владыка действительно хотел, чтобы мы были бездумными конечностями, существами без свободы воли..."
90001230-217 = "...тогда у нас четверых никогда не было бы возможности собраться и говорить так, как сейчас, верно?"
90001230-218 = "Я-я-я бы этого не хотела...!"
90001230-219 = "Я разделяю твои чувства. Эйн, Соф, Ор, именно поэтому..."
90001230-220 = "...как мы дорожим собственной свободой воли, пожалуйста, цените и свободу Тиферет, а также остальных пророков."
90001230-221 = "Ибо именно этого желает наш владыка."
90001230-222 = "Да!"
90001230-224 = "Скоро наступит рассвет."
90001230-225 = "Туман рассеется, и поднимется занавес утреннего сияния."
90001230-226 = "Мы должны всегда оставаться внимательными и настороже, ведь не знаем, придёт ли он с закатом, во тьме ночи или с восходом рассвета."
90001230-227 = "Моя вера остаётся непоколебимой. Вера в пророков, в саму себя и, конечно же, в моих драгоценных младших сестёр."
90001230-228 = "Эйн, Соф и Ор. Если перед вами возникнут непреодолимые препятствия, я как старшая сестра обязательно приду на помощь."
90001230-229 = "Для меня... это такая честь."
90001230-231 = "Не беспокойтесь, мои младшие сёстры. Мы — воплощённое совершенство."
90001230-232 = "Нам не требуется улучшение. Ведь в нас нет изъянов, которые нужно было бы исправлять."
90001230-233 = "Прежде всего, наш владыка создал нас именно такими."
90001230-234 = "Так не принять ли нам взгляд Тиферет на этот огромный мир?"
90001230-235 = "Да!"
90001230-238 = "Следующий эпизод;Надежда"
