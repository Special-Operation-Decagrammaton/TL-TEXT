[translation]
2005202-1 = "Инфраструктура"
2005202-2 = "Ах, ещё один холодный день!"
2005202-3 = "Хотя чего я вообще ожидала? Хех."
2005202-4 = "[s] «Нам правда обязательно было забираться так далеко?»"
2005202-5 = "Да! Да, обязательно."
2005202-6 = "Для Издательского отдела это, возможно, маленький шаг, но..."
2005202-7 = "...для Красной Зимы он может оказаться... важным!"
2005202-8 = "Шагом к чему-то действительно значимому."
2005202-9 = "[s] «И к чему же?»"
2005202-10 = "Как я уже сказала — к прокладке линий связи!"
2005202-11 = ""
2005202-14 = "Хех. Знаю, знаю. Вы думаете: «С какой стати Издательский отдел вообще занимается чем-то подобным?»"
2005202-15 = "Понимаю, прекрасно понимаю. Хе-хе-хе. Ведь это явно вопрос общественной инфраструктуры."
2005202-16 = "Следовательно, по идее, этим должно заниматься Управление Красной Зимы, разве нет?"
2005202-17 = "Но я не люблю бюрократию, да и они тоже. Если оставить всё им, мы и чертежа не увидим ещё лет сто."
2005202-18 = "[s] «Тогда причина, по которой этим занимается Издательский отдел...»"
2005202-19 = "Да-да. Именно то, о чём вы подумали."
2005202-20 = "Это официальный контрактный заказ."
2005202-21 = "[s1] «Вот как...?»\n[s2] «Значит, Управление Красной Зимы теперь отдаёт работы на аутсорс...»"
2005202-24 = "Хм? Как я собираюсь в одиночку прокладывать все линии связи? Зачем... мне вообще делать это самой?"
2005202-25 = "Главное — результат, Сенсей. Результат. Каким способом он достигнут — неважно."
2005202-26 = "Итак, все сюда! Добро пожаловать!"
2005202-27 = ""
2005202-29 = ""
2005202-33 = ""
2005202-34 = "Вы ведь не шутили, Издательский отдел? За эту работу нам действительно дадут дополнительный пудинг?"
2005202-35 = "И даже тот «морс высшего сорта», который вы достали через свои особые связи?"
2005202-37 = "Я отвечаю за каждое своё слово. В конце концов, бизнес невозможен без доверия."
2005202-38 = "Я, Арамаки Якумо, президент Издательского отдела, никогда не стала бы шутить с денежными вопросами!"
2005202-39 = ""
2005202-41 = ""
2005202-42 = "...Сенсей? Почему вы так удивлены?"
2005202-43 = "[s3] «Не могу поверить... Это же почти финансовая пирамида!»\n[s4] «Решила выступить посредником, да?»\n[s5] «Я думал, ты попытаешься максимизировать прибыль Издательского отдела!»"
2005202-47 = "Что вы такое говорите, Сенсей? Вы ведёте себя так, будто я сам дьявол во плоти, явившийся в Кивотос."
2005202-48 = "...Хотя если кто-нибудь решит кинуть меня с оплатой, я готова стать чем-то гораздо, гораздо хуже."
2005202-49 = "Как бы то ни было, похоже, вы упускаете общую картину, Сенсей. Хе-хе-хе."
2005202-50 = "[s6] «Ух, правильная мысль, но не тот человек её говорит!»\n[s7] «Тогда что ты знаешь такого, чего не знаю я, Якумо?»"
2005202-53 = "Ну, видите ли…"
2005202-54 = "Нельзя вести бизнес без доступной инфраструктуры!"
2005202-55 = "Подумайте сами, Сенсей. Если стоимость прокладки инфраструктуры вырастет, подрядчик естественным образом переложит эти расходы на потребителя."
2005202-56 = "А организация, которая здесь запускает подобные проекты, — Управление Красной Зимы."
2005202-57 = "Эти скупердяи выделили настолько маленький бюджет, что проект изначально было невозможно начать."
2005202-58 = "У них перед глазами только прибыль, прибыль, прибыль и мгновенная выгода. Поэтому они режут бюджет, а потом завышают цены для потребителей."
2005202-59 = "Простейшее уравнение: краткосрочная выгода и долгосрочные убытки!"
2005202-60 = "В нашем гиперсвязанном обществе, где все постоянно связаны со всеми... сети связи можно без преувеличения назвать линиями жизни!"
2005202-61 = "И если бездумно отдать эти линии жизни в частные руки, нам всем конец!!"
2005202-62 = "Поэтому Издательский отдел построит инфраструктуру связи как можно дешевле, даже если ради этого придётся понести краткосрочные убытки!"
2005202-63 = "А это приблизит нас к долгосрочной цели: договориться с Управлением Красной Зимы о правах пользования!"
2005202-64 = "Именно правах ПОЛЬЗОВАНИЯ, а не собственности. Это принципиально важно."
2005202-65 = "[s] «Так... И в чём конкретно план?»"
2005202-66 = "Подождите — и сами увидите."
2005202-67 = "Хе-хе-хе."
2005202-70 = "Наконец-то в наших общежитиях появился... проводной интернет!!"
2005202-71 = "Наконец-то! Освободимся от оков этого черепашьего, ленивого, ненадёжного, низкокачественного беспроводного интернета!"
2005202-72 = ""
2005202-75 = ""
2005202-76 = "Итак, все слушайте."
2005202-77 = "Теперь в ваших руках быстрый и доступный интернет... Как вы распорядитесь этой силой?"
2005202-79 = "А? Н-Ну..."
2005202-80 = "Когда она так говорит, я даже не знаю, что вообще можно делать в интернете..."
2005202-81 = "Вам повезло, что я совершенно случайно оказалась рядом и могу помочь! Пока забудьте всё, что знаете, и начнём просто с РАЗВЛЕЧЕНИЙ."
2005202-82 = "Смотрите: на этой стриминговой платформе можно бесплатно прочитать до 100 глав веб-романов, созданных, размещённых и спонсируемых Издательским отделом!"
2005202-83 = "Сто глав?!"
2005202-84 = "БЕСПЛАТНО?!"
2005202-85 = "Именно. А через разумный промежуток времени, когда вы дочитаете эти сто глав, вам даже будут бесплатно показывать превью новых!"
2005202-86 = "...Конечно, если ждать не хочется, всегда можно оплатить премиум и получать доступ к контенту раньше остальных пользователей."
2005202-87 = "Платить? Премиум...?"
2005202-88 = "Да ладно, сто глав бесплатно! Нам никогда не придётся платить!"
2005202-89 = ""
2005202-91 = ""
2005202-92 = "(Хе-хе-хе... Поначалу все так думают...)"
2005202-93 = "[s] «(Якумо... Ах ты...!)»"
2005202-96 = "Я... уже всё дочитала?!"
2005202-97 = "Вот именно! Где продолжение?! Мне нужно узнать, что будет дальше!"
2005202-98 = "Спокойно, спокойно. Разве я не говорила? Нужно лишь оплатить премиум-контент..."
2005202-100 = "Я слышала! И уже всё купила и дочитала!"
2005202-101 = "Так когда выйдет продолжение?! Я даже подпишусь! ПОЖАЛУЙСТА!!"
2005202-102 = "?!"
2005202-103 = "П-Признаюсь, даже я не ожидала, что вы закончите настолько быстро."
2005202-104 = "Хм, хорошо, что я всегда девушка с решением. Почему бы вам не побаловать себя анимационной адаптацией веб-романа, который вы читали?"
2005202-105 = "В конце концов, читать слова и видеть всё в движении — совсем разные вещи, верно?"
2005202-106 = "Да! Я хочу посмотреть!"
2005202-107 = "Э...? Но у сериалов бесплатно доступно только десять эпизодов...?"
2005202-108 = "А, насчёт этого... Надеюсь, в вашем сердце найдётся немного понимания к этим беднягам. Рисовать картинки — совсем не лёгкая работа!"
2005202-109 = "Если ожидание слишком мучительно... вы также можете поддержать «автора» посредством «добровольного пожертвования»."
2005202-110 = "Как ни крути, так устроен мир. Именно деньги заставляют его вращаться. Хе-хе-хе."
2005202-111 = "(А поскольку посредником выступает наш собственный Издательский отдел, мы ещё и неплохо заработаем на комиссии.)"
2005202-112 = "И ещё кое-что... Почему вы ограничили сумму, которую я могу потратить?"
2005202-113 = "Да, уберите ограничение! Я бы скупила всё, что смогла! У меня ещё остались деньги!"
2005202-114 = "Хотя я благодарна за такой настрой, главная цель нашего Издательского отдела — счастье и удовольствие читателей."
2005202-115 = "Мы бы ни за что не хотели, чтобы кто-то из вас остался без гроша только из-за нашей платформы. Разве это не значит поставить телегу впереди лошади?"
2005202-116 = "(...К тому же бизнес проживёт дольше, если мы не разорим потребителей — ни финансово, ни эмоционально.)"
2005202-117 = "А если хотите увидеть что-нибудь ещё... Сейчас мы подготовили несколько видеопроектов вроде этого..."
2005202-118 = ""
2005202-120 = ""
2005202-121 = ""
2005202-122 = "Ох... Какая неприятность..."
2005202-123 = "Ч-Что теперь?"
2005202-124 = "Что...? При нынешней скорости установленных линий невозможно нормально смотреть видео высокого разрешения вроде этого...?"
2005202-125 = "К сожалению, похоже на то. И ЧТО ЖЕ нам теперь делать? Видите ли, Управление Красной Зимы никак не хочет увеличить бюджет."
2005202-126 = "Но что вы думаете? Больше веб-романов, вебтунов, видео..."
2005202-127 = "Для наилучшего просмотра вам понадобится более быстрое подключение к интернету..."
2005202-128 = "...разве нет?"
2005202-129 = ""
2005202-134 = "Вы совершенно правы!"
2005202-135 = "Ух! Конечно же, Управление мешает нам даже здесь! Лучшего повода устроить протест я ещё не видела!"
2005202-136 = "Давайте! Зовите всех из общежитий!"
2005202-137 = "Отличная идея! Уверена, в других общежитиях думают так же!"
2005202-138 = "Хе-хе-хе. Пока будете этим заниматься, мы будем благодарны, если заодно немного прорекламируете нашу платформу."
2005202-139 = "Когда все вместе могут смотреть весёлый контент, все счастливы, верно?"
2005202-140 = "Не волнуйтесь! Предоставьте это нам!"
2005202-141 = "О, так здесь ещё можно общаться, публиковать отзывы и писать своё мнение в сообществе. Отлично!"
2005202-142 = "Спасибо, все."
2005202-143 = "Издательский отдел Красной Зимы всегда будет стремиться предоставлять вам контент высочайшего качества!"
2005202-144 = "(Если честно, примерно треть мы заполняем, закупая дешёвый мусорный контент за пределами Красной Зимы...)"
2005202-145 = "(Но для местных студентов это свежий материал, так что проблем нет. Хе-хе-хе.)"
2005202-147 = "Студентам не понадобилось много времени, чтобы организовать марш против Управления Красной Зимы с требованием установить более качественные линии."
2005202-148 = "А бизнес Издательского отдела развивался с ещё большим размахом...!"
2005202-149 = ""
2005202-154 = "...В результате, похоже, финансы Управления Красной Зимы заметно пострадали."
2005202-155 = "В любом случае это было то, чем Управление Красной Зимы изначально должно было заниматься само, но они просто попытались спихнуть всё на меня. Так что разве не справедливо сказать, что Издательский отдел совершенно невиновен?"
2005202-156 = "Хе-хе-хе."
2005202-157 = "[s] «Иногда...»"
2005202-158 = "Что?"
2005202-159 = "[s] «Иногда мне кажется, что ты самый страшный человек из всех, кого я знаю, Якумо.»"
2005202-160 = "Ой, да ладно. Что вы такое говорите? Где ещё вы найдёте настолько безобидного студента, как я?"
