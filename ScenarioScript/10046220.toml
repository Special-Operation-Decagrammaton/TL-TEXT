[translation]
10046220-2 = ""
10046220-3 = "А, хахаха... Здравствуйте."
10046220-4 = "Эй! Ты та угонщица танка!"
10046220-5 = "Что?! Вот как ты меня запомнила?!"
10046220-6 = "Опять что-то задумала? Может, на этот раз захватишь катер?"
10046220-7 = "Н-Нет! Наоборот! Полная противоположность... плохим делам!"
10046220-8 = "Мы пришли помочь!"
10046220-9 = "«Мы»... То есть...?"
10046220-10 = "Кружок дополнительных занятий! Мы хотим помочь с патрулированием пляжа."
10046220-11 = "Это... очень мило. Почему?"
10046220-12 = "Почему? Ну, мы проголосовали. Единогласно."
10046220-13 = "Оперативная группа Правосудия всегда приходит Тринити на помощь... вот мы и решили хотя бы раз дать вам передохнуть. ...Чтобы вы немного отдохнули!"
10046220-14 = "Ахаха... Но вся заслуга не моя. Это было бы нечестно."
10046220-15 = "Вообще-то идею предложили Азуса и Кохару."
10046220-16 = "Кохару?"
10046220-17 = "Да. Думаю, она чувствует себя виноватой, потому что сама отдыхает, пока остальная Оперативная группа Правосудия так занята."
10046220-18 = "Хаха. Очень похоже на Кохару."
10046220-19 = "Но даже Азуса...?"
10046220-20 = "...Ну, пытаться понять ЭТО бессмысленно."
10046220-21 = "Я буду очень благодарна за вашу помощь."
10046220-22 = "То есть можно?"
10046220-23 = "Я по уши в работе. Вообще-то помощи я только рада."
10046220-24 = "Но где остальные из Кружка дополнительных занятий...?"
10046220-25 = "Эм... Не знаю. Мы решили разделиться и искать тебя по отдельности."
10046220-26 = "Ага. Тогда придётся высматривать их во время патруля!"
10046220-27 = "Хаха... Похоже, я только добавила тебе работы..."
10046220-28 = "Пусть одна я не слишком полезна..."
10046220-29 = "...но можешь рассчитывать, что я выложусь на полную!"
