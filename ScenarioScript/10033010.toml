[translation]
10033010-1 = "Эпизод 1;Честность, беспристрастность и веселье"
10033010-2 = ""
10033010-4 = "..."
10033010-5 = "..."
10033010-6 = "В-возможно, я неправильно тебя поняла, Ния..."
10033010-7 = ""
10033010-9 = ""
10033010-11 = ""
10033010-12 = "Нет-нет. Ты всё поняла совершенно правильно. С помощью очень-очень беспристрастного и, можно сказать, весёлого метода..."
10033010-13 = "Я выбрала клуб, который будет принимать академию Геенны во время их экскурсии в Хяккияко!"
10033010-14 = "И счастливым победителем стал Отдел организации фестивалей! Поздравляю! Ньяхаха!"
10033010-16 = "Почему мы узнаём об этом только сейчас? И я ни капли не доверяю этому «беспристрастному методу», о котором она говорит! Ни капли!"
10033010-17 = "Было весело! Оно крутилось, крутилось и крутилось. Президент Ния назвала это рулеткой."
10033010-18 = "В-вы так выбрали, кому поручить настолько важное дело?!"
10033010-20 = "Именно! А сама Чисэ помогала её делать."
10033010-21 = "Но крутила президент. Кругом и кругом."
10033010-22 = ""
10033010-24 = ""
10033010-27 = ""
10033010-28 = ""
10033010-30 = "Умика! Семье нужна ты! Не умира-а-ай!"
10033010-31 = ""
10033010-33 = ""
10033010-34 = "Н-но... без босса... то есть без президента Шизуко, как мы вообще должны с этим справиться?!"
10033010-35 = "Ну надо же было президенту уехать в командировку именно сейчас... Она бросила нас и отправилась изучать фестивальную культуру Тринити!"
10033010-37 = "Ну, Отдел организации фестивалей ведь лучше всех разбирается в таких вещах, разве нет?"
10033010-38 = "Так что, если подумать, я на самом деле приняла очень хорошее решение, правда? Какая я молодец!"
10033010-39 = "Но ты же сказала, что всё выбрала крутилка."
10033010-40 = "Как бы то ни было, мы возлагаем на вас большие надежды, Отдел организации фестивалей!"
10033010-41 = "Мне ужасно жаль, что я не смогу присутствовать лично, но надеюсь, мои добрые пожелания придадут вам сил. Ньяхаха!"
10033010-42 = ""
10033010-44 = ""
10033010-46 = "П-пожалуйста! Ния!"
10033010-47 = "И она отключилась. Что будем делать, Умика?"
10033010-48 = "Мне просто... нужно подышать..."
10033010-49 = "*вдох* *выдох* *вдох* *выдох*"
10033010-50 = ""
10033010-52 = ""
10033010-53 = "Не-а! Не помогло! Нам конец, Пина!"
10033010-54 = "Это мне не по зубам! Нужно просто отказать! Твёрдо!"
10033010-55 = ""
10033010-57 = ""
10033010-58 = "...Умика?"
10033010-59 = "..."
10033010-60 = "Нет. Мы не можем, Пина."
10033010-61 = "Нам придётся взять эту ответственность на себя, так или иначе."
10033010-62 = "Что?!"
10033010-63 = "Босс оставила Отдел организации фестивалей на наше попечение! Мы не можем её подвести!"
10033010-64 = "Не знаю... Я просто не представляю, как провернуть такое без неё!"
10033010-65 = "..."
10033010-66 = "Вааа! Босс! Вернись! Я знаю, это невозможно, но пожалуйста!"
10033010-68 = ""
10033010-69 = "Нужно устроить фестиваль! Роскошный фестиваль, который встретит студентов Геенны прямо у ворот!"
10033010-70 = "Фестиваль заселения, когда они будут устраиваться в общежитии! А потом Ночной фестиваль! Пижамный фестиваль! Фестиваль! Фестиваль! Фестиваль!"
10033010-71 = "Нам надо немного придержать коней! Я люблю фестивали не меньше тебя, но у нас нет ни времени, ни бюджета на столько праздников."
10033010-72 = "Я уже представляю лицо президента, если она вернётся после всех своих исследований фестивалей и увидит пустую казну! Она точно не обрадуется!"
10033010-73 = "Т-ты права, но что ещё мы вообще можем сделать в такой ситуации?"
10033010-74 = "Я придумала! Сделаем всё как линчеватели! Деревню линчевателей, будто съёмочную площадку, с аттракционами про линчевателей!"
10033010-75 = "Аттракционы о верности и дружбе! Аттракционы о решимости и стойкости! Аттракционы! Аттракционы! Аттракционы!"
10033010-76 = "Мы ведём их в тематический парк линчевателей или на экскурсию по Хяккияко? Хотя... это, наверное, могло бы сработать."
10033010-77 = "Н-нет! Ты совершенно права! Такое вообще не пройдёт!"
10033010-78 = "Угх... Нам нужна идея... Хоть какая-нибудь... Иначе эта экскурсия превратится в хаос, а доброе имя Отдела организации фестивалей будет опозорено!"
10033010-79 = "Ах! В такие моменты..."
10033010-80 = "Ты что-то придумала, Пина?"
10033010-82 = "В фильмах именно в такой момент все линчеватели собираются вместе! У нас есть боевые союзники, которые доблестно придут нам на помощь!"
10033010-83 = ""
10033010-86 = ""
10033010-87 = ""
10033010-88 = "Боевые союзники?! П-погоди, Пина! Подожди меня. Подожди!"
10033010-89 = ""
10033010-91 = ""
10033010-94 = ""
10033010-95 = "Разве это не Клуб внутренней дисциплины?"
10033010-96 = "Прямо в яблочко, Умика! Мы уже много раз сражались бок о бок, так что наверняка сможем снова объединить силы!"
10033010-97 = "Э-это правда, но не слишком ли это поспешно?!"
10033010-98 = "(Мы вообще можем делать такое без одобрения босса...?)"
10033010-99 = "Д-давай вернёмся в клубную комнату! Мы сможем придумать план... немного осторожнее."
10033010-100 = "А что не так с этим планом?"
10033010-101 = ""
10033010-103 = ""
10033010-105 = "Ого! Отдел фестивалей? Что вы делаете так далеко от дома?"
10033010-106 = "Ты просто случайно появляешься в идеально подходящий момент?!"
10033010-107 = "Видишь? Нам уже везёт!"
10033010-108 = "Всё хорошо? Что-то случилось?"
10033010-109 = ""
10033010-111 = ""
10033010-112 = "Как товарища по оружию, прошу тебя исполнить мою отчаянную просьбу, Каэдэ!"
10033010-114 = "Э-эм, может, сначала стоит немного объяснить ей ситуацию."
10033010-115 = "Хи-хи. Почему бы нам не зайти внутрь и не разобраться, чем я могу помочь?"
10033010-116 = "Вот так просто?!"
10033010-121 = ""
10033010-122 = "Хм... Понятно! Всё достаточно просто! Геенна приезжает в Хяккияко!"
10033010-123 = "Вот в общем-то и всё, Каэдэ!"
10033010-124 = "Не думаю, что всё настолько просто..."
10033010-125 = "Но если всё усложнять, мы только запутаемся."
10033010-126 = "В конце концов, Цубаки говорит, что лучший способ принимать сложные решения — сначала хорошенько поспать!"
10033010-127 = "Кстати, а где Цубаки и Мимори? Я их здесь не вижу."
10033010-129 = "А-а? Это, эм..."
10033010-130 = "О-о нет! С ними случилось что-то ужасное? Если присмотреться, в комнате Клуба внутренней дисциплины действительно только ты!"
10033010-131 = "Н-нет! Просто... Мимори на прошлой неделе отправилась на тренировку дисциплины."
10033010-132 = ""
10033010-134 = ""
10033010-135 = "Дисциплины?"
10033010-136 = "Тренировках?"
10033010-137 = "Так она сказала! Сказала, что это путешествие, которое ей необходимо совершить, чтобы стать настоящей леди!"
10033010-138 = "Наверное... я понимаю?"
10033010-139 = "Ничего страшного, если нет! Мимори просто говорит и делает вещи, которые обычным людям вроде нас не понять!"
10033010-140 = "Но мы с Цубаки давно решили: нам не обязательно её понимать, чтобы уважать её желания. Ага!"
10033010-142 = "Ого! Вот что значит настоящая верность. Ты уважаешь союзников несмотря ни на что и никогда не ставишь под сомнение их поступки."
10033010-144 = "Д-да! Думаю, так и есть!"
10033010-145 = "Тогда Цубаки тоже отправилась в путешествие в поисках себя?"
10033010-146 = "Цубаки занимается тем, чем всегда занимается Цубаки! Где-то тренирует сон."
10033010-147 = "К-как достойно восхищения. Преданность и постоянство Цубаки в тренировках почему-то очень успокаивают."
10033010-148 = "В любом случае! Эта экскурсия звучит так круто! Я тоже хочу на такую!"
10033010-149 = "Ну, по крайней мере, мне так кажется. А что вообще такое экскурсия?"
10033010-150 = "Понятия не имею! Но всё, где есть слово «поездка», просто обязано быть невероятно весёлым."
10033010-151 = "Какая ты умная, Пина! За такую правоту тебе положена золотая звезда!"
10033010-152 = "Спасибо тебе от Земли до Луны и обратно, Каэдэ!"
10033010-153 = "Боюсь, придётся вас разочаровать... На этот раз мы принимаем экскурсию, а не участвуем в ней."
10033010-154 = "И ты совершенно права, Умика! Тогда за дело! Эм... С чего начнём? Ты знаешь?"
10033010-155 = "Совершенно точно не знаю!"
10033010-156 = ""
10033010-159 = "(Чем дальше, тем яснее я понимаю, что мы взялись за слишком большой проект... Мы к нему не готовы.)"
10033010-160 = "Тебе плохо, Умика? Ты бледнеешь буквально на глазах!"
10033010-161 = "...Я просто переживаю, что всё пойдёт совсем не так, как ты себе представляешь."
10033010-162 = "А? Почему бы и нет?"
10033010-163 = "У нас просто нет такого опыта. Обычно всеми нашими проектами руководит Шизуко."
10033010-164 = "А это мероприятие куда масштабнее всего, с чем мы сталкивались раньше. Когда в деле участвуют разные академии, это уже совсем другой уровень."
10033010-165 = "Это..."
10033010-167 = "Я... немного боюсь, что всё провалится из-за меня. Т-тебе совсем не страшно, Пина?"
10033010-168 = "Если посмотреть с такой стороны, я тоже начинаю—"
10033010-170 = "Ва! Нет-нет-нет! Что я вообще слышу?!"
10033010-171 = "Каэдэ?!"
10033010-172 = "Именно в такие моменты нужно подняться!"
10033010-174 = "Настоящая леди смотрит страху прямо в глаза и говорит: «Не сегодня!» Иначе никто вообще ничего бы не делал!"
10033010-176 = "Золотая звезда Каэдэ! Я много раз видела этот урок в фильмах про линчевателей: нужно схватить судьбу за рога и ускакать с ней в закат!"
10033010-177 = "Это не совсем... Ну ладно, с чего нам вообще начать?"
10033010-178 = "Это...! Эм, понимаешь...!"
10033010-179 = "Мы можем... вместе устроить мозговой штурм?"
10033010-180 = "..."
10033010-181 = "..."
10033010-182 = "Это вообще не моя область!"
10033010-183 = "Вот бы президент Шизуко сейчас была здесь!"
10033010-184 = "Мы можем... провалиться... Прости, босс."
10033010-185 = "*зевает*...Поэтому я и связалась с Сенсеем."
10033010-187 = "Цубаки?!"
10033010-188 = "Президент Цубаки?!"
10033010-190 = "Что значит «связалась»?! Н-но ещё загадочнее: когда ты успела сюда прийти? И откуда ты знала, о чём мы говорили?!"
10033010-191 = "Я... увидела это во сне... во время тренировки сна. Хр-р...."
10033010-193 = "Потрясающе! Как и ожидалось от Цубаки!"
10033010-195 = "К-Как...?"
10033010-196 = "Не волнуйтесь... Уверена, Сенсей поможет..."
10033010-197 = "*зевает*...Ладно. Спокойной ночи."
10033010-198 = "П-подожди минутку! Что именно ты сказала Сенсею?!"
10033010-200 = "Хр-р..."
10033010-202 = "Её способность мгновенно засыпать поражает!"
10033010-203 = "Это тот момент, когда она не проснётся, пока не произойдёт что-нибудь важное, а точнее — пока не придёт Сенсей?!"
10033010-204 = "Значит, нам просто ждать Сенсея? Так можно?"
10033010-205 = "О-о! Я знаю. У меня есть идея."
10033010-207 = "Ты придумала решение всех наших проблем, Каэдэ?"
10033010-208 = "Каэдэ! Идеальная, очаровательная Каэдэ!"
10033010-210 = ""
10033010-212 = ""
10033010-213 = "Хотите... сыграть в Mushiqueen, пока не придёт Сенсей?"
10033010-214 = "Каэдэ...?!"
10033010-215 = ""
10033010-219 = "[ns1] «Я пришёл сразу, как только получил звонок.»\n[ns2] «Вам нужна помощь? Помощь уже здесь!»"
10033010-222 = "Слава богу, Сенсей! Вы нам очень нужны!"
10033010-223 = "Мне правда ужасно неловко, что вам пришлось проделать весь этот путь."
10033010-224 = "[s] «Нет-нет. Экскурсия с Геенной — это...!»"
10033010-227 = ""
10033010-228 = ""
10033010-229 = ""
10033010-231 = ""
10033010-232 = ""
10033010-233 = ""
10033010-235 = ""
10033010-237 = ""
10033010-242 = "С-Сенсей? Вы ранены?!"
10033010-243 = "О нет, о нет. Сенсей умер?!"
10033010-244 = "И всё потому, что мы попросили о помощи! Это наша вина!"
10033010-245 = "[s3] «Нет-нет. Проблема не в ВАС, студентах.»\n[s4] «Мы как-нибудь через это пройдём!»"
10033010-248 = "Как по-взрослому! Они восстали из пепла, словно феникс!"
10033010-249 = "[ns] «Будем двигаться шаг за шагом. Начнём с чего-нибудь простого.»"
10033010-250 = "Но с чего именно?"
10033010-251 = ""
10033010-254 = "Может быть... с бумажной работы? Обычно этим занимаюсь я, когда босс здесь..."
10033010-255 = "Как мудро, Сенсей. Начну со списка всех документов, которые нам понадобятся!"
10033010-256 = "Так... Планирование бюджета, деловые предложения, маршруты, планы питания, соглашения о неконкуренции... Ах, и отказы от ответственности!"
10033010-257 = "Неплохое начало! А я займусь передачей коммерческих прав клуба Инь-Ян Отделу организации фестивалей."
10033010-258 = "Да! По крайней мере, мы уже хоть куда-то движемся."
10033010-259 = "Чем я могу помочь...? Хм... Ах! Я сообщу Торговому комплексу, что академия Геенны приезжает на экскурсию, и помогу им подготовить акции и всё остальное!"
10033010-260 = "Сенсей, Сенсей, теперь я! Что нам с Цубаки делать? Погодите, дайте хорошенько подумать... Клуб внутренней дисциплины отвечает за обычные патрули... значит, мы очень хорошо знаем Хяккияко..."
10033010-261 = "...Маршрут! Вы правы, Сенсей! Мы можем подобрать достопримечательности и интересные места, которые студенты Геенны смогут посетить во время поездки."
10033010-263 = "Задание принято! Цубаки, просыпайся, просыпайся! Наш звёздный час настал."
10033010-264 = "*зевает* Но моя тренировка сна..."
10033010-265 = "Сейчас не до тренировок, Цубаки! Открой глаза и посмотри! Сенсей здесь, значит, наверняка случится что-нибудь супер-весёлое и потрясающее!"
10033010-267 = "Все..."
10033010-268 = "[ns5] «Главное — маленькие шаги.»\n[ns6] «Просто делайте то, что умеете.»"
10033010-271 = "Вы вот так просто составили план, Сенсей! Вы очень хорошо приспосабливаетесь, да?"
10033010-272 = "...Такова специфика вашей работы в Шале? Похоже, там есть о чём поговорить подробнее..."
10033010-273 = "..."
10033010-274 = "Все правы. Мы не можем замереть только потому, что босса здесь нет. Мы тоже способны действовать самостоятельно!"
10033010-275 = "Если я вообще ничего не сделаю, это будет ещё большим пятном на репутации Отдела организации фестивалей. Мы хотя бы должны попытаться."
10033010-276 = "Ура! Мне нравится, когда Умика улыбается!"
10033010-277 = "Нам просто нужно выложиться на полную!"
10033010-279 = "Все... Сенсей..."
10033010-281 = ""
10033010-283 = ""
10033010-284 = "Вы меня убедили."
10033010-285 = "Мне всё ещё немного страшно действовать вот так самостоятельно, но нужно просто делать всё, что в наших силах! Не стараться изо всех сил было бы хуже всего."
10033010-286 = "Я вложу в это все силы, так что даже не будет чувствоваться, что босса здесь нет."
10033010-287 = "И мы превратим эту экскурсию Геенны... в лучший фестиваль в истории Хяккияко!"
10033010-288 = ""
10033010-291 = ""
10033010-292 = "(Не хочется никого разочаровывать...)"
10033010-293 = ""
10033010-294 = "(...потому что Умика теперь так воодушевлена...)"
10033010-296 = "[ns] «(Но разве экскурсия... это фестиваль?)»"
10033010-297 = "Хр-р."
