[translation]
63060-1 = "Эпизод 6;Со дна"
63060-3 = "Ты... Джомаэ Саори? Я много слышала твоё имя, особенно как лидера Отряда Ариус. Мы обе первокурсницы, так что давай вместе постараемся выполнить нашу миссию."
63060-4 = "Какэхаси Субару, верно? Меня проинформировали."
63060-5 = "Что это?"
63060-6 = "..."
63060-7 = "Это был тот самый день."
63060-8 = "День, когда я впервые встретила Джомаэ Саори на задании."
63060-9 = "Тогда мы обе были первокурсницами."
63060-10 = "...Она показалась мне холодной и неприступной ровесницей."
63060-11 = "Может, перед началом операции ещё раз пройдёмся по плану?"
63060-12 = "Вот. Я уже всё закончила. Ознакомься."
63060-13 = ""
63060-16 = "...Хорошо?"
63060-17 = "Есть проблема?"
63060-18 = "Разве не стоит сначала повторить основы, прежде чем переходить к каким-то планам?"
63060-19 = "Ну, знаешь: раскрыть сильные и слабые стороны, специализации, порядок действий..."
63060-20 = "Слушай, если не уверена, что сможешь за мной поспеть, иди домой. Я и одна справлюсь."
63060-21 = "...Ты всегда такая? Даже с Отрядом?"
63060-22 = "Нет, с Отрядом — нет. Все знают свои роли."
63060-23 = "Ты сейчас хочешь сказать, что проявляешь «заботу»?"
63060-24 = "Именно."
63060-25 = "...Понятно."
63060-33 = "Объяснись, Саори!"
63060-34 = "Объяснять нечего. Я сделала всё необходимое для выполнения задания."
63060-35 = "Для Джомаэ Саори всё, что находилось за пределами Отряда, казалось несущественным."
63060-36 = "Когда ей приходилось работать с кем-то ещё, это вызывало у неё раздражение и дискомфорт."
63060-37 = "...Я была одной из немногих — а может, единственной — кто мог её терпеть."
63060-38 = "«Необходимо» было использовать меня как приманку и накрыть целым артиллерийским залпом?!"
63060-39 = "Хотя бы ПОПЫТАЙСЯ вести себя так, будто у тебя есть мозги! На втором курсе такое уже не прокатит!"
63060-40 = "Это был самый быстрый способ выполнить задание."
63060-41 = "Главные достоинства операции — сила, победа и скорость исполнения. Провал — грех."
63060-42 = "...То есть всё остальное для тебя просто сопутствующий ущерб?"
63060-43 = ""
63060-46 = "Похоже, мы наконец начали понимать друг друга."
63060-47 = "Я НЕ это имела в виду!"
63060-48 = ""
63060-49 = "Саори? Тебя... не повысили?"
63060-50 = "Хм? А... это. Так уж вышло."
63060-51 = "Оглядываясь назад, думаю, Мадам с самого начала именно этого и хотела."
63060-52 = "Для Мадам всё, кроме Отряда... Нет, всё, кроме Хакари Ацуко, было лишь инструментом."
63060-53 = "Наверное, она хотела так или иначе использовать Саори как рычаг давления."
63060-54 = "...И почему-то это разозлило меня сильнее, чем я ожидала."
63060-55 = "Так я чувствовала себя каждый раз, когда видела страдания детей Ариуса."
63060-56 = "Тебя это не волнует? Ты не хочешь перейти на третий курс?!"
63060-57 = "А какая разница? Второй я курс или третий?"
63060-58 = "По крайней мере, ещё год я буду лидером Отряда. В этом тоже есть плюсы."
63060-59 = "...У тебя и правда всё крутится вокруг Отряда, Саори."
63060-60 = "А что в этом плохого?"
63060-61 = "Ничего. Ладно, тогда я пойду вперёд и буду наслаждаться жизнью единственной старшекурсницы. Удачи тебе."
63060-62 = "Насчёт этого..."
63060-63 = "...Да?"
63060-64 = "Младшие, похоже, больше полагаются на тебя, Субару."
63060-65 = "...Спасибо."
63060-66 = "Вот именно. Это заставило меня понять, что я никогда не смогла бы занять ту роль, которую взяла на себя ты."
63060-67 = "Думаю, мне больше подходит роль инструктора."
63060-68 = "...То есть я должна присматривать за всеми студентами после того, как ты сломаешь их на тренировках?"
63060-69 = "Ты всегда быстро понимаешь, к чему я веду. Спасибо."
63060-70 = "Нет! Ты вообще НЕ понимаешь, к чему веду Я!!"
63060-72 = "И всё же... если подумать..."
63060-73 = "В какой бы ситуации ни оказалась Джомаэ Саори, она никогда не менялась."
63060-74 = "Я думала, она просто на это неспособна."
63060-75 = ""
63060-76 = ""
63060-95 = "[ns] «Ты уже проснулась?»"
63060-96 = ""
63060-97 = "Где... я?"
63060-98 = "[s] «В месте, которое ты называла „Porta Pacis“»."
63060-99 = "Значит, мы никуда не уходили."
63060-100 = "..."
63060-101 = "Сколько я была без сознания?"
63060-102 = "[s] «Около десяти секунд?»"
63060-103 = "Понятно."
63060-104 = "...Всё закончилось, Сенсей?"
63060-105 = "[s] «Вообще-то, кажется, это мне следует спросить»."
63060-106 = "Понятно..."
63060-107 = "То есть... вы хотите понять, какая из меня настоящая?"
63060-108 = "..."
63060-109 = ""
63060-113 = "Эм..."
63060-114 = "Думаю..."
63060-115 = "...всё закончено."
63060-116 = "Да. Всё... закончилось."
63060-117 = "Я..."
63060-118 = "В конце концов я ничего не смогла сделать..."
63060-119 = "Я насильно навязывала всем свои упрямые идеалы."
63060-120 = "И после всего этого..."
63060-121 = "*всхлипывает*"
63060-122 = "Всхлипы Субару были неровными и рваными."
63060-123 = "Я огляделся, а затем сел рядом с ней."
63060-124 = ""
63060-129 = "Я решил подождать, пока она перестанет плакать."
63060-132 = "...Почему вы ничего не говорите?"
63060-133 = "Не знаете, что сказать...?"
63060-134 = "Вообще-то это моя реплика."
63060-135 = "[s] «Больно, да?»"
63060-136 = "..."
63060-137 = "Что... я вообще пыталась сделать?"
63060-138 = "[s] «Ты пыталась защитить Ариус»."
63060-139 = "И посмотрите, чем всё закончилось."
63060-140 = "..."
63060-141 = "Всё кончено, Сенсей. Всё было напрасно."
63060-142 = "Я думала, что обязана хоть что-нибудь сделать, поэтому хваталась за всё, что могла... И вот результат всех этих стараний."
63060-143 = "Я делала это ради детей, которых мир оставил избитыми и сломленными, тех, кому некуда было идти, и, наверное... ради себя тоже."
63060-144 = "Я не хотела просто бесцельно плыть по жизни."
63060-145 = "Хотя в итоге... это всё пустые слова."
63060-146 = "Если бы я знала, что всё кончится так, то, наверное, вообще ничего бы не делала."
63060-147 = "[s1] «Нет, это неправда.»\n[s2] «В том, чтобы стараться изо всех сил, есть смысл.»"
63060-150 = "...Даже когда результат вот такой?"
63060-151 = "И даже если мои намерения не были чистыми?"
63060-152 = "Я строила перед детьми уверенный вид, делая вид, что знаю путь вперёд."
63060-153 = "К сожалению, Саори была права. Я понятия не имела, куда иду."
63060-154 = "Я хвасталась, что мы будем делать всё по-ариусски, но в итоге... это были пустые слова."
63060-155 = "[s3] «Но благодаря этому опыту ты кое-чему научилась, верно?»\n[s4] «Ученики имеют право на то, чтобы их оценивали за старания, а не за результат.»"
63060-158 = "...То есть мне не нужно беспокоиться об ужасной реальности, где меня судят по результатам поступков, пока я не стану взрослой?"
63060-159 = "..."
63060-160 = "Говорить, что я студент, и прятаться за своей неопытностью — недостаточное оправдание, чтобы меня простили."
63060-161 = ""
63060-163 = ""
63060-164 = "...Если я буду помнить об этом, всё будет нормально?"
63060-165 = "..."
63060-166 = "Но всё же..."
63060-167 = "Что вообще изменится для тех, кто уже на самом дне?"
63060-168 = "Мы всё равно будем продолжать так жить и однажды исчезнем."
63060-169 = "Сколько мусор ни полируй, драгоценным камнем он не станет."
63060-170 = "..."
63060-171 = "Не давайте нам надежду на мечты, которых мы никогда не достигнем. Это ещё более жалкое существование, чем то, что у нас сейчас."
63060-172 = "Проповедовать, что всё обязательно наладится, если «очень сильно стараться», довольно безответственно, не так ли?"
63060-173 = "[s5] «Ты права, в этом есть доля истины.»\n[s6] «Иногда никакими усилиями уже ничего не исправить.»\n[s7] «Можно потерпеть неудачу или даже всё ухудшить.»"
63060-174 = ""
63060-175 = ""
63060-176 = ""
63060-179 = "[ns8] «Но знаешь, если ты действительно достигла самого дна...»\n[ns9] «...то двигаться можно только вверх, верно?»"
63060-182 = "...Вы серьёзно решили именно так меня подбодрить?"
63060-184 = "Иногда это действительно всё, что можно сказать."
63060-185 = ""
63060-187 = ""
63060-188 = "Саори...?"
63060-189 = ""
63060-191 = ""
63060-193 = "Ага."
63060-194 = "Потому что мы и правда уже на самом дне."
63060-195 = "Разве нет, Субару?"
63060-196 = "Ниже падать некуда и бежать больше некуда. Что бы ни произошло, придётся довести всё до конца."
63060-197 = "...То есть каждый день и так был худшим, так что уже без разницы."
63060-198 = "Хех, хи-хи... Думаю, ниже дна наверняка тоже что-то есть..."
63060-199 = "Если так случится, скажем, что просто спустились посмотреть подвал, верно...?"
63060-200 = "...Вы все действительно превратились в дурочек. Весь Отряд."
63060-201 = "Но если хочешь выжить снаружи, придётся перенять такой образ мышления."
63060-202 = "...Иначе бы мы не выжили."
63060-203 = "Иногда ничего не имеет значения, кроме того, чтобы продолжать идти вперёд... Тогда мы просто цепляемся за любую причину и используем её, чтобы идти дальше. Хех. Хи-хи..."
63060-204 = "Верно. Тогда пойдём все вместе."
63060-205 = "Не потому, что считаем, будто если держаться вместе, всё закончится прекрасным сказочным финалом."
63060-206 = "Просто... похоже, мы, дети Ариуса, вообще ничего не умеем делать поодиночке."
63060-207 = "Разве не так?"
63060-208 = ""
63060-212 = ""
63060-213 = ""
63060-214 = ""
63060-215 = ""
63060-216 = "Давай, Субару. Пора вставать."
63060-217 = "Одежда испачкается, если будешь и дальше лежать."
63060-218 = ""
63060-221 = ""
63060-222 = "..."
63060-223 = ""
63060-225 = ""
63060-227 = "Мне кажется, физически невозможно испачкать её ещё сильнее."
63060-228 = "Ну, давай хотя бы постараемся не сделать хуже."
63060-229 = "..."
63060-230 = "Да. Давай."
63060-247 = ""
63060-248 = "Капитан?!"
63060-249 = "Капитан! Уааа! Вы не представляете, как я волновалась!!"
63060-250 = "Сэрина? Ханаэ? Это место... Мы в лазарете Рыцарей исправительного курса?"
63060-251 = "..."
63060-252 = "Сколько дней осталось до пробных экзаменов Тринити?!"
63060-253 = "Хм? К-Капитан? То есть это тоже важно, но, может, сначала займёмся вашим здоровьем..."
63060-254 = "Нет! Это безусловно важнее!"
63060-255 = "Я не позволю другим клубам и студентам смотреть на Рыцарей исправительного курса свысока!"
63060-256 = "..."
63060-257 = "Да, Капитан! Поняла!"
63060-258 = "..."
63060-259 = "Вы правы, Капитан. Время у нас ещё есть, так что сделаем всё возможное для подготовки."
63060-260 = "Все в порядке, верно?"
63060-262 = "Да!"
63060-264 = "Следующий Эпизод;Попытка"
