[translation]
13090-1 = "Episódio 9;O Conselho Estudantil de Abydos (2)"
13090-2 = "Deserto de Abydos — Área Restrita, Setor 35-9"
13090-5 = "Yume-senpai, não tem nada aqui."
13090-10 = "...Parece que aqui também não deu em nada, ugh."
13090-15 = "Desculpa, Hoshino-chan.#nAcho que eu cheguei ao meu limite..."
13090-19 = "...Deixa disso, levante-se."
13090-20 = "Pode me deixar para trás... Obrigada por tudo até hoje, Hoshino-chan."
13090-24 = "Ah, fala sério!#nQue teatro é esse?!"
13090-30 = "Hehe. Desculpa, Hoshino-chan, era brincadeira.#nTalvez tenha alguma coisa na próxima estação, vamos lá ver?"
13090-31 = "...Haa..."
13090-32 = "Acho que vai ser a mesma coisa em todo lugar."
13090-33 = "Mesmo que houvesse alguma peça valiosa em exposição, o Conselho Estudantil anterior já teria vendido há muito tempo."
13090-34 = "Hmm..."
13090-35 = "Vamos voltar logo.#nEssa caça ao tesouro é pura perda de tempo."
13090-36 = "Quê?!"
13090-37 = "Mas você também estava super animada no começo, né, Hoshino-chan?"
13090-38 = "I-Isso foi...!"
13090-39 = "...Aliás, Senpai.#nVocê deixou cair o seu caderno."
13090-40 = "O-Obrigada!"
13090-45 = "Que alívio~.#nQuase perdi o caderno tão precioso da Hoshino-chan."
13090-47 = "...Desde quando esse caderno é meu?"
13090-49 = "E-Er..."
13090-53 = "Olha só, Hoshino-chan! Um cantil em formato de mochila!#nNão parece super prático?"
13090-54 = "Não. Na verdade, isso só atrapalharia na hora de se mover.#nAlém disso, parece caro demais para uma qualidade tão duvidosa..."
13090-56 = "É-É verdade..."
13090-60 = "Talvez seja caro demais mesmo."
13090-61 = "Em vez de gastar dinheiro com isso, não é melhor repor a nossa munição?"
13090-62 = "...Você tem razão."
13090-63 = "Tem uma coisa que eu queria perguntar..."
13090-64 = "O que foi?"
13090-65 = "Como você virou Presidente do Conselho Estudantil, Senpai?#nNunca ouvi falar de um conselho com uma única integrante."
13090-66 = "...Ahaha. Imaginei que você fosse ficar curiosa.#nNa verdade, não teve uma eleição de verdade."
13090-67 = "S-Sério?"
13090-68 = "Eles me elegeram presidente por votação de mãos levantadas,#ne depois todos os antigos membros simplesmente sumiram."
13090-69 = "Daquele jeito...?!"
13090-70 = "...Naquela época, Abydos já não estava mais em condições normais."
13090-71 = "Então empurraram todo esse abacaxi para cima de você, Yume-senpai."
13090-72 = "Não foi bem assim, Hoshino-chan."
13090-76 = "Eu aceitei porque quis."
13090-78 = "...Por quê?"
13090-79 = "Porque achei que, com a autoridade de Presidente do Conselho Estudantil,#neu talvez conseguisse proteger Abydos."
13090-83 = "Só que, quando virei presidente de verdade, vi que não era bem assim."
13090-84 = "Mas... com isto aqui, vai ficar tudo bem!"
13090-85 = "...O que é isso?"
13090-89 = "Tcharam! É o Caderno da Presidente do Conselho Estudantil!"
13090-94 = "Por mais que não pareça, eu escrevo nele direitinho todo dia!"
13090-95 = "Isso não é só um caderno escolar comum que vende em qualquer lugar...?"
13090-96 = "N-Não é um caderno escolar, é o Caderno da Presidente do Conselho Estudantil!#nBem, é quase um diário meu, na verdade..."
13090-100 = "E um dia, vou passar ele para você, Hoshino-chan!"
13090-102 = "Esse futuro nunca vai chegar."
13090-103 = "P-Por quê?!"
13090-104 = "Ah, é mesmo, né.#nVocê nem faz parte do Conselho Estudantil, Hoshino-chan..."
13090-105 = "Você já recusou tantas vezes,#nmas como está sempre comigo, eu acabei me enganando..."
13090-107 = "N-Não... não é isso!!"
13090-111 = "...É que esse caderno é cafona demais."
13090-112 = "Ué, é mesmo?#nEu acho tão bonitinho..."
13090-113 = "Onde que isso é bonito?!"
13090-114 = "Ah, entendi.#nVocê gosta mesmo é de peixinhos, né, Hoshino-chan?"
13090-115 = "D-Do que você está falando?"
13090-116 = "Outro dia você ficou olhando um tempão para aquele caderno fofinho de baleia, não ficou?#nSeus olhos estavam até brilhando, Hoshino-chan."
13090-117 = "É impressão sua!#nE além disso, baleia não é peixe!"
13090-118 = "Hehe, eu sabia que você gostava."
13090-123 = "Não quero mais falar com você, Senpai!"
13090-133 = "Senpai?"
13090-134 = "..."
13090-138 = "Yume-senpai!"
13090-142 = "...Ah, desculpa."
13090-143 = "O que você está fazendo?#nVamos achar logo isso e voltar."
13090-144 = "...Olha, Hoshino-chan."
13090-145 = "As estrelas ficam tão lindas à noite em Abydos, né?"
13090-146 = "É porque não tem nada por perto."
13090-147 = "Será que é só por isso...?"
13090-148 = "Aliás, olhe para o chão em vez de ficar olhando para as estrelas!#nÉ por isso que nunca achamos o que perderam!"
13090-149 = "Deveria estar por aqui, não é?#nAh, céus... Por que você foi aceitar um pedido tão trabalhoso...?"
13090-151 = "Porque... não consigo ignorar alguém em apuros."
13090-156 = "Ué...?"
13090-157 = "O vento mudou de repente..."
13090-162 = "H-Hoshino-chan, vamos voltar rápido! É uma tempestade de areia!"
13090-163 = "A trilha já sumiu... Ué, onde foi que eu guardei a bússola...?"
13090-167 = "...Buaá, parece que eu esqueci de novo."
13090-169 = "Eu te avisei tantas vezes para não esquecer...!#nVocê sabe muito bem que se vier uma tempestade de areia, a gente se perde aqui!"
13090-170 = "Ugh, desculpa..."
13090-171 = "Haa, sinceramente... Ainda bem que eu trouxe uma por precaução."
13090-172 = "Uau, essa é a minha Hoshino-chan!#nNão tem nada melhor do que ter uma caloura confiável!"
13090-173 = "Pare de falar besteira e vamos logo!"
13090-185 = "Nem o Sensei nem a Hoshino-senpai atendem.#nAté quando vão fazer a gente esperar?"
13090-189 = "Serika-chan, você pode me passar aquela ferramenta ali?"
13090-195 = "A Nonomi-senpai e a Shiroko-senpai também sumiram por aí."
13090-200 = "Serika-chan, o martelo também, por favor."
13090-204 = "O que será que aconteceu entre a Presidente do Conselho Estudantil e a Hoshino-senpai...?"
13090-205 = "...Isso, só a própria senpai sabe."
13090-206 = "Haa... Mas não parece que ela vai contar para a gente."
13090-212 = "É verdade..."
13090-217 = "...Pronto, terminei."
13090-218 = "Suas costas estão bem?"
13090-219 = "Sim, estão.#nAlém disso, nessas horas, manter as mãos ocupadas ajuda a acalmar a mente."
13090-220 = "Se você diz..."
13090-224 = "...Ei, Serika-chan."
13090-230 = "Vamos nós duas até a sala do Conselho Estudantil."
13090-231 = "...A sala do Conselho Estudantil? Aquela que vive trancada?"
13090-233 = "Com certeza o segredo da Presidente do Conselho Estudantil está escondido lá."
13090-234 = "Pode até ser, mas... será que tudo bem a gente entrar sem permissão?"
13090-235 = "Como você disse, Serika-chan, podemos acabar levando bronca."
13090-236 = "...Mas não temos mais tempo para ficar esperando a Hoshino-senpai."
13090-237 = "Vamos conferir."
13090-241 = "E-Espera aí, Ayane-chan!"
13090-248 = "...Ufa."
13090-252 = "Ué...?"
13090-253 = "Por que o Amagumo-go está aqui fora?"
13090-254 = "...Será que a Ayane-chan está brava?"
13090-260 = "Hoshino-chan, este é o nosso novo prédio escolar!"
13090-265 = "Novo...? Isso é só o anexo."
13090-268 = "É, bem, isso é verdade..."
13090-269 = "...Agora só sobramos nós duas, né?"
13090-270 = "Esqueça quem foi embora.#nNão adianta nada criar expectativas."
13090-271 = "Não acho certo falar assim.#nAfinal, a culpa é da desertificação, não é?"
13090-272 = "..."
13090-273 = "Deixar o próprio distrito autônomo é doloroso para qualquer um."
13090-274 = "...Mas no fim, todo mundo abandonou Abydos!"
13090-275 = "Todo mundo, não. Você está aqui, Hoshino-chan."
13090-276 = "..."
13090-277 = "E além disso... eu também estou, né?"
13090-278 = "...Senpai."
13090-279 = "Daqui em diante, vamos dar o nosso melhor, nós duas juntas."
13090-280 = "Eu te protejo, Hoshino-chan, e você me protege, combinado?"
13090-281 = "...Preocupe-se apenas consigo mesma, Senpai.#nVocê é fraca."
13090-282 = "N-"
13090-283 = "Não precisava falar desse jeito..."
13090-284 = "Aliás, não é você que é forte demais, Hoshino-chan?"
13090-285 = "...Não.#nEu preciso ficar ainda mais forte."
13090-290 = "E para isso... primeiro, Senpai, fique com isto."
13090-292 = "Hmm...?"
13090-297 = "Você vai entrar para o Conselho Estudantil?!"
13090-298 = "Eba... espera, por quê...?"
13090-299 = "Porque percebi que não faz sentido ficar implicando com isso de Conselho Estudantil."
13090-300 = "...De qualquer forma, eu vou continuar ao seu lado daqui para frente."
13090-301 = "...Ah, mas não vou aceitar aquele caderno cafona."
13090-308 = "Ebaaa! Obrigada, Hoshino-chan!"
13090-309 = "É um sonho...? Não, é um milagre!"
13090-310 = "...Senpai, está me sufocando.#nNão é um sonho, então se me abraçar forte assim eu vou morrer."
13090-311 = "Já sei, vamos tirar uma foto para comemorar!"
13090-312 = "Não precisa de nada disso..."
13090-313 = "Quando a gente comemora,"
13090-318 = "tem que tirar uma foto de recordação!"
13090-323 = "Vamos, Hoshino-chan. Olha direitinho para a câmera!"
13090-324 = "P-Perto demais, Senpai.#n...E-Está encostando."
13090-325 = "Não precisa ter vergonha, chega mais perto!"
13090-326 = "Não, espera, eu não consigo respirar."
13090-327 = "Hehe. Então, digam xis!"
13090-338 = "Esta é a nova sala do Conselho Estudantil!"
13090-342 = "...É apertada."
13090-343 = "Ugh..."
13090-344 = "Mas é aqui que o Conselho Estudantil de Abydos vai renascer hoje!#nPor enquanto somos só nós duas, mas um dia..."
13090-345 = "...Um dia?"
13090-349 = "Ehehe."
13090-350 = "Um dia vão entrar novas calouras e com certeza este lugar vai ficar bem animado!"
13090-387 = "Com licença..."
13090-388 = "E-Espera aí, Ayane-chan."
13090-396 = "Ué..."
13090-397 = "Está mais limpa do que eu imaginava, né?"
13090-398 = "...Sim.#nAcho que alguém andou limpando."
13090-399 = "Será que foi a Hoshino-senpai?"
13090-410 = "Nn..."
13090-416 = "Shiroko-senpai?!"
13090-424 = "Ué...?"
13090-426 = "N-Nonomi-senpai?!"
13090-427 = "...Por acaso foi você quem estava limpando aqui, senpai?"
13090-429 = "Fui sim... mas o que vocês estão fazendo aqui?"
13090-432 = "Vocês também estavam curiosas, né, senpais?"
13090-433 = "Sim... Eu queria saber o que aconteceu com a Presidente do Conselho Estudantil."
13090-434 = "..."
13090-436 = "Ahaha... Quem diria que todas estávamos pensando na mesma coisa."
13090-437 = "Eu só pensei em dar uma limpada..."
13090-438 = "..."
13090-439 = "Bem, no fim das contas é só para aliviar a minha própria consciência."
13090-445 = "Tem alguma coisa ali."
13090-446 = "Armários...?"
13090-448 = "Ah, aquilo é..."
13090-453 = "...Parecem ser os armários pessoais da Presidente do Conselho Estudantil e da Hoshino-senpai."
13090-455 = "O armário da Presidente do Conselho Estudantil está com a porta aberta."
13090-456 = "...Parece que não tem nada dentro."
13090-458 = "Vou abrir o da Hoshino-senpai também."
13090-464 = "Shiroko-senpai?!#nPor que você anda por aí com ferramentas de arrombamento?!"
13090-465 = "...Nn, é só um hobby."
13090-470 = "Ué, parece que nem está trancado."
13090-475 = "Nn..."
13090-476 = "Que alívio... Quase levamos uma bronca da Hoshino-senpai."
13090-478 = "Só de estarmos entrando sem permissão, acho que já vamos levar bronca de qualquer jeito..."
13090-479 = "Tem alguma coisa aí dentro?"
13090-484 = "...Equipamentos."
13090-485 = "Um colete à prova de balas e uma arma secundária..."
13090-486 = "Acho que são da Hoshino-senpai.#nEstão bem gastos, mas muito bem conservados."
13090-487 = "Equipamentos tão impressionantes assim..."
13090-488 = "O que será que a Hoshino-senpai fazia naquela época...?"
13090-498 = "H-Hoshino-senpai?!"
13090-500 = "Uaaah!"
13090-501 = "H-Hoshino-senpai, isto é..."
13090-502 = "...Nn."
13090-508 = "Vocês não podem sair abrindo sem permissão~!"
13090-514 = "Próximo;Aquele Dia"
