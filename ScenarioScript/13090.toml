13090-410 = "Хм..."
13090-411 = ""
13090-414 = ""
13090-415 = ""
13090-416 = "Ого?! Широко?!"
13090-417 = ""
13090-420 = ""
13090-421 = ""
13090-422 = ""
13090-423 = ""
13090-424 = "Постой...? Широко и..."
13090-426 = "...Н-Нономи тоже?!"
13090-427 = "Это... мётлы и щётки? Это ты здесь убиралась?"
