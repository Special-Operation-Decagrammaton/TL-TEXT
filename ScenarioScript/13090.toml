[translation]
13090-1 = "Эпизод 9;Студсовет Абидоса 2"
13090-2 = "Пустыня Абидос, закрытый район, сектор 35-9"
13090-5 = "Здесь ничего нет, Юмэ."
13090-6 = ""
13090-8 = ""
13090-10 = "*вздох* И здесь не повезло? Уа-а-а, ещё одна неудача!"
13090-11 = ""
13090-13 = ""
13090-15 = "Прости, Хошино. Меня раздавили разочарование и отчаяние. Здесь мой путь заканчивается."
13090-16 = ""
13090-18 = ""
13090-19 = "Встань, пожалуйста... Мне за тебя стыдно."
13090-20 = "Я больше не могу! Береги себя, Хошино. Я никогда не забуду всё, что ты для меня сделала."
13090-21 = ""
13090-23 = ""
13090-24 = "Да ПРЕКРАТИ уже?!"
13090-25 = ""
13090-29 = ""
13090-30 = "Пусть сейчас неудача, но, может, в следующий раз? Успех может ждать всего в одной остановке отсюда..."
13090-31 = "Там тоже ничего не будет."
13090-32 = "Куда бы мы ни пошли, всё будет одинаково. Если бы этот «Выставочный зал председателей Абидоса» со всеми ценными сокровищами действительно существовал..."
13090-33 = "...предыдущий студсовет давно бы его нашёл и всё распродал."
13090-34 = "Хм... Наверное, ты права..."
13090-35 = "Пойдём обратно. Это была пустая трата времени. Не стоило так радоваться фантазии об охоте за сокровищами."
13090-36 = "Но ты же сама была в восторге! Когда я рассказала, ты прибежала сюда быстрее всех."
13090-37 = "Ты просто снова включила режим ворчуньи, потому что мы зашли в тупик!"
13090-38 = "Н-Нет... Просто..."
13090-39 = "...В любом случае, ты уронила тетрадь."
13090-40 = "Ах?! Моя тетрадь!"
13090-41 = ""
13090-43 = ""
13090-44 = ""
13090-45 = "Фух! Я чуть не потеряла твою драгоценную тетрадь, Хошино... Едва успела!"
13090-47 = "Не связывай меня с этой тетрадью! И важнее — больше не лежи вот так на полу! Что люди подумают о студсовете, если увидят тебя?!"
13090-49 = "Д-Да, мэм..."
13090-52 = ""
13090-53 = "Смотри, Хошино! Бутылка для воды, которую можно носить как рюкзак! Купить?"
13090-54 = "Ни за что. Она слишком дорогая для такой штуки. И будет мешаться, если придётся быстро двигаться."
13090-56 = "Эх, правда?"
13090-57 = ""
13090-59 = ""
13090-60 = "Ик! 10 000 йен? Д-Да, это дорого..."
13090-61 = "Лучше потратить деньги на боеприпасы. У нас их вечно не хватает."
13090-62 = "Это правда!"
13090-63 = "...У меня вопрос."
13090-64 = "Да?"
13090-65 = "Как ты стала председателем студсовета? Не хочу показаться грубой, но я не слышала ни о каких выборах. Да и ты вообще единственный член студсовета."
13090-66 = "Не переживай, ты совершенно права! Никакой официальной процедуры не было."
13090-67 = "П-Правда?"
13090-68 = "Хи-хи. Видишь ли, перед уходом предыдущий студсовет провёл голосование поднятием рук, и — та-дам! — я стала председателем."
13090-69 = "Что?! Ты стала председателем просто потому, что кто-то поднял руки? Более неформального способа избраться я даже представить не могу!"
13090-70 = "Ага! Думаю, поскольку в Абидосе больше нет нормальной административной инфраструктуры, председателей уже какое-то время выбирают именно так!"
13090-71 = "Этим людям вообще было плевать на работу студсовета. Они просто скинули мёртвый груз на тебя и сбежали?!"
13090-72 = "Нет, Хошино. Всё было совсем не так."
13090-73 = ""
13090-75 = ""
13090-76 = "Я стала председателем не потому, что так было удобно. Я сама этого хотела. Хотела быть председателем."
13090-78 = "П-Правда...?"
13090-79 = "Правда! Я подумала, что смогу лучше защищать Абидос, если у меня будет больше полномочий и ответственности."
13090-80 = ""
13090-82 = ""
13090-83 = "Хотя, теперь когда думаю... Должность председателя не дала мне так уж много власти! Ха-ха-ха!"
13090-84 = "Но я по-своему серьёзно готовилась к этой должности!"
13090-85 = "Готовилась?"
13090-86 = ""
13090-88 = ""
13090-89 = "Та-дам! Официальная тетрадь председателя студсовета Абидоса!"
13090-90 = ""
13090-92 = ""
13090-93 = ""
13090-94 = "Это что был за тяжёлый вздох, Хошино?! Хочешь верь, хочешь нет, я серьёзно! Я веду ежедневный журнал деятельности!"
13090-95 = "Ты хочешь сказать, что эта детская тетрадка за 150 йен — твоя подготовка?"
13090-96 = "Э-Это не просто детская тетрадка! Я же говорила! Это Официальная тетрадь председателя студсовета Абидоса! Хотя сейчас она уже больше похожа на дневник..."
13090-97 = ""
13090-99 = ""
13090-100 = "Н-Не смотри так неодобрительно! Моих чувств это не изменит! И однажды этот драгоценный журнал перейдёт к тебе, Хошино!"
13090-102 = "Ни за что. Даже через миллион лет."
13090-103 = "П-Почему?!"
13090-104 = "Т-Точно... Ты ведь даже официально не состоишь в студсовете... Прости, я зашла слишком далеко..."
13090-105 = "Ты отвергала все мои приглашения вступить в студсовет... но... почему-то я думала, что ты всегда будешь рядом."
13090-107 = "Постой, нет! Я... Я не это имела в виду!"
13090-108 = ""
13090-110 = ""
13090-111 = "Мне просто... не нравится дизайн..."
13090-112 = "Что— Правда?! А мне казалось, он очень милый..."
13090-113 = "...Что вообще милого в банане? У тебя ужасный вкус!"
13090-114 = "Хм! Может, ты просто не любишь всякие модные штуки, Хошино. О! Или дело в том, что это не рыба?"
13090-115 = "А?! Я-я не люблю рыбу! Ты о чём?"
13090-116 = "Я видела, как у тебя глаза заблестели на рынке, когда ты смотрела на тетрадь с китом! Ты не могла оторваться. Знай, Хошино, от меня ничего не ускользает!"
13090-117 = "Ничего подобного! И вообще, киты — не рыбы!"
13090-118 = "Правда? Хм. Но они тебе всё равно кажутся милыми, да?"
13090-119 = ""
13090-121 = ""
13090-123 = "Юмэ!!"
13090-132 = ""
13090-133 = "Нашла?"
13090-134 = "..."
13090-135 = ""
13090-137 = ""
13090-138 = "Юмэ!"
13090-139 = ""
13090-141 = ""
13090-142 = "А. Хошино?"
13090-143 = "Чего зависла? Нужно быстрее найти эту штуку и возвращаться. В этом районе температура резко падает после заката."
13090-144 = "...Угу."
13090-145 = "Посмотри сюда, Хошино. Ночное небо Абидоса... разве оно не невероятно яркое?"
13090-146 = "Потому что мы в глуши. Свет города не мешает смотреть на звёзды."
13090-147 = "Вот как..."
13090-148 = "Вместо звёзд лучше смотри под ноги. Нужно найти потерянную вещь этого человека и вернуться домой."
13090-149 = "Судя по его описанию, она должна быть где-то здесь. Уф. Зачем ты вообще всегда берёшься за такие морочные просьбы?"
13090-151 = "Ну потому что... неправильно отворачиваться от человека, которому нужна помощь, разве нет?"
13090-152 = ""
13090-155 = ""
13090-156 = "А?"
13090-157 = "Ветер усиливается!"
13090-158 = ""
13090-161 = ""
13090-162 = "Хошино! Песчаная буря! Нужно уходить прямо сейчас!"
13090-163 = "Д-Дорога назад... компас... Где...?"
13090-164 = ""
13090-166 = ""
13090-167 = "А?! Я опять забыла компас!"
13090-169 = "Опять?! Я же напоминала его взять! Если заблудимся в пустыне, нам конец!"
13090-170 = "Я знаю... П-Прости."
13090-171 = "Всё нормально. Я так и думала, поэтому взяла свой."
13090-172 = "Ого! Ты лучшая, Хошино! Моя потрясающая, надёжная—"
13090-173 = "Не время для комплиментов! Бежим! Быстро!"
13090-174 = ""
13090-185 = "*вздох* Я правда не могу дозвониться ни до Сенсея, ни до Хошино. Сколько нам ещё здесь ждать?"
13090-186 = ""
13090-189 = "Мм. Передашь сварочный пруток, Сэрика?"
13090-190 = ""
13090-192 = ""
13090-193 = ""
13090-194 = ""
13090-195 = "Нономи и Широко устали ждать и куда-то ушли."
13090-196 = ""
13090-200 = "Молоток, пожалуйста, Сэрика."
13090-201 = ""
13090-203 = ""
13090-204 = "Прежний председатель студсовета... Что с ней произошло?"
13090-205 = "...Интересно."
13090-206 = "Хошино явно не хотела об этом говорить."
13090-207 = ""
13090-212 = "...Угу."
13090-213 = ""
13090-216 = ""
13090-217 = "Угх..."
13090-218 = "Спина болит, Аяне?"
13090-219 = "Всё нормально. В такие моменты занять руки помогает мне привести мысли в порядок."
13090-220 = "Привести мысли в порядок?"
13090-221 = ""
13090-223 = ""
13090-224 = "Сэрика."
13090-225 = ""
13090-227 = ""
13090-228 = ""
13090-230 = "Давай взломаем комнату студсовета."
13090-231 = "А? Ты сейчас говоришь как Широко. Это же класс, который они использовали как склад? Он всегда заперт..."
13090-233 = "Там должны быть ответы о прежнем председателе."
13090-234 = "Наверное... но Хошино может разозлиться. Может, сначала спросим её."
13090-235 = "...Если бы это был обычный склад, его бы не запирали так тщательно."
13090-236 = "Мы считали его личным хранилищем Хошино и не трогали... но если скрывать нечего, зачем держать его запертым."
13090-237 = "...Да. Другого выбора нет. Нужно посмотреть."
13090-238 = ""
13090-240 = ""
13090-241 = "П-Постой! Аяне!"
13090-242 = ""
13090-244 = ""
13090-248 = "*вздох* Ну вот, я пришла."
13090-249 = ""
13090-251 = ""
13090-252 = "А? Почему «Водяное Облако» стоит снаружи?"
13090-253 = "Ой-ой. Аяне, наверное, реально злится."
13090-254 = "Лучше перестать тянуть время, пока не влетело ещё сильнее."
13090-255 = ""
13090-257 = ""
13090-258 = ""
13090-260 = "Мы пришли! Хошино! Это новый Абидос!"
13090-261 = ""
13090-263 = ""
13090-265 = "Можешь продавать это под таким названием, но нас просто вынудили перебраться в один из корпусов Абидоса..."
13090-268 = "Ну, тут ты не ошибаешься..."
13090-269 = "И все остальные студенты ушли! Теперь остались только мы с тобой, Хошино. Последние студенты старшей школы Абидоса!"
13090-270 = "Они всё равно рано или поздно ушли бы. Мне на них плевать."
13090-271 = "Нельзя винить людей, которые просто пытались облегчить свои страдания, Хошино. Виноваты стихийные бедствия!"
13090-272 = "..."
13090-273 = "Представь, как тяжело им было покинуть место, которое они называли домом, некоторые — всю жизнь!"
13090-274 = "Неважно! Ни один человек не решил остаться и защищать Абидос, свой так называемый дом!"
13090-275 = "А ты решила, Хошино."
13090-276 = "..."
13090-277 = "И я тоже здесь! Правда?"
13090-278 = "...Если так говорить, то да."
13090-279 = "Ага! Значит, две последние студенты Абидоса будут прикрывать друг друга! Сильнее, чем когда-либо. Правда, Хошино?"
13090-280 = "Я буду защищать тебя любой ценой! Ты совсем не против получать ранения, но можешь использовать меня как щит—"
13090-281 = "Ни за что. Ты слабее, так что защищать буду я."
13090-282 = "А? Н-Ну, не то чтобы ты ошибалась, но..."
13090-283 = "...просто ты особенно сильная!"
13090-284 = "Старшая должна присматривать за младшей, знаешь ли..."
13090-285 = "Да. Понимаю. Поэтому... ну, мне просто кажется, что нужно стараться сильнее."
13090-286 = ""
13090-288 = ""
13090-289 = ""
13090-290 = "Так что вот. Возьми."
13090-292 = "А? Какой?"
13090-293 = ""
13090-295 = ""
13090-296 = ""
13090-297 = "Заявление на вступление в студсовет?!"
13090-298 = "Ты серьёзно, Хошино? Передумала?!"
13090-299 = "Я не то чтобы передумала... Просто... мне больше некуда бежать."
13090-300 = "Дело не в студсовете. Просто рядом с тобой как-то... естественно."
13090-301 = "Я не вижу другого варианта, кроме как остаться с тобой... но это не значит, что я возьму эту тетрадь!"
13090-302 = ""
13090-304 = ""
13090-308 = "Ого! ОГО! Словами не описать, как я счастлива, Хошино! Я счастлива запредельно!"
13090-309 = "Это сон? Или, может, чудо…? Да! Точно! Это определённо чудо!"
13090-310 = "...Я не могу дышать. Такими темпами умру раньше, чем чудо успеет случиться."
13090-311 = "Постой, точно! Нельзя упустить этот момент! Нужно сфотографироваться! Памятное фото, чтобы навсегда его запомнить!"
13090-312 = "П-Памятное фото? Не думаю, что ситуация настолько торжественная... Юмэ?"
13090-313 = "Ты вообще о чём?! Мы празднуем! Конечно нужно сфотографироваться!"
13090-314 = ""
13090-317 = ""
13090-318 = "Иди сюда, Хошино!"
13090-319 = ""
13090-323 = "Отлично! Теперь смотри туда, Хошино!"
13090-324 = "Близко... Слишком близко! Мы... Мы точно соприкасаемся!"
13090-325 = "Ещё нет! Ближе! Ну же, не стесняйся!"
13090-326 = "Ты меня слишком сильно прижимаешь, Юмэ! Я задохнусь. Отойди!"
13090-327 = "Та-дам!"
13090-328 = ""
13090-332 = ""
13090-334 = ""
13090-338 = "Это наш новый офис студсовета! Ну как, Хошино?"
13090-339 = ""
13090-342 = "...Маленький."
13090-343 = "И правда! Но всё же...!"
13090-344 = "Это новое начало для студсовета Абидоса. Знаю-знаю, сейчас нас всего двое — председатель и вице-президент, но однажды..."
13090-345 = "Однажды?"
13090-346 = ""
13090-349 = "Хи-хи-хи..."
13090-350 = "Однажды всё это место будет забито нашими младшими и другими участницами, правда?"
13090-352 = ""
13090-354 = ""
13090-356 = ""
13090-358 = ""
13090-360 = ""
13090-362 = ""
13090-375 = ""
13090-376 = ""
13090-377 = ""
13090-387 = "Простите?"
13090-388 = "Секунду, Аяне. Этой комнатой никто не пользуется, так что здесь может быть ужасно... пыльно...?"
13090-389 = ""
13090-395 = ""
13090-396 = "А?"
13090-397 = "Ни пылинки... Я думала, здесь будет полный кошмар."
13090-398 = "Ты права. Похоже, за комнатой довольно хорошо ухаживали."
13090-399 = "Думаешь, это Хошино? Но зачем ей поддерживать заброшенную комнату в чистоте?"
13090-400 = ""
13090-404 = ""
13090-405 = ""
