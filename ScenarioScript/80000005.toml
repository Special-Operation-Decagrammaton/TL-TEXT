[translation]
80000005-1 = "Совершенно новый шоколадный мерч!"
80000005-2 = "Временный магазин Momo Friends"
80000005-3 = "Ох... Что же делать? Я не думала, что они ограничат, кто может покупать новые товары с Пероро."
80000005-4 = "Просить кого-то из друзей приехать из школы уже поздно.#nА вдруг всё распродадут, пока они доберутся?"
80000005-5 = "[s] «Эй, Хифуми. Что-то случилось?»"
80000005-6 = "Сенсей! Вы как раз вовремя."
80000005-7 = "Эм, только сегодня..."
80000005-8 = "...мы можем притвориться парой?"
80000005-9 = "Не то чтобы я, ну... Просто... ты единственный, на кого я могу положиться..."
80000005-10 = "[s1] «А, понимаю. Теперь ясно, в чём дело.»\n[s2] «Тебе нужна моя помощь, чтобы раздобыть товар только для парочек?»"
80000005-11 = "Ага... Ты меня раскусил."
80000005-12 = "Ага... Ты меня раскусил."
80000005-13 = "Ко Дню святого Валентина выпустили новые товары с Пероро,#nно я только сейчас узнала, что они доступны только парам..."
80000005-14 = "Ты понял всё ещё до того, как мне пришлось объяснять.#nПотрясающе."
80000005-15 = "[s] «Я же знаю свою Хифуми.»"
80000005-16 = "Хи-хи. Наверное, да. Мы ведь уже давно знакомы..."
80000005-17 = "Постой! У нас нет времени вот так стоять!#nТовары суперлимитированные, если не поторопимся — всё раскупят!"
80000005-18 = ""
80000005-20 = ""
80000005-23 = "Мы с Хифуми купили во временном магазине шоколад с Пероро, который продавали только парам."
80000005-26 = "Есть! Мы достали лимитированный шоколад с Пероро!"
80000005-27 = "Едва успели. Нам достались последние."
80000005-28 = "Без тебя я бы его не получила.#nОгромное спасибо, Сенсей!"
80000005-29 = "Ой, мне нужна была только одна шоколадка, но нам дали две."
80000005-30 = "Наверное, потому что набор рассчитан на пару."
80000005-31 = ""
80000005-33 = ""
80000005-34 = ""
80000005-35 = "Вот, Сенсей. Возьми вторую."
80000005-36 = "[s] «Ты уверена? Она всё-таки лимитированная.»"
80000005-37 = "Свою я смогла получить только благодаря тебе."
80000005-38 = "К тому же... сегодня День святого Валентина, и я хочу, чтобы она была у тебя."
80000005-39 = "Надеюсь, тебе понравится!"
