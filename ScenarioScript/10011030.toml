[translation]
10011030-1 = "Эпизод 3;Когда я говорю «ниндзя», вы говорите «принцесса»!"
10011030-2 = "За тридцать минут до начала представления..."
10011030-3 = "[ns] «Так вот как выглядит закулисье.»"
10011030-4 = ""
10011030-8 = "Я немного нервничаю!"
10011030-9 = "Я тоже! Сердце колотится как сумасшедшее!"
10011030-11 = "Ва-ха-ха! Чего вы все так нервничаете? Мы более чем способны выполнить эту миссию."
10011030-12 = "Д-Да! И, эм... Сенсей. Спасибо, что устроили всё это для нас."
10011030-13 = "Верно сказано! Господин... Вы подготовили сцену, на которой Исследовательский клуб ниндзюцу наконец сможет засиять!"
10011030-14 = "[s1] «Я просто попросил клуб Инь-Ян помочь, потому что Мичиру не может заполнить заявку.»\n[s2] «Похоже, по какой-то причине Мичиру не смогла подать официальную заявку на клуб.»"
10011030-17 = "Уф! Это...!"
10011030-18 = "Это не... Вы такой...!"
10011030-19 = "Неважно! Я покажу своё лучшее выступление ниндзя прямо здесь и сейчас!"
10011030-20 = "Конец! Миссия выполнена!"
10011030-21 = "П-Поняла! Я постараюсь быть в-выдающимся ниндзя!"
10011030-22 = "Я вся в деле! Нин-нин!"
10011030-23 = "[s] «Вы и правда любите ниндзя.»"
10011030-24 = "А зачем, по-вашему, мы создали Исследовательский клуб ниндзюцу? Потому что любим щеночков?"
10011030-25 = "Я правда их люблю! Не могу дождаться, когда стану полноценным ниндзя!"
10011030-26 = "То есть я, конечно, пока совсем мало знаю о ниндзя..."
10011030-27 = "Не переживай, юный кузнечик. Ниндзя — круче всех крутых, так что скоро втянёшься!"
10011030-28 = "Именно поэтому я хочу распространять культуру ниндзя по Кивотосу. В этом весь смысл моего видеоканала."
10011030-29 = "[s] «Довольно амбициозно.»"
10011030-30 = "Знаю. Подписчиков пока немного, но если продолжим стараться, люди обязательно увидят красоту ниндзя!"
10011030-31 = "Почему, спросите вы, мы не сдаёмся?"
10011030-32 = "Потому что никогда не сдаваться..."
10011030-33 = "Это путь ниндзя! Нин-нин!"
10011030-34 = "[s] «Расскажи подробнее о представлении принцессы Вараку.»"
10011030-35 = "«Принцесса Вараку» — интерактивное представление и одна из главных достопримечательностей кинодеревни."
10011030-38 = ""
10011030-39 = "История примерно такая: Чисэ — принцесса из знатной семьи."
10011030-40 = ""
10011030-42 = ""
10011030-43 = "Но однажды её похищает заговорщицкая группа, желающая заполучить власть её семьи."
10011030-44 = ""
10011030-46 = ""
10011030-47 = "И в этот опасный момент зрители..."
10011030-49 = ""
10011030-51 = ""
10011030-53 = ""
10011030-55 = "...внезапно становятся главными героями! Им нужно преодолеть серию препятствий и спасти принцессу."
10011030-57 = "Сюжет может показаться банальным, но главное — самому стать героем истории, проходить препятствия и испытывать азарт спасения принцессы."
10011030-58 = "А зрители ещё и соревнуются, кто первым её спасёт!"
10011030-59 = "И всё это вместе создаёт идеальное интерактивное представление!"
10011030-60 = "Я-я раньше видела его только в трансляции..."
10011030-61 = "Не верится, что в этот раз я смогу участвовать!"
10011030-62 = "Хе-хе. Соврала бы, если сказала, что меня не радует такая возможность."
10011030-63 = "Погодите-ка! Принцессу играет сама Чисэ!"
10011030-64 = "К-Как думаете, получится попросить у неё автограф?!"
10011030-65 = "Президент, как находчиво. В-Воспользоваться этой возможностью, чтобы наконец исполнить желание всей жизни!"
10011030-66 = "Вы и правда настоящий ниндзя...! Ого!"
10011030-67 = "...?"
10011030-68 = "Цукуё... Это был комплимент?"
10011030-69 = "Ну, в любом случае, КОНЕЧНО я попрошу автограф Чисэ, если получится!"
10011030-70 = ""
10011030-73 = ""
10011030-75 = "Помощники, приготовьтесь."
10011030-76 = "Актёрский состав скоро прибудет."
10011030-77 = ""
10011030-79 = ""
10011030-80 = "[ns] «О-о, наконец начинается.»"
10011030-82 = ""
10011030-85 = ""
10011030-86 = "Т-Чисэ...! Я ваша с-с-самая большая п-п-поклонница!"
10011030-87 = ""
10011030-88 = "Хорошо-хорошо! Ибуки! Постарается изо всех сил!"
10011030-90 = "...Что?"
10011030-91 = "Разве это не... студент Генны?"
10011030-93 = "Ха-ха. Председатель Макото, спасибо за ваше активное участие в подготовке этой встречи обмена."
10011030-95 = "Ки-хе-хе-хе-хе! Благодарности излишни!"
10011030-96 = "На самом деле это я должна вас благодарить."
10011030-97 = "Эта встреча раз и навсегда докажет, что академия Генна СПОСОБНА устраивать весёлые мероприятия."
10011030-98 = "И не только это... Она докажет, что единственный человек, обладающий влиянием! Весом! Видением, чтобы устроить событие всей жизни..."
10011030-99 = "...Это я и только я! Великая Макото! Ки-хе-хе-хе-хе!"
10011030-100 = "Бу-ха-ха! Обожаю вашу энергию! У меня есть небольшое предложение, которому ваше замечательное влияние могло бы помочь."
10011030-101 = "Хотите услышать?"
10011030-102 = "О?"
10011030-104 = "Они вот так просто сменили главную звезду?"
10011030-105 = "О чём они думали? Разве это представление не должно было быть очень важным?"
10011030-106 = "Что? Ибуки не должна быть принцессой?"
10011030-107 = "И-Ибуки что-то не так сделала?"
10011030-108 = "[s] «Нет, Ибуки. Ты ничего плохого не сделала.»"
10011030-109 = ""
10011030-111 = ""
10011030-113 = ""
10011030-115 = "Вааааа?!"
10011030-116 = "Свет! Это вражеская засада?"
10011030-117 = "[s] «Всё будет хорошо. Наверное, просто отключили электричество.»"
10011030-119 = "Ва..."
10011030-120 = "Уа-а...?"
10011030-121 = "Уа-а-а-а...! Куда делся свет? Ибуки это совсем не нравится!"
10011030-122 = "Ибуки в беде? Это вина Ибуки? Ибуки ничего не видит..."
10011030-123 = "Ироха... Макото... *всхлип*"
10011030-125 = "(Чёрт! Ситуация плохая!)"
10011030-126 = "(Е-Если у неё случится истерика и она сорвёт представление, наша миссия провалится!)"
10011030-127 = "(Это тоже часть пути ниндзя! Мне нужно её успокоить.)"
10011030-129 = "Не переживай, маленькая Ибуки! Ты ни в чём не виновата. Правда, достопочтенный Сенсей?"
10011030-130 = "[s] «Ага. Просто небольшая заминка.»"
10011030-131 = "*шмыг* А...? З-Заминка...?"
10011030-132 = "Заминка ведь не страшная, правда? И достопочтенный Сенсей тоже здесь, так что ты в безопасности!"
10011030-133 = "Правда... Сенсей друг Ибуки, но... а ты кто?"
10011030-135 = "Изуна и Цукуё! И наш президент! Троица из трёх!"
10011030-136 = ""
10011030-141 = "А мы — Исследовательский клуб ниндзюцу! Наша мечта — стать лучшими ниндзя всех времён!"
10011030-143 = "...Ниндзя?"
10011030-144 = "Ну, вообще ниндзя — это скорее метафора..."
10011030-145 = "В-Вы врёте? Вы не ниндзя?"
10011030-146 = "Что? Нет! Хватит додумывать!"
10011030-147 = "К-Конечно не врём!"
10011030-148 = ""
10011030-150 = ""
10011030-151 = "Наша мечта — стать лучшими ниндзя...! А ниндзя крутые и сильные!"
10011030-152 = "Так что бояться нечего, студент Генны... Ибуки."
10011030-153 = "Что бы страшного ни произошло, Исследовательский клуб ниндзюцу..."
10011030-154 = "...Мы, ниндзя, защитим нашу принцессу Ибуки! Правда, президент?"
10011030-155 = "[s] «Ниндзя вообще защищают принцесс?»"
10011030-157 = "Достопочтенный Сенсей?! Хватит придираться к формулировкам!"
10011030-158 = "*всхлипывает*"
10011030-159 = "Не отвлекайте меня, Сенсей! Мы защитим тебя несмотря ни на что, Ибуки!"
10011030-160 = "Уа-а... Г-Где Ироха..."
10011030-161 = "Хм, словами её не успокоить. Но мы не можем провалить миссию ниндзя."
10011030-162 = ""
10011030-164 = ""
10011030-165 = "Придумала!"
10011030-166 = ""
10011030-168 = ""
10011030-169 = "Вот! Если тебе страшно, это тебя защитит!"
10011030-170 = "[s] «...Новый товар с ниндзя?»"
10011030-171 = ""
10011030-173 = ""
10011030-174 = ""
10011030-177 = ""
10011030-178 = "...Ого!"
10011030-180 = "(Да! Сработало!)"
10011030-183 = "Что это? Ибуки хочет знать!"
10011030-184 = "Так ты тоже ценишь крутость ниндзя!"
10011030-185 = "Только не слишком возбуждайся! Это Нинперо, звезда «Ниндзя Нинперо»!"
10011030-186 = "Он сильнейший из сильнейших и побеждает любое зло, осмелившееся встать у него на пути!"
10011030-187 = "Ба-ха-ха! Какой смешной! Ибуки хочет оторвать крылья!"
10011030-188 = "Эй! Это лимитированный плюш, за которым я три часа стояла в очереди!"
10011030-189 = ""
10011030-195 = ""
10011030-196 = "Кхм! Нинперо будет твоим защитником во время представления!"
10011030-197 = ""
10011030-199 = ""
10011030-200 = ""
10011030-202 = ""
10011030-203 = "Если наша очаровательная принцесса попадёт в беду, просто обними Нинперо и вспомни наше обещание."
10011030-204 = "Обещаем, мы придём и спасём тебя любой ценой! Хорошо, принцесса?"
10011030-205 = "Правда?"
10011030-206 = "Конечно! Правило ниндзя номер три!"
10011030-207 = "Ниндзя никогда не нарушает своего слова!"
10011030-208 = "[s] «Слышала? Разве не круто, Ибуки?»"
10011030-209 = "Ура! Хорошо! Спасибо!"
10011030-210 = "Ещё одна миссия успешно выполнена!"
10011030-211 = "Хе. Э-хе-хе!"
10011030-212 = ""
10011030-214 = ""
10011030-216 = "Свет снова включили!"
10011030-218 = "Хорошо, что так быстро починили."
10011030-219 = "Видишь? Я же говорила, ничего страшного."
10011030-220 = ""
10011030-223 = ""
10011030-224 = "Приносим извинения, у нас возникли технические неполадки! Принцесса, ваш выход!"
10011030-225 = ""
10011030-227 = ""
10011030-228 = "Как волнительно! Удачи, Ибуки!"
10011030-229 = "Ты справишься...!"
10011030-230 = "Удачи!"
10011030-232 = "Спасибо, ниндзя! Ибуки пошла, Сенсей!"
10011030-233 = ""
10011030-235 = ""
10011030-236 = "Фух... Я не была уверена, что сможем её успокоить."
10011030-237 = "Было очень близко... Но ниндзя должен выполнить миссию несмотря ни на какие трудности."
10011030-238 = "А теперь время представления!"
10011030-239 = "Будем надеяться, дальше всё пройдёт гладко!"
10011030-240 = ""
10011030-246 = ""
10011030-248 = "Вы кто такие? Не знал, что наняли ещё помощников."
10011030-249 = ""
10011030-252 = ""
10011030-253 = "[ns] «Погодите... Вы ведь...?»"
10011030-254 = ""
10011030-257 = ""
10011030-258 = "Не забывайте, мы, Вольные Морё, пришли с конкретной целью. Выполнить миссию быстро и убрать любого, кто встанет на пути. Без отвлечений."
10011030-259 = ""
10011030-260 = "Есть, госпожа!"
10011030-261 = ""
10011030-263 = "Ч-Ч-Что они сейчас сказали?! Убрать...??"
10011030-264 = "Президент! Господин! Это чрезвычайная ситуация ниндзя! Нин!"
10011030-265 = "Что происходит?! Я ничего не понимаю!"
