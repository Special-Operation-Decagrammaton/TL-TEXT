[translation]
1008705-1 = "Что есть, то есть!"
1008705-3 = "В зале для вечеринок на окраине Геенны."
1008705-4 = ""
1008705-6 = ""
1008705-7 = "Сенсей, вы пришли."
1008705-8 = "[s] «Ако. Что вообще происходит...»"
1008705-9 = "Это приём для представителей частных компаний, связанных с Геенной."
1008705-10 = "Ненавижу ходить на подобные мероприятия... Но как старший администратор, я обязана присутствовать."
1008705-11 = "Обычно я бы просто пришла в своей обычной одежде, и никому не было бы дела, но..."
1008705-12 = ""
1008705-14 = ""
1008705-15 = "Эм, в этом платье я всё ещё чувствую себя неуютно."
1008705-16 = "Я хотела сначала привыкнуть к нему на каких-нибудь небольших мероприятиях, прежде чем идти на особую вечеринку Геенны."
1008705-17 = "[s] «Другими словами, ты решила устроить пробный бой.»"
1008705-18 = "Именно."
1008705-19 = "Если это вечеринка, устроенная теми вредителями... Боюсь, там я не смогу рассчитывать на вашу поддержку..."
1008705-20 = "А раз это платье выбрали вы..."
1008705-21 = ""
1008705-23 = ""
1008705-24 = ""
1008705-25 = "Вполне естественно, что на тренировке вы должны меня поддержать, если на поле боя этого не сможете!"
1008705-26 = "[s] «Понял. Я прикрою тебя.»"
1008705-27 = "...Ладно."
1008705-28 = ""
1008705-30 = ""
1008705-32 = ""
1008705-33 = "[ns] И вот я стал сопровождать Ако."
1008705-38 = ""
1008705-39 = ""
1008705-40 = "М-м..."
1008705-41 = "[s] «Ты в порядке? Выглядишь немного некомфортно.»"
1008705-42 = ""
1008705-44 = ""
1008705-45 = "А. Да..."
1008705-46 = "Это платье немного длиннее, чем я думала. Мне всё время кажется, что я сейчас на него наступлю. Эм..."
1008705-47 = ""
1008705-49 = ""
1008705-50 = ""
1008705-51 = "А-А?"
1008705-52 = ""
1008705-54 = ""
1008705-55 = ""
1008705-56 = "Фуэ-э-э?!"
1008705-57 = "[ns] «Ако, ты в порядке?!»"
1008705-58 = ""
1008705-60 = ""
1008705-61 = "Д-Да... Я-я просто... чуть не споткнулась о платье."
1008705-62 = "Хорошо, что вы меня поймали."
1008705-63 = ""
1008705-65 = ""
1008705-66 = "А?"
1008705-67 = "Вы слышали, как что-то порвалось?"
1008705-68 = ""
1008705-71 = "Подождите, кажется, это моё платье! На спине? Нет... На талии?"
1008705-72 = "[s] «На спине? На талии?»"
1008705-74 = "Где?"
1008705-75 = ""
1008705-77 = ""
1008705-78 = ""
1008705-79 = "К-Кья-а-а?! Оно и правда порвалось!"
1008705-80 = "[s1] «П-Подожди. Сейчас попробую что-нибудь сделать.»\n[s2] «Давай найдём укромное место!»"
1008705-81 = ""
1008705-82 = ""
1008705-88 = "― [log=아코 드레스]Э-Это очень плохо![/log][wa:490]"
1008705-90 = "― [log=아코 드레스]Если кто-нибудь ещё заметит...[/log][wa:610]"
1008705-93 = "― [log=아코 드레스]Будут огромные проблемы![/log][wa:490]"
1008705-96 = "[ns] «Стой, я попробую скрепить разрыв английской булавкой.»"
1008705-97 = "― [log=아코 드레스]П-Почему именно сейчас?![/log][wa:1270]"
1008705-100 = "― [log=아코 드레스]Это потому, что я пришла сюда с вами, Сенсей?![/log][wa:1360]"
1008705-103 = "[ns] «Что?! О чём ты вообще?!»"
1008705-104 = "― [log=아코 드레스]Сенсей! Пожалуйста... просто сделайте что-нибудь![/log][wa:250]"
1008705-107 = "― [log=아코 드레스]Пока я не попала в какую-нибудь жёлтую газетёнку![/log][wa:1420]"
1008705-110 = "[ns3] Пока я чинил порванное платье Ако, я увидел кое-что знакомое.\n[ns4] «Ако, только не говори, что ты...»"
1008705-111 = "― [log=아코 드레스]Хм? Ч-Что такое? Что это за взгляд?[/log][wa:1590]"
1008705-112 = "― [log=아코 드레스]Хм? Ч-Что такое? Что это за взгляд?[/log][wa:1590]"
1008705-115 = "― [log=아코 드레스]...А?[/log]"
1008705-118 = "― [log=아코 드레스]Ч-Что такое?[/log][wa:320]"
1008705-120 = "― [log=아코 드레스]Что именно вы там нашли?[/log]"
1008705-123 = "[ns] «...Разве ты не говорила, что собираешься это вернуть?»"
1008705-124 = "― [log=아코 드레스]Э-Это, эм...[/log][wa:1400]"
1008705-126 = "― [log=아코 드레스]Возврат... покупок обычно требует столько хлопот...[/log][wa:360]"
1008705-129 = "― [log=아코 드레스]А ещё... я была слишком занята работой Префекторской команды,[/log][wa:960]"
1008705-131 = "― [log=아코 드레스]так что времени совсем не было...[/log][wa:240]"
1008705-134 = "― [log=아코 드레스]В общем, что есть, то есть![/log]"
1008705-136 = "― [log=아코 드레스]Давайте просто на этом и остановимся![/log][wa:10]"
1008705-139 = "Каким-то образом одна маленькая английская булавка спасла положение и положила конец этой неловкой ситуации."
1008705-140 = "После этого я отвёз ужасно смущённую Ако обратно в Геенну. Таблоиды так ничего и не узнали."
