[translation]
2300305-33 = "."
2300305-1 = "Добро пожаловать в интернет-кафе"
2300305-2 = "Центр Кивотоса"
2300305-3 = "Спасибо, что сходил со мной за покупками. С твоей помощью я урвала две новые видеокарты!"
2300305-4 = "Сейчас видеокарты трудно достать, потому что люди тратят их на всякую ерунду вроде майнинга криптовалют."
2300305-5 = "Из-за них страдают честные хакеры вроде меня, которые используют компьютеры по назначению."
2300305-6 = "...Ладно, «честные хакеры» звучит странно, но я имею в виду, что мы не усложняем другим жизнь ради собственной выгоды."
2300305-7 = "Ну, здесь я закончила, возвращаемся в академию."
2300305-8 = "Небо так затянуло... дождь может начаться в любую секунду..."
2300305-9 = ""
2300305-10 = "...Накаркала."
2300305-11 = "Что делать? Я не взяла зонт, потому что сегодня по прогнозу дождя не было..."
2300305-12 = "Если так пойдёт, мои драгоценные новые видеокарты промокнут... Здесь поблизости есть где спрятаться от дождя?"
2300305-13 = "[s] (Указать на интернет-кафе неподалёку.)"
2300305-14 = "Интернет-кафе? Маки рассказывала. Это где тебе дают маленькую тёмную кабинку с компьютером, да?"
2300305-15 = "..."
2300305-16 = "Другого выбора нет. Не хочу угробить с таким трудом купленные видеокарты ещё до распаковки."
2300305-17 = "Да и, если честно, мне давно было интересно побывать в интернет-кафе."
2300305-18 = "Ну что, зайдём...?"
2300305-21 = "― *вздох* Этот ливень начался буквально из ниоткуда.[wa:940]"
2300305-23 = "― Похоже, прогнозам погоды нынче трудно доверять.[wa:3090]"
2300305-26 = "― Ну и... что будем делать теперь?[wa:3220]"
2300305-29 = "― (Ой нет... Это прозвучало странно?)[wa:3520]"
2300305-32 = "― (Я впервые в интернет-кафе.[wa:2230]"
2300305-34 = "― Я вообще не знаю, что тут принято делать.)[wa:2520]"
2300305-37 = "― (И эта кабинка такая тесная...[wa:2310]"
2300305-39 = "― а лицо Сенсея так близко...)[wa:770]"
2300305-42 = "― Ты пойдёшь освежиться?[wa:2160]"
2300305-44 = "― В смысле?[wa:1640]"
2300305-47 = "― А, хочешь смыть дождь с волос...[wa:1620]"
2300305-49 = "― ...Нет, забудь, что я спросила.[wa:2260]"
2300305-52 = "― В интернет-кафе есть душевые?[wa:2130]"
2300305-55 = "― Сенсей. Мне сказали, напитки здесь бесплатные.[wa:2040]"
2300305-57 = "― Интересно, энергетики тоже есть.[wa:520]"
2300305-60 = "― Мало того что интернет бесплатный, так ещё и напитки.[wa:1100]"
2300305-62 = "― Потрясающе! Идеальное место для таких, как я![wa:4510]"
2300305-65 = "― Я бы могла жить здесь вечно.[wa:3350]"
2300305-68 = "― Ох... Надеюсь, я сейчас не выгляжу странно.[wa:3650]"
2300305-70 = "― Только не пойми неправильно...[wa:100]"
2300305-73 = "Центр Кивотоса"
2300305-74 = "Пока мы сидели внутри, дождь закончился."
2300305-75 = "Мы попали туда случайно, но место оказалось довольно весёлым."
2300305-76 = "В следующий раз стоит взять с собой сменную одежду."
2300305-77 = ""
2300305-78 = "Эм... под «в следующий раз» я имею в виду..."
2300305-79 = "В следующий раз, когда снова случайно попадём под дождь неподалёку."
2300305-80 = "Я ни на что не намекаю. Ясно?"