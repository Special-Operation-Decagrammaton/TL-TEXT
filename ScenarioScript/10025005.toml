[translation]
10025005-219 = "#video;10025"
10025005-1 = "Пролог;Пропавшие креветки"
10025005-2 = "Парк Коусаги"
10025005-4 = ""
10025005-5 = ""
10025005-6 = "Слишком жарко..."
10025005-7 = "И правда жарко."
10025005-8 = "Кажется, я плавлюсь..."
10025005-9 = ""
10025005-11 = ""
10025005-12 = ""
10025005-13 = "...Текущее время — 13:05. Температура поверхности в лагере RABBIT — 35 градусов Цельсия..."
10025005-14 = ""
10025005-16 = ""
10025005-18 = "Что случилось с нашим походным кондиционером? Он неплохо работал, когда мне нужно было охладить рабочее место."
10025005-19 = "Его повредило во время последнего дождя."
10025005-20 = "Уф... Я так и знала, что этим закончится..."
10025005-22 = "Мы застряли здесь под солнцем. И скоро умрём, как морские звёзды во время отлива, высохнем до хруста..."
10025005-23 = ""
10025005-25 = ""
10025005-27 = ""
10025005-28 = "Нарушений периметра не обнаружено. Помимо этого..."
10025005-29 = ""
10025005-31 = ""
10025005-33 = ""
10025005-34 = ""
10025005-35 = "Гх! Эта жара сводит меня с ума!"
10025005-36 = "Хватит уже ныть! Нам всем тут тяжело!"
10025005-37 = "Да что с вами со всеми? Погода ведь не изменилась внезапно!"
10025005-38 = "И к тебе это относится вдвойне, Моэ. Ты постоянно что-нибудь поджигаешь и взрываешь..."
10025005-39 = "Летняя жара и жара от взрыва — это две совершенно разные вещи!"
10025005-40 = "Нет ничего, что я люблю больше огневой мощи, но медленно запекаться в этом горячем ветре я отказываюсь."
10025005-41 = "Хотя, раз уж заговорили... Интересно, можно ли превратить такой ветер в оружие... *пыхтит* *пыхтит*"
10025005-42 = "Ну и ну. Ведёте себя так, будто никогда раньше не переживали лето."
10025005-43 = "Нужно очистить разум. Сохраняйте спокойствие и сосредоточьтесь — тогда даже огонь покажется прохладным..."
10025005-44 = ""
10025005-47 = ""
10025005-48 = "...Ладно, сегодня и правда довольно жарко..."
10025005-49 = "Саки, уйди с солнца, пока не получила тепловой удар."
10025005-50 = "Принято. Сегодня буду выполнять охрану периметра изнутри."
10025005-52 = ""
10025005-60 = ""
10025005-61 = "Гх... Я боюсь заходить в палатку связи. Вся электроника превращает её в духовку..."
10025005-62 = "Зимой я могу обнимать монитор, чтобы согреться... Ненавижу лето."
10025005-63 = "Я-я, кажется, тоже больше люблю зиму..."
10025005-64 = "Когда меня ставят в открытом поле, часто приходится занимать позицию там, где вообще нет тени..."
10025005-65 = "Лежишь там в камуфляже, а летнее солнце жарит сверху... Будто на гриле..."
10025005-67 = "Я тоже не фанат лета. Гораздо сложнее поддерживать чистоту."
10025005-68 = "А без нормального хранения еды здесь наши пайки очень быстро портятся."
10025005-70 = "Согласна."
10025005-71 = "На днях мы голодали, потому что все найденные бэнто уже испортились..."
10025005-73 = "У них срок годности закончился меньше суток назад, а рис уже пах испорченным..."
10025005-75 = "Тогда было четыре бэнто с якинику... и все пришлось выбросить..."
10025005-76 = "Ненавижу лето..."
10025005-77 = "Знаете, что я заметила? В последнее время вообще не было бэнто с креветками. Это тоже из-за погоды?"
10025005-78 = "Иногда среди выброшенных бэнто попадался сэндвич с креветками. Мне даже нравился."
10025005-80 = "Не может же дело быть в погоде? Бэнто с рыбой всё ещё встречаются."
10025005-81 = "Раньше свежие морепродукты нельзя было доставить так далеко вглубь суши, не испортив их, но сейчас это не должно быть проблемой."
10025005-82 = "У нас может и нет холодильников, но у компаний, которые возят морепродукты в магазины, грузовики с морозильными установками."
10025005-83 = "А креветки особенно легко хранить и перевозить, потому что обычно их замораживают прямо на рыболовном судне сразу после вылова."
10025005-84 = "Среди поваров даже есть поговорка: самые свежие креветки — не живые, а замороженные."
10025005-85 = "...Откуда ты вообще всё это знаешь? В прошлой жизни ловила креветок?"
10025005-86 = "Мне об этом рассказал инструктор на тренировке по дайвингу."
10025005-88 = "Но, кажется, в Д.У. я в последнее время тоже не видела креветок."
10025005-89 = "На днях возвращалась в парк и увидела в одном ресторане табличку, что креветок нет в наличии."
10025005-90 = "Странно, что пострадали только креветки, а с остальными морепродуктами всё нормально... Очень странно."
10025005-91 = "Возможно, какая-то банда вмешивается в поставки креветок по Д.У., или—"
10025005-93 = "Но зачем им именно креветки? Какая у них может быть цель?"
10025005-94 = "Если судить по рыночным ценам, на одних креветках много не заработать. Вот если бы речь шла о крабах или морских ушках..."
10025005-95 = "Не, тут вряд ли что-то крупное вроде преступного синдиката, который решил захватить рынок креветок."
10025005-96 = "Скорее что-то вроде... террориста-гурмана, который ненавидит плохие креветки и поэтому угоняет грузовики с креветками и взрывает их..."
10025005-97 = "Если тут замешан террорист, я бы сказала, что это вполне тянет на «что-то крупное.»"
10025005-99 = "...Да, пожалуй, это уже перебор."
10025005-100 = "Мы все многое пережили. Возможно, мы просто слишком остро реагируем..."
10025005-101 = ""
10025005-103 = ""
10025005-106 = "[ns1] «Всем привет!»\n[ns2] «Жаркий денёк, а?»"
10025005-109 = ""
10025005-110 = "О, Сенсей. Я так и знала, что распознала знакомое нарушение периметра."
10025005-111 = "Что привело вас в парк Коусаги в такой жаркий день?"
10025005-112 = ""
10025005-114 = ""
10025005-115 = "[ns3] «Просто проходил мимо.»\n[ns4] «Подумал, вам не помешает немного взбодриться.»"
10025005-118 = ""
10025005-121 = "[ns] «Кстати, как насчёт мороженого?»"
10025005-123 = "Да, пожалуйста!"
10025005-125 = ""
10025005-129 = ""
10025005-130 = "А-а... Вот это другое дело..."
10025005-131 = "Есть мороженое в тени в жаркий день. Лучше и быть не может!"
10025005-132 = "Холод от мороженого расходится по всему телу... Будто прячусь в холодильнике..."
10025005-133 = ""
10025005-135 = ""
10025005-137 = ""
10025005-138 = "Спасибо, Сенсей. Эта жара здорово нас измучила..."
10025005-139 = "Благодаря вам теперь гораздо лучше."
10025005-140 = "[s] «Да пустяки.»"
10025005-141 = ""
10025005-144 = "[ns5] «Кстати, я случайно услышал ваш разговор...»\n[ns6] «Что это за история с пропавшими из Д.У. креветками?»"
10025005-147 = "А, это... Доказательств у нас пока нет."
10025005-148 = "Но мы заметили, что в магазинах в последнее время перестали продавать бэнто с креветками."
10025005-150 = ""
10025005-157 = "[ns] «Если подумать, я и сам не помню, когда в последний раз ел креветки.»"
10025005-158 = ""
10025005-159 = "Вот именно. Может, это временный дефицит. Без конкретной информации мы всё равно ничего не можем сделать..."
10025005-160 = "И даже если за нехваткой креветок кто-то стоит и каким-то образом незаконно на этом наживается..."
10025005-161 = "Это уже юрисдикция Генерального студсовета или, может быть, клуба пищевой безопасности Валькирии. Не SRT."
10025005-162 = "Эй, разве креветок не ловят в деревне Ятоура? Возле порта Канэсаки?"
10025005-163 = "Да. У крупной распределительной компании Ред Хук Экспресс там есть рыбоперерабатывающий завод."
10025005-164 = "Раньше это была сонная рыбацкая деревушка, но с тех пор, как открылся завод, оттуда поставляют креветки для всего Д.У."
10025005-165 = ""
10025005-167 = ""
10025005-168 = "Рыбацкая деревня... Пляж..."
10025005-169 = ""
10025005-171 = ""
10025005-172 = "Уф... Стоит подумать о таких прохладных, освежающих местах — и сразу ещё сильнее чувствуешь, насколько здесь чертовски жарко..."
10025005-173 = "Знаете, я уже давно не была на пляже."
10025005-175 = "С тех пор как училась в SRT, ни разу."
10025005-176 = "И тогда это были учения по морским операциям, так что насладиться пляжем времени почти не было..."
10025005-177 = "Но как нам вообще туда поехать? У нас теперь даже собственной академии нет..."
10025005-178 = "Да, верно. Мы поклялись не покидать этот парк, пока академию не восстановят."
10025005-179 = "Было бы неправильно оставить парк и уехать отдыхать. Если только у нас не появится задание..."
10025005-180 = "[s] «Решено. Все едем на пляж!»"
10025005-181 = "Сенсей, вы слышали, что я только что сказала?"
10025005-182 = "Без особой причины мы не можем покинуть парк!"
10025005-183 = "Что подумают остальные, если увидят, как SRT, отвечающая за безопасность граждан Кивотоса, просто бросает пост и отправляется отдыхать к морю?"
10025005-184 = "[s] «А кто говорил об отдыхе?»"
10025005-185 = "Т-Тогда... зачем нам ехать...?"
10025005-186 = "[s] «В этой истории с креветками что-то нечисто, правда?»"
10025005-187 = ""
10025005-190 = "[ns7] «Невозможно докопаться до истины, если вы никогда не покидаете парк.»\n[ns8] «Мы отправимся под прикрытием и раскроем тайну креветок!»"
10025005-193 = "Поехать на пляж... чтобы раскрыть тайну креветок...?"
10025005-194 = "...В ваших словах есть смысл, Сенсей."
10025005-195 = "Проникновение и нейтрализация угроз входят в обязанности нашего подразделения специального назначения."
10025005-196 = "Я помню, как старшекурсницы из отряда FOX несколько раз работали под прикрытием, изображая туристок."
10025005-197 = "Однако... я всё ещё не уверена, что нам стоит действовать, опираясь лишь на предположения..."
10025005-198 = "И что мы будем делать, если окажется, что ничего не случилось, а креветки просто доставили не туда...?"
10025005-199 = "[s9] «По крайней мере, мы будем знать наверняка...»\n[s10] «А в таком случае можно будет просто насладиться отпуском.»"
10025005-202 = ""
10025005-204 = ""
10025005-205 = ""
10025005-206 = "...Так отпуск с самого начала и был целью?"
10025005-207 = "Ладно. Полагаю, нам действительно нужна причина покинуть парк."
10025005-208 = "Но мы — всё, что осталось от SRT, поэтому проведём операцию как положено."
10025005-209 = "Отряд, переодеться в гражданскую одежду."
10025005-210 = "Для этой операции мы будем работать под прикрытием, поэтому всем нужно замаскироваться под обычных туристок."
10025005-211 = "Понятно?"
10025005-213 = "Поняла!"
10025005-215 = "Мы проникнем в деревню Ятоура и выясним, куда пропали креветки. Начинаем..."
10025005-216 = "Операцию «Креветочная сеть»!"