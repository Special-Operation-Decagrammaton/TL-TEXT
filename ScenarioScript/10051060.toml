[translation]
10051060-1 = "Эпизод 6;Растущая известность"
10051060-2 = "Где-то в переулке"
10051060-3 = "Хи-хи-хи... Наконец-то! Они у меня!"
10051060-4 = "Свежие выпуски «BiBi» и «Ron-ro»...!"
10051060-5 = "Все мучения окупились: продажа макулатуры и стреляных гильз, ночи с просроченными бенто из мусорки и вода из-под крана, хи-хи!"
10051060-6 = "...И половину оплатил Сенсей."
10051060-7 = "Н-Но всё равно, СВОЮ половину я оплатила сама! Я! Сенсей так мной гордился. Я почти независимая женщина..."
10051060-8 = "О, смотрите! В «BiBi» материал про Шайнкэт! Какой же он крутой."
10051060-9 = "Он гений, полностью изменивший модную парадигму Кивотоса! Я это знаю, потому что вот здесь так и НАПИСАНО."
10051060-10 = "А? Шайнкэт недавно представил новую линию на модном показе Хяккияко."
10051060-11 = "Ого..."
10051060-12 = "Эти платья такие красивые!"
10051060-13 = "Быть моделью — это значит всегда можно носить такие вещи?"
10051060-14 = "Пф-ф... Вот это жизнь. Я даже мечтать о таком не могу. Я слишком низкая для модели."
10051060-15 = "Почему? Низкие люди тоже носят одежду. Почему нет низких моделей?"
10051060-16 = "Эээ?! Потому что жизнь несправедлива. Это жестокое страдание. Мир построен так, чтобы высокие вышагивали, а низкие старались не попасть им под ноги!"
10051060-17 = "Наверное, высокий рост действительно даёт модели преимущество. Когда входишь в комнату, взгляды сами тянутся к тебе."
10051060-18 = "В «Ron-ro» есть статья об этой новой модели, Оно Цукуё. Рост 5 футов 11 дюймов, видишь?"
10051060-19 = "Похоже, её хорошо приняли."
10051060-20 = "О-Она и в «BiBi» есть. Хм... Студентка-модель, неожиданно дебютировавшая. Все в индустрии от неё без ума."
10051060-21 = "И отзывы невероятные. «Хотя у неё почти нет опыта, она обладает врождённым, незаменимым талантом». «Неогранённый алмаз»."
10051060-22 = "Кто-то настолько талантливый... наверное, счастлив, да?"
10051060-23 = "Не обязательно."
10051060-24 = ""
10051060-26 = ""
10051060-27 = ""
10051060-28 = "Чтобы выглядеть настолько хорошо, требуется огромная работа и постоянный уход за кулисами."
10051060-29 = "Как орхидее нужны месяцы заботы и полива, прежде чем она зацветёт."
10051060-30 = "Ацуко..."
10051060-31 = "Кстати об этом, девочки..."
10051060-32 = "Никто не видел мои листья розмарина? Похоже, они куда-то исчезли."
10051060-33 = ""
10051060-35 = ""
10051060-36 = ""
10051060-37 = "Кажется, я слышала, что ими можно замаскировать вкус испорченного мяса..."
10051060-38 = ""
10051060-40 = ""
10051060-41 = ""
10051060-43 = "...Девочки? Девочки?!"
10051060-45 = "Площадь школы Тринити"
10051060-47 = ""
10051060-48 = "Ты читала свежий выпуск «Heart Girls»?"
10051060-49 = "Разумеется."
10051060-50 = "Мне весьма жаль, что в последнее время они сосредоточились на образе жизни, а не на моде."
10051060-51 = "...Поэтому было приятно увидеть, что в этом месяце они вернулись к истокам и снова сделали упор на моду."
10051060-52 = "Точно. Новый редактор сделал акцент на более глубоких обзорах и серьёзном анализе последних модных тенденций."
10051060-53 = "А мне особенно понравилась статья, где они разобрали новую модель и проанализировали её привлекательность."
10051060-54 = "Ах, та модель из Хяккияко. Она великолепна. Её звали..."
10051060-55 = "...Оно Цукуё, кажется?"
10051060-56 = "Именно! Её портфолио впечатляет, а эти глаза... Я почти чувствовала её ауру сквозь страницу."
10051060-57 = "Эксперты индустрии осыпали её похвалами, и вполне заслуженно."
10051060-58 = "Мне она тоже нравится. Интересно, что будет дальше в её карьере..."
10051060-59 = ""
10051060-61 = ""
10051060-62 = ""
10051060-64 = "Школа Миллениум"
10051060-65 = ""
10051060-67 = ""
10051060-68 = "Хм? Во что ты так пристально вчитываешься?"
10051060-69 = "Какой-то научный журнал?"
10051060-70 = "Прошу тебя. Только не во время моего обеденного перерыва."
10051060-71 = "Это «Ron-ro». Только из печати."
10051060-72 = "Самый модный журнал на прилавках. Не читаешь — отстанешь от жизни."
10051060-73 = "«Ron-ro»? Как необычно. О каких «тенденциях» идёт речь?"
10051060-74 = "Мода. Красота. Это СУПЕРпопулярный модный журнал. Ты правда не знала?"
10051060-75 = "Журнал ТОЛЬКО о моде?"
10051060-76 = "Я перестала думать о моде в тот момент, когда мне выдали эту форму."
10051060-77 = "И у меня не было времени читать — я работаю над диссертацией."
10051060-78 = "Эм... Ага... Верно. Это тоже важно..."
10051060-79 = "Но мне любопытно. Ты так увлеклась. Узнала что-нибудь интересное?"
10051060-80 = "Я читала статью о новой модели. Она студентка, как и мы. И только что дебютировала."
10051060-81 = "Она новичок в индустрии, но уже привлекает много внимания."
10051060-82 = "Посмотрим, её зовут... Цукуё?"
10051060-83 = "Хм... Присутствие у неё определённо есть."
10051060-84 = ""
10051060-86 = ""
10051060-87 = ""
10051060-89 = "Комната для интервью сети Кронос"
10051060-90 = ""
10051060-91 = "Для нас было огромным удовольствием пригласить вас, мисс Цукуё!"
10051060-92 = "Д-Да... Спасибо, что пригласили..."
10051060-93 = "И последний вопрос. Мир должен знать! Быстро, одним предложением! Расскажите о своих планах на будущее."
10051060-94 = "П-Планах?!"
10051060-95 = "Я-Я, э-э, в будущем... Эм..."
10051060-96 = ""
10051060-98 = ""
10051060-99 = "..."
10051060-100 = "Н-Ну..."
10051060-102 = "Мисс Цукуё! Успокойтесь! Никакого давления! Просто глубоко вдохните и прямо сейчас, одним предложением, скажите нам, что собираетесь делать со своей жизнью!"
10051060-103 = "Честно говоря..."
10051060-104 = "(сверлит взглядом)"
10051060-105 = "Я-Я продолжу стараться стать в-великой фотомоделью...?"
10051060-106 = "(кивает)"
10051060-107 = "Какой чистый ответ! Искренний! Это... Цукуё, друзья, и вы ещё не раз её увидите!"
10051060-108 = "А все мы в Кронос желаем только успеха модельной карьере Цукуё! Мы вернёмся после короткой рекламы от наших спонсоров!"
10051060-109 = ""
10051060-111 = ""
10051060-112 = ""
10051060-113 = ""
10051060-114 = "Неплохо. Ты пережила своё первое интервью."
10051060-115 = "Э-Эм... Что вообще происходит...?"
10051060-116 = "Я понимаю, что для тебя всё это в новинку."
10051060-117 = "Но взгляни на экран. Посмотри на число зрителей в прямом эфире, комментарии, реакции."
10051060-118 = "...!"
10051060-119 = "Держу пари, ты и представить не могла, что такое увидишь, верно?"
10051060-120 = "Но всё это сделала ты. ТЫ привлекла это внимание. Ты притянула эти взгляды."
10051060-121 = "Это твой талант, твоя судьба. А такой талант, как у тебя, заставит мир подчиниться своей воле!"
10051060-122 = "Н-Но Клуб исследования ниндзюцу..."
10051060-123 = "Я не знаю, что такое «ниндзя» или «ниндзюцу». Никто не знает."
10051060-124 = "Но вот что я знаю. Вот что чувствую каждой костью. Ты будешь не просто хороша. Ты станешь ЛУЧШЕЙ."
10051060-125 = "Но мои обязанности ниндзя..."
10051060-126 = "Чтобы принять одно, нужно отпустить другое. От чего ты откажешься?"
10051060-127 = "Я..."
10051060-128 = "Нет ответа? Тогда я скажу. Следуй за мной. Вот ответ. Последний ответ, который тебе когда-либо понадобится."
10051060-129 = "Но..."
10051060-130 = ""
10051060-132 = ""
10051060-134 = "Кроме того, разве ты только что не объявила перед обожающей тебя толпой, что продолжишь работать моделью?"
10051060-135 = "...!"
10051060-136 = "Ты откажешься от публичного обещания? Все узнают. Это записали."
10051060-137 = "Машина приехала."
10051060-138 = "Пойдём, Цукуё."
10051060-139 = ""
10051060-141 = ""
10051060-144 = ""
10051060-145 = ""
10051060-147 = "Съёмочная площадка «Мичиручи: свиток девушки-ниндзя»"
10051060-148 = "Президент! Смотрите! Видео прошлой недели набрало ещё два просмотра!"
10051060-149 = "Два просмотра! Наверное, четыре глаза! Люди в восторге от жизни ниндзя!"
10051060-150 = "Цукуё! Ты видишь это, Цукуё? Ты отлично справилась!"
10051060-151 = ""
10051060-153 = ""
10051060-154 = "Президент, Цукуё здесь нет."
10051060-155 = "А? Всё ещё?"
10051060-156 = "Цукуё никогда не опаздывает. Может, она просто... тихо стоит рядом? Хм."
10051060-157 = "Изуна отправляла ей сообщения в Momo утром. Не прочитано. Нин. Нин..."
10051060-158 = "Она знает, что мы снимаем каждую неделю в одно и то же время. Она любит этот распорядок."
10051060-159 = "С ней что-то случилось?"
10051060-160 = "Ня-ха-ха, вижу, сегодня съёмка на натуре."
10051060-161 = "Хм?"
10051060-162 = "О, это вы...!"
