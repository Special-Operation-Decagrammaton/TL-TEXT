[translation]
201010-1 = "Эпизод 1;Выходной главного администратора"
201010-4 = ""
201010-5 = "Давненько не виделись, Сенсей."
201010-6 = "Хотя нет, это не совсем верно. Не так уж много времени прошло с тех пор, как я в последний раз заходила в Шале забрать ваш отчёт."
201010-7 = "[s1] «Прошла ЦЕЛАЯ ВЕЧНОСТЬ, Аой!»\n[s2] «Когда ты уходишь, мне остаётся лишь ждать твоего возвращения!»"
201010-10 = ""
201010-12 = ""
201010-13 = "...Вы невероятно прямолинейны со своими студентами, Сенсей. Возможно, дело в недостатке осмотрительности или здравого смысла."
201010-14 = "Как бы то ни было, я связалась с вами не по делам Генерального ученического совета. По крайней мере, не совсем."
201010-15 = "У меня просьба более личного характера."
201010-16 = "Перейду сразу к делу: у вас есть планы на эти выходные?"
201010-17 = "[s] «Неужели... ты зовёшь меня на свидание?»"
201010-18 = "..."
201010-19 = "..."
201010-20 = "..."
201010-21 = "Прошу прощения. Я тогда обращусь... к кому-нибудь другому."
201010-22 = "[s3] «П-подожди минутку!»\n[s4] «Хотя бы объясни, что происходит!»"
201010-25 = "*вздох* Ладно. Я не люблю повторяться, так что слушайте внимательно."
201010-26 = "Рин... Нет, я имею в виду главного администратора."
201010-27 = "В последнее время она слишком много работает."
201010-28 = "Так было с самого исчезновения президента Генерального ученического совета, но в последнее время ситуация стала особенно серьёзной."
201010-29 = "Я заметила в её отчётах мелкие ошибки, совсем на неё не похожие. Да и выглядит она ещё хуже обычного."
201010-30 = "Ради нормальной работы Генерального ученического совета я не могу позволить этому продолжаться."
201010-31 = "[s] «В последнее время работы стало больше обычного?»"
201010-32 = "Наоборот. В последнее время нагрузка стала гораздо более терпимой."
201010-33 = "Если говорить о финансах, мы уже восстановили примерно 70% потерь, вызванных исчезновением президента Генерального ученического совета."
201010-34 = "Но главного администратора это всё равно не устраивает."
201010-35 = "Она отказывается отдыхать. После переворота она боится, что Генеральный ученический совет снова окажется в кризисе, если ей не удастся показывать такие же сверхчеловеческие результаты, как президент."
201010-36 = "Она работает каждые выходные и отвергает любые предложения сделать перерыв."
201010-37 = "Именно поэтому нам нужна ваша помощь, [USERNAME] Сенсей."
201010-38 = "Убедите её, воспользуйтесь полномочиями Шале — делайте что хотите. Просто заставьте Рин отдохнуть в эти выходные."
201010-41 = "Кабинет главного администратора Генерального ученического совета"
201010-42 = "[ns5] «Итак, идём!»\n[ns6] «Пора отдохнуть, Ринни!»"
201010-43 = "Что... вы имеете в виду?"
201010-44 = "И не называйте меня Ринни."
201010-45 = "Но с чего всё это вдруг?"
201010-46 = "Отдых мне не нужен. Каждую ночь я сплю положенные шесть часов и никогда не пропускаю приёмы пищи."
201010-47 = "Я бы не допустила ухудшения здоровья. Это сказалось бы на моей работе. Так что, пожалуйста, не беспокойтесь о пустяках."
201010-48 = ""
201010-50 = ""
201010-51 = "Возражаю. Это УЖЕ сказывается на вашей работе."
201010-52 = "Посмотрите на этот отчёт о происшествии, который вы сдали вчера. Здесь вы использовали одинарные скобки, хотя они должны применяться только в оглавлении."
201010-53 = "Обычно вы бы не допустили такой простой ошибки... Вы уверены, что с вами всё в порядке?"
201010-54 = "[s] «Мы ведь сейчас говорим всего лишь... о скобках, да?»"
201010-55 = "Соблюдение установленного порядка крайне важно. Если внезапно изменить формат, это может повлиять на читаемость или даже смысл документа."
201010-56 = "Это основы составления официальных документов."
201010-57 = "...Прошу прощения. Похоже, я забыла провести финальную проверку."
201010-58 = "Уверяю вас, это больше не повторится."
201010-59 = "Нет, не можете уверять. По крайней мере, пока не отдохнёте, главный администратор."
201010-60 = "Вы не брали ни одного выходного больше месяца. При выгорании концентрация в первую очередь начинает подводить именно на таких рутинных задачах."
201010-61 = "Отдохните в эти выходные. Я перенесу срок квартального финансового отчёта на следующую неделю."
201010-62 = "...Мне не нужен отдых."
201010-63 = "Благодаря неустанным усилиям всех сотрудников мы восстановили большую часть разрушенной инфраструктуры. Но доверие общественности к нашей компетентности от этого почти не вернулось."
201010-64 = "Именно в такие времена опаснее всего терять бдительность. Периоды затишья — лишь моменты, когда преступники выжидают."
201010-65 = "[s] «И ты не обязана нести всё это одна, Рин.»"
201010-66 = "...Президент Генерального ученического совета смогла бы."
201010-67 = "Прежде чем быть главным администратором, я являюсь исполняющей обязанности президента Генерального ученического совета. Пока её нет, я обязана заполнить оставленную ею пустоту."
201010-68 = "Но она была гением, а я всего лишь обычный человек. Единственный способ для такой, как я, соответствовать её наследию — работать усерднее."
201010-69 = "Рин..."
201010-70 = "К тому же на этих выходных у меня встреча в Тринити с представителями Чаепития."
201010-71 = "О-Оставьте это мне!"
201010-72 = ""
201010-74 = ""
201010-75 = "Аюму...?"
201010-76 = ""
201010-79 = ""
201010-80 = "Я всё равно еду в Тринити по делам Регуляторного комитета!"
201010-81 = "Главным вопросом повестки была экстрадиция студентов Геенны, задержанных в Тринити, верно?"
201010-82 = "Глава Префектурной команды Геенны передала мне полномочия по этому вопросу, так что можете спокойно наслаждаться выходными!"
201010-83 = "Спасибо. Это решает одну проблему..."
201010-84 = "Но у меня есть и другие дела. Из-за заторов в порту Канэсаки возникли проблемы с перевозкой потребительских товаров..."
201010-86 = "А, это из-за схода поезда с рельсов три дня назад? Уже всё улажено. Я просто скорректировала расписание поездов."
201010-87 = "В эту субботу выходит новый вкус картофельных чипсов... Поэтому я заранее закончила всю работу на этой неделе."
201010-88 = ""
201010-90 = ""
201010-91 = "...Такое чувство, будто вы все сговорились отобрать у меня работу."
201010-92 = "Я едва ли могу просто проигнорировать вашу обеспокоенность и продолжать упрямиться."
201010-93 = "Ладно, сдаюсь. В эти выходные я немного отдохну."
201010-94 = "Эм... В прошлый раз вы сказали то же самое, а потом забрали документы домой и всё равно проработали все выходные."
201010-95 = "Мы не позволим вам впустую потратить отпуск, даже если пришлось навязать его силой."
201010-96 = ""
201010-97 = "[ns] «Поэтому в эти выходные мы идём на свидание, Ринни!»"
201010-98 = "Не называйте меня Ринни. И это совершенно точно не свида—"
201010-99 = ""
201010-101 = ""
201010-102 = "...Простите. Я попыталась сказать две вещи одновременно. Похоже, я немного растерялась."
201010-103 = "Вашу беззастенчивую смелость стоило бы изучать, Сенсей."
201010-104 = "Вы всем своим студентам делаете такие предложения?"
201010-105 = "[s7] «Это решается отдельно для каждого студента...»\n[s8] «Я подумал, что это поможет тебе немного расслабиться, Рин.»"
201010-108 = ""
201010-110 = ""
201010-111 = "*вздыхает*"
201010-112 = "Хорошо. Я проведу с вами эти выходные, Сенсей."
201010-113 = "Если честно, мне давно было любопытно, как вы проводите свои выходные."
201010-114 = "[s] «М-Мои...?»"
201010-115 = "По слухам, студенты видели, как вы на четвереньках заглядывали под торговые автоматы, а ещё загорали прямо посреди улицы..."
201010-116 = "Ничего не припоминаете?"
201010-117 = "[s9] «Н-не думаю...»\n[s10] «Ты же знаешь, что говорят о слухах...»"
201010-120 = "Рада слышать это."
201010-121 = "Что ж, если вас устраивает, встретимся в субботу утром перед зданием Генерального ученического совета."
201010-122 = ""
201010-124 = ""
201010-125 = ""
201010-126 = "Ах да, и последнее."
201010-127 = "...Это не свидание."
201010-129 = "Следующий Эпизод;Выходной главного администратора 2"
