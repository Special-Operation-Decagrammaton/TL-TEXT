[translation]
201010-1 = "Episódio 1; A Folga da Administradora-Chefe (1)"
201010-4 = ""
201010-5 = "Quanto tempo, Sensei."
201010-6 = "...... Quer dizer, a gente acabou de se ver ontem na Schale, né."
201010-7 = "[s1] \"Quanto tempo, Aoi-chan!\"\n[s2] \"Estava aguardando ansiosamente pelo contato de Vossa Excelência Aoi.\""
201010-10 = ""
201010-12 = ""
201010-13 = "...... Essa sua postura sempre me deixa pasma.#nNão tem vergonha do que as pessoas em volta vão pensar, não?"
201010-14 = "Enfim, deixa pra lá.#nO motivo da minha ligação hoje não tem a ver com o Conselho Estudantil Federal――"
201010-15 = "Pois é...... pode encarar como um pedido pessoal meu."
201010-16 = "Será que você teria um tempinho livre neste fim de semana?"
201010-17 = "[s] \"Será que isso é...... um convite pra um encontro?!\""
201010-18 = "......"
201010-19 = "......"
201010-20 = ".................."
201010-21 = "...... Vou procurar outra pessoa."
201010-22 = "[s3] \"E-Espera aí, calma!\"\n[s4] \"Deixa eu pelo menos ouvir o que é!\""
201010-25 = "...... Não vai ter segunda chance, hein."
201010-26 = "É sobre a Rin-senpai...... digo, a Administradora-Chefe Rin."
201010-27 = "Ela está passando dos limites de cansaço."
201010-28 = "A gente já vinha notando alguns sinais antes, mas...... ultimamente a coisa tá feia de verdade."
201010-29 = "Ela começou a cometer erros bobos que nunca cometeria, a pele dela tá horrível, tá o puro bagaço......"
201010-30 = "Pelo bem do bom funcionamento do Conselho, não podemos deixar ela continuar nesse estado."
201010-31 = "[s] \"A carga de trabalho aumentou?\""
201010-32 = "Pelo contrário, até diminuiu."
201010-33 = "Graças aos esforços da Administradora-Chefe, nossa situação financeira já recuperou cerca de 70% do que era no auge."
201010-34 = "...... Só que ela não se dá por satisfeita com isso."
201010-35 = "Desde o golpe de estado, ela se recusa a descansar de qualquer jeito.#nProvavelmente colocou na cabeça que precisa ser perfeita como a antiga Presidente do Conselho."
201010-36 = "Já faz semanas que ela não para nem pra respirar......#ne não adianta as outras diretoras tentarem conversar, ela não escuta ninguém."
201010-37 = "Por isso eu imploro, [USERNAME] Sensei――"
201010-38 = "Não me importa que método você vai usar.#nSó não deixe ela encostar em trabalho nenhum neste fim de semana."
201010-41 = "Conselho Estudantil Federal - Gabinete da Administradora-Chefe"
201010-42 = "[ns5] \"Ebaaa! Vamos tirar folga juntinhos!\"\n[ns6] \"Rin-chan, Rin-chan! Disseram que é folga!\""
201010-43 = "Folga...... como assim?"
201010-44 = "E quem foi que te deu permissão de me chamar de \"Rin-chan\"?"
201010-45 = "Aliás, você falou em...... folga?"
201010-46 = "Eu não preciso disso.#nMinhas horas de sono e minhas refeições estão em dia."
201010-47 = "Tomo todo o cuidado com a minha saúde para não prejudicar as funções públicas.#nGaranto que não há o menor motivo para preocupações."
201010-48 = ""
201010-50 = ""
201010-51 = "Isso é o que você acha na sua cabeça."
201010-52 = "O relatório de ontem estava cheio de fontes trocadas e espaçamentos errados."
201010-53 = "Não me diga que não é cansaço?#nVocê jamais cometeria um deslize desses em condições normais."
201010-54 = "[s] \"...... Mas isso é motivo pra tanto drama?\""
201010-55 = "Mas é claro que é!"
201010-56 = "Documentos oficiais não toleram exceções.#nPadronização é a alma da burocracia."
201010-57 = "...... Peço desculpas. Eu deveria ter conferido duas vezes antes de despachar."
201010-58 = "Vou redobrar a minha atenção para garantir que isso não volte a ocorrer――"
201010-59 = "Não, o que a Administradora-Chefe precisa agora é de descanso."
201010-60 = "Você já está há quase um mês trabalhando sem parar, sabia?#nÉ óbvio que o foco vai pro ralo."
201010-61 = "Eu adiei o prazo do relatório financeiro deste trimestre para a semana que vem, então aproveite este fim de semana para relaxar."
201010-62 = "...... Como eu já disse antes, descanso é totalmente desnecessário."
201010-63 = "Graças ao esforço de todas, os prédios e instalações foram praticamente recuperados.#nContudo, a desconfiança da população em relação ao Conselho ainda está longe de sumir."
201010-64 = "Numa situação delicada dessas, se mostrarmos a menor fraqueza, logo vão aparecer oportunistas querendo tirar proveito."
201010-65 = "[s] \"Mas a Rin não precisa carregar o fardo todo sozinha nas costas, sabia?\""
201010-66 = "...... A Presidente do Conselho faria exatamente isso."
201010-67 = "Antes de ser Administradora-Chefe, sou a representante em exercício que recebeu os poderes diretamente dela.#nSou responsável por tudo o que aconteceu durante a ausência dela."
201010-68 = "Só que...... eu sou apenas uma pessoa comum. Para diminuir o abismo que me separa da genialidade da Presidente, meu único caminho é o esforço sem descanso."
201010-69 = "Senpai......"
201010-70 = "Sem falar que já tenho compromisso agendado para o fim de semana.#nUma reunião em Trinity com os membros da Tea Party――"
201010-71 = "E-Essa reunião deixa comigo!"
201010-72 = ""
201010-74 = ""
201010-75 = "Ayumu......?"
201010-76 = ""
201010-79 = ""
201010-80 = "É que...... essa reunião é sobre a custódia daquela aluna de Gehenna que foi detida no território de Trinity, não é?"
201010-81 = "A Chefe do Comitê de Disciplina de Gehenna já me passou a autorização para resolver isso."
201010-82 = "E-Eu já ia para Trinity de qualquer jeito a trabalho pela Câmara de Conciliação.#nEntão pode deixar tudo comigo e vai aproveitar a folga, Senpai!"
201010-83 = "Se for assim, eu realmente não preciso ir a Trinity, mas......"
201010-84 = "Ainda tenho outras pendências urgentes. A logística do Porto de Kanesaki travou, e o transporte――"
201010-86 = "Ah, isso foi por causa daquele descarrilamento de três dias atrás, né?#nEu já mexi nos horários dos trens e resolvi a parada, nem esquenta a cabeça."
201010-87 = "Vai sair um sabor de edição limitada daquela batatinha neste fim de semana～#nAté parece que eu ia fazer hora extra!"
201010-88 = ""
201010-90 = ""
201010-91 = "Meninas......"
201010-92 = "...... Pelo visto, vocês não vão me deixar em paz se eu não folgar, né?"
201010-93 = "Está bem. Vou tirar este fim de semana para descansar."
201010-94 = "Mas da última vez você falou a mesma coisa e ficou adiantando papelada no dormitório, esqueceu?"
201010-95 = "Você tem que descansar de verdade dessa vez."
201010-96 = ""
201010-97 = "[ns] \"Por isso mesmo a gente vai sair num encontro esse fim de semana, Rin-chan!\""
201010-98 = "Quem disse que é encon――"
201010-99 = ""
201010-101 = ""
201010-102 = "...... Com licença. Quem você acha que é para me chamar de \"Rin-chan\"? E de onde tirou essa história de \"encontro\"?"
201010-103 = "Não tem vergonha de sair disparando essas bobagens sem pensar?"
201010-104 = "Ou você costuma cantar as outras alunas desse mesmo jeito sem-vergonha......?"
201010-105 = "[s7] \"Depende da aluna, né......\"\n[s8] \"É que eu só queria ver você relaxando um pouco, Rin.\""
201010-108 = ""
201010-110 = ""
201010-111 = "...... Ai, que suspiro."
201010-112 = "Está bem. Então vou passar este fim de semana na companhia do Sensei."
201010-113 = "Até porque eu já estava querendo verificar de perto como o Sensei passa seus dias de folga."
201010-114 = "[s] \"Ué, por que isso do nada......?\""
201010-115 = "Dizem por aí que você fica caçando moedas embaixo de máquinas de refrigerante, ou jogado no meio da rua tomando sol feito gato vadio......#nÉ o que anda nos boatos."
201010-116 = "Tem algo a declarar sobre isso?"
201010-117 = "[s9] \"S-Sabe como é, né......\"\n[s10] \"Boato é boato, o povo adora aumentar......\""
201010-120 = "Entendo...... espero sinceramente que sejam apenas boatos."
201010-121 = "Então no sábado de manhã, nos encontramos na frente do prédio do Conselho Estudantil Federal."
201010-122 = ""
201010-124 = ""
201010-125 = ""
201010-126 = "E só mais uma coisa para encerrar――"
201010-127 = "Não é um encontro, ouviu bem?"
201010-129 = "No Próximo Episódio; A Folga da Administradora-Chefe (2)"
