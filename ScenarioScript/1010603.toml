[translation]
1010603-1 = "Другая я"
1010603-2 = "Получив сообщение от Сакурако, я отправился к месту, где мы договорились встретиться."
1010603-5 = "...А. Вы пришли, Сенсей."
1010603-6 = ""
1010603-8 = ""
1010603-9 = "[ns1] «...Сакурако?»\n[ns2] «На этот раз ты в монашеском облачении...»"
1010603-12 = "Да. Именно. ...И я ждала вас."
1010603-13 = "Я хотела поговорить с вами о том, что произошло... и заодно попросить совета."
1010603-14 = "Что за случай? Эм... Ну..."
1010603-15 = ""
1010603-17 = ""
1010603-18 = "...Сенсей."
1010603-19 = "Обычно я очень хорошо чувствую обстановку. Я наблюдаю за действиями каждого человека вокруг и оцениваю их."
1010603-20 = "Однако это не всегда давалось мне естественно. Я развила этот навык потому, что была вынуждена."
1010603-21 = "Чтобы не стать обузой для своей должности, организации и людей вокруг меня."
1010603-22 = "Будь то самая мелкая задача или личный вопрос, я всегда должна действовать и одеваться так, как подобает члену Сестринства."
1010603-23 = "В конце концов, одежда и манеры говорят о положении человека."
1010603-24 = "Но недавно, возвращаясь с репетиции, я всё ещё была в айдольском костюме."
1010603-25 = "Мне случайно встретились несколько сестёр, которые недавно вступили в организацию."
1010603-26 = "...И я, как обычно, с ними поздоровалась."
1010603-27 = ""
1010603-31 = "[ns3] «...? Хм? И что потом?»\n[ns4] «А в чём проблема...?»"
1010603-34 = "Ну... Видите ли..."
1010603-35 = "Возможно, они ещё не знали о мероприятии..."
1010603-36 = "...но в айдольском костюме они меня не узнали."
1010603-37 = "Ну..."
1010603-38 = "Разговор так и продолжился при огромном недоразумении: они решили, что я просто новая знакомая, совершенно не связанная с Сестринством."
1010603-39 = "Я попыталась всё прояснить, назвав своё имя, но из-за шума они решили, что я сказала «Сакура», а не «Сакурако»."
1010603-40 = "В итоге мы три часа пели караоке вместе."
1010603-41 = "[s5] «...О?»\n[s6] «Эм... Э-э-эм...»"
1010603-44 = "Я-я пыталась сказать им правду несколько раз! Просто каждый раз не получалось! Атмосфера... момент...!"
1010603-45 = ""
1010603-47 = ""
1010603-48 = "И, возможно, сказался айдольский костюм, но последним гвоздём в крышку гроба стало то, что..."
1010603-49 = "...я начала говорить совсем как другой человек. Совсем не как глава Сестринства. Думаю, это только усилило недоразумение."
1010603-50 = "Даже когда мы прощались, они называли меня «Сакурой»..."
1010603-51 = "Мы даже обменялись контактами... Что мне теперь делать?"
1010603-52 = "Обычно я никому не даю свой номер, если только это не связано с делами. Выходит, они до сих пор не знают, кто я."
1010603-53 = "Мне уже пришло сообщение о нашей следующей встрече. Вот, смотрите..."
1010603-54 = ""
1010603-56 = ""
1010603-57 = ""
1010603-59 = "«Сакура! В воскресенье в час дня! Не забудь!»"
1010603-61 = "«Остальные сказали, что согласны! Нам нужны твои вокальные навыки, Сакура!»"
1010603-63 = "«Я в тебя верю, Сакура!»"
1010603-66 = ""
1010603-68 = "[ns7] «...А ты довольно популярна, Сакура.»\n[ns8] «Так вот какая Сакура из альтернативной временной линии...»"
1010603-71 = "У-ух..."
1010603-72 = "В любом случае, я невольно обманула своих сестёр. Нужно исправить ситуацию."
1010603-73 = "Я боюсь, что если внезапно раскрою свою настоящую личность, то задену их чувства и расстрою."
1010603-74 = "В первую очередь это моя вина: я позволила одежде настолько повлиять на своё поведение."
1010603-75 = "Хм?"
1010603-76 = "...? Сенсей...? Что вы имеете в виду...?"
1010603-77 = "Это... не имеет значения...?"
1010603-78 = "Мне просто нужно честно сказать им правду? Н-Но тогда моя личность—"
1010603-79 = "[s9] «А что не так с твоей личностью?»\n[s10] «Ты старалась. Уверен, всё будет хорошо.»"
1010603-82 = "Д-Даже... если вы так говорите... это совсем другая проблема..."
1010603-83 = "Я уже не раз рассказывала вам, что остальные сёстры думают обо мне..."
1010603-84 = ""
1010603-86 = ""
1010603-87 = "...Эм... Сенсей..."
1010603-88 = "Это..."
1010603-89 = "Это... правда будет нормально? Просто взять и сказать им?"
1010603-90 = "Если честно, я и сама не хочу... продолжать что-то скрывать. Я хочу рассказать им правду."
1010603-91 = "...Да, понимаю."
1010603-92 = "Если подумать, эта ситуация немного отличается от тех, с которыми я сталкиваюсь обычно."
1010603-93 = "Обычно я оказываюсь связана тайнами или внутренними делами, из-за которых не могу свободно выражать себя."
1010603-94 = "Но эта конкретная ситуация касается только меня самой. И всё."
1010603-95 = "Какой бы ни оказалась правда, она не причинит вреда ни собору, ни Сестринству."
1010603-96 = "[s11] «Думаю, это правильный выбор.»\n[s12] «Ты можешь быть с ними честной.»"
1010603-99 = "Х-Хорошо. Тогда, как вы и говорите..."
1010603-100 = "*вздыхает* Фух."
1010603-101 = ""
1010603-103 = ""
1010603-106 = "Я им ответила. Когда встретимся, просто расскажу правду и извинюсь."
1010603-107 = "...Хи-хи."
1010603-108 = "Почему-то я начинаю довольно сильно нервничать из-за этого. Даже не помню, когда в последний раз чувствовала нечто подобное."
1010603-109 = "Спасибо, Сенсей. Возможно, мне нужна была не находчивость... а смелость."
1010603-110 = "Без ваших наставлений я бы не смогла прийти к такому настрою."
1010603-111 = "Как бы всё ни прошло... спасибо вам."
1010603-112 = "А что будет дальше..."
1010603-113 = "Я расскажу вам обо всех подробностях после этих выходных."
1010603-115 = "Я успокоил заметно тревожившуюся Сакурако, а затем вернулся в Шале."
