[translation]
10018005-1 = "Пролог; Не могли бы вы повторить?"
10018005-4 = "Вам понравилась еда?"
10018005-5 = ""
10018005-8 = ""
10018005-9 = "Да, определённо. Было довольно вкусно."
10018005-10 = "(Если честно, порции были немного маловаты...)"
10018005-11 = "(Но если учитывать размер ресторана и то, что всем занимается один человек, вполне сойдёт.)"
10018005-12 = "Особенно мне понравилось специальное озони."
10018005-13 = "Главное в хорошем озони — правильно поджаренный рисовый пирожок, а этот был идеально воздушным."
10018005-14 = "Остальные блюда тоже впечатлили."
10018005-15 = "Меню было простым и аккуратно приготовленным."
10018005-16 = ""
10018005-18 = ""
10018005-20 = "Жареная рыба была хороша."
10018005-21 = "Кожица получилась хрустящей, а мясо — хорошо промаринованным и мягким."
10018005-22 = "Всё было вкусно. Жаль только, что порции немного маловаты."
10018005-23 = "...Ты сказала бы это при любом размере порций."
10018005-24 = "Мне понравилось всё!"
10018005-25 = "Было бы ещё вкуснее, если добавить порошок карри, уксус и сироп!"
10018005-26 = "Это понравилось бы только тебе!"
10018005-27 = ""
10018005-29 = ""
10018005-31 = "Ха-ха. Давайте я оплачу счёт."
10018005-32 = "Спасибо. Я рада, что моими последними гостями оказались хорошие люди."
10018005-33 = ""
10018005-35 = ""
10018005-36 = "Последними гостями?"
10018005-37 = "Да... ресторан «Воробей» закрывается."
10018005-38 = ""
10018005-41 = ""
10018005-42 = "О?"
10018005-43 = "А?"
10018005-44 = "Что?! Почему?!"
10018005-50 = ""
10018005-51 = "Как жаль. Я была рада найти хороший ресторан."
10018005-52 = "Ага! Тут было очень вкусно. Я бы съела здесь что угодно!"
10018005-53 = "От тебя это не такой уж большой комплимент..."
10018005-54 = "Но ведь тебя тоже впечатлило, правда, Джунко?"
10018005-55 = ""
10018005-57 = ""
10018005-58 = "Ну..."
10018005-59 = "Наверное, я просто думала о том, как давно не пробовала ничего настолько вкусного."
10018005-60 = "И каждый раз, когда нам попадается что-то действительно вкусное, потом почему-то обязательно случается какая-нибудь неприятность."
10018005-61 = "Мне кажется, это в основном только с тобой, Джунко. ★"
10018005-62 = "Только со мной?! Не делайте вид, будто обычно виноваты не вы!"
10018005-63 = "Интересно, сможем ли мы когда-нибудь снова найти ресторан вроде этого."
10018005-64 = "Такое чувство, будто мы только что нашли сокровище, а его тут же крадут прямо у нас на глазах."
10018005-65 = "Из-за маленьких порций это небольшое сокровище, но аналогия мне нравится."
10018005-66 = ""
10018005-68 = ""
10018005-70 = ""
10018005-71 = ""
10018005-72 = "Мы так просто не сдадимся."
10018005-73 = ""
10018005-76 = ""
10018005-77 = "Что ты имеешь в виду? Мы ведь всё равно ничего не можем сделать."
10018005-78 = "Ты права. Если бы мы узнали об этом месте немного раньше, могли бы его прорекламировать, но теперь..."
10018005-79 = "Теперь нам остаётся только смотреть, как оно исчезает... Немного грустно."
10018005-81 = "Хи-хи. Думаешь, у меня нет плана?"
10018005-82 = "Возможно, я знаю людей, которые могли бы..."
10018005-83 = "...протянуть руку помощи."
