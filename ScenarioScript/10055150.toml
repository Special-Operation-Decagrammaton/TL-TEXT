[translation]
10055150-1 = "A poor caravan that followed the beach to get here."
10055150-3 = "Tiger Shark-maru! You are the strongest in the hermit crab world!"
10055150-4 = "And by extension, the strongest crustacean of all!"
10055150-5 = "Ugh... I think the heat is making me hear things, old man."
10055150-11 = "That’s a bit harsh, don't you think, Nonomi-chan?"
10055150-13 = "A poor caravan that #nfollowed the beach#n to get here."
10055150-18 = "What! A hermit crab aiming for the title of strongest crustacean!"
10055150-19 = "You're a hundred, no, a thousand years too early for that!"
10055150-21 = "Who are you people...!?"
10055150-22 = "...!"
10055150-23 = "............?"
10055150-24 = "Who is it?"
10055150-25 = "Did you forget? We're the Abydos Student Council."
10055150-26 = "Uh, what was the name again...?"
10055150-27 = "The Foreclosure Task Force. It's a student council made up of all five students in the school."
10055150-28 = "I see, so just some small-time student council. No wonder I don't remember you."
10055150-29 = "Please don't say that right in front of them..."
10055150-30 = "She really said it~ High school girls these days are scary~"
10055150-31 = "We're high school girls too, you know!? We're the same age!"
10055150-32 = "Ahaha... If the rumors are true, they might actually be older than us..."
10055150-33 = "Small-time student council...?"
10055150-34 = "Oh no! Shiroko-senpai is...!"
10055150-38 = "Retract that."
10055150-39 = "Hm? Who are you?"
10055150-40 = "Sunaookami Shiroko. Retract what you just said about us being a small-time student council."
10055150-41 = "Hoh, you've got spirit. But I am merely stating the facts."
10055150-42 = "Compared to Gehenna, one of Kivotos's three major academies, Abydos only has five students. #nThere's no need to even compare us."
10055150-43 = "We aren't weak. You'll see if we compete."
10055150-44 = "Compete?"
10055150-45 = "Yeah, the rules are simple. The winner is the strong, the loser is the weak."
10055150-46 = "Hmph, the logic of power, is it? It lacks class, but it's simple enough to understand."
10055150-47 = "Wait, are we fighting!?"
10055150-48 = "Fighting is... not okay."
10055150-49 = "Shiroko-chan. This vibe... I think everyone is misunderstanding something?"
10055150-50 = "Ah, sorry."
10055150-51 = "What I meant to say was..."
10055150-55 = "I challenge the Pandemonium Society to a 'Crab Fight'."
10055150-59 = "A crab... fight?"
10055150-60 = "I don't really get it, but fine! #nHehehe, it's the Makoto-sama way to accept any challenge thrown my way!"
10055150-61 = "Do it, Iroha! Wipe them out!"
10055150-62 = "Eh? You're picking me for this?"
10055150-63 = "What are you talking about? I have no idea what this is, so there's no way I'm doing it."
10055150-64 = "Me neither!"
10055150-65 = "Since it's called a 'Crab Fight,' it must be a battle, right? #nBesides, you've already got a partner, that 'Red Crayfish,' so it's quite convenient."
10055150-66 = "That's a crayfish over there, you know!? There's no way it can be an opponent!?"
10055150-67 = "You can do anything if you have enough spirit!"
10055150-68 = "Ugh, seriously! Don't complain to me if we lose, okay!?"
10055150-70 = "Ugh~ so that's how it is~"
10055150-71 = "If I step in now, I'll be the one who can't read the room~"
10055150-72 = "In that case..."
10055150-73 = "Maybe I should ask Ayane-chan?"
10055150-74 = "W-wait, me!?"
10055150-75 = "How unpleasant. Do you think you can win against us, the Pandemonium Society, by holding back?"
10055150-76 = "What are you saying~ #nAyane-chan is a super-duper elite who served as student council president even as a first-year~?"
10055150-77 = "Yeah, she's the scariest when she's angry."
10055150-78 = "Hoshino-senpai!? Even Shiroko-senpai!?"
10055150-79 = "I see, a secret weapon, is it?"
10055150-80 = "Hehehe! And on this side, we have a sacrificial pawn. If we win, it's a stroke of luck; if we lose, it's no loss at all!"
10055150-81 = "Who are you calling a sacrificial pawn!"
10055150-82 = "Alright, both crabs, take your positions~☆"
10055150-86 = "Crab... FIGHT!!"