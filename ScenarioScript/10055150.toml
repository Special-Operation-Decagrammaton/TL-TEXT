[translation]
10055150-1 = "Нищий караван вдоль побережья"
10055150-2 = ""
10055150-3 = "Тайгершаркмару! Сильнейший среди всех раков-отшельников!"
10055150-4 = "Вперёд, покори всех остальных ракообразных!"
10055150-5 = "Хе... Может, этому дедуле уже от жары чудится всякое."
10055150-6 = ""
10055150-8 = ""
10055150-9 = ""
10055150-10 = ""
10055150-11 = "Стоит нам взглянуть, Нономи?"
10055150-12 = ""
10055150-13 = "Нищий караван#nвдоль побережья"
10055150-16 = ""
10055150-18 = "Ещё как! Этот маленький рак-отшельник стремится стать сильнейшим среди ракообразных?"
10055150-19 = "Не в ближайшие сто лет! Да и тысяча не хватит! ♧"
10055150-21 = "Кого я вижу..."
10055150-22 = "...!"
10055150-23 = "...?"
10055150-24 = "...Кто вы?"
10055150-25 = "Это же студсовет Абидоса, помнишь?"
10055150-26 = "Как они себя там называют?"
10055150-27 = "Комитет контрмер. Это и студсовет, и вообще все студенты их академии."
10055150-28 = "А, жалкий студсовет какой-то безвестной академии. Неудивительно, что я о них забыла."
10055150-29 = "Ну так скажи это им прямо в лицо."
10055150-30 = "Какая грубость! Нынешние студенты совершенно не знают манер!"
10055150-31 = "Вы ведь ровесники, понимаешь? Она тоже председатель студсовета."
10055150-32 = "Ахаха... Я слышала слухи, что на самом деле она старше..."
10055150-33 = "...«Жалкий»?"
10055150-34 = "Ой-ой. Широко услышала."
10055150-35 = ""
10055150-37 = ""
10055150-38 = "Забери свои слова обратно."
10055150-39 = "Хм? А ты у нас кто...?"
10055150-40 = "Сунаооками Широко. Немедленно забери всё, что сказала о нашей школе и нашем студсовете."
10055150-41 = "О, какова дерзость! Мне нравится твоя смелость, но я лишь констатировала факты."
10055150-42 = "Геенна — одна из трёх крупнейших академий Кивотоса. А ваша разваливается на части, и в ней осталось ПЯТЬ студентов. Сравнивать тут нечего."
10055150-43 = "Это не делает нас слабыми. Мы можем сразиться с вами в любой день."
10055150-44 = "Вот как?"
10055150-45 = "Да. Сильные победят. Слабые проиграют."
10055150-46 = "Хмф. Испытание силой. Довольно неизящно, но если других доводов вы не понимаете..."
10055150-47 = "Ого, они сейчас подерутся?"
10055150-48 = "Нет, никаких драк! Мы должны дружить!"
10055150-49 = "У тебя очень грозное лицо, Широко. Не хочешь же ты, чтобы о нас подумали неправильно? ☆"
10055150-50 = "Ой, извини."
10055150-51 = "Я имела в виду..."
10055150-52 = ""
10055150-54 = ""
10055150-55 = "Вызываю Общество Пандемониум на крабовый поединок!"
10055150-56 = ""
10055150-58 = ""
10055150-59 = "Крабовый... поединок?"
10055150-60 = "Никогда о таком не слышала, но будь по-твоему! Вызов принят!"
10055150-61 = "Вперёд, Ироха! Разнеси их!"
10055150-62 = "Что? Почему я?"
10055150-63 = "Я же ТОЛЬКО ЧТО сказала: «Никогда о таком не слышала»! Не могу же я вступить в бой совершенно вслепую!"
10055150-64 = "Я ТОЖЕ никогда о нём не слышала!"
10055150-65 = "Но я полагаю, он как-то связан с крабами, верно? А у тебя как раз появился собственный «красный рак-отшельник»!"
10055150-66 = "У них РЕЧНОЙ РАК! Он даже в другой весовой категории!"
10055150-67 = "Недостаток веса компенсирует СИЛА ДУХА!"
10055150-68 = "Да делайте что хотите. Только не вините меня, если проиграем."
10055150-70 = "Хе, значит, вот как вы решили играть."
10055150-71 = "Этот дедуля посидит в сторонке, чтобы не портить веселье."
10055150-72 = "Ну..."
10055150-73 = "Может, ты этим займёшься, Аяне?"
10055150-74 = "М-меня?! Почему вдруг я?!"
10055150-75 = "Вы поддаётесь Обществу Пандемониум? Какое оскорбление."
10055150-76 = "А, ты не знаешь Аяне. Она первокурсник, но у неё целых три выдающихся качества, и она уже руководила студсоветом."
10055150-77 = "Ага, ты видела её в гневе?"
10055150-78 = "Хошино?! Широко, и ты туда же?!"
10055150-79 = "Понятно! Значит, она ваше секретное оружие."
10055150-80 = "Кихехе! А у нас всего лишь пешка на заклание! Победит — замечательно! Проиграет — ничего не потеряем!"
10055150-81 = "Твоя пешка на заклание, между прочим, всё слышит..."
10055150-82 = "Ну что, крабы, оба выходите! ☆"
10055150-83 = ""
10055150-85 = ""
10055150-86 = "Крабовый поединок!!"
