[translation]
10059070-1 = "Chapter 7: Regrouping"
10059070-2 = "――That is the message from the broker."
10059070-3 = "Well done, Vice President Urara. #nTo have successfully made contact with the broker and even secured a venue for negotiations."
10059070-4 = "To commemorate this moment, let us decide on a keepsake."
10059070-5 = "……In that case, I shall present you with this hair ornament. #nIt is a favorite of mine, but it will suit you well, Vice President Urara."
10059070-6 = "Th-thank you very much……!"
10059070-12 = "[ns] \"One week from now, in the slums near the Black Market, right?\""
10059070-13 = "Yes. #nThough, while we call it a negotiation…… it is effectively a declaration of war."
10059070-14 = "I apologize. #nI wish I could have secured more favorable terms……."
10059070-15 = "No, it is a blessing enough that we have secured a venue. #nI never expected this to be resolved through mere discussion from the start."
10059070-16 = "The other party likely feels the same. #nThey will surely bring every force they can muster."
10059070-17 = "We, too, shall meet them with the full strength of the academy."
10059070-18 = "Vice President Urara."
10059070-19 = "……Yes! I will draft a training schedule for the Dormitory Wardens in preparation for D-Day."
10059070-20 = "Secretary Kanon."
10059070-21 = "I will organize the information regarding the broker and the Black Market, #nand examine the most efficient strategy."
10059070-22 = "As expected, you are both reliable. I leave it to you."
10059070-23 = "[s] \"What should I do?\""
10059070-24 = "Sensei…… could you please look after the students?"
10059070-25 = "They are all quite heartbroken over this incident."
10059070-26 = "Rather than having me, one of the causes of this, reach out to them, #nit would be better for them to be comforted by you, whom they adore."
10059070-27 = "[s1] \"If you think so, let's go together.\"\n[s2] \"That way, everyone will feel more at ease.\""
10059070-30 = "Me, with Sensei……?"
10059070-31 = "Fufu. That is an interesting proposal, but…… #nunfortunately, I have work that must be finished."
10059070-32 = "Let us save this date for another opportunity."
10059070-33 = "Oh my. A bold invitation for a date from Sensei to a student――"
10059070-34 = "This will not do. I must record this properly and pass it down to future generations."
10059070-35 = "[s] \"Your records are distorted……!\""
10059070-39 = "Records are often rewritten to suit one's convenience."
10059070-40 = "Especially the records of the powerless; they are painted over into stories that favor the strong."
10059070-41 = "That is precisely why we must win this battle."
10059070-42 = "Everyone, please steel your resolve."
10059070-47 = "(Afterward, I visited the Wildhunt students to encourage them.)"
10059070-69 = "(Though their positions differed, #ntheir desire for a swift resolution to this situation was the same.)"
10059070-70 = "[ns] \"I hope it ends safely…….\""
10059070-71 = "(And so, time passed――)"
10059070-83 = "[ns] \"Is it already this late…….\""
10059070-85 = "[ns] \"I should probably head back to Schale.\""
10059070-87 = "(I cast a glance at the main building, where the lights are still on.)"
10059070-90 = "[ns3](Is Manami still there?)\n[ns4] I head to the Council Room in the main building."
10059070-103 = "[ns] \"……Manami?\""
10059070-105 = "Sensei? How long have you been there……?"
10059070-106 = "[s5] \"Sorry. I didn't mean to peek.\"\n[s6] \"I knocked, but there was no answer.\""
10059070-109 = "Oh. It seems I was more focused than I realized."
10059070-110 = "I thought I would finish at least some of the paperwork."
10059070-111 = "After all, we do not know what might happen next."
10059070-112 = "Setting that aside, what brings you here at this hour? #nI assumed you had already returned to Schale."
10059070-113 = "[s] \"I saw the lights on my way out.\""
10059070-114 = "Fufu. Are you familiar with the saying, 'Curiosity killed the cat'?"
10059070-115 = "……Yes? And you would say that you are not a cat, so it is not a problem?"
10059070-116 = "……."
10059070-120 = "It has been a long time since someone stepped into my personal space without any hesitation."
10059070-121 = "In this academy, there are only two people who do not fear me."
10059070-122 = "Secretary Kanon and Dormitory Warden Captain Sayo."
10059070-123 = "Everyone else always braces themselves when they stand before me."
10059070-124 = "Even Vice President Urara seems somewhat tense when we are alone."
10059070-125 = "And yet, Sensei, you do not avoid me."
10059070-126 = "Me, who leads this academy while being feared by many students and called self-righteous and arbitrary."
10059070-127 = "[s] \"As a teacher, I want to get along with my students.\""
10059070-130 = "……."
10059070-131 = "Does that mean that even I, the Council President, am just a student in your eyes……?"
10059070-132 = "……."
10059070-133 = "That is…… refreshing. That was not a bad answer."
10059070-137 = "Is someone in there?"
10059070-142 = "Hmm……? The Council President and Sensei?"
10059070-143 = "The lights were on, so I came to check if you'd forgotten to turn them off……."
10059070-144 = "Thank you for your concern."
10059070-145 = "I still have matters to discuss with Sensei, so I will handle locking up."
10059070-146 = "Matters…… this late at night?"
10059070-147 = "……Oh?"
10059070-151 = "Ah, I see."
10059070-152 = "Fufu, don't worry, I won't tell anyone."
10059070-153 = "Well then, take your time."
10059070-154 = "S-Sayo, Dormitory Warden Captain……?"
10059070-159 = "……."
10059070-160 = "……It seems we have invited an unnecessary misunderstanding."
10059070-161 = "Shall we call it a night? Sensei, you should head home as well."
10059070-162 = "[s] \"I'd like to talk with Manami a little longer, though.\""
10059070-163 = "……."
10059070-164 = "You truly do not know the meaning of restraint, do you?"
10059070-165 = "Fufu, very well. #nSince you have challenged me, it is the duty of the Council President to respond."
10059070-166 = "Shall we change locations and continue our conversation a little longer?"
10059070-167 = "[s] \"A quiet place…… want to come to Schale?\""
10059070-171 = "Fufu…… fufufu……."
10059070-172 = "You would bring a student in at this hour? #nWithout any prior arrangement?"
10059070-173 = "Naturally, that is denied."
10059070-174 = "……It troubles me when you look so disappointed. #nNo means no."
10059070-175 = "Instead…… I shall guide you to another place."
10059070-176 = "A secret place of my own, which I have never shown to anyone else."
10059070-177 = "My――"
10059070-182 = "Personal museum."
10059070-183 = "[s] \"Is it okay for me to go?\""
10059070-184 = "On the contrary, I thought it was the perfect opportunity."
10059070-185 = "There is no place more suitable for us to understand each other's artistic sensibilities."
10059070-186 = "The only thing remaining is your will, Sensei…… what will you do?"
10059070-187 = "[s7] Nod.\n[s8] Nod vigorously multiple times."
10059070-190 = "Very well. Then, I shall guide you."
10059070-191 = "Please, do not disappoint me."
10059070-195 = "Here we are. This is――"
10059070-200 = "My personal museum."
10059070-201 = "What do you think? What are your impressions now that you have seen it?"
10059070-202 = "[s9] (There are art pieces, but also things that look like junk……)\n[s10] \"There are all sorts of things here……?\""
10059070-205 = "That reaction…… it seems you still do not understand."
10059070-206 = "To not understand the value of this…… that is minus 100 points."
10059070-207 = "[s] \"Ugh……!\""
10059070-208 = "However, it is no surprise that you cannot understand it by conventional standards."
10059070-209 = "It is not the public or critics who decide the value of my collection, but I myself."
10059070-210 = "It is art that I—and no one else—have selected for my own sake."
10059070-211 = "The emotions dwelling within them are things that awaken memories even as time passes."
10059070-212 = "I told you before, did I not? That collecting is an 'art of sensation'."
10059070-216 = "[ns] \"Oh. That ticket, could it be……?\""
10059070-217 = "You noticed."
10059070-218 = "It is the ticket you signed when we first met."
10059070-219 = "Depending on your future actions, Sensei, this child will either continue to be displayed here #nor end up in the trash."
10059070-220 = "[s] \"Don't throw away memories!\""
10059070-221 = "Fufu, you always give such a good reaction."
10059070-222 = "Rest assured, I am joking."
10059070-223 = "I would not keep anything here that I could discard just because I changed my mind."
10059070-224 = "That ticket, too, holds significant meaning as a symbol of our relationship with Schale."
10059070-225 = "……Everything in this place is special to me."
10059070-226 = "Each and every one has its own time and story."
10059070-227 = "If I were to tell you all the thoughts dwelling within them, days would not be enough."
10059070-228 = "……Perhaps that is why."
10059070-229 = "When I gaze at these children, I find myself drawn into the emotions they hold."
10059070-230 = "Happiness, glory, joy, frustration, sadness, overcoming…… everything remains here."
10059070-231 = "What do you think, Sensei?"
10059070-232 = "Does it still look like a collection of suspicious junk?"
10059070-233 = "[s] \"……No.\""
10059070-237 = "[ns] \"It's a very wonderful museum.\""
10059070-238 = "Fufu, I like that. #nPlus 50 points――that brings your current score to minus 50 points."
10059070-239 = "You need 50 more points to finally reach zero, so please keep trying."
10059070-240 = "[s] \"I can't believe I haven't even reached zero yet…….\""
10059070-241 = "Even zero is a high score by my standards, you know?"
10059070-242 = "By the way, when we first met, you were at minus 5000 points."
10059070-243 = "[s] \"Eh……!?\""
10059070-244 = "Sensei, you are slowly recovering from the deductions you have accumulated."
10059070-245 = "If you keep up this effort, a final score of 10 points is not a dream."
10059070-246 = "[s] \"I want you to at least make it 100 points!\""
10059070-247 = "Fufu, we shall see."
10059070-248 = "If you keep this museum a secret, it might be worth considering."
10059070-249 = "[s11] \"Speaking of this museum……\"\n[s12] \"It seems like some strange rumors are spreading…….\""
10059070-255 = "A place where special Wildhunt art pieces sleep in secret."
10059070-256 = "A forbidden sanctuary that has not been revealed to even a single student."
10059070-257 = "The greatest art repository in Kivotos, born from the desires of the Council President."
10059070-258 = "……Such rumors do exist."
10059070-259 = "I am aware of them. They seem to have been greatly embellished, though."
10059070-260 = "However…… it is not as if they are entirely nonsensical."
10059070-261 = "It is true that the items here are special, that I have not revealed them to anyone――#nand that this place was born from my own desires."
10059070-262 = "……But my desires do not end here."
10059070-263 = "Someday, I intend to build a museum much larger than this one."
10059070-264 = "A museum that houses not just my own memories, but the memories of every student."
10059070-265 = "I hope that the memories left there will become a pillar of support for students chasing their dreams."
10059070-266 = "What do you think? Don't you think it would be a wonderful museum?"
10059070-267 = "[s] \"That's a dream worthy of a curator.\""
10059070-268 = "Fufu. Yes. I want to be a curator for everyone."
10059070-269 = "That is the reason I became Council President."
10059070-270 = "[s13] (Even though Manami stands at the pinnacle of the Art Academy)\n[s14] (Why would such a student have the dream of a curator?)"
10059070-273 = "(The moment I thought that, an art piece on the display shelf caught my eye.)"
10059070-276 = "(It was a tiara.)"
10059070-277 = "(But it didn't look like just any ordinary tiara.)"
10059070-278 = "[ns15] (……I feel like I've seen something very similar somewhere.)\n[ns16] \"………….\""
10059070-282 = "Sensei?"
10059070-286 = "[ns] \"……We will win, Manami.\""
10059070-288 = "[ns] \"For the sake of every student at Wildhunt Art Academy.\""
10059070-290 = "Yes. Let us win."
10059070-291 = "……Without fail."
10059070-293 = "(Afterward, while continuing to talk with Manami, I solidified my resolve for the coming battle.)"
10059070-294 = "[ns] \"By the way, what was my final score for today?\""
10059070-295 = "――10 points."
10059070-296 = "[s] \"Finally a perfect score!?\""
10059070-297 = "Out of 100 points, that is."
10059070-298 = "[s] \"Ughhhhh……!\""
