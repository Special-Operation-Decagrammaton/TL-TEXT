[translation]
34250-1 = "Episódio 25;Uma Pessoa Importante"
34250-3 = "[ns] \"Vocês estão todas bem?\""
34250-4 = "Sim... por um triz."
34250-5 = "É..."
34250-6 = "A-Agora acabou de verdade, né...?"
34250-7 = "E a Beatrice..."
34250-8 = "[s] \"Ela fugiu.\""
34250-12 = "Fugiu...?"
34250-13 = "[s] \"Mas acho que ela nunca mais vai fazer vocês sofrerem.\""
34250-14 = "..."
34250-15 = "..."
34250-16 = "..."
34250-23 = "Sensei, obrigada por nos salvar."
34250-24 = "[s] \"Você não precisa mais usar a máscara?\""
34250-25 = "...Sim, está tudo bem."
34250-26 = "Eu não sabia por que a Madame fazia tanta questão que eu usasse a máscara, mas..."
34250-27 = "Quando fui atingida pela bomba da Azusa, havia um dispositivo que protegeu o meu corpo...#nAcho que ela era necessária para ativá-lo."
34250-28 = "No fim das contas, a Madame provavelmente me fazia usar essa máscara para me proteger."
34250-29 = "[s1] \"Então que tal continuar usando quando for preciso daqui pra frente?\"\n[s2] \"Porque muita gente ficaria triste se a Atsuko se machucasse.\""
34250-30 = "..."
34250-31 = "..."
34250-32 = "Tem razão... Vou usar a máscara de vez em quando."
34250-33 = "...Sensei."
34250-34 = "Como prometido... você salvou a Princesa, então...#nfaça comigo o que quiser."
34250-35 = "[s] \"O que eu quiser...?\""
34250-36 = "Eu sou a culpada por tudo... O incidente do Tratado do Éden, o ataque à Seia, o ataque à Nagisa...#nA Misaki, a Hiyori, a Atsuko... Todas acabaram assim por minha causa."
34250-37 = "Não importa se for para o Conselho Estudantil Geral, para Trinity... para o Departamento Correcional ou qualquer outro lugar.#nMe mande para onde achar mais adequado, Sensei."
34250-39 = "Mas o que você...?!"
34250-40 = "L-Líder...?!"
34250-41 = "..."
34250-42 = "P-Pare de besteira, Líder... Só você sozinha...?!"
34250-44 = "Não... Por muito tempo, eu vivi fugindo das responsabilidades que deveria assumir..."
34250-45 = "Assim está bom... Chegou a hora."
34250-46 = "L-Líder..."
34250-48 = "[ns3] \"...\"\n[ns4] \"...Tem razão. Você precisa assumir a responsabilidade, Saori.\""
34250-52 = "[ns] \"Por muito tempo, você deu duro para proteger as garotas ao seu redor, Saori.\""
34250-55 = "[ns5] \"Cuidando dos outros, protegendo,\"\n[ns6] \"suportando... e assumindo responsabilidades.\""
34250-59 = "[ns7] \"E acho que foi justamente por isso que, tendo recebido uma educação distorcida em um ambiente absurdo,\"\n[ns8] \"você acabou fazendo as escolhas erradas.\""
34250-64 = "[ns] \"Vocês são alunas rebeldes que cometeram crimes... isso não muda.\""
34250-65 = "..."
34250-66 = "..."
34250-67 = "..."
34250-69 = "[ns] \"Mas isso não significa que vocês mereçam sofrer.\""
34250-72 = "[ns9] \"Quando crianças sofrem, a culpa não é delas.\"\n[ns10] \"A responsabilidade por ter criado um mundo onde crianças sofrem é minha, como adulto.\""
34250-75 = "O-O que está dizendo...?! Como assim...?!"
34250-76 = "Então... afinal de contas... que responsabilidade eu devo assumir...?"
34250-78 = "..."
34250-79 = "Líder..."
34250-80 = "..."
34250-86 = "[ns] \"A responsabilidade que você deve assumir é pela sua própria vida, Saori.\""
34250-87 = "...E-Eu não entendo o que isso quer dizer."
34250-88 = "...Eu acho que consigo entender."
34250-89 = "Princesa...?"
34250-90 = "Saori, tem alguma coisa que você queira fazer?"
34250-94 = "A Azusa disse que aprender é divertido.#nE que estar junto das amigas é uma felicidade."
34250-99 = "Do que você gosta, Saori? O que quer fazer? Quais são os seus hobbies?"
34250-100 = "E a sua comida favorita?#nAté hoje, eu nunca ouvi você falar de nenhuma dessas coisas."
34250-101 = "Qual é o seu sonho para o futuro, Saori?#nTem algo que você queira se tornar?"
34250-103 = "...I-Isso... esse tipo de coisa..."
34250-104 = "Eu não sei... Nunca parei para pensar em nada disso..."
34250-105 = "Do que eu gosto, o que eu quero fazer... Eu não sei absolutamente nada..."
34250-107 = "A Saori tem um forte senso de responsabilidade... tem poder de decisão... hum..."
34250-108 = "E-Ela é muito boa ensinando... várias coisas... Embora dê medo quando está nos ensinando..."
34250-109 = "E ela é bem dedicada. Além de ser ótima fazendo planos e liderando."
34250-114 = "..."
34250-115 = "[ns] \"Entendi... Nesse caso, no futuro, a Saori...\""
34250-117 = "[ns] \"Talvez possa se tornar uma boa professora.\""
34250-118 = "...!!!"
34250-121 = "A Líder... p-professora...?!"
34250-122 = "Bom, é meio difícil de imaginar."
34250-123 = "Não, imagina.#nEu acho que combinaria muito com ela... não acham?"
34250-125 = "...Não sei. Será que... realmente existe um futuro assim para mim...?"
34250-129 = "Isso... O significado de assumir a responsabilidade pela minha vida, as coisas de que gosto, um futuro assim... Eu não sei de nada..."
34250-130 = "Eu..."
34250-131 = "...Eu tenho mesmo... o direito de continuar vivendo?"
34250-132 = "[s] \"Essa resposta, você mesma vai encontrar.\""
34250-133 = "..."
34250-136 = "..."
34250-137 = "..."
34250-138 = "..."
34250-142 = "[ns] \"Bom, então é aqui que nos despedimos.\""
34250-144 = "O quê...?!#nAssim de repente... Espere, Sensei?!"
34250-145 = "[s] \"Ainda tem uma aluna que precisa de ajuda.\""
34250-147 = "E-Espere...!!"
34250-148 = "Eu... Nós..."
34250-152 = "Não, entendi..."
34250-153 = "Encontrar isso é a minha..."
34250-154 = "[s] \"Como adulto, eu garanto a você — você com certeza vai encontrar essa resposta.\""
34250-155 = "...!!"
34250-161 = "E-Ele já foi...?"
34250-162 = "...Deve ter ido salvar a Mika."
34250-163 = "S-Será que ele vai ficar bem sozinho...?"
34250-165 = "...Acho que vai ficar tudo bem. Naquela vez também foi assim."
34250-166 = "Naquela vez...?"
34250-167 = "O Sensei é um adulto, então tenho certeza de que ele tem algum jeito."
34250-168 = "A Beatrice já não está mais aqui, e tudo o que oprimia o Distrito Autônomo de Arius desapareceu."
34250-169 = "..."
34250-170 = "Líder..."
34250-171 = "Saori, tudo bem...?"
34250-172 = "Sim...#nEu ainda... não sei de nada, mas... mesmo assim..."
34250-178 = "Pela primeira vez... consegui sentir que tudo bem eu existir neste mundo."
34250-193 = "Cof... cof."
34250-196 = "...Ah, cara, estou todinha acabada..."
34250-197 = "Mas... consegui aguentar até o sol nascer... Foi bem difícil, viu..."
34250-198 = "A Atsuko com certeza foi salva, né?"
34250-199 = "A Saori, o resto do esquadrão... Será que todas conseguiram ter um final feliz?#nO Sensei devia estar com elas, então com certeza..."
34250-203 = "É... Se foi assim, então está ótimo..."
34250-211 = "Desculpa, Sensei... Acho que para mim já deu..."
34250-212 = "Eu queria tanto... ter voltado junto com você, Sensei..."
34250-230 = "[ns] \"Espere!!!\""
34250-232 = "Se-Se... Sensei?!"
34250-233 = "[s] \"Desculpe a demora, Mika.\""
34250-234 = "S-Sensei... Por que você está aqui...?#nC-Como...?!"
34250-235 = "[s] \"Eu não disse? Eu estou sempre do seu lado, Mika.\""
34250-236 = "...!!"
34250-237 = "[s] \"Quando a Mika está em apuros, é claro que eu venho correndo.\""
34250-238 = "N-Não pode ser... E-Eu sou... uma garota má..."
34250-239 = "Eu não sou alguém que valha a pena você salvar, Sensei..."
34250-246 = "A-Além do mais... C-Como você vai enfrentar aquela Irmandade dos Santos sozinho, Sensei...?"
34250-247 = "Aquilo está em outro nível, Sensei...#nE-Eu até que sou bem forte, mas... aquilo já é apelação?!"
34250-248 = "Sensei, por favor, pare!#nEu não tenho todo esse valor... Ainda dá tempo, fuja...!!"
34250-249 = "[s] \"Você é uma aluna problemática, Mika.\""
34250-251 = "[ns11] \"Mas, mesmo que você seja uma aluna rebelde cheia de problemas...\"\n[ns12] \"Não existe em lugar nenhum um professor que dê as costas para uma aluna em perigo!\""
34250-254 = "[ns] Pegar o Cartão de Adulto."
34250-258 = "[ns] \"...Com a minha.\""
34250-260 = "[ns13] \"O que pensam que estão fazendo com a minha preciosa aluna?!\"\n[ns14] \"O que pensam que estão fazendo com a minha preciosa princesa?!\""
34250-261 = "?!"
34250-263 = "...Wao."
