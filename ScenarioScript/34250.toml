34250-23 = "Сенсей, спасибо, что помогли нам."
34250-24 = "[s] «Я рад, что ты в порядке. Тебе нужна маска?»"
34250-25 = "...Думаю, я справлюсь."
34250-26 = "Эту маску мне дала Мадам."
34250-27 = "Когда я попала под бомбу Азусы, какое-то устройство защитило меня. Думаю, оно было в маске."
34250-28 = "Наверное, это была страховка Мадам. Чтобы я не умерла до ритуала."
34250-29 = "[s1] «Тогда надевай её, когда понадобится.»\n[s2] «Многие расстроятся, если ты пострадаешь, Ацуко.»"
34250-30 = "..."
34250-31 = "..."
34250-32 = "Ты прав. Думаю, мне больше не нужно скрывать голос... но я буду беречь себя."
34250-33 = "Хорошо. Сенсей."
34250-34 = "Мы спасли Химэ. Теперь можете сделать всё, что считаете нужным."
34250-35 = "[s] «Всё, что считаю нужным...?»"
34250-36 = "Я была виновницей всего... Инцидента с Эдемским договором, нападений на Сэю и Нагису... боли Мисаки, Хиёри и Ацуко... За всё отвечаю я."
34250-37 = "Генеральный студенческий совет, Тринити... или Исправительное бюро... Отправьте меня туда, куда сочтёте правильным."
34250-39 = "Что ты говоришь, Саори?"
34250-40 = "Л-Лидер?!"
34250-41 = "..."
34250-42 = "Плохая шутка, лидер."
34250-44 = "Нет... Я причинила слишком много вреда и не понесла последствий."
34250-45 = "Но теперь я готова. Я хочу взять ответственность."
34250-46 = "Л-Лидер..."
34250-47 = ""
34250-48 = "[ns3] «.........»\n[ns4] «Ты права. На тебе действительно много ответственности, Саори.»"
