34250-55 = "[ns5] «Ты заботилась о них, защищала их и терпела боль.»\n[ns6] «Ты несла эту ответственность в одиночку.»"
34250-59 = "[ns7] «Ты выросла словно сквозь бетон и была вынуждена приспосабливаться.»\n[ns8] «Ты принимала ужасные решения и усвоила ещё худшие уроки.»"
34250-62 = ""
