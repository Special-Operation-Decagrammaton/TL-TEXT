[translation]
1006905-1 = "Клиент всегда..."
1006905-2 = "Променад Чёрной Черепахи"
1006905-3 = "После дела в Шаньхайцзине Руми пригласила меня заглянуть на Променад Чёрной Черепахи."
1006905-4 = ""
1006905-6 = ""
1006905-7 = "Спасибо, что пришли, Сенсей."
1006905-8 = "Что будете заказывать?"
1006905-9 = "[s] «Я бы хотел... фирменное блюдо от шефа.»"
1006905-10 = "А, значит, вот чего вы хотите, хм?"
1006905-11 = "Как раз кстати — я НАСТОЯТЕЛЬНО рекомендую фирменное блюдо от шефа."
1006905-12 = "Только учтите: сегодняшнее блюдо я придумала буквально только что."
1006905-13 = "[s] «Э-Это ведь... не очередной эксперимент с дегустацией... да?»"
1006905-14 = "Ха-ха-ха! Не переживайте."
1006905-15 = ""
1006905-18 = "Какого чёрта? Кто это приготовил?!"
1006905-20 = "[ns] «Что за шум?»"
1006905-21 = "А... Прошу прощения. Мне нужно с этим разобраться."
1006905-22 = ""
1006905-24 = ""
1006905-27 = "Смотрите! Я нашёл волос в своей еде!"
1006905-28 = "Все говорят, что Променад Чёрной Черепахи такой замечательный. И как вы тогда объясните ВОТ ЭТО?!"
1006905-29 = "Не может быть... Мы проверяем каждое блюдо дважды и трижды, прежде чем оно покинет кухню!"
1006905-30 = "Уверена? Тогда откуда здесь этот волос, а?!"
1006905-32 = "Или вы все настолько некомпетентны, что не замечаете даже такую очевидную вещь?!"
1006905-33 = "...Так, с меня хватит."
1006905-35 = "Да как вы смеете! Я вообще-то платящий клиент, разве нет?!"
1006905-36 = "Одну минуту, пожалуйста."
1006905-37 = "Как человек, отвечающий за кухню, я хочу принести свои извинения."
1006905-39 = "За это блюдо платить не нужно. Я лично прослежу, чтобы подобное больше не повторилось."
1006905-40 = "Мне ужасно, ужасно жаль, что мы доставили вам такие неприятности."
1006905-42 = "Хмф! По крайней мере, вы относитесь к этому серьёзно. На этот раз я спущу вам это с рук."
1006905-43 = ""
1006905-45 = ""
1006905-47 = "Президент, вам не следовало так извиняться! Мы бы ни за что не допустили такой глупой ошибки!"
1006905-48 = "*вздох* Конечно, ты права. Я лучше всех знаю, как усердно вы работаете."
1006905-49 = "Мне это тоже не нравится, но мы ни при каких обстоятельствах не можем мешать остальным посетителям спокойно есть."
1006905-50 = "В следующий раз помни об этом."
1006905-51 = "Да, президент..."
1006905-52 = ""
1006905-54 = ""
1006905-55 = "[ns] «(Где же я раньше видел этого посетителя...?)»"
1006905-57 = "Я решил выйти с Променада Чёрной Черепахи и проследить за возмущённым посетителем."
1006905-58 = ""
1006905-62 = "Хе-хе-хе..."
1006905-63 = "Ещё один бесплатный обед в кармане."
1006905-64 = "Срабатывает каждый раз."
1006905-65 = ""
1006905-68 = ""
1006905-69 = "[ns] «Не так быстро.»"
1006905-70 = "А? Чего тебе надо?"
1006905-71 = "[s1] «Я видел твоё лицо в сводке происшествий Бюро общественной безопасности „Валькирии“.»\n[s2] «Ты ведь тот самый серийный любитель поесть и сбежать, не заплатив?»"
1006905-74 = "К-Как ты вообще об этом узнал...?"
1006905-75 = "То есть... ты ничего не докажешь!"
1006905-76 = "Стой... Ты тот человек из Шале! Тот самый Сенсей!"
1006905-77 = "[s] «Признаю вину.»"
1006905-78 = "Уф!"
1006905-79 = "И-и что с того, что ты обо мне слышал? Ты всё равно ничего не сможешь сделать!"
1006905-81 = "В одиночку — может быть. Но он здесь не один..."
1006905-82 = "К-Кто здесь?"
1006905-83 = ""
1006905-85 = ""
1006905-86 = "Ах, дорогой посетитель. Как приятно снова вас видеть."
1006905-87 = "Это же вы...!"
1006905-88 = "И что ты собираешься делать? Я ведь ушёл из твоего ресторанчика, разве нет?"
1006905-89 = "Верно, ушли. Вся эта ваша история с волосом в еде звучала подозрительно, но..."
1006905-90 = "Как хозяйка ресторана, я могла только отпустить вас."
1006905-91 = "Но сейчас я уже не в ресторане, правда?"
1006905-92 = ""
1006905-94 = ""
1006905-95 = "Ч-Что ты делаешь? Отойди от меня!"
1006905-97 = "В вашей просьбе отказано!"
1006905-98 = "Вы совершили три серьёзные ошибки."
1006905-99 = "Во-первых, вы проявили неуважение к Сенсею передо мной — его студентом."
1006905-100 = "Во-вторых, вы оскорбили моих младших передо мной — их старшей."
1006905-101 = "В-третьих, вы оскорбили мой ресторан передо мной — поваром."
1006905-103 = "А-а-а!"
1006905-104 = ""
1006905-106 = ""
1006905-108 = "Руми отвесила печально известному любителю сбегать без оплаты великолепный апперкот!"
1006905-110 = "Фух... Спасибо, Сенсей. Мне стало гораздо легче."
1006905-111 = "Если бы вы не проследили за этим мошенником, мне пришлось бы просто отпустить его..."
1006905-112 = "[s3] «Да ничего особенного.»\n[s4] «Я связался с „Валькирией“. Они скоро будут здесь.»"
1006905-115 = "Ха-ха-ха... От вас ничего не укроется, Сенсей."
1006905-116 = "В знак благодарности..."
1006905-117 = "[s5] «Пожалуйста, нет, мне ничего не нужно.»\n[s6] «Посмотри на время! Мне пора возвращаться в Шале.»"
1006905-120 = "Я знаю."
1006905-121 = "Поэтому я и распорядилась доставить вашу еду в Шале. Раз уж вам пришлось потратить обеденный перерыв, я добавила бесплатный десерт."
1006905-122 = "[s] «Ты правда не можешь перестать кормить всех вокруг, да?»"
1006905-123 = "Что поделать? Такая уж у меня привычка."
1006905-124 = "В конце концов, я повар!"
