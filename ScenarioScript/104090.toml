104090-166 = "Но... если в следующий раз захотите пригласить меня снова..."
104090-167 = ""
104090-169 = ""
104090-171 = ""
104090-172 = "О! Арис?"
104090-173 = "Привет, Химари."
104090-174 = "Химари! Можешь посмотреть вот это?"
104090-175 = "Вот!"
104090-176 = ""
104090-178 = ""
104090-179 = "Игровая консоль...?"
104090-181 = "Хмм... Понятно."
104090-182 = "Что думаешь?"
104090-183 = "Думаешь, это Кей?"
104090-184 = "..."
104090-185 = "Полагаю, да. Но я не специалист по технологиям Безымянных богов, поэтому не могу утверждать наверняка."
104090-186 = "Если такие данные возникли естественным образом... это действительно было бы сверхъестественным явлением."
104090-187 = "Пока что это может быть Кей, но доказать мы не можем."
104090-188 = "В-Вот как..."
104090-189 = "Да, эти данные занимают всего два килобайта, и... даже если разобрать их побитно, мы ничего не поймём."
104090-190 = "Если только та трусиха, которая разбирается в этой технологии, наконец не вернётся."
104090-191 = "Понятно. Значит, сейчас нельзя сказать ни да, ни нет."
104090-193 = "Надеюсь... это Кей. Если это Кей, тогда... Тогда я..."
104090-194 = "Алис..."
104090-195 = "Алис..."
104090-196 = ""
