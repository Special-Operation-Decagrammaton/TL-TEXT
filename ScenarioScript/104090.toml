[translation]
104090-1 = "Эпизод 9; Эпилог 1"
104090-6 = "Здравствуйте, студенты Кивотоса! С вами Кавару Шинон из Школы журналистики «Кронос»!"
104090-7 = "Сейчас я нахожусь в районе Ширатори, где полным ходом идёт восстановление. Все здания позади меня прямо сейчас отстраиваются заново!"
104090-8 = "Район Ширатори пострадал сильнее всего, поскольку во время инцидента стал полем боя между чудовищем и гигантским роботом."
104090-9 = "Но он уже снова кипит жизнью! Невероятно! В конце концов, реконструкция — лучшая часть строительства!"
104090-10 = "Начальница финансов Генерального ученического совета Оки Аой заявила: «Сейчас восстановление города — высший приоритет» — и одобрила экстренные средства на восстановление, запрошенные Надзорным управлением."
104090-11 = "Пока вотум недоверия Нанагами Рин всё ещё рассматривается, это решение похвалили за то, что восстановление города поставили выше политических разборок, но..."
104090-12 = "Кто отвечает за взлетевшие цены на землю и строительные материалы? Кто наживётся на реконструкции? Есть ли тёмная сторона у этой истории надежды?"
104090-13 = "В следующий раз мы подробно разберём..."
104090-14 = "Что? Велите мне заткнуться? Вы тоже купили здесь землю? А?!"
104090-15 = ""
104090-18 = "Приносим извинения за помехи на экране. Пожалуйста, подождите немного."
104090-20 = "...С момента инцидента с Санктумами, охватившего Кивотос, прошло уже немало времени."
104090-21 = "Красные башни появились по всему Кивотосу, на нас напали неизвестные враги... И всё же, несмотря на масштаб случившегося, реакция жителей Кивотоса, помнящих инцидент, в лучшем случае прохладная."
104090-22 = "«Была какая-то большая заварушка, но благодаря Шале всё разрешилось. Ну и что?» — похоже, такова общая реакция."
104090-23 = "Некоторые даже заявляют: «Это что, рекламная акция Шале? Сговор с Генеральным ученическим советом? Где спрятаны камеры?»"
104090-24 = "Фактически даже в D.U., который пострадал сильнее всего, было мало раненых и ни одной жертвы."
104090-25 = "Учитывая масштаб инцидента, некоторые называют чудом столь малый ущерб, но большинство людей просто продолжили жить дальше."
104090-26 = "Раз из других районов не поступает запросов на восстановление ущерба или поддержку, похоже, ситуация одинакова по всему Кивотосу."
104090-27 = "А анализ показал, что крупнейшей жертвой этого инцидента стал Генеральный ученический совет, ведь его здание и Башня Санктум были уничтожены!"
104090-28 = "Потеря Башни Санктум, управлявшей административной системой Кивотоса... Разве это не серьёзно? Кивотосу конец? Всё пропало?!"
104090-29 = "...Уверена, некоторые зрители именно так и думают."
104090-30 = "Но Башня Санктум и так почти потеряла значение после исчезновения президента Генерального ученического совета, последнего администратора, верно? Поэтому её внезапное уничтожение вряд ли многое изменит."
104090-31 = "Генеральный ученический совет классифицировал этот инцидент как нападение на Кивотос со стороны загадочного явления и не дал других объяснений..."
104090-32 = "Есть подозрение, что Шале тоже глубоко замешан в этом инциденте!"
104090-33 = "Но Шале отказывается комментировать слухи о том, что кто-то видел Сенсея, голышом бегающего по полю!"
104090-34 = "Если Сенсей стал радикальным натуралистом, зачем тогда бегать с планшетом в руках? Согласно одной версии, это был перформанс о сосуществовании современной цивилизации и природы..."
104090-35 = "...А? Прекратить распространять теории заговора? О чём вы?! Это никакая не теория заговора..."
104090-36 = ""
104090-39 = "Снова помехи на экране. Приносим извинения."
104090-40 = ""
104090-43 = "...Короче говоря, это заговор высшего уровня, который скрывает равнодушная общественность! Шале, хватит скрывать правду! Раскройте её!"
104090-44 = ""
104090-47 = "И снова помехи. Пожалуйста, подождите."
104090-49 = "Генеральный ученический совет объявил о проекте по восстановлению Башни Санктум, и завершённую башню представят в ближайшем будущем."
104090-50 = "Это крупный проект по восстановлению Башни Санктум по чертежам, но из-за сложности работ ходят слухи о сотрудничестве с частной строительной компанией Кайзер Индастриз."
104090-51 = "Крупные игроки, процветающие на рынке недвижимости благодаря обновлению городов и строительной реконструкции, получат от этого наибольшую выгоду, пока простые люди страдают от растущей инфляции и процентных ставок..."
104090-52 = ""
104090-58 = "...Тц."
104090-59 = "...Вот и всё, начальник обороны."
104090-60 = "Без нашей помощи вы оказались бы в крайне шатком положении."
104090-61 = "Разве у вас не то же самое? Без моей поддержки Кайзер к этому моменту уже объявил бы банкротство."
104090-62 = "...Справедливо. Значит, наш союз сохранён?"
104090-63 = "Объединиться с тем, кто ударил меня в спину..."
104090-64 = "Обычный человек никогда бы так не поступил..."
104090-66 = "Но обычные люди ничего не достигают. Именно необычные поступки делают человека сверхчеловеком."
104090-67 = "Хм-м."
104090-68 = "Сверхчеловек не может быть как обычная масса. Надеюсь на плодотворное сотрудничество, Генерал."
104090-69 = "И правда... Ха-ха-ха... Великолепно. Теперь понимаю, почему президент так высоко вас ценит."
104090-70 = "Настоящий взрослый должен уметь протянуть руку вчерашнему врагу ради более великой цели."
104090-71 = "Я не идиот, который разрушит планы из-за каких-то мелких эмоций."
104090-72 = "Хорошо. Надеюсь на сотрудничество, начальник обороны."
104090-74 = "..."
104090-75 = "..."
104090-79 = "Арис, мы пришли."
104090-80 = "А? Арис, что ты делаешь?"
104090-81 = "Собираешь пластиковую модель?"
104090-82 = ""
104090-84 = ""
104090-85 = "Нет. Это не пластиковая модель."
104090-86 = ""
104090-88 = ""
104090-90 = "Тогда что это? Робот...?"
104090-91 = "Да. Думаю, это... Кей. Наверное."
104090-92 = "А? Кей?!"
104090-93 = "Т-Ты говорила, что она исчезла."
104090-94 = "Да, Кей исчезла... и с тех пор я её не видела."
104090-95 = "Но когда Кей исчезала... я на секунду увидела робота, похожего на этого."
104090-97 = "Поэтому я собираю его, пока воспоминание не выцвело."
104090-98 = "Хм..."
104090-99 = "Алис..."
104090-100 = "Кей... правда нам помогла! В-Возможно... она могла бы стать одной из участниц нашей группы."
104090-101 = "...Да. Если я снова её увижу... я хотела бы предложить ей вступить в нашу группу. Если она захочет."
104090-102 = "..."
104090-103 = ""
104090-105 = ""
104090-108 = "А? Это приглашение на сетевой бой?"
104090-109 = ""
104090-112 = "...А? Что это?"
104090-113 = "Что случилось, сестрёнка?"
104090-114 = "...На моей карте памяти появился файл, которого я никогда раньше не видела."
104090-115 = "Уверена, что просто не забыла?"
104090-116 = "В смысле? Как я могла забыть о файле сохранения? Я никогда раньше не видела такого имени."
104090-117 = "Так, посмотрим..."
104090-118 = ""
