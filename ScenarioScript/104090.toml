104090-202 = "Понятно... Отличная работа, Арис."
104090-203 = "..."
104090-204 = "Если позволишь, хочешь, я модифицирую робота?"
104090-205 = "Модифицируешь?"
104090-206 = "Ничего особенного — просто добавлю функцию USB-накопителя, но тогда ты сможешь..."
104090-207 = "Поместить туда данные Кей."
104090-208 = "Гениально! Ты сделала это, думая о Кей! Будто заранее знала!"
104090-209 = "Если загрузить данные..."
104090-210 = "...!"
104090-211 = "Да, я хрупкая и прекрасная гениальная девушка, но, пожалуйста, не ждите от меня чудес."
104090-212 = "Это всего лишь маленький кусочек надежды, который можно носить с собой."
104090-214 = "Да! Я хочу!"
104090-215 = "Хи-хи. Оставь это мне. В модификациях мой гений сияет особенно ярко."
104090-216 = "Особенно учитывая, что я модифицировала экзоскелет вон той Токи. Правда, у неё вкус был не очень."
104090-217 = ""
104090-220 = "Посмотрим... Я как раз недавно купила новую память... и даже добавлю функцию брелока."
104090-223 = "Вуаля! Готово!"
104090-224 = "...!"
104090-225 = "Спасибо, Химари."
