104090-129 = "Имя файла сохранения... Кей?"
104090-130 = "К-Кей? Это должна быть та самая Кей?"
104090-131 = "...!"
104090-133 = "Д-Давайте скорее отнесём это Химари!"
104090-134 = "Да!"
104090-135 = ""
104090-139 = "Добро пожаловать, участницы Отдела разработки игр."
104090-140 = "Привет."
104090-142 = "А? Это ты! Что ты здесь делаешь?!"
104090-143 = "Из C&C..."
104090-144 = "Президент Рио..."
104090-145 = "Да... Я Асума Токи. Пис-пис."
104090-146 = ""
104090-148 = ""
104090-149 = "П-Пис?!"
104090-150 = "Ч-Что...?"
104090-151 = "Президент Химари научила тебя странным манерам."
104090-152 = "Они не странные. Это подчёркивание характера. Стратегия использования слабостей противника."
104090-153 = "Ну, если тебе нравится..."
104090-154 = "Президент Рио всё ещё скрывается, поэтому я ищу работу."
104090-155 = "Так вот почему Токи тут вынюхивает. Потом пойдёшь в клубную комнату C&C?"
104090-156 = "...Нет. Думаю, старшие заняты. Я их не видела."
104090-157 = "Я понимаю ситуацию. Раз вы безработная, не хотите присоединиться к нашей группе?"
104090-159 = "Что?!"
104090-160 = "А-Алиса..."
104090-161 = ""
104090-163 = ""
