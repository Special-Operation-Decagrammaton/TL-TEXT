[translation]
1010705-1 = "Хобби секретаря"
1010705-2 = "Я, как обычно, работал, когда..."
1010705-3 = ""
1010705-7 = ""
1010705-8 = "Здравствуйте, Сенсей! Как поживаете?"
1010705-9 = "А, я не помешала вам посреди работы...?"
1010705-10 = "[s] «Всё нормально. Я всё равно собирался сделать перерыв.»"
1010705-11 = "Рада слышать! Я на этой неделе тоже отдыхаю!"
1010705-12 = "Хм? Что случилось?"
1010705-13 = "Да ничего особенного, просто обычный перерыв в выпуске!"
1010705-14 = "[s] «Обычный перерыв в выпуске?»"
1010705-15 = "А-ха-ха! Ага, именно!"
1010705-16 = "Поскольку «Еженедельник Общества Пандемониума», ну, еженедельный, один пропущенный выпуск просто приведёт к ещё большей запарке потом — если только я не решу взять выходной на всю неделю!"
1010705-17 = "Это марафон, а не спринт, понимаете! Или как-то так."
1010705-18 = "Мне правда нравится над ним работать, поэтому важно устроить всё так, чтобы я могла продолжать и не выгореть."
1010705-19 = "Поэтому минимум раз в два месяца я обязательно беру целую неделю отдыха!"
1010705-20 = "Хотя у меня есть и ДРУГАЯ работа, так что на деле я просто беру один выходной!"
1010705-21 = ""
1010705-24 = "Вы выглядите, эм... Это зависть?"
1010705-25 = "О, в последнее время вы настолько завалены делами, что даже выходные взять не можете?"
1010705-26 = "М-м, понятно... В таком случае..."
1010705-27 = "Сегодня вам тоже нужно отдохнуть, Сенсей!"
1010705-28 = "[s] «Н-Но работа...!»"
1010705-29 = "Я же сказала: невозможно работать без остановки вечно!"
1010705-30 = "Что лучше: взять полноценный выходной и завтра начать со свежими силами или постоянно выскакивать на супер-супер-супер-короткие перерывы, которые толком не помогают?"
1010705-31 = "[s] «Хм, возможно, в этом есть смысл...»"
1010705-32 = "Правда? Правда?"
1010705-33 = "Отличный выбор!"
1010705-34 = "Ну же, вставайте из-за стола и потянитесь!"
1010705-35 = "А потом хорошенько вздремните, почитайте книгу, поиграйте во что-нибудь или ещё что-нибудь!"
1010705-36 = "Или займитесь спортом, или уделите время хобби, на которое обычно не хватает времени!"
1010705-37 = "...Что? Вы так много работали, что теперь даже не можете придумать, чем ещё заняться?"
1010705-38 = "[s] «А чем ты занимаешься в выходные, Чиаки?»"
1010705-39 = "Я?"
1010705-40 = "Эм... В основном занимаюсь своим хобби. Как все, наверное."
1010705-41 = "[s1] «Тогда выбирай занятие ты.»\n[s2] «Расскажи мне о своём хобби.»"
1010705-44 = "А, конечно!"
1010705-45 = "Мы с вами, Сенсей, отлично проведём время вместе!"
1010705-46 = "Может, ещё и материал для следующей недели появится!"
1010705-47 = "Давайте скорее пойдём!"
1010705-48 = "[s] «Куда?»"
1010705-49 = "Развлекаться своим хобби, конечно!"
1010705-50 = "Если интересно, что это..."
1010705-51 = "...узнаете, когда придём!"
1010705-53 = ""
1010705-54 = "Комната Исторического общества"
1010705-56 = ""
1010705-57 = "Йохо! Привет, Историческое общество. Как вы тут?"
1010705-58 = "А, это Чиаки!"
1010705-59 = "Давно не виделись! Как дела?"
1010705-60 = "У меня отлично! Рада снова всех видеть!"
1010705-61 = ""
1010705-62 = "[ns] «(Хобби Чиаки — исторические исследования?)»"
1010705-63 = "Чем клуб занимался последнее время?"
1010705-64 = "Да так... О, точно! Помнишь тот старый текст, который ты принесла в прошлый раз?"
1010705-65 = "Оказалось, это полная подделка!"
1010705-66 = "О! Правда? Я думала, сорвала джекпот, когда нашла его в том букинистическом магазине!"
1010705-67 = "А-ха-ха! Ну, зато когда найдёшь настоящий, ощущения будут именно такие!"
1010705-68 = "Ну заходи. Присаживайся! Мы нальём тебе чаю!"
1010705-69 = "А-ха-ха! Спасибо! А Сенсею тоже можно?"
1010705-70 = "Конечно! Сюда, Сенсей!"
1010705-72 = ""
1010705-73 = ""
1010705-74 = ""
1010705-75 = ""
1010705-76 = ""
1010705-77 = "[ns] «Чиаки, ты состоишь и в Обществе Пандемониума, И в Историческом обществе?»"
1010705-78 = "Эм, скорее я здесь что-то вроде приглашённого участника?"
1010705-79 = "Она не может быть с нами постоянно, но мы всегда рады, когда она приходит."
1010705-80 = "Именно! Всё-таки прежде всего я член Общества Пандемониума!"
1010705-81 = "Так что могу лишь слегка касаться темы, можно сказать!"
1010705-82 = "[s] «Понятно. Не знал, что история — твоё хобби—»"
1010705-83 = "О, посмотрите на время!"
1010705-84 = "Тогда я пойду! Сегодня было весело!"
1010705-85 = "Ага, конечно! Надеюсь, скоро увидимся!"
1010705-86 = "Конечно!"
1010705-88 = ""
1010705-89 = "[ns3] «Ты не собираешься ещё позаниматься своим хобби?»\n[ns4] «Всё-таки сегодня твой выходной.»"
1010705-92 = "М-м, я бы с удовольствием ещё осталась..."
1010705-93 = "Хи-хи, но история — не моё хобби!"
1010705-94 = "[s] «Не оно...?»"
1010705-95 = "Тогда идём дальше!"
1010705-97 = ""
1010705-98 = "Тренировочная площадка клуба кэтчбола"
1010705-99 = "А, это Чиаки!"
1010705-100 = ""
1010705-102 = ""
1010705-103 = "Привет! Вижу, вы как всегда усердно тренируетесь!"
1010705-104 = "Давно тебя не было! Без тебя совсем скучно!"
1010705-105 = "Сегодня есть время поиграть?"
1010705-106 = "Конечно!"
1010705-107 = "[s] «Твоё хобби — спорт, Чиаки?»"
1010705-108 = "Ну, здесь я тоже вроде приглашённого участника. Я недостаточно хороша в спорте, чтобы соревноваться с кем-то из них!"
1010705-109 = "Соревнуется она или нет, рядом с ней всегда становится веселее!"
1010705-110 = "Надеюсь, будешь заглядывать почаще!"
1010705-111 = "Ага! Постараюсь!"
1010705-112 = "Ну что! Играем!"
1010705-114 = ""
1010705-115 = "Комната Клуба исследования настольных игр"
1010705-116 = "Ух... Значит, в такой ситуации мне, наверное, стоит сыграть ВОТ эту карту...?"
1010705-117 = "Хи-хи, Чиаки не слишком хороша в играх, зато её реакции бесценны."
1010705-118 = "Какая жестокость! Тут решается судьба всей моей жизни!"
1010705-120 = ""
1010705-121 = "Клуб исследования кулинарных заведений"
1010705-122 = ""
1010705-123 = ""
1010705-124 = ""
1010705-126 = ""
1010705-127 = "Испытательный полигон Клуба исследования огневой мощи"
1010705-128 = ""
1010705-129 = ""
1010705-130 = ""
1010705-131 = ""
1010705-132 = ""
1010705-135 = "Фух, ну мы сегодня и набегались по клубам!"
1010705-136 = "Вот видите, выходной для меня не ощущается настоящим, если я не проведу его вот так!"
1010705-137 = "Ой, а вы выглядите уставшим... Надеюсь, я не СЛИШКОМ сильно таскала вас за собой!"
1010705-138 = "[s] «Нет, всё нормально. Но дай быстро кое-что спросить...»"
1010705-140 = "[ns] «Так какое у тебя всё-таки настоящее хобби...?»"
1010705-141 = "Моё хобби? Вы же весь день смотрели, как я им занимаюсь!"
1010705-142 = "...А? О, вы не поняли, какое из всех этих занятий мне нравится больше всего?"
1010705-143 = ""
1010705-145 = ""
1010705-146 = "А-ха-ха! Да, понимаю, почему это могло сбить с толку!"
1010705-147 = "Ну, моё хобби — просто проводить время со всеми друзьями!"
1010705-148 = "Я хожу к ним, присоединяюсь, играю в их разные спортивные игры, настолки и всё такое!"
1010705-149 = "Вот почему я приглашённый участник в стольких клубах!"
1010705-150 = "[s5] «Если подумать...»\n[s6] «Ты и правда не была мастером ни в одном из этих занятий...»"
1010705-153 = "Ну... довольно прямолинейно, но да, это правда!"
1010705-154 = "Но ведь сегодня был и ВАШ выходной. Ну как вам, Сенсей?"
1010705-155 = "Хорошо провели время, присоединившись ко мне в мой выходной?"
1010705-156 = "[s] «Да. Это был новый опыт.»"
1010705-157 = "Я рада! Всегда здорово знакомиться со множеством друзей, правда?"
1010705-158 = "Ну, тогда здесь наши пути расходятся!"
1010705-159 = "Мне пора приниматься за выпуск следующей недели!"
1010705-160 = "[s7] «Т-Ты сейчас пойдёшь работать?»\n[s8] «Ты не собираешься отдыхать?»"
1010705-163 = "Ну, я ведь отдыхала весь день!"
1010705-164 = "Встречаться с друзьями, болтать, заниматься спортом — для меня всё это и есть отдых!"
1010705-165 = "[s] «Это даже впечатляет...»"
1010705-166 = "Правда? А я думала, это нормально."
1010705-167 = "Ладно, увидимся!"
1010705-168 = ""
1010705-170 = ""
