[translation]
1013503-1 = "Добро пожаловать в Кивотос"
1013503-2 = "Я отправился в Миллениум, чтобы понаблюдать за занятием Кей."
1013503-3 = "Как только Кей поймала мой взгляд, на её лице появилось очень знакомое выражение."
1013503-4 = ""
1013503-6 = ""
1013503-7 = ""
1013503-8 = ""
1013503-9 = ""
1013503-10 = "Здравствуйте, все."
1013503-11 = "Тема сегодняшнего урока — «Жилые пространства и общество»."
1013503-12 = "В рамках этой темы я хочу особенно сосредоточиться на инфраструктуре городского планирования и на том, как она влияет на население."
1013503-13 = "Итак, посмотрим... Кей?"
1013503-14 = "Можешь рассказать, что ты знаешь о городах?"
1013503-15 = "А? Я? «Кей» — то есть я?"
1013503-16 = "Да, пожалуйста. Ты здесь единственная Кей."
1013503-17 = "О. Эм..."
1013503-18 = "По сути, «город» находится на границе противоположностей. Это человеческая конструкция, которую обычно противопоставляют так называемому «чистому» состоянию нетронутой природы."
1013503-19 = "Термин «цивилизация» имеет корень «civil», происходящий от понятия «город», или «civitas» в исходной форме. «Civil» явно является корнем слов вроде «civilization» и «civics», что подразумевает: именно создание пространства в некотором смысле делает нас «людьми»."
1013503-20 = "Без городов, ну..."
1013503-21 = "Иными словами, если бы не существовало основы, где люди могли бы собираться, обмениваться идеями и учиться сотрудничать, знакомого нам мира не существовало бы."
1013503-22 = "В конце концов, люди — общественные существа. Благодаря коллективному творчеству и изобретательности они воплощают фантазии в реальность."
1013503-23 = "(О, о-о-о?!)"
1013503-24 = "(Это... очень интересная мысль!)"
1013503-25 = ""
1013503-26 = "...Если сравнить древность с современностью, становится ясно, что нынешние условия жизни ухудшаются из-за всё более высокой плотности населения."
1013503-27 = "В наше время реального решения нет. Мы достигли беспрецедентной эпохи капитализма, где иметь «ценность» для «цивилизации» означает собираться в центральных местах ради труда."
1013503-28 = "...Если говорить практично, думаю, следующими шагами должны стать снижение транспортной загруженности и уменьшение загрязнения окружающей среды."
1013503-29 = "(Она охватила все пункты сегодняшнего урока!)"
1013503-30 = "(Я... Я преподаватель, что мне теперь...?)"
1013503-31 = ""
1013503-32 = "...Возможно, я немного ушла в сторону, заговорив о квантовых полях. Понимаю, что они кажутся не связанными с векторами."
1013503-33 = "Но в конечном счёте здесь нужно доказать, что массовый разрыв больше нуля. А это неразрывно связано с математикой."
1013503-34 = "Дело не в грубых вычислениях. Это возможно лишь частично — так же, как общее уравнение гидродинамики всё-таки можно каким-то образом решать методами вычислительной гидродинамики."
1013503-35 = "Более того, причина кроется в структурных ограничениях математики. Прежде всего, интегралы по траекториям—"
1013503-36 = "М-м, хм...! Именно!"
1013503-37 = "Н-На сегодня всё. Немного рановато... Но как насчёт того, чтобы всем выйти подышать свежим воздухом?"
1013503-38 = ""
1013503-40 = ""
1013503-42 = ""
1013503-43 = "Невероятно!"
1013503-44 = "Я сразу чувствовала, что в ней что-то есть, но этот переведённый студент потрясающая!"
1013503-46 = "Ч-Что?"
1013503-47 = "Эй, ты ведь Кей-Кей, да? Где ты училась раньше? Ты что, перепрыгнула несколько классов?"
1013503-48 = "Ты упомянула гипотезу о массовом разрыве, да? Значит, ты наверняка знаешь, что наша академия была основана ради решения Загадки Миллениума! Отсюда и название! Вступай в наш клуб!"
1013503-49 = "Н-Ну, нет, то есть, я..."
1013503-50 = ""
1013503-51 = "Мы встретились взглядами через всю комнату."
1013503-52 = "С натянутым выражением лица Кей беззвучно произнесла губами сообщение."
1013503-53 = "Похоже, это было: «Что ты делаешь?! Спаси меня!»"
1013503-54 = ""
1013503-55 = "И я в ответ тоже беззвучно произнёс сообщение."
1013503-56 = ""
1013503-57 = "[ns] «Я так рад, что Кей-Кей заводит друзей!»"
1013503-58 = ""
1013503-59 = "(Сначала убью Сенсея, а потом пойду УМИРАТЬ!)"
1013503-60 = ""
1013503-61 = "У-Ух... Я выжата..."
1013503-62 = "[s] «Ты и правда очень умная, Кей-Кей.»"
1013503-63 = "Ты можешь, ПОЖАЛУЙСТА, замолчать?!"
1013503-64 = "*вздыхает*..."
1013503-65 = "Раз уж ты поднял эту тему и ЛИЧНО всё ВИДЕЛ, НО НИЧЕГО НЕ СДЕЛАЛ, думаю, очевидно, что... я обладаю обширными знаниями."
1013503-66 = "...Мне приходилось многое знать, поскольку я была, так сказать, «слугой»."
1013503-67 = "Я даже... возможно, узнала ещё немного, пока взламывала системы во время исследований Миллениума в Руинах."
1013503-68 = "В любом случае."
1013503-69 = "К чему я веду?"
1013503-70 = "..."
1013503-71 = "Иногда мне кажется, что эти занятия — просто формальность. Упражнение на посещаемость."
1013503-72 = "[s] «Тебе они не нравятся?»"
1013503-73 = "..."
1013503-74 = "Не обязательно, но это поднимает фундаментальный вопрос."
1013503-75 = "Например, если студент уже всё знает, действительно ли нужно заставлять его ходить в школу?"
1013503-76 = "[s] «Конечно. А почему нет?»"
1013503-77 = "Что?"
1013503-78 = "[s] «Полезно общаться и играть.»"
1013503-79 = "Что это...? «Играть»?"
1013503-80 = "Для тебя это приоритет? И всё?"
1013503-81 = "[s1] «Конечно.»\n[s2] «Обязанность студента — хорошо играть и хорошо учиться.»"
1013503-84 = "Ещё одно небрежное чрезмерное упрощение..."
1013503-85 = "..."
1013503-86 = "А что если студенту... всё это кажется слишком тяжёлым? Если другие люди — «слишком»?"
1013503-87 = "[s3] «Уверен, такое бывает.»\n[s4] «Но даже для них...»\n[s5] «Даже у них бывают моменты, когда нужна компания.»"
1013503-91 = "...То есть ты говоришь, что поэтому этот гипотетический студент должен продолжать? На случай, если ей станет... одиноко?"
1013503-92 = "Угх..."
1013503-93 = "А что если этот студент ДЕЙСТВИТЕЛЬНО не любит большинство людей?"
1013503-94 = "А? Ты говоришь, что именно поэтому ты здесь?"
1013503-95 = "..."
1013503-96 = "Я понимаю, к чему ты ведёшь, но будь реалистом, Сенсей."
1013503-97 = "У тебя только одно тело. Ты вообще знаешь, сколько студентов в Кивотосе?"
1013503-98 = "Сомневаюсь, что ты справишься даже с одним Миллениумом, не говоря уже обо всём Кивотосе. Откуда уверенность, что сможешь—"
1013503-99 = "[s6] «Ты совершенно права.»\n[s7] «Вот поэтому помогай им вместо меня!»"
1013503-102 = "Почему я? Нельзя вот так внезапно вешать это на меня!"
1013503-103 = "Что? «Потому что именно так поступила бы герой Арис»...?"
1013503-104 = "..."
1013503-105 = "..."
1013503-106 = "..."
1013503-107 = "*вздох*... Серьёзно..."
1013503-108 = "Если бы ты только не умел говорить, то раздражал бы ЗНАЧИТЕЛЬНО меньше."
1013503-109 = "Ладно, ладно."
1013503-110 = "Я... подумаю."
1013503-111 = "[s] «Ты правда добрая, Кей-Кей!»"
1013503-112 = "Я сказала, что ПОДУМАЮ! Я ни на что не соглашалась. ПРЕКРАТИ!"
