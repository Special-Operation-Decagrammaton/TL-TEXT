[translation]
84301200500-5 = "Здесь написано: «Разыскивается сбежавший робот-питомец. Пожалуйста, сообщите, если видели его»."
84301200500-6 = "Будто щенка ищут..."
84301200500-7 = "Кстати, когда Миллениум проводил Фестиваль Хало, там тоже были маленькие роботы, похожие на щенков."
84301200500-8 = "У роботов-щенков есть самосознание? Что вообще является точным определением разумности...?"
84301200500-9 = "Натсу, это внезапно очень серьёзный вопрос."
84301200500-10 = "Я бы не стала так сильно об этом думать..."
84301200500-12 = "...Зависит ли оно от отношений с внешним миром или от способности мыслить самостоятельно?"
84301200500-13 = "Если оно зависит от отношений, существует ли человек в полной изоляции по-настоящему, в каком-либо значимом смысле? И означает ли это, что связь с другими — сущность самого существования?"
84301200500-14 = "Если дело в способности самостоятельно мыслить, тогда что определяет мысль? Чем настоящие мысли личности отличаются от простых вычислений?"
84301200500-15 = "Возможно, каждый из нас — всего лишь мозг в колбе, интерпретирующий всё воспринимаемое так, как был запрограммирован..."
84301200500-16 = "А-а-а... опять началось."
84301200500-17 = ""
84301200500-19 = ""
84301200500-20 = ""
84301200500-22 = "(...Не уверена, насколько это вообще относится к моему делу.)"
84301200500-23 = "(Но всё же поговорю с ними.)"
84301200500-24 = ""
84301200500-28 = ""
84301200500-29 = ""
84301200500-30 = ""
84301200500-32 = "Простите, студенты, можно вас на минутку?"
84301200500-34 = "Она всё ещё несёт эту философскую чушь."
84301200500-35 = "Надо просто закрыть ей рот. Ну, типа, на весь день."
84301200500-36 = ""
84301200500-39 = ""
84301200500-40 = "...? Хм?"
84301200500-41 = "А-а?! Когда вы...?! В-вы вообще КТО?!"
84301200500-42 = ""
84301200500-44 = ""
84301200500-45 = "Простите. Не хотела вас пугать. Случайно услышала ваш разговор, и мне стало любопытно."
84301200500-46 = "Я здесь, чтобы сопровождать студентов Тринити, поэтому решила узнать, куда вы собираетесь."
84301200500-47 = "«Сопровождать студентов Тринити»...? А кто ты такая, чтобы нас сопровождать?"
84301200500-49 = "К-Казуса... это Сейя из Чаепития..."
84301200500-50 = "Сейя? А?"
84301200500-52 = "«А?» — говорит она..."
84301200500-53 = "Ладно, может, ты не знаешь, кто такая Сейя, но слов «Чаепитие» должно быть достаточно..."
84301200500-54 = "Чаепитие? ...А, ТО САМОЕ Чаепитие."
84301200500-55 = ""
84301200500-57 = ""
84301200500-58 = "...Э."
84301200500-59 = "...Ох."
84301200500-61 = "П-простите...! Мне так жаль...!!"
84301200500-63 = "Мы обсуждали модную историю о заблудшем страннике."
84301200500-64 = "Возможно, этот странник отправился в путешествие самопознания, как девушка в бурном подростковом возрасте."
84301200500-65 = "Отдельное от всех прочих «я»... но что вообще такое это «я»? Возможно, оно — ничто. А возможно — всё..."
84301200500-66 = "И как она вообще должна это понять?!"
84301200500-67 = "Понятно... Я понимаю. Значит, это довольно важное обсуждение."
84301200500-68 = "Она тебя поняла?! Да ладно!"
84301200500-69 = "Так куда, по-вашему, мог сбежать этот робот-питомец?"
84301200500-71 = "Она и правда поняла..."
84301200500-72 = "Эм, ну... судя по тому, что нам удалось выяснить в интернете, он может быть на берегу реки."
84301200500-73 = "Хотите сходить туда сейчас? Было бы здорово вернуть его хозяину."
84301200500-74 = "Было бы неплохо..."
84301200500-75 = "Но это точно нормально? Нам сказали, что нашей группе нельзя покидать этот район."
84301200500-76 = "Ну..."
84301200500-77 = "Знаете что, пойдём! Если хотим его найти, сейчас наш шанс."
84301200500-79 = "Наверное, ты права."
84301200500-80 = "...Нацу, что ты делаешь?"
84301200500-81 = ""
84301200500-83 = ""
84301200500-85 = ""
84301200500-86 = ""
84301200500-88 = "..."
84301200500-89 = "А?!"
84301200500-91 = "Н-Нацу, если будешь так пялиться, ты её напугаешь..."
84301200500-92 = ""
84301200500-95 = ""
84301200500-96 = ""
84301200500-97 = ""
84301200500-98 = "...Я поняла. Пойдём."
84301200500-100 = "Они поняли друг друга?!"
84301200500-101 = "Тем, кто следует путём паломничества, слова не нужны."
84301200500-102 = "НАМ нужны! Вообще-то они всем обычно нужны!"
84301200500-104 = "Ха... Хаха..."
84301200500-105 = "Хм... Но это ведь правда нормально, да? Если сразу его там не увидим, тут же вернёмся."
84301200500-106 = "Ой, не переживай, Айри."
84301200500-107 = "Уверена, всё будет хорошо."
