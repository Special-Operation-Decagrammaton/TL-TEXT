[translation]
901010600210-7 = ""
901010600210-8 = "Привет."
901010600210-9 = ""
901010600210-11 = ""
901010600210-13 = ""
901010600210-14 = "Здравствуйте! Кажется, я вас здесь раньше не видела!"
901010600210-15 = "Вы недавно в городе?"
901010600210-16 = "От доставки бэнто до рекомендаций ресторанов! Мы — служба доставки FOX EATS!"
901010600210-17 = "Недавно мы запустили доставку в порту Канэсаки, так что обязательно попробуйте наши услуги!"
901010600210-18 = "Рад слышать. Каждый день выходить из порта ради обеда было такой морокой..."
901010600210-19 = "Думаю, воспользуюсь. Спасибо."
901010600210-20 = "Так что привело вас на эту удалённую станцию? Хотите отправить какой-то особенный груз?"
901010600210-21 = "О, нет, посылки у меня нет. Но есть вопрос."
901010600210-22 = "Эта станция... здесь ходят пассажирские поезда?"
901010600210-23 = "Я подумала, можно ли отсюда уехать поездом домой."
901010600210-24 = "Обычного пассажирского поезда нет... но есть двухвагонный рабочий поезд между железнодорожным депо и портом. Правда, ходит только рано утром."
901010600210-25 = "Это экспресс для портовых работников. Остановок нет, только прямая линия до депо. Если хотите ехать, могу распечатать билет."
901010600210-26 = "Понятно. Значит, не всегда обязательно выходить через главные ворота."
901010600210-27 = "Эм, можно задать ещё один вопрос?"
901010600210-28 = "В последнее время на этот рабочий поезд садился пассажир по имени Миягучи?"
901010600210-29 = "Он мой знакомый, и я потеряла с ним связь."
901010600210-30 = "О... Простите, но не думаю, что могу сообщить такую информацию."
901010600210-31 = "Данные о пассажирах конфиденциальны, поэтому мы не можем их раскрывать. Простите."
901010600210-32 = "Совершенно понимаю. Не извиняйтесь. Простите, что вообще спросила."
901010600210-33 = "Хорошего дня!"
