[translation]
901010600210-7 = ""
901010600210-8 = "Com licença, senhor! Posso lhe tomar um minutinho?"
901010600210-9 = ""
901010600210-11 = ""
901010600210-13 = ""
901010600210-14 = "Pois não! Opa, não me lembro de ter visto seu rosto por aqui antes."
901010600210-15 = "Chegou há pouco tempo no porto?"
901010600210-16 = "Sim! De marmitas quentinhas até encomendas urgentes — somos o serviço multifuncional \"FOX EATS\"!"
901010600210-17 = "Agora o Porto de Kanezaki faz parte da nossa área de cobertura! Conte com a gente quando a fome bater!"
901010600210-18 = "Que maravilha! Ficar saindo do cais pra almoçar na cidade toda hora era um transtorno danado..."
901010600210-19 = "Vou baixar o aplicativo e pedir qualquer dia desses."
901010600210-20 = "A propósito, no que posso ajudar a senhorita? #nTem alguma carga pra despachar de trem pra fora do porto?"
901010600210-21 = "Não, não é encomenda... Na verdade é uma curiosidade que tive."
901010600210-22 = "Essa estação de cargas também recebe trens de passageiros?"
901010600210-23 = "Fiquei pensando se daria para embarcar num trem daqui para ir até outros distritos..."
901010600210-24 = "Não é uma estação de passageiros regular, mas... Temos uma composição curta de dois vagões que roda de madrugada entre o pátio de manobras e o porto para transportar os operários de turno."
901010600210-25 = "Como não faz paradas intermediárias, quase ninguém de fora usa. #nMas se a senhorita precisar embarcar, posso emitir o bilhete de serviço."
901010600210-26 = "Entendi! Então há uma rota de saída do porto além do portão principal da guarita."
901010600210-27 = "Ah, posso lhe fazer mais uma perguntinha rápida?"
901010600210-28 = "O senhor se recorda de algum passageiro chamado \"Miyaguchi\" embarcando nesse trem recentemente?"
901010600210-29 = "É que perdi o contato com um amigo e estou tentando descobrir o paradeiro dele..."
901010600210-30 = "Sinto muito, senhorita, mas não posso responder a isso."
901010600210-31 = "Os registros de bilhetagem são confidenciais da malha ferroviária. Não podemos repassar a terceiros sem ordem expressa."
901010600210-32 = "Compreendo perfeitamente, o senhor está coberto de razão. Desculpe o incômodo!"
901010600210-33 = "Tenha um bom dia de trabalho!"
