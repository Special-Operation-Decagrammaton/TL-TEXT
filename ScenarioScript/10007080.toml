[translation]
10007080-1 = "Эпизод 8;Заговор клуба горячих источников"
10007080-2 = "Тропа возле курорта горячих источников №227"
10007080-4 = "Я последовал за Чинацу на тропу за пределами курорта."
10007080-5 = "Однако там не было никаких следов студентов, не говоря уже о самой Чинацу."
10007080-6 = "[s] «Интересно, куда все делись...»"
10007080-7 = "Что ты так усердно ищешь, товарищ?"
10007080-8 = ""
10007080-11 = ""
10007080-12 = "Простудишься, если будешь ходить почти без одежды."
10007080-13 = "Те, кто недооценивает зимы академии Красной Зимы, всегда расплачиваются."
10007080-14 = "[s] «Кто бы говорил. Ты выглядишь замёрзшей сильнее меня...»"
10007080-15 = "Что? Ты переживаешь, что мне холодно?"
10007080-16 = "Хи-хи-хи! Не трать время на бесполезные переживания, товарищ."
10007080-17 = "Я — президент студсовета академии Красной Зимы, Великий Вождь, Украшательница земель..."
10007080-18 = "Э-э-э..."
10007080-19 = "В любом случае, я занимаю множество великих и великолепных постов!"
10007080-20 = "Я выдержу этот холод даже с короткими рукавами!"
10007080-21 = "А-А..."
10007080-22 = "А-А-А! Что...? Почему?"
10007080-23 = "Ты так простудишься, Черино. Хоть куртку бы надела."
10007080-24 = "Или принести тебе тёплого кофейного молока?"
10007080-25 = "Угх..."
10007080-26 = "Прекрати своё бессмысленное вмешательство, Томоэ! Разве я уже не сказала, что мне совершенно не холодно?!"
10007080-27 = "Однако чашку тёплого кофейного молока я выпью. И побольше сахара!"
10007080-28 = "Да, сейчас же принесу."
10007080-29 = ""
10007080-31 = ""
10007080-32 = "[ns] «Похоже, горячие источники нравятся тебе куда больше, чем я думал.»"
10007080-33 = "М-м... Не люблю это признавать, но на этом курорте действительно много развлечений. Можно играть весь день и всё равно не устать."
10007080-34 = "Помимо разных купален, в гостиной полно развлечений вроде настольного тенниса и игровых автоматов. А устанешь — можно просто снова пойти в купальню!"
10007080-35 = "Я свысока смотрела на этот комплекс, потому что его построили скряги из спецотряда, но на деле он довольно хорош."
10007080-36 = "[s] «Вообще-то большую часть комплекса построил клуб горячих источников.»"
10007080-37 = "А, точно, я тоже об этом слышала. Значит, этот курорт построили студенты Геенны, да?"
10007080-38 = "Обычно этих идиотов из Геенны, устроивших стройку на территории Красной Зимы без разрешения, ждала бы суровая чистка, но..."
10007080-39 = "Они построили замечательный курорт за такое короткое время. Я даже немного завидую."
10007080-40 = "По крайней мере, пользы от них было бы больше, чем от рабочих Рабочей партии! Они бастуют чаще, чем работают!"
10007080-41 = "Как бы мне заставить клуб горячих источников перейти в нашу академию?"
10007080-42 = ""
10007080-44 = ""
10007080-45 = ""
10007080-46 = "Точно! Если я награжу их почётной медалью, разве они не проникнутся и не поклянутся мне в верности? Медали «Усатый труд» первого класса должно хватить!"
10007080-47 = "Если клуб горячих источников переведётся в академию Красной Зимы..."
10007080-48 = "Я заставлю их построить рядом с нынешним курортом огромный личный курорт горячих источников только для меня!"
10007080-49 = "Если дать новому курорту название... «Усатый курорт горячих источников»!"
10007080-50 = "Раз это будет мой личный курорт, нельзя забывать об украшениях, отражающих мою власть!"
10007080-51 = "Статуя усов, из которых бьёт горячая вода, каменный фонарь в форме усов, а ещё..."
10007080-52 = ""
10007080-54 = ""
10007080-56 = "*БУМ*"
10007080-57 = "А-а! Ч-Что это был за звук? Ещё одно землетрясение?"
10007080-58 = ""
10007080-60 = ""
10007080-61 = ""
10007080-64 = "Ахахаха, простите, простите. Я не знала, что на этой тропе есть люди. Мы проводили взрывные работы."
10007080-65 = "Я-Я не слышала ни о каком строительстве! Как вы смеете! Из какого вы клуба?"
10007080-66 = "Я вычищу всех его членов!"
10007080-67 = "А? Это эмблема академии Геенна..."
10007080-68 = "Ага! Мы клуб горячих источников академии Геенна! Мы здесь ради разработки горячих источников!"
10007080-69 = "Но кто эта мелкая с усами?"
10007080-70 = "М-Мелкая?! Я великий президент студсовета Федеральной академии Красной Зимы!"
10007080-71 = "Важнее другое: ты сказала «клуб горячих источников»? Значит, именно вы построили этот курорт?"
10007080-72 = "Ага-ага. Клуб горячих источников, к вашим услугам."
10007080-73 = "Мы немного увлеклись и в итоге построили курорт намного больше, чем изначально планировали..."
10007080-74 = "Ну как? Даже по-твоему он довольно крутой, правда?"
10007080-75 = "Хм, не люблю это признавать, но курорт действительно отличный. Студенты Красной Зимы, похоже, довольны, да и мне понравилось..."
10007080-76 = "Обычно я не награждаю медалями студентов других школ, но в этот раз сделаю исключение."
10007080-77 = ""
10007080-79 = ""
10007080-80 = ""
10007080-81 = "Томоэ!"
10007080-82 = ""
10007080-84 = ""
10007080-85 = "Да, президент?"
10007080-86 = "В знак признания их заслуги в создании новой туристической достопримечательности академии Красной Зимы..."
10007080-88 = "Наградить клуб горячих источников Геенны медалью «Усатый труд» первого класса и специальной медалью студенческой дружбы!"
10007080-89 = ""
10007080-92 = ""
10007080-94 = ""
10007080-95 = "Медаль чего там с усами?"
10007080-96 = "Это что-то хорошее?"
10007080-98 = "В-Вы не рады медали «Усатый труд»?"
10007080-99 = "Почему? Рабочая партия получает такую медаль всего каких-то семь раз в год!"
10007080-100 = "*шёпотом* Президент, в академии Геенна нет такой же системы наград, как в Федеральной академии Красной Зимы."
10007080-101 = "Они не понимают ценности медалей?"
10007080-102 = "Вот поэтому студенты Геенны..."
10007080-103 = "Кстати, что вы вообще строите? Разве вы уже не закончили?"
10007080-104 = "Возможно, водяные жилы горячего источника изменили направление, потому что со вчерашнего дня давление воды начало падать..."
10007080-105 = "Если так продолжится, купальни курорта могут пересохнуть!"
10007080-106 = "Э-Это плохо. Нельзя допустить, чтобы купальни курорта пересохли."
10007080-107 = "Но не волнуйтесь. Наша президент Касуми всегда находит лучшее решение для любой ситуации."
10007080-108 = "Согласно информации, которую мы только что получили от президента..."
10007080-109 = "Под академией Красной Зимы скрывается огромная магматическая провинция!"
10007080-110 = "Если взорвать эту область, водяные жилы курорта №227 не только восстановятся — мы ещё сможем построить кучу новых горячих источников по всей академии Красной Зимы!"
10007080-111 = "Хм, хорошая идея."
10007080-112 = "Взорвать магматическую область, восстановить водяные жилы и построить новый горячий источник..."
10007080-113 = ""
10007080-115 = ""
10007080-116 = "Стоп, вернёмся. Вы собираетесь сделать что?"
10007080-117 = "Мы её взорвём."
10007080-118 = "Взорвёте что?"
10007080-119 = "Магматическую область под академией Красной Зимы."
10007080-120 = "А что тогда будет со школой над ней? С районом? Или с моим Секретариатом?!"
10007080-121 = "...Бабах? Естественно?"
10007080-122 = "Но не волнуйтесь. Взамен мы построим совершенно новый курорт. Он будет гораздо больше и лучше этого!"
10007080-123 = ""
10007080-125 = ""
10007080-126 = "Не может быть..."
10007080-128 = "...чтобы это было нормально!"
10007080-130 = "А почему нет? Это шанс бесплатно получить отличный курорт."
10007080-131 = "Какой бы замечательный курорт ни построили, без моего Секретариата он бессмысленен!"
10007080-132 = "Эх... Но если мы этого не сделаем, купальни курорта №227 пересохнут!"
10007080-133 = "Мне всё равно! Меня и так раздражало, как эти типы из спецотряда бывшего института красуются!"
10007080-134 = "Остановить разработку горячих источников! Немедленно! Этот курорт будет снесён, как и планировалось!"
10007080-135 = ""
10007080-137 = ""
10007080-138 = "Марина! Немедленно привези мне «Чистильщик №1»!"
10007080-140 = "Да, президент."
10007080-141 = "Я вычищу его так, что ни одного кирпича не останется!"
10007080-143 = "Уф, почему все пытаются мешать нашей разработке горячих источников?!"
10007080-144 = "У нас нет другого выбора. Если президент академии Красной Зимы не хочет сотрудничать мирно..."
10007080-146 = "Придётся заставить их силой!"
