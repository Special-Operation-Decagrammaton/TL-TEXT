[translation]
10016120-1 = "Послесловие;Эпизод отряда RABBIT"
10016120-4 = "...Говорит RABBIT 1. Время 19:30. Студенты Миллениум сейчас собирают оборудование и припасы, использованные на фестивале."
10016120-5 = "Подтверждаю: танк, замаскированный под робота поддержки и отправленный для проникновения на стадион, кодовое имя <Bourgeois Crasher>, полностью выведен из строя."
10016120-6 = "Кроме того, все роботы, безопасность которых не была повторно подтверждена, были собраны студентом, предположительно из Веритас."
10016120-7 = ""
10016120-11 = "Г-г-говорит RABBIT 4... П-подтверждаю перемещения р-рабочих студентов, которые сейчас протестуют на окраине с-спортивного стадиона."
10016120-12 = "Они кричали: «Г-гарантируйте три дня!» и противостояли студентам В-валькирии... Но их м-мораль упала, когда часть зрителей ушла."
10016120-13 = "Д-думаю, они р-решили, что п-продолжать протест уже бессмысленно."
10016120-14 = ""
10016120-18 = "Говорит RABBIT 2. Я закончила патрулирование трибун, откуда уходили зрители, и не обнаружила ничего похожего на подозрительную взрывчатку или легковоспламеняющиеся материалы."
10016120-19 = "Похоже, все убрали за собой мусор перед уходом, так что с этим тоже всё в порядке."
10016120-20 = ""
10016120-24 = "Говорит RABBIT 3. Я только что проверила электронные медицинские записи пунктов первой помощи. Во время мероприятия было довольно много лёгких травм, но, к счастью, ничего серьёзного."
10016120-25 = "Если судить по реакции в соцсетях, она почти вся положительная... В целом, думаю, фестиваль прошёл весьма успешно."
10016120-27 = "Похоже, мы устранили все оставшиеся потенциальные угрозы на спортивном стадионе."
10016120-28 = ""
10016120-30 = ""
10016120-31 = ""
10016120-32 = "На этом... миссия завершена!"
10016120-33 = ""
10016120-35 = ""
10016120-36 = "Спасибо всем за тяжёлую работу..."
10016120-37 = "Хотя результаты SRT были худшими среди всех участвующих академий. Хех..."
10016120-38 = "Угх... Если бы нас не подбил тот танк, мы могли бы одержать хотя бы одну победу..."
10016120-39 = "Мы всё ещё будем это обсуждать?"
10016120-40 = "Тогда тебя не больше расстраивает первая игра с апортом? Если бы кое-кто правильно прочитал правила, нас бы не дисквалифицировали..."
10016120-41 = "Замолчи. Это ненормально — приносить на стадион дымовые гранаты с белым фосфором!"
10016120-42 = "В-в любом случае, нас из SRT изначально было всего ч-четверо..."
10016120-44 = "Мы и так могли участвовать только в о-ограниченном числе забегов, так что, м-может, такой результат был неизбежен?"
10016120-45 = "Но в старшей школе Абидос всего пять студентов, и они всё равно закончили примерно в середине таблицы."
10016120-46 = ""
10016120-48 = ""
10016120-49 = "Мм... скажем так, Саки нас подвела."
10016120-50 = "Эй!"
10016120-51 = ""
10016120-53 = ""
10016120-54 = "Не падай духом, Саки."
10016120-55 = "Мы работали уже больше 24 часов, так что естественно, что и морально, и физически были измотаны."
10016120-56 = "А благодаря тому, что мы тщательно отслеживали военные детали, привезённые в Миллениум, мы смогли быстро и организованно отреагировать, когда танки вышли из-под контроля."
10016120-57 = "Мы выполнили главную задачу — обеспечили безопасность граждан. Так что давайте будем довольны этим и закончим на сегодня."
10016120-58 = "...Публика может запомнить только результаты соревнований, но наши усилия не остались незамеченными."
10016120-59 = "Наверное, от этого мне немного легче..."
10016120-60 = "Н-не знаю, можно ли такое говорить, но..."
10016120-61 = "Вообще-то, мне кажется, эта операция немного о-отличалась от обычных..."
10016120-62 = "Что ты имеешь в виду?"
10016120-64 = "Это было... немного весело."
10016120-65 = ""
10016120-67 = ""
10016120-68 = "С-странно, правда...? Что SRT, для которой главным приоритетом д-должна быть безопасность граждан, наслаждалась операцией..."
10016120-69 = "Я-я и правда просто бесполезная, к-которой не место в академии SRT..."
10016120-70 = "...Нет, кажется, я понимаю, о чём ты."
10016120-71 = "Мы давно не выбирались с базы... Общались со студентами других академий... потели бок о бок..."
10016120-72 = "И я поняла, что вот эти люди перед нами — и есть граждане и общество, которых мы защищаем."
10016120-73 = ""
10016120-75 = ""
10016120-76 = ""
10016120-78 = "А... Ну, наверное, я просто хочу сказать: иногда смысл чего-то нельзя понять, просто прочитав об этом в учебнике. Нужно испытать это на себе, чтобы по-настоящему осознать предназначение SRT."
10016120-79 = "Я бы сказала, сегодня нам выпала отличная возможность по-настоящему понять значение миссии SRT."
10016120-80 = "Саки..."
10016120-81 = ""
10016120-83 = ""
10016120-84 = "Мне тоже очень понравился этот спортивный праздник."
10016120-85 = "Я смогла поработать с огромным объёмом данных, к которым обычно не имею доступа..."
10016120-86 = "А ещё все делали ставки на то, какая академия победит в каждом забеге, так что я смогла немного подзаработать."
10016120-87 = "По-моему, ты слишком уж хорошо повеселилась!"
10016120-88 = ""
10016120-90 = ""
10016120-91 = "Я согласна со всеми вами. Сегодняшняя операция не давала нам передышки, но зато мы смогли увидеть улыбки граждан совсем близко."
10016120-92 = "Как член SRT, я буду дорожить каждым таким днём и продолжу изо всех сил нести справедливость—"
10016120-93 = ""
10016120-96 = "..."
10016120-97 = "Совсем вылетело из головы. Мы сегодня не обедали..."
10016120-98 = "П-потому что у меня не было времени, как обычно, искать п-просроченные ланч-боксы..."
10016120-99 = "Мы так носились весь день, что съели только булочку с красной фасолью из забега с хлебом..."
10016120-100 = "Кстати, раньше я видела, как группа студентов Геенны несла еду и принадлежности для барбекю на центральное поле..."
10016120-101 = "О-они собираются что-то ж-жарить там?"
10016120-102 = "На центральном поле готовят костёр для... вечеринки после фестиваля."
10016120-103 = "Я ничего не слышала о том, что на костре можно устраивать барбекю, но..."
10016120-104 = ""
10016120-106 = ""
10016120-108 = "Могут возникнуть вопросы безопасности, так что... может, пойдём и... проверим?"
10016120-109 = "Точно! На мероприятиях с большим огнём всегда случаются происшествия..."
10016120-110 = "...Мы тооочно идём туда не для того, чтобы урвать немного объедков."
10016120-111 = "В отличие от н-нашей предыдущей операции, теперь наши ц-цели немного другие, но..."
10016120-112 = ""
10016120-114 = ""
10016120-115 = ""
10016120-116 = "...Операция «Полумесяц» продлевается с новой целью!"
10016120-117 = "Есть!"
