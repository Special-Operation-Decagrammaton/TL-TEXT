901010400420-7 = ""
901010400420-8 = "Рада вас видеть, Сенсей."
901010400420-9 = "И отличная работа сегодня! Огромное спасибо за помощь!"
901010400420-10 = "[s1] «И тебе, Нико.»\n[s2] «Вы были в порту Канэсаки?»"
901010400420-13 = "Верно. Мы все отправились в порт расследовать слухи, о которых говорили вчера."
901010400420-14 = "Мы услышали столько историй о жизни в порту и крабах... Поможете нам их систематизировать?"
901010400420-15 = "[s3] «Конечно.»\n[s4] «Мне уже любопытно!»"
901010400420-16 = ""
901010400420-17 = ""
901010400420-19 = ""
901010400420-21 = "Похоже, все собрались."
901010400420-22 = "Приступим к докладам по миссии."
