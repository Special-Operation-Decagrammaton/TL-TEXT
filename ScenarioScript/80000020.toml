80000020-15 = "[s] «Ты сказала... «домашний»?»"
80000020-16 = "Да! Я сама создала этот шоколад."
80000020-17 = "Из-за низкого уровня крафта мне пришлось несколько раз повторить попытку..."
80000020-18 = "Но в конце концов с групповым бонусом Момои я получила нужный результат."
