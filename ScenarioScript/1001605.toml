1001605-43 = ""
1001605-44 = ""
1001605-45 = ""
1001605-47 = "*тяжело дышит* Не могу поверить, что её нигде нет в наличии..."
1001605-48 = "[s] «Похоже, придётся отказаться от ограниченного издания...»"
1001605-49 = "Нет, я не могу. Я так долго ждала этот день!"
1001605-50 = "Я не могу просто так сдаться."
1001605-51 = "Давайте проверим ещё одно место..."
1001605-53 = "Это наш последний шанс. Если и здесь нет..."
1001605-54 = "О."
1001605-55 = "С-Сенсей. Она здесь! Новое ограниченное издание Legend of Zinda!"
1001605-56 = "[s7] «Отлично.»\n[s8] «Теперь осталось только купить её...»"
1001605-57 = "О, нашёл! Legend of Zinda! Последний экземпляр!"
1001605-58 = "О, нашёл! Legend of Zinda! Последний экземпляр!"
1001605-59 = "А..."
1001605-60 = "[s] «Мидори.»"
1001605-61 = ""
1001605-62 = "Хм... Ну."
1001605-63 = "Господин! Пожалуйста, отдайте это мне!"
1001605-64 = "[s9] «Ты точно будешь в порядке?»\n[s10] «Ты весь день её искала.»"
1001605-65 = "Да. Я очень хотела в неё поиграть, но..."
1001605-66 = "Да. Я очень хотела в неё поиграть, но..."
1001605-67 = "Но я хочу дать другим людям шанс насладиться ею!"
1001605-68 = "Со мной всё будет хорошо, Сенсей."
1001605-69 = ""
1001605-71 = "(Я притворялась взрослой, но сама так хотела поиграть! Ва-а...)"
1001605-73 = "На следующий день я пришёл в Отдел разработки игр с подарком."
1001605-74 = "А? Сенсей, что вы здесь делаете?"
1001605-75 = "[s] «Мидори, я принёс тебе подарок.»"
1001605-76 = "Это..."
1001605-77 = "Ограниченное издание Legend of Zinda!"
1001605-78 = "К-как вы его достали?"
1001605-79 = "[s11] «Я всю ночь проверял магазины...»\n[s12] «...чтобы найти один экземпляр для тебя, Мидори.»"
1001605-82 = "[s] «Такова сила взрослого.»"
1001605-83 = "Взрослый может не спать всю ночь..."
1001605-84 = "...Вы сделали это ради меня, Сенсей?"
1001605-85 = "[s] «Мидори?»"
1001605-86 = "О, ничего, Сенсей."
1001605-87 = "Я так счастлива. Спасибо за подарок, Сенсей!"
