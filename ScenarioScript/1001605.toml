[translation]
1001605-1 = "Ограниченное издание, Сенсей"
1001605-2 = "Рынок электроники Миллениум «Хару-Хабара»"
1001605-3 = "Когда я добралась до места встречи, там было так людно, что даже встать было негде."
1001605-4 = "[ns1] «Ух ты, здесь битком.»\n[ns2] «Повсюду люди, которые любят игры...»"
1001605-5 = "Пожалуйста, будьте осторожны! Если отвлечётесь, потеряетесь!"
1001605-6 = "Пожалуйста, будьте осторожны! Если отвлечётесь, потеряетесь!"
1001605-7 = "[s3] «Что вообще происходит?»\n[s4] «Это не может быть обычный релиз игры!»"
1001605-8 = "Не думайте об этом релизе как просто об очередной игре."
1001605-9 = "Не думайте об этом релизе как просто об очередной игре."
1001605-10 = "Это настоящий шедевр, вышедший около десяти лет назад и знаменитый идеальными оценками от обозревателей крупных игровых сайтов!"
1001605-11 = "Это новый релиз в серии Legend of Zinda!"
1001605-12 = "И геймеры, и коллекционеры охотятся за особым бонусом ограниченного издания."
1001605-13 = "Мы словно охотники за редкой добычей..."
1001605-14 = "Нет, то есть герои, сражающиеся с врагами!"
1001605-15 = "[s] «Кажется, это уже не совсем про покупку игры...»"
1001605-16 = "Продажи начнутся через час."
1001605-17 = "Поскольку магазинов не так много, нужно посещать их стратегически."
1001605-18 = "[s] «...Ты уже всё распланировала.»"
1001605-19 = "Конечно. Я целую вечность ждала этого дня!"
1001605-20 = "Нельзя терять время, Сенсей! Начинаем квест!"
1001605-22 = "Первой целью я выбрала гипермаркет. Логично начать с него."
1001605-23 = "Это самый большой магазин, значит, у него будет больше всего копий. Было бы идеально купить здесь!"
1001605-24 = "[ns] «Ой, но смотри, Мидори...»"
1001605-25 = ""
1001605-26 = ""
1001605-27 = ""
1001605-28 = "Рас... продано?"
1001605-29 = "«Все экземпляры новой Legend of Zinda, поступление которых ожидалось сегодня, уже распроданы.»"
1001605-30 = "Н-нас опередили?!"
1001605-31 = "Они правда всё распродали ещё до начала продаж?!"
1001605-32 = "[s5] «Похоже, здесь её нет.»\n[s6] «Наверняка многие подумали так же.»"
1001605-33 = "Надо подать жалобу! Нет, важнее быстро отправиться в другое место и урвать копию!"
1001605-34 = "Надо подать жалобу! Нет, важнее быстро отправиться в другое место и урвать копию!"
1001605-35 = "Сенсей! Бежим!"
