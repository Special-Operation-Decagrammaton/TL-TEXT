[translation]
12060-1 = "Эпизод 6;В Пустыню Абидос. Часть 1"
12060-2 = "На поезде можно было доехать только досюда. Дальше придётся идти пешком."
12060-3 = "За этой точкой начинается Пустыня Абидос... земля, которая была бесплодной ещё до распространения песков."
12060-4 = "Обычно там бродят сломанные дроны, охранные роботы и автоматы, так что место довольно опасное..."
12060-5 = "Но выбора нет. Все, приготовьте оружие."
12060-6 = "Информация о том, что Кайзер что-то делает в Пустыне Абидос..."
12060-7 = "Если хотим понять, правда ли это, придётся самим отправиться туда."
12060-8 = "Кстати, Аяне. Не странно ли, что сведения нам дала именно Старший Префект Геенны?"
12060-9 = "Откуда студенту другой академии столько известно о происходящем в нашем районе?"
12060-10 = "Наверное, потому что Префектурная команда Геенны очень хороша в сборе информации."
12060-11 = "Так что естественно, они знают гораздо больше маленькой академии вроде нашей..."
12060-12 = "Хм... Правда?"
12060-13 = "Да. Особенно главный префект. Помнишь, что сказала старший администратор?"
12060-15 = "Раз это рядом с территорией другой академии, естественно за этим следить..."
12060-16 = "(А...?)"
12060-18 = "Тогда... администратор сказала «рядом с территорией другой академии»."
12060-19 = "Не внутри района, а рядом..."
12060-20 = "П-Правда?!"
12060-21 = "И ещё..."
12060-23 = "Произошли неприятные инциденты, но ничего незаконного... пока. Надеюсь, вы понимаете срочность ситуации."
12060-25 = "«Ничего незаконного...» Это может означать..."
12060-26 = "Они могли не знать всех деталей... Возможно, изначально они и не собирались вторгаться..."
12060-27 = "Не согласна. Префектурная команда напала первой и явно собиралась вторгнуться. Неважно, было это в районе Абидоса или нет."
12060-28 = "И действия Ако после этого были откровенно враждебными."
12060-29 = "Этого уже достаточно."
12060-30 = "Да, возможно, ты права, но..."
12060-32 = ""
12060-33 = "...по крайней мере старший администратор явно знала то, чего не знали мы."
12060-34 = "Так что если у главного префекта Геенны есть сведения, которых нет у нас, ничего странного в этом нет..."
12060-36 = "Ну, наверняка узнаем, когда увидим всё своими глазами."
12060-37 = "Продолжаем."
