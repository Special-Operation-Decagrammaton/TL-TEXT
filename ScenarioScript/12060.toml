[translation]
12060-1 = "Episódio 6;Rumo ao Deserto de Abydos (1)"
12060-2 = "Conseguimos vir de trem até aqui, mas daqui em diante o único meio de locomoção é a pé."
12060-3 = "Se avançarmos um pouco, já estaremos no Deserto de Abydos... o lugar que já era deserto mesmo antes de a desertificação avançar por Abydos."
12060-4 = "É uma área perigosa porque drones danificados, robôs de segurança e autômatos costumam perambular por lá..."
12060-5 = "Agora não temos escolha a não ser abrir caminho à força. Pessoal, verifiquem o funcionamento das suas armas mais uma vez, por favor."
12060-6 = "O que será que a Kaiser Corporation está tramando no Deserto de Abydos..."
12060-7 = "Vamos até lá conferir pessoalmente."
12060-8 = "...Mas, Ayane-chan, pensando bem, quem deu essa informação foi a Chefe do Comitê Disciplinar de Gehenna, né? Isso não parece meio estranho?"
12060-9 = "Por mais que ela seja a Chefe do Comitê Disciplinar, por que uma aluna de outra escola saberia tanto sobre o nosso distrito autônomo?"
12060-10 = "Hmm, é só um palpite, mas... já ouvi dizer que o Comitê Disciplinar de Gehenna tem uma capacidade de coleta de informações excelente..."
12060-11 = "Então talvez eles tenham uma rede de informações inimaginável para uma escola pequena como Abydos...?"
12060-12 = "Bom, pode ser que seja isso mesmo~"
12060-13 = "Na posição de Chefe, todas as informações que o Comitê Disciplinar obtém devem chegar até ela... Além disso, naquela ocasião, a Oficial Administrativa deles disse algo como..."
12060-15 = "Ainda mais estando nas proximidades do distrito autônomo de outra escola, não é natural ter o devido cuidado com isso?"
12060-16 = "(...?)"
12060-18 = "A Oficial Administrativa disse: \"estando nas proximidades do distrito autônomo de outra escola\"..."
12060-19 = "Não \"dentro\" do distrito autônomo, mas apenas \"nas proximidades\"."
12060-20 = "S-Sério que ela disse isso?!"
12060-21 = "E além disso..."
12060-23 = "Embora tenham ocorrido alguns incidentes pouco desejáveis, ainda não se pode afirmar que houve um ato ilegal... Espero que compreendam que foi inevitável."
12060-25 = "\"Ainda não se pode afirmar que houve um ato ilegal\"... Pensando bem nessas palavras..."
12060-26 = "Na hora, achei que fosse apenas uma desculpa esfarrapada... mas talvez eles realmente não tivessem a intenção de invadir ilegalmente."
12060-27 = "...Talvez seja verdade. Mas, naquele momento, o Comitê Disciplinar teve várias falas e ações que claramente configuravam invasão. Se aquele lugar pertencia ou não ao distrito autônomo de Abydos não importa tanto."
12060-28 = "Além disso, o que a Ako fez foi um ato hostil claro."
12060-29 = "Só isso já basta. O julgamento da Ayane naquela hora não estava errado."
12060-30 = "...Sim, tem razão. Obrigada, Shiroko-senpai. Mas..."
12060-33 = "...Aquela Oficial Administrativa sabia de algum fato que nós desconhecíamos. Pelo menos existe essa possibilidade — talvez seja razoável pensar assim."
12060-34 = "Sendo assim, não seria nada estranho se a Chefe do Comitê Disciplinar de Gehenna soubesse de coisas que nós não sabemos."
12060-36 = "Bom, quando chegarmos lá, com certeza vamos descobrir tudo isso e muito mais. Como a Serika-chan disse, o mais rápido é conferir com os próprios olhos~"
12060-37 = "Então, bora continuar avançando~?"
