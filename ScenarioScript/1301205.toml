[translation]
1301205-1 = "Двойная цель"
1301205-2 = "Стрельбище Полицейской школы"
1301205-8 = "Странно. Расстояние совсем небольшое, а я всё равно постоянно промахиваюсь..."
1301205-9 = "С дыханием всё в порядке, да и силы в руках мне хватает."
1301205-10 = "Но стоит нажать на спуск, пуля летит совсем не туда, куда я ожидала — будто точка прицеливания сбита."
1301205-11 = "[s] «Ты уверена, что прицел установлен правильно?»"
1301205-12 = "Конечно. Я каждое утро обслуживаю своё оружие."
1301205-13 = "Если бы с прицелом что-то было не так, я бы давно это заметила."
1301205-14 = "...Хотя оружие БЫВАЕТ капризным, так что полностью исключать это нельзя."
1301205-15 = "Тогда сделаю несколько пробных выстрелов для пристрелки!"
1301205-16 = ""
1301205-18 = ""
1301205-25 = "Когда Кирино закончила стрелять, бумажные мишени вернулись с огневого рубежа."
1301205-26 = ""
1301205-30 = "[ns] «...»"
1301205-31 = "..."
1301205-32 = "В-Всё-таки точка прицеливания была выставлена неправильно!"
1301205-33 = "Иначе пули не могли бы раз за разом лететь прямо в заложника! Ха-ха-ха..."
1301205-34 = "[s] «Поправь прицел и попробуем ещё раз.»"
1301205-35 = "Верно. Сейчас настрою и попробую снова."
1301205-36 = ""
1301205-37 = "Сдвигаю прицел на три щелчка вправо и на три вверх..."
1301205-38 = ""
1301205-47 = "Когда Кирино закончила стрелять, бумажные мишени вернулись с огневого рубежа."
1301205-48 = ""
1301205-52 = "[ns] «...»"
1301205-53 = "..."
1301205-54 = "С-Странно. Я точно целилась прямо в голову преступника и нажала на спуск..."
1301205-55 = "[s] «Ты точно целилась в преступника?»"
1301205-56 = "К-Конечно!"
1301205-57 = "Н-Неужели вы думаете, что я нарочно попала в заложника, Сенсей?"
1301205-58 = "Студент Полицейской школы «Валькирия» никогда намеренно не причинит вред мирному жителю!"
1301205-59 = "То, что мои пули каждый раз попадают в него, — просто досадное совпадение..."
1301205-60 = "В любом случае! Всё это из-за сломанного прицела!"
1301205-61 = "[s] «Кирино.»"
1301205-62 = "А?"
1301205-63 = "[s] «Может, для начала попробуем целиться в заложника?»"
1301205-64 = ""
1301205-65 = "Простите? Вы хотите, чтобы я направила ствол на заложника, а не на преступника?"
1301205-66 = "Я не могу целиться в невинного мирного жителя, даже если это всего лишь тренировка!"
1301205-67 = "Моя гордость полицейского мне этого не позволит!"
1301205-68 = "[s] «Но каждый раз, когда ты целишься в преступника, попадаешь в заложника.»"
1301205-69 = "Э-Это правда, но..."
1301205-70 = ""
1301205-71 = "Простите меня, господин Бумажный Мирный Житель!"
1301205-73 = ""
1301205-82 = "[ns] «...»"
1301205-83 = "..."
1301205-84 = "[s] «Похоже, теперь тебе придётся всегда целиться в заложника.»"
1301205-85 = "Я-я не могу! Какой полицейский станет намеренно целиться в заложника?!"
1301205-86 = "Наверняка произошла ошибка. Если я правильно настрою прицел, то уж тогда..."
1301205-87 = "Я стреляю ещё раз!"
1301205-89 = "Кирино продолжала целиться в преступника, но пули каждый раз без исключения попадали в заложника."
1301205-90 = "А-а-а-а-а! Почему...? Почему?!"
1301205-91 = "В конце концов Кирино со слезами сдалась и стала каждый раз целиться в заложника. Несколько дней спустя она сдала экзамен по стрельбе."
