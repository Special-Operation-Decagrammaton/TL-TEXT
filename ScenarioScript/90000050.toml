[translation]
90000050-1 = "Эпизод 6;Исследование, Часть 5: Руины"
90000050-2 = "Руины? Где это?"
90000050-3 = "О, ты не знаешь, Эйми? Тебе правда стоит лучше следить за слухами."
90000050-4 = "Это неизвестная территория, куда Генеральный Студсовет запретил вход. Город давно заброшен, потому его зовут просто Руинами."
90000050-5 = "О происхождении и принадлежности города ничего не известно, ведь даже научные исследования тут запрещены."
90000050-6 = "Впервые об этом слышу. Даже Президент Рио мне не рассказывала."
90000050-7 = "Для Рио это неудивительно. Она не говорит о вещах, что для неё действительно важны."
90000050-8 = "Рио очень интересны Руины. Вполне в духе \"Большой сестры\", стремящейся монополизировать информацию."
90000050-9 = "Но даже так, слухи о Руинах постоянно всплывают среди студенток Миллениума."
90000050-10 = "Вы же что-то знаете об этом месте, Сенсей?"
90000050-11 = "[s1] «Ну… более менее.»\n[s2] «Хмм, не особо.»"
90000050-14 = "Алис..."
90000050-15 = ""
90000050-17 = ""
90000050-18 = "Нет, забудьте. Это не имеет отношения к нашей миссии, да и история длинная."
90000050-19 = ""
90000050-22 = ""
90000050-23 = "Поговорим об этом в другой раз."
90000050-25 = "Возвращаясь к теме: Руины — что-то вроде Катакомб Тринити или Бездны Вулкана Хинном в Геенне."
90000050-26 = "Это одна из загадочных областей Кивотоса, о которых почти нет информации или которая ещё не исследована…"
90000050-27 = "Место, где вещи Кивотоса исчезают и забываются... словно какая-то канализация."
90000050-29 = ""
90000050-30 = "Канализация... септик... А Вам нравится использовать такие слова, Химари."
90000050-31 = "Я вижу на твоём лице немой вопрос \"Почему Вам нравится всё такое грязное?\". Это метафора, ясно? Так что не порти мой нежный образ."
90000050-32 = "Раз это метафора, то могли бы и получше слова подобрать..."
90000050-33 = "Знаешь, Эйми, в этом мире..."
90000050-34 = "[s] «Так, давайте не будем отходить от темы.»"
90000050-35 = "...Да, Сенсей."
90000050-36 = "Опять из-за Президента разговор ушёл в сторону."
90000050-37 = "Признаю, я грешная женщина... Однако в этом конкретном случае вина лежим именно на тебе, Эйми. Но из уважения к Сенсею я остановлюсь."
90000050-38 = "Вы ошибаетесь, но я тоже остановлюсь. Наша следующая цель в Руинах?"
90000050-39 = "Да. Четвёртый пророк, Хесед, скрывается где-то в Руинах."
90000050-40 = "Хесед..."
90000050-42 = "Декаграмматон вступил в контакт с производственным ИИ оружейного завода и превратил его в одного из своих пророков, получив доступ к бесконечному числу войск."
90000050-43 = "То есть Хесед и есть сам военный завод, производящий легионы Декаграмматона."
90000050-44 = "Главный источник его войск."
90000050-46 = "Но определить местоположение завода в таких огромных Руинах почти невозможно. Нужно больше данных."
90000050-47 = "Значит, следующей целью будет армия Декаграмматона в Руинах?"
90000050-48 = "Да. Соберём данные с войск и попытаемся отследить местоположение Хеседа."
90000050-49 = "Поняла."
90000050-50 = "Я проложила маршрут к Руинам. Войдём отсюда и начнём миссию."
90000050-51 = "Пойдём, Сенсей."
