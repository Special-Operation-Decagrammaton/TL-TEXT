[translation]
1010205-1 = "Бум, бум, бум!"
1010205-2 = "После разговора с Хиёри я отправился на пляж ближе к вечеру."
1010205-3 = ""
1010205-6 = ""
1010205-7 = "Ещё один! Хи-хи."
1010205-8 = "Так-так... Ещё один маленький!"
1010205-9 = ""
1010205-12 = "[ns] «(Она что-то собирает в банку...)»"
1010205-13 = "Здесь всё... Подождите, вон ещё один..."
1010205-14 = ""
1010205-16 = ""
1010205-17 = "Их так много! Сенсею точно понравится..."
1010205-18 = "О, и здесь тоже...!"
1010205-20 = "Я довольно долго наблюдал, как Хиёри радостно что-то собирает, а она меня так и не заметила."
1010205-21 = ""
1010205-22 = "[ns] «Хиёри.»"
1010205-23 = "А, Сенсей?"
1010205-24 = "Уже пора...? Ого, и правда. Как так получилось?"
1010205-25 = "Спасибо, что пришли, Сенсей."
1010205-26 = "Я позвала вас сюда, чтобы наконец отплатить. Хи-хи."
1010205-27 = "Потому что вы всё время что-то мне даёте..."
1010205-28 = "[s1] «В этом правда нет необходимости.»\n[s2] «Я делаю это, потому что сам хочу.»"
1010205-31 = "П-Правда? Но... мне всё равно как-то не по себе."
1010205-32 = "Поэтому надеюсь, этого будет достаточно... Хи-хи..."
1010205-33 = "Мне только нужно... А. Сначала надо дождаться темноты."
1010205-34 = "А? Почему обязательно темноты?"
1010205-35 = "Э-Это сюрприз. Хи-хи."
1010205-36 = "Просто подождите ещё немного..."
1010205-40 = "С-Сейчас!"
1010205-41 = "Начну..."
1010205-42 = ""
1010205-44 = ""
1010205-45 = ""
1010205-46 = ""
1010205-47 = "Мне нужно только поджечь то, что лежит в банке..."
1010205-48 = "Загорелось! Сенсей, смотрите!"
1010205-49 = "[s] «Куда? На что смотреть?»"
1010205-50 = ""
1010205-52 = "Хи-хи. Сюда! Фейерверки! Правда, совсем крошечные."
1010205-53 = "Я собрала кучу оставшихся фейерверков и сломанных ароматических палочек, которые люди бросили на пляже."
1010205-54 = "Я читала, что летом на пляже без фейерверков никак..."
1010205-55 = "Но на настоящие фейерверки у меня денег не хватило. Хи-хи-хи."
1010205-56 = "Э-Это хоть немного похоже на нормальные? Ч-Что думаете, Сенсей?"
1010205-57 = "[s3] «Лучшие фейерверки, что я когда-либо видел.»\n[s4] «Я этого никогда не забуду.»"
1010205-60 = "Какое облегчение..."
1010205-61 = "Я не хотела вас разочаровать."
1010205-62 = "Надеюсь, однажды я смогу увидеть огромные красивые фейерверки, расцветающие в ночном небе..."
1010205-63 = "И... надеюсь, вы будете рядом со мной, Сенсей."
1010205-64 = ""
1010205-67 = "А? Что это за странный звук?"
1010205-68 = ""
1010205-71 = "Ик!"
1010205-72 = "[s] «А-а-а!!»"
1010205-74 = "*кашляет* *кашляет*"
1010205-75 = "Там всё-таки был один большой фейерверк... и когда он взорвался, всё из банки разлетелось..."
1010205-76 = ""
1010205-79 = "...Теперь всё намокло в море... Всё... Всё испорчено!"
1010205-80 = "Почему всё, что я делаю, заканчивается именно так? Неужели даже простые фейерверки — слишком большая просьба?"
1010205-81 = "УААААА!"
1010205-83 = "Я успокоил Хиёри и купил нам новые настоящие фейерверки, чтобы мы запустили их вместе."
1010205-84 = "...К счастью, после этого Хиёри довольно быстро повеселела."
