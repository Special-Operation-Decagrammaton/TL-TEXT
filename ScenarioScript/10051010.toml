[translation]
10051010-1 = "Эпизод 1;Предложение, от которого нельзя отказаться"
10051010-2 = "Класс в старом школьном здании Хяккияко 38"
10051010-3 = "На следующий день..."
10051010-4 = "Ч-Что случилось, Президент?"
10051010-5 = "Вы сказали, что у вас важное объявление..."
10051010-6 = "Конечно! Это значит, что камеру починили?"
10051010-7 = "Е-Ещё нет..."
10051010-8 = "Не так-то просто найти приличную ремонтную мастерскую, няха."
10051010-9 = "...Особенно такую, где работают бесплатно."
10051010-10 = "Тогда... это значит, что наш клуб распускают?"
10051010-11 = "Ни за что."
10051010-12 = "Мы не официальный клуб, так что нас нельзя распустить."
10051010-13 = "В общем, я позвала вас всех сюда потому, что..."
10051010-15 = "Я получила срочное сообщение от Клуба Инь-Ян!"
10051010-16 = "Я-Я так и знала...! Нас наказывают за драку в раменной!"
10051010-17 = "Изуна так не думает, нин-нин!"
10051010-18 = "То, что случилось вчера, было справедливым возмездием!"
10051010-19 = "А, вообще-то, это и правда связано с раменной."
10051010-20 = "Что?"
10051010-21 = "Похоже, Ния об этом услышала. Как обычно."
10051010-22 = "Эээээ?!"
10051010-23 = "Она сказала: «Мичиру, я знаю, что ты сделала. Пожалуйста, приходи сегодня в Клуб Инь-Ян.»"
10051010-24 = "...И ещё — «войти в здание как можно незаметнее.»"
10051010-25 = "Э-Это довольно подозрительно...!"
10051010-26 = "Она точно использует вчерашний случай как рычаг давления. Нам придётся выполнять приказы клуба!"
10051010-27 = "Эм... Не думаю, что это в стиле Клуба Инь-Ян."
10051010-28 = "...Хотя, может, и в их стиле. У Нии... свои методы."
10051010-29 = "В любом случае! Я всё вам расскажу, когда триумфально вернусь!"
10051010-30 = "У-Удачи! Президент!"
10051010-31 = "Счастливого пути! Нин-нин!"
10051010-33 = "Комната Клуба Инь-Ян"
10051010-34 = "Фу-фу, госпожа Президент. Как всегда, рада встрече."
10051010-35 = "Мне весьма понравилось наблюдать за вашей слаженной дракой в раменной вчера."
10051010-36 = "Правда? А вы почему там были?"
10051010-37 = "Полагаю, потому что хотела рамена."
10051010-38 = "Так вы тоже едите рамен..."
10051010-39 = "Я думала, вы больше по каким-нибудь изысканным дегустационным сетам."
10051010-40 = "Какое занятное у вас обо мне впечатление..."
10051010-41 = "Но неважно. Мне прекрасно было видно вашу неуклюжую атаку петардами, ня-ха-ха!"
10051010-42 = "Н-Не называйте её неуклюжей!"
10051010-43 = "Хм? А я думала, эта «неуклюжесть» была намеренной."
10051010-44 = "Отвлечь противника петардами и ударить со спины..."
10051010-45 = "...при этом ещё и предусмотрительно защитив владельца заведения..."
10051010-46 = "Я была впечатлена."
10051010-47 = "Эм... Э-э..."
10051010-48 = "В-Вы очень проницательны!"
10051010-49 = "Так и БЫЛО задумано! Всё до последней детали! Вы правы!"
10051010-50 = "Фу-фу, я знаю."
10051010-51 = "Как бы то ни было, я понимаю, что работать слаженной командой — вовсе не простая задача."
10051010-52 = "Быстрые решения, бесшумные и решительные действия, безупречная координация..."
10051010-53 = "Я прониклась ещё большим уважением к Клубу исследования ниндзюцу. Вы явно тренировались, не так ли?"
10051010-54 = "Эм... Спасибо."
10051010-55 = "(Но мы почти никогда не тренируемся вместе...)"
10051010-56 = "(Мы хорошо координируемся просто потому, что всё время тусуемся вместе...)"
10051010-57 = "(Но если отбросить это, чего она вдруг так рассыпается в комплиментах?)"
10051010-58 = "(Она не из тех, кто раздаёт похвалу бесплатно...)"
10051010-59 = "Хорошо. Хватит лести."
10051010-60 = "Ик!"
10051010-61 = "Есть причина, по которой я позвала тебя сюда, Мичиру, президент Клуба исследования ниндзюцу."
10051010-62 = "Если сразу к делу: Хяккияко нужна сила вашего клуба."
10051010-63 = "Наша сила...?"
10051010-64 = "Погодите, вы не собираетесь нас наказывать?"
10051010-65 = "А? Наказывать?"
10051010-66 = "Всю эту заварушку начала Исследовательская ассоциация рамена. С чего мне наказывать вас за их поступки?"
10051010-67 = "Ах..."
10051010-68 = "Стоп, почему вы вдруг звучите непривычно разумно?"
10051010-69 = "Какое занятное у вас обо мне впечатление..."
10051010-70 = "Но вернёмся к делу. Точнее, к тому, насколько вы трое на самом деле сильны и способны."
10051010-71 = "Мы получили заказ. Одной о-о-очень важной персоне нужна охрана."
10051010-72 = "Заказ на охрану...?!"
10051010-73 = "Да. Вы слышали о «Шайнкэт»?"
10051010-74 = "Шайнкэт...?"
10051010-75 = "М-м, нет, никогда о нём не слышала."
10051010-76 = "Фу-фу, тогда я объясню."
10051010-77 = ""
10051010-78 = "Шайнкэт — самый известный дизайнер одежды в Кивотосе."
10051010-79 = "Все, кто хоть немного интересуется модой, следят за ним."
10051010-80 = "У него огромное влияние в индустрии. Одним словом он способен перенести Неделю моды на удобную ему дату."
10051010-81 = "И существует негласное правило: ни один модный показ не начинается, пока Шайнкэт не займёт своё место."
10051010-82 = "Так что представьте, что такой человек посещает модный показ в Хяккияко. Какой престиж..."
10051010-84 = "Именно поэтому..."
10051010-85 = "...Клуб Инь-Ян выбрал вас троих в качестве специальной охраны Шайнкэт!"
10051010-86 = "Ох...!"
10051010-87 = ""
10051010-89 = ""
10051010-90 = "Погодите, то, что вы увидели нашу командную работу, — и есть вся причина? Такое чувство, будто вы что-то пропустили."
10051010-91 = "Хм? И что же именно я пропустила?"
10051010-92 = "Всё логично. Я увидела, как ваш клуб продемонстрировал свои навыки в раменной, и решила, что вы трое отлично справитесь с охраной."
10051010-93 = "Есть проблема?"
10051010-94 = "Эм, спасибо, что так высоко нас оцениваете..."
10051010-95 = "Но... если речь о боевых навыках, разве Совет урегулирования Хяккарёран не был бы лучшим выбором?"
10051010-96 = "К-Конечно, ниндзя непобедимы, но, э-э, ну вы понимаете...?"
10051010-97 = "Фу-фу, да, мне прекрасно известно о впечатляющей силе Хяккарёран."
10051010-98 = "Но если бы меня интересовала исключительно грубая сила, я могла бы просто... поставить танк на взлётно-посадочную полосу и угрожать людям, верно?"
10051010-99 = "Э-Это вообще возможно...?"
10051010-100 = "Да. Но для охраны требуется гораздо больше, чем одна лишь грубая сила."
10051010-101 = "Скорость, скрытность и безупречная командная работа..."
10051010-102 = "При сопровождении VIP-персоны сквозь толпу эти качества куда важнее чистых боевых навыков."
10051010-103 = "Я считаю, что вы трое отлично подходите для этой задачи."
10051010-104 = "Нужно ли объяснять подробнее?"
10051010-105 = "...Ну, скорость и скрытность — основы ниндзюцу..."
10051010-106 = "Фу-фу, не нужно так переживать."
10051010-107 = "Шайнкэт также будет охранять команда безопасности агентства."
10051010-108 = "А для вас троих я приготовила кое-что поинтереснее. Хочу, чтобы вы смешались с толпой."
10051010-110 = "Иными словами, обеспечивали скрытую охрану."
10051010-111 = "Под прикрытием...!"
10051010-112 = "Ах да, разумеется, предусмотрено и весьма щедрое вознаграждение."
10051010-113 = "Что?! Правда?!"
10051010-114 = "Хм? Что в этом удивительного?"
10051010-115 = "Вы что, подумали, будто я собираюсь... злоупотребить своим огромным влиянием и заставить вас выполнять мои приказы?"
10051010-116 = "Это... ОЧЕНЬ конкретное отрицание..."
10051010-117 = "В любом случае, можно спросить, что за награда?"
10051010-118 = "Фу-фу."
10051010-119 = "Разве не очевидно? На складе Клуба Инь-Ян хранится весьма солидный запас продвинутой электроники."
10051010-120 = "И так уж вышло, что мы обнаружили профессиональную камеру в превосходном состоянии."
10051010-121 = "Камера?"
10051010-122 = "Да. Хорошее разрешение, приличная ёмкость аккумулятора..."
10051010-123 = "Возможно, она даже лучше той, которой вы пользовались для видео Клуба исследования ниндзюцу..."
10051010-124 = "...!"
10051010-125 = "Вашу камеру ведь залило бульоном тонкоцу, верно? Соль, вода, электричество..."
10051010-126 = "...Если так, подозреваю, ваша камера вышла из строя."
10051010-127 = "Очевидно, вам нужна новая камера."
10051010-128 = "К-Как... вы узнали...?"
10051010-129 = "Если примете эту работу, я предоставлю вам запасную камеру Клуба Инь-Ян."
10051010-130 = "Разумеется, поскольку мы общественная организация, мы не можем просто ОТДАТЬ её вам."
10051010-131 = "Но можем передать её вам по... ссуде на 9 999 лет. Ради культурного развития."
10051010-132 = "Но к тому времени от камеры останется одна пыль?"
10051010-133 = "Тогда возьмите совок. Ну что скажете, президент Мичиру?"
10051010-134 = "Хм..."
10051010-135 = "Ниндзя не должен игнорировать зов невинных."
10051010-136 = "Тогда я принимаю великий заказ Клуба Инь-Ян!"
10051010-137 = "И, чтобы было ясно, вовсе не из-за камеры! Дело в чести и... благородстве!"
10051010-138 = "Разумеется, и от столь щедрой ссуды я никак не могла бы отказаться."
10051010-139 = "Ня-ха-ха! Тогда договорились."
10051010-140 = "И раз уж у нас состоялась такая славная «сделка»..."
10051010-141 = ""
10051010-143 = ""
10051010-145 = "...давайте обсудим «условия», которые вы должны выполнить во время операции."
10051010-146 = "Ч-Что в ящике?"
10051010-147 = "Фу-фу. Это самое важное условие, Президент."
10051010-148 = "Моё главное требование, если вы хотите получить награду за этот заказ..."
10051010-149 = "...ваш клуб должен использовать то, что находится в этом сундуке."
10051010-150 = "М-Мы такого не обсуждали!"
10051010-151 = "Но вы ведь уже согласились, не так ли?"
10051010-152 = "Ниндзя ведь никогда... не нарушит данную клятву, правда?"
10051010-153 = "Тц..."
10051010-154 = "Фу-фу, а теперь..."
10051010-155 = ""
10051010-157 = ""
10051010-158 = ""
10051010-159 = ""
10051010-161 = "*щелчок*"
10051010-162 = ""
10051010-163 = "...давайте откроем его вместе, хорошо?"
10051010-164 = "Эм, перед этим. Подождите..."
10051010-165 = "Хм?"
10051010-166 = "Содержимое сундука... поэтому вы попросили меня прийти одну? И тайком?"
10051010-167 = "Нет, причина не в этом."
10051010-168 = "Тогда зачем?"
10051010-169 = "Фу-фу, я устроила всю эту секретность потому, что...!"
10051010-171 = "...это весело."
10051010-172 = ""
10051010-174 = ""
10051010-175 = "..."
10051010-176 = "Просто откройте сундук."
