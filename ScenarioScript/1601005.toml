[translation]
1601005-1 = "Мастер высокого давления"
1601005-4 = ""
1601005-5 = "Офис Шале"
1601005-7 = ""
1601005-8 = "Ты пришёл, Сенсей."
1601005-9 = "Я ждала."
1601005-10 = "[s1] «...Я вернулся.»\n[s2] «Опять форма болельщицы?»"
1601005-11 = "Да, сегодня моя обязанность — поддерживать."
1601005-12 = "Да, сегодня моя обязанность — поддерживать."
1601005-13 = "Как я уже говорила, для любой работы в мире существует оптимальный наряд."
1601005-14 = "Поэтому, естественно, на мне форма болельщицы."
1601005-15 = "...Ну что, уже почувствовал мотивацию?"
1601005-16 = ""
1601005-19 = "[ns3] «...Не знаю.»\n[ns4] «Только не к работе...»"
1601005-22 = "Именно поэтому сегодня я принесла своё изобретение."
1601005-23 = "В прошлый раз я не до конца понимала офисную работу, поэтому вместо мотивации только отвлекала тебя..."
1601005-24 = "Но теперь будет лучше: с учётом твоих отзывов я полностью убрала движение из поддержки."
1601005-25 = ""
1601005-27 = ""
1601005-28 = ""
1601005-30 = ""
1601005-32 = "А теперь узри идеальный инструмент поддержки!"
1601005-33 = "[s] «...Текстовый процессор?»"
1601005-34 = "Да. Компьютер, специализирующийся на создании документов. От обычных устройств для обработки текста он отличается не слишком сильно..."
1601005-35 = "...Кроме одной особой функции."
1601005-36 = ""
1601005-38 = ""
1601005-41 = "Сенсей, почему бы тебе не поработать на нём?"
1601005-42 = "Чем жестче срок, тем эффективнее он работает."
1601005-43 = "[s] Написать отчёт с горящим дедлайном."
1601005-44 = ""
1601005-46 = ""
1601005-51 = "[ns] «Кажется, ничего не происходит...»"
1601005-52 = "Хе-хе. Не переживай."
1601005-53 = "Настоящая ценность этого устройства проявится только тогда, когда ты по-настоящему отвлечёшься."
1601005-54 = "...А пока продолжай работать как обычно."
1601005-57 = "Примерно десять минут спустя..."
1601005-63 = "[ns] «Я больше не могу придумать, что писать...»"
1601005-64 = ""
1601005-67 = "<Предупреждение: новых предложений за последнюю минуту: 0>"
1601005-68 = "<Внимание: если счётчик новых предложений останется на 0, через 2 минуты начнётся ликвидация.>"
1601005-69 = "[s] «...Ликвидация?»"
1601005-70 = "Видишь ли, в этом текстовом процессоре есть таймер."
1601005-71 = "Если три минуты ничего продуктивного не делать..."
1601005-72 = "...устройство взорвётся."
1601005-73 = "[s5] «Взорвётся?!»\n[s6] «Но зачем?!»"
1601005-74 = "Часто говорят, что люди работают продуктивнее всего, когда смотрят в лицо невозможному дедлайну."
1601005-75 = "Часто говорят, что люди работают продуктивнее всего, когда смотрят в лицо невозможному дедлайну."
1601005-76 = "Даже если задача та же самая, мозг обрабатывает её по-разному в зависимости от обстоятельств."
1601005-77 = "Это устройство гарантирует, что обстоятельства всегда будут предельно срочными."
1601005-78 = "Стоит понять, что твоя работа будет полностью и безвозвратно уничтожена... Как говорится, сокрушительное отчаяние — мать всех изобретений!"
1601005-79 = "[s] «Кто так говорит?! Демоны?!»"
1601005-80 = ""
1601005-83 = "Ты уверен, что нам стоит сейчас разговаривать, Сенсей? У тебя осталась всего минута."
1601005-84 = ""
1601005-87 = "[ns] «Надо что-нибудь написать... хоть что-то...»"
1601005-90 = "<Предупреждение: написанное вами предложение признано полностью не относящимся к делу.>"
1601005-91 = "<Ваша неуместность не остановит процесс ликвидации.>"
1601005-92 = "[s] «Почему оно такое злое?!»"
1601005-93 = "В этом текстовом процессоре есть простой ИИ, единственная задача которого — определять ценность всего, что ты пишешь."
1601005-94 = "Пустые слова не делают работу продуктивнее."
1601005-95 = "Серьёзно, Сенсей. Похоже, ты совсем не воспринимаешь это всерьёз..."
1601005-96 = ""
1601005-98 = ""
1601005-99 = ""
1601005-101 = "Лучше соберись, найди мотивацию и напечатай хоть что-нибудь."
1601005-102 = "[s] «...Я больше не верю в логику...»"
1601005-103 = "Давай! Давай! Ты сможешь! Просто сделай — и всё получится!"
1601005-105 = "«Благодаря» изобретению Хибики я закончил отчёт невероятно быстро..."
1601005-106 = "А сразу после этого конфисковал устройство с ключевой функцией самоподрыва..."
