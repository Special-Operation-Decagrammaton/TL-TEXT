[translation]
10034070-1 = "Эпизод 7;Прямиком из молодёжной манги"
10034070-3 = "Вы пришли. Сюда, Сенсей."
10034070-4 = "Камеры вот здесь. Да. Именно эти трое пытались проникнуть в Комитет Карнавала. Пойманы с поличным."
10034070-5 = "Почему-то они сказали, что не будут разговаривать, пока вы не придёте."
10034070-6 = "Они не украли никаких ценностей или денег. Мы всё ещё пытаемся выяснить, чего они добивались."
10034070-7 = "К тому времени, как нас вызвали, они уже успели сцепиться с дежурившими студентами и прорваться через всю нашу оборону."
10034070-8 = "Надо отдать им должное, они очень умелые. Даже заставили нас попотеть."
10034070-9 = "В любом случае оставлю их вам. Остальное сможете обсудить с Ичикой."
10034070-10 = "Хорошо, спасибо. Теперь они ваши."
10034070-11 = ""
10034070-13 = ""
10034070-16 = "Воссоединение, разделённое железными прутьями..."
10034070-17 = "...Это определённо рок."
10034070-18 = "Я думала, мы продержимся там немного дольше. Похоже, Cath Palug растеряла форму."
10034070-19 = "Я ТЕБЯ убью, если не перестанешь меня так называть..."
10034070-20 = "...Тьфу, неважно. Теперь мы здесь, как и знали, что будет."
10034070-21 = "[ns1] «Так что здесь вообще происходит...?»\n[ns2] «Что вы натворили...?»"
10034070-24 = "Так, для начала, Оперативная группа правосудия наконец ушла...?"
10034070-25 = "Они ушли, да? Точно ушли?"
10034070-26 = "[s3] «Ну, да...»\n[s4] «Что вы прячете?»"
10034070-27 = ""
10034070-28 = ""
10034070-30 = ""
10034070-31 = "...Сенсей. Айри ведь здесь с вами, да?"
10034070-32 = "Вы наверняка ходили к ней. Значит, вы привели её с собой?"
10034070-33 = "Ты сейчас ОЧЕНЬ многое предполагаешь."
10034070-34 = "[s5] «Айри?»\n[s6] «Да, она здесь.»"
10034070-35 = ""
10034070-36 = ""
10034070-38 = ""
10034070-40 = ""
10034070-41 = "Что...? Я?"
10034070-42 = "Вы меня зовёте...? Зачем вы...?"
10034070-43 = "...Подойди сюда."
10034070-44 = "Хм?"
10034070-45 = "...Ближе."
10034070-46 = "Хмм??"
10034070-47 = "...Ещё ближе..."
10034070-48 = "...Хмм?!"
10034070-49 = "...Хорошо."
10034070-50 = "...Вот!"
10034070-51 = ""
10034070-53 = ""
10034070-56 = "...Хммм??!!"
10034070-57 = "Э-Это...?"
10034070-58 = "[ns7] «...Frederica Semla.»\n[ns8] «Вы трое...»"
10034070-61 = ""
10034070-62 = "Это с самого начала было нашей движущей силой..."
10034070-63 = "...так нам хотелось бы сказать. На самом деле вся эта авантюра родилась в последний момент..."
10034070-64 = "Но это действительно настоящая semla, прямо из их хранилища. Попробуй."
10034070-65 = "Серьёзно, тебе надо было просто сказать, насколько сильно она тебе нужна, а не заставлять нас всех волноваться!"
10034070-66 = "Для протокола: большую часть драк на себя взяла я."
10034070-67 = "В любом случае ешь и расскажи, какая она. Мы сами ещё ни кусочка не пробовали."
10034070-68 = "А ещё, учитывая обстоятельства, нас наверняка лишили всех прав на клубную комнату."
10034070-69 = "Завтра создам групповой чат, тогда и обсудим всё подробнее."
10034070-71 = "П-погодите. Ч-что вы имеете в виду?"
10034070-72 = "...Прости, что мы сорвались и сделали всё это без тебя, Айри."
10034070-73 = "Вы... О, только не говорите..."
10034070-74 = "Вы правда прошли через всё это только ради...?"
10034070-75 = "Хм?"
10034070-76 = "Но почему... Зачем вам было...?"
10034070-77 = "...П-погодите. Мы СОВСЕМ не такой реакции от тебя ожидали."
10034070-78 = "Почему? Зачем вообще вы...?"
10034070-79 = "Ради меня...?"
10034070-80 = "Конечно...? Разве не этого ты хотела? Разве не поэтому вообще решила собрать группу?"
10034070-81 = ""
10034070-83 = ""
10034070-84 = ""
10034070-86 = ""
10034070-87 = "Погодите... не поэтому?! Что?!"
10034070-88 = "...Стоп, а РАДИ ЧЕГО тогда мы всё это делали?"
10034070-89 = "Чья вообще это была идея? Кто первым это придумал?"
10034070-90 = "Хи-хи. Значит, это совсем другой вид рока..."
10034070-91 = "Это не смешно! Что с тобой не так?"
10034070-93 = "Почему... Почему вы...?"
10034070-94 = "...Ради такой, как я... Почему...?"
10034070-96 = "Хм?"
10034070-97 = "Что??"
10034070-98 = "Ч-что такое? Почему ты плачешь...?"
10034070-99 = "А-Айри...?! Айри, что с тобой? Что случилось?"
10034070-100 = "Сенсей?! Что происходит? Почему Айри плачет??"
10034070-101 = ""
10034070-103 = ""
10034070-105 = ""
10034070-106 = "[ns9] «Давай, Айри.»\n[ns10] «Хочешь рассказать им?»"
10034070-109 = "Ч-что? Сенсей...?"
10034070-110 = "...? Рассказать им... прямо?"
10034070-111 = "То, что я сказала вам раньше? Н-нет...!! Я не могу, не смогу!"
10034070-112 = "Я не могу сказать всё это... не здесь...!"
10034070-113 = "Хм?"
10034070-114 = "Ч-что происходит? Вы двое что-то от нас скрываете?"
10034070-115 = "Тайная ночная встреча за спинами остальных... Это совсем не рок..."
10034070-116 = "...Погоди, Сенсей только что сказал Айри рассказать нам всё. Как ты вообще из этого вывела, что «они что-то скрывают»?"
10034070-117 = "В любом случае рассказывай немедленно! Я не знаю, что там такое, но после всего, через что мы прошли, я ТРЕБУЮ знать!!"
10034070-118 = "Есть два гарантированных способа всех раздражать. Первый — оборвать рассказ на самом интересном месте, а второй..."
10034070-119 = "С-Сенсей..."
10034070-120 = ""
10034070-123 = "[ns11] «Мне стоит пойти поговорить с Оперативной группой правосудия.»\n[ns12] «Интересно, какую отговорку я придумаю на этот раз...»"
10034070-126 = "С-сенсей...! Сенсей..."
10034070-127 = "[ns13] «Всё хорошо, Айри. Ты справишься.»\n[ns14] Уйти, притворившись, что ничего не слышишь."
10034070-131 = "Сенсе-э-эй!"
10034070-133 = ""
10034070-134 = ""
10034070-135 = "...Да, хорошо, я понимаю. Так и укажу в отчёте."
10034070-136 = "Как для оправдания — довольно неплохо. Думаю, с вашими девочками всё будет в порядке."
10034070-137 = "В любом случае намерения у них были хорошие. Я постараюсь преуменьшить всё остальное."
10034070-138 = "[s15] «Большое спасибо, Ичика.»\n[s16] «Я у тебя в большом долгу.»"
10034070-141 = "Да ничего. Вы так много работаете, Сенсей."
10034070-142 = "К тому же мы ведь обещали звонить друг другу, если что-нибудь случится!"
10034070-143 = "И этот инцидент был не таким уж страшным. Они сплочённая компания милых подруг. Ха-ха!"
10034070-144 = "К тому же Чаепитие не захочет поднимать шум перед большим мероприятием. Скорее всего, они согласятся всё замять."
10034070-145 = "Так что вам больше не о чем беспокоиться. Всё уладится."
10034070-146 = ""
10034070-148 = ""
10034070-149 = ""
10034070-150 = "...Ах, ещё работа..."
10034070-151 = "Сенсей, я бы с удовольствием ещё поболтала, но мне пора."
10034070-152 = "До следующей встречи!"
10034070-153 = "[s17] «Береги себя.»\n[s18] Помахать на прощание."
10034070-154 = ""
10034070-155 = ""
10034070-157 = ""
10034070-161 = "...Невероятно."
10034070-162 = "Из этого получилась бы великолепная концовка манги."
10034070-163 = ""
10034070-164 = "Жизнь подражает искусству..."
10034070-165 = "[s19] «Я так и думал, что ты будешь здесь, Цумуги.»\n[s20] «Прости, что вызвал тебя так внезапно.»"
10034070-166 = ""
10034070-167 = ""
10034070-169 = ""
10034070-170 = "Если бы я не хотела, чтобы вы мне звонили, я бы не дала вам свой номер."
10034070-171 = "Вообще-то я не сразу увидела ваше сообщение. Поэтому и опоздала. Простите..."
10034070-172 = "И всё же..."
10034070-173 = "Похоже, наша главная героиня уже окружена хорошими друзьями."
10034070-174 = "...Главная героиня, которая отчаивается из-за собственных недостатков."
10034070-175 = "Единственная, кто относился к музыке всерьёз... и поэтому единственная, кто столкнулся с испытанием неуверенностью."
10034070-176 = "Это затянуло её в спираль самокритики и внутреннего конфликта."
10034070-177 = "Конфликт с друзьями, побег, драматичное воссоединение и наконец правда..."
10034070-178 = "Когда она всё это преодолеет, её практика и опыт засияют."
10034070-179 = "Когда она пробьёт установленные самой себе пределы, её выступление станет просто неземным."
10034070-180 = "Идеально. Это такой прекрасный пример..."
10034070-181 = ""
10034070-183 = ""
10034070-184 = ""
10034070-185 = "...юности."
10034070-186 = "Я бы описала это как историю юности, которую хранят в сердце."
10034070-187 = "И теперь эта прекрасная сцена подходит к своему трогательному кульминационному моменту."
10034070-188 = "Они будут плакать, кричать, а потом вы увидите улыбки сквозь слёзы радости."
10034070-189 = "Вы уверены, что не хотите увидеть это своими глазами? Разве не будет обидно пропустить всё из-за разговора со мной?"
10034070-190 = "[s21] «Всё нормально. Я учитель.»\n[s22] «Эта радость принадлежит им. Речь не обо мне.»"
10034070-193 = "Ах... Понятно."
10034070-194 = "Слова настоящего взрослого... и вот я получила ещё один урок."
10034070-195 = ""
10034070-197 = ""
10034070-198 = "Но, Сенсей... кое-что всё ещё осталось нерешённым."
10034070-199 = "Разве главная героиня так и не обнаружила в себе никакой особой силы или таланта?"
10034070-200 = "Для манги с такой красивой обложкой это было бы довольно уныло."
10034070-201 = "Что думаете, Сенсей?"
10034070-202 = "...А?"
10034070-203 = "«Удивительно, но не любить какую-то часть себя — совершенно естественно»...?"
10034070-204 = "Неожиданно. Не думала, что именно вы скажете такое, Сенсей..."
10034070-205 = "[s23] «Тяжело сравнивать себя со всеми вокруг.»\n[s24] «Но даже так, если люди рядом тебе дороги...»"
10034070-206 = ""
10034070-207 = ""
10034070-210 = "[ns25] «Они дорожат тобой так же, как ты ими.»\n[ns26] «...Тебе стоит признать своё влияние на них.»"
10034070-211 = ""
10034070-212 = ""
10034070-214 = ""
10034070-215 = "...О-хо."
10034070-216 = "...Понятно. Если она любит своё окружение и людей в нём..."
10034070-217 = "...ей стоит понимать, что именно она помогла создать вокруг себя такую среду."
10034070-218 = "Но поскольку для неё это получается совершенно естественно... она сама этого не замечает."
10034070-219 = "Очень романтично. И очень приятно."
10034070-220 = "Эта манга слишком хороша, чтобы наслаждаться ею бесплатно. Я чувствую себя обязанной отплатить за всё полученное удовольствие."
10034070-221 = "Так что, Сенсей, возьмите это..."
10034070-222 = ""
10034070-224 = ""
10034070-225 = "[ns27] «...Это...»\n[ns28] «Музыкальная пьеса? Ты сама её сочинила?»"
10034070-228 = "Когда я писала её, то представляла именно такой финал. Никогда не думала, что действительно увижу его своими глазами."
10034070-229 = "Хотя она намного сложнее прошлой песни..."
10034070-230 = "...Хи-хи. Ну, для тех, кем они стали сейчас и кем ещё станут, это не должно быть проблемой."
10034070-231 = "Считайте это моей платой за вход на представление. Здесь только музыка, без текста. Слова оставлю главной героине."
10034070-232 = "...Ах, посмотрите на время. Все наверняка уже ждут."
10034070-233 = "Мне пора. Увидимся на нашем концерте."
10034070-234 = "Сразу предупреждаю: я не соло-гитаристка, не вокалистка и вообще ничего такого, так что многого не ждите."
10034070-235 = "Может, вы даже не узнаете меня на сцене. Остальные куда более приметные."
10034070-236 = "Но... ну, это не так уж важно."
10034070-237 = ""
10034070-239 = ""
10034070-240 = ""
10034070-241 = "...Мне достаточно просто находиться в одном пространстве с музыкой."
10034070-244 = "О чём ты вообще говоришь?! Ты только и делаешь, что повторяешь какую-то чушь!!"
10034070-245 = "Нет, погоди, Ёшими, это всё ещё..."
10034070-246 = "...О, Сенсей! Это Сенсей!!"
10034070-247 = "Послушайте, Айри там бормочет, что она «ничего не делает» или «ничего не имеет»..."
10034070-248 = "Я имела в виду, что мне нечем похвастаться."
10034070-249 = "То есть тебе нужна какая-нибудь фишка? Например, побольше рока?"
10034070-250 = "Это легко решить. Тебе просто нужно забрать то, что принадлежит тебе по праву. Трон, корону, титул."
10034070-251 = "Ах, и вот мы наконец к этому пришли. Возвращение нашей давно отсутствовавшей небесной королевы."
10034070-252 = ""
10034070-254 = ""
10034070-255 = "Мы ведь говорим о том, чтобы сделать её президентом клуба, да?"
10034070-256 = "...А? «С каких пор у нас вообще есть президенты?» — спрашиваете вы, Сенсей? И правда, в нашем клубе никогда толком не было президента."
10034070-257 = "Потому что наша основательница сказала, что ей не нравится «иерархия», которая возникает из-за таких должностей."
10034070-258 = "[s29] «...А.»\n[s30] «Тогда основательницей Клуба сладкоежек после уроков была...»"
10034070-261 = "Я же сказала, дело было не в этом! Мне не нужно становиться президентом...!"
10034070-262 = "Ладно, ладно. Давайте прекратим об этом говорить! Простите...!!"
10034070-263 = "Нет. Она может снова начать нести чушь при первой же возможности. Нужно сейчас дать ей что-нибудь, чтобы это предотвратить."
10034070-264 = ""
10034070-266 = ""
10034070-267 = ""
10034070-268 = "Согласна. Вообще-то я здесь потому, что..."
10034070-269 = "Хм?"
10034070-270 = "Что, ты уже даже не пытаешься это скрывать, Cath Palug?"
10034070-271 = "...зачем ещё мне было сюда приходить, если не ради вкусного десерта?"
10034070-272 = ""
10034070-274 = ""
10034070-275 = ""
10034070-276 = "О чём мы вообще говорим? Почему все так мнутся? И мы ещё называем себя старшеклассницами?"
10034070-277 = "Айри, если бы не ты, нас троих вообще ЗДЕСЬ бы не было! Поняла?!"
10034070-278 = "Не то чтобы я была рада идти в комплекте с этими двумя...!"
10034070-279 = "Сейчас не время такое говорить..."
10034070-281 = "Ё-Ёшими..."
10034070-282 = "Но я думала, что вы...!"
10034070-284 = "Я сказала, всё нормально!! Не надо изображать святую! Иногда друзья могут тебя раздражать!!"
10034070-285 = "Вообще-то, когда рядом эти двое..."
10034070-286 = "Ага. Я раздражаюсь постоянно. Раз в неделю мне хочется кого-нибудь убить."
10034070-287 = "Вот как... Казуса?"
10034070-288 = "А? Ч-что это за реакция...?"
10034070-289 = "Казуса..."
10034070-290 = ""
10034070-292 = ""
10034070-293 = ""
10034070-294 = "Тебе не надоедает всё время так злиться?"
10034070-296 = "В 70% случаев это твоя вина!"
10034070-297 = ""
10034070-302 = "Я никогда не поддамся насилию!"
10034070-303 = ""
10034070-310 = "Не выставляй против меня щит!!"
10034070-311 = "Люди — находчивые существа. Мы всегда найдём способ!!"
10034070-312 = "Фух... А-а-ах... У меня болит голова..."
10034070-313 = ""
10034070-315 = ""
10034070-316 = "Но... на этот раз Ёшими права."
10034070-317 = "...На этот раз?"
10034070-318 = "...Айри."
10034070-319 = "Ты можешь не любить себя. Я понимаю это чувство, пожалуй, лучше большинства."
10034070-320 = "И мне не следовало считать, что ты не можешь чувствовать себя так же."
10034070-321 = "...Прости, Айри."
10034070-323 = "Казуса..."
10034070-324 = ""
10034070-326 = ""
10034070-327 = ""
10034070-328 = "Так что в завершение позволь мне сказать одну вещь."
10034070-329 = "Прежде чем отвергать себя, оглянись вокруг. Посмотри на всю картину и на своё место в ней."
10034070-330 = "...Айри."
10034070-331 = ""
10034070-333 = ""
10034070-334 = ""
10034070-335 = ""
10034070-336 = ""
10034070-337 = "Тебе..."
10034070-338 = ""
10034070-346 = ""
10034070-348 = ""
10034070-350 = ""
10034070-354 = ""
10034070-356 = ""
10034070-365 = "«...Тебе не нравится этот момент, который ты сама помогла создать?»"
10034070-367 = ""
10034070-368 = ""
10034070-369 = ""
10034070-370 = ""
10034070-371 = ""
10034070-372 = ""
10034070-373 = ""
10034070-374 = ""
10034070-376 = "[log=아이리 밴드]«...Нет, мне он очень нравится.»[/log]"
