[translation]
12160-1 = "Episódio 16;Uma Luta de Adultos"
12160-2 = "...Eu sei quem você é. A existência inexplicável convocada pela Presidente do Conselho Estudantil Geral."
12160-3 = "Mestre daquele OOPArt \"Caixa de Shittim\" e Sensei do Clube de Investigação Federal \"Schale\"."
12160-4 = "Parece haver quem o subestime, mas nós não somos assim."
12160-5 = "...Primeiro, vamos deixar uma coisa bem clara."
12160-6 = "Nós não temos intenção alguma de ser seus inimigos."
12160-7 = "Pelo contrário, gostaríamos de cooperar com você."
12160-8 = "Acreditamos que, em nossos planos, você é quem pode se tornar o maior obstáculo."
12160-9 = "Para nós, uma escola pequena como Abydos não é nenhum grande problema. Contudo, Sensei, a sua existência está longe de ser algo trivial. Gostaríamos de evitar qualquer hostilidade."
12160-10 = "[s] \"Quem são vocês, afinal?\""
12160-11 = "...Oh, pensando bem, ainda não me apresentei, não é mesmo?"
12160-12 = "Nós somos, assim como você, seres de fora de Kivotos... mas pertencemos a um domínio diferente do seu."
12160-15 = "Encontramos um nome bem apropriado e o pegamos emprestado por enquanto. Por favor, chame-nos de \"Gematria\"."
12160-16 = "E quanto a mim, pode me chamar de \"Terno Preto\". Eu realmente gostei desse nome."
12160-17 = "Nós somos observadores, buscadores e pesquisadores."
12160-18 = "Pode nos considerar uma \"existência inexplicável\", exatamente como você."
12160-19 = "Vou perguntar por via das dúvidas: não tem interesse em cooperar com a Gematria?"
12160-20 = "[s1] \"Recuso.\"\n[s2] \"Nem pensar.\""
12160-21 = "...Entendo."
12160-22 = "...Entendo."
12160-25 = "Ao recusar até mesmo uma proposta que lhe daria acesso à verdade e aos mistérios ocultos, o que exatamente você pretende buscar em Kivotos?"
12160-26 = "[s3] \"No mínimo, não tenho interesse numa proposta dessas.\"\n[s4] \"Eu só vim aqui para pegar a Hoshino de volta.\""
12160-27 = "...Heh heh heh."
12160-28 = "...Heh heh heh."
12160-29 = "Você percebe que suas ações não têm legitimidade alguma, Sensei? Que direito você tem, exatamente, para fazer uma exigência dessas agora?"
12160-30 = "Hoshino não é mais uma aluna de Abydos. Você não conferiu o documento?"
12160-31 = "[s] \"...Ainda não.\""
12160-32 = "...Oh?"
12160-37 = "[ns] \"Como 'conselheiro', eu ainda não assinei.\""
12160-38 = "..."
12160-41 = "[ns] \"Por isso, a Hoshino ainda faz parte do Comitê de Contramedidas,\""
12160-43 = "[ns] \"ainda é a vice-presidente do conselho estudantil de Abydos,\""
12160-45 = "[ns] \"e ainda é minha aluna.\""
12160-47 = "...Compreendo."
12160-48 = "Enquanto você for o \"Sensei\", sua assinatura é necessária para decidir o destino das alunas sob sua responsabilidade... É isso, então?"
12160-49 = "Entendo, entendo..."
12160-50 = "Alunas de uma escola e seu Sensei... Hmm. Um conceito bastante problemático."
12160-51 = "[s] \"Vocês enganaram aquelas garotas, pisaram nos sentimentos delas e se aproveitaram do sofrimento delas.\""
12160-52 = "Sim, exatamente como você disse. Priorizamos nossos próprios interesses acima da infelicidade alheia."
12160-53 = "Não vou negar isso. Se me perguntar se nossas ações são boas ou más, certamente são más."
12160-54 = "Contudo, tudo esteve dentro das regras."
12160-57 = "Por favor, não me entenda mal quanto a isso."
12160-58 = "A calamidade que se abateu sobre Abydos não foi culpa nossa."
12160-60 = "Aquela tempestade de areia que atingiu Abydos, embora raríssima, é um fenômeno que pode ocorrer com certa probabilidade. Não existe um vilão claro nisso — desastres naturais são assim."
12160-61 = "Nós apenas aproveitamos a oportunidade."
12160-63 = "Oferecer água a quem está morrendo de sede no deserto... porém, por um preço que não conseguiria pagar nem trabalhando como escravo a vida inteira."
12160-64 = "Foi apenas isso."
12160-65 = "Não é nada incomum; é uma história corriqueira neste mundo. Não é algo pelo qual devamos nos angustiar ou assumir toda a responsabilidade."
12160-66 = "Não fomos nós que inventamos isso, e tampouco deixaria de existir só porque não o fizemos."
12160-67 = "Os que têm exploram os que não têm. Os que detêm conhecimento exploram os que não o possuem."
12160-68 = "Não é essa uma verdade implacável do mundo que qualquer adulto conhece?"
12160-71 = "Sendo assim... poderia se retirar dos assuntos de Abydos, Sensei?"
12160-72 = "Se você apenas desistir da Hoshino, nós garantiremos a proteção daquela escola."
12160-73 = "Também resolveremos a questão da Kaiser PMC por nossa conta."
12160-74 = "Aquelas garotas ainda conseguirão continuar frequentando o Colégio Abydos de alguma forma."
12160-75 = "E isso também deve ser o que a própria Hoshino-san deseja. O que me diz?"
12160-76 = "[s] Recusar."
12160-77 = "...Por quê?"
12160-78 = "Você pretende mesmo ser nosso inimigo a qualquer custo?"
12160-79 = "Você é impotente! Não tem sequer meios para lutar!"
12160-82 = "[ns] Sacar o Cartão de Adulto."
12160-83 = "..."
12160-84 = "...Sensei."
12160-85 = "De fato, essa é uma arma exclusiva sua. Porém, eu conheço vagamente o risco que ela carrega."
12160-86 = "Quanto mais você a usa, mais ela consome a sua vida... o seu tempo."
12160-87 = "...Não é verdade?"
12160-88 = "Portanto, guarde esse cartão, Sensei. Você também tem a sua própria vida."
12160-89 = "Comer, pegar o trem, pagar o aluguel... Você precisa cuidar dessas coisas triviais e sem sentido, não precisa?"
12160-90 = "Por favor, faça isso, Sensei. Use-o para coisas mais importantes do que aquelas garotas."
12160-91 = "Não há problema em deixá-las para lá."
12160-92 = "Afinal, desde o início, isso não tinha nada a ver com você."
12160-93 = "[s] Recusar."
12160-94 = "Por quê? Por quê? Por quê? Por quê? Por quê? Por quê? Por quê? Por quê? Por quê? Por quê?"
12160-95 = "Eu não entendo! Por quê? Por que você recusa?"
12160-96 = "Por quê? Sensei, por que motivo você faz isso?"
12160-100 = "[ns] \"Não havia nenhum adulto assumindo a responsabilidade pelo sofrimento delas.\""
12160-101 = "...O que quer dizer com isso?"
12160-102 = "Está dizendo que você vai assumir a responsabilidade? Você não é o guardião delas, nem da família delas."
12160-103 = "Você é apenas um estranho que foi chamado a Abydos por acaso e as conheceu por acaso."
12160-104 = "Por que diabos fazer algo assim? Por que assumir uma responsabilidade que não precisa carregar?"
12160-105 = "[s] \"Porque é isso que um adulto deve fazer.\""
12160-106 = "..."
12160-107 = "...Ah, entendo."
12160-108 = "Quer dizer que ser adulto significa \"assumir responsabilidade\"?"
12160-111 = "Sensei, essa sua ideia está errada."
12160-112 = "Um adulto é aquele que molda a sociedade conforme a sua vontade, que define as leis, dita as regras, decide o que é senso comum e o que é absurdo, o que é ordinário e o que é extraordinário."
12160-113 = "Dominar os sem poder com poder, os sem conhecimento com conhecimento, os sem força com força — isso é ser um adulto."
12160-114 = "Não vou deixar que diga que isso não tem relação com você."
12160-115 = "...Você poderia até ter se tornado o governante desta Kivotos."
12160-116 = "O imenso poder e a autoridade desta Cidade Acadêmica. E o Místico que existe nela. Tudo isso, ainda que temporariamente, esteve na palma da sua mão."
12160-117 = "E, no entanto, você abriu mão de tudo sem hesitar."
12160-118 = "Eu não consigo compreender."
12160-119 = "Que sentido há nessa escolha? A verdade e os mistérios ocultos, autoridade, dinheiro, poder... Por que fazer uma escolha tão sem sentido quanto jogar tudo isso fora?!"
12160-122 = "[ns] \"...Mesmo que eu explique, acho que você não entenderia.\""
12160-125 = "..."
12160-126 = "Pois bem. A negociação fracassou, Sensei."
12160-127 = "Eu até tinha gostado de você... mas não há o que fazer."
12160-128 = "Sensei, você quer salvá-la?"
12160-130 = "Hoshino está no laboratório no centro da base da PMC, no Deserto de Abydos."
12160-131 = "O reverso do Místico observado através da \"Mimesis\" — ou seja, o Terror. Pretendemos iniciar um experimento para ver se é possível aplicá-lo a uma aluna viva."
12160-132 = "Sim, usando a Hoshino como cobaia."
12160-133 = "E, se a Hoshino falhasse, eu pensava em usar aquela divindade lobo em seu lugar... Bom, parece que minha premissa já ruiu desde o início."
12160-134 = "Sendo assim, dê o seu melhor para tentar salvar a sua aluna."
12160-136 = "Ainda que humildemente, desejo-lhe boa sorte."
12160-138 = "..."
12160-139 = "Sensei [USERNAME]."
12160-140 = "...A Gematria estará sempre observando você."
12160-141 = "[ns] Voltar."
12160-144 = "Bem-vindo de volta, Sensei."
12160-145 = "Sensei, estávamos esperando por você!"
12160-146 = "Sensei!"
12160-147 = "Sensei..."
12160-148 = "Você está com cara de quem descobriu alguma coisa."
12160-149 = "Então, mais uma vez—"
12160-152 = "[ns5] \"Vamos salvar a Hoshino.\"\n[ns6] \"Vamos salvar a Hoshino!\"\n[ns7] \"Vamos salvar a Hoshino!!!\""
12160-153 = "...Nn, vamos."
12160-154 = "...Nn, vamos."
12160-155 = "...Nn, vamos."
12160-156 = "[ns] \"Vamos salvar a Hoshino e trazê-la de volta pra cá!\""
12160-157 = "Sim, eu sabia que você diria isso!"
12160-158 = "[ns] \"Vamos salvá-la e depois dar uma bela bronca nela!\""
12160-159 = "Sim, sim! Ela não cumpriu a própria palavra, então merece um castigo! Temos que dar uma boa bronca nela!"
12160-160 = "[ns] \"Vamos dizer 'bem-vinda de volta' e fazer ela responder 'voltei'!\""
12160-161 = "Sim..."
12160-162 = "Quê?!"
12160-163 = "Que coisa vergonhosa! Parece coisa de juventude demais!! Até me deu arrepio na espinha!"
12160-164 = "Eu vou dizer."
12160-165 = "Q-Quê?!"
12160-166 = "Mesmo que a Serika-chan não diga, eu também vou dizer!"
12160-167 = "Q-Quêêê?!"
12160-168 = "E-Eu também. É um pouco vergonhoso, mas..."
12160-169 = "F-Façam o que quiserem! Eu nunca vou dizer uma coisa vergonhosa dessas!!"
12160-171 = "A-Ahaha... Bem, deixando isso de lado, precisamos nos preparar para o resgate..."
12160-172 = "Mas só com a gente agora, não vamos conseguir vencer."
12160-173 = "Precisamos de alguém para nos ajudar..."
12160-174 = "E a Faz-Tudo?"
12160-175 = "Elas realmente nos ajudaram antes, mas... será que podemos pedir ajuda de novo?"
12160-176 = "Claro que dá! Não sei pra onde elas foram parar de novo, mas depois de toda a dor de cabeça que nos deram até agora, o mínimo que podem fazer é atender a esse pedido!"
12160-179 = "[ns] \"...Eu tenho uma ideia.\""
12160-180 = "Hã...?"
12160-181 = "Er, que tipo de ideia seria...?"
12160-183 = "Próximo;O Que Quero Proteger"
