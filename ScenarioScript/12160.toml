[translation]
12160-1 = "Эпизод 16;Битва взрослых"
12160-2 = "Мы знаем, кто вы. Загадочная личность, выбранная президентом Генерального студенческого совета."
12160-3 = "Владелец артефакта, известного как Ковчег Шиттим. Сенсей Шале, Федерального следственного клуба."
12160-4 = "Другие склонны недооценивать вас, но мы не повторим их ошибку."
12160-5 = "Для начала позвольте кое-что прояснить."
12160-6 = "Мы не заинтересованы в конфликте с вами."
12160-7 = "На самом деле мы хотим с вами сотрудничать..."
12160-8 = "...потому что в противном случае вы станете главным препятствием для наших планов."
12160-9 = "Стереть с лица земли такую незначительную школу, как Абидос, — детская игра. Но мы предпочли бы избежать последствий войны с вами."
12160-10 = "[s] «Кто вы такие?»"
12160-11 = "Ох. Неужели мы так и не представились?"
12160-12 = "Мы чужаки в Кивотосе, как и вы... Ах, но это не значит, что мы пришли из одного места."
12160-15 = "Пока что мы нашли подходящее имя, которое можем позаимствовать. Называйте нас Гематрия."
12160-16 = "А меня можете звать «Чёрный Костюм», Сенсей. Я уже успел полюбить это имя."
12160-17 = "Мы, Гематрия, — наблюдатели, исследователи и учёные."
12160-18 = "Необъяснимое существование, во многом похожее на вас."
12160-19 = "Так что позвольте спросить официально. Не хотите ли вы работать с нами? С Гематрия?"
12160-20 = "[s1] «Нет.»\n[s2] «Никогда.»"
12160-21 = "..."
12160-22 = "..."
12160-25 = "Если нет, тогда скажите... Что вы ищете в Кивотосе? Мы можем раскрыть вам всевозможные тайны и истины, стоит лишь принять наше предложение."
12160-26 = "[s3] «Не интересно.»\n[s4] «Я хочу лишь вернуть Хошино.»"
12160-27 = "Ха. Ха-ха."
12160-28 = "Ха. Ха-ха."
12160-29 = "Вы действительно считаете свои действия справедливыми, Сенсей? Какое право вы имеете выдвигать такие требования?"
12160-30 = "Хошино больше не студент Абидоса. Разве вы не видели её заявление об отчислении?"
12160-31 = "[s] «Хошино не бросала школу.»"
12160-32 = "Хм?"
12160-37 = "[ns] «Видите? Я куратор её клуба, а моей подписи на документе нет.»"
12160-38 = "..."
12160-41 = "[ns] «Значит, она всё ещё член Комиссии по взысканию долгов.»"
12160-43 = "[ns] «Она всё ещё вице-президент студсовета Абидоса.»"
12160-45 = "[ns] «И она была и навсегда останется одной из моих студентов.»"
12160-47 = "Вот как..."
12160-48 = "Вы их учитель. Значительные перемены в жизни ваших студентов должны получать ваше одобрение."
12160-49 = "Логика понятна."
12160-50 = "Академии и их студенты... Учителя... Хм. Как хлопотно."
12160-51 = "[s] «Вы обманули детей, растоптали их сердца и воспользовались их страданиями.»"
12160-52 = "Именно. Мы использовали чужое несчастье как ступени ради собственной выгоды."
12160-53 = "Я не стану отрицать. Если хотите назвать это злом — пусть будет так."
12160-54 = "Зло, но законное."
12160-57 = "Не заблуждайтесь, Сенсей."
12160-58 = "Бедствие, обрушившееся на Абидос, не было нашим делом."
12160-60 = "Песчаная буря, поглощающая город, — редкость, но не невозможность. Всего лишь стихийное бедствие."
12160-61 = "Мы лишь воспользовались возможностью."
12160-63 = "Представьте, что вы дали воды человеку, умирающему от жажды в пустыне. Разве не справедливо ожидать, что он отплатит вам собственной жизнью?"
12160-64 = "Здесь ничем не отличается."
12160-65 = "История стара как мир. И это не наше бремя."
12160-66 = "Не мы создали этот мир, и если мы отойдём в сторону, он не изменится."
12160-67 = "Сильные используют слабых. Знающие используют невежественных."
12160-68 = "Любой взрослый знает, что это правда. Разве не так?"
12160-71 = "Так что... оставьте Абидос, Сенсей."
12160-72 = "Отдайте нам Хошино — и школа останется цела."
12160-73 = "Силы ЧВК Кайзер не представляют для нас угрозы."
12160-74 = "Ваши студенты смогут продолжить учиться в Абидосе, насколько позволят их скромные возможности."
12160-75 = "Разве не этого хотела Хошино? Что скажете?"
12160-76 = "[s] Отказаться."
12160-77 = "...Почему?"
12160-78 = "Почему вы так отчаянно пытаетесь нам помешать? Вы бессильны!"
12160-79 = "Как вы собираетесь сражаться с нами?!"
12160-80 = ""
12160-82 = "[ns] Достать кредитную карту."
12160-83 = "..."
12160-84 = "Но, Сенсей..."
12160-85 = "Я никогда не занимался подобными обыденными вещами, но понимаю правила этой системы."
12160-86 = "Чем больше вы ею пользуетесь, тем больше она пожирает вас — вашу жизнь, ваше время."
12160-87 = "...Я ведь прав?"
12160-88 = "Так что уберите карту, Сенсей. Вам ещё жить, разве нет?"
12160-89 = "Вам нужно есть, ездить на метро, платить за жильё и заниматься прочими мелкими, будничными вещами."
12160-90 = "Вот на чём вам стоит сосредоточиться, Сенсей. Потратьте силы на что-нибудь стоящее. Не на этих детей."
12160-91 = "Так что просто оставьте всё как есть."
12160-92 = "Это не ваша битва."
12160-93 = "[s] Отказаться."
12160-94 = "Почему...? Почему? Почему? Почему? Почему?! ПОЧЕМУ?!"
12160-95 = "Я не понимаю. Почему? Не могу понять. Почему вы отказываетесь?"
12160-96 = "Почему, Сенсей? Ради чего?"
12160-100 = "[ns] «Ни один взрослый не взял ответственность за их страдания.»"
12160-101 = "...Вы ведь не серьёзно."
12160-102 = "И вы считаете, что эта ответственность лежит на вас? Вы не их опекун. Не их семья."
12160-103 = "Вы были всего лишь чужаком, которого случайно позвали в Абидос и который случайно встретил их."
12160-104 = "Зачем заходить так далеко? Зачем брать на себя ответственность, которая никогда не была вашей?"
12160-105 = "[s] «Потому что именно это значит быть взрослым.»"
12160-106 = "..."
12160-107 = "Ах... Понятно."
12160-108 = "Вы считаете, что быть взрослым — значит брать на себя ответственность?"
12160-111 = "Нет, Сенсей. Вот здесь вы ошибаетесь."
12160-112 = "Взрослые — те, кто меняют общество, устанавливают правила и законы, определяют норму и проводят границу между обычным и необычным."
12160-113 = "Взрослые правят бесцельными при помощи власти, невежественными — при помощи знаний, а слабыми — при помощи силы. Вот что значит быть взрослым."
12160-114 = "Кто-то вроде вас."
12160-115 = "Вы могли править всем Кивотосом."
12160-116 = "На короткий миг у вас было всё: непостижимая сила и власть над этим городом, его Мистиками..."
12160-117 = "И всё же вы отбросили всё это, не задумавшись ни на секунду."
12160-118 = "Я просто не понимаю."
12160-119 = "Скажите — зачем делать такой выбор? Истина, влияние, богатство, сила... Ваш выбор не оставил вам ничего из этого. Так почему?!"
12160-122 = "[ns] «Даже если я объясню, вы всё равно не поймёте.»"
12160-125 = "..."
12160-126 = "Хорошо. Переговоры окончены."
12160-127 = "Вы мне нравились, но вы не оставили мне выбора."
12160-128 = "Хотите спасти Хошино, Сенсей?"
12160-130 = "Её держат в лаборатории базы ЧВК в центре Пустыни Абидос."
12160-131 = "Mimesis показал нам обратную сторону Mystic: Terror. Теперь мы увидим, можно ли сделать то же самое с живым студентом."
12160-132 = "Хошино — наш подопытный кролик, и мы вправе использовать её как захотим."
12160-133 = "А если она не даст результатов, перейдём к богу-волку. Хотя даже это на данный момент не выглядит осуществимым."
12160-134 = "Попробуйте спасти похищенного студента."
12160-136 = "...Постарайтесь."
12160-138 = "..."
12160-139 = "Сенсей [USERNAME]."
12160-140 = "...Гематрия будет за вами наблюдать."
12160-141 = "[ns] Вернуться."
12160-144 = "С возвращением, Сенсей."
12160-145 = "Эй! Вот ты где, Сенсей."
12160-146 = "Сенсей!"
12160-147 = "Сенсей..."
12160-148 = "Мы ждали твоего решения."
12160-149 = "Что будем делать дальше...?"
12160-150 = ""
12160-151 = ""
12160-152 = "[ns5] «Мы спасём Хошино.»\n[ns6] «Мы спасём Хошино!»\n[ns7] «Мы ОБЯЗАТЕЛЬНО спасём Хошино!!!»"
12160-153 = "Согласна. Мы с тобой, Сенсей."
12160-154 = "Согласна. Мы с тобой, Сенсей."
12160-155 = "Согласна. Мы с тобой, Сенсей."
12160-156 = "[ns] «Мы не остановимся, пока не вернём её домой!»"
12160-157 = "Да! Поняла."
12160-158 = "[ns] «А потом мы хорошенько ей всё выскажем!»"
12160-159 = "Точно! Она нарушила обещание, и её нужно проучить! Очень-очень страшно проучить!"
12160-160 = "[ns] «Когда спасём Хошино, скажем ей: “С возвращением”, а она ответит: “Я дома!”»"
12160-161 = "Ага..."
12160-162 = "Погоди, что?!"
12160-163 = "Это же настолько банально и приторно! Ты специально хочешь, чтобы меня перекосило?!"
12160-164 = "Я скажу."
12160-165 = "Ты скажешь?!"
12160-166 = "Я тоже! Серика, тебе необязательно."
12160-167 = "Вы серьёзно?!"
12160-168 = "Э-эм... Я-я подумаю... Н-но... вообще это и правда кажется правильным..."
12160-169 = "Угх, ладно, делайте что хотите! Я ни за что не стану делать такую позорную вещь!!"
12160-171 = "Ха-ха. Значит, решено. Готовимся к бою..."
12160-172 = "Но как нам самим победить такую армию?"
12160-173 = "Есть кто-нибудь, кого можно позвать на помощь?"
12160-174 = "А Решатели проблем?"
12160-175 = "Они помогли нам раньше, но потом ушли. Не знаю, можем ли мы просить их ещё об одном одолжении."
12160-176 = "Почему нет?! Вспомни, сколько проблем они нам доставили!"
12160-177 = ""
12160-178 = ""
12160-179 = "[ns] «У меня есть идея.»"
12160-180 = "А? Какая, Сенсей?"
12160-181 = "...Хм?"
12160-183 = "Следующий эпизод;То, что нужно защитить"
