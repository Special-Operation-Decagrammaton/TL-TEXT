[translation]
206-1 = "Мир знаков"
206-4 = ""
206-5 = "Я Голконда. Обстоятельства требуют, чтобы я пришёл вас поприветствовать."
206-6 = "Простите мою грубость. Боюсь, как видите, мне ничего не остаётся, кроме как стоять к вам спиной."
206-7 = "Разумеется! Разумеется!"
206-8 = "Ах, а это Декалькомания, тот, кто служит моим телом."
206-9 = "Мы хорошие друзья и знак — знак иллюзии и нереализма."
206-10 = "Конечно!"
206-11 = "Как и все знаки, мы с Декалькоманией не можем существовать сами по себе.#nВнутри всегда есть текст, который необходимо расшифровать."
206-12 = "Но нас это не беспокоит. Все существа — знаки.#nТаков мир, который видим мы с Декалькоманией."
206-13 = "Иными словами, адский пейзаж знаков и символов — лимб экзистенциалиста."
206-15 = ""
206-16 = "Например, Black Suit, который взял собственный знак в качестве имени."
206-17 = ""
206-19 = ""
206-20 = ""
206-21 = "Или Маэстро, проявивший собственный текст во внешнем облике. Прекрасный пример."
206-22 = "У Маэстро две головы из-за стремления расшифровать текст внутри себя."
206-23 = ""
206-24 = "То же самое относится и к этому городу."
206-25 = "Я давно размышляю об этом, глядя на ночной вид."
206-26 = "Конечно!"
206-27 = "Существо, которое вам предстоит встретить, — можно сказать, ещё одна разновидность знака."
206-28 = "Пародия, оммаж... Это основы, но... этим всё не ограничивается."
206-29 = "На самом деле это очень редкий случай, когда современные городские легенды, страшилки или бессмысленные истории, которые дети часто зовут «крипипастами», сами достигли уровня возвышенного."
206-30 = "Иными словами, новое возвышенное, отдельное от Mystic и Terror, — осмысленный текст, рождённый из бесконечно повторяющихся совпадений."
206-31 = "Это знак, который необходимо расшифровать."
206-32 = "Поэтому я исказил название произведения великого художника и дал этому имя:"
206-33 = ""
206-34 = "Библиотека преданий."
206-35 = "Конечно!"
206-36 = "Забавно пародировать первый предмет библиотеки, но, думаю, именно поэтому эта ситуация и является таким прекрасным знаком."
206-37 = "Это история о духах игрушек, которые мстят. В ней также множество оммажей..."
206-38 = "Всё это можно найти в базе данных, хотя игнорировать её не стоит."
206-39 = "Интересная особенность этой библиотеки — её восхитительная непредсказуемость."
206-40 = "РАЗУМЕЕТСЯ!"
206-41 = ""
206-43 = ""
206-44 = ""
206-45 = "Желаю удачи, Сенсей. С нетерпением жду, какой текст вы сможете извлечь из этого знака."
