[translation]
41080-1 = "Episódio 8;Operação Cenoura (2)"
41080-2 = "Porto do D.U."
41080-6 = "Aqui é RABBIT 1, hora atual: 21h00. Chegamos ao Ponto Delta."
41080-7 = "Sem problemas até o momento. Vamos avançar agora para o Ponto Echo, onde está a \"cenoura\"."
41080-8 = "Aqui é o Acampamento RABBIT, sinal de GPS de todo mundo confirmado."
41080-9 = "Dei uma olhada na escala da empresa de segurança também, mas não teve nenhuma grande mudança."
41080-10 = "Bom, até o Ponto Echo não deve ter problema nenhum."
41080-11 = "[s] \"Posso falar um minutinho?\""
41080-12 = "...O que foi, Sensei?"
41080-13 = "Se veio até aqui só para nos dar sermão, gostaria que voltasse para casa."
41080-14 = "Falar bobagens agora vai atrapalhar a operação."
41080-15 = "[s] \"Fiquei preocupado com várias coisas...\""
41080-16 = "...Por acaso achou que íamos roubar alguma coisa?"
41080-17 = "Somos da SRT. Jamais roubaríamos a propriedade dos cidadãos."
41080-18 = "Os tambores daqui estão marcados para descarte. Ou seja, mesmo que a gente leve, não vai causar nenhum prejuízo financeiro a ninguém."
41080-19 = "Pelo contrário, para a empresa, isso até economiza o custo de descarte."
41080-20 = "[s] \"Então não seria melhor simplesmente pedir...?\""
41080-21 = "Isso é..."
41080-22 = "A partir daí é uma questão de orgulho."
41080-23 = "Não podemos depender da pena dos outros!"
41080-24 = "[s] \"Hmm, entendi...\""
41080-25 = "B-Bem, sobre aquelas marmitas da outra vez..."
41080-26 = "Aquilo foi só algo que nós \"asseguramos\"."
41080-27 = "É isso aí!"
41080-28 = "Pelo nosso orgulho, nós jamais...!"
41080-29 = "RABBIT 2, acalme-se. Estamos em operação."
41080-30 = "Está quase na hora. Antes da incursão, faça o reconhecimento, por favor."
41080-31 = "Aliás, Miyako, por que é você quem está no comando como se fosse natural?"
41080-32 = "...RABBIT 2, use os codinomes durante a operação."
41080-33 = "Tsc, nisso você tem razão, mas..."
41080-34 = "Deixa isso pra lá, eu estou perguntando por que é você que está dando as ordens."
41080-35 = "Ora, porque eu sou a líder..."
41080-36 = "Só porque recebeu ordens de cima, não é?"
41080-37 = "Ordens daquele Conselho Estudantil Geral que fechou a Academia Especial SRT."
41080-38 = "..."
41080-39 = "Mas agora, nessa situação, qualquer uma pode assumir o comando."
41080-43 = "...O que vocês acham?"
41080-45 = "Por mim, tanto faz. Tipo, não muda nada quem mandar."
41080-46 = "Eu, hã..."
41080-48 = "...Entendido."
41080-49 = "Então deixo a liderança desta vez com você."
41080-50 = "Assuma o comando, RABBIT 2."
41080-51 = "Hmph. No fim das contas, são só seguranças comuns... Isso é moleza."
41080-52 = "Já fizemos esse tipo de cenário um milhão de vezes no treinamento. Consigo fazer até de olhos fechados."
41080-54 = "Hã, Saki-chan..."
41080-55 = "Quer dizer, RABBIT 2. Onde eu devo ficar aguardando...?"
41080-56 = "Hã? Bem..."
41080-57 = "E-Espera um segundo. Posição de atirador em combate urbano... Tenho certeza de que anotei no caderno..."
41080-64 = "Ugh, bebi demais... Banheiro..."
41080-66 = "...Tem alguém se aproximando!"
41080-67 = "Quê?! Ninguém deveria passar por essa rota normalmente!"
41080-68 = "Putz, por que será...? Hmm, sei lá! Fora do previsto!"
41080-69 = "S-Saki-chan! O que a gente faz...?!"
41080-70 = "P-Posso fugir...?!"
41080-71 = "I-Isso, hã..."
41080-72 = "Um lugar alto! Enfim, vai para um lugar alto!"
41080-73 = "Segundo o manual, o básico do tiro de precisão é \"garantir o campo de visão\". Se subir num lugar alto, na maioria das situações provavelmente...!"
41080-75 = "Espere, Saki. Aquele guindaste de torre até serve para atirar, mas na hora da fuga—"
41080-76 = "E-Eu já sei disso!"
41080-77 = "Hm? Que barulho é esse...?"
41080-85 = "O quê?! Invasores?!"
41080-86 = "Vieram roubar a carga, seus ladrõezinhos?!"
41080-87 = "Quem é ladrãozinho aqui?!"
41080-91 = "Ah, que saco! Iniciar combate! Usem poder de fogo máximo e sigam direto para o Ponto Echo!!"
