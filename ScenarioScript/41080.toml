[translation]
41080-1 = "Эпизод 8;Операция \"Морковь\", часть 2"
41080-2 = "Погрузочный док порта Утнапиштим"
41080-5 = ""
41080-6 = "Говорит RABBIT 1. Время 21:00. Я прибыла на точку Дельта."
41080-7 = "Вокруг чисто, подтверждаю. Выдвигаемся к точке Эхо, чтобы забрать морковь."
41080-8 = "Привеееееет! Лагерь RABBIT снова в деле! GPS-сигналы членов отряда зафиксированы!"
41080-9 = "Охрана погрузочного дока проводит смену, как мы и планировали."
41080-10 = "А теперь тащи свою милую задницу на точку Эхо."
41080-11 = "[s] «Я всё ещё не в восторге от этого…»"
41080-12 = "Я Вашего мнения не спрашивала, Сенсей."
41080-13 = "Если Вы пришли сюда только ради того, чтобы читать нам нотации, то Вы здесь не нужны."
41080-14 = "В любом случае, место проведения спецоперации - не место для Вас, Сенсей."
41080-15 = "[s] «Я просто беспокоюсь, что может что-то случиться.»"
41080-16 = "Вы беспокоитесь, что мы что-то украдём? Вы думаете, что мы настолько мелочны?"
41080-17 = "Студенты Академии SRT преданны своей миссии: обеспечению безопасности жителей. Мы не будем красть вещи у гражданских."
41080-18 = "По нашим данным, эти пустые бочки уже запланировали к списанию. Мы не нанесём компании никаких убытков."
41080-19 = "На самом деле, мы лишь избавляем их от трат на утилизацию и рабочую силу."
41080-20 = "[s] «Почему бы просто не попросить их отдать бочки?»"
41080-21 = "С-Сенсей..."
41080-22 = "Сенсей и впрямь так низко ценит нас! Вы думаете, мы какие-то уличные попрошайки? Мы не станем на колени и не будем просить о каком-то мусоре."
41080-23 = "Вбейте себе в голову! Мы - элита Академии SRT, и мы не примем ни Ваши подачки, ни подачки Валькирии, ни подачки каких-то там тупых промышленных компаний!"
41080-24 = "[s] «Но раньше...»"
41080-25 = "Н-ну, с бенто всё было иначе…"
41080-26 = "И вообще, я не собираюсь оправдываться!"
41080-27 = "Мы добывали выброшенные бенто своими собственными силами! Так что это не была подачка!"
41080-28 = "Вы никогда не сломите нашу гордость!"
41080-29 = "RABBIT 2. Говори тише. Мы на территории противника."
41080-30 = "Выдвигаемся. RABBIT 2, проведи разведку впереди, но если увидишь противника - в бой не вступай."
41080-31 = "Ой, и кто это вообще решил и сделал тебя главной, Мияко?"
41080-32 = "RABBIT 2, прошу, обращайся ко мне по кодовому имени, пока идёт миссия. Это же базовый протокол."
41080-33 = "О, то есть ТЕПЕРЬ ты стала придерживаться протокола?"
41080-34 = "Хватит избегать моего вопроса. Кто дал тебе право командовать мной?"
41080-35 = "Это… Я командир отряда RABBIT..."
41080-36 = "О, как? И кто сделал тебя командиром отряда, а?"
41080-37 = "Уж не те ли мелкие соплячки из Генерального Студенческого Совета? Те самые, что закрыли Академию SRT?"
41080-38 = "..."
41080-39 = "Так, скажи мне. Раз уж мы восстали против Генерального Студенческого Совета, что заставило тебя думать, будто ты всё ещё босс?"
41080-40 = ""
41080-42 = ""
41080-43 = "…Не думаю, что это вопрос, который мы можем решить вот так, вдвоём."
41080-45 = "Оба варианта отстой. Бее."
41080-46 = "Я не хочу выбирать сторону…"
41080-48 = "...Понятно."
41080-49 = "На время этой миссии Саки принимает командование отрядом RABBIT."
41080-50 = "RABBIT 2, каковы приказы?"
41080-51 = "То-то же. Мы имеем дело с простой кучкой охраны, это не обученные противники."
41080-52 = "Я получала лучшие оценки на всех своих тренировках по спасению. Просто смотрите и учитесь."
41080-54 = "Эм, Саки..."
41080-55 = "Я хотела сказать, RABBIT 2. Какую позицию мне занять?"
41080-56 = "О? Нашему снайперу?"
41080-57 = "Ну… Эм… Я делала заметки об эффективном размещении снайпера… Не та страница, это для городских условий…"
41080-58 = ""
41080-60 = ""
41080-63 = ""
41080-64 = "Боже. Босс снова заставил меня много выпить за ужином… Мне нужно в туалет."
41080-66 = "Противник приближается!"
41080-67 = "Здесь же патруль не должен был проходить!"
41080-68 = "Он просто ищет туалет! Этого не было в планах!"
41080-69 = "С-Саки! Он приближается ко мне! Ч-ч-что мне делать?!"
41080-70 = "Я не сильна в близи. Могу убежать…"
41080-71 = "Т-так… Эм…"
41080-72 = "Вверх! Займи высоту! Заберись так высоко, как только можешь!"
41080-73 = "Согласно учебникам, основы снайперского дела заключаются в том, чтобы занять наивысшую точку."
41080-75 = "Постой, Саки, нет! Высота - это хорошо для снайпера, но оттуда она не сможет сбежа…"
41080-76 = "Заткнись, Мияко! У меня всё под контролем."
41080-77 = "Что это было?"
41080-78 = ""
41080-80 = ""
41080-81 = ""
41080-82 = ""
41080-83 = ""
41080-85 = "НАРУШИТЕЛИ!"
41080-86 = "Ах вы воришки! Вы пришли за последней партией груза?"
41080-87 = "Кого это ты назвал воришками?!"
41080-88 = ""
41080-90 = ""
41080-91 = "Всем вступить в бой! Прорываемся к точке Эпсилон и прикрываем тылы. Нас окружили!"
