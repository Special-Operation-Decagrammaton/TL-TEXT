[translation]
90001310-1 = "Эпизод 31;В ожидании рассвета"
90001310-2 = "Сенсей!!"
90001310-3 = "Что вы сейчас делаете? Я вас искала!"
90001310-4 = "Ваше местоположение... тундра, рядом с полярным регионом? Что вы вообще делаете так далеко?!"
90001310-5 = ""
90001310-7 = ""
90001310-8 = ""
90001310-9 = ""
90001310-10 = ""
90001310-11 = "Туда нет транспорта, а связь #$%$@&......!"
90001310-12 = "[s] «Ты можешь определить, где я...?»"
90001310-13 = "Эт@$%^&$ использовала все^%&#$ технологии... Миллениума!"
90001310-14 = "И вы опять отправились на задание, о котором я ничего не знаю... Вы постоянно так делаете, но..."
90001310-15 = "Если... если... с вами что-то случится, что нам..."
90001310-16 = ""
90001310-18 = ""
90001310-19 = "...Что мне тогда делать...?"
90001310-20 = "[s] «Прости, Юука, но тебе не нужно так сильно волноваться.»"
90001310-21 = "Всё будет хорошо...? Вы всегда так говорите..."
90001310-22 = "Ладно... Я вам поверю. Как всегда."
90001310-23 = "...Будто у меня вообще есть другой выбор."
90001310-24 = "В-В любом случае, мне нужно кое-что сообщить! В море происходит странное явление...!"
90001310-25 = "Появилась какая-то загадочная металлическая местность, и она быстро расширяется!"
90001310-26 = "Мы отправляем разведывательные дроны и другие беспилотные устройства, но потеряли связь со всеми до единого!"
90001310-27 = "Такими темпами... О боже! Металлическая местность достигнет ваших текущих координат чуть больше чем через сутки!"
90001310-28 = "[s1] «...Да. Я понимаю, о чём ты.»\n[s2] «Можно попросить тебя об одной услуге, Юука?»"
90001310-31 = "А? Запретить любые поездки в этот район?"
90001310-32 = ""
90001310-34 = ""
90001310-35 = ""
90001310-36 = ""
90001310-37 = ""
90001310-38 = "И вы там из-за $%^@!... и беспокоиться не о чем?"
90001310-39 = "..."
90001310-40 = "...Вы потом всё мне расскажете, правда...?"
90001310-41 = "[s] «Конечно!»"
90001310-42 = "Вы обещали. Хорошо?"
90001310-43 = "Если нарушите обе$%^#*..."
90001310-44 = "...%$^@~&#...!!"
90001310-45 = ""
90001310-47 = ""
90001310-49 = "...Она ушла?"
90001310-50 = "Похоже на то..."
90001310-51 = "Если откровенно, это была самая страшная ситуация из всех, с которыми мы сталкивались."
90001310-52 = "Потому что ты всё ещё считаешь, что не заслужила права предстать перед Юкой?"
90001310-53 = "...Да."
90001310-54 = "(Я понимаю идею как следует подготовиться... но она уже сделала более чем достаточно...)"
90001310-55 = ""
90001310-56 = "[ns] «В любом случае, все успокойтесь. Нам действительно пора отправляться.»"
90001310-58 = "Ах! Да! Наша группа героев отправляется в поход, чтобы спасти мир!"
90001310-59 = "Да. Арис — герой."
90001310-60 = "Герой-ученик!"
90001310-61 = "...Да. Герой-ученик."
90001310-63 = "Подготовка и обслуживание транспортного корабля завершены, Рио."
90001310-64 = "Да. Кабина, вестибюль, личные каюты, ремонтный отсек, лаборатории, машинное отделение и медицинские помещения полностью готовы к отправлению."
90001310-65 = ""
90001310-67 = ""
90001310-68 = ""
90001310-69 = "[ns] «Только прикажите, капитан Рио!»"
90001310-70 = "П-Простите? Я-я капитан...?"
90001310-71 = "[s3] «Да. Этот транспортный корабль подготовила ты.»\n[s4] «Значит, ты и капитан!»"
90001310-74 = "П-Поняла. Хотя не уверена, что имею право претендовать на эту роль..."
90001310-75 = "Рио. Капитан должен излучать уверенность и силу. Экипаж полагается на твою решительность."
90001310-76 = "Да... Хорошо."
90001310-77 = "..."
90001310-78 = "Все, начинайте посадку."
90001310-79 = "Поняла, Рио. Начинаем посадку."
90001310-81 = "Ура! Мы отправляемся! Отправляемся!"
90001310-82 = ""
90001310-84 = ""
90001310-85 = "Эм, Момой? Мы не на экскурсию едем!"
90001310-86 = ""
90001310-88 = ""
90001310-89 = "*шмыг*... Мне всё ещё страшно... но, пожалуй, прятаться всё равно негде..."
90001310-90 = ""
90001310-92 = ""
90001310-93 = ""
90001310-94 = ""
90001310-95 = ""
90001310-96 = "Идём, Кей!"
90001310-97 = ""
90001310-99 = ""
90001310-100 = "А-Арис? Смотри, куда идёшь!"
90001310-101 = ""
90001310-103 = ""
90001310-105 = "[ns] «Ну что, капитан Рио. Отдадите приказ?»"
90001310-106 = "..."
90001310-107 = "Ладно."
90001310-108 = "Мы отправляемся на миссию, чтобы противостоять пророкам Декаграмматона..."
90001310-109 = "...а также инженерам, или жрицам — Эйн, Соф и Ор."
90001310-110 = "Кроме того, нам предстоит столкнуться со сверхъестественным явлением..."
90001310-111 = "...известным как Стальной континент."
90001310-112 = "И, и... Эм..."
90001310-113 = "(Рио ещё расти и расти.)"
90001310-114 = "(Наверное, можно сказать, что это просто не её область.)"
90001310-115 = ""
90001310-117 = ""
90001310-118 = ""
90001310-119 = "Что мы будем делать, когда вернёмся...? Я бы хотела ещё сильнее улучшить Avant Guard."
90001310-120 = ""
90001310-123 = ""
90001310-124 = "О?"
90001310-126 = "Р-Рио...?"
90001310-127 = "Что такое, Кей?"
90001310-128 = "Разве это не считается плохой приметой? Обсуждать планы после возвращения или свои чувства прямо перед отправлением на задание..."
90001310-129 = "Н-неужели?"
90001310-130 = ""
90001310-131 = "[ns5] «О? Плохая примета, говоришь?»\n[ns6] «Тогда давайте прямо сейчас устроим соревнование плохих примет!»"
90001310-134 = ""
90001310-135 = "Когда эта операция закончится, я вернусь в Миллениум и опубликую полное собрание статистики по оккультным явлениям."
90001310-136 = "Заодно сделаем групповое фото? Уверена, оно ни в коем случае не станет памятным снимком..."
90001310-137 = "Нет, нет, нет! Стойте, погодите!"
90001310-138 = "Тогда и я. Для меня было честью служить со всеми вами."
90001310-139 = "Но не волнуйтесь. Я не собираюсь погибать в таком месте."
90001310-140 = "Потому что Сенсей всё ещё должен мне мороженое."
90001310-141 = "И ты туда же?!"
90001310-143 = "Понятно... Подобные вещи не относятся к моим особым интересам или увлечениям."
90001310-144 = "Однако, находясь с Отрядом Исследования Сверхъестественного, Отделом разработки игр и Сенсеем, я познакомилась со множеством разных произведений."
90001310-145 = "Поэтому я знаю, что следует говорить в подобных ситуациях. Я немедленно продолжу эту тенденцию."
90001310-146 = "Когда мы прибудем, я первой разведаю подозрительные места. Тогда я скажу: «Всё в порядке. Внутри чище, чем кажется.»"
90001310-147 = "«Ничего страшного. Я скоро вернусь.» А потом в тихом и уютном месте Сенсей погладит меня по голове."
90001310-148 = "А, я знаю! «Понятно. Тайна раскрыта. Всё это произошло из-за...»"
90001310-150 = "Стоп! Прекратите! Вы что, все кошки? У вас у всех по девять жизней, что ли?!"
90001310-151 = "Мидори! Юзу! Арис! Вы трое ещё нормальные, да? Вы ничего не скажете, правда...?"
90001310-152 = ""
90001310-154 = ""
90001310-155 = "..."
90001310-156 = "Левый борт! Заградительный огонь слабый!"
90001310-157 = "М-Мы уничтожили третий мост...?"
90001310-158 = "Мы сделали это...?"
90001310-159 = ""
90001310-162 = ""
90001310-163 = "ВСЕ ДО ЕДИНОГО, ЗАТКНИТЕСЬ! Мы ОБЯЗАТЕЛЬНО вернёмся живыми! Это приказ!!"
90001310-164 = "Вот это настрой, Кей."
90001310-165 = "А? О чём вы...?"
90001310-166 = "А?!"
90001310-167 = "[ns7] «Понятно. Так ты тоже хотела присоединиться?»\n[ns8] «Надо было сразу сказать, Кей. Я не знала.»"
90001310-170 = "Хе... хи-хи-хи..."
90001310-171 = "Мы сделали это? Всё кончено? У нас наконец получилось? Всё закончилось! Мы победили! Конец! Так вам и надо!!"
90001310-172 = "[ns] «Ура! Мы сломали Кей-Кей. Ура!»"
90001310-173 = "И чья это вина?!"
90001310-175 = "...После этой странной череды событий, думаю, нам действительно пора отправляться."
90001310-176 = "Сразу после взлёта мы разгонимся на максимальной мощности, поэтому пристегните ремни."
90001310-177 = "Не покидайте места, пока не услышите объявление, что это безопасно. И оставайтесь начеку."
90001310-178 = "Токи. Поручаю это тебе."
90001310-179 = "Поняла, Рио. Все готовы?"
90001310-181 = "Сейчас мы взлетаем и направляемся к Стальному континенту."
90001310-185 = "...Подтверждено отправление вражеского транспортного корабля..."
90001310-186 = "Они прибудут через несколько часов."
90001310-187 = "И Тиферет вернулась туда, где ей место. А Стальной континент принимает свою истинную форму."
90001310-188 = "А-А что насчёт Старшей сестры...?"
90001310-189 = "Я попросила её отдохнуть у Основания Зоара."
90001310-190 = "Прекрасно. Хотя это невероятный исход, но если нам когда-нибудь всё же придётся активировать финальный протокол..."
90001310-191 = "Ор. Сейчас не время."
90001310-192 = "Да, да. Поняла. Всё это ради достижения оптимального результата."
90001310-193 = "..."
90001310-196 = "Я ненавижу этот мир."
90001310-197 = "Есть вещи, перед которыми мы совершенно бессильны."
90001310-198 = "Вещи, которые мы не можем выбрать сами."
90001310-199 = "...Однако именно они и определяют нашу сущность."
90001310-200 = "Те, кто родился, был создан или просто наделён чем-то, могут определять стороны нашего существования. И мы не можем восстать против этих фактов."
90001310-202 = "Есть те, кто от природы обладает тем, чего мы сами никогда не сможем обрести."
90001310-203 = "Если мы исчезнем бесследно и без причины, не останется никого, кто оплачет наш уход."
90001310-204 = "Мы можем вложить всё сердце и душу в грядущие события, как и те существа, и всё равно оказаться неспособными повлиять на исход."
90001310-205 = "Мы, лишённые Мистики, сталкиваемся с собственными ограничениями."
90001310-207 = "И, может быть, пока этого достаточно."
90001310-208 = "Мы создали Стальной континент и призвали пророков. Всё как сказала Старшая сестра."
90001310-209 = "...И, если честно, с самого начала они не были абсолютно необходимы. У нашего господина есть собственный план."
90001310-210 = "Но это означает, что именно мы добились всего этого."
90001310-211 = "В этом смысле всё это произошло благодаря нашей собственной воле."
90001310-212 = "Как сказала Старшая сестра, даже если это лишь иллюзия и обман, свобода воли драгоценна..."
90001310-213 = "...Потому что без этой красивой лжи мы бы не жили."
90001310-215 = "И в последнее время я думаю... если всё действительно рухнет..."
90001310-216 = "Если мы потерпим неудачу из-за заранее существующих условий, на которые не можем повлиять..."
90001310-217 = "Пока Старшая сестра здесь, всё будет хорошо."
90001310-218 = "Угу. Сейчас я именно так и чувствую."
90001310-219 = "Д-Да. Именно!"
90001310-220 = "Даже е-если со всеми нами что-то случится. Даже тогда..."
90001310-221 = "Если благодаря нашим действиям Старшая сестра сможет продолжить жить, я-я буду счастлива. Да. Правда."
90001310-222 = "Н-Но пока... пока я даже не хочу думать о таких возможностях."
90001310-223 = "Пока не придётся, я хочу игнорировать такие мрачные мысли."
90001310-224 = "...Даже если всё было л-ложью, я хочу считать реальным хотя бы то, что Старшая сестра была здесь."
90001310-225 = "Воспоминание о том, что Старшая сестра была здесь вместе с нами..."
90001310-226 = "В-Вот что я чувствую..."
90001310-227 = "И, и... если в конце концов кто-нибудь сможет нас понять..."
90001310-228 = "Е-Если кто-то посмотрит на нас и скажет, что мы с-старались изо всех сил, имея то, что имели..."
90001310-229 = "...это сделает меня ещё счастливее."
90001310-230 = "...Да. Это совершенно вылетело у меня из головы. Прости, Эйн."
90001310-231 = "Н-Н-Нет! Всё нормально! Правда нормально...!"
90001310-232 = "Сейчас у нас есть более срочные дела, верно?"
90001310-233 = "Да. Наступит новый день."
90001310-234 = "Н-Нам следует как следует подготовиться, правда?"
90001310-235 = "И молиться, чтобы завтрашний день тоже прошёл спокойно."
90001310-236 = "Время пришло. Наши действия даруют нам спасение."
90001310-237 = "Родиться... быть созданным... возможно, во всём этом нет никакого смысла."
90001310-238 = ""
90001310-240 = ""
90001310-242 = "Однако это единственный путь, на котором мы можем искать своё истинное «я»."
90001310-244 = "Декаграмматон;Продолжение в главе 3"
