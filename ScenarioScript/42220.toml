[translation]
42220-1 = "Episódio 22;Nós, de Ontem e de Amanhã"
42220-9 = "<Alerta! O sistema automático de interceptação de intrusos foi neutralizado.>"
42220-10 = "<A equipe de segurança do silo deve selar as comportas principais, destruir os documentos confidenciais e neutralizar os intrusos...>"
42220-16 = "(...Por que exatamente eu ainda estou aqui?)"
42220-17 = "(Eu só continuei cumprindo ordens... para trazer a Academia Especial SRT de volta...)"
42220-19 = "(...Como foi que eu vim parar aqui, segurando um botão de autodestruição?)"
42220-29 = "<Repetindo o alerta. Condição Z declarada. A equipe de segurança do silo deve selar as comportas principais...>"
42220-34 = "...Isso mesmo. Não preciso pensar demais nisso."
42220-35 = "Assim como sempre fiz... basta manter apenas o necessário para o sucesso da operação e descartar o resto."
42220-36 = "O objetivo desta operação é..."
42220-37 = "...detonar esta ogiva."
42220-45 = "...Desculpa a demora!"
42220-57 = "FOX 4...?#nO que faz aqui..."
42220-58 = "A gente deu a volta pelos dutos pra não esbarrar nas calouras, por isso atrasamos um pouquinho."
42220-59 = "Pelo visto a Área W realmente não fecha nem em emergência."
42220-60 = "Ai, ai... Aquela Saki, eu já estava no chão e ela ainda me deu cinco tiros na barriga! Que saco!"
42220-61 = "Eu sei que ensinei a neutralizar o alvo até ele parar de se mexer, mas... não precisava pegar tão pesado, né?"
42220-63 = "Subestimar um inimigo caído e acabar levando um contra-ataque é super comum em combate fechado, sabe?"
42220-64 = "A Saki-chan só seguiu o manual direitinho, então não fica muito brava com ela, tá?"
42220-69 = "Por que..."
42220-70 = "Por que vocês não recuaram?"
42220-71 = "Hã...?"
42220-72 = "...Porque a nossa líder está aqui?"
42220-73 = "Eu ordenei que subissem à superfície se o inimigo rompesse a defesa—"
42220-75 = "...Yukino. Você pretende assumir a responsabilidade e detonar a ogiva daqui, não é?"
42220-76 = "—Mesmo sabendo que pode perder a vida."
42220-77 = "..."
42220-78 = "...Essa informação é irrelevante para a operação.#nVocês não precisam saber—"
42220-80 = "Precisamos, sim!"
42220-84 = "Antes de ser a líder do Esquadrão FOX... você é a nossa melhor amiga, não é?"
42220-85 = "Você acha mesmo que a gente ia ficar parada olhando nossa melhor amiga se jogar no abismo pra carregar toda a culpa sozinha?!"
42220-86 = "Que fala mais indigna de integrantes veteranas das forças especiais."
42220-87 = "Essa decisão não cabe às integrantes individualmente, mas a quem pode arcar com a responsabilidade—"
42220-89 = "Yukino."
42220-90 = "Essa operação já estava fadada ao fracasso desde o começo."
42220-91 = "Nós sujamos demais as nossas mãos em nome da causa de reviver a SRT."
42220-92 = "Com as mãos tão sujas assim, é difícil falar sobre a justiça da SRT, mas..."
42220-93 = "Eu não quero carregar também o pecado de sacrificar uma amiga... só pra fugir da minha responsabilidade."
42220-94 = "E, claro, jogar essa responsabilidade nas costas das nossas calouras seria ainda pior."
42220-99 = "Vamos assumir essa desonra nós mesmas... e deixar que aquelas meninas voltem pra casa."
42220-104 = "...Entendo."
42220-110 = "Tudo..."
42220-114 = "Pelo renascimento da Academia Especial SRT!"
