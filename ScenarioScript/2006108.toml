[translation]
2006108-1 = "Kasumi Kinugawa"
2006108-3 = "Sensei, over here!"
2006108-4 = "Even though I invited you, I never thought the two of us would actually come to the beach."
2006108-5 = "Anyone looking from the outside would think this is a date!"
2006108-10 = "Want to walk around a bit?"
2006108-13 = "(Walked along the beach with Kasumi)"
2006108-19 = "This is on me. Eat to your heart's content."
2006108-20 = "Food leads to power, and power leads to hot springs! Ha-ha-ha-ha!"
2006108-21 = "Hm? Me?"
2006108-22 = "Hmm... No, I will pass."
2006108-23 = "It seems I have a small appetite. My club members often say so too."
2006108-24 = "Though I should note that my point of comparison is somewhat of a glutton..."
2006108-27 = "A lottery, huh. There is more romance in this than just buying it normally."
2006108-28 = "If Sensei wants to do it, feel free to try as many times as you like.#nIt is not often my wallet strings are this loose!"
2006108-32 = "...Why are you trying to make me do it?"
2006108-33 = "Mh... If I had to say what I like, well..."
2006108-34 = "Places like this tend to shove a canned 'romance' right in your face."
2006108-35 = "It is far too cheap. I will pass."
2006108-39 = "I am pretty sure this place..."
2006108-40 = "Ah, I remember. Were they planning to tear it down and turn it into a parking lot?"
2006108-41 = "The location was good, though. But it fell through because there was no hot spring source nearby."
2006108-47 = "I feel a chill..."
2006108-59 = "...Already night?"
2006108-60 = "Ngh..."
2006108-61 = "Ngh-gh..."
2006108-66 = "I surrender, I surrender!"
2006108-67 = "You really are not going to let up, are you!!"
2006108-68 = "I am impressed by this level of stubbornness. It exceeds my expectations."
2006108-69 = "I believe I have said this before, but I hate owing people favors."
2006108-70 = "If I end up owing one anyway, I want to clear it as soon as possible!"
2006108-71 = "I wish Sensei would be a bit more cooperative."
2006108-72 = "...Just one."
2006108-73 = "I will answer anything right now. Let us call it even with this."
2006108-74 = "[s] \"Really!?\""
2006108-75 = "You look like you have been waiting for me to say that."
2006108-76 = "...Really. I keep my promises."
2006108-77 = "[s1] \"Actually, I have been wondering about something...\"\n[s2] \"Earlier today --\""
2006108-83 = "[ns3] \"You weren't wearing your lab coat, were you!?\"\n[ns4] \"This is the first time I've seen you without it!\""
2006108-88 = "...Huh?"
2006108-89 = "Is that your question? Well, question is one word for it..."
2006108-90 = "..."
2006108-91 = "Are you truly sure?"
2006108-92 = "Unless something extraordinary happens, I always keep my word."
2006108-93 = "And... Sensei. If you want to ask about that matter, today is your only chance."
2006108-94 = "Are you fine with that?"
2006108-95 = "[s] \"...\""
2006108-98 = "[ns] \"I am extremely curious!!\""
2006108-99 = "I figured."
2006108-100 = "[s5] \"But Kasumi's feelings come first.\"\n[s6] \"You don't seem to want to talk about it much.\""
2006108-103 = "I see."
2006108-104 = "[s7] \"Then it's fine.\"\n[s8] \"I won't ask.\""
2006108-109 = "...Mh."
2006108-110 = "Mh-mh-mh-mh..."
2006108-111 = "Sensei, you really are a genius at giving people a hard time."
2006108-112 = "I said I wanted to repay a favor, yet you intend to make me owe you another?"
2006108-113 = "...No, I will take you up on your kindness."
2006108-117 = "As some sort of compensation, though..."
2006108-118 = "Regarding that question from earlier... Just a little bit."
2006108-119 = "I always wear a lab coat."
2006108-120 = "The reason is--"
2006108-124 = "Because it looks cool."
2006108-128 = "I am well aware how ridiculous that sounds. Still... It is what my club members said."
2006108-129 = "That I look like... a brilliant doctor straight out of a movie."
2006108-130 = "...They look at someone like me and say that."
2006108-131 = "So, you could say this is a tiny bit of sincerity on my part in return."
2006108-132 = "I could never become a real doctor. But I can imitate one.#nIf I can do that, I thought I would start with the appearance."
2006108-133 = "...Therefore, I took it off at that time. I was feeling quite unwell."
2006108-134 = "..."
2006108-136 = "Right, we are done!"
2006108-139 = "Enough of this out-of-character talk."
2006108-140 = "I am sure you understand, but this conversation--"
2006108-141 = "[s9] \"I won't tell anyone.\"\n[s10] \"It's a secret between the two of us!\""
2006108-144 = "Hah."
2006108-145 = "...Sensei, you certainly know how to frame things in the style of youth."
2006108-146 = "Well, I mean it literally."
2006108-148 = "It is a compliment, yes."
