[translation]
901010600120-7 = ""
901010600120-8 = "Здравствуйте!"
901010600120-9 = ""
901010600120-11 = ""
901010600120-13 = ""
901010600120-14 = "Эй, разве ты не тот студент, который приносил нам инаризуси?"
901010600120-15 = "Надеюсь, ты снова с какой-нибудь акцией?"
901010600120-16 = "К сожалению, рекламная акция FOX EATS с отзывами уже завершилась..."
901010600120-17 = ""
901010600120-19 = ""
901010600120-20 = "Но после прошлого мероприятия у меня осталось много энергетиков! Хотите один?"
901010600120-21 = "...Не настолько я гордый, чтобы отказаться от бесплатного напитка."
901010600120-22 = ""
901010600120-24 = ""
901010600120-25 = "Сегодня много крабов поймали?"
901010600120-26 = "Ещё как. Столько, что я думал, судно утонет."
901010600120-27 = "Я бы радовался куда больше, если бы эти крабы хоть что-то стоили..."
901010600120-28 = "Понимаю. Очень обидно, что за такой улов нельзя получить нормальную цену."
901010600120-29 = "Кстати, вы ловили этих крабов ловушками с приманкой?"
901010600120-30 = "У крабов, пойманных сетями или пружинными ловушками, часто ломаются ноги или клешни, а эти выглядят отлично!"
901010600120-31 = "Уверена, вы сможете продать их дороже! Столько усилий ушло на то, чтобы поймать краба в таком хорошем состоянии."
901010600120-32 = ""
901010600120-35 = ""
901010600120-36 = "...Ты не такая, как большинство нынешних детей, да?"
901010600120-37 = "Если бы вся молодёжь была такой инициативной, нам не пришлось бы так мучиться с поиском работников."
901010600120-38 = "У вас проблемы с наймом?"
901010600120-39 = "Ничего серьёзного. Просто трудно найти нового рыбака. Наш новичок, Миягучи, внезапно исчез."
901010600120-40 = "Не могу поверить, что Миягучи сбежал, ничего не сказав... Если снова встречу этого засранца, хорошенько пну его под зад."
901010600120-41 = "Неприятная ситуация."
901010600120-42 = "Но что, если у этого... Миягучи была веская причина? Может, с ним что-то случилось?"
901010600120-43 = "Вдруг серьёзно заболел или попал в аварию...?"
901010600120-44 = "Ха. Да не мог этот парень внезапно заболеть."
901010600120-45 = "Уверен, он сбежал, потому что краболовный промысел оказался слишком тяжёлым. Каждый день ныл, что больше не может. А мы всего-то просили его обслуживать оборудование!"
901010600120-46 = "Работа на краболовном судне настолько тяжёлая?"
901010600120-47 = "Лёгкой не назову, но любой крепкий человек с хоть половиной мозга справится."
901010600120-48 = "И я не вру про него. Спроси остальных. Вся команда знала, какой он нытик."
901010600120-49 = "Хмф. Молодёжь нынче..."
