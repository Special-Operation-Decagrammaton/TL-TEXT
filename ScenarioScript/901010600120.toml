[translation]
901010600120-7 = ""
901010600120-8 = "Olha só, se não é a mocinha do FOX EATS!"
901010600120-9 = ""
901010600120-11 = ""
901010600120-13 = ""
901010600120-14 = "Se o preço não tivesse despencado pro chão, a gente tava rindo à toa..."
901010600120-15 = "Veio fazer mais alguma promoção daquelas hoje, garota?"
901010600120-16 = "Não, infelizmente a campanha de avaliações do FOX EATS já se encerrou..."
901010600120-17 = ""
901010600120-19 = ""
901010600120-20 = "Mas em compensação sobrou um estoque imenso de energéticos da promoção. #nAceita uma latinha geladinha?"
901010600120-21 = "...Se é na faixa, não tem como recusar."
901010600120-22 = ""
901010600120-24 = ""
901010600120-25 = "A pescaria de caranguejos foi farta hoje também?"
901010600120-26 = "E como! Foi tanta carga que quase achei que o pesqueiro ia virar na barra."
901010600120-27 = "Se o quilo do caranguejo não tivesse desvalorizado tanto..."
901010600120-28 = "É uma pena mesmo ter tanta fartura e não conseguir vender pelo preço justo."
901010600120-29 = "Aliás, caranguejo se pega com covo de armadilha, né?"
901010600120-30 = "Ouço falar que na hora da puxada é comum quebrar as patas e machucar as pinças... mas esses aqui tão todos perfeitinhos."
901010600120-31 = "Dá pra ver o carinho com que vocês cuidam da carga. Com essa qualidade, tenho certeza de que os preços vão se recuperar logo!"
901010600120-32 = ""
901010600120-35 = ""
901010600120-36 = "...Você tem um coração de ouro, menina."
901010600120-37 = "Se todo mundo fosse compreensivo assim, a gente não passava tanta raiva treinando novato."
901010600120-38 = "Treinando novato? Aconteceu alguma coisa?"
901010600120-39 = "Bobagem minha... É que o rapaz novo que tava trabalhando no barco sumiu do mapa de repente... Aquele imprestável do Miyaguchi, onde será que se meteu?"
901010600120-40 = "Custava pelo menos ter deixado um bilhete avisando que ia largar o barco...?"
901010600120-41 = "Nossa, que complicação..."
901010600120-42 = "Desaparecer assim tão de repente... Será que não aconteceu nada de mau com ele?"
901010600120-43 = "Tipo uma doença repentina, ou quem sabe um acidente..."
901010600120-44 = "Hunf! Aquele lá só não tinha vergonha na cara e brio no peito, isso sim."
901010600120-45 = "Com certeza fugiu porque a lida do caranguejo é dura. Reclamava até pra consertar uma simples rede furada."
901010600120-46 = "A pesca de caranguejo é tão puxada assim?"
901010600120-47 = "Nem é tanto assim. Qualquer um com um pingo de fibra e coragem tira de letra."
901010600120-48 = "Pode perguntar pros outros marinheiros ali no cais. Todo mundo sabe o quanto aquele moleque era frouxo."
901010600120-49 = "Francamente, essa juventude de hoje em dia não aguenta meia hora de tranco..."
