[translation]
13270-1 = "Episódio 27;Um Duelo por um Fio"
13270-3 = "...Você ficou bem forte, Shiroko-chan."
13270-9 = "Haa... haa..."
13270-10 = "É porque o Sensei está comigo."
13270-11 = "...Mesmo assim, você ficou forte de verdade."
13270-12 = "Não achei que esse \"algum dia\" fosse chegar tão cedo, né."
13270-13 = "..."
13270-18 = "Hoshino-senpai..."
13270-19 = "..."
13270-20 = "Senpai..."
13270-25 = "[ns] \"Já não basta, Hoshino?\""
13270-29 = "...Será?"
13270-32 = "A Kaiser está reivindicando a posse do Canhão Ferroviário, mas isso não passa de um pretexto forçado.#nCom certeza existe outro jeito."
13270-33 = "...É verdade, o Sensei também está aqui conosco."
13270-34 = "...Igual àquela vez, não é?"
13270-39 = "[ns] \"Sim, vamos procurar um jeito juntos.\""
13270-40 = "..."
13270-41 = "Hoshino-senpai..."
13270-42 = "E qual é a sua opinião, Nonomi-chan?"
13270-43 = "Eu..."
13270-44 = "Sem perceber... eu acabei me projetando em você, Hoshino-senpai."
13270-45 = "Mas quem partiu não vai voltar,#ne nós não podemos voltar no tempo..."
13270-46 = "Ao mesmo tempo em que eu desejava que você se libertasse, Hoshino-senpai..."
13270-53 = "Talvez eu mesma..."
13270-54 = "Também quisesse me libertar da culpa."
13270-55 = "..."
13270-59 = "Eu não conheci a Presidente Yume,"
13270-60 = "então não sei o que dizer... Desculpa."
13270-61 = "Shiroko-chan..."
13270-62 = "Mas... conta pra gente a sua história, Senpai."
13270-63 = "Isso mesmo."
13270-64 = "Você não precisa carregar toda a responsabilidade sozinha!"
13270-65 = "Serika-chan..."
13270-67 = "Isso não é um problema só seu, Senpai!"
13270-68 = "É um problema do Comitê de Contramedidas... não, de toda Abydos!"
13270-69 = "Se tivesse conversado com a gente, poderíamos ter pensado juntas..."
13270-70 = "Ayane-cha... não, Presidente Ayane."
13270-71 = "Pode continuar me chamando de Ayane-chan..."
13270-72 = "Ayane... chan..."
13270-73 = "Sensei, pessoal..."
13270-75 = "...Fui eu quem matou a Yume-senpai."
13270-76 = "...Senpai."
13270-77 = "Isso não...!"
13270-79 = "...Eu sei.#nFoi um acidente, não foi culpa minha."
13270-80 = "Eu sempre tentei acreditar nisso."
13270-81 = "A Yume-senpai sempre deu tudo de si como presidente do conselho estudantil."
13270-84 = "Ela era gentil, preocupada, e me abraçava não importava o que acontecesse."
13270-85 = "Mas eu não consegui proteger nada do que a Yume-senpai deixou para trás.#nSó ficava reclamando e me irritando o tempo todo."
13270-86 = "Recebi tantas lembranças dela,#ne nem tive a chance de agradecer."
13270-89 = "...Porque a Senpai já morreu."
13270-90 = "Porque eu nunca mais vou poder vê-la..."
13270-93 = "[ns] \"Não é culpa sua, Hoshino.\""
13270-94 = "...Sim, na minha cabeça eu sei disso."
13270-95 = "Mesmo assim, eu..."
13270-96 = "Eu...!"
13270-97 = "[ns] \"Vamos voltar pra casa, Hoshino.\""
13270-98 = "...Sensei."
13270-99 = "[s] \"Você já sofreu o bastante.\""
13270-100 = "Vamos voltar para o Comitê de Contramedidas."
13270-101 = "É isso aí, Senpai."
13270-103 = "Nós estamos com você."
13270-109 = "Nn."
13270-113 = "...Tá bom."
13270-114 = "Obrigada, pess—"
13270-121 = "Ora, ora... quem foi que permitiu uma escolha dessas?"
13270-126 = "Que barulho é esse?!"
13270-127 = "U-Um trovão...?"
13270-131 = "O-Olhem para lá!"
13270-145 = "Ah?!"
13270-146 = "M-Mas como...?!"
13270-147 = "Ah, o meu cartão...?!"
13270-152 = "Hoshino Takanashi!"
13270-153 = "...!"
13270-159 = "Primeiro, vou mandar a escola de vocês pelos ares!"
13270-160 = "Se quiser impedir o Canhão Ferroviário, venha até aqui!"
13270-161 = "?!"
13270-162 = "...!"
13270-163 = "Estarei esperando na \"Estação Grande Oásis\"."
13270-164 = "Se você não vier..."
13270-173 = "Espera, Hoshino-senpai...!"
13270-180 = "Tsc...!"
13270-181 = "H-Hoshino-senpai...!"
13270-182 = "[s] \"Hoshino...!\""
13270-186 = "...Obrigada, pessoal."
13270-187 = "Mas essa dor pertence a mim."
13270-188 = "Eu vou destruir o Canhão Ferroviário."
13270-189 = "A Yume-senpai com certeza teria feito a mesma escolha."
13270-190 = "Na verdade, eu já devia ter resolvido isso há dois anos."
13270-194 = "[ns] \"Espera, Hoshino!\""
13270-195 = "Precisamos ir atrás dela!"
13270-196 = "Hoshino... senpai..."
13270-201 = "Consegui confirmar, Sensei!"
13270-204 = "O Canhão Ferroviário Shemata utiliza uma tecnologia#nque não existe na Kivotos atual!"
13270-205 = "Pelo visto, ele foi estruturado para disparar plasma na mesma temperatura do sol!"
13270-206 = "Porém, parece que não conseguiram reproduzir isso por completo..."
13270-207 = "Se tentarem destruí-lo à força,#na energia pode se dispersar e causar estragos em uma área imensa!"
13270-208 = "Não só a Hoshino-san e a Suou-san,#nmas todos vocês também acabariam sendo atingidos!"
13270-210 = "Hi, hihi!"
13270-211 = "Hihi, hihihihihi...!!"
13270-212 = "Ora, ora, se eu tivesse me atrasado um único segundo, a derrota teria sido minha."
13270-213 = "Isto sim é um duelo por um fio."
13270-214 = "Sensei [USERNAME], você é mais formidável do que qualquer oponente que já enfrentei."
13270-215 = "Contudo, não haverá mais milagres.#nO seu poder foi anulado."
13270-217 = "Que tal partirmos para o clímax?"
13270-218 = "Venha,"
13270-219 = "Ó pecador."
13270-220 = "Ó buscador que persegue o vazio sem forma."
13270-221 = "Ó verdade que governa a razão mesmo sem existir neste mundo."
13270-222 = "Ah, isso mesmo— é a morte."
13270-223 = "Morte."
13270-224 = "Morte."
13270-225 = "Morte."
13270-226 = "Morte. Morte. Morte. Morte. Morte. Morte. Morte. Morte. Morte. Morte. Morte. Morte."
13270-227 = "A verdade da qual jamais se pode escapar."
13270-228 = "Revele-a diante de mim."
13270-229 = "O sexto preceito antigo: \"A verdade da não existência é uma verdade?\".#nConduza-nos à resposta—!"
13270-234 = "Rastreamento concluído."
13270-238 = "O quê...?!"
13270-245 = "Alvo localizado. Iniciando análise."
13270-246 = "Quem é você, insolente?!#nComo ousa invadir o meu domínio...?!"
13270-250 = "...Afiliação: Gematria. Designação individual: \"Morador do Subterrâneo\".#nContinuando busca."
13270-251 = "Este é um domínio onde a existência e a não existência não são definidas.#nEntão, como...?!"
13270-252 = "...Falha na busca.#nTrata-se de uma entidade anômala que não existe neste mundo."
13270-253 = "Hi, hihi, um receptáculo do sagrado, é?#nPorém, parece estar contaminado por alguma coisa."
13270-254 = "De qualquer forma, não permitirei que ninguém atrapalhe os meus planos.#n—Vou fazê-la desaparecer."
13270-258 = "Descobrirem este lugar..."
13270-259 = "...Bem, não importa.#nA partir de agora, é uma corrida contra o tempo."
13270-262 = "...Eu encontrei."
13270-263 = "Plana-chan?!"
13270-264 = "[s] \"Plana!\""
13270-265 = "Descobri a identidade de quem estava nos observando o tempo todo."
13270-266 = "Aquele ser está escondido no \"Domínio do Caos\"."
13270-267 = "Domínio do Caos..."
13270-268 = "Por eu já ter me adaptado ao \"Trono de Naram-Sin\",#num espaço onde existência e não existência são indeterminadas, consegui detectar a presença dele."
13270-269 = "Sua identidade é o \"Morador do Subterrâneo\", membro da Gematria."
13270-270 = "[s] \"Morador do Subterrâneo...!\""
13270-271 = "Você o conhece, Plana-chan?"
13270-272 = "Negativo. Desconheço tanto os objetivos quanto os planos dele."
13270-273 = "...Contudo, consegui compreender parcialmente suas habilidades."
13270-274 = "Ao que tudo indica, ele pode interferir neste mundo a partir do Domínio do Caos."
13270-275 = "Então, quem explodiu a Schale também foi...?"
13270-276 = "Sim. Mas, provavelmente, a nossa existência é uma anomalia para ele."
13270-277 = "[s] \"Porque a Arona e a Plana estavam comigo...\""
13270-278 = "...Sim."
13270-279 = "Sensei, parece que o Morador do Subterrâneo está desafiando você para um duelo."
13270-280 = "[s] \"Um duelo...\""
13270-281 = "Não baixe a guarda."
13270-282 = "O Morador do Subterrâneo..."
13270-284 = "Acredito que esteja tramando algo usando a Hoshino Takanashi-san."
13270-285 = "[s] \"O mesmo objetivo do Terno Preto, então.\""
13270-286 = "...O alcance daquela habilidade não se limita apenas a Abydos."
13270-287 = "Aquilo..."
13270-292 = "...Existe a possibilidade de o problema se espalhar por toda Kivotos."
13270-293 = "Sensei, por favor, impeça a Hoshino-san."
13270-294 = "[s] \"Deixa comigo.\""
13270-297 = "[ns] \"Precisamos impedir a Hoshino...\""
13270-298 = "Mas, a essa altura..."
13270-299 = "A Senpai"
13270-300 = "já pegou o trem e saiu do cânion..."
13270-302 = "Como é que nós..."
13270-303 = "Como vamos conseguir parar ela...?"
13270-304 = "[s] \"Vou entrar em contato com alguém que talvez possa ajudar.\""
13270-306 = "...?"
13270-307 = "Mas esse problema..."
13270-308 = "[s1] \"Não é alguém de fora, pode ficar tranquila.\"\n[s2] \"Se for ela, com certeza consegue parar a Hoshino.\""
13270-315 = "[ns] \"Preciso da sua ajuda.\""
13270-317 = "Entendido."
13270-318 = "[s] \"Obrigado. Sobre a situação...\""
13270-319 = "Tudo bem, eu já sei de tudo."
13270-327 = "A Hoshino-senpai deve estar voltando de trem para a estação de baldeação do \"Setor 35-9\" agora."
13270-328 = "Afinal, fazer baldeação lá#né a única rota para a \"Estação Grande Oásis\"."
13270-329 = "Só que... há uma grande chance de a Kaiser PMC estar de tocaia por lá."
13270-330 = "Lutando sem parar desse jeito, mesmo sendo a Senpai..."
13270-331 = "...Acho que ela vai ficar bem."
13270-332 = "Agora há pouco, a Senpai não usou nem de longe toda a sua força."
13270-333 = "...E mesmo assim, nós não conseguimos pará-la."
13270-334 = "[s3] \"Vamos atrás da Hoshino.\"\n[s4] \"Vamos impedir tanto a Hoshino quanto a Suou.\""
13270-337 = "Sim, Sensei."
13270-338 = "...O sol já está começando a se pôr."
13270-339 = "Talvez já estejamos no limite... mas vamos dar o nosso melhor."
13270-340 = "...Nn."
13270-371 = "Onde será que o pessoal da Kaiser foi parar?"
13270-372 = "...Está quieto demais."
13270-376 = "Ah, é.#nPrimeiro preciso acionar a alavanca na sala de controle para pôr o trem em movimento."
13270-383 = "..."
13270-384 = "...Quem está aí?"
13270-399 = "Estava esperando por você, Hoshino Takanashi."
13270-402 = "Ué?"
13270-403 = "Hum... se não me engano, você é a Chefe do Comitê Disciplinar de Gehenna, né?"
13270-404 = "Se estiver perdida, quer que eu te mostre o caminho de volta?"
13270-405 = "É impossível destruir aquele Canhão Ferroviário sozinha.#nProcure outro jeito."
13270-406 = "Ah, é... Mas o velhote aqui sempre resolveu as coisas desse jeito."
13270-407 = "Poderia sair da frente logo?#nNão estou com tempo pra cuidar de crianças perdidas."
13270-411 = "...Entendi."
13270-415 = "Parece que não tenho escolha a não ser parar você à força."
13270-418 = "É mesmo?"
13270-419 = "Então não tem jeito, né."
13270-438 = "...Meu nome é Hina Sorasaki."
13270-444 = "Próximo;Batalha Feroz (1)"
