[translation]
13270-1 = "Эпизод 27;Тонкая грань"
13270-3 = "...Ты правда стала сильной, Широко."
13270-4 = ""
13270-9 = "*тяжело дышит*... *тяжело дышит*..."
13270-10 = "Без Сенсея всё закончилось бы иначе. Мне ещё далеко до тебя, Хошино."
13270-11 = "...Нет. Ты действительно выросла, Широко..."
13270-12 = "Ты продолжаешь идти вперёд. Наконец превзошла эту старушку..."
13270-13 = "..."
13270-14 = ""
13270-16 = ""
13270-18 = "Хошино..."
13270-19 = "..."
13270-20 = "Хошино..."
13270-21 = ""
13270-25 = "[ns] «Хватит, Хошино.»"
13270-26 = ""
13270-29 = "...Думаешь?"
13270-32 = "Да. Сама претензия Кайзер на Железнодорожную пушку изначально нелепа. Должен быть другой способ бороться."
13270-33 = "Ты права. Сенсей ведь здесь."
13270-34 = "Выход всегда есть... Как тогда, как сейчас и как будет в следующий раз. Правда, Сенсей?"
13270-35 = ""
13270-37 = ""
13270-39 = "[ns] «Да. Нужно просто его найти.»"
13270-40 = "..."
13270-41 = "Хошино..."
13270-42 = "Нономи... Ты в порядке?"
13270-43 = "Да…"
13270-44 = "...Я хотела, чтобы ты преодолела боль от потери председателя Юмэ, Хошино."
13270-45 = "Но что бы я ни делала, я не могла повернуть время назад. Не могла вернуть мёртвых."
13270-46 = "Поэтому я винила себя за всю твою боль... хотя ничего не могла сделать."
13270-47 = ""
13270-53 = "Думаю... всё это время я цеплялась за своё чувство вины."
13270-54 = "И ты, Хошино... ты тоже..."
13270-55 = "..."
13270-56 = ""
13270-58 = ""
13270-59 = "Я... не могу притворяться, что понимаю твою боль... или боль председателя Юмэ."
13270-60 = "Поэтому я никогда не знала, что говорить об этом... Прости, Хошино."
13270-61 = "Широко..."
13270-62 = "Но... я хочу понять. Правда. Если расскажешь, Хошино, я выслушаю."
13270-63 = "Именно! Нужно было нам рассказать! Тебе никогда не надо было всё от нас скрывать и пытаться одной отвечать вообще за всё!"
13270-64 = "Нужно было сказать! Мы же друзья?"
13270-65 = "Серика..."
13270-67 = "Да. Ты должна была поговорить с нами, а не решать за всех."
13270-68 = "Мы имеем право знать о своём районе. Посмотри, что случилось, когда нас оставили в неведении. Нельзя было скрывать это от нас! И действовать одной тоже нельзя было!"
13270-69 = "Ты... Ты должна была протянуть руку и попросить помощи!"
13270-70 = "Аяне... То есть, госпожа председатель."
13270-71 = "Я вообще-то просто Аяне..."
13270-72 = "Аяне..."
13270-73 = "Сенсей... Все..."
13270-75 = "...Это я убила Юмэ."
13270-76 = "Что?!"
13270-77 = "Это...!"
13270-79 = "...Я знаю, знаю. «Это был несчастный случай» и «Ты не виновата»."
13270-80 = "Но... всё это время я верила именно в это."
13270-81 = "Юмэ была лучшей председательницей студсовета, о какой я могла мечтать."
13270-82 = ""
13270-84 = "Она тепло ко мне относилась... говорила ласково... всегда мягко обнимала..."
13270-85 = "Но я не смогла защитить ничего из того, что Юмэ оставила. Я никогда не отвечала ей тем же... только жаловалась, была недовольна и злилась..."
13270-86 = "Я никогда не смогу отплатить Юмэ за всё, что она мне дала. Никогда... вообще никогда..."
13270-89 = "А теперь Юмэ мертва."
13270-90 = "Я больше никогда её не увижу."
13270-93 = "[ns] «Это не твоя вина, Хошино.»"
13270-94 = "...Я знаю, Сенсей. Может... мне просто хотелось кому-то пожаловаться."
13270-95 = "Я даже не могу сказать, на что именно хотела пожаловаться... Я..."
13270-96 = "...Я правда..."
13270-97 = "[ns] «Пойдём домой, Хошино.»"
13270-98 = "...Сенсей."
13270-99 = "[s] «Тебе больше не нужно страдать.»"
13270-100 = "Как сказал Сенсей, Хошино. Пойдём обратно. В Комитет по выплате долга. Домой, в Абидос."
13270-101 = "Да. Она права. Пора возвращаться."
13270-102 = ""
13270-103 = "...Ага. Пойдём."
13270-104 = ""
13270-106 = ""
13270-108 = ""
13270-109 = "Вот, возьми меня за руку."
13270-110 = ""
13270-113 = "...Хорошо. Поняла."
13270-114 = "Пойдём... домой..."
13270-115 = ""
13270-117 = ""
13270-118 = ""
13270-121 = "Нет... Нет. Я не могу вам позволить."
13270-122 = ""
13270-126 = "Ч-Что это за звук?!"
13270-127 = "Похоже на г-гром!"
13270-128 = ""
13270-130 = ""
13270-131 = "С-Смотрите туда!"
13270-132 = ""
13270-145 = "Она движется?"
13270-146 = "К-Как такое возможно?"
13270-147 = "А! Где моя карта?"
13270-148 = ""
13270-152 = "Таканаши Хошино!"
13270-153 = "...!!"
13270-154 = ""
13270-156 = ""
13270-158 = ""
13270-159 = "Я активировала Железнодорожную пушку! Иди и останови меня!"
13270-160 = "Иначе я снесу этой пушкой вашу школу Абидоса!"
13270-161 = "!!"
13270-162 = "...!!"
13270-163 = "Пункт назначения Железнодорожной пушки — станция Великого оазиса. Я буду ждать там!"
13270-164 = "Иди! Иди и *тршш*... останови...."
13270-165 = ""
13270-167 = ""
13270-168 = ""
13270-169 = ""
13270-171 = ""
13270-172 = ""
13270-173 = "Стой, Хошино..."
13270-174 = ""
13270-176 = ""
13270-180 = "А-а-а!"
13270-181 = "Х-Хошино...!"
13270-182 = "[s] «Хошино...!»"
13270-183 = ""
13270-186 = "...Спасибо, Сенсей, все."
13270-187 = "Но эта боль — всё, что у меня осталось от Юмэ. Поэтому у меня нет выбора, кроме как нести её."
13270-188 = "...Я уничтожу Железнодорожную пушку."
13270-189 = "Если бы Юмэ была жива, она бы хотела, чтобы я это сделала."
13270-190 = "...Я должна была закончить это ещё два года назад."
13270-191 = ""
13270-193 = ""
13270-194 = "[ns] «Хошино! Подожди!»"
13270-195 = "Она ушла!"
13270-196 = "Быстрее, нужно за ней..."
13270-197 = ""
13270-201 = "Я подтвердила! Сенсей!"
13270-204 = "В Железнодорожной пушке «Схемата» используются технологии, которых сейчас нет в Кивотосе!"
13270-205 = "По своей конструкции она способна стрелять плазмой температурой примерно как в ядре Солнца!"
13270-206 = "Но... она незавершённая. Похоже, кто-то пытался воспроизвести эту технологию, но в итоге провалился."
13270-207 = "Но это не делает её безопаснее! Наоборот... незавершённость, скорее всего, только ухудшает ситуацию. По сути это гигантская бомба, которая может рвануть в любой момент!"
13270-208 = "Если попытаться её уничтожить... все на борту — включая Суо, тебя и любых студентов рядом — окажутся в опасности!"
13270-210 = "Получилось!"
13270-211 = "Хи-хи-хи-хи-хи...!"
13270-212 = "Это было близко... о-о-очень близко! Я почти проиграл! Ещё одна секунда — нет, даже меньше! Полсекунды позже, и всё бы ускользнуло! Ха! Какая великолепно тонкая грань, балансирующая на краю!"
13270-213 = "Матч и правда был невероятно близким... признаю."
13270-214 = "Сенсей [USERNAME], самый грозный противник, с которым мне доводилось сталкиваться!"
13270-215 = "Но теперь чудес больше не будет! Я нейтрализовал вашу силу."
13270-217 = "Смотрите! Кульминация вашего падения, Сенсей [USERNAME]."
13270-218 = "Всем скованным общей виной."
13270-219 = "Всем вам, грешникам."
13270-220 = "Искателям, что гонятся за ускользающими иллюзиями, ведомые виной и желаниями."
13270-221 = "Есть истина, пронизывающая тело, разум, весь мир, но никто никогда по-настоящему её не испытывал."
13270-222 = "И эта истина... смерть."
13270-223 = "Смерть."
13270-224 = "Смерть."
13270-225 = "Смерть."
13270-226 = "Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть. Смерть."
13270-227 = "Холодная истина, от которой невозможно сбежать и которую невозможно преодолеть!"
13270-228 = "Даруйте мне понимание."
13270-229 = "Даруйте ответ на шестой коан: остаётся ли истиной то, чего никогда не существовало?#nДаруйте мне истинное понимание!"
13270-230 = ""
13270-234 = "Наблюдение завершено."
13270-235 = ""
13270-237 = ""
13270-238 = "Ч-что?!"
13270-239 = ""
13270-241 = ""
13270-244 = ""
13270-245 = "Начинаю анализ цели."
13270-246 = "К-Кто ты? Как ты оказалась в этом пространстве...?!"
13270-247 = ""
13270-249 = ""
13270-250 = "...Анализ частично завершён. Имя сущности: Подземный житель Гематрии. Продолжаю поиск. Анализирую способности."
13270-251 = "Это область хаоса, где существование и несуществование не определены... Как ты можешь существовать здесь...? Ты должна быть...!"
13270-252 = "...Поиск не удался. Чужеродная сущность, которой не должно существовать в этом мире. Продолжаю поиск. Проверяю уникальные способности."
13270-253 = "...Пустой сосуд, содержащий божественность? Но он чем-то осквернён."
13270-254 = "Убирайся! Хватит вмешиваться!"
13270-255 = ""
13270-257 = ""
13270-258 = "Неужели и это место раскрыли...?"
13270-259 = "...Но неважно. Отныне начинается гонка со временем!"
13270-260 = ""
13270-262 = "...Нашла."
13270-263 = "Плана?!"
13270-264 = "[s] «Плана!»"
13270-265 = "Я определила источник странного взгляда, который всё это время чувствовала."
13270-266 = "Он скрывался в перевёрнутом пространстве... своего рода ложном мире."
13270-267 = "Ложном мире..."
13270-268 = "Мне удалось проникнуть в его убежище, поскольку я адаптировалась к Трону Нарам-Сина... пространству, где существование и несуществование не определены."
13270-269 = "Это Подземный житель Гематрии."
13270-270 = "[s] «Подземный житель...!»"
13270-271 = "Ты знаешь, кто он, Плана?"
13270-272 = "Нет. Я никогда его раньше не видела... Пока не могу определить его мотивы или план."
13270-273 = "...Но мне удалось проанализировать его способности."
13270-274 = "Это можно назвать... принудительным вмешательством. Он способен манипулировать этим миром, даже скрываясь в другом измерении."
13270-275 = "Принудительное вмешательство... Тогда... взрыв в Шале...?"
13270-276 = "Именно. Если бы не мы, Сенсей..."
13270-277 = "[s] «Но этого не случилось. Благодаря тебе и Ароне.»"
13270-278 = "...Да."
13270-279 = "Сенсей. Судя по моему анализу, все события, приведшие нас сюда, были частью дуэли, на которую вас вызвал Подземный житель."
13270-280 = "[s] «Дуэли...»"
13270-281 = "Однако внутри его стратегии, похоже, скрыт ещё один мотив."
13270-282 = "Подземный житель... Похоже, он..."
13270-284 = "...пытается чего-то добиться, используя Таканаши Хошино — Великую Тайну Кивотоса."
13270-285 = "[s] «Его цель может быть такой же, как у Чёрного Костюма?»"
13270-286 = "...Подтвердить невозможно. Однако, учитывая его способности и всё произошедшее, последствия выйдут далеко за пределы района Абидоса."
13270-287 = "Это..."
13270-290 = ""
13270-292 = "Если это произойдёт, под угрозой окажется всё."
13270-293 = "Сенсей. Мы должны остановить Хошино..."
13270-294 = "[s] «Понимаю.»"
13270-297 = "[ns] «Хошино нужно остановить.»"
13270-298 = "...Н-Но... мы уже не можем..."
13270-299 = "Мы её потеряли..."
13270-300 = "Она села на поезд и покинула Долину..."
13270-302 = "Даже если погнаться, мы не сможем..."
13270-303 = "...Это вообще возможно? Я имею в виду остановить Хошино..."
13270-304 = "[s] «Я знаю человека, который может помочь.»"
13270-306 = "...Помочь?"
13270-307 = "Но..."
13270-308 = "[s1] «Она не посторонняя во всём этом...»\n[s2] «...И если кто-то способен остановить Хошино, то она.»"
13270-315 = "[ns] «Пожалуйста... останови Хошино.»"
13270-317 = "...Остановлю."
13270-318 = "[s] «Хошино сейчас...»"
13270-319 = "Я понимаю ситуацию."
13270-320 = ""
13270-326 = ""
13270-327 = "Хошино сейчас должна быть в поезде и возвращаться к узловой станции сектора 35-9."
13270-328 = "Наверняка она планирует пересесть там и отправиться на станцию Великого оазиса... Другого маршрута у неё нет."
13270-329 = "Но... к этому моменту там, скорее всего, уже кишит бойцами ЧВК Кайзер."
13270-330 = "Р-Разве это не слишком опасно? Она идёт прямо в опорный пункт противника."
13270-331 = "...Она справится."
13270-332 = "Раньше я думала, что победила, но полностью ошибалась. Она всё ещё сдерживалась."
13270-333 = "...Она просто слишком сильная."
13270-334 = "[s3] «...Пойдём за Хошино.»\n[s4] «Нужно остановить её и Суо.»"
13270-337 = "...Хорошо. Поняла."
13270-338 = "Солнце уже начинает садиться..."
13270-339 = "Все совершенно вымотаны... но придётся как-нибудь справиться."
13270-340 = "...Ага."
13270-341 = ""
13270-355 = ""
13270-356 = ""
13270-362 = ""
13270-363 = ""
13270-365 = ""
13270-366 = ""
13270-367 = ""
13270-368 = ""
13270-371 = "ЧВК Кайзер... здесь нет?"
13270-372 = "...Странно."
13270-373 = ""
13270-375 = ""
13270-376 = "Чтобы направить поезд к станции Великого оазиса... мне нужно использовать рычаг вон в той диспетчерской."
13270-377 = ""
13270-379 = ""
13270-382 = ""
13270-383 = "..."
13270-384 = "Внутри кто-то есть..."
13270-385 = ""
13270-387 = ""
13270-388 = ""
13270-395 = ""
13270-396 = ""
13270-399 = "Я ждала тебя, Таканаши Хошино."
13270-402 = "А...? Ты..."
13270-403 = "Эм... Ты же глава Дисциплинарного комитета Геенны, да?"
13270-404 = "Что ты здесь делаешь? Не собираешься мешать этой старушке, надеюсь?"
13270-405 = "Ты не справишься с Железнодорожной пушкой одна. Найди другой способ."
13270-406 = "Хм, думаешь? Вообще-то до сих пор я прекрасно решала свои проблемы сама."
13270-407 = "Так что отойдёшь? У меня довольно плотный график."
13270-408 = ""
13270-411 = "...Понятно."
13270-414 = ""
13270-415 = "Если ты настаиваешь, боюсь, придётся остановить тебя силой."
13270-418 = "О? Значит, вот как?"
13270-419 = "Уверена, ты знаешь, что я никогда не проигрывала бой один на один, госпожа глава Дисциплинарного комитета."
13270-420 = ""
13270-438 = "Сорасаки Хина."
13270-439 = ""
13270-444 = "Следующий эпизод;Грозное столкновение 1"
