[translation]
2300406-1 = "Не смотри на меня"
2300406-2 = "Возле велопарковки здания Шале"
2300406-3 = ""
2300406-4 = "А-а-а... Плохо дело. Двигатель полностью умер."
2300406-5 = "Я ненадолго оставила его на автономном тесте, и он окончательно сломался..."
2300406-6 = "...Сенсей, ты случайно не сломал его специально, потому что чинить больше было нечего?"
2300406-7 = "[s1] «Это нелепо.»\n[s2] «Всё это недоразумение! Говорю же, недоразумение!»"
2300406-8 = "Ахаха, шучу. Thundergun не так-то просто сломать специально."
2300406-9 = "Ахаха, шучу. Thundergun не так-то просто сломать специально."
2300406-10 = "Поскольку тащить Thundergun до Миллениума будет непросто, базовый ремонт лучше закончить где-нибудь рядом..."
2300406-11 = "Сенсей, можешь одолжить мне немного места в Шале? Инструменты у меня есть, нужно только место для работы."
2300406-12 = "[s] «Можно посмотреть, как ты будешь чинить?»"
2300406-13 = "...Трудно отказать, когда ты согласился мне помочь."
2300406-14 = "Хорошо, делай как хочешь. Только не мешай."
2300406-15 = "[s] «Без проблем.»"
2300406-19 = "Мы с Утахой перенесли повреждённый Thundergun на склад."
2300406-22 = "― [log=우타하]Посмотрим... Судя по люфту оси, проблема может быть в подшипниках.[/log][wa:1260]"
2300406-24 = "― [log=우타하]Подшипники, наверное, дефектные или изношены...[/log][wa:10]"
2300406-27 = "― [log=우타하]В худшем случае придётся полностью заменить некоторые детали.[/log][wa:820]"
2300406-30 = "― [log=우타하]Ты правда собираешься остаться и смотреть, Сенсей?[/log][wa:2360]"
2300406-32 = "― [log=우타하]Я не против, но...[/log][wa:1600]"
2300406-35 = "― [log=우타하]Инженерная работа опасна,[/log][wa:160]"
2300406-37 = "― [log=우타하]так что наблюдай с безопасного расстояния.[/log][wa:10]"
2300406-40 = "― [log=우타하]Не хотелось бы, чтобы ты порезался об оборудование.[/log][wa:10]"
2300406-42 = "― [log=우타하]И запах масла надолго останется на одежде. Н-Но главное...[/log][wa:10]"
2300406-45 = "― [log=우타하]Моё лицо ужасно выглядит из-за пота и копоти...[/log][wa:1420]"
2300406-48 = "― [log=우타하]Хотя это вообще не относится к делу! В-В общем... ось...[/log][wa:2160]"
2300406-51 = "― [log=우타하]Похоже, я была права.[/log][wa:340]"
2300406-53 = "― [log=우타하]Подшипники плохо смазаны, поэтому износ очень сильный.[/log][wa:10]"
2300406-56 = "― [log=우타하]Передай ключ, Сенсей.[/log][wa:740]"
2300406-59 = "― [log=우타하]А! Прости. Я не это имела в виду![/log][wa:1300]"
2300406-61 = "― [log=우타하]Просто привычка...[/log][wa:540]"
2300406-64 = "― [log=우타하]...Хотя я и говорила обратное, работать действительно эффективнее, когда рядом есть помощник.[/log][wa:820]"
2300406-66 = "― [log=우타하]И я бы солгала, если бы сказала, что это ещё и не поднимает настроение.[/log][wa:10]"
2300406-69 = "― [log=우타하]Ты можешь сильно испачкать лицо...[/log][wa:10]"
2300406-71 = "― [log=우타하]Но не поможешь мне?[/log][wa:10]"
2300406-74 = "Перед зданием Шале"
2300406-75 = "Фух... Благодаря тебе я закончила даже раньше, чем ожидала."
2300406-76 = "Без тебя, наверное, провозилась бы до ночи. Так что спасибо."
2300406-77 = "...Хочешь снова прийти в Инженерный отдел и посмотреть, как я чиню вещи?"
2300406-78 = "Хм, дай подумать..."
2300406-79 = "Наверное, я не могу всегда выглядеть перед тобой безупречно. Хорошо, приходи."
2300406-80 = "Только не забудь потом умыться."
2300406-81 = "У тебя всё лицо в копоти от машин. Выглядит довольно смешно."
2300406-82 = "Хи-хи. До встречи, Сенсей."
