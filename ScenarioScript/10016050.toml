[translation]
10016050-1 = "Эпизод 5;На патруле"
10016050-4 = ""
10016050-5 = "Цукуё! Цукуё! Смотри туда!"
10016050-6 = "Это специальная памятная футболка «Миллениума», которая с помощью голограмм делает тебя невидимой!"
10016050-7 = "Хи-хи. По сути, это инструмент ниндзюцу, только ниндзюцу он делает за нас! Для операций проникновения идеально."
10016050-8 = "Давай примерим! Это будет так круто!"
10016050-9 = "Но есть ли... размер, который подойдёт мне...?"
10016050-10 = "Не думаю, что ниндзюцу сработает, если я её порву..."
10016050-11 = "Не волнуйся! У них очень широкий размерный ряд!"
10016050-12 = "Нельзя упускать такой шанс исследовать ниндзюцу других школ!"
10016050-13 = ""
10016050-15 = ""
10016050-18 = ""
10016050-19 = "Ух ты! Смотри, сколько крутых машин готовят еду! Совсем сами?! В «Миллениуме» всегда так?"
10016050-20 = "Чисэ, Чисэ! Вон там! Автоматическая машина такояки делает такояки... автоматически! Я обязана попробовать!"
10016050-21 = "Мм... Я только что придумала хорошее хайку."
10016050-22 = "Алло? Земля вызывает Чисэ?"
10016050-23 = "Ага... придумала."
10016050-25 = "#n #nКатится, катится."
10016050-27 = "#n #n #n #nНеповторимый звук."
10016050-29 = "#n #n #n #n #n #nКатись, шарик рамунэ."
10016050-32 = "Я сказала такояки, а не рамунэ!"
10016050-33 = "Давай, Чисэ! Нужно успеть, пока всё не разобрали!"
10016050-34 = ""
10016050-36 = ""
10016050-37 = ""
10016050-38 = "Ух ты! У «Миллениума» даже есть группа поддержки?"
10016050-39 = "Смотрите на эти голографические дроны! И форму вы сделали специально... Вы и правда вложили в это всю душу!"
10016050-40 = "...Это не то чтобы официальная группа поддержки..."
10016050-41 = ""
10016050-43 = "Хи-хи! Просто считай нас мейстерами «Миллениума», переквалифицировавшимися в экспертов по поддержке!"
10016050-44 = "Судя по форме, ты студент «Тринити»."
10016050-45 = "Ага! Я добровольно пришла помогать Лечебным рыцарям лечить раненых спортсменок на фестивале!"
10016050-46 = "Заботясь о пациенте, нужно учитывать и физическое, и душевное здоровье!"
10016050-47 = "Так что пока старшие занимаются сложной медициной и перевязками, я буду лечить их сердца силой своей поддержки!"
10016050-48 = "У тебя сильный и искренний голос. Мне нравится."
10016050-49 = "Именно такого духа я и ожидала от соперницы группы поддержки «Миллениума»!"
10016050-50 = ""
10016050-52 = ""
10016050-53 = "Нашей соперницы? Ты про соревнование групп поддержки?"
10016050-54 = "Соревнование групп поддержки оценивает дух и энергию команд! Благодаря ему в празднике могут участвовать даже неспортсменки. Можно сказать, это дополнительное состязание прямо на трибунах!"
10016050-55 = "Жаль, мне нужно участвовать в полосе препятствий... Я не смогу участвовать в соревновании поддержки!"
10016050-57 = "Я сделаю. Я пойду на полосу препятствий."
10016050-58 = "Если честно, ни то ни другое не моя сильная сторона, но лучше так, чем болеть."
10016050-59 = "Хибики! Это не настрой мейстера!"
10016050-60 = "Фестиваль Хало — время испытать пределы и возможности своего тела..."
10016050-61 = "Если и есть день, когда стоит пробовать то, в чём ты не сильна, то это сегодня! Так учишься понимать ценность разных взглядов и образов жизни!"
10016050-62 = "К-капитан! Это было так вдохновляюще!"
10016050-63 = "Я вся горю! Как ваша соперница, выложусь по полной на соревновании поддержки!"
10016050-64 = "Вот это настрой! Для меня будет честью встретиться с тобой на поле боя."
10016050-65 = ""
10016050-67 = ""
10016050-68 = "...Пожалуйста, пусть это скорее закончится."
10016050-69 = ""
10016050-71 = ""
10016050-72 = "[ns] «Похоже, всем очень нравится фестиваль.»"
10016050-74 = "Эм... Н-Нацу... Это парфе..."
10016050-75 = ""
10016050-77 = "Хм? Тебя заинтересовало это парфе?"
10016050-78 = "Раз ты понимаешь ценность этого восхитительного парфе, у тебя очень тонкие чувства... Иного от Боевой группы Правосудия я и не ожидала!"
10016050-79 = "Я купила его в палатке L'Oiseau Bleu, там, где собрались все продавцы."
10016050-80 = "Парфе L'Oiseau Bleu невероятно трудно достать, не говоря уже о версии из временной палатки. Возможность выпадает раз в жизни."
10016050-81 = "П-понятно... Но я не об этом..."
10016050-82 = "В отличие от парфе в основном заведении, где сливки взбивают и свежие фрукты режут под каждый заказ, для временных палаток приходится привозить замороженные ингредиенты."
10016050-83 = "Чтобы компенсировать более низкое качество ингредиентов, они кладут три шарика мороженого вместо двух. Поэтому, хоть по качеству оно уступает, внешне парфе из палатки превосходит оригинал."
10016050-84 = "Это несбалансированное парфе — идеальный символ всего Фестиваля Хало в Кивотосе..."
10016050-85 = "Подожди, подожди! Дело не в парфе!"
10016050-86 = "Я всё это время пытаюсь сказать, что нельзя есть на ходу по дороге!"
10016050-87 = "В смысле? Почему нельзя?"
10016050-88 = "Н-ну... Это против школьных правил. И неприлично..."
10016050-89 = "Ты права. Есть на ходу строго запрещено правилами «Тринити»..."
10016050-91 = "Но мы ведь на Фестивале Хало, верно? Разве власть «Тринити» распространяется сюда?"
10016050-92 = "Я-я не знаю...?"
10016050-93 = "Прилично... Неприлично... Что это вообще значит? Человек с хорошими манерами ест приборами, но традиционное карри, наоборот, считается неприличным есть ложкой, а не руками."
10016050-94 = "Это парфе находится в одноразовой ёмкости, специально созданной так, чтобы его было удобно есть во время других занятий... например ходьбы. Разве не неприлично использовать его не так, как задумано?"
10016050-96 = "Следовательно, есть на ходу — как раз правильное поведение на Фестивале Хало в Кивотосе!"
10016050-98 = "К-кажется, ты права...!"
10016050-99 = "Нет. Нацу, ты просто запутываешь её своей извращённой логикой."
10016050-100 = "Фестиваль Хало — не территория без правил. Даже Исполнительный комитет здесь им подчиняется."
10016050-101 = "Ах. Кажется, меня поймали."
10016050-102 = "И вообще, ты искушаешь меня всем этим сахаром... вкусным, освежающим мороженым..."
10016050-103 = "Кхм! То есть, если таскать такое большое парфе, можно пролить его на других студентов!"
10016050-104 = "Пожалуйста, доешь парфе в одной из специально отведённых зон отдыха."
10016050-105 = "Не могу. Если я задержусь там надолго, меня найдут остальные участницы Клуба сладкоежек после школы."
10016050-106 = "Если они увидят, что я ем это восхитительное парфе, то будут бесконечно выпрашивать, чтобы я купила им такое же."
10016050-107 = "Я не готова так рисковать. Тебе придётся его съесть."
10016050-108 = "А? Я?"
10016050-109 = "Да. Жаль, что я не смогу насладиться этим особенным единственным в своём роде парфе, но моя любовь к десертам не настолько одномерна. Пока хоть кто-то сможет оценить его, мне кажется, это самое романтичное на свете."
10016050-110 = "Ну, я пошла искать остальных. Не забывай: главное — романтика."
10016050-111 = ""
10016050-113 = ""
10016050-114 = "Это парфе такое огромное... Что мне делать?"
10016050-115 = "Уф... Я в этот раз так хорошо держалась на диете. Одно это парфе превышает мой лимит калорий за три дня вместе взятые."
10016050-116 = "..."
10016050-117 = "Но... выбрасывать его тоже неправильно..."
10016050-118 = "[s] «Может, одно всё-таки можно?»"
10016050-119 = "С-Сенсей?! Когда вы пришли?"
10016050-120 = "[s] «Уже давно.»"
10016050-121 = "Давно...? Ах..."
10016050-122 = "Н-ну... Я собиралась отдать это парфе коллеге!"
10016050-123 = "Для Нацу это парфе явно много значило. Вам и следует его съесть..."
10016050-124 = "Я только что плотно пообедала. Больше калорий мне нельзя."
10016050-125 = "Вы так много работали на этой жаре. Почему бы не сделать перерыв и не насладиться освежающим парфе?"
10016050-126 = "С-спасибо... Я с удовольствием его съем!"
10016050-127 = ""
10016050-129 = ""
10016050-130 = "*вздыхает*"
10016050-131 = "[s1] «Ты выглядишь довольно уставшей.»\n[s2] «Почему бы тебе самой не отдохнуть, Хасуми?»"
10016050-132 = "Нет, я в порядке. Я уже поела и не участвую в соревнованиях, так что сил у меня полно."
10016050-133 = "Нет, я в порядке. Я уже поела и не участвую в соревнованиях, так что сил у меня полно."
10016050-134 = "И я не могу так расслабляться во время патрулирования. Мы должны оставаться начеку на случай любых угроз."
10016050-135 = "Хотелось бы, чтобы члены Исполнительного комитета из Миллениума и Геенны относились к этому так же..."
10016050-136 = "Похоже, они забыли о своих обязанностях, потому что слишком увлеклись фестивалем."
10016050-137 = "[s3] «Ну, этот фестиваль ведь для всех...»\n[s4] «Можно же хоть ненадолго расслабиться, правда?»"
10016050-138 = "Нет. У каждого есть своя роль. Наслаждаться фестивалем в мои обязанности попросту не входит."
10016050-139 = "Нет. У каждого есть своя роль. Наслаждаться фестивалем в мои обязанности попросту не входит."
10016050-140 = "Как я уже говорила, это ничем не отличается от моих обычных учебных обязанностей."
10016050-141 = "Я должна поддерживать честь Тринити и выполнять обязанности вице-президента Боевой группы Правосудия. Как всегда."
10016050-142 = ""
10016050-144 = ""
10016050-147 = ""
10016050-148 = "О, это же Сенсей [USERNAME]!"
10016050-149 = "Здравствуйте, Сенсей! Не ожидала встретить вас здесь!"
10016050-150 = "[s5] «Привет, Кирино и Фубуки.»\n[s6] «Вы патрулируете?»"
10016050-151 = "Здравствуйте! Мы отвечаем за безопасность на спортивном фестивале, чтобы все студенты могли спокойно наслаждаться праздником."
10016050-152 = "Здравствуйте! Мы отвечаем за безопасность на спортивном фестивале, чтобы все студенты могли спокойно наслаждаться праздником."
10016050-153 = "Но Атлетический стадион такой огромный, что даже один полный обход занимает кучу времени."
10016050-154 = "Я радовалась, что нам не надо участвовать в соревнованиях, но ходить по такой жаре — та ещё работа. Тут даже тени нет!"
10016050-155 = "Знала бы я, что будет так, притворилась бы больной и валялась в общежитии."
10016050-156 = "Фубуки! Нельзя врать, чтобы не работать! У тебя могут быть неприятности."
10016050-157 = "Если закончишь этот патруль, я куплю тебе особый пончик Миллениума. Говорят, их делают роботы! Хорошо? Так что давай, ты справишься!"
10016050-158 = "О? Интересно, пончик, приготовленный роботом, отличается на вкус от обычного..."
10016050-159 = "А! Вы ведь вице-президент Боевой группы Правосудия, да?"
10016050-160 = "[s] «Вы знакомы?»"
10016050-161 = "Мы недавно встретились! Мы пытались схватить плохих студентов, которые хотели сорвать соревнования."
10016050-162 = "А потом Хасуми вмешалась и помогла нам их арестовать! Мы ей очень благодарны!"
10016050-163 = "Не стоит благодарности. Студенты Полицейской школы Валькирия очень помогли на протяжении всего мероприятия."
10016050-164 = "Ваши доклады Исполнительному комитету о подозрительном поведении были крайне важны для поддержания порядка на этом спортивном фестивале."
10016050-165 = "Вы в полной мере подтвердили репутацию Бюро общественной безопасности как быстрого и эффективного подразделения."
10016050-166 = "Хахаха! Вы слишком добры. Спасибо! Я рада, что смогла помочь."
10016050-167 = "Во время патруля возникали какие-нибудь проблемы?"
10016050-168 = "Пока нет! Никаких подозрительных лиц или предметов."
10016050-169 = "А, мы встретили нескольких студентов, которые несли оборудование для следующего соревнования. Мне показалось это немного странным, ведь они не были сотрудницами."
10016050-170 = "Мы спросили их, но они сказали, что помощь не нужна. Это было странно, потому что коробка выглядела тяжёлой! Они несли ядра для толкания и железные рамы."
10016050-171 = "Не представляю, как можно быть настолько трудолюбивыми. Они приходили раньше всех и забирали вещи сразу после окончания соревнований."
10016050-172 = "...По-моему, это звучит довольно подозрительно."
10016050-173 = "Согласно документу, который я получила от Юки, всё оборудование должны были перевозить роботы, так что студентам не было нужды добровольно заниматься этим..."
10016050-174 = "П-правда? Тогда куда и зачем они тащили оборудование?"
10016050-175 = "Учитывая обстоятельства, нам следует проверить этих студентов."
10016050-176 = "Кирино, можешь отвести нас туда, где ты видела их в последний раз?"
10016050-177 = "Конечно! Я видела их у главного здания! Я сразу вас туда отведу!"
10016050-178 = "Ух... Похоже, это может обернуться чем-то хлопотным..."
10016050-179 = ""
