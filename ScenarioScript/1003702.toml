[translation]
1003702-1 = "Допрос председателя Комитета безопасности"
1003702-2 = "За пределами Академии Красной Зимы"
1003702-3 = "Шпион — это агент враждебной организации, которому поручено тайно добывать сведения и проникать на чужую территорию."
1003702-4 = "Многие небольшие академии Кивотоса завидуют Федеральной академии Красной Зимы, поэтому мы обязаны всегда быть настороже и следить за шпионами."
1003702-5 = "Шпионы — мастера скрывать свою личность, поэтому подозревать можно кого угодно."
1003702-6 = "Даже прямо сейчас среди наших рядов могут скрываться шпионы, замышляющие свержение Академии Красной Зимы!"
1003702-7 = "[s] «Это было бы ужасно.»"
1003702-8 = "Именно. Это ещё и государственная измена."
1003702-9 = "Совет безопасности составляет досье на подозрительных лиц, чтобы сорвать их планы."
1003702-10 = "Мы выявили одного чрезвычайно подозрительного человека. Более того, возможно, сейчас это самая большая угроза для Красной Зимы."
1003702-11 = "Вы, Сенсей!"
1003702-12 = "[s] «Так ты всё это время говорила обо мне?!»"
1003702-13 = "Никто не подходит для такой операции лучше вас."
1003702-14 = "Вы не только заслужили доверие президента Черино, но и можете совершенно свободно перемещаться между академиями."
1003702-15 = "У вас есть доступ, полномочия и достаточно ума, чтобы добраться до наших самых тёмных секретов и саботировать саму нашу организацию."
1003702-16 = "На месте Тринити или Геенны именно вас я бы попыталась подкупить ради сведений о великой Красной Зиме."
1003702-17 = "Следовательно, вы наш подозреваемый номер один!"
1003702-18 = "[s] «Но я не шпион...»"
1003702-19 = "Именно так и сказал бы шпион!"
1003702-20 = "Однако я великодушна, как и наш великий президент Черино.#nВы можете избежать ссылки, ЕСЛИ докажете свою невиновность."
1003702-21 = "Если вы действительно верный последователь президента, мой тест не составит для вас труда."
1003702-22 = "[s] «Тест?»"
1003702-23 = "Да. Специальный тест на знание идеологии Красной Зимы и общих сведений об академии."
1003702-24 = "Любой студент Академии Красной Зимы ответит на эти вопросы даже во сне."
1003702-25 = "Но ошибитесь хотя бы в одном вопросе..."
1003702-26 = "...и можете готовиться провести остаток своих дней в Бывшем институте, спецназовец!"
1003702-27 = "[s1] «Ты не можешь сослать своего Сенсея!»\n[s2] «А я ненавижу внезапные контрольные!»"
1003702-28 = "Жаловаться стал бы только шпион! Приготовьтесь!"
1003702-29 = "Жаловаться стал бы только шпион! Приготовьтесь!"
1003702-30 = ""
1003702-32 = ""
1003702-33 = "Первый вопрос. Какое животное символизирует Федеральную академию Красной Зимы?"
1003702-34 = "[s3] «Медведь.»\n[s4] «Дракон.»"
1003702-35 = "Верно!"
1003702-36 = "Хмф. На это мог ответить кто угодно."
1003702-37 = "Символ прямо на эмблеме! Как вообще можно было ошибиться?!"
1003702-38 = "Но дракон... одно из моих любимых животных, так что на этот раз я закрою глаза."
1003702-39 = ""
1003702-41 = ""
1003702-42 = "Дальше. Что является символом власти в Академии Красной Зимы?#nЭто ещё и физическая особенность, которой президент очень гордится."
1003702-43 = "[s5] «Усы.»\n[s6] «Борода.»"
1003702-44 = "Верно! Именно усы наделяют нашего президента Черино великой властью."
1003702-45 = "Превосходно, Сенсей. Вы доказываете, что вы союзник Красной Зимы."
1003702-46 = "Хм... Полагаю, усы технически можно считать частью бороды."
1003702-47 = "Э-Это спорный момент, но формально ответ нельзя назвать неправильным!"
1003702-48 = ""
1003702-50 = ""
1003702-51 = "Следующий вопрос! Кто является Великим лидером Красной Зимы, Украшательницей земель, капитаном Клуба лёгкой атлетики и начальником санитарной службы?"
1003702-52 = "[s7] «Президент Черино.»\n[s8] «Президент Черино.»\n[s9] «Президент Черино.»"
1003702-53 = "Верно! Превосходно!"
1003702-54 = "Верно! Превосходно!"
1003702-55 = "Верно! Превосходно!"
1003702-56 = "Я рада, что мне не придётся проводить чистку доверенного союзника президента Черино.#nВы доказали свою благонадёжность."
1003702-57 = "Полагаю, пора перейти к следующему подозреваемому в моём списке."
1003702-58 = "[s] «Погоди. Кажется, теперь моя очередь задавать вопросы.»"
1003702-59 = "А? Какие ещё вопросы?"
1003702-60 = "Т-Теперь, когда с вас сняты подозрения, вы хотите убедиться, что Я не шпион?"
1003702-61 = "Хм... Пожалуй, по моей же логике даже самый верный офицер может оказаться шпионом."
1003702-62 = "Ха! Хорошо! Я принимаю ваш допрос. Я уверена в своих знаниях о любимой академии."
1003702-63 = "[s] «Какой рост у президента Черино?»"
1003702-64 = "Ха. Легкотня: 180 см!"
1003702-65 = "Это написано в каждом выпуске «Красного Медведя», так что, разумеется, я запомнила!"
1003702-66 = "[s] «Но президент Черино ниже тебя, Марина.»"
1003702-67 = "Т-Точно."
1003702-68 = "А мой рост около 165 см... Ничего не понимаю!"
1003702-69 = "Ладно, хорошо! Но больше вы меня не подловите, Сенсей."
1003702-70 = "[s] «Сколько лет президенту Черино?»"
1003702-71 = "Президент учится на третьем курсе... значит, ей 17!"
1003702-72 = ""
1003702-75 = "Или, может быть, 18...? Верно?"
1003702-76 = "Почему вы молчите? Сколько ей лет?!"
1003702-77 = "[ns] Итак, Марина..."
1003702-79 = "[ns] Ты ведь не так уж много знаешь о Красной Зиме, да?"
1003702-80 = "Э-Это неправда!..."
1003702-81 = "Я председатель Комитета безопасности, и всё же провалила ваш тест?!#nЗначит... я и правда шпион?"
1003702-82 = "Я... шпион? Что мне делать, Сенсей?!"
1003702-83 = "М-Мне нужно сдаться?! Приговорить саму себя к казни?!"
1003702-85 = "Марина была совершенно раздавлена, поэтому я успокоил её и отправил обратно в Секретариат."
