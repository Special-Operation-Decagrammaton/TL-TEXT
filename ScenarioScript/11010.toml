[translation]
11010-1 = "Episódio 1;Bem-vindo ao Comitê de Contramedidas!"
11010-2 = "Schale - Escritório"
11010-3 = "Bom dia, Sensei!"
11010-4 = "Nos últimos dias, parece que muitos rumores sobre a Schale se espalharam, e já estamos recebendo cartas de outras alunas pedindo ajuda."
11010-5 = "É um ótimo sinal! Quer dizer que finalmente chegou a nossa hora de brilhar!"
11010-6 = "Mas, no meio delas... encontramos esta carta um tanto preocupante."
11010-7 = "Acho que seria melhor você dar uma olhada nela, Sensei."
11010-8 = "[s] Ler a carta."
11010-11 = "Ao Sensei do Clube de Investigação Federal,"
11010-13 = "Olá. Meu nome é Ayane Okusora, do Colégio Abydos."
11010-15 = "Há algo muito importante que preciso pedir ao Sensei,#ne é por isso que escrevo esta carta."
11010-17 = "Para ir direto ao ponto, nossa escola está encurralada neste momento."
11010-19 = "E tudo por causa de uma organização criminosa local."
11010-21 = "(Ler a segunda página)"
11010-23 = "As circunstâncias que nos levaram a isso são bem complicadas, mas..."
11010-25 = "Ao que tudo indica, o alvo deles é o próprio prédio da nossa escola."
11010-27 = "Por enquanto, estamos conseguindo segurá-los de algum jeito,"
11010-29 = "mas nossos suprimentos, como munição, estão prestes a acabar..."
11010-31 = "Se continuarmos assim, a escola corre o risco de ser tomada por essa organização criminosa."
11010-33 = "(Ler a terceira página)"
11010-35 = "Por isso, decidi recorrer ao Sensei."
11010-37 = "Sensei, por favor, você poderia nos ajudar?"
11010-40 = "Hmm... Colégio Abydos, é..."
11010-41 = "Ouvi dizer que antigamente era um distrito autônomo enorme, mas que a cidade entrou numa situação difícil por causa das mudanças climáticas."
11010-42 = "Dizem que é tão grande que tem gente que se perde bem no meio da cidade e precisa de resgate!"
11010-43 = "Ahaha, será que isso acontece mesmo...? Se perder e precisar de resgate bem no meio da cidade já é demais..."
11010-44 = "Acho que deve ser um pouco de exagero, mas..."
11010-45 = "Mais importante que isso, uma escola sendo atacada por uma organização criminosa... Parece bem sério..."
11010-46 = "O que será que aconteceu?"
11010-47 = "[s] Viajar a trabalho para Abydos."
11010-48 = "Já vamos partir?! Como esperado da iniciativa de um adulto!"
11010-49 = "Entendido! Vamos partir agora mesmo!"
11010-51 = "(E assim, cheguei ao Distrito Autônomo de Abydos, mas...)"
11010-52 = "(sem conseguir encontrar a escola, vaguei por dias e acabei me perdendo bem no meio da cidade, precisando de resgate)"
11010-54 = "Próximo;Primeiro Dia em Abydos"
