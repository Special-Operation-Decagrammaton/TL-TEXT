[translation]
11010-1 = "Эпизод 1;Добро пожаловать в Комитет по предотвращению закрытия!"
11010-2 = "Исполнительный офис Шале"
11010-3 = "Доброе утро, Сенсей!"
11010-4 = "О Шале начинают говорить всё больше, и нам уже пришли письма от других студентов с просьбами о помощи."
11010-5 = "Это отличный знак! Значит, у нас будет много работы!"
11010-6 = "Эм, но... среди них есть одно письмо."
11010-7 = "Думаю, вам стоит взглянуть."
11010-8 = "[s] Прочитать письмо."
11010-11 = "Советнику Федерального следственного клуба:"
11010-13 = "Здравствуйте. Меня зовут Окусора Аяне, я студент старшей школы Абидос."
11010-15 = "Я пишу это письмо, потому что хочу попросить вас о помощи."
11010-17 = "Нашу академию преследуют."
11010-19 = "Одна местная банда постоянно нас донимает."
11010-21 = "Прочитать следующую страницу."
11010-23 = "История длинная, но мы думаем..."
11010-25 = "...что этой банде нужно само здание школы."
11010-27 = "Мы изо всех сил пытаемся их остановить."
11010-29 = "Но рано или поздно у нас закончатся боеприпасы и припасы."
11010-31 = "Если так продолжится, школа попадёт к ним в руки."
11010-33 = "Прочитать последнюю страницу."
11010-35 = "Поэтому я и пишу вам с просьбой о помощи."
11010-37 = "Пожалуйста, помогите нам, Сенсей."
11010-40 = "Хм... Старшая школа Абидос, значит?"
11010-41 = "Когда-то у неё был огромный процветающий район, но из-за изменений климата всё пришло в упадок."
11010-42 = "Район был настолько огромным, что люди умудрялись заблудиться прямо посреди города!"
11010-43 = "Хи-хи. Наверное, звучит нелепо. Как вообще можно заблудиться посреди современной цивилизации?"
11010-44 = "Уверена, это просто преувеличение."
11010-45 = "Но всё же не верится, что целую академию терроризирует какая-то банда. Звучит серьёзно..."
11010-46 = "Интересно, с чего всё началось."
11010-47 = "[s] «Мне нужно отправиться в Абидос»."
11010-48 = "Хотите выехать прямо сейчас? Вот какой он — настоящий взрослый!"
11010-49 = "Тогда хорошо! Удачи!"
11010-51 = "В конце концов я добрался до Абидоса..."
11010-52 = "...но заблудился посреди района. Поиск школы занял несколько дней."
11010-54 = "Следующий Эпизод;Первый день в Абидосе"
