[translation]
10001025-1 = "Эпизод 2; Переворот под солнцем"
10001025-2 = "Президентский кабинет академии Красная Зима"
10001025-4 = "У-уф... Что там за грохот? Во имя усов, почему так шумно?!"
10001025-5 = "Я так не смогу продолжить свой сон!"
10001025-7 = ""
10001025-8 = "Ч-Черино! У нас чрезвычайная ситуация!"
10001025-9 = "Гх! Я же сказала не прерывать мой сон, какой бы срочной ни была причина!"
10001025-10 = "Ты всё-таки захотела познакомиться с моим сапогом, главный секретарь Томоэ?"
10001025-11 = "Но дело в том..."
10001025-12 = "К-Кхм!"
10001025-13 = "Президент Черино, группа вооружённых студентов прямо сейчас штурмует секретариат."
10001025-14 = "Что, опять переворот? Какой клуб на этот раз?"
10001025-15 = "Фронт освобождения мятного шоколада? Федерация революционеров против лимона на жареной курице?"
10001025-16 = "Хотя неважно. Если оставить подавление переворота председателю Марине, беспокоиться не о чем."
10001025-17 = "Так что не прерывай мой сон из-за пустяков!"
10001025-18 = ""
10001025-19 = "Но, эм..."
10001025-20 = "Дело в том, что за переворотом стоит... председатель Совета безопасности Марина."
10001025-22 = "Ч-что ты сейчас сказала?!"
10001025-23 = ""
10001025-24 = ""
10001025-26 = "Ай-ай-ай..."
10001025-27 = "Президент, вы в порядке?"
10001025-28 = "Я-я в порядке..."
10001025-29 = "Г-гораздо важнее! Почему Марина устроила переворот? Я ведь ничего ей не сделала!"
10001025-30 = "Я не уверена..."
10001025-31 = "Неужели потому, что... я съела пудинг, который Марина приберегала для себя?!"
10001025-32 = "Или потому, что я пускала слюни на её любимого плюшевого мишку, пока дремала?"
10001025-33 = "[s] «...Наверное, из-за пудинга.»"
10001025-34 = "Эм... Что мне делать, товарищ? Наверное, стоит купить ей новый пудинг, да?"
10001025-35 = "Но в академии остался только тот безвкусный разбавленный водой..."
10001025-36 = "Государственная гвардия во главе с председателем Мариной будет здесь с минуты на минуту. Здесь больше небезопасно."
10001025-37 = "Сенсей, учитывая риск, думаю, вам стоит эвакуироваться вместе с нами."
10001025-38 = "Н-но куда нам вообще идти?"
10001025-39 = "На окраине Красная Зима есть старое заброшенное школьное здание."
10001025-40 = "Если спрячемся там, даже председателю Марине будет трудно нас найти."
10001025-41 = "В-верно. Тогда это временное отступление!"
10001025-42 = "Я совершенно точно не убегаю!"
10001025-43 = ""
10001025-44 = "Ну же, поторопимся!"
