[translation]
22180-1 = "Episódio 18;A Muralha Ainda Intransponível"
22180-13 = "...!"
22180-14 = "Lenta, lenta, lenta..."
22180-23 = "Você é lenta demais, caloura!"
22180-32 = "(Em velocidade, sou claramente superior usando meu \"armamento\"... e mesmo assim)"
22180-39 = "(Os dados não deveriam estar errados...#nMesmo tendo alterado o terreno do campo de batalha conforme as ordens da Rio-sama)"
22180-40 = "(Ainda assim, não consigo decidir a luta... Será que os dados estão errados?)"
22180-41 = "(Não, isso não é uma questão desse nível...)"
22180-49 = "Toda vez que entro no alcance dela, os dados...#nEstão sendo atualizados em tempo real...?!"
22180-50 = "(Se ela encurtar a distância... será perigoso...!)"
22180-56 = "Tsc...!!"
22180-57 = "Um tiro de precisão... de uma distância tão absurda... Não pode ser...!"
22180-59 = "Aqui é o codinome Zero-Dois."
22180-60 = "...Pode deixar a sua retaguarda comigo, senpai."
22180-61 = "Ué? Achei que a gente tinha se perdido... Até que não foi bem assim, né?"
22180-62 = "Isso é só porque a Asuna-senpai tem sorte demais... Normalmente não daria para escapar."
22180-64 = "O labirinto da cidade-fortaleza... tão facilmente assim...?!"
22180-65 = "Estatisticamente, isso é impossível..."
22180-66 = "Hah! Ficou aí se achando, falando bonito sobre separar a gente e não sei o quê."
22180-67 = "No fim era só da boca pra fora? Hein?"
22180-68 = "..."
22180-72 = "Toki, recue por enquanto."
22180-73 = "...!"
22180-74 = "Rio-sama, eu..."
22180-75 = "Não estou culpando você.#nPor causa da interferência da Veritas, perdemos o controle do Avant-Garde."
22180-76 = "Esta falha se deve puramente à minha falta de previsão...#nPor ora, vamos recuar e reorganizar a situação."
22180-77 = "...Sim, senhora."
22180-78 = "— Retirando-me do local."
22180-79 = "Hã?! Tá de sacanagem, sua...!"
22180-88 = "Ei! Não foge não!!"
22180-90 = "Ué, o quê, o quê? A Toki-chan já foi embora?"
22180-91 = "...Parece que a deixamos escapar."
22180-92 = "Argh! Droga!#nEu queria acabar com isso aqui e agora!"
22180-94 = "Não há o que fazer, Presidente, foi um confronto inesperado..."
22180-96 = "Vamos suspender a operação de distração por enquanto... e primeiro nos reunir com o Sensei."
22180-97 = "Afinal, esta operação tem como objetivo resgatar a Aris-chan."
22180-98 = "Não é verdade, Presidente?"
22180-99 = "Ugh..."
22180-100 = "...Ah, tá bom, tá bom, já entendi."
22180-101 = "Beleza, vamos nessa."
22180-104 = "[ns] \"Hum, depois de virar aqui... para onde vamos agora?\""
22180-105 = "Vire à direita e siga em frente! É lá o nosso destino."
22180-106 = "Isso aí, vamos lá!"
22180-107 = "A Aris está aqui...!"
22180-118 = "[ns] \"Então esta é a torre central da cidade-fortaleza 'Eridu'...\""
22180-119 = "A Aris-chan está... aqui..."
22180-120 = "...Vamos!"
22180-121 = "Sim!"
22180-123 = "Hã?"
22180-125 = "Ah! Mestre e pessoal!#nOie, oie!"
22180-126 = "Vocês todos já chegaram, pelo visto."
22180-132 = "Senpai!"
22180-133 = "[s] \"Se a Neru e o pessoal estão aqui... e a Toki?\""
22180-134 = "...Grr!!"
22180-135 = "Ahaha, então, né..."
22180-136 = "...Haa."
22180-137 = "Infelizmente, ela conseguiu escapar."
22180-138 = "Faltava tão pouco pra eu acabar com a raça dela!"
22180-140 = "(Depois disso, ouvi da Akane todos os detalhes sobre a luta contra a Toki.)"
22180-142 = "[ns] \"Então foi isso que causou aquele tremor de agora há pouco...\""
22180-143 = "Sim... E, por causa disso, a própria distração acabou perdendo o sentido."
22180-144 = "[s] \"Não dá para culpar vocês, ninguém imaginaria que o terreno mudaria assim...\""
22180-145 = "Parece que também aconteceu alguma coisa do seu lado, Sensei..."
22180-146 = "Ah, é verdade. Cadê o Clube de Engenharia que estava com vocês?"
22180-147 = "Hmm, não é bem 'aconteceu alguma coisa'..."
22180-148 = "Quer dizer, foi bem complicado, sim, mas..."
22180-149 = "[s] \"Ele era bem forte, o Avant-Garde...\""
22180-155 = "[ns] \"Chihiro, a Aris está nesta torre?\""
22180-156 = "Bem... a Presidente disse isso, não foi?#nQue ia destruir o halo da Aris."
22180-157 = "Para fazer algo assim, ela precisaria de uma instalação à altura, não acha?"
22180-158 = "E aqui em Eridu, toda a estrutura foi projetada para concentrar toda a energia elétrica nesta torre."
22180-159 = "O motivo de a Presidente ter construído uma instalação dessa escala... e as motivações dela...#nA resposta é bem óbvia, né?"
22180-160 = "A Aris está mesmo... lá dentro..."
22180-161 = "Ou seja, agora é só subir essa torre gigantesca, né?"
22180-162 = "[s] \"É isso aí, agora é só subir...\""
22180-163 = "Só que, infelizmente—"
22180-171 = "Não tinha como aquela Presidente não deixar uma guardiã no portão, né?"
22180-175 = "Estava aguardando por vocês, senpais, Sensei."
22180-176 = "[s] \"Como eu imaginava, a guardiã é a Toki...\""
22180-177 = "Ah! Nos encontramos de novo! Oie, Toki-chan!"
22180-178 = "Hã?! Qual é a tua, saiu correndo com o rabo entre as pernas agora há pouco..."
22180-179 = "E ainda tem a cara de pau de aparecer na nossa frente?"
22180-180 = "Acham mesmo que só vocês mudaram de estratégia?"
22180-181 = "...Rio."
22180-182 = "Eu preparei vários planos prevendo que vocês viriam, mas—"
22180-183 = "Jamais imaginei que destruiriam todos os sistemas de defesa e chegariam até aqui..."
22180-184 = "E o que atuou como variável e arruinou todos os meus cálculos foi—"
22180-185 = "O envolvimento do Sensei da Schale, não é mesmo?"
22180-186 = "[s] \"...Rio.\""
22180-187 = "Se for o caso, não importa.#nSe você vai demonstrar um poder fora dos padrões, então eu também usarei um trunfo à altura."
22180-188 = "Toki. A partir deste momento, autorizo o uso do \"Abi-Eshuh\"."
22180-189 = "...Rio-sama, isso é..."
22180-190 = "Sim, originalmente foi feito para combater a \"Princesa dos Deuses Sem Nome\"... mas não há escolha."
22180-191 = "Se eu não conseguir detê-las aqui, tudo terá sido em vão."
22180-196 = "...Sim, senhora."
22180-197 = "Iniciando transição para o sistema de armadura motorizada \"Abi-Eshuh\"."
22180-198 = "[s] \"Abi... Eshuh?\""
22180-211 = "Que som é esse...?"
22180-213 = "...!#nEm cima!"
22180-217 = "Sinal de chamada confirmado."
22180-234 = "U-Uau?! O que é isso?!"
22180-249 = "Sistema de armadura motorizada[wa:1000] \"Abi-Eshuh\"[wa:1500] ativado."
22180-254 = "Iniciando[wa:1500] combate."
22180-258 = "[ns] \"...Aí vem ela!\""
