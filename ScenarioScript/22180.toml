[translation]
22180-1 = "Эпизод 18; Непреодолимая стена"
22180-2 = ""
22180-11 = ""
22180-12 = ""
22180-13 = "...!"
22180-14 = "Медленно, медленно, медленно..."
22180-15 = ""
22180-23 = "Слишком медленно, младшекурсница!"
22180-24 = ""
22180-29 = ""
22180-32 = "(Я должна быть намного быстрее неё, особенно учитывая, что оружие у меня.)"
22180-33 = ""
22180-35 = ""
22180-36 = ""
22180-39 = "(Данные о ней должны быть точными. Более того, я выполнила приказ Рио и изменила рельеф поля боя.)"
22180-40 = "(Но я всё равно не могу её победить... Неужели данные неверны?)"
22180-41 = "(Нет, дело не в этом!)"
22180-42 = ""
22180-48 = ""
22180-49 = "Ты... становишься сильнее прямо во время боя. Что ты такое?!"
22180-50 = "(Если дать ей слишком много свободы передвижения... для меня это плохо кончится!)"
22180-51 = ""
22180-53 = ""
22180-54 = ""
22180-56 = "Ух...!"
22180-57 = "Кто мог попасть в меня с такого расстояния...?!"
22180-59 = "Говорит позывной Ноль-Два."
22180-60 = "Я окажу поддержку с тыла."
22180-61 = "Ух ты! Я на секунду заблудилась! Не ожидала, что мы так быстро её найдём!"
22180-62 = "Это твоя необъяснимая удача, Асуна. Со мной такое обычно не случается."
22180-63 = ""
22180-64 = "Как вы так легко прошли лабиринт Города-крепости?!"
22180-65 = "Вероятность должна была быть практически нулевой!"
22180-66 = "Ха! А ты так гордилась тем, что разделила нас."
22180-67 = "И это всё, на что ты способна?"
22180-68 = "..."
22180-69 = ""
22180-71 = ""
22180-72 = "Токи, пока отступай."
22180-73 = "...!"
22180-74 = "Рио, я..."
22180-75 = "Я тебя не виню. Мы потеряли контроль над Авангардом из-за вмешательства Веритас."
22180-76 = "Это провал из-за моей неспособности предсказать исход... Нам нужно перегруппироваться."
22180-77 = "...Да, мэм."
22180-78 = "Отступаю из боя."
22180-79 = "Что?! Эй! Куда ты собралась?!"
22180-80 = ""
22180-82 = ""
22180-88 = "Эй! Вернись! Ах ты...!"
22180-90 = "О, что?! Токи просто ушла?"
22180-91 = "...К сожалению, мы её упустили."
22180-92 = "Аргх, чёрт! Нужно было закончить всё здесь!"
22180-94 = "Это было не в наших силах, Президент. Мы не ожидали, что бой пойдёт именно так."
22180-95 = "Ситуация изменилась."
22180-96 = "Откажемся от отвлекающего манёвра... и пока присоединимся к Сенсею."
22180-97 = "Сейчас важнее всего спасти Алису."
22180-98 = "Верно, Президент?"
22180-99 = "Уф."
22180-100 = "*вздох* Ладно, хорошо."
22180-101 = "Тогда выдвигаемся."
22180-104 = "[ns] «Чихиро, куда дальше?!»"
22180-105 = "Поверните направо и идите прямо! Цель будет совсем рядом!"
22180-106 = "Ладно! Вперёд!"
22180-107 = "Мы пришли...!"
22180-108 = ""
22180-118 = "[ns] «Это центральная башня Города-крепости Эриду...»"
22180-119 = "Алиса здесь..."
22180-120 = "Пошли!"
22180-121 = "Мы забираем Алису обратно!"
22180-123 = "А?"
22180-125 = "О! Мастер, все! Привет!"
22180-126 = "Вы уже здесь."
22180-127 = ""
22180-129 = ""
22180-130 = ""
22180-131 = ""
22180-132 = "Это C&C!"
22180-133 = "[s] «Неру и остальные здесь... А где тогда Токи?»"
22180-134 = "...Ух!"
22180-135 = "Ха-ха-ха! Ну, насчёт этого..."
22180-136 = "*вздыхает*"
22180-137 = "Мы её упустили."
22180-138 = "Мы были так близко! Я бы ей морду набила!"
22180-140 = "Акане быстро объяснила, что произошло."
22180-142 = "[ns] «Так вот почему весь город трясло.»"
22180-143 = "Они застали нас врасплох... Значит, отвлекающий манёвр оказался бессмысленным."
22180-144 = "[s] «Кто бы мог подумать, что сам город умеет двигаться...?»"
22180-145 = "Похоже, у вас тоже многое произошло, Сенсей."
22180-146 = "Ага, кстати, где Инженерный Департамент?"
22180-147 = "Хмм... Многое произошло..."
22180-148 = "Наверное, можно и так сказать."
22180-149 = "[s] «Авангард был ещё тем противником...»"
22180-150 = ""
22180-152 = ""
22180-153 = ""
22180-155 = "[ns] «Чихиро, Алиса точно в этой башне?»"
22180-156 = "...Рио собирается уничтожить нимб Алисы."
22180-157 = "Чтобы сделать нечто подобное, ей понадобится хорошо оснащённый объект."
22180-158 = "В Эриду вся энергия города сосредоточена в башне перед нами."
22180-159 = "Учитывая логику и мотивы президента при строительстве такого объекта... другого места быть не может."
22180-160 = "Значит... Алиса и правда там..."
22180-161 = "Чего мы ждём?! Нужно просто забраться на эту огромную башню, да?!"
22180-162 = "[s] «Да, именно. Тогда идём?»"
22180-163 = "Но поскольку это ядро города, само собой разумеется..."
22180-169 = ""
22180-170 = ""
22180-171 = "...здесь будут привратники."
22180-172 = ""
22180-174 = ""
22180-175 = "Я вас ждала, старшекурсницы, Сенсей."
22180-176 = "[s] «Ну конечно, привратник — Токи...»"
22180-177 = "О! Снова встретились! Ха-ха! Привет, Токи!"
22180-178 = "Ха! В прошлый раз ты сбежала как трусиха. И опять вернулась?!"
22180-179 = "Что у тебя в голове?"
22180-180 = "Это означает, что планы изменились не только у вас."
22180-181 = "...Рио."
22180-182 = "Планы и расчёты строятся на имеющихся данных. Стратегия же готовится с учётом будущего."
22180-183 = "Я не думала, что вы дойдёте сюда, ускользая от защитных систем, уничтожая их и перепрыгивая через них."
22180-184 = "Переменные и ошибки в моих расчётах, которые позволили этому случиться, должно быть, вызваны..."
22180-185 = "Вами. Сенсей."
22180-186 = "[s] «...Рио.»"
22180-187 = "Хорошо. Раз вы используете столь необычную силу, нам придётся ответить тем же."
22180-188 = "Токи, с этого момента разрешаю использовать Аби-Эшух."
22180-189 = "Рио, это..."
22180-190 = "Да. Изначально он был подготовлен для борьбы с принцессой Безымянных Богов... но выбора нет."
22180-191 = "Если не остановим их здесь, всё потеряет смысл."
22180-192 = ""
22180-194 = ""
22180-195 = ""
22180-196 = "...Да, мэм."
22180-197 = "Приступаю к эксплуатации системы силовой брони Аби-Эшух."
22180-198 = "[s] «Аби... Эшух?»"
22180-199 = ""
22180-210 = ""
22180-211 = "Ч-Что это было...?"
22180-213 = "...! Над вами!"
22180-217 = "Сигнал подтверждён."
22180-218 = ""
22180-234 = "Ч-Что?! Это ещё что?!"
22180-249 = "«Система силовой брони, [wa:1000]Аби-Эшух, [wa:1500] активирована.»"
22180-254 = "«Начинаю [wa:1500]бой.»"
22180-258 = "[ns] «Она... Она... приближается!»"
