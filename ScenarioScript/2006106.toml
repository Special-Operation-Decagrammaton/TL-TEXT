[translation]
2006106-1 = "Burdens"
2006106-2 = "(Head to the location specified by Kasumi.)"
2006106-7 = "(Kasumi is having a tense conversation with someone.)"
2006106-8 = "(...That is a uniform I have never seen before.)"
2006106-10 = "Kinugawa Kasumi... did you think you could slip away?"
2006106-14 = "Must I constantly worry about pleasing your crowd?"
2006106-15 = "You think not?"
2006106-17 = "[ns] \"Kasumi.\""
2006106-21 = "Sensei? Why are you here..."
2006106-22 = "...Ah, that is right, I called you here."
2006106-24 = "...Sensei?"
2006106-29 = "You are lucky today, Kinugawa Kasumi."
2006106-30 = "Today? You must be confusing me with someone else, since it is always like this."
2006106-32 = "Be careful, though. Bodensatz is always watching."
2006106-33 = "From rock bottom like that? Do as you please."
2006106-44 = "Sensei, I am sorry!"
2006106-45 = "I am sorry for calling you out and then having things turn out like this. Can we reschedule for another day?"
2006106-46 = "[s] \"Are you okay?\""
2006106-47 = "Of course."
2006106-51 = "Anyway, please hurry back. I am truly sorry!"
2006106-53 = "(Urged strongly by Kasumi, I left the scene.)"
