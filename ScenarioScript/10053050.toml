[translation]
10053050-1 = "Эпизод 5;Тень над домиком"
10053050-2 = ""
10053050-3 = ""
10053050-4 = ""
10053050-5 = ""
10053050-6 = "Мы вернулись..."
10053050-7 = ""
10053050-9 = ""
10053050-11 = "Я больше ни шагу не сделаю..."
10053050-12 = "Я тоже..."
10053050-13 = "[ns1] «Вы все выглядите измотанными. Пока отдохните.»\n[ns2] «А я начну готовить ужин...»"
10053050-18 = "[ns3] «М-Моё тело не двигается...?»\n[ns4] «Время остановилось...?!»"
10053050-23 = ""
10053050-24 = "А, похоже на классическую мышечную боль."
10053050-25 = "Раз все вымотались, я приготовлю."
10053050-26 = "О! С-Спасибо!"
10053050-27 = "Но никаких жалоб, даже если вам совсем не понравится! Договорились?"
10053050-28 = "...Ты ведь умеешь готовить, да?!"
10053050-29 = "Проще простого! Что-то жаришь, что-то варишь. Что тут сложного?"
10053050-30 = ""
10053050-32 = ""
10053050-33 = "Это уверенности не внушает. Подожди!"
10053050-34 = "Уф... Может, последить за ней? Ох, но... этот диван..."
10053050-35 = "Как думаешь, Цубаса?"
10053050-36 = ""
10053050-38 = ""
10053050-39 = ""
10053050-40 = "..."
10053050-41 = ""
10053050-43 = ""
10053050-44 = "...Она уже отключилась."
10053050-45 = "Наверное, мы и правда много бегали... Насыщенный день..."
10053050-46 = "Неудивительно, что... она устала... *зевает*"
10053050-47 = "Я тоже немного хочу спать..."
10053050-48 = "..."
10053050-49 = ""
10053050-51 = ""
10053050-53 = "*клац*"
10053050-54 = ""
10053050-57 = "...?! Ч-Что за?!"
10053050-58 = "Кажется, я задремала..."
10053050-59 = "..."
10053050-60 = "Коноха? Это ты, Коноха?"
10053050-61 = "..."
10053050-62 = ""
10053050-63 = "[ns5] «Что-то случилось, Коноха?»\n[ns6] «Ты не можешь войти?»"
10053050-66 = "Х-Хватит дурачиться! Просто иди сюда!"
10053050-67 = "..."
10053050-68 = "Я знаю, что ты делаешь! Не веди себя как ребёнок! Мне и так хватает этих тупых розыгрышей от соседок по комнате!"
10053050-69 = ""
10053050-70 = "..."
10053050-71 = "С-Сенсей...?"
10053050-72 = "[s7] «Да, оставь это мне.»\n[s8] «Я пойду проверю.»"
10053050-75 = "Н-Нет, я пойду с вами."
10053050-76 = "Что-то тут не так. Держитесь за мной, Сенсей."
10053050-77 = ""
10053050-79 = ""
10053050-80 = "...Кто-то... стоит по ту сторону двери..."
10053050-81 = ""
10053050-83 = ""
10053050-84 = ""
10053050-85 = ""
10053050-86 = "..."
10053050-87 = ""
10053050-92 = "Кто тут готов ТУСИИИИИТЬ?!"
10053050-93 = "?!"
10053050-94 = ""
10053050-97 = ""
10053050-98 = ""
10053050-99 = ""
10053050-100 = ""
10053050-101 = ""
10053050-102 = "А? Что? Чего ты лупишь меня своими слабенькими кулачками?"
10053050-103 = "Идиотка! С меня хватит твоих розыгрышей! Смотри... Ты Сенсея напугала!"
10053050-104 = "...? Я? А что случилось?"
10053050-105 = "[s9] «...? У входной двери кто-то был.»\n[s10] «Это была не ты, Коноха?»"
10053050-108 = "А? Вы о чём? Я только что..."
10053050-109 = "А, так ВОТ что это было."
10053050-110 = "А?! И что это значит?"
10053050-111 = "Ну, пока я готовила суп, я видела, как кто-то ходил вокруг домика."
10053050-112 = "Но я знала, что вы, сонные головы, внутри, поэтому не придала этому значения."
10053050-113 = "Т-Тогда снаружи и правда кто-то есть? Вместе с нами?"
10053050-114 = "Учитывая, что вы почувствовали кого-то за входной дверью... Ага. Скорее всего."
10053050-115 = "Ладно, давайте есть. Разбудите и директора. Ей нужны калории."
10053050-116 = "Тебе не кажется, что сейчас происходит кое-что поважнее?"
10053050-117 = "Ой, да ладно. Нет ничего важнее еды! Чтобы жить, надо есть. Подъём, директор!"
10053050-119 = "И так, несмотря на неловкость, мы взяли тарелки."
10053050-120 = "...Неожиданно еда Конохи оказалась довольно вкусной. Хотя выбор блюд был немного... «по-батиному.»"
10053050-122 = ""
10053050-123 = "Понятно... Значит, всё это произошло, пока я спала."
10053050-124 = "...Нужно спросить. На всякий случай."
10053050-125 = "У кого-нибудь из вас есть, скажем... заклятый враг, который живёт лишь ради того, чтобы вас мучить?"
10053050-126 = "Кто бы стал?!"
10053050-128 = "О, у меня, кажется, есть."
10053050-130 = "А?!"
10053050-132 = "Так... Был один парень, который поклялся отомстить всему моему роду. Это было недели две назад."
10053050-133 = "Но были и другие. Вполне логично, что один-два из них могли появиться примерно сейчас."
10053050-134 = "Ты ведь шутишь."
10053050-135 = "Нет. Совершенно серьёзно."
10053050-136 = "В Бюро общественной безопасности я всё-таки не только бумажки перекладываю."
10053050-137 = "...А. Но... не сходится. Не думаю, что они пришли за мной. Только Канна знает, что я здесь."
10053050-138 = "...Нет, ты не можешь быть так уверена."
10053050-139 = "А?"
10053050-140 = "Если кто-то преследует тебя со злыми намерениями, сейчас для него идеальный момент. Ты почти одна, далеко от коллег и находишься в изолированном, незнакомом месте."
10053050-141 = "Разумеется, чтобы эта гипотеза была верной, преследователь должен обладать нечеловеческим терпением, упорством... и, главное, глубоко укоренившейся ненавистью."
10053050-142 = "Подождите! Не думаю, что я сделала что-то, за что меня можно ТАК ненавидеть."
10053050-143 = ""
10053050-145 = ""
10053050-146 = "...Или всё-таки сделала?"
10053050-147 = "ТЫ СДЕЛАЛА?!"
10053050-148 = "А, ну, при исполнении обязанностей иногда кто-то попадает под раздачу. Нельзя приготовить омлет, не разбив пару яиц, знаете ли."
10053050-149 = "Офицеру Валькирии вообще нормально такое говорить?! Ты должна доблестно защищать Кивотос!"
10053050-150 = "Ой, всё нормально. Всё, что я когда-либо делала, было самообороной. Поверьте."
10053050-151 = ""
10053050-153 = ""
10053050-154 = ""
10053050-155 = "...Семеро заключённых."
10053050-156 = ""
10053050-159 = ""
10053050-160 = ""
10053050-161 = ""
10053050-162 = "Я слышала слухи. Семь преступниц — настолько мерзких, безумных и жестоких, что их собственные школы вызвали спецназ Генерального студсовета. А когда они оказались под стражей Исправительного бюро, они... сбежали."
10053050-163 = "А что, если им нужна не только Коноха, а Бюро общественной безопасности... и вся Полицейская школа Валькирии?"
10053050-164 = "Может, нам и правда грозит настоящая опасность...!"
10053050-165 = ""
10053050-167 = ""
10053050-168 = ""
10053050-169 = "Возможно, ты всё же... немного преувеличиваешь?"
10053050-170 = ""
10053050-172 = ""
10053050-173 = ""
10053050-174 = "В этой теории что-то есть."
10053050-175 = "Серьёзно...?"
10053050-176 = "Нам нужна преступница, которая педантична, настойчива и ненавидит Валькирию больше всего на свете."
10053050-177 = "Я знаю ровно одну такую."
10053050-178 = "..."
10053050-179 = "..."
10053050-181 = "Ох, какое облегчение!"
10053050-182 = "А?"
10053050-183 = "Я ТАК боялась, что мы имеем дело с призраком! С фантомом! По ним, знаете ли, довольно сложно стрелять."
10053050-184 = "А беглая преступница — проще простого. Нужно лишь поймать её и... засадить за решётку!"
10053050-185 = "...А, забудьте, что я сказала «за решётку». Я имела в виду... законно передать её Исправительному бюро для реабилитации."
10053050-186 = "Ты говоришь так, будто это пустяк..."
10053050-187 = "У них дурная слава. Даже я слышала о Семерых заключённых."
10053050-188 = "О да? О Семерых заключённых слышала, а о Бюро общественной безопасности — нет?"
10053050-189 = "А. Прости, я не хотела—"
10053050-190 = "Ой, не надо извиняться! Я просто тебя подкалываю!"
10053050-191 = ""
10053050-193 = ""
10053050-194 = "Я со всем разберусь! Кто бы за нами ни пришёл и сколько бы подкрепления ни привёл, я вас защищу. Обещаю."
10053050-195 = "Ещё одна проблема решена! Ха! А я-то разволновалась из-за ерунды!"
10053050-196 = "..."
10053050-198 = ""
10053050-199 = ""
10053050-200 = "..."
