[translation]
1003902-1 = "RABBIT 4, прячься"
1003902-2 = ""
1003902-4 = "Крупный торговый район рядом с Хабом"
1003902-5 = "В тот день, когда мы договорились встретиться с Мию..."
1003902-6 = ""
1003902-8 = ""
1003902-9 = "Мию толкали со всех сторон в толпе перед торговым кварталом."
1003902-10 = ""
1003902-12 = ""
1003902-13 = ""
1003902-14 = "...А? Ой, простите."
1003902-15 = "В-Всё нормально, я сама виновата..."
1003902-16 = ""
1003902-18 = ""
1003902-19 = ""
1003902-20 = ""
1003902-21 = "...Простите."
1003902-22 = "Как странно, я тебя даже не заметил."
1003902-23 = "В-Всё нормально... П-Просто идите дальше..."
1003902-24 = ""
1003902-26 = ""
1003902-27 = "Ох... Сенсей..."
1003902-28 = "В-Вы пришли. Я в-вас ждала."
1003902-29 = "[s1] «...Ты в порядке?»\n[s2] «Тебя тут сильно толкали.»"
1003902-30 = "Всё нормально. В л-людных местах такое бывает."
1003902-31 = "Всё нормально. В л-людных местах такое бывает."
1003902-32 = "С самого рождения у меня будто совсем нет присутствия..."
1003902-33 = "П-Поэтому люди часто врезаются в меня."
1003902-34 = "Зато я хорошо прячусь... Я получила и-идеальную оценку на снайперском тесте SRT..."
1003902-35 = "Но п-преподаватель забыл обо мне... и ушёл. Я п-просидела на полигоне всю ночь."
1003902-36 = "П-Потом стемнело и ещё дождь пошёл."
1003902-37 = "Но никто не сказал мне уходить, поэтому..."
1003902-38 = "Я н-настолько незаметная, что даже в академии SRT обо мне не помнят..."
1003902-39 = "С-С остальными будет так же. Меня з-забудут... как камешек на улице..."
1003902-40 = "Я о-останусь совсем одна..."
1003902-41 = "[s3] «Если ты исчезнешь, я всегда буду тебя искать.»\n[s4] «Я никогда не смогу забыть о твоём существовании, Мию.»"
1003902-42 = "С-Сенсей всегда меня находит..."
1003902-43 = "С-Сенсей всегда меня находит..."
1003902-44 = "С вами всё становится лучше..."
1003902-45 = "Р-Раз вы здесь, м-может, сегодня меня даже заметят."
1003902-46 = "[s] «Как тебя можно не заметить, если ты прямо перед глазами?»"
1003902-47 = "Ха-ха... ха... Н-Надеюсь, вы правы..."
1003902-48 = "П-Пойдём купим принадлежности для кемпинга?"
1003902-50 = "Опасения Мию очень быстро стали реальностью..."
1003902-51 = ""
1003902-52 = "Чем могу помочь? Если вы собираетесь в поход в одиночку, рекомендую товары для одиночного кемпинга вот здесь..."
1003902-53 = "Н-Нас двое... Сенсей и я..."
1003902-54 = "А-а! Ты всё это время тут стояла?"
1003902-56 = ""
1003902-58 = ""
1003902-59 = ""
1003902-60 = ""
1003902-61 = ""
1003902-62 = "После этого толпа продолжала носить её из стороны в сторону..."
1003902-63 = "П-Прости! Я не знала, что ты там!"
1003902-64 = "В-Всё нормально... Я н-не очень заметная..."
1003902-66 = "...Даже машина не признала её существование."
1003902-67 = ""
1003902-69 = ""
1003902-70 = "<Автоматическая дверь. Встаньте перед платформой.>"
1003902-71 = "..."
1003902-72 = "Даже дверь м-меня не видит."
1003902-74 = ""
1003902-75 = "[ns] «...Нелегко тебе живётся.»"
1003902-76 = "Т-Так всегда бывает."
1003902-77 = "Я п-призрак. Ненужный и б-брошенный."
1003902-78 = "...У меня совсем нет присутствия. Я б-б-бесполезна."
1003902-79 = "[s] «Может, это и есть твой дар?»"
1003902-80 = "К-Как это может быть хорошей вещью?"
1003902-81 = "Это полезно только на с-снайперских заданиях..."
1003902-82 = "Я не хочу этого..."
1003902-83 = ""
1003902-86 = "О. Кошка."
1003902-87 = "Какая милая... Наверное, мягкая."
1003902-88 = "[s] «Погоди, эта кошка вообще-то довольно злая.»"
1003902-89 = "Серьёзно?"
1003902-90 = "Но со мной она выглядит доброй."
1003902-91 = "Иди сюда, киска..."
1003902-92 = ""
1003902-95 = "Хи-хи, какая ты милая."
1003902-96 = "[s5] «Не верится, что ты её гладишь.»\n[s6] «Завидую! Я тоже хочу её погладить!»"
1003902-97 = "Знаете... П-Похоже, животные меня никогда не боятся..."
1003902-98 = "Знаете... П-Похоже, животные меня никогда не боятся..."
1003902-99 = "М-Может, это потому, что у меня нет присутствия?"
1003902-100 = "Э-Это не самый плохой талант."
1003902-101 = "По крайней мере, я рада, что могу погладить кошку."
1003902-103 = "После этого мы с Мию ещё долго весело играли с кошкой."
