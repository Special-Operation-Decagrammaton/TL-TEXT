[translation]
2000106-1 = "Мои отношения с Сенсеем?"
2000106-2 = "Крыша Милленниума"
2000106-3 = ""
2000106-4 = "*вздыхает*"
2000106-5 = ""
2000106-6 = "О, вот ты где, Сенсей."
2000106-7 = "Наверное, хочешь знать, что случилось. История длинная."
2000106-8 = "Я поссорилась с подругой."
2000106-9 = "[s1] «В какой больнице они сейчас?»\n[s2] «Что случилось?»"
2000106-10 = "С ней всё в порядке, она в клубной комнате."
2000106-11 = "Это была всего лишь небольшая ссора."
2000106-12 = "Не пойми неправильно. До драки не дошло."
2000106-13 = "Обычно мы покупаем обед за пределами кампуса и едим вместе в клубной комнате."
2000106-14 = "Дело в том — как ни неловко это признавать — в последнее время я на диете."
2000106-15 = "Недавно впервые за долгое время примерила школьную форму, и она оказалась теснее, чем хотелось бы..."
2000106-16 = "А моей подруге никогда не приходилось следить за тем, что она ест."
2000106-17 = "И тут она внезапно предложила пойти за пиццей."
2000106-18 = "И мало того — ещё захотела шоколадный торт на десерт."
2000106-19 = "Я никогда не была привередливой в еде, поэтому обычно соглашалась с её выбором."
2000106-20 = "Но сегодня я почти не была голодна и хотела только салат..."
2000106-21 = "[s] «Почему просто не заказать разное?»"
2000106-22 = "Не говори глупостей, Сенсей."
2000106-23 = "Для девушек заказать на обед разную еду — почти то же самое, что провести линию фронта."
2000106-24 = "[s3] «Это... звучит неправильно.»\n[s4] «Не может быть, чтобы из-за этого стоило драться.»"
2000106-25 = "Да, знаю."
2000106-26 = "Да, знаю."
2000106-27 = "Разногласия нужно решать взаимным уважением."
2000106-28 = "Но ведь именно я всегда соглашаюсь на то, что хочет она."
2000106-29 = "Почему хоть иногда она не может сделать то же для меня?"
2000106-30 = "Разве она мне не должна? Разве это несправедливо?"
2000106-31 = "[s5] «Дружба — не о справедливости и долгах.»\n[s6] «Ты права. Твоя подруга ошиблась.»\n[s7] «Нет, Карин. Здесь неправа ты.»"
2000106-32 = "..."
2000106-33 = "Ха."
2000106-34 = "Ха-ха."
2000106-35 = "Ты права."
2000106-36 = "Взгляд немного старомодный, но в этом есть правда. Я понимаю."
2000106-37 = "Дружба строится на доверии друг к другу."
2000106-38 = "..."
2000106-39 = "*вздыхает*"
2000106-40 = "Я знаю, ты говоришь это, чтобы меня утешить, Сенсей."
2000106-41 = "Но когда слышишь это со стороны, понимаешь, насколько всё это перекручено."
2000106-42 = "Важно, что мы вместе, а не что именно едим."
2000106-43 = "..."
2000106-44 = "Ты права."
2000106-45 = "Спасибо за честность, Сенсей."
2000106-46 = "Иногда всем нам нужна суровая правда."
2000106-47 = "Она поможет мне стать лучше."
2000106-48 = "Хорошо иметь человека, с которым можно поговорить о таких вещах."
2000106-49 = "Я извинюсь перед подругой."
2000106-50 = "Спасибо, Сенсей. Будто камень с души."
2000106-51 = "По пути назад куплю пиццу. И шоколадный торт тоже неплохо бы."
2000106-52 = "А ещё..."
2000106-53 = "Я много об этом думала и не думаю, что мы с тобой можем быть друзьями, Сенсей."
2000106-54 = "Н-Не пойми неправильно!"
2000106-55 = "Я хочу сказать, что ты мне не друг..."
2000106-56 = "...а мой господин. Разве не так?"
2000106-57 = "Ха-ха. Шучу."
2000106-58 = "Ещё раз спасибо, Сенсей. Мне пора."
2000106-59 = ""
2000106-60 = ""
2000106-61 = "...До встречи."
