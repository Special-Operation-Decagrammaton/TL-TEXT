[translation]
10009000-39 = "#video;10008"
10009000-1 = "Пролог;Командная работа на День святого Валентина"
10009000-2 = "Однажды, незадолго до Дня святого Валентина, со мной связались Фубуки и Кирино."
10009000-4 = "Офис Шале"
10009000-6 = "[ns] «Вы хотите, чтобы я помог с патрулированием?»"
10009000-7 = "Во время сезона Дня святого Валентина по всему D.U. проходит множество крупных мероприятий."
10009000-8 = "Есть конкурс шоколадных тортов с известными кондитерами, выставка шоколада ко Дню святого Валентина с известными шоколадными десертами со всего Кивотоса..."
10009000-9 = "О! И не забудь сверхпопулярный конкурс по поеданию шоколада и шоколадный марафон. Они тоже настоящий хит!"
10009000-10 = "И нельзя забыть ежегодный конкурс шоколадных питомцев.#nУчастники целый год выращивают этот шоколад, чтобы сейчас показать его."
10009000-11 = "[s] «До последнего пункта я всё понимал... Что?»"
10009000-12 = "Пока не забивай голову деталями."
10009000-13 = "Обычно за безопасность таких мероприятий отвечает Бюро общественной безопасности."
10009000-14 = "Но говорят, что в этом году мероприятия будут масштабнее, чем когда-либо. Пока мы составляли план охраны, пришла идея попросить тебя о помощи, потому что людей катастрофически не хватает."
10009000-15 = "Поможешь нам, Сенсей? Сомневаюсь, что у тебя есть дела поважнее в День святого Валентина."
10009000-16 = "Ф-Фубуки! Нельзя так говорить!"
10009000-17 = "[s1] «Да что ты обо мне думаешь! У меня есть планы.»\n[s2] «Вообще-то она совершенно права. Моё расписание абсолютно пустое!»"
10009000-18 = "Правда? О-о-о..."
10009000-19 = "И всё же. Как можно отказать просьбе одной из твоих очаровательных студентов?"
10009000-20 = "Не будь таким бессердечным. Обещаю, мы даже поделимся с тобой пончиками.#nНу же!"
10009000-21 = "[s3] «Оставьте пончики себе. Конечно, я помогу.»"
10009000-22 = "Ха. Вот теперь говоришь на моём языке!"
10009000-23 = "С-Спасибо!"
10009000-24 = "С-Сенсей?!"
10009000-25 = "Ну, я вообще-то просто шутила..."
10009000-26 = "Стоит ли так гордиться подобным?#nВпрочем, неважно. Всё равно спасибо, что помогаешь."
10009000-27 = "О-Она права. Спасибо, Сенсей!"
10009000-28 = "[s] «Как я могу отказать, если вы так стараетесь в День святого Валентина?»"
10009000-29 = "Мы ведь говорим о Дне святого Валентина — важном празднике.#nЭто день, когда обмениваются шоколадом и радуются."
10009000-30 = "Смысл Полицейской академии Валькирии — сохранять улыбки на лицах людей."
10009000-31 = "Так редко слышу от тебя столько школьного духа, Фубуки!#nЯ сейчас расплачусь!"
10009000-32 = "К тому же все магазины отдадут мне оставшиеся пончики, когда увидят, как усердно я работаю. Все в выигрыше, да?"
10009000-33 = "Вот что значит быть кадетом Полицейской академии Валькирии!"
10009000-34 = "*ахает* Фубуки!"
10009000-35 = "Хе-хе."
10009000-36 = "В любом случае, спасибо, что согласились помочь нам с патрулированием.#nУвидимся в День святого Валентина, Сенсей."
10009000-42 = "Вскоре наступил День святого Валентина, и я отправился помогать Фубуки и Кирино с патрулированием, как и обещал."
10009000-44 = "Улица торгового района D.U."
10009000-46 = "Торговый район переполнен людьми, пришедшими отметить День святого Валентина."
10009000-47 = "Покупайте особые наборы шоколада с розами — скидка 20% только ограниченное время!"
10009000-48 = "Как насчёт кусочка нашего сладкого мятного шоколада?#nВо время акции «Мятно-шоколадное парфе» второй бесплатно!"
10009000-49 = "Мятный шоколад — отличный подарок друзьям, семье, коллегам или кому-то особенному!"
10009000-50 = "С Днём святого Валентина! У нас специальное предложение для пар! Заходите и посмотрите, что у нас есть!"
10009000-51 = "[s] «Вот это здесь ажиотаж.»"
10009000-52 = "Я продолжил идти по улице торгового района, наслаждаясь праздничной атмосферой."
10009000-53 = ""
10009000-55 = ""
10009000-59 = ""
10009000-61 = "Эй. Слышал, ваш магазин сейчас самое популярное место."
10009000-62 = "Правда, что вы продаёте какой-то счастливый шоколад?"
10009000-63 = "Да, конечно. У нас есть шоколад на удачу в форме четырёхлистного клевера. Хотите купить?"
10009000-64 = "Но слухи правдивы? Если его съесть, мне станет больше везти?"
10009000-65 = "Э-эм... нет. Это просто тематика, так сказать. Такой дизайн нужен для рекламы.#nЯ не могу гарантировать, что он действительно повысит вашу удачу..."
10009000-66 = "Но мы уже заранее купили лотерейные билеты!#nМы хотели стереть защитный слой после того, как съедим этот шоколад!"
10009000-67 = "Вообще-то я не удержалась и уже стёрла одно число.#nПохоже, билет не выигрышный..."
10009000-68 = "Но после шоколада число ведь может измениться... ПРАВДА?!"
10009000-69 = "[s] «Сильно сомневаюсь, что такое случится.»"
10009000-70 = "А...? Ты ведь тот самый Сенсей из Шале?#nТы что, патрулируешь или типа того?"
10009000-71 = "Чего именно к нам прицепился среди всей толпы? Думаешь, мы устроим проблемы?#nЭто называется ПРОФАЙЛИНГ, знаешь ли."
10009000-72 = "Гах! Не надо мне этим тыкать! Я и так знаю, что не выиграла."
10009000-73 = "Нельзя просто дать девушке в шлеме сохранить свои мечты?!"
10009000-75 = "Ага, нам нельзя сейчас сдаваться!"