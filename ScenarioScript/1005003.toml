[translation]
1005003-1 = "Не девочка, а леди!"
1005003-2 = "Сад Цветущей Сливы"
1005003-3 = "По дороге из Шаньхайцзин я встретил Кокону."
1005003-4 = "О! Здравствуйте, Сенсей!"
1005003-5 = "Вы возвращаетесь в «Шале»? Я как раз туда направлялась."
1005003-6 = "Шун сказала, что у неё дела рядом с «Шале»."
1005003-7 = "Я собиралась встретиться с ней там."
1005003-8 = "Раз уж вы здесь, у вас есть редкая возможность..."
1005003-9 = "Вы можете сопроводить меня как настоящую леди!"
1005003-10 = "[s1] «Сопровождать Кокону? И правда редкая возможность.»\n[s2] «Для меня честь сопроводить тебя, Кокона.»"
1005003-11 = "Я ЖЕ СКАЗАЛА — Инструктор Кокона!"
1005003-12 = "Я ЖЕ СКАЗАЛА — Инструктор Кокона!"
1005003-13 = "Ух... Ладно, прощу, раз мы только вдвоём."
1005003-15 = "Мы препирались всю дорогу до города."
1005003-17 = "Городская улица"
1005003-18 = "Вы купили ещё одну чашку кофе?"
1005003-19 = "Столько людей пьёт кофе... Он правда настолько вкусный?"
1005003-20 = "[s3] «В некотором смысле. Тут больше дело в кофеине, чем во вкусе.»\n[s4] «Это... вкус, к которому нужно привыкнуть.»"
1005003-21 = "И всё равно вы пьёте по несколько чашек в день."
1005003-22 = "И всё равно вы пьёте по несколько чашек в день."
1005003-23 = "Должна быть веская причина. Потому что с ним вы выглядите изысканнее?"
1005003-24 = "[s] «Почему бы тебе просто не попробовать и не решить самой?»"
1005003-25 = "...К-Конечно. Почему бы и нет? Я всё-таки настоящая леди."
1005003-26 = "Не улыбайтесь мне так... Я начинаю нервничать."
1005003-27 = "Так... Кофе. Да. Я могу выпить кофе. Без проблем!"
1005003-28 = "Я передал кофе Коконе."
1005003-29 = "Так вот какой кофе..."
1005003-30 = "Темнее ночного неба."
1005003-31 = "О, и горячий."
1005003-32 = "Ай! Настолько горячий, что можно обжечься."
1005003-33 = "Но запах! Такой... Стоп. Он что, горелый?"
1005003-34 = "Вы уверены, что это можно пить?"
1005003-35 = "[s5] «Необязательно, если не хочешь.»\n[s6] «Ну, он нравится не всем. Давай я заберу.»"
1005003-36 = "Ч-Что?! Нет, я всё ещё хочу."
1005003-37 = "Ч-Что?! Нет, я всё ещё хочу."
1005003-38 = "Я просто— Эм..."
1005003-39 = "Я просто наслаждаюсь ароматом, ясно?!"
1005003-40 = "[s] «Ты только что сказала, что пахнет горелым...»"
1005003-41 = "И что? Я не говорила, что мне не нравится запах."
1005003-42 = "Я инструктор. С чашкой кофе справлюсь."
1005003-43 = "[s] «Причём здесь вообще то, что ты инструктор?»"
1005003-44 = "Я-я не знаю. Как-нибудь связано!"
1005003-45 = "По крайней мере для меня..."
1005003-46 = "Так. Сейчас просто возьму и выпью..."
1005003-47 = "Раз. Два. Три!"
1005003-48 = ""
1005003-50 = ""
1005003-51 = "Кокона выпила весь кофе одним большим глотком."
1005003-52 = "Я даже не успел сказать ей пить маленькими глотками."
1005003-53 = "Ух. Фу."
1005003-54 = "[s] «Ты в порядке, Кокона? Ну как?»"
1005003-55 = "Горько и..."
1005003-56 = "Отвратительно! Худшее, что я когда-либо пробовала!"
1005003-57 = "Зачем вы пьёте эту гадость?"
1005003-58 = "Вам НРАВИТСЯ мучить себя? Вы мазохист?"
1005003-59 = "ВСЕ, кто пьёт это, мазохисты?"
1005003-60 = "[s7] «Нет, совсем не поэтому...»\n[s8] «Я понимаю, почему ты так подумала, но—»"
1005003-61 = "Ух! Кофе отвратительный. Лучше бы мороженое."
1005003-62 = "Ух! Кофе отвратительный. Лучше бы мороженое."
1005003-63 = "Эй! Вы же любите мороженое, правда?"
1005003-64 = "Значит, мороженое тоже считается изысканным?"
1005003-65 = "Пожалуйста, скажите да, Сенсей. Я не вынесу, если и от него придётся отказаться."
1005003-66 = "А? Есть мороженое со вкусом кофе?"
1005003-67 = "Фу-у-у! ЭТО я никогда не пойму."
1005003-69 = "По дороге обратно в «Шале» я утешал разочарованную Кокону."
