[translation]
80000019-1 = "Предметы события"
80000019-2 = "Клубная комната Отдела разработки игр"
80000019-3 = "Я впервые заглянул в клубную комнату Отдела разработки игр, чтобы поиграть с Юзу в онлайн-RPG."
80000019-4 = ""
80000019-10 = "Сенсей! Босс агрится на вас."
80000019-11 = "У него почти не осталось здоровья, так что удерживайте его ещё немного, и мы закроем рейд."
80000019-12 = "Продержитесь. Сейчас я применю атаку."
80000019-13 = ""
80000019-20 = "Получилось, Сенсей!"
80000019-21 = "Мы прошли самый сложный рейд в игре."
80000019-22 = "Без вас у меня бы не получилось. Спасибо за всё!"
80000019-23 = "[s] «Мне кажется, большую часть работы сделала ты.»"
80000019-24 = "Н-Это не так. Я смогла убить босса только благодаря вашим усилениям."
80000019-25 = "Вообще-то в этой игре невозможно даже участвовать в рейдах без группы."
80000019-26 = "Ладно, посмотрим, что выпало."
80000019-28 = "Этот меч у меня уже есть. И качество этой брони хуже моей нынешней..."
80000019-29 = "Тогда всё это отдам вам."
80000019-30 = "[s] «Ты уверена?»"
80000019-31 = "Конечно. Я охочусь за другими предметами."
80000019-32 = ""
80000019-34 = ""
80000019-35 = "И ещё..."
80000019-36 = "...примете вот это, Сенсей?"
80000019-38 = "[s] «Что это?»"
80000019-39 = "Особый шоколадный предмет, который доступен только во время события ко Дню святого Валентина."
80000019-40 = "Это всего лишь простой предмет восстановления HP, но я хочу, чтобы он был у вас.#nМне хотелось хоть как-то подарить вам шоколад..."
80000019-41 = "Наверное, настоящий шоколад на День святого Валентина был бы лучше,#nно у меня не хватило смелости покупать такое при всех."
80000019-42 = "Так что надеюсь, этого хватит. Его нельзя съесть, как обычный шоколад..."
80000019-43 = "...но надеюсь, вы всё равно его примете."
80000019-45 = "Я с радостью принял игровой шоколад от Юзу и положил его в хранилище."
