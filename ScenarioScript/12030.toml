[translation]
12030-1 = "Эпизод 3; Прощайте, Решалы 68"
12030-2 = "Офис «Решалы 68»"
12030-3 = "*вздыхает*"
12030-4 = "Не стой столбом, Ару! Давай уже двигаться!"
12030-5 = "*вздыхает*"
12030-6 = ""
12030-7 = "П-Простите. Куда это положить?"
12030-8 = "А? Ого, смотри! Ару так старалась над этой каллиграфией! Бросай в горящую кучу мусора вон там."
12030-11 = "Нельзя это выбрасывать! Мы должны забрать!"
12030-12 = "Но это всего лишь твоё старое домашнее задание. «Одно злодеяние в день»? Странная надпись."
12030-13 = "Н-Но через десять лет это будет стоить миллионов сто иен..."
12030-14 = "*вздыхает*"
12030-15 = ""
12030-16 = "Ты совсем приуныла, Ару."
12030-17 = "Что случилось, Босс?"
12030-18 = "Мне кажется, Ару не рада, что мы съезжаем из офиса."
12030-19 = "Но Префектурная команда теперь знает наше местоположение, а заказчик придёт за нами из-за проваленной миссии. Что ещё делать?"
12030-20 = "Да и бой с Абидосом закончился неприятно."
12030-21 = "Э-Эти предатели! Как они могли напасть на союзников, с которыми только что сражались бок о бок? Трусы, вот кто!"
12030-22 = "*вздыхает*"
12030-23 = "Мы оставили сумку с деньгами в раменной, чтобы хозяин смог оплатить ремонт. Ару, ты..."
12030-24 = "З-Заткнись! Заткнись!"
12030-25 = "Я знаю!"
12030-26 = "..."
12030-27 = "Я знаю, что я не... крутая хладнокровная преступница..."
12030-28 = ""
12030-29 = "*вздыхает*"
12030-30 = "Как же много забот с нашей Босс."
12030-31 = "Но в этом и есть очарование Ару! С ней ужасно весело!"
12030-32 = "Это правда, Ару! Если бы не ты, я не знаю, была бы я вообще жива сейчас..."
12030-33 = ""
12030-35 = "Я восхищаюсь тобой больше всех, Ару!"
12030-36 = "Я-я сказала, заткнитесь!"
12030-38 = "Раз-два!"
12030-39 = "Готово! Всё погружено!"
12030-40 = "Куда теперь?"
12030-41 = "Хм..."
12030-42 = "Ну, если плана ни у кого нет, может, вернёмся в Геенну?"
12030-43 = "[s] «Привет всем!»"
12030-45 = "...!"
12030-46 = "Т-Ты?!"
12030-47 = "С-Сенсей из Шале?!"
12030-48 = "Ого! Это Сенсей! Ты здесь!"
12030-49 = "Ч-Что ты здесь делаешь? Ты же на стороне Абидоса!"
12030-51 = "Да, но Сенсей сказал, что нам надо ладить."
12030-52 = "Верно. И Сенсей помогал нам в бою с Префектурной командой..."
12030-53 = "Похоже, у Сенсея нет дурных намерений... К тому же мы уже уезжаем. Незачем сейчас враждовать."
12030-54 = "[s] «Вы уезжаете?»"
12030-56 = "Мы не уезжаем! Мы двигаемся дальше, чтобы получить ещё больше заказов!"
12030-57 = "[s] «Надеюсь скоро снова увидеться, Ару.»"
12030-58 = "..."
12030-59 = "А-Ахахаха! Разумеется, Сенсей! Уверена, мы ещё сможем поработать вместе."
12030-60 = "Но прямо сейчас мы ужасно заняты. Может, в другой раз."
12030-61 = "Да. Не то чтобы мы больше никогда не вернёмся в Абидос. Мне здесь даже немного нравится."
12030-62 = "Ну... да."
12030-63 = "Согласна."
12030-64 = "К-Конечно, я ещё вернусь за раменом!"
12030-65 = ""
12030-66 = ""
12030-67 = ""
12030-68 = "...Он был вкусный."
12030-71 = "(Вскоре грузовик со всем имуществом Решал 68 выехал из переулка.)"
12030-73 = "Здравствуйте, хозяин. Мы пришли тебя проведать."
12030-74 = "Ты в порядке, хозяин?"
12030-75 = "О, Серика. А, и подруга Серики — Аяне. Рано вы."
12030-76 = "[s] «Как себя чувствуешь?»"
12030-77 = "Даже Сенсей пришёл. Всё нормально, нормально. Просто царапина."
12030-78 = "А что с магазином?"
12030-79 = "Ну, прости, что пришлось тебя уволить, Серика."
12030-80 = "Чего ты извиняешься? Я всё равно не могу работать в здании, которое сравняли с землёй."
12030-81 = "На самом деле я и так собирался скоро закрываться. Просто вышло раньше, чем планировал."
12030-82 = "Что? Ты собирался закрыть магазин?"
12030-83 = "Да. Владелец здания уже прислал уведомление о выселении."
12030-84 = "В-Владелец здания? О чём ты? Здания в районе Абидоса принадлежат школе Абидос, значит твой магазин должен..."
12030-85 = "..."
12030-86 = ""
12030-87 = "Вообще-то Студсовет Абидоса не смог выплатить долг, и право собственности на здание сменилось. Наверное, вы не знали, потому что это было давно."
12030-88 = "Что?!"
12030-89 = "П-Правда? Недвижимость продали? Кому?!"
12030-90 = "[s1] «Это были займы „Кайзер“?»\n[s2] «Это была корпорация „Кайзер“?»"
12030-91 = "Хм... Название вроде знакомое... но я плохо разбираюсь во всех этих документах и контрактах."
12030-92 = "Хм... Название вроде знакомое... но я плохо разбираюсь во всех этих документах и контрактах."
12030-93 = "Е-Если всё так..."
12030-94 = ""
12030-95 = "Серика, Сенсей, вы возвращайтесь в школу. Мне нужно кое-что проверить."
12030-96 = "А-А? Что именно? Я пойду с тобой, Аяне!"
12030-97 = "Хорошо. Тогда сначала возвращайся в клубную комнату, Сенсей. Мы скоро придём!"
12030-98 = "[s] «Хорошо. Мне тоже нужно кое-что всем рассказать.»"
12030-99 = "Хозяин! Даже не думай пока уходить на пенсию, ясно?"
12030-100 = "О, Серика. Я нашёл в ресторане странную сумку с деньгами..."
12030-101 = ""
12030-102 = "[s] «Используй их на ремонт магазина.»"
12030-103 = "Э-Э?"
12030-104 = ""
12030-106 = "Пойдём, Серика!"
12030-107 = "Не знаю куда, но ладно... До встречи, Сенсей!"
12030-108 = ""
12030-110 = "Следующий эпизод;У каждого своя история 1"
