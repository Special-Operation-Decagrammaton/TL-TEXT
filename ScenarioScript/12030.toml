[translation]
12030-1 = "Episódio 3;Adeus, Faz-Tudo 68"
12030-2 = "Faz-Tudo 68 - Escritório"
12030-3 = "Haa..."
12030-4 = "Aru-chaan, você só tá suspirando faz tempo! Bora carregar essas coisas rapidinho?"
12030-5 = "Haaa..."
12030-7 = "H-Hum, onde eu devo colocar isto aqui?"
12030-8 = "Hm? Isso... Ah, é o resto daquela obra-prima de caligrafia onde a Aru-chan mostrou seu talento nato! Pode jogar ali no lixo comum mesmo."
12030-11 = "Não joga fora!! É óbvio que eu vou levar!"
12030-12 = "Mas isso não foi o dever de casa da aula de caligrafia~? Precisa mesmo levar? E o que é \"Um Mal por Dia\"? O que isso quer dizer?"
12030-13 = "C-Com certeza daqui a 10 anos vai valer cerca de 1 bilhão de ienes..."
12030-14 = "...Haa."
12030-16 = "Nem reage direito... Tá bem desanimada, né, Aru-chan..."
12030-17 = "Presidente, o que houve?"
12030-18 = "Parece que a Aru-chan não quer mudar de escritório."
12030-19 = "Mas o Comitê Disciplinar já descobriu onde a gente fica, e como a missão falhou, o cliente também deve vir atrás da gente, então não tem jeito, né?"
12030-20 = "Pensando bem, a luta contra Abydos também acabou ficando meio pela metade."
12030-21 = "N-Não tinha o que fazer! Atacar agora as pessoas com quem lutamos lado a lado... Eu nunca conseguiria fazer uma coisa dessas!"
12030-22 = "...Haa."
12030-23 = "E ainda deixou todo o dinheiro que sobrou daquela maleta pra pagar o conserto daquela loja de lámen. Essa presidente, sinceramente..."
12030-24 = "C-Cala a boca! Cala a boca!"
12030-25 = "Porque, porque...!"
12030-26 = "..."
12030-27 = "Uma fora da lei implacável... Eu..."
12030-29 = "...Haa."
12030-30 = "Realmente, que presidente trabalhosa."
12030-31 = "Mas é justamente por isso que ela é a nossa Aru-chan, né? Ficar com ela é superdivertido!"
12030-32 = "Sim, eu também acho! Aru-sama! E-Eu, se não fosse pela Aru-sama, com certeza nem estaria viva hoje..."
12030-35 = "Por favor, anime-se! A pessoa que eu mais respeito no mundo é a Aru-sama!"
12030-36 = "C-Calem a boca! Eu já sei disso!"
12030-38 = "E... pronto!"
12030-39 = "Isso é tudo! Terminei de carregar!"
12030-40 = "Então, pra onde a gente vai?"
12030-41 = "Hmm..."
12030-42 = "Bom, já que não temos nenhum destino em mente, voltamos pra Gehenna?"
12030-43 = "[s] \"Tomem cuidado, pessoal.\""
12030-45 = "!!"
12030-46 = "Hã...?!"
12030-47 = "Da Schale...!"
12030-48 = "Opa, ah, é o Sensei! Você veio ver a gente!"
12030-49 = "P-Por que você veio aqui?! Você não está ajudando Abydos?!"
12030-51 = "Hmm, mas uma coisa é uma coisa, você não quer se dar bem com o Sensei?"
12030-52 = "Sim, é verdade. Ele também ajudou muito a gente na luta contra o Comitê Disciplinar..."
12030-53 = "Ele não parece ter más intenções... Além disso, já estamos indo embora mesmo, não precisamos criar inimizade à toa."
12030-54 = "[s] \"Vocês estão indo embora pra algum lugar?\""
12030-56 = "N-Nós só vamos mudar um pouco de lugar em busca de outros serviços!"
12030-57 = "[s] \"Entendi. Vamos nos ver de novo, tá? Você também, Aru, e todas vocês.\""
12030-58 = "...Hehe."
12030-59 = "Hehe, hahahaha! Mas é claro! Sensei, trabalhar em parceria de negócios com você não parece nada mal."
12030-60 = "Só que agora estamos muito ocupadas na correria, então fica pra próxima, tá? Pra próxima."
12030-61 = "Bom, também não é como se a gente nunca mais fosse voltar pra Abydos. Aqui até que era um lugar legal."
12030-62 = "É... nisso você tem razão."
12030-63 = "Sim, com certeza."
12030-64 = "C-Claro que vamos voltar, pra comer lámen!!"
12030-68 = "...Porque era realmente muito bom."
12030-71 = "(E assim, o caminhão carregado com a mudança da Faz-Tudo 68 desapareceu no fim do beco.)"
12030-73 = "Olá, Mestre. Viemos visitar o senhor."
12030-74 = "Mestre, o senhor tá bem?"
12030-75 = "Ora, Serika-chan! E Ayane-chan também. Obrigado por virem tão cedo."
12030-76 = "[s] \"Como o senhor está se sentindo?\""
12030-77 = "Ah, até o Sensei veio. Tudo bem, tudo bem, foi só um arranhãozinho."
12030-78 = "Mas... a loja do senhor..."
12030-79 = "Ah, desculpa por você não poder mais trabalhar lá, Serika-chan."
12030-80 = "Não é isso que importa..."
12030-81 = "Na verdade, eu já estava planejando fechar a loja em breve mesmo. Só acabou sendo um pouco mais cedo."
12030-82 = "Hã? Fechar a loja...?"
12030-83 = "É, já faz um tempinho que recebi uma notificação de despejo."
12030-84 = "N-Notificação de despejo? Como assim? O proprietário dos prédios do Distrito Autônomo de Abydos é o Colégio Abydos..."
12030-85 = "...Entendi. Então vocês não sabiam."
12030-87 = "...Alguns anos atrás, o conselho estudantil de Abydos não conseguiu pagar as dívidas, e a propriedade dos prédios e dos terrenos foi transferida."
12030-88 = "O quê?!"
12030-89 = "M-Mentira?! Mesmo sendo o Distrito Autônomo de Abydos?! Então quem é o dono agora?!"
12030-90 = "[s1] \"...É a Kaiser Loans?\"\n[s2] \"...É a Kaiser Corporation?\""
12030-91 = "Hmm... Acho que era um nome parecido com esse... Foi mal, não me lembro direito."
12030-92 = "Hmm... Acho que era um nome parecido com esse... Foi mal, não me lembro direito."
12030-93 = "Não pode ser... Mas, se for esse o caso..."
12030-95 = "Serika-chan, Sensei. Por favor, voltem na frente para a escola. Preciso confirmar uma coisa, então vou passar em outro lugar antes."
12030-96 = "Hm, do que você tá falando? Não entendi direito, mas... eu vou junto!"
12030-97 = "Então, Sensei, por favor volte para a sala de aula! Nós já voltamos também!"
12030-98 = "[s] \"Entendido. Também tenho algo para contar a vocês, então vou esperar lá.\""
12030-99 = "Mestre, nem pense em se aposentar ainda! Entendeu?!"
12030-100 = "O-Opa... Ah, é mesmo, Serika-chan! Antes de ir, tinha uma maleta estranha cheia de dinheiro lá na loja. Você sabe de alguma coisa?"
12030-102 = "[s] \"Por favor, use para reconstruir a loja.\""
12030-103 = "O-Opa?"
12030-106 = "Vamos, Serika-chan!"
12030-107 = "Sim! Ainda não sei pra onde a gente vai, mas... Sensei, até daqui a pouco!"
12030-110 = "Próximo;A História de Cada Uma (1)"
