[translation]
1011206-1 = "Потерянный телефон"
1011206-2 = "Я забеспокоился, не получив ответа от Асуны, и отправился в последнее место, о котором она упоминала."
1011206-6 = "[ns] «(Уже довольно поздно. Интересно, она всё ещё здесь...)»"
1011206-7 = ""
1011206-11 = "Я увидел кого-то, лежащего на земле."
1011206-12 = "[ns] «Асуна?»"
1011206-13 = ""
1011206-20 = ""
1011206-21 = "А! Сенсей!!"
1011206-22 = "Что случилось? Как вы узнали, что я здесь?"
1011206-23 = "[s] «Ты не отвечала мне в MomoTalk, поэтому я пришёл тебя искать.»"
1011206-24 = ""
1011206-26 = ""
1011206-27 = "[ns] «Я подумал, что твой телефон мог сломаться и ты могла попасть в беду.»"
1011206-28 = "А, со мной всё хорошо! Хаха."
1011206-29 = "Не то чтобы я совсем не могла сама о себе позаботиться!"
1011206-30 = "[s] «Какое облегчение.»"
1011206-31 = "Ага! Видите ли, иногда, когда совсем нечем заняться..."
1011206-32 = "...или я не могу побыть с людьми, которые мне нравятся..."
1011206-33 = "...Ага. Иногда мне от этого становится грустно. Ахаха. Будто батарейку нужно подзарядить."
1011206-34 = "[s] «В последнее время ты нормально себя чувствуешь?»"
1011206-35 = "Ага-ага! Мне очень весело."
1011206-36 = "К тому же я постоянно встречаю вас! Так что да, всё отлично!"
1011206-37 = "[s1] «Ну, тогда хорошо...»\n[s2] «Но что ты здесь делала?»"
1011206-38 = ""
1011206-39 = ""
1011206-41 = "А, точно!"
1011206-42 = "Я потеряла телефон!"
1011206-43 = "[s] «Что?»"
1011206-44 = "Я собиралась вам ответить, но отвлеклась, и теперь не знаю, где мой телефон."
1011206-45 = "Поэтому я и не смогла ответить вам в MomoTalk. Простите, Сенсей."
1011206-46 = "[s] «Хочешь поискать его вместе?»"
1011206-47 = ""
1011206-49 = ""
1011206-50 = "Вместе с вами, Сенсей? Ага! Давайте! Хи-хи."
1011206-51 = "Кажется, я потеряла его где-то здесь, но никак не найду!"
1011206-52 = "[s3] «Давай пройдём обратно по твоему маршруту и будем смотреть внимательнее.»\n[s4] «А я продолжу звонить на твой телефон.»"
1011206-55 = "Ага! Он на вибрации, так что будет жужжать. Так мы точно его найдём!"
1011206-57 = "Пока мы осматривали местность, я снова и снова звонил на номер Асуны."
1011206-60 = "Через несколько минут..."
1011206-61 = ""
1011206-65 = ""
1011206-66 = "[ns] «Это было...?»"
1011206-67 = "Сенсей, слышите? Кажется, он где-то совсем рядом!"
1011206-68 = ""
1011206-72 = "А! Вон там!!"
1011206-73 = ""
1011206-75 = ""
1011206-78 = "Нашла, Сенсей!"
1011206-81 = ""
1011206-82 = "Ахаха, наверное, я оставила его на скамейке, когда присела."
1011206-83 = "Надо было сразу начать искать в тех местах, где я точно уже была."
1011206-84 = "[s5] «Вообще это хороший способ искать потерянные вещи.»\n[s6] «Рад, что ты его нашла, Асуна.»"
1011206-87 = "Ага!! Без вашей помощи я бы точно его потеряла."
1011206-88 = "Спасибо, Сенсей!! За то, что вы всегда рядом со мной!"
1011206-89 = ""
1011206-91 = ""
1011206-92 = ""
1011206-93 = "...О, посмотрите!"
1011206-94 = "[s7] «У тебя куча пропущенных звонков от меня.»\n[s8] «Я ведь продолжал звонить, чтобы найти телефон...»"
1011206-97 = "Ахаха, их целых 14! Мне даже участники клуба столько не звонят!"
1011206-98 = "Ага, ощущается как-то странно."
1011206-99 = ""
1011206-102 = ""
1011206-103 = ""
1011206-105 = ""
1011206-106 = "Будто вы о-о-очень отчаянно хотели со мной поговорить. Ахаха!"
1011206-107 = "...Будто я для вас настолько важна."
1011206-108 = "[s] «Ну... тут ты не ошибаешься...»"
1011206-109 = "Фуфу, внутри всё как-то приятно щекочет!"
1011206-110 = "Надо сделать скриншот! Это очень важная запись!!"
1011206-112 = "Я благополучно вернулся вместе с невероятно воодушевлённой Асуной."
