[translation]
2002302-1 = "Слухи о директоре"
2002302-2 = "Исполнительный офис Шале"
2002302-6 = ""
2002302-8 = "Здравствуйте, Сенсей [USERNAME]."
2002302-9 = "Я Огата Канна. Как мы и обсуждали ранее, сегодня я буду дежурить в Шале."
2002302-10 = "Мне впервые поручили эту обязанность, поэтому некоторых необходимых навыков мне может недоставать. Тем не менее, надеюсь на плодотворную совместную работу."
2002302-11 = "[s1] «Взаимно, Канна.»\n[s2] «И... я тоже...? Мэм?»"
2002302-12 = "Кстати, мне сообщили, что раньше несколько студентов Полицейской школы Валькирии уже дежурили в Шале."
2002302-13 = "Хм? Думаете, я говорю слишком официально? Учитывая наши должности, это естественно."
2002302-14 = "Кстати, мне сообщили, что раньше несколько студентов Полицейской школы Валькирии уже дежурили в Шале."
2002302-15 = "Я заметила, что некоторые из них во время этих дежурств ведут себя не так, как подобает сотруднику полиции."
2002302-16 = "Будет прискорбно, если вместо помощи они доставляют неудобства."
2002302-17 = "Надеюсь, они не наговорили ничего слишком глупого."
2002302-19 = ""
2002302-20 = "П-Простите? Вы хотите узнать о директоре Канне?"
2002302-21 = "Эм, только никому не говорите, что я это сказала... но для студентов Полицейской школы она буквально воплощение ужаса."
2002302-22 = "Она такая строгая и всегда выглядит сердитой..."
2002302-23 = ""
2002302-25 = ""
2002302-27 = "*шёпотом* У неё даже прозвище страшное есть. Её называют Дикой гончей."
2002302-28 = "Так что, что бы вы ни делали, Сенсей..."
2002302-29 = "Не попадите в немилость директора Канны!"
2002302-31 = ""
2002302-33 = ""
2002302-34 = "[ns] «Я-Я ничего не слышал...!»"
2002302-35 = "Это хорошо."
2002302-36 = "Вы довольно сильно потеете. Вы не заболели?"
2002302-37 = "[s3] «Сегодня довольно жарко...»\n[s4] «М-Может, включить кондиционер.»"
2002302-40 = "Как вам будет удобнее."
2002302-41 = "Я займусь документами вон там."
2002302-43 = ""
2002302-45 = ""
2002302-47 = "[ns] «(Запомнить: ни при каких обстоятельствах не злить Канну.)»"
2002302-53 = "Сенсей, я хотела бы сверить расходы на совместные учения по общественной безопасности, которые на прошлой неделе проводили Полицейская школа Валькирии и Шале."
2002302-54 = "Где можно найти чеки Шале?"
2002302-55 = "[s5] «Чеки расходов... Они вон там...»\n[s6] «Посмотри в правом ящике стола.»"
2002302-58 = ""
2002302-60 = ""
2002302-61 = ""
2002302-63 = "А. Нашла."
2002302-64 = "Лимитированный рюкзак Pinky-Paca из Momo Friends за 5000 иен..."
2002302-65 = "Предоплаченная подарочная карта магазина мобильных игр на 10 000 иен..."
2002302-66 = "Три коробки бустеров Mushiqueen «Возвращение гигантских жуков» за 5000 иен...?"
2002302-67 = ""
2002302-71 = "Сенсей, похоже, ваши чеки..."
2002302-72 = "[s7] «О-Ой...»\n[s8] «Кажется, я случайно их перемешал!»"
2002302-75 = ""
2002302-77 = ""
2002302-78 = ""
2002302-80 = ""
2002302-81 = "Я бы рекомендовала хранить личные и служебные расходы отдельно. Тогда чеки не будут случайно перемешиваться."
2002302-82 = "Если же их обязательно нужно хранить в одном месте, можно использовать метки разных цветов."
2002302-83 = "[s] «Д-Да, мэм...»"
2002302-84 = "Отлично. Тогда я продолжу выполнять свои обязанности."
2002302-90 = "Сенсей, я упорядочила ваш список свидетельских показаний о разыскиваемых преступниках."
2002302-91 = "Также я отметила на этой карте юрисдикции места, где находились свидетели, чтобы вам было удобнее ориентироваться."
2002302-92 = "[s] «Уже? Быстро!»"
2002302-93 = "По сравнению с моей работой в Полицейской школе Валькирии это довольно просто."
2002302-94 = "Здесь не нужно отдельно утверждать каждый лист, сверять серийные номера или отправлять копии в архивный отдел..."
2002302-95 = "Так что по сравнению с этим документооборот Шале довольно гибкий. Работать намного проще."
2002302-96 = "[s] «Похоже, у вас там нелегко.»"
2002302-97 = "Ничего особенного. Следить за соблюдением процедур — обязанность сотрудника полиции."
2002302-98 = "И ещё, метки на карте не закреплены, так что будьте осторожны, когда будете—"
2002302-99 = ""
2002302-103 = "[ns] «П-Прости! Я хотел прикрепить её к доске объявлений...»"
2002302-105 = ""
2002302-106 = ""
2002302-108 = ""
2002302-109 = "...Уже поздно."
2002302-110 = "Не переживайте. Мне следовало предупредить вас заранее."
2002302-111 = "Я заново расставлю метки."
2002302-112 = ""
2002302-114 = ""
2002302-116 = "[ns] «(Как неловко...)»"
2002302-118 = "*вздох* Похоже, все срочные задачи выполнены."
2002302-119 = "[s9] «Хорошая работа!»\n[s10] «Хочешь чашку кофе?»"
2002302-122 = "Да, пожалуйста."
2002302-123 = "Кофе со льдом, если не возражаете."
2002302-124 = "[s11] «Конечно! Секунду.»\n[s12] «Сейчас сделаю тебе лучший кофе в твоей жизни.»"
2002302-127 = ""
2002302-131 = "Эм, Сенсей? Возможно, я слишком переживаю, но..."
2002302-132 = "Смотрите под ноги, там на полу разбросаны бумаги, когда будете—"
2002302-133 = ""
2002302-135 = "[ns] «А-а-а!»"
2002302-138 = ""
2002302-139 = "[ns] «П-Прости! На тебя много попало?!»"
2002302-140 = ""
2002302-141 = ""
2002302-142 = ""
2002302-144 = ""
2002302-145 = "...Всё в порядке. Но я хотела бы переодеться."
2002302-146 = "Не подскажете, где здесь раздевалка, Сенсей?"
2002302-147 = "Прошу прощения."
2002302-149 = ""
2002302-151 = ""
2002302-154 = ""
2002302-155 = "[s] «Эм...»"
2002302-156 = "Да? Хотели что-то сказать?"
2002302-157 = "[s] «Ты... сердишься?»"
2002302-158 = "Сержусь? Вы сделали что-то, из-за чего мне стоило бы сердиться?"
2002302-159 = "Сегодня были ошибки, но, думаю, ничего такого, из-за чего стоило бы злиться."
2002302-160 = "Кстати, я заметила, что весь день вы чувствовали себя неловко. Поэтому вам было трудно сосредоточиться на работе?"
2002302-161 = "Причина была во мне?"
2002302-162 = "[ns] Рассказать ей услышанные слухи."
2002302-163 = "Ха. Ахаха."
2002302-164 = "Значит, вы слышали слухи о Дикой гончей."
2002302-165 = "Не стоит переживать. Это всего лишь слухи."
2002302-166 = "Даже Дикая гончая из Бюро общественного порядка должна уметь контролировать свои эмоции. Иначе я не имела бы права называть себя сотрудником Полицейской школы Валькирии и ожидать, что мне доверят поддерживать закон."
2002302-167 = "Я понимаю, что некоторым рядом со мной может быть неуютно. Я действительно строга с младшими студентами, и многих пугает выражение моего лица."
2002302-168 = "Но даже я не стала бы сердиться на вас из-за таких пустяков."
2002302-169 = "И я не отчитываю за простые ошибки."
2002302-170 = "В отличие от преступления, ошибка, совершённая без злого умысла, может быть исправлена собственными усилиями. Но если человек боится выговора, он может попытаться скрыть ошибку вместо того, чтобы её исправить."
2002302-171 = "Поэтому надеюсь, что в будущем вы будете чувствовать себя достаточно свободно, чтобы спрашивать меня о чём угодно."
2002302-172 = "[s] «Достойная позиция.»"
2002302-173 = "Я директор Бюро общественного порядка. Быть достойным примером — часть моей работы."
2002302-174 = "А чтобы руководить сотрудницами Бюро с сильными характерами, нельзя бояться самому попадать в неудобные ситуации."
2002302-175 = "[ns] «Понятно. Отличный настрой.»"
2002302-177 = "[ns] «...Ты правда имела в виду, что я могу спросить тебя о чём угодно?»"
2002302-178 = "Да. Конечно."
2002302-179 = "[ns13] «Я заметил, что ты принесла запасную форму...»\n[ns14] «Но... ты взяла... что-нибудь, чтобы надеть под неё...?»"
2002302-182 = "Ч—"
2002302-183 = ""
2002302-185 = ""
2002302-187 = "Это—"
2002302-188 = "Это не вопрос! Это сексуальные домогательства!"
2002302-190 = "Канна ещё довольно долго кричала на меня с пугающим выражением лица."
