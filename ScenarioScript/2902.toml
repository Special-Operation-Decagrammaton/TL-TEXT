[translation]
2902-1 = "Девушки собираются вместе 2"
2902-2 = "Ого!"
2902-3 = ""
2902-5 = ""
2902-6 = ""
2902-7 = ""
2902-8 = ""
2902-9 = ""
2902-10 = "Так вот он какой, Клуб исследования ниндзюцу! Я всегда хотела его увидеть!"
2902-12 = "Псс! Цукуё!"
2902-13 = ""
2902-15 = ""
2902-16 = "А?"
2902-17 = ""
2902-19 = ""
2902-21 = ""
2902-22 = "Цукуё! Что нам делать? Она милая, но такая любопытная!"
2902-23 = "Д-Думаете, она подозрительная?"
2902-24 = "Конечно! Никто, кроме нас, не знает об этом месте!"
2902-25 = "И она просто возникает из ниоткуда и хочет вступить? Подозрительно..."
2902-26 = "Крайне подозрительно!"
2902-27 = "Но... я ведь вступила т-так же..."
2902-28 = "Нет! Ты другое дело! Я лично тебя завербовала, Цукуё. Помнишь?"
2902-29 = "А, точно..."
2902-30 = "Она наверняка шпионка Клуба Инь-Ян или убийца Хяккарёран!"
2902-31 = ""
2902-33 = ""
2902-34 = "Маловероятно, но всё же..."
2902-35 = "Она меня нервирует."
2902-36 = ""
2902-38 = ""
2902-39 = "Мы о ней вообще ничего не знаем."
2902-40 = "Н-Но... Это может стать нашим первым шагом к тому, чтобы стать н-настоящим клубом!"
2902-41 = "Да, я знаю, что сама хотела нового члена. Но это просто какая-то незнакомка с улицы. Хм..."
2902-42 = ""
2902-44 = ""
2902-45 = "А! Придумала."
2902-46 = ""
2902-48 = ""
2902-49 = "Проведём специальное собеседование!"
2902-51 = "С-Специальное собеседование?"
2902-52 = "Ага! Тогда я пойму, подходит ли она Клубу исследования ниндзюцу!"
2902-54 = "Ты ведь не против собеседования, Изуна?"
2902-55 = "Конечно нет! Нужно убедиться, что ниндзя-любитель не станет обузой на заданиях."
2902-56 = "Я всё понимаю!"
2902-57 = "Да, эм... Именно."
2902-58 = "Цукуё, почему бы тебе не принести нашей гостье попить?"
2902-59 = "Да!"
2902-60 = ""
2902-62 = ""
2902-67 = "Э-Эм..."
2902-69 = ""
2902-71 = ""
2902-72 = ""
2902-73 = "В-Вот. Н-Надеюсь, вам понравится."
2902-75 = "О, спасибо!"
2902-76 = ""
2902-78 = ""
2902-79 = ""
2902-80 = "П-Простите, что не можем предложить н-ничего получше."
2902-82 = "Всё хорошо! Нин-нин!"
2902-83 = "Нин-нин? Нет, это не... Я не уверена..."
2902-84 = "Простите, что это не чай и не что-нибудь н-нарядное."
2902-85 = "Это просто в-вода из-под крана..."
2902-86 = "Вода из-под крана?"
2902-87 = "Простите! Не могу поверить, что мы предлагаем г-гостье в-воду из-под крана!"
2902-88 = "Я не х-хочу быть грубой! Просто здесь трудно найти ч-чайные листья."
2902-89 = "Особенно без клубного ф-финансирования... *шмыг*"
2902-91 = "Всё в порядке, Цукуё!"
2902-92 = "Нам повезло, что у нас такая хорошая система водоснабжения! Мы должны гордиться тем, что подаём воду из-под крана!"
2902-93 = "Н-Не уверена насчёт этого, президент!"
2902-95 = "Невероятно!"
2902-96 = "А?"
2902-97 = "Что?"
2902-98 = "Я давным-давно видела документальный фильм о ниндзя."
2902-99 = "Настоящий ниндзя всегда должен довольствоваться охлаждённой водой. Всё остальное — лишняя роскошь!"
2902-100 = "И увидеть, что вы практикуете это в повседневной жизни... Вы куда преданнее пути ниндзя, чем говорят слухи! Я впечатлена!"
2902-101 = "Ага..."
2902-102 = "Кхм... В общем, давай начнём собеседование."
2902-103 = "Как ты нашла наш клуб, Изуна?"
2902-104 = "Мы довольно далеко от района Хяккияко."
2902-105 = "Здесь почти нет ни транспорта, ни удобств."
2902-106 = "(Вообще-то мы специально выбрали это место, чтобы не попадаться на глаза Клубу Инь-Ян и Хяккарёран...)"
2902-108 = "Признаю, найти вас было трудно. А если я пропущу автобус, добраться до школы будет почти невозможно."
2902-109 = "И з-здание старое, поэтому воду и электричество иногда о-отключают. К тому же поблизости нет ни одного м-магазина..."
2902-110 = "К чему ты ведёшь, Цукуё?!"
2902-111 = "Н-Ни к чему! Это о-отличное место!"
2902-112 = "Н-Ночью здесь видно все звёзды... идеально для съёмок ниндзюцу президента..."
2902-113 = "Именно. А лучше всего то, что никто никогда не жалуется, что бы мы ни делали."
2902-114 = "Моя последняя техника называется «Сверкающий огонь». Можно сказать, мой шедевр."
2902-116 = "Вы снимаете собственные тренировки ниндзюцу?"
2902-117 = "Хм?"
2902-118 = "О! Я нашла эту подсказку на улице."
2902-119 = ""
2902-121 = ""
2902-122 = "Это же—"
2902-123 = ""
2902-125 = ""
2902-126 = "Моя листовка! Ты нашла мою листовку! Я ведь расклеивала их месяцев шесть назад!"
2902-127 = "Да, я узнала подсказку на ней из шедевра Шиба Dog Wang Wang «Шиба-ину и ниндзя»."
2902-128 = "Ты это поняла?!"
2902-129 = "Невероятно..."
2902-131 = "(Она, должно быть, любит те же фильмы, что и я... Листовка сработала!)"
2902-132 = "(После того как только эти придурки из Хяккарёран заметили их и сказали, что мы мусорим, я думала, это полный провал.)"
2902-133 = "(Но если она поняла, тогда, может...)"
2902-135 = "Кхм! Ты довольно сообразительная! Переходим ко второму вопросу."
2902-136 = "Самому важному из всех..."
2902-137 = "Я готова! *глоток*"
2902-138 = "Почему ты хочешь вступить в Клуб исследования ниндзюцу?"
2902-139 = "А..."
2902-140 = "Это просто. Я хочу стать такой же, как вы!"
2902-141 = "Как мы?"
2902-142 = "Что?"
2902-143 = "На канале «Мичиручи, a Girl’s Ниндзя Scroll» было одно видео..."
2902-144 = "После того как я увидела «ОБЯЗАТЕЛЬНО К ПРОСМОТРУ! Валун УНИЧТОЖЕН одним простым приёмом!», я подсела!"
2902-145 = "Знаешь, на самом деле то видео—"
2902-146 = "Это наше самое успешное видео, президент!"
2902-147 = "Хм... Да, мы над ним здорово постарались."
2902-148 = ""
2902-149 = "(Камень и так был почти расколот, а нам пришлось идеально выставить кадр, чтобы казалось, будто его разбили одним ударом... Но просмотров было много!)"
2902-150 = "(Значит, она смотрела наши видео...)"
2902-151 = "(Вот почему хочет вступить. Она фанатка! Ха-ха-ха!)"
2902-153 = "Значит, ты одна из наших подписчиц, Изуна?"
2902-154 = "Да!"
2902-155 = "П-Президент! Прямо перед нами сидит настоящая подписчица! Н-Не могу поверить!"
2902-156 = ""
2902-158 = ""
2902-159 = ""
2902-160 = "У нас правда есть фанаты! Нужно это запечатлеть! Можно с-сфотографироваться?"
2902-161 = "Ты о чём? Конечно у нас есть фанаты!"
2902-162 = "Ага! Именно по тому видео я поняла, что вы сможете сделать меня лучшей ниндзя в Кивотосе!"
2902-163 = "А?"
2902-164 = "Л-Лучшей ниндзя в К-Кивотосе?"
2902-165 = "Т-Ты потрясающая, Изуна!"
2902-166 = "Ты и правда в это веришь, да?"
2902-167 = "...Отлично! Мне нравится твой настрой! Ниндзя должна быть амбициозной!"
2902-168 = "Учитывая, как сильно тебе нравятся работы Шиба Dog Wang Wang и как решительно ты хочешь стать такой же, как мы..."
2902-169 = ""
2902-171 = ""
2902-172 = "Сомнений нет."
2902-173 = "Ты идеально подходишь!"
2902-175 = "Ура! Я так рада, что вас нашла!"
2902-176 = "Похоже, мы нашли ту, кого вы искали, п-президент."
2902-178 = "Конечно, мне ещё очень далеко до вашего уровня!"
2902-179 = "Совсем нет!"
2902-180 = "Мы практически одинаковые!"
2902-181 = "Что?"
2902-182 = "Слушай, если ты сумела найти нас по этой листовке, значит, любишь ниндзя так же, как мы. А это главное!"
2902-183 = "...?!"
2902-184 = "Да! Я обожаю ниндзя!"
2902-185 = "Раньше я была совсем одна. Никто меня не понимал."
2902-186 = "А когда тот злодей воспользовался мной, чтобы разрушить фестиваль, я почувствовала себя такой глупой и беспомощной..."
2902-187 = ""
2902-190 = "(Глупой и беспомощной?)"
2902-191 = "(Интересно, она говорит о Комисэн?)"
2902-192 = "(Хм... Злодей на Комисэн...)"
2902-194 = "Изуна, этот злодей..."
2902-195 = "Он устроил хаос на фестивале просто ради развлечения?"
2902-196 = "Да! Откуда вы знаете?"
2902-197 = "Это довольно типично."
2902-198 = "Такие люди думают, что лучше всех. Им нравится унижать тех, кого они не уважают."
2902-199 = "К сожалению, сильнее всего от них обычно страдают друзья и семья."
2902-200 = "Мир полон таких злодеев, как Date Meowru."
2902-201 = "Ого... Жизнь ниндзя так жестока."
2902-202 = "И несмотря на всё это ты всё равно ими восхищаешься."
2902-204 = "На твоём месте я бы после такого вообще не хотела иметь ничего общего с ниндзя!"
2902-205 = "Но ты..."
2902-206 = "Ага..."
2902-207 = "В каком-то смысле оно того стоило. Я встретила господина!"
2902-208 = "...А?"
2902-210 = "Изуна объясняет..."
2902-212 = "...И вот так я стала ниндзя господина!"
2902-213 = "Вот как..."
2902-214 = ""
2902-216 = ""
2902-218 = "(Это было прямо как полноценный боевик.)"
2902-219 = "(Этот «господин», о котором она всё время говорит. Это какая-то странная ролевая игра?)"
2902-221 = "Кажется, я раньше слышала о Шале..."
2902-222 = "П-Президент... *шмыг*"
2902-223 = "Цукуё? Ты почему плачешь?"
2902-224 = "Изуне пришлось столько п-пережить... Её история так меня тронула..."
2902-225 = "Ты столько всего преодолела!"
2902-226 = "Да. Было тяжело, но теперь всё хорошо."
2902-227 = "Мне очень повезло встретить господина. Благодаря ему я смогла продолжить мечтать!"
2902-228 = "Да! Это была такая прекрасная история!"
2902-229 = "Мы только познакомились, но..."
2902-230 = "Я уже вижу, что у тебя доброе сердце. Отличная история!"
2902-231 = "Очень хотелось бы встретиться с этим твоим господином!"
2902-232 = "Если выпадет возможность — конечно!"
2902-233 = ""
2902-235 = ""
2902-236 = "В общем, вот так я и оказалась в Клубе исследования ниндзюцу."
2902-237 = "Такой ответ подойдёт?"
2902-238 = ""
2902-241 = ""
2902-242 = "П-Председатель?"
2902-243 = "Подойдёт? Да это было потрясающе!"
2902-244 = "Всё, через что ты прошла! История твоей жизни! Твоя мечта!"
2902-245 = "Вот сама суть Клуба исследования ниндзюцу!"
2902-247 = "С сегодняшнего дня ты официальный член клуба, Изуна."
2902-248 = "Добро пожаловать в Клуб исследования ниндзюцу!"
2902-249 = "Я? Член Клуба исследования ниндзюцу?"
2902-250 = ""
2902-252 = ""
2902-253 = "Мы станем отличной командой!"
2902-254 = "Не могу дождаться, когда начну работать с вами, президент и госпожа Цукуё!"
2902-255 = "Хм, кроме Цукуё меня ещё никто не называл президентом..."
2902-256 = "Мне нравится!"
2902-257 = "Госпожа Цукуё... Хи-хи!"
2902-258 = "Буду рада работать с тобой, Изуна."
2902-259 = "Я тоже! Я буду стараться изо всех сил!"
2902-260 = "Я стану лучшей ниндзя в Кивотосе! Нин-нин!"
2902-261 = "Да! Мы станем официальным клубом! Вперёд! Сто подписчиков для «Мичиручи, a Girl’s Ниндзя Scroll»!"
2902-262 = "Я знаю, вместе у нас всё получится!"
2902-263 = "Да! Нин-нин!"
2902-264 = ""
2902-266 = ""
2902-267 = ""
2902-268 = ""
2902-270 = "Так эти трое встретились и поделились друг с другом мечтами. Вскоре им предстояло встретить господина..."
2902-271 = "Девушки собираются вместе"
