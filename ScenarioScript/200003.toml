#[!][Build: "1"]
#[!][Data: "20/09"]
[translation]
200003-1 = "Episódio 3; Sonho Estranho"
200003-4 = "「Esta é a história sobre \"você\", o Sensei da Schale, e um \"smartwatch\"」"
200003-5 = "「Você leva uma rotina toda desregrada,#nmas ainda assim fazia um esforço para acordar cedo」"
200003-6 = "「O smartwatch esquecido na mesinha de cabeceira é o seu único e fiel assistente na missão de pular da cama」"
200003-7 = ""
200003-10 = "[ns1] \"Arona......?\"\n[ns2] \"Cadê a Arca de Shittim?\""
200003-13 = "「Pelo visto, você ainda continua no mundo dos sonhos.#nAté porque está procurando por um tablet que jamais poderia estar aí」"
200003-14 = "「......Sendo que o único aparelho eletrônico que a Presidente do Conselho te entregou foi um smartwatch batizado de \"Cajado de Amendoeira\"」"
200003-15 = "[s] Procurar pela Arca de Shittim."
200003-16 = "「Você vasculha o quarto de ponta a ponta, mas obviamente não vai encontrar nada」"
200003-17 = "「E aí você começa a matutar: \"Será que esqueci o tablet em algum canto?\"」"
200003-18 = "「Num gesto automático, você afivela o smartwatch no pulso e segue em direção à copa」"
200003-19 = ""
200003-22 = "「Na penumbra da copa ainda com as luzes apagadas,#nvocê liga a cafeteira no piloto automático e tira uma dose de expresso」"
200003-23 = "「O barulho dos grãos sendo moídos ecoa, e o líquido escuro preenche a xícara.#nÉ um café fuleiro que quase não tem aroma, mas quebra um galho danado pra espantar o sono」"
200003-30 = "「Você vira o café num gole só e ruma direto para o escritório」"
200003-31 = ""
200003-34 = "「Ao pisar no escritório, você se dá conta de outra coisa esquisita」"
200003-35 = "「A aluna de plantão que sempre fica por ali não deu as caras.#nMas você nem esquentou a cabeça, imaginando que ela devia estar só atrasada」"
200003-36 = "「......Isso até você abrir as cortinas」"
200003-37 = ""
200003-43 = "[ns] \"Ué......?\""
200003-44 = "「E é aí que você finalmente repara na terceira anomalia」"
200003-45 = "「O mundo inteiro tinha ficado em preto e branco. Kivotos, antes tão viva e cheia de cores vibrantes, parecia ter desbotado por completo numa paleta cinzenta e sem vida」"
200003-46 = "「Não era tempo nublado. Absolutamente tudo no mundo havia se tornado monocromático」"
200003-47 = "「......E o pior: nem sinal de uma viva alma」"
200003-48 = "「Como se todo mundo tivesse evaporado e deixado apenas você para trás」"
200003-49 = "[ns] \"De quem é...... essa voz?\""
200003-50 = "「Atordoado com tanta loucura, você começa a desconfiar até dos próprios pensamentos que ecoam na sua cabeça」"
200003-51 = "「Mas relaxa. Pelo menos quanto a isso, não tem anomalia nenhuma」"
200003-52 = "「Sabe quando alguém escreve uma história? A pessoa começa em primeira pessoa pra explorar as emoções, mas aí empaca no enredo e resolve mudar pra terceira pessoa.#nÉ um tropeço clássico de quem tá escrevendo pela primeira vez」"
200003-53 = ""
200003-56 = "「......Peço desculpas. Talvez essa piada tenha sido meio específica demais」"
200003-57 = "「Mas voltando ao que interessa. Você veste um casaco às pressas e corre até o hospital,#ndesperado para descobrir o que diabos está acontecendo com você」"
200003-58 = "[ns] Ir até o prédio do Conselho Estudantil Federal."
200003-59 = "「......Ou não. Você decide fazer o contrário e toma outro rumo」"
200003-62 = "「No trajeto até o Conselho Estudantil Federal, o cenário continua o mesmo」"
200003-63 = "「Até dentro do vagão balançante do trem, tudo parece ter se esquecido do que é cor, mergulhado num cinza fosco」"
200003-64 = "「E então...... você se lembra de uma cena que já presenciou antes」"
200003-66 = "「Naquela época, o mundo ardia num vermelho sufocante. Só que......――」"
200003-67 = "「As alunas estavam lá com você」"
200003-73 = "「Mas agora...... não tem ninguém」"
200003-75 = "「Ao chegar ao prédio do Conselho Estudantil Federal, você vasculha cada canto.#nMas continua sem encontrar vivaldino」"
200003-76 = "「Nem a diretora de óculos que vivia puxando sua orelha enquanto cuidava de você,#nnem a oficial de cabelo rosa que não largava o pacote de salgadinho de ovas apimentadas―― ninguém」"
200003-77 = "「......Por fim, você se dirige à \"aquele lugar\"」"
200003-78 = "「Sobe as escadas num fôlego só, como se algo estivesse te empurrando」"
200003-79 = "「Rumo ao lugar onde tudo começou」"
200003-87 = "「No gabinete da Presidente do Conselho...... uma garota desconhecida――」"
200003-88 = "「Não. Havia uma garota sentada ali, transmitindo uma sensação inexplicavelmente familiar」"
200003-89 = "[ns] \"Essa voz...... é sua?\""
200003-90 = "「Sim. Mas, ao mesmo tempo...... também não」"
200003-91 = "「Este mundo são as memórias de uma garota e, ao mesmo tempo, um sonho seu」"
200003-92 = "「Do mesmo jeito que você olha para a garota, ela também está olhando para você」"
200003-93 = "[ns] \"Quem é você?\""
200003-98 = "É um prazer conhecer você, Sensei."
200003-99 = "Eu sou a... de Kivotos――"
200003-100 = ""
200003-109 = "[ns] \"Onde...... onde que eu tô......?\""
200003-114 = "Sensei, você tá bem?!"
200003-115 = "Você tava se revirando e gemendo tanto que eu fiquei super preocupada!"
200003-116 = "[s] \"Foi só...... um sonho......?\""
200003-117 = "Dedução: é provável que tenha tido um pesadelo."
200003-118 = "[s] \"Não...... não parecia um pesadelo, mas......\""
200003-128 = ""
200003-129 = "[ns] \"Foi um sonho bem esquisito, isso sim.\""
200003-130 = "Fico aliviada por não ter sido um pesadelo, mas......"
200003-131 = "Recomendo fazer um check-up médico de rotina. Distúrbios do sono podem ser desencadeados por diversos fatores."
200003-132 = "Isso é culpa dessa sua rotina toda bagunçada!#nA Super Arona-chan manja de tudo, sabia?!"
200003-133 = "A partir de agora eu vou avisar na hora de cada refeição! Trate de comer direitinho!"
200003-134 = "[s] \"Desculpa fazer vocês se preocuparem. Obrigado, meninas.\""
200003-135 = ""
200003-137 = ""
200003-138 = "[ns] \"...... Meninas, vocês já ouviram falar no \"Cajado de Amendoeira\"?\""
200003-139 = "...... Negação. Não há registros armazenados em minha memória."
200003-140 = "Hummm...... parece que eu já ouvi isso em algum lugar...... ou não...... sei lá......"
200003-141 = "Onde foi que você ouviu esse nome, afinal?"
200003-142 = "[s] \"Eu também não consigo lembrar direito......\""
200003-143 = ""
200003-145 = ""
200003-146 = "[ns3] \"Bom, depois eu penso melhor nesse sonho......\"\n[ns4] \"Tá meio cedo, mas que tal a gente começar o trabalho de hoje?\""
200003-149 = "Sensei, ainda são quatro da manhã?!"
200003-150 = "Recomendação: pelo bem de sua saúde, sugere-se retornar ao repouso imediatamente."
200003-151 = "Isso mesmo! Volta já pra cama!"
200003-152 = "E se tiver sem sono, eu canto uma canção de ninar pra você!"
200003-153 = "Não possuímos plugins de canto instalados em nosso sistema...... mas faremos o nosso melhor."
200003-154 = ""
200003-156 = ""
200003-159 = "No Próximo Episódio; O Trapezoedro Reluzente"
