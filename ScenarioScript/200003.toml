[translation]
200003-1 = "Эпизод 3;Странный сон"
200003-4 = "«Эта история о вас, Сенсее из Шале, и ваших умных часах»."
200003-5 = "«Вряд ли вас можно назвать настолько дисциплинированным человеком, чтобы говорить о ежедневном распорядке, но вы всё же стараетесь просыпаться вовремя»."
200003-6 = "«Умные часы, лежащие на столике рядом с вами, звенят, чтобы разбудить. Ваш единственный партнёр»."
200003-7 = ""
200003-10 = "[ns1] «Арона...?»\n[ns2] «Где Сундук Шиттима?»"
200003-13 = "«Всё ещё полусонный, вы отчаянно ищете планшет, которого у вас нет... Но как найти то, чем вы не владеете?»"
200003-14 = "«Единственное электронное устройство, которое президент Генерального Студенческого Совета подарила вам, — умные часы. Посох Шакеда»."
200003-15 = "[s] Искать Сундук Шиттима."
200003-16 = "«Вы продолжаете бессмысленные поиски в спальне, но ничего не находите»."
200003-17 = "«Вы думаете: неужели я вчера где-то оставил планшет?»"
200003-18 = "«Будто делали это уже тысячу раз, вы застёгиваете умные часы на запястье и идёте в гостиную»."
200003-19 = ""
200003-22 = "«В гостиной темно, и по привычке вы начинаете возиться с кофемашиной»."
200003-23 = "«Вы мелете дешёвые зёрна и готовите крепкий эспрессо. Он горький, вкус плоский, но именно это нужно, чтобы проснуться и начать день»."
200003-30 = "«Теперь, когда кофеин разогнался по венам, вы направляетесь в привычный кабинет заниматься привычной работой»."
200003-31 = ""
200003-34 = "«Однако, придя туда, вы замечаете ещё одну аномалию»."
200003-35 = "«Представитель студентов уже должна была прийти. Но само по себе это не обязательно необычно. Они студенты и привыкли жить по собственному расписанию, поэтому странность ускользает так же быстро, как вы её замечаете»."
200003-36 = "«...Пока вы не открываете шторы»."
200003-37 = ""
200003-43 = "[ns] «А...?»"
200003-44 = "«Так вы становитесь свидетелем третьей аномалии»."
200003-45 = "«Знакомый вам Кивотос превратился в чёрно-белый пейзаж. Сияние, когда-то мерцавшее по всему городу, стало серым и тусклым, будто облака затмили солнце»."
200003-46 = "«Но сегодня не пасмурно. Даже сами уличные фонари лишились тёплого света. Там, где раньше жил цвет, танцуют чёрное и белое»."
200003-47 = "«...И улицы. Они отзываются пустотой, какой вы ещё никогда не видели»."
200003-48 = "«Похоже, все и всё в мире рассыпалось в прах... кроме вас»."
200003-49 = "[ns] «Что это за звук...?»"
200003-50 = "«Аномалия за аномалией расшатывают ваше чувство реальности, и даже мысли будто уже не принадлежат вам»."
200003-51 = "«Не тревожьтесь. В конце концов, это вовсе не аномалии»."
200003-52 = "«Начинающие авторы часто попадают в ловушку первого лица, пытаясь лучше передать эмоции истории, а потом обнаруживают, что третье лицо даёт больше свободы для развития повествования»."
200003-53 = ""
200003-56 = "«...Возможно, это было слишком эзотерично, чтобы провести связь»."
200003-57 = "«Вы решаете переодеться и отправиться в больницу. В конце концов, вы ведь, должно быть, больны на голову, нет?»"
200003-58 = "[ns] Отправиться в здание Генерального Студенческого Совета."
200003-59 = "«...Или, возможно, вы выберете другой путь»."
200003-62 = "«Дорога к Генеральному Студенческому Совету лишь сильнее подтверждает всё увиденное»."
200003-63 = "«Пейзаж окрашен в чёрное и белое. Будто сам цвет забыл, как существовать»."
200003-64 = "«Это вызывает в вас странное чувство знакомости»."
200003-66 = "«Вы вспоминаете сцену, очень похожую, но всё же иную. Тогда поверх всего стекал красный цвет, обжигавший глаза»."
200003-67 = "«Знакомо, но не то. Ведь тогда рядом с вами были студенты»."
200003-73 = "«Сейчас их нигде нет»."
200003-75 = "«Вы приходите в здание Генерального Студенческого Совета и находите всё то же»."
200003-76 = "«Ни начальницы в очках, которая всегда присматривала за вами, ни розововолосой исполнительницы, обожающей картофельные чипсы со вкусом икры минтая... Никого не осталось»."
200003-77 = "«...Обыскав всё, вы понимаете: есть одно место, куда вы ещё не ходили»."
200003-78 = "«Будто внешняя сила направляет вас, и вы начинаете подниматься по лестнице туда»."
200003-79 = "«В место, где всё началось»."
200003-87 = "«Там, в самом центре пустого Исполнительного офиса Генерального Студенческого Совета, вы находите загадочную девушку»."
200003-88 = "«Но откуда это странное чувство ностальгии, которое она вызывает?»"
200003-89 = "[ns] «Это ты всё время говорила со мной?»"
200003-90 = "«Да, но нет. Да и нет»."
200003-91 = "«Ибо это ваш сон. И простое желание одной девушки»."
200003-92 = "«Вы смотрите на неё, а она смотрит на вас»."
200003-93 = "[ns] «Кто ты?»"
200003-98 = "Я рада познакомиться, Сенсей."
200003-99 = "Я — Кивотос..."
200003-100 = ""
200003-109 = "[ns] «Это...»"
200003-114 = "Сенсей! Вы в порядке?!"
200003-115 = "Во сне у вас был такой вид, будто вам больно!"
200003-116 = "[s] «Это был сон?»"
200003-117 = "Вам приснился кошмар?"
200003-118 = "[s] «Нет. Я бы не назвал это именно кошмаром»."
200003-128 = ""
200003-129 = "[ns] «Скорее странный сон»."
200003-130 = "Я рада, что вы не пережили кошмар."
200003-131 = "Однако нарушения сна могут быть симптомом множества проблем со здоровьем. Рекомендую регулярно проходить медицинские осмотры."
200003-132 = "Да очевидно, почему вам снятся плохие сны! Вы пропускаете еду и поздно ложитесь!"
200003-133 = "Но не волнуйтесь, Супер-Арона здесь! Я начну напоминать вам каждый раз, когда пора есть!"
200003-134 = "[s] «Спасибо вам обеим за заботу»."
200003-135 = ""
200003-137 = ""
200003-138 = "[ns] «Кстати... Вы знаете, что такое Посох Шакеда?»"
200003-139 = "...Отрицательно. Термин не зарегистрирован в моей памяти."
200003-140 = "Хм... Не знаю. Звучит вроде знакомо."
200003-141 = "Откуда вы это услышали?"
200003-142 = "[s] «Я не очень помню...»"
200003-143 = ""
200003-145 = ""
200003-146 = "[ns3] «Пока отложу этот сон в сторону...»\n[ns4] «Раз уж я проснулся, можно немного поработать.»"
200003-149 = "ЧТО?! Сенсей, сейчас четыре утра!"
200003-150 = "Согласна. Рекомендация: вернуться в постель и обеспечить необходимую продолжительность сна, Сенсей."
200003-151 = "Именно! Немедленно ложитесь!"
200003-152 = "Не переживайте, если не хочется спать! Я спою колыбельную."
200003-153 = "В моей ОС не установлен музыкальный плагин... Но я тоже помогу."
200003-154 = ""
200003-156 = ""
200003-159 = "Следующий Эпизод;Сияющий трапецоэдр"
