[translation]
1005103-1 = "Подвижное выступление капитана"
1005103-2 = "12-й стадион Миллениума"
1005103-3 = "Получив сообщение от Утахи, я отправился на поле, где мы договорились встретиться."
1005103-4 = ""
1005103-7 = ""
1005103-8 = "Эй, Сенсей."
1005103-9 = "Знаю, что предупредила в последний момент. Спасибо, что пришёл."
1005103-10 = "[s] «Ты быстро работаешь.»"
1005103-11 = "Спасибо. Честно говоря, внезапные заказы на специальных роботов-болельщиков застали меня врасплох."
1005103-12 = "Я думала, поддержка нужна только на спортивных мероприятиях, но, похоже, хорошая поддержка пригодится каждому."
1005103-13 = "От кандидатов на выборах, ломающих голову над тем, как донести свою мысль, до владельцев раменных, переживающих из-за слабой торговли..."
1005103-14 = "Поначалу я не понимала, чем поддержка может помочь в таких жизненных ситуациях..."
1005103-15 = "Но жизнь и правда непростая, да? Каждый день приносит свои трудности, которые людям приходится преодолевать."
1005103-16 = "К тому же девиз Инженерного отдела (пока в разработке): «Получили заказ — воплотим проект»... даже если сами не понимаем заказ."
1005103-17 = "Так что я приложу все силы, чтобы выполнить эти заказы на поддержку."
1005103-18 = "[s1] «Но почему опять поле...?»\n[s2] «Но почему опять форма болельщицы...?»"
1005103-19 = "Ну да, в мастерской было бы удобнее, и любые неполадки там исправлять проще..."
1005103-20 = "Но раз речь о поддержке, использование поля почти можно назвать... полевым испытанием."
1005103-21 = "А что до моей одежды... я решила, что для демонстрации логичнее будет надеть форму группы поддержки."
1005103-22 = "И я наконец-то её постирала."
1005103-23 = "Было бы нелогично считать, что идеальная поддержка строится на логике, а не на эмоциях."
1005103-24 = "А ты просто представь себя одним из зрителей и расскажи, какие чувства вызывает у тебя наша поддержка."
1005103-25 = "[s3] «Звучит интересно.»\n[s4] «И какую поддержку ты выбрала?»"
1005103-26 = "Как я уже говорила, раз заказ особенный, то и оборудование для поддержки ему нужно особенное."
1005103-27 = "Как я уже говорила, раз заказ особенный, то и оборудование для поддержки ему нужно особенное."
1005103-28 = "И вот, просматривая материалы в библиотеке, я наткнулась на способ поддержки, который сейчас почти не используют."
1005103-29 = "Это... массовое синхронное выступление болельщиков."
1005103-30 = "[s] «Массовое синхронное выступление?»"
1005103-31 = "Да. Оно требует идеальной синхронности всей группы. Болельщики держат большие щиты и одновременно переворачивают их, создавая огромную движущуюся картинку. Именно такой вариант обычно и представляют."
1005103-32 = "Обычно рисунок одноцветный, но если болельщики достаточно умелые, то, быстро меняя разные цвета, можно создать эффект анимации."
1005103-33 = "Но по сравнению с цифровыми экранами на это уходит много времени на тренировки, а даже простая ошибка всё портит, поэтому сейчас так почти не делают."
1005103-34 = "В последний раз такое массовое выступление проводили в академии «Красная Зима» десять лет назад, но после очередной чистки его запретили."
1005103-35 = "[s] «Это... звучит логично?»"
1005103-36 = "Поэтому мой план — с помощью инженерии создать массовое выступление с машинной точностью."
1005103-37 = ""
1005103-39 = ""
1005103-40 = ""
1005103-42 = "Итак, Сенсей. Садись вон там и представь, что ты зритель."
1005103-43 = "Сейчас я покажу тебе, что именно получается, когда Инженерный отдел объединяет горячую поддержку и превосходную инженерию!"
1005103-46 = "― Миллениум! Миллениум! Вперёд, мы идём![wa:1420]"
1005103-49 = "― Бейте крепче, бейте смело, вперёд, Миллениум![wa:10]"
1005103-52 = "― Хе-хе, ну как тебе, Сенсей?[wa:1270]"
1005103-54 = "― Просто потрясающе, правда?"
1005103-57 = "― Вся эта поддержка выполняется[wa:520]"
1005103-59 = "― машинами под управлением беспроводных сигналов.[wa:80]"
1005103-62 = "― Даже самая сложная программа"
1005103-64 = "― может быть исполнена идеально.[wa:10]"
1005103-67 = "― ...Что?[wa:10]"
1005103-69 = "― Если я всё равно использую машины,[wa:210]"
1005103-72 = "― разве не проще тогда просто"
1005103-74 = "― использовать цифровой экран?"
1005103-77 = "― Сенсей! Не выжимай всю романтику из выступления![wa:460]"
1005103-79 = "― Аналоговые панели, двигающиеся в идеальном ритме друг с другом,[wa:10]"
1005103-82 = "― придают поддержке"
1005103-84 = "― эмоции и живую энергию, которых цифровой экран никогда не передаст.[wa:10]"
1005103-87 = "― Заставить чьё-то сердце биться быстрее[wa:1030]"
1005103-89 = "― это не то, что нужно оптимизировать.[wa:10]"
1005103-92 = "...Ладно, пора проверить последнюю функцию!"
1005103-93 = "Конечно же, главное в массовом синхронном выступлении — заставить глаз поверить, будто он видит одну движущуюся картинку, а не ряд разных щитов рядом друг с другом."
1005103-94 = "Чем быстрее двигаются щиты, тем сложнее людям попадать в нужный момент, поэтому обычно темп довольно медленный..."
1005103-95 = "Но это чудо на машинной тяге должно суметь воспроизвести эффект видео в шестьдесят кадров в секунду!"
1005103-96 = ""
1005103-98 = ""
1005103-99 = "Но только если я переключусь на... максимальный форсаж!"
1005103-100 = ""
1005103-102 = ""
1005103-105 = ""
1005103-108 = ""
1005103-109 = "...Что? Они взорвались? Не успели показать даже одного кадра и сразу бабахнули?"
1005103-110 = "Может, не стоило настраивать скорость движения на один Мах..."
1005103-111 = "Это мой второй по нелюбимости вид взрыва..."
1005103-112 = "[s] «Зато было весело.»"
1005103-113 = "Ты прав. Взрыв был довольно весёлым, хоть и немного разочаровывающим. А, ну и поддержка тоже."
1005103-114 = "К тому же это была хорошая возможность испытать алгоритмы управления выступлением."
1005103-115 = "Хороший мастер извлекает один урок из успеха и десять — из неудачи."
1005103-116 = "Но теперь мне нужно доработать их так, чтобы они взрывались только тогда, когда я сама этого хочу..."
1005103-117 = "Может, снизить частоту кадров, которую я пытаюсь имитировать, хотя бы до тридцати?"
1005103-118 = ""
1005103-121 = "[ns] «Мне кажется, тебя должна волновать совсем не частота кадров...»"
