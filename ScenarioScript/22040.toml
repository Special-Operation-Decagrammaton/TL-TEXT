[translation]
22040-1 = "Episódio 4;~Aris e os Guiados~ (1)"
22040-13 = "(Caminhando junto com a Aris...)"
22040-30 = "Um, dois, um, dois."
22040-35 = "Ah!"
22040-36 = "[s] \"O que foi?\""
22040-38 = "Um, dois,#num, dois."
22040-40 = "Sensei, estou ouvindo uma voz incomum vindo de algum lugar."
22040-41 = "Um, dois,#num, dois."
22040-42 = "[s] \"Quem será...?\""
22040-43 = "Isso é..."
22040-44 = "Ah...! Aris entendeu!"
22040-45 = "É um evento especial que ocorre no campus de Millennium..."
22040-46 = "O presságio de um \"Evento de Encontro Aleatório de Millennium\"!"
22040-47 = "[s] \"En-Encontro aleatório...? Presságio...?\""
22040-48 = "Sim! É um evento de campo que acontece durante uma aventura."
22040-49 = "Não sabemos o que pode acontecer.#nSensei, não baixe a guarda!"
22040-51 = "Um, dois,#num, dois."
22040-52 = "Um, dois,#num, dois, um, dois."
22040-53 = "[ns] \"Q-Que tipo de evento será esse...?!\""
22040-55 = "Um, dois,#num, dois!!"
22040-59 = "[ns] \"A-Apareceu...!\""
22040-62 = "Oh? Olá."
22040-66 = "Hoje também está um ótimo dia para se exercitar, não é?"
22040-67 = "[s] \"S-Sumire...? O-Olá.\""
22040-68 = "Então era um evento de encontro com a Sumire-senpai!"
22040-69 = "Sumire-senpai, você também está em uma \"aventura de exercícios\" hoje?"
22040-70 = "[s] \"\"Aventura de exercícios\"...?\""
22040-71 = "Sim. Pensei em fazer uma corridinha leve."
22040-72 = "Aris-chan também está fazendo \"exercícios de aventura\"?"
22040-73 = "[s] \"\"Exercícios de aventura\"...?\""
22040-74 = "Sim! Hoje estou em uma aventura de heroína aprendiz junto com o Sensei!"
22040-75 = "Entendo, hoje você está junto com o Treinador..."
22040-76 = "É admirável que você se exercite todos os dias."
22040-77 = "Porque a constância é fundamental nas aventuras!#nSe você faltar, seu nível cai rapidinho."
22040-78 = "A Momoi também disse que esquecer as missões diárias é um pecado."
22040-79 = "Sim, nos exercícios o essencial é manter o ritmo firme, passo a passo."
22040-80 = "Além disso, ter o Treinador acompanhando hoje também é maravilhoso."
22040-81 = "[s] \"Vocês duas se encontram com frequência?\""
22040-82 = "Sim. A Sumire-senpai é um dos principais eventos de encontro!"
22040-83 = "Costumo encontrar a Aris-san com frequência quando saio para correr."
22040-84 = "Pelo campus..."
22040-85 = "Afinal, a Sumire-senpai é companheira da Aris nas \"aventuras de exercícios\"!"
22040-86 = "Hihi, sim.#nA Aris-san é minha companheira de treinos."
22040-87 = "[s1] \"\"Aventura de exercícios\"... o que é isso?\"\n[s2] \"\"Exercícios de aventura\"... o que é isso?\""
22040-88 = "É um tipo de aventura!"
22040-89 = "Ouvi dizer que a Sumire-senpai aumenta sua força e agilidade correndo...#ne também sua resistência."
22040-91 = "Sim, porque é divertido fortalecer o corpo enquanto se exercita."
22040-92 = "Essa postura de treinar os atributos principais e correr todos os dias..."
22040-93 = "Isso sim é a aventura de uma verdadeira heroína!"
22040-94 = "Ora... receber um elogio assim de repente até me deixa sem jeito."
22040-95 = "[s] \"A-Ah, é mesmo...\""
22040-96 = "Ouvi dizer que a Aris-san está sempre saindo em \"aventuras?\"."
22040-97 = "Segundo ela, o objetivo principal da aventura é fortalecer corpo e mente..."
22040-98 = "Sim! É subir de nível para aumentar o HP e o MP!"
22040-99 = "...e superar aquilo que não conseguia fazer antes por meio do treinamento."
22040-100 = "Quando o nível sobe, dá para aprender novas habilidades!"
22040-101 = "Entendo... essa mentalidade é excelente!"
22040-102 = "Essa atitude de se esforçar aos poucos todos os dias... muito bem, Aris-san!"
22040-103 = "[s] \"A-Ah, é mesmo...?\""
22040-105 = "[ns] \"Parece que... a conversa delas está fluindo, mas ao mesmo tempo não está...\""
22040-106 = "Vendo a Aris-san junto com o Treinador... de alguma forma..."
22040-107 = "...também não posso ficar para trás."
22040-109 = "Ah, a Aris também não!#nVou me esforçar para subir de nível e não perder para a Sumire-senpai!"
22040-110 = "Certo... então, para começar, 20 km de corrida! Lá vou eu!"
22040-111 = "Com licença, vou indo na frente, Treinador! Aris-san!"
22040-112 = "[s] \"Ah, hum... boa sorte.\""
22040-113 = "Um! Dois!#nUm! Dois!"
22040-114 = "A Aris também não pode perder!"
22040-118 = "Sensei, vamos avançar para a próxima missão!"
22040-119 = "[s] \"Ah, t-tá bom...\""
22040-127 = "(Seguindo a Aris, quando percebi, já tínhamos saído para os arredores de Millennium)"
22040-128 = "[s3] \"Acabamos saindo do campus...\"\n[s4] \"A área de aventura da Aris é bem ampla, hein...\""
22040-131 = "Sim. Não existe \"parar\" no dicionário da Aris."
22040-132 = "Além disso, indo para longe, com certeza vão acontecer eventos inesperados!"
22040-133 = "[s] \"Eventos inesperados, é...\""
22040-141 = "Ah! É o Mestre e a Aris-chan!"
22040-142 = "Oie, olá~!"
22040-143 = "[s] \"Oie?! Virou mesmo um evento inesperado...?!\""
22040-144 = "...Ué, Sensei?#nO que houve de repente?"
22040-145 = "Ahaha! O que foi, o que foi? Aconteceu alguma coisa?"
22040-146 = "[s] \"Não, é que... vocês duas estão com uma roupa que não costumo ver.\""
22040-148 = "Roupas diferentes do habitual... mudança para uma nova classe..."
22040-149 = "Ah! Aris percebeu!#nVocês duas mudaram de empregada para uma nova classe..."
22040-150 = "Vocês mudaram para a classe \"Colegial\", não é?!"
22040-151 = "Não... eu também sou estudante.#nEssa é tipo a minha roupa normal..."
22040-152 = "A Aris sabe que \"Colegial\" é uma classe muito forte!#nA Momoi vivia dizendo isso."
22040-153 = "Isso mesmo, \"Colegial\" é a classe que não tem medo da balança#nmesmo tomando sorvete antes de dormir!"
22040-154 = "[s] \"Acho que não é bem assim, não...\""
22040-155 = "Ahaha, isso aí! A Aris-chan é super perspicaz!"
22040-156 = "Nós fizemos uma mudança de classe e estamos em uma missão secreta agora!#nE esse é o uniforme para isso!"
22040-157 = "[s] \"Missão secreta...?\""
22040-158 = "Uhum! A Presidente Rio disse que anda preocupada com a situação recente de Gehenna~"
22040-159 = "Como era mesmo? Ela pediu para a gente investigar se tem alguma movimentação ou algo assim!"
22040-160 = "Asuna-senpai, espera um pouco..."
22040-161 = "Aí vestimos o uniforme escolar...#ne estamos vendo se aparece alguma aluna de Gehenna por aqui~"
22040-162 = "Pensei em puxar papo se a gente vir alguma~!"
22040-163 = "Entendo, a Asuna-senpai também aceitou uma missão e está se aventurando."
22040-164 = "Igual à Aris!"
22040-166 = "Sério?#nIgual à Aris-chan~! Estamos combinando!"
22040-167 = "Ei, Asuna-senpai.#nA Akane disse que isso era segredo..."
22040-168 = "Ah, é verdade!"
22040-169 = "Aris-chan, Mestre! O que eu falei agora há pouco é segredo, tá?"
22040-170 = "[s] \"Ah, sim... entendido.\""
22040-171 = "Aiai...#nBom, sendo o Sensei e a Aris... tudo bem."
22040-173 = "Sim! A Aris vai guardar segredo!#nNos jogos também, se você vazar um segredo, pode acabar amaldiçoada!"
22040-174 = "Ahaha! Isso mesmo!#nA Aris-chan está sempre cheia de energia, né!"
22040-175 = "[s] \"Mesmo assim, vocês duas de uniforme escolar, hein...\""
22040-176 = "Não, nós também somos estudantes.#nEntão é normal usarmos uniforme..."
22040-177 = "É só que, bem... isso é mais como um traje de infiltração..."
22040-178 = "Mandaram a gente usar o uniforme comum para a missão... então..."
22040-179 = "Então..."
22040-180 = "[s] \"Entendi... ficou ótimo em vocês.\""
22040-181 = "......"
22040-182 = "...Ugh."
22040-183 = "N-Não fique olhando demais, Sensei."
22040-184 = "É que... dá um pouco de vergonha..."
22040-185 = "[s] \"D-Desculpa! Fui indelicado...\""
22040-187 = "[ns] \"É que como é diferente do normal, chama atenção... acho que ficou muito bem!\""
22040-188 = "Aliás, o que a Aris-chan e o Mestre estavam fazendo?"
22040-191 = "O Sensei e a Aris estavam em uma aventura."
22040-192 = "Opa, uma aventura! Parece divertido!#nEu também quero participar!"
22040-193 = "Aiai... Senpai, não esqueça da missão..."
22040-195 = "Novos membros para o grupo são sempre bem-vindos!"
22040-196 = "Porque quanto mais membros, maior a variedade de estratégias disponíveis!"
22040-198 = "Pan-paka-paaan!#nAsuna-senpai e Karin-senpai! Na próxima aventura, vocês serão nossas companheiras!"
22040-199 = "Ebaa! Entrei para o grupo~!"
22040-200 = "E-Eu também...?"
22040-201 = "Sim!"
22040-205 = "Entendi... conto com você, então."
22040-209 = "Bem... Aris, Sensei."
22040-210 = "Nós já vamos indo."
22040-211 = "[s] \"Certo, boa sorte na missão.\""
22040-212 = "Uhum, obrigada, Mestre! Vou dar o meu melhor~!"
22040-213 = "Eu já disse que isso é segredo...#nAh, agora já era mesmo."
22040-214 = "Ah, verdade, Aris.#nA Neru-senpai estava te procurando."
22040-216 = "Quê?! A-A Senhora Maid Baixinha estava procurando a Aris?!"
22040-217 = "Parece que ela queria falar alguma coisa com você..."
22040-218 = "Bom, manda um oi se encontrar com ela."
22040-219 = "Parece que a Senpai gostou mesmo de você, Aris."
22040-220 = "Ah, uuu..."
22040-222 = "Então, tchauzinho~"
22040-226 = "Ah, ei, garota de Gehenna!"
22040-233 = "Hã? Quem é...? Vocês querem alguma coisa com a gente?"
22040-234 = "Nós vamos nos transferir para Gehenna em breve..."
22040-235 = "E tem uma coisinha que a gente queria saber antes da transferência~!"
22040-236 = "...Hã? Quem é a líder atual do Pandemônio?"
22040-237 = "Ei, você sabe?"
22040-238 = "Ué, sei lá?#nNão é a Ibuki-chan?"
22040-239 = "Makoto?#nQuem é essa?"
22040-241 = "[ns] \"Essa missão... será que vai dar certo...?\""
22040-242 = "Sensei! Não temos tempo a perder!"
22040-243 = "A Neru-senpai pode aparecer a qualquer momento!#nVamos recuar por enquanto!"
22040-247 = "[ns] \"Ah, Aris! Espera!\""
22040-249 = "Próximo;~Aris e os Guiados~ (2)"
