[translation]
22040-1 = "Эпизод 4; Ведомые Алисой 1"
22040-10 = ""
22040-13 = "Мы с Алисой довольно долго продолжали идти вперёд."
22040-14 = ""
22040-21 = ""
22040-22 = ""
22040-23 = ""
22040-24 = ""
22040-25 = ""
22040-27 = ""
22040-28 = ""
22040-30 = "Раз, два, раз, два."
22040-32 = ""
22040-34 = ""
22040-35 = "О."
22040-36 = "[s] «Хм? Что-то не так, Алиса?»"
22040-38 = "Раз, два, раз, два."
22040-40 = "Сенсей, я слышу странный звук откуда-то."
22040-41 = "Раз, два, раз, два."
22040-42 = "[s] «Да, что это за звук?»"
22040-43 = "Этот звук, должно быть..."
22040-44 = "О...! Я только что поняла..."
22040-45 = "Это предзнаменование особого события, которое иногда происходит на территории школы Миллениума..."
22040-46 = "Это Случайная встреча Миллениума!"
22040-47 = "[s] «Ч-Что? Случайная встреча...? Предзнаменование...?»"
22040-48 = "Да, это полевое событие, которое я часто встречаю во время приключений."
22040-49 = "Никогда не знаешь, с чем столкнёшься, так что не теряйте бдительность, Сенсей!"
22040-51 = "Раз, два, раз, два."
22040-52 = "Раз, два, раз, два, раз, два."
22040-53 = "[ns] «Ч-Что это вообще за событие...?!»"
22040-55 = "Раз, два, раз, два!"
22040-56 = ""
22040-59 = "[ns] «В-Вот она...!»"
22040-61 = ""
22040-62 = "Хм? Не ожидала увидеть вас двоих здесь."
22040-63 = ""
22040-65 = ""
22040-66 = "Как дела? Отличный день для тренировки."
22040-67 = "[s] «С-Сумире...? П-Привет.»"
22040-68 = "Встреча с Сумире!"
22040-69 = "Сумире, ты как обычно в тренировочном приключении?"
22040-70 = "[s] «Тренировочном приключении...?»"
22040-71 = "Да, у меня появилось свободное время, поэтому я бегаю здесь."
22040-72 = "А ты, Алиса? Сегодня тоже занимаешься приключенческой тренировкой?"
22040-73 = "[s] «Теперь это приключенческая тренировка?»"
22040-74 = "Да, мы с Сенсеем в приключении героев-новичков!"
22040-75 = "Тренируетесь вместе с Тренером?"
22040-76 = "Молодцы. Вы очень стараетесь. Я вижу, что ты каждый день занимаешься приключенческими тренировками."
22040-77 = "Да. Я должна проходить приключения регулярно и изо всех сил. Если пропущу хотя бы день, уровень может снизиться."
22040-78 = "Момои говорит, пропуск ежедневных квестов — грех."
22040-79 = "Да. Упражнения и тренировки должны быть регулярными."
22040-80 = "Это полезно и Тренеру, которому стоит больше двигаться."
22040-81 = "[s] «Эм, вы часто встречаетесь?»"
22040-82 = "Да, Сумире — одна из главных фигур случайных событий Миллениума."
22040-83 = "Я часто сталкиваюсь с Алисой, когда тренируюсь на территории кампуса."
22040-84 = "Это уже стало привычкой."
22040-85 = "Сумире — участник моей группы в тренировочных приключениях!"
22040-86 = "Хи-хи, да. Как она сказала, Алиса — мой партнёр по тренировкам."
22040-87 = "[s1] «Мне всё любопытно... что это за приключение с упражнениями?»\n[s2] «Мне всё любопытно... что это за упражнение-приключение?»"
22040-88 = "Это разновидность приключения!"
22040-89 = "Сумире бегает по кампусу, повышая характеристики силы, ловкости и выносливости."
22040-91 = "Да, приятно укреплять тело во время тренировки."
22040-92 = "Она повышает основные характеристики, чтобы увеличить уровень. Каждый день бегает по кампусу, чтобы достичь желаемого уровня."
22040-93 = "Это великое геройское приключение!"
22040-94 = "Это просто моя ежедневная тренировка, Алиса. Ты слишком меня хвалишь."
22040-95 = "[s] «П-Понятно...»"
22040-96 = "Алиса тоже всегда в приключении."
22040-97 = "Ты говорила, что главная цель твоих приключений — укреплять тело и дух..."
22040-98 = "Да! Повышать ХП и ману через прокачку!"
22040-99 = "...А тренировками ты хочешь достичь высоты, которой раньше не могла коснуться."
22040-100 = "Да! Если повысить уровень, я смогу изучить новые навыки!"
22040-101 = "Да! Такой замечательный настрой сам по себе ценная тренировка!"
22040-102 = "Ты всегда трудолюбива и правильно настроена. Потрясающе, Алиса!"
22040-103 = "[s] «П-Правда?»"
22040-104 = ""
22040-105 = "[ns] «Этот разговор... немного запутанный...»"
22040-106 = "В любом случае, теперь, когда вижу, что ты занимаешься с Тренером..."
22040-107 = "Мне хочется стараться ещё сильнее, Алиса."
22040-109 = "Да! Мне тоже! Я буду отправляться в ещё больше приключений и встречать много событий, чтобы не отставать от тебя, Сумире!"
22040-110 = "Тогда начну с двадцатикилометровой пробежки!"
22040-111 = "А теперь прошу прощения, Алиса и Тренер!"
22040-112 = "[s] «О, эм, удачи.»"
22040-113 = "Раз! Два! Раз! Два!"
22040-114 = "Я тоже постараюсь!"
22040-115 = ""
22040-117 = ""
22040-118 = "Сенсей! Идём к следующему квесту!"
22040-119 = "[s] «О, хорошо...»"
22040-120 = ""
22040-122 = ""
22040-127 = "Я продолжил следовать за Алисой, и в итоге мы добрались до окраины Миллениума."
22040-128 = "[s3] «Не ожидал, что мы покинем кампус...»\n[s4] «Радиус твоих приключений шире, чем я думал...»"
22040-131 = "Да. В приключении не должно быть границ."
22040-132 = "Чем дальше отходишь от базы, тем больше новых событий, которых раньше не видел!"
22040-133 = "[s] «Событий, которых раньше не видел...»"
22040-134 = ""
22040-139 = ""
22040-140 = ""
22040-141 = "О! Мастер и Алиса!"
22040-142 = "Ура! Привет вам обоим!"
22040-143 = "[s] «Вот это действительно то, чего я раньше не видел!»"
22040-144 = "...Х-Хм? Сенсей? Что такое?"
22040-145 = "Ха-ха-ха! Да, расскажите, Сенсей!"
22040-146 = "[s] «Просто... вы одеты как-то необычно.»"
22040-148 = "Я раньше не видела на вас эту броню. Для чего она?"
22040-149 = "О! Кажется, я знаю! Вы сменили класс с горничной..."
22040-150 = "...на студента!"
22040-151 = "Ну... технически это просто обычная школьная форма."
22040-152 = "Я много знаю о студентах! Момои сказала, что девушки-студенты очень выносливые."
22040-153 = "Они даже достаточно храбрые и сильные, чтобы съесть целую ванночку мороженого перед сном."
22040-154 = "[s] «Мне кажется, это скорее вредная привычка...»"
22040-155 = "Ха-ха-ха! Алиса! Ты сообразительная!"
22040-156 = "Верно! Мы сменили профессию и выполняем секретный квест! Это форма для задания!"
22040-157 = "[s] «Секретный квест...?»"
22040-158 = "Да! Президент Рио сказала, что её беспокоит ситуация в Геенне в последнее время."
22040-159 = "Она попросила нас проникнуть туда и расследовать любые странности."
22040-160 = "Асуна, подожди..."
22040-161 = "Поэтому я ношу эту форму и ищу проходящих мимо студентов Геенны..."
22040-162 = "Чтобы поговорить с ними, когда увижу!"
22040-163 = "Потрясающе, Асуна. Ты тоже отправилась в приключение ради выполнения квеста."
22040-164 = "Ты такая же, как я!"
22040-166 = "Правда? Ура! Мы одинаковые, Алиса!"
22040-167 = "Погоди, Асуна. Акане сказала, это секретная операция..."
22040-168 = "О, точно!"
22040-169 = "Алиса и Мастер! Только никому не рассказывайте, что я сейчас сказала, ладно?"
22040-170 = "[s] «Я так и догадался...»"
22040-171 = "*вздох* Ну, надеюсь, всё будет нормально, раз это Сенсей и Алиса."
22040-173 = "Да! Я унесу ваш секрет в могилу! Я знаю, что за разглашение секретной информации можно навлечь на себя проклятие!"
22040-174 = "Ха-ха-ха! Вот именно, Алиса! Ты всегда такая увлечённая!"
22040-175 = "[s] «И всё же довольно непривычно видеть вас в школьной форме...»"
22040-176 = "Мы всё-таки студенты, Сенсей. Ничего странного в том, что мы носим форму."
22040-177 = "Как сказала Асуна, этот наряд — что-то вроде... брони для проникновения."
22040-178 = "Мне просто приказали принести обычную школьную форму... Так что..."
22040-179 = "Видите ли..."
22040-180 = "[s] «А, да... К-Конечно.»"
22040-181 = "..."
22040-182 = "...Ух."
22040-183 = "П-Пожалуйста, не смотрите на меня так, Сенсей."
22040-184 = "Это немного... смущает..."
22040-185 = "[s] «О! П-Прости! Это было невежливо с моей стороны!»"
22040-187 = "[ns] «Просто я не привык видеть тебя в форме... Н-Но она тебе очень идёт!»"
22040-188 = "Спасибо, Сенсей! А что вы двое здесь делаете?"
22040-189 = ""
22040-190 = ""
22040-191 = "Сенсей и я отправились в приключение."
22040-192 = "О-о-о! В приключение? Звучит весело! Я тоже хочу в приключение!"
22040-193 = "*вздох* Мы сейчас на задании, Асуна..."
22040-194 = ""
22040-195 = "Да! Я всегда рада новым членам группы!"
22040-196 = "Чем больше участников в группе, тем больше доступных стратегий и тактик!"
22040-197 = ""
22040-198 = "Пам-па-ка-пан! Асуна и Карин присоединились к группе! В следующий раз вы можете отправиться с нами в приключение!"
22040-199 = "Ух ты! Я вступила в группу!"
22040-200 = "Меня тоже записали?"
22040-201 = "Да!"
22040-202 = ""
22040-204 = ""
22040-205 = "...Ну, спасибо."
22040-206 = ""
22040-208 = ""
22040-209 = "В любом случае, нам некогда тут сидеть."
22040-210 = "Нам уже пора, Алиса. Сенсей."
22040-211 = "[s] «Хорошо, удачи вам на задании.»"
22040-212 = "Ура! Хорошо, Мастер! Спасибо!"
22040-213 = "Похоже, это уже не особо секретная операция."
22040-214 = "А, Алиса. Кажется, Неру тебя искала."
22040-216 = "А?! М-Маленькая горничная хочет меня видеть?"
22040-217 = "Полагаю, у неё к тебе дело."
22040-218 = "Пожалуйста, будь с ней повежливее, когда встретитесь."
22040-219 = "Думаю, ты ей очень нравишься."
22040-220 = "Х-Хорошо!"
22040-222 = "Пока-пока!"
22040-226 = "О, смотри! Вон студент Геенны!"
22040-227 = ""
22040-230 = ""
22040-231 = ""
22040-232 = ""
22040-233 = "А? Вы кто такие? Что вам от нас нужно?"
22040-234 = "Мы студенты, которые готовятся перевестись в Геенну."
22040-235 = "И перед переводом хотим кое-что спросить!"
22040-236 = "...А? Хотите знать, кто сейчас руководит Обществом Пандемониум?"
22040-237 = "Вы знаете?"
22040-238 = "Не знаю. Я думала, Ибуки."
22040-239 = "Макото? А это кто?"
22040-241 = "[ns] «Хм... это задание... вообще закончится хорошо...?»"
22040-242 = "Сенсей! У нас нет времени!"
22040-243 = "Неру может появиться в любой момент. Сейчас самое время отступать!"
22040-244 = ""
22040-246 = ""
22040-247 = "[ns] «Хорошо! Веди, Алиса!»"
22040-249 = "Следующий Эпизод: Ведомые Алисой 2"
