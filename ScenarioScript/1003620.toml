[translation]
1003620-1 = "Плед для пикника"
1003620-2 = "Я отправился в парк и, как всегда, обнаружил Хинату, ожидающую меня."
1003620-3 = "В одной руке она держала большую сумку, а другой махала мне."
1003620-4 = ""
1003620-6 = ""
1003620-7 = "Сенсей! Сюда! Я здесь!"
1003620-8 = "Погодите. Нет..."
1003620-9 = "Я сама к вам подойду! Стойте там!"
1003620-10 = ""
1003620-12 = ""
1003620-16 = ""
1003620-18 = "Спасибо, что пришли, Сенсей! Я вас ждала!"
1003620-19 = "[s1] «Прости, что опоздал.»\n[s2] «Надеюсь, я не заставил тебя долго ждать.»"
1003620-20 = "Что?"
1003620-21 = "Что?"
1003620-22 = "О нет! Я не это имела в виду! Я-Я просто... Я ждала всего несколько минут...!"
1003620-23 = "Ох, я совсем не то пыталась сказать. Простите..."
1003620-24 = "Мне не за что извиняться?"
1003620-25 = "Н-Но...! Эм, хахаха...!"
1003620-26 = "Что?"
1003620-27 = "Я выгляжу взволнованной? Н-Настолько заметно? Я правда стараюсь вести себя непринуждённо..."
1003620-28 = ""
1003620-30 = ""
1003620-31 = "Погодите, не так!"
1003620-32 = "То есть, если я так говорю, звучит будто я признаю, что действительно взволнована, но это... то есть..."
1003620-33 = ""
1003620-35 = ""
1003620-36 = "...Хаха?"
1003620-37 = "[s3] «Приятно видеть тебя счастливой.»\n[s4] «Разве плохо радоваться? Я вот точно рад.»"
1003620-38 = "Сенсей..."
1003620-39 = "Сенсей..."
1003620-40 = ""
1003620-42 = ""
1003620-43 = "Ах! Сегодня я совсем сама не своя."
1003620-44 = "Вы наверняка голодны. Я снова принесла упакованный обед, как в прошлый раз! Хотите поесть вместе?"
1003620-45 = ""
1003620-47 = ""
1003620-48 = "Можем расстелить плед прямо здесь... Мне только нужно достать обед из этой сумки..."
1003620-49 = ""
1003620-51 = ""
1003620-52 = ""
1003620-53 = "[ns5] «...Это и есть обед? Не слишком ли большой?»\n[ns6] «Эта штука больше энциклопедии...»"
1003620-54 = "Хи-хи-хи. Лучше слишком много, чем слишком мало!"
1003620-55 = "Хи-хи-хи. Лучше слишком много, чем слишком мало!"
1003620-56 = "Теперь можете не переживать, что возьмёте слишком много. Ешьте сколько хотите. Остальное доем я..."
1003620-57 = ""
1003620-59 = ""
1003620-60 = "...Ах."
1003620-61 = "Так прозвучало, будто я намекаю, что у вас огромный аппетит..."
1003620-62 = "В-В любом случае... Двигаемся дальше!"
1003620-63 = "Сенсей, налетайте!"
1003620-64 = ""
1003620-66 = ""
1003620-67 = ""
1003620-69 = "Мой шедевральный упакованный обед..."
1003620-70 = ""
1003620-72 = ""
1003620-73 = ""
1003620-74 = "А?"
1003620-75 = ""
1003620-77 = ""
1003620-78 = "...Мой... шедевральный... упакованный..."
1003620-79 = ""
1003620-81 = ""
1003620-82 = ""
1003620-83 = ""
1003620-84 = "...Книга?"
1003620-85 = "[s7] «Так это и правда энциклопедия!»\n[s8] «И всё равно она кажется слишком большой...»"
1003620-86 = "...А?"
1003620-87 = "...А?"
1003620-88 = "Что...? П-Почему здесь «Журнал учёта церковного имущества и прочего»..."
1003620-89 = ""
1003620-91 = ""
1003620-92 = "Не понимаю... Я точно... точно приготовила упакованный обед... и положила его...? Что...?"
1003620-93 = "Но... Но почему...?"
1003620-94 = "[s9] «У-Успокойся, Хината.»\n[s10] «Кто угодно мог перепутать книгу с упакованным обедом. Со мной такое постоянно.»"
1003620-95 = "Н-Но... обед..."
1003620-96 = "Н-Но... обед..."
1003620-97 = "В-Вы ведь, наверное, ещё даже не ели, Сенсей... А я доставила вам столько неудобств из-за такой нелепой ошибки..."
1003620-98 = "..."
1003620-99 = "Мне так жаль..."
1003620-100 = ""
1003620-103 = "[ns11] Поднять «Журнал учёта церковного имущества и прочего».\n[ns12] «Эта книга и правда такая тяжёлая, какой выглядит... Можно взглянуть?»"
1003620-106 = ""
1003620-108 = ""
1003620-110 = "О, эм... Ну..."
1003620-111 = "Конечно можно, но в ней нет ничего интересного."
1003620-112 = "Как и следует из названия, это журнал учёта имущества и припасов собора. Я использую его для контроля запасов..."
1003620-113 = ""
1003620-117 = "...Сенсей...? Вы выглядите... очень увлечённым..."
1003620-118 = "...Что? Вас впечатляет, насколько всё подробно и организованно? О..."
1003620-119 = "Н-Ну конечно... Учитывая размеры собора, здесь столько всего нужно учитывать."
1003620-120 = "Тысячи... Нет, десятки тысяч вещей..."
1003620-121 = "Я бы ни за что не смогла запомнить всё это... Поэтому решила, что так мне будет проще ничего не упустить."
1003620-122 = "В отличие от остальных, я немного рассеянная. Если не буду делать такие вещи, обязательно что-нибудь забуду и всё испорчу."
1003620-123 = "Ха-ха-ха..."
1003620-124 = "[s13] «Угу. Угу. Ты очень скрупулёзный человек, Хината.»\n[s14] «Теперь я понимаю. Эта книга — само воплощение скрупулёзности.»"
1003620-125 = ""
1003620-126 = ""
1003620-128 = ""
1003620-129 = ""
1003620-130 = "Простите, что? Вы только что назвали меня скрупулёзной? Меня?"
1003620-131 = "Да ни за что! Я даже перепутала книгу с коробкой для обеда!"
1003620-132 = "То есть... скрупулёзная? Кажется, я вообще никогда раньше не слышала этого слова! А теперь... То, что вы держите, как раз доказывает, что я полная противоположность скрупулёзности!"
1003620-133 = ""
1003620-135 = ""
1003620-136 = "...Простите? Вы именно это и имели в виду...?"
1003620-137 = "...Что, простите?"
1003620-138 = "[s15] «Скрупулёзность — это умение быть подготовленным.»\n[s16] «Дело не в памяти, а в твоём подходе.»"
1003620-139 = ""
1003620-140 = ""
1003620-142 = ""
1003620-143 = "Сенсей..."
1003620-144 = ""
1003620-147 = "...Сенсей? Что вы достаёте...?"
1003620-148 = "Ах!"
1003620-149 = ""
1003620-151 = ""
1003620-152 = "...Коробка с обедом?!"
1003620-153 = "Сенсей? Вы тоже приготовили обед с собой?"
1003620-154 = "[s17] «Ну... это тоже своего рода предусмотрительность.»\n[s18] «Я хотел, чтобы мы вместе поели кое-что особенное.»"
1003620-157 = "..."
1003620-158 = "В таком случае... Какое облегчение... *вздох*"
1003620-159 = "Я правда думала, что сегодня всё испортила. Спасибо, Сенсей, что подстраховали меня."
1003620-160 = "...Хаха."
1003620-161 = "Спасибо!"
1003620-163 = "Мы поделились обедом, пока я просматривал журнал."
1003620-164 = "Он оказался огромным и был полон интересных записей и заметок. Мы отлично провели время, обсуждая их."
1003620-165 = ""
1003620-168 = "После приятного времяпрепровождения я проводил Хинату."
