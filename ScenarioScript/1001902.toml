[translation]
1001902-1 = "Адаптация"
1001902-2 = "Улицы Тринити"
1001902-3 = "Следуя координатам, я оказался на оживлённых улицах возле Тринити."
1001902-4 = "..."
1001902-5 = "Вот ты где, Сенсей."
1001902-6 = "Почему ты так на меня смотришь? Потому что мы встретились в таком людном месте?"
1001902-7 = "Ты ожидал встретиться где-нибудь более уединённо? Тебе стоит знать, что в Тринити таких мест не существует."
1001902-8 = "Рядом с этим кампусом тебя в любой момент могут прослушивать, преследовать или наблюдать за тобой. Настоящее змеиное гнездо."
1001902-9 = "[s1] «Змеиное гнездо?»\n[s2] «Это немного жёстко.»"
1001902-10 = "Ты слишком беспечен, Сенсей."
1001902-11 = "Ты слишком беспечен, Сенсей."
1001902-12 = "Суть в том, что лучше действовать открыто, когда вокруг много людей. Никто ничего не заподозрит."
1001902-13 = "Как говорится, прячься у всех на виду."
1001902-14 = "Видишь? Никто ведь на нас не смотрит, правда?"
1001902-15 = ""
1001902-16 = "О? Это та милая новенькая!"
1001902-17 = "Но что это за взрослый рядом с ней?"
1001902-18 = "Может, это тот самый учитель, о котором все говорят...?"
1001902-19 = "..."
1001902-20 = "..."
1001902-21 = "[s3] «Ты всё-таки сильно выделяешься.»\n[s4] «Я сам всегда бросаюсь в глаза...»"
1001902-22 = "Я просто забыла взять маскировку для нас. Надо было хотя бы немного попытаться слиться с толпой..."
1001902-23 = "Я просто забыла взять маскировку для нас. Надо было хотя бы немного попытаться слиться с толпой..."
1001902-24 = "Но это же бессмыслица! На нас нет даже ярких цветов, из-за которых мы могли бы выделяться!"
1001902-25 = "Почему студенты этой академии не могут заниматься своими делами?!"
1001902-26 = "[s] «Не обязательно кричать на меня...»"
1001902-27 = "И-Иди сюда!"
1001902-29 = "Здесь должно быть нормально."
1001902-30 = "Отсюда нет удобных позиций для снайперов, и мы достаточно далеко, чтобы избежать прослушки и слежки."
1001902-31 = "Если мы хоть на секунду потеряем бдительность, то..."
1001902-32 = "[s] «Смотри! Там кто-то в маскхалате шпионит за нами!»"
1001902-33 = ""
1001902-35 = ""
1001902-36 = ""
1001902-37 = "*щелчок*"
1001902-39 = "*пах* *пах* *пах* *пах* *тат*!"
1001902-41 = ""
1001902-43 = ""
1001902-44 = "..."
1001902-45 = "[s] «...»"
1001902-46 = "Эм..."
1001902-47 = "Это просто куст зашелестел на ветру, Сенсей."
1001902-48 = "[s] «Знаю. Я просто пошутил.»"
1001902-49 = "..."
1001902-51 = "Я поняла, к чему ты клонишь, Сенсей."
1001902-52 = "Ты считаешь, что я слишком напряжена."
1001902-53 = "Но, пожалуйста, воздержись от подобных шуток. Ты можешь пострадать."
1001902-54 = "[s] «Виноват.»"
1001902-55 = "Я просто не могу заставить себя доверять этому месту."
1001902-56 = "Это странное место, полное странных людей со странным образом жизни... Я невольно остаюсь настороже."
1001902-57 = "На самом деле мне кажется, что студенты здесь слишком расслаблены."
1001902-58 = "Мы все живём лишь один раз, так почему они так легкомысленно растрачивают жизнь? Они настолько глупы? По крайней мере, мне так кажется."
1001902-59 = "Я знаю, что порой кажусь слишком радикальной... Это я хотя бы понимаю."
1001902-60 = "Поэтому я хотела бы попросить тебя о помощи."
1001902-61 = "Собственно, именно поэтому я сегодня тебя и позвала."
1001902-62 = "[s] «Чем я могу помочь?»"
1001902-63 = "А пока..."
1001902-64 = "...пока что я лишь хочу приспособиться к жизни здесь."
1001902-65 = "Я всё ещё почти ничего не знаю об этом месте."
1001902-66 = "[s5] «Похоже, тебе нужен экскурсовод по Тринити.»\n[s6] «Разве одноклассница не подошла бы лучше?»"
1001902-67 = "Мне не нужна другой студент! Мне нужен взгляд постороннего человека."
1001902-68 = "Мне не нужна другой студент! Мне нужен взгляд постороннего человека."
1001902-69 = "Остальные студенты Тринити уже привыкли к этому месту. От них не будет пользы."
1001902-70 = "Привычка создаёт слепые зоны, а если не замечать слепые зоны, это приводит к..."
1001902-71 = "...разрушению. Так бывает всегда."
1001902-72 = "Но ты..."
1001902-73 = "[s7] «Я помогу тебе. Обещаю.»\n[s8] «Тогда наша особая экскурсия начнётся завтра.»"
1001902-74 = "Хорошо."
1001902-75 = "Хорошо."
1001902-76 = "Я скоро снова с тобой свяжусь."
1001902-77 = "А, и пока мы общаемся, обращайся ко мне по кодовому имени: Пингвин."
1001902-78 = "Твоё кодовое имя — Утка."
1001902-79 = "[s] «Почему Утка и Пингвин?»"
1001902-80 = "Не ищи в них особого смысла! Иначе это были бы плохие кодовые имена!"
1001902-81 = "Просто... жди, пока я с тобой свяжусь."
1001902-82 = ""
1001902-83 = "До новой встречи."
