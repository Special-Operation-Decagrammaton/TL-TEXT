[translation]
31050-1 = "Episódio 5;As Alunas do Clube de Aulas de Reforço (2)"
31050-4 = "...Entendo, compreendi a situação. Então o Sensei será o responsável pelo Clube de Aulas de Reforço."
31050-5 = "...É uma pena. Se possível, eu gostaria de ter ajudado."
31050-6 = "[s] \"Posso levar essas duas comigo?\""
31050-7 = "Hã!? É claro que não! De jeito nenhum, elas são criminosas perigosas!!"
31050-8 = "Koharu. O Sensei veio até aqui como representante da Schale, atendendo a um pedido da Tea Party."
31050-9 = "Pelas regras, não há problema algum. Afinal, ele será o conselheiro e responsável pelo Clube de Aulas de Reforço."
31050-10 = "E-Eh... Bom, se a senpai está dizendo..."
31050-11 = "H-Humpf! Bem feito pra elas! Assim eu não preciso mais ficar perto dessas criminosas, e além do mais, Clube de Aulas de Reforço?! Que vergonha!"
31050-12 = "Ahaha! Não é ótimo? Uma combinação de delinquente com pervertida! E ainda por cima com o título de \"idiotas\", se fosse comigo, eu morreria de vergonha só de estar junto!"
31050-13 = "...Fuu, Koharu..."
31050-15 = "Au..."
31050-16 = "[s] \"E quanto ao restante...\""
31050-17 = "...Sim. Bem, é muito difícil dizer isso, mas..."
31050-18 = "A última integrante é... a Shimoe Koharu-san."
31050-19 = "..."
31050-20 = "...Quê, eu!?"
31050-26 = "Shi"
31050-28 = "moe"
31050-32 = "Ko"
31050-34 = "ha"
31050-36 = "ru"
31050-38 = "Aluna do 1º ano do Clube de Aulas de Reforço, Shimoe Koharu."
31050-39 = "Já tirou notas vermelhas três vezes seguidas e está à beira de repetir de ano."
31050-40 = "Observação: Não poderá retornar ao Comitê de Justiça até que suas notas melhorem."
31050-44 = "Então, todas que estão reunidas aqui são as integrantes do Clube de Aulas de Reforço?"
31050-45 = "(Fiuuu, fiuuu...)"
31050-46 = "..."
31050-49 = "S-Sim... hum, com isso conseguimos reunir todo mundo, né. O Clube de Aulas de Reforço..."
31050-50 = "M-Mas é a partir de agora que o verdadeiro problema começa..."
31050-51 = "Fufu, o que devemos fazer agora, presidente Ajitani?"
31050-52 = "Reunidas depois da aula em uma sala vazia, colegiais malcomportadas e um adulto... Fufu, parece que algo está prestes a começar."
31050-53 = "Começar...? Bom, por mim tanto faz. A propósito, se eu levar a sério, consigo manter um cerco e resistir trancada nesta sala por um mês."
31050-54 = "Quero morrer... Eu quero muito morrer..."
31050-56 = "H-Hum..."
31050-57 = "Sensei... bem, contamos com você..."
31050-58 = "[s] \"...Sim, vou dar o meu melhor.\""
31050-59 = "Muito obrigada... Eu também vou me esforçar o máximo que puder..."
31050-61 = "Próximo;Vamos nos apresentar!"
