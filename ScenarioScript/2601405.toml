[translation]
2601405-1 = "Воспоминания о дороге в школу"
2601405-2 = "О, Сенсей."
2601405-3 = "Я подумала, что было бы приятно пройтись с вами по дороге в школу. Спасибо, что пришли."
2601405-4 = "[s1] «Ты идёшь... в школу?»\n[s2] «В выходной?»"
2601405-7 = "Да, боюсь."
2601405-8 = "Я знаю, со стороны странно идти в школу в выходной..."
2601405-9 = "Но дело в том, что с тех пор, как я вступила в C&C, у меня ни разу не было обычного школьного дня."
2601405-10 = "Меня постоянно вызывают на задания, а даже если и удаётся остаться, я обычно иду в обход, чтобы не раскрывать свой маршрут."
2601405-11 = "[s] «Всё-таки ты работаешь под прикрытием в образе горничной...»"
2601405-12 = "Я не жалуюсь на такую жизнь, но сейчас на мне школьная форма."
2601405-13 = "Вот я и решила воспользоваться редкой возможностью и просто пройтись до школы."
2601405-14 = "Я подумала, так выходной станет немного особенным."
2601405-15 = "[s] «Конечно! Сделай то, чего обычно не можешь.»"
2601405-16 = "Мм..."
2601405-17 = "Раз уж я об этом заговорила... вы правда хотите пойти со мной, Сенсей?"
2601405-18 = "Для меня это особый случай, но для вас это всего лишь прогулка."
2601405-19 = "[s3] «Конечно, я хочу пойти с тобой.»\n[s4] «Для тебя эта прогулка много значит. Я тоже хочу это прочувствовать.»"
2601405-22 = "М-м, раз вы так говорите..."
2601405-23 = "Хорошо. Если выйдем сейчас, до звонка останется ещё уйма времени. Точнее, осталось бы."
2601405-24 = "[s] «Ты прямо образцовый студент из учебника.»"
2601405-25 = "Сейчас я просто студент, а не горничная и не агент."
2601405-26 = "Ученики приходят вовремя."
2601405-27 = "Идёмте, сюда."
2601405-29 = "Нам нужно подождать здесь и перейти после того, как проедет поезд."
2601405-30 = "Красный свет должен смениться через..."
2601405-31 = "Хм-м, хм, хм-м..."
2601405-33 = ""
2601405-34 = "Хорошо, переходим, Сенсей."
2601405-35 = "[s] «Что это сейчас было?»"
2601405-36 = "А. Н-ничего. Просто напевала..."
2601405-37 = "Это старая привычка. Однажды шлагбаум поднялся точно в такт моему напеву, и почему-то это осталось у меня в памяти."
2601405-38 = "Бесполезная информация, я знаю, но вот почему-то запомнилось."
2601405-39 = "[s] «В смысле? Это вовсе не бесполезно, это интересно.»"
2601405-40 = "М-мм, правда?"
2601405-41 = "Что ж, рада это слышать..."
2601405-43 = "Давайте пройдём через этот парк. Так короче."
2601405-44 = "[s] «Кажется, здесь довольно запутанные дорожки...»"
2601405-45 = "Да, вы правы."
2601405-46 = "Здесь действительно можно заблудиться. Тропинки все извилистые, а указатели старые."
2601405-47 = "Фуфу, но посмотрите туда."
2601405-48 = "Видите птичье гнездо между теми ветками наверху?"
2601405-49 = "Идите от него прямо, а потом выходите в сторону цветочного поля. Это и есть короткий путь."
2601405-50 = "[s] «Из тебя вышел бы хороший проводник по дикой местности, Карин.»"
2601405-51 = "Ну, я научилась на собственных ошибках, пару раз заблудившись."
2601405-52 = "Кстати, вы первый человек, которому я об этом рассказала."
2601405-53 = "Незачем рассказывать об этом кому-то ещё. Ничего интересного."
2601405-55 = "Дальше нужно просто спуститься по этой лестнице."
2601405-56 = "...Обычно к этому моменту мне уже приходилось спешить оставшуюся часть пути."
2601405-57 = "Съезжая по перилам..."
2601405-58 = "[s] «Ты съезжала по ЭТИМ перилам? Они же довольно крутые.»"
2601405-59 = "Да, но они идут до самого низа, так что, если удерживать равновесие, можно сэкономить время."
2601405-60 = "...Конечно, я делала так не каждый раз. Только когда сильно спешила."
2601405-61 = "[s] «Мне даже захотелось на это посмотреть.»"
2601405-62 = "В-вы хотите посмотреть, как я съезжаю по перилам? И какой в этом смысл?"
2601405-63 = "Сегодня мы не опаздываем, так что нет, я просто спущусь как нормальный человек."
2601405-65 = "И вот мы с Карин добрались до школы..."
2601405-67 = "М-м, мы пришли."
2601405-68 = "...Пришли, но..."
2601405-69 = "[s] «Что случилось?»"
2601405-70 = "...Это совсем не ощущается чем-то особенным."
2601405-71 = "Мне хотелось свежих впечатлений от обычной дороги в школу, но теперь, когда мы здесь, всё кажется... таким обыденным."
2601405-72 = "М-мм, похоже, я снова не сумела провести выходной со смыслом."
2601405-73 = "Простите, Сенсей. Я зря протащила вас весь этот путь."
2601405-74 = "[s] «А я так не считаю.»"
2601405-75 = "Ох, теперь вы просто пытаетесь меня утешить..."
2601405-76 = "...Что? Нет?"
2601405-77 = "...Вам понравилось, что я рассказала вам свои секреты?"
2601405-78 = "Какие ещё «секреты»?"
2601405-79 = "[s] «Во время этой прогулки я многое о тебе узнал.»"
2601405-80 = "Про поезд, тропинки и те перила?"
2601405-81 = "...Но это же просто незначительная ерунда."
2601405-82 = "Ничего особенного, об этом даже задумываться не стоит..."
2601405-83 = "[s] «Но это были секреты, которые знала только ты.»"
2601405-84 = "Секреты, которые знала только я...?"
2601405-85 = "М-м, ну, пожалуй. Они были настолько пустяковыми, что я никому о них не рассказывала."
2601405-86 = "[s5] «А теперь их знают только двое.»\n[s6] «Ты и я.»"
2601405-89 = "Только вы и я..."
2601405-90 = "[s] «Значит, наша прогулка всё-таки была особенной.»"
2601405-91 = "Вот как..."
2601405-92 = "...Кажется, я начинаю понимать."
2601405-93 = "И то, что вы были рядом, действительно сделало эту прогулку особенной."
2601405-94 = "Спасибо, Сенсей."
2601405-95 = "[s] «В следующий раз тоже зови меня. Мне понравилось.»"
2601405-96 = "В следующий раз..."
2601405-97 = "Что ж, он может наступить довольно скоро."
2601405-98 = "[s] «Довольно скоро?»"
2601405-99 = "Ну а что нам теперь делать, раз мы уже пришли, а школа закрыта?"
2601405-100 = ""
2601405-102 = ""
2601405-103 = "Идти всю дорогу обратно."
