[translation]
13380-90 = "#videons2;11007"
13380-1 = "Эпизод 38;Обещание"
13380-4 = "Юмэ...?"
13380-7 = "Угу! Я ведь не смогу увидеть, как ты взрослеешь..."
13380-8 = "Так что не могла не гадать, какой будет моя очаровательная Хошино на третьем курсе!"
13380-9 = "Вот почему я здесь! Та-дам! Будто отправляю письмо Хошино из будущего."
13380-12 = "...Юмэ."
13380-13 = ""
13380-19 = "Как ты, Хошино? Стала хорошей старшей?"
13380-20 = "Выросла в надёжную старшекурсницу, которая заботится о младших? Ту, что способна всех защитить?"
13380-21 = "У тебя появились дорогие друзья, которые поддерживают тебя, когда нужна помощь?"
13380-22 = "Ты уверенно бежишь в будущее вместе со своими младшими?"
13380-23 = "И иногда всё ещё смеёшься вот этим «хех»?"
13380-24 = ""
13380-27 = "ЮМЭ!!"
13380-28 = "Юмэ!! Юмэ...!!"
13380-29 = "Юмэ, я... Я... всегда, всегда..."
13380-30 = "Юмэ... Я... Юмэ... Я..."
13380-31 = "Юмэ... Юмэ... Я..."
13380-32 = "У... Уа-а-а!!"
13380-33 = "УА-А-А-А-А!!!"
13380-34 = "Нет, нет... Я..."
13380-35 = "Я выросла в старшую, которая, похоже, умеет только заставлять младших переживать и всем создавать проблемы..."
13380-36 = "Я... бесполезная... идиотка... дурочка..."
13380-37 = "Для всех я... просто глупая старшекурсница... за которой самой нужно присматривать."
13380-39 = "Эм... Звучит точь-в-точь как я, разве нет?"
13380-40 = "Да... Прямо как ты."
13380-41 = "Хи-хи. Вот и твоя улыбка, Хошино."
13380-42 = "Что бы ты ни говорила, я знаю иначе."
13380-43 = "Я знаю, что ты стала замечательным человеком... тем, кто защищает окружающих и поддерживает их. Тем, на кого они все могут положиться."
13380-44 = "Я глупенькая и многого не знаю, но свою вспыльчивую младшую, которой дорожу всем сердцем, я знаю лучше кого бы то ни было."
13380-45 = "Нет. Я—"
13380-46 = "Тс-с."
13380-47 = "Хм?"
13380-48 = "Не говори так. Ты всегда так старалась, Хошино. Конечно, ты хорошая старшая."
13380-49 = "..."
13380-50 = "Ты ведь старалась изо всех сил, правда, Хошино?"
13380-51 = "Тебе было очень-очень тяжело, да? Ты так храбро несла всё одна."
13380-52 = "...Ага."
13380-53 = "...Я так... старалась... Всегда хотела... помочь..."
13380-54 = "Я всегда... Я старалась изо всех сил, Юмэ..."
13380-55 = "Мне было так, так тяжело, Юмэ. Тебя не было, но я всё равно продолжала стараться..."
13380-56 = ""
13380-58 = ""
13380-60 = ""
13380-64 = "Да. Ты старалась. Ты большая молодец, Хошино. Гладь-гладь."
13380-65 = "..."
13380-66 = "О? Ты не будешь жаловаться, что не можешь дышать? Всё хорошо? Наконец-то принимаешь мои объятия?"
13380-67 = "Юмэ..."
13380-68 = "Я скучаю по тебе."
13380-69 = "Я ужасно по тебе скучаю."
13380-73 = "Угу. Я знаю, Хошино."
13380-74 = "Но у тебя ведь ещё есть дела?"
13380-75 = "Дела... которые нужно сделать..."
13380-76 = "Угу."
13380-78 = "Теперь у тебя есть замечательные младшие. Те, кого тебе нужно защищать."
13380-84 = "Хошино"
