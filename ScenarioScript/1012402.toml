[translation]
1012402-1 = "Девушке нужно время"
1012402-2 = "...Вот такая ситуация."
1012402-3 = ""
1012402-5 = ""
1012402-6 = ""
1012402-7 = "Просматривая расписание Хасуми... я заметил, что она не запланировала себе ни единого перерыва."
1012402-8 = "[ns1] «Ого... Эм, дел и правда навалом.»\n[ns2] «Ты пытаешься их наказать?»"
1012402-11 = "Нет. Разумеется, нет."
1012402-12 = "Это расписание для всего клуба. У каждого участника своя колонка."
1012402-13 = "При внимательном рассмотрении оказалось, что в забитом до отказа расписании действительно указаны имена всех участников."
1012402-14 = "Когда они не на дежурстве, участники смогут распоряжаться временем как захотят."
1012402-15 = "Мне бы не хотелось, чтобы они упустили столь редкую возможность побывать на пляже."
1012402-16 = "Я хотела как-нибудь вознаградить всех. Они всегда усердно работают и никогда не жалуются."
1012402-17 = "[s3] «Но, Хасуми...»\n[s4] «Почему ты записана на каждое мероприятие?»"
1012402-20 = "Я вице-президент."
1012402-21 = "Это лишь формальность, поэтому, пожалуйста, не делайте такое лицо."
1012402-22 = "На самом деле, поскольку мне не придётся заниматься патрулированием и бумагами, нагрузка будет даже меньше обычной."
1012402-23 = "...Да?"
1012402-24 = "Мне тоже следует выделить немного свободного времени?"
1012402-25 = "Хи-хи. Мне уже достаточно того, что вы обо мне подумали."
1012402-26 = "[s5] «Но всё равно возьми купальник, на всякий случай!»\n[s6] «А вдруг в расписании чудом появится свободное время?»"
1012402-29 = "...Сенсей."
1012402-30 = "[s7] «Как ни крути, работать ты всё равно будешь на пляже!»\n[s8] «Что ты будешь делать, если форма промокнет?!»"
1012402-33 = "*вздыхает*"
1012402-34 = "Вы ведь пришли, чтобы заставить меня сделать перерыв и отдохнуть, верно?"
1012402-35 = "[s9] «Это настолько очевидно?!»\n[s10] «(Она... читает мои мысли...?!)»"
1012402-38 = "Ваши намерения в отношении студентов всегда очень легко понять."
1012402-39 = ""
1012402-41 = ""
1012402-42 = ""
1012402-43 = "Ах, я вовсе не хотела критиковать! На самом деле я очень это ценю."
1012402-44 = "Только недавно я осознала, что, похоже, не слишком искусна в так называемой «заботе о себе»."
1012402-45 = "[s] «(Удивительно, насколько она самокритична...)»"
1012402-46 = "Вы ПРАВЫ: работать в мокрой форме было бы довольно неудобно..."
1012402-47 = "Поняла."
1012402-48 = "[s] «То есть...?»"
1012402-49 = ""
1012402-51 = "Да. Вы стараетесь проявить ко мне заботу, поэтому и мне следует ответить тем же."
1012402-52 = "В конце концов, это один из редких случаев, когда мы можем немного забыть о формальностях."
1012402-53 = "Однако в вопросе расписания я уступать не стану."
1012402-54 = "Если я уклонюсь от обязанностей, кому-то другому придётся взять их на себя. Такова природа моей должности."
1012402-55 = "Вы ведь не хотите, чтобы я подавала такой дурной пример, правда, Сенсей?"
1012402-56 = "[s11] «Конечно нет! Я уважаю твоё чувство долга.»\n[s12] «Но важнее другое: у тебя есть купальник?»"
1012402-59 = "Ах. Кажется, у меня был только один, и теперь он мне уже не подходит."
1012402-60 = "Только не поймите неправильно! Я не набрала вес! По крайней мере, не слишком много..."
1012402-61 = "Просто за последний год я немного... выросла."
1012402-62 = "[s13] «Что ж, хороший повод пройтись по магазинам.» \n[s14] «Давай купим тебе новый купальник!»"
1012402-65 = "Не могу."
1012402-66 = "[s] «А, извини! Наверняка у тебя полно дел. Может, завтра?»"
1012402-67 = "Завтра тоже не могу."
1012402-68 = "[s] «Эм... Хасуми?»"
1012402-69 = "Одна неделя..."
1012402-70 = ""
1012402-72 = ""
1012402-73 = "Через неделю мои приготовления будут завершены! Я не потерплю неудачи!"
1012402-74 = "[s15] «Ситуация правда требует такой реакции...?»\n[s16] «Мы же просто идём за купальником...»"
1012402-77 = "Да. Требует. Это крайне серьёзное дело."
1012402-78 = "Тогда увидимся через неделю."
1012402-79 = "Мне пора идти и начинать подготовку."
1012402-80 = ""
1012402-82 = ""
1012402-84 = "Уходя, Хасуми выглядела на удивление решительно."
