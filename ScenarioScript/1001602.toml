[translation]
1001602-1 = "Дедлайн приближается, Сенсей"
1001602-2 = "Департамент Разработки Игр Милленниума"
1001602-3 = "(Мне позвонила Мидори, и я отправился в Отдел разработки игр.)"
1001602-4 = "Когда я пришёл в клубную комнату, то увидел Мидори, которая сосредоточенно сидела посреди комнаты со скетчбуком."
1001602-5 = "Что ж..."
1001602-6 = "[ns] «Мидори?»"
1001602-7 = ""
1001602-8 = "Хм, не то."
1001602-9 = "[s] «Эм, привет...?»"
1001602-10 = ""
1001602-11 = "Хммм. И это тоже не подходит..."
1001602-12 = "[s] «Ты меня слышишь?»"
1001602-13 = ""
1001602-14 = "Хммм... Ни один вариант не годится."
1001602-15 = "[s] «Похоже, Мидори меня не слышит.»"
1001602-16 = "О, Сенсей! К-когда вы пришли?!"
1001602-17 = "[s] «Ты сказала, что хотела о чём-то поговорить. Что случилось?»"
1001602-18 = "А, точно. Совет. Я писала вам об этом."
1001602-19 = "..."
1001602-20 = "Вааа, Сенсей! Я-я в беде!"
1001602-21 = "[s] «В беде?»"
1001602-22 = "Дедлайн уже совсем близко, а я ничего не могу придумать!"
1001602-24 = "[ns] «Ну что, теперь тебе полегче?»"
1001602-25 = "Да, мне стыдно за то, как я себя повела. Простите."
1001602-26 = "Я мучаюсь с этим уже несколько дней..."
1001602-27 = "[s] «Так что ты хотела обсудить?»"
1001602-28 = "Знаете... в Отделе разработки игр..."
1001602-29 = "Мы не знаем, когда и как нам доведётся делать новую игру."
1001602-30 = "Поэтому я перебираю самые разные идеи."
1001602-31 = "Срок следующей конференции быстро приближается, и я пыталась придумать к ней что-нибудь новое..."
1001602-32 = "[s] «И за всю ночь ты так ничего и не придумала?»"
1001602-33 = "Да. Дедлайн уже на носу, а у меня ничего..."
1001602-34 = "[s] «Если тебе настолько тяжело, может, попросить перенести дедлайн?»"
1001602-35 = "Перенести дедлайн?"
1001602-36 = ""
1001602-37 = "Сенсей, дедлайн — это как обещание. Разве не будет безответственно просить перенести его лишь потому, что я не успеваю?"
1001602-38 = "Как иллюстратор и человек, отвечающий за всю графику игр в Отделе разработки игр, я не позволю себе такого!"
1001602-39 = "[s1] «Ты очень строга к себе.»\n[s2] «Я впечатлён твоим чувством ответственности, Мидори!»"
1001602-40 = "Э-эм, я и не заметила, как разошлась."
1001602-41 = "Э-эм, я и не заметила, как разошлась."
1001602-42 = "В любом случае — нет. Дедлайн переносить нельзя. Ни за что."
1001602-43 = "Вот почему я написала вам, Сенсей. Мне нужен был ваш совет."
1001602-44 = "Может, вам что-нибудь придёт в голову?"
1001602-45 = "[s] «Во что ты обычно играешь?»"
1001602-46 = "В основном в головоломки и казуальные игры вроде Tetness и Poyoyopo."
1001602-47 = "[s3] «Тогда как насчёт игры из жанра, в который ты никогда не играла?»\n[s4] «Может, это подкинет тебе идею!»"
1001602-48 = "О, то есть сменить угол зрения... Вы хотите сказать, что игры из непривычных жанров могут стимулировать мышление."
1001602-49 = "О, то есть сменить угол зрения... Вы хотите сказать, что игры из непривычных жанров могут стимулировать мышление."
1001602-50 = "Хм!"
1001602-51 = "Думаю, это хорошая идея!"
1001602-52 = "В таком случае..."
1001602-53 = "Можете пройти этот процесс вместе со мной?"
1001602-55 = ""
1001602-56 = ""
1001602-57 = ""
1001602-58 = ""
1001602-59 = ""
1001602-60 = ""
1001602-61 = ""
1001602-63 = ""
1001602-64 = "Так Мидори достала соревновательную игру, в которую раньше никогда не играла."
1001602-66 = "Тогда я ещё не представлял..."
1001602-67 = "...какую катастрофу принесёт этот выбор."
1001602-70 = "Ах! Опять я никуда не могу пройти, потому что путь перекрыт бомбами!"
1001602-71 = "Угх! Ещё раз! Давайте сыграем снова, Сенсей!"
1001602-73 = "Что?! Почему я только что умерла?!"
1001602-74 = "Я сама поставила эту бомбу! Почему я умерла?!"
1001602-75 = "Нет, ещё рано, Сенсей! Всё ещё не закончено!"
1001602-77 = ""
1001602-78 = "[ns] «Мидори, уже пора...»"
1001602-79 = "Вы только что выиграли этот раунд, Сенсей!"
1001602-80 = "Надеюсь, вы не из тех грубых взрослых, которые уходят после одной победы!"
1001602-81 = "[s] «Да я не поэтому...»"
1001602-82 = "Пока не закончено — не закончено!"
1001602-83 = "Игра закончится только тогда, когда я сдамся!"
1001602-84 = "Приготовьтесь, Сенсей. Вы не уйдёте, пока я не выиграю."
1001602-86 = "Отвлёкшись от мозгового штурма, мы с Мидори играли всю ночь."
