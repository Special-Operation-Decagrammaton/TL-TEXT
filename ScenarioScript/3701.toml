[translation]
3701-1 = "Suspicious Fortune-Telling"
3701-4 = "Haaaaaah……."
3701-8 = "That’s a big sigh. Is something the matter?"
3701-9 = "I’m sorry…… It was all my fault……."
3701-10 = "Hiss!! Why do you always say such random things!"
3701-11 = "……It’s not like you seniors did anything, so don’t worry about it."
3701-12 = "Even so, I cannot overlook a sigh from a cute underclassman."
3701-13 = "If you have any troubles, will you let me hear them?"
3701-16 = "……It’s just, lately I’ve been having such bad luck, like one bad thing after another."
3701-17 = "My shoe sole came off, the strap on my favorite bag snapped……."
3701-18 = "My hand mirror shattered, and I face-planted into a spider web……."
3701-21 = "Argh, geez! Saying it out loud just makes me even more annoyed!"
3701-22 = "Hmm…… That does sound like an ominous omen."
3701-23 = "Right? It’s just a really bad feeling."
3701-24 = "At this rate, I feel like I’m going to get dragged into something even worse……."
3701-25 = "Of course, I don’t believe in the occult or anything, but isn’t it creepy?"
3701-28 = "Perhaps…… it’s the work of an evil spirit……."
3701-29 = "Caw! Cawww……!"
3701-30 = "Eek!? Is that crow inside again!?"
3701-31 = "It must have sensed the presence of an evil spirit and came to warn us……."
3701-32 = "No way! Absolutely not!"
3701-33 = "But it is true that bad things keep happening, right?"
3701-34 = "I will perform a reading so that Rena-chan can avoid this misfortune!"
3701-35 = "No, I don’t believe in fortune-telling either. I’ll just take the sentiment."
3701-36 = "Don’t say that. Why not try it just for fun?#nIt shouldn’t hurt to try."
3701-40 = "Well, if you all say so……."
3701-45 = "You're turning off the lights!?"
3701-49 = "Nyufufu…… O one guided by the Arcana, I shall now divine your fate."
3701-50 = "Fate is something you carve out yourself. There is no need to fear the results."
3701-51 = "Surrender yourself to your subconscious and flip over three cards."
3701-52 = "Fine."
3701-58 = "W-well……? Does it look like something good will happen?"
3701-59 = "This is……."
3701-60 = "I cannot say this is a good fortune by any stretch of the imagination……."
3701-61 = "Is it that bad!?"
3701-62 = "It is, shall we say, too terrifying for me to put into words……."
3701-63 = "For Eri to say that much, it really must be bad."
3701-64 = "Then what am I supposed to do!?"
3701-65 = "Nyufufu. Rest assured, there is still a way."
3701-66 = "Now, draw three more cards.#nThey will show you a new path to wash away your anxiety!"
3701-67 = "Uuuu……!!"
3701-68 = "Fine, I get it! I'll draw them, okay!"
3701-72 = "Okay! What does it say this time?"
3701-73 = "Ho…… This is."
3701-74 = "Hmm, hmm……?"
3701-75 = "Don't keep me in suspense, just tell me already!"
3701-76 = "……I have seen countless combinations before, but this is the first time I have seen a result like this."
3701-77 = "I shall tell you.#nTo escape this misfortune, what Rena-chan must do is――"
3701-81 = "――is to \"imitate a cat.\""
3701-85 = "……Huh?"
3701-86 = "According to the cards, if you \"imitate a cat at midnight on a moonless night,\" the misfortune will vanish, and#ngood luck will come your way…… apparently."
3701-87 = "Midnight…… You want me to do that inside the dorm?"
3701-88 = "Heh…… This is going to be fun."
3701-89 = "Oh my."
3701-92 = "……."
3701-93 = "U, uuu…… uuu……!"
3701-94 = "There's no way I'm doing that!? Especially not in front of you seniors! I'm absolutely not doing it!"
3701-95 = "Hiss!! You were just teasing me after all! I feel like an idiot for even having a shred of hope!"
3701-96 = "This conversation is over! Dismissed!!"
3701-101 = "Fufu, what a shame. I thought I would get to see Rena-chan's cute side."
3701-102 = "Caw! Cawww……!"
3701-103 = "This one seems to think so too……."
3701-104 = "Nyufu, I believe."
3701-105 = "That our feelings have reached Rena-chan!"
3701-107 = "Time passes――"
3701-113 = "Midnight, on a moonless night."
3701-117 = "Is everyone…… asleep?"
3701-120 = "……."
3701-121 = "……They're asleep, right?"
3701-122 = "If you're awake, just tell me honestly. I won't be mad if you say so now."
3701-126 = "……."
3701-127 = "(Okay, everyone is asleep.)"
3701-128 = "(Sigh…… imitating a cat in the middle of the night……)"
3701-129 = "(But, well? Just in case. Just for peace of mind.)"
3701-130 = "(I've had such bad luck lately, I'd take help from anyone, even a cat.)"
3701-131 = "(Alright…… here goes――!)"
3701-134 = "Me, meow. Meowww……."
3701-135 = "Mya, mya-mya……."
3701-136 = "……."
3701-137 = "(I-it's so embarrassing after all!!)"
3701-138 = "Mya?"
3701-141 = "(Hm? Was there a cat outside the window just now……?)"
3701-142 = "M, mya-ow?"
3701-143 = "Mya, mya-mya-ow."
3701-144 = "(Wait, what!? Am I actually having a conversation!?)"
3701-145 = "Meow! Meow!"
3701-146 = "HIIIIISSSSSS!!"
3701-147 = "(Meow!? It sounds like it's in a bad mood!?)"
3701-148 = "NYAAAAAOOOORR!!"
3701-149 = "O-okay, I get it! I said I was sorry! I'm sorry!! I'm apologizing, so please calm down!!"
3701-150 = "Myaaaa……."
3701-153 = "(Sigh…… what am I doing with my life……)"
3701-154 = "(What if this counts as a failure and things get even worse?)"
3701-157 = "(I'm starting to get worried…… should I do a little more……?)"
3701-159 = "After that, Rena continued to imitate a cat in a small voice."
3701-162 = "(Fufu, she's so cute after all.)"
3701-163 = "(Do your best, Rena-chan!)"
3701-164 = "(I'm rooting for you……)"
3701-168 = "The next afternoon――"
3701-171 = "Sigh……."
3701-172 = "……I'm tired."
3701-173 = "Because of what I was doing last night……."
3701-174 = "Imitating a cat in the middle of the night…… ugh, I'm never doing that again."
3701-180 = "Rena-chan, hello."
3701-181 = "Huh? Oh, yeah!"
3701-182 = "Are you on your way home from school?"
3701-183 = "What a coincidence…… As expected of roommates! It is our destiny to call out to each other!"
3701-184 = "No, a coincidence is just a coincidence."
3701-185 = "Nyufufu. So, how was your day today?#nDid anything bad happen?"
3701-186 = "Nothing in particular, but……."
3701-187 = "(……Hm? Nothing happened…… could it be thanks to that thing yesterday?)"
3701-190 = "(No, that can't be it. A coincidence is just a coincidence.)"
3701-191 = "(If Eri-senpai's fortune-telling was right, something good should have happened, but nothing did.)"
3701-192 = "Judging by your expression, it seems nothing happened, which is good!"
3701-193 = "Now, let's head back to the dorm! Everyone is waiting for you."
3701-194 = "Why?"
3701-195 = "Nyufufu. You'll see when you get there."
3701-202 = "Welcome…… I've been waiting……."
3701-203 = "I'll prepare some music to soothe your heart."
3701-210 = "Uh, what's with everyone?"
3701-213 = "Sniff sniff…… It smells like something delicious too……."
3701-214 = "Here, have this…… It should take away your fatigue."
3701-215 = "A drink……? It looks suspicious just by looking at it……."
3701-216 = "Special grape-ade…… drink it and your head will feel clear…… Heh……."
3701-217 = "Hm……? Is there something in it?"
3701-220 = "Hiss!? What is this, it looks like an eyeball!?"
3701-221 = "Lychee and blueberry…… just a little bit of playfulness."
3701-222 = "Here, have a cookie too. We all made them with love."
3701-223 = "Pumpkin cookies?"
3701-224 = "Fufu, aren't they cute?"
3701-225 = "I think they're cute, but…… is today some kind of anniversary?#nDid I forget something?"
3701-226 = "It's fine, it's just a normal day.#nWe just thought we'd all like to have some tea!"
3701-227 = "How is it? Don't you feel happy feelings bubbling up?"
3701-228 = "Come on, come on, don't you feel like something \"good\" happened!?"
3701-231 = "……."
3701-232 = "……Yeah. I guess so."
3701-233 = "I tried putting all sorts of things in the cookies……."
3701-234 = "All delicious things, of course…… Hehehe."
3701-235 = "What flavor they are is a surprise."
3701-236 = "Come on, come on, everyone sit down!"
3701-237 = "Hmm, which one should I pick~?"
3701-246 = "The tea party proceeded in a friendly atmosphere."
3701-248 = "(Geez, they do things like this, so I can't help but like them.)"
3701-249 = "Without knowing what would happen after this――"
3701-252 = "Eeeeeek……!!"
3701-253 = "I knew I shouldn't have followed you! I should have just stayed in the dorm and slept!!"
3701-254 = "It's over…… everything is over……!!"
3701-255 = "There is no need to be afraid! Because now we have proven the existence of the occult!"
3701-262 = "Our adventure starts here!"
3701-263 = "But I didn't ask for an adventure like this……!"
3701-264 = "Because you didn't tell me! That \"liminal spaces\" actually exist!!"
3701-265 = "Let me out! Let me out of hereeee!!"
3701-268 = "Suspicious Fortune-Telling"
