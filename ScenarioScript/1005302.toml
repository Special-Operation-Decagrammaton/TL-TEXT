[translation]
1005302-1 = "Утренняя пробежка"
1005302-2 = "Парковая дорожка, утро"
1005302-3 = "Во время ранней утренней прогулки я встретил Юку."
1005302-4 = ""
1005302-8 = ""
1005302-9 = "[ns] «Привет, Юука.»"
1005302-10 = "Сенсей?"
1005302-11 = "Не ожидала увидеть тебя так рано утром."
1005302-12 = "[s1] «Я просто вышел прогуляться.»\n[s2] «А ты, Юука?»"
1005302-13 = "О, ну..."
1005302-14 = "О, ну..."
1005302-15 = "Как видишь по моей одежде, я решила начать день с лёгкой тренировки."
1005302-16 = "Скоро мы будем проводить Фестиваль Хало Кивотоса."
1005302-17 = "Конечно, я работаю в исполнительном комитете, поэтому вряд ли буду участвовать во многих соревнованиях..."
1005302-18 = "Но как представитель комитета, организующего Фестиваль Хало Кивотоса, я должна поддерживать форму и не ударить в грязь лицом во время фестиваля."
1005302-19 = "К тому же, говорят, регулярные тренировки повышают работоспособность."
1005302-20 = "Так что, учитывая всё это, утренние пробежки — естественный вывод."
1005302-21 = "...И ещё мне кажется, что я стала мягче обычного."
1005302-22 = "[s] «Ты и так прекрасно выглядишь.»"
1005302-23 = "Д-Даже если ты так говоришь...!"
1005302-24 = "К-Кхм... В любом случае, какое-то время я буду тренироваться регулярно!"
1005302-25 = "Начну с пятикилометрового спринта."
1005302-26 = "[s] «Не слишком ли амбициозно?»"
1005302-27 = "Хе-хе. Не переживай."
1005302-28 = "Может, я и не самая быстрая, но в своей выносливости уверена."
1005302-29 = "Пробежать пять километров — пустяк!"
1005302-30 = "[s] «Тогда я побегу с тобой.»"
1005302-31 = "Что? Прямо рядом со мной?"
1005302-32 = "Я не против... но уверен, что сможешь не отстать?"
1005302-33 = "Если отстанешь, ждать я не буду."
1005302-34 = "[s] «Хотя бы посмотри на меня, прежде чем бросать позади...»"
1005302-35 = "Шучу."
1005302-36 = "Может, начнём с лёгкого бега?"
1005302-38 = "Мы с Юкой побежали."
1005302-39 = ""
1005302-43 = "...Десять минут спустя."
1005302-45 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
1005302-46 = ""
1005302-48 = ""
1005302-49 = "С-Сенсей... *тяжело дышит* Подожди... *тяжело дышит* минутку..."
1005302-50 = "[s3] «...Запыхалась?»\n[s4] «...Уже устала?»"
1005302-51 = "Н-Ничуть... *тяжело дышит* Это же... *тяжело дышит* всего 10 минут..."
1005302-52 = "Н-Ничуть... *тяжело дышит* Это же... *тяжело дышит* всего 10 минут..."
1005302-53 = "Это... *тяжело дышит* всего лишь... *тяжело дышит* разминка... Я не могу... *тяжело дышит* уже... *тяжело дышит* устать..."
1005302-54 = ""
1005302-56 = ""
1005302-57 = "...Хотя устала."
1005302-58 = "[s] «Давай отдохнём.»"
1005302-61 = "― *тяжело дышит* *тяжело дышит* ...Не могу поверить, что[wa:2470]"
1005302-62 = "― всего за несколько месяцев я так потеряла форму...[wa:2360]"
1005302-65 = "― Чтобы не опозориться на Фестивале Хало Кивотоса...[wa:10]"
1005302-66 = "― мне придётся удвоить усилия на тренировках.[wa:2290]"
1005302-69 = "― О, Сенсей. Ты тоже хочешь воды?[wa:1280]"
1005302-72 = "― Конечно, держи...[wa:560]"
1005302-75 = "― С-Стой, Сенсей![wa:1250]"
1005302-76 = "― Я-я хочу сказать, эм, может, сейчас... не лучшее время пить воду?[wa:1270]"
1005302-79 = "― (Если Сенсей попьёт из бутылки,[wa:220]"
1005302-80 = "― из которой пила я... Э-Это будет косвенный поц—)[wa:5360]"
1005302-83 = "― (Нет-нет! Неважно, какие обстоятельства...[wa:500]"
1005302-84 = "― Такую бесстыдность нельзя, абсолютно нельзя допускать!)[wa:1600]"
1005302-87 = "― (...Но всё же, если это Сенсей...)[wa:2080]"
1005302-90 = "― ...Один глоток... Можно только один, хорошо?[wa:1000]"
1005302-93 = ""
1005302-94 = "Ах... Ничто так не освежает после пробежки, как вода."
1005302-95 = "Но честно... Я знала, что немного запустила себя, но не ожидала, что даже за тобой, Сенсей, не смогу угнаться... Я потрясена."
1005302-96 = "Мне нужно вернуть форму до Фестиваля Хало Кивотоса..."
1005302-97 = "[s5] «Не стоит так перегружаться без подготовки.»\n[s6] «Почему бы для начала не ограничиться лёгкими пробежками?»"
1005302-98 = "...В этом есть смысл. Это не так эффективно, как бег, но регулярные лёгкие пробежки всё равно повысят мою выносливость."
1005302-99 = "...В этом есть смысл. Это не так эффективно, как бег, но регулярные лёгкие пробежки всё равно повысят мою выносливость."
1005302-100 = "Но можешь не сомневаться: до самого фестиваля я буду бегать каждое утро без исключений."
1005302-101 = ""
1005302-103 = ""
1005302-104 = ""
1005302-105 = "Тогда в этот раз чуть медленнее... побежишь со мной снова?"
1005302-107 = "После неспешной пробежки с Юкой я вернулся в Шале."
