[translation]
10045030-1 = "Эпизод 3;Раунд 2: Безумство на реактивных катерах"
10045030-2 = ""
10045030-3 = "Кикё? Ты всё ещё расстроена?"
10045030-4 = "Может, вкусная закуска поднимет тебе настроение."
10045030-5 = "...Я ценю твоё беспокойство, но не нужно."
10045030-6 = "Позже съем куриные шашлычки."
10045030-7 = "Хм, а кто сказал, что я предлагала?"
10045030-8 = ""
10045030-10 = ""
10045030-11 = ""
10045030-12 = "Ням."
10045030-14 = "Я прекрасно понимаю, что ты просто пытаешься меня уговорить..."
10045030-15 = "...*вздох* Ладно. Я съем один."
10045030-16 = "Полагаю, нужно восстановить силы."
10045030-17 = "(...Иначе как я переживу этот проклятый катер?)"
10045030-18 = "Ура. Держи."
10045030-19 = "Фуфу. Куриные шашлычки действительно восхитительны!"
10045030-20 = "Пока едим, почему бы не сходить посмотреть на катера?"
10045030-25 = "Это он?"
10045030-26 = ""
