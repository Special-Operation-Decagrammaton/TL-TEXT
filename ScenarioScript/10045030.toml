10045030-30 = "[ns1] «Поздравляю с прохождением первого раунда.»\n[ns2] «Вы все пришли на предварительный осмотр?»"
10045030-33 = "Вы совершенно уверены, что это безопасно, Сенсей?"
10045030-34 = "Если кто-то упадёт, его сразу спасут?"
10045030-35 = "[s3] «Да. Спасательная команда будет прямо на месте.»\n[s4] «Мы подготовились ко всем возможным сценариям!»"
10045030-38 = "...Рада это слышать."
10045030-39 = "(Никто не узнает, что я не умею плавать... каким-нибудь образом...)"
10045030-41 = "А чего спрашиваешь? Думаешь, упадёшь?"
10045030-42 = "Ч-Что за нелепость?"
10045030-43 = "Ты ведь не забыла, что я наш оперативный офицер. Я обязана должным образом оценить ситуацию и возможные исходы."
10045030-44 = "В следующий матч прошли враги, которые специально целились в нас, разве нет?"
10045030-45 = "Они могли придумать сколько угодно подлых уловок."
10045030-46 = "[s5] «Фуфу, об этом не переживай.»\n[s6] «Им будет не до кого-то ещё.»"
10045030-49 = "...Перевожу: они будут слишком заняты собственным выживанием."
10045030-50 = "А! Если опасность настолько велика, мне пришла блестящая идея!"
10045030-51 = "Мы все сцепимся руками и изо всех сил ухватимся за поручень!"
10045030-52 = "Мне нравится! Так и сделаем!"
10045030-53 = "Находиться так близко друг к другу, будучи лишь в купальниках... Полагаю, это будет самой эффективной стратегией."
10045030-55 = "Мы с Рэнгэ прикроем правую и левую стороны."
10045030-56 = "А Юкари и Кикё будут в центре."
10045030-58 = "Звучит отлично! Великая сила правой руки Нагусы выйдет на сцену!"
10045030-59 = "...Пожалуйста, прекрати. Я испытываю тяжёлый приступ испанского стыда."
10045030-60 = "Я не против, если это заставляет всех улыбаться."
10045030-61 = "Фуфу. Моя истинная сила, некогда запечатанная в тенях мира духов, теперь высвобождена!"
10045030-62 = "...Я уже всерьёз начинаю переживать за душевное состояние вас обеих."
10045030-64 = "В любом случае, теперь мы готовы! Так что вперёд — к победе!"
10045030-66 = "Немного позже..."
10045030-69 = "Спасибо за терпение! Долгожданный второй раунд вот-вот начнётся!"
10045030-70 = ""
