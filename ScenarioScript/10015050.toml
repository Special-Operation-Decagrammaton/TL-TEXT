[translation]
10015050-1 = "Эпизод 5;Антифестивальная группа"
10015050-2 = ""
10015050-3 = ""
10015050-4 = "ВОТ ЭТО они собирались использовать на спортивном фестивале?"
10015050-5 = "П-похоже... Это скорее танк, чем... фестивальная штука..."
10015050-6 = "Какие же зловещие планы они строили с этим чудовищем?!"
10015050-7 = "Может, собирались использовать его вместо мяча..."
10015050-8 = "Эту громоздкую стальную глыбу? Ты колёса вообще видишь?!"
10015050-9 = "О! Может, он должен был гоняться за спортсменками во время забегов, чтобы те не сбавляли темп?"
10015050-10 = "Страх быть раздавленной этим роботом-танком наверняка заставил бы их выступать лучше. Какие же они беспощадные."
10015050-11 = "Хмф. Я уже даже не удивлена."
10015050-12 = "Они распинаются про укрепление тела, дружбу между академиями и прочую глупость. И ради чего?!"
10015050-13 = "Уверена, этот боевой робот — просто очередное их орудие пыток."
10015050-15 = "Фестиваль Хало в Кивотосе нужно остановить любой ценой!"
10015050-16 = ""
10015050-20 = "Мне послышалось, вы говорили о фестивале?"
10015050-21 = "Ик!"
10015050-22 = "Президент Клуба спортивной подготовки? Давно вы здесь?!"
10015050-23 = "Прошу прощения. Я не хотела подкрадываться."
10015050-24 = "Я просто проходила мимо и услышала, как вы упомянули Фестиваль Хало!"
10015050-25 = "Раз вы в такой час стоите в коридоре и обсуждаете фестиваль..."
10015050-26 = "Наверняка вы так же страстно и радостно ждёте завтрашнего дня, как и я!"
10015050-28 = "Эм..."
10015050-29 = "Мы не в восторге от фестиваля, но..."
10015050-30 = "Ха-ха! Не стесняйтесь! Я понимаю. Я тоже сегодня глаз не сомкну от одного только предвкушения!"
10015050-31 = "Завтрашний спортивный праздник — возможность для каждого студента превзойти собственные пределы через физическую активность!"
10015050-32 = "Это такое чудесное, мирное событие, призванное объединить всех! И подумать только, в этом году честь принимать его выпала «Миллениуму»."
10015050-33 = "Совершенно естественно, что вы не можете сдержать восторг! Я вот точно не могу!"
10015050-35 = ""
10015050-36 = "(Эта девчонка... Она ведёт целый разговор сама с собой.)"
10015050-37 = "(Вот поэтому с этими спортивными типами так раздражающе общаться.)"
10015050-39 = "Так в каких дисциплинах вы участвуете?"
10015050-40 = "Простите, что подслушала, но вы упомянули катание мяча?"
10015050-41 = "Э... Эм... Да! Именно! Соревнование по катанию мяча или что-то такое."
10015050-42 = "Мы просто в последний раз обсуждали стратегию..."
10015050-43 = "Стратегию катания мяча?"
10015050-44 = "О-ой. Это странно?"
10015050-45 = "Нисколько! Мне нравится ваш настрой!"
10015050-46 = ""
10015050-48 = ""
10015050-49 = "То, что правила простые, вовсе не значит, что катать мяч легко!"
10015050-50 = ""
10015050-53 = ""
10015050-55 = "Здесь мало просто толкать мяч. Нужна сила корпуса и верхней части тела, чтобы держать его устойчиво. Надеюсь, вы тренировали ловкость, иначе на середине дистанции будет трудно изменить направление мяча."
10015050-56 = ""
10015050-57 = "На дорожке бывают неровности, так что обязательно наденьте обувь, в которой легко менять направление. А значит, конечно же, нужна сильная и устойчивая нижняя часть тела!"
10015050-58 = ""
10015050-60 = ""
10015050-61 = ""
10015050-62 = ""
10015050-63 = ""
10015050-64 = ""
10015050-65 = ""
10015050-67 = ""
10015050-68 = "Эм... Да..."
10015050-69 = "Как нам отсюда сбежать...?"
10015050-70 = ""
10015050-75 = "Президент Сумирэ! Не спускайте глаз с тех студентов!"
10015050-76 = "Что? «Веритас»? Сенсей? И..."
10015050-78 = ""
10015050-80 = ""
10015050-81 = ""
10015050-82 = ""
10015050-83 = ""
10015050-85 = "Мейстеры Инженерного отдела? Что... что на вас надето?"
10015050-86 = "Уф... Вот это..."
10015050-87 = "Ситуация была экстренная, и у нас не было времени переодеться!"
10015050-88 = ""
10015050-90 = ""
10015050-91 = ""
10015050-92 = "Но если вам интересно про одежду, Хибики уже давно изучает шитьё ради своего увлечения косплеем, и—"
10015050-93 = "Без обид, Котори, но сейчас нет времени на длинные объяснения."
10015050-94 = "Вон те студенты..."
10015050-95 = "Они украли нашего робота-болельщика!"
10015050-96 = "О-они воры? А не спортсменки?"
10015050-98 = "Робот-болельщик...?"
10015050-99 = "Болельщик...?"
10015050-100 = "[s1] «Почему они так удивлены?!» \n[s2] «Подождите... Они не преступницы?»"
10015050-103 = "Мы не крали никакого робота-болельщика! Мы просто... эм..."
10015050-104 = "Да, мы ничего не крали! Мы только взорвали бомбу и пытались взломать сервер, и всё!"
10015050-105 = "О! О... То есть..."
10015050-107 = "Хи-хи! Спасибо за информацию, вы сильно упростили нам жизнь."
10015050-108 = "Я не знаю, зачем вы пытаетесь сорвать Фестиваль Хало, но на этом ваши планы заканчиваются."
10015050-109 = "Этот фестиваль очень дорог многим людям. В нём заключены мечты и надежды студентов."
10015050-110 = "Ваш эгоизм причинил боль и «Семинару», и студентам «Миллениума»!"
10015050-111 = "Но если вы вернёте робота, я могу сделать вид, что ничего не было."
10015050-112 = "А если вам придут в голову какие-нибудь творческие идеи, могу гарантировать: одна печально известная своей беспощадностью казначей не из тех, кто подставляет вторую щёку."
10015050-113 = "Я не могу и не буду гарантировать вашу безопасность."
10015050-115 = "Беспощадная казначей «Семинара»... В-вы про Юку?"
10015050-116 = "Про неё? Я слышала слухи..."
10015050-117 = "Однажды Юука так разозлилась из-за дурацкого изобретения одного студента, что одним щелчком пальцев лишила его всего исследовательского бюджета."
10015050-118 = "Лишиться финансирования исследований... для студента «Миллениума» хуже смерти. «Семинар» и правда беспощаден до мозга костей."
10015050-120 = "Меня так просто не запугаешь! Антифестивальная группа не склонится перед вашими угрозами!"
10015050-121 = "[s] «Антифестивальная группа...?»"
10015050-122 = "Да! Мы состоим в Антифестивальной группе."
10015050-123 = "Сокращённо — АФГ!"
10015050-124 = "Если вы думаете, что каждый студент «Миллениума» прыгает от радости из-за вашего тупого фестиваля, то вы ещё сильнее оторваны от реальности, чем я думала!"
10015050-125 = "П-против спортивного фестиваля? Не могу... Я не поверю!"
10015050-126 = "Н-ну, нам действительно неловко из-за того, сколько сил многие студенты вложили в подготовку..."
10015050-127 = "Но мы работаем ради более великой цели! Наша миссия зовёт нас!"
10015050-129 = "Это всё замечательно, но мы хотим вернуть нашего робота-болельщика."
10015050-130 = "Советую отдать его по-хорошему. Терпение у меня не бесконечное."
10015050-132 = "Мы не крали вашего дурацкого робота-болельщика!"
10015050-133 = "Уф, как обычно! Они нас вообще не слушают!"
10015050-134 = "Если слова на вас не действуют, разберусь силой! Посмотрим, как вы справитесь с танком, который я украла у Инженерного отдела!"
10015050-135 = ""
10015050-137 = ""
10015050-139 = "Выходи, Крушитель трассы!"
10015050-140 = ""
10015050-145 = "[ns] «Ч-что это?!»"
10015050-146 = "Танк? Это уже немного выходит за ожидаемые параметры миссии."
10015050-147 = "Ха-ха-ха! Да ладно! Это потрясающе! Что это вообще такое?"
10015050-148 = "Эй-эй! Это вы, инженерные задроты, сделали этого шарообразного робота? С цветами можно было поработать, но какой дизайн!"
10015050-149 = "Ух ты. Работает как часы."
10015050-151 = "«Крушитель трассы»? Серьёзно? Это всё, что вы придумали?"
10015050-152 = "Если бы вы его не украли, мы бы дали роботу-болельщику куда более удачное имя."
10015050-153 = "Прости, что говорю это, но Утаха немного чудачка, когда дело доходит до названий."
10015050-154 = "Давайте лучше оставим «Крушителя трассы». Мне страшно представить, что придумает Утаха."
10015050-155 = "Ну... Раз продукт мы всё-таки поставили, полагаю, название не так уж важно."
10015050-156 = "Алло? Инженерный отдел?"
10015050-157 = ""
10015050-159 = ""
10015050-160 = ""
10015050-161 = "Не то чтобы по чертежу я совсем не ожидала чего-то подобного, но..."
10015050-163 = "Я просила робота-болельщика или танк? Хм?"
10015050-164 = "Н-Н-Ну..."
10015050-165 = "Вы просили робота-болельщика, и мы его сделали. Если позволите, я этим экземпляром довольно горжусь."
10015050-166 = "...Неисправимые."
10015050-167 = ""
10015050-169 = ""
10015050-172 = "Броня? Эта нелепая броня?"
10015050-173 = "Эта супер-пупер прочная броня? Вы сами просили сделать его настолько крепким, чтобы он выдержал взрыв!"
10015050-174 = "Эти термообработанные пластины выдержат что угодно! Почти! Наверное! Мы не успели нормально испытать!"
10015050-175 = ""
10015050-177 = ""
10015050-178 = ""
10015050-181 = "А гусеницы?"
10015050-182 = "Ну... вы ведь сказали, что он должен передвигаться по любой местности, верно?"
10015050-183 = "Для «Крушителя трассы» нет слишком крутого склона!"
10015050-184 = ""
10015050-186 = ""
10015050-187 = ""
10015050-190 = "Это всё хорошо... наверное. Но теперь объясните мне пятнадцатимиллиметровый пулемёт. Пожалуйста."
10015050-191 = "Ну, Фестиваль Хало задуман как мирное объединяющее соревнование, но в тенях всегда прячутся хулиганы."
10015050-192 = "Мы подумали, что боевой режим поможет справиться с любыми врагами, если станет совсем плохо."
10015050-193 = "Знаешь..."
10015050-194 = "[s] «...Они меня убедили!»"
10015050-195 = "Кхм. Прошу прощения, их новаторские идеи на мгновение лишили меня дара речи."
10015050-196 = ""
10015050-203 = "Сейчас не время восхищаться безумием Утахи! Сделайте что-нибудь с этим танком!"
10015050-204 = "Прости, Чихиро. Ты права, вопросы подождут."
10015050-205 = "Сенсей, прошу. Ведите нас в бой!"
