[translation]
2002903-1 = "Летняя читательница мыслей"
2002903-4 = "Номер в отеле"
2002903-5 = "Впервые за долгое время я очень хорошо выспался."
2002903-6 = "К моему удивлению, было ещё не так поздно."
2002903-7 = "[ns] «*зевок*... Чем бы мне теперь заняться...?»"
2002903-10 = ""
2002903-14 = "Я открыл дверь, собираясь выйти из номера, и увидел знакомое лицо."
2002903-15 = "Коридор отеля"
2002903-16 = "О, Сенсей."
2002903-17 = "Хи-хи. Доброе утро!"
2002903-18 = "Вы сейчас идёте на пляж?"
2002903-19 = "[s1] «Хм... Я ещё не решил, но...»\n[s2] «Что же я собирался делать...»"
2002903-22 = "А, понятно. Хм... Хорошо. Я могу помочь."
2002903-23 = "[s] «Что?!»"
2002903-24 = "Может, я избавлю вас от сомнений... угадав, о чём вы думаете, Сенсей?"
2002903-25 = "[s] «О! Твоя техника чтения мыслей!»"
2002903-26 = "Немного неловко, когда вы произносите это с таким энтузиазмом..."
2002903-27 = ""
2002903-29 = ""
2002903-31 = "[ns3] «Но в этот раз будет непросто.»\n[ns4] «После пробуждения мысли у меня немного туманные.»\n[ns5] «Я и сам не знаю, чего хочу!»"
2002903-35 = "Ах, понимаю. Особенно на отдыхе так бывает непросто."
2002903-36 = "Но даже в такие моменты я уверена, что вы думаете о множестве вещей."
2002903-37 = "Итак, посмотрим, Сенсей... Вы только что проснулись и немного бесцельно вышли наружу."
2002903-38 = "Вы всё ещё довольно сонный, но как самочувствие? Терпимо?"
2002903-39 = "[s] «А...?»"
2002903-40 = "Вы всё ещё вялый и особо ничего не хотите делать, верно?"
2002903-41 = "Но несмотря на это, хотите стряхнуть сонную дымку и начать день!"
2002903-42 = "Хе-хе. Ну как?"
2002903-43 = "[s6] «Ты знаешь мои мысли лучше меня самого!»\n[s7] «Сдаюсь. Признаю поражение.»"
2002903-46 = "Ура! В этом раунде я победила, Сенсей!"
2002903-47 = "А победителю полагается награда. Прошу провести остаток дня со мной."
2002903-48 = "[s] «...Это правда так работает?»"
2002903-50 = ""
2002903-56 = ""
2002903-57 = "Выпейте, пожалуйста, Сенсей. Это лимонад."
2002903-58 = "В нём много витаминов, он поможет вам проснуться!"
2002903-59 = "О нет! У вас в уголке рта кусочек лимона. Секунду, я уберу."
2002903-60 = ""
2002903-62 = ""
2002903-64 = ""
2002903-65 = ""
2002903-66 = "Ну вот... готово. Как вам?"
2002903-67 = "[s8] «Это именно тот напиток, который мне был нужен, но...»\n[s9] «Но ты правда именно этим хотела заняться, Мимори?»"
2002903-70 = "Хм? Не похоже на победу, если я вам прислуживаю?"
2002903-71 = "Хи-хи. Я не смогла придумать ничего, что доставило бы мне больше удовольствия."
2002903-72 = "[s10] «Мне интересно... Как ты прочитала мои мысли?»\n[s11] «Как ты узнала, что я чувствую? Это твои способности?»"
2002903-75 = "Ох... Вы об этом?"
2002903-76 = "..."
2002903-77 = "Хи-хи. Сенсей, у меня правда нет никаких сверхспособностей."
2002903-78 = "Ваши волосы были растрёпаны, поэтому я поняла, что вы только что проснулись."
2002903-79 = "Когда я спросила, идёте ли вы на пляж, вы сами не были уверены."
2002903-80 = "К тому же... было очевидно, что вы ещё не умылись, так что вывод напрашивался сам собой."
2002903-81 = ""
2002903-84 = "[ns12] «Ты хорошо умеешь делать выводы...»\n[ns13] «Это больше похоже на дедукцию, чем на чтение мыслей.»"
2002903-87 = "Хи-хи. Дедукция? Если честно, между чтением мыслей и умением делать выводы есть сходство."
2002903-88 = "Настолько большое, что их почти можно назвать близнецами..."
2002903-89 = "А? Значит, вы говорите... что тут должно быть нечто большее, чем просто обоснованная догадка?"
2002903-90 = "К-Конечно нет! Сенсей, иногда ваши шутки заходят слишком далеко!"
2002903-91 = "Ну-ну! Идите умывайтесь, пора начинать день."
2002903-92 = "Мы проделали такой путь. Было бы жаль потратить весь день впустую!"
2002903-94 = "Я умылся, и мы вместе отправились на пляж. Но Мимори всё ещё выглядела так, будто что-то скрывает..."
