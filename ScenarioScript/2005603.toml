[translation]
2005603-1 = "Совсем как дома"
2005603-2 = "Был примерно обед, когда, как и договаривались, в офисе раздался звонок в дверь."
2005603-3 = ""
2005603-6 = "[ns1] «Входи, открыто.»\n[ns2] Открыть дверь."
2005603-10 = "Привет-привет! Сенсей! Куросаки Коюки к вашим услугам!!"
2005603-11 = "Сегодня я буду вашим способным помощником, так что просто оставьте всё мне!"
2005603-12 = "...Но если попросите взломать СЛИШКОМ много паролей, я начну брать плату! Нихахаха!"
2005603-13 = "[s3] «Это всё хорошо, но... почему ты так одета?»\n[s4] «Разве это не... твоя пижама?»"
2005603-16 = "А? ...А-а, одежда?"
2005603-17 = "Я ведь не должна была приходить сюда в форме или типа того, да?!"
2005603-18 = "А, не должна? Нихахаха! Не пугайте меня так, Сенсей! Я уже подумала, что успела вляпаться ещё до начала!"
2005603-19 = "Я надела её просто потому, что она намного удобнее школьной формы!"
2005603-20 = "Ведь лучше всего работается, когда тебе максимально удобно, правда?"
2005603-21 = "Все в Семинаре постоянно твердят мне, как важно «следить за тем, как я выгляжу», поэтому рядом с ними приходится носить форму, но..."
2005603-22 = "Быть представителем студентов — это ведь просто помогать вам, верно? Тогда какая разница, как меня видят остальные?"
2005603-23 = "Не все же студенты каждый день ходят исключительно в школьной форме, правда? Ну? Я ведь права?"
2005603-24 = "[s5] «Ну, формально ты не НЕ права...»\n[s6] «Пожалуй, мне и возразить-то нечего...»"
2005603-27 = "Нихахаха!! Вот видите, вы меня понимаете!"
2005603-28 = "Ладненько! Тогда, прежде чем я начну работать..."
2005603-29 = ""
2005603-31 = ""
2005603-32 = "...Хоп!"
2005603-33 = "[ns7] «...Коюки?»\n[ns8] «Ты серьёзно только что расстелила коврик и легла?»"
2005603-36 = "...А? Что ты имеешь в виду?"
2005603-37 = "Что я сейчас делаю? Ну... готовлюсь работать."
2005603-38 = "Просто кидайте мне любые задачи, которые нужно сделать, и я закончу их раньше, чем вы успеете заметить! И обещаю, что с этого коврика не сдвинусь!"
2005603-39 = ""
2005603-42 = "Сенсей...?"
2005603-43 = "Ничего? Нихахаха! Ну раз вы так говорите, глупенький Сенсей."
2005603-44 = "Раз уж я более-менее устроилась..."
2005603-45 = "...ПОГНАЛИ-И-И! ВРЕМЯ РАБОТАТЬ!"
2005603-47 = "Я сделал, как сказала Коюки, и занялся задачами Шале на сегодня. И, как она и обещала, она всё это время так и лежала на полу."
2005603-48 = "Со стороны она выглядела до смешного ленивой и совершенно несобранной."
2005603-49 = ""
2005603-50 = ""
2005603-51 = ""
2005603-52 = "Но, к моему удивлению, каждое поручение она выполняла с рекордной скоростью."
2005603-53 = ""
2005603-55 = ""
2005603-57 = ""
2005603-58 = "[ns9] «Это уже последнее.»\n[ns10] «Невероятно. Сегодня мы успели гораздо больше, чем я ожидал.»"
2005603-61 = "Нихахаха!! Видите? Вам нужно научиться мне доверять! Я ВСЕГДА держу слово, Сенсей."
2005603-62 = "...Хм? Что такое?"
2005603-63 = "Обычно я так же быстро заканчиваю работу в Семинаре?"
2005603-64 = ""
2005603-66 = ""
2005603-67 = "...Нет? Конечно нет. Ну вы чего, это же совершенно невозможно!"
2005603-68 = "[s11] «Ну, в общем-то я это и так знал...»\n[s12] «А в чём разница?»"
2005603-71 = "Нужно вообще объяснять? В офисе Семинара та-а-ак неудобно."
2005603-72 = "На полу лежать нельзя, и приходится всё время таскать эту дурацкую форму."
2005603-73 = "Если хочу вздремнуть — не дают! Но и когда бодрствую, нельзя слишком шуметь или есть снеки, потому что на меня ругаются!"
2005603-74 = "Неужели Я тут странная, если считаю безумием ожидать от человека нормальной работы в таких условиях?"
2005603-75 = "Ну... Старшекурсницы постоянно говорят, что в Семинар приходит много посетителей, поэтому мы обязаны всегда соблюдать правила."
2005603-76 = "Но тогда разве не логичнее, чтобы эти посетители просто вместе с нами НЕ соблюдали правила?"
2005603-77 = "...По крайней мере, я бы так сказала, но они никогда меня не слушают! Нихахаха!!"
2005603-78 = "[s13] «...Понятно.»\n[s14] «Кажется, сегодня я узнал о тебе немного больше, Коюки.»"
2005603-81 = "Э?! Что это ещё значит?!"
2005603-82 = "...Нихаха."
2005603-83 = "И всё же... я рада, что сегодня смогла вам помочь, Сенсей. И сделать это по-своему."
2005603-84 = "Ну что, на сегодня с задачами всё? Теперь можно закрываться?"
2005603-85 = "Раз уж сегодня я произвела такое хорошее впечатление, думаю, заработаю ещё пару очков и буду вести себя прилично!"
2005603-86 = "Так что если всё, я тихонько уйду, не устроив вообще ни капельки шума!"
2005603-87 = "[ns15] «...А, Коюки. Подожди минутку.»\n[ns16] Остановить Коюки."
2005603-90 = "Хм? Сенсей...? Что такое?"
2005603-91 = "...А?"
2005603-92 = "Если у меня больше нет планов, я могу остаться на ночь?"
2005603-93 = "Хм. Тогда дело меняется... Вы уверены, Сенсей? Я не буду мешать?"
2005603-94 = "...Вам будет даже хуже, если вы отправите меня домой так поздно?"
2005603-95 = "[s17] «Ты сегодня хорошо поработала. Я обязательно сообщу Семинару.»\n[s18] «Сегодня можешь поиграть на игровых приставках, которые у нас здесь есть.»"
2005603-98 = "А..."
2005603-100 = "О боже...!"
2005603-101 = "ИГРОВЫЕ ПРИСТАВКИ!!"
2005603-102 = "Нихахахахаха!! Ну а что мне остаётся? Вы ведь тоже хотели со мной потусоваться, правда, Сенсей?!"
2005603-103 = "Как я могу отказать на вашу такую искреннюю просьбу? И к тому же я уже идеально одета для такого случая!"
2005603-104 = "Ну же, пошли, Сенсей! В комнате отдыха нас ждут снеки и игры!"
2005603-105 = "[s19] «Вот это мгновенная смена настроения!!»\n[s20] «Вообще-то, для начала, всё это моё...»"
2005603-108 = "Нихахаха!! Ну же, не цепляйтесь к мелочам!"
2005603-109 = "Пойдёмте, Сенсей! Ночь ещё только начинается!!"
2005603-110 = "Время шоу!!"
2005603-112 = "Остаток ночи мы с Коюки провели вместе за играми в комнате отдыха."
2005603-113 = "Сначала Коюки с энтузиазмом собиралась играть со мной всю ночь напролёт..."
2005603-114 = ""
2005603-116 = ""
2005603-117 = "Но, как я и ожидал, спустя всего несколько часов она уже крепко спала."
