[translation]
90002020-1 = "Эпизод 2;Транспортный корабль"
90002020-2 = ""
90002020-3 = "Здравствуйте, пассажиры. Говорит ваш пилот и фактический капитан, Асума Токи."
90002020-4 = "Сейчас мы следуем заданным курсом на высоте 8 километров над тропопаузой. Небо ясное."
90002020-5 = "Мы скоро прибудем к месту назначения — Стальному континенту. Возможна неожиданная турбулентность, поэтому сейчас проверьте, что ваши ремни безопасности пристёгнуты."
90002020-6 = "Также, пожалуйста, верните кресла и столики в исходное положение."
90002020-7 = "А? Какие столики?"
90002020-8 = "Я пошутила. Ха-ха."
90002020-9 = "Фуфу. У фактического капитана Токи есть чувство юмора."
90002020-10 = "Тогда я ваш помощник по операциям и полёту, Акебоси Химари. ♪"
90002020-11 = "Похоже, график у нас довольно плотный, но мы обязательно доставим всех вовремя, чтобы спасти мир."
90002020-12 = "Всем удобно? После прошлого раза все чувствуют себя нормально?"
90002020-13 = ""
90002020-15 = ""
90002020-17 = ""
90002020-18 = "Ну, тогда почти не ощущалось, что мы вообще летим, потому что были очень высоко."
90002020-19 = "А сейчас... Мы действительно летим по небу. Хи-хи."
90002020-21 = "Я согласилась на роль второго пилота, как вы велели, президент, но я правда здесь нужна?"
90002020-22 = "Это неэффективно..."
90002020-23 = "Нет, нет. Это рационально, Эйми."
90002020-24 = "Чем больше становится наш экипаж, тем больше потенциальных переменных. Поэтому нам нужно было сократить круг обязанностей Токи."
90002020-25 = "Однако я, Токи, идеальная горничная. Я достигну совершенства независимо от количества проблем, Рио."
90002020-26 = "Людям свойственно ошибаться, и мы всегда должны быть к этому готовы."
90002020-27 = "Поняла, госпожа Рио."
90002020-29 = "Рио! Рио! Этот транспортный корабль просто потрясающий! Невероятный!"
90002020-31 = "М-Мы никогда не видели его... изнутри..."
90002020-32 = "Хмпф. Я ещё не закончила осматривать его целиком."
90002020-33 = "Ну же, Момой. Сейчас это не главное."
90002020-39 = "Ну, посмотреть действительно было на что. Вестибюль возле кабины, типичные общие жилые помещения..."
90002020-43 = "Если честно, там было чище, чем у меня в комнате..."
90002020-44 = "...Пожалуйста, научитесь убирать за собой."
90002020-45 = "Да. Недавно мне снова напомнили, насколько важна уборка."
90002020-46 = "Пф-ф?!"
90002020-47 = "Слышать это от тебя немного..."
90002020-50 = "Хотя ангар — важнейший отсек корабля, он, пожалуй, ещё и самый уязвимый."
90002020-51 = "Люк там ведёт прямо наружу. Как и десантные капсулы."
90002020-52 = "И ВСЕ ваши AMAS. По крайней мере те, что вы взяли. А ещё там была какая-то... конусообразная конструкция, верно?"
90002020-53 = "Это..."
90002020-54 = "...ничего."
90002020-55 = "Вот как?"
90002020-56 = "Я удивилась, насколько тихо работает двигатель даже оттуда, снизу."
90002020-57 = "Да... Там было уютно... Казалось, что в случае опасности я смогла бы там спрятаться... как в своём шкафчике..."
90002020-58 = "Подчеркну: во время чрезвычайной ситуации ангар — самое уязвимое и опасное место, понятно...?"
90002020-65 = "[ns1] «Я ЧРЕЗВЫЧАЙНО впечатлена.»\n[ns2] «Как тебе удалось всё это сделать, Рио?»"
90002020-68 = "Я почти ничего не сделала. Это просто технологии Миллениума в действии."
90002020-69 = "В той или иной форме исследовать и воплощать то, что можно вообразить... возможно."
90002020-70 = "А вот исследовать то, что лежит за пределами человеческого воображения, — совсем другое дело."
90002020-71 = "Если проще: если ты можешь это представить, то можешь это найти. Подсказки существуют в нашей реальности."
90002020-72 = "Но что делать, когда происходит нечто совершенно необъяснимое в рамках любого воображения?"
90002020-73 = "[s] «Разве такое возможно?»"
90002020-74 = "Вполне. Я постоянно сталкиваюсь с этим в исследованиях субмикроскопического и сверхмакроскопического миров."
90002020-75 = "Возьмём, например, гравитацию. Все мы подчиняемся законам гравитации, но гравитон, лежащий в основе—"
90002020-76 = "Стоп! Стоп! Президент Рио, остановитесь! Именно из-за таких нудных лекций о физике и технике люди вас и не любят!"
90002020-77 = "П-Правда?"
90002020-78 = "Ну... К этому моменту я уже привыкла..."
90002020-80 = "И как нам вообще на это реагировать...?"
90002020-81 = ""
90002020-83 = ""
90002020-85 = "Давайте немного разрядим обстановку. Отчёт о полёте, фактический капитан Токи?"
90002020-87 = "Никаких проблем, президент. Сигнал Стального континента стабильно усиливается."
90002020-88 = "...Уже настолько, что перегружает наши датчики. Найти безопасную зону посадки будет сложно."
90002020-90 = "А? Ну, если он такой большой, разве нельзя приземлиться где угодно?"
90002020-92 = "Нет, Момой. Если нам не повезёт и мы сядем в зоне с достаточно эффективной системой ПВО, нам придётся попрощаться раньше времени."
90002020-93 = "Если говорить проще, этот корабль предназначен для транспортировки и исследований, поэтому его оборонительные возможности ограничены."
90002020-95 = "И не забывайте, что наш противник — Стальной континент: Нецах, седьмой пророк."
90002020-96 = "С этого момента нам придётся представлять невообразимое."
90002020-97 = "Честно говоря, сейчас трудно понять, что выгоднее: лететь высоко или низко."
90002020-99 = "Наше временное решение — скрываться в облаках, чтобы избежать обнаружения визуально, по инфракрасному излучению или сканерами."
90002020-100 = "...Но так трудно визуально наблюдать Стальной континент."
90002020-102 = "У нас нет других способов обнаружить Нецаха?"
90002020-104 = "Нет таких, которые не выдадут нашу позицию. Если включим радар, они так же быстро определят наше местоположение."
90002020-105 = "И мощность сигнала Континента всё ещё остаётся проблемой."
90002020-106 = "Сигналы... сливаются в одну массу. Анализ невозможен."
90002020-107 = "[s] «Тогда... какой план?»"
90002020-108 = "..."
90002020-110 = "..."
90002020-111 = "Нам остаётся просто двигаться вперёд и сохранять бдительность."
90002020-112 = "Вау. Прямо к делу, Токи..."
90002020-113 = "Вас это не устраивает?"
90002020-114 = "...Нет. Совсем нет."
90002020-115 = "Теперь я запуталась ещё сильнее. Что ж, скоро мы достигнем нашей цели—"
90002020-116 = ""
90002020-120 = ""
90002020-121 = "Нет, нашего целевого континента. Снижаю высоту."
90002020-133 = "Augh?!"
90002020-134 = "Ч-Что случилось, Токи?"
90002020-135 = "Сообщаю об аномалии! Это огромное... нечто!"
90002020-136 = "Точнее, гигантская рука робота!"
90002020-137 = "Эти сигналы...! Это девятый пророк! Йесод!"
90002020-139 = "Йесод?!"
90002020-140 = ""
90002020-145 = "А-а-а-а?!"
90002020-146 = "А-а-аугх?!"
90002020-147 = ""
90002020-152 = "Ававава...!"
90002020-153 = "Ч-Что это за ШТУЧИЩЕ?!"
90002020-154 = "И-Ик...! ИИИК...!"
90002020-156 = "Все, держитесь за что-нибудь! Доклад о повреждениях!"
90002020-159 = "Двигатель повреждён, но основное питание всё ещё работает! Несколько вспомогательных двигателей в критическом состоянии."
90002020-160 = "Пожар в основном двигателе. Активирую систему пожаротушения."
90002020-161 = ""
90002020-165 = "Быстро теряем высоту! Президент, такими темпами—"
90002020-166 = "Мы падаем!"
90002020-167 = ""
90002020-171 = "Что с пожаром в двигателе?!"
90002020-172 = "Потушен! Но огонь перекинулся на внешнюю обшивку!"
90002020-173 = "Реверсивные двигатели на полную до критического предела!"
90002020-174 = ""
90002020-177 = "Полная тяга до критической точки. Активирую аварийную посадку. Столкновение с поверхностью через 3... 2... 1...!"
90002020-191 = "[ns] «Кто-нибудь ранен?!»"
90002020-192 = "Ух... Ай, ай, а-а-ай... Мир — нет, земля... Земля кружится..."
90002020-193 = "Вот поэтому и нужно пристёгиваться..."
90002020-194 = "Меня хоть кто-нибудь пожалеет? Мне пришлось делать всё это одним колесом..."
90002020-195 = "В-В любом случае... Где мы? Э-Это не совсем так я представляла Стальной континент..."
90002020-196 = "Это остатки местности на окраине Континента."
90002020-197 = "Гигантская... механическая рука Йесода атаковала нас как раз тогда, когда мы собирались пересечь его границу."
90002020-199 = "Из-за чего мы и совершили аварийную посадку здесь."
90002020-200 = ""
90002020-212 = "Ч-Что теперь?!"
90002020-213 = "Обнаружено большое количество сил! Токи, можешь вывести внешние камеры?"
90002020-214 = "Вывожу."
90002020-215 = ""
90002020-224 = ""
90002020-225 = ""
90002020-226 = ""
90002020-229 = "Это те же подразделения, что атаковали нас у хранилища семян... у хранилища Тиферет."
90002020-230 = "Мы окружены! Такими темпами...!"
90002020-231 = "Не волнуйтесь, Рио! Я защищу этот корабль и наш экипаж!"
90002020-232 = ""
90002020-236 = "А-Ах...!"
90002020-237 = "Алиса?!"
90002020-238 = ""
90002020-240 = ""
90002020-242 = "..."
90002020-243 = "Отдел разработки игр! Выдвигаемся!"
90002020-245 = "Момой?"
90002020-246 = "М-Мы тоже...?"
90002020-248 = "А то! Ты серьёзно собираешься оставить Арис там одну? Поняли, Сенсей? Мы вернёмся!"
90002020-249 = ""
90002020-251 = ""
90002020-253 = ""
90002020-254 = "Б-Блин! Поняла! Серьёзно, Момой..."
90002020-255 = "Один... за всех... Все... за одного..."
90002020-256 = ""
90002020-260 = "Все, подождите!"
90002020-261 = "[s] «...»"
90002020-263 = "[ns] «Эйми. Могу я доверить тебе Отдел разработки игр?»"
90002020-264 = "А? Мне?"
90002020-265 = "..."
90002020-266 = "Поняла, Сенсей. Да, можете."
90002020-267 = ""
90002020-269 = ""
90002020-271 = ""
90002020-272 = "[ns] «А пока, Рио, Токи, почините здесь всё, что сможете.»"
90002020-273 = "Да, поняла."
90002020-274 = "Начнём с оценки повреждений двигателя, Рио."
90002020-276 = "А мы?"
90002020-277 = "[s] «Кей и Химари... Пожалуйста, оставайтесь в резерве!»"
90002020-278 = "Ох, Сенсей. Неужели для нас нет работы?"
90002020-279 = "А, понимаю. Конечно. Кто-то моего калибра должен контролировать всю операцию целиком."
90002020-285 = ""
90002020-287 = "Ух. Им конца нет!"
90002020-288 = "Мы не можем сдаться сейчас! Что бы ни случилось, мы обязаны защитить Сенсея и остальных!"
90002020-289 = ""
90002020-293 = "Все сделайте большой шаг назад. Кроме тебя, Момой. Идём со мной."
90002020-294 = ""
90002020-296 = ""
90002020-297 = "А...?"
90002020-298 = "Это же— Эйми?"
90002020-299 = "Прибыла на усиление. Сенсей прислал меня. Мы с Момой удержим передовую."
90002020-300 = "Арис, ты наша огневая мощь. Поддерживай с тыла."
90002020-301 = "Мидори — стрелок. Юзу — гранатомётчик. Удерживайте центр."
90002020-302 = "Сенсей прислал... Да! Поняла! Рассчитываем на тебя, Эйми!"
90002020-303 = "Да. Сделаем всё, что сможем."
90002020-305 = "С-С нами всё будет нормально?"
90002020-306 = ""
90002020-311 = ""
90002020-313 = "Хм..."
90002020-314 = "С таким количеством мы справимся."
