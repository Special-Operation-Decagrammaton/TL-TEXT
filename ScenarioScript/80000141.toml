[translation]
80000141-1 = "Почти идеальный план"
80000141-2 = "[ns] «Добро пожаловать, Кей-Кей!»"
80000141-3 = "*вздыхает*..."
80000141-4 = "[s1] «Не могу поверить, что ты встречаешь меня вздохом...»\n[s2] «Но если ты хочешь вести себя так, Кей-Кей, я не против!»"
80000141-7 = ""
80000141-9 = "Ух, серьёзно."
80000141-10 = "..."
80000141-11 = "Я знаю, что обещала прийти, но всё же..."
80000141-12 = "..."
80000141-13 = "Ладно, неважно. Просто закончу дело и уйду."
80000141-14 = "Вот. Возьмите."
80000141-15 = ""
80000141-17 = ""
80000141-18 = ""
80000141-20 = "[ns] «Это...?!»"
80000141-21 = "Нашла по дороге сюда."
80000141-22 = "Почему-то подумала, что, раз уж вышла, надо что-нибудь купить."
80000141-23 = "А чего вы ожидали? Домашних сладостей, созданных с переполняющей искренностью? Премиальных конфет, наполненных нежными чувствами?"
80000141-24 = "Ещё чего! Эти магазинные шоколадки подходят вам идеально, Сенсей!"
80000141-25 = ""
80000141-26 = "Я уже собирался возмутиться и заявить, что магазинный шоколад тоже прекрасен..."
80000141-27 = "...но потом ещё раз посмотрел."
80000141-28 = ""
80000141-29 = "[ns] «Хмм...?»"
80000141-30 = "Ч-Что такое? Обычный дешёвый магазинный шоколад. Просто поблагодарите и жрите!"
80000141-31 = "[ns] «Хмм...»"
80000141-32 = ""
80000141-33 = "[ns3] «(Упаковка... немного отличается от магазинной...)»\n[ns4] «(Шоколадки... слегка различаются по размеру...)»\n[ns5] «(Аромат какао... необычайно насыщенный...)»"
80000141-37 = ""
80000141-38 = ""
80000141-39 = "Я съел... шоколад!"
80000141-40 = ""
80000141-42 = ""
80000141-43 = "К-Кхм... Н-Ну как?"
80000141-44 = "[s] «Спасибо, Кей-Кей.»"
80000141-45 = "Хм? За... что?"
80000141-46 = "[ns6] «За твой домашний шоколад.»\n[ns7] «Они были довольно солёными.»"
80000141-49 = "Что...?"
80000141-50 = "...?!"
80000141-51 = "Что?!"
80000141-52 = ""
80000141-54 = ""
80000141-55 = ""
80000141-57 = "Кей рухнула на диван и зарылась головой между подушками."
80000141-58 = "Серьёзно, Кей вела себя как страус."
80000141-59 = ""
80000141-68 = "А! А! А-а-а-а!"
80000141-69 = "Какая же я дура! Я бы поняла, если бы просто попробовала! А-а-а-а!"
80000141-70 = "Умри! УМРИ, ДУРА! План, план был идеальным!"
80000141-72 = "[ns] «Можно я хотя бы не буду умирать вместе с тобой?»"
80000141-73 = "Заткнись! Чёртов Сенсей!"
80000141-74 = ""
80000141-76 = ""
80000141-77 = ""
80000141-79 = ""
80000141-80 = "КЕЙ со всей силы бросила подушку!"
80000141-81 = ""
80000141-83 = ""
80000141-85 = ""
80000141-86 = "СЕНСЕЙ без труда её поймал!"
80000141-87 = ""
80000141-89 = ""
80000141-91 = ""
80000141-93 = "Отдайте."
80000141-94 = "[s] «Ни за что! Это МОЙ домашний шоколад, который Кей сделала специально для меня!»"
80000141-95 = "Отдайте! Потом сделаю нормальный!"
80000141-96 = "Что? Это приятно, но нельзя «выбрасывать и эту партию»?"
80000141-97 = "...Потому что это «единственный и неповторимый особый солёный шоколад Кей»?"
80000141-98 = ""
80000141-100 = ""
80000141-101 = "!!"
80000141-102 = "А-а-а-а-ах!!"
80000141-103 = ""
80000141-105 = ""
80000141-106 = ""
80000141-107 = ""
80000141-109 = "Я бегал, уворачиваясь от Кей... и съел ещё одну шоколадку!"
80000141-111 = "[ns] «Мм. Как и ожидалось, этот домашний шоколад Кей...»"
80000141-112 = "Д-Да...?"
80000141-113 = "[s] «...довольно солёный.»"
80000141-114 = "Теперь я точно вас убью, Сенсей!"
80000141-115 = "[s] «А вот и классическая фраза!»"
80000141-116 = "ТОГДА Я ТОЖЕ УМРУ!!"
80000141-117 = ""
80000141-129 = "Не разговаривайте со мной."
80000141-130 = "Что? Вы уверены, этот шоколад «ещё пригодится»?"
80000141-131 = "..."
80000141-132 = "Для чего?"
80000141-133 = "Нужно только «добавить что-нибудь сладкое» и чередовать кусочки?"
80000141-134 = "А соль вместе с какао может помочь восполнить электролиты в жаркий день?"
80000141-135 = "..."
80000141-136 = "И это вы называете утешением?!"
80000141-137 = "..."
80000141-138 = ""
80000141-140 = ""
80000141-141 = "Нет... Какая же я дура."
80000141-142 = "Угх... Серьёзно! Если бы я только попробовала! Я бы поняла, что взяла соль вместо сахара!"
80000141-143 = "[s] «Всё нормально, Кей.»"
80000141-144 = "Что...?"
80000141-145 = "[s] «Правда, всё хорошо. Я искренне рад.»"
80000141-146 = ""
80000141-148 = ""
80000141-149 = ""
80000141-150 = "...Если вы так говорите."
80000141-151 = "...Хи-хи."
80000141-153 = "Я достал сладости, которые берёг, и поделился с Кей."
80000141-154 = "Как я и ожидал, они отлично сочетались с шоколадом. Сладость и соль вместе оказались идеально вкусными."
80000141-156 = ""
80000141-157 = ""
80000141-158 = ""
80000141-159 = ""
80000141-160 = "Кей пыталась выглядеть сердитой и раздражённой..."
80000141-161 = ""
80000141-163 = ""
80000141-164 = ""
80000141-166 = "...но было совершенно ясно, что на самом деле это не так."
