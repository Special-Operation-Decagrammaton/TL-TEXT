[translation]
1006206-1 = "Однодневное опоздание"
1006206-2 = "Рядом с мастерской Токи"
1006206-3 = "Я немного волновался, поэтому решил зайти в мастерскую Токи."
1006206-4 = "Не хотелось вторгаться без предупреждения, поэтому сначала я ей позвонил."
1006206-5 = ""
1006206-9 = ""
1006206-10 = "Здравствуйте, Сенсей. Как я уже говорила, сегодня я немного опоздаю."
1006206-11 = "Хм? Вы из-за этого беспокоились и уже идёте сюда?"
1006206-12 = "А, прошу прощения. Похоже, мне стоило объясниться немного лучше."
1006206-13 = "Я не думала, что вы так поступите, но это не оправдывает моей небрежности."
1006206-14 = "А...? Почему вы извиняетесь передо мной?"
1006206-15 = "А... Значит, вы уже почти здесь."
1006206-16 = "Эм... Хм. Не знаю, что делать."
1006206-17 = "Но я понимаю, что заставлять вас ждать неправильно. Пожалуйста, заходите."
1006206-18 = ""
1006206-20 = ""
1006206-21 = "Мне было немного неловко, но я всё же вошёл."
1006206-22 = ""
1006206-30 = "― Смотреть тут особо не на что, но добро пожаловать, Сенсей.[wa:2120]"
1006206-32 = "― Я, как обычно, проверяла снаряжение.[wa:1250]"
1006206-35 = "― Простите, что заставила вас волноваться.[wa:1200]"
1006206-38 = "[ns] «Ты всегда проводишь столько обслуживания?»"
1006206-39 = "― Да. Я всегда стараюсь поддерживать себя в идеальном состоянии.[wa:1580]"
1006206-42 = "― Чтобы не посрамить имя C&C...[wa:560]"
1006206-44 = "― я хочу быть великой горничной.[wa:1120]"
1006206-47 = "[ns] «Это потрясающе, Токи. Ты каждый день так стараешься.»"
1006206-48 = "― Вы... правда так думаете? Мне это не кажется чем-то особенным.[wa:2480]"
1006206-50 = "― Но когда вы так говорите, я начинаю думать...[wa:2220]"
1006206-53 = "[ns] «О чём?»"
1006206-54 = "― Я полна решимости.[wa:680]"
1006206-56 = "― Сегодняшнее обслуживание пройдёт ещё эффективнее обычного.[wa:740]"
1006206-59 = "― Цель — стать лучшей горничной Кивотоса. Горничной среди горничных.[wa:3540]"
1006206-62 = "― Что ж, Сенсей...[wa:1020]"
1006206-64 = "― Пожалуйста, смотрите внимательно, хорошо?[wa:960]"
1006206-67 = "Я стоял в стороне и смотрел, как Токи спокойно обслуживает своё снаряжение."
1006206-69 = "Ещё раз спасибо за терпение, Сенсей."
1006206-70 = "Приступим к сегодняшней работе."
1006206-71 = "Я, Асума Токи, буду идеальной помощницей."
1006206-73 = "Когда мы вместе возвращались в Шале, Токи буквально сияла."
