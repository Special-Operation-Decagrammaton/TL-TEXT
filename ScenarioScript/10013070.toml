[translation]
10013070-1 = "Эпизод 7;Перед финальной битвой"
10013070-2 = "Перед тем как отправиться к следующей точке..."
10013070-3 = ""
10013070-5 = ""
10013070-6 = "[s1] «Кстати, Шизуко, ты не заключила контракт с Датэ Мяуру.»\n[s2] «Если подумать, с бойцами Курокамэ Охота была бы проще.»"
10013070-9 = "О. Из-за бойцов Банды Курокамэ? Наверное..."
10013070-10 = "...Наверное, это правда."
10013070-11 = "Но я никогда не заключу с ними договор!"
10013070-12 = "[s] «Почему?»"
10013070-13 = "Очевидно же! То, что сделала Датэ Мяуру, было раздражающим, мошенническим и подлым."
10013070-14 = "У бизнеса есть ответственность перед клиентами! А она полностью её растоптала. Я не могу её простить!"
10013070-15 = "Я лучше откажусь от всего, чем заключу сделку с таким человеком!"
10013070-16 = ""
10013070-18 = ""
10013070-19 = "К-Кхм! Да! Именно!"
10013070-20 = "[s] «Да, это очень на тебя похоже.»"
10013070-21 = "И-и?! Х-Хватит меня смущать..."
10013070-22 = "В-В любом случае!"
10013070-23 = "*вздыхает* ...Думаю, Охота на курорты подходит к концу."
10013070-24 = "Давайте проведём стратегическое совещание со студентами Абидоса!"
10013070-26 = "ЧВК Кайзер и правда был замешан."
10013070-27 = "Наше расследование попало точно в цель."
10013070-28 = "[s] «А? Ты о чём?»"
10013070-29 = "Мы получили новую информацию, пока усмиряли последнюю крупную группировку..."
10013070-31 = "Похоже, Бандиты в шлемах связаны с ЧВК Кайзер."
10013070-32 = "[s] «Бандиты в шлемах Рабу, которые напали на Абидос в самом начале...»"
10013070-33 = "И Датэ Мяуру, и Бандиты в шлемах получают поддержку ЧВК Кайзер. Это значит..."
10013070-34 = "Банк «Осьминог», который продал нам курортный контракт, сам подталкивает Охоту на курорты?!"
10013070-35 = "Чего они вообще добиваются?"
10013070-37 = "Хех! Прямо злодеи из фильма."
10013070-38 = "Наш следующий шаг очевиден."
10013070-39 = "Мы собираемся направиться на базу Бандитов в шлемах."
10013070-40 = "[s] «Похоже, в этот раз Абидос и Хяккияко работают вместе.»"
10013070-41 = "Отлично! Мы придумали стратегию победы над Бандитами в шлемах!"
10013070-42 = "[s] «Стратегию?»"
10013070-43 = "Эм, Хошино! Ты уверена, что с этой с-стратегией всё будет хорошо?!"
10013070-44 = "Я доверяю стратегии Хошино."
10013070-46 = "Думаю, будет весело!"
10013070-47 = "Да что это за стратегия?!"
10013070-48 = "Хи-хи, секрет! Как говорится: «Чтобы обмануть врага, сначала обмани союзника!»"
10013070-49 = "[s] «Если Хошино уверена, то и я тоже.»"
10013070-50 = "О, вы мне доверяете? Я рада!"
10013070-51 = "Я немного нервничаю..."
10013070-52 = "Я правда думаю, нам стоит пересмотреть план! Мне он совсем не нравится!"
10013070-53 = "Просто постараемся изо всех сил!"
10013070-54 = ""
10013070-57 = "[ns] «Похоже, они тоже готовят что-то серьёзное.»"
10013070-58 = "Да... Мы почти у финиша."
10013070-59 = "Давайте закончим это, команда!"
