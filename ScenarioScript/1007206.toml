[translation]
1007206-1 = "На одном дыхании"
1007206-4 = ""
1007206-5 = "Во время прогулки вдоль причалов рыбацкой деревни я встретил Саки как раз в тот момент, когда она выныривала из воды."
1007206-6 = "[ns] «Привет, Саки.»"
1007206-7 = ""
1007206-9 = ""
1007206-10 = "О, Сенсей! Какое совпадение."
1007206-11 = "Что вы здесь делаете?"
1007206-12 = "[s] «Просто гуляю.»"
1007206-14 = "[ns] «А ты чем занимаешься?»"
1007206-15 = "Поднимаю мусор со дна моря."
1007206-16 = "Здесь скапливается всякий мусор: старые рыболовные снасти, пластиковые бутылки и прочее."
1007206-17 = "Нырять за ним — хорошая тренировка для меня и одновременно помощь деревне."
1007206-18 = "[s1] «Впечатляет!»\n[s2] «Благородная душа, Саки.»"
1007206-21 = "А, ничего."
1007206-22 = "К тому же, когда здесь всё убрано, вид под водой невероятный."
1007206-23 = "Когда ныряешь с аквалангом в чистом, нетронутом океане, почти понимаешь, каково это — быть рыбой..."
1007206-24 = "[s3] «Могу только представить.»\n[s4] «Я бы тоже как-нибудь хотел попробовать дайвинг.»"
1007206-27 = "О, вы никогда не пробовали?"
1007206-28 = "Понимаю, держать голову под водой и дышать только через трубку может казаться страшным."
1007206-29 = "Но этому даже проще научиться, чем обычному плаванию... если рядом опытный водолаз, конечно."
1007206-30 = ""
1007206-32 = ""
1007206-33 = ""
1007206-34 = "Сенсей, у меня есть запасной комплект снаряжения. Хотите попробовать?"
1007206-35 = "Если что-нибудь пойдёт не так, я всё время буду рядом и прослежу, чтобы с вами всё было хорошо."
1007206-36 = "[s] «Ты не против?»"
1007206-37 = "Конечно. Можете на меня положиться."
1007206-38 = "Так я могу отблагодарить вас за помощь. Поэтому я даже буду рада..."
1007206-39 = ""
1007206-41 = ""
1007206-42 = "А, вам стоит переодеться в купальник."
1007206-43 = "Я пока проверю трубки и маски, чтобы всё было готово к использованию."
1007206-46 = "После того как я переоделся, Саки помогла мне надеть снаряжение, и мы начали погружение..."
1007206-47 = ""
1007206-53 = "― [log=사키 수영복](Теперь, Сенсей. Сохраняйте спокойствие и смотрите на меня.)[/log][wa:1540]"
1007206-56 = "― [log=사키 수영복](Хорошо, медленно. Вдох. Выдох. Не спешите.)[/log][wa:1660]"
1007206-59 = "― [log=사키 수영복](Хи-хи. Вы быстро учитесь. Я и не ожидала меньшего, Сенсей.)[/log][wa:520]"
1007206-62 = "― [log=사키 수영복](...Странное чувство.)[/log][wa:1150]"
1007206-65 = "― [log=사키 수영복](Быть здесь, под водой, вместе с вами и общаться только)[/log][wa:510]"
1007206-67 = "― [log=사키 수영복](взглядами и жестами...)[/log][wa:850]"
1007206-70 = "― [log=사키 수영복](Это...)[/log]"
1007206-73 = "― [log=사키 수영복](...А? Кажется, у меня заканчивается воздух?)[/log][wa:280]"
1007206-76 = "― [log=사키 수영복](Нет-нет. Всё в порядке. Я в норме!)[/log][wa:820]"
1007206-79 = "― [log=사키 수영복](Но моё дыхание...)[/log][wa:870]"
1007206-81 = "― [log=사키 수영복](...оно и правда немного... сбилось.)[/log][wa:10]"
1007206-84 = "― [log=사키 수영복](Может быть... нырять вместе с Сенсеем...)[/log]"
1007206-86 = "― [log=사키 수영복](Наверное, я была к этому не готова.)[/log][wa:1950]"
1007206-89 = "Мы с Саки некоторое время ныряли и играли в воде."
1007206-92 = "Сенсей, ну как вам первое погружение?"
1007206-93 = "[s] «Это было едва ли не самое весёлое занятие в моей жизни.»"
1007206-94 = "Ха-ха-ха! Рада это слышать."
1007206-95 = ""
1007206-97 = ""
1007206-98 = "Я немного волновалась..."
1007206-99 = "Взрослые такие... опытные. Они уже прошли и детство, и подростковые годы..."
1007206-100 = "Как разведчик я привыкла вести других, но боялась, что мне не хватит опыта, чтобы вести вас, Сенсей."
1007206-101 = "[s] «Всё нормально. Со мной об этом можешь не беспокоиться.»"
1007206-102 = "Но... Вы так сильно мне помогли, Сенсей. Поэтому если я совсем ничем не смогу помочь вам..."
1007206-103 = "Ну, это будет нечестно."
1007206-104 = "[s] «Жизнь несправедлива.»"
1007206-105 = ""
1007206-107 = ""
1007206-108 = "...Хмф."
1007206-109 = "В любом случае! Я рада, что вам понравилось нырять со мной."
1007206-110 = ""
1007206-112 = ""
1007206-113 = ""
1007206-114 = "Если когда-нибудь захотите снова — найдите меня."
1007206-115 = "Я всегда буду вашим напарником, Сенсей."
