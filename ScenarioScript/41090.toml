[translation]
41090-1 = "Episódio 9;Sombra à Espreita"
41090-2 = "Arredores do Parque Kousagi — Mercado"
41090-4 = "(Vim fazer compras no mercado aqui perto.)"
41090-5 = "Ah, Sensei...?!"
41090-10 = "Que coincidência encontrá-lo em um lugar como este!"
41090-11 = "[s1] \"Ah, Kirino. Bom trabalho.\"\n[s2] \"Fazendo patrulha por aqui também?\""
41090-12 = "Sim, exatamente! Hoje também pela segurança dos cidadãos!"
41090-13 = "Sim, exatamente! Hoje também pela segurança dos cidadãos!"
41090-14 = "Além disso, tem muitas barraquinhas deliciosas por esta região..."
41090-15 = "Especialmente o sanduíche de katsu daquele açougue ali é divino, e sempre que a gente compra alguma coisa, eles dão um croquete recém-frito de brinde...!"
41090-19 = "C-Claro, esse não é o meu único objetivo! Também tem o fato de que há delinquentes rondando por aqui...!"
41090-20 = "[s] \"Eu sei o quanto você se esforça, Kirino. Bom trabalho.\""
41090-21 = "A-Ahahaha..."
41090-22 = "A propósito, sobre as alunas da SRT que causaram aquela confusão no parque outro dia, ouvi dizer que \"tudo o que vier depois ficou a cargo da Schale\"..."
41090-23 = "Está tudo bem desde então? Espero que não tenha acontecido nenhum problema."
41090-24 = "Por exemplo, ameaçarem o Sensei com armas ou armadilhas para roubar comida..."
41090-25 = "Ou fazerem exigências absurdas, ou perderem o controle...!"
41090-26 = "[s3] \"E-Está tudo bem... sim.\"\n[s4] \"Elas são todas boas garotas.\""
41090-27 = "Entendo, que bom então."
41090-28 = "Entendo, que bom então."
41090-29 = "Como elas chegaram a organizar um protesto e enfrentar a Valkyrie, eu fiquei pensando se não seriam perigosas..."
41090-30 = "Como esperado do Sensei!"
41090-31 = "Eu também vou continuar me dedicando hoje para me tornar uma adulta admirável como o Sensei!"
41090-32 = "[s] \"Bom, nem tudo dá sempre certo comigo também...\""
41090-33 = "Ah, entendo. Se acontecer qualquer coisa, por favor, entre em contato com esta oficial ou com a Academia de Polícia Valkyrie a qualquer momento."
41090-34 = "Nós atuamos 24 horas por dia, o ano inteiro, pela segurança dos cidadãos!"
41090-35 = "Ah, a propósito, ultimamente tem corrido um boato estranho por esta região. Foi por isso também que vim fazer patrulha aqui..."
41090-36 = "[s] \"Um boato...?\""
41090-37 = "Sim. Ao que parece, um grupo de andarilhos armados anda circulando por aqui."
41090-38 = "Dizem que é um grupo sem residência fixa, usando roupas bem rústicas..."
41090-39 = "Eles andam por aí carregando armas de fogo poderosas de origem desconhecida, o que tem deixado os cidadãos bastante apreensivos."
41090-40 = "Além disso, outro dia houve relatos de que invadiram a zona portuária e roubaram sucata."
41090-41 = "Qual será o objetivo deles...?"
41090-42 = "[s] \"Hmm...?\""
41090-43 = "Sensei? Lembrou-se de alguma coisa?"
41090-44 = "[s] \"Não, com essas informações, provavelmente não é quem eu estava pensando...\""
41090-45 = "Entendo. Se descobrir alguma coisa, por favor, avise-nos!"
41090-46 = "Mas deixando de lado o caso anterior da SRT, \"um grupo de andarilhos com armas de fogo poderosas\"..."
41090-47 = "Desse jeito, vai parecer que o armamento da Academia de Polícia Valkyrie é todo fraco."
41090-48 = "Aproveitando a ocasião, que tal a Valkyrie também atualizar para armas de fogo mais modernas...?"
41090-49 = "[s] \"Entendi...?\""
41090-50 = "Ainda assim, acho que seria difícil... Para começar, conter criminosos nem faz parte das atribuições básicas do Departamento de Segurança Pública..."
41090-51 = "E, pelo visto, a situação financeira da Valkyrie inteira não anda nada boa... Até repor munição está dando trabalho."
41090-52 = "Mas não se preocupe! Se precisar, protegerei a segurança dos cidadãos até mesmo de mãos vazias!"
41090-53 = "Além disso, com os méritos da última vez, talvez eu até consiga transferência para o Departamento de Segurança..."
41090-54 = "Vou continuar me esforçando daqui em diante!"
41090-55 = "[s] \"Sim, estou torcendo por você.\""
41090-56 = "Muito obrigada! Isso tudo também é graças ao Sensei!"
41090-57 = "Bem, esta oficial vai continuar o tour gastronô..."
41090-58 = "Digo, vou voltar para a patrulha!"
41090-62 = "[ns] Terminar as compras e voltar para a Schale."
41090-66 = "..."
41090-70 = "...Ei, você aí."
41090-71 = "Você é o Sensei [USERNAME], não é?"
41090-72 = "[s] \"Sou eu mesmo...\""
41090-74 = "Tenho um assunto a tratar com você."
41090-75 = "Vai me acompanhar, não vai?"
41090-82 = "[ns] \"(Isso é... anestésico?!)\""
41090-91 = "(Acabei inalando a fumaça liberada, e minha visão começou a ficar turva...)"
41090-95 = "(Minha consciência mergulhou na escuridão.)"
41090-97 = "Próximo;Desapego e Bentô de Yakiniku"
