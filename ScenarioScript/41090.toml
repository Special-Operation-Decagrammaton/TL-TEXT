[translation]
41090-1 = "Эпизод 9;Подозрительная тень"
41090-2 = "Магазин возле парка Коусаги"
41090-4 = "Я был в ближайшем магазине, закупая припасы для Шале."
41090-5 = "Это Вы, Сенсей?"
41090-6 = ""
41090-9 = ""
41090-10 = "Какая неожиданная встреча! Здравствуйте, Сенсей!"
41090-11 = "[s1] «Давно не виделись, Кирино.»\n[s2] «Что ты здесь делаешь?»"
41090-12 = "Агась! Я патрулирую улицы, чтобы оберегать покой граждан!"
41090-13 = "Я патрулирую улицы, чтобы оберегать покой граждан!"
41090-14 = "Ну и, в качестве приятного бонуса, изучаю ассортимент местных уличных лавов!"
41090-15 = "Здесь столько разных вкусняшек! Очень рекомендую мясную лавку вон там, у выхода. Их жареные крокеты - это лучшее, что я пробова…"
41090-16 = ""
41090-18 = ""
41090-19 = "О-о, конечно, я патрулирую этот район вовсе не ради еды! Это было бы уклонением от обязанностей. Просто так совпало, что после школы здесь часто околачиваются всякие подозрительные личности!"
41090-20 = "[s] «Я никогда не сомневался в твоём отношении к работе, Кирино.»"
41090-21 = "Ахаха… С-спасибо, Сенсей."
41090-22 = "Но, Сенсей… Я слышала, что теперь Вы курируете студентов SRT."
41090-23 = "С ними ещё не возникало проблем?"
41090-24 = "Они ведь могут шантажировать Вас, требуя еду, прямо в этот самый момент?"
41090-25 = "Или они уже вышвырнули Вас из жилого помещения и устроили там погром?!"
41090-26 = "[s3] «О них не о чем беспокоиться.»\n[s4] «Они хорошие девчата.»"
41090-27 = "О. Удивлена это слышать."
41090-28 = "О. Удивлена это слышать."
41090-29 = "Учитывая, что они достаточно опасны, чтобы наставлять оружие на офицеров полиции, я очень переживала, что они будут сопротивляться Вам при каждом удобном случае, Сенсей."
41090-30 = "Но конечно, всё дело в безграничной харизме нашего Сенсея. Даже те ужасные ученицы не смогли перед ней устоять!"
41090-31 = "Я могу только надеяться, что когда-нибудь стану такой же образцовой взрослой, как Вы, Сенсей."
41090-32 = "[s] «Я вовсе не такой замечательный, как тебе кажется, Кирино…»"
41090-33 = "Вы такой весёлый, Сенсей! Но если у Вас возникнут какие-то проблемы, не стесняйтесь просить Полицейскую Школу Валькирии о помощи!"
41090-34 = "Студенты Валькирии несут службу 24 часа в сутки, 365 дней в году, чтобы обеспечить безопасность наших граждан!"
41090-35 = "Мы также усилили патрулирование, учитывая все эти ужасающие слухи, которые ходят в последнее время."
41090-36 = "[s] «Ужасающие слухи?»"
41090-37 = "К сожалению, в этом районе участились случаи налётов вооружённых бездомных."
41090-38 = "Судя по их… внешнему виду и непрекращающимся битвам за выброшенные ланчбоксы, мы пришли к выводу, что эти люди - бродяги без постоянного места жительства."
41090-39 = "Судя по всему, они вооружены тяжёлым огнестрельным оружием. Именно поэтому мы усилили патрули."
41090-40 = "Они даже пробрались в охраняемый порт и украли партию строительного мусора! Эти злодеи просто неисправимы!"
41090-41 = "Хотя всё это очень странно. Сообщалось, что они были вооружены до зубов, но всё, на что они позарились - это отходы. Настоящая загадка, но Полицейская Школа Валькирия уже занимается этим делом!"
41090-42 = "[s] «Да не может быть…»"
41090-43 = "Что-то не так, Сенсей? Задумались о чём-то?"
41090-44 = "[s] «Эм. Нет, ничего.»"
41090-45 = "Понятно. Ну, прошу, обязательно докладывайте обо всём подозрительном, что увидите!"
41090-46 = "В последнее время проблемы сыплются одна за другой. Нам и так по горло хватает забот с непутёвыми студентами и их личным оружием, а теперь ещё объявилась какая-то неизвестная, до зубов вооружённая банда…"
41090-47 = "Такими темпами мне придётся сражаться с горохомётом против огнемёта! Или чем-то похуже!"
41090-48 = "Возможно, это мой шанс подать запрос на снабжение, чтобы выдать сотрудницам Бюро Общественной Безопасности самое современное оружие?"
41090-49 = "[s] «Думаю, ты и сама прекрасно знаешь ответ на этот вопрос.»"
41090-50 = "Ха-ха, полагаю, так и есть. Чисто технически в наши обязанности не входит борьба с преступностью напрямую."
41090-51 = "А учитывая, что в наши дни бюджета едва хватает на патроны, мне не стоит быть эгоисткой."
41090-52 = "Я продолжу защищать жителей и учениц Кивотоса, даже если мне придётся делать это голыми руками!"
41090-53 = "И я всё ещё надеюсь на перевод в Бюро Безопасности в качестве награды за последние достижения."
41090-54 = "Вот тогда я получу оружие получше и смогу гораздо эффективнее охранять покой граждан!"
41090-55 = "[s] «У тебя всё получится, Кирино!»"
41090-56 = "Хи-хи! Поддержка Сенсея всегда придаёт мне сил."
41090-57 = "А теперь прошу меня извинить. Тот уличный торговец прямо-таки зовёт меня по имени…"
41090-58 = "Ой! То есть я хотела сказать - возвращаюсь к патрулированию!"
