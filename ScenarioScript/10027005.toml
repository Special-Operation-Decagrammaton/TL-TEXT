[translation]
10027005-190 = "#video;10027"
10027005-1 = "Пролог;День с Фронтом освобождения знаний"
10027005-2 = "Библиотека Академии Красной Зимы"
10027005-3 = ""
10027005-4 = ""
10027005-5 = ""
10027005-6 = ""
10027005-7 = ""
10027005-8 = ""
10027005-9 = ""
10027005-10 = ""
10027005-11 = ""
10027005-12 = ""
10027005-13 = "*кашляет* *кашляет*"
10027005-14 = "Вы в порядке?"
10027005-16 = "Нет! Вся эта пыль убивает мои лёгкие!"
10027005-17 = "Поэтому мы и убираемся..."
10027005-19 = "Но какой в этом смысл?"
10027005-20 = "Зачем всё это убирать, если сюда никто не приходит и не оценит? Президент Черина — единственный посетитель, и она приходит только поспать!"
10027005-21 = "А если они и правда ждут посетителей, то могли бы хотя бы позволить нам держать больше книг."
10027005-22 = "Согласна... Но разве плохо содержать библиотеку в чистоте?"
10027005-23 = "Мы здесь живём, так что чистота полезна хотя бы нам, даже если больше никому."
10027005-24 = "Бе-е! Не пытайся обмануть меня своими разумными доводами..."
10027005-25 = "Знаешь, иногда во время уборки люди находят неожиданные сокровища."
10027005-27 = "Почему бы не относиться к этому скорее как к поиску полезных артефактов?"
10027005-28 = "Устаревшие книги и старая манга — не сокровища."
10027005-30 = "Мэру... для Фронта освобождения знаний любая информация ценна!"
10027005-31 = "Новая она или нет, люди всегда требуют самого свежего контента."
10027005-32 = "Да, но если самый свежий контент — это заплесневелые старые книги и манга—"
10027005-33 = "Почему ты так упорно пытаешься видеть во всём плохое?"
10027005-35 = ""
10027005-45 = ""
10027005-46 = "Подожди-ка... Мэру! Иди сюда!"
10027005-47 = "А? Что? Ты что-то нашла?"
10027005-48 = "Да! Я нашла «Луну», тома с 4-го по 21-й! Не могу поверить, что такие сокровища всё это время были у нас под носом!"
10027005-49 = "Что такое «Луна»?"
10027005-50 = "Мэру, ты не знаешь про «Луну»?! И после этого называешь себя участницей Фронта освобождения знаний..."
10027005-51 = "Ну, видите ли…"
10027005-52 = "Я в тебе разочарована! Эти истории легендарны!"
10027005-53 = "Там рассказывается о двух персонажах по имени «Луна», которые вместе проживают разные моменты жизни."
10027005-54 = "Там есть всё и для всех! Любовь, жизнь, панк-тематика, группа, фильмы и... вообще всё!"
10027005-55 = "Последний том, 22-й, правда, немного свернул не туда, но..."
10027005-56 = "Ты правда упустила нечто потрясающее, Мэру! Какая жалость..."
10027005-57 = "Ты хочешь сказать, что жалеешь меня, потому что я это пропустила? Или считаешь моё невежество позорным?"
10027005-59 = "О, я ни разу не считала тебя позорной, Мэру! Ты же знаешь!"
10027005-60 = "Хм, это правда."
10027005-61 = "В любом случае! У меня как раз есть тома с 1-го по 3-й. Почему бы тебе не воспользоваться шансом и не познакомиться с «Луной»?"
10027005-62 = "Обязательно?"
10027005-63 = "Конечно! Мы — Фронт освобождения знаний. Любая информация одинаково ценна, и «Луна» не исключение!"
10027005-64 = "Ты просто прикрываешься Фронтом освобождения знаний, чтобы заставить меня это читать, да?"
10027005-66 = ""
10027005-79 = "*вздыхает* Всё... Ух ты! Уже позднее, чем я думала!"
10027005-80 = "Значит, тебе понравилось? Рассказывай. Что думаешь?"
10027005-81 = "Эм, для начала..."
10027005-82 = "Для начала?"
10027005-83 = "Было неплохо, но—"
10027005-84 = "Правда?! Это же потрясающе!"
10027005-85 = "Тебе не кажется, что сюжет немного... притянут за уши?"
10027005-86 = "Простите?"
10027005-87 = "Они просто создают конфликты ради конфликтов. А когда персонаж становится слишком сложным, его списывают каким-нибудь нелепым несчастным случаем."
10027005-88 = "Н-Ну... Некоторые критики и правда указывали на это, когда манга была на пике популярности..."
10027005-89 = "Н-Но это не значит, что персонажи не привлекательные! Возьмём, например, 16-й том. Конфликт Луны с управляющим студии—"
10027005-90 = "Признаю, персонажи прописаны хорошо, особенно если учитывать год публикации."
10027005-91 = "Но сам сюжет слишком запутанный. Иногда становилось настолько плохо, что, по-моему, это просто портило отдельные тома."
10027005-92 = "Например, в последней части 21-го тома они оставили слишком много незакрытых сюжетных линий."
10027005-93 = "Ты сказала, что 22-й том последний, да? Не уверена, что одного тома хватит, чтобы всё это закрыть... Как думаешь?"
10027005-94 = "Ну, вообще-то... 22-го тома не существует."
10027005-95 = "Что?! Почему?! Это ужасный способ закончить историю."
10027005-96 = "...эксперт."
10027005-97 = "А? Я не расслышала."
10027005-98 = ""
10027005-101 = ""
10027005-102 = ""
10027005-104 = "Кто вообще назначил тебя экспертом, Мэру?!"
10027005-105 = "...Ч-Что?"
10027005-107 = "Я просто хотела узнать, почему нет финального тома, который завершил бы историю."
10027005-108 = "И ещё одно!!"
10027005-109 = "Е-Ещё одно?"
10027005-110 = "Ты вообще не НАСТОЯЩИЙ автор! Кто ты такая, чтобы судить?!"
10027005-111 = "Ты сама никогда ничего не продумываешь, прежде чем переносить это на страницу. Ты ничем не лучше их!"
10027005-112 = "Ты просто придумываешь сцену, а потом силой подгоняешь под неё всех персонажей и сюжетные линии!"
10027005-113 = "У них полно недостатков, как ты и говоришь про эту историю. Так с чего ты вообще решила, что имеешь право судить?!"
10027005-114 = "М-Момидзи? Что с тобой происходит? Что не так?"
10027005-116 = "Меня просто достало, ясно?! Мне нужно наконец всё высказать!"
10027005-118 = ""
10027005-124 = "И давай не будем забывать, что ты съела мой жареный блинчик! Потому что я уж точно не забыла!"
10027005-125 = "Он лежал там ВЕСЬ день! Я просто подумала, что его можно брать. Надо было подписать или что-то такое!"
10027005-126 = "Я не должна была ничего подписывать! Если вещь не твоя — не трогай! Это здравый смысл!"
10027005-128 = ""
10027005-135 = "Ты вообще никогда не думаешь о других! Просто делаешь всё, что тебе хочется!"
10027005-136 = "Ты такая эгоистичная, Мэру!"
10027005-137 = "...!"
10027005-138 = "Я не обязана стоять тут и слушать это! Мне тоже есть что тебе сказать!"
10027005-140 = "Не тебе жаловаться, Момидзи. Взять хотя бы заказы книг..."
10027005-142 = ""
10027005-148 = "Нам постоянно приходят по несколько экземпляров одной и той же книги. Наверняка ты по ошибке оформила дублирующий заказ, да, Момидзи?"
10027005-149 = "У меня не было выбора! Я ищу л-лимитированное издание! Его очень трудно достать!"
10027005-151 = "Причина неважна. Из-за тебя Секретариат два месяца отказывался утверждать любые наши заказы! И как ты собираешься это исправлять?!"
10027005-153 = ""
10027005-158 = "И что? Ты говоришь так, будто только я делаю всё, что захочу! Ты ничем не лучше, Момидзи!"
10027005-160 = "Это вообще две совершенно не связанные вещи!"
10027005-161 = "Ещё как связанные!"
10027005-163 = "Уф!"
10027005-164 = "Хмф!"
10027005-165 = ""
10027005-167 = ""
10027005-168 = ""
10027005-169 = "Ладно! Да и плевать!"
10027005-171 = "Продолжай вести себя так, будто ты лучше всех, и посмотрим, что из этого выйдет! Мне всё равно!"
10027005-173 = ""
10027005-176 = ""
10027005-178 = ""
10027005-179 = ""
10027005-180 = "Угрозами ты меня не напугаешь!"
10027005-181 = "Потому что мне на тебя тоже плевать, Момидзи!"
10027005-182 = "..."
10027005-183 = "Ах, ну конечно! Просто уйди, пока я с тобой разговариваю!"
10027005-184 = "Хмф. Скатертью дорога! Я и сама прекрасно справлюсь..."
10027005-185 = "Ага..."
10027005-186 = "..."
10027005-187 = "Надеюсь..."