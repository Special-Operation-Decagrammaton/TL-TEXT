[translation]
1001503-1 = "Квест Арис: стать легендой"
1001503-2 = "Сегодня отличная возможность отправиться в приключение."
1001503-3 = "После повышения уровня Арис открыла множество новых возможностей."
1001503-4 = "[s1] «Каких возможностей?»\n[s2] «Например?»"
1001503-5 = "Сбор предметов."
1001503-6 = "Сбор предметов."
1001503-7 = "Сейчас покажу."
1001503-8 = ""
1001503-9 = ""
1001503-10 = ""
1001503-11 = "[s3] «Арис? Что ты делаешь?»\n[s4] «Зачем ты ломаешь этот мусорный бак?!»"
1001503-12 = "Обычно так можно получить много предметов."
1001503-13 = "Обычно так можно получить много предметов."
1001503-14 = "[s5] «...?!»\n[s6] «В этом нет никакого смысла!»"
1001503-15 = "Вы не понимаете? Это основы геймдизайна."
1001503-16 = "Вы не понимаете? Это основы геймдизайна."
1001503-17 = "Так было и в RPG, в которую я недавно играла, и в сайд-скроллере несколько дней назад."
1001503-18 = "О! Я нашла восстанавливающий предмет в куче мусора."
1001503-19 = "Видите, Сенсей? Я нашла чей-то недоеденный гамбургер!"
1001503-20 = "[s7] «Нельзя так, Арис!»\n[s8] «Если ты это съешь, ОЗ станет ещё меньше!»"
1001503-21 = "Точно?"
1001503-22 = "Точно?"
1001503-23 = "...Вы, должно быть, хотите сказать, что это скрытый яд. Я не люблю яд."
1001503-24 = "Я не могу тратить на такое заклинание лечения."
1001503-25 = "Нам следует двигаться дальше."
1001503-26 = "[s] «Мы снова просто гуляем?»"
1001503-27 = "Сегодня я хотела бы побывать в совершенно новом для меня месте."
1001503-28 = "И, разумеется, я хочу, чтобы вы пошли со мной."
1001503-29 = "[s9] «(Я не могу оставить её в таком состоянии. Лучше пойду с ней.)»\n[s10] «(Ради собственного спокойствия мне лучше пойти с ней.)»"
1001503-30 = "На старт, внимание, марш!"
1001503-31 = "На старт, внимание, марш!"
1001503-33 = "На границе Миллениум"
1001503-34 = "Нам удалось добраться так далеко."
1001503-35 = "Хотя я не уверена, где именно мы находимся. Вы знаете?"
1001503-36 = "[s11] «Здесь не так много людей...»\n[s12] «Район выглядит не слишком дружелюбно...»"
1001503-37 = ""
1001503-38 = ""
1001503-40 = ""
1001503-41 = ""
1001503-42 = ""
1001503-43 = "Глядите-ка! Свеженькие!"
1001503-44 = "Хе-хе-хе!"
1001503-45 = "...!"
1001503-46 = "[s13] «Я знал, что так и будет!»\n[s14] «Быстро же это случилось!»"
1001503-47 = "Кто бы мог подумать, что мы найдём такие жирные цели даже здесь? Сегодня явно наш счастливый день!"
1001503-48 = "Кто бы мог подумать, что мы найдём такие жирные цели даже здесь? Сегодня явно наш счастливый день!"
1001503-49 = "Хе-хе. Выкладывайте всё, что есть, а не то пожалеете."
1001503-50 = "...?"
1001503-51 = "..."
1001503-52 = "Теперь я понимаю. Это, должно быть, случайная встреча с монстрами на карте."
1001503-53 = "*щелчок*"
1001503-54 = "А?"
1001503-55 = "Ч-что это за оружие?!"
1001503-56 = "Тогда пощады не будет!"
1001503-57 = "[s] «Арис! Не надо!»"
1001503-58 = "Слепящий Свет!"
1001503-60 = "*БА-А-АХ*"
1001503-63 = "Негодяи рухнули на землю, словно куча смятых алюминиевых банок."
1001503-64 = ""
1001503-65 = "...?"
1001503-66 = "Странно. Я победила их, но не получила никакого опыта."
1001503-67 = "И награды тоже нет."
1001503-68 = "Возможно, их нужно обыскать вручную."
1001503-69 = "[s15] «Арис, на этом хватит!»\n[s16] «Если ты так сделаешь, ничем не будешь лучше них!»"
1001503-73 = "Мне пришлось убедить Арис не рыться в карманах бандитов."
