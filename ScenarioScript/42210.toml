[translation]
42210-1 = "Episódio 21;A Caverna de Carbanog (2)"
42210-2 = "Sala de Operações"
42210-5 = "A-aqui é FOX 3... Desculpa, me pegaram.#nOs \"Coelhos\" já passaram pelo Ponto Lima."
42210-6 = "Aqui é FOX 4, mesma coisa por aqui.#nDescobriram meu ponto de emboscada facinho... Suporte de franco-atiradora indisponível no momento."
42210-8 = "Aqui é FOX 2. Os \"Coelhos\" estão tentando descer de rapel em direção ao Ponto Oscar."
42210-9 = "As contramedidas que preparamos foram neutralizadas... Precisamos reorganizar nossa estratégia."
42210-15 = "...Entendido."
42210-16 = "A partir de agora, FOX 1 estabelecerá a linha de defesa e responderá sozinha."
42210-17 = "FOX 2, conforme o planejado, leve os outros membros e assegure a rota de fuga fora da zona de operações."
42210-21 = "...FOX 2, está me ouvindo?"
42210-25 = "Comunicação cortada..."
42210-26 = "Com uma explosão daquela magnitude... não é de se estranhar que a linha tenha ficado instável."
42210-27 = "...Na verdade, talvez seja melhor assim — pelo menos não preciso dar explicações desnecessárias às minhas colegas."
42210-31 = "Muito bem, vamos iniciar a ofensiva \"final\"."
42210-38 = "RABBIT 1, rapel concluído."
42210-39 = "Sensei, você está bem?"
42210-40 = "[s1] \"Desci amarrado feito carga, mas...\"\n[s2] \"Estou bem, sem problemas.\""
42210-43 = "Por sorte, parece que não se machucou."
42210-49 = "RABBIT 2, rapel concluído."
42210-53 = "...O nosso objetivo, a Sala de Operações, fica logo à frente?"
42210-54 = "Aham, se seguirmos reto por este corredor, chegamos na parte mais funda do silo — a Sala de Operações."
42210-56 = "Mesmo tendo neutralizado todo o esquadrão inimigo, ainda pode haver defesas ativas — não podemos baixar a guarda até o fim."
42210-57 = "Depois de checarmos o equipamento de novo—"
42210-68 = "...Excelente desempenho, líder de esquadrão Tsukiyuki."
42210-70 = "...Yukino-senpai."
42210-71 = "Você já sabe o resultado do combate no andar de cima, não sabe?"
42210-72 = "A deusa da vitória está sorrindo para nós.#nPare com essa resistência inútil e renda-se pacificamente."
42210-73 = "Não, é exatamente o contrário."
42210-74 = "No momento em que entramos neste silo primeiro, a \"guerra\" já foi vencida por nós."
42210-76 = "O que quer dizer com isso...?"
42210-80 = "Neste exato momento, estou segurando o botão de autodestruição da ogiva <A.N.T.I.O.C.H.>."
42210-81 = "Se vocês derem um único passo para dentro da Sala de Operações... eu aperto este botão imediatamente."
42210-86 = "Se a ogiva detonar em um espaço fechado como este... todos aqui perderão a vida — mas a \"operação\" será um sucesso."
42210-87 = "Mas isso também vale para você, Senpai."
42210-88 = "Minha vida não é grande coisa."
42210-89 = "Pelo bem da operação — fazer o que for preciso é o que define a SRT."
42210-92 = "..."
42210-93 = "...Se têm amor à vida, deem meia-volta.#nÉ o meu último conselho como veterana."
42210-99 = "...Sensei."
42210-100 = "[s] \"...Vocês não querem desistir agora, não é?\""
42210-101 = "...Exato."
42210-102 = "Porque nós também somos capazes de fazer o que for preciso pela operação!"
42210-104 = "[ns] \"...Então, vamos nessa.\""
42210-105 = "Achou mesmo que a gente ia botar o rabo entre as pernas e fugir com um blefe desses?"
42210-106 = "Que golpe baixo tentar apertar um botão tão interessante antes de mim! Nem pensar que eu vou deixar... Hehe..."
42210-107 = "Pelo futuro da SRT... não podemos recuar agora!"
42210-109 = "Todas, atenção ao perímetro!"
42210-113 = "Esquadrão RABBIT, invadindo a Sala de Operações!"
