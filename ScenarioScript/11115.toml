[translation]
11115-2 = "Противник отступает."
11115-3 = "Но такими темпами..."
11115-4 = "Они что, приведут подкрепление? Меня устраивает."
11115-5 = "П-подождите! Нельзя же продолжать вот так сражаться с ними!"
11115-6 = "А почему нет?"
11115-7 = "Если мы устроим ещё больше шума, за нас могут взяться смотрители Чёрного рынка!"
11115-8 = "И тогда у нас будут уже совсем серьёзные проблемы. Надо уходить."
11115-9 = "Справедливо. Ты знаешь это место лучше нас, Хифуми, так что веди."
11115-10 = "Тц. Пусть считают, что им повезло!"
11115-11 = "Сюда!"
11115-12 = ""
11115-15 = "Следующий Эпизод;На Чёрный рынок! Часть 2"
