[translation]
2005405-1 = "Безопасная эксплуатация"
2005405-2 = "[ns] «Вот и ещё один день прошёл...»"
2005405-4 = ""
2005405-5 = "Вам понравился ужин?"
2005405-6 = "[s] «Ну, было неплохо, но...»"
2005405-7 = "Хм? Ах, понятно... То есть вы хотите сказать, что было не хорошо, но и не сказать чтобы плохо..."
2005405-8 = "Что ж, учитывая, что мы чередуем ограниченный набор замороженных блюд, неудивительно, что они начинают немного... надоедать."
2005405-9 = "Говорят, даже объективно вкусный сухпаёк со временем неизбежно приедается. Не хотелось бы, чтобы вам всё наскучило."
2005405-10 = "Тогда исправим это, Сенсей. Для начала примите это средство от тошноты."
2005405-11 = "[s1] «Спасибо. Меня довольно сильно укачивает!» \n[s2] «О, со мной всё будет нормально. Желудок крепкий.»"
2005405-12 = "Фу-фу. Как ваша система жизнеобеспечения, всегда полностью готовая к чему угодно..."
2005405-13 = "...вы могли бы хотя бы чуточку сильнее в меня влюбиться."
2005405-14 = "И всё же шанс один на миллион всегда существует. Не так ли, Сенсей?"
2005405-15 = "Вы должны беречь себя. Если вы заболеете, Сенсей... переживать придётся мне. Вы ведь этого не хотите?"
2005405-18 = ""
2005405-20 = ""
2005405-21 = "Ну что, Сенсей?"
2005405-22 = "Начнём испытание производительности?"
2005405-23 = "[ns] «Хорошо! Поехали!»"
2005405-26 = "[ns] «Уа-а-а-а-а!»"
2005405-27 = ""
2005405-28 = "Ну как, Сенсей? Прибавить ходу?"
2005405-29 = "[ns] «Твой мотоцикл потрясающий! Такой быстрый!»"
2005405-30 = "Это ИНВАЛИДНАЯ КОЛЯСКА!"
2005405-31 = "[ns] «Твоя инвалидная коляска потрясающая!!!»"
2005405-32 = "Держитесь крепче! За мою талию!"
2005405-33 = "У меня сердце разобьётся, если вы упадёте и пострадаете!"
2005405-34 = "[ns] «Хорошо!!»"
2005405-35 = ""
2005405-39 = ""
2005405-41 = "Ах, как освежает! Мне уже гораздо лучше!"
2005405-42 = "Ну как вам моя коляска?"
2005405-43 = "Она переключала передачи без рывков, и резкое ускорение, и экстренное торможение отработали безупречно."
2005405-44 = "Конечно, при моём безопасном вождении всё это не понадобится — НЕТ, я хотела сказать, при безопасной эксплуатации средства мобильности."
2005405-45 = "Если снять ограничители, она сможет разгоняться от 0 до 60 миль в час всего за 0,956 секунды."
2005405-46 = "[s] «Пожалуйста, води осторожно... То есть ЭКСПЛУАТИРУЙ её безопасно!»"
2005405-47 = "Разумеется. Это далеко не первое моё скоростное испытание."
2005405-48 = "Хм? Я занималась этим по ночам вместо сна?"
2005405-49 = "..."
2005405-50 = "А что мне ещё оставалось? Здесь ведь почти нечем заняться."
2005405-51 = "Можно считать это одновременно испытанием пределов коляски И разведывательной миссией."
2005405-52 = "О, правда? Вы считаете, Эйми, Токи и нашего флота дронов «вполне достаточно для разведки»?"
2005405-53 = "..."
2005405-54 = "Что ж, иногда даже гениальному стратегу нужен настоящий полевой опыт!"
2005405-55 = "Полевые и аналитические подразделения должны понимать работу друг друга. Иначе мы неизбежно будем принимать решения на неверной информации!"
2005405-56 = "[s] «Да, понимаю...»"
2005405-57 = "И именно здесь, именно сейчас..."
2005405-58 = "мы можем увидеть то, чего не увидим больше нигде."
2005405-59 = "Разумеется, сомневаюсь, что «великие проектировщики» этого континента намеренно делали его достойным осмотра достопримечательностей."
2005405-60 = "Но вы же знаете, как устроен этот мир..."
2005405-61 = "Ничто никогда не сводится лишь к ясным намерениям и результатам."
2005405-62 = "Астрология, нумерология, символизм... и, возможно, вещи, которые нам ещё только предстоит открыть..."
2005405-63 = "Будто части «мира» раскрываются перед нами одновременно открыто и тайно."
2005405-64 = "Хотя, боюсь, мои исследования здесь будут мало применимы."
2005405-65 = "[s] «Почему?»"
2005405-66 = "Наверное, потому что здешние «законы небес» совершенно отличаются от тех, которые я изучала."
2005405-67 = "Положение звёзд, их движение и формулы, которым они подчиняются..."
2005405-68 = "В каком-то смысле мы нашли место, которое действительно можно назвать новым небом и новой землёй."
2005405-69 = "Конечно, я могла бы с нуля построить совершенно новую единую астрологическую теорию."
2005405-70 = "Это было бы по-настоящему увлекательно, но..."
2005405-71 = "Жаль, что времени на это, похоже, совсем нет."
2005405-75 = "― [log=히마리 결전]Любопытно.[/log][wa:140]"
2005405-77 = "― [log=히마리 결전]Мы можем смотреть на ночное небо почти как в Миллениуме.[/log][wa:840]"
2005405-80 = "― [log=히마리 결전]Но звёзды, сияющие здесь, немного отличаются от знакомых нам.[/log][wa:2190]"
2005405-82 = "― [log=히마리 결전]Это загадочное ощущение... которое мне трудно выразить словами.[/log][wa:1280]"
2005405-85 = "[ns] «Но для меня ты ещё загадочнее, Химари.»"
2005405-86 = "― [log=히마리 결전]Что...? [/log][wa:320]"
2005405-88 = "― [log=히마리 결전]С-Спасибо. Я-я приму это за комплимент.[/log][wa:5750]"
2005405-91 = "― [log=히마리 결전]...Даже если мы все под одним ночным небом,[/log][wa:10]"
2005405-93 = "― [log=히마리 결전]полагаю, не всем дано понять друг друга.[/log]"
2005405-96 = "― [log=히마리 결전]Но раз уж мы хотя бы под одним небом,[/log][wa:1800]"
2005405-98 = "― [log=히마리 결전]это может стать возможностью понять друг друга. [/log][wa:1510]"
2005405-101 = "― [log=히마리 결전]По крайней мере, я в это верю.[/log][wa:2650]"
2005405-103 = "― [log=히마리 결전]А вы, Сенсей?[/log][wa:1690]"
2005405-108 = ""
2005405-109 = "Ну как, Сенсей? Сегодняшняя... эксплуатация коляски."
2005405-110 = "[s3] «Впечатляет, это точно.»\n[s4] «Давай как-нибудь ещё прокатимся!»"
2005405-113 = "А? А-Ага..."
2005405-114 = "Подумать только, вы сами это предложили..."
2005405-115 = "Кхм."
2005405-116 = "Ну что, Сенсей?"
2005405-117 = "Возвращаемся. Времени как раз хватит, чтобы ехать не спеша... и прибыть до того, как кто-нибудь начнёт волноваться."
2005405-120 = "Обратная поездка, как и обещала Химари, стала образцом безопасного вождения... НЕТ, безопасной «эксплуатации»."
