[translation]
1600105-1 = "Сюрприз от горничной"
1600105-3 = "(Я снова работаю всю ночь. Как бы ни старался, мои страдания не заканчиваются.)"
1600105-8 = "(Я лишь на секунду положил голову на стол — и тут же отключился.)"
1600105-11 = "(...)"
1600105-12 = "...сподин?"
1600105-13 = "Господин?"
1600105-15 = ""
1600105-16 = "Господин? Странно. Ты уже должен был проснуться."
1600105-17 = "[s] «Асуна?»"
1600105-18 = "Теперь проснулся! Ну как ты, Господин? Я пришла, как и обещала!"
1600105-19 = "Ты выглядел таким уставшим, что я решила: отличный шанс отплатить тебе добром."
1600105-20 = "Наверное, ты гадаешь, где находишься. Я подняла тебя, пока ты спал, и принесла в общежитие."
1600105-21 = "Чего так удивился? Серьёзно! Усталость — не повод засыпать прямо за столом."
1600105-22 = "Я нашла тебя среди горы бумаг и пустых банок из-под энергетиков. Так ты здоровье угробишь, знаешь?"
1600105-23 = "Иди сюда. Выкинь всё из головы и позволь мне о тебе позаботиться, ладно?"
1600105-24 = "Я заказала нам еду, Господин. Должны привезти с минуты на минуту."
1600105-25 = "Что? Странно, что горничная заказывает доставку?"
1600105-26 = "И хочешь знать, как я вообще попала внутрь? Через входную дверь, конечно."
1600105-27 = "О, а откуда я знала код от двери?"
1600105-28 = "Не знаю. Нажала кнопки, которые показались правильными, и она открылась."
1600105-29 = "Ха-ха-ха! Опять это лицо! Ты такой милый, Господин."
1600105-30 = "А?"
1600105-31 = "У тебя ещё остались бумаги? А, те, что лежали на столе?"
1600105-32 = "Я уже разобралась. Ну, я их не читала, если что."
1600105-33 = "Просто сложила вместе те, которые выглядели похожими. Принести тебе?"
1600105-34 = ""
1600105-35 = "(Асуна быстро принесла несколько разобранных документов и показала мне.)"
1600105-36 = "(Несмотря на то что она сортировала наугад, документы оказались на удивление хорошо организованы.)"
1600105-37 = "Как у меня так хорошо получилось? Я же сказала — просто делала обоснованные догадки."
1600105-38 = "По твоему лицу видно, что ты доволен. Отлично!"
1600105-39 = "О, и я уже убрала твой кабинет и постирала вещи, так что о домашних делах тоже можно не думать."
1600105-40 = "Ну, чего теперь хочешь? Можешь попросить меня о чём угодно, кроме работы!"
1600105-41 = "Просто поесть? Принять ванну? Или..."
1600105-42 = "[s1] «Плечи немного затекли...»\n[s2] «Можно попросить о массаже?»"
1600105-43 = "Ого-ого! Смотри-ка, Господин уже освоился и начал просить услуги у своей горничной."
1600105-44 = "Ого-ого! Смотри-ка, Господин уже освоился и начал просить услуги у своей горничной."
1600105-45 = "Один пятизвёздочный массаж от Асуны — сейчас будет!"
1600105-46 = "Так-так. Повернись и сядь."
1600105-47 = ""
1600105-48 = "Начинаем с шеи... и вот так слегка надавливаем на плечи руками."
1600105-52 = "(Прикосновения Асуны мягкие, но достаточно сильные, чтобы снять напряжение в мышцах.)"
1600105-53 = "Ну как? Что чувствуешь?"
1600105-54 = "Ха-ха. Мурчишь прямо как котёнок!"
1600105-55 = "Так, готово! Лучше стало, Господин?"
1600105-56 = "Ты будто совершенно новый Сенсей. Отлично. Я почему-то даже горжусь собой!"
1600105-57 = "Говоришь, я выгляжу бодрее тебя? Это естественно. Я ведь горничная."
1600105-58 = "Для горничной нет большей радости, чем услышать, что она хорошо услужила господину!"
1600105-59 = "Ты только что сказал, что я больше секретный агент, чем горничная? Ха-ха. Не будем цепляться к мелочам..."
1600105-60 = "Что... это было?"
1600105-61 = "Ты хочешь..."
1600105-62 = "...поухаживать за мной?"
1600105-63 = "Что ты имеешь в виду? Как господин может прислуживать своей горничной?"
1600105-64 = "О! Хочешь размять мне плечи, как я тебе? Мне?"
1600105-65 = "О-о-о, звучит весело! Горничной для разнообразия самой послужат."
1600105-66 = "Тогда я повернусь и сяду. Вот так!"
1600105-67 = ""
1600105-68 = ""
1600105-69 = "Ну, раз настаиваешь. Я готова, Господин!"
1600105-70 = "[s] (Помассировать плечи Асуны.)"
1600105-72 = "..."
1600105-73 = "А?!"
1600105-74 = "...?"
1600105-75 = "[s] «...?»"
1600105-76 = "???"
1600105-77 = "Ч-Что это было? Что ты делаешь, Господин?"
1600105-78 = "Ты только что... массировал мне плечи?"
1600105-79 = "Н-Нет. Я просто удивилась..."
1600105-80 = "Я-я не против. Продолжай, а я посижу спокойно."
1600105-81 = "[s] (Помассировать Асуну у основания шеи.)"
1600105-83 = "..."
1600105-84 = "И-и!"
1600105-85 = "...?"
1600105-86 = "Ч-Что происходит? Я никогда такого не чувствовала..."
1600105-87 = "Прости, что ты сказал?"
1600105-88 = "Думаешь, лучше... остановиться?"
1600105-89 = "Н-Нет! Не то чтобы мне не нравилось. Просто..."
1600105-90 = "Э-Эм..."
1600105-91 = "Просто попробуй ещё раз! Обещаю, всё будет нормально!"
1600105-92 = "Н-Нет, я не нервничаю! Так что...!"
1600105-93 = "...Давай. Пожалуйста, попробуй ещё раз, Господин."
1600105-94 = "Е-Ещё немного..."
1600105-97 = "Достааавка!"
1600105-98 = "(...)"
1600105-99 = "(После того как мы с Асуной поели вместе, я отправил её домой.)"
