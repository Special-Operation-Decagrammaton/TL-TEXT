[translation]
10030030-1 = "Эпизод 3;Скука убивает хакера"
10030030-3 = ""
10030030-4 = ""
10030030-5 = ""
10030030-6 = "...Ого. Сколько же мы уже читаем?"
10030030-7 = "За чтением я совсем потеряла счёт времени."
10030030-8 = ""
10030030-10 = ""
10030030-11 = "Ну как, Сенсей? Вам было скучно проводить время на улице?"
10030030-12 = "[s1] «Давно я так не отдыхал.»\n[s2] «Я уже забыл, как люблю читать...»"
10030030-15 = "Я заметила, что смена привычной рабочей обстановки заметно повышает концентрацию."
10030030-16 = "В спокойных местах вроде этого леса меньше отвлекает внешний мир. Они идеально подходят для чтения... и программирования."
10030030-17 = "В этот раз было важно, чтобы все в клубе оставили устройства, но, может быть, в следующий раз мы сможем приехать сюда с ноутбуками без подключения к сети и поработать над кодом..."
10030030-18 = ""
10030030-20 = ""
10030030-21 = "Надеюсь, остальные тоже наслаждаются тишиной..."
10030030-22 = ""
10030030-24 = ""
10030030-25 = ""
10030030-26 = ""
10030030-29 = ""
10030030-30 = "...А? Куда они все делись?"
10030030-31 = "[s] «Кажется, они говорили, что пойдут прогуляться?»"
10030030-32 = "Хм... Это хорошо, но после всех жалоб на то, как тяжело было сюда идти, сомневаюсь, что они ушли далеко."
10030030-33 = "Я переживаю... А вдруг они сошли с тропы или затеяли что-нибудь вне моего поля зрения?"
10030030-34 = ""
10030030-36 = ""
10030030-37 = "Сенсей, давайте проверим их."
10030030-38 = "С выносливостью наших членов клуба они наверняка где-то рядом."
10030030-39 = "[s3] «Жёстко, но справедливо...»\n[s4] «Тогда и мы прогуляемся?»"
10030030-45 = "Немного позже..."
10030030-50 = ""
10030030-53 = ""
10030030-56 = "Не это... И это тоже не то..."
10030030-57 = ""
10030030-60 = ""
10030030-61 = "...Что ты делаешь, Харэ?"
10030030-62 = ""
10030030-64 = ""
10030030-65 = "А, Чихиро."
10030030-66 = "Ничего важного. Просто собирала траву и сорняки вокруг лагеря."
10030030-67 = "Ты ищешь четырёхлистный клевер?"
10030030-68 = "Это, конечно, может быть весело, но, по-моему, клевера здесь почти не растё—"
10030030-69 = "Нет, я не искала клевер..."
10030030-70 = "...Я проверяла, не похож ли вкус какой-нибудь из этих трав на энергетик."
10030030-71 = ""
10030030-73 = ""
10030030-74 = "...Что?"
10030030-75 = "Что ты такое говоришь? Ни одно местное растение не может быть по вкусу как энергетик."
10030030-76 = "Не правда. Например, это растение немного кислое, но сладкое и от него язык как будто немеет..."
10030030-77 = ""
10030030-79 = ""
10030030-80 = ""
10030030-81 = "Так что ощущение немного похоже на мои энергетики..."
10030030-82 = "Это разве не аллергическая реакция?"
10030030-83 = "Выплюнь! Харэ, сейчас же выплюнь!"
10030030-84 = "Но я больше не могу... Руки и ноги дрожат, энергии совсем нет..."
10030030-85 = "Кофеин... Мне нужен кофеин..."
10030030-86 = "О боже... У неё уже помутнение сознания от кофеиновой ломки."
10030030-87 = "Но что нам делать? Поблизости никаких магазинов, не говоря уже о круглосуточном с энергетиками."
10030030-88 = ""
10030030-91 = "[ns5] «Я принёс кофе в термосе...»\n[ns6] «Вот, Харэ, выпей.»"
10030030-92 = ""
10030030-93 = ""
10030030-95 = ""
10030030-96 = "Кофееее..."
10030030-101 = "Фух... Теперь намного лучше."
10030030-102 = "Это не так хорошо, как энергетик, но с кофеином в организме мне гораздо лучше."
10030030-103 = "Спасибо, Сенсей. Вы спасли мне жизнь."
10030030-104 = "Если бы Сенсей не помог, я бы уже начала пробовать остальную траву..."
10030030-105 = "[s7] «Рад, что мой кофе помог...»\n[s8] «Пожалуйста... не говори так при своём учителе.»"
10030030-108 = "Тебе стоит сократить количество энергетиков, если всего полдня без них вызывают такие симптомы отмены!"
10030030-109 = "О чём ты? Энергетики — самое эффективное топливо для интеллектуальной деятельности!"
10030030-110 = "Я могу работать всю ночь без еды, но без энергетика не напишу ни одной строки кода!"
10030030-111 = "Это урок на будущее: в следующий раз надо взять порошковый энергетик и разводить его в воде..."
10030030-112 = ""
10030030-114 = ""
10030030-115 = "А? Ты хочешь снова пойти в поход?"
10030030-116 = ""
10030030-118 = ""
10030030-119 = "Слава богу. Я боялась, что вам сразу всё надоест и вы больше никогда не захотите идти..."
10030030-120 = "Надо будет вскоре запланировать ещё одну поездку."
10030030-121 = "Угх…"
10030030-122 = "Ладно, а куда делись Маки и Котама? Разве они не были с тобой?"
10030030-123 = "Насчёт Котамы не знаю..."
10030030-124 = "Но я видела, как Маки направилась к той пещере."
10030030-125 = "Она заметила у входа какой-то камень или что-то такое и убежала, бормоча про художественное вдохновение."
10030030-127 = "...Художественное вдохновение?"
10030030-128 = "[s] «Она что, решила заняться скульптурой?»"
10030030-129 = "Но у нас в лагере нет инструментов для скульптуры..."
10030030-130 = ""
10030030-132 = ""
10030030-133 = "...Давайте проверим."
10030030-137 = ""
10030030-138 = ""
10030030-139 = ""
10030030-141 = ""
10030030-142 = ""
10030030-143 = "Хм... Это не тот цвет, который я хотела..."
10030030-144 = "Если бы только у меня была трёхцветная краска-спрей, которую я оставила в клубной комнате... Хотя бы красной хватило бы..."
10030030-145 = ""
10030030-148 = ""
10030030-149 = "...Маки, что ты делаешь?"
10030030-150 = ""
10030030-152 = ""
10030030-153 = "А, Чихиро."
10030030-154 = "Это, эм... У меня не получается нужный цвет."
10030030-155 = "...Цвет? Ты здесь что-то рисуешь?"
10030030-156 = "Типа того. Посмотри на эту стену. Я тут кое над чем работала..."
10030030-157 = ""
10030030-159 = ""
10030030-161 = "Наскальная живопись!"
10030030-162 = ""
10030030-164 = ""
10030030-167 = ""
10030030-168 = "Погоди, что это..."
10030030-169 = "...Как ты вообще это нарисовала?"
10030030-170 = "Я смешала уголь от обгоревшего дерева с глиной и сделала пигмент."
10030030-171 = "Я читала, как одни из первых художников делали настенные рисунки, и решила попробовать сама... Но оказалось сложнее, чем я думала."
10030030-172 = "[s9] «По-моему, выглядит впечатляюще...»\n[s10] «...Но почему именно наскальная живопись?»"
10030030-173 = "Я ходила вокруг в поисках сигнала, и меня вдруг осенило вдохновение."
10030030-174 = "Я ходила вокруг в поисках сигнала, и меня вдруг осенило вдохновение."
10030030-175 = "Но у меня не было ни холста, ни бумаги..."
10030030-176 = "Мой пылкий художественный дух просто переполнял меня, поэтому..."
10030030-177 = ""
10030030-180 = "Я решила нарисовать фреску прямо на стене пещеры!"
10030030-183 = "Серьёзно, стоит мне отвернуться на секунду, и вы уже находите, во что вляпаться."
10030030-184 = "Обязательно было портить окружающую среду граффити даже здесь?"
10030030-185 = "Это не граффити! Граффити — вид уличного искусства в открытых общественных местах."
10030030-186 = "К тому же никому не помешает рисунок на стене пещеры, в отличие от чужого здания."
10030030-187 = "Ещё как помешает!"
10030030-188 = "Природу нужно оставлять нетронутой, чтобы ею могли наслаждаться все! А если кто-нибудь найдёт это и примет за настоящую древнюю наскальную живопись?"
10030030-189 = "А, всё нормально. Закрепителя нет, так что после следующего дождя всё должно смыться."
10030030-190 = "[s] «Что это за огромная штука посередине?»"
10030030-191 = ""
10030030-193 = ""
10030030-194 = "А, это кубистическая интерпретация Башни Миллениума!"
10030030-197 = "Я хотела передать стремление Миллениума к гармонии через союз теории и доказательства, изобразив башню на геометрическом уровне."
10030030-198 = "[s] «А эти штуки вокруг, похожие на муравьёв, это...»"
10030030-199 = "Они изображают учеников в кафе Башни Миллениума после обеда!"
10030030-200 = "Там всегда шумная толпа, потому что после еды все идут покупать кофе..."
10030030-201 = "[s] «...А это рогатое существо на вершине башни?»"
10030030-202 = ""
10030030-204 = ""
10030030-205 = "—Это, эм... Это Юука разбирается с чеками в Семинаре."
10030030-206 = "...Похоже, личная предвзятость немного испортила изначальный замысел моей работы."
10030030-207 = "Не верится, что ты приехала в такую даль лишь затем, чтобы тратить время на насмешки над казначеем Семинара."
10030030-208 = "Маки, что Юука вообще тебе сделала, если ты постоянно устраиваешь ей такие розыгрыши?"
10030030-209 = "Это не розыгрыш! Это искусство!"
10030030-212 = "Ладно, ты видела Котаму?"
10030030-213 = "Я спрашивала Харэ, и она не знает, куда ушла Котама..."
10030030-214 = ""
10030030-217 = ""
10030030-218 = "А, Котама..."
10030030-219 = "Она сказала, что ей нужно кое-что сделать, и ушла в лес вон туда."
10030030-220 = ""
10030030-223 = ""
10030030-224 = "Одна ушла в лес?"
10030030-225 = "[s] «Есть проблема?»"
10030030-226 = "Мм, может, я и переживаю зря, но потеряться иногда намного проще, чем кажется. А в это время года дикие животные подходят к лагерям в поисках еды..."
10030030-227 = "Если она зайдёт слишком глубоко, может наткнуться на медведя."
10030030-228 = "[s] «...Разве это не серьёзная проблема?»"
10030030-229 = "Ага. А Котама, когда чем-то увлечена, вообще перестаёт замечать, что происходит вокруг..."
10030030-230 = ""
10030030-232 = ""
10030030-233 = "Так что давайте найдём её, пока она не попала в неприятности."
10030030-234 = "И Маки, обязательно смой эту фреску, прежде чем вернёшься."
10030030-235 = ""
10030030-237 = ""
10030030-240 = "А, Чихиро! Не оставляй меня здесь!"
