10023095-14 = "Наверное, большего ожидать и не стоило, но такое грубое приветствие всё равно сбивает меня с толку."
10023095-15 = "Так ты и правда охотилась за Короной Короля Часов...!"
10023095-16 = "Я думала, эту часть вы уже поняли?"
10023095-17 = "Замолчи! Она моя! Моя, ясно?! И если кто-то хочет её получить, пусть готовится заплатить достойную цену!"
