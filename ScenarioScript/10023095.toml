10023095-20 = "Меня уже тошнит от твоей болтовни! Эти горничные C&C годились только своей репутацией, а даже она мне ничем не помогла!"
10023095-21 = "А, понятно. Естественно, ты ожидал от них результата, хотя заставил действовать на основе полностью ложных вводных. Ну конечно."
10023095-22 = "Но раз уж заговорили о C&C, ты вообще всё проверил? Например, убедился, что нанял тех самых горничных?"
10023095-23 = "А? В смысле?"
10023095-24 = "О, ничего. Наверное, ты был слишком занят, пересчитывая свои грязные аукционные Кредиты, чтобы замечать кого-то кроме себя."
