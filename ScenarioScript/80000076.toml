[translation]
80000076-1 = "Обязательства и празднование"
80000076-2 = "Заброшенное здание в зоне строительства"
80000076-3 = "Я отвечаю за безопасность всех остальных."
80000076-4 = "[s] «Да. Я знаю.»"
80000076-5 = "Эта встреча с вами — тоже часть моей ответственности, Сенсей."
80000076-6 = "Хочу, чтобы вы это помнили."
80000076-7 = "[s1] «Понятно.»\n[s2] «Так чем мы займёмся?»"
80000076-8 = "Ну... Видите ли..."
80000076-9 = "Ну... Видите ли..."
80000076-10 = "Для начала нужно проверить, надёжно ли подключены коммунальные линии."
80000076-11 = "Нельзя жить в здании с небезопасными коммуникациями. Электричество, вода, газ... Если что-то случится..."
80000076-12 = "И сюда не придёт ни инспектор здания, ни контролёр счётчиков, так что проверять приходится нам."
80000076-13 = "Уже думаете, что это слишком опасно?"
80000076-14 = "Для нас это обычная работа. Пожалуйста, не забывайте."
80000076-15 = "[s3] «Но электричество и вода явно работают...»\n[s4] «Значит, обслуживание коммунальных сетей уже завершено?»"
80000076-16 = "..."
80000076-17 = "..."
80000076-18 = "Вы умнее, чем выглядите, Сенсей."
80000076-19 = "Отлично. Переходим к следующей задаче."
80000076-20 = "[s5] «Ой. Это почти прозвучало обидно.»\n[s6] «Вся работа уже сделана, и нам ничего не нужно делать!»"
80000076-21 = "Успокойтесь. Разве не вы должны быть ответственным взрослым?"
80000076-22 = "Успокойтесь. Разве не вы должны быть ответственным взрослым?"
80000076-23 = "Дальше... Посмотрим."
80000076-24 = "Нужно проверить, безопасна ли дорога."
80000076-25 = "В каком-то смысле безопасность здесь хуже, чем в Ариусе."
80000076-26 = "Никакого порядка вообще."
80000076-27 = "Если что-нибудь случится, мы должны убедиться, что пути входа и выхода свободны и безопасны."
80000076-28 = "[s7] «Но я вошёл сюда без каких-либо трудностей...»\n[s8] «Разве это не значит, что вход безопасен?»"
80000076-29 = "..."
80000076-30 = "..."
80000076-31 = "Отлично. В данном случае ваша оценка полезна."
80000076-32 = "Я не злюсь из-за того, что вы решили проблему. С чего бы мне злиться?"
80000076-33 = "Конечно, я не злюсь."
80000076-35 = "Мисаки настояла ещё на нескольких «проверках безопасности»."
80000076-36 = "Большинство прошло без каких-либо проблем."
80000076-38 = "..."
80000076-39 = "[s] «Нам ещё нужно что-нибудь проверить, Мисаки?»"
80000076-40 = "Это было... неожиданно."
80000076-41 = "[s] «Что ты сказала?»"
80000076-42 = "Я ничего не говорила."
80000076-43 = "[s] «Но...»"
80000076-44 = "Я сказала, что ничего не говорила."
80000076-45 = "[s] «В любом случае, Мисаки...»"
80000076-47 = "[ns] «У тебя из кармана торчит коробка.»"
80000076-48 = "...?!"
80000076-49 = "Д-Давно вы заметили?"
80000076-50 = "[s9] «Хм. Я заметил, когда ты захотела провести проверку безопасности...»\n[s10] «После того как мы проверили прочность того заброшенного здания?»"
80000076-51 = "...!"
80000076-52 = "...!"
80000076-53 = "Какой кошмар..."
80000076-54 = "[s] «Это, случайно, не...»"
80000076-55 = "Нет! Ничего не говорите."
80000076-56 = "..."
80000076-57 = "После долгого молчания Мисаки сунула шоколад мне в руки."
80000076-58 = ""
80000076-60 = ""
80000076-62 = "[ns11] «Шоколад от тебя, Мисаки?»\n[ns12] «Спасибо! Я буду им дорожить!»"
80000076-63 = "*вздох* ...Вот именно поэтому я и не хотела..."
80000076-64 = "*вздох* ...Вот именно поэтому я и не хотела..."
80000076-65 = "Ладно. Раз уж я его отдала, лучше насладитесь им."
80000076-66 = "Просто сегодня для этого подходящий день..."
80000076-67 = "И, может быть, я вам... совсем чуть-чуть должна, Сенсей."
80000076-68 = "Но ничего больше это не значит. Понятно?"
80000076-69 = "Ну?! Перестаньте так улыбаться и ответьте!"
80000076-71 = "Я наслаждался шоколадом, пока покрасневшая Мисаки продолжала на меня огрызаться."
