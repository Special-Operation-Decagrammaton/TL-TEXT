[translation]
10034060-1 = "Эпизод 6;Та, кто достойна своего места"
10034060-3 = "Поздно ночью..."
10034060-4 = ""
10034060-8 = ""
10034060-9 = ""
10034060-10 = "[ns1] «...Я так и думал, что ты будешь здесь.»\n[ns2] «Айри, я тебя искал.»"
10034060-13 = "...? О-о... Сенсей...?"
10034060-14 = "Ч-что вы делаете здесь так поздно?"
10034060-15 = "...А? Вы меня искали?... Всё это время? К-как долго?"
10034060-16 = "Зачем вы... Что-то случилось?"
10034060-17 = "Вы могли мне позвонить или написать в MomoTalk..."
10034060-18 = "Ч-что значит «сейчас это неважно»...?"
10034060-19 = "...А?"
10034060-20 = "...Я...?"
10034060-21 = "[s3] «Ты ищешь Цумуги, да?»\n[s4] «Это часть моих обязанностей учителя.»"
10034060-24 = "Эм..."
10034060-25 = ""
10034060-27 = ""
10034060-28 = "...Понятно. Вот что случилось. Конечно, именно это и случилось."
10034060-29 = "Значит, вы пришли уговорить меня вернуться."
10034060-30 = "Остальные попросили вас об этом? Или вы пообещали им, что сделаете это?"
10034060-31 = "Вот почему вы пришли, не позвонив. Понятно."
10034060-32 = "Потому что знаете, что я ищу здесь Цумуги."
10034060-33 = "[s5] «Да, но тебе пока не обязательно возвращаться.»\n[s6] «Не волнуйся. Я пришёл не для того, чтобы утащить тебя силой.»"
10034060-36 = "Это... правда? Вы не просто так говорите?"
10034060-37 = "Не знаю. Раз вы пришли сюда, значит, наверняка знаете всю историю..."
10034060-38 = "Мне всё кажется, что вы скажете что-нибудь доброе, а потом отведёте меня обратно в клуб."
10034060-39 = "Но..."
10034060-40 = "Это ничего не решит. Сенсей, моя проблема не в них."
10034060-41 = "Серьёзно, они все невероятно добрые. Они замечательные друзья. Лучше я и пожелать не могла."
10034060-42 = "...Проблема во мне."
10034060-43 = "Я не могу быть обузой для таких друзей. Я ни за что не успею научиться достаточно хорошо, чтобы пройти прослушивание."
10034060-44 = "Так что хотя бы если я сейчас найду Цумуги... Ведь у Цумуги с выступлением никаких проблем не будет..."
10034060-45 = ""
10034060-47 = ""
10034060-48 = ""
10034060-49 = "...Я хочу сказать..."
10034060-50 = "Простите, Сенсей... Я знаю, вы пришли не за тем, чтобы говорить об этом..."
10034060-51 = "Но... Но всё же..."
10034060-52 = "Если так будет дальше..."
10034060-53 = "Если так будет дальше, то..."
10034060-54 = "Я больше... не справляюсь со всем этим..."
10034060-55 = "Я больше не могу. Простите, Сенсей."
10034060-56 = ""
10034060-59 = "[ns7] «Говори всё, что тебе нужно сказать, Айри.»\n[ns8] «Здесь ты в безопасности. Можешь рассказать мне всё.»"
10034060-62 = "..."
10034060-63 = "...Два листа..."
10034060-64 = "Я отстаю на два листа. По прогрессу... все остальные намного впереди меня..."
10034060-65 = "Только я едва... Я даже не могу держать с ними один темп..."
10034060-66 = "Хотя... именно я репетирую больше всех..."
10034060-67 = "Я относилась к этому серьёзнее всех... Только я занималась до поздней ночи... Только я по-настоящему изучала теорию..."
10034060-68 = ""
10034060-70 = ""
10034060-71 = "Я..."
10034060-72 = "Ведь это я с самого начала попросила всех присоединиться..."
10034060-73 = "[s9] «...Иногда всё складывается именно так.»\n[s10] «Наверное, тебе очень тяжело.»"
10034060-76 = "...Да. То есть, конечно, иногда всё просто идёт не так, как хочется..."
10034060-77 = "Я знаю, что так бывает. С этим я ещё могу смириться. Но..."
10034060-78 = "Но... когда мне было тяжело, все говорили мне..."
10034060-80 = "«Всё нормально. Всё получится.»"
10034060-81 = "«Нам достаточно научиться играть настолько хорошо, чтобы получить semla. Можно играть просто „нормально“.»"
10034060-82 = "«Не напрягайся.» «Мы делаем это вместе.» «Мы прикроем друг друга...»"
10034060-83 = ""
10034060-84 = "Они говорили всё это ради меня. Чтобы мне стало легче. Я понимаю."
10034060-85 = "То есть разумом я это понимаю. Но..."
10034060-86 = "Для меня, той меня, что внутри, каждое их слово звучало совсем иначе."
10034060-88 = "Будто: «Ты слабое звено. Ты хуже всех.»"
10034060-89 = "«Ты...» «Ты даже не можешь играть „нормально“. Ты даже не „достаточно хороша“.»"
10034060-90 = "«Мы потащим тебя за собой, но нам придётся исправлять твои ошибки.»"
10034060-91 = ""
10034060-92 = "Это снова и снова крутилось у меня в голове... и дошло до того..."
10034060-93 = ""
10034060-95 = ""
10034060-96 = "Дошло до того... что я вообще больше не хотела их слушать."
10034060-97 = ""
10034060-98 = "«Как они могут не понимать, что я чувствую?»"
10034060-99 = "«Они относятся ко всему так беспечно. Неужели никто из них не понимает, через что я прохожу?»"
10034060-100 = ""
10034060-103 = "«Или, может быть...»"
10034060-104 = "«Может, они всё понимают... и просто ждут, что я с этим сделаю?»"
10034060-106 = "И тогда я будто очнулась. Мне пришла другая мысль:"
10034060-107 = ""
10034060-109 = ""
10034060-110 = "«Хватит.»"
10034060-111 = "«Такого не может быть. Ты же знаешь, что это неправда.»"
10034060-112 = "«Перестань плохо думать о своих друзьях, Айри. Ты же знаешь их лучше.»"
10034060-113 = "«Они не виноваты, что ты ни на что не годишься. Ты правда собираешься винить их, Айри?»"
10034060-114 = ""
10034060-115 = "Теперь, когда я произношу это вслух, звучит довольно нелепо. Какая разница между друзьями, правда?"
10034060-116 = "Друзья так не делают. Я знаю. Я это знаю..."
10034060-117 = "Но я всё равно продолжаю так думать. И я... я ненавижу себя за это..."
10034060-118 = "Даже когда я стараюсь НЕ думать об этом... ничего не могу поделать, когда мысли снова уходят туда."
10034060-119 = "Это мой характер... Я не могу его изменить. Я всегда буду думать только о себе."
10034060-120 = "И однажды... что-то, что я сделаю, в итоге причинит им боль. Это неизбежно."
10034060-121 = "Поэтому лучшее, что я могла сделать, — уйти до того, как это случится."
10034060-122 = ""
10034060-124 = ""
10034060-125 = "...Почему я такая?"
10034060-126 = "Казуса такая крутая. Ёшими милая, и мне нравится, как она берёт всё в свои руки."
10034060-127 = "Нацу заботливая и особенная. А я..."
10034060-128 = "У меня нет ничего такого. А я так многого хочу."
10034060-129 = "Почему я такая эгоистичная? Почему я такая ужасная?"
10034060-130 = "И... почему только у меня нет ничего особенного? Почему я такая?"
10034060-131 = "Почему я..."
10034060-132 = "...настолько никакая?"
10034060-133 = ""
10034060-136 = "[ns11] «...»\n[ns12] «...Айри.»"
10034060-139 = "[ns13] «...Пора это сказать.»\n[ns14] «...Ты кое-чего не замечаешь.»"
10034060-142 = "...А? Что ты...?"
10034060-143 = ""
10034060-146 = "...О? Телефонный звонок..."
10034060-147 = "...А, это не мой. Это Сенсея."
10034060-148 = ""
10034060-151 = "[ns15] «...Этот номер...»\n[ns16] «...Комитет Карнавала...?»"
10034060-155 = "...А, прошу прощения за поздний звонок. Это Сенсей из Шале?"
10034060-156 = "Не пугайтесь, но мы..."
10034060-158 = "Мы задержали троих ваших студентов."
