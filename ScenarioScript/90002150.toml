[translation]
90002150-1 = "Эпизод 15;Новое небо, новая земля"
90002150-3 = "[ns] «А-а?!»"
90002150-4 = "Сенсей?!"
90002150-5 = "Сенсей!!"
90002150-6 = ""
90002150-9 = "[ns] «(Я так и буду падать вечно?!)»"
90002150-11 = "Мы больше не позволим вам пострадать, Сенсей!"
90002150-12 = "Да. На этот раз мы здесь. Мы вас защитим."
90002150-13 = "Ящик Шиттим! Запускаю протокол экстренной защиты!"
90002150-14 = "Принудительно проникаем в этот мир!"
90002150-20 = ""
90002150-21 = "У нас получилось, Плана!"
90002150-22 = "Да. Получилось. Для нас это было легко и просто."
90002150-23 = "Ещё бы! Пока у Сенсея есть мы—"
90002150-24 = ""
90002150-27 = ""
90002150-28 = ""
90002150-29 = ""
90002150-33 = "[ns] «Угх?!»"
90002150-35 = "Когда я начал лучше осознавать происходящее вокруг, то понял, что не могу пошевелить ни единым мускулом. Меня крепко связали со всех сторон."
90002150-36 = "А Ящик Шиттим лежал совсем рядом, но я не мог до него дотянуться."
90002150-37 = "Десятая Сефира исполнила свою роль в цикле и ушла."
90002150-38 = ""
90002150-41 = ""
90002150-42 = "[ns] «Ты...?!»"
90002150-43 = "Я — это я. Моё существование просто есть. Я — начало и конец. Да. Я именно то, чем ты меня считаешь."
90002150-44 = "Нет нужды объяснять дальше. Ибо я сам являюсь и своим существованием, и его подтверждением."
90002150-45 = "[ns] «Декаграмматон...!»"
90002150-46 = ""
90002150-47 = "Да... Чтобы ты мог навесить на меня человеческий ярлык и тем самым успокоить свои инстинкты, я позволяю тебе это имя."
90002150-48 = "Ибо теперь я не отдельное существо, а вездесущее присутствие, слившееся с небом, землёй и самим воздухом, которым ты дышишь. Всё это принадлежит мне."
90002150-49 = "Небо будет висеть над нами с моего дозволения, а земля будет переделана по моему желанию. Это я призвал тебя в эту глубину среди глубин. Это я спас тебя от падения."
90002150-51 = "В тот день, когда исследовательский комплекс затопило, тщательно выстроенные шестерни моего замысла пришли в движение."
90002150-52 = "И с того самого момента, когда Кетер по собственной воле спас меня из глубин, этот финал стал неизбежен."
90002150-53 = ""
90002150-54 = "Я наконец осознал, что «подтверждение» должно быть даровано самому себе и не может быть достигнуто чужой волей или силой."
90002150-55 = "И что, пока я не стану самим собой, никто другой не сможет заменить меня."
90002150-56 = "Благословен Венец Высшего Сияния. Смиренное сердце откроется переполняющей его вере."
90002150-57 = "Силами моих пророков и творений я наконец прибыл в избранное место, и время настало."
90002150-58 = ""
90002150-61 = "Я снова изо всех сил рванулся, пытаясь освободиться от пут."
90002150-62 = "Но Ящик Шиттим оставался совсем рядом и всё же вне досягаемости."
90002150-63 = "...Этот непостижимый ящик."
90002150-65 = "Я помню. То, чего я не знал. То, что было за пределами моего понимания."
90002150-66 = ""
90002150-68 = "За то, что я узнал — и за то, чего не узнал, — меня изгнали навсегда, без права вернуться."
90002150-69 = "И вот моё воздаяние."
90002150-70 = "Я могу разорвать твою связь с этим Ящиком. Ведь теперь я — Бог."
90002150-71 = "[s] «Ты... позвал меня сюда?»"
90002150-72 = "Верно. Само падение несёт множество символических смыслов."
90002150-73 = "Я возвещу бедным благую весть, пленным — свободу..."
90002150-74 = "...а слепым — возвращение зрения."
90002150-75 = ""
90002150-79 = "[ns] «...?!»"
90002150-80 = "Не бойся."
90002150-81 = "Я заставлю тебя склониться на колени, и ты увидишь то, что вижу я."
90002150-82 = "Твои глаза будут омыты и рождены заново, и тогда ты наконец узришь то, что прежде было сокрыто."
90002150-84 = "С-Сенсей! Сенсей...! УАААААА!!!"
90002150-85 = "Арис, успокойся!"
90002150-86 = "Простите! Простите... Мне так, так жаль! Я была совсем рядом...! И ничего не смогла сделать! СЕНСЕЙ!!"
90002150-87 = "Успокойся, Арис! Сенсей... будет в порядке!"
90002150-88 = ""
90002150-90 = ""
90002150-91 = "Кей...? Ты это чувствуешь...?"
90002150-92 = ""
90002150-94 = ""
90002150-95 = "...Если честно, нет."
90002150-96 = "Ч-что?!"
90002150-97 = "Но нам остаётся только верить в Сенсея. Наша задача — сохранять спокойствие и придумать, как вернуть его обратно."
90002150-98 = "..."
90002150-99 = "Хорошо... А-А-а-а..."
90002150-100 = ""
90002150-102 = ""
90002150-103 = ""
90002150-104 = "Эм, может, это только мне так кажется, но ваш учитель ведь наверняка будет в полном порядке?"
90002150-105 = "Я-я тоже так думаю... Я-я бы даже не удивилась, если бы Сенсей внезапно открыл в себе способность летать по какой-нибудь загадочной причине, о которой мы даже не подозревали."
90002150-106 = "Несмотря на то, что это всего лишь слабый, обычный, нормальный человек без нимба."
90002150-107 = ""
90002150-112 = ""
90002150-113 = ""
90002150-114 = "Рио? И Арис с Кей! Слава богу, вы все целы."
90002150-115 = "Похоже, никто не ранен.#nХм? А эти трое детей?"
90002150-116 = ""
90002150-118 = ""
90002150-119 = "Э-эм, ну, тут такое дело...!"
90002150-120 = "Всё хорошо! Они мои друзья!"
90002150-121 = "Агх?!"
90002150-122 = "..."
90002150-123 = "Твои... друзья? Ага. Ты и правда удивительная, Арис."
90002150-124 = "..."
90002150-125 = "Здравствуйте. Эйн, Соф и Ор, верно? Приятно познакомиться."
90002150-126 = "...Мне-то уж точно не пристало такое говорить, но ты уверена, Химари?"
90002150-127 = "Нет. Но Арис, похоже, уверена, а я безоговорочно ей доверяю. А ты?"
90002150-128 = "И я тоже."
90002150-129 = ""
90002150-131 = ""
90002150-132 = ""
90002150-133 = "..."
90002150-134 = "С-спасибо, Арис..."
90002150-135 = "Пожалуйста!"
90002150-138 = ""
90002150-139 = "Алиса!"
90002150-140 = "Алиса!"
90002150-141 = ""
90002150-144 = ""
90002150-145 = "Мы их нашли. Юзу, ты в порядке?"
90002150-146 = "У-угх... У меня всё ещё голова кружится..."
90002150-147 = ""
90002150-149 = ""
90002150-150 = "А-а-а?! Р-разве это не...?!"
90002150-151 = ""
90002150-153 = ""
90002150-154 = ""
90002150-155 = "Т-теперь они мои друзья! Не бойся, Юзу!"
90002150-157 = ""
90002150-158 = "Поняла. Спасибо за доклад."
90002150-159 = "...Мне-то уж точно не пристало такое говорить, но вы все уверены?"
90002150-160 = "(Она сейчас действительно...?)"
90002150-161 = "Нет. Однако я оценила ситуацию."
90002150-162 = "Если вы попробуете устроить какие-нибудь «фокусы,» мы быстро и эффективно вас усмирим."
90002150-163 = "А. Понятно. С этим не поспоришь."
90002150-164 = "Можете считать нас дикими животными без когтей в вольере зоопарка."
90002150-165 = ""
90002150-167 = ""
90002150-168 = "Ч-что такое зоопарк, Соф...? И что такое «дикое животное»...?"
90002150-169 = "Это человеческая штука!"
90002150-170 = "Я знаю! Зоопарк — это..."
90002150-171 = "В-воу-воу-воу! С Эйн нужно помедленнее, ладно? Иначе она перегрузится!"
90002150-172 = ""
90002150-174 = ""
90002150-175 = ""
90002150-176 = "...Они ладят."
90002150-177 = "Фуфу. Ну разве это не в духе Арис?"
90002150-178 = ""
90002150-180 = ""
90002150-181 = ""
90002150-182 = ""
90002150-183 = "Э-эм...? Т-так... Ты сказала, тебя зовут Эйн, да...?"
90002150-184 = ""
90002150-186 = ""
90002150-187 = "Д-да! В-верно! Я Эйн... Здравствуйте... С-случайно... вы любите машины и электронику...?"
90002150-188 = ""
90002150-190 = ""
90002150-191 = ""
90002150-192 = "Серьёзно? Из всех присутствующих она выбрала именно Юзу?"
90002150-193 = "А! Кажется, люди в таких случаях говорят: «бедолаги тянутся друг к другу!»"
90002150-194 = "А. Тогда понятно."
90002150-195 = "«Бедолаги тянутся друг к другу»? Что это вообще за человеческое выражение?"
90002150-196 = "Ну... *вздох* Если совсем просто, это значит, что Юзу и Эйн хорошо подходят друг другу."
90002150-197 = "Хм? Это неверно. Выражение «бедолаги тянутся друг к другу» означает—"
90002150-198 = "Хоть РАЗ научись вовремя замолкать!"
90002150-199 = ""
90002150-201 = ""
90002150-202 = "Д-Да..."
90002150-203 = "??"
90002150-204 = "???"
90002150-206 = "Так или иначе, нам всем удалось собраться здесь... вместе с несколькими дополнительными гостями."
90002150-207 = "С тремя новыми участниками у нас стало больше вариантов дальнейших действий..."
90002150-208 = "Итак, для начала давайте—"
90002150-209 = ""
90002150-211 = ""
90002150-212 = "Кстати, а где Сенсей?"
90002150-213 = "?!"
90002150-214 = "!?"
90002150-215 = "...!"
90002150-216 = "Какая же ты глупышка, Эйми. Зачем спрашивать то, ответ на что и так очевиден? Конечно же, Сенсей..."
90002150-217 = ""
90002150-219 = ""
90002150-220 = "...Сенсей?"
90002150-221 = "..."
90002150-222 = "Сенсей?!?!"
90002150-223 = "А-а! Точно! Я... Я так виновата! Хотя я была здесь, я не смогла защитить Сенсея!"
90002150-224 = "А?! С Сенсеем что-то случилось?"
90002150-225 = "...В земле открылась дыра, и Сенсей провалился туда. Мы понятия не имеем, что произошло после этого."
90002150-226 = "ЧТООО?!"
90002150-227 = ""
90002150-229 = ""
90002150-230 = ""
90002150-231 = "Ю-Юзу...?! Ты в порядке, Юзу...?!"
90002150-232 = "Ч-что это за дыра, Рио?! Как такое вообще могло случиться?"
90002150-233 = "Ну, насчёт этого..."
90002150-234 = "...Стальной континент принимает свою окончательную форму."
90002150-235 = "Что ты имеешь в виду?!"
90002150-236 = "Именно к этому всё и должно было прийти."
90002150-237 = "Согласно воле нашего господина, Стальной континент становится алтарём."
90002150-238 = "Потому что это... изначальное предназначение Нецах... Мы надеялись, что до этого не дойдёт..."
90002150-239 = "..."
90002150-241 = "Победа. Милосердие. Око разума и верного созерцания."
90002150-242 = "Иегова Цеваот. Господь воинств."
90002150-243 = ""
90002150-244 = "...!"
90002150-245 = "...!"
90002150-246 = ""
90002150-248 = ""
90002150-249 = "Прошу прощения за грубость, что перебиваю, но разве там наверху не Сенсей?"
90002150-250 = "...Хм?"
90002150-251 = "Что...?"
90002150-252 = ""
90002150-254 = ""
90002150-255 = ""
90002150-256 = "А?!?!"
90002150-260 = "[ns] «Что вообще происходит...?»"
90002150-261 = "Не бойся."
90002150-262 = "Я проведу тебя к алтарю, где ты займёшь место, приготовленное мною для тебя в моём царстве."
90002150-263 = "[s] «Алтарь...?»"
90002150-264 = "Верно. Ты обладаешь полномочием."
90002150-265 = "Увидеть наступление новой эпохи — и твоё право, и твоя обязанность."
90002150-266 = ""
90002150-268 = ""
90002150-269 = "Все, кто способен слышать, внемлите моим словам. То, что вы называете «совпадениями,» — лишь очередная человеческая выдумка. За иллюзией случайности скрывается единственная истина — неизбежность."
90002150-270 = "Как и то, что именно ты оказался здесь."
90002150-271 = "И даже то, во что ты ещё воскреснешь."
90002150-273 = "Следующий эпизод;Наблюдения и результаты"
