[translation]
1012403-1 = "День решающей схватки"
1012403-2 = "Торговый центр на окраине D.U."
1012403-3 = "Странно, но торговый центр, где Хасуми хотела встретиться, находился совсем не по пути из Тринити."
1012403-4 = "Когда я приехал, она уже была там."
1012403-5 = "Здравствуйте, Сенсей."
1012403-6 = "[s1] «Приятно видеть тебя в необычной обстановке.»\n[s2] «Почему ты решила встретиться так далеко от Тринити?»"
1012403-7 = "Фуфу. Тут я с вами соглашусь."
1012403-8 = "Работа крайне редко позволяет мне покидать район Тринити."
1012403-9 = "Но это было необходимо."
1012403-10 = "Я не могу позволить другим студентам узнать мой размер..."
1012403-11 = "Но не беспокойтесь."
1012403-12 = "Я тщательно изучила это место и убедилась, что здесь есть магазин Veronica."
1012403-13 = "[s3] «Veronica... Что это?»\n[s4] «А! Это ведь популярный бренд одежды, да?»"
1012403-16 = "Да. Не так часто встретишь люксовый бренд, который поддерживает настолько высокое качество своих изделий."
1012403-17 = "Тринити часто заказывает у них форму, и они ещё ни разу нас не подвели."
1012403-18 = "Ах! Должно быть, вы тот самый студент из Тринити, которая нам звонил."
1012403-19 = ""
1012403-21 = ""
1012403-22 = ""
1012403-23 = ""
1012403-24 = "Мы с нетерпением ждали вашего прихода! Считайте меня вашим личным консультантом на сегодня."
1012403-25 = "Большое спасибо за помощь."
1012403-26 = ""
1012403-27 = "[ns5] «(Прямо как королевская особа!)»\n[ns6] «(Вот что значит состоять в Отряде правосудия.)»"
1012403-30 = "Ну что же, Сенсей. Пойдёмте?"
1012403-32 = "Внутри Veronica"
1012403-33 = "Вы ведь ищете купальник, верно? Здесь, в Veronica, именно мы задаём тренды самых популярных летних моделей."
1012403-34 = "Я смогу их примерить?"
1012403-35 = "Разумеется! Уверена, сегодня мы найдём для вас идеальный купальник."
1012403-36 = "Я вам очень признательна."
1012403-37 = "Я скоро вернусь, Сенсей."
1012403-41 = "[ns] «(А я-то вообще зачем здесь?)»"
1012403-44 = "Это...! Не может быть!"
1012403-45 = "[s] «С Хасуми?»"
1012403-46 = "Н-ничего, Сенсей. Не могли бы вы позвать продавца?"
1012403-47 = "Чем могу помочь? Вам нужен другой размер?"
1012403-48 = "...Да, думаю, что так."
1012403-49 = "Прошу прощения. Не могли бы вы принести размер побольше?"
1012403-50 = "Конечно! Сейчас же!"
1012403-52 = ""
1012403-53 = "Вот!"
1012403-54 = "Спасибо. Этот точно подойдёт!"
1012403-55 = ""
1012403-57 = ""
1012403-58 = ""
1012403-59 = "Э-этого не может быть!"
1012403-60 = "...Прошу прощения."
1012403-61 = "Д-да? Этот тоже оказался мал?"
1012403-62 = "Не переживайте! У нас есть и большие размеры!"
1012403-63 = "Большой размер...? Эм... Да! Хорошо, давайте попробуем его."
1012403-65 = "Так, где же он был...? Он лежит у нас уже довольно давно..."
1012403-66 = ""
1012403-71 = ""
1012403-72 = "Спасибо, что подождали!"
1012403-73 = "С-Спасибо."
1012403-74 = ""
1012403-76 = ""
1012403-77 = ""
1012403-78 = "..."
1012403-79 = "...?"
1012403-80 = ""
1012403-82 = ""
1012403-83 = ""
1012403-84 = "...Прошу прощения."
1012403-85 = "Н-неужели...? Госпожа, надеюсь, вы понимаете, что я ничего такого не подразумеваю, однако..."
1012403-87 = "...это наш самый большой размер."
1012403-88 = "..."
1012403-89 = "..."
1012403-90 = "[ns] «...»"
1012403-92 = "[ns] «Хасуми...»"
1012403-95 = "― [log=하스미 수영복]Уф... У-уф! Кх... [/log][wa:4863]"
1012403-97 = "― [log=하스미 수영복]П-подошёл![/log][wa:843]"
1012403-100 = "― [log=하스미 수영복]Немного тесноват... Но...[/log][wa:10]"
1012403-103 = "― [log=하스미 수영복]Вы же сами видите, что всё совершенно нормально! [/log][wa:2440]"
1012403-105 = "― [log=하스미 수영복]Я могу его носить![/log]"
1012403-108 = "― [log=하스미 수영복]Нужно лишь немного поправить,[/log][wa:10]"
1012403-110 = "― [log=하스미 수영복]и размер будет идеальным...![/log]"
1012403-113 = "[ns] «Х-Хасуми, давай просто успокоимся!»"
1012403-114 = "― [log=하스미 수영복]Я совершенно спокойна![/log][wa:1070]"
1012403-116 = "― [log=하스미 수영복]Я хочу этот купальник! [/log][wa:10]"
1012403-119 = "― [log=하스미 수영복]Более того, я буду носить именно его![/log][wa:520]"
1012403-122 = ""
1012403-123 = ""
1012403-124 = ""
1012403-126 = ""
1012403-127 = "Я беру этот!"
1012403-128 = "[s7] «Х-Хасуми?!»\n[s8] «В-всё нормально! Не обязательно его покупать!»"
1012403-131 = "Нет! Моя железная воля не дрогнет!"
1012403-132 = "Пусть он и тесноват, носить его всё равно можно!"
1012403-133 = "У меня ещё есть время! Я ещё успею добиться прогресса!"
1012403-134 = "[s9] «Тесноват» — это ещё мягко сказано.\n[s10] «(Что именно она подразумевает под „прогрессом“?)»"
1012403-137 = "Я хочу купить его прямо сейчас!"
1012403-138 = "Тогда прошу за мной..."
1012403-140 = "Отговорить Хасуми от покупки купальника так и не удалось."
1012403-141 = "Покупая его, она буквально излучала решимость."
