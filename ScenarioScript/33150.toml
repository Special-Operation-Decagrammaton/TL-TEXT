[translation]
33150-1 = "Эпизод 15;Ответ на пятый коан"
33150-2 = "Точно."
33150-3 = "Вот к чему привела вся эта борьба."
33150-4 = "Я предупреждала Азусу, что всё закончится именно так..."
33150-5 = "...но она всё равно цеплялась за надежду."
33150-6 = "..."
33150-7 = "Пора рассказать тебе конец этой истории. Её заключение."
33150-8 = "Это финал, где всё оказывается тщетным, а попытка копнуть глубже приводит лишь к новым страданиям."
33150-9 = "Кульминация истории, где один человек вынужден убить другого — где ему приходится стать убийцей."
33150-10 = "Она должна вызвать дискомфорт, тревогу и оставить вас несчастным."
33150-11 = "Мрачная, печальная, болезненная и в итоге горькая."
33150-12 = "Но целиком правдивая."
33150-13 = "Такова суть этой истории."
33150-14 = "..."
33150-15 = "Помните, Сенсей, что вы ответили на пятый коан?"
33150-16 = "«Нужно верить в рай и доверять другим»."
33150-17 = "Вот результат этого доверия."
33150-18 = "С самого начала это был парадокс — Эдемский договор как обещание раз и навсегда положить конец ненависти."
33150-19 = "Это попросту невозможно."
33150-20 = "Иронично, что договор носит имя рая. У председателя Генерального студенческого совета всегда было довольно сомнительное чувство юмора."
33150-24 = "Вы сами это видели. Ненависть между Геенной и Тринити..."
33150-27 = "Глубоко укоренившаяся вражда Ариуса..."
33150-28 = "Договор, носящий имя недоказуемого рая, был подписан, движимый их злобой."
33150-29 = ""
33150-30 = "Подходящий конец для нас, изгнанных из рая, вам не кажется?"
33150-31 = ""
33150-33 = "[s] «Теперь я понял, Сэя.»"
33150-34 = ""
33150-36 = ""
33150-37 = "[ns] «Ты ведь тоже не знаешь, что будет дальше?»"
33150-38 = "А?"
33150-39 = "Нет, потому что знать это бессмысленно. Всё, что будет дальше, похоже на эпилог после финала."
33150-40 = "Знание принесёт лишь ещё больше печали и страданий."
33150-41 = "Тогда я не понимаю. Что именно вы «поняли», Сенсей?"
33150-42 = "[s] «Ты боишься узнать, что будет потом.»"
33150-43 = "Что... заставляет вас так думать?"
33150-44 = "[s] «Поэтому ты прячешься в своих снах и не хочешь просыпаться.»"
33150-45 = "Я не..."
33150-46 = "Сенсей, о чём вы говорите...?"
33150-47 = "[s1] «Я рад был тебя увидеть, но мне пора.»\n[s2] «Мне нужно быть в другом месте.»"
33150-48 = "Что? Вы возвращаетесь?"
33150-49 = "Что? Вы возвращаетесь?"
33150-50 = "Стойте. В отличие от меня, ваше тело ещё не восстановилось полностью."
33150-51 = "Даже если вы сейчас проснётесь, ничего не изменится. Именно это я предвижу."
33150-52 = "Такова истина мира, рассказанная семью коанами!"
33150-53 = "[s3] «Мне неинтересно доказывать существование рая.»\n[s4] «Мне нет дела до загадок коанов.»"
33150-54 = "..."
33150-55 = "..."
33150-56 = "Вы отрицаете семь коанов?"
33150-57 = "Но почему? Существование рая — главный вопрос жизни. Если нельзя доказать его, тогда нельзя доказать ничего."
33150-58 = "Вы пытаетесь сказать, что всё ещё верите в рай?"
33150-59 = "Вы не можете его доказать, но предпочитаете слепо верить, что он существует?"
33150-60 = "«Можно ли доказать, что кто-то когда-либо достиг рая?»#nЭтот вопрос на самом деле не о доказательстве существования рая..."
33150-61 = "...а просто коан о природе веры. Вы это хотите сказать?"
33150-62 = "[ns] «Прости. Мои студенты меня ждут.»"
33150-64 = "[ns] «До встречи, Сэя.»"
33150-65 = "Подождите, Сенсей! Я должна спросить ещё кое-что!"
33150-66 = "Одной верой ничего не изменить. Она не заставит ваши молитвы быть услышанными!"
33150-67 = "На чём основано убеждение, что вера способна изменить мир?!"
33150-68 = ""
33150-70 = "[ns] «Если ты веришь, что плавки от бикини — это трусики, значит, это трусики.»"
33150-71 = "...?"
33150-72 = "Т-Трусики...?"
33150-73 = "Я не совсем понимаю. И к-какое отношение к ним имеют плавки от бикини? Это какой-то коан? Я такого раньше не слышала..."
33150-74 = "[ns] Уйти."
33150-76 = "..."
33150-77 = "Вот как."
33150-78 = "Значит, вы всё-таки намерены увидеть эпилог, Сенсей."
33150-79 = "Оставив меня здесь прятаться в своих снах..."
33150-80 = ""
33150-81 = "..."
33150-82 = "Я..."
33150-83 = "Возможно, вы были правы. Может быть, я действительно боюсь узнать, что случится дальше."
33150-84 = "Что на следующей странице..."
33150-85 = "Неужели я обязана увидеть эту историю до самого конца?"
33150-86 = "Пожалуй, это мой долг."
33150-87 = "..."
33150-88 = ""
33150-90 = ""
33150-91 = ""
33150-92 = "Хорошо, Сенсей."
33150-93 = "Даже если эта история мрачная, печальная, болезненная и в итоге горькая..."
33150-94 = "...я досмотрю её до конца."
33150-96 = "Следующий эпизод;Осколки"
