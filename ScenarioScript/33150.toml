[translation]
33150-1 = "Episódio 15;A Resposta para a Quinta Regra Antiga"
33150-2 = "..."
33150-3 = "Este é o destino final de toda essa luta sem sentido..."
33150-4 = "Eu havia avisado a Azusa. Várias e várias vezes, de que tudo acabaria tendo um desfecho como este."
33150-5 = "Mesmo assim, a Azusa acabou nutrindo esperança. Uma tênue esperança."
33150-6 = "..."
33150-7 = "Eu não disse?"
33150-8 = "Este é o desfecho da história. Um final onde tudo é em vão e tudo converge para a catástrofe. Mesmo que olhe além daqui, só haverá uma sucessão de dores sem sentido."
33150-9 = "Em suma, esta é uma história onde todas são encurraladas e, no fim, alguém acaba tirando a vida de alguém. Uma história onde alguém não tem escolha a não ser se tornar uma assassina."
33150-10 = "É uma história incômoda, desagradável, abominável, de fazer franzir a testa."
33150-11 = "Uma história triste, dolorosa e melancólica... e que, ainda por cima, deixa apenas um gosto amargo na boca... Não concorda?"
33150-12 = "Contudo, é também, sem sombra de dúvida, uma história verdadeira..."
33150-13 = "Esta é a verdadeira face desta história."
33150-14 = "..."
33150-15 = "Anteriormente, você disse o seguinte a respeito da Quinta Regra Antiga, não foi?"
33150-16 = "Que \"só nos resta acreditar que o Paraíso existe\"."
33150-17 = "Pois bem, este é o resultado de ter acreditado."
33150-18 = "Era algo impossível desde o princípio. O Tratado do Éden, uma promessa mútua de que \"vamos parar de nos odiar\"."
33150-19 = "Mesmo sabendo que algo assim jamais seria possível..."
33150-20 = "E, ainda por cima, deram o nome de \"Éden\" ao tratado. Colocar o nome do Paraíso logo nisso... Como sempre, as piadas de mau gosto da Presidente do Conselho Estudantil Geral passam de todos os limites da ironia. A ponto de quase parecer pura malícia."
33150-24 = "Ao longo desse processo, houve algo que pôde ser confirmado."
33150-27 = "O rancor mútuo entre Gehenna e Trinity, acumulado pela desconfiança. E também o rancor que Arius carrega."
33150-28 = "Por meio de tudo isso, este tratado acabou se concretizando de uma forma distorcida. E, o que é mais irônico de tudo, carregando o nome daquele Paraíso... que não existe em lugar algum e que sequer pode ser provado."
33150-30 = "Talvez seja mesmo um desfecho digno de nós, que fomos expulsas do Paraíso."
33150-33 = "[s] \"...Agora eu entendi, Seia.\""
33150-37 = "[ns] \"...Você também não viu o que aconteceu depois disso, não é?\""
33150-38 = "...?"
33150-39 = "...E há necessidade de ver?"
33150-40 = "Depois de um final triste, assistir ao epílogo que o sucede só aumentaria a tristeza. Só traria mais sofrimento."
33150-41 = "...E então? O que você quer dizer com \"agora eu entendi\"?"
33150-42 = "[s] \"...Você estava com medo de ver o resto da história, não estava?\""
33150-43 = "O que..."
33150-44 = "[s] \"Foi por isso que se escondeu dentro do sonho sem conseguir acordar, vagando por aqui esse tempo todo.\""
33150-45 = "E-Eu..."
33150-46 = "Sensei... Do que exatamente você está falando...?"
33150-47 = "[s1] \"Que bom que pude me encontrar com você, Seia. Me espere um pouco.\"\n[s2] \"Tenho algo que preciso fazer, então tenho que voltar.\""
33150-48 = "Voltar...?"
33150-49 = "Voltar...?"
33150-50 = "Espere. Ao contrário de mim, o seu corpo ainda nem sequer se recuperou."
33150-51 = "E, acima de tudo, nada vai mudar só porque você acordou. Isso já está claro na minha previsão do futuro..."
33150-52 = "Não, é a verdade deste mundo, que já havia sido deduzida a partir das \"Sete Regras Antigas\"...!"
33150-53 = "[s3] \"Para falar a verdade, não tenho tanto interesse assim na prova do Paraíso.\"\n[s4] \"Jogos de palavras como as 'Sete Regras Antigas' não são a minha prioridade.\""
33150-54 = "..."
33150-55 = "..."
33150-56 = "...Pretende negar as Sete Regras Antigas?"
33150-57 = "A existência ou não do Paraíso é um dever de casa para todas as pessoas, não é? Se não pudermos provar a sua existência, nada..."
33150-58 = "...Sensei. Você ainda acredita no Paraíso?"
33150-59 = "Está dizendo que acredita cegamente, mesmo sem poder sequer provar?"
33150-60 = "\"É possível provar a verdade daqueles que alcançaram o Paraíso?\"..."
33150-61 = "Em outras palavras, você quer dizer que esta não é uma questão de provar o Paraíso, mas apenas de conseguir acreditar nele...?"
33150-62 = "[ns] \"...Desculpe, mas agora eu preciso ir salvar as minhas alunas.\""
33150-64 = "[ns] \"Até depois, Seia.\""
33150-65 = "...Espere, Sensei. Há mais uma coisa que quero lhe perguntar."
33150-66 = "Apenas acreditar não vai mudar nada."
33150-67 = "Mesmo que acredite, não há sentido nenhum nisso, não é...!?"
33150-70 = "[ns] \"Porque, se você achar que não é um maiô, e sim roupa íntima, então é roupa íntima.\""
33150-71 = "...Hã?"
33150-72 = "...Quê? Roupa íntima?"
33150-73 = "M-Mas do que você está... Maiô, roupa íntima...? De qual Regra Antiga é isso... Não, eu nunca ouvi falar de uma coisa dessas..."
33150-74 = "[ns] \"Me espere, Seia.\""
33150-76 = "..."
33150-77 = "...Já foi, é?"
33150-78 = "Você está indo rumo ao epílogo que vem a seguir, não é?"
33150-79 = "Eu... Eu..."
33150-81 = "..."
33150-82 = "Ufa..."
33150-83 = "...De fato, talvez tenha sido isso mesmo."
33150-84 = "A história que vem a seguir..."
33150-85 = "Mesmo que dê medo, eu preciso ver tudo até o fim."
33150-86 = "Esse é o meu dever, é...?"
33150-87 = "..."
33150-92 = "Não há outro jeito."
33150-93 = "Melancólica, triste e dolorosa... Mesmo que seja uma história que deixe um gosto amargo na boca até o último instante..."
33150-94 = "...Eu também vou testemunhar tudo até o fim com os meus próprios olhos."
33150-96 = "Próximo;Alguns Fragmentos"
