[translation]
1006103-1 = "Не отставать от трендов"
1006103-3 = "Я зашёл в торговый район купить кое-какие припасы для Шале."
1006103-4 = "Посреди ряда магазинов я заметил Сакурако, заглядывавшую в витрину магазина аксессуаров."
1006103-5 = ""
1006103-7 = ""
1006103-8 = "Эм... Хм..."
1006103-9 = ""
1006103-11 = ""
1006103-12 = "Хм. Это... Хм. Или, может..."
1006103-13 = "*вздыхает*"
1006103-14 = "[s1] «Привет, Сакурако.»\n[s2] «Что ты здесь делаешь?»"
1006103-15 = ""
1006103-16 = ""
1006103-18 = ""
1006103-19 = "...!? Х-хм! А. Сенсей!? К-как вы, эм, как у вас сегодня дела?"
1006103-20 = "А? Я?"
1006103-21 = "А, ну... Я просто случайно проходила через этот район, чтобы—"
1006103-22 = "Впрочем, неважно. Я проходила мимо и заметила... Я смотрела на товары в этом магазине, потому что..."
1006103-23 = "На самом деле я подумывала немного сменить аксессуары."
1006103-24 = ""
1006103-26 = ""
1006103-27 = "Не то чтобы я много знала о таких вещах или особенно ими интересовалась."
1006103-28 = "Но..."
1006103-29 = "Ну, не знаю, поймёте ли вы, но..."
1006103-30 = ""
1006103-32 = ""
1006103-34 = ""
1006103-36 = "Если я вижу, что все вокруг увлекаются каким-то хобби или стилем, а сама даже не пытаюсь в этом разобраться..."
1006103-37 = "Мне начинает казаться, будто я отстаю. Это... понятно звучит?"
1006103-38 = "[s3] «А, я прекрасно понимаю, о чём ты.»\n[s4] «Ты переживаешь из-за трендов?»"
1006103-41 = "Возможно, вы замечали, что я редко покидаю собор. Если нужно что-то сделать снаружи, обычно этим занимаются другие сёстры."
1006103-42 = "Не то чтобы мне совсем не хотелось иногда присоединяться к ним..."
1006103-43 = "Но кто-то должен оставаться и заниматься всей административной работой."
1006103-44 = "Так что, полагаю, неудивительно, что я немного отстаю от того, что происходит во внешнем мире."
1006103-45 = "Конечно, другие сёстры рассказывают мне о разном, и я стараюсь понять и представить всё по их описаниям."
1006103-46 = "Но, разумеется, иногда моё воображение расходится с реальностью."
1006103-47 = ""
1006103-49 = ""
1006103-50 = "Ну..."
1006103-51 = "Например, как с сообщением в MomoTalk, которое я отправила вам сегодня утром..."
1006103-52 = "[s5] «П-понятно. Я понимаю...»\n[s6] «Всё нормально. Это был необычный опыт.»"
1006103-55 = "Хи-хи, вы всегда так внимательны ко мне."
1006103-56 = "Спасибо, Сенсей."
1006103-57 = "В любом случае, раз уж я здесь, я подумала выбрать какой-нибудь аксессуар."
1006103-58 = "Вы, случайно, не знаете, какие дизайны сейчас в моде?"
1006103-59 = "И если знаете... не могли бы поделиться со мной этими знаниями?"
1006103-60 = ""
1006103-62 = ""
1006103-63 = "А. Что ж, жаль."
1006103-64 = "Полагаю, вы тоже довольно заняты."
1006103-65 = ""
1006103-67 = ""
1006103-68 = "Прошу прощения."
1006103-69 = "Я и так отняла достаточно вашего драгоценного времени. Дальше я сама—"
1006103-70 = ""
1006103-72 = ""
1006103-73 = ""
1006103-75 = ""
1006103-76 = "А, простите, уважаемая покупательница! Я заметила, что вы уже некоторое время смотрите на витрину. Могу чем-нибудь помочь? Ищете что-то конкретное?"
1006103-77 = "А-а. Простите. Надеюсь, я никому не мешала."
1006103-78 = "Я просто, эм... немного затрудняюсь с выбором..."
1006103-79 = "Как видите, я не очень разбираюсь в моде."
1006103-80 = ""
1006103-82 = ""
1006103-83 = "...Ага!"
1006103-85 = "Понимаю, понимаю! Не беспокойтесь, уважаемая покупательница!"
1006103-86 = ""
1006103-89 = ""
1006103-90 = "Я подберу для вас идеальный аксессуар!"
1006103-91 = ""
1006103-94 = ""
1006103-95 = "Пожалуйста, заходите, заходите! Вам, конечно, пойдёт что угодно, но у меня есть несколько вариантов для начала!"
1006103-96 = "А-а? ...Эм, подождите! Эм?!"
1006103-97 = ""
1006103-99 = ""
1006103-100 = ""
1006103-101 = "Ч... Подождите!"
1006103-102 = ""
1006103-104 = ""
1006103-106 = "[ns7] Пойти следом, потому что Сакурако нужна помощь.\n[ns8] Пойти следом, потому что, скорее всего, будет мило."
1006103-107 = ""
1006103-108 = ""
1006103-114 = "Я последовал за Сакурако и продавщицей внутрь."
1006103-115 = ""
1006103-121 = "Продавщица засыпала ошеломлённую Сакурако одним предложением за другим. Я выручил её, и мы сбежали обратно на улицу."
1006103-125 = ""
1006103-126 = "Фух. Ну и денёк."
1006103-127 = "Большое спасибо, Сенсей."
1006103-128 = "Если бы вас здесь не было... *дрожит* Даже думать не хочу, что бы произошло."
1006103-129 = "Как я и думала. Догнать остальной мир будет непросто."
1006103-130 = "...А? Вы думаете, мне вовсе не обязательно его догонять?"
1006103-131 = "Н-Но... я же сестра. Мне следует изучать такие вещи, чтобы лучше понимать других."
1006103-132 = "[s9] «Иногда лучше оставаться такой, какая ты есть.»\n[s10] «Людей успокаивает стабильность и постоянство.»"
1006103-135 = "Сенсей..."
1006103-136 = "Хи-хи... Хи-хи-хи."
1006103-137 = "Должна признать, мне очень приятно это слышать."
1006103-138 = "Ох. Я снова получаю помощь от вас. Для сестры немного неловко всё время оказываться принимающей стороной."
1006103-139 = "..."
1006103-140 = "Но... в этот раз я не могу сказать, что мне это совсем не нравится."
1006103-141 = "Интересно, почему? Несмотря на то, что все мои недостатки и слабости были у вас на виду..."
1006103-142 = "Возможно..."
1006103-143 = "Что ж, для меня вы, пожалуй, человек, который остаётся неизменным."
1006103-144 = ""
1006103-146 = ""
1006103-147 = "Вы, как сами выразились, человек «стабильный и постоянный.»"
1006103-149 = "Я проводил улыбающуюся Сакурако до собора, а затем вернулся в Шале."
