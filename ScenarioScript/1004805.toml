[translation]
1004805-1 = "Винить себя"
1004805-4 = "Получив сообщение Саори, я не мог избавиться от тревожных мыслей, поэтому отправился к ней на Чёрный рынок."
1004805-5 = ""
1004805-12 = "[ns] «В-Выстрел?!»"
1004805-13 = "Эй! Не знаю, что ты тут делаешь, но осторожнее!"
1004805-14 = "[s] «Что здесь за переполох?»"
1004805-15 = "Фракция Гав-Гав и фракция Мяу-Мяу сцепились на Чёрном рынке!"
1004805-16 = "Гав-Гавы привели какого-то невероятно сильного наёмника."
1004805-17 = "Фракция Мяу-Мяу из-за неё понесла большие потери."
1004805-18 = "Но теперь они готовят ловушку, чтобы её поймать!"
1004805-19 = "[s] «Неужели это Саори...?!»"
1004805-20 = ""
1004805-22 = ""
1004805-23 = "А?! П-Подождите!"
1004805-24 = "Западный район Чёрного рынка занят основными силами фракции Мяу-Мяу! Там опасно!"
1004805-25 = ""
1004805-29 = "Услышав это, я занервничал ещё сильнее и побежал по улицам Чёрного рынка так быстро, как мог, разыскивая Саори."
1004805-39 = "[ns] «Саори...!»"
1004805-41 = "[ns] «Саори, где ты?»"
1004805-43 = ""
1004805-47 = "Я отчаянно бродил по переулкам Чёрного рынка, разыскивая её."
1004805-50 = "*тяжело дышит* *тяжело дышит*"
1004805-51 = "[ns] «Этот голос...! Саори!»"
1004805-52 = ""
1004805-62 = "― Сенсей, что вы здесь делаете...?[wa:1870]"
1004805-65 = "[ns] «Саори, ты ранена...»"
1004805-66 = "― Ух... *вздох*[wa:780]"
1004805-69 = "― Не волнуйтесь. Такое постоянно случается.[wa:900]"
1004805-72 = "― Я просто была недостаточно осторожна...[wa:2430]"
1004805-74 = "― Ничего не изменилось...[wa:10]"
1004805-77 = "― Я обманывала себя.[wa:180]"
1004805-80 = "― *кашель* *кашель*[wa:470]"
1004805-82 = "― Не делайте такое лицо. Я привыкла к боли.[wa:1670]"
1004805-85 = "― Так было всегда."
1004805-87 = "― Правда, ничего нового."
1004805-90 = "― Я в порядке...[wa:1020]"
1004805-92 = "― Просто хочу немного посидеть вот так...[wa:2060]"
1004805-94 = ""
1004805-96 = "[ns] «Давай уйдём отсюда.»"
1004805-97 = ""
1004805-98 = "А? С-Сенсей. Подождите..."
1004805-99 = ""
1004805-105 = "[ns] «Здесь должно быть безопасно.»"
1004805-106 = "Я снова доставляю вам проблемы..."
1004805-107 = "[s] «Что произошло? Ты говорила, что у тебя работа.»"
1004805-108 = "По указанию организации, которая меня наняла, я отправилась подавить конфликт..."
1004805-109 = "Я не знала, что это ловушка, устроенная вражеской организацией..."
1004805-110 = "[s] «У тебя есть контракт?»"
1004805-111 = ""
1004805-113 = ""
1004805-114 = "Вот он..."
1004805-115 = ""
1004805-117 = ""
1004805-118 = ""
1004805-119 = ""
1004805-120 = "[ns] «...Эм, Саори. Судя по этому контракту...»"
1004805-122 = "[ns] «Ты должна в одиночку сражаться против вражеской организации — фракции Мяу-Мяу...?»"
1004805-123 = "..."
1004805-124 = "[s] «Ты вообще читала контракт...?»"
1004805-125 = "Я думала... его нужно просто подписать...?"
1004805-126 = "[s] «Саори. Всегда читай контракт перед тем, как подписывать.»"
1004805-127 = "...Хм?"
1004805-128 = "[ns] «Контракты часто пишут очень хитро...»"
1004805-129 = ""
1004805-132 = "Согласно контракту, Саори должна была зачистить западный район после первоначального конфликта."
1004805-133 = "[s] «Если подумать...»"
1004805-135 = "А?! П-Подождите!"
1004805-136 = "Западный район Чёрного рынка занят основными силами фракции Мяу-Мяу! Там опасно!"
1004805-138 = ""
1004805-140 = "По дороге сюда я слышал, что западный район опасен, потому что его заняли основные силы фракции Мяу-Мяу."
1004805-141 = "Мы далеко от западного района, но если Саори пошла туда, куда указывал контракт..."
1004805-142 = "[s3] «Получается... если бы ты прочитала контракт, всё могло закончиться ещё хуже.»\n[s4] «Работодатель, похоже, не ожидал, что ты вообще не станешь его читать...»"
1004805-143 = "Судя по ситуации и тому, с чем столкнулась Саори..."
1004805-144 = "Судя по ситуации и тому, с чем столкнулась Саори..."
1004805-145 = "Похоже, фракция Гав-Гав, её работодатель, наняла Саори только для того, чтобы от неё избавиться."
1004805-146 = ""
1004805-149 = "Это значит..."
1004805-150 = "[s] «В этот раз тебе повезло, но дальше внимательно читай контракты, Саори.»"
1004805-151 = "О. Меня снова обманули?"
1004805-152 = "Не удивлена. Это не первый раз."
1004805-153 = "[s] «Саори...»"
1004805-154 = "Пожалуйста, не поднимайте из-за этого шум."
1004805-155 = "[ns] «Если ты так хочешь. А теперь давай тебя накормим.»"
1004805-156 = ""
1004805-158 = ""
1004805-159 = "Еда? Ч-Что вы говорите?"
1004805-160 = "[s5] «Твоё тело вымотано. Ему нужно топливо.»\n[s6] «Оставь это в прошлом. Сейчас тебе нужна горячая еда.»"
1004805-161 = "Просто пойти поесть...?"
1004805-162 = "Просто пойти поесть...?"
1004805-163 = ""
1004805-165 = ""
1004805-166 = ""
1004805-168 = ""
1004805-169 = "П-Подождите...!"
1004805-170 = ""
1004805-178 = "[ns] «Рамэн здесь довольно вкусный.»"
1004805-179 = "..."
1004805-180 = "[s] «После еды я научу тебя читать контракты.»"
1004805-181 = "Я... просто..."
1004805-182 = "[s] «Обещаешь?»"
1004805-183 = ""
1004805-185 = ""
1004805-186 = "..."
1004805-187 = "Хорошо."
1004805-188 = "Ладно, Сенсей. Давайте так и сделаем..."
1004805-189 = "Я... Сенсей..."
1004805-190 = "Мне ещё многому нужно научиться."
1004805-192 = "Мы вместе съели по вкусной миске рамэна."
1004805-193 = "А потом, пока шли по тёмным улицам, я рассказал ей всё, что мог."
