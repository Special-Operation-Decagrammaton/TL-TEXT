[translation]
10031005-215 = "#video;10031"
10031005-1 = "Пролог;Лицом к лицу"
10031005-2 = "...Кихе. Кихехе."
10031005-3 = ""
10031005-4 = "Зал заседаний Пандемониума"
10031005-6 = "Кихехехе. Кихехехе..."
10031005-7 = ""
10031005-9 = ""
10031005-10 = "Добро пожаловать, Сенсей из Шале! В Общество Пандемониума!"
10031005-11 = "[s] «А, точно. Твоё прошлое сообщение... „Я буду ждать тебя в Обществе Пандемониума“.»"
10031005-12 = ""
10031005-15 = "[ns] «Хотя фраза „Время пришло...“ меня немного смутила.»"
10031005-16 = "Кихехе. Да, понимаю."
10031005-17 = "Моё сообщение, должно быть, по-настоящему озадачило тебя."
10031005-18 = "«Ах, этот день наконец настал. Какой скрытый смысл таится в сообщении Макото в MomoTalk? Каковы намерения её лабиринтного сердца?»"
10031005-19 = "«Не следует ли мне как следует обдумать это дело, прежде чем опрометчиво вваливаться в Общество Пандемониума?» И так далее."
10031005-20 = "[s] «Я думал совсем не об этом... Но пародия получилась забавная.»"
10031005-21 = "Мм, вполне естественно, что ты так чувствуешь. Я, Великая Макото, всё прекрасно понимаю!"
10031005-22 = "Лидер организации обязан быть осторожным, особенно такой престижной, как Шале! Нет-нет, я ничуть не против."
10031005-23 = "Кекекеке! Твоя хитрость блестяще выдержала испытание!"
10031005-24 = "Ты правильно делаешь, что проявляешь осторожность! Ведь последствия нашей сегодняшней встречи будут стремительными, ошеломительными и потрясут весь мир!"
10031005-25 = "[s3] «Эм... Спасибо?»\n[s4] «...Макото, о чём ты вообще говоришь?»"
10031005-28 = "Ну что же! Раз мы дошли до этого, больше скрывать нечего!"
10031005-29 = "Я вызвала тебя сюда сегодня... чтобы услышать твой ответ на моё прежнее предложение!"
10031005-30 = "Кихехе! Интересно, какой ответ Сенсей даст на моё великолепное предложе—!"
10031005-31 = "Макото, Ибуки хочет на ручки!"
10031005-32 = "А, конечно, Ибуки. Подожди секундочку."
10031005-33 = ""
10031005-35 = ""
10031005-36 = ""
10031005-37 = ""
10031005-38 = ""
10031005-39 = "[ns] «...»"
10031005-40 = "Так, на чём мы остановились?"
10031005-41 = "О! Я, я, я! На том, что Макото хотела услышать ответ Сенсея."
10031005-42 = "А, да. Точно. Хорошая подача, Чиаки."
10031005-43 = "Ага!"
10031005-44 = "Так вот, ближе к делу..."
10031005-45 = "Я хочу услышать твой ответ, Сенсей! Прямо из первых уст."
10031005-46 = "Раз-два. Раз-два."
10031005-47 = ""
10031005-49 = ""
10031005-51 = "[ns5] «...На то, что ты предлагала раньше?»\n[ns6] «(КАКОЕ именно предложение? Если бы мне давали монету за каждую просьбу Общества Пандемониума...)»"
10031005-54 = "Хмм. Твоё лицо выдаёт тебя, Сенсей."
10031005-55 = "На нём написано: «она позвала меня сюда ради ответа, а как только мы встретились — сразу схватила за горло...»"
10031005-56 = "«Она правда готова ради этого попрать элементарную вежливость?»"
10031005-57 = "[s] «А?»"
10031005-58 = "Ты ошибаешься, Макото."
10031005-59 = "Лично мне кажется, Сенсей просто запутался, слушая, как ты ходишь кругами."
10031005-60 = "О боже. Ироха, ты совсем ничего не понимаешь."
10031005-61 = "Кихехе. Посмотри в глаза Сенсею. Это глаза лидера. Того, кто возвышается над головами других."
10031005-62 = "Это уж точно не глаза наивного добрячка-бюрократа!"
10031005-63 = "Совершенно естественно, что я, Великая Макото, лидер Общества Пандемониума, вижу смысл за таким обжигающим взглядом!"
10031005-64 = "...Примерно это она и пытается сказать, Сенсей."
10031005-65 = "[s] «С-Спасибо, Ироха. Я просто подыграю...»"
10031005-66 = "Ладно, поняла. *вздыхает*"
10031005-68 = "Кихехе!"
10031005-69 = "Конечно, я прекрасно понимаю чувства Сенсея!"
10031005-70 = "Поэтому я, Великая Макото, соблюду хорошие манеры, обычаи и элементарные нормы приличия."
10031005-71 = "В залах Общества Пандемониума я вновь делаю тебе своё предложение."
10031005-72 = "Итак...[USERNAME] Сенсей!"
10031005-73 = ""
10031005-76 = "Не желаешь ли ты объединить силы со мной, Великой Макото?! ...И Обществом Пандемониума!"
10031005-77 = "Раз-два... Сюда! Раз-два..."
10031005-78 = ""
10031005-80 = ""
10031005-81 = ""
10031005-82 = ""
10031005-83 = "[ns] «...А, так вот о чём ты всё это время говорила.»"
10031005-84 = "Ну конечно. Я так и знала, что будет что-то подобное."
10031005-85 = "Ого! Сотрудничество со Шале! Мы будем на стороне Сенсея! Мне нравится!"
10031005-86 = "Кекеке! Мне даже не нужно говорить это вслух, но Общество Пандемониума весьма могущественно!"
10031005-87 = "Если Общество Пандемониума получит стратегическую мощь Сенсея, это будет всё равно что призвать целую армию!"
10031005-88 = "Если мы объединим силы, то сможем захватить весь Кивотос... Достижение, которого не смогла добиться ни одна другая сила!"
10031005-89 = "Кекеке! И в тот день я обещаю тебе следующее..."
10031005-90 = "Когда мы вместе завоюем Кивотос..."
10031005-91 = "Я, Великая Макото, отдам Сенсею из Шале половину...!"
10031005-92 = "Половину..."
10031005-93 = "По—"
10031005-94 = "...Хм."
10031005-95 = "Я сказала это с ходу, но половина — не слишком ли много? Даже если это всего лишь устная договорённость, стоит тщательно пересмотреть условия..."
10031005-96 = "В-Верно! Даже если не ровно половина, Шале должно контролировать почти половину Кивотоса... после округления!"
10031005-97 = "Итак, Сенсей! Что скажешь на моё грандиозное предложение!"
10031005-98 = ""
10031005-101 = "[ns] «Эм...»"
10031005-102 = ""
10031005-103 = "..."
10031005-104 = ""
10031005-105 = "Раз-два!"
10031005-106 = ""
10031005-107 = "Бахахаха! Вы видели, как она сходу пообещала половину, а потом начала юлить, потому что мозг наконец включился и она поняла, что половина — слишком много!"
10031005-108 = "Это так в стиле Макото! Правда, Ироха?"
10031005-109 = "...Чиаки, это было настолько кринжово, что я даже не хотела привлекать к этому внимание."
10031005-111 = "Ургх! Заткнись! Ты! Выруби прямой эфир!"
10031005-112 = "Ладно! Каков твой ответ, Сенсей?"
10031005-113 = "Раз! Два! Все на борт экспресса Макото!"
10031005-114 = "Ура! Поздравляю, Ибуки! Я так тобой горжусь!"
10031005-115 = "Ура! Ибуки покорила экспресс Макото, несмотря на его бесконечную болтовню! А-а, почему Ибуки всегда такая очаровательная?"
10031005-116 = "Я, Мотомия Чиаки, секретарь Общества Пандемониума, чувствую пламенную ответственность записать каждую секунду этого!"
10031005-117 = "Сюда! Макото, Ибуки! Скажите «сыр»!"
10031005-118 = "Сы-ы-ыр!"
10031005-119 = "Кихехе. Сыр..."
10031005-120 = ""
10031005-124 = ""
10031005-125 = "Чиаки, потом принеси мне копию этой фотографии."
10031005-126 = "Для тебя — что угодно, Ироха!"
10031005-127 = "Кихехехе. КХМ. [USERNAME] Сенсей, твой ответ?"
10031005-128 = "[s7] «Спасибо за предложение, но...»\n[s8] «Боюсь, мне придётся отказаться.»"
10031005-129 = ""
10031005-130 = ""
10031005-132 = ""
10031005-133 = ""
10031005-134 = "Что?"
10031005-135 = "П-Почему? Сенсей. Другой такой великолепной возможности, как моё предложение, у тебя больше не будет!"
10031005-136 = "Из-за каких-то непредвиденных обстоятельств? Или мне нужно сделать наши условия привлекательнее?"
10031005-137 = "Ахахаха! Ты уверена, что дело не в том, что ты струсила отдавать половину Кивотоса?"
10031005-138 = "Наверняка именно поэтому!"
10031005-139 = "Не думаю, что дело в этом."
10031005-140 = "Но Ироха, если не в этом, тогда почему—"
10031005-141 = "[s] «Ну, видишь ли, сегодня в офисе Шале день уборки. На мировое господство времени нет. Прости.»"
10031005-143 = "Уиии! Макото! Тут наверху так ветрено!"
10031005-144 = "Она мягко улыбнулась."
10031005-145 = "..."
10031005-146 = "..."
10031005-147 = "Ничего не поделаешь."
10031005-148 = "Я не могу навязывать свои требования человеку, у которого уже есть планы. На этот раз я это спущу, но только сегодня."
10031005-149 = "Эм, Макото, тебя правда это устраивает?!"
10031005-150 = "Хм? Что ты имеешь в виду, Ироха?"
10031005-151 = "Кеке. Если бы я силой заставила Шале перейти на нашу сторону, я была бы не лучше тирана."
10031005-152 = "Истинный лидер должен быть гибким, учитывать обстоятельства и уважать волю других."
10031005-153 = "Кроме случаев, когда речь идёт об этой мерзкой Дисциплинарной комиссии!"
10031005-154 = "Мудрые слова, Ироха. Так что не забывай их."
10031005-155 = "А. Ладно..."
10031005-156 = "Ахаха! Вот это наша Макото! О-о! Может, и это сфотографировать?"
10031005-157 = ""
10031005-159 = ""
10031005-161 = ""
10031005-163 = ""
10031005-164 = ""
10031005-165 = ""
10031005-166 = "Хмпф. Какой смысл пытаться убеждать людей, если всё равно ходишь кругами?"
10031005-167 = ""
10031005-169 = ""
10031005-170 = "Вы все забыли? У нас уже есть безотказный способ, ЕСЛИ мы хотим переманить Сенсея из Шале на нашу сторону."
10031005-171 = "Погоди, Сацуки! Ты же не хочешь сказать—"
10031005-172 = "Именно, Макото. Мы можем использовать техники, которые я освоила в своём проекте NK Ultra..."
10031005-173 = "И переманить Сенсея без всей этой возни с дипломатией и убеждениями!"
10031005-174 = "Фуфуфу! О, Сенсей! Следи за птичкой."
10031005-175 = ""
10031005-177 = ""
10031005-179 = "Вот так, продолжай смотреть... Тебе хочется присягнуть на верность Обществу Пандемониума..."
10031005-180 = "А ещё тебе хочется купить пудинг в новой кондитерской рядом с Обществом Пандемониума..."
10031005-181 = ""
10031005-184 = "[ns] «Эм, ну... М-Может быть?»"
10031005-185 = ""
10031005-187 = ""
10031005-188 = "Фуфу. Смотрите, кажется, работает!"
10031005-189 = "Эй, Сацуки, дай Ибуки попробовать!"
10031005-190 = "Берёшь монетку... качаешь её... Теперь Сенсей хочет играть с Ибуки!"
10031005-191 = "О боже, Ибуки. Ты настоящий профессионал!"
10031005-192 = "Я вижу огромный потенциал в будущем лидере проекта NK Ultra!"
10031005-193 = "Эй, Чиаки, чего стоишь столбом!"
10031005-195 = "Конечно! Какой кадр! Как секретарь Общества Пандемониума, я не могу это пропустить!"
10031005-196 = ""
10031005-198 = ""
10031005-199 = ""
10031005-201 = ""
10031005-203 = ""
10031005-204 = ""
10031005-205 = ""
10031005-207 = ""
10031005-208 = ""
10031005-209 = "...Как видите, для нас это самый обычный день."
10031005-210 = "А при вас, Сенсей, всё это вдвойне неловко."
10031005-211 = "[s] «Вот как? А мне это почему-то кажется почти умиротворяющим.»"
10031005-212 = "Умиротворяющим, говорите."
10031005-213 = "Пожалуй, вы не совсем неправы."