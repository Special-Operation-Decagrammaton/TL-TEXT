[translation]
1004903-1 = "Вот что такое Клуб сладостей после школы"
1004903-2 = "Поздно вечером я вышел прогуляться, чтобы отдохнуть от работы."
1004903-3 = "Пока я шёл, то заметил знакомое лицо на автобусной остановке."
1004903-4 = "[s1] «О, Казуса?»\n[s2] «Привет.»"
1004903-5 = "А? О, это вы. Привет, Сенсей."
1004903-6 = "А? О, это вы. Привет, Сенсей."
1004903-7 = "Что вы делаете так поздно? Надеюсь, не слишком много работаете."
1004903-8 = "Что делаю я?"
1004903-9 = "То, что обычно делают на автобусной остановке. Жду автобус."
1004903-10 = "Автобусов обратно в общежитие немного. Иногда приходится ждать почти полчаса."
1004903-11 = "Раньше я ездила на метро, потому что так намного быстрее, но..."
1004903-12 = "я не люблю толпу. Автобус хорош тем, что обычно пустой."
1004903-13 = "Мне нравится, когда всё просто и без лишнего напряга, даже если это не самый эффективный способ."
1004903-14 = "А раз людей мало, там действительно есть свободные сиденья."
1004903-15 = "И, судя по опыту..."
1004903-16 = ""
1004903-18 = ""
1004903-19 = "у меня должно хватить времени на перекус! Хи-хи."
1004903-20 = "Вот, Сенсей. Возьмите."
1004903-21 = "[s3] «Ты отдаёшь это мне?»\n[s4] «Я не могу забирать твои сладости.»"
1004903-22 = "О, не переживайте. У меня ещё есть. И я ношу с собой не только напитки..."
1004903-23 = "О, не переживайте. У меня ещё есть. И я ношу с собой не только напитки..."
1004903-24 = ""
1004903-26 = ""
1004903-27 = "Та-дам! Я ещё ношу упаковку макарон и другие сладости."
1004903-28 = "Хех, для участницы Клуба сладостей после школы вполне естественно иметь при себе аварийный паёк."
1004903-29 = "Десерты вкуснее, когда делишься ими..."
1004903-30 = "...Так бы сказали остальные участницы. Хаха."
1004903-31 = "Они постоянно придумывают такие нелепые фразы."
1004903-32 = "[s5] «Ты правда очень любишь десерты.»\n[s6] «Я думал, тебе просто нравится проводить время с друзьями.»"
1004903-33 = "Удивлены? Наверное, я и правда не похожа на любительницу десертов..."
1004903-34 = "Удивлены? Наверное, я и правда не похожа на любительницу десертов..."
1004903-35 = "Но какая старшеклассница не любит десерты? Разница только в том, какие именно."
1004903-36 = "Я в клубе не только ради друзей. Мне нравится торт со взбитыми сливками и клубникой, а ещё я очень люблю макароны."
1004903-37 = "They're the only desserts that I, like, really care about their quality, you know?"
1004903-38 = "Если когда-нибудь будет время, я свожу вас в хорошие места, которые нашла."
1004903-39 = "Гарантирую, они вас поразят... ну, если вы любите сладкое."
1004903-40 = "Хотя вообще-то там всё не слишком сладкое, так что, думаю, будет вкусно в любом случае."
1004903-41 = "Но, может, вы предпочитаете более лёгкие десерты..."
1004903-42 = ""
1004903-45 = "Что? Да ладно."
1004903-46 = "Автобус приехал так быстро."
1004903-47 = "Если не сяду на этот, придётся ждать ещё двадцать минут..."
1004903-48 = "...Наверное, выбора нет. Я даже не успела доесть. Жаль."
1004903-49 = ""
1004903-51 = ""
1004903-52 = "В-Вообще-то..."
1004903-53 = "Сенсей, можно спросить... То есть без давления..."
1004903-54 = "Как думаете... Ну..."
1004903-55 = "[s7] «Я сегодня уже закончил работать.»\n[s8] «У меня есть для тебя двадцать минут.»"
1004903-56 = ""
1004903-57 = ""
1004903-59 = ""
1004903-60 = "*вздыхает*"
1004903-61 = "Серьёзно, Сенсей..."
1004903-62 = "Если будете продолжать так себя вести, однажды попадёте в неприятности. Вы и с другими студентами так?"
1004903-63 = "Если вас когда-нибудь арестуют, я не удивлюсь. Осторожнее, ладно?"
1004903-64 = "Эм... Но..."
1004903-65 = "Если такое случится, можете позвонить мне. Я помогу, если не буду на уроке. Уроки я пропускать не могу."
1004903-66 = "Что?"
1004903-67 = "Это вас рассмешило?"
1004903-68 = "Хмф... Опять надо мной издеваетесь."
1004903-69 = "Всё, больше никаких серьёзных разговоров."
1004903-70 = "Перейдём к более важным делам..."
1004903-71 = ""
1004903-73 = ""
1004903-74 = ""
1004903-76 = "Shall we eat the rest of this, Sensei?"
