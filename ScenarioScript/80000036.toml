80000036-83 = "[ns] «Э-Этот вкус! Не может быть!»"
80000036-84 = "Уникальный вкус соевого соуса на мягкой текстуре морского леща..."
80000036-85 = "Неповторимый вкус дуриана заполняет промежуток между ними, создавая неожиданную гармонию на моих вкусовых рецепторах!"
80000036-86 = "[s] «Это определённо не шоколад, но вкусно!»"
80000036-87 = "Правда? Хи-хи! Я в восторге!"
80000036-88 = "Ну разве не здорово, что мы попробовали? Путь гурмана невероятен!"
80000036-89 = "[s] «Спасибо за сегодняшний день, Изуми.»"
80000036-90 = "И тебе спасибо, Сенсей! Давай съедим всё вместе!"
80000036-91 = "Вот, открой рот. «А-а-а-а». С Днём святого Валентина, Сенсей!"
80000036-93 = "Для нас с Изуми этот День святого Валентина вышел уникальным."
