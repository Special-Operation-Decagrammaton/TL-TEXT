80000036-20 = "Никто не придёт, так что сегодня всё наше!"
80000036-21 = "[s1] «Зачем меня сюда притащили?»\n[s2] «Изуми, что мы здесь делаем?»"
80000036-22 = "А? Ты про то, почему именно столовая?"
80000036-23 = "А? Ты про то, почему именно столовая?"
80000036-24 = "Сегодня День святого Валентина!"
80000036-25 = "[s] «Да, я знаю.»"
80000036-26 = "Есть только одна причина оказаться в столовой на День святого Валентина!"
80000036-27 = "Мы здесь, чтобы приготовить восхитительный валентиновский шоколад!"
80000036-28 = "За работу, Сенсей! Нельзя терять время!"
80000036-29 = ""
80000036-31 = ""
80000036-32 = "[ns] «А?»"
80000036-34 = "На этот День святого Валентина моя цель — попробовать лучший шоколад в истории."
80000036-35 = "И я не могу просто сидеть и ждать, пока чудо само свалится мне в руки!"
80000036-36 = "Как гордый член Общества гурманов, я сама создам свою судьбу!"
80000036-37 = "А лучший шоколад — тот, которым делишься с другими!"
80000036-38 = "[s] «Ты прямо стихийное бедствие, Изуми.»"
80000036-39 = "Не волнуйся! Я подготовила все ингредиенты."
80000036-40 = "Для начала — особый традиционный соевый соус, который на рынках продают настоящие мастера!"
80000036-41 = "[s] «Соевый соус?»"
80000036-42 = "Какой ты смешной, Сенсей! Нам же нужен красивый тёмный блеск!"
80000036-43 = "О! О! И я слышала, что сейчас моден фруктовый шоколад."
80000036-44 = "Поэтому я нашла то, что называют «королём фруктов»!"
80000036-45 = ""
80000036-47 = ""
80000036-48 = ""
80000036-49 = "[ns] «Ч-Что это за запах?!»"
80000036-50 = "Дуриан!"
80000036-51 = "Но в лучшем шоколаде в мире не может быть только один королевский ингредиент."
80000036-52 = "Я долго думала, что к нему подойдёт."
80000036-53 = "И нашла! Морской лещ — король рыб!"
80000036-54 = "А ещё в нём куча полезных витаминов!"
80000036-55 = "Так что наш шоколад будет не только вкусным, но и полезным!"
80000036-56 = "Это всё. Можно начинать!"
80000036-57 = "[s] «По-моему, здесь вообще ничего нельзя начинать!»"
80000036-59 = "И так Изуми приступила к созданию самого проклятого шоколада в истории Дня святого Валентина."
