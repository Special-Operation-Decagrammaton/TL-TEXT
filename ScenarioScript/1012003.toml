[translation]
1012003-1 = "Выездной урок: искусство и попкорн"
1012003-8 = ""
1012003-9 = "Не волнуйтесь. Я просто пришла пораньше, Сенсей."
1012003-10 = "О, вам интересно, что за фильм?"
1012003-11 = "Сенсей, как вы знаете, недавно я начала учиться играть на барабанах."
1012003-12 = "И мне не хватает справочных материалов... и вдохновения."
1012003-13 = "Но затем я услышала, что этот блестящий фильм под названием «Хиплэш» повторно выходит в прокат к годовщине."
1012003-14 = "И почти судьбой, удивительным совпадением кажется то, что он выходит именно тогда, когда мне нужно вдохновение!"
1012003-15 = "К тому же это будет новый опыт! Я его никогда не видела!"
1012003-16 = "Судьба редко подаёт нам настолько ясные знаки, Сенсей."
1012003-17 = "Поэтому меня привлекла романтика, сама возможность! У меня не было выбора, кроме как прийти пораньше и добыть билеты."
1012003-18 = "[s] «Да... Перед таким трудно устоять.»"
1012003-19 = "Правда? Я знала, что вы тоже поймёте эту романтику."
1012003-20 = "Однако я прихожу сюда не только ради фильмов."
1012003-21 = "Я обнаружила это место, когда искала десерты!"
1012003-22 = "Здесь к лакомствам добавляют начинку, которую едва ли удастся повторить где-то ещё..."
1012003-23 = "...Десерт, которым можно насладиться лишь с добавкой из кино!"
1012003-24 = "...То есть попкорн."
1012003-25 = "О? Вы купите попкорн, потому что билеты купила я?"
1012003-26 = "Тогда премного благодарна, Сенсей."
1012003-27 = "Выберем вкусы?"
1012003-29 = "Так я купил попкорн со вкусом карамели, клубники, эклера и густых сливок."
1012003-30 = ""
1012003-34 = "Кинозал оказался на удивление пустым..."
1012003-36 = ""
1012003-37 = "...Именно как я и планировала."
1012003-38 = "[s1] «Планировала...?»\n[s2] «Нацу, о чём ты?»"
1012003-41 = "Подумайте, Сенсей."
1012003-42 = "Это не просто фильм."
1012003-43 = "Это фильм о БАРАБАНАХ. Он наполнен резонансом и ритмами, которые трогают душу."
1012003-44 = "И то, как всё сложилось, просто идеально! Вот она, сущность музыки. Представьте..."
1012003-45 = "...Звук барабанов обрушивается на нас, не приглушённый присутствием других людей!"
1012003-46 = "[s3] «Это...»\n[s4] «...Убедительно!»"
1012003-49 = "Именно."
1012003-50 = "Именно поэтому я купила билеты на дневной сеанс..."
1012003-51 = "...в первые выходные проката какого-то боевика, который нравится всем остальным."
1012003-53 = "Вскоре свет в зале погас."
1012003-54 = "Обязательно прочувствуйте это, Сенсей!"
1012003-55 = ""
1012003-61 = "А затем пошли титры."
1012003-63 = "...Убедительно."
1012003-64 = "Вот это сюжетный поворот, Сенсей!"
1012003-65 = "Учитель главного героя оказался преступником! Он запер его на 15 лет и кормил только десертами! Какое безумие!"
1012003-66 = "Ох... Я так увлеклась, что почти не ела попкорн."
1012003-67 = "А ведь я так старалась подобрать идеальное сочетание вкусов..."
1012003-68 = "Хм..."
1012003-69 = "Сенсей, в Шале вас ждёт ещё много работы, да?"
1012003-70 = "[s5] «Ох, только не напоминай...»\n[s6] «Ты меня расстраиваешь...»"
1012003-73 = "В таком случае..."
1012003-74 = "Сенсей, возьмите этот попкорн."
1012003-75 = "Как я и говорила: немного сахара — идеальное средство от стресса."
1012003-76 = "Не вздумайте идти на сверхурочную работу неподготовленным!"
1012003-77 = "[s] «Выглядит вкусно...»"
1012003-79 = "Вернувшись в Шале, я закончил дела, понемногу поедая сладкий попкорн."
1012003-80 = "Он был настолько сладким, что меня ни разу не клонило в сон."
