[translation]
22230-1 = "Episódio 23;Pavana para uma Princesa (2)"
22230-2 = "...Falha na alocação de recursos. Desligando sistema."
22230-3 = "Estão todos bem?!"
22230-4 = "Yuuka...!"
22230-5 = "Noa-senpai!"
22230-6 = "C-Como vocês vieram parar aqui...?"
22230-7 = "Eu percebi logo que a situação não era nada normal, Sensei!"
22230-8 = "No começo, a minha intenção era só informar a localização da cidade e me retirar, mas..."
22230-9 = "Hehe, a Yuuka-chan disse que só isso não bastava...#nQue precisava resolver tudo até o fim, sabe?"
22230-10 = "[s] \"Como esperado da Yuuka! O timing foi perfeito!\""
22230-11 = "Isso não foi mais que a minha obrigação."
22230-12 = "Mais importante, Presidente!!"
22230-14 = "!!"
22230-15 = "Desviar o orçamento do Seminar para construir uma cidade dessas...#nVocê vai ouvir um sermão depois! Pode ir se preparando!"
22230-16 = "...Yuuka."
22230-20 = "Erro no processo de alocação de recursos.#nEmergência detectada. Todos os Divi:Sion, reúnam-se na Torre Central de Eridu para proteger a executora do protocolo..."
22230-24 = "...Intrusos?"
22230-25 = "Impossível — as forças remanescentes na cidade são zero."
22230-26 = "Erro lógico detectado. Exibindo tela para confirmação."
22230-35 = "Ah, aquilo por acaso é...!"
22230-39 = "[ns] \"...Avant-Garde e o Clube de Engenharia!\""
22230-40 = "Detectamos uma presença suspeita com antecedência! O Clube de Engenharia retornou em grande estilo!"
22230-41 = "Está cheio de máquinas com um senso estético estranho por todo lado."
22230-42 = "Provavelmente, esta é... a ameaça que transbordou das Ruínas de que a Presidente falou."
22230-43 = "Hehe... Então nós também não podemos ficar atrás."
22230-44 = "Se o adversário é um monstro que rastejou para fora das Ruínas..."
22230-45 = "Nós somos engenheiras que almejam o espaço sideral."
22230-52 = "Ainda mais agora que temos um aliado armado com um design supervisionado pela Maki."
22230-53 = "Sim! O inimigo do meu inimigo é meu amigo! E o inimigo que nós modificamos também é meu amigo!"
22230-54 = "É... Especialmente porque equipamos ele com armas de fogo que também podem ser usadas em futuros encouraçados espaciais."
22230-55 = "Não importa o quão monstruosas sejam as criaturas das Ruínas, elas não são páreo para o \"Avant-Garde Mk.2\"."
22230-56 = "Então, vamos lá! Avançar!"
22230-57 = "Sim! Vamos fazer uma limpeza nesses fracotes das Ruínas!"
22230-58 = "Isso aí!"
22230-66 = "Modificaram o Avant-Garde... para um encouraçado espacial..."
22230-67 = "Hã? Do que elas estão falando?"
22230-68 = "[s] \"Se é por um encouraçado espacial, não tem jeito! Afinal, é o sonho de todo mundo!\""
22230-69 = "Bem... Eu não entendi muito bem o que o Sensei está dizendo..."
22230-70 = "Incompreensível. Incapaz de avaliar a situação."
22230-71 = "Revisando e reexecutando ordens. Seguidores, evitem combate com forças não previstas e reúnam-se na Torre Central de Eridu..."
22230-72 = "Sinto muito, mas essas crianças não vão conseguir chegar até aqui.#nAfinal, a entrada da torre está sendo bloqueada pela Eimi e pelas integrantes da C&C."
22230-75 = "[ns] \"Hã? Himari?! O que você faz aqui?!\""
22230-76 = "Ufufu. Digamos que... uma coisa levou à outra?"
22230-77 = "Himari... Você não tinha fugido...?"
22230-78 = "Fugido... Que coisa triste de se dizer."
22230-79 = "Eu já tinha uma boa noção de como a situação iria se desenrolar."
22230-80 = "Depois que escapei da instalação de isolamento, vim correndo para cá."
22230-81 = "Conhecendo a Rio... eu já previa que você causaria outro incidente."
22230-82 = "E então?#nHehe — acertei em cheio?"
22230-83 = "..."
22230-84 = "Pois bem, então esta é a <Key>...#nA IA gatilho feita para ativar o \"OOPArt\" dos Sacerdotes Sem Nome."
22230-85 = "Se deixarmos como está, a personalidade da Aris certamente será substituída pela <Key>...#nE ela despertará como a \"Princesa dos Deuses Sem Nome\", exatamente como os Sacerdotes Sem Nome desejam."
22230-86 = "E-Então...!"
22230-87 = "!!#nHimari-senpai... Isso quer dizer..."
22230-88 = "A Aris-chan vai continuar assim..."
22230-89 = "É claro que existe uma forma de impedir isso."
22230-90 = "[s] \"...O que exatamente precisamos fazer?\""
22230-91 = "Cada segundo conta... Os Sacerdotes Sem Nome já começaram a se mover."
22230-108 = "Por isso, antes que os Sacerdotes Sem Nome cheguem, nós mesmos precisamos —"
22230-109 = "Acordar a Aris, que foi isolada nas profundezas do banco de dados com a ativação da <Key>."
22230-111 = "Se fizermos isso, conseguiremos interromper esta situação."
22230-115 = "Uma coisa dessas... é mesmo possível?"
22230-116 = "Quer dizer que podemos trazer a Aris de volta?!"
22230-117 = "Com toda a certeza.#nRio, você tem equipamento de imersão, não tem?"
22230-118 = "Sim, eu tenho.#n...Mas algo assim não é realisticamente possível...!"
22230-119 = "[s] \"Ué?\""
22230-120 = "É perigoso demais. Mesmo que consigam entrar no mundo mental da Aris,#nse algo der errado, vocês podem nunca mais conseguir voltar."
22230-121 = "Além disso, quem sequer iria —"
22230-122 = "No momento, os únicos capazes de trazer a Aris de volta são o Clube de Desenvolvimento de Jogos e o Sensei."
22230-123 = "Há riscos envolvidos... mas não existe outra maneira."
22230-125 = "...Nós vamos fazer."
22230-126 = "Se for para..."
22230-127 = "Trazer a Aris-chan de volta."
22230-128 = "Está vendo só?"
22230-129 = "..."
22230-130 = "Muito bem, vou analisar a mente da Aris agora e abrir uma brecha."
22230-131 = "Por favor, entrem no mundo mental da Aris e tragam-na de volta."
22230-136 = "[ns] \"...Entendido. Vamos lá!\""
22230-138 = "Sim, então vamos começar."
22230-143 = "...Preparativos concluídos."
22230-144 = "Conto com vocês, pessoal."
22230-148 = "Próximo;O Que Eu Quero Ser"
