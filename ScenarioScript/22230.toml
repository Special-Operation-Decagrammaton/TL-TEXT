[translation]
22230-1 = "Эпизод 23; Павана для принцессы 2"
22230-2 = "«...Не удалось получить ресурсы. Отключение системы.»"
22230-3 = "Все в порядке?!"
22230-4 = "Юука...!"
22230-5 = "Ноа!"
22230-6 = "К-Как вы сюда попали...?"
22230-7 = "Мы поняли, насколько критична ситуация, Сенсей!"
22230-8 = "Изначально мы планировали просто сообщить вам местоположение города и не вмешиваться, но..."
22230-9 = "Хи-хи-хи. Юука сказала, что этого недостаточно... и мы должны довести дело до конца."
22230-10 = "[s] «Юука! Ты идеальна!»"
22230-11 = "П-Пожалуйста...!"
22230-12 = "Кстати, президент!"
22230-14 = "...!"
22230-15 = "Вы присваивали средства Семинар, чтобы построить этот город. Позже я вас серьёзно накажу, так что готовьтесь!"
22230-16 = "...Юука."
22230-17 = ""
22230-19 = ""
22230-20 = "«Ошибка процесса получения ресурсов. Чрезвычайная ситуация. Всем подразделениям Divi:Sion направиться к центральной башне Эрида для защиты исполнителя протокола...»"
22230-21 = ""
22230-24 = "Нарушитель?"
22230-25 = "Невозможно. В городе не осталось войск."
22230-26 = "Должно быть, произошла логическая ошибка. Выведу изображение для проверки."
22230-27 = ""
22230-28 = ""
22230-29 = ""
22230-30 = ""
22230-31 = ""
22230-35 = "О, это...?!"
22230-36 = ""
22230-39 = "[ns] «...Avant Guard! И Инженерный отдел!»"
22230-40 = "Инженерный отдел вернулся! Мы поняли, что здесь творится что-то подозрительное!"
22230-41 = "Повсюду тут какие-то странные машины."
22230-42 = "Наверное, это и есть та угроза из руин, о которой говорила президент."
22230-43 = "Хи-хи... Тогда придётся с этим что-то сделать."
22230-44 = "Противники — чудовища из руин..."
22230-45 = "...но мы инженеры, чьи взгляды устремлены в космос."
22230-46 = ""
22230-48 = ""
22230-49 = ""
22230-50 = ""
22230-51 = ""
22230-52 = "Как раз вовремя мы получили союзника, вооружённого по чертежам Маки."
22230-53 = "Да! Враг моего врага — мой друг! Особенно если мы переделали его в своего союзника!"
22230-54 = "Да... В частности, он оснащён огневой мощью, которую в будущем можно будет использовать на межгалактическом линкоре."
22230-55 = "Даже чудовища из руин не соперники нашему Avant Guard Mk.2."
22230-56 = "Выдвигаемся? В атаку!"
22230-57 = "Да! Уничтожим приспешников руин!"
22230-58 = "Ого!"
22230-59 = ""
22230-66 = "Модифицировать Avant Guard... чтобы оружие межгалактического линкора могло..."
22230-67 = "А? В смысле?"
22230-68 = "[s] «Межгалактический линкор — мечта каждого!»"
22230-69 = "Эм... Я не совсем понимаю, о чём вы, Сенсей..."
22230-70 = "Непостижимо. Невозможно оценить ситуацию."
22230-71 = "Изменить и повторно выполнить команду. Последователям избегать боя с непредвиденными войсками и собраться у центральной башни Эрида..."
22230-72 = "Прости, но они туда не доберутся. Вход в башню перекрыт Эйми и участницами C&C."
22230-73 = ""
22230-74 = ""
22230-75 = "[s] «А?! Химари? Что ты здесь делаешь?»"
22230-76 = "Хи-хи. Так вышло по целому ряду причин."
22230-77 = "Химари, я думала, ты сбежала..."
22230-78 = "Сбежала? Разочарована, что ты так мало обо мне думаешь."
22230-79 = "Я весьма точно предсказала, как будет развиваться ситуация."
22230-80 = "Поэтому сбежала из карантинного комплекса и пришла сюда."
22230-81 = "Как и со всем остальным, что делает Рио, я ожидала большого переполоха."
22230-82 = "И разве я ошиблась?"
22230-83 = "..."
22230-84 = "Кстати, это Кей... ИИ-триггер для активации Артефакта Безымянных жрецов."
22230-85 = "Если всё оставить как есть, личность Алисы будет заменена Кей... И наконец пробудится принцесса Безымянных богов, как того желали Безымянные жрецы."
22230-86 = "Т-Тогда...!"
22230-87 = "Химари... Если это правда..."
22230-88 = "Такими темпами Алиса..."
22230-89 = "Но у нас есть способ это остановить."
22230-90 = "[s] «Как? Тогда сделай это!»"
22230-91 = "Все отлично справились, но сейчас время критично."
22230-93 = ""
22230-94 = ""
22230-96 = ""
22230-98 = ""
22230-100 = ""
22230-102 = ""
22230-103 = ""
22230-104 = ""
22230-107 = ""
22230-108 = "Нужно остановить процесс до прибытия Безымянных жрецов."
22230-109 = "Активировав Кей, мы пробудим Алису, изолированную в глубинах её базы данных."
22230-110 = ""
22230-111 = "Это и будет нашим моментом, чтобы всё остановить."
22230-113 = ""
22230-115 = "Это сработает?"
22230-116 = "И тогда Алиса сможет вернуться домой вместе с нами?"
22230-117 = "Да, возможно. Уверена, в Эриде есть оборудование для погружения. Верно, Рио?"
22230-118 = "Но это невозможно! Нельзя!"
22230-119 = "[s] «Почему?»"
22230-120 = "Это слишком рискованно. Если войти в ментальное пространство Алисы, пути назад может не быть."
22230-121 = "Кто вообще согласится попробовать нечто подобное?"
22230-122 = "Я смотрю прямо на них. Отдел разработки игр и Сенсей."
22230-123 = "Это будет опасно, но..."
22230-125 = "...Мы сделаем это."
22230-126 = "Мы сделаем всё, что потребуется."
22230-127 = "Мы просто хотим вернуть Алису домой."
22230-128 = "Что я тебе говорила?"
22230-129 = "..."
22230-130 = "Тогда я проанализирую ментальное пространство Алисы и создам для вас проход."
22230-131 = "Вам придётся погрузиться в данные и вернуть её."
22230-132 = ""
22230-134 = ""
22230-135 = ""
22230-136 = "[ns] «...Понял!»"
22230-138 = "Тогда начнём."
22230-143 = "...Готово."
22230-144 = "Удачи всем."
22230-148 = "Следующий Эпизод: Кем ты хочешь быть"
