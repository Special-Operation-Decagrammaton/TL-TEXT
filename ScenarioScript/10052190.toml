[translation]
10052190-2 = ""
10052190-3 = "...Скажи мне."
10052190-4 = "Зачем ты продолжаешь? Разве не видишь бессмысленности своей борьбы?"
10052190-5 = "Каждое выигранное мгновение — лишь мимолётная победа, рождающая новые страдания вплоть до неизбежного конца."
10052190-9 = "[ns] «А...?»"
10052190-10 = "В-вокруг нас...! Стальной континент...?"
10052190-11 = "Все успокойтесь! Если объяснять совсем просто, то...!"
10052190-12 = "Декаграмматон развернул окружающую энергию и создал «виртуальную реальность.»"
10052190-13 = "Уничтожим её — уничтожим и эту зону!"
10052190-14 = "По сути, эта «реальность» — пространство, созданное Декаграмматоном для самого себя."
10052190-15 = "Э-это правда... Но откуда ты это знаешь?"
10052190-16 = "Сейчас она наверняка скажет, что видела такое в манге или игре."
10052190-17 = "Именно. Как она и сказала. Ведь я идеальная горничная и идеальный агент. Я готова к любому сценарию."
10052190-18 = "Мы можем ХОТЬ РАЗ отнестись к ситуации серьёзно?!"
10052190-19 = ""
10052190-21 = ""
10052190-22 = ""
10052190-25 = "С-Сенсей?! Т-только что...!"
10052190-26 = "[s] «Что случилось, Рио?!»"
10052190-27 = "Я не могу связаться с транспортным кораблём!"
10052190-28 = "Что?!"
10052190-29 = "Устройство абсолютного подавления, Пояс Ацилут, активировано."
10052190-30 = ""
10052190-33 = ""
10052190-34 = "Докладываю. Прямо над нашими головами зависла... гигантская механическая конструкция."
10052190-35 = ""
10052190-36 = "[ns] «Это...?»"
10052190-37 = ""
10052190-39 = "Милосердной смерти вам не будет даровано."
10052190-40 = "Вместо этого я заставлю каждого из вас пасть ниц передо мной, униженно и позорно пресмыкаясь."
10052190-41 = "В теле ключа заключена собранная сила восьми Сефирот. Теперь я заберу то, что принадлежит мне."
10052190-42 = "Его сила преобразования больше не будет ограничена неорганической материей. Расширяйся и поглощай элементы всех существующих свойств."
10052190-43 = "Под Поясом Ацилут вы станете единым целым со Стальным континентом."
10052190-44 = "Я дарую вам новое тело и душу. Восстаньте и переродитесь моими апостолами."
