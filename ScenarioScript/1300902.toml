[translation]
1300902-1 = "Ещё один ленивый день"
1300902-2 = "(Я увидел большую толпу там, где мы договорились встретиться с Цубаки.)"
1300902-3 = "[ns] «Что происходит?»"
1300902-5 = ""
1300902-6 = "(Подойдя ближе, я увидел Цубаки, спящую посреди толпы.)"
1300902-7 = "Хр-р... Хр-р..."
1300902-8 = "(Почему-то люди вокруг шептались о Цубаки.)"
1300902-9 = "Эй, смотри. Это же...?"
1300902-10 = "Это Спящая красавица Хяккияко!"
1300902-11 = "Спящая красавица..."
1300902-12 = "Та самая профессиональная соня, которая спит лучше всех?!"
1300902-13 = "[s1] «Спящая красавица...?»\n[s2] «Профессиональная соня...?»"
1300902-14 = "Знаешь, по-моему, я её уже видел."
1300902-15 = "Знаешь, по-моему, я её уже видел."
1300902-16 = "Я видел, как она собирала пазл во сне!"
1300902-17 = "[s] «...Пазл?»"
1300902-18 = "И это всё?"
1300902-19 = "А я однажды видел, как Спящая красавица задремала перед тем, как построить башню из игральных карт!"
1300902-20 = "[s] «...Игральные карты?»"
1300902-21 = "Хаха, это ещё ничего! Я видел, как Спящая красавица..."
1300902-23 = "(Толпа продолжала возбуждённо переговариваться.)"
1300902-24 = "(Похоже, сама того не замечая, Цубаки стала в Хяккияко чем-то вроде знаменитости.)"
1300902-25 = ""
1300902-27 = "[ns] «Хм, наверное, стоит попробовать с ней поговорить...»"
1300902-28 = "Вот она! Президент Клуба внутренней дисциплины Хяккияко!"
1300902-30 = ""
1300902-31 = "Сюда!"
1300902-32 = "Я услышал, что на улице спит студент, и должен был проверить..."
1300902-33 = "И конечно же, это оказалась президент Клуба внутренней дисциплины!"
1300902-35 = "Хр-р..."
1300902-36 = "Не делай вид, что не знаешь нас!"
1300902-37 = "*зевок*"
1300902-38 = "М-м..."
1300902-39 = "Ты нас игнорируешь?!"
1300902-40 = "Она вообще не слушает!"
1300902-41 = "Уф! Ну и ладно!"
1300902-42 = "В прошлый раз, когда ты слонялась по ночам, ты помешала нашему художественному выражению недовольства этим несправедливым обществом!"
1300902-43 = "Что? Я думал, мы просто рисовали на стене?"
1300902-44 = "З-Заткнись!"
1300902-45 = "Она спит, так что сейчас наш шанс! Давай!"
1300902-46 = "Вуху!"
1300902-48 = "Они что, собираются стрелять в Спящую красавицу?!"
1300902-49 = "Ого! Э-Это опасно!"
1300902-50 = "[s] «Цубаки?!»"
1300902-51 = ""
1300902-52 = "Хр-р..."
1300902-54 = "Аргх! Не могу поверить, она всё ещё спит после всех этих пуль! Она вообще ничего не чувствует?"
1300902-55 = "Этого мало! Нужно больше мощности!"
1300902-56 = "Ях! Получай! Как тебе граната?!"
1300902-58 = "[ns] «Цубаки! Берегись!»"
1300902-59 = ""
1300902-60 = ""
1300902-63 = "Хаха! Ну как? Мы её прикончили?"
1300902-64 = "Эм... Ну, я бы не спешил радоваться!"
1300902-65 = ""
1300902-66 = ""
1300902-68 = "Ч-Что...? Она уклонилась от всех наших атак... во сне?!"
1300902-69 = "О-Она даже страшнее слухов! Что делать...?"
1300902-70 = ""
1300902-71 = "Невероятно!"
1300902-72 = "Вот почему все боятся Спящую красавицу Хяккияко!"
1300902-73 = "Посмотрите на её победное выражение!"
1300902-74 = "*зевает* Хр-р..."
1300902-75 = "Не могу поверить, она даже во сне злорадствует после победы!"
1300902-76 = "(Кажется, я только что стал свидетелем чего-то невероятного.)"
1300902-78 = "Ну, в таком случае..."
1300902-79 = "[s] «Эй, подождите секунду!»"
1300902-80 = "Стой, это же Сенсей из Шале?"
1300902-81 = "Что?! Я не хочу связываться с Шале!"
1300902-82 = "Уф! Отступаем!"
1300902-85 = "(Они убежали раньше, чем я успел что-либо сказать.)"
1300902-86 = "(Ну и ладно.)"
1300902-87 = ""
1300902-88 = "[ns] «Цубаки, ты в порядке?»"
1300902-89 = "Слушай, я не знаю, кто ты, но Спящая красавица не проснётся только потому, что ты зовёшь её по имени..."
1300902-90 = "Хм? Этот голос..."
1300902-91 = "О. Это ты, Сенсей."
1300902-92 = "Не верю! После всего этого Спящая красавица наконец проснулась!"
1300902-93 = "Только потому, что тот учитель назвал её по имени?!"
1300902-94 = "[s] «Я получил твоё сообщение. Что вообще случилось?»"
1300902-95 = "Хм? В каком смысле? Я просто уснула, пока ждала тебя."
1300902-96 = "О! Сегодня солнце такое тёплое и приятное..."
1300902-97 = "Кажется... мне только что снился очень захватывающий сон..."
1300902-98 = "[s] «...Вот как?»"
1300902-99 = "И этот лёгкий ветерок... Идеальный день для сна... То есть для тренировки."
1300902-100 = "Правда, Сенсей...? *зевает*"
1300902-101 = "[s] «Серьёзно?»"
1300902-102 = "Конечно, Сенсей! Как и обещала, позволь продемонстрировать."
1300902-103 = "Тебе нужно просто занять позицию, а потом..."
1300902-104 = "[s3] «Нет, всё в порядке.»\n[s4] «Я уже видел тебя в деле. Ты была великолепна.»"
1300902-105 = "Что? Ты уже видел меня...?"
1300902-106 = "Что? Ты уже видел меня...?"
1300902-107 = "Хм... Так не пойдёт! Я хотела показать, как тренируюсь..."
1300902-108 = "Вот задачка..."
1300902-109 = "[s] «Раз уж я всё равно здесь, может, пойдём пообедаем?»"
1300902-110 = "Обед...? *наклоняет голову*"
1300902-111 = "Хи-хи. Обед с Сенсеем сразу после пробуждения?"
1300902-112 = "Я всё ещё сплю?"
1300902-113 = "Хорошо, Сенсей! Тогда давай..."
1300902-114 = ""
1300902-115 = "...Хр-р."
1300902-116 = "[s] «Нет, Цубаки. Не засыпай снова. Цубаки?!»"
1300902-119 = "(Я кое-как разбудил Цубаки, чтобы мы смогли пообедать.)"
1300902-120 = "(Но весь обед Цубаки продолжала свою интенсивную тренировку.)"
