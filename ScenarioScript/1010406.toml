[translation]
1010406-1 = "Субъект и объект"
1010406-2 = "Офис Шале"
1010406-4 = ""
1010406-5 = "[ns] «Прости, Рэйдзё!»"
1010406-6 = "Ч-Что случилось? Почему вы так паникуете, Сенсей?"
1010406-7 = "[s] «Эм, ну, дело в том, что…»"
1010406-8 = "А, возникло какое-то дело..."
1010406-9 = "Вы переживаете, что оставляете меня одну?"
1010406-10 = "Хм..."
1010406-11 = "Понятно. Тогда пойдём вместе, Сенсей."
1010406-12 = "[s] «А? Вместе?»"
1010406-13 = "Да. Сегодня я дежурю как представитель студентов в Шале."
1010406-14 = "С определённой точки зрения помощь вам по делам тоже можно считать продолжением моих обязанностей, верно?"
1010406-15 = "Это не совсем неправильно? Именно. Думаю, логично."
1010406-16 = "Так что до конца дня..."
1010406-17 = "...можете рассчитывать на меня, Сенсей."
1010406-19 = ""
1010406-20 = ""
1010406-22 = ""
1010406-23 = ""
1010406-25 = ""
1010406-26 = ""
1010406-28 = ""
1010406-29 = "[ns] «Угх... Наконец-то закончили...»"
1010406-30 = "Хорошая работа, Сенсей."
1010406-31 = "Диапазон обязанностей Шале... действительно огромен. Есть ли вообще место, где у Шале нет полномочий?"
1010406-32 = "А? Вы бы хотели переложить часть задач, но не можете, когда дело касается ваших студентов?"
1010406-33 = "..."
1010406-34 = "Что вы думаете о «будо» — пути боевых искусств?"
1010406-35 = "Понимаю, вопрос прозвучал внезапно. Простите, если переход показался странным."
1010406-36 = "Просто я задумалась. Будо — это путь боевых искусств через самоанализ и осознание."
1010406-37 = "В каком-то смысле можно сказать, что это развитие разума через физическую тренировку."
1010406-38 = "[s] «Похоже, так и есть.»"
1010406-39 = "Следовать этому пути — значит защищать слабых..."
1010406-40 = "...и не позволять сильным их угнетать. Это долг и ответственность."
1010406-41 = "Возможно, здесь есть связь с «справедливостью и рыцарством», о которых Гэнрюмон постоянно болтает."
1010406-42 = "[s] «Да. Похоже на точное описание.»"
1010406-43 = "Так что, Сенсей..."
1010406-44 = "Отныне Сенсей должен защищать меня."
1010406-45 = "[s] «Да. Это тоже кажется— Что? Почему?!»"
1010406-46 = "Ох... Неужели взрослый и телом, и духом педагог собирается просто бросить эту незрелую старшеклассницу?"
1010406-47 = "Я думала, вы говорили, что не можете отказаться от своих студентов..."
1010406-48 = "[s1] «А?! Ну! Это...!»\n[s2] «Как педагог, конечно же, я этого не сделаю!»"
1010406-51 = "Именно!"
1010406-52 = "Тогда сегодня я буду под вашей защитой, Сенсей."
1010406-54 = "А? Кто там?! Эй, ты же из семьи Блинг-Блинг? Это наша территория! Проваливай!"
1010406-55 = ""
1010406-57 = ""
1010406-59 = "А я-то думаю, кто там тявкает. Это же мелкая сошка из семьи Сквиш-Сквиш. Вы теперь никому не нужные неудачники, так что хватит гавкать!"
1010406-60 = "Повтори-ка ещё раз!"
1010406-61 = "Да хоть весь день!"
1010406-62 = ""
1010406-64 = ""
1010406-67 = "Сенсей!"
1010406-68 = "[s3] «В такие моменты... Ну...!»\n[s4] «А пока просто следуйте за мной!»"
1010406-73 = "Хм... Хорошо. Здесь мы надёжно спрятались."
1010406-74 = ""
1010406-77 = ""
1010406-78 = "Хотя перестрелка становится всё ожесточённее."
1010406-79 = "Мне кое-что пришло в голову, Сенсей."
1010406-80 = "Разве вы не говорили, что будете защищать меня?"
1010406-81 = "[s] «Ладно. Так. Насчёт этого. Выслушай меня, Рэйдзё...»"
1010406-82 = "Хм? Следить за тем, чтобы я не пострадала, — тоже часть моей защиты?"
1010406-83 = "...Драться — не единственный способ уберечь кого-то?"
1010406-84 = "Иногда умение плыть по течению реки и не позволять обстоятельствам сковывать тебя..."
1010406-85 = "...тоже является своего рода силой?"
1010406-86 = "..."
1010406-87 = "Хм. Понятно. Значит, это тоже был урок, Сенсей."
1010406-88 = ""
1010406-90 = ""
1010406-91 = ""
1010406-92 = "[ns] «Эм? Рэйдзё? Что ты делаешь?»"
1010406-93 = "Что такое, Сенсей?"
1010406-94 = "Чтобы нас точно не обнаружили, разве нам не стоит держаться как можно ближе друг к другу?"
1010406-95 = "[s] «Ну... вообще-то ты... права.»"
1010406-96 = "Разумеется."
1010406-97 = "..."
1010406-98 = "Я действительно чувствую себя в полной безопасности. Здесь спокойно. Уютно."
1010406-99 = ""
1010406-105 = "...Хотя снаружи творится полная противоположность."
1010406-106 = "Может быть, потому что вы рядом со мной, Сенсей..."
1010406-107 = "...даже такие моменты не так уж плохи."
1010406-110 = "Стрельба продолжалась ещё довольно долго."
1010406-111 = "В конце концов прибыло Бюро безопасности Полицейской школы Валькирии, и ситуацию удалось уладить."
1010406-113 = "Это отняло у нас немало времени."
1010406-114 = "[s] «Но мы ведь уже закончили со всеми делами!»"
1010406-115 = "И всё же..."
1010406-116 = "Простите, Сенсей."
1010406-117 = "По правде говоря..."
1010406-118 = "Мне просто хотелось хоть раз оказаться той, кого защищают."
1010406-119 = "Думаю, моё упрямство в этом вопросе и навлекло на нас все эти неприятности."
1010406-120 = "[s] «Тебе правда не за что извиняться.»"
1010406-121 = "Правда? Но..."
1010406-122 = "[s5] «К тому же день ещё не закончился, верно?»\n[s6] «Я обязан защищать тебя, пока мы не вернёмся в Шаньхайцзин!»"
1010406-125 = "А? Это..."
1010406-126 = "..."
1010406-127 = "Понятно. Если так..."
1010406-128 = ""
1010406-130 = ""
1010406-131 = ""
1010406-133 = "Рэйдзё придвинулась ко мне ближе..."
1010406-134 = "...и обхватила мои руки вокруг своих плеч."
1010406-136 = ""
1010406-137 = "[ns] «А...?!»"
1010406-138 = "Что такое, Сенсей?"
1010406-139 = "Разве вы только что не сказали, что будете защищать меня?"
1010406-140 = "В таком случае я буду вверена вашей заботе до самого конца."
1010406-142 = "В тот день путь обратно в Шаньхайцзин..."
1010406-143 = "...казался длиннее обычного."
