[translation]
1013105-1 = "Фестиваль ростков"
1013105-2 = "Третья общая кухня столовой Красной Зимы"
1013105-3 = "[ns] «Ростки сои вместо ростков маша?»"
1013105-4 = "Да. Из маша, разумеется, вырастают растения маша."
1013105-5 = "А из соевых ростков вырастает соя."
1013105-6 = "Мне кажется, ростки маша мягче и обладают более чистым вкусом, но..."
1013105-7 = "...Поскольку маш готовится очень быстро, буквально за несколько секунд он может стать довольно неаппетитным."
1013105-8 = "[s] «Так что это за „Фестиваль ростков“...?»"
1013105-9 = "Что до названия... Я придумала его почти случайно."
1013105-10 = "Оно просто означает, что каждую вторую среду я имею привычку жарить соевые ростки на раскалённой сковороде."
1013105-11 = "...Пожалуйста, не спрашивайте, неужели я просто не умею готовить ничего другого..."
1013105-12 = "Раз уж мы всё равно этим занялись, почему бы не провести сравнительную критику соевых ростков и ростков маша?"
1013105-13 = "Я уже рассказала, как готовят каждый из ингредиентов, так что это можно пропустить."
1013105-14 = "Ростки маша мягче соевых, поэтому они вкусны и сырыми, и после короткого бланширования."
1013105-15 = "А вот соевые ростки крупнее и куда плотнее."
1013105-16 = "Если их хотя бы немного не приготовить, у них остаются неприятные текстура и запах."
1013105-17 = "Зато это можно использовать себе на пользу, когда нужно добавить вкуса бульону или соусу."
1013105-18 = "Супы, сваренные на соевых ростках, нередко считают одним из самых вкусных вариантов завтрака. У них яркий и приятный вкус."
1013105-19 = "[s] «Ты и правда критикуешь вообще всё...»"
1013105-20 = "Это останется между нами, Сенсей, так что слушайте внимательно."
1013105-21 = "Чтобы выжить в современную эпоху, критик должен всегда быть готов чётко сформулировать своё обоснованное мнение!"
1013105-22 = "Профессиональный критик обязан в любой момент быть готов разжечь общественную дискуссию! Так и должно быть!"
1013105-23 = ""
1013105-25 = ""
1013105-26 = ""
1013105-27 = "Кхм. Кажется, я немного увлеклась. Прошу прощения."
1013105-28 = "Мои извинения, Сенсей."
1013105-29 = "[s] «Всё нормально.»"
1013105-30 = "Перейдём к сегодняшней теме — Фестивалю ростков?"
1013105-31 = "На фестиваль я обычно готовлю острые жареные соевые ростки со свининой!"
1013105-32 = "Сначала слегка обжариваю соевые ростки, затем добавляю специи и свинину, после чего жарю всё вместе."
1013105-33 = "Вкус соевых ростков делает свинину насыщеннее, а соус и вытопившийся свиной жир обволакивают ростки..."
1013105-34 = "Эта гармония делает блюдо идеальным для таких холодных зимних дней. Настоящая симфония калорий, витаминов и клетчатки!"
1013105-35 = "[s] «О, звучит заманчиво.»"
1013105-36 = "Именно. Дайте мне минутку!"
1013105-40 = "Блюдо готово, Сенсей!"
1013105-41 = "Можно есть его с рисом или подать как гарнир!"
1013105-42 = "А предпочитаете хлеб? Если хочется более «практичного подхода», можно использовать это как начинку для сэндвича. Советую чёрный хлеб!"
1013105-43 = ""
1013105-46 = "[ns1] «Вкусно! Приступаю!»\n[ns2] «На душе теплеет... Какой яркий вкус...»\n[ns3] «Не сказать, что это высокая кухня или что-то необычное, зато студент приготовил с душой!»"
1013105-50 = "Что? Ну... Я ведь всего лишь студент Красной Зимы... до профессионала мне далеко."
1013105-51 = "Но если вам нравится, знайте — осталось ещё много. Угощайтесь!"
1013105-53 = "Мы с Таканэ продолжили делить эту согревающую душу трапезу."
