[translation]
212130-1 = "Эпизод 13;Заточение"
212130-3 = "[ns] «Давненько меня не запирали...»"
212130-4 = "Я оказался отрезан от внешнего мира, а внутри нарастали страх и тревога."
212130-5 = ""
212130-14 = ""
212130-15 = "...Сенсей."
212130-16 = "[s] «Привет, Макото»."
212130-17 = "...Надеюсь, вы понимаете, что эта «неприступная крепость» предназначена для вашей безопасности."
212130-18 = "Признаться, я вовсе не этого хотела."
212130-19 = "Однако многие утверждают, что вы стали для нас непредсказуемым фактором..."
212130-20 = "И я с ними согласна. Ведь вы уже не раз превосходили мои самые смелые ожидания."
212130-21 = "..."
212130-22 = "Я отчасти понимаю, почему вы против политики Геенны."
212130-23 = "Вы сентиментальны и полны жажды странствий. Вам дороги каждая академия и каждый студент. Естественно, вы не хотите, чтобы они воевали."
212130-24 = ""
212130-26 = ""
212130-27 = "Но что, если посмотреть на всё под другим углом?"
212130-28 = "Сейчас каждая школа придерживается собственного представления о порядке."
212130-29 = "Отсюда бесконечные конфликты, бессмысленные столкновения и неэффективные решения, порождённые взаимным недоверием..."
212130-30 = "Но! Если все студенты под славным знаменем Геенны будут единодушно идти к одной цели, распри и тревоги исчезнут!"
212130-31 = "Если объединить все разрозненные мысли и ресурсы и направить их на общее дело, Кивотос станет непобедим!"
212130-32 = "Что скажете, Сенсей? Так и Кивотос, и Геенна вместе обретут величие. Станут единым целым."
212130-33 = "[s] «Я...»"
212130-36 = "[ns1] «...Мне больше нравилась прежняя Геенна».\n[ns2] «Свободная Геенна, которую ты сама хотела создать, Макото»."
212130-39 = "..."
212130-40 = ""
212130-44 = ""
212130-48 = "Ух...!"
212130-49 = "[s] «Макото...?!»"
212130-50 = ""
212130-55 = ""
212130-56 = ""
212130-57 = "*вздыхает*"
212130-58 = "Понятно. Значит, вот ваш ответ."
212130-59 = "Кихехе... Что ж. Тогда я удалюсь на сегодня."
212130-60 = "Но вы ведь знаете моё главное достоинство, Сенсей."
212130-61 = "Я невероятно настойчива."
212130-62 = ""
212130-65 = "[ns] «...Ещё увидимся, Макото»."
212130-66 = "...Я позабочусь, чтобы с вами хорошо обращались. Располагайтесь как дома."
212130-67 = ""
212130-69 = ""
212130-70 = "[ns] «...»"
212130-71 = ""
212130-76 = ""
212130-77 = "Сенсей."
212130-78 = "[s3] «Привет, Шоуко».\n[s4] «Похоже, сегодня я нарасхват»."
212130-81 = "Фу-фу... Вы не меняетесь."
212130-82 = "Знайте, что я прекрасно поняла ваше послание."
212130-83 = "Председатель Макото пытается вас переубедить, но я смотрю на вещи несколько яснее."
212130-84 = "Насколько я заметила, вы всегда мыслите одинаково."
212130-85 = "Трудиться ради студентов. И ещё усерднее трудиться ради студентов."
212130-86 = "Всё ради какой-то расплывчатой, воображаемой цели, где царят мир, милосердие и все счастливы."
212130-87 = "..."
212130-88 = "[s] «...»"
212130-89 = "Поэтому вы никогда не поддержите захватническую войну Геенны."
212130-90 = "Теперь я наконец понимаю, почему председатель Макото и глава Префектуры Хина так долго ссорились."
212130-91 = "Они все слишком мягкие. Непозволительно мягкие."
212130-92 = "Как и вы, Сенсей."
212130-93 = "Вы ведь понимаете, что мир, в котором счастливы абсолютно все, невозможен."
212130-94 = "Вы верите, что добрые намерения всех студентов рано или поздно приведут к всеобщей гармонии. Но реальность совсем иная."
212130-95 = "Большая часть энергии неорганизованной толпы расходуется впустую. Одни пустые разговоры. Это крайне, КРАЙНЕ неэффективно."
212130-96 = "[s] «Именно так студенты, ошибаясь, находят собственные ответы»."
212130-99 = "[ns] «Ты сказала, что невозможно сделать счастливыми всех»."
212130-101 = "[ns] «Но ради этого стоит трудиться сколько потребуется»."
212130-102 = "...Как легко говорить тому, кто может себе это позволить. Пока одни бесцельно ищут ответы, другие расплачиваются за их ошибки."
212130-103 = "Сенсей, вы думаете, что сможете утереть слёзы каждому опечаленному студенту? Ваше время и душевные силы ограничены."
212130-104 = "Однажды ваша «доброта» иссякнет и разрушится. А те, кому вы не успеете помочь, рухнут в бездну хаоса."
212130-105 = "Даже ВЫ не способны спасти всех, Сенсей."
212130-106 = "[s] «...»"
212130-107 = "Поэтому жёсткий контроль приносит обществу куда больше пользы."
212130-108 = ""
212130-110 = "Когда Геенна завоюет Кивотос и установит порядок, наступит подлинный мир."
212130-111 = "Тогда вы поймёте, что общество под абсолютным контролем гораздо лучше общества с призрачной свободой."
212130-112 = ""
212130-114 = "[ns] «Шоуко, раньше ты рассказывала, каким человеком хочешь стать»."
212130-115 = ""
212130-117 = ""
212130-118 = "[ns5] «Тем, кто действует без колебаний...»\n[ns6] «...и идёт вперёд, не ведая сомнений»."
212130-121 = "...Да, рассказывала."
212130-122 = "К чему вы вдруг об этом заговорили?"
212130-123 = ""
212130-127 = "[ns7] «А может быть...»\n[ns8] «...ты сказала это потому, что не доверяешь самой себе?»"
212130-130 = "...!"
212130-131 = "[s] «Шоуко, ты боишься ошибиться в своём выборе?»"
212130-132 = "..."
212130-133 = "Почему? Почему вы спрашиваете об этом именно сейчас?"
212130-134 = "Сенсей, вы под стражей. Вы в тюрьме. Под. Замком."
212130-135 = "И это я посадила вас за решётку."
212130-136 = "Именно я предложила председателю Макото и главе Префектуры Хине держать вас здесь."
212130-137 = "[s] «Я знаю.»"
212130-138 = "Тогда разве вы не должны ненавидеть меня...? Презирать всем сердцем."
212130-139 = "...Так почему же... вы так на меня смотрите?"
212130-140 = "[s9] «Ненавидеть очень легко».\n[s10] «Но учитель не должен так поступать»."
212130-143 = "Болван...!!! Людям свойственно презирать друг друга! Нас объединяет только ненависть. Такова правда этого хаотичного, жалкого мира!!!"
212130-144 = "Не смейте! Мне не нужна ваша жалость! Это вам она нужна! Вы бессильны и беспомощно заперты здесь!!!"
212130-145 = "[s11] «...Ты хочешь, чтобы я тебя ненавидел...»\n[s12] «...потому что сама не можешь простить себя за то, кем стала?»"
212130-146 = ""
212130-147 = ""
212130-149 = ""
212130-150 = "...!!!"
212130-151 = ""
212130-153 = ""
212130-154 = "...Вы ужасны, Сенсей. Вы просто отвратительный учитель."
212130-155 = ""
212130-157 = ""
212130-159 = "Никогда больше так на меня не смотрите."
212130-160 = ""
212130-166 = "[ns] «...»"
212130-169 = "Следующий эпизод;Предатели"
