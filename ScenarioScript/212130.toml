[translation]
212130-1 = "Episódio 13;Cativeiro"
212130-3 = "[ns] \"Trancado numa cela...... fazia tempo que eu não passava por isso......\""
212130-4 = "(O isolamento do mundo exterior é total, e a ansiedade só aumenta)"
212130-5 = ""
212130-14 = ""
212130-15 = "......Olha só você, Sensei."
212130-16 = "[s] \"Oi, Makoto.\""
212130-17 = "......Peço que compreenda o fato de não podermos lhe oferecer acomodações mais nobres."
212130-18 = "Eu mesma não desejava ter que recorrer a um tratamento desses."
212130-19 = "Contudo, chegaram a mim fortes pareceres de que a sua pessoa representa a nossa maior vulnerabilidade estratégica."
212130-20 = "A sua capacidade de articulação é imprevisível até mesmo para o meu brilhantismo.#nE uma vez que concordei com a tese, não me restou outra alternativa."
212130-21 = "......"
212130-22 = "Eu compreendo as razões pelas quais você se coloca em oposição."
212130-23 = "Não importa a academia ou a aluna: o Sensei sempre preza pela vida de todas. Logo, é natural que tema as convulsões que uma ofensiva contra Kivotos trará."
212130-24 = ""
212130-26 = ""
212130-27 = "Mas por que não olha por este prisma?"
212130-28 = "A Kivotos atual jaz fragmentada entre academias rivais que usam suas identidades como desculpa para impor suas próprias vontades egoístas."
212130-29 = "Disso brotam desavenças sem sentido, decisões ineficientes nascidas da desconfiança mútua e guerras sangrentas intermináveis."
212130-30 = "PORÉM!! Se todas marcharem sob a bandeira suprema de Gehenna rumo a um único objetivo,#ntais tragédias jamais se repetirão!"
212130-31 = "E há mais: unificando mentes e recursos antes dispersos, o progresso científico e social de Kivotos dará um salto assombroso!"
212130-32 = "Diga-me, Sensei: acaso não é uma visão magnífica?#nÉ a estrada dourada para que não apenas Gehenna, mas toda a Kivotos alcance a grandeza!"
212130-33 = "[s] \"Eu......\""
212130-36 = "[ns1] \"Acho que a Gehenna de antes era infinitamente mais fascinante.\"\n[ns2] \"Aquela Gehenna livre que a própria Makoto sempre quis construir.\""
212130-39 = "......"
212130-40 = ""
212130-44 = ""
212130-48 = "Argh......!!"
212130-49 = "[s] \"Makoto......?!\""
212130-50 = ""
212130-55 = ""
212130-56 = ""
212130-57 = "......Ufa."
212130-58 = "Entendo. Deixou bem clara a sua posição."
212130-59 = "Kwahaha...... Pois bem, despeço-me por hoje."
212130-60 = "Mas você conhece muito bem a minha maior virtude, não conhece?"
212130-61 = "――Eu sou incansavelmente rancorosa e persistente."
212130-62 = ""
212130-65 = "[ns] \"......Até logo.\""
212130-66 = "......Providenciarei para que não lhe falte nada de essencial durante a sua estadia."
212130-67 = ""
212130-69 = ""
212130-70 = "[ns] \"......\""
212130-71 = ""
212130-76 = ""
212130-77 = "Sensei."
212130-78 = "[s3] \"Oi, Shoko.\"\n[s4] \"Parece que hoje eu virei atração turística.\""
212130-81 = "Fufufu...... sempre com o mesmo bom humor debochado."
212130-82 = "Pude ouvir a conversa de vocês há pouco."
212130-83 = "A líder Makoto realmente acredita que conseguirá convencê-lo? Que ingenuidade patética."
212130-84 = "Pelo que conheço do seu histórico, seu padrão comportamental é absolutamente previsível:"
212130-85 = "Ajudar o maior número possível de alunas."
212130-86 = "Soluções pacíficas, misericordiosas, buscando um conto de fadas onde todos sejam felizes."
212130-87 = "......"
212130-88 = "[s] \"......\""
212130-89 = "Justamente por isso, era evidente que você jamais concordaria com o plano dela."
212130-90 = "Francamente, tanto a líder Makoto quanto a presidente Hina são frustrantes de lidar."
212130-91 = "Todas são moles demais."
212130-92 = "Inclusive você, Sensei."
212130-93 = "Um mundo onde todos alcancem a felicidade plena não passa de fantasia pueril."
212130-94 = "Você insiste em acreditar que um dia as alunas encontrarão as próprias respostas...... mas o mundo real não perdoa."
212130-95 = "A energia gerada por multidões desordenadas é quase que totalmente desperdiçada.#nÉ uma ineficiência intolerável."
212130-96 = "[s] \"Eu encaro isso como parte necessária da jornada de amadurecimento.\""
212130-99 = "[ns] \"Criar um mundo onde todos sejam felizes é uma tarefa hercúlea, eu sei.\""
212130-101 = "[ns] \"Mas é exatamente por isso que não podemos desistir de lutar.\""
212130-102 = "......Isso é privilégio exclusivo dos escolhidos.#nEnquanto alguns se dão ao luxo de buscar a própria identidade, inúmeras outras jovens perecem como vítimas da ineficiência."
212130-103 = "Acaso acredita mesmo que seus braços alcançam a todos?#nPor mais milagres que faça, o seu tempo e o seu coração têm limites finitos."
212130-104 = "Sua gentileza se esgotará aos poucos, e as que ficarem para trás despencarão no abismo da anarquia."
212130-105 = "Nem mesmo o Sensei é capaz de tornar 'todo mundo' feliz. É impossível."
212130-106 = "[s] \"............\""
212130-107 = "Sob essa ótica, o controle férreo pela opressão traz um benefício infinitamente superior."
212130-108 = ""
212130-110 = "A verdadeira paz terá início no exato instante em que Gehenna impor a ordem sobre Kivotos."
212130-111 = "Mais cedo ou mais tarde você compreenderá:#numa sociedade governada com mão de ferro é mil vezes preferível a uma liberdade medíocre."
212130-112 = ""
212130-114 = "[ns] \"Você me falou outro dia sobre o seu ideal de pessoa, lembra?\""
212130-115 = ""
212130-117 = ""
212130-118 = "[ns5] \"Alguém capaz de tomar a decisão correta sem pestanejar.\"\n[ns6] \"Alguém que marcha em frente sem jamais duvidar de si mesma.\""
212130-121 = "......Sim, me lembro perfeitamente."
212130-122 = "O que tem isso?"
212130-123 = ""
212130-127 = "[ns7] \"Não será......\"\n[ns8] \"que você mesma não consegue acreditar em si?\""
212130-130 = "O quê......?!"
212130-131 = "[s] \"Você parece apavorada diante do medo de cometer uma escolha errada.\""
212130-132 = "......"
212130-133 = "Por que diz isso?! Com que autoridade você ousa dizer tais barbaridades nesta situação?!"
212130-134 = "Quem está trancafiado atrás das grades é você, Sensei!"
212130-135 = "Colocado aí por mim, que estou do lado de fora!"
212130-136 = "Fui eu quem aconselhou a líder Makoto e a presidente Hina a encarcerá-lo!"
212130-137 = "[s] \"Eu sei muito bem disso.\""
212130-138 = "Então me odeie...... me amaldiçoe com todas as suas forças!"
212130-139 = "......Por que continua me olhando com esses olhos compassivos?!"
212130-140 = "[s9] \"Odiar é a coisa mais fácil do mundo.\"\n[s10] \"Mas alimentar ódio não é o trabalho de um professor.\""
212130-143 = "Que idiotice sem tamanho! Odiar e amaldiçoar é a verdadeira natureza humana!!#nEssa é a única realidade deste mundo caótico e asqueroso!!"
212130-144 = "Quem merece piedade não sou eu! É você, preso feito um pássaro indefeso nessa gaiola!!"
212130-145 = "[s11] \"Essa sua ânsia desesperada para que eu te odeie......\"\n[s12] \"é porque você mesma não consegue se perdoar, Shoko.\""
