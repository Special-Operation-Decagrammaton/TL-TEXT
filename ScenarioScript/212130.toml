[translation]
212130-1 = "Episode 13;Confinement"
212130-3 = "[ns] \"A cell... it's been a while...\""
212130-4 = "(Completely cut off from the outside world, anxiety begins to mount.)"
212130-15 = "...Sensei."
212130-16 = "[s] \"Hello, Makoto.\""
212130-17 = "...I hope you can understand that I had no choice but to prepare a place like this."
212130-18 = "I didn't want things to end up this way either."
212130-19 = "It's just that there are those who believe you are our greatest concern, Sensei."
212130-20 = "Your power is beyond even my own ability to predict. #nOnce I agreed with that, I had no choice but to take these measures."
212130-21 = "..."
212130-22 = "It's not that I don't understand why you would take the opposing stance."
212130-23 = "You are the kind of person who cherishes every school and every student. #nIf so, it is only natural that you would oppose anything that might harm Kivotos."
212130-27 = "But, how about looking at it this way?"
212130-28 = "The current Kivotos is a place where various schools use their own individuality as a weapon to assert their own order as they please."
212130-29 = "This leads to meaningless conflict, inefficient decisions born of distrust, and strife."
212130-30 = "But!! If all students were to walk toward the same goal under the banner of Gehenna! #nSuch problems would never happen again."
212130-31 = "That's not all. #nIf we could bundle together all the scattered thoughts and resources, Kivotos would achieve remarkable development."
212130-32 = "Sensei, don't you think that's wonderful? #nIt is a path for Kivotos, not just Gehenna, to become great."
212130-33 = "[s] \"I...\""
212130-36 = "[ns1] \"I think the old Gehenna was much better.\"\n[ns2] \"The free Gehenna that you wanted to create.\""
212130-39 = "..."
212130-48 = "Ugh...!!"
212130-49 = "[s] \"Makoto...!?\""
212130-57 = "...Phew."
212130-58 = "I see. I understand your thoughts, Sensei."
212130-59 = "Hehehe... In that case, I shall take my leave for today."
212130-60 = "But, you know my best trait, don't you?"
212130-61 = "—I am tenacious."
212130-65 = "[ns] \"...See you later.\""
212130-66 = "...I will make arrangements so that you lack for nothing while you spend your time here."
212130-70 = "[ns] \"...\""
212130-77 = "Sensei."
212130-78 = "[s3] \"Hello, Shoko.\"\n[s4] \"You're quite popular today.\""
212130-81 = "Fufu... You haven't changed a bit."
212130-82 = "I heard your conversation earlier."
212130-83 = "Chairman Makoto seems to intend to persuade you, but does she really think she can?"
212130-84 = "As far as I know, your thought patterns are consistent."
212130-85 = "For the sake of as many students as possible."
212130-86 = "Peaceful, merciful, and moving toward a future where everyone is happy."
212130-87 = "..."
212130-88 = "[s] \"...\""
212130-89 = "That is precisely why you could never affirm her."
212130-90 = "Honestly, both Chairman Makoto and Prefect Team Leader Hina are troublesome."
212130-91 = "They are all too soft."
212130-92 = "And you are the same, Sensei."
212130-93 = "A world where everyone can be happy is just a fairy tale."
212130-94 = "You believe that the students will find the answer someday, but... reality is different."
212130-95 = "The energy generated by a disorganized mob is mostly wasted. #nIt is extremely inefficient."
212130-96 = "[s] \"I believe that is also part of the process of finding the answer.\""
212130-99 = "[ns] \"I agree that creating a world where everyone is happy is difficult.\""
212130-101 = "[ns] \"That is exactly why we must keep trying.\""
212130-102 = "...That is a privilege for the select few. #nIn the shadows of those who can afford to 'find themselves,' there are undoubtedly children who become victims of that inefficiency."
212130-103 = "Do you really think you can reach out to everyone? #nEven if you push yourself to the limit, your time and heart are finite."
212130-104 = "Your kindness will gradually wear thin, and the children left behind will fall into the abyss of disorder."
212130-105 = "No matter how much of a 'Sensei' you are, 'everyone being happy' is impossible."
212130-106 = "[s] \"............\""
212130-107 = "In this regard, control through oppression brings much greater benefits."
212130-110 = "From the moment Gehenna establishes order in Kivotos, true peace will begin."
212130-111 = "You will understand eventually, Sensei. #nA society governed by overwhelming power is far better than half-baked freedom."
212130-114 = "[ns] \"You told me about your ideal image before, didn't you?\""
212130-118 = "[ns5] \"Someone who can make the right decisions without any hesitation.\"\n[ns6] \"Someone who can move forward without doubting anything.\""
212130-121 = "...That is correct."
212130-122 = "What of it?"
212130-127 = "[ns7] \"I was just wondering...\"\n[ns8] \"Are you not fully confident in yourself?\""
212130-130 = "Wha...!"
212130-131 = "[s] \"You look like you're afraid of making the wrong choice.\""
212130-132 = "..."
212130-133 = "Why? Why would you say such a thing in this situation?"
212130-134 = "You are the one locked in a cell, Sensei."
212130-135 = "On the other side of the barrier, by me."
212130-136 = "I am the one who advised Chairman Makoto and the Prefect Team Leader."
212130-137 = "[s] \"I know.\""
212130-138 = "Then you should hate me... you should resent me, shouldn't you?"
212130-139 = "...Yet, why do you look at me... with those eyes?"
212130-140 = "[s9] \"Hating is easy.\"\n[s10] \"But that is not Sensei's job.\""
212130-143 = "Ridiculous! Resentment and curses are human nature!! #nThat is the truth of this chaotic and ugly world!!"
212130-144 = "I am not the one who should be pitied! You are the one who is helplessly locked away, Sensei!!"
212130-145 = "[s11] \"The reason you want me to hate you so much is...\"\n[s12] \"Isn't it because you can't forgive yourself, Shoko?\""
212130-150 = "...!!"
212130-154 = "...You're the worst. Sensei, you are... the worst kind of person."
212130-159 = "Don't ever look at me with those eyes again."
212130-166 = "[ns] \"...\""
212130-169 = "Next Episode;The Rebels"