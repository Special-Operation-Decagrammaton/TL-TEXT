212130-147 = ""
212130-149 = ""
212130-150 = "......!!"
212130-151 = ""
212130-153 = ""
212130-154 = "......Você é desprezível. Você é...... o pior e mais nojento professor do mundo."
212130-155 = ""
212130-157 = ""
212130-159 = "Nunca mais...... ouse olhar para mim com esses olhos."
