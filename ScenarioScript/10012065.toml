10012065-153 = "[ns5] «...Нономи?!»\n[ns6] «Тебе нужно вернуться спать!»"
10012065-154 = "Хи-хи! Я тоже хочу подышать воздухом!"
10012065-155 = "Хи-хи! Я тоже хочу подышать воздухом!"
10012065-156 = "Было слишком жарко и душно, чтобы уснуть."
10012065-157 = "Хотя все остальные уснули сразу после праздника."
10012065-158 = "Широко, Серика и Аяне..."
10012065-159 = "И ещё..."
10012065-160 = "[s7] «...Нономи?»\n[s8] «О чём ты думаешь?»"
10012065-161 = "Эм-м, ничего важного."
10012065-162 = "Эм-м, ничего важного."
10012065-163 = ""
10012065-166 = "Просто... было так здорово увидеть, как все хоть раз отпустили свои тревоги."
10012065-167 = "Вся наша жизнь всегда крутилась вокруг спасения школы..."
10012065-168 = "И я вовсе не жалею об этом, но..."
10012065-169 = "Понимаю, о чём ты. Приятно видеть их улыбки. Короткая передышка перед возвращением в реальность."
10012065-170 = "...О. Хошино?"
10012065-171 = ""
10012065-173 = ""
10012065-174 = ""
10012065-177 = ""
10012065-178 = "Она самая! Что я пропустила?"
10012065-179 = "Ничего важного, но я думала, ты уснула на своём круге."
10012065-180 = "Ха-ха-ха! Очень удобный получился сон."
10012065-181 = "Но из-за влажности я толком так и не смогла уснуть."
10012065-182 = "И это говорит человек, который спит на каждом собрании..."
10012065-184 = ""
10012065-187 = "Хи-хи. Ладно, поймали. Я просто отдыхала под шум волн."
10012065-188 = "Ты всегда расслаблена — даже когда вертолёт падает! ☆"
10012065-189 = "Что это за дерзкая Нономи? Откуда она взялась?"
10012065-190 = "Потому что нас только трое? Или знойная летняя ночь тебя изменила!"
10012065-191 = "Хм... Одно из двух..."
10012065-192 = "Хи-хи. Давайте считать, что после отпуска я стала новой женщиной."
10012065-193 = "Это старость? Не могу поверить, что мои заботливые и милые младшие становятся вот такими людьми."
10012065-195 = "Может, потому что ты была такой доброй!"
10012065-196 = "На барбекю ты и правда помогала. Я даже не была уверена, что верю собственным глазам!"
10012065-197 = ""
10012065-200 = ""
10012065-201 = "Точно! Не могу поверить, что одна летняя ночь способна так изменить человека!"
10012065-202 = "Я начала помогать раньше, чем поняла, что делаю. Кто это вообще была?"
10012065-203 = "Или дело было в инструментах..."
10012065-204 = ""
10012065-206 = ""
10012065-207 = "...тех самых, что были подготовлены для Праздника Пустыни Абидос?"
10012065-209 = "...Хошино..."
10012065-210 = "Ну-ну."
10012065-211 = "Я не хочу быть причиной такого выражения на твоём лице, Нономи."
10012065-212 = "Широко, Аяне и Серика...."
10012065-213 = "Я не хочу мешать своим очаровательным младшим. Их единственная задача — продолжать расти."
10012065-214 = "...Но почему ты заговорила об этом именно сейчас?"
10012065-215 = "Хм... Может, дело в мистике летней ночи на пляже."
10012065-216 = "Надеюсь, ты понимаешь, Нономи. Я просто хочу видеть, как вы все улыбаетесь."
10012065-217 = ""
10012065-219 = ""
10012065-220 = "...Хорошо, поняла. Уж это я могу. ☆"
10012065-221 = "Хм-м."
10012065-222 = "Раз с делами разобрались, почему бы нам немного не посидеть и не поболтать?"
10012065-223 = "Наша летняя ночь ведь ещё не закончилась."
10012065-224 = "Ай! Уже давно пора спать. Можно я вернусь и продолжу спать?"
10012065-225 = "Ты весь день проспала! Когда ещё мы сможем вот так побыть вместе?"
10012065-226 = "Верно, Сенсей?"
10012065-227 = "[s9] «Она права.» \n[s10] «Что ж, нельзя разрушать чары летней ночи.»"
10012065-228 = "Сенсей! Вы никогда не на моей стороне!"
10012065-229 = "Сенсей! Вы никогда не на моей стороне!"
10012065-230 = ""
10012065-232 = ""
10012065-233 = ""
10012065-235 = "Мы втроём разговаривали, пока они уже не могли держать глаза открытыми."
