[translation]
10012065-1 = "Эпизод 6; Сон в летнюю ночь"
10012065-4 = ""
10012065-5 = "Поднимаем!"
10012065-6 = "Фух. Это была последняя коробка."
10012065-7 = "Здесь всё готово. Сенсей?"
10012065-8 = "[s1] «Я выполнил задание, мэм.» \n[s2] «Ох, моя спина.»"
10012065-9 = "Очень смешно. Дальше я сама."
10012065-10 = "Не драматизируй! Но можешь передохнуть."
10012065-11 = "Вы уверены, что так можно? У нас ещё осталось кое-что сделать."
10012065-12 = "Не уверена, что сейчас подходящее время для барбекю-вечеринки."
10012065-14 = "Тебе нужно научиться расслабляться, Аяне."
10012065-15 = "Одна работа без отдыха делает Хошино очень ворчливой, знаешь ли!"
10012065-16 = "Этого мы допустить не можем, так что давайте веселиться! ☆ Я хочу сделать общее фото."
10012065-18 = "Разве не вы сами говорили мне, что ремонт и уборка — это тоже часть отпуска?"
10012065-20 = "А-ха-ха-ха..."
10012065-21 = "Прими совет от этой старушки: нет смысла зацикливаться на прошлом."
10012065-22 = "Из крупного нам осталось только починить вертолёт... но это проблема завтрашнего дня!"
10012065-23 = "Наша проблема прямо сейчас — как приготовить вкусное барбекю!"
10012065-24 = "Давайте устроим вечеринку!"
10012065-26 = ""
10012065-28 = ""
10012065-29 = "Но... вертолёт..."
10012065-30 = "Аяне, что я говорила про отдых? Разгладь лоб!"
10012065-31 = "Клянусь мизинчиком: завтра мы все вместе пойдём и починим его. Все детали уже нашли."
10012065-32 = "Я тоже обещаю. Скорее всего, уйдёт весь день, поэтому начнём рано утром."
10012065-33 = "После наступления темноты ремонтировать небезопасно. Сейчас нам лучше отдохнуть и подготовиться к завтра."
10012065-34 = "Ага, ага! Отдых так же важен, как работа. А может, даже важнее!"
10012065-35 = "Нономи... Широко..."
10012065-37 = "Кстати, это самый долгий промежуток без тех странных типов."
10012065-38 = "Думаете, система безопасности с ними справилась? Она ведь говорила, что просканировала весь остров."
10012065-39 = "...Это вполне возможно."
10012065-40 = "Будем надеяться на лучшее."
10012065-42 = "Они ведь как-то сюда добрались. Наверное, запрыгнули обратно на свой транспорт и дали дёру."
10012065-43 = "Хм... Мне даже немного неловко из-за этого..."
10012065-44 = "Не должно, Нономи! Это они первыми на нас напали!"
10012065-45 = "Мне их ни капли не жалко! Мы защищали наш драгоценный отпуск!"
10012065-46 = "И Сенсея. Нам нужно было защитить Сенсея."
10012065-47 = "Точно! Мы защитили Сэн—"
10012065-48 = "Какая разница, кого мы защищали? Мне всё равно!"
10012065-49 = "В-В общем! Хватит копаться! Я пойду разбирать вещи."
10012065-50 = ""
10012065-52 = ""
10012065-53 = "А-ха-ха... Я пойду ей помогу..."
10012065-54 = ""
10012065-56 = ""
10012065-57 = "Ну до чего же они милые. Так и хочется ущипнуть за щёчки."
