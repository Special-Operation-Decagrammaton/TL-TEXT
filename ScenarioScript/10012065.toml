10012065-138 = "Мы хорошо поели барбекю и играли на пляже до самого вечера."
10012065-139 = "Когда все студенты Оперативной группы по закрытию уже крепко спали на курорте, я тихонько вышел подышать воздухом."
10012065-140 = "..."
10012065-141 = "Привет, Сенсей."
10012065-142 = "[s] «……?»"
10012065-143 = "Та-да! ☆ Это Нономи."
