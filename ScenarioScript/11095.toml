[translation]
11095-2 = "(Dim-dom, dim-dom)"
11095-3 = "...Ah, deu o nosso horário."
11095-4 = "Pela diária de hoje, vamos só até aqui. O resto vocês que se virem.#nPessoal, vamos embora."
11095-5 = "H-Hã?! E-Esperem aí!!"
11095-8 = "Parece que acabou o expediente."
11095-9 = "Vamos passar numa casa de sobá na volta?"
11095-12 = "Ei!! O-O que é que significa isso?! Ei! Não podem ir embora!!"
11095-13 = "..."
11095-14 = "Vish, deu ruim. Quem diria que não íamos resolver isso a tempo... Aru-chan?#nO que a gente faz? Vamos fugir?"
11095-15 = "Ah... uuh..."
11095-16 = "N-Não pensem que isso acabou aqui, Abydos!!"
11095-17 = "Ahaha, Aru-chan, isso aí é fala total de vilã de terceira categoria."
11095-18 = "Cala a boca! Vamos fugi... quer dizer, bater em retirada!"
11095-21 = "Esperem! ...Ah, já foram embora."
11095-22 = "Uhe~ Elas são bem rápidas pra fugir, hein."
11095-23 = "...Não sei os detalhes, mas confirmo o fim do expediente... digo, a retirada das forças inimigas."
11095-24 = "Que situação complicada... Até uma agência de faz-tudo esquisita está atrás de nós, fico preocupada com o que vem pela frente...#nO que será que está acontecendo...?"
11095-25 = "Bom, vamos investigar aos poucos. Que tal começar puxando a ficha daquela tal presidente, a Aru? Com certeza vai aparecer alguma coisa."
11095-26 = "Sim. Bom trabalho, pessoal. Por enquanto, retornem à escola."
11095-28 = "Próximo;Em Busca de Pistas"
