[translation]
1014003-1 = "Мудрая лисица"
1014003-2 = "Исполнительный офис Шале"
1014003-3 = "Сегодня Куруми была Представителем Студентов, и мы разбирали лёгкую административную работу."
1014003-4 = ""
1014003-6 = ""
1014003-7 = ""
1014003-8 = ""
1014003-9 = ""
1014003-10 = ""
1014003-11 = "Хм... Мы примерно на половине?"
1014003-12 = "...Может, из-за жаркого солнца, но сегодня в Шале теплее обычного."
1014003-13 = "[s1] «Может, передохнём?»\n[s2] «Давай выпьем что-нибудь и переведём дух.»"
1014003-16 = "Хорошо!"
1014003-20 = "[ns] «...О нет, куда он делся?»"
1014003-21 = "Что такое, Сенсей?"
1014003-22 = "[s3] «Я хотел открыть бутылку...»\n[s4] «Но нигде не могу найти открывашку.»"
1014003-25 = "Что... Вот из-за чего вы переживали?"
1014003-26 = ""
1014003-28 = ""
1014003-29 = "Дайте сюда. Я открою. Нужна только ложка."
1014003-30 = ""
1014003-32 = ""
1014003-35 = "[ns] «Ого, как ты это сделала?»"
1014003-36 = "Ничего особенного."
1014003-37 = "Открывашка для бутылок по сути просто рычаг. Пока можно подцепить крышку снизу, открыть бутылку можно чем угодно."
1014003-38 = "Таскать открывашку во время тренировок неудобно, поэтому пришлось научиться открывать другими инструментами."
1014003-39 = "[s5] «Вот именно об этом говорили остальные!»\n[s6] «Ты отлично соображаешь на ходу, Куруми!»"
1014003-42 = "Столько похвалы за такую простую вещь, как открыть бутылку..."
1014003-43 = "Ну, я всё-таки иду первой в отряде FOX. Импровизация — часть работы."
1014003-44 = "Я веду отряд, первой встречаю врага и разбираюсь со всем остальным, что он для нас приготовил."
1014003-45 = "Для обязанностей Представителя Студентов этот навык не самый полезный, но иногда пригодится. Например, починить электронику или вскрыть замок..."
1014003-46 = "[s] «Серьёзно?»"
1014003-47 = ""
1014003-50 = "[ns7] «Вообще-то у меня есть замок, от которого потерялся ключ...»\n[ns8] «Можешь его открыть?»"
1014003-53 = "Конечно. Несите."
1014003-54 = ""
1014003-55 = "Это... цилиндровый штифтовый замок. Дайте десять секунд."
1014003-56 = "Просто загнуть конец шпильки и выставить высоту цилиндра..."
1014003-57 = ""
1014003-59 = ""
1014003-60 = "Поняла!"
1014003-61 = "[s9] «Это потрясающе...!»\n[s10] «Так ты и проникла в Шале...?»"
1014003-63 = "Ах! Зачем вы сейчас это вспомнили?!"
1014003-64 = "Я всё ещё искупаю вину, ясно...?"
1014003-65 = "В любом случае! Теперь вы видите мои навыки! Быстрая адаптация — одна из моих сильных сторон."
1014003-66 = "[s] «Тогда и это откроешь?»"
1014003-67 = "Ч-Что...?"
1014003-68 = "...Это электронный замок."
1014003-69 = "Немного раздражает, но положение механизма отключения засова фиксировано..."
1014003-70 = ""
1014003-72 = ""
1014003-73 = "Вот, открыто."
1014003-74 = ""
1014003-76 = "Это проводные наушники? Как они так запутались?"
1014003-77 = "Тугие узлы можно распустить, если протолкнуть провод через узел и слегка покрутить в противоположную сторону."
1014003-78 = ""
1014003-80 = ""
1014003-81 = "Вот так... Готово, распутано."
1014003-82 = "[s11] «Потрясающе, просто потрясающе!»\n[s12] «Тогда напоследок откроешь это?»"
1014003-85 = "Это..."
1014003-86 = "Кольцо-головоломка!"
1014003-87 = "Это игрушка, которую специально сделали сложной! Вы издеваетесь?"
1014003-88 = "[s13] «Я думал, передовая боец может преодолеть любое препятствие...»\n[s14] «...Или такие кольца слишком сложные?»"
1014003-91 = "Ещё чего! Давайте сюда."
1014003-92 = ""
1014003-94 = ""
1014003-95 = "...Что за странная конструкция? Как это вообще собрали?"
1014003-96 = "..."
1014003-97 = "Д-Дайте немного времени. Сейчас решу!"
1014003-102 = "После этого я весело провёл день, наблюдая, как Куруми мучается с кольцом-головоломкой."
