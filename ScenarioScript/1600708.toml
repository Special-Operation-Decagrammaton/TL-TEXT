[translation]
1600708-1 = "Небольшая выдумка больше похожа на ошибку, чем на ложь"
1600708-2 = "Перед главными воротами Федеральной академии Красной Зимы"
1600708-3 = "Доброе утро, Сенсей."
1600708-4 = "Как я уже говорила, сегодня я планирую снять документальный фильм о великих достижениях президента Черино."
1600708-5 = "От кабинета Секретариата, где президент Черино обычно проводит время..."
1600708-6 = "До кондитерской, куда она часто заходит на переменах..."
1600708-7 = "Мы проследим за распорядком дня президента Черино и побываем в разных уголках Академии Красной Зимы, записывая каждую деталь её предпочтений и повседневной жизни!"
1600708-8 = "[s] «Для этого я тебе не нужен, разве нет?»"
1600708-9 = "На самом деле нужны. Это станет шедевром Офиса Красной Зимы. В ближайшем будущем его будут показывать в кинотеатрах по всему Кивотосу!"
1600708-10 = "Поэтому мне необходимо учитывать мнение людей со стороны, не принадлежащих к Академии Красной Зимы."
1600708-11 = "Чтобы фильм был ближе нашей аудитории, мне понадобятся мысли и впечатления человека со стороны."
1600708-12 = "[s] «Это несложно, но...»"
1600708-13 = "Хорошо. Сегодня я буду обращаться с вами так, словно вы президент, и обслуживать вас соответствующим образом, поэтому просто наслаждайтесь днём."
1600708-14 = "Съёмка... начинается!"
1600708-16 = "Офис Красной Зимы"
1600708-17 = "Это Секретариат, где члены Офиса Красной Зимы занимаются своими делами."
1600708-18 = "Президент Черино начинает свой день именно здесь."
1600708-19 = "Каждое утро, приходя в школу, президент Черино заказывает чашку чёрного чая с большим количеством варенья."
1600708-20 = "[s1] «Чёрный чай с вареньем?»\n[s2] «Даже не представляю, какой он на вкус.»"
1600708-21 = "Хи-хи. Может, звучит странно, но сладость варенья прекрасно сочетается с терпкостью чёрного чая."
1600708-22 = "Хи-хи. Может, звучит странно, но сладость варенья прекрасно сочетается с терпкостью чёрного чая."
1600708-23 = "Хотите попробовать, Сенсей?"
1600708-24 = "[s] «Конечно, давай попробуем.»"
1600708-25 = "Хорошо, я сейчас же принесу вам чашку чая. Пожалуйста, присядьте и подождите."
1600708-26 = ""
1600708-28 = ""
1600708-31 = "Мы с Томоэ весело болтали за чаем."
1600708-33 = "Кондитерская в районе Красной Зимы"
1600708-34 = "Это кондитерская, где продают любимый пудинг президента Черино."
1600708-35 = "Президент была настолько довольна пудингом, что наградила заведение медалью. Благодаря этому местные десерты можно украшать усами — символом власти."
1600708-36 = "Хотя пудинг здесь великолепен, большой популярностью также пользуются «Усатые блины» с красной икрой и сладким кремом."
1600708-37 = "[s] «Красная икра и сладкий крем... правда хорошо сочетаются?»"
1600708-38 = "Хи-хи, хотите тоже попробовать?"
1600708-39 = "Подождите минутку. Я принесу вам «Усатый блин»."
1600708-40 = ""
1600708-42 = ""
1600708-45 = "Мы с Томоэ поделили принесённый ею «Усатый блин» и прекрасно провели время."
1600708-46 = "После этого я отправился с Томоэ на экскурсию по Академии Красной Зимы и выслушал множество её историй."
1600708-50 = "Перед главными воротами Федеральной академии Красной Зимы"
1600708-51 = "Ого. Не могу поверить, что уже так поздно."
1600708-52 = "Мы всего лишь повторяли её обычный распорядок, а день уже закончился... Президент Черино и правда очень занята."
1600708-53 = "[s] «В основном мы просто ели и развлекались.»"
1600708-54 = "Хи-хи, но день всё равно получился весёлым."
1600708-55 = "Уверена, фильм получится замечательным. Не могу дождаться, когда увижу его."
1600708-56 = "[s3] «Я уже давно хотел спросить...»\n[s4] «А где камера, на которую мы снимаем?»"
1600708-57 = "..."
1600708-58 = "О боже, я забыла камеру."
1600708-59 = "..."
1600708-60 = "О боже, я забыла камеру."
1600708-61 = "Мне было так весело разговаривать с вами, что я, должно быть, совсем о ней забыла. Хи-хи."
1600708-62 = "[ns] «Это слишком очевидно, чтобы быть простой ошибкой.»"
1600708-64 = "[ns] «Ты соврала про фильм, чтобы появился повод провести со мной время?»"
1600708-65 = ""
1600708-66 = ""
1600708-68 = ""
1600708-72 = "Моя преданность президенту Черино ничуть не изменилась, но в одном из моих любимых фильмов есть такая фраза."
1600708-73 = "«Небольшая выдумка больше похожа на ошибку, чем на ложь.»"
1600708-74 = "Так что эта маленькая выдумка, которую я придумала, чтобы побаловать вас, скорее была небольшой ошибкой, чем ложью."
1600708-75 = "Сенсей, сегодняшний день с вами был весёлым совсем иначе, чем моя обычная жизнь рядом с президентом Черино."
1600708-76 = "Пожалуй, мне стоит и дальше иногда допускать такие ошибки."
1600708-78 = "После этого я с удовольствием подыгрывал «ошибке» Томоэ до самого конца дня."
