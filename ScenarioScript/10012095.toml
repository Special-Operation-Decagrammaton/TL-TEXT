[translation]
10012095-2 = "Сегодня столько всего произошло! ☆"
10012095-3 = "Я думала, выиграла отличный первый приз, а в итоге мы влипли в это. Отстой."
10012095-5 = "В этом мире ничего не бывает бесплатно, Серика."
10012095-6 = "Не строй из себя умную! Ты первой упаковала купальник!"
10012095-7 = "Не вижу связи."
10012095-9 = "Как бы там ни было, давайте просто порадуемся, что всё закончилось."
10012095-10 = "Сенсей, вы нашли время в своём плотном графике ради нас. Простите, что всё превратилось в странную курортную королевскую битву."
10012095-11 = "Хех. Похоже, мы в итоге соврали Сенсею насчёт того, что это будет отпуск."
10012095-12 = "[s] «Не за что извиняться.»"
10012095-13 = "Серьёзно?"
10012095-14 = "[s1] «Мне было весело со всеми вами.» \n[s2] «Это был незабываемый отпуск.»"
10012095-17 = "О-о! ☆ Сенсей всегда такой добрый! ☆"
10012095-18 = "[s] «А вы? Как вы к этому относитесь?»"
10012095-19 = "Н-Не задавайте такие смелые вопросы прямо в лоб!"
10012095-20 = "Хех! Серика милее всего, когда смущается."
10012095-21 = "Уgh! Х-Хошино!"
10012095-22 = "...Мне очень понравилось. Особенно занятия на выживание."
10012095-24 = "Хи-хи! Я всегда буду помнить наше барбекю!"
10012095-25 = "Было немного хаотично... но когда у нас бывает иначе?"
10012095-27 = "А ты, Серика?"
10012095-29 = "А? Я?! Я-я...!"
10012095-30 = "К-Конечно... Э-Это было в-вес—"
10012095-31 = "[s] «Ну что ж. Тогда мне пора.»"
10012095-32 = "Вы отложили кучу работы дома, чтобы приехать с нами. Наверняка пора к ней возвращаться."
10012095-33 = "О, точно. Нужно поторопиться, иначе станет слишком темно, чтобы я смогла отвезти вас назад."
10012095-35 = "Мы останемся до завтра, чтобы собраться и прибраться."
10012095-36 = "Эй?! Я вообще-то говорила!"
10012095-37 = "Ой, Серика! Обещаю, потом обязательно найдём время поностальгировать. Может, устроим чаепитие с Сенсеем! Хи-хи."
10012095-38 = "Не то чтобы я хотела ностальгировать. Уgh!"
10012095-39 = "Забудьте! Мне уже всё равно!"
10012095-41 = "[ns] «Кажется, это мой сигнал.»"
10012095-42 = "Я безопасно доставлю Сенсея в Шале и вернусь!"
10012095-43 = "Удачи, Аяне!"
10012095-45 = ""
10012095-46 = "Хи-хи! Пусть отпуск и вышел коротким, надеюсь, Сенсей всё равно хорошо отдохнул."
10012095-47 = "Уверена, Сенсей расслабился и полностью восстановил силы."
10012095-48 = "Это было бы замечательно!"
10012095-49 = "Что хотите делать, детишки? Начнём собираться?"
10012095-50 = "*вздыхает* Я вообще не чувствую себя отдохнувшей, но пора возвращаться к работе. Отпускных дней у меня осталось не так много..."
10012095-51 = ""
10012095-53 = ""
10012095-54 = "О, курортный контракт...!"
10012095-55 = "Просто выброси. Нам эта фигня не нужна."
10012095-56 = "Хи-хи-хи! Я заберу его как сувенир."
10012095-57 = "Дайте я положу его..."
10012095-59 = "О?"
10012095-60 = "Что-то не так?"
10012095-61 = "Смотрите, вот здесь. В самом конце контракта... написано «Владелец Потерянного рая»."
10012095-62 = "А?! Типа хозяин?!"
10012095-63 = "Как мы это пропустили?"
10012095-64 = "Владелец... вероятно, и есть виновник."
10012095-65 = "То есть это он распространил эти тупые контракты и лазейки, чтобы запустить всю эту Охоту на курорты?!"
10012095-66 = "Кто этот придурок?"
10012095-67 = "Можно посмотреть, Нономи?"
10012095-68 = "Вот!"
10012095-69 = "Хм-м. Владелец Потерянного рая... менеджер по инвестициям и эксплуатации курорта..."
10012095-70 = "Имя..."
10012095-71 = ""
10012095-72 = ""
10012095-73 = "А?"
10012095-74 = "Оперативная группа по восстановлению курорта Абидоса"
