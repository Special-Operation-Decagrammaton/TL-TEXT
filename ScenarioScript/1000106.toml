[translation]
1000106-1 = "Полный образ"
1000106-2 = "Бутик в торговом центре"
1000106-3 = ""
1000106-4 = ""
1000106-5 = ""
1000106-6 = ""
1000106-7 = ""
1000106-8 = "Давно я не была в бутике. Я не покупаю новую одежду, пока старая не износится, поэтому редко хожу за вещами."
1000106-9 = "Так... Хм, бюстгальтеры с застёжкой спереди теперь бывают стольких цветов. Раньше выбирать было проще."
1000106-10 = "Бюстгальтеры с застёжкой спереди намного удобнее надевать и снимать. Расстегнуть крючки за спиной куда сложнее, чем кажется."
1000106-11 = ""
1000106-12 = ""
1000106-13 = "Сенсей, ты плохо выглядишь. Тебе некомфортно?"
1000106-14 = "[s] «Зачем ты привела меня сюда...?»"
1000106-15 = "Хм? Я же написала в сообщении. Хотела, чтобы ты помог выбрать одежду."
1000106-16 = "Прости. У тебя есть более важные дела?"
1000106-17 = "Разве нижнее бельё не считается одеждой? Я совершенно не понимаю твоего замешательства, Сенсей."
1000106-18 = "Если носить неподходящее бельё, можно нарушить весь баланс тела. Правильное бельё крайне важно для эффективности."
1000106-19 = "[s] «Тогда почему бы просто не выбрать самое удобное?»"
1000106-20 = "Ну, друзья говорят, что нужно носить милое бельё. Знаешь... на всякий случай."
1000106-21 = ""
1000106-22 = ""
1000106-23 = "А как вообще выглядит «милое бельё»? Можешь выбрать для меня?"
1000106-26 = "― Сенсей, а это? Мне подходит?[wa:3420]"
1000106-29 = "― Бельё — это просто вид одежды. Не понимаю, почему его нельзя показывать другим.[wa:460]"
1000106-32 = "― Это бельё кажется тесноватым... Интересно, есть размер побольше.[wa:3560]"
1000106-35 = "― Ах... Так не пойдёт. Я просто примерю его, а потом посмотрим, как сидит.[wa:3080]"
1000106-38 = "― Что, здесь нельзя переодеваться? Угх... В примерочных всегда так тесно...[wa:2520]"
1000106-41 = "Мне пришлось остановить Эйми, когда она начала снимать бельё прямо в магазине. После этого мы купили несколько комплектов одежды."
1000106-43 = "Спасибо за сегодня, Сенсей. Благодаря тебе я купила всё необходимое."
1000106-44 = "Итак, чтобы убедиться: в следующий раз в магазине мне не следует снимать одежду?"
1000106-45 = "Знаю-знаю. Ты постоянно говорил мне этого не делать."
1000106-46 = "Это менее эффективно, но поверю тебе. Обещаю."
