10027070-1 = "Эпизод 7;Шестерёнка"
10027070-2 = "Библиотека Красной Зимы"
10027070-3 = ""
10027070-4 = ""
10027070-5 = "Она ушла?"
10027070-6 = "[s] «Ага. Всё хорошо.»"
10027070-7 = "Понятно... Хорошо..."
10027070-8 = ""
10027070-10 = ""
10027070-13 = "[ns] «Мэру?!»"
10027070-14 = "Я в порядке. Просто немного пьяная от усталости и на адреналине после этого нервотрёпного разговора."
10027070-15 = "Рисование манги, наверное, кажется вам тяжёлой работой, да? Хи-хи... Рада, что вы понимаете, через что я прохожу, Сенсей."
10027070-16 = "А теперь просто дайте мне немного поспать... И не будите, если только Кивотос не начнёт рушиться вокруг нас."
10027070-18 = ""
10027070-21 = "Мэру тут же снова провалилась в сон..."
10027070-22 = ""
10027070-27 = "Я осторожно перенёс Мэру на кровать и уложил её. Затем плюхнулся в библиотечное кресло, которое она до этого занимала."
10027070-34 = "[ns] «А? Кто звонит?»"
10027070-37 = "[ns] «Момидзи?!»"
10027070-39 = ""
10027070-42 = "Горная дорога Красной Зимы"
10027070-43 = ""
10027070-44 = "П-Привет. Сенсей. Как вы?"
10027070-45 = "О, у меня всё нормально."
10027070-46 = "..."
10027070-47 = "Ну... Вообще-то бывало и лучше. Мне бы не помешал ваш совет..."
10027070-48 = "Что случилось?"
10027070-49 = "..."
10027070-50 = "Дело в Мэру..."
10027070-51 = "[s] «Вы с Мэру поссорились?»"
10027070-52 = "Д-Да! Откуда вы узнали?!"
10027070-53 = "Погодите— Почему вы в библиотеке Фронта освобождения знаний?! Что случилось?!"
10027070-55 = ""
10027070-60 = ""
10027070-61 = ""
10027070-62 = "Понятно. Мэру так сказала...?"
10027070-63 = "Эй, Сенсей?"
10027070-64 = "Я тоже хочу помириться с Мэру."
10027070-65 = "Да, она зациклена на себе, громкая, бывает одновременно дерзкой И робкой в самые неподходящие моменты, но..."
10027070-66 = "В главном она неплохой человек."
10027070-67 = "Думаю, я слишком остро отреагировала на «Луну». Она имеет право на собственное мнение."
10027070-68 = ""
10027070-70 = ""
10027070-71 = "В конце концов, Мэру писатель."
10027070-72 = "Просто в этот раз наши взгляды столкнулись."
10027070-73 = "Я позволила эмоциям взять верх и наговорила Мэру вещей, о которых теперь жалею."
10027070-74 = "А поскольку Мэру не очень умеет извиняться, я подумала, что, может, стоит сделать первый шаг самой."
10027070-75 = ""
10027070-78 = "[ns1] «Кстати об этом, Момидзи.»\n[ns2] «Мэру сейчас вообще-то пишет 22-й том „Луны“...»"
10027070-81 = ""
10027070-82 = "Что?! Ты вообще о чём?!"
10027070-83 = "Меня не было даже недели, а Фронт освобождения знаний уже внезапно делает мангу?!"
10027070-85 = "Я рассказал Момидзи обо всём, что произошло..."
10027070-86 = ""
10027070-93 = ""
10027070-94 = "..."
10027070-95 = "..."
10027070-96 = "..."
10027070-97 = "[s] «Эй, Момидзи...?»"
10027070-98 = "Я даже не знаю, что сказать..."
10027070-99 = "[s] «Понимаю это чувство...»"
10027070-100 = "Мэру стала совсем другим человеком, вы ей помогаете, фанфик готов наполовину, и у неё осталось два дня?"
10027070-101 = "Не могу поверить, что это происходит. Наверное, я сплю."
10027070-102 = "Это не может быть реальностью. Слишком много всего... Вот уж реальность как ударит, так УДАРИТ."
10027070-103 = "Никто бы не ожидал, что Мэру зайдёт настолько далеко."
10027070-104 = "Я понимаю, что чувствует Мэру. Со мной такое постоянно. Когда чем-то по-настоящему увлечёшься, ни на чём другом сосредоточиться невозможно, что бы ни говорили окружающие..."
10027070-105 = "[s] «Но всё-таки Мэру создаёт этот фанфик ради тебя, Момидзи.»"
10027070-106 = "Ну..."
10027070-107 = "Я знаю... Хи-хи... Даже не могу описать, насколько странно себя из-за всего этого чувствую..."
10027070-108 = "Мне уже всё равно, чем закончится остальное. Я точно хочу увидеть «Луну» Мэру."
10027070-109 = ""
10027070-112 = "Ты правда это говоришь?!"
10027070-113 = "?!"
10027070-114 = "[s] «?!»"
10027070-115 = ""
10027070-118 = ""
10027070-119 = "..."
10027070-120 = "М-Мэру?!"
10027070-121 = "Я проснулась после сна как раз когда Сенсей выбежал наружу... Мне стало интересно..."
10027070-122 = "Так ты слышала весь наш разговор?!"
10027070-123 = "Не весь... Только самое важное..."
10027070-125 = "Хуэээх..."
10027070-126 = "Уэээх..."
10027070-127 = ""
10027070-129 = ""
10027070-131 = "[ns] «Ммм...»"
10027070-132 = "С-Сенсей?! Вы можете сделать что-нибудь кроме того, чтобы стонать вместе со всеми? Скажите что-нибудь полезное!"
10027070-133 = "Да, Сенсей. Вы же учитель. Поделитесь с нами мудростью."
10027070-134 = "[s] «Истинная мудрость — знать, что ты ничего не знаешь...»"
10027070-136 = "Сейчас совсем не время для бесполезных банальностей..."
10027070-138 = ""
10027070-140 = ""
10027070-141 = ""
10027070-142 = "Эм, Мэру? Мы..."
