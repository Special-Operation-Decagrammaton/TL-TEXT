[translation]
10028030-1 = "Эпизод 3;На передовую"
10028030-4 = ""
10028030-5 = "Что вы делаете так далеко в этой глуши?"
10028030-6 = ""
10028030-8 = ""
10028030-10 = ""
10028030-11 = "...Да ещё с таким очаровательным маленькым студентом Тринити."
10028030-13 = ""
10028030-14 = ""
10028030-15 = "...?"
10028030-16 = "Она только что назвала меня очаровательной...?"
10028030-17 = "[s] «Касуми, следи за манерами.»"
10028030-18 = "Всё нормально, Сенсей. Вам не нужно меня защищать."
10028030-19 = "Членов Спецотряда правосудия не так легко вывести из равновесия."
10028030-20 = ""
10028030-23 = ""
10028030-24 = ""
10028030-25 = "...Хммм?"
10028030-26 = ""
10028030-28 = ""
10028030-29 = ""
10028030-30 = ""
10028030-31 = "Эй-эй! Мне нравится, к чему ты клонишь."
10028030-32 = "Вот такой настрой мне по душе! Вахаха!"
10028030-33 = "Как она и сказала, оставим прошлое в прошлом и сосредоточимся на общей картине. Хорошо? Хорошо!"
10028030-34 = "Раз уж мы вместе уже прыгнули в кипяток, можем и выбираться вместе!"
10028030-35 = "Похоже, у нас теперь совместный бизнес, народ! Пора оформлять ООО!"
10028030-36 = "...По крайней мере, пока не выберемся из этого поезда. Хи-хи."
10028030-37 = ""
10028030-39 = ""
10028030-40 = "[ns1] «Бизнес...? Мы...?»\n[ns2] «Пока не выберемся из поезда?»"
10028030-43 = "А?"
10028030-44 = "Что за ошарашенное лицо? Не знаю, как можно было выразиться ещё яснее... А! Может, ты всё ещё в шоке!"
10028030-45 = "Не волнуйся, попробую объяснить попроще! Ваша цель — найти сумку и сойти с поезда. Моя — выбраться и не попасть под арест!"
10028030-46 = "А значит, у нас общая цель: остановить поезд, чтобы мы могли спокойно с него сойти! Враг моего врага — мой друг."
10028030-47 = ""
10028030-49 = ""
10028030-50 = "Ты... не ошибаешься."
10028030-51 = ""
10028030-53 = ""
10028030-54 = ""
10028030-55 = ""
10028030-56 = "Но я не думаю, что наше положение настолько же тяжёлое, как твоё, Касуми."
10028030-57 = "Мы невинные гражданские, пытающиеся вернуть потерянную сумку. Ты же, с другой стороны, преступница в бегах."
10028030-58 = "Так что, если не возражаешь, мы с Сенсеем пойдём своей дорогой..."
10028030-59 = "Тсс! Когда кто-то говорит, вежливо дослушать до конца! Не перебивай!"
10028030-60 = "Поняла-поняла. Очаровательные и элегантные дамы из Тринити не водятся с преступниками Геенны с другой стороны рельсов, да?"
10028030-61 = "Но здесь, в суровой дикой глуши, приходится решаться! Приходится делать то, чего не хочешь, когда всё не подают тебе на золотом блюдечке!"
10028030-62 = "Жизнь не так проста, когда не потягиваешь чай из башни из слоновой кости. Вахаха!"
10028030-63 = ""
10028030-65 = ""
10028030-66 = "Ага... ха-ха..."
10028030-67 = "Понятно. Спасибо за ценный совет, Касуми..."
10028030-68 = "Только можно спросить... зачем нам вообще нужна твоя помощь, чтобы найти сумку? Хм?"
10028030-69 = "Хи-хи. Насчёт этого—"
10028030-70 = ""
10028030-72 = ""
10028030-73 = "Что это было? Они делают объявление?"
10028030-74 = "Ага."
10028030-75 = "Безупречный тайминг!"
10028030-76 = ""
10028030-78 = ""
10028030-79 = "...Кхм. Внимание."
10028030-80 = "Объявление для всех пассажиров и сотрудников."
10028030-81 = "К сожалению, часть груза в задних вагонах взорвалась из-за непредвиденной аварии."
10028030-82 = "Наши сотрудники прямо сейчас пересаживают пассажиров на новые места."
10028030-83 = "В целях безопасности оставайтесь на своих местах и выполняйте все инструкции."
10028030-84 = "Поскольку груз содержит опасные материалы, мы пропустим обычные остановки и проследуем до ближайшей станции, оборудованной для безопасной утилизации."
10028030-85 = "Следующая остановка — район Геенны, зона 32-1."
10028030-86 = "Благодарим за терпение."
10028030-87 = ""
10028030-90 = ""
10028030-91 = "...А?"
10028030-92 = "Они меняют пункт назначения? Но зачем?"
10028030-93 = "[s3] «Половина этого объявления — ложь...»\n[s4] «Это мы, что ли, опасные материалы?»"
10028030-96 = ""
10028030-98 = ""
10028030-99 = "Также пассажирам запрещено вставать со своих мест. Передвижение и походы в туалет с этого момента запрещены."
10028030-100 = "Мы находимся в чрезвычайной ситуации. Попытка покинуть место приведёт к немедленному вызову охраны и аресту. Проводник, конец связи."
10028030-101 = "[s5] «А если мне надо?!»\n[s6] «Запрет туалета — это тирания!»"
10028030-104 = "Вахахаха!"
10028030-105 = "Как по расписанию! Осторожнее, поездная бригада уже в движении."
10028030-106 = "Через несколько мгновений они ворвутся через эту дверь! Вот так передряга! Настоящая передряга!"
10028030-107 = "...Вы про объявление спрашиваете?"
10028030-108 = "Ну конечно! Они выдумали всю историю о взорвавшемся грузе! Просыпайтесь уже!"
10028030-109 = "И что им было сказать в микрофон? «Эй, народ, мы жмём на газ, потому что нам тайно заплатили за перевозку известной преступницы, но она сбежала! Упс!»"
10028030-110 = "Внимательнее, Сенсей! Вагон, в котором я была, — специальный транспортный вагон, сделанный бандой, которая меня и захватила."
10028030-111 = "Они прицепили его к самому хвосту поезда!"
10028030-112 = "Вы серьёзно думаете, они притащили сюда такую махину и прицепили её так, что никто не заметил? Напрягите мозги!"
10028030-113 = "[s7] «Это поездная банда!»\n[s8] «Они все... работают вместе?!»"
10028030-116 = "Вахаха! Как всегда сообразительны, Сенсей!"
10028030-117 = "Вот они все и объединились, чтобы прицепить транспортный вагон, то есть меня, к поезду!"
10028030-118 = "Но вы правда думаете, что поездная бригада стала бы всем рисковать бесплатно?"
10028030-119 = "По-моему, тут пахнет нечистым. Деньги передавали тайком, вот что я думаю!"
10028030-120 = "А потом — катастрофа! Поезд взрывается, а их драгоценная цель сбегает."
10028030-121 = "Хм-хм. Какая неприятная ситуация для поездной бригады."
10028030-122 = "Теперь речь уже не о том, чтобы просто добраться из точки А в точку Б. Им нужно закончить начатое!"
10028030-123 = "Работа, за которую им заплатили, — доставить печально известную президента Департамента горячих источников на базу банды в Геенне."
10028030-124 = "И можете не сомневаться, они её выполнят! Нарушить правила и пропустить станции? Детские шалости по сравнению с тем, что будет дальше!"
10028030-125 = "Они знают: если поезд замедлится, я просто спрыгну, и плакали их денежки."
10028030-126 = "Если я прыгну сейчас, меня точно поймают! От удара я отключусь, а они спокойно утащат меня."
10028030-127 = "Это что касается меня. А вот для вас двоих..."
10028030-128 = "Неужели жизнь всегда так хорошо к вам относилась? Думаете, кучка хулиганов Геенны поможет безбилетному студенту Тринити на своей территории?"
10028030-129 = "Тебе ведь нужно сегодня вернуться на своё маленькое чаепитие с сумкой, да? Ты пра-а-авда думаешь, что успеешь её найти?"
10028030-130 = ""
10028030-131 = ""
10028030-132 = ""
10028030-133 = "Именно это я пытаюсь объяснить тебе всё это время! Нужно строить стратегию! Думать на один, два, три шага вперёд! А ты слепа как летучая мышь!"
10028030-134 = "Тебе надо хоть иногда выходить и траву трогать, девочка из Тринити! Вахаха!"
10028030-135 = "Ха. Ахаха."
10028030-136 = "Ты справишься, Ичика. Глубоко вдохни. Не всегда всё идёт по плану..."
10028030-137 = "Иногда весь день всё идёт наперекосяк. И ничего страшного. Ахахаха!"
10028030-138 = "Да... Ничего страшного..."
10028030-139 = ""
10028030-143 = "Вон там! Я её нашла!"
10028030-144 = "Конечно, у неё есть поддержка! Немедленно вызывайте подкрепление!"
10028030-145 = ""
10028030-147 = ""
10028030-148 = "...Поддержка?"
10028030-149 = "[ns] «Э-Это мы?»"
10028030-150 = "Мы вас ждали! Наши дорогие друзья из поездной бригады!"
10028030-151 = "Нет-нет. Это недоразумение... Мы не вместе, правда."
10028030-152 = "Мне плевать, кто с кем! Все виновны, пока не доказано обратное!"
10028030-153 = "Вперёд! Арестовать их!"
10028030-154 = "Какая толпа! Они явно умеют уважать моё имя!"
10028030-155 = "Похоже, выбора нет! Буду рада поработать с вами, Сенсей."
10028030-156 = "И ещё..."
10028030-157 = ""
10028030-159 = ""
10028030-160 = ""
10028030-161 = "...Мисс Милашка!"
10028030-162 = ""
10028030-164 = ""
10028030-165 = "...Сенсей..."
10028030-166 = "[s9] «Придётся выжать максимум из этой ситуации, Ичика.»\n[s10] «Остальное решим потом...»"
10028030-169 = "Какой культовый момент! Враги объединяются перед общим противником! Мне нравится!"
10028030-170 = "Тогда вверяю себя вашей заботе! Хотя..."
10028030-171 = ""
10028030-173 = ""
10028030-174 = "Надеюсь, вы сможете за мной поспевать! Вахахаха!"
10028030-177 = "Ну же! Я уже вся горю от нетерпения!"
10028030-178 = ""
