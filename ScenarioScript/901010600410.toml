[translation]
901010600410-6 = ""
901010600410-7 = "Хр-р..."
901010600410-8 = "FOX 4?"
901010600410-9 = "Клубничный торт с о-о-очень большим количеством взбитых сливок..."
901010600410-10 = "Отоги...?"
901010600410-11 = "Фуфу... Там целый противень..."
901010600410-12 = ""
901010600410-14 = ""
901010600410-15 = "Хм-м."
901010600410-16 = ""
901010600410-21 = ""
901010600410-22 = "У-Уф... П-Пожалуйста. Нет... Не клади скумбрию на торт!"
901010600410-23 = ""
901010600410-26 = ""
901010600410-27 = "...Что это вообще было? Из всех возможных сочетаний еды...!"
901010600410-28 = ""
901010600410-31 = ""
901010600410-32 = "Я здесь, FOX 4."
901010600410-33 = "А, это ты! Нико — то есть... FOX 2."
901010600410-34 = "Прости. Я просто очень устала."
901010600410-35 = "Почему? Что-то случилось на сегодняшней миссии?"
901010600410-36 = "Нет. Просто после ночного дежурства я пыталась снова уснуть, но FOX 3 так раздражала."
901010600410-37 = "Она всё время ворочалась и шумела, так что я почти не поспала."
901010600410-38 = "Фуфу. Тяжело тебе пришлось."
901010600410-39 = "Но потерпи до конца разбора. Я даже приготовлю тебе на ужин вкусную жареную скумбрию."
901010600410-40 = "О, я люблю жареную скумбрию. Так вот откуда пахло рыбой!"
901010600410-41 = "Давайте закончим встречу, а потом я начну готовить. Ну что?"
