[translation]
90000060-1 = "Эпизод 7;Исследование, Часть 6: Хесед"
90000060-5 = ""
90000060-6 = "Готово. У нас есть координаты."
90000060-7 = "Вот оружейный завод и местоположение Хеседа."
90000060-8 = "Значит, проникнем на завод?"
90000060-9 = "Да. Я проложу маршрут прямо к основному телу Хеседа. Вам нужно проникнуть внутрь, найти Хеседа, собрать данные и безопасно отступить."
90000060-10 = "Звучит просто."
90000060-11 = "Просто? Ну как скажешь, Эйми."
90000060-12 = "Да. Ведь меня поддерживают Президент и Сенсей."
90000060-13 = "Любопытно. Ты сейчас почему-то выглядишь такой надёжной, Эйми. Это иллюзия? Или же я сплю?"
90000060-14 = "Не иллюзия и не сон. Просто факт, как и то, что Вы любите канализацию."
90000060-15 = "Это неправда. Я прекрасная и элегантная хакерша, а не какая-то любительница канализации."
90000060-16 = "[s] «Давайте выдвигаться.»"
90000060-17 = ""
90000060-19 = ""
90000060-20 = "Сенсей вновь двигает нас дальше. Будьте осторожны."
90000060-21 = "Хорошо, пойдём."
90000060-22 = "[s] «Поехали, Эйми!»"
