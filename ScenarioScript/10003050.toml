[translation]
10003050-1 = "Эпизод 5;Почему Общество гурманов здесь?!"
10003050-5 = ""
10003050-8 = "Что вы, нарушительницы, ЗДЕСЬ ДЕЛАЕТЕ?! Хотите устроить скандал?"
10003050-9 = "(Теперь, когда я думаю об этом, один из аккаунтов в соцсетях, которые я видел раньше, принадлежал...)"
10003050-10 = "О, мы пришли не создавать проблемы."
10003050-11 = "Точно! Мы предприниматели! Торговцы! Пришли продавать кукурузу!"
10003050-12 = "...?"
10003050-13 = "Кукурузу?"
10003050-14 = ""
10003050-17 = "Вы никогда не задумывались, почему жареная кукуруза кажется намного вкуснее, когда ешь её на пляже с друзьями?"
10003050-18 = "Разве вам не хочется узнать почему? Она ничем не отличается от жареной кукурузы в любом другом месте, и всё же..."
10003050-19 = "Поэтому всё лето мы проводили разные исследования этой темы. И пришли к выводу, что..."
10003050-21 = "...единственный способ узнать — самим приехать на пляж!"
10003050-24 = "Вот почему мы пришли сюда продавать вкусную жареную кукурузу и собирать данные."
10003050-25 = "Именно. Мы слышали о войне между Пляжными хулиганами Фубар и Бандой в шлемах «Сплэши». Идеальный рынок! ☆"
10003050-26 = "Правонарушителям ведь тоже надо есть, да? И зрителей будет полно. Настоящее кукурузное золотое дно!"
10003050-27 = "А лучше всего то, что все остатки достанутся нам!"
10003050-28 = "Дура! Мы должны продать всё до последнего початка. Ты вообще представляешь, сколько эта кукуруза нам стоила?!"
10003050-29 = ""
10003050-30 = ""
10003050-32 = "Вот и весь план. Но почему пляж пуст?"
10003050-33 = "Мне всё равно, зачем вы пришли. Шоу окончено. Домой можете не идти, но здесь оставаться нельзя!"
10003050-34 = "Хи-хи..."
10003050-35 = "О? Хотите, чтобы мы ушли? ☆"
10003050-36 = "Общество гурманов никогда не бежит от вызова в поисках вершины вкуса."
10003050-37 = "Именно. И судя по тому, что я вижу..."
10003050-38 = ""
10003050-39 = "...главного префекта сегодня нет, верно?"
10003050-40 = "*вздрог*"
10003050-42 = "(У меня плохое предчувствие.)"
10003050-43 = ""
10003050-44 = ""
10003050-45 = ""
10003050-46 = ""
10003050-47 = "Хи-хи. Раз уж мы все собрались, как насчёт показать вам, насколько стальная у нас решимость?"
10003050-48 = "Точно! Давайте уже есть кукурузу!"
10003050-49 = ""
10003050-50 = ""
10003050-52 = "Сегодня одно за другим. Думаете, мы позволим вам всё испортить? Всем приготовиться к бою!"
10003050-53 = "Есть, госпожа!"
10003050-54 = "*вздох* Вступаю в бой."
