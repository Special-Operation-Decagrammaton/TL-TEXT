[translation]
10015060-1 = "Эпизод 6;Танк для поддержки"
10015060-2 = ""
10015060-8 = ""
10015060-9 = "Эта штука — монстр! Не могу поверить, что вы её построили!"
10015060-10 = ""
10015060-12 = ""
10015060-13 = ""
10015060-17 = ""
10015060-18 = "Господи. Бронебойные патроны Маки словно резиновые. Из чего вы вообще сделали эту штуку?"
10015060-19 = "Он слишком быстрый даже для меня. Не могу нормально прицелиться."
10015060-21 = "Инженерный отдел за несколько часов собрал настоящего исполина. Не знаю, впечатлена я или невероятно раздражена."
10015060-23 = "Ха-ха! Спасибо всем! Мы ценим ваши положительные отзывы!"
10015060-24 = "В каждое изобретение мы вкладываем все силы."
10015060-25 = "Девиз Инженерного отдела — стараться изо всех сил, что бы ни случилось."
10015060-27 = "Я решила. Я невероятно раздражена. Хватит зазнаваться!"
10015060-29 = ""
10015060-34 = ""
10015060-36 = "*тяжело дышит* Мы оторвались?"
10015060-37 = "Какой невероятный робот!"
10015060-38 = "Только мейстеры «Миллениума» могли создать такого монстра..."
10015060-39 = "Чтобы уничтожить эту штуку, понадобился бы весь Кивотос."
10015060-40 = "Как Инженерный отдел вообще собирался использовать этот танк на фестивале?"
10015060-41 = "Уф! Мне всё равно! Не произноси при мне сейчас ни «фестиваль», ни «спортивный праздник»! Они вызывают плохие воспоминания!"
10015060-42 = "Отвлекайте их танком! Будем делать угрожающие манёвры и не раскрывать своё местоположение!"
10015060-43 = ""
10015060-47 = ""
10015060-48 = "А-а! Двигайся, двигайся! Он сюда едет!"
10015060-49 = "Маки! Ты меня толкаешь! Я сейчас упаду!"
10015060-51 = "Господи, Утаха, ты правда никак не можешь его выключить? Это же твоё дитя!"
10015060-52 = "К сожалению, мы проектировали его так, чтобы его было... несколько невозможно отключить."
10015060-53 = "Его корпус твёрдый как алмаз! Может, даже твёрже!"
10015060-54 = "Если позволите, это довольно впечатляющее инженерное достижение. Мы упрочнили поверхность, воздействуя сверхвысокой частотой на многослойную стальную плиту."
10015060-55 = "Единственный минус метода — ремонт почти невозможен, но компромисс того стоил."
10015060-57 = "Почему... Почему вы все такие? Каждая из вас."
10015060-58 = "Признаю, возможно, мы немного перестарались... Если снаружи его не сломать, можно добраться изнутри? Если перехватить управление обратно, драться не придётся."
10015060-59 = "Да, если я вмешаюсь в многоканальное управление, но сначала нужно заставить его остановиться."
10015060-60 = "Если из-за помех команды смешаются, он может взорваться."
10015060-61 = "А мне бы не хотелось взрывать здания «Миллениума» за день до мероприятия."
10015060-62 = "Нужно уничтожить гусеницы взрывчаткой, может, липкими бомбами. Других вариантов не вижу."
10015060-63 = "Простите, что перебиваю, но эту идею я вынуждена отклонить."
10015060-64 = ""
10015060-66 = ""
10015060-67 = "Чтобы лишить его подвижности, понадобится огромное количество взрывчатки. Это будет почти так же плохо, как если бы сам робот взорвался. Я не могу так рисковать безопасностью студентов."
10015060-68 = "И, в конце концов, «Крушитель трассы» Инженерного отдела — единственный робот-болельщик, который у нас есть."
10015060-69 = "Я была бы очень благодарна, если бы вы смогли взять его под контроль с минимальными повреждениями."
10015060-70 = "Мы даже сломать эту штуку не можем, а вы хотите, чтобы мы голыми руками усмирили десятитонного робота?"
10015060-71 = "Согласна. Будто можно просто накинуть поводок на разъярённого быка, который пытается нас задавить."
10015060-72 = "Мне нравится быть хакером! Я не собираюсь переквалифицироваться в ковбоя!"
10015060-73 = "Ковбои, говоришь? Ха-ха! Люблю такие глупые идеи."
10015060-74 = ""
10015060-76 = ""
10015060-77 = ""
10015060-78 = "Вообще-то, кажется, ты только что подсказала мне нужное решение. Можно попросить вас помочь ещё один, последний раз?"
10015060-79 = ""
10015060-82 = ""
10015060-84 = ""
10015060-85 = ""
10015060-90 = "Они ушли? Они правда просто сдались?"
10015060-91 = "Не ведитесь! «Семинар» потратил на эту дурацкую штуку почти весь бюджет. Они не могут просто взять и уйти."
10015060-92 = "Уверена, они просто строят очередные зловещие планы где-нибудь в своих высотных кабинетах."
10015060-93 = "А? Это разве не...?"
10015060-95 = ""
10015060-96 = ""
10015060-97 = ""
10015060-98 = ""
10015060-99 = ""
10015060-100 = "О-о нет... Меня поймали...!"
10015060-101 = "Я должна была развесить эти школьные флаги и не попасться печально известной Антифестивальной группе!"
10015060-103 = "Ты серьёзно думала, что это возможно в такой броской одежде?"
10015060-105 = "Какая разница! «Крушитель трассы», за ними!"
10015060-107 = ""
10015060-113 = "Секундочку! А вот и я!"
10015060-114 = "Попробуйте только! Я справлюсь с этим танком... то есть роботом-болельщиком с закрытыми глазами!"
10015060-115 = ""
10015060-117 = ""
10015060-118 = ""
10015060-120 = "А? Ещё одна?"
10015060-121 = "Они совсем перестали думать! Решили, что просто продавят нас силой. Ну уж нет, мы тоже не отступим!"
10015060-122 = "Подождите. Здесь что-то не так. Думаете, это ловушка?"
10015060-123 = "Посмотрите на флаги. Кажется, их повесили не просто на верёвке... это колючая проволока?"
10015060-124 = "Пусть делают что хотят. Они сами сказали: броню «Крушителя трассы» ничем не пробить."
10015060-125 = "Что сделает какая-то жалкая проволока? Остановит целый танк?"
10015060-126 = ""
10015060-142 = "Ч-что?! Он остановился?"
10015060-143 = "Не понимаю! Что случилось?"
10015060-145 = "Запутались? Отлично, объяснять — моя специализация!"
10015060-146 = "Мы надели гусеницы поверх колёс, чтобы увеличить сцепление и дать роботу возможность ездить по любой местности! Но есть подвох: если что-нибудь попадёт в маленький зазор между колёсами и гусеницами, он мгновенно встанет."
10015060-147 = "Разложите паутину из проволоки вроде этой — и малыш никуда не уедет!"
10015060-148 = "Хи-хи. Я рада, что всё вышло так, как я предполагала. Благодаря моим выдающимся навыкам чтения чертежей я поняла, что проволока, скорее всего, пролезет между гусеницами и колёсами."
10015060-149 = "Эта запатентованная проволока для вывешивания флагов обладает выдающейся прочностью на растяжение и срез, поэтому разрезать её почти невозможно."
10015060-150 = "Двигатель цел, а единственный минус — сколько времени уйдёт, чтобы распутать робота. По-моему, можно смело записывать это в успешно выполненную работу!"
10015060-152 = "Это же должны были сделать прославленные мейстеры Инженерного отдела! Как он мог проиграть такой мелочи?"
10015060-154 = "О... И правда. Почему мы об этом не подумали?"
10015060-155 = "В заказе требовался прочный робот-болельщик, способный преодолевать склоны и неровности. Металлическая проволока в требования как-то не входила."
10015060-156 = "И как бы нам ни хотелось, бюджет у нас не бесконечный. Главный приоритет — выбрать самые важные функции, которые удовлетворят потребности заказчика."
10015060-157 = "...Тогда зачем вы поставили на него пулемёт?"
10015060-158 = "Что значит зачем? Этот пятнадцатимиллиметровый пулемёт жизненно необходим!"
10015060-160 = "В-все успокойтесь и послушайте меня!"
10015060-162 = "Какая разница, что с гусеницами? Броня и пулемёт всё ещё работают, я просто—"
10015060-163 = ""
10015060-167 = ""
10015060-168 = ""
10015060-169 = "...А?"
10015060-170 = "Я нашла вас, мои страстные спортсменки!"
10015060-172 = "А-Аааа?!"
10015060-174 = "Президент Сумирэ? Как вы нас нашли?!"
10015060-176 = "У меня уши по всей школе. Я услышала голоса из этой старой кладовой и сложила два и два."
10015060-177 = "Слух у меня очень, очень хороший. Вам некуда бежать."
10015060-178 = "Я много тренировалась катать мячи, но никогда не тренировалась против мяча, который сам умеет бегать. Это была отличная нагрузка на редко используемые мышцы."
10015060-179 = "Позвольте отплатить вам за столь прекрасный тренировочный опыт."
10015060-180 = ""
10015060-182 = ""
10015060-183 = "Время специальных тренировок: версия Сумирэ."
10015060-185 = "Н-нет!!! Пощадите!"
