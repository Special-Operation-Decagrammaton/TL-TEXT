[translation]
1007603-1 = "Это правда помогло"
1007603-2 = "Я почти утонул в объёме организационной работы, которую нужно было выполнить."
1007603-4 = "Я же говорю, это неправильно! Я точно подала заявку, чтобы мой фудтрак стоял с этой стороны дорожки!"
1007603-5 = "Что? Я записана на эстафету?! Но я здесь, чтобы участвовать в прыжках в длину!"
1007603-6 = "Куриные шашлычки! Налетайте на куриные шашлычки! Всего—"
1007603-7 = "Погодите, где я? Как далеко я ушла?"
1007603-8 = "П-Простите. Мне ужасно неловко, но я потеряла красную карточку. Я судья в следующем матче... У вас нет запасной?"
1007603-9 = "Это не ресторан? Но я шла по всем стрелкам! Тогда где здесь можно поесть?"
1007603-10 = ""
1007603-12 = ""
1007603-13 = "Простите, я пришёл заменить лампочку!"
1007603-14 = "Что? Почему не сегодня? Мне сказали, что дата назначена именно на сегодня."
1007603-15 = ""
1007603-16 = "*гул толпы*"
1007603-17 = "Из-за постоянно растущей очереди людей я не мог найти даже минутки, чтобы сходить в туалет."
1007603-18 = "[ns1] «(Я-Я уже не справляюсь...)»\n[ns2] «(Наверное, стоило ожидать, что всё станет настолько плохо.)»"
1007603-21 = "Я нашла вас, Сенсей! Я здесь!"
1007603-23 = "Эм, Сенсей? Вы в порядке? Вы неважно выглядите."
1007603-24 = "...Что? А, туалет?"
1007603-25 = "Ах! Вы так усердно работаете, что у вас даже минуты на отдых не было!"
1007603-26 = "Я могу помочь! Пока это не что-то выше моего уровня полномочий, можете доверить это мне!"
1007603-27 = "Возможно, вы удивитесь, но вообще-то я совсем не против общаться с людьми!"
1007603-28 = "[s3] «Почему-то я совсем не удивлён...»\n[s4] «Прости, но я могу оставить всё на тебя?»"
1007603-29 = "Ха-ха-ха..."
1007603-30 = "Просто оставьте всё мне! Не торопитесь!"
1007603-31 = "Ха-ха-ха-ха!"
1007603-32 = "Конечно! Просто оставьте всё мне! Идите и не торопитесь!"
1007603-33 = "[ns] Сходить в туалет."
1007603-35 = "Несколько мгновений спустя."
1007603-37 = "[ns5] «...Фух, я вернулся.»\n[ns6] «Мне это очень было нужно. Спасибо, Котори.»"
1007603-40 = ""
1007603-41 = "[ns7] «...Что? Котори?»\n[ns8] «Погоди, очереди нет...»"
1007603-44 = "Ой, эм!"
1007603-45 = "Н-Насчёт всего этого... ну...!"
1007603-46 = "Как бы мне... эмм..."
1007603-47 = ""
1007603-49 = ""
1007603-50 = ""
1007603-51 = "...Прос..."
1007603-52 = "Простите..."
1007603-53 = "[s9] «...За что?!»\n[s10] «Внезапные извинения?!»"
1007603-56 = "Я правда старалась хорошо выполнять работу и отвечать на все вопросы, но..."
1007603-57 = "Почему-то в конце концов все уходили раздражённые, говоря что-то вроде: «Хватит уже! Пожалуйста!»"
1007603-58 = "Т-Так что вроде бы я решила проблему... но одновременно вообще ничего не решила..."
1007603-59 = "Когда очередь исчезла, я поняла, что случайно разогнала всех своей дурной привычкой..."
1007603-60 = "Угх..."
1007603-61 = "Я так хотела быть вам полезной, но просто снова сделала то, что делаю всегда. Всё испортила. Простите, Сенсей..."
1007603-62 = "Я лучше вернусь, раз только мешаю здесь."
1007603-63 = ""
1007603-66 = "...?"
1007603-67 = "...Сенсей? Почему вы так смотрите...?"
1007603-68 = "[s11] «Ты должна остаться здесь, Котори!»\n[s12] «Если ты не против, пожалуйста, пожалуйста, останься!»"
1007603-71 = "А? А? Ч-что?!"
1007603-72 = "Я очень помогла...?! Я? Я-Я помогла? Как...?!"
1007603-73 = "Я-Я не совсем понимаю, что вы хотите сказать..."
1007603-74 = "Ничего страшного, если я не до конца понимаю?!"
1007603-75 = "Мне просто нужно остаться рядом с вами? Пока не придёт время идти на следующее соревнование?"
1007603-76 = "К-Конечно! Я всегда рада быть с вами, но..."
1007603-77 = "Хм..."
1007603-78 = "Д-Да..."
1007603-79 = "Знаете что, я ничего не понимаю! Но если я всё-таки могу быть вам полезной, а похоже, что так и есть, значит, это хорошо!"
1007603-80 = "Т-Тогда..."
1007603-81 = "Я и дальше буду стараться изо всех сил!"
1007603-83 = "С Котори рядом я смог закончить остаток дня с ощущением, будто мне всё по плечу."
