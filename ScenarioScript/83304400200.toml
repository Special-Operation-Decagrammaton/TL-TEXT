[translation]
83304400200-5 = ""
83304400200-6 = "...Ибуки? Почему ты здесь?"
83304400200-7 = "А! Хина!"
83304400200-8 = "Ибуки просто пришла продез-ин-фи-ци-ровать ранки!"
83304400200-9 = "Ты ранена?"
83304400200-10 = "Она упала и ушиблась во время того беспорядка в Обществе Пандемониума."
83304400200-11 = "Вот как? Что случилось?"
83304400200-12 = "Я слышала, кто-то кричал, что председателя Макото загипнотизировали и она стала совершенно другим человеком."
83304400200-13 = "...Загипнотизировали?"
83304400200-14 = "Ага! Сацуки загипнотизировала Макото? Или что-то вроде того."
83304400200-15 = "И Макото превратилась в Новую Макото."
83304400200-16 = "...Прости, но я совсем не понимаю, о чём ты."
83304400200-17 = "Хорошо, Ибуки. Всё, можешь идти."
83304400200-18 = "Ура! Спасибо, Чинацу!!!"
83304400200-19 = "Отблагодари меня тем, что какое-то время не будешь травмироваться, хорошо?"
83304400200-20 = "В любом случае, глава префектов, за подробностями лучше обратиться к Ирохе. Она вон там."
83304400200-21 = "Хм. Гипноз..."
