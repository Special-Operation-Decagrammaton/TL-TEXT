[translation]
80000004-1 = "Подарок Ароны на День святого Валентина!"
80000004-2 = "Класс Ароны"
80000004-3 = "Привет, Сенсей!"
80000004-4 = "Время так быстро летит!"
80000004-5 = "Ну... знаешь, какой сегодня день?"
80000004-6 = "[s] «День святого Валентина!»"
80000004-7 = "Точно!"
80000004-8 = "День святого Валентина — особый праздник, когда люди дарят шоколад тому, кем восхищаются."
80000004-9 = "Хи-хи. Поэтому я приготовила шоколад для своего любимого учителя!"
80000004-10 = ""
80000004-12 = ""
80000004-13 = "Так, посмотрим..."
80000004-14 = ""
80000004-16 = ""
80000004-17 = "Та-дам!"
80000004-18 = "Что думаете, Сенсей?"
80000004-19 = "Угадаешь, кто это?"
80000004-20 = "[s1] «Это ты и...?»\n[s2] «Это должен быть я?»"
80000004-21 = "Ага! Угадал!"
80000004-22 = "Ага! Угадал!"
80000004-23 = "Это особые шоколадно-имбирные печенья, которые я сделала похожими на нас с тобой!"
80000004-24 = "Мне кажется, ленточка у меня получилась прямо как настоящая."
80000004-25 = "Сначала я вырезала формы из имбирного печенья, а потом посыпала сверху белым шоколадом для финального штриха."
80000004-26 = "*нюх* Вообще-то мои руки до сих пор пахнут имбирём..."
80000004-27 = "Я сегодня проснулась очень рано, чтобы приготовить их специально для тебя!"
80000004-28 = "Я вложила в них все силы. Надеюсь, тебе понравится. С Днём святого Валентина!"
