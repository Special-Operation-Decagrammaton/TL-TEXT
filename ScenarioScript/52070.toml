[translation]
52070-1 = "Эпизод 7;Снежная страна"
52070-7 = "Путевая станция возле дочерней школы Эбису"
52070-9 = ""
52070-10 = "Ах... Холодно. Как здесь стало настолько холодно? Мы ведь даже не так далеко уехали!"
52070-11 = ""
52070-14 = ""
52070-15 = "Я говорила тебе одеться теплее в несколько слоёв, но ты не послушала."
52070-16 = "Холодный воздух с севера задерживается у ближайших гор, вызывая снег и... понижение температуры."
52070-17 = "Напоминает знаменитую первую строку: «Поезд вышел из длинного туннеля в...»"
52070-18 = ""
52070-22 = "«...снежную страну!»"
52070-23 = "Как красиво...! Великолепно! Никогда ничего подобного не видела!"
52070-24 = ""
52070-26 = ""
52070-27 = ""
52070-28 = "Сенсей, Сенсей! Видели? Белая ласка танцует по снегу—"
52070-29 = "...Юкари, у тебя течёт нос. Высморкайся в этот платок."
52070-30 = ""
52070-32 = ""
52070-33 = "Б-Боже мой! Как неловко!"
52070-34 = ""
52070-36 = ""
52070-38 = "...Красивая деревня. Удивительно видеть её так близко к Великому снежному полю."
52070-39 = "[s] «В прошлый раз ты её не заметила?»"
52070-40 = "Нет. Тогда я была настолько сосредоточена на поисках Аямэ, что даже не думала отдыхать."
52070-41 = "...Если оглянуться назад, поездка была бы гораздо короче, если бы мне пришло в голову ехать поездом."
52070-42 = "[s1] «Ты поднималась в гору пешком?»\n[s2] «Это же опасно! Больше так не делай!»"
52070-45 = "Принято к сведению."
52070-46 = "Важнее другое: где Духи артефактов? Просто ждать заката...?"
52070-47 = "Президент Ния обещала, что кто-то из школы Эбису нас проведёт."
52070-48 = "Наш поезд прибыл вовремя. Она уже должна быть здесь..."
52070-49 = ""
52070-53 = "Какие изысканные хаори! Вы, должно быть, Хяккарёран!"
52070-54 = ""
52070-56 = ""
52070-58 = ""
52070-59 = ""
52070-62 = ""
52070-63 = "Приветствую! Надеюсь, поездка прошла хорошо?"
52070-64 = "Вы из дочерней школы Эбису...?"
52070-65 = "Именно. Я Хабу Азами, президент Комитета самоуправления дочерней школы Эбису."
52070-66 = "...И под «президентом» я также имею в виду единственного оставшегося члена."
52070-68 = "Звучит как огромный объём работы..."
52070-69 = "Она достойно охраняет свою школу в полном одиночестве среди ледяной тундры!"
52070-70 = "Хи-хи. Вы слишком добры."
52070-71 = "Если честно, обычно здесь довольно скучно. Встреча с вами пятерыми — главное событие моей недели!"
52070-72 = ""
52070-74 = ""
52070-75 = "К слову, вы, должно быть, Сенсей [USERNAME] из Шале?"
52070-76 = "Президент Ния рассказывала о вас удивительные истории. Для меня честь встретить столь храброго человека."
52070-77 = "[s] «О, я бы так не сказал...»"
52070-78 = "Ния ведь не славится преувеличениями, правда?"
52070-79 = "Она рассказала, как вы смело бежали по открытому полю, полностью обнажив и тело, и душу!"
52070-80 = "[s3] «ВОТ что ты имела в виду под храбростью?!»\n[s4] «Всё было не так, как звучит!»"
52070-83 = "Хи-хи. И такой скромный."
52070-84 = "Я слышала слухи, что вы потушили огромный пожар в Центральном районе и победили каких-то... ужасных духов, собрав заново распущенный Совет Хяккарёран."
52070-85 = "А теперь, когда Сенсей [USERNAME] и Хяккарёран здесь, уверена, наши паранормальные проблемы скоро решатся!"
52070-86 = "Нам сказали, что вас мучают меняющие облик Духи артефактов."
52070-87 = "Где их видели в последний раз?"
52070-88 = "Ох... сообщения поступали со всего города. Точное место назвать не могу."
52070-89 = "Но они не появляются до темноты, так что почему бы пока не провести вам экскурсию? Мы как раз пройдём по МНОГИМ местам наблюдений."
52070-90 = "Для меня будет честью показать вам нашу прекрасную деревню!"
52070-92 = "Конечно! Отличная идея!"
52070-94 = ""
52070-95 = "Нас ждёт новое приключение! Вперёд!"
52070-96 = "Пожалуй, экскурсия действительно может дать зацепки..."
52070-97 = ""
52070-99 = ""
52070-101 = ""
52070-102 = "[ns] «Веди, Азами.»"
52070-103 = "С удовольствием. Сюда, пожалуйста."
52070-109 = "Торговый район возле дочерней школы Эбису"
52070-112 = "Вот наш торговый район. Здесь есть небольшая гостиница и чудесная прогулочная улица."
52070-113 = "Знаю, он совсем не похож на шумный район Хяккияко, но, уверена, вы видите его особое очарование."
52070-114 = ""
52070-116 = ""
52070-118 = ""
52070-119 = "О, посмотрите на эту стеклянную снежинку в витрине! Сияет как настоящий драгоценный камень!"
52070-120 = "Именно. Район Эбису специализируется на ремесленном стекле."
52070-121 = "Многие стеклодувы работают здесь поколениями."
52070-122 = "...На самом деле первый Дух артефакта встретился именно стеклодуву. Он открывал мастерскую на рассвете."
52070-123 = "И как выглядел этот дух?"
52070-124 = "Я его не видела, но слышала, что он напоминал белую ласку..."
52070-125 = "...Белую ласку? Я думала, эти штуки должны быть страшными?"
52070-126 = "Ну—"
52070-127 = ""
52070-131 = ""
52070-132 = "О! Вот и мастер! Почему бы не спросить его напрямую?"
52070-135 = ""
52070-136 = ""
52070-138 = ""
52070-139 = "Доброе утро, господин!"
52070-140 = ""
52070-142 = ""
52070-143 = "А...? Вы кто?"
52070-144 = "Я Хабу Азами, президент Комитета самоуправления дочерней школы Эбису. Вы меня уже забыли?"
52070-145 = "...У этой школы есть СТУДЕНТЫ?! Ах... память уже не та."
52070-146 = "...Господин, мы разговаривали вчера."
52070-147 = "Мои друзья хотят услышать о монстре, которого вы встретили две недели назад."
52070-148 = ""
52070-150 = ""
52070-151 = "...Монстре? А, точно! Вы про белую ласку!"
52070-152 = "Помню как вчера! Коварная тварь!"
52070-153 = "Я всю жизнь ненавидел ласок, мерзкие маленькие создания. Одна укусила меня в детстве в походе... До сих пор травма."
52070-157 = ""
52070-160 = ""
52070-161 = ""
52070-162 = ""
52070-166 = ""
52070-168 = "Был самый рассвет. Я открывал магазин и увидел ласку прямо перед собой! Так испугался, что выронил стеклянную бутылку!"
52070-169 = ""
52070-176 = ""
52070-179 = "Но странно: эта проклятая ласка даже не испугалась шума. Наоборот, продолжила идти ко мне прямо по разбитому стеклу — ни вздрагивания, ни крови."
52070-180 = "Вот тогда я и понял: это не обычная ласка... Она была неестественной."
52070-181 = "...Белая ласка, появившаяся на рассвете."
52070-182 = "Это... довольно необычный страх."
52070-183 = "О нет... Как жаль, что вы потеряли стеклянную бутылку."
52070-184 = "Даже по этой вазе видно, сколько труда вы вкладываете в свои работы."
52070-185 = ""
52070-187 = ""
52070-188 = "Ха-ха. Милая девочка, это была всего лишь бутылка из-под молока! Не стоит плакать о пролитом молоке!"
52070-189 = "Но моя ваза тебе нравится? Наконец-то встретил человека со вкусом!"
52070-190 = "А по-настоящему великолепные вещи за прилавком. Хотите зайти посмотреть?"
52070-191 = ""
52070-193 = ""
52070-194 = "Я буду невероятно рада!"
52070-195 = ""
52070-197 = ""
52070-199 = ""
52070-201 = "Поля возле дочерней школы Эбису"
52070-202 = "А вот эти зелёные поля — здесь мы выращиваем урожай."
52070-203 = "Мы регулярно поставляем кукурузу, картофель и морковь на фестивали Хяккияко."
52070-204 = "Уверена, повара Хяккияко готовят изысканные блюда, но ничего не сравнится со свежесобранным урожаем!"
52070-205 = ""
52070-207 = ""
52070-208 = "Вот, эту кукурузу собрали сегодня утром. Попробуйте!"
52070-209 = "Ну что..."
52070-210 = ""
52070-212 = ""
52070-213 = ""
52070-214 = ""
52070-215 = ""
52070-216 = "Ого! Такая сладкая, будто её посыпали сахаром! И как хрустит!"
52070-217 = "Не знала, что кукуруза может быть настолько... насыщенной!"
52070-218 = "Хи-хи. Рада видеть, что Совет одобряет."
52070-219 = "Здесь появлялись Духи артефактов?"
52070-220 = "Да. Он принял облик огромного медведя—"
52070-223 = "Именно! Размером с дом!"
52070-224 = "Я пахал поле и вдруг почувствовал мороз по коже. Поднял взгляд, а там этот свирепый медведь, согнувшись, смотрит прямо на меня!"
52070-227 = ""
52070-230 = ""
52070-231 = ""
52070-234 = ""
52070-242 = "Я выстрелил в него из охотничьего ружья, подумав, что это тот, который пару лет назад разнёс поле. Он даже не дрогнул. Было... жутко."
52070-243 = "Тогда я и понял, что медведь ненастоящий. Он не был живым... значит, его нельзя было убить."
52070-245 = "Один выстрел? Вряд ли это остановило бы даже обычного медведя."
52070-246 = "Постой, ты сказал, медведи приходили и раньше. Это часто бывает?"
52070-248 = "В начале года была засуха, и они спускались искать еду. Обычно лезли за картофелем и репой на грузовике."
52070-249 = "...Не то чтобы я их винил. Моя картошка слаще батата!"
52070-250 = "Вы бы знали, как пахнет запечённая целая решётка. Полагаю, даже монстры захотели попробовать!"
52070-251 = ""
52070-253 = ""
52070-254 = "Вообще, немного есть у меня в ланч-боксе! Хотите?"
52070-255 = ""
52070-257 = ""
52070-258 = "Да, пожалуйста!"
52070-261 = "Такая сладкая... и мягкая, почти как пирог. Будто ешь дорогой десерт..."
52070-262 = "Как восхитительно! Ах, прелести фермы!"
52070-263 = "Как приятно видеть, что студенты хорошо едят! Ах, так давно такого не было..."
52070-264 = "Подождите здесь. Я сварю картошку и кукурузу!"
52070-265 = ""
52070-267 = ""
52070-269 = ""
52070-271 = "Это место..."
52070-272 = "Пристань! Дом бесчисленных видов прекрасной и вкусной морской живности!"
52070-273 = "Пусть выглядит небольшой, наши воды невероятно богаты. Мы поставляем морепродукты по всему Кивотосу."
52070-274 = "Фестивали Хяккияко известны жареными кальмарами, верно? Всех их ловят здесь, в Эбису!"
52070-275 = "И, полагаю, кто-то встретил Духа артефакта и здесь?"
52070-276 = "Именно. Это был рыбак, возвращавшийся с утреннего выхода. Он увидел гигантского краба-паука!"
52070-277 = "...Краба-паука? Серьёзно?"
52070-278 = "И я должна поверить, что величайшим страхом рыбака был... краб?"
52070-279 = "Я тоже так подумала... но краб-паук похож на паука, правда?"
52070-280 = "А пауков боится очень, очень много людей. Ещё он сказал, что краб был огромным."
52070-281 = "Этот напуганный рыбак доступен? Я хотела бы его опросить."
52070-282 = "К сожалению, нет. Он ушёл на глубоководную рыбалку и будет отсутствовать весь день."
52070-283 = "Тогда зачем мы здесь? Времени мало, давайте посмотрим другие районы—"
52070-284 = "Если честно, я привела вас сюда потому, что рядом есть чудесное кафе. Вы ОБЯЗАНЫ попробовать их жареную рыбу."
52070-285 = "Уже почти обед, почему бы не остановиться и не поесть?"
52070-287 = "Жареную рыбу...?"
52070-288 = "Да. Ещё одна специальность Эбису!"
52070-289 = "Здесь рыбу жарят до хрустящей корочки, а на середине готовки поливают маринадом мисо, заворачивают в фольгу и пропаривают!"
52070-290 = "Сейчас сезон скумбрии... Толстая кожа в сочетании с мисо даёт пикантный хрустящий вкус, который ничем не перебить!"
52070-291 = "..."
52070-292 = "Но я понимаю. Если у Хяккарёран плотный график, верну вас в дочернюю школу, и мы возьмём онигири из автомата—"
52070-293 = "Ну, раз уж мы зашли так далеко."
52070-294 = ""
52070-296 = ""
52070-297 = "Нет смысла отказываться от хорошей еды, особенно если ночью предстоит работа. И мы весь день ходили..."
52070-298 = ""
52070-301 = ""
52070-302 = "А? Мы в основном ехали поездом. Это едва ли прогулка!"
52070-303 = "Я достаточно находилась."
52070-304 = "И думаю, будет разумно хотя бы попробовать жареную рыбу."
52070-305 = "Полностью поддерживаю!"
52070-306 = "Единогласно! Хорошо. Идём есть!"
52070-307 = ""
52070-309 = ""
52070-312 = ""
52070-314 = "Мы продолжили осматривать окрестности дочерней школы, но почти ничего не узнали..."
52070-315 = "...и вскоре день закончился."
52070-320 = "Наступила ночь."
52070-321 = "Все свидетели утверждали, что встречали Духов артефактов под покровом темноты. Начнём настоящий патруль?"
52070-322 = ""
52070-324 = ""
52070-325 = "Н-Нет! Я не могу заставлять вас работать ещё больше! Вы весь день путешествовали!"
52070-326 = "Это только первая ночь, и вы наверняка устали. Пожалуйста, располагайтесь в общежитии. Места полно!"
52070-327 = "Спасибо, но нам это не требуется. Я, например, совсем не устала."
52070-328 = "О! Придумала! Почему бы не сходить в горячие источники? Они прямо снаружи."
52070-329 = "Так долго я пользовалась ими одна. Вы просто обязаны искупаться!"
52070-330 = ""
52070-333 = ""
52070-334 = "Горячие источники?!"
52070-335 = "В этом общежитии... есть горячий источник?"
52070-337 = "Да. Помещается примерно десять человек. Раньше студенты дочерней школы Эбису пользовались им вместе."
52070-338 = "Пока вы будете в источнике, я приготовлю ужин, так что отдыхайте."
52070-339 = "А-а... Расслабиться в горячем источнике с девочками на ночёвке... Вот ЭТО настоящая молодость!"
52070-340 = "Двигаемся! Девичник!"
52070-341 = ""
52070-343 = ""
52070-345 = ""
52070-346 = "Рэнгэ, это официальная миссия Хяккарёран, а не ночёвка."
52070-347 = "Я буду читать в своей комнате, так что идите без меня."
52070-348 = ""
52070-350 = ""
52070-351 = "Ой... Не будь занудой."
52070-352 = "Кикё, пожалуйста. Я давно мечтала провести вечер отдыха с любимыми старшими!"
52070-353 = "Может и так, но..."
52070-354 = "И я буду чистить зубы... даже нитью! И только одно мороженое в день."
52070-355 = "...Ты уже это обещала."
52070-356 = ""
52070-358 = ""
52070-360 = "Кикё, ну пожа-а-алуйста?"
52070-361 = ""
52070-363 = ""
52070-364 = ""
52070-365 = "Хорошо, один час. И ни минутой больше."
52070-366 = "Тогда чего ждём? Вода горячая!"
52070-367 = "А потом можно фруктовое молоко!"
52070-368 = ""
52070-370 = ""
52070-372 = ""
52070-373 = "Прекрасно. Вам четверым нужны... купальники?"
52070-374 = ""
52070-376 = ""
52070-377 = "О, эм... Да, если это не слишком сложно."
52070-378 = "А Сенсей... что будете делать вы?"
52070-379 = "[s5] «О... наверное, почитаю отчёты.»\n[s6] «Лучше пойду спать.»"
52070-382 = "Хорошо. Тогда увидимся утром."
52070-383 = ""
52070-385 = ""
52070-392 = "А-а... Вот это расслабление..."
52070-393 = "Тело тёплое, а прохладный воздух освежает лёгкие. Я сейчас растаю..."
52070-394 = "Какая привилегия наслаждаться таким природным чудом! Посмотрите на вид!"
52070-395 = "Я впервые в горячем источнике. А вместе с вами это больше похоже на игру, чем на купание!"
52070-402 = "..."
52070-403 = "Кикё, ты что делаешь? Там замёрзнешь!"
52070-404 = "Заходи. Только не говори, что боишься утонуть?"
52070-405 = "Боюсь? Напомню, что я офицер Хяккарёран—!"
52070-406 = ""
52070-409 = "...Очевидно, я просто наслаждаюсь источником на своих условиях."
52070-410 = "Специалисты говорят, что лучше заходить... постепенно... чтобы снизить шок. Вы разве не знали?"
52070-411 = "Да брось! Мне нравится шок! Иногда нужно просто прыгнуть, Кикё!"
52070-412 = "Правда ведь, Нагуса?"
52070-413 = "...Да. Тёплая вода очень успокаивает."
52070-414 = "Есть и худшие способы закончить день."
52070-415 = "Мы почти ничего не сделали. По сути, были туристами."
52070-416 = "И не говори. Зато ребёнок повеселился, правда?"
52070-417 = "...Рэнгэ!"
52070-418 = "Это правда! Я повеселилась!"
52070-419 = "Улицы торгового района были очаровательно уютными, с местными было приятно разговаривать, а жареная рыба оказалась исключительно вкусной."
52070-420 = "Однако..."
52070-421 = "Ты выглядела довольно задумчивой, Нагуса. Всё хорошо?"
52070-422 = "...Задумчивой?"
52070-423 = "Я старалась быть вежливой, но конечно заметила, насколько... серьёзной ты была. Даже сильнее обычного."
52070-424 = "...Это из-за Великого снежного поля?"
52070-425 = "Может, ты почувствовала Духов артефактов?"
52070-426 = "Нет, меня не беспокоило ничего из этого."
52070-427 = "Однако..."
52070-428 = "Ласка, медведь, краб... Я всё думала, как проявится МОЙ страх."
52070-429 = "И ещё думала, хватит ли мне смелости нажать на спуск. В конце концов, Полномочие у меня."
52070-430 = "Твои величайшие страхи, воплощённые в реальности. Конечно, об этом неприятно думать."
52070-431 = "Рэнгэ, как думаешь, как выглядел бы твой?"
52070-432 = "Я? Хмм, чего я боюсь..."
52070-433 = "...Наверное, протекающего бенто с плохо закрытой крышкой. Однажды такое случилось и испортило всю мою сумку!"
52070-434 = "Ты вообще о чём?"
52070-435 = "Да вы понимаете! Поднимаешь обед, а суп течёт по рукам, бульон собирается в швах... Ух! Меня до сих пор преследует этот ужас."
52070-436 = "Каждый раз думаю об этом, когда беру с собой тондзиру или карри... Не могу забыть."
52070-437 = "Я бы очень не хотела драться с гигантским протекающим бенто! Представьте пятна!"
52070-438 = "Если честно, вам всем стоит разобраться с приоритетами. Бенто, серьёзно?"
52070-439 = "Ну хорошо, Кикё. А что тогда достаточно страшное, чтобы явиться тебе?"
52070-440 = "Ну, если бы такое вообще произошло со мной, что маловероятно..."
52070-441 = "О, знаю!"
52070-442 = "Кикё боится громких звуков и криков, например на хэви-метал концерте!"
52070-443 = "Может, Кикё увидит агрессивную рок-звезду с белым гримом и визжащей гитарой?"
52070-444 = "Юкари, как я уже говорила, я не боюсь громких звуков. Они просто ужасно раздражают."
52070-445 = "Как офицер Хяккарёран я вообще могу бояться шума, особенно когда вы постоянно стреляете—?"
52070-447 = "УА-А-А-А-А!"
52070-448 = ""
52070-451 = "?!?!"
52070-452 = "Видели? ВОТ это её проняло."
52070-453 = ""
52070-457 = "Рэнгэ!"
52070-458 = ""
52070-461 = "...Ха. Хорошо сыграно."
52070-462 = "Надеюсь только, что смогу быть такой же смелой, как вы."
52070-468 = "Следующий эпизод;Кошмар"
