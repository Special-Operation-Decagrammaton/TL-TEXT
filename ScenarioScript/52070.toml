[translation]
52070-1 = "Episódio 7;Terra da Neve"
52070-7 = "Pequena estação perto da Filial Ebisu"
52070-10 = "Brrr... que frio! Nem é tão longe assim, como pode estar gelando desse jeito?!"
52070-15 = "...Eu não disse para se agasalhar bem?"
52070-16 = "As massas de ar frio vindas do norte batem nas montanhas daqui e fazem nevar.#nNeste Distrito Autônomo do Norte, dizem até que \"as estações mudam de um lado para o outro da montanha\"."
52070-17 = "Em certo livro, dizem que ao atravessar o longo túnel da fronteira..."
52070-22 = "Eis a terra da neve!"
52070-23 = "É a primeira vez que vejo uma paisagem tão deslumbrante!"
52070-28 = "Sensei, Sensei! Olhe bem ali!#nUma doninha adorável correndo cheia de energia pela neve...!"
52070-29 = "...Seu nariz está escorrendo. Toma, um lenço."
52070-33 = "Q-Que descuido o beu! Buito obrigada!"
52070-38 = "...É uma cidade bem bonita.#nNem imaginava que existia um lugar assim perto da Grande Planície Nevada."
52070-39 = "[s] \"Você não passou por aqui da última vez?\""
52070-40 = "Naquela época eu estava tão desesperada procurando a Ayame que só segui direto para o norte."
52070-41 = "...Talvez eu tivesse chegado mais rápido se tivesse vindo pela estação."
52070-42 = "[s1] \"Atravessar montanhas nevadas a pé... impressionante.\"\n[s2] \"Mas é perigoso, então não faça mais isso.\""
52070-45 = "Sim, vou tomar cuidado."
52070-46 = "Enfim, onde está esse Hyakumonogatari Fantasmagórico? Vamos ter que esperar anoitecer?"
52070-47 = "Se bem me lembro, a Presidente Niya disse que alguém da Filial Ebisu viria nos receber."
52070-48 = "Nós chegamos no horário, então já deve estar..."
52070-53 = "Com licença, vocês são do Comitê de Mediação de Conflitos Hyakkaryouran?"
52070-63 = "Muito prazer, eu estava aguardando vocês."
52070-64 = "Você é da Filial Ebisu...?"
52070-65 = "Sim.#nSou a Presidente do Comitê Autônomo da Filial Ebisu — Azami Habu, às suas ordens."
52070-66 = "Bem, digo presidente, mas todas as outras alunas já foram embora."
52070-68 = "Parece barra pesada..."
52070-69 = "Continuar protegendo a academia completamente sozinha...#nQue admirável!"
52070-70 = "Hihi, fico lisonjeada."
52070-71 = "Embora, num lugar tão remoto assim, mal haja algo que possa ser chamado de trabalho.#nNa verdade, tenho até tempo de sobra."
52070-75 = "Oh, você deve ser o [USERNAME]-Sensei da Schale, certo?"
52070-76 = "A Presidente Niya me falou a seu respeito.#nDisse que você possui incontáveis feitos notáveis."
52070-77 = "[s] \"Não fiz nada demais.\""
52070-78 = "Será mesmo?#nOuvi dizer que você tem uma coragem inimaginável..."
52070-79 = "Se não me engano, chegou até a correr pelos campos sem nenhuma peça de roupa..."
52070-80 = "[s3] \"É desse feito que ela falou?!\"\n[s4] \"E-Eu tinha um motivo...\""
52070-83 = "Hihi, não precisa ser tão modesto."
52070-84 = "Conter o grande incêndio, unir a Hyakkaryouran e derrotar o Hyakumonogatari.#nEsses rumores atravessaram as montanhas e chegaram até aqui."
52070-85 = "Com o [USERNAME]-Sensei e a Hyakkaryouran por aqui,#naposto que até as histórias de terror desta região serão varridas num instante."
52070-86 = "Essa anomalia... o Hyakumonogatari Fantasmagórico que muda de forma para atacar as pessoas..."
52070-87 = "Onde podemos encontrá-lo?"
52070-88 = "Bem... ele foi avistado em vários lugares, mas..."
52070-89 = "De qualquer forma, acredito que não aparecerá antes do pôr do sol.#nAté lá, que tal darmos uma volta pelos locais onde ele foi avistado?"
52070-90 = "Aproveito para apresentar o distrito autônomo e servir de guia."
52070-92 = "É verdade... a gente não conhece nada por aqui. Contamos com você."
52070-95 = "Parece uma nova aventura! Já estou ficando toda empolgada!"
52070-96 = "Bem... isso também faz parte da missão."
52070-102 = "[ns] \"Contamos com você, Azami.\""
52070-103 = "Sim! Por aqui, por favor..."
52070-109 = "Rua comercial perto da Filial Ebisu"
52070-112 = "Esta é a rua comercial frequentada pelos moradores do Distrito Autônomo do Norte."
52070-113 = "Não se compara ao centro comercial de Hyakkiyako, mas também temos lojas e pousadas por aqui."
52070-119 = "Oh? Estas esculturas de flores são feitas de vidro?#nBrilham tanto que parecem joias...!"
52070-120 = "O artesanato em vidro é uma das nossas especialidades locais."
52070-121 = "Artesãos que trabalham com vidro há muitos anos produzem cada peça à mão."
52070-122 = "Na verdade... quem encontrou o Hyakumonogatari primeiro foi justamente um desses artesãos.#nDizem que ele deu de cara com a criatura quando foi ao ateliê de madrugada."
52070-123 = "Que forma o Hyakumonogatari tinha naquela hora?"
52070-124 = "Pelo que ouvi dizer, parecia uma doninha branca..."
52070-125 = "...Uma doninha? Isso não dá medo nenhum, né?"
52070-126 = "Sobre isso..."
52070-132 = "Ah, ele está bem ali."
52070-139 = "Bom dia."
52070-143 = "...Hum? Quem seria a senhorita?"
52070-144 = "Sou Azami Habu, Presidente do Comitê Autônomo da Filial Ebisu.#nJá se esqueceu de mim?"
52070-145 = "Ainda tem aluna naquela escola?#nUltimamente minha memória anda falhando bastante."
52070-146 = "Ora, nós nos vimos ontem mesmo."
52070-147 = "Gostaríamos de perguntar sobre a anomalia#nque o senhor avistou perto do ateliê há cerca de duas semanas..."
52070-151 = "Anomalia...? Ah! Aquela doninha branca?"
52070-152 = "Claro que eu me lembro! Que bicho mais feroz."
52070-153 = "Até me lembrei de quando fui mordido por uma doninha nas montanhas, quando era criança...#nSério, aquele bicho é pavoroso."
52070-168 = "Lá pela madrugada, quando fui entrar no ateliê... dei de cara com \"aquela coisa\".#nTomei um susto tão grande que derrubei a garrafa."
52070-179 = "O chão ficou cheio de cacos de vidro...#nmas o bicho saiu andando por cima deles como se não fosse nada."
52070-180 = "Foi aí que eu saquei. Aquilo não era uma doninha de verdade."
52070-181 = "...A doninha de que ele tinha medo na infância."
52070-182 = "Então é assim que funciona..."
52070-183 = "Que pena... uma garrafa de vidro tão preciosa ter se quebrado."
52070-184 = "Só de olhar para as peças expostas aqui, já dá para sentir toda a dedicação..."
52070-188 = "Ah, não esquenta com isso não!#nO que quebrou naquele dia foi só uma garrafa de leite comum."
52070-189 = "...Mas reconhecer o valor dessas peças assim de cara? Você tem bom olho, mocinha!"
52070-190 = "Tem mais lá dentro. Quer dar uma olhada?"
52070-194 = "Sim, com todo o prazer!"
52070-201 = "Terras agrícolas perto da Filial Ebisu"
52070-202 = "Estas são as terras agrícolas do Distrito Autônomo de Ebisu."
52070-203 = "O milho, as batatas e as cenouras usados nos festivais de Hyakkiyako#nsão todos colhidos nas plantações desta região."
52070-204 = "Os legumes de Ebisu servidos em Hyakkiyako já são deliciosos, mas...#nas colheitas vão perdendo a doçura assim que saem da terra.#nNada supera o sabor de algo recém-colhido."
52070-208 = "Sendo assim...#naqui está um pouco de milho que acabou de ser colhido.#nGostariam de provar?"
52070-209 = "Bom, já que oferece..."
52070-216 = "...D-Doce! Parece até que jogaram açúcar por cima!"
52070-217 = "O sabor do milho explode na boca! Está divino!"
52070-218 = "Hihi, fico muito feliz por poder compartilhar esse sabor com vocês."
52070-219 = "...O Hyakumonogatari apareceu por aqui também?"
52070-220 = "Sim.#nParece que este senhor aqui se deparou com uma criatura na forma de um urso enorme..."
52070-223 = "Pois é, eu vi com os meus próprios olhos!"
52070-224 = "Foi no fim de semana passado... eu estava cuidando da lavoura quando senti uma presença. Quando virei,#ntinha um urso me encarando fixamente..."
52070-242 = "Achei que tinha voltado para destruir a plantação, então disparei minha espingarda de caça,#nmas o bicho nem se mexeu!"
52070-243 = "...Foi aí que percebi que não era um urso de verdade."
52070-245 = "Mas não existem ursos selvagens que resistem a uma espingarda de caça?"
52070-246 = "Isso não é comum por aqui?"
52070-248 = "Este ano teve muita seca, então faltou bolota e castanha nas montanhas.#nOs que não conseguiram hibernar descem atrás das plantações."
52070-249 = "Afinal de contas...#nminhas batatas são tão doces que não devem nada à batata-doce!"
52070-250 = "Se assar na fogueira,#ntanto urso quanto assombração vêm correndo só pelo cheiro!"
52070-254 = "Já que estamos aqui, trouxe algumas de lanche. Vocês não querem experimentar, meninas?"
52070-258 = "Sim, aceitamos com gratidão!"
52070-261 = "Uau... a cada mordida vem uma doçura intensa...#nIsso aqui é batata de verdade mesmo?!"
52070-262 = "Combinado com essa textura macia... isso já é uma sobremesa natural!"
52070-263 = "Hahaha! Dá até gosto ver vocês aproveitando tanto assim!"
52070-264 = "Esperem aí, ainda tenho mais!"
52070-271 = "Aqui é..."
52070-272 = "É o cais. Daqui embarcamos frutos do mar para toda Kivotos."
52070-273 = "Os diversos frutos do mar pescados nas águas próximas#ntambém são uma das especialidades do Distrito Autônomo de Ebisu."
52070-274 = "A lula grelhada mais popular das barracas de festival?#nCom certeza usa as lulas pescadas aqui."
52070-275 = "...O Hyakumonogatari também foi visto por aqui?"
52070-276 = "Sim. Um pescador que havia terminado o turno da manhã viu um caranguejo-aranha gigante..."
52070-277 = "...Um caranguejo-aranha?"
52070-278 = "Ele é pescador e tem medo de caranguejo?"
52070-279 = "Eu também achei curioso, mas ele disse que parece uma aranha..."
52070-280 = "Quem não gosta de insetos talvez não aguente mesmo."
52070-281 = "Não poderemos falar com a testemunha desta vez?"
52070-282 = "Infelizmente, neste horário ele já saiu para pescar..."
52070-283 = "Então não tem jeito.#nTambém não podemos perder muito tempo, vamos para o próximo..."
52070-284 = "Porém...#nna verdade, há um restaurante aqui perto que serve um peixe grelhado maravilhoso."
52070-285 = "Já está quase na hora do almoço, que tal fazermos uma refeição por aqui?"
52070-287 = "...Peixe grelhado?"
52070-288 = "Sim. Temos um modo de preparo tradicional de Ebisu..."
52070-289 = "Depois de grelhar até a pele ficar bem crocante, regamos com missô dissolvido e assamos no papel-alumínio!"
52070-290 = "A cavala-atka, que está na temporada, fica com o missô impregnado na pele carnuda...#nÉ verdadeiramente divino!"
52070-291 = "..."
52070-292 = "Mas se estiverem sem tempo, não há problema.#nPodemos preparar uns onigiris simples lá na filial..."
52070-293 = "Ficamos andando sem parar até agora, acho que seria bom descansarmos um pouco."
52070-297 = "Reabastecer é o básico da arte da guerra. Está na hora de almoçar..."
52070-302 = "Hã? Mas a gente nem andou tanto assim, né?"
52070-303 = "Eu estou cansada."
52070-304 = "...De qualquer forma, que tal uma pequena pausa?"
52070-305 = "Eu concordo plenamente!"
52070-306 = "Sei não, tem alguma coisa estranha nisso... mas tudo bem.#nBora encher a barriga, então!"
52070-314 = "(Depois disso, continuamos colhendo relatos perto da Filial Ebisu,#nmas não conseguimos nenhuma pista concreta...)"
52070-315 = "(...E quando percebemos, o sol já havia se posto.)"
52070-320 = "...Está escurecendo."
52070-321 = "Disseram que o Hyakumonogatari aparece depois do anoitecer, né?#nA investigação de verdade começa agora..."
52070-325 = "Não, não. Jamais poderíamos exigir tanto de nossas convidadas."
52070-326 = "Vocês vieram de tão longe, devem estar exaustas.#nSe quiserem, fiquem à vontade para usar os quartos do dormitório.#nNão há outras alunas, então temos quartos de sobra."
52070-327 = "Não, ainda não estamos tão cansadas..."
52070-328 = "Ah, o dormitório também tem fontes termais, sabiam?"
52070-329 = "São fontes termais muito elegantes e esplêndidas...#nSe for do agrado de vocês..."
52070-334 = "Fontes termais?!"
52070-335 = "O dormitório tem fontes termais?!"
52070-337 = "Sim. Antigamente funcionavam como um grande banho público para toda a escola...#nmas agora acabaram ficando só para mim."
52070-338 = "Por favor, aproveitem para relaxar e aliviar o cansaço da viagem.#nEnquanto isso, vou preparar o jantar."
52070-339 = "Aaaah! Fontes termais com todo mundo do comitê!#nIsso sim é uma página da nossa juventude! Vai rolar guerra de travesseiros à noite?!"
52070-340 = "Vamos logo, pessoal!"
52070-346 = "Ai, ai...#nDesculpa jogar um balde de água fria, mas isso aqui ainda é uma missão."
52070-347 = "Eu vou ficar no quarto, então se quiserem entrar, vão só vocês."
52070-351 = "Ah, qual é? Que desânimo."
52070-352 = "Venha conosco também, Kikyou-senpai!#nSempre foi o meu sonho tomar um banho termal com minhas veteranas!"
52070-353 = "Mesmo que você diga isso..."
52070-354 = "Prometo que não vou mais esquecer de escovar os dentes e vou comer só um sorvete por dia!"
52070-355 = "Você já não tinha prometido isso antes?"
52070-360 = "Kiii-kyooou-seeen-paaai!"
52070-365 = "...Só por uma hora."
52070-366 = "Beleza, então está fechado!#nAgora, rumo às fontes termais!"
52070-367 = "Eu quero beber leite de frutas depois do banho!"
52070-373 = "Gostaria que eu preparasse uma muda de roupas?"
52070-377 = "Ah... sim, por favor."
52070-378 = "Você ainda não vai descansar, Sensei?"
52070-379 = "[s5] \"Sim, estou pensando em algumas coisas.\"\n[s6] \"Não precisa se preocupar comigo.\""
52070-382 = "Entendi. Então eu vou indo na frente."
52070-392 = "Aaaah... que paraíso!"
52070-393 = "O corpo quentinho com esse ventinho gelado batendo é bom demais..."
52070-394 = "Que paisagem nevada mais linda! É tão romântico!"
52070-395 = "Além disso, é a primeira vez que entro num banho tão grande assim...#nEstou tão feliz por termos vindo!"
52070-402 = "..."
52070-403 = "Kikyou, por que você está enrolando aí?"
52070-404 = "Não me diga que... você está com medo de entrar?"
52070-405 = "O quê?! Como se a Estrategista da Hyakkaryouran fosse ter medo de água!"
52070-409 = "...N-Não entenda errado. Só estou seguindo a maneira correta de entrar no banho."
52070-410 = "É preciso ir molhando os pés aos poucos para o corpo se acostumar.#nChoque térmico é perigoso."
52070-411 = "Mas pular direto no frio também é divertido, não é?"
52070-412 = "Você não acha, Nagusa-senpai?"
52070-413 = "...Sim.#nA água está tão quentinha e gostosa."
52070-414 = "Parece que todo o cansaço do dia está indo embora."
52070-415 = "...Embora eu ache que a gente só fez turismo hoje."
52070-416 = "Pois é...#nEmbora, no fim das contas, teve uma certa pessoa que se divertiu mais que todo mundo."
52070-417 = "Disse alguma coisa?"
52070-418 = "Eu também me diverti imensamente hoje!"
52070-419 = "As belas paisagens, as conversas com os moradores...#nE o milho, as batatas e o peixe grelhado,#nestavam absolutamente deliciosos!"
52070-420 = "Só que..."
52070-421 = "A Nagusa-senpai me pareceu um pouco abatida..."
52070-422 = "...Sério?"
52070-423 = "Sim. Desde que chegamos à Filial Ebisu, você ficou com uma expressão tensa."
52070-424 = "Você estava se lembrando do dia em que foi à Grande Planície Nevada?"
52070-425 = "Ou sentiu a presença do Hyakumonogatari..."
52070-426 = "Não é nada disso. Não senti a presença do Hyakumonogatari."
52070-427 = "É só que..."
52070-428 = "Fiquei pensando em que forma uma anomalia que materializa o medo das pessoas#nmostraria na minha frente."
52070-429 = "Seja lá o que for, ou \"quem\" for...#nserá que eu conseguiria apontar minha arma e puxar o gatilho?"
52070-430 = "Aquilo que mais tememos, né..."
52070-431 = "Supondo que esse Hyakumonogatari aparecesse...#nRenge, que forma você acha que ele teria para você?"
52070-432 = "Para mim? O que eu mais temo..."
52070-433 = "Hum... uma marmita vazando na mochila, talvez?"
52070-434 = "Hã?"
52070-435 = "Todo mundo já passou por isso pelo menos uma vez, né?!#nVocê vai pegar a marmita feliz na hora do almoço...#ne o pano está todo ensopado de caldo...!"
52070-436 = "E se for dia de ensopado ou curry, então... urgh!"
52070-437 = "Eu preferiria não enfrentar uma marmita gigante aterrorizante..."
52070-438 = "Eu quis dizer um medo mais profundo... você não tem mais nada?"
52070-439 = "Falou a sabichona. E você, Kikyou, tem medo de quê?"
52070-440 = "Bem, eu..."
52070-441 = "Eu já ouvi falar!"
52070-442 = "Dizem que quando a Kikyou-senpai ouve uma banda de heavy metal,#nas orelhas e a cauda dela ficam totalmente arrepiadas...!"
52070-443 = "O Hyakumonogatari com certeza vai virar um roqueiro super espalhafatoso!"
52070-444 = "Eu não tenho medo de barulhos altos. Só não gosto deles."
52070-445 = "Em primeiro lugar, a Estrategista da Hyakkaryouran jamais se assustaria com um barulhinho..."
52070-447 = "...BUU!"
52070-451 = "!!?!?"
52070-452 = "Uau, acho que é a primeira vez que vejo a Kikyou levar um susto tão grande."
52070-457 = "RENGE!!!"
52070-461 = "...Hihi, é verdade."
52070-462 = "Se fosse algo tão simples assim..."
52070-468 = "Próximo;Pesadelo"
