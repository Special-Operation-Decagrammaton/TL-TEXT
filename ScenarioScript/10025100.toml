[translation]
10025100-1 = "Эпизод 10;Зачистка палубы"
10025100-7 = ""
10025100-8 = "RABBIT 1, вход с правого борта под контролем."
10025100-9 = "RABBIT 2, вход с левого борта под контролем."
10025100-10 = "Есть."
10025100-11 = "RABBIT 2, что-нибудь видишь?"
10025100-12 = "Экипажа не видно, но я чувствую... рыбу... Уф...!"
10025100-13 = "RABBIT 2, докладывай!"
10025100-14 = "Кто-то свалил здесь целую гору креветок. Они только начинают размораживаться."
10025100-15 = "На некоторых ещё есть лёд, значит, из холодильника их достали совсем недавно..."
10025100-17 = "Замороженные креветки, говоришь...?"
10025100-19 = ""
10025100-23 = ""
10025100-24 = ""
10025100-25 = "Это те креветки, которые я сдал Ред Хук Экспресс..."
10025100-27 = "Как вы поняли?"
10025100-28 = "Я мало что знаю, мисс, но креветки знаю. Этих я ловил своими руками, без сомнений."
10025100-29 = "Я специально отбирал самые крупные, потому что сказали, будто они для дорогих ресторанов в Д.У. Не могу поверить, что их просто вывалили..."
10025100-31 = "Выбросить плоды чужого тяжёлого труда... Как ужасно."
10025100-32 = ""
10025100-34 = ""
10025100-36 = ""
10025100-37 = ""
10025100-38 = "Не понимаю. Зачем платить рыбакам за все эти креветки, только чтобы потом выбросить?"
10025100-39 = "А если они здесь не ради перевозки креветок, тогда что вообще делают?"
10025100-40 = "...Контейнеры."
10025100-41 = "Я не вижу контейнеров, в которых они обычно перевозят креветки. Где они?"
10025100-42 = ""
10025100-44 = ""
10025100-46 = "Там! Вижу кучу ящиков Ред Хук Экспресс!"
10025100-47 = "Если потрясти, внутри странно гремит. Интересно..."
10025100-49 = "RABBIT 2, пожалуйста, проверь."
10025100-50 = "Проверяю."
10025100-51 = ""
10025100-53 = ""
10025100-54 = ""
10025100-55 = "Что это? Вазы, шёлк и... дорогие духи?"
10025100-56 = "Ред Хук Экспресс занимается предметами роскоши?"
10025100-57 = "Нет. У Ред Хук Экспресс лицензия на распространение морепродуктов, и только их."
10025100-58 = "Если захотят расшириться на другие товары, придётся согласовывать это с Генеральным студсоветом."
10025100-60 = "Значит, всё это контрабанда...?"
10025100-62 = "В ящике куча разных вещей, но у всех есть кое-что общее..."
10025100-64 = "Пошлины на эти товары выше, чем себестоимость их производства."
10025100-65 = ""
10025100-67 = ""
10025100-69 = "...Значит, нас раскрыли."
10025100-70 = ""
10025100-73 = ""
10025100-75 = "Ты..."
10025100-76 = "Генеральный директор Ред Хук Экспресс...!"
10025100-78 = ""
10025100-80 = ""
10025100-81 = "Тебе придётся многое объяснить. Что это за корабль? И почему мои креветки свалены на палубе?!"
10025100-82 = "Не стоит так нервничать. В вашем возрасте надо следить за давлением."
10025100-83 = "Я всё объясню, не переживайте."
10025100-84 = ""
10025100-86 = ""
10025100-87 = "Вы, возможно, уже заметили, что это на самом деле не Стигийский корабль."
10025100-88 = "Всего лишь баржа Ред Хук Экспресс с несколькими модификациями."
10025100-89 = "Надеюсь, вы не разочарованы отсутствием Глубинных... Хотя кто вообще настолько наивен, чтобы поверить в такую сказку?"
10025100-90 = "Ты всё ещё не объяснила, зачем выбрасываешь креветки."
10025100-91 = "Ой, да с чего бы мне делать такую глупость?"
10025100-93 = "Потому что они не приносят прибыли."
10025100-95 = "Не то чтобы я ожидала, что вы следите за бизнес-трендами, но в наши дни на креветках больших денег не заработать."
10025100-96 = "Рыбалка непредсказуема, поэтому фиксированные контракты не заключить, а субсидии — сущие копейки..."
10025100-97 = "Но если выбросить креветки, набить ящики контрабандой и продать её на чёрном рынке, тогда появляется настоящая прибыль!"
10025100-98 = "Н-Но креветки ведь совсем не обязательно было выбрасывать!"
10025100-99 = "Вы знаете, сколько труда нужно, чтобы поймать хотя бы одну креветку?!"
10025100-100 = "Не надо кричать."
10025100-101 = "Я честно заплатила за креветки, разве нет? Значит, могу делать с ними что хочу."
10025100-102 = "Жарить, варить, есть... Хотя сама я никогда не стала бы есть креветок."
10025100-104 = "Потому что — сейчас открою вам большой секрет — креветки! Это! Отвратительно!"
10025100-105 = ""
10025100-107 = ""
10025100-109 = ""
10025100-110 = ""
10025100-111 = "Ты...!"
10025100-113 = ""
10025100-115 = ""
10025100-116 = ""
10025100-117 = ""
10025100-118 = ""
10025100-119 = "Следи за тоном, старый морской волк. Ты вообще-то на моём корабле."
10025100-120 = "Не хотелось бы, чтобы ты случайно свалился за борт..."
10025100-122 = "Ты с ума сошла? Это преступление!"
10025100-123 = "И что? Что с того?"
10025100-124 = "Всё равно вы ничего не сделаете."
10025100-125 = ""
10025100-126 = "Старый рыбак из маленькой деревни, который умеет только ловить креветок..."
10025100-128 = "Какие-то бедные брошенные студенты полицейской школы, которых собственная академия полностью забыла..."
10025100-129 = "Четыре туристки, которым хватило глупости приехать именно сюда..."
10025100-131 = "Что вы можете мне сделать? Вся экономика этой деревни у меня в руках!"
10025100-132 = "Можете кричать, ругаться и обзывать меня. Крестьяне!"
10025100-133 = ""
10025100-135 = ""
10025100-137 = ""
10025100-138 = ""
10025100-139 = ""
10025100-142 = "[ns] «...Мияко.»"
10025100-143 = "Верно. Я услышала достаточно."
10025100-145 = "О, туристкам есть что сказать?"
10025100-147 = "Вы только что признались в грубом злоупотреблении экономической властью над деревней Ятоура, а также в следующих преступлениях:"
10025100-148 = "Сброс необработанных морепродуктов и незаконное присвоение рыболовных субсидий."
10025100-149 = "Уклонение от налогов, фальсификация деловой отчётности и контрабанда предметов роскоши."
10025100-150 = "Содержание незаконной частной вооружённой силы на преступные средства и кампания террора против местной деревни."
10025100-151 = "...а также лишение жителей Д.У. возможности наслаждаться вкусными креветками."
10025100-152 = "Вы представляете серьёзную и непосредственную угрозу гражданам Кивотоса, а потому..."
10025100-153 = "От имени академии SRT вы арестованы!"
10025100-155 = "SRT...? Какого чёрта студенты SRT делают здесь...?"
10025100-156 = "Может, вы просто отмахивались от них, потому что они не слишком прибыльные..."
10025100-157 = "...а нам вот креветки этой деревни очень нравятся. Очень."
10025100-159 = "Академия SRT, значит...?"
10025100-160 = "Эй, я о них слышал! Это спецназ. Лучшие из лучших среди правоохранителей..."
10025100-161 = "Я слышал, что академию SRT закрыли... Похоже, ошибался!"
10025100-162 = ""
10025100-164 = ""
10025100-166 = ""
10025100-167 = "Ну и невезение — встретить мелких из SRT посреди океана..."
10025100-168 = "Но я зашла слишком далеко, чтобы отступать. Если думаете, что я тихо сдамся, вы жестоко ошибаетесь."
10025100-169 = "Вся команда, на верхнюю палубу!"
10025100-171 = ""
10025100-174 = ""
10025100-175 = ""
10025100-177 = "Пусть вы и спецназ, но вас безнадёжно меньше."
10025100-179 = "Покажем этим дурочкам, что мы делаем с малявками, которые суют нос в наши дела!"
10025100-180 = ""
10025100-182 = ""
10025100-184 = "Отряд, приготовиться к бою!"
10025100-185 = ""
10025100-187 = ""
10025100-188 = "Пора драить палубу!"
