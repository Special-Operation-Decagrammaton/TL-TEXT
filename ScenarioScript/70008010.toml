[translation]
70008010-1 = "Свирепо! Ночь Морё! 1"
70008010-3 = "В один тихий весенний день..."
70008010-5 = "ААА!! Всё, больше не могу!!"
70008010-7 = ""
70008010-8 = "Ай! Ч-Что случилось, главарь? Что такое?"
70008010-10 = "Ты серьёзно?! Ни одной причины в голову не приходит?! Оглянись!"
70008010-11 = "Эм... Ну, мы, как обычно, убираемся... наверное?"
70008010-12 = "Вот именно! В последнее время мы только и делаем, что убираем! Убираем, убираем и ещё раз убираем!"
70008010-13 = "Ну... а что ещё делать? После прошлого раза Хяккарёран так нас прижали..."
70008010-14 = "Вот если бы МЫ победили ИХ, тогда могли бы заставить убираться уже их!"
70008010-15 = "Было бы круто... только мы каждый раз проигрываем..."
70008010-16 = "Но мечтать-то приятно, да? Мы столько последнее время убираемся, что я уже сама не замечаю, как подбираю мусор просто по дороге."
70008010-17 = "А? Ты тоже?"
70008010-18 = ""
70008010-20 = ""
70008010-22 = "ААА! Это не повод сближаться!"
70008010-23 = "Так не пойдёт! Мы же Морё! Нам надо делать что-нибудь достойное Морё!"
70008010-24 = "...А что вообще «достойно» нас?"
70008010-25 = "А? Серьёзно? Очевидно же, это...! Это...!"
70008010-26 = ""
70008010-28 = ""
70008010-29 = "Хм... А что вообще значит «быть Морё»?"
70008010-31 = "Убежище уличных Морё"
70008010-32 = "Хмммм..."
70008010-34 = "Главарь, ты всё ещё думаешь о том, что было раньше? Иногда ты цепляешься за такие странные вещи."
70008010-35 = "Вот именно. Главное, что мы все вместе и нам весело. Какая разница, что означают наши названия?"
70008010-37 = "Проблема! ОГРОМНАЯ проблема!"
70008010-38 = ""
70008010-41 = "Главарь! Главарь! Чрезвычайная ситуация! Быстрее, смотри!"
70008010-42 = "Ч-Что такое?! Не видишь, я тут думаю над важнейшими вещами? Чего орёшь так, будто кто-то умер?!"
70008010-43 = "А. Ничего серьёзного. Просто захотелось тебя хорошенько напугать."
70008010-44 = ""
70008010-46 = ""
70008010-47 = ""
70008010-48 = ""
70008010-49 = ""
70008010-50 = ""
70008010-51 = ""
70008010-53 = "АААРГХ!! ТЫ-Ы-Ы!!!"
70008010-54 = "И-и! Насилию — нет!"
70008010-55 = "Ха-ха-ха! Ты разозлила главаря!"
70008010-57 = "...Ладно. Так что случилось?"
70008010-58 = "А, точно! Пока смеялась, совсем из головы вылетело. Тебе приглашение, главарь."
70008010-59 = "Приглашение?"
70008010-60 = "«Ночь Морё». Так вроде называлось... Но сказали, ты поймёшь."
70008010-61 = "Что?! Ночь Морё?! Ты серьёзно?!"
70008010-63 = "А? А что это? Ты знаешь?"
70008010-64 = "Ну, вроде где-то слышала такое название..."
70008010-65 = "Ты вообще Морё или нет?! Это же основы! Ух, сейчас объясню, слушайте внимательно!!"
70008010-66 = ""
70008010-68 = ""
70008010-71 = "Ночь Морё... Это тайное собрание, которое проводят чуть ли не с самого появления Морё."
70008010-72 = ""
70008010-75 = "О нём только изредка шепчутся! Легендарное собрание, куда приглашают только самых Морё из всех Морё...!"
70008010-78 = "Вот что такое Ночь Морё!"
70008010-79 = "Наконец-то нашу впечатляющую деятельность признали!!"
70008010-80 = ""
70008010-83 = ""
70008010-84 = "Хм... Ну ла-а-адно..."
70008010-86 = "А? Ч-Что за реакция?! Радуйтесь сильнее! Мы же о Ночи Морё говорим!"
70008010-87 = "Ну... я вроде рада за тебя? Просто я не очень понимаю..."
70008010-88 = "И Морё правда настолько древние? Я думала, мы просто случайно выбрали это название."
70008010-89 = "Ух, ладно, ладно. С вами вообще бессмысленно об этом говорить!"
70008010-90 = "Короче, на Ночи Морё надо произвести впечатление на остальных главарей! Нужно надеть что-нибудь, что подчеркнёт мой класс... например маску!"
70008010-91 = "...Но ты ведь вообще маску не носишь, главарь."
70008010-93 = "Эй! Следи за языком! А вдруг для неё это больная тема?!"
70008010-94 = "А-Ах! Прости, главарь! Я не знала!"
70008010-96 = "Ух...! Ах вы мелкие болтушки..."
70008010-97 = "Я просто ещё не нашла маску, которая достойно передавала бы мою утончённость!"
70008010-99 = "Ну, выбрать маску и правда непросто. Если она слишком модная, выглядишь как подражатель. Но и брать что-то уродское только ради оригинальности не хочется."
70008010-100 = "О, у меня было так же. Я несколько дней выбирала свою."
70008010-102 = "Для участницы Морё маска — это всё! Она не просто закрывает лицо... Одним выражением она передаёт твои чувства и мысли!"
70008010-103 = "Говорят, два года назад легендарная Морё, которая после сотни приёмов свела бой с президентом Хяккарёран к ничьей, носила целую кучу масок под разные эмоции."
70008010-104 = "Так что на такое важное собрание с голым лицом мы точно не пойдём!"
70008010-105 = "Но и любую маску надеть нельзя! Иначе все будут смотреть на нас свысока!"
70008010-107 = "О! Она наконец-то решилась?!"
70008010-109 = "...Я решила!! Уличные Морё, идём искать маску, достойную класса вашей главной!"
70008010-111 = "Ого! Главарь! Неужели это правда случается! Ты наконец выбираешь маску!"
70008010-112 = "Будет весело! Я недавно видела одну, которая, по-моему, идеально тебе подходит!"
70008010-114 = "Слушайте меня!! Это СЕРЬЁЗНО!! Мы не на прогулку идём!"
