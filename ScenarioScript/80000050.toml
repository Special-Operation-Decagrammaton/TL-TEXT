80000050-119 = "Хи-хи. Это будет..."
80000050-120 = "...самый прекрасный день на свете! ♥"
80000050-121 = "[s] «...?»"
80000050-123 = "Я провёл день с Вакамо, стараясь игнорировать мурашки по спине, которые настойчиво советовали бежать как можно дальше."
