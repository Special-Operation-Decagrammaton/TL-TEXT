[translation]
1000903-1 = "История о восхитительном пудинге"
1000903-3 = "Ого, здесь тоже есть еда!"
1000903-4 = "Тут полно восхитительных закусок! Сенсей, это что, рай?!"
1000903-5 = "Ого, с чего начать? Всё выглядит потрясающе."
1000903-6 = "[s] «Разве ты не говорила, что хочешь пудинг?»"
1000903-7 = "А! Точно! Мой пудинг!"
1000903-8 = "Вся еда здесь выглядит так вкусно..."
1000903-9 = "А пудинг на сегодняшнем фестивале настолько редкий, что большинство людей никогда его не пробовали..."
1000903-10 = "[s] «Он правда настолько редкий?»"
1000903-11 = "Ага! И магазин находится далеко от Кивотоса, так что самостоятельно туда добраться очень трудно."
1000903-12 = "И он очень знаменитый, поэтому, когда я прихожу после школы, всё уже распродано!"
1000903-13 = "Поэтому я не могу упустить такой шанс!"
1000903-14 = "[s] «Ты действительно очень хочешь его попробовать, да?»"
1000903-15 = "М-м... Есть много вещей, которые я хочу съесть."
1000903-16 = "[s] «Я так и знал.»"
1000903-17 = "Но я хочу, чтобы и ты его попробовал."
1000903-18 = "Всё вкусное становится ещё вкуснее, если делиться с кем-то, правда?"
1000903-19 = "[s] «Изуми, ты лучшая!»"
1000903-20 = "Ахаха! Так, кажется, очередь вон там. Пойдём!"
1000903-23 = "[ns] «Очередь уже огромная.»"
1000903-24 = "Что же делать... Пудинг здесь ограничен по количеству, так что если опоздаем, нам может ничего не достаться."
1000903-25 = "Эх, я просто хотела поесть пудинг вместе с тобой..."
1000903-26 = "[s] «Изуми, посмотри на объявление.»"
1000903-27 = ""
1000903-28 = "Продают только по два на человека. Значит..."
1000903-29 = "[s] «Очередь длинная, но нам может хватить.»"
1000903-30 = "Правда? Отлично!"
1000903-33 = ""
1000903-34 = ""
1000903-35 = ""
1000903-36 = ""
1000903-37 = "Ух, пожалуйста... Пусть пудинг ещё останется."
1000903-38 = "[s] «Очередь понемногу уменьшается.»"
1000903-39 = "Эй, вы."
1000903-40 = ""
1000903-41 = "Хватит по сторонам глазеть. Вы двое, в очереди за пудингом."
1000903-42 = "А? Я?"
1000903-43 = "Да, вы. Если не против, поменяемся местами?"
1000903-44 = "Если уступите мне своё место, я дам кое-что хорошее взамен."
1000903-45 = "Вот, абонемент на год рамена в Кивотосе. По-моему, достойный обмен. Ну как?"
1000903-46 = "(в шоке)"
1000903-47 = "[s] «Изуми?»"
1000903-48 = "Не подумай ничего такого, Сенсей! Я не поддамся...!"
1000903-49 = "Тогда как насчёт купона на полгода анмицу из знаменитой кондитерской вагаси в Кивотосе?"
1000903-50 = "Уступите мне место в очереди!"
1000903-51 = "Эй! Я первый предложил!"
1000903-52 = "Кто первым обменяется — тот победил!"
1000903-53 = "У-у-у, д-да. Рамен... Анмицу..."
1000903-54 = "О! Меняйтесь со мной! Я целый год мечтаю попробовать этот пудинг!"
1000903-55 = "Если уступите место, обещаю пять лет наших экзотических шоколадных печений!"
1000903-57 = "У-Ух! Все пытаются меня соблазнить..."
1000903-58 = "Сенсей... Что мне делать?!"
1000903-59 = "[s1] «Изуми, решать тебе.»\n[s2] «Что бы ты ни выбрала, я с тобой.»"
1000903-60 = "Я, я... Я пришла сюда поесть пудинг вместе с Сенсеем!"
1000903-61 = "Я, я... Я пришла сюда поесть пудинг вместе с Сенсеем!"
1000903-62 = "Я всем вам отказываю! Не поддамся вашим искушениям!"
1000903-64 = "Фух... Чуть не повелась."
1000903-65 = "Но я только и думала о том, как хочу поесть пудинг вместе с тобой, Сенсей..."
1000903-66 = "[s3] «Молодец, Изуми.»\n[s4] «С нетерпением жду результата.»"
1000903-67 = "Следующий! Вот ваш пудинг!"
1000903-68 = "Следующий! Вот ваш пудинг!"
1000903-69 = "Смотри, наша очередь!"
1000903-70 = ""
1000903-71 = ""
1000903-72 = "Сенсей! Наконец-то он у меня! Лимитированный пудинг-желе с угрём!"
1000903-73 = "[s] «...Погоди, что?»"
1000903-74 = "Лимитированный пудинг-желе с угрём!"
1000903-75 = "Посмотри, Сенсей. Этот чёрный блеск и ни с чем не сравнимый пикантный запах... А-а-а, понюхай."
1000903-76 = "Такой уникальный вкус!"
1000903-77 = "[s] «П-Погоди. Изуми, я думал, мы пришли за пудингом. Не за угрём...»"
1000903-78 = "Так пудинг сделан из угря! Ты просто обязан попробовать!"
1000903-79 = ""
1000903-80 = "Вот, Сенсей! Одну ложечку!"
1000903-82 = "[s] «Э?! Что за безумный вкус!»"
1000903-83 = "Вкусно же?! Теперь ложечку мне. Ням!"
1000903-84 = ""
1000903-85 = "Ешь ещё, Сенсей! Там полно осталось! Хи-хи-хи!"
1000903-86 = "[s] «П-Погоди. Изуми, стой! Я-я сдаюсь!»"
1000903-88 = "(Изуми так настойчиво меня кормила, что мне пришлось съесть весь пудинг-желе с угрём.)"
