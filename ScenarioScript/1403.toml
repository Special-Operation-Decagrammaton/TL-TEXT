[translation]
1403-1 = "Оружие и перцы, часть 3"
1403-2 = "Коридор Миллениума"
1403-3 = ""
1403-4 = ""
1403-5 = ""
1403-6 = ""
1403-7 = ""
1403-8 = "По-моему, она пока не заметила ничего странного в оружии."
1403-9 = "Рано расслабляться. Стоит ей нажать на спуск — и нам конец."
1403-10 = "Не волнуйся. Нэру вспыльчивая, но именно поэтому весь Миллениум старается её не провоцировать."
1403-11 = "Нэру не станет просто так нажимать на спуск, если только не найдётся, как она говорит, «идиот, решивший нарваться»."
1403-12 = ""
1403-13 = "О, Нэру, вот ты где!"
1403-14 = "А? Ты одна из близняшек из Отдела разработки игр. Чего тебе?"
1403-15 = "Ты только посмотри на эту сломанную консоль!"
1403-16 = "В прошлый раз, когда Банда Шлемов устроила беспорядки на территории академии, ты носилась за ними как бешеная и случайной пулей попала в консоль. Это ты виновата!"
1403-17 = "Ты издеваешься? С чего это моя вина?"
1403-18 = "С консолью всё было бы нормально, если бы ты не стреляла куда попало! Ты вообще представляешь, сколько эта штука стоит? Вот ты и должна платить за ремонт!"
1403-19 = "Ах ты мелкая...! Лучше отвали!"
1403-20 = "Стойте! Предоставьте это нам!"
1403-21 = ""
1403-22 = "А? А Инженерный отдел тут что делает?"
1403-23 = "Погоди, Момои. Можно мне на минутку взглянуть на эту консоль?"
1403-24 = ""
1403-25 = "Хм. Тут всего лишь небольшая неисправность из-за сломанного терминала доступа. С теми деталями, что у нас под рукой, починим без проблем!"
1403-26 = "Правда? Фух, какое облегчение..."
1403-28 = "Хмф. Мы закончили? Тогда я пошла."
1403-29 = ""
1403-30 = "П-Погоди, Нэру!"
1403-31 = "Мы починим твою консоль, если оставишь её в нашей мастерской. Просто сейчас мы немного заняты..."
1403-32 = "Хибики, пошли за Нэру, пока ещё кто-нибудь не решил с ней подраться!"
1403-34 = "Подраться? Чем вообще занят Инженерный отдел?"
1403-36 = "Но после этого нам пришлось тушить один пожар за другим..."
1403-38 = ""
1403-39 = "Слушай, председатель. Мне всегда было интересно, откуда у тебя такая маленькая куртка-сукaдзян. Из детского отдела одежды?"
1403-40 = "Какого хрена ты только что сказала? Я тебя убью!"
1403-42 = "Погоди, Нэру! Не злись! Уверена, Асуна вовсе не хотела тебя обидеть!"
1403-43 = "...Верно. Но всё же, Асуна, тебе стоит извиниться перед Нэру, не думаешь?"
1403-44 = "Хм. А это правда было обидно?"
1403-45 = "Прости, если задела больное место. Я просто подумала, что твой сукадзян крутой..."
1403-46 = "Хмф. Невероятная ты. Благодари Инженерный отдел, что я это спущу, но ещё раз упомянешь детский отдел одежды — убью!"
1403-49 = ""
1403-50 = "Нэру, можешь выстрелом сбить замок с этой двери? Я забыла ключи."
1403-51 = "Легко. Поднести ствол к ручке и..."
1403-52 = ""
1403-53 = "П-Погоди! Если вам просто нужно открыть дверь, оставьте это нам!"
1403-54 = "Открыть её, не уничтожив ручку, для нас проще простого."
1403-55 = ""
1403-56 = ""
1403-57 = "Ого. Вы вскрыли замок одной проволокой, прямо как в кино. Невероятно!"
1403-58 = "Мы в таком специалисты! Незачем использовать оружие, чтобы открыть запертую дверь!"
1403-59 = "..."
1403-61 = ""
1403-62 = ""
1403-63 = ""
1403-64 = ""
1403-65 = ""
1403-66 = ""
1403-67 = "Какого чёрта... вы все творите?"
1403-68 = "Ч-Что ты имеешь в виду? М-Мы Инженерный отдел!"
1403-69 = "Думаешь, я этого не знаю?!"
1403-70 = "Я спрашиваю, почему вы постоянно ходите за мной хвостом и суётесь в мои дела!"
1403-71 = "М-Мы просто любим помогать ученикам, которым нужна помощь! Х-Ха-ха!"
1403-72 = "А ещё мы... убеждённые сторонники мира! Если наши технологии могут предотвратить насилие, почему бы не помочь?"
1403-73 = "Ну... в этом есть смысл, но всё равно тут что-то нечисто."
1403-74 = "Вы ведь ничего не сделали с моим оружием, да?"
1403-76 = "Вот ты где, Микамо Нэру!"
1403-78 = ""
1403-79 = "Мы ищем тебя с тех пор, как ты на нас напала!"
1403-80 = "А? Чего вам, ублюдкам, надо? Совсем страх потеряли, раз сюда припёрлись!"
1403-81 = "Ха-ха. В прошлый раз ты застала нас врасплох, но теперь мы подготовились!"
1403-82 = "Теперь всё наше снаряжение пуленепробиваемое, включая шлемы! Твоя игрушечная пукалка нас больше не возьмёт!"
1403-83 = "Так что готовься, маленькая госпожа президент C&C! Пришло время мести!"
1403-84 = "Ха. А вы, смотрю, настроены серьёзно."
1403-85 = "Ладно. Сами напросились!"
1403-86 = "П-Погоди, Нэру! Мы превратили твоё оружие в...!"
1403-87 = "*бах* *бах* *пшик*!"
1403-88 = "Ха-ха-ха! Узрите мощь наших новых пуленепробиваемых шлемов... А?"
1403-89 = ""
1403-90 = "А-а-а-а-а!"
1403-91 = "Ч-Что это? Почему пули пахнут острым и кислым...?#nЭто что, острый соус?"
1403-92 = "Он просачивается через щели в шлеме и попадает мне в глаза и нос!#n*кашель* *кашель* Я не могу дышать! Помогите!"
1403-93 = "*кашель* *кашель* М-Мелкая дьяволица! Не думал, что ты опустишься до химического оружия. C&C вообще не знает пощады! *кашель*"
1403-94 = "Я... вообще-то..."
1403-95 = "Отступаем! В следующий раз мы вам покажем! *кашель* *кашель*"
1403-98 = ""
1403-99 = "Фух, чуть не попались. Я уже думала, что пуленепробиваемое снаряжение Банды Шлемов прервёт беспроигрышную серию Нэру."
1403-100 = "Хорошо, что мы установили дозатор острого соуса. Надо отпраздновать!"
1403-101 = "...Эй."
1403-102 = "Кто-нибудь объяснит мне, какого хрена это произошло...?"
1403-103 = "Мы вроде как... провели небольшой эксперимент, и вот что получилось. Нам показалось, что оружие, стреляющее острым соусом, может пригодиться."
1403-104 = "И ведь пригодилось, правда? Радуйся!"
1403-105 = "...Последние слова будут?"
1403-106 = "*бах* *бах* *пшик*!"
1403-107 = "А-А-а! Только не острый соус!"
1403-108 = "*кашель* *кашель* Не дайте ему попасть в глаза... Это очень вредно!"
1403-109 = "Сами виноваты!"
1403-110 = "*бах* *бах* *пшик*!"
1403-112 = "Оружие и перцы"
