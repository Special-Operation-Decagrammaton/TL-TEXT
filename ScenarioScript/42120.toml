[translation]
42120-1 = "Episódio 12;Determinação"
42120-5 = "Parque Kousagi"
42120-7 = "[ns] \"Voltei.\""
42120-9 = "[ns1] \"Ué, pessoal...?\"\n[ns2] \"Eu trouxe uns bentôs de carne premium, mas—\""
42120-16 = "(...Depois de procurar pelo parque por algum tempo, não havia sinal de nenhuma integrante do Esquadrão RABBIT em lugar algum)"
42120-25 = "(O interior das barracas onde o esquadrão dormia estava perfeitamente arrumado, e havia uma carta deixada ali)"
42120-29 = "[ns3] \"Isto é...\"\n[ns4] Ler a carta deixada sobre a mesa."
42120-34 = "Para o Sensei [USERNAME]."
42120-35 = "Sensei, aqui é a Miyako. Peço desculpas por me despedir assim, por meio de uma carta."
42120-39 = "A partir de hoje, encerraremos nosso protesto no Parque Kousagi e retornaremos para junto das nossas veteranas."
42120-44 = "Tanto por termos nos convencido com as palavras delas naquele dia, quanto porque..."
42120-45 = "Agora que a Chefe Kaya, que apoia a restauração da SRT, assumiu como Presidente Interina do Conselho Estudantil Geral,#nnão temos mais motivo para continuar o protesto aqui."
42120-46 = "A vida no parque não é fácil o bastante para continuarmos uma luta sem propósito."
42120-49 = "Em um ambiente onde até comida, abrigo... e um simples banho eram difíceis...#nAcabamos dando muito trabalho a todos."
42120-50 = "E o senhor também nos ajudou muito, Sensei."
42120-51 = "Se não fosse pelo senhor, acho que já teríamos desistido há muito tempo."
42120-52 = "Mas agora temos as nossas veteranas."
42120-53 = "A vida de disciplina rigorosa que a Saki deseja, os equipamentos poderosos que a Moe procura,#ne o quarto quentinho que a Miyu quer — tudo isso está lá."
42120-54 = "Apenas quanto às minhas próprias convicções, há algo que ainda me incomoda um pouco, mas..."
42120-59 = "No fim das contas, somos apenas armas que obedecem a ordens."
42120-60 = "Só posso esperar que esta seja a melhor escolha."
42120-61 = "...Desculpe por ser uma má aluna que tomou essa decisão sozinha, sem consultar o senhor."
42120-62 = "Eu sei que o certo seria falar pessoalmente, ou ao menos ligar para conversar com o senhor antes, mas..."
42120-63 = "Senti que, se ouvisse a sua voz, eu acabaria hesitando..."
42120-64 = "Por favor, perdoe-me por me despedir assim, apenas com uma carta."
42120-65 = "Peço desculpas por todo o transtorno que causamos até hoje."
42120-66 = "Recolheremos os suprimentos deixados no parque assim que todas as operações terminarem."
42120-70 = "Se houver uma oportunidade, um dia... espero que possamos nos reencontrar em outro lugar, sob outras circunstâncias."
42120-71 = "De Miyako."
42120-74 = "[ns] Arrumar um pouco das coisas deixadas no parque."
42120-82 = "Arredores do D.U. - Campo de Treinamento Militar Abandonado"
42120-85 = "Se as coordenadas estiverem corretas, este deve ser o ponto marcado, mas..."
42120-90 = "Isto é... um campo de treinamento militar?"
42120-92 = "Quem diria que existia uma instalação desse tamanho num lugar tão isolado..."
42120-94 = "Que estranho. Nas fotos de satélite e nos mapas online, isso aqui aparecia como um terreno vazio..."
42120-95 = "Será que instalaram algum equipamento ECM gigante pra interferir no reconhecimento das câmeras?"
42120-101 = "...É um campo de treinamento militar exclusivo da SRT, construído antes do desaparecimento da Presidente do Conselho Estudantil Geral."
42120-102 = "Sua própria existência era mantida em sigilo para que pudesse servir de base em emergências.#nEsta também é a primeira vez que venho aqui pessoalmente, mas..."
42120-104 = "...Parece que finalmente se decidiu."
42120-112 = "Yukino-senpai..."
42120-120 = "...Apresentando relatório."
42120-121 = "Tsukiyuki Miyako e outras três integrantes, pertencentes à Academia Especial SRT, receberam ordens de incorporação ao Esquadrão FOX."
42120-122 = "Portanto, a partir deste momento, o Esquadrão RABBIT está dissolvido. A autoridade de comando sobre as integrantes é transferida à líder do Esquadrão FOX, Capitã Shichido Yukino."
42120-124 = "— Transferência de comando confirmada. A partir deste momento, Tsukiyuki Miyako e as outras três integrantes atuarão como o Destacamento RABBIT, subordinado ao Esquadrão FOX."
42120-130 = "Bem-vinda ao Esquadrão FOX, Líder de Destacamento Tsukiyuki."
42120-131 = "...Muito obrigada."
42120-139 = "Oh, bem-vindas, nossas calouras coelhinhas."
42120-140 = "...Estão atrasadas. Quanto tempo pretendiam deixar suas veteranas esperando?"
42120-141 = "Otogi-senpai, Kurumi-senpai...!"
42120-143 = "Bom trabalho a todas por terem vindo de tão longe."
42120-144 = "Devem estar com fome, né? Querem comer primeiro ou preferem tomar um banho?"
42120-149 = "B-banho...?"
42120-150 = "A-aqui tem chuveiro também...?"
42120-152 = "Claro que tem.#nA higiene é uma questão crucial que afeta diretamente a capacidade de combate da unidade."
42120-153 = "Por pior que seja o ambiente, treinar sem nem ter onde tomar banho é..."
42120-159 = "Ah... d-desculpa por isso."
42120-160 = "Tudo bem. Usar aquele parque como base foi escolha nossa."
42120-162 = "Este campo de treinamento não só tem chuveiros, como também camas para todas vocês.#nPodem usar as instalações à vontade, tá bom?"
42120-164 = "Muito obrigada...!"
42120-165 = "Aah, que cansaço... Quero logo tomar um banho e me jogar numa cama bem fofinha..."
42120-167 = "O banho é uma boa, mas antes disso..."
42120-175 = "Vamos começar um treinamento de aprimoramento de especialidade agora mesmo!"
42120-180 = "T-treinamento de especialidade...?#nPor quê...?"
42120-182 = "Na nossa última luta, deu pra notar que a capacidade básica de combate de vocês caiu bastante."
42120-183 = "Por isso, aproveitando as boas-vindas, vamos testar de novo e bem de perto a habilidade de cada uma na sua especialidade."
42120-185 = "Destacamento RABBIT, troquem de roupa e apresentem-se no campo de manobras!"
42120-186 = "Uuu... Logo quando eu achei que finalmente ia dormir numa cama de verdade..."
42120-187 = "Treinar diretamente sob a orientação das nossas veteranas... Isso me deixa empolgada."
42120-188 = "Certo, vamos nos apressar! Precisamos desfazer as malas e trocar de roupa logo!"
42120-189 = "...Acho que, em toda a SRT, você é a única capaz de ficar feliz com um treinamento fora de hora."
42120-190 = "Mas como tem chuveiro aqui... acho que consigo me concentrar no treinamento tranquila."
42120-192 = "Hehe. Já que as calouras chegaram hoje, vai dar gosto preparar o jantar."
42120-198 = "...? Miyako, o que houve?#nAlgo está te preocupando?"
42120-199 = "Ah, não... é só que..."
42120-205 = "...Não é nada."
42120-209 = "Próximo;Choque e Pavor"
