[translation]
42120-1 = "Эпизод 12: Решимость"
42120-3 = ""
42120-5 = "Парк Коусаги"
42120-7 = "[ns] «...Я вернулся.»"
42120-9 = "[ns1] «Куда все делись?»\n[ns2] «Я даже принёс бэнто с качественной говядиной.»"
42120-10 = ""
42120-11 = ""
42120-16 = "Я обыскал весь их лагерь, но он словно вымер."
42120-17 = ""
42120-25 = "Наконец я нашёл их старую палатку для сна — пустую, и лишь письмо осталось внутри."
42120-26 = ""
42120-29 = "[ns3] «Это...»\n[ns4] Прочитать письмо на столе."
42120-30 = ""
42120-31 = ""
42120-34 = "Дорогой [USERNAME] Сенсей,"
42120-35 = "Здравствуйте, это Мияко. Простите, что сообщаю вам об этом письмом."
42120-36 = ""
42120-39 = "С сегодняшнего дня мы официально прекращаем оккупацию парка Коусаги и наш протест, чтобы вновь присоединиться к старшим студентам."
42120-40 = ""
42120-44 = "Когда мы разговаривали... я действительно верила в то, что вы мне сказали, и во всё, что мы обсуждали."
42120-45 = "Но поскольку временная председательница Кая поддержала восстановление Академии SRT, у нашего протеста больше не осталось причины."
42120-46 = "Я не могла оправдать то, что продолжаю заставлять членов своего отряда жить в таких условиях, когда у нас уже не было причины продолжать борьбу."
42120-49 = "Жить в парке было тяжело: искать просроченные бэнто и красть бочки лишь ради того, чтобы было где помыться. Я не могу забыть, насколько тяжело пришлось моим товарищам по отряду, когда мы только сюда перебрались."
42120-50 = "Но, несмотря на всё это, ваша поддержка была бесценна. Я не хочу, чтобы вы думали иначе."
42120-51 = "Любая из перечисленных мной трудностей могла бы поставить нас на колени, если бы вы каждый раз не помогали нам снова подняться."
42120-52 = "Именно благодаря вам теперь мы способны смотреть вперёд и принимать помощь и от других."
42120-53 = "Теперь все их потребности будут удовлетворены. Мы сможем следовать строгому распорядку Саки, а у Моэ будет достаточно огневой мощи, чтобы взорвать весь Кивотос. (Я шучу. Надеюсь.) Даже Мию наконец получит ту удобную кровать, о которой всегда мечтала."
42120-54 = "Это решение далось нелегко. Ради него мне пришлось поступиться своими принципами."
42120-55 = ""
42120-59 = "Но, возможно, мои принципы были ошибочны. В конце концов, оружие, которое не может выполнять своё предназначение, бесполезно, верно?"
42120-60 = "Я всё же надеюсь, что это решение будет лучшим для всех..."
42120-61 = "Простите, что сначала не обсудила его с вами."
42120-62 = "Поначалу я хотела лично попросить у вас совета. Хотела узнать, что вы думаете о моём выборе."
42120-63 = "Но... мне казалось, что, услышав ваш голос, я начну сомневаться в своём решении."
42120-64 = "Поэтому надеюсь, вы поймёте, почему на прощание мы оставили вам только это письмо."
42120-65 = "Мы доставили вам немало хлопот, правда? Спасибо, Сенсей."
42120-66 = "Мы вернёмся убрать за собой в парке и забрать вещи после завершения нашей операции."
42120-67 = ""
42120-70 = "Надеюсь, однажды наши пути снова пересекутся... Может быть, в другом месте, в другом мире..."
42120-71 = "Искренне ваша,#nМияко"
42120-74 = "[ns] Убрать то, что осталось."
42120-82 = "Заброшенный тренировочный комплекс, окраина D.U."
42120-84 = ""
42120-85 = "Судя по координатам, именно здесь они велели встретиться..."
42120-86 = ""
42120-88 = ""
42120-89 = ""
42120-90 = "Это самый огромный тренировочный комплекс, который я когда-либо видел, если это вообще тренировочный комплекс."
42120-92 = "М-Мы забрались так далеко... Кто бы мог подумать, что здесь вообще есть целый комплекс..."
42120-94 = "Странно... На спутниковых снимках его нет."
42120-95 = "Может, камеры блокируют устройства РЭБ?"
42120-96 = ""
42120-98 = ""
42120-100 = ""
42120-101 = "До исчезновения председательницы Генерального студенческого совета это был тренировочный комплекс Академии SRT."
42120-102 = "Он должен был служить оперативной базой на случай чрезвычайной ситуации, поэтому само его существование держалось в строжайшем секрете. Я тоже здесь впервые."
42120-104 = "Ты сделала свой выбор?"
42120-105 = ""
42120-107 = ""
42120-108 = ""
42120-110 = ""
42120-112 = "Юкино..."
42120-113 = ""
42120-115 = ""
42120-116 = ""
42120-118 = ""
42120-120 = "...Докладываю."
42120-121 = "Я получила приказ о том, что Цукиюки Мияко и ещё три участницы отряда RABBIT должны присоединиться к отряду FOX."
42120-122 = "Как командир отряда я распускаю RABBIT и передаю полномочия над его участницами командиру отряда FOX, Шичидо Юкино."
42120-124 = "Подтверждаю. С этого момента Цукиюки Мияко и три участницы её отряда будут действовать в составе подразделения под командованием отряда FOX."
42120-125 = ""
42120-127 = ""
42120-128 = ""
42120-130 = "Добро пожаловать в отряд FOX, командир Цукиюки."
42120-131 = "...Спасибо."
42120-132 = ""
42120-134 = ""
42120-138 = ""
42120-139 = "Вот они. Кролики нашлись."
42120-140 = "Ну и долго же вы! Мы уже заждались."
42120-141 = "Отоги и Куруми...!"
42120-143 = "Спасибо, что добрались сюда."
42120-144 = "Вы голодны? Или сначала хотите принять душ?"
42120-146 = ""
42120-148 = ""
42120-149 = "Д-Душ?"
42120-150 = "Нам можно... принять душ? В помещении?"
42120-152 = "Разумеется. Чистота жизненно важна для боевой готовности."
42120-153 = "Каким бы тяжёлым ни было положение, невозможно эффективно тренироваться, если ты не..."
42120-154 = ""
42120-157 = ""
42120-159 = "А. Простите, я забыла."
42120-160 = "Ничего страшного. Это мы сами решили жить в парке."
42120-162 = "Что ж, рада сообщить, что здесь есть душевые и отдельные кровати для каждой из вас! Чувствуйте себя как дома."
42120-164 = "Спасибо!"
42120-165 = "Я так устала... Хочу просто нормально помыться и лечь в мягкую кровать..."
42120-167 = "Звучит заманчиво. Но сначала..."
42120-168 = ""
42120-171 = ""
42120-173 = ""
42120-174 = ""
42120-175 = "Начинаем ваши специализированные тренировки! Подъём, крольчата!"
42120-176 = ""
42120-179 = ""
42120-180 = "Специализированные тренировки? П-Прямо сейчас?"
42120-182 = "Судя по последним наблюдениям, ваши боевые навыки нуждаются в серьёзной шлифовке. Очень серьёзной."
42120-183 = "Считайте это мероприятием для укрепления командного духа! Заодно оценим ваши сильные и слабые стороны."
42120-185 = "Отряд RABBIT, экипироваться и явиться на тренировочную площадку!"
42120-186 = "Угх... Только я подумала, что наконец смогу вкусить роскошь и комфорт в своей бедной, тяжёлой жизни."
42120-187 = "Хе-хе. Нас ждёт особая тренировка прямо от наших старших! Хи-хи."
42120-188 = "Хватит копаться! Разбирайте вещи и экипируйтесь! Живо!"
42120-189 = "Ты, наверное, единственный студент в истории SRT, которая радуется внезапной тренировке."
42120-190 = "Зато здесь есть душ. Можно не переживать, что после пота будем ходить липкими!"
42120-192 = "Раз уж к нам прибыли наши милые младшие, придётся сегодня особенно постараться с ужином."
42120-193 = ""
42120-195 = ""
42120-197 = ""
42120-198 = "Мияко? Всё хорошо?"
42120-199 = "А-А. Да, всё отлично."
42120-200 = ""
42120-202 = ""
42120-204 = ""
42120-205 = "...Да. Всё отлично."
42120-209 = "Следующий эпизод: Шок и страх"
