[translation]
10046070-1 = "Эпизод 7;Наша субботняя ночь"
10046070-2 = ""
10046070-3 = ""
10046070-5 = ""
10046070-6 = ""
10046070-7 = ""
10046070-8 = "Так вот В ЧЁМ ваша проблема."
10046070-9 = ""
10046070-12 = ""
10046070-13 = "Ты уже разобралась?!"
10046070-14 = "[s1] «Так быстро!»\n[s2] «Впечатляет!»"
10046070-15 = ""
10046070-16 = ""
10046070-19 = ""
10046070-20 = "А? Мы ведь уже «исследовали» эту местность, знаешь ли."
10046070-21 = "И самое главное..."
10046070-22 = "С опытом появляется особая интуиция, вахаха!"
10046070-23 = "Ну что ж, мои коллеги-инженеры..."
10046070-24 = ""
10046070-26 = ""
10046070-27 = "Начнём."
10046070-29 = ""
10046070-30 = ""
10046070-31 = "Что это?!"
10046070-32 = ""
10046070-34 = ""
10046070-36 = ""
10046070-38 = "Кружок горячих источников?"
10046070-39 = "Ичика, на позицию! Нужно их прогнать. Ты обходи с тыла!"
10046070-40 = ""
10046070-44 = "...Они со мной."
10046070-45 = ""
10046070-47 = ""
10046070-48 = "...Ичика?"
10046070-49 = ""
10046070-51 = ""
10046070-52 = ""
10046070-53 = "Хасуми, просто прими это. Умоляю."
10046070-54 = "Что вообще происходит...?"
10046070-55 = "Ичика? Я думала, ты ненавидишь этих людей. Ты же знаешь, насколько они опасны."
10046070-56 = "[s3] «Доверься ей.»\n[s4] «У Ичики есть причина.»"
10046070-57 = ""
10046070-58 = ""
10046070-60 = ""
10046070-61 = "Сенсей тоже... Понятно."
10046070-62 = "Наверняка есть веская причина, по которой вы оба хотите, чтобы я не вмешивалась."
10046070-63 = "...И после этого я жду подробного объяснения."
10046070-64 = "Спасибо, вице-президент."
10046070-65 = ""
10046070-67 = ""
10046070-68 = "Эй! Это же лучшая подружка Касуми! Привет, девчонка!"
10046070-69 = ""
10046070-71 = ""
10046070-72 = "Я ей не лучшая подружка!"
10046070-73 = "А Касуми говорила иначе. Я слышала, у вас даже одинаковые браслеты и всё такое!"
10046070-74 = "Эта девочка..."
10046070-75 = "[s5] «Может, вам удастся найти что-то общее...»\n[s6] «Думаю, вы обе по-своему правы...»"
10046070-76 = ""
10046070-77 = ""
10046070-79 = ""
10046070-80 = ""
10046070-81 = "Сенсей."
10046070-82 = "Советую очень тщательно подобрать следующие слова."
10046070-83 = "[s7] «А, простите.»\n[s8] Отвести взгляд."
10046070-86 = "Что не так с президентом Касуми? Она крутая, умная и популярная!"
10046070-87 = "Кто тебе это сказал? ОНА?!"
10046070-88 = "Ага! А как ты узнала? Ничего себе, вы и правда ОЧЕНЬ близки!"
10046070-89 = "Это не... *вздох* Ладно, пожалуй, ты не виновата."
10046070-90 = "...Хотя погоди, нет, немного виновата! Вы начали всё это утром!"
10046070-91 = "О, кстати! Президент сказала срочно подойти!"
10046070-92 = "Почему? Что-то случилось?"
10046070-93 = "Нет, потому что строительство закончено. И ты нужна нам на церемонии открытия!"
10046070-94 = "Как вы так быстро закончили? Это что, мошенничество?"
10046070-95 = "Да просто пойдём!"
10046070-96 = ""
10046070-98 = ""
10046070-104 = ""
10046070-105 = "...Это горячий источник."
10046070-106 = ""
10046070-109 = ""
10046070-110 = "Если бы, милашка!"
10046070-111 = "Учти, у нас были материалы и чертежи для горячих источников, так что... пришлось работать с тем, что есть."
10046070-112 = "Но раз здесь нет настоящей воды из источника, назвать это горячим источником нельзя. Скорее это... «не-источник»!"
10046070-113 = "Но я проследила, чтобы вода была тёплой, и растворила в ней немного серы, так что атмосфера всё равно будет нужная."
10046070-114 = "Знаю, это НЕ СОВСЕМ то же самое, но мы правда старались изо всех сил!"
10046070-115 = "...Ты и правда помешана на горячих источниках."
10046070-116 = "Погоди, нет, зачем вы вообще это построили? Оно совсем не похоже на виллу!"
10046070-117 = ""
10046070-119 = ""
10046070-120 = "Главное было сделать быстро, разве нет?"
10046070-121 = "Горячие источники — то, что мы умеем лучше всего. У нас были материалы и навыки, поэтому мы построили качественно, быстро и за сущие гроши!"
10046070-122 = "...То есть вы использовали материалы, которые я вам вернула?"
10046070-123 = "Хм? Разумеется! Разве не здорово?"
10046070-124 = "Тогда получается, вы вообще ничего не получили от нашей сделки?"
10046070-125 = "Похоже на то!"
10046070-126 = "Но... зачем вы так сделали?"
10046070-127 = "Обещание есть обещание!"
10046070-128 = ""
10046070-130 = ""
10046070-131 = "Ты и правда... нечто, Касуми."
10046070-132 = ""
10046070-136 = "Все! Наги почти здесь! Скорее!"
10046070-137 = "Касуми! Мне очень жаль, но...!"
10046070-138 = "Ничего объяснять не нужно. Я понимаю, что могу... напрячь нежную президентшу. Я уйду."
10046070-139 = "Повеселись со своей подругой."
10046070-140 = ""
10046070-142 = ""
10046070-143 = "Д-Да! Огромное спасибо! И за здание тоже!"
10046070-144 = "Не меня благодари — благодари Ичику. Пока, подружка!"
10046070-145 = ""
10046070-147 = ""
10046070-152 = "Никогда не думала, что мне придётся напоминать тебе о достоинстве, Сэя..."
10046070-153 = "Ничего нельзя было поделать. Ты заставила меня выпить столько кофеина, а вы двое всё спорили..."
10046070-154 = "Позже нам стоит обсудить это с Микой."
10046070-155 = ""
10046070-157 = ""
10046070-158 = "...? А? Вилла...?"
10046070-159 = "Все! С возвращением! Вы хорошо повеселились?"
10046070-160 = "А, Мика. Даже не начинай. Ты не поверишь, что произошло."
10046070-161 = "Не припомню, чтобы вилла выглядела... именно так."
10046070-162 = ""
10046070-164 = ""
10046070-165 = "О, правда? По-моему, всё как прежде. Просто мы сделали... небольшой ремонт, знаешь ли."
10046070-166 = "На «небольшой» это не очень похоже..."
10046070-168 = "...День был долгим. Ты устала. По-моему, вилла выглядит совершенно нормально."
10046070-170 = "Вот как? Хм. Пожалуй, раз ты так уверенно говоришь."
10046070-171 = "Сейчас я просто хочу зайти внутрь и отдохнуть."
10046070-172 = ""
10046070-174 = ""
10046070-175 = "Я приготовила тебе ванну!"
10046070-176 = "Как заботливо. Тогда прошу меня извинить."
10046070-177 = ""
10046070-179 = ""
10046070-180 = ""
10046070-182 = "...Хех. Мика, ты явно сегодня не сидела без дела."
10046070-183 = "Не знаю, как и почему ты заменила наше здание... но хорошая работа."
10046070-184 = "Ты заметила?!"
10046070-185 = "Мика... У меня есть глаза."
10046070-186 = "И у Нагисы тоже. Обычно она ни за что не закрыла бы на такое глаза."
10046070-187 = "...Но, конечно, сегодняшний день далёк от «обычного»..."
10046070-188 = "М? Ты о чём?"
10046070-189 = "Я хочу сказать, что тебе стоит немного расслабиться. В последнее время на всех нас лежало огромное бремя, и лишь немногим удалось хоть немного передохнуть."
10046070-190 = "Ты переработала, Мика. Кажется, я понимаю почему, и уверяю: твоя связь с Нагисой не настолько хрупкая."
10046070-191 = "Отдайся течению истории. А теперь я удалюсь. Спасибо за твоё непривычно щедрое гостеприимство."
10046070-192 = ""
10046070-194 = ""
10046070-196 = ""
10046070-197 = "...Почему она обязательно должна говорить вот так?"
10046070-198 = "Вы понимаете, что она имела в виду, Сенсей?"
10046070-199 = "А? Вы не... но думаете, что я могу понять? Если немного «посижу» с этой мыслью?"
10046070-200 = "...Вы становитесь таким же туманным, как она, Сенсей..."
10046070-201 = ""
10046070-205 = "...Что? Вы чувствуете запах гари?"
10046070-206 = ""
10046070-208 = ""
10046070-209 = "...! Точно! Я оставила плиту включённой!"
10046070-210 = "Поговорим позже, Сенсей!"
10046070-211 = ""
10046070-213 = ""
10046070-222 = "После ужина Нагиса и Сэя легли спать."
10046070-224 = ""
10046070-225 = "Отличная работа, все!"
10046070-226 = "Превосходно потрудились!"
10046070-227 = ""
10046070-229 = ""
10046070-231 = "Я и не знала, что вы трое так усердно работали за кулисами."
10046070-232 = "Мне стыдно признаться, но я была слишком занята тем, что наслаждалась отдыхом."
10046070-233 = "Это неправда! Ты была очень важна, Хасуми! Без тебя мы бы не справились."
10046070-234 = "Ой, ты ранишь мои чувства. А мы разве не считаемся?"
10046070-235 = "Клуб горячих источников..."
10046070-236 = "Вы вообще-то первыми затеяли весь этот цирк!"
10046070-237 = "Хаха! О-о-о, госпожа вице-президент, какая суровая!"
10046070-238 = "Хотя мы вам совершенно ничем не обязаны, Оперативная группа благодарит за помощь."
10046070-239 = "Угх... Никогда не думала, что буду благодарна Кружку горячих источников..."
10046070-240 = ""
10046070-243 = ""
10046070-244 = "А? Почему нет? Разве это не счастливый конец? У всех всё замечательно."
10046070-245 = "Именно! Какая же ты мудрая, Мэгу! Всегда видишь картину целиком."
10046070-246 = "Ага! Так как вы это построили?"
10046070-247 = "...Особенно учитывая, что грунт был настолько нестабилен, что вилла под ним провалилась."
10046070-248 = "Ну, сначала пришлось разобраться с вашей проблемой грунтовых вод."
10046070-249 = "Грунтовых вод?"
10046070-250 = "Там проходит водоносная жила, и она размывала почву. Так что не только основание участка слабело — фундамент и каркас ещё и гнили от влажности."
10046070-251 = "Вашему первоначальному архитектору следовало сразу сделать гидроизоляцию, но, похоже, он поставил красоту выше практичности!"
10046070-252 = "Можно сказать, это была рукотворная катастрофа, вызванная беспечностью."
10046070-254 = "Ничего себе, Касуми, ты так много знаешь."
10046070-255 = ""
10046070-258 = "[ns9] «Погоди, что ты...?»\n[ns10] «Там водяная жила...?»"
10046070-261 = "...А водяная жила означает, что если копнуть достаточно глубоко, наружу хлынет геотермально нагретая вода."
10046070-262 = ""
10046070-264 = ""
10046070-265 = "А ЭТО значит..."
10046070-266 = ""
10046070-270 = "[ns11] «М-Мика! Останови её!»\n[ns12] «У неё—!»"
10046070-271 = ""
10046070-272 = ""
10046070-274 = ""
10046070-275 = "Вахаха! Да, горячий источник, готовый вырваться наружу!"
10046070-276 = ""
10046070-280 = ""
10046070-284 = ""
10046070-286 = ""
10046070-287 = "Кья-а-а...?!"
10046070-288 = "...К-Как давно ты знала?"
10046070-289 = ""
10046070-291 = ""
10046070-292 = ""
10046070-293 = ""
10046070-294 = ""
10046070-295 = "С самого начала."
10046070-296 = "...Хаха! Какая умница... прямо как я."
10046070-297 = ""
10046070-299 = ""
10046070-300 = "...Никогда не теряй бдительности."
10046070-302 = "Что? Что это было?"
10046070-303 = "Что она достала? А! Это детонатор?"
10046070-304 = "Очень похоже. Наверное, прятала его."
10046070-305 = "Я подозревала, что она может выкинуть что-то подобное. Теперь надо выяснить, где она заложила взрывчатку..."
10046070-306 = ""
10046070-313 = ""
10046070-314 = "Что происходит в такой час? Почему все снаружи?"
10046070-315 = "Это не сулит ничего хорошего..."
10046070-316 = ""
10046070-319 = ""
10046070-320 = ""
10046070-322 = ""
10046070-323 = ""
10046070-324 = ""
10046070-326 = "...Геенна? Это студенты Геенны были возле НАШЕЙ виллы?"
10046070-327 = ""
10046070-329 = ""
10046070-330 = "П-Погоди! Я могу объяснить!"
10046070-331 = "О? А это что?"
10046070-332 = ""
10046070-334 = ""
10046070-335 = "Какой-то пульт? От чего?"
10046070-336 = ""
10046070-338 = ""
10046070-339 = "Эм, подож—"
10046070-340 = "Хм-м."
10046070-341 = ""
10046070-343 = ""
10046070-345 = ""
10046070-346 = ""
10046070-347 = ""
10046070-360 = ""
10046070-361 = "...?"
