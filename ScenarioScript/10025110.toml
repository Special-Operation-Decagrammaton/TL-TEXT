[translation]
10025110-1 = "Эпилог;Неожиданная посылка"
10025110-3 = ""
10025110-4 = "Здравствуйте, зрители! С вами Казамаки Май из Школы журналистики «Кронос»!"
10025110-5 = "Сегодня в «Добром утре, Кивотос» мы приехали в деревню Ятоура — маленькую рыбацкую деревушку неподалёку от порта Канэсаки."
10025110-6 = "Эта маленькая деревня, прежде ничем не известная, кроме вкусных креветок, которые ловят местные, стала новым вирусным трендом в интернете!"
10025110-7 = "Но откуда такая внезапная популярность? Всё благодаря каналу «Рыбалка с Белым Медведем», стриминговой сенсации, недавно отметившей десять миллионов просмотров!"
10025110-8 = "Благодаря его тревелогам туристы толпами едут полюбоваться живописными видами Ятоуры и лично опробовать здешние рыбные места."
10025110-9 = "После целого дня плавания и рыбалки гости пробуют местный деликатес — кусая! Воистину, эту сонную деревушку нельзя пропустить любителям морепродуктов!"
10025110-10 = "Но десять миллионов просмотров... Завидую! Интересно, когда мы доберёмся до десяти миллионов?"
10025110-11 = "Может, добрались бы, если бы ты перестала публиковать фейковые новости..."
10025110-12 = "Заткнись!"
10025110-13 = "Кхм... Конечно, любой, кто хоть раз сходил с проторенной дороги, знает: не каждая деревня встречает туристов с распростёртыми объятиями."
10025110-14 = "К счастью, в деревне Ятоура все дружелюбны и гостеприимны, а туристы делятся положительными впечатлениями в сети."
10025110-15 = ""
10025110-19 = "А... И вот как раз к причалу подходит рыбак."
10025110-20 = "Не переключайтесь — сейчас возьмём у него интервью в прямом эфире!"
10025110-22 = ""
10025110-26 = ""
10025110-27 = ""
10025110-28 = ""
10025110-29 = ""
10025110-30 = ""
10025110-31 = ""
10025110-32 = ""
10025110-33 = ""
10025110-34 = "Здравствуйте! Вы в эфире «Доброго утра, Кивотос»!"
10025110-35 = "...Хрмпф?"
10025110-36 = "(О... Он не такой дружелюбный, как я ожидала...)"
10025110-37 = "Мы надеялись взять у вас короткое интервью..."
10025110-38 = "С дороги! Отойди! Ещё пострадаешь—"
10025110-39 = ""
10025110-41 = ""
10025110-42 = ""
10025110-43 = ""
10025110-44 = "Кумагаи! Тебе сложно хоть немного вести себя прилично?"
10025110-45 = "Уф... Простите..."
10025110-47 = ""
10025110-50 = ""
10025110-51 = "...Простите за грубость, мисс. Вы застали Кумагаи, когда он швартовал лодку. Он просто не хотел, чтобы вы пострадали."
10025110-53 = "О, н-нет, я... Простите, что помешала работе..."
10025110-54 = "Сэр, если у вас есть минутка, расскажите нам о вашей чудесной деревне!"
10025110-56 = "Ну, можно, только рассказывать особо нечего. Маленькая скучная деревня, где мы ловим креветок... Вот и всё."
10025110-58 = "Как... интересно...?"
10025110-60 = "Но раз вы, городские, так заинтересованы нашей деревней, то самое малое, что я могу сделать, — оставить вам хорошие воспоминания."
10025110-61 = "Чтобы, когда пойдёте в супермаркет, вспомнили и выбрали наши креветки, а не чужие! Ха-ха-ха!"
10025110-63 = "Вот как... Кажется, я начинаю понимать... очарование... вашей прекрасной деревни!"
10025110-64 = "Конечно, история не ограничивается креветками. Я слышала любопытный слух..."
10025110-65 = "Сэр, вы когда-нибудь слышали о существах, которых называют «Глубинными»?"
10025110-67 = ""
10025110-69 = ""
10025110-71 = "В интернете ходят слухи, что если молиться Глубинным на Рифе Дьявола, они даруют богатый улов..."
10025110-72 = "За все годы здесь вы когда-нибудь видели что-то подобное?"
10025110-74 = "Хм-м... Ну, старые байки на эту тему действительно есть, но не более того — байки."
10025110-75 = "Если бы кто-то и правда раздавал рыбные благословения, уж мы, рыбаки, знали бы об этом первыми."
10025110-77 = "Наверное..."
10025110-78 = "А, и ещё один слух! Вы слышали о Крикуне из Кусая?"
10025110-79 = "Крикуне из чего?"
10025110-80 = "Говорят, что тёмной ночью, если пройти мимо склада кусая, можно услышать голос, кричащий: «Больше никаких креветок! Больше никакого кусая!»"
10025110-82 = ""
10025110-84 = ""
10025110-85 = "...Впервые слышу."
10025110-86 = "Знаешь, ночью ветер в старых зданиях издаёт всякие смешные звуки. Может, это и слышали?"
10025110-87 = "Старое скрипучее дерево иногда прямо как человек кричит."
10025110-89 = "А... ага..."
10025110-91 = ""
10025110-93 = ""
10025110-94 = "(Сэр! Он опять сбежал!)"
10025110-95 = "Хмпф. Вот же заноза..."
10025110-96 = "Соберите ребят и прочешите деревню. И записи камер заодно посмотрите..."
10025110-97 = "Из города ведь только одна дорога туда и обратно..."
10025110-99 = "Эм... О чём вы двое говорите?"
10025110-101 = "Да так, стариковские разговоры рыбаков."
10025110-102 = "Приятного пребывания, мисс. А нас простите, рыба сама себя не поймает..."
10025110-103 = ""
10025110-105 = ""
10025110-108 = ""
10025110-109 = "Что вообще происходит в этой деревне...?"
10025110-111 = ""
10025110-113 = "Парк Коусаги"
10025110-115 = ""
10025110-116 = "Жарко..."
10025110-117 = "И правда..."
10025110-118 = "Слишком жарко..."
10025110-119 = "Я бы сейчас с удовольствием искупалась..."
10025110-120 = "Скучаю по пляжу..."
10025110-121 = "Мы уехали из деревни Ятоура всего несколько дней назад, а кажется, будто прошла целая жизнь..."
10025110-122 = ""
10025110-124 = ""
10025110-125 = "Отличная была поездка..."
10025110-126 = "Сначала мне было так страшно, но в итоге все жители оказались очень добрыми..."
10025110-127 = "И мы порыбачили ночью... И наелись вкусных морепродуктов..."
10025110-128 = "Даже не помню, когда в последний раз так веселилась..."
10025110-129 = "С тех пор как академию закрыли, одна катастрофа шла за другой. Нам нужен был этот отдых."
10025110-130 = "Ну, технически это тоже была миссия, но почти то же самое."
10025110-131 = "В конце концов всё вышло именно так, как сказал Сенсей..."
10025110-132 = "Важно сосредотачиваться на целях и усердно работать, но если забывать время от времени отдыхать, начинаешь ошибаться..."
10025110-133 = "Эта миссия напомнила мне, что я должна следить и за тем, чтобы отряд RABBIT нормально отдыхал."
10025110-134 = "Но мы поклялись оставаться здесь, в парке Коусаги, пока академию SRT не восстановят."
10025110-135 = "Так что давайте сохранять позитивный настрой и изо всех сил работать ради возрождения SRT!"
10025110-136 = ""
10025110-138 = ""
10025110-139 = "Кстати, уже почти обед. Почему Моэ ещё не вернулась с сегодняшними бэнто?"
10025110-140 = ""
10025110-142 = ""
10025110-144 = ""
10025110-145 = "О боже! Все, смотрите сюда!"
10025110-146 = "Эй, Моэ! Чего ты так долго—"
10025110-147 = "Хи-хи... Саки, после того как увидишь, что я принесла, больше рот на меня открывать не будешь."
10025110-148 = "Смотрите! Ограниченная серия «Сосновых бэнто» из Ангел 24! И я даже нашла четыре разных!"
10025110-149 = "Что это... Бэнто с наклейками сосны вместо бамбука или цветков сливы? Выглядят дорого..."
10025110-150 = "Так и есть! В каждом бэнто каждое блюдо — настоящий деликатес. Их выпускают очень редко, и найти сразу четыре в мусоре..."
10025110-151 = "Хорошо, что я подключилась к системе отслеживания магазина. Успела забрать их раньше, чем какой-нибудь другой любитель мусорок!"
10025110-153 = "Наверное, пришлось далеко идти за ними. Поэтому ты и вернулась позже обычного."
10025110-154 = "Не могу поверить, что сегодня у нас такой шикарный обед... Отличная работа, Моэ!"
10025110-155 = "Так, посмотрим, что в меню."
10025110-156 = ""
10025110-158 = ""
10025110-159 = ""
10025110-160 = "Лосось... Говядина... Карааге из курицы... О, темпура с креветками!"
10025110-161 = "Рада снова видеть креветки в магазинах."
10025110-162 = "Да? После прошлой миссии я начала ценить креветки совсем по-другому."
10025110-164 = "В честь тяжёлого труда рыбаков я забираю темпуру с крев—"
10025110-165 = "Не так быстро, Саки."
10025110-166 = "С чего это ты первой выбираешь бэнто?"
10025110-168 = "Но, Моэ, ты ведь всегда выбираешь говядину или курицу вместо морепродуктов?"
10025110-169 = "К тому же — не то чтобы я себя хвалила — та подводная диверсия была отличной работой. Думаю, я заслужила это бэнто с крев—"
10025110-170 = "Ни за что! Сегодня мне как раз хочется креветок!"
10025110-171 = "К тому же именно Я вообще-то нашла эти бэнто!"
10025110-172 = "В-Вообще-то... я тоже хотела бы креветки..."
10025110-174 = "...И я тоже."
10025110-175 = "Хм. Сегодня конкуренция серьёзная."
10025110-177 = "Другого выхода нет. Решим всё камень-ножницы-бумага."
10025110-178 = ""
10025110-180 = ""
10025110-186 = ""
10025110-187 = "Эм, здравствуйте? Здесь есть госпожа Цукуюки Мияко?"
10025110-188 = "Я Цукуюки Мияко..."
10025110-189 = "Для вас посылка."
10025110-190 = "Вот так... Распишитесь здесь, пожалуйста!"
10025110-191 = ""
10025110-193 = ""
10025110-194 = ""
10025110-195 = ""
10025110-196 = "Эм... Кто-то действительно адресовал посылку прямо в парк?"
10025110-197 = "Ага. Сами посмотрите."
10025110-198 = "Госпоже Цукуюки Мияко, палатка перед фонтаном, районный парк, город Коусаги, Д.У."
10025110-200 = "Обязательно было писать настолько подробно...?"
10025110-202 = "Она точно для меня, но кто вообще отправил бы посылку сюда?"
10025110-203 = "О, это от рыбаков из деревни Ятоура!"
10025110-204 = "Они сказали, что посылку нужно хранить в холодильнике, поэтому отправили доставкой день в день."
10025110-205 = "Содержимое портится при комнатной температуре, так что после открытия используйте сразу, а остатки заморозьте."
10025110-206 = "И... это всё, что мне передали. Хорошего дня!"
10025110-208 = ""
10025110-213 = "Зачем деревне Ятоура отправлять нам посылку...?"
10025110-214 = "Важнее другое: что это было про портящееся содержимое? Что они прислали?"
10025110-215 = "Пахнет... рыбой..."
10025110-217 = "Лучше открыть."
10025110-218 = ""
10025110-220 = ""
10025110-221 = ""
10025110-222 = ""
10025110-225 = "Это..."
10025110-226 = "...креветки! Причём хорошие!"
10025110-227 = "Они прислали нам ящик дорогих на вид креветок..."
10025110-228 = "Здесь записка."
10025110-229 = ""
10025110-231 = ""
10025110-232 = ""
10025110-233 = ""
10025110-234 = "«Туристкам, случайно оказавшимся в нужном месте в нужное время. С благодарностью, от старых морских волков Ятоуры.»"
10025110-235 = "Ну, теперь мы знаем, что адресом не ошиблись."
10025110-237 = "В нужном месте в нужное время. Это про нас."
10025110-238 = "Это уже слишком..."
10025110-239 = "Мы всего лишь выполняли свой долг как студенты SRT. Получить взамен нечто настолько ценное..."
10025110-240 = "От подарка, который уже пришёл по почте, не откажешься. Давайте будем благодарны и насладимся креветками."
10025110-241 = "Если тебе станет легче, Саки, можешь забрать бэнто с темпурой. А я съем твою долю креветок."
10025110-242 = "Ах ты мелкая...!"
10025110-244 = "Здесь креветок человек на десять... Мы правда сможем всё съесть...?"
10025110-245 = "У нас нет холодильника... Всё, что не доедим, испортится..."
10025110-247 = "Верно. Было бы неуважительно дать такому подарку пропасть..."
10025110-248 = "Почему бы не позвать [USERNAME] Сенсея к нам?"
10025110-249 = "Хорошо!"
10025110-251 = ""
10025110-257 = ""
10025110-258 = "Сенсей, вы сейчас свободны?"
10025110-259 = "Это насчёт операции «Креветочная сеть»..."
10025110-260 = "Вы нам очень помогли, поэтому..."
10025110-261 = "Чего ты ходишь вокруг да около?"
10025110-262 = "Если слишком стесняешься сказать, давайте произнесём все вместе."
10025110-263 = "Д-Да... Все вместе..."
10025110-265 = "Обед за наш счёт, Сенсей!"
10025110-267 = ""
10025110-270 = "Я присоединился к студентам отряда RABBIT в парке Коусаги и устроил с ними большой креветочный барбекю."
10025110-271 = ""
10025110-274 = "Чуть позже в Шале прибыла огромная партия кусая... Но испытание этой едой — история уже для другого дня..."
10025110-275 = "ОТРЯД RABBIT и тайна пропавших креветок"
