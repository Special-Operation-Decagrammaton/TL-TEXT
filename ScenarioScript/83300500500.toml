83300500500-7 = "(Может ли это быть связано с нарушителями, которые устроили нам засаду после возвращения с тренировки?)"
83300500500-8 = "(Во всех этих беспорядках чувствуется единая направляющая рука. Слишком уж они организованы и часты, чтобы быть обычными стихийными вспышками. Кто-то явно финансировал наших нападавших.)"
