[translation]
90001030-1 = "Эпизод 3;Второй"
90001030-3 = ""
90001030-4 = "Мы уже довольно долго идём по следу всё глубже в Ледниковое море, но ничего действительно значимого так и не встретили."
90001030-5 = "Давайте остановимся, упорядочим данные и заново оценим наши цели."
90001030-6 = "Эйми, открой видео."
90001030-7 = "Да, президент."
90001030-8 = ""
90001030-10 = ""
90001030-15 = "Наши действия можно разделить на три основных этапа. Мы сразились с Гебурой, нашли эту зацепку и теперь идём по её следу."
90001030-16 = "Но в самом центре нашего расследования остаётся вопрос: мы так и не смогли понять намерения Гебуры."
90001030-17 = "Разве мотивы пророков не всегда было трудно понять? Конечно, были исключения: Хесед, который был оружейным заводом, и Кетер, охранявший Район Затопленных Руин."
90001030-18 = "А затем мы встретили трёх странных детей, назвавшихся инженерами и последователями Декаграмматона. Они напали на нас."
90001030-19 = "Всё верно. Однако больше всего меня заинтересовало их упоминание силы Безымянных богов."
90001030-20 = "Точнее, они назвали её «запретной технологией»."
90001030-21 = "Да. Они сразу поняли, что это та же сила, которая используется в моём оружии, Аби-Эшухе."
90001030-22 = "И потому я пришла к выводу, что прямой связи между Декаграмматоном и Безымянными богами нет."
90001030-23 = "Изначально я предполагала, что между ними обязательно должна быть связь, но ошиблась."
90001030-24 = ""
90001030-25 = "Слишком много вопросов без ответов... Не знаю, зачем они позвали нас сюда, но похоже, наше присутствие стало последним компонентом для завершения той «Старшей Сестры», о которой они говорили."
90001030-26 = "Нужны ли им были все мы или только кто-то один и почему — я всё ещё не знаю."
90001030-27 = "Может, им нужна была технология Безымянных Жрецов и Богов в Аби-Эшухе..."
90001030-28 = "Или даже Сундук Шиттима, оставленный Шале Президентом Генерального Студсовета?.."
90001030-29 = "[s] «...»"
90001030-30 = "А может, им понадобился грозный дар Всеведения сверххрупкой гениальной хакерши Акебоши Химари!"
90001030-31 = "(Это выдумка.)"
90001030-32 = ""
90001030-33 = "Это всё, что мы знаем. Остальное — моя гипотеза."
90001030-34 = "Но если те дети, инженеры, представившиеся Эйн, Соф и Ор, позвали нас в Ледниковое море ради завершения этой «Старшей Сестры»..."
90001030-35 = "Тогда можно предположить, что больше всего им были нужны данные Аби-Эшуха."
90001030-36 = "Да. Похоже, это верно."
90001030-37 = "[s] «Данные Аби-Эшуха?»"
90001030-38 = "Простое предположение, Сенсей."
90001030-39 = "Они уже знали о силе Безымянных богов."
90001030-40 = "Итак, узнав о существовании такой силы, какой был бы естественный следующий шаг?"
90001030-41 = "Получить и проверить данные, а затем выяснить, можно ли использовать их себе на пользу."
90001030-42 = "Они сражались с нами, чтобы собрать данные об Аби-Эшухе?"
90001030-43 = "[s] «Значит, настоящая цель того боя...»"
90001030-44 = ""
90001030-46 = ""
90001030-47 = ""
90001030-48 = "Верно. Всё это было частью их стратегии."
90001030-49 = "Хотя мне всё ещё непонятно, в чём именно состояла их стратегия и мотив."
90001030-50 = "Но оговорюсь: всё это чистые догадки. И пока мы не нашли ни малейшего доказательства."
90001030-51 = "Тем не менее, это объяснило бы, почему Гебура избегала встречи с нами на поле боя."
90001030-52 = "Хм-м, хмм. И вдобавок ко всему мы столкнулись с новым пророком."
90001030-53 = "Если он оставил настолько заметный след, у него должна быть какая-то цель в Ледниковом море, верно?"
90001030-54 = "Скорее всего, да."
90001030-55 = "Мне интересно, как он выглядит."
90001030-56 = "Мне тоже, возможно, больше всех. Но опять же — никаких зацепок."
90001030-57 = "Единственное, что я могу вывести из увиденного следа: он невообразимо огромен."
90001030-58 = "Ещё я бы предположила, что он способен долгое время передвигаться самостоятельно."
90001030-59 = "Сила Безымянных богов, Гебура, инженеры Декаграмматона и мотивы неизвестного пророка..."
90001030-60 = "[s] «Когда перечисляешь всё это подряд, становится... не по себе.»"
90001030-61 = "Чего же они добиваются?"
90001030-62 = "Ответ должен быть где-то совсем рядом, прямо под поверхностью."
