[translation]
1010902-1 = "Бесцветная"
1010902-2 = "Коридор общежития Миллениума"
1010902-4 = "На следующий день я закончил работу как можно быстрее и отправился в общежитие Миллениума узнать, как себя чувствует Ноа."
1010902-5 = "[ns1] «(Ноа редко берёт выходной из-за болезни.)»\n[ns2] «(Надеюсь, ничего серьёзного...)»"
1010902-9 = "...Кто там?"
1010902-10 = ""
1010902-14 = ""
1010902-15 = "...А? [USERNAME] Сенсей...?"
1010902-16 = "Что вы делаете в общежитии... да ещё и в такое время?"
1010902-17 = "[s3] «Как ты себя чувствуешь?»\n[s4] «Я закончил работу пораньше и решил тебя проведать.»"
1010902-20 = "Ах, простите. Я заставила вас волноваться, да?"
1010902-21 = "Как видите, со мной всё хорошо. Не стоило проделывать весь этот путь."
1010902-22 = "*кашель* *кашель*..."
1010902-23 = "[ns] «На „всё хорошо“ это не очень похоже...»"
1010902-25 = "[ns5] «Я принёс тебе кое-что...»\n[ns6] «Можно я ненадолго зайду?»"
1010902-28 = "В мою комнату?"
1010902-29 = "Я не против, если вы войдёте, но... эм..."
1010902-30 = "Я не ждала гостей, поэтому моя комната сейчас не совсем в том состоянии, чтобы кого-то принимать. Честно говоря, немного неловко."
1010902-31 = "[s7] «Когда болеешь, у всех копятся домашние дела.»\n[s8] «Я могу помочь с уборкой.»"
1010902-34 = "Я не это имела в виду, но..."
1010902-35 = "*кашель*... В любом случае будет невежливо держать вас в коридоре, так что заходите."
1010902-36 = ""
1010902-38 = ""
1010902-40 = "Комната Ноа"
1010902-42 = ""
1010902-43 = "[ns] «Эм, Ноа...»"
1010902-44 = "Ой, точно. Я забыла вынести стул для гостя."
1010902-45 = "Сейчас принесу. Это займёт всего минутку."
1010902-46 = "[s] «Нет, я не про стул...»"
1010902-47 = ""
1010902-49 = ""
1010902-50 = "[ns] «Ты сюда только недавно переехала, что ли?»"
1010902-51 = "Нет, я живу в этой комнате с первого курса."
1010902-52 = "[s9] «И вот так она выглядит спустя два года...»\n[s10] «...Почему у тебя в комнате настолько пусто?»"
1010902-55 = "Ну... Всё необходимое у меня есть."
1010902-56 = "Учебники и школьные принадлежности сложены вон в том ящике."
1010902-57 = "А в том шкафчике лежат туалетные принадлежности и средства гигиены."
1010902-58 = "[s11] «Я не про предметы первой необходимости...»\n[s12] «Здесь вообще нет ничего личного!»"
1010902-61 = "Юука говорит то же самое каждый раз, когда приходит. Всегда замечает, насколько здесь уныло."
1010902-62 = "Честно говоря, я пыталась. Пробовала украшать стены, ставила несколько мягких игрушек, но..."
1010902-63 = "Не знаю. Пожалуй, очень эстетичная и необычная комната просто не сочетается с тем, какая я. В итоге я всегда возвращаю всё к этому виду."
1010902-64 = "[s] «Но почему?»"
1010902-65 = "Как вы прекрасно знаете, я секретарь Семинара."
1010902-66 = "Моя работа — беспристрастно записывать слова и поступки других людей. Для этого мне приходится исключать из повествования собственные мнения. Возможно, эта привычка проникла и в мою личную жизнь."
1010902-67 = "Все говорят, что моей комнате не хватает индивидуальности, но... *кашель*."
1010902-68 = "Может быть, эта безликость комнаты как раз и отражает меня настоящую."
1010902-69 = "[s13] «Технически минимализм тоже можно считать проявлением индивидуальности...»\n[s14] «Но твоей комнате всё-таки не помешало бы пятно.»"
1010902-72 = "П... пятно?"
1010902-73 = "[s15] «Ты говоришь так, будто это совершенно естественно...»\n[s16] «...но поддерживать идеально чистую комнату без единого пятнышка — тяжёлая работа.»"
1010902-76 = "[ns17] «Если позволить появиться маленькому пятну в этой чистой, бесцветной комнате...»\n[ns18] «...возможно, тебе станет проще быть снисходительнее и к самой себе.»"
1010902-79 = "...Понимаю, о чём вы. Как пятно на чистом белом листе заметнее, чем на листе, исписанном текстом."
1010902-80 = "Пожалуй, я вижу пользу в том, чтобы позволить одному-двум пятнам появиться в месте, которым пользуюсь каждый день."
1010902-81 = "Но я ведь никогда раньше не украшала комнату, Сенсей."
1010902-82 = "Не могли бы вы помочь мне с интерьером?"
1010902-83 = "Если это будете вы, я позволю делать всё, что захотите."
1010902-84 = "[s] «Конечно. В следующий раз придумаем, как её украсить.»"
1010902-85 = "Да. В следующий раз обяза—"
1010902-86 = "...*кашель* *кашель*"
1010902-87 = "[ns] «Перво-наперво тебе надо поправиться.»"
1010902-88 = "Простите, что заставила вас волноваться."
1010902-89 = "[ns19] «Ты уже ела?»\n[ns20] «Если нет, я что-нибудь приготовлю!»"
1010902-92 = "Нет, ещё не ела. Из продуктов у меня сейчас только рис и яйца."
1010902-93 = "[s] «Этого вполне достаточно.»"
1010902-94 = ""
1010902-99 = "Я приготовил простую рисовую кашу с яйцом и подал её Ноа."
1010902-100 = "Это была самая обычная каша с яйцом, но Ноа съела её так, будто это было самое вкусное блюдо в её жизни."
