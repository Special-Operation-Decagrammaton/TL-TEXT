[translation]
1003805-1 = "SRT, защищать!"
1003805-2 = "Парк Коусаги"
1003805-3 = "В популярных произведениях кроликов обычно показывают любителями моркови. Но на самом деле она им не слишком полезна, особенно в юном возрасте."
1003805-4 = "Бун-Бун ещё нет и шести месяцев, поэтому я кормлю её белым клевером."
1003805-5 = "...Это её имя?"
1003805-6 = "Да! Разве не идеально подходит?"
1003805-7 = "Бун-Бун... Хи-хи. Какая милая."
1003805-8 = "И она очень умная! Бун-Бун даже узнаёт меня и приветствует, когда я возвращаюсь с заданий."
1003805-9 = "Хотя мне каждый раз неловко оставлять её одну, когда я ухожу на миссию..."
1003805-10 = "[s] «Может, стоило взять двух кроликов?»"
1003805-11 = "Не думаю. Часто говорят, что кролики умирают от одиночества, но на самом деле они очень привередливы и пугливы. Им нужно немало времени, чтобы привыкнуть к другому кролику."
1003805-12 = "Ситуация может стать даже хуже."
1003805-13 = "Примерно как отряду RABBIT было тяжело ладить между собой до вашего появления, Сенсей..."
1003805-14 = "А. Пожалуйста, забудьте, что я это сказала."
1003805-15 = "Кстати об отряде RABBIT — сейчас это как раз моя самая большая проблема."
1003805-16 = "Нам постоянно не хватает еды... а Сяки и Моэ иногда смотрят на Бун-Бун так, будто она их следующий ужин."
1003805-17 = "Сенсей, не могли бы вы присмотреть за ней во время моей следующей миссии?"
1003805-19 = "Я согласился и ещё немного побыл с Мияко и Бун-Бун, прежде чем вернуться в Шале."
