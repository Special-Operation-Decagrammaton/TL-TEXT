[translation]
1005305-1 = "Рациональная культура поддержки"
1005305-2 = "Гостиная Шале"
1005305-6 = "Привет, Сенсей. Я хотела кое-что спросить насчёт Фестиваля Хало Кивотоса."
1005305-7 = "По поводу этих изменений расписания и других запросов..."
1005305-8 = "О, ты отдыхал. Надеюсь, я не помешала..."
1005305-9 = "[s] «Нет, я как раз собирался вернуться к работе.»"
1005305-10 = "Понятно. Тогда, пожалуйста, посмотри эти документы."
1005305-11 = "Что ты смотрел?"
1005305-12 = "Посмотрим, кто выйдет на биту, когда отбивающий Миллениума буквально выйдет к плите."
1005305-13 = "Прямая трансляция матча бейсбольного клуба Миллениума..."
1005305-14 = "Если подумать, сегодня ведь первый региональный отборочный матч."
1005305-15 = "[s] «Межшкольный чемпионат по бейсболу проводится отдельно от Фестиваля Хало Кивотоса?»"
1005305-16 = "Да, бейсбол очень популярен в Кивотосе."
1005305-17 = "В отличие от Фестиваля Хало Кивотоса, где школы участвуют в разных дисциплинах, межшкольный чемпионат использует обычную турнирную сетку."
1005305-18 = "Но, как я уже говорила, бейсбольный клуб Миллениума не очень силён, поэтому обычно вылетает ещё на региональном отборе."
1005305-19 = "Я не так уж часто смотрю матчи нашего бейсбольного клуба."
1005305-20 = ""
1005305-23 = "[ns1] «С этими бумагами я провожусь долго...»\n[ns2] «Ты не против подождать?»"
1005305-24 = "Да, всё нормально."
1005305-25 = "Да, всё нормально."
1005305-26 = "А пока посмотрю матч."
1005305-28 = "Несколько мгновений спустя..."
1005305-30 = "Подача, и... Он. Выбит. Прочь!"
1005305-31 = "Три страйка — и аут! Этому отбивающему Миллениума стоит запомнить это к следующему разу!"
1005305-32 = "Тц."
1005305-33 = "[s] «Матч идёт плохо?»"
1005305-34 = "О, нет. Я просто думала... о другом. Хаха."
1005305-35 = "Не обращай внимания."
1005305-37 = "Нижняя половина пятого иннинга, а отбивающие Миллениума всё ещё не поняли, что мяч вообще-то нужно отбивать."
1005305-38 = "И я тут же беру свои слова обратно! Вот это удар! Наконец-то из игры вылетает мяч!"
1005305-39 = "...!"
1005305-40 = "...Но недостаточно далеко! Мяч взлетел высоко и падает прямо в руки ожидающего аутфилдера! Это второй аут! И... третий аут!"
1005305-41 = "Серьёзно?! Двойной аут?!"
1005305-42 = "[s] «И „другое“ тоже идёт плохо?»"
1005305-43 = "Ой, прости. Я не заметила, насколько громко говорю."
1005305-44 = "[s3] «Не за что извиняться.»\n[s4] «Так бывает, когда увлекаешься игрой.»"
1005305-45 = "В-Всё не так!"
1005305-46 = "В-Всё не так!"
1005305-47 = "Слишком эмоционально реагировать на игру — неправильный подход даже для болельщика!"
1005305-48 = "Здоровое увлечение спортом — это ясное и спокойное рассуждение, которое приводит к рациональной поддержке игроков."
1005305-49 = "Иначе будет только больно, когда команда проиграет... Болеть за результат, а не за самих игроков — путь болельщика хорошей погоды."
1005305-50 = "[s] «Если ты так говоришь, но—»"
1005305-52 = "Но серьёзно! Неужели так сложно иногда побеждать?"
1005305-53 = "Они же не безнадёжны! У них было столько возможностей выиграть!"
1005305-54 = "Нижняя половина седьмого иннинга, Миллениум в атаке, два аута, три бола, и ведущий отбивающий у плиты... Сейчас всё или ничего."
1005305-55 = "Ух... Пожалуйста, хотя бы раз..."
1005305-56 = "Бьющий замахивается и... О! Вот это удар!"
1005305-57 = ""
1005305-59 = ""
1005305-60 = "Мяч летит! Летит! Прямо за пределы поля!"
1005305-61 = "Да, да, да, да! Хоум-ран! Хоум! Ран!"
1005305-62 = "Ты видел?! Какой хоум-ран! Какой камбэк!"
1005305-63 = "Питчер тоже был великолепен. Невероятный фастбол, почти невидимый, но наш отбивающий оказался лучше, и... это просто потрясающе!"
1005305-64 = "Я знала, что наша команда сможет!"
1005305-65 = "Не сбавляйте темп, Миллениум! Разнесите их!"
1005305-66 = "[ns] «Эм, Юука...?»"
1005305-68 = "[ns] «Ты очень близко...»"
1005305-69 = ""
1005305-71 = ""
1005305-72 = "О."
1005305-73 = "Эм... Э-Это просто... Эм..."
1005305-74 = "Я слишком увлеклась матчем..."
1005305-75 = "Н-Не пойми неправильно! Я никогда так себя не веду! Обычно! Н-Но, знаешь, исключение, подтверждающее правило..."
1005305-76 = "Эй! Почему ты смеёшься?"
1005305-77 = "Ты всё неправильно понял! Дай мне объяснить!"
1005305-79 = "После всё более сбивчивых объяснений Юки я успокоил её, и мы продолжили смотреть бейсбол."
1005305-80 = "...И вместе увидели победу Миллениума."
