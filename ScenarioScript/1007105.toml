[translation]
1007105-1 = "SRT, разведка!"
1007105-3 = ""
1007105-4 = "О, Сенсей. Вы рано."
1007105-5 = "[s1] «Ты тоже.»\n[s2] «Ты меня ждала?»"
1007105-8 = "Ну..."
1007105-9 = "Я так ждала поездки на таинственный остров, что в итоге пришла раньше назначенного времени."
1007105-10 = "Для командира отряда SRT стыдно даже не суметь соблюдать расписание..."
1007105-11 = "[s3] «Я тебя понимаю.»\n[s4] «Это как... прийти в школу раньше всех в день экскурсии.»"
1007105-12 = ""
1007105-13 = ""
1007105-15 = ""
1007105-16 = "Ха-ха... Наверное, да."
1007105-17 = "В любом случае, посмотрите. Из-за отлива вода ушла."
1007105-18 = "Эта огромная полоса берега осушается дважды в день, а потом океан снова накрывает её водой..."
1007105-19 = "С тех пор как мы приехали сюда, я наблюдаю за реками и океаном. На их фоне SRT кажется такой бессильной."
1007105-20 = ""
1007105-22 = ""
1007105-23 = "...Простите. Я заболталась."
1007105-24 = ""
1007105-26 = ""
1007105-27 = "Продолжим? Этот участок пляжа будет открыт недолго."
1007105-28 = "Смотрите под ноги. Тропа скользкая из-за накопившейся грязи."
1007105-32 = "Мы с Мияко пересекли осушенную приливную отмель и добрались до острова."
1007105-34 = "Ух ты... Здесь так же красиво, как я слышала."
1007105-35 = "Это настоящая нетронутая природа. Какие пышные деревья..."
1007105-36 = "Как настолько удалённый остров может быть таким красивым?"
1007105-37 = "Нет, наверное, именно из-за удалённости его красоту никто и не испортил."
1007105-38 = ""
1007105-40 = ""
1007105-41 = "Сенсей, не могли бы вы пройти со мной к тем скалам на берегу?"
1007105-42 = "Я хочу посмотреть, какие цветы там растут."
1007105-43 = "[s] «Конечно. Пойдём.»"
1007105-44 = "Ха-ха-ха... Какое приятное чувство. Такое хорошо освежает дух."
1007105-49 = "Но когда после осмотра цветов мы вернулись на пляж..."
1007105-54 = ""
1007105-55 = ""
1007105-56 = "Ах..."
1007105-57 = "[s] «Обратная дорога уже под водой...»"
1007105-58 = "Я так увлеклась цветами... что забыла про прилив."
1007105-59 = "Пешком выбраться уже не получится."
1007105-60 = "Простите, Сенсей. Я повела себя по-детски..."
1007105-61 = "[s5] «Не переживай.»\n[s6] «Ты не виновата, Мияко.»"
1007105-64 = "Но я даже не подумала взять запасной аккумулятор, потому что не ожидала, что мы задержимся здесь так надолго..."
1007105-65 = "До следующего отлива десять часов. Что нам делать?"
1007105-66 = "[s] «У меня всё равно сегодня не было планов.»"
1007105-68 = "[ns] «Давай считать это перерывом. Пока можем отдохнуть.»"
1007105-69 = ""
1007105-70 = "...Хорошо!"
1007105-73 = "Примерно час спустя..."
1007105-76 = "(Сенсей сказал мне расслабиться, но я не могу перестать смотреть на берег и ждать отлива...)"
1007105-77 = "(Пейзаж острова мне уже порядком надоел...)"
1007105-78 = "(Должно же быть что-нибудь, чем можно заняться...)"
1007105-79 = ""
1007105-82 = ""
1007105-83 = "А? Я почувствовала, как что-то шевельнулось в траве..."
1007105-84 = ""
1007105-86 = ""
1007105-87 = "На острове есть животные?"
1007105-88 = ""
1007105-95 = "Это..."
1007105-96 = "[ns] «Это кролик.»"
1007105-97 = "Кролик..."
1007105-98 = ""
1007105-105 = "О, ещё один. И ещё... Их тут десятки."
1007105-106 = ""
1007105-108 = ""
1007105-109 = "О, какие милые. И, похоже, нас они совсем не боятся."
1007105-110 = "Но откуда на таком удалённом острове столько кроликов?"
1007105-111 = "[s] «Может, они приплыли?»"
1007105-112 = "Не может быть. Кролики боятся воды."
1007105-113 = "Но этот остров слишком мал, чтобы поддерживать такую популяцию кроликов, и я не понимаю, зачем кому-то выпускать их сюда..."
1007105-114 = ""
1007105-116 = ""
1007105-117 = "Если предположить, то..."
1007105-118 = "...Может быть, они заблудились."
1007105-119 = "[s] «Почему ты так думаешь?»"
1007105-120 = "Наверное, во время отлива они пришли сюда, как и мы, а когда вода вернулась, оказались заперты на острове."
1007105-121 = "[s] «Но их же столько?»"
1007105-122 = "Ну, может быть..."
1007105-123 = "...Может, сначала было всего два кролика."
1007105-124 = "Хищников нет, травы полно — они, должно быть, обжились здесь, завели семью и заселили остров."
1007105-125 = "Когда они только сюда попали, им наверняка было очень одиноко. Но благодаря стараниям тех первых двоих теперь здесь настоящий кроличий рай."
1007105-126 = ""
1007105-128 = ""
1007105-130 = ""
1007105-131 = "Как те два кролика, которые, полагаясь друг на друга, создали собственный рай..."
1007105-132 = "Если бы у меня был партнёр, я бы не боялась ни одного незнакомого места."
1007105-134 = "Мы отлично провели время, ухаживая за кроликами, пока дорога по пляжу снова не открылась."
