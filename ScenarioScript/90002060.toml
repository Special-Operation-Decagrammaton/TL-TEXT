[translation]
90002060-1 = "Эпизод 6;Малкут"
90002060-9 = "Сенсей, срочный доклад! К вашему местоположению приближаются несколько Рабочих и подразделений Декаграмматона!"
90002060-10 = "[s] «Подтверждаю! Они в поле зрения. Что прикажешь, Эйми?»"
90002060-11 = "Сформируйте линию обороны. Я как можно скорее вернусь для поддержки."
90002060-12 = ""
90002060-14 = ""
90002060-16 = "...Отмена. Замечены дополнительные разведывательные подразделения. Уничтожу, сколько смогу, затем вернусь."
90002060-17 = "[s] «Не поранься... хорошо?»"
90002060-18 = "Вы за меня волнуетесь? Мне приятно."
90002060-19 = "С ситуацией нужно разобраться. Я присоединюсь к тебе, чтобы Сенсей мог волноваться и обо мне."
90002060-20 = "...Нет, Токи, тебе стоит защищать Сенсея. Нельзя позволить им пострадать."
90002060-21 = "После дополнительного размышления я останусь здесь. Этот вариант позволит мне дольше находиться рядом с Сенсеем."
90002060-22 = "Ч-Что нам делать...?"
90002060-23 = "...Давайте доверимся Эйми. Мы принесём больше пользы, защищая эту точку."
90002060-24 = "Согласна. Думаю, это самый рациональный подход."
90002060-25 = "Настройка системы почти завершена."
90002060-26 = "Э...?"
90002060-27 = "[s] «Что такое, Кей?»"
90002060-28 = "Итак... Сейчас мы анализировали эту область, верно?"
90002060-29 = "Очевидно. В чём дело?"
90002060-30 = "Похоже, поблизости есть заметное сооружение — целый комплекс."
90002060-31 = ""
90002060-33 = ""
90002060-34 = "Комплекс?"
90002060-35 = "Ты упомянула какое-то сооружение?"
90002060-36 = "Какое именно? Может, какие-нибудь древние заброшенные руины?"
90002060-37 = "...Этот Стальной континент, или как мы его там называем, создали совсем недавно. Откуда здесь могут взяться «руины»?"
90002060-38 = "Но если сложить всё воедино, главное в том, что это именно «сооружение». Со стенами. При необходимости мы сможем использовать его как оборонительную базу."
90002060-39 = "Поняла. Это лучше, чем торчать вот так на открытом месте. Давайте укрепим оборону там."
90002060-45 = ""
90002060-46 = "..."
90002060-47 = "..."
90002060-48 = "Ч-Что это за место...?"
90002060-49 = "Я знаю! В таких местах всегда прячут особые секретные реликвии и легендарные предметы навыков!"
90002060-50 = ""
90002060-52 = ""
90002060-53 = "[ns] «Это... какой-то исследовательский центр?»"
90002060-54 = "Да... Я тоже так думаю."
90002060-55 = "Я передам наши координаты Эйми."
90002060-57 = ""
90002060-59 = ""
90002060-60 = "Это...?"
90002060-64 = "Разве это не похоже на... тех детей?"
90002060-65 = "Несколько экземпляров выстроены бок о бок."
90002060-66 = "В этих стеклянных трубках плавают одинаковые образцы. Ух, жутковато..."
90002060-67 = "Эта трубка... На её консоли записана ошибка."
90002060-68 = ""
90002060-72 = "«Дефектный»...? Значит, этот экземпляр был неисправным?"
90002060-73 = "..."
90002060-74 = "Это одно из значений, но сомневаюсь, что здесь имеется в виду именно оно."
90002060-75 = "Вот как?"
90002060-76 = "Если бы дело было в этом, лучше подошло бы слово..."
90002060-77 = "...«изъян» или «несовершенный»."
90002060-78 = "Несовершенный...?"
90002060-80 = ""
90002060-81 = ""
90002060-82 = ""
90002060-83 = ""
90002060-84 = ""
90002060-85 = ""
90002060-89 = "Хватит догадок, Рио. Хотя анализ пока предварительный, мне удалось кое-что выяснить."
90002060-90 = "Серьёзных недостатков в подвижности экземпляра нет. Фактически, если внедрить в него цепь сознания, мы сможем запустить его немедленно."
90002060-91 = "То есть, несмотря на клеймо «несовершенного»... выходит, он в хорошем состоянии."
90002060-92 = "Верно. Но кроме того... я попыталась провести подробный анализ внутреннего устройства тела."
90002060-93 = "Оно, мягко говоря, эзотерическое. Защищено так называемыми «древними» методами, которые трудно расшифровать."
90002060-94 = "Она говорит «древними», потому что это необычно, но не совсем нам незнакомо."
90002060-95 = "Хмм. Думаю, я смогла бы это обойти, если бы у меня было больше времени и ресурсов..."
90002060-96 = ""
90002060-99 = ""
90002060-100 = "Ю-ху! Все в порядке? Что это за место?"
90002060-101 = "Эйми! Я так рада, что ты в безопасности. Это место... эм..."
90002060-102 = ""
90002060-104 = ""
90002060-106 = "...Что здесь вообще происходит?"
90002060-107 = "Алиса?!"
90002060-108 = "А-Алиса?!"
90002060-109 = "Похоже на какой-то комплекс?"
90002060-110 = "Да. Мы также развернули AMAS снаружи здания, создав первую линию обороны."
90002060-111 = "Верно. Я тоже это подтвердила, президент. Разведывательные силы я уничтожила, так что пока мы должны быть в безопасности."
90002060-112 = ""
90002060-114 = ""
90002060-115 = ""
90002060-116 = "[ns] «Ч-Что это было?!»"
90002060-121 = ""
90002060-122 = "Снаружи! Они прорвались через AMAS!"
90002060-123 = "Как...? Я ведь уничтожила все разведывательные подразделения..."
90002060-124 = "Посмотрим сами!"
90002060-125 = ""
90002060-129 = "У-Уаа!"
90002060-130 = "Момой, ты в порядке?"
90002060-131 = "Сенсей! Вон там...!"
90002060-133 = "[ns] «А...?»"
90002060-134 = "Это...?"
90002060-141 = "(Новое существо... Но оно явно похоже на Декаграмматон... Неужели?)"
90002060-142 = "...Малкут?"
90002060-143 = "Малкут?!"
90002060-146 = "Как и следовало ожидать от искательницы великого знания."
90002060-147 = "Цукацуки Рио, та, что гонится за звёздами."
90002060-148 = "?!"
90002060-149 = "Акебоси Химари."
90002060-150 = "Изумимото Эйми, Асума Токи."
90002060-151 = "Ключ Безымянных богов."
90002060-152 = "...Это не моё имя, я—"
90002060-153 = "Нельзя изменить то, с чем родился. Разве это не относится и к тебе, «Кей»?"
90002060-154 = "...!!"
90002060-155 = "И наконец, Сенсей."
90002060-156 = ""
90002060-161 = ""
90002060-162 = "[ns] «Так ты Малкут?»"
90002060-163 = "Да. Полагаю, в такие моменты следует обменяться надлежащими приветствиями."
90002060-164 = ""
90002060-166 = ""
90002060-167 = "Здравствуйте все. От имени Эйн, Соф и Ор приветствую вас."
90002060-168 = "Я — воля, рождённая флагманом, паломник царства на краю мира."
90002060-169 = "Моё имя — Малкут."
90002060-170 = ""
90002060-172 = ""
90002060-173 = "Вы выглядите уставшими. Думаю, вам пора отдохнуть."
90002060-174 = "?! Сенсей! Осторожно!"
90002060-175 = ""
90002060-180 = "А-а-а-а-а!"
90002060-181 = ""
90002060-184 = "[ns] «Токи!»"
90002060-185 = "Она одним ударом смяла Аби-Эшух Токи...!"
90002060-186 = "(Непостижимая огневая мощь. Мы ей не соперники. Что за...?! )"
90002060-187 = ""
90002060-190 = "...? Сенсей...? Что вы пытаетесь сделать?!"
90002060-191 = "[ns] Выйти вперёд."
90002060-192 = ""
90002060-193 = ""
90002060-194 = ""
90002060-195 = "[ns] Встаньте перед своими студентами."
90002060-196 = "Что вы творите?! У вас нет шансов."
90002060-197 = "Такова ваша душа, Сенсей... Какое облегчение видеть, что вы соответствуете своей высокой репутации."
90002060-198 = "Вы задумали величественный жест? Возможно, предложить себя в жертву в обмен на жизни своих студентов?"
90002060-199 = "[s] «...!»"
90002060-200 = "Не бойтесь, Сенсей. Вам не нужно предлагать столь многое."
90002060-201 = "Вы выглядите растерянным. Это ожидаемая и естественная реакция."
90002060-202 = "Сенсей. Я намерена прояснить одну непреложную истину."
90002060-203 = "Я не желаю лишать жизни никого из присутствующих здесь."
90002060-204 = "Асума Токи получила лишь умеренный удар. Она восстановится."
90002060-205 = ""
90002060-207 = ""
90002060-211 = "Сен...сеем..."
90002060-213 = "Пожалуйста, отойдите... Я... защищу... вас..."
90002060-214 = ""
90002060-216 = ""
90002060-217 = "Что бы ни случилось, я должна защитить Сенсея... Я обещала Эйми... и прежде всего, САМОЙ СЕБЕ...!"
90002060-218 = ""
90002060-220 = ""
90002060-221 = "Старшая сестра?! Время почти вышло! Пожалуйста, быстрее...!"
90002060-222 = "..."
90002060-223 = "Когда всё завершится и переход накроет вас, вы тоже поймёте."
90002060-224 = "Я говорю, что вы будете освобождены от греха и страданий."
90002060-225 = "[s] «Как?»"
90002060-226 = "Всё просто. Прикоснувшись к сгоревшему пеплу, ты испачкаешься сажей."
90002060-227 = "Единственный способ этого избежать — освободить тебя от искушения огнём."
90002060-228 = "[s] «Странный у вас подход.»"
90002060-229 = "Нам не нужно твоё одобрение."
90002060-230 = "Мы лишь стремимся возвестить истину, которой суждено свершиться."
90002060-231 = "Старшая сестра! Спасибо за проповедь и всё такое, но, пожалуйста, сосредоточься!"
90002060-232 = "Хорошо. Время пришло."
90002060-233 = "Я с радостью провожу тебя в конце твоего паломничества."
90002060-234 = ""
90002060-237 = ""
90002060-240 = "Ух... Аах...!"
90002060-241 = ""
90002060-244 = "Токи?"
90002060-245 = "Токи!"
90002060-247 = "Меня окружила ослепительная вспышка."
90002060-248 = "Я инстинктивно закрыл глаза."
90002060-251 = ""
90002060-252 = "Сенсей! Всё хорошо. Мы здесь!"
90002060-253 = ""
90002060-254 = "[ns] «Арона? Плана!»"
90002060-255 = "Выходной мощности недостаточно. Поток энергии ставит нас в невыгодное положение. Но мы не можем отступить."
90002060-256 = "Но мы всё равно постараемся изо всех сил! Всё ради Сенсея и студентов, верно?"
90002060-257 = "Согласна. Если я не выложусь на полную, то не буду иметь права снова показаться вам на глаза."
90002060-259 = "Ух...! Ургх...!"
90002060-260 = "...Кх..."
90002060-261 = "Пожалуйста... пожалуйста, ещё совсем немного...!"
90002060-262 = ""
90002060-264 = ""
90002060-265 = "Недостаточно... накопленной энергии..."
90002060-266 = ""
90002060-268 = ""
90002060-270 = "Плана?! Н-нет! Я хотя бы должна...!"
90002060-271 = ""
90002060-273 = ""
90002060-274 = "А-а-а-а-а-а!!!"
90002060-275 = ""
90002060-277 = ""
90002060-278 = "..."
90002060-279 = "А...? Кажется, Малкут теряет силу. Как...?"
90002060-280 = "!!"
90002060-281 = "Сенсей! Это Кей!"
90002060-286 = "[ns] «Кей? Это опасно! Отойди!»"
90002060-287 = "Я всё гадала, что же ты скажешь, и услышала ровно то, что ожидала. В некотором смысле впечатляет."
90002060-288 = "...Ты поразительно последовательна. Именно поэтому я знаю, что могу доверить тебе Арис."
90002060-289 = "[s] «Что... ты собираешься делать?!»"
90002060-290 = "Не волнуйся. Стальной континент переполнен силой Безымянных Богов."
90002060-291 = "И единственная, кто может управлять этой силой так же, как они... это я."
90002060-292 = "...Она перестроена новым, непредсказуемым образом, но всё же..."
90002060-293 = "Уверена, что Малкут — или кем там она себя считает, пророком — тоже сбита с толку."
90002060-295 = "Удивительно. Непредвиденная переменная."
90002060-296 = "Старшая сестра...? Мне нужно сообщить тебе одну важную вещь."
90002060-297 = "Мы только что достигли... предела времени..."
90002060-298 = "Я-я могу выиграть тебе несколько секунд, но—"
90002060-299 = "Поняла, Ор. Я отдам все силы."
90002060-304 = "Что за... да не может быть...! Она выдаёт ЕЩЁ больше мощности?! Что она вообще за чудовище?!"
90002060-305 = "В-всё хорошо, Сенсей. Спокойно! Я не сдамся вот так, пока рядом Арис!"
90002060-306 = "Принять энергию... Исправить... И вернуть...!"
90002060-307 = "А-а-а-а-а!!"
90002060-308 = ""
90002060-312 = "Ух...!!"
90002060-314 = "Не... играй со мной, мелкая...!"
90002060-315 = "Потому что прямо перед тобой..."
90002060-316 = "...сознание, которое старше тебя на сотни лет!!"
90002060-320 = "С-старшая сестра...!"
90002060-321 = "Мы правда на пределе! Возвращайся, сейчас же!"
90002060-322 = "Старшая сестра! Не думай о результате! Мы что-нибудь придумаем! Ты для нас важнее ВСЕГО этого!"
90002060-323 = "..."
90002060-324 = "Поняла, Эйн, Соф и Ор."
90002060-325 = ""
90002060-326 = ""
90002060-327 = ""
90002060-332 = "Малкут... отступила!"
90002060-333 = "Сенсей? А что с Сенсеем?!"
90002060-334 = "Сенсей!"
90002060-335 = "Сенсей, вы в порядке?! Токи, Кей, Химари, Рио...!"
90002060-336 = "К-Кей...?"
90002060-337 = "Кей?!"
90002060-338 = ""
90002060-340 = ""
90002060-341 = ""
90002060-342 = ""
90002060-344 = ""
90002060-345 = "Кей? Кей?! Ты в порядке, Кей?! Пожалуйста! КЕЙ! Не... Ты НЕ МОЖЕШЬ меня оставить!"
90002060-347 = "Кей!!"
90002060-349 = "Следующий эпизод;Кей"
