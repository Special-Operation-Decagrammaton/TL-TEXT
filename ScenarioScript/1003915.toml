[translation]
1003915-1 = "RABBIT 4 помнит"
1003915-2 = "Крыша здания возле города Коусаги"
1003915-3 = "Я пришёл на крышу указанного здания, чтобы помочь Мию с её заданием."
1003915-4 = ""
1003915-7 = "Было ещё раннее утро, и холодный ветер на крыше пробирал меня до костей."
1003915-8 = "Текущее время 08:30. Температура семь градусов Цельсия. Ветер двадцать узлов, с юго-запада..."
1003915-9 = "Цель «Танго Чарли» пока не обнаружена..."
1003915-10 = "[s1] «Не хочу отвлекать тебя, пока ты так сосредоточена...»\n[s2] «...Но какое животное ты ищешь?»"
1003915-13 = "О, С-Сенсей."
1003915-14 = "В-Видите ли..."
1003915-15 = "Мы получили просьбу от местных жителей устранить ворону, которая роется в мусорных баках в этом районе."
1003915-16 = "[s] «Ворону?»"
1003915-17 = "Д-Да. Говорят, местная ворона разрывает мусорные пакеты в поисках блестящих вещей, чтобы их украсть."
1003915-18 = "Проблема в том, что вороны о-очень умные. Их трудно поймать."
1003915-19 = "Они знают, как прятаться от оружия, и даже в какое время на улицах меньше людей и можно безопасно грабить мусор."
1003915-20 = "П-Поэтому я собираюсь весь день прятаться на этой крыше с транквилизаторным ружьём и попытаться поймать ворону живьём."
1003915-21 = "Учитывая всё это... Вы правда хотите ждать вместе со мной, Сенсей?"
1003915-22 = "На снайперских заданиях обычно приходится долго ждать... Мы не знаем, когда появится цель."
1003915-23 = "[s3] «Не беспокойся обо мне, всё нормально.»\n[s4] «Сидеть без дела — мой тайный талант.»"
1003915-26 = "Ну, если вы правда так думаете, мне спокойнее..."
1003915-27 = "Т-Тогда я продолжу наблюдение."
1003915-33 = "...Но холод становился только сильнее, и терпеть его было всё труднее."
1003915-36 = "[ns] «Уф...»"
1003915-37 = "С-Сенсей... Вам холодно?"
1003915-38 = "Вы всё это время дрожите."
1003915-39 = "[s5] «Я-я в порядке...»\n[s6] «А тебе НЕ холодно, Мию?»"
1003915-42 = "Я-я всегда была чувствительнее к жаре, чем к холоду..."
1003915-43 = "Мой маскировочный костюм тоже д-довольно толстый, так что он помогает."
1003915-44 = "[s7] «Мне нужно подвигаться, чтобы согреться.»\n[s8] «Схожу за горячим напитком в магазин.»"
1003915-47 = "Горячий напиток..."
1003915-48 = "П-Подождите, Сенсей. Минутку... У меня есть... Вот! Можете взять это."
1003915-49 = ""
1003915-51 = ""
1003915-54 = "Это горячее какао. Пожалуйста, угощайтесь."
1003915-55 = "Мы уже довольно долго здесь, но термос должен был сохранить его тёплым..."
1003915-59 = "[ns9] «М-м-м. Тёплое и приятное.»\n[ns10] «Ты меня спасла. Спасибо.»"
1003915-62 = ""
1003915-63 = "К-Конечно. Я очень рада, что смогла хоть чем-то помочь вам, Сенсей."
1003915-64 = "[s11] «Ты всегда берёшь этот термос на задания.»\n[s12] «Чтобы не мучила жажда?»"
1003915-67 = "Вообще-то снайперы стараются как можно меньше пить во время заданий."
1003915-68 = "Будет проблема, если мы потеряем цель из-за того, что пришлось отойти в туалет."
1003915-69 = "Поэтому до конца операции мы стараемся вообще ничего не пить, как бы ни хотелось."
1003915-70 = "[s] «Тогда зачем тебе термос?»"
1003915-71 = "Это... горячее какао приготовили мои товарищи по отряду."
1003915-72 = "Когда у нас задание в холодную погоду, они делают мне горячее какао или чай, чтобы я не мёрзла."
1003915-73 = "Так что во время задания я грею о термос руки."
1003915-74 = "Мне нравится, потому что кажется, будто мои товарищи по отряду рядом со мной, даже когда я одна."
1003915-75 = "[s] «Ты очень дорожишь своим отрядом.»"
1003915-76 = "...Конечно."
1003915-77 = "Ведь все вместе мы — отряд RABBIT!"
1003915-79 = "До конца задания мы передавали друг другу термос с горячим какао, согретым заботой отряда RABBIT."
