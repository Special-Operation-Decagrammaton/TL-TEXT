[translation]
2404-1 = "Ночь коротка — беги, девочка. Часть 2"
2404-2 = ""
2404-3 = ""
2404-4 = ""
2404-5 = ""
2404-6 = ""
2404-7 = ""
2404-9 = ""
2404-10 = ""
2404-11 = "*крадётся* *крадётся*"
2404-13 = "*подкрадывается* *подкрадывается*"
2404-14 = ""
2404-15 = "Ях! *топ* *топ* *топ*"
2404-16 = "[s1] «Эм, Каэдэ...?»\n[s2] «Что ты делаешь?»"
2404-17 = "Тс-с! Сенсей! Надо быть тише!"
2404-18 = "Тс-с! Сенсей! Надо быть тише!"
2404-19 = "Я тайно слежу за ними."
2404-20 = "Пора показать навыки, которые я отточила, играя в шпионов с Микури!"
2404-21 = "Стойте! Туда наступать нельзя, Сенсей!"
2404-22 = "[s] «Ч-Что происходит?»"
2404-23 = "Если наступите за линию — выйдете за границу."
2404-24 = "Там океан. И он полон акул!"
2404-25 = "И на саму линию тоже наступать нельзя!"
2404-26 = "Линии — это лава, так что если простоять на них больше десяти секунд, ногам станет слишком горячо и вы упадёте!"
2404-27 = "[s3] «Правила я понял, но это уже слишком!»\n[s4] «Правила на площадках Хяккияко — не шутка...»"
2404-28 = "Это же обычные правила, разве нет?"
2404-29 = "Это же обычные правила, разве нет?"
2404-30 = "Сенсей, вы гораздо более а-ма... ама-тунц, чем я думала!"
2404-31 = "[s5] «Вообще-то мне больше нравится тилапия...»\n[s6] «Ты хотел сказать — любитель?»"
2404-32 = "У нас нет времени! Так мы их потеряем. Быстрее за ними, Сенсей."
2404-33 = "У нас нет времени! Так мы их потеряем. Быстрее за ними, Сенсей."
2404-34 = "*прыгает*"
2404-35 = ""
2404-36 = ""
2404-37 = "[ns] «А куда делась идея тихо и незаметно за ними следить?»"
2404-40 = ""
2404-41 = ""
2404-42 = ""
2404-43 = ""
2404-44 = ""
2404-46 = ""
2404-47 = "Я чувствовала, что они только что обсуждали что-то важное."
2404-48 = "[s7] «А? Правда?»\n[s8] «По-моему, они просто болтали.»"
2404-49 = "Присмотритесь, Сенсей. Они стояли здесь, у перил. Вот так."
2404-50 = "Присмотритесь, Сенсей. Они стояли здесь, у перил. Вот так."
2404-51 = "И, увлечённые разговором, смотрели куда-то вдаль..."
2404-52 = "А-га! Я-я поняла, Сенсей! Кажется, знаю."
2404-53 = "[s] «Что именно?»"
2404-54 = "Почему Цубаки и Мимори серьёзно разговаривали, глядя на город."
2404-55 = "Наверняка, глядя на улицы, которые поклялись защищать, они укрепляли свою решимость как члены Клуба внутренней дисциплины!"
2404-56 = "[s] «Что?»"
2404-57 = "«Мы обязаны очистить эти улицы от злодейства...»"
2404-58 = "«Да. Будет нелегко, но мы своими руками защитим всех!»"
2404-59 = "Наверняка они говорили именно это."
2404-60 = "Прямо как в сёнэн-аниме, которое показывают каждое субботнее утро!"
2404-61 = "[s] «Эм...?»"
2404-62 = "Но почему тогда меня не взяли?"
2404-63 = "Надо проследить за ними ещё совсем немного. Я обязана узнать, чем они занимаются!"
2404-64 = "[s] «Если честно, Каэдэ, мне кажется, это просто недоразумение...»"
2404-65 = "Погнали! *топ* *топ* *топ*"
2404-66 = ""
2404-67 = ""
2404-68 = ""
2404-70 = ""
2404-71 = "Они и здесь проходили! Что они тут делали?!"
2404-72 = ""
2404-75 = "[ns9] «Уличные кошки?»\n[ns10] «Может, они подкармливали этих кошек.»"
2404-76 = "Наверняка это талисманы!"
2404-77 = "Наверняка это талисманы!"
2404-78 = "[s] «Погоди. Что?»"
2404-79 = "Они наверняка тайно тренируют талисманов, чтобы улучшить имидж Клуба внутренней дисциплины."
2404-80 = "Смотрите на них! Вот, вот так!"
2404-83 = "Они подходят всё ближе и... а-атакуют нас своей милотой!"
2404-84 = "Я думала, талисман Клуба внутренней дисциплины — это я! Разве меня недостаточно?!"
2404-85 = "А-а-а! Цубаки! Мимори!"
2404-86 = ""
2404-87 = ""
2404-88 = "[ns] «П-Погоди, Каэдэ!»"
2404-90 = "Я вместе с Каэдэ продолжил идти по следу Цубаки и Мимори, блуждая по всему Хяккияко от одного места к другому."
2404-91 = "И каждый раз..."
2404-92 = "Они только что проходили здесь! Тут наверняка есть какой-то секрет! Нужно расследовать!"
2404-93 = "*нюх* *нюх*"
2404-94 = "...?!"
2404-95 = ""
2404-96 = ""
2404-97 = "В этот раз я уверена. Так подсказывает мне моя блестящая дедукция!"
2404-98 = "Где-то здесь есть секрет, Сенсей."
2404-99 = "...!"
2404-100 = "...!"
2404-101 = ""
2404-102 = ""
2404-103 = "Казалось, прошла целая вечность, пока я бегал с энергичной Каэдэ от одного места к другому."
2404-104 = "И наконец..."
2404-106 = "[ns] «Они пошли сюда.»"
2404-107 = "Ага. Цубаки и... Мимори..."
2404-108 = "Куда же вы ушли... без меня...?"
2404-109 = "*хнычет*"
2404-110 = "[s] «Думаю, пора домой, Каэдэ.»"
2404-111 = "Нет, Сенсей..."
2404-112 = "Если я сама не выясню правду, тогда..."
2404-113 = "...я останусь единственной участницей Клуба внутренней дисциплины, которая..."
2404-114 = ""
2404-115 = ""
2404-117 = "А?"
2404-118 = "Ты сейчас в меня врезалась? Драки захотела?!"
2404-119 = "Пошли!"
2404-121 = "Но я не специально..."
2404-122 = "[s] «Давайте все успокоимся.»"
2404-124 = "Тц! Не лезь, посторонний!"
2404-125 = "Не твоё дело!"
2404-126 = "Я как раз сегодня купила целую кучу шкур цучиноко. А потом оказалось, что эта мошенница продала мне сброшенные шкурки цикад, так что я сегодня в бешенстве!"
2404-127 = "В ярости!"
2404-128 = "[s] «Не понимаю, какое отношение это имеет к нам.»"
2404-129 = "А такое, что я сейчас сорву на вас злость!"
2404-130 = "Ага, на вас!"
2404-132 = "Что?!"
2404-133 = "Советую вам успокоиться."
2404-134 = "Все, прекратите немедленно!"
2404-135 = ""
2404-136 = "А? Вы ещё кто?!"
2404-137 = "Ага, вы вообще кто такие?!"
2404-138 = ""
2404-140 = ""
2404-141 = "Цубаки? Мимори?"
2404-142 = "С чего вы решили, что можете так цепляться к нашей младшей?"
2404-143 = "Если решите перейти к насилию, мы просто смотреть не станем."
2404-144 = "Я не боюсь! Давайте!"
2404-145 = "Ага, давайте!"
2404-146 = ""
2404-147 = ""
2404-153 = "Ч-Чёрт! Это ещё не конец!"
2404-154 = ""
2404-156 = "Н-Не бросай меня!"
2404-157 = ""
2404-158 = ""
2404-159 = ""
2404-160 = "В-Ва... Ва...!"
2404-161 = "[s] «Ва?»"
2404-162 = "А-а-а! Цубаки! Мимори!"
2404-163 = ""
2404-165 = ""
2404-166 = ""
2404-167 = ""
2404-168 = "Всё хорошо, Каэдэ. Задиры ушли."
2404-169 = "Что привело вас двоих сюда, Сенсей?"
2404-170 = "[s] «Ну, дело в том...»"
2404-171 = "Вы двое всё время уходите без меня! Поэтому я за вами и проследила!"
2404-172 = "Хм?"
2404-173 = "А?"
2404-175 = "Тогда я объяснил им обеим, как всё дошло до этого."
2404-177 = "О, но вообще-то..."
2404-178 = "А? Но..."
2404-179 = "Я ведь была права, да? Вы вдвоём защищали город без меня!"
2404-180 = "Не совсем. Мы просто проводим обычный обход объектов."
2404-181 = "По ночам мы обходим улицы Хяккияко, проверяя повреждённые места и опасно запущенные объекты."
2404-182 = "[s] «Обслуживание объектов...»"
2404-183 = "Н-Но! А коты?!"
2404-184 = "Эти уличные коты — новые талисманы Клуба внутренней дисциплины, да?! Потому что они милее меня?!"
2404-185 = "А, эти? Мы уже какое-то время за ними присматриваем."
2404-186 = "Да, каждую ночь заходим покормить их и убедиться, что они здоровы."
2404-187 = "Н-Но... почему вы делаете всё это без меня?"
2404-188 = "Потому что я новенькая и слишком неопытная, чтобы быть вам полезной?! Вааа!"
2404-189 = "Ну, потому что..."
2404-190 = "Я могу ответить, Каэдэ."
2404-191 = "*шмыг* Можешь...?"
2404-192 = "Мы раньше спрашивали, не хочешь ли ты ходить с нами на ночные патрули."
2404-193 = "А ты сказала идти без тебя, потому что слишком хочешь спать. Помнишь?"
2404-194 = "..."
2404-196 = "А?"
2404-197 = "[s] «Я так и думал.»"
2404-198 = "Это всё равно добровольная клубная активность, поэтому заставлять тебя мы не можем."
2404-199 = "И мы понимаем, что выходить каждую ночь может быть тяжело."
2404-200 = "Лично я сейчас как раз в лучшей форме. Видишь? Полностью бодра и готова ко всему."
2404-201 = "Да, ты всегда была совой, Цубаки. Хи-хи."
2404-202 = "[s] «Вот почему она сейчас такая бодрая.»"
2404-203 = "Эм. Значит, вы ходили без меня потому, что..."
2404-204 = "Да, потому что ты сама так хотела."
2404-205 = "Мы понятия не имели, что ты пожалела о своём решении. Прости, Каэдэ."
2404-206 = "Мы не хотели, чтобы тебе было так одиноко."
2404-207 = "И я прошу прощения. Если ты этого хочешь, больше оставлять тебя одну не будем. Отныне будем будить и брать с собой."
2404-208 = "Эм... каждый раз?"
2404-209 = "А-а разве не лучше, если хотя бы одна из нас будет высыпаться? Чтобы кто-то был отдохнувшим?"
2404-210 = "Пф."
2404-211 = "Хи-хи-хи."
2404-212 = "[s] «Ну что, теперь всё прояснилось?»"
2404-213 = "Д-Да. Вы всё время были правы, Сенсей! Это просто большое недоразумение, и я зря переживала. Они просто старались обо мне позаботиться!"
2404-214 = "Хе. Хи-хи!"
2404-215 = "Но, Каэдэ?"
2404-216 = "Да? Что такое, Мимори?"
2404-217 = "То, что ты так поздно ночью здесь с Сенсеем и всё ещё не спишь, может означать только..."
2404-218 = "Каэдэ! Ты пила кофе после того, как я тебе запретила?!"
2404-219 = "А..."
2404-220 = "Я, эм...!"
2404-221 = "У тебя и так проблемы со сном, Каэдэ. Зачем ты пила кофе?"
2404-222 = "А-Ай!"
2404-223 = ""
2404-224 = "И вы тоже, Сенсей! Могли бы думать головой!"
2404-225 = "[s] «А меня-то за что ругают?!»"
2404-227 = "Тут без долгой лекции не обойтись."
2404-228 = "На этот раз тебе не отвертеться!"
2404-229 = "Вааа! Сенсей, помогите!"
2404-231 = "Так недоразумение между участницами Клуба внутренней дисциплины разрешилось, и все стали ещё ближе."
2404-232 = "Отпразднуем. Отпразднуем."
2404-233 = "Тут нечего праздновать!"
2404-234 = "Ночь коротка — беги, девочка."
