[translation]
1012106-1 = "Летнее море, ночная Юкари"
1012106-2 = "Выйдя из магазина, я заметил знакомую фигуру."
1012106-3 = ""
1012106-6 = "А, Сенсей?"
1012106-7 = "Что привело вас сюда? О! Вижу, вы купили... весьма необычный набор продуктов."
1012106-8 = "Нет. Вы мне совсем не мешаете. Наоборот, я очень рада вас видеть."
1012106-9 = "Я... Я просто смотрела на море. И слушала его тоже."
1012106-10 = "Днём здесь было так шумно и весело. А сейчас... всё совсем наоборот."
1012106-11 = "Раз эта тишина кажется мне одинокой, значит, я изменилась."
1012106-12 = ""
1012106-15 = "До встречи с вами такое уединение было для меня естественным. Я ничего другого и не знала."
1012106-16 = "..."
1012106-17 = ""
1012106-19 = ""
1012106-20 = "Хм-м, хм-м! ♪"
1012106-21 = "Юкари — непотопляемый корабль! Плывёт куда пожелает! ♪"
1012106-22 = "[ns1] «(Она решила петь именно сейчас...?!)»\n[ns2] «(Маршрут, мягко говоря, не лучший...)»"
1012106-25 = "Даже на воде ты будешь держаться над гладью, изящная, словно лотос. Леди никогда не должна позорить семью мокрой одеждой и промокшими волосами."
1012106-26 = "Так меня учили с самого детства."
1012106-27 = "Но сегодня, ха-ха! Я промочила одежду и даже испортила макияж! И мне было всё равно! Я прыгнула в море!"
1012106-28 = "Если бы моя сопровождающая это увидела, она бы, наверное, упала в обморок от потрясения!"
1012106-29 = "[ns3] «Тебе сегодня было весело?»\n[ns4] «Оно того стоило?»"
1012106-30 = "Несомненно! Мне было невероятно весело!"
1012106-31 = "Сенсей, вы всегда показываете мне новые прекрасные стороны самых обычных вещей."
1012106-32 = "Пусть у меня, Юкари, и осталось несколько свежих сожалений..."
1012106-33 = "...я чудесно провела время. И вы ведь согласитесь, что именно это важнее всего, правда, Сенсей? Хи-хи."
1012106-34 = "И... я открою вам один секрет. Даже мои слуги о нём не знают."
1012106-35 = ""
1012106-37 = ""
1012106-38 = ""
1012106-39 = "Я солгала. На самом деле я и раньше мочила одежду в море."
1012106-40 = "Когда мы бывали на нашем частном пляже, я смотрела в прозрачную воду и опускала туда ноги, пока никто не видел."
1012106-41 = "В каком-то смысле мне даже нравились мокрые носки. Так я по-своему наслаждалась летним морем."
1012106-43 = "Некоторое время мы смотрели на ночное море."
1012106-44 = ""
1012106-48 = "Ах!"
1012106-49 = "[ns] «Что случилось, Юкари?!»"
1012106-50 = "Я была так счастлива... что совсем забыла о времени."
1012106-51 = "Вы ведь шли домой, пока я вас не отвлекла."
1012106-52 = "Из моего пакета потекло растаявшее мороженое..."
1012106-53 = "Сенсей, вам нужно идти. Пожалуйста, возвращайтесь к своим делам!"
1012106-54 = "[s5] «Нет, уже поздно...»\n[s6] «Моё эскимо Моримори уже покинуло этот мир...»"
1012106-57 = "Ох... И всё потому, что мы случайно встретились."
1012106-58 = "[s7] «Ничего страшного...»\n[s8] «Может, прогуляемся вместе?»"
1012106-61 = "...!"
1012106-62 = ""
1012106-64 = ""
1012106-65 = ""
1012106-66 = "Да! Ведите!"
1012106-68 = "После этого мы с Юкари прогулялись по ночному рынку у пирса и попробовали множество вкусных закусок."
