[translation]
10028045-2 = ""
10028045-3 = "*тяжело дышит*... *тяжело дышит*"
10028045-4 = ""
10028045-5 = "*тяжело дышит*... *тяжело дышит*..."
10028045-6 = "...Мы победили..."
10028045-7 = ""
10028045-8 = "Ух, а теперь слушайте сюда. Кто-нибудь лучше объясните мне, что здесь происходит."
10028045-9 = "Почему этот поезд превратился в настоящую зону боевых действий? Что здесь делала эта артиллерийская установка для подавления беспорядков?!"
10028045-10 = "[s1] «Спасибо, Иори. Ты меня спасла.»\n[s2] «Как и ожидалось от Иори! Я знал, что могу на тебя положиться!»"
10028045-13 = "Замолчите! С вами тоже ещё не всё, Сенсей! Вы пойдёте со мной в штаб Дисциплинарного комитета и объясните ВСЁ."
10028045-14 = "...А?"
10028045-15 = "...Что вы сейчас сказали?"
10028045-16 = "Вы... Вы сейчас слишком заняты?! В следующий раз?"
10028045-17 = "Да у меня сейчас сосуд в голове лопнет! Что вообще может быть важнее?!"
10028045-18 = "И Касуми!!!"
10028045-19 = "Хм? Кто? Я?"
10028045-20 = "Ты что-то сказала? Я не слушала... Я ведь не в беде, да?"
10028045-21 = "Конечно, в беде! Ты правда думала, что сможешь просто уйти после того, как я тебя нашла?!"
10028045-22 = "Ты и каждый преступник здесь пойдёте со мной! Сопротивляться не в ваших интересах."
10028045-23 = "А тебя я особенно запру в тюрьме, которой управляет сам Дисциплинарный комитет!"
10028045-24 = "М-Меня? Ох, боже. И что же я сегодня сделала, чтобы заслужить такое обращение?"
10028045-25 = "Может, это из-за чего-то, что я натворила в прошлом...? Хм..."
10028045-26 = "...Простите?"
10028045-27 = ""
10028045-29 = ""
10028045-30 = "Да ладно..."
10028045-31 = "...Хаха. А вот и нет!"
10028045-32 = "Так или иначе, вернёмся к теме. Эта особая тюрьма — та, что в подвале Дисциплинарного комитета? Там бесплатно кормят? Медстраховка есть?"
10028045-33 = "П-П-Подожди. Вообще-то. Эм... Сегодня..."
10028045-34 = ""
10028045-36 = ""
10028045-37 = ""
10028045-38 = "П-П-Президент Хина сегодня д-дежурит... разве нет?"
10028045-39 = "С чего ты вдруг спрашиваешь про председателя? Не знаю, наверное?"
10028045-40 = "М-м. Хм. Ух!"
10028045-41 = "Э-Эм... Иори, давай это обсудим..."
10028045-42 = "Ты же меня знаешь. Я всех люблю. Я могу поладить с кем угодно в Кивотосе."
10028045-43 = "Но... ну... Президент Хина — совсем другое дело. Мы с ней как масло и вода!"
10028045-44 = "Так что, эм, ну, понимаешь, к чему я веду..."
10028045-45 = "Может, закроешь на это глаза? Всего один раз!"
10028045-46 = "Кто угодно, только не Президент Хина! Прошу! В следующий раз, когда ты будешь дежурить, Иори, я сама пойду с тобой прямиком в тюрьму!"
10028045-47 = "Что ты вообще несёшь?! Какая разница, кто дежурит?"
10028045-49 = ""
10028045-50 = "Вообще-то довольно приятно смотреть, как она мечется."
10028045-51 = "Похоже, глава Дисциплинарного комитета Геенны полностью оправдывает свою репутацию."
10028045-52 = "[s3] «Нет, Хина на самом деле не такая.»\n[s4] «А наблюдать и правда приятно. Согласен.»"
10028045-55 = ""
10028045-56 = "Эм..."
10028045-57 = "Эй! Надеюсь, вы двое понимаете, что это касается и вас!"
10028045-58 = "Вас действительно устраивает, что вас увезут аж в Геенну на допрос?"
10028045-59 = "Вы всё ещё думаете, что успеете вернуться в Тринити вовремя?"
10028045-61 = "Хм?"
10028045-62 = "О, нет-нет. Я вообще не имею к тебе отношения..."
10028045-64 = "Ты виновна уже потому, что находишься рядом с ней! Ты тоже обязана пойти с нами!"
10028045-65 = "Ты не арестована, но нам нужны твои показания. До тех пор о Тринити можешь забыть!"
10028045-66 = "Хи-хи. Я ведь говорила, что мы с Иори давно знакомы? Я знала, что она именно так и отреагирует!"
10028045-67 = ""
10028045-69 = ""
10028045-70 = "Но, дорогая Иори?"
10028045-71 = "Ты уверена, что не хочешь ещё раз подумать над тем, что только что сказала?"
10028045-72 = "Хотя, если уж произнесла это вслух, назад слова особо не заберёшь..."
10028045-73 = "Простите?"
10028045-74 = "Что за бессмыслица сейчас льётся из твоего рта?"
10028045-75 = "Ох-ох. Похоже, моя мудрость слишком сложна для твоего понимания."
10028045-76 = "Оцени-ка ситуацию, подруга моя."
10028045-77 = "Члены Дисциплинарного комитета выглядят довольно уставшими! Всё-таки сражаться с артиллерийской установкой подавления беспорядков — тяжёлая работа."
10028045-78 = "А после этого ты ещё и сделала такое смелое заявление!"
10028045-79 = "Как там было? Я и «каждый преступник здесь» пойдём с тобой?"
10028045-80 = "А как насчёт..."
10028045-81 = "[s] «...»"
10028045-82 = "...Ах."
10028045-83 = "[s5] «Контингент здесь...»\n[s6] «Похоже, этим ты разозлила вообще всех в этом поезде.»"
10028045-86 = ""
10028045-87 = "Вахахаха!"
10028045-88 = "Иори! Ну до чего же ты милая!"
10028045-89 = "Теперь поняла? Пассажиры этого поезда..."
10028045-90 = "Почти каждый из них..."
10028045-91 = "...те самые преступники, которых ты так смело пообещала арестовать."
10028045-93 = "...А?"
10028045-94 = ""
10028045-96 = ""
10028045-97 = ""
10028045-98 = ""
10028045-99 = ""
10028045-102 = ""
10028045-104 = ""
10028045-105 = ""
10028045-106 = "Может, ты и из Дисциплинарного комитета, но реально собираешься забрать нас всех?"
10028045-107 = "Ты вообще кем себя возомнила, а?!"
10028045-108 = "Да это же та самая заноза с хвостиками из Дисциплинарного комитета, которая вечно нам мешает!"
10028045-109 = ""
10028045-110 = "Идеальный момент для небольшой кармической расплаты! Оружие к бою!"
10028045-111 = "У меня кровь всё ещё кипит, хочу ещё подраться!"
10028045-112 = "Мы можем всей толпой навалиться на Дисциплинарный комитет? Такой шанс раз в жизни выпадает!"
10028045-113 = ""
10028045-114 = "...Ах."
10028045-115 = "Вот незадача..."
10028045-116 = ""
10028045-117 = "...Ну-ну."
10028045-118 = "Думаю, теперь все понимают ситуацию, да?"
10028045-119 = "Я бы сказала, силы вполне равны. Все здесь против Дисциплинарного комитета Иори."
10028045-120 = "Все здесь?! Да ты вообще не понимаешь, о чём говоришь!"
10028045-121 = "Сенсей, может, и странный, непостижимый извращенец, но ты правда думаешь, что они встанут на твою сторону?! Ты бредишь!"
10028045-122 = "Сенсей — наш учитель, а ты разыскиваемая преступница! С чего им вставать на сторону преступницы, а не на нашу?!"
10028045-123 = "Сенсей всегда выбирает правильную сторону!"
10028045-124 = "П-Правда ведь, Сенсей? Вы поддержите нас, да?"
10028045-125 = ""
10028045-126 = "Разве ты только что не угрожала утащить Сенсея на допрос...?"
10028045-127 = "Хм..."
10028045-128 = "Для тебя всё чёрное или белое. Добро против зла."
10028045-129 = ""
10028045-131 = ""
10028045-132 = "Но... Иори?"
10028045-133 = "Хочешь узнать одну из моих любимых вещей в жизни?"
10028045-134 = ""
10028045-136 = ""
10028045-137 = ""
10028045-138 = ""
10028045-139 = ""
10028045-140 = ""
10028045-141 = ""
10028045-142 = "Между ними есть ещё целая куча оттенков серого."
10028045-143 = "[s9] «Сумка?!»\n[s10] «Как она у тебя оказалась?!»"
10028045-146 = "...Почему моя сумка сейчас у тебя в руках?"
10028045-147 = "Вахахаха! А вот и главный сюрприз!"
10028045-148 = "Разве я не говорила, что мы в трёх вагонах от головы состава? Значит, следующий — багажный!"
10028045-149 = "Вам не повезло, ребята, но я не идиотка! Я прекрасно понимала, чем всё закончится, если здесь появится Иори. Вы правда думали, что я буду просто сидеть сложа руки?"
10028045-150 = "Пока вы все играли в войнушку с артиллерийской установкой подавления беспорядков, я быстренько прогулялась по багажному вагону."
10028045-151 = "И надо же! Совершенно случайно наткнулась на эту сумку с эмблемой Тринити! Вахаха!"
10028045-152 = "Не понимаю. Зачем тебе вообще понадобилось её красть?"
10028045-153 = "А как же твоё «я всегда держу слово»? Это всё с самого начала было частью плана?"
10028045-154 = "...А? Ты о чём? Конечно нет."
10028045-155 = "Разве я хоть раз нарушила своё слово? А?"
10028045-156 = "В чём состоял наш уговор? Я помогаю тебе найти сумку, верно? Ну вот! Я нашла сумку! И кто сказал, что я не собираюсь её отдавать?"
10028045-157 = "Я не сделала ничего, что нарушало бы наше соглашение."
10028045-158 = "Я всегда держу слово. Президентская гарантия."
10028045-159 = "Не переживай! Скоро она будет целой и невредимой у тебя в руках."
10028045-160 = ""
10028045-162 = ""
10028045-163 = "...Но."
10028045-164 = "...Прежде чем это случится."
10028045-165 = "Она будет моей страховкой, чтобы и ты выполнила свою часть договора."
10028045-166 = "Доверие ведь работает в обе стороны, не так ли? М-м-м?"
10028045-167 = "Ну? Я хоть в чём-то ошиблась?"
10028045-168 = "Мисс Милашка?"
10028045-169 = ""
10028045-171 = ""
10028045-172 = "..."
10028045-173 = "...Хи-хи."
10028045-174 = "Поистине непробиваемая. А теперь вернёмся к текущей ситуации."
10028045-175 = "У тебя правда есть время сидеть и спорить о формулировках? Если хочешь вернуться до конца дня, время-то идёт!"
10028045-176 = "Что ж..."
10028045-177 = "..."
10028045-178 = ""
10028045-180 = ""
10028045-182 = ""
10028045-183 = "Думаю, теперь ты понимаешь, что делать, да?"
