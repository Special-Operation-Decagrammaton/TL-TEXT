[translation]
83306040100-5 = ""
83306040100-6 = "Ух, у-у... Аргх... Что же делать..."
83306040100-7 = "Хм? Что-то случилось?"
83306040100-8 = "Г-глава префектов?! Что вы здесь делаете?!"
83306040100-9 = "Я патрулировала район на случай непредвиденных происшествий."
83306040100-10 = "Так что спрашиваю ещё раз... Что случилось?"
83306040100-11 = "Д-дело в том..."
83306040100-12 = "П-простите! Я задремала... а когда проснулась, главы Отдела горячих источников уже не было!"
83306040100-13 = "Простите! Из-за моей халатности сбежала важная заключённая...!"
83306040100-14 = "Меня не интересует, кто виноват. Главное — немедленно решить проблему."
83306040100-15 = "Г-глава Префектов...!"
83306040100-16 = "...Мы имеем дело с Отделом горячих источников. Здесь всё может взорваться в буквальном смысле за секунду."
83306040100-17 = "Сначала помоги мне осмотреть место."
