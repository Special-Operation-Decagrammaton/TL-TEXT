[translation]
80000001-1 = "Испытание Момоки"
80000001-2 = "Приёмная Генерального Студенческого Совета"
80000001-4 = "Добравшись до офиса Генерального ученического совета, я оказался втянут в заполнение документов для Шале."
80000001-5 = "*хрум* М-м-м. Сегодня чипсы особенно вкусные."
80000001-6 = "Вот бы к ним ещё какое-нибудь развлечение..."
80000001-7 = "[s] «...»"
80000001-8 = "Что? Чего ты на меня так смотришь?"
80000001-9 = "Можешь строить щенячьи глазки сколько хочешь.#nЯ не стану помогать тебе с этой работой."
80000001-10 = "Не видишь, я чипсы ем? *хрум*"
80000001-11 = "[s] «Кстати, об этих чипсах...»"
80000001-12 = "Что? Хочешь немного?"
80000001-13 = "А вот и нет! У меня строгая политика: ни с кем не делиться!"
80000001-14 = "А? Хочешь знать, почему я ем только чипсы со вкусом тарако?"
80000001-15 = "Что за вопрос? Потому что они лучшие, очевидно.#n*хрум*"
80000001-16 = "Я влюбилась в них с первого укуса, когда попробовала свой первый пакет."
80000001-17 = "Ровно столько соли, сколько нужно, неповторимый вкус тарако,#nи идеальный хруст..."
80000001-18 = "Я в жизни не пробовала ничего совершеннее."
80000001-19 = "Так зачем мучиться и пробовать другие чипсы?#nНе хочу портить себе вкус."
80000001-20 = "[s] «Но вдруг тебе понравятся и другие вкусы не меньше?»"
80000001-21 = "Думаешь? Ну, наверное, правда, что я не пробовала новинки, которые вышли совсем недавно..."
80000001-22 = ""
80000001-24 = ""
80000001-25 = ""
80000001-27 = "Кстати. Мне бесплатно дали пакет этих шоколадных чипсов в рамках какой-то акции ко Дню святого Валентина."
80000001-28 = "Наверное, ничего страшного, если попробую."
80000001-29 = "*глубокий вдох* *хрум*"
80000001-30 = ""
80000001-32 = "..."
80000001-33 = ""
80000001-34 = "Фу. Кому вообще нужны сладкие чипсы?"
80000001-35 = "[s] «Ну, они же ШОКОЛАДНЫЕ...»"
80000001-36 = "Чипсы должны быть солёными и сытными!"
80000001-37 = "Ладно бы кисло-сладкими или сладко-солёными,#nно этот шоколадный вкус — неприемлем!"
80000001-38 = "Я просто их выброшу."
80000001-39 = ""
80000001-41 = ""
80000001-42 = "Хотя как-то жалко, это же расточительство..."
80000001-43 = ""
80000001-44 = "Эй, Сенсей. Спорю, на День святого Валентина тебе никто шоколад не подарил, да?"
80000001-45 = ""
80000001-47 = ""
80000001-48 = "Вот. Забирай!"
80000001-49 = "[s] «Но ты только что выбросила их в мусорку!»"
80000001-50 = "Да ладно, не стесняйся. Бери."
80000001-51 = "Это подарок от меня тебе!"
80000001-52 = "А взамен в следующий раз, когда придёшь, принеси мне ящик чипсов со вкусом тарако."
80000001-53 = "Буду ждать."
