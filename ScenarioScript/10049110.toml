[translation]
10049110-1 = "Послесловие;Как ты?"
10049110-4 = "А теперь к другим новостям..."
10049110-5 = "...Сегодня в Парке развлечений Пограничья, расположенном на границе Тринити и Геенны, прошло специальное мероприятие."
10049110-6 = "«Спецвыпуск „Волшебницы Тяжёлого Калибра“», проходивший все выходные, завершился сногсшибательным живым выступлением."
10049110-7 = "После впечатляющего и захватывающего финала фанаты строят догадки о личностях актёров."
10049110-8 = "Мы обратились за комментарием, но парк развлечений ответил лишь: «Мы не можем раскрыть эту информацию из соображений конфиденциальности. Но ждите нашего следующего мероприятия.»"
10049110-9 = "Также ходят слухи, что режиссёром шоу мог быть Сенсей из Шале. Шале пока не ответило на наши запросы по этому поводу."
10049110-10 = "Дальше..."
10049110-11 = "Генеральный ученический совет предложил законопроект о наказании за контрафактную продукцию и ложную рекламу..."
10049110-12 = ""
10049110-13 = "А? И всё?"
10049110-14 = "Могли бы сказать: «Белая была крутой», или «Розовая была милой», или «Эра была страшной!»"
10049110-15 = "На самом деле, думаю, так даже лучше, Рейса."
10049110-16 = "Произошёл инцидент, люди могли оказаться в опасности, мы тихо со всем разобрались, никто не пострадал, незачем всем знать подробности."
10049110-17 = "Наверное, ты права. Личности волшебниц ведь должны оставаться в тайне!"
10049110-18 = "Значит, знаменитой волшебницей мне не стать, но я всегда могу быть суперзвездой Отряда линчевателей!"
10049110-19 = "Я когда-нибудь говорила, что мне нравится твой энтузиазм?"
10049110-20 = "А, привет вам обеим."
10049110-21 = "Ого, когда я вас в последний раз видела?"
10049110-22 = "Три дня назад."
10049110-23 = "...Ты устала или что, Шимико?"
10049110-24 = "Нет, просто пробую шутить."
10049110-25 = "Твоя первая шутка?"
10049110-26 = "Ну, почти. Я только начала книгу «Как заставить друзей валяться от смеха», и..."
10049110-27 = "...пока я только на первой главе. Но, думаю, закончу довольно быстро."
10049110-28 = "Ты правда выкладываешься во всём, за что берёшься."
10049110-29 = "Ну, говорят же сначала читать инструкцию, да? Большинство книг в каком-то смысле инструкции."
10049110-30 = "То есть ты изучала, как стать злой офицершей?"
10049110-31 = "...Насколько позволило время."
10049110-32 = "Я раньше почти не смотрела шоу про волшебниц, но спасибо за рекомендацию, Рейса. Мне понравилось."
10049110-33 = "Я тоже продолжаю смотреть."
10049110-34 = "Вчера закончила 7 серию 3 сезона. Теперь история с розовым костюмом действительно имеет смысл."
10049110-35 = "К тому же в сюжете много говорится о справедливости."
10049110-36 = "Хи-хи!!!"
10049110-37 = "Недавно вышел фильм! «Тяжёлый Калибр: Сломанная стрела». Он очень хороший!"
10049110-38 = "Если захотите посмотреть вместе, я могу всё объяснять по ходу!"
10049110-40 = "Звучит неплохо. И если когда-нибудь станет скучно, заходи в библиотеку."
10049110-43 = ""
10049110-44 = "Сегодня приятный, тихий патруль."
10049110-45 = "Мы столкнулись лишь с обычными мелкими проблемами. В целом всё очень спокойно."
10049110-46 = "Ага. Знаешь, мне всегда нравится быть здесь с тобой, Сузуми."
10049110-47 = "Я обожаю, когда ты помогаешь людям и они тебя благодарят! Ты всегда делаешь такое крутое лицо!"
10049110-48 = "И этот район мне тоже нравится, потому что именно ты его защищаешь!"
10049110-49 = "Я делаю крутое лицо? Не замечала."
10049110-50 = "Спасибо, что говорите это."
10049110-51 = ""
10049110-53 = ""
10049110-54 = "..."
10049110-55 = "Ты ведь... на самом деле не уйдёшь из Отряда линчевателей, правда?"
10049110-56 = ""
10049110-58 = ""
10049110-59 = ""
10049110-60 = "Фу-фу..."
10049110-61 = "Сузуми?"
10049110-62 = "Ни за что. Не после всего, что ты мне сказала."
10049110-63 = "Я продолжу, потому что могу."
10049110-64 = ""
10049110-66 = ""
10049110-67 = ""
10049110-68 = "А-а, я сыта. Так сыта..."
10049110-69 = "Подождите меня, капитан!"
10049110-70 = "Ух, кажется, я переела..."
10049110-71 = "Надо есть, когда есть возможность!"
10049110-72 = ""
10049110-74 = ""
10049110-75 = "Ц, опять те чудики...!"
10049110-76 = "Мы сейчас вообще НИЧЕГО плохого не делаем!!"
10049110-77 = "Если заставите нас драться, клянусь, у меня живот лопнет..."
10049110-78 = "Я и не говорила, что вы делаете что-то плохое."
10049110-79 = "...Спасибо за вашу работу в прошлые выходные."
10049110-80 = "Жаль, что вы не получили награду."
10049110-81 = "Хотя было довольно круто смотреть, как она после взрыва улетела ракетой."
10049110-82 = "Ну, как бы там ни было, мы предотвратили более серьёзный инцидент. Искренне спасибо за помощь."
10049110-83 = "Ну, я не то чтобы СПЕЦИАЛЬНО помогала. Ты ведь сначала охотилась за МНОЙ, помнишь."
10049110-84 = "Но ладно. По крайней мере, в итоге мы получили барбекю."
10049110-85 = "Барбекю?!"
10049110-86 = "За счёт Сенсея. Ему было неловко, что мы упустили награду."
10049110-87 = "И мы съели СТОЛЬКО всего."
10049110-88 = "Думаю, Сенсею стало ещё хуже, когда он увидел счёт..."
10049110-89 = "Ну, тогда рада, что всё закончилось хорошо."
10049110-90 = "Линчевательница и бандитка в шлеме работают вместе. Никогда не думала, что увижу такое."
10049110-91 = "Фух, кстати, напиток тоже был вкусный."
10049110-92 = "Хоп!"
10049110-93 = ""
10049110-96 = "Ц, почти! Совсем ЧУТЬ-ЧУТЬ не попала в урну."
10049110-97 = "Это был бы трёхочковый, капитан."
10049110-98 = "Ладно, я пошла. Развлекайтесь со своим Отрядом линчевателей или как там."
10049110-99 = ""
10049110-101 = ""
10049110-103 = "Подождите."
10049110-104 = "А?"
10049110-105 = "Мусор ведь должен быть в урне, не думаешь?"
10049110-106 = "Эх, мне не очень хочется снова его трогать. Напиток разлился повсюду, теперь всё противное..."
10049110-107 = "КОМУ-ТО всё равно придётся это трогать, когда здесь будут убирать."
10049110-108 = "Ещё не поздно поступить правильно."
10049110-110 = "А, в таком случае..."
10049110-111 = "Эй, погоди! Ты кто такая, чтобы командовать нашим капитаном, а?"
10049110-112 = "Давайте, капитан! На этот раз проучим их, да?!"
10049110-113 = "А? О, погоди... Хм...?"
10049110-114 = "(Я как раз собиралась поднять это и выбросить в урну...)"
10049110-115 = "Хорошо тогда. Рейса?"
10049110-116 = "Давайте добавим магии!"
10049110-117 = "А-а-а! Хватит волшебниц!!"
