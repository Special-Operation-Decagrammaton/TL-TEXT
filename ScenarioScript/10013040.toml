[translation]
10013040-1 = "Эпизод 4;К следующему пункту"
10013040-5 = "[ns] «...Один остров готов.»"
10013040-6 = "Хех! «Франчайзинговый договор» звучит неплохо."
10013040-7 = "Это просто умное деловое решение!"
10013040-8 = "[s] «Как у вас там дела?»"
10013040-9 = "Хи-хи! Отлично! ☆ Мы наказали нескольких преступников, которые мешали! ☆"
10013040-10 = "Мы обезвредили большую часть бандитов здесь."
10013040-12 = "И продолжим избивать каждого до последнего!"
10013040-13 = "Другими словами, здесь всё под контролем. Продолжайте в том же духе!"
10013040-14 = "[s] «Спасибо. Отличная работа, все.»"
10013040-18 = "..."
10013040-19 = "[s] «Шизуко? Ты выглядишь подавленной.»"
10013040-20 = "Ничего серьёзного. Просто..."
10013040-21 = "Мне кажется, Момоёдо свалил все наши проблемы на ни в чём не виноватых студентов другой школы."
10013040-22 = "[s] «Не переживай. Они сами вызвались, потому что хотели помочь.»"
10013040-23 = "Правда так думаешь?"
10013040-24 = "[s1] «Ага, и студенты Абидоса сильные.»\n[s2] «Студенты Абидоса как минимум очень живучие.»"
10013040-27 = "Ладно... Раз вы так говорите, Сенсей."
10013040-28 = "Я им доверюсь!"
10013040-29 = "[s] «Так ты знаешь, куда мы идём дальше?»"
10013040-30 = "Я уже всё выяснила!"
10013040-31 = ""
10013040-35 = "С Серными шахтёрами разобрались, следующая цель..."
10013040-36 = "...здесь!"
