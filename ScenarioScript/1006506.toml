[translation]
1006506-1 = "Настоящий бизнес-план Кахо"
1006506-5 = "Я пришёл в комнату отдыха Клуба Инь-Ян, о которой рассказывала Кахо."
1006506-6 = "[ns] «Так вот это где...»"
1006506-7 = ""
1006506-10 = "Это... должно быть здесь..."
1006506-11 = ""
1006506-14 = "А это... вот сюда..."
1006506-15 = "[s] «(Я слышу Кахо. Она внутри?)»"
1006506-16 = ""
1006506-21 = ""
1006506-22 = ""
1006506-23 = "О, Сенсей. Вы пришли. Добро пожаловать."
1006506-24 = "[s] «Привет, Кахо. Чем занимаешься?»"
1006506-25 = ""
1006506-27 = ""
1006506-28 = "Хороший вопрос!"
1006506-29 = "Хи-хи, как я и говорила, я расставляю товары для украшения комнаты!"
1006506-30 = "Обычно комнату отдыха Клуба Инь-Ян используют для приёма посетителей..."
1006506-31 = ""
1006506-33 = ""
1006506-34 = ""
1006506-35 = "Поэтому если разместить здесь новые рекламные товары..."
1006506-36 = "Реклама должна стать ещё эффективнее!"
1006506-37 = "[s] «А... понятно. Как и ожидалось от тебя, Кахо.»"
1006506-38 = "А, тогда подождите немного, Сенсей."
1006506-39 = "У меня совсем нет времени... Нужно расставить всё в идеальном порядке..."
1006506-40 = "[s] «Вообще-то я могу тебе помочь.»"
1006506-41 = "О... Спасибо."
1006506-42 = ""
1006506-44 = ""
1006506-46 = ""
1006506-48 = "Я очень признательна."
1006506-50 = "И вскоре мы закончили расставлять товары..."
1006506-51 = ""
1006506-54 = "Вот и всё, Сенсей!"
1006506-57 = "― Ну как вам, Сенсей?[wa:1370]"
1006506-60 = "― Эти круглые глаза, совершенно беззаботные,"
1006506-62 = "― и это задумчивое выражение..."
1006506-65 = "― Ну правда! Разве это не невероятно мило?![wa:1730]"
1006506-68 = "― Ах... Идеальная форма, дарованная свыше. Лучше и быть не может...[wa:2140]"
1006506-70 = "― Как же я благодарна за то, что живу...!"
1006506-73 = "[ns] «Да. Всё, что ты принесла, очаровательно.»"
1006506-74 = "― Да, именно![wa:840]"
1006506-76 = "― Все они мои милые и драгоценные детки.[wa:380]"
1006506-79 = "― Милый ребёнок, сильный ребёнок,[wa:760]"
1006506-81 = "― крутой ребёнок и прекрасный ребёнок...[wa:510]"
1006506-84 = "― Хи-хи."
1006506-86 = "― Я смотрю на них так, словно они студенты Хяккияко.[wa:10]"
1006506-89 = "[ns] «Как на студентов Хяккияко...?»"
1006506-90 = "― Поскольку каждая из них уникальна,[wa:10]"
1006506-92 = "― между ними иногда могут возникать конфликты...[wa:60]"
1006506-95 = "― Но мне кажется, именно это и показывает...[wa:540]"
1006506-97 = "― насколько ярко проявляется индивидуальность каждого студента.[wa:310]"
1006506-100 = "[ns1] «Верно. И конечно же, Кахо тоже сюда относится.»\n[ns2] «Кахо, ты всегда стараешься изо всех сил и тоже очень дорога мне как студент.»"
1006506-101 = "― С-Сенсей...?![wa:580]"
1006506-102 = "― С-Сенсей...?![wa:580]"
1006506-104 = "― Эм... Вот так внезапно такое говорить...[wa:750]"
1006506-107 = "― Эм. С-спаси...[wa:850]"
1006506-109 = "― спасибо вам, Сенсей...[wa:1090]"
1006506-112 = "Оставшееся время мы провели вместе, разговаривая и наслаждаясь обществом друг друга."
