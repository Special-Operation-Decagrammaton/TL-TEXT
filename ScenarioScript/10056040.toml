[translation]
10056040-1 = "Episode 4; Dangerous Barnacles"
10056040-3 = "Surely, you don't mean—"
10056040-4 = "Hull cleaning!?"
10056040-6 = "Odyssey Mooring"
10056040-7 = "[ns1] \"Spot on. Island wanted to ask for your help.\"\n[ns2] \"They said only the Diving Club could do this.\""
10056040-10 = "They aren't wrong, but... While we are suited for this kind of work..."
10056040-11 = "Mngh... I really don't like hull cleaning..."
10056040-12 = "[s] \"...Is this too much to handle...?\""
10056040-13 = "No, it's just a matter of feeling... #nIn terms of difficulty, it isn't that hard to do."
10056040-14 = "It's just... the smell is a bit..."
10056040-15 = "But then again, we're not really in a situation where we can be picky about our jobs..."
10056040-19 = "Diving Club, are we all ready?"
10056040-20 = "Safety is our number one for this job. Always dive in pairs and be sure to check on each other!"
10056040-21 = "Prepare at least two methods of communication with the surface. #nVerify that your buoy has inflated before you begin and bring a knife with you just in case. #nAlso, once you're in the water, be sure to check your cylinder pressure every five minutes—"
10056040-26 = "Oh geez, you're such a worrywart. How many times do you think we've done this#nalready?"
10056040-27 = "Are we going with the usual buddies? The president with myself, and Makina with Sayuri?"
10056040-28 = "It's hard to use my hands with the gloves on..."
10056040-29 = "President, can I go barehanded?"
10056040-30 = "Absolutely not! There'll be lots of places on the hull where you#ncould cut yourself!"
10056040-31 = "If you cut yourself while working and suffer from a bacterial infection, worst case#nscenario, you might suffer from a high fever due to sepsis or even experience#norgan failure—"
10056040-40 = "...I see. #nSo this is why you asked for underwater work."
10056040-41 = "It seems the Diving Club's financial situation was just as I expected."
10056040-42 = "But to think they were in debt..."
10056040-43 = "If this had been left unaddressed, it would have affected not only the Diving Club, #nbut the entire school as a whole."
10056040-44 = "I offer you our gratitude for your quick response."
10056040-45 = "[s3] \"It wasn't a big deal.\"\n[s4] \"And likewise, thank you for introducing them some work.\""
10056040-48 = "It was perfect timing, actually."
10056040-49 = "It's often overlooked, but the underwater hull—the part that is in contact with the sea, is the most important part of the ship."
10056040-50 = "Neglecting to maintain it increases the chances of an accident occuring, so we#nregularly place our ships in a drydock for servicing."
10056040-51 = "The issue with that method though is that it takes time."
10056040-52 = "However, if the Diving Club were to lend their assistance, they could save us a lot#nof trouble."
10056040-56 = "...It's been 30 minutes."
10056040-57 = "This should be good enough."
10056040-58 = "All right. Let's take a one hour break."
10056040-65 = "It stiiinks."
10056040-66 = "I thought you liked that smell? You with your sardine ice cream and all."
10056040-67 = "Sardines and barnacles smell different."
10056040-68 = "Good work. Kotone and I will dive next."
10056040-69 = "Phew, I'm exhausted..."
10056040-71 = "[ns] \"So what exactly does hull cleaning entail?\""
10056040-72 = "It involves the removal of barnacles that have attached themselves to the ship."
10056040-73 = "[s] \"Barnacles?\""
10056040-74 = "Yes. Barnacle larvae float across the ocean, where they may attach onto#nthe bottom of a ship and grow."
10056040-75 = "If left unchecked, they can cause metal to rust and reduce hydrodynamic efficiency#nwhile sailing. This is why we regularly clean them off."
10056040-76 = "In particular, when a ship is anchored, such as is the case here, barnacles will#nattach in dense groups."
10056040-77 = "[s] \"Sounds like a pain.\""
10056040-78 = "Indeed, they are the source of many headaches."
10056040-80 = "Hey, Makina."
10056040-81 = "...Can't we just go brrrt with the grinder?"
10056040-82 = "The president told us to not use anything other than a scraper."
10056040-83 = "But the principle behind a scraper and a grinder is the same."
10056040-84 = "It's cordless too, so there's no worry about being zapped."
10056040-85 = "Hmm..."
10056040-86 = "Whatever, should be fine. Learning to be efficient is part of the job too."
10056040-87 = "I'll go fetch the grinder then."
10056040-88 = "Okey~"
10056040-90 = "[ns] \"Can't you eat the barnacles?\""
10056040-91 = "I would recommend against doing so. #nDepending on where they were attached, they may contain high concentrations of harmful chemicals and heavy metals."
10056040-92 = "Not to even mention the terrible smell..."
10056040-93 = "Perhaps only a pirate would be happy to see barnacles on their ship."
10056040-94 = "[s] \"Pirates?\""
10056040-95 = "Indeed."
10056040-96 = "According to reports, the Sea Dragon uses barnacles when threatening others—"
10056040-100 = "Ah, my apologies."
10056040-101 = "[s5] \"I've been wondering for a while now...\"\n[s6] \"Who exactly is this Sea Dragon?\""
10056040-107 = "...As embarrassing as it is to admit, our school is host to a problematic student."
10056040-108 = "After judging that it would be impossible to rehabilitate her within the school, we #nhanded her off to Valkyrie's Correction Bureau."
10056040-109 = "Due to her ability to command even the gentlest waves according to her will, she #nwas given the moniker of the \"Sea Dragon.\" However, she possessed a fatal flaw."
10056040-110 = "[s] \"Which is?\""
10056040-111 = "She incites others and proclaim herself as the Dragon Palace's—"
10056040-117 = "BOOM!"
10056040-118 = "[ns7] \"Wh-what was that?\"\n[ns8] \"Did something just explode...?\""
10056040-122 = "President, bad news!"
10056040-123 = "A-are you two all right? What happened!?"
10056040-127 = "Barnacle explosion..."
10056040-128 = "You're saying a barnacle... exploded?"
10056040-129 = "Don't tell me you two used something other than a scraper."
10056040-130 = "Yeah, so umm..."
10056040-131 = "There was a limit to how much the scraper could do, so we brought out the#ngrinder..."
10056040-132 = "...Makina."
10056040-133 = "B-but I'm serious! The barnacle DID explode!"
10056040-137 = "Trident, please send an emergency repair team to pier 7 immediately."
10056040-138 = "Yes, a breach has occured in the lower part of the ship. Damages are minor. #nHowever..."
10056040-139 = "Switch to Z status. Seal all hatches and doors."
10056040-149 = "It's so over..."