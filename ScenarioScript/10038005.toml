[translation]
10038005-1 = "Пролог;Приготовимся к фестивалю!"
10038005-4 = "Ранее в Blue Archive..."
10038005-8 = "(Академия Шаньхайцзин и Федеральная Академия Красной Зимы готовились провести встречу по обмену.)"
10038005-9 = "В ближайшем будущем Шаньхайцзин проведёт встречу по обмену с Красной Зимой."
10038005-10 = ""
10038005-12 = "В любом случае, сам Генрюмон, если говорить прямо... чувствует себя неуютно из-за этой встречи по обмену."
10038005-13 = "Главная причина — полное отсутствие подобного опыта. Другие могут захотеть сохранить ещё большую отстранённость от всей этой затеи."
10038005-16 = "(Несмотря на опасения, встреча по обмену началась, и студенты Секретариата Федеральной Академии Красной Зимы благополучно прибыли в Шаньхайцзин.)"
10038005-19 = "Ого... Так вот он какой...!"
10038005-21 = "Это Шаньхайцзин!"
10038005-22 = "Всё точно как в моих исследованиях!"
10038005-23 = "Томоэ, Томоэ! Посмотри туда! На крышу! Какая интересная!"
10038005-24 = ""
10038005-26 = ""
10038005-28 = ""
10038005-29 = "(Должно быть, это те самые студенты из слухов!)"
10038005-30 = "(Я столько о них слышала, но никогда не думала, что увижу их лично...!)"
10038005-33 = "(Кагуя, президент традиционалистского Клуба Пекинской Оперы, провела долгий и жаркий разговор с Шинтани Кай.)"
10038005-36 = ""
10038005-37 = "...?! Что ты говоришь, Шинтани Кай?! У меня и Клуба Пекинской Оперы нет таких полномочий!"
10038005-39 = "Забавно слышать это от президента Клуба Пекинской Оперы. До сих пор именно Клуб Пекинской Оперы серьёзнее всех чтил традиции Шаньхайцзина. Если не у тебя, то у кого вообще могут быть такие полномочия?"
10038005-40 = "...!"
10038005-41 = "Впрочем, всё это может быть лишь бредом изгнанницы из Шаньхайцзина."
10038005-42 = "Если мы всё-таки поставим новую Пекинскую оперу... и она провалится..."
10038005-43 = "Забавно. Разговор об успехе и провале — это признак верности?"
10038005-46 = "(По приказу Шинтани Кай Кагуя поставила новую Пекинскую оперу и представила прошение Президенту Кисаки.)"
10038005-50 = "Во имя Шаньхайцзина и его традиций я осуждаю Рюгэ Кисаки, президента Генрюмона!"
10038005-52 = "(Однако благодаря усилиям Канцелярии Красной Зимы возражения Клуба Пекинской Оперы удалось эффективно подавить.)"
10038005-55 = "Скажу прямо! Все студенты имеют право устроить государственный переворот!"
10038005-56 = "А президент студенческого совета имеет право подавить этот переворот и продолжать руководить школой!"
10038005-59 = "(Встреча по обмену успешно завершилась.)"
10038005-62 = "Хи-хи-хи! Похоже, вам действительно понравилась эта встреча по обмену, Великий Вождь Черино."
10038005-63 = "Хм-м, Шаньхайцзин был... настоящим большим приключением для нас!"
10038005-65 = "Надеюсь, вы сможете простить неприятности с Клубом Пекинской Оперы."
10038005-66 = "Я Великий Вождь Красной Зимы! Такие мелочи никогда не смогут угрожать моей власти!"
10038005-67 = "Именно! Президент Черино — очень великодушный человек!"
10038005-69 = "(Но тот маленький уголёк, которого зовут Шинтани Кай, всё ещё горит.)"
10038005-72 = "Я очень долго к этому шла. Мне даже пришлось пережить унижение заключения в Исправительном Бюро."
10038005-73 = "Но я всё равно накопила силы и ждала подходящего момента. И этот момент настал."
10038005-74 = "Я заберу то, что принадлежит мне, и никто не встанет у меня на пути."
10038005-76 = "(Невидимая тревога окружает Шаньхайцзин...)"
10038005-77 = ""
10038005-84 = "Уже почти пора..."
10038005-85 = ""
10038005-87 = ""
10038005-88 = "Т-Тут, сюда!"
10038005-89 = ""
10038005-92 = ""
10038005-93 = "Почему ты пришла так рано...?"
10038005-94 = "Ну, занятия закончились рано, и мне особо нечем было заняться..."
10038005-95 = "Вот как? Завидую. Мы..."
10038005-96 = "...Нет, ничего."
10038005-97 = ""
10038005-99 = ""
10038005-100 = "......"
10038005-101 = "Как сейчас дела у Генрюмона?"
10038005-102 = ""
10038005-104 = ""
10038005-105 = "Эм... Ну... Нормально..."
10038005-106 = "Ты могла бы врать убедительнее."
10038005-107 = "*вздыхает* Да, сама не знаю. В последнее время вообще трудно понять, что к чему."
10038005-108 = "Эти девчонки из Красной Зимы. С тех пор как они приехали и уехали, всё пошло наперекосяк."
10038005-109 = "...И не только в Генрюмоне."
10038005-110 = "Да... Кажется, я понимаю."
10038005-111 = "Эй, тут ходит один слух..."
10038005-112 = "...Президент и правда собирается встать на сторону Променада Чёрной Черепахи и открыть ворота Шаньхайцзина?"
10038005-113 = ""
10038005-115 = ""
10038005-116 = "Ты о чём вообще?! Не говори такого. Кто-нибудь может услышать!"
10038005-117 = "Но ты сама говорила, что недавно студенты Красной Зимы могли свободно ходить где угодно."
10038005-118 = "Ну... это правда, но..."
10038005-119 = "С приближением Фестиваля Лунного Света это станет проблемой..."
10038005-120 = "...Когда фестиваль начнётся, на улице Променада Чёрной Черепахи будет ещё больше чужих студентов..."
10038005-122 = "Я правда не знаю. Я просто сосредоточусь на своей работе..."
10038005-123 = "Ты работаешь на Генрюмон! Нельзя так говорить!"
10038005-124 = "А что мне ещё делать? Я всего лишь жалкая первокурсница!"
10038005-125 = ""
10038005-127 = ""
10038005-128 = "*вздыхает* Да уж, что мы вообще знаем? Пойдём лучше в Источник Персикового Цвета."
10038005-129 = ""
10038005-131 = ""
10038005-140 = ""
10038005-143 = "Ах, не могу дождаться Фестиваля Лунного Света!"
10038005-144 = "[s] «Что за событие?»"
10038005-145 = ""
10038005-147 = ""
10038005-148 = "Хм? А, точно, Сенсей, вы ведь не из Шаньхайцзина."
10038005-149 = "Я так к вам привыкла, что... иногда забываю. Нужно быть внимательнее."
10038005-150 = "[s] «Рад, что ты так себя чувствуешь, Мина.»"
10038005-151 = ""
10038005-153 = ""
10038005-154 = "Фестиваль Лунного Света — традиционный ежегодный праздник Шаньхайцзина."
10038005-157 = "Главные события проходят на улице Променада Чёрной Черепахи, но сам фестиваль охватывает весь Шаньхайцзин."
10038005-158 = "Променад открыт для чужаков, и их там толпы, но..."
10038005-159 = "...все остальные улицы закрыты для студентов извне. Таково правило."
10038005-160 = "[s] «Звучит так, будто ради этого приходится сильно заморачиваться.»"
10038005-163 = "И всё же есть правила, которые нельзя нарушать никогда!"
10038005-164 = "Фестиваль Лунного Света изначально был праздником только для нас — чтобы вместе есть и молиться о благополучии друг друга."
10038005-165 = "...Теперь чужаки спокойно приходят без приглашения, благодаря Променаду Чёрной Черепахи."
10038005-166 = "Эти наживающиеся барыги из Чёрной Черепахи превратят в источник денег что угодно. Вообще что угодно."
10038005-167 = "А кто, по-вашему, потом должен за ними убирать?! Мы, Генрюмон, вот кто!"
10038005-168 = "[s] «Эй-эй, спокойнее...»"
10038005-169 = "Как бы то ни было, в этом году днём на Фестивале Лунного Света будут раздавать лунные пряники. Разумеется, в форме настоящей луны."
10038005-170 = "Ночью можно посмотреть Пекинскую оперу, танец дракона, а потом все молятся об удаче, любуясь фейерверками."
10038005-171 = "Но если честно, в последнее время Генрюмон смягчает правила..."
10038005-172 = "Меньше ночных патрулей, меньше настороженности к чужакам..."
10038005-173 = "...Вы кое-что об этом знаете, Сенсей. Встреча по обмену с Красной Зимой и всё такое."
10038005-174 = "Многие нервничают из-за слишком большого количества чужаков. Я даже не знаю, хорошая ли сейчас идея проводить фестиваль."
10038005-175 = "[s] «Хм... А ты, Мина? Что собираешься делать?»"
10038005-176 = ""
10038005-178 = ""
10038005-179 = "Я? Я всегда следую приказам президента. Это никогда не изменится."
10038005-180 = "Не хочу себя нахваливать, но стойкости мне не занимать."
10038005-181 = "...Но как исполнительный офицер я обязана учитывать мнение остальных членов Генрюмона..."
10038005-182 = "Что они думают? Ну..."
10038005-183 = ""
10038005-185 = "Пока никто не говорит, что фестиваль нужно прямо отменить. Всё-таки это наша гордая традиция."
10038005-186 = "Но большинство считает, что правила для внешних студентов и Променада Чёрной Черепахи нужно снова ужесточить."
10038005-189 = "Тревога из-за чужаков здесь совершенно реальна."
10038005-190 = "И ведь именно Променад первым их впустил. Причём в одностороннем порядке."
10038005-191 = "Мы позволяли им делать что хотят, и теперь начинаем создавать впечатление, будто они тащат нас за собой."
10038005-192 = "По крайней мере, именно так, похоже, чувствуют остальные члены Генрюмона."
10038005-193 = "Для меня вопрос в другом: «Нужно ли передать это президенту, и если да, как это сформулировать?»"
10038005-194 = "[s] «Так вот с чем тебе нужна была помощь.»"
10038005-195 = "...Простите, Сенсей. Мне трудно передавать такие сообщения."
10038005-196 = "О, у взрослых с таким тоже бывают проблемы? ...Мне стало немного легче."
10038005-197 = "Но, конечно, остаётся основная проблема..."
10038005-198 = ""
10038005-202 = "Понятно. Значит, вот что они говорят."
10038005-203 = ""
10038005-205 = ""
10038005-206 = "*ахает*"
10038005-207 = "[s] «Я знаю этот голос.»"
10038005-208 = ""
10038005-210 = ""
10038005-211 = ""
10038005-212 = "Давно не виделись... Хотя, пожалуй, не так уж давно. Рада снова видеть вас так скоро."
10038005-213 = "Г-Госпожа Президент?!"
10038005-214 = "Не беспокойся. Я прекрасно знаю, что такие мнения существуют."
10038005-215 = "Я-Я...! То есть..."
10038005-216 = "И ты хорошо работаешь. Но как президент я тоже имею своё мнение по этому вопросу."
10038005-217 = "Конечно, госпожа."
10038005-218 = "Я понимаю тревогу студентов. Понимаю и беспокойство членов Генрюмона, и желание усилить патрули."
10038005-219 = "И несмотря на всё это, я считаю, что Фестиваль Лунного Света должен пройти без изменений."
10038005-221 = "Вы хотите сказать...?!"
10038005-223 = "Пока дует ветер, у наших ушей всегда будет шум."
10038005-224 = ""
10038005-226 = ""
10038005-227 = ""
10038005-228 = "И всё же Шаньхайцзин должен быть сильным, и он будет. Согласна, Мина?"
10038005-229 = "...!"
10038005-230 = "Да! И именно поэтому в такие времена нам нужно—"
10038005-231 = "Рада, что ты меня понимаешь. Тогда ты знаешь, что нужно сделать."
10038005-232 = "Да, госпожа Президент! Оставьте это мне!"
10038005-233 = ""
10038005-235 = ""
10038005-236 = ""
10038005-238 = ""
10038005-239 = "*вздыхает* Если бы я знала, что вы придёте, Сенсей, я бы подготовила другой вид встречи."
10038005-240 = "[s] «Я всё равно рад снова тебя видеть, Кисаки.»"
10038005-241 = "Хе-хе, вы как всегда. Ваша неизменность... очень успокаивает."
10038005-242 = "Если бы только Шаньхайцзин мог брать с вас пример. Тогда я могла бы без колебаний сказать: «Ждите фестиваля с нетерпением!»"
10038005-243 = "О, а вы и так уже его ждёте?"
10038005-244 = "Ах, но вы ведь всегда ожидаете от нас лучшего, правда? Что ж, Сенсей, Генрюмону остаётся только оправдать эти ожидания."
10038005-245 = "С постановкой Пекинской оперы в этом году могут возникнуть некоторые... организационные трудности, но..."
10038005-246 = "...ничто не должно помешать выставке фонарей, фейерверкам или другим представлениям."
10038005-247 = ""
10038005-249 = ""
10038005-250 = "Ну что, пойдём, Сенсей?"
10038005-251 = "[s] «А? Куда?»"
10038005-252 = "Разумеется, помогать с подготовкой Фестиваля Лунного Света!"
10038005-253 = "Фуфу, не беспокойтесь, Сенсей. Вам нужно лишь оставаться рядом со мной."
10038005-254 = "Мы приготовим достаточно фруктов и лунных пряников для всех."
10038005-255 = "[s] «Ох, столько сахара, столько калорий...!»"
10038005-256 = "Вот что вас беспокоит? Хотя да, вы ведь взрослый."
10038005-257 = "Тогда закажем для вас особые закуски по вашему вкусу. С насыщенным вкусом и щедрой начинкой."
10038005-258 = ""
10038005-260 = ""
10038005-261 = ""
10038005-262 = "Пожалуйста, примите. Наше гостеприимство очень щедрое — любой, кто делил с нами пир, это подтвердит."
