[translation]
2006003-1 = "A Lesson with Ibuki!"
2006003-2 = "Rocky Shore"
2006003-5 = "(I headed to the spot Ibuki told me about.)"
2006003-6 = "Ah, Sensei!"
2006003-11 = "[s] \"Hello there, Teacher Ibuki!\""
2006003-12 = "Hehehe! There are two teachers today!"
2006003-13 = "[s] \"Actually, I'm the student today.\""
2006003-14 = "Oh, that's right! Okay, Ibuki will do her best as the teacher!"
2006003-15 = "Today, together with Teacher Ibuki~"
2006003-16 = "we're going to learn about sea creatures~!"
2006003-17 = "[s] \"Sea creatures?\""
2006003-18 = "Yep! I read a book before we came to the beach!"
2006003-19 = "Fish, whales, jellyfish, starfish, crabs, clams..."
2006003-20 = "So! We're going to go meet some friends who live on the rocks around here!"
2006003-21 = "Sensei! Climb up on the rocks~!"
2006003-23 = "(I followed behind Ibuki and climbed up onto the rocks on the shore.)"
2006003-25 = "First up, purple barnacles!"
2006003-26 = "When these little guys are just born, they drift around the ocean...#nbut when they grow up, they stick to the rocks!"
2006003-27 = "And for food, they... wait, what?"
2006003-28 = "Sensei! Look, a spiny crab is walking over there!"
2006003-29 = "They puff up their spines when they get startled!"
2006003-30 = "Look! It looks like it got surprised! Its spines are coming out~"
2006003-31 = "[s] \"You're right!\""
2006003-32 = "Pop quiz! What do you call these little guys under the rock?"
2006003-33 = "[s] \"Aren't those the purple barnacles from before?\""
2006003-34 = "Wrong! They look a lot alike, but they're a totally different species!"
2006003-35 = "They're called pyramid shells! They look like purple barnacles, but they're completely different creatures!"
2006003-36 = "The difference is... the shape of their shells!#nPurple barnacle shells are round, but pyramid shells have sharp corners. Can you see?"
2006003-39 = "(After hearing about the creatures living on the surface of the rocks—)"
2006003-40 = "(We both climbed down from the rocks.)"
2006003-42 = "Sensei! There are different ones over here!"
2006003-43 = "Sea anemones, starfish, shrimp..."
2006003-44 = "Wow! I can see them so clearly!"
2006003-45 = "[s] \"You can see the seabed so clearly!\""
2006003-46 = "Ibuki has never seen such a beautiful ocean before!"
2006003-47 = "And... ahaha!"
2006003-48 = "That tickles~! No, little fish, stop it!"
2006003-49 = "These guys are called pipefish, but—wait?"
2006003-50 = "Sensei! Look!"
2006003-51 = "[s] \"...Is that a balloon floating there?\""
2006003-53 = "(Something that looked like a blue balloon was floating on the water a short distance away.)"
2006003-54 = "[s] \"What is that... Teacher Ibuki?\""
2006003-55 = "Ahem! Excellent question!"
2006003-56 = "Those are blue jellyfish—"
2006003-57 = "They're jellyfish that drift along the surface of the water!"
2006003-58 = "Their tentacles have a very painful sting, and if you get stung, you have to go to the hospital..."
2006003-63 = "[ns1] \"Wait...\"\n[ns2] \"Isn't it coming closer to us...?\""
2006003-66 = "Eeeek, S-Sensei...!"
2006003-71 = "[ns] \"Ibuki!?\""
2006003-73 = "(I picked up Ibuki after she stumbled backward and fell, and we left the rocky area.)"
2006003-74 = "(...Perhaps because she was scared, Ibuki kept clinging to me for a while even after we returned to the sandy beach.)"