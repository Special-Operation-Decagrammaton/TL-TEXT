[translation]
2006003-1 = "Уроки с Ибуки!"
2006003-2 = "Скалистый берег"
2006003-5 = "Я отправился на скалистый участок берега, о котором говорила Ибуки."
2006003-6 = "О, это Сенсей!"
2006003-7 = ""
2006003-10 = ""
2006003-11 = "[s] «Привет, Сенсей Ибуки!»"
2006003-12 = "Хи-хи, сегодня у нас целых два Сенсея!"
2006003-13 = "[s] «Не-а! Сегодня я буду просто твоим студентом!»"
2006003-14 = "Хи-хи! Тогда Ибуки постарается вас всему научить!"
2006003-15 = "Итак, сегодня Сенсей Ибуки расскажет вам о..."
2006003-16 = "...морской биологии!"
2006003-17 = "[s] «Морской биологии?»"
2006003-18 = "Да! Ибуки подготовилась и прочитала книги о морских обитателях!"
2006003-19 = "Рыбы, киты, медузы, морские звёзды, крабы, моллюски..."
2006003-20 = "А сегодня мы лично познакомимся с друзьями, которые живут среди прибрежных скал! Это их дом!"
2006003-21 = "Ну что, Сенсей! Заберёмся на вершину скал!"
2006003-23 = "Я последовал за Ибуки, и мы поднялись на вершину скал."
2006003-24 = ""
2006003-25 = "А теперь! Сначала посмотрим на фиолетовых морских желудей!"
2006003-26 = "Пока они маленькие, то плавают в океане, а когда вырастают, прикрепляются к камням и живут там всю жизнь!"
2006003-27 = "А питаются они... А?"
2006003-28 = "Сенсей! Вон на том камне господин Колючий Краб!"
2006003-29 = "Если его напугать, он растопыривает спрятанные иголки и становится большим и страшным."
2006003-30 = "Смотрите! Наверное, он испугался вас, Сенсей! Все иголки выставил!"
2006003-31 = "[s] «И правда...!»"
2006003-32 = "А сможете угадать, как называются существа под этим камнем?"
2006003-33 = "[s] «М-м? Это разве не просто... „фиолетовые морские жёлуди“?»"
2006003-34 = "Неправильно! Они очень похожи, но относятся к совсем другому виду!"
2006003-35 = "Они называются пирамидальными ракушками! На вид и по поведению очень похожи на фиолетовых морских желудей, но на самом деле совсем другие."
2006003-36 = "Дело в форме раковины! У фиолетовых морских желудей она круглая, а у пирамидальных ракушек четыре заострённых угла! Посчитайте!"
2006003-39 = "После познавательной лекции о существах, живущих на поверхности скал..."
2006003-40 = "Мы спустились в небольшую заводь между камнями."
2006003-41 = ""
2006003-42 = "Сенсей, посмотрите под воду! Там столько всего интересного!"
2006003-43 = "Актинии, морские звёзды, креветки..."
2006003-44 = "И вода такая прозрачная!"
2006003-45 = "[s] «Да, даже ноги отлично видно»."
2006003-46 = "Ибуки ещё никогда не видела такой чистой морской воды!"
2006003-47 = "И ещё... А-ха-ха!"
2006003-48 = "Рыбки щекочут Ибуки ножки!"
2006003-49 = "Это рыбы-иглы, и они... А?"
2006003-50 = "Сенсей! Смотрите!"
2006003-51 = "[s] «М-м? Пакеты?»"
2006003-52 = ""
2006003-53 = "Я заметил, что неподалёку по воде плавало что-то похожее на синие воздушные шарики."
2006003-54 = "[s] «Что это за шарики, Сенсей Ибуки?»"
2006003-55 = "Хи-хи! Хороший вопрос!"
2006003-56 = "Они называются синими медузами-пузырями..."
2006003-57 = "Это ленивые медузы, которые дрейфуют по волнам и плывут только туда, куда их несёт море!"
2006003-58 = "А в щупальцах у них ну о-о-очень опасный яд, так что если ужалят, нужно срочно бежать в больницу..."
2006003-59 = ""
2006003-62 = ""
2006003-63 = "[ns1] «Эм, кстати...»\n[ns2] «Тебе не кажется... что волны подбираются всё ближе...?»"
2006003-66 = "Э-э-э, С-Сенсей...!"
2006003-67 = ""
2006003-69 = ""
2006003-70 = ""
2006003-71 = "[ns] «Ибуки?!»"
2006003-73 = "Ибуки запаниковала и упала в воду. Я вытащил её со скалистого участка обратно в безопасное место."
2006003-74 = "...Бедняжка Ибуки так испугалась, что даже на песчаном пляже не отпускала меня."
