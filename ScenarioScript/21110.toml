[translation]
21110-1 = "Episódio 11;O Que Havia Lá"
21110-2 = "Interior da Fábrica"
21110-7 = "Arf, arf... Conseguimos, eu acho?"
21110-8 = "Infiltração bem-sucedida. Missão concluída."
21110-9 = "Ei, ei, será que a gente não é superforte na verdade? Capaz de vencermos até a C&C ou os esquadrões de combate de outras escolas!"
21110-10 = "Pelo menos contra a C&C acho que é impossível... Mas, verdade, até eu fiquei um pouco surpresa."
21110-11 = "Com certeza é graças ao comando do Sensei."
21110-12 = "Eu também acho... Com o Sensei aqui, a sensação de segurança é totalmente diferente..."
21110-13 = "A propósito, todo mundo ainda tem munição?"
21110-14 = "A bateria está piscando... Será que isso significa \"Mana insuficiente\"?"
21110-15 = "Talvez, parece que só aguenta mais um disparo..."
21110-16 = "Então vamos evitar combates o máximo possível."
21110-18 = "Que lugar é este...?"
21110-19 = "Ah..."
21110-20 = "Aris, o que foi?"
21110-21 = "..."
21110-22 = "Não sei... mas esta paisagem parece familiar. Precisamos ir por aqui."
21110-24 = "Hã?"
21110-26 = "Não está nas memórias da Aris... mas é como se eu tivesse um \"arquivo de save\"."
21110-27 = "Este corpo está reagindo."
21110-30 = "Se fosse comparar... sim, é como conseguir avançar mesmo sem tutorial ou explicação... Ou como jogar um jogo que você já jogou várias vezes..."
21110-31 = "Como assim...? Realmente, parece com o lugar onde a Aris estava antes..."
21110-32 = "Ah, tem um computador ali... Ué?"
21110-33 = "Aquele computador está ligado...?"
21110-36 = "..."
21110-37 = "(Bip-bip)"
21110-38 = "[Bem-vindo ao Divi:Sion System. Por favor, insira o item que deseja pesquisar]"
21110-39 = "Opa, que design amigável inesperado. Vamos pesquisar sobre a G.Bible?"
21110-40 = "Não, isso não é suspeito demais? E mais, se diz \"Bem-vindo\"... será que \"Divi:Sion System\" é o nome desta fábrica...?"
21110-41 = "(Aproxima-se)"
21110-42 = "Teclado localizado... Vou tentar digitar G.Bible."
21110-43 = "Ah, apareceu alguma coisa!"
21110-44 = "..."
21110-45 = "...#$@#$$%#%^*&(#@"
21110-46 = "Q-Quebrou?! Aris, o que diabos você digitou?!"
21110-47 = "N-Não, eu nem apertei Enter ainda..."
21110-50 = "[56cd7b]Você é AL-1S?"
21110-53 = "?!"
21110-54 = "!!"
21110-55 = "?"
21110-56 = "Não, Aris é a Aris..."
21110-57 = "E-Espera!"
21110-58 = "...Tem algo estranho. Aris-chan, por enquanto é melhor não digitar nada..."
21110-60 = "[Voz reconhecida, credenciais confirmadas. Bem-vinda de volta, AL-1S]"
21110-61 = "?!"
21110-62 = "Tem reconhecimento de voz?!"
21110-63 = "Ãhn... AL-1S é a Aris-chan?"
21110-64 = "Ah, desculpa. Pensando bem, acho que não contamos para a Yuzu-chan."
21110-65 = "..."
21110-66 = "O verdadeiro nome da Aris... o verdadeiro eu..."
21110-67 = "Você sabe sobre AL-1S?"
21110-68 = "..."
21110-69 = "......"
21110-70 = "A resposta está lenta...?"
21110-71 = "A tela também ficou meio embaçada, será que travou no processamento?"
21110-72 = "Sim, eu...@!#%#@!$%@!!!!"
21110-73 = "H-Hã? O que é isso, o que significa?!"
21110-74 = "Isso é..."
21110-75 = "..."
21110-76 = "Emergência detectada."
21110-77 = "Limite de energia atingido; desaparecerei assim que a energia acabar. Tempo restante: 51 segundos."
21110-78 = "Quê?! N-Não pode! Pelo menos conta sobre a G.Bible antes!"
21110-79 = "O que você procura é a G.Bible? <YES / NO>"
21110-80 = "?!"
21110-81 = "YES!"
21110-82 = "G.Bible... Verificação concluída, código: Lúdico... Humanos, compreensão, referência, registro de biblioteca número 193, dados marcados para descarte nº 1. Tempo restante: 35 segundos."
21110-83 = "Descarte?! Por quê?! Isso é o tesouro dos desenvolvedores de jogos... não, do mundo inteiro!"
21110-84 = "Se deseja a G.Bible, faço uma proposta. Conecte uma mídia de armazenamento para transferir os dados."
21110-85 = "Hã...? Você sabe onde está a G.Bible?"
21110-87 = "[56cd7b]Vocês também sabem."
21110-90 = "[56cd7b]Bem diante dos seus olhos agora."
21110-92 = "C-Como assim?!"
21110-94 = "Para ser exato, a G.Bible está dentro de mim. Contudo, estou prestes a desaparecer e solicito migração para uma nova mídia de armazenamento."
21110-95 = "M-Mesmo que você diga isso, uma mídia de armazenamento assim de repente... Ah, serve o cartão de memória do \"Game Girls Advance SP\"?"
21110-96 = "............ Bom, possível... é."
21110-97 = "P-Parece que não gostou nem um pouco da ideia... ou é impressão minha?"
21110-98 = "Cabo de dados... Conexão concluída!"
21110-99 = "Iniciando transferência... Espaço de armazenamento insuficiente, excluindo dados existentes. Tempo restante: 9 segundos."
21110-100 = "Hã, mentira?! Você não está apagando o meu save, né?! Ei?!"
21110-101 = "Espaço insuficiente; liberando capacidade."
21110-102 = "N-Não! Por favor, deixa o meu save aí! Foi um trabalhão juntar todos aqueles equipamentos—"
21110-103 = "Que pena. Excluído."
21110-104 = "Espera aííííííííííí?!"
21110-105 = "..."
21110-107 = "......"
21110-108 = "Ué... desligou...?"
21110-109 = "Aaaah! Os meus dados do Game Girls Advance!!"
21110-111 = "Ah, espera!"
21110-112 = "Tem algo na tela...?"
21110-113 = "Transferência concluída."
21110-114 = "Hã?"
21110-115 = "Novos dados foram transferidos."
21110-116 = "<G.Bible.exe>"
21110-117 = "I-Isso é...?!"
21110-118 = "V-Vamos executar agora mesmo! Temos que ver se é de verdade!"
21110-120 = "Executando o exe! Ah, apareceu um pop-up..."
21110-121 = "O quê, precisa de senha?! Que história é essa, o que a gente faz?!"
21110-122 = "...Tudo bem. Se for uma senha comum, a Veritas deve conseguir quebrar...!"
21110-123 = "(Assente animadamente!)"
21110-124 = "É-É verdade, assim...!"
21110-125 = "Com isso, um jogo realmente incrível... \"Tales Saga Chronicle 2\" vai...!"
21110-126 = "Sim, vamos conseguir fazer! Isso aí!"
21110-127 = "Pode esperar, Prêmio Millennium... não, Grande Prêmio de Jogos de Kivotos! Desta vez, o nosso novo jogo vai causar um impacto no bom sentido no mundo dos games de Kivotos!!"
21110-129 = "M-Mana, você está falando alto demais. Se gritar assim..."
21110-134 = "..."
21110-135 = "É praticamente avisar que estamos aqui..."
21110-136 = "Ops..."
21110-137 = "■■■ ■ ■! ■■■!"
21110-138 = "P-Parece que eles estão furiosos?!"
21110-140 = "(Ratatatá!)"
21110-142 = "Uaaah, estão atirando! Vamos fugir logo!"
21110-143 = "Mana, antes disso...!"
21110-144 = "Sim, Game Girls Advance garantido! Yuzu, avance protegendo o Sensei! Eu e a Aris vamos cobrir a retaguarda, então vamos abrir caminho pelos robôs e escapar!"
21110-145 = "Eu também dou cobertura!"
21110-146 = "Finalmente conseguimos a G.Bible, não podemos perder aqui...!"
21110-147 = "...Vamos voltar todos em segurança para a sala do clube!"
21110-152 = "Sim!"
