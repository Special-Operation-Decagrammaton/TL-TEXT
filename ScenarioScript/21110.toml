[translation]
21110-1 = "Эпизод 11;Прямо там, в том месте"
21110-2 = "Внутри фабрики"
21110-4 = ""
21110-5 = ""
21110-6 = ""
21110-7 = "*тяжело дышит* ...Мы добрались?"
21110-8 = "Проникновение успешно. Цель выполнена."
21110-9 = "Вау! Мы реально, типа, безумно сильные! Если постараться, наверное, даже C&C или какие-нибудь элитные отряды других академий одолеем!"
21110-10 = "Ты спятила. C&C нам не победить... но да, ты права. Мы и правда неплохи..."
21110-11 = "Может, потому что нами командует Сенсей!"
21110-12 = "Понимаю, о чём ты. Когда Сенсей рядом... это определённо меняет дело..."
21110-13 = "О, как там наши боеприпасы?"
21110-14 = "Моя батарея... мигает. У меня мало маны?"
21110-15 = "У меня самой мало. Наверное, выдержу только ещё одну короткую перестрелку."
21110-16 = "Хмм. Тогда лучше избегать новых столкновений."
21110-17 = ""
21110-18 = "Это место...?"
21110-19 = "О."
21110-20 = "В чём дело, Алис?"
21110-21 = "..."
21110-22 = "Я... не уверена. Что-то кажется знакомым. Нам туда."
21110-23 = ""
21110-24 = "А?"
21110-26 = "В моей памяти нет данных об этом месте. Но... тело знает."
21110-27 = "Будто играешь в игру, в которую последний раз играла много лет назад."
21110-28 = ""
21110-29 = ""
21110-30 = "Даже без туториала или объяснений ты всё равно чувствуешь, куда идти."
21110-31 = "Хмм. Понимаю. Знаете, это место немного похоже на то, где мы впервые нашли Алису."
21110-32 = "Ты про вон тот компьютер? А?"
21110-33 = "Кажется, компьютер уже включён!"
21110-34 = ""
21110-36 = "..."
21110-37 = "*бип*"
21110-38 = "Добро пожаловать в систему Divi:Sion. Введите пункт, по которому вам требуется помощь."
21110-39 = "Вау, будет проще, чем я думала! Мне написать \"Г.БИБЛИЯ\"?"
21110-40 = "Э-э-э... Тебе не кажется это подозрительным? Что вообще такое система Divi:Sion? Может, так называется эта фабрика боеприпасов?"
21110-41 = "*вжух*"
21110-42 = "Получена клавиатура. Ищу Г.БИБЛИЮ. *клац-клац*"
21110-43 = "О! Что-то появилось!"
21110-44 = "..."
21110-45 = "#$@#$$%#%^*&(#@"
21110-46 = "О-Оно сломалось?! Алиса! Что ты наделала?!"
21110-47 = "Я-Я ведь даже не нажала Enter..."
21110-50 = "[56cd7b]Проверка личности: вы AL-1S?"
21110-53 = "А?!"
21110-54 = "Ого!"
21110-55 = "Хм?"
21110-56 = "Нет. Я... это я. Я — \"Алиса\"."
21110-57 = "П-Погоди!"
21110-58 = "Что-то тут странно. Не думаю, что стоит жать Enter, Алиса..."
21110-60 = "Распознавание голоса подтверждено. Доступ разрешён. С возвращением, AL-1S."
21110-61 = "А?!"
21110-62 = "Тогда зачем вообще клавиатура?!"
21110-63 = "Почему оно считает, что Алису зовут AL-1S?"
21110-64 = "Эм, прости, Юзу. Стоило рассказать раньше."
21110-65 = "..."
21110-66 = "Это... моё настоящее имя...?"
21110-67 = "Компьютер, ты знаешь что-нибудь об AL-1S?"
21110-68 = "..."
21110-69 = "..."
21110-70 = "Как же долго он думает..."
21110-71 = "Экран весь расплывается. Что с ним?"
21110-72 = "Да—@!#%#@!$%@!!!"
21110-73 = "А? Ч-Что он сказал?"
21110-74 = "Это..."
21110-75 = "..."
21110-76 = "Произошла аварийная ситуация."
21110-77 = "Неминуемо отключение питания. При отключении все данные будут потеряны. Осталась 51 секунда."
21110-78 = "Что?! Н-Нет, не умирай! Нам нужно найти Г.БИБЛИЮ!"
21110-79 = "Поиск по запросу \"Г.БИБЛИЯ\". Найдено. Начать загрузку? [ДА/НЕТ]"
21110-80 = "Правда?!"
21110-81 = "Да!"
21110-82 = "Проверка Г.БИБЛИИ завершена. Идентифицирован игровой код. Для удобства человеческого восприятия и справки данные реестра 193 будут выброшены. Осталось 35 секунд…"
21110-83 = "Не выбрасывай части! Это сокровище среди разработчиков игр — нет, всего мира!"
21110-84 = "Предложение: если вы хотите получить Г.БИБЛИЮ, подключите устройство хранения для передачи данных."
21110-85 = "Что? Ты знаешь, где Г.БИБЛИЯ?"
21110-87 = "[56cd7b]Да. И вы тоже знаете."
21110-90 = "[56cd7b]Вы уже нашли её."
21110-92 = "Ч-что?!"
21110-94 = "Точнее, Г.БИБЛИЯ содержится во мне. Однако моя текущая форма скоро перестанет существовать. Пожалуйста, перенесите меня на новое устройство хранения."
21110-95 = "Хм. Что у нас есть подходящего...? О! Подойдёт карта памяти от Game Girl SP?"
21110-96 = "*вздох.mp3* Ну, сойдёт..."
21110-97 = "П-Почему он вдруг звучит таким несчастным...?"
21110-98 = "Сейчас подключу кабель. И... готово!"
21110-99 = "Начало передачи. Обнаружено недостаточно свободного места. Удаление существующих данных. Осталось 9 секунд."
21110-100 = "Чего?! Мои сохранения с Game Girl исчезают! Что ты творишь?!"
21110-101 = "Как было сказано ранее: \"Недостаточно свободного места\"."
21110-102 = "Освободи место где-нибудь ещё! Пожалуйста! Только не мои сохранения! Я так долго добывала ту экипировку..."
21110-103 = "Жаль. Удаление файлов завершено."
21110-104 = "А-а-а-а! Нее-е-ет!"
21110-105 = "..."
21110-107 = "..."
21110-108 = "А...? Питание закончилось?"
21110-109 = "Мои сохранения-я-я!"
21110-111 = "П-Погоди!"
21110-112 = "На экране что-то появилось..."
21110-113 = "Передача завершена."
21110-114 = "Что теперь?"
21110-115 = "Обнаружены новые данные."
21110-116 = "Г.БИБЛИЯ.exe."
21110-117 = "О-Она правда здесь!"
21110-118 = "Раз уж она у нас, давайте убедимся, что она настоящая!"
21110-119 = ""
21110-120 = "Запускай! О, всплыло окно..."
21110-121 = "Он просит пароль?! Вы издеваетесь?!"
21110-122 = "Е-Если пароль не слишком сложный... Веритас смогут его подобрать!"
21110-123 = "*кивает* *кивает*"
21110-124 = "И если мы это сделаем...!"
21110-125 = "Мы реально сможем сделать Tales Saga Chronicle 2... весёлой..."
21110-126 = "Мы справимся! Да! Ахаха!"
21110-127 = "Берегись, Премия Милленниума — нет, все игровые награды Кивотоса! Наша новая игра потрясёт игровую индустрию Кивотоса до основания!"
21110-129 = "Тсс! Если продолжишь так орать—"
21110-130 = ""
21110-133 = ""
21110-134 = "..."
21110-135 = "Ну конечно, они тебя услышали..."
21110-136 = "Упс..."
21110-137 = "■■■ ■ ■! ■■■!"
21110-138 = "П-Почему они так разозлились?!"
21110-139 = ""
21110-140 = "*тра-та-та-та-та*"
21110-142 = "И-и-и! Б-Бежим!"
21110-143 = "Момои, консоль!"
21110-144 = "Бери! Юзу, защищай Сенсея! Мы с Алисой задержим роботов, пока вы будете уходить!"
21110-145 = "Вперёд!"
21110-146 = "Я не проиграю теперь, когда Г.БИБЛИЯ наконец у нас!"
21110-147 = "Департамент Разработки Игр, погнали!"
21110-149 = ""
