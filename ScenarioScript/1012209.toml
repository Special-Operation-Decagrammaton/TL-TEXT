[translation]
1012209-1 = "Всё равно всё хорошо"
1012209-3 = ""
1012209-4 = "...А, привет, Сенсей."
1012209-5 = "[s] «Привет, Мика.»"
1012209-6 = ""
1012209-8 = ""
1012209-9 = "Я сама тебя сюда позвала, но мне всё равно немного неловко..."
1012209-10 = "М-Может, пойдём куда-нибудь, где можно присесть?"
1012209-11 = ""
1012209-13 = ""
1012209-15 = "Расстелив полотенце и усевшись, Мика достала бэнто."
1012209-16 = ""
1012209-18 = ""
1012209-19 = "Я попробовала сделать сэндвичи..."
1012209-20 = "...но за вкус не ручаюсь. Ага..."
1012209-21 = "Т-Тогда я открою, ладно...?"
1012209-22 = "[s] «И вот долгожданная еда от Мики...!»"
1012209-23 = "Х-Хия!"
1012209-24 = ""
1012209-28 = "О-Они немного помялись, так что выглядят, наверное, не очень аппетитно..."
1012209-29 = "Но на вкус наверняка..."
1012209-30 = "..."
1012209-31 = "Ну, рецепт я вообще-то смотрела, но..."
1012209-32 = "[ns] «Я вижу, сколько сил ты вложила!»"
1012209-33 = "Хи-хи... Вот, попробуй один, Сенсей."
1012209-34 = ""
1012209-36 = ""
1012209-37 = "Я взял один из сэндвичей."
1012209-38 = ""
1012209-40 = "[ns] «Спасибо за еду!»"
1012209-42 = "М-Может, пока рано меня благодарить..."
1012209-43 = ""
1012209-45 = ""
1012209-46 = "[ns] «Этот вкус...»"
1012209-47 = "..."
1012209-48 = "А?"
1012209-49 = "П-Почему он такой на вкус...? У этого рецепта было пять звёзд!"
1012209-50 = "Ну да, я взяла устричный соус, потому что майонеза не было..."
1012209-51 = "...и положила поменьше солёных огурцов, потому что они противные..."
1012209-52 = "А ещё я слышала, что летом нужны электролиты, поэтому добавила побольше соли... а потом сахара, чтобы ЭТО уравновесить..."
1012209-53 = "[s] «Это уже совсем другой рецепт сэндвича, Мика.»"
1012209-54 = "Н-Но...! Ну же! Я думала, всё равно получится вкусно! Это ведь звучало логично, правда?"
1012209-55 = ""
1012209-58 = ""
1012209-59 = "С-Сенсей. Не заставляй себя это есть. Если невкусно, то..."
1012209-60 = "Хм? Нормально?"
1012209-61 = "Вкусно, потому что я готовила от всего сердца...?"
1012209-62 = "Угх..."
1012209-63 = "Прости... Я хотела приготовить для тебя особенный и вкусный обед..."
1012209-64 = "[s] «И он только для меня. Спасибо, Мика.»"
1012209-65 = "...Ага. Хи-хи."
1012209-66 = "Спасибо, что съел, Сенсей."
1012209-67 = ""
1012209-69 = ""
1012209-70 = "Хм? Такое чувство, будто..."
1012209-71 = "...я немного изменилась."
1012209-72 = "Раньше я бы страшно расстроилась и разочаровалась из-за такой неудачи."
1012209-73 = "Но сейчас всё иначе. Мне не настолько плохо."
1012209-74 = "Я просто думаю... что в следующий раз смогу сделать лучше."
1012209-75 = "[s] «Очень позитивный настрой.»"
1012209-76 = "Т-Ты так думаешь?"
1012209-77 = "Может, всё время, проведённое с тобой, наконец даёт результат!"
1012209-78 = "...Или дело в том, что ты действительно сделал вид, будто тебе понравилось."
1012209-79 = "..."
1012209-80 = "Почему-то мне кажется, что всё нормально, даже если мне чего-то немного не хватает."
1012209-81 = "Да, я неуклюжая, глупая и постоянно ошибаюсь..."
1012209-82 = "Но... ведь это нормально, да?"
1012209-83 = ""
1012209-85 = "[ns1] «Конечно.»\n[ns2] «Это совершенно нормально.»"
1012209-88 = ""
1012209-89 = ""
1012209-90 = ""
1012209-91 = "...Ага!"
1012209-92 = "Так что и сейчас, и в будущем..."
1012209-93 = "...давай заботиться друг о друге, Сенсей."
