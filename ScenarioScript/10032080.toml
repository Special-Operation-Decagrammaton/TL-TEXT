[translation]
10032080-1 = "Эпилог;Один из тех дней"
10032080-4 = "Одэн и тэмпура!"
10032080-5 = "[s1] «А, да. Спасибо.»\n[s2] Устало взять тарелку."
10032080-8 = "Вы там свою дорогущую одежду знатно уделали... Вы что, по земле катались?"
10032080-9 = "Беда не приходит одна, да? Я положил вам порции побольше, чтобы поднять настроение, так что ешьте досыта! Хахаха!"
10032080-10 = "[s3] «Спасибо, господин.»\n[s4] «Хаха... Вы не так уж далеки от истины...»"
10032080-11 = ""
10032080-12 = ""
10032080-14 = ""
10032080-15 = "...По крайней мере, мы все можем сесть."
10032080-16 = "Найти ларёк, где поместимся мы все, было непросто."
10032080-17 = "Я-я постою! Или можете использовать меня вместо стула!"
10032080-18 = ""
10032080-20 = ""
10032080-22 = ""
10032080-23 = "Всё хорошо, всё хорошо! Просто сядь уже на стул, Харука!"
10032080-24 = "Ну и как ты себя чувствуешь, Ару? Нам ведь даже не заплатили!"
10032080-25 = "Я же говорила называть меня «Босс»! Не Ару!"
10032080-26 = "Мне кажется, кое-кто совсем недавно говорил, какой крутой она станет после этого."
10032080-27 = "Давайте подведём итог... Оперного театра больше нет, а самого большого босса — Аранчино — мы упустили прямо из рук."
10032080-28 = "А-а что мы должны были делать после такого взрыва?!"
10032080-29 = "Это не наша вина! Мы сами еле выбрались живыми. И не забывайте про студентов Валькирии—"
10032080-30 = ""
10032080-32 = ""
10032080-33 = "Срочные новости! Мощный взрыв в Оперном театре привёл к обрушению здания и потряс находившихся внутри зрителей."
10032080-34 = "Студент Валькирии с места происшествия сообщает, что большинство зрителей и сотрудников Оперного театра были связаны с преступной организацией!"
10032080-35 = ""
10032080-37 = ""
10032080-39 = ""
10032080-40 = "Предполагается, что взрыв стал результатом ожесточённого столкновения между конкурирующими группировками! Все подозреваемые оперативно задержаны и сейчас находятся под следствием."
10032080-41 = "...Студенты Валькирии арестовали там всех до единого бандитов."
10032080-42 = "Аранчино конец, а значит, и Союзу банд тоже."
10032080-43 = "Иными словами, тот, кто собирался нам платить, сейчас гниёт в тюрьме Валькирии, так что о деньгах можешь забыть."
10032080-44 = "Я-я так виновата! Простите! Простите! Простите, что сложила туда бомбы! Я тупая идиотка, которая не заслуживает жить!"
10032080-45 = "Ты оказала нам всем услугу, Харука."
10032080-46 = "Их ничто не заставило бы отступить. Даже если бы мы сбежали, неизвестно сколько ещё пришлось бы скрываться."
10032080-47 = "...Мгм! Ммф, мм!"
10032080-48 = ""
10032080-50 = ""
10032080-51 = "М-м..."
10032080-52 = ""
10032080-53 = ""
10032080-54 = ""
10032080-55 = ""
10032080-56 = "Я согласна со словами Каёко."
10032080-57 = "На самом деле поступок Харуки привёл к идеальному исходу ситуации, которая иначе обернулась бы бесконечной погоней."
10032080-58 = "[s5] «Рад, что тебе нравится еда.»\n[s6] «Заказывай сколько хочешь. Я угощаю.»"
10032080-61 = "...?! Я н-не могу...!"
10032080-62 = "...Это невежливо с моей стороны. Мне следует просто поблагодарить вас за предложение."
10032080-63 = "Я отплачу вам за всё, что вы сделали. Спасибо, Сенсей."
10032080-64 = ""
10032080-66 = ""
10032080-68 = ""
10032080-69 = "Хаха! Посмотрите на нас! Все вместе едим, будто старые приятели! Разве не здорово?"
10032080-70 = "Не то чтобы мы ненавидели друг друга. Просто изначально наши цели различались."
10032080-71 = "В этой работе долго не протянешь, если будешь держать обиду из-за каждой мелочи."
10032080-72 = "...Именно так думает Ару, верно, босс?"
10032080-73 = "Я-я?! Ты меня звала?"
10032080-74 = "Кхм! Вы думаете, мы какие-то неуклюжие дилетанты? Мы умеем отделять личные чувства от дела."
10032080-75 = "Крутые преступники не думают ни о чём, кроме работы. Есть деньги — будет и преступление."
10032080-76 = "Решалы 68 живут и умирают по этому девизу!"
10032080-77 = "Вот только преступление мы не закончили и денег не получили!"
10032080-78 = "М-Муцуки! Н-не цепляйся к мелочам! Неудачи неизбежны в такой рискованной сфере!"
10032080-79 = "Просто выдался один из тех дней! Нельзя сдаваться после одной-двух тяжёлых работ, ясно?"
10032080-81 = "...!"
10032080-82 = "«Один из тех дней...»"
10032080-83 = "Я многому научилась, наблюдая за вашей работой. Подрядчики обманывали меня и раз за разом оставляли без оплаты..."
10032080-84 = "Но такие случаи — это просто «один из тех дней». В следующий раз я буду помнить об этом."
10032080-85 = "Погоди-погоди. Это совсем другое. Чем ты вообще занималась...?"
10032080-86 = "...Ах."
10032080-87 = "Эм, Сенсей..."
10032080-88 = "Насчёт... Насчёт того документального фильма."
10032080-89 = "А что с ним? О чём Сенсей теперь будет снимать образовательный фильм? О взорванном Оперном театре и отменённом концерте?"
10032080-90 = ""
10032080-92 = ""
10032080-93 = "...О."
10032080-94 = "...А!"
10032080-95 = "*ахает*"
10032080-96 = "...Ой."
10032080-97 = ""
10032080-100 = "[ns] «...Ахаха.»"
10032080-101 = ""
10032080-104 = "[ns] «Ну...»"
10032080-110 = "[ns] «...Один из тех дней, да?»"
10032080-111 = "Из «Оперы 0068» с любовью!"
