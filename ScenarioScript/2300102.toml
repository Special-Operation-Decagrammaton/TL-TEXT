[translation]
2300102-1 = "Пойдём за продуктами?"
2300102-2 = "О, Сенсей. Т-Ты всё-таки пришёл."
2300102-3 = "[s1] «Что такое?»\n[s2] «Конечно. Ты же попросила меня прийти.»"
2300102-4 = "Я-я собиралась сегодня за продуктами."
2300102-5 = "Я-я собиралась сегодня за продуктами."
2300102-6 = "...и, похоже, покупок будет слишком много, чтобы я донесла всё сама."
2300102-7 = "Мне неловко просить учителя о помощи в такой мелочи, но..."
2300102-8 = "[s] «Дальше можешь не объяснять. Если могу помочь — помогу.»"
2300102-9 = "Хи-хи. Вот это Сенсей, которого я знаю."
2300102-10 = "Хорошо, тогда за покупками."
2300102-11 = "У меня длинный список! ♪"
2300102-13 = "Ух ты. Супермаркеты всегда меня радуют."
2300102-14 = "[s] «Похоже, тебе здесь очень нравится.»"
2300102-15 = "Наверное, да..."
2300102-16 = "Есть что-то особенное в прохладном воздухе между рядами со свежими продуктами — сердце начинает биться быстрее."
2300102-17 = "Все эти яркие фрукты и овощи на витринах просто завораживают."
2300102-18 = "Настоящая сокровищница для повара!"
2300102-19 = "Все ведь так себя чувствуют, правда?"
2300102-20 = "[s] «Не уверен насчёт этого.»"
2300102-21 = ""
2300102-22 = "О! Смотри, Сенсей. На этом огурце даже шипы ещё целы."
2300102-23 = "Я сразу вижу, что он хороший: твёрдый, а кончик всё ещё влажный."
2300102-24 = ""
2300102-25 = ""
2300102-26 = ""
2300102-27 = "О! И этот арбуз отличный! Просто послушай, как он звучит, если постучать!"
2300102-28 = "[s] «Ты отлично разбираешься в продуктах, Фуука.»"
2300102-29 = "П-Прости. Кажется, я немного увлеклась. Ахаха..."
2300102-30 = "Я всегда стараюсь изо всех сил, когда готовлю для академии..."
2300102-31 = "...но очень трудно сохранить естественный вкус ингредиентов, когда готовишь огромными порциями."
2300102-32 = "Поэтому столько студентов жалуются, что еда безвкусная."
2300102-33 = "[s] «Я знаю, сколько сил ты вкладываешь, Фуука.»"
2300102-34 = "Хватит. Ты меня смущаешь..."
2300102-35 = "Г-Главное! Это был последний нужный ингредиент."
2300102-36 = "[s] «Тогда пора на кассу?»"
2300102-37 = "Вовсе нет, Сенсей."
2300102-38 = "Настоящие покупки только начинаются."
2300102-39 = "[s] «Только начинаются...?»"
2300102-41 = "Извините! Я хотела бы кое-что купить."
2300102-42 = "Чем могу помочь, госпожа?"
2300102-43 = "Мне нравится, насколько свежие у вас перцы и огурцы. Хороший размер, отличное качество..."
2300102-44 = "Из таких ингредиентов я точно смогу приготовить что-нибудь вкусное."
2300102-45 = "Они настолько хороши, что я всё время возвращаюсь."
2300102-46 = "О, так вы постоянная покупательница. Можно спросить, к чему вы ведёте...?"
2300102-47 = "Видите ли, я хотела бы начать закупаться оптом, если возможно."
2300102-48 = "Мне нужно столько, чтобы накормить всех студентов Геенны — и ещё осталось."
2300102-49 = "А, понятно! У вас есть желаемая цена?"
2300102-50 = "Раз я собираюсь купить столько всего сразу..."
2300102-51 = ""
2300102-52 = "Как вам такая цена?"
2300102-53 = ""
2300102-54 = ""
2300102-55 = "Угу. Насчёт такой цены придётся посоветоваться с управляющим..."
2300102-56 = "Предлагаю так: по этой цене я также куплю месячный запас продуктов для нашей столовой."
2300102-57 = "*вздох удивления*...!"
2300102-58 = "Х-Хорошо. По рукам."
2300102-59 = "Рада слышать. Приятно иметь с вами дело."
2300102-61 = "[ns] «Фуука, это было впечатляюще...»"
2300102-62 = "Я президент Клуба школьного питания Геенны. Это пустяки!"
2300102-63 = "Ну что, возвращаемся, Сенсей!"
2300102-65 = "(После этого мне пришлось тащить вместе с Фуукой совершенно нелепое количество еды обратно в Геенну.)"
