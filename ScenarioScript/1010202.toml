[translation]
1010202-1 = "Романтика купальника"
1010202-2 = "Сообщения Хиёри в MomoTalk разожгли моё любопытство, и я отправился в её убежище."
1010202-4 = ""
1010202-5 = "Хи-хи, хи-хи..."
1010202-6 = "А, Сенсей?"
1010202-7 = "В-Вы здесь?!"
1010202-8 = "[s] «Привет, Хиёри. Что делаешь?»"
1010202-9 = "А... видите ли..."
1010202-10 = "Хи-хи. Я пытаюсь выиграть купальник... поэтому кое-что пишу..."
1010202-11 = "Это розыгрыш от журнала... Если отправить написанную историю, тебя включат в жеребьёвку."
1010202-12 = "Моя история о том, как мы переживаем это жаркое лето в заброшенном здании, где нет ни единого кондиционера."
1010202-13 = "Организаторы так растрогаются нашими страданиями, что из чувства вины пришлют мне купальник... Хи-хи-хи."
1010202-14 = "[s1] «Бесплатный купальник, значит...?»\n[s2] «История и правда душераздирающая...»"
1010202-17 = "Если отправлю заявку сегодня, у редакции будет достаточно времени прислать приз до нашей поездки на пляж!"
1010202-18 = "Так что... я хотела спросить, можно ли указать здание Шале как мой постоянный адрес? Ну, знаете, у нас ведь адреса нет..."
1010202-19 = "Если вы сможете получить посылку, когда её отправят, я буду невероятно, бесконечно благодарна."
1010202-20 = "[s] «Без проблем, но...»"
1010202-21 = ""
1010202-23 = "[ns] Посмотреть на журнал."
1010202-24 = "...Журнал был выпущен два месяца назад."
1010202-25 = "Д-Да? Что такое, Сенсей?"
1010202-26 = "У вас такое убитое лицо! Вас так расстроила печаль моей истории?"
1010202-27 = "О-Она и правда жалкая... Моя жизнь ничем не лучше этого заброшенного здания..."
1010202-28 = "Но хоть раз... мои страдания могут сыграть мне на руку!"
1010202-29 = "Сокрушительное отчаяние моей истории повысит шансы выиграть купальник!"
1010202-30 = "[s3] «Эм...»\n[s4] «(Не будем говорить ей правду...)»"
1010202-33 = "Хи-хи. Я только что закончила заполнять открытку для розыгрыша."
1010202-34 = "Сенсей, можете отправить её по дороге домой? Хи-хи. Спасибо!"
1010202-35 = "Я едва сдерживаю волнение! Новый купальник!"
1010202-37 = "Я просто забрал открытку с собой в Шале, ведь отправлять заявку уже не было смысла."
1010202-38 = "[ns] «Просто прочитаю, что она написала на открытке...»"
1010202-40 = "Здравствуйте. Я всего лишь девушка, чья повседневная жизнь — непрерывная борьба за выживание."
1010202-41 = "Моя жизнь подобна никому не нужному камешку, отброшенному в сторону, лишённому смысла и радости. Моя единственная мечта — хотя бы раз увидеть пляж."
1010202-42 = "Пожалуйста, помогите исполнить мою скромную, ничтожную мечту."
1010202-43 = "Желаемый подарок: Золотой роскошный VIP-купальник премиум-класса"
1010202-46 = "[ns] «Эм...»"
1010202-48 = "В итоге я купил купальник в торговом центре и упаковал его так, будто он пришёл из редакции журнала."
1010202-50 = "С-Сенсей! Э-Эта коробка!"
1010202-51 = "Неужели это действительно...?!"
1010202-52 = "[s5] «Ты права! Поздравляю, Хиёри!»\n[s6] «Ты выиграла розыгрыш!»"
1010202-55 = "А-А-А-А-А!!"
1010202-56 = "Даже солнечный луч может заглянуть в мышиную нору! Даже в мрачной канализации расцветают цветы! Н-Неужели со мной... действительно может случиться что-то настолько прекрасное?!"
1010202-57 = ""
1010202-59 = ""
1010202-60 = "Это не тот Золотой роскошный VIP-купальник премиум-класса, который я хотела, но всё равно совершенно новый купальник...!"
1010202-61 = "Хи-хи. Спасибо, что принесли мой приз, Сенсей!"
1010202-62 = "Я-я прямо сейчас его примерю!"
1010202-66 = "Ну как? Хи-хи-хи..."
1010202-67 = "[s] «Отлично выглядишь.»"
1010202-68 = "Хи-хи. Кажется, я никогда в жизни не была так счастлива."
1010202-69 = "Наверное, это... награда... за все мои страдания...!"
1010202-70 = ""
1010202-72 = ""
1010202-73 = "П-Подождите! Сейчас не время для этого!"
1010202-74 = ""
1010202-76 = ""
1010202-77 = "Хи-хи..."
1010202-78 = "[s] «...Что ты делаешь?»"
1010202-79 = "Заполняю открытки!"
1010202-80 = "Этот журнал разыгрывает солнцезащитные очки, этот — огромный надувной круг, а здесь можно выиграть купон на гигантскую порцию какигори!"
1010202-81 = "Хи-хи-хи... А что, если я выиграю всё? У меня будет... самое роскошное лето в моей жизни!"
1010202-82 = "Н-Не волнуйтесь, Сенсей. Я и для вас несколько заполню!"
1010202-83 = "Хи-хи. Я так жду поездки на пляж!"
