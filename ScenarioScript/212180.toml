212180-67 = "Единственный способ вернуть Геенне величие — следовать идеологии Императора-тирана!"
212180-68 = "Сейчас всё действительно ЛУЧШЕ! Я доказала, что строгий порядок гораздо сильнее жалкой свободы!"
