[translation]
1015305-1 = "To Be Special"
1015305-2 = "Gehenna Cup Arena"
1015305-3 = "(While enroute to the arena's office building for work...)"
1015305-6 = "(I spotted Hifumi in the distance.)"
1015305-12 = "U-um... I have to leave soon..."
1015305-13 = "Aww, but! It must've been fate that we met here! I'm a HUGE fan!"
1015305-14 = "Your last race was incredible! #nEspecially the part where you crushed all of your rivals in the forest!"
1015305-15 = "Could I have your autograph...!? #nI absolutely LOVE how aggressively you play!"
1015305-16 = "It's not like I'm doing it on purpose... Auuu..."
1015305-17 = "No way! Everyone's been talking about how legendary of a match it was!"
1015305-18 = "But you haven't been participating in a lot of matches. Is there a reason for that?"
1015305-19 = "A-auuuu..."
1015305-21 = "I-I'm sorry! Please excuse me!!"
1015305-25 = "Ah... She ran away."
1015305-26 = "I wanted to get a picture of us together. Shame."
1015305-27 = "That mysteriousness is part of her charm. #nHow she avoids every photo and turns down every interview."
1015305-28 = "So talented yet so humble! She truly is wonderful...!"
1015305-30 = "[ns] \"Hifumi! Wait up!!\""
1015305-32 = "(I tried to chase after Hifumi...)"
1015305-33 = "(But I ended up losing sight of her inside the crowd.)"
1015305-39 = "(Exhausted after searching all around, I decided to take a short break.)"
1015305-46 = "[ns] \"Hifumi?\""
1015305-47 = "Sensei? What are you doing here?"
1015305-48 = "...You were taking a walk? Ahaha, what a coincidence. I was actually looking for a#nchange of pace myself as well."
1015305-49 = "[s] \"Mind if I hitch a ride?\""
1015305-50 = "Of course!"
1015305-51 = "Right this way. Come on in."
1015305-55 = "Ah, you can use this Peroro-sama blanket if you'd like."
1015305-56 = "Now then, where would you like to go?"
1015305-57 = "[s] \"Wherever you want to go!\""
1015305-58 = "Somewhere I want to go..."
1015305-61 = "...That place then, I suppose."
1015305-62 = "Let's set off!"
1015305-67 = "Unlit Gehenna Cup Arena"
1015305-69 = "—We've arrived."
1015305-70 = "I brought us to the track."
1015305-71 = "...It gets a little cold here at night. #nWould you like a cup of tea? I can brew it inside of Crusader-chan."
1015305-72 = "There's a certain charm to enjoying a cup of tea while taking in the view of the#ntrack at night."
1015305-73 = "[s] \"Sure, I'll have a cup then.\""
1015305-74 = "All right, I'll have it ready soon!"
1015305-79 = "...Sensei."
1015305-80 = "I... think people who have something special are amazing.. #nAfter all, I'm just an ordinary person."
1015305-81 = "But... What if— and I really mean what if. #nWhat if I found out that I was actually special in some way... #nBut it wasn't in a way that I wanted... In what way do you think it is?"
1015305-82 = "[s1] \"You're especially beautiful?\"\n[s2] \"You're especially cute?\"\n[s3] \"You're especially kind?\""
1015305-86 = "Auuu...! #nI'm happy to hear that, but that isn't what I meant...!"
1015305-90 = "I'm talking about... tanks."
1015305-92 = "I just enjoy driving them, which is how I ended up developing an interest."
1015305-93 = "...But before I knew it, I began to slowly pick up fame. #nSome people have even started to call out to me."
1015305-94 = "But... All this attention has been putting pressure on me."
1015305-96 = "I never would've imagined that... I'd become someone that others saw as #nspecial."
1015305-99 = "[ns] \"...Do you find it to be painful?\""
1015305-100 = "Ah, not at all! if I can make others happy like this, then I'm happy as well."
1015305-101 = "It's just... The rumors surrounding me have gotten out of hand, and now I've a#nrather scary image attached to me."
1015305-102 = "Even though all I've been doing is facing everything with earnest... Auu..."
1015305-103 = "...That's why on the day of my races, I like to visit the track like this—#noutside of the hustle and bustle—and just take in the view."
1015305-104 = "After being special for one day, it helps me to shift gears back into my ordinary,#neveryday life."
1015305-105 = "Funny, isn't it? I used to long for something special, but now here I am wanting to be ordinary again."
1015305-106 = "[s4] \"I think it's great to have something special.\"\n[s5] \"But it's just as great to be your ordinary self, Hifumi.\""
1015305-109 = "The special part of me... and the ordinary me..."
1015305-112 = "...Thank you, Sensei."
1015305-113 = "Ehehe, I feel a lot better now!"
1015305-114 = "Would you like another cup of tea?"
1015305-115 = "[s] \"Sure! I'll have a special cup of tea!\""
1015305-116 = "Right away!"
1015305-118 = "(After that, Hifumi and I enjoyed our cups of black tea, all the while admiring the#ntrack illuminated by the moonlight.)"