[translation]
1015305-1 = "Special"
1015305-2 = "Gehenna Cup Stadium"
1015305-3 = "(Since I had some work to do, I was on my way to the stadium office—)"
1015305-6 = "(I caught a glimpse of Hifumi in the distance.)"
1015305-12 = "U-Um... I should be heading home soon..."
1015305-13 = "No, wait! Meeting you in a place like this must be fate!! I'm a huge fan!"
1015305-14 = "Your race the other day was amazing! #nThe one where you wiped out all your rivals in the forest!"
1015305-15 = "Please give me your autograph...! #nI just love your aggressive playstyle!"
1015305-16 = "I didn't mean to do that... Awoo..."
1015305-17 = "No, no, everyone's been talking about what an incredible match it was!"
1015305-18 = "But how come you haven't been in many matches until now?"
1015305-19 = "A-Awoo..."
1015305-21 = "I'm sorry!! Excuse me!!"
1015305-25 = "Ah... she ran away."
1015305-26 = "And I wanted to take a picture with her, too. What a shame."
1015305-27 = "Her mysterious vibe is part of her charm, though. #nI heard she avoids photos and turns down every interview."
1015305-28 = "She's got such incredible talent and yet she's so humble...! How wonderful...!"
1015305-30 = "[ns] \"Hifumi! Wait!!\""
1015305-32 = "(I tried chasing after Hifumi, but...)"
1015305-33 = "(I lost sight of her in the crowd.)"
1015305-39 = "(I got tired from running around looking for her, so I decided to take a break.)"
1015305-46 = "[ns] \"Hifumi?\""
1015305-47 = "Sensei? What brings you here?"
1015305-48 = "...Just out for a walk? #nAhaha, what a coincidence. I was just looking to clear my head."
1015305-49 = "[s] \"Mind if I hitch a ride?\""
1015305-50 = "Of course not!"
1015305-51 = "Go right ahead, please."
1015305-55 = "Ah, please use this Pero-sama blanket if you'd like."
1015305-56 = "Now then, where shall we go?"
1015305-57 = "[s] \"Wherever Hifumi wants to go!\""
1015305-58 = "Where I want to go..."
1015305-61 = "...Then, let's go there."
1015305-62 = "Setting off!"
1015305-67 = "The Gehenna Cup Stadium with its lights turned off"
1015305-69 = "—We've arrived."
1015305-70 = "It's the circuit."
1015305-71 = "...It gets a bit chilly at night. #nWe can brew some tea using Crusader-chan, would you like a cup?"
1015305-72 = "Having a tea time while looking out at the night circuit has its own unique charm, don't you think?"
1015305-73 = "[s] \"Yeah, I'd love some.\""
1015305-74 = "Yes, I'll prepare it right away!"
1015305-79 = "...Sensei."
1015305-80 = "I think... people who are special are amazing. #nWell, I'm just ordinary."
1015305-81 = "So... what if. What if, hypothetically? #nSuppose you found out that you actually had something \"special\" about you... #nBut what if it wasn't the kind of special you were looking for... how would you feel?"
1015305-82 = "[s1] \"Extraordinarily pretty?\"\n[s2] \"Extraordinarily cute?\"\n[s3] \"Extraordinarily kind?\""
1015305-86 = "Awoo...! #nI appreciate the kind words, but that's not what I mean...!"
1015305-90 = "It has to do with... tanks."
1015305-92 = "I just liked driving them, and I guess I got interested in them somehow."
1015305-93 = "...Before I knew it, it seems I'd become a little famous. #nAnd because of that, people sometimes come up to talk to me..."
1015305-94 = "Standing out like this brings a lot of pressure, or rather..."
1015305-96 = "I never imagined I would... become someone's \"special\" in a way like this."
1015305-99 = "[ns] \"...Is it painful for you?\""
1015305-100 = "Ah, no! If it makes people happy, then I'm happy too."
1015305-101 = "However... rumors seem to take on a life of their own, and people have started seeing me in a scary light."
1015305-102 = "I was just taking it seriously... awoo..."
1015305-103 = "...That's why, on days with a race, I come here to look at the quiet circuit."
1015305-104 = "It helps me switch gears, as if a special day has ended and I'm returning to my ordinary daily life."
1015305-105 = "It's funny, isn't it? #nI used to envy being special, and yet here I am wishing to go back to being ordinary..."
1015305-106 = "[s4] \"I think being 'special' is wonderful, too.\"\n[s5] \"But the usual Hifumi is just as wonderful, equally so.\""
1015305-109 = "My special side, and my usual self..."
1015305-112 = "...Thank you, Sensei."
1015305-113 = "Hehe, that cheered me up!"
1015305-114 = "Would you like another cup of tea?"
1015305-115 = "[s] \"Yeah! Let's make it a special cup!\""
1015305-116 = "Yes!"
1015305-118 = "(Afterwards, while looking out at the moonlight-illuminated circuit, #nI enjoyed black tea together with Hifumi.)"
