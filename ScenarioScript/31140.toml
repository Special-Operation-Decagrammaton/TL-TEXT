[translation]
31140-1 = "Episódio 14;A Vice-Presidente do Comitê de Justiça (1)"
31140-2 = "Depois disso, a sessão de estudos continuou até tarde da noite."
31140-3 = "Koharu, uma dúvida."
31140-4 = "Aham... Quê? Eu? Pra mim!?"
31140-5 = "Sim, pra você, Koharu. Devemos estar estudando a mesma parte agora. É sobre esta questão aqui..."
31140-6 = "T-Tá..."
31140-7 = "...Ah, essa eu sei!"
31140-8 = "Se não me engano, você faz assim: traça uma linha formando um ângulo de 90 graus com a base..."
31140-9 = "Aí, este triângulo e este outro ficam iguais. Entendeu?"
31140-10 = "...Entendi, então é isso."
31140-11 = "Você me salvou. Isso com certeza explica por que você é da elite do Comitê de Justiça."
31140-12 = "...!?"
31140-13 = "I-Isso mesmo! Afinal, eu sou da elite!!"
31140-14 = "...S-Se tiver mais alguma coisa que você não entender, pode perguntar pra mim. Pra você, Azusa... eu abro uma exceção."
31140-15 = "Obrigada, isso ajuda muito."
31140-19 = "Ora, ora..."
31140-20 = "Como esperado de duas pessoas que já se conheceram nuas... Vocês já chegaram num nível bem profundo de intimidade, não é...? ♡"
31140-21 = "Ei, o que você tá dizendo!? Não tem nada a ver com isso!?"
31140-22 = "Hum? Você também quer que eu lave o seu corpo, Hanako?"
31140-23 = "E-Err, hum..."
31140-27 = "Ah, Koharu. Quero perguntar mais uma coisa."
31140-29 = "Hum? Essa questão é, err..."
31140-30 = "É uma questão que nem você sabe, Koharu?"
31140-31 = "Huum... Eu tenho quase certeza de que vi isso num livro de referência..."
31140-32 = "E-Espera um pouquinho."
31140-33 = "Tenho certeza de que eu trouxe..."
31140-37 = "Hup."
31140-44 = "Tem nesse livro de referência?"
31140-45 = "Sim, neste livro de—"
31140-46 = "...Ué?"
31140-47 = "É um livro pervertido, não é?"
31140-52 = "Uwaaaaah!? P-Por quê!?"
31140-53 = "Koharu-chan, isso aí é um livro pervertido, não é? Bem, de certa forma pode até servir como livro de referência. E não adianta esconder, estava escrito \"R18\" bem grande ali, viu?"
31140-54 = "N-Não é! Você viu errado! Enfim, não é isso! Com certeza não é!!"
31140-58 = "Você não consegue enganar os meus olhos, era definitivamente um livro sobre fazer aquelas coisas. E dos bem pesados, ainda por cima..."
31140-59 = "Pelo que pude notar, é um conteúdo de um nível difícil de se encontrar até mesmo em Trinity... não, em toda Kivotos. Com certeza cheio de pele roçando em pele, partes sensíveis se esfregando, gemidos ecoando para todos os lados e a razão indo embora...!"
31140-60 = "Por que você tem um livro desses? Se não me engano, isso é proibido pelas regras da escola, não é...?"
31140-61 = "N-Não, é que... i-isso não é meu de verdade, err..."
31140-62 = "Mas saiu de dentro da sua bolsa, não foi, Koharu-chan? E ainda trazer até o alojamento do acampamento... É o seu favorito?"
31140-63 = "Entendo... Então a Koharu-chan, sempre tão séria, lê livros pervertidos..."
31140-68 = "...Não. Entendo, faz sentido. Pensando bem, nem é algo tão estranho assim, não é?"
31140-69 = "Com a preparação toda em dia... Ou seja, é um item essencial para o nosso acampamento, não é, Koharu-chan? ♡"
31140-73 = "J-Já disse que não é nada dissooooo!!"
31140-74 = "?"
31140-75 = "E-Err, Hanako-chan... Acho melhor parar por aí..."
31140-76 = "Talvez eu tenha passado um pouco dos limites, peço mil desculpas... Eu só achei que nós duas fôssemos nos dar muito bem nesse assunto..."
31140-81 = "Buáá, snif..."
31140-83 = "(...Snif, snif)"
31140-84 = "Err, Koharu-chan..."
31140-85 = "Hum, foi algo que você confiscou durante as atividades do Comitê de Justiça e acabou esquecendo dentro da bolsa... Foi algo assim, não foi?"
31140-86 = "...Sim. Eu... cuidava do gerenciamento dos itens confiscados e tal... então isso aí é mesmo daquela época..."
31140-87 = "Entendo. Falando nisso, ouvi boatos de que no subsolo da Biblioteca Antiga de Trinity há uma pilha enorme de livros proibidos... Não é nada estranho que o Comitê de Justiça confisque várias coisas, incluindo livros desse tipo."
31140-88 = "Huum... Sendo assim, acho que seria melhor devolver esse item confiscado o mais rápido possível, mas o que devemos fazer?"
31140-89 = "É-É verdade... Eu tinha esquecido completamente, mas..."
31140-90 = "Talvez seja melhor ir devolver antes que percebam que a contagem não bate e isso vire uma confusão..."
31140-91 = "Se você for escondida agora e devolver lá no Comitê de Justiça sem ninguém ver, vai dar tudo certo, não acha?"
31140-92 = "Quê? Agora?"
31140-93 = "[s] \"Nesse caso, quer que eu vá com você, Koharu?\""
31140-94 = "V-Você, Sensei...?"
31140-95 = "...É verdade. Se o Sensei estiver junto, mesmo que por acaso alguém como a Hasumi-san descubra, ela provavelmente não vai ficar tão brava..."
31140-96 = "A propósito, Koharu-chan, deixando isso de lado, se tiver outras recomendações, não deixe de me contar♡"
31140-101 = "C-Cala a boca, sua idiota!!"
31140-103 = "E assim, decidi acompanhar a Koharu até a sala do Comitê de Justiça."
31140-105 = "Próximo;A Vice-Presidente do Comitê de Justiça (2)"
