[translation]
31140-1 = "Эпизод 14;Вице-президент Комитета правосудия, часть 1"
31140-2 = "Девочки продолжали учиться до вечера."
31140-3 = "Вопрос, Кохару."
31140-4 = "Чт...? Почему я?"
31140-5 = "Потому что мы изучаем один материал. У меня вопрос по этой задаче."
31140-6 = "Л-Ладно."
31140-7 = "Погоди. Я это знаю!"
31140-8 = "Здесь... нужно провести вспомогательную линию от нижней точки под прямым углом. Вот так!"
31140-9 = "Так, этот треугольник и этот пропорциональны, верно? Смотри сюда, видишь?"
31140-10 = "О. Теперь понятно."
31140-11 = "Спасибо за помощь. От элиты Комитета правосудия другого и не ждёшь."
31140-12 = "...?!"
31140-13 = "Т-Точно! Рада, что ты понимаешь."
31140-14 = "Если встретишь что-то непонятное, всегда можешь спросить меня. Я с радостью помогу."
31140-15 = "Хорошо. Буду должна."
31140-16 = ""
31140-18 = ""
31140-19 = "Ну-ну."
31140-20 = "Они отлично ладят, правда? Наверное, потому что так сблизились, узнав друг друга совсем близко. ♥"
31140-21 = "Ч-Что ты только что сказала?! Это тут ни при чём!"
31140-22 = "Не хочу казаться предвзятой. Я могу помочь помыться и тебе, Ханако."
31140-23 = "Э-Эм..."
31140-24 = ""
31140-26 = ""
31140-27 = "О. Я хотела задать тебе ещё один вопрос, Кохару."
31140-29 = "Вот этот? Эта задача немного..."
31140-30 = "Ты тоже не знаешь решение?"
31140-31 = "Ч-Что?! Нет! Но я точно видела это в справочнике."
31140-32 = "Подожди здесь."
31140-33 = "*роется* Где же оно? Я знаю, что где-то здесь..."
31140-34 = ""
31140-37 = "Вот!"
31140-38 = ""
31140-41 = ""
31140-42 = ""
31140-43 = ""
31140-44 = "В этом учебнике есть ответ?"
31140-45 = "Да, именно он!"
31140-46 = "А?"
31140-47 = "Какая аппетитная порнушка у тебя там."
31140-48 = ""
31140-50 = ""
31140-52 = "А-а-а! П-Почему это здесь?!"
31140-53 = "Не знала, что ты читаешь такое. Не прячься, юная леди. На обложке же прямо написано «Только для взрослых»."
31140-54 = "Э-Это не то, чем кажется! Не моё! Это не моё!!!"
31140-55 = ""
31140-57 = ""
31140-58 = "Кого ты пытаешься обмануть? Я узнаю эротику, когда вижу — особенно такую... пожёстче обычной."
31140-59 = "Вот это качественный товар! Такое в Тринити не найдёшь — редкость даже во всём Кивотосе! Горячее, развратное, возбуждающее добро, от которого кричишь и выбрасываешь рациональность в окно!"
31140-60 = "Почему именно у тебя такое? Это ведь наверняка нарушает школьные правила, да?"
31140-61 = "Н-Нет... То есть да! Я же сказала, это т-точно не моё..."
31140-62 = "Но оно было у тебя в сумке, верно? И ты притащила это аж в учебный лагерь. Похоже, из дома без него не выходишь."
31140-63 = "Кто бы мог подумать, что упрямая и чопорная Кохару может быть такой непослушной?"
31140-64 = ""
31140-66 = ""
31140-67 = ""
31140-68 = "Хотя, если подумать, я тебя не виню."
31140-69 = "Всё-таки мы надолго застряли в учебном лагере. ♥"
31140-70 = ""
31140-72 = ""
31140-73 = "ВСЁ НЕ ТАК!!!"
31140-74 = "...?"
31140-75 = "Ханако... Думаю, ты уже достаточно её подразнила."
31140-76 = "Возможно, я немного перегнула. Просто так обрадовалась, что нашёлся кто-то, кто меня понимает."
31140-77 = ""
31140-79 = ""
31140-80 = ""
31140-81 = "*шмыг* *шмыг*"
31140-83 = "..."
31140-84 = "Так, Кохару..."
31140-85 = "Ты говоришь, что случайно принесла книгу, которую конфисковала во время работы в Комитете правосудия? Верно?"
31140-86 = "*шмыг* Да. Учет конфискованных вещей входит в мои обязанности."
31140-87 = "Вот оно что. Я слышала слухи, что подвал старой библиотеки забит стопками запрещённых книг. Наверняка часть конфисковал Комитет правосудия."
31140-88 = "Но разве это не проблема? Теперь, когда ты в Клубе дополнительных занятий, за такую вещь можно серьёзно влететь."
31140-89 = "*шмыг* Это была честная ошибка. Я забыла её сдать..."
31140-90 = "Может, стоит вернуть, пока никто не заметил пропажу."
31140-91 = "Не можешь тайком вернуться в штаб Комитета правосудия?"
31140-92 = "Сейчас?"
31140-93 = "[s] «Я пойду с тобой.»"
31140-94 = "Вы серьёзно, Сенсей?"
31140-95 = "Прекрасная идея. С Сенсеем рядом ты куда меньше рискуешь разозлить Хасуми."
31140-96 = "Эй, Кохару. Только постарайся «случайно» не унести по дороге назад продолжение."
31140-97 = ""
31140-99 = ""
31140-101 = "НЕ УНЕСУ!"
31140-103 = "После этого мы с Кохару отправились в клубную комнату Комитета правосудия."
31140-105 = "Следующий эпизод;Вице-президент Комитета правосудия, часть 2"
