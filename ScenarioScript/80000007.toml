[translation]
80000007-1 = "Лучшее средство от усталости"
80000007-2 = "Офис Шале"
80000007-3 = "Я как раз заканчивал работу после бессонной ночи, когда в офис пришла Ханаэ."
80000007-4 = ""
80000007-7 = "Сенсей, вы опять всю ночь работали?"
80000007-8 = "Я ведь постоянно говорю вам, что это вредно для здоровья..."
80000007-9 = "[s1] «Только так я могла закончить работу.»\n[s2] «Говоришь так, будто у меня был выбор...»"
80000007-10 = "Ладно-ладно. Тогда хотя бы позвольте приготовить вам что-нибудь, чтобы восстановиться после ночи."
80000007-11 = "Ладно-ладно. Тогда хотя бы позвольте приготовить вам что-нибудь, чтобы восстановиться после ночи."
80000007-12 = "Ложитесь и можете немного подремать."
80000007-13 = "[s] «Но я уже выпил кучу кофе...»"
80000007-14 = "Ничего страшного!"
80000007-15 = "Этот напиток будет куда мощнее кофе."
80000007-16 = ""
80000007-18 = ""
80000007-19 = "[s] «Теперь мне страшно...»"
80000007-25 = "Ханаэ вернулась с чашкой тёмной подозрительной жидкости."
80000007-26 = "Простите, что заставила ждать. Вот особая концентрированная кофеиновая смесь Ханаэ!"
80000007-27 = "В ней в 200 раз больше кофеина, чем в обычной чашке кофе.#nПосле неё вы точно будете бодрствовать!"
80000007-28 = "[s] «Звучит так, будто я после неё умру!»"
80000007-29 = "А? Не хотите?"
80000007-30 = "Жаль. Из остального у нас есть только молотый кофе и порошок для горячего шоколада."
80000007-31 = "[s] «От горячего шоколада я бы не отказался...»"
80000007-32 = "Вы уверены? Кофеина там почти нет, от сонливости он не поможет."
80000007-33 = "Но если вы этого хотите, хорошо."
80000007-34 = "Подождите минутку, я принесу вам горячий шоколад!"
80000007-35 = ""
80000007-37 = ""
80000007-45 = "Я верну-у-улась. Вот особый горячий шоколад Ханаэ!"
80000007-46 = "Я ещё сделала милого зайчика из маршмеллоу!"
80000007-47 = "[s] Выпить горячий шоколад."
80000007-52 = "Что за...? Вы уже всё выпили! Рада, что вам понравилось, хи-хи.#nХорошо, что по дороге сюда я купила ингредиенты."
80000007-53 = "Кстати, сегодня утром многие магазины рекламировали шоколад. Что происходит?"
80000007-54 = "А? Потому что сегодня День святого Валентина?"
80000007-55 = "Ха-ха... Ой. Совсем вылетело из головы. Время и правда летит."
80000007-56 = "Получается, мой горячий шоколад оказался очень кстати.#nКакое счастливое совпадение!"
80000007-57 = ""
80000007-59 = ""
80000007-60 = "С Днём святого Валентина, Сенсей."
