[translation]
84312101300-5 = ""
84312101300-6 = "...Какого чёрта? Она ушла?"
84312101300-7 = "Ни слова не сказав."
84312101300-8 = "...Я думала, она хотя бы оставит сообщение."
84312101300-9 = "Разочарована?"
84312101300-10 = "Если честно, немного..."
84312101300-11 = "Хаха, ну..."
84312101300-12 = "Ты всё ещё не так хорошо её знаешь. Будь она из тех, кто делает такие вещи, всё бы вообще не дошло до этого. Скажем так."
84312101300-13 = "Но... ты уже начинаешь её понимать."
84312101300-14 = "И как одна из её самых давних знакомых скажу только одно... не расстраивайся слишком сильно. Ты ей нравишься, а это редкость."
84312101300-15 = "И не только ей. За время всего этого события... ты понравилась и мне."
84312101300-16 = "Честно говоря, я не ожидала настолько многого от дворянки из Тринити. Если это не слишком прямо."
84312101300-18 = "Неру..."
84312101300-19 = "Фуфу... Если бы я была здесь как член Чаепития, это могло бы прозвучать слишком прямо, но всё нормально. Сейчас я не представляю их."
84312101300-20 = "Знаешь, я тут подумала: для члена Чаепития ты куда гибче, чем я ожидала."
84312101300-21 = "Если продолжишь эту мысль, начнёшь говорить о моих подругах, а это я уже не спущу."
84312101300-22 = "Уф, моя вина. Прости-прости. Беру слова назад."
84312101300-23 = "...Так ты теперь возвращаешься?"
84312101300-24 = "Стоило бы. Хочешь пойти со мной к Сенсею?"
84312101300-25 = "К Сенсею? ...Хм, почему бы и нет? Больше нет смысла скрывать, что мы работали вместе."
84312101300-26 = "Пойдём. Мне многое хочется ему рассказать."
84312101300-27 = ""
84312101300-29 = ""
84312101300-30 = "...А, перед этим. Подойди на секунду."
84312101300-31 = ""
84312101300-33 = ""
84312101300-34 = "...? А? Что это вдруг...?"
84312101300-35 = ""
84312101300-37 = ""
84312101300-41 = ""
84312101300-43 = ""
84312101300-47 = "Хорошо. Отлично получилось."
84312101300-48 = "...Неру?"
84312101300-49 = ""
84312101300-51 = ""
84312101300-52 = "Теперь, когда мы сделали совместное фото, если оставим его здесь, она увидит, когда вернётся. Даже если не сразу."
84312101300-53 = "Иногда мне надоедает ждать, пока Рио сама проявит инициативу в дружбе."
84312101300-54 = "Но уверена, ей понравится. Даже если ничего не скажет."
84312101300-55 = "Вот как..."
84312101300-56 = "По вам и правда видно, что вы давно знакомы. Мне это знакомо."
84312101300-57 = "Ну а если будем слишком долго возиться, нас начнут искать."
84312101300-58 = "Верно. Пойдём."
84312101300-59 = ""
84312101300-61 = ""
84312101300-62 = ""
84312101300-64 = "До следующего раза, Рио..."
84312101300-65 = ""
84312101300-68 = ""
84312101300-69 = "Ты сама с собой разговариваешь?"
84312101300-70 = "Я говорю это камере наблюдения. Она увидит, когда вернётся."
84312101300-71 = "Быстро учишься. Ага, именно так и надо."
84312101300-72 = "Ладно, тогда я пойду. Увидимся позже!"
84312101300-73 = ""
84312101300-76 = ""
84312101300-77 = ""
84312101300-80 = "..."
84312101300-81 = ""
84312101300-86 = "...До встречи."
