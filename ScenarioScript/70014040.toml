[translation]
70014040-1 = "Странствия аптекаря 4"
70014040-2 = "«Плата за защиту», говорите...? А от чего вы меня ЗАЩИЩАЕТЕ?! Что хорошего вы вообще сделали?!"
70014040-3 = "Если б мы район не патрулировали, твой дом давно бы обчистили!"
70014040-4 = "И пусть! Это развалюха! Если уж выбирать, кто меня ограбит, вы или воры, лучше рискну с ворами!"
70014040-5 = "Ты что, глухая, бабка? Думаешь, такая смелая, потому что у тебя поселилась эта бродячая скунсиха с белой прядью... Кай, или как её там?"
70014040-6 = "Она здесь ни при чём!"
70014040-7 = "Тогда ты вообще ни черта не знаешь! Эй, хочешь кое-что интересное услышать? Про эту Шинтани Кай..."
70014040-8 = "Она не местная. Одна из Семи заключённых, худшая из худших! Специализируется на... э-э... лекарствах, химическом оружии и всём таком..."
70014040-9 = "Говорят, она устроила разгром в Шаньхайцзин и угодила под арест."
70014040-10 = "Когда она напала на академию, то наняла целую толпу наёмников с Чёрного рынка. Так что да, мы о ней слышали."
70014040-11 = "И мы её не боимся. Зато МЫ хотя бы знаем правду."
70014040-12 = "...!"
70014040-13 = "Кстати, раз уж речь зашла... Слушай сюда, пташка."
70014040-14 = "Кай могла вылечить тебя с самого начала!"
70014040-15 = "..."
70014040-16 = "Ага... Значит, вы тоже знали..."
70014040-17 = "Эта девчонка какой-то гений. Настоящий аптекарь!"
70014040-18 = "Так почему она столько времени оставляла тебя в таком жалком состоянии? Подумай, бабка..."
70014040-19 = "Да потому что ждала, пока ты сдашься, сдохнешь и оставишь ей наследство! Например, эту развалюху."
70014040-20 = "На Чёрном рынке секретов не бывает! Знаешь, чем всё закончится."
70014040-21 = "Это лишь вопрос времени. Рано или поздно всё становится известно!"
70014040-22 = "Кстати, Кай сегодня доставила нам немало хлопот, если подумать."
70014040-23 = ""
70014040-25 = ""
70014040-27 = "А раз мы её найти не можем, отыграемся на тебе! Ха-ха-ха!"
70014040-29 = ""
70014040-31 = "...!!"
70014040-32 = ""
70014040-33 = "[ns] «Надо их остановить!»"
70014040-34 = "..."
70014040-35 = "[s] «Кай...?»"
70014040-36 = ""
70014040-39 = ""
70014040-40 = "...Вы, отребье."
70014040-41 = "Думали, я сама ничего не знала? Я давно обо всём догадалась."
70014040-42 = ""
70014040-44 = ""
70014040-45 = "Ч-что?!"
70014040-46 = "...?"
70014040-47 = "...Вы вообще знаете, сколько лет я здесь прожила?"
70014040-48 = "Сколько людей повидала, сколько мошенников и простаков? На Рынке обманом живут."
70014040-49 = "Мне не нужно было ничего рассказывать. Я всё это время знала."
70014040-50 = "Н-Но почему...?"
70014040-51 = "Почему я собиралась отдать этой девочке свой дом?"
70014040-52 = "Потому что её присутствия уже было достаточно."
70014040-53 = "Каким человеком Кай была или стала и что о ней говорят, мне совершенно неважно."
70014040-54 = "Этот ребёнок был рядом, составлял мне компанию. И этого достаточно. Чего ещё желать?"
70014040-55 = "Разве дом, в котором живут двое, не лучше дома, где остался лишь один человек? Если бы стены могли говорить, они бы со мной согласились. Я уверена."
70014040-56 = "Так что оставьте меня в покое, дайте закончить уборку! Мне надо прибраться!"
70014040-57 = "...Прежде чем я оставлю этот дом той девочке!"
70014040-58 = ""
70014040-60 = ""
70014040-61 = "Ч-Чего?! Я тут из кожи вон лезла, раскрывала тебе глаза на правду!"
70014040-62 = "Вот именно! Ты вообще кто такая, чтобы орать и угрожать?! «Уборка»? Да кому она нужна?"
70014040-63 = "Ну всё! Мы тоже хотели решить дело мирно! Но ты сама напросилась своим длинным языком!"
70014040-65 = "Эй! Все сюда! Живо!"
70014040-66 = ""
70014040-68 = ""
70014040-69 = ""
70014040-70 = ""
70014040-71 = ""
70014040-72 = ""
70014040-73 = ""
70014040-74 = ""
70014040-75 = "...Как же раздражает."
70014040-76 = "[s] «Кай...?»"
70014040-77 = "Неприемлемо."
70014040-78 = "..."
70014040-79 = "Эта старуха, которая всё твердит о том, что отдаст свой дом..."
70014040-80 = "И эти идиоты, которые лают, словно щенки, не подозревающие, что будят тигра. Всё это. Абсолютно всё меня раздражает."
70014040-81 = "Предупреждаю, Сенсей. Не вмешивайтесь."
70014040-82 = ""
70014040-84 = ""
70014040-85 = "...А я постараюсь не делать ничего, что заставило бы вас беспокоиться."
70014040-86 = "По крайней мере, позабочусь, чтобы они... выжили."
70014040-92 = "Т-Ты?! Это Кай! Кай здесь!!!"
70014040-93 = "Н-Не могу дышать...!"
70014040-94 = "Чешется... Всё тело! Повсюду..! А-а-а!!!"
70014040-95 = ""
70014040-99 = "Ага! Ахахаха! Хватит! Прекратите! Это газ! Я вся чешусь..."
70014040-100 = "Ты...? Нет! Тебя не существует! Это галлюцинация...? Н-Не подходи! Я... Я...! Это была не я!"
70014040-105 = "Дождь... Дождь... льёт как из ведра...! Но луна так ярко сияет..."
70014040-106 = "А-Ах... Кажется, моё тело тает...! Руки, ноги, волосы! Я ТАЮ! Ну и мир!"
70014040-107 = "Хи-хи, хихихи, хихихихихихихи!!!"
70014040-110 = ""
70014040-111 = "[ns] «Ч-Что это было...?»"
70014040-112 = "А на что похоже, Сенсей? Как видите..."
70014040-113 = "..."
70014040-114 = "Они все целы и невредимы... по крайней мере, снаружи."
70014040-115 = "[s] «Это так, но...!»"
70014040-116 = "Не волнуйтесь."
70014040-117 = "ОБЫЧНО я не делаю ничего необратимого."
70014040-118 = "Кай...?"
70014040-119 = "...!"
70014040-120 = "..."
70014040-121 = "Пойдёмте внутрь. Уже поздно."
70014040-122 = ""
70014040-124 = ""
70014040-125 = "...Да. Хорошо."
70014040-126 = ""
70014040-128 = ""
70014040-131 = "Ты в порядке, Кай?"
70014040-132 = "...Вообще-то это я должна у вас спрашивать...?"
70014040-133 = "Ха-ха-ха... Со мной всё хорошо. В таком месте до моих лет не доживёшь без твёрдого характера. Я умею выживать, Кай."
70014040-135 = "Разговор Кай со старушкой тёк, словно неспешная река: иногда прерывался, но затем естественно возобновлялся."
70014040-136 = "Мне оставалось лишь изредка вставлять пару слов..."
70014040-138 = "Хм, уже так поздно...? Что-то я устала."
70014040-139 = "Эта старушка вам мешать не будет. Полагаю, вам двоим ещё есть о чём поговорить."
70014040-140 = "Только не засиживайтесь допоздна."
70014040-141 = "...Хорошо."
70014040-142 = ""
70014040-144 = ""
70014040-145 = "Старушка, прихрамывая, вернулась в свою комнату."
70014040-146 = "Вскоре оттуда послышался усталый храп."
70014040-147 = "..."
70014040-148 = "[s] «Кажется, она хорошая женщина»."
70014040-149 = "Хм? Ну... Да, пожалуй."
70014040-150 = "[s] «Ты в порядке?»"
70014040-151 = "...Странные вещи вы говорите, Сенсей. У вас ухудшилось зрение или всего лишь способность здраво мыслить?"
70014040-152 = "Вам следовало бы направить свою заботу на тех, кто корчится снаружи на улице."
70014040-153 = "[s] «У тебя какое-то противоречивое выражение лица»."
70014040-154 = "...!"
70014040-155 = "..."
70014040-156 = ""
70014040-158 = ""
70014040-159 = "Ну, как бы это сказать..."
70014040-160 = "Мне всё это кажется немного... непривычным."
70014040-161 = "[s] «Потому что ты помогла пожилому человеку?»"
70014040-162 = "...!"
70014040-163 = "...Пытаться перевести тему с вами бесполезно. Верно, Сенсей?"
70014040-164 = "Но я вовсе не стремилась помочь старушке или совершить доброе дело."
70014040-165 = "Просто поступила по прихоти. Так уж всё сложилось."
70014040-166 = "...Да. Пожалуй, весь сегодняшний день прошёл именно так."
70014040-167 = "[s] «И этого достаточно»."
70014040-168 = "Что...?"
70014040-169 = "[s] «Необязательно быть хорошим человеком, чтобы совершать хорошие поступки»."
70014040-170 = "Вас всё труднее и труднее понять..."
70014040-171 = "[s1] «Многие добрые дела совершают просто по прихоти».\n[s2] «Часто люди случайно делают что-то хорошее»."
70014040-174 = "Даже если это всего лишь «прихоть», мне не стоит бояться показывать «другие стороны себя»?"
70014040-175 = "[s] «По крайней мере, пока»."
70014040-176 = "...!"
