[translation]
10048005-1 = "Пролог;Под незнакомым потолком"
10048005-5 = "Незнакомая комната"
10048005-7 = "Потолок был... мне незнаком."
10048005-8 = "Но прежде всего я пытался понять, где нахожусь."
10048005-9 = ""
10048005-15 = "Архитектура напоминала общежитие..."
10048005-16 = ""
10048005-19 = "К счастью, моё тело не было связано."
10048005-20 = "Более того, я лежал на диване, укрытый одеялом."
10048005-21 = "Не похоже, что меня притащили сюда со злыми намерениями."
10048005-22 = ""
10048005-26 = "Однако голову продолжала пронзать ноющая боль."
10048005-27 = "Что же всё-таки произошло?"
10048005-28 = ""
10048005-32 = "В-вы проснулись."
10048005-35 = ""
10048005-36 = "[ns] «Кто ты...?»"
10048005-37 = "А? Я?"
10048005-38 = "Э-э, ну, ах... Да. Неудивительно, что вы меня не знаете."
10048005-39 = "Меня зовут Сакурай Миё. Я изучаю литературу в Академии искусств Вайлдхант."
10048005-40 = "И, ну... мне 16 лет, я на втором курсе..."
10048005-41 = "Мой день рождения 24 августа, а рост — 155 сантиметров..."
10048005-42 = "Я люблю коллекционировать печатные машинки..."
10048005-43 = "А объём моей талии..."
10048005-44 = "..."
10048005-45 = "...Вам правда нужно всё это знать?!"
10048005-46 = "[s1] «Ты сама начала!»\n[s2] «Хотя мне и правда любопытно...!»"
10048005-47 = "Я-я начала..."
10048005-48 = "Н-но сейчас не об этом, извращенец!"
10048005-49 = "Но вам же интересно...?!"
10048005-50 = "Так вы И ПРАВДА следите за такими вещами? Вы настолько же странный, как я слышала...!"
10048005-51 = "[ns] «В любом случае, где мы...?»"
10048005-52 = ""
10048005-53 = "А, это клубная комната Картеля свободной торговли."
10048005-54 = "[s] «Картеля свободной торговли...?»"
10048005-55 = "Да. Главной преступной организации Вайлдханта."
10048005-56 = "[s] «А чем именно вы занимаетесь...?»"
10048005-57 = ""
10048005-59 = ""
10048005-60 = "...Контрабандой."
10048005-61 = "[s] «Контрабандой?!»"
10048005-62 = "В любом случае... Вы ведь Сенсей из Шале, верно?"
10048005-63 = "[s] «Да, верно.»"
10048005-64 = "Тогда, возможно, это прозвучит внезапно..."
10048005-65 = "...Но не могли бы вы меня выслушать? И, может быть... дать совет?"
10048005-66 = "[s] «Я всегда готов дать студенту совет.»"
10048005-67 = ""
10048005-69 = ""
10048005-70 = "Д-да, я тоже такое слышала..."
10048005-71 = "Т-Тогда..."
10048005-72 = "Знаете, если честно... я..."
10048005-73 = "Я хочу распустить Картель свободной торговли."
10048005-74 = "[s] «Распустить...?»"
10048005-75 = "Да. Я хочу... просто прекратить всё это, чтобы все в Картеле пошли дальше своей дорогой."
10048005-76 = "...Мне некомфортно постоянно нарушать школьные правила."
10048005-77 = "Так что, если вас не затруднит... Вы поможете мне с этим?"
10048005-78 = "[s3] «Конечно.»\n[s4] «Тогда мне придётся встретиться с президентом Картеля.»"
10048005-81 = "О, можете просто поговорить со мной."
10048005-82 = "[s5] «Я хочу лично встретиться с президентом.»\n[s6] «Мне нужно точно понять, чем занимается этот клуб.»"
10048005-85 = "Ах."
10048005-86 = ""
10048005-88 = ""
10048005-89 = "Э-э... Я и есть президент."
10048005-90 = ""
10048005-92 = ""
10048005-94 = "[ns] «...Что?»"
