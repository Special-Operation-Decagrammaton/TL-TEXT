[translation]
42235-2 = "Eu já disse mil vezes que terroristas armados estão vindo para o prédio do Conselho Estudantil Geral agora mesmo!"
42235-3 = "Seja o Departamento de Segurança Interna, o Departamento de Guarda ou o que for, mandem todas as forças disponíveis para cá!"
42235-7 = "A maioria das alunas do Departamento de Segurança Interna está suspensa... e o Departamento de Guarda saiu por causa de uma nova ordem administrativa...?"
42235-8 = "Então mandem o Departamento de Segurança Pública ou quem quer que seja! Qualquer uma, apenas parem elas agora mesmo!"
42235-9 = "Se não mandarem reforços imediatamente, eu vou fazer a própria Academia de Polícia Valkyrie deixar de existir—"
42235-18 = "É a SRT! Larguem as armas e afastem-se!"
42235-20 = "Aqui é RABBIT 1, suspeita detida.#nConfirmando a identidade de Shiranui Kaya no momento."
42235-24 = "Shiranui Kaya — obtivemos depoimentos de envolvidos confirmando sua participação na tentativa de atentado à bomba na Estação Kousagi."
42235-25 = "Você incitou o terrorismo em busca de ganho pessoal e utilizou de forma privada informações e autoridade essenciais à operação do Conselho Estudantil Geral, fornecendo-as a uma corporação."
42235-26 = "Isso se enquadra nas exceções à imunidade penal contra prisão."
42235-27 = "Você está sob prisão emergencial por suspeita de insurreição, abuso de autoridade, negligência no cumprimento do dever e suborno."
42235-33 = "Que piada... Meras integrantes da SRT querem prender a mim, a Chefe do Gabinete de Defesa e Presidente Interina do Conselho Estudantil Geral...?"
42235-34 = "[s1] \"A SRT é uma força de segurança que existe justamente para resolver esse tipo de problema.\"\n[s2] \"Kaya, quero que você admita seus erros de uma vez.\""
42235-39 = "Sensei [USERNAME]..."
42235-40 = "P-Podemos conversar um pouquinho...?"
42235-41 = "A proposta que lhe fiz outro dia talvez realmente tenha deixado um pouco a desejar..."
42235-42 = "Até hoje, o Sensei resolveu tantos problemas de Kivotos com total responsabilidade. E mesmo assim, eu ousei tentar controlar alguém como você..."
42235-43 = "Peço sinceras desculpas por isso... Vamos considerar aquela proposta anulada!"
42235-53 = "Em troca, eu garantirei todo o apoio que prometi, sem exceção..."
42235-54 = "Os fundos necessários para operar a Schale, pessoal... Eu fornecerei tudo o que precisar."
42235-55 = "S-Se for preciso, eu mesma posso ir pessoalmente à Schale para ajudar o Sensei!"
42235-56 = "Eu faço qualquer coisa que o Sensei mandar—"
42235-60 = "[ns] \"...Kaya.\""
42235-64 = "S-Sim...?"
42235-65 = "[s3] \"Não é a mim que você deve pedir perdão.\"\n[s4] \"Peça desculpas direito às alunas que você prejudicou.\""
42235-68 = "C-Claro! Se o Sensei está dizendo, eu peço desculpas a quem quer que seja."
42235-69 = "A-A quem devo pedir desculpas...? À Administradora Rin...?"
42235-70 = "[s] \"Pelo visto, você ainda não entendeu...\""
42235-77 = "Presidente Interina! Você está bem?"
42235-82 = "Chefe do Gabinete de Esportes, chegou na hora certa...!"
42235-83 = "Eu sabia que a facção que me apoia no Conselho Estudantil Geral viria me ajudar!"
42235-85 = "...Ué? Não são o Sensei da Schale e as alunas do 1º ano da SRT?"
42235-86 = "Sensei, não sei o que te disseram, mas é melhor não acreditar no papo da SRT."
42235-87 = "Elas são um bando de encrenqueiras mandadas pela Administradora Rin pra derrubar a Chefe Kaya."
42235-88 = "I-Isso mesmo! Tudo isso foi armado pela Administradora Rin e seus apoiadores—"
42235-89 = "Eu nunca fui com a cara de nenhuma delas... Bando de inúteis que mandam todos os nutrientes pra uma única parte do corpo!"
42235-91 = "Hã? O-O que isso tem a ver com a história...?"
42235-92 = "...Você guarda rancor por causa disso?"
42235-93 = "Ah, agora tudo faz sentido... Eu bem que achei que a escolha de pessoal daquela facção tinha um padrão curioso..."
42235-95 = "Ei, quatro-olhos. O que você quis dizer com isso...?"
42235-96 = "[s] \"...Miyako, reproduza o arquivo de áudio que o Esquadrão FOX nos deu.\""
42235-97 = "Sim."
42235-105 = "Ótimo trabalho, Líder Yukino. Com esse ataque, o clima no Conselho Estudantil Geral certamente vai mudar bastante."
42235-106 = "Talvez aumentem um pouco as opiniões negativas sobre a Academia Especial SRT... mas não se preocupe."
42235-107 = "Assim que eu me tornar a Presidente Interina do Conselho Estudantil Geral, ninguém mais poderá se meter nos seus assuntos."
42235-111 = "...A Chefe do Gabinete de Esportes se feriu? Ah... está falando daquela idiota?"
42235-112 = "Tsc, por que ela tinha que ir lá na frente e arranjar um acidente desses?"
42235-113 = "Devemos encarar isso como um sacrifício inevitável por uma causa maior, então não se preocupe."
42235-120 = "...? Que história é essa?"
42235-121 = "Chefe Kaya, você não tinha dito que não sabia de nada sobre aquele ataque?"
42235-122 = "I-Isso é... bem, é que..."
42235-127 = "Tornar o Grande Festival Esportivo de Kivotos permanente...?#nMas que diabos essa idiota está exigindo?"
42235-128 = "Quando o golpe de Estado acabar, vamos dar um jeito no Gabinete de Esportes e jogar tudo como uma subseção do Gabinete de Cultura."
42235-129 = "...Sim, secretária. O que foi?"
42235-130 = "Faltam onigiris para distribuir aos participantes da reunião?"
42235-131 = "Eu não dou a mínima para onigiris. Não venha me incomodar com ninharias dessas!"
42235-133 = "E-Então, essa transmissão é..."
42235-134 = "Isso mesmo! Foi tudo forjado!#nÉ tudo uma conspiração da Administradora Rin—"
42235-136 = "Nunca imaginei que você pensasse isso de nós..."
42235-137 = "Eu machuquei o braço naquele ataque e nem pude participar do torneio de gateball..."
42235-142 = "Não precisamos de uma Presidente Interina que não entende o valor dos esportes!"
42235-148 = "Impeachment!"
42235-159 = "Próximo;Epílogo"
