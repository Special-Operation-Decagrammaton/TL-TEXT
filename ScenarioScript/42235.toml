[translation]
42235-2 = "Слушайте все! Террористы направляются атаковать здание Генерального студенческого совета!"
42235-3 = "Мне нужны подкрепления из Бюро общественного порядка, Бюро безопасности — откуда угодно, где есть свободные люди!"
42235-4 = ""
42235-7 = "Большинство студентов Бюро общественного порядка сейчас на испытательном сроке... а Бюро безопасности почти пустует из-за новых приказов..."
42235-8 = "Ладно! Пришлите кого-нибудь из Бюро общественной безопасности! Мне нужны люди! Сейчас же!"
42235-9 = "Если не пришлёте подкрепление, клянусь, я лично добьюсь, чтобы Полицейскую школу «Валькирия» упразднили—"
42235-10 = ""
42235-14 = ""
42235-16 = ""
42235-18 = "SRT! Всем бросить оружие и отойти назад!"
42235-20 = "Говорит RABBIT 1. Подозреваемая, установленная как Ширануи Кая, задержана."
42235-21 = ""
42235-23 = ""
42235-24 = "Ширануи Кая. У нас есть доказательства вашей причастности к заговору по уничтожению станции Коусаги."
42235-25 = "Вам предъявляются обвинения в заговоре с целью совершения террористических актов против граждан, продаже конфиденциальных данных Совета частной корпорации, подкупе должностных лиц властью и деньгами и злоупотреблении должностью исполняющей обязанности президента в личных целях."
42235-26 = "Все обвинения подпадают под исключения из иммунитета исполняющей обязанности президента от ареста."
42235-27 = "Именем академии SRT вы арестованы за мятеж, халатность при исполнении обязанностей, злоупотребление властью и взяточничество."
42235-28 = ""
42235-30 = ""
42235-32 = ""
42235-33 = "Да как вы смеете... Какие-то новички SRT арестовывают меня, главу обороны и исполняющую обязанности президента Генерального студенческого совета?"
42235-34 = "[s1] «Именно для таких ситуаций и существует SRT.»\n[s2] «Кая, игра окончена. Пора отвечать за содеянное.»"
42235-35 = ""
42235-36 = ""
42235-38 = ""
42235-39 = "[USERNAME] Сенсей..."
42235-40 = "Мы можем... поговорить наедине?"
42235-41 = "Возможно, моё прошлое предложение было... недостаточным."
42235-42 = "Оглядываясь назад, наверное, было самонадеянно пытаться... управлять человеком вашего уровня, который уже столько сделал для поддержания жизни Кивотоса."
42235-43 = "Мне искренне жаль... Давайте просто сделаем вид, что этого никогда не было!"
42235-44 = ""
42235-46 = ""
42235-53 = "Взамен вы получите мою полную поддержку."
42235-54 = "Ресурсы, персонал — всё, что понадобится Шале."
42235-55 = "Если потребуется, я лично приеду в Шале и помогу чем угодно!"
42235-56 = "Только скажите, что вам нужно!"
42235-57 = ""
42235-60 = "[ns] «...Кая.»"
42235-61 = ""
42235-63 = ""
42235-64 = "Д-Да?"
42235-65 = "[s3] «Извиняться тебе нужно не передо мной.»\n[s4] «Раскаиваться стоит перед учениками, которым ты навредила.»"
42235-68 = "Да-да! Я сделаю всё, что скажете!"
42235-69 = "Только скажите, с кого начать. С администратора Рин...?"
42235-70 = "[s] «Ты всё ещё не понимаешь.»"
42235-71 = ""
42235-77 = "Исполняющая обязанности президента! Вы в порядке?"
42235-78 = ""
42235-81 = ""
42235-82 = "Директор спортивного отдела, слава богу!"
42235-83 = "Я знала, что мои союзники прикроют меня!"
42235-85 = "Постойте... Почему Сенсей с этими первокурсниками SRT?"
42235-86 = "Не знаю, как они промыли вам мозги, Сенсей, но вашего доверия они не заслуживают."
42235-87 = "Это мошенники, которых интересуют только деньги. Они брали взятки у главного администратора Рин, чтобы дискредитировать Каю и распускать о ней слухи."
42235-88 = "Именно! Настоящий кукловод здесь — администратор Рин!"
42235-89 = "Она всегда пыталась подкопаться под меня! Со своими дурацкими... внушительными формами!"
42235-91 = "Серьёзно? Вот в чём у тебя с ней проблема?"
42235-92 = "Вся твоя ревность сводилась... к этому?"
42235-93 = "Знаешь, теперь многое встаёт на свои места. Я чувствовала, что здесь есть что-то личное."
42235-95 = "Что ты пытаешься сказать, очкастая?"
42235-96 = "[s] «Мияко, включи запись, которую нам передал отряд FOX.»"
42235-97 = "Уже."
42235-98 = ""
42235-104 = ""
42235-105 = "Отличная работа, командир отряда Юкино. Эта миссия должна изменить расклад в Генеральном студенческом совете."
42235-106 = "Поначалу может возникнуть негативная реакция против SRT, но не обращай внимания."
42235-107 = "Когда я стану исполняющей обязанности президента, никто не посмеет вас критиковать."
42235-108 = ""
42235-111 = "...директор спортивного отдела ранена? А, ты про ту неуклюжую..."
42235-112 = "Она постоянно носится повсюду и создаёт всем проблемы."
42235-113 = "Небольшая цена, если подумать. Не о чем беспокоиться."
42235-114 = ""
42235-120 = "...Что я только что услышала?"
42235-121 = "Разве вы не утверждали, что ничего не знали о планах отряда FOX, глава Кая?"
42235-122 = "Н-Ну... это..."
42235-123 = ""
42235-127 = "Постоянный спортивный фестиваль Кивотоса...? Какие ещё идиотские планы она собирается выдумать..."
42235-128 = "Когда всё закончится, я полностью перестрою Спортивный отдел и передам его в ведение Управления культуры."
42235-129 = "Да, секретарь? Чем помочь?"
42235-130 = "На совещание не хватает онигири?"
42235-131 = "Слушай, не моя проблема. Разберитесь."
42235-133 = "Это... можно объяснить..."
42235-134 = "Э-Это... всё подстава! Очевидно, очередная интрига администратора Рин...!"
42235-136 = "Подумать только, вы настолько низко меня ценили..."
42235-137 = "Турнир по гейтболу дался мне очень тяжело, особенно после того, как в той засаде я повредила руку..."
42235-138 = ""
42235-140 = ""
42235-142 = "Мне не нужна никакая исполняющая обязанности, которая плюёт на спорт!"
42235-143 = ""
42235-146 = ""
42235-148 = "Импичмент ей!"
42235-149 = ""
42235-159 = "Следующий эпизод;Эпилог"
