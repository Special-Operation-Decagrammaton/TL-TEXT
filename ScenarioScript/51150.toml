[translation]
51150-1 = "Episódio 15;Encontro Súbito"
51150-3 = "[ns] \"Quem é...?\""
51150-4 = "Aha! Essa sua cara."
51150-5 = "É a cara de quem não faz a menor ideia do que está acontecendo, não é?"
51150-6 = "É iguaaalzinha à expressão que eu imaginei o tempo todo desde que ouvi falar do senhor."
51150-7 = "Realmente... que adorável.#nGostei muito, muuuito mesmo."
51150-8 = "Fico feliz por finalmente conhecer o senhor, de quem tanto ouvi \"rumores\"."
51150-9 = "[s] (Rumores...?)"
51150-10 = "Hummm? Será, será mesmo que o senhor está desconfiando de mim?"
51150-11 = "A julgar por essa aparência, o senhor é exatamente como dizem os rumores."
51150-12 = "Nesse sentido também... é o \"Sensei\", não é?"
51150-13 = "— Mesmo que isso não tenha mais sentido algum. Aha!"
51150-14 = "Ah... verdade, verdade, eu quase me esqueci.#nO senhor chegou a ver a nossa carta?"
51150-15 = "[s] \"Carta...?\""
51150-19 = "<Nós vos anunciamos>"
51150-20 = "<Nosso requinte ainda não terminou; a beleza deve ser apreciada por muitos>"
51150-21 = "<Quando a diversão começar e vocês olharem para as flores desabrochando no céu—>"
51150-22 = "<Mais uma vez— iremos visitá-los>"
51150-23 = "[s] \"Isso é... se não me engano, o que o Clube Beleza da Natureza enviou...\""
51150-24 = "E aguardem ansiosamente."
51150-25 = "Quando nos revelarmos diante de vocês—"
51150-29 = "[log=???][ff4444]<Reduziremos Hyakkiyako a cinzas>[-][/log]"
51150-32 = "[ns] \".........?!\""
51150-35 = "Ora, ora, ora? Como eu pensei... não chegou aos seus ouvidos, não é?"
51150-36 = "Eram palavras que eu queria tanto que chegassem ao senhor..."
51150-37 = "Ah, aquela pessoa deve ter achado que não havia necessidade de contar, né?"
51150-38 = "— Que tola."
51150-39 = "[s] \"...Foi você quem mandou a carta do Clube Beleza da Natureza?\""
51150-40 = "Sim, sim. Fui eu mesma, viu?"
51150-41 = "Se isso tirou a sua dúvida, eu fico muito, muuuito feliz."
51150-42 = "Bem... claro que não tirou, né? Ahaha!"
51150-43 = "Essa cara de tonto de quem não entende nada.#nSim, sim, é hilário ver o quanto o senhor não compreende."
51150-44 = "Agora entendeu o sentido da sua própria pergunta?"
51150-45 = "Mesmo sabendo a resposta, o senhor continua sem entender a essência de nada.#nÉ uma pergunta tola ao extremo."
51150-46 = "Pois bem, pois bem, agora é a minha vez, tá?"
51150-47 = "Um \"Sensei\"... sempre responde às perguntas de uma \"aluna\", não é?"
51150-52 = "Diga-me... Sensei da Schale—"
51150-53 = "— O senhor gosta de gatos?"
51150-54 = "[s] \"Hã... o que você está falando...?\""
51150-55 = "Ahaha! Não diga uma coisa tão sem graça assim."
51150-56 = "Mas bem, é natural, né?#nAfinal, essa conversa já não tinha sentido desde o começo."
51150-57 = "— Há apenas um motivo para eu ter vindo até o senhor."
51150-59 = "O que será tecido a partir de agora é..."
51150-60 = "O \"Hyakumonogatari\" — uma história de terror em nome do requinte."
51150-62 = "Neste dia que enfim retorna após 20 longos anos, finalmente, finalmente todos os atores estão reunidos."
51150-63 = "Portanto — acompanhe-nos até o final, está bem?"
51150-64 = "Até o momento em que a história chegar ao seu ponto final."
51150-70 = "[ns] \"E-Espera...!\""
51150-74 = "[ns1] \"...O que será que ela quis dizer com 'história de terror'?\"\n[ns2] \"Parece que eu já ouvi essa voz em algum lugar...\""
51150-81 = "Ah, Sensei?! Está tudo bem?"
51150-82 = "Você não atendia o telefone de jeito nenhum...#nFiquei preocupada achando que tinha acontecido alguma coisa!"
51150-83 = "[s3] \"Ah, estou bem... só aconteceu uma coisa meio estranha.\"\n[s4] \"Não sei bem, acho que fiquei um pouco tonto com o calor do festival...\""
51150-86 = "Hã...?"
51150-87 = "Ah, é mesmo!#nEu encontrei a Yukari-san!"
51150-88 = "[s] \"Sério?!\""
51150-89 = "Só que tem um probleminha..."
51150-90 = "Não, acho que não é bem um problema... hummm."
51150-91 = "É que... eu gostaria de explicar pessoalmente!"
51150-92 = "Sensei, onde você está agora?"
51150-94 = "(Enquanto esperava no ponto de encontro combinado com a Shizuko...)"
51150-99 = "Ah, Sensei!!"
51150-100 = "Finalmente te encontrei...!"
51150-101 = "Tinha tanta gente que foi um sufoco chegar até aqui. Ufa..."
51150-102 = "[s5] \"Bom trabalho. E então, o que você queria falar pessoalmente?\"\n[s6] \"Ué, cadê a Yukari...?\""
51150-105 = "Bom, eu realmente encontrei a Yukari-san.#nSó que aconteceu uma coisinha..."
51150-106 = "Pois é... humm, por onde eu começo a explicar..."
51150-107 = "A história vai ficar um pouquinho longa, mas..."
51150-109 = "O quêêê?! Você vai mesmo ser a miko...?!"
51150-115 = "Sim."
51150-116 = "Não, não, não, que isso!#nNão é algo que se decida no calor do momento!"
51150-117 = "Se você está pensando no que eu disse antes...#nEu só falei aquilo por conta própria, antes de saber sobre o Hyakkaryouran e sobre você, Yukari-san..."
51150-118 = "Você disse que precisavam de uma miko..."
51150-119 = "I-Isso é verdade, mas...! É fato que a \"miko da família Kadenokouji\" foi o centro do festival de 20 anos atrás... e eu acho mesmo que a presença de uma miko é importante desta vez também, mas...!"
51150-120 = "M-Mas não desse jeito...!"
51150-121 = "Não precisa se preocupar com isso.#nEu também não tomei esta decisão por impulso."
51150-125 = "...Eu estive pensando o tempo todo."
51150-126 = "Se não podemos voltar àqueles tempos... se ninguém deseja isso..."
51150-127 = "Então aquilo foi apenas uma ilusão desde o princípio."
51150-128 = "...Sendo assim, farei o que \"devo fazer\"."
51150-129 = "Pois esse é — o \"dever dos Kadenokouji\"."
51150-131 = "M-Mas...!"
51150-132 = "Shizuko-san. Por favor, poderia pedir desculpas ao Sensei em meu lugar?"
51150-133 = "Assim como a Kikyou-senpai disse... eu menti para o Sensei."
51150-134 = "De forma totalmente egoísta... eu encenei o papel de quem se esforçava pelo Hyakkaryouran."
51150-135 = "No fim das contas, eu acabei enganando o Sensei."
51150-136 = "...O Sensei com certeza não vai te culpar. Ele é esse tipo de pessoa."
51150-137 = "Sim. Com certeza ele não culparia..."
51150-138 = "Contudo, esta é a minha decisão.#nSei que é muito egoísmo da minha parte depois de pedir ajuda para o Torneio de Sucessão, mas..."
51150-139 = "\"Vou apenas deixar o capricho de lado e voltar ao meu lugar de origem.\""
51150-144 = "\"Já está tudo bem\"... por favor, leve esse recado por mim."
51150-150 = "A Yukari-san ficou pedindo desculpas a você até o último instante. Disse que não tinha coragem de te encarar."
51150-151 = "[s] \"E então ela foi na frente para o local do festival, né...\""
51150-152 = "Sensei..."
51150-153 = "Será que a culpa é minha?"
51150-154 = "Será que a Yukari-san desistiu... porque eu fui até o Hyakkaryouran?"
51150-155 = "Não, pensando bem..."
51150-156 = "Será que foi porque eu tentei recriar o festival?"
51150-157 = "[s] \"Não, a culpa não é sua, Shizuko.\""
51150-159 = "[ns7] \"Mesmo que o festival tenha sido o estopim...\"\n[ns8] \"Você não fez nada por mal, Shizuko.\""
51150-162 = "[ns9] \"Por você ter vindo até aqui me contar...\"\n[ns10] \"Eu só tenho a agradecer.\""
51150-167 = "Q-Que nada...! Eu só senti que era minha responsabilidade como Presidente do Comitê de Organização de Festivais...!"
51150-168 = "[s] \"...Certo, então por enquanto vou deixar a Yukari com você, Shizuko.\""
51150-169 = "Hã? E você, Sensei...?"
51150-170 = "Vai ouvir um pouco mais sobre a história do Hyakkaryouran...?"
51150-171 = "[s] \"Afinal, o meu objetivo nunca foi só 'testemunhar o Torneio de Sucessão'.\""
51150-174 = "[ns11] \"Se as meninas do Hyakkaryouran estão passando por algum problema...\"\n[ns12] \"Eu quero ouvi-las e ajudar.\""
51150-177 = "[ns] \"Além disso, você mesma disse, né, Shizuko.\""
51150-179 = "— Um festival onde todo mundo possa sorrir."
51150-180 = "Eu quero que seja um festival assim... é verdade."
51150-181 = "[s] \"Pois é. E eu também vou me esforçar para que seja.\""
51150-182 = "Sensei..."
51150-183 = "[ns] \"Fora que tem uma coisinha me deixando intrigado.\""
51150-189 = "[ns13] \"De qualquer forma, a Kikyou, a Renge e a Yukari...\"\n[ns14] \"Deve haver um motivo para as três estarem tão desencontradas.\""
51150-193 = "A Nagusa-san... não é?"
51150-194 = "A pessoa que, em vez de permanecer no Hyakkaryouran como Vice-Presidente,#nEscolheu o caminho de devolver o emblema da Presidente."
51150-195 = "[s] \"Sim, então primeiro preciso encontrar a Nagusa.\""
51150-196 = "Hummm... entendi."
51150-197 = "Se você está dizendo isso, Sensei, pode deixar a Yukari-san comigo."
51150-198 = "Fazer tudo com perfeição quando confiam em mim é a marca registrada de Shizuko Kawawa!"
51150-199 = "Vou transformar a Yukari-san na miko mais perfeita de todas!"
51150-200 = "Fique na expectativa pela dança dela, Sensei!"
51150-201 = "[s] \"Conto com você, Shizuko.\""
51150-205 = "[ns] \"O problema é como encontrar a Nagusa, mas...\""
51150-210 = "[ns] \"Ah... pensando bem.\""
51150-220 = "Nós procurarmos a Nagusa...?"
51150-221 = "[s] \"Pensei que poderia pedir ajuda a vocês três, já que já encontraram a Nagusa antes.\""
51150-222 = "Com certeza, não existe ninguém além do Clube de Pesquisa Ninjutsu capaz de encontrar ela no meio dessa multidão! ...É o que eu acho também."
51150-224 = "Sim! N-Nós já... já nos encontramos com a Nagusa-san antes..."
51150-225 = "Ou seja, somos as pessoas certas para o trabalho! Não é mesmo, Presidente, Tsukuyo-dono?"
51150-227 = "Aliás... por que você está procurando ela?"
51150-228 = "[s15] \"Tem uma aluna que eu quero ajudar...\"\n[s16] \"Mas não consigo fazer isso sozinho.\""
51150-231 = "[ns17] \"Queria pedir a ajuda do Clube de Pesquisa Ninjutsu...\"\n[ns18] \"Será que posso contar com vocês?\""
51150-234 = "Para ajudar uma aluna... um motivo que é a cara do Sensei-dono!"
51150-235 = "Nesse caso, não temos por que recusar, né?"
51150-236 = "Tsukuyo, Izuna!"
51150-239 = "Sim!!"
51150-241 = "Nós somos o Clube de Pesquisa Ninjutsu!#nRecebemos perfeitamente os sentimentos do Sensei-dono!!"
51150-242 = "Sendo assim, todo o Clube de Pesquisa Ninjutsu!"
51150-243 = "E-Entrando em ação...!"
51150-244 = "Iniciando a missão! Nin-nin!"
51150-246 = "Próximo;Nagusa Goryou"
