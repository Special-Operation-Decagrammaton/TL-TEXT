[translation]
51150-1 = "Эпизод 15;Встреча"
51150-2 = ""
51150-3 = "[ns] «...Мы раньше встречались?»"
51150-4 = "Хи-хи-хи. Вот оно, это выражение!"
51150-5 = "Эта маленькая складка между бровями так и говорит: «Кто эта пугающая незнакомка?»"
51150-6 = "Понимаете, я слышала все эти истории, но никогда не могла представить лицо за этим именем."
51150-7 = "Ох, вы полностью оправдываете ожидания! Растерянность, страх! Это просто неотразимо. Хочется ещё."
51150-8 = "Мне просто пришлось увидеть всё своими глазами! И слухи совершенно не передают вас, Сенсей!"
51150-9 = "[s] «(Слухи...?)»"
51150-10 = "Ох-ох. Вы ни капельки мне не доверяете, да?"
51150-11 = "Да-да. Именно этого я от вас и ожидала."
51150-12 = "При этом, Сенсей."
51150-13 = "Или, пожалуй, важнее то, о чём не было сказано..."
51150-14 = "Вы получили моё письмо?"
51150-15 = "[s] «Вы ведь не о том...»"
51150-16 = ""
51150-18 = ""
51150-19 = "«Пусть все заблудшие души внемлют нашим словам»."
51150-20 = "«Нашему славному досугу скоро придёт конец, ибо некоторые чувства обретают истинный смысл лишь тогда, когда ими наслаждаются вместе»."
51150-21 = "Когда наступит пора радости и ваши глаза засияют от цветов, распускающихся в небе,"
51150-22 = "«Красота природы» вновь явит себя."
51150-23 = "[s] «Это письмо от „Красоты природы“...»"
51150-24 = "Ждите нашего прихода."
51150-25 = "Когда услышите стук в свою дверь..."
51150-26 = ""
51150-29 = "[log=???][ff4444]Хяккияко будет гореть.[-][/log]"
51150-32 = "[ns] «...?!»"
51150-35 = "Что это? Ваше лицо... Столько растерянности, столько тревоги."
51150-36 = "Эта хитрая девчонка опустила несколько строк, не так ли?"
51150-37 = "Она и правда решила вырезать самую важную часть послания!"
51150-38 = "Вот дурочка."
51150-39 = "[s] «...Вы из „Красоты природы“?»"
51150-40 = "Динь-динь-динь. Вы превзошли сами себя."
51150-41 = "Ну что, довольны? Загадка разгадана!"
51150-42 = "Ха-ха-ха! Шучу. Вы ничего не разгадали."
51150-43 = "Только посмотрите на это глупенькое личико. «Я Сенсей и ничего не знаю!»"
51150-44 = "Начнём с самого первого вопроса! Кто я?"
51150-45 = "Если бы вы хоть что-нибудь знали, то с самого начала не задавали бы такой глупый и бесполезный вопрос!"
51150-46 = "Ладно, я ответила! Теперь моя очередь спрашивать."
51150-47 = "Вы ответственный и трудолюбивый учитель, так что обязаны ответить на вопрос своего студента. Хорошо?"
51150-48 = ""
51150-50 = ""
51150-51 = ""
51150-52 = "Вы, Сенсей из Шале."
51150-53 = "Вы любите кошек?"
51150-54 = "[s] «...Я не понимаю, к чему этот вопрос.»"
51150-55 = "Ха-ха-ха. Вы же не серьёзно."
51150-56 = "Вы не можете понять, потому что понимать тут нечего."
51150-57 = "Вот единственное, что вам нужно вбить в свою упрямую голову."
51150-59 = "Вы здесь как свидетель событий, которые вот-вот развернутся."
51150-60 = "«Сто историй о призраках» принесут нам новую утончённость."
51150-62 = "Спустя долгих-долгих двадцать лет...! Актёры собрались, сцена готова."
51150-63 = "Обязательно останьтесь до последней страницы."
51150-64 = "Иначе этот кошмар никогда не закончится."
51150-65 = ""
51150-70 = "[ns] «П-Подождите...!»"
51150-74 = "[ns1] «Какие ещё истории о призраках...?»\n[ns2] «Её голос кажется смутно знакомым...»"
51150-80 = ""
51150-81 = "Наконец-то! Сенсей, вы в порядке?!"
51150-82 = "Вы не отвечали на телефон! Я всерьёз боялась, что с вами что-то случилось."
51150-83 = "[s3] «Всё нормально. Просто... произошло кое-что неожиданное.»\n[s4] «Наверное, фестивальная суматоха на меня повлияла.»"
51150-86 = "Что вы имеете в виду...?"
51150-87 = "Ах, важнее другое! Я нашла Юкари!"
51150-88 = "[s] «Отличная работа, Шизуко!»"
51150-89 = "Спасибо, но есть небольшая проблема."
51150-90 = "Хотя, наверное, называть это проблемой — немного преувеличение..."
51150-91 = "Думаю, лучше обсудить это лично!"
51150-92 = "Где вы, Сенсей?"
51150-94 = "Пробираясь сквозь толпу, я добрался до условленного места встречи."
51150-98 = ""
51150-99 = "Сенсей! Вот вы где!"
51150-100 = "Толпа просто безумная. Как же хорошо, что я вас нашла!"
51150-101 = "Простите, что так долго добиралась. Я и не заметила, насколько здесь стало людно."
51150-102 = "[s5] «О чём вы хотели поговорить?»\n[s6] «Почему вы одна? Что случилось с Юкари?»"
51150-105 = "Ну, с Юкари я встретилась, но всё пошло не совсем по плану."
51150-106 = "Ух, всё немного сложно. С чего вообще начать?"
51150-107 = "...Наверное, с самого начала."
51150-109 = "Что? То есть ты проведёшь ритуал... как мико Кадэнокодзи?"
51150-110 = ""
51150-112 = ""
51150-114 = ""
51150-115 = "Да."
51150-116 = "Давайте сначала всё обсудим! Не нужно принимать поспешных решений."
51150-117 = "Надеюсь, я никак на тебя не повлияла... Я не до конца понимала ситуацию и совсем не хотела подталкивать тебя в ту или иную сторону."
51150-118 = "Признаюсь, я в замешательстве. Вам ведь нужна была мико, верно?"
51150-119 = "Е-Ещё как! Ритуал — давняя традиция Фестиваля фонарей, и я думаю, присутствие мико Кадэнокодзи будет очень много значить для всех!"
51150-120 = "Но... я не хотела, чтобы всё вышло так..."
51150-121 = "Можешь не переживать, Шизуко. Это моё решение."
51150-122 = ""
51150-124 = ""
51150-125 = "Я размышляла о прошлом... и думала о будущем."
51150-126 = "Похоже, воспоминание, за которым я гонюсь, — лишь пустая оболочка."
51150-127 = "Я не стану обременять других такими эгоистичными мечтами."
51150-128 = "Есть ожидания, которым я должна соответствовать."
51150-129 = "В конце концов, я Кадэнокодзи."
51150-131 = "Э-Это нечестно!"
51150-132 = "Я просто... Шизуко, не могла бы ты передать Сенсею мои извинения?"
51150-133 = "Кикё была права. С моей стороны было бесчестно умолять Сенсея о помощи, не рассказав всей правды."
51150-134 = "Я слишком зациклилась на спасении Хяккарёран, на собственных желаниях."
51150-135 = "Это не оправдание, но мне казалось, что ложь Сенсею — единственный путь к моей цели."
51150-136 = "Ты должна сама сказать это Сенсею. Сенсей не станет тебя винить."
51150-137 = "Я... тоже так думаю."
51150-138 = "Но я не могу продолжать полагаться на Сенсея. Мне и так уже слишком много помогли с состязанием за преемство."
51150-139 = "Время игр окончено, поэтому теперь я возвращаюсь к своим обязанностям."
51150-140 = ""
51150-142 = ""
51150-144 = "Пожалуйста, передай Сенсею мою безмерную благодарность и... что со мной всё будет хорошо."
51150-145 = ""
51150-148 = ""
51150-150 = "Она не смогла лично сказать вам, как ей жаль, поэтому ушла вперёд."
51150-151 = "[s] «Значит, она пошла исполнять роль мико Кадэнокодзи...»"
51150-152 = "Сенсей..."
51150-153 = "Это моя вина?"
51150-154 = "Я загнала Юкари в угол?"
51150-155 = "Если подумать, если бы я не пыталась возродить Фестиваль фонарей..."
51150-156 = "Ничего этого бы не случилось, верно?"
51150-157 = "[s] «Ты не могла на это повлиять, Шизуко.»"
51150-159 = "[ns7] «Если бы не фестиваль, случилось бы что-нибудь другое.»\n[ns8] «Ты ведь действовала из лучших побуждений, верно?»"
51150-162 = "[ns9] «Я благодарен, что ты решила помочь, Шизуко.»\n[ns10] «Ты взяла на себя ответственность и не отступила.»"
51150-163 = ""
51150-164 = ""
51150-166 = ""
51150-167 = "В-Вы слишком высокого обо мне мнения! Это всего лишь часть моей работы как президента Фестивального отдела."
51150-168 = "[s] «Тогда оставляю Юкари на тебя, президент.»"
51150-169 = "Что вы будете делать, Сенсей?"
51150-170 = "Вы возвращаетесь к Хяккарёран?"
51150-171 = "[s] «Мне всё равно на состязание за преемство и прочее.»"
51150-174 = "[ns11] «Но я хочу выслушать членов Хяккарёран.»\n[ns12] «По крайней мере, я могу выслушать их проблемы.»"
51150-177 = "[ns] «Ты сама это сказала, Шизуко.»"
51150-179 = "Я хочу слышать смех каждого."
51150-180 = "Я хочу, чтобы этот фестиваль подарил всем улыбки... В этом моя цель."
51150-181 = "[s] «Значит, моя работа — сделать так, чтобы это произошло.»"
51150-182 = "Сенсей..."
51150-183 = "[ns] «Для начала меня кое-что беспокоит.»"
51150-186 = ""
51150-189 = "[ns13] «Ссора Кикё, Рэнгэ и Юкари...»\n[ns14] «В центре всего этого находится один человек.»"
51150-193 = "Вице-президент Нагуса?"
51150-194 = "Верно. Всё началось, когда она отказалась от должности исполняющей обязанности президента и исчезла."
51150-195 = "[s] «Поэтому мне нужно поговорить с Нагусой.»"
51150-196 = "Я понимаю."
51150-197 = "Пока вы будете этим заниматься, можете не волноваться: Юкари будет под моей опекой."
51150-198 = "Как глава Момоёдо, я признаю только идеальный результат!"
51150-199 = "Назад пути уже нет, так что я позабочусь о каждой мелочи."
51150-200 = "Каждый зритель будет в восторге от Юкари-мико во время ритуала!"
51150-201 = "[s] «Рассчитываю на тебя, Шизуко.»"
51150-205 = "[ns] «(...Так я и сказал. Но как мне найти Нагусу?)»"
51150-206 = ""
51150-210 = "[ns] «(А! Хм... Стоит попробовать.)»"
51150-211 = ""
51150-216 = ""
51150-218 = ""
51150-220 = "Вы хотите, чтобы мы нашли... Нагусу? Из всех людей именно её?"
51150-221 = "[s] «Я подумал, вы можете знать, как её найти, ведь раньше у вас уже получалось.»"
51150-222 = "Да, во всём Хяккияко нет другого клуба с такими особыми навыками, как наш Клуб исследования ниндзюцу, чтобы выследить кого-то столь неуловимого, как Нагуса..."
51150-224 = "И... вы правы... Однажды нам уже удалось это сделать..."
51150-225 = "Ага! Вы пришли куда надо, господин!"
51150-227 = "Всё это правда, но... зачем вы ищете Нагусу?"
51150-228 = "[s15] «Ради другого студента.»\n[s16] «Мне нужна помощь Нагусы.»"
51150-231 = "[ns17] «Поэтому вы мне и нужны.»\n[ns18] «...Так что, поможете мне?»"
51150-234 = "Это так похоже на Сенсея! Ну, если нужно помочь студенту в беде..."
51150-235 = "Ниндзя никогда не бросит союзника!"
51150-236 = "Верно, Цукуё? Изуна?"
51150-238 = ""
51150-239 = "Таков путь ниндзя!"
51150-241 = "Мы, Клуб исследования ниндзюцу, принимаем задание Сенсея!!"
51150-242 = "Товарищи-ниндзя...!"
51150-243 = "В-Выдвигаемся..."
51150-244 = "Вперёд! Нин-нин!"
51150-246 = "Следующий эпизод;Горё Нагуса"
