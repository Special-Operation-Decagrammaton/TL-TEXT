[translation]
1010503-1 = "Воинственные телохранители(?)"
1010503-2 = "Обеспокоившись словами Мари, я отправился в Тринити, где Карнавал был в самом разгаре."
1010503-4 = "Сенсей...?"
1010503-5 = "[s1] «...Мари?»\n[s2] Повернуться на голос."
1010503-8 = ""
1010503-9 = ""
1010503-10 = "[ns3] «...Мари?!»\n[ns4] «Кто это... с тобой?»"
1010503-13 = "Я, эм, сама толком не знаю."
1010503-14 = "Когда у меня репетиции или дополнительные выступления, они появляются и болеют за меня."
1010503-15 = "Почему-то общаются они только надписями на плакатах."
1010503-16 = "«Кто вы?»"
1010503-17 = "[s5] «Я Сенсей из Шале.»\n[s6] «Я пришёл поддержать Мари.»"
1010503-20 = "«Понятно. Вы хороший человек.»"
1010503-21 = "«Тогда оставим поддержку вам.»"
1010503-22 = "«Не будем вам мешать.»"
1010503-23 = "«Ни пуха ни пера!»"
1010503-24 = ""
1010503-26 = ""
1010503-32 = "...И вот они ушли."
1010503-33 = "Хм?"
1010503-34 = "А, не волнуйтесь. Сакурако и капитан Минэ тоже о них знают."
1010503-35 = "Вообще, я слышала, что Сакурако сама попросила их сопровождать меня..."
1010503-36 = ""
1010503-38 = ""
1010503-39 = "Теперь, когда я это сказала, мне кажется, они могут быть из Сестринства..."
1010503-40 = "[s7] «Может, им кажется, что тебе нужна помощь.»\n[s8] «Это... в каком-то смысле логично.»"
1010503-43 = "Все слишком сильно за меня переживают. Я постоянно говорю, что со мной всё в порядке, но, похоже, ничего не меняется..."
1010503-44 = "В любом случае, не волнуйтесь об этом. Я просто объяснила, вдруг вы задавались вопросом."
1010503-45 = "Кстати, раз уж мы отвлеклись, что привело вас сюда?"
1010503-46 = "Хм?"
1010503-47 = "Вы пришли сюда, потому что беспокоились? ...Обо мне?"
1010503-48 = "...Сенсей..."
1010503-49 = "[s9] «Знаю, теперь я ничем от них не отличаюсь.»\n[s10] «Наверное, просто неудачно вышло.»"
1010503-52 = "*вздыхает*"
1010503-53 = "Иногда я могу быть немного неуклюжей и неопытной, но мне ведь не нужны няньки."
1010503-54 = "Всё из-за моей внешности? Люди смотрят на меня и думают...?"
1010503-55 = "Хм?"
1010503-56 = "А, вы не это имели в виду?"
1010503-57 = "[s11] «Я просто переживаю.»\n[s12] «Очень многим людям ты действительно небезразлична.»"
1010503-60 = "Сенсей..."
1010503-61 = "Я понимаю, что вы хотите сказать, но от этого ощущения всё равно трудно избавиться..."
1010503-62 = "Хм?"
1010503-63 = "Что я здесь делала? Ну, эм..."
1010503-64 = "...Нет, в этот раз дело было не в дополнительных выступлениях или репетициях. Иначе те двое бы остались."
1010503-65 = "Меня пригласили на встречу или... что-то вроде того."
1010503-66 = "Многие из тех, кто приходит в собор, в итоге задают мне разные вопросы и всё такое."
1010503-67 = "Некоторые очень просили, чтобы я пришла с ними поговорить, так что я как раз собиралась зайти и поздороваться."
1010503-68 = "[s13] «То есть... встреча с фанатами?»\n[s14] «Ты и правда всеобщий айдол, Мари.»"
1010503-71 = "Н-Нет-нет, я вовсе не... Это совсем не так!"
1010503-72 = "Правда, не дразните меня, Сенсей!"
1010503-73 = "Я знаю некоторых людей там, так что просто ненадолго зайду и поговорю с ними."
1010503-74 = "...А."
1010503-75 = "Те двое, что были раньше, сказали — то есть написали, — что пойдут со мной, но, похоже, передумали."
1010503-76 = "[s15] «Кажется, они оставили это мне.»\n[s16] «Если хочешь, я могу пойти с тобой вместо них.»"
1010503-79 = "Вы правда сделаете это, Сенсей...?!"
1010503-80 = "Н-Ну... Тогда... Эм... Если вы, э-э..."
1010503-81 = "...Вы правда собираетесь..."
1010503-82 = "...Сенсей будет... сопровождать..."
1010503-83 = "...меня..."
1010503-84 = ""
1010503-86 = ""
1010503-87 = "...Я..."
1010503-88 = "...Я рассчитываю на вас... Сенсей..."
1010503-90 = "После этого я «сопроводил» Мари к месту, где её ждали люди."
1010503-91 = ""
1010503-94 = "Там было битком. Мари, растерявшись, едва не расплакалась и сказала, что, возможно, мы пришли не туда."
