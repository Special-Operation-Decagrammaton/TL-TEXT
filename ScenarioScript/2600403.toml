[translation]
2600403-1 = "У меня есть секрет"
2600403-2 = "А эта книга идёт сюда... Хи-хи. Я почти закончила сортировку."
2600403-3 = ""
2600403-4 = "О. Здравствуйте, Сенсей! Что вы делаете здесь в такой час?"
2600403-5 = "О! Я говорила слишком громко? Не волнуйтесь — библиотека уже закрыта."
2600403-6 = "Здесь только мы с вами."
2600403-7 = "Да, я часто остаюсь здесь после закрытия. Кто-то ведь должен расставлять книги."
2600403-8 = "К тому же..."
2600403-9 = "Большую часть дня я помогаю другим, поэтому самой читать почти некогда."
2600403-10 = "А вот сейчас у меня обычно появляется время нормально почитать!"
2600403-11 = "Так что я практически живу в библиотеке круглые сутки."
2600403-12 = "В общем... То сообщение я отправила не всерьёз. Удивлена, что вы пришли так поздно."
2600403-13 = "У вас ещё осталась работа?"
2600403-14 = "[s1] «Если ты не против, я могу сделать это здесь.»\n[s2] «Вообще-то я искал компанию на время работы.»"
2600403-15 = "А-ха-ха..."
2600403-16 = "А-ха-ха..."
2600403-17 = "Ну, как хотите. Подождите немного. Я подготовлю вам место для занятий."
2600403-18 = "О, не волнуйтесь. В вопросах ночных бдений я профессионал."
2600403-19 = "Даже сварю вам кофе. Надеюсь, вы не против пить его из стакана с крышкой и через трубочку."
2600403-20 = "Эту подушечку положу за спинку, а эту — вот сюда..."
2600403-21 = ""
2600403-22 = "Шимико некоторое время переставляла стул и стол, пока они не стали выглядеть максимально уютно."
2600403-23 = "Та-дам! Ну как? Я устроила всё именно так, как люблю сама!"
2600403-24 = "В таком месте можно не спать всю ночь и совсем не устать!"
2600403-25 = "[s3] «Выглядит так удобно, что я могу уснуть.»\n[s4] «Что-то в нём напоминает мне тебя.»"
2600403-26 = "Сенсей... Вы опять говорите такие смущающие вещи!"
2600403-27 = "Сенсей... Вы опять говорите такие смущающие вещи!"
2600403-28 = "Садитесь сюда. Я сяду рядом, так что просто скажите, если что-нибудь понадобится!"
2600403-30 = "Мы с Шимико сидели рядом, сосредоточившись на лежащих перед нами бумагах, до глубокой ночи."
2600403-31 = "Ночью в библиотеке ещё тише. Я слышу только шелест переворачиваемых страниц..."
2600403-32 = "...и дыхание Шимико, а ещё тихий звук, когда она касается волос."
2600403-33 = "Мы оба были так поглощены работой, что я потерял счёт времени."
2600403-34 = ""
2600403-35 = "..."
2600403-36 = "(Подняв глаза, я заметил, что Шимико смотрит на меня.)"
2600403-37 = "[s] «...? Шимико?»"
2600403-38 = "...А? Ой, простите. Я не хотела пялиться. Я вам мешала?"
2600403-39 = "Я-я просто хотела убедиться, что вам удобно и ничего не нужно..."
2600403-40 = "А ещё я вдруг поняла, что пригласила вас сюда, а мы всё это время только читаем и работаем."
2600403-41 = "Знаю, мы оба очень погрузились в то, что читаем."
2600403-42 = "Но само осознание, что мы находимся в одном месте, ощущается так..."
2600403-43 = "Это приятное чувство, но..."
2600403-44 = "...с другой стороны, я не могу не чувствовать себя немного эгоистичной."
2600403-45 = "Мне хорошо, но я ведь даже не спросила, нравится ли вам проводить вечер именно так."
2600403-46 = "Кажется, будто... я поступила невнимательно, заставив вас заниматься тем, что нравится мне."
2600403-47 = "Это было... по-детски с моей стороны...?"
2600403-48 = "Может, всё это время я вела себя незрело и даже не замечала."
2600403-49 = "А может, я всё придумала. Не знаю. А-ха-ха..."
2600403-50 = "[s5] «Всё хорошо. Я не против.»\n[s6] «Я твой учитель. Мне положено тебя баловать.»"
2600403-51 = "...!"
2600403-52 = "...!"
2600403-53 = "Угх. Вы даже не стали отрицать, что я веду себя как ребёнок. Теперь мне ещё неловче."
2600403-54 = "...Хи-хи."
2600403-55 = "Ладно, признаю. Нет смысла отрицать, что иногда я веду себя по-детски."
2600403-56 = "Только пообещайте никому не рассказывать, хорошо?"
2600403-57 = "А я никому не скажу, что вы делали свою работу здесь, а не в кабинете."
2600403-58 = "...К тому же такое время ночи идеально подходит для секретов."
2600403-59 = "Так что спасибо, что составили мне компанию, Сенсей."
2600403-60 = "Если вы не против..."
2600403-61 = "..."
2600403-62 = "...надеюсь, вы ещё не раз побалуете мою детскую сторону."
2600403-64 = "Мы с Шимико читали до глубокой ночи, даже после того, как я закончил свою работу."
