[translation]
2300202-1 = "Безболезненная инъекция"
2300202-2 = "Медпункт Тринити"
2300202-3 = "Сенсей. Я думала о том, как делать безболезненные уколы, как ты раньше говорил."
2300202-4 = "Но, думаю, для хорошего укола нужно много учиться."
2300202-5 = "Если потренируюсь десятки, а может и сотни раз, стану такой же умелой, как остальные, правда?"
2300202-6 = "[s1] «Конечно.»\n[s2] «Ханаэ, ты мигом научишься.»"
2300202-7 = "Хи-хи! Я хочу научиться делать быстрые уколы."
2300202-8 = "Хи-хи! Я хочу научиться делать быстрые уколы."
2300202-9 = "Для этого..."
2300202-10 = "Сенсей, сегодня я хочу, чтобы ты стал моим партнёром для практики!"
2300202-11 = "[s] Сбежать."
2300202-12 = "Сенсей! Не убегай! Веди себя как взрослый!"
2300202-13 = "[s] «Но мне не нужен укол!»"
2300202-14 = "Не волнуйся. Лекарство я заменила витаминами."
2300202-15 = "Ты станешь суперздоровым!"
2300202-16 = "Тебе нужно лишь одолжить мне руку."
2300202-17 = "[s] «Но...»"
2300202-18 = "Пожалуйста, Сенсей. Это ради студентов Кивотоса... Помоги мне хотя бы один раз, пожалуйста?"
2300202-20 = "[s] Неохотно протянуть руку."
2300202-21 = "Спасибо, Сенсей!"
2300202-22 = "Я постараюсь сделать совсем не больно!"
2300202-23 = ""
2300202-24 = "А теперь глубоко вдохни... И вот..."
2300202-25 = "..."
2300202-26 = "А? Там что, плюшевый Пероро летает?"
2300202-27 = "[s] «Правда? Где?»"
2300202-28 = "Попался!"
2300202-30 = "Цк, не получилось..."
2300202-31 = "[s] «Ч-Что ты делаешь?!»"
2300202-32 = "Что? Я пыталась отвлечь тебя, потому что в руководстве для медсестёр написано делать укол, пока пациент не замечает..."
2300202-33 = "Но не получилось, хи-хи."
2300202-34 = "[s] «Опасно колоть людей иголкой, когда они не готовы!»"
2300202-35 = "Всё нормально. Витамины усваиваются независимо от того, куда их ввести."
2300202-36 = "Ну что, перейдём ко второму уколу?"
2300202-37 = "[s] «Сколько уколов ты вообще запланировала?!»"
2300202-40 = "После этого моя рука оказалась вся в следах от уколов."
