[translation]
2000105-1 = "Учиться тяжело. Часть 2"
2000105-2 = "Библиотека"
2000105-3 = "..."
2000105-4 = "Прости, Сенсей. Даже после того, как ты помог мне учиться..."
2000105-5 = "Теперь у меня ещё больше пересдач. Это безнадёжно."
2000105-6 = "Такими темпами я останусь на второй год."
2000105-7 = "К счастью, мне засчитали активность в Шале и Клубе горничных, так что осталось только закрыть дополнительные задания."
2000105-8 = "Но если и за них не получу проходной балл... мне конец."
2000105-9 = "Они могут сменить мой позывной с Ноль-Два на Ноль-Мозгов."
2000105-10 = "Поэтому я приостанавливаю подработку и деятельность Клуба горничных!"
2000105-11 = "Нужно сосредоточиться только на заданиях."
2000105-12 = "[s] «Зачем ты вообще вступила в Клуб горничных, если так занята?»"
2000105-13 = "О, это потому что..."
2000105-14 = "...форма милая."
2000105-15 = "[s1] «И всё?»\n[s2] «Не поспоришь.»"
2000105-16 = "Ч-Что значит «и всё»?!"
2000105-17 = "П-Правда ведь? Ты понимаешь, Сенсей."
2000105-18 = "Это крайне важный момент."
2000105-19 = "Изначально я была у Семинар..."
2000105-20 = "...чем-то вроде охранника."
2000105-21 = "Моя задача заключалась в том, чтобы критически важные ресурсы не попали к шпионам других академий или внешним организациям, охотящимся за технологиями Миллениума."
2000105-22 = "Например, тем, кого мы недавно победили вместе."
2000105-23 = "В общем, я устала от постоянных боёв и шпионажа и решила поискать новый клуб."
2000105-24 = "Так я и наткнулась на Клуб горничных."
2000105-25 = "Я подумала, что это хороший шанс освоить домашние навыки вроде уборки и готовки."
2000105-26 = "Мы бы вместе украшали школу, после обеда пили чёрный чай с печеньем..."
2000105-27 = "И ещё эти очаровательные наряды."
2000105-28 = "..."
2000105-29 = "*вздох* Если бы всё было так просто."
2000105-30 = "[s] «Почему бы не уйти, если ты изначально вступила из-за недоразумения?»"
2000105-31 = ""
2000105-32 = "Потому что мне здесь понравилось."
2000105-33 = "Пусть моё вступление и началось с недоразумения,"
2000105-34 = "я всё равно благодарна за воспоминания и товарищей, которых здесь обрела."
2000105-35 = "Поначалу я видела в нашей форме только милую одежду, но теперь она значит для меня намного больше."
2000105-36 = "Она символизирует мою гордость за службу Миллениуму."
2000105-37 = ""
2000105-38 = "Вот же. Как мы вообще так ушли от темы?"
2000105-39 = "Сенсей, побудешь со мной, пока я не закончу это дополнительное задание?"
2000105-40 = "Без тебя я бы уже провалилась, так что после этого угощу тебя ужином."
