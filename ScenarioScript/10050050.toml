[translation]
10050050-1 = "Эпизод 5;Принцесса Ледяного Королевства"
10050050-2 = "Какой-то спортзал"
10050050-4 = "Так-так. Пожалуйста, становитесь по одному в очередь! Всем хватит!"
10050050-5 = ""
10050050-8 = "Все, потише! Чем быстрее встанете в очередь, тем быстрее получите книгу. И помните: Комитет ничего не должен узнать!"
10050050-10 = ""
10050050-11 = "Студентки Тринити помогают нам продавать? Должно быть, это сила культуры. Хе-хе-хе."
10050050-12 = "Именно. Перед нами — воплощение самой культуры, тех сторон человечества, которые вдохновляют людей объединяться ради общего дела."
10050050-13 = "...Говорят, Центральная библиотека Тринити — крупнейшая во всём Кивотосе. Я бы хотела её увидеть, как и старую библиотеку, которую, по слухам, скрывают где-то в глубине."
10050050-14 = "Пока мы здесь, обязательно найдём время сходить. Думаю, такого критика, как ты, должна интересовать литературная коллекция Тринити."
10050050-15 = "Разве нет?"
10050050-16 = "Совсем нет. Разве что они отдадут её мне, чтобы я быстро перепродала."
10050050-17 = "Зачем мне тратить время и силы на что-то без потенциала?"
10050050-18 = "Говоришь так, а сама каждый день вкалываешь над редактурой и правками."
10050050-19 = "Это не редактура и правки. Это огранка драгоценных камней из сырья. Повторное открытие ценности продукта."
10050050-20 = "И как продолжение этого... Я рассчитываю, что ты тоже внесёшь свой вклад!"
10050050-21 = "У-Ух...! Это правда необходимо...?"
10050050-22 = "Я НИКОГДА не заставила бы тебя делать то, чего ты не хочешь... Но, в смысле, слухи уже начали расходиться, разве нет?"
10050050-23 = "П-р-и-н-ц-е-с-с-а?"
10050050-24 = "Augh?!"
10050050-26 = "А, принцесса Таканэ! Мы бы с удовольствием услышали ваше мнение о третьей и четвёртой книгах!"
10050050-27 = "Я-я-я-я-я-я-я? Н-Ну, если в-вы действительно хотите услышать моё скромное мнение..."
10050050-28 = "Конечно хотим! Подобное произведение просто не могло появиться в Тринити."
10050050-29 = "Дикая, но захватывающая реальность, которую оно изображает, создаёт стиль, присущий исключительно Красной Зиме."
10050050-30 = "Именно! Эта глубокая решимость не отпускать красоту, несмотря ни на что... Она действительно всех тронула!"
10050050-31 = "И кто лучше самой принцессы Таканэ сможет объяснить нам непривычные моменты?"
10050050-32 = "Е-Е-Если вы так считаете... Я очень польщена. Правда, спасибо."
10050050-33 = "Ух ты. Как вы красноречивы!! Как и ожидалось от принцессы Красной Зимы... Нет, от принцессы Ледяного Королевства! Вот как ведут себя настоящие особы королевской крови."
10050050-35 = "Что нам делать, Президент?! Я ведь просто обычная студентка Красной Зимы!"
10050050-36 = "Почему я вдруг играю роль младшей дочери падшего дома, который когда-то считался знатью Красной Зимы?"
10050050-37 = "Ты зря тратишь дыхание на такой простой вопрос, Таканэ."
10050050-38 = "Ради маркетинга!"
10050050-39 = "Говорят, она младшая из четырёх сестёр и происходит из влиятельной семьи Красной Зимы."
10050050-40 = "Никто не знает, что стало причиной падения её дома..."
10050050-41 = "Говорят, их «зачистили» в Красной Зиме... Какое жуткое слово..."
10050050-42 = "А, да. Что тут скажешь? Правда? Что я вообще могу сейчас сказать?"
10050050-43 = "Но с помощью своего верного слуги принцесса Таканэ смогла сменить личность и остаться в Красной Зиме. Невероятно!"
10050050-44 = "Встретить человека, который прожил жизнь, о какой я только читала, и даже поговорить с ним..."
10050050-45 = "Для меня это огромная честь!"
10050050-46 = "(Потому что эта история основана на книге!)"
10050050-47 = "То, что случилось с вашими тремя сёстрами, поистине трагично... У вас всё ещё есть тот дневник? Где вы написали «OAMT» — первые буквы ваших имён?"
10050050-48 = "Вы ещё и увлекаетесь фотографией? Мы бы очень хотели увидеть ваши работы!"
10050050-49 = "(Всё превратилось в полный бардак, но вот это единственное, что они сказали правдиво... *вздыхает*)"
10050050-50 = "Должна признаться, мне впервые выпала возможность услышать слова критика. И подумать только, я могу узнать всё из первых уст от самой принцессы!"
10050050-51 = "Никогда не думала, что этот день настанет! Вы планируете выпустить сборник критических эссе под своим именем?"
10050050-52 = "О? Ещё одна бизнес-идея...?"
10050050-53 = "Ни в коем случае!"
10050050-55 = "Э-Эм... Я услышала об этом от подруги... Здесь можно...?"
10050050-56 = "Добро пожаловать, добро пожаловать. Не просто можно — именно так всё и должно быть! И, как всегда, начинать стоит с начала. Попробуйте первую книгу!"
10050050-57 = "Тогда, эм, спасибо..."
10050050-58 = "...!"
10050050-59 = "Б-Б-Бесстыдство!!"
10050050-60 = ""
10050050-62 = ""
10050050-63 = ""
10050050-64 = "Ч-Что нам делать, Президент?! С нами всё будет в порядке?"
10050050-65 = "А, всё нормально, нормально. Она ещё вернётся. Это моя интуиция как президента Издательского отдела."
10050050-66 = "Неужели...?"
10050050-67 = ""
10050050-72 = ""
10050050-73 = "О боже..."
10050050-74 = "Хе-хе-хе."
10050050-75 = "Эм, не то чтобы я хотела узнать или мне было интересно, что там дальше..."
10050050-76 = "Просто я люблю доводить всё до конца! На этом этапе закончить её — практически мой долг."
10050050-77 = "Да-да! Конечно. Полностью с вами согласна, мисс."
10050050-78 = "Рада, что вы понимаете. Поэтому... если есть вторая часть..."
10050050-79 = "Конечно. Любая история должна продолжаться. Как говорится, шоу должно продолжаться."
10050050-80 = "Мы должны поблагодарить вас за то, что чувство долга привело вас обратно."
10050050-81 = "С-Спасибо, что так это воспринимаете."
10050050-82 = "Ничего особенного. Останься эта книга в Красной Зиме, она бы затерялась и была забыта массами."
10050050-83 = "...Она бы никогда не вышла под яркий свет рынка."
10050050-84 = "Одно дело — принять участие и проиграть. И совсем другое — вообще не получить шанса выйти на ринг."
10050050-85 = "Полагаю, звучит логично."
10050050-86 = "Именно! Поэтому я дам вам возможность купить две книги вместо трёх. Что скажете?"
10050050-87 = "Н-Но разве такие вещи не положено покупать по три экземпляра? Я так слышала."
10050050-88 = "Это правда, но третий — чтобы распространять молву. Разве это не немного неловко?"
10050050-89 = "П-Правда можно?"
10050050-91 = "...Таким образом, исключать одни стороны жизни, чтобы сделать другие более приемлемыми, — само по себе противоречие."
10050050-92 = "Можно даже сказать, что то, как мы говорим о сложных темах, показывает нашу истинную сущность."
10050050-93 = "Например, любовь. Люди инстинктивно избегают говорить о ней, но она необходима каждому из нас."
10050050-94 = "Без любви никто из вас сегодня не стоял бы здесь передо мной."
10050050-95 = "То же самое касается наших тел. Хотя говорят, что приличной леди не следует прямо обсуждать то, что скрыто под одеждой..."
10050050-96 = "И всё же мы — существа, которые живут в этих запретных телах."
10050050-97 = "Поэтому эта книга, пытаясь вести откровенный и активный диалог о вещах противоречивых, но притягательных для нас..."
10050050-98 = "...может считаться кульминацией решимости и даже чем-то чистым, ведущим нас к горизонту ещё более широкого понимания."
10050050-99 = "Кья-а-а!"
10050050-100 = "Это так круто, принцесса!"
10050050-101 = "Как и ожидалось от особы благородных кровей!"
10050050-102 = "Значит, быть честными с самими собой — нормально?"
10050050-103 = "(Похоже, у меня от этого разовьётся язва желудка.)"
10050050-104 = ""
10050050-106 = ""
10050050-108 = "Торговля идёт полным ходом..."
10050050-109 = "И всё же мы могли бы сделать ещё больше. Что-то более решительное..."
10050050-110 = "Эм, а у вас есть книги с... вот таким?"
10050050-111 = "Мне понадобится немного больше подробностей."
10050050-112 = "Ну..."
10050050-113 = ""
10050050-115 = ""
10050050-116 = "Хм. К сожалению, книги, которая в точности подходит под ваше описание, у нас нет..."
10050050-117 = "Вот как..."
10050050-118 = "Погодите-ка. Но... Но...?"
10050050-119 = "Но... я могу это для вас устроить!"
10050050-120 = "Правда?!"
10050050-121 = "Только мне понадобится ваша помощь. Вы знаете, как составлять проектное предложение?"
10050050-122 = "Э... что? Нет, я никогда такого не писала."
10050050-123 = "Ничего страшного. Даже лучше. Просто дайте мне две строчки. Что именно вы ищете, какие персонажи — отпустите воображение на волю."
10050050-124 = "П-Поняла!"
10050050-125 = ""
10050050-127 = ""
10050050-128 = ""
10050050-129 = "Что такое, Якумо? Продажи начали падать?"
10050050-130 = "Вообще-то, ну... Полученная оплата хотя бы помогла нам выбраться со дна ямы. Так что... спасибо."
10050050-131 = "Такая искренняя благодарность от самой Мэру... Не волнуйся. Бизнес процветает."
10050050-132 = "Настолько, что я отправляю тебе предложение. Чем быстрее вернёшь его мне, тем лучше."
10050050-133 = "А? С какой стати? Я не позволю втянуть себя ещё в одну твою мутную схему заработка!"
10050050-134 = "Выслушай меня. Я получаю запросы прямо сейчас, прямо на месте. Если сможем выполнять их по требованию, цену сможем назначать какую захотим!"
10050050-135 = "...Ты хочешь, чтобы я работала на заказ. Нет. Ни за что. Это худший кошмар художника. Они придираются к каждой мелочи, а под конец всё равно говорят, что хотели не этого."
10050050-136 = "Нет, я это уже решила. В предложении, которое я отправлю, всего две строки. В две строки все мелочи не впихнёшь."
10050050-137 = "А значит... Холст они тебе дают, но нарисовать на нём ты можешь всё, что захочешь!"
10050050-138 = "Заказчик просто начнёт жаловаться на результат!"
10050050-139 = "О-хо. Нет, он будет доволен чем угодно. Потому что принцесса Таканэ... даст положительную критику."
10050050-141 = "Я тоже в этом участвую?!"
10050050-142 = "Подумай, Мэру. В каком-то смысле это оригинальная работа. Разве не создавать собственные произведения — твоя мечта?"
10050050-143 = "!!"
10050050-144 = "Н-Ну, да..."
10050050-145 = "Понимаю. Она не на сто процентов твоя, значит формально не ТВОЯ работа. Но заказ задаёт только основу. Все детали ты можешь наполнить какими угодно мыслями в стиле Мэру."
10050050-146 = "По сути, это оригинальная работа, разве нет? В конце концов, одна капля воды однажды может превратиться в огромный океан."
10050050-147 = "Ух ты. Первый шаг на пути к твоей настоящей мечте."
10050050-148 = ""
10050050-150 = ""
10050050-151 = ""
10050050-152 = "Дай мне предложение!"
10050050-153 = "Отлично, отлично! И помни: здесь всё решает скорость."
10050050-154 = "За кого ты меня принимаешь? Я немедленно начинаю работать, так что уже клади трубку!"
10050050-155 = ""
10050050-157 = ""
10050050-158 = "Вот и ещё одна миссия выполнена. Хе-хе-хе."
10050050-159 = "...Я никогда не хочу оказаться в ситуации, где мне придётся смотреть вам в глаза как врагу, Президент."
10050050-160 = "Хм? Понятия не имею, о чём ты."
10050050-162 = "Пригородное кафе Тринити"
10050050-163 = "Хорошая работа, Сенсей."
10050050-164 = "[s] «Это ты усердно работаешь, Шимико...»"
10050050-165 = "Я ценю эти слова, но похвастаться нам нечем. Мы не нашли ни одной зацепки."
10050050-166 = "[s] «Интересно, почему в этот раз всё намного сложнее обычного.»"
10050050-167 = "Есть мысли, почему так, Сенсей?"
10050050-168 = "..."
10050050-169 = "Понятно. Возможно, студентки Тринити на самом деле защищают продавца этой несанкционированной книги..."
10050050-170 = "Мы думали об одном и том же, Сенсей. Без свидетелей, готовых говорить, Комитету правосудия трудно хоть как-то продвинуться."
10050050-171 = "Именно поэтому мы и пришли в это кафе."
10050050-172 = "[s] «Вы нашли кого-то, кто готов поговорить?»"
10050050-173 = "Возможно? Вы хорошо её знаете. А, вот и она."
10050050-174 = ""
10050050-176 = ""
10050050-177 = ""
10050050-178 = "Привет, Кохару."
10050050-179 = "С-С-С-Сенсей?!?! Что Сенсей здесь делает?!"
10050050-180 = "[s] «О, это Кохару.»"
10050050-181 = "Погодите, если Сенсей здесь..."
10050050-182 = "...Я так и знала."
10050050-183 = "Я так и знала! Меня не обманешь! Весь этот бардак — ваших рук дело! СМЕРТЬ—!"
10050050-184 = "[s] «Нет! В этот раз я правда ни при чём! Я невиновен!»"
10050050-185 = "В-В-В ЭТОТ РАЗ?! Значит, в другие разы вы занимались извращениями?!?! СМЕРТНАЯ КАЗНЬ!!"
10050050-187 = "[ns] «В общем, значит, Кохару — та самая...»"
10050050-188 = "Да. Кохару дала мне образец. Так что теперь у нас есть хоть какая-то зацепка."
10050050-189 = "[s] «Но почему ты помогаешь Библиотечному комитету, а не Комитету правосудия?»"
10050050-190 = "Н-Ну. Это...!!"
10050050-191 = "Потому что..."
10050050-192 = "Я не хотела... быть той, из-за кого им станет грустно..."
10050050-193 = "Вот и всё, ясно?! Все так стараются спрятать и защитить её!"
10050050-194 = "Просто потому, что им нравится эта книга..."
10050050-195 = "Я-я не говорю, что Комитет правосудия плохой!! Они просто делают свою работу!!"
10050050-196 = "...Это совсем другое дело. Просто немного грустно отнимать у студенток то, что они так любят..."
10050050-197 = "[s] «Тебе тоже нравится эта книга, Кохару?»"
10050050-198 = "М-Мне?! Зачем вообще спрашивать?! Извращенец Сенсей! Дурак Сенсей! СМЕРТНАЯ КАЗНЬ-Ы-Ы-Ы!!"
10050050-199 = "М-М-Мне с-совсем не и-и-интересно что-то подобное!!"
10050050-200 = "Тогда, Кохару, если Библиотечный комитет соберёт всю серию, тебе ведь не будет интересно прийти и прочитать её?"
10050050-201 = "Как будущая элита Комитета правосудия, разве тебе не следует знать её содержание?"
10050050-202 = "...!"
10050050-203 = "Ты права! Наверное, если речь об этом, придётся сделать исключение и проверить."
10050050-204 = "Прекрасно. Спасибо, что так глубоко ценишь литературу."
10050050-205 = "Н-Ну... Не совсем... В общем, почему Библиотечный комитет так сильно любит книги?"
10050050-206 = "Разве это не естественно? Книги — своего рода машина времени."
10050050-207 = "[s] «Машина времени? В каком смысле?»"
10050050-208 = "Разумеется, в метафорическом."
10050050-209 = "Метафорическом?"
10050050-210 = "Хм... Ну, видишь ли, существует бесчисленное множество средств, с помощью которых люди могут выражать себя и распространять информацию."
10050050-211 = "Видео в интернете, фильмы, игры, музыка... Их столько, что всех не перечислить."
10050050-212 = "Эти средства вызывают те же эмоции и чувства, что и книги."
10050050-213 = "Но с книгами... мне кажется, у меня остаётся чуть больше пространства для собственных мыслей."
10050050-214 = "Я одна ничего не понимаю...?"
10050050-215 = "Представь так. Когда смотришь фильмы, играешь в игры или смотришь видео, трудно одновременно формировать собственные мысли."
10050050-217 = "Эти форматы задействуют зрение, слух, а иногда даже осязание, чтобы донести своё послание."
10050050-218 = "Из-за этого они очень сильно погружают нас и затягивают глубже в свои миры..."
10050050-219 = "Но чувства оказываются перегружены. Для собственных мыслей не остаётся пространства."
10050050-220 = "Книги же... В каком-то смысле это самый ограниченный формат. Для общения у тебя есть только слова на странице."
10050050-222 = "Это, несомненно, правда..."
10050050-223 = "Но именно эта ограниченность позволяет нашим собственным мыслям расцветать рядом с книгой по мере чтения. В этом смысле книга бескорыстна."
10050050-224 = "И это в каком-то смысле похоже для меня на разговор с прошлым."
10050050-225 = "Потому что все авторы — это люди, которые говорят с настоящим из прошлого. Поэтому я и назвала книгу машиной времени."
10050050-226 = "[s] «Я даже не задумывался, что книги публикуют уже после того, как их написали.»"
10050050-227 = "Да. Когда я читаю, это действительно похоже на разговор с прошлым «я» автора."
