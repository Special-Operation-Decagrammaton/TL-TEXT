[translation]
10004050-1 = "Эпизод 5;Личность раскрыта"
10004050-2 = "Мы сбежали в ближайший парк, чтобы избежать суматохи у Источника персикового цветка."
10004050-5 = ""
10004050-6 = "Уф, я всего лишь хотела поболтать с вами за чаем. А получился бардак."
10004050-7 = "Но... ничего."
10004050-8 = "Шаньхайцзин большой! Здесь ещё много мест, куда можно сходить."
10004050-9 = "Что нам теперь делать?"
10004050-10 = "[s] «Стой, Шунлинь.»"
10004050-11 = "А? Что-то не так?"
10004050-12 = "О, есть какое-то особое место, куда вы хотите сходить, Сенсей?"
10004050-13 = "Может... куда-нибудь потише? Где мы будем одни?"
10004050-14 = "[s] «Ты точно студент Сада сливового цветка?»"
10004050-15 = "Ч-что?!"
10004050-16 = "(Н-Неужели Сенсей понял, кто я на самом деле?)"
10004050-17 = "П-Почему вы спрашиваете?"
10004050-18 = "[s] «Студенты Сада сливового цветка обычно не знают столько всего.»"
10004050-19 = "К-Как я и говорила, я много времени провожу с Шун, вот и нахваталась разного!"
10004050-20 = "[s] «И тебя совершенно не интересует поиск Шун.»"
10004050-21 = "Э-Это только потому, что я отвлеклась на все эти развлечения."
10004050-22 = "В-Вы же знаете, какие бывают маленькие дети, да? Хи-хи."
10004050-23 = "[s] «Маленький ребёнок так про себя не сказал бы.»"
10004050-24 = "Уф. Я хотела сказать..."
10004050-25 = ""
10004050-28 = ""
10004050-29 = "Шун! Вот ты где!"
10004050-30 = "С-Сая?!"
10004050-31 = "Я проанализировала состав эликсира омоложения и создала противоядие, которое устранит побочные эффекты!"
10004050-32 = ""
10004050-34 = ""
10004050-36 = "Не могу поверить, что так быстро сделала противоядие... Всё-таки я гений!"
10004050-37 = "[s1] «Эликсир омоложения?»\n[s2] «Шун?»"
10004050-40 = "(Ну почему она появилась именно сейчас?!)"
10004050-41 = "Шун? Ты о ком?"
10004050-42 = "А? Ты и есть Шун. Ты выглядишь так из-за эликсира, который я сделала. Помнишь?"
10004050-43 = "О нет! Потеря памяти — ещё один побочный эффект эликсира?!"
10004050-44 = "Т-Ты..."
10004050-46 = "Ты ошиблась человеком!"
10004050-47 = ""
10004050-49 = ""
10004050-51 = "У-Ух ты! Она только что оттолкнула меня и убежала!"
10004050-52 = "Теперь мне ещё и противоядие от потери памяти делать? Блин."
10004050-53 = "[s] «Почему ты называешь её Шун? Что происходит?»"
10004050-54 = "О, похоже, она не объяснила, что случилось."
10004050-55 = "Фух. С чего бы начать?"
10004050-58 = "Сая объяснила, что произошло после того, как Шун выпила её эликсир."
10004050-60 = "[ns] «Шун стала моложе?!»"
10004050-61 = "Ага. Это всего лишь побочный эффект, но не могу поверить, что создала эликсир, обращающий старение!"
10004050-62 = "Иногда меня саму пугает мой талант."
10004050-63 = "Но странно, что инструктор Шун превратилась в такого капризного ребёнка. Обычно она очень заботится о других."
10004050-64 = "Может, это ещё один побочный эффект!"
10004050-65 = "[s] «Ещё один?»"
10004050-66 = "Ну, логично же. На личность человека влияют и физические особенности: мозговые паттерны, гормоны и прочее."
10004050-67 = "Раз её тело стало моложе, возможно, изменилась и личность."
10004050-68 = "В худшем случае даже если её прежнее тело вернётся, характер может так и не восстановиться..."
10004050-69 = "[s] «Это было бы ужасно!»"
10004050-70 = "Ну, нужно заставить её принять противоядие, пока не поздно."
10004050-71 = "Эликсир интересен как объект исследования, но я не хочу тратить на него больше времени, чем необходимо."
10004050-72 = "Хорошо. Начинаем новый эксперимент!"
