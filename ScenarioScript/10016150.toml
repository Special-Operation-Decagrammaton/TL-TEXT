[translation]
10016150-1 = "Послесловие;Рыцари помощи и Клуб экстренной медицинской помощи"
10016150-3 = ""
10016150-5 = ""
10016150-6 = "Позвольте напоследок ещё раз проверить ваши жизненные показатели."
10016150-7 = ""
10016150-9 = ""
10016150-10 = ""
10016150-11 = ""
10016150-13 = "Так... Всё выглядит хорошо. Температура, пульс и давление в норме."
10016150-14 = "Вас доставили сюда с тепловым истощением, верно? Меня беспокоила ваша высокая температура..."
10016150-15 = "Но вы очень быстро восстановились! Я рада, что жидкость и отдых так хорошо помогли."
10016150-16 = "С-спасибо... Всё благодаря вашей заботе..."
10016150-17 = "Но всё равно не теряйте бдительности!"
10016150-18 = "Объединённый медицинский штаб скоро закроется на ночь, поэтому, боюсь, я больше не смогу за вами наблюдать, но..."
10016150-19 = "Пожалуйста, внимательно следите за своим состоянием после возвращения в Тринити. Двери Рыцарей помощи всегда открыты!"
10016150-20 = "Защищать справедливость важно, но без здоровья вы ничего не сможете защитить."
10016150-21 = "Д-да, мэм... Я обязательно буду осторожна!"
10016150-22 = ""
10016150-24 = ""
10016150-25 = "Н-но я хотела спросить... Та девушка вон там..."
10016150-26 = ""
10016150-28 = ""
10016150-29 = ""
10016150-30 = ""
10016150-31 = "Вам требуется моя помощь?"
10016150-32 = "Н-нет... Не в этом дело, но..."
10016150-33 = "Разве вы не студент Геенны? Вас не смущает, что я здесь, хотя я член Отряда правосудия Тринити?"
10016150-34 = "Хаха. Теперь я понимаю, почему вы так переживали."
10016150-35 = ""
10016150-37 = ""
10016150-39 = "Но беспокоиться не о чем."
10016150-40 = "Принцип Клуба экстренной медицинской помощи — оказывать помощь любому пострадавшему. Независимо от принадлежности, они наши пациенты. Всегда."
10016150-41 = "Конечно, всё не всегда так просто, но долг медика — заботиться о телах... то есть о пациентах, где бы они ни находились."
10016150-43 = "Все сложности, связанные со стигмами и предрассудками этого мира, вторичны, когда нужно помочь раненому."
10016150-44 = "П-Понятно..."
10016150-45 = "Именно! Мы все собрались на Фестивале Хало Кивотоса, чтобы отпраздновать мир и сотрудничество. Сейчас самое время забыть о принадлежности к академиям и сблизиться в дружеском соревновании."
10016150-46 = "Наша задача — сделать так, чтобы каждый пациент вернулся в свою академию ещё здоровее, чем прежде!"
10016150-48 = "И вообще, Сэна первой оказалась рядом, когда вы раньше потеряли сознание. Она сама донесла вас сюда!"
10016150-49 = "Я-я теперь понимаю."
10016150-50 = "Я понятия не имела. Простите за мои грубые предположения."
10016150-51 = "Нет, всё хорошо."
10016150-52 = "И вообще, когда речь идёт о поиске качественных трупов... то есть лечении раненых, политическая принадлежность не имеет значения."
10016150-53 = "(Т-трупов...?)"
10016150-54 = "Ну, эм, спасибо вам за всё!"
10016150-55 = ""
10016150-57 = ""
10016150-59 = "Отличная работа сегодня!"
10016150-60 = "Благодаря усердию Клуба экстренной медицинской помощи мы смогли принять огромное количество пациентов."
10016150-61 = "Что вы. Дисциплина и трудолюбие Рыцарей помощи действительно не имеют равных."
10016150-62 = "Меня впечатлило, как вам удавалось сохранять бодрый настрой под таким давлением."
10016150-63 = "Я довольно самоуверенно считала себя одной из лучших в транспортировке и экстренной медицине, но сегодняшний день показал, что мне ещё многому предстоит научиться."
10016150-64 = ""
10016150-66 = ""
10016150-67 = ""
10016150-68 = "Что вы имеете в виду? Вас что-то беспокоит?"
10016150-69 = "Вовсе нет. На самом деле, думаю, я должна извиниться перед Рыцарями помощи."
10016150-70 = "Раньше я посоветовала той пациентке отбросить предубеждения, но сама пришла сюда с предвзятым мнением о Рыцарях помощи из-за услышанных слухов."
10016150-71 = "Слухов...?"
10016150-72 = "А. Ходят слухи, будто Рыцари помощи не принимают пациентов из Геенны?"
10016150-73 = "Нет, не такого рода..."
10016150-74 = ""
10016150-76 = ""
10016150-78 = ""
10016150-79 = "Я по глупости поверила слухам, будто всякий раз, когда в дело вмешивается глава Рыцарей помощи, число раненых только растёт."
10016150-80 = "Часто шепчутся: «Глава ломает, а её Рыцари лечат...»"
10016150-81 = "Но после того, как я увидела вашу работу здесь, я просто не могу поверить, что столь добросердечной группой руководят настолько варварскими методами."
10016150-82 = "..."
10016150-83 = "Должна признаться, я даже слышала о медсестре Рыцарей помощи, которая пыталась вылечить расстройство сна бейсбольной битой и чаем из аконита, только ухудшив состояние пациента."
10016150-84 = "А... Ахаха... Да... Вы же знаете, как факты искажаются, пока слухи ходят из уст в уста..."
10016150-85 = "Согласна. Сегодня вы доказали мне, что слухи действительно всего лишь слухи."
10016150-86 = "Но для развлечения расскажу ещё один слух."
10016150-87 = "Е-ещё один слух...?"
10016150-88 = "Да. Говорят, есть медсестра Рыцарей помощи, которая появляется там, где нужна, словно медицинский призрак."
10016150-89 = "Доходит даже до утверждений, будто эта медсестра помогает пациентам ещё до того, как они успевают нажать кнопку вызова, а затем исчезает, словно её и не было."
10016150-90 = "Ты когда-нибудь слышала об этой невероятно способной медсестре, Сэрина?"
10016150-92 = "А! С-Сэна! Т-ты слышала про огромный костёр на вечеринке после фестиваля?"
10016150-93 = "Е-если хочешь, может, сходим и немного повеселимся вместе?"
10016150-94 = "Я не против."
10016150-95 = "Где огонь, там обычно бывают трупы— Кхм, пациенты."
10016150-96 = "Тогда идём! Возможно, кому-то уже прямо сейчас нужна наша помощь!"
10016150-97 = ""
10016150-99 = ""
10016150-100 = ""
10016150-101 = ""
10016150-103 = "...О слухах я спрошу в другой раз."
