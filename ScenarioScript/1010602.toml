[translation]
1010602-1 = "Плоды тяжёлого труда"
1010602-2 = "Гостиная Шале"
1010602-3 = "После того как Сакурако сказала, что собирается прийти, я начал приводить гостиную в порядок."
1010602-4 = ""
1010602-9 = ""
1010602-10 = "...Хи-хи-хи..."
1010602-11 = ""
1010602-13 = ""
1010602-14 = "[ns1] «...Сакурако?»\n[ns2] «Наверное, я этого и ожидал...»"
1010602-17 = "Ах, вы слишком хорошо меня знаете. Впрочем, от вас другого и не ждёшь."
1010602-18 = "Да. Это символ «плодов моего труда»."
1010602-19 = "Труда, который я вложила в укрепление отношений с сёстрами..."
1010602-20 = "...и который наконец принёс плоды в наглядной форме."
1010602-21 = "Хм?"
1010602-22 = "У вас дежавю? Что вы имеете в виду...?"
1010602-23 = ""
1010602-26 = ""
1010602-27 = ""
1010602-28 = ""
1010602-29 = ""
1010602-30 = "[ns3] «(Не будем вспоминать о „церемониальном платье“ Совета...)»\n[ns4] «Нет. Ничего.»"
1010602-33 = "П-Простите? У меня странное ощущение, будто вы сейчас проявляете невероятную тактичность..."
1010602-34 = "Но вернёмся к делу. Сегодня я пришла поговорить о «плодах своего труда»."
1010602-35 = "Раньше я приходила к вам за помощью или советом."
1010602-36 = "Но сегодня всё иначе. Сегодня я здесь, чтобы дать вам повод почувствовать облегчение и гордость."
1010602-37 = "...Да. Именно так. Наконец-то мне удалось. Я сделала огромный шаг вперёд и как сестра, и как лидер."
1010602-38 = "Благодаря..."
1010602-39 = "...силе этого айдольского церемони— костюма!"
1010602-40 = "[s5] «...?»\n[s6] «Церемониального платья! Ты точно только что хотела сказать „церемониального платья“!»"
1010602-43 = "Кхм..."
1010602-44 = "Многое произошло, но в конечном счёте..."
1010602-45 = "Когда я начала носить этот костюм, то заметила заметные изменения в общении с сёстрами."
1010602-46 = "Они не только перестали бояться меня или разговоров со мной — некоторые даже сами стали подходить первыми!"
1010602-47 = "Благодаря этой неожиданной возможности я наконец достигла того, на чём уже давно поставила крест."
1010602-48 = "Поэтому я пришла к такому выводу. То, что внутри, наши намерения — безусловно, самое важное..."
1010602-49 = "Однако бывают случаи, когда внешний вид тоже имеет значение!"
1010602-50 = "[s7] «...Ничего себе.»\n[s8] «Ты спотыкалась по пути, но в итоге всё-таки нашла свой ответ.»"
1010602-53 = "Хи-хи-хи... Именно."
1010602-54 = "Я решила проверить эту теорию и несколько дней носила вместо монашеского облачения своё церемо— этот костюм."
1010602-55 = "Несмотря на мои первоначальные опасения, это оказалось довольно эффективно. Многим сёстрам стало гораздо проще находиться рядом со мной."
1010602-56 = "Правда, сам костюм немного неудобный, и украшений на нём чуть больше, чем хотелось бы..."
1010602-57 = "Но создать для всех комфортную обстановку гораздо важнее моего собственного удобства. Поэтому я продолжу носить этот костюм."
1010602-58 = "[s9] «В итоге всё получилось.»\n[s10] «Это определённо отличный подход.»"
1010602-61 = "Ещё раз спасибо вам за всю помощь до сих пор, Сенсей."
1010602-62 = "Уверена, впереди будет ещё немало ситуаций, когда мне понадобятся ваши советы или помощь..."
1010602-63 = "...но хотя бы с этой историей можно поставить точку."
1010602-64 = "Лично я... рада."
1010602-65 = "[s11] «М-м. Понятно...»\n[s12] «Я тоже начинаю чувствовать гордость...»"
1010602-68 = "Кстати, я уже поговорила с остальными, но скоро у нас станет довольно много дел."
1010602-69 = "Нужно снять новые мерки со всех... и немного перераспределить бюджет..."
1010602-70 = ""
1010602-73 = "[ns13] «...?»\n[ns14] «...Погоди. Ты только что сказала „со всех“?»"
1010602-76 = "[ns15] «Почему ты говоришь „со всех“?»\n[ns16] «Ты же не собираешься шить костюмы для всех, правда?! Правда?!»"
1010602-79 = "...? А?"
1010602-80 = "Почему вы удивлены? Конечно собираюсь."
1010602-81 = "Доказано, что этот костюм помогает улучшить отношения между сёстрами. Следовательно, это естественный следующий шаг."
1010602-82 = "У нас больше никогда не будет ни недопониманий, ни конфликтов."
1010602-83 = "...?!"
1010602-84 = "Сенсей...?! Почему вы схватили меня за руку...?!"
1010602-85 = "С-Сенсей?!"
1010602-87 = "После этого мы с Сакурако на полной скорости помчались обратно в Сестринство."
1010602-88 = "Там я нашёл обеспокоенных сестёр, сжимавших в руках бланки заказов."
1010602-89 = "...Именно так мне удалось остановить план «Айдольские костюмы для всех сестёр»."
