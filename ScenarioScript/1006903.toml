[translation]
1006903-1 = "Дегустация"
1006903-2 = "Променад Чёрной Черепахи"
1006903-3 = "Руми пригласила меня на Променад Чёрной Черепахи."
1006903-4 = ""
1006903-7 = ""
1006903-8 = "Добро пожаловать, Сенсей. Я вас ждала."
1006903-9 = "Вы заинтригованы? Ха-ха-ха... Не стоит. Вообще-то мне даже немного неловко..."
1006903-10 = "[s1] «Когда ты так говоришь...»\n[s2] «А почему тогда не попросить помощи у остальных членов клуба?»"
1006903-13 = "Насчёт этого..."
1006903-14 = "Обычно я, конечно же, попросила бы остальных помочь!"
1006903-15 = "Но сейчас все слишком заняты, чтобы помочь мне. Поэтому вы здесь!"
1006903-16 = "Все усердно учатся, но клуб тоже важен. По крайней мере, я так считаю."
1006903-17 = "[s] «(Что-то здесь нечисто...)»"
1006903-18 = ""
1006903-20 = ""
1006903-22 = ""
1006903-23 = ""
1006903-24 = "Вот первое блюдо. Пожалуйста, попробуйте и скажите, что думаете."
1006903-25 = "Не сдерживайтесь. Мне нужно ваше честное мнение."
1006903-26 = "Да-да, я знаю, что оно немного зелёное. Оно... эм... таким и должно быть!"
1006903-27 = ""
1006903-29 = ""
1006903-31 = "Я попробовал блюдо Руми."
1006903-32 = ""
1006903-35 = "[ns3] «Ч-Что это за вкус...?!»\n[ns4] «Я не чувствую язык!»\n[ns5] «*кхе-кхе* Что тут вообще...?!»"
1006903-39 = "Понятно. Ничего страшного. Сделаю заметку об этом блюде..."
1006903-40 = ""
1006903-42 = ""
1006903-43 = "[ns] «Здесь вообще нет ничего „ничего страшного“!»"
1006903-44 = "Не нужно так расстраиваться. У меня есть ещё блюда на пробу."
1006903-45 = ""
1006903-47 = ""
1006903-48 = "Я попробовал следующее блюдо Руми."
1006903-49 = ""
1006903-52 = "[ns6] «Т-Так жирно!»\n[ns7] «Слишком остро... Дышать не могу...»"
1006903-55 = "Понятно... Как я и ожидала. Хорошо, следующее блюдо будет последним."
1006903-56 = "[s] «Слушай, я не уверен, что переживу ещё одно блюдо...»"
1006903-57 = "Ха-ха-ха! Ну что вы, Сенсей. Теперь уже поздно отступать."
1006903-58 = "Вы уже зашли так далеко и теперь хотите сдаться на полпути?"
1006903-59 = "Как говорится, взялся за гуж — не говори, что не дюж! Так будет честно... правда?"
1006903-60 = "Жизнь полна таких испытаний. Вы взрослый, Сенсей. Уверена, вам их тоже выпадало немало."
1006903-61 = ""
1006903-63 = ""
1006903-65 = "Я снова попробовал... блюдо Руми...!"
1006903-66 = ""
1006903-69 = "[ns8] «Этот вкус...»\n[ns9] «Невероятно! Какая гармония вкусов!»"
1006903-72 = "Наконец-то... успех."
1006903-73 = "Горечь — непростой вкус, если хочешь использовать её правильно."
1006903-74 = "Можно заглушить её солью, но тогда есть риск сделать всё блюдо слишком солёным."
1006903-75 = "Поэтому я попробовала уравновесить её жирностью и остротой..."
1006903-76 = "Идея в том, чтобы покрыть язык жиром, скрыть горечь и немного взбодрить вкусовые рецепторы. Заодно блюдо становится приятно насыщенным!"
1006903-77 = "А острота быстро пробивает жирность и даёт ощущение облегчения."
1006903-78 = "Судя по вашей реакции, всё сработало."
1006903-79 = "[s] «Так вот как ты придумываешь новые рецепты.»"
1006903-80 = "Именно. Возможно, с моей стороны это немного упрямо..."
1006903-81 = "Вкус — такая тонкая вещь. Никогда не знаешь, какие сочетания в итоге сработают."
1006903-82 = "А значит, приходится много пробовать и ошибаться."
1006903-83 = "[s10] «Это достойно уважения.»\n[s11] «Кажется, я начинаю понимать, почему члены твоего клуба внезапно так заинтересовались учёбой...»"
1006903-86 = "Ха-ха-ха... Ну, не то чтобы мне хотелось мучить своих одноклубниц."
1006903-87 = "Вы тоже не хотите быть дегустатором? Хм... Ну, я всё равно считаю, что в итоге всё получилось!"
1006903-88 = "После успеха последнего блюда у меня появилось ещё пять идей для рецептов."
1006903-89 = "Уверена, все они будут такими же вкусными, как блюдо, которое вы только что попробовали."
1006903-90 = "Так что не уходите далеко — следующее блюдо уже на подходе!"
1006903-91 = "[s12] «О нет, не надо...»\n[s13] «Я больше ни кусочка не съем!»"
1006903-94 = "Совсем ничего не хотите...?"
1006903-95 = "Но вдохновение пришло ко мне ПРЯМО СЕЙЧАС. Если я приготовлю эти блюда позже, всё будет уже не то..."
1006903-96 = ""
1006903-99 = "Сенсей? Куда вы идёте?"
1006903-101 = "Я попытался сбежать, но в итоге она меня поймала..."
1006903-102 = "И меня снова кормили тарелкой за тарелкой, пока я едва не лопнул..."
