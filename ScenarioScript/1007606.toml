[translation]
1007606-1 = "Что не стоит объяснять"
1007606-2 = "Когда все соревнования закончились, я нашёл Котори одну на стадионе."
1007606-3 = ""
1007606-5 = ""
1007606-6 = "Она сидела на скамейке и смотрела на теперь уже пустое поле."
1007606-7 = "...О, Сенсей."
1007606-8 = "Я не хотела заставлять вас искать меня."
1007606-9 = "[s1] «Ты в порядке? Ты сама на себя не похожа.»\n[s2] «Почему твой голос звучит так подавленно?»"
1007606-12 = "П-Правда? Ха... Хаха... Простите, Сенсей. Меня и правда слишком легко читать."
1007606-13 = "Хм..."
1007606-14 = "Я как раз пытаюсь понять. Почему я сама на себя не похожа."
1007606-15 = "Конечно, физически я вымотана, но дело не только в этом..."
1007606-16 = "В кои-то веки мне нечего сказать."
1007606-17 = "Наверное, я чувствую... разочарование?"
1007606-18 = "День спорта мне понравился сильнее, чем я ожидала, несмотря на мою неспортивность."
1007606-19 = "Может, дело было не в упражнениях? Энергия толпы и крики поддержки тоже захватывали..."
1007606-20 = "Но теперь всё закончилось. И у меня странное чувство, когда я сижу на пустом поле и смотрю на пустые трибуны."
1007606-21 = "...Хм?"
1007606-22 = "В будущем ещё будут спортивные дни?"
1007606-23 = "Хаха... Наверное, вы правы."
1007606-24 = "Хм..."
1007606-25 = "То есть да, вы правы. Они ещё будут. И я тоже пыталась утешить себя этой мыслью."
1007606-26 = "Но на самом деле не будут. Именно этот спортивный день мы уже никогда не проживём снова."
1007606-27 = "Следующий будет похожим, но уже не таким же."
1007606-28 = "Те прекрасные воспоминания, которые мы создали сегодня, больше никогда нельзя будет пережить точно такими же. Это необратимый факт."
1007606-29 = ""
1007606-31 = ""
1007606-32 = "...Ах."
1007606-33 = "О-Ой. Что я опять несу?"
1007606-34 = "Простите, Сенсей. Я не хотела спорить с тем, что вы сказали."
1007606-35 = "Может, я всё ещё неважно себя чувствую. Лучше просто вернусь и отдохну."
1007606-36 = "[s3] «Честность — лучшая политика.»\n[s4] «Я тоже не хочу просто обмениваться пустыми банальностями.»"
1007606-39 = "...Сенсей...?"
1007606-40 = "...Что вы имеете в виду? Мне просто нужно изменить взгляд на вещи?"
1007606-41 = "...Как?"
1007606-42 = "...Хм?"
1007606-43 = "...Может, хорошо, что некоторые события случаются лишь раз в жизни?"
1007606-44 = "Что это вообще значит...?"
1007606-45 = "[s5] «Именно такие уникальные впечатления и самые драгоценные! Или как-то так...»\n[s6] «Именно поэтому эти воспоминания становятся ещё важнее!»"
1007606-48 = "Эм... Хм..."
1007606-49 = "Но это ведь почти то же самое, что просто мыслить позитивно, разве нет?"
1007606-50 = "А?"
1007606-51 = "А..."
1007606-52 = "Странно... хм..."
1007606-53 = "Если смотреть на это так, мне и правда становится немного лучше."
1007606-54 = "Факты остались прежними, так почему настроение поднялось? Что это за странный эффект?"
1007606-55 = "Если попробовать подойти к проблеме так, как вы предложили..."
1007606-57 = "Каждое событие по-своему уникально. У него были свои участники, свои проблемы и свои соревнования. Ничего страшного, если следующее будет в чём-то похожим, но не точной копией."
1007606-58 = "Потому что все так старались сделать этот Фестиваль Хало Кивотоса настолько хорошим, насколько вообще возможно. Никто не думал ни о прошлом годе, ни о следующем!"
1007606-60 = "В этом и был смысл сегодняшнего спортивного дня."
1007606-61 = "...Хаха."
1007606-62 = "Знаете, Сенсей, возможно, в конце концов..."
1007606-64 = "Даже моё чувство пустоты... ничего из этого не было бы возможно без этого факта."
1007606-65 = "И я смогла увидеть, как все дорогие мне люди выкладываются по полной."
1007606-66 = "Я вышла из зоны комфорта и узнала столько нового!"
1007606-67 = "Мне довелось испытать то, чего обычно со мной не случается..."
1007606-68 = ""
1007606-69 = "Например, сидеть рядом с Сенсеем, смотреть на закат и делиться своими чувствами."
1007606-70 = ""
1007606-72 = ""
1007606-73 = "Хи-хи. Хи-хи-хи..."
1007606-74 = "Изменить взгляд на вещи совсем непросто, но это очень действенное лекарство от негативных эмоций."
1007606-75 = "[s7] «...Котори?»\n[s8] «Похоже, тебе уже намного лучше.»"
1007606-78 = "Да. Думаю, ваш совет мне очень помог."
1007606-79 = "...Хм?"
1007606-80 = "В-Вас впечатляет, как быстро я смогла снова прийти в себя?"
1007606-81 = "...Хи-хи."
1007606-82 = "Сенсей..."
1007606-83 = "Возможно, для меня это прозвучит немного нехарактерно, но..."
1007606-84 = "Вы, возможно, удивитесь, узнав..."
1007606-85 = "...что некоторые вещи лучше оставить без объяснений."
1007606-86 = "[s9] «...К-Котори?! Что ты имеешь в виду?!»\n[s10] «Что вы сейчас сказали, госпожа Котори?!»"
1007606-89 = "Хм. На моё заявление это был вполне справедливый ответ."
1007606-90 = "Но всё равно я не стану объяснять. Не буду. Только не это."
1007606-91 = "..."
1007606-92 = "Я понимаю, что это не самый приемлемый компромисс..."
1007606-93 = "Но если вы не против..."
1007606-95 = "Просто побудьте здесь со мной, пока не зайдёт солнце."
