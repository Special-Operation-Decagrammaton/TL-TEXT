[translation]
84304300200-5 = "Алгоритм Старшей Сестры..."
84304300200-6 = "Проще говоря, это система, которая проверяет и отслеживает любые данные внутри Миллениум."
84304300200-7 = "Разве мы и сейчас не делаем это? В чём разница?"
84304300200-8 = "Сейчас мы отслеживаем ПОТОК данных, а не само содержимое и не личность пользователя."
84304300200-9 = "Допустим, кто-то сделал фотографию и куда-то её отправил. Наша нынешняя система увидит, что фотография была отправлена..."
84304300200-10 = "...а Алгоритм Старшей Сестры увидит саму фотографию, данные телефона фотографа, личные данные отправителя, альбом в телефоне, место, где сделали снимок, и личные данные всех людей на фотографии. И текст сообщения, которое отправили вместе с ней."
84304300200-11 = "Хм?"
84304300200-12 = "Можно было просто сказать: «Это плохо»."
84304300200-13 = "Это плохо. Я знаю."
84304300200-14 = "...А тогда мне было всё равно."
84304300200-16 = "..."
84304300200-17 = "После того как ушла, я ни разу им не пользовалась и после этого больше никогда не собираюсь. Как только решим эту проблему, я уничтожу его."
84304300200-18 = "На самом деле это наш шанс сделать именно это. До сих пор у меня не было доступа."
84304300200-19 = "Основное оборудование Алгоритма Старшей Сестры находится в самой глубине Центра данных, в секретной комнате, которой нет даже на чертежах."
84304300200-20 = "Если вы мне поможете, после этого я смогу его уничтожить. Это лучший возможный исход."
84304300200-21 = "Пока никто больше не знает о его существовании, но если он когда-нибудь попадёт не в те руки..."
84304300200-22 = "...ну, будут проблемы."
