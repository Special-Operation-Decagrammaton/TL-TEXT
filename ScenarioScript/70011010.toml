[translation]
70011010-1 = "Меланхолия Канбары Мисузу 1"
70011010-2 = ""
70011010-3 = "Спасибо, Сузу!"
70011010-4 = "Благодаря тебе у меня хватило смелости начать жизнь с чистого листа! Буду жить полной жизнью! Позвоню, когда выйду, обещаю!"
70011010-5 = "Если уж на то пошло, всю тяжёлую работу проделала именно ТЫ."
70011010-6 = ""
70011010-8 = ""
70011010-9 = ""
70011010-10 = ""
70011010-11 = ""
70011010-12 = "Потрясающая работа, Сузу! Ты получила звание «Студент месяца» уже третий раз подряд!"
70011010-13 = "Наверное, ты единственная за всю историю Исправительного бюро! Да что там — за всю историю Валькирия!"
70011010-14 = "Ох... Я всем обязана щедрой поддержке коллег."
70011010-15 = ""
70011010-17 = ""
70011010-18 = ""
70011010-19 = ""
70011010-20 = ""
70011010-21 = "Ну а кто, если не Сузу, правда?"
70011010-22 = "Сузу? А, вы, наверное, о Канбаре Мисузу. Она справится? Характер у неё такой..."
70011010-23 = "Но навыки у неё бесспорные."
70011010-24 = "(...Стоп. Что это было?)"
70011010-25 = "А вот и виновница торжества! Вы Канбара Мисузу, верно?!"
70011010-26 = ""
70011010-28 = ""
70011010-29 = ""
70011010-30 = ""
70011010-31 = ""
70011010-32 = "Вас назначили следующей главой Исправительного бюро! Что чувствуете? Какие планы, директор?"
70011010-33 = "(Как до этого дошло...?)"
70011010-34 = "(Я ведь никогда этого не хотела...)"
70011010-35 = ""
70011010-37 = ""
70011010-38 = ""
70011010-39 = ""
70011010-40 = ""
70011010-41 = ""
70011010-42 = ""
70011010-43 = ""
70011010-44 = ""
70011010-45 = ""
70011010-46 = ""
70011010-48 = "...дзу."
70011010-50 = "Сузу."
70011010-51 = "Хья-а-а?!"
70011010-52 = "Ого! Вы в порядке?"
70011010-53 = "О, да. Благодарю вас. Я немного задумалась..."
70011010-54 = "Ты часто улетаешь мыслями, Сузу! Будь осторожнее. Не хотелось бы, чтобы какой-нибудь... неприятный тип застал тебя врасплох!"
70011010-55 = "Хи-хи... Признаю вину. Буду осторожнее. Спасибо за заботу."
70011010-56 = "...Ага. Ну, насчёт того, о чём я просила... если ты не против..."
70011010-57 = "А, вы об этом...?"
70011010-58 = ""
70011010-60 = ""
70011010-61 = ""
70011010-62 = "Да, именно! Без хорошей дозы с утра я вообще начать день не могу!"
70011010-63 = "Спасибо, Сузу! Береги себя! В то же время на следующей неделе? Ты же знаешь, мне нужна моя доза!"
70011010-64 = "Вообще-то заносить предметы извне сложно... из-за действующих правил."
70011010-65 = "Так что в следующий раз я, возможно, не смогу..."
70011010-66 = "А? Но в ЭТОТ раз ты прекрасно всё пронесла. И на прошлой неделе тоже."
70011010-67 = "Да, но это были... особые случаи, понимаете."
70011010-68 = "Тогда надеюсь, на следующей неделе тоже найдётся «особый случай»! Для меня это много значит!"
70011010-69 = "Хорошо..."
70011010-70 = "Но если позволите совет — постарайтесь постепенно от них отказаться. Для здоровья это вредно."
70011010-71 = "А? Ага... Тут ты права."
70011010-72 = "Хм? Стоп. Стоять."
70011010-73 = ""
70011010-75 = ""
70011010-76 = ""
70011010-77 = "Ай! Тюремная надзирательница!"
70011010-78 = "Я же говорила, мы НЕ «тюремные надзиратели». Знаешь что? Забудь."
70011010-79 = "Просто скажи, какие неприятности ты опять устроила."
70011010-80 = "Ну да ладно, нельзя же сразу с порога меня во всём подозревать!"
70011010-81 = "Лучше подумай о СВОИХ поступках и о том, почему ты здесь. И, что важнее..."
70011010-82 = ""
70011010-84 = "..."
70011010-85 = ""
70011010-87 = ""
70011010-88 = "...Давай избавим меня от необходимости тебя обыскивать, ладно? Выворачивай карманы."
70011010-89 = "Тц."
70011010-90 = ""
70011010-92 = ""
70011010-93 = ""
70011010-94 = "...? Что это?"
70011010-95 = "Не видишь? Очевидно же, пакетик... напитка. Для матча-латте."
70011010-96 = "Если нужен растворимый кофе, мы можем его выдать. Нужно только попросить."
70011010-97 = "Ага, только он горький. Отстой."
70011010-98 = "И что, что горький...? Ты вообще-то не на курорте..."
70011010-99 = "И где ты взяла на это деньги? Эти премиальные стики матча недешёвые."
70011010-100 = "О, правда?"
70011010-101 = "Стой, ты даже не знала? Ты хоть заплатила директору?"
70011010-102 = "О, эм, просто так вышло, что у меня была коробка."
70011010-103 = "Наверное, тяжело всё время сидеть взаперти, и я подумала, что ей будет приятно получить угощение. Хи-хи..."
70011010-104 = "Ах! В конце концов, наша главная обязанность — заботиться о благополучии студентов, верно?"
70011010-105 = "Директор."
70011010-106 = "...Похоже, всё-таки нет, да? Хи-хи..."
70011010-107 = "Если продолжите вот так проносить вещи, у нас станет больше работы."
70011010-108 = "Мне очень жаль..."
70011010-109 = "Эй! Не будь так строга к Сузу. Это я её попросила! И очень настойчиво!"
70011010-110 = "Так что если хочешь кого-то отчитывать — отчитай меня!"
70011010-111 = ""
70011010-113 = ""
70011010-114 = "Ну да. Именно это я и собираюсь сделать."
70011010-115 = "Стой, а почему ты ведёшь себя так, будто злодей здесь Я?"
70011010-116 = "Так, что тут происходит?"
70011010-117 = ""
70011010-119 = ""
70011010-120 = "О, привет."
70011010-121 = "...А. Кажется, картина ясна."
70011010-122 = "Для начала, ты. Возвращайся в камеру. И контрабанду забери с собой."
70011010-123 = "Прости... Я не хотела втянуть тебя в неприятности. Мне ужасно неловко."
70011010-124 = "Но ты права... Постараюсь сократить кофеин. Прости меня, Сузу!"
70011010-125 = ""
70011010-127 = ""
70011010-128 = "Хи-хи... Береги себя."
70011010-129 = "Мы вернёмся к работе. Продолжайте, директор."
70011010-130 = ""
70011010-132 = ""
70011010-133 = ""
70011010-134 = ""
70011010-135 = "Да, буду рада снова поработать с вами обеими."
70011010-137 = "То есть мы правда просто это спустим? Сделаем вид, что ничего не было?"
70011010-138 = "Ты же знаешь директора. Нам приходится работать с учётом её характера."
70011010-139 = "*вздох* Ты слишком мягкая, Мисузу."
70011010-140 = "Слушай, она отличная девушка, и она мне очень нравится, но..."
70011010-141 = "Понимаю. Иногда ты просто не подходишь для такой работы."
70011010-143 = "Я желаю ей всего хорошего, но руководить Исправительным бюро — совсем не её дело."
70011010-148 = ""
70011010-149 = ""
70011010-150 = "...Ещё один долгий день."
70011010-151 = ""
70011010-153 = ""
70011010-154 = "Мне всегда казалось, что кабинет директора слишком просторный. Всё это для одного человека?"
70011010-155 = "Когда я была младшей, тут всё было тесно и забито людьми. Думаю, было бы приятно делить это пространство со всеми."
70011010-156 = ""
70011010-158 = ""
70011010-159 = ""
70011010-160 = "Интересно, мои предшественницы чувствовали то же самое? Или только я?"
70011010-161 = ""
70011010-163 = ""
70011010-164 = ""
70011010-165 = "Ладно, нет смысла зацикливаться. На этом остановлюсь."
70011010-166 = "Хорошо, лучше вспомним хорошее. Сегодня я довольно быстро закончила работу, правда?"
70011010-167 = "...Немного перегрузила себя, но всё движется. Мы идём по графику. Обо всех позаботились."
70011010-168 = ""
70011010-170 = ""
70011010-171 = "Фу-фу."
70011010-172 = "Вязание всегда помогает мне расслабиться."
70011010-173 = "Вот бы этот момент длился вечно..."
70011010-174 = ""
70011010-176 = ""
70011010-177 = "Директор!"
70011010-178 = "Д-Да?!"
70011010-179 = ""
70011010-182 = ""
70011010-183 = "Простите, что отвлекаю, но у нас небольшая чрезвычайная ситуация!"
70011010-184 = "О, ничего страшного. Не нужно извиняться. Вы стараетесь изо всех сил."
70011010-185 = "Так что случилось?"
70011010-186 = "Была попытка побега."
70011010-187 = "Ч-Что?! Кто-то сбежал?!"
70011010-188 = "Когда?! Кто?! Это Вакамо?! Она действовала одна?!"
70011010-189 = "Эм... нет, мэм."
70011010-190 = "Она была не одна?!"
70011010-191 = "Тогда сколько Вакамо нам приходится ловить?!"
70011010-192 = "Эм, Вакамо всё ещё только ОДНА..."
70011010-193 = "Стойте, Вакамо ведь давно сбежала. Вы не знали?"
70011010-194 = "Ой, точно, сбежала... Вспомнила. Я просто так испугалась."
70011010-195 = "Директор, пожалуйста, успокойтесь. Мы пресекли попытку побега."
70011010-196 = "Но... дело серьёзное. Нам нужны ваши указания, директор."
70011010-197 = "Вот личное дело студенты."
70011010-198 = ""
70011010-200 = ""
70011010-201 = ""
70011010-202 = "Спасибо. Тогда..."
70011010-203 = ""
70011010-205 = ""
70011010-206 = ""
70011010-207 = ""
70011010-208 = ""
70011010-209 = "...Дадите мне немного времени изучить файл? Я хотела бы лично с ней поговорить."
70011010-210 = "Под «поговорить» вы имеете в виду «допросить»?"
70011010-211 = "...Мне не очень нравится такая формулировка, но да."
70011010-212 = "Госпожа директор, если позволите... Вам, наверное, лучше воздержаться от личной беседы с особо опасной заключённой."
70011010-213 = "Я хорошо знаю Исправительное бюро."
70011010-214 = "Уже поздно, персонала мало. Позвольте мне помочь."
70011010-215 = "...Хорошо, мэм. Подготовим вам комнату."
70011010-216 = ""
70011010-218 = ""
70011010-220 = ""
70011010-221 = ""
70011010-223 = "...Знаете, Исправительное бюро не всегда было таким."
