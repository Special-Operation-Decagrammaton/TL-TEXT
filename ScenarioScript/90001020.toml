[translation]
90001020-1 = "Эпизод 2;Расследование"
90001020-2 = "Эйми, Токи, вы в порядке? Докладывайте!"
90001020-3 = ""
90001020-5 = ""
90001020-6 = ""
90001020-7 = "Я Эйми. Задание выполнено, президент."
90001020-8 = "У меня то же самое. Повреждений и ранений нет."
90001020-9 = "Однако во время боя мы обнаружили две вещи."
90001020-10 = "Об одной можно доложить устно, а вторую придётся показать. С чего начнём?"
90001020-12 = "Начнём с простого."
90001020-13 = "Говорить проще. Движения сил Декаграмматона стали более организованными."
90001020-14 = "Вот как?"
90001020-15 = "Я объясню. Раньше казалось, что у них нет ни направления, ни руководства. Теперь это не так."
90001020-16 = "Они безупречно применяли маскировку, засады и тактику осады. Разумеется, лично для меня это вообще не стало проблемой. Мир-мир."
90001020-17 = "Сенсей, сделайте с этим что-нибудь. Одной президент уже было слишком много, а теперь к ней присоединилась Токи."
90001020-18 = "[s] «У Токи хотя бы нет плохих намерений...»"
90001020-19 = "Тебе не кажется, что именно в этом и проблема?"
90001020-20 = "[s] «У меня странное чувство дежавю...»"
90001020-21 = ""
90001020-23 = ""
90001020-25 = ""
90001020-26 = "Это выражение страдания на лице Эйми... Потрясающе, Токи. Великолепная, даже достойная похвалы работа."
90001020-27 = "Спасибо, президент Химари."
90001020-28 = "А что было вторым? То, что мне нужно увидеть."
90001020-29 = "Хм... Сейчас отправлю. Сенсей, пожалуйста, тоже посмотрите и скажите, что думаете."
90001020-34 = "[ns] «Что это...?!»"
90001020-36 = ""
90001020-37 = "Что-то огромное прорезало Ледниковое море. Эйми, ты видела это своими глазами. Что думаешь?"
90001020-40 = "Согласна с вашей оценкой. Добавлю лишь, что лёд, похоже, был проломлен каким-то кораблём."
90001020-41 = "Как видно на экране, я тоже считаю, что так и есть. Как главный разведчик здесь, заявляю: нам нужно идти по этому следу."
90001020-42 = "Может, это и есть след Гебуры, который мы искали?"
90001020-43 = "..."
90001020-44 = "Нет. Не думаю."
90001020-45 = "Помните нашу первую встречу с Гебурой?"
90001020-46 = "Она появилась из ниоткуда, вырвавшись из-под ледяного покрова Ледникового моря."
90001020-47 = "А. Теперь понимаю, к чему клонит президент."
90001020-48 = "Именно. Судя по её перемещениям, Гебура всегда пользовалась способностью незаметно двигаться под Ледниковым морем."
90001020-49 = "А это совершенно не похоже на её обычное поведение."
90001020-50 = "Тот, кто это сделал, явно демонстрировал силу. Это не соответствует прежнему поведению Гебуры."
90001020-51 = "Будто кто-то специально показывал свою мощь... Возможно, это нечто ещё хуже Гебуры."
90001020-52 = ""
90001020-53 = "...Ещё один пророк?"
90001020-55 = "Пока ничего не подтверждено. С тех пор как мы потеряли след Гебуры, мы топчемся на месте без единой зацепки."
90001020-56 = "Но похоже, пора действовать."
90001020-57 = "[s] «Тогда пойдём по следу!»"
90001020-58 = "И приостановим поиски Гебуры?"
90001020-59 = "Понятно. Если это связано с другим пророком, как подозреваем мы с Токи, то и Гебура, скорее всего, окажется где-то на этом пути."
90001020-60 = "[s] «И ещё меня не отпускают мысли о тех детях.»"
90001020-61 = "Вы имеете в виду...?"
90001020-62 = "Три инженера, которых мы встретили: Эйн, Соф и Ор."
90001020-63 = ""
90001020-64 = "Они первыми действительно попытались с нами общаться."
90001020-65 = "Их появление здесь вряд ли было простым совпадением."
90001020-66 = ""
90001020-67 = "Хорошо, Сенсей. Я согласна."
90001020-68 = "Эйми и Токи начнут выслеживать—"
90001020-70 = "О чём вы говорите, президент? Вы тоже должны пойти."
90001020-71 = "Да, и Сенсей. Сенсей тоже должен пойти."
90001020-72 = "[s] «А? Я тоже...?»"
90001020-74 = "И я?!"
90001020-76 = "Конечно. Кто знает, как далеко нас заведёт этот след?"
90001020-77 = "Пешком будет неэффективно. В оперативной комнате есть вертолёт. Нужно воспользоваться им."
90001020-78 = "Да. Эффективность важна. Повторю, раз это важно. Эффективность действительно важна."
90001020-80 = "Вы вообще понимаете, что просите меня, нежную, слабую, хрупкую и утончённую красавицу, лететь сквозь суровые условия Ледникового моря?"
90001020-82 = "Всё нормально, президент. Вы гораздо сильнее, чем думаете. Гарантирую."
90001020-83 = "Верно, президент Химари. Если точнее, вы словно красная панда, которая подняла свои маленькие лапки и пытается перегородить дорогу."
90001020-85 = "Так я сильная или слабая?!"
90001020-86 = "[s1] «Радиус поисков сильно увеличится.»\n[s2] «Отсюда лучше двигаться всей группой.»"
90001020-89 = "Хмф. С Сенсеем трудно спорить. Понятно."
90001020-90 = "Эйми, Токи, пожалуйста, возвращайтесь, и мы начнём..."
90001020-91 = "[s] «...исследование новой зацепки!»"
90001020-92 = "Сенсей, вы как-то подозрительно этому рады."
90001020-97 = ""
90001020-98 = "Соединить эту часть с этой... а затем снова перекрестить тот цилиндр вон там..."
90001020-99 = "Хех. Если мои расчёты верны—"
90001020-100 = "Эйн? Вот ты где! Ты опять возишься с механизмами?"
90001020-102 = "Кья-а-а?!"
90001020-103 = "А-а! Напугала! Я что сделала?!"
90001020-104 = "С-С-Соф...? Т-Ты меня напугала... Простите, что закричала..."
90001020-105 = "Напугала? Чего тут бояться? Здесь только ты, я и Ор. Ор, я и ты! Посторонним вход запрещён!"
90001020-106 = "Ва-а! Н-Но я была так сосредоточена, а ты заговорила так внезапно... Я ничего не могла поделать!"
90001020-107 = "Ладно-ладно. Прости, хорошо?"
90001020-108 = ""
90001020-110 = ""
90001020-112 = "Кстати, для чего эта огромная машина?"
90001020-113 = "Этот ребёнок? Ну... с чего бы начать... эм..."
90001020-114 = "Мне не нужны все грязные подробности. Просто объясни в общих чертах."
90001020-115 = "Ах, да! Я использовала максимально возможное число шестерёнок, соединила их с правильными осями... добавила ещё опорных цилиндров... и подключила всё это к системе питания...!"
90001020-116 = "Переплетаешь и соединяешь максимально возможное количество деталей... и получаешь самый-самый большой..."
90001020-118 = "...машинный калькулятор!!"
90001020-119 = "Ещё один?"
90001020-121 = "Н-Но характеристики астрономические по сравнению с предыдущими версиями! Он может запомнить десять тысяч пятидесятизначных чисел...!"
90001020-122 = "Разве такое не умеет обычный старый калькулятор? Тот, что помещается в карман? Это просто его версия размером с фабрику..."
90001020-123 = ""
90001020-125 = ""
90001020-126 = "А-а, у всех свои увлечения...! Я не хотела..."
90001020-127 = "А-а-а!"
90001020-128 = "З-Знаешь, если присмотреться, это очень впечатляет! Да! Точно!"
90001020-129 = "Ты управляешь этой гигантской штукой одним рычагом! Какая эффективность!"
90001020-130 = "Хех. Хех-хех, хи-хи. Правда ведь? Мне очень нравятся такие вещи."
90001020-131 = "Какие именно? Огромные однообразные устройства, безукоризненно исполняющие твои правила?"
90001020-132 = "Да! Правила — о-очень хорошая вещь! И когда есть чёткий ввод и вывод!"
90001020-133 = "И... и... да! Ещё лучше, если устройство большое и твёрдое!"
90001020-134 = "А если оно может двигаться вечно без внешней помощи, то лучше вообще ничего на свете нет!"
90001020-135 = "Погоди, вечные двигатели существуют только в теории."
90001020-136 = "И, Эйн. Нельзя называть вещи «большими» и «твёрдыми»."
90001020-137 = "Р-Разве...? Почему, Соф?"
90001020-138 = "Н-Ну... это..."
90001020-140 = "Да-да. Потому что среди людей такие выражения считаются непристойными. Ты ведь это хотела сказать, Соф?"
90001020-142 = "О-Ор?!"
90001020-143 = ""
90001020-145 = ""
90001020-146 = ""
90001020-147 = "Хотя причину выяснить мне не удалось, изучая социальные нормы Кивотоса, я узнала, что это выражение вызывает у людей некое «смущение»."
90001020-148 = "Но тогда возникает вопрос... Почему Соф так хорошо разбирается в человеческих выражениях?"
90001020-149 = "Т-теперь, когда вы сказали..."
90001020-150 = "Видишь? Эйн тоже любопытно. Давай. Признавайся."
90001020-151 = "Ор, прекрати! А не то..."
90001020-153 = "Тема дня! Как Соф выучила человеческие выражения?"
90001020-154 = "Моя первая теория! Соф — сталкер, получающий удовольствие от наблюдения за низшими расами вроде людей! Ей нравятся их противоречивые манеры и то, как они постоянно усложняют собственные цели, без необходимости переживая о морали и процессах."
90001020-155 = "И всё это несмотря на то, что подобное совершенно отклоняется от цели, которую мы ДОЛЖНЫ исследовать."
90001020-156 = "Мы выясним это прямо здесь и сейчас, пока логические цепи Соф перегружены!"
90001020-157 = "Конечная цель — увидеть выражение смущения на лице Соф!"
90001020-159 = "Хватит!"
90001020-162 = ""
90001020-163 = ""
90001020-164 = ""
90001020-165 = "А-Ай..."
90001020-166 = "О-Ор, ты в порядке?!"
90001020-167 = "Что посеешь, то и пожнёшь."
90001020-168 = "Хватит развлекаться бесполезной болтовнёй, сосредоточьтесь на расшифровке Заповеди!"
90001020-169 = "Нам нужно поспешить и доказать их существование до завершения алтаря!"
90001020-171 = "Заповедь? Но я уже закончила?"
90001020-173 = "Уже?!"
90001020-174 = ""
90001020-178 = ""
90001020-179 = ""
90001020-180 = "Да. Данные, собранные в битве с Аби-Эшухом, оказались огромным подспорьем."
90001020-181 = "По какой ещё причине я стала бы с тобой общаться, если не из-за Заповеди? Ну-ну-ну. Это и есть то, что называют «раздутым эго», Соф?!"
90001020-183 = "Нужно было сразу сообщить эту информацию!"
90001020-184 = "А-а! Без насилия!"
90001020-185 = ""
90001020-186 = ""
90001020-187 = ""
90001020-188 = ""
90001020-189 = ""
90001020-190 = ""
90001020-191 = ""
90001020-192 = ""
90001020-193 = ""
90001020-194 = ""
90001020-195 = "Это... Заповедь Безымянных богов."
90001020-196 = "Наконец-то... Имея её, мы наконец сможем воспроизвести возвышенное, предшествовавшее возвышенному. Честно говоря, я думала, это всего лишь давно утраченный миф."
90001020-197 = ""
90001020-199 = ""
90001020-200 = ""
90001020-201 = "Не такой уж давний и не такой уж утраченный. Об этом написано в записях господина."
90001020-202 = "Да! Господин провозгласил: «Докажите моё существование до самых дальних краёв земли.»"
90001020-203 = "Но переменные, неподвластные никому... привели к трагедии."
90001020-210 = ""
90001020-211 = "«Грех распространится по земле, и все замыслы, рождённые тем разумом, будут порочны.»"
90001020-212 = "«Вода очистит всё.»"
90001020-213 = "Что ж, это можно назвать «неудачным результатом»."
90001020-214 = "Поэтому нам и пришлось искать новые зацепки. Другое направление."
90001020-215 = ""
90001020-217 = ""
90001020-218 = ""
90001020-219 = "И-И... так мы пришли сюда, но..."
90001020-220 = ""
90001020-222 = ""
90001020-223 = "Что такое, Эйн? Какая мысль тебя тревожит?"
90001020-224 = "Даже если это было ради истины и доказательства существования господина... действительно ли нужно было полагаться на заброшенную силу?"
90001020-225 = "Н-Но я не хочу восставать против учения господина!"
90001020-227 = "Откуда это любопытство? Мы безупречны, ведь были созданы совершенными. Следовательно, всё, что мы делаем, также безупречно."
90001020-229 = "Ну-ну. Мотив вопросов Эйн мне отчасти понятен."
90001020-230 = "Мы — воплощение совершенства. Тогда зачем нам понадобилось меняться? Искать способы улучшить свои функции?"
90001020-231 = "В-Вот именно...! Поэтому я думаю, что мы—"
90001020-232 = "Ну-ну-ну. Вот здесь ты ошибаешься, Эйн. Перенастрой свои логические цепи следующим образом."
90001020-233 = ""
90001020-235 = ""
90001020-236 = "Мы, совершенные существа, всего лишь используем инструмент — силу Безымянных богов. На самом деле это и есть подтверждение нашего совершенства."
90001020-237 = "...Т-Так вот как...?"
90001020-239 = "Именно! Кто ещё, кроме нас, совершенных созданий, способен владеть такой силой?"
90001020-240 = "А когда мы безупречно реализуем наш план, фрагменты этой земли превратятся в наш источник."
90001020-241 = "Если задуматься, они называют себя пафосным именем «Безымянные боги», но сейчас это всего лишь древние окаменелости. Для нас они не более чем топливо, как ископаемое топливо, которое так любят люди."
90001020-242 = "Нет абсолютно ничего плохого в том, чтобы вытягивать силу из существ, являющихся наследием прошлого—"
90001020-243 = ""
90001020-245 = ""
90001020-246 = ""
90001020-247 = ""
90001020-248 = ""
90001020-249 = ""
90001020-250 = "А? Что это за странные взгляды?"
90001020-252 = "П-Простите... Я не совсем поняла аналогию с «ископаемым топливом»!"
90001020-253 = "Не волнуйся, Эйн. Считай это странной человеческой особенностью, которую по-настоящему способна понять только Соф."
90001020-254 = "Я сама не могу понять странной увлечённости Соф такими низшими существами."
90001020-255 = ""
90001020-257 = ""
90001020-258 = ""
90001020-259 = "Увлечённость — слишком сильное слово! Это же наша территория, верно? Мы собираемся править ими."
90001020-260 = "Так что это скорее... домашний скот? Да, точно. Как люди знают всё о собственном скоте..."
90001020-261 = "Ч-Что такое... домашний скот...?"
90001020-262 = "Наверное, ещё одно странное и незначительное понятие, которое понимает только Соф."
90001020-263 = ""
90001020-265 = ""
90001020-266 = ""
90001020-267 = "Отойди от неё, Эйн. Оставь Соф с её странностями здесь, а мы протестируем новое вычислительное устройство, которое ты разработала."
90001020-268 = ""
90001020-270 = ""
90001020-271 = ""
90001020-272 = ""
90001020-273 = "Сама отойди! Ты плохо влияешь на Эйн."
90001020-274 = ""
90001020-276 = ""
90001020-277 = "Ложь! Именно ты — воплощение отрицательного влияния!"
90001020-278 = "П-П-Подождите. Соф, Ор! Не ссорьтесь...!"
90001020-279 = ""
90001020-281 = ""
90001020-282 = ""
90001020-283 = ""
90001020-284 = ""
90001020-285 = ""
90001020-286 = ""
90001020-287 = ""
90001020-288 = "А? Это... сообщение от Гебуры?"
90001020-289 = "О-От нашей дорогой Гебуры? Я-я должна немедленно проверить."
90001020-290 = "Хм? А. Она сама предлагает операцию? И просит снять ограничения?"
90001020-291 = "Н-Нет! Наша Гебура не выдержит такой нагрузки!"
90001020-292 = "Для начала выслушаем её."
90001020-293 = ""
90001020-294 = "Ага. Изначальная задача Гебуры — обнаруживать и уничтожать любых врагов в пределах Ледникового моря..."
90001020-295 = "Она стремится выполнить эту директиву. Я могу её понять."
90001020-296 = "Замечательно, замечательно. Что-то вроде матча-реванша."
90001020-297 = "Ва-а. Наша дорогая Гебура — такая маленькая г-горячая голова. Но всё же..."
90001020-298 = "Есть ещё что-то? Хотя это маловероятно, в случае поражения Гебура просит заманить врагов... в то место."
90001020-299 = "План Б, говоришь? Любопытно. Ну-ну-ну. Совсем другой уровень важности."
90001020-300 = "Что ж, выглядит весело, так что давайте согласимся."
90001020-301 = "Ты уверена? Хотя мне, в общем-то, всё равно."
90001020-302 = "Я-я-я возражаю! Если это то место... и намерение нашей дорогой Гебуры...!"
90001020-303 = "Да-да. Оно ещё не готово работать на сто процентов. Но сам план — его просто невозможно не одобрить!"
90001020-304 = "Как она и сказала. Её силы соответствуют требованиям плана. Заставить врага сражаться, сражаться и сражаться, пока он не окажется на грани своих возможностей."
90001020-305 = "Преимущество местности тоже на нашей стороне."
90001020-306 = "Н-Но... откуда мы знаем, что план сработает? Если с нашей малышкой что-нибудь случится..."
90001020-307 = "Что за гниющие сомнения, Эйн? Если так произойдёт, тебе просто придётся вмешаться."
90001020-308 = "Ах! Т-Точно! Тогда мне правда нужно прояснить голову... Ва-а!"
90001020-309 = "Если до этого дойдёт, Эйн с радостью поднимется и справится. Хи-хи."
90001020-310 = "Тогда договоримся сейчас. Мы согласны с планом Гебуры? Я — да!"
90001020-311 = "Да. Мы должны позволить им расти, уважать их самостоятельность. Пророки ведь только открыли глаза."
90001020-312 = "Х-Хорошо. Если Соф и Ор так считают, а главное, если этого хочет наша дорогая Гебура..."
90001020-313 = "Я сделаю всё возможное, чтобы доказать, как можно использовать силу Безымянных богов способами, о которых раньше никто и не думал!"
90001020-314 = ""
90001020-316 = ""
90001020-318 = "Следующий эпизод;Второй"
