[translation]
2002002-1 = "Вкусы гениального хакера"
2002002-2 = "Получив звонок от Химари, я отправился в клубный корпус Миллениума."
2002002-5 = "Коридор клубного корпуса Миллениума"
2002002-7 = "[ns] «Химари сказала прийти сюда. И что мне здесь делать...?»"
2002002-8 = ""
2002002-11 = "Затем я услышал приближающееся жужжание."
2002002-12 = ""
2002002-15 = "[ns] «Это... охранный дрон Миллениума?»"
2002002-16 = ""
2002002-23 = "[ns] «Ты хочешь, чтобы я... пошёл за тобой?»"
2002002-28 = "Я последовал за дроном, и он привёл меня к двери клубной комнаты в укромном уголке здания."
2002002-29 = ""
2002002-32 = "На табличке рядом с дверью было что-то написано."
2002002-33 = "[ns] «Клуб „Продекламируй число Пи на одном дыхании“...?»"
2002002-34 = ""
2002002-40 = "Я ждала вас, Сенсей. Проходите."
2002002-41 = ""
2002002-48 = ""
2002002-50 = "Хи-хи, вы как раз вовремя. Добро пожаловать, Сенсей."
2002002-51 = ""
2002002-54 = "Спасибо, что проводил. Можешь возвращаться к своим обычным обязанностям."
2002002-55 = ""
2002002-60 = "[ns] «Химари, что это было с дроном...?»"
2002002-61 = "Хм? О, это был охранный дрон Миллениума."
2002002-62 = "Такой прекрасный и хрупкий цветок, как я, не может просто выйти встречать вас, поэтому я отправила дрона проводить вас ко мне."
2002002-63 = ""
2002002-65 = ""
2002002-66 = ""
2002002-68 = "И разумеется, для этого я его взломала. Деликатно."
2002002-69 = "Он ведь отлично справился в роли проводника?"
2002002-70 = "Мне всегда казалось, что дроны довольно милые и очаровательные."
2002002-71 = ""
2002002-74 = "[ns] «Смотрю, ты всё ещё занимаешься подобным...»"
2002002-76 = "[ns1] «Так что это за место?»\n[ns2] «Странное название у клуба.»"
2002002-79 = "О-О? Н-Неужели настолько странное?"
2002002-80 = "...Возможно, стоило придумать название получше... Я размышляла над ним днями и ночами. Мне казалось, оно звучит умно и загадочно..."
2002002-81 = "Я думала, именно такое название придумал бы настоящий гений Миллениума..."
2002002-82 = "[s] «(Она так расстроилась!)»"
2002002-84 = "[ns] «Ну, оно странное, но загадочные и уникальные вещи часто такие, правда?»"
2002002-85 = "...Хи-хи. Вы и правда так думаете?"
2002002-86 = "Как я и думала! ♪"
2002002-87 = "Что бы кто ни говорил, только прекрасный супергениальный хакер Миллениума..."
2002002-88 = "Да, только я, единственная и неповторимая Акебоши Химари, могла придумать такое название!"
2002002-89 = ""
2002002-92 = "[ns] «...И чем же здесь занимается единственная и неповторимая Химари?»"
2002002-93 = "А, точно."
2002002-94 = "Проще всего считать это место моим тайным убежищем."
2002002-95 = "[s] «Убежищем?»"
2002002-96 = "Да. И клубная комната оперативной группы, и комната Веритас находятся под пристальным надзором Старшей Сестры."
2002002-97 = "Поэтому я взломала административную систему Миллениума, нашла свободную клубную комнату и «зарезервировала» её для собственного, незаметного использования."
2002002-98 = "И ради чего я всё это сделала?"
2002002-99 = "Чтобы отдыхать, конечно. Такой хрупкий и прекрасный супергениальный хакер, как я, нуждается в большом количестве сна..."
2002002-100 = "Мой мозг работает с такой интенсивностью, что ему жизненно необходимы регулярные перерывы."
2002002-101 = "[s3] «Понятно... Но разве не будет плохо, если тебя поймают?»\n[s4] «Дрон, камеры наблюдения Миллениума или...»"
2002002-102 = "Хе-хе-хе. Неужели вы думаете, что такие мелкие препятствия заслужили больше, чем мимолётную мысль?"
2002002-103 = "Хе-хе-хе. Неужели вы думаете, что такие мелкие препятствия заслужили больше, чем мимолётную мысль?"
2002002-104 = "Самое очевидное решение — выяснить маршрут патрулирования дрона, но хорошее решение — просто взломать и «исправить» маршрут, если понадобится."
2002002-105 = "Я часто настраиваю покрытие камер наблюдения по своему удобству, создавая столько слепых зон, сколько захочу..."
2002002-106 = ""
2002002-108 = ""
2002002-109 = ""
2002002-111 = "В отличие от моей непревзойдённой жизни отдыха, в которой нет ни одной слепой зоны!"
2002002-112 = "[s5] «Какая грандиозная схема ради отдыха мозга...»\n[s6] «Если это настолько важное место, мне точно можно здесь быть?»"
2002002-115 = "О, да. Вам можно."
2002002-116 = "На самом деле я рада, что вы пришли. Мне нужно, чтобы вы были здесь."
2002002-117 = "[s] «Почему?»"
2002002-118 = "Как вам известно, мной восхищаются словно прекрасным цветком, поймавшим солнечный свет и вечно цветущим на краю продуваемого ветрами утёса."
2002002-119 = "В приглушённом благоговением шёпоте говорят, что я гениальная красавица: пион, когда лежу неподвижно, камелия, когда сижу, и лилия, когда вздыхаю."
2002002-120 = "[s] «Какая смелая самореклама! Поистине непревзойдённо!»"
2002002-121 = "Да, и как цветок в полном расцвете я должна помнить о собственной хрупкости, чтобы кто-нибудь не подошёл и не сорвал меня без раздумий."
2002002-122 = "И конечно... даже такой безупречной красавице, как я, иногда нужно отдохнуть от напряжения, которое приходит вместе с восхищением."
2002002-123 = "Кхм. Так вот, эм, я хочу сказать..."
2002002-124 = "Мне нужно немного расслабиться..."
2002002-125 = "Возможно, с кем-то надёжным. Может, с кем-то, кто ничего не потребует взамен..."
2002002-126 = "Возможно, этот гипотетический человек увидит мою настоящую сторону и никогда не станет злиться или ругать меня. Я задумалась, есть ли рядом со мной кто-то такой."
2002002-127 = "Вот... да."
2002002-128 = "[s] «Угу. И...?»"
2002002-129 = "...Я сумела подготовить это идеально уединённое убежище, но оказалось, что уединение довольно скучное."
2002002-130 = "А если бы здесь были вы, Сенсей..."
2002002-131 = "Я подумала, что, возможно, мне понравится разделить это уединение с вами..."
2002002-132 = "Это жадно? Или просто мимолётная мысль?"
2002002-133 = "Так что... Ну... Вот..."
2002002-134 = "Поэтому я и попросила вас прийти."
2002002-135 = "*нервно оглядывается*"
2002002-136 = "[s] «Я всегда не против чего-то такого, Химари.»"
2002002-137 = "О."
2002002-138 = "[s] «Хм? Химари, что-то не так?»"
2002002-139 = ""
2002002-141 = ""
2002002-142 = "Н-Ничего. Всё нормально."
2002002-143 = "Хи-хи... Я просто мысленно торжествовала, потому что предсказала такой исход."
2002002-144 = "Разумеется, мой блестящий мозг заранее смоделировал этот исход. Угу. Полная моя победа, как и ожидалось."
2002002-145 = ""
2002002-148 = "[ns] «А здесь вообще было что выигрывать? ...И проигрывать?»"
2002002-149 = "Разве это сейчас важно, Сенсей? Нет, важно то... что вы проведёте время со мной."
2002002-150 = "О, и не вздумайте меня бросить. Я серьёзно, это просто запрещено."
2002002-151 = "[s] «Поверь, об этом тебе не стоит переживать, Химари.»"
2002002-152 = "Хи-хи."
2002002-153 = ""
2002002-155 = ""
2002002-156 = ""
2002002-158 = "Заранее спасибо за сегодняшний день, Сенсей."
2002002-161 = "Я немного отдохнул вместе с Химари, и мы неспешно провели день."
2002002-166 = "Мне удалось провести время с Сенсеем..."
2002002-167 = "Обычно я была бы переполнена самодовольной уверенностью, празднуя очередное достижение, ожидаемое от такого прекрасного супергениального хакера."
2002002-168 = "Однако меня кое-что беспокоит."
2002002-169 = "[s] «А? Что случилось?»"
2002002-170 = "Не конец света, но..."
2002002-171 = "Как вы знаете, в Миллениуме отдел вещания во время обеда включает песни по заявкам."
2002002-172 = "[s7] «Я этого не знал!»\n[s8] «А, да. Я совершенно точно это знал... кажется?»"
2002002-175 = "Любой студент Миллениума может заказать песню..."
2002002-176 = "Но почему они никогда не ставят песни, которые заказываю я?!"
2002002-177 = "Я отправила уже несколько заявок, и ни одну так и не включили. Как думаете, почему, Сенсей?"
2002002-178 = "Потому что мои вкусы слишком продвинуты? Неужели я поднялась настолько высоко, что стала чуждой обычным студентам?"
2002002-179 = "Неужели мне суждено стать трагической героиней этой истории?"
2002002-180 = "[s] «Ну, я не думаю...»"
2002002-181 = "Я хотела познакомить студентов Миллениума с прекрасными песнями, тронувшими моё сердце..."
2002002-182 = "Но больше я не позволю собственной великодушности сдерживать меня."
2002002-183 = "Сегодня, в честь торжественного открытия этого тайного убежища для нас двоих..."
2002002-184 = "Я приготовила особый сюрприз."
2002002-185 = ""
2002002-188 = "[ns] «А...? Особый сюрприз?»"
2002002-189 = ""
2002002-192 = "В этот момент из динамиков класса зазвучала школьная трансляция."
2002002-193 = ""
2002002-195 = ""
2002002-197 = "Итак! Дорогие слушатели вещания кампуса Миллениума, как у вас дела сегодня?"
2002002-198 = "Снова обеденное время, а значит пора делиться любовью через музыкальные заявки!"
2002002-199 = "Посмотрим на сегодняшние запросы."
2002002-200 = ""
2002002-203 = "Эта заявка пришла от..."
2002002-204 = ""
2002002-207 = "«Вечно цветущий хрупкий цветок Миллениума...» Опять этот человек?"
2002002-208 = "О, какое совпадение. Это моя заявка."
2002002-209 = "[s] «А чья же ещё!»"
2002002-210 = "Нет-нет, простите, госпожа Вечно Цветущий Цветок, мы не можем это поставить."
2002002-211 = ""
2002002-215 = "Дальше..."
2002002-216 = "Что? В смысле заявка только одна? Остальные удаляются? Взломаны? О чём вы вообще?"
2002002-217 = "Не говори глупостей."
2002002-218 = "Хи-хи."
2002002-219 = ""
2002002-222 = "[ns] «Эм, Химари...? Я знаю ответ, но что ты сделала?»"
2002002-223 = "Ладно, может, просто отменим сегодняшнюю рубрику с заявками..."
2002002-224 = ""
2002002-228 = "Эй! Подождите! С-Стойте! Что значит система не останавливается?! Это строчка из песни?!"
2002002-229 = ""
2002002-232 = "Трансляция вышла из-под контроля!"
2002002-233 = ""
2002002-244 = "Сразу после этого из динамиков заиграла меланхоличная мелодия энка."
2002002-245 = ""
2002002-248 = "[ns] «Это... действительно загадочная и уникальная песня.»"
2002002-249 = "Её посоветовала мне президент Инженерного отдела."
2002002-250 = "[s] «Я слышал, музыка помогает цветам расти, но энка...?»"
2002002-251 = "Хи-хи. Спокойно сидеть в своём убежище, слушать любимую песню вместе с любимым человеком..."
2002002-252 = "Всё звучит так... безупречно, правда?"
2002002-253 = ""
2002002-256 = "[ns] «Ну, эм.»"
2002002-258 = "[ns] «Кажется, я понял.»"
2002002-259 = "Правда? Хи-хи."
2002002-261 = "Мы слушали музыку энка... и заодно суматоху сотрудников вещания..."
2002002-262 = "Мы провели время вместе до самого заката."
