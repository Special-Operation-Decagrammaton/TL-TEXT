10042080-190 = "Да! Хи-хи... Я кое-чему научилась, пока работала в кафе."
10042080-191 = "Я очень старалась... и каким-то образом они даже получились нормально!"
10042080-192 = "Может, эм... хотите попробовать?"
10042080-193 = "..."
