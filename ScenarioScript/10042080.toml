10042080-34 = "[ns] «Иори, ты в порядке?! Оно всё ещё опасно?»"
10042080-35 = "Оно больше не двигается."
10042080-36 = "Не знаю, правильно ли так говорить, но... похоже, оно без сознания."
10042080-38 = "..."
10042080-39 = "..."
10042080-40 = "Эм, Ако? Это, ну..."
10042080-41 = "Подождите. Не знаю, как вы, а у меня ещё остались с ним счёты."
10042080-42 = "Уф."
10042080-43 = "Значит, это... Это та самая штука, которая сделала... всё это со мной, да?"
10042080-44 = "Оно схватило меня, связало, залило этим мерзким сиропом и заткнуло мне рот своим... Ух...!"
10042080-45 = "Я была... опорочена. Осквернена...!"
10042080-46 = "[s1] «А-Ако? Ты... точно будешь в порядке?»\n[s2] «Это ведь был просто сироп...»"
