10042080-86 = "[s5] «Фуука только что схватила Пан-Пана...!»\n[s6] «...Она выбросила его в мусор!»"
10042080-89 = "Любая еда, которая выползла из сковороды и коснулась пола, негигиенична, поэтому её следует выбросить."
10042080-90 = "Н-Ну, если так это сформулировать..."
10042080-91 = "...Это здравый смысл. Возразить нечего."
10042080-92 = "..."
10042080-94 = "Тогда ЭТО означает, что всё закончилось?"
10042080-95 = "Если только мы не хотим покончить с ним раз и навсегда."
10042080-96 = "Но я бы предпочла не устраивать ещё больший переполох, чем мы уже устроили..."
10042080-97 = ""
10042080-99 = ""
10042080-100 = "[ns] «Денёк выдался напряжённый во всех смыслах.»"
10042080-101 = "«Напряжённый» — ещё мягко сказано! Я так просто этого не оставлю!"
10042080-102 = "Ако? Ты только что вернулась к жизни?"
10042080-103 = "Вернулась к ЖИЗНИ?! Я не УМИРАЛА! Где эта штука Пан-Пан?!"
10042080-104 = "Эм... оно перестало двигаться, а потом Фуука его выбросила."
10042080-105 = "..."
10042080-106 = "Думаю, это приемлемо..."
10042080-107 = "...так куда же теперь деть всю эту необузданную ярость...?"
10042080-108 = "[s7] «Ты точно в порядке, Ако? Твоя одежда и кожа вся...»\n[s8] «Думаю... тебе стоит принять душ...»"
10042080-111 = "*ахает*"
10042080-113 = "Каждая! Часть! Этого! Просто! Ужасна!"
10042080-114 = ""
10042080-117 = "[log]Так буйство Пан-Пана, которому удалось#nдаже Академию Геенны ненадолго повергнуть в хаос,#nблагополучно закончилось, хотя и оставило после себя#nнесколько неизгладимых следов.[/log]"
10042080-120 = "[log]...если помнить, что «небольшой хаос» здесь понятие относительное...[/log]"
10042080-123 = "[log]Несколько дней спустя...[/log]"
10042080-127 = "Кухня столовой Геенны"
10042080-128 = "Джури! Лук готов?"
10042080-129 = "Ага! Я всё нарезала!"
10042080-130 = "Отлично, тогда начну его обжаривать. Дальше займись, пожалуйста, картофелем и морковью!"
10042080-131 = "Поняла! Вижу, ты выпариваешь влагу из лука, чтобы он стал слаще!"
10042080-132 = "Сегодня у нас в меню мясное рагу с картофелем!"
10042080-134 = "Столовая Геенны"
10042080-135 = "Простите! Это мясное рагу с картофелем какое-то пресноватое."
10042080-136 = "Я надеялась на говядину, когда увидела меню, а у вас только свинина."
10042080-137 = "Я так ждала лапшу ширатаки, а её вообще нет..."
10042080-138 = "А ещё остались эти маринованные овощи? Я их никогда не наедаюсь."
10042080-139 = "Что ж, сегодняшнее меню — мясное рагу с картофелем, самое домашнее из всех блюд."
10042080-140 = "И сегодня предмет исследования Общества гурманов — именно оно."
10042080-141 = "А точнее, сколько в нём может быть ощущения домашнего уюта."
10042080-142 = "Вам вообще не стоит заниматься всем этим здесь!"
10042080-144 = "*вздох* Ещё один день закончен..."
10042080-145 = "Хорошая работа сегодня, Фуука..."
10042080-146 = "Всегда одно и то же. Моя работа на самом деле никогда не заканчивается."
10042080-147 = "И не то чтобы там хоть кто-нибудь это ценил..."
10042080-148 = "Прости. Хотела бы я помогать тебе больше..."
10042080-149 = "Нет, Джури. Ты отлично справляешься. Уже одно твоё присутствие очень помогает."
10042080-150 = "Я даже представить не могу, как Клуб школьной столовой обходился бы без тебя..."
10042080-151 = "Спасибо за добрые слова, но..."
10042080-152 = ""
10042080-153 = ""
10042080-156 = "[ns] «Привет, Джури! Фуука! Хорошо сегодня поработали!»"
10042080-157 = "А, Сенсей!"
10042080-158 = "Сенсей! А? В-вам правда не стоило покупать нам всё это..."
10042080-159 = "Что? Вы хотели принести нам что-нибудь освежающее после всей тяжёлой работы?"
10042080-160 = "...Спасибо, Сенсей. Я так рада, что вы с нами."
10042080-161 = "Вы тоже должны выпить, Сенсей! Сейчас принесу три стакана!"
10042080-162 = "Интересно, найдётся ли что-нибудь перекусить заодно..."
10042080-163 = ""
10042080-165 = ""
10042080-166 = ""
10042080-167 = "..."
10042080-168 = "Эм, Фуука? Алло?"
10042080-169 = "Если вы не против... я вообще-то кое-что приготовила немного раньше..."
10042080-170 = "К-конечно, если вас что-то беспокоит, вы нервничаете или вам страшно, всегда можно отказаться...!"
10042080-171 = "Ты что-то приготовила для нас?"
10042080-172 = "..."
10042080-173 = "Конечно, мне интересно. Что именно?"
10042080-174 = "[s] «Я тоже хочу узнать!»"
10042080-175 = "П-правда? Вы... вы обе уверены?"
10042080-176 = "Тогда подождите секундочку!"
10042080-177 = ""
10042080-179 = ""
10042080-185 = ""
10042080-186 = ""
10042080-188 = "А? Это... панкейки? Выглядят довольно аппетитно."
