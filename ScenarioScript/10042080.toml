10042080-18 = "..."
10042080-19 = "Эм... Вижу Ако без сознания, всю в зелёном сиропе. И..."
10042080-20 = ""
10042080-22 = ""
10042080-23 = ""
10042080-25 = "...Хм. Раньше оно было таким огромным, а теперь совсем крошечное."
10042080-26 = ""
10042080-28 = ""
10042080-29 = ""
10042080-30 = "Подтверждаю: сущность вернулась к исходному размеру."
