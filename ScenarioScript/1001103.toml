1001103-8 = "А теперь смотрите внимательно."
1001103-9 = "Сладости оставляют на зубах липкий налёт. Стоит ужасным бактериям его учуять, и они уже не могут устоять."
1001103-10 = "Теперь твоя очередь, Сенсей. Ты будешь играть бактерию."
1001103-11 = ""
1001103-12 = "[s] «А-А-а-а-ргх...»"
