1001103-34 = "[s] Неохотно открыть рот."
1001103-35 = ""
1001103-36 = "Ох, Сенсей. Какие у тебя чистые зубы. Ты прекрасно за ними ухаживаешь."
1001103-37 = "Можешь не бояться, что за тобой придёт большая злая бактерия. Хи-хи..."
1001103-38 = "Хм? Тебя что-то беспокоит?"
1001103-39 = "Я стою слишком близко?"
1001103-40 = "Хаха. Ничего не поделаешь, Сенсей. Я ещё не закончила осмотр."
