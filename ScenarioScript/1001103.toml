1001103-14 = "Видите? Страшно, правда? Если не чистить зубы, за вами придут ужасные бактерии."
1001103-15 = "Но если чистить зубы, бактерии ничего не смогут сделать."
1001103-16 = "Дальше твоя сцена, Сенсей."
1001103-17 = ""
1001103-18 = "[s] «А-а-а-а! Мятная свежесть зубной пасты! Как ТЫ смеешь?!»"
1001103-19 = ""
