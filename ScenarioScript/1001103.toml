1001103-22 = "Надеюсь, вы все усвоили важный урок. Обещайте мне чистить зубы и прогонять злых бактерий, хорошо?"
1001103-23 = "Обещаем!"
1001103-25 = "Спасибо за помощь со спектаклем.#nДетям очень понравилось!"
1001103-26 = "[s] «И было немного унизительно...»"
1001103-27 = "Не говори так. Детям понравилось."
1001103-28 = "Подумай, сколько здоровых улыбок в Саду цветущей сливы будет благодаря тебе."
1001103-29 = "И надеюсь, ты тоже не забыл почистить зубы после еды."
1001103-30 = "[s] «Разумеется»."
