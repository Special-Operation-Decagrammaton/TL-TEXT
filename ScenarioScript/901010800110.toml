[translation]
901010800110-7 = ""
901010800110-8 = "Я вернулась."
901010800110-9 = "Ты поздно. Я уже думала, что умру здесь от скуки."
901010800110-10 = "Ага, прости. Бочка оказалась тяжелее, чем я думала... Пришлось повозиться."
901010800110-11 = "Понимаю. Нужно правильно держать равновесие, чтобы она нормально катилась."
901010800110-12 = "Кстати, какой вообще смысл катать пустую бочку?"
901010800110-13 = "Нам приказывают среди ночи катать эти огромные тупые бочки по пустому порту. Может, они пытаются быть деликатными? Но грохот такой, что, уверена, слышат все!"
901010800110-14 = "Нет смысла пытаться понять, что думает начальство."
901010800110-15 = "Нам нужно просто не высовываться и выполнять приказы."
901010800110-16 = ""
901010800110-18 = ""
901010800110-20 = "Говорит FOX 2, в готовности в точке Виски."
901010800110-21 = "Подтверждаю возвращение Танго 2 после выхода из обозначенной точки. Ничего нового."
901010800110-22 = ""
901010800110-24 = ""
901010800110-25 = "...Зачем они катают бочку среди ночи?"
901010800110-26 = "Только не говорите, что внутри крабы или человек."
901010800110-27 = "Не похоже."
901010800110-28 = "После выхода со склада они побродили по району, нигде не останавливались и вернулись..."
901010800110-29 = "И звук был слишком лёгкий и ровный. Если бы внутри что-то было, бочка звучала бы тяжелее."
901010800110-30 = "Если только это не новый вид силовой тренировки, они явно что-то задумали."
901010800110-32 = "FOX 3, сможешь выманить цель к заднему входу?"
901010800110-33 = "Без проблем. Обожаю играть в догонялки."
901010800110-34 = "FOX 4, продолжай наблюдение на месте. FOX 2, проникни на склад, пока цель отвлечена."
901010800110-36 = ""
901010800110-37 = "Принято."
901010800110-42 = ""
901010800110-43 = "Что это за шум?"
901010800110-44 = "Может, кошка? Я раньше ворону видела..."
901010800110-45 = "Нет. По-моему, это шаги."
901010800110-46 = "Проверим."
