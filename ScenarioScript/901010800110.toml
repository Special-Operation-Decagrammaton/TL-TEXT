[translation]
901010800110-7 = ""
901010800110-8 = "Voltei."
901010800110-9 = "Demorou, hein! Ficar de sentinela sozinho no portão é um tédio da peste."
901010800110-10 = "Foi mal, foi mal. Aquele tambor de óleo é mais pesado do que parece... demorei um tempão pra rolar aquela tralha."
901010800110-11 = "Até pegar o jeito, rolar latão é chato pra caramba mesmo."
901010800110-12 = "Mas vem cá... que diabos de sentido faz ficar rolando tambor vazio de óleo pelo porto no meio da noite?"
901010800110-13 = "Ainda mais de madrugada... daqui a pouco alguém faz denúncia por perturbação do sossego!"
901010800110-14 = "E desde quando a gente entende o que se passa na cachola da diretoria?"
901010800110-15 = "Peixe pequeno como nós só abaixa a cabeça e cumpre a ordem."
901010800110-16 = ""
901010800110-18 = ""
901010800110-20 = "Aqui é a FOX2. Em posição no Ponto Whisky."
901010800110-21 = "Confirmo o retorno do Tango 2, que havia se afastado da guarita. Nenhuma outra alteração por ora."
901010800110-22 = ""
901010800110-24 = ""
901010800110-25 = "...O que aqueles palhaços tão fazendo rolando tambor de óleo no meio da madrugada?"
901010800110-26 = "Não me diga que... tem caranguejo ou gente morta dentro daqueles latões?!"
901010800110-27 = "Não me parece o caso."
901010800110-28 = "Ele saiu do galpão e já voltou logo em seguida..."
901010800110-29 = "E o barulho do tambor tá oco e leve demais. Se tivesse algo pesado dentro, o rangido no asfalto seria bem mais abafado."
901010800110-30 = "A não ser que seja um treino físico muito esquisito de madrugada, deve ter outro propósito por trás."
901010800110-32 = "FOX3, consegue atrair os alvos na direção do portão dos fundos?"
901010800110-33 = "Deixa comigo. Pega-pega e distração é a minha praia."
901010800110-34 = "FOX4 manterá o controle de área. FOX2, aproveite a brecha quando a atenção deles for desviada para se infiltrar no galpão."
901010800110-36 = ""
901010800110-37 = "Entendido."
