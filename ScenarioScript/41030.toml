41030-192 = "Журнал допроса: 977-R-4"
41030-194 = "Дознаватель: [USERNAME] Сенсей, Шале"
41030-196 = "Допрашиваемая: Цукиюки Мияко, Академия СГР, 1-й курс."
41030-199 = ""
41030-200 = "...Это вы."
41030-201 = "[s1] «Рад снова тебя видеть, Мияко..»\n[s2] «Я так понимаю, ты по мне не скучала?»"
41030-202 = "Полагаю, допрос проводить будете вы, Сенсей."
41030-203 = "Удивлена, что Вы тратите на меня своё время. Путь сюда ведь неблизкий."
41030-204 = "Полагаю, допрос проводить будете вы, Сенсей."
41030-205 = "Хватит играться. Мои ответы будут одинаковыми, что бы Вы ни делали."
41030-206 = "Спрашивайте."
41030-207 = "[s] «Как ты?»"
41030-208 = "Это неожиданный вопрос."
41030-209 = "Я в порядке, насколько это вообще возможно для заключённой. Не могу особо жаловаться."
41030-210 = "Вы пытаетесь вести переговоры? Улучшить условия в обмен на услугу?"
41030-211 = "Если Вы думаете, что можете забраться ко мне в голову, то это заведомо проигрышная битва."
41030-212 = "Я не предам Академию SRT."
41030-213 = "[s] «Почему ты не хочешь переводиться в Полицейскую Школу Валькирия?»"
41030-214 = "Первый вопрос был неожиданным, второй - плохим. Я веду счёт."
41030-215 = "Я не имею ничего против самой Полицейской Академии Валькирия."
41030-216 = "Но я наотрез отказываюсь покидать Академию SRT."
41030-217 = "[s] «И почему же ты не хочешь уходить из SRT?»"
41030-218 = "Вопрос уже получше. У Академии SRT уникальное чувство справедливости."
41030-219 = "[s] «Можешь рассказать поподробнее?»"
41030-220 = "Возможно, я уже утратила право говорить о справедливости."
41030-221 = "Здесь, в Кивотосе, это слово слышишь очень часто."
41030-222 = "Студенты Тринити, Геенны, и даже Валькирии - все они сражаются за своё собственное видение справедливости."
41030-223 = "…Но я считаю их видение справедливости банальным и поверхностным."
41030-224 = "Справедливость - это путь к сохранению истины."
41030-225 = "По самой своей сути этот путь должен быть основан на истине. А если так, то справедливость не должна меняться, кто бы её ни вершил."
41030-226 = "Все эти академии, организации безопасности Кивотоса - они смешивают политику и справедливость. И в итоге эта справедливость становится лишь мечом, который они направляют ради своих корыстных интересов. Они оскверняют её."
41030-227 = "Академия SRT... В SRT мы несли справедливость согласно незыблемым принципам, незатронутым обществом и политикой."
41030-228 = "И не важно кто - я, Саки, Мое или Мию. Или кем будут наши противники. Каждый член нашей организации предан этому пути. Чтобы сохранить истину."
41030-229 = "Именно эти принципы заставили меня полюбить SRT с самого детства."
41030-230 = "Я уважала справедливость, к которой они стремились. Чистую, не затронутую влиянием людского эгоизма."
41030-231 = "Но, несмотря на все мои идеалистические излияния, SRT распущена, а я стала преступницей."
41030-232 = "Я провалилась. Если бы я лучше направляла своих союзников, скооперировалась с ними, объединила их, я бы не подвела их. Я бы не подвела SRT."
41030-233 = "[s] «Ты хорошо справилась.»"
41030-234 = ""
41030-236 = ""
41030-237 = "...Вы странный, Сенсей."
41030-238 = "Не думаю, что я заслуживаю этот комплимент, особенно от Вас."
41030-239 = "Мы спланировали всё заранее. А с другой стороны, Вы составили стратегию на ходу, разобрались и использовали, где нужно, таланты Ваших союзников, вскрыли слабости противника и резко ошеломили нас в чрезвычайной ситуации."
41030-240 = "У меня не было ни единого шанса."
41030-241 = "[s] «Опыт - более острый меч, чем ты думаешь.»"
41030-243 = "[s] «Могу я снова спросить? Как у тебя дела?»"
41030-244 = "Мой ответ тот же."
41030-245 = "Если только Вы не думаете, что сможете отменить закрытие Академии SRT, мне ничего от Вас не нужно, Сенсей."
41030-246 = "[s] «Этого я пообещать не могу.»"
41030-247 = "Что ж, тогда знайте: я не перестану бороться за Академию SRT."
41030-248 = "Мы будем сражаться за то, во что верим. Мы сохраним справедливость Академии SRT."
41030-249 = "[s] «Даже когда надежды нет?»"
41030-250 = "Я не сдамся."
41030-251 = ""
41030-253 = "Цукиюки"
41030-255 = " "
41030-257 = ""
41030-259 = " "
41030-261 = " "
41030-263 = "Мияко"
41030-265 = ""
41030-267 = "Решение отложено"
41030-270 = "Полицейская Академия Валькирия, Офис Бюро Общественного Правопорядка"
41030-271 = "Вот все записи допросов подозреваемых."
41030-272 = "Как и всегда, хорошая работа. Спасибо за сотрудничество."
41030-273 = "[s] «Их приговор уже вынесен?»"
41030-274 = "Ну… Честно говоря, я хотела попробовать ассимилировать их в Полицейскую Академию Валькирия после задержания."
41030-275 = "Но Главный Студенческий Совет был вовлечён в это дело, так что решение вышло далеко за рамки моих полномочий. Они требуют суровых дисциплинарных мер."
41030-276 = "Они рассматривают возможность аннулирование их академических наград и, по сути, изгнания их."
41030-277 = "[s] «Неужели нет шанса, что Академию SRT откроют заново, если они попросят?»"
41030-278 = "А Вы мягкосердечны, Сенсей. Я не стану выполнять запросы преступников, даже если бы могла."
41030-279 = "Решение закрыть Академию SRT было принято Главным Студенческим Советом."
41030-280 = "Даже со всем Вашим авторитетом отменить его практически невозможно."
41030-281 = "[s] «Так, с кем мне нужно поговорить?»"
41030-282 = "Я не могу ответить на этот вопрос…"
41030-283 = "Полагаю, я смогу помочь с этим."
41030-284 = "Это...?"
41030-285 = ""
41030-287 = ""
41030-290 = ""
41030-291 = "Я прямо-таки прыгаю от счастья, ведь я наконец-то встретила Вас лично, Сенсей."
41030-292 = "Меня зовут Ширануи Кая, глава Оборонного Комитета при Главном Студенческом Совете."
41030-294 = "Следующий эпизод;Положение Главы Штаба"
