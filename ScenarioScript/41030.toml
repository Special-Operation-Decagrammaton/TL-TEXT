[translation]
41030-1 = "Episódio 3;As Circunstâncias de Cada Um"
41030-3 = "Registro de Interrogatório: 977-R-1"
41030-5 = "Responsável: Academia de Polícia Valkyrie, 3º ano — Kanna Ogata"
41030-7 = "Suspeita: Academia Especial SRT, 1º ano — Saki Sorai"
41030-12 = "Academia de Polícia Valkyrie — Sala de Interrogatório"
41030-14 = "...Seu nome."
41030-15 = "..."
41030-16 = "Diga seu nome!"
41030-17 = "...Você já sabe muito bem. Precisa mesmo perguntar?"
41030-18 = "Não autorizei você a fazer perguntas."
41030-19 = "Vou perguntar mais uma vez. Qual é o seu nome?"
41030-20 = "...Saki Sorai."
41030-21 = "Afiliação?"
41030-22 = "Academia Especial SRT, Esquadrão RABBIT... ou era, até vocês resolverem fechar tudo por conta própria."
41030-23 = "...Bela atitude. Você tem noção da situação em que está?"
41030-24 = "Que eu sou conhecida como o \"Cão Feroz\" da Academia de Polícia Valkyrie... disso você também deve saber, não?"
41030-25 = "Acha mesmo que uma ameaça dessas vai funcionar a essa altura? Se acha, que decepção."
41030-26 = "O treinamento da SRT inclui protocolos para o caso de sermos capturadas como prisioneiras. Lidamos com bastante informação confidencial."
41030-27 = "Não importa o que você faça, está muito enganada se acha que vai arrancar alguma coisa de mim."
41030-31 = "...Também li o dossiê do Conselho Estudantil Geral. Pelo visto, você tinha notas excelentes mesmo para os padrões da SRT."
41030-32 = "Quase gabaritou as provas escritas e teve desempenho praticamente impecável nos exercícios práticos."
41030-33 = "Nunca violou uma única regra da escola... Uma aluna exemplar, sem dúvida."
41030-34 = "Por que diabos alguém como você recusou a transferência para a Valkyrie e resolveu fazer um protesto?"
41030-35 = "...A Academia de Polícia Valkyrie e a Academia Especial SRT são diferentes."
41030-36 = "Isso não responde à minha pergunta."
41030-37 = "Na Academia Especial SRT, vivemos sob regras rígidas até mesmo depois das aulas."
41030-38 = "Acordamos no horário exato, arrumamos a cama, passamos o dia entre treinos e aulas teóricas. Mesmo depois do expediente, nos dormitórios, não podemos baixar a guarda e precisamos continuar treinando e fazendo manutenção. Essa mentalidade de estar sempre em campo de batalha é o que faz da SRT o que ela é."
41030-39 = "...Não é como na Academia de Polícia Valkyrie."
41030-40 = "Até no Departamento de Segurança Interna, que dizem ser o mais rigoroso com disciplina, vocês podem usar roupas civis e fazer o que quiserem depois das aulas, não é? Mesmo que a desculpa seja não deixar os cidadãos tensos."
41030-41 = "Eu não vivo assim. Prefiro viver com orgulho como um lobo mesmo em um ambiente severo do que virar um cão domesticado gozando de liberdade fácil."
41030-42 = "...Essa é a sua resposta?"
41030-43 = "...Vou fazer mais uma pergunta."
41030-44 = "Durante o combate, Kazekura destruiu o drone de transmissão. Naquele momento, você desperdiçou munição sem motivo nenhum."
41030-45 = "Por que não impediu? Uma aluna exemplar como você deveria saber muito bem o quanto a munição é preciosa em uma batalha defensiva daquelas."
41030-46 = "Isso também faz parte de alguma disciplina da SRT?"
41030-47 = "..."
41030-48 = "No treinamento não deixavam desperdiçar munição à toa, então eu queria tentar pelo menos uma vez..."
41030-52 = "Sa"
41030-54 = "ki"
41030-60 = "So"
41030-62 = "rai"
41030-64 = "Inapta"
41030-68 = "Registro de Interrogatório: 977-R-2"
41030-70 = "Responsável: Academia de Polícia Valkyrie, 1º ano — Kirino Nakatsukasa"
41030-72 = "Suspeita: Academia Especial SRT, 1º ano — Moe Kazekura"
41030-76 = "Hum... Moe Kazekura-san."
41030-77 = "Hm?"
41030-78 = "Aliás, deixa eu perguntar logo: quantas horas isso aqui ainda vai durar?"
41030-79 = "Não dá pra terminar rapidinho, não? Minhas balas extras já estão quase acabando."
41030-80 = "N-Não é assim que funciona!"
41030-81 = "Você acha que esta situação é hora de ficar falando de bala?"
41030-82 = "Se continuar com essa atitude, vou confiscar até as balas que sobraram!"
41030-83 = "Que saco..."
41030-84 = "Kazekura-san, vou perguntar direto ao ponto. Por que vocês ocuparam o parque naquele dia? Por que não responderam ao chamado da Valkyrie?"
41030-85 = "Se tivessem largado as armas e se rendido logo de cara, a situação nunca teria tomado essa proporção."
41030-86 = "...Porque eu não queria sair da SRT."
41030-87 = "E-Entendo... De fato, esta oficial também ficaria abalada se, do nada, lhe dissessem \"saia da Academia de Polícia Valkyrie\"."
41030-88 = "As lembranças com as companheiras com quem dividiu alegrias e dificuldades não podem ser descartadas facilmente... Compreendo. Quanto a esse ponto, há atenuantes—"
41030-89 = "Ah, não, eu tô pouco me lixando pra isso aí."
41030-90 = "Na real, eu até queria dar tchau logo pra aquele Esquadrão RABBIT."
41030-91 = "A Saki vive pegando no meu pé todo dia, a Miyu chora por qualquer coisa..."
41030-92 = "E-Então por que você não quer sair da SRT...?"
41030-93 = "Ué, óbvio que é por causa daquela montanha de armas!"
41030-94 = "B-Bem, se for por armas, a Academia de Polícia Valkyrie também tem várias..."
41030-95 = "Não, não, não, o nível da Valkyrie não chega nem perto!"
41030-96 = "Mísseis capazes de reduzir um quarteirão inteiro a cinzas, munição que atravessa blindagem de tanque como se fosse papel...!"
41030-97 = "A Academia Especial SRT é o único lugar onde dá pra usar um poder de fogo absurdo desses à vontade!"
41030-98 = "N-Não, você não pode usar \"à vontade\" nem na Academia Especial SRT?!"
41030-99 = "(Pensando bem, parece que ela já destruiu metade de um centro comercial atirando a esmo uma vez...)"
41030-100 = "A SRT, assim como a Valkyrie, não deveria ser uma organização feita para proteger a segurança dos cidadãos...?"
41030-101 = "Mesmo assim, dizer que as armas são o mais importante..."
41030-102 = "Kazekura-san, você está dizendo que não se importa nem um pouco com a segurança dos cidadãos?!"
41030-103 = "Aham."
41030-107 = "..."
41030-111 = "Mo"
41030-113 = "e"
41030-117 = "Kaze"
41030-121 = "kura"
41030-125 = "Inapta"
41030-128 = "Registro de Interrogatório: 977-R-3"
41030-130 = "Responsável: Academia de Polícia Valkyrie, 1º ano — Fubuki Nemugaki"
41030-132 = "Suspeita: Academia Especial SRT, 1º ano — Miyu Kasumizawa"
41030-136 = "Então, seu nome é..."
41030-137 = "M-Miyu Kasumizawa... Sou do 1º ano da Academia Especial SRT... e sou a atiradora de elite do Esquadrão RABBIT..."
41030-138 = "Tenho 15 anos, meu aniversário é dia 12 de julho... e m-meu hobby é procurar pedrinhas."
41030-139 = "Não, não precisava falar tudo isso..."
41030-140 = "O-O que vai acontecer comigo agora...?"
41030-141 = "Será que vão me submeter a torturas horríveis...?!"
41030-142 = "Tipo me obrigar a ouvir a mesma música o dia inteiro, ou me fazer cócegas a noite toda...!"
41030-143 = "P-Por favor, me perdoe! E-Eu conto tudo o que eu sei...!"
41030-144 = "Calma, eu não vou fazer nada disso..."
41030-145 = "Mas já que você quer falar, seria bom começar explicando o motivo. Por que recusou a transferência para a Valkyrie e por que fez aquele protesto no parque?"
41030-146 = "É q-que... a transferência me dá medo..."
41030-147 = "Medo? Acho que quase nem tem delinquente na nossa escola, sabia?"
41030-148 = "Não, hum, não é nesse sentido..."
41030-149 = "Eu, bem... tenho medo de tentar fazer amizade com as pessoas..."
41030-150 = "Mesmo agora no Esquadrão RABBIT, não somos exatamente super próximas... mas a Miyako-chan às vezes cuida de mim e tudo mais..."
41030-151 = "Só que, se eu for transferida para um lugar novo..."
41030-152 = "Vou ter que começar tudo do zero... e ninguém nunca vai falar com alguém tão sem presença quanto eu..."
41030-153 = "Se for pra passar por isso, é melhor acampar no parque mesmo..."
41030-154 = "...Que garota estranha. Você tem medo de conhecer gente nova?"
41030-155 = "Não é bem medo de conhecer... Eu tenho medo de ser esquecida pelas pessoas."
41030-156 = "Se ninguém mais notar que eu existo... só de pensar nisso, eu já..."
41030-157 = "Eu entrei na SRT justamente para mudar esse meu jeito, e aí a escola fecha... O que é que eu faço agora?"
41030-158 = "Entendi..."
41030-159 = "Então por que não vem pro nosso Departamento de Segurança Pública? A prova de transferência não é difícil e não tem tanta gente assim lá."
41030-160 = "Acho que ninguém vai esquecer de você, não. Quase não dá trabalho e nem tem tanta gente pra lidar nesse setor."
41030-161 = "S-Sério mesmo...?"
41030-162 = "Eu poderia ter uma vida escolar tranquila, quase sem encontrar ninguém...?"
41030-163 = "Hmm, \"quase ninguém\" já é meio impossível."
41030-164 = "No Departamento de Segurança Pública chegam reclamações de todo tipo de cidadão..."
41030-168 = "Ah, então não dá..."
41030-172 = "Mi"
41030-174 = "yu"
41030-178 = "Kasumi"
41030-180 = "zawa"
41030-188 = "Inapta"
41030-192 = "Registro de Interrogatório: 977-R-4"
41030-194 = "Responsável: Schale — Sensei [USERNAME]"
41030-196 = "Suspeita: Academia Especial SRT, 1º ano — Miyako Tsukiyuki"
41030-200 = "...Você daquela vez."
41030-201 = "[s1] \"Miyako... certo?\"\n[s2] \"Ficou surpresa?\""
41030-202 = "Ou seja, quem está conduzindo o interrogatório é o Sensei, certo?"
41030-203 = "...Para ser sincera, fiquei um pouco surpresa. Não esperava encontrar o Sensei aqui."
41030-204 = "Ou seja, quem está conduzindo o interrogatório é o Sensei, certo?"
41030-205 = "Enfim, não importa quem seja. Não faz diferença quem está na minha frente, minhas respostas não vão mudar."
41030-206 = "Se tiver alguma pergunta, pode fazer."
41030-207 = "[s] \"Tem tido algum desconforto por aqui?\""
41030-208 = "...Que pergunta estranha logo de início."
41030-209 = "Não se preocupe. Mesmo que houvesse, não tenho intenção de reclamar na minha posição de prisioneira."
41030-210 = "Ou será que pretende melhorar nossas condições em troca de informações?"
41030-211 = "Se está tentando me fazer mudar de ideia, é melhor desistir."
41030-212 = "Não importa o que proponha, nossos sentimentos pela SRT não vão mudar."
41030-213 = "[s] \"Entendi. Mudando de assunto, posso fazer uma pergunta? Você não gosta da Valkyrie, Miyako?\""
41030-214 = "...Talvez você tenha entendido errado."
41030-215 = "Não recusei a transferência por ter alguma antipatia especial pela Valkyrie."
41030-216 = "O que eu não quero é deixar a SRT."
41030-217 = "[s] \"Entendo. Posso saber o motivo?\""
41030-218 = "...Porque na SRT existe uma \"justiça\" que só se encontra lá."
41030-219 = "[s] \"'Justiça'...\""
41030-220 = "Colocando em palavras, é um conceito difícil de explicar."
41030-221 = "Mas você também já deve ter ouvido falar sobre \"justiça\", Sensei."
41030-222 = "Ouvi dizer que outras academias têm grupos semelhantes... e acredito que aqui na Valkyrie as alunas também pensem que suas ações representam a \"justiça\"."
41030-223 = "...Porém, para mim, a justiça delas não é a \"verdadeira justiça\"."
41030-224 = "\"Justiça\" é o caminho reto, fundamentado na razão."
41030-225 = "Essa razão se baseia na verdade. Sendo assim, não deveria mudar conforme a pessoa ou a situação."
41030-226 = "Contudo, os órgãos de segurança espalhados por Kivotos estão presos a todo tipo de conflito de interesses. Como resultado, vêm distorcendo a \"justiça\" cada um à sua maneira."
41030-227 = "Apenas a Academia Especial SRT... agia sem se deixar influenciar por relações entre academias ou jogos de interesse, executando a justiça em que acreditava."
41030-228 = "Uma organização que busca uma única justiça, sob o mesmo critério, em qualquer hora, qualquer lugar e contra qualquer alvo..."
41030-229 = "Foi essa Academia Especial SRT que eu admirei."
41030-230 = "Essa justiça inabalável."
41030-231 = "E mesmo assim, a Academia Especial SRT foi fechada..."
41030-232 = "Se eu tivesse me saído um pouco melhor... se eu tivesse conseguido extrair o verdadeiro potencial delas..."
41030-233 = "[s] \"Pelo que ouvi, acho que você se esforçou bastante, Miyako...\""
41030-237 = "...Ouvir isso de alguém que mal conheço não ajuda muito."
41030-238 = "Elogios vindos do Sensei não vão mudar nada agora."
41030-239 = "Naquele dia, você maximizou os pontos fortes das suas aliadas em pouquíssimo tempo e explorou nossas fraquezas para virar o jogo. Em comparação..."
41030-240 = "Eu não consegui fazer nada direito..."
41030-241 = "[s] \"Acho que você não precisa se culpar tanto assim, sabe...?\""
41030-243 = "[s] \"...Mudando de assunto, tem alguma coisa de que você precise? Ou que queira?\""
41030-244 = "...Não tenho mais nada a dizer. Como já informei antes, não tenho queixas."
41030-245 = "Se eu tiver mesmo que pedir algo, gostaria que revogassem a ordem de fechamento da Academia Especial SRT."
41030-246 = "[s] \"Resolver isso sozinho agora mesmo talvez seja um pouco difícil...\""
41030-247 = "...Nesse caso, continuaremos lutando pela reabertura da Academia Especial SRT."
41030-248 = "Enquanto não desistirmos, o nome da SRT jamais desaparecerá."
41030-249 = "[s] \"...Mesmo que as chances de vitória sejam mínimas?\""
41030-250 = "Sim."
41030-253 = "Mi"
41030-255 = "ya"
41030-259 = "ko"
41030-261 = "Tsuki"
41030-263 = "yuki"
41030-267 = "Pendente"
41030-270 = "Academia de Polícia Valkyrie — Escritório do Departamento de Segurança Interna"
41030-271 = "...Isso conclui os registros de hoje."
41030-272 = "Obrigada por colaborar mesmo com a agenda cheia, Sensei. Graças a você, economizamos bastante trabalho."
41030-273 = "[s] \"O que vai acontecer com elas daqui pra frente?\""
41030-274 = "Após um período de detenção, o procedimento padrão seria recomendar novamente a transferência para a Valkyrie, mas..."
41030-275 = "Como o Conselho Estudantil Geral está pressionando bastante, a punição provavelmente virá de lá. Considerando a dimensão dos danos do incidente, deve ser severa."
41030-276 = "No pior cenário, podem acabar sem poder se transferir para escola nenhuma..."
41030-277 = "[s] \"Reabrir a Academia Especial SRT está mesmo fora de cogitação?\""
41030-278 = "...Pra começar, eu mesma não gosto nem um pouco da ideia de ceder às exigências delas."
41030-279 = "Mas, deixando isso de lado, o \"fechamento da Academia Especial SRT\" é uma decisão do Conselho Estudantil Geral. Não é algo que alguém na minha posição possa contestar, e..."
41030-280 = "Acho difícil reverter isso mesmo com a \"autoridade extralegal\" da Schale."
41030-281 = "[s] \"Então, que tal perguntar a alguém do Conselho Estudantil Geral...?\""
41030-282 = "Quanto a isso, não cabe a mim dizer..."
41030-283 = "Pois então, permita-me responder em seu lugar."
41030-284 = "E-Essa voz..."
41030-291 = "Muito prazer... finalmente nos conhecemos, Sensei."
41030-292 = "Sou Kaya, do Gabinete de Defesa do Conselho Estudantil Geral de Kivotos."
41030-294 = "Próximo;Circunstâncias sob Outro Ângulo"
