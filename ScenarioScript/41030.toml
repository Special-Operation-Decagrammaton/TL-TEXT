[translation]
41030-1 = "Эпизод 3;Положение отряда"
41030-3 = "Журнал допроса: 977-R-1"
41030-5 = "Дознаватель: Огата Канна, Полицейская Академия Валькирия, 3-й курс."
41030-7 = "Допрашиваемая: Сораи Саки, Академия SRT, 1-й год"
41030-11 = ""
41030-12 = "Главное здание Полицейской Академии Валькирия, подземная комната допроса"
41030-13 = ""
41030-14 = "Твоё имя."
41030-15 = "..."
41030-16 = "Назови своё имя!"
41030-17 = "Ты тупая? Ты забыла, как меня зовут?"
41030-18 = "Не тебе здесь вопросы задавать."
41030-19 = "Повторю ещё раз. Твоё имя?"
41030-20 = "...Сораи Саки."
41030-21 = "Где ты учишься?"
41030-22 = "В отряде RABBIT академии SRT. Точнее, была в нём, пока вы по своей прихоти не закрыли академию."
41030-23 = "Следи за словами. Ты вообще понимаешь ситуацию, в которой оказалась?"
41030-24 = "Продолжишь дерзить, и я покажу, как получила прозвище Бешеный Пёс."
41030-25 = "Это угроза? И это всё твоё умение вести допрос? Пффф."
41030-26 = "Ученицы Академии SRT ежедневно имеют дело со сверхсекретной информацией! Мы отлично обучены сопротивлению допросам и пыткам!"
41030-27 = "Так что, приступай, покажи, на что способна!"
41030-28 = ""
41030-31 = "Знаешь, я взглянула на твоё личное дело. Ты очень талантливая ученица Академии SRT."
41030-32 = "Почти идеальный результат по письменным экзаменам, а с практикой ты справилась так, будто всю жизнь провела в реальном бою."
41030-33 = "Также в твоём послужном списке нет ни единого нарушения. С какой стороны ни посмотри - идеальная ученица."
41030-34 = "Так скажи мне. Как лучшая на своём курсе, преданная своему делу и умная Сораи Саки дошла до такого? Неужели перевод в Полицейскую Академию Валькирия настолько ужасен?"
41030-35 = "…Валькирия - это не SRT."
41030-36 = "Ты избегаешь ответа. Ответь мне."
41030-37 = "В отличие от Полицейской Академии Валькирия, Академия SRT следует строгим и жёстким правилам как в классе, так и вне его."
41030-38 = "Мы встаём в одно и то же время утром, идеально аккуратно заправляем кровати, тренируемся на занятиях, а после возвращения в общежитие продолжаем выполнять свои обязанности и практиковаться."
41030-39 = "А какова ежедневная рутина Полицейской Академии Валькирия?"
41030-40 = "Даже твоё \"самое дисциплинированное\" Бюро Внутренней Безопасности носит обычную одежду после занятий. Они развлекаются и делают что хотят вместо того, чтобы посвятить себя тренировкам."
41030-41 = "Ты можешь меня сковать, но я всегда буду гордым волком, а не овчаркой, бьющей баклуши на пастбище."
41030-42 = "Вот, значит, как?"
41030-43 = "Тогда позволь мне задать тебе следующий вопрос."
41030-44 = "Когда Мое использовала весь ваш боезапас для уничтожения дрона, почему ты это допустила?"
41030-45 = "Такая прилежная ученица, как ты, точно знает, насколько драгоценны патроны во время оборонительного боя."
41030-46 = "Какое отношение это имело к твоим \"благородным принципам\"?"
41030-47 = "Ну, потому что…"
41030-48 = "Я как-то подумала, что было бы круто увидеть, как всё это взорвётся разом. На тренировках нас всегда оценивали по тому, сколько патронов мы сэкономили…"
41030-50 = ""
41030-52 = "Сораи"
41030-54 = " "
41030-56 = ""
41030-60 = "Саки"
41030-62 = " "
41030-64 = "Провал"
41030-68 = "Журнал допроса: 977-R-2"
41030-70 = "Дознаватель: Накацукаса Кирино, Полицейская Академия Валькирия, 1-й  курс."
41030-72 = "Допрашиваемая: Казекура Мое, Академия SRT, 1-й курс."
41030-74 = ""
41030-76 = "Ты Казекура Мое, верно?"
41030-77 = "О ней самой."
41030-78 = "Эй, эй. Госпожа офицер, ты скоро закончишь свой допрос?"
41030-79 = "У меня заканчиваются конфеты, и мне с-к-у-ч-н-о. Я могу идти?"
41030-80 = "Конечно же, нет! Мы обязаны закончить допрос."
41030-81 = "И тебя сейчас больше волнуют конфеты? Запомни, ты подозреваешься в очень серьёзном преступлении!"
41030-82 = "Сотрудничай, или у тебя больше никогда не будет конфет!"
41030-83 = "Хорошо, хорошо, госпожа офицер."
41030-84 = "Перейдём к делу, Мое. Зачем вы оккупировали парк и проигнорировали приказы полиции?"
41030-85 = "Ваш приговор был бы намного мягче, если бы вы просто сдались."
41030-86 = "…Уйти из SRT было бы паршиво."
41030-87 = "Что ж… Соглашусь, что вне зависимости от обстоятельств уход из Полицейской Академии Валькирия был бы болезненным."
41030-88 = "Наши отношения и воспоминания бесценны. Я учту это…"
41030-89 = "Ты не так всё поняла, госпожа офицер."
41030-90 = "Если бы ты освободила меня от членства в RABBIT, я бы сразу ушла."
41030-91 = "Мию - бесполезная плакса, а Саки только и делает, что нудит, нудит, нудит. Королева нудения."
41030-92 = "Тогда что заставило тебя остаться?"
41030-93 = "Конечно же, большие ба-бахи! Оружие!"
41030-94 = "Полицейская Академия Валькирия тоже могла бы предоставить оружие, если оно так тебя интересует!"
41030-95 = "Пфф. Эти жалкие детские пукалки? Они даже не на одном уровне!"
41030-96 = "Ты когда-нибудь слышала грохот от противотанковой ракеты, которая разрывает вражеские ряды? Или видела зажигательный снаряд, что поджигает всё в пределах видимости?"
41030-97 = "Академия SRT позволяла мне взрывать всё, что я захочу, и всем, что я  могу только представить!"
41030-98 = "Да даже в Академии SRT тебе нельзя было этого делать! Это вообще запрещено!"
41030-99 = "(К-кстати говоря, Мое безрассудно раскидывала бомбы и уничтожила магазины во время прошлого инцидента.)"
41030-100 = "Но несмотря на различия в задачах, SRT и Валькирия созданы для защиты граждан."
41030-101 = "Но всё, о чём ты беспокоишься - это взрывы!"
41030-102 = "Мое, разве защита мира - это не твоя основная задача?!"
41030-103 = "Неа."
