41030-128 = "Журнал допроса: 977-R-3"
41030-130 = "Дознаватель: Немугаки Фубуки, Полицейская Академия Валькирия, 1-й курс."
41030-132 = "Допрашиваемая: Касумизава Мию, Академия СГР, Первый год обучения."
41030-134 = ""
41030-136 = "Ита-а-ак, напомни-ка, как тебя зовут?"
41030-137 = "К-Касумизава Мию, я первогодка из отряда RABBIT… Моя роль - снайпер…"
41030-138 = "Мне пятнадцать лет… Мой день рождения двенадцатого июля. О… и я люблю коллекционировать к-камешки."
41030-139 = "Мне просто нужно было твоё имя…"
41030-140 = "Что теперь со мной будет?"
41030-141 = "Я знаю, что то, что я делала в парке, очень плохо… Так что… меня будут пытать?"
41030-142 = "Например, щекотать всю ночь или включать одну и ту же песню на повторе, снова и снова…"
41030-143 = "Не-е–е-ет! Прошу, не делайте этого! Мне очень жаль! Я всё расскажу!"
41030-144 = "Успокойся… Пытать тебя было бы слишком хлопотно."
41030-145 = "Тебе просто нужно объяснить, почему ты сделала то, что сделала, и мы обе сможем поскорее убраться отсюда."
41030-146 = "Потому что… я была до смерти напугана переводом в новую школу."
41030-147 = "Почему? Мы, наверное, самая безопасная академия, куда ты могла бы перевестись."
41030-148 = "Нет, дело не в этом…"
41030-149 = "Это просто потому… что я не хочу снова заводить новых друзей…"
41030-150 = "Я имею в виду… Мияко - единственная, кто по-настоящему заботилась обо мне… По крайней мере, у меня есть она."
41030-151 = "А если бы мне пришлось пойти в совершенно иную школу…"
41030-152 = "Да и кто стал бы со мной разговаривать? Я бесполезная плакса. Я просто исчезну, как выброшенная жвачка на улице, которую никто даже не замечает."
41030-153 = "Я бы скорее согласилась спать со всеми этими противными букашками, чем знакомиться с новыми людьми."
41030-154 = "Понятно… Значит, ты просто боишься людей?"
41030-155 = "Нет, не совсем. Но люди могут забыть меня."
41030-156 = "И я не могу смириться с мыслью, что меня все забудут. Совсем одна… Как эта жвачка…"
41030-157 = "Вот почему я пошла в SRT. Но сейчас нашего дома больше нет, и мне очень страшно…"
41030-158 = "Эй, у меня появилась идея."
41030-159 = "Почему бы тебе не присоединиться к Бюро Общественной Безопасности? Нас тут совсем немного, так что тебе будет просто устроиться."
41030-160 = "Я выбрала его специально, потому что тут вообще ничего не нужно делать! Я могу просто есть пончики и избегать людей."
41030-161 = "И-Избегать людей?"
41030-162 = "То есть, если я вступлю в твой клуб, я смогу ходить в школу и вообще ни с кем не разговаривать?"
41030-163 = "Эм… Я думаю, что \"вообще ни с кем\" - это всё-таки невозможно."
41030-164 = "Кое-какую работу нам всё же приходится выполнять. Например, разбирать странные жалобы гражданских и всё такое."
41030-165 = ""
41030-167 = ""
41030-168 = "Могу я лучше вернуться к жукам?"
