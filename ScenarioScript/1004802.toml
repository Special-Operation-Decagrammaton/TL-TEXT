1004802-202 = "... *тяжело дышит*"
1004802-203 = ""
1004802-206 = ""
1004802-207 = "Этого достаточно?"
1004802-208 = "Вы невероятно сильны!"
1004802-209 = "Но! Н-Нет! М-Мы не можем открыть вам счёт!"
1004802-210 = "Что?"
1004802-211 = "Если вы действительно хотите открыть счёт..."
1004802-212 = "Да, да!"
1004802-213 = ""
1004802-215 = ""
1004802-217 = "Вместо этого не хотите присоединиться к элитной охране Банка Чёрного рынка?"
1004802-218 = "[s] «Эм... Простите?!»"
1004802-220 = ""
1004802-222 = ""
1004802-223 = ""
1004802-224 = "Эй!"
1004802-226 = "Понятно. Вы постоянно меняете свои обещания. Вы лжец."
1004802-227 = "Я зря потратила время."
1004802-228 = "Но зато усвоила ценный урок."
1004802-229 = "Нет! Прошу прощения! М-М-Мы откроем его прямо сейчас!"
1004802-230 = ""
1004802-232 = ""
1004802-239 = ""
1004802-240 = "По дороге обратно после того, как ей наконец открыли счёт..."
1004802-241 = "[s] «Хорошая работа, Саори.»"
1004802-242 = "Нет, я почти ничего не делала..."
