[translation]
1004802-1 = "Самостоятельность"
1004802-2 = "Улица Чёрного рынка"
1004802-4 = "Саори прислала немного странное сообщение, поэтому я отправился на Чёрный рынок."
1004802-5 = "О, Сенсей, вот вы где."
1004802-6 = "[s1] «Эм, Саори. Ты в порядке? Твоё сообщение меня удивило!»\n[s2] «Ты обычно не обращаешься ко мне за помощью...»"
1004802-7 = "Не знаю, действительно ли мне нужна помощь. Просто..."
1004802-8 = "Не знаю, действительно ли мне нужна помощь. Просто..."
1004802-9 = "Я пыталась решить кое-что самостоятельно, но, похоже, это невозможно."
1004802-10 = "[s] «Раз ты попросила помощи у меня... проблема, должно быть, огромная!»"
1004802-11 = "А? Нет, я..."
1004802-12 = "[s3] «Неважно, насколько большая проблема!»\n[s4] «Я сделаю всё, что смогу, чтобы помочь тебе, Саори!»"
1004802-13 = "О... Хорошо... Л-Ладно..."
1004802-14 = "О... Хорошо... Л-Ладно..."
1004802-15 = ""
1004802-17 = ""
1004802-18 = "Тогда сюда."
1004802-19 = ""
1004802-21 = ""
1004802-23 = ""
1004802-28 = ""
1004802-29 = "Я последовал за Саори и оказался..."
1004802-30 = "[s] «А? Это... Банк Чёрного рынка?»"
1004802-31 = ""
1004802-33 = ""
1004802-34 = "Здравствуйте! Добро пожаловать!"
1004802-35 = ""
1004802-37 = ""
1004802-38 = "Ай! Это та загадочная, упрямая девушка, которая недавно приходила!"
1004802-39 = "[s] «Ч-Что? З-Загадочная...?»"
1004802-40 = "Я ведь уже много раз вам говорила! Это невозможно!"
1004802-41 = "Без поручителя мы не можем обработать ваш запрос!"
1004802-42 = "Поэтому я привела поручителя."
1004802-43 = "У вас внезапно появился поручитель?"
1004802-44 = ""
1004802-46 = ""
1004802-47 = "А? Этот человек...?"
1004802-48 = "Да, я привела гаранта, как вы и просили."
1004802-49 = "Хм..."
1004802-50 = "[ns] «Поручитель... для Чёрного рынка...?»"
1004802-52 = "[ns5] «...Я сейчас впутываюсь в какое-то крупное финансовое преступление?!»\n[ns6] «Саори! Я же полностью тебе доверял!»"
1004802-55 = "Сенсей? Не понимаю, о чём вы."
1004802-57 = "В конце концов Саори объяснила мне ситуацию."
1004802-60 = "[ns] «Речь об открытии счёта...?»"
1004802-61 = "Да. Она сказала, что хочет открыть счёт в нашем отделении, но отказывается раскрывать сведения об учёбе..."
1004802-62 = "Без сведений об учёбе в Кивотосе ничего не сделаешь!"
1004802-63 = "[s] «А, если проблема только в этом... Ну, всё немного сложно.»"
1004802-64 = "В любом другом банке её бы сразу выгнали!"
1004802-65 = "Но мы ведь другие, понимаете?"
1004802-66 = "Если заплатите справедливую цену, Чёрный рынок отнесётся к вам справедливее всех!"
1004802-67 = "Вам даже кредитная история не нужна."
1004802-68 = "Если вы физически способны и у вас есть приличное оружие..."
1004802-69 = "Работу мечты я не обещаю, но на Чёрном рынке устроиться несложно!"
1004802-70 = "[s] «(Даже не знаю, что на это ответить...)»"
1004802-71 = "Поэтому нам и нужен поручитель — кто-то, кто возьмёт ответственность, если что-то случится..."
1004802-72 = "То есть мы просто сказали ей, что нужен гарант, и тогда она сможет открыть счёт..."
1004802-73 = "[s] «Я с радостью помогу, но ситуация немного тревожная.»"
1004802-75 = "...Простите, Сенсей."
1004802-76 = "Я разошлась с остальными из отряда Ариус. Мне больше не на кого положиться."
1004802-77 = "[s] «Но зачем тебе вообще открывать счёт?»"
1004802-78 = "Недавно я связалась с Чёрным рынком."
1004802-79 = "Я не знала, куда ещё идти."
1004802-80 = "Понимаете... мне нужны деньги на жизнь и всё такое. И..."
1004802-81 = "Мы сказали ей, что, если она хочет получать оплату за наши поручения, ей нужен счёт."
1004802-82 = "[s] «А, вот почему...»"
1004802-83 = "...Но, по их словам, я просила невозможного."
1004802-84 = "Мне не стоило втягивать вас в это..."
1004802-85 = "Всё нормально. Давайте просто сделаем вид, что я вам не звонила."
1004802-86 = "[s] «Нет, как раз с такими вещами я могу помочь.»"
1004802-87 = "П-Правда?"
1004802-88 = "[s] «Больше всего я рад, что ты обратилась ко мне.»"
1004802-89 = ""
1004802-91 = ""
1004802-92 = "...Хорошо."
1004802-93 = ""
1004802-94 = "[ns] «Сделаем это! Откроем счёт!»"
1004802-97 = "Отлично! Для открытия счёта нужно начать с простой проверки!"
1004802-98 = "[s] «Я думал, нужен только гарант?»"
1004802-99 = "Ахаха! Не волнуйтесь!"
1004802-100 = "Процесс простой. Конечно, можете отказаться, если передумали открывать счёт."
1004802-101 = "Я не против, Сенсей."
1004802-102 = "[s] «Ну, если ты так говоришь...»"
1004802-103 = "Хорошо, первый вопрос..."
1004802-104 = "Расскажите о своей предыдущей работе и опыте до того, как пришли сюда."
1004802-105 = "Предыдущей работе...?"
1004802-106 = "[s] «Постойте, постойте. Это правда необходимая информация?!»"
1004802-107 = "Если мы узнаем сферу опыта заявителя, то сможем предлагать более подходящую работу."
1004802-108 = "Это проблема?"
1004802-109 = "Нет, всё нормально. Я могу ответить, Сенсей."
1004802-110 = ""
1004802-112 = ""
1004802-114 = "Я не могу рассказать подробности, но раньше занималась планированием и проведением взрывов, сносом зданий и свержением академий."
1004802-116 = "...?"
1004802-117 = "Особенно я специализируюсь на уничтожении крупных организаций."
1004802-118 = "Хм?"
1004802-119 = "[s] «С-Саори?! Может, стоит немного смягчить формулировку.»"
1004802-120 = "Что? Мне ведь не стоит лгать, правда?"
1004802-121 = "[s] «Н-Ну... технически да...»"
1004802-122 = "К-Кхм! У вас очень необычный опыт!"
1004802-123 = "Х-Хорошо... Перейдём к следующему вопросу..."
1004802-124 = ""
1004802-126 = ""
1004802-127 = "Где находится ваше место жительства?"
1004802-128 = "Моё место жительства..."
1004802-129 = "По сути, его нет. Сейчас я живу на Чёрном рынке."
1004802-130 = "А?"
1004802-131 = "Если точнее: иногда в заброшенном здании, иногда в сломанной машине, иногда под мостом. Место меняется."
1004802-132 = ""
1004802-134 = ""
1004802-135 = "Это какая-то шутка?"
1004802-136 = "[s] «Э-э-э! Давайте считать, что да!»"
1004802-137 = "Дальше..."
1004802-139 = "Мы прошли через целую кучу вопросов."
1004802-142 = "Хорошо. Это всё."
1004802-143 = "[s] «Н-Наконец-то...»"
1004802-145 = "Хорошо."
1004802-146 = "Теперь я могу открыть счёт?"
1004802-147 = "Ах!"
1004802-148 = "Остался один последний, но обязательный этап."
1004802-150 = "Проверка навыков."
1004802-151 = ""
1004802-154 = "[ns] «Вы же сказали, что это простая проверка!»"
1004802-155 = "Хаха. Даже если у неё есть поручитель, это всё-таки Чёрный рынок..."
1004802-156 = "Мы не можем открывать счёт кому попало, понимаете?"
1004802-157 = "Кроме того, эта проверка проводится в интересах клиента."
1004802-158 = "Нам нужно понять её возможности, чтобы знать, с какой работой она справится. Это выгодно всем сторонам."
1004802-159 = "[s] «Я понимаю, что это Чёрный рынок, но всё-таки...»"
1004802-161 = "Вы помогли мне зайти так далеко, сейчас я не могу сдаться."
1004802-162 = "Хорошо. Я пройду вашу проверку навыков."
1004802-163 = "Ахаха! Отлично!"
1004802-167 = ""
1004802-168 = ""
1004802-171 = ""
1004802-172 = "Тест простой."
1004802-173 = "Как долго ты сможешь продержаться против нескольких охранников Чёрного рынка?!"
1004802-174 = "Чем дольше продержишься, тем выше будет твой рейтинг и уровень обслуживания. Постарайся!"
1004802-175 = "Готовы?"
1004802-176 = ""
1004802-178 = ""
1004802-180 = "..."
1004802-182 = "Начинаем проверку!"
1004802-183 = "...!"
1004802-184 = ""
1004802-196 = ""
