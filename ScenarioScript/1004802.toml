1004802-244 = "[s7] «Нет, всё нормально. Я рад, что был рядом и помог тебе разобраться с Чёрным рынком.»\n[s8] «Как видишь, на Чёрном рынке могут отказаться от своих слов в любой момент.»"
1004802-245 = "Я думала, что уже понимаю, как устроен преступный мир."
1004802-246 = "Я думала, что уже понимаю, как устроен преступный мир."
1004802-247 = "Но вы правы."
1004802-248 = "[s] «Мир — опасное место. Поэтому...»"
1004802-249 = "То есть...?"
1004802-250 = "[s] «Будь осторожна, Саори. Пожалуйста.»"
