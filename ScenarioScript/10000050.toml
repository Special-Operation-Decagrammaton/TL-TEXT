[translation]
10000050-1 = "Эпизод 5;Фестивальные улицы"
10000050-2 = "Снова проиграли? А Изуна? Где она?"
10000050-3 = "От неё никакой пользы! Тоже мне ниндзя!"
10000050-4 = "Она раньше убежала, сказав, что у неё какие-то дела."
10000050-5 = "Хм. Какая жалость. Я действительно уважала её способности."
10000050-6 = "(Интересно, можем ли мы и дальше на неё рассчитывать.)"
10000050-7 = "Если так пойдёт дальше, тот Сенсей из Шале остановит нас прежде, чем мы успеем сорвать фестиваль."
10000050-8 = "Никогда бы не подумала, что один взрослый способен создать столько проблем.#nНу, как бы то ни было..."
10000050-9 = "Сколько Моурё осталось на улицах?"
10000050-10 = "Примерно, эм... где-то 120?"
10000050-11 = "Прекрасно. Тогда сейчас самое время перейти в наступление."
10000050-12 = "Отчаянные времена требуют отчаянных мер, так что слушайте внимательно."
10000050-13 = ""
10000050-14 = ""
10000050-15 = "*шёпот* *перешёптывание* *удивительные приказы*"
10000050-16 = "А?! Вы серьёзно?"
10000050-17 = "Правда? Вы реально хотите, чтобы мы это сделали?"
10000050-18 = "Нужно устранить последнюю переменную."
10000050-19 = "Выполните это задание и получите свои премии — как и указано в договоре."
10000050-20 = "Ну, раз вы так говорите. Поняла, босс."
10000050-21 = "Ага, поняла!"
10000050-22 = "Разумеется... вы должны сохранить это в секрете от Изуны."
10000050-23 = "Пора покончить с этим раз и навсегда."
10000050-25 = "Момоёдо"
10000050-26 = "Уже поздно, но все собрались в Момоёдо на совещание по стратегии."
10000050-27 = "Итак, как нам найти виновника?"
10000050-28 = "У меня есть безотказный способ."
10000050-29 = "Сначала выйдем на улицы, найдём Моурё, которые устраивают беспорядки, и окружим их."
10000050-30 = "С объединёнными силами отдела организации фестивалей и Клуба внутренней дисциплины это должно быть несложно."
10000050-31 = "Что делать после того, как окружим их?"
10000050-32 = "Просто! Побьём их и схватим."
10000050-33 = "А потом заставим сказать, кто их нанял."
10000050-34 = "И используем любые необходимые средства, чтобы разговорить их!"
10000050-35 = "Вот теперь говоришь на моём языке, президент!"
10000050-37 = "Вы слышали! Отрезать мизинцы всем, кто посмеет противиться нашему чувству справедливости!"
10000050-38 = "Ого..."
10000050-39 = "Ну тогда..."
10000050-40 = "*зевок*"
10000050-41 = "[s] «...»"
10000050-42 = ""
10000050-43 = "Вы все правы — это уже слишком. Как вы могли, президент...?#nКакая жестокость..."
10000050-44 = "Что за...?! Я такого не говорила!"
10000050-45 = "Нам нужно лишь поймать их и выяснить, на кого они работают!#nВот что важно!"
10000050-46 = "Но если серьёзно, у нас заканчивается время."
10000050-47 = "Финал фестиваля запланирован на завтра."
10000050-48 = "О, точно! Завтра! Будут фейерверки, да? Голографические!#nВжух, бах, бум!"
10000050-49 = "Ещё бы. Мы подготовили большое шоу фейерверков с использованием передовых технологий, чтобы завершить Фестиваль цветения сакуры."
10000050-50 = "Если Моурё думают ему помешать, их ждёт сюрприз."
10000050-51 = "Да, но если мы не успеем остановить их до этого, отдел организации фестивалей..."
10000050-52 = "Шизуко..."
10000050-53 = "Прости. Прочь, негативные мысли!"
10000050-54 = "Нужно просто как можно скорее найти виновника, чтобы я смогла выместить всё раздражение на этом тупом придурке!"
10000050-55 = "[s] «Ну давай, расскажи нам, что ты НА САМОМ ДЕЛЕ чувствуешь.»"
10000050-56 = "Я-я просто больше не хочу сдерживать злость — вот и всё!"
10000050-58 = "Так отдел организации фестивалей и Клуб внутренней дисциплины начали вместе патрулировать улицы. Однако..."
10000050-59 = "Почему Моурё в этот раз вообще не появляются?!"
10000050-60 = "Кажется, я знаю! Всё как с моим пультом от телевизора!"
10000050-61 = "Знаешь, он всегда оказывается в последнем месте, где ты ищешь? А я в последнюю очередь всегда смотрю в холодильнике!"
10000050-62 = "О, у меня тоже! Как там это называется? Что-то вроде... закона Маффина?"
10000050-63 = "Звучит вкусно."
10000050-64 = "С другой стороны, хотя бы все наконец спокойно наслаждаются фестивалем без помех."
10000050-65 = ""
10000050-66 = ""
10000050-68 = "А-а-а! Так не пойдёт!"
10000050-69 = "Моурё наверняка прячутся прямо за углом...!"
10000050-70 = ""
10000050-71 = "Уаааа! Мама! Папа! Где вы?!"
10000050-73 = "Ох ты. Ты потерялась, малышка?"
10000050-74 = "Теперь наша очередь! Цубаки! Это работа для Клуба внутренней дисциплины!"
10000050-75 = "Конечно. Давай..."
10000050-76 = ""
10000050-78 = "А-а? П-погодите...!"
10000050-79 = "О, Шизуко! Мы тебя искали!"
10000050-80 = "Это насчёт завтрашнего шоу фейерверков. Нам нужно кое-что с тобой обсудить."
10000050-81 = "А? Обязательно прямо сейчас?"
10000050-82 = "Стоп... Я президент отдела организации фестивалей, так что не могу это игнорировать. Пина, поиски доверяю тебе!"
10000050-83 = "Вы с Сенсеем внимательно следите за Моурё!"
10000050-84 = "Есть! Положитесь на меня!"
10000050-85 = ""
10000050-86 = "Ну как тебе? Все вдруг стали ужасно заняты!"
10000050-87 = "[s] «Даже без Моурё дел хватает.»"
10000050-88 = "Верно подмечено, босс! Вы совершенно правы."
10000050-89 = "Даже без Моурё у отдела организации фестивалей были бы руки заняты управлением фестивалем!"
10000050-90 = "Но вместо этого сейчас всем тяжело.#nОт этого мне так..."
10000050-91 = "Нет, что я говорю?! Нужно взять себя в руки! Я не могу грустить, когда мы с вами вдвоём, босс!"
10000050-92 = "Особенно нельзя расслабляться теперь, когда президент назначила меня полевым капитаном. Прямо как та сцена из «Кулака верного кота»!"
10000050-93 = "[s] «За дело, Пина.»"
10000050-94 = "Да! Я здесь, чтобы защищать и вас, И улицы."
10000050-95 = "Время полевого капитана Пины блистать!"
10000050-96 = "*грохот*"
10000050-97 = "[s1] «Лёгок на помине!»\n[s2] «Опять Моурё?!»"
10000050-101 = "Что-о-о? Так это не годится?"
10000050-102 = "Вы издеваетесь над нами? А?!"
10000050-103 = "П-посмотрите сюда. Уголок оторван..."
10000050-104 = "Хватит! Это мой приз, и я его честно выиграл!"
10000050-105 = "Дай мне этот фестивальный сертификат на 3000 иен — и я вытяну каждый приз в этой лавке!"
10000050-106 = "П-пожалуйста, пощадите! Как я тогда останусь в бизнесе?!"
10000050-107 = "Ха-ха-ха! Это уже твоя проблема! Вот как опытные ветераны розыгрышей наслаждаются фестивалем!"
10000050-108 = "Попробуйте нас остановить!"
10000050-109 = ""
10000050-110 = "Ух! Такие нарушители появляются буквально на каждом фестивале!"
10000050-111 = "[s] «Как мотыльки на огонь, да?»"
10000050-112 = "Их называют Убийцами розыгрышей, и все фестивальные торговцы их боятся!#nНужно что-то делать, босс!"
10000050-113 = "Пора нам вступить в игру. Вы со мной?"
10000050-114 = "Мы не можем закрыть глаза на тех, кто угрожает спокойствию фестиваля!"
