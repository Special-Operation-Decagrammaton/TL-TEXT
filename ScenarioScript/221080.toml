#[!][Data: "20/09"]
[translation]
221080-1 = "Episódio 08;A Terceira Opção"
221080-2 = ""
221080-3 = "......Capitã. A senhorita ainda não conseguiu tomar uma decisão?"
221080-4 = "Estou quebrando a cabeça com isso há meses... Se desse para achar a resposta mágica em uma única semana, eu não estaria sofrendo desse jeito..."
221080-5 = "Os boatos sobre o destino do Sammy continuam se espalhando como fogo em palha seca."
221080-6 = "E para piorar, o Sensei acabou machucando a coluna por causa dele..."
221080-7 = "O clamor das alunas temendo que 'o Sammy está atraindo desgraças para a frota' está cada vez mais ensurdecedor."
221080-8 = "E você acha que se desembarcarmos o Sammy, todo o azar do mundo vai sumir num passe de mágica?"
221080-9 = "......A senhorita sabe perfeitamente que não foi isso que eu quis dizer!"
221080-10 = "Myaa?!"
221080-11 = "......Perdão, Sammy."
221080-12 = "Eu não estava gritando com você, meu bem."
221080-13 = "Myaawn......"
221080-14 = "Mas nada muda o fato concreto de que o Sensei da Schale se feriu dentro das nossas dependências."
221080-15 = "Eu sei muito bem."
221080-16 = "Se a Schale decidir nos responsabilizar formalmente por negligência――o que a Capitã pretende responder?"
221080-17 = ""
221080-18 = "[ns1] \"Quanto a isso, não precisam se preocupar nem um pouco.\"\n[ns2] \"Eu que dei um mau jeito nas costas por pura bobeira minha.\""
221080-21 = "Sensei?!#nE... a Presidente do Conselho Estudantil Federal também..."
221080-22 = "Ouvimos dizer que tinha travado a lombar, já está em condições de caminhar?"
221080-23 = "......Por favor, sentem-se primeiro. Vou providenciar um chá para todos."
221080-24 = "Não precisa se incomodar, não estamos com sede."
221080-25 = "Em vez disso, sobre o assunto que tínhamos alinhado no nosso último encontro... gostaria de dar andamento sem delongas."
221080-26 = "Não há nenhum tabu ou etiqueta cerimonial que nos impeça de conversar abertamente agora... correto?"
221080-27 = "De modo algum. Vamos direto ao ponto, então."
221080-28 = ""
221080-30 = ""
221080-31 = ""
221080-33 = "Rola, rola......"
221080-34 = "Fufufu, vejo que esse rapazinho continua tão despreocupado quanto sempre."
221080-35 = ""
221080-37 = ""
221080-38 = "Ainda temos alguns dias até o encerramento do prazo... Como andam as deliberações sobre o destino dele?"
221080-39 = "Peço imensas desculpas, mas... ainda não chegamos a lugar algum..."
221080-40 = "No fim das contas... o seu medo é enfrentar a fúria das estudantes e ser odiada por elas?"
221080-41 = "Ou o seu pavor reside em quebrar as tradições seculares da Odisseia e desafiar os tabus sagrados do mar?"
221080-42 = "......Para ser sincera... sinto medo das duas coisas."
221080-43 = "[ns] \"Passei os últimos dias observando a rotina do Sammy bem de perto.\""
221080-45 = "[ns3] \"É fato que aconteceram pequenos incidentes perto dele.\"\n[ns4] \"Mas acho completamente injusto colocar a culpa de tudo nas costas do bichano.\""
221080-48 = "Concordo plenamente.#nAfinal de contas, o Sammy é apenas um gato inocente."
221080-49 = "Mya."
221080-50 = "[s5] \"E se a Capitã fizesse um pronunciamento oficial?\"\n[s6] \"Declarando que a saúde do Sammy não tem ligação nenhuma com a sorte da escola.\""
221080-53 = "Fazer isso seria..."
221080-54 = "Haaaaah......"
221080-55 = "Sendo muito honesta com vocês... no fundo da minha mente eu compreendo a razão lógica."
221080-56 = "Sei perfeitamente que a maioria dos tabus da Odisseia não passam de velhos hábitos que perderam o sentido no mundo contemporâneo."
221080-57 = "Criaturas como coelhos e ratos, que outrora destruíam as caravelas de madeira,#nhoje em dia não causam o menor arranhão na navegação dos nossos cascos blindados."
221080-58 = "Desperdiçar suprimentos preciosos em alto-mar para obedecer cegamente a tabus vazios...#npara quem vive em terra firme, deve parecer o ápice do ridículo."
221080-59 = "Contudo... para simplesmente fecharmos os olhos e fingirmos que não existem, este oceano é impiedoso e caprichoso demais."
221080-61 = "O tempo muda de uma hora para outra, sem promessa de um amanhã seguro."
221080-62 = "Sob a lâmina da água escura, espreitam recifes afiados, tempestades e ameaças invisíveis."
221080-63 = "E, acima de tudo――acontecem tragédias absurdas e revoltantes que a razão humana jamais conseguirá engolir."
221080-64 = "Quando alguém é forçado a viver dia após dia sob tamanha incerteza, o desespero bate... e a vontade que dá é de fugir correndo."
221080-66 = ""
221080-67 = "E é exatamente por isso que, às vezes, a alma humana clama por uma 'resposta' simples, clara e compreensível."
221080-68 = "E a resposta encontrada pela Odisseia――foram os tabus?"
221080-69 = "Sim. Porque através deles, o coração encontra um jeito fácil de aceitar a dor."
221080-71 = "Se os ventos contrários atrasam a viagem e estragam mantimentos preciosos――"
221080-72 = "Se uma borrasca repentina parte ao meio o mastro que consertamos com tanto suor――"
221080-73 = "Se uma onda colossal varre o convés e fere gravemente uma companheira querida――"
221080-75 = "Basta pensar: 'Isso aconteceu porque alguém violou um tabu sagrado'.#nSe encontrarmos um culpado místico para justificar a desgraça, a dor diminui."
221080-76 = "Se pudermos jogar todo o peso e a culpa da maré de azar nas costas de um gato idoso e doente...#nentão ninguém precisa se sentir culpado."
221080-77 = "Talvez essa seja a única forma que encontramos de navegar por este mar cruel e sem sentido sem enlouquecer."
221080-78 = "......Myaon."
221080-79 = "Rola, rola......"
221080-80 = "No entanto... você realmente acredita que essa seja a melhor decisão a ser tomada?"
221080-81 = "............"
221080-82 = "[ns7] \"Encarar as crueldades da vida é difícil até para nós, adultos.\"\n[ns8] \"Às vezes a vontade que dá é de varrer a sujeira para debaixo do tapete.\""
221080-85 = "Varrer para debaixo do tapete... uma analogia bastante curiosa."
221080-86 = "Temos um provérbio muito similar aqui na Odisseia."
221080-87 = "Dizemos que se empurrarmos tudo o que é confuso e incômodo para os porões inferiores, ninguém no convés verá o problema."
221080-88 = "[ns] \"Mas o problema continua existindo ali embaixo.\""
221080-90 = "[ns9] \"Sem solução, ele vai permanecer lá para sempre.\"\n[ns10] \"Até que alguém tenha a coragem de levantar o tapete e limpar de verdade.\""
221080-93 = ""
221080-95 = ""
221080-96 = "Mya!"
221080-97 = ""
221080-99 = ""
221080-100 = "Eu trancei essa bolinha de corda para o Sammy quando ainda era uma aluna caloura do primeiro ano."
221080-101 = "Olhando agora... o acabamento é cheio de falhas infantis, com nós invertidos e laçadas frouxas."
221080-102 = "Mas mesmo assim... o Sammy adorou e não largou mais."
221080-103 = ""
221080-105 = ""
221080-106 = "Eu sei melhor do que qualquer um que a função de uma Capitã é agir com a frieza da razão e tomar decisões pragmáticas."
221080-107 = "Contudo... antes de ostentar o título de Capitã, eu também sou uma aluna com sentimentos."
221080-108 = "O Sammy é o meu melhor amigo, que esteve ao meu lado em todas as viagens.#nEu ainda não sou adulta o bastante para aceitar a dor dessa separação apenas com base na lógica fria."
221080-109 = ""
221080-111 = ""
221080-112 = "Encarar a dor de frente ou simplesmente desviar o olhar.#nEssas duas opções não são os únicos caminhos disponíveis no mundo."
221080-113 = "Transferir o peso da decisão para alguém em quem confie também pode ser uma alternativa válida."
221080-114 = "O que a senhora quer dizer com isso...?"
221080-115 = "Por exemplo――que tal pedir emprestada a autoridade suprema da Presidente do Conselho Estudantil Federal?"
221080-116 = "O Conselho Estudantil Federal emitirá uma portaria determinando que a presença de um felino na Odisseia representa um risco sanitário à tripulação."
221080-117 = "Portanto, em cumprimento às diretrizes de saúde pública, a Presidente do Conselho Estudantil Federal recolherá o animal e providenciará seu acolhimento adequado em terra."
221080-118 = "......O que acha da proposta?"
221080-119 = "De fato... se a ordem vier dessa forma, a imensa maioria das estudantes se conformará."
221080-120 = "Toda a culpa, o ressentimento e a responsabilidade da decisão――não recairão sobre a liderança da Odisseia."
221080-121 = ""
221080-122 = "[ns] \"Mas e se as alunas passarem a nutrir ódio e rancor do Conselho Estudantil Federal?\""
221080-123 = "Não há problema algum.#nPara começo de conversa, o Conselho Estudantil Federal foi estruturado justamente para ser odiado quando necessário."
221080-124 = "Por mais inquebráveis e incompreensíveis que os tabus do mar possam parecer..."
221080-125 = "Nada neste mundo soa mais arbitrário, cruel e indecifrável do que a 'Autoridade Absoluta' imposta de fora da escola."
221080-126 = "Depois de ouvir tais palavras com tamanha convicção... não me resta argumento algum para contestar..."
221080-127 = "Se devo silenciar minhas emoções e permitir que o pragmatismo prevaleça――"
221080-128 = ""
221080-130 = ""
221080-131 = ""
221080-132 = "Por favor... cuidem bem do Sammy por mim."
221080-134 = "Próximo Episódio;Divisão de Papéis"
