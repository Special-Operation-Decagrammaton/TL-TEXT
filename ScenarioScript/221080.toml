[translation]
221080-1 = "Episode 8;The Third Option"
221080-3 = "......Captain. Still unable to reach a decision?"
221080-4 = "I have been agonizing over this for months. If I could get an answer in just a week, I would not be struggling so much..."
221080-5 = "Rumors regarding Sammy are still spreading."
221080-6 = "Worse yet, Sensei got hurt because of Sammy..."
221080-7 = "Uneasy whispers saying that Sammy might be bringing bad luck are growing louder."
221080-8 = "And if we send Sammy away, all the bad luck will vanish?"
221080-9 = "...You know that is not what I meant!"
221080-10 = "Nyan!?"
221080-11 = "...I am sorry, Sammy."
221080-12 = "I am not angry at you."
221080-13 = "Nyaun..."
221080-14 = "However, the fact remains that Schale's Sensei was injured at our academy."
221080-15 = "I know."
221080-16 = "If Schale decides to hold us responsible for this incident--how do you intend to respond?"
221080-18 = "[ns1] \"You do not need to worry about that.\"\n[ns2] \"I just hurt myself on my own.\""
221080-21 = "[USERNAME] Sensei?#nAnd even the General Student Council President..."
221080-22 = "I heard you hurt your lower back, but are you already well enough to move around?"
221080-23 = "...Please take a seat for now. I will prepare some tea right away."
221080-24 = "Do not bother. I am not thirsty."
221080-25 = "More importantly, regarding the matter we discussed last time... I would like to start talking about it right away."
221080-26 = "There are no taboos or rituals preventing us from discussing that matter... correct?"
221080-27 = "Of course. Then, let us get straight to the point."
221080-33 = "Roll, roll..."
221080-34 = "Fufu, that child is carefree as always."
221080-38 = "There is still time until the deadline, but... is the review of her treatment going smoothly?"
221080-39 = "I am sorry, but not yet..."
221080-40 = "Could it be... are you afraid of student backlash and of being resented?"
221080-41 = "Or are you afraid of breaking the customs of Odyssey and the taboos of the sea?"
221080-42 = "...Both."
221080-43 = "[ns] \"I have been watching Sammy's actions for the past few days.\""
221080-45 = "[ns3] \"It is true that bad luck was happening around Sammy.\"\n[ns4] \"However, I think it is wrong to blame it all on Sammy.\""
221080-48 = "That is true.#nAfter all, Sammy is just a cat."
221080-49 = "Nyan."
221080-50 = "[s5] \"How about the Captain makes a declaration?\"\n[s6] \"That Sammy's condition has nothing to do with the academy's fortune.\""
221080-53 = "That is..."
221080-54 = "Haah..."
221080-55 = "To be honest... I understand it too."
221080-56 = "The numerous taboos in Odyssey are nothing more than customs that have lost their meaning in modern times."
221080-57 = "Once dangerous entities like rabbits and mice#ndo not affect navigation at all anymore."
221080-58 = "On a sea where supplies tend to be scarce, wasting resources to uphold hollowed-out taboos...#nwould probably look ridiculous to people on land."
221080-59 = "And yet... this sea is far too fickle to simply pretend not to notice."
221080-61 = "A constantly changing weather with no promise for tomorrow."
221080-62 = "Countless reefs and threats lurking beneath the water's surface."
221080-63 = "And--unreasonable events that human logic cannot swallow."
221080-64 = "If people are continually placed in such an environment, they suffer... and want to run away."
221080-67 = "That is why they sometimes wish for a clear and straightforward 'answer'."
221080-68 = "The answer chosen by Odyssey being--a taboo?"
221080-69 = "Yes. Because that makes it easier to accept."
221080-71 = "Even if poor winds delay navigation and precious food goes to waste--"
221080-72 = "Even if a sudden storm snaps the mast we worked so hard to repair--"
221080-73 = "Even if a massive wave sweeps away a precious comrade and leaves them heavily injured--"
221080-75 = "It happened because someone broke a taboo.#nWhat if we think of it as such cause and effect?"
221080-76 = "If we can place all the blame on a single elderly and sick cat..."
221080-77 = "Perhaps we can navigate this unreasonable sea without anyone getting hurt."
221080-78 = "...Nyaon."
221080-79 = "Roll, roll..."
221080-80 = "However... is that truly the best decision?"
221080-81 = "............"
221080-82 = "[ns7] \"Facing unreasonableness is tough even for adults.\"\n[ns8] \"There are times when you just want to hide it under the carpet.\""
221080-85 = "The carpet, you say... What an interesting analogy."
221080-86 = "There is a similar story in Odyssey."
221080-87 = "That if you push troublesome and complicated things under the deck, they will no longer be visible from the outside."
221080-88 = "[ns] \"Yet the problem still remains.\""
221080-90 = "[ns9] \"It just stays there, unresolved.\"\n[ns10] \"Until you lift the carpet and clean it up.\""
221080-96 = "Nyan!"
221080-100 = "I made this charm for Sammy when I was a first-year."
221080-101 = "Looking at it now... some of the knots are clumsy, and some are wound in the reverse direction."
221080-102 = "Yet Sammy took a liking to it."
221080-106 = "I know better than anyone that the Captain is in a position to make rational judgments."
221080-107 = "However... before I am a Captain, I am also one of the people involved."
221080-108 = "Sammy is a dear friend I have spent a long time with.#nI am not adult enough to accept the sorrow of parting through logic alone."
221080-112 = "To face it, or to turn away.#nIt does not mean those are the only options."
221080-113 = "Leaving the decision to someone who can accept it is also one option."
221080-114 = "Meaning...?"
221080-115 = "For example--how about borrowing the authority of the General Student Council President?"
221080-116 = "The General Student Council determines that the cat residing in Odyssey has sanitary issues."
221080-117 = "Therefore, for hygiene management, the General Student Council will retrieve the cat and handle it appropriately."
221080-118 = "...What do you think?"
221080-119 = "Indeed... if it is like that, most students will accept it."
221080-120 = "Because neither the responsibility nor the resentment accompanying the decision will remain with Odyssey."
221080-122 = "[ns] \"What will you do if students develop a grudge against the General Student Council?\""
221080-123 = "It does not matter.#nAfter all, the General Student Council is an organization made to be hated."
221080-124 = "No matter how difficult the taboos of the sea are to break or understand..."
221080-125 = "Nothing is more unreasonable and incomprehensible than a 'mighty authority' outside the academy."
221080-126 = "If you go that far... I have no room to raise any objections..."
221080-127 = "If emotions are to be set aside to make a rational judgment--"
221080-132 = "I leave Sammy... in your hands."
221080-134 = "Next Episode;Division of Roles"
