[translation]
10048110-1 = "Эпилог;Подсказка в одной фразе"
10048110-2 = "Десертное кафе"
10048110-3 = ""
10048110-4 = ""
10048110-5 = "М-м...!"
10048110-6 = "Вкусно...!"
10048110-7 = "Вот именно!"
10048110-8 = "[s] «Фуфу, я же говорила, что в кафе вкуснее!»"
10048110-9 = "Точно! Есть особая свежесть, которую невозможно воспроизвести, если брать с собой."
10048110-10 = "Аромат и эстетика... Вкус весьма многогранный."
10048110-11 = "Он откровенно сладкий, но не приторный..."
10048110-12 = "Президент, тебе не кажется немного эгоистичным, что мы сидим здесь и наслаждаемся этим?"
10048110-13 = "Подумай обо всех бедных девочках Вайлдханта, которым не достанется даже крошки этого торта."
10048110-14 = "Думаю, нам стоит подумать... о добавлении таких товаров в наш ассортимент."
10048110-15 = "...Как ты вообще сейчас можешь думать о контрабанде?!"
10048110-16 = "[s] «Настоящий менеджер по продажам...»"
10048110-17 = "Так, Миё... Получается, мы можем покидать Вайлдхант, пока находимся с Сенсеем?"
10048110-18 = "Да. Сенсей вывел нас на официально одобренную экскурсию, так что даже Префектурный совет вынужден отступить."
10048110-19 = "Именно поэтому представители ученического совета Вайлдханта могут посещать Шале."
10048110-20 = "В-В этом смысле... спасибо, Сенсей."
10048110-21 = "Мы втянули вас в нашу чушь, а теперь вы ещё и вывезли нас на экскурсию есть десерт..."
10048110-22 = "[s1] «Вы так старались — это меньшее, что я мог сделать!»\n[s2] «Сладости решают много проблем... например, низкий сахар в крови!»"
10048110-25 = "А, да. И Миё теперь намного лучше, правда?"
10048110-26 = "Тем не менее я проверила наши книги, и общая выручка от этой операции выглядит очень круглой. В смысле «0.»"
10048110-27 = "Не глупи, Фую. Наша прибыль не «0.» Она отрицательная, если учесть весь наш труд, дымовые шашки, лопату, которую мы где-то оставили..."
10048110-28 = "Тц..."
10048110-29 = "А мне было весело! И было так круто, как Миё торговалась с Воришкой!"
10048110-30 = "К-Круто...? Я?!"
10048110-31 = "Честно говоря, я была удивлена и впечатлена."
10048110-32 = "Подумать только, что такая жестокая финальная ловушка родилась в твоей милой головке."
10048110-33 = "Клиентка первой нас обманула. Она это заслужила."
10048110-34 = "Было справедливо отплатить ей тем же."
10048110-35 = "Вот моя девочка!"
10048110-36 = "Око за око, зуб за зуб!"
10048110-37 = "Видишь? У тебя природный талант! У Миё правда к этому склонность, да?"
10048110-38 = "З-Заткнись...!"
10048110-40 = "Но Миё, откуда ты знала, что это сработает? Почему люди не пошли к подделке?"
10048110-41 = "Всё благодаря тебе, Рицу."
10048110-42 = "Хм? Я?"
10048110-43 = "Когда мы впервые увидели поддельную «Любовь пурпурного и синего света», что ты сказала?"
10048110-44 = "Эм..."
10048110-46 = "Ого..."
10048110-47 = "Красиво."
10048110-49 = "Первое, что ты совершенно естественно сказала, было: «Красиво.»"
10048110-50 = "И так и было. Но слово «красиво» обычно говорят о приятном аксессуаре или украшении."
10048110-51 = "Обычно так не реагируют на шедевр."
10048110-52 = "...Иными словами, твоё врождённое эстетическое чутьё распознало, что картина поддельная."
10048110-53 = "...!"
10048110-54 = "Правда?!"
10048110-55 = "Вот я и подумала, что, возможно, у других людей тоже есть такое бессознательное различение, чистота взгляда."
10048110-56 = "Кроме того, я предположила, что если повесить подделку прямо рядом с оригиналом..."
10048110-57 = "...сравнение сделает различия ещё очевиднее."
10048110-58 = "Как несвежее печенье кажется ещё хуже, если есть его вместе со свежевыпеченным."
10048110-59 = "Поэтому я и решила выставить обе картины вместе."
10048110-60 = "Подумать только, ты всё это спланировала из одной фразы Рицу."
10048110-61 = "Я всегда говорила, что у литераторов есть странная, больная, извращённая сторона."
10048110-62 = "Как ты вообще пришла к такому выводу?!"
10048110-63 = "Полагаю, мы вправе отметить наш умеренный успех."
10048110-64 = "...Но в итоге мы проделали всю эту работу и ничего не получили."
10048110-65 = "Ух... Моя Cutey Berry 87..."
10048110-66 = "Она уже стояла бы у меня на столе под идеальным освещением, если бы клиентка нам заплатила..."
10048110-67 = "Не переживай, Миё."
10048110-68 = "Она всё ещё продаётся. И мне кажется, никуда не денется."
10048110-69 = "...Если честно, она, скорее всего, будет там ещё годы. Кто вообще её купит?"
10048110-70 = "Что...?!"
10048110-71 = "Не смей оскорблять мою драгоценную Cutey Berry 87...!"
10048110-72 = "Она всё ещё доступна лишь потому, что мир пока не понимает эстетику печатных машинок!"
10048110-73 = "Но однажды... Однажды, когда люди поймут её красоту, её искусство, её функцию...!"
10048110-74 = "...Все пожалеют, что не купили её прямо сейчас!"
10048110-75 = ""
10048110-77 = ""
10048110-78 = "[ns] «...Звучит знакомо...»"
10048110-79 = "Ага! Ага! Я тоже так думаю!"
10048110-80 = "Итак, Фую, какая следующая работа?"
10048110-81 = "Я должна заполучить Cutey Berry 87, пока ещё могу!"
10048110-82 = "И... тогда, и только тогда, Картель свободной торговли наконец сможет распус—"
10048110-83 = "Осторожнее. Ребёнок может услышать."
10048110-84 = "А? Чего мы шепчем?"
10048110-86 = "И так Картель свободной торговли вернулся к своей важной работе."
10048110-87 = "Кому принадлежит искусство: судьба подделок и эстетики"
