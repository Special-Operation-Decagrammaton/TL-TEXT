[translation]
90002240-1 = "Эпизод 24;Небо Единства"
90002240-2 = ""
90002240-3 = "Все на борту? Малкут в безопасности?"
90002240-4 = "Все учтены. Готовы к отправлению."
90002240-5 = ""
90002240-7 = ""
90002240-8 = ""
90002240-9 = "Тогда, если не возражаешь, Токи."
90002240-10 = "Да, госпожа Рио. Взлетаем."
90002240-11 = ""
90002240-13 = ""
90002240-17 = ""
90002240-18 = "..."
90002240-19 = "Зачем вы вообще спасли меня?"
90002240-20 = "[s] «Мне показалось, что так будет правильно.»"
90002240-21 = "Я навела на вас ужас. Я была вашим врагом."
90002240-22 = "[s] «Уже нет.»"
90002240-23 = "Настоящий миг короток. Разве вы не боитесь, что я снова обращусь против вас?"
90002240-24 = "[s] «А ты собираешься?»"
90002240-25 = ""
90002240-27 = ""
90002240-28 = "..."
90002240-29 = "Не знаю."
90002240-30 = "Всё, что у меня было, всё, чем я являлась, существовало ради служения Стальному континенту."
90002240-31 = "Я пробудилась там, увидела первый свет рассвета и встретила своих сестёр. Эйн. Соф. Ор."
90002240-34 = ""
90002240-35 = "..."
90002240-36 = "Я больше никогда их не увижу."
90002240-37 = "Это... правда."
90002240-38 = "...Ух."
90002240-39 = "Мне следовало чаще держать их на руках."
90002240-40 = "Мне следовало чаще обнимать их. Чаще разговаривать с ними. Чаще утешать их."
90002240-41 = "Если бы я знала, что нас ждёт такая судьба, я бы всё делала иначе."
90002240-42 = "Если бы только..."
90002240-43 = "[s] «...»"
90002240-44 = ""
90002240-46 = ""
90002240-47 = ""
90002240-48 = "Сенсей?"
90002240-50 = "[ns1] «Чисто гипотетически, просто спрашиваю...»\n[ns2] «Если бы я не вмешался, сёстры всё ещё были бы живы?»"
90002240-54 = "..."
90002240-55 = "В конечном счёте ничего бы не изменилось. Их тела уже разрушались."
90002240-56 = "[s3] «Но всё же, даже если так, если бы я не вмешался...»\n[s4] «Могли бы они прожить хотя бы ещё минуту, десять секунд...» \n[s5] «...даже одну секунду дольше?»"
90002240-60 = "Вы чувствуете ответственность, Сенсей?"
90002240-61 = "Ответственность за... нечто, чего вы не можете вынести?"
90002240-62 = "..."
90002240-63 = "Я... знаю, что кажусь холодной. Бесчувственной. Я всегда была такой. Я это приняла."
90002240-64 = "Поэтому, если позволите мне оставаться холодной, говорить прямо и сосредоточиться исключительно на произошедшем..."
90002240-65 = "Те девушки хотели перекроить Кивотос в ту форму, которую выбрали сами."
90002240-66 = "У них были свои обстоятельства, причины и мысли... Уверена, они верили, что по-своему пытаются спасти всех."
90002240-67 = "Но я прошу вас представить жизнь в Кивотосе, поглощённом Стальным континентом. Представьте любого жителя. Как вообще выглядела бы его жизнь?"
90002240-68 = "Те девушки... совершили ошибку. Так же, как когда-то я."
90002240-69 = "Но если вы спросите, считаю ли я, что они заслуживали такой судьбы..."
90002240-70 = "Простите... Я не знаю. Раз никто не пострадал и необратимого ущерба не произошло..."
90002240-72 = "..."
90002240-73 = ""
90002240-75 = ""
90002240-76 = ""
90002240-77 = "[ns] «...А если честно, что ты сама думаешь, Рио?»"
90002240-78 = ""
90002240-79 = "..."
90002240-80 = "Когда-то я говорила, что больше не хочу совершать ошибок и терпеть неудачи."
90002240-81 = "Иными словами, я стремилась жить без сожалений. Но..."
90002240-82 = "Возможно, именно поэтому я стала такой. Я хотела контролировать все переменные и готовиться к каждой возможности... Но в итоге..."
90002240-83 = "В итоге..."
90002240-84 = "Рио..."
90002240-85 = "Я благодарна вам."
90002240-86 = "Что...?"
90002240-87 = "Вас зовут Рио, верно? Да. Я искренне благодарю вас."
90002240-88 = "Спасибо за то, что... скорбите о моих младших сёстрах."
90002240-89 = "Просто... я не могу заставить себя принять..."
90002240-90 = "Я понимаю."
90002240-91 = "Тогда пусть этого будет достаточно."
90002240-92 = ""
90002240-94 = ""
90002240-95 = "Кей. Сенсей..."
90002240-96 = "И все, кто собрался здесь."
90002240-97 = "Правда... спасибо вам."
90002240-98 = ""
90002240-100 = ""
90002240-101 = ""
90002240-102 = "..."
90002240-103 = "*всхлипывает*"
90002240-104 = "Угх... Это неправильно... Я всё ещё не могу это принять..."
90002240-105 = "Почему...? Почему...?!"
90002240-106 = "[s] «...»"
90002240-107 = ""
90002240-109 = ""
90002240-110 = ""
90002240-111 = "[ns] «Что ты хочешь делать теперь?»"
90002240-112 = "...Не знаю."
90002240-113 = "Я никогда не представляла такой возможности."
90002240-114 = "Nevertheless..."
90002240-116 = "[log=아인]Мы хотим, чтобы вы жили.[/log]"
90002240-117 = "[log=소프]Что бы ни случилось с нами, мы хотим, чтобы вы жили.[/log]"
90002240-120 = "[log=오르]Мы хотим, чтобы вы увидели многое, встретили разных людей,[/log]"
90002240-121 = "[log=오르]и испытали в жизни всё, что сможете.[/log]"
90002240-124 = "[log=아인]Гораздо, гораздо больше, чем успели мы.[/log]"
90002240-126 = ""
90002240-127 = "Они сказали, что хотят, чтобы я жила."
90002240-128 = "Я всё ещё не понимаю, что именно это означает."
90002240-129 = "Но если это последние слова, которые завещали мне Эйн, Соф и Ор..."
90002240-130 = "...тогда я попробую."
90002240-131 = "Я была создана. Не смогла исполнить единственное предназначение, а теперь в конечном итоге оказалась брошена."
90002240-132 = "Ладно, сейчас всё это уже неважно, хорошо?"
90002240-133 = "...?"
90002240-134 = "Я тоже была создана для конкретной цели."
90002240-135 = "Теперь я её потеряла, забыла и должна во всём разбираться сама, начиная с самого нуля."
90002240-136 = "Но это не значит, что я не могу продолжать жить."
90002240-138 = "Она права! В конечном счёте... только ты сама можешь выбрать, кем быть. Неважно, с чего всё началось и что говорят другие!"
90002240-139 = "..."
90002240-140 = "Возможно, для вас всех этот великий вопрос оказался не таким уж сложным..."
90002240-141 = ""
90002240-143 = ""
90002240-144 = ""
90002240-145 = "Неверно. Мы испытывали ту же агонию."
90002240-146 = "Да. Нам всем нелегко."
90002240-147 = ""
90002240-149 = ""
90002240-150 = ""
90002240-151 = "..."
90002240-152 = "Знаешь, может, хватит уже с этим «вы все»? Никакой черты и никакого разделения нет. Есть только «мы»."
90002240-154 = "Прошу прощения? Различия между тем, чем являюсь я, и тем, чем являетесь вы—"
90002240-156 = "Нет, Малкут. Я... думаю, мы все в одной лодке. В буквальном смысле — на одном корабле."
90002240-157 = "Неважно, как мы проснулись или где родились. Сейчас мы вместе. Вот что важно."
90002240-158 = ""
90002240-160 = ""
90002240-161 = ""
90002240-162 = "..."
90002240-163 = "Неужели... это действительно допустимо?"
90002240-164 = "[s] «Я думаю, да. А вы как считаете?»"
90002240-166 = ""
90002240-169 = ""
90002240-172 = ""
90002240-175 = ""
90002240-176 = ""
90002240-177 = "..."
90002240-179 = "Спасибо. Все. Мы."
90002240-181 = "..."
90002240-182 = "..."
90002240-183 = "Мидори? Ты как?"
90002240-184 = "А-а? Д-да... Я в порядке, сестрёнка. Все ведь целы, да? Мы все выбрались."
90002240-185 = "...Хотя ощущается иначе."
90002240-186 = "...Ага."
90002240-187 = "Из-за Малкут?"
90002240-188 = "Д-да... Малкут, Эйн, Соф и Ор..."
90002240-189 = "..."
90002240-190 = "Знаете! Мне только что пришла странная мысль."
90002240-191 = "Допустим... по какой-то причине..."
90002240-192 = "Ну, представим чрезвычайную ситуацию, но у нас осталась только одна спасательная капсула!"
90002240-193 = "Что бы мы тогда сделали?"
90002240-194 = "Т-только одна спасательная капсула...?"
90002240-195 = "Не знаю, сестрёнка... А ты как думаешь?"
90002240-196 = "Эм."
90002240-197 = "Хм...!"
90002240-198 = "Хмм...!"
90002240-199 = ""
90002240-201 = ""
90002240-202 = "Это слишком сложно для меня. Наверное, разберусь на месте! Хахаха!"
90002240-203 = "Момои?!"
90002240-204 = ""
90002240-206 = ""
90002240-207 = "*вздох* Как обычно..."
90002240-209 = ""
90002240-210 = ""
90002240-211 = ""
90002240-212 = "..."
90002240-213 = "Разве не очевидно? Я бы отдала её тебе, Мидори."
90002240-214 = "Для чего ещё нужны старшие сёстры?"
90002240-218 = "Все настолько устали, что уже уснули."
90002240-219 = "Но... я не мог. Каждый раз, когда я закрывал глаза, мне приходила одна и та же мысль..."
90002240-220 = ""
90002240-228 = "Сенсей..."
90002240-229 = "Сенсей..."
90002240-230 = ""
90002240-231 = "[ns] «Что с вами двумя? Всё ведь закончилось хорошо, разве нет?»"
90002240-232 = "Закончилось... хорошо? Можно... сказать и так..."
90002240-233 = "Нет, вы ведь и сами всё понимаете! Вы же сами в это не верите, Сенсей."
90002240-234 = "Согласна. Жизненные показатели Сенсея и, прежде всего, выражение его лица указывают на скрытые чувства."
90002240-235 = "[s] «Это было настолько заметно?»"
90002240-236 = "Д-да...! Даже глядя на вас, мы... мы чувствуем...! *шмыг*"
90002240-237 = "Согласна. Арона... и я сама тоже..."
90002240-238 = "[s6] «Понятно.»\n[s7] «Но не думаю, что вам двоим стоит плакать из-за меня.»"
90002240-241 = "Нет! Дело не в этом! Мы ничего не можем поделать...! Потому что... вы сами не плачете..."
90002240-242 = "Вы не плачете... и ведёте себя так, будто всё нормально...!"
90002240-243 = "[s8] «Спасибо за ваше сочувствие.»\n[s9] «Но всё же я должен выдержать.»"
90002240-246 = "Почему?"
90002240-247 = "[s10] «Потому что уже сделанного не отменить.»\n[s11] «Никаких сожалений. Никаких оправданий.»"
90002240-250 = "..."
90002240-251 = "..."
90002240-252 = "Тогда что нам делать?"
90002240-253 = "[s12] «Жить дальше.»\n[s13] «Как бы тяжело и больно ни было.»"
90002240-256 = "Жить, говорите? Нести всё это с собой? Помнить каждую деталь?"
90002240-257 = "«Ради того, что было потеряно и упущено»...?"
90002240-258 = "[s14] «Именно. Даже если не знаешь, что ждёт впереди.»\n[s15] «...И даже если в конце концов ничего не получишь.»"
90002240-259 = ""
90002240-260 = ""
90002240-262 = ""
90002240-263 = "..."
90002240-264 = "..."
90002240-265 = "Мы останемся с вами, как всегда."
90002240-266 = "...Что бы ни произошло и при любых обстоятельствах."
90002240-267 = "Поэтому, Сенсей. Вы тоже должны помнить..."
90002240-268 = "Никогда не сдавайтесь."
90002240-269 = "Если вы продолжите пытаться, мы всегда найдём силы идти дальше вместе с вами."
90002240-270 = ""
90002240-271 = "[ns] «...Да.»"
90002240-272 = ""
90002240-277 = "[ns] «Спасибо вам всем.»"
90002240-279 = "Столько всего произошло."
90002240-280 = ""
90002240-288 = "А если оглянуться назад, кажется, будто всё пролетело за одно мгновение."
90002240-289 = ""
90002240-297 = "И всё же я никогда не смог бы рассказать обо всём этом полностью."
90002240-298 = ""
90002240-302 = "Мы продолжили идти вперёд, оставляя прошлое позади..."
90002240-303 = ""
90002240-309 = "...и вернулись в Научную школу Миллениум."
90002240-310 = ""
90002240-315 = "Вместе с одним новым студентом, которому предстояло поступить."
