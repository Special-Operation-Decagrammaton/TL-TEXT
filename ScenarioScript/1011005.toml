[translation]
1011005-1 = "Закрытая библиотека"
1011005-4 = ""
1011005-5 = ""
1011005-6 = ""
1011005-7 = "...А, Сенсей."
1011005-8 = "Что привело вас сюда? Не припомню, чтобы я специально просила вас прийти..."
1011005-9 = "Нет, конечно, я рада. Ваши визиты всегда приятны."
1011005-10 = "На самом деле особенно приятно видеть вас здесь без приглашения."
1011005-11 = "Так уж вышло, что я... весь день здесь одна."
1011005-12 = "[s1] «Ты всё это время была здесь одна?»\n[s2] «Здесь хорошо. Просторно. Мне нравится атмосфера.»"
1011005-15 = "...Фуфу, действительно."
1011005-16 = "Это частная собственность Чаепития Тринити. Сюда допускаются только его участники и их гости."
1011005-17 = "И, к слову, это не единственное здание на территории школы, предназначенное только для Чаепития."
1011005-18 = "В Чаепитии ведь состоим не только мы трое. На самом деле нас довольно много."
1011005-19 = "Как бы то ни было, как видите, здесь очень тихо."
1011005-20 = "Иногда сюда заходят несколько студентов, но обычно они приходят за учебными материалами и подобным."
1011005-21 = "Не многие читают ради удовольствия, а те, кто читает, чаще делают это в своих комнатах."
1011005-22 = "Тогда почему я читаю здесь?"
1011005-23 = "Фуфу, свою комнату я сделала слишком удобной для чтения. В последнее время я там почти не читаю."
1011005-24 = "Стоит мне попытаться, и я, скорее всего, задремлю, а книга выпадет из рук."
1011005-25 = "Так что для чтения небольшое неудобство даже полезно."
1011005-26 = "Вы сами такого от меня ещё не видели, но на самом деле я читаю настолько много, что люди часто сначала ищут меня здесь, а уже потом идут в мою комнату."
1011005-27 = "Я бы с удовольствием нашла кого-нибудь, с кем можно делиться книгами..."
1011005-28 = "...но даже для такого распространённого увлечения собрать людей вместе бывает невероятно трудно."
1011005-29 = "А если бы я привела сюда своих знакомых, мне неизбежно казалось бы, что я их обременяю."
1011005-30 = "Ещё одна сложность — моё положение. Трудно свободно обсуждать книги, когда один из собеседников стоит выше другого по статусу."
1011005-31 = "Если я выскажу мнение о книге перед обычными учениками, они могут почувствовать, что обязаны со мной согласиться."
1011005-32 = "Поэтому я так и не решилась воплотить эту идею. Я часто об этом думала, но каждый раз останавливалась."
1011005-33 = "Мне хотелось бы делиться мыслями через книги, не доставляя никому неудобств."
1011005-34 = "[s3] «Я всё равно думаю, что попробовать стоит.»\n[s4] «А ты вообще когда-нибудь пыталась?»"
1011005-37 = "...Я понимаю, к чему вы ведёте."
1011005-38 = "Но не беспокойтесь. Моя жизнь вовсе не одинока и ничем не обделена."
1011005-39 = "Чтение — довольно уединённое увлечение, но с другими учениками у меня хорошие отношения."
1011005-40 = ""
1011005-42 = ""
1011005-43 = "И всё же... Эм..."
1011005-44 = "Возможно, когда-нибудь вы согласитесь отправиться со мной в путешествие по страницам книги."
1011005-45 = "Нам обоим должно понравиться. По крайней мере, мне так кажется."
1011005-46 = "Мне не пришлось бы переживать, что я куда-то вас тащу или навязываю собственное мнение."
1011005-47 = "...Уже звучит довольно жадно с моей стороны. Но что вы скажете?"
1011005-48 = "Не часто, разумеется, лишь время от времени... Но я была бы рада иногда видеть вас своим партнёром по чтению."
1011005-49 = "[s5] «С удовольствием.»\n[s6] «Я только за.»"
1011005-52 = "...Фуфу. Замечательно."
1011005-53 = "Каждый раз, когда мы встречаемся, вы находите новый способ сделать меня счастливой."
1011005-54 = "Теперь вопрос: хотите сами выбрать книгу или предпочитаете, чтобы я что-нибудь посоветовала?"
1011005-55 = "Здесь есть как минимум по одному экземпляру каждой книги, известной школе."
1011005-56 = "Если только вы не ищете какой-нибудь древний том — тогда стоит обратиться в старую библиотеку. Всё остальное можно найти здесь."
1011005-57 = "А если вам всё-таки нужно что-то из старой библиотеки, я могу им позвонить."
1011005-58 = ""
1011005-60 = ""
1011005-61 = ""
1011005-62 = "...Это шутка. Как я уже говорила, я не стану так злоупотреблять полномочиями. Да и глава Библиотечного комитета нашей школы мне бы не позволила."
1011005-63 = "Но я бы хотела порекомендовать вам книгу. Даже несколько, если хотите взглянуть на список, который я подготовила."
1011005-64 = "...Прошу. Выбирайте любую."
1011005-65 = ""
1011005-68 = "М-м, м-м. Понятно. Значит, вы выбираете... эту."
1011005-69 = ""
1011005-71 = ""
1011005-72 = "...Ах."
1011005-73 = "[s7] «...Сейя?»\n[s8] «Что случилось?»"
1011005-76 = "Н-ничего. Просто... небольшая проблема."
1011005-77 = "Этой книги сейчас здесь нет. Её уже кто-то взял."
1011005-78 = "И этот кто-то — я. Книга лежит у меня в комнате."
1011005-79 = "...Почему вы так на меня смотрите? Не верите?"
1011005-80 = "Я сказала, что РЕДКО читаю книги в своей комнате, а не что НИКОГДА этого не делаю. Обещаю, она прямо сейчас там."
1011005-81 = "И по такому счастливому совпадению..."
1011005-82 = ""
1011005-84 = ""
1011005-85 = "Похоже, нам придётся вернуться в мою комнату, чтобы я могла отдать её вам."
1011005-86 = "Повторюсь: это чистое совпадение. Удачное, восхитительное совпадение."
1011005-87 = "И как удачно, что именно сегодня мне пришло в голову взять ещё книг..."
1011005-88 = ""
1011005-90 = ""
1011005-91 = ""
1011005-92 = ""
1011005-94 = "[ns9] «...Сейя?»\n[ns10] «Сколько книг ты вообще взяла?»"
1011005-97 = "Фуфу, скажем так: это совпадение было не единственной удачей, которая могла здесь случиться."
1011005-98 = "Всегда есть шанс, что подобное повторится. К таким вещам нужно быть готовой."
1011005-99 = "Но, кажется, я всё же набрала слишком много книг, чтобы унести их самой."
1011005-100 = "...Сенсей?"
1011005-101 = ""
1011005-103 = ""
1011005-105 = ""
1011005-106 = "Не могли бы вы мне помочь?"
1011005-108 = "После этого я отнёс книги Сейи в её комнату."
1011005-109 = "«Рекомендованная книга» от Сейи лежала на столе, словно ждала меня."
