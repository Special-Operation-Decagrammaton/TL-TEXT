[translation]
2300720-1 = "Неизвестная девушка"
2300720-2 = "Я возвращался после работы в Тринити..."
2300720-3 = "Ох ты."
2300720-4 = "Какое совпадение — встретить тебя здесь."
2300720-5 = "[s1] «Я узнаю этот голос... Ханако?»\n[s2] Повернуться в сторону голоса."
2300720-8 = ""
2300720-9 = "Ты уже возвращаешься? Вот мне повезло! Задержись я ещё немного — было бы слишком поздно."
2300720-10 = "Хм? Что меня задержало? О, ничего серьёзного..."
2300720-11 = ""
2300720-13 = ""
2300720-14 = ""
2300720-16 = "Я просто забирала обратно конфискованную книгу."
2300720-17 = "[s3] «П-Погоди, эта книга —?!»\n[s4] «Ты сказала „конфискованную“?!»"
2300720-20 = "Хи-хи... Хм? Что такое, Сенсей? Ты весь покраснел. ♡"
2300720-21 = "А, поняла! Хочешь почитать мою книгу? Узнать, соответствует ли содержание обложке? Добраться до неожиданного сюжетного поворота?"
2300720-22 = "Не волнуйся. Я прямо сейчас почитаю её тебе вслух."
2300720-23 = "И буду читать особенно громко, чтобы ты точно всё расслышал."
2300720-24 = "А?"
2300720-25 = "Ты не любишь аудиокниги? И что ты там говорил о приличиях в общественном месте?"
2300720-26 = "[s5] «Ты знала, что я буду здесь?»\n[s6] «Ханако, ты специально надо мной издеваешься?»"
2300720-29 = "А?"
2300720-30 = "Хм-м-м. Думаешь, я над тобой издеваюсь? ♡"
2300720-31 = "Вообще, я думаю о многом. В том числе о том, как Сенсей отреагирует на то, что я делаю."
2300720-32 = "Наверное, я думаю об этом так часто, что это уже можно назвать привычкой. Но не сегодня. Сегодня я совсем об этом не думала."
2300720-33 = ""
2300720-35 = ""
2300720-36 = "Хи-хи."
2300720-37 = "Однако я прощу твои беспочвенные обвинения."
2300720-38 = "Ты ведь сказал, что будешь терпеть мои шалости, так что справедливо, если и я буду терпеть твои."
2300720-39 = "Я всё-таки знакома с правилами приличия, знаешь ли."
2300720-40 = "А сейчас я хотела спросить: проводишь меня до автобуса?"
2300720-41 = "Ты не против?"
2300720-42 = "Хи-хи. Значит, решено."
2300720-43 = "Начнём?"
2300720-44 = ""
2300720-46 = ""
2300720-48 = "Я проводил Ханако до автобусной остановки возле Тринити."
2300720-49 = "По дороге мы приятно поболтали, и на этот раз ничего настолько скандального не произошло."
2300720-51 = "Мы пришли."
2300720-52 = "М-м. Было приятно, хотя и немного скучновато."
2300720-53 = "Надеюсь, Я тебя не утомляю, Сенсей."
2300720-54 = "Может, ты надеялся, что наша небольшая прогулка будет более... захватывающей?"
2300720-55 = "Как мне не стыдно. Надо было лучше почувствовать настроение."
2300720-56 = "[s7] «Стыда у тебя и правда нет, Ханако. Но нет, всё хорошо.»\n[s8] «Жаль, что не все наши разговоры такие спокойные...»"
2300720-59 = "Хи-хи... Понятно."
2300720-60 = "Кстати, Сенсей. Ты точно не хочешь узнать, что в моей книге?"
2300720-61 = "Я могу догадаться, что ты думаешь об обложке."
2300720-62 = "Но внутри всё может оказаться совсем иначе."
2300720-63 = "Может, это масштабный космический роман."
2300720-64 = "А может, дневник, список моих переживаний или даже манифест Симпозиума купальников."
2300720-65 = "Или что-нибудь очень искреннее и душевное."
2300720-66 = ""
2300720-69 = "[ns9] «Тогда это не моё дело.»\n[ns10] «Душевное спокойствие мне дороже знания всего на свете.»"
2300720-72 = ""
2300720-74 = ""
2300720-75 = "Ах."
2300720-76 = "Стоило догадаться, что такими вещами тебя не проймёшь, Сенсей."
2300720-77 = "Не знаю, как я могла забыть. В этом отношении ты всегда как открытая книга."
2300720-78 = "Хи-хи."
2300720-79 = "Ну что же. На сегодня хватит."
2300720-80 = "Скажу только одно: я не врала, когда сказала, что наша встреча была случайностью."
2300720-81 = "Так что технически я не сделала ничего плохого."
2300720-82 = "Ага."
2300720-83 = "Похоже, придётся наверстать упущенное в следующий раз. ♡"
2300720-85 = "Я сел на автобус домой. Ханако проводила меня сияющей улыбкой."
2300720-86 = ""
