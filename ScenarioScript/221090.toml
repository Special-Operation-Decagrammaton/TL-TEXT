[translation]
221090-1 = "Episode 9: Division of Roles"
221090-2 = "(The next day --)"
221090-3 = "(Word that Sammy's departure had been decided quickly spread throughout the academy.)"
221090-5 = "Hey, did you hear? They are going to send Sammy away."
221090-6 = "Huh? Has the island even reached a conclusion yet?"
221090-7 = "Well... the General Student Council President came by earlier, right?"
221090-8 = "Apparently, she checked on Sammy and said, \"Have her treated on land.\""
221090-9 = "Does the General Student Council President really stick her nose into things like that...?"
221090-11 = "(Some students were worried about Sammy's condition --)"
221090-13 = "Since the General Student Council President went that far, Sammy must be in really bad shape, right?"
221090-14 = "It will be lonely being apart... but it is for Sammy's own good."
221090-15 = "I just hope she gets properly checked out and feels better..."
221090-17 = "(Meanwhile, other students harbored dissatisfaction with the General Student Council President's decision.)"
221090-19 = "Just because she is the General Student Council President does not mean she can be so tyrannical. #nWe know more about Sammy than she does."
221090-20 = "If Sammy's environment changes so suddenly, it is going to stress her out so much!"
221090-21 = "Besides, there were already things the General Student Council President decided that I could never agree with. #nI let those slide, but I cannot let this one go."
221090-23 = "(However, no student dared to defy the decision itself. Each of them decided to start preparing their farewells.)"
221090-30 = "...Um, what is this?"
221090-31 = "It is a handmade toy brought by the engineering department!"
221090-32 = "They wanted to give Sammy a handmade ball as a farewell gift..."
221090-33 = "Is there any way we can bring this along too?"
221090-34 = "I understand how you feel, but a whole container's worth..."
221090-35 = "Are you planning to build a ball pit?"
221090-36 = "I brought some too!"
221090-37 = "...And this?"
221090-38 = "Mackerel and steamed tenderloin stew! Sammy used to love this."
221090-39 = "You probably cannot get this easily on land, so I made a bunch of it."
221090-40 = "I want to feed it to her while she is still on the ship... is that okay?"
221090-41 = "Look, even if it is her favorite, this is way too much."
221090-42 = "There is no way she can eat this much!"
221090-44 = "(However --)"
221090-48 = "Are these gifts for Sammy?"
221090-49 = "Th-Th-Th-The General Student Council President!?"
221090-50 = "Fufu, they are all wonderful. #nPlease make sure to give them to her so she will not be lonely on land."
221090-51 = "I am sure Sammy will be delighted."
221090-56 = "Or rather... maybe we do not need this much..."
221090-57 = "Besides, Sammy only cares about her favorite toys..."
221090-58 = "I will unravel this ball and use the string for something else."
221090-59 = "...She is leaving the ship because she is sick, so overeating is probably not a good idea."
221090-60 = "Maybe I should just have someone else eat this."
221090-61 = "W-Wait a minute! #nWe did not say we did not want any of it --"
221090-69 = "..."
221090-75 = "Uwah..."
221090-76 = "Fufu. #nIt is clear how deeply you all care about Sammy."
221090-77 = "So as not to betray those feelings, the General Student Council must also do its best to prepare for her reception."
221090-78 = "...Y-Yes."
221090-80 = "(The Odyssey students cast dissatisfied glances at the General Student Council President.)"
221090-81 = "(Even so, the General Student Council President simply maintained her smile.)"
221090-85 = "(As the sun set and they tried to return from Odyssey to Schale --)"
221090-89 = "The Schale Sensei is leaving the ship!"
221090-90 = "[ns] \"I will never get used to hearing that announcement...\""
221090-93 = "We meet again, [USERNAME] Sensei."
221090-94 = "[s1] \"Hey.\"\n[s2] \"Good evening.\""
221090-97 = "Good evening. Thank you for your hard work so late."
221090-98 = "Are you heading back to Schale?"
221090-99 = "[s] \"Yeah. Are you heading back too?\""
221090-100 = "Yes. My work at Odyssey has settled down, so I thought I would get back to my routine duties."
221090-101 = "[s] \"You never run out of hardships...\""
221090-102 = "Fufu, aren't we in the same boat?"
221090-103 = "You have overtime waiting for you too, Sensei, don't you?"
221090-104 = "[s3] \"Well... I suppose.\"\n[s4] \"You see right through everything, don't you?\""
221090-107 = "Schale and the General Student Council share many duties, after all."
221090-111 = "If you do not mind, may I walk with you to the station?"
221090-112 = "There was something I wanted to talk about anyway --"
221090-113 = "And I think the night roads of Kivotos are far too dangerous for Sensei to walk alone."
221090-114 = "[s] \"I am not that fragile!\""
221090-115 = "Fufu, it was a joke."
221090-120 = "[ns] \"...You actually make jokes, unexpectedly enough.\""
221090-121 = "Of course. #nIt is effective for closing the distance between people."
221090-122 = "In the duties of the General Student Council, which involve diverse and conflicting interests, #nit is essential to switch communication styles depending on the time and situation."
221090-123 = "There are times when I play the part of a dim, harmless person --"
221090-124 = "And there are times when I willingly play the villain, fully aware that I will be disliked."
221090-125 = "[s] \"...You figured it out, of course.\""
221090-126 = "Unless someone is exceptionally dense, wouldn't anyone figure it out?"
221090-127 = "Regarding this matter, the students of Odyssey probably hold some degree of lingering resentment."
221090-128 = "Their gazes were so cold that pretending to be oblivious was quite a task."
221090-129 = "[s5] \"It is tough being disliked by anyone.\"\n[s6] \"I suppose I should have taken the blame instead.\""
221090-132 = "No. This is not a matter that an adult trusted by the students should shoulder."
221090-133 = "They want to resent someone yet have no one to direct it at; there is no telling where those pent-up emotions might explode."
221090-134 = "So I am actually glad that I could be the one disliked by the Odyssey students."
221090-138 = "...That was not enough. I need to elaborate. #nIt is not as though I enjoy being disliked for no reason."
221090-139 = "Ahem."
221090-140 = "As I mentioned before, to the students of Odyssey, the General Student Council President is the very embodiment of the unreasonable outside world."
221090-141 = "Because Odyssey students spend most of their school lives at sea, #nthey are accustomed to submitting to 'authority' that shoulders the responsibility of their choices."
221090-142 = "A life of submitting to authority means entrusting judgments to others to lighten the burden of thought."
221090-143 = "That is necessary during dangerous voyages, but once the waves calm and they finally dock their ships in port, #neach individual must confront the problems they swept under the rug."
221090-144 = "After all, our lives continue even after the voyage ends."
221090-145 = "...Putting that aside. #nThe Odyssey students, who have always accepted submission to authority, #nare now questioning me, the head of the General Student Council, and expressing dissatisfaction."
221090-146 = "It started as an issue over how to handle a cat, but if this serves as an opportunity to cast a doubtful eye on the academy's taboos #nand the authority that enforces them --"
221090-147 = "Don't you think it will play a part in improving the deeply rooted customs of Odyssey?"
221090-148 = "[s] \"Were you aiming for that from the start?\""
221090-149 = "Who knows? #nIt began simply out of a small curiosity."
221090-150 = "-- But I suppose I felt like being a little mischievous."
221090-151 = "The captain who should bear the responsibility was bound by that role, failing to recognize her own true feelings."
221090-152 = "It felt so frustrating that I just had to give her a little push."
221090-153 = "[s] \"The more sincere a person is, the harder it is to separate work from their personal life.\""
221090-157 = "[ns7] \"Don't you think so?\"\n[ns8] \"Are there times when you feel bound by your role?\""
221090-160 = "I, of course --"
221090-164 = "..."
221090-165 = "...Come to think of it, I am in no position to talk."
221090-166 = "I am supposed to be watching over the daily lives of the students every day... yet #nI cannot imagine what it would be like to spend everyday life not as the General Student Council President, but as an ordinary student."
221090-167 = "Is it because I am too busy with work?"
221090-168 = "[s9] \"You do not necessarily have to cling to your current life.\"\n[s10] \"After all, the future can be changed however you wish.\""
221090-171 = "Yes. #n The world is constantly changing, and even a peaceful daily life will eventually come to an end."
221090-172 = "That applies to human lives... and cat lives alike."
221090-173 = "Perhaps a Kivotos where I do not have to spend my days as the General Student Council President #nwill arrive someday."
221090-174 = "When that time comes... I will think about what I want to do for myself."
221090-175 = "It is just... right now, I have far too much work..."
221090-176 = "[s] \"There is no need to rush, is there?\""
221090-177 = "...Sensei."
221090-182 = "If I find what I truly want to do from the bottom of my heart --"
221090-183 = "-- Will you support me?"
221090-184 = "[s11] \"Of course.\"\n[s12] \"That is Sensei's duty, after all.\""
221090-187 = "Fufu, it's a promise."
221090-192 = "We are at the station already."
221090-193 = "Well then, safe travels."
221090-194 = "I suppose the next time we meet will be the day we send Sammy off the ship."
221090-195 = "It pains me, but I am counting on you."
221090-197 = "(After watching the General Student Council President step up onto the platform, I returned to Schale.)"
221090-199 = "Next Episode: Chase on the Water"
