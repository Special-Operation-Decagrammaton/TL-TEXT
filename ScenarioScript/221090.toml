#[!][Data: "20/09"]
[translation]
221090-1 = "Episódio 09;Divisão de Papéis"
221090-2 = "（No dia seguinte――）"
221090-3 = "（A notícia de que o Sammy seria desembarcado se espalhou pelos conveses da Odisseia num piscar de olhos.）"
221090-4 = ""
221090-5 = "Ei, você já tá sabendo? Parece que vão mesmo tirar o Sammy do navio!"
221090-6 = "O quê?! Mas o conselho Island nem tinha batido o martelo ainda!"
221090-7 = "Sabe aquela visita que a Presidente do Conselho Estudantil Federal fez aqui esses dias?"
221090-8 = "Dizem que ela bateu o olho no estado do Sammy e ordenou que ele fosse 'imediatamente transferido para tratamento em terra firme'!"
221090-9 = "Desde quando a Presidente do Conselho Estudantil Federal se mete até no bicho de estimação dos outros...?"
221090-11 = "（Algumas alunas se compadeceram com a saúde debilitada do gatinho――）"
221090-12 = ""
221090-13 = "Pra Presidente do Conselho Estudantil Federal intervir pessoalmente desse jeito, a saúde do Sammy deve estar por um fio mesmo..."
221090-14 = "Dá um aperto enorme no peito ter que dizer adeus... mas é para o bem dele, né?"
221090-15 = "Se ele for bem tratado em uma clínica especializada e se recuperar, já vai valer a pena..."
221090-17 = "（Outras, porém, fervilhavam de indignação contra a imposição de fora）"
221090-18 = ""
221090-19 = "Mesmo ela sendo a autoridade máxima, isso é puro autoritarismo tirânico!#nNinguém conhece o Sammy melhor do que a gente!"
221090-20 = "Arrancar o bichinho daqui do nada e jogar em terra vai causar um estresse mortal nele!"
221090-21 = "Aliás, já faz tempo que várias ordens do Conselho Estudantil Federal descem quadrado na minha garganta.#nAté agora a gente engoliu calada, mas dessa vez passaram dos limites!"
221090-23 = "（Contudo, nenhuma aluna ousou desafiar a ordem abertamente. Assim, cada uma começou a preparar sua despedida à sua própria maneira）"
221090-24 = ""
221090-25 = ""
221090-26 = ""
221090-27 = ""
221090-28 = ""
221090-29 = ""
221090-30 = "......Com licença, o que significa tudo isso aqui?"
221090-31 = "São brinquedinhos feitos pelas meninas do setor de engenharia naval!"
221090-32 = "Elas queriam presentear o Sammy com bolinhas trançadas à mão antes da partida..."
221090-33 = "Será que daria para mandar tudo junto na bagagem dele?"
221090-34 = "Eu entendo o carinho das meninas, mas... um contêiner inteiro lotado de bolinhas de corda...?"
221090-35 = "Vocês estão querendo montar uma piscina de bolinhas pro gato por acaso?"
221090-36 = "Eu também trouxe lembrancinhas pra ele!"
221090-37 = "......E o que seria isso aí nessa panela?"
221090-38 = "Ensopado de cavala com peito de frango cozido no vapor! É a comidinha favorita do Sammy!"
221090-39 = "Em terra firme ele não vai achar um peixe fresco desse jeito com facilidade, então cozinhei um caldeirão cheio pra ele comer até cansar."
221090-40 = "Queria servir pra ele enquanto ele ainda tá a bordo... posso?"
221090-41 = "Gente do céu, mesmo sendo o prato favorito dele, isso aqui dá pra alimentar uma companhia inteira!"
221090-42 = "Não tem a menor chance de um gato doente comer tudo isso!"
221090-44 = "（No entanto――）"
221090-47 = ""
221090-48 = "Vejo que são presentes de despedida para o pequeno Sammy."
221090-49 = "P-P-Presidente do Conselho Estudantil Federal?!"
221090-50 = "Fufufu, que gestos encantadores.#nPor favor, façam questão de entregar tudo a ele, para que não se sinta solitário em terra."
221090-51 = "Tenho certeza absoluta de que o Sammy ficará radiante de alegria."
221090-52 = ""
221090-55 = ""
221090-56 = "Pensando bem... acho que ele nem precisa de tanta bolinha assim..."
221090-57 = "Até porque o Sammy só liga pra aquele brinquedo velho dele de estimação..."
221090-58 = "Vou destrançar essas cordas e reaproveitar os cabos nos guinchos do porto."
221090-59 = "......E como ele tá dodói da barriga, comer esse ensopado pesado pode piorar a digestão dele, né?"
221090-60 = "Acho melhor dar isso pras alunas do rancho comerem no almoço."
221090-61 = "E-Esperem aí, meninas!#nEu não disse que era pra descartar tudo desse jeito――"
221090-62 = ""
221090-64 = ""
221090-65 = ""
221090-66 = ""
221090-67 = ""
221090-68 = ""
221090-69 = "......"
221090-70 = ""
221090-72 = ""
221090-74 = ""
221090-75 = "Ai, que vergonha alheia......"
221090-76 = "Fufufu.#nÉ comovente ver o quanto todas vocês nutrem um amor genuíno pelo Sammy."
221090-77 = "Para não trair tanta afeição, o Conselho Estudantil Federal se empenhará ao máximo na acolhida dele."
221090-78 = "......S-Sim, senhora..."
221090-80 = "（As estudantes da Odisseia lançavam olhares gélidos e ressentidos para a Presidente do Conselho Estudantil Federal）"
221090-81 = "（Ainda assim, a Presidente mantinha um sorriso sereno e inabalável no rosto）"
221090-82 = ""
221090-85 = "（Ao cair da tarde, quando me preparava para deixar a Odisseia e retornar à Schale――）"
221090-89 = "Atenção: o Sensei da Schale desembarca neste momento!"
221090-90 = "[ns] \"Por mais que eu ouça esses avisos pelos alto-falantes, nunca me acostumo......\""
221090-92 = ""
221090-93 = "Nos encontramos novamente, Sensei."
221090-94 = "[s1] \"Olá.\"\n[s2] \"Boa noite.\""
221090-97 = "Boa noite. O dia foi puxado, agradeço por todo o seu empenho."
221090-98 = "Está a caminho da Schale?"
221090-99 = "[s] \"Sim. Você também já está voltando?\""
221090-100 = "Sim. Os trâmites aqui na Odisseia foram encaminhados, então retornarei aos meus afazeres de rotina no gabinete."
221090-101 = "[s] \"O seu trabalho parece não ter fim nunca......\""
221090-102 = "Fufufu, creio que essa constatação se aplique a nós dois, não acha?"
221090-103 = "Imagino que o Sensei também tenha uma longa rodada de serão pela frente esta noite."
221090-104 = "[s3] \"Bem... você me pegou no flagra.\"\n[s4] \"Você enxerga através de mim como se fosse vidro.\""
221090-107 = "A Schale e o Conselho Estudantil Federal compartilham uma infinidade de processos burocráticos afinal."
221090-108 = ""
221090-110 = ""
221090-111 = "Se não se importar, gostaria de caminhar comigo até a estação?"
221090-112 = "Eu gostaria muito de conversar um pouco a sós com você――"
221090-113 = "E as ruas noturnas de Kivotos são perigosas demais para um Sensei andar desacompanhado."
221090-114 = "[s] \"Ei, eu não sou indefeso a esse ponto!\""
221090-115 = "Fufufu, estou apenas brincando."
221090-119 = ""
221090-120 = "[ns] \"......Até que você tem um bom senso de humor quando quer.\""
221090-121 = "Mas é claro.#nO humor é uma ferramenta indispensável para estreitar os laços entre as pessoas."
221090-122 = "Na condução dos assuntos do Conselho Estudantil Federal, cercada por interesses tão divergentes,#nsaber alternar o tom da comunicação conforme a ocasião é vital."
221090-123 = "Às vezes, encarno a figura de uma líder inofensiva e distraída――"
221090-124 = "E em outras, assumo deliberadamente o papel de vilã odiosa, perfeitamente consciente do rancor alheio."
221090-125 = "[s] \"......Você percebeu o clima pesado com as alunas lá dentro, né?\""
221090-126 = "A não ser que fosse a pessoa mais cega e insensível do mundo, qualquer um notaria, não acha?"
221090-127 = "Com essa resolução repentina, todas as estudantes da Odisseia guardaram uma mágoa profunda no peito."
221090-128 = "Os olhares gélidos que recebi foram tão cortantes que precisei suar a camisa para fingir que não era comigo."
221090-129 = "[s5] \"Ser odiada de propósito é doloroso demais para qualquer um.\"\n[s6] \"Talvez tivesse sido melhor se eu tivesse assumido essa bronca.\""
221090-132 = "De modo algum. Esta é uma carga que o [ruby=Sensei da Schale]adulto em quem[/ruby] todos confiam jamais deveria carregar."
221090-133 = "Querer odiar alguém, mas não poder fazê-lo por admiração... sentimentos sem rumo explodem de formas imprevisíveis e destrutivas."
221090-134 = "Por essa razão, sinto-me genuinamente aliviada por ter sido o alvo do ressentimento das alunas da Odisseia."
221090-135 = ""
221090-137 = ""
221090-138 = "......Faltou clareza nas minhas palavras, preciso me corrigir.#nNão quis dizer que tenho vocação masoquista para ser odiada sem motivo."
221090-139 = "Cof, cof."
221090-140 = "Como mencionei antes, para as garotas da Odisseia, a Presidente do Conselho Estudantil Federal representa o ápice da arbitrariedade externa."
221090-141 = "Como passam a maior parte da juventude navegando isoladas em alto-mar,#nelas se habituaram a se submeter cegamente a uma 'Autoridade' que assume a culpa de cada escolha por elas."
221090-142 = "Viver obedecendo a uma autoridade absoluta nada mais é do que terceirizar as decisões para fugir da angústia de pensar com a própria cabeça."
221090-143 = "Durante uma tempestade perigosa, isso é necessário; mas quando o mar se acalma e o navio atraca no porto,#ncada indivíduo é obrigado a encarar a sujeira que varreu para debaixo do tapete."
221090-144 = "Pois a vida real continua mesmo depois que a viagem termina."
221090-145 = "......Mas deixando as teorias de lado.#nAs mesmas estudantes que sempre aceitaram ordens sem pestanejar agora sentem revolta e questionam a líder máxima de Kivotos."
221090-146 = "Tudo começou por causa do destino de um gato doente, mas se isso servir como fagulha para que comecem a questionar os tabus e a autoridade que os impõe――"
221090-147 = "Não acha que terá sido um passo gigantesco para reformar os velhos dogmas fossilizados da Odisseia?"
221090-148 = "[s] \"Você já tinha planejado tudo isso desde o comecinho?\""
221090-149 = "Ora... quem sabe?#nTalvez tudo não tenha passado de mera curiosidade passageira."
221090-150 = "――Embora eu confesse que senti uma pontinha de vontade de fazer uma pequena provocação."
221090-151 = "A Capitã que deveria assumir a responsabilidade estava tão aprisionada ao próprio cargo que não conseguia enxergar os próprios sentimentos."
221090-152 = "Fiquei tão angustiada vendo aquele nó em seu peito que acabei dando um empurrãozinho."
221090-153 = "[s] \"Quanto mais dedicada é a pessoa, mais difícil separar o dever do coração, né?\""
221090-154 = ""
221090-157 = "[ns7] \"Não concorda comigo?\"\n[ns8] \"Você também se sente aprisionada ao seu próprio papel às vezes?\""
221090-160 = "Eu, bem... com certeza――"
221090-161 = ""
221090-163 = ""
221090-164 = "......"
221090-165 = "......Pensando bem, não tenho moral alguma para apontar o dedo para os outros."
221090-166 = "Passo todos os dias zelando pela vida de milhares de alunas...#nmas sou completamente incapaz de imaginar como seria a minha rotina se eu fosse apenas uma estudante comum, e não a Presidente."
221090-167 = "Será por estar sempre atolada em trabalho?"
221090-168 = "[s9] \"Você não precisa se acorrentar eternamente a essa rotina.\"\n[s10] \"O futuro sempre pode ser moldado conforme os seus verdadeiros desejos.\""
221090-171 = "Sim.#nO mundo se transforma continuamente, e todo cotidiano pacífico um dia chega ao seu desfecho."
221090-172 = "Isso vale――tanto para a vida das pessoas quanto para a vida de um pequeno gato."
221090-173 = "Quem sabe um dia chegue o momento em que eu não precise mais carregar o fardo de ser a Presidente de Kivotos."
221090-174 = "Quando esse dia raiar... tentarei descobrir o que [ruby=・   ・   ・]eu[/ruby] realmente desejo fazer."
221090-175 = "Embora... no presente momento, haja trabalho demais me esperando..."
221090-176 = "[s] \"Não há necessidade de pressa, você tem todo o tempo do mundo.\""
221090-177 = "......Sensei."
221090-178 = ""
221090-180 = ""
221090-181 = ""
221090-182 = "Se um dia [ruby=・   ・]eu[/ruby] finalmente encontrar algo que queira realizar do fundo do meu coração――"
221090-183 = "――Você torcerá por mim?"
221090-184 = "[s11] \"Com certeza absoluta.\"\n[s12] \"Afinal de contas, esse é o dever mais sagrado de um professor.\""
221090-187 = "Fufufu... é uma promessa solene, então."
221090-191 = ""
221090-192 = "Olha só, já chegamos à estação."
221090-193 = "Pois bem, tenha uma ótima viagem de volta."
221090-194 = "Nosso próximo encontro será no dia marcado para o desembarque do Sammy."
221090-195 = "Embora me aperte o coração, conto com o seu apoio para concluirmos esta etapa."
221090-197 = "（Fiquei observando a silhueta da Presidente do Conselho Estudantil Federal subir até a plataforma do trem antes de voltar para a Schale.）"
221090-199 = "Próximo Episódio;Pega-Pega a Bordo"
