[translation]
1014602-1 = "Великолепное лето председателя"
1014602-2 = "[log]Что вы думаете о[/log]"
1014602-4 = "[log]председателе Ханума Макото?[/log]"
1014602-6 = ""
1014602-7 = "Не знаю. Это кто вообще?"
1014602-8 = "Председатель? С каких пор у нас в академии есть парламент?"
1014602-10 = "[log]Что вы думаете о[/log]"
1014602-12 = "[log]Обществе Пандемониума?[/log]"
1014602-14 = ""
1014602-15 = "«Общество Пандемониума»? А это что?"
1014602-16 = "Ну, тот клуб. Где Чиаки и Ибуки."
1014602-17 = "А, точно-точно. Совсем про него забыла."
1014602-18 = "Ладно, а зачем это всё? Вы нас снимаете?"
1014602-19 = ""
1014602-22 = ""
1014602-23 = ""
1014602-24 = "...Ну и что вы скажете?"
1014602-25 = "[s1] «Эм... Не унывай?»\n[s2] «Знаю, иногда жизнь бывает трудной, Макото»."
1014602-28 = "Хм...? Что вы такое..."
1014602-29 = "А. Сенсей, произошло недоразумение."
1014602-30 = "Ки-хе-хе! Их ответы в точности соответствуют замыслу великой Макото!"
1014602-31 = "Результаты говорят сами за себя! Мракобесие — основа политики!"
1014602-32 = "Чем меньше студенты интересуются происходящим, тем сильнее моя власть и власть Общества Пандемониума!"
1014602-33 = "...Хотя, похоже, я слишком хороша в своём деле."
1014602-34 = "Подумать только! Студенты забыли не только моё имя, но и само существование Общества Пандемониума и поста председателя."
1014602-35 = "Ах! Проклятие гениальности, которой нет равных!"
1014602-36 = "Поэтому у меня есть план, Сенсей."
1014602-37 = "Пусть нынешнее положение меня и устраивает, но студенты явно не проявляют должного уважения к нам."
1014602-38 = "Я обязана восстановить честь Общества Пандемониума и добрую славу моего имени, Ханума Макото!"
1014602-39 = "Для этого я намерена улучшить свой образ в глазах общественности!"
1014602-40 = "И начну с внешности!"
1014602-41 = "[s3] «Так вот для чего нужен купальник!»\n[s4] «Теперь всё понятно!»"
1014602-44 = "Вы меня понимаете, Сенсей! Я знала, что объяснять не придётся."
1014602-45 = "Да. Этот купальник — именно то, что мне нужно."
1014602-46 = "Это шедевр. Я наняла знаменитого дизайнера, который использовал для него только лучшие ткани."
1014602-47 = "Ну как? Разве я не выгляжу одновременно дружелюбной, харизматичной и недосягаемой благодаря своему непревзойдённому изяществу?"
1014602-48 = "...Да. Деньги потрачены не зря."
1014602-49 = "Настоящая проблема в том, что делать дальше."
1014602-50 = "Как мне непринуждённо предстать в новом образе перед всеми студентами?"
1014602-51 = "Чтобы добиться нужного эффекта, всё должно выглядеть совершенно случайно! Нелепо же просто так разгуливать по кампусу в таком виде!"
1014602-52 = "Я должна появиться изящно, будто сама судьба свела нас вместе! Чтобы все замерли и подумали: «Вот это да! Кто эта невероятно крутая особа?»"
1014602-53 = "[s5] «...Может, сходишь на урок плавания?»\n[s6] «Или отправишься в бассейн либо на пляж...?»"
1014602-56 = "Ни в коем случае!"
1014602-57 = "Тогда все узнают мой страшнейший секрет: я не умею плавать!"
1014602-58 = ""
1014602-60 = ""
1014602-61 = "Ах!! Я раскрыла вам свою самую сокровенную тайну!"
1014602-62 = "...Гх. Ваши ловкие наводящие вопросы — страшная сила. С вами нельзя терять бдительность."
1014602-63 = "Вы тут ни при чём. Это я позволила себе утратить былую остроту."
1014602-64 = "Раз уж я проговорилась, придётся всё рассказать."
1014602-65 = "В этом мире у меня всего две слабости. Плавание — одна из них."
1014602-66 = "[s7] «...Тогда хочешь научиться?»\n[s8] «Ты просишь научить тебя?»"
1014602-69 = "Хм? Вовсе нет."
1014602-70 = "У меня нет ни малейшего желания учиться плавать."
1014602-71 = "...К тому же сама идея плавания полна противоречий."
1014602-72 = "Люди не могут дышать под водой! Следовательно, заплывать на глубину чрезвычайно опасно! Даже смертельно!"
1014602-73 = "Как вообще можно получать удовольствие, когда от каждого движения зависит жизнь?!"
1014602-74 = "Именно поэтому я против того, чтобы кто-то видел меня плавающей!"
1014602-75 = "Мне нужен эффектный и элегантный способ представить свой новый образ, не связанный с плаванием!"
1014602-76 = "И я уверена, что Сенсей из Шале придумает безупречный план, отвечающий всем моим требованиям!"
1014602-77 = "[s9] «Н-не дави так!»\n[s10] «Да у тебя же совершенно невыполнимые требования?!»"
1014602-80 = "Разумеется, я не жду ответа прямо сейчас."
1014602-81 = "Даже человеку вашего уровня нужно время на размышления."
1014602-82 = "Как только вам придёт в голову блестящий план, немедленно сообщите мне."
1014602-83 = "Это всё."
1014602-84 = "...О, точно."
1014602-85 = ""
1014602-87 = ""
1014602-88 = ""
1014602-89 = "Забыла спросить."
1014602-90 = "Хочу удостовериться, что моё собственное восприятие совпадает с мнением окружающих."
1014602-91 = "Что вы думаете об этом купальнике?"
1014602-92 = "[s11] «Очень красивый».\n[s12] «Изящный и стильный»."
1014602-95 = "Ки-хе-хе! Я так и знала!"
1014602-96 = "Разумеется, первоклассный талант подразумевает и первоклассный вкус."
1014602-97 = "[s13] «Ну, даже если бы ты была не в купальнике...»\n[s14] «Ты в любом случае очень красивая»."
1014602-100 = "...Н-наверное."
1014602-101 = "Мне не с чем сравнивать это мнение."
1014602-102 = "В-В любом случае!"
1014602-103 = "Доложите, как только разработаете идеальный план! На этом всё!"
1014602-105 = "После этого Макото выставила меня из клубной комнаты. Никогда прежде не видел её такой смущённой."
