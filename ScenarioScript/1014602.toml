[translation]
1014602-1 = "The Magnificent Council President's Summer"
1014602-2 = "[log]About Council President Hanuma Makoto[/log]"
1014602-4 = "[log]What do you think?[/log]"
1014602-7 = "Wait, who?"
1014602-8 = "Council President? Does our school even have a student council?"
1014602-10 = "[log]About the Pandemonium Society[/log]"
1014602-12 = "[log]What do you think?[/log]"
1014602-15 = "What even is the Pandemonium Society?"
1014602-16 = "You know, that group. #nThe one with Chiaki-chan and Ibuki-chan."
1014602-17 = "Oh, now that you mention it, I think I've heard of that?"
1014602-18 = "Wait, what is this? #nAre you recording me?"
1014602-24 = "……Sensei. #nWhat do you think of this?"
1014602-25 = "[s1] \"Hmm... Good luck with that?\"\n[s2] \"Makoto, have you been tired lately?\""
1014602-28 = "Hmm...? #nWhat on earth are you..."
1014602-29 = "Ah, I see you've misunderstood, Sensei."
1014602-30 = "Kishishi! Don't worry about it. #nEverything is going exactly according to Lady Makoto's plan!"
1014602-31 = "――In politics, the dumbing down of the masses is essential."
1014602-32 = "The more indifferent they are, the higher the authority of the Pandemonium Society and Lady Makoto rises!"
1014602-33 = "……Though, perhaps because it is too great――"
1014602-34 = "To think that not only is Lady Makoto's name forgotten, but the very existence of the Pandemonium Society and its President as well."
1014602-35 = "Ah! Talent is such a sinful thing!"
1014602-36 = "……So, Sensei. #nA new proposal from Lady Makoto."
1014602-37 = "The current situation isn't bad, but recognition is key after all. #nAwe is necessary."
1014602-38 = "To spread the prestige of the Pandemonium Society, and by extension, Lady Makoto, throughout Kivotos――"
1014602-39 = "I've decided to refresh my image!"
1014602-40 = "And so, I started by changing my appearance."
1014602-41 = "[s3] \"So that's why you're in a swimsuit!\"\n[s4] \"I finally get it.\""
1014602-44 = "Kiki! You're quick on the uptake, Sensei. It helps."
1014602-45 = "Isn't it good? This swimsuit――#nLady Makoto is quite fond of it herself."
1014602-46 = "It's a masterpiece made by a top-tier designer using the finest fabrics."
1014602-47 = "It has an approachable vibe, yet you can feel the elegance of a dignified leader, can't you?"
1014602-48 = "……Preparing the swimsuit was the easy part."
1014602-49 = "The problem starts here."
1014602-50 = "How can I make this elegant appearance of Lady Makoto leave an impression on the students of Gehenna...?"
1014602-51 = "Forcing it on them is out of the question. #nBesides, walking around campus in this outfit is absolutely unthinkable!"
1014602-52 = "It must be accidental――I will appear naturally, #nand make them say, \"Who is that wonderful person!?\""
1014602-53 = "[s5] \"...Maybe participate in a swimming class?\"\n[s6] \"Go to the pool or the beach...?\""
1014602-56 = "That's impossible!"
1014602-57 = "If I did that, it would be revealed that Lady Makoto cannot swim!"
1014602-61 = "Gah!!! I said it!!!"
1014602-62 = "……Ugh, so this was a leading question. #nAs expected, you are no ordinary Sensei."
1014602-63 = "No, it is not your fault, Sensei. #nIt was my mistake for letting my guard down."
1014602-64 = "But now that you know――I have no choice but to speak."
1014602-65 = "For Lady Makoto, swimming is――#none of my only two weaknesses."
1014602-66 = "[s7] \"...Do you want to learn how to swim?\"\n[s8] \"Do you want me to teach you?\""
1014602-69 = "Hmm? I didn't say that, did I?"
1014602-70 = "I have no intention of learning to swim in the future either."
1014602-71 = "In the first place... the act of swimming is contradictory, isn't it?"
1014602-72 = "Humans cannot breathe underwater! #nIn other words, going deep into the water is nothing but a dangerous act that threatens one's life!"
1014602-73 = "To go out of one's way to dive into the water and enjoy it! #nI truly cannot understand it."
1014602-74 = "Therefore, showing myself swimming is rejected!"
1014602-75 = "Even without swimming, Lady Makoto's charming swimsuit appearance will surely captivate the students of Gehenna!"
1014602-76 = "Besides... if it's Sensei from Schale, surely you have a brilliant plan, don't you?"
1014602-77 = "[s9] \"Th-the pressure is immense!\"\n[s10] \"The difficulty just spiked, didn't it!?\""
1014602-80 = "Of course, I don't expect an answer right this second."
1014602-81 = "It's a sudden request. #nSensei needs time to think as well."
1014602-82 = "If a good idea comes to mind, contact me immediately."
1014602-83 = "That is all."
1014602-84 = "Ah... wait."
1014602-89 = "It's necessary so we can align our perspectives..."
1014602-90 = "I'll ask you this directly――"
1014602-91 = "Sensei, what do you think of Lady Makoto's swimsuit?"
1014602-92 = "[s11] \"It suits you well.\"\n[s12] \"It's elegant and lovely.\""
1014602-95 = "Kikiki! I knew it!"
1014602-96 = "As expected of Sensei, you are worthy of Lady Makoto's favor. You have a discerning eye."
1014602-97 = "[s13] \"Well, even without the swimsuit...\"\n[s14] \"Makoto, you look beautiful.\""
1014602-100 = "……I-I see."
1014602-101 = "Or rather... that doesn't help me at all. That's too obvious."
1014602-102 = "A-anyway!"
1014602-103 = "If you come up with a good idea, contact me! That is all!"
1014602-105 = "(Afterward, I was kicked out of the room by a rare, bashful Makoto.)"