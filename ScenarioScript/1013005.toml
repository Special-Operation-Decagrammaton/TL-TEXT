[translation]
1013005-1 = "Опыт реального мира"
1013005-3 = ""
1013005-4 = ""
1013005-5 = "..."
1013005-6 = "[s] «...»"
1013005-7 = "З-Здравствуйте, Сенсей."
1013005-8 = "Что я делаю, спрашиваешь? К-Конечно..."
1013005-9 = ""
1013005-11 = ""
1013005-13 = "Я работаю здесь неполный день..."
1013005-14 = "Н-Нет, ничего странного, о чём ты могла подумать! Работая в «обслуживании клиентов», я на самом деле..."
1013005-15 = "Смотри. После небольшого обсуждения в школе мы начали работать здесь. Мне приходится иметь дело со всякими мошенниками, дебоширами и... придурками, короче!"
1013005-16 = "Но при этом я получаю кое-какой «опыт реальной жизни» и даже немного зарабатываю."
1013005-17 = "[ns] «...Пожалуй, звучит практично...»"
1013005-18 = ""
1013005-19 = "Правда...?"
1013005-20 = "Наверное, я узнала бы больше, если бы работала ВНУТРИ кафе, но всё же..."
1013005-21 = "Почему я отвечаю за вывеску? Если честно, не знаю. Сказали что-то о том, что с ней в руках я хорошо смотрюсь на фотографиях."
1013005-22 = ""
1013005-23 = ""
1013005-24 = ""
1013005-25 = ""
1013005-26 = ""
1013005-27 = "[ns1] «...И это чистая правда.»\n[ns2] «Думаю, тебе стоит быть увереннее в себе, Субару.»"
1013005-30 = "Ого. Владелец сказал буквально то же самое, слово в слово."
1013005-31 = "Хотя я всё ещё не понимаю, что вы обе имеете в виду."
1013005-32 = "А? И всё же ты рада видеть, что я стараюсь?"
1013005-33 = "..."
1013005-34 = "Ну тогда! Потрать немного денег! Ради трудолюбивых студентов, которые просто пытаются заработать на жизнь!"
1013005-35 = "[s3] «Ого, Субару, вот это напор!»\n[s4] «Да, я с удовольствием зайду внутрь.»"
1013005-38 = "Спасибо! Идём за мной!"
1013005-39 = ""
1013005-40 = "[ns] «Ого. Всё куда серьёзнее, чем я думала.»"
1013005-41 = "Ну как, Сенсей? Неплохо выглядят, правда?"
1013005-42 = "Поначалу все сомневались, но потом увидели форму."
1013005-43 = "Сказали, что она милая и что тоже хотят её примерить..."
1013005-44 = "..."
1013005-45 = "Я старшая, а даже не заметила, насколько им всё это было нужно. Какая жалость."
1013005-46 = "[s5] «Всё не так. Никто из них не знал, как двигаться дальше.»\n[s6] «Теперь, когда ты знаешь, сможешь позаботиться о своих девочках.»"
1013005-49 = "...Да, пожалуй."
1013005-50 = "Сюда, [USERNAME]! У нас посетитель!"
1013005-51 = "Добро пожаловать! Спасибо, что заглянули! Я провожу вас к столику!"
1013005-52 = ""
1013005-53 = "[ns] «Субару, пойдём со мной.»"
1013005-54 = "Хм? Я-Я?! Но я отвечаю за вывеску! За вход!"
1013005-55 = "Я должна привлечь больше посетителей, чтобы увеличить выручку кафе!"
1013005-57 = "Именно такой мотивации я и ждала. Я победно улыбнулась."
1013005-58 = "Я позвала владельца кафе."
1013005-59 = ""
1013005-60 = "Да. Чем могу помочь?"
1013005-61 = "Ах, так она ваш студент. Какая милая."
1013005-62 = "Значит, вы пришли проверить, как идут дела? Хотите поговорить с ней наедине?"
1013005-63 = "О? Вы хотите заказать всем по порции торта и напитку?"
1013005-64 = "И сами оплатите счёт! О, конечно!"
1013005-65 = "Разумеется, можете немного с ней поговорить. Субару! Этот добрый человек хочет с тобой побеседовать."
1013005-67 = "...Так... можно?"
1013005-68 = "[s] «Ну, теперь уже происходит.»"
1013005-69 = "Вы очень интересный педагог."
1013005-71 = "Мы с Субару непринуждённо поболтали."
1013005-72 = "Мы говорили о жизни, школе и о том, как она чувствует себя в роли лидера."
1013005-73 = "Это могло показаться чем-то незначительным, но именно поэтому было особенно ценно."
1013005-74 = ""
1013005-75 = "Сенсей?"
1013005-76 = "[ns] «Хм?»"
1013005-77 = "Разве ты ими не гордишься? Моими девочками..."
1013005-78 = "[ns7] «Горжусь.»\n[ns8] «И тобой тоже горжусь.»"
1013005-81 = "..."
1013005-82 = "Льсти мне сколько хочешь. Мне нечего предложить."
1013005-83 = "А? Ты серьёзно?"
1013005-84 = "..."
1013005-85 = "Знаешь, Сенсей, я слышала о тебе один неприятный слух."
1013005-86 = "Что если с тобой случится какая-нибудь беда, значит, ты сама напросилась!"
1013005-87 = "Почему я вдруг об этом заговорила?"
1013005-88 = "Ты ведь умная, правда? Попробуй догадаться сама."
1013005-90 = "Это ещё что? Я пришла за бесплатным тортом, а обслуживание здесь — просто шутка!"
1013005-91 = "Ч-Что случилось?"
1013005-92 = "Ты едва со мной поговорила и даже не улыбнулась! Тебе стоит больше заботиться о посетителях."
1013005-93 = "Хотя в эту дыру я всё равно больше никогда не вернусь!"
1013005-94 = "Ой, простите! Я исправлюсь. Но, пожалуйста, не бросайте кафе из-за моей неосторожности!"
1013005-95 = "Буду делать что хочу! Не командуй мной! И что это за дурацкая форма? Хлипкая, словно из бумаги!"
1013005-96 = "Кья-а?!"
1013005-97 = "П-Простите?! Пожалуйста, не трогайте её форму."
1013005-98 = "...!"
1013005-99 = ""
1013005-101 = ""
1013005-104 = "Ч-Чего-о-о?!?! Ты ещё кто такая?"
1013005-105 = ""
1013005-106 = "Простите, пожалуйста, за мою грубость. Просто показалось, что вы потеряли равновесие, когда так резко уходили!"
1013005-107 = "Позвольте я помогу вам подняться?"
1013005-108 = "Субару демонстрирует навыки ближнего боя! Смотрите!"
1013005-109 = "Эй, отпусти! Ай-ай-ай...! Так ты мне кисть или локоть вывихнешь! Отпусти меня!"
1013005-110 = "Ха-ха-ха. О, что такое? Кажется, вы немного потеряли равновесие."
1013005-111 = "...Мне бы не хотелось выкручивать вам руку. Но, может, придётся."
1013005-112 = "И-и-и?!"
1013005-113 = "Я достаточно ясно выразилась? Или повторить?"
1013005-114 = "П-Поняла...! Конечно, я всё поняла! Пожалуйста, отпустите!"
1013005-115 = "Проваливай."
1013005-116 = ""
1013005-119 = "Больше вы меня не увидите!"
1013005-120 = ""
1013005-121 = ""
1013005-123 = ""
1013005-124 = ""
1013005-125 = "..."
1013005-126 = "Спасибо, Субару — то есть, госпожа Субару! Благодаря вам все целы!"
1013005-127 = "Ничего особенного. Я просто выполняла свою работу."
1013005-128 = "Ты ведь Субару, да? Можно с тобой сфотографироваться?"
1013005-129 = "За это... нужно заплатить? Я готова!"
1013005-130 = "Н-Нет, не нужно... Н-Но, управляющая? Сенсей?!"
1013005-131 = "Почему вы обе показываете мне большой палец?!"
