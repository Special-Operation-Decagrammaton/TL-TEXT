[translation]
2300706-1 = "Девушка под дождём"
2300706-2 = "Мне пришли тревожные сообщения в MomoTalk, поэтому я решил разобраться."
2300706-3 = "Ханако перестала читать сообщения, поэтому я начал спрашивать прохожих, не видели ли они её."
2300706-6 = "(После долгих поисков я нашёл Ханако сидящей в парке.)"
2300706-7 = "(Она сидела на скамейке под беседкой и смотрела на дождь.)"
2300706-8 = "..."
2300706-9 = "*вздыхает*"
2300706-10 = "[s1] «...Привет, Ханако.»\n[s2] «О чём ты думаешь?»"
2300706-11 = "...?"
2300706-12 = "...?"
2300706-13 = "...А?"
2300706-14 = "Сенсей? Как ты меня здесь нашёл?"
2300706-15 = "..."
2300706-16 = "А... Хи-хи."
2300706-17 = "Хотя, наверное, удивляться не стоит. Тебя нельзя недооценивать."
2300706-18 = "Но я ведь не говорила, где нахожусь. Не думала, что ты так постараешься меня найти..."
2300706-19 = "Не стоило так стараться. Если бы ты просто позвонил, я бы сразу примчалась к тебе..."
2300706-20 = "[s] «Что случилось?»"
2300706-21 = "...?"
2300706-22 = "...А?"
2300706-23 = "Если бы мне было что сказать, я бы написала тебе в MomoTalk."
2300706-24 = "Или... я выгляжу так, будто что-то скрываю?"
2300706-25 = "[s] Что случилось?"
2300706-26 = "..."
2300706-27 = "...Говорю же, ничего не случилось."
2300706-28 = "Но... если тебе обязательно нужно знать, со мной связался один знакомый человек."
2300706-29 = "[s3] «Кто-то знакомый?»\n[s4] «...Связался с тобой?»"
2300706-30 = "Ничего особенного. Просто решили поприветствовать всех знакомых. Чистая формальность."
2300706-31 = "Ничего особенного. Просто решили поприветствовать всех знакомых. Чистая формальность."
2300706-32 = "Но хотя это было всего лишь приветствие..."
2300706-33 = "казалось, будто за кучей красивых слов пытались что-то спрятать... Сообщение получилось сложным и утомительным."
2300706-34 = "Если есть что сказать, почему нельзя сказать прямо?"
2300706-35 = "Словно человек вообще не умеет общаться напрямую..."
2300706-36 = "..."
2300706-37 = "В общем, ничего плохого или опасного не произошло, так что можешь не переживать."
2300706-38 = "Просто... немного раздражает и бесит."
2300706-39 = "...Хи-хи. Странно, правда?"
2300706-40 = "Лучше бы они вообще не связывались с такой мелкой занозой, как я."
2300706-41 = "Я в Клубе дополнительных занятий, потому что у меня плохие оценки и нет особых талантов, да ещё постоянно устраиваю сцены. Зачем им вообще со мной связываться?"
2300706-42 = "[s5] «Ты не хочешь, чтобы они с тобой связывались?»\n[s6] «Но тебе ведь не нравится быть одной.»"
2300706-43 = ""
2300706-44 = "..."
2300706-45 = ""
2300706-46 = "..."
2300706-47 = "...Как ты так быстро меня раскусил?"
2300706-48 = "Мне и правда не нравится быть одной. Мне нравится, когда есть кого подразнить или с кем скоротать время."
2300706-49 = "Как я и сказала, я просто ненавижу это чувство раздражения. Хи-хи-хи."
2300706-50 = "..."
2300706-51 = "Как интересно. Если подумать, я ведь никогда раньше никому такого не говорила..."
2300706-52 = "Мне... странно легко на душе."
2300706-53 = "Может, из-за дождя? Хм, мне совсем не неприятно это чувство."
2300706-54 = "...Сенсей."
2300706-55 = "Если ты не против..."
2300706-56 = "Можем мы иногда вот так просто болтать ни о чём?"
2300706-57 = "[s7] «Конечно. Пока всё остаётся простым.»\n[s8] «Только если прекратишь эти ужасные шуточки.»"
2300706-58 = "Хех. Хи-хи, хи-хи-хи..."
2300706-59 = "Хех. Хи-хи, хи-хи-хи..."
2300706-60 = "Ох, прости, Сенсей."
2300706-61 = "Но не думаю, что это возможно."
2300706-62 = "Хи-хи-хи, мне слишком нравятся мои шутки, чтобы от них отказаться..."
2300706-63 = "Хм. Ну..."
2300706-64 = "Не знаю, компенсирует ли это всё, но... в будущем я постараюсь, чтобы тебе рядом со мной было комфортнее, Сенсей."
2300706-67 = "...Да."
2300706-68 = "Для меня это будет впервые."
