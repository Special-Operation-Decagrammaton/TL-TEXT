[translation]
1008103-1 = "Вредная еда — это вкусно!"
1008103-2 = ""
1008103-3 = ""
1008103-4 = ""
1008103-5 = "А! Сюда, Сенсей!"
1008103-6 = "Наш сегодняшний разговор в MomoTalk стал для меня настоящим культурным шоком!"
1008103-7 = "Не говори мне, что такие солёные снеки и правда существуют!"
1008103-8 = "[s] Просто любопытно: какие сладости ты обычно ешь, Юкари?"
1008103-9 = "Хм. Ты желаешь знать, какими десертами я себя балую?"
1008103-10 = "После еды я люблю хорошее мороженое..."
1008103-11 = "Иногда наши слуги покупают мне вагаси в торговых кварталах Хяккияко..."
1008103-12 = "А, ещё мне часто дарят сладости. Однажды мне прислали пудинг из академии Красная Зима. Я даже пробовала фирменный рулет Тринити и пахлаву."
1008103-13 = "[s1] Стоило ожидать, что ты сладкоежка.\n[s2] Сладости и правда часто дарят."
1008103-16 = "Что? Ты..."
1008103-17 = "[s] Сейчас скажу тебе нечто шокирующее, Юкари. Бывают снеки, которые вовсе не сладкие!"
1008103-18 = "...!"
1008103-19 = "То есть ты привёл меня сюда, чтобы познакомить с солёными снеками?"
1008103-20 = "[s] Да. Позволь Сенсею показать тебе путь вредной еды."
1008103-21 = "Вредная... еда?"
1008103-25 = ""
1008103-26 = "Так вот где ты покупаешь свою вредную еду, Сенсей?"
1008103-27 = ""
1008103-30 = ""
1008103-31 = "Ух ты, вон там огромная толпа!"
1008103-32 = ""
1008103-34 = ""
1008103-35 = "Это что—?!"
1008103-37 = ""
1008103-38 = "Целая стена снеков в индивидуальных упаковках?"
1008103-39 = "И смотри! На прилавке стеклянная банка, полная конфет!"
1008103-40 = "Я вижу жареные снеки, напитки в бутылках и... шоколад в форме зонтика?!"
1008103-41 = "А это там что?! Фейерверки и волчки-сюрикены?"
1008103-42 = "Здесь даже такое продают?"
1008103-43 = "Я, Юкари, одновременно озадачена И ошеломлена!"
1008103-44 = "Здесь столько всего... Что мне купить первым?!"
1008103-45 = "[s] Позволь эксперту тебя направить. Один кукурузный батончик, пожалуйста."
1008103-46 = "Спасибо, как всегда!"
1008103-47 = ""
1008103-51 = "Спасибо... как всегда?"
1008103-52 = "Сенсей, ты здесь постоянный покупатель?"
1008103-53 = "[s] Они просто вежливы! Ну а теперь попробуй вот это."
1008103-54 = ""
1008103-56 = ""
1008103-57 = "Кукурузный батончик? Просто хрустящая палочка в упаковке."
1008103-58 = "Погоди. Здесь на этикетке написано, что это обычная вредная еда и одновременно путь в рай вредной еды, где обитает величайший снек всех времён. Что это вообще значит?!"
1008103-59 = "Не знать, какие именно ингредиенты смешаны внутри, — тоже часть вредной еды?"
1008103-60 = "Я, Юкари, озадачена, ошеломлена И сбита с толку. Но раз Сенсей рекомендует..."
1008103-61 = ""
1008103-63 = ""
1008103-64 = ""
1008103-65 = ""
1008103-67 = "Вкусно! Такой сладкий, острый и при этом пикантный вкус!"
1008103-68 = "Есть вкус «Кукурузный потаж со смешанными фруктами Мега Макс»?"
1008103-69 = "Такое вообще существует?!"
1008103-70 = "[s] Какая разница? Вкусно ведь?"
1008103-71 = "Да! У этого вкуса прямо захватывающий дух, будто сидишь на краю кресла!"
1008103-72 = ""
1008103-73 = "Теперь попробуем вот это. От этой конфеты меняется цвет языка."
1008103-74 = ""
1008103-76 = ""
1008103-77 = "А! У меня язык синий!"
1008103-78 = "Сенсей, сюда!"
1008103-80 = "Позже, после того как мы с Юкари перепробовали множество вкусных снеков..."
1008103-81 = ""
1008103-82 = "Снеки здесь, снеки там. Повсюду столько вкуснейших снеков!"
1008103-83 = "Я и представить себе такого не могла. Это уже не культурный шок. Это электрическая буря на сто вольт!"
1008103-84 = "[s] И это ещё не всё. Я прихожу сюда не только ради еды, Юкари."
1008103-85 = "Здесь есть что-то ещё, кроме вредной еды?!!"
1008103-86 = ""
1008103-89 = "Погоди, почему те люди собираются вокруг игрового автомата в глубине магазина?"
1008103-90 = "Все сюда! Сейчас устроим турнир по файтингу!"
1008103-91 = "О да! Думаю, я всех вынесу! Кто готов сыграть на деньги?"
1008103-92 = ""
1008103-94 = ""
1008103-95 = "Спонтанный турнир по файтингу? Прямо здесь?"
1008103-96 = "[s] Ага, местные любят устраивать турниры на игровом автомате в глубине магазина."
1008103-97 = "Посмотри, как у этих детей глаза сияют. Им, должно быть, ужасно весело."
1008103-98 = "Понятно... Значит, эта атмосфера тоже часть впечатлений от вредной еды."
1008103-99 = "[s] Ну как тебе?"
1008103-100 = "Ой, э-э... эм..."
1008103-101 = ""
1008103-104 = "Хи-хи."
1008103-105 = "Для меня всё это совершенно новое. Сразу столько впечатлений... но..."
1008103-106 = "По сравнению с игровым залом это место сияет совсем по-другому!"
1008103-107 = "Здесь так оживлённо, но одновременно спокойно и уютно."
1008103-108 = "Это напоминает мне о странном чувстве, которое в последнее время живёт у меня в груди..."
1008103-109 = "В общем— Здесь здорово! Когда я с тобой, Сенсей, я всегда узнаю столько нового!"
1008103-110 = "[s3] Вот как? Тогда держись, впереди ещё много всего.\n[s4] Мы только поверхность задели. Готовься к углублённому курсу по вредной еде!"
1008103-113 = "*ахает*"
1008103-114 = "Разумеется! Я, Юкари, торжественно клянусь..."
1008103-115 = "Узнать всё, что только смогу!"
1008103-117 = "Остаток дня я показывал Юкари самые разные стороны мира вредной еды."
