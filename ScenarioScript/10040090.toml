[translation]
10040090-1 = "Послесловие;Поймай Джокера"
10040090-2 = "Хм."
10040090-3 = "Э-эм..."
10040090-4 = "А! Нашла! Вот сюда!"
10040090-6 = "<Бип—Провал!>"
10040090-7 = "КЬЯЯЯ!"
10040090-8 = "Уа-а-а... Опять? Как это могло случиться ОПЯТЬ?"
10040090-9 = ""
10040090-11 = ""
10040090-12 = "Ого-ого. Это уже хуже, чем просто невезение. Сколько раз подряд она проиграла в рулетке?"
10040090-13 = "Считая этот раз — пять подряд. Если грубо посчитать, шанс примерно 0,00006%."
10040090-14 = "Единственное объяснение — тебя проклял бог рандома."
10040090-16 = "Нет такого бога! Любой, у кого есть глаза, видит, что здесь что-то нечисто!"
10040090-17 = "Кто-то специально со мной играет! Рулетку подкрутили так, чтобы я проигрывала при любом выборе!"
10040090-19 = "Мне стало интересно, поэтому перед началом я осмотрела механизм. Он вообще не умеет распознавать отдельных пользователей."
10040090-20 = "И все эти настольные игры мы одолжили прямо перед началом вечеринки. Когда бы мы успели настроить её против тебя?"
10040090-21 = "Однако я подтвердила наличие инфракрасной системы наведения для умных боеприпасов верхней атаки, чтобы выступающая кукла Пероро точно попадала по голове того, кому выпал штраф."
10040090-22 = "Кто вообще установил такую неоправданно дорогую боевую систему в игру для вечеринок?!"
10040090-24 = "А. Я как-то одалживала эту рулетку Инженерному отделу. Когда они вернули её, сказали, что добавили «развлекательные улучшения.» Может, они имели в виду именно это?"
10040090-25 = "Это работа Инженерного отдела? Ну и ну..."
10040090-26 = "В следующий раз, когда они подадут заявку на ресурсы, я им всё выскажу!"
10040090-28 = "Но вернёмся ко мне! Это совершенно нечестно! Игры, которые полностью зависят от удачи, вроде рулетки, — мои заклятые враги!"
10040090-29 = "Это вообще-то полностью противоречит самому понятию удачи..."
10040090-30 = "Если я говорю, что нечестно, значит нечестно! Я протестую!"
10040090-31 = "Судья! Требую сменить игру!"
10040090-32 = "Мы просто играем в дружеские игры для вечеринки... Здесь нет судей..."
10040090-33 = "Но если ты так хочешь, можем сменить игру. Вариантов полно."
10040090-34 = "Во что сыграем? Есть THE LIFE или «Волк Дикой охоты»..."
10040090-35 = "Фуфуфу. А я предлагаю теперь сыграть в... «Поймай Джокера»!"
10040090-36 = "«Поймай Джокера»? Это карточная игра, да? Проигрывает тот, у кого в конце останется Джокер."
10040090-37 = "Да! Простая и понятная игра. Игроки по очереди сбрасывают пары одинаковых чисел, а тот, у кого в конце останется Джокер, — ПРОИГРАЛ!"
10040090-38 = "Все знают правила, да? Значит, никаких возражений!"
10040090-40 = "Однако «Поймай Джокера» тоже зависит от удачи."
10040090-41 = "Если игры на удачу — твои заклятые враги, разве ты снова не проиграешь?"
10040090-42 = "Фуфу, похоже, ты не знаешь, Котама. «Поймай Джокера» — на самом деле игра на навык и стратегию! Ну это же очевидно!"
10040090-43 = "Можно считать, какие карты уже сбросили, и вычислять вероятность оставшихся! Или внимательно следить за реакцией людей, когда они тянут карту, чтобы понять, у кого Джокер!"
10040090-44 = "Рулетка — тупая игра, которая полностью держится на удаче! А вот в «Поймай Джокера» у меня точно есть шанс победить!"
10040090-46 = "А проигравшему — щелбан по лбу!"
10040090-48 = "Фуфу. Звучит весело. Думаю, в этом раунде я тоже сыграю."
10040090-49 = "Мне всё равно, во что играть, но почему-то кажется, что это быстро закончится."
10040090-51 = "Э-э-э, я пас. Простые игры вроде «Поймай Джокера» — не совсем моё."
10040090-52 = "А? Что за тухлая реакция? Вы просто испугались?"
10040090-53 = "Тогда начинаем «Поймай Джокера»!"
10040090-55 = "Немного позже..."
10040090-57 = "(...Почему...?)"
10040090-58 = ""
10040090-60 = ""
10040090-61 = ""
10040090-62 = "(...Почему в конце осталась именно она?!)"
10040090-63 = "Судя по числу оставшихся карт, ОЧЕВИДНО, что Джокер сейчас у Ноа, но... но..."
10040090-64 = "...Ноа?"
10040090-65 = "Да, Коюки?"
10040090-66 = "Одна... одна из карт у тебя в руке. Это Джокер, да?"
10040090-67 = "...Хм-м, даже не знаю. Может быть?"
10040090-68 = "Я-я знаю, что да! Тогда... левая или правая?"
10040090-69 = "Фуфу. Почему бы тебе не угадать, Коюки?"
10040090-70 = "(...Чёрт... По её лицу вообще ничего не понять.)"
10040090-71 = "(Конечно же, с моей-то удачей мне выпало играть против неё!)"
10040090-72 = "(Я выбрала игру, где удача значит меньше... но внешние обстоятельства...! Ну как так-то?!)"
10040090-73 = "*вздыхает*"
10040090-74 = ""
10040090-76 = ""
10040090-77 = ""
10040090-78 = "(Другого выбора нет. Остаётся только угадывать.)"
10040090-79 = ""
10040090-81 = ""
10040090-82 = "Знаю! Джокер... слева!"
10040090-83 = "Неправильно! Он был справа!"
10040090-84 = "А-А-А-А-А! Я так и знала! Как только сказала — сразу поняла!"
10040090-85 = "Тогда почему не поменяла выбор?"
10040090-86 = "Потому что всё изменилось прямо в этот момент! Зрителей, которые ничего не понимают, прошу молчать!"
10040090-87 = "...Э-Это смешно."
10040090-89 = "Настоящее покерфейс Семинар. Её действительно невозможно прочитать."
10040090-90 = "Знаешь, я всё поняла ещё в тот момент, когда Ноа присоединилась. Одно её присутствие превращает «Поймай Джокера» в игру, на 100% зависящую от удачи."
10040090-91 = "С чего Коюки вообще решила, что сможет победить Ноа в психологической войне?"
10040090-93 = "...Если бы у неё изначально хватало на такое проницательности, она бы почти не жила в Комнате самоанализа, правда?"
10040090-95 = "...После этого Коюки проиграла пять раз подряд, получила придуманный ею же штраф и в итоге сдалась."
