[translation]
84303301001-5 = "Я доверю всё Королю воров!"
84303301001-6 = "Ты сама хочешь, чтобы тебя так называли...?"
84303301001-7 = "Мне всё равно, как меня называют, но доверяем мы всё-таки мудрецу."
84303301001-8 = "Но именно вы отнесёте игру к нему. Мы должны поблагодарить вас обеих!"
84303301001-9 = "В кои-то веки ты права."
84303301001-10 = "В кои-то веки?!"
