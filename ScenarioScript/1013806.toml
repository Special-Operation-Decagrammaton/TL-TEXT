[translation]
1013806-1 = "Маленькая лента"
1013806-2 = "Был день."
1013806-3 = "Я направился в общежитие Оккультного общества с материалами, которые попросила Рэна... и крепом с шоколадом и бананом."
1013806-5 = ""
1013806-6 = "А. Добро пожаловать, Сенсей."
1013806-7 = "Остальных сейчас нет."
1013806-8 = "Наверное, занимаются какой-нибудь ерундой, вроде поисков оккультных символов на фреске."
1013806-9 = "[s] «Почему ты не пошла с ними?»"
1013806-10 = "И упустить шанс спокойно поработать?"
1013806-11 = "Таков был мой план... пока я не увидела, что магазин тканей закрыт, пока там отмывают несанкционированное «искусство»."
1013806-12 = "Серьёзно, в Вайлдхант хоть кто-нибудь умеет быть нормальным? Не верится, что мне ещё три года здесь выживать."
1013806-13 = "[s] «Вот! Может, этот креп с шоколадом и бананом поднимет настроение.»"
1013806-14 = "Я же говорила не покупать, а вы всё равно купили."
1013806-15 = "Ну, спасибо..."
1013806-16 = ""
1013806-18 = ""
1013806-19 = ""
1013806-20 = "Ммм! Э-Это вкусно! Где вы его купили?"
1013806-21 = "[s] «Вообще-то я не покупал. Сам приготовил.»"
1013806-22 = "Что? П-Правда?!"
1013806-23 = "[s] «Ну как? Вкусно, да?»"
1013806-24 = "Да... В-Вкусно..."
1013806-25 = "..."
1013806-26 = "Это... определённо... вкусно."
1013806-27 = "Шья-а! Не знаю! Зачем вы засыпаете меня вопросами? Это что, инквизиция?! Идиот Сенсей!"
1013806-28 = ""
1013806-33 = "Несмотря на сердитый взрыв, Рэна с удовольствием доела креп."
1013806-34 = ""
1013806-35 = "Ммм. Теперь, когда сахар получила, можно работать."
1013806-36 = "[s1] «Ты говорила, что делаешь аксессуары, да?»\n[s2] «Что именно мастеришь?»"
1013806-39 = "Заколку с ленточкой."
1013806-40 = "[s3] «Если подумать, ты носишь много лент.»\n[s4] «Они тебе нравятся?»"
1013806-43 = "Ну... Не то чтобы я их ОБОЖАЛА..."
1013806-44 = "Сначала была одна, потом я добавила ещё одну для баланса... а потом и не заметила, как оказалась вся в них."
1013806-45 = "Теперь, если выхожу куда-то без целой кучи лент, чувствую себя как-то «не так»."
1013806-46 = "[s5] «Значит, они как талисманы!»\n[s6] «Так ты всё-таки настоящая участница Оккультного общества!»"
1013806-49 = "Шья-а! Заткнитесь! Всё не так!"
1013806-50 = "Это всё ради моды! Моды!"
1013806-51 = "[s] «Зачем делать ещё, если на тебе их и так столько?»"
1013806-52 = "Они маленькие, поэтому за целый день я обычно несколько теряю. Вот и... делаю запасные, на всякий случай."
1013806-53 = "Я сейчас начну работать, так что и вы займитесь своей работой."
1013806-54 = "Разве вы сегодня пришли не потому, что у вас были какие-то дела?"
1013806-55 = "[s7] «Сейчас у меня всё нормально, так что...»\n[s8] «Можно посмотреть, как ты делаешь ленты?»"
1013806-58 = "...А?"
1013806-59 = "Э-Это очень обычная работа... Смотреть может быть скучно."
1013806-60 = "Но если всё равно хотите наблюдать..."
1013806-61 = ""
1013806-63 = ""
1013806-64 = "Л-Ладно. Смотрите."
1013806-65 = "Только не мешайте, хорошо?"
1013806-68 = "― [log=레나]Знаете, я с детства хорошо работаю руками.[/log][wa:2020]"
1013806-70 = "― [log=레나]Я делала всякие ленты и дарила их друзьям.[/log][wa:270]"
1013806-73 = "― [log=레나]Мне было приятно видеть, что всем они нравятся.[/log][wa:1370]"
1013806-75 = "― [log=레나]...И так я поняла,[/log]"
1013806-78 = "― [log=레나]что даже что-то маленькое[/log]"
1013806-80 = "― [log=레나]может сделать человека счастливым.[/log][wa:1870]"
1013806-83 = "― [log=레나]Поэтому я и начала мечтать стать модельером.[/log][wa:860]"
1013806-86 = "― [log=레나]Потому что мне приятно видеть, как другим нравятся[/log][wa:670]"
1013806-88 = "― [log=레나]одежда и аксессуары, которые я создаю.[/log][wa:920]"
1013806-91 = "― [log=레나]Сенсей, вы ведь понимаете это чувство, да?[/log][wa:1150]"
1013806-93 = "― [log=레나]Думаю, поэтому вы тоже постоянно присматриваете за мной.[/log][wa:1310]"
1013806-96 = "― [log=레나]А...?[/log][wa:400]"
1013806-98 = "― [log=레나]Как прошёл сегодняшний день...?[/log][wa:1550]"
1013806-101 = "― [log=레나]Шья-а! Н-Не заставляйте меня это говорить! Идиот Сенсей![/log][wa:1960]"
1013806-104 = "После этого я продолжал разговаривать с Рэной, пока она делала ленты."
1013806-110 = "А... Уже столько времени."
1013806-111 = "Сенсей. Вам не пора? Уже темнеет."
1013806-112 = "[s] «Мне скоро нужно идти.»"
1013806-113 = "Да. Удачи с работой... и всем остальным."
1013806-114 = "А, точно. Перед тем как уйдёте..."
1013806-115 = ""
1013806-117 = ""
1013806-118 = "Вот. Подойдите ближе."
1013806-119 = ""
1013806-121 = ""
1013806-122 = ""
1013806-123 = "Хи-хи. Эта лента вам идёт!"
1013806-124 = "Считайте это подарком! За то, что составили мне компанию!"
1013806-125 = "[s9] «О! Спасибо!»\n[s10] «Буду носить её даже на работе!»"
1013806-128 = "Ч-Что? Не обязательно настолько..."
1013806-129 = "[s] «Но это первая лента, которую Рэна сделала специально для меня.»"
1013806-130 = "...!"
1013806-131 = "К-Как хотите! Носите, если так надо!"
1013806-133 = "Как и настояла Рэна, я продолжал работать с лентой..."
1013806-134 = "...и всё время вспоминал, какой счастливой она выглядела, прикалывая её ко мне."
