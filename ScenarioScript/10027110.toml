[translation]
10027110-1 = "Эпизод 11;Особая сделка"
10027110-4 = "Снежные поля Красной Зимы"
10027110-5 = ""
10027110-6 = "Уаааа! Теперь я точно опоздаю!"
10027110-7 = "По крайней мере, мы заставили их отступить. Хорошая работа, Сенсей..."
10027110-8 = ""
10027110-11 = "[ns] «Цитируя Момидзи... У меня плохое предчувствие.»"
10027110-12 = "Не говорите глупостей, Сенсей. Худшее уже позади."
10027110-13 = "Каковы вообще шансы, что нас остановит третья группа?"
10027110-14 = "Да. К тому же это всё просто совпадение. Обе группы действовали независимо и преследовали собственные цели—"
10027110-15 = ""
10027110-17 = ""
10027110-21 = ""
10027110-22 = "Эй! Я слышала, Фронт освобождения знаний делает какой-то ценный фанфик!"
10027110-23 = "Ага! Нодока сказала, что у неё есть хорошая идея насчёт него, а я пришла её поддержать!"
10027110-25 = "Неужели...?"
10027110-27 = "Понятия не имею, о чём он, но слышала, что он ценный, и меня больше ничего не волнует."
10027110-28 = "Думаю, нам просто нужно его заполучить. Потом продадим президенту Черине за приличные деньги и наконец купим печку для Особого отряда №227."
10027110-29 = "Шигурэ?! Зачем вам печка?! Вы должны искупать наказание и добиваться отмены отстранения, а не устраиваться поудобнее!"
10027110-30 = "Как бы то ни было, я собираюсь воспользоваться жадностью президента Черины. Она, как говорится, хочет получить всё, так зачем сопротивляться неизбежному? Рано или поздно она всё равно это получит, хотите вы того или нет."
10027110-31 = "Отдайте его нам — и поможете выбраться из отстранения и вернуться к нормальной жизни с нормальным отоплением, одеялами без насекомых и существованием без медведей!"
10027110-32 = ""
10027110-34 = ""
10027110-36 = ""
10027110-37 = ""
10027110-38 = "Ни за что! Найдите чей-нибудь другой фанфик для кражи!"
