[translation]
42170-1 = "Episódio 17;Vestes Bordadas na Noite"
42170-2 = "Parque Kousagi"
42170-6 = "(Na manhã seguinte, enquanto eu arrumava as instalações deixadas pelo Esquadrão RABBIT...)"
42170-11 = "Mexendo nos pertences de uma aluna na ausência dela..."
42170-12 = "Realmente, [USERNAME]-sensei, você é mesmo um adulto suspeito."
42170-19 = "[ns] \"Bem-vinda de volta, Miyako.\""
42170-20 = "Sim, voltei—"
42170-25 = "—Não. RABBIT 1, reportando retorno ao Acampamento RABBIT."
42170-26 = "[s] \"As outras não vieram com você?\""
42170-30 = "Não consegui... falar com as outras."
42170-31 = "Depois de eu mesma ter abandonado o papel de líder do esquadrão, pedir que abrissem mão da tranquilidade que finalmente conquistaram para voltar ao acampamento... eu não tive coragem."
42170-32 = "...Elas certamente conseguirão encontrar uma convicção firme mesmo sem a sua ajuda, Sensei."
42170-33 = "—Antes disso."
42170-34 = "Sensei, há um assunto sério sobre o qual preciso me aconselhar com você."
42170-36 = "(...Ouvi de Miyako sobre o Conselho Estudantil Geral e o Esquadrão FOX.)"
42170-39 = "[ns1] \"Uma bomba no subsolo da estação...?\"\n[ns2] \"...Isso não é terrorismo?!\""
42170-42 = "Shh, Sensei. Está falando alto demais."
42170-43 = "Esta é uma operação ultrassecreta conhecida apenas por parte dos oficiais do Conselho Estudantil Geral.#nSe os cidadãos souberem disso, causará uma enorme confusão."
42170-44 = "[ns] \"Desculpa, é que foi um choque grande demais...\""
42170-46 = "[ns] \"Que tipo de bomba é uma bomba termobárica?\""
42170-47 = "Uma bomba termobárica é um explosivo especial desenvolvido para atacar trincheiras e bunkers difíceis de destruir com armamento convencional."
42170-48 = "Após o impacto, ela consome todo o oxigênio no raio da explosão, gerando chamas intensas e uma onda de choque devastadora."
42170-49 = "Ela já tem um poder destrutivo enorme em superfície, mas... por dispersar e vaporizar uma nuvem de aerossol em espaços confinados, seu efeito é ainda maior em subterrâneos ou cavernas."
42170-50 = "Além de atingir todos os combatentes no raio efetivo com a explosão, a onda de choque derrubaria todos os prédios da região sem deixar vestígios."
42170-51 = "Se o que foi divulgado no projeto <A.N.T.I.O.C.H.> for verdade — a área afetada englobaria tudo em um raio de 5 km, incluindo Kousagi Town."
42170-52 = "[s] \"Por que usar uma bomba dessas...?\""
42170-53 = "...Para semear o medo, provavelmente."
42170-56 = "A Yukino-senpai disse que é pela restauração da Academia Especial SRT, mas...#nessa operação não passa de uma demonstração de força do Conselho Estudantil Geral."
42170-57 = "Se a nova Presidente Interina do Conselho Estudantil Geral mostrar que usa armamento pesado sem hesitar,#nnenhuma facção insatisfeita com suas políticas ousará se rebelar facilmente."
42170-59 = "...Seja qual for o objetivo, se essa operação for executada, não haverá mais volta."
42170-60 = "Por isso, eu — antes que as senpais cheguem a um ponto sem retorno,#nvou impedir essa operação."
42170-61 = "Assim como as senpais abriram o caminho por onde hoje seguimos —#neu quero proteger a rota de retirada delas. Para que sempre tenham para onde voltar."
42170-62 = "Mas não tenho muita confiança sobre por onde começar, nem sobre o plano ou as ações concretas..."
42170-63 = "...Por isso, gostaria de pedir a sua sabedoria, Sensei."
42170-67 = "[ns] \"Como fazemos para impedir a detonação?\""
42170-68 = "A ogiva pesa quase uma tonelada, então não podemos carregá-la diretamente.#nSem mobilizar maquinário pesado, será difícil tomá-la."
42170-69 = "E a Kaiser Security que faz a guarda da estação jamais permitiria a aproximação de maquinário pesado..."
42170-70 = "Além disso... no pior cenário, podem detonar a ogiva antes mesmo de terminarem o transporte."
42170-71 = "Para impedir a detonação antes que percebam,#nprecisamos que várias pessoas se aproximem da ogiva e removam o detonador."
42170-72 = "[s] \"Várias pessoas, né...\""
42170-74 = "[ns] \"Só forças especiais podem deter forças especiais, não é?\""
42170-75 = "...Contra a SRT, só outra SRT, não é mesmo?"
42170-76 = "Já que são as senpais do Esquadrão FOX que estão encarregadas disso, eu já esperava um combate especial, mas..."
42170-77 = "Eu, a quem faltam armas, experiência — e até capacidade física...#nSerá que consigo mesmo vencer?"
42170-78 = "[s3] \"Se você acredita nisso, Miyako,\"\n[s4] \"com certeza você consegue.\""
42170-83 = "...Você tem razão."
42170-84 = "Se eu não acreditar em mim mesma, não conseguirei convencer ninguém."
42170-85 = "—Por agora, vou acreditar em mim mesma."
42170-86 = "—RABBIT 1, iniciando a operação!"
42170-88 = "Estação Kousagi"
42170-97 = "Aqui é RABBIT 1. Hora atual: 1030. Acabo de chegar ao local da operação."
42170-98 = "Eu já esperava por isso até certo ponto, mas... a vigilância está bem rigorosa."
42170-102 = "Há 6 guardas protegendo a entrada principal.#nE parece haver pelo menos mais duas equipes patrulhando os arredores da estação, então..."
42170-103 = "Vai ser difícil se infiltrar sem que os guardas percebam."
42170-104 = "[s] \"E se a gente for pelo ataque frontal?\""
42170-105 = "Até 3 deles eu conseguiria neutralizar simultaneamente, mas..."
42170-106 = "Mais do que isso e há o risco de o inimigo chamar reforços."
42170-107 = "...Nessas horas, se as outras integrantes do esquadrão estivessem aqui."
42170-108 = "Poderíamos fazer uma manobra de distração... Será que há mais alguém..."
42170-112 = "...Ora, ora, vejam só quem está aqui."
42170-121 = "Dizem que os caminhos do destino são misteriosos... Hum. Que encontro verdadeiramente curioso."
42170-122 = "[s] \"Você é...\""
42170-124 = "Outrora fui um buscador da verdade dedicado à pobreza honrada, um asceta que praticava uma vida simples e natural, mas..."
42170-125 = "Hoje sou um respeitável membro da sociedade, servindo à comunidade civil —"
42170-130 = "Sou um cidadão trabalhador — Descartes!"
42170-134 = "[ns5] \"Que bom te ver de novo, Descartes.\"\n[ns6] \"...O que você está fazendo aqui?\""
42170-137 = "Não consegue perceber só de olhar para este uniforme?"
42170-138 = "Bem, parece que o senhor leva uma vida bem distante da disciplina, então...#nvou lhe explicar como uma exceção."
42170-142 = "Eu ingressei na Kaiser Security e passei por diversos treinamentos."
42170-143 = "Aprendi o quão mesquinha e imoral é uma vida sem trabalho, parasitando a infraestrutura da sociedade..."
42170-144 = "E o quão sagrada é a recompensa obtida com o suor do próprio trabalho...!"
42170-145 = "E assim — após concluir esses cursos, fui reintegrado como segurança da Kaiser Security e hoje contribuo para a manutenção da ordem pública!"
42170-147 = "N-Nossa, que coisa..."
42170-148 = "É dever de um segurança abordar indivíduos suspeitos!#nVocês dois, espiando a estação escondidos nessa sombra suspeita, estão sujeitos a inspeção!"
42170-152 = "Mesmo que o senhor seja um benfeitor a quem devo favores do passado, não posso negligenciar meus deveres de cidadão trabalhador. Por favor, colaborem...!"
42170-153 = "É que, bem..."
42170-154 = "[s] \"Não dá para fingir que não viu só dessa vez?\""
42170-155 = "Cooomo é? Fingir que não vi?"
42170-156 = "Sensei, pretende insultar o meu orgulho de segurança da Kaiser Security — o meu orgulho de respeitável cidadão trabalhador?!"
42170-157 = "Eu tenho o dever de manter segura e limpa esta estação onde meus camaradas da FeliSem se hospedam—"
42170-159 = "...A Kaiser Corporation está planejando destruir a Estação Kousagi."
42170-164 = "O-O quêêê?!"
42170-165 = "Pode ser difícil de acreditar, mas na verdade..."
42170-167 = "(...Miyako explicou a situação brevemente.)"
42170-170 = "...Que informação mais difícil de engolir."
42170-171 = "Instalar uma bomba em uma estação usada por cidadãos comuns apenas para exibir poderio militar... É algo inconcebível para qualquer pessoa sensata."
42170-172 = "Contudo, considerando tudo o que a Kaiser Corporation já fez até hoje, não chega a ser uma história totalmente absurda."
42170-173 = "Eu mesmo senti na pele o quão gananciosos eles são durante meu treinamento na Kaiser Security..."
42170-174 = "Prometeram fornecer um pudim por dia de lanche, mas..."
42170-175 = "Ontem disseram que o estoque de pudim acabou e me serviram gelatina de konjac!!"
42170-176 = "N-Nossa, que coisa..."
42170-178 = "...Mas mesmo esse tipo de humilhação eu aguentei calado."
42170-179 = "Afinal, acredito que ignorar pequenos desencontros no ambiente de trabalho seja uma virtude essencial de um cidadão trabalhador...!"
42170-180 = "E ainda assim, os chefões do Conselho Estudantil Geral e da Kaiser Corporation pretendem explodir a Estação Kousagi por causa de sua ganância ainda maior...?"
42170-181 = "Justo esta Estação Kousagi, base da vida dos moradores locais e lar dos meus camaradas que não conseguiram emprego?"
42170-182 = "Imperdoável... bando de burgueses malditos!"
42170-183 = "—Deixem comigo.#nPara proteger a Estação Kousagi e meus camaradas, ajudarei no que for preciso!"
42170-185 = "Muito obrigada pela compreensão, Descartes-san."
42170-186 = "Primeiro, como há muitos inimigos, gostaria de pedir uma distração para dispersar as forças deles, mas..."
42170-187 = "Lutar não é problema, mas... na verdade, confiscaram todas as minhas armas quando fui preso..."
42170-188 = "E a pistola que estou carregando agora só tem munição de festim..."
42170-189 = "Não há problema.#nTenho munição de sobra, posso lhe entregar."
42170-193 = "Ah, esse peso frio e sólido... que nostalgia."
42170-194 = "Eu já estava mesmo farto de tantos olhares de desprezo e de ver minha paciência se esgotar aos poucos."
42170-195 = "Muito obrigado, Miyako-san.#nJá estava na hora de eu voltar a ser Descartes, o líder da FeliSem!"
42170-197 = "Agora, para desviar o olhar dos guardas, se puderem fazer barulho longe da entrada..."
42170-206 = "Camaradas da FeliSem! Assim que ouvirem este rádio, reúnam-se na Estação Kousagi!"
42170-207 = "A Kaiser Corporation, essa horda de monstros famintos movidos pela ganância, pretende profanar o nosso solo sagrado!"
42170-208 = "...Ué? Líder, você não tinha largado aquele negócio de \"Felino\" ou sei lá o quê?"
42170-209 = "É \"FeliSem\"!#n\"Associação em Busca da Felicidade Certa sem Posses\" — abreviado, \"FeliSem\"!"
42170-213 = "Aham... Eu nunca abandonei a vida de desapego."
42170-214 = "Estava apenas fazendo um treinamento infiltrado para compreender o que pensam e quais desejos nutrem aqueles que possuem bens!"
42170-215 = "E o resultado — descobri que a Kaiser Corporation, que tenta criar raízes aqui, é uma horda de monstros gananciosos além de qualquer limite."
42170-216 = "A esses materialistas cegos pela cobiça e desprovidos de moral...#nvamos ensinar a \"alegria do desapego\"!"
42170-217 = "Ah... não tenho nada pra fazer mesmo. Se tá chamando, eu vou."
42170-218 = "Se for pra dar uma lição nesses vermes... deixa comigo."
42170-219 = "Pois bem, contra essa horda apodrecida de gananciosos —"
42170-220 = "\"FeliSem\", AVANÇAAAAR—!"
42170-226 = "Espere, eu ainda ia dar o sinal—"
42170-227 = "[s] \"Lá se foram eles...\""
42170-228 = "...Do jeito que as coisas ficaram, vai ser difícil coordenar uma distração, mas...#neles devem manter a atenção do inimigo desviada por algum tempo."
42170-229 = "Eu também vou lutar. Sensei, conto com o seu comando!"
