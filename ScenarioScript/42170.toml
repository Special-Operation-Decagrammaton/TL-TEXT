[translation]
42170-1 = "Эпизод 17; Показуха"
42170-2 = "Парк Коусаги"
42170-6 = "На следующее утро, пока я убирал последние следы пребывания отряда RABBIT в парке..."
42170-7 = ""
42170-11 = "Роетесь в вещах юных девушек сразу после их ухода, Сенсей?"
42170-12 = "Вы и правда подозрительный человек."
42170-13 = ""
42170-18 = ""
42170-19 = "[ns] «С возвращением, Мияко. Я рад, что ты добралась.»"
42170-20 = "Спасибо, что помогли мне найти дорогу обратно."
42170-21 = ""
42170-23 = ""
42170-24 = ""
42170-25 = "RABBIT 1. Возвращаюсь в лагерь RABBIT, как и обещала."
42170-26 = "[s] «А остальные?»"
42170-27 = ""
42170-29 = ""
42170-30 = "Было бы... неправильно тащить их с собой."
42170-31 = "Я ушла с должности командира. Как я могу просить их отказаться от удобной, устроенной жизни и вернуться к палаткам и просроченным бенто?"
42170-32 = "...Остальные члены отряда умнее меня, так что, уверена, они сами найдут свой путь даже без вашей помощи."
42170-33 = "Но хватит любезностей."
42170-34 = "Дело срочное и очень серьёзное."
42170-36 = "Мияко быстро рассказала о заговоре Генерального студенческого совета и отряда FOX."
42170-39 = "[ns1] «Они собираются взорвать бомбу под станцией метро?!»\n[ns2] «Они хотят устроить теракт! Полгорода взлетит на воздух!»"
42170-42 = "Сенсей, говорите тише!"
42170-43 = "Эта операция совершенно секретна, о ней знают лишь немногие в Генеральном студенческом совете. Если информация утечёт, начнётся паника."
42170-44 = "[ns] «Прости, я просто был в шоке...»"
42170-46 = "[ns] «Эта термобарическая боеголовка и правда настолько разрушительна?»"
42170-47 = "Да. Термобарическая боеголовка была специально создана для уничтожения укреплённых целей и тяжёлых танков, которые обычное оружие не берёт."
42170-48 = "При взрыве она выжигает весь кислород в радиусе поражения и создаёт колоссальную ударную волну."
42170-49 = "На поверхности она и без того чудовищно разрушительна, а под землёй её мощность резко возрастает. Облако распылённого топлива заполнит закрытое пространство и воспламенится."
42170-50 = "Все в зоне поражения будут уничтожены. А ударные волны разрушат окружающие здания словно мощнейшее землетрясение."
42170-51 = "Если чертежи проекта A.N.T.I.O.C.H. верны... Радиус разрушений около пяти километров. Город Коусаги просто сотрёт с карты."
42170-52 = "[s] «Но зачем им это вообще...?»"
42170-53 = "...Чтобы вселить страх в сердца людей."
42170-54 = ""
42170-56 = "Юкино сказала, что это ради возрождения академии SRT, но настоящая цель операции — устрашающая демонстрация силы, показ того, какой властью Генеральный студенческий совет располагает над гражданами."
42170-57 = "После такого противники исполняющей обязанности президента Каи дважды подумают, прежде чем открыто ей сопротивляться."
42170-59 = "Какой бы ни была их цель, если операция удастся, ущерб будет непоправимым."
42170-60 = "Я должна остановить это, пока старшие не перешли черту, за которой уже нельзя вернуться."
42170-61 = "Они всегда прокладывали мне путь вперёд, так что теперь я должна помочь им найти дорогу обратно."
42170-62 = "Я так говорю, но всё это давит. Если мы провалимся... Я не знаю, с чего начать... Мне страшно представить последствия, если это решение окажется ошибочным."
42170-63 = "Мне нужен был ваш взгляд со стороны."
42170-64 = ""
42170-67 = "[ns] «Есть способ остановить взрыв?»"
42170-68 = "Боеголовка весит тонну, вручную её не унести. Для перемещения нужна тяжёлая техника. Так что украсть её не получится."
42170-69 = "И я сильно сомневаюсь, что сотрудники «Кайзера» просто позволят нам подъехать туда на танке."
42170-70 = "...В худшем случае они просто подорвут её раньше времени."
42170-71 = "Нужно остановить детонацию прежде, чем отряд FOX поймёт, что произошло. Нам нужна специализированная ударная группа, которая проникнет на станцию и обезвредит бомбу."
42170-72 = "[s] «Небольшая ударная группа...»"
42170-74 = "[ns] «Единственное, что может одолеть один отряд спецназа, — другой отряд спецназа.»"
42170-75 = "...Иными словами, остановить SRT может только SRT."
42170-76 = "Против отряда FOX это будет совсем другая игра..."
42170-77 = "Я... Я уступаю им в опыте, боевых навыках и снаряжении. Не знаю..."
42170-78 = "[s3] «Опирайся на свои сильные стороны. Не думай об их.»\n[s4] «Не сомневайся в себе. Только сама себя затормозишь.»"
42170-79 = ""
42170-80 = ""
42170-82 = ""
42170-83 = "...Ты права."
42170-84 = "Если даже я сама в себя не верю, как могу просить остальных доверять мне?"
42170-85 = "Нужно просто довериться инстинктам и двигаться вперёд."
42170-86 = "RABBIT 1, приступаю к операции!"
42170-88 = "Станция Коусаги"
42170-90 = ""
42170-93 = ""
42170-97 = "Говорит RABBIT 1. Текущее время 10:40. Я прибыла в район операции."
42170-98 = "Как и ожидалось, охрана усилена."
42170-99 = ""
42170-101 = ""
42170-102 = "Шесть охранников у основных входов и выходов и ещё несколько патрулей по периметру..."
42170-103 = "Мне никак не пробраться на станцию так, чтобы хотя бы один охранник меня не заметил."
42170-104 = "[s] «Полагаю, лобовая атака не сработает?»"
42170-105 = "Будь у нас ещё двое, было бы реально..."
42170-106 = "Но одна я не успею вывести их из строя до того, как они вызовут подкрепление."
42170-107 = "Жаль, что остальных членов отряда здесь нет."
42170-108 = "Вот бы кто-нибудь устроил для нас отвлекающий манёвр..."
42170-109 = ""
42170-112 = "Ну-ну-ну. Кого я вижу."
42170-113 = ""
42170-115 = ""
42170-116 = ""
42170-119 = ""
42170-120 = ""
42170-121 = "Какая необычная случайность — встретиться именно здесь."
42170-122 = "[s] «Кто это?»"
42170-123 = ""
42170-124 = "Некогда искатель истины и гармонии с природой... Практик естественной жизни и минимализма."
42170-125 = "А теперь — слуга общественного блага..."
42170-126 = ""
42170-129 = ""
42170-130 = "Декарт цивилизованный!"
42170-131 = ""
42170-134 = "[ns5] «Не ожидал увидеть тебя здесь, Декарт.»\n[ns6] «Что ты здесь делаешь?»"
42170-137 = "Серьёзно? Форма ничего вам не подсказала?"
42170-138 = "Хотя вы всегда жили привилегированной жизнью над законом."
42170-139 = ""
42170-141 = ""
42170-142 = "Служба безопасности «Кайзера» дала мне «правильное» воспитание после ареста."
42170-143 = "Они основательно объяснили мне ошибочность моего прежнего пути — жизни паразита на дне общества, который только потребляет и ничего не даёт взамен."
42170-144 = "Как же ценен пот на собственном лбу!"
42170-145 = "Теперь я обрёл предназначение в службе безопасности «Кайзера»: работаю охранником и обеспечиваю безопасность граждан!"
42170-147 = "Э-Это здорово..."
42170-148 = "Допрашивать подозрительных лиц — обязанность охранника! А вы двое, крадущиеся и разведывающие станцию, особенно подозрительны!"
42170-149 = ""
42170-151 = ""
42170-152 = "Несмотря на наше прошлое, я не могу пренебречь долгом гражданина. Прошу сотрудничать при проверке!"
42170-153 = "Эм..."
42170-154 = "[s] «Можешь один раз просто закрыть на это глаза?»"
42170-155 = "Что? Вы хотите, чтобы я сделал вид, будто вас не видел?!"
42170-156 = "Сенсей, вы пытаетесь принизить мой долг охранника и ответственного гражданина?!"
42170-157 = "Я обязан защищать эту станцию — дом моих товарищей-Искателей!"
42170-159 = "...Корпорация «Кайзер» собирается взорвать станцию Коусаги."
42170-160 = ""
42170-163 = ""
42170-164 = "Ч-Что ещё за безумие?!"
42170-165 = "В это трудно поверить, но..."
42170-167 = "Мияко рассказала Декарту обо всём..."
42170-170 = "...В ваши слова трудно поверить."
42170-171 = "Нужно быть сумасшедшим, чтобы взорвать бомбу на такой густонаселённой станции! И лишь ради укрепления власти? Не может быть!"
42170-172 = "Хотя, если вспомнить, что корпорация «Кайзер» творила раньше, поверить уже не так трудно."
42170-173 = "Я на собственном опыте познал бездонную жадность службы безопасности «Кайзера»."
42170-174 = "«Кайзер» обещал выдавать охранникам по одному пудингу за смену..."
42170-175 = "Но вчера они заявили, что пудинг закончился! Знаете, что дали вместо него? Желе из конняку! Представляете?!"
42170-176 = "П-Понятно..."
42170-178 = "...Даже в таких условиях я тихо терпел и усердно работал."
42170-179 = "Я думал, что терпеть мелкие неудобства ради общего блага — отличительная черта ответственного гражданина...!"
42170-180 = "Но теперь вы хотите сказать, что Генеральный студенческий совет и корпорация «Кайзер», обладая всем своим богатством и властью, хотят уничтожить станцию Коусаги... чтобы накопить ещё больше богатства и власти?"
42170-181 = "И именно станцию Коусаги? Здесь живёт множество граждан и даже мои товарищи!"
42170-182 = "...Я не позволю этой элитарной схеме осуществиться!"
42170-183 = "Положитесь на меня. Я обещаю полное содействие, если речь идёт о защите станции Коусаги и всех моих товарищей внутри!"
42170-185 = "Спасибо за понимание, Декарт."
42170-186 = "Врагов намного больше, поэтому пробраться внутрь мы сможем только если ты отвлечёшь их."
42170-187 = "Я бы с радостью насолил злобным господам из «Кайзера», но после ареста всё моё оружие конфисковали."
42170-188 = "Даже этот жалкий пистолет — всего лишь игрушка с холостыми патронами."
42170-189 = "Это не проблема. Вот. У меня боеприпасов более чем достаточно."
42170-190 = ""
42170-192 = ""
42170-193 = "Ах. Вес заряженного оружия... Как же я по этому скучал."
42170-194 = "С меня хватит постоянных насмешек и притеснений, которые я терпел!"
42170-195 = "Спасибо, Мияко. Теперь настало время мне вернуться в роли Декарта, лидера Искателей!"
42170-197 = "Да, спасибо. Чем дальше уведёшь охранников от входа, тем лучше."
42170-198 = ""
42170-202 = ""
42170-203 = ""
42170-204 = ""
42170-205 = ""
42170-206 = "Все мои товарищи-Искатели, собирайтесь у станции Коусаги!"
42170-207 = "Злобные капиталисты корпорации «Кайзер» намерены осквернить наше драгоценное убежище своей ненасытной жадностью!"
42170-208 = "...А? Ты наконец отказался от всей этой истории с «Преступниками»?"
42170-209 = "Преследователей! Сокращенно от Преследователи счастья в нестяжании!"
42170-210 = ""
42170-212 = ""
42170-213 = "Кхм. Я никогда не отказывался от жизни без собственности."
42170-214 = "Я лишь пытался понять мышление тех, кто владеет вещами. И лицом к лицу столкнулся с жадностью, пропитавшей их души!"
42170-215 = "Увидев их зло вблизи, я больше не могу терпеть! Я не позволю солдатам «Кайзера» и дальше пускать корни на нашей территории!"
42170-216 = "Покажем этим жадным обжорам... красоту простоты!"
42170-217 = "Я в деле. Всё равно заняться нечем."
42170-218 = "А почему бы и нет? Люблю хорошие возможности устроить переполох!"
42170-219 = "Сегодня мы победим жадность! Сегодня мы победим капитализм!"
42170-220 = "Искатели! В атаку!"
42170-221 = ""
42170-223 = ""
42170-226 = "Эм, вам, наверное, стоит секунду подождать..."
42170-227 = "[s] «Он всегда появляется и исчезает как ураган...»"
42170-228 = "Не идеальный отвлекающий манёвр, но хаос хотя бы запутает противника."
42170-229 = "Я тоже не могу просто стоять в стороне. Сенсей, ведите!"
