[translation]
41010-1 = "Episódio 1;Unidade Especial Fora de Controle"
41010-5 = "Há quanto tempo, Sensei."
41010-6 = "[s] \"Ah, Rin-chan.\""
41010-7 = "...Quem você está chamando de \"Rin-chan\"?"
41010-8 = "Esse tipo de tratamento deveria ser mais..."
41010-9 = "Não, deixemos isso de lado."
41010-10 = "Entrei em contato porque gostaria de conversar brevemente sobre um assunto."
41010-11 = "Já faz um bom tempo desde que assumiu a Schale, não é?"
41010-12 = "Tenho recebido seus relatórios, então estou ciente de que muitas coisas aconteceram."
41010-13 = "Parece que tem atuado bastante por toda parte. Graças a isso, fomos muito ajudados por aqui também."
41010-14 = "Deixando isso de lado, há alguns pedidos que gostaria de fazer... por assim dizer."
41010-15 = "Mais especificamente, sobre os relatórios da Schale e os novos planos futuros do Conselho Estudantil Geral..."
41010-19 = "...Não, acho melhor conversarmos pessoalmente."
41010-20 = "Tem algum compromisso hoje à tarde?"
41010-21 = "Vou preparar ao menos um chá, então, se puder, venha até aqui."
41010-22 = "Estarei aguardando."
41010-28 = "Hum... Sensei, bom trabalho."
41010-29 = "O clima pareceu meio tenso... Será que vai ficar tudo bem?"
41010-30 = "[s1] \"Hmm, acho que vou levar bronca...\"\n[s2] \"Levar bronca da Rin é uma recompensa.\""
41010-31 = "Mas tenho certeza de que você não vai só levar bronca, não!"
41010-32 = "É-É mesmo...?"
41010-33 = "Mas tenho certeza de que você não vai só levar bronca, não!"
41010-34 = "Como a própria Rin-san disse, o Sensei tem se destacado muito por aí!"
41010-35 = "Ela até disse que vai preparar chá, então quem sabe não te recebe com uma baita hospitalidade!"
41010-36 = "[s] \"Seria ótimo se fosse assim.\""
41010-37 = "Com certeza vai ser! Vamos, Sensei, acho melhor já ir saindo!"
41010-44 = "Ah, Sensei. Estava aguardando."
41010-45 = "[s3] \"Quanto tempo.\"\n[s4] \"Vim receber a sua hospitalidade!\""
41010-46 = "Não temos muito tempo, então vamos direto ao assunto."
41010-47 = "...Como? Do que está falando?"
41010-48 = "Por que essa cara de decepção...? Eu só disse que \"prepararia ao menos um chá\"."
41010-49 = "Sente-se ali e aguarde, por favor."
41010-50 = "Não temos muito tempo, então vamos direto ao assunto."
41010-51 = "Como mencionei antes, o assunto diz respeito aos relatórios da Schale."
41010-52 = "[s] \"...?\""
41010-53 = "Não pretendo interferir no conteúdo das suas atividades. Sei muito bem que há ótimos comentários vindos de várias alunas..."
41010-54 = "O problema, porém, é o procedimento posterior."
41010-55 = "Você tem enviado relatórios e documentos ao Conselho Estudantil Geral, mas..."
41010-62 = "Por exemplo, este documento de despesas."
41010-63 = "Todo o detalhamento da fatura está escrito em algarismos arábicos."
41010-64 = "[s] \"...Não pode?\""
41010-65 = "Não, não pode."
41010-66 = "Ao preencher valores à mão em documentos oficiais, solicitamos que sejam escritos em algarismos kanji. Isso serve para evitar falsificações e erros de leitura."
41010-67 = "Além disso, veja este carimbo. Está deslocado 3 cm fora do campo."
41010-68 = "Falhas assim aumentam o trabalho de processamento posterior, então preciso que corrija..."
41010-69 = "Bem, basta fazer isso agora."
41010-70 = "[s5] \"Desculpe...\"\n[s6] \"...Rin, você não pode me ajudar também?\""
41010-71 = "Haa... Este é o trabalho do Sensei [USERNAME], da Schale, não é?"
41010-72 = "Haa... Este é o trabalho do Sensei [USERNAME], da Schale, não é?"
41010-73 = "Para começo de conversa, nada disso seria necessário se você tivesse entregado documentos sem erros desde o início."
41010-77 = "...E não é só isso. Por que está usando linguagem informal em relatórios como estes?"
41010-78 = "Mesmo sendo documentos confidenciais que ninguém de fora vai ler, escreva de forma adequada, por favor."
41010-79 = "Se tiver dúvidas, consulte o \"Artigo 15\" do regulamento de documentos oficiais do Conselho Estudantil Geral que lhe entreguei anteriormente..."
41010-82 = "(Depois disso, passei um bom tempo ouvindo vários apontamentos da Rin...)"
41010-89 = "Com licença, Rin-senp—"
41010-90 = "N-Não, Administradora. Preciso tratar de um assunto..."
41010-92 = "O que houve?"
41010-93 = "É que... é uma questão de emergência..."
41010-98 = "Hum, é sobre o desmantelamento da Academia Especial SRT... Parece que algumas alunas se rebelaram, ocuparam o parque e começaram um protesto..."
41010-99 = "E parece que as unidades preparadas de antemão estão com dificuldade para contê-las..."
41010-102 = "..."
41010-103 = "...Haa."
41010-104 = "Nesse caso, entre em contato com o Departamento de Segurança da Valkyrie."
41010-105 = "A-Ah, e-entendido...!"
41010-109 = "[ns7] \"Desculpe, acabei ouvindo sem querer...\"\n[ns8] \"Aconteceu algum problema?\""
41010-110 = "...Não, não se preocupe. É algo comum por aqui."
41010-111 = "...Não, não se preocupe. É algo comum por aqui."
41010-112 = "Desde o desaparecimento da Presidente do Conselho Estudantil Geral, esse tipo de coisa virou rotina."
41010-113 = "[s] \"O que é a Academia Especial SRT...?\""
41010-114 = "...SRT, ou seja, \"Special Response Team\"."
41010-115 = "Literalmente, era uma academia de elite voltada para missões especiais."
41010-116 = "Até pouco tempo atrás... enquanto a Presidente do Conselho Estudantil Geral ainda estava aqui."
41010-120 = "Agora, não é mais algo com que se preocupar."
41010-121 = "Vamos continuar? Quanto a este documento, o \"Artigo 21, parágrafo 3\" do regulamento de documentos oficiais..."
41010-124 = "(Algum tempo depois...)"
41010-130 = "Com licença, Administradora..."
41010-131 = "...Sim, houve outro problema?"
41010-132 = "Hum, é que..."
41010-133 = "As alunas do Departamento de Segurança enviadas para conter o protesto acabaram sendo contidas por elas..."
41010-134 = "...Quem iniciou o protesto foram apenas \"algumas alunas\", certo?"
41010-135 = "S-Sim. Em número, parece ser equivalente a apenas um esquadrão, mas..."
41010-136 = "Afinal, estamos falando da SRT, e o poder de fogo delas é bem elevado... Só o Departamento de Segurança não dá conta..."
41010-140 = "Que situação complicada. Não queria transformar isso em um escândalo..."
41010-141 = "...Não há escolha. Entre em contato com o \"Departamento de Segurança Interna\" da Academia de Polícia Valkyrie."
41010-142 = "Como elas são especializadas em \"operações antiterrorismo\", devem conseguir lidar com a situação, mesmo sendo a elite da SRT. Eu mesma avisarei o Gabinete de Defesa."
41010-143 = "S-Sim...!"
41010-147 = "[ns] \"Tem algo em que eu possa ajudar?\""
41010-148 = "Não precisa se incomodar. Isso é estritamente um problema do Conselho Estudantil Geral."
41010-149 = "O que preciso que você resolva primeiro é a papelada bem na sua frente."
41010-150 = "Espero estar enganada, mas..."
41010-151 = "Você não está pensando algo como \"assim consigo escapar da papelada\", está?"
41010-152 = "[s9] \"C-Claro que não...\"\n[s10] \"Bom! Vamos caprichar nessa papelada! Como é divertido!\""
41010-153 = "...Então, vamos continuar."
41010-154 = "...Então, vamos continuar."
41010-155 = "Como aqui, ao corrigir um carimbo, não se faz assim, e sim..."
41010-157 = "(Mais tarde)"
41010-164 = "Administradora..."
41010-168 = "Não me diga que..."
41010-169 = "Sim, todas as alunas do Departamento de Segurança Interna também..."
41010-170 = "Segundo o relatório, \"sem nem conseguir se aproximar do parque, a unidade foi aniquilada por uma chuva de disparos de precisão e armadilhas\"..."
41010-171 = "Os repórteres da Escola Kronos também chegaram ao local, e a transmissão ao vivo está esquentando ainda mais a situação..."
41010-172 = "Se continuar assim, o problema vai ficar cada vez maior..."
41010-173 = "..."
41010-174 = "Francamente, por que as coisas acontecem uma atrás da outra...?"
41010-178 = "Hum, Rin-senpai... Não seria justamente numa hora dessas que deveríamos pedir ajuda ao Sensei da Schale...?"
41010-179 = "Além da capacidade de comando do Sensei, também é possível mobilizar rapidamente alunas de elite de várias escolas..."
41010-180 = "Já que nem a Valkyrie conseguiu fazer frente, praticamente não nos resta outra opção..."
41010-181 = "..."
41010-182 = "...Haa."
41010-186 = "...Sensei, temos um pequeno problema."
41010-187 = "Em condições normais, gostaríamos de resolver isso por conta própria, mas..."
41010-188 = "Poderia cuidar disso para nós?"
41010-189 = "[s11] \"Sim, pode deixar comigo.\"\n[s12] \"Aí sim!!\""
41010-190 = "Certo, por enquanto não se preocupe com esta papelada. Eu dou um jeito nisso."
41010-191 = "Certo, por enquanto não se preocupe com esta papelada. Eu dou um jeito nisso."
41010-192 = "Acredito que já tenha uma noção geral da situação: algumas alunas da SRT estão fazendo um protesto. Por favor, vá detê-las."
41010-193 = "Como se trata de apenas um esquadrão, não creio que sejam muitas... mas o armamento da SRT é extremamente poderoso. Tome cuidado."
41010-194 = "Também há alunas da Valkyrie no local, então elas deverão dar suporte."
41010-195 = "Pois bem, boa sorte."
41010-197 = "Próximo;Visita Indesejada"
