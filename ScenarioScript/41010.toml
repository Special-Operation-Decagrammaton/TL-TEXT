[translation]
41010-1 = "Эпизод 1;Неподконтрольный специальный отряд"
41010-4 = ""
41010-5 = "Время летит слишком быстро, Сенсей. На связи Нанагами Рин."
41010-6 = "[s] «О. Привет, Ринни.»"
41010-7 = "Как… Вы только что меня назвали?"
41010-8 = "Пожалуйста, воздержитесь от подобного впредь."
41010-9 = "Ближе к делу."
41010-10 = "Я связываюсь с Вами по срочному вопросу."
41010-11 = "Вы довольно долго отсутствовали в Шале."
41010-12 = "Главный Студенческий Совет извлёк немалую пользу из Ваших действий, и мы обязаны выразить Вам благодарность."
41010-13 = "Главный Студенческий Совет извлёк немалую пользу из Ваших действий, и мы обязаны выразить Вам благодарность."
41010-14 = "Однако у меня возникли вопросы к текущей деятельности Шале"
41010-15 = "Касательно Ваших отчётов, а также руководящих принципов Главного Студенческого Совета…"
41010-16 = ""
41010-18 = ""
41010-19 = "Впрочем, подобные разговоры лучше вести лично."
41010-20 = "Сенсей, насколько я помню, Ваше расписание на сегодня свободно?"
41010-21 = "Давайте обсудим всё за чашкой чая."
41010-22 = "Прошу Вас, приходите в приёмную комнату Главного Студенческого Совета."
41010-23 = ""
41010-25 = ""
41010-27 = ""
41010-28 = "Молодец, Сенсей!"
41010-29 = "Кажется, страшная Рин собирается устроить Вам нагоняй… Вы в порядке?"
41010-30 = "[s1] «Ну, не скажу, что мне совсем не страшно.»\n[s2] «Ну, если наказывать меня будет Рин, то…»"
41010-31 = "Да ладно, не может же она звать Вас только ради того, чтобы отругать!"
41010-32 = "Ч-Что?! Ты о чём?"
41010-33 = "Да ладно, не может же она звать Вас только ради того, чтобы отругать!"
41010-34 = "Как и сказала Рин, Вы решили кучу проблем по всему Кивотосу."
41010-35 = "Возможно, она просто хочет подарить Вам много вкусностей в качестве награды за проделанную работу!"
41010-36 = "[s] «Будем надеяться, что так оно и есть.»"
41010-37 = "Верно, Сенсей! Настало время получить вкусняшки! Отправляемся в здание Главного Студенческого Совета!"
41010-43 = ""
41010-44 = "Добро пожаловать, Сенсей. Спасибо, что нашли время встретиться со мной."
41010-45 = "[s3] «Давно не виделись, Рин.»\n[s4] «Так где вкусняхи?»"
41010-46 = "Время - это роскошь, так что давайте начнём."
41010-47 = "А? Что за вкусняхи?"
41010-48 = "…Вы выглядите немного расстроенным."
41010-49 = "Прошу, присаживайтесь, сейчас я приготовлю чай."
41010-50 = "Время - это роскошь, так что давайте начнём."
41010-51 = "Как я уже сказала по телефону, я хотела обсудить свои опасения насчёт ведения некоторых дел в Шале."
41010-52 = "[s] «Я сделал что-то не так?»"
41010-53 = "Дело не в том, что я не ценю всё то, что Вы сделали с момента своего прибытия. Ученицы по всему Кивотосу так и сыплют похвалами в Ваш адрес."
41010-54 = "Однако главная проблема заключается в том, что происходит после того, как конфликт исчерпан."
41010-55 = "Я хотела бы, чтобы Вы взглянули на эти отчёты о проделанных операциях, которые Вы нам предоставили."
41010-56 = ""
41010-58 = ""
41010-59 = ""
41010-61 = ""
41010-62 = "Вот этот отчёт о расходах!"
41010-63 = "Платёжные извещения мало того что написаны от руки, так ещё и арабскими цифрами!"
41010-64 = "[s] «У меня такое чувство, что это плохо?»"
41010-65 = "Даже очень."
41010-66 = "Любые денежные суммы в официальных документах должны быть написаны китайскими иероглифами, во избежание подделок и прочих инцидентов."
41010-67 = "И если Вы обратите внимание, печать здесь поставлена аж в трёх сантиметрах от указанного поля."
41010-68 = "Если Вы не будете следовать официальным процедурам и правилам оформления в своих отчётах, мы, в свою очередь, не сможем помочь с их утверждением."
41010-69 = "Так раз уж Вы здесь, прошу, исправьте все эти документы, прежде чем уйдёте."
41010-70 = "[s5] «Я так понимаю, это не предложение…»\n[s6] «Ты не будешь помогать мне, Рин?»"
41010-71 = "Верно. Сначала Вам нужно разобраться со своими обязанностями,  [USERNAME] Сенсей."
41010-72 = "Не буду. Это исключительно Ваша работа, [USERNAME] Сенсей."
41010-73 = "Если бы Вы следовали надлежащей процедуре с самого начала, мы бы сейчас здесь не сидели."
41010-74 = ""
41010-76 = ""
41010-77 = "А также, не могли бы Вы объяснить столь неформальный тон в отчёте?"
41010-78 = "Поскольку это конфиденциальные документы, они должны быть написаны с подобающей строгостью."
41010-79 = "Обращаясь к пункту 15 официального руководства Главного Студенческого Совета…"
41010-82 = "(Рин продолжала ругать меня ещё долгое, долгое время.)"
41010-88 = ""
41010-89 = "Эм, Рин…"
41010-90 = "То есть, Вице-Президент… Мне нужно поговорить с тобой кое о чём."
41010-92 = "Да, Аю… Глава Штаба?"
41010-93 = "Ну, тут срочное дело."
41010-94 = ""
41010-96 = ""
41010-97 = ""
41010-98 = "*шёпот* Снос Академии SRT был запланирован на сегодня. Однако когда рабочие собирались начать, студенты захватили парк, протестуя против закрытия школы."
41010-99 = "У нас не хватит сил, чтобы справиться с этим… так что снос откладывается."
41010-100 = ""
41010-102 = "..."
41010-103 = "Свяжись с Бюро Безопасности из Полицейской Академии Валькирия."
41010-104 = "Приказы Главного Студенческого Совета абсолютны. Студенты должны быть задержаны."
41010-105 = "Так и знала, что ты это скажешь. Я займусь этим."
41010-106 = ""
41010-108 = ""
41010-109 = "[ns7] «Эй. Я вообще-то всё ещё здесь.»\n[ns8] «Похоже, что-то пошло совсем не так.»"
41010-110 = "Знаю. Подобные проблемы стали обычным явлением с тех пор, как исчезла президент Главного Студенческого Совета."
41010-111 = "Подобные проблемы стали обычным явлением с тех пор, как исчезла президент Главного Студенческого Совета."
41010-112 = "Это не Ваша забота, Сенсей."
41010-113 = "[s] «Что за Академия SRT?»"
41010-114 = "SRT расшифровывается как Специальная Группа Реагирования."
41010-115 = "Это элитная академия для специальной подготовки студентов."
41010-116 = "Она являлась высокоэффективной силой под командованием президента Главного Студенческого Совета."
41010-117 = ""
41010-119 = ""
41010-120 = "Раз президента нет, то нет и смысла в существовании данной организации."
41010-121 = "Итак, теперь перейдём к пункту 21, параграфу 3 нашего руководства."
41010-124 = "(Некоторое время спустя.)"
41010-125 = ""
41010-129 = ""
41010-130 = "Эм, Вице-Президент...…"
41010-131 = "Да, Глава Штаба?"
41010-132 = "Ну, видите ли…"
41010-133 = "Бюро Безопасности было полностью разгромлено протестующими."
41010-134 = "Все до единого?! Я думала, что там всего несколько студентов!"
41010-135 = "Так и есть! Там всего лишь один отряд. Предположительно, четыре студента."
41010-136 = "Но студенты SRT слишком хорошо обучены и вооружены, чтобы их могло скрутить обычное Бюро Безопасности."
41010-137 = ""
41010-139 = ""
41010-140 = "Надеялась, что к этому не придётся прибегать."
41010-141 = "Свяжись с Бюро Внутренней Безопасности из Полицейской Академии Валькирия. Оборонный комитет поможет нам скоординировать действия и направить их силы."
41010-142 = "Возможно, те девочки и элита, но Бюро Внутренней Безопасности как раз специализируется на контртерроре. Подавите их."
41010-143 = "Раз ты так говоришь, хорошо!"
41010-144 = ""
41010-146 = ""
41010-147 = "[ns] «Ты уверена, что всё в порядке?»"
41010-148 = "Знаю, о чём Вы думаете. Вам незачем вмешиваться в дела Главного Студенческого Совета."
41010-149 = "Ваше текущее задание - завершить исправление отчётов."
41010-150 = "Я просто уточняю, но…"
41010-151 = "Надеюсь, Вы не предлагаете помощь, просто чтобы избежать бумажной работы."
41010-152 = "[s9] «Я-я даже и не думал об этом! Вообще никогда!»\n[s10] «Что-то я внезапно так сильно захотел переписать все отчёты!»"
41010-153 = "…Я рада слышать это. Ради всеобщего блага."
41010-154 = "…Я рада слышать это. Ради всеобщего блага."
41010-155 = "Тогда продолжим с того места, где остановились. Чтобы исправить неправильно поставленные печати..."
41010-157 = "(Некоторое время спустя.)"
41010-160 = ""
41010-163 = ""
41010-164 = "Вице-президент..."
41010-165 = ""
41010-167 = ""
41010-168 = "Студенты из Бюро Внутренней Безопасности?.."
41010-169 = "Все до единой повержены."
41010-170 = "Согласно отчёту, они даже не смогли приблизиться к парку. Их почти сразу вывели из строя снайперы и мины-ловушки."
41010-171 = "Что ещё хуже, репортёры из Кроноса пронюхали про этот хаос и уже устремились на место происшествия."
41010-172 = "Другими словами, дела совсем плохи!"
41010-173 = "..."
41010-174 = "Беда никогда не приходит вовремя, верно?"
41010-175 = ""
41010-177 = ""
41010-178 = "Ну, Рин… Я тут подумала… Сенсей из Шале ведь уже здесь…"
41010-179 = "Ты же тоже читала отчёты. У Сенсея прекрасные лидерские способности, а также есть влияние и полномочия запрашивать помощь практически откуда угодно."
41010-180 = "Теперь, когда ученицы из Валькирии выбыли из строя, думаю, Шале - наш единственный шанс…"
41010-181 = "..."
41010-182 = "...Тц."
41010-183 = ""
41010-185 = ""
41010-186 = "Сенсей. Как Вы, возможно, уже догадались, мы столкнулись с небольшими трудностями."
41010-187 = "Хоть Главный Студенческий Совет и должен решать подобные вопросы самостоятельно…"
41010-188 = "Похоже, Ваша помощь действительно необходима."
41010-189 = "[s11] «Я только и ждал, когда ты это скажешь.»\n[s12] «Настал мой звёздный час!»"
41010-190 = "В качестве благодарности я сама разберусь с Вашими отчётами. Только на этот раз."
41010-191 = "В качестве благодарности я сама разберусь с Вашими отчётами. Только на этот раз."
41010-192 = "Ваша задача - подавить протест студентов Академии SRT. И сделать это быстро."
41010-193 = "Их может быть и немного, но не стоит недооценивать их. Они высококлассные специалисты, и у них на вооружении есть тяжёлая артиллерия."
41010-194 = "Офицеры Полицейской Академии Валькирия объяснят все детали, как только Вы прибудете на место."
41010-195 = "Я рассчитываю на Вас, Сенсей."
41010-197 = "Следующий эпизод;Незваный гость в парке"
