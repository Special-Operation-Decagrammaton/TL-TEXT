[translation]
10026080-1 = "Эпизод 8;Место E: Укрытие за водопадом"
10026080-3 = ""
10026080-4 = "Смотрите! Наверняка это тот водопад вон там!"
10026080-5 = "Фух! Он немного дальше, чем я думала... и подъём довольно крутой!"
10026080-6 = "За водопадом есть пещера..."
10026080-7 = "Снаружи её совсем не видно. Стоило ожидать такого от Совета."
10026080-8 = "Давайте пересчитаемся, прежде чем войдём. Все нормально поднялись?"
10026080-9 = "Да!"
10026080-10 = "Более-менее..."
10026080-11 = "Хорошо. Все добрались целыми— Сенсей, вы выглядите измотанным."
10026080-12 = "[s1] «Я... в порядке...»\n[s2] «Похоже, мне нужно больше тренироваться...»"
10026080-15 = "Хаха... Подъём был довольно крутым, правда? Надо было идти медленнее."
10026080-16 = "Но... Где Уи? Ещё секунду назад она была рядом со мной."
10026080-17 = "Уи...?"
10026080-19 = ""
10026080-20 = ""
10026080-21 = "Ух... Аргх... Фух... Фух... Гх..."
10026080-22 = "Это... Это... Хргх..."
10026080-23 = "Нет... Нет... Не могу... говорить... Кх... Хугггх... Хф..."
10026080-24 = "Я... Я добралась... Эх..."
10026080-25 = ""
10026080-27 = ""
10026080-29 = "Уи?!"
10026080-31 = "Фух... Так лучше... Спасибо, что подождали..."
10026080-32 = "Подниматься... сюда... без... нормальной дороги... это пытка..."
10026080-33 = "Но... Теперь я уверена... Они бы не стали так хорошо это прятать, если бы место не было важным..."
10026080-34 = "Всё остальное, что мы видели, было отвлекающим манёвром..."
10026080-35 = ""
10026080-37 = "Дымовой завесой, чтобы скрыть... какую-нибудь ужасную вещь, которую мы сейчас увидим..."
10026080-38 = "Камеру пыток... место казни... какой-нибудь религиозный ритуал... или... что-то ещё..."
10026080-39 = "Сейчас мы увидим истинное лицо Сестринства!"
10026080-40 = ""
10026080-42 = ""
10026080-43 = "[ns3] «Уи. Хватит.»\n[ns4] «Ты опять говоришь странные вещи.»"
10026080-46 = "А, точно. Понимаю..."
10026080-47 = "Простите. Я так устала, что сначала сказала, а потом подумала."
10026080-48 = "Но мы обязаны раскрыть правду. Я лишь надеюсь, что всё окажется не так плохо, как я боюсь."
10026080-49 = "Да. Я тоже на это надеюсь..."
10026080-50 = ""
10026080-52 = ""
10026080-53 = "Эм..."
10026080-54 = "Прозвучало совсем неубедительно, да? Простите. Из меня плохая актриса."
10026080-55 = "[s5] «Со временем научишься...»\n[s6] «Начнём расследование?»"
10026080-58 = "Есть..."
10026080-60 = "Укрытие за водопадом"
10026080-62 = "И всё это за обычным водопадом... Кто бы мог подумать?"
10026080-63 = "Снаружи действительно ничего не видно. Неплохой трюк для тайного места."
10026080-64 = ""
10026080-66 = ""
10026080-68 = "Ух. Тц..."
10026080-69 = "[s7] «...Уи?»\n[s8] «Что случилось? Ты неважно выглядишь.»"
10026080-72 = "Шум воды такой громкий, что я почти не слышу остальных."
10026080-73 = "Не обращайте внимания, Сенсей. Я просто разговаривала сама с собой..."
10026080-74 = "Хм... Да, это определённо проблема..."
10026080-75 = "...■■■ ■■ ■■■ ■■■■■."
10026080-76 = "■■■■■■■■... ♡♡♡"
10026080-77 = "[s] «...?»"
10026080-78 = "Видите? Вы не услышали ни одной непристойности из того, что я сказала. Попробуй и ты, Кохару!"
10026080-79 = "Не может быть!"
10026080-80 = "[s9] «Может, осмотримся?»\n[s10] «Эй! Сейчас не время для такого! Нам нужно расследовать!»"
10026080-85 = "Мы шли всё глубже и глубже в пещеру."
10026080-86 = "Наконец мы наткнулись на несколько длинных деревянных ящиков."
10026080-87 = "[ns11] «А? Это...?»\n[ns12] «Что это за ящики?»"
10026080-90 = "...Ч-Что?! Что куча деревянных ящиков делает в таком месте?"
10026080-91 = "Они достаточно большие, чтобы в них поместился человек. Они немного похожи на—"
10026080-92 = ""
10026080-94 = ""
10026080-95 = "Гробы."
10026080-96 = ""
10026080-99 = ""
10026080-101 = "Форма у них не совсем обычная, но именно гробы приходят на ум."
10026080-102 = "Г-Гробы...?! Зачем кому-то ставить здесь гробы?!"
10026080-103 = "Хината. Кохару?"
10026080-104 = "Д-Да? Ты звала меня?"
10026080-105 = "Да. Простите, но вам двоим, наверное, лучше на минутку отвернуться."
10026080-106 = "На всякий случай..."
10026080-107 = "На всякий случай чего...?"
10026080-108 = "Ну... Просто на всякий случай..."
10026080-109 = "На случай, если тот, кто их сюда поставил, использовал их по прямому назначению. Я открою один, чтобы проверить."
10026080-110 = "Я знаю, что это неуважительно по отношению к мёртвым и всё такое, но ради расследования мне нужно проверить."
10026080-111 = "О-О! В таком случае тебе может понадобиться сила. Я помогу..."
10026080-112 = "Нет, Хината."
10026080-113 = "...?!"
10026080-114 = "Как я уже сказала, мне нужно, чтобы вы двое просто отвернулись."
10026080-115 = "Мне и так не по себе. Не хочу делать ещё хуже и заставлять тебя смотреть на то, что может оказаться внутри, Хината."
10026080-116 = "Так что просто... сделай, как я говорю. Пожалуйста."
10026080-118 = "А... Эм..."
10026080-119 = "Д-Да... Хорошо. Я отвернусь."
10026080-120 = ""
10026080-122 = ""
10026080-124 = ""
10026080-125 = "Кхм!"
10026080-126 = "А я? Разве ты не хочешь, чтобы я тоже отвернулась?"
10026080-127 = "...?"
10026080-128 = "А... Простите. Мне почему-то показалось, что подобные вещи вас не беспокоят..."
10026080-129 = "Можете тоже отвернуться, если хотите. Достаточно, чтобы содержимое увидел кто-то один."
10026080-130 = "...Теперь мне интересно, за какого человека ты меня принимаешь..."
10026080-131 = "Но ты не ошиблась. Давай посмотрим вместе."
10026080-132 = "А вы тоже не против, Сенсей?"
10026080-133 = "[s13] «Да, но постараемся проявить уважение.»\n[s14] «Да, я не против.»"
10026080-136 = "Ладно, тогда..."
10026080-137 = "Я приоткрою его совсем немного."
10026080-138 = "...Ух..."
10026080-139 = ""
10026080-142 = "Слишком темно. Я не могу толком разглядеть... что там внутри..."
10026080-143 = "...Мм? А..."
10026080-144 = "О боже..."
10026080-145 = ""
10026080-148 = "...?! Ч-Что это был за звук?!"
10026080-149 = "Ч-Что происходит?!"
10026080-151 = ""
10026080-152 = ""
10026080-153 = ""
10026080-155 = "Хм... Значит, вот как."
10026080-156 = "У нас снова компания... Казалось бы, пора уже привыкнуть к засадам."
10026080-157 = "Хотя, если честно, технически это МЫ здесь незваные гости."
10026080-159 = "Сейчас совершенно не время репетировать стендап, Ханако!"
10026080-160 = ""
10026080-163 = ""
10026080-164 = ""
10026080-165 = "[ns15] «Уходим отсюда! Быстрее!»\n[ns16] «Есть только один вариант. Придётся прорываться!»"
10026080-168 = "Почему это постоянно происходит?!"
10026080-169 = "...Сенсей, скажите, что нам делать!"
10026080-170 = "Пошли!"
