[translation]
201080-1 = "Episódio 8; Ilusões e Deduções"
201080-2 = ""
201080-4 = "[ns1] \"...... Por que você tá de óculos escuros?\"\n[ns2] \"Aliás, esses óculos escuros combinaram super com você!\""
201080-5 = "É um disfarce. Ninguém pode descobrir quem eu sou."
201080-6 = "Não é questão de estilo ou vaidade. É estritamente um disfarce."
201080-7 = "[s] \"Disfarce......?\""
201080-8 = "Sim."
201080-9 = "A partir de agora, faremos uma investigação de campo.#nPrecisamos encontrar alguém que ainda se lembre da verdadeira Presidente do Conselho Estudantil Federal."
201080-10 = "Passei o dia inteiro observando o comportamento de todos no Conselho,#ne não vi uma única pessoa estranhar a postura daquela garota."
201080-11 = "Nem mesmo as representantes dos distritos autônomos manifestaram qualquer desconfiança.#nDiante de todos esses fatos, a conclusão é inevitável――"
201080-12 = "A adulteração das memórias se espalhou por toda a extensão de Kivotos."
201080-13 = "[s] \"A memória de toda Kivotos foi adulterada......\""
201080-14 = "Tenho plena consciência de que soa como um disparate absurdo."
201080-15 = "Contudo, se houver outras pessoas como nós dois que ainda guardem a lembrança da Presidente original......"
201080-16 = "Talvez possamos encontrar a pista que levará ao paradeiro da 'verdadeira Presidente do Conselho'."
201080-17 = "[s3] \"Por enquanto, parece ser o único caminho mesmo......\"\n[s4] \"Vou sondar as alunas que costumam passar na Schale também.\""
201080-20 = "Muito obrigada. Ter o seu apoio é um alívio imenso."
201080-21 = ""
201080-23 = ""
201080-24 = "...... É claro que cheguei a cogitar a hipótese de a minha própria mente estar me pregando peças."
201080-25 = "Ao ver o Conselho recuperar a confiança e o ritmo normal de trabalho como se nada tivesse acontecido,#nessa dúvida só aumentou dentro do meu peito, mas......"
201080-26 = "Ainda assim, aquela pessoa――"
201080-27 = ""
201080-28 = "Rin-chan."
201080-29 = ""
201080-30 = "Rin-chan～"
201080-32 = "Rin-chan!"
201080-33 = ""
201080-34 = "―― Não é, de maneira alguma, a Presidente do Conselho que vive nas minhas memórias."
201080-35 = ""
201080-37 = ""
201080-38 = "Peço desculpas, acabei me estendendo demais."
201080-39 = ""
201080-41 = ""
201080-42 = "[ns] \"Mas vem cá...... você vai continuar usando esses óculos escuros o tempo todo?\""
201080-43 = "Com certeza. Se a minha identidade for descoberta, comprometerá toda a investigação."
201080-44 = "Acima de tudo, se correr o boato de que a Administradora-Chefe desconfia da própria Presidente,#npodemos desencadear uma nova onda de pânico institucional."
201080-45 = "Não levantar suspeitas deve ser a nossa prioridade absoluta."
201080-46 = "[s] （Acho que esses óculos chamam ainda mais atenção......）"
201080-47 = "Que cara é essa?"
201080-48 = "Não vai me dizer que...... esses óculos ficaram estranhos em mim?"
201080-49 = "[s5] \"N-Não, imagina!\"\n[s6] \"É que...... ficou estiloso até demais!\""
201080-52 = "............"
201080-53 = "Não temos tempo a perder. Vamos continuar a conversa pelo caminho."
201080-54 = "Primeiro, vamos cobrir os centros comerciais onde as alunas mais se reúnem."
201080-56 = "Distrito de Shiratori - Corgi Town"
201080-57 = ""
201080-58 = ""
201080-59 = "（Começamos a interrogar as pessoas no centro comercial sobre a Presidente do Conselho）"
201080-60 = "...... A Presidente do Conselho? Nossa, foi um alívio enorme ela ter voltado!"
201080-61 = "Enquanto ela estava sumida, as coisas por aqui estavam um caos total......"
201080-62 = "Com a volta dela, tomara que o perigo de sermos pegos no fogo cruzado de tiroteios na rua diminua, né?"
201080-63 = ""
201080-64 = "Se a imagem da Presidente mudou? Ih, sei lá, será?"
201080-65 = "Sou péssima pra guardar o rosto das pessoas......"
201080-66 = "A cor do cabelo dela deu uma mudadinha, talvez......?"
201080-67 = ""
201080-68 = "Mas é claro que ela mudou! Eu sou super atenta a essas coisas!"
201080-69 = "Comparado a antes do sumiço...... o cabelo dela tá uns cinco centímetros mais curto!"
201080-70 = "Cuidar daquele cabelo sozinha é impossível, ela com certeza tem que ir no salão regularmente......"
201080-71 = "Fico me perguntando qual cabeleireiro cuidou dela enquanto ela esteve fora!"
201080-73 = "（Ninguém tinha a menor lembrança da verdadeira Presidente......）"
201080-74 = ""
201080-75 = "A impressão que a Presidente passa mudou? Sei lá, não reparei."
201080-76 = "Erika-chan, você notou alguma coisa diferente nela?"
201080-77 = "Ué...... nada demais também."
201080-78 = "A Presidente do Conselho sempre foi daquele jeito, não?#nAquele sorriso refinado, os olhos roxos brilhantes e aquele lindo cabelo loiro-platinado――"
201080-79 = "Tanto que até virou febre entre as garotas pintar o cabelo imitando o 'Loiro Presidente', né?"
201080-80 = "Sim, sim! Foi a maior moda!"
201080-81 = "Eu fiquei até na dúvida se não descoloria as pontas do meu também."
201080-82 = "Ela sempre foi o centro das atenções, impossível a gente não lembrar."
201080-83 = ""
201080-84 = "[ns7] \"...... Entendi.\"\n[ns8] \"Até as alunas de Gehenna prestam tanta atenção assim nela, né.\""
201080-87 = "Mas é óbvio! Quem não conhece a Presidente do Conselho Estudantil Federal que cuida da segurança de Kivotos?"
201080-88 = ""
201080-90 = ""
201080-91 = "...... Makoto? Quem é essa? Nunca ouvi falar.#nHum, parece que já escutei esse nome em algum lugar, mas sei lá......"
201080-93 = "（E em alguns momentos, a nossa presença acabou levantando suspeitas）"
201080-94 = ""
201080-97 = ""
201080-98 = "Parados aí os dois!"
201080-99 = "São vocês que estão espalhando boatos caluniosos sobre a Presidente do Conselho por aqui, não são?!"
201080-100 = "Pelo amor de Deus...... de onde vocês tiram esses boatos tão sem pé nem cabeça?"
201080-101 = "A população está assustada e a gente vive recebendo reclamações na central por causa disso!"
201080-102 = "[s] \"Não, calma aí, não era a nossa intenção......\""
201080-103 = "Espere...... esse rosto――"
201080-104 = "[USERNAME] Sensei?!"
201080-105 = "P-Peço mil desculpas! Viemos averiguar apenas porque recebemos denúncias de moradores!"
201080-106 = "Se o próprio Sensei está envolvido, certamente deve ter ocorrido algum mal-entendido."
201080-107 = "Contudo, peço que tomem cuidado.#nMesmo com a volta da Presidente, a população ainda não recuperou totalmente a sensação de paz."
201080-108 = "Ainda há grupos exigindo investigações aprofundadas sobre as causas reais do desaparecimento dela......"
201080-109 = "Parece que o D.U. vai continuar bem agitado por mais algum tempo."
201080-113 = ""
201080-114 = "[ns] \"No fim das contas, não achamos uma única viva alma que se lembrasse da antiga Presidente.\""
201080-115 = "...... É verdade."
201080-116 = "[s9] \"...... Que tal a gente voltar por hoje?\"\n[s10] \"Já está ficando tarde e o vento tá bem gelado.\""
201080-119 = "Só mais um pouco...... por favor."
201080-120 = "Se procurarmos um pouco mais, tenho certeza de que vamos encontrar alguém."
201080-121 = "Só mais trinta minutos, eu imploro――"
201080-123 = "Pensei que o dia de hoje seria um fiasco total...... mas jamais imaginei topar com o Sensei da Schale a essa hora!"
201080-124 = ""
201080-127 = ""
201080-128 = "E ainda por cima escondido num beco escuro a sós com uma aluna......"
201080-129 = "Isso aqui é――"
201080-130 = ""
201080-132 = ""
201080-133 = "UM FURO DE REPORTAGEM HISTÓRICO!"
201080-134 = "[s] \"Mai?!\""
201080-135 = "Sim! A âncora principal do canal da Chronos e a jornalista implacável que jamais deixa a verdade escapar!#nKazamaki Mai na área!"
201080-136 = "Caramba～ hoje foi só entrevista cancelada atrás da outra e eu já tava super desanimada......#nmas dar de cara com o [USERNAME] Sensei numa situação dessas?!#nAgora sim vou voltar com uma manchete de primeira!"
201080-137 = ""
201080-139 = ""
201080-140 = ""
201080-141 = ""
201080-142 = "Mas vem cá, quem é essa garota misteriosa aí do seu lado?"
201080-143 = "Se vocês estão se encontrando às escondidas num lugar ermo desses...... ela é alguma autoridade poderosa......?"
201080-144 = "Ou será...... que vocês dois têm um relacionamento proibido e inconfessável......?!"
201080-145 = "[s11] （Tinha que ser logo a Mai pra flagrar a gente uma hora dessas......）\n[s12] （Que enrascada......）"
201080-148 = "...... Ué?"
201080-149 = "...... Ué, ué, ué? Eu conheço esse rosto de algum lugar......"
201080-150 = "Essas orelhas pontudas, esse cabelo negro com reflexos azulados......"
201080-151 = "Tenho quase certeza de que já fiz uma matéria sobre você na Chronos, mas quem era mesmo......"
201080-152 = ""
201080-154 = ""
201080-155 = ""
201080-156 = "...... AH!"
201080-158 = "（Droga, meu disfarce foi por água abaixo......）"
201080-159 = "Você é a Lina, a vocalista da misteriosa banda idol 'K.G.S.C', não é?!"
201080-160 = "...... Como disse?"
201080-161 = ""
201080-163 = ""
201080-164 = ""
201080-165 = "Nem adianta bancar a desentendida!#nAquele grupo de idols secreto que surgiu como um cometa no festival de bandas, explodiu de sucesso e desapareceu sem deixar vestígios――#nsem revelar os nomes reais nem a escola de origem! Era você, não era?!"
201080-166 = "Eu tentei de tudo para conseguir uma entrevista exclusiva na época, mas foi impossível arrancar qualquer informação......"
201080-167 = "Por favor, me conceda uma declaração em primeira mão nesta oportunidade única......!"
201080-168 = "Aliás, antes de mais nada, me diga o seu nome verdadeiro e qual é a sua academia?!"
201080-169 = "[s] \"Mai, calma, respira fundo um segundo.\""
201080-170 = "C-Com essa cara séria de repente...... o que foi que aconteceu?"
201080-171 = "[s13] \"...... A Lina-chan tá me ajudando numa operação oficial da Schale.\"\n[s14] \"Isso envolve a segurança nacional de Kivotos, então guarde segredo.\""
201080-172 = "...... Quem foi que te deu autorização para me chamar de 'Lina-chan'?"
201080-174 = "Informação confidencial logo agora......"
201080-175 = "Tudo bem. Se é um pedido direto do Sensei, não tenho escolha."
201080-176 = "Se eu ignorar isso, corro o risco de receber uma bomba na redação do jornal a qualquer momento......"
201080-177 = "Mas compreenda o meu lado também, não posso voltar com as mãos abanando para o jornal!#nNão teria como me adiantar algum outro furo de reportagem em troca?"
201080-178 = "Algum escândalo bombástico que só o Sensei da Schale tem conhecimento......"
201080-180 = "Ou algum segredinho seu que nunca confessou para ninguém......!"
201080-181 = "[s] （Aproveitando a oportunidade, deixa eu sondar com a Mai também）"
201080-182 = ""
201080-185 = "[ns] \"Então me diz: você ouviu falar que a Presidente do Conselho foi substituída por outra pessoa?\""
201080-186 = "Como assim? Quer dizer que trocaram de líder durante o período em que ela esteve desaparecida?"
201080-187 = ""
201080-189 = ""
201080-190 = ""
201080-191 = ""
201080-192 = "Pelo amor de Deus...... que viagem é essa, Sensei?"
201080-193 = "Ninguém no mundo daria crédito para uma fofoca dessas."
201080-194 = "Quer dizer...... o fato de o respeitado Sensei da Schale acreditar numa teoria da conspiração dessas poderia render uma matéria e tanto, não acha......?"
201080-195 = "[s] \"Por favor, essa vergonha eu prefiro não passar......\""
201080-196 = "De qualquer maneira, nunca ouvi nada parecido nos bastidores."
201080-197 = "Substituir uma figura pública da envergadura da Presidente sem que ninguém perceba......#nvocê tem noção do quão impossível seria fazer algo assim?"
201080-198 = "...... Ah, espera aí! Agora que você tocou no assunto, lembrei de uma coisa bizarra."
201080-199 = "Teve uma pessoa que veio com uma ladainha parecida: dizendo que a Presidente tinha olhos e cabelos azul-celeste, e que quando voltou estava completamente diferente――"
201080-201 = "QUEM FOI ESSA PESSOA?!"
201080-203 = "Ai, que susto! De onde veio essa histeria toda?!"
201080-204 = "Onde e com quem você ouviu isso?! Precisamos falar com essa pessoa agora mesmo!"
201080-205 = "Calma...... é um cliente assíduo de um bar antigo lá na ala oeste de Aoba......"
201080-206 = "Ele me mandou uma mensagem dizendo que tinha uma história imperdível, aí fui até lá gravar uma matéria.#nSó que o sujeito só ficava desfiando um monte de lendas urbanas sem nexo."
201080-207 = "Se forem até lá agora, acho bem capaz de encontrarem ele.#nO cara anda com um monte de tralhas e bugigangas estranhas penduradas no corpo, impossível não reconhecer."
201080-208 = "Muito obrigada! Você acabou de nos prestar uma ajuda incalculável!"
201080-209 = "[s] \"Valeu demais, Mai! Te devo essa!\""
201080-210 = "D-De nada, eu acho......"
201080-211 = ""
201080-213 = ""
201080-215 = ""
201080-216 = "O Sensei, uma idol secreta e a Presidente do Conselho...... mas que diabos de combinação maluca é essa?!"
201080-218 = "No Próximo Episódio; Boa Noite, Sr. Orwell"