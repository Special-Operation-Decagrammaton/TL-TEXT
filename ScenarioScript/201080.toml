[translation]
201080-1 = "Эпизод 8;Иллюзии и умозаключения"
201080-2 = ""
201080-4 = "[ns1] «...Почему ты в тёмных очках?»\n[ns2] «Они новые? Тебе идут!»"
201080-5 = "Для маскировки. Я не хотела, чтобы меня кто-нибудь узнал."
201080-6 = "Это не модный аксессуар. Это маскировка."
201080-7 = "[s] «Маскировка...?»"
201080-8 = "Да."
201080-9 = "Я собираюсь тайно опросить людей и выяснить, помнит ли кто-нибудь, кроме вас, МОЮ президента Генерального ученического совета."
201080-10 = "Выполняя работу для Административного совета, я очень внимательно наблюдала за сотрудниками. Похоже, никто даже не удивлён внезапной перемене во внешности президента."
201080-11 = "Даже руководители отдельных академических округов никак особенно не отреагировали после видеозвонков с ней."
201080-12 = "Поэтому я пришла к выводу, что воспоминания всех жителей Кивотоса были изменены."
201080-13 = "[s] «ВСЕХ в Кивотосе?»"
201080-14 = "Да. Я понимаю, насколько неправдоподобно это звучит."
201080-15 = "Но если мы найдём кого-то ещё, кто помнит прежнюю президента Генерального ученического совета — ту, которую помним мы с вами..."
201080-16 = "Возможно, мы сможем выяснить, где сейчас настоящая президент."
201080-17 = "[s3] «Похоже, теперь это наш единственный вариант...»\n[s4] «Я также попробую расспросить студентов, которые заходят в Шале.»"
201080-20 = "Спасибо. Услышав это от вас, я почувствовала некоторое облегчение."
201080-21 = ""
201080-23 = ""
201080-24 = "...Сначала я думала, что ошибочны именно мои воспоминания."
201080-25 = "Я сомневалась в себе всё сильнее, наблюдая, как она располагает к себе всех, с кем встречается. Я собственными глазами видела, насколько положительно её присутствие влияет на Генеральный ученический совет."
201080-26 = "Но она..."
201080-27 = ""
201080-28 = "Ринни."
201080-29 = ""
201080-30 = "Ринни..."
201080-32 = "Ринни!"
201080-33 = ""
201080-34 = "...определённо не президент."
201080-35 = ""
201080-37 = ""
201080-38 = "Простите. Я отняла у вас слишком много времени."
201080-39 = ""
201080-41 = ""
201080-42 = "[ns] «Важнее другое: ты так и будешь носить эти очки?»"
201080-43 = "Разумеется. Во время этого расследования никто не должен знать, кто я."
201080-44 = "Общественность отреагирует плохо, если узнает, что главный администратор ставит под сомнение личность президента Генерального ученического совета."
201080-45 = "Мне нужно полностью скрыть свою личность, чтобы не вызвать никаких подозрений."
201080-46 = "[s] «(В таком виде ты выглядишь невероятно подозрительно...)»"
201080-47 = "Почему вы так на меня смотрите?"
201080-48 = "...Мне странно в этих очках?"
201080-49 = "[s5] «В-вовсе нет!»\n[s6] «На самом деле я подумал, что они мило выглядят!»"
201080-52 = "..."
201080-53 = "Времени мало, поговорим по дороге."
201080-54 = "Наша первая цель — торговый район. Туда часто приезжают студенты из самых разных академий."
201080-56 = "Город Ширатори, квартал Corgi Town"
201080-57 = ""
201080-58 = ""
201080-59 = "Мы ненавязчиво расспрашивали людей в оживлённом центре города о президенте Генерального ученического совета."
201080-60 = "...Президент Генерального ученического совета? Я рада, что она вернулась."
201080-61 = "Пока её не было, жить было куда тяжелее."
201080-62 = "Теперь, когда она вернулась, я меньше боюсь случайно попасть под перестрелку."
201080-63 = ""
201080-64 = "Новая внешность президента Генерального ученического совета?"
201080-65 = "Эм... Она выглядит иначе? Я плохо запоминаю лица."
201080-66 = "Может, она покрасила волосы?"
201080-67 = ""
201080-68 = "А, она точно отличается от прежней. У меня зоркий глаз, так что я уверена."
201080-69 = "По сравнению с прошлым президент Генерального ученического совета... подстриглась! На пять сантиметров!"
201080-70 = "Самой так ровно подстричься было бы трудно, значит, пока её не было, она ходила в салон..."
201080-71 = "Но в какой?! Кто же это мог быть?"
201080-73 = "Большинство опрошенных вообще не помнили прежнюю президента Генерального ученического совета."
201080-74 = ""
201080-75 = "Президент Генерального ученического совета кажется другой? Хм, думаешь?"
201080-76 = "А ты, Эрика? Помнишь?"
201080-77 = "Хм-м... Не особо."
201080-78 = "Мне кажется, она выглядит примерно так же. Фиолетовые глаза, платиновые светлые волосы и красивая улыбка, из-за которой к ней было немного страшно подойти..."
201080-79 = "В прошлом семестре в модных журналах даже ходил тренд «Президентский блонд», вдохновлённый светлыми волосами президента Генерального ученического совета."
201080-80 = "Точно-точно! Он был суперпопулярным."
201080-81 = "Я даже думала покрасить кончики волос в президентский блонд! Хи-хи!"
201080-82 = "Мы всегда следим за последними трендами, а Кивотос буквально крутится вокруг неё. Уж мы-то точно заметили бы, если бы что-то изменилось."
201080-83 = ""
201080-84 = "[ns7] «...В этом есть смысл.»\n[ns8] «Значит, Президент популярна даже среди студентов Геенны?»"
201080-87 = "Ну да. Пусть нам и не слишком интересны новости, именно она там следит, чтобы Кивотос был в безопасности и всё такое."
201080-88 = ""
201080-90 = ""
201080-91 = "...А? «Макото»? Эм, имя вроде слегка знакомое."
201080-93 = "...Нас даже остановили, приняв за «подозрительных личностей»."
201080-94 = ""
201080-97 = ""
201080-98 = "Эй, вы! Стоять!"
201080-99 = "Это вы тут распространяете ложные слухи о личности президента Генерального ученического совета?"
201080-100 = "Она только вернулась! Зачем распространять такую злонамеренную клевету?"
201080-101 = "А если из-за вашей лжи люди начнут подавать жалобы?!"
201080-102 = "[s] «Нет, мы не это хотели...»"
201080-103 = "Что, разве это не...?"
201080-104 = "[USERNAME] Сенсей?!"
201080-105 = "Эм, простите. Нас направили сюда после звонка с сообщением."
201080-106 = "Если это вы, то, должно быть, просто недоразумение."
201080-107 = "Но всё равно будьте осторожнее. То, что президент вернулась, ещё не значит, что теперь всё прекрасно."
201080-108 = "Люди начинают собираться и требуют объяснений насчёт её исчезновения и того, чем она занималась всё это время."
201080-109 = "...Похоже, какое-то время в D.U. будет весьма неспокойно."
201080-113 = ""
201080-114 = "[ns] «В итоге мы так и не нашли никого, кто помнил бы прежнюю президента.»"
201080-115 = "...Ты права."
201080-116 = "[s9] «...Может, пора возвращаться?»\n[s10] «Уже поздно, и ночной воздух становится холодным.»"
201080-119 = "Пожалуйста... Пожалуйста, подождите ещё совсем немного."
201080-120 = "Уверена, мы кого-нибудь найдём. Нужно лишь постараться ещё чуть-чуть."
201080-121 = "Дайте мне ещё тридцать минут."
201080-123 = "Я уже решила, что сегодня мне совсем не везёт, а тут встретить Сенсея из Шале в таком месте..."
201080-124 = ""
201080-127 = ""
201080-128 = "Да ещё и застать вас за тайной встречей со студентом в тёмном переулке..."
201080-129 = "Это..."
201080-130 = ""
201080-132 = ""
201080-133 = "...сенсация!"
201080-134 = "[s] «Май...?!”"
201080-135 = "Ага, это я! Главная ведущая канала Кронос и неутомимая репортёрша, которая никогда не упускает правду из виду! Казамаки Май из Школы журналистики Кронос!"
201080-136 = "Ну надо же! Я уже решила, что день провален, когда моё интервью внезапно отменили, а потом наткнулась на [USERNAME] Сенсея в таком компрометирующем положении... Благодаря вам я хотя бы не вернусь с пустыми руками!"
201080-137 = ""
201080-139 = ""
201080-140 = ""
201080-141 = ""
201080-142 = "Но важнее другое: кто этот студент?"
201080-143 = "Раз вы разговариваете не в Шале, да ещё так скрытно, она наверняка какая-нибудь важная шишка из академии..."
201080-144 = "*ах!* Или это тайные отношения, которые вы пытаетесь скрыть от публики?!"
201080-145 = "[s11] «(Дело плохо.)»\n[s12] «(Не ожидал встретить здесь кого-то из Кроноса...)»"
201080-148 = "Хм..."
201080-149 = "...А? Почему-то вы кажетесь знакомой. Мы раньше встречались?"
201080-150 = "Эти острые уши и чёрные волосы с синеватым оттенком... Я точно где-то это видела."
201080-151 = "Я совершенно уверена, что мы уже брали у вас интервью на канале Кронос. Кто же это был...?"
201080-152 = ""
201080-154 = ""
201080-155 = ""
201080-156 = "...А!"
201080-158 = "(Меня раскрыли.)"
201080-159 = "Вы ведь Рина? Вокалистка K.G.S.C., той загадочной идол-группы?"
201080-160 = "Что...?"
201080-161 = ""
201080-163 = ""
201080-164 = ""
201080-165 = "Вся фишка K.G.S.C. была в тайне! Никто не знает их настоящих личностей или академий, они появились и исчезли словно пылающая комета: выиграли конкурс групп, а потом растворились без следа!"
201080-166 = "Я та-а-ак давно хотела сделать о вас материал, но никак не могла найти хотя бы одну зацепку!"
201080-167 = "С тех пор вы горячая тема в интернете! Можно комментарий, пожалуйста?"
201080-168 = "Нет, сначала скажите ваше имя и академию!!"
201080-169 = "[s] «Май, успокойся.»"
201080-170 = "Ч-Что такое? Почему вы так серьёзно смотрите?"
201080-171 = "[s13] «Рин — то есть Рири — помогает Шале с важным делом.»\n[s14] «Мы защищаем безопасность Кивотоса, поэтому, пожалуйста, сохрани это в тайне.»"
201080-172 = "...Не называйте меня Рири."
201080-174 = "Цк, не верится, что вы ставите мне эмбарго на публикацию..."
201080-175 = "Ладно-ладно. Что мне остаётся — отказать самому СЕНСЕЮ?"
201080-176 = "Если люди узнают, что я проигнорировала вашу искреннюю просьбу, в следующий раз нам и правда могут прислать бомбу."
201080-177 = "Но всё же с пустыми руками возвращаться нельзя... Может, дадите мне какую-нибудь интересную сенсацию?"
201080-178 = "Например, скандал между руководителями ученического совета, о котором можете знать только вы..."
201080-180 = "Или какой-нибудь ваш секрет! Такой, которым вы ещё ни с кем не делились!"
201080-181 = "[s] «(Вообще-то это хорошая возможность.)»"
201080-182 = ""
201080-185 = "[ns] «Ты слышала слухи, что президента Генерального ученического совета подменили?»"
201080-186 = "Что? Президента Генерального ученического совета подменили кем-то, когда она пропала?"
201080-187 = ""
201080-189 = ""
201080-190 = ""
201080-191 = ""
201080-192 = "*вздох* Вы ХОТИТЕ, чтобы меня отменили?"
201080-193 = "Даже если я сошлюсь на вас как на источник, никто не поверит в ТАКОЕ безумие."
201080-194 = "Хотя погодите... Я могла бы написать статью о том, как Сенсей из Шале всерьёз поддерживает эту теорию заговора. Публика бы её проглотила!"
201080-195 = "[s] «Пощади...»"
201080-196 = "В любом случае, я даже шёпотом ничего подобного не слышала."
201080-197 = "Не думаю, что кого-то настолько известного, как президент Генерального ученического совета, можно подменить так, чтобы никто не заметил. Да и какой вообще мотив?"
201080-198 = "Постойте, кажется, я кое-что вспомнила."
201080-199 = "Кто-то говорил что-то такое. Клялся, что у президента были голубые глаза и голубые волосы, а потом она вдруг стала совсем другим человеком—"
201080-201 = "Кто?! Кто тебе это сказал?!"
201080-203 = "Ого! Ч-Что такое? Почему вам так нужно знать?"
201080-204 = "Нам необходимо встретиться с этим человеком. Где и от кого ты это услышала?"
201080-205 = "Я-Я услышала это от завсегдатая старого бара в западном районе Аоба..."
201080-206 = "Я пришла туда за интервью, потому что слышала об интересной сенсации, но ушла разочарованной. Всё, что я услышала, — куча нелепых, совершенно невероятных городских легенд."
201080-207 = "Обычно он бывает там примерно в это время. Ищите парня, обвешанного всяким хламом."
201080-208 = "Спасибо. Ты нам очень помогла."
201080-209 = "[s] «Спасибо, Май! Я точно у тебя в долгу!»"
201080-210 = "Н-Не стоит..."
201080-211 = ""
201080-213 = ""
201080-215 = ""
201080-216 = "Сенсей, идол и президент Генерального ученического совета... Что это вообще за компания?"
201080-218 = "Следующий Эпизод;Добрый вечер, мистер Оруэлл"
