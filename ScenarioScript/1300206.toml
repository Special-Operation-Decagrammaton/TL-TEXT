[translation]
1300206-1 = "Гордость гурмана"
1300206-2 = "Восточный ресторан возле Геенны"
1300206-3 = "Возвращаясь с работы в академии Геенна, я заглянул в китайский ресторан и случайно встретил там Акари."
1300206-4 = "Ого, Сенсей! Какое совпадение. Тоже пришёл пообедать?"
1300206-5 = "Отлично, я тоже! Здесь есть особое «испытание гурмана» — можно есть мапо-тофу сколько угодно."
1300206-6 = "Если хочешь, попробуем испытание мапо-тофу вместе?"
1300206-7 = "Что, ты хочешь обычную порцию? Но гора мапо-тофу — это же чистое блаженство..."
1300206-8 = "Ну, если неинтересно, как хочешь. Закажем?"
1300206-9 = "Одну обычную порцию мапо-тофу и одну порцию для испытания гурмана, пожалуйста."
1300206-10 = "Порция для испытания — для взрослого?"
1300206-11 = "Нет, для меня. Может, по мне и не скажешь, но в испытаниях гурманов я не новичок!"
1300206-12 = "Ахаха. Наш мапо-тофу — тяжёлое испытание, сколько бы вы обычно ни ели..."
1300206-13 = "Подождите немного. Еда скоро будет готова."
1300206-15 = "(Мне кажется... или официант как-то странно посмотрел?)"
1300206-17 = "Спасибо за ожидание. Ваш обычный мапо-тофу и порция для испытания."
1300206-18 = "Если съедите эти десять порций за тридцать минут, платить не придётся. А если закончите раньше, можете заказать ещё. Количество не ограничено!"
1300206-19 = "...Не спешите и наслаждайтесь."
1300206-20 = "Ого... Уже чувствую этот острый аромат. По одному виду понятно, насколько это вкусно!"
1300206-21 = "Ну что, приступим!"
1300206-22 = "[s] «Приятного аппетита.»"
1300206-23 = ""
1300206-24 = "...Хм? Странно. Этот мапо-тофу не такой на вкус, как я помню."
1300206-25 = "Сенсей, можно попробовать немного твоей обычной порции?"
1300206-26 = "[s] Поделиться с ней обычным мапо-тофу."
1300206-27 = "Ням, ням. ...Понятно. Жаль видеть, что ещё остались рестораны, которые прибегают к таким дешёвым трюкам."
1300206-28 = "[s] «С твоим мапо-тофу что-то не так?»"
1300206-29 = "По сравнению с твоим, мой залили чрезмерным количеством острого соуса. Похоже, так они подстраивают испытание в свою пользу."
1300206-30 = "Из-за того, что я могу съесть очень много чего угодно, люди забывают, что я всё-таки член Общества гурманов. Я очень требовательна к качеству еды."
1300206-31 = "Даже в испытании, где главное количество, у блюда должен быть минимальный уровень качества. А этот мапо-тофу... до него не дотягивает."
1300206-32 = "Если кто-то мухлюет с едой ради лёгкой прибыли... я сурово его накажу."
1300206-34 = "...Спасибо за еду! И ещё одну миску мапо-тофу, пожалуйста."
1300206-35 = "(Н-Невозможно. Не прошло и десяти минут, а она уже закончила третью миску?)"
1300206-36 = "(В каждой порции для испытания — десять обычных порций мапо-тофу!)"
1300206-37 = "Алло... вы меня слышите? Ещё одну миску мапо-тофу для испытания, пожалуйста!"
1300206-38 = "Э-эм, госпожа... вы уже завершили испытание. Вы съели все десять порций... Может, стоит остановиться?"
1300206-39 = "Простите? Что вы имеете в виду? Разве вы сами не сказали, что участник может есть неограниченное количество мапо-тофу до окончания времени?"
1300206-40 = "Чтобы испытание было честным для обеих сторон, исходные правила должны строго соблюдаться. Разве нет?"
1300206-41 = "И я ведь даже не жаловалась на невероятно острый соус, которым вы залили мапо-тофу... Хи-хи-хи."
1300206-42 = "П-Простите! Мы не возьмём с вас плату за еду... Только простите нас!"
1300206-43 = "Нет! Я пришла набить живот мапо-тофу, а не слушать ваши извинения."
1300206-44 = ""
1300206-45 = "Принесите следующую миску мапо-тофу, пожалуйста!"
1300206-47 = "После этого Акари за полчаса съела шестьдесят порций мапо-тофу и поставила новый рекорд..."
