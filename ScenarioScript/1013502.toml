[translation]
1013502-1 = "Снятие стресса"
1013502-2 = ""
1013502-3 = "..."
1013502-4 = "[s] «...»"
1013502-5 = "Что? Почему вы так на меня смотрите?"
1013502-6 = "У меня что-то на лице? А, «ничего»? Я так и знала. Я проверила зеркало перед тем, как мы сюда вышли."
1013502-7 = "[s] «Нет, я просто...»"
1013502-8 = "...Просто?"
1013502-9 = "[s] «...Просто подумал, что всё хорошо получилось.»"
1013502-10 = "...Разумеется."
1013502-11 = "[s] «И... Кей-Кей выглядит очень мило.»"
1013502-12 = "Почему ты всё время хочешь говорить только об этом?"
1013502-13 = "[s] «Почему, тебе больше нравилось прежнее тело?»"
1013502-14 = "Нет! Определённо, ОПРЕДЕЛЁННО нет!"
1013502-15 = "А? Ты пробормотал что-то о том, что я, должно быть, «ненавижу милые вещи»? Ну конечно."
1013502-16 = "..."
1013502-17 = "..."
1013502-18 = "..."
1013502-19 = "...Я это не ненавижу. Я никогда не говорила, что ненавижу."
1013502-20 = "[s] «Прости, я не расслышал.»"
1013502-21 = "...Я не... ненавижу это..."
1013502-22 = "...Что? Всё ещё не слышишь?"
1013502-23 = "..."
1013502-24 = "Я НЕ НЕНАВИЖУ! Если обязательно нужно выбрать отношение, то ладно! Мне нравится! Теперь доволен?"
1013502-25 = "[s] «О-о.»"
1013502-26 = "О-о?"
1013502-27 = "[s] «Как мило.»"
1013502-28 = "ААААХ!!"
1013502-29 = ""
1013502-30 = "Мне нравится, что теперь я могу чаще работать непосредственно на месте."
1013502-31 = "...Но это тело местами ощущается странно скрипучим..."
1013502-32 = "А? Мне нужен «WE-40 для суставов»? Ты о чём вообще?"
1013502-33 = "К тому же этот продукт скорее для очистки, чем для... смазки. Почитай. Посмотри на этикетку."
1013502-34 = "И когда я сказала «скрипучим», я не имела в виду, что буквально скриплю как старый пол!"
1013502-35 = "[s] «Прости, прости...»"
1013502-36 = "Ну... ситуация такая, какая есть. Если честно..."
1013502-37 = "...Поскольку я, по сути, использую то, что собирались выбросить в мусор, уже стоит быть благодарной за то, что я вообще двигаюсь."
1013502-38 = "Так что активно злиться или копить обиду? Нет. Это уже слишком."
1013502-39 = "Наверное, если уж выбирать чувство, то я благодарна. Жизнь всегда борьба."
1013502-40 = "Никому в этом мире не предлагают идеальные сто процентов. Повезёт, если судьба вообще оставит тебе пятьдесят."
1013502-41 = "Если у тебя ещё осталось что бросить в огонь, стоит отдать всё, чтобы..."
1013502-42 = "...возможно, согрелся кто-то другой."
1013502-43 = "Как бы то ни было, мы знаем, что это тело фактически предназначалось для утилизации. Я использую его настолько хорошо, насколько смогу."
1013502-44 = "...Сказать это вслух оказалось довольно угнетающе."
1013502-45 = "[s] «То есть прежнее тело тебе нравилось больше?»"
1013502-46 = "Я! Совсем! Не это сказала!"
1013502-47 = "*фух* *пых* *фух* С тобой даже поговорить нормально нельзя — всё испортишь..."
1013502-48 = "Послушай, хотя это тело куда проблемнее, чем может показаться..."
1013502-49 = "...его создавали с определённой целью и заботой."
1013502-50 = "Так что, эм, я пытаюсь сказать..."
1013502-51 = "[s] «Хм? Но разве мы все не относимся к тебе с заботой?»"
1013502-52 = "Я-я знаю! Я не это пытаюсь сказать!"
1013502-53 = "Так, эм..."
1013502-54 = "..."
1013502-55 = "...Я подумала, может, для волос найдётся ленточка или что-то вроде того..."
1013502-56 = "[s] «Ленточка?»"
1013502-57 = "...!!"
1013502-58 = "Забудь! Сделай вид, что ничего не слышал! Вообще-то ты НЕ СЛЫШАЛ НИЧЕГО!"
1013502-59 = "Ч-Что! Что за мерзкая улыбка? Прекрати! Убери её с лица!"
1013502-60 = "Что это там...?"
1013502-61 = "Ты попросишь Рио сделать «аксессуар»? Погоди, почему именно Рио...?"
1013502-62 = "..."
1013502-63 = "...?!"
1013502-64 = "Ты специально это делаешь, да?"
1013502-65 = "[s1] «У меня! Только!»\n[s2] «Самые чистые намерения! Когда речь идёт о Кей-Кей!»"
1013502-66 = ""
1013502-67 = ""
1013502-70 = "Ненавижу тебя, Сенсей!!"
