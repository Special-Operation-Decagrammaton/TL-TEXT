[translation]
10056090-1 = "Episode 9;Value Seen Only There"
10056090-3 = "(Night had fallen over the Blue Hole.)"
10056090-4 = "(The night sea was pitch black, so much that you could not see ahead.)"
10056090-5 = "(My back hurts from being tied up and sitting on the deck...)"
10056090-9 = "Ugh... I am sorry, Sensei."
10056090-10 = "Dragging you into something like this..."
10056090-11 = "[s1] \"You do not need to worry about it.\"\n[s2] \"I am kind of used to being tied up like this...\""
10056090-14 = " Used to it... Used to it!?"
10056090-15 = "Schale's duties are a lot harder than I thought..."
10056090-16 = "Anyway, do we not need to come up with a countermeasure?"
10056090-17 = "We bought some time thanks to Sensei, but we cannot afford to be carefree."
10056090-18 = "Once morning comes, that idiot might change her mind."
10056090-19 = "President, are we really going to go get whale bones and ambergris?"
10056090-20 = "Getting involved in things like that is a felony on the level of getting your diver's license revoked, but..."
10056090-24 = "If Sensei's safety is on the line, we have no choice..."
10056090-25 = "[s3] \"Let us put me aside for a moment.\"\n[s4] \"What do you all want to do?\""
10056090-28 = "Of course, I do not want to cooperate with pirates."
10056090-29 = "B-But Sensei's safety is at stake. #nIt is not something we can just refuse because we do not like it..."
10056090-30 = "I guess this time we have no choice but to do as Nanami says..."
10056090-31 = "[s5] \"I am fine.\"\n[s6] \"You do not have to do things you hate.\""
10056090-37 = "I understand. #n...That we cannot live doing only what we like."
10056090-38 = "Just like cleaning the ship's bottom to pay off our debts."
10056090-39 = "To gain something, you have to swallow the things you hate."
10056090-40 = "[s] \"That does not mean you can just do whatever you want.\""
10056090-44 = "[ns7] \"If there is an immutable value you are pursuing--\"\n[ns8] \"You do not need to compromise just to cater to others.\""
10056090-51 = "Unchanging... value..."
10056090-53 = "Sensei. Have you ever seen ambergris?"
10056090-54 = "When ambergris is underwater, it emits a fantastic, soft fragrance while gradually dissolving."
10056090-55 = "But if you take it out of the water and shine a light on it... it just looks like an ugly stone."
10056090-56 = "Much of what slumbers in the sea is the same."
10056090-57 = "Sparkling bubbles vanish at the water's surface, and jellyfish that swam gracefully cannot keep their shape outside of the water."
10056090-58 = "Some things have more value shining when they are hidden than when they reveal themselves. #nSo--"
10056090-62 = "I do not want to bring important things out of the water."
10056090-67 = "President..."
10056090-71 = "...A whale."
10056090-72 = "Did it come to see us because the ships are gathered?"
10056090-73 = "[s] \"...Even whales come up to the surface sometimes, huh.\""
10056090-74 = "We run into them often during voyages."
10056090-75 = "When they are in a good mood, they even leap out of the water."
10056090-76 = "Though whales are super heavy, so they sometimes get hurt when they jump."
10056090-77 = "[s9] \"Being above water must be dangerous for a whale...\"\n[s10] \"Why do they go so far as to jump?\""
10056090-80 = "There are various theories, but... I believe it is curiosity."
10056090-81 = "They hear fun sounds from above the water, but when they look up, they only see the bottom of a ship."
10056090-82 = "So they poke their heads out to check what the source of the sound is."
10056090-83 = "[s11] \"Much like the value visible only beneath the water...\"\n[s12] \"There is also value that can only be seen above the water, huh.\""
10056090-86 = "...!"
10056090-87 = "[s] \"It might take courage, but do not lie to yourself.\""
10056090-92 = "[ns] \"Because your potential is limitless.\""
10056090-94 = "Hah..."
10056090-95 = "...I do not want to use it in a place like this."
10056090-96 = "Even if Nanami is skilled in navigation, it does not mean we have no countermeasure."
10056090-97 = "...Because they cannot catch us underwater."
10056090-98 = "We are fast~"
10056090-99 = "However, the problem is Sensei..."
10056090-100 = "While we escape underwater, the pirates will likely not just stand by and watch."
10056090-101 = "If only we had flashbangs or smoke grenades..."
10056090-105 = "We can just borrow them from a friend."
10056090-109 = "...A friend?"
10056090-114 = "Yeah. Let us ask our newly made friend."
