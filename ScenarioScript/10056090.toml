[translation]
10056090-1 = "Episode 9; Values Seen Only Hence"
10056090-3 = "(Night fell over the blue hole.)"
10056090-4 = "(It was so dark that you couldn't make out anything in front of you.)"
10056090-5 = "(My back was in pain from sitting on the deck for so long while tied up...)"
10056090-9 = "Urgh... I'm so sorry, Sensei."
10056090-10 = "I didn't mean for you to get dragged into something like this..."
10056090-11 = "[s1] \"Don't worry about it.\"\n[s2] \"I'm already used to being tied up like this...\""
10056090-14 = "You're used to it... Used to this!?"
10056090-15 = "Seems like work at Schale is a lot more serious than I thought..."
10056090-16 = "So like, shouldn't we come up with a plan?"
10056090-17 = "Sensei managed to buy us some time, so we shouldn't spend it dawdling around."
10056090-18 = "Who knows if that psycho decides to change her mind in the morning."
10056090-19 = "President, are you really going to collect the whale bones and the ambergris?"
10056090-20 = "Pulling a stunt like this is a serious offense and a surefire way to get your diver's#nlicense revoked..."
10056090-24 = "However, with Sensei's safety at stake, I don't have much of a choice..."
10056090-25 = "[s3] \"Let's say, hypothetically, we forget about my safety.\"\n[s4] \"In that case, what do you all want to do?\""
10056090-28 = "Obviously, I have no desire to cooperate with such people as pirates."
10056090-29 = "B-but, your safety is on the line here. #nThis isn't something you can refuse just because you don't like it..."
10056090-30 = "It seems like all I can do this time is do what Nanami wants..."
10056090-31 = "[s5] \"I'll be fine.\"\n[s6] \"If there's something you don't want to do, then don't.\""
10056090-37 = "I know. #n...I know you can't live doing only what you love."
10056090-38 = "It's just like how we were hull cleaning to pay off our debt."
10056090-39 = "In order to get what you want, you must swallow the bitter pills as well."
10056090-40 = "[s] \"I'm not saying you should do whatever you want.\""
10056090-44 = "[ns7] \"I'm saying that if there are any unchanging values that you hold dear to your hearts—\"\n[ns8] \"Then there's no need for you to compromise on them to accommodate others.\""
10056090-51 = "Unchanging... values..."
10056090-53 = "Sensei. Have you ever seen ambergris before?"
10056090-54 = "When placed in water, it slowly dissolves while releasing a soft, fantastical scent."
10056090-55 = "But once you remove it from the water and shine a light on it... all it looks like is an#nugly rock."
10056090-56 = "There is much in the ocean that is just like that."
10056090-57 = "Sparkling bubbles vanish as they touch the water's surface, and the jellyfish that#nonce swam so beautifully underwater lose their shape once removed from it."
10056090-58 = "Likewise, there are values that shine more brilliantly when hidden than revealed. #nThat's why—"
10056090-62 = "I do not wish to take something so dear to me out of the water."
10056090-67 = "President..."
10056090-71 = "...A whale."
10056090-72 = "Did it come to check out all of the ships gathered here?"
10056090-73 = "[s] \"...So whales come up to the surface too.\""
10056090-74 = "We come across them all the time on voyages."
10056090-75 = "When they're in a good mood, they'll even jump out of the water."
10056090-76 = "But whales are suuper heavy, so they sometimes get hurt when they do it."
10056090-77 = "[s9] \"If going atop the water is dangerous for the whales...\"\n[s10] \"Then why do they jump like that?\""
10056090-80 = "There are a variety of theories, but... Personally, I think it's because of curiosity."
10056090-81 = "They hear all sorts of interesting sounds from beyond the surface, but all they can see from below are the keels of the ships."
10056090-82 = "That's why they peek their head out of the water—to see what that sound really is."
10056090-83 = "[s11] \"Just as there are values seen only from below the water's surface...\"\n[s12] \"So too are there values seen only from above the water's surface.\""
10056090-86 = "...!"
10056090-87 = "[s] \"It takes courage, sure—but you shouldn't lie to yourselves.\""
10056090-92 = "[ns] \"After all, all of you possess infinite potential.\""
10056090-94 = "Sigh..."
10056090-95 = "...I didn't want to use this in a place like this, but..."
10056090-96 = "The thing is, Nanami's excellent voyaging skills are not without flaw."
10056090-97 = "...She can't catch us if we're underwater."
10056090-98 = "We are faaast~"
10056090-99 = "It's just, the problem here is you, Sensei..."
10056090-100 = "While we're escaping through the water, the pirates won't be sitting around#ntwiddling their thumbs."
10056090-101 = "If only we could cover ourselves with something like flashbangs or smoke#ngrenades..."
10056090-105 = "We could ask our friends for help."
10056090-109 = "...Friends?"
10056090-114 = "Yep. Let's try asking our new friends."