[translation]
84300100300-5 = ""
84300100300-6 = "Здравствуйте, почётная гостья!"
84300100300-7 = ""
84300100300-10 = ""
84300100300-11 = "«Почётная гостья»? ...Кто, я?"
84300100300-12 = "Да, вы! «Семинар» даже дал мне фотографию, чтобы я вас узнала. Вот, посмотрите!"
84300100300-13 = ""
84300100300-15 = ""
84300100300-16 = "Это... действительно моё фото, да."
84300100300-18 = "Эй, Асуна! Нельзя просто вот так к ней подходить...!"
84300100300-19 = "Она занимает высокий пост в Тринити. Прояви немного уважения!"
84300100300-20 = ""
84300100300-23 = ""
84300100300-24 = ""
84300100300-25 = "Простите, а вы двое вообще кто?"
84300100300-26 = "А? Мы? Мы..."
84300100300-28 = "Я Карин. Я гид на Выставке Миллениума."
84300100300-29 = ""
84300100300-31 = ""
84300100300-32 = "Рада знакомству."
84300100300-33 = "И... прошу прощения. Я не привыкла говорить настолько официально."
84300100300-34 = "Всё в порядке. Со мной не обязательно формальничать. Скорее это я должна быть вам благодарна, ведь вы здесь, чтобы обо мне позаботиться."
84300100300-35 = "Если честно, я и сама далеко не всегда формальна. Так что говорите свободно."
84300100300-36 = "Эм... но казначей «Семинара» сказала быть вежливыми..."
84300100300-37 = "Вежливость и формальность — не одно и то же. В любом случае я не хочу, чтобы мероприятие было слишком скованным."
84300100300-38 = "И помните: весь смысл события — сблизить наши школы. Поэтому говорите так, как вам удобно. Более того, считайте это официальной просьбой с нашей стороны."
84300100300-39 = "О-официальной просьбой? Правда? Так можно?"
84300100300-41 = "Хорошо, тогда дальше буду совсем по-простому. Добро пожаловать!"
84300100300-43 = "«Дальше», то есть..."
84300100300-44 = "Не ожидала, что здесь будут гиды. Думала, мне самой придётся вести своих студентов."
84300100300-45 = "Ну, быть гидом и вести за собой — тоже не одно и то же. По крайней мере показать вам всё мы можем."
84300100300-46 = "..."
84300100300-47 = ""
84300100300-49 = ""
84300100300-50 = "Хм? Что такое?"
84300100300-51 = "...Нет, ты права. Конечно, именно студенты Миллениума лучше всего подходят, чтобы проводить гостей по Миллениуму."
84300100300-52 = "К вам ещё кто-нибудь присоединится?"
84300100300-54 = "Ага! На другой стороне есть ещё трое!"
84300100300-55 = "Позвать их?"
84300100300-56 = ""
84300100300-58 = ""
84300100300-63 = ""
84300100300-64 = "...Здравствуйте, я Мурокаса Аканэ, тоже гид. Буду рада работать с вами."
84300100300-65 = "Асума Токи. Если что-нибудь понадобится, обращайтесь в любое время."
84300100300-66 = "Вообще-то «в любое время»... может оказаться немного сложно."
84300100300-67 = ""
84300100300-70 = ""
84300100300-71 = ""
84300100300-73 = ""
84300100300-74 = ""
84300100300-75 = ""
84300100300-76 = ""
84300100300-78 = "Эй, все? Туда нельзя. Пожалуйста, подождите."
84300100300-79 = ""
84300100300-83 = "...Все?"
84300100300-86 = ""
84300100300-87 = "Простите. Здесь много людей, поэтому мне нужно ненадолго отойти."
84300100300-88 = "Надеюсь, вам понравится осмотр."
84300100300-89 = ""
84300100300-91 = ""
84300100300-92 = "Я тоже пойду."
84300100300-93 = ""
84300100300-95 = ""
84300100300-97 = ""
84300100300-98 = "...Они отключились."
84300100300-99 = "Как видите, каждая из них сопровождает студентов Тринити. Всего студентов довольно много."
84300100300-101 = "Да, вижу."
84300100300-102 = "Похоже, вы обе вложили немало усилий только ради меня. Не хочу отнимать у вас больше времени, чем необходимо."
84300100300-104 = "Хорошо! Тогда пошли! Следуйте за мной!"
84300100300-105 = ""
84300100300-107 = ""
84300100300-108 = ""
84300100300-109 = "П-погоди, Асуна...!"
84300100300-110 = ""
84300100300-113 = ""
84300100300-114 = "Если бросишь тех, кого сопровождаешь, ты уже не гид!"
84300100300-115 = ""
84300100300-117 = ""
84300100300-118 = "...Ладно, пойдём не спеша."
