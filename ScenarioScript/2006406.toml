[translation]
2006406-1 = "The Secret Garden"
2006406-2 = "(I visited Wild Hunt to return the item I had been keeping for Urara.)"
2006406-6 = "This is an inspection. Your cooperation, please."
2006406-12 = "Oh? This is... from the banned play, isn't it?"
2006406-15 = "Well, it was removed from the list this time, so it should be fine. You may pass."
2006406-19 = "(Just as Urara said, I was able to enter without any issues.)"
2006406-20 = "(I headed straight to the meeting spot afterward.)"
2006406-24 = "Sensei. Good day."
2006406-25 = "Thank you so much for keeping this safe for me."
2006406-30 = "Ah, how I have longed for this day...#nIt is back in my hands now... I can finally be at ease."
2006406-31 = "[s] \"So, what exactly happened?\""
2006406-32 = "Fufu..."
2006406-33 = "I am not merely a fragile girl to be pushed around.#nI challenged Manami-sama head-on."
2006406-36 = "[ns] \"Urara did!?\""
2006406-37 = "I am surprised myself."
2006406-38 = "But the thought of never being able to see my favorite plays again made me so sad—"
2006406-39 = "So I stood up to persuade Manami-sama."
2006406-40 = "I told her that the protagonist of the play is a different person from the 'Phantom Thief' she hates so much."
2006406-41 = "She wasn't convinced, however, so I continued to persuade her while we watched the play together."
2006406-42 = "It was a long and difficult road, but I didn't give up and kept pressing her...#nAnd finally, I won."
2006406-43 = "It is rare for me to oppose her so strongly, so I am sure she granted me permission in the end because she cares for me."
2006406-44 = "Even so, this shouldn't have been an issue to begin with. After all, it is a fact that they are different people."
2006406-45 = "The protagonist of the play acts out of a sense of justice, while the 'Phantom Thief' acts based on their own personal artistic vision."
2006406-46 = "That is why they conflict with 'justice' and ended up becoming one of the Seven Prisoners, I suppose..."
2006406-47 = "[s] \"You seem very knowledgeable about the 'Phantom Thief', Urara.\""
2006406-48 = "Fufu... They are Manami-sama's greatest enemy, after all."
2006406-49 = "You cannot prepare if you do not know your opponent. As vice-president, I researched them thoroughly."
2006406-50 = "...Yes, down to the smallest detail."
2006406-51 = "Ah... I didn't intend to talk about this. #nAhem. Let's get back to the topic."
2006406-52 = "I cannot thank you enough for your help with this matter, Sensei.#nI don't even know how I could ever repay you."
2006406-53 = "The only way I can express these feelings of mine is—"
2006406-56 = "..."
2006406-57 = "It seems there is only that."
2006406-58 = "Just like with Manami-sama... would it be alright if I gathered my courage?"
2006406-59 = "[s] \"Meaning...?\""
2006406-60 = "I would like to invite you, Sensei."
2006406-61 = "To a place where I have forbidden outsiders from entering until now—"
2006406-62 = "—to my rose garden."
2006406-63 = "[s] \"...!!\""
2006406-65 = "(And so, I ended up going to the rose garden, guided by Urara.)"
2006406-68 = "[ns] \"So this is...\""
2006406-69 = "Yes."
2006406-70 = "The secret garden that I manage with such care."
2006406-71 = "You are the first outsider I have ever brought here... Sensei."
2006406-72 = "[s1] \"I'm honored.\" \n[s2] \"So we have this place all to ourselves now.\""
2006406-75 = "I, I suppose that is true...?"
2006406-76 = "Please, have a seat. I will bring some tea."
2006406-84 = "(I sat on a nearby chair.)"
2006406-87 = "(The fountain sparkles, reflecting the sunlight, and the scent of flowers drifts through the air. The melody played by the plants...)"
2006406-88 = "[ns3] (It's a place where just sitting still is healing.)\n[ns4] \"No mutant plants here, I suppose...\"\n[ns5] \"And no secret society hideouts or portals to other worlds either.\""
2006406-92 = "(I spent the time admiring the rose garden until Urara returned.)"
2006406-98 = "Sensei? Are you lost in thought?"
2006406-99 = "[s] \"...Just thinking that you have it tough, Urara.\""
2006406-100 = "Fufu... Being in a middle-management position is quite something..."
2006406-101 = "But when I drink tea here while reading a script...#nI feel as though the gloomy, overcast clouds in my heart are clearing away."
2006406-102 = "Ah, as it happens, right here."
2006406-103 = "The script of the play I love most, which you protected for me."
2006406-104 = "..."
2006406-105 = "Shall we... enjoy it together, then?"
2006406-106 = "A tea time for just the two of us, in this secret garden."
2006406-109 = "[wa:950]― [log=우라라]It is a strange thing.[/log]"
2006406-111 = "― [log=우라라]In a garden where outsiders are forbidden—[/log]"
2006406-114 = "― [log=우라라]To be looking at a script[/log]"
2006406-116 = "― [log=우라라]that was banned until just the other day... [wa:1790]it is quite something.[/log]"
2006406-119 = "[wa:550]― [log=우라라]It is not a violation of school rules. [/log]"
2006406-121 = "― [log=우라라]But, [wa:1200]somehow...[/log]"
2006406-124 = "― [log=우라라]I feel like I am doing [wa:1140]something wrong.[/log]"
2006406-127 = "― [log=우라라]This pounding in my chest... [wa:2820]is this a sense of immorality, [wa:1640]I wonder?[/log]"
2006406-130 = "[wa:320]― [log=우라라]Fufu... [wa:720]I—[/log] "
2006406-132 = "― [log=우라라]might have become a bad girl.[/log] "
2006406-135 = "[wa:500]― [log=우라라]...[wa:1050]Yes. [wa:1270]I was never [wa:1390]a good girl to begin with.[/log]"
2006406-138 = "― [log=우라라]Just as beautiful roses [wa:970]have thorns...[/log]"
2006406-140 = "― [log=우라라]I, too, [wa:1400]have thorns.[/log]"
2006406-143 = "[wa:880]― [log=우라라]Um... [wa:904]what you just heard—[/log]"
2006406-146 = "― [log=우라라]is a secret [wa:650]between you and me, [wa:770]Sensei... [wa:1230]okay?[/log]"
2006406-149 = "[wa:480]― [log=우라라]Because these are words [wa:980]exchanged in the secret garden, [wa:1570]after all.[/log]"
2006406-153 = "By the way, did you enjoy the tea I served?"
2006406-154 = "[s] \"Yes! It has such a wonderful aroma.\""
2006406-155 = "I am glad to hear that."
2006406-156 = "It is tea made from the roses I grow here."
2006406-157 = "Beautiful to look at, wonderful to smell, and delicious to drink... roses have many facets."
2006406-158 = "Roses with various colors and meanings blend into our daily lives in many different ways."
2006406-159 = "Yet, despite their different forms, they are all called 'roses'."
2006406-160 = "I believe 'art' is the same way."
2006406-161 = "Even though there are countless genres and diverse feelings poured into them—"
2006406-162 = "they can all be encompassed by the name 'art'."
2006406-163 = "I believe this diversity is the very value of art that we must protect."
2006406-164 = "[s] \"That's a wonderful way of thinking.\""
2006406-165 = "Fufu... Thank you."
2006406-166 = "Would you like another cup?"
2006406-169 = "(And so, I spent a peaceful tea time with Urara.)"
2006406-170 = "(I thought to myself that I would like to come back here and rest again.)"
