[translation]
52050-1 = "Эпизод 5;Тоска за пределами памяти"
52050-6 = ""
52050-8 = ""
52050-10 = "Десять месяцев назад Аямэ передала мне Сотню Лотосов и ушла на север искать Кузуноху."
52050-11 = "Я была ошеломлена, чувствовала себя преданной и парализованной страхом."
52050-12 = "Я знала, что никогда не смогу заменить Аямэ. Она была президентом Хяккарёран, а я... я даже не знала, кто я."
52050-15 = "Я потеряла почву под ногами. И не успела заметить, как уже шла к Великому снежному полю."
52050-26 = "Сколько прошло времени? Сколько сменилось ночей и дней?"
52050-27 = "Казалось невозможным. Как найти одного человека среди бескрайних слепящих снегов? Я брела вперёд на последних остатках сил, следуя карте к Сумеречному храму, но нашла лишь пустое поле."
52050-32 = ""
52050-33 = ""
52050-34 = ""
52050-36 = ""
52050-39 = "И там была Аямэ. Она выглядела так, будто ждала очень давно."
52050-40 = "Вы все наверняка помните её лицо и голос..."
52050-41 = "Улыбку, сиявшую как солнце даже в пасмурные дни, и тёплый приветливый голос, способный вернуть к жизни."
52050-42 = "Руки так замёрзли, что словно примерзли к Сотне Лотосов. Но увидев тот хаори, голубой как небо тёплого весеннего дня, я действительно обрела надежду."
52050-45 = "Я надеялась, что она снова позаботится обо мне, как раньше, несмотря на то что я бросила свои обязанности. Надеялась, что она меня побалует."
52050-46 = "Надеялась, что она протянет руку, поднимет меня и улыбнётся, потому что принимает такой, какая я есть."
52050-47 = "Надеялась, что она вернётся и снова станет нашим президентом."
52050-49 = "Но от Аямэ я услышала..."
52050-50 = ""
52050-54 = ""
52050-55 = "Зачем ты сюда пришла?"
52050-56 = ""
52050-58 = ""
52050-59 = ""
52050-61 = "Холодный голос, которого я от неё никогда не слышала."
52050-62 = "Леденящий взгляд сверху вниз, полный отвращения."
52050-63 = ""
52050-67 = ""
52050-70 = ""
52050-72 = "Это... была не та Аямэ, которую я помнила."
52050-75 = "Зачем я пришла...? Аямэ, я пришла ради..."
52050-76 = "Я сказала тебе, что пришла сюда встретить Кузуноху. Я не вернусь, пока не найду её."
52050-77 = "Но все за тебя переживают."
52050-78 = "Все в Хяккарёран растеряны без тебя, нашего путеводного света."
52050-79 = "...Вернись со мной, Аямэ."
52050-80 = ""
52050-82 = ""
52050-84 = ""
52050-85 = "Ты знаешь это не хуже меня, Аямэ."
52050-86 = "Кузуноха — как слух, старый миф—"
52050-87 = "Слух?"
52050-88 = ""
52050-90 = ""
52050-91 = ""
52050-92 = "...Может, ты права. Храм разрушен или погребён под снегом, и она не появилась, сколько бы я ни звала."
52050-93 = "Но мне всё равно нужно встретить Кузуноху."
52050-94 = "Нагуса, я и не ожидаю, что ты поймёшь почему."
52050-96 = "Пожалуйста... расскажи."
52050-97 = "Ты пытаешься быть ответственным лидером? Ищешь её мудрости и наставления?"
52050-98 = ""
52050-100 = ""
52050-101 = "Ха-ха..."
52050-102 = "Ха-ха-ха-ха!"
52050-103 = ""
52050-105 = ""
52050-106 = "Если честно, Нагуса. Ты совсем меня не знаешь."
52050-107 = ""
52050-109 = ""
52050-110 = "Столько лет — и ты так ничего и не поняла."
52050-111 = ""
52050-113 = ""
52050-114 = "Аямэ, пожалуйста, не—"
52050-115 = ""
52050-119 = "Человеческий разум — хрупкая, прекрасная вещь. Его невозможно понять полностью."
52050-120 = "Считать, будто знаешь другого человека, — чистое высокомерие, хрупкая иллюзия, которую можно разбить как стекло..."
52050-121 = "Ты, высокомерная некомпетентная девчонка."
52050-122 = ""
52050-124 = ""
52050-125 = "Ты...?"
52050-126 = ""
52050-128 = ""
52050-131 = ""
52050-132 = "Я всего лишь путешественница в поисках хорошей истории."
52050-133 = "Я почувствовала здесь потерянную душу и решила помочь."
52050-134 = ""
52050-136 = ""
52050-137 = "Ты знаешь, где Кузуноха?"
52050-138 = "Увы, нет. Но, как и ты, я тоже стремлюсь достичь границы Запределья. А до тех пор утешаю душу художественной изысканностью."
52050-139 = ""
52050-141 = ""
52050-143 = "И даже если со временем наши пути разойдутся, я с радостью составлю тебе компанию."
52050-144 = ""
52050-146 = ""
52050-147 = "Хорошо. Веди."
52050-148 = ""
52050-151 = ""
52050-152 = ""
52050-154 = ""
52050-155 = "Нет. Аямэ, не надо! Не забирай мою подругу!"
52050-156 = ""
52050-158 = ""
52050-159 = "...Подругу?"
52050-160 = ""
52050-166 = "Ты никогда не была моей подругой..."
52050-167 = ""
52050-171 = "...Горё Нагуса."
52050-173 = ""
52050-174 = "О боже... Неужели Аямэ могла быть настолько жестока?"
52050-175 = "Ни за что. Президент Аямэ никогда бы так не сказала, какой бы злой ни была."
52050-176 = "...Это не та Аямэ, которую я знаю."
52050-177 = ""
52050-179 = ""
52050-181 = "Понимаю. На это... было трудно смотреть."
52050-182 = "Я пыталась отрицать увиденное, думала, что мне привиделся кошмар."
52050-183 = "Но когда я протянула руку, её подол поглотил мою руку... и эта рана постоянно об этом напоминает."
52050-184 = "И это всё, что президент Аямэ тебе сказала?"
52050-185 = "Кажется, да. Я упала, потеряла сознание..."
52050-186 = "Я могла замёрзнуть насмерть, но была так измотана. И было ужасно больно..."
52050-187 = "Но, к счастью, меня нашла добрая душа."
52050-189 = "Кто-то случайно проходил мимо? Нагуса, это настоящее чудо!"
52050-190 = ""
52050-192 = ""
52050-193 = "...Чудо?"
52050-194 = "Чудес не бывает."
52050-199 = "...Хм."
52050-200 = ""
52050-203 = "...Ты проснулась?"
52050-204 = ""
52050-208 = ""
52050-209 = ""
52050-210 = "Если проснулась, иди по этой тропе к деревне у подножия горы. Возможно, выживешь, но уже никогда полностью не восстановишься."
52050-211 = "Ты... спасла меня?"
52050-212 = "Фу-фу, какой дерзкий тон со старшей."
52050-213 = "На этот раз прощу, учитывая, что ты слегка... не в себе. Помнишь своё имя?"
52050-214 = "Я... исполняющая обязанности президента Хяккарёран, Горё Нагуса."
52050-215 = ""
52050-217 = ""
52050-220 = "Как посреди зимы могут цвести сакуры?"
52050-221 = ""
52050-223 = ""
52050-224 = "Как, действительно? Очень странно, что ты не почувствовала их запах по дороге сюда."
52050-225 = "Не думаю, что цветущая сакура — самое странное. Впрочем, в Сумеречном храме время течёт иначе."
52050-226 = ""
52050-228 = ""
52050-229 = "Это Сумеречный храм...?"
52050-230 = "Тогда ты... Великая Пророчица Кузуноха?"
52050-232 = "Хм..."
52050-233 = "Ну, допустим, я. Что тогда сделаешь?"
52050-234 = "Попросишь моей благословенной мудрости Хяккарёран, госпожа президент?"
52050-235 = ""
52050-237 = ""
52050-239 = ""
52050-240 = ""
52050-241 = "Нет, ты не Кузуноха."
52050-242 = "Хм..."
52050-243 = "Потому что настоящая Кузуноха никогда не стала бы игнорировать Аямэ, спасая такую бесполезную, как я."
52050-244 = "Такой жестокий и бессердечный человек не может быть Кузунохой, первым президентом Хяккарёран."
52050-245 = "Ты имеешь право на своё мнение."
52050-246 = "Однако... это хорошая возможность. У меня есть небольшая просьба, считай, в обмен на спасённую жизнь."
52050-247 = ""
52050-249 = ""
52050-250 = ""
52050-253 = ""
52050-254 = "Свиток..."
52050-255 = "Это послание одному человеку, который меня ищет."
52050-256 = "Для Сенсея Шале. А внутри этого свитка..."
52050-257 = ""
52050-259 = ""
52050-260 = "...способ спасти кое-кого."
52050-261 = ""
52050-263 = ""
52050-265 = "...Вот что я помню."
52050-266 = "И да, я не только не смогла спасти Аямэ — она отвергла меня. Именно так моя рука стала такой."
52050-267 = "Я боялась, что вы все разочаруетесь, если узнаете. Думала, что вы тоже меня оставите."
52050-268 = "...Но больше я не буду бежать от правды."
52050-269 = "Так что вините меня. Ненавидьте. Прошу лишь быть честными со своими чувствами."
52050-270 = ""
52050-272 = ""
52050-274 = ""
52050-275 = "Как... Как..."
52050-276 = "Как я могу винить тебя за такое?"
52050-277 = ""
52050-279 = ""
52050-280 = "Ю-Юкари...?"
52050-281 = "Среди бури хаоса и сомнений только ТЫ нашла в себе решимость отправиться на Великое снежное поле и искать Аямэ."
52050-282 = "Кто из нас вообще имеет право тебя винить?"
52050-283 = "...Я думала, ты повзрослела после прошлого инцидента, Нагуса, а ты ведёшь себя как идиотка."
52050-284 = "Если президент Аямэ вела себя совершенно иначе, будто ОДЕРЖИМАЯ, а потом «Красота природы» появилась и устроила тебе засаду..."
52050-285 = "Разве не очевидно, что это заговор, чтобы обмануть тебя и опорочить Хяккарёран?"
52050-286 = "Именно. Если это вообще была Аямэ, значит, её обманули. Мы знаем её дух. Это была не она."
52050-287 = "Да. Так за что ты себя винишь?"
52050-288 = "Предлагаю прямо сейчас отправиться на Великое снежное поле, спасти президента Аямэ и... подобрать руку Нагусы или что там!"
52050-289 = "Блестяще. Полностью поддерживаю!"
52050-291 = "Н-Но..."
52050-292 = "Великое снежное поле опасно, и весь Хяккарёран не может уйти из-за меня..."
52050-293 = ""
52050-297 = "Простите, это Хяккарёран?"
52050-298 = ""
52050-300 = ""
52050-302 = ""
52050-303 = ""
52050-304 = ""
52050-305 = "О, отлично. Вся компания в сборе."
52050-306 = "А ты... Зачем именно ты здесь?"
52050-307 = "А, просто хотела сообщить: президент клуба Инь-Ян..."
52050-308 = ""
52050-310 = ""
52050-311 = ""
52050-312 = "...ей зачем-то нужен Хяккарёран. Звучало важно."
52050-313 = "Ния...?"
52050-315 = "Следующий эпизод;Подготовка к фестивалю"
