[translation]
52050-1 = "Episódio 5;A Admiração Além das Memórias"
52050-10 = "Foi há uns dez meses, eu acho.#nA Ayame confiou a Hyakuren a mim e partiu para o norte em busca da senhora Kuzunoha."
52050-11 = "Mas eu só fiquei perdida, sem conseguir fazer nada.#nNem impedi-la, nem ir atrás dela."
52050-12 = "...Eu nunca conseguiria substituir a Ayame.#nAlguém como eu jamais poderia ser a Presidente do Hyakkaryouran.#n...Era o que eu pensava."
52050-15 = "E então... quando dei por mim, eu também já estava indo para a Grande Planície Nevada."
52050-26 = "Não me lembro mais de quanto andei, nem de quantas noites atravessei."
52050-27 = "Procurar a Ayame na imensidão da Grande Planície Nevada era pura imprudência, mas...#nmesmo toda machucada, eu encontrei as ruínas do \"Templo do Crepúsculo\"."
52050-39 = "A Ayame estava lá. Como se estivesse esperando por alguém..."
52050-40 = "Vocês também se lembram do rosto e da voz da Ayame, não é?"
52050-41 = "Um sorriso brilhante como o sol, mesmo em dias de chuva.#nUma voz gentil que parecia acolher tudo..."
52050-42 = "Com o frio congelando até a ponta dos meus dedos,#nquando vi aquele haori azul-claro, eu pensei..."
52050-45 = "Que eu queria que ela acolhesse esta tola que largou tudo só para vir fazer birra...#nEu queria que ela me abraçasse..."
52050-46 = "Queria vê-la sorrir e dizer \"Não tem jeito mesmo, né?\"."
52050-47 = "Queria que ela voltasse a ser a nossa Presidente mais uma vez."
52050-49 = "Mas a Ayame..."
52050-55 = "Por que você está aqui?"
52050-61 = "Era a primeira vez que eu ouvia a Ayame falar com uma voz tão fria."
52050-62 = "Um olhar gélido, repleto do mais puro desprezo."
52050-72 = "Aquela não era a Ayame que eu conhecia..."
52050-75 = "Como assim por quê...? Eu vim te..."
52050-76 = "Eu não disse? Não vou voltar até encontrar a senhora Kuzunoha."
52050-77 = "Mas sem você... todo mundo está preocupado."
52050-78 = "Você é a Presidente do Hyakkaryouran em quem todos confiam."
52050-79 = "Vamos voltar, por favor."
52050-85 = "Afinal, você também sabe, não sabe, Ayame?"
52050-86 = "A senhora Kuzunoha não existe. É apenas uma lenda—"
52050-87 = "...Talvez você tenha razão."
52050-92 = "O Templo do Crepúsculo está nesse estado.#nPor mais que eu chame o nome dela, não há uma única resposta."
52050-93 = "Mesmo assim, eu preciso encontrar a senhora Kuzunoha."
52050-94 = "Você não entenderia, não é?#nO motivo pelo qual eu preciso encontrá-la."
52050-96 = "Não... eu entendo, sim."
52050-97 = "Você veio pedir um conselho à senhora Kuzunoha para proteger todo mundo, não foi?#nVocê sempre teve um senso de responsabilidade tão forte..."
52050-101 = "Haha... Ahaha..."
52050-102 = "...Ah."
52050-106 = "Sério... Você não sabe nada mesmo sobre mim, Nagusa."
52050-110 = "Ou melhor... você nunca nem tentou entender."
52050-114 = "Ayame, por que está dizendo isso...?"
52050-119 = "Desde tempos antigos, o coração humano é um verdadeiro mistério."
52050-120 = "Gabar-se de compreendê-lo é pura arrogância.#nÉ algo tão frágil quanto vidro, sabia?"
52050-121 = "Você é incompetente e, ainda por cima, arrogante.#nNão há remédio para alguém assim."
52050-125 = "Quem é você...?"
52050-132 = "Sou apenas uma viajante que aprecia a elegância e boas histórias."
52050-133 = "Vim buscar uma criança perdida em meio à neve."
52050-137 = "Você sabe onde a senhora Kuzunoha está?"
52050-138 = "Nem mesmo eu posso tocar a fronteira do outro lado.#nEu apenas contemplava a neve, confortando-me com sua beleza."
52050-143 = "Contudo... mesmo que nossos destinos sejam diferentes, eu conheço o caminho até \"lá\"."
52050-147 = "Então... me guie até lá."
52050-155 = "Espera...!#nNão leve a Ayame... não leve a minha amiga!"
52050-159 = "...Amiga?"
52050-166 = "Nagusa."
52050-171 = "Eu... nunca considerei você minha amiga."
52050-174 = "...Não posso acreditar!#nA Ayame-senpai jamais diria algo tão cruel!"
52050-175 = "Por mais irritada que estivesse, ela diria uma coisa dessas...?"
52050-176 = "Isso não combina em nada... com a Ayame-senpai que eu conheço."
52050-181 = "Com certeza, a Ayame de sempre jamais diria algo assim."
52050-182 = "Pensei várias vezes que talvez eu só tivesse tido um pesadelo..."
52050-183 = "Mas o meu braço, que foi engolido junto com a Ayame...#nEsta ferida me lembra que tudo aquilo foi real."
52050-184 = "E essa foi a última vez que você viu a senpai?"
52050-185 = "Sim... depois disso, eu desmaiei."
52050-186 = "Perder a consciência na Grande Planície Nevada deserta...#nNão seria estranho se eu tivesse morrido lá, mas..."
52050-187 = "Alguém veio me ajudar, e eu escapei por pouco."
52050-189 = "Encontrar alguém em um lugar como aquele... A senpai realmente teve muita sorte!"
52050-193 = "..."
52050-194 = "É verdade. Bem que eu queria ter tido essa sorte."
52050-199 = "...Hngh."
52050-203 = "Então despertaste."
52050-210 = "Se já podes te mover, deves partir.#nEste lugar pode sustentar tua vitalidade, mas não pode curar-te."
52050-211 = "Você... me salvou?"
52050-212 = "Fufu... Tratar uma anciã por \"você\" é um tanto ousado."
52050-213 = "Pois bem, por hoje deixarei passar.#nAinda te lembras do teu próprio nome?"
52050-214 = "Eu sou a Presidente Interina do Comitê de Mediação de Conflitos Hyakkaryouran... Nagusa Goryou."
52050-220 = "Flores de cerejeira... em pleno inverno?"
52050-224 = "Ora. Não notaste até chegar aqui?"
52050-225 = "No \"Templo do Crepúsculo\", o tempo flui de forma distinta da realidade.#nPor vezes, lírios-aranha e cerejeiras florescem juntos em profusão."
52050-229 = "Aqui é...?"
52050-230 = "Então... você é a Grande Profetisa Kuzunoha?"
52050-232 = "Hmm..."
52050-233 = "E se eu realmente for Kuzunoha, o que farás?"
52050-234 = "Como sucessora do Hyakkaryouran, há algo que desejas perguntar?"
52050-241 = "Não... você não é a senhora Kuzunoha."
52050-242 = "...Oh?"
52050-243 = "Se fosse mesmo a senhora Kuzunoha...#nnão teria ignorado a Ayame, que chamou por você sem parar, só para salvar alguém como eu."
52050-244 = "Algo tão frio assim...#nKuzunoha, a primeira Presidente do Hyakkaryouran, jamais faria."
52050-245 = "És livre para interpretar como bem entenderes."
52050-246 = "Contudo... chegaste em boa hora.#nPoderia encarregar-te de uma pequena entrega?"
52050-254 = "Isto é... um pergaminho?"
52050-255 = "Desejo que entregues isto ao Sensei da \"Schale\"."
52050-256 = "Ao que parece, estava à minha procura.#nO que está escrito aí é..."
52050-260 = "O meio de salvar certa pessoa."
52050-265 = "...Isso é tudo o que eu vi."
52050-266 = "Em vez de salvar a Ayame, eu fui rejeitada por ela...#nE por causa disso, meu braço direito também ficou inútil."
52050-267 = "Fiquei calada até agora porque...#ntinha medo de que, se soubessem a verdade, vocês ficassem decepcionadas comigo."
52050-268 = "Mas... eu não vou mais fugir."
52050-269 = "Podem guardar rancor de mim, se quiserem...#nPodem me culpar o quanto quiserem."
52050-275 = "Não... de jeito nenhum..."
52050-276 = "Jamais guardaríamos rancor de você, Nagusa-senpai!"
52050-280 = "Y-Yukari...?"
52050-281 = "Enquanto todos estavam em pânico,#na única que foi atrás da Ayame-senpai foi você, Nagusa-senpai."
52050-282 = "Não há ninguém neste Hyakkaryouran que guarde rancor de você...#nPelo contrário, nós somos é muito gratas!"
52050-283 = "...Você não tinha amadurecido depois do último incidente?"
52050-284 = "A gentil Presidente Ayame muda de repente,#ne o Clube Beleza da Natureza aparece na hora mais conveniente..."
52050-285 = "É óbvio que isso tudo é armação deles."
52050-286 = "Isso mesmo! A Ayame-senpai só está sendo enganada por vilões!"
52050-287 = "A Yukari tem razão.#nAlém disso, ficar se culpando não vai resolver nada, né?"
52050-288 = "Vamos agora mesmo para a Grande Planície Nevada resgatar a Ayame-senpai!#nE, claro, recuperar o seu braço também, Nagusa-senpai!"
52050-289 = "Uma ideia excelente! Eu concordo plenamente!"
52050-291 = "M-Mas..."
52050-292 = "A Grande Planície Nevada é perigosa.#nE não podemos simplesmente sair todas daqui..."
52050-297 = "Com licença. Há alguém do Hyakkaryouran aqui?"
52050-305 = "Ah, que ótimo, estão todas reunidas."
52050-306 = "Você é do Clube Yin-Yang... O que houve?"
52050-307 = "Sim... vim a mando da Presidente do clube."
52050-312 = "Ela disse ter um assunto urgente para tratar... e está à procura de vocês."
52050-313 = "...A senhorita Niya?"
52050-315 = "Próximo;O Festival e os Preparativos"
