[translation]
1301103-1 = "Что делает историю хорошей"
1301103-2 = "Департамент Разработки Игр Милленниума"
1301103-3 = "[Gamemaniac: А сюжет в ретро-играх вообще важен?]"
1301103-4 = "[Waga-mama: Серьёзно... Сюжеты старой школы такие отстойные! лол]"
1301103-5 = "[ikusa007: А когда появится героиня?]"
1301103-6 = "[tensaiko: Никакого сюжетного поворота? Да я бы, наверное, написал лучше.]"
1301103-7 = "[s] «Так, и что всё это значит?»"
1301103-8 = "Просто бредовая критика от интернет-троллей!"
1301103-9 = "[s] «Критика?»"
1301103-10 = "Эм, так..."
1301103-11 = "Некоторые ретро-игры сейчас получают ремейки из-за недавнего бума краудфандинга."
1301103-12 = "Лично я хотела бы поддержать это движение."
1301103-13 = "И похвалить их за готовность взяться за такой вызов."
1301103-14 = "Но посмотрите..."
1301103-15 = "Все совершенно открыто поливают грязью ретро-игру, которую мы только что выпустили!"
1301103-16 = "[s] «Тебе ведь не обязательно специально искать такие комментарии.»"
1301103-17 = "Ну, можно сказать, они сами случайно привлекли моё внимание..."
1301103-18 = "Знаете, как разворачиваешь кусок сыра, а внутри оказывается плесень..."
1301103-19 = "Я-я не искала их потому, что мне это нравится!"
1301103-20 = "Это всё часть моего маркетингового исследования..."
1301103-21 = "Да и вообще, у этих типов изначально мусорные мнения!"
1301103-22 = "Говорят всякое вроде: «Сюжеты в ретро-играх не важны.»"
1301103-23 = "Или: «Когда появится героиня?»"
1301103-24 = "Или: «Никакого сюжетного поворота?!»"
1301103-25 = "[s] «Эм...»"
1301103-26 = "У них настолько поверхностные критерии!"
1301103-27 = "Что, обычная история, где герой отправляется победить владыку демонов, плохая только потому, что она обычная?"
1301103-28 = "Глупо считать, будто следовать клише — тупо, а история хороша только тогда, когда ломает шаблон неожиданным поворотом!"
1301103-29 = "Эти самодовольные дураки говорят, что хороший игровой сюжет — это «тот, что оставляет сильное впечатление на игрока.»"
1301103-30 = "Да такое любой живой человек сказать может!"
1301103-31 = "Если вы так хорошо разбираетесь в игровых сюжетах, сами напишите один!"
1301103-32 = "[s] «Эм, Момои, успокойся...»"
1301103-33 = "*вздыхает*"
1301103-34 = "Ва..."
1301103-35 = ""
1301103-36 = "[s] «Ва...»"
1301103-37 = "Вааа! Это бесит! Меня так бесит!"
1301103-38 = "Я просто хочу врезать этим придуркам прямо через монитор!"
1301103-39 = "Но... у меня никак не получается писать так, как я хочу! Я так злюсь!"
1301103-40 = "[s] «Всё из-за дедлайна, да?»"
1301103-41 = "...Простите, Сенсей."
1301103-42 = "Я так завелась и вывалила всё на вас."
1301103-43 = "[s1] «Нет, всё нормально.»\n[s2] «Вообще-то, я даже рад.»"
1301103-44 = "...А? Почему вы так говорите?"
1301103-45 = "...А? Почему вы так говорите?"
1301103-46 = "[s] «Это значит, что ты достаточно мне доверяешь, чтобы обратиться ко мне, когда тебе тяжело.»"
1301103-47 = "...Ох."
1301103-48 = "Л-ладно. Спасибо, Сенсей."
1301103-49 = "Если честно, я и сама не знаю."
1301103-50 = "Не знаю, что мне писать и как это писать."
1301103-51 = "Такими темпами я не думаю, что вообще достойна быть сценаристом Отдела разработки игр..."
1301103-52 = "[s3] «Я не знаю, какой игровой сюжет идеален.»\n[s4] «Но одну вещь я знаю точно.»"
1301103-53 = "И что же вы знаете?"
1301103-54 = "И что же вы знаете?"
1301103-55 = "[s5] «Какую бы историю ты ни написала, Момои...»\n[s6] «...это будет лучшая история на свете.»"
1301103-56 = "...Хех."
1301103-57 = ""
1301103-58 = "...Хех."
1301103-59 = ""
1301103-60 = "Хех... П-понятно."
1301103-61 = "Да, история, которую я хочу написать..."
1301103-62 = "Это лучшая история на свете!"
1301103-63 = "Да! Выслушав вас, я, кажется, начинаю понимать."
1301103-64 = "Хорошо! Моя мотивация на максимуме!"
1301103-65 = "Пока слушала вас, мне пришла отличная идея!"
1301103-66 = "Особенная история, которая опирается на классические приёмы, но при этом выходит далеко за их рамки!"
1301103-67 = ""
1301103-68 = ""
1301103-69 = "Так что в следующий раз прочитайте сценарий моей новой истории и скажите, что думаете, Сенсей!"
1301103-70 = "[s] «Ага, положись на меня.»"
1301103-73 = "Через несколько дней я получил сообщение от Момои в MomoTalk."
1301103-74 = "Что мне делать, Сенсей?"
1301103-75 = "Я наконец придумала идею, но она полностью противоречивая! И больше ничего не могу придумать! Пожалуйста, помогите мне!"
1301103-76 = "Вааа!"
1301103-77 = "(Как и ожидалось, Момои оставалась самой собой.)"
