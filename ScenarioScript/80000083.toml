[translation]
80000083-1 = "Идеальный менеджер среднего звена"
80000083-2 = "Оживлённый универмаг Геенны"
80000083-4 = "В День святого Валентина Ироха написала мне, что ей нужна помощь с делами Общества Пандемониума."
80000083-5 = "Но когда я прибыл в условленное место..."
80000083-6 = "[ns1] «Разве это не универмаг?»\n[ns2] «Я думал, речь идёт о делах Общества Пандемониума. Зачем мы здесь?»"
80000083-7 = "Так вот. Не знаю, как в других местах, но в Обществе Пандемониума День святого Валентина — довольно серьёзное событие."
80000083-8 = "Так вот. Не знаю, как в других местах, но в Обществе Пандемониума День святого Валентина — довольно серьёзное событие."
80000083-9 = "Мы доставляем подарки всем остальным клубам и некоторым отдельным людям... а поскольку я представитель Общества Пандемониума, именно мне приходится всё это покупать."
80000083-10 = "Наверное, такова судьба менеджера среднего звена."
80000083-11 = "[s] «Тяжко тебе приходится, Ироха.»"
80000083-12 = "Если нужно покупать только обычные подарки, ничего страшного."
80000083-13 = "Мне несложно купить валентиновские подарки для ближайших организаций и тому подобное. Это входит в мои обязанности."
80000083-14 = "Однако..."
80000083-15 = "[s] «Но...?»"
80000083-16 = "Но если мне, например, приказывают купить шоколад настолько острый, чтобы члены Префектурной команды рыдали навзрыд..."
80000083-17 = "Или, опять же чисто для примера, найти шоколад, который взорвётся, когда его съедят..."
80000083-18 = "Исполнять такие приказы было бы глупо, правда?"
80000083-19 = "Вообще-то глупо уже само существование таких приказов."
80000083-20 = "[s] «Тебе не влетит за такие слова?»"
80000083-21 = "Не-а. Я и ей в лицо это сказала."
80000083-22 = "А потом мне велели по дороге назад купить еды, забрать специально заказанный шоколадный бюст из академии Красная Зима и ещё целый список поручений..."
80000083-23 = "И я начинаю задумываться... Неужели именно так я должна проводить День святого Валентина?"
80000083-24 = "[s3] «Типичная история руководителя среднего звена.»\n[s4] «Мне знакомо это чувство...»"
80000083-25 = "В общем, я позвала вас, потому что хотела услышать ваше мнение, Сенсей."
80000083-26 = "В общем, я позвала вас, потому что хотела услышать ваше мнение, Сенсей."
80000083-27 = "[s] «Моё мнение? Тебе... правда нужна моя помощь с выбором подарков?»"
80000083-28 = "Да. Особенно с шоколадом, который заставит Префектурную команду рыдать навзрыд."
80000083-29 = "[s] «Вот с этим моя помощь особенно не нужна!»"
80000083-30 = "Вот тут вы ошибаетесь."
80000083-31 = "Если я скажу, что подарок выбрали вы, никто не сможет жаловаться."
80000083-32 = "Вот мой план пережить этот День святого Валентина. Если подарки выбрали лично вы, Сенсей, всё будет в порядке."
80000083-33 = "[s] «А, теперь я понял план.»"
80000083-34 = "Так что, в духе сотрудничества..."
80000083-35 = ""
80000083-37 = ""
80000083-38 = "От одного менеджера среднего звена другому — прошу вашей помощи."
80000083-39 = "[s] «Без проблем.»"
80000083-40 = ""
80000083-42 = ""
80000083-44 = "Проведя некоторое время за покупками с Ирохой..."
80000083-46 = "Благодаря вам, Сенсей, мы без проблем купили все подарки."
80000083-47 = "Хе-хе. Никогда бы не подумала, что вы выберете нечто подобное... Похоже, я недооценила вашу склонность к розыгрышам."
80000083-48 = "Как думаете, Префектурная команда это переживёт...?"
80000083-49 = "[s5] «Говоришь так, будто я нарочно выбирал что-то плохое.»\n[s6] «Я купил нормальные подарки!»"
80000083-50 = "Ага, вы выбрали много скучных и безопасных подарков. Как и ожидалось от ответственного учителя."
80000083-51 = "Ага, вы выбрали много скучных и безопасных подарков. Как и ожидалось от ответственного учителя."
80000083-52 = "Хотя я ведь и просила вас о помощи, прекрасно зная, что вы именно такой человек..."
80000083-53 = "[s] «А? Что ты сказала?»"
80000083-54 = "Да ничего. Благодаря вам в этом году всё будет в порядке."
80000083-55 = "Спасибо, что пришли, Сенсей. Ваша помощь была бесценна."
80000083-56 = "Пойдём?"
80000083-57 = "[s7] «Да, покупки ко Дню святого Валентина завершены.»\n[s8] «О, кстати, о Дне святого Валентина...»"
80000083-58 = "...О? И всё?"
80000083-59 = "[s9] «А?»"
80000083-60 = "Сегодня День святого Валентина."
80000083-61 = "Когда я сегодня позвала вас, у вас не возникло чувства, что тут что-то намечается?"
80000083-62 = "[s10] «Эм, ну... в общем...»"
80000083-63 = "*вздох* Только в этот раз я закрою на это глаза. Всё-таки праздник."
80000083-64 = "Хе-хе... Так что вы хотели сказать, Сенсей?"
80000083-65 = "Что-то о валентиновском шоколаде, да?"
80000083-66 = "[s11] «О, эм... неважно. Пойдём.»"
80000083-67 = "Серьёзно? И всё?"
80000083-68 = "Сейчас идеальный момент сказать, что у вас на уме... если только вы не слишком смущены."
80000083-69 = "[s12] «Н-Ну... это...»"
80000083-70 = "Почему бы мне не прекратить ваши мучения? Всё-таки сегодня праздник."
80000083-71 = "Вот. Это вам, Сенсей."
80000083-72 = ""
80000083-74 = ""
80000083-76 = "[ns] «О... Шоколадная палочка?»"
80000083-77 = "Да, и она сделана вручную. Позвольте вручить её вам."
80000083-78 = ""
80000083-80 = ""
80000083-81 = ""
80000083-82 = "[ns] «Ага, спас—»"
80000083-83 = ""
80000083-84 = "[ns] «Эм... Ироха? Почему ты кладёшь её в рот... и закрываешь глаза?!»"
80000083-85 = "..."
80000083-86 = ""
80000083-89 = ""
80000083-90 = "Вы п'ямо п'авда откажетесь?"
80000083-91 = "[s] «Нет, эм, э-э, конечно нет!»"
80000083-92 = "Или... вы хотите сказать, что не можете принять мой подарок?"
80000083-93 = "Я старалась и сделала подарок своими руками, а вы собираетесь отказаться?"
80000083-94 = "[s] «Это не... То есть... Не то чтобы я... Но всё-таки... я...»"
80000083-95 = "..."
80000083-96 = "Пф."
80000083-97 = "[s] «А-а?»"
80000083-98 = "Ваше лицо... Я же очевидно шутила. Вот настоящий подарок."
80000083-99 = ""
80000083-101 = ""
80000083-102 = "Он сделан вручную со всей моей благодарностью, так что, пожалуйста, не спеша насладитесь им, когда вернётесь в Шале."
80000083-103 = "[s] «О, э-э, хорошо. Спасибо.»"
80000083-104 = "Ладно, пойдём отсюда."
80000083-105 = ""
80000083-107 = ""
80000083-110 = ""
80000083-111 = "Погодите, последнее. Ту палочку, что была у меня во рту, я положила обратно в пакет."
80000083-112 = "Когда всё съедите, напишите мне в MomoTalk, смогли ли определить, какая именно это была."
80000083-113 = "Ну... до встречи."
80000083-114 = ""
80000083-116 = ""
80000083-117 = "[ns] «Чего?! Стой, Ироха!»"
80000083-119 = "Шоколад, безусловно, был вкусным, но всё равно ощущался скорее розыгрышем, чем подарком."
