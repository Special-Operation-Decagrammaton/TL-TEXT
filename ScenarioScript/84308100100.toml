[translation]
84308100100-6 = "Спасибо, что пришли. К сожалению, времени терять нельзя."
84308100100-7 = ""
84308100100-10 = ""
84308100100-11 = "Ни дня покоя. Так будет всю неделю?"
84308100100-12 = "Хотелось бы сказать «нет», но, думаю, да."
84308100100-13 = "Сразу скажу... мне нравится работать с Нэру, но если нужно отправить меня одну, я справлюсь."
84308100100-14 = "Хех, это я слышу уверенность?"
84308100100-15 = "Хочешь сказать, ты ХОЧЕШЬ идти одна?"
84308100100-16 = ""
84308100100-18 = ""
84308100100-19 = "...Я говорю, что могу."
84308100100-20 = "Ого, прямо в лоб! Хаха! Мне нравится! Люблю таких людей."
84308100100-21 = "Ну как, Рио? Хочешь отправить её одну? Мне всё равно."
84308100100-23 = "Нет."
84308100100-25 = "Твёрдый ответ."
84308100100-26 = "Твёрдый ответ."
84308100100-28 = "Вы обе неправильно поняли. Если бы я считала, что ты справишься одна, Юризоно Сэя, я бы позвала только тебя."
84308100100-29 = "Сам факт, что я позвала вас обеих, означает, что так будет эффективнее. Надеюсь, вы понимаете."
84308100100-31 = "...Понимаю."
84308100100-32 = "Понимаю."
84308100100-33 = ""
84308100100-36 = ""
84308100100-37 = "...Я что-то не так сказала?"
84308100100-38 = "Нет, мы шутим. Не обращай внимания."
84308100100-39 = "Так зачем ты нас позвала? Что за задание?"
84308100100-40 = "Само задание несложное. Я подтвердила наличие нарушителя в выставочном зале, у стенда Отдела разработки игр."
84308100100-41 = "Нужно, чтобы вы спустились туда, нашли виновника и выяснили, что он задумал."
84308100100-43 = "...Это остатки той группы, с которой мы уже сталкивались?"
84308100100-44 = "Не исключено. Посмотрим, что удастся узнать."
84308100100-45 = "Не знаю, как они туда попали... но, похоже, находятся там уже какое-то время."
84308100100-46 = "И ещё: из-за всех попыток проникновения за последние несколько дней охрану усилили. Вам обеим придётся быть в лучшей форме."
84308100100-47 = "Попыток проникновения... за последние несколько дней?"
84308100100-48 = "Эм... Ну..."
84308100100-49 = "Ты ведь не про НАШИ попытки проникновения, да?"
84308100100-50 = "...Пока возьмите это."
84308100100-51 = ""
84308100100-53 = ""
84308100100-54 = "Привет."
84308100100-55 = "Рации, чтобы общаться друг с другом."
84308100100-57 = "Отсутствие ответа само по себе ответ."
84308100100-58 = "У нас заканчивается время. Как я уже сказала, нарушители уже находятся в выставочном зале Отдела разработки игр."
84308100100-59 = "Подберитесь как можно ближе, не попадаясь, и выясните, что происходит. Если ситуация потребует — обезвредьте их."
84308100100-60 = "Хорошо. Считай, сделано."
84308100100-61 = "Пойдём, Нэру. Долг зовёт."
