[translation]
84303301002-5 = ""
84303301002-6 = "Только что я просто играла, а потом... не знаю, что на меня нашло."
84303301002-7 = "Если подумать, технология потрясающая. Есть баги, которые надо исправить, но в остальном..."
84303301002-9 = "(Ещё секунду назад они были в ярости... а уже снова такие оптимистичные.)"
84303301002-10 = "(Миллениум... очень страшное место.)"
