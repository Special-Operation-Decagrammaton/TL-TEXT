#[!][Data: "20/09"]
[translation]
212010-1 = "Episódio 01;Tarde Demais"
212010-2 = ""
212010-3 = "......Como é que é?!"
212010-4 = "[s] \"O 'Verdadeiro'...... Projeto NK-Ultra?!\""
212010-5 = "Quer dizer que...... não tem nada a ver com o que a Satsuki-senpai tava pesquisando?"
212010-6 = "Exatamente, é completamente diferente."
212010-7 = "O que a Imperatriz do Trovão sonhava em criar era manipulação mental direta na alma humana."
212010-8 = "Uma tecnologia capaz de controlar o subconsciente à vontade.#nNão é essa hipnosezinha de brincadeira que eu faço... foi um experimento perverso e desumano."
212010-9 = ""
212010-11 = ""
212010-12 = "Sei que é difícil engolir isso do nada...... mas infelizmente é a mais pura verdade."
212010-13 = "[s] \"Pode explicar isso em detalhes pra gente?\""
212010-14 = "Na real, eu nunca quis ter que tocar nesse assunto de novo......"
212010-15 = "Mas já que a bomba estourou, não tem outro jeito.#nVou contar tudo o que eu sei."
212010-16 = "É sobre aquele passado sombrio que as veteranas preferem enterrar...... não é?"
212010-17 = "Sim. Foi há dois anos."
212010-20 = "A Imperatriz do Trovão governava Gehenna na base do puro terror, e fazia experimentos desumanos sem o menor pudor."
212010-21 = "Entre as atrocidades dela, havia um 'programa' pra arrancar o livre-arbítrio das alunas e forçar toda a academia a agir como uma mente só."
212010-22 = ""
212010-24 = "Por sorte, antes que esse plano saísse do papel pra valer, a resistência anti-Imperatriz — que incluía a Makoto-chan e eu — conseguiu derrubá-la do poder. Graças a isso, a coisa não foi adiante."
212010-25 = "A gente sabia que o caminho da Imperatriz era uma loucura sem volta.#nPor isso, destruímos absolutamente todos os relatórios e arquivos sobre o assunto."
212010-26 = ""
212010-28 = "A ordem expressa da Makoto-chan foi destruir tudo sem pestanejar."
212010-29 = "Afinal de contas, aquelas pesquisas eram perigosas demais pra continuarem existindo."
212010-32 = "Mas se tudo foi jogado fora...... como é que a gente tá nessa situação?!#nNão era pra não ter sobrado nada......?!"
212010-33 = "É exatamente por isso que a coisa tá preta."
212010-34 = "A pesquisa nunca foi finalizada, e não havia registro algum sobre como ela era ativada."
212010-35 = "A gente não fazia a menor ideia de qual era o mecanismo de gatilho."
212010-36 = "E agora, de repente, do nada... isso acontece."
212010-37 = "Saber que uma coisa dessas existia...... é de dar calafrios. Quase não dá pra acreditar......"
212010-38 = "Dizem que ver pra crer, não é?"
212010-39 = "Vocês viram com os próprios olhos: aquela Makoto-chan de mãos dadas com a chefe da Disciplina, gritando aos quatro ventos que vão conquistar Kivotos.#nNão viram?"
212010-40 = "......"
212010-41 = "[s] \"......\""
212010-42 = "E quanto ao motivo de apenas as alunas do 3º ano terem enlouquecido――"
212010-43 = "É porque...... o experimento da Imperatriz do Trovão tinha como cobaias as alunas matriculadas em Gehenna naquela época."
212010-45 = "Então é por isso que o 1º e o 2º ano tão sãos......!"
212010-46 = ""
212010-48 = ""
212010-49 = "Peraí...... isso quer dizer que tem gente além do 3º ano atual......?!"
212010-50 = "Ah, tá falando das veteranas que já se 'formaram'?"
212010-51 = "Na minha humilde opinião, acho que o alcance não foi tão longe assim."
212010-52 = "O alcance daquela transmissão de rádio cobre, no máximo, o território da Academia Gehenna."
212010-53 = "Menos mal, pelo menos isso......"
212010-55 = "Satsuki-senpai. Tem como fazer elas voltarem ao normal?"
212010-56 = "Não tenho ideia."
212010-57 = "Estamos falando do legado maldito da Imperatriz do Trovão.#nNão vai ser igual à Makoto-chan sob a minha hipnose, que acorda novinha em folha depois de um cochilo――#nO buraco aqui é bem mais embaixo."
212010-58 = "Ai meu Deus...... e agora, o que a gente faz?"
212010-59 = "Como Diretora de Inteligência da Sociedade Pandemônio, vou revirar cada pedra pra tentar achar uma saída."
212010-60 = "Não aguento ver a Makoto-chan daquele jeito esquisito."
212010-61 = "Tudo o que eu quero é a paz mundial.#nQuero construir um mundo onde ninguém se machuque. Se deixarmos as coisas como tão, vai ser o completo oposto!"
212010-62 = "E pensar que logo a líder da Disciplina comprou essa loucura deslavada......"
212010-64 = "E ainda veio com a Diretora Administrativa de brinde......"
212010-65 = "O Comitê de Disciplina ter entrado na dança é grave, mas...... o verdadeiro perigo é outro."
212010-66 = "Outro?"
212010-67 = ""
212010-69 = ""
212010-70 = "É que a Makoto-chan parece estar falando 'muito a sério'."
212010-71 = "Ué...... meio chato falar isso, mas......"
212010-72 = "A líder da Sociedade Pandemônio é perigosa assim?#nMesmo falando sério, ela nunca pareceu grande ameaça......"
212010-73 = ""
212010-75 = ""
212010-76 = "Você só fala isso porque não conhece a Makoto-chan de verdade."
212010-77 = "A Makoto-chan vira um monstro quando tem um inimigo claro pra esmagar."
212010-78 = "Quanto mais forte for o adversário na frente dela, mais o sangue dela ferve."
212010-79 = "Na época em que a gente batia de frente com a Imperatriz do Trovão, ela era pura garra e perigo."
212010-80 = "Desde aquela época...... acho que ela nunca mais precisou jogar pra valer."
212010-81 = "Mesmo ela arrumando confusão dia sim e outro também?"
212010-82 = "Se as besteiras dela pararam em meras [ruby=・]con[/ruby][ruby=・]fu[/ruby][ruby=・]sões[/ruby], dê graças aos céus por termos tanta sorte."
212010-83 = "Glup......"
212010-84 = "Enfim, tê-la como inimiga é o pior pesadelo de qualquer um.#nA teimosia rancorosa e o espírito de briga dela não perdem pra ninguém em Kivotos."
212010-85 = "Se uma pessoa assim decidiu entrar em guerra pra valer......"
212010-86 = "Podem ter certeza de que isso não vai terminar tão cedo."
212010-88 = "É...... tem razão. Pior que é verdade... mesmo ela sendo uma pataquada viva no dia a dia......"
212010-89 = "......"
212010-90 = "Ué? Mas se todo o 3º ano foi afetado, por que diabos a senhorita tá perfeitamente normal, Satsuki-senador?"
212010-91 = "Olha, é só um palpite meu, mas acho que tem a ver com as minhas próprias pesquisas."
212010-92 = "Não me diga que...... foi a sua hipnose?!"
212010-93 = "Isso mesmo. Eu passei bastante tempo debruçada estudando o Projeto NK-Ultra."
212010-94 = "Eu me inspirei nas notas da Imperatriz, mas adaptei tudo pra uma versão ética, inofensiva e de baixa coerção―― basicamente o 'Estilo Kyogoku Satsuki do NK-Ultra'."
212010-95 = "Por sinal, a ideia de manter o mesmo nome veio da Makoto-chan.#nEla achou que, usando o mesmo nome, a gente 'sobrescreveria' o projeto original e apagaria a existência dele do mapa."
212010-96 = "Bem, o resumo da ópera é que......#nAcho que criar resistência àquilo me imunizou contra o transe."
212010-97 = "......Você tá falando a verdade mesmo, né?#nNão tá com o cérebro lavado no modo retardado não, né......?"
212010-98 = "Tô sã como uma rocha, juro."
212010-100 = "......Bom, de qualquer forma, que alívio que você tá bem."
212010-101 = "Mas e agora...... qual é o plano? O que a gente faz?"
212010-102 = ""
212010-104 = ""
212010-105 = "[ns1] \"Precisamos achar um jeito de trazer todo mundo de volta à razão.\"\n[ns2] \"Temos que descobrir como anular essa lavagem cerebral.\""
212010-108 = "Você quer dizer... usando a força da [ruby=・]S[/ruby][ruby=・]C[/ruby][ruby=・]H[/ruby][ruby=・]A[/ruby][ruby=・]L[/ruby][ruby=・]E[/ruby]?"
212010-109 = "Se for isso, talvez seja melhor tirar o cavalinho da chuva."
212010-110 = ""
212010-112 = ""
212010-113 = "Por quê?"
212010-114 = "A SCHALE responde diretamente ao Conselho Estudantil Federal.#nSe vocês intervierem, vai parecer que o Conselho tá metendo a colher em Gehenna."
212010-115 = "Isso pode virar uma crise gravíssima de violação de soberania do nosso distrito."
212010-116 = "[s] \"A Satsuki tem toda a razão.\""
212010-117 = "É... pensando bem, faz sentido......"
212010-118 = "Os problemas de Gehenna se resolvem dentro de Gehenna."
212010-119 = "Quero manter esse princípio até onde der."
212010-120 = "Claro que pedir socorro não é nenhum pecado."
212010-121 = "Mas acho que nosso dever é esgotar todas as nossas forças por conta própria primeiro."
212010-123 = "......Eu concordo plenamente."
212010-124 = "A alta cúpula de Gehenna declarou guerra a Kivotos.#nSe isso vazar pra fora dos nossos muros, vai ser o caos generalizado."
212010-125 = "Temos que resolver essa lambança aqui dentro, a qualquer custo."
212010-126 = "[s] \"Com certeza. Custe o que custar, vamos dar conta.\""
212010-128 = "Então deixamos a SCHALE apenas como o nosso trunfo de emergência,#ne resolvemos com nossos próprios punhos antes que a situação fique irreversível."
212010-129 = "Esse é o nosso objetivo, certo?"
212010-130 = "Exatamente, é isso aí."
212010-135 = "(Debatemos várias estratégias depois disso......)"
212010-136 = ""
212010-139 = "(Mas nenhuma solução definitiva veio à mente)"
212010-142 = ""
212010-143 = "Por onde será que a gente começa......?"
212010-144 = ""
212010-146 = ""
212010-147 = ""
212010-148 = "Satsuki-senador, você se lembra?#nNa hora da transmissão, tocou um áudio esquisitão no fundo, não tocou?"
212010-149 = "Aquela parada...... como é que chama mesmo?"
212010-150 = "Isso! O gatilho! Aquele barulho não podia ser o tal gatilho?"
212010-151 = ""
212010-153 = ""
212010-154 = "A probabilidade é alta."
212010-155 = "Uma combinação específica de palavras sem nexo aparente servindo de chave de disparo pra acordar comandos adormecidos no subconsciente......"
212010-156 = "Não dá pra tirar uma pista daí?"
212010-157 = "Tipo... se a gente tocar as palavras ao contrário, a lavagem cerebral não se desfaz?"
212010-158 = "Como alguém que já pesquisou isso a fundo, lamento informar que lavagem cerebral não é fita cassete pra você rebobinar e consertar num passe de mágica."
212010-159 = "É, não ia ser molezinha assim mesmo......"
212010-160 = "Mas a linha de raciocínio é ótima.#nÀs vezes, as ideias mais simples são as chaves perfeitas pra desatar nós impossíveis."
212010-161 = ""
212010-166 = "Ai......"
212010-167 = "Que dor de cabeça......!"
212010-168 = "Agora que você falou... aquele ruído zuniu nos alto-falantes bem na hora da transmissão."
212010-169 = ""
212010-171 = ""
212010-172 = "......"
212010-173 = "Frequência......?"
212010-174 = "[s] \"Pensou em alguma coisa?\""
212010-175 = "E se as palavras-chave forem apenas uma máscara, um mero sinal de confirmação?#nE se o verdadeiro gatilho for uma frequência sonora específica que desperta o subconsciente......?"
212010-176 = ""
212010-178 = ""
212010-179 = "Senpai......?"
212010-180 = "Ela tá viajando nos pensamentos......"
212010-181 = "Melhor a gente não atrapalhar agora."
212010-182 = ""
212010-184 = ""
212010-185 = ""
212010-186 = ""
212010-187 = ""
212010-188 = "Gente...... acho que acabei de achar uma luz no fim do túnel."
212010-189 = "É sério mesmo?!"
212010-190 = "Não posso dar certeza absoluta, mas vale a pena tentar até a última gota."
212010-191 = "Tive alguns estalos mentais aqui, então vou voltar pro meu laboratório e botar a mão na massa."
212010-192 = "Olha aí que mulher de respeito......! E eu achando que ela era só uma doidinha avoada!"
212010-194 = "Iori......!"
212010-195 = "Bem...... errada ela não tá......"
212010-196 = "Mas na hora do aperto, ela mostra a que veio."
212010-198 = "Ora, como Diretora de Inteligência da Sociedade Pandemônio, eu tenho uma reputação a zelar, não acham?"
212010-199 = "[s3] \"Satsuki, contamos com você.\"\n[s4] \"Se precisar de ajuda, é só me chamar.\""
212010-202 = "Isso me dá uma baita coragem."
212010-203 = "Ah, e tem mais uma coisinha.#nÉ apenas uma dedução minha, mas as pessoas sob a lavagem cerebral――"
212010-204 = "Não vão ter a menor piedade de quem tentar ficar no caminho."
212010-205 = "......!"
212010-206 = "Porque era exatamente assim que a Imperatriz do Trovão agia."
212010-207 = ""
212010-210 = ""
212010-212 = "Portanto...... tenham muito cuidado. Quando eu tiver resultados, mando notícias."
212010-213 = ""
212010-215 = ""
212010-217 = "......É melhor a gente voltar pros nossos postos também. Sumir por muito tempo vai levantar suspeitas."
212010-218 = "Concordo. De qualquer jeito, só nós aqui não vamos dar conta de resolver tudo sozinhas."
212010-219 = "[s] \"Vou pedir a colaboração de outras alunas por aí.\""
212010-220 = "Mas se a preocupação da Satsuki-senpai tiver certa, quem corre mais perigo não é o próprio Sensei?"
212010-221 = "Você já chama atenção por natureza. Se começar a se mexer demais por aí......"
212010-222 = "[s5] \"Vou agir com a máxima cautela.\"\n[s6] \"Obrigado pela preocupação, meninas.\""
212010-225 = "......Conhecendo o Sensei, sei que você vai saber se virar com esperteza."
212010-226 = "Sensei...... muito obrigada por estar aqui do nosso lado."
212010-227 = "Saber que você tá com a gente me dá tanta força.#n......De verdade."
212010-229 = "É. Faço das palavras dela as minhas......"
212010-230 = "[s] \"Então tá, vamos dispersar por enquanto.\""
212010-232 = "Cuidem-se, todo mundo."
212010-233 = "A gente se vê em breve."
212010-235 = "Qualquer pepino, me dá um toque!"
212010-236 = ""
212010-243 = "Ai, ai......"
212010-244 = ""
212010-246 = ""
212010-247 = "Veteranas...... não deixem a porcaria do legado da Imperatriz do Trovão vencer vocês......!"
212010-248 = "Por favor, voltem a si...... Não me importo se vocês arrumarem confusão, aguento patrulhar tudo sozinha por um bom tempo se precisar."
212010-249 = "Até aguento a Pandemonium me enchendo o saco duas...... não, três vezes seguidas sem reclamar......!"
212010-250 = "Então por favor...... voltem logo......"
212010-252 = "......"
212010-254 = "Próximo Episódio;Chinatsu"
