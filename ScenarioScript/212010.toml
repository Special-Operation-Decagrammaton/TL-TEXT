[translation]
212010-1 = "Эпизод 1;В шаге от цели"
212010-2 = ""
212010-3 = "...Простите?"
212010-4 = "[s] «Проект „NK Ультра“... Императора-тирана?»"
212010-5 = "Он... отличается от того, над чем работаешь ты, Сацуки?"
212010-6 = "Совершенно."
212010-7 = "Император-тиран мечтал о контроле над разумом, который менял бы саму сущность человека."
212010-8 = "Это совсем не то же самое, что обычный гипноз. Жестокий и бесчеловечный эксперимент, позволявший управлять глубинными слоями сознания."
212010-9 = ""
212010-11 = ""
212010-12 = "В это трудно поверить, но всё так и было."
212010-13 = "[s] «Сацуки, можешь рассказать подробнее?»"
212010-14 = "Я поклялась никому об этом не рассказывать..."
212010-15 = "Но раз уж всё так обернулось, поделюсь тем, что знаю."
212010-16 = "...Вот о чём вы, третьекурсники, никогда не говорите..."
212010-17 = "Да. Это случилось два года назад..."
212010-20 = "Император-тиран правил Геенной с помощью страха... и без тени сомнения проводил бесчеловечные опыты."
212010-21 = "В числе прочего был секретный проект по уничтожению свободной воли отдельных студентов и объединению всей академии в единый коллективный разум."
212010-22 = ""
212010-24 = "Ещё до запуска проекта Императора-тирана свергла группа повстанцев. Среди них были мы с Макото."
212010-25 = "Мы знали, насколько жестоки его замыслы, поэтому уничтожили все связанные с ними материалы."
212010-26 = ""
212010-28 = "Политика Макото заключалась в том, чтобы «безоговорочно уничтожать всё, что связано с Императором-тираном»."
212010-29 = "Его проекты были настолько опасны, что в них было страшно даже поверить..."
212010-32 = "Н-но что же происходит сейчас...? Ты ведь сказала, что все материалы уничтожили."
212010-33 = "Вот это меня и тревожит."
212010-34 = "Тогда исследование ещё не было завершено. Мы уничтожили всё, что касалось кодовых слов и способов активации..."
212010-35 = "Нам даже не удалось разобраться, как всё это работало."
212010-36 = "И теперь я не понимаю, как призраки прошлого сумели вновь нависнуть над Геенной..."
212010-37 = "Не могу поверить, что такое вообще существовало..."
212010-38 = "Я не могу показать вам прошлое, но вы сами знаете, что это правда."
212010-39 = "Ты видела, как Макото и глава Префектуры пожали друг другу руки, Ироха. Они призвали к тотальному завоеванию."
212010-40 = "..."
212010-41 = "[s] «...»"
212010-42 = "А почему пострадали только третьекурсники... Кажется, я знаю причину."
212010-43 = "Два года назад Император-тиран проводил эксперимент над определённой группой студентов."
212010-45 = "Значит, поэтому первокурсники и второкурсники, поступившие позже, не пострадали..."
212010-46 = ""
212010-48 = ""
212010-49 = "П-погоди, получается, студенты постарше тоже...?"
212010-50 = "Ты спрашиваешь, действует ли контроль на наших старших товарищей, которые уже «выпустились»?"
212010-51 = "Это лишь моё предположение, но, скорее всего, нет."
212010-52 = "Трансляция шла по всей школе, но за пределы академии не выходила."
212010-53 = "Слава богу..."
212010-55 = "Сацуки, эм... А мы можем вернуть их в прежнее состояние?"
212010-56 = "Не знаю."
212010-57 = "Я гипнотизировала только Макото, и после сна она всегда приходила в себя. Но ЗДЕСЬ всё явно не так просто."
212010-58 = "*вздох* ...И что нам теперь делать?"
212010-59 = "Не знаю. Но как глава Разведывательного комитета Пандемониума я сделаю всё, что смогу."
212010-60 = "Мне тоже не нравится, что Макото так себя ведёт."
212010-61 = "Всё, чего я всегда хотела, это мир, в котором нет боли."
212010-62 = "Не верится, что даже глава Префектуры поддерживает всё это..."
212010-64 = "Да. И наш старший администратор тоже..."
212010-65 = "То, что Префектура изменилась, это проблема. Но есть кое-что ещё хуже."
212010-66 = "А? Это как?"
212010-67 = ""
212010-69 = ""
212010-70 = "Макото настроена совершенно серьёзно."
212010-71 = "Эм... Простите за прямоту..."
212010-72 = "Но разве председатель не просто заноза в боку? Даже если она «серьёзна», неужели представляет настоящую угрозу?"
212010-73 = ""
212010-75 = ""
212010-76 = "Ты так говоришь лишь потому, что плохо знаешь Макото."
212010-77 = "Когда у неё появляется противник, она становится особенно безжалостной и целеустремлённой."
212010-78 = "...Особенно если соперник достойный. Сильный."
212010-79 = "Я видела, на что Макото действительно способна, когда она сражалась с Императором-тираном."
212010-80 = "Потом была Префектура... Но с вами она никогда не сражалась «всерьёз»."
212010-81 = "Что? Да она постоянно пристаёт к нам и устраивает беспорядки!"
212010-82 = "Хорошо, что дальше «приставаний» у неё дело не заходило."
212010-83 = "Хм..."
212010-84 = "Уверяю тебя, стань Макото вашим настоящим врагом, проблем было бы не избежать. По упорству и боевому духу ей нет равных."
212010-85 = "А теперь, когда Макото решила всерьёз воевать со всем Кивотосом..."
212010-86 = "Так просто это не закончится."
212010-88 = "Это правда. Она... обычно кажется неуклюжей дурочкой, но..."
212010-89 = "..."
212010-90 = "Стоп. А почему с Сацуки всё в порядке? Все остальные третьекурсники изменились, а ты здесь и помогаешь нам?"
212010-91 = "Ну... Я могу только предполагать, но, возможно, постоянные исследования выработали у меня своего рода «иммунитет»?"
212010-92 = "Какие ещё «исследования»...? Ты про всю эту чушь с гипнозом?"
212010-93 = "Да. Я ведь самостоятельно изучала проект «NK Ультра»."
212010-94 = "Хотя меня вдохновили исследования Императора-тирана, я постаралась убрать из них всё бесчеловечное... Поэтому получилась «NK Ультра в стиле Кёгоку Сацуки»."
212010-95 = "Кстати, сохранить название предложила Макото. Так мы хотели вытеснить и стереть память о первоначальном проекте."
212010-96 = "Полагаю, именно знакомство с этой темой и понимание её сути защитили меня от массового промывания мозгов."
212010-97 = "С тобой точно всё в порядке?"
212010-98 = "Именно."
212010-100 = "...Что бы там ни было, я рада это слышать."
212010-101 = "Итак, что будем делать?"
212010-102 = ""
212010-104 = ""
212010-105 = "[ns1] «Найдём способ вернуть всех в прежнее состояние».\n[ns2] «Нужно снять воздействие промывания мозгов»."
212010-108 = "Сенсей, может, Шале вмешается? Нам нужна помощь."
212010-109 = "Это, мягко говоря, рискованно."
212010-110 = ""
212010-112 = ""
212010-113 = "Почему?"
212010-114 = "Шале подчиняется непосредственно председателю Генерального студенческого совета. Если организация вмешается, это может означать вмешательство председателя в дела Геенны."
212010-115 = "Такое вмешательство поставит под угрозу суверенитет Геенны."
212010-116 = "[s] «Сацуки права»."
212010-117 = "...Д-да, в этом есть смысл..."
212010-118 = "«Проблемы Геенны должна решать сама Геенна»."
212010-119 = "Я хотела бы по возможности придерживаться этого принципа."
212010-120 = "Конечно, я не призываю отказываться от помощи при любых обстоятельствах..."
212010-121 = "Но будет лучше, если мы справимся своими силами."
212010-123 = "...Согласна."
212010-124 = "Если посторонние узнают, что руководство Геенны намерено завоевать Кивотос, начнётся хаос."
212010-125 = "Поэтому нам придётся решить проблему внутри академии."
212010-126 = "[s] «Да. Нужно как-то во всём разобраться»."
212010-128 = "Хм. Обратиться за помощью к Шале оставим на крайний случай..."
212010-129 = "Главное, найти решение, пока у нас ещё есть время, верно?"
212010-130 = "Верно."
212010-135 = "После этого мы обсудили разные варианты действий..."
212010-136 = ""
212010-139 = "К сожалению, ни одной блестящей идеи так и не появилось."
212010-142 = ""
212010-143 = "С чего же начать...?"
212010-144 = ""
212010-146 = ""
212010-147 = ""
212010-148 = "Сацуки, разве во время речи Макото не прозвучал какой-то странный звук?"
212010-149 = "Как он там называется...?"
212010-150 = "А! Триггер! Разве там не было кодовой команды?"
212010-151 = ""
212010-153 = ""
212010-154 = "Кажется, ты права."
212010-155 = "Это была особая последовательность слов, призванная запустить и пробудить программу, заложенную глубоко в сознании."
212010-156 = "Н-ну... Разве с этим ничего нельзя сделать?"
212010-157 = "Например, что если проиграть эти слова задом наперёд?"
212010-158 = "Как человек, знакомый с темой, скажу: промывание мозгов нельзя обратить вспять, просто перемотав запись..."
212010-159 = "Ц... Наверное, я слишком всё упростила..."
212010-160 = "Я бы так не сказала. Иногда у сложнейших задач бывает простое решение."
212010-161 = ""
212010-166 = "А-а..."
212010-167 = "Ай! Что это за ужасный звон?"
212010-168 = "Кстати говоря, я всё время слышала под трансляцией какой-то высокий писк..."
212010-169 = ""
212010-171 = ""
212010-172 = "..."
212010-173 = "Частота...?"
212010-174 = "[s] «Что такое, Сацуки?»"
212010-175 = "А что, если кодовые слова были лишь сигналом? Если настоящее промывание мозгов начиналось тогда, когда определённые частоты пробуждали глубинное подсознание...?"
212010-176 = ""
212010-178 = ""
212010-179 = "Сацуки...?"
212010-180 = "П-похоже, она что-то поняла...!"
212010-181 = "Она так сосредоточена... Лучше её не отвлекать."
212010-182 = ""
212010-184 = ""
212010-185 = ""
212010-186 = ""
212010-187 = ""
212010-188 = "Я... кажется, у меня появилась догадка."
212010-189 = "П-Правда?!"
212010-190 = "Не могу обещать, что это сработает, но попробовать стоит."
212010-191 = "Мне нужно проверить несколько предположений. Вернусь в свой кабинет и проведу дополнительные исследования."
212010-192 = "Ладно! Я всегда считала тебя чудачкой, но ты нам очень помогла!"
212010-194 = "Иори...!"
212010-195 = "В чём-то она права..."
212010-196 = "Но когда дело серьёзное, на Сацуки всегда можно положиться."
212010-198 = "Даю слово главы Разведывательного комитета Пандемониума: я сделаю всё возможное."
212010-199 = "[s3] «Рассчитываю на тебя, Сацуки».\n[s4] «Позвони, если понадобится помощь»."
212010-202 = "И вы тоже, Сенсей."
212010-203 = "И ещё, это тоже лишь предположение, но насчёт наших товарищей под чужим контролем..."
212010-204 = "Если вы выступите против них, они, скорее всего, вас не пощадят."
212010-205 = "...!"
212010-206 = "Император-тиран поступал точно так же."
212010-207 = ""
212010-210 = ""
212010-212 = "Пожалуйста, будьте осторожны. Если что-нибудь выясню, обязательно вас найду."
212010-213 = ""
212010-215 = ""
212010-217 = "...Нам тоже пора. Слишком долго отсутствовать на своих постах опасно."
212010-218 = "Да. К тому же вдвоём мы мало что можем сделать."
212010-219 = "[s] «Я попрошу других студентов помочь нам»."
212010-220 = "Сенсей, если опасения Сацуки подтвердятся, разве не вам будет грозить самая большая опасность?"
212010-221 = "Вы и так всем известны. Если ещё и привлечёте к себе внимание..."
212010-222 = "[s5] «Буду действовать осторожно».\n[s6] «Спасибо, что беспокоишься обо мне, Ироха»."
212010-225 = "...Уверена, вы поступите разумно."
212010-226 = "Спасибо за поддержку, Сенсей."
212010-227 = "На вас действительно можно положиться. Без всяких сомнений."
212010-229 = "Да. И правда можно..."
212010-230 = "[s] «Тогда давайте все благополучно вернёмся»."
212010-232 = "Да. Берегите себя."
212010-233 = "До встречи."
212010-235 = "Звоните, если что-нибудь случится!"
212010-236 = ""
212010-243 = "А-а..."
212010-244 = ""
212010-246 = ""
212010-247 = "И не дайте какому-то давно свергнутому Императору-тирану победить...!"
212010-248 = "Только вернитесь живыми и невредимыми. Можете даже снова устраивать неприятности. Я пока и одна похожу в патрули."
212010-249 = "Я даже стерплю выходки Пандемониума ещё два... нет, три раза, если потребуется!"
212010-250 = "Поэтому... Пожалуйста..."
212010-252 = "..."
212010-254 = "Следующий эпизод;Чинацу"
