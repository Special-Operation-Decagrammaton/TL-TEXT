[translation]
212010-1 = "Episode 1;A Step Behind"
212010-3 = "……What was that?"
212010-4 = "[s] \"The 'true'... NK Ultra Plan?\""
212010-5 = "Does that mean... it's something different from what Satsuki-senpai was researching?"
212010-6 = "Yes, it's completely different."
212010-7 = "What the Kaiser dreamed of was mental manipulation that touches the very core of a person."
212010-8 = "It allows one to control the subconscious at will. #nIt's not some mild hypnosis; it's an evil, unethical experiment."
212010-12 = "I know it's hard to believe when you hear it so suddenly... but it's all true."
212010-13 = "[s] \"Can you tell me more?\""
212010-14 = "I never intended to speak of this, but..."
212010-15 = "Since things have come to this, I have no choice. #nI'll tell you everything I know."
212010-16 = "The past that the upperclassmen don't want to talk about... right?"
212010-17 = "Yes, it happened two years ago."
212010-20 = "The Kaiser, who ruled Gehenna through fear, conducted inhumane experiments without a second thought."
212010-21 = "One of them was a 'program' designed to strip students of their free will and unify the entire academy."
212010-24 = "Fortunately, before the plan could be fully implemented, she was ousted by the anti-Kaiser faction, which included Makoto-chan and myself. So, it never got that far."
212010-25 = "We believed that the Kaiser's path was wrong. #nThat's why we destroyed all related materials."
212010-28 = "Makoto-chan's policy was to unconditionally destroy anything related to the Kaiser."
212010-29 = "That's how dangerous her research was."
212010-32 = "But the current situation is...! #nI thought all the materials were destroyed...?"
212010-33 = "That is exactly why this is so serious."
212010-34 = "This research was never completed, and no information regarding the trigger was left behind."
212010-35 = "Therefore, we didn't even know how it was supposed to function."
212010-36 = "So why is this happening now?"
212010-37 = "I can hardly believe something like that existed..."
212010-38 = "They say seeing is believing, don't they?"
212010-39 = "Even Makoto-chan joined hands with the Prefect Team leader and called for the conquest of Kivotos. #nYou saw it too, didn't you?"
212010-40 = "……."
212010-41 = "[s] \"…….\""
212010-42 = "Why did only the third-years go haywire—"
212010-43 = "That's because... the Kaiser's experiments were targeted at the Gehenna students of that time."
212010-45 = "So that's why the current second and first-years are safe..."
212010-49 = "Does that mean... there are others besides the current third-years...!?"
212010-50 = "Ah, you mean the seniors who 'graduated'?"
212010-51 = "It's just my theory, but it shouldn't have that much of an impact."
212010-52 = "The broadcast we heard earlier only reached as far as the Gehenna Academy grounds, at most."
212010-53 = "Well, that's a small mercy, at least..."
212010-55 = "Satsuki-senpai. Is there any way to reverse this?"
212010-56 = "I don't know."
212010-57 = "That is a legacy of the Kaiser. #nIt's not as simple as Makoto-chan waking up from my hypnosis after a nap— #nI doubt it's that easy."
212010-58 = "Sigh... what should we do?"
212010-59 = "As the head of the Pandemonium Society's Intelligence Department, I will do everything I can."
212010-60 = "I don't want to see Makoto-chan like that."
212010-61 = "What I desire is world peace. #nI want to create a world where no one gets hurt. If things continue like this, it'll be the exact opposite."
212010-62 = "To think the Prefect Team leader would go along with such a ridiculous thing..."
212010-64 = "And with the Administrative Officer in tow, no less..."
212010-65 = "The Prefect Team joining in is a problem, but... the truly troublesome part is something else."
212010-66 = "Something else?"
212010-70 = "The fact that Makoto-chan looks 'serious'."
212010-71 = "Hmm... I hate to say it like this, but..."
212010-72 = "Is the Pandemonium Society President really that dangerous? #nEven if she's serious, she doesn't seem like much of a threat..."
212010-76 = "You can only say that because you don't know Makoto-chan well."
212010-77 = "Makoto-chan gets stronger when there's an enemy to defeat."
212010-78 = "The stronger the opponent standing in her way, the more so."
212010-79 = "Back when she was confronting the Kaiser, she was full of life."
212010-80 = "I suspect she hasn't been serious since then."
212010-81 = "Even though she's always causing trouble?"
212010-82 = "It's our good fortune that it's only been 'trouble'."
212010-83 = "Hmph..."
212010-84 = "Regardless, she's a troublesome opponent once she turns against you. #nHer tenacity and fighting spirit are second to none in Kivotos."
212010-85 = "If a Makoto-chan like that has decided to fight in earnest..."
212010-86 = "It definitely won't end easily."
212010-88 = "That... I suppose you're right. Even though she usually only shows her clumsy side..."
212010-89 = "……."
212010-90 = "Wait, then why is Satsuki-giin fine? #nDidn't all the third-years go crazy?"
212010-91 = "It's just a guess, but I suspect it has something to do with my research."
212010-92 = "You mean... hypnosis?"
212010-93 = "Exactly. I was researching the NK Ultra Plan myself."
212010-94 = "I took inspiration from the Kaiser's research, but mine is ethically sound and has a weaker coercive force—you could call it the 'Kyogoku Satsuki-style NK Ultra'."
212010-95 = "By the way, it was Makoto-chan who suggested using the name. #nHer idea was to overwrite the original existence by using the same name."
212010-96 = "Well, anyway. #nBecause of that influence, I suppose it didn't affect me."
212010-97 = "...You're really sane, right? #nYou haven't actually been brainwashed, have you..."
212010-98 = "I'm serious."
212010-100 = "...In any case, I'm glad you're safe."
212010-101 = "So... what should we do from here?"
212010-105 = "[ns1] \"Let's find a way to bring everyone back to normal.\"\n[ns2] \"Let's find a way to break the brainwashing.\""
212010-108 = "Are you offering Schale's help?"
212010-109 = "That might be something you should hold off on."
212010-113 = "Why?"
212010-114 = "Schale is under the direct authority of the General Student Council President. #nIf they get involved, it would mean the GSC is intervening in Gehenna's affairs."
212010-115 = "It could end up becoming a matter of Gehenna's sovereignty."
212010-116 = "[s] \"Satsuki is right.\""
212010-117 = "Y-you're right..."
212010-118 = "Gehenna's problems should be solved by Gehenna."
212010-119 = "I want to uphold that principle as much as possible."
212010-120 = "Of course, there's nothing wrong with asking for help."
212010-121 = "But shouldn't we try our best on our own first?"
212010-123 = "...I agree."
212010-124 = "The Gehenna leadership has declared war on Kivotos. #nIf this fact leaks out, it will cause total chaos."
212010-125 = "We must resolve this internally, no matter what."
212010-126 = "[s] \"Yeah, let's do whatever it takes.\""
212010-128 = "So, we'll keep relying on Schale as a last resort, #nand do everything we can ourselves before it's too late."
212010-129 = "That's the goal, right?"
212010-130 = "Yes, that's correct."
212010-135 = "(We continued to discuss, but...)"
212010-139 = "(We couldn't come up with a definitive solution.)"
212010-143 = "Where should we even start..."
212010-148 = "Satsuki-giin, do you remember? #nThere was a strange sound in that broadcast, right?"
212010-149 = "That... what was it again."
212010-150 = "That's it! The trigger! Isn't that the trigger?"
212010-154 = "It's highly likely."
212010-155 = "A combination of specific words that don't follow a consistent context acts as a trigger, waking up the dormant subconscious..."
212010-156 = "Doesn't that seem like a lead?"
212010-157 = "Like, maybe playing the words in reverse would undo it."
212010-158 = "From my research, I don't think there's any brainwashing that can be undone just by rewinding a tape."
212010-159 = "So it's not that simple..."
212010-160 = "But the idea isn't bad. #nSometimes, a simple solution is the key to untangling a difficult problem."
212010-166 = "Ugh..."
212010-167 = "It's ringing in my head...!"
212010-168 = "Come to think of it, that sound was playing during the broadcast too, wasn't it?"
212010-172 = "……."
212010-173 = "Frequency...?"
212010-174 = "[s] \"Does something come to mind?\""
212010-175 = "What if the trigger keyword is just a signal? #nWhat if the important part of the brainwashing is a specific frequency? That's what wakes up the subconscious..."
212010-179 = "Senpai...?"
212010-180 = "She seems deep in thought..."
212010-181 = "It's probably best not to disturb her."
212010-188 = "I might have... found a lead."
212010-189 = "Really!?"
212010-190 = "I'm not certain, but it's definitely worth a try."
212010-191 = "Several methods have come to mind, so I'll go back and do some research."
212010-192 = "You're reliable...! Even though I usually think you're a weirdo!"
212010-194 = "Iori...!"
212010-195 = "Well... it is the truth..."
212010-196 = "But she's someone who gets things done when it counts."
212010-198 = "As the head of the Pandemonium Society's Intelligence Department, I can't show a pathetic side, can I?"
212010-199 = "[s3] \"Satsuki, I'm counting on you.\"\n[s4] \"Call me if you need any help.\""
212010-202 = "That's reassuring."
212010-203 = "Oh, and one more thing. #nThis is just a guess, but those who are brainwashed—"
212010-204 = "They won't show mercy to those who defy them."
212010-205 = "……!"
212010-206 = "Because that was the Kaiser's way."
212010-212 = "So... please be careful. I'll let you know when I have results."
212010-217 = "...Shall we head back too? It might look suspicious if we're gone for too long."
212010-218 = "You're right. And besides, there's a limit to what we can do on our own anyway."
212010-219 = "[s] \"I'll try asking other students for their cooperation.\""
212010-220 = "That said, if Satsuki-senpai's concerns are correct, isn't Sensei the one in the most danger?"
212010-221 = "You already stand out, so if you move too conspicuously..."
212010-222 = "[s5] \"I'll be careful.\"\n[s6] \"Thanks for worrying about me.\""
212010-225 = "...Knowing you, Sensei, I'm sure you'll handle it wisely."
212010-226 = "Sensei... thank you for being here with us."
212010-227 = "It's reassuring. #n...Truly."
212010-229 = "Yeah. It really is..."
212010-230 = "[s] \"Alright, let's break for now.\""
212010-232 = "Everyone, please be careful."
212010-233 = "Let's meet again."
212010-235 = "Contact me if anything happens!"
212010-243 = "Sigh..."
212010-247 = "Seniors... don't let yourselves be defeated by the Kaiser's legacy...!"
212010-248 = "Please, come back to your senses... I don't care if you cause a scene. I don't mind patrolling alone for a while."
212010-249 = "I'll even put up with being bullied by the Pandemonium Society twice... no, three times...! So please...!"
212010-250 = "So... please..."
212010-252 = "……."
212010-254 = "Next Episode;Chinatsu"