[translation]
52085-15 = "Arf, arf..."
52085-16 = "...Ainda não acabou!"
52085-21 = "Que insistente... logo você, Nagusa-chan."
52085-22 = "Eu pretendia encerrar isso rapidinho, mas—"
52085-29 = "Nagusa-senpai!"
52085-30 = "...Espera, o que é isso?!"
52085-31 = "Senpai! A senhora está bem?!"
52085-36 = "[ns] \"Nagusa, você está bem?!\""
52085-37 = "Eu estou bem, mas a contadora de histórias de terror do Clube Beleza da Natureza..."
52085-38 = "Droga, já farejaram até aqui?"
52085-42 = "Aquela garota..."
52085-43 = "É aquela pirralha atrevida daquela vez!"
52085-48 = "Quem você está chamando de pirralha atrevida?!"
52085-49 = "Que raiva... faltava tão pouco...!"
52085-50 = "...Não tem jeito, né.#nMas já que vocês colocaram os pés nesta terra,#ncom certeza ainda teremos outra chance de retomar a história."
52085-54 = "Pois bem, pois bem, por hoje eu vou me retirar por aqui."
52085-59 = "Nem pense em fugir!"
52085-60 = "Renge, Yukari. Desta vez vamos pegá-la!"
52085-80 = "Nossa, como ela é ágil!"
52085-81 = "Droga, ela é uma doninha ou o quê...?!"
52085-86 = "Huhu♪#nCom esses movimentos, vocês podem tentar por anos que não vão conseguir me pegar!"
52085-87 = "Pois então, até o dia em que nos encontrarmos de no—"
52085-93 = "Hã...?"
52085-99 = "Aaaaargh!"
52085-108 = "...Parece que cheguei bem na hora."
52085-109 = "Pessoal, alguém se machucou?"
52085-113 = "Não pode ser..."
52085-114 = "Essa voz..."
52085-121 = "Quanto tempo, Nagusa."
52085-125 = "E todo mundo também. Que bom ver vocês."
52085-131 = "...Ayame!"
52085-133 = "Próximo;A Presidente da Hyakkaryouran"
