[translation]
102145-3 = "Кохару!"
102145-4 = ""
102145-6 = "Кохару! Ты в порядке?"
102145-8 = "Х-Хасуми... Маширо..."
102145-10 = "Всё будет хорошо! Отряд правосудия здесь!"
102145-11 = "Слава богу, вы пришли! Ведьма..."
102145-15 = "...Мика."
102145-16 = "Привет, Хасуми. С Кохару всё в порядке, но она немного ранена... Позаботься о ней."
102145-17 = "..."
102145-18 = "Что за взгляд? Я ничего плохого не сделала... Во всяком случае, в этот раз."
102145-19 = "О-Она права... Хасуми, эм... Она... Мика спасла меня!"
102145-20 = "Пойдём, Кохару."
102145-21 = "Л-Ладно."
102145-22 = "Пока-пока, Кохару."
102145-24 = ""
102145-25 = "...Спасибо, что помогла Кохару, Мика."
102145-26 = "А? Не ожидала услышать от тебя благодарность..."
102145-27 = "...Каждый заслуживает признания, когда поступает правильно."
102145-28 = "...Ну, ладно. Наверное."
102145-29 = "У меня ещё куча дел, так что я пойду."
102145-30 = "Ещё увидимся, Хасуми."
102145-31 = ""
102145-33 = ""
102145-34 = "..."
