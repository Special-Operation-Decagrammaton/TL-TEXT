[translation]
1003105-1 = "Первый шаг вместе с тобой"
1003105-2 = "(После последнего сообщения Ару я направился к месту встречи.)"
1003105-6 = "(В первое утро нового года вокруг было тише и чище обычного.)"
1003105-8 = "(Даже городские огни казались немного ярче.)"
1003105-9 = "(Наверное, поэтому от ветра по коже пробегало ещё больше мурашек, чем обычно.)"
1003105-12 = "(Было ещё достаточно рано и достаточно холодно, чтобы щёки и кончик носа покраснели.)"
1003105-14 = "(Я потерял счёт времени, пока шёл, и холод постепенно пробирался сквозь зимнюю одежду.)"
1003105-15 = "(Наконец я добрался до новогоднего мероприятия буквально в последний момент.)"
1003105-18 = ""
1003105-19 = ""
1003105-20 = "Вы опоздали, Сенсей."
1003105-21 = "[s] «Прости. Кстати...»"
1003105-22 = "А? Почему вы так на меня смотрите?"
1003105-23 = "Хи-хи. Похоже, вы хотите что-то сказать."
1003105-24 = ""
1003105-25 = "*нервно оглядывается*"
1003105-26 = "... *нервно оглядывается*"
1003105-27 = "[s1] «В прошлый раз я так и не успел сказать, но...»\n[s2] «Твой наряд, он...»"
1003105-28 = "Эм, п-подождите!"
1003105-29 = "Эм, п-подождите!"
1003105-30 = ""
1003105-32 = "(Ч-Что это сейчас была за неловкая пауза?! Сердце сейчас выпрыгнет из груди. Отмена! Я не готова! Я не гото-о-ова!)"
1003105-33 = "(Тяни время! Тяни время!!!)"
1003105-34 = ""
1003105-36 = "Д-Давайте поговорим об этом позже. Сейчас есть более срочные вопросы."
1003105-37 = "[s] «Более срочные вопросы?»"
1003105-38 = "Я не просто так позвала вас сюда так рано утром."
1003105-39 = "Я хотела лично поздравить вас с Новым годом."
1003105-40 = "Вы знали, что это место считается священным? Просить ведь не вредно, так что... не хотите немного провести время со мной, Сенсей?"
1003105-41 = "[s] «Хорошо.»"
1003105-42 = "Хорошо, тогда идёмте, Сенсей!"
1003105-45 = "― Хи-хи. Вы такой медленный, Сенсей.[wa:2670]"
1003105-47 = "― А? Я слишком быстро иду? Не говорите глупостей.[wa:3210]"
1003105-50 = "― Ну, просто я всегда стараюсь быть пунктуальной.[wa:1270]"
1003105-52 = "― В конце концов, я босс.[wa:2860]"
1003105-55 = "― Кто рано встаёт, тому и везёт.[wa:910]"
1003105-58 = "― А в этом году «Решатели проблем»[wa:10]"
1003105-60 = "― будут работать усерднее, чем когда-либо.[wa:1070]"
1003105-63 = "― Разумеется, это касается и вас, Сенсей.[wa:10]"
1003105-66 = "― Вы ведь наш деловой партнёр."
1003105-68 = "― Мы бы ни за что не исключили вас из наших деловых планов.[wa:1610]"
1003105-71 = "― За наши отношения.[wa:1070]"
1003105-73 = "― Надеюсь, мы ещё долго будем вместе.[wa:1050]"
1003105-76 = "― Я-я имею в виду деловые отношения! Исключительно профессиональные![wa:920]"
1003105-79 = "― (Ч-Что я вообще сейчас говорю?![wa:3020]"
1003105-81 = "― И зачем я только рот открыла!)[wa:160]"
1003105-88 = "Ещё раз спасибо, что встретились со мной так рано утром, Сенсей."
1003105-89 = "На улице довольно холодно. Вы нормально себя чувствуете?"
1003105-90 = "[s] «Да, лучше не бывает.»"
1003105-91 = "О, х-хорошо."
1003105-92 = "Ну, думаю, на этом всё. Пойдём домой?"
1003105-93 = "[s] «Ару.»"
1003105-94 = "Д-Да? Ч-Что такое, Сенсей?"
1003105-95 = "[s3] «Этот наряд тебе очень идёт.»\n[s4] «Сегодня ты выглядишь очень красиво.»"
1003105-96 = "...!"
1003105-97 = "...!"
1003105-98 = ""
1003105-100 = ""
1003105-101 = "Хе-хе. Ну разумеется. Я всё-таки глава Решал 68."
1003105-102 = ""
1003105-104 = ""
1003105-105 = ""
1003105-107 = "Но спасибо за комплимент, Сенсей."
