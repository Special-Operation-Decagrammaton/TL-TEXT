[translation]
10018090-1 = "Эпизод 9; Пути назад нет"
10018090-3 = "..."
10018090-4 = "[s] «Ты в порядке, Фуука?»"
10018090-5 = ""
10018090-7 = ""
10018090-8 = "О, Сенсей."
10018090-9 = "Да, всё нормально. Просто дел очень много."
10018090-10 = "[s1] «Тебе не стоит так перенапрягаться.»\n[s2] «Почему бы тебе не отдохнуть?»"
10018090-11 = ""
10018090-12 = ""
10018090-14 = ""
10018090-15 = "Простите."
10018090-16 = ""
10018090-18 = ""
10018090-19 = "Я... пойду немного подышу свежим воздухом."
10018090-20 = ""
10018090-22 = ""
10018090-24 = "..."
10018090-25 = "[s] «Ты, наверное, думаешь, что Фуука совсем вымоталась.»"
10018090-26 = "Я ведь даже ничего не сказал."
10018090-27 = "[s] «Но ты весь день наблюдала за ней.»"
10018090-28 = ""
10018090-30 = ""
10018090-31 = "Похоже, от вас ничего не скроешь."
10018090-32 = "Она явно достигла своего предела."
10018090-33 = "Но я не понимаю почему."
10018090-34 = "[s] «А чего хочешь ты, Харуна?»"
10018090-35 = "...Не такого вопроса я ожидала."
10018090-36 = "Вы всегда застаете меня врасплох."
10018090-37 = ""
10018090-39 = ""
10018090-40 = "Я хочу победить. Нам нужно победить."
10018090-41 = "Не только ради гастрономии, но и ради всех, кто надеется на «Воробей»."
10018090-42 = "Но то, что нам нужно для победы... это не моя сила."
10018090-43 = "И осознавать это больно."
10018090-44 = "[s] «Уверен, ты тоже можешь что-то сделать.»"
10018090-45 = "Правда так думаешь?"
10018090-46 = "[s] «Да.»"
10018090-47 = ""
10018090-49 = ""
10018090-50 = ""
10018090-51 = ""
10018090-52 = ""
10018090-54 = "...Можете сказать мне?"
10018090-55 = "[ns] «Ну...»"
10018090-56 = ""
10018090-60 = ""
10018090-61 = "С-С Фуукой что-то случилось?"
10018090-63 = "Я только что видела, как она ехала на скутере в сторону Геенны!"
10018090-65 = ""
10018090-66 = "О, она просто вышла подышать свежим воздухом. Фух."
10018090-67 = "[s] «Ты представляешь, зачем Фууке сейчас ехать в Геенну?»"
10018090-68 = ""
10018090-70 = ""
10018090-71 = "...Да, кажется, знаю."
10018090-75 = "Ты абсолютно уверена?"
10018090-76 = "[s] «Я доверяю Джури, она знает, о чём говорит.»"
10018090-77 = "Я тоже..."
10018090-78 = "Но неужели она правда ходит на крышу Клуба школьной столовой, чтобы снять стресс?"
10018090-79 = ""
10018090-81 = ""
10018090-82 = ""
10018090-83 = "...Вот она. Невероятно."
10018090-84 = "[s] «Ладно, теперь твой выход, Харуна.»"
10018090-85 = ""
10018090-87 = ""
10018090-88 = "Ч-Что вы такое говорите, Сенсей? Вы куда лучше подходите для подобных ситуаций."
10018090-89 = "[s] «Думаю, в этот раз лучше тебе разобраться самой.»"
10018090-90 = ""
10018090-92 = ""
10018090-93 = "...Могу спросить почему?"
10018090-94 = "[ns] «Когда дело касается понимания Фууки...»"
10018090-96 = "[ns] «...тут ты превосходишь меня, Харуна.»"
10018090-97 = "Ценю добрые слова."
10018090-98 = "Но разве этим не должен заняться подходящий человек?"
10018090-99 = "Что? Я и есть подходящий человек?"
10018090-100 = "..."
10018090-101 = "...Понятно."
10018090-102 = "Если вы настаиваете, Сенсей..."
10018090-104 = ""
10018090-106 = ""
10018090-107 = "...А я всё гадала, что это за шум."
10018090-108 = "Прости за вторжение."
10018090-109 = "Джури сказала тебе, что я буду здесь?"
10018090-110 = "Да. Я не вовремя?"
10018090-111 = "Если ты по поводу работы, не переживай. Я скоро вернусь."
10018090-112 = "Мне просто... нужна минутка."
10018090-113 = "Так... Хорошая у вас крыша. Часто сюда приходишь?"
10018090-114 = "Работа в Клубе школьной столовой отнимает много времени, так что уходить далеко на перерыв сложно."
10018090-115 = "Эта крыша стала моим любимым местом для отдыха."
10018090-116 = "Ты в стрессе?"
10018090-117 = "Соврала бы, если бы сказала, что нет."
10018090-118 = "...Я думала о том, ради чего мы боремся и против чего."
10018090-119 = "Ну, мы боремся ради гастрономии и против нечестных деловых методов Няо Фудс."
10018090-120 = "Я слышала, о чём вы говорили с бандой гурманов в шлемах."
10018090-121 = ""
10018090-123 = ""
10018090-124 = "...От Акари?"
10018090-125 = "Ага."
10018090-126 = "Тогда ты всё знаешь."
10018090-127 = "Если мы победим, люди, работающие на Няо Фудс, потеряют работу?"
10018090-128 = "...Такая вероятность не нулевая."
10018090-129 = "Если Няо Фудс не сможет взять «Воробей» под контроль..."
10018090-130 = "...это может вызвать цепную реакцию, и другие владельцы ресторанов тоже начнут отказываться от Няо Фудс."
10018090-131 = "А это, в свою очередь, может привести к спаду их бизнеса по поставкам."
10018090-132 = "Естественно, если из-за снижения объёма бизнеса им придётся сокращать расходы, скорее всего, начнут увольнять сотрудников."
10018090-133 = "Да, именно это меня и беспокоит."
10018090-134 = "И наверняка есть владельцы магазинов, которые сами хотят быть на стороне Няо Фудс."
10018090-135 = "А некоторые считают, что мы просто создаём ненужные проблемы."
10018090-136 = "Некоторые слишком боятся воды, чтобы раскачивать лодку."
10018090-137 = "Но знаешь, иногда лодку всё-таки нужно раскачать."
10018090-138 = "Да, ну а иногда лодка просто переворачивается."
10018090-139 = "О, правда?"
10018090-140 = "Я просто хотела помочь хозяйке «Воробья»."
10018090-141 = "Как всё вообще дошло до такого?"
10018090-142 = "Ты правда настолько переживаешь?"
10018090-143 = "Если мы победим, если я помогу тебе победить, люди потеряют что-то важное."
10018090-144 = "Я ненавижу видеть, как другие страдают. Именно поэтому я вступила в Клуб школьной столовой."
10018090-145 = ""
10018090-147 = ""
10018090-148 = "И? Какими ты видишь нас?"
10018090-149 = "Как студентов в столовой. Я должна о вас заботиться."
10018090-150 = "И банда гурманов в шлемах для тебя такая же."
10018090-151 = "Странно, да? Хотя всё, что они делали, — нападали на нас..."
10018090-152 = ""
10018090-154 = ""
10018090-156 = "Фуука."
10018090-158 = "Хм?"
10018090-160 = "Где есть приобретение, там следует и потеря. Гастрономия — не исключение. Колебания лишь приведут к исчезновению отличных ресторанов."
10018090-161 = "Мы не можем просто смотреть, как это происходит. Разве не поэтому мы боремся?"
10018090-162 = "...Ага."
10018090-163 = "Няо Фудс не собирается давать нам поблажек."
10018090-165 = ""
10018090-167 = "Они уже пытаются уничтожить нас и «Воробей» любыми средствами."
10018090-168 = "Даже если мы победим, Няо Фудс потеряет лишь возможность."
10018090-169 = "Увольнения могут произойти, а могут и нет. Это возможность, но лишь возможность."
10018090-170 = ""
10018090-172 = "Но если проиграем мы, хозяйка «Воробья» потеряет всё."
10018090-173 = "И это уже не возможность, а неизбежность."
10018090-174 = "Это я понимаю..."
10018090-177 = "И хозяйка «Воробья» будет не единственной жертвой."
10018090-178 = "Все на этой улице тоже станут жертвами."
10018090-179 = "Почему?"
10018090-180 = ""
10018090-182 = ""
10018090-183 = ""
10018090-185 = "Они потеряют своё неотъемлемое право познать истинное гастрономическое величие."
10018090-186 = ""
10018090-188 = ""
10018090-190 = ""
10018090-191 = "...Ха-ха-ха."
10018090-192 = "П-Почему ты смеёшься?"
10018090-193 = "Это было очень по-харуновски."
10018090-194 = "Кхм."
10018090-195 = "Когда речь идёт о гастрономии, я могу предложить лишь искренность. В этом я не иду на компромиссы."
10018090-196 = "И ты тоже, Фуука."
10018090-197 = "Я?"
10018090-198 = "Я тебя знаю. Ты редко показываешь свои настоящие навыки."
10018090-199 = "Тебе просто не выпадало возможности."
10018090-201 = "Ну вот она. Неужели ты правда отступишь сейчас?"
10018090-203 = "Понятно."
10018090-204 = "Раз ты настолько решительна, похоже, мне придётся пойти вместе с вами."
10018090-205 = "А какой ещё выбор? Мы уже зашли так далеко."
10018090-206 = "Да, благодаря кое-кому."
10018090-207 = ""
10018090-209 = ""
10018090-210 = ""
10018090-211 = "Ну что, пойдём?"
10018090-212 = "Полагаю, Сенсей тоже здесь?"
10018090-213 = "[s] «Меня поймали!»"
10018090-215 = "Я так и думала."
10018090-220 = "Смешайте бульон из бонито с яйцом..."
10018090-221 = ""
10018090-224 = "Немного сахара в соевый соус и мирин... мелко перемолотое рыбное мясо…"
10018090-225 = "А что с икрой сельди?"
10018090-226 = "Сейчас сушится. Дальше обжарить желтохвоста и морского окуня..."
10018090-227 = "Креветки готовы."
10018090-228 = ""
10018090-230 = ""
10018090-231 = ""
10018090-232 = "Давайте это высушим отдельно..."
10018090-233 = ""
10018090-235 = ""
10018090-236 = "Я закончила нарезать морковь!"
10018090-237 = "Спасибо!"
10018090-238 = "О, я забыла таро..."
10018090-239 = ""
10018090-241 = ""
10018090-243 = ""
10018090-244 = "Так приятно на это смотреть."
10018090-245 = "Хозяйка и Клуб школьной столовой вместе готовят осэти при поддержке Общества гурманов..."
10018090-247 = "Да, наши дегустации бесценны. ★"
10018090-248 = "Эй, дегустация действительно важна для готовки. К тому же мы отвечаем за уборку."
10018090-249 = "Я просто рада быть здесь! Надо чаще устраивать кулинарные поединки не на жизнь, а на смерть!"
10018090-254 = ""
10018090-258 = ""
10018090-259 = "Мва-ха-ха. Дайте мне отчёт о производстве осэти."
10018090-260 = "Как хорошо смазанный механизм. Варка, маринование, запекание... всё работает без сбоев."
10018090-261 = "Больше производства! Больше потребления! Новое значение еды с конвейера!"
10018090-262 = "Чем больше еды мы делаем, тем больше денег загребаем!"
10018090-264 = "Ешь, чтобы наполнить желудок, работай, чтобы наполнить жизнь!"
10018090-265 = ""
10018090-268 = ""
10018090-269 = "Моя жизнь и так уже переполнена..."
