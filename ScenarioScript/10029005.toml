[translation]
10029005-22 = "#video;10029"
10029005-1 = "Пролог;Другой Академгородок"
10029005-2 = "Я закончила дела на сегодня и только устроилась на диване в комнате отдыха."
10029005-3 = ""
10029005-7 = ""
10029005-8 = "О, Сенсей. Вы в комнате отдыха? Очень кстати."
10029005-9 = "[s1] «Эйми? Что случилось?»\n[s2] «И почему кстати?»"
10029005-12 = "Эм. Нет времени объяснять. Вам нужно увидеть это лично."
10029005-13 = "Я как раз звонила, чтобы попросить вас немедленно приехать в Миллениум. Если вы не против."
10029005-14 = "...О?"
10029005-15 = "Если не вдаваться в подробности, у меня есть время на короткое объяснение?"
10029005-16 = "Вы правы. Если заранее сообщить вам кое-какие сведения, вы будете лучше подготовлены к разным сценариям."
10029005-17 = "Так будет эффективнее. Хорошо, я объясню."
10029005-18 = "Во время задания Отряда Исследования Сверхъестественного я нашла в руинах Миллениума нескольких незнакомцев без сознания. Я доставила их в академию."
10029005-19 = "Но, по словам президента, эти люди..."
10029005-20 = "Она говорит, что они не «люди Кивотоса.»"