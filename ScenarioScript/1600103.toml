[translation]
1600103-1 = "Слежка на свидании"
1600103-2 = "Ю-ху, Господин! Я здесь! Я тебя ждала!"
1600103-3 = "Спасибо, что нашёл для меня время, хотя ты так занят. Ты лучший!"
1600103-4 = "[s1] «Что происходит?»\n[s2] «Ты попросила, и я, конечно, пришёл.»"
1600103-5 = "Знаю, это внезапно, но мне нужна твоя помощь!"
1600103-6 = "Правда?! Всё-таки нет никого лучше тебя, Господин!"
1600103-7 = "Хм? Какая именно помощь мне нужна? Ну..."
1600103-8 = "Хороший вопрос."
1600103-9 = "Если честно, я и сама пока не придумала."
1600103-10 = "[s] «???»"
1600103-11 = "Что? Чего ты на меня так смотришь?"
1600103-12 = "Мне правда нужна твоя помощь? Конечно! Просто детали я ещё не продумала!"
1600103-13 = "Так уж вышло, что сегодня у меня ни миссий, ни занятий."
1600103-14 = "А значит, мне нужен кто-то, с кем можно провести время. Ты же поможешь мне с этим, Господин?"
1600103-15 = "А? Я приглашаю тебя на свидание?"
1600103-16 = "Хм... Не знаю. Просто сегодня почему-то захотелось побыть с тобой."
1600103-17 = "Но, может, и приглашаю! Если ты не против, Господин, то я только за!"
1600103-18 = "Пойдём! Времени не так много, я готова идти прямо сейчас. Ты же не против?"
1600103-19 = ""
1600103-20 = ""
1600103-21 = "Пошли!"
1600103-23 = "(Не дав мне ничего сказать, Асуна цепляется за мою руку и утаскивает меня.)"
1600103-25 = "Так, просто затаимся и схватим студентов, которые пройдут мимо..."
1600103-26 = "Ага, идеально. Это точно..."
1600103-27 = "...! П-Погодите! Это же горничная из C&C?"
1600103-29 = "Хм-хм. ♬"
1600103-30 = ""
1600103-31 = ""
1600103-32 = "Чёрт, ты права. Если нас заметят, потом остатки губкой собирать придётся. Валим отсюда."
1600103-36 = ""
1600103-37 = ""
1600103-38 = "А? Кто-то только что говорил про нас? Я будто что-то слышала..."
1600103-39 = "Показалось?"
1600103-40 = "Ну и ладно! Неважно."
1600103-41 = "Пойдём скорее, Господин. Сегодня я хочу побывать с тобой везде!"
1600103-43 = "(Асуна уверенно шагает вперёд, не отпуская мою руку.)"
1600103-45 = "В прошлый раз не вышло, но теперь точно..."
1600103-48 = "Это снова они! Вот чёрт, бежим! Они идут сюда!"
1600103-51 = "Сюда, Господин. Есть игра, в которую я давно хотела сыграть!"
1600103-52 = "*вдох* Ты уже играл? Отлично, вызываю тебя на бой!"
1600103-53 = "Знаю ли я правила? Не-а! Сегодня играю впервые."
1600103-54 = "Разберусь по ходу! Какая разница, кто выиграет, а кто проиграет?"
1600103-55 = "...Главное, что я играю вместе с тобой."
1600103-56 = "Ладно! Начинаем!"
1600103-57 = "(Я уверенно принял вызов Асуны — раньше я уже играл в эту игру.)"
1600103-59 = "(...И проиграл все партии.)"
1600103-63 = "Что-то тут не сходится. За нами правда кто-то гонится...?"
1600103-64 = "О-Они опять идут! Чёрт... Бежим!"
1600103-67 = "Парк аттракционов! Я ещё ни разу не приходила сюда вот так!"
1600103-68 = "Ну, бывала здесь по заданию, но это не считается. И никто не может винить меня за то, что я катаюсь на аттракционах во время служебной миссии."
1600103-69 = "Когда я сказала «вот так», я имела в виду — прийти сюда вместе с тобой."
1600103-70 = "Я же говорила: детали не важны, пока мы вдвоём!"
1600103-71 = "Игровые автоматы, парк развлечений — особенными их делает то, что я здесь с тобой!"
1600103-72 = "С тобой мне весело чем бы мы ни занимались, Господин. Даже просто гулять."
1600103-73 = "Кстати, хочешь прогуляться? Ноги ещё не устали?"
1600103-74 = "[s] «Я не против.»"
1600103-75 = "Договорились! Будем гулять до заката, так что не отставай!"
1600103-76 = "Но если ноги заболят, обязательно скажи, ладно? Я могу понести тебя на спине!"
1600103-77 = ""
1600103-78 = "(Асуна бодро зашагала вперёд.)"
1600103-80 = "(В итоге силы у меня всё-таки закончились, и обратно на территорию академии Асуна несла меня на спине.)"
1600103-82 = "Ух ты! Было очень весело! Мне ужасно понравилось!"
1600103-83 = "Господин, ты что-то сказал?"
1600103-84 = "Хочешь спуститься? Тебя слишком смущают взгляды людей?"
1600103-85 = "Почему? Какая разница, что они думают?"
1600103-86 = "Хм! Ладно. Не понимаю, что такого, но ты главный. Спускайся."
1600103-87 = ""
1600103-88 = ""
1600103-89 = "Ну как? Ноги уже лучше?"
1600103-90 = "[s] (Протянуть ей принесённый напиток.)"
1600103-91 = "Ты принёс мне энергетик? Как мило, Господин!"
1600103-92 = "*глоток* *глоток*"
1600103-93 = "Ах! Как хорошо пошло!"
1600103-94 = "..."
1600103-95 = "Даже странно, насколько я счастлива."
1600103-96 = "Сегодня мы делали всё то же, что я обычно делаю, но рядом с тобой это ощущалось совсем иначе."
1600103-97 = "Может, в тебе и правда есть что-то... особенное."
1600103-98 = "Хи-хи. По крайней мере, мне так кажется."
1600103-99 = "День почти закончился. Тебе уже скоро пора возвращаться, да?"
1600103-100 = "Я всё равно донесла тебя досюда, так что могу подвезти и остаток пути. Что? Всё ещё стесняешься?"
1600103-101 = "Ха-ха! Я просто дразнюсь."
1600103-102 = "Сейчас выброшу банку, и можем идти."
1600103-103 = ""
1600103-104 = "*вжух*"
1600103-105 = "Ой. Промахнулась."
1600103-106 = "*ЛЯЗГ*"
1600103-107 = "Что за...? Она во что-то попала?"
1600103-108 = ""
1600103-109 = "...?"
1600103-110 = "Ч-Чёрт! Так и знала, что они за нами следят!"
1600103-111 = "Нам конец. Сворачиваем план...!"
1600103-112 = "Проклятье. Мы этого не забудем, C&C!"
1600103-114 = ""
1600103-115 = "..."
1600103-116 = "...?"
1600103-118 = "Что это вообще было?"
