[translation]
2000906-1 = "Власть из молока"
2000906-2 = "После купания я снова встретил Черино у киоска перед рёканом."
2000906-3 = "*вздыхает* Оказывается, лежать в горячей воде, когда голова забита мыслями, куда приятнее, чем я ожидала."
2000906-4 = "Сложные мысли исчезают, и меня начинает клонить в сон..."
2000906-5 = "Погодите, неужели это то самое состояние бескорыстия, о котором говорят монахи?"
2000906-6 = "Я и так знала, что великолепна, но не думала, что перескочу ступени взросления и сразу взберусь на ступени святости."
2000906-7 = "Меня уже начинает пугать скорость моего внутреннего роста."
2000906-8 = "[s] «Тогда ты не будешь пить фруктовое молоко?»"
2000906-9 = "Конечно нельзя!"
2000906-10 = "Достижение святости и вкусная еда — совершенно разные вещи!"
2000906-11 = "Дай мне фруктовое молоко прямо сейчас!"
2000906-12 = ""
2000906-14 = ""
2000906-15 = ""
2000906-17 = "[ns] Передать Черино фруктовое молоко."
2000906-18 = "Хм-м, в отличие от обычного молока, сладкий аромат фруктового молока сразу возбуждает аппетит."
2000906-19 = "Попробую."
2000906-20 = ""
2000906-22 = ""
2000906-23 = ""
2000906-24 = ""
2000906-26 = "― [log=체리노 온천ND]*глоток* *глоток* ...Ого![/log][wa:1330]"
2000906-30 = "― [log=체리노 온천ND]Хи-хи. Вкус фруктового молока после ванны...[/log][wa:10]"
2000906-32 = "― [log=체리노 온천ND]Это просто лучше всего![/log]"
2000906-35 = "― [log=체리노 온천ND]Хм? Почему ты так на меня смотришь, товарищ?[/log][wa:940]"
2000906-37 = "― [log=체리노 온천ND]У меня что-то на лице?[/log][wa:780]"
2000906-40 = "― [log=체리노 온천ND]А? У меня над губой след в форме усов?[/log][wa:2360]"
2000906-43 = "― [log=체리노 온천ND]Ого, и правда![/log][wa:570]"
2000906-45 = "― [log=체리노 온천ND]Я всего лишь выпила молоко, а у меня уже появились великолепные усы![/log][wa:340]"
2000906-48 = "― [log=체리노 온천ND]Получается, я могу наслаждаться вкусными напитками[/log]"
2000906-50 = "― [log=체리노 온천ND]и заодно каждый раз получать новые усы?[/log]"
2000906-53 = "― [log=체리노 온천ND]Потрясающе! Товарищ, принеси ещё фруктового молока! Немедленно![/log][wa:750]"
2000906-55 = "― [log=체리노 온천ND]Мне нужно ещё очень много этого фруктового молока![/log][wa:940]"
2000906-58 = "Что? Усы уже исчезли?"
2000906-59 = "Неважно. Каждый раз, когда я пью фруктовое молоко, я могу получать новые усы."
2000906-60 = "И мне больше никогда не придётся переживать, что усы отвалятся или испачкаются..."
2000906-61 = "Я просто буду постоянно пить фруктовое молоко, чтобы мои усы не высыхали!"
2000906-63 = "Черино всю ночь мучилась с животом, выпив больше десяти бутылок фруктового молока."
