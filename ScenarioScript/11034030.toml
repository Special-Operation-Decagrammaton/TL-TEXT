[translation]
11034030-1 = "Выступление;Соревновательный дух 1"
11034030-2 = "...Ай, щиплет!!"
11034030-3 = "Ай-ай... Ну серьёзно..."
11034030-4 = "О, ты поранилась?"
11034030-5 = "Нет, просто слегка порезала палец струной гитары..."
11034030-6 = "Пф, жалкое зрелище."
11034030-7 = "Стой там. Где-то здесь наверняка были пластыри..."
11034030-8 = "...А? Когда они закончились?"
11034030-10 = "Раньше... когда ты использовала последний."
11034030-11 = "А?"
11034030-12 = "...Хм. Когда это я...?"
11034030-13 = "Ты лучше о своих пальцах беспокойся, а не о моих. Это первый маленький порез, который я получила с тех пор, как мы начали."
11034030-14 = "М-Может, сделаем перерыв? Вы обе... Нам необязательно так себя изматывать..."
11034030-15 = "Всё нормально. Мы не настолько уж себя загоняем. Как я сказала, у меня это впервые."
11034030-17 = "...В отличие от кое-кого."
11034030-18 = "Хм?"
11034030-19 = "Серьёзно, снова хочешь начать ссору?"
11034030-20 = "А кто первой назвала меня жалкой?"
11034030-22 = "...О-о. Сцена готова для противостояния."
11034030-23 = "Э-Эй, вы обе, давайте не будем ссориться!"
11034030-24 = "Хм? ...А, всё нормально, Айри. Мы на самом деле не ссоримся. Не переживай."
11034030-25 = "Мы просто..."
11034030-26 = "...А, тренируем выносливость друг друга — смотрим, кто первым свалится."
11034030-28 = "Ха. Думаешь, ещё долго продержишься?"
11034030-29 = "Хм..."
11034030-30 = "...О-хо."
11034030-31 = ""
11034030-33 = ""
11034030-34 = "М-м. Понятно. Это определённо..."
11034030-35 = ""
11034030-37 = ""
11034030-38 = "...рок!"
