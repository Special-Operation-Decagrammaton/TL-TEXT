[translation]
901010800320-7 = ""
901010800320-8 = "Sensei? O que faz acordado a uma hora dessas...?"
901010800320-9 = "[s1] \"Vi as luzes do QG acesas e vim ver.\"\n[s2] \"Vocês ainda não foram dormir?\""
901010800320-12 = "Sim. Como tínhamos uma operação noturna hoje..."
901010800320-13 = "Estávamos compilando os dados coletados antes de descansar..."
901010800320-14 = "Desculpe se acabamos preocupando você a ponto de tirá-lo da cama."
901010800320-15 = "[s3] \"Imagina, eu também estava fazendo hora extra.\"\n[s4] \"Fiquei atolado com as consultas do dia e não terminei a papelada...\""
901010800320-18 = "Sensei, você tá bem de saúde?"
901010800320-19 = "A gente se reveza pra dormir no alojamento, mas parece que você não tá descansando direito faz tempo..."
901010800320-20 = "[s] \"Não se preocupem, estou tomando meus suplementos vitamínicos direitinho!\""
901010800320-21 = "Pois saiba que ouvir isso só me deixa com o dobro de preocupação..."
901010800320-22 = ""
901010800320-24 = ""
901010800320-27 = ""
901010800320-28 = "Então, para que o Sensei possa ir para a cama o quanto antes, faremos um relatório bem sucinto."
