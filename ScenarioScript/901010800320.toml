901010800320-7 = ""
901010800320-8 = "Сенсей? Что привело вас сюда так поздно?"
901010800320-9 = "[s1] «Я проходил мимо и заметил, что у вас горит свет.»\n[s2] «Почему вы все ещё не спите?»"
901010800320-12 = "У нас была ночная миссия."
901010800320-13 = "Мы как раз собирались систематизировать все зацепки и ложиться спать..."
901010800320-14 = "Простите, что заставили волноваться."
901010800320-15 = "[s3] «Я тоже задержался на работе.»\n[s4] «Дел накопилось...»"
901010800320-18 = "Сенсей, вы о себе заботитесь?"
901010800320-19 = "Мы хотя бы можем спать по сменам. А вы один."
901010800320-20 = "[s] «Всё нормально. Я принимаю все добавки!»"
901010800320-21 = "Это плохой ответ..."
901010800320-22 = ""
901010800320-24 = ""
901010800320-27 = ""
901010800320-28 = "В любом случае уже поздно. Проведём разбор."
