[translation]
101050-1 = "Эпизод 5; Трещина в повседневности 3"
101050-4 = "Подготовка завершена. Твоя очередь, Моэ."
101050-5 = "*пыхтит* *пыхтит* Правда? Мне правда можно это сделать?!"
101050-6 = "На данный момент у нас нет других вариантов."
101050-7 = "Хватит валять дурака, просто делай!"
101050-8 = "Тогда, с вашего позволения..."
101050-10 = "Сдохните, проклятые осы!"
101050-11 = ""
101050-15 = "Ого... Огромное осиное гнездо сгорело в один миг..."
101050-16 = "Огромное спасибо за помощь. Когда я увидела осиное гнездо за складом, понятия не имела, что делать."
101050-17 = "Благодарить нас не за что. Долг SRT — устранять любые угрозы безопасности граждан."
101050-18 = "Именно. Если обычный человек по неосторожности полезет к осиному гнезду, можно серьёзно пострадать."
101050-19 = "Говорят, у некоторых ос смертельно опасный нейротоксин, так что лучше сразу сжечь всё гнездо."
101050-21 = "А? И всё?"
101050-22 = "Я думала, хотя бы час буду смотреть, как пылающее осиное гнездо превращается в пепел. Какое разочарование."
101050-23 = "Ц-целый час...? Д-даже думать об этом с-страшно..."
101050-25 = "Раньше я бы вызвала службу дезинсекции или сообщила в пожарную часть..."
101050-26 = "Но после утверждения перепланировки городка Коусаги все государственные учреждения и инфраструктуру вывели, поэтому теперь большинство таких проблем жителям приходится решать самим."
101050-27 = "И конца этому не видно... Вот мы и думаем переехать."
101050-28 = ""
101050-30 = ""
101050-31 = "Не могу обещать, как долго мы там пробудем, но если понадобится помощь — смело ищите нас в парке."
101050-32 = "Мы — SRT, поэтому всегда будем делать всё возможное ради безопасности граждан."
101050-33 = "О-хо! На вас и правда можно положиться. Хи-хи."
101050-34 = "Позвольте отплатить вам за помощь."
101050-35 = ""
101050-37 = ""
101050-38 = "Пожалуйста, не стоит. Мы лишь исполняли свой долг."
101050-39 = ""
101050-41 = ""
101050-42 = "Вот. Это упаковка замороженных куриных шашлычков, которые мы продаём в магазине."
101050-44 = "Сейчас торговля идёт плохо, но раньше люди приезжали за нашими куриными шашлычками даже из других районов."
101050-45 = ""
101050-47 = ""
101050-48 = "Качественные замороженные куриные шашлычки... со свежим зелёным луком..."
101050-49 = "Срок годности не истёк... Более того, они в отличном состоянии..."
101050-50 = "В-Вы п-просто отдадите нам такое?"
101050-51 = "А-это плохо...?"
101050-52 = "Если вы не любите куриные шашлычки, ничего страшного..."
101050-53 = "Большое спасибо!!"
101050-55 = "Парк Коусаги"
101050-57 = "Вкусно...!"
101050-58 = "Снаружи прожарено идеально... А этот дымный вкус просто тает во рту."
101050-59 = "Хи-хи. Знаю, знаю. Меня вроде как считают специалистом по огню."
101050-60 = "Кстати, огонь слабоват. Может, подкинуть ещё дров..."
101050-61 = ""
101050-63 = ""
101050-65 = "Аромат свежего зелёного лука и насыщенный вкус курицы отлично сочетаются."
101050-66 = "И не забудьте про хрустящую жареную куриную кожу! М-м-м..."
101050-67 = "Ох, как давно я не ела ничего настолько свежего..."
101050-68 = "М-Мы обычно едим только к-консервы... Например, солонину..."
101050-69 = "Давайте пожарим всё до последнего кусочка! Холодильника всё равно нет!"
101050-73 = "Так... спокойно."
101050-74 = "Мне нравится. Сидеть у костра в парке и есть жареное мясо... Будто мы просто выбрались в поход."
101050-75 = "Хи-хи... И-и правда, если так посмотреть, весело..."
101050-76 = "Валькирия и Генеральный студенческий совет в последнее время затихли..."
101050-77 = "А Сенсей, как обычно, наверняка занят... С нами уже довольно давно не связывались."
101050-78 = "Хмпф. Даже если Сенсей свяжется, я всё равно проигнорирую!"
101050-79 = "И я! Нам не нужна помощь этого глупого взрослого!"
101050-80 = "А-я бы хотела, чтобы Сенсей и-иногда нас навещал..."
101050-81 = ""
101050-83 = ""
101050-84 = "В конце концов, отсутствие новостей — хорошие новости для Кивотоса."
101050-85 = "Это правда, но для нас..."
101050-86 = "Да... Д-для нас, без школы..."
101050-87 = ""
101050-89 = ""
101050-90 = ""
101050-91 = "Эй, народ. Давайте сейчас выпьем ту газировку, что нам дали."
101050-92 = "Я положила её в фонтан, чтобы охладить. Сейчас она должна быть идеальной!"
101050-93 = "Ты про газировку, которую Сора дала нам после того, как мы прогнали тех бандитов от Ангел 24?"
101050-94 = "Разве ты не говорила, что никому нельзя даже пальцем к ней прикасаться, потому что бережёшь её для важного дня?"
101050-95 = "Мы поели таких вкусных и драгоценных куриных шашлычков. Какой день может быть важнее этого?"
101050-96 = "Есть идея! Давайте поджарим грибы, которые собрали!"
101050-97 = "Отличная мысль! Я их принесу!"
101050-98 = ""
101050-100 = ""
101050-102 = "П-Погоди! В-возьми меня с собой!"
101050-103 = ""
101050-105 = ""
101050-108 = "Офис Главы Оборонного Комитета"
101050-109 = ""
101050-110 = ""
101050-111 = "Это сеть защиты от шпионажа...?"
101050-112 = "..."
101050-113 = ""
101050-115 = ""
101050-116 = "Да, говорите."
101050-117 = "..."
101050-118 = "...Понятно. Принято."
101050-119 = ""
101050-121 = ""
101050-122 = "...Наконец-то."
101050-125 = "Зал совещаний Гематрия"
101050-128 = ""
101050-129 = "Хрома идёт сюда?"
101050-131 = "Да. С её приходом Шале, Безымянные боги, Ковчег... Всё будет уничтожено. Разве не изящное решение?"
101050-132 = "Вместе со всем Кивотосом!"
101050-133 = "Ради чего, дорогая мадам? Может, вам наскучили наши исследования."
101050-134 = "Да, пожалуй, можно сказать, мои мотивы изменились."
101050-135 = "..."
101050-136 = ""
101050-137 = "Как вам прекрасно известно, благодаря ритуалу я частично соприкоснулась с Хромой. Это позволило мне увидеть истину."
101050-138 = "Моё предназначение не в этих легкомысленных исследованиях и примитивных экспериментах. Так величайшей мне не стать."
101050-139 = "Чтобы достичь этого, мне нужна абсолютная власть. Я должна стать Абсолютом. Тем, кто обладает силой уничтожить и создать сам мир."
101050-140 = "Я стану зловещим светом, который невозможно истолковать, находящимся за пределами человеческого общения. В глазах людей моё предназначение будет недоступно пониманию."
101050-141 = "Только так я смогу уничтожить Сенсея [USERNAME]!"
101050-142 = "Что это за безумие? Ты окончательно лишилась рассудка?"
101050-143 = "...Какая жалость. Вы позволили ненависти поглотить вас, мадам."
101050-144 = "Гематрия — исследователь и искатель. Непостижимое безумие — тот самый враг, которого мы стремились победить. Поддавшись собственному безумию, вы лишились права быть частью Гематрия."
101050-146 = "Я— Как вы смеете?! Во мне сила Хромы!"
101050-147 = "Я приручила силу безумия, которой вы так отчаянно боитесь!"
101050-148 = "Похоже на то. Голконда, прошу?"
101050-149 = "Да-да. Было приятно, мадам."
101050-150 = ""
101050-154 = "...?!"
101050-157 = "...Кья-а-а-а-а!!"
101050-158 = "Любопытно. Даже эффективнее бомбы, уничтожающей нимбы."
101050-159 = "И правда. Тайны, как следует из названия, могут быть недоступны истолкованию, но мотивы мадам оказались предсказуемы."
101050-160 = "А-А-А-А-А!"
101050-161 = "Неужели ты действительно думала, что мы тут будем сидеть сложа руки? Мы готовились к способу противостоять Хроме с того самого момента, как ты с ней соприкоснулась."
101050-162 = "НУ РАЗУМЕЕТСЯ!"
101050-163 = "Мы с тобой расходились во взглядах на основы искусства и на мир, но с самого начала я уважал твои амбиции, Беатрис."
101050-164 = "—!"
101050-165 = ""
101050-173 = ""
101050-174 = "..."
101050-175 = "Ах, какая жалость. Наша бедная мадам читала слишком мало книг. Второстепенные персонажи, стремящиеся стать главными героями, до финала никогда не доживают."
101050-176 = "Безумие — пугающее искусство. Мне было весьма любопытно, каким чудовищем она станет, но оставлять это гнить дальше было бы слишком хлопотно."
101050-177 = "Одно место снова пустует. Набор новых членов обсудим позже."
101050-180 = "А пока перейдём к следующей теме."
101050-181 = "..."
101050-182 = "..."
101050-184 = "Следующий Эпизод; Предзнаменование"
