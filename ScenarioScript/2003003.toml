[translation]
2003003-1 = "Новый гастрономический опыт"
2003003-5 = ""
2003003-6 = "Патрулируя территорию, я встретил знакомое лицо."
2003003-7 = "[ns] «О, Харуна?»"
2003003-8 = ""
2003003-10 = ""
2003003-11 = "Ах, Сенсей. Вы появились как раз вовремя."
2003003-12 = ""
2003003-14 = ""
2003003-15 = "Попробуйте это, пожалуйста."
2003003-16 = "Харуна протянула ложку с чем-то, похожим на фиолетовые... крупинки..."
2003003-17 = ""
2003003-21 = "[ns1] «Ого, это... черника?»\n[ns2] «Какая интересная текстура. Оно лопается во рту.»"
2003003-24 = "Хи-хи..."
2003003-25 = "Ну как, Сенсей? Освежающий опыт, правда?"
2003003-26 = "[s] «Очень освежает! И вкус совершенно новый.»"
2003003-27 = "Гастрономический мир слишком погряз в традициях. Именно новые впечатления вдыхают жизнь в кухню!"
2003003-28 = "Дегустация молекулярной кухни, которую вы только что испытали, Сенсей, была, мягко говоря, успешной."
2003003-29 = "С такими превосходными результатами шеф-повар могла бы просто закрыть глаза и упокоиться с миром."
2003003-30 = "Эм, вообще-то я полностью здорова..."
2003003-31 = "[s] «Молекулярной?»"
2003003-32 = "Да. Это передний край гастрономических инноваций: отказ от традиционных рецептов и совершенно новый подход к гастрономии..."
2003003-33 = ""
2003003-35 = ""
2003003-36 = ""
2003003-37 = "Здравствуйте, Сенсей... Я пытаюсь открыть палатку..."
2003003-39 = "История Харуны была такой..."
2003003-44 = ""
2003003-46 = "Эм..."
2003003-47 = ""
2003003-50 = ""
2003003-52 = ""
2003003-53 = "Попробуйте перед уходом! Мы раздаём бесплатные образцы молекулярной кухни!"
2003003-54 = ""
2003003-56 = ""
2003003-58 = ""
2003003-59 = "Что такое молекулярная кухня?"
2003003-60 = ""
2003003-63 = ""
2003003-65 = "Не знаю. Посмотри на это... Наверное, что-то связанное с этими странно выглядящими блюдами?"
2003003-66 = "Хм... дороговато. И выглядят чертовски странно."
2003003-67 = "Да и на фестивале полно привычной еды, которую я люблю. Кажется, там дальше были такояки и якисоба."
2003003-68 = "О! Я тоже видела ту палатку с такояки. Пойдём туда!"
2003003-69 = "Отлично! Как раз хотелось!"
2003003-70 = ""
2003003-72 = ""
2003003-75 = "А, подож—!"
2003003-76 = ""
2003003-79 = "Хаха... опять не вышло."
2003003-80 = "Трудно уговорить людей попробовать что-то настолько необычное..."
2003003-81 = ""
2003003-84 = ""
2003003-85 = ""
2003003-86 = "О. Что это? Выглядит как интересное блюдо."
2003003-87 = "...!"
2003003-90 = "Понятно. Значит, это и есть та молекулярная кухня, о которой я слышала."
2003003-91 = ""
2003003-93 = ""
2003003-94 = "Это фруктовый сок, превращённый в некое подобие икры..."
2003003-95 = "Да-да! Вот что получается, если добавить немного сока в раствор хлорида кальция и альгината натрия!"
2003003-96 = "Интересно. У вас есть ещё блюда?"
2003003-97 = "Д-Да! Конечно есть!"
2003003-98 = "У нас есть мясное блюдо, приготовленное методом су-вид!"
2003003-99 = "Ага! Я немало слышала об этом методе."
2003003-100 = "Низкотемпературное приготовление ингредиентов в вакуумной упаковке в воде при 60 градусах..."
2003003-102 = "Готовятся только белки, благодаря чему мясо получается максимально нежным!"
2003003-103 = "А у этого фрукта кисленький, шипучий вкус. Газировка?"
2003003-104 = "Именно! Поверхность обработана методом карбонизации: к фруктам прикладывают сухой лёд, насыщая продукт углекислым газом!"
2003003-106 = "То есть так одновременно сохраняется текстура фрукта и появляется газированность. Невероятно."
2003003-107 = "Действительно, с технологиями «Миллениума» можно было бы извлекать или усиливать отдельные вкусы с помощью технологий полимерного компаундирования..."
2003003-108 = ""
2003003-110 = ""
2003003-111 = ""
2003003-113 = "Харуна с большим интересом слушала объяснения принципов молекулярной кухни и инженерных инструментов, которые в ней используются."
2003003-116 = "Ах. А потом мимо как раз проходил Сенсей."
2003003-117 = "С гастрономической точки зрения будет большой потерей, если люди так и не попробуют эти блюда."
2003003-118 = "Как гурману, мне по-настоящему больно видеть, что люди не открываются новым впечатлениям."
2003003-119 = "[s] «Люди естественным образом сторонятся незнакомого.»"
2003003-121 = "Мне просто кажется, что стоит им дать этому шанс — и им понравится! У нас будет куча клиентов!"
2003003-122 = "[s] «Хм. Может, есть более знакомое блюдо, которое всё равно относится к молекулярной кухне?»"
2003003-123 = "Знакомая молекулярная кухня..."
2003003-124 = ""
2003003-126 = ""
2003003-127 = ""
2003003-128 = "...!"
2003003-129 = "К-Какой?!"
2003003-130 = ""
2003003-131 = "[ns3] «Взгляд Харуны... заострился!»\n[ns4] «Гастрономический сенсор Харуны сработал!»"
2003003-134 = "Э-Это оно, Сенсей?!"
2003003-135 = "[s] «Я просто пошутил. В основном.»"
2003003-136 = "Я... ничего не понимаю."
2003003-137 = "Хи-хи..."
2003003-138 = "Начнём с сахарной ваты, хорошо?"
2003003-140 = "Сахарная вата?"
2003003-141 = "Да, молекулярная кухня преобразует ингредиенты на молекулярном уровне, меняя их текстуру и создавая новые впечатления..."
2003003-143 = "Если так, то сахарную вату вполне можно назвать прекрасным примером молекулярной кухни! Она превращает сахарный порошок в нити и даёт ему совершенно другую текстуру, не жертвуя сладостью!"
2003003-144 = "[s] «Как и ожидалось от Гастрономического сенсора Харуны!»"
2003003-146 = "Вы же сказали, что это была шутка!"
2003003-150 = ""
2003003-151 = ""
2003003-153 = "Попробуйте, пожалуйста."
2003003-154 = "Это дегустация молекулярной кухни, которая начинается с сахарной ваты."
2003003-155 = "Вы любите сахарную вату?"
2003003-157 = "От одной мысли о сахарной вате меня и правда охватывает ностальгия."
2003003-158 = "А я как раз хотела чего-нибудь сладкого. Одну мне!"
2003003-159 = "Хи-хи..."
2003003-160 = "Да. А вместе с сахарной ватой... как насчёт ложечки черничной икры?"
2003003-161 = "Что?"
2003003-162 = "Выглядит странно, но... это ведь съедобно, да?"
2003003-163 = "Не переживайте. Уверена, Сенсей здесь за неё поручится."
2003003-164 = "[s] «Я сам пробовал! Было вкусно!»"
2003003-165 = "Ладно, тогда..."
2003003-166 = ""
2003003-168 = ""
2003003-169 = ""
2003003-170 = ""
2003003-171 = ""
2003003-172 = "Хмм?!"
2003003-174 = "Что это за текстура?!"
2003003-178 = "Это здесь продают какую-то молекулярную кухню?"
2003003-179 = "Мы уже больше 30 минут ждём, а очередь вообще не становится короче..."
2003003-180 = "Сам факт, что столько людей готовы ждать, уже служит рекламой, но..."
2003003-181 = "Мне интересно. Интересно, что это такое! Молекулярная кухня, я имею в виду."
2003003-182 = ""
2003003-184 = ""
2003003-186 = "Ого..."
2003003-187 = "Я надеялась, что палатка будет успешной, но не ожидала настолько большого успеха!"
2003003-188 = "А главное, недостаток молекулярной кухни в том, что на её приготовление уходит много времени..."
2003003-189 = "Хи-хи..."
2003003-190 = "Путь гастрономии полон испытаний и невзгод... Сегодня я вдохновилась."
2003003-191 = "[s] «Харуна. Какой план ты уже готовишь у себя в голове?»"
2003003-192 = "Думаю, всё получится. Нужно только попросить Инженерный отдел придумать, как наладить массовое производство..."
2003003-193 = "И тогда мы сможем широко распространить молекулярную гастрономию!"
2003003-194 = "Спасибо! Сенсей! Харуна!"
2003003-196 = "Не за что. Рада, что мы смогли помочь."
2003003-197 = ""
2003003-199 = ""
2003003-200 = "Тогда, Сенсей. Может, пойдём?"
2003003-201 = "[s] «Ты просто вот так уйдёшь?!»"
2003003-202 = "Мы выполнили свою задачу. Мы познакомили больше людей с чудесами вкусной еды и высокой кухни."
2003003-203 = "Дальше ей уже придётся разбираться самой, верно?"
2003003-204 = "Кроме того, кажется, я уже попробовала всё, что можно было попробовать в этой палатке."
2003003-205 = "[s] «Ты всегда остаёшься верна себе, Харуна.»"
2003003-206 = "Хи-хи-хи... А впереди ещё столько палаток, которые мы не покорили."
2003003-207 = "Высокую кухню можно найти и в новых блюдах, и в наших любимых, самых ностальгических вкусах."
2003003-208 = ""
2003003-210 = ""
2003003-211 = ""
2003003-212 = "Итак, Сенсей. Вы продолжите гулять со мной до конца дня?"
