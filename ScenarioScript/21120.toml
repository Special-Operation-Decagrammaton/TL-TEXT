[translation]
21120-1 = "Episódio 12;Em Busca do \"Espelho\""
21120-2 = "Millennium - Veritas"
21120-3 = "Saiu o resultado sobre os \"dados\" que vocês pediram."
21120-4 = "F-Finalmente...!"
21120-5 = "Que nervosismo..."
21120-6 = "Como vocês sabem, nós da \"Veritas\" nos orgulhamos de ser o melhor grupo de hackers de Kivotos."
21120-7 = "Quando se trata de recuperação de sistemas e dados, já resolvemos casos incontáveis..."
21120-8 = "Dito isso, vou ser direta."
21120-9 = "(Engole em seco...)"
21120-11 = "Momoi, é impossível recuperar o save do seu jogo."
21120-13 = "Uwaaaaan! Já eraaaaa!"
21120-14 = "Não era isso!! E quanto a quebrar a senha da G.Bible?!"
21120-15 = "Quanto a isso, a Maki está trabalhando nisso agora."
21120-16 = "A Maki-chan?"
21120-17 = "Ah, bom dia, Mido!"
21120-18 = "Que bom que vieram, valeu."
21120-19 = "Uuu, meu save... fruto do meu suor e lágrimas...!"
21120-20 = "Por que a Momo tá chorando tanto assim?"
21120-21 = "Não precisa ligar pra ela... Mais importante, como foi com a G.Bible?"
21120-22 = "Sim, consegui analisar direitinho. Aquele é mesmo o manual lendário criado pelo lendário desenvolvedor de jogos... É a G.Bible, sem dúvida."
21120-23 = "E-Então era verdade mesmo!"
21120-24 = "Pela data de criação do arquivo, a última transferência e o formato, é certeza absoluta. O autor também bate com o IP do lendário desenvolvedor dos boatos. Além disso, os registros mostram que esse dado só foi transferido uma única vez até hoje."
21120-25 = "Isso significa que..."
21120-26 = "É, deve ser a \"G.Bible\" original."
21120-28 = "I-Incrível!!"
21120-29 = "Mas tem um problema... ainda não consegui quebrar a senha do arquivo."
21120-30 = "Quê?! Então no fim a gente não consegue abrir?! Que decepção!"
21120-31 = "Ugh! Ei, eu sou uma cracker, não uma hacker ética... Enfim!"
21120-32 = "Mesmo assim, não é que não exista um jeito."
21120-33 = "Sério?"
21120-34 = "Quebrar a senha daquele arquivo diretamente é praticamente impossível. Mas se a gente remover os arquivos de segurança e copiar tudo por inteiro, acho que dá pra fazer..."
21120-35 = "E, pra isso, a gente precisa de uma ferramenta chamada Optimus Mirror System... conhecida como \"Espelho\"."
21120-36 = "N-Não estou entendendo nada..."
21120-37 = "Ou seja... pra ler a G.Bible, a gente precisa desse programa chamado \"Espelho\", né? Onde ele está?"
21120-38 = "Nós da Veritas estávamos com ele... estávamos."
21120-39 = "Ah, então pega logo... Ei, espera aí! No passado?!"
21120-40 = "...Pois é, não está mais com a gente. O conselho estudantil confiscou, que saco!"
21120-41 = "Esses dias a Yuuka invadiu aqui do nada dizendo que \"é proibido portar equipamentos de uso ilícito\"."
21120-43 = "Levaram o \"Espelho\" e várias outras coisas... inclusive minhas escutas."
21120-44 = "Esse \"Espelho\"... é tão perigoso assim?"
21120-47 = "De jeito nenhum. É só uma ferramenta otimizada para abrir sistemas criptografados."
21120-48 = "Só que... é única no mundo, uma ferramenta de hacking criada pessoalmente pela nossa presidente."
21120-49 = "Presidente... a Himari-senpai?"
21120-50 = "Himari...?"
21120-51 = "A Aris-chan ainda não conheceu ela, né? Ela é a presidente da Veritas. Ela tem um pouco de dificuldade de locomoção e usa cadeira de rodas, então se você a vir, vai reconhecer na hora."
21120-52 = "Ela é incrível. Apesar da condição física, não existe ninguém em Millennium que sinta pena ou a subestime por isso. Acho que dá pra chamar de gênio... Ela tem o título de \"Onisciência\", um grau acadêmico que apenas três pessoas em toda a história de Millennium receberam."
21120-53 = "É, ela é incrível mesmo... mas deixando isso de lado, como é que vocês deixaram confiscarem um equipamento que ela fez com tanto esforço?"
21120-54 = "...Eu só queria conferir as mensagens no celular do Sensei. Para isso, eu precisava do \"Espelho\"..."
21120-55 = "Não havia nenhuma intenção impura, de verdade."
21120-56 = "Pra mim, só parecem intenções impuras..."
21120-59 = "Uwaaan! Se a gente não recuperar o \"Espelho\" logo, a presidente vai dar uma bronca na gente!!"
21120-60 = "Enfim... resumindo, nós também queremos recuperar o \"Espelho\"."
21120-61 = "E, para quebrar a senha da G.Bible, vocês também precisam do \"Espelho\"... não é?"
21120-62 = "Entendi... Desde que vocês chamaram a gente, já suspeitei que tinha algo a mais. Já saquei qual é."
21120-63 = "Hã, s-será que...?"
21120-64 = "Hehe, é isso aí, Momo. Você pega as coisas rápido."
21120-65 = "Já que temos o mesmo destino, melhor irmos juntas nessa jornada."
21120-66 = "Se vamos iniciar uma raid juntas, então somos membros do mesmo grupo."
21120-67 = "Ei, mana, por acaso você..."
21120-69 = "Não vai me dizer que estão planejando se juntar à Veritas pra invadir o conselho estudantil...?!"
21120-71 = "Millennium - Terraço"
21120-72 = "...É exatamente isso."
21120-73 = "Entendo, é uma história um tanto difícil de acreditar."
21120-74 = "Eu também já ouvi falar do Clube de Desenvolvimento de Jogos."
21120-75 = "Elas parecem tão adoráveis... planejar invadir o conselho estudantil de Millennium? Realmente, as aparências enganam, não é?"
21120-76 = "Elas são garotas inocentes. Mas é justamente por isso que, às vezes, aprontam travessuras absurdas."
21120-77 = "Além disso, dessa vez a Veritas também está envolvida."
21120-78 = "Veritas... aquele grupo de crackers especializado em hacking, certo?"
21120-79 = "Sim, isso mesmo. Podem parecer não ter nada em comum, mas no quesito de não medir esforços pelo que consideram importante... elas se parecem muito com o Clube de Desenvolvimento de Jogos."
21120-80 = "Entendo. Bem, seja como for, tratando-se de um pedido, pretendemos aceitá-lo, porém..."
21120-81 = "Há apenas um pequeno problema."
21120-83 = "Millennium - Veritas"
21120-84 = "Problema?"
21120-85 = "O \"Espelho\" está guardado no \"Depósito de Itens Confiscados\" do conselho estudantil. Só que quem faz a guarda de lá é..."
21120-86 = "O clube das maids."
21120-87 = "...Hã? Clube das maids... por acaso é..."
21120-88 = "Ah, você tá falando da C&C, né? O grupo de combate de Millennium, famoso por \"limpar\" os oponentes com toda elegância vestindo uniforme de maid..."
21120-89 = "Isso mesmo! Bem, é só um probleminha de nada~"
21120-90 = "Aaaah, entendi~! É mesmo, né, hmm, faz sentido~..."
21120-93 = "Vamos desistir!!! Clube de Desenvolvimento de Jogos, meia-volta! Marchar!!"
21120-95 = "Espera, espera, espera! Não pode desistir, Momo! Vocês querem a G.Bible, não querem?!"
21120-96 = "Claro que queremos! Mas nem brincando que vou enfrentar o clube das maids por causa disso!"
21120-97 = "Antes me mandar pular num trem em movimento ou mergulhar num vulcão em erupção!"
21120-98 = "M-Mas desse jeito a presidente vai brigar comig... quer dizer! O Clube de Desenvolvimento de Jogos também já era! Vocês vão acabar fechando o clube, não vão?!"
21120-99 = "Eu não quero que o clube feche... mas isso já é outro nível de loucura."
21120-100 = "Não dá nem pra contar quantos grupos extremistas e clubes armados foram aniquilados pelos \"serviços\" da C&C... você sabe disso, né?"
21120-102 = "...No final, não sobra nem rastro, tudo fica limpinho. É uma história famosa."
21120-103 = "Claro que eu quero salvar o clube, mas a Midori, a Aris e a Yuzu são infinitamente mais importantes! É perigoso demais!"
21120-104 = "Espera, espera, eu sei que a C&C é perigosa! Mas nós não somos o Comitê Disciplinar de Gehenna nem a Força-Tarefa da Justiça de Trinity, ninguém tá falando em bater de frente com elas!"
21120-105 = "Nosso objetivo não é \"derrotar o clube das maids\", e sim pegar o \"Espelho\" no Depósito de Itens Confiscados~..."
21120-106 = "Não muda quase nada!"
21120-107 = "...Mas não é impossível."
21120-108 = "De acordo com as minhas escu... quer dizer, informações, o clube das maids não está com força total no momento."
21120-109 = "Hã?"
21120-112 = "Claro, o clube das maids é a força de combate mais poderosa de Millennium."
21120-113 = "Por que elas são chamadas de \"as mais fortes\"... Bem, é claro que parte disso é porque têm agentes maids excelentes, mas..."
21120-114 = "O fator mais decisivo é a presença \"dela\"."
21120-117 = "A presidente do clube das maids, codinome Double-O... Neru-senpai."
21120-119 = "Isso mesmo."
21120-121 = "Só que, agora, ela..."
21120-123 = "Millennium - Terraço"
21120-124 = "A-A Neru-senpai não está?!"
21120-125 = "Sim, parece que ela tem assuntos pessoais nos arredores de Millennium."
21120-126 = "Mas não se preocupe."
21120-127 = "Para ser exata, nossa líder é especialista em \"destruir\", não em proteger."
21120-128 = "Claro, é um fato inegável que a C&C é mais forte quando a líder está presente."
21120-129 = "Porém, quando se trata de \"proteger\"... talvez seja até melhor ficarmos só nós."
21120-130 = "Então, mais uma vez, aceitamos o pedido."
21120-132 = "Impedir que o Clube de Desenvolvimento de Jogos se aproxime do Depósito de Itens Confiscados do conselho estudantil até a hora combinada... Tem a minha palavra."
21120-134 = "Millennium - Veritas"
21120-135 = "Evitar confronto direto, pegar só o \"Espelho\" e fugir... Hmm..."
21120-136 = "..."
21120-137 = "Vamos tentar, mana."
21120-138 = "Quê?! Mesmo sem a Neru-senpai, ainda estamos falando do clube das maids!"
21120-139 = "Eu sei, mas... não podemos deixar o Clube de Desenvolvimento de Jogos acabar assim."
21120-142 = "Nossa sala do clube é caindo aos pedaços, apertada e às vezes até tem goteira..."
21120-145 = "Mas agora, não é mais só um lugar onde a gente joga videogame."
21120-148 = "...É um lugar precioso onde podemos ficar todas juntas."
21120-149 = "Por isso, se existir a menor chance que seja... eu quero tentar."
21120-150 = "Não, mesmo que a gente acabe enfrentando o clube das maids, não importa o quão perigoso seja...!"
21120-152 = "Eu quero proteger esse lugar."
21120-154 = "Pela Aris-chan, pela Yuzu-chan... por todas nós!"
21120-157 = "Midori..."
21120-158 = "Nós conseguimos."
21120-159 = "A heroína lendária... derrota o Rei Demônio para impedir a destruição do mundo."
21120-160 = "Aris jogou um total de 45 RPGs... e descobriu qual é o poder mais forte de todos, necessário para os heróis derrotarem o Rei Demônio."
21120-161 = "O poder mais forte... subir de nível? Ah, melhorar o equipamento?"
21120-162 = "Escutas?"
21120-163 = "Tipo um pulso EMP?!"
21120-165 = "N-Não é isso..."
21120-167 = "São os companheiros que estão ao nosso lado."
21120-168 = "Aris..."
21120-169 = "..."
21120-170 = "É... fechado."
21120-171 = "Vamos nessa! Vamos nos infiltrar no conselho estudantil e recuperar o \"Espelho\"!"
21120-173 = "Hare! Você tem algum plano bom?!"
21120-174 = "Deixa comigo."
21120-175 = "Só que, para colocar esse plano em prática..."
21120-176 = "Precisamos preparar algumas coisas."
21120-178 = "As escutas que mencionaram agora há pouco, o pulso EMP também... e além disso..."
21120-179 = "Também precisamos de... \"companheiros\", acho."
21120-180 = "Companheiros?"
21120-181 = "(Olhos brilhando)"
21120-182 = "Mas como não somos tão próximas delas assim... vamos ter que pedir ajuda ao Sensei."
21120-183 = "[s1] \"Eu?\"\n[s2] \"Se for algo que eu possa fazer, pode deixar comigo.\""
21120-186 = "Sim."
21120-187 = "Provavelmente, sem a ajuda delas, essa operação nem sai do papel."
21120-189 = "Entendo, essa é realmente uma avaliação certeira."
21120-190 = "Como você disse, com esse método, seria difícil sem a nossa ajuda."
21120-191 = "Certo, combinado. Vamos colaborar."
21120-192 = "T-Tem certeza mesmo?"
21120-193 = "O Clube de Engenharia já tem tantas conquistas, vocês não precisam se arriscar tanto assim..."
21120-194 = "É verdade, talvez tenha razão."
21120-195 = "Então por que aceitaram entrar num plano tão perigoso de enfrentar o clube das maids?"
21120-196 = "Bem..."
21120-197 = "...É que parece muito mais divertido assim, sabe?"
21120-198 = "Isso mesmo! Além disso, nós também queremos ficar mais próximas do Sensei!"
21120-202 = "Verdade, e também..."
21120-203 = "?"
21120-204 = "...?"
21120-205 = "...Não, deixa pra lá por enquanto. Contem com a gente."
21120-206 = "Ah, sim."
21120-207 = "Nós é que agradecemos, contamos com vocês...!"
21120-209 = "Millennium - Veritas"
21120-210 = "Com isso, o time está completo, né?"
21120-211 = "Sim, os preparativos também estão prontos."
21120-212 = "Beleza!"
21120-213 = "Ah, aliás, quando a operação começa?"
21120-214 = "Quando...?"
21120-217 = "Já começou."
21120-219 = "Millennium - Terraço"
21120-220 = "Ah, gostaria de fazer apenas uma pergunta."
21120-222 = "Que o Clube de Desenvolvimento de Jogos e a Veritas vão invadir o conselho estudantil... como vocês ficaram sabendo disso?"
21120-223 = "Em guerra de informações, eu achava que não havia grupo em Millennium que superasse a Veritas..."
21120-224 = "...Exatamente."
21120-225 = "Por isso mesmo, foi a própria Veritas quem nos contou. Simples assim."
21120-226 = "...Como é?"
21120-227 = "Quem nos avisou que a Veritas e o Clube de Desenvolvimento de Jogos estavam vindo foi..."
21120-230 = "A presidente da Veritas, Himari."
21120-232 = "Próximo;Nerd VS Maid"
