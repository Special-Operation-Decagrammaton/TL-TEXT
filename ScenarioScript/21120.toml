[translation]
21120-1 = "Эпизод 12;В поисках Зеркала"
21120-2 = "Милленниум — Веритас"
21120-3 = "Я закончила анализ данных, которые вы принесли."
21120-4 = "Наконец-то..."
21120-5 = "У меня сердце колотится."
21120-6 = "Как вы знаете, Веритас гордится званием лучшей хакерской группы во всём Кивотосе."
21120-7 = "Нам каждый день поручают дела по восстановлению систем и данных. Конечно, проблемы вроде вашей мы решали бесчисленное количество раз..."
21120-8 = "Хм. Скажу прямо."
21120-9 = "*глоть*"
21120-10 = ""
21120-11 = "Момои. Твои сохранения восстановить невозможно."
21120-13 = "*всхлип* Нее-е-ет!"
21120-14 = "Момои! Ты должна была попросить их подобрать пароль к Г.БИБЛИИ!"
21120-15 = "А, так этим занимается Маки."
21120-16 = "Маки?"
21120-17 = "Утречко, Мидо!"
21120-18 = "Я как раз собиралась идти к вам, а вы уже здесь."
21120-19 = "*шмыг* Все мои сохранения... А-А-А-А!"
21120-20 = "Что с ней?"
21120-21 = "Не обращай внимания. Расскажи лучше про Г.БИБЛИЮ."
21120-22 = "Я закончила анализ. Всё указывает на то, что это настоящая Г.БИБЛИЯ — руководство, написанное самим легендарным разработчиком."
21120-23 = "Да!"
21120-24 = "Время создания файла, время последней отправки, формат и автор — всё совпадает с IP легендарного разработчика, о котором вы говорили, а главное — данные копировались ровно один раз."
21120-25 = "Это значит...!"
21120-26 = "Ага. Это оригинал."
21120-28 = "Н-Невероятно!"
21120-29 = "Но... пароль нам пока расшифровать не удалось."
21120-30 = "А? Ты меня убиваешь, Маки!"
21120-31 = "Эй, я, может, и хакер, но тут защита высшего класса."
21120-32 = "Однако это не значит, что вариантов больше нет."
21120-33 = "О?"
21120-34 = "Хотя брутфорс пароля попросту невозможен, но, возможно, получится дублировать библию без файла безопасности."
21120-35 = "И для этого нам понадобится инструмент под названием Система Зеркала Оптимус — сокращённо Зеркало."
21120-36 = "У м-меня уже голова кругом от всего этого..."
21120-37 = "Я правильно понимаю? Чтобы открыть Г.БИБЛИЮ, нужно это Зеркало? А где оно сейчас?"
21120-38 = "Ну, эм, раньше оно было здесь, у Веритас..."
21120-39 = "Отлично, тогда давайте вскроем эту шту— Стой! \"Раньше\"?! Его больше нет?!"
21120-40 = "Ха-ха, ну, чёртов студсовет пришёл и забрал его!"
21120-41 = "Эта Юука пару дней назад ворвалась сюда со словами, типа, иметь \"незаконное\" оборудование — это \"позор\". Блин. Вот зануда."
21120-42 = ""
21120-43 = "Кроме Зеркала она ещё забрала мои... прослушки..."
21120-44 = "Это Зеркало такое же опасное, как прослушка?"
21120-45 = ""
21120-47 = "Совсем нет. Это просто инструмент, оптимизированный для взлома зашифрованных систем."
21120-48 = "И... единственный в мире хакерский инструмент, созданный президентом нашего клуба."
21120-49 = "Ты про Химари?"
21120-50 = "Кто такая Химари?"
21120-51 = "Она президент Веритас. И пусть из-за здоровья она прикована к инвалидной коляске, недооценивать или жалеть Химари не стоит."
21120-52 = "Она — гений, известный тем, что стала одной из всего трёх студентов за всю историю Миллениум, получивших Награду Всезнания."
21120-53 = "Да-да, впечатляет, конечно, но мне интереснее, как вы умудрились потерять оборудование такого гения!"
21120-54 = "Я просто хотела посмотреть, что Сенсей пишет в сообщениях..."
21120-55 = "Чисто из научного любопытства, разумеется."
21120-56 = "Коне-е-ечно..."
21120-57 = ""
21120-59 = "Гах! Если я скоро не верну Зеркало, президент меня убьёт!"
21120-60 = "В общем, как видите, наши интересы совпали."
21120-61 = "Нам нужно вернуть инструмент президента, а вам — открыть Г.БИБЛИЮ."
21120-62 = "Ах. Я всё думала, зачем вам понадобилось встречаться лично. Кажется, понимаю, к чему всё идёт."
21120-63 = "Погоди. Ты же не имеешь в виду...?"
21120-64 = "Хех. Быстро соображаешь, Момо."
21120-65 = "Как говорится, рыбак рыбака видит издалека."
21120-66 = "Перед входом в подземелье мы объединяемся в рейдовую группу."
21120-67 = "В-Вы серьёзно предлагаете..."
21120-68 = ""
21120-69 = "...нам вместе с Веритас атаковать студсовет?!"
21120-71 = "Крыша Милленниума"
21120-72 = "Да, ты правильно меня расслышала."
21120-73 = "Ты так говоришь, но мне всё ещё трудно в это поверить."
21120-74 = "Я знаю о Департаменте Разработки Игр Милленниума."
21120-75 = "Они кажутся такими милыми и невинными девочками. Ты правда думаешь, что они собираются напасть на студсовет?"
21120-76 = "Они наивны. Поэтому иногда и творят совершенно нелепые вещи."
21120-77 = "Но в этот раз всё не так просто. Веритас тоже участвует."
21120-78 = "Веритас? Те хакеры?"
21120-79 = "Именно. Обе группы готовы пойти на всё, когда под угрозой то, что им дорого."
21120-80 = "Понятно. Что ж, отвечать на запросы — наша работа."
21120-81 = "Однако есть одна небольшая проблема."
21120-83 = "Милленниум — Веритас"
21120-84 = "Какая проблема?"
21120-85 = "Те, кто охраняет склад контрабанды студсовета, где лежит Зеркало."
21120-86 = "Клуб Горничных."
21120-87 = "Клуб Горничных...?"
21120-88 = "Понятно. Ты про C&C, да? Ударный отряд нашей школы в костюмах горничных, который «зачищает» цели..."
21120-89 = "Экзактамундо! Не переживайте, это лишь небольшая загвоздка!"
21120-90 = "Ага! Маленькая... Совсем крошечная..."
21120-91 = ""
21120-93 = "Гах! Это невозможно! Нам остаётся только сдаться!"
21120-95 = "Воу, ты чё вдруг сдаёшься, Момо? Вам разве не нужна Г.БИБЛИЯ?!"
21120-96 = "Нужна, конечно, но ты сейчас серьёзно? Клуб Горничных?! Да ты издеваешься!"
21120-97 = "Лучше уж встать перед поездом или прыгнуть в вулкан, чем пытаться сражаться с ними!"
21120-98 = "Н-Но если ничего не сделать, президент меня отругает — то есть Департамент Разработки Игр закроют!"
21120-99 = "Конечно, я не хочу, чтобы нас закрыли! Но камон! Это уже безумие!"
21120-100 = "C&C уничтожили бесчисленное количество экстремистских групп и вооружённых фракций. И знаешь что ещё?"
21120-102 = "...Когда они кого-то \"зачищают\", не остаётся ни единого следа существования цели."
21120-103 = "Вот именно! Клуб важен, но я не могу подвергать Мидори и Алису такому риску! Это слишком опасно!"
21120-104 = "Опасно? Ты всё неправильно поняла! Мы не Команда Префектов Геенны и не Оперативная Группа Спрведливости Тринити. Зачем Клубу Горничных заставлять нас исчезнуть?"
21120-105 = "Видите ли, наша цель не уничтожить Клуб Горничных. Нам всего лишь нужно забрать то, что требуется, из охраняемого ими склада!"
21120-106 = "Это практически одно и то же!"
21120-107 = "Вообще-то в её словах есть смысл."
21120-108 = "Насколько я... слышала, Клуб Горничных сейчас не в полном составе."
21120-109 = "Только не говорите..."
21120-112 = "Понятно. Хотя Клуб Горничных и считается сильнейшим отрядом Милленниума..."
21120-113 = "...своей репутацией они обязаны не только навыкам агентов."
21120-114 = "Дело ещё в \"ней\"."
21120-116 = ""
21120-117 = "Президенту Клуба Горничных, позывной Два Нуля — Неру."
21120-118 = ""
21120-119 = "Верно."
21120-120 = ""
21120-121 = "Но так уж получилось, что прямо сейчас она..."
21120-123 = "Крыша Милленниума"
21120-124 = "Н-Неру здесь нет?!"
21120-125 = "Всё верно. Насколько я знаю, она уехала по личным делам на окраину Милленниума."
21120-126 = "Но не о чем беспокоиться."
21120-127 = "Наш президент, скажем так, куда больше подходит для разрушения, чем для защиты."
21120-128 = "Когда президент с нами, C&C — мощная ударная сила."
21120-129 = "Но если задача — что-то защищать... возможно, без неё мы даже эффективнее."
21120-130 = "Поэтому мы принимаем ваш запрос."
21120-131 = ""
21120-132 = "До истечения срока, выданного Департаменту Разработки Игр, любой доступ на склад контрабанды студсовета запрещён."
21120-134 = "Милленниум — Веритас"
21120-135 = "Значит, избегаем прямого боя, хватаем Зеркало и удираем что есть мочи..."
21120-136 = "..."
21120-137 = "Давай сделаем это, Момои."
21120-138 = "Ты тоже, Мидори?! Даже без Неру Клуб Горничных всё равно... жутко страшный!"
21120-139 = "Знаю, но... я не собираюсь просто сдаваться."
21120-142 = "Наша клубная комната старая и протекает, но..."
21120-145 = "...это уже не просто место, где мы собираемся поиграть."
21120-148 = "Это... наш дом."
21120-149 = "Если удастся избежать боя с Клубом Горничных... думаю, у нас есть шанс."
21120-150 = "Нет, даже если придётся сражаться!"
21120-152 = "Я хочу её защитить."
21120-153 = ""
21120-154 = "Ради Алисы, Юзу и всех нас вместе."
21120-155 = ""
21120-157 = "Мидори..."
21120-158 = "Я верю в нас."
21120-159 = "Когда мир стоит на грани гибели, легендарный герой должен восстать и спасти его, победив злого короля демонов."
21120-160 = "Сыграв примерно в 45 РПГ... я поняла, что у всех легендарных героев есть одна великая сила."
21120-161 = "Ты о чём? О прокачке уровней или улучшении экипировки?"
21120-162 = "Или, может, о прослушке?"
21120-163 = "Или ЭМИ?!"
21120-164 = ""
21120-165 = "Э-э... Нет."
21120-166 = ""
21120-167 = "Они сражаются вместе с друзьями."
21120-168 = "Алис..."
21120-169 = "..."
21120-170 = "Ладно."
21120-171 = "Мы это сделаем. Вломимся в студсовет и заберём Зеркало!"
21120-173 = "У тебя есть план, так ведь, Харе?!"
21120-174 = "Разумеется."
21120-175 = "Но чтобы воплотить этот план в жизнь..."
21120-176 = "...нам нужно кое-что подготовить."
21120-178 = "Например, прослушку, ЭМИ и..."
21120-179 = "...как столь красноречиво сказала Алиса, немного помощи друзей."
21120-180 = "Ты имеешь в виду...?"
21120-181 = "А! *сверк, сверк*"
21120-182 = "Но, эм, сейчас мы не в самых лучших отношениях, так что, думаю, договариваться придётся Вам, Сенсей."
21120-183 = "[s1] «Хочешь, чтобы я говорил?»\n[s2] «Ты уверена?»"
21120-184 = ""
21120-185 = ""
21120-186 = "Ага."
21120-187 = "Откровенно говоря, этот план обречён на провал, только если мы не заручимся их помощью."
21120-189 = "Понятно."
21120-190 = "Как вы и сказали, без нашей помощи провернуть такой план будет тяжело."
21120-191 = "Хорошо. Можете на нас рассчитывать."
21120-192 = "Стоп, правда?"
21120-193 = "Но разве Инженерный Департамент уже не имеет право на продление?"
21120-194 = "Ну да."
21120-195 = "Тогда зачем вам объединяться с нами против Клуба Горничных?"
21120-196 = "О. Так-то всё довольно просто."
21120-197 = "Потому что это звучит весело."
21120-198 = "И ещё это шанс провести время и узнать Сенсея!"
21120-199 = ""
21120-201 = ""
21120-202 = "Помимо этого, ещё..."
21120-203 = "???"
21120-204 = "А?"
21120-205 = "...О. Не обращайте внимания. Мне интересно посмотреть, на что вы способны."
21120-206 = "Э-э-э, ладно."
21120-207 = "В любом случае, желаю плодотворного сотрудничества!"
21120-209 = "Милленниум — Веритас"
21120-210 = "Так! Все здесь?"
21120-211 = "Да, мы готовы приступать."
21120-212 = "Отлично!"
21120-213 = "Когда начинаем операцию?"
21120-214 = "Операцию...?"
21120-215 = ""
21120-217 = "Вообще-то она уже началась."
21120-219 = "Крыша Милленниума"
21120-220 = "Мне любопытна кое-какая вещь, Юука."
21120-221 = ""
21120-222 = "Откуда ты знаешь, что Департамент Разработки Игр и Веритас нападут на студсовет?"
21120-223 = "Когда дело касается информационной войны, я не думала, что кто-либо в Милленниуме может превзойти Веритас."
21120-224 = "Ты права."
21120-225 = "Но именно поэтому мы и узнали об их плане."
21120-226 = "Что?"
21120-227 = "Только один человек мог предупредить нас о таком."
21120-228 = ""
21120-229 = ""
21120-230 = "Сама президент Веритас — Химари..."
21120-232 = "Следующий эпизод;Задроты против Горничных"
