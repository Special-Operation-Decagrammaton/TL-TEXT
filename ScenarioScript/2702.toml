[translation]
2702-1 = "Вы арестованы! Часть 2"
2702-2 = "Master Donuts, пересечение 3-й улицы и 2-й авеню"
2702-4 = "А-Ай! Помогите!"
2702-5 = "Ха-ха-ха! Гони всю наличку, если не хочешь пострадать!"
2702-6 = "Берём владельца магазина в заложники, угрозами не подпускаем никого близко, а потом забираем все деньги до приезда полиции... Идеальный план!"
2702-7 = "У Полицейской школы «Валькирия» может быть серьёзный арсенал, но какой от него толк, если они такие медленные! К их приезду нас уже и след простынет. Ха-ха-ха!"
2702-8 = "А теперь пора вскрыть сейф..."
2702-11 = "Полиция! Всем поднять руки и отойти назад!"
2702-12 = "Что?! Как они уже здесь?! С вызова полиции ещё пяти минут не прошло!"
2702-13 = "Не сравнивай нас с тормозами из Бюро безопасности! Благодаря регулярным патрулям Бюро общественной безопасности знает здесь все короткие пути!"
2702-14 = "Бюро общественной безопасности?"
2702-15 = "Вы из Бюро... общественной безопасности? Ха-ха-ха!"
2702-16 = "Ч-Что смешного?"
2702-17 = "Да вы сами и смешные! Вам разве не надо где-нибудь движение регулировать? Куда вам против нас!"
2702-19 = "Даже преступники смотрят на нас свысока..."
2702-20 = "Ух... Просто заткнись и дай себя арестовать!"
2702-21 = ""
2702-23 = ""
2702-24 = ""
2702-25 = ""
2702-26 = ""
2702-28 = ""
2702-29 = "А-А-а! Ты что творишь?! Нельзя просто взять и открыть огонь!"
2702-30 = "Т-Ты, мелкая! Ты вообще смотрела, куда целишься?! Хочешь ещё и заложника пристрелить?!"
2702-32 = "*вздох* Я знала, что за стрельбу на вступительном экзамене получила низкую оценку,#nно не думала, что это будет преследовать меня до сих пор..."
2702-33 = "Фубуки, не могла бы ты пострелять вместо меня?"
2702-34 = "Не знаю. С такого расстояния я не уверена, что попаду."
2702-35 = "Если будем так тянуть время, Бюро безопасности приедет и заберёт нашу награду. Надо скорее что-то придумать..."
2702-36 = "Может, на этом этапе лучше просто оставить арест им?"
2702-37 = "У нас нет снайперских винтовок, чтобы стрелять с такого расстояния, и нет взрывчатки, чтобы разнести их баррикаду. Если полезем напролом, ситуация может стать хуже."
2702-38 = "Как же бесит! Если бы только удалось убрать баррикаду, перекрывающую вход. Тогда пробраться внутрь было бы проще..."
2702-39 = ""
2702-40 = "Эй, Кирино. Разве эта баррикада не сложена из мешков с мукой, которую они используют для пончиков?"
2702-41 = "С такого расстояния я плохо вижу. А что? Какое это имеет значение?"
2702-42 = "Не привыкай, что я придумываю такие планы, но, кажется, я нашла способ обезвредить преступника."
2702-43 = "Послушай."
2702-45 = "Несколько мгновений спустя..."
2702-47 = "Фух, теперь тихо. Похоже, эти копы сдались."
2702-48 = "Так, вернёмся к сейфу..."
2702-49 = ""
2702-53 = "*бах* *бах* *бах*"
2702-54 = "Ч-Что это за громкие выстрелы?! Они делают предупредительные?"
2702-57 = "Они всё ещё стреляют отвратительно. Пули даже сюда не долетают — просто лупят по баррикаде, которую я сделал из мешков с мукой."
2702-58 = "Эй, идиоты! Вы куда стреляете? Это же просто мука!"
2702-59 = "Чего вы вообще пытаетесь добиться?!"
2702-60 = ""
2702-62 = ""
2702-64 = "*кашель* *кашель* Откуда этот дым? Погодите-ка..."
2702-65 = ""
2702-68 = ""
2702-69 = "Угадал! Ты сейчас дышишь мукой!"
2702-70 = "Эти выстрелы с самого начала предназначались не вам. Наша цель была заполнить магазин мукой."
2702-71 = "Чтобы воспламенить столько муки в воздухе, хватит одной крошечной искры. Другими словами..."
2702-73 = "...это мучная бомба!"
2702-75 = "Идиотки."
2702-76 = "Вы же весь квартал взорвёте, если так сделаете—"
2702-78 = "*бум*"
2702-81 = "Мой магазин... Район..."
2702-82 = "Эти идиотки разрушили весь наш план. Не верится..."
2702-83 = ""
2702-85 = ""
2702-87 = "Ура! Мы поймали преступника!"
2702-88 = "И умудрились взорвать и преступника, и баррикаду, даже не используя бомбы."
2702-89 = "Мой план сработал идеально."
2702-90 = "Теперь-то начальству «Валькирии» придётся признать наши заслуги, да?"
2702-93 = "Полиция! Всем поднять руки и отойти..."
2702-94 = "Нам сообщили о захвате заложников, но это больше похоже на теракт..."
2702-95 = "Смотрите, директор! Мы поймали преступника раньше, чем кто-либо успел приехать!"
2702-96 = "Вы ведь Кирино и Фубуки из Бюро общественной безопасности? Что, чёрт возьми, здесь произошло? Преступник взорвал бомбу?!"
2702-97 = "Нет, мэм. Это мы уничтожили баррикаду, которую они поставили!"
2702-98 = "Вместо пороха использовали муку, но сработало очень эффективно."
2702-99 = "..."
2702-100 = "Ну как? После такого достижения меня ведь можно перевести в Бюро безопасности, правда?"
2702-101 = "Мне перевод не нужен, но от двух недель отпуска я бы не отказалась."
2702-102 = "Взорвать целый магазин, чтобы решить проблему, с которой справился бы один снайпер..."
2702-103 = "Возвращайтесь в участок и готовьтесь писать объяснительную!"
2702-104 = ""
2702-106 = ""
2702-107 = ""
2702-108 = "Что?!"
2702-110 = "После этого Кирино и Фубуки на некоторое время отстранили от службы в наказание за взрыв в пончиковой."
2702-111 = "Вы арестованы!"
