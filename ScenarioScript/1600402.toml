[translation]
1600402-1 = "Студент-мафиози"
1600402-2 = "О! Сенсей — то есть, Босс!"
1600402-3 = "Стоп. Какую позу мне там надо было принять? Сейчас!"
1600402-4 = "Встаёшь вот так прямо..."
1600402-5 = ""
1600402-6 = "Рука на колене, спину слегка согнуть... Да! Вот так."
1600402-7 = "Фух."
1600402-8 = ""
1600402-9 = "Готово, Босс! Какие будут приказы?"
1600402-10 = "[s1] «Немного неловко...»\n[s2] «Где ты этому научилась?»"
1600402-11 = "Почему? Выглядит... странно?"
1600402-12 = "Почему? Выглядит... странно?"
1600402-13 = "Но я сделала точь-в-точь как в «Жизни мафиозного кота»..."
1600402-14 = "А? Хотите узнать, что это? Я так и знала, что спросите."
1600402-15 = "Тогда как вам это? Та-дам!"
1600402-16 = "[s] «Это Blu-ray с гангстерским фильмом?»"
1600402-17 = "Вы его видели?! Разве не шедевр?!"
1600402-18 = "То, как главный герой разговаривает, просто..."
1600402-19 = "Что? Не видели? Может, тогда смотрели какой-нибудь другой фильм?"
1600402-20 = "Наверное, нет..."
1600402-21 = "Да какая разница в мелочах! У нас полно дел."
1600402-22 = "В любом случае, добро пожаловать в Фестивальную банду, Босс!"
1600402-23 = "Не хотите, чтобы я называла вас Боссом? Лучше Сенсей?"
1600402-24 = "И наш клуб — это отдел, а не банда?"
1600402-25 = "Кажется, я поняла, что происходит..."
1600402-26 = "Хм. Не стоит перечить боссу... то есть, Сенсею."
1600402-27 = "Как скажете, Сенсей! Ваше слово — закон!"
1600402-28 = "Ого. Прямо как по-настоящему. Хе-хе."
1600402-29 = "А?"
1600402-30 = "Я сейчас... отыгрываю роль?"
1600402-31 = "..."
1600402-32 = "Н-нет, ничего подобного! Я-я просто пытаюсь заработать настоящую репутацию мафиози!"
1600402-33 = "Так... поэтому...! Я... э-э..."
1600402-34 = "*вздыхает*"
1600402-35 = "Хе-хе. Ну ладно, раскусили."
1600402-36 = "Признаю, я просто пыталась подражать фильму. Мне ещё много тренироваться."
1600402-37 = "Разве не очевидно, зачем я это делаю?"
1600402-38 = "Потому что я хочу стать настоящей гангстершей! Мафия — это же круче всего!"
1600402-39 = "[s] «Ты... хочешь стать мафиози? Ты?»"
1600402-40 = "Да! Я смотрела фильмы днями и ночами и вообще глаз не сомкнула!"
1600402-41 = "В Хяккияко прямо чувствуется атмосфера гангстерского кино, правда?"
1600402-42 = "В мафиозных фильмах есть верность организации, борьба с судьбой, трагедия и самопожертвование!"
1600402-43 = "Это так романтично и вообще лучше всего на свете. Я ради такого и живу!"
1600402-44 = "Вы ведь понимаете, правда? Вы-то точно поймёте, Сенсей."
1600402-45 = "Что это было?"
1600402-46 = "Думаете, я немного неправильно представляю себе гангстеров?"
1600402-47 = "Правда? То есть есть фильм, который я ещё не изучила? Я была уверена, что посмотрела все..."
1600402-48 = "Я не понимаю, что такое мафия...?"
1600402-49 = "Это группа людей, которые делают то, чего остальные делать не хотят."
1600402-50 = "И для них главное — правда и верность... верно?"
1600402-51 = "[s3] «Вообще-то ты не совсем ошибаешься.»\n[s4] «Но ты упускаешь нечто важное...»"
1600402-52 = "Не понимаю. Во всех фильмах именно так и говорят..."
1600402-53 = "Не понимаю. Во всех фильмах именно так и говорят..."
1600402-54 = "Разве они не помогают другим во имя справедливости...? О!"
1600402-55 = "Там пожилая женщина одна несёт что-то тяжёлое!"
1600402-56 = "Не бойтесь, госпожа! Пина уже спешит!"
1600402-57 = "..."
1600402-58 = ""
1600402-59 = "Я вернулась! Не могла же я просто стоять и смотреть, как ей тяжело."
1600402-60 = "Стойте! Слышите плач ребёнка? Кто-то должен его успокоить!"
1600402-61 = "Фух. Я снова вернулась..."
1600402-62 = ""
1600402-63 = "*ах* Вон тому студенту, похоже, нужно подсказать дорогу!"
1600402-64 = ""
1600402-65 = "Голодная собака...!"
1600402-66 = "[s] «...»"
1600402-69 = "..."
1600402-70 = "Фух! Кажется, теперь всё."
1600402-71 = "П-простите, Сенсей. Я просто не могу себя контролировать, когда вижу возможность кому-то помочь."
1600402-72 = "В общем! О чём мы говорили? Эм..."
1600402-73 = "А, точно! Мафия! Что такое мафия...?"
1600402-74 = "Не переживать об этом? Но мы ведь ещё не докопались до истины."
1600402-75 = "Вы и так понимаете, что для меня значит быть гангстером?"
1600402-76 = "Не совсем понимаю, к чему вы. Моё определение чем-то отличается от чужого?"
1600402-77 = "Ладно, поверю вам на слово, потому что вы ведь никогда не врёте. Хи-хи!"
1600402-78 = "Я всё ещё новичок, но уже чувствую огромный прогресс."
1600402-79 = "Смотрите внимательно, Сенсей! Гангстер Пина ещё покорит весь мир!"
1600402-81 = "(После этого Пина ещё некоторое время без умолку тараторила от восторга.)"
1600402-82 = "(Каждый раз, заметив кого-то, кому нужна помощь, она тут же бросалась туда.)"
