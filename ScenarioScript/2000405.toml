[translation]
2000405-1 = "Профилактика теплового удара"
2000405-2 = "Пляж Муйгахама"
2000405-3 = "Приятно немного вспотеть перед плаванием."
2000405-4 = "А когда я прыгну в прохладную воду, будет ещё приятнее."
2000405-5 = "Хотя, думаю, мышцам ног не помешает ещё один разминочный подход."
2000405-6 = "[s1] «Я уже вымотался, а мы ещё даже не начали плавать...»\n[s2] «Сколько ещё мы будем повторять это упражнение?»"
2000405-7 = "Что? А мне кажется, я только начала."
2000405-8 = "Что? А мне кажется, я только начала."
2000405-9 = "Нужно полностью разогреть конечности, чтобы в воде не свело мышцы."
2000405-10 = "[s] «Чувствую, скоро будет ещё один тепловой удар...»"
2000405-11 = "Не волнуйся. В этот раз я приняла меры."
2000405-12 = ""
2000405-13 = ""
2000405-14 = "[ns] «Подожди, это же...?»"
2000405-15 = "Меры по предотвращению теплового удара."
2000405-16 = "Фруктовый лёд, газировка... Этот холодильник забит всем, что может мгновенно охладить."
2000405-17 = "Если во время тренировки захочешь передохнуть и съесть мороженое, просто скажи."
2000405-18 = "[s] «Кажется, мне оно нужно прямо сейчас...»"
2000405-19 = "Уже? Но ещё даже часа не прошло."
2000405-20 = "Хотя сегодня, кажется, немного жарче обычного."
2000405-21 = ""
2000405-22 = ""
2000405-23 = ""
2000405-24 = "Рановато, но, может, сделаем перерыв и съедим фруктовый лёд?"
2000405-27 = "― Сенсей, как тебе нравится есть фруктовый лёд?[wa:960]"
2000405-29 = "― Предпочитаешь облизывать?[wa:110]"
2000405-32 = "― Я предпочитаю сначала дать своему немного подтаять.[wa:1740]"
2000405-34 = "― Так можно дольше наслаждаться вкусом.[wa:1640]"
2000405-37 = "― М-м-м. *лизь* *лизь*[wa:3620]"
2000405-40 = "― Что? Я как-то неправильно его ем?[wa:1670]"
2000405-43 = "― По-моему, вполне нормально.[wa:1070]"
2000405-45 = "― Это странно?"
2000405-48 = "― Сенсей... У тебя снова[wa:2230]"
2000405-50 = "― странное выражение лица...[wa:590]"
2000405-53 = "[ns] «На палочке что-то написано.»"
2000405-54 = "Значит, ты заметил. Ты выиграл."
2000405-55 = "Ты знал, что на палочках некоторых видов фруктового льда бывают надписи о призах?"
2000405-56 = "Это вдохновило меня написать сообщение на палочке того, который я приготовила сама."
2000405-57 = "Раз ты нашёл выигрышную палочку, получаешь особый приз."
2000405-58 = "[s3] «Как волнительно.»\n[s4] «Ох, интересно, что же мне досталось...»"
2000405-59 = ""
2000405-60 = ""
2000405-61 = ""
2000405-62 = ""
2000405-63 = "Посмотрим. Здесь написано..."
2000405-64 = "«Поздравляем! Вы выиграли ещё один комплекс специальных упражнений!»"
2000405-65 = "[s] «Что это вообще за приз?!»"
2000405-66 = "Именно то, что написано. Ты выиграл билет на специальный комплекс упражнений, который я подготовила."
2000405-67 = "Не могу поверить, что ты выиграл с первой попытки."
2000405-68 = "Ты очень удачлив, Сенсей."
2000405-69 = "[s] Сбежать."
2000405-70 = "Не убегай, Сенсей! Выигрышный билет действует только сегодня!"
2000405-71 = "Раз уж мы доели фруктовый лёд, давай приступим к специальным упражнениям."
2000405-73 = "Я вымотался от интенсивной разминки Маширо и в итоге вообще отказался от плавания."
