[translation]
62050-1 = "Эпизод 5;Базилика Ариуса"
62050-7 = "Заставить нас всех собраться в Базилике..."
62050-8 = "Этим местом почти не пользовались с того дня..."
62050-9 = ""
62050-11 = ""
62050-13 = "Базилика Ариуса..."
62050-14 = "Я слышала, после того как нас изгнали из прежней часовни..."
62050-16 = "...мы стали использовать вместо неё это заброшенное здание часовни. Тогда его и назвали Базиликой."
62050-17 = "Не думаю, что после исчезновения Мадам сюда вообще кто-то заходил..."
62050-18 = ""
62050-22 = "...Я сама не знаю."
62050-23 = "Интересно, что это место теперь должно значить для нас."
62050-24 = "И почему Субару из всех мест решила собрать нас именно здесь?"
62050-25 = ""
62050-30 = "Все собрались?"
62050-31 = ""
62050-34 = ""
62050-36 = "...Вы все выглядите встревоженными."
62050-37 = "Это естественно. Я чувствую то же самое."
62050-38 = "Но сначала я хочу кое-что проверить, если никто не против."
62050-39 = "Насколько я понимаю, все здесь..."
62050-40 = ""
62050-42 = ""
62050-44 = ""
62050-45 = "...слышали голос, записанный в Откровении из Писания."
62050-46 = "Кто-нибудь его не слышал? Если нет — ничего страшного, можете сказать."
62050-47 = ""
62050-50 = ""
62050-52 = "Понятно. Никто. Хорошо, похоже, голос слышали все."
62050-53 = "И всё же я бы не стала утверждать, что услышанное было точным воспроизведением Откровения."
62050-54 = "П-Почему? Все его слышали, он же гремел с самого неба..."
62050-55 = "Вот что написано в Откровении."
62050-56 = "«И я видел и слышал одного орла, летящего посреди неба, который говорил громким голосом:"
62050-57 = "„Горе! Горе! Горе живущим на земле"
62050-58 = "от остальных трубных гласов трёх ангелов, которые будут трубить!“»"
62050-59 = "Меня смущает... первая часть. Про орла, летящего посреди неба."
62050-60 = "Я внимательно смотрела вокруг, но не видела даже птицы, не то что орла."
62050-61 = "А вы? Кто-нибудь видел что-то похожее на птицу?"
62050-62 = ""
62050-65 = "Хорошо. Никто. Понятно. И есть ещё одна последняя вещь, которая меня беспокоит."
62050-66 = "...Труба должна прозвучать семь раз. Верно?"
62050-67 = "Да... Я тоже это помню."
62050-68 = "И судя по голосу, который мы слышали сегодня, к этому моменту уже должны были прозвучать четыре трубных гласа. Так?"
62050-69 = "Да... Всё верно."
62050-70 = "...Но я до сих пор не слышала ни одного трубного гласа. А вы?"
62050-71 = ""
62050-74 = ""
62050-75 = "Я слышала..."
62050-76 = "Я не слышала!"
62050-77 = "Не слышала?! Но звук был оглушительный!"
62050-78 = "Я-я уже говорила. Наверное, тебе просто послышалось..."
62050-79 = "Но тот голос слышали все!"
62050-80 = ""
62050-86 = "Тише, тише. Я поняла. Тогда..."
62050-87 = "..."
62050-88 = "Все? Обещаю, здесь нет никакого скрытого смысла, так что не пытайтесь искать подвох в том, что мы сейчас сделаем. Не паникуйте и не волнуйтесь."
62050-89 = "Те, кто слышал трубу, встаньте слева, а те, кто не слышал, — справа."
62050-90 = ""
62050-92 = ""
62050-94 = ""
62050-95 = ""
62050-99 = ""
62050-101 = ""
62050-105 = "(Тех, кто слышал трубу, явно... меньше.)"
62050-106 = ""
62050-108 = ""
62050-109 = "(А? Кажется, у них есть ещё кое-что общее...)"
62050-110 = "Хорошо. Отлично. Спасибо."
62050-111 = "Исходя из всего, что я видела до сих пор, у меня появилась рабочая теория насчёт явления, которое мы все испытали."
62050-112 = ""
62050-115 = ""
62050-117 = ""
62050-118 = "Для начала, думаю, нам нужно отправиться в Porta Pacis и продолжить расследование там."
62050-119 = ""
62050-122 = ""
62050-123 = "Porta Pacis?! Она серьёзно...?"
62050-124 = "Субару всегда серьёзна... особенно когда речь о таких вещах..."
62050-126 = "Но даже Мадам запрещала нам туда входить...!"
62050-127 = "...Но Мадам больше нет."
62050-128 = "Да и не всё, что говорила Мадам, было правильным..."
62050-130 = "И всё же..."
62050-132 = "Я знаю, сейчас всем очень тревожно."
62050-133 = "Но нам нужно выяснить, что произошло. А Porta Pacis — единственное место в Ариусе, где можно найти ответы."
62050-134 = "Там сохранена почти вся история Ариуса и бесчисленные толкования Писания. Всё необходимое должно быть там."
62050-135 = "Н-Но при входе в Porta Pacis нужно быть осторожными..."
62050-136 = "...Да."
62050-137 = "Если туда попытаются войти недостойные, неискренние или неверующие..."
62050-138 = "Они заблудятся и будут прокляты вечно бесцельно скитаться по Ариусу."
62050-139 = ""
62050-141 = ""
62050-142 = "И всё же. Нам нужно понять это явление и то, что оно значит для нас."
62050-143 = "В конце концов, Ариус..."
62050-144 = "Здесь всегда происходили сверхъестественные вещи, которые не могла объяснить ни одна технология Кивотоса."
62050-145 = ""
62050-147 = "Мы не похожи на безнравственных трусов из Тринити, пытавшихся глубоко похоронить свой позор в прошлом."
62050-148 = "Они спрятались от истины, спрятались от НАС, стерев нас из истории."
62050-151 = "И это лишь предположение, но события из Откровения могли проявиться из-за тех студентов Тринити..."
62050-152 = "...и Сенсея из Шале."
62050-154 = "С-Сенсея тоже?! С Тринити я ещё могу понять, но Сенсей..."
62050-155 = "Разве Сенсей не казался хорошим человеком...?"
62050-156 = "Я понимаю, о чём ты. Даже я согласна, что в глубине души Сенсей — хороший человек."
62050-157 = "Но намерения и последствия — не обязательно одно и то же. Ты и я... мы всю жизнь жили с этой жестокой реальностью."
62050-158 = "..."
62050-159 = "И в конце концов Тринити вернулась в Ариус, потому что Рыцари исправительного курса решили делать всё по-своему."
62050-160 = "Откровение проявилось именно после ИХ появления, разве нет?"
62050-161 = "А кто открыл Тринити двери Ариуса? Разве не Сенсей?"
62050-162 = "Не будет большим преувеличением сказать, что причиной этого происшествия стала Тринити, а значит — и Сенсей."
62050-163 = ""
62050-165 = ""
62050-167 = ""
62050-168 = "Это... правда..."
62050-169 = "Даже если бы Сенсей не приставал к нам с «учёбой» и «экзаменами»..."
62050-170 = "...мы бы и сами прекрасно справились."
62050-171 = "Да и какой вообще смысл учиться?"
62050-172 = "Просто мучаешь себя чем-то сложным и скучным без всякой причины."
62050-173 = "Не могу представить большей траты времени."
62050-174 = "...Не то чтобы нам было чем ещё заняться в это время, но всё равно!"
62050-176 = "(Это... группа тех, кто не слышал трубу.)"
62050-177 = ""
62050-179 = ""
62050-181 = "Но... мне кажется, учиться было не так уж плохо..."
62050-182 = "Да. Мы смогли больше узнать о внешнем мире..."
62050-183 = "Мне это нравилось больше, чем изучать разные способы пыток..."
62050-184 = "Честно говоря, я почти ничего из того, что мы проходили, не понимала..."
62050-185 = "Серьёзно! Всё было таким скучным и нудным. Было трудно не заснуть!"
62050-186 = "Но... мне всё равно понравилось. Понравилось, что я могла говорить о своих мыслях, а кто-то меня слушал."
62050-187 = ""
62050-189 = ""
62050-191 = ""
62050-192 = "(А это группа тех, кто слышал трубу...?)"
62050-193 = ""
62050-195 = ""
62050-196 = "(Постой...!)"
62050-197 = "(Нет. Пока просто понаблюдаю...)"
62050-198 = ""
62050-200 = ""
62050-201 = "Все."
62050-202 = "Что произойдёт, если ангелы протрубят семь раз?"
62050-204 = "Что? Э-Это же...!"
62050-205 = "Неужели...?"
62050-207 = "Разве в Откровении не сказано, что..."
62050-208 = "Мы больше всего изучали Откровение... Значит..."
62050-209 = ""
62050-211 = ""
62050-213 = "...Уничтожение Ариуса...?"
62050-216 = "..."
62050-217 = "...Верно. Согласно Писанию, семь трубных гласов знаменуют конец света."
62050-218 = "И начнётся он именно с Ариуса."
62050-219 = "Полагаю, затем семь ангелов должны будут вылить семь чаш."
62050-221 = "Ч-Ч-Что нам делать?!?!"
62050-222 = "Д-Да! Может, ещё не поздно..."
62050-223 = ""
62050-225 = ""
62050-226 = "!!"
62050-227 = "Мы должны очистить Ариус!"
62050-228 = "«Очистить»? Что это...?"
62050-229 = "Ох!!"
62050-230 = "Она права! Сенсей, Отряд, все остальные... Мы должны их выгнать!"
62050-231 = "Т-Тогда как же учёба? Экзамен...?"
62050-232 = "А? Тебя сейчас волнует ВОТ ЭТО?! Ты на ИХ стороне?"
62050-233 = "Да, а как же МЫ? Кому есть дело до остальных?"
62050-235 = "Именно. Поэтому я и хочу узнать, чего хотите ВЫ."
62050-236 = "Вот почему я попросила всех собраться здесь, в Базилике Ариуса. Спустя столько времени."
62050-237 = "Нас, изгнанных, силой загнали в эту ложную часовню. А затем её ещё и осквернила Мадам."
62050-238 = "...И всё же эта часовня принадлежит Ариусу. Это НАША часовня."
62050-239 = "Давайте вернём себе наш Ариус!"
62050-240 = "Они сказали, осталось ещё три трубных гласа, да?"
62050-241 = "Н-Но мы ведь их на самом деле не слышали..."
62050-242 = "Ну, если мы всё очистим, этого больше не случится! Значит, и волноваться не о чем!"
62050-244 = "Н-Но..."
62050-245 = "(Я ведь так усердно училась...)"
62050-246 = "(И всё? Всего один день занятий — и конец? Это так...)"
62050-247 = ""
62050-251 = "М-Может... не всё это... произошло из-за Тринити и Сенсея...?"
62050-252 = ""
62050-254 = ""
62050-256 = "Что?"
62050-257 = "Что?! Кто это сказал?!"
62050-258 = "Разве она не...?"
62050-259 = ""
62050-261 = ""
62050-263 = ""
62050-265 = "...Можешь объяснить подробнее?"
62050-266 = "Н-Ну, это всего лишь... моё мнение, но..."
62050-267 = "О-Откуда мы вообще знаем, что всё произойдёт точно так, как написано в Откровении?"
62050-269 = "*ахает*"
62050-270 = "Что с ней не так...?"
62050-271 = "Б-Богохульство...!"
62050-273 = "...Почему ты так думаешь?"
62050-275 = "Н-Ну, орла ведь не было..."
62050-276 = "И каждый трубный глас... должен был знаменовать новое бедствие..."
62050-277 = "Но ничего не произошло..."
62050-279 = "Не неси чушь!"
62050-280 = "То, что Тринити ступила сюда, и было бедствием!"
62050-281 = "И этот Сенсей тоже!"
62050-282 = "Как и Отряд!"
62050-283 = "Да, Отряд тоже!"
62050-284 = "А я вообще ненавижу Отряд больше всех. Даже сильнее Тринити..."
62050-285 = "Да... Они важничают и ведут себя так, будто умнее нас!"
62050-286 = "Это они сбежали из Ариуса! Они бросили нас!"
62050-289 = "Они могли это сделать!"
62050-290 = "Им это вполне по силам!"
62050-291 = ""
62050-293 = "Отряд без труда мог бы повести нас всех за собой!"
62050-294 = "Они даже говорили, что в них королевская кровь!"
62050-295 = ""
62050-297 = "Почему Саори ушла...? Почему ты бросила нас...?"
62050-298 = "Почему...? Почему ты сбежала от нас?"
62050-299 = "Мы все... так на тебя равнялись!"
62050-300 = ""
62050-302 = "Что ты имела в виду, говоря: «Всё слишком пусто...»?"
62050-303 = "Ты была одной из нас... Ты жила так же, как мы..."
62050-304 = "Как ты могла отправиться искать спасение... без нас?!"
62050-305 = ""
62050-309 = "..."
62050-310 = "..."
62050-311 = "..."
62050-312 = "Когда я оглядываюсь вокруг, начинаю думать..."
62050-313 = "«Это правда нормально? Правда нормально так жить?»"
62050-314 = "«Как вообще... будет выглядеть остаток моей жизни...?»"
62050-315 = ""
62050-319 = "Ах, дело в том..."
62050-320 = "Я тоже. Мы все..."
62050-321 = "Мы все хотели для себя другой жизни."
62050-324 = "Но это..."
62050-325 = "...теперь невозможно...!"
62050-326 = ""
62050-328 = ""
62050-329 = "Нет, не тщетно!"
62050-330 = "*ахает*"
62050-331 = "Мы можем! Наверняка... Н-Нет, может быть..."
62050-332 = "...Как?"
62050-333 = "Н-Ну... Наверное, можно спросить Сенсея..."
62050-334 = "Я-я сама толком не знаю, но Сенсей знает много того, чего не знаем мы!"
62050-335 = ""
62050-337 = ""
62050-339 = ""
62050-340 = "..."
62050-341 = "Опять Сенсей?"
62050-342 = "Сенсей то, Сенсей это. Меня уже тошнит!"
62050-343 = "Ты что, считаешь Сенсея каким-то богом? Думаешь, всё само наладится и мы найдём рай, если просто будем верить этому человеку и следовать за ним?"
62050-344 = ""
62050-346 = ""
62050-347 = ""
62050-348 = "Это невозможно!!"
62050-349 = "Раз уж заговорили об этом, ты что-то уж слишком привязалась к этим чужакам."
62050-350 = "Ну конечно, она же побывала снаружи и вернулась! Наверняка там ей промыли мозги!"
62050-351 = "Страдания Ариуса для Сенсея — давно не новость! И что именно Сенсей сделал для нас за всё это время? Что Тринити сделала, чтобы нам помочь?!"
62050-352 = "Тринити...!!"
62050-354 = "Нас бы вообще здесь не было, если бы Тринити не бросила нас гнить сотни лет назад!"
62050-355 = "Неудивительно, что Субару хочет снова открыть Porta Pacis!"
62050-356 = "Субару, ты серьёзно позволишь ей такое говорить?"
62050-357 = ""
62050-360 = ""
62050-361 = "Ух...!"
62050-363 = "Субару, ты ведь на нашей стороне, да?"
62050-364 = "Ты защитишь Ариус, правда?"
62050-365 = ""
62050-366 = "Докажи нам, Субару!!"
62050-368 = "Стойте! Стойте...!"
