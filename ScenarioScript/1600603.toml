[translation]
1600603-1 = "Секретный ингредиент девушки"
1600603-3 = "[ns1] «Так куда мы идём, Изуми?»\n[ns2] «Пляж вообще не в этой стороне.»"
1600603-4 = "Хм..."
1600603-5 = "Хм..."
1600603-6 = "Нет такого правила, что летние деликатесы можно есть только на пляже, Сенсей."
1600603-7 = "Согласно моим исследованиям, неподалёку есть ещё одно место, знаменитое своей едой."
1600603-8 = "[s] «Этой информации вообще можно доверять?»"
1600603-9 = "С чего бы той старушке, от которой я это услышала, мне врать?"
1600603-10 = "Она сказала: «Эй, похоже, тебе очень понравится этот креп. Хочешь попробовать?»"
1600603-11 = "Я взяла креп, попробовала — и он оказался просто потрясающим... *облизывает губы*"
1600603-12 = "[s] «Это не отвечает на мой вопрос.»"
1600603-13 = "А?!"
1600603-14 = "О! Точно, так вот что я хотела сказать...!"
1600603-15 = "Дальше по этой дороге есть крошечный киоск, знаменитый своей версией местного фирменного блюда — холодной лапши."
1600603-16 = "Вот её-то я сегодня и съем!"
1600603-19 = ""
1600603-20 = "Должно быть, это оно!"
1600603-21 = "Ресторан, где продают холодную лапшу!"
1600603-22 = "[s] «Да? Но...»"
1600603-23 = ""
1600603-25 = "Почему здесь никого нет? Я думала, это место знаменито в округе!"
1600603-26 = "Только не говори, что они уже разорились. Это ужасно!"
1600603-27 = "Мы полчаса шли сюда по этой раскалённой дороге!"
1600603-28 = "Кто-нибудь должен компенсировать мне эту прогулку."
1600603-29 = "[s] «Ты беспощадна, Изуми.»"
1600603-30 = "День ещё не потерян."
1600603-31 = "Всё потому, что пляжная закусочная теперь самое модное место..."
1600603-32 = "Конечно, заведение чемпиона по хватанию песка переманило к себе всех клиентов."
1600603-33 = "О, вы всё ещё работаете?"
1600603-34 = "Тогда хорошо. Нам две порции холодной лапши, пожалуйста."
1600603-35 = "[s] «Заказывай за себя сама, Изуми!»"
1600603-37 = "Вот, пожалуйста. Две порции холодной лапши."
1600603-39 = "Ух ты. Посмотри, какая яркая подача. Выглядит очень вкусно!"
1600603-40 = "А теперь попробуем..."
1600603-41 = ""
1600603-43 = ""
1600603-44 = ""
1600603-45 = "[ns] «Ну как?»"
1600603-46 = "Довольно вкусно, но чего-то не хватает."
1600603-47 = "Поняла! А что если добавить вот это?"
1600603-48 = ""
1600603-49 = "[s] «Изуми...? Что ты сейчас туда добавила?»"
1600603-50 = "Это? Моё домашнее арахисовое масло."
1600603-51 = "Сначала добавляешь немного арахисового масла, перемешиваешь с холодной лапшой и... вуаля!"
1600603-52 = "Вот, точно будет вкусно! Хочешь попробовать?"
1600603-53 = "[s3] «Ты сказала, что сама его сделала...?!»\n[s4] «Арахисовое масло... с холодной лапшой?!»"
1600603-56 = ""
1600603-58 = ""
1600603-59 = ""
1600603-60 = "Открывай рот, Сенсей, самолётик летит! *изображает самолёт*"
1600603-61 = "..."
1600603-62 = "Я крепко зажмурился и попробовал холодную лапшу Изуми."
1600603-63 = "*жует* *жует*"
1600603-64 = "*глоть*"
1600603-67 = "Сочетание кисло-сладкого бульона лапши со сладким густым арахисовым маслом оказалось..."
1600603-68 = "[s] «Это... Это вкусно. Но как?!»"
1600603-69 = "Правда? Очень вкусно, да?! Я знала, что они идеально сочетаются!"
1600603-70 = "Я тоже хочу попробовать!"
1600603-71 = ""
1600603-72 = ""
1600603-73 = "Ты прав, Сенсей! Идеально!"
1600603-74 = "[s] «Не могу поверить...»"
1600603-77 = "На следующий день."
1600603-78 = "Что происходит? Почему здесь столько людей?"
1600603-79 = "[s] «Ещё вчера здесь было пусто.»"
1600603-80 = "Я сегодня хотела попробовать другое блюдо из меню!"
1600603-81 = "Теперь нам даже сесть негде. Что будем делать, напарник по испытанию?"
1600603-82 = "[s] «Ты всё ещё меня так называешь?»"
1600603-83 = "Похоже, выбора нет — придётся идти куда-нибудь ещё."
1600603-84 = "Вообще-то та же старушка посоветовала ещё одно место с хорошей едой."
1600603-85 = "Жаль, что здесь не получится, но всегда можно попробовать другое!"
1600603-87 = "[ns] «Это то самое место?»"
1600603-88 = "Оно известно своим рисом с угрём..."
1600603-89 = "...но здесь никого нет."
1600603-90 = "Только не говори, что они закрылись."
1600603-91 = "Эй? Вы работаете?"
1600603-92 = "Конечно работаем!"
1600603-93 = "Просто с самого утра всех наших потенциальных клиентов переманили какой-то чемпион по хватанию песка и та тележка с лапшой."
1600603-94 = ""
1600603-95 = "О, тогда...!"
1600603-96 = "Нам две порции риса с угрём!"
1600603-98 = "Вот, пожалуйста. Две порции риса с угрём!"
1600603-100 = "Приступим!"
1600603-101 = ""
1600603-103 = ""
1600603-104 = ""
1600603-105 = "О. Э-э-э..."
1600603-106 = "Хммм. Хмм?"
1600603-107 = "[s] «Что опять, Изуми?»"
1600603-108 = "Ну, этот рис с угрём вкусный..."
1600603-109 = "...но чего-то не хватает."
1600603-110 = "[s] «Чего-то не хватает?»"
1600603-111 = "Ага! Именно так, Сенсей!"
1600603-112 = "Чего-то... не хватает. Хм..."
1600603-113 = ""
1600603-115 = ""
1600603-116 = ""
1600603-117 = "[ns] «Опять?»"
1600603-118 = "И кто бы мог подумать — снова арахисовое масло!"
1600603-119 = ""
1600603-121 = ""
1600603-122 = ""
1600603-123 = "*жует* *жует* *жует*..."
1600603-124 = "М-м-м, вкусно!"
1600603-125 = "Хочешь попробовать, Сенсей?"
1600603-126 = "[s] «Серьёзно?»"
1600603-127 = ""
1600603-129 = ""
1600603-130 = ""
1600603-131 = "Вот, Сенсей, открывай рот. Дам тебе попробовать."
1600603-134 = "Мягкий вкус арахисового масла смешался во рту с насыщенной сладостью угря."
1600603-135 = "Это следующая ступень эволюции риса с угрём!"
1600603-136 = "Правда вкусно?! Арахисовое масло подходит ко всему!"
1600603-137 = "Я слышала, что если намазать хлеб арахисовым маслом и уронить его, он всегда падает маслом вниз."
1600603-138 = "Уже одно это показывает, насколько оно потрясающее!"
1600603-139 = "[s5] «И что именно тут потрясающего?»\n[s6] «Но почему это настолько вкусно?»"
1600603-140 = "Не забывай, что я член Общества исследования гурманов!"
1600603-141 = "Не забывай, что я член Общества исследования гурманов!"
1600603-142 = "Я всегда стремлюсь пробовать настоящую гурманскую еду. Для меня это пустяки!"
1600603-143 = "Наблюдая, как Изуми уплетает рис с угрём, я запутался ещё сильнее."
1600603-146 = "Когда мы вернулись на следующий день, популярность заведения с рисом тоже загадочным образом резко выросла."
1600603-147 = "А? Почему здесь столько людей?"
1600603-148 = "Вчера тут никого не было! Я думала, сегодня будет так же!"
1600603-149 = "[s] «Ты беспощадна, Изуми.»"
1600603-150 = "Но я сегодня хотела попробовать особые суши с угрём!"
1600603-151 = "Почему это постоянно происходит?"
1600603-152 = ""
1600603-154 = ""
1600603-156 = "Это та девушка! Любая еда, к которой она прикасается, становится невероятно популярной!"
1600603-157 = "Я сам не могу в это поверить!"
1600603-158 = "Что?!"
1600603-159 = "Это та самая девушка?!"
1600603-160 = "Легендарный консультант, которая, как говорят, мгновенно оживляет даже самый захудалый бизнес?!"
1600603-161 = "[s] «Погоди. Что?»"
1600603-162 = "Пожалуйста! Приходите и в наш ресторан!"
1600603-163 = "Как нам максимизировать прибыль летом? Что вы посоветуете?"
1600603-164 = "Пожалуйста, помогите нам, мисс!"
1600603-166 = "Подождите. Что вообще происходит?!"
1600603-167 = "[s] «Это наш сигнал уходить, Изуми.»"
1600603-168 = "Но я всего лишь хотела попробовать летние деликатесы!"
1600603-170 = "Мы с Изуми убежали на дальний край пляжа, спасаясь от толпы владельцев ресторанов."
