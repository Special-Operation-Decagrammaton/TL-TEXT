[translation]
1303-1 = "Президент всегда права, часть 3"
1303-2 = ""
1303-3 = "Опоздала!"
1303-4 = "Где председатель Совета безопасности Марина? Еженедельное собрание Секретариата началось десять минут назад!"
1303-5 = ""
1303-6 = "Технически оно началось на 30 минут позже из-за вашего сна."
1303-7 = ""
1303-8 = "Замолчи! Я имею право задерживать собрания сколько захочу! Я президент студсовета академии Красная Зима и Великая Вождь!"
1303-9 = "Какой-то председатель Совета безопасности не смеет заставлять меня ждать. Это недопустимо!"
1303-10 = "Я подвергну её чистке!"
1303-11 = ""
1303-13 = ""
1303-15 = "Приношу искренние извинения за ожидание, президент Черина!"
1303-16 = "Опоздала!"
1303-17 = "Мне пришлось ждать целых десять минут! Иди сюда, я тебя подвергну чистке!"
1303-18 = "Простите, президент. Подготовка доклада заняла больше времени, чем я думала..."
1303-19 = "Но у меня хорошие новости."
1303-20 = "Хорошие новости?"
1303-21 = "Да. Как вы и приказали, я перевела Пероро в Федеральную академию Красная Зима!"
1303-22 = "Правда? Серьёзно?"
1303-23 = "Хи-хи. Отличная работа, председатель Марина! Теперь студенты со всего Кивотоса хлынут в нашу школу!"
1303-24 = "Для меня честь служить вам, президент!"
1303-25 = "Ну и где Пероро? Быстрее, покажи!"
1303-26 = "Да, конечно."
1303-28 = "Нодо... кхм. Товарищ Пероро, выйдите вперёд!"
1303-29 = ""
1303-31 = ""
1303-32 = "Перо-перо..."
1303-33 = ""
1303-36 = ""
1303-37 = ""
1303-38 = ""
1303-41 = "П-Пероро!"
1303-43 = "Что это за жуткая гигантская птица? Она что, пускает слюни?!"
1303-44 = "Э-Это Пероро, как вы и просили."
1303-45 = "Ух, похоже на то. Но я не ожидала, что вживую он настолько уродливый!"
1303-46 = "В городе я видела его только издалека. Если посмотреть поближе... он не такой милый, как я думала."
1303-47 = "Н-Но Пероро очень популярен по всему Кивотосу, так что если он будет стоять перед Секретариатом с усами, то соберёт огромную толпу?"
1303-48 = "Как ты смеешь такое предлагать? Зачем мне надевать драгоценный символ моей власти на такую уродливую штуку?"
1303-49 = "Главный секретарь Томоэ, возможно, и говорила что-то такое, но нас явно сбили с пути!"
1303-50 = ""
1303-52 = "Не могу вынести мысли, что каждый раз при входе и выходе из Секретариата мне придётся видеть это неприятное создание!"
1303-53 = "Марина, у меня для тебя новая работа! Подвергни его чистке! Немедленно отправь в Старый институт!"
1303-55 = "В спецотряд №227 Старого института, перо?"
1303-56 = "Эта штука только что заговорила?"
1303-57 = "Пусть Старый институт — холодное и бесплодное место, он дорог каждой из нас.#nА ты считаешь его огромной мусоркой?"
1303-58 = ""
1303-60 = ""
1303-64 = "Мне всё равно, что ты президент — я этого не потерплю, перо!"
1303-66 = "Почему из Пероро вылезла эта сосланная извращенка? Это была... подделка?!"
1303-67 = "Ты тупая, перо? Пероро — вымышленный персонаж!"
1303-68 = "Ух... Как ты смеешь пытаться меня обмануть, Марина?!"
1303-69 = "П-Простите, президент!"
1303-70 = "Я просто пыталась выполнить ваш невозможный приказ..."
1303-71 = "Никаких оправданий! Ты сговорилась с отстранённым студентом спецотряда, чтобы обмануть меня! Непростительно!"
1303-72 = "Подвергнуть их всех чистке! Извращенку и бывшего председателя Совета безопасности немедленно отправить в Старый институт!"
1303-74 = "Отстранённого студента угрозой чистки не напугаешь, перо!"
1303-75 = "Это перо-революция, перо!"
1303-76 = "Тебя тоже подвергли чистке, Марина! Вставай! Давай сражаться против этого диктатора!"
1303-77 = "Ох... Я... просто выполняла приказы президента Черины..."
1303-78 = ""
1303-79 = "Хорошо! Будь по-вашему! Это государственный переворот!"
1303-81 = "Ч-Что?! Председатель Совета безопасности устроила переворот?!"
1303-82 = "Т-Томоэ... ПОМОГИ!"
1303-84 = "(После трёх восстаний и чисток за одну неделю Секретариат в конце концов вернулся к своему исходному состоянию.)"
1303-85 = "(...Костюм Пероро собирались выбросить, но неизвестный студент Тринити купил его за баснословную сумму.)"
1303-86 = "Президент всегда права"
