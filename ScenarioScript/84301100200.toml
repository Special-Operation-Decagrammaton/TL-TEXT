[translation]
84301100200-5 = "У меня немного странный вопрос, если не возражаете."
84301100200-6 = "А? Не возражаю. Что такое?"
84301100200-7 = "В выставочном зале... есть какое-нибудь место, где обычно собирается много людей, или оборудование, которое может вызывать опасения?"
84301100200-8 = "Не то чтобы я не доверяла работе студентов Миллениума, конечно, но как член Чаепития я хотела бы сама увидеть такие места раньше остальных студентов."
84301100200-9 = "Просто ради собственного спокойствия."
84301100200-10 = "Потенциально опасное оборудование и места скопления людей? Хм..."
84301100200-11 = "Я думала, ты здесь просто осматриваешь достопримечательности..."
84301100200-12 = "Хм..."
84301100200-13 = "Прости, но даже для таких гидов, как мы, на этот вопрос трудно ответить."
84301100200-14 = "А, я не хотела лезть не в своё дело."
84301100200-15 = "Прошу забыть вопрос и принять мои извинения."
84301100200-16 = "Нет, не совсем..."
84301100200-18 = "Просто таких мест слишком много! Что здесь может вызвать беспокойство? Я даже не знаю, с чего начать!"
84301100200-19 = "...Что?"
84301100200-20 = "Это Миллениум! Здесь взорваться может что угодно, и шуметь тоже может что угодно! Более того, некоторые места уже шумят!"
84301100200-21 = "Как она и сказала... на технологических выставках клубы часто перегибают палку, пытаясь выяснить, насколько далеко можно зайти со своими технологиями."
84301100200-22 = "В теории «Семинар» всё регулирует и координирует, но их не всегда слушают..."
84301100200-23 = "Поэтому нас и попросили быть гидами. Нельзя допустить, чтобы нашим гостям из Тринити что-нибудь доставило неудобства."
84301100200-24 = "Ага. И если что-нибудь всё-таки помешает, наша работа — с этим разобраться."
84301100200-26 = "Ваша забота о моём удобстве... пожалуй, даже чрезмерна."
84301100200-27 = "И спасибо за объяснение. Похоже, здесь настоящий простор для импровизации. Мне нравится."
84301100200-28 = "Теперь понимаю, почему трудно выделить какую-то одну потенциальную проблемную точку..."
84301100200-29 = "Мм..."
84301100200-30 = ""
84301100200-32 = ""
84301100200-34 = "(Может, лучше спросить обычного студента.)"
