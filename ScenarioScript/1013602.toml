[translation]
1013602-1 = "Прогулка по окрестностям"
1013602-3 = ""
1013602-4 = "Эй, Сенсей."
1013602-5 = "[s] «Привет, Эйми. Ты усердно работаешь...»"
1013602-6 = "Это минимум, который каждый из нас может сделать."
1013602-7 = "Что осталось? Хм... Я бы назвала это «разведкой силовым методом»."
1013602-8 = "Я заметила на радаре кое-что, что мне не понравилось."
1013602-9 = "[s] «Не против, если я пойду с тобой?»"
1013602-10 = "Проблем быть не должно. Если только..."
1013602-11 = ""
1013602-13 = ""
1013602-14 = "Хм. Вообще-то никаких «если». Я вас защищу."
1013602-17 = "И так мы с Эйми вышли наружу вместе закончить её последнюю задачу."
1013602-18 = ""
1013602-19 = ""
1013602-20 = "Есть два маршрута патрулирования, каждый примерно по два часа. В целом будем идти полукругами."
1013602-21 = "Будем поддерживать тактический темп... 4 километра в час."
1013602-22 = "Вам не нужно держать эту скорость весь маршрут. Но постарайтесь не слишком отставать."
1013602-23 = "Иначе мне будет трудно вас защищать, Сенсей."
1013602-25 = "После её инструктажа патруль начался."
1013602-26 = ""
1013602-29 = "Как и ожидалось, поспевать за любой старшеклассницей, не говоря уже об Эйми с её выносливостью, оказалось совсем не прогулкой."
1013602-31 = ""
1013602-32 = "Впечатляет, Сенсей. Вы довольно хорошо держитесь."
1013602-33 = "[s] «Даже если это пустая похвала... *тяжело дышит*... Спасибо... *выдыхает*...»"
1013602-34 = "Это не пустая похвала. Госпожу Рио максимум через полчаса пришлось бы уносить на носилках."
1013602-35 = "А? Мне стоит поговорить с ней о здоровье?"
1013602-36 = "Я не спорю, но..."
1013602-37 = "Знаете, удачи. Если это скажете вы, она, возможно, действительно послушает."
1013602-38 = "?!"
1013602-39 = "Прячьтесь, Сенсей!"
1013602-40 = ""
1013602-43 = "Эйми затолкнула меня в небольшую нишу в металлическом полу, чтобы спрятать."
1013602-44 = "Простите, Сенсей. Я не хотела вас напугать."
1013602-45 = "Оставайтесь там, пока я не скажу, что всё чисто."
1013602-46 = "Один, два, три... Примерно одно отделение. Без проблем."
1013602-47 = ""
1013602-52 = ""
1013602-53 = "Чисто, Сенсей. Угроза устранена."
1013602-54 = "Пока что. Думаю, подкрепление скоро подтянется."
1013602-56 = "Эйми неумолимо двигалась вперёд."
1013602-58 = ""
1013602-59 = ""
1013602-60 = "Положение противника подтверждено. Дистанция... 427 метров. Вступаю в первый контакт!"
1013602-63 = "Она сбивала врагов ещё до того, как я успевал их увидеть."
1013602-65 = ""
1013602-66 = "Подождать и уничтожить всех разом? Или убрать разведгруппу и перейти к партизанской тактике?"
1013602-67 = "..."
1013602-68 = "Позволять ситуации обостряться неэффективно!"
1013602-72 = ""
1013602-73 = "Похоже, враг нас ещё не обнаружил. Судя по слабому вооружению, этот робот не более чем транспортный юнит."
1013602-74 = "Найти и уничтожить!"
1013602-77 = "Мне оставалось только поражаться решительному и эффективному стилю боя Эйми, пока она вела нас по маршруту."
1013602-79 = ""
1013602-80 = "Мы уничтожили все тревожные отметки радара, которые я видела раньше."
1013602-81 = "Хорошая работа, Сенсей. Теперь можем возвращаться?"
1013602-82 = "[s] «Это было невероятно...»"
1013602-83 = "Обычный рабочий день."
1013602-84 = "Наверное, нехорошо говорить за спиной, но... президент Химари имеет склонность загонять людей до изнеможения."
1013602-85 = "Хотя я постоянно говорю ей это прямо в лицо, так что вообще делаю ли я что-то неправильно?"
1013602-86 = "[s] «В-Вы все должны стараться ладить...»"
1013602-87 = "Мы и так неплохо ладим. Разве нет?"
1013602-88 = "..."
1013602-89 = "Раньше я никогда не работала одновременно с таким количеством людей."
1013602-90 = "Я не любила большие организации. Чем они больше, тем менее эффективными становятся."
1013602-91 = "...А другим студентам я казалась пугающей."
1013602-92 = "Обычно мне... было трудно вписаться."
1013602-93 = "[s] «А здесь иначе?»"
1013602-94 = "Да. Иначе. Почему-то."
1013602-95 = "Да. Иначе. Почему-то."
1013602-96 = "Наверное, потому что остальные такие же странные. Возможно, именно поэтому всё работает."
1013602-97 = "Здесь я не чувствую себя чужой."
1013602-98 = "[s] «Надеюсь, у тебя будет больше таких мест и больше таких людей.»"
1013602-99 = "Больше людей, да?"
1013602-100 = "..."
1013602-101 = "Ещё несколько месяцев назад я бы назвала такую идею неэффективной."
1013602-102 = "Но когда слышу это от вас..."
1013602-103 = "Не знаю. Мне хочется попробовать."
1013602-104 = "[s] «Я рад, что ты так думаешь.»"
1013602-105 = "Да."
1013602-106 = "Потому что это вы, Сенсей."
1013602-108 = "По дороге обратно на базу мы с Эйми непринуждённо болтали."
