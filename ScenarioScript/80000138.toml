[translation]
80000138-1 = "Шоколадное безе"
80000138-2 = "Я пришёл в кафе немного раньше Субару."
80000138-3 = "Я любовался интерьером, когда..."
80000138-4 = "Эй, Сенсей."
80000138-5 = "Хм...? О, я опоздала?"
80000138-6 = "[s] «Привет, Субару. Это я пришёл рано.»"
80000138-7 = "П-Понятно. Могли бы предупредить."
80000138-8 = "[s] «Просто хотел удивить мою дорогую Субару.»"
80000138-9 = "Опять вы такое говорите..."
80000138-10 = "Теперь понятно, почему остальные студенты говорят, что вы та-а-акой вредный."
80000138-11 = "Ха-ха. Дуйтесь сколько хотите. Сами виноваты."
80000138-12 = "Итак... Я хотела встретиться здесь, потому что..."
80000138-13 = "Эм, так..."
80000138-14 = "..."
80000138-15 = "Вы столько для меня сделали. Я знаю, что никогда не смогу отплатить полностью, но это заставило меня подумать—"
80000138-16 = "...!"
80000138-17 = "[ns] «Знаешь, хорошее кафе.»"
80000138-18 = "Хм?"
80000138-19 = "Фу-фу. Верно. Я уже привыкаю к таким местам... Ну, зданиям с интерьером, климат-контролем... и базовым обслуживанием."
80000138-20 = "...Наверное, потому что я так много подрабатываю."
80000138-21 = "Хм? Подработка — нормально, но надо «сосредоточиться на учёбе»?"
80000138-22 = "Ух... Знаю. Знаю. Опять экзамены и занятия. Мы поняли — вы учитель."
80000138-23 = "В-В любом случае...!"
80000138-24 = "..."
80000138-25 = "Работая во внешнем мире, я узнала о штуке под названием «печенье-безе». Пробовали?"
80000138-26 = "А, я опять сказала «внешний мир»... Простите. От некоторых привычек сложно избавиться."
80000138-27 = "В общем, этот десерт делают, взбивая сахар и яичные БЕЛКИ до кремовой пены."
80000138-28 = "Потом долго сушат при низкой температуре, около 100 градусов."
80000138-29 = "Разве это не абсолютно непростительно?!"
80000138-30 = "[s] «Почему?! Что тебе сделало безе?!»"
80000138-31 = "Какая наглость! Какая самоуверенность — использовать только белки, а желтки выбрасывать!"
80000138-32 = "[s] «А.»"
80000138-33 = "Потом я узнала о «бланшировании», которое немного помогает с отходами. Это когда отдельно взбивают желтки, примерно как безе. Но способ далеко не такой популярный и практичный."
80000138-34 = "А поскольку желтки портятся быстрее белков... это означает, что использовать все не успевают! Часть приходится выбрасывать."
80000138-35 = "Что это за чудовищный грех?! Не могу смириться с такой роскошью и жадностью!"
80000138-36 = "Даже если бог простит этих кондитеров, я не прощу!"
80000138-37 = "Поэтому я забираю желтки, которые иначе выбросили бы. Мариную их с сахаром, мирином и соевым соусом, получаются маринованные желтки."
80000138-38 = "Потом делюсь с девочками в Ариусе... И ищу другие способы всё использовать."
80000138-39 = "*вздох* Куда катится мир...? Люди даже не понимают, насколько ценна еда..."
80000138-40 = "[s] «Успокойся, Субару! Еда точно ценна, тут я согласен!»"
80000138-41 = "Спасибо. Кстати, о чём мы говорили...?"
80000138-42 = "А, точно. Печенье-безе."
80000138-43 = "Эм, так..."
80000138-44 = ""
80000138-46 = ""
80000138-47 = "Сенсей. Я слышала, что во внешнем мире... Нет. В ЭТОМ мире есть праздник под названием День святого Валентина."
80000138-48 = "И в этот день..."
80000138-49 = "..."
80000138-50 = "Нужно выражать благодарность людям, которым ты благодарен..."
80000138-51 = "Или... иногда... передать послание человеку, к которому испытываешь особые чувства..."
80000138-52 = "Но в любом случае! Я слышала, что надо дарить шоколад."
80000138-53 = "П-Поэтому я попробовала кое-что приготовить!"
80000138-54 = ""
80000138-56 = ""
80000138-58 = "[ns] «Ого! Такое можно сделать из безе?»"
80000138-59 = "Д-Да. Нужно просто добавить немного какао-порошка."
80000138-60 = "...В конечном счёте я сильна в физической работе. Для взбивания безе нужна некоторая сноровка... и, самое главное, сильные мышцы."
80000138-61 = "...В каком-то смысле, думаю, это единственное, что я вообще МОГЛА приготовить..."
80000138-62 = "...А поскольку духовку мы сейчас позволить себе не можем, пришлось печь это на работе..."
80000138-63 = "Теперь, когда я это сказала, звучит ужасно жалко..."
80000138-64 = "..."
80000138-65 = "Я так и знала. Кому вообще такое нужно?! Не могу поверить, что попыталась подарить это Сенсею."
80000138-66 = "Какая же я идиотка. Всё кончено! Пытаться сделать такое... Такое...!"
80000138-67 = ""
80000138-69 = ""
80000138-71 = ""
80000138-73 = "Субару попыталась бросить шоколадные безе на пол, но я быстро её остановил!"
80000138-75 = "[ns1] «Всё хорошо, Субару! Эти подробности неважны!»\n[ns2] «Я очень рад подарку! Огромное спасибо!»"
80000138-78 = "...Правда?"
80000138-79 = "[s] «Конечно!»"
80000138-80 = "Если возьмёте эти слова назад, я буду ненавидеть вас до конца жизни, поняли...?"
80000138-81 = "[s] «Никогда...»"
80000138-82 = ""
80000138-84 = "..."
80000138-85 = "Ладно, хорошо."
80000138-86 = "...Хи-хи."
80000138-88 = "Мы с Субару ели печенье и отдыхали в кафе."
