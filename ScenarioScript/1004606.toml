[translation]
1004606-1 = "Держась за руки с Изуной"
1004606-2 = "По дороге на встречу с Изуной я думал, что, возможно, зря вообще заговорил с ней об этом."
1004606-3 = "О! Господин! Сюда! Я здесь!"
1004606-4 = ""
1004606-5 = ""
1004606-6 = "[ns] «Привет, Изуна. Давно ждёшь?»"
1004606-7 = "О, совсем нет!"
1004606-8 = "О, эм, так чем займёмся сегодня? Чем-нибудь на пляже..."
1004606-9 = "Хм! Летняя ниндзя-тренировка — это хорошо, но, может, лучше исследовать места за пределами пляжа!"
1004606-10 = ""
1004606-12 = ""
1004606-13 = "Может, в этот раз вместо одной только тренировки..."
1004606-14 = "мы могли бы сходить в популярный летний ресторан!"
1004606-15 = "[s] «Эм, случайно...»"
1004606-16 = "Да, господин?"
1004606-17 = "[s] «Ты не любишь плавать в океане?»"
1004606-18 = ""
1004606-20 = ""
1004606-21 = "Ч-что?!"
1004606-22 = "[s1] «Можешь ничего не говорить, но мне кажется, ты этого избегаешь.»\n[s2] «Я просто переживаю, не пытался ли заставить тебя делать то, чего ты не хочешь.»"
1004606-25 = "Господин, дело в том..."
1004606-26 = "[s] «Можешь ничего не говорить. Прости, что спросил...»"
1004606-27 = "О, нет, господин! Дело не в том, что я не хочу!"
1004606-28 = "Не то чтобы я не любила плавать... но..."
1004606-29 = ""
1004606-31 = ""
1004606-32 = "У-У-а-а-а! Господин...! Простите!"
1004606-33 = "[ns] «А? И-Изуна?»"
1004606-34 = "Просто... я не пыталась скрыть это от вас или что-то такое, но..."
1004606-36 = "И тогда Изуна наконец призналась в своём секрете."
1004606-38 = "[ns] «Потому что ты не умеешь плавать?»"
1004606-39 = "Ну, эм..."
1004606-40 = "Я... так и не привыкла к в-воде..."
1004606-41 = "Я уже несколько раз пыталась плавать, но..."
1004606-42 = "каждый раз, когда солёная вода попадает мне в глаза, уши и нос, я так пугаюсь..."
1004606-43 = "Солёная вода так жжётся..."
1004606-44 = "У-У-а-а... Господин! Мне надо было сказать вам раньше!"
1004606-45 = "Я всё избегала этого и заставила вас переживать!"
1004606-46 = "П-Простите, господин!"
1004606-47 = "[s] «Нет, всё нормально. Меня это совсем не волнует.»"
1004606-49 = "[ns] «Но мне интересно...»"
1004606-50 = "...А? Интересно что...?"
1004606-51 = "[s] «Почему ты скрывала, что не умеешь плавать?»"
1004606-52 = "Ой, это..."
1004606-53 = ""
1004606-55 = ""
1004606-56 = "Господин. Моя мечта — стать лучшей ниндзя в Кивотосе..."
1004606-57 = "Вы это уже знаете."
1004606-58 = "[s] «Да, и я буду тебя поддерживать.»"
1004606-59 = "Я мечтаю стать лучшей ниндзя, но если я даже плавать не умею..."
1004606-60 = "Ну... Видите ли..."
1004606-61 = "Наверное, я боялась вас разочаровать..."
1004606-62 = "[s3] «Понятно. Я бы никогда не разочаровался из-за такого.»\n[s4] «Кроме тебя есть много людей, которые не умеют плавать.»"
1004606-65 = "П-Правда...?"
1004606-66 = "Хи-хи... Хи-хи-хи... Какое облегчение..."
1004606-67 = "Раз вы так говорите, мне теперь намного лучше!"
1004606-68 = "О! Но после вашего сегодняшнего совета я кое-что решила!"
1004606-69 = "[s] «Решила...?»"
1004606-70 = "Да! Если я продолжу убегать от страшных и незнакомых вещей, ничего не изменится!"
1004606-71 = "А моя цель — стать лучшей ниндзя в Кивотосе!"
1004606-72 = ""
1004606-74 = ""
1004606-75 = "Чтобы добиться цели, мне нужно преодолеть страх воды!"
1004606-76 = "[s] «О... То есть ты хочешь сказать...?»"
1004606-77 = "Господин, подождите минутку!"
1004606-78 = "[s] «А?»"
1004606-79 = ""
1004606-81 = ""
1004606-85 = "Та-дам! Вот, я принесла это, господин!"
1004606-86 = ""
1004606-88 = ""
1004606-89 = "[ns] «Что это?»"
1004606-90 = "Я всё это время избегала этого, но..."
1004606-91 = "подозревала, что однажды такой день наступит..."
1004606-92 = "День, когда мне придётся сразиться с водой, чтобы преодолеть страх!"
1004606-93 = "[s] «Я горжусь твоей решимостью, но...»"
1004606-94 = "Это ниндзя-инструменты, которые я подготовила специально к этому дню!"
1004606-95 = "Господин, господин! Смотрите! Разве они не крутые?!"
1004606-96 = "Это ниндзя-обувь для хождения по воде!"
1004606-97 = ""
1004606-100 = "А ещё эта трубка!"
1004606-101 = "Это бамбуковая трубка, через которую ниндзя могут дышать под водой."
1004606-102 = "О! А это позволяет ниндзя быстро двигаться по воде..."
1004606-103 = "Это что-то вроде персонального электронного паруса, портативного автоматического пропеллерного мотора... ну, чего-то такого!"
1004606-104 = "[s] «Я не очень понял, но звучит впечатляюще!»"
1004606-106 = "Даже если я не умею плавать, я найду способ! Настоящий ниндзя способен преодолеть что угодно!"
1004606-107 = "Хорошо, господин! Я воспользуюсь этим и преодолею свой страх воды!"
1004606-109 = "Так началась отчаянная попытка Изуны победить океан."
1004606-111 = "Сначала попробую эту обувь для хождения по воде!"
1004606-112 = ""
1004606-113 = "Я справлюсь!"
1004606-114 = ""
1004606-116 = ""
1004606-120 = "[s] «Изуна! Ты в порядке?»"
1004606-122 = "Я-я..."
1004606-123 = "Я вообще не смогла встать на воду!"
1004606-124 = "Наверное, мне не хватает тренировок."
1004606-125 = "[s] «Может, такую обувь должны производить в „Миллениуме“...»"
1004606-126 = "У меня ещё много ниндзя-инструментов! Следующий!"
1004606-127 = "Попробую бамбуковую трубку, которая позволяет дышать под водой!"
1004606-128 = ""
1004606-130 = ""
1004606-131 = "Поехали!"
1004606-132 = ""
1004606-134 = ""
1004606-137 = "*бульк*"
1004606-138 = "[ns] «И-Изуна-а-а?!»"
1004606-140 = "Пфуа-а!"
1004606-141 = ""
1004606-144 = ""
1004606-145 = "Г-Господин!"
1004606-146 = "Под водой так трудно открыть глаза!"
1004606-147 = "Глаза так заболели, что я потеряла бамбуковую трубку..."
1004606-148 = "[s] «Изуна, нужно промыть тебе глаза!»"
1004606-149 = "Нет! Я не могу сдаться! Следующий инструмент!"
1004606-151 = "Изуна пробовала один инструмент за другим, пытаясь преодолеть страх."
1004606-152 = "У-У-а-а?! Господин?!"
1004606-153 = ""
1004606-157 = "К сожалению, все попытки закончились неудачей."
1004606-159 = "*всхлип* ...Мне не удалось победить воду с помощью ниндзя-инструментов..."
1004606-160 = "Господин... Я ниндзя, которая не может одолеть даже воду..."
1004606-161 = "Такими темпами я никогда не стану лучшей ниндзя в Кивотосе..."
1004606-162 = "[s] «Хорошо, Изуна. Может, теперь потренируемся плавать?»"
1004606-163 = "Хм?"
1004606-164 = "[s5] «Тебе не нужны инструменты или ниндзюцу. У тебя есть я.»\n[s6] «Я верю в тебя. Я научу тебя плавать.»"
1004606-167 = "Вы научите меня... плавать...?"
1004606-168 = "[s7] «Да! Я хорошо плаваю, можешь на меня положиться!»\n[s8] «Я не эксперт, но постараюсь изо всех сил!»"
1004606-171 = "Х-Хорошо..."
1004606-172 = "Я рассчитываю на вас, господин..."
1004606-174 = "Так мы начали обычный урок плавания, не имевший никакого отношения к ниндзюцу или тренировкам ниндзя."
1004606-176 = "Сначала я беру вас за руки... а потом опускаю голову под воду?"
1004606-177 = "[s] «Да, сначала тебе нужно просто привыкнуть находиться в воде.»"
1004606-178 = "Е-Если господин так говорит!"
1004606-180 = "Я возьму вас за руки и опущу голову под воду...!"
1004606-181 = "Опустить голову... под воду...!"
1004606-182 = "Ч-Что?! В-Взять вас за руки?!"
1004606-183 = "[s] «Да, что такое? Что-то беспокоит?»"
1004606-184 = "Н-Нет! Сейчас сделаю!"
1004606-185 = ""
1004606-190 = "[ns] «Ну как? Нормально?»"
1004606-191 = "Пфуа! К-Кажется, да..."
1004606-192 = "Но важнее... ваши руки... эм..."
1004606-193 = "[s] «А? О! Теперь тебе нужно привыкнуть работать ногами в воде.»"
1004606-194 = "Х-Хорошо!"
1004606-196 = "Тренировка Изуны по плаванию понемногу продолжалась."
1004606-197 = ""
1004606-201 = ""
1004606-202 = ""
1004606-204 = "Она крепко держала меня за руки, опускала голову в воду и работала ногами..."
1004606-205 = ""
1004606-208 = ""
1004606-209 = "Поднимала голову, чтобы вдохнуть, и так далее."
1004606-210 = ""
1004606-212 = ""
1004606-213 = ""
1004606-214 = ""
1004606-215 = ""
1004606-221 = "Обучение плаванию шло медленно."
1004606-223 = ""
1004606-224 = "[ns] «Теперь я буду поддерживать тебя, а ты попробуешь держаться на воде.»"
1004606-225 = ""
1004606-227 = ""
1004606-228 = "Г-Господин?! У-а-а?!"
1004606-229 = ""
1004606-231 = ""
1004606-232 = ""
1004606-235 = "[ns] «Изуна?! Ты потеряла равновесие и упала. Ты в порядке?!»"
1004606-236 = "*буль-буль* Я-я в порядке... Просто не ожидала... что вы вот так возьмёте меня за талию..."
1004606-237 = ""
1004606-243 = "[ns] «Уже поздно... На сегодня хватит.»"
1004606-244 = "*вздох* С-Спасибо за ваш труд, господин..."
1004606-245 = "[s] «Всю тяжёлую работу делала ты, Изуна. Тебе нужно отдохнуть.»"
1004606-246 = "Д-Да...!"
1004606-250 = "После урока плавания мы возвращались в общежитие."
1004606-251 = ""
1004606-253 = ""
1004606-254 = ""
1004606-255 = ""
1004606-256 = ""
1004606-257 = "Сегодняшняя тренировка по плаванию с вами..."
1004606-258 = "Я всё ещё чувствую ваши руки на своей талии..."
1004606-259 = ""
1004606-261 = ""
1004606-262 = "..."
1004606-263 = "[s] «Прости за сегодняшний день, Изуна.»"
1004606-264 = "Ч-Что...?"
1004606-265 = "[s9] «Ты, наверное, устала, потому что я навязал тебе урок плавания.»\n[s10] «На тебя не похоже так выматываться.»"
1004606-268 = "О, нет! Совсем нет, господин."
1004606-269 = "А? Я думала, что хорошо это скрываю..."
1004606-270 = "Вам неловко, потому что вы заставили меня делать то, что мне не нравится...?"
1004606-271 = "[s11] «Да. Поэтому пусть это будет наш последний урок плавания.»\n[s12] «Можешь тренироваться сама. Только если захочешь.»"
1004606-274 = "Господин, это значит..."
1004606-275 = "мы больше не будем вместе тренироваться плавать...?"
1004606-276 = "[s] «Солнце уже садится. Пойдём.»"
1004606-277 = "Нет! Нет! Я..."
1004606-278 = "Я совсем не этого хочу, господин!"
1004606-279 = "[s] «И-Изуна?!»"
1004606-280 = "Я чувствовала прямо противоположное тому, что вы сказали!"
1004606-281 = "Вместо давления или усталости...!"
1004606-282 = "Я... я...!"
1004606-287 = "― (Ч-Что это такое?[wa:620]"
1004606-289 = "― С тех пор как вы сказали, что научите меня плавать...)[wa:1520]"
1004606-292 = "― (Моё сердце...[wa:1660]"
1004606-294 = "― так сильно бьётся?!"
1004606-297 = "― (Когда вы раньше держали меня за руки...[wa:1550]"
1004606-299 = "― мои ладони были такими тёплыми...[wa:50]"
1004606-302 = "― И то место, которого вы коснулись...[wa:580]"
1004606-304 = "― почему-то тоже стало немного тёплым...)[wa:10]"
1004606-307 = "― Эм, господин. Насчёт того, что было раньше, эм...[wa:3700]"
1004606-309 = "― Мне было немного неловко, но...[wa:10]"
1004606-312 = "― Сегодня...[wa:60]"
1004606-314 = "― был таким весёлым и счастливым днём![wa:1600]"
1004606-317 = "― Так что, эм...[wa:790]"
1004606-319 = "― Как бы это сказать? Эм...![wa:190]"
1004606-322 = "― Если вы не против, я хотела спросить...[wa:3000]"
1004606-325 = "― Не могли бы вы..."
1004606-327 = "― научить меня плавать ещё раз?[wa:1520]"
1004606-330 = "[ns] «Когда захочешь. В любое время.»"
1004606-331 = "― Хи-хи-хи..."
1004606-333 = "― Хорошо. Спасибо![wa:900]"
1004606-336 = "― Я буду"
1004606-338 = "― рассчитывать на вас! Господин![wa:1880]"
1004606-341 = "Изуна широко улыбалась, вспоминая этот день."
1004606-342 = "По дороге на курорт мы неспешно шли по улице, любуясь закатом."
