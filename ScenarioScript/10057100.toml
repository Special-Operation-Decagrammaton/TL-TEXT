[translation]
10057100-1 = "Episode 10;In Search of a Friend"
10057100-6 = "Sensei. Please, don't let go of my hand."
10057100-7 = "[s] \"I'm holding on tight. Are you okay, Anna?\""
10057100-10 = "Yes. I'm holding on tight."
10057100-11 = "The blizzard is so thick I can't even see my own feet... #nSensei, please go back to No. 183 with Rana. I will bring Erina back."
10057100-12 = "I absolutely refuse!"
10057100-15 = "...I've never heard Rana say 'I refuse' before."
10057100-16 = "Friends are always together. So, I'm going too."
10057100-17 = "[s] \"Rana, 100 points!\""
10057100-18 = "Hehe, that's the first time I've gotten 100 points."
10057100-19 = "O-oh, I see. Ahaha..."
10057100-20 = "But I don't even know which direction Erina went... What should we do...?"
10057100-24 = "Anna?"
10057100-25 = "Shh. Listen for a second."
10057100-28 = "..."
10057100-30 = "(Cough...)"
10057100-31 = "...Someone is coughing."
10057100-33 = "(Cough, cough...)"
10057100-34 = "Sensei, it's this way! I'm going ahead!!"
10057100-39 = "Anna, let's go together!"
10057100-42 = "Erina!!"
10057100-43 = "Answer me!! Please!!!"
10057100-44 = "Whoa!!"
10057100-48 = "Ouch, a rock..."
10057100-51 = "Erina!!!"
10057100-52 = "..."
10057100-54 = "Erina..."
10057100-55 = "...I used up the fuel on purpose."
10057100-56 = "I had already decided that it would never be finished anyway. #nBecause... I came here after failing so miserably."
10057100-57 = "At first... I thought my failures were just bad luck."
10057100-58 = "And yet, even after coming here, it was nothing but failure..."
10057100-59 = "Before I knew it, failure had gone from a 'coincidence' to an 'inevitability' for me."
10057100-60 = "I bragged about being confident and capable of anything... but I knew the truth better than anyone."
10057100-61 = "That I am someone who 'fails at everything I do'."
10057100-63 = "..."
10057100-65 = "So I thought it would be better to just live comfortably every day without having any useless expectations."
10057100-66 = "Even if I saved the fuel, the tank was never going to run anyway."
10057100-69 = "..."
10057100-71 = "I was scared of seeing the tank break down in front of everyone."
10057100-72 = "I tried to tell myself it was in the past and it would be fine, but whenever I remembered it, my body would tremble."
10057100-73 = "If the tank were finished... this time, I wouldn't just be embarrassed in the Red Winter plaza, but in front of all of Kivotos..."
10057100-74 = "I was scared of building a tank again. #nErina seeing that poster and saying 'Let's build a tank'..."
10057100-75 = "If only she hadn't said that..."
10057100-78 = "You don't know anything!"
10057100-79 = "You don't know anything... yet you still believed in me, even when we fought every day."
10057100-80 = "...Of course that makes me happy. #nIf you're a scientist... no, anyone would feel that way."
10057100-81 = "All the despair I felt started to seem like nothing..."
10057100-82 = "Even though the painful memories never faded... before I knew it, I couldn't even run away anymore!"
10057100-84 = "Sensei..."
10057100-85 = "[s1] \"It's okay, Rana.\"\n[s2] \"Let's watch over them a little longer.\""
10057100-89 = "..."
10057100-91 = "When we couldn't make progress because we disagreed, I was secretly relieved."
10057100-92 = "Because I could just brush it off by saying, 'That's a shame, let's try harder next time.'"
10057100-93 = "I didn't want to take on new challenges; I just wanted to spend my time talking about my past glories."
10057100-94 = "...And then Sensei came along."
10057100-95 = "...I never thought a miracle would actually happen."
10057100-96 = "..."
10057100-97 = "Every time a bolt was tightened... every time a weld held together... I was terrified."
10057100-98 = "That the reality... the future where the tank breaks and I become a laughingstock, was surely approaching—"
10057100-99 = "I was anxious. To the point where I disgusted myself... it was truly the worst."
10057100-100 = "...Of course, it's not everyone's or Sensei's fault."
10057100-101 = "I was afraid of a big failure, so I made small mistakes... It's Niki Anna's fault."
10057100-102 = "Hey, Erina..."
10057100-107 = "...I'm sorry for running away."
10057100-108 = "I'm sorry I couldn't honestly say I was scared."
10057100-109 = "I'm sorry for ruining everything because of that."
10057100-110 = "Everything... I'm sorry for everything..."
10057100-112 = "..."
10057100-113 = "Um, Erina..."
10057100-118 = "Waaaaah!!!"
10057100-119 = "H-huh!?"
10057100-123 = "Idiot! You idiot!! You idiot~!!!"
10057100-124 = "Anna, you're so annoying! *Cough*, you've been the worst since the day we met!"
10057100-125 = "What do you mean 'you don't know anything'!? *Cough*!"
10057100-126 = "Do you think you're the only one who fails!?"
10057100-127 = "If you fail, just brush it off as 'bad luck'! #nIf you're going to act arrogant, stay arrogant until the end! Why don't you have any confidence!?"
10057100-128 = "Anna, you should be proud of yourself! I don't care about some tiny medal!!"
10057100-129 = "I never understood that part, and I hated it from the start! #nIf you're not going to change, I'm going to hate it forever!"
10057100-130 = "Anna is... the class president who brags whenever she gets the chance, and my friend, right? #nEven if you deny it, that doesn't change the fact that we're friends."
10057100-131 = "I want you to be confident because you're the class president, and I want you to cheer up because you're my friend!"
10057100-135 = "So that's how it was... and yet, I..."
10057100-139 = "When I asked you to build a tank... you said 'let's do it,' and I was so happy."
10057100-140 = "I wanted us to succeed together and look cool, and tell my past failures to 'eat dirt'!"
10057100-141 = "I thought Anna felt the same way! But... even so...!! *Sniffle*"
10057100-142 = "Ugh, uuu..."
10057100-143 = "*Cough*... I was the closest person to Anna, and I didn't understand at all..."
10057100-144 = "I never imagined you felt like building the tank was a burden... #nI thought if I pushed you, you'd get motivated and do it..."
10057100-145 = "Because... that's the kind of person I am..."
10057100-146 = "I, I'm the one who... I'm sorry, I'm so sorry..."
10057100-148 = "Waaaaaaaah!!!"
10057100-150 = "I'm sorry!!!"
10057100-151 = "I'm sorry too!!!"
10057100-152 = "Erina..."
10057100-153 = "Waaaaah... d-don't come over... *hic*, *hic*... *hic*—"
10057100-155 = "Achoo!!!"
10057100-157 = "Geez!! You got it in my eyes again!"
10057100-158 = "I told you not to come over because I'd sneeze! Waaaaah!"
10057100-165 = "[ns3] \"The blizzard has finally died down...\"\n[ns4] \"Is everyone okay?\""
10057100-168 = "Yes, Sensei. I'm sorry. You came all this way, and we've only caused you trouble..."
10057100-169 = "I'm sorry too, Rana. We all worked so hard, and I ruined everything."
10057100-170 = "Don't worry about it. We can just go out again."
10057100-171 = "From now on, if you have any worries, don't hide them! And next time, we'll definitely all participate together!"
10057100-172 = "Waaaaah! I swear it on the First-Class Beard Medal!"
10057100-173 = "There you go with the medals again! Waaaaah!"
10057100-177 = "Sneezing... tears... interaction."
10057100-181 = "Rana?"
10057100-182 = "I'm sorry you worked so hard. Let's go back and rest."
10057100-184 = "..."
10057100-185 = "We're not resting."
10057100-189 = "Rana, we can't participate anymore. There's not a single drop of fuel left..."
10057100-190 = "Even if there were, it would take too long to go back up the mountain path and come back down."
10057100-191 = "We won't make it in time."
10057100-193 = "...3, 5. 3, 1..."
10057100-194 = "How many tons is the Puppy? Excluding the fuel weight."
10057100-196 = "Um, in its current state... about 10.1 tons."
10057100-198 = "What about the initial velocity and kinetic energy upon firing?"
10057100-200 = "Initial velocity is 680 meters per second, the shell is 6.1 kilograms, so about 1.53 megajoules."
10057100-201 = "What does that have to do with anything? And what's with that branch?"
10057100-203 = "A battery-free calculator."
10057100-206 = "...Hmm. It's fine after all."
10057100-210 = "Everyone, board the vehicle!"