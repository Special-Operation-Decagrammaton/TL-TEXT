[translation]
10057100-1 = "Episode 10;Searching for a Friend"
10057100-6 = "Sensei. Please, do not let go of my hand."
10057100-7 = "[s] \"I am holding on tight. Are you okay, Anna?\""
10057100-10 = "Yes. I am holding on tight."
10057100-11 = "The blizzard is so thick I cannot even see my own feet... Sensei, please take Lana back to No. 183. I will bring Elina back myself."
10057100-12 = "I absolutely refuse!"
10057100-15 = "...This is the first time I have ever heard Lana say she refuses something."
10057100-16 = "Friends are always together. That is why I am going too."
10057100-17 = "[s] \"Lana, 100 points!\""
10057100-18 = "Hehe, that is the first time I have ever received 100 points."
10057100-19 = "R-right. Ahaha..."
10057100-20 = "But I do not even know which direction Elina went... What should we do..."
10057100-24 = "Anna?"
10057100-25 = "Shh. Listen for a moment."
10057100-28 = "..."
10057100-30 = "(Cough...)"
10057100-31 = "...Someone is coughing."
10057100-33 = "(Cough, cough...)"
10057100-34 = "Sensei, this way! I am going ahead!!"
10057100-39 = "Anna, let us go together!"
10057100-42 = "Elina!!"
10057100-43 = "Answer me!! Please!!!"
10057100-44 = "Whoa!!"
10057100-48 = "Ouch, that rock..."
10057100-51 = "Elina!!!"
10057100-52 = "..."
10057100-54 = "Elina..."
10057100-55 = "...I used up the fuel on purpose."
10057100-56 = "I had already decided that it would never be finished anyway. #nBecause... I came here after failing so miserably."
10057100-57 = "At first... I thought I was just failing because I had bad luck."
10057100-58 = "And yet, even after coming here, I only kept failing..."
10057100-59 = "Before I knew it, failure had gone from a 'coincidence' to an 'inevitability' for me."
10057100-60 = "I bragged about being confident and capable of anything, but... I knew the truth better than anyone."
10057100-61 = "That I am someone who 'fails at everything I do'."
10057100-63 = "..."
10057100-65 = "So I thought it would be better not to have any useless expectations and just spend my days in warmth."
10057100-66 = "Even if I saved the fuel, the tank was never going to run anyway."
10057100-69 = "..."
10057100-71 = "I was afraid of seeing the tank break down in front of everyone."
10057100-72 = "I tried to tell myself it was in the past and it would be fine, but whenever I remembered it, my body would tremble."
10057100-73 = "If the tank were finished... I would end up embarrassing myself not just in the Red Winter plaza, #nbut in front of all of Kivotos..."
10057100-74 = "I was afraid of building a tank again. #nElina seeing that poster and saying 'Let us build a tank'..."
10057100-75 = "If only she had not said that..."
10057100-78 = "You do not know anything!"
10057100-79 = "You do not know anything... yet you still trusted me, even though we fought every single day."
10057100-80 = "...Of course that makes me happy. #nIf you are a scientist... no, anyone would feel that way."
10057100-81 = "All the despair I felt started to seem like nothing at all..."
10057100-82 = "Even though the painful memories never faded... before I knew it, I could not even run away anymore!"
10057100-84 = "Sensei..."
10057100-85 = "[s1] \"It is okay, Lana.\"\n[s2] \"Let us watch over them a little longer.\""
10057100-89 = "..."
10057100-91 = "When we could not agree and the work stalled, I was secretly relieved."
10057100-92 = "Because I could just brush it off by saying, 'That is a shame, let us try harder next time.'"
10057100-93 = "I wanted to avoid new challenges and just spend my time bragging about the past."
10057100-94 = "...And then Sensei arrived."
10057100-95 = "...I never thought a miracle would actually happen."
10057100-96 = "..."
10057100-97 = "Every time a bolt was tightened... every time the welding held together... I was terrified."
10057100-98 = "That the reality... the future where the tank breaks and I become a laughingstock, was surely approaching—"
10057100-99 = "I was anxious. To the point where I am disgusted with myself... truly, it is the worst."
10057100-100 = "...Of course, it is not the fault of everyone else or Sensei."
10057100-101 = "I was afraid of a big failure, so I made small mistakes... It is Niki Anna's fault."
10057100-102 = "Hey, Elina..."
10057100-107 = "...I am sorry for running away."
10057100-108 = "I am sorry I could not be honest and say I was scared."
10057100-109 = "I am sorry for ruining everything because of that."
10057100-110 = "Everything... I am sorry for everything..."
10057100-112 = "..."
10057100-113 = "Um, Elina..."
10057100-118 = "Waaaaah!!!"
10057100-119 = "H-huh!?"
10057100-123 = "You idiot! You idiot!! You idiot~!!!"
10057100-124 = "Anna, you are so annoying! *Cough*, you have been the worst since the day we met!"
10057100-125 = "What do you mean 'you do not know anything'!? *Cough*!"
10057100-126 = "Do you think you are the only one who has ever failed!?"
10057100-127 = "If you fail, you can just brush it off as 'bad luck'! #nIf you are going to act arrogant, stay arrogant until the very end! Why do you not have any confidence!?"
10057100-128 = "Anna, you should be proud of yourself! I do not care about some tiny medal!!"
10057100-129 = "I never understood that part of you, and I hated it from the start! #nIf you are not going to change, I am going to hate it forever!"
10057100-130 = "Anna is... the class president who brags whenever she gets the chance, and my friend, right? #nEven if you deny it, that does not change the fact that we are friends."
10057100-131 = "I want you to be confident because you are the class president, and I want you to cheer up because you are my friend!"
10057100-135 = "So that was it... and yet, I..."
10057100-139 = "When I asked you to build a tank... you said 'let us do it,' and I was so happy."
10057100-140 = "I wanted us to succeed together and look cool, and tell my past failures to 'eat your heart out'!"
10057100-141 = "I thought Anna felt the same way! And yet... and yet...!! *Sniffle*"
10057100-142 = "Ugh, ugh..."
10057100-143 = "*Cough*... I was the closest person to Anna, and I did not understand at all..."
10057100-144 = "I never imagined you felt like building the tank was a burden... #nI thought if I provoked you, you would get fired up and do it..."
10057100-145 = "Because I am... that kind of person..."
10057100-146 = "I-I am the one who... I am sorry, I am so sorry..."
10057100-148 = "Waaaaaaaah!!!"
10057100-150 = "I am sorry!!!"
10057100-151 = "I am sorry too!!!"
10057100-152 = "Elina..."
10057100-153 = "Waaaaah... d-do not come over here... *hic*, *hic*... *hic*—"
10057100-155 = "Achoo!!!"
10057100-157 = "Geez!! You got it in my eyes again!"
10057100-158 = "I told you not to come over because I would sneeze! Waaaaah!"
10057100-165 = "[ns3] \"The blizzard has finally calmed down...\"\n[ns4] \"Is everyone okay?\""
10057100-168 = "Yes, Sensei. I am sorry. You came all this way, and we have only caused you trouble..."
10057100-169 = "I am sorry too, Lana. We all worked so hard, and I ruined everything."
10057100-170 = "Do not worry about it. We can just go out again."
10057100-171 = "From now on, if you have any worries, do not hide them! And next time, we are definitely all going to participate together!"
10057100-172 = "Waaaaah! I swear it on the First-Class Beard Medal!"
10057100-173 = "There you go with the medals again! Waaaaah!"
10057100-177 = "Sneezing... tears... interaction."
10057100-181 = "Lana?"
10057100-182 = "I am sorry you worked so hard. Let us go back and rest."
10057100-184 = "..."
10057100-185 = "We are not resting."
10057100-189 = "Lana, we cannot participate anymore. We do not have a single drop of fuel left..."
10057100-190 = "Even if we did, it would take too long to go back up the mountain path and come back down."
10057100-191 = "It is too late now."
10057100-193 = "...3, 5. 3, 1..."
10057100-194 = "How many tons is the Puppy? Excluding the fuel weight."
10057100-196 = "Um, in its current state... about 10.1 tons."
10057100-198 = "What about the initial velocity and kinetic energy upon firing?"
10057100-200 = "Initial velocity is 680 meters per second, the shell is 6.1 kilograms, so about 1.53 megajoules."
10057100-201 = "What does that have to do with anything? And what is that branch for?"
10057100-203 = "A battery-free calculator."
10057100-206 = "...Hmm. It is fine after all."
10057100-210 = "Everyone, board the vehicle!"
