[translation]
10057100-1 = "Episode 10; In Search of a Friend"
10057100-6 = "Sensei. Please, don't let go of our hands."
10057100-7 = "[s] \"I'm holding on tight. Anna, are you alright?\""
10057100-10 = "Yeah. I've got a firm grip."
10057100-11 = "The blizzard is so thick that I can't even see my own feet... #nSensei, could you take Rana with you back to 183? I'll go bring Erina back by#nmyself."
10057100-12 = "I unconditionally refuse!"
10057100-15 = "...This is the first time I've ever heard Rana refuse anything."
10057100-16 = "Friends should always stick together. For that reason, I'm coming with you."
10057100-17 = "[s] \"100 points to Rana!\""
10057100-18 = "Heheh. This is the first time I've ever received 100 points."
10057100-19 = "Y-you're right. Ahaha..."
10057100-20 = "But as it stands, we have no idea which way Erina even went... How do we find#nher...?"
10057100-24 = "Anna?"
10057100-25 = "Shh. Listen closely."
10057100-28 = "..."
10057100-30 = "（Cough...）"
10057100-31 = "...There's someone coughing."
10057100-33 = "（Cough, cough...）"
10057100-34 = "Sensei, this way! I'm going on ahead first!"
10057100-39 = "Anna, I'm coming with you!"
10057100-42 = "Erinaaa!!"
10057100-43 = "Give me a sign!! Please!!"
10057100-44 = "Whoa!!"
10057100-48 = "Oww, I hit a rock..."
10057100-51 = "ERINA!!"
10057100-52 = "..."
10057100-54 = "Erina..."
10057100-55 = "...I used up all of the fuel on purpose."
10057100-56 = "I already accepted that we would never finish making the tank. #nAfter all... The reason I landed here was because of a catastrophic failure."
10057100-57 = "At first... I thought that my failure was simply due to bad luck."
10057100-58 = "And yet, I've experienced nothing but failures ever since I came here..."
10057100-59 = "At some point, I began to think of my failures not as coincidence, but as#ninevitabilities."
10057100-60 = "I've always run my mouth confidently, like I could do anything and everything...#nBut I knew better that anyone else."
10057100-61 = "As I am right now, it feels like everything I do will end in failure."
10057100-63 = "..."
10057100-65 = "That's why I tried not to set any pointless expectations. I figured it would be#nenough to simply stay warm, day to day."
10057100-66 = "If the tank wasn't going to move anyway, I decided there was no point in saving#nthe fuel."
10057100-69 = "..."
10057100-71 = "The thought of the tank breaking down with all those people watching was#nterrifying."
10057100-72 = "I told myself that it was all in the past and that everything's all right now, and yet I tremble in fear everytime I remember."
10057100-73 = "And this time, if the tank broke down... it'll be seen by more than just the students at Red Winter's plaza... We'd be humiliated in front of the entirety of Kivotos..."
10057100-74 = "I was afraid to make another tank. #nSo when you saw the poster and said, \"Let's make a tank\"..."
10057100-75 = "I wished I never said what I did..."
10057100-78 = "But you didn't know anything!"
10057100-79 = "You didn't know anything... and yet, even as we fought day by day, you still#nbelieved in me."
10057100-80 = "...Obviously, I was happy. #nWhat kind of scientist... No, what kind of person wouldn't be?"
10057100-81 = "All of my despair suddenly felt trivial..."
10057100-82 = "But those painful memories never disappeared... and before I knew it, I'd trapped myself between a rock and a hard place!"
10057100-84 = "Sensei..."
10057100-85 = "[s1] \"It's okay, Rana.\"\n[s2] \"Let's keep watching them a little longer.\""
10057100-89 = "..."
10057100-91 = "Whenever work grinded to a halt because we couldn't come to a consensus, deep down I felt relieved."
10057100-92 = "At least then, I could've laughed it off. #n\"It's too bad we couldn't finish it this time. Let's try our best next time.\""
10057100-93 = "I wanted to live in the glory of my past without ever taking on any new challenges."
10057100-94 = "...And then came Sensei."
10057100-95 = "...I really didn't think that sensei could pull off a miracle."
10057100-96 = "..."
10057100-97 = "With every bolt tightened... With every weld done perfectly... I felt scared."
10057100-98 = "I was anxious... The thought that we were drawing closer and closer to a future#nwhere our tank breaks down and we become a laughinstock—"
10057100-99 = "I was scared of that reality. Even I can't help but to feel disgusted at myself...#nI really am the worst."
10057100-100 = "...Of course, none of it was the fault of anyone else—not yours, nor Sensei's."
10057100-101 = "The one to blame is the one who was so scared of a catastrophic failure that she#nmade a stupid little mistake... Everything was Niki Anna's fault."
10057100-102 = "Hey, Erina..."
10057100-107 = "...I'm sorry I ran away."
10057100-108 = "I'm sorry I couldn't honestly tell you that I was scared."
10057100-109 = "And, I'm sorry for ruining everything."
10057100-110 = "I'm sorry... I'm sorry for everything..."
10057100-112 = "..."
10057100-113 = "Um, Erina..."
10057100-118 = "BWEEEEEGH!!!"
10057100-119 = "H-huhh!?"
10057100-123 = "You idiot! You stuupid idiooot!!"
10057100-124 = "Seriously, Anna, you piss me off! *Cough* Ever since#nwe met, I've always HAAATED that part of you!"
10057100-125 = "I don't know anything!? *Cough*"
10057100-126 = "Do you think you're the only one who ever fails!?"
10057100-127 = "If you fail, then just wave it off as bad luck! #nIf you're gonna act tough, then KEEP acting tough! Why do you have no#nconfidence in yourself!?"
10057100-128 = "What you should be proud of most is YOURSELF! I don't care at all about your#nfancy-schmancy medals!"
10057100-129 = "I've never understood this part about you! I've hated it from the start! #nIf you don't fix that part of you, I'm ACTUALLY gonna hate you forever!"
10057100-130 = "Anna... You're someone who takes every opportunity they can get to brag about#nthemself, you're our class president, and, you're my FRIEND. We can deny it all we want, but we are that—friends."
10057100-131 = "As our class president, I want you to stand with your head held high—and as my#nfriend, I wish all the best of you!"
10057100-135 = "Is that... how it was...? But, in the end, I..."
10057100-139 = "When I said we should make a tank... I was super happy that you agreed."
10057100-140 = "I wanted us to achieve a smashing success and give our past failures a big \"in your#nface!\""
10057100-141 = "I thought you had the same thoughts as me! But... BUT...! *Sniffle*"
10057100-142 = "Urk... Ugh..."
10057100-143 = "Cough... Even though I was the closest person to you, I knew nothing at all..."
10057100-144 = "It never even crossed my mind that building a tank would weigh so heavily on your#nmind... I thought I could get you fired up and make you lock in..."
10057100-145 = "'Cause... That's just the kinda person I am..."
10057100-146 = "I-I'm... I'm sorry... I'm sorry toooooo..."
10057100-148 = "UWAAAAAN!!"
10057100-150 = "I'M SO SORRYYYY!!"
10057100-151 = "I'M SORRY TOOOO!!"
10057100-152 = "Erinaaaa..."
10057100-153 = "Uwaaaan... S-stay away... A... A... Atch—"
10057100-155 = "ATCHOOOO!!"
10057100-157 = "Gyaah!! Not in the eye again!"
10057100-158 = "I told you to stay away 'cause I was gonna sneeeze! Uweeeeh!"
10057100-165 = "[ns3] \"Perfect time for the blizzard to die down...\"\n[ns4] \"Is everyone alright?\""
10057100-168 = "Yeah. Sorry, Sensei. Even though you came all the way our here, I've caused you#nnothing but trouble."
10057100-169 = "You too, Rana. I'm sorry. Even though you all worked so hard, I ended up ruining#neverything."
10057100-170 = "No biggie. We can always try again."
10057100-171 = "From now on, if you've got something on your mind, don't hide it! Tell us!#nAnd, we're definitely participating next time together! For sure!"
10057100-172 = "Uwaaah! Upon my First-Class Mustache Medal, I swear!"
10057100-173 = "Again with the medals! Not the medals! Uweeeeh!"
10057100-177 = "Sneezing... Tears... Interaction."
10057100-181 = "Rana?"
10057100-182 = "Sorry we ended up wasting your hard work. Let's go back and rest."
10057100-184 = "..."
10057100-185 = "It's not time to rest yet though."
10057100-189 = "Rana, we can't participate. We don't even have a single drop of fuel left..."
10057100-190 = "Even if we did, we still gotta get back on the trail and then get down again."
10057100-191 = "We don't have enough time for that."
10057100-193 = "...3, 5. 3, 1."
10057100-194 = "How many tons is Puppy? Excluding the mass of the fuel."
10057100-196 = "Uhh, in its current state... about 10.1 tons."
10057100-198 = "What's the muzzle velocity and kinetic energy of the shells?"
10057100-200 = "The muzzle velocity is 680 meters per second. The shell is 6.1 kg, which means#nabout 1.53 megajoules."
10057100-201 = "What's up? And what's with the stick?"
10057100-203 = "It's a battery-less calculator."
10057100-206 = "...Hm. As I thought, it should work."
10057100-210 = "Everyone, get on the tank!"