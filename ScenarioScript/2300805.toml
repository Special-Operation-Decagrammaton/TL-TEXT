[translation]
2300805-1 = "Тело всё помнит"
2300805-2 = "(Я забеспокоился и решил навестить Мари в её комнате.)"
2300805-3 = ""
2300805-6 = "Кто там?"
2300805-7 = "[s1] «Я пришёл тебя навестить.»\n[s2] «Я не мешаю тебе отдыхать?»"
2300805-10 = "...?!"
2300805-11 = "С-Сенсей?! Что вы здесь делаете?!"
2300805-12 = "П-Подождите секундочку! Пожалуйста, дайте мне минуту."
2300805-13 = ""
2300805-20 = "П-Пожалуйста, входите, Сенсей."
2300805-21 = "Простите. Я ещё не успела прибраться в комнате..."
2300805-22 = "Вы не против?"
2300805-23 = "Н-Но..."
2300805-24 = "Что? Вы хотите, чтобы я осталась в постели и отдыхала? Н-Но вы уже здесь, Сенсей. Как же я могу?!"
2300805-25 = "[s3] «Если ты не будешь отдыхать, тогда мой визит теряет смысл.»\n[s4] «Разве болезнь не должна быть сейчас важнее всего?»"
2300805-26 = "Ну..."
2300805-27 = "Ну..."
2300805-28 = "Я-Я понимаю. Вы проделали такой путь, так что я не должна усложнять вам жизнь."
2300805-29 = "Тогда, как вы и просили..."
2300805-30 = ""
2300805-32 = ""
2300805-33 = ""
2300805-34 = "(Мари вернулась в кровать и легла, укрывшись одеялом.)"
2300805-35 = "Надеюсь, вы не слишком переживали. Это всего лишь лёгкое недомогание."
2300805-36 = "[s] «Как себя чувствуешь?»"
2300805-37 = "Ахаха... Всё-таки заставила вас волноваться. Простите."
2300805-38 = "Теперь, после отдыха, мне намного лучше. Завтра я вернусь к своим обязанностям."
2300805-39 = "Немного странно, что такая сестра, как я, сама получает поддержку. Ведь обычно поддерживать других должна я."
2300805-40 = "Аха... ха..."
2300805-41 = "..."
2300805-42 = ""
2300805-45 = ""
2300805-46 = "[ns5] «...Мари?»\n[ns6] «Ты хочешь мне что-то сказать?»"
2300805-49 = "Ну... Эм..."
2300805-50 = "Честно говоря..."
2300805-51 = "В последнее время я немного уставала от работы... и подумала, что было бы неплохо взять выходной."
2300805-52 = "Мне кажется, моё нынешнее состояние... возможно, связано именно с этим желанием."
2300805-53 = "Остальные сёстры тоже усердно работают, так что, может быть, я просто капризничаю."
2300805-54 = "Неужели моё тело наказывает меня за то, что я позволила себе мысли, недостойные сестры?"
2300805-55 = "А?"
2300805-56 = "Вы думаете, это не наказание, а помощь? От моего собственного тела?"
2300805-57 = "Эм, я не совсем понимаю. Какая же это помощь?"
2300805-58 = "[s7] «Потому что тебе лучше быть здоровой.»\n[s8] «Чтобы ты могла и дальше исполнять обязанности сестры.»"
2300805-61 = ""
2300805-63 = ""
2300805-64 = "...?"
2300805-65 = "..."
2300805-66 = "Хи-хи. Я понимаю, что вы имели в виду. Наверное, и на это можно посмотреть так."
2300805-67 = ""
2300805-69 = ""
2300805-70 = ""
2300805-72 = "Спасибо, Сенсей. Благодаря вам я почему-то чувствую себя посвежевшей."
2300805-73 = "Не только телом... но и духом."
2300805-74 = "Даже отдыхая, я не могла избавиться от чувства вины, а вы так легко помогли мне с ним справиться."
2300805-75 = "Вы действительно умеете успокаивать меня, Сенсей. Мне стоит у вас поучиться."
2300805-76 = "Если когда-нибудь представится возможность и если вы не будете против, Сенсей, тогда..."
2300805-77 = "Хм?"
2300805-78 = "О. Я, конечно, не имела в виду сегодня."
2300805-79 = "Как вы и сказали, сегодня мне нужно думать только об отдыхе."
2300805-80 = "Но завтра и потом..."
2300805-81 = "Я буду ждать этого."
2300805-83 = "(После этого я остался с Мари, составляя ей компанию и ухаживая за ней, пока она отдыхала.)"
2300805-84 = "(Убедившись, что Мари действительно уснула, я вернулся в Шале.)"
