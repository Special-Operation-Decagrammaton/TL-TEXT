[translation]
34190-1 = "Episódio 19;Possibilidades Infinitas"
34190-3 = "Sensei... Você não ia salvar a Princesa...?"
34190-4 = "[s] \"Claro que vou. Junto com você, Saori.\""
34190-5 = "...!!"
34190-10 = "Foi mal, Líder... Tentei convencê-la, mas não consegui impedi-la."
34190-11 = "Líder... Que bom que você está a salvo... Quer dizer, não muito a salvo, né?#nE-Enfim, ainda bem..."
34190-13 = "Misaki... Hiyori..."
34190-14 = "[ns] \"Então você lutou contra a Saori, Mika.\""
34190-17 = "Se-Sensei... Hum..."
34190-18 = "[s] \"Me desculpe, Mika.\""
34190-19 = "Se-Sensei...?!"
34190-20 = "[s1] \"Eu deveria ter explicado tudo direitinho para você, mas falhei nisso.\"\n[s2] \"Eu deveria ter sentado frente a frente com você e conversado de verdade...\""
34190-21 = "P-Por que você está me pedindo desculpas, Sensei...?"
34190-22 = "P-Por que você está me pedindo desculpas, Sensei...?"
34190-23 = "Você não fez nada de errado, Sensei... A culpada sou eu, não é?!#nMesmo assim, por quê...?"
34190-24 = "[s] \"A vida de uma aluna está em jogo, por isso estou ajudando a Saori.\""
34190-25 = "..."
34190-26 = "[s] \"Por isso... assim que salvarmos a Atsuko, vamos voltar juntos para Trinity.\""
34190-27 = "...!!"
34190-28 = "P-Por quê...?"
34190-29 = "...Mesmo se fizermos isso, nada vai mudar..."
34190-30 = "A minha... expulsão já está decidida... e a Seia-chan também, por minha causa..."
34190-31 = "[s] \"Eu vou te ajudar.\""
34190-32 = "...!!"
34190-33 = "[s3] \"O que você está enfrentando, a sua situação, o que você desejava...\"\n[s4] \"Eu sei que tipo de garota você é, Mika.\""
34190-34 = "Ahaha... O que você está dizendo, Sensei?"
34190-35 = "Ahaha... O que você está dizendo, Sensei?"
34190-36 = "Você sabe que tipo de garota eu sou...?#n— O que você sabe sobre mim?"
34190-37 = "Eu sou... uma \"bruxa\"."
34190-38 = "Você não está confundindo as coisas?#nSensei, você está mesmo olhando para mim? Para o que me tornei — para os pecados que cometi."
34190-39 = "[ns] \"É verdade — você é uma garota má, Mika.\""
34190-41 = "[ns5] \"Você engana os outros e mente para si mesma.\"\n[ns6] \"Machuca os outros e fere a si mesma.\""
34190-44 = "[ns7] \"E mesmo depois de fazer tudo isso,\"\n[ns8] \"não consegue aceitar as consequências e acaba chorando — é esse tipo de garota que você é.\""
34190-47 = "[ns9] \"Mas você também tem a gentileza de tentar estender a mão para a reconciliação,\"\n[ns10] \"e é uma criança instável que se machuca por medo de ser odiada.\""
34190-50 = "[ns11] \"Você não é uma bruxa, Mika.\"\n[ns12] \"Você é só uma aluna rebelde que não escuta o que os outros dizem.\""
34190-53 = "[ns] \"Por isso — quero que você me deixe te ouvir direito.\""
34190-54 = "..."
34190-55 = "Por quê...?"
34190-56 = "Seria muito melhor se você tivesse apenas seguido em frente sem olhar para trás...#nPor que você me faz sofrer assim...?"
34190-57 = "Desse jeito... até o fim..."
34190-58 = "Você vai mesmo me fazer acreditar que ainda tenho uma chance...?"
34190-59 = "[s] \"Pode ficar tranquila, você tem sim.\""
34190-60 = "...?"
34190-61 = "[s] \"Porque, se não houver uma chance, basta criarmos uma.\""
34190-62 = "...I-Isso é um absurdo."
34190-63 = "[ns] \"E se mesmo assim não der certo, é só criarmos a próxima chance.\""
34190-65 = "[ns] \"Mesmo que a gente falhe, quantas vezes for preciso.\""
34190-67 = "[ns] \"Enquanto o caminho continuar, podemos criar quantas chances forem necessárias.\""
34190-69 = "[ns13] \"Mika, Saori...\"\n[ns14] \"O caminho de vocês nunca vai se fechar por causa de um ou dois erros.\""
34190-72 = "[ns] \"— Porque no futuro que segue daqui em diante,\""
34190-74 = "[ns] \"existem possibilidades infinitas.\""
34190-75 = "..."
34190-76 = "..."
34190-77 = "[ns15] \"Se dizem que não há mais chance, eu mesmo criarei quantas forem precisas.\"\n[ns16] \"— Uma aluna jamais deveria desistir do próprio futuro.\"\n[ns17] \"Deixem esse tipo de coisa com os adultos.\""
34190-81 = "Já chega dessas asneiras!"
34190-85 = "Como ousa proferir tamanhos disparates dentro da minha Basílica?"
34190-86 = "[s] \"Beatrice...!\""
34190-87 = "Isso já perdeu a graça. Vamos encerrar este espetáculo por aqui."
34190-88 = "— Acharam mesmo que eu não sabia onde vocês estavam?#nNão, eu estava apenas observando."
34190-89 = "Vamos dar um fim a essa distração enfadonha.#nAgora, farei questão de enfrentá-los com todo o meu poder."
34190-90 = "— Vamos dar início ao ritual."
34190-92 = "A-Atsuko...!!"
34190-93 = "N-Não pode ser... Ainda tínhamos tempo..."
34190-94 = "O-O sol ainda nem nasceu..."
34190-96 = "O que vocês estão entendendo errado?"
34190-97 = "Acharam mesmo que eu esperaria até o nascer do sol?#nNão, a brincadeira acabou. O halo do Sangue Real será destruído a qualquer instante."
34190-98 = "E então — através dos fragmentos desse mistério, eu ascenderei a uma existência superior."
34190-99 = "P-Pare!! ...Princesa!! Atsuko!!"
34190-100 = "..."
34190-104 = "Pois bem, vamos baixar as cortinas."
34190-114 = "Venha, Santa Barbara de Justina."
34190-115 = "Cale a boca desse Sensei que só sabe falar asneiras!!"
