[translation]
34190-1 = "Эпизод 19;Бесконечные шансы"
34190-2 = ""
34190-3 = "Сенсей?! Я думала, вы пошли спасать Химэ!"
34190-4 = "[s] «И спасу. Вместе с тобой, Саори.»"
34190-5 = "...!"
34190-6 = ""
34190-8 = ""
34190-9 = ""
34190-10 = "Сенсей удивительно упрямый..."
34190-11 = "Слава богу, вы в порядке, лидер... То есть... относительно. Ну, по крайней мере живы."
34190-13 = "Мисаки... Хиёри..."
34190-14 = "[ns] «Ты серьёзно ранила Саори, Мика.»"
34190-15 = ""
34190-16 = ""
34190-17 = "Я... Ну..."
34190-18 = "[s] «И мне жаль, что всё так вышло, Мика!»"
34190-19 = "Сенсей...?!"
34190-20 = "[s1] «Мне следовало лучше всё тебе объяснить.»\n[s2] «Нужно было сказать тебе всё лично.»"
34190-21 = "Не понимаю. Что вы имеете в виду?"
34190-22 = "Не понимаю. Что вы имеете в виду?"
34190-23 = "Не надо, Сенсей... Это всё моя вина."
34190-24 = "[s] «Нет. Прости, что я тебя оставил. Мне нужно было помочь Саори и Ацуко.»"
34190-25 = "...."
34190-26 = "[s] «Мы спасём Ацуко, а потом вместе вернёмся в Тринити.»"
34190-27 = "...!"
34190-28 = "Я-я..."
34190-29 = "Какой смысл?"
34190-30 = "Меня всё равно исключат... и даже... Сэя, из-за меня."
34190-31 = "[s] «Не переживай ни о чём этом.»"
34190-32 = "...!"
34190-33 = "[s3] «Я верю в ту девушку, которую впервые встретил у бассейна.»\n[s4] «Я знаю, какой ты человек, Мика.»"
34190-34 = "Ха-ха-ха. Сенсей, вы невозможны."
34190-35 = "Ха-ха-ха. Сенсей, вы невозможны."
34190-36 = "Вы думаете, я хороший человек? Хороший маленький студент?"
34190-37 = "Я... ведьма."
34190-38 = "Вы не можете быть настолько слепы, Сенсей. Вы же видите кровь на моих руках."
34190-39 = "[ns] «Ты права, Мика. Ты плохо себя вела.»"
34190-40 = ""
34190-41 = "[ns5] «Ты лгала другим и самой себе.»\n[ns6] «Ты причиняла боль другим и себе.»"
34190-42 = ""
34190-43 = ""
34190-44 = "[ns7] «Ты никогда не знаешь, что делать с собой.»\n[ns8] «И плачешь каждый раз, когда всё идёт не так.»"
34190-47 = "[ns9] «Но именно доброе сердце заставило тебя протянуть руку Ариусу.»\n[ns10] «Но ты всем сердцем любишь людей вокруг себя.»"
34190-48 = ""
34190-49 = ""
34190-50 = "[ns11] «Ты не ведьма. Ты мой студент.»\n[ns12] «Ты просто упрямая и проблемный студент.»"
34190-51 = ""
34190-52 = ""
34190-53 = "[ns] «Я пришёл сюда именно для того, чтобы всё это тебе сказать.»"
34190-54 = "..."
34190-55 = "Ты..."
34190-56 = "Не можете просто оставить меня в покое, Сенсей? Хватит меня мучить."
34190-57 = "После всего, что я сделала, почему вы всё ещё не сдаётесь?!"
34190-58 = "Почему приходите сюда и заставляете меня верить, что у меня снова есть шанс?"
34190-59 = "[s] «Конечно, у тебя есть ещё один шанс.»"
34190-60 = "...?"
34190-61 = "[s] «А если нет — я его создам.»"
34190-62 = "Это..."
34190-63 = "[ns] «Если не получится — создам ещё один.»"
34190-65 = "[ns] «И если опять не получится — попробую снова.»"
34190-67 = "[ns] «Снова, снова и снова! Я не остановлюсь!»"
34190-69 = "[ns13] «Если не получилось — просто пробуешь ещё раз!»\n[ns14] «Я не приму поражение ни для одной из вас.»"
34190-72 = "[ns] «Неважно, даже если на это уйдёт вся наша жизнь.»"
34190-73 = ""
34190-74 = "[ns] «Я дам вам бесконечное число шансов, Мика! Саори!»"
34190-75 = "..."
34190-76 = "..."
34190-77 = "[ns15] «Вы мои студенты! Этого достаточно.»\n[ns16] «Конечно, мои студенты имеют право ошибаться!»\n[ns17] «Я сделаю это возможным, чего бы ни стоило!»"
34190-78 = ""
34190-79 = ""
34190-80 = ""
34190-81 = "Прекратите эту глупость!"
34190-82 = ""
34190-84 = ""
34190-85 = "Вашему тошнотворному идеализму не место в моей базилике."
34190-86 = "[s] «Беатриче! Ты...!»"
34190-87 = "Ваш театр перестал меня забавлять."
34190-88 = "Вы правда думали, что я за вами не наблюдаю? Весь этот город принадлежит мне."
34190-89 = "Мне надоели ваши жалкие попытки подтвердить собственное существование, словно мотыльки у огня. Игры окончены!"
34190-90 = "Ну что же, начнём ритуал?"
34190-92 = "Ацуко! Нет!"
34190-93 = "Неужели время уже вышло?"
34190-94 = "С-Солнце ещё даже не взошло...!"
34190-96 = "А-ха-ха-ха-ха-ха!"
34190-97 = "Было весело цепляться за вашу маленькую надежду на «рассвет»? Нимб королевской крови будет разрушен прежде, чем она успеет снова увидеть солнце."
34190-98 = "А с её смертью я вознесусь как величайшее существо, когда-либо ступавшее по Кивотосу!"
34190-99 = "Не позволю! Химэ, я иду!"
34190-100 = "..."
34190-101 = ""
34190-103 = ""
34190-104 = "К сожалению, больше не хочется с вами играть."
34190-105 = ""
34190-108 = ""
34190-110 = ""
34190-111 = ""
34190-112 = ""
34190-113 = ""
34190-114 = "Восстань, Барбара, Святая Юстины."
34190-115 = "Заставь Сенсея Шале замолчать! Вырви его лживый язык!"
