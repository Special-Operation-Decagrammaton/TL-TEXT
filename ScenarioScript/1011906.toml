[translation]
1011906-1 = "Лето Снежной девы"
1011906-3 = "Рано утром в Шале я сидел за столом, работал и ждал дежурного студента."
1011906-4 = "[ns1] «(...Сегодня дежурит Нагуса?)»\n[ns2] «(Кажется, она немного опаздывает.)»"
1011906-10 = "Прошу прощения за опоздание, Сенсей."
1011906-11 = "По дороге сюда я немного заблудилась..."
1011906-12 = "[s] «Добро пожаловать, Нагуса.»"
1011906-13 = ""
1011906-15 = ""
1011906-16 = ""
1011906-17 = "[ns] «...Прежде чем начнём, ты точно не заболела?»"
1011906-18 = "Нет... Я в порядке."
1011906-19 = "(морщится) Я в порядке. Чем могу помочь?"
1011906-20 = "[s3] «Стой. Твоё здоровье важнее всего, Нагуса.»\n[s4] «Что случилось? Ты бледная.»"
1011906-23 = "Ничего не случилось, просто... по дороге сюда я вышла не на той станции и, как уже говорила, немного заблудилась."
1011906-24 = "И на улице... довольно солнечно."
1011906-25 = ""
1011906-28 = "[ns5] «Почему бы тебе не сесть здесь перед вентилятором?»\n[ns6] «А я принесу из комнаты отдыха что-нибудь холодное.»"
1011906-31 = "Нет-нет. Я пришла помочь, а не доставлять вам ещё больше хлопо—"
1011906-32 = ""
1011906-34 = ""
1011906-35 = ""
1011906-36 = ""
1011906-37 = "...Прошу прощения. Тогда перед началом я немного отдохну. Совсем чуть-чуть."
1011906-39 = "Я принёс Нагусе холодный напиток и следил за ней, пока ей не стало лучше."
1011906-40 = ""
1011906-41 = "Фух... Я снова пришла в себя."
1011906-42 = "Спасибо, Сенсей. Мне действительно намного лучше."
1011906-43 = "[s] «Рад был помочь.»"
1011906-44 = ""
1011906-47 = "[ns7] «Ты сказала, сегодня на улице жарко?»\n[ns8] «Я с самого утра был в помещении, так что...»"
1011906-50 = "Ну, не настолько жарко, чтобы объявлять «предупреждение о жаре», но..."
1011906-51 = "Что ж... жара — моя слабость."
1011906-52 = "Холод я переношу хорошо, а летом мне всегда становится плохо."
1011906-53 = "Когда я была младше, меня часто называли «Снежной девой»."
1011906-54 = "В каком-то смысле это лестно. В мифах Снежная дева всегда описывается как загадочная красавица. Пожалуй, сходство можно увидеть."
1011906-55 = "[s] «Хех, похоже, тебе и правда стало лучше.»"
1011906-56 = "И всё же я никогда не любила эти истории."
1011906-57 = "[s] «Почему?»"
1011906-58 = "Потому что они никогда не заканчиваются счастливо."
1011906-59 = "Снежная дева всегда пытается выразить кому-то свою любовь, но какими бы сильными ни были её чувства и какими бы красивыми ни были слова, этот человек всё равно отвергает её из-за её холодного облика."
1011906-60 = "Поэтому мне не всегда нравилось, когда меня сравнивали с несчастной в любви девой, которая исчезает или тает, когда мир её отвергает."
1011906-61 = "Даже если эти истории... в каком-то смысле правдивы."
1011906-62 = "Когда приходит зима и земля пустеет, большинство людей чувствует лишь... тоску по летнему солнцу."
1011906-63 = "[s] «...Твой напиток всё ещё холодный?»"
1011906-64 = "Да. Вы положили столько льда, что он до сих пор холодит мне руки."
1011906-65 = "[s] «В такие дни лёд особенно важен.»"
1011906-66 = "Не спорю, но почему вы об этом заговорили?"
1011906-67 = "[s9] «Ну, кто-то скучает по летнему солнцу...»\n[s10] «...а кто-то — по зимнему снегу.»"
1011906-70 = ""
1011906-73 = "[ns11] «Если сохранять уверенность и помнить о собственной ценности...»\n[ns12] «...даже Снежная дева может обрести счастливый конец.»"
1011906-76 = "...Возможно, вы правы. Я никогда не слышала историй о Снежной деве, пережившей лето."
1011906-77 = ""
1011906-79 = ""
1011906-83 = "Но вот я здесь. И, возможно, у меня всё же есть надежда."
