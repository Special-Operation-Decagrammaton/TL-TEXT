[translation]
1601405-1 = "Ибуки набирается опыта работы!"
1601405-3 = ""
1601405-4 = "Привет, Сенсей!"
1601405-5 = "Как Ибуки и говорила в MomoTalk, Ибуки пришла поговорить с вами!"
1601405-6 = "[s1] «Привет! Я ждал тебя.»\n[s2] «Тебе снова стало интересно, чем занимается Сенсей?»"
1601405-9 = "Видите ли, Ибуки дали опрос про будущее... что-то там...?"
1601405-10 = "Вот!"
1601405-11 = ""
1601405-14 = "[ns] «Опрос о планах на будущее?»"
1601405-15 = "Да! Вот это!"
1601405-16 = "Ибуки должна написать, кем хочет стать, когда вырастет!"
1601405-17 = "Ибуки хотела узнать мнение Сенсея, потому что Сенсей — любимый взрослый Ибуки!"
1601405-18 = "[s] «Планы на будущее, значит... Кем ты хочешь стать, когда вырастешь, Ибуки?»"
1601405-19 = "Эм... Дело в том, что Ибуки никогда об этом не думала."
1601405-20 = "По дороге сюда Ибуки думала о том, что она умеет делать и что могло бы быть весело..."
1601405-21 = "Ибуки думала, думала и ещё думала, но так ничего и не придумала."
1601405-22 = "[s] «Не нужно спешить, Ибуки. У тебя ещё полно времени, чтобы решить.»"
1601405-23 = "У-у... Если вы так говорите..."
1601405-24 = "Но..."
1601405-25 = "[s3] «...А давай попробуем разобраться, чем ты могла бы заниматься?»\n[s4] «Сенсей тебе поможет.»"
1601405-28 = "Ура! Правда?"
1601405-29 = "Хорошо! Тогда у Ибуки есть список того, что она хочет попробовать, Сенсей!"
1601405-31 = ""
1601405-32 = "Здравствуйте! Это Ибуки!"
1601405-33 = "Здравствуйте. Значит, ты Ибуки."
1601405-34 = "[s] «Спасибо, что согласились помочь. Рассчитываю на вас.»"
1601405-35 = "Без проблем, Сенсей. Хорошо, Ибуки. Я расскажу тебе, как устроена работа полиции."
1601405-36 = "Хорошо! Ибуки будет внимательно слушать!"
1601405-37 = "Мы патрулируем улицы и следим, не случилось ли чего. А ещё разыскиваем и арестовываем преступников, чтобы жители были в безопасности."
1601405-38 = "Самое важное для полицейского — сильное чувство справедливости и ответственности!"
1601405-39 = "Вот, примерь эту полицейскую фуражку."
1601405-40 = ""
1601405-42 = ""
1601405-43 = "О-о! Ибуки чувствует себя настоящим полицейским!"
1601405-44 = "Сенсей, вы арестованы! Хи-хи."
1601405-46 = ""
1601405-47 = "Наша работа — подавать людям вкусную еду."
1601405-48 = "Больше всего меня радуют довольные улыбки посетителей!"
1601405-49 = "Ибуки тоже может стать поваром?"
1601405-50 = "Конечно! Любой, у кого хватает терпения и такта, может стать отличным поваром!"
1601405-51 = "Хочешь попробовать нарезать продукты? Можешь взять учебный нож."
1601405-52 = "Хорошо! Только подождите, Сенсей! Ибуки приготовит для вас вкусное блюдо!"
1601405-54 = ""
1601405-55 = "Итак, Ибуки... Управлять танком сложно, и для этого нужно, чтобы много людей работали сообща."
1601405-56 = "Ибуки знает! Ибуки раньше ездила вместе с Ирохой, когда та управляла танком. Ибуки уже видела, как это делается!"
1601405-57 = "Тогда это сэкономит нам много времени. Хочешь сегодня побыть командиром танка?"
1601405-58 = "То есть Ибуки сможет выбирать, куда мы поедем?! Хорошо!"
1601405-61 = "С утра до вечера я показывал Ибуки самые разные интересные профессии."
1601405-62 = ""
1601405-63 = "[ns5] «Тебе сегодня понравилось, Ибуки?»\n[ns6] «Какая работа понравилась тебе больше всего?»"
1601405-66 = "Хм..."
1601405-67 = "Если честно... Ибуки не уверена!"
1601405-68 = "[s] «Понимаю. Трудно за один день решить, чем заниматься всю жизнь...»"
1601405-69 = "Но..."
1601405-70 = "...М-м. Кажется, Ибуки поняла!"
1601405-71 = "[s] «Ты не уверена, но думаешь, что поняла?»"
1601405-72 = "Ага! Хорошо, тогда Ибуки на сегодня пойдёт домой!"
1601405-73 = "Спасибо, что показали Ибуки столько классных профессий, Сенсей! До встречи!"
