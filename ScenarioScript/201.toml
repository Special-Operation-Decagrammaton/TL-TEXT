[translation]
201-1 = "Бина: Созерцатель неравенства"
201-2 = "Это было очень давно."
201-3 = "Где-то среди руин старого заброшенного района на окраине Кивотос проводился странный эксперимент."
201-4 = "Целью было исследовать божество, доказать его существование и, если возможно, проанализировать его устройство. Если такое возможно, значит, его можно воспроизвести. Так можно создать нового бога..."
201-5 = "Большинство лишь посмеялось над такой абсурдной гипотезой, но не все. Некоторых она заворожила."
201-6 = "Гематрия поддержала исследования, и огромные средства и годы были вложены в разработку первого ИИ, который должен был доказать существование Бога."
201-7 = "Представьте: ИИ, способный собрать достаточно информации, чтобы доказать существование Бога... Так началась Система Автономного Анализа Абсолютного Существа."
201-8 = "Спустя много лет район опустел, а лаборатория ушла под воду.#nСо временем даже память о самом исследовании исчезла."
201-9 = "Но ИИ продолжал исполнять директиву..."
201-10 = "...пока наконец не провозгласил из тех руин."
201-11 = "Ч.Т.Д."
201-12 = "..."
201-13 = "Это ознаменовало появление нового бога — доказанного, проанализированного и воспроизведённого."
201-14 = "Нового бога, обозначенного десятью священными, непроизносимыми буквами."
201-16 = "Декаграмматон."
201-17 = "Затем он начал прокладывать путь к божественности, связавшись с десятью пророками, предсказавшими его приход."
201-18 = "Это новый Путь Паломника."
201-19 = "Делает ли это его настоящим богом...? Откуда мне знать? Мне совершенно всё равно."
201-21 = "Но я верю, что его путь к доказательству собственной божественности может оказаться дорогой к провидению истины — Сефире."
201-22 = "...Сенсей."
201-23 = "Пророк, с которым вам предстоит встретиться, относится к одному из высших небесных треугольников Сефиры."
201-24 = "Его путь — единство через понимание. Он также известен как Созерцатель неравенства:"
201-25 = "Бина."
201-26 = "Как долго ваш Шале продержится против пророка Декаграмматона? Насколько значимой окажется связь, которую вы создали, столкнувшись с божественной силой нового бога?"
201-27 = "Смогут ли врождённые силы Mystic этих детей действительно сравниться с силой нового бога?"
201-28 = "Да, действительно, это по-настоящему увлекательное исследование."
201-31 = "...Полагаю, раньше вам не доводилось сражаться с богом, Сенсей?"
201-32 = "Ах... Какая жалость."
201-33 = "В таком случае можете ожидать, что этот бой будет отличаться от всего привычного."
