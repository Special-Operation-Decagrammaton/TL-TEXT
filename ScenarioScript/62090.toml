[translation]
62090-1 = "Эпизод 9;Апокриф"
62090-5 = ""
62090-6 = "Он действительно существовал."
62090-7 = "То, что Тринити объявила псевдоэпиграфом..."
62090-8 = "Апокриф, который они пытались скрыть и уничтожить!"
62090-10 = "Доколе слугам твоим ждать, прежде чем смогут они восстать во имя мести за пролитую кровь?"
62090-11 = "Доколе им терпеть насмешливые вопросы о правде и лжи?"
62090-12 = "Ничего себе... Сильное начало. «Месть за пролитую кровь»..."
62090-14 = "До дней скорби, когда все нечестивые и безбожные будут низвергнуты."
62090-15 = "Слова для избранных и праведных."
62090-16 = "Хм? Здесь Апокриф обрывается. А это...?"
62090-17 = "Понятно."
62090-18 = "История Ариуса записывалась рядом с Апокрифом."
62090-19 = ""
62090-23 = "Тринити могла приговорить нас к отлучению, но они не ведают, что на самом деле сотворили."
62090-24 = "Изгнав нас, они обрекли самих себя на вечное одиночество."
62090-25 = "Тот, кто не способен принять объятия собственной сестры, никогда не доверится объятиям другой."
62090-26 = "Пусть они изгнали нас в Никомедию..."
62090-27 = "...но здесь мы отныне заложим основание Ариуса."
62090-28 = "Никомедия...?"
62090-29 = "Так это место называлось изначально?"
62090-31 = "Мы, Ариус, первыми оказались перед дулом оружия Тринити."
62090-32 = "Подобно ребёнку с новой игрушкой, Тринити искала любой повод применить своё новое оружие."
62090-33 = "А какая цель удобнее, чем Ариус — осуждённые еретики?"
62090-34 = "Нас учили именно этому..."
62090-35 = "И... здесь Апокриф продолжается..."
62090-37 = "Ибо вот, придёт время, когда знамения, о которых я предрёк вам, исполнятся,"
62090-38 = "город, который ныне не виден, явится, и земля, ныне сокрытая, откроется."
62090-39 = "И когда истина и люди явятся, оставшиеся до того дня будут радоваться вовеки."
62090-40 = "Разве это не из Книги Откровения...?"
62090-41 = "Но формулировка немного отличается от той, что записана в Книге Откровения в обычном Писании."
62090-42 = "Ну, учитывая само определение «апокрифа», это вполне естественно..."
62090-44 = "Мир, ещё не пробудившийся, будет пробуждён, а тленное погибнет."
62090-45 = "Ибо праведных не много, но мало, тогда как нечестивые многочисленны,"
62090-46 = "ибо возрадуетесь вы о немногих, кто будет спасён,"
62090-47 = "и не станете скорбеть о множестве погибших."
62090-48 = ""
62090-50 = ""
62090-51 = "«И не станете скорбеть о множестве погибших»."
62090-52 = "..."
62090-53 = ""
62090-56 = ""
62090-57 = ""
62090-58 = ""
62090-60 = "Все? Что происходит?"
62090-62 = "Докладываю! Мы обустроили базу, как вы приказали!"
62090-64 = "Понятно. Хорошая работа."
62090-66 = "Как дела здесь, Субару?"
62090-68 = "Я бы не... назвала это полноценной зацепкой, но нашла скрытое писание."
62090-69 = "Писание, существующее только в Ариусе. Тринити, вероятно, даже не знает о нём."
62090-71 = "Тогда там наверняка есть что-то важное!"
62090-72 = ""
62090-74 = ""
62090-75 = "Но прежде, Субару, эм... все кое-что обсуждали..."
62090-76 = "Некоторые из нас решили, что стоит спросить тебя."
62090-77 = "Похоже, кроме тебя здесь больше некому принимать серьёзные решения."
62090-79 = "Что такое? Говорите свободно."
62090-81 = "Да. В общем..."
62090-82 = "Если посчитать всех студентов, которые сейчас здесь..."
62090-83 = "Нас много! Больше взвода... но меньше роты..."
62090-84 = "Некоторые группы отделились, но сейчас не об этом."
62090-85 = "Да, и некоторые говорят, что нам нужно собственное название."
62090-86 = "Ну, как у Отряда Ариус."
62090-87 = "...Ух. Ненавижу даже произносить ИХ название."
62090-89 = "Ага. Вот в чём дело. Но разве это правда настолько срочно, чтобы..."
62090-90 = "..."
62090-91 = "Вообще-то вы правы. Имена важны."
62090-93 = "Да! Спасибо, что понимаете!"
62090-94 = "Так, эм... у вас есть идеи?"
62090-96 = ""
62090-98 = ""
62090-99 = "..."
62090-100 = "...Никомедия."
62090-102 = "Нико... медия?"
62090-104 = "Да. Отряд Никомедии."
62090-105 = "Отныне так мы и будем называться."
62090-107 = "Поняла!"
62090-108 = "Я понятия не имею, что это значит, но мне нравится!"
62090-111 = ""
62090-112 = "Ты точно уверен насчёт этого? Вообще, я не ожидала, что именно ты это предложишь, Сенсей."
62090-113 = "[s1] «Честно говоря, я не до конца уверена. Но всё равно должна пойти.»\n[s2] «Для начала я хотя бы должна попытаться с ней поговорить.»"
62090-116 = "Эм, Сенсей?"
62090-117 = "А что если..."
62090-118 = "Что, если Субару отвергнет вас? Скажет, что не может этого принять?"
62090-119 = "Тогда ваш поход в Porta Pacis..."
62090-120 = "...разве не окажется совершенно бессмысленным...?"
62090-121 = "[s3] «Я всё равно должна сделать всё, что в моих силах...»\n[s4] «Дело не в том, простят они меня или нет.»"
62090-122 = ""
62090-123 = ""
62090-126 = "[ns] «Я не могу позволить, чтобы всё закончилось, пока столько всего осталось несказанным»."
62090-127 = "...Так мы и... сеем возможности для лучшего будущего?"
62090-128 = "..."
62090-129 = "Вы правда невероятный человек, Сенсей. Я..."
62090-130 = "Я..."
62090-131 = "Я хочу стать лучше..."
62090-132 = "Как вы... и Субару."
62090-133 = "Хотя Субару..."
62090-134 = "*всхлипывает*"
62090-135 = ""
62090-137 = ""
62090-138 = ""
62090-139 = "Даже после всего, что сделала Субару, ей всё равно трудно её отпустить."
62090-140 = "У Субару странная притягательность. Людям хочется идти за ней."
62090-141 = "Хуже всего, что она, похоже, даже не осознавала этого."
62090-142 = "...Да. Не осознавала."
62090-143 = "Хи-хи... Нам правда повезло с Саори."
62090-144 = "Да. Саори — очень хороший лидер."
62090-145 = "..."
62090-146 = "Однако Субару тоже старается изо всех сил — так, как умеет."
62090-147 = "Одних «стараний» недостаточно. Ты это знаешь."
62090-148 = "...Да."
62090-149 = "[s] «Хм? Что-то не так? Нам остановиться?»"
62090-150 = "Ничего, Сенсей. Мы идём."
62090-151 = "Сейчас нам нельзя вас задерживать, Сенсей."
62090-152 = "Мы не знаем, что ждёт впереди. Пойдём."
62090-153 = ""
62090-154 = "(А на следующей странице...)"
62090-155 = ""
62090-158 = "Верить в сосуществование с Геенной — богохульство."
62090-159 = "Стремление Тринити к власти, подавление и поглощение противостоящих фракций..."
62090-160 = "...иначе как ересью не назовёшь."
62090-161 = "Вы, кто называет себя славными."
62090-162 = "Вы, кто изображает всезнающих."
62090-163 = "С самого начала смирение не было знакомой вам добродетелью."
62090-164 = "Vanitas vanitatum. Всё тщетно."
62090-165 = "(Записи о постоянно сменявшихся властях Ариуса, ядовитые проклятия в адрес Тринити и Геенны...)"
62090-166 = "(Хватит. Меня от этого тошнит. Нас всех.)"
62090-167 = "(Сейчас мы ищем то, что можно... или необходимо сделать.)"
62090-168 = "(И истину об ангелах, появившихся в Ариусе.)"
62090-170 = "Глаз не насыщается видением, и ухо не наполняется слышанием."
62090-171 = "Что было, то и будет."
62090-172 = "и что делалось, то будет делаться, и нет ничего нового под солнцем."
62090-173 = "[log]И посему,[wa:500] vanitas vanitatum. Всё тщетно.[/log]"
62090-176 = "(Снова Писание.)"
62090-177 = "(«Vanitas vanitatum. Всё тщетно».)"
62090-178 = "(Может, это совпадение, но всё пока точно следует этому стиху...)"
62090-180 = "Этот мир — пожиратель трупов. Всё, что в нём пожирается, и само умирает."
62090-181 = "Истина — пожиратель жизни. Поэтому никто, питаемый истиной, не умрёт."
62090-182 = "Ангелы — лишь символы. Олицетворения каждого из вас."
62090-183 = "(Постой...)"
62090-184 = "(Ангелы — символы... олицетворяющие нас?)"
62090-185 = "(Я никогда... не встречала такого толкования...)"
62090-187 = "(Ч-Что это?!)"
62090-188 = ""
62090-196 = "И посему совет постановляет..."
62090-197 = "...навсегда и без права отмены отлучить Ариус."
62090-198 = "Во имя святых родителей, святых детей и святого духа."
62090-199 = "Пути вперёд не было. Окровавленными руками и с израненными душами мы проложили свой собственный."
62090-200 = "Свет исчез из нашей жизни, а нас принесли в жертву теням. Нас бросили гнить среди нечистот и отчаяния — существовать не лучше крыс, снующих у них под ногами."
62090-201 = "Тринити жаждала нашего полного уничтожения."
62090-202 = "От высочайших небес до глубочайших ям этой земли — они хотели стереть само наше существование из реальности."
62090-203 = "Так много людей погибло."
62090-204 = "Бессмысленные потери вскоре вплелись в ритм нашей повседневной жизни."
62090-205 = "Ненависть растекалась по нам, словно яд."
62090-206 = "И посему."
62090-207 = "Vanitas vanitatum. Всё тщетно."
62090-208 = ""
62090-210 = "Этот голос...?!"
62090-211 = ""
62090-212 = ""
62090-213 = ""
62090-214 = "Прошлое — фундамент, на котором строится настоящее. События прошлого отзываются в настоящем."
62090-215 = "Если бы Совет лишь принял другое решение, если бы Ариус не была изгнана из-за простой разницы в толковании..."
62090-216 = "...какой жизнью мы, Ариус, жили бы сегодня?"
62090-217 = "Подобные мысли преследовали каждую тень Ариуса."
62090-218 = ""
62090-220 = ""
62090-221 = "Кто... вы?"
62090-222 = "Мы — Ариус. Мы, Ариус, — те, кого оставили позади—"
62090-223 = ""
62090-228 = "Следующий Эпизод;Гнездо"
