[translation]
2000903-1 = "Нежнее пудинга"
2000903-2 = "Вы опоздали, Товарищ!"
2000903-3 = "[s] «Я опоздал всего на пять минут...»"
2000903-4 = "Всего? Всего?! Ты знаешь, сколько всего можно сделать за пять минут?"
2000903-5 = "Например, сварить сто яиц в горячем источнике!"
2000903-6 = "[s] «Яйца в горячем источнике так быстро не готовятся.»"
2000903-7 = "Н-неужели?"
2000903-8 = "К-Кхм, в любом случае заставлять меня ждать — преступление! Обычно я бы приговорила тебя к десяти годам мытья туалетов, но..."
2000903-9 = "Сегодня у нас очень важная миссия, поэтому я специально тебя прощаю. Почувствуй себя польщённым, товарищ!"
2000903-10 = "Так, эм, как вообще готовят яйца в горячем источнике? Когда я в прошлый раз видела, как Клуб школьного питания готовит пудинг, всё выглядело довольно сложно."
2000903-11 = "[s] «Кладёшь яйца в горячий источник и ждёшь.»"
2000903-12 = "Ч-Что? Неужели такое пудингоподобное лакомство и правда готовится настолько просто?"
2000903-13 = "Товарищ... Ты ведь не посмеешь меня обмануть?"
2000903-14 = "Хотя от обмана тебе никакой выгоды. Полагаю, прощён."
2000903-15 = "Тогда начнём готовить яйца в горячем источнике?"
2000903-16 = ""
2000903-18 = ""
2000903-19 = ""
2000903-21 = "[ns] «Это всё яйца...?»"
2000903-22 = "Хи-хи, когда мы готовим что-то столь вкусное, как пудинг, я не стану экономить!"
2000903-23 = "Я велела принести все яйца из Клуба школьного питания!"
2000903-24 = "Если приготовить столько, я смогу есть яйца из горячего источника целыми днями."
2000903-25 = "А? Мне может надоесть их есть?"
2000903-26 = "Чепуха, товарищ. Мне никогда не надоест еда, такая мягкая и вкусная, как пудинг."
2000903-27 = "Я могу есть её целыми днями! Всю оставшуюся жизнь!"
2000903-28 = "Хи-хи... Я не могу сдержать восторг от мысли, что все эти яйца превратятся в пудинг."
2000903-29 = "Нельзя больше медлить. Товарищ, давай варить яйца в горячем источнике."
2000903-30 = "Положи все яйца сюда, в горячую воду. Только не разбей их!"
2000903-38 = ""
2000903-39 = "Товарищ, яйца уже готовы?"
2000903-40 = "[s] «Не прошло ещё и пяти минут.»"
2000903-41 = "Такое чувство, будто прошло пятьдесят лет."
2000903-42 = "Ладно. Придётся набраться терпения и ждать."
2000903-44 = ""
2000903-45 = ""
2000903-46 = "Товарищ, они уже готовы?"
2000903-47 = "[s] «Прошло всего восемь минут...»"
2000903-48 = "Ещё даже десяти минут не прошло?"
2000903-49 = "Товарищ, может, у тебя часы сломались."
2000903-50 = "Не может быть, чтобы прошло всего восемь минут."
2000903-52 = ""
2000903-53 = "[ns] «Думаю, теперь можно есть.»"
2000903-54 = "Наконец-то! Я так долго ждала!"
2000903-55 = ""
2000903-57 = ""
2000903-58 = ""
2000903-60 = "[ns] Передать Черино яйцо из горячего источника."
2000903-61 = "Хи-хи... Тепло правильно приготовленного яйца ощущается очень приятно."
2000903-62 = "Раз эта еда готовилась так долго, она должна быть почти как высококачественный пудинг, верно?"
2000903-63 = "Ну-ка, посмотрим, каково на вкус."
2000903-64 = ""
2000903-66 = ""
2000903-67 = ""
2000903-68 = ""
2000903-69 = "Что это такое, товарищ?"
2000903-70 = "Это просто... просто недоваренное яйцо."
2000903-71 = "[s] «Да, яйцо, сваренное в воде горячего источника.»"
2000903-72 = "То есть текстура похожа на пудинг, но вкус пресный и пахнет серой... Кроме текстуры, на пудинг вообще не похоже."
2000903-73 = "Ух... Ты меня обманул, товарищ!"
2000903-74 = "Товарищ, я тебе доверилась и сварила все эти яйца. И что теперь с ними делать?!"
2000903-75 = "[s1] «Разве ты не говорила, что съешь всё сама?»\n[s2] «Это ты принесла яйца, Черино.»"
2000903-76 = "Я думала, они будут на вкус как пудинг!"
2000903-77 = "Если ты знал, то должен был меня остановить!"
2000903-78 = "Даже если это ты, товарищ, я не могу простить такую дезинформацию и неприятности, причинённые службе питания Красной Зимы!"
2000903-79 = "В качестве платы за твой несомненный саботаж я требую пудинг высшего качества!"
2000903-80 = "[s] «Это как-то совсем несправедливо...»"
2000903-82 = "В итоге именно мне пришлось разбираться со всеми оставшимися яйцами из горячего источника."
