[translation]
2003505-1 = "Сладкий сон, приятные сны"
2003505-5 = "Работа в Хяккияко заняла у меня больше времени, чем я ожидал..."
2003505-6 = "К моменту, когда я наконец закончил, день уже почти подошёл к концу."
2003505-7 = ""
2003505-9 = "[ns] «Кстати, я ведь должен был позвонить Цубаки...»"
2003505-12 = ""
2003505-13 = "Алло, Сенсей?"
2003505-14 = "О... Вы только что закончили? Хорошо, поняла."
2003505-15 = "И ждать было совсем несложно. Я как раз заканчивала свой дневной сон."
2003505-16 = "Минутку, Сенсей. Я сейчас выйду к вам."
2003505-17 = ""
2003505-19 = ""
2003505-22 = "Через 5 минут..."
2003505-23 = ""
2003505-24 = "Сюда, Сенсей."
2003505-25 = "Хи-хи. Как-то освежает видеть вас в такое время суток."
2003505-26 = "[s] «Освежает видеть тебя такой бодрой и энергичной.»"
2003505-27 = "Правда? Наверное, просто сегодня такой освежающий день!"
2003505-28 = "Пойдём, Сенсей."
2003505-29 = "Как президент Клуба внутренней дисциплины и проводник по сну, я благополучно вас сопровожу."
2003505-30 = "[s] «Пожалуйста.»"
2003505-32 = ""
2003505-33 = ""
2003505-35 = ""
2003505-36 = ""
2003505-38 = ""
2003505-39 = ""
2003505-40 = ""
2003505-41 = ""
2003505-42 = "[ns] «Я уже говорил, но ты сегодня довольно бодрая, Цубаки.»"
2003505-43 = "Правда? Думаете?"
2003505-44 = "Хи-хи. Ну, можно сказать, это моё лучшее время суток!"
2003505-45 = ""
2003505-47 = ""
2003505-48 = "Разве Хяккияко ночью не выглядит круто?"
2003505-49 = "Дневная суета полностью исчезла... Всё так тихо, будто мир остановился."
2003505-50 = "Перемена настолько резкая, что некоторые студенты из-за этого избегают выходить ночью."
2003505-51 = "Но мне нравится. Эта тишина — тоже Хяккияко."
2003505-52 = "[s] «Эта тишина — тоже Хяккияко... И правда...»"
2003505-53 = "Что такое, Сенсей? Вы запыхались."
2003505-54 = "Вы замедлились. И ещё вспотели."
2003505-55 = "Уже устали?"
2003505-56 = "[s] «Прости...»"
2003505-57 = "Не нужно извиняться... но за здоровьем следить надо."
2003505-58 = "Если вы заболеете или поранитесь, многие студенты расстроятся."
2003505-59 = "И я тоже, конечно..."
2003505-60 = "[s] «Тогда дай мне время и место для тренировок!»"
2003505-61 = "...Простите, Сенсей. С этим я помочь не могу."
2003505-62 = "Но... давайте хотя бы отдохнём."
2003505-63 = "Следить за выносливостью экскурсионной группы — тоже часть моей работы."
2003505-65 = "Я пошёл за Цубаки к ближайшей зоне отдыха..."
2003505-66 = ""
2003505-74 = "― [log=츠바키 가이드]*вздох*... Ноги немного болят.[/log][wa:4670]"
2003505-77 = "― [log=츠바키 가이드]Эти туфли ещё не успели разноситься.[/log][wa:4870]"
2003505-80 = "― [log=츠바키 가이드]Что такое, Сенсей?[/log][wa:1660]"
2003505-81 = "― [log=츠바키 가이드]Вы так пристально смотрите...[/log][wa:1670]"
2003505-84 = "― [log=츠바키 가이드]А? Я кажусь... не такой, как обычно?[/log][wa:6580]"
2003505-87 = "― [log=츠바키 가이드]...Странно.[/log][wa:3220]"
2003505-90 = "― [log=츠바키 가이드]Хи-хи. Но если вам нравится такая я...[/log][wa:5800]"
2003505-91 = "― [log=츠바키 가이드]Может, это и не плохо?[/log][wa:4620]"
2003505-94 = "― [log=츠바키 가이드]Эй... Сенсей.[/log][wa:1970]"
2003505-95 = "― [log=츠바키 가이드]Надеюсь, сегодня нам обоим приснятся приятные сны.[/log][wa:8590]"
2003505-98 = ""
2003505-99 = "[ns1] «Иногда, Цубаки...»\n[ns2] «...мне кажется, будто я сам попал в сон. Но в хорошем смысле.»"
2003505-102 = "Хи-хи. Что вы имеете в виду?"
2003505-103 = "Не знаете? Сегодня просто столько интересных тем."
2003505-104 = "Но чтобы видеть хорошие сны, сперва нужно хорошо спать."
2003505-105 = "И... если вам нужны советы, как хорошо спать, я буду вашим проводником."
2003505-106 = "Может, я побуду рядом, пока вы не уснёте."
2003505-107 = "[ns] «Хорошо... Буду благодарен...»"
2003505-108 = ""
2003505-110 = ""
2003505-112 = ""
2003505-114 = ""
2003505-117 = "Сенсей?"
2003505-118 = ""
2003505-121 = "Вы и правда совсем вымотались, да?"
2003505-122 = ""
2003505-125 = "Тогда спите спокойно, Сенсей. Надеюсь, вам приснятся приятные сны."
2003505-126 = "И если получится..."
2003505-127 = "Может, ещё поговорим в мире снов."
2003505-128 = ""
2003505-132 = "[ns3] «...А?!»\n[ns4] «Я уснул на улице! Опаздываю, опаздываю!»"
2003505-135 = "Я осторожно разбудил Цубаки, спавшую рядом со мной."
2003505-136 = ""
2003505-139 = ""
2003505-140 = "М-м? Дайте мне ещё немного поспать..."
2003505-141 = ""
2003505-143 = ""
2003505-144 = "...А? Вы не Мимори. Сенсей?"
2003505-145 = "..."
2003505-146 = ""
2003505-148 = ""
2003505-149 = "Здравствуйте, Сенсей. Доброе утро."
2003505-150 = "[s5] «...Прекрасное утро, Цубаки...»\n[s6] «...Но нам пора готовиться к новому дню!»"
2003505-153 = "...Да, ладно."
2003505-154 = "Жаль, что нельзя было подремать ещё немного..."
2003505-156 = ""
2003505-158 = "Я утешил разочарованную Цубаки, а затем отправился работать в Шале."
