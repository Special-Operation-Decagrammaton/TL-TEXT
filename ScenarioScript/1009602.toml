[translation]
1009602-1 = "Давайте выберем купальник"
1009602-2 = "По просьбе Канны я отправился в Полицейскую школу Валькирия."
1009602-4 = "Добро пожаловать, Сенсей [USERNAME]. Спасибо, что пришли."
1009602-5 = "[s] «Всегда рад тебе помочь, Канна.»"
1009602-6 = "В-Вот как? Спасибо."
1009602-7 = "Как я уже говорила, я связалась с вами, потому что мне нужен совет по поводу задания."
1009602-8 = "[s1] «Задания спасателя, верно?»\n[s2] «И ещё насчёт купальника?»"
1009602-11 = "Да, всё верно. Мне сложно принять это решение самостоятельно."
1009602-12 = "Детали лучше обсудить в другом месте."
1009602-15 = ""
1009602-16 = "Я здесь."
1009602-17 = "[s3] «П-Погоди! Это же раздевалка!»\n[s4] «Нам не стоит оставаться вдвоём в таком месте.»"
1009602-20 = "Понимаю, что вы удивлены."
1009602-21 = "Но я получила доступ по своим полномочиям. Никто другой сюда не войдёт."
1009602-22 = "[s] «Дело не в этом...»"
1009602-23 = "Что ж, в любом случае, позвольте показать..."
1009602-24 = ""
1009602-26 = ""
1009602-27 = "Для работы спасателем в аквапарке нужен купальник..."
1009602-28 = "...и вот какие варианты предоставила Валькирия."
1009602-29 = "Официального дресс-кода для этого нет, поэтому я не знаю, какой вариант будет лучше."
1009602-30 = "Простите, что позвала вас сюда ради этого, но не могли бы вы помочь мне выбрать подходящий?"
1009602-31 = "[s5] «То есть...»\n[s6] «...ты просишь меня выбрать для тебя купальник?»"
1009602-34 = "Именно так."
1009602-35 = "Я редко ношу купальники, поэтому немного растеряна."
1009602-36 = "Этот дизайн самый популярный, но..."
1009602-37 = "...он довольно открытый и может показаться неуместным."
1009602-38 = "[s] «Дизайн и правда довольно смелый.»"
1009602-39 = ""
1009602-42 = "[ns] «Если хочется чего-то более закрытого, как насчёт этого?»"
1009602-43 = ""
1009602-45 = ""
1009602-46 = "Вообще-то это может быть ещё более неловко...!"
1009602-47 = "Я бы предпочла что-нибудь более подходящее для самого задания!"
1009602-48 = "Что-то, по чему сразу видно, что я спасатель."
1009602-49 = "[s] «Хм, думаю, этот идеально подойдёт.»"
1009602-50 = ""
1009602-52 = ""
1009602-54 = ""
1009602-55 = "По нему действительно видно, что я спасатель, но..."
1009602-56 = "...он, пожалуй, показывает слишком многое."
1009602-57 = "[s] «А мне как раз нравится его смелость...»"
1009602-58 = "И всё же лучше что-то немного скромнее... например, вот этот."
1009602-59 = ""
1009602-61 = ""
1009602-62 = "Простой дизайн, достаточно закрытый, а с повязкой спасателя меня будет легко узнать издалека."
1009602-63 = "Что думаете, Сенсей?"
1009602-64 = "[s] «Думаю, ты права, Канна.»"
1009602-65 = "Хорошо. Тогда я его примерю."
1009602-66 = "..."
1009602-67 = "Простите, Сенсей, но если вы не против..."
1009602-68 = "[s7] «Ой! Прости!»\n[s8] «Я забыл, что мы в раздевалке!»"
1009602-73 = ""
1009602-74 = "Ну, как выглядит?"
1009602-75 = "[s9] «Думаю, тебе идёт.»\n[s10] «Мило. Определённо подходит!»"
1009602-77 = "П-Пожалуйста, не называйте меня «милой»."
1009602-78 = "Это определение мне совершенно не подходит."
1009602-79 = "И... хорошо! Значит, беру этот."
1009602-80 = "Хм, я попросила вашей помощи, а в итоге всё равно выбрала сама."
1009602-81 = "Простите, что заставила вас прийти сюда зря."
1009602-82 = "[s] «Не переживай.»"
1009602-83 = ""
1009602-86 = "[ns] «Я рад, что смог помочь тебе определиться.»"
1009602-87 = ""
1009602-89 = ""
1009602-90 = "...Хорошо, тогда понятно."
1009602-91 = "Спасибо за помощь."
