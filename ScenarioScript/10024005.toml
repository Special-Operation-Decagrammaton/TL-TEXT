[translation]
10024005-121 = "#video;10024"
10024005-1 = "Пролог;Добро пожаловать, гость. Радушное гостеприимство"
10024005-3 = "Я занимался обычной офисной работой в Шале, когда..."
10024005-4 = ""
10024005-6 = "*звонок* *звонок*"
10024005-7 = ""
10024005-9 = "[ns] «О, это мой телефон...»"
10024005-11 = "[ns] «Алло?»"
10024005-13 = ""
10024005-14 = "Здравствуйте. Это номер [USERNAME] Сенсея из Шале?"
10024005-15 = "[s1] «Да. Могу узнать, кто звонит?»\n[s2] «Вы позвонили в голосовую почту...»"
10024005-16 = "Простите, что так внезапно звоню, хотя мы даже не знакомы..."
10024005-17 = "Я Акэширо Руми, президент Променада Чёрной Черепахи."
10024005-18 = "О, вы любите шутки. Это должно немного облегчить общение."
10024005-19 = "Хотя над чувством юмора вам бы не помешало поработать..."
10024005-20 = "[s3] «Я просто... пытаюсь разрядить обстановку...»"
10024005-21 = "Ха-ха-ха! Что ж, в следующий раз жду уже ХОРОШУЮ шутку."
10024005-22 = "Я Акэширо Руми. Я представляю торговцев Променада Чёрной Черепахи как их президент."
10024005-23 = "[s] «Привет, Руми. Чем могу помочь?»"
10024005-24 = "У меня есть, скажем так... просьба. Или заказ."
10024005-25 = "Променаду Чёрной Черепахи нужна ваша помощь."
10024005-26 = "[s] «Когда ты так говоришь, всё звучит официально. И серьёзно. И немного пугающе.»"
10024005-27 = "Ну-ну, я не хочу, чтобы вы неправильно поняли."
10024005-28 = "Наверное, это и правда официально. И довольно серьёзно... в какой-то степени..."
10024005-29 = "И страшно... Ну да, страшно... Ладно. Вы всё угадали."
10024005-30 = "У вас что, какие-то экстрасенсорные способности? Мысли читаете?"
10024005-31 = "[s4] «Я просто чувствую обстановку, Руми.»\n[s5] «Вот бы у меня были экстрасенсорные способности...»"
10024005-34 = "Неужели...?"
10024005-35 = "В любом случае о моей просьбе беспокоиться не нужно. Она может быть официальной, но остальные ваши слова... преувеличение."
10024005-36 = "[s] «Конечно, сейчас ты так и говоришь...»"
10024005-37 = "Я хочу пригласить вас в гости к Променаду Чёрной Черепахи."
10024005-38 = "Признаюсь, мне любопытно лично встретиться со знаменитым Сенсеем."
10024005-39 = "[s6] «Приглашение на Променад Чёрной Черепахи? Как тут отказать?»\n[s7] «И я тоже не могу дождаться встречи со знаменитым Президентом Руми.»"
10024005-42 = "Прекрасно! Похоже, мы понимаем друг друга."
10024005-43 = "Буду ждать встречи, Сенсей."
10024005-44 = "[s] «Ты ведь не замышляешь ничего плохого, правда?»"
10024005-45 = "Ха-ха-ха! А если замышляю, что вы будете делать?"
10024005-46 = "Будете доверять своему студенту до самого конца?"
10024005-47 = "А если я сделаю что-нибудь плохое — отчитаете меня?"
10024005-48 = "..."
10024005-49 = "Ха. Я даже немного завидую вашим ученикам, Сенсей."
10024005-50 = "О... Я ведь тоже одна из ваших студентов?"
10024005-51 = "Вы так легко говорите такие вещи... Даже не знаю, что ответить."
10024005-52 = "Тогда решено. Обещаю, что буду защищать вас, пока заказ не будет выполнен."
10024005-53 = "[s] «А сама ты тоже довольно легко такое говоришь.»"
10024005-54 = "Простите, пожалуй. Наверное, в таких вещах я немного нечуткая."
10024005-55 = "[s] «Постарайся такой не быть.»"
10024005-56 = "Ха-ха-ха. Мне нужно кое-что подготовить. Увидимся на Променаде Чёрной Черепахи."
10024005-57 = "Ждите с нетерпением. Я угощу вас такими лакомствами, каких вы ещё никогда не пробовали."
10024005-59 = "Чуть позже я отправился к Променаду Чёрной Черепахи в Шаньхайцзине."
10024005-60 = ""
10024005-64 = "Променад Чёрной Черепахи"
10024005-65 = "[ns8] «Так вот он, Променад Чёрной Черепахи.»\n[ns9] «Рассказы и близко не передают впечатления...»"
10024005-68 = ""
10024005-70 = ""
10024005-72 = ""
10024005-73 = "Пахнет восхитительно, правда?"
10024005-74 = "Давайте, вдохните поглубже! Этот неповторимый, маслянистый, аппетитный аромат!"
10024005-75 = "[s] «А...?»"
10024005-76 = "Вы ведь приезжий, да? Добро пожаловать в Шаньхайцзин!"
10024005-77 = "Сюда, уважаемый клиент, к деликатесам, каких вы ещё никогда не пробовали!"
10024005-79 = "Сюда, сюда! Для вас есть место в закусочной «Бамбуковая Панда»! Наш суп с тофу — просто объедение!"
10024005-80 = "Наш особый золотой соус готовится из тыквы и грибов, которые тушатся в горшочке вместе с тофу!"
10024005-82 = "Не тратьте время на тофу. Настоящая жемчужина Променада — «Курица Великой Горы»!"
10024005-84 = "У нас курицу готовят на пару в глиняном горшке, а потом из её сока варят лучший бульон, который вы когда-либо пробовали!"
10024005-85 = "Наша курица насыщена вкусом, а мясо нежное и ароматное."
10024005-86 = "Это лёгкий, освежающий суп с глубоким куриным вкусом!"
10024005-88 = "Не смешите. Курицу на пару можно поесть где угодно!"
10024005-89 = "И слышать такое от торговца тофу я не собираюсь. Наш клиент не овца, которой достаточно жевать траву!"
10024005-91 = "Свежие овощи успокаивают желудок и очищают кровь!"
10024005-93 = "А без полного живота счастья не будет! Клиенту нужно мясо!"
10024005-95 = ""
10024005-97 = ""
10024005-99 = "[ns] «Простите... О чём вообще речь...?»"
10024005-100 = "Я рада, что вы обе так гордитесь своими заведениями, но этот человек — мой гость."
10024005-101 = "П-президент Руми?"
10024005-102 = "О-он в-ваш гость?"
10024005-103 = "[s] «Вот ты где, Руми!»"
10024005-104 = "Добро пожаловать, Сенсей. Простите, что не встретила вас у ворот. Тогда мы могли бы избежать этой... неприятности."
10024005-105 = "М-мы не хотели создавать проблемы!"
10024005-106 = "Нам ужасно жаль! Хорошего вам дня!"
10024005-108 = ""
10024005-113 = "Я столько раз говорила им быть поспокойнее, но они не слушают..."
10024005-114 = "Хм? Вы подумали, что это было впечатляющее приветствие?"
10024005-115 = "О, Сенсей. Приветствие ещё даже не началось."
10024005-116 = "Я покажу вам, что значит быть гостем Променада Чёрной Черепахи."
10024005-117 = "Без лишних слов..."
10024005-118 = "Добро пожаловать на Променад Чёрной Черепахи!"