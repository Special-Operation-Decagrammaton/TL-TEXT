[translation]
2601505-1 = "Глубочайшая Ложь"
2601505-3 = ""
2601505-4 = ""
2601505-5 = "Привет, Сенсей."
2601505-6 = ""
2601505-8 = "Простите, что позвала вас сюда так поздно."
2601505-9 = "Так вот, эм, помните ту нашу небольшую прогулку? Наверное, «сеанс психологической помощи» будет точнее."
2601505-10 = "С тех пор я всё время о ней думаю..."
2601505-11 = "[s1] «А, не переживай! Я понимаю, о чём ты!»\n[s2] «Я всё прекрасно понимаю!»"
2601505-14 = "Значит, мы действительно на одной волне."
2601505-15 = "Наверное, стоит отдать должное так называемой «магии ночного моря»."
2601505-16 = "Из-за неё я наговорила больше, чем следовало."
2601505-17 = "В общем, я была бы очень благодарна, если бы вы просто забыли, что это когда-либо происходило."
2601505-18 = "[s3] «Ичика, я всегда приму тебя!»\n[s4] «Какой бы ты ни была!»"
2601505-21 = ""
2601505-23 = ""
2601505-24 = "А?"
2601505-25 = "Нет, я не это хотела..."
2601505-26 = "..."
2601505-27 = "Хм..."
2601505-28 = "Похоже, такими словами до вас не достучаться."
2601505-29 = "...В таком случае."
2601505-30 = "Сенсей, вы сказали, что примете меня..."
2601505-31 = ""
2601505-33 = ""
2601505-34 = ""
2601505-35 = "...несмотря ни на что, верно?"
2601505-36 = "[s] «Эм, Ичика...?»"
2601505-39 = "― [log=이치카 수영복]Вы, случайно, не заблуждаетесь на наш счёт?[/log][wa:2070]"
2601505-42 = "― [log=이치카 수영복]Вы знаете, насколько опасной может быть эта милая и хрупкая[/log][wa:510]"
2601505-44 = "― [log=이치카 수영복]леди из Тринити? [/log][wa:1290]"
2601505-47 = "― [log=이치카 수영복]Отряд правосудия[/log][wa:3730]"
2601505-49 = "― [log=이치카 수영복]берётся за самые тяжёлые дела Тринити.[/log][wa:10]"
2601505-52 = "― [log=이치카 수영복]Вы ведь видели, что мы все носим чокеры.[/log][wa:410]"
2601505-54 = "― [log=이치카 수영복]А что, если я скажу, что на самом деле это...[/log][wa:2130]"
2601505-57 = "― [log=이치카 수영복]ошейник?[/log]"
2601505-60 = "― [log=이치카 수영복]Есть только одна причина надеть на кого-то ошейник.[/log][wa:10]"
2601505-63 = "― [log=이치카 수영복]Вы умный человек, Сенсей,[/log][wa:420]"
2601505-65 = "― [log=이치카 수영복]так что, думаю, мне не нужно объяснять подробнее.[/log]"
2601505-68 = "― [log=이치카 수영복]И, наверное, не нужно объяснять,[/log]"
2601505-70 = "― [log=이치카 수영복]что происходит, когда этот ошейник[/log]"
2601505-73 = "― [log=이치카 수영복]снимают, верно? [/log][wa:1680]"
2601505-76 = "― [log=이치카 수영복]...Простите.[/log][wa:1500]"
2601505-78 = "― [log=이치카 수영복]Моя маленькая шутка зашла слишком далеко.[/log]"
2601505-81 = "― [log=이치카 수영복]Но именно поэтому[/log][wa:10]"
2601505-83 = "― [log=이치카 수영복]не стоит так легкомысленно раздавать обещания.[/log]"
2601505-86 = "― [log=이치카 수영복]Что бы вы сделали,[/log][wa:180]"
2601505-88 = "― [log=이치카 수영복]если бы я действительно оказалась опасным человеком? [/log][wa:10]"
2601505-91 = "[ns5] «Вот это меня удивило...»\n[ns6] «Так ты тоже умеешь так шутить, Ичика.»"
2601505-94 = "― [log=이치카 수영복]Ха-ха. [/log][wa:3160]"
2601505-96 = "― [log=이치카 수영복]Это только для ваших глаз, Сенсей. Так что...[/log][wa:2260]"
2601505-99 = "― [log=이치카 수영복]этот маленький случай[/log][wa:800]"
2601505-101 = "― [log=이치카 수영복]унесём с собой в могилу, хорошо?[/log]"
2601505-104 = ""
2601505-105 = ""
2601505-106 = ""
2601505-107 = "..."
2601505-108 = "[s7] «...»\n[s8] «(Неловкость просто душит.)»"
2601505-111 = "...Всё вышло совсем не так, как я хотела."
2601505-112 = "Кажется, я облажалась."
2601505-113 = "Эм..."
2601505-114 = "Давайте просто переспим с этой мыслью, хорошо?"
2601505-116 = "Ичика практически вытолкала меня обратно в мою комнату."
