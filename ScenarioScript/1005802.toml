[translation]
1005802-1 = "Повсюду"
1005802-3 = ""
1005802-4 = "Добро пожаловать, Сенсей. Спасибо, что нашли время встретиться со мной."
1005802-5 = "[s] «Я пришёл, потому что ты позвала, но... Что происходит?»"
1005802-6 = "Если коротко, это патруль помощи."
1005802-7 = "Что такое патруль помощи? Это когда мы одновременно патрулируем улицы и оказываем помощь."
1005802-8 = "Никто не знает, когда и где кому-нибудь понадобится помощь."
1005802-9 = "Так что можно сказать, истинная цель такого патруля — самим искать места, где может понадобиться помощь."
1005802-10 = "Всё в порядке, Сенсей. В конце концов, это дело, которое может спасти чью-то жизнь."
1005802-11 = "А значит, и для нас самих никакой опасности быть не должно."
1005802-12 = "...Наверное."
1005802-13 = ""
1005802-16 = "[ns] «Наверное?!»"
1005802-17 = ""
1005802-20 = "Уаа! Уааа!"
1005802-21 = "Хм?! Там плачет ребёнок, Сенсей!"
1005802-22 = "Это мощнейшее предчувствие необходимости помощи!"
1005802-23 = ""
1005802-26 = ""
1005802-29 = ""
1005802-34 = "Почему ты плачешь? Что-то случилось?"
1005802-35 = ""
1005802-38 = "Щенок..."
1005802-39 = "Щенок?"
1005802-40 = ""
1005802-43 = "Он упал за ту старую треснувшую стену и теперь не может выбраться..."
1005802-44 = "Подожди, дай посмотрю..."
1005802-45 = ""
1005802-47 = ""
1005802-48 = ""
1005802-49 = "Мине наклонилась, чтобы заглянуть внутрь треснувшей стены."
1005802-50 = "И правда. К тому же он забрался довольно глубоко..."
1005802-51 = ""
1005802-53 = ""
1005802-54 = "Я... не могу... дотянуться. Ни руками. Даже если попробовать удлинить руку оружием..."
1005802-55 = "Но я вижу, что он как-то повредил ногу. Ему тяжело ею двигать."
1005802-56 = "Тогда... он сам не сможет выбраться?"
1005802-57 = "УААААА!"
1005802-58 = ""
1005802-60 = ""
1005802-61 = "..."
1005802-62 = "Не волнуйтесь."
1005802-63 = "Рыцари помощи никогда не будут просто стоять и смотреть, когда кому-то нужна помощь."
1005802-64 = ""
1005802-66 = ""
1005802-68 = "[ns1] «Эй, Мине? Что ты собираешься делать...?»\n[ns2] «Эм, Мине...?»"
1005802-69 = ""
1005802-70 = ""
1005802-71 = ""
1005802-72 = ""
1005802-74 = "Ха-а-а!"
1005802-75 = ""
1005802-79 = "БУУУМ!"
1005802-80 = "Кья!"
1005802-81 = "[ns] «Ого!»"
1005802-82 = "Мине полностью разрушила треснувшую стену!"
1005802-83 = "Это было сверхэффективно!"
1005802-86 = ""
1005802-87 = "Ну вот... Держи своего щенка."
1005802-88 = "Как я и думала, он повредил ногу. Пожалуйста, подожди немного."
1005802-89 = ""
1005802-91 = ""
1005802-94 = "Мине умело обработала раненую лапу щенка."
1005802-97 = "Сестрёнка...? Спасибо! Огромное спасибо!"
1005802-98 = "Я уже не знала, что делать! Рыцари помощи — лучшие!"
1005802-99 = ""
1005802-107 = "Хи-хи."
1005802-108 = "Хорошо, что всё закончилось благополучно."
1005802-109 = ""
1005802-112 = ""
1005802-113 = "А-а-а-а?!!"
1005802-114 = ""
1005802-116 = ""
1005802-117 = "Дом моего отца?!"
1005802-119 = "Тот самый дом, который я пытался сохранить, несмотря на все трещины, исполняя его последнюю волю?"
1005802-121 = "Ч-что...?!"
1005802-126 = "[s] «М-мне очень жаль!!!»"
1005802-127 = "Мы извинились перед владельцем дома."
1005802-130 = ""
1005802-131 = ""
1005802-132 = "[ns] «Это был довольно крупный инцидент...»"
1005802-133 = "Да. Крупный инцидент..."
1005802-134 = "Но хорошо, что мы смогли спасти щенка."
1005802-135 = "[s] «Тебе совсем не жаль, Мине? Мы попали в такие неприятности...»"
1005802-136 = ""
1005802-138 = ""
1005802-139 = "Нисколько!"
1005802-140 = "Всё это было ради спасения жизни. Как я вообще могу сожалеть о таком пути?"
1005802-141 = "Если бы мне пришлось вернуться назад и сделать этот выбор снова, я сто раз разрушила бы стену и сто раз извинилась!"
1005802-142 = "[s] «Да. Думаю, это тоже было правильно.»"
1005802-143 = "Вот как? Я рада, что мы с тобой думаем одинаково, Сенсей."
1005802-144 = ""
1005802-147 = "Хм? Это грузовик едет по переулку?"
1005802-148 = "[s] «А прямо перед ним ребёнок, который внезапно выбежал непонятно откуда?!»"
1005802-149 = "Уааа?"
1005802-150 = "Я уже иду!"
1005802-151 = ""
1005802-162 = "Мине схватила ребёнка и встала перед грузовиком, закрывая его собой!"
1005802-163 = "Бампер грузовика был полностью смят."
1005802-166 = "Ты в порядке? Нигде не больно?"
1005802-167 = "Я... Я в порядке."
1005802-168 = "Ты лучшая! Ты потрясающая!"
1005802-169 = "Ху-ху. Какое облегчение."
1005802-170 = "[s] «Выходя из переулка, нужно смотреть по сторонам...»"
1005802-171 = "Простите..."
1005802-172 = ""
1005802-175 = ""
1005802-176 = "А-а-а?! Бампер... и двигатель?!"
1005802-178 = "Мой совершенно новый грузовик, который я заказал только на прошлой неделе и который мне доставили лишь вчера?!"
1005802-179 = ""
1005802-182 = "Мы извинились перед владельцем грузовика."
1005802-186 = "Кот, который забрался на дерево и не может спуститься!"
1005802-189 = "Робот-гражданин в отчаянии, потому что не может достать из магазина ланч-боксы с истекающим сроком годности!!"
1005802-193 = "Член байкерской банды, попавший между дерущимися шлемоголовыми гангстерами и хулиганами!!!"
1005802-195 = "«Помощь» Мине продолжалась весь день и после этого."
1005802-196 = "В какой-то момент стало трудно понять, что вообще считается помощью, а что нет..."
1005802-200 = "Отличная работа, Сенсей."
1005802-201 = "[s] «Это... уже всё?»"
1005802-202 = "Да. На сегодня патруль окончен."
1005802-203 = ""
1005802-206 = "Что такое? Ты спросил, занимаюсь ли я этим каждый день?"
1005802-207 = "Я действительно думаю, что патрулировать ради помощи людям стоило бы ежедневно..."
1005802-208 = "Теперь, когда я задумалась, похоже, сегодня людей, нуждавшихся в помощи, было необычно много."
1005802-209 = "Но думаю, всё равно хорошо, что мы широко распространили дело Рыцарей помощи."
1005802-210 = "Но что важнее, Сенсей, после того как я провела с тобой весь день..."
1005802-211 = "Разве у нас не отличная совместимость?"
1005802-212 = "[s] «Х-хм...? Если подумать... наверное.»"
1005802-213 = "Так я и думала! Ты тоже так считаешь!"
1005802-214 = "Я не ошиблась."
1005802-215 = ""
1005802-217 = ""
1005802-219 = ""
1005802-220 = "У тебя превосходный талант к «помощи,» Сенсей!"
1005802-221 = "Как насчёт этого? Не хочешь стать членом Рыцарей помощи и распространять дух помощи ещё шире, среди ещё большего числа людей?"
1005802-222 = "[s3] «Пока что — нет, спасибо!»\n[s4] «Спасибо за предложение, но мне ещё многому предстоит научиться!»"
1005802-223 = "Понятно... Я немного разочарована."
1005802-224 = "Понятно... Я немного разочарована."
1005802-225 = "Но если когда-нибудь передумаешь, пожалуйста, скажи мне."
1005802-226 = "Место «советника» в Рыцарях помощи всегда будет открыто для тебя."
