[translation]
2600903-1 = "Новая подработка"
2600903-2 = "Исполнительный офис Шале"
2600903-3 = "На следующее утро я усердно работал в исполнительном офисе, когда..."
2600903-4 = ""
2600903-8 = ""
2600903-10 = "Нет! Это слишком!"
2600903-11 = "Я знаю, вы говорили, что в кафе немного посетителей... и что сотрудники добрые... но!"
2600903-12 = "Вы не сказали, что это мэйд-кафе!"
2600903-13 = "Я вам доверяла, Сенсей! Доверяла!"
2600903-14 = "[s1] «Успокойся, Юзу.»\n[s2] «Ты что, прибежала сюда прямо с подработки?»"
2600903-17 = "Эм, нет! Меня ещё только обучали... Кафе пока не открылось..."
2600903-18 = "Н-но менеджер сказал, что при подаче еды нужно делать милую позу, и поэтому..."
2600903-19 = "Эм... я сбежала."
2600903-20 = ""
2600903-22 = ""
2600903-23 = "Ч-что мне делать? Менеджер наверняка недоволен, что я исчезла прямо посреди обучения! О нет..."
2600903-24 = "[s] «Я позвоню в кафе и всё объясню.»"
2600903-25 = "А... эм... спасибо."
2600903-27 = "[ns3] «Я не думал, что тебе будет настолько тяжело.»\n[ns4] «Прости, что нормально всё не объяснил.»"
2600903-30 = "Нет... Всё нормально. Наверное, это моя вина. Из-за моей застенчивости со мной постоянно случаются такие вещи..."
2600903-31 = "И всё было, как вы говорили. Все сотрудники очень добрые. Но... ещё они очень... энергичные."
2600903-32 = "Я даже не успела закончить представляться, как меня внезапно переодели в форму горничной и сразу начали обучение..."
2600903-33 = "Когда я услышала, что мне придётся встречаться с кучей незнакомцев... одетой горничной... у меня потемнело в глазах, и я..."
2600903-34 = "[s] «Здесь нет незнакомцев, Юзу. Дыши глубже.»"
2600903-35 = "Х-хорошо... Но..."
2600903-36 = "Что мне делать? Я уже не могу отказаться... В конце концов, это вы познакомили меня с этим местом, и я не хочу подводить других сотрудников... Они были так добры ко мне..."
2600903-37 = "С незнакомцами я, может быть, ещё смогу разговаривать, но милые позы?"
2600903-38 = "[s] «Может, сначала потренируешься?»"
2600903-39 = "П-потренируюсь? Как?"
2600903-40 = "[s5] «Сначала можешь отрепетировать обязанности горничной с кем-то, к кому уже привыкла.»\n[s6] «А пока просто представь, что я хозяин мэйд-кафе!»"
2600903-43 = "Понятно... Практика горничной с вами."
2600903-44 = "Наверное, так можно. Это не так страшно, ведь я вас знаю."
2600903-45 = "Даже если я немного опозорюсь, ничего страшного..."
2600903-46 = "Хорошо! Я готова! Я, Ханаока Юзу, постараюсь изо всех сил!"
2600903-48 = "Мы с Юзу начали тренировку горничной."
2600903-49 = ""
2600903-50 = "Д-д-д-добро пожаловать... Г-господин!"
2600903-51 = "[s] «Неправильно!»"
2600903-52 = "А-а? Я уже умудрилась ошибиться?"
2600903-53 = "[s7] «Если горничная здесь, значит, это дом Господина.»\n[s8] «Правильно говорить „с возвращением“, а не „добро пожаловать“!»"
2600903-56 = "П-понятно... Похоже, я ещё многого об этом не знаю..."
2600903-57 = "Хорошо. С-с возвращением, Господин?"
2600903-59 = ""
2600903-60 = "В-вот ваш омурайсу..."
2600903-61 = "[s] «А? И всё?»"
2600903-62 = "Ч-что? Я снова что-то пропустила?"
2600903-63 = "[s] «Ты не произнесла заклинание, которое делает еду вкуснее.»"
2600903-64 = "Есть заклинание... которое делает еду вкуснее?"
2600903-65 = "А... <Стань вкуснее! Моэ-моэ, кюн-кюн>?"
2600903-66 = "И-и вы правда думаете, что от этого еда станет вкуснее?"
2600903-67 = "[s9] «Конечно.»\n[s10] «Разве ты не знаешь, что любовь — самый важный ингредиент?»"
2600903-70 = "Если вы так говорите, Сенсей..."
2600903-71 = "С-стань вкуснее... М-моэ-моэ, к-кюн... кюн!"
2600903-73 = ""
2600903-76 = ""
2600903-77 = ""
2600903-78 = ""
2600903-79 = ""
2600903-80 = "А-ай! Простите! Простите, я споткнулась..."
2600903-81 = "И-и испачкала вашу одежду едой. Мне так жаль!"
2600903-82 = "...Что? Как это может быть хорошо?"
2600903-83 = "То есть вы хотите сказать... что это подчеркнуло моэ-очарование неуклюжей горничной..."
2600903-84 = "Мир горничных такой сложный..."
2600903-90 = "А я... вымоталась."
2600903-91 = "Но, кажется, тренировка помогла. Теперь мне кажется, что я смогу встречать посетителей..."
2600903-92 = "Хотя, если честно, я всё ещё не уверена, как всё пройдёт."
2600903-93 = "Но большое спасибо за помощь."
2600903-94 = "И, Сенсей... Может быть, когда-нибудь потом, когда я немного освоюсь..."
2600903-95 = "Пожалуйста, приходите ко мне на подработку!"
2600903-96 = "Я отплачу за вашу помощь лучшим гостеприимством, на какое способна."
