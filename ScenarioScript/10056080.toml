[translation]
10056080-1 = "Episode 8; Sea Dragon"
10056080-4 = "Dragon Queen! We have tied them up!"
10056080-5 = "Umu. Good work."
10056080-6 = "It must be stifling, but do be patient."
10056080-7 = "I cannot let you roam free until I know that I can trust you."
10056080-8 = "As soon as I have confirmed that our interests are aligned, I shall untie you apace."
10056080-9 = "After that, we may talk."
10056080-10 = "[s] \"Are you the Sea Dragon?\""
10056080-11 = "Insolence!"
10056080-12 = "How dare you speak without the Dragon Queen's permission!"
10056080-13 = "I do not mind. Sensei comes from outside of Kivotos. #nIt comes as no surprise that they are unaware of my majesty."
10056080-14 = "Moreover, I have heard that they are in possession of an extrajudicial authority. #nIt is said that each and every one of Kivotos' most influential parties are wary of it."
10056080-15 = "If such is the case, perchance they are worthy of speaking with me as an equal."
10056080-16 = "So then, Sensei. What shall you do if I am indeed the Sea Dragon?"
10056080-17 = "[s] \"Why do you call yourself the 'Dragon Queen?'\""
10056080-18 = "You certainly have heard of the legend of the Dragon Queen."
10056080-19 = "Rivers, lakes and even the oceans—all places with water fall under her dominion, #nand bend waves and winds according to her will as a supernatural being."
10056080-20 = "After much consideration—"
10056080-26 = "I decided there was no name more befitting of myself, and I became thus."
10056080-27 = "Huh? Ain't your name Nanami?"
10056080-28 = "Hey! Shut up!"
10056080-33 = "[ns1] \"Can the Sea Dragon...\"\n[ns2] \"Actually, no. Can Nanami really control the waves and winds?\""
10056080-36 = "...She can't. She's just a normal student."
10056080-37 = "However, if we set that aside, #nthe Sea Dragon— Gonokami Nanami—does possess a talent for voyaging."
10056080-38 = "[s] \"A talent for voyaging?\""
10056080-39 = "Yes. I've heard that she can not only forecast the direction of the waves, but even when a storm will come."
10056080-40 = "Apparently, she's even more accurate than supercomputers dedicated to weather forecasting."
10056080-41 = "At one point, she was even recommended as a candidate for the next captain of Island."
10056080-42 = "[s] \"So why did she end up in the Correction Bureau...?\""
10056080-43 = "As you can see, the way she thinks is a bit... particular."
10056080-44 = "She believes herself to be the Dragon Queen chosen by the sea, and that everything else holds no worth."
10056080-45 = "What's more, there are a number of people who are enthralled by her ability and worship her."
10056080-46 = "There was a time when the size of her band of pirates exceeded that of Trident."
10056080-47 = "However, they all scattered when she was thrown into the Correction Bureau."
10056080-48 = "When did she manage to gather such a large fleet...?"
10056080-49 = "[s] \"That's true...\""
10056080-50 = "I do not mind you whispering amongst yourselves, but trying to devise a way to#nescape is futile."
10056080-51 = "Know this: our encounter here was no simple coincidence."
10056080-55 = "Wait, so the client..."
10056080-56 = "Naturally, they were one of my loyal retainers."
10056080-57 = "But mind you, the idea to plant a mine on that ship was my own."
10056080-58 = "I should've known y'all were behind that!"
10056080-59 = "Mines do look like barnacles..."
10056080-60 = "...So you blew up that ship to force us into debt, then tried to exploit that#nweakness?"
10056080-61 = "Don't look at me like that. I am being genuine when I say that I shall grant what#nyou desire."
10056080-62 = "If you retrieve the treasure at the bottom of the ocean, then I will reward you handsomely as I had promised."
10056080-66 = "There was no shipwreck in that blue hole."
10056080-67 = "What laid at rest there was being guarded by the whales..."
10056080-68 = "Hoh! So you have seen it already. That will speed things up."
10056080-72 = "For centuries, decrepit whales have gathered here in search of peace and#ntranquil... The Graveyard of Whales."
10056080-74 = "These whales are drawn here, lured by the gasses rising from the seabed. #nThey mistake it for the calls of their own kind, yet it is nothing more than an#nauditory hallucination."
10056080-75 = "But most fortuitous of all, the water in this blue hole does not mix with the#nsurrounding seawater. As such, there is a high chance that the whale bones#nand ambergris remain intact."
10056080-77 = "I'm sure you've figured out what it is that I want by now."
10056080-78 = "...You want us to bring you these treasures."
10056080-79 = "It goes for a hefty price on the black market."
10056080-80 = "In order to rebuild the Dragon Palace, it is necessary to bestow upon the people of#nthe and the treasures of the sea."
10056080-81 = "Hm, judging from the market price of ambergris as of late..."
10056080-85 = "—Three chunks will be sufficient."
10056080-86 = "But..."
10056080-90 = "This is an act of desecration against the dead."
10056080-91 = "How terribly sentimental of you. Do you truly believe that a pile of rotting bones#nand organs has any sanctity?"
10056080-92 = "Rather, sacrificing their bodies for the Dragon Queen's grand undertaking would#nbe for them a most glorious end."
10056080-93 = "The entire sea is mine. Whose permission do I need?"
10056080-94 = "...And what happens if we refuse?"
10056080-95 = "There is only one punishment for an insubordinate retainer."
10056080-96 = "How does a voyage sound? One where you are tied to the side of a hull encrusted with barnacles."
10056080-97 = "[s] \"H-haha. It sounds like it would be very painful...\""
10056080-101 = "I'm not joking here."
10056080-105 = "You best not be under the impression that we're here merely to make small talk."
10056080-106 = "It would be a hassle if Trident were to interfere, so let's make this quick."
10056080-110 = "You have ten seconds to decide."
10056080-111 = "Either you submit as my retainers and retrieve the treasure for me, or go on#na voyage barnacled ship."
10056080-112 = "H-hold on a moment...!"
10056080-113 = "10... 9... 8..."
10056080-114 = "No matter the case, doing something like this is..."
10056080-115 = "7... 6..."
10056080-120 = "[ns] \"If you're after the ambergris, then you should've said so earlier.\""
10056080-121 = "Hm?"
10056080-122 = "What are you trying to say?"
10056080-123 = "If you're driveling in order to buy time, then—"
10056080-124 = "[s3] \"We don't have the right tools with us.\"\n[s4] \"If you'd told us this straight from the start, then we would've come prepared.\""
10056080-130 = "Wh-what?"
10056080-135 = "[ns5] \"Could you play along for now?\"\n[ns6] \"Pretend that you currently can't do it.\""
10056080-138 = "G-got it...!"
10056080-139 = "It's true! If we'd known it was this kind of request, then we would've#ncome here perfectly prepared."
10056080-140 = "B-but, it's impossible to do it with what we've currently got on board."
10056080-144 = "We didn't know it would be this deep, so we brought nitrox tanks. #nThese are susceptible to oxygen toxicity, so they aren't usable at greater depths. #nAt these depths, heliox or trimix would have been a better option."
10056080-145 = "For deep sea diving, trimix is preferred because of its thermal conductivity, #nbut because it contains nitrogen, the exact mixture needs to be calculated beforehand... #nBecause of that, it's unsuitable when diving in a new location, like right now..."
10056080-146 = "In that case, we'll need heliox, though it is a bit pricy... #nIf only we were told ahead of time, we would've brought it with us from Odyssey—"
10056080-147 = "Hey! Shut up! #nQuit prattling on about all this nonsense!"
10056080-148 = "You. Is what they said true?"
10056080-149 = "P-please forgive my ignorance. #nI'm not exactly well versed in diving..."
10056080-150 = "I didn't know that different equipment would be needed depending on the#nlocation..."
10056080-151 = "You fools! To think you would attempt such a great undertaking without even#ncomprehending the scale of it all."
10056080-155 = "...Hmph. If that is the case, then I shall have it be arranged."
10056080-156 = "Until then, steel yourselves."
10056080-157 = "[s] (A chance to catch our breaths...)"
10056080-158 = "And don't even think about running away."
10056080-166 = "All you should do is pray—pray that no misfortune will fall upon your Sensei."
10056080-170 = "That's all. Make the most of your brief respite."
10056080-175 = "I'm so freaking pissed off..."
10056080-176 = "Sayuri agrees with the one on the right~"
10056080-180 = "..."