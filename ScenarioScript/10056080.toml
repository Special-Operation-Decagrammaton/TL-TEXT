[translation]
10056080-1 = "Episode 8;The Brackish Water Jiao Long"
10056080-4 = "Dragon King! We have tied them up!"
10056080-5 = "Hmm, good work."
10056080-6 = "It might be cramped, but bear with it for a little while."
10056080-7 = "Until I know I can trust you, I cannot simply let you go free."
10056080-8 = "Once we confirm our mutual interests, I will untie these ropes at once."
10056080-9 = "We can talk then."
10056080-10 = "[s] \"Are you the brackish water Jiao Long?\""
10056080-11 = "Insolent fool!"
10056080-12 = "Do not open your mouth without the Dragon King's permission!"
10056080-13 = "Never mind. Sensei of Schale is an outsider to Kivotos. #nIt is no wonder they do not know my majesty."
10056080-14 = "Furthermore, rumor has it that you possess extra-judicial authority. #nI hear that even the powers-that-be throughout Kivotos go out of their way to humor Sensei?"
10056080-15 = "If so, perhaps you are qualified to converse with me on equal terms."
10056080-16 = "Well then, [USERNAME] Sensei. What of it if I am the brackish water Jiao Long?"
10056080-17 = "[s] \"Why a 'Dragon King'?\""
10056080-18 = "Surely you have heard of the legends of the Dragon King at the very least?"
10056080-19 = "A Dragon King who rules over all places where water exists--from rivers and lakes to the sea--#nand commands the wind and waves at will."
10056080-20 = "After much thought over a long time--"
10056080-26 = "Nothing suited me better than 'Dragon King' to describe myself, so I adopted the name."
10056080-27 = "Uh, isn't your name Nanami?"
10056080-28 = "Silence, you!"
10056080-33 = "[ns1] \"The brackish water Jiao Long is--\"\n[ns2] \"Wait, is it true that Nanami controls the wind and waves?\""
10056080-36 = "...That is impossible. She is an ordinary student, too."
10056080-37 = "That aside, however, #nNanaomi Gokami--the brackish water Jiao Long--possesses a natural genius for navigation."
10056080-38 = "[s] \"A talent for navigation?\""
10056080-39 = "Yes. Just by sensing the tides and air currents, she supposedly knows the direction of the waves and when storms will arrive."
10056080-40 = "It is said her accuracy surpasses even a meteorological supercomputer."
10056080-41 = "At one point, she was even nominated to be the next captain of the Island."
10056080-42 = "[s] \"Then why is she in the Correction Bureau...?\""
10056080-43 = "Just look at her. Her way of thinking is a bit... off."
10056080-44 = "She thinks she is a Dragon King chosen by the sea, and that everything else is worthless."
10056080-45 = "Moreover, quite a few people are charmed and worship that ability of hers."
10056080-46 = "The scale of the pirate crew led by Nanami has even surpassed Trident at times."
10056080-47 = "Though they scattered when she was imprisoned in the Correction Bureau."
10056080-48 = "I wonder when she gathered a fleet...?"
10056080-49 = "[s] \"Indeed...\""
10056080-50 = "Whispering among yourselves is fine, but searching for an escape route is a waste of time."
10056080-51 = "Because our meeting here is no coincidence."
10056080-55 = "Could that client also be..."
10056080-56 = "Naturally, a loyal subject of mine."
10056080-57 = "Though the brilliant idea to plant sea mines on the ship's bottom was mine."
10056080-58 = "I knew it was your doing!"
10056080-59 = "Sea mines look just like barnacles..."
10056080-60 = "...So you tried to blow up the ship, saddle us with debt, and exploit our weakness?"
10056080-61 = "Do not look at me like that. It is true that I will give you what you desire."
10056080-62 = "If you bring back treasures from the seabed, I will pay you a sufficient reward as promised."
10056080-66 = "There was no sunken ship in this blue hole."
10056080-67 = "What was sleeping on the seabed was something protected by the whales..."
10056080-68 = "Ho! Have you figured it out already? That saves time."
10056080-72 = "For hundreds of years, elderly whales have gathered here seeking peace... This is the 'Whale Graveyard'."
10056080-74 = "Lured by the gas rising from the seabed, the whales are drawn in. #nMistaking the hallucinations for the cries of their companions."
10056080-75 = "Best of all, this blue hole does not mix with the outside seawater. #nThus, there is a high probability that whale bones and ambergris remain intact."
10056080-77 = "Surely you can figure it out this much, can you not?"
10056080-78 = "...You mean you want us to bring back those treasures?"
10056080-79 = "Those fetch a high price on the black market, you see."
10056080-80 = "To rebuild the Dragon Palace, I must bestow the treasures of the sea upon the land-dwellers."
10056080-81 = "Hmm, the current market price for ambergris is about this much, so--"
10056080-85 = "--enough for about three whales should suffice."
10056080-86 = "But..."
10056080-90 = "That is an act of desecration against dead whales."
10056080-91 = "How sentimental. Do you think rotted bones and internal organs have dignity?"
10056080-92 = "If they can dedicate their bodies to the Dragon King's great enterprise, it can only be called a glorious curtain call."
10056080-93 = "This sea belongs entirely to me. Who needs permission for that?"
10056080-94 = "...What if we refuse the request?"
10056080-95 = "The punishment for subjects who disobey their sovereign is already decided."
10056080-96 = "How about a voyage tied to the barnacle-covered hull?"
10056080-97 = "[s] \"H-Ha-ha. That sounds terribly painful...\""
10056080-101 = "I am not joking."
10056080-105 = "You would be mistaken to think I came here to chat with you."
10056080-106 = "Interference from Trident would be troublesome, so let us make haste."
10056080-110 = "You have until the count of ten to decide."
10056080-111 = "Will you become my subjects and bring back the seabed treasures, or will you sail on a barnacle ship?"
10056080-112 = "W-Wait a second...!"
10056080-113 = "Ten, nine, eight..."
10056080-114 = "No matter what, something like that..."
10056080-115 = "Seven, six..."
10056080-120 = "[ns] \"If ambergris was your goal, you should have just said so from the start.\""
10056080-121 = "Hm?"
10056080-122 = "What are you trying to say?"
10056080-123 = "If that is just nonsense to buy time--"
10056080-124 = "[s3] \"We didn't bring our equipment.\"\n[s4] \"If we had known from the start, we would have prepared it.\""
10056080-130 = "W-What?"
10056080-135 = "[ns5] \"Will you play along with this?\"\n[ns6] \"Let's pretend we have no choice and stall for now.\""
10056080-138 = "Yes...!"
10056080-139 = "It is true! #nIf that was the request, we would have made thorough preparations..."
10056080-140 = "B-But with what we have on hand right now, it is impossible."
10056080-144 = "Not knowing it was this deep, we brought Nitrox cylinders. #nUsing those risks oxygen toxicity, so we cannot use them down deep. #nAt this depth, we should be using Heliox or Trimix."
10056080-145 = "Trimix is preferable considering thermal conductivity in the deep sea, #nbut since it contains nitrogen, we have to calculate the mixture in advance, so... #nIt is unsuitable for use in a place we are diving for the first time like this..."
10056080-146 = "In that case, Heliox is a bit expensive, but we need it... #nWe have it on the main Odyssey hull, so if we had known in advance, we would have brought--"
10056080-147 = "Silence! #nDo not babble nonsense!"
10056080-148 = "Master, is what they said true?"
10056080-149 = "A-Apologies. #nI am not very familiar with diving..."
10056080-150 = "I never imagined the required equipment would differ depending on the salvage location..."
10056080-151 = "Fools! To attempt a great undertaking without knowing even that much."
10056080-155 = "...Hmm. In that case, I shall have them prepared."
10056080-156 = "Rest up until then."
10056080-157 = "[s] (Can I catch a breather with this...)"
10056080-158 = "Do not even think about trying to escape."
10056080-166 = "I can only pray that no misfortune befalls Sensei."
10056080-170 = "Farewell then. Enjoy your brief leisure."
10056080-175 = "I am so, so pissed off..."
10056080-176 = "Same here~"
10056080-180 = "..."
