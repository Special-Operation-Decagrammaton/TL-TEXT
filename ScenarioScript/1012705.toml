[translation]
1012705-1 = "Мне нельзя?"
1012705-2 = "Я пришёл и стал ждать Миё."
1012705-4 = "Квартал винтажных магазинов"
1012705-5 = ""
1012705-6 = "[ns] «Фу-фу, наконец-то! Я уже целую вечность жду!»"
1012705-7 = "Это ещё что должно значить?"
1012705-8 = "Прошу прощения. Я пришла минута в минуту. За кого ты меня принимаешь?"
1012705-9 = "[s] «Эм... за королеву криминальных романов?»"
1012705-10 = "Это... в корне неверно!"
1012705-11 = "Хотя... соглашусь... определённые штампы я понимаю."
1012705-12 = "[s] «Ладно, так зачем ты меня сюда позвала?»"
1012705-13 = "У меня настоящая работа. Есть одна «вещь», которую нужно достать для клиента. Она в этом винтажном магазине."
1012705-14 = "...И, откровенно говоря, мне пригодилась бы ещё одна пара глаз. Хотелось бы быстро с этим разобраться."
1012705-15 = "[s1] «Всё как всегда, президент Миё...»\n[s2] «Не можешь устоять перед хорошим преступлением.»"
1012705-18 = "...Ещё одно дело. И всё. Потом завязываю. Стану законопослушной, клянусь."
1012705-19 = "[s] «Конечно!»"
1012705-20 = "Ух...!"
1012705-21 = "Хватит сарказма!"
1012705-22 = "[s3] «Эм, кстати...»\n[s4] «Как ты получила разрешение выйти сегодня?»"
1012705-25 = "А... Разрешение... Насчёт этого."
1012705-26 = "Ну, дело в том..."
1012705-27 = "...Я его не получала."
1012705-28 = "[s] «...Что?»"
1012705-29 = "В Вайлдхант есть Клуб свободных прогулок. Неофициальный, конечно."
1012705-30 = "Они помогли мне сбежать."
1012705-31 = "[s] «...Мне всё больше интересно, что вообще за академия эта Вайлдхант.»"
1012705-32 = "Ну... Это художественная школа. Разве не очевидно?"
1012705-33 = "А художники бывают со странностями. Если честно, здесь все немного... безумные."
1012705-34 = "[s] «И ты тоже?»"
1012705-35 = "Ну всё, пора за работу!"
1012705-36 = "[s] «Ты меня проигнорировала...!»"
1012705-39 = ""
1012705-40 = "Посмотри на эту печатную машинку, Сенсей! Модель MilkySweet 42! Только глянь на корпус!"
1012705-41 = "[s] «Какой милый дизайн.»"
1012705-42 = "Да. Но жаль, что она так и не стала популярной."
1012705-43 = "[s] «Интересно почему...»"
1012705-44 = "Видишь буквы? У этой клавиатуры особая раскладка. Производители заявляли, что она уникально эргономичная!"
1012705-45 = "Проблема лишь в том, что... люди не захотели заново учиться печатать. Тяжела жизнь новатора."
1012705-46 = "Модель сняли с производства после первой партии в миллион машинок."
1012705-47 = "[s5] «Миллион машинок для дебютной партии...?»\n[s6] «Насколько же они были уверены в себе...?»"
1012705-50 = "Ну, именно поэтому одна такая есть в моей коллекции. Так что их амбициям я даже благодарна!"
1012705-51 = "Хм? О! Смотри, Сенсей! Модель Demington, и в отличном состоянии. Ах! И подходящая к ней перьевая ручка!"
1012705-53 = "Мы продолжили разглядывать витрины антикварного магазина, останавливаясь у каждой печатной машинки."
1012705-54 = "Вдруг Миё остановилась перед неприметным магазинчиком."
1012705-56 = ""
1012705-57 = "Секундочку, Сенсей!"
1012705-58 = ""
1012705-60 = ""
1012705-62 = "Миё вышла из магазина с новым свёртком в руках."
1012705-64 = "Всё! Пойдём, Сенсей."
1012705-65 = "[s] «Что это за свёрток...?»"
1012705-66 = "А, это та самая... «вещь», которую я обещала Клубу свободных прогулок."
1012705-67 = "[s] «Клубу свободных прогулок?»"
1012705-68 = "Да. Это плата за то, что они помогли мне сбежать, и..."
1012705-69 = "...Ах."
1012705-70 = "[s7] «То есть ты пришла сюда не по работе...»\n[s8] «Ты просто хотела выбраться погулять!»"
1012705-73 = "Эм, ах, э-э..."
1012705-74 = ""
1012705-76 = ""
1012705-77 = "...Мне нельзя?"
1012705-78 = "[s9] «Конечно можно.»\n[s10] «Иногда каждому нужно немного свободы...»"
1012705-81 = "А мне можно сбегать наружу, если это ради встречи с тобой?"
1012705-82 = ""
1012705-85 = "[ns] «А?»"
1012705-87 = "[ns] «Со мной?!»"
1012705-88 = "В-В прошлый раз ты же сказал, что тоже хотел меня увидеть, разве нет?"
1012705-89 = "Ты сказал, что искренне, глубоко желал встретиться со мной. В MomoTalk!"
1012705-90 = "[s] «Не совсем такими словами, но...!»"
1012705-91 = "Т-Теперь понимаешь? Это ты плохой, Сенсей. Ты оказываешь на меня дурное влияние."
1012705-92 = "Так что хватит об этом. Пойдём!"
1012705-93 = "У нас ещё столько печатных машинок... и так мало времени."
1012705-95 = "Я продолжил ходить по рынку вместе с Миё."
