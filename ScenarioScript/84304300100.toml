[translation]
84304300100-5 = "Нэру вернулась в укрытие и рассказала Рио и Сэе, что произошло."
84304300100-6 = ""
84304300100-8 = "...Значит, вот что случилось."
84304300100-9 = "Тогда наш противник уже знает о Рио... и знает о ней больше, чем просто имя и должность."
84304300100-10 = "Надо это учитывать."
84304300100-11 = "Но, судя по всему, она ХОТЕЛА, чтобы мы знали, что она это знает, так что не стоит зацикливаться."
84304300100-12 = "...Ты слушаешь, Рио?"
84304300100-14 = "Слушаю. И это неважно."
84304300100-15 = "...Не то чтобы она сказала что-то особенно неверное."
84304300100-16 = "Вот, ты уже зацикливаешься. Я же только что сказала не делать этого."
84304300100-17 = "Факты есть факты. Мне просто нужно доказать, что я могу быть лучше."
84304300100-18 = "Доказать..."
84304300100-19 = "Я не это имею в виду..."
84304300100-20 = "Именно поэтому я здесь. Если хочу вернуться в Миллениум с высоко поднятой головой, мне нужно какое-то достижение."
84304300100-21 = "Как я и говорила тебе, Нэру."
84304300100-22 = "...Неважно. Думаю, я не смогу объяснить так, чтобы ты поняла."
84304300100-24 = "Достижение..."
84304300100-25 = "Давайте оставим это. Здесь человек из другой школы. Сейчас продолжать такой разговор было бы неуместно."
84304300100-26 = "Так какой наш следующий ход? Паршиво, но все зацепки сбежали. Будем просто стоять и ждать, пока они снова что-нибудь сделают?"
84304300100-27 = "Трудно сказать. Теперь, когда они знают, что мы их выслеживаем, действовать так нагло уже не станут."
84304300100-28 = "Мы НЕ будем «стоять и ждать, пока они что-нибудь сделают»."
84304300100-29 = "...Я надеялась, что до этого не дойдёт, но другого выбора нет. Пока всё не зашло ещё дальше, придётся принять радикальные меры."
84304300100-30 = ""
84304300100-32 = ""
84304300100-33 = "Радикальные меры?"
84304300100-34 = "Что ты имеешь в виду?"
84304300100-36 = "Я не рассказывала об этом ни одной из вас. На самом деле я вообще никому не рассказывала."
84304300100-37 = "Ещё до того, как я покинула школу... существовала СЛЕГКА другая система наблюдения. И теперь я снова могу получить к ней доступ."
84304300100-38 = ""
84304300100-40 = ""
84304300100-41 = "...Я собираюсь использовать Алгоритм Старшей Сестры."
