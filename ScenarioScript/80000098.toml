[translation]
80000098-1 = "Валентиново испытание"
80000098-3 = "Ах! Вот вы где, Сенсей!!"
80000098-4 = "[ns1] «Я знаю этот звук!!»\n[ns2] Спокойно принять защитную стойку."
80000098-5 = ""
80000098-12 = "Хьяяяяп!!"
80000098-13 = ""
80000098-16 = ""
80000098-20 = "Рейса врезалась в меня. Но это уже стало настолько привычным, что я без труда её поймал."
80000098-22 = "Наконец-то вы здесь, Сенсей! Я ждала вас!"
80000098-23 = "Наверняка вы уже знаете, правда? Сегодня особенный день! День, когда я возвращаю вам долг шоколадом!!"
80000098-24 = "Конечно, раз сегодня особенный день, вы наверняка очень заняты. К тому же у меня полно шоколадных конкурентов, которые тоже хотят встретиться с вами!"
80000098-25 = "Так что давайте быстрее! Не хочу отнимать слишком много вашего времени!"
80000098-26 = "Сегодняшнее дело... вот это!!"
80000098-27 = ""
80000098-29 = ""
80000098-31 = "[ns3] «Вызов на поединок? Постой, что-то не так!»\n[ns4] «Это... шоколад, верно?»"
80000098-34 = "Хи-хи-хи-хи! Как вы и сказали! Это шоколадное письмо-вызов!"
80000098-35 = "Конечно, на самом деле это просто обёртка поверх обычной шоколадки..."
80000098-36 = "Н-Но всё же письмо-вызов — это..."
80000098-37 = ""
80000098-41 = "[ns5] «Ничего себе. Оно довольно длинное.»\n[ns6] «Это больше похоже не на вызов, а на обычное письмо...»"
80000098-44 = "...!!"
80000098-45 = "Уаааааа!!"
80000098-46 = "Н-Нет! Сенсей, стойте! Нельзя читать это здесь!!"
80000098-47 = "А-А? Знаю, что письма-вызовы принято читать сразу! Н-Но всё равно..."
80000098-48 = "Н-Не надо! Только не сейчас!! Вернитесь в Шале и прочитайте там, хорошо?!"
80000098-49 = "У-ух..."
80000098-50 = "Т-Теперь, когда я об этом думаю..."
80000098-51 = "Уверена, остальные дарители шоколада вложили намного больше мыслей и заботы."
80000098-52 = "И наверняка их шоколад вкуснее. В конце концов мой — просто обычная плитка со словами сверху."
80000098-53 = "Я не очень умею что-то мастерить. И в шоколаде тоже почти не разбираюсь."
80000098-54 = ""
80000098-56 = ""
80000098-57 = "...Простите. Теперь ещё и моя болтовня отнимает ваше драгоценное время."
80000098-58 = "...Хм?"
80000098-59 = "Что?! Вам понравилось? К-Как?!"
80000098-60 = "[s7] «Нельзя быть храброй, если тебе не страшно.»\n[s8] «Несмотря на страх, ты всё же вручила мне подарок.»"
80000098-63 = "*ахает*"
80000098-64 = "Хех..."
80000098-65 = "...Хи-хи."
80000098-67 = "Мы поделили шоколад, а письмо-вызов Рейсы я прочитал уже после возвращения в Шале."
80000098-68 = "Это было самое милое письмо-вызов в мире: всё в наклейках и написано маркером."
