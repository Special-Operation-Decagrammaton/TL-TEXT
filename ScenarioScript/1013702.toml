[translation]
1013702-1 = "Первое впечатление детектива"
1013702-2 = "Я отправился в Валькирию, чтобы поговорить с Коно́кой по рабочим вопросам."
1013702-3 = "Чем могу помочь сегодня?"
1013702-4 = "Чем могу помочь сегодня?"
1013702-5 = "[s1] «Мне нужно поговорить с Конокой.»\n[s2] «Её нет за столом. Не знаешь, где её найти?»"
1013702-8 = "А, заместитель директора действительно отметилась на работе..."
1013702-9 = "Но у неё была другая... работа. Если спуститесь в подвал, должны её найти."
1013702-10 = "[s] «Работа» в подвале?"
1013702-11 = "Да. И дел у неё было довольно много, так что она наверняка всё ещё там."
1013702-13 = "[ns3] «Это разве не... тюремная камера?»\n[ns4] «Что именно делает Коно́ка?»"
1013702-16 = "Хр-р... Хр-р..."
1013702-17 = "Я услышал чей-то храп..."
1013702-18 = "Хр-р... Хр-р..."
1013702-19 = "В-Входите...! Входите!! Хр-р..."
1013702-20 = "[ns5] «Коно́ка...?»\n[ns6] «Почему ты в тюремной камере...?»"
1013702-23 = ""
1013702-25 = ""
1013702-26 = "А-А-А-А!!"
1013702-27 = "*тяжело дышит* *тяжело дышит* Ах ты трус! Со своим песком..."
1013702-28 = "Что...? Это был просто сон...? Тц, в следующий раз я их в фарш превращу..."
1013702-29 = "Хм?"
1013702-30 = ""
1013702-32 = ""
1013702-33 = ""
1013702-34 = "[ns] «Привет, Коно́ка...»"
1013702-35 = "Я ВСЁ ЕЩЁ сплю?"
1013702-36 = "И Сенсей опять появляется во сне... Почему это постоянно происходит?"
1013702-37 = "[ns] «Это не сон! Соберись!»"
1013702-38 = "*зе-е-евает*... Мм..."
1013702-39 = "Упс. Я собиралась немного вздремнуть до вашего прихода, но, кажется, проспала."
1013702-40 = "[s7] «Так, какой план побега?»\n[s8] «Кого попросить принести тебе еды снаружи?»"
1013702-43 = "Кьяхаха! Я в камере, но меня никто не арестовывал!"
1013702-44 = "...То есть я не совсем невиновна. Я действительно избила кое-кого, но не поэтому здесь."
1013702-45 = "Мне пришлось одной скрутить и арестовать сразу 30 преступников, и вернулась я только поздно ночью."
1013702-46 = "Вот поэтому... *зевает*... я и прокралась сюда немного поспать. Новобранцы наверху слишком шумные."
1013702-47 = "А! Кстати. Мне ещё нужно устроить этим сорванцам приветственную вечеринку и познакомиться поближе. В последнее время я прямо ночами напролёт работаю."
1013702-48 = "Но больше не буду отнимать ваше время. Нам ведь нужно было разобрать документы, да? Сейчас мигом выйду!"
1013702-49 = "Так... Где... пружина... у этого замка...?"
1013702-50 = ""
1013702-52 = ""
1013702-53 = ""
1013702-54 = ""
1013702-55 = ""
1013702-56 = "С-Стой!! Не двигаться!! Отойти от решётки!! Шагнёшь — стреляю!"
1013702-57 = ""
1013702-59 = ""
1013702-60 = "А?"
1013702-61 = "ЭЙ! Я предупреждала!! Руки вверх, быстро!"
1013702-62 = "Сенсей, отойдите! По одному взгляду видно, что перед нами опасная преступница! Гражданским рекомендуется держаться подальше от решётки!"
1013702-63 = "[s9] «Это недоразумение!»\n[s10] «Хотя я понимаю твою логику, это всё равно недоразумение!»"
1013702-66 = "Постой, ты ведь новенькая из Бюро общественного порядка? Я видела твоё имя в журнале состава."
1013702-67 = "Я заместитель директора! Я твой начальник, ясно? Так что прекращай этот цирк и просто открой дверь!"
1013702-68 = "Серьёзно?! У тебя ещё хватает наглости выдавать себя за нашего заместителя директора!"
1013702-69 = "Мне пока не выпала честь встретиться с ней лично, но даже я знаю: такая, как ТЫ, никак не может быть заместителем директора Валькирии."
1013702-70 = "Вообще-то я прямо сейчас ей напишу и разоблачу твою грязную ложь!"
1013702-71 = ""
1013702-73 = ""
1013702-74 = "Вот! Сообщение отправлено!"
1013702-75 = ""
1013702-77 = ""
1013702-78 = ""
1013702-79 = "Вот именно. Ну что, теперь довольна? Есть что сказать заместителю директора Бюро общественного порядка?"
1013702-80 = "Эм..."
1013702-81 = "Говорит Бюро общественного порядка Один-Два-Ноль!! Подозреваемая украла телефон заместителя директора!"
1013702-82 = "Ты уже всё решила заранее, да?!"
1013702-83 = "Настоящий полицейский никогда не одевался бы настолько разгильдяйски!"
1013702-84 = "Последнее предупреждение! Назад, тюремная крыса, решившая сбежать!!"
1013702-85 = "Слушай!! Ладно!! Поняла! Аргументы у тебя неплохие!! Но это Я вожу директора в сауны и на ужин—"
1013702-86 = "ПЕРЕЦ!! ПЕРЕ-Е-ЕЦ! АТАКА!"
1013702-87 = ""
1013702-89 = ""
1013702-93 = "КЬЯ-А-А! МОИ ГЛАЗА!!"
1013702-94 = "ВЕРНИСЬ СЮДА!! Вот выберусь отсюда—! ГР-Р-Р!!!"
1013702-95 = "Как ты ещё стоишь? ТЫ ЧУДОВИЩЕ!!"
1013702-96 = "Давай ещё! Я им хоть полоскать горло могу! Я Коно́ка, слышишь?!?! Шима Коно́ка!!"
1013702-97 = "Шокер! Шокер! Шокер!!!"
1013702-99 = "Заместитель директора Бюро общественного поря—КЬЯ-А-А-А!!"
1013702-100 = ""
1013702-103 = "...дка..."
1013702-105 = "Говорит подземная камера, Бюро общественного порядка Один-Два-Ноль. Подозреваемая в побеге обезврежена!!"
1013702-106 = ""
1013702-108 = ""
1013702-109 = "А, точно. Сегодняшний гороскоп был про хорошее первое впечатление."
1013702-111 = "После этого прибежали другие офицеры и подтвердили личность Коно́ки."
1013702-112 = "Новенькая долго извинялась за недоразумение, а Коно́ка улыбнулась и простила её."
1013702-113 = "Правда, Коно́ка разговаривала со стеной, потому что не могла открыть глаза. Но вроде была в порядке."
