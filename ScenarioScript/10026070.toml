[translation]
10026070-1 = "Эпизод 7;Правильное применение"
10026070-2 = "Закончив исследование всех четырёх мест, мы вернулись к точке высадки на пляже."
10026070-3 = "Мм... Хм..."
10026070-4 = "Хмм...? Ммм..."
10026070-5 = "[s1] «Что такое, Уи?»\n[s2] «Ты выглядишь очень задумчивой.»"
10026070-8 = "О, это... Ничего серьёзного..."
10026070-9 = "Я просто смотрела на эту карту... Но... Хмм..."
10026070-10 = "Здесь кое-что странное. Возьмём, например, вот это..."
10026070-12 = "Вот здесь... По расположению этих каменных стен похоже, что это тренировочная площадка."
10026070-14 = "А командный центр, который мы исследовали здесь, был построен как бункер."
10026070-15 = ""
10026070-16 = "Ещё есть маяк, который направлял корабли, и в нём самом по себе ничего необычного."
10026070-17 = "Но если рассматривать всё вместе, они образуют форму древнего узора Тринити. Это совершенно очевидно."
10026070-18 = ""
10026070-21 = "Эм... Ханако..."
10026070-22 = "В ней что-то изменилось. Она уже не такая, какой была, когда мы сюда прибыли."
10026070-23 = "Вот как?"
10026070-24 = "Да. Уи сейчас действительно сосредоточена... даже уверена в себе. Будто это совсем другой человек."
10026070-25 = "Наверное, так и бывает, когда занимаешься тем, что любишь. Приятно видеть. Хи-хи..."
10026070-26 = ""
10026070-27 = "Учитывая, что это место находится в глуши, я почти ожидала найти какие-нибудь камеры пыток или казней, которыми пользовался древний Совет."
10026070-28 = ""
10026070-30 = ""
10026070-32 = "Но, похоже, ничего такого здесь нет."
10026070-33 = "Хахаха, ха-ха..."
10026070-34 = "А, простите, наверное, это прозвучало плохо..."
10026070-35 = "В любом случае, это место даже отдалённо не похоже на что-то подобное."
10026070-36 = "И я подумала: «Неужели это всё?»"
10026070-37 = "Но чем больше я об этом думала, тем яснее кое-что понимала."
10026070-38 = "[s3] «Думаешь, здесь есть что-то ещё?»\n[s4] «Ты не удовлетворена результатом?»"
10026070-41 = "Ну, то есть, возможно, здесь действительно ничего нет. Скорее всего, ничего."
10026070-42 = "Но я была бы плохим исследователем, если бы не спросила себя: «А что, если...?»"
10026070-43 = "Если заранее ожидать, что ничего не найдёшь, именно это и произойдёт."
10026070-44 = "Но если продолжать искать что-то ещё, даже когда поиски ничего не дают, можно неожиданно удивиться."
10026070-45 = "Поэтому давайте посмотрим на это с другой стороны. Вместо того чтобы пытаться понять, чем было это место..."
10026070-46 = "Давайте подумаем, почему его забросили."
10026070-47 = "Хорошая мысль. Люди, которые построили это место и ценили традиции и историю превыше всего, сами уничтожили и бросили его."
10026070-48 = "Ключ к нашему расследованию — в поступке, который Сестринство сочло бы совершенно отвратительным: они уничтожили записи."
10026070-49 = "Да. Для Сестринства это совсем ненормально."
10026070-50 = "Но зачем? Зачем кому-то было идти на такие меры?"
10026070-51 = "Тренировочная площадка, командный центр, маяк..."
10026070-52 = ""
10026070-53 = "...и та странная лимонная роща..."
10026070-54 = ""
10026070-56 = ""
10026070-57 = ""
10026070-59 = "Хм... Лимонная роща..."
10026070-60 = "Уи...?"
10026070-61 = ""
10026070-63 = ""
10026070-64 = "Странно... Смотрите. Даже на карте эта лимонная роща немного выбивается из общей картины."
10026070-65 = "Понимаю, о чём ты. Она не сочетается со всем остальным. Будто её добавили в последний момент."
10026070-66 = "К тому же лимонные деревья не растут на этом острове естественным образом. Их пришлось привезти извне."
10026070-67 = "И для запасов продовольствия лимоны тоже не самый практичный выбор. Значит, для этого должна быть причина."
10026070-68 = "Лимоны... Лимоны..."
10026070-69 = ""
10026070-71 = ""
10026070-72 = ""
10026070-73 = ""
10026070-74 = ""
10026070-76 = "[ns5] «Откуда у тебя лимон?»\n[ns6] «Что ты собираешься с ним делать?»"
10026070-79 = "Ммм... Да. Наверняка так. В этом и должна быть причина..."
10026070-81 = "Хоп!!"
10026070-82 = ""
10026070-85 = "[ns7] «Зачем ты выжимаешь лимон?! Сок испортит карту!»\n[ns8] «А! Он разбрызгивается повсюду!»"
10026070-88 = "О боже! Если ты можешь так сильно сжимать... ♡"
10026070-89 = "Уи куда бойчее, чем кажется!"
10026070-90 = "Не надо кричать, Ханако!"
10026070-91 = "Уи! Что ты делаешь?! Эта карта хранилась в соборе целую вечность—"
10026070-93 = "Ха! Я так и думала, что это сработает. Эта карта сделана не из обычного пергамента."
10026070-94 = "Смотрите! Два новых места!"
10026070-95 = ""
10026070-97 = ""
10026070-98 = ""
10026070-99 = "Что это?! На карте появляется что-то новое!"
10026070-100 = "Это старый способ скрывать информацию от шпионов."
10026070-101 = "Надо же. Метод не самый современный, но сработал достаточно хорошо."
10026070-103 = "Исследовательская группа Сестринства никогда бы не осмелилась облить карту лимонным соком и поднести её к солнечному свету..."
10026070-104 = "Они совсем оторваны от жизни. Обычные люди ведь никогда не интересуются такими вещами, да?"
10026070-105 = "...Хотя, полагаю, именно на это создатели карты и рассчитывали."
10026070-106 = "В любом случае теперь ясно, что нам делать. Нужно посетить эти два тайных места."
10026070-107 = "Вот настоящая причина существования этого места."
10026070-108 = "Пойдёмте."
10026070-109 = ""
10026070-111 = ""
10026070-112 = "У-Уи?! Подожди нас, Уи!"
10026070-113 = ""
10026070-115 = ""
10026070-116 = "Мы бы никогда до такого не додумались! Ты потрясающая!"
10026070-117 = "Что бы тебе ни понадобилось, мы сделаем всё возможное, чтобы помочь! Вместе до самого конца, Уи!"
10026070-118 = "Уаааа! Два метра! Два метра!!"
10026070-119 = ""
10026070-121 = ""
10026070-122 = "Хи-хи! Ну тогда..."
10026070-123 = "Пойдём вместе?"
