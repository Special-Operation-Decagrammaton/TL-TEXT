[translation]
1001903-1 = "Безопасность"
1001903-3 = "Звонок раздался ровно через 15 минут после моего последнего сообщения в MomoTalk."
1001903-4 = "Когда Азуса пришла, она почему-то выглядела недовольной."
1001903-5 = "*вздыхает*"
1001903-6 = "Я надеялась, что в вопросах жилья ты окажешься не таким предсказуемым, но примерно этого и ожидала."
1001903-7 = "[s] «Что-то не так, Азуса?»"
1001903-8 = "Мне понадобилось всего шесть минут и девятнадцать секунд, чтобы добраться до этого здания и встать перед тобой."
1001903-9 = "По пути мне встретилось лишь одно препятствие — ворота Шале. Да и их ты сам мне открыл."
1001903-10 = "В лифте нет никаких систем безопасности, а дверь в Исполнительный офис была не заперта."
1001903-11 = "Что, если бы к тебе пришла не я, а опасный человек, замаскированный под меня?"
1001903-12 = "Ты слишком беспечен, Сенсей. У тебя вообще нет мер безопасности."
1001903-13 = "...Но ничего."
1001903-14 = "Именно поэтому я здесь."
1001903-15 = "[s1] «Меры безопасности?»\n[s2] «Я не очень понимаю, но доверюсь тебе.»"
1001903-16 = "Разумеется. Я профессионал — и я обеспечу твою безопасность."
1001903-17 = "Разумеется. Я профессионал — и я обеспечу твою безопасность."
1001903-18 = "С этого момента я сделаю так, чтобы в этот офис не смог проникнуть даже муравей. У меня достаточно ловушек и мин для этого."
1001903-19 = "...Что ты сказал?"
1001903-20 = "Нельзя запрещать другим студентам входить в Шале? Исполнительный офис — открытое пространство?"
1001903-21 = "Это бессмыслица, Сенсей. Только так я могу гарантировать твою безопасность."
1001903-22 = "Что? Лучше вместо этого оборудовать убежище?"
1001903-23 = "Хм..."
1001903-24 = "Ладно. Мне не нравятся правила этого места, но я буду им следовать."
1001903-25 = "Так куда нам идти?"
1001903-27 = "Что это...?"
1001903-28 = "Комната отдыха? Здесь ты отдыхаешь?"
1001903-29 = "Понятно. Здесь хранятся все необходимые вещи, а температура поддерживается на комфортном уровне."
1001903-30 = "Возможно, стоит оборудовать здесь защищённое помещение."
1001903-31 = "...А? Ты думаешь, мне пока не стоит принимать такие решения?"
1001903-32 = "Мы займёмся этим вместе, когда ты закончишь работу? Но я могу справиться сама. Ты мне не доверяешь?"
1001903-33 = "Понятно. Тебе было бы неловко заставлять меня делать всё в одиночку."
1001903-34 = "Это так на тебя похоже, Сенсей."
1001903-35 = "Хорошо. Если ты настаиваешь, я тебя подожду."
1001903-36 = "Я буду прямо здесь. Начнём сразу, как только ты вернёшься."
1001903-37 = ""
1001903-39 = ""
1001903-40 = ""
1001903-41 = "Я оставил Азусу сидеть на диване и вернулся в Исполнительный офис."
1001903-43 = "К тому моменту, как я закончил с документами, солнце уже село."
1001903-44 = "Я вернулся в комнату отдыха."
1001903-46 = "Азуса спала в массажном кресле."
1001903-47 = ""
1001903-50 = "М-м-м... Хр-р-р..."
1001903-51 = "(...?)"
1001903-52 = "М-м-м... Хи-хи..."
1001903-53 = "...?"
1001903-54 = "*ахает*"
1001903-56 = "С-Сенсей?"
1001903-57 = "[s3] «Хорошо поспала, Азуса?»\n[s4] «Хорошее массажное кресло, правда?»"
1001903-58 = "...Эм."
1001903-59 = "...Эм."
1001903-60 = "Я-я могу объяснить. Просто..."
1001903-61 = "А? Что-нибудь случилось, пока тебя не было?"
1001903-62 = "Эм, ну, нет... Ничего особенного."
1001903-63 = "...!"
1001903-64 = "Сенсей."
1001903-65 = "Ты специально заставил меня ждать здесь? Чтобы я почувствовала, каково это — расслабиться?"
1001903-66 = "Ты пытался показать мне, что дополнительная безопасность не нужна..."
1001903-67 = "[s5] «В комнате отдыха спокойная атмосфера, правда?»\n[s6] «Тебе стоит чаще расслабляться.»"
1001903-68 = "Ты снова ведёшь себя беспечно."
1001903-69 = "Ты снова ведёшь себя беспечно."
1001903-70 = "*вздыхает*"
1001903-71 = "Но я понимаю. Я уже решила попытаться приспособиться к жизни здесь."
1001903-72 = "Не то чтобы я была в восторге от этого места, но ты прав. Я попробую быть немного спокойнее."
1001903-73 = "Что ты говорил насчёт потом?"
1001903-74 = "Ты хочешь рассказать мне больше о том, как здесь живут?"
1001903-75 = ""
1001903-76 = "...Хи-хи."
1001903-77 = "Ты прав. Возможно, сейчас мне нужен не только учитель."
1001903-78 = "Тогда буду ждать всего, что ты захочешь мне рассказать."
1001903-80 = "После этого мы с Азусой ещё некоторое время по очереди пользовались массажным креслом."
