[translation]
10013030-1 = "Эпизод 3;Серные шахтёры 1"
10013030-3 = ""
10013030-5 = "Пойдём к ближайшей точке."
10013030-6 = "Немного неловко произносить это вслух, но..."
10013030-7 = ""
10013030-11 = "[ns1] «Серные шахтёры в поисках раскалённых земель, что кипят вечно...»\n[ns2] «...Как бы они ни назывались, должны быть где-то рядом.»"
10013030-14 = "Спасибо, Сенсей. Их кодовые имена такие странные."
10013030-15 = "Я тоже так думала, но ничего не вижу."
10013030-16 = "Я тоже."
10013030-17 = "Я вижу только очень, очень много песка."
10013030-19 = "Надеюсь, мы не заблудились. Может, нужно найти где-то вход."
10013030-21 = "...?"
10013030-22 = ""
10013030-24 = ""
10013030-25 = ""
10013030-26 = "Сенсей!"
10013030-27 = "[s] «Что такое, Чисэ?»"
10013030-28 = "...Я слышу стук."
10013030-29 = "[s] «Стук...?»"
10013030-30 = ""
10013030-39 = "О, и я слышу! Какой странный звук!"
10013030-40 = "Он доносится оттуда! Идём!"
10013030-41 = ""
10013030-43 = ""
10013030-50 = ""
10013030-51 = "Это... должно быть курортом?"
10013030-52 = "Больше похоже на..."
10013030-53 = "[s] «На джунгли?»"
10013030-54 = "Как странно!"
10013030-55 = "Нас со всех сторон окружают деревья и кусты."
10013030-57 = ""
10013030-62 = "И правда, роскошный курорт я представляла совсем иначе."
10013030-63 = "Они выкорчёвывают все корни и разносят джунгли! Что они делают, господин?"
10013030-64 = "[s] «Эм... Если попробовать угадать...»"
10013030-66 = "Эй! Кто там?! Кто-то пробрался внутрь не через главный вход!"
10013030-67 = ""
10013030-69 = ""
10013030-71 = ""
10013030-72 = "Кто бы это ни был, выглядит очень подозрительно! Эй! Ребята! Тут нарушители!"
10013030-73 = "П-Погодите! Дайте объяснить!"
10013030-74 = ""
10013030-77 = ""
10013030-79 = ""
10013030-80 = "[ns] «О, вы ребята...»"
10013030-81 = "А? На них купальники. Это гости?"
10013030-82 = "Сомневаюсь. Выглядят очень подозрительно, особенно тот взрослый посередине."
10013030-83 = "Хотя... Это лицо кажется знакомым."
10013030-85 = "Да это же Сенсей из Шале!"
10013030-86 = "[s] «Мэгу!»"
10013030-87 = "Привет! Здравствуйте! Не ожидала увидеть вас здесь, Сенсей!"
10013030-89 = "Вы... знакомы?"
10013030-90 = "[s3] «Хватит так подозрительно на меня смотреть!»\n[s4] «У меня есть знакомая в Отделе горячих источников!»"
10013030-93 = "Я гадала, что значит «Серные шахтёры»... Но теперь понятно. Вы ведь Отдел горячих источников Геенны, верно?"
10013030-94 = "Да! Мы — Серные шахтёры в поисках раскалённых земель, что кипят вечно, здесь, на курорте «Потерянный рай»."
10013030-95 = "Отличное кодовое имя для Отдела горячих источников! Я сама его придумала!"
10013030-96 = "[s] «Ого! Совсем сама?»"
10013030-97 = "Ага! Знаю, гениально. Но всё же, что привело вас сюда, Сенсей? ♪"
10013030-98 = "Заблудились в джунглях?"
10013030-99 = ""
10013030-100 = "Я хотела спросить то же самое. Что это был за стук и лязг?"
10013030-101 = "Это невероятно подозрительно даже для нелегального курорта..."
10013030-103 = "Какой глупый вопрос!"
10013030-104 = ""
10013030-107 = ""
10013030-108 = "Президент Касуми!"
10013030-109 = ""
10013030-111 = ""
10013030-112 = "Мы появимся везде, где есть горячие источники! Даже если их нет, мы всё равно будем там!"
10013030-113 = "Да! Если горячих источников нет, мы просто их создадим!"
10013030-114 = "Ого! Невероятно! Звучит очень по-фестивальному!"
10013030-115 = "Умика! Не поощряй их глупости."
10013030-117 = "Вот это неожиданная встреча. Вы Сенсей из Шале?"
10013030-118 = "[s] «Привет. Это я.»"
10013030-119 = "Приятный сюрприз. Я много о вас слышала от моих девочек."
10013030-120 = "Добро пожаловать на курорт глубоководных горячих источников Отдела горячих источников!"
10013030-121 = "[s] «Глубоководных... чего?»"
10013030-122 = "Спрошу ещё раз... Что Отдел горячих источников делает здесь?"
10013030-123 = "Какой смешной вопрос! То, что умеем лучше всего: разрабатываем горячие источники!"
10013030-124 = "Здесь, в джунглях...?"
10013030-125 = "В джунглях рядом с пляжем! Благодаря моему утончённому обонянию я учуяла их потенциал."
10013030-126 = "Глубоко под нашими ногами скрыты жилы, которые подпитывают подводный вулкан, превращая глубокие морские воды у побережья в кипящие горячие источники!"
10013030-127 = "Мы будем копать, пока не создадим ещё больше горячих источников!"
10013030-128 = "[s] «О, я вообще-то уже слышал об этом!»"
10013030-129 = "Сенсей?!"
10013030-130 = "Глубоководные горячие источники невероятны! По моим расчётам, у них более 365 полезных свойств для здоровья!"
10013030-131 = "Среди них увеличение физической силы, безопасность семьи и даже эффект естественной тренировки ниндзюцу!"
10013030-132 = "Т-Т-Тренировка ниндзюцу?! Изуна не знала, что глубокая морская вода настолько невероятна!"
10013030-133 = "[s] «Изуна! Включи критическое мышление!»"
10013030-134 = "Стоп-стоп! Я ни единому слову не верю!"
10013030-135 = "Не могу поверить, что эти ходячие катастрофы — сильнейшая группировка архипелага!"
10013030-136 = "О! Не пугайтесь нашей репутации."
10013030-137 = "Пока мы разрабатывали источники, сюда толпами лезли разные Охотники за курортами, чтобы забрать наш контракт."
10013030-138 = "Мы очень уважительно победили их во славу Отдела горячих источников!"
10013030-139 = "А затем очень любезно позволили им работать на нас на строительной площадке."
10013030-140 = "Мы получаем бесплатную рабочую силу во имя нашей миссии..."
10013030-141 = "А они получают возможность испытать радость разработки горячих источников!"
10013030-142 = "Все выигрывают!"
10013030-143 = "Президент Касуми — настоящий гений!"
10013030-144 = "Ва-ха-ха! Никто не остановит нашу страсть к глубоководным источникам!"
10013030-145 = "[s] «...Страшно. Вы страшные.»"
10013030-146 = "В любом случае, думаю, вы пришли не просто понежиться в горячих источниках."
10013030-147 = "Вы тоже Охотники за курортами?"
10013030-149 = ""
10013030-151 = ""
10013030-152 = "...У вас ведь тоже есть курортный контракт, верно?"
10013030-153 = "Ещё бы! Его продавали в интернете, и мы сразу увидели возможности для развития!"
10013030-154 = "[s] «Его ещё и в интернете продавали?!»"
10013030-155 = "А что в этом плохого?"
10013030-157 = "Банк «Осьминог» не владел правами на контракты, которые незаконно продавал."
10013030-158 = "Поэтому мы собираем их обратно и прекращаем эту Охоту на курорты!"
10013030-159 = "Можете отдать его? Пожалуйста?"
10013030-161 = "А, понятно. Хм. Интересно."
10013030-162 = "Вы хотите, чтобы мы вошли в ваше положение и сотрудничали?"
10013030-163 = "Да, пожалуйста! Спаси—"
10013030-164 = ""
10013030-166 = ""
10013030-167 = "Не-а. Не хочу."
10013030-169 = "А?!"
10013030-170 = "Мне всё равно, были у них права или нет. Мы купили контракт, значит он наш. И мы уже слишком много вложили в этот курорт горячих источников."
10013030-171 = "Ага! Мы уже построили парковку, развлекательный комплекс и жилой корпус!"
10013030-172 = "Осталось только найти горячие источники!"
10013030-173 = "[s] «...Разве это не обычный курорт?»"
10013030-174 = "В любом случае, ничего мы не отдадим!"
10013030-175 = "Ты хочешь сказать..."
10013030-176 = "Если вам нужен этот контракт... нам придётся..."
10013030-177 = "Сразиться! Соревноваться! Придётся устроить Охоту!"
10013030-178 = "[s] «Погодите, погодите. Может, обсудим всё как цивилизованные люди?»"
10013030-180 = "Хмф. Это не входило в мой первоначальный план, но..."
10013030-181 = "Момоёдо не отступает от вызова!"
10013030-182 = "Если потребуется, будем сражаться до последнего вздоха!"
10013030-183 = "Не боитесь выступить против нас в лоб! Хорошо!"
10013030-184 = "Итак, все!"
10013030-185 = "Хорошо. Я буду сражаться."
