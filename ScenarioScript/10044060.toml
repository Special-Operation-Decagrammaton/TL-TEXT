[translation]
10044060-1 = "Эпизод 6;Фан-клуб смерти"
10044060-3 = "Так, дайте посчитать..."
10044060-4 = "...ДУМАЮ, мы ещё едва-едва успеваем."
10044060-5 = "Ага, впритык."
10044060-6 = ""
10044060-7 = "[ns] «По крайней мере, мы нашли поезд.»"
10044060-8 = "Нашли! Мы его нашли. Самое трудное позади."
10044060-9 = "Хотя мне кажется, будто я что-то забываю..."
10044060-10 = ""
10044060-14 = "Эй! Это ТОТ поезд, да?"
10044060-15 = "У-у, ага, он! Жми!"
10044060-16 = "...А, точно."
10044060-18 = ""
10044060-19 = "Ха, нашла вас, мелкие Хайлендер! Я знала, что вы поедете сюда!"
10044060-20 = "Точно как вы и планировали, Президент!"
10044060-21 = "Теперь просто заберём груз, доставим его целым и невредимым..."
10044060-22 = "Идеальный план."
10044060-23 = "И тогда все узнают, что мы лучшие."
10044060-24 = "Верно? В нашей работе главное результат!"
10044060-26 = "Мы лучшие курьеры в деле. Мы Национальная ассоциация перевозчиков, сокращённо — Гоночная ассоциация Vroom Vroom!"
10044060-27 = ""
10044060-29 = ""
10044060-30 = "...А?"
10044060-31 = "Что такое?"
10044060-32 = "Почему там вертолёт?"
10044060-33 = ""
10044060-35 = ""
10044060-36 = ""
10044060-39 = ""
10044060-40 = "Кавару Шинон, Кронос Live, прямо с места событий!"
10044060-41 = "Если посмотрите вниз, увидите таинственный поезд в движении!"
10044060-42 = "А, и похоже, его уже преследует байкерская банда!"
10044060-43 = "ЧТО же везёт этот поезд и куда он направляется?"
10044060-44 = "Оставайтесь с нами, друзья: Кронос всегда будет прямо в гуще событий, сражаясь за ВАШЕ право знать!"
10044060-45 = ""
10044060-50 = ""
10044060-51 = "У них на нас какая-то личная обида, что ли?"
10044060-52 = "Ну, Кронос есть Кронос, но при чём тут байкерская банда?"
10044060-53 = "Месть за историю с пиццей?"
10044060-55 = "Я-я больше даже не пытаюсь это понять. Но серьёзно, «ваше право знать?»"
10044060-56 = "Они только подстрекают ещё большую толпу!"
10044060-57 = "Может, если сбить их с неба, они заткнутся!"
10044060-58 = "[ns] «А-Аоба, успокойся!»"
10044060-59 = "Слушай, если ты не можешь отправить эту ракету в прошлое, толку уже не будет."
10044060-60 = "Давайте просто придумаем наш СЛЕДУЮЩИЙ ход."
10044060-61 = "И что предлагаешь?"
10044060-62 = "БЕЗ понятия! Пахяхя!"
10044060-63 = "...Ненавижу себя за то, что почти тебя послушала."
10044060-66 = ""
10044060-67 = "Эм, сзади какое-то пыльное-движущееся облако!"
10044060-68 = "..."
10044060-69 = "Акцент на «движущееся»!"
10044060-70 = "[ns] «Эм...»"
10044060-72 = "[ns] «Ага, насчёт „движущегося“ не поспоришь.»"
10044060-75 = "Хахаха! Вот он, поезд с сокровищами!"
10044060-76 = "Он весь наш! С дороги!"
10044060-77 = ""
10044060-80 = ""
10044060-81 = "П-Президент! К нам приближаются чудики! Что делать?"
10044060-82 = "Ч-Что... Почему внезапно?! Это всё из-за этого новостного вертолёта, да?!"
10044060-83 = "Н-Нет! Этот поезд наш!!"
10044060-85 = "Свободная драка для всех. СПАСИБО, журналисты!!"
10044060-86 = "Ого, байки, тактические машины... Это что, модифицированный танк?"
10044060-87 = "Круто, у нас тут Фан-клуб смерти."
10044060-88 = "Со всеми мы не справимся. Надо просто продолжать нестись на полной!"
10044060-89 = "С-Скорость! Нужно быстрее...!!"
10044060-95 = "Ого, всё совсем пошло наперекосяк, да?"
10044060-96 = "Ага, у нас проблемы."
10044060-97 = ""
10044060-100 = "Хахаха! Этот поезд считай наш!"
10044060-101 = "Иначе мы взорвём его к чёртовой матери!"
10044060-102 = ""
10044060-106 = "К-Как вообще до этого дошло?!"
10044060-112 = "Вы это видите, друзья? Всё происходит в прямом эфире!"
10044060-113 = "Несколько групп преследуют так называемый «поезд с сокровищами.» Это грандиозная погоня."
10044060-114 = "Но сокровище достанется только одной из них. Кому? Оставайтесь с нами!"
10044060-115 = ""
10044060-116 = "Хм? К нам что-то летит..."
10044060-117 = "...Это ракета?"
10044060-118 = "Похоже на то! Срочные новости: теперь прямо к нашему вертолёту летит РАКЕТА—"
10044060-119 = ""
10044060-121 = ""
10044060-122 = "...Погоди, что?"
10044060-125 = "И-и-и-и!!! Н-Нас подбили!!!"
10044060-126 = "Э-Это подавление прессы-ы-ы...!!!"
10044060-128 = "Ого, это было круто! Пахяхя! Кто выстрелил?"
10044060-129 = "Аоба? Это ты?"
10044060-131 = "Н-Нет, это была НЕ я *кашляет* хотяоченьхотелось. Я тут ни при чём."
10044060-132 = "Это кто-то позади нас!"
10044060-134 = "Хаха! Новости сломались!"
10044060-135 = "Не хватало ещё, чтобы всякие стервятники знали, где мы!"
10044060-136 = ""
10044060-138 = ""
10044060-139 = "Эй, быстро сообразили! Молодцы!"
10044060-140 = ""
10044060-142 = ""
10044060-143 = ""
10044060-146 = "И-и-ик!!!"
10044060-147 = ""
10044060-148 = "Если вы не с нами — вы конкуренты! Сокровище наше!"
10044060-153 = ""
10044060-154 = "А-а-а!! П-Президент, на нас напали!"
10044060-155 = "М-Мы заточены под курьерскую работу, а не под настоящую битву!"
10044060-158 = ""
10044060-159 = "Ну, работают они эффективно. Убирают конкурентов одного за другим."
10044060-160 = "Они точно победят."
10044060-161 = "Д-Для нас это ПЛОХО! Они охотятся за НАШИМ ПОЕЗДОМ!"
10044060-162 = "Точно. Забыла."
10044060-163 = "По крайней мере врагов стало меньше, но они приближаются!"
10044060-164 = "И впереди Геенна. Там будет ЕЩЁ больше проблем."
10044060-165 = "М-Может, просто выпрыгнем и убежим?"
10044060-166 = "Бросать миссии не входит в должностные обязанности."
10044060-167 = "Так и ВОТ ЭТО всё тоже не входит!"
10044060-168 = "[ns1] «Давайте все успокоимся и подумаем секунду...!»\n[ns2] «Решение обязательно есть.»"
10044060-171 = "Я... ничего не придумала."
10044060-172 = "Если только ты не знаешь способа, как нам НЕ дать себя ограбить, НЕ разбиться и НЕ получить наказание?"
10044060-173 = "Пахяхя, как страшно!"
10044060-174 = "Ч-Чего ты смеёшься?! Тут вообще ничего смешного!"
10044060-175 = "Уа-а! *рыдает* *рыдает* *рыдает*"
10044060-176 = "Ну не ПЛАЧЬ... О, хмф, ты ПРИТВОРЯЕШЬСЯ. Просто замечательно!!"
10044060-177 = "Бу-у. И зачем было раскусывать."
10044060-178 = ""
10044060-179 = "[ns] «Ещё одно облако пыли приближается.»"
10044060-180 = ""
10044060-182 = ""
10044060-183 = "А вот и новый претендент..."
10044060-184 = ""
