[translation]
10036030-1 = "Эпизод 3;Приближающаяся тень"
10036030-4 = ""
10036030-5 = "Как же шумно."
10036030-6 = "Ну, мы прямо у пляжа. Здесь куча чаек."
10036030-7 = "Чайки меня не волнуют, меня бесят эти сопляки из Банды шлемов!"
10036030-8 = "Со своим «Великим слётом союза». Да ладно!"
10036030-9 = "Думают, могут наехать на нашу старшую, а потом спокойно устроить полноценную вечеринку?!"
10036030-10 = "Будто Пляж беззакония принадлежит им!"
10036030-11 = "Правда?"
10036030-12 = "Кто-нибудь ещё хочет что-то с этим сделать?"
10036030-14 = "Ага!"
10036030-15 = "Я давно ждала шанса отомстить."
10036030-16 = "Они перешли дорогу нашей старшей и ОБЯЗАТЕЛЬНО заплатят."
10036030-17 = "Пусть думают, что хорошо проводят время, а потом? Мы налетаем и разносим их!"
10036030-18 = "Кстати, что там с той... профессоршей? Которая сказала, что составит план, если ей заплатить?"
10036030-19 = "Наверное, информационный брокер с Чёрного рынка."
10036030-20 = "Ну, я так думаю. Лицо она показать не дала."
10036030-21 = "Ага, выглядела подозрительно."
10036030-22 = "Но подозрительная или нет, факт один: эти придурки в шлемах устраивают фестиваль прямо у нас перед носом!"
10036030-23 = "Надеюсь, все готовы его испортить!"
10036030-24 = "Ага!"
10036030-25 = "Ладно. Значит, будем делать вот что..."
10036030-26 = ""
10036030-28 = ""
10036030-29 = "...А, звонок, как раз вовремя. Видимо, план готов."
10036030-33 = ""
10036030-34 = "Вот вы где, Сенсей. Кошелёк нашли?"
10036030-35 = "Чудесно. Как раз вовремя. Пожалуйста, спрячьтесь с нами за этим камнем."
10036030-36 = ""
10036030-39 = "[ns] Иди за Ацуко за камень."
10036030-41 = "Хватит толкаться, Хиёри. Угх, почему мы так тесно стоим? Места же полно..."
10036030-42 = "БЫЛО полно. Теперь нас на одного больше. И этот кто-то прижался прямо ко мне."
10036030-43 = "[s] «Прости...»"
10036030-44 = ""
10036030-45 = "Тс-с, все тихо. Она может нас услышать."
10036030-46 = "Саори? Где она?"
10036030-47 = "Вон там, у берега."
10036030-49 = ""
10036030-50 = "DJ B.o.B! Спасибо, что пришли!"
10036030-51 = "Вы лучший на Чёрном рынке. С вами эта вечеринка точно будет огонь!"
10036030-52 = ""
10036030-54 = ""
10036030-55 = ""
10036030-56 = "*кхм* Ну, это большое событие для Банды шлемов. Рад помочь."
10036030-57 = "По оплате всё ясно, да?"
10036030-58 = "Конечно. Переведём на ваш счёт, как только вечеринка закончится."
10036030-59 = "Хорошо, хорошо. Честь среди воров и всё такое."
10036030-60 = "Эй! Подработка! Осторожнее с этим. Оно дорогое!"
10036030-62 = "Хоп! Поняла!"
10036030-63 = "Перенеси это туда, а потом проверь колонку! Раньше я видел на ней царапины."
10036030-64 = "Если что-то сломается — отвечать будешь ты. Обращайся со всем так, будто оно ценнее тебя!"
10036030-65 = "...Поняла!"
10036030-66 = "Ага. И ещё передвинь тот реквизит примерно на метр влево."
10036030-67 = "Разве вы раньше не сказали, что он слишком далеко слева?"
10036030-68 = "Сказал, но теперь мне так нравится больше."
10036030-69 = "Что, проблемы? Если не подходит, я могу просто уйти домой."
10036030-70 = "*ахает* Н-Не надо! Пожалуйста, останьтесь. Мы всё исправим."
10036030-71 = "Подработка, делай, что тебе говорят! Быстро!"
10036030-72 = "...Поняла!"
10036030-73 = ""
10036030-74 = ""
10036030-75 = "...Какой неприятный человек."
10036030-76 = "Пусть они ей и платят, это не повод так обращаться."
10036030-77 = "Учебниковое определение токсичного заказчика. Будь я на её месте, уже бы их пристрелила."
10036030-78 = "Ага, настоящая потогонка."
10036030-79 = "Такими темпами хроническая усталость и бессонница превратят каждый день в мучение... Может дойти до гастрита от стресса или гипертонии..."
10036030-80 = "[s1] «Похоже на офисную работу. Там всё это идёт подарочным набором.»\n[s2] «Всё это звучит подозрительно знакомо...»"
10036030-83 = "Мы должны что-то сделать."
10036030-84 = "Н-Но разве мы не собирались «наблюдать издалека»?"
10036030-85 = "Если вмешаемся, она нас точно увидит."
10036030-86 = "...Я хотела, чтобы ей пришлось немного потрудиться, но не настолько."
10036030-87 = "Посмотрим, какие ниточки можно дёрнуть из-за кулис."
10036030-88 = ""
10036030-90 = ""
10036030-92 = "Только аккуратно."
10036030-94 = ""
10036030-95 = ""
10036030-96 = "*пых* *пых*..."
10036030-97 = "Вообще-то, думаю, колонку стоит поставить немного ближе к зрителям."
10036030-98 = "Перетащи её ещё раз, подработка!"
10036030-99 = "П-поняла."
10036030-100 = "Чего возишься? Мы едва начали!"
10036030-101 = "Хмф. И ЭТО мой «ассистент и телохранитель»? Я не впечатлён."
10036030-102 = "..."
10036030-103 = "Я пойду прогуляюсь. Передвинь всё, пока меня нет. Поняла?"
10036030-104 = "Да-да, поняла."
10036030-105 = "М-м, свежий морской ветер!"
10036030-106 = ""
10036030-108 = ""
10036030-109 = ""
10036030-110 = ""
10036030-113 = ""
10036030-114 = "И тропа чистая. Хорошо, хорошо."
10036030-115 = "Когда вернусь, надо отправить подработку за раменом или чем-нибудь."
10036030-116 = "Я хотя бы ЭТО заслужил за то, что припёрся сюда— А?!"
10036030-117 = ""
10036030-119 = ""
10036030-120 = ""
10036030-121 = ""
10036030-122 = ""
10036030-123 = ""
10036030-124 = ""
10036030-125 = "В-Вы ещё кто такие, откуда вы вообще взялись?"
10036030-126 = "С дороги! Я пытаюсь спокойно прогуляться!"
10036030-127 = "Не хотите немного поговорить с нами, господин диджей? Это ненадолго."
10036030-128 = "Что, автограф хотите? Не получится. Правила встречи с фанатами выложены в интернете. Идите читайте."
10036030-129 = ""
10036030-131 = ""
10036030-132 = "П-Почему вы все с оружием...?"
10036030-133 = "[s] «Стоп-стоп-стоп! Мисаки! Ты же сказала „аккуратно“!»"
10036030-134 = "Так я и действую аккуратно."
10036030-135 = "Я-Я не знаю, кто вы такие, но вы ошиблись!"
10036030-136 = "Вы вообще знаете, кто я? Я DJ B.o.B! Если со мной что-нибудь случится, Банда шлемов вам отомстит!"
10036030-137 = "Если у вас ЕСТЬ хоть капля разума, лучше опустите оружие— Ай!"
10036030-138 = ""
10036030-142 = ""
10036030-143 = "Рука соскользнула."
10036030-144 = "Не причиняй ему боль, Мисаки. Не испорть всю работу Сао-Сао над его концертом."
10036030-145 = "Знаю. Просто терпеть не могу, как он разговаривает."
10036030-146 = "Мы можем решить всё мирно. Правда ведь, господин DJ B.o.B?"
10036030-148 = "В-Вы смерти захотели?! Я сейчас позову Банду шлемов и—"
10036030-149 = ""
10036030-151 = ""
10036030-152 = "АЙ!"
10036030-153 = "[s] «Ацуко, и ты тоже?!»"
10036030-154 = ""
10036030-156 = ""
10036030-157 = ""
10036030-158 = "Мне... тоже не нравится, как он разговаривает."
10036030-160 = "Проклятые сопляки... Угх..."
10036030-164 = ""
10036030-165 = "Э-Эй, простите, что перебиваю ваши угрозы, но..."
10036030-167 = "Мы просто с ним разговариваем. Что случилось?"
10036030-169 = "Ну, я была на наблюдении на том дереве, и сюда идут люди."
10036030-170 = "Я посчитала — будут здесь секунд через десять. Я поставила для них ловушку, могу сейчас активировать."
10036030-171 = ""
10036030-174 = ""
10036030-175 = "Нет, пока не надо. Хиёри, возвращайся на позицию. Химэ, удерживай диджея."
10036030-176 = "А что до вас, Сенсей..."
10036030-177 = "[s] «Пожалуй, помогу удерживать диджея.»"
10036030-178 = "...Ладно, сойдёт."
10036030-180 = "Ах вы сопляки! Вы вообще кто такие? Нельзя просто— Ммф!"
10036030-181 = ""
10036030-183 = ""
10036030-186 = ""
10036030-187 = ""
10036030-188 = ""
10036030-189 = "Пожалуйста, господин B.o.B, умоляю, перестаньте говорить."
10036030-191 = "...Они приближаются."
10036030-195 = ""
10036030-196 = ""
10036030-197 = ""
10036030-198 = "Ха-ха! Диджей прямо перед нами, уже упакованный! Всё по плану!"
10036030-199 = "Лучше бы всё и дальше шло по плану. Мы на него последние деньги отдали!"
10036030-200 = "А, теперь этому тупому фестивалю точно конец!"
10036030-201 = ""
10036030-202 = ""
10036030-203 = "Фестивалю что?"
10036030-205 = "Эй, вы кто? Банда шлемов? Нет, шлемов у вас нет..."
10036030-206 = "Какое вам дело до DJ B.o.B?"
10036030-207 = "Какое бы ни было — подвиньтесь! Мы пришли его похитить!"
10036030-209 = "Ммф?!"
10036030-211 = "Похитить?"
10036030-212 = "[s] «Похитить?!»"
10036030-213 = "Значит, головорезы? Хотите сорвать фестиваль?"
10036030-215 = "Ага, именно! У нас с вами, придурками в шлемах, старые счёты!"
10036030-216 = "В купленном нами плане сказано: достаточно похитить DJ B.o.B — и весь фестиваль развалится. Идеально!"
10036030-217 = "А потом у нас будет собственный диджей! Заставим его неделю крутить скретчи весь день!"
10036030-218 = "Весь день? Пусть работает по тридцать шесть часов в сутки! Пусть покажет, как сильно любит нашу старшую!"
10036030-220 = "Н-н-н...!"
10036030-222 = "Уверена, у вас есть причины для мести, но мы не можем этого позволить."
10036030-223 = "Наша подруга Саори слишком много работала над этим фестивалем, чтобы дать вам всё разрушить."
10036030-224 = "Её намерения и стремления до крайности благородны и заслуживают награды."
10036030-226 = "Хм. Ладно, похоже, мы просто не сойдёмся во мнениях."
10036030-227 = "И что вы сделаете? Остановите нас?"
10036030-228 = "Все, выходите!"
10036030-229 = ""
10036030-233 = ""
10036030-236 = ""
10036030-237 = ""
10036030-238 = "Вас меньше и оружия у вас меньше. Отступите, пока всё не стало совсем плохо."
10036030-240 = "Хорошо, раз вы так говорите — отойдём."
10036030-241 = "Но сначала: ты там, можешь сделать три шага влево?"
10036030-243 = "А? Ты о чём вообще?"
10036030-244 = ""
10036030-246 = ""
10036030-247 = "Like this?"
10036030-249 = "Именно."
10036030-250 = "Действуй, Хиёри."
10036030-251 = ""
10036030-255 = ""
10036030-256 = "Ах! С-Снайпер!"
10036030-258 = "Твоя очередь, Ацуко."
10036030-259 = "Сейчас!"
