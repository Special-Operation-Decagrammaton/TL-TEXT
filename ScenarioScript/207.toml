[translation]
207-1 = "Ход: Слава через великолепие"
207-2 = "«Ход»."
207-3 = "Этот пророк Декаграмматона изначально был ИИ, управлявшим коммуникационной сетью одной академии."
207-4 = "Этот ИИ вступил в контакт с Декаграмматоном и тоже был перерождён как один из его верных пророков."
207-5 = "Если в Ходе и есть нечто особенно необычное, так это то, что его контакт с Декаграмматоном был раскрыт третьей стороной."
207-6 = "Процесс перерождения коммуникационного ИИ в пророка, разумеется, крайне любопытен... но нам совсем ни к чему, чтобы кто-то кроме нас разыскивал Декаграмматон."
207-7 = "Вы согласны, Сенсей? Хе-хе-хе-хе..."
207-8 = "..."
207-10 = "Путь Хода — исполнение через честь."
207-11 = "Его титул — Слава через великолепие."
207-12 = ""
207-13 = "Увы, нам удалось увидеть славный момент его перерождения в пророка... а значит, мы сами выступаем доказательством его пути, не так ли?"
207-14 = "Что скажете, Сенсей? И это тоже интересная тема."
207-15 = "Ха. Ха-ха-ха..."
