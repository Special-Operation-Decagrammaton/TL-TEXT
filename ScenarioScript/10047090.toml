10047090-12 = "[ns] «О? А где Рэна?»"
10047090-13 = "Рэна... вежливо отказалась."
10047090-14 = "Не думаю... что она придёт... Она договорилась ночевать в другом месте."
10047090-15 = "Понимаю. Эта операция довольно опасна."
10047090-16 = "А заставлять кого-то действовать вопреки своему сердцу — совсем не способ развивать искусство."
10047090-17 = "Продвигаться вперёд можно лишь принимая разнообразие мнений."
10047090-18 = ""
10047090-20 = ""
10047090-21 = ""
10047090-22 = "Ню-ху-ху, тогда давайте ещё раз повторим план и отдохнём до наступления ночи."
10047090-29 = ""
10047090-30 = "Наконец-то время пришло. Выходим на улицу."
10047090-31 = ""
10047090-33 = ""
