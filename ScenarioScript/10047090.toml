10047090-120 = ""
10047090-122 = ""
10047090-123 = "Отдел связи и безопасности, это Сова-3. На сегодня были запланированы какие-нибудь творческие... мероприятия с клумбами?"
10047090-124 = ""
10047090-126 = ""
