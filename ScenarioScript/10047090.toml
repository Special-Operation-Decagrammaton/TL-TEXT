10047090-1 = "Эпизод 9;Операция начинается"
10047090-3 = "Наконец настал особый день."
10047090-4 = ""
10047090-8 = ""
10047090-9 = ""
10047090-10 = "Мастер! Сегодня та самая ночь! Вы готовы?"
