10047090-51 = "*зевок* Ну и ночка... Ещё несколько минут патруля, и можно возвращаться в кровать..."
10047090-52 = "Кроме того, кто сейчас вообще станет буянить? Луна такая яркая!"
10047090-53 = ""
10047090-55 = ""
10047090-57 = ""
10047090-58 = "Нюфуфу, они не знают, что именно в полнолуние магия достигает своего пика!"
10047090-59 = "Самое главное — охрана, похоже, не слишком строгая. Для нас это хороший знак."
10047090-60 = "Тогда... разделимся..."
10047090-61 = "Да! Все, пожалуйста, займите участки, отмеченные на ваших картах!"
10047090-62 = "Когда закончите, благополучно встретимся в точке сбора!"
10047090-63 = "Да пребудет с вами благословение магии!"
10047090-64 = ""
10047090-66 = ""
10047090-67 = ""
10047090-68 = "[ns] «(Мне тоже надо поспешить.)»"
10047090-73 = "[ns1] «Это начальная точка?»\n[ns2] Проверить материалы для магического круга."
10047090-78 = "Раскопав отмеченное место, я нашёл провода, светодиодные ленты и светоотражающую ленту."
10047090-79 = ""
10047090-80 = "Мы выложим круг светодиодными лентами и светоотражающей лентой."
10047090-81 = "После подачи сигнала огни будут загораться один за другим."
10047090-82 = "Ну как, Сенсей? Всё безопасно... как я и говорила. Хи-хи..."
10047090-84 = "[ns3] «...Это определённо безопасно.»\n[ns4] «(Лучше поторопиться, пока меня не поймал Совет префектов.)»"
