[translation]
2002805-1 = "Личная консультация"
2002805-3 = ""
2002805-4 = "О, Сенсей. Сюда!"
2002805-5 = "Спасибо, что пришли. Я понимаю, что с вашей точки зрения это может показаться детским нытьём..."
2002805-6 = "[s1] «Ученикам иногда можно вести себя немного по-детски.»\n[s2] «Хината ведёт себя по-детски? Редкое зрелище.»"
2002805-7 = "Ха-ха-ха... Спасибо, что так это воспринимаете..."
2002805-8 = "Ха-ха-ха... П-правда...?"
2002805-9 = "Так... С чего же начать...?"
2002805-10 = "Если честно, дома я, наверное, вообще не смогла бы об этом заговорить."
2002805-11 = "Наверное, дело в обстановке? Здесь ведь нет других Сестёр."
2002805-12 = ""
2002805-15 = "Это, эм... то, что можно сделать только когда мы здесь вдвоём..."
2002805-16 = "Т-Так что... эм..."
2002805-17 = "[s3] «Можешь говорить всё, что думаешь, Хината.»\n[s4] «Всё хорошо, Хината. Я не стану тебя осуждать.»"
2002805-20 = "……!!"
2002805-21 = "Т-Так...! Т-Тогда...! Я-я хотела...!"
2002805-22 = ""
2002805-24 = ""
2002805-25 = "Хотела..."
2002805-27 = "Я хотела провести тренировочную консультацию!"
2002805-28 = ""
2002805-30 = ""
2002805-32 = "[ns] «Тренировочную консультацию?»"
2002805-33 = "Да, пожалуйста! Проведение консультаций входит в обязанности Сестры."
2002805-34 = "Те несколько раз, когда я пыталась их проводить, я так волновалась, что не могла как следует выполнить свой долг."
2002805-35 = "Другие Сёстры были очень добры и уверяли, что со временем станет легче... но мне кажется, что я только обременяю тех, кто приходит к нам поделиться своими тревогами."
2002805-36 = "Поэтому я изо всех сил избегала консультаций!"
2002805-37 = "Но как Сестра я не могу вечно уклоняться от своих обязанностей."
2002805-38 = "Я просто не знаю, как попросить Сестёр или другого студента потренироваться со мной в проведении консультации..."
2002805-39 = "[s5] «То есть ты хочешь, чтобы я рассказал тебе о своих проблемах. Давай.»\n[s6] «Это совсем не сложно. Начнём прямо сейчас?»"
2002805-40 = ""
2002805-41 = ""
2002805-43 = ""
2002805-44 = "Хорошо, что?! Прямо сейчас...?! Н-Немедленно!? Прямо здесь?!"
2002805-45 = "А если нас кто-нибудь услышит?"
2002805-46 = ""
2002805-48 = ""
2002805-51 = ""
2002805-52 = "О! Наверное, поблизости действительно никого нет."
2002805-53 = "В-Ведь именно поэтому я и позвала вас сюда, да? Хи-хи."
2002805-54 = "Ох... Признаюсь, я очень переживаю, как к этому подступиться..."
2002805-55 = "...Мне не нужно нервничать?"
2002805-56 = "В-Вы правы, Сенсей. В конце концов, это всего лишь тренировка."
2002805-57 = "*вдох*... *выдох*..."
2002805-58 = ""
2002805-60 = ""
2002805-61 = ""
2002805-62 = "Что ж, начнём эту консультацию."
2002805-66 = ""
2002805-67 = "Всё, что будет сказано с этого момента, останется конфиденциальным, и я клянусь никому не раскрывать наш разговор."
2002805-68 = "Итак, Сенсей..."
2002805-69 = "Что привело вас сегодня сюда? Можно мне... спросить, что вас беспокоит, Сенсей?"
2002805-70 = "[s] «Я могу говорить совсем честно?»"
2002805-71 = "Разумеется. Как Сестра, я сдержу своё слово."
2002805-72 = "Я хочу услышать ваши настоящие чувства. Что у вас на душе?"
2002805-73 = "[s] «Тогда скажу как есть.»"
2002805-74 = "Да, Сенсей. Расскажите мне."
2002805-75 = "Я бы хотел—"
2002805-76 = "[s7] «Так вот... я не хочу возвращаться.»\n[s8] «Я хочу остаться здесь навсегда.»"
2002805-79 = "Ах, понимаю. Значит, вы не хотите возвращаться и продолжать..."
2002805-80 = ""
2002805-82 = ""
2002805-83 = ""
2002805-84 = "П-Простите?"
2002805-85 = "Сенсей? Что именно вы имели в виду?"
2002805-86 = "[s9] «Я не хочу возвращаться! Я хочу дальше развлекаться!»\n[s10] «Ты же сказала, что я могу говорить всё что угодно!»\n[s11] «Я просто хочу провести здесь с тобой ещё больше времени, Хината!»"
2002805-87 = ""
2002805-88 = ""
2002805-89 = ""
2002805-91 = ""
2002805-92 = "Сенсей?! П-Пожалуйста! Давайте для начала успокоимся!"
2002805-93 = "Я, конечно, прекрасно понимаю, что вы хотите сказать."
2002805-94 = "Я бы с радостью провела с вами больше времени наедине."
2002805-95 = "...А?"
2002805-96 = "...О."
2002805-97 = "А, нет-нет! Нет-нет-нет-нет-нет-нет!"
2002805-98 = "Я совсем не это хотела сказать! Нет! Никогда! То есть, не то чтобы никогда, если вдруг представится возможность—"
2002805-99 = "Я Сестра! Я Сестра, и сейчас я говорю кощунственные вещи! Сестра Сакурако должна меня очистить!"
2002805-100 = "[s12] «Погоди, это не настолько... серьёзно...»\n[s13] «У-Успокойся, Хината. Просто успокойся!»"
2002805-103 = "Простите, простите!! Простите меня все!! И вы простите, Сенсей!!"
2002805-104 = "А..."
2002805-106 = "Уаааааа!!"
2002805-107 = ""
2002805-109 = ""
2002805-111 = "Остаток нашей консультации я провёл, успокаивая Хинату."
2002805-112 = ""
2002805-115 = "Мы решили потренироваться снова как-нибудь в другой раз."
