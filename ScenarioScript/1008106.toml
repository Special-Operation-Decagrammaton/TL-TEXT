[translation]
1008106-1 = "Радость ожидания"
1008106-2 = "Я отправился на наше обычное место встречи с Юкари."
1008106-3 = ""
1008106-11 = "[ns] Юкари должна быть..."
1008106-12 = "А, Сенсей! Я здесь!"
1008106-15 = "― [log=유카리]Хи-хи, сюда![/log][wa:2450]"
1008106-16 = "― [log=유카리]Я здесь, Сенсей.[/log][wa:1420]"
1008106-19 = "[ns] Прости, Юкари. Я заставил тебя долго ждать?"
1008106-22 = "― [log=유카리]Всё хорошо.[/log][wa:1370]"
1008106-23 = "― [log=유카리]Я совсем недолго ждала.[/log][wa:40]"
1008106-26 = "― [log=유카리]Я сама виновата, что пришла[/log][wa:2500]"
1008106-27 = "― [log=유카리]на час раньше.[/log][wa:1130]"
1008106-30 = "[ns1] Ты ждала целый час?!\n[ns2] Юкари. Почему ты вообще...?"
1008106-33 = "― [log=유카리]А, особой причины нет.[/log][wa:4200]"
1008106-34 = "― [log=유카리]Просто...[/log]"
1008106-37 = "― [log=유카리]Куда мы сегодня пойдём? Чем будем заниматься?[/log][wa:2950]"
1008106-38 = "― [log=유카리]Чему новому ты меня научишь?[/log][wa:340]"
1008106-41 = "― [log=유카리]Все эти мысли крутились у меня в голове,[/log][wa:810]"
1008106-42 = "― [log=유카리]и я не могла ждать ни минуты дольше.[/log][wa:10]"
1008106-45 = "― [log=유카리]Тебе не нужно беспокоиться.[/log][wa:2070]"
1008106-46 = "― [log=유카리]Вообще-то мне даже нравится ждать.[/log][wa:1950]"
1008106-49 = "― [log=유카리]На самом деле от этого момент, когда мы наконец оказываемся вместе,[/log][wa:3000]"
1008106-50 = "― [log=유카리]становится ещё приятнее.[/log][wa:950]"
1008106-53 = "[ns] Я очень это ценю."
1008106-56 = "― [log=유카리]Ну тогда нам нельзя терять время![/log][wa:740]"
1008106-59 = "― [log=유카리]Хи-хи. Пожалуйста,[/log][wa:2270]"
1008106-60 = "― [log=유카리]покажи мне ещё больше этого прекрасного мира, Сенсей![/log][wa:1770]"
1008106-63 = "Весь день я показывал Юкари как можно больше нового."
