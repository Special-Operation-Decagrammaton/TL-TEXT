[translation]
2600705-1 = "Причина торопиться"
2600705-2 = "По просьбе Аяне я пришёл к ней с ящиком инструментов и винтами."
2600705-3 = "Место было там, где изначально разбился наш вертолёт, так что найти его было легко."
2600705-8 = "......"
2600705-9 = "Я думал, она работает, но ничего не слышал."
2600705-10 = ""
2600705-13 = "[ns] «Аяне, ты здесь?»"
2600705-14 = "Угх..."
2600705-15 = "Н-н-н...!"
2600705-16 = "[ns] «...Аяне?!»"
2600705-17 = ""
2600705-24 = "Простите, Сенсей... Я попросила вас прийти, а сама потеряла сознание..."
2600705-25 = "Ну, бывает. Мы всё-таки на острове, а сегодня особенно жарко..."
2600705-26 = "Вертолёт металлический, поэтому под палящим солнцем от него идёт невыносимый жар... Как я могла об этом не подумать...?"
2600705-27 = "Простите..."
2600705-28 = "[s1] «В такой день тебе нельзя работать одной.»\n[s2] «Тебе нужно беречь себя.»"
2600705-29 = "Есть..."
2600705-30 = "Есть..."
2600705-31 = "Хм...?"
2600705-32 = "Что у вас в руке?"
2600705-33 = "А, точно. Я просила вас принести винты и..."
2600705-34 = "Спасибо, Сенсей. Мне уже лучше. Просто отдайте их мне, и я здесь закончу."
2600705-35 = "Хм?"
2600705-36 = "Вы будете делать это вместе со мной? Ремонтировать вертолёт?"
2600705-37 = "Вам не обязательно... Я могу справиться одна..."
2600705-38 = "Может, мне просто закончить на сегодня? Отдых и правда звучит неплохо..."
2600705-39 = "Хм?"
2600705-40 = "Вы хотите сделать ремонт за меня?"
2600705-41 = "Это уже слишком... То, что вы принесли инструменты, и так более чем достаточно..."
2600705-42 = ""
2600705-44 = ""
2600705-45 = "Но разве не будет грубо отказаться от вашего предложения...?"
2600705-46 = "Хорошо! Давайте сделаем это вместе, Сенсей!"
2600705-47 = ""
2600705-49 = ""
2600705-50 = ""
2600705-52 = "Спасибо за помощь!"
2600705-54 = "Мы с Аяне весь оставшийся день ремонтировали вертолёт."
2600705-55 = "Работы было много, поэтому к вечеру мы не закончили."
2600705-60 = "Но продвинулись довольно далеко."
2600705-61 = "Теперь он и правда выглядит намного лучше."
2600705-62 = ""
2600705-64 = ""
2600705-65 = "Может, на сегодня остановимся, Сенсей?"
2600705-66 = "[s3] «Конечно, на сегодня достаточно.»\n[s4] «Да. Теперь выглядит гораздо лучше.»"
2600705-67 = "Хотя впереди ещё много работы..."
2600705-68 = "Хотя впереди ещё много работы..."
2600705-69 = "Хм?"
2600705-70 = "Вы имели в виду меня? Что вы хотите сказать...?"
2600705-71 = "[s5] «Ты выглядишь намного довольнее.»\n[s6] «А что бы ты чувствовала, если бы мы закончили раньше?»"
2600705-72 = ""
2600705-73 = ""
2600705-75 = ""
2600705-76 = "Сенсей... Я всё думала, почему вы предложили помочь..."
2600705-77 = "Вот почему вы сказали, что нам стоит поработать ещё."
2600705-78 = "Я всегда стараюсь вас не обременять, а вы даже это учитываете."
2600705-79 = "Я каждый раз в итоге благодарю вас, но не уверена, что этого достаточно..."
2600705-80 = "...А? Всё нормально, потому что вы мой учитель?"
2600705-81 = "...Хаха."
2600705-82 = "Сенсей... Вам не кажется, что вы слишком часто это говорите?"
2600705-83 = "В любом случае спасибо. Как вы и сказали, сегодня я смогу хорошо отдохнуть."
2600705-84 = "И ещё..."
2600705-85 = "А? Вы хотите, чтобы я встала рядом? Зачем...?"
2600705-86 = "Фото на память?"
2600705-87 = "Ч-Что?! Н-Нет, спасибо! Я не хочу фотографироваться..."
2600705-88 = "[s7] «Будет приятно сохранить этот момент в памяти.»\n[s8] «После всего ремонта — и ни одной фотографии?»"
2600705-89 = "Ох... Э-Это... Эм..."
2600705-90 = "Ох... Э-Это... Эм..."
2600705-91 = ""
2600705-93 = ""
2600705-94 = "Хи-хи... Хорошо."
2600705-95 = ""
2600705-97 = ""
2600705-98 = ""
2600705-100 = "Раз вы настаиваете, видимо, выбора нет."
2600705-103 = "― Эм, я могу встать здесь.[wa:5050]"
2600705-105 = "― Может, с этой стороны...?[wa:1050]"
2600705-108 = "― Вот так... Как выглядит?[wa:760]"
2600705-111 = "― К-Какой ракурс лучше всего для вертолёта?[wa:1310]"
2600705-114 = "― Простите."
2600705-116 = "― Я не привыкла к таким вещам...[wa:90]"
2600705-119 = "― Эм... Сенсей?[wa:2590]"
2600705-121 = "― Если это фото для фиксации ремонта вертолёта...[wa:10]"
2600705-124 = "― ...разве вертолёт не должен быть в центре кадра...?[wa:170]"
2600705-127 = "― Д-Дело не в вертолёте, а во мне...?[wa:1690]"
2600705-130 = "― О, п-правда?! А-а-а?![wa:1940]"
2600705-133 = "― То есть... Это как-то... Я не говорю, что мне не нравится, но...![wa:1720]"
2600705-136 = "― Мне кажется, я вдруг покраснела...[wa:960]"
2600705-139 = "Почему-то на одну фотографию ушло очень много времени..."
2600705-140 = "Ещё раз спасибо, Сенсей. Сегодня мне повезло."
2600705-141 = "Мне нечего особо предложить взамен, но мои услуги пилота вертолёта всегда к вашим услугам!"
2600705-142 = "Позовите меня в любое время, и я сразу прилечу к вам!"
2600705-143 = "[s9] «Ты можешь так часто пользоваться вертолётом?»\n[s10] «Ты уверена? Топливо наверняка дорогое...»"
2600705-144 = ""
2600705-145 = ""
2600705-147 = ""
2600705-148 = "Эм..."
2600705-149 = "Эм, теперь, когда вы сказали..."
2600705-150 = "Ох... Ахаха... Ахахаха..."
2600705-151 = "Хм-м."
2600705-153 = "П-Пожалуй, не слишком часто..."
