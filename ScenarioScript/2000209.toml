[translation]
2000209-1 = "Незусукэ пропал!"
2000209-2 = "Лаборатория Саи"
2000209-3 = "Сенсей! Что мне делать?! Незусукэ... Незусукэ..."
2000209-4 = "Незусукэ пропал!"
2000209-5 = "Я думала, он играет в прятки, и обыскала всю лабораторию... Но нигде не могу его найти!"
2000209-6 = ""
2000209-7 = "Незусукэ никогда так не исчезал... Что мне делать? *рыдает*"
2000209-8 = "[s] Успокоить Саю."
2000209-9 = ""
2000209-10 = "*всхлип* А вдруг... с Незусукэ случилось что-то ужасное?"
2000209-11 = "Куда он мог уйти? Мы с Незусукэ всегда были неразлучны. Он бы никогда не убежал без меня!"
2000209-12 = "[s] «Давай спросим других членов Общества восточной алхимии.»"
2000209-13 = "Хорошо... *шмыг*"
2000209-15 = "Класс Шаньхайцзина"
2000209-16 = "Незусукэ пропал? Ужас..."
2000209-17 = "Ты сегодня его видела?"
2000209-18 = "Нет... Единственное место, где я вообще видела Незусукэ, — твоя лаборатория."
2000209-19 = "Не могу поверить. Незусукэ правда пропал..."
2000209-20 = "Что мне делать...? *всхлип*"
2000209-21 = "Прости за такой вопрос, но... как думаешь, Незусукэ мог сбежать?"
2000209-22 = "...Сбежать?"
2000209-23 = "Ну, ты ведь постоянно мучаешь его своими экспериментами..."
2000209-24 = "Я вообще уважаю его за то, что он продержался так долго."
2000209-25 = "Мучаю?! Я всегда сначала просила Незусукэ о помощи и согласии! Я никогда над ним не издевалась!"
2000209-26 = "Но Незусукэ никогда не выглядел так, будто хотел участвовать в этих экспериментах. И я его понимаю. Для него они никогда хорошо не заканчиваются..."
2000209-27 = "Как ты смеешь...?"
2000209-28 = "[s] «Давай спросим других сотрудников.»"
2000209-29 = "Хорошо..."
2000209-31 = "Что? Незусукэ пропал?"
2000209-32 = "Ага... Ты сегодня его не видела?"
2000209-33 = "Не думаю... Я бы запомнила, если бы Незусукэ где-то бегал."
2000209-34 = "Куда он мог уйти...? *всхлип*"
2000209-35 = "Эм... Не хочу делать поспешных выводов, но, может, Незусукэ сбежал?"
2000209-36 = "Почему все так думают?"
2000209-37 = "Ну, сколько тебя знаю, ты постоянно мучаешь беднягу."
2000209-38 = "В последний раз говорю — это не издевательства! Угх..."
2000209-39 = "[s] «Давай поищем Незусукэ по академии.»"
2000209-40 = "Ладно..."
2000209-42 = "Академия Шаньхайцзин"
2000209-43 = ""
2000209-44 = ""
2000209-45 = ""
2000209-46 = ""
2000209-47 = "Незусукэ... Где ты?"
2000209-48 = "[s] «Давай посмотрим вон там.»"
2000209-49 = "Может, они правы. Незусукэ наверняка сбежал..."
2000209-50 = "*рыдает* Я слишком его мучила. Незусукэ сбежал и больше никогда не вернётся, потому что перестал меня любить..."
2000209-51 = "[s] Сказать ей не сдаваться."
2000209-52 = "Я ведь и тебя втягивала в свои эксперименты, да? Тогда почему... ты всё ещё так добр ко мне?"
2000209-53 = "[s1] «Мне было весело, потому что я был с тобой.»\n[s2] «Учителя созданы, чтобы справляться с подобным.»"
2000209-55 = "Сенсей..."
2000209-57 = "Сенсей..."
2000209-60 = "*писк* *писк*"
2000209-61 = "О, Незусукэ! Я тебя везде искала! *рыдает навзрыд*"
2000209-62 = "*писк* *писк*"
2000209-63 = "*рыдает* Ты сбежал, потому что я плохо с тобой обращалась? Прости меня..."
2000209-64 = "*писк* *писк*"
2000209-65 = "Что? Ты ушёл, потому что услышал, что на Променаде бесплатно раздают семечки? Почему ты хотя бы записку не оставил?! Мы весь день тебя искали!"
2000209-66 = "*рыдает* Но всё равно, прости. Обещаю больше так сильно тебя не мучить... Я не знаю, что бы делала без тебя."
2000209-67 = "*пи-пи*"
2000209-68 = ""
2000209-69 = ""
2000209-70 = "Даю слово: теперь буду использовать тебя только в действительно важных экспериментах!"
2000209-71 = "*пи-пи*!"
2000209-72 = "Незусукэ! Не надо так возмущаться. Обещаю, больше никогда тебя не упущу."
2000209-73 = ""
2000209-74 = "*пи-пи* *пи-пи*!"
2000209-76 = "После этого Сая потащила Незусукэ обратно в лабораторию."
