[translation]
2004106-1 = "Секретное место"
2004106-3 = "По дороге я вспоминал свой разговор с Рио."
2004106-5 = "Как я уже говорила, у меня несколько убежищ."
2004106-6 = "Считайте, что в одно из них вы приглашены."
2004106-7 = "В каком-то смысле оно может стать нашим общим секретным местом."
2004106-8 = "С точки зрения безопасности проблем нет. Это я могу гарантировать."
2004106-9 = "Однако если кто-нибудь всё же найдёт это место..."
2004106-10 = "...тогда я буду знать, что рассказать о нём мог только один человек — вы."
2004106-11 = "Фуфу. Если такое случится, мне понадобится соответствующая компенсация."
2004106-12 = "Разумеется, я не ожидаю, что это произойдёт. Я вам доверяю."
2004106-13 = "[s] «Чуть БОЛЬШЕ доверия не помешало бы...»"
2004106-14 = "Принято к сведению."
2004106-15 = "Буду ждать нашей встречи."
2004106-17 = "Я позвонил на одноразовый телефон Рио."
2004106-18 = ""
2004106-22 = "С-Сенсей?! Почему вы звоните мне сейчас...?"
2004106-23 = "А? КОТОРЫЙ час?! У меня весь день были закрыты шторы. Должно быть, я совсем потеряла счёт времени...!"
2004106-24 = "О-ой. Что же мне делать...?"
2004106-25 = "[s] «Что случилось, Рио? Что-то произошло?!»"
2004106-26 = "Н-ничего! Ничего не происходит! Но...!"
2004106-27 = ""
2004106-29 = ""
2004106-34 = "Решив, что Рио попала в беду, я поспешил к ней."
2004106-35 = ""
2004106-43 = "[ns] «Рио!»"
2004106-44 = ""
2004106-45 = "С-Сенсей?! Почему вы так рано...?"
2004106-46 = "Н-нет, вообще-то вы пришли вовремя, но..."
2004106-47 = "[ns1] «Боже...»\n[ns2] «Глядя на эту комнату, я понимаю, почему ты так переживала...»"
2004106-50 = "У-ух..."
2004106-51 = "[ns] «Так... Это бэнто из круглосуточного магазина...»"
2004106-52 = "Д-да, верно..."
2004106-53 = "Угу. Бутылка сока, пустая бутылка из-под воды..."
2004106-54 = ""
2004106-58 = ""
2004106-59 = "...и нет, это не мусор! Это оборудование и реагенты для эксперимента! А вон там — инструменты!"
2004106-60 = "..."
2004106-61 = "Простите, Сенсей... Мне правда очень жаль..."
2004106-62 = "Я думала, что смогу... убрать всё сама..."
2004106-63 = "[s] «А раньше кто за тебя убирал...?»"
2004106-64 = "Т-Токи, тогда."
2004106-65 = "[s] «Понятно. Ну, тогда всё сходится.»"
2004106-66 = "О-одной самостоятельной жизни нужно столькому научиться! Мне что, всё это освоить сразу?!"
2004106-67 = "И вообще, Сенсей, вы сами не всегда хорошо убираетесь, знаете ли!"
2004106-68 = "Но..."
2004106-69 = ""
2004106-71 = ""
2004106-72 = ""
2004106-73 = "П-погодите, куда вы вдруг собрались?!"
2004106-74 = "[s] «Нам понадобятся мусорные пакеты на 50 литров.»"
2004106-75 = "Х-хорошо..."
2004106-81 = "Здесь... и правда стало гораздо чище."
2004106-82 = "Что? Мы ещё даже половины не сделали? Я неправильно понимаю слово «чисто»?"
2004106-83 = "..."
2004106-84 = "Я могу чем-нибудь помочь?"
2004106-85 = "Вы говорите, всё нормально и мне стоит немного отдохнуть? Но..."
2004106-86 = "Л-ладно. Раз вы настаиваете..."
2004106-89 = "― [log=리오]Я ведь позвала вас[/log][wa:3240]"
2004106-90 = "― [log=리오]не ради этого...[/log][wa:1830]"
2004106-93 = "― [log=리오]Я сама всё сделаю. Вам следует присесть.[/log][wa:700]"
2004106-96 = "― [log=리오]С-Сенсей, вам правда стоит лучше осознавать своё положение.[/log][wa:1730]"
2004106-98 = "― [log=리오]Тратить на это время нерационально.[/log][wa:1200]"
2004106-101 = "― [log=리오]Разве у вас нет гораздо более важных дел?[/log][wa:10]"
2004106-104 = "[ns3] «Заботиться о моих учениках тоже важно.»\n[ns4] «А сейчас моя самая важная работа — позаботиться о тебе.»"
2004106-107 = "― [log=리오]Ч-что вы... говорите...?[/log][wa:1620]"
2004106-109 = "― [log=리오]Заботиться обо мне...?![/log][wa:860]"
2004106-112 = "― [log=리오]Я... я не понимаю. Это...[/log][wa:2890]"
2004106-114 = "― [log=리오]Хотя... вы всегда были таким человеком.[/log][wa:1170]"
2004106-117 = "― [log=리오]...Хорошо.[/log][wa:2120]"
2004106-119 = "― [log=리오]Тогда я всё приму.[/log]"
2004106-122 = "― [log=리오]Вашу... «заботу», я имею в виду.[/log][wa:1370]"
2004106-128 = "Теперь я понимаю. Значит, вот что на самом деле значит... «убираться»."
2004106-129 = "Что? Здесь всё ещё не «по-настоящему чисто»? Вот как...?"
2004106-130 = "Потому что вон там куча мусорных пакетов? Можно же просто выбрать место и выбросить их туда, верно?"
2004106-131 = "...Нет. Если подумать, Токи всегда выбрасывала их как положено."
2004106-132 = "А вы уже сделали столько всего..."
2004106-133 = "..."
2004106-134 = "...значит, если постараться, с этим справится кто угодно."
2004106-135 = "[s5] «Эм... Это...»\n[s6] «(Я даже не знаю, как на это реагировать...)»"
2004106-138 = "Я-я опять сказала что-то не то...?!"
2004106-139 = "Нет? Но... А? Всё нормально? Что вообще происходит...?"
2004106-140 = ""
2004106-142 = ""
2004106-143 = ""
2004106-144 = ""
2004106-145 = ""
2004106-146 = ""
2004106-147 = ""
2004106-148 = "П-почему вы вдруг гладите меня по голове?!"
2004106-149 = "..."
2004106-150 = "Ну, это не неприятно... так что можете продолжать..."
2004106-152 = ""
2004106-153 = "[ns] «Нам обоим стоит что-нибудь поесть.»"
2004106-154 = "А-а? Ну, уже пора, но я не так уж голодна..."
2004106-155 = "О, но вы наверняка голодны после всей этой тяжёлой работы... которую сделали ради меня."
2004106-156 = "Ещё раз прошу прощения, Сенсей."
2004106-157 = "Но если я выйду наружу, что если меня заметят?"
2004106-158 = "[s7] «Мы в старом районе, далеко от Миллениума.»\n[s8] «Думаю, всё будет нормально.»"
2004106-161 = "Л-Ладно."
2004106-162 = "Эм, спасибо вам... за всё сегодня."
2004106-163 = "Так что—"
2004106-164 = ""
2004106-166 = ""
2004106-167 = "Кя-а!"
2004106-168 = ""
2004106-170 = ""
2004106-172 = "Рио споткнулась о кучу мусорных пакетов."
2004106-173 = "[ns] «Ого, Рио, ты в порядке?!»"
2004106-174 = ""
2004106-176 = ""
2004106-177 = "Д-да, всё хорошо. Спасибо, что спросили..."
2004106-178 = "[s] «Хорошо. Сможешь встать?»"
2004106-179 = "Встать я могу, без проблем. Без проблем, но..."
2004106-180 = "..."
2004106-181 = "...Эм, Сенсей?"
2004106-182 = "На минутку, всего на минутку..."
2004106-183 = ""
2004106-185 = ""
2004106-186 = ""
2004106-187 = "...можем мы остаться вот так...?"
2004106-188 = "[s] «Хм? Можем, но почему?»"
2004106-189 = "...Спасибо, Сенсей."
2004106-190 = ""
2004106-192 = ""
2004106-193 = "Спасибо вам... правда."
2004106-195 = "Вместе с Рио, которая выглядела чуть более нерешительной, чем обычно..."
2004106-196 = "...я поужинал, а затем вернулся в Шале."
