[translation]
1301-1 = "Президент всегда права, часть 1"
1301-2 = "Президентский кабинет академии Красная Зима"
1301-3 = "Хм..."
1301-4 = ""
1301-5 = "Могу я чем-то помочь, президент Черина?"
1301-6 = "Ты когда-нибудь слышала о персонаже по имени Пероро?"
1301-7 = "Пероро?"
1301-8 = "А, да. Помню, у нескольких студентов была странная плюшевая птица с таким именем."
1301-9 = "Она пускала слюни и хлопала крыльями. Я сочла её недостойной студентов Красная Зима и конфисковала все экземпляры. Что-то случилось?"
1301-10 = "Видишь ли, в прошлые выходные я была в центре Кивотоса, и там на аукционе продавали Пероро из ограниченной серии."
1301-11 = "Все до смерти хотели заполучить эту огромную, уродливую и бесполезную плюшевую игрушку. Они даже готовы были платить вдвое больше!"
1301-12 = "Миллениум, Геенна и даже эти высокомерные студенты Тринити — все отчаянно хотели Пероро."
1301-13 = "Ха-ха! Как жалко! Студентам этих школ промыла мозги свобода информации!"
1301-14 = "Федеральная академия Красная Зима контролирует подобные глупые СМИ, чтобы наших студентов так же не манипулировали."
1301-15 = "Хм. Но мудрый правитель учится даже у дураков."
1301-16 = "Я, умная и мудрая Великая Вождь, вдохновилась их идиотизмом и придумала блестящий способ укрепить нашу власть!"
1301-17 = "Просветите меня, Великая Вождь."
1301-18 = ""
1301-20 = ""
1301-22 = "Нужно... привезти Пероро в Федеральную академию Красная Зима!"
1301-24 = ""
1301-26 = ""
1301-27 = ""
1301-28 = "Простите?"
1301-29 = "Что?! У тебя уши не работают, председатель Марина?"
1301-30 = "Я сказала: хочу привезти Пероро в Федеральную академию Красная Зима."
1301-31 = "Пусть эта птица — слюнявый болван, но студенты Кивотоса без сомнений ею одержимы."
1301-32 = "Значит, если мы привезём Пероро сюда, он наверняка привлечёт абитуриенток со всего Кивотоса, верно?"
1301-34 = "Сила академии пропорциональна числу студентов... Если благодаря Пероро нас станет больше, академия Красная Зима превратится в суперакадемию, рядом с которой Тринити и Геенна и рядом не стояли!"
1301-36 = "Однако... у Пероро довольно небольшая аудитория поклонников."
1301-38 = ""
1301-39 = ""
1301-40 = "Идеальный план, Великая Вождь!"
1301-41 = "Главный секретарь Томоэ?"
1301-42 = "Продвижение с помощью талисманов — основа пропаганды! Стоит нам завести собственного очаровательного маскота, и студенты начнут стекаться сюда толпами!"
1301-43 = "Так быстро придумать столь великолепный план... Великолепное решение, президент Черина!"
1301-44 = "Н-неужели?"
1301-45 = "А-ха-ха! Разумеется! Естественно, я — президент студсовета, Украшательница земель, Великая Вождь и капитан спортивного клуба — придумала гениальный план!"
1301-46 = "Белоснежные перья Пероро идеально подойдут образу академии Красная Зима. Можно одеть его в форму и сделать нашим пиар-менеджером."
1301-47 = "А большой белый ус доведёт образ до совершенства. Что скажете? Слава о могуществе Красная Зима разнесётся по всему Кивотосу."
1301-48 = "Да, именно это я и придумала! Отлично, Томоэ!"
1301-49 = "Но... Пероро ведь не студент... да и вообще не настоящий."
1301-50 = ""
1301-51 = ""
1301-52 = "Председатель Марина, что ты там бормочешь в углу?#nГовори громче!"
1301-53 = "Или... у тебя есть претензии к моему великому плану?"
1301-54 = "К-Конечно нет! Это... замечательная идея!"
1301-55 = "Правда ведь? Мои планы всегда безупречны!"
1301-56 = "Осталось только понять, как перевести Пероро сюда..."
1301-57 = "Председатель Марина! Ты будешь отвечать за перевод Пероро в академию Красная Зима!"
1301-58 = "Что?!"
1301-59 = "Ты что, не рада? Для тебя должно быть честью исполнить мой план!"
1301-60 = "Когда успешно доставишь Пероро в Красная Зима, я награжу тебя медалью «Золотой ус»!"
1301-61 = "Н-Но как я должна зарегистрировать вымышленного персонажа как студента?"
1301-62 = "Что за неуважение, председатель Марина!"
1301-63 = "Я собственными глазами видела, как Пероро танцевал и пел в центре Кивотоса!"
1301-64 = "Ты хочешь сказать, что не веришь словам президента академии Красная Зима, Украшательницы земель, Великой Вождя и так далее?"
1301-65 = "Н-Нет, я не это имела в виду..."
1301-67 = "Позвольте вмешаться. В правилах академии Красная Зима всё написано."
1301-68 = "Правила Федеральной академии Красная Зима, статья 1: президент Черина всегда права."
1301-69 = "Правила Федеральной академии Красная Зима, статья 2: любой, кто делает заявление, нарушающее статью 1, подлежит чистке."
1301-70 = "Очень надеюсь, председатель Марина, что вы не нарушаете правила."
1301-72 = "К-Конечно нет, но..."
1301-73 = ""
1301-75 = "(П-Плохо дело! Такими темпами меня подвергнут чистке!)"
1301-76 = "(Но как мне превратить вымышленного персонажа в студента?)"
1301-77 = "(Стоп. Я не могу сделать вымышленного Пероро настоящим, но что, если сделать что-то настоящее Пероро?)"
1301-78 = "(Хи-хи... Ладно! Это сработает!)"
1301-80 = ""
1301-81 = "Можете на меня рассчитывать, президент. Я доставлю Пероро в академию Красная Зима, как вы приказали!"
1301-82 = "Отлично. Рассчитываю на тебя, председатель Марина."
1301-83 = "*зевок* Уже пора спать?"
1301-84 = "Томоэ... Я хочу спать..."
1301-85 = "Ваша кровать уже готова. Прошу сюда."
1301-86 = ""
1301-88 = ""
1301-89 = ""
1301-90 = "Перевод Пероро в Федеральную академию Красная Зима..."
1301-91 = "Если это провалится, я могу лишиться повышения... А то и хуже — попасть под чистку. Этого нельзя допустить. Всё должно сработать. Я должна доказать свою ценность."
1301-92 = "Президент Черина всегда права!"
