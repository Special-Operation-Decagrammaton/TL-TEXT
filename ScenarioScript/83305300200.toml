[translation]
83305300200-6 = ""
83305300200-7 = "Что бы ни случилось, Сенсей мне доверяет. Я не подведу."
83305300200-8 = "[ns] «А! Хи─»"
83305300200-10 = "[ns] «─на-а-а-а?!»"
83305300200-11 = "П-почему вы издаёте такие странные звуки, Сенсей...?"
83305300200-12 = "[s] «Увидеть тебя вне работы и так нарядно одетой... Думаю, тебе очень идёт»."
83305300200-13 = "Р-рада это слышать."
83305300200-14 = "Но не обязательно так громко выкрикивать моё имя. Я прямо здесь."
83305300200-15 = "Добро пожаловать, глава префектов. Я ждала вашего прибытия."
83305300200-16 = "Да. Спасибо за помощь, Ако. Благодаря тебе я смогла потренироваться столько, сколько хотела."
83305300200-17 = "Рада это слышать. Но мне нужно доложить о беспорядках, которые произошли ранее."
83305300200-18 = "Понятно... Значит, пока меня не было, Макото снова действовала сама по себе..."
83305300200-19 = "Разберусь с этим до начала выступления."
83305300200-20 = "[ns] «На тебя всегда можно положиться, Хина!»"
83305300200-21 = "...Н-не нужно делать из этого такое событие..."
83305300200-22 = "Похоже, всё снова скатывается в хаос..."
83305300200-23 = "Что ж, прежде чем вечеринка официально начнётся─"
83305300200-24 = ""
83305300200-26 = ""
83305300200-28 = "Я приведу всё в порядок."
83305300200-29 = "Сенсей... Поможете мне?"
83305300200-30 = "[ns] «Конечно»."
83305300200-31 = "Хорошо. Напомним всем, зачем в Геенне вообще существует Префектурная команда?"
83305300200-32 = "Да, глава префектов! Я за вами!"
