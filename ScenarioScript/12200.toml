[translation]
12200-1 = "Episódio 20;Epílogo"
12200-2 = "Olá, Sensei."
12200-3 = "Mais um dia agitado começa no Comitê de Contramedidas de Abydos."
12200-4 = "Depois daquilo, graças à autenticação oficial do Sensei, o Comitê de Contramedidas foi finalmente reconhecido como um comitê oficial do Colégio Abydos."
12200-5 = "Grande parte dos problemas que enfrentamos foi por sermos um grupo não oficial, então isso já é um grande alívio."
12200-6 = "Graças a isso, o Comitê de Contramedidas também assumiu oficialmente o papel de Conselho Estudantil de Abydos."
12200-7 = "Pessoalmente, eu gostaria que a Hoshino-senpai se tornasse a presidente do conselho estudantil, mas ela recusou categoricamente..."
12200-8 = "A nova presidente do conselho estudantil ainda não foi decidida."
12200-10 = "Sejam bem-vindos! Este é o Lámen Shibasaki!"
12200-12 = "O Lámen Shibasaki reabriu como uma barraquinha de rua."
12200-15 = "Parece que tem aparecido bastante gente por lá, então a Serika-chan também voltou ao trabalho de meio período."
12200-17 = "O Mestre também está trabalhando ainda mais animado do que antes... Pelo visto, a aposentadoria dele ainda está bem longe."
12200-19 = "Graças ao Sensei, o caso da Hoshino-senpai foi resolvido, mas a dívida de Abydos continua sendo de 900 milhões de ienes... Bem, quanto a isso, quase nada mudou desde o começo..."
12200-20 = "Quanto à Kaiser Loans, as transações financeiras ilegais deles no mercado negro foram descobertas, e parece que o Conselho Estudantil Geral vai abrir uma investigação."
12200-21 = "Será que Trinity tomou alguma providência depois do relatório da Hifumi-san...?"
12200-22 = "Sinceramente, duvido um pouco que o Conselho Estudantil Geral vá conduzir essa investigação direito... mas, ainda assim, acho que a situação vai melhorar um pouco."
12200-23 = "Depois do ocorrido, o diretor da Kaiser Corporation passou a ser procurado como o principal suspeito do sequestro de uma estudante."
12200-24 = "Ainda assim, como o Conselho Estudantil Geral não está funcionando direito no momento, talvez ele não seja capturado tão facilmente..."
12200-25 = "A Kaiser Corporation até o demitiu imediatamente para alegar que não tinha nada a ver com o assunto. Adultos dão medo, né..."
12200-26 = "Ah, e aqueles juros absurdos que eles aumentaram à força também viraram alvo de investigação. No fim, passamos a pagar juros bem menores do que antes, o que foi uma mão na roda."
12200-28 = "Porém, a maior parte do Distrito Autônomo de Abydos continua sob posse da Kaiser Corporation..."
12200-29 = "Como o acordo entre Abydos e a Kaiser Corporation em si não era ilegal, por enquanto parece que não há muito o que fazer."
12200-30 = "O que eles estão tramando naquele lugar... No fim das contas, não conseguimos descobrir."
12200-32 = "Por falar nisso, o pessoal da Faz-Tudo parece ter montado um escritório em algum outro lugar."
12200-33 = "Só que, pelos rumores desencontrados, não dá para saber ao certo se é no distrito autônomo de Gehenna ou em outro lugar..."
12200-34 = "Dizem que elas estão na mira do Comitê Disciplinar de Gehenna, então com certeza não devem estar tendo vida fácil..."
12200-36 = "E sobre aquela pessoa chamada \"Terno Preto\"."
12200-37 = "Eu investiguei com base nas informações que o Sensei e a Hoshino-senpai passaram... mas não encontrei absolutamente nada de concreto."
12200-38 = "Parece que toda a culpa foi jogada nas costas do diretor da Kaiser... Não sabemos nem o nome verdadeiro nem a identidade do \"Terno Preto\"..."
12200-39 = "O resto, pelo visto, teremos que deixar nas mãos da \"Schale\"."
12200-41 = "...Pois bem, vamos começar a reunião regular do Comitê de Contramedidas de Abydos."
12200-42 = "Muita coisa aconteceu ultimamente, mas, no fim das contas, nossa dívida não desapareceu."
12200-43 = "Mas os juros mensais diminuíram bastante."
12200-44 = "Pois é~ Já que o peso diminuiu, que tal tirarmos uma soneca bem tranquila?"
12200-45 = "Sim, sim! Estivemos super ocupadas ultimamente, então apoio totalmente a ideia de relaxar um pouco!"
12200-46 = "O que vocês estão dizendo?! Pode até ser que a gente tenha um pouco mais de folga, mas não temos tempo para ficar à toa!"
12200-47 = "Serika-chan..."
12200-48 = "Falando como tesoureira do Comitê de Contramedidas, ainda estamos no olho do furacão! Não temos folga nenhuma!"
12200-49 = "S-Sim..."
12200-50 = "Sendo assim, eu pesquisei a mais nova tendência do momento!"
12200-52 = "Alguém sabe o que é isso aqui?"
12200-53 = "Hmm... Uma peça de computador?"
12200-54 = "Isso se chama placa de vídeo, e com ela vamos minerar uma criptomoeda chamada Scamcoin!"
12200-55 = "Criptomoeda é... O-O que foi?! Por que estão todas me olhando com essa cara de pena?!"
12200-56 = "Deixando o golpe da Serika de lado, eu tenho uma ideia bem melhor. Olhem aqui, se invadirmos o prédio por esta rota—"
12200-57 = "As duas estão vetadas~."
12200-58 = "...O Comitê de Contramedidas continua exatamente assim, como sempre."
12200-59 = "Voltamos à nossa rotina de sempre, como se nada tivesse mudado..."
12200-60 = "...Mas eu fico muito feliz por isso."
12200-64 = "Por enquanto, esse é o meu relatório da situação atual. Continuamos contando com você, Sensei."
12200-65 = "O que perdemos, e o que não deixamos escapar"
12200-67 = "Arco do Comitê de Contramedidas;Continua no Capítulo 3"
