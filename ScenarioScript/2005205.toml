[translation]
2005205-1 = "Расписание"
2005205-3 = ""
2005205-4 = "[ns] «...»"
2005205-5 = "..."
2005205-6 = "[s1] «Поезд... не приезжает...»\n[s2] «Если так продолжится... кажется, я сейчас зачахну...»"
2005205-9 = "Серьёзно, даже если это моя собственная академия..."
2005205-10 = "Я могу придумать лишь ограниченное число оправданий нашей до смешного ужасной инфраструктуре."
2005205-11 = "Хотя удивляться уже не должна, я ни разу не видела, чтобы поезд кампусного шаттла пришёл вовремя..."
2005205-12 = "Так дело не пойдёт, Сенсей."
2005205-13 = "Я, Арамаки Якумо, приняла решение."
2005205-14 = "[s] «От этих слов мне становится чрезвычайно тревожно...»"
2005205-15 = "О-хо, вот какого вы обо мне мнения? Я ведь не ТОЛЬКО обманываю вас и манипулирую вами."
2005205-16 = "Если мы хотим добиться перемен, первым делом нужно создать образец лучших практик."
2005205-17 = "Иными словами, если мы хотим преобразить железнодорожную инфраструктуру Красной Зимы, сначала нужно представить, как выглядит образцовая работа железной дороги!"
2005205-18 = "Как минимум необходимо лично испытать, каково это — когда у поездов существует настоящее расписание и они действительно его соблюдают!"
2005205-19 = "[s] «Это первая разумная вещь, которую ты сказала за целую вечность!»"
2005205-20 = "Правда?"
2005205-21 = "Хотите знать, куда мы отправимся дальше?"
2005205-22 = "С этого момента... за пределами Красной Зимы..."
2005205-23 = "Я буду ездить по железнодорожной сети D.U., анализируя маршруты и расписания!"
2005205-24 = "Присоединяйтесь ко мне, Сенсей! В качестве консультанта по исследованию!"
2005205-25 = "[s] «Значит, вот к чему всё шло...?»"
2005205-26 = "Ну же. Это ведь работа, связанная с образованием студентов, знаете ли?"
2005205-27 = "Если нормально оформить отчёт, бюджет точно выделят."
2005205-28 = "Разумеется, если понадобится помощь с бумагами, я могу вам помочь. Ради вас всё будет проще простого."
2005205-29 = "Хе-хе-хе."
2005205-31 = "Хотя предложение Якумо я отклонил..."
2005205-32 = "...я всё же купил нам два однодневных железнодорожных проездных, чтобы она могла познакомиться с общественным транспортом за пределами Красной Зимы."
2005205-35 = "А, понятно. Сначала метро, значит..."
2005205-36 = "Метро обычно известно своей пунктуальностью прибытия и отправления..."
2005205-37 = "Что ж, в этом есть своё очарование."
2005205-38 = ""
2005205-40 = ""
2005205-41 = "Итак, Сенсей. Наша сегодняшняя железнодорожная экскурсия..."
2005205-42 = "Я рассчитываю на вас, экскурсовод. Хе-хе-хе."
2005205-49 = "Хм-м... Ритмичное покачивание. Стук рельсов. Обычно раздражает, но современная шумоизоляция превращает это в успокаивающий белый шум."
2005205-50 = "Неудивительно, что люди говорят, будто их клонит в сон от одной только поездки в метро..."
2005205-51 = "..."
2005205-52 = "Хр-р..."
2005205-57 = "Ого, какая отличная станция. Всё чисто и ухоженно, да ещё и людей полно!"
2005205-58 = "Ага. Значит, сюда сходятся линии скоростных поездов из разных частей Кивотоса. Только соединённых путей — 32... Хм-м, хм-м."
2005205-59 = "Итак, Сенсей. Когда мы прибываем на такую центральную станцию, ключевой железнодорожный узел, что нам следует сделать?"
2005205-60 = "[s3] «Эм... Спросить дорогу, если потерялись?»\n[s4] «Ещё раз проверить расписание поездов?»"
2005205-63 = "Практичный ответ от нашего учителя."
2005205-64 = "Однако! Есть куда более важное событие, которое мы обязаны пережить на вокзале! Главная достопримечательность путешествия поездом — выбор вокзального бэнто!"
2005205-65 = "[s] «Понятно.»"
2005205-66 = "Ну же. Вот это вы обязаны мне позволить — это важно! Человек ничего не способен добиться, пока хорошенько не поест горячей еды!"
2005205-67 = "Ладно. Если поезд идёт по расписанию, до посадки у нас ещё около сорока минут."
2005205-68 = "Как раз хватит, чтобы купить бэнто! Пойдём!"
2005205-72 = ""
2005205-73 = "О, это знаменитый бэнто в баночке с осьминогом!"
2005205-74 = "Тушёный осьминог и морской угорь, ароматный рис с овощами. И темпура из осьминога тоже..."
2005205-75 = "Но самое главное — контейнер для этого обеда представляет собой настоящую керамическую баночку!"
2005205-76 = "...Да, из-за этого он немного тяжеловат, но что поделать?"
2005205-77 = "Самое важное — они взяли сосуд, который используют для ловли осьминогов, и превратили его в продаваемый продукт."
2005205-78 = ""
2005205-80 = ""
2005205-81 = "А, бэнто с гюдоном."
2005205-82 = "Обычная, непритязательная еда, но у такой простоты есть своё очарование."
2005205-83 = "Говядина с соевым соусом, тушёные овощи и рулет из омлета. Ну и маринованный имбирь, конечно же, обязателен."
2005205-84 = "Поскольку это еда для поезда, маринованный имбирь обработали так, чтобы уменьшить запах."
2005205-85 = "Именно такое внимание к мелочам и решает, продадут они ещё одну порцию или нет."
2005205-86 = ""
2005205-88 = ""
2005205-89 = "Бэнто в форме поезда!"
2005205-90 = "Контейнер бэнто буквально сделан в форме поезда."
2005205-91 = "Внутри сравнительно обычные вещи: онигири, карааге, сосиски, но..."
2005205-92 = "Уже одна возможность забрать контейнер домой как сувенир делает покупку оправданной!"
2005205-95 = "Это не вокзальный бэнто, но это мороженое тоже довольно знаменито само по себе."
2005205-96 = "Почему оно такое известное? Ну..."
2005205-97 = "...Оно заморожено настолько сильно, что сразу зачерпнуть ложкой и съесть его невозможно."
2005205-98 = "Говорят, даже существует легендарная история о человеке, который так разозлился, что взялся за него молотком. Но молоток просто отскочил от твёрдого как камень мороженого."
2005205-101 = "Разве все эти вокзальные товары не потрясающие?!"
2005205-102 = "[s] «Да-да. Давай купим всё.»"
2005205-103 = "Что?"
2005205-104 = "Всё... целиком?"
2005205-105 = "...Вы думали, именно поэтому я их выбирала?"
2005205-106 = "Вы не ошиблись, но..."
2005205-107 = "Я и представить не могла, что вы будете настолько щедры и купите всё это для меня..."
2005205-108 = "[s] «Студентам нужно хорошо питаться.»"
2005205-109 = "..."
2005205-110 = ""
2005205-112 = ""
2005205-113 = "Я верну несколько вещей и сейчас вернусь."
2005205-114 = "Удивлены?"
2005205-115 = "Ну..."
2005205-116 = "Всё хорошо в меру."
2005205-117 = "К тому же я всё равно столько не съем. Не хочу, чтобы еда отправилась в мусор."
2005205-139 = "[ns] «Ну как тебе поездка на поезде?»"
2005205-140 = "Ну... Всё ещё немного похоже на сон, но пока что..."
2005205-141 = "Похоже, начать придётся с переустройства шпал..."
2005205-142 = "[s] «А, это важно.»"
2005205-143 = "Да. Если шпалы нестабильны, вибрация и шум значительно усиливаются."
2005205-144 = "И главное — поезд не сможет как следует набирать скорость."
2005205-145 = "Но чтобы заменить шпалы, в конечном счёте придётся перестраивать и сами пути..."
2005205-146 = "Так... Если учесть, насколько НЕВЕРОЯТНО ОГРОМНА Красная Зима..."
2005205-147 = "...и сколько времени занимает путь от одного края нашей железной дороги до другого..."
2005205-148 = ""
2005205-150 = ""
2005205-151 = "..."
2005205-152 = "*вздыхает*"
2005205-153 = "Похоже, это несбыточная мечта. Но всё же мечта."
2005205-154 = "[s5] «Ты и правда увлечена железными дорогами, да?»\n[s6] «Почему бы не попробовать составить расписание или что-то подобное?»"
2005205-157 = "А? В смысле самой составлять планы? Нет уж, спасибо."
2005205-158 = "Сама работа хлопотная, а того, кто ей занимается, ещё и начнут считать стратегически важным специалистом! И что тогда — меня будут дёргать по любому поводу?!"
2005205-159 = "Это помешает управлять издательским бизнесом!"
2005205-160 = "Мой интерес строго ограничивается анализом местных железнодорожных линий! И желательно пассивным!"
2005205-161 = "Вообще-то я заинтересовалась ими только потому, что книги всегда перевозят по железной дороге."
2005205-162 = "[s] «Ты и правда глава Издательского отдела...»"
2005205-163 = "Разумеется. Это совершенно естественно. Сосновый шелкопряд ведь питается хвоей, верно?"
2005205-164 = "Хе-хе-хе."
