[translation]
10032020-1 = "Эпизод 2;Ещё суровее"
10032020-2 = "...Похитить лидера Союза банд? Самого Дона Аранчино...?"
10032020-4 = "Знаю, звучит невероятно, но именно таково задание."
10032020-5 = "И мы должны просто принять это за чистую монету? Особенно когда заказ поступил от члена семьи Аранчино?"
10032020-6 = "Ты должна понимать, почему мы подозреваем человека, который хочет похитить собственного босса."
10032020-7 = "Справедливо. Я понимаю, как это звучит."
10032020-8 = "Но давайте сразу проясним кое-что. Я не предаю босса. Всё это ради благополучия семьи."
10032020-9 = "Босс... В последнее время он ведёт себя безрассудно. Если так продолжится, семье Аранчино, какой мы её знаем, придёт конец."
10032020-10 = ""
10032020-12 = ""
10032020-13 = "Так что вы хотите похитить его, прежде чем он натворит ещё больше бед. Вы ведь понимаете, что просите нас не шоколадку из магазина стащить?"
10032020-14 = "...Я прекрасно понимаю. Думаю, награда покажется вам более чем достойной компенсацией за риск."
10032020-15 = "Дело не только в деньгах—"
10032020-17 = "Она права, никаких проблем вообще нет! Ну, то есть есть, но именно для этого и существует Решалы 68! Хи-хи-хи."
10032020-19 = "Босс?"
10032020-20 = "...?!"
10032020-21 = ""
10032020-23 = ""
10032020-25 = "Опасная работа? По-моему, звучит весьма сурово."
10032020-26 = "А кому ещё браться за такую суровую работу, как не паре преступниц вроде нас? Считай, дело уже сделано!"
10032020-27 = ""
10032020-28 = "Хи-хи-хи. Как быстро ты переобулась, Ару!"
10032020-29 = "...Ух."
10032020-30 = "*вздыхает*"
10032020-31 = ""
10032020-33 = ""
10032020-34 = "Вот так просто? Хотя, наверное, удивляться не стоит."
10032020-35 = "Вы и правда соответствуете своей репутации, Решалы 68."
10032020-36 = "Когда цель будет успешно передана мне, я заплачу вам в четыре раза больше первоначального аванса."
10032020-37 = "Разумеется, если справитесь."
10032020-38 = "...Ты сейчас сомневаешься в наших способностях?"
10032020-39 = "Не хотел вас задеть. Считайте это профессиональной привычкой. Всегда приходится действовать осторожно."
10032020-40 = "А наш босс... Аранчино — само воплощение осторожности. Будьте уверены, в вопросах безопасности у него припасены планы А, Б и В."
10032020-41 = "Хм..."
10032020-42 = "Неважно, сколько у него планов. Мы прорвёмся через каждый."
10032020-43 = "Мне нравится такой ответ. Тогда договорились."
10032020-44 = "Я свяжусь с вами и сообщу подробности, когда уточню дату и время. Также мы предоставим планы здания и список гостей."
10032020-45 = "А пока ждите."
10032020-46 = ""
10032020-48 = ""
10032020-51 = ""
10032020-52 = ""
10032020-53 = "...Эй. Босс?"
10032020-54 = "А-А-Ару?!"
10032020-55 = "Почему вы выглядите так, будто кто-то умер?"
10032020-56 = "Как бы это сказать... Босс, ты вообще знаешь, кто такая семья Аранчино?"
10032020-57 = "С чего ты взяла, что нет? Очевидно же, они банда! Ну... что-то вроде того."
10032020-58 = "То есть технически ты не ошиблась..."
10032020-59 = ""
10032020-61 = ""
10032020-62 = ""
10032020-63 = ""
10032020-64 = ""
10032020-65 = "...Что..."
10032020-67 = "Что ты сказала?!"
10032020-68 = ""
10032020-69 = "В-В-Вы серьёзно?! Глава Союза банд? Я думала, это просто что-то вроде банды Шлемов!"
10032020-70 = "Как такие суперзлодеи вообще узнали, где находится наш офис?!"
10032020-71 = "...Может, из-за всех этих плакатов и рекламы в интернете. Мы ведь особо и не скрывались."
10032020-72 = "Но меня удивляет, что ты настолько удивлена. Не то чтобы мы впервые имели дело с преступниками."
10032020-73 = "Может, она испугалась, потому что это о-о-очень большая организация? Да, Ару?"
10032020-74 = ""
10032020-76 = ""
10032020-77 = "Я не испугалась! Ни капельки! Конечно, я немного нервничаю, когда речь идёт о таких больших деньгах. Вот и всё!"
10032020-78 = "Это вознаграждение далеко за пределами наших обычных расценок. Эта работа — само определение суровости!"
10032020-79 = "Больше всего в Ару мне нравится то, насколько она предсказуема. Хи-хи!"
10032020-80 = "...Ты точно уверена, босс?"
10032020-81 = "Не хочу портить тебе праздник, но «далеко за пределами наших обычных расценок» — это ещё мягко сказано."
10032020-82 = "И что с того?! Именно поэтому мы и должны взяться за эту работу! Иначе так и будем вечно искать кошек и разбираться с местными хулиганами."
10032020-83 = ""
10032020-85 = ""
10032020-87 = ""
10032020-88 = "А? Меня это никогда не напрягало."
10032020-89 = "Меня тоже! Да я хоть дальше буду жить на улице, в мусорных баках, г-где угодно! Лишь бы быть с тобой, Ару!"
10032020-91 = "А-а-а! Мы были бездомными совсем недолго, ясно?! Правда недолго! Хватит вспоминать плохое!"
10032020-92 = "Вот именно поэтому нам это и нужно. Мы выведем Решал 68 на новый уровень."
10032020-93 = "Слушайте все! Это шанс всей жизни!"
10032020-94 = "Когда мы успешно провернём это дело, наше имя будут знать во всём преступном мире! Решалы 68 станут синонимом суровости!"
10032020-95 = ""
10032020-97 = ""
10032020-98 = ""
10032020-100 = ""
10032020-101 = "Е-Ещё...!"
10032020-102 = ""
10032020-106 = ""
10032020-107 = ""
10032020-108 = ""
10032020-109 = ""
10032020-110 = ""
10032020-111 = "Ещё суровее!"
10032020-112 = ""
10032020-114 = ""
10032020-115 = "...Вот теперь вы знаете всю историю."
10032020-116 = ""
10032020-117 = "Нашим первым шагом было зачистить Оперный театр и вышвырнуть оттуда всю мелкую сошку Аранчино!"
10032020-118 = "Я всё тщательно проверила, и история клиента сходится."
10032020-119 = "Не знаю, что именно он задумал, но Дон Аранчино определённо работает над тем, чтобы расширить свою фракцию."
10032020-120 = "Так что, знаете, технически мы делаем что-то на благо общества, даже если наши методы не совсем одобрены Сенсеем."
10032020-121 = "Звучит так, будто мы оправдываемся, но всё более-менее чисто, Сенсей. По большей части."
10032020-122 = ""
10032020-124 = ""
10032020-126 = ""
10032020-127 = ""
10032020-128 = "...Ах!"
10032020-129 = "Ни за что! Помощь людям — всего лишь досадный побочный эффект. Мы делаем это ради денег. Денег!"
10032020-131 = "И-Именно! Так решила Ару!"
10032020-132 = "*вздыхает*"
10032020-133 = ""
10032020-135 = ""
10032020-136 = "[ns1] «Похищение босса банды — работа для преступниц.»\n[ns2] «Вы и правда взялись за суровое дело.»"
10032020-139 = ""
10032020-140 = "Я знала, что вы поймёте, Сенсей! Хи-хи-хи."
10032020-141 = "Наконец-то мы получили работу, достойную нашего уровня. Мы даже пришли в одинаковых нарядах!"
10032020-142 = "Простите, что скрывала от вас подробности, Сенсей."
10032020-143 = "Но, знаете, если вы попытаетесь остановить нас, Сенсей, это может негативно сказаться на наших деловых отношениях!"
10032020-144 = "...А? Вы понимаете?"
10032020-145 = "Что это? В смысле? И всё? Это оказалось настолько просто?"
10032020-146 = ""
10032020-148 = ""
10032020-150 = ""
10032020-151 = "Просто смирись с этим, босс."
10032020-152 = "Ха-ха-ха! Посмотри на её лицо! Вы застали Ару врасплох, Сенсей!"
10032020-153 = ""
10032020-155 = ""
10032020-157 = ""
10032020-158 = "Н-Но... А? Вы уверены?"
10032020-159 = "Но почему?"
10032020-160 = "[s3] «Я пришёл сюда не для того, чтобы вам мешать.»\n[s4] «В конце концов, я вам доверяю.»"
10032020-163 = "Сенсей..."
10032020-164 = ""
10032020-166 = ""
10032020-167 = "Хи-хи. Хи-хи-хи..."
10032020-168 = "Как и ожидалось от вас, Сенсей. Я знала, что деловая интуиция меня не подвела, когда я решила сотрудничать с вами."
10032020-169 = "Это единственный естественный исход. Конечно же, вы поймёте наш путь суровости."
10032020-170 = "Хотя секунду назад она такая: «Ах! Но почему?!»"
10032020-171 = "...В любом случае! Спасибо за дальнейшую поддержку, Сенсей! Решалы 68 приветствуют ваше сотрудничество в этом деле."
10032020-172 = "Взамен, Сенсей..."
10032020-173 = "Несмотря на прошлые... осложнения, клянусь, мы поможем вам закончить видео об Оперном театре."
10032020-174 = "По крайней мере, пока не прибудет глава Союза банд. После этого у нас появится собственная работа."
10032020-175 = "Ты уверена? А как же эта твоя «детективная работа», о которой ты говорила?"
10032020-176 = "Убьём двух зайцев одним выстрелом! Я всё равно была посреди экскурсии Сенсея по Оперному театру."
10032020-177 = ""
10032020-179 = ""
10032020-181 = ""
10032020-182 = "Хи-хи. Мы теперь зрители? Мне сходить надеть платье?"
10032020-183 = "П-Платье? Мне правда обязательно...?"
10032020-184 = "П-Пожалуйста, нет! То есть я не могу отказать Ару, но...! Я-я недостойна такой красоты."
10032020-185 = "Я тоже не хочу создавать проблемы... и буду слишком выделяться, если не соблюду дресс-код..."
10032020-186 = ""
10032020-188 = ""
10032020-189 = "П-Пожалуйста, подождите немного!"
10032020-190 = ""
10032020-192 = ""
10032020-193 = "Хи-хи-хи. Я скоро вернусь, Сенсей!"
10032020-194 = ""
10032020-196 = ""
10032020-198 = ""
10032020-199 = "Эм..."
10032020-200 = "...Сенсей."
10032020-201 = ""
10032020-203 = ""
10032020-204 = ""
10032020-205 = "Возьмите."
10032020-206 = "[s5] «Это беспроводной коммуникатор?»\n[s6] «Получается, я тоже участвую в операции?»"
10032020-209 = "Я подумала, что Муцуки или Харука наверняка сломают хотя бы один, поэтому взяла запасные."
10032020-210 = "Я не говорю, что вам нужно вставать на нашу сторону или что-то такое. Я просто... беспокоюсь о вас."
10032020-211 = "Всё должно пройти гладко, но с боссом банды никогда не знаешь наверняка, понимаете?"
10032020-212 = ""
10032020-214 = ""
10032020-215 = "Слушайте, если честно, вам лучше пойти домой и снять видео в другой день."
10032020-216 = "...Но я знаю, что вы меня не послушаете."
10032020-217 = "[s7] «Простите, но вы правы. Я не могу сейчас уйти.»\n[s8] «Вы беспокоитесь обо мне, а я беспокоюсь о вас.»"
10032020-220 = "*вздыхает*"
10032020-221 = "Я понимаю. Такой уж вы человек. Именно поэтому я и даю вам это. Чтобы при необходимости я могла с вами связаться."
10032020-222 = ""
10032020-224 = ""
10032020-225 = ""
10032020-226 = "Я знаю, что эта работа кажется довольно простой, но... просто будьте осторожны, ладно?"
10032020-227 = "Вы сейчас на тёмной стороне. Здесь редко всё бывает радужно и безоблачно."
10032020-228 = "...Хм? Кажется, будто я думаю, что всё пойдёт наперекосяк?"
10032020-229 = "Ничего настолько серьёзного... Если бы я правда так думала, то прямо сейчас силой утащила бы вас домой."
10032020-230 = "Скорее это... предчувствие."
10032020-231 = ""
10032020-233 = ""
10032020-235 = "...И моё предчувствие уже не раз оказывалось верным."
