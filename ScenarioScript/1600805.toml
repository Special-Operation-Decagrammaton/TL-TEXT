[translation]
1600805-1 = "Работа под прикрытием ленивого полицейского"
1600805-2 = "У оружейного магазина Чёрного рынка"
1600805-3 = ""
1600805-4 = ""
1600805-5 = "Ты опоздал, Сенсей!"
1600805-6 = "А если бы я потеряла след подозреваемого? Сегодня нельзя лениться!"
1600805-7 = "Во время слежки нельзя терять ни минуты, ни даже секунды!"
1600805-8 = "[s] «В кои-то веки ты подозрительно мотивирована.»"
1600805-9 = "Ничего подозрительного. Я кадет Полицейской школы «Валькирия».#nКонечно же, я хочу ловить плохих парней."
1600805-10 = "У хорошего копа всегда нюх на преступления!"
1600805-11 = "[s] «Ты кто такая и что сделала с Фубуки?»"
1600805-12 = "Э-Эй, ну хватит..."
1600805-13 = "В-В любом случае неважно. Мы здесь, чтобы арестовать преступника,#nи только это имеет значение."
1600805-14 = "[s] «Как выглядит подозреваемый?»"
1600805-15 = "Как выглядит?"
1600805-16 = "Эм... Ну..."
1600805-17 = "Наверное, на нём... подозрительный костюм? Может быть."
1600805-18 = "[s1] «Может быть»?!\n[s2] «Это довольно расплывчато.»"
1600805-19 = "Всё нормально. Терпение — ключ к работе под прикрытием. Наблюдая, мы узнаем больше, чем если просто будем высматривать человека по предполагаемым приметам."
1600805-20 = "Всё нормально. Терпение — ключ к работе под прикрытием. Наблюдая, мы узнаем больше, чем если просто будем высматривать человека по предполагаемым приметам."
1600805-21 = "Но если мы собираемся выдержать всю слежку, нам понадобится кое-что для поддержания сил."
1600805-22 = "Подождите здесь. Я принесу всё необходимое."
1600805-23 = ""
1600805-25 = ""
1600805-28 = ""
1600805-29 = "Я вернулась. Спасибо, что подождали, Сенсей."
1600805-30 = "[s] «Что это за коробка у тебя в руках?»"
1600805-31 = "Разве не очевидно? Master Donuts."
1600805-32 = "Я взяла две коробки, раз вы со мной!"
1600805-33 = "Во время слежки нам нужны весь сахар и кофеин, какие только можно получить.#nПоэтому на закуски для работы под прикрытием у меня неограниченный бюджет."
1600805-34 = "А вдобавок это задание даёт мне повод выключить телефон и не получать новых приказов! Нет ничего лучше, чем спокойно есть пончики."
1600805-35 = "[s] «ТАК вот почему ты была так рада.»"
1600805-36 = "Подвиньтесь немного, Сенсей."
1600805-37 = "Нужно освободить место для пончиков на капоте."
1600805-38 = "Так. Пора за работу!"
1600805-41 = "― Ах... Вот это рай...[wa:2530]"
1600805-44 = "― Сидеть на тёплом капоте машины с пончиками и кофе...[wa:2670]"
1600805-46 = "― Ничто не сравнится с хорошей слежкой![wa:1260]"
1600805-49 = "[ns] «На слежке вообще-то нужно делать что-то ещё, кроме поедания пончиков.»"
1600805-50 = "― Ах, Сенсей. Вам нужно быть осторожнее.[wa:3200]"
1600805-52 = "― Не теряйте бдительности. Подозреваемый может быть где угодно.[wa:2100]"
1600805-55 = "― (Ням. М-м-м.)[wa:2480]"
1600805-58 = "― Что может лучше сочетаться с холодным кофе,[wa:2620]"
1600805-60 = "― чем старый добрый пончик? Хи-хи.[wa:1720]"
1600805-63 = "― Хм? Что такое, Сенсей?[wa:920]"
1600805-65 = "― Хотите пончик?[wa:1260]"
1600805-68 = "После всего этого подозреваемый так и не появился."
1600805-69 = "[s] «А что, если мы пропустили его, пока ели пончики?»"
1600805-70 = "Не может быть! Пусть мои глаза были на пончиках... как и рот с руками — зато шестое чувство следило за окрестностями!"
1600805-71 = "Ну и ладно. Видимо, придётся ещё чаще добровольно записываться на работу под прикрытием, если я хочу поймать подозреваемого..."
1600805-72 = "Может, в следующий раз взять глазированные пончики! Вот это точно поможет!"
1600805-73 = "[s] «Тип пончика вообще имеет значение?!»"
