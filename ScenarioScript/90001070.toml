[translation]
90001070-1 = "Эпизод 7;Исследование объекта"
90001070-3 = "[ns] «Это...?»"
90001070-4 = ""
90001070-5 = "Этот проход соединяет разрушенный объект с этим."
90001070-6 = "Эм. Возможно, мы использовали слишком много взрывчатки. Ударная волна всё раздробила."
90001070-7 = ""
90001070-9 = ""
90001070-10 = ""
90001070-11 = "Я всего лишь следовала учениям, переданным мне старшими."
90001070-12 = "У одного конкретного человека была поговорка: взрывчатки много не бывает."
90001070-13 = ""
90001070-17 = ""
90001070-18 = "[ns] «(Я прекрасно знаю, чья это была „поговорка“...)»"
90001070-21 = ""
90001070-22 = "Я не обнаружила никакого движения вражеских войск. Можно двигаться дальше."
90001070-23 = "Пойдём. Мне становится всё интереснее."
90001070-26 = ""
90001070-27 = "Я фиксирую звуки работающих механизмов. Конвейер...?"
90001070-28 = "Да. Похоже, после переработки добытых ресурсов их перевозят куда-то дальше."
90001070-29 = "Я бы предположила, что это перерабатывающий завод."
90001070-30 = "Огромного масштаба. Сравнимо с крупным металлургическим комбинатом."
90001070-32 = "Загадочный след... буровые машины... объект подавления сигнала и перерабатывающий завод..."
90001070-33 = "Операции такого масштаба происходили в этом районе? И никто ни разу не заметил?"
90001070-34 = "Зловещие планы... довольно часто разворачиваются именно так."
90001070-36 = "Радарная площадка уничтожена. Мы заметили врага у входа во второй объект."
90001070-37 = "Ну что же. Начнём?"
90001070-38 = "Н-Начнём — значит... загнать их глубже... к тому месту? Я-я справлюсь!"
90001070-39 = "Хех-хех-хех. Примитивная тактика. Заманить их в наши лапы и уничтожить, пока они пляшут у нас на ладони."
90001070-40 = "Развёртывание войск завершено. Теперь, Эйн. Выполни свою роль."
90001070-41 = "Д-Да! Да! Я не до конца понимаю, но именно так охотятся на «добычу» вроде кроликов и оленей! От подножия горы к самой вершине!"
90001070-42 = "Я узнала это от Соф!"
90001070-43 = "Наоборот."
90001070-44 = "КЬЯ-А?! П-Правда? Опять... не так..."
90001070-45 = "Откуда Соф знает? Мы ведь даже никогда не встречали ничего вроде «кролика» или «оленя»."
90001070-54 = ""
90001070-55 = "Ч-Что это?!"
90001070-56 = "Не может быть...?! Огромные силы противника готовятся вступить с вами в бой!"
90001070-58 = ""
90001070-59 = ""
90001070-60 = ""
90001070-61 = ""
90001070-62 = ""
90001070-63 = ""
90001070-64 = "Силы Декаграмматона? Это несравнимо с предыдущими боями. Что будем делать, президент?"
90001070-65 = "Я подготовлюсь к бою."
90001070-66 = "Стой, Токи. Оценка Эйми верна. Даже ты не сможешь уничтожить силы такого размера!"
90001070-67 = "Кроме того, Аби-Эшух не предназначен для работы в узких помещениях."
90001070-68 = "А. Поняла, госпожа Рио."
90001070-69 = "Нет ли пути отступления?!"
90001070-70 = "Подождите! Я ищу. Ищу!"
90001070-71 = "Их силы движутся в одном направлении. Они перекрыли вход, через который вы пришли."
90001070-72 = "Свободен только один путь — глубже внутрь объекта. Если пройти по нему до конца, сзади есть выход!"
90001070-73 = "Значит, единственный доступный маршрут лежит за конвейером — туда, куда отправляют переработанные ресурсы."
90001070-74 = "Мы не знаем, что находится с другой стороны. Но я бы сказала, что идти туда эффективнее, чем сражаться со всей массой вражеских войск позади нас."
90001070-76 = ""
90001070-77 = ""
90001070-78 = ""
90001070-79 = ""
90001070-80 = ""
90001070-81 = ""
90001070-82 = "Угу. В итоге я согласна с предложением госпожи Рио."
90001070-83 = "Я могу подготовиться к бою—"
90001070-84 = "Она сказала нет. Есть время для боя. Сейчас не оно."
90001070-85 = ""
90001070-87 = ""
90001070-88 = "...Поняла. Я расчищу путь."
90001070-89 = ""
90001070-91 = ""
90001070-92 = ""
90001070-94 = ""
90001070-95 = ""
90001070-96 = ""
90001070-97 = "(Всё выглядит как ловушка...)"
90001070-98 = "(Нельзя поддаваться этим мрачным мыслям. Пока рядом Сенсей и Химари... мы сможем прорваться!)"
