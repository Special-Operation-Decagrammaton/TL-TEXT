[translation]
1010803-1 = "Приключение в погоне за электрическими овцами"
1010803-2 = "Получив странные сообщения Юки, я сразу отправился к общежитию Миллениума. Я переживал, что что-то случилось."
1010803-3 = "На первый взгляд здание общежития выглядело спокойно, но..."
1010803-4 = ""
1010803-7 = "Эм... Кто это бродит здесь так поздно ночью?"
1010803-8 = "Если хотите подать апелляцию по расходам клуба, пожалуйста, сделайте это письменно..."
1010803-9 = ""
1010803-12 = ""
1010803-13 = ""
1010803-14 = "[USERNAME]-Сенсей?! Что вы здесь делаете так поздно?! Да ещё и прямо перед моей комнатой?!"
1010803-15 = "Стойте, подождите! Я ещё не готова показывать вам свою комнату..."
1010803-16 = "Пять минут! Дайте мне всего пять минут!"
1010803-17 = "[s1] «Ты в порядке, Юука?»\n[s2] «Похоже, ничего плохого не случилось...»"
1010803-20 = "А? В смысле?"
1010803-21 = "От меня пришла куча странных сообщений в MomoTalk, а потом я внезапно замолчала?"
1010803-22 = "Нет, всё было не так. Это вы вдруг перестали отвечать, поэтому я подумала, что вы рано легли спать."
1010803-23 = "[ns] Показать Юке переписку в MomoTalk."
1010803-24 = "Это..."
1010803-25 = "А, понятно. Вот что произошло."
1010803-26 = "Кто-то снова выпустил Электрических овец в серверную."
1010803-27 = "[s] «...Электрических овец?»"
1010803-28 = "О, точно. Вы не знаете. Электрические овцы — прозвище энергосберегающих дронов, используемых в башне Миллениума."
1010803-29 = "В Миллениуме довольно много объектов, которые потребляют огромное количество энергии, поэтому ежедневные расходы на электричество у нас весьма значительные."
1010803-30 = "По ночам, когда на территории нет студентов, мы выпускаем дронов, которые отключают неиспользуемые электронные устройства, чтобы не тратить энергию впустую. Из-за того, что издаваемые ими звуки похожи на блеяние овец, студенты прозвали их Электрическими овцами."
1010803-31 = "Однако в местах, где оборудование должно работать постоянно, вроде серверных и общежитий, мы установили датчики ограничения доступа, чтобы Электрические овцы туда не попадали. Кто-то, должно быть, случайно убрал такой датчик."
1010803-32 = "[s3] «Понятно.»\n[s4] «Я просто рад, что с тобой всё хорошо.»"
1010803-35 = "М-м. Вам не нужно было проделывать весь этот путь..."
1010803-36 = ""
1010803-38 = ""
1010803-39 = "Но раз уж вы здесь, не поможете мне ещё с одним делом? Я знаю, что уже поздно..."
1010803-40 = "[s] «Конечно. С чем?»"
1010803-41 = "Если Электрические овцы свободно разгуливают по кампусу, они могут отключить исследовательские объекты студентов или серверы с данными. Пока этого не произошло, нужно найти их и вернуть в клетки."
1010803-42 = "Будет катастрофа, если что-нибудь случится с исследовательскими данными студентов."
1010803-43 = "Ситуация довольно срочная. Поможете мне собрать Электрических овец?"
1010803-44 = "[s] «Конечно! Просто оставь это мне!»"
1010803-45 = "Спасибо. Судя по всему, мы не получаем сигнал от двадцати Электрических овец... Давайте скорее их найдём."
1010803-47 = "Мы с Юкой бродили по кампусу в поисках энергосберегающих дронов, называемых «Электрическими овцами»."
1010803-49 = "Бе-е... Бе-е..."
1010803-50 = ""
1010803-53 = ""
1010803-54 = ""
1010803-55 = ""
1010803-56 = "Девятнадцать Электрических овец..."
1010803-58 = ""
1010803-59 = ""
1010803-60 = ""
1010803-61 = "И-и... двадцать!"
1010803-62 = ""
1010803-64 = ""
1010803-65 = ""
1010803-66 = "Спасибо за вашу помощь, Сенсей! Похоже, это все сбежавшие Электрические овцы!"
1010803-67 = "К счастью, похоже, пострадала только серверная, которая отправляет сигналы за пределы кампуса."
1010803-68 = "Если бы вы меня не предупредили, даже представить не могу, какой был бы ущерб... От одной мысли дрожь пробирает."
1010803-69 = "[s] «Я рад, что всё закончилось хорошо.»"
1010803-70 = ""
1010803-73 = "[ns] «В любом случае, считать овец посреди ночи начинает усыплять.»"
1010803-74 = "Вот как? Я всё ещё мучаюсь от бессонницы, так что не думаю, что меня сильно клонит в сон..."
1010803-75 = "В мультфильмах и фильмах действительно часто показывают клише, где люди считают овец, чтобы заснуть."
1010803-76 = "Есть даже снотворные средства и напитки без кофеина с изображениями овец."
1010803-77 = "[s] «А ты тоже считаешь овец, когда не можешь уснуть?»"
1010803-78 = "Нет. Один раз пробовала, но почти не помогло."
1010803-79 = ""
1010803-81 = ""
1010803-82 = "Я как-то читала в книге, что обычай считать овец перед сном, похоже, передаётся ещё со Средневековья, когда пастушество было распространено."
1010803-83 = "В средневековом обществе количество овец было показателем богатства, поэтому одна лишь мысль о поле, полном овец, вызывала чувство достатка и помогала людям успокоиться и уснуть."
1010803-84 = "...Сегодня это уже трудно понять. В наши дни даже диких животных встретишь нечасто."
1010803-85 = "[s] «Довольно интересная гипотеза.»"
1010803-86 = ""
1010803-89 = "[ns] «Тогда какие пейзажи современным людям стоит представлять, чтобы заснуть?»"
1010803-90 = "Ну, для современных людей показателем успеха, наверное, служат цифры на банковском счёте... Может, если я буду считать, сколько у меня денег, то усну легче?"
1010803-91 = "[s5] «...Как-то это слишком уныло.»\n[s6] «Может, представишь что-нибудь более идеалистичное?»"
1010803-94 = "Идеальное будущее, не сводящееся к цифрам..."
1010803-95 = "Для меня счастливое будущее — это просто жить с любимым человеком в красивом доме, где много солнечного света. Например, с Сэн—"
1010803-96 = "[s] «Сэн...?»"
1010803-97 = ""
1010803-99 = ""
1010803-100 = ""
1010803-101 = "Ничего! Совсем ничего!"
1010803-102 = "Я-я просто говорила о хорошем большом доме! Да! Ха! Хахаха!"
1010803-103 = "[s] «А я надеялся услышать о твоей мечте подробнее.»"
1010803-104 = "Нет-нет, это всё! И посмотри, как уже поздно!"
1010803-105 = "Спасибо тебе за помощь сегодня! Тебе пора домой! Прямо сейчас!"
1010803-106 = "У-увидимся завтра. Спокойной ночи, Сенсей!"
1010803-108 = "Юука буквально вытолкала меня наружу, так что мне ничего не оставалось, кроме как покинуть Миллениум и вернуться в Шале."
