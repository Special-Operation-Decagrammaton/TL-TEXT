1005503-22 = ""
1005503-23 = ""
1005503-26 = "[ns1] «Что?! Не трогай меня, медведь!» \n[ns2] «Это м-медведь?!»"
1005503-27 = ""
1005503-28 = ""
1005503-29 = ""
1005503-30 = "...Медведь?"
1005503-31 = ""
1005503-33 = ""
1005503-34 = ""
1005503-35 = ""
1005503-36 = "Где медведь?"
1005503-37 = ""
1005503-39 = ""
1005503-40 = "Это всего лишь я! Давно не виделись, Сенсей."
1005503-41 = "Но что вы делаете так далеко? Не стоит бродить за пределами территории академии."
1005503-42 = "[s3] «О... это всего лишь ты, Шигурэ.»\n[s4] «Фух, напугала.»"
1005503-45 = "Что значит? Это немного грубо, знаете ли."
1005503-46 = "Вы правда приняли меня за медведя?"
1005503-47 = "Хахаха! Вот это смешно. Хотя встретить здесь медведя действительно вполне возможно."
1005503-48 = "И снова возникает вопрос: почему вы так далеко забрались?"
1005503-51 = "Вы здесь уже четыре часа?! Заблудились?"
1005503-52 = ""
1005503-54 = ""
1005503-55 = "Посмотрите на руки! Вы же получите обморожение."
1005503-56 = "Разве я не говорила предупредить меня, если придёте в «Красную Зиму»?"
1005503-57 = "Сенсей, академия «Красная Зима» намного больше, чем вы можете представить. Если заблудиться здесь в глуши, считайте, всё кончено."
1005503-58 = "Хорошо, что я вас встретила. Кто знает, что могло случиться."
1005503-59 = "А? Что насчёт меня?"
1005503-60 = "Я знаю здешние дороги как свои пять пальцев."
1005503-61 = "Жизнь в Бывшем институте означает, что нам приходится самим добывать еду, поэтому я часто бываю здесь."
1005503-62 = "И, в отличие от кое-кого, я знаю дорогу обратно в академию."
1005503-63 = "Но, учитывая ситуацию, думаю, прямо сейчас мы туда не дойдём."
1005503-64 = "Вы и так слишком долго на холоде. Если пойдём пешком, можете получить обморожение. Или хуже."
1005503-65 = "[s] «Всё нормально. Я дойду.»"
1005503-66 = "Не храбритесь. Вы, может, и учитель, но к такой погоде не привыкли."
1005503-67 = "Смотрите, вы дрожите!"
1005503-68 = "Сначала нужно как-то согреть вас, прежде чем делать что-либо ещё..."
1005503-69 = "Что? Как быстрее всего это сделать?"
1005503-70 = "Ну... У меня есть быстрое и простое решение."
1005503-71 = ""
1005503-73 = ""
1005503-74 = "Хи-хи."
1005503-75 = ""
1005503-77 = ""
1005503-78 = "Самый эффективный способ поднять температуру тела — хорошенько приложиться к старой доброй бутылке водки."
1005503-79 = "[s5] «Категорически нет!»\n[s6] «У тебя правда нет других вариантов?!»"
1005503-80 = "Что? Почему нет? Вы же сами спросили самый быстрый способ."
1005503-81 = "Что? Почему? Вы же сами спросили самый быстрый способ."
1005503-82 = "Ладно-ладно, хорошо. Дайте подумать."
1005503-83 = ""
1005503-85 = ""
1005503-86 = ""
1005503-87 = ""
1005503-88 = ""
1005503-89 = ""
1005503-91 = "Как насчёт объятий?"
1005503-92 = "Использовать тепло наших тел против холода — самый проверенный способ выживания."
1005503-93 = "Учитывая ситуацию, это может быть лучшим вариантом. Конечно, сначала придётся снять всю мокрую одежду..."
1005503-94 = "[s7] «Стой, стой! На этом остановись!»\n[s8] Отчаянно отказаться и попросить другой способ."
1005503-97 = "Хмф. Какие вы ограниченные."
1005503-98 = "Хи-хи. Простите, Сенсей. Я просто шутила. Хотела посмотреть на вашу реакцию."
1005503-99 = "Хм? Я вас дразнила?"
1005503-100 = "Хмм, ну..."
1005503-101 = "А если и так? Это вам за то, что проигнорировали мой совет."
1005503-102 = "Не помните? Я говорила не бродить по «Красной Зиме» без проводника и сообщить мне, когда приедете!"
1005503-103 = "Будьте осторожнее. Очень многие будут сильно грустить, если с вами что-то случится."
1005503-104 = "[s9] «Хм... Ты права. Прости.»\n[s10] «В следующий раз свяжусь с тобой.»"
1005503-107 = "Хи-хи. Раз вы усвоили урок, я вас прощаю."
1005503-108 = "Но если снова будете действовать не думая..."
1005503-109 = "получите серьёзное наказание, хорошо?"
1005503-110 = ""
1005503-113 = "[ns] «Понял...»"
1005503-114 = "Хорошо-хорошо. Раз с этим разобрались..."
1005503-115 = ""
1005503-117 = ""
1005503-118 = "Время прокатиться на спине, Сенсей. Я отнесу вас в центр города."
1005503-119 = "Думаете, вы слишком тяжёлый? Хахаха! Сенсей, вы такой забавный."
1005503-120 = "Я убивала, таскала и свежевала медведей крупнее вас."
1005503-121 = "Я могу нести взрослого вроде вас одной рукой. Перестаньте переживать."
1005503-122 = "Ну..."
1005503-123 = "...Пойдём?"
1005503-125 = "Шигурэ несла меня на спине до самого центра города."
1005503-126 = "Оказавшись в помещении, я согрел промёрзшее тело и наконец вернулся в Шале."
