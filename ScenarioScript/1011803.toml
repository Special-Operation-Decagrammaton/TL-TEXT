[translation]
1011803-1 = "Неожиданная милота"
1011803-2 = "Тук-тук-тук!"
1011803-3 = "Привет, Сенсей!"
1011803-4 = "[s1] «Привет, Нозоми.»\n[s2] «Что тебя сюда привело?»"
1011803-7 = "Ничего серьёзного, просто небольшая морока."
1011803-8 = "Вот, посмотри на это."
1011803-9 = "[s] «На что я смотрю?»"
1011803-10 = ""
1011803-12 = ""
1011803-14 = "Знакомься, Шуппо. Новый талисман Административного совета."
1011803-15 = "Кто-то выиграл с ним конкурс дизайна или что-то вроде того."
1011803-16 = "Видимо, он не особо популярен, раз мерч с ним просто раздают бесплатно."
1011803-17 = "[s] «Так это рекламный тур Шуппо.»"
1011803-18 = "Ага, видишь маленькую форму Хайлендера?"
1011803-19 = "Мне сказали отнести одного в Шале, для рекламы."
1011803-20 = "Не очень понимаю, зачем. Тебе вообще нравятся такие штуки?"
1011803-21 = "[s] «Да, милые вещи мне нравятся.»"
1011803-22 = "Хех, значит, ты считаешь его милым. Пахьяхья!"
1011803-23 = "Я вообще не очень понимаю, что такое «милота»."
1011803-24 = "Даже когда другие девочки такие: «Ой, это так мило, кья-а...» — я всё равно не понимаю."
1011803-25 = "Не уверена, что вообще когда-нибудь так реагировала на что-то."
1011803-26 = "Ну, если кто-то говорит, что это мило, я поверю на слово, но мне всё равно."
1011803-27 = "[s] «Ты за всю жизнь ни разу не находила ничего милым?»"
1011803-28 = ""
1011803-31 = "[ns] «...Погоди-ка.»"
1011803-32 = ""
1011803-35 = ""
1011803-36 = "[ns] «...Ладно, а что скажешь об этом?»"
1011803-37 = "Какую?"
1011803-38 = "[s] «Это кукла. Я выиграла ее в игровом автомате. Довольно милая, да?»"
1011803-39 = "Хех, думаю, да."
1011803-40 = ""
1011803-43 = "[ns3] «Что-то не похоже, чтобы ты был в восторге.»\n[ns4] «Хорошо, давайте перейдем к следующему...»"
1011803-48 = ""
1011803-49 = "[ns] «Вот, как насчет этого?!»"
1011803-50 = "Это просто выглядит тревожно."
1011803-51 = "[ns5] «Великий монстр Ортеганос вызывает беспокойство?!»\n[ns6] «О, ни за что!»"
1011803-54 = "Как ВЫ думаете, это мило, сенсей?"
1011803-55 = "Я имею в виду, знает ли кто-нибудь?"
1011803-56 = "Пахьяхья! Я не понимаю."
1011803-57 = "[s] «Ладно, я ПОЗАБОЧУСЬ, чтобы сегодня ты назвал что-нибудь „милым“!»"
1011803-59 = "Я показал ей весь товар, который у меня был..."
1011803-60 = ""
1011803-61 = ""
1011803-62 = ""
1011803-63 = ""
1011803-64 = ""
1011803-65 = ""
1011803-67 = "..но это было бесполезно."
1011803-68 = ""
1011803-70 = "[ns] «*вздох* Последний. Что вы об этом думаете?»"
1011803-71 = ""
1011803-72 = "Пффффф...!"
1011803-73 = "[ns7] «А? Был ли это реальный ответ?»\n[ns8] «Верно? Мило, правда??»"
1011803-76 = "П-Пфф... Нет... Дело не в этом."
1011803-77 = ""
1011803-80 = "Но то, как ты продолжаешь мне что-то показывать..."
1011803-81 = "Ну, знаешь, протягиваешь их мне и спрашиваешь: «Как насчет этого?»"
1011803-82 = "ЭТО..."
1011803-83 = "Мне это кажется милым, понимаешь?"
1011803-84 = "[ns] «Что...?!»"
1011803-85 = "Пахьяхья!! Я серьезно!"
1011803-86 = "[ns] «...»"
1011803-88 = "По какой-то причине это меня расстроило. Я отвернулся от нее..."
1011803-89 = "П-Пфф... Сенсей, вы с ума сошли?"
1011803-90 = "Я имею в виду, миссия выполнена, верно? Я назвал кое-что «милым»..."
1011803-91 = ""
1011803-95 = ""
1011803-96 = "Ты же не говорил, что этим «милым» не можешь быть ты..."
1011803-97 = "[s] «Хех.»"
1011803-99 = "Она ещё немного поддразнивала меня, а потом ушла."
