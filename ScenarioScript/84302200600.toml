[translation]
84302200600-5 = "Ух ты, чуть не попалась! Я уже думала, они меня точно схватят!"
84302200600-6 = "Спасибо, Нэру! Ты меня спасла!!"
84302200600-7 = "Ты лу—"
84302200600-8 = ""
84302200600-10 = ""
84302200600-12 = "Ай!!"
84302200600-13 = "З-Зачем ты меня ударила?!"
84302200600-14 = "Потому что заслужила."
84302200600-15 = "Заслужила? За что?!"
84302200600-16 = "За незаконное проникновение в Центр данных. И это только то, о чём я знаю."
84302200600-17 = "Но уверена, что заслужила."
84302200600-18 = "Это нечестно...!!"
84302200600-19 = "У тебя нет ни одной нормальной причины находиться здесь, и мы обе это знаем."
84302200600-20 = "Ну и злая!! Я член Семинар! У меня МОГЛА быть причина сюда прийти!"
84302200600-21 = "Нет, потому что если бы она была, дроны бы за тобой не гонялись."
84302200600-22 = "Дай угадаю: исправляла оценки? Воровала из казны?"
84302200600-23 = ""
84302200600-25 = ""
84302200600-26 = "..."
84302200600-27 = "...Серьёзно?"
84302200600-28 = "...Ладно, Нэру, ты не можешь рассказывать Юке или Ноа!! В этот раз правда-правда нельзя!!"
84302200600-29 = "Они меня буквально убьют, точно! Ты ведь не хочешь смерти своей младшей, да? Пожалуйста, не рассказывай им!!"
84302200600-30 = "Если последствия настолько плохие, не надо было вообще это делать!"
84302200600-31 = "Я-я ничего не могла поделать!! Юука сказала, что заставит меня писать объяснительные обо всём, что я натворила за этот месяц!"
84302200600-32 = "Но если я удалю свои записи, писать будет почти не о чем! Логично же, правда?"
84302200600-33 = ""
84302200600-35 = ""
84302200600-37 = "Ай, ты опять меня ударила!!"
84302200600-38 = "У тебя какой-то извращённый способ мыслить."
84302200600-39 = "Угх..."
84302200600-40 = "Н-Но... Ладно, тогда что ТЫ здесь делаешь, Нэру?! Тебе тоже нельзя тут находиться!"
84302200600-41 = "Ага!! Попалась, да? Ладно, вот что: давай заключим сделку."
84302200600-42 = "Если ты сдашь меня, я сдам тебя! Иными словами, молчание — золото!"
84302200600-43 = "Хорошая сделка, правда?!"
84302200600-44 = "А-а, значит, вот как ты хочешь играть."
84302200600-45 = ""
84302200600-47 = ""
84302200600-48 = "Ладно, я согласна."
84302200600-49 = ""
84302200600-51 = ""
84302200600-52 = "Правда? Вот так... сразу?!"
84302200600-53 = "Я всё равно пришла сюда не ловить тебя. У меня есть своё дело."
84302200600-54 = ""
84302200600-56 = ""
84302200600-57 = "...Хотя, если подумать..."
84302200600-58 = "Эй, Коюки, ты ведь хотела отредактировать какие-то данные?"
84302200600-59 = "А-А?! Ну да, и..."
84302200600-60 = "Отлично. Значит, ты знаешь, какой компьютер здесь главный. И знаешь, как его взломать."
84302200600-61 = "Я... знаю, но..."
84302200600-62 = ""
84302200600-64 = ""
84302200600-65 = ""
84302200600-66 = "П-Почему ты так ко мне приближаешься? Ч-Что ты делаешь?"
84302200600-67 = "Фуфу. О, не о чем беспокоиться."
84302200600-68 = ""
84302200600-70 = ""
84302200600-72 = "Коюки... Прошу прощения, «Кодовое имя Белый Кролик...»"
84302200600-73 = "...как насчёт ещё одной сделки?"
