[translation]
32020-1 = "Episódio 2;Irmandade"
32020-2 = "Ah, Sensei!"
32020-3 = "[s] \"Desculpem, acabei me atrasando um pouco.\""
32020-4 = "Magina...! Ah, a propósito, olhe só isso! Estes são os resultados do simulado que acabamos de fazer!"
32020-5 = "[s] Ver os resultados da prova."
32020-7 = "2º Simulado do Clube de Aulas de Reforço — Resultados:"
32020-9 = "Hanako — 8 pontos[FF6666] (Reprovada)[-]"
32020-11 = "Azusa — 58 pontos[FF6666] (Reprovada)[-]"
32020-13 = "Koharu — 49 pontos[FF6666] (Reprovada)[-]"
32020-15 = "Hifumi — 64 pontos[007eff] (Aprovada)[-]"
32020-17 = "...Foi por um triz."
32020-18 = "Sim! Desta vez foi mesmo por um triz! Você chegou tão perto, Azusa-chan...!"
32020-19 = "V-Viu só?! Hifumi, a minha nota também subiu bastante, não foi?!"
32020-20 = "Sim, eu vi muito bem! Koharu-chan, da última vez você tirou 15 pontos e agora saltou direto para 49... Você foi quem mais evoluiu, é incrível!"
32020-21 = "Heh, hehehe! Eu não disse? Eu só estava escondendo a minha verdadeira capacidade."
32020-22 = "Foi maravilhoso...!"
32020-23 = "E, hum... a H-Hanako-chan..."
32020-24 = "Ora? Hifumi-chan, por que a sua voz ficou tão baixinha de repente?"
32020-25 = "Na primeira prova tirei 2 pontos, no simulado seguinte 4 pontos, e desta vez foram 8 pontos, viu só?"
32020-29 = "Se pensarmos nisso como uma progressão matemática, basta eu fazer mais 3 provas que certamente chegarei à nota de aprovação♪"
32020-30 = "S-Se pensar por esse lado, talvez até seja verdade, mas..."
32020-31 = "[s] \"Sim, todas vocês se esforçaram muito.\""
32020-32 = "Sim! Se continuarmos nesse ritmo, talvez consigamos alcançar a nossa meta mais cedo do que imaginávamos...!"
32020-33 = "Eu vou cumprir esta missão custe o que custar e receber aquele bichinho fofo. Essa é a razão de eu estar aqui e o meu objetivo de luta."
32020-34 = "A-Azusa-chan?! A razão de estarmos aqui são as provas e os estudos, e o nosso objetivo é escapar da reprovação?! Quando foi que isso mudou...?!"
32020-35 = "Ah, tinha isso também, né. Vou aproveitar e resolver isso de tabela."
32020-36 = "\"De tabela\"?! Como assim de tabela?! Auu... C-Como fã dos Momo Friends eu até fico feliz, mas..."
32020-42 = "...?"
32020-43 = "Ora, parece que chegou alguém, não é?"
32020-44 = "Pois é... Quem será que veio até o nosso alojamento, e para quê—"
32020-45 = "C-Com licença...!"
32020-46 = "Ora, essa voz é..."
32020-47 = "Um intruso. Tudo bem, os preparativos já estão prontos."
32020-48 = "Azusa-chan, que preparativos...?"
32020-52 = "Kyaaa?!"
32020-53 = "Armadilhas. Configurei para serem acionadas assim que detectassem a invasão de alguém."
32020-54 = "Azusa-chan?!"
32020-55 = "M-Mas o que é isso...? Hã? Ah, aqui também...?!"
32020-61 = "Kyaaaaaa?!"
32020-62 = "É inútil fugir. Eu previ a rota de fuga e instalei armadilhas mais adiante também."
32020-63 = "AZUSA-CHAAAN!!?!?"
32020-65 = "Alojamento — Entrada"
32020-66 = "Cof... cof, cof..."
32020-67 = "V-Você está bem...?! M-Machucou-se em algum lugar...?"
32020-68 = "Q-Que a paz e a serenidade... cof, cof... estejam com vocês... cof, no dia de hoje também..."
32020-69 = "Por favor, preocupe-se primeiro com a sua própria serenidade?!"
32020-70 = "Ué, olhando bem, essa roupa é da Irmandade...?"
32020-71 = "Ora, se não é a Mari-chan?"
32020-72 = "Ah, H-Hanako-san..."
32020-74 = "Aqui, um pouco de água."
32020-75 = "M-Muito obrigada."
32020-79 = "(Gole, gole...)"
32020-80 = "...Ufa. Que susto, assim que entrei algo foi acionado de repente..."
32020-84 = "Azusa-chan..."
32020-95 = "..."
32020-96 = "Desculpe. Achei que fosse um ataque inimigo."
32020-97 = "H-Hã...?"
32020-98 = "A-A propósito, por que alguém da Irmandade veio até um lugar como este...?"
32020-99 = "Ah, sobre isso..."
32020-100 = "Ouvi dizer que as integrantes do Clube de Aulas de Reforço estavam aqui... Só não sabia que a Hanako-san também fazia parte..."
32020-102 = "...É que as minhas notas também não são muito boas."
32020-103 = "Ah... entendo. Certo..."
32020-104 = "Hanako, vocês se conhecem?"
32020-105 = "Ahaha... Digamos que nossos caminhos já se cruzaram um pouquinho."
32020-106 = "Mas parece que você não veio aqui para me visitar, não é, Mari-chan? Que assunto a traz ao Clube de Aulas de Reforço?"
32020-107 = "Ah, sim."
32020-108 = "Hoje eu vim procurar a Azusa Shirasu-san, do Clube de Aulas de Reforço. Quando perguntei por ela, disseram-me que estava aqui."
32020-109 = "Eu?"
32020-110 = "Sim. Na verdade, uma aluna que a Azusa-san ajudou outro dia queria muito lhe transmitir seus agradecimentos. Por uma série de circunstâncias, vim em nome dela."
32020-111 = "...?"
32020-112 = "Agradecimentos...?"
32020-113 = "Havia uma aluna que estava sofrendo bullying das colegas de classe... e, pelo que soube, naquele dia ela foi chamada de repente para ir atrás do prédio."
32020-115 = "U-Uma coisa dessas...?!"
32020-116 = "Bullying...?!"
32020-117 = "...Bom, não é algo inédito de se ouvir. Como costumam fazer isso de forma ardilosa e dissimulada, raramente vem à tona."
32020-121 = "Nós mesmas só ficamos sabendo depois que essa aluna veio nos procurar para pedir ajuda..."
32020-122 = "No dia em que a chamaram lá... a Azusa-san, que passava pelo local por acaso, a salvou."
32020-123 = "É-É mesmo?"
32020-124 = "...Agora que mencionou, aconteceu algo assim mesmo. Só achei irritante ver um bando usando a vantagem numérica para oprimir um alvo mais fraco."
32020-125 = "E então, depois disso, as alunas que levaram uma bronca da Azusa-san entraram em contato com o Comitê de Justiça... Não sei em que ponto a informação foi distorcida, mas parece que acabou escalando para um combate de proporções consideráveis entre o Comitê de Justiça e a Azusa-san..."
32020-126 = "?!"
32020-127 = "E disseram que a Azusa-san ocupou um depósito de bombas de gás lacrimogêneo, usou várias armadilhas contra as integrantes do Comitê de Justiça e continuou lutando por mais de 3 horas..."
32020-128 = "Aquilo foi daquela vez?!"
32020-130 = "Não importa a situação, se compram briga comigo, eu aceito. Naquela ocasião, se a minha munição não tivesse acabado, eu teria lutado por muito mais tempo e levado ainda mais delas comigo."
32020-131 = "A-Auu..."
32020-132 = "Por isso, aquela aluna veio até nós para relatar o ocorrido e disse que queria agradecer à Azusa-san... Mas, como não conseguimos encontrá-la no campus, acabei vindo parar aqui."
32020-133 = "...Entendo."
32020-134 = "Não foi nada que mereça um agradecimento especial. Afinal, no fim das contas eu também acabei sendo capturada."
32020-135 = "Acho que essa segunda parte não tem muito a ver com a história, mas..."
32020-136 = "Além disso, embora a situação dela seja lamentável, ela não pode simplesmente continuar aceitando ser oprimida para sempre. Mesmo que pareça em vão, nunca se deve parar de resistir."
32020-137 = "...Talvez você tenha razão. Sim, vou transmitir essas palavras a ela também."
32020-138 = "..."
32020-139 = "Corriam boatos de que a Azusa-san era uma \"Bruxa do Gelo\" que cultuava a violência... mas, como eu pensava, boatos são apenas boatos."
32020-143 = "Fufu. Isso é verdade, mas a Azusa-chan até que tem um ladinho digno de uma \"Bruxa do Gelo\" de vez em quando, sabia? Veja bem, para quem vê de fora, as expressões dela são um pouquinho difíceis de ler."
32020-148 = "Hanako-san..."
32020-149 = "...Fico feliz em ver que você parece bem, Mari-chan."
32020-150 = "Sim, eu estou... Mas você..."
32020-151 = "Vou acompanhá-la até a entrada. Vamos lá."
32020-152 = "Ah, certo..."
32020-153 = "B-Bom, pessoal, desculpem pelo incômodo. Sensei, perdoe-me também por ter aparecido tão de repente. Até mais."
32020-154 = "[s] \"Sim, vá com cuidado.\""
32020-160 = "(E assim, mais um dia chegava ao fim.)"
32020-162 = "Muito bem, vamos começar a lavar as roupas?"
32020-163 = "Pessoal, coloquem tudo o que for para lavar dentro deste cesto, incluindo uniformes, roupas íntimas e meias, por favor."
32020-164 = "Obrigada, conto com você."
32020-165 = "Certo... O quê?! R-Roupas íntimas também?!"
32020-166 = "Por quê?! Roupas íntimas cada uma pode lavar a sua, não é?!"
32020-167 = "Juntar toda a roupa e lavar de uma só vez economiza água e sabão. O que a Hanako está dizendo não está errado."
32020-168 = "A-Auu... E-Então, por favor..."
32020-169 = "Quêê... E-Eu que sou a estranha aqui...?"
32020-174 = "Prontinho, muito obrigada♡"
32020-175 = "Ah, e as suas, Sensei...?"
32020-176 = "[s] \"Vou deixar passar desta vez.\""
32020-177 = "Ora, tem certeza? Então vou lá colocar a máquina para bater."
32020-178 = "Se tudo correr bem, com certeza estarão lavadas e secas até amanhã de manhã♪"
32020-183 = "Bom, vamos começar a nos preparar para dormir. Bom trabalho hoje também."
32020-184 = "...Sim."
32020-191 = "Hum, Sensei, eu queria conversar um pouquinho... Posso passar no seu quarto mais tarde...? É que... é sobre a Hanako-chan..."
32020-192 = "[s] Assentir silenciosamente."
32020-195 = "Quarto do Sensei"
32020-197 = "...Com licença."
32020-198 = "[ns1] Levantar-se.\n[ns2] Abrir a porta."
32020-202 = "Boa noite, Sensei."
32020-206 = "[ns] \"...?!\""
32020-207 = "Fufu, abrir a porta tão facilmente assim♡ Que descuido o seu♡"
32020-208 = "[s3] \"O-O que você está fazendo aqui, Hanako...?!\"\n[s4] \"E por que está de maiô...?!\""
32020-211 = "Ah, não precisa se preocupar com isso. É o meu pijama."
32020-212 = "[s] \"Não tem como não me preocupar quando você diz que um maiô é o seu pijama...\""
32020-213 = "Ufufu. Deixando isso de lado, Sensei, há um assunto sobre o qual eu gostaria de conversar com você..."
32020-214 = "Na verdade..."
32020-219 = "...É sobre a Azusa-chan."
32020-220 = "[s] \"Sobre a Azusa...?\""
32020-224 = "C-Com licença... Sensei, você está acordado...?"
32020-228 = "Desculpe por vir ainda mais tarde do que ontem, é que na verdade..."
32020-232 = "...Hã?"
32020-233 = "...Ora."
32020-234 = "[s] \".........\""
32020-235 = "..."
32020-237 = "M-Mil perdões pela intromissão?! D-Desculpem! Eu não fazia ideia de que estavam...! E-Eu juro que não sabia de nada mesmo, é sério?! Hã, desde quando isso está acontecendo?!"
32020-238 = "...Hifumi-chan, você acabou de dizer \"mais tarde do que ontem\", não foi?! Isso quer dizer que você veio ontem à noite também, não é?! É isso mesmo, não é?!"
32020-240 = "Desculpa, desculpa, desculpa?! Vir mais tarde não dá, né?! O que eu faço, é melhor deixar para outro dia?! Desculpa por não saber, desculpa por me intrometer, desculpa por estragar o clima...?!"
32020-241 = "Espere um instante, Hifumi-chan, conte-me isso em detalhes, por favor! O que vocês dois estavam fazendo ontem à noite, e o que planejavam fazer esta noite?! Por favor, me expliquem... não, melhor ainda, recriem a cena agora mesmo na minha frente...!!"
32020-242 = "[s] \"Por favor, acalmem-se as duas primeiro...\""
32020-244 = "(Depois disso, demos um jeito de nos acalmar, conversamos e esclarecemos o mal-entendido de ambas.)"
32020-245 = "(De quebra, a Hanako levou uma bronca da Hifumi e foi trocar de roupa direitinho.)"
32020-247 = "Próximo;Encontro Secreto na Madrugada"
