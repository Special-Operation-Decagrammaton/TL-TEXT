[translation]
10053090-1 = "Эпилог;Цучиноко — синий"
10053090-2 = "День 3"
10053090-3 = "А-А-А-А-А!! ОТПУСТИТЕ МЕНЯ!!!"
10053090-5 = "Ещё не поздно!! Наоборот, мы как раз вовремя!"
10053090-6 = ""
10053090-8 = ""
10053090-9 = ""
10053090-10 = "Не глупи! В такое время взбираться на гору очень опасно!"
10053090-11 = "Но это мой последний шанс! Я должна защититься от худшего дня в своей жизни!"
10053090-12 = "Это даже не обязательно должен быть Цучиноко. Подойдёт змея, любая змея. Даже худая!"
10053090-13 = "Все, не стойте столбами. Остановите её!!"
10053090-14 = ""
10053090-16 = ""
10053090-17 = "Давайте, девочки! Изо всех сил!"
10053090-18 = ""
10053090-20 = ""
10053090-21 = "А-а! Ты человек или танк?!"
10053090-22 = ""
10053090-25 = "П-Подождите!! Нога соскользнула! Она неудержима! Вы мне колени обдираете!"
10053090-26 = ""
10053090-30 = "Все, подождите!"
10053090-31 = "Коноха, мне нужно сказать тебе кое-что важное."
10053090-32 = ""
10053090-34 = ""
10053090-35 = ""
10053090-36 = "Не стой у меня на пути. Я тебя снесу, директор!"
10053090-37 = "Я и не собиралась пытаться тебя остановить. Но послушай. Я только что кое-что поняла."
10053090-38 = "Согласно моим расчётам, Коноха, худший день, тот самый «через три дня»..."
10053090-40 = "...уже прошёл...!!"
10053090-41 = ""
10053090-43 = ""
10053090-44 = ""
10053090-45 = ""
10053090-46 = "..."
10053090-47 = "...А?"
10053090-48 = "С самого начала это было странно. Ежедневные предсказания, как следует из названия, обычно относятся к тому дню, когда их получили."
10053090-49 = "Так что если там говорилось о «третьем дне,» то день, когда ты услышала предсказание, тоже считается."
10053090-50 = "Коноха, это значит, что твой «худший день» был вчера!! И ты выжила!"
10053090-51 = "Мой худший день... уже закончился...?"
10053090-52 = "..."
10053090-53 = "...? Но ведь ничего даже не произошло...?"
10053090-54 = ""
10053090-56 = ""
10053090-57 = ""
10053090-58 = "Видишь? Я же говорила. Никакого невезения, никакого проклятия."
10053090-59 = "Все эти гороскопы — просто совпадения. Ты сама выстраиваешь связи, потому что ищешь их, так что—"
10053090-60 = ""
10053090-63 = ""
10053090-69 = ""
10053090-70 = ""
10053090-72 = ""
10053090-73 = "Wait..."
10053090-74 = "Что-то КАК РАЗ произошло. Много чего! Это было ужасно!"
10053090-75 = "За нами охотился какой-то робот!"
10053090-76 = "Потом на нас посреди ночи напали бандиты!"
10053090-77 = "Вообще-то это и был ХУДШИЙ день. Сплошная пытка без остановки!"
10053090-78 = ""
10053090-80 = ""
10053090-81 = ""
10053090-82 = "Эм, ты о нас сейчас?"
10053090-83 = "Мы извиняемся, что напали на вас, но неужели мы правда... «худшее»?"
10053090-84 = ""
10053090-86 = ""
10053090-87 = ""
10053090-88 = "А... Простите. Я не хотела—"
10053090-89 = "...Подождите!!"
10053090-90 = "Шьяаах!! Это И БЫЛ худший день! И всё ещё продолжается!"
10053090-91 = "Не заставляйте меня вас жалеть!"
10053090-92 = ""
10053090-94 = ""
10053090-95 = ""
10053090-96 = "...Одна драка с автобусом-мехом? И это «худшее»? Звучит как вполне обычный день..."
10053090-97 = "Погодите, если «худший день» так и не наступил, тогда это значит..."
10053090-98 = ""
10053090-100 = ""
10053090-101 = "Неужели?!"
10053090-102 = "Я уже нашла Цучиноко?!"
10053090-103 = "Не-не-не... Никаких змей я не видела. Даже ничего похожего..."
10053090-105 = ""
10053090-106 = "А что вообще такое Цучиноко? Ты уверена, что это вообще змея? У него есть хоть какие-нибудь особенности, кроме того, что оно толстое?"
10053090-107 = ""
10053090-109 = ""
10053090-110 = "О... Это острый вопрос. Во-первых, это не просто «толстая змея». Так говорить довольно грубо, да ещё и невежливо."
10053090-111 = "Хотя показания свидетелей различаются, большинство сходятся в том, что, почувствовав угрозу, Цучиноко издаёт звук «шьяаах!»."
10053090-112 = "Ещё удивительнее то, что они умеют резко подпрыгивать! Примерно на целый метр — прямо на тебя!"
10053090-114 = ""
10053090-115 = "Шьяаах!! Шьяаах!!!"
10053090-116 = "Цучиноко!!"
10053090-117 = ""
10053090-120 = ""
10053090-122 = "Ч-Что...?! Что ты делаешь?!"
10053090-123 = "Почему ты меня обнимаешь?! Шьяаах!"
10053090-124 = "Нет, просто я поняла..."
10053090-125 = ""
10053090-128 = "Возможно, настоящим «Цучиноко» была подруга, которую я нашла по пути!"
10053090-129 = "Что происходит?! Ты с ума сошла?!"
10053090-131 = "Так наши поиски Цучиноко наконец подошли к концу."
10053090-132 = ""
10053090-138 = ""
10053090-139 = "Ха! Разве не здорово выглядит, когда всё прибрано?"
10053090-140 = "...Подожди, а зачем мы убирались? Мы же сейчас уезжаем."
10053090-141 = "Прошу прощения? Мы арендовали домик на неделю. Зачем впустую тратить деньги? Теперь можно наконец расслабиться и нормально отдохнуть!"
10053090-142 = "А, вот почему?! Я думала, потому что мы нашли вход на секретную базу пришельцев?"
10053090-143 = ""
10053090-145 = ""
10053090-146 = ""
10053090-147 = "...Эм, раз мы тут закончили, можно мне уйти?"
10053090-148 = "Оставь всякую надежду. Они тебя уже не отпустят."
10053090-149 = "А раз уж мы все здесь застряли, можно расслабиться и повеселиться!"
10053090-151 = ""
10053090-153 = ""
10053090-154 = "В поисках Цучиноко, неизвестного существа"
