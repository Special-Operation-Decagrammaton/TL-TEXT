[translation]
1602-1 = "Наспех проведённая проверка Клуба школьных обедов, часть 2"
1602-2 = "Начнём с личной гигиены."
1602-3 = "Все покажите руки."
1602-4 = "Хорошо."
1602-5 = "Вот."
1602-6 = "Давайте! Я уверена в своей чистоте!"
1602-7 = "Все знают, что гигиена — первый шаг к изысканной кухне!"
1602-8 = "Ты. Ты ведь даже не состоишь в Клубе школьных обедов."
1602-9 = "Хотя неважно."
1602-10 = ""
1602-11 = "Хм. Хорошо. По крайней мере руки у всех чистые."
1602-12 = "Личная гигиена: проверено."
1602-13 = "Дальше..."
1602-15 = "Кухонные принадлежности содержатся в чистоте. Хорошо."
1602-16 = "Столы, стулья, шторы и прочая обстановка в хорошем состоянии."
1602-17 = "Сроки годности продуктов соответствуют нормам."
1602-18 = "И наконец... кухня."
1602-19 = ""
1602-20 = ""
1602-21 = "*глоть*"
1602-23 = "*бульк* *бульк* *бульк*"
1602-24 = "А? Это кастрюля?"
1602-25 = "*грохот*"
1602-26 = "Почему она так трясётся?!"
1602-27 = "Джури, это ведь еда, которую ты готовила? Что случилось?!"
1602-28 = "О нет! Кажется, приготовленная мной еда опять взбесилась!"
1602-29 = "Опять?!"
1602-30 = "...Ты сказала «опять»?"
1602-31 = "Я разберусь!"
1602-32 = "Я специально училась, чтобы справляться с такими ситуациями!"
1602-33 = "Ради санитарной проверки, благополучия Клуба школьных обедов и вашей собственной безопасности..."
1602-34 = "...я буду сражаться!"
1602-35 = "Иори так просто меня не победит!"
1602-36 = "Почему ты продолжаешь говорить так, будто она твоя соперница?!"
1602-44 = "Ч-Что...?! Еда нападает!"
1602-45 = "Никогда такого не видела."
1602-46 = "Я думала, еда существует для того, чтобы её ели."
1602-47 = "Выходит, иногда... еда может съесть тебя!"
1602-48 = "По-моему, так быть не должно."
1602-49 = "И всё же, считается ли это нарушением санитарных норм?"
1602-50 = "Возможно. Хм, пока поставлю «удовлетворительно»..."
1602-51 = ""
1602-52 = ""
1602-53 = ""
1602-54 = ""
1602-55 = "На этом санитарная проверка практически завершена..."
1602-56 = "Хмф. Вы прошли."
1602-57 = "Вуху!"
1602-58 = "Чего ты так гордишься? Ты вообще-то из Общества гурманов..."
1602-59 = "Я не думала, что ты так легко поставишь нам проходную оценку!"
1602-60 = "Вот ещё. Я пришла сюда не драться."
1602-61 = "Я согласилась провести проверку лишь для того, чтобы убедиться, что санитарные нормы соблюдаются."
1602-62 = "Более того, готова признать: по крайней мере с гигиеной у вас всё безупречно."
1602-63 = "Фух..."
1602-64 = "Ура! Как же я рада!"
1602-65 = ""
1602-67 = "Кажется, моё мнение о вашем маленьком Клубе школьных обедов изменилось."
1602-68 = "Ваша страсть к готовке, безупречная гигиена..."
1602-69 = "Еда по-прежнему не очень вкусная, но за чистоту я вас уважаю."
1602-70 = "Мы сделали это!"
1602-71 = "Я знаю, что со вкусом проблемы, ясно?! Хватит уже!"
1602-72 = "Что ж, судя по результатам, возможно, я ошибалась насчёт вашей репутации."
1602-73 = "После таких результатов всем придётся пересмотреть своё мнение."
1602-74 = "Меня ваша работа тоже впечатлила."
1602-75 = "Оценка Префектурной команды была быстрой и справедливой!"
1602-76 = "Я рада, что на этот раз нашим инспектором была именно ты, Иори!"
1602-77 = "Ах! Прекратите! Мне не нужны ваши комплименты!"
1602-78 = "П-Просто хватит, ладно? Я ухожу!"
1602-81 = ""
1602-82 = "(Какое облегчение... Но точно ли всё уже закончилось?)"
1602-83 = "Всё это слишком затянулось, и у меня уже пересохло в горле."
1602-84 = "Можно попросить чего-нибудь выпить?"
1602-85 = "Хочешь, чтобы мы принесли? Вода подойдёт?"
1602-87 = "О, у меня как раз кое-что есть!"
1602-88 = ""
1602-89 = ""
1602-90 = "Вот. Пей."
1602-91 = "Хм? Апельсиновый сок? Спасибо."
1602-92 = "Я тоже хочу!"
1602-93 = "Хи-хи. Конечно. Держи!"
1602-95 = "...А? Сок?"
1602-96 = "Не помню, чтобы нам привозили партию апельсинового сока."
1602-97 = "А, это не для клуба."
1602-98 = "Я сама его выжала, чтобы поделиться со всеми!"
1602-99 = "Я и прошлому санитарному инспектору давала!"
1602-100 = "Что...? Прошлому?"
1602-101 = "..."
1602-102 = ""
1602-103 = "Последний инспектор, посетивший Клуб школьных обедов, получил пищевое отравление."
1602-104 = ""
1602-105 = "...!"
1602-106 = "Стой! НЕ ПЕЙ!"
1602-107 = "А? *глоток* *глоток*"
1602-108 = "...Угх?!"
1602-109 = ""
1602-111 = "Нее-е-е-ет!"
1602-112 = "А? Что случилось с Иори? Может, она совсем вымоталась..."
1602-113 = "Но здесь же не место для сна!"
1602-114 = "А-а! Всё плохо!"
1602-115 = "Ч-Что теперь будет с нашей проверкой?!"
1602-116 = "И на этот раз мы имеем дело с Префектурной командой! Бюджет Клуба школьных обедов урежут вдвое!"
1602-117 = "...Нет, успокоимся. Должен же быть какой-то выход."
1602-118 = "Х-Хорошо!"
1602-119 = "А что если спрятать её тело, пока никто другой из Префектурной команды не заметил?!"
1602-120 = ""
1602-121 = ""
1602-122 = ""
1602-123 = ""
1602-125 = ""
1602-126 = ""
1602-127 = "*глоток* *глоток*"
1602-128 = ""
1602-129 = "Ого, вкусно!"
1602-131 = "(В конце концов Иори очнулась и без колебаний влепила Клубу школьных обедов жирную двойку за санитарную проверку.)"
1602-132 = "Наспех проведённая санитарная проверка Клуба школьных обедов"
