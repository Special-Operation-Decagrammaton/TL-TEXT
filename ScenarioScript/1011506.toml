[translation]
1011506-1 = "То, что остаётся, и то, что продолжается"
1011506-2 = ""
1011506-3 = ""
1011506-4 = ""
1011506-5 = "Ого... Когда собрала всё вместе, их оказалось ОЧЕНЬ много."
1011506-6 = "Один бейсбольный мяч с порванными швами, одна порванная перчатка, одна погнутая алюминиевая бита..."
1011506-7 = "А это что? Форма с пятном грязи, которое не отстирывается...? Серьёзно, сначала стоило попробовать отстирать её вручную..."
1011506-8 = "Все знают, что столько грязи нормально выводится только ручной стиркой..."
1011506-9 = "*вздох* Для начала надо составить список того, что чинить. Сначала снаряжение."
1011506-10 = "[ns] «Давай я помогу.»"
1011506-11 = "Хм? С-Сенсей? ...Ой нет, это моя работа. Обычная рутина для разнорабочей из Бейсбольного клуба Миллениума."
1011506-12 = ""
1011506-15 = ""
1011506-16 = "Эй, ты уже начал сортировать? П-Постой! Если уж собираешься помогать, то хотя бы давай делать это вместе..."
1011506-18 = ""
1011506-19 = "Итак, судя по углу разрыва этой перчатки, углу падения и примерной энергии столкновения при ловле..."
1011506-20 = "[s] «Продолжай...»"
1011506-21 = "...эта перчатка, скорее всего, порвалась при ловле лайнера, а не верхового мяча."
1011506-22 = "У верховых мячей ускорение вниз, конечно же, создаёт гравитация. А значит, скорость их падения ограничена."
1011506-23 = "Даже при предельной скорости падающий мяч не оставил бы такого следа."
1011506-24 = ""
1011506-26 = ""
1011506-27 = "Смотри. Видишь, как кожаный шнур полностью вырвало из сетки? Это вставка между большим и указательным пальцами."
1011506-28 = "Наверняка это был чистый лайнер. Если бы он не полетел прямо в защитника, скорее всего, получился бы хит."
1011506-30 = ""
1011506-31 = "А теперь вот этот. Видишь все эти порванные нитки?"
1011506-32 = "Такое, должно быть, оставил широкий свипер."
1011506-33 = "[s] «Свипер?»"
1011506-34 = "Это крученая подача, разновидность слайдера. Она уходит в сторону по горизонтали."
1011506-35 = "Обычный слайдер бросают хватом на четыре шва. А свипер — на два. И нужно идеально рассчитать горизонтальное движение!"
1011506-36 = "Если всё сделать правильно, мяч естественно уходит наружу, туда, где бэттеру сложнее его зацепить. Отлично повышает шанс на промах."
1011506-37 = "Ты ведь знаешь статистику ценности подач в саберметрике? Слайдеры там всегда на первом месте."
1011506-38 = "[s1] «Вот это да...»\n[s2] «Значит, в Бейсбольном клубе Миллениума есть питчер, который умеет так подавать?»"
1011506-41 = "Ах."
1011506-42 = "..."
1011506-43 = "Да, если считать Питчинг-энд-Бэттинг машину Миллениума..."
1011506-45 = ""
1011506-46 = "А теперь посмотри на эту биту. Видишь угол изгиба? Подозрительно, правда?"
1011506-47 = "Почему? Ну, если бы она погнулась во время удара, изгиб был бы здесь, а не здесь!"
1011506-48 = "Если посчитать нагрузку и точку её приложения, мяч просто не мог попасть в это место! Разве что бэттер махнул под каким-то безумным углом."
1011506-49 = ""
1011506-51 = ""
1011506-52 = "Скорее всего, кто-то тащил биту по земле, упал, и вот тогда она погнулась."
1011506-53 = "Надо попросить капитана напомнить всем, что со снаряжением нужно обращаться аккуратнее."
1011506-54 = "[s3] «Угол падения», «нагрузка», «точка приложения»...\n[s4] «Ты и правда студент Миллениума, Рэй.»"
1011506-57 = "Хм? Ты о чём, Сенсей?"
1011506-58 = "А, ты про то, что я использую динамику для анализа снаряжения? Ну да, для нас тут это, можно сказать, обычное дело."
1011506-59 = "Ты... кажется, понимаешь."
1011506-61 = "А, теперь вот это."
1011506-62 = ""
1011506-64 = ""
1011506-65 = ""
1011506-66 = ""
1011506-67 = "Это чинить не нужно."
1011506-68 = "[ns] «С этим мячом связано что-то особенное?»"
1011506-69 = "..."
1011506-70 = "Вообще-то... да."
1011506-75 = "― [log=레이]Это первый...[/log][wa:2790]"
1011506-76 = "― [log=레이]хоум-рановый мяч, который я когда-либо поймала.[/log][wa:2620]"
1011506-79 = "― [log=레이]С тех пор как начала играть,[/log][wa:640]"
1011506-80 = "― [log=레이]я всегда держала его при себе.[/log][wa:820]"
1011506-83 = "― [log=레이]Когда я увидела тот первый хоум-ран...[/log][wa:210]"
1011506-84 = "― [log=레이]я пообещала себе, что однажды тоже выбью такой.[/log][wa:4310]"
1011506-87 = "― [log=레이]А сейчас...  [/log][wa:1260]"
1011506-88 = "― [log=레이]он занимает почётное место у меня в шкафчике.[/log][wa:1340]"
1011506-91 = "― [log=레이]Когда мне хочется всё бросить, я смотрю на него.[/log][wa:1530]"
1011506-94 = "― [log=레이]Он напоминает мне, с чего всё началось. И всегда поднимает мне дух.[/log][wa:1330]"
1011506-95 = "― [log=레이]...Для меня это и память, и талисман на удачу.[/log][wa:3300]"
1011506-98 = ""
1011506-99 = "[ns] «Будто в нём хранятся твои дорогие воспоминания.»"
1011506-100 = "Забавно, правда, Сенсей?"
1011506-101 = "С научной точки зрения это всего лишь маленький круглый предмет."
1011506-102 = "Старая кожа, 108 стежков, пробка и резиновая сердцевина внутри."
1011506-103 = "Но всё равно, стоит мне на него посмотреть — и на душе становится тепло, а силы возвращаются."
1011506-104 = "Он подбадривает меня и заставляет попробовать ещё раз."
1011506-105 = "[s] «Здорово, когда есть что-то настолько дорогое сердцу.»"
1011506-106 = "И правда."
1011506-107 = "Правда..."
1011506-108 = "Эм, Сенсей?"
1011506-109 = "Знаешь, эм..."
1011506-110 = ""
1011506-112 = ""
1011506-113 = "Я надеюсь... что однажды смогу стать..."
1011506-114 = "...кем-то дорогим."
1011506-115 = "Для тебя, Сенсей."
1011506-116 = "[s] «Но ты уже такая.»"
1011506-117 = "Что?!!"
1011506-118 = "[ns] «Ты мой студент, Рэй.»"
1011506-119 = "..."
1011506-120 = ""
1011506-122 = ""
1011506-123 = "Вот как? Ну... Хи-хи. Думаю, это тоже хорошо."
1011506-124 = "По крайней мере... пока."
1011506-125 = "Да. «Пока что.»"
