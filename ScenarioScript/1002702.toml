[translation]
1002702-1 = "Непредвиденный взгляд"
1002702-4 = "Я принёс заказанные вещи к месту встречи, но там никого не было."
1002702-5 = ""
1002702-8 = "[ns] «...?»"
1002702-9 = ""
1002702-10 = "О, Сенсей. Это я, Карин."
1002702-11 = "В общем, дело в том, что..."
1002702-12 = "Это... Мне правда очень жаль. С нашей стороны вышла путаница."
1002702-13 = "Вещи должна была забрать Асуна, но я не знаю, где она, и связаться с ней не получается."
1002702-14 = "Нет. Это всё лишь оправдания. Вы столько сил потратили, чтобы всё принести, а я могу только извиняться."
1002702-15 = "Не хочу доставлять вам ещё больше хлопот, поэтому..."
1002702-16 = "Можете просто оставить вещи там? Честно говоря, вы и так уже сделали почти всю работу."
1002702-17 = "Я сама найду время спуститься и забрать их..."
1002702-18 = "[s1] «А где ты сейчас, Карин?»\n[s2] «Куда именно нужно было доставить эти вещи?»"
1002702-19 = "Что? Зачем вы спрашиваете?"
1002702-20 = "Что? Зачем вы спрашиваете?"
1002702-21 = "Ну..."
1002702-22 = "Если зайдёте в переулок прямо рядом с вами, там должно быть заброшенное здание."
1002702-23 = "Я на верхнем этаже, но уйти не могу. Мне нельзя отводить глаз от объекта наблюдения."
1002702-24 = "[s] «Раз уж я уже здесь, сам подниму их к тебе.»"
1002702-25 = "А?"
1002702-26 = "Я не могу заставлять вас так утруждаться!"
1002702-27 = "Мне кажется, я и так слишком многого от вас прошу."
1002702-28 = "[s] «Всё нормально. Оставь это мне.»"
1002702-29 = "Е-Если вы так говорите, тогда..."
1002702-30 = "Поняла. Я принимаю вашу помощь."
1002702-31 = "Спасибо, Сенсей."
1002702-32 = ""
1002702-34 = ""
1002702-38 = "Здание было полностью заброшено и пустовало."
1002702-39 = "Поднимаясь наверх, я слышал только собственные шаги."
1002702-40 = "Сенсей? Вы уже близко?"
1002702-41 = "О, вот вы где. Я слышу ваши шаги."
1002702-42 = "Похоже, вы рядом. Просто идите прямо."
1002702-43 = "[s] Следовать её указаниям и идти прямо."
1002702-44 = ""
1002702-46 = ""
1002702-49 = "Сюда! Спасибо, Сенсей."
1002702-50 = "[s] «...?!»"
1002702-51 = "...?"
1002702-52 = "Сенсей? Что такое? Почему вы отвернулись?"
1002702-53 = "Моя поза?"
1002702-54 = "...?!"
1002702-57 = "― А?![wa:130]"
1002702-61 = "― С-Сенсей?! Стойте! Н-Нет, это...[wa:3980]"
1002702-64 = "― Подождите, я сейчас не могу изменить позу![wa:930]"
1002702-67 = "― Я на снайперском задании![wa:2260]"
1002702-70 = "― И сейчас не могу отвести взгляд от цели.[wa:10]"
1002702-72 = "― Вот почему!"
1002702-75 = "― А? Вы не против?[wa:2010]"
1002702-77 = "― Вам так даже больше нравится?! Стойте![wa:2430]"
1002702-80 = "― П-Почему-то вы выглядите довольным, но это всё равно...![wa:3950]"
1002702-82 = "― Это уже слишком! Мне неловко![wa:1090]"
1002702-85 = "― Что? Не обращать внимания и сосредоточиться на работе?[wa:710]"
1002702-87 = "― Да как тут не обращать внимания, дурак?![wa:1190]"
1002702-90 = "Я тихо ждал позади, пока Карин не закончила задание."
1002702-91 = ""
1002702-94 = ""
1002702-95 = "Я закончила. То есть, ничего особенного. Обычное задание по обеспечению безопасности."
1002702-96 = "Моя поза?"
1002702-97 = "А. Ну, сегодня я работала одна, и просто давно не приходилось..."
1002702-98 = "В любом случае... *вздох* Не могу поверить, что совсем об этом не подумала."
1002702-99 = "П-Простите. Я не хотела ставить вас в такое неловкое положение, Сенсей."
1002702-100 = "Похоже, мне придётся остаться здесь ещё ненадолго, так что вам лучше вернуться и отдохнуть."
1002702-101 = "Хотите ещё немного побыть со мной?"
1002702-102 = "Хи-хи. Вы переживаете, что мне будет одиноко здесь одной?"
1002702-103 = "Не волнуйтесь. Может, по мне и не скажешь, но я всё-таки снайпер. Одиночество — часть работы."
1002702-104 = "Вы не об этом? Т-Тогда что вы имеете в виду?"
1002702-105 = "...Вам нравится вид?"
1002702-106 = ""
1002702-108 = ""
1002702-109 = "Сенсей."
1002702-110 = "Уходите. Сейчас же."
