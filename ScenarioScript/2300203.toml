[translation]
2300203-1 = "Бессонница"
2300203-2 = "Медпункт"
2300203-3 = "Добро пожаловать, Сенсей!"
2300203-4 = "Я приготовила тебе одеяло, чтобы ты поспал, ведь прошлой ночью ты почти не спал!"
2300203-5 = "Даже если всего тридцать минут, короткий сон на удобном одеяле снимет усталость."
2300203-6 = "[s] «Но спать во время работы как-то...»"
2300203-7 = "Дневной сон очень полезен!"
2300203-8 = "Он помогает восстановиться тем, кто недоспал, и ещё повышает концентрацию."
2300203-9 = "Так что не переживай и спи крепко!"
2300203-10 = "[s] «Может, немного посплю...»"
2300203-11 = "Хорошо! Ложись, я помогу тебе уснуть."
2300203-13 = "Так, сосредоточимся... на сонной артерии..."
2300203-14 = ""
2300203-15 = ""
2300203-16 = "Сенсей, не двигайся! Я чуть не ударила тебя по лицу!"
2300203-17 = "[s] «Что ты делаешь?!»"
2300203-18 = "Что? Просто пытаюсь вырубить тебя, чтобы ты крепко уснул."
2300203-19 = "Я читала, что если сильно ударить человека по сонной артерии, он сразу без боли потеряет сознание."
2300203-20 = "Я разбужу тебя, когда закончится обед, так что можешь спокойно спать!"
2300203-21 = "[s1] «Это не сон...»\n[s2] «Прекрати, это опасно!»"
2300203-22 = "Другой способ..."
2300203-23 = "Другой способ..."
2300203-24 = "Тогда почему бы не использовать этот анестетик? Он настолько мощный, что мгновенно вырубает слона!"
2300203-25 = "Укол немного кольнёт, зато эффект гарантирован! ☆"
2300203-26 = "И это не хочешь? Тогда остаётся только травяной чай для крепкого сна..."
2300203-27 = "[s] «Травяной чай подойдёт.»"
2300203-28 = "Но есть столько более эффективных способов! Ты точно хочешь чай?"
2300203-29 = "Тогда я сейчас же принесу травяной чай. Подожди немного!"
2300203-31 = "Позже я выпил тёплый травяной чай Ханаэ и немного поспал в медпункте."
