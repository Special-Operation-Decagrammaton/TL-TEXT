[translation]
84312100300-5 = ""
84312100300-6 = "О, госпожа гостья! Сюда, сюда!"
84312100300-7 = "Вам понравился Экспо? Сегодня последний день... Какие впечатления?"
84312100300-9 = "Было весело. Очень весело. У меня даже слов не хватает описать, насколько."
84312100300-10 = "Э-Это отлично... То есть хорошо для нас..."
84312100300-11 = "Кстати, эм... можно кое-что спросить...?"
84312100300-12 = "Мы не знаем подробностей, но слышали, что вы с нашей лидер много чем занимались всё время Экспо. Вы случайно ещё и территорию вокруг убирали?"
84312100300-13 = ""
84312100300-15 = ""
84312100300-16 = "...А? Убирали?"
84312100300-18 = "Да! Мы должны были убрать этот участок, но кто-то уже сделал это за нас. Очень аккуратно!"
84312100300-20 = "Ещё вчера к ужину здесь всё было как прежде... Поэтому я подумала, что убрали ночью."
84312100300-21 = "Первыми мне на ум пришли наша лидер и вы."
84312100300-22 = "Понятно. Вот что вы имели в виду."
84312100300-23 = "Но прошлой ночью меня здесь не было. Может, Нэру убрала всё сама..."
84312100300-24 = "А, нет-нет. Невозможно. Нэру сама убираться не станет."
84312100300-26 = "Даже когда мы все убираемся вместе, именно она жалуется больше всех."
84312100300-27 = "Понятно. Тогда кто...?"
84312100300-28 = ""
84312100300-30 = ""
84312100300-31 = "(Рио...)"
84312100300-32 = "(А. Так вот почему Рио была настолько уверена.)"
84312100300-33 = "(...Неудивительно.)"
84312100300-35 = "А-а. В любом случае работа закончена. Пойдём развлекаться?"
84312100300-36 = "О чём ты, Асуна? У нас гора работы."
84312100300-37 = "Даже сейчас нам нужно проводить студентов Тринити..."
84312100300-38 = "У-у, совсем не весело."
84312100300-39 = "Ну, это же РАБОТА... Мы делаем её не ради веселья."
84312100300-40 = ""
84312100300-42 = ""
84312100300-44 = ""
84312100300-45 = "(Похоже, они теперь разговаривают между собой. Пожалуй, я тихо выйду из беседы.)"
