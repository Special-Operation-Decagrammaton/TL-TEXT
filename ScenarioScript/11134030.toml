[translation]
11134030-1 = "Чутьё;Операция «Зубрёжка» 1"
11134030-2 = "Это работает лучше, чем я думала."
11134030-3 = "...Хм? Что работает?"
11134030-4 = "А, ты о том, что мы изучаем теорию перед игрой?"
11134030-5 = "Хм... Да, я тоже чувствую разницу."
11134030-6 = "Говорят, хорошему воину нужны и ум, и сила. Похоже, с чем-то одним вершины не достичь."
11134030-7 = "Так... почему ты заговорила об этом именно сейчас?"
11134030-9 = "Ну, эм... разве это не очевидно?"
11134030-10 = "Раз уж мы здесь, я подумала, что стоит сесть и повторить всю теорию, которая может помочь."
11134030-11 = "Понятно. То есть ты считаешь, что эффективнее сначала освоить одно, а уже потом переходить к следующему, вместо того чтобы каждый раз метаться туда-сюда."
11134030-12 = "Ну... звучит разумно..."
11134030-13 = "Но ты точно уверена? Мне кажется, от такой скуки люди могут просто уснуть..."
11134030-14 = "Как ты?"
11134030-15 = "На себя посмотри!!"
11134030-16 = "Как мы?"
11134030-17 = "Не то чтобы... неправда, но всё равно почему-то бесит!!"
11134030-18 = "А-ха-ха..."
11134030-19 = "Т-Тогда попробуем? Я принесу ноты и книги."
11134030-20 = "Хорошо. А мы пока подготовим место для занятий."
11134030-21 = "«Начинаем операцию „Зубрёжка“»!"
