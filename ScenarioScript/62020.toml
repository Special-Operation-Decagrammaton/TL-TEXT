62020-178 = "А может, мы вообще никогда не доживём до этого дня."
62020-179 = "Будущее не гарантировано, поэтому слишком цепляться за свои убеждения неразумно."
62020-180 = "...Единственное «будущее», которое должно быть предопределено, — это цифры, записанные в договоре."
62020-182 = "Фуфу. Да. Это очень важно."
