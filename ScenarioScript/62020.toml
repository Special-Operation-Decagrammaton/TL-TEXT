62020-173 = "[s] «...?»"
62020-174 = "Я слышала эту фразу бесчисленное множество раз — и бесчисленное множество раз её понимали неверно."
62020-175 = "Изначально она означала: раз всё когда-нибудь проходит, во всём следует знать меру."
62020-176 = "Ты, я и все остальные однажды растворимся в прошлом."
