62020-150 = ""
62020-152 = ""
62020-153 = "Да заткнитесь уже, Сенсей! Хватит этих крокодильих слёз! Вы же явно развлекаетесь!"
62020-154 = "...Знаешь, Сенсей, вообще-то именно ты здесь самая большая проблема. Лучше будь осторожнее."
62020-155 = "Ч-Что...? Сенсей... это...?"
62020-156 = "Да. Хуже всех. Настоящая угроза обществу."
62020-157 = "Однажды Сенсей проснулся и решил дать мне надежду. И ведь действительно это сделал."
62020-158 = "...Если бы это оказалось ложью, я наконец смогла бы сдаться."
62020-159 = "Но теперь я не могу. Значит, Сенсей должен до конца наших жизней отвечать за то, что со мной сделал. А он всё ещё не отвечает."
62020-160 = "Вот такой Сенсей. Берегись."
62020-161 = "П-Понятно..."
62020-162 = "[s] «А? Получается, мы теперь навсегда будем вместе?»"
62020-163 = ""
62020-165 = "Хватит уже этих двусмысленных фраз, которые так легко понять НЕ ТАК!!!"
62020-166 = ""
62020-168 = ""
62020-170 = "..."
62020-171 = "«Vanitas vanitatum. Всё суета»."
