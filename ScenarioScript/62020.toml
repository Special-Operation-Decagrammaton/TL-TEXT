[translation]
62020-1 = "Эпизод 2;Звук трубы"
62020-3 = "Вот, держи! И тебе тоже!"
62020-4 = "На всех хватит, так что, пожалуйста, становитесь в очередь!"
62020-5 = ""
62020-7 = ""
62020-9 = ""
62020-10 = ""
62020-11 = "Да что это вообще за штуки?"
62020-13 = "Для начала: этот питательный паёк был специально разработан для восполнения дефицита питательных веществ."
62020-14 = ""
62020-16 = ""
62020-17 = ""
62020-18 = "Хотя до истощения дело не дошло, медицинские обследования вас и остальных проживающих здесь студентов выявили тревожные проблемы."
62020-19 = "...Впрочем, уровень насыщенных жиров и сахара оказался повышенным."
62020-20 = "В любом случае используйте эти пайки, чтобы восполнить недостаток питательных веществ. На вкус они сладкие."
62020-21 = "Для человека с обычным рационом 500 калорий на упаковку было бы многовато."
62020-22 = "Но они разработаны именно для эффективного восстановления организма."
62020-23 = "Они легко усваиваются и при этом богаты питательными веществами, витаминами, минералами и клетчаткой."
62020-24 = "Для начала ешьте по две-три упаковки в день."
62020-26 = "С-Спасибо..."
62020-27 = "А ещё смотрите! Это трубочка-фильтр для воды! Внутри встроен фильтр, так что с ней можно пить даже из лужи!"
62020-28 = "Она отфильтровывает микроорганизмы и удаляет до 99,9% бактерий!"
62020-29 = "Это вроде специального инструмента, с которым воду можно пить почти откуда угодно!"
62020-30 = "Такие портативные модели способны отфильтровать примерно 700 литров воды!"
62020-31 = "Ой! Но вирусы, химикаты, соль и тяжёлые металлы она не удаляет!"
62020-32 = "Эм, что ещё...? Ах да! Обязательно пейте медленно!"
62020-33 = "И ещё: у трубочки есть пределы! Если вода слишком грязная или мутная, она не сможет отфильтровать всё. Так, кажется, я закончила!"
62020-35 = "То есть нам больше не придётся собирать дождевую воду в кастрюли... или заболевать после того, как выпьем стоячей воды...?"
62020-36 = "Ещё у нас есть аптечки первой помощи. Никто не знает, когда случится чрезвычайная ситуация, поэтому важно быть готовыми!"
62020-37 = "В этом наборе 30 видов базовых медицинских принадлежностей."
62020-38 = "Ты сказала ТРИДЦАТЬ?!"
62020-39 = "Да. Здесь есть средства первой помощи, маленький фонарик и внешний аккумулятор, инструкции на случай чрезвычайных ситуаций, грелки для рук и даже аварийное фольгированное одеяло..."
62020-40 = "Это стандартная аптечка нашего Клуба волонтёрской помощи!"
62020-42 = "И это у них стандартный набор... Невероятно..."
62020-44 = ""
62020-45 = "Удивительно, что вы вообще проводите занятия в таком импровизированном лазарете."
62020-46 = "[s] «Образование не знает границ»."
62020-47 = "П-Понятно..."
62020-48 = "Но какой вообще смысл во всём этом?"
62020-49 = "Особенно в математике — всякие квадратные функции, анализ..."
62020-50 = "[s1] «Возможно, в повседневной жизни вы не будете пользоваться математическими формулами.»\n[s2] «Но умение МЫСЛИТЬ математически тоже вам поможет.»"
62020-53 = "«Мыслить математически»? Это как?"
62020-55 = "Вы и моё любопытство пробудили. Прошу, поясните, Сенсей."
62020-56 = "Хм-м... Математика — это просто система языка, где вместо слов используются числа? Ладно, кажется, я поняла."
62020-57 = "Вы хотите сказать, что математика убирает двусмысленность и объясняет мир числами?"
62020-58 = "То есть те, кто изучает математику, обычно лучше умеют определять и объяснять причины, ход и результаты проблемы?"
62020-59 = "А если продолжить эту мысль, она учит собирать и анализировать доказательства, чтобы прийти к логичному выводу. Понятно."
62020-61 = "А...? Математика помогает находить порядок и правила в хаосе?"
62020-62 = "Я всё равно... не понимаю."
62020-63 = "[s3] «Оно поможет вам быть убедительнее.»\n[s4] «Людям нравится, когда всё ясно и легко понять.»"
62020-64 = ""
62020-65 = ""
62020-67 = ""
62020-68 = "[ns5] «Изучение математики может вам в этом помочь.»\n[ns6] «Так что постарайтесь освоить математическое мышление!»"
62020-71 = "[ns7] «А благодаря этому иногда удаётся заставить других выслушать вас.»\n[ns8] «Порой можно даже немного покрасоваться!»"
62020-74 = "Хм..."
62020-75 = "..."
62020-76 = "Это... звучит не так уж плохо."
62020-77 = "..."
62020-78 = ""
62020-80 = ""
62020-81 = "Если бы тогда у меня было это «математическое мышление»..."
62020-82 = "...пришлось бы мне пережить всё то, что произошло?"
62020-83 = "Что произошло?"
62020-84 = ""
