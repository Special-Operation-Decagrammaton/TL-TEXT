[translation]
1003320-1 = "Что скрыть, а что раскрыть"
1003320-2 = "После разговора с Вакамо в MomoTalk у меня появилось дурное предчувствие, поэтому я сразу отправился к ней."
1003320-3 = ""
1003320-7 = ""
1003320-8 = "Сенсей? Я безмерно счастлива вашему неожиданному визиту, но..."
1003320-9 = "Я не хочу быть обузой для Сенсея..."
1003320-10 = "[ns] «Нет, никогда, Вакамо.»"
1003320-12 = "[ns] «Я просто хотел сегодня побыть с тобой.»"
1003320-13 = ""
1003320-15 = ""
1003320-16 = ""
1003320-17 = "Ваша доброта безгранична."
1003320-18 = "Как бы много времени ни прошло, я всё ещё не перестаю удивляться счастливой случайности, благодаря которой мы встретились в тот судьбоносный день."
1003320-19 = "Что вы хотите, чтобы я сделала?"
1003320-20 = ""
1003320-22 = ""
1003320-24 = ""
1003320-25 = "Я готова телом и душой, разумом и решимостью исполнить каждое ваше желание и просьбу."
1003320-26 = "Только скажите слово, и—"
1003320-27 = "[s] «Вакамо.»"
1003320-28 = "...Сегодня я казалась другой?"
1003320-29 = "[s1] «Разве странно, если мне просто хочется твоей компании?»\n[s2] «Сегодня мне просто хочется быть рядом с тобой.»"
1003320-32 = "Ч-что?!"
1003320-33 = ""
1003320-35 = ""
1003320-36 = "Н-Неужели я сейчас нахожусь в прекрасном сне...?!"
1003320-37 = "Ах! А-А-А!"
1003320-38 = "Это не может быть сном, ведь это чувство превосходит даже самые смелые мои надежды! Я счастлива, но я ещё не готова к такой просьбе, Сенсей!"
1003320-39 = ""
1003320-41 = ""
1003320-42 = ""
1003320-43 = ""
1003320-44 = ""
1003320-45 = ""
1003320-46 = "М-Минутку!"
1003320-47 = "[ns] «В-Вакамо?! Подожди!»"
1003320-48 = "Я со всех ног бросился вслед за убегающей Вакамо."
1003320-50 = ""
1003320-52 = ""
1003320-54 = ""
1003320-55 = ""
1003320-58 = ""
1003320-60 = ""
1003320-62 = "П-Почему вы гонитесь за мной?!"
1003320-63 = "[s] «Потому что я не понимаю, зачем ты убегаешь!»"
1003320-64 = "В-Вы не понимаете, Сенсей! В моём нынешнем состоянии...!"
1003320-65 = "Мне просто нужно больше времени, умоляю вас!"
1003320-66 = "[s] «Я лишь прошу твоей компании, Вакамо! И всё!»"
1003320-67 = "Вы снова это сказали?! Из самой глубины души я ощущаю лишь благодарность за ваши чувства! Но я не могу вынести их тяжесть!"
1003320-68 = ""
1003320-70 = ""
1003320-71 = "Я знаю лишь одно — я ещё НЕ ГОТОВА-А-А!"
1003320-72 = "[ns] «Вакамо! Ах?!»"
1003320-76 = "О-О боже!"
1003320-77 = "Наверное, я слишком спешил догнать Вакамо, поэтому споткнулся и самым нелепым образом упал лицом вперёд."
1003320-79 = ""
1003320-82 = ""
1003320-83 = "О боже! О БОЖЕ! Вы ранены? Мой драгоценный Сенсей! Простите! Мне так жаль! Простите, простите, простите, простите! Будто это я сама вас подножкой свалила!"
1003320-84 = "[s] «Со мной всё в порядке! Я сам запнулся о собственные ноги!»"
1003320-85 = "О нет, нет, нет. Сенсей, это... это к-к-к-кровь?!"
1003320-86 = ""
1003320-88 = ""
1003320-91 = "[ns] «Это всего лишь маленькая царапина! Пожалуйста, успокойся!»"
1003320-92 = "Я... не могу... Такая трагедия... не должна была произойти..."
1003320-93 = "Если бы я могла забрать себе всю вашу боль, если бы только я... Нет! Я вообще не должна была допустить, чтобы на теле Сенсея появилась даже малейшая царапина!"
1003320-94 = "Это мой крест. Я искуплю свою вину самой жизнью, Сенсей."
1003320-95 = "[ns] «Так! Давай сделаем дыхательные упражнения, Вакамо!»"
1003320-97 = ""
1003320-99 = ""
1003320-100 = ""
1003320-101 = "[ns] «Тебе лучше?»"
1003320-102 = "Есть..."
1003320-103 = "[s] «На тебе всё ещё маска...»"
1003320-104 = "...!"
1003320-105 = ""
1003320-107 = ""
1003320-108 = ""
1003320-109 = ""
1003320-110 = "Простите, Сенсей..."
1003320-111 = "Подумать только, вы подошли ко мне и попросили остаться рядом с вами навсегда, день за днём... И вот как я реагирую? Мне стыдно до самых кончиков ушей..."
1003320-112 = "Как я могла испортить такой знаменательный момент..."
1003320-113 = "[s5] «Одну из этих вещей я действительно сказал...»\n[s6] «(Не помню, чтобы говорил всё остальное...)»"
1003320-116 = "*хнык* Простите, Сенсей... Это всё моя вина..."
1003320-117 = "[s] «Ну-ну. Больше никаких слёз.»"
1003320-118 = ""
1003320-120 = ""
1003320-121 = ""
1003320-122 = "Я уже твёрдо решила снять маску и с гордостью показать ту часть себя, которую могу открыть только вам!"
1003320-123 = "Но вместо этого я струсила. Я спрятала стыд и смущение за маской, вместо того чтобы честно встретиться с вами лицом к лицу."
1003320-124 = "[s] «Ну конечно это тяжело. Эта маска была с тобой ещё до нашей встречи.»"
1003320-125 = "..."
1003320-126 = ""
1003320-128 = ""
1003320-130 = "Эта маска — одна из самых дорогих мне вещей."
1003320-131 = "Она защищала меня от зла и испытаний этого мира. Но теперь..."
1003320-132 = "[s] «А теперь?»"
1003320-133 = "...!"
1003320-135 = ""
1003320-136 = "Знаете, порой вы бываете очень прямолинейны. Но увы, даже эту вашу сторону я успела полюбить..."
1003320-137 = "Несмотря на все мои недостатки, вы никогда не перестаёте протягивать мне руку. Вы всегда верили в меня."
1003320-138 = ""
1003320-140 = ""
1003320-142 = ""
1003320-143 = "Более того, сегодня вы не попросили ничего, кроме моей компании. Ни задания, ни поручения — только меня..."
1003320-144 = "[s] «Вообще-то я хотел кое-что уточнить насчёт этого...»"
1003320-146 = "Я рассказал ей правду: сегодня я попросил её побыть со мной, потому что беспокоился о ней."
1003320-147 = ""
1003320-148 = "В-Вы переживали, что я попытаюсь выполнить свой долг ценой собственной безопасности?"
1003320-149 = "Я... Я сказала это только в надежде, что между нами произойдёт нечто судьбоносное..."
1003320-150 = "[s7] «Теперь я понимаю, что ты всегда думаешь обо мне.»\n[s8] «Наверное, я просто немного всё переосмыслил.»"
1003320-153 = "Хи-хи-хи. Вы тоже порой бываете довольно глупеньким, Сенсей."
1003320-154 = "Даже то, что вы так обо мне переживали, уже переполняет меня. Я... Ик!"
1003320-155 = "[s] «Раз уж мы здесь, есть что-нибудь, чем ты хочешь заняться вместе со мной, Вакамо?»"
1003320-156 = "!"
1003320-157 = "Понятно... Значит, даже эта случайная встреча была не чем иным, как чудом! Самой судьбой!"
1003320-158 = ""
1003320-160 = ""
1003320-162 = ""
1003320-163 = "Я, Вакамо, последую за вами куда угодно... хоть на край света, хоть в самую пасть ада, и в сердце моём будет лишь радость...! Ведите меня, Сенсей!"
1003320-165 = "[ns] «Да, мэм...»"
1003320-166 = "Остаток дня мы с Вакамо провели более-менее спокойно."
