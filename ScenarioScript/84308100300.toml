84308100300-11 = ""
84308100300-12 = "...Эм."
84308100300-13 = "Можно спросить, что здесь происходит?"
84308100300-14 = ""
84308100300-17 = ""
84308100300-19 = "Я просто хотела спросить..."
84308100300-20 = "...вы те самые люди, которые всё это время были здесь?"
84308100300-21 = ""
84308100300-24 = ""
84308100300-25 = ""
84308100300-26 = "Н-Ну...!"
84308100300-27 = ""
84308100300-29 = ""
84308100300-30 = "...Хм? А?"
84308100300-31 = "Ч-Что происходит? Погоди, Нэру...?"
84308100300-32 = ""
84308100300-34 = ""
84308100300-35 = "П-Почему ты здесь?! И вообще, как ты сюда попала?"
84308100300-36 = "Мне кажется, этот вопрос первой задала я."
84308100300-37 = "Но я примерно понимаю, что здесь происходит. Значит, теми «подозрительными нарушителями», которых мы обнаружили, были вы."
84308100300-38 = "«Подозрительными нарушителями»...?! Мы?!"
84308100300-39 = "Как?! Мы просто сидели у собственного стенда!!"
84308100300-41 = "Мы знали, что будет плохо выглядеть, если нас заметят после закрытия."
84308100300-42 = "Невероятно. Пройти такой сложный данж до самого конца! Сэя, вы и правда Король воров!"
84308100300-44 = "(Король воров...)"
84308100300-45 = "Но не волнуйтесь! Мы пришли сюда, чтобы сделать нашу игру ещё лучше!"
84308100300-46 = "Ещё лучше...?"
84308100300-48 = "Н-Ничего серьёзного... всего пара мелких правок. Но поскольку игру мы уже сдали, изменить её удалённо или у всех на глазах не могли, поэтому..."
84308100300-49 = "...Ага."
84308100300-50 = "Понятно. То есть вы не ПРОНИКЛИ сюда после закрытия, а СПРЯТАЛИСЬ здесь до закрытия."
84308100300-51 = "Мы не взламывались сюда! Мы не злодеи!"
84308100300-52 = "...Всё равно скрытно."
84308100300-53 = "В любом случае я поняла. Учитывая причину, не вижу необходимости вас докладывать или задерживать."
84308100300-54 = "Я вернусь и объясню, что произошло. Простите, если напугала вас."
84308100300-56 = "Не беспокойтесь! Нам довелось поучаствовать в секретном событии Короля воров!"
84308100300-57 = "...Погодите. Когда вы говорите, что «вернётесь и объясните»..."
84308100300-58 = "Технически, Сэя, вы ведь не студент Миллениум и не сотрудник Экспо, верно? Откуда вы вообще знали, что мы здесь?"
84308100300-59 = "И кому вы собираетесь всё объяснять?"
84308100300-60 = ""
84308100300-63 = ""
84308100300-64 = "А, прошу прощения. Я не сказала."
84308100300-65 = "Ну..."
84308100300-66 = ""
84308100300-68 = ""
84308100300-69 = ""
84308100300-70 = "Я поговорю с Микамо Нэру."
84308100300-71 = ""
84308100300-74 = ""
84308100300-76 = "...Э."
84308100300-77 = "Что?"
84308100300-78 = "...Погоди, что?"
84308100300-80 = "Ну что ж, если позволите..."
84308100300-81 = ""
84308100300-83 = ""
84308100300-84 = "П-Погоди. ...Сэя, стой!"
84308100300-85 = "П-Подожди! Подожди!!"
84308100300-87 = "Аааа!!"
84308100300-89 = "Игра окончена-а-а!!"
