[translation]
1301402-1 = "Купальники и защита"
1301402-4 = "Услышав от Рэнгэ, что она собирается в горы в купальнике, я поспешил встретиться с ней."
1301402-7 = ""
1301402-8 = "О, Наставник? Вы рано."
1301402-9 = "[s] «А. Ты хотела пойти к водопаду.»"
1301402-10 = "А зачем ещё мне надевать купальник?"
1301402-11 = "У меня всё-таки есть хоть немного здравого смысла!"
1301402-12 = "[s] «Я правда думал, что ты собираешься подниматься на гору в купальнике.»"
1301402-13 = "Э-Эм... Ну..."
1301402-14 = "Технически... вроде как собиралась."
1301402-15 = "[s] «Серьёзно?!»"
1301402-16 = "Я... прямо сейчас ношу купальник под формой."
1301402-17 = "[s] «...!»"
1301402-18 = ""
1301402-20 = ""
1301402-21 = ""
1301402-28 = ""
1301402-29 = "Ч-Что думаете? Наверное, такие неловкие вещи тоже часть чьей-то юности..."
1301402-30 = "А вы случайно не надели купальник под одежду, Наставник?"
1301402-31 = "[s1] «...Да, надел.»\n[s2] «На мне его нет, но я взял с собой!»"
1301402-32 = "Ха-ха! Мы и правда мыслим одинаково, Наставник!"
1301402-33 = "Фуфу. Всё-таки я свалила это на вас совершенно внезапно."
1301402-34 = ""
1301402-36 = ""
1301402-37 = "Подготовка завершена! Начинаем тренировку в купальниках!"
1301402-38 = "Эпизод у водопада с наставником и студентом!"
1301402-39 = ""
1301402-41 = ""
1301402-44 = "Мы с Рэнгэ вместе встали под водопад."
1301402-47 = ""
1301402-48 = "Ого, вот это бодрит! Как вы там, Наставник?!"
1301402-49 = "[s] «Х-Х-Холодно! Мозг замерзает!»"
1301402-50 = "Фуфу. Вы преувеличиваете!"
1301402-51 = ""
1301402-53 = ""
1301402-54 = "Разве вам не кажется, что купальник повышает защиту?"
1301402-55 = "А. Эм. Как бы объяснить?"
1301402-56 = "Мне кажется, что я должна вести себя в соответствии с одеждой, поэтому разум становится собраннее."
1301402-57 = "То есть повышается не физическая защита, а ментальная..."
1301402-58 = "Понимаете, о чём я, Наставник?"
1301402-59 = "[s3] «Этот водопад слишком сильный...»\n[s4] «К-Купальник может слететь...!»"
1301402-62 = "Вот именно! Поэтому моя ментальная защита повышается!"
1301402-63 = "Нужно держать боевой дух, иначе купальник слетит."
1301402-64 = "[s] «Какая между этим вообще связь?!»"
1301402-65 = "Смотрите. Моё обострённое состояние разума обеспечивает мою безопасность, а у вас, Наставник..."
1301402-66 = ""
1301402-68 = ""
1301402-69 = ""
1301402-70 = "...?!"
1301402-71 = "[s5] «...Мне кажется или внезапно стало прохладнее?»\n[s6] «Куда делся мой купальник...?»"
1301402-72 = ""
1301402-73 = ""
1301402-75 = ""
1301402-77 = "Н-Не двигайтесь ни на сантиметр! Я его найду!"
1301402-78 = ""
1301402-82 = "Некоторое время спустя..."
1301402-86 = "Ага! Нашла! Держите!"
1301402-87 = "[s7] «С-Спасибо, что нашла...!»\n[s8] «Пожалуйста, перестань им размахивать!»"
1301402-88 = ""
1301402-89 = ""
1301402-91 = "Я закрыла глаза, так что быстрее забирайте!"
1301402-92 = "Обещаю, я ничего не видела."
1301402-93 = "Фуфу, весело. Думаю, это тоже часть «юности»."
1301402-94 = ""
1301402-98 = "[ns] «Стой! Полностью отвернись! Прямо сейчас!»"
1301402-99 = ""
1301402-101 = ""
1301402-102 = "А, простите! Хи-хи!"
1301402-104 = "...После истории с купальником я был гораздо сосредоточеннее до конца нашей тренировки под водопадом."
