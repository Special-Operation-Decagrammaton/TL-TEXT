[translation]
1601606-1 = "Оправдания друг для друга"
1601606-2 = "Я закончил работу пораньше и отправился в кафе, где мы договорились встретиться с Минэ."
1601606-3 = ""
1601606-6 = "Вы пришли, Сенсей."
1601606-7 = ""
1601606-10 = ""
1601606-11 = "Сегодня утром я уже приветствовала вас через MomoTalk. Но сделаю это ещё раз. Здравствуйте."
1601606-12 = "[s1] «Ты отлично выглядишь. И, похоже, в хорошем настроении.»\n[s2] «Не нужно быть такой официальной.»"
1601606-13 = ""
1601606-14 = ""
1601606-16 = ""
1601606-17 = "Н-Ну... То есть..."
1601606-18 = ""
1601606-20 = ""
1601606-21 = "*вздыхает*"
1601606-22 = "Вы правы. Да."
1601606-23 = "Этот костюм очень милый. Чем дольше я на него смотрю, тем сильнее он мне нравится. Можно даже сказать, что я... привязалась к нему."
1601606-24 = "Меня пробирает холодок, когда я вспоминаю, что раньше собиралась от него избавиться."
1601606-25 = "Именно благодаря вам я смогла сохранить этот драгоценный костюм. Моей благодарности вам невозможно выразить полностью."
1601606-26 = "Вы даже зашли настолько далеко, что нашли для меня подходящее оправдание, чтобы я могла продолжать его носить. Вы сняли с меня огромный груз."
1601606-27 = "[s3] «Не переживай. Для меня то же самое.»\n[s4] «Благодаря этому у меня тоже появился хороший повод отдохнуть.»"
1601606-30 = "...Вот как? Хи-хи. Мне очень приятно это слышать."
1601606-31 = "Конечно, я понимаю, что вы говорите это из заботы. Однако вместо того, чтобы постоянно только принимать вашу заботу..."
1601606-32 = "...мне и правда приятно самой дать вам хороший повод."
1601606-33 = "Но..."
1601606-34 = "...Мм."
1601606-35 = ""
1601606-38 = "[ns] «Минэ?»"
1601606-39 = ""
1601606-41 = ""
1601606-42 = "Н-Ничего. Просто..."
1601606-43 = ""
1601606-45 = ""
1601606-46 = "Об этом трудно говорить. Теперь, когда я признала, что для меня значит этот костюм, мне уже не скрыться от этого смущения."
1601606-47 = "Карнавал закончился. И сегодня у меня нет ни концерта, ни фотосессии."
1601606-48 = "Поэтому я невольно думаю... не кажется ли вам, возможно... что я выгляжу странно?"
1601606-49 = "Не думаете ли вы: «Она и правда так хочет носить нечто подобное?» Или как мне быть, если вы видите во мне очередного проблемного студента, с которой вам просто приходится возиться?"
1601606-50 = ""
1601606-52 = ""
1601606-53 = "Хм?"
1601606-54 = "У-У вас нет таких мыслей? Н-Но..."
1601606-56 = "[ns5] «Ты милая девочка в милой одежде.»\n[ns6] «Я скорее переживаю, что начну слишком часто тебя звать.»"
1601606-57 = ""
1601606-58 = ""
1601606-60 = ""
1601606-61 = "Э-Это...! Что вы такое говорите...?!"
1601606-62 = "Вы слишком уж щедры на комплименты!"
1601606-63 = "...Как я могла...?"
1601606-64 = ""
1601606-66 = ""
1601606-67 = ""
1601606-68 = "Ха-ха! Ха-ха-ха!"
1601606-69 = "[s7] «...Минэ?»\n[s8] «Почему ты вдруг смеёшься?»"
1601606-70 = ""
1601606-71 = ""
1601606-73 = ""
1601606-74 = "Ах. Прошу прощения. Просто довольно забавно слышать от самой себя подобные вещи."
1601606-75 = "Разговоры с вами, похоже, всегда так или иначе приходят к чему-то подобному."
1601606-76 = "Да. И раз уж мы пришли к такому выводу, я искренне сомневаюсь, что вы хотите, чтобы я и дальше настаивала на этом вопросе."
1601606-77 = "Поэтому, раз уж мы встретились здесь..."
1601606-78 = ""
1601606-80 = ""
1601606-81 = "Сегодня я с огромным удовольствием заберу всё ваше время себе, Сенсей."
1601606-82 = "Я хорошо знаю этот район. Сегодня вы ведь должны отдыхать, не так ли?"
1601606-83 = ""
1601606-85 = ""
1601606-87 = ""
1601606-88 = "Я вас сопровожу, Сенсей."
1601606-89 = "Выдвигаемся. Сюда..."
1601606-96 = "Я последовал за Минэ к ближайшей набережной."
1601606-97 = ""
1601606-100 = "Возможно, из-за хорошей погоды людей там было довольно много."
1601606-101 = ""
1601606-103 = ""
1601606-104 = "Хм. Здесь гораздо люднее, чем я ожидала. Это несколько противоречит моей задумке..."
1601606-105 = "Я надеялась обеспечить вам тихий и просторный отдых..."
1601606-106 = ""
1601606-108 = ""
1601606-109 = "...Ах."
1601606-110 = "Мне пришла в голову отличная идея. Сюда, Сенсей."
1601606-111 = ""
1601606-113 = ""
1601606-117 = "[ns9] «...Это что?»\n[ns10] «Лодка-лебедь...?»"
1601606-120 = "...Да. Пожалуйста, садитесь, Сенсей."
1601606-121 = "Здесь вы сможете спокойно отдохнуть в уединении."
1601606-122 = ""
1601606-131 = "Ну же, Сенсей. Здесь может немного качать, так что возьмите меня за руку."
1601606-132 = "Когда устроитесь поудобнее, воспользуйтесь возможностью отпустить все тревоги. Можете даже вздремнуть. Если потребуется, я могу спеть вам колыбельную."
1601606-133 = ""
1601606-136 = "Хи-хи. Возможно... прогулка получится долгой."
1601606-137 = "Да. На самом деле я..."
1601606-138 = ""
1601606-141 = ""
1601606-142 = "...хочу, чтобы так и было."
1601606-144 = "После этого я сел в лодку-лебедь и провёл время с Минэ на озере."
1601606-148 = "От покачивания воды и тихого пения Минэ я в итоге совершенно уснул."
