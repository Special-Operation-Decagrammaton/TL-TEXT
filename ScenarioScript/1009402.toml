[translation]
1009402-1 = "Чувства горничной!"
1009402-2 = "Когда Момои позвонила мне, она звучала уверенно, но..."
1009402-3 = "...её слова немного меня встревожили, поэтому я пришёл в Шале чуть раньше обычного."
1009402-4 = ""
1009402-8 = "[ns] «Момои? Я пришёл...»"
1009402-12 = "― [log=모모이 메이드]Хи-хи... Закуски такие вкусные...[/log][wa:3570]"
1009402-13 = "― [log=모모이 메이드]Солнечный свет тёплый... а диван такой мягкий...[/log][wa:5020]"
1009402-16 = "[ns] «Момои? Ты разве не должна была убираться?»"
1009402-17 = "― [log=모모이 메이드]Хм-м... Убираться...?[/log][wa:1860]"
1009402-18 = "― [log=모모이 메이드]Сделаю... после того как съем это... и немного отдохну...[/log][wa:6170]"
1009402-21 = "― [log=모모이 메이드]А? Сенсей?[/log][wa:2690]"
1009402-22 = "― [log=모모이 메이드]А, понятно. Это... всё ещё сон.[/log][wa:5000]"
1009402-25 = "― [log=모모이 메이드]Ого, я и во сне могу с вами встретиться... Как здорово...[/log][wa:3770]"
1009402-26 = "― [log=모모이 메이드]Может, сегодня случится что-нибудь интересное... Хи-хи...[/log][wa:6600]"
1009402-29 = "― [log=모모이 메이드]*зевок*... Ура... Я получила дополнительную жизнь...[/log][wa:4280]"
1009402-32 = "[ns] «Уф...»"
1009402-33 = "Я попытался разбудить Момои, потряся её..."
1009402-34 = "...но потом захотелось пошутить, и вместо этого я слегка щёлкнул её."
1009402-35 = ""
1009402-37 = ""
1009402-38 = ""
1009402-39 = ""
1009402-40 = "Э, что?"
1009402-41 = "Что вы делаете, Сенсей?"
1009402-42 = ""
1009402-44 = ""
1009402-45 = "А...?"
1009402-46 = "[ns] «Я... думал, ты собиралась убираться.»"
1009402-47 = "Нет, это... тут... Ладно, в общем...!"
1009402-48 = "Т-Такое могло случиться с кем угодно. Сначала хочу сказать именно это."
1009402-49 = ""
1009402-51 = ""
1009402-52 = ""
1009402-54 = "Я собиралась начать с того, чтобы привести диван в порядок."
1009402-55 = "Но как только начала, немного проголодалась."
1009402-56 = "Тогда я огляделась и заметила закуски."
1009402-57 = "Я хотела быстренько перекусить и вернуться к работе, но пока ела, меня начало клонить в сон."
1009402-58 = "И я знала, что нужно закончить работу, но прямо рядом стоял такой мягкий, манящий диван!"
1009402-59 = "Скажите, вы бы сами не захотели прилечь на минутку в такой ситуации?"
1009402-60 = "[ns] «Продолжай, я слушаю.»"
1009402-61 = "Правда? Вы понимаете! Так вот, как я и говорила..."
1009402-62 = ""
1009402-64 = ""
1009402-65 = "Я собиралась прилечь всего на минутку, но диван оказался невероятно мягким!"
1009402-66 = "Так что виноват диван! И вы тоже, Сенсей!"
1009402-67 = "[s] «Стоп, а меня-то зачем сюда приплетать?»"
1009402-68 = "Вы поставили здесь этот невероятно удобный диван и буквально заманили меня! И вообще..."
1009402-69 = "Мягкий диван — как волшебный зверь, как тёплая кровать... только кровать ещё соблазняет, словно демон!"
1009402-70 = "Вот почему утром так трудно вставать. И поэтому мы все постоянно прилипает к дивану и листаем телефоны."
1009402-71 = "Т-Так что это вроде как несчастный случай! Просто... загадочный, неконтролируемый несчастный случай!"
1009402-72 = "[s] «Наверное, этого и стоило ожидать.»"
1009402-73 = "В любом случае!"
1009402-75 = "Отчаянное «объяснение» Момои продолжалось ещё довольно долго."
1009402-77 = "[ns] «Ты закончила свой рассказ?»"
1009402-78 = "Ага."
1009402-79 = "И... простите, Сенсей..."
1009402-80 = "[s1] «Ладно, ладно...»\n[s2] «Ну что, тогда уберёмся вместе.»"
1009402-83 = "Стоп, вы хотите убираться вместе со мной? Правда?"
1009402-84 = "Разве не для этого я сюда и пришёл — помочь тебе? Так ведь?"
1009402-85 = "Но... знаете, если бы вы с самого начала поддерживали здесь порядок, нам бы не пришлось всё это убирать, да?"
1009402-86 = "Знаю, бесстыдно. Ничего не могу с собой поделать. Уже сама не понимаю, к чему веду."
1009402-87 = "[s3] «Конечно, ты знаешь, в чём настоящая проблема.»\n[s4] «Никто из нас не любит убираться!»"
1009402-90 = "Точно! Прямо в точку, Сенсей!"
1009402-91 = ""
1009402-93 = ""
1009402-94 = ""
1009402-95 = ""
1009402-96 = ""
1009402-97 = "...В-Вы хотите, чтобы я осталась и взяла метлу? Угх...!"
1009402-98 = ""
1009402-100 = "Ладно, ладно, сделаю. Угх, так вот каково быть горничной?"
1009402-102 = "И мы с Момои начали Великую уборочную миссию Шале..."
1009402-104 = ""
1009402-105 = ""
1009402-106 = ""
1009402-107 = ""
1009402-108 = ""
1009402-109 = ""
1009402-110 = ""
1009402-111 = ""
1009402-112 = ""
1009402-113 = ""
1009402-114 = ""
1009402-118 = "...Мы сделали это!"
1009402-119 = "Ух ты! Так вот как это делается! Правда, Сенсей?"
1009402-120 = "Я хорошо справилась? Хи-хи, ну, настоящее испытание только начинается."
1009402-121 = "[s] «Это... немного тревожно звучит.»"
1009402-122 = "Хи-хи-хи... Интуиция у вас улучшилась, Сенсей."
1009402-123 = "Если подумать, горничная — это просто наёмный работник, верно?"
1009402-124 = "Работа, где ты занимаешься домашними делами и поручениями для других, а они тебе платят, да?"
1009402-125 = "[s] «Точно...»"
1009402-126 = "Так что как мой работодатель вы теперь обязаны заплатить своему сотруднику — мне!"
1009402-127 = "[s] «Это нечестно! Я ведь тоже помогал убираться!»"
1009402-128 = "Да, но это ваше место! Вы и ДОЛЖНЫ его убирать!"
1009402-129 = "[s] «Знаешь, Момои, когда это говоришь ты, звучит втройне несправедливо!»"
1009402-130 = "В любом случае, вы обязаны выплатить мне дневное вознаграждение!"
1009402-131 = "Теперь вы думаете, какую оплату я принимаю."
1009402-132 = "Хи-хи-хи... Ну, всё просто..."
1009402-133 = ""
1009402-135 = ""
1009402-136 = "Просто проведите со мной весь день!"
1009402-137 = "Думаете, этого достаточно? Может, не знаете, чем заняться ради веселья? Я подумала, что у вас могут быть с этим проблемы..."
1009402-138 = "...поэтому принесла с собой кучу игровых приставок!"
1009402-140 = "В итоге в свежевычищенной комнате мы с Момои отлично провели время за играми."
1009402-141 = "Момои всё время садилась мне на колени и пыталась закрыть обзор, поэтому мне постоянно приходилось менять положение."
1009402-142 = "Но потом..."
1009402-143 = ""
1009402-144 = "Слышали? Этот слух про Сенсея из Шале...?"
1009402-145 = "Да, боже мой. Я слышала, что Сенсей наряжает студентов в костюмы горничных! А потом заставляет их делать всю работу по дому!"
1009402-147 = "Я знала, что это ТОЧНО плохо скажется на моей репутации..."
