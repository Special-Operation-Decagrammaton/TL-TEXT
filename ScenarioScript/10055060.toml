[translation]
10055060-1 = "Episode 6: The Pandemonium of the Caribbean"
10055060-10 = "Yo-ho-ho! You all look quite fitting!"
10055060-11 = "Sensei, I welcome you as a new member of this Pandemonium Ship!"
10055060-12 = "[s1] \"Huh?\"\n[s2] \"It feels like someone is missing...?\""
10055060-15 = "Ah, Iroha-senpai isn't here!"
10055060-16 = "Ibuki will go find her!"
10055060-20 = "Ugh... why am I wearing something like this..."
10055060-21 = "Iroha-senpai, is it hard to put on? Does Ibuki need to help?"
10055060-22 = "Ah, no, I'm fine... I'm just trying to calm my nerves, so to speak..."
10055060-29 = "Please don't laugh."
10055060-30 = "[s3] \"I'm not laughing!\"\n[s4] \"It's a pirate!!\""
10055060-39 = "[ns5] \"Whoa!?\"\n[ns6] \"Please don't kick the wall in silence!?\""
10055060-43 = "This is the absolute worst... please don't look for me for a while."
10055060-44 = "I'm so embarrassed I could die."
10055060-48 = "Wow! Iroha-senpai is matching too!"
10055060-49 = "Ibuki is so happy!"
10055060-50 = "...Ibuki."
10055060-51 = "It can't be helped, I suppose I'll try my best for a little while."
10055060-55 = "[ns7] \"Eh...\"\n[ns8] \"Even though she was kicking the wall so much...\""
10055060-59 = "Why are we doing cleaning...?"
10055060-60 = "Have you ever heard of a sparkling clean ghost ship?"
10055060-62 = "You there!! Too much chatter!"
10055060-66 = "If you have time to gossip, get to work!"
10055060-67 = "Make this ship as good as new, make it sparkle!"
10055060-68 = "Y-yes, ma'am!"
10055060-72 = "It's \"Captain\"!"
10055060-73 = "Yes, Captain!"
10055060-77 = "...So, Makoto-chan. What did you do this time?"
10055060-78 = "Hm?"
10055060-79 = "About the pirates. #nHow did you make them your subordinates?"
10055060-80 = "Ah, that!"
10055060-82 = "Well, you see..."
10055060-84 = "One hour ago..."
10055060-88 = "Huff, huff..."
10055060-89 = "Persistent fools! How long do you intend to keep chasing us!"
10055060-93 = "Haa, haa... I'll just say this, but we're the ones who are the intruders here...!?"
10055060-94 = "Over there! I hear voices coming from that way!"
10055060-95 = "Damn!"
10055060-96 = "This is no time to be complaining!"
10055060-97 = "We're running into that room!"
10055060-104 = "What kind of room is this?"
10055060-105 = "And isn't this a dead end! If they find us, it's over!?"
10055060-106 = "We just have to make sure they don't find us!"
10055060-107 = "What are you saying, you idiot..."
10055060-108 = "Trust me! There's no problem!"
10055060-109 = "...Trust you?"
10055060-110 = "Isn't everything like this because I trusted you in the first place!"
10055060-111 = "In the first place, Makoto-senpai boarded this ship without thinking at all...!!"
10055060-112 = "..."
10055060-117 = "...Ugh."
10055060-118 = "...Ah."
10055060-119 = "I'm sorry, Ibuki. #nMy voice was too loud."
10055060-120 = "I didn't mean to scare you."
10055060-124 = "But in this situation... what should I do."
10055060-125 = "At the very least, I need to find a way to get Ibuki out safely..."
10055060-129 = "..."
10055060-133 = "...!? Makoto-senpai, where are you going!?"
10055060-134 = "You slow-witted ghosts! I am right here!"
10055060-135 = "Come and chase me if you can!!"
10055060-136 = "Over there! Chase her!!"
10055060-144 = "...Makoto-senpai?"
10055060-146 = "...I see."
10055060-147 = "No, that's not an explanation at all, you know?"
10055060-148 = "At this rate, isn't the answer that Makoto-chan becomes a ghost too?"
10055060-149 = "...Don't tell me, you've already become a ghost!?"
10055060-150 = "No, even for me, the great Makoto, that would be..."
10055060-151 = "Well... in short, it's all about spirit."
10055060-152 = "Spirit...?"
10055060-153 = "Ah, that's what Makoto-senpai always says!"
10055060-154 = "You always say that even a cat can become a lion if it has enough spirit!"
10055060-155 = "Hm? That's a fact, after all."
10055060-159 = "And, as for what happened after that—"
10055060-162 = "............"
10055060-167 = "Found you! Over there!"
10055060-168 = "We've cornered you! There's nowhere left to run—"
10055060-170 = "You..."
10055060-177 = "You..."
10055060-178 = "You absolute fools!!"
10055060-184 = "If you died and became ghosts, surely there's a story behind it, right?"
10055060-185 = "Someone who possesses a ship this massive, instead of settling their grudges, you're just bullying a child!?"
10055060-187 = "Ah, no... we were just..."
10055060-189 = "Quiet! I don't want to hear any excuses!"
10055060-190 = "It's useless to try and hide it. #nI have discovered it..."
10055060-191 = "What is drawn on this box is undoubtedly the Gehenna mark!"
10055060-192 = "In other words, you are Gehenna students... Gehenna ghosts, aren't you?"
10055060-193 = "I might forgive other schools, but I will not tolerate the pathetic behavior of Gehenna ghosts!"
10055060-198 = "No, you suddenly charged in and said all that..."
10055060-199 = "What are we supposed to do..."
10055060-201 = "But I understand your feelings!"
10055060-202 = "Living as ghost pirates in the open ocean, far away from our beloved Gehenna, must have been painful."
10055060-203 = "Your body and soul must have been worn down, feeling like everything is so far away... you must have been driven by a vague sense of anxiety."
10055060-204 = "However, that happened because you lacked a leader!"
10055060-205 = "With an excellent leader to guide the way and present a vision, the situation will undoubtedly improve!"
10055060-207 = "Leader...? Vision...?"
10055060-209 = "There's nothing difficult about it!"
10055060-210 = "You're lucky. #nBefore you stands the greatest leader in history!"
10055060-211 = "You only need to follow one rule—"
10055060-215 = "From now on, you shall call me—\"Captain Makoto\"!!"
10055060-218 = "..."
10055060-219 = "..."
10055060-220 = "No, that's a lie—"
10055060-222 = "Wow! That's amazing!!"
10055060-227 = "As expected of Makoto-senpai! It's such a shame I wasn't there to see it! #nI wanted to take a picture..."
10055060-228 = "Oh~ Makoto-senpai... no, Captain Makoto, you're so cool!"
10055060-229 = "Yo-ho-ho! Keep praising me!"
10055060-234 = "[ns] \"Iroha...?\""
10055060-235 = "I understand what you're trying to say."
10055060-236 = "But when I went to help, she was already in that state..."
10055060-237 = "...Hm?"
10055060-238 = "What's wrong?"
10055060-239 = "No, it's nothing."
10055060-240 = "Anyway, looking at the facts, it's true that the pirates are following Makoto-chan."
10055060-241 = "So even if there was some exaggeration, it's not a lie."
10055060-243 = "Even so, isn't it all too convenient?"
10055060-244 = "By coincidence, you met a ghost ship in the open ocean, and by coincidence, the crew were Gehenna students?"
10055060-245 = "Ah... it seems you're misunderstanding from that point."
10055060-246 = "Eh?"
10055060-247 = "This ship is definitely from Gehenna. The pirates are likely Gehenna students too."
10055060-248 = "However..."
10055060-249 = "However?"
10055060-253 = "...No, this is just a guess."
10055060-254 = "............"
10055060-256 = "(And time passed...)"
10055060-259 = "..."
10055060-260 = "..."
10055060-261 = "At first, I didn't understand why we were told to clean..."
10055060-262 = "But seeing the ship all cleaned up..."
10055060-263 = "...It feels so good!"
10055060-265 = "Yo-ho-ho! Wonderful, everyone!"
10055060-266 = "Captain!"
10055060-267 = "The dirty ship was a projection of your defeatist attitude. #nBut look at it now!"
10055060-268 = "Who would call this ship a shabby ghost ship now!"
10055060-269 = "You are already members of a magnificent pirate ship!"
10055060-271 = "Ah... yes, I feel like I've been reborn."
10055060-272 = "Until a little while ago, I couldn't even imagine this..."
10055060-274 = "Not yet!!"
10055060-281 = "The change you have achieved is wonderful!"
10055060-282 = "But even this grand and glittering change will be the smallest success in your lives from here on out!"
10055060-283 = "If you stay under this Captain Makoto, you will surely feel that way! Yo-ho-ho!"
10055060-284 = "Captain! Makoto! Captain! Makoto!"
10055060-289 = "...Honestly, she sure can talk."
10055060-294 = "Ah, it's all cleaned up now. #nSo, Makoto-chan. What do you intend to do now?"
10055060-295 = "Hm?"
10055060-296 = "You've achieved your goal of taking over this ship, right?"
10055060-300 = "Naturally."
10055060-304 = "There is only one thing a true pirate does!"
10055060-306 = "We shall plunder all the gold and treasures in Kivotos! Yo-ho-ho!"
10055060-311 = "...Excuse me?"
10055060-312 = "Aren't we going back to land..."
10055060-313 = "Sigh... this is a case of being completely swallowed by the concept. #nI have a feeling she'll be like that for a while."
10055060-314 = "[s9] \"Isn't that dangerous?\"\n[s10] \"To be pirates...\""
10055060-317 = "No, please don't take it seriously."
10055060-318 = "You saw the equipment on this ship, right? It only looked strong, but in reality, it just had junk cannons."
10055060-319 = "I don't think there's any ship in Kivotos that would be defeated by such a wreck. #nThere's less gunpowder here than in a convenience store."
10055060-320 = "[s11] \"Indeed.\"\n[s12] \"That's right.\""
10055060-323 = "Also, I caught a glimpse of it while cleaning earlier, but the cannons on this ship..."
10055060-330 = "W-what is it!?"
10055060-331 = "What's going on! Where are the bullets coming from!?"
10055060-332 = "Captain Makoto! We're under attack!"
10055060-333 = "Under attack...? We're in the middle of the ocean, who would attack us!?"
10055060-334 = "An enemy ship is visible near the horizon!"
10055060-339 = "Are you serious...? No, you're lying..."
10055060-340 = "It didn't come when we were waiting for it so much, but now?"
10055060-343 = "The enemy ship is the Trident!"
10055060-345 = "It's the Discipline Committee from Odyssey Maritime School!"