10055060-179 = ""
10055060-182 = ""
10055060-184 = "Вам, призракам, должно быть, многое довелось пережить при жизни, раз вы закончили вот так."
10055060-185 = "С таким великолепным огромным кораблём вы могли бы свести счёты с обидчиками из прошлого! А вместо этого занимаетесь мелкими пакостями вроде запугивания детей?!"
10055060-187 = "Н-нет... Мы..."
10055060-189 = "Молчать! Я пришла не за вашими оправданиями!"
10055060-190 = "Знайте, что перед вами Великая Макото, от взора которой ничто не ускользнёт даже в пылу боя!"
10055060-191 = "И я заметила, что на этих ящиках красуется герб Геенны!"
10055060-192 = "Стало быть, это корабль Геенны, а вы студенты Геенны... вернее, призраки Геенны!"
10055060-193 = "Вы не какие-то там обычные призраки! Вы призраки Геенны, и я не позволю нашим призракам вести себя столь жалко!"
10055060-194 = ""
10055060-197 = ""
10055060-198 = "Погоди. Ты просто вваливаешься сюда и начинаешь на нас орать..."
