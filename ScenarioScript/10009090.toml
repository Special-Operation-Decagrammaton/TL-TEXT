[translation]
10009090-1 = "Послесловие;Меры безопасности"
10009090-3 = "Разумеется, главный принцип безопасности — ограничить доступ."
10009090-4 = ""
10009090-7 = ""
10009090-8 = "Но чтобы создать систему, эффективно работающую во многих условиях, нужно обеспечить три свойства: конфиденциальность, целостность и доступность."
10009090-9 = "Конфиденциальность означает, что системой могут пользоваться только авторизованные лица. Целостность — что система защищена от ложной информации. А доступность — что авторизованный пользователь получает запрошенную информацию."
10009090-10 = "Говорят, эти три понятия были известны ещё древним цивилизациям. Разве не интересно?"
10009090-11 = "В любом случае, первое, что приходит на ум при слове «целостность» — это шифрование."
10009090-12 = "Есть три стандартных размера ключа шифрования: 128, 192 и 256 бит."
10009090-13 = "Чтобы улучшить нашу политику безопасности, отныне будем использовать 256-битное шифрование как стандарт."
10009090-14 = "Наш алгоритм безопасности можно условно разделить на четыре этапа."
10009090-15 = ""
10009090-21 = "На первом этапе берём один 256-битный ключ и создаём несколько 128-битных раундовых ключей, которые будут использоваться в последующих раундах."
10009090-22 = "Далее — раунд 0. Берём первый раундовый ключ и один раз прогоняем его через алгоритм безопасности."
10009090-23 = "Процедура для раундов с 1-го по 13-й одинакова. Здесь мы активируем четыре этапа протокола безопасности по стандарту из четырёх строк. Повторяем это 13 раз."
10009090-24 = "Наконец, раунд 14... Мы ещё раз используем все ключи безопасности и завершаем шифрование."
10009090-25 = ""
10009090-26 = "Говорят, в противостоянии того, кто пытается взломать систему, и того, кто пытается его остановить, обычно побеждает взломщик."
10009090-27 = "Но это утверждение устарело. Благодаря недавнему развитию технологий и науки безопасности нам удалось почти уравнять возможности обеих сторон."
10009090-28 = "Чихиро продолжала говорить, пока взгляды слушателей становились всё более стеклянными."
10009090-29 = "Эм... Мы всего лишь хотели узнать, как открыть дверь... И всё."
10009090-30 = "Хм? Открыть её невозможно, если только не сорвать всю дверь с петель!"
10009090-31 = ""
10009090-33 = ""
10009090-35 = "..."
10009090-36 = "Хм... Значит, объект всё ещё довольно старый. Какая прелесть!"
10009090-37 = ""
10009090-39 = ""
10009090-40 = ""
10009090-41 = "Систему немного обновили. Электронный замок на двери новый. Но петли всё ещё разболтаны."
10009090-42 = "Хи-хи-хи... Как глупо с их стороны думать, что они смогут меня удержать!"
10009090-43 = ""
10009090-48 = ""
10009090-49 = "Раз уж мы сорвали всю дверь с петель, может, уйдём отсюда?"
10009090-54 = ""
10009090-55 = "Хи-хи-хи..."
10009090-56 = "На этот раз тебе не уйти!"
10009090-57 = ""
