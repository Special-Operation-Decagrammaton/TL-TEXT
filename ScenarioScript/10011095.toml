[translation]
10011095-2 = ""
10011095-7 = ""
10011095-8 = "Гд... Где верх, а где низ?"
10011095-9 = "Кажется, мне теперь нужен психолог."
10011095-10 = "Аргх..."
10011095-11 = ""
10011095-13 = ""
10011095-15 = "С-Сенсей... пожалуйста... Найдите Ибуки..."
10011095-16 = ""
10011095-18 = ""
10011095-23 = ""
10011095-24 = "[ns] «Ух... Ты в порядке, Мичиру? Можешь встать?»"
10011095-25 = "Более-менее... Наверное."
10011095-26 = "[s] «Остались только мы. Что ты хочешь делать?»"
10011095-27 = "Что я хочу делать...?"
10011095-28 = ""
10011095-31 = ""
10011095-33 = ""
10011095-35 = ""
10011095-37 = ""
10011095-38 = "Разве не очевидно? Мы выполним своё обещание."
10011095-39 = ""
10011095-41 = ""
10011095-44 = ""
10011095-45 = "Мы здесь! Где президент Клуба Инь-Ян?"
10011095-46 = "Где она?!"
10011095-47 = ""
10011095-50 = ""
10011095-51 = "Бвахаха! Все так стараются!"
10011095-52 = "Её тут вообще никогда не было?!"
10011095-53 = "Мы наконец приближаемся к финалу этого захватывающего представления! Кто же будет смеяться последним?"
10011095-54 = ""
10011095-56 = ""
10011095-58 = "*тяжело дышит* *тяжело дышит*"
10011095-59 = "*глубокий вдох*"
10011095-60 = "Мы пришли спасти похищенную принцессу!"
10011095-61 = ""
10011095-63 = ""
10011095-65 = "(Я, конечно, могу говорить громкие слова, но...)"
10011095-66 = "[s] «Мы наконец догнали их, Мичиру. Осталось только спасти её.»"
10011095-67 = "(Достопочтенный Сенсей...! Вы вообще слышите, что сейчас говорите?)"
10011095-68 = "(Вы правда в меня верите?)"
10011095-69 = "(Смогу ли я спасти принцессу и само представление?)"
10011095-71 = "Стоять! Ни шагу дальше!"
10011095-72 = ""
10011095-74 = ""
10011095-75 = ""
10011095-76 = "Иначе я сброшу вашу драгоценную принцессу прямо вниз!"
10011095-77 = ""
10011095-79 = ""
10011095-80 = "Вот это поворот! События приняли жестокий оборот."
10011095-81 = "Даже для сценария это уже перебор!"
10011095-82 = "Плевать мне на ваш дурацкий сценарий! Президент Клуба Инь-Ян всё это время сводила меня с ума своими комментариями!"
10011095-84 = "(Да уж, так ничего не выйдет. Я не смогу одновременно спасти её и сражаться с настоящими преступниками!)"
10011095-85 = "(Я вообще зашла так далеко только потому, что все меня поддерживали, пока я слепо рвалась вперёд.)"
10011095-86 = "(Я столько хвасталась, что спасу принцессу, а у меня даже никакого плана нет!)"
10011095-87 = "(Хотя все меня поддерживали... Хотя Цукуё заступилась за меня... Я стою у самой финишной черты и не могу её пересечь!)"
10011095-89 = ""
10011095-90 = "Хи-хи. Наш последний участник испугался? Мы все затаили дыхание и ждём, что же она скажет."
10011095-92 = "(Пожалуйста, хватит так давить! Один неверный шаг — и миссия провалена!)"
10011095-93 = "(Ноги дрожат. Сердце колотится. Я не знаю, что делать!)"
10011095-94 = "(Думай об Ибуки! Она плакала даже из-за отключения света. Наверняка ей сейчас ужасно страшно.)"
10011095-95 = "Это та девушка-ниндзя?"
10011095-96 = "Ибуки!"
10011095-97 = "Привет-привет! Да, это Ибуки! Ибуки хорошая девочка и всё это время тебя ждала!"
10011095-98 = "Ты не плачешь? Ни слезинки?"
10011095-99 = "Ты о чём?"
10011095-100 = "Ты ведь изображаешь похищенную принцессу... Я боялась, что тебе будет страшно."
10011095-101 = "Ибуки совсем не боялась!"
10011095-102 = ""
10011095-107 = "Потому что ты обещала, что ниндзя придут и спасут меня!"
10011095-108 = "О!"
10011095-110 = "Мы обещали защитить её. Спасти, если ей понадобится помощь, чего бы это ни стоило."
10011095-112 = ""
10011095-113 = ""
10011095-115 = "Ты права, Ибуки! Спасибо, что дождалась меня!"
10011095-117 = ""
10011095-118 = "Стоять! Одно неверное движение — и ей конец!"
10011095-119 = "Думаешь, я блефую? Я серьёзно!"
10011095-120 = ""
10011095-122 = ""
10011095-123 = ""
10011095-124 = ""
10011095-125 = "Чёрт, они ушли."
10011095-127 = "[ns] «Ибуки, осторожно!»"
10011095-128 = ""
10011095-129 = ""
10011095-131 = ""
10011095-132 = "(Я не промахнусь!)"
10011095-133 = "(Раз! Два!)"
10011095-134 = ""
10011095-135 = "Особое ниндзюцу Мичиру!"
10011095-136 = ""
10011095-138 = "Она в безопасности, достопочтенный Сенсей! Я её поймала!"
10011095-139 = "[s] «Отличная работа, Мичиру! Сейчас перехвачусь поудобнее, и мы её поднимем!»"
10011095-140 = "Уиии! Они поймали Ибуки!"
10011095-141 = "Хорошо, Сенсей! Давайте поднимем её вместе!"
10011095-142 = ""
10011095-145 = "Акх!"
10011095-146 = ""
10011095-149 = "АААААА! Она падает!!"
10011095-150 = "Изуна!"
10011095-151 = "Поняла, Цукуё!"
10011095-153 = ""
10011095-155 = ""
10011095-163 = "Поймали! Она в безопасности!"
10011095-164 = "Господин, я поднимаю её!"
10011095-165 = "[s] «Спасибо вам всем.»"
10011095-167 = "Она... Она жива. Слава богу."
10011095-168 = "Ибуки! Ты в порядке?"
10011095-169 = "С Ибуки всё отлично! Девушки-ниндзя и правда спасли Ибуки!"
10011095-170 = "...Ахаха."
10011095-172 = "Мы никогда не нарушаем обещаний! Таков путь ниндзя!"
10011095-173 = "Вперёд, Клуб исследования ниндзюцу! Нин-нин!"
10011095-175 = "Босс... Похоже, это конец."
10011095-176 = "Нам конец."
10011095-177 = "Не может быть! Наш идеальный план!"
10011095-179 = "...Ты. Стоять."
10011095-180 = ""
10011095-182 = ""
10011095-184 = "Пора тебе заплатить за то, что посмела тронуть хоть один волос на голове Ибуки."
10011095-185 = ""
10011095-186 = "ИИИИИИК?!"
