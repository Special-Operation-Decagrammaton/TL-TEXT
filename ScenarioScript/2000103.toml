[translation]
2000103-1 = "Учиться тяжело. Часть 1"
2000103-2 = "Библиотека"
2000103-3 = "Сенсей? Что привело тебя в библиотеку?"
2000103-4 = "Это я должна спрашивать? Что я здесь делаю, если экзамены уже закончились?"
2000103-5 = "Потому что... мне нужно пересдать несколько предметов."
2000103-6 = "[s1] «Ты сказала „экзамены“ во множественном числе? Ты провалила несколько?»\n[s2] «Мне найти колпак двоечника, Карин?»"
2000103-7 = "...!"
2000103-8 = "...!"
2000103-9 = "В-Всё не так, как ты думаешь!"
2000103-10 = "Ну, не могу отрицать, что высоких оценок у меня никогда не было..."
2000103-11 = "...но это первый раз, когда я вообще завалила экзамен."
2000103-12 = "*вздох* Я ничего не могла поделать."
2000103-13 = "C&C немного отличается от обычных клубов."
2000103-14 = "Днём это обычный волонтёрский клуб, а ночью его участницы становятся агентами ради Миллениума."
2000103-15 = "У меня учёба, обязанности агента и, в моём случае, ещё подработка. Даже если бы меня было трое, я всё равно была бы занята."
2000103-16 = "[s] «Подработка?»"
2000103-17 = "Да. Частично ради денег, но ещё я иду к одной из двух своих мечт."
2000103-18 = "У меня их две, и одна — стать хозяйкой собственного милого кафе."
2000103-19 = "Я знаю, учёба важна, но опыт работы в разных заведениях куда полезнее для моей цели."
2000103-20 = "Да и учёба никогда не была моей сильной стороной..."
2000103-21 = "О!"
2000103-22 = "С-Сенсей."
2000103-23 = "А если я скажу, что одному студенту нужна твоя помощь?"
2000103-24 = "Ты же учитель, верно?"
2000103-25 = "Поможешь мне подготовиться?"
2000103-26 = "Я не прошу тебя быть репетитором. Вот список вопросов и ответов, который я составила."
2000103-27 = "Можешь задавать мне случайные вопросы из списка?"
2000103-28 = "[s3] «Предоставь это мне.»\n[s4] «Есть вопросы о девичьих размерах?»"
2000103-29 = "Спасибо!"
2000103-30 = "Н-Нет! З-Зачем мне вообще добавлять такое?!"
2000103-31 = "Хорошо. Начинаем!"
2000103-34 = "..."
2000103-35 = "[s5] «Как называется падение цен и замедление экономической активности?»\n[s6] «В разделение властей входят законодательная, судебная и какая ещё ветвь?»"
2000103-36 = "Знаю! Ответ — антиутопия!"
2000103-37 = "Дефляция? Ну, почти угадала."
2000103-38 = "Знаю! Ответ — конституционная!"
2000103-39 = "Исполнительная? Я-я это знала. Думаю, можно считать, что наполовину ответила правильно."
2000103-40 = "Давай-давай! Следующий вопрос."
2000103-41 = "У тебя очень приятный голос, Сенсей."
2000103-42 = "Думаю, так мне будет легче запомнить ответы."
2000103-43 = "[s] «А какая у тебя вторая мечта?»"
2000103-44 = "Легко! Стать хорошей женой для... Стой!"
2000103-45 = "Э-Это... Тебе пока не нужно об этом знать..."
2000103-46 = "Во всяком случае пока! З-Забудь, что только что услышал!"
2000103-47 = "Так, какой следующий вопрос?"
2000103-48 = "В этот раз точно отвечу правильно."
