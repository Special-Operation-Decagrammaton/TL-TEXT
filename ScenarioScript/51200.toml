[translation]
51200-1 = "Эпизод 20;Бард «Красоты природы» 2"
51200-3 = ""
51200-4 = ""
51200-5 = "...Господи."
51200-6 = "Разве ты не знаешь, что стрелять в людей без предупреждения невежливо? Будь на моём месте кто-то другой, его бы ранили!"
51200-7 = "Ну же! Я была в самом разгаре злорадства."
51200-8 = "Казалось бы, уж учитель-то должен знать, что такое хорошие манеры. Мм?"
51200-9 = "[s] «Мы вырвем эту проблему с корнем.»"
51200-10 = "Я не позволю тебе творить всё, что вздумается."
51200-11 = "Сенсей и Клуб внутренней дисциплины не обязаны соблюдать манеры с преступниками, нарушающими покой Хяккияко."
51200-12 = "Мы благовоспитанные леди и защитим свой дом во что бы то ни стало."
51200-13 = "Ещё бы!"
51200-14 = "Теперь ты против Клуба внутренней дисциплины!"
51200-15 = ""
51200-17 = ""
51200-19 = "Вы трое..."
51200-20 = "Как достойно восхищения."
51200-22 = "Столько шума, а сказать нечего..."
51200-23 = "Вы прервали меня прямо посреди моей большой речи!"
51200-24 = "Идиотки вроде вас, совсем не уважающие искусство и драму—"
51200-25 = ""
51200-29 = ""
51200-31 = ""
51200-33 = ""
51200-35 = "Вы правда продолжите пытаться? Очевидно же, что это не работает."
51200-36 = "Я думала, кошечка Хяккарёран будет немного умнее."
51200-38 = "Клуб внутренней дисциплины напомнил мне о нашей цели. Долг Хяккарёран — защищать Хяккияко от такого зла, как ты."
51200-39 = "Неважно, насколько фантастическим или ужасающим окажется наш враг."
51200-40 = "Рэнгэ, хватит бездельничать."
51200-41 = "Т-Тебе не обязательно мне это говорить! Ну блин!"
51200-42 = "Нагуса..."
51200-43 = ""
51200-45 = ""
51200-47 = "..."
51200-49 = "Я так понимаю, именно она стоит за всем этим заговором."
51200-50 = "Да. Такое бессмысленное поведение вполне в духе этой девчонки."
51200-51 = "На твоём месте я бы не повторяла это дважды."
51200-52 = "Не угрожай мне. Почему наши атаки не подействовали?"
51200-53 = "[s] «Будто все просто стреляли в воздух.»"
51200-54 = "Как я уже ГОВОРИЛА."
51200-55 = "«Фантомные записи Ино» надёжно защищают и меня, и всех чудовищ. Даже порез бумагой мне не оставите, как ни старайтесь."
51200-56 = "А! Вот Аямэ смогла бы."
51200-57 = "Так, посмотрим, посмотрим... Аямэ здесь? Хм... Я вижу плаксу, идиотку и трусиху. Какой ансамбль! Аямэ, правда, нет!"
51200-59 = "..."
51200-61 = "Хм."
51200-62 = "По-моему, трусиха здесь ты. Не Нагуса."
51200-63 = "Может, лучше называть тебя просто злой!"
51200-64 = "Ну, если тебе от этого станет легче — оскорбляй сколько хочешь!"
51200-65 = "Продолжай сохранять это холодное спокойствие, пока внутри тебя охватывает паника."
51200-66 = "Актёры собрались, занавес опущен. Вы уже по уши во всём этом."
51200-67 = "Вы ничего не можете сделать, чтобы моя история о призраках не дошла до финала."
51200-68 = "[s1] «...Сюро, какова настоящая цель „Красоты природы“?»\n[s2] «Чего ты пытаешься всем этим добиться?»"
51200-71 = "Ха-ха-ха! Наконец-то хорошие вопросы!"
51200-72 = "Я хороший человек, поэтому отвечу."
51200-73 = ""
51200-75 = ""
51200-77 = "Всё, что я делаю, — ради моего представления об утончённости!"
51200-78 = "Я создам собственную прекрасную историю о призраках! Я славный бард «Красоты природы»!"
51200-80 = "Ты так гордишься такими пустяками."
51200-81 = "Возможно, тебе стоило бы найти занятие получше для твоего явно необъятного количества свободного времени."
51200-82 = ""
51200-85 = ""
51200-86 = ""
51200-87 = ""
51200-89 = "Ага."
51200-90 = "Ахахаха!"
51200-91 = ""
51200-93 = ""
51200-94 = ""
51200-96 = "Ха-ха-ха-ха!"
51200-97 = "Какого чёрта тут смешного?"
51200-98 = ""
51200-101 = ""
51200-102 = ""
51200-103 = "Я смеюсь над вашей абсолютной тупостью."
51200-104 = "Именно это ты из всего поняла?"
51200-105 = "Думаешь, это всё? Что моя история о призраках — жалкая горстка чудовищ да немного огня?"
51200-106 = "Ты смотришь на меня свысока такими тупыми-претупыми глазами."
51200-108 = "Я была здесь с самого начала. Создавала, плела, вплетала первые нити своих историй."
51200-109 = "Вы, болваны, даже не заметили, как всё началось. И до сих пор не замечаете."
51200-110 = "Достаточно одного слуха здесь, ещё одного тихого шёпота там."
51200-111 = "[s] «...Слуха?»"
51200-113 = "Ага! Слухи! Никто никогда не знает, откуда они берутся, но они застревают в голове, как дурацкая попсовая песенка."
51200-114 = "Нужен всего один человек, который поверит и пробормочет это за завтраком своей однокласснице."
51200-115 = "Может, всего одна наивная девочка, услышавшая о состязании за преемство?"
51200-116 = "[s] «Ты...?!»"
51200-117 = "Или, может, достаточно предложить глупой девчонке в разгар кризиса личности отправиться искать свою юность..."
51200-119 = "...М-Меня?"
51200-121 = "О, ещё одна! Ещё одна!"
51200-122 = "Жила-была злая, высокомерная стратег, которой позволили внушить, будто лучшее, что она может сделать для своего драгоценного младшего студента, — отправить его далеко-далеко."
51200-123 = ""
51200-126 = ""
51200-127 = "[ns] «Всё до единого, что здесь произошло...»"
51200-129 = "Как всё это вообще было возможно?!"
51200-130 = ""
51200-132 = ""
51200-133 = "Ну, всё благодаря появлению нашего единственного и неповторимого Сенсея."
51200-134 = "Ну же, вы ведь уже не думаете, что ваше появление здесь было случайностью."
51200-135 = ""
51200-142 = "[ns] «...Письмо „Красоты природы“ Клубу Инь-Ян.»"
51200-143 = "Понял! Аха-ха-ха!"
51200-144 = "[s] «Ты манипулировала всем с самого начала.»"
51200-145 = "Я усвоила одну вещь о людях: они всегда действуют в собственных интересах."
51200-146 = "Но счастливых концов не существует. Не в этом мире."
51200-147 = "И они настолько глупы, что даже не понимают, как сами идут навстречу катастрофе!"
51200-148 = "Ах, какая досада."
51200-149 = "По крайней мере для вас! Это глупая и захватывающая история, в которой все герои проигрывают!"
51200-150 = "Ха-ха-ха! Я бесконечно благодарна каждому из вас."
51200-151 = "Спасибо, что вы такие глупые! Ведь теперь я наконец смогу воссоздать легенды двадцатилетней давности."
51200-152 = ""
51200-154 = ""
51200-155 = ""
51200-156 = ""
51200-157 = ""
51200-158 = ""
51200-164 = "Вот он!"
51200-165 = "Каэдэ, за меня! Живо!"
51200-166 = "Х-Хорошо!"
51200-167 = ""
51200-170 = ""
51200-171 = ""
51200-173 = ""
51200-181 = "Старайтесь, старайтесь изо всех сил. Жребий уже брошен."
51200-182 = "Вот кульминация истории, воплощение нашей утончённости!"
51200-183 = "Видите ли, я наконец выбрала главную актрису для своей истории. И всё благодаря вам."
51200-184 = "Вы должны радоваться! Вы её очень-очень хорошо знаете."
51200-185 = ""
51200-187 = ""
51200-188 = "...Юкари? Что ты с ней сделала?"
51200-189 = "Ю-Юкари?!"
51200-190 = "Хи-хи. Даже ты смогла додуматься до этого!"
51200-191 = ""
51200-193 = "Да, Юкари. Я должна вас поблагодарить. В конце концов, именно вы загнали её в изоляцию и одиночество, выставили наружу её самые болезненные комплексы."
51200-194 = "Ваша драгоценная Юкари станет центром моего воссоздания Фестиваля фонарей двадцатилетней давности."
51200-196 = "Я едва сдерживаю восторг... Она станет самим воплощением утончённости."
51200-197 = "Она станет моим величайшим Фантомным сказанием!"
51200-198 = ""
51200-201 = ""
51200-202 = "Ты... совсем как... Аямэ..."
51200-203 = "[s] «(Как Аямэ?)»"
51200-204 = ""
51200-207 = ""
51200-208 = "Что ж, было весело. Пока-пока!"
51200-209 = ""
51200-211 = ""
51200-212 = "[ns] «Нет! Стой! Вернись!»"
51200-213 = ""
51200-215 = ""
51200-216 = ""
51200-217 = ""
51200-221 = "Бесполезно."
51200-222 = ""
51200-225 = ""
51200-226 = "Книга открыта. Она не закроется, пока не будет прочитан финал."
