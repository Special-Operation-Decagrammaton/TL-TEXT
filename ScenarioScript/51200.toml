[translation]
51200-1 = "Episódio 20;A Contadora de Contos Macabros do Clube Beleza da Natureza (2)"
51200-5 = "...Que susto~."
51200-6 = "Apontar uma arma do nada para os outros... que falta de educação, viu?#nDá um susto, sabia? Bem, não funciona comigo mesmo..."
51200-7 = "Justo quando estava ficando emocionante, por que tinham que estragar o clima?"
51200-8 = "Sensei da Schale e vocês aí... atrapalhar numa hora dessas é muita falta de refinamento, viu?"
51200-9 = "[s] \"Porque a responsável por toda essa confusão está bem na nossa frente.\""
51200-10 = "Nós estamos aqui pela paz da cidade, sabe~"
51200-11 = "Por isso, achei que precisávamos impedir você."
51200-12 = "Sim! Seja qual for o motivo, se há uma confusão acontecendo,#nnão podemos simplesmente deixar você agir."
51200-13 = "Isso mesmo!"
51200-14 = "O Clube de Disciplina Interior inteiro vai deter você!"
51200-19 = "Pessoal..."
51200-20 = "Vocês..."
51200-22 = "...Por um motivinho desses, vocês atrapalharam o meu caminho?"
51200-23 = "E olha que faltava tão pouquinho..."
51200-24 = "Que corta-clima... Por favor, não coloquem defeito na nossa histó—"
51200-35 = "Poxa vida... eu já não disse que não adianta?"
51200-36 = "Agora é a sua vez... gatinha preta do Hyakkaryouran?"
51200-38 = "Como o Clube de Disciplina Interior disse, o importante é acalmar essa confusão."
51200-39 = "Mesmo que o inimigo seja um monstro inacreditável—#no Hyakkaryouran não pode recuar."
51200-40 = "Renge, se recompõe."
51200-41 = "...E-Eu já sei!"
51200-42 = "Nagusa-senpai."
51200-47 = "...!"
51200-49 = "...Ela é quem está por trás de tudo isso, certo?"
51200-50 = "Haa... Realmente, ela tem toda a pinta disso mesmo."
51200-51 = "Ei, ei~ isso não é maldade?#nNão precisa falar desse jeito, né?"
51200-52 = "Sensei... sobre os ataques contra ela."
51200-53 = "[s] \"Sim, atravessaram como se estivéssemos atirando na água.\""
51200-54 = "Pois é! Por isso, por isso mesmo eu disse que era inútil, não disse?"
51200-55 = "Diante do meu livro maldito, o \"Inou Mononokeroku\", vocês são impotentes. Seja quem for, não pode tocar no \"Hyakumonogatari\" e muito menos deixar um único arranhão em mim!"
51200-56 = "—A menos que seja a Ayame, claro."
51200-57 = "Ah! Mas espera aí!#nAqui só tem a chorona meia-boca da Nagusa-chan, não é mesmo? Que pe~na!"
51200-59 = "......"
51200-61 = "Ora..."
51200-62 = "Então você é só uma covarde que só sabe provocar de um lugar seguro."
51200-63 = "De novo isso? Que crueldade~"
51200-64 = "Ah... Bem, tanto faz agora."
51200-65 = "Por mais que vocês façam alarde—"
51200-66 = "As cortinas da história já se abriram.#nO \"palco\" e os \"atores\" que eu desejava já estão todos reunidos."
51200-67 = "Pois o nosso \"Hyakumonogatari\" está caminhando lenta e seguramente—rumo ao seu desfecho."
51200-68 = "[s1] \"...Shuro, qual é o verdadeiro objetivo do Clube Beleza da Natureza?\"\n[s2] \"Para que causar toda essa confusão?\""
51200-71 = "Ahaha, só agora, só agora vocês me perguntam isso?"
51200-72 = "...Bem, tudo bem. Eu respondo para vocês, sim?"
51200-77 = "Tudo é—pelo \"requinte\"."
51200-78 = "Para que, como contadora de contos macabros do Clube Beleza da Natureza, eu crie o meu próprio \"Hyakumonogatari\"."
51200-80 = "Você invocou aquela coisa só por um motivo desses?"
51200-81 = "O Clube Beleza da Natureza tem mais tempo livre do que eu pensava."
51200-89 = "Aha!"
51200-90 = "Ahaha!"
51200-96 = "Ahahahaha!!"
51200-97 = "Q-Qual é a graça...?!"
51200-103 = "Que tolice."
51200-104 = "Vocês acham mesmo isso?"
51200-105 = "Que basta controlar monstros, incendiar a cidade—#ne aparecer diante de vocês para criar um \"Hyakumonogatari\"?"
51200-106 = "Cometer um engano tão, tão bonitinho—um mal-entendido tão idiota."
51200-108 = "E olha que o nosso \"Hyakumonogatari\" é uma história transmitida desde mui~to, muito tempo atrás."
51200-109 = "Algo que vocês não teriam como saber—sim, algo que sequer conseguem imaginar."
51200-110 = "Para chegar até aqui... bastou um único \"boato\", sabia?"
51200-111 = "[s] \"...Boato?\""
51200-113 = "Sim. Um \"boato\" permanece num cantinho da mente, mesmo que você não se lembre de onde o ouviu."
51200-114 = "Exato, tudo o que precisávamos—era de um \"boato\"."
51200-115 = "Vejamos...#nPor exemplo, contar sobre a existência do \"Torneio de Sucessão\" para fazer uma jovem inocente agir—"
51200-116 = "[s] \"...!\""
51200-117 = "Dizer \"a juventude é só agora\" para fazer uma garota cabeça-dura agir—"
51200-119 = "...Hã?"
51200-121 = "E mais, e mais..."
51200-122 = "Dizer a uma garota terrivelmente arrogante que \"se ela se importa com a caloura, deveria mandá-la de volta para casa\",#nincitando-a a lutar contra a jovem inocente."
51200-127 = "[ns] \"...Não pode ser.\""
51200-129 = "Você já não sabia de tu~do desde o começo?"
51200-133 = "Tudo isso só foi possível porque o Sensei da Schale...#nporque você veio até aqui, sabia?"
51200-134 = "O motivo de você ter vindo para cá... você faz ideia, não faz?"
51200-142 = "[ns] \"...A carta endereçada ao Clube Yin-Yang.\""
51200-143 = "Aha, ahaha!"
51200-144 = "[s] \"Será que... desde o início...\""
51200-145 = "Cada um lutando e sofrendo para fazer o \"melhor\"—"
51200-146 = "E, por causa desse \"melhor\", tudo acaba indo por água abaixo..."
51200-147 = "Sem nem sonhar que o que deveria ser o melhor era, na verdade, o \"pior\"—não é mesmo?"
51200-148 = "Ah, mas que espetáculo."
51200-149 = "Uma história tão tola—e tão maravilhosa!"
51200-150 = "Ahaha! Eu devia agradecer a vocês, seus tolos, não é?"
51200-151 = "Pois graças à estupidez de vocês—poderei recriar o conto macabro de 20 anos atrás."
51200-164 = "Mais monstros...!"
51200-165 = "Kaede-chan! Não se afaste de mim, por favor!"
51200-166 = "T-Tá bom...!"
51200-181 = "É inútil, viu? O estopim já foi aceso."
51200-182 = "O nosso requinte começa agora... Sim, agora chega o tão aguardado clímax."
51200-183 = "Pois, graças aos esforços de vocês—a protagonista da história finalmente nasceu."
51200-184 = "Ahaha! Sim, sim! Vamos deixar que ela—assuma o papel principal."
51200-188 = "...Não me diga que... Yukari!"
51200-189 = "Quê?!"
51200-190 = "Ihihi! Claro, pelo menos disso vocês tinham que se dar conta."
51200-193 = "Sim, sim! Isso mesmo. Graças a vocês...#numa garota que carrega feridas e desespero mais profundos do que ninguém—"
51200-194 = "Uma pobre, pobre garota presa à maldição de \"ter que recriar o palco de 20 anos atrás\"."
51200-196 = "Ah... com certeza ela vai...!#nCriar um requinte tão maravilhoso...!"
51200-197 = "Sim... ela vai se tornar o melhor Hyakumonogatari de todos!"
51200-202 = "Vocês vão fazer... de novo, igual fizeram com a Ayame..."
51200-203 = "[s] (Igual fizeram com a Ayame...?)"
51200-208 = "Pois bem, pois bem, com licença que agora eu me retiro."
51200-212 = "[ns] \"Pessoal, a Shuro—!\""
51200-221 = "É inútil, viu?"
51200-226 = "Pois ninguém mais pode parar uma história que já começou a se mover."
