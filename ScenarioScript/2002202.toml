[translation]
2002202-1 = "Какое у тебя желание?"
2002202-2 = "Столовая Геенны"
2002202-5 = ""
2002202-6 = "Phew... Another tough day..."
2002202-7 = "О, Сенсей?!"
2002202-8 = ""
2002202-10 = ""
2002202-12 = "Что вас сюда привело?"
2002202-13 = "[s1] «Я ждал тебя, Фуука.»\n[s2] «Я скучал по тебе, Фуука!»"
2002202-16 = "Что? М-меня?"
2002202-17 = "Ч-что вы имеете в виду...?"
2002202-18 = "Я только что закончила работу в Клубе школьного питания... Я выгляжу ужасно."
2002202-19 = "Волосы мокрые от пота, одежда в пятнах после готовки... и... и...!"
2002202-20 = "[s] «Ну, я подумал, что ты заслужила награду за всю свою тяжёлую работу.»"
2002202-21 = "Что?!"
2002202-22 = "Н-никто не хочет видеть меня в таком виде..."
2002202-23 = "А-ай! Что же мне делать? Как мне—"
2002202-24 = "[s] «Давай для начала глубоко вдохнём.»"
2002202-26 = "Хорошо, хорошо. Но в следующий раз хотя бы предупреди меня заранее, прежде чем приходить."
2002202-27 = "А-а? Ты хотел сделать сюрприз?"
2002202-28 = "Ты иногда такой... проказник, Сенсей."
2002202-29 = "Мои планы? Ничего особенного я не планировала..."
2002202-30 = "[s] «Тогда давай прогуляемся.»"
2002202-31 = "П-прогуляемся?!"
2002202-32 = ""
2002202-34 = ""
2002202-35 = "Р-разве это не будет похоже на... с-свидание? Но сегодня..."
2002202-36 = "И-и вообще в любой другой день...! Я не могу—"
2002202-37 = "[s] «Ты не хочешь?»"
2002202-38 = "Нет! Хочу! Но... Ну посмотри на меня. Моя одежда, волосы..."
2002202-39 = "Это всё неважно? У-ух..."
2002202-40 = "Ладно, хорошо. Пойдём прогуляемся, Сенсей!"
2002202-42 = "Центр города"
2002202-43 = "Мы с Фуукой вместе прогулялись по центру города."
2002202-44 = ""
2002202-47 = ""
2002202-48 = "Ого. Сегодня и правда очень людно."
2002202-49 = "Наверное, сейчас как раз то время, когда люди обычно выходят погулять."
2002202-50 = "Обычно я об этом даже не задумываюсь... Я хожу в супермаркет за продуктами для Клуба школьного питания..."
2002202-51 = "Но кроме этого я почти никуда не выбираюсь..."
2002202-52 = "Может, я и хорошо знаю этот район, но..."
2002202-53 = "Когда гуляю здесь вот так с тобой, всё ощущается совсем иначе."
2002202-54 = "[s] «Кстати, после такой прогулки ты, должно быть, проголодалась.»"
2002202-55 = "Хм?"
2002202-56 = "Вообще-то я сегодня не ужинала."
2002202-57 = "Из-за праздников занятия закончились рано, поэтому в столовой было не протолкнуться."
2002202-58 = ""
2002202-62 = "А?! Сенсей, когда ты успел...?"
2002202-63 = "[s] «Я проголодался и решил, что ты наверняка тоже!»"
2002202-64 = "Э-это очень заботливо с твоей стороны..."
2002202-65 = ""
2002202-68 = "Мы с Фуукой отправились перекусывать от души."
2002202-70 = "Торговый квартал"
2002202-71 = ""
2002202-73 = ""
2002202-74 = ""
2002202-75 = "Сенсей, посмотри туда. Рулетики из жареного мяса!"
2002202-76 = "Здесь столько разных начинок. Водоросли, сыр, зелёный лук..."
2002202-77 = "У тебя есть любимая?"
2002202-79 = "У них есть марципан!"
2002202-80 = "И смотри, он в форме поросёнка! Как мило."
2002202-81 = "М-м-м... Миндаль и сахар отлично сочетаются."
2002202-83 = "Это... олиболлен!"
2002202-84 = "Это жареный пончик с сухофруктами в тесте."
2002202-85 = "Скорее. Его нужно есть горячим."
2002202-87 = "В итоге мы просто объелись сладостями..."
2002202-88 = "О! Но рыбная котлета тоже была бы вкусной."
2002202-89 = "И смотри, если выиграешь у них в камень, ножницы, бумагу, дадут ещё одну бесплатно!"
2002202-91 = "...Если честно, я не думаю, что смогу съесть ещё хоть кусочек."
2002202-92 = "[s] «Фух. Я тоже объелся до отвала.»"
2002202-93 = "Но это был очень вдохновляющий опыт."
2002202-94 = "Особенно тот рулетик из жареного мяса, который мы попробовали."
2002202-95 = "А что, если замариновать тонко нарезанное мясо для рулетика в слегка остром соусе...?"
2002202-96 = "А потом обжарить его с овощами? Интересно, студентам понравится такое на обед?"
2002202-97 = "А? Ты не думал, что даже здесь я буду размышлять о Клубе школьного питания?"
2002202-98 = "Ха-ха-ха. Считай, это профессиональная болезнь, которую я подхватила в Клубе школьного питания."
2002202-99 = "[ns] «Ты просто очень трудолюбивая, Фуука.»"
2002202-100 = "Это уже преувеличение. Не говори глупостей."
2002202-101 = "Все вокруг меня работают не менее усердно."
2002202-102 = "В плане трудолюбия я ничем не особеннее остальных."
2002202-103 = "Я просто хочу каждый день делать всё, что в моих силах."
2002202-104 = "[ns] «Я позвал тебя сюда, чтобы ты немного отдохнула...»"
2002202-106 = "[ns] «Но в итоге лишь заставил тебя ещё больше думать о Клубе школьного питания. Прости.»"
2002202-107 = "П-пожалуйста, не извиняйся! Это полностью моя вина."
2002202-108 = "Мне бы не хотелось, чтобы из-за моих дурных привычек ты чувствовал себя виноватым."
2002202-109 = "К тому же на праздники у меня будет несколько выходных. Я ещё успею как следует отдохнуть."
2002202-110 = "[s] «Тогда у тебя есть новогоднее желание на эти праздники?»"
2002202-111 = "Желание? Ну, есть очевидные варианты, но..."
2002202-112 = "Хм... У меня просто не было времени об этом подумать. Посмотрим..."
2002202-113 = "Моё единственное желание сейчас..."
2002202-114 = ""
2002202-116 = ""
2002202-117 = "О... Кажется, я знаю."
2002202-118 = "Даже если всего на краткий миг, я хочу, чтобы моя жизнь была наполнена покоем."
2002202-120 = "Да... Наверное, именно этого я бы пожелала."
