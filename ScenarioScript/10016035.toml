[translation]
10016035-2 = "Я сидел на трибунах, готовясь смотреть соревнования."
10016035-3 = ""
10016035-6 = ""
10016035-7 = "Здравствуйте, Сенсей. Вы пришли!"
10016035-8 = "Хи-хи. Я ещё раз хотела поблагодарить за вчера. Надеюсь, вы поспали."
10016035-9 = "[s1] «Да, благодаря вам я отлично отдохнул.» \n[s2] «А ты отдохнула, Ноа?»"
10016035-10 = "Я тоже! Немного вздремнула перед церемонией открытия."
10016035-11 = "Да. Немного вздремнула перед церемонией открытия."
10016035-12 = "Слышала, пока я спала, произошло несколько инцидентов, но что уж поделать."
10016035-13 = "Я рада, что все, похоже, веселятся."
10016035-14 = "[s] «Похоже, вся наша тяжёлая работа окупилась, да?»"
10016035-15 = "Приятное чувство. Итак, какое соревнование следующее?"
10016035-16 = "О, это поиск предметов!"
10016035-17 = "Ну, я отдохнула и полна сил! Мне пора, Сенсей."
10016035-18 = "[s] «Ты участвуешь в поиске, Ноа?»"
10016035-19 = "Да! Но как судья, а не участница."
10016035-20 = "Кстати, слышали? В этом соревновании должна была участвовать Юзу из Отдела разработки игр, но Юука настояла, чтобы занять её место!"
10016035-21 = "Хи-хи. Поиск предметов... Он стабильно остаётся одним из самых популярных соревнований Фестиваля Хало."
10016035-22 = "То, что попадётся на записке, определяется случайно. Даже Исполнительный комитет не знает, что там написано. И ещё есть негласное правило: на некоторых записках всегда бывает «тот, кто тебе нравится», чтобы сделать игру веселее."
10016035-23 = "Очень интересно, какую записку вытянет Юука."
10016035-24 = "Что ж, приятного просмотра остальных соревнований, Сенсей!"
10016035-26 = "Наконец-то ожидание окончено!"
10016035-27 = "Самое долгожданное соревнование всего спортивного фестиваля начинается! Да начнётся поиск предметов!"
10016035-28 = "Слышите, как зрители ревут от восторга, приветствуя любимую игру!"
10016035-29 = "Правила просты! Каждая участница вытянет листок из коробки посреди дорожки. Затем она должна найти предмет или человека, указанного на листке, и пересечь с ним финишную черту!"
10016035-30 = "Но есть подвох! Показывать кому-либо свою записку нельзя!"
10016035-31 = "И вот они! Участницы поиска предметов прямо сейчас выходят на поле!"
10016035-32 = ""
10016035-34 = ""
10016035-37 = ""
10016035-38 = ""
10016035-40 = "(Слава богу, Юзу была рада уступить мне место.)"
10016035-41 = "(Вообще-то она даже выглядела облегчённой. Юзу никогда не умела хорошо разговаривать с незнакомцами.)"
10016035-42 = "(...Я не могу проиграть. Я должна победить ради «Миллениума»!)"
10016035-43 = ""
10016035-45 = ""
10016035-46 = "(Эта судья... Это та руководительница «Семинара», которую я встречала в прошлый раз?)"
10016035-47 = "(Как руководители их студсовета могут одновременно участвовать в соревновании и судить его? Я вообще не доверяю «Миллениуму».)"
10016035-48 = "(Но я элитная участница SRT! Какие бы схемы они ни придумали, я просто подавлю их силой.)"
10016035-49 = ""
10016035-51 = ""
10016035-52 = "Итак... На старт... Внимание..."
10016035-53 = "(Я выиграю и закреплю лидерство Геенны на Фестивале Хало!)"
10016035-54 = ""
10016035-56 = ""
10016035-57 = "Так... На старт... Внимание..."
10016035-58 = "Вперёд!"
10016035-59 = "Раздаётся выстрел стартовой ракеты, и участницы срываются с места!"
10016035-60 = "Первой до коробки добирается..."
10016035-61 = "Сораи Саки из академии SRT!"
10016035-62 = "Академия SRT сейчас закрыта, но получила разрешение «Шале» временно использовать своё название специально для фестиваля."
10016035-63 = "Сможет ли Саки принести академии SRT первую победу?"
10016035-65 = "Посмотрим. Предмет..."
10016035-66 = "...Дымовая граната с белым фосфором калибра 4,2 дюйма?! Где я должна найти такое оружие на стадионе?!"
10016035-67 = "Дисквалификация!"
10016035-68 = "Д-дисквалификация?!"
10016035-69 = "Прости, но правила есть правила! Нельзя раскрывать, что написано на листке, пока не пересечёшь финиш и не покажешь его судье!"
10016035-70 = "Если другие знают, что тебе нужно, игра теряет смысл. Часть игры — угадывать, что досталось соперницам!"
10016035-71 = "А если раскрыть свой предмет, другие студенты могут тебе помочь, а это не командная игра!"
10016035-72 = "Прошу прощения, но Сораи Саки дисквалифицирована! Пожалуйста, покиньте дорожку."
10016035-73 = ""
10016035-75 = ""
10016035-76 = ""
10016035-77 = "Я знала, что ты дурочка, Саки, но даже я ожидала от тебя большего!"
10016035-78 = "Н-нас всего четверо, т-так что, наверное, стоило немного снизить ожидания..."
10016035-79 = "Хорошая попытка, Саки."
10016035-80 = "Впереди ещё много соревнований. Выиграем следующее."
10016035-81 = "...Ух."
10016035-82 = "Н-ну, даже без дисквалификации победить было бы невозможно."
10016035-83 = "Кто вообще принесёт на Фестиваль Хало фосфорную дымовую гранату?"
10016035-84 = "Д-да... Кто бы стал такое делать...?"
10016035-85 = "...Серьёзно, Моэ?"
10016035-86 = ""
10016035-88 = ""
10016035-89 = "Одна выбыла, осталось две!"
10016035-90 = "Следующей до коробки добирается Хаясэ Юука из Научной школы «Миллениум»!"
10016035-91 = ""
10016035-93 = ""
10016035-94 = "*тяжело дышит* Посмотрим... Мне нужно найти..."
10016035-95 = "Хм... Нет, не это..."
10016035-96 = "И не это..."
10016035-97 = ""
10016035-99 = ""
10016035-100 = "Ага! Нашла!"
10016035-101 = ""
10016035-103 = ""
10016035-107 = "Сенсей! Можете на секундочку пойти со мной?"
10016035-108 = "[s] «Я-я?»"
10016035-109 = "Да! Некогда путаться! Пойдёмте!"
10016035-110 = ""
10016035-112 = ""
10016035-114 = "Юука сразу после получения записки бросилась к Сенсею из «Шале»!"
10016035-115 = "И этим она выходит в лидеры! Что же написано на её листке?! Почему она привела Сенсея?"
10016035-116 = "И она пересекла финиш! У нас победительница первого места... или нет?"
10016035-117 = "Прежде чем что-либо объявлять, судья должна проверить, правильный ли предмет она принесла."
10016035-118 = ""
10016035-120 = ""
10016035-121 = "Хм-м... Понятно..."
10016035-122 = "Теперь я понимаю, что Юука чувствует к [USERNAME]-сенсею. Хи-хи."
10016035-123 = "Я-я не понимаю, о чём ты! Ты предвзята! Просто вынеси решение уже."
10016035-124 = "Да. Это засчитывается. Хаясэ Юука выходит в лидеры."
10016035-125 = "Да! Получилось!"
10016035-126 = ""
10016035-129 = "...В поиске предметов всегда бывает записка «тот, кто тебе нравится»."
10016035-130 = "Обычно хотя бы одна участница приводит через финиш человека, который ей нравится. Говорят, это благословение Фестиваля Хало, потому что после этого пара всегда начинает встречаться!"
10016035-131 = "Похоже, другим участницам такая записка не досталась..."
10016035-132 = "О боже! А Юука сразу побежала к Сенсею, как только вытянула свой листок!"
10016035-133 = "П-подождите! Это недоразумение!"
10016035-134 = "На моей записке было написано не «тот, кто тебе нравится». Там было «зрелый человек»..."
10016035-135 = "Юука! Нельзя говорить, что написано на листке."
10016035-136 = "Весь смысл в том, чтобы угадывать, что досталось каждой участнице!"
10016035-137 = "Я уже пересекла финиш! Какая разница?"
10016035-138 = "Тебе обязательно придираться к другому студенту «Миллениума»? Да ещё и коллеге по «Семинару»?"
10016035-139 = "Да. Обязательно. Честное и свободное соревнование — сама душа Фестиваля Хало."
10016035-140 = "Я не могу делать исключений. Даже если ты очень милая, когда смущаешься, Юука."
10016035-141 = "Мне нечего смущаться! Я же говорю, там не было написано «тот, кто тебе нравится»!"
10016035-142 = "[s] «О... Значит, ты выбрала меня не как человека, который тебе нравится...»"
10016035-143 = "Что?!"
10016035-144 = "Н-нет! Я не это имела в виду, Сенсей..."
10016035-145 = "Я-я не в таком смысле...!"
10016035-146 = "...Вы это слышали?"
10016035-147 = "Это признание шло прямо от сердца."
10016035-148 = "Все студенты «Миллениума» такие смелые? Я впечатлена."
10016035-149 = "Пожалуйста, послушайте меня! Это недоразумение!"
10016035-151 = "Мне потребовалось немало времени и много успокаивающих слов, чтобы Юука наконец пришла в себя и почувствовала себя лучше."
