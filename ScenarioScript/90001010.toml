[translation]
90001010-1 = "Эпизод 1;Ледниковое Море, Снова"
90001010-2 = ""
90001010-3 = "Как обстановка, Эйми? Токи?"
90001010-4 = ""
90001010-6 = ""
90001010-7 = ""
90001010-8 = "Во время разведки никаких серьёзных изменений не обнаружено."
90001010-9 = "Иногда встречаются последователи Декаграмматона, но они не проявляют враждебности. В бой не вступали."
90001010-11 = "Мы продолжили операцию здесь только в надежде получить больше данных о пятом пророке, Гебуре..."
90001010-12 = "...но не получили ничего. Это уже похоже на пустую трату людей и ресурсов."
90001010-13 = "И что важнее, эти условия слишком суровы для такой хрупкой, прекрасной, сверхгениальной, шикарной и крутой красавицы, как я."
90001010-14 = "Вы добавили к своему прозвищу ещё несколько прилагательных, президент. Кроме того, считаю слова «шикарная» и «крутая» неточными."
90001010-15 = "Совершенно неверно! Я само воплощение шикарной и крутой красоты. Эйми, тебе правда стоит думать обо мне лучше."
90001010-16 = "Да, Эйми. Независимо от реальности, важно поддерживать высокую самооценку — и свою, и окружающих."
90001010-17 = "...Токи. Тебе когда-нибудь говорили, что некоторые вещи лучше не произносить вслух?"
90001010-18 = "Да, вы очень хорошо меня знаете, президент Химари. Однако я не понимаю этой мысли и не испытываю желания её понимать."
90001010-20 = "Сенсей, сделайте с этим что-нибудь. Мне и с Эйми было тяжело, а теперь приходится терпеть ещё и Токи."
90001010-21 = "[s] «Токи хотя бы не со зла...»"
90001010-22 = "Именно это и есть проблема!"
90001010-23 = "*вздох* Вернёмся к делу. Нам нужно собрать больше данных о Гебуре."
90001010-24 = "У меня как раз есть кое-что по этому поводу."
90001010-25 = "Это можно назвать «предчувствием». Однако..."
90001010-26 = "О? Заинтриговала."
90001010-27 = "Пожалуйста, продолжай."
90001010-28 = "Да. Моё «предчувствие» касается самой Гебуры. Точнее, это впечатление, которое я получила во время нашей битвы."
90001010-29 = "Мне показалось, что Гебура избегала прямого столкновения. Будто не хотела провоцировать полномасштабную войну между нами."
90001010-30 = "Согласна. Мне тоже показалось, что его главной целью был не бой."
90001010-31 = "Понятно. Тогда, если оценить всё, что мы пока знаем о Гебуре..."
90001010-32 = "Ты предполагаешь, что, в отличие от других встреченных нами пророков Декаграмматона, она всеми силами старается оттянуть бой из-за какой-то скрытой цели, которую мы ещё не раскрыли."
90001010-33 = "Именно так."
90001010-34 = "Я бы никогда не стала игнорировать интуицию Токи. И учитывая, что ты сражалась с ней лицом к лицу, я доверяю твоему отчёту."
90001010-35 = "Однако это не меняет того, что нам нужно делать."
90001010-36 = "[s] «Продолжать отслеживать Гебуру и её действия?»"
90001010-37 = "Да, Сенсей. Допустим, Гебура втайне готовит какой-то гениальный план. Тогда задача Отряда Исследования Сверхъестественного — выяснить, какой именно."
90001010-38 = "Все, без лишних слов—"
90001010-39 = ""
90001010-45 = ""
90001010-46 = "Эйми. Тревога. На нас напали."
90001010-47 = "Непредвиденная схема действий. Президент, на нас напали."
90001010-49 = "Да, я слышала. Чтобы они вдруг сменили тактику и сами пошли в атаку..."
90001010-50 = "Может, появилась новая структура командования? И теперь они стремятся вступить в бой?"
90001010-51 = "Или это ответ на то, что мы идём по следу Гебуры?"
90001010-52 = "Но от Гебуры никаких следов. Мы не нашли даже намёка."
90001010-53 = "Да. Анализ данных тоже ничего не дал. Тогда что могло их спровоцировать...?"
90001010-54 = "Анализ и размышления подождут. Вступаю в бой."
90001010-55 = ""
90001010-57 = ""
