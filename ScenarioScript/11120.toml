[translation]
11120-2 = "Episódio 12;Rumo ao Mercado Negro (2)"
11120-3 = "Distrito de Entretenimento"
11120-4 = "...Acho que aqui já estamos seguros."
11120-5 = "Hmm...#nPelo jeito você considera este lugar bem perigoso, né?"
11120-6 = "Hein? C-Claro! Afinal, é um dos lugares onde o alcance do Conselho Estudantil Geral não chega..."
11120-7 = "Só o Mercado Negro já tem o tamanho equivalente ao de várias academias juntas, então não dá para ignorar..."
11120-8 = "Além disso, ouvi dizer que várias \"empresas\" disputam interesses aqui em torno de atividades ilegais."
11120-9 = "E não é só isso. Eles têm até instituições financeiras e forças de segurança próprias daqui..."
11120-10 = "Quer dizer que têm bancos e polícia...?!#nM-Mas é claro que são organizações ilegais e sem licença, né?!"
11120-11 = "Sim... exatamente."
11120-12 = "A escala disso é completamente fora do comum..."
11120-13 = "Entre tudo isso, o melhor é evitar as forças de segurança a todo custo...#nSe causar qualquer confusão, a primeira coisa a fazer é se esconder..."
11120-14 = "Hummm, Hifumi-chan, você sabe bastante sobre este lugar, hein~"
11120-15 = "Hein? Você acha? Como é um lugar perigoso, acho que foi porque pesquisei bem antes de vir..."
11120-16 = "Certo, decidi~"
11120-17 = "...?"
11120-18 = "Como agradecimento por termos te ajudado, você vai vir com a gente até encontrarmos o que estamos procurando, tá bom? ♪"
11120-19 = "Quê? Queeeê?"
11120-20 = "Uau ☆ Que ótima ideia!"
11120-21 = "Entendi. É um sequestro."
11120-22 = "Como é que é?!"
11120-23 = "Não é sequestro, a gente só quer pedir para você nos guiar, né?#nClaro, só se estiver tudo bem para você, Hifumi-san."
11120-24 = "A-Auu... Não sei se alguém como eu pode ser útil, mas...#nEu devo uma ao pessoal de Abydos, então aceito com prazer."
11120-25 = "Beleza~ Então conto com a sua companhia por um tempinho, tá?"
11120-27 = "(Triiiim...)"
11120-29 = "(Triiiiiiiim...)"
11120-31 = "Aru-chan, o que você tá fazendo? Não vai atender o telefone?"
11120-32 = "..."
11120-33 = "Essa cara fechada... Por acaso é o cliente...?"
11120-34 = "Nossa, não é à toa que tá com essa cara. Vai ter que avisar que a gente fracassou, né?"
11120-35 = "Aru-sama..."
11120-36 = "...Argh."
11120-38 = "(Clique)"
11120-39 = "Alô... Aqui é a Faz-Tudo 68."
11120-42 = "..."
11120-43 = "Hmm, um relatório interessante."
11120-44 = "Já assisti ao aquecimento até agora.#nE então, quando começa a ação de verdade?"
11120-47 = "...Hã? Aquilo já era a ação de verdade... mas..."
11120-48 = "A-Ah, não, não é nada! C-Claro, a ação de verdade vai começar logo... tipo...#nAh, hum, dentro de uma semana... sim."
11120-49 = "?!"
11120-50 = "!!"
11120-51 = "Huhu. Sim, exatamente.#n...Deixe conosco."
11120-53 = "(Clique)"
11120-54 = "Os dados sobre elas deveriam estar corretos."
11120-55 = "Erro de cálculo? Não, mas aquele poder claramente..."
11120-56 = "...Parece que está com problemas."
11120-57 = "..."
11120-58 = "Não, não estou com problemas. Apenas houve uma pequena margem de erro nos cálculos.#nO pessoal de Abydos só se mostrou muito mais forte do que os dados indicavam."
11120-59 = "..."
11120-60 = "...Não há falhas nos dados."
11120-61 = "...?"
11120-62 = "Creio que isso deva ser interpretado simplesmente como as alunas de Abydos tendo ficado ainda mais fortes."
11120-63 = "E o que isso significa...?"
11120-64 = "Vamos verificar qual fator de mudança surgiu em Abydos."
11120-65 = "Com licença."
11120-68 = "..."
11120-70 = "(Clique)"
11120-71 = "...Haaah."
11120-72 = "Você ficou acabada, hein, Aru-chan."
11120-73 = "Chefe, o que foi aquilo...? Não me diga que vamos lutar de novo?"
11120-74 = "...Eu também não sei os detalhes, mas aquele cliente é um peixe grande de verdade.#n...Não podemos falhar nesse serviço de jeito nenhum."
11120-75 = "..."
11120-76 = "Mas o pessoal de Abydos era mais forte do que a gente pensava, né?#nAlém disso, aquele Sensei da \"Schale\" tá com elas, então só nós quatro não vamos dar conta."
11120-77 = "E a gente também já gastou todo o dinheiro. Como é que vamos lutar?"
11120-78 = "E-Eu posso arrumar um trabalho de meio período, se quiser!"
11120-79 = "Para contratar mercenários com esse dinheiro, todas nós teríamos que trabalhar por mais um ano..."
11120-80 = "É por alugar um escritório caro desses que a gente só joga dinheiro fora..."
11120-81 = "C-Cala a boca! Para uma empresa de verdade, ter um escritório é o básico!#nAssim a gente até recebe mais pedidos de trabalho!"
11120-82 = "Por mim, tudo bem voltar a acampar numa barraca no parque que nem antes~"
11120-83 = "Fiquem quietas! Vocês fazem barulho demais! Silêncio!!"
11120-84 = "..."
11120-85 = "...Vamos pegar um empréstimo."
11120-86 = "Hã? Mas você tá na lista negra, Aru-chan."
11120-87 = "Não é isso! Eu só fui colocada na lista de procurados e tive a conta congelada!"
11120-88 = "É mesmo?#n...Ah, verdade. Foi obra do Comitê Disciplinar, né?"
11120-89 = "Argh, maldito Comitê Disciplinar... Não achei que fossem pegar tão pesado assim."
11120-90 = "Mesmo que a gente vá ao Banco Central, vão mandar a gente embora na hora~"
11120-91 = "Já mandei calar a boca! Existem outros jeitos!"
11120-92 = "..."
11120-93 = "Vocês vão ver só, Abydos. Isso não vai acabar assim."
11120-94 = "A missão da Faz-Tudo está só começando!"
11120-96 = "..."
11120-97 = "Hee~ O que será que ela tá planejando fazer?"
11120-99 = "Próximo;Em Ação! A Gangue Mascarada de Maiô (1)"
