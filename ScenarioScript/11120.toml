[translation]
11120-2 = "Эпизод 12;На Чёрный рынок! Часть 2"
11120-3 = "Развлекательный район"
11120-4 = "Кажется, мы оторвались..."
11120-5 = "Это место полностью оправдывает свою репутацию."
11120-6 = "Можно и так сказать. Генеральный ученический совет здесь почти не имеет влияния."
11120-7 = "По масштабам Чёрный рынок как минимум сопоставим с небольшими академиями Кивотоса. Его точно нельзя недооценивать..."
11120-8 = "Особенно учитывая, что здесь постоянно воюют корпорации, пытаясь захватить контроль над самыми разными незаконными товарами и занятиями."
11120-9 = "У Чёрного рынка даже есть собственный банк и силы правопорядка."
11120-10 = "Банк и полиция?! Это же не может быть законно?!"
11120-11 = "Вообще ни капельки."
11120-12 = "Не верится, насколько всё здесь организовано."
11120-13 = "А уж с местной полицией связываться особенно не стоит — поверьте мне.#nЕсли что-нибудь случится, лучше всего просто убежать и спрятаться."
11120-14 = "Ты довольно много знаешь об этом месте, Хифуми."
11120-15 = "Правда? Я просто много изучала его перед поездкой из-за всех этих историй..."
11120-16 = "Тогда решено!"
11120-17 = "...?"
11120-18 = "Хифуми пойдёт с нами, пока мы не найдём то, за чем пришли! ♪"
11120-19 = "Погодите, что?"
11120-20 = "Ого! Гениальная идея! ☆"
11120-21 = "Похищение. Хорошая мысль."
11120-22 = "Что, простите?!"
11120-23 = "Нет-нет, никакого похищения. Они хотят, чтобы ты стала нашим проводником.#nКонечно, если ты не против, Хифуми."
11120-24 = "А. Не уверена, что буду особо полезна, но я всё-таки вам обязана,#nтак что... хорошо."
11120-25 = "Отлично, тогда пока пойдёшь с нами."
11120-27 = "*ДЗ-З-З-З-ЗЫНЬ*"
11120-29 = "*ДЗ-З-З-З-ЗЫНЬ*"
11120-31 = "Какого чёрта, Ару?! Почему ты трубку не берёшь?"
11120-32 = "..."
11120-33 = "Вы только посмотрите на её лицо. Наверняка клиент..."
11120-34 = "Уф. Не хотела бы я сейчас быть на её месте и докладывать о провале."
11120-35 = "Ару..."
11120-36 = "Тц."
11120-37 = ""
11120-38 = "*щелчок*"
11120-39 = "Решалы 68..."
11120-41 = ""
11120-42 = "..."
11120-43 = "Что ж. Любопытно."
11120-44 = "Мне было приятно наблюдать за вашей разминкой. Так скажите, когда начнётся настоящая операция?"
11120-46 = ""
11120-47 = "Эм, что? Но это и была настоящая опе—"
11120-48 = "То есть, эм, настоящая операция начнётся совсем скоро. Иными словами,#nчерез неделю. Ага..."
11120-49 = "...?!"
11120-50 = "...!"
11120-51 = "Ха-ха-ха. Именно. Вам не о чем беспокоиться."
11120-53 = "*лязг*"
11120-54 = "Насколько мне известно, данные по этой группе должны быть точными."
11120-55 = "Неужели мы ошиблись в расчётах?"
11120-56 = "Вы выглядите обеспокоенной."
11120-57 = "..."
11120-58 = "Нет, не обеспокоенной. Просто ошибка в расчётах, вот и всё.#nСудя по данным, студенты Абидоса случайно оказались немного сильнее, чем ожидалось."
11120-59 = "..."
11120-60 = "Напротив. Данные были безупречны."
11120-61 = "...?"
11120-62 = "Единственное объяснение — студенты Абидоса каким-то образом стали сильнее."
11120-63 = "Это нелепо."
11120-64 = "Придётся выяснить, не появилась ли в Абидосе в последнее время какая-нибудь новая переменная."
11120-65 = "Прошу прощения."
11120-67 = ""
11120-68 = "..."
11120-70 = "*лязг*"
11120-71 = "*выдыхает*"
11120-72 = "Ты плохо выглядишь, Ару."
11120-73 = "Что это вообще было? Ты ведь не собираешься снова начинать драку?"
11120-74 = "Если честно, я мало что знаю о клиенте, но точно знаю: с ним лучше не шутить. Не хотелось бы его разочаровывать..."
11120-75 = "..."
11120-76 = "Но эти девчонки из Абидоса оказались куда сильнее, чем мы думали.#nПлюс на их стороне Шале. Одних наших сил не хватит."
11120-77 = "И мы уже спустили весь бюджет. Даже если захотим снова драться, на что?"
11120-78 = "М-может, мне начать искать подработчиков в качестве наёмников?"
11120-79 = "Чтобы снова такое оплатить, каждой из нас придётся работать целый год."
11120-80 = "Напомните, зачем мы вообще арендовали этот офис. Только деньги жрёт."
11120-81 = "П-потому что нормальному бизнесу нужно нормальное рабочее место!#nНас никто не наймёт, если мы не будем выглядеть солидно!"
11120-82 = "В этом есть смысл, но лично я не была бы против снова вести дела из палатки в парке, как раньше."
11120-83 = "Заткнитесь! Просто заткнитесь! Все!"
11120-84 = "..."
11120-85 = "Возьмём кредит."
11120-86 = "Ты серьёзно, Ару?! Я думала, твоя кредитная история уже на самом дне!"
11120-87 = "Неправда! Мой счёт просто заморозили из-за награды за мою голову!"
11120-88 = "А-а, вот что было...? Точно, вспомнила. Это Префектурная команда сделала."
11120-89 = "Вот же гады... Обязательно было так за нами гоняться, да?"
11120-90 = "Попробуй объясни это банку. Нас из вестибюля со смехом вышвырнут!"
11120-91 = "Заткнись! Что-нибудь придумаем!"
11120-92 = "..."
11120-93 = "Дурацкие придурки из Абидоса. Я ведь сказала, что они ещё о нас услышат, да?!"
11120-94 = "Мы только начинаем!"
11120-95 = ""
11120-96 = "..."
11120-97 = "Хм. Что же она задумала?"
11120-99 = "Следующий Эпизод;Банда в масках и купальниках! Часть 1"
