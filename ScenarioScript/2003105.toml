[translation]
2003105-1 = "С теплом"
2003105-2 = "Мне стало интересно, что Шигурэ имела в виду под «молочным барменством», поэтому я отправился к горячему источнику, где она работала."
2003105-3 = ""
2003105-7 = ""
2003105-8 = "Привет, Сенсей."
2003105-9 = "Я как раз собиралась приступать к работе."
2003105-10 = "Прошёл примерно час с тех пор, как первый человек пошёл в ванну, так что скоро должны появиться клиенты."
2003105-11 = "[s] «Так... Что именно значит „молочное барменство“?»"
2003105-12 = "Именно то, как звучит, Сенсей."
2003105-13 = "После ванны клиент подходит ко мне и рассказывает, что любит. А я смешиваю для него свежий стакан фруктового молока, идеально подходящий под вкус."
2003105-14 = "Сначала владелец источника не был уверен насчёт этой идеи..."
2003105-15 = "Но я сказала, что мне не нужна зарплата, если позволят готовить напитки как захочу, и они согласились попробовать."
2003105-16 = "Я могу сколько угодно испытывать новые рецепты, а клиенты получают лучшее фруктовое молоко в своей жизни... Все в выигрыше."
2003105-17 = "[s1] «Если тебя это устраивает, Шигурэ...»\n[s2] «Только не добавляй в молоко ничего странного...»"
2003105-20 = "Хи-хи. Почему бы вам не сесть вон там и не посмотреть, как я работаю?"
2003105-21 = "У меня есть свежее молоко, стаканы для смешивания, мадлер..."
2003105-22 = ""
2003105-24 = ""
2003105-25 = ""
2003105-26 = "Ну что же... Лучше смешаю молоко и поменяю воду в ванне."
2003105-30 = ""
2003105-32 = ""
2003105-33 = "Фух... Какая чудесная ванна..."
2003105-34 = "Но после столь долгого сидения в горячей воде меня ужасно мучает жажда..."
2003105-35 = "Простите. У вас есть фруктовое молоко?"
2003105-36 = "Да, конечно! Какой вкус хотите?"
2003105-37 = "У-У вас их несколько? Даже не знаю, что сказать..."
2003105-38 = "Не знаю. Что-нибудь не слишком сладкое."
2003105-39 = "Не слишком сладкое...? Оставьте это мне."
2003105-48 = ""
2003105-49 = "Вот, пожалуйста. Тройное ягодное молоко."
2003105-50 = "Здесь смешаны брусника и клюква, они совсем не сладкие, а для вкуса добавлена малина. Попробуйте."
2003105-51 = "Так, посмотрим..."
2003105-52 = ""
2003105-54 = ""
2003105-55 = ""
2003105-56 = ""
2003105-57 = "И правда не слишком сладко. А молоко смягчает кислоту ягод, поэтому вкус не слишком резкий..."
2003105-58 = "Никогда раньше не пробовал фруктовое молоко с таким роскошным вкусом!"
2003105-59 = "Хи-хи, я рада, что вам понравилось."
2003105-60 = ""
2003105-62 = ""
2003105-63 = ""
2003105-66 = ""
2003105-67 = "Простите, но у меня непереносимость лактозы. От молока у меня ужасно болит живот..."
2003105-68 = "Но я всё равно очень хотела бы попробовать одно из ваших фруктовых молочных напитков, если можно."
2003105-69 = "Конечно. Одну минуту."
2003105-79 = ""
2003105-80 = "Вот, пожалуйста. Тропическое соевое молоко — полностью без лактозы!"
2003105-81 = "Тропические фрукты должны помочь пищеварению."
2003105-82 = ""
2003105-84 = ""
2003105-85 = ""
2003105-86 = ""
2003105-87 = "Вы правы... Вкус такой лёгкий и чистый. Я могла бы выпить несколько чашек подряд!"
2003105-88 = "Посмотрите на меня: наслаждаюсь хорошим фруктовым молоком после горячей ванны, как все остальные... Мечта сбылась!"
2003105-89 = "Рада, что вкусно, но если выпьете слишком много, живот всё равно расстроится. Давайте сегодня ограничимся одним стаканом."
2003105-90 = ""
2003105-92 = ""
2003105-93 = ""
2003105-96 = ""
2003105-97 = "Так устала... Даже после горячей ванны без сил... Префектская команда умеет выжимать всё до капли..."
2003105-98 = "Что посоветуете выпить?"
2003105-99 = "Хмм, если вы настолько устали..."
2003105-100 = ""
2003105-102 = ""
2003105-103 = ""
2003105-104 = ""
2003105-106 = "Вот. Один Frenzy Max с фруктовым вкусом."
2003105-107 = ""
2003105-110 = "[ns] «Это вообще считается фруктовым молоком...?»"
2003105-111 = "Хороший бармен подаёт тот напиток, который лучше всего соответствует нуждам клиента."
2003105-112 = "По крайней мере в краткосрочной перспективе, когда вы измотаны, энергетик эффективнее фруктового молока!"
2003105-113 = ""
2003105-115 = ""
2003105-116 = ""
2003105-117 = ""
2003105-118 = "Это не то, чего я ожидала... но я и правда чувствую, что прихожу в себя."
2003105-119 = "Спасибо, что позаботились. Именно это мне и было нужно!"
2003105-120 = "Ничего особенного."
2003105-122 = "Барменство Шигурэ оказалось огромным успехом. Чем дальше шёл день, тем больше клиентов заполняли комнату отдыха в поисках фруктового молока, смешанного специально для них."
2003105-123 = "Я потерял счёт времени, настолько меня заворожило барменское мастерство Шигурэ..."
2003105-126 = "[ns] «Ой, это плохо...»"
2003105-127 = ""
2003105-128 = "Что такое, Сенсей?"
2003105-129 = "...А? Вы так засмотрелись на мою работу, что пропустили последний поезд до Шале?"
2003105-130 = "А в чём проблема? Вы же на горячем источнике."
2003105-131 = "Уверена, вам позволят занять здесь комнату, так что оставайтесь на ночь и—"
2003105-132 = ""
2003105-134 = ""
2003105-135 = "Насчёт этого... Простите, Шигурэ. На сегодня свободных комнат больше нет."
2003105-136 = "Все, кому вы подавали напитки, решили продлить пребывание, чтобы завтра получить ещё вашего фруктового молока..."
2003105-137 = "О нет... Похоже, я перестаралась."
2003105-138 = ""
2003105-140 = ""
2003105-141 = "Что же нам делать, Сенсей? Свободных комнат нет."
2003105-142 = "Спать на улице нельзя. Вы замёрзнете насмерть..."
2003105-143 = ""
2003105-145 = ""
2003105-146 = ""
2003105-147 = "О! Почему бы вам не остаться в моей комнате?"
2003105-148 = "[s] «В твоей комнате...?»"
2003105-149 = "Ага. Для работников горячего источника есть отдельные комнаты."
2003105-150 = "Она тесновата, но это лучше, чем ночевать на морозе."
2003105-151 = "[s3] «Похоже, выбора у меня нет...»\n[s4] «Тогда рассчитываю на тебя сегодня ночью.»"
2003105-154 = "Хи-хи! Дайте мне минутку закончить здесь, а потом покажу комнату."
2003105-156 = ""
2003105-157 = "Хи-хи... Пусть маленькая, зато уютная, правда?"
2003105-158 = "Я уже постелила футон. Можете спать там."
2003105-159 = ""
2003105-161 = "[ns5] «Эм... Шигурэ?»\n[ns6] «Я вижу только один футон...»"
2003105-164 = "А? Конечно. Комната рассчитана на одного человека."
2003105-165 = "Я знаю, футон немного маленький, но если прижаться друг к другу, он должен накрыть нас обоих..."
2003105-168 = "...У вас ведь нет другого выбора, да?"
2003105-169 = ""
2003105-173 = "― [log=시구레 온천ND]Ну же, Сенсей.[/log][wa:580]"
2003105-174 = "― [log=시구레 온천ND]Разве снаружи футона не холодно?[/log][wa:780]"
2003105-177 = "― [log=시구레 온천ND]Не упрямьтесь. Залезайте сюда.[/log][wa:760]"
2003105-180 = "― [log=시구레 온천ND]Футон такой мягкий и тёплый, знаете?[/log][wa:1360]"
2003105-183 = "― [log=시구레 온천ND]Укутаетесь здесь и сразу уснёте.[/log][wa:10]"
2003105-186 = "― [log=시구레 온천ND]А если футон недостаточно тёплый... [/log][wa:1890]"
2003105-189 = "― [log=시구레 온천ND]тогда я добровольно стану вашим личным обогревателем.[/log] [wa:10]"
2003105-192 = "― [log=시구레 온천ND]Хм? Вообще-то у меня была грелка с горячей водой для постели...[/log][wa:230]"
2003105-195 = "― [log=시구레 온천ND]Но дело в том... что я всё выпила.[/log][wa:2790]"
2003105-198 = "― [log=시구레 온천ND]Видите ли, внутри футона[/log][wa:1180]"
2003105-199 = "― [log=시구레 온천ND]была идеальная температура для морса.[/log][wa:2000]"
2003105-202 = "― [log=시구레 온천ND]Поэтому перед работой[/log][wa:10]"
2003105-203 = "― [log=시구레 온천ND]я вылила воду из грелки и наполнила её морсом.[/log][wa:2140]"
2003105-206 = "― [log=시구레 온천ND]Но что сделано, то сделано.[/log][wa:600]"
2003105-209 = "― [log=시구레 온천ND]Такова наша ситуация,[/log]"
2003105-210 = "― [log=시구레 온천ND]и другого способа согреться нет.[/log][wa:2660]"
2003105-213 = "― [log=시구레 온천ND]Так что сегодня ночью[/log]"
2003105-214 = "― [log=시구레 온천ND]вам придётся побыть обогревателем.[/log][wa:2000]"
2003105-217 = ""
2003105-219 = "[ns] Выпить оставшийся морс."
2003105-222 = "А? Что ты делаешь, Сенсей?"
2003105-223 = "Вы выпили весь морс... Настолько хотели пить?"
2003105-224 = "[s7] «...Я почти уверен, что этот морс забродил.»\n[s8] «Я чувствовал запах алкоголя.»"
2003105-227 = "Что? Да ладно."
2003105-228 = "В этом морсе не было ни дрожжей, ни сахара. Без дрожжей или сахара брожения не бывает."
2003105-229 = "К тому же он простоял там всего один день, так что уже забродить не мог—"
2003105-230 = "[s9] «Нет, я уже чувствую, как тело согревается...»\n[s10] «Это точно был алкоголь!»"
2003105-233 = ""
2003105-235 = ""
2003105-236 = "[ns11] «От морса мне стало приятно и тепло.»\n[ns12] «Можешь оставить футон себе, Шигурэ.»"
2003105-239 = "А-ха. Так вот какая у вас игра..."
2003105-240 = "Как хотите. Если вам там удобно, я не могу заставить вас залезть под одеяло, Сенсей."
2003105-241 = "Но я обязательно оставлю здесь для вас место... Если замёрзнете, не стесняйтесь залезать."
2003105-243 = "Так я и провёл остаток ночи, дрожа на холодных татами и не в силах уснуть..."
2003105-244 = "Но я выжил и, кроме лёгкой простуды утром, ничем особенно не пострадал."
