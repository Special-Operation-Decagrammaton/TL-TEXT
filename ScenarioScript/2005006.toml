[translation]
2005006-1 = "Двое под землёй"
2005006-2 = "Внешняя стена Вайлдхант"
2005006-3 = "Сенсей, сюда!"
2005006-4 = "Рицу стояла у маленькой двери с решёткой."
2005006-5 = ""
2005006-7 = ""
2005006-8 = "[ns] «Рицу? Что это...?»"
2005006-9 = "Тссс."
2005006-10 = "Никто не должен узнать, что мы делаем, Сенсей."
2005006-11 = "Ну что ж... Хоп!"
2005006-12 = ""
2005006-15 = ""
2005006-16 = "[ns] «Ты вырвала решётку?!»"
2005006-17 = "Идём, Сенсей!"
2005006-19 = "Я последовал за Рицу в подземный тоннель."
2005006-20 = ""
2005006-23 = "Подземные руины"
2005006-24 = "Та-дам! Это подземные руины, которые я нашла, пока искала новый маршрут для контрабанды!"
2005006-25 = "[s] «Руины?»"
2005006-26 = "Вайлдхант ОЧЕНЬ старая."
2005006-27 = "Говорят, под ней полно забытых руин."
2005006-28 = "А самое лучшее... кажется, это единственный вход!"
2005006-29 = "Сюда, Сенсей."
2005006-31 = "Если протиснуться через этот тоннель..."
2005006-32 = ""
2005006-37 = "― [log=리츠]Ах, ах.[/log][wa:950]"
2005006-39 = "― [log=리츠]Как круто.[/log]"
2005006-42 = "[ns] «Это...?»"
2005006-43 = "― [log=리츠]Разве здесь не здорово?[/log][wa:1480]"
2005006-45 = "― [log=리츠]Похоже на цистерну, построенную очень давно.[/log][wa:170]"
2005006-48 = "― [log=리츠]Они выкопали землю, установили десятки каменных колонн...[/log][wa:2970]"
2005006-50 = "― [log=리츠]и вручную вырезали каждую из них...[/log][wa:430]"
2005006-53 = "[ns] «Словно... святилище.»"
2005006-54 = "― [log=리츠]Красиво, правда?[/log][wa:600]"
2005006-56 = "― [log=리츠]Я очень хотела показать это место тебе, Сенсей.[/log][wa:10]"
2005006-59 = "― [log=리츠]Иди сюда.[/log][wa:2140]"
2005006-61 = "― [log=리츠]Давай вместе насладимся этим видом.[/log][wa:1200]"
2005006-64 = "Я ещё некоторое время оставался рядом с Рицу..."
2005006-65 = "...пока наши ноги были погружены в одну и ту же воду."
