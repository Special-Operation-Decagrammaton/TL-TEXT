[translation]
10043060-1 = "Эпизод 6;Горящее поле"
10043060-3 = "Фух..."
10043060-4 = "[s] «Сделаем перерыв?»"
10043060-5 = "Наверное, можно. С учётом плана до следующего звонка мы всё равно мало что можем сделать."
10043060-6 = "Это действительно выматывает сразу на стольких уровнях."
10043060-7 = ""
10043060-11 = ""
10043060-12 = "Знаете, возможно, мне странно такое говорить."
10043060-13 = "Но бейсбол... в некоторых отношениях довольно странный."
10043060-14 = "[s] «Почему?»"
10043060-15 = "Ну, хотя бы в том, что команда с мячом играет в защите."
10043060-16 = "Мяч используется во множестве видов спорта. Футбол, баскетбол, волейбол, гольф... Но везде там тот, у кого мяч, находится в нападении."
10043060-19 = "А в бейсболе наоборот. Питчер защищающейся команды бросает мяч мимо отбивающего атакующей команды."
10043060-20 = "А потом нападение бьёт по мячу, пытаясь заработать очки. И ещё очень многое зависит от удачи."
10043060-23 = "Можно сделать чистый хит прямо в аутфилдера, а можно кое-как отбить граундер, который проскользнёт вдоль фол-линии и случайно даст тебе дабл."
10043060-24 = "Так что нельзя сказать, будто всё решает мастерство, но мастерство всё же важно — значит, и одной удачей всё не объяснить."
10043060-25 = "И как фанатке и спортсменке мне хотелось бы, чтобы хоть КОГДА-НИБУДЬ окупилось хоть мастерство, ХОТЬ удача."
10043060-26 = "А когда этого не происходит, я могу расстроиться, разочароваться или даже разозлиться."
10043060-27 = ""
10043060-29 = ""
10043060-30 = "...Странно, знаете?"
10043060-31 = "Так сильно что-то любить и при этом быть к нему настолько суровой."
10043060-32 = "[s1] «Может, потому что хочется получить взамен...»\n[s2] «...столько же, сколько ты сама в это вложила?»"
10043060-35 = "Что ж, возможно, для некоторых это и правда так."
10043060-36 = "Но вы не такой."
10043060-37 = "[s] «Я?»"
10043060-38 = "Ну да, вам ведь от происходящего здесь ничего не достанется."
10043060-39 = "Сумирэ тоже. Я фанатка, мне логично быть здесь. Но вы?"
10043060-40 = "Вы могли просто проигнорировать всю эту ситуацию и уйти. Но не стали. Вы никогда так не делаете."
10043060-41 = "И не думаю, что потому, что хотите что-то получить взамен. С самого прихода вы помогаете бескорыстно."
10043060-42 = "Если вы ВСЁ-ТАКИ чего-то хотите, можете просто сказать. Я пойму."
10043060-43 = "И не пытайтесь выкрутиться. Не пожимайте плечами со словами: «Просто захотелось». Не сработает."
10043060-44 = ""
10043060-47 = "[ns] «Ну, если честно...»"
10043060-49 = "[ns] «Потому что мне нравится видеть вас.»"
10043060-50 = ""
10043060-52 = ""
10043060-53 = "Ч-Что?! Видеть нас?"
10043060-54 = "[s3] «Именно. У каждой из вас по-своему огромный потенциал.»\n[s4] «Мне нравится видеть, как вы этим потенциалом пользуетесь.»"
10043060-58 = "[ns5] «И если в процессе я могу хоть чем-то...»\n[ns6] «...помочь вам получить желаемое или стать теми, кем вы хотите...»"
10043060-61 = "[ns7] «Возможно, одного этого уже достаточно.»\n[ns8] «Вот что я чувствую.»"
10043060-66 = ""
10043060-67 = "...Вы это у Сумирэ подхватили?"
10043060-68 = "[s] «Эм, ну, то есть...»"
10043060-69 = "Неважно. Просто прозвучало как что-то, что сказала бы она."
10043060-70 = "В общем..."
10043060-71 = ""
10043060-73 = ""
10043060-75 = ""
10043060-76 = "...спасибо. Хи-хи."
10043060-77 = "...Вы первый человек, который столько слушал мою болтовню и всё равно воспринимал меня всерьёз."
10043060-78 = ""
10043060-83 = ""
10043060-85 = ""
10043060-87 = "Итак, нижняя половина седьмого. Вы слушаете?"
10043060-88 = "...! Д-Да, слушаем!"
10043060-90 = "Хорошо. Теперь посмотрите на счёт. 18:21."
10043060-91 = "Вы заставляете их попотеть, да?"
10043060-92 = "У обеих команд осталось по одному запасному питчеру. А теперь вопрос, тренер: какой у вас план?"
10043060-95 = "А-А! Ну, будет полезно сначала вымотать их питчера..."
10043060-96 = "Нам нужен план с фолами!"
10043060-97 = "План с фолами?"
10043060-98 = "Именно. Хиты сейчас не нужны. Сначала нужно увеличить число его подач как можно большим количеством фолов."
10043060-99 = "Если вымотать ему бросковую руку—"
10043060-101 = "Я так и знал, что вы это скажете! Но нет. Это не наш план."
10043060-102 = ""
10043060-104 = ""
10043060-105 = "П-почему?"
10043060-106 = "Да, почему? У нас ещё три иннинга. Если потратить седьмой и восьмой только на то, чтобы его вымотать..."
10043060-107 = "...тогда в нижней половине девятого можно будет выложиться по полной и победить!"
10043060-108 = ""
10043060-110 = ""
10043060-112 = "Посмотрите на уровень своих отбивающих и повторите это ещё раз!"
10043060-113 = "Можете ПЛАНИРОВАТЬ сколько угодно фолов, но ваши парни просто получат страйк-аут, пытаясь их сделать!"
10043060-114 = "Когда до вас уже дойдёт?! Здравый смысл К ВАШЕЙ КОМАНДЕ НЕПРИМЕНИМ!"
10043060-115 = "Э-эм...!"
10043060-116 = "Эй, это было грубо! Не обязательно говорить именно так!"
10043060-117 = "Заткнитесь и слушайте! Здесь нужно мыслить нестандартно!"
10043060-118 = "Бейте изо всех сил и надейтесь заработать хотя бы один ран!"
10043060-119 = "Х-Хорошо, тогда как вам такой вариант? Два раза специально сделать фол на банте, а потом пробить хит?"
10043060-120 = "ТРИ банта автоматически означали бы аут, так что до этого доводить нельзя..."
10043060-121 = "Но разве не полезно заставить питчера потратить хотя бы три подачи на каждого отбивающего?"
10043060-122 = ""
10043060-125 = "..."
10043060-126 = "Хм. Вот это ваша первая хорошая идея."
10043060-127 = "Ого, спасибо."
10043060-129 = "Принимаю этот план. Два фол-банта, потом сильный удар!"
10043060-130 = "И часть подач потратим, и шанс на удачный удар сохраним."
10043060-131 = "И помните: никто не знает, что может случиться в седьмом и восьмом. Держитесь плана и будьте готовы ко всему!"
10043060-132 = "Хорошо!"
10043060-135 = "Нижняя половина седьмого. Heroes в нападении, Pillagers в защите. Счёт 18:21."
10043060-136 = "Матч определённо результативный, но Heroes всегда сильнее всего, когда немного отстают."
10043060-137 = "Вот бы им хоть раз удалось догнать."
10043060-138 = "Посмотрим, получится ли в этот раз. Какую стратегию они выберут?"
10043060-139 = ""
10043060-142 = ""
10043060-143 = ""
10043060-144 = "Хм. Осторожный, намеренный бант. Бант-хиты непросты, а этот отбивающий не самый быстрый."
10043060-145 = "Наверное, пытаются увеличить количество подач."
10043060-146 = ""
10043060-150 = "И вот первая подача!"
10043060-151 = "Ниже, пересечь фол-линию. Ниже..."
10043060-152 = "Пожалуйста... Пожалуйста...!"
10043060-153 = ""
10043060-159 = ""
10043060-166 = "Святые тарелочки! Не верю своим глазам! Флай после банта прямо к питчеру! Аут с первой же подачи!"
10043060-167 = "Что ж, это было... творчески."
10043060-168 = "Уж лучше бы с самого начала честно били, если всё должно было закончиться ВОТ ТАК..."
10043060-171 = "..."
10043060-172 = "..."
10043060-173 = "Как... Как это...?"
10043060-174 = ""
10043060-178 = "А теперь даже не вздумайте снова мне возражать! Поняли? Просто делайте, что я говорю! ДЕЛАЙТЕ ТОЧНО, ЧТО Я ГОВОРЮ!!"
10043060-179 = ""
10043060-181 = ""
10043060-182 = "С-Сенсей, всё плохо..."
10043060-183 = "[s] «Насколько именно плохо?»"
10043060-184 = "Если так продолжится, мы можем получить ещё два аута с первой подачи. Иннинг закончится всего через две подачи!"
10043060-185 = "Тогда преступник повесит трубку, и мы больше не сможем его отследить!"
10043060-186 = "[s] «Вот это действительно плохо.»"
10043060-187 = ""
10043060-191 = "[ns] «...Погодите. Новый план.»"
10043060-195 = "Какой ещё новый план? Что вы имеете в виду?"
10043060-196 = "Хм? Заставить отбивающих брать тайм-ауты, чтобы сбивать ритм питчера?"
10043060-197 = "План с «тайм-аутами»..."
10043060-198 = "..."
10043060-199 = "Это и правда выглядит безопасно. И отбивание, и питчинг во многом строятся на том, чтобы сбить ритм соперника..."
10043060-200 = "Ладно. Попробуем."
10043060-201 = ""
10043060-203 = ""
10043060-204 = "Хорошая работа, Сенсей. Так они дольше останутся на линии."
10043060-207 = ""
10043060-208 = ""
10043060-209 = "Ещё один тайм-аут! Почему их так много, да ещё и в нижней половине седьмого?"
10043060-210 = ""
10043060-214 = "...Святые пироги! Судья только что удалил отбивающего!"
10043060-215 = "Наверное, он решил, что отбивающий намеренно затягивает матч. Что ж, судья вправе принять такое решение. Heroes придётся выпустить замену."
10043060-216 = "Ух...!"
10043060-217 = ""
10043060-221 = "Я больше никогда не послушаю ни единого слова из вашего жалкого рта."
10043060-222 = "Если вы только РОТ откроете, я в ту же секунду со ВСЕМ покончу!"
10043060-223 = ""
10043060-226 = ""
10043060-227 = "Сенсей! Кажется, я нашла преступника!"
10043060-228 = ""
10043060-232 = ""
10043060-233 = "Тренер, Рэй, вы меня слышите? Кажется, я знаю, где они!"
10043060-234 = "[s] «Правда? Где?!»"
10043060-235 = "Места за кэтчером..."
10043060-236 = "[s] «А? Это же...!»"
10043060-237 = "Верно, Тренер."
10043060-238 = "Именно туда, по словам Ханаэ, исчезли остальные подработчики."
10043060-239 = "И это самые дорогие места, потому что оттуда лучший обзор."
10043060-241 = "И правда похоже на место, откуда удобно проворачивать что-то подобное."
10043060-242 = "Хорошо, Сенсей, как только звонок закончится, расскажем тренеру и остальным Heroes!"
10043060-244 = "Кстати, запасной отбивающий Heroes и следующий после него..."
10043060-245 = "...оправдали ожидания: каждый продержался всего одну подачу."
