[translation]
83301300200-5 = ""
83301300200-6 = "Глава префектов, вы в порядке? Я слышала, вы участвовали в бою."
83301300200-7 = "Со мной всё нормально."
83301300200-8 = "Что произошло?"
83301300200-9 = "Я расследовала деятельность Отдела горячих источников и обнаружила одну из их рабочих групп за подозрительными делами в подземельях Геенны."
83301300200-10 = "Насколько мне удалось выяснить... всё связано с операцией «Пузырь Геенны»."
83301300200-11 = "«Пузырь... Геенны»?"
83301300200-12 = "Предположительно, это план по созданию идеального горячего источника в Геенне."
83301300200-13 = "Столько секретности ради ещё одного горячего источника в Геенне?"
83301300200-14 = "Эм... Вы ведь не шутите, да?"
83301300200-15 = "...?"
83301300200-16 = "Н-Неважно!"
83301300200-17 = "Как бы то ни было, допрос руководителя их рабочей группы позволил мне сделать несколько предварительных выводов."
83301300200-18 = "Но никаких следов Касуми, главы Отдела горячих источников, я пока не нашла."
83301300200-20 = "А, насчёт её местонахождения... Я уже отправила Префектурную команду искать любую информацию."
83301300200-21 = ""
83301300200-23 = ""
83301300200-25 = ""
83301300200-27 = "Они доложили, что председатель Макото может знать, как её найти."
83301300200-28 = "Макото...?"
83301300200-29 = "Да. Якобы после заказа на разработку горячего источника она сказала что-то вроде: «Я лично навещу нынешнее убежище Отдела горячих источников»."
83301300200-30 = "...Понятно."
83301300200-31 = "Она могла сказать нам об этом раньше, прежде чем мы потратили столько времени на поиски!"
83301300200-32 = "Даже если она и знает, думаете, Макото добровольно поделится с нами информацией?"
83301300200-33 = "...Нет. Пожалуй, ты права..."
83301300200-34 = "Я сама навещу председателя."
