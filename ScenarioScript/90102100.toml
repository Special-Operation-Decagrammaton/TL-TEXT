[translation]
90102100-1 = "Episode 10;Bullet Train"
90102100-4 = "Breaching formation on both sides of the door."
90102100-5 = "After entry, fan out left and right to cover our blind spots."
90102100-6 = "Breaching. #n...3, 2, 1!"
90102100-11 = "Left side clear."
90102100-12 = "Right side clear."
90102100-13 = "Rear is all clear. #nCar 7, secured."
90102100-14 = "Moving to the next car."
90102100-19 = "...This is weird."
90102100-20 = "...Yeah, it is."
90102100-22 = "[ns] \"What's wrong?\""
90102100-23 = "I might be imagining things, but..."
90102100-24 = "Weren't there only about 8 cars on this train?"
90102100-25 = "[s] \"Now that you mention it, it didn't feel all that long.\""
90102100-26 = "Right? And yet, we're already on the 8th car... #nThere's no sign of us reaching the lead car."
90102100-27 = "And besides... look outside. #nIt's pitch black, we have no idea where we're running..."
90102100-28 = "It's like we're just running in endless circles inside a circular train."
90102100-29 = "[s1] \"Now that you mention it...\"\n[s2] \"To think we'd actually get lost inside a train...\""
90102100-35 = "Everyone, halt. Maintain current positions."
90102100-36 = "We will resume the operation after a brief briefing."
90102100-39 = "...This is getting us nowhere."
90102100-40 = "I judge that continuing to move to the previous cars is pointless, but...#nSensei, what do you think?"
90102100-41 = "[s3] \"I'm inclined to agree.\"\n[s4] \"Looks like we need to find another way, though...\""
90102100-44 = "Wait, didn't this rumor originate from a desire to return to the past?"
90102100-45 = "There was nothing about getting lost inside a train, so why is this happening?"
90102100-46 = "Since we can't actually turn back time, #nmaybe it's trying to trap its target in a scenery of the past."
90102100-47 = "Or maybe, just like the \"Drum Can Crab\", it's mixed with other rumors and imagery related to trains."
90102100-48 = "Does anyone know anything?"
90102100-49 = "Come to think of it, isn't Shinkoku Station undergoing construction lately? #nI heard some weird rumors about Shinkoku Station."
90102100-50 = "Apparently, someone keeps messing with the exit signs, so even when you follow the directions, you just end up walking in circles around the same spot."
90102100-51 = "That sounds a bit like our current situation, but... this is a train, not a station, right?"
90102100-52 = "True. Besides, isn't getting lost inside a station a common occurrence at other stations too?"
90102100-53 = "Are there any other urban legends?"
90102100-54 = "Hmm... I heard about this one a little while ago, too."
90102100-55 = "Trains during commute hours are usually packed, right? #nApparently, though, there's sometimes a single car that's completely empty."
90102100-56 = "And you're apparently never supposed to board a car like that."
90102100-57 = "Why?"
90102100-58 = "I don't really know the reason... but that's how rumors go, right? #nBesides, there's no good reason to deliberately go where people are avoiding..."
90102100-60 = "That's a ghost story I'm hearing for the first time... and besides, nobody was on this train to begin with, so isn't it irrelevant?"
90102100-61 = "Any other rumors..."
90102100-62 = "Ugh... no good. #n\"The experience of getting beaten up by a Highlander student\" is just too intense..."
90102100-63 = "Same here."
90102100-64 = "Which reminds me, are there no crew members on this train? #nIf there were, we could interrogate them..."
90102100-65 = "[s] \"SRT-style interrogation...\""
90102100-70 = "[ns] \"Maybe they aren't showing up because there's no trouble inside the cars?\""
90102100-71 = "No trouble, so they don't show up..."
90102100-72 = "As expected of Sensei. A great idea."
90102100-73 = "[s] \"Did I really say anything that important...?\""
90102100-74 = "No, you are completely right, Sensei."
90102100-75 = "If advancing gets us nowhere, we can just summon the crew."
90102100-76 = "Drawing them out into a situation favorable to us is the fundamental rule of special tactics."
90102100-80 = "Everyone, defensive stance. Secure the rear door, then set up cover."
90102100-81 = "FOX 3, maintain forward security. FOX 2 and FOX 4, to the rear. Maintain spacing."
90102100-82 = "Acknowledged."
90102100-83 = "Position yourselves so your lines of fire don't overlap, and keep your eyes on the front. I'll give the signal shortly."
90102100-84 = "...Emergency stop switch, ON."
90102100-90 = "\"Attention passengers. We have confirmed the activation of the in-cabin emergency stop switch.\""
90102100-91 = "\"Passengers are requested to take a seat or hold onto the straps.\""
90102100-92 = "\"To confirm the situation, a crew member is heading to the car where the emergency stop switch was activated.\""
90102100-93 = "\"Furthermore, if improper use of the emergency stop switch is confirmed outside of an emergency, #nmeasures such as 'live-filleting', 'gutting', or 'mincing' may be taken #nin accordance with the Railway Safety Act.\""
90102100-94 = "\"For a safe and secure ride, please cooperate with the crew's investigation.\""
90102100-95 = "...Live-filleting? What's that?"
90102100-96 = "Don't overthink the details of an urban legend. #nWhat matters is that we got a proper response."
90102100-97 = "...They're coming."
90102100-104 = "What is that? They're definitely not Highlander students."
90102100-105 = "...A beast? #nNo, it's unusually large for a living creature, and its movements are weird."
90102100-109 = "It makes gear-like noises and smells like oil..."
90102100-110 = "Feels kind of like an animatronic at an amusement park."
90102100-117 = ".........Phew."
90102100-118 = "FOX 1, are you okay?"
90102100-119 = "I'm fine. I just remembered a memory that makes me slightly nauseous."
90102100-121 = "[ns] \"Are you really okay?\""
90102100-122 = "I'm fine."
90102100-123 = "As I said before... Sensei, please do not leave my side."
90102100-128 = "Everyone. Do not move under any circumstances until the enemy enters the kill zone."
90102100-134 = "...3, 2, 1."
90102100-138 = "Open fire."
