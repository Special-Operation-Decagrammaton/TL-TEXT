[translation]
90102100-1 = "Эпизод 10;Пулевой поезд"
90102100-3 = ""
90102100-4 = "Штурмовой порядок по обе стороны от двери."
90102100-5 = "После входа рассредоточиться влево и вправо, прикрыть слепые зоны."
90102100-6 = "Входим.#n...3, 2, 1!"
90102100-7 = ""
90102100-11 = "Левая сторона чиста."
90102100-12 = "Правая сторона чиста."
90102100-13 = "Сзади чисто.#nВагон 7 захвачен."
90102100-14 = "Переходим в следующий вагон."
90102100-18 = ""
90102100-19 = "...Странно."
90102100-20 = "...Ага."
90102100-21 = ""
90102100-22 = "[ns] «Что случилось?»"
90102100-23 = "Может, мне и кажется..."
90102100-24 = "Разве в этом поезде не было около восьми вагонов?"
90102100-25 = "[s] «Действительно, он не казался таким уж длинным.»"
90102100-26 = "Вот именно? А мы уже в восьмом...#nИ никаких признаков головного вагона."
90102100-27 = "И ещё... посмотри в окно.#nКромешная тьма, непонятно даже, где мы едем..."
90102100-28 = "Словно мы бесконечно кружим внутри кольцевого поезда."
90102100-29 = "[s1] «Если подумать...»\n[s2] «Не думал, что заблужусь в поезде...»"
90102100-32 = ""
90102100-34 = ""
90102100-35 = "Всем остановиться. Оставаться на текущих позициях."
90102100-36 = "После короткого инструктажа возобновим операцию."
90102100-37 = ""
90102100-39 = "...Так дело не сдвинется."
90102100-40 = "Продолжать двигаться вперёд бессмысленно...#nЧто думает учитель?"
90102100-41 = "[s3] «Я того же мнения.»\n[s4] «Похоже, нужно искать другой способ...»"
90102100-44 = "Но ведь эта аномалия родилась из желания вернуться в прошлое?"
90102100-45 = "О том, что можно заблудиться в поезде, речи не было, почему же так вышло?"
90102100-46 = "Поскольку на самом деле вернуть время вспять невозможно,#nвозможно, оно пытается запереть объект в пейзаже прошлого."
90102100-47 = "Или, как в случае с «Крабом-бочкой», в него подмешались другие слухи и образы, связанные с поездом."
90102100-48 = "Все, кто-нибудь что-то знает?"
90102100-49 = "Кстати, станция Шингун, где недавно шёл ремонт, ведь есть?#nЯ слышала странный слух о станции Шингун."
90102100-50 = "Мол, кто-то переделал указатели, и, идя по указателям, бесконечно ходишь по кругу на одном и том же месте."
90102100-51 = "Похоже на нашу ситуацию, но... это же поезд, а не станция?"
90102100-52 = "Точно. К тому же разве не бывает, что заблудишься и на других станциях?"
90102100-53 = "А из других городских легенд что-нибудь есть?"
90102100-54 = "Ммм... это я тоже слышал недавно."
90102100-55 = "В час школьников поезда часто набиты под завязку, верно?#nНо говорят, иногда один вагон бывает пуст."
90102100-56 = "И в такой вагон ни в коем случае нельзя садиться."
90102100-57 = "Почему?"
90102100-58 = "Точно не знаю... но слухи ведь такие?#nК тому же нет ничего хорошего в том, чтобы лезть туда, чего люди избегают..."
90102100-60 = "Я впервые слышу эту страшилку... и к тому же в этом поезде изначально никого не было, так что, наверное, это не связано?"
90102100-61 = "Ещё слухи..."
90102100-62 = "Ммм... не выходит.#n«История о том, как меня избила ученица Хайлендера» слишком яркая..."
90102100-63 = "То же самое."
90102100-64 = "Кстати, а в этом поезде нет проводников?#nЕсли бы они были, мы могли бы их допросить..."
90102100-65 = "[s] «Методы допроса SRT...»"
90102100-66 = ""
90102100-67 = ""
90102100-70 = "[ns] «Может, они не появляются, потому что в вагоне ничего не случилось?»"
90102100-71 = "Если нет проблем, не приходят..."
90102100-72 = "Как и ожидалось от Сенсея. Хорошая идея."
90102100-73 = "[s] «Разве я сказал что-то настолько важное...»"
90102100-74 = "Нет, всё именно так, как говорит Сенсей."
90102100-75 = "Если сколько ни иди, ничего не меняется, достаточно вызвать проводника."
90102100-76 = "Выманить противника в выгодное для себя положение — основа специальной тактики."
90102100-77 = ""
90102100-79 = ""
90102100-80 = "Всем, оборонительная готовность. Закрепить заднюю дверь, установить укрытия."
90102100-81 = "FOX3 продолжает наблюдать впереди. FOX2 и FOX4 — назад. Держать дистанцию."
90102100-82 = "Принято."
90102100-83 = "Расположиться так, чтобы линии огня не пересекались, следить за фронтом. Немедленно дать сигнал."
90102100-84 = "...Аварийный стоп-кран, ON."
90102100-85 = ""
90102100-90 = "«Уважаемые пассажиры. Подтверждено срабатывание аварийного стоп-крана в вагоне»"
90102100-91 = "«Пожалуйста, займите места или держитесь за поручни»"
90102100-92 = "«Для выяснения обстоятельств к вагону, где сработал аварийный стоп-кран, направляется проводник»"
90102100-93 = "«Кроме того, при подтверждении неправомерного использования аварийного стоп-крана вне чрезвычайной ситуации,#nв соответствии с Законом о безопасности железных дорог могут быть применены такие меры,#nкак \"живое приготовление\", \"выдалбливание\", \"фарш\" и т. п.»"
90102100-94 = "«Для вашей безопасности просим оказать содействие в расследовании проводника»"
90102100-95 = "...Живое приготовление? Что это?"
90102100-96 = "Не придирайся к деталям городских легенд.#nГлавное — реакция последовала."
90102100-97 = "...Идёт."
90102100-98 = ""
90102100-104 = "Что это? Это же не студент Хайлендера."
90102100-105 = "...Зверь?#nНет, для живого существа оно слишком большое, и движения странные."
90102100-109 = "Звук, будто шестерни, и запах масла..."
90102100-110 = "Похоже на аниматроника из парка развлечений."
90102100-111 = ""
90102100-117 = "......Фух."
90102100-118 = "FOX1, ты в порядке?"
90102100-119 = "В порядке. Просто вспомнила одно тошнотворное воспоминание."
90102100-121 = "[ns] «Точно всё в порядке?»"
90102100-122 = "Всё в порядке."
90102100-123 = "Как я уже говорила... Сенсей, ни в коем случае не отходите от меня."
90102100-124 = ""
90102100-128 = "Всем. Не двигаться, пока противник не войдёт в зону поражения."
