[translation]
80000044-1 = "Решимость геймера"
80000044-2 = "По какой-то причине в игровом центре на День святого Валентина проводили турнир по файтингам..."
80000044-3 = ""
80000044-9 = "Сегодня мой день! Победа будет моей, и шоколад за первое место уйдёт со мной!"
80000044-10 = "Отойди и смотри, как работает мастер, Сенсей!"
80000044-11 = "Легенда чемпиона Сайбы Момои начинается сейчас!"
80000044-12 = "ПОГНА-А-А-АЛИ!!!"
80000044-20 = "Нееееет! Как меня могли выбить в первом же раунде?!"
80000044-22 = "Мне пришлось утешать Момои после вылета из турнира."
80000044-23 = "Не верю. Это было совершенно нечестно!"
80000044-24 = "Они просто снова и снова жали один и тот же удар ногой!"
80000044-25 = "Да, правила это не запрещают, но это дешёвый трюк."
80000044-26 = "Настоящий геймер дерётся честно!"
80000044-27 = "[s] «Было круто, как ты активировала ульту почти без HP.»"
80000044-28 = "Правда?! Я была прижата к стене, так что пришлось создавать окно для атаки!"
80000044-29 = "Это Angry Arts — ульта специально для ситуаций с низким HP."
80000044-30 = "[s] «Хотя похоже, противник её ожидал.»"
80000044-31 = "А-а-а-а-а! Нечестно!!!"
80000044-32 = "*вздох* Ладно... Обидно, что я не выиграла шоколад."
80000044-33 = "[s] «Так сильно хотела?»"
80000044-34 = "Ну, сколько раз в жизни вообще удаётся участвовать в турнире по файтингу на День святого Валентина?"
80000044-35 = "К тому же мой план был выиграть шоколад..."
80000044-36 = "...а потом подарить его тебе."
80000044-37 = "[s] «План?»"
80000044-38 = "Ты ничего не слышал! Удали это из внутренней памяти.#nЭто должен был быть сюрприз!"
80000044-39 = "Вот же. Сегодня я постоянно оставляю защиту открытой."
80000044-40 = "[s] «Главное внимание. Спасибо, Момои.»"
80000044-41 = "*ах* Это завершающий приём Сенсея! Заботливая реплика!#nЯ знала, что это лишь вопрос времени."
80000044-42 = "Нечестно, что ты так легко говоришь крутые взрослые вещи!"
80000044-43 = ""
80000044-45 = ""
80000044-46 = "Н-Но я не могу просто закончить на этом. Нужно что-то ещё сделать перед уходом."
80000044-47 = ""
80000044-49 = ""
80000044-51 = ""
80000044-52 = "Хм? Что это за звук? Это что, автомат-хватайка?!"
80000044-53 = "Придумала! Жди здесь, Сенсей!"
80000044-54 = ""
80000044-56 = ""
80000044-57 = "[ns] «Куда ты, Момои?!»"
80000044-62 = "Я вернулась, Сенсей, и принесла подарок!"
80000044-64 = "[s] «Шоколад с игрушкой внутри?»"
80000044-65 = "Хех! От тебя ничего не скроешь."
80000044-66 = "В этом шоколадном яйце фигурка маскота из файтинга,#nв который я только что играла: «Кулак Кассиопеи — Великая битва Упалупы».#nВсего в наборе семь фигурок."
80000044-67 = "Мало кто знает, но в индустрии для таких вещей есть специальный термин.#nЭто называется..."
80000044-68 = "...сёкуган! То есть маленькая игрушка, которая идёт вместе с едой."
80000044-69 = "[s1] «Это правда официальный термин?»\n[s2] «Ты немало об этом знаешь.»"
80000044-70 = "Сначала мой план был выиграть турнир и подарить тебе шоколадный приз..."
80000044-71 = "Сначала мой план был выиграть турнир и подарить тебе шоколадный приз..."
80000044-72 = "...но я не хотела сдаваться только потому, что вылетела."
80000044-73 = "Так что вместо этого дарю тебе утешительный приз, который выиграла сама!"
80000044-74 = "Получается, миссию я всё-таки выполнила."
80000044-75 = "Хех."
80000044-76 = "Теперь, когда сказала вслух, звучит немного крипово.#nДавай сделаем вид, что этого не было..."
80000044-77 = "[s3] «Ты шутишь?! Это лучший подарок в мире!»\n[s4] «Получен легендарный шоколад Момой ко Дню святого Валентина!»"
80000044-80 = ""
80000044-82 = ""
80000044-83 = "[ns] «Давай поделим.»"
80000044-84 = "Я..."
80000044-85 = ""
80000044-87 = ""
80000044-88 = "Вообще-то я и себе один достала!"
80000044-89 = "Так что да! Давай съедим, а потом устроим битву наших Упалуп!"
