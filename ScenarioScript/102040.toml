[translation]
102040-1 = "Эпизод 4; Планирование операции 2"
102040-4 = "Это..."
102040-5 = "Н-Небо становится красным... Что происходит...?"
102040-6 = "Сенсей из Шале прислал сообщение... Думаю, ему нужна помощь."
102040-7 = "Н-Но мы вообще сможем помочь? Мы ведь в бегах... А вдруг только помешаем Сенсею...?"
102040-8 = "Не волнуйся. Мы найдём способ помочь Сенсею."
102040-9 = "Но... чем мы можем помочь...?"
102040-10 = ""
102040-12 = ""
102040-14 = "...Кто там?"
102040-15 = "Н-Неужели...?"
102040-16 = "..."
102040-17 = ""
102040-19 = ""
102040-21 = ""
102040-22 = ""
102040-23 = "..."
102040-25 = "?!"
102040-26 = "..."
102040-27 = "..."
102040-28 = ""
102040-30 = "Наконец-то я вас нашла. Я вас повсюду искала."
102040-31 = ""
102040-33 = ""
102040-35 = ""
102040-39 = "А?! Откуда у тебя этот пистолет, Мисаки?!"
102040-40 = "Ты кто?"
102040-41 = "Да. Ты выглядишь очень подозрительно."
102040-42 = "П-Подождите! Я-я..."
102040-43 = "А, шлем... Это для подработки..."
102040-44 = ""
102040-46 = ""
102040-47 = "О! Доброе утро, Саори. Сделала перерыв в поисках себя?"
102040-48 = ""
102040-50 = ""
102040-51 = ""
102040-52 = "Д-Да... вроде того..."
102040-54 = "«Поиски себя» — слишком щедро сказано. Она просто сбежала."
102040-55 = "Лидер..."
102040-56 = "...Прости, я тоже хотела бы поговорить, но времени нет. Сенсею нужна наша помощь."
102040-57 = "Да. Мы тоже получили сообщение."
102040-58 = "Да-да! Точно!"
102040-59 = ""
102040-61 = ""
102040-62 = "Рада видеть, что ты в порядке, командир."
102040-64 = "...Ага."
102040-65 = "Тогда идём."
102040-69 = "Я Урава Ханако, руководитель операции четвёртого святилища!"
102040-70 = "Все готовы?"
102040-71 = ""
102040-72 = "...Да. Подразделение Сестринство ждёт у входа в катакомбы святилища."
102040-73 = "Кстати, я уже какое-то время не вижу Сакурако. Куда она делась...?"
102040-74 = ""
102040-75 = "Рыцари, занять позиции в районе операции."
102040-76 = "П-Приятно работать с вами!"
102040-78 = "Команда пятого святилища, доложите обстановку."
102040-80 = "...Ноа, тут возникла проблема."
102040-81 = "Проблема? Какая?"
102040-82 = "Hod скрылся под землёй в Городе-крепости. Мы пытаемся определить его местоположение..."
102040-83 = "Проблема в том, что Город-крепость в Эрид защищён системой паролей, которую создала сама президент Рио. Прослушивание, анализ вибраций или шумов тут бесполезны."
102040-85 = "...Президент Рио? Но с тех пор, как она пропала, мы с ней не связывались..."
102040-87 = "Верно. Мы прямо сейчас проводим вычисления, чтобы взломать её систему паролей."
102040-88 = "Сами вычисления простые, но требуют много времени и больше оборудования и людей, чем у нас сейчас есть."
102040-89 = "*вздыхает* ...Такими темпами мы можем не успеть к началу операции..."
102040-90 = "Что? Это же серьёзно, разве нет? Но мы тут заняты анализом святилища. Даже если бы хотели помочь..."
102040-91 = "Всё в порядке, Маки, сосредоточься на первом святилище, как и планировали. Как дела у Инженерного отдела?"
102040-92 = ""
102040-93 = "Мы пытаемся найти способ уничтожить построенные Hod Башни эрозии... но пока безуспешно."
102040-94 = "*вздыхает* ...Никак не могу найти решение... Доступ невозможен..."
102040-95 = "Мы ещё анализируем материалы святилища. Мы вымотаны... Простите, но больше на себя не потянем."
102040-96 = "Мне нужно больше спать... Хотя нет, мне просто нужно больше кофеина... и Frenzy MAX..."
102040-97 = "Надо было заранее выносливость прокачать..."
102040-98 = "Сейчас нет смысла мечтать о том, чего уже не изменить."
102040-100 = "Они тоже не могут помочь... Что же делать..."
102040-101 = "Разумеется, в итоге старшая сестра снова только мешает."
102040-103 = "Химари!"
102040-104 = "Разве кто-то когда-то не подделал облигации Миллениум?"
102040-105 = "Система защиты выпуска облигаций тоже была создана Рио. Так кто же тогда это провернул?"
102040-106 = "А? Это была не ты, Химари? В Веритас все белые хакеры, мы не делаем ничего против своих принципов."
102040-107 = "Я? О нет. Мой гений тогда разрывали на столько направлений, что на такие глупые шалости у меня не было времени."
102040-108 = "...Тогда кто?"
102040-109 = ""
102040-111 = ""
102040-112 = ""
102040-113 = "...Юука, ты слушаешь?"
102040-114 = "*вздыхает* Да-да. Слушаю. Похоже, выбора нет."
102040-115 = "Ноа, встреть меня у Комнаты саморефлексии."
102040-116 = "Уже иду."
102040-117 = ""
102040-120 = ""
102040-122 = "Президент... Думаю, это лучший план для Башни эрозии Hod."
102040-123 = "...Отделить Башню эрозии огромным рвом и сжечь?"
102040-124 = "Это правда единственное решение?"
102040-125 = "Знаю... Я надеялась придумать что-нибудь проще... но без дополнительного времени это всё, что мы можем сделать..."
102040-126 = "Инженерный проект такого масштаба... Это уже фактически городская застройка..."
102040-127 = "Как лучше это реализовать? Дроном?"
102040-128 = "А если поставить огнемёт на Thundergun? И лопату с молотом..."
102040-129 = "Хм... Для такого масштаба этого будет недостаточно."
102040-130 = ""
102040-132 = ""
102040-133 = ""
102040-134 = ""
102040-135 = "Где есть горячий источник — там и мы!"
102040-136 = ""
102040-138 = ""
102040-139 = "Ч-Что? Вы кто?!"
102040-140 = "Отдел горячих источников!"
102040-142 = "Отдел горячих..."
102040-143 = "...источников?!"
102040-144 = "Г-Горячие источники? Но у нас их нет..."
102040-146 = "Ха-ха-ха! Мы появляемся везде, где есть горячие источники! А в этот раз — даже там, где их нет!"
102040-147 = ""
102040-148 = "Не забивай голову мелочами! Мы всё уладим раньше, чем заметишь!"
102040-150 = "А...?"
102040-151 = ""
102040-153 = ""
102040-154 = "Копать глубже, сносить здания и сжигать всё вокруг! Вот принцип развития Отдела горячих источников!"
102040-155 = "Главное — в конце концов добраться до горячего источника! Ничего сложного!"
102040-156 = "Мне всегда было интересно, какие горячие источники могут скрываться под Миллениум. Отличная возможность!"
102040-157 = ""
102040-158 = "Ха-ха-ха-ха!"
102040-159 = ""
102040-162 = ""
102040-163 = "К-Какие необыкновенные люди..."
102040-164 = ""
102040-165 = "Перед Комнатой саморефлексии Миллениум"
102040-166 = "*вздыхает*"
102040-167 = ""
102040-169 = ""
102040-170 = ""
102040-171 = ""
102040-172 = ""
102040-174 = ""
102040-177 = "Э-э? А-Алло? Ребята?"
102040-178 = "Кодовое имя Белый Кролик. Нет, Куросаки Коюки. Выходи, тебя освобождают."
102040-179 = "Коюки! Как ты там?"
102040-180 = "А?! Меня освобождают? Сейчас? Почему?"
102040-181 = "Времени нет. Быстрее выходи, Коюки."
102040-182 = "Н-Нет! Почему меня вдруг выпускают? Две старшеклассницы пришли меня освобождать... Я знаю, что это значит!"
102040-183 = "Вы отправите меня в Исправительное бюро! Да? Я права?"
102040-184 = "..."
102040-185 = "..."
102040-186 = "*вздыхает* Придётся вытащить её силой. Помоги, Ноа."
102040-187 = "Хи-хи. Только потому, что выбора нет."
102040-188 = ""
102040-190 = ""
102040-193 = "Что?! А? Н-Не подходите! Вы меня пугаете! Не входите!"
102040-195 = ""
102040-196 = "Ч-Что вообще происходит? Я вела себя тихо! Не устраивала проблем и не пыталась сбежать. Так почему?! Это слишком жестоко! Я против насилия! Это несправедливо!"
102040-197 = "Что, простите?! Ты здесь из-за собственных поступков! Как ты вообще можешь говорить о несправедливости?"
102040-198 = "Ладно, Юука. Думаю, Коюки сожалеет о содеянном... Давайте попробуем поговорить."
102040-199 = "Сожалеет?! Да она вообще не выглядит раскаявшейся!"
102040-200 = "Вот именно! Что значит «раскаяться»? Звучит так, будто я сделала что-то плохое!"
102040-201 = "Я не могла это контролировать... Ну... как несчастный случай!"
102040-202 = "Что? Подделка облигаций была несчастным случаем?!"
102040-203 = "Н-Но ведь это вы приказали страшным старшеклассницам из C&C силой притащить меня сюда! Так что я всё ещё считаю себя жертвой..."
102040-205 = "..."
102040-206 = "...Ладно. Коюки, ты раскаиваешься в содеянном?"
102040-207 = "...Эм, что? Н-Нет, то есть... разве не слабая система паролей была виновата...? Т-Так что..."
102040-208 = "Ко-ю-ки?"
102040-209 = "Ой... Эм... Э-э..."
102040-210 = "Эм... Слушай, можешь не смотреть на меня так? Страшно же..."
102040-211 = "Ладно-ладно! Хорошо! Это всё моя вина."
102040-212 = "А извиниться?"
102040-213 = "Да, конечно. Мне очень жаль, и я ужасно раскаиваюсь..."
102040-214 = "Хи-хи. Какая хорошая девочка."
102040-215 = "Видишь, Юука. Коюки признала ошибку, да? Теперь всё хорошо?"
102040-216 = "Почему ты слушаешь только Ноа?!"
102040-217 = "Ну... Ноа иногда реально страшная... Даже хуже моих худших кошмаров..."
102040-218 = "Когда она вспоминает что-то многолетней давности, с точной датой и временем, и говорит: «Коюки, тогда ты говорила совсем другое...» — с этим жутким блеском в глазах."
102040-219 = "Так если вы не тащите меня в Исправительное бюро, что случилось? От вас двоих я меньше всего ожидала, что вы меня выпустите."
102040-220 = "Нам нужна твоя помощь, Коюки."
102040-221 = "Она говорит правду. Возвращайся в Семинар. Нам нужны твои нелепые способности к вычислениям."
102040-222 = "Что?! Сейчас? В Семинар? Я думала, меня выгнали..."
102040-223 = "Решение отменено. Пока что. Времени нет, всё объясним по дороге."
102040-224 = "Мы принесли твою школьную форму, так что переоденься."
102040-225 = "Н-Но... мне нравится этот наряд..."
102040-227 = "Ко-ю-ки?"
102040-228 = "*хнычет* ...Да, мэм..."
102040-231 = ""
102040-232 = "Осталось последнее... шестое святилище в центральном районе D.U."
102040-233 = "Привет! Как дела?"
102040-234 = ""
102040-235 = "Центральный район D.U."
102040-236 = "Все жители эвакуированы. Мы построили несколько убежищ в тридцати километрах от Sanctum Tower."
102040-237 = "Но людей всё равно не хватает, хотя Валькирия и добровольцы уже дежурят в убежищах и помогают жителям. И еды мало."
102040-238 = ""
102040-239 = "Вот, попробуй. Эту кашу приготовила Фуука. Сразу согреешься!"
102040-240 = "Спасибо..."
102040-241 = ""
102040-243 = ""
102040-244 = "Джури, следующая партия супа готова. Раздашь, пожалуйста?"
102040-245 = "Ага, уже!"
102040-246 = "Фух... Ладно, дальше..."
102040-247 = "Я могу чем-нибудь помочь с готовкой?"
102040-248 = "Всё нормально. Я привыкла готовить большими объёмами почти без помощи. Ты пока продолжай раздавать еду, Джури."
102040-249 = "Хорошо! Клуб школьного питания идеально подходит для помощи этому убежищу!"
102040-250 = "Рада, что в этом кризисе мы тоже смогли пригодиться."
102040-251 = "Но... такими темпами у нас могут закончиться продукты..."
102040-252 = ""
102040-254 = ""
102040-256 = "О!"
102040-257 = "Что?! Что происходит?!"
102040-258 = ""
102040-260 = ""
102040-263 = ""
102040-264 = "Хи-хи-хи. Фуука, мы пришли!"
102040-265 = "Наконец-то добрались! ★"
102040-266 = "Общество исследования гурманов? Почему?! И почему вы все промокли?!"
102040-267 = "Мы слышали, что ты делаешь доброе дело для людей, вот и пришли помочь!"
102040-268 = "Смотри! Мы привезли кучу продуктов!"
102040-269 = ""
102040-271 = ""
102040-273 = "Ого... Столько свежей рыбы..."
102040-274 = "Теперь продуктов нам точно хватит!"
102040-275 = "Д-Да... Можно сварить суп, сделать тэмпуру и рыбу на гриле... И по питательности всё будет неплохо!"
102040-276 = "Я даже не стану спрашивать, почему вы сейчас разъезжаете на грузовике Клуба школьного питания..."
102040-277 = "Как бы там ни было, собрать столько рыбы наверняка было непросто..."
102040-279 = "Ещё как! Мы объехали все аквариумы и выловили всю съедобную рыбу...!"
102040-280 = ""
102040-282 = ""
102040-283 = "*ахает*"
102040-284 = "Н-Ну, не будем переживать из-за мелочей!"
102040-286 = "Хи-хи-хи. Точно! Это останется между нами и Клубом школьного питания. В трудные времена надо помогать друг другу!"
102040-287 = "Я бы не назвала это мелочью..."
102040-288 = "Ну, продукты нам были нужны. Мы у вас в долгу, Общество исследования гурманов."
102040-289 = ""
102040-290 = "Хи-хи-хи. Не за что."
102040-291 = "Знаешь, иногда и мы можем быть полезными."
102040-292 = "О, какая прекрасная дружба! ★"
102040-293 = "Кстати, а когда можно будет поесть рыбу?"
102040-294 = ""
102040-295 = "Сейчас район Ширатори в D.U. — ничейная территория, так что можете действовать как угодно."
102040-296 = "Спасибо... Хранителя шестого святилища пока не нашли... но мы определили, что именно там самая мощная энергия среди всех шести святилищ..."
102040-297 = "Когда подтвердим местоположение хранителя, выманим его в пустой район и проведём операцию там."
102040-299 = "Мы — разведчики, которые будут патрулировать дороги по периметру D.U. в поисках хранителя, Хифуми."
102040-300 = "Ух... Почему мы...? Почему я?!"
102040-301 = "Потому что твоему мастерству управления танком нет равных, Хифуми. А я буду рядом и защищу тебя."
102040-302 = "В прошлый раз я победила тридцать членов Отряда правосудия. Даже вдвое больше не станет проблемой."
102040-303 = "Т-Ты их не совсем победила, они просто... Ух, неважно!"
102040-304 = "Я всего лишь хотела сегодня расслабиться и посмотреть специальный фильм с Пероро!"
102040-306 = "Я тоже с нетерпением ждала просмотра Пероро."
102040-307 = "Когда операция закончится, посмотрим его вместе, Хифуми."
102040-308 = "..."
102040-309 = "Ты права... Азуса, давай выложимся на этой миссии!"
102040-310 = "Да."
102040-312 = "Ха-ха-ха! Наконец-то мы готовы!"
102040-313 = "[s] «Ния! Как всё прошло?»"
102040-314 = "Всё в порядке. Кахо, рассчитываю на тебя."
102040-315 = "*вздыхает* ...Конечно. Итак, все готовы?"
102040-316 = ""
102040-318 = ""
102040-319 = "Да! Я прибыла выполнить особую миссию по приказу господина!"
102040-320 = "Я-я здесь..."
102040-321 = "К-Кхм. Я Чидори Мичиру, президент Клуба исследования ниндзюцу! Объявляю своё участие как ниндзя!"
102040-322 = "Я-я тоже...! О-Объявляю... у-участие..."
102040-323 = "[s] «Клуб исследования ниндзюцу...?!»"
102040-324 = "Цукуё! Это важная сцена, показывающая значимость Клуба исследования ниндзюцу! Надо как следует заявить о себе!"
102040-325 = "А? П-Правда...? Мне казалось, моё присутствие и так довольно большое..."
102040-326 = "Хм... Недостаточно!"
102040-327 = "Тогда ладно! Цукуё! Изуна!"
102040-328 = "Да, президент!"
102040-329 = "Ч-Что?! А?"
102040-330 = "Ниндзя, гиперобъединение!"
102040-331 = "Что? П-Прямо здесь?! Объединение?!"
102040-332 = "Да, президент! Идём в смелую атаку! Поняла!"
102040-333 = "..."
102040-334 = "Ня-ха-ха-ха! Вот оно! Знаменитая сцена объединения!"
102040-335 = ""
102040-339 = "Наверняка вы задаётесь вопросом: что такое ниндзя? Что за ниндзюцу, о котором я говорю?"
102040-340 = "Ч-Что же это?"
102040-341 = "...Э-Эм, это правда нормально?"
102040-342 = ""
102040-344 = ""
102040-345 = "Нормально! Ниндзя всегда учатся, исследуют и стремятся к большему..."
102040-346 = "Точно! Просто верь в себя, Цукуё!"
102040-347 = "Мы, трио ниндзя, неустанно трудимся, чтобы показать миру всю прелесть ниндзя!"
102040-348 = "Трио ниндзя! Нин-нин!"
102040-349 = ""
102040-351 = ""
102040-352 = "Когда мы берёмся за дело, даже плачущие младенцы начинают улыбаться!"
102040-353 = "Главный ниндзя-клуб академии Хяккияко!"
102040-354 = ""
102040-355 = "Мы — Клуб исследования ниндзюцу!"
102040-356 = ""
102040-358 = ""
102040-361 = "..."
102040-362 = "*аплодирует* Ня-ха-ха! Да, это лучшее. Ха-ха-ха! Ниндзя — ответ на всё!"
102040-363 = "[s] «Ч-Что вообще происходит...?»"
102040-364 = "Я пришла, потому что господин хотел попросить нас об услуге. Каков ваш приказ, господин?"
102040-365 = "Ага, ты говорил, что это можем сделать только мы. Какая у нас ниндзя-миссия?"
102040-366 = "Кхм. Мы хотим, чтобы Клуб исследования ниндзюцу выполнил особую миссию отдельным отрядом."
102040-367 = "Особую миссию...?"
102040-369 = "...Да. Мы хотим, чтобы вы отправились на Великое снежное поле на самом севере Хяккияко."
102040-371 = "А? Великое снежное поле?"
102040-372 = "Там повсюду один снег! Зачем?!"
102040-374 = "Вам нужно найти пропавшего президента Хяккарёран."
102040-375 = "А? Хяккарёран? Президента?"
102040-376 = "Совет по урегулированию Хяккарёран...? Почему просто не... спросить в их клубной комнате...?"
102040-377 = "Ну..."
102040-378 = "...! Кстати, я давно не видела ни одного члена Хяккарёран."
102040-379 = "Наверняка случилось что-то, о чём нельзя говорить. Так ведь, Кахо?"
102040-380 = "...Да. Именно так."
102040-381 = "Но если это миссия по поиску пропавшего... почему именно мы?"
102040-383 = "Хм, может, потому что среди третьекурсников, которые помнят Хяккарёран, Митчи Руд из Клуба исследования ниндзюцу — единственная, кому можно доверять."
102040-384 = "Что?! Митчи Руд?! Это ты грубиянка!"
102040-385 = "Ого, президент! Ты знакома с кем-то из Хяккарёран?!"
102040-386 = "Д-Да. Но я видела их только мельком... поэтому почти ничего не помню..."
102040-387 = "Ня-ха-ха. Для этой миссии этого достаточно."
102040-389 = "(Что опять задумал этот енот...?)"
102040-390 = ""
102040-391 = "Понятно! Я поняла! Наша задача — выяснить, где находится Кузуноха!"
102040-392 = "И президент Хяккарёран знает этого человека... Ух, ладно. Попробуем."
102040-393 = "Президент! Расскажи нам про Хяккарёран! Они правда такие же сильные и крутые, как ниндзя?"
102040-394 = "В Хяккарёран принимают только элиту, так что..."
102040-395 = "Совет по урегулированию Хяккарёран... Я раньше о них слышала..."
102040-396 = "Но ниндзя им не одолеть! Ниндзя всегда остаются последними на ногах!"
102040-397 = "Именно! Ниндзя — лучшие!"
102040-398 = "[s1] «Изуна, Цукуё, Мичиру. Это важное задание.»\n[s2] «Когда найдёте цель, попросите её связаться с Шале.»"
102040-399 = "Да! Хорошо!"
102040-400 = "Да! Хорошо!"
102040-401 = "Ладно... Мы многим тебе обязаны, так что..."
102040-402 = "Д-Да... Мы постараемся..."
102040-403 = ""
102040-405 = ""
102040-406 = "В таком беспрецедентном кризисе Хяккарёран могли отправиться только в одно место..."
102040-407 = "Президент наверняка ушёл в Сумеречный храм на Великом снежном поле."
102040-408 = "Проанализировав всю мою информацию, можно сказать, это почти наверняка! Скорее всего, именно там президент Хяккарёран встречается с Кузунохой!"
102040-409 = "Так что там вы, вероятно, и встретите президента. Ня-ха-ха!"
102040-410 = "...Мы возлагаем надежды на твои расплывчатые догадки, Ния. Надеюсь, ты права."
102040-411 = "Ай, Кахо! Я же сказала, я почти уверена!"
102040-412 = "К счастью, подтверждено, что влияние Ложных святилищ на Великом снежном поле слабое, так что опасность должна быть минимальной."
102040-413 = "Но в такой беспрецедентной ситуации делать поспешные выводы было бы неразумно."
102040-414 = "...Так что будьте осторожны."
102040-415 = "Если отбросить шутки, Кахо права. Мы рискуем, поэтому если её не будет в храме — сразу возвращайтесь."
102040-416 = "И, конечно же, проявите максимальную осмотрительность во время этой встречи."
102040-418 = "...Пожалуйста. Эта информация пока не должна стать достоянием общественности."
102040-420 = "Поняла! Мы найдём этого человека и сразу вернёмся, если её там не окажется!"
102040-421 = "Если в-возникнут проблемы... мы свяжемся... П-Пожалуйста, присмотрите... за нами..."
102040-422 = "Тогда, Клуб исследования ниндзюцу, отправляемся на Великое снежное поле искать президента Хяккарёран!"
102040-423 = ""
102040-425 = ""
102040-426 = "Хи-хи. Теперь ждём новостей."
102040-427 = "..."
102040-429 = "...Ке-ке-ке, именно."
102040-431 = "Клуб исследования ниндзюцу наткнулся на важную информацию..."
102040-432 = "Ироха! Ироха, ты где? Приготовь это!"
102040-433 = "А? Приготовить что? И разве мы не должны пойти помочь Шале?"
102040-434 = "...Ке-ке-ке. Не волнуйся, Ироха. Всё уже готовится."
102040-435 = "Что? В смысле...?"
102040-437 = "Ке-ке-ке... Да. Это слишком хорошая возможность, чтобы её упустить."
102040-439 = "Следующий эпизод; Планирование операции 3"
