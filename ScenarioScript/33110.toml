[translation]
33110-1 = "Episódio 11;Caos Acelerado (1)"
33110-2 = "Kyaaaaaah!?"
33110-3 = "Esperem, não se dispersem! Se saírem da academia...!"
33110-4 = "Isso mesmo, vamos ser atacadas por Gehenna!"
33110-5 = "A-Auuu..."
33110-6 = "...A situação ficou bem grave, né."
33110-14 = "Hanako-san, pessoal do Clube de Aulas de Reforço...!"
33110-15 = "M-Mari-san?"
33110-19 = "Mari-chan! Que bom que você está bem...!"
33110-20 = "Na verdade, parece que alguns radicais acabaram de emitir uma ordem de convocação de emergência por conta própria..."
33110-21 = "Ngh! Isso é..."
33110-22 = "...?"
33110-23 = "Hã? O-O quê? Como assim?"
33110-24 = "Com a Sakurako-san também ausente, tenho certeza de que a única que pode comandar a Irmandade e conter o descontrole das facções da Tea Party é você, Hanako-san..."
33110-25 = "M-Mas agora..."
33110-26 = "Hanako-san..."
33110-27 = "Ah, você aí!"
33110-31 = "Se não me engano, você é membro do Comitê de Justiça... né? Estão falando de entrarmos em estado de prontidão imediata, então corre e se reúne na sala do clube!"
33110-32 = "Ah, e-eu também? M-Mas..."
33110-33 = "Não conseguimos encontrar nem a presidente nem a vice-presidente, depressa!"
33110-37 = "Ah, ugh, hã..."
33110-41 = "...Hanako-chan, Koharu-chan. Eu vou procurar a Azusa-chan. Vocês duas, por favor, vão para onde precisam estar."
33110-42 = "Hifumi-chan..."
33110-43 = "M-Mas..."
33110-44 = "Por aqui vai ficar tudo bem, tenho certeza de que a Azusa-chan vai voltar. Assim que eu a encontrar, entro em contato na hora!"
33110-45 = "...E-Entendi! Então, até mais tarde!"
33110-46 = "...Sim, entendido. Mari-chan, vamos!"
33110-48 = "S-Sim...!"
33110-51 = "..."
33110-52 = "Mas o que foi que aconteceu... Azusa-chan..."
33110-54 = "O local do Tratado do Éden está envolto em chamas, e os arredores da Antiga Catedral encontram-se em uma situação devastadora!!"
33110-55 = "O que será que está acontecendo—"
33110-56 = "..."
33110-57 = "...Nagi-chan, eu te disse uma vez, não foi?"
33110-58 = "Nós vivemos nesse tipo de mundo."
33110-59 = "Por isso..."
33110-60 = "...É mesmo como a Seia-chan disse. No fim das contas, essa deve ser exatamente esse tipo de história."
33110-61 = "..."
33110-63 = "Periferia - Beco da Zona de Combate"
33110-69 = "O local do Tratado do Éden está envolto em chamas, e os arredores da Antiga Catedral encontram-se em uma situação devastadora!!"
33110-70 = "As forças de reserva de ambas as academias, que aguardavam na retaguarda da Antiga Catedral, estão avançando em direção a ela!"
33110-71 = "Daqui não é possível ver, mas parece que um confronto entre as duas academias está se desenrolando, pois só se ouvem disparos e explosões!"
33110-72 = "As informações ainda não foram apuradas para esclarecer o que exatamente está acontecendo! O número de feridas e a escala dos danos também seguem sob investigação..."
33110-73 = "...Ah, notícia de última hora! Informam que uma reunião de emergência foi convocada em Trinity!"
33110-74 = "P-Parece que o mesmo está acontecendo na Pandemonium Society de Gehenna! Será que ambas as academias estão se preparando para declarar estado de emergência...!?"
33110-80 = "Shinon-chan, não acha melhor nós também recuarmos logo!?"
33110-81 = "Tem razão, Mai-senpai! Peço desculpas, mas vamos nos deslocar para um local um pouco mais seguro antes de continuar a transmissão!"
33110-83 = "Afinal, qual foi a causa da explosão!?"
33110-84 = "Onde está a Sakurako-sama!? Qual é o número de feridas!? Ainda não conseguiram contato com a Nagisa-san!?"
33110-85 = "Informam que a presidente Tsurugi e a vice-presidente Hasumi continuam desaparecidas! Talvez por isso quase não haja resposta do Comitê de Justiça...!"
33110-86 = "E a ordem de convocação das Irmãs!? Devemos decretar lei marcial agora mesmo, nem que seja só por nossa conta...!"
33110-87 = "Relatos de movimentações suspeitas detectadas em uma das facções! Nas demais facções, as figuras principais também parecem estar começando a se reunir!"
33110-88 = "As Irmãs que aguardavam na retaguarda da Antiga Catedral estão atualmente em combate contra as forças de reserva de Gehenna! Elas aguardam instruções!"
33110-89 = "É-É a Sorasaki Hina! Sem dúvida, ela deve ser a culpada por trás de tudo isso!"
33110-94 = "Acalmem-se todas, por favor!!"
33110-98 = "U-Urawa Hanako-san...?"
33110-99 = "...Vim a pedido da Sakurako-san. A partir de agora, peço licença para intervir um pouco."
33110-100 = "C-Como assim?"
33110-102 = "E-Eu garanto! A Sakurako-san pediu: \"Caso algo aconteça comigo, quero que a Hanako-san assuma o comando da Irmandade como minha substituta\"...!!"
33110-103 = "O quê... Mas, por mais que seja uma ordem da Sakurako-sama, há integrantes de outras facções aqui também..."
33110-104 = "Agora não é hora para esse tipo de discussão! Com todas da Tea Party ausentes, se ficarmos divididas..."
33110-106 = "Trinity vai entrar em colapso de verdade, sabiam!?"
33110-107 = "...!!"
33110-108 = "Eu não imaginava que a fraqueza do triunvirato fosse ser exposta dessa forma, mas..."
33110-109 = "Como já somos um conglomerado de diversas facções desde o princípio, o controle sob a jurisdição da Tea Party quase não funciona mais agora."
33110-110 = "Primeiro, vamos colocar a situação em ordem e conter o descontrole de toda a Trinity. Essa é a prioridade máxima!"
33110-111 = "...Entendido. Se essa foi a promessa feita à Sakurako-sama..."
33110-112 = "...Sim, não tenho objeções."
33110-113 = "Estruturem imediatamente a cadeia de comando e, em seguida, interrompam os combates que estão ocorrendo em cada região."
33110-114 = "Depois disso, iniciem as buscas pelas feridas."
33110-115 = "Nesse processo, coletem informações dos arredores, incluindo relatos precisos de testemunhas, para entendermos o que realmente está acontecendo!"
33110-116 = "H-Há um tumulto no 14º prédio escolar! Dizem que a facção Pater está exigindo a declaração imediata de lei marcial e marchando em direção à sede da Tea Party!!"
33110-117 = "Ngh...! Entrem em contato com o Comitê de Justiça! Usem o canal de emergência para quando a Hasumi-san e a Tsurugi-san estão ausentes!"
33110-118 = "...Não, agora até o Comitê de Justiça está... Qual é o efetivo que a Irmandade tem disponível para mobilizar neste momento!?"
33110-121 = "(Desculpe, Hifumi-chan... Parece que atuar aqui já vai exigir tudo de mim.)"
33110-122 = "(Azusa-chan, Koharu-chan, Sensei... Eu também darei o meu melhor. Por favor, fiquem todos bem...!)"
33110-124 = "Comitê de Justiça - Arredores da Sala do Clube"
33110-132 = "Chegou um pedido de reforço das administradoras da Tea Party para o 14º prédio escolar!"
33110-133 = "M-Mas até agora há pouco a ordem não era para irmos em direção à Antiga Catedral?"
33110-134 = "Também recebemos contato da Irmandade! O que fazemos...?"
33110-136 = "Agora não é hora de ouvir ordens de outras organizações! Acima de tudo, precisamos resgatar a Hasumi-senpai e a Tsurugi-senpai primeiro!"
33110-140 = "H-Hum..."
33110-141 = "Também estão chegando contatos das integrantes destacadas em vários lugares... Aaah, que droga!"
33110-146 = "Hum, é que..."
33110-147 = "Bom, eu, uuu..."
33110-148 = "Aaah, chega... Por ora, cada uma para o seu posto! Você aí também! Não fique parada aí e vá fazer o seu trabalho!"
33110-152 = "Hã? M-Mas a minha função é..."
33110-153 = "A sala de controle de itens confiscados?"
33110-155 = "Trinity - Portão 5"
33110-158 = "P-Por que tem um veículo de Gehenna aqui...!?"
33110-159 = "Uma ambulância? Só pode ser brincadeira, você tem noção da situação atual!?"
33110-164 = "Já chega, vamos arrancá-la do banco do motorista e dar uma lição nela!!"
33110-169 = "Estou transportando um ferido, abram caminho, por favor. É uma emergência."
33110-170 = "P-Por que faríamos isso por feridos de Gehenna...!!"
33110-171 = "..."
33110-173 = "Parem com isso, por favor!!"
33110-180 = "As Cavaleiras Socorristas...?"
33110-181 = "Como podem tentar atacar uma ambulância sabendo que há feridos lá dentro!? Nós, as Cavaleiras Socorristas, jamais permitiremos algo assim!!"
33110-182 = "Se quiserem atacar um ferido, terão que passar por nós primeiro. Francamente, que absurdo... Se a capitã Mine estivesse aqui, certamente ficaria entristecida com esta situação."
33110-183 = "A-A capitã Mine..."
33110-185 = "Você está falando daquela Mine do \"a Mine destrói e as Cavaleiras curam\"!? Ela é uma encrenqueira de marca maior! Vê se não brinca com a nossa cara!"
33110-186 = "N-Não, a capitã não é uma encrenqueira, ela só é um pouquinho antiquada, digamos assim..."
33110-187 = "Tanto faz, aquela mulher é maluca!!"
33110-188 = "Senpai, por que parece que isso surtiu o efeito contrário...?"
33110-189 = "E-Eu já sabia, mas... não imaginava que a reputação da capitã fosse tão ruim assim..."
33110-190 = "Ela vive dizendo que \"em vez de tratar a ferida, deve-se eliminar a causa da ferida\", né? Será que é por causa disso...?"
33110-196 = "Ah, ei, a-afastem-se, por favor! Se não obedecerem, vou aplicar uma injeção em vocês, viu!?"
33110-197 = "Com licença, lançando granada de luz!"
33110-199 = "Kyaaaah! M-Meus olhos...!?"
33110-200 = "Argh, o que é isso...!?"
33110-201 = "O que foi isso do nada...!?"
33110-205 = "Peço desculpas pela abordagem brusca... e também por termos chegado a uma situação como esta..."
33110-206 = "D-Do Grupo de Vigilantes...!"
33110-207 = "Suzumi-san!"
33110-208 = "Há quanto tempo. Vocês das Cavaleiras Socorristas já cuidaram de mim muitas vezes no passado."
33110-209 = "Independentemente da academia a que pertençam, feridos são feridos... Não posso permitir que sejam tratados com violência."
33110-213 = "O Grupo de Vigilantes... Aquelas que, dependendo do caso, batem de frente até com o Comitê de Justiça..."
33110-214 = "Mais gente perigosa..."
33110-215 = "...Não vale a pena perder tempo com elas, vamos embora."
33110-219 = "Ufa... Parece que as coisas se acalmaram de algum jeito."
33110-220 = "M-Muito obrigada, Suzumi-san. Graças a você, estamos salvas."
33110-224 = "Imagina. Não há muito que eu possa fazer, mas... como membro do Grupo de Vigilantes, preciso fazer o que estiver ao meu alcance."
33110-225 = "...Opa?"
33110-226 = "Suzumi-san, Suzumi-san!! Finalmente chegou a vez do nosso Grupo de Vigilantes entrar em ação!"
33110-227 = "Eu, Reisa, o ás do Grupo de Vigilantes e a idol de todo mundo, desta vez vou junto com a Suzumi-san—"
33110-232 = "...Desculpem, está tudo bem. Não se preocupem. Bom, vou dar uma volta para ver se não há mais ninguém em apuros."
33110-236 = "Ah, Suzumi-san!"
33110-237 = "Ela já foi... Continua rápida como o vento, como sempre."
33110-238 = "...Agradeço pela cooperação, integrantes das Cavaleiras Socorristas."
33110-239 = "Ah, sim! Pelo emblema, você é do Clube de Medicina de Emergência de Gehenna... certo? Por que veio até Trinity...?"
33110-240 = "Há alguma paciente de Trinity lá dentro?"
33110-241 = "É o Sensei [USERNAME], da Schale."
33110-242 = "...Quê!?"
33110-243 = "O-O Sensei!?"
33110-244 = "Sim, ele foi baleado."
33110-248 = "Hããã!?"
33110-250 = "Próximo;Caos Acelerado (2)"
