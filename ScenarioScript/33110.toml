[translation]
33110-1 = "Эпизод 11;Усугублённая неразбериха, часть 1"
33110-2 = "А-а-а-а-а!"
33110-3 = "П-Подождите! Нельзя покидать территорию кампуса!"
33110-4 = "Геенна нападёт! Мы должны что-то делать!"
33110-5 = "О нет..."
33110-6 = "Полный хаос."
33110-7 = ""
33110-9 = ""
33110-14 = "Ханако! Клуб дополнительных занятий!"
33110-15 = "Мари?"
33110-16 = ""
33110-18 = ""
33110-19 = "Это правда ты, Мари! Я рада, что ты в безопасности."
33110-20 = "Ты только что всё пропустила! Некоторые радикальные сторонники Чаепития отдали приказ о мобилизации. Они призывают студентов."
33110-21 = "Что?! У них не должно быть таких полномочий."
33110-22 = "...?"
33110-23 = "Ч-Что происходит?"
33110-24 = "Сакурако тоже пропала. Единственный человек, который сейчас может отреагировать на этот кризис... это ты, Ханако."
33110-25 = "Но мне нужно..."
33110-26 = "Ханако..."
33110-27 = "Эй, ты! Там!"
33110-28 = ""
33110-30 = ""
33110-31 = "Ты ведь одна из наших? Объявлен чрезвычайный призыв. Немедленно явись в клубную комнату!"
33110-32 = "К-Кто, я? Но я..."
33110-33 = "Председатель и заместитель пропали! Нам нужно торопиться!"
33110-34 = ""
33110-36 = ""
33110-37 = "Но я, эм..."
33110-38 = ""
33110-40 = ""
33110-41 = "Идите. Есть люди, которым нужны вы обе. Я продолжу искать Азусу."
33110-42 = "Точно?"
33110-43 = "Н-Но, Хифуми..."
33110-44 = "Со мной всё будет нормально. На самом деле Азуса может и сама вернуться. Я свяжусь с вами, как только увижу её."
33110-45 = "Х-Хорошо! Увидимся позже!"
33110-46 = "Поняла. Идём, Мари!"
33110-48 = "Д-Да!"
33110-50 = ""
33110-51 = "..."
33110-52 = "Ох, Азуса... Что, чёрт возьми, происходит?"
33110-54 = "Внезапный взрыв на церемонии подписания Эдемского договора погрузил всё вокруг собора в полный хаос!"
33110-55 = "Что же произошло, когда—*щелчок*"
33110-56 = "..."
33110-57 = "Я пыталась предупредить тебя, Наги."
33110-58 = "Иначе всё и не могло закончиться."
33110-59 = "Таков мир, в котором мы живём."
33110-60 = "Что есть, то есть, как и говорила Сэя."
33110-61 = "..."
33110-63 = "Военный транспортный маршрут"
33110-64 = ""
33110-65 = ""
33110-68 = ""
33110-69 = "Внезапный взрыв на церемонии подписания Эдемского договора погрузил всё вокруг собора в полный хаос!"
33110-70 = "Силы безопасности обеих академий сейчас выдвигаются к собору!"
33110-71 = "Отсюда мы ничего не видим, но звуки стрельбы и взрывов означают, что начались боевые действия!"
33110-72 = "Число пострадавших и масштаб ущерба пока не подтверждены, и—"
33110-73 = "Срочная новость! Чаепитие созвало экстренное заседание в Тринити."
33110-74 = "Мы только что получили сведения, что Общество Пандемониума сделало то же самое в Геенне. Неужели обе академии готовятся объявить чрезвычайное положение?"
33110-75 = ""
33110-77 = ""
33110-78 = ""
33110-80 = "Шинон! Тебе не кажется, что нам тоже пора отступать?!"
33110-81 = "Хорошая мысль, Май. Продолжим трансляцию, как только отойдём на безопасное расстояние!"
33110-83 = "Причину взрыва уже установили?"
33110-84 = "Где Сакурако?! Сколько пострадавших?! От Нагисы так никто ничего и не слышал?!"
33110-85 = "Председатель Цуруги и заместитель Хасуми всё ещё не найдены!"
33110-86 = "Что с приказами о мобилизации Сестринства? Такими темпами нам, возможно, придётся вводить военное положение..."
33110-87 = "У штаб-квартиры Чаепития замечена подозрительная активность. Там уже начинают собираться представители разных фракций."
33110-88 = "Сёстры, находившиеся в резерве у собора, сейчас вступили в бой с силами Геенны. Ждём приказов!"
33110-89 = "Тогда нашей главной целью должна стать Сорасаки Хина!"
33110-90 = ""
33110-92 = ""
33110-93 = ""
33110-94 = "Все, пожалуйста, успокойтесь!"
33110-95 = ""
33110-97 = ""
33110-98 = "Урава Ханако? Чего ты хочешь?"
33110-99 = "Позвольте мне взять всё на себя... по просьбе Сакурако."
33110-100 = "Ч-что это было?"
33110-102 = "Она говорит правду. Сакурако попросила Ханако принять командование, если с ней что-нибудь случится. Я могу это подтвердить."
33110-103 = "Даже ЕСЛИ это приказ Сакурако, она всё равно посторонняя."
33110-104 = "У нас нет времени на споры. В отсутствие всех хозяек Чаепития необходимо установить временную цепь командования!"
33110-106 = "Иначе Тринити развалится сверху донизу!"
33110-107 = "...!"
33110-108 = "Вот слабость системы триумвирата. Когда все три хозяйки исчезли, начинает царить хаос."
33110-109 = "Разные фракции, которые каждая из них раньше сдерживала, вышли из-под контроля!"
33110-110 = "Наш главный приоритет — вернуть управление и успокоить ситуацию."
33110-111 = "Понятно. Если этого хотела Сакурако..."
33110-112 = "Да. Возражений нет."
33110-113 = "Поторопимся и установим цепь командования. Затем сделайте всё возможное, чтобы прекратить начавшиеся столкновения."
33110-114 = "Обязательно эвакуируйте всех раненых, которых найдёте!"
33110-115 = "Наши силы также должны собирать всю возможную информацию об обстановке, включая показания очевидцев по пути."
33110-116 = "У корпуса 14 начался бунт! Фракция Pater прямо сейчас идёт к штаб-квартире Чаепития с требованием ввести военное положение!"
33110-117 = "Уже? Свяжитесь с Отрядом правосудия. Нужно выйти на следующего по командованию в случае отсутствия Цуруги и Хасуми."
33110-118 = "Нет, подождите. У них, скорее всего, тоже полный хаос... Сколько сил у нас сейчас доступно?!"
33110-119 = ""
33110-121 = "(Прости, Хифуми. Похоже, я буду занята здесь дольше, чем думала.)"
33110-122 = "(Я сделаю всё, что смогу. Остаётся только молиться, чтобы остальные были в безопасности.)"
33110-124 = "Снаружи штаб-квартиры Отряда правосудия"
33110-125 = ""
33110-126 = ""
33110-127 = ""
33110-128 = ""
33110-129 = ""
33110-130 = ""
33110-131 = ""
33110-132 = "М-Мы получили запрос на подкрепление к корпусу 14 от офицера Чаепития!"
33110-133 = "Но разве нам не приказали идти прямо к собору?"
33110-134 = "Теперь с нами связывается Сестринство! Что делать?"
33110-136 = "Сейчас не время выполнять приказы других организаций! Главный приоритет — спасти председателя Цуруги и заместителя Хасуми!"
33110-137 = ""
33110-139 = ""
33110-140 = "Э-Эм..."
33110-141 = "Мы также получаем доклады от наших членов, разосланных по городу."
33110-142 = ""
33110-144 = ""
33110-145 = ""
33110-146 = "Э-Эм, простите..."
33110-147 = "Я, э... Что мне сейчас делать?"
33110-148 = "Эй, ты! Не стой столбом! Вернись на свой пост!"
33110-149 = ""
33110-151 = ""
33110-152 = "А? Мой пост?"
33110-153 = "Склад контрабанды?"
33110-155 = "Главные ворота Тринити №5"
33110-158 = "Что здесь делает машина Геенны?!"
33110-159 = "Похоже на скорую. Водительница совсем с ума сошла? Она не понимает, что сейчас происходит?"
33110-160 = ""
33110-162 = ""
33110-163 = ""
33110-164 = "Остановить её! Придётся проучить силой!"
33110-165 = ""
33110-167 = ""
33110-169 = "Я прибыла, чтобы перевезти тяжелораненого. Освободите дорогу. Это чрезвычайная ситуация."
33110-170 = "Раненого? Кому какое дело до раненых Геенны?!"
33110-171 = "..."
33110-173 = "Пожалуйста, остановитесь!"
33110-175 = ""
33110-177 = ""
33110-179 = ""
33110-180 = "Рыцари спасения?"
33110-181 = "Вы прекрасно знаете, что нельзя нападать на скорую с ранеными! Мы не будем стоять в стороне и позволять это!"
33110-182 = "Сначала вам придётся пройти через нас. Капитан Мине была бы ужасно разочарована этой ситуацией, будь она здесь!"
33110-183 = "Капитан Рыцарей спасения...?"
33110-185 = "Та самая Мине, которая всё разносит, а потом её рыцари собирают обломки?! Этим вы нам угрожаете?!"
33110-186 = "В-Всё не так! Капитан не хочет никому вредить. Она просто немного... старомодна..."
33110-187 = "Скорее уж безумна!"
33110-188 = "Ч-Что теперь делать? Кажется, упоминание капитана сработало против нас."
33110-189 = "И не говори. Я знала, что репутация капитана бежит впереди неё, но не думала, что всё настолько плохо..."
33110-190 = "Она постоянно говорит что-то вроде: «Устранить причину раны эффективнее, чем лечить её»."
33110-191 = ""
33110-193 = ""
33110-194 = ""
33110-195 = ""
33110-196 = "Э-Эй, назад! Подойдёте ближе — получите укол!"
33110-197 = "Светошумовая граната!"
33110-199 = "А-а-а-а! Глаза! Я ничего не вижу!"
33110-200 = "Кажется, я отключусь! Всё кружится!"
33110-201 = "Ч-что происходит?!"
33110-204 = ""
33110-205 = "Достаточно. Патруль добровольцев не закроет глаза на столь вопиющее нарушение порядка."
33110-206 = "П-Патруль добровольцев?!"
33110-207 = "Сузуми!"
33110-208 = "Я в долгу перед Рыцарями спасения за всю вашу помощь."
33110-209 = "Раненые заслуживают помощи независимо от принадлежности."
33110-210 = ""
33110-212 = ""
33110-213 = "Патруль добровольцев... Я слышала, они даже вступают в конфликт с Отрядом правосудия, если приходится."
33110-214 = "Они ещё безумнее Рыцарей спасения."
33110-215 = "У нас нет времени. Уходим."
33110-216 = ""
33110-217 = ""
33110-219 = "*вздох* Наконец-то ушли."
33110-220 = "Спасибо за помощь, Сузуми. Ты нас спасла."
33110-221 = ""
33110-223 = ""
33110-224 = "Не за что. Для добровольца естественно помогать, когда нарушается порядок."
33110-225 = "Хм?"
33110-226 = "Сузуми! Вот он, наш час! Время Патрулю добровольцев блистать!"
33110-227 = "Я, Узава Рейса, ас Патруля добровольцев и всеобщий кумир, присоединяюсь к тебе!"
33110-228 = ""
33110-231 = ""
33110-232 = "Простите. Мне лучше проверить остальных, пока они не увлеклись."
33110-233 = ""
33110-235 = ""
33110-236 = "П-Подожди, Сузуми!"
33110-237 = "Поздно. Она уже умчалась, как всегда."
33110-238 = "Кхм. Вообще-то это я должна благодарить вас, Рыцари спасения."
33110-239 = "А, точно! Не стоит. Эта эмблема означает, что вы из Медицинского аварийного клуба Геенны, верно? Зачем везти пациента в главное здание Тринити?"
33110-240 = "Пациент внутри из Тринити?"
33110-241 = "Нет. Это Сенсей [USERNAME] из Шале."
33110-242 = "Что?!"
33110-243 = "С-Сенсей?!"
33110-244 = "Верно. Сенсей получил огнестрельное ранение."
33110-245 = ""
33110-247 = ""
33110-248 = "ЧТО?!"
33110-250 = "Следующий эпизод;Усугублённая неразбериха, часть 2"
