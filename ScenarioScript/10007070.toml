[translation]
10007070-1 = "Эпизод 7;Идеальный отпуск дисциплинарного комитета!"
10007070-2 = "Гостиная курорта горячих источников №227"
10007070-4 = "После купания я стоял у торгового автомата в гостиной, чтобы утолить жажду."
10007070-5 = "Несколько студентов наслаждались массажными креслами."
10007070-6 = "*вздыхает* Как же хорошо."
10007070-7 = "Горячие источники в Геенне отличные, но и эти совсем неплохи."
10007070-8 = "[s] «Похоже, тебе весело.»"
10007070-9 = "С-С-Сенсей?"
10007070-10 = "Ч-Что ты здесь делаешь?"
10007070-11 = "О-Одну минутку, пожалуйста. Мне нужно это выключить."
10007070-12 = "А-А? Я нажала кнопку массажа всего тела."
10007070-13 = "Кнопка отмены должна быть где-то здесь..."
10007070-14 = ""
10007070-16 = ""
10007070-17 = "А-Ай?!"
10007070-18 = ""
10007070-20 = ""
10007070-22 = ""
10007070-23 = "[ns1] «Не нужно так спешить вставать.»\n[ns2] «Можешь продолжать расслабляться.»"
10007070-26 = "Н-Но разговаривать с Сенсеем лёжа вот так невежливо."
10007070-27 = "И мне всё равно нужно вставать и работать."
10007070-28 = "Эм... Наверное, это прозвучало не очень убедительно, пока я лежу в этом кресле."
10007070-29 = "[s3] «Работать? Что за работа?»\n[s4] «Ты здесь по делам дисциплинарного комитета Геенны?»"
10007070-30 = "Это секрет от остальных студентов... Но я здесь по работе дисциплинарного комитета Геенны."
10007070-31 = "Да, но для остальных студентов это секрет."
10007070-32 = ""
10007070-34 = ""
10007070-35 = ""
10007070-37 = "Сенсей, ты знаешь клуб горячих источников академии Геенна?"
10007070-38 = "[s5] «Знаю.»\n[s6] «Это клуб, который занимается разработкой горячих источников, да?»"
10007070-39 = "Да, клуб горячих источников занимается разработкой горячих источников. Даже среди проблемных клубов Геенны он печально известен тем, что его участницы постоянно устраивают серьёзные аварии с помощью тяжёлой техники."
10007070-40 = "Да, клуб горячих источников занимается разработкой горячих источников. Даже среди проблемных клубов Геенны он печально известен тем, что его участницы постоянно устраивают серьёзные аварии с помощью тяжёлой техники."
10007070-41 = "На прошлогодних летних сборах случился огромный переполох, потому что они настаивали на бурении горячего источника прямо у моря."
10007070-42 = "Единственным их достоинством было то, что проблемы они создавали только на территории Геенны... поначалу."
10007070-43 = "Но почему-то они разработали горячий источник на территории академии Красной Зимы!"
10007070-44 = "В принципе любая клубная деятельность на территории другой академии является серьёзным нарушением школьных правил."
10007070-45 = "Поскольку это потенциально может спровоцировать конфликт между академией Геенна и Федеральной академией Красной Зимы, я приехала сюда как член дисциплинарного комитета, чтобы понять, могу ли чем-нибудь помочь."
10007070-46 = "[s] «Хотя выглядело так, будто тебе очень весело.»"
10007070-47 = "О, э-это массажное кресло..."
10007070-48 = "Я весь день шла по следам клуба горячих источников и очень устала. А потом закончила купаться, и массажное кресло будто само приглашало меня сесть..."
10007070-49 = "Устроить такую хитрую ловушку, чтобы уйти от преследования дисциплинарного комитета... Клуб горячих источников нельзя недооценивать."
10007070-50 = "[s] «Почему-то мне кажется, клуб горячих источников тут ни при чём.»"
10007070-52 = "[s] «Всем вроде нравится, может, просто оставить всё как есть?»"
10007070-53 = "Нет. Не стоит расслабляться только потому, что сейчас всё выглядит мирно."
10007070-54 = "Клуб горячих источников — иррациональная организация, готовая на любую эксцентричную выходку, если это поможет разработке источников."
10007070-55 = "Если кто-то помешает их разработке, они без колебаний столкнут академии Красной Зимы и Геенны, лишь бы добиться своего."
10007070-56 = "[s] «Даже если они настолько любят горячие источники, неужели правда пойдут на такое?»"
10007070-57 = "*вздыхает* Ты просто ещё не видел истинную натуру клуба горячих источников, Сенсей."
10007070-58 = "Когда я вспоминаю всё, что клуб горячих источников творил ради разработки..."
10007070-59 = "Я бы не удивилась, если бы весь курорт взорвался прямо сейчас."
10007070-60 = "[s] «Ты серьёзно?!»"
10007070-61 = "Да. Решимость клуба горячих источников всегда выходит за пределы воображения."
10007070-62 = "Однако я нигде их не вижу, а бесцельно бродить по территории академии Красной Зимы без защиты от холода кажется не слишком разумным, поэтому..."
10007070-63 = "Пока что мне придётся терпеливо ждать их возвращения здесь, на курорте горячих источников."
10007070-64 = ""
10007070-66 = ""
10007070-67 = "А?"
10007070-70 = "Пока я разговаривал с Чинацу, остальные студенты заняли свободные массажные кресла."
10007070-73 = "О нет, все массажные кресла заняты."
10007070-74 = "Я хотела ещё немного помассироваться, чтобы снять усталость..."
10007070-75 = "[s7] «Хочешь, я вместо кресла сделаю тебе массаж?»\n[s8] «Если нужен массаж всего тела — предоставь это мне!»"
10007070-76 = ""
10007070-77 = ""
10007070-79 = ""
10007070-80 = "В-Всё нормально! Я пришла сюда не ради массажа!"
10007070-81 = "Т-Тогда я пойду патрулировать окрестности!"
10007070-82 = ""
10007070-84 = ""
10007070-87 = "Не дав мне времени её остановить, Чинацу выбежала из курорта."
