[translation]
2005502-1 = "Боязнь шкафчиков"
2005502-4 = "Клубная комната Отдела разработки игр"
2005502-5 = "[ns] «Юзу! Ты в порядке?! Что случилось?!»"
2005502-6 = "С-Сенсей?!"
2005502-7 = "Это правда не настолько серьёзно...!"
2005502-8 = "А? Вы думаете, я «показываю скрытую сторону» себя?"
2005502-9 = "И что... уже само по себе это серьёзно?"
2005502-10 = "..."
2005502-11 = "...Если честно, вы... вы правы, Сенсей."
2005502-12 = "Мне... больше некомфортно в моём шкафчике..."
2005502-13 = "[s1] «Вот видишь? Это серьёзно.»\n[s2] «Это огромное изменение твоего привычного состояния!»"
2005502-16 = "Ну, если вы так говорите, это и правда звучит серьёзно...!"
2005502-17 = "[s] «Как давно тебе стало некомфортно в шкафчике?»"
2005502-18 = "Эм... Ну..."
2005502-19 = "Кажется, началось сразу после того, как мы вернулись домой — после всего, что произошло на Стальном континенте."
2005502-20 = "[s3] «Потому что там так темно...?»\n[s4] «Возвращаются плохие воспоминания?»"
2005502-23 = "Н-Нет. Не думаю. Темноты я не боюсь."
2005502-24 = "Но это не значит, что произошедшее на Стальном континенте... совсем никак с этим не связано."
2005502-25 = "..."
2005502-26 = "Понимаете, когда я залезаю в тесное место вроде шкафчика, сердце начинает колотиться. Кажется, будто пол вот-вот провалится..."
2005502-27 = "[s] «Будто пол вот-вот... „провалится“?»"
2005502-28 = "Да... Это напоминает мне капсулу... на Транспортном корабле."
2005502-29 = "Когда я зажата в тесном пространстве и не могу двигаться, кажется, что пол внезапно провалится, меня выбросит наружу... А там будет бой, к которому я не готова, и..."
2005502-30 = "Я просто больше не могу расслабиться там, как раньше. Мне становится очень тревожно."
2005502-31 = "[s] «Это проблема.»"
2005502-32 = "...Н-Но, Сенсей..."
2005502-33 = "М-Может быть... на самом деле это хорошо...?"
2005502-34 = "[s] «Хорошо...?»"
2005502-35 = "Да. Раз уж я больше не могу закрываться в шкафчике..."
2005502-36 = "Возможно, это даст мне возможность... чаще выходить наружу, как все остальные..."
2005502-37 = "Встречаться с людьми... Быть... общительнее."
2005502-38 = "Так что, может, это даже к лучшему... Придётся стать нормальнее. По крайней мере, я так думала..."
2005502-39 = "[s] «Ты правда так считаешь?»"
2005502-40 = "..."
2005502-41 = "...Разве это не было бы положительным изменением, Сенсей?"
2005502-42 = "[s5] «Желание расти и двигаться вперёд — это замечательно.»\n[s6] «Но плохо, если эта мотивация рождается из тревоги или избегания.»"
2005502-45 = "...Вы правы, Сенсей."
2005502-46 = "Я... не думаю, что действительно готова выходить наружу. Пока нет."
2005502-47 = "Главное, я знаю, что мне нужно. Безопасное место, где можно спрятаться, если незнакомцы или Юука внезапно ворвутся в клубную комнату, и—"
2005502-48 = "[s] «Тогда выбора нет. Тренировка начинается прямо сейчас.»"
2005502-49 = ""
2005502-52 = "[ns] «В таком случае потренируемся снова залезать в шкафчик?»"
2005502-53 = "А? Т-Тренировка...? Это..."
2005502-54 = "...С-Сенсей?!"
2005502-57 = ""
2005502-59 = ""
2005502-60 = "Постойте, почему я снова это надела?!"
2005502-61 = "[ns] «Вот она! Неостановимая UZQueen, готовая к бою!»"
2005502-62 = "Почему вы говорите как комментатор?! Это же ВЫ сказали мне это надеть, Сенсей!"
2005502-63 = "...А? Вы хотите, чтобы я вот так залезла в шкафчик?"
2005502-64 = "Постойте, э-это...!"
2005502-65 = "Т-Так ещё страшнее...!"
2005502-66 = "Это же было на мне каждый раз, когда меня сбрасывали! И катапультировали! С парашютом!"
2005502-67 = "Ух... Теперь меня ещё преследуют воспоминания о кабине Neo-Avant Guard...!"
2005502-68 = ""
2005502-70 = ""
2005502-71 = ""
2005502-72 = "...А?"
2005502-73 = ""
2005502-74 = "Я крепко взял дрожащие руки Юзу."
2005502-75 = "С... Сенсей? Что...?"
2005502-76 = "Вы хотите, чтобы я снова «попробовала посидеть в шкафчике»...?"
2005502-77 = "В-Вот так...?"
2005502-78 = ""
2005502-80 = ""
2005502-81 = ""
2005502-82 = ""
2005502-83 = "Н-Ну, одну минутку..."
2005502-84 = ""
2005502-86 = ""
2005502-87 = ""
2005502-89 = "[ns] «Ну как?»"
2005502-90 = "Я-я не уверена."
2005502-91 = "Наверное, мне немного спокойнее..."
2005502-92 = "Интересно почему. Я ведь просто сижу в том же месте, что и раньше."
2005502-93 = "Но мне гораздо лучше."
2005502-94 = "[ns] «Ну, потому что я держу тебя, Юзу.»"
2005502-96 = "[ns7] «Теперь даже если земля провалится или вдруг подскочит, всё будет хорошо.»\n[ns8] «Я всегда буду крепко держать тебя, чтобы тебя никуда не унесло.»"
2005502-99 = "Вы всегда... будете... держать меня..."
2005502-100 = "..."
2005502-101 = "С..."
2005502-102 = "...Спасибо, Сенсей."
2005502-103 = ""
2005502-105 = ""
2005502-106 = ""
2005502-107 = "И так некоторое время мы с Юзу сидели внутри шкафчика, держась за руки."
