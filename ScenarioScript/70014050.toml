[translation]
70014050-1 = "Странствия аптекаря 5"
70014050-2 = "..."
70014050-3 = "Сенсей. Как наставник, вы ведь обязаны отвечать на вопросы студентов, верно?"
70014050-4 = "[s] «В общем-то, полагаю, да...?»"
70014050-5 = "Хорошо."
70014050-6 = "Тогда настало время исполнить ваше «обещание», Сенсей."
70014050-7 = "[s] «Сейчас?»"
70014050-8 = "Верно."
70014050-9 = "Для начала я хочу услышать ваше искреннее мнение, как оно есть... без недомолвок и оговорок."
70014050-10 = "Какой я студент в ваших глазах?"
70014050-11 = "[s] «Очень, очень, очень, очень сложный студент»."
70014050-12 = "Хм, кхм. Пожалуй, так и есть, но уж очень быстро вы ответили..."
70014050-13 = "Почему я вдруг «спросила об этом ни с того ни с сего»?"
70014050-14 = "Так же, как мне нет дела до других, меня не волнует и их мнение обо мне."
70014050-15 = "По крайней мере, до недавнего времени... так и было. Так я всегда жила."
70014050-16 = "Но теперь..."
70014050-17 = "..."
70014050-18 = "Неопределённость всегда меня беспокоила."
70014050-19 = "Несовершенства, изъяны... и, тем более, то, что со временем разрушается, ничем не отличаются."
70014050-20 = "По мере того как привычные структуры всё сильнее искажаются, неопределённость неизбежно растёт."
70014050-21 = "Поэтому я считаю, что человечество должно двигаться дальше, за пределы возможного... стремясь к преодолению своих ограничений."
70014050-22 = "[s] «Ты говоришь о зелье?»"
70014050-23 = "Именно, о зелье. Почти ничто другое не вызывало у меня интереса."
70014050-24 = "Мудрец — тот, кто преодолел пределы и достоин возвыситься над ними."
70014050-25 = "Вы когда-нибудь задумывались об этом, Сенсей?"
70014050-27 = "Если люди, живущие на этой планете, способны преодолеть такие границы, как далеко мы могли бы зайти?"
70014050-28 = ""
70014050-29 = "Именно этот вопрос когда-то и привёл меня к моей работе."
70014050-30 = "До сих пор я по крайней мере гордилась тем, что изучаю природу человечества."
70014050-31 = "Мне казалось, что я достаточно хорошо всё понимаю... по крайней мере, когда речь шла о других людях."
70014050-32 = "...Но в какой-то момент... я обнаружила, что не понимаю даже саму себя."
70014050-33 = "[s] «Когда это произошло?»"
70014050-34 = "Верно. Если быть точнее..."
70014050-35 = ""
70014050-38 = "[log]Позволь мне поверить в тебя.[/log]"
70014050-41 = ""
70014050-42 = "С того самого момента."
70014050-43 = "[s] «...»"
70014050-44 = "Я хочу спросить вас прямо сейчас. Что вы имели в виду?"
70014050-45 = "Сенсей... Что вы хотели мне сказать тогда?"
70014050-46 = "[s] «Знаешь, Кай...»"
70014050-47 = "...?"
70014050-48 = "[s] «Думаю, во мне есть кое-что, что никогда не изменится»."
70014050-49 = "«Никогда не изменится»...?"
70014050-50 = "[s1] «Я всегда хочу помогать своим студентам, что бы ни случилось».\n[s2] «Но в одиночку я с этим не справлюсь»."
70014050-51 = ""
70014050-52 = ""
70014050-54 = "Что... вы имеете в виду?"
70014050-55 = "Хм? Если студент отвергает любые попытки помочь, значит ли это, что учитель бессилен?"
70014050-56 = ""
70014050-58 = ""
70014050-59 = "...Как интересно."
70014050-60 = "Даже если студент до самого конца отказывается от вмешательства, разве настоящий учитель не должен продолжать попытки?"
70014050-61 = "Разве не об этом мечтает так называемый «педагог»?"
70014050-62 = "[s] «Ты не ошибаешься»."
70014050-63 = ""
70014050-66 = "[ns3] «Но даже так, если ты в конце концов откажешься от моей помощи...»\n[ns4] «Я... ничего не смогу сделать»."
70014050-69 = ""
70014050-70 = "...Понятно."
70014050-71 = "Как сломанное тело, которое не реагирует ни на одно лекарство, ни на одну вызванную химическую реакцию..."
70014050-72 = "[s5] «Верно. Но я... обязан помогать тебе».\n[s6] «Поэтому надеюсь, что ты дашь мне такую возможность, Кай»."
70014050-73 = ""
70014050-74 = ""
70014050-77 = "[ns] «Возможность помочь тебе»."
70014050-78 = "..."
70014050-79 = "Вы слышали выражение «вздох горького сожаления», Сенсей?"
70014050-80 = "Оно означает бесконечно сожалеть о том, чего уже не исправить. В каком-то смысле это... ловушка."
70014050-81 = "Это наивное чувство, столь же пустое, как утверждение, будто все люди по природе добры."
70014050-82 = "Чтобы подняться хотя бы к подножию горы, одной нерешительной попытки недостаточно."
70014050-83 = "...До сих пор я всегда так считала. Но..."
70014050-86 = ""
70014050-87 = "...Похоже, именно случившееся тогда и стало корнем проблемы."
70014050-88 = "В тот момент мне казалось, что ничего особенного не произошло, но..."
70014050-89 = "Если говорить о материальном, полагаю, где-то внутри меня появилась микроскопическая трещина, слишком маленькая, чтобы её заметить."
70014050-90 = "[s] «Ты говоришь о себе так, будто ты предмет»."
70014050-91 = "Ну, в большинстве случаев люди мало чем отличаются от предметов. По крайней мере, я именно так к ним отношусь."
70014050-92 = "Зарождение жизни — лишь химическая реакция, а человеческое существование — всего лишь тень воспоминаний."
70014050-93 = "Никакой души не существует, а разум — не более чем искра нервных клеток."
70014050-94 = "Фармакология же лишь изменяет или регулирует течение этих процессов."
70014050-95 = "...Для меня и другие люди, и я сама — не более чем объекты."
70014050-96 = "..."
70014050-97 = "Чужая печаль — понятие, которое трудно постичь. Умом я могу его понять, но эмоционально оно во мне не отзывается."
70014050-98 = "То же касается и чужих страданий. Люди могут говорить, что плачут из-за кого-то другого, но в конечном счёте оплакивают лишь себя."
70014050-99 = "Между людьми, несомненно, существует расстояние, которое в самой своей основе невозможно преодолеть."
70014050-100 = "И мне казалось... что я ощущаю эту дистанцию острее всех."
70014050-101 = "[s] «Почему... ты стала так думать?»"
70014050-102 = "...Кто знает?"
70014050-103 = ""
70014050-105 = ""
70014050-106 = "Если бы я могла ответить, возможно, моя жизнь была бы немного более «нормальной»."
70014050-107 = "Но, исходя из моего анализа, полагаю... я, вероятно, просто родилась такой."
70014050-108 = "Нет, меня такой создали."
70014050-109 = "[s] «Создали...?»"
70014050-110 = "Ну, это биологическая аналогия. Разве вся жизнь не возникает благодаря клеткам?"
70014050-112 = "В этом мире есть люди, которые с самого начала такие, Сенсей."
70014050-113 = "Их отнюдь не большинство, но именно им особенно трудно понимать других."
70014050-114 = "Чужие мысли, чувства, мотивы... Некоторые люди не способны воспринимать всё это интуитивно, поэтому вынуждены разбирать каждый случай по отдельности, чтобы понять."
70014050-115 = ""
70014050-116 = "И даже среди таких людей моя склонность к этому, думаю, особенно выражена."
70014050-117 = "Для этого нет оснований. Нет и какой-то причины. Я просто... с самого начала была такой."
70014050-118 = "К тому же по разным причинам моё воспитание лишь усилило эту особенность."
70014050-119 = "Я до сих пор не совсем понимаю идею, что помощь другим однажды вернётся к тебе добром."
70014050-120 = "Я знаю, что подобное возможно, но не особенно верю в этот принцип. Слишком много переменных."
70014050-121 = "И главное, даже если это правда... придётся долго ждать. Крайне неэффективный процесс."
70014050-122 = "[s] «Поэтому ты подчиняешь людей силой?»"
70014050-123 = "Да. Кажется, вы начинаете понимать."
70014050-124 = "Это быстро, прямо и сразу приносит желаемый результат. Но всё же..."
70014050-125 = "...Я не знаю, и это меня беспокоит. Давно я не испытывала такого чувства «незнания»."
70014050-126 = "Будто мне чего-то недостаёт, но я никак не могу понять чего."
70014050-127 = "По-настоящему ответить на этот вопрос — вот каким в итоге должно стать «обещание», которое мы с вами сдержим, Сенсей."
70014050-128 = "[s] «Тогда почему бы тебе не попробовать поучиться?»"
70014050-129 = ""
70014050-131 = ""
70014050-132 = "Поучиться?"
