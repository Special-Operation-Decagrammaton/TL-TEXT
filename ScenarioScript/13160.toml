13160-222 = "Além disso, por mais forte que a Hoshino-senpai seja,#nse ela for cercada por muitos inimigos, não vai ter o que fazer."
13160-223 = "E... precisamos impedir que o \"Canhão Ferroviário\" escondido em algum lugar do Deserto de Abydos#ncaia nas mãos de pessoas más."
