[translation]
13160-1 = "Эпизод 16;Контратака"
13160-9 = "..."
13160-10 = "Условия не лучшие, но пока придётся потерпеть, госпожа."
13160-11 = "Кто вообще..."
13160-12 = ""
13160-14 = ""
13160-15 = ""
13160-18 = ""
13160-19 = "...Это я."
13160-20 = "Комитет по выплате долга скоро нанесёт удар. Всё идёт по плану."
13160-21 = "Нужно быть полностью готовыми. И..."
13160-23 = "...И?"
13160-24 = ""
13160-26 = ""
13160-27 = "...Нефтис нас предала."
13160-28 = ""
13160-30 = ""
13160-31 = "...Как и ожидалось."
13160-32 = "Они раскрыли карты раньше, чем мы думали. И эти абидосские сопляки действительно опасны."
13160-33 = "...Всё нормально. Я просто удвою охрану."
13160-35 = ""
13160-38 = ""
13160-39 = "Хм... Понятно, понятно."
13160-40 = "Всё нормально. Мы ожидали этого предательства."
13160-41 = ""
13160-43 = ""
13160-45 = "Будь то Шале или Комитет по выплате долга, я со всем разберусь."
13160-47 = "...Подтверждаю."
13160-48 = "Удваиваю высоту баррикад... и на всякий случай устанавливаю противотанковые мины."
13160-49 = ""
13160-51 = ""
13160-52 = ""
13160-54 = ""
13160-55 = ""
13160-56 = ""
13160-57 = ""
13160-61 = ""
13160-64 = ""
13160-66 = "...Понятно."
13160-67 = "Ха... Железнодорожная пушка? Вы издеваетесь."
13160-68 = "Меня не интересует устаревшее оружие. Нас интересуют прорывные технологии, использованные при его создании."
13160-69 = "Если получим их, сможем создать оружие, какого Кивотос ещё не видел. В конце концов, это работа гениального Тирана-Императора."
13160-70 = "Поняла. Увеличу число рыночной охраны."
13160-75 = ""
13160-78 = ""
13160-80 = "Нефтис... предала нас...?"
13160-81 = "Нет худа без добра. Используем шанс вернуть бизнес, который у нас отобрала Кайзер Кредит."
13160-87 = "Фу. Надзиратель? Чего тебе? Ты знаешь, который час?"
13160-88 = ""
13160-92 = "А? Чрезвычайная ситуация? В-Война?! Ты что несёшь?"
13160-93 = ""
13160-96 = ""
13160-97 = "В смысле, что?! Мы наконец-то раскручиваем строительство Транс-пустынной железной дороги! Какая ещё «война»?"
13160-98 = "Хорошо!"
13160-99 = ""
13160-101 = ""
13160-102 = "Хикари! Впереди большая битва, полный ход!"
13160-103 = ""
13160-106 = ""
13160-107 = "Чего-о-о...?"
13160-115 = "[ns] Открыть глаза."
13160-119 = "[USERNAME] Сенсей?! Вы наконец очнулись!"
13160-120 = "[s] Сесть на кровати."
13160-121 = ""
13160-124 = "Какое облегчение! Вы попали в огромный взрыв, но чудом не получили ни единой царапины!"
13160-125 = "Но вам нужен строгий постельный режим из-за истощения—"
13160-126 = ""
13160-132 = "А? С-Сенсей? Куда вы?"
13160-133 = "[s1] «Я опаздываю...»\n[s2] «Мне нужно в Абидос.»"
13160-136 = "Да-да... Мы понимаем, вы очень заняты. Но не переусердствуйте, хорошо? И перед уходом обязательно зайдите на стойку и оплатите счёт!"
13160-137 = ""
13160-150 = "[ns] «(Вертолёты горят прямо на поле...)»"
13160-155 = ""
13160-156 = "Сенсей..."
13160-157 = "..."
13160-159 = "..."
13160-160 = "Сенсей... Хошино... Хошино..."
13160-161 = "[s] «Сначала зайдём в класс, все.»"
13160-162 = "Хорошо..."
13160-164 = "Хорошо..."
13160-165 = "*вздох* Я всё равно вся в грязи. Давайте сначала умоемся."
13160-168 = "Мы договорились снова собраться в комнате Комитета по выплате долга после уборки территории."
13160-170 = ""
13160-171 = "...Хошино ушла одна."
13160-172 = "Да... Она сказала нам не идти за ней."
13160-174 = "Я ничего не смогла сделать, чтобы остановить её... Я всё ещё слишком слабая."
13160-175 = "Не грызи себя, Широко! Тебе совсем не идёт. И дело не в том, что ты слабая, просто Хошино слишком сильная!"
13160-176 = "Да. Ты добрая, Сэрика."
13160-177 = "Что за фигня?! Разве обычно ты не должна сейчас меня подколоть?"
13160-178 = "Хорошо..."
13160-179 = "Что нам делать, Сенсей? Как остановить Хошино?"
13160-180 = "[s] «Хм...»"
13160-181 = "Силой её остановить было совершенно бесполезно..."
13160-182 = "Она ещё и сослалась на ранг, сказав, что это приказ вице-президента."
13160-183 = "Иными словами, она чётко заявила о себе как о члене прежде неоднозначного студсовета Абидоса."
13160-184 = "Она объявляет себя членом студсовета Абидоса, в котором состояла председатель Юмэ — основная сторона договора. Значит, ответственность ложится на студсовет Абидоса, а не на Комитет по выплате долга."
13160-185 = "Хошино собирается взвалить всё на себя: спасение Нономи, поиски и уничтожение Железнодорожной пушки и все последующие последствия..."
13160-186 = "Неужели у нас правда... нет права участвовать в борьбе Хошино? Остановить её?"
13160-187 = "Пока Хошино отвергает своё дорогое прошлое... а Нономи, одна из наших, в опасности, наша роль — просто... тревожно ждать в стороне?"
13160-189 = "..."
13160-190 = "*вздыхает*"
13160-191 = "[s] «Вы хотите остановить Хошино?»"
13160-192 = "Естественно!"
13160-193 = "Нономи — член нашего Комитета по выплате долга. Правильно будет спасти её вместе."
13160-195 = "Именно. Мы не можем позволить Хошино в одиночку идти в этот бой. И вопрос касается самой легитимности Комитета."
13160-196 = "[s] «Да, именно...»"
13160-197 = "Самое важное — вернуть Хошино."
13160-198 = "Она повторяет ту же ошибку, что раньше, тащит наши проблемы одна. Если не заставим её это понять, бессмысленно пытаться физически её остановить."
13160-199 = "Сейчас Хошино сосредоточена на выполнении воли председателя Юмэ... даже если ради этого придётся бросить нас..."
13160-201 = "Точно. Она гонится за тенями прошлого. Не смотрит на тех, кто рядом."
13160-202 = "Чувствую себя персонажем дневной мыльной оперы..."
13160-203 = ""
13160-206 = ""
13160-208 = "Но... как вообще убедить Хошино вернуться? Да и важнее — как мы её остановим?"
13160-209 = "Теперь, когда Сенсей здесь... что-нибудь придумаем."
13160-210 = "Нас одних хватит...?"
13160-211 = "Должно хватить. Это наша проблема. Мы должны остановить Хошино и сделать это законным способом."
13160-212 = "Наша проблема... Похоже, другого выбора нет, да?"
13160-214 = "...Да. Давайте ещё раз перечислим проблемы, которые нужно решить."
13160-215 = "Прежде всего, приоритет — спасти Нономи и не допустить её принудительного перевода в академию Хайлендер."
13160-216 = "Но поскольку мы не знаем, где держат Нономи, единственный вариант — выполнить приказ Нефтис и отвергнуть студсовет Абидоса."
13160-217 = "Но силы фонда прямых инвестиций сделают всё, чтобы не пустить нас на собрание."
13160-219 = "...Верно. И ещё нужно остановить Хошино, которая сейчас действует одна."
13160-220 = "Есть три главные причины остановить Хошино. Во-первых, Нономи — член Комитета по выплате долга, поэтому спасать её — наша ответственность!"
13160-221 = "Отрицать это значит отрицать сам смысл существования Комитета по выплате долга!"
13160-222 = "Во-вторых, даже для Хошино сил фонда слишком много, чтобы справиться одной. Если она продолжит действовать в одиночку, может получить тяжёлые ранения."
13160-223 = "И наконец... мы обязаны гарантировать, что Железнодорожная пушка в Пустыне Абидос не попадёт не в те руки."
13160-224 = "Значит, нужно выяснить, где она, и закрепить права собственности."
13160-225 = "Да... Верно."
13160-226 = "[s3] «Условия непростые...»\n[s4] «Нам предстоит крутой подъём.»"
13160-229 = "Да... прежний студсовет и нынешний Комитет по выплате долга..."
13160-230 = "Похоже, мы наконец смотрим в лицо этой чёрной дыре прошлого, от которой так долго отворачивались."
13160-231 = "Иногда... кажется, будто кто-то проверяет все наши слепые зоны и выполняет стратегию, бьющую туда, где мы слабее всего..."
13160-232 = "Стратегию...?"
13160-233 = "Хм... Звучит немного странно. Это просто ощущение."
13160-234 = "[s] «Нет, я тоже это чувствовал. Странное ощущение, которое не получается описать словами.»"
13160-235 = "И вы тоже, Сенсей...?"
13160-236 = "Я... хочу добавить ещё одну вещь..."
13160-237 = "Какую?"
13160-238 = "Мм... Я хочу как-нибудь не дать Хошино ранить себя ещё сильнее."
13160-239 = "Как Комитет по выплате долга важен для меня... так студсовет Абидоса был важным местом для Хошино."
13160-240 = "Я не хочу, чтобы Хошино пришлось отвергать эту часть себя..."
13160-242 = "Иными словами, ты хочешь как-то сохранить и студсовет Абидоса, верно...? Э-Это ты имеешь в виду?"
13160-244 = "...Ага."
13160-245 = "[s] «И при этом сохранить студсовет Абидоса...»"
13160-246 = "Простите за упрямство, Сенсей. Но—"
13160-247 = "[s] «Нет-нет, Широко.»"
13160-248 = ""
13160-250 = ""
13160-251 = "[ns] «Работа взрослого — выслушивать всё ваше упрямство. Всё нормально.»"
13160-252 = "...Угу."
13160-254 = "Сенсей..."
13160-255 = "...Да. Я правда не хочу, чтобы Хошино было грустно..."
13160-256 = "Комитет по выплате долга... студсовет Абидоса..."
13160-257 = ""
13160-259 = ""
13160-260 = "Аяне?"
13160-261 = ""
13160-263 = ""
13160-264 = "Кто мы вообще такие...?"
13160-265 = "Зачем мы вообще сражаемся за Абидос?"
13160-266 = "Мы... Чего мы вообще надеемся добиться...?"
13160-268 = "..."
13160-269 = "..."
13160-270 = ""
13160-272 = ""
13160-274 = "[ns] «...Хорошо. Я знаю, что делать.»"
13160-275 = ""
13160-277 = ""
13160-278 = "Сенсей...?"
13160-279 = "[s] «Пора принять решение и двигаться вперёд.»"
13160-280 = "...?"
13160-281 = "Решение...?"
13160-283 = "Сенсей...?"
13160-284 = "[s] «Должность председателя студсовета давно пустует, верно?»"
13160-285 = "Д-Да?"
13160-286 = "[s5] «Ну, вечно пустовать она не может.»\n[s6] «Так что я проведу внеочередные выборы.»"
13160-287 = ""
13160-288 = ""
13160-290 = ""
13160-292 = "Внеочередные выборы...?"
13160-293 = "Что? Выборы? Сейчас? Что вы имеете в виду?!"
13160-294 = ""
13160-296 = ""
13160-298 = "Председатель студсовета... внеочередные выборы..."
13160-299 = ""
13160-302 = ""
13160-303 = ""
13160-304 = "Точно! Нам просто нужно выбрать председателя студсовета!"
13160-306 = "Аяне...?"
13160-307 = "Это абсолютно возможно, Сэрика! Прямо здесь и сейчас присутствует 60% всех студентов Абидоса!"
13160-308 = "Д-Да? Нас трое из пяти... и что?"
13160-309 = "Кроме того, предыдущую председательницу студсовета выбрали именно так, значит, это будет полностью законно!"
13160-310 = ""
13160-311 = "[ns7] «Да, именно так Юмэ стала законной председательницей.»\n[ns8] «Мы просто следуем традиции и истории.»"
13160-314 = "[ns] «И главное — как Сенсей Шале я подтвержу законность этого решения.»"
13160-316 = "...!!"
13160-317 = "Да! Конечно!"
13160-318 = ""
13160-320 = ""
13160-324 = "Я участвую! Выдвигаю свою кандидатуру!"
13160-325 = ""
13160-329 = "Меня зовут Окусора Аяне! Я баллотируюсь на должность председателя студсовета Абидоса!"
13160-330 = ""
13160-333 = "Что?!"
13160-334 = "Раз председатель Юмэ была избрана таким способом... эти выборы тоже будут считаться настоящими и законными!"
13160-335 = "[ns] «Кандидат есть! Проведём простое голосование поднятием рук!»"
13160-338 = "Никаких правил про тайное голосование нет? Ну, я за!"
13160-339 = "Я тоже."
13160-340 = "Я голосую за себя как кандидат!"
13160-341 = ""
13160-342 = "[ns9] «Поскольку 60% ученического состава проголосовали за...»\n[ns10] «Аяне официально избрана новой председательницей студсовета.»"
13160-346 = "[ns11] «Как советник Шале и Абидоса...»\n[ns12] «...я, Сенсей [USERNAME]...»\n[ns13] «...утверждаю эти выборы.»"
13160-347 = ""
13160-348 = ""
13160-349 = ""
13160-356 = "С-Серьёзно? Вот так просто...? Аяне теперь председатель студсовета?"
13160-357 = "Да. Она."
13160-358 = "П-Постой. Тогда что теперь? Аяне теперь состоит в студсовете Абидоса? А Комитет Контрмер...?"
13160-359 = "[s] «Госпожа председатель, разъясните, пожалуйста. Каков статус Комитета по выплате долга?»"
13160-360 = ""
13160-362 = ""
13160-364 = ""
13160-365 = "Комитет по выплате долга... отныне объединяется со студсоветом Абидоса!"
13160-367 = "Ч-что?!"
13160-369 = "Студсовет Абидоса и Комитет по выплате долга теперь одно и то же! Объединённая организация сохранит название Комитета по выплате долга! В дальнейшем, чтобы избежать путаницы, называйте её именно так!"
13160-370 = "Логично. Так ни одно название не исчезает."
13160-371 = "Разве это всё не немного натянуто?! Э-Это правда нормально?"
13160-372 = "Абсолютно нормально, потому что так приказала председатель студсовета! Есть возражения, Куроми Сэрика?!"
13160-373 = "А, нет. Эм, никаких возражений..."
13160-374 = "Как секретарь Комитета по выплате долга и председатель студсовета Абидоса, теперь я изложу нашу миссию."
13160-375 = "Железнорукая правительница..."
13160-376 = "Наша цель — ворваться на общее собрание кредиторов и сохранить в силе договор, оставленный нам прежней председательницей!"
13160-377 = "Как председатель студсовета Абидоса я имею право унаследовать этот договор!"
13160-378 = "Кучинаши Юмэ, прежняя председательница, завещала эту миссию студсовету! Как её преемница, я прослежу, чтобы ни одна другая организация не получила права на Железнодорожную пушку!"
13160-380 = "Мм."
13160-381 = "Одновременно я потребую безопасно вернуть Нономи, которую незаконно удерживает Нефтис Group."
13160-382 = "Если требование не будет выполнено, мы расценим это как акт враждебности против студсовета Абидоса и ответим силой!"
13160-383 = "[s] «Я найду, где держат Нономи, а потом мы её спасём.»"
13160-384 = "Да!"
13160-385 = "Хорошо!"
13160-386 = "А Хошино?"
13160-387 = ""
13160-390 = ""
13160-391 = "...Хошино."
13160-392 = ""
13160-395 = ""
13160-396 = "А-Аяне...?"
13160-397 = ""
13160-401 = ""
13160-403 = "Хошино... вице-президент, которая сейчас создаёт проблемы..."
13160-406 = "Э-Эм..."
13160-407 = ""
13160-411 = "Её понизят до секретаря!"
13160-413 = "(Она просто скинула свою должность на Хошино...?!)"
13160-414 = "Да. Вот так. Отныне она больше не вице-президент."
13160-416 = "Именно! Поэтому даже если Хошино попытается отрицать законность студсовета Абидоса, это ничего не будет значить!"
13160-417 = "У секретаря нет полномочий отрицать наше существование!"
13160-418 = "Хошино не сможет отвергнуть ни нас, ни председателя Юмэ, ни даже саму себя!"
13160-419 = "Спасибо, Сенсей. Теперь всё улажено!"
13160-421 = "Правда? Хм... Как только Сенсей найдёт её местоположение, мы как-нибудь вытащим Нономи..."
13160-422 = "А поскольку Хошино больше не вице-президент, она больше не главная сторона договора... Значит, пока мы сохраняем договор, злодеи не получат Железнодорожную пушку."
13160-423 = "И при этом студсовет Абидоса и Комитет по выплате долга смогут существовать одновременно."
13160-424 = "С-Серьёзно... Мы всё решили...?"
13160-426 = "Да! Осталось преодолеть всего одно последнее препятствие!"
13160-427 = "Наша цель — прибыть на общее собрание кредиторов до полудня сегодня и заверить договор! Так мы остановим Хошино и спасём Нономи!"
13160-428 = "Будет непросто, но... нам нужно победить силы фонда прямых инвестиций."
13160-430 = "Хорошо. Поняла, госпожа председатель."
13160-431 = "Поняла. Но... это не будет лёгкой прогулкой."
13160-432 = "[s] «Будет тяжело. Но мы сделаем это так или иначе.»"
13160-434 = "Да! Мы не сдадимся, что бы ни случилось!"
13160-435 = "Потому что таков путь студсовета Абидоса, он же Комитет по выплате долга!"
13160-436 = ""
13160-438 = ""
13160-439 = ""
13160-441 = "(Аяне смутилась только сейчас, после всего этого...)"
13160-442 = "[s] «Хорошо. Все слышали председателя! Выдвигаемся!»"
13160-443 = "...Да."
13160-444 = "...А куда весь тот пыл делся?"
