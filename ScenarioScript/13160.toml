13160-184 = "...Se o Conselho Estudantil de Abydos nunca tivesse existido,#no contrato em si deixaria de existir."
13160-185 = "A senpai disse que vai alegar a nulidade do contrato na assembleia, salvar a Nonomi-senpai, destruir o Canhão Ferroviário e depois...#nassumir a responsabilidade e desaparecer das nossas vidas."
