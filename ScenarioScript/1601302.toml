[translation]
1601302-1 = "Долг Кохару"
1601302-2 = "Я пришёл к водопаду, чтобы насладиться редкой возможностью побыть одному."
1601302-3 = ""
1601302-10 = "Пока я наслаждался видом и звуками вокруг, послышались чьи-то быстрые шаги."
1601302-11 = ""
1601302-14 = "[ns1] «Должно быть, Кохару...»\n[ns2] «Похоже, время пришло.»"
1601302-15 = ""
1601302-16 = ""
1601302-20 = ""
1601302-22 = "Вот вы где, Сенсей!"
1601302-24 = ""
1601302-25 = "Вы прочитали моё сообщение в MomoTalk? Я знаю, что прочитали!"
1601302-26 = "Говорите правду, прямо сейчас! Что вы делаете здесь в одиночестве?"
1601302-27 = "Что? Отдыхаете? Наслаждаетесь временем наедине с собой?"
1601302-28 = "Ха! Очень правдоподобно!"
1601302-29 = "Я вас знаю! Вы пришли сюда, чтобы фантазировать обо всяких своих странностях, да?!"
1601302-30 = "...Что? Клянётесь, что нет?"
1601302-31 = "По крайней мере сегодня? Даже взрослым иногда нужно отдыхать?"
1601302-32 = "Особенно в совершенно новой обстановке? Я вообще перестала вас понимать..."
1601302-33 = "...Потому что лето? На острове? Я совсем не понимаю..."
1601302-34 = "Хм... Летние каникулы, остров..."
1601302-35 = ""
1601302-37 = ""
1601302-38 = "П-Правда? Вы просто отдыхаете и веселитесь?"
1601302-39 = "[s3] «Другое время, другое место.»\n[s4] «Скоро и ты научишься ценить такие моменты.»"
1601302-42 = "Н-Но...! Я не верю!"
1601302-43 = "Сенсей, которого я знаю, постоянно думает о каких-то странностях! Так не бывает!"
1601302-44 = "...А? А что я? Почему спрашиваете?"
1601302-45 = "С чего бы мне меняться только потому, что сейчас лето? Нет! Спасибо, но заниматься самоанализом я не собираюсь!"
1601302-46 = "Вы опять несёте какую-то ерунду, Сенсей! Моя работа здесь проста — следить за вами!"
1601302-47 = "Я ваш сопровождающий и должна убедиться, что вы не сделаете ничего странного с другими студентами!"
1601302-48 = "Это мой долг как члена Отряда правосудия!"
1601302-49 = "Хм. Но если вы правда не ведёте себя странно и говорите честно..."
1601302-50 = ""
1601302-52 = ""
1601302-53 = "Тогда какой смысл мне вообще здесь находиться? Почему... я здесь стою?"
1601302-54 = "[s5] «Какой философский вопрос.»\n[s6] «Не нужно так всё усложнять.»"
1601302-57 = "Но я же не могу просто заниматься своими делами..."
1601302-58 = "...Что?"
1601302-59 = "Не усложнять всё — это тоже часть лета?"
1601302-60 = "Опять чушь! Угх!"
1601302-61 = "Вы за дурочку меня держите, Сенсей?! Я накажу вас за неподчинение!"
1601302-62 = "Ну... пожалуй..."
1601302-63 = "Ладно. На этот раз, пожалуй, поверю вашим словам, Сенсей."
1601302-64 = "А?"
1601302-65 = "Мне тогда вернуться в лагерь?"
1601302-66 = "Н-Не говорите глупостей!"
1601302-67 = "И-и вообще, зачем вы это спрашиваете? Вы обращаетесь со мной как с помехой!"
1601302-68 = "[s7] «Я вовсе не это имел в виду...»\n[s8] «Можешь остаться, если хочешь.»"
1601302-71 = "Я всё поняла! Вы так стараетесь от меня избавиться, чтобы, как только я отвернусь, заняться своими злодеяниями!"
1601302-72 = "Хмпф! Я член Отряда правосудия! Меня вам не провести!"
1601302-73 = "Я ни на сантиметр не сдвинусь! Я буду следить за каждым вашим движением, Сенсей."
1601302-74 = ""
1601302-76 = ""
1601302-77 = ""
1601302-78 = "...Вот!"
1601302-79 = "[s9] «Да мне правда всё равно...»\n[s10] «Тебе скоро станет ужасно скучно.»"
1601302-82 = "Ничего из того, что вы скажете, не заставит меня передумать!"
1601302-84 = "И Кохару действительно провела остаток дня рядом со мной, то и дело озираясь по сторонам."
1601302-85 = ""
1601302-91 = "Пока я наслаждался редким свободным временем и отдыхал, незаметно прошёл час."
1601302-92 = "Я посмотрел на Кохару — она уже выбилась из сил и сама сидела с пустым взглядом."
1601302-95 = "― [log=코하루 수영복]...Эм...[/log][wa:260]"
1601302-98 = "― [log=코하루 수영복]Сенсей...? Сколько вы ещё собираетесь здесь сидеть? [/log][wa:1540]"
1601302-100 = "― [log=코하루 수영복]Я просто не понимаю...[/log]"
1601302-103 = "[ns11] «Можешь вернуться, если тебе слишком скучно.»\n[ns12] «В жизни взрослых нужны такие моменты.»"
1601302-104 = "― [log=코하루 수영복]Вот как...[/log][wa:1620]"
1601302-105 = "― [log=코하루 수영복]Вот как...[/log][wa:1620]"
1601302-107 = "― [log=코하루 수영복]Может, мне и правда вернуться...[/log][wa:70]"
1601302-110 = "― [log=코하루 수영복]...Стоп![/log]"
1601302-113 = "― [log=코하루 수영복](Нет, нет, нет!)[/log]"
1601302-115 = "― [log=코하루 수영복](Что я вообще говорю?!)[/log]"
1601302-118 = "― [log=코하루 수영복](Плохо! Сенсей пытается меня обмануть.)[/log][wa:1110]"
1601302-121 = "― [log=코하루 수영복](Я чуть не потеряла бдительность...)[/log]"
1601302-123 = "― [log=코하루 수영복](Нет, я не могу этого допустить!)[/log][wa:10]"
1601302-126 = "― [log=코하루 수영복]Я не позволю вам действовать мне на нервы![/log][wa:1230]"
1601302-129 = "― [log=코하루 수영복]...Хмпф![/log]"
1601302-132 = ""
1601302-133 = "Кохару выпрямилась и вновь вступила в бой со скукой."
1601302-134 = ""
1601302-139 = "Проиграла она довольно быстро и вскоре уже мирно похрапывала."
1601302-140 = ""
1601302-143 = "Я ещё немного наслаждался тишиной у водопада, а затем отнёс всё ещё спящую Кохару обратно в лагерь."
