[translation]
2001303-1 = "Высшие техники взлома"
2001303-2 = "Рядом с Деловым районом 1"
2001303-3 = "Вот вы где, Сенсей. Я ждала."
2001303-4 = "Я знаю, что вы заняты. Спасибо, что пришли сегодня."
2001303-5 = "Теперь, когда вы здесь, можем приступать."
2001303-6 = "[s1] «Я немного нервничаю.»\n[s2] «Думаешь, у меня получится?»"
2001303-7 = "Почему вы так переживаете, Сенсей?"
2001303-8 = "Почему вы так переживаете, Сенсей?"
2001303-9 = "Как я уже сказала, вам нужно лишь стоять рядом."
2001303-10 = "Я буду иметь дело с IT-компанией, расположенной в этом высотном здании."
2001303-11 = "После недавнего расширения сервера их защита ослабла, но президент компании упрям и не хочет доверять данные такому студенту, как я."
2001303-12 = "[s3] «Так какой план проникновения?»\n[s4] «Через сколько вентиляционных шахт нам придётся проползти?»"
2001303-13 = "О чём вы вообще? Мы войдём через главный вход."
2001303-14 = "О чём вы вообще? Мы войдём через главный вход."
2001303-15 = "Мы не герои шпионского романа. Это серьёзная работа."
2001303-18 = ""
2001303-19 = ""
2001303-20 = "Здравствуйте? Я Кагами Чихиро из Научной школы «Миллениум».#nМы разговаривали сегодня утром."
2001303-21 = "Я пришла на консультацию по безопасности серверов вашей компании."
2001303-22 = "Пожалуйста. Проходите."
2001303-23 = "Спасибо."
2001303-24 = "Помните, что я говорила, Сенсей. Вам не нужно ничего делать или говорить.#nПросто подыгрывайте и следуйте за мной."
2001303-25 = "Идём внутрь."
2001303-26 = ""
2001303-28 = ""
2001303-31 = "Итак, вы считаете, что данные нашей компании находятся под угрозой?"
2001303-32 = "Да. Похоже, новый установленный вами сервер использует старый антивирус, который хакеры уже взломали."
2001303-33 = "Вы уязвимы для спуфинга, и все данные компании и партнёров могут попасть в руки злоумышленников."
2001303-34 = "В том числе конфиденциальная информация о новых проектах."
2001303-35 = "Этого нельзя допустить. Вы правы — безопасность сервера нужно усилить."
2001303-36 = "Но почему я должен доверить управление сервером «Веритас»?"
2001303-37 = "Вы можете производить впечатление профессионалов,#nно «Веритас» всё ещё всего лишь любительский клуб, которым управляют студенты."
2001303-38 = "Мы студенты, но уж точно не любители. «Веритас» предоставлял комплексные решения по безопасности нескольким IT-компаниям Кивотоса."
2001303-39 = "В том числе Сенсею, советнику Шале, который находится здесь."
2001303-40 = "[s5] «Д-Да, всё верно!»\n[s6] «Решения Чихиро в области безопасности — лучшие!»"
2001303-41 = "Шале? Вы имеете в виду следственный клуб, наделённый внеюрисдикционными полномочиями президентом Генерального студенческого совета?"
2001303-42 = "Шале? Вы имеете в виду следственный клуб, наделённый внеюрисдикционными полномочиями президентом Генерального студенческого совета?"
2001303-43 = "Насколько я понимаю, Шале обменивается данными с несколькими академиями.#nЕсли даже Шале доверяет «Веритас», полагаю, моя компания тоже может."
2001303-44 = "И всё же я предпочёл бы, чтобы за это отвечал кто угодно, только не студент.#nНе знаю, что думать о том, чтобы доверить свои данные детям."
2001303-45 = "[s7] «Я могу поручиться за навыки Чихиро.»\n[s8] «Если что-то случится, я возьму ответственность на себя.»"
2001303-46 = ""
2001303-47 = ""
2001303-49 = ""
2001303-50 = "Интересно."
2001303-51 = "Хорошо. Тогда как насчёт годового контракта?"
2001303-52 = "Я бы не согласился на это, если бы вёл переговоры только со студентами..."
2001303-53 = "...но я доверюсь слову этого Сенсея."
2001303-54 = "Спасибо, господин президент. Мы будем обращаться с данными вашей компании с максимальной осторожностью."
2001303-56 = "Фух. Рада, что всё закончилось."
2001303-57 = "Теперь какое-то время нам не придётся переживать о финансах."
2001303-58 = "[s] «И что это сейчас было?»"
2001303-59 = "Хм? Я же говорила: перед началом работы собиралась установить бэкдор."
2001303-60 = "В терминах программирования бэкдор — это короткий путь, созданный для удобства.#nБазовая хакерская техника, позволяющая легко обойти даже самый непроницаемый файрвол."
2001303-61 = "Я имела в виду, что ваше присутствие стало тем бэкдором, который помог обойти файрвол президента — его предубеждение против работы со студентами.#nМожно сказать, благодаря вам мой взлом удался."
2001303-62 = "[s] «Это ведь не считается взломом, правда?»"
2001303-63 = "Конечно считается. Это совершенно законная техника."
2001303-64 = "Суть хакинга — любым доступным способом отключить защиту противника и получить нужную информацию."
2001303-65 = "Умение выстраивать доверие через разговор — одна из лучших хакерских техник."
2001303-66 = "Теперь бы ещё донести это до остальных участниц «Веритас»..."
2001303-67 = "В любом случае спасибо за помощь сегодня. В следующий раз угощу вас кофе."
2001303-68 = ""
2001303-70 = ""
