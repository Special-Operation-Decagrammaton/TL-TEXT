[translation]
1013506-1 = "Вышло из-под контроля"
1013506-2 = "Я пришёл в комнату Отдела разработки игр, как и сказала Кей."
1013506-6 = "*вздох*... Здесь опять это происходит..."
1013506-7 = ""
1013506-9 = ""
1013506-10 = "Наверное, это потому, что значение коллизии определено неправильно... И ещё вот это..."
1013506-11 = "[s] «Кей-Кей...?»"
1013506-12 = "А, ты пришёл, Сенсей."
1013506-13 = "Что я делала? Как видишь, совершенно очевидно..."
1013506-14 = "..."
1013506-15 = "Говорят, лучше один раз испытать самому, чем сто раз услышать объяснение."
1013506-16 = "Вот, попробуй сам!"
1013506-17 = ""
1013506-18 = "С необычайно приветливой улыбкой Кей протянула мне геймпад."
1013506-19 = "А затем...!"
1013506-20 = ""
1013506-24 = ""
1013506-25 = "...Сенсей?"
1013506-26 = ""
1013506-28 = ""
1013506-29 = "[ns] «Ох... А?»"
1013506-30 = "Эм, ты в порядке? Ты немного... отключился."
1013506-31 = "Что? Ты говоришь, что игра была настолько плохой, что ты «почти потерял сознание»?"
1013506-32 = "Драматично. И грубо. Хотя, наверное, правда."
1013506-33 = "А, эта игра?"
1013506-34 = "..."
1013506-35 = "Это альфа-версия нового проекта Отдела разработки игр..."
1013506-36 = "[s] «А.»"
1013506-37 = "По твоему лицу видно, что ты не особенно удивлён."
1013506-38 = "...Понимаю."
1013506-39 = "[s1] «Почему Кей-Кей...? Зачем подвергать себя таким пыткам...?»\n[s2] «Жизнь слишком скучная...? Ты решила выйти за пределы бытия?»"
1013506-42 = "Грубо! Я занималась QA-тестированием!"
1013506-43 = "[s3] «QA?»\n[s4] «А, вопросы и ответы.»"
1013506-44 = "Обеспечение качества, да... Иными словами, я работала тестировщиком игры и, естественно, составляла отчёты об ошибках."
1013506-45 = "Работа недооценённая, но очень ценная. Если бы только разработчики уважали сроки..."
1013506-46 = "Да... Ну, будь то отчёты об ошибках или тестирование игр, кто-то должен этим заниматься."
1013506-47 = "Кроме того, у меня всё ещё гора других дел."
1013506-48 = "И всё же что это за список исправлений...? *вздох*..."
1013506-49 = "С чего вообще начинать? Если игра НАСТОЛЬКО плоха, подозреваю проблему на уровне базовой архитектуры."
1013506-50 = "Нет, не может быть... Полная переработка означала бы фактически сделать игру заново с нуля."
1013506-51 = "Нужно найти исправление, которое позволит обойти это..."
1013506-52 = "[s] «Наверное, хлопот очень много, Кей-Кей.»"
1013506-53 = "Ничего страшного. По сравнению с остальным это легко."
1013506-54 = "...Но мне кажется, мозг взорвётся, если придётся возвращаться к этапам планирования, предложений и ресурсов."
1013506-55 = "[s] «Ты ещё и этим занимаешься?»"
1013506-56 = "..."
1013506-57 = "Да. Как-то так получилось."
1013506-58 = "Серьёзно, увидев состояние игры, я просто не могла не взять всё в свои руки."
1013506-59 = "Интересно, почему это всегда настолько сложно."
1013506-60 = "Изменения в проектном предложении вообще-то должны быть простыми. Даже ожидаемыми."
1013506-61 = "Но почему решение всегда звучит как «полностью переделаем ресурсы», а не «сократим и доработаем их»?"
1013506-62 = "Всё начиналось как уютная повседневная игра!"
1013506-63 = "Почему теперь это RTS, где нужно строить сухопутные линкоры на секретной подземной базе, чтобы спасти мир от инопланетной оккупации?!"
1013506-64 = "Художник слышит нелепый сценарий и, вопреки здравому смыслу, берётся за работу."
1013506-65 = "Потом инженер пытается внедрить новые модели и в итоге просто запихивает их силой. Всё становится неоптимизированным..."
1013506-66 = "Начинающие программисты сегодня думают, что именно так всё и делается! Почему? Потому что вокруг них постоянно именно это."
1013506-67 = "«Hello World, у меня чрезвычайная ситуация! Я не успел сохранить игру!»"
1013506-68 = "Проблема в том, что им это позволяют! Если постоянно выпускать ужасные игры, они и дальше будут делать ужасные игры!"
1013506-69 = "[s] «Я не очень понимаю... но звучит как куча проблем...»"
1013506-70 = "Можешь, пожалуйста, отнестись к этому серьёзно?"
1013506-71 = "[s] «Я-я и относился серьёзно!»"
1013506-72 = "..."
1013506-73 = "С-Спасибо..."
1013506-74 = ""
1013506-75 = "[ns] «То есть ты QA, продюсер и ещё человек на все случайные поручения.»"
1013506-76 = "Конечно, если ты считаешь, что такому крошечному клубу вообще нужны все эти лишние титулы."
1013506-77 = "...Хотя, если подумать, технически я ещё и состою в Отряде Исследования Сверхъестественного...?"
1013506-78 = "[s] «Но разве большую часть времени ты не проводишь здесь?»"
1013506-79 = "..."
1013506-80 = "Это правда. Провожу."
1013506-81 = "В общем, вот так всё и обстоит."
1013506-82 = "Неважно, проверяю ли я игру или сражаюсь с каким-то неизвестным монстром..."
1013506-83 = "В конечном счёте я всегда понимала, когда кому-то нужно встать у руля."
1013506-84 = "Но самая важная — и самая сложная — часть заключается в обратной связи."
1013506-85 = "[s] «Вот ЭТО я понимаю...»"
1013506-86 = "Серьёзно?"
1013506-87 = "[s5] «Если зайти слишком далеко, ты уже не помогаешь человеку найти собственное видение.»\n[s6] «...а начинаешь говорить ему, что он должен думать.»"
1013506-90 = "...Да. Именно в этом проблема."
1013506-91 = "Когда такое происходит — простите, если это прозвучит по-детски и банально..."
1013506-92 = "...отношения портятся."
1013506-93 = "[s7] «Хорошее выражение.»\n[s8] «Когда отношения портятся, уже ничего не работает как надо.»"
1013506-96 = "..."
1013506-97 = "Ты И ПРАВДА понимаешь."
1013506-98 = "Ну, по крайней мере Момои обычно нормально воспринимает обратную связь."
1013506-99 = "...Проблема в том, что стоит мне закончить говорить, как она тут же приносит новое предложение."
1013506-100 = "Вот бы она поняла важность документации и журналов!"
1013506-101 = "А Мидори пора перестать слепо соглашаться на каждый проект!"
1013506-102 = "Она каким-то образом успевает к срокам, но только постоянно урезая саму себя. Так нельзя продолжать!"
1013506-103 = "Нельзя, чтобы вся игра держалась на одном перерабатывающем разработчике! Это позор!"
1013506-104 = "[s] «Я рад, что ты здесь, Кей-Кей.»"
1013506-105 = "Правда? А мне кажется, мной просто пользуются!"
1013506-106 = "Ну, всё же..."
1013506-107 = "Ну..."
1013506-108 = "Хм..."
1013506-109 = "В конечном счёте все, похоже, счастливы."
1013506-110 = ""
1013506-112 = ""
1013506-115 = ""
1013506-116 = "Фу-фу..."
1013506-117 = "[s] «Жаль.»"
1013506-118 = "...Что."
1013506-119 = "[s] «Жаль, что я не успел сфотографировать твою улыбку.»"
1013506-120 = "Попробуй в следующий раз. Только попробуй. Серьёзно."
1013506-122 = "Так я ещё несколько часов играл в новую игру Отдела разработки игр..."
1013506-123 = "То есть — «проводил QA» вместе с Кей."
1013506-124 = "Пару раз я чуть не потерял сознание."
