[translation]
10008110-1 = "Эпизод 11;Битва при Дайкичидэне"
10008110-2 = ""
10008110-3 = "Б-Босс! У главного входа началась перестрелка!"
10008110-4 = "Такими темпами они скоро прорвутся прямо в офис!"
10008110-5 = "Чёрт! Как смеют эти кретины мешать нашему бизнесу?!"
10008110-6 = "Я не ожидал, что придётся делать это так скоро, но ладно."
10008110-7 = "Пора нам удирать вместе с ящиком!"
10008110-10 = ""
10008110-12 = "А ну стой!"
10008110-13 = "Опять вы?! Это вы устроили этот бунт?!"
10008110-14 = "А кто ещё?"
10008110-15 = "Это тебе за то, что назвал нас дураками, верящими всему в интернете."
10008110-16 = "Посмотрим, понравится ли тебе, когда толпа из соцсетей обернётся против тебя!"
10008110-18 = "Кажется, это называется «отменой»."
10008110-19 = "И ты это заслужил ещё и за отношение к работникам."
10008110-20 = "Как ты смеешь пользоваться трудом подработчицы?! Ты заплатишь!"
10008110-22 = "Гх! Наглые мелкие...!"
10008110-23 = "Запросить подкрепление! Собрать все силы!"
10008110-24 = "Раздавить такую маленькую группу, как ваша, будет проще простого объединённой мощью банды Курокамэ!"
10008110-25 = "Э-Эм... босс? Наши силы всё ещё заняты осадой главного входа!"
10008110-26 = "Да?"
10008110-29 = "Поехали!"
10008110-30 = "Пора наказать плохих ребят! ☆"
10008110-31 = ""
10008110-34 = ""
10008110-35 = "Вы заплатите за то, что растоптали мечты людей."
10008110-38 = "М-Может, просто позовём всех, кто НЕ у главного входа?"
10008110-39 = "В том-то и дело! Драки идут не только у главного входа — они повсюду!"
10008110-40 = "...!"
10008110-43 = "Эта банда Курокамэ..."
10008110-44 = "Они заплатят за весь этот шум в Новый год!"
10008110-45 = "Окружить их."
10008110-46 = "Покажите им, что бывает, когда заставляют нас работать сверхурочно в праздник!"
10008110-48 = ""
10008110-49 = "Да!"
10008110-50 = ""
10008110-52 = ""
10008110-54 = "Я понимаю чувства Иори, но обязательно было выносить грязное бельё дисциплинарного комитета на публику?"
10008110-55 = "Ну, всё-таки праздник, так что на этот раз закрою глаза."
10008110-56 = "Может, ей даже полезно снять стресс."
10008110-57 = "Удачи, банда Курокамэ. Она вам понадобится."
10008110-60 = "Ч-Что...? Как это произошло?"
10008110-61 = "Хотите знать?"
10008110-62 = "К этому моменту должно быть очевидно."
10008110-63 = "Потому что вы посмели перейти дорогу Решалам 68!"
10008110-65 = "Ару такая крутая!"
10008110-66 = "По-моему, она совсем чуть-чуть преувеличивает."
10008110-67 = "Но она всегда такая. Если Ару вошла во вкус, её уже не остановить!"
10008110-68 = ""
10008110-71 = ""
10008110-72 = "Вам когда-нибудь говорили, что ваш босс слишком наглая для собственного блага?"
10008110-73 = "Я-Я вообще-то всё слышала!"
10008110-74 = "Это наш шанс показать, чего мы стоим. Пора за работу."
10008110-75 = "Тебя это тоже касается, Сенсей."
10008110-76 = "[s] «Хорошо. Сделаем это!»"
