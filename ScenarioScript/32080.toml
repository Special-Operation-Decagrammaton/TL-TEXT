[translation]
32080-1 = "Эпизод 8;Проблеск надежды"
32080-2 = "Вы опоздали!"
32080-3 = "Азуса... Т-Ты рано пришла."
32080-4 = "Я начала заниматься ещё до рассвета, а потом проверила, что запомнила."
32080-5 = "Ничего себе. Ты и правда полна решимости."
32080-6 = "Естественно. Сегодня ведь очередной пробный экзамен, верно?"
32080-7 = "Да, верно. Так ты к нему готовилась?"
32080-8 = "Да. До следующего настоящего экзамена всего два дня, и я не хочу вас подвести."
32080-9 = ""
32080-11 = ""
32080-13 = "Сегодня я ОБЯЗАТЕЛЬНО сдам!"
32080-14 = "Надо же. Ты почти никогда так не загораешься."
32080-15 = "Я снова и снова повторяла всё, что может попасться на экзамене. Ничего не упустила."
32080-16 = "Н-Ну, лучше меня тебе всё равно не написать! Я покажу вам, на что способна элита Отряда правосудия!"
32080-17 = "Вот это настрой. Я тоже покажу, чему научилась."
32080-18 = "[s] «Похоже, все готовы.»"
32080-19 = ""
32080-21 = ""
32080-22 = "Тогда без лишних слов приступим к следующему пробному экзамену!"
32080-24 = "Второй пробный экзамен Клуба дополнительных занятий"
32080-26 = "[ns] Начали!"
32080-30 = "..."
32080-33 = "Не так уж и сложно."
32080-36 = "Я-Я это знаю! Нужно только... Гр-р..."
32080-37 = ""
32080-40 = "Теперь все пишут гораздо быстрее, чем раньше!"
32080-41 = ""
32080-44 = "После экзамена я проверил все работы."
32080-45 = "Когда будете готовы, Сенсей."
32080-46 = "[s] Посмотреть результаты."
32080-47 = ""
32080-50 = "[b]Результаты третьего пробного экзамена Клуба дополнительных занятий[/b]"
32080-52 = "[b]Ханако: 69 баллов [007eff](Сдано)[-][/b]"
32080-54 = "[b]Азуса: 73 балла [007eff](Сдано)[-][/b]"
32080-56 = "[b]Кохару: 61 балл [007eff](Сдано)[-][/b]"
32080-58 = "[b]Хифуми: 75 баллов [007eff](Сдано)[-][/b]"
32080-60 = "М-Мы справились?! Все сдали?!"
32080-61 = "Это не шутка, правда?!"
32080-62 = "Успех!"
32080-63 = "Ну надо же!"
32080-64 = ""
32080-66 = ""
32080-68 = "Молодец, Азуса! Ты не просто получила тройку — сразу дотянула до четвёрки!"
32080-69 = "С-Спасибо."
32080-70 = "Ты тоже молодец, Кохару. Едва перешагнула порог, но всё-таки сдала!"
32080-71 = "М-Мне это не снится? Это правда мой результат?.."
32080-72 = "Видите? Я же говорила, что раньше не выкладывалась! Вот на что я способна на самом деле!"
32080-73 = "Ты показала нам, что значит быть членом Отряда правосудия!"
32080-74 = "Ты тоже снова сдала, Ханако."
32080-75 = "Наверное, мне просто повезло. Какой приятный результат. ♥"
32080-76 = "Я рада за тебя, но..."
32080-77 = "Что такое?"
32080-78 = "Я до сих пор не понимаю, почему ты здесь оказалась, но рада, что ты стала серьёзнее относиться к занятиям."
32080-79 = "Хифуми..."
32080-80 = "Я не отступлюсь, пока ты не вернёшься к прежним результатам. Обещаю."
32080-81 = "Понятно. Прости, что заставила тебя так волноваться."
32080-83 = "Ну а теперь пора раздать обещанные подарки «Момо и друзья»!"
32080-84 = ""
32080-87 = "Наконец-то!"
32080-88 = "..."
32080-89 = "..."
32080-90 = "Раз все сдали, каждая может выбрать себе подарок! Берите, какой нравится!"
32080-91 = "Какой... нравится...!"
32080-92 = "Я, пожалуй, откажусь, но спасибо."
32080-93 = "Я тоже."
32080-94 = "Хм-м."
32080-95 = "Какой же выбрать? Я..."
32080-96 = "Не могу! Одного выбрать невозможно!"
32080-97 = "Чёрный с рогами хорош, но и бегемот в очках тоже!"
32080-98 = "Я же говорила, Пероро — птица, а не бегемот..."
32080-99 = "Не могу выбрать один. Что же делать?"
32080-100 = "П-Прости, Хифуми. Можешь выбрать за меня?"
32080-101 = "Я-Я?"
32080-102 = "Хм. Ты говорила, что тебе очень нравятся Скеллмен и доктор Пероро..."
32080-103 = ""
32080-105 = ""
32080-106 = "..."
32080-107 = ""
32080-109 = ""
32080-110 = "Тогда возьмём учёного доктора Пероро!"
32080-111 = "Понятно! Беру его!"
32080-112 = "Доктор Пероро славится знаниями и усердием в учёбе."
32080-113 = "Я выбрала его, потому что ты тоже так многому научилась и так старательно занималась."
32080-114 = "Понятно. Как умный профессор."
32080-115 = "Н-Неважно, что по предыстории Пероро от усердной учёбы немного свихнулся. Это несущественно..."
32080-116 = "[s] «Похоже, он тебе понравился, Азуса.»"
32080-117 = "Да, очень. Хи-хи..."
32080-118 = "Спасибо, Хифуми. Я буду вечно его беречь."
32080-119 = "Спасибо, но благодарить меня не нужно. Ты сама его заслужила."
32080-120 = "Возможно... но это первый подарок, который мне когда-либо дарил друг."
32080-121 = "Каждый раз, глядя на этого бегемота, я буду вспоминать тебя!"
32080-122 = "К-Как-то неловко... И я же говорила: он птица, не бегемот!"
32080-123 = ""
32080-125 = ""
32080-126 = "Кто бы мог подумать, что у них столько общего?"
32080-127 = "Жутковато..."
32080-129 = "Воодушевлённые, девочки продолжили учиться."
32080-133 = "День прошёл спокойно и тихо."
32080-135 = "Завтра решающий день."
32080-136 = "А-а-а..."
32080-137 = "Второй экзамен."
32080-138 = "Уже? Дни просто пролетают."
32080-139 = "Пусть прошла всего неделя, я уверена, наши старания окупятся."
32080-140 = "Последний пробный экзамен это доказал. Мы вполне готовы!"
32080-141 = "Так что не расслабляемся! Сегодня занимаемся изо всех сил!"
32080-142 = "Конечно. Меня устроит только сто баллов."
32080-143 = "М-Меня тоже!"
32080-144 = "Значит, и мне придётся получить столько же."
32080-145 = ""
32080-147 = ""
32080-148 = "Не знаю насчёт идеального результата, но уверена, у нас у всех получится."
32080-149 = "Так что за учебники! Остался всего день!"
32080-150 = "[s] «Погнали-и-и!»"
32080-153 = "Я вас ждала. Давно не виделись, Сенсей."
32080-154 = "Как ваши дела? Подготовка идёт гладко? Ничего не беспокоит?"
32080-155 = "[s] «Что тебе опять нужно?»"
32080-156 = "...Знаете, я организовала подготовку, чтобы вы могли внимательнее присмотреться к студентам."
32080-157 = "Удалось? Что-нибудь выяснили?"
32080-158 = "Если точнее, у вас появилась главная подозреваемая?"
32080-159 = "[s] «Я уже сказал, что разберусь по-своему.»"
32080-160 = "Помню. Я лишь хотела узнать, как у вас дела, ведь второй экзамен уже близко."
32080-161 = "Поэтому и попросила вас прийти."
32080-162 = "Насколько я понимаю, вы недавно общались и с Микой..."
32080-163 = ""
32080-165 = ""
32080-166 = ""
32080-167 = "Что она сказала? Не расскажете?"
32080-169 = "Следующий Эпизод;Тень протягивает руку"
