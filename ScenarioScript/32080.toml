[translation]
32080-1 = "Episódio 8;Um Raio de Esperança"
32080-2 = "Que demora! Bom dia!"
32080-3 = "Ah, Azusa-chan. Acordou cedo, hein?"
32080-4 = "Antes mesmo do sol nascer, eu já estava aqui revisando e adiantando a matéria."
32080-5 = "Fufu, você está super animada, Azusa-chan."
32080-6 = "É claro, afinal hoje também tem simulado. Não é, Hifumi?"
32080-7 = "Sim, isso mesmo. Pelo visto, você já está totalmente preparada para o simulado, né, Azusa-chan?"
32080-8 = "Uhum. Só faltam dois dias para a 2ª Prova Especial de Aptidão Acadêmica, e não posso continuar deixando todo mundo preocupado para sempre."
32080-13 = "E, dessa vez...!"
32080-14 = "N-Nossa, quanta determinação..."
32080-15 = "Eu já repassei várias vezes as questões previstas do conteúdo da prova. Minha preparação está perfeita."
32080-16 = "E-Eu também não vou ficar para trás! Vou mostrar o poder da elite do Comitê de Justiça!"
32080-17 = "Então, acho que também vou dar o meu melhor♡"
32080-18 = "[s] \"Vocês estão todas bem empolgadas, hein.\""
32080-22 = "Sim...! Bom, já que estamos nesse embalo, que tal começarmos o simulado agora mesmo?"
32080-24 = "3º Simulado do Clube de Aulas de Reforço"
32080-26 = "[ns] \"Então, começando!\""
32080-30 = "..."
32080-33 = "Fufu...♡"
32080-36 = "I-Isso aqui eu tenho certeza de que eu sei...! Hum, calma, hmmm...!"
32080-40 = "(Tenho a impressão de que as mãos de todas estão se movendo mais rápido do que antes...!)"
32080-44 = "(O simulado terminou e o resultado das notas de todas saiu.)"
32080-45 = "Sensei... por favor, anuncie os resultados!"
32080-46 = "[s] Anunciar os resultados da prova."
32080-50 = "Resultado do 3º Simulado do Clube de Aulas de Reforço—"
32080-52 = "Hanako — 69 pontos [007eff](Aprovada)[-]"
32080-54 = "Azusa — 73 pontos [007eff](Aprovada)[-]"
32080-56 = "Koharu — 61 pontos [007eff](Aprovada)[-]"
32080-58 = "Hifumi — 75 pontos [007eff](Aprovada)[-]"
32080-60 = "C-Conseguimos...!?"
32080-61 = "É-É sério!? Não está mentindo!?"
32080-62 = "...!"
32080-63 = "Ora, ora♡"
32080-68 = "Incrível! Azusa-chan, você não só passou dos 60 pontos como ultrapassou os 70! É incrível mesmo! Você se esforçou tanto...!"
32080-69 = "...Uhum!"
32080-70 = "Você também, Koharu-chan! Foi por pouco, mas é uma aprovação indiscutível! Incrível, você conseguiu!"
32080-71 = "N-Não é um sonho nem nada, né...? É-É de verdade mesmo...!"
32080-72 = "Aha... E-Essa é a minha verdadeira habilidade! Viram só!!"
32080-73 = "Sim! Essa é a verdadeira elite do Comitê de Justiça, não esperava menos!"
32080-74 = "E a Hanako-chan também..."
32080-75 = "...Tive sorte, ufufu. É um número bem interessante♡"
32080-76 = "Ainda bem... Hanako-chan, uuh..."
32080-77 = "H-Hifumi-chan...?"
32080-78 = "Eu ainda não sei o que aconteceu com você antes, Hanako-chan, nem o que está guardando consigo... mas ainda bem..."
32080-79 = "Hifumi-chan... Sim, muito obrigada."
32080-80 = "Eu também vou te ajudar para que você recupere logo o seu desempenho de antes. Que bom, que bom mesmo..."
32080-81 = "Sim... Me desculpe. Acabei deixando você preocupada..."
32080-83 = "...Sendo assim, como prometido, vamos dar início à cerimônia de entrega dos produtos dos Momo Friends!"
32080-87 = "...!!!"
32080-88 = "Ahaha..."
32080-89 = "..."
32080-90 = "Vamos, fiquem à vontade! Podem escolher livremente o amiguinho que mais gostarem e quiserem!"
32080-91 = "Entendo, nesse caso...! Hmmm...!"
32080-92 = "Bom, eu vou recusar educadamente."
32080-93 = "E-Eu também..."
32080-94 = "A-Auuh... É-É mesmo...?"
32080-95 = "O-O que eu faço...? Eu, eu...!"
32080-96 = "Não dá, escolher apenas um entre todos esses é difícil demais...!"
32080-97 = "Aquele preto com chifres é muito bom, mas o hipopótamo de óculos também...!"
32080-98 = "N-Não é um hipopótamo, o Peroro-sama é um pássaro..."
32080-99 = "O que eu faço...? Escolher entre um desses dois, para mim é...!"
32080-100 = "Para mim é impossível... Por favor, Hifumi. Escolha no meu lugar, Hifumi..."
32080-101 = "E-Eu?"
32080-102 = "Hum, são o Skullman-sama e o Doutor Peroro, né? Se eu tivesse que escolher um..."
32080-106 = "..."
32080-110 = "Então, que tal este aqui, o intelectual Doutor Peroro?!"
32080-111 = "...! Certo, então vai ser este aqui!"
32080-112 = "Na verdade, a história desse Doutor Peroro é que ele é super culto e ótimo nos estudos."
32080-113 = "Achei que combina perfeitamente com você agora, Azusa-chan, que está se esforçando tanto nos estudos e evoluindo de forma incrível!"
32080-114 = "Entendo, então é isso."
32080-115 = "S-Só tem um detalhe nos bastidores da história de que ele estudou um pouquinho demais e acabou ficando meio biruta..."
32080-116 = "[s] \"Que bom, né, Azusa?\""
32080-117 = "Uhum, eu adorei. É muito fofo mesmo, gostei. Ehehe..."
32080-118 = "Obrigada, Hifumi. Vou guardar com carinho pelo resto da vida."
32080-119 = "F-Fico feliz, mas ouvir você dizer algo tão grandioso assim até me assusta um pouco...!? Mas eu também estou muito feliz. Isso é fruto do seu próprio esforço por ter ido até o fim, Azusa-chan."
32080-120 = "Uhum. Mas, ao mesmo tempo, é o primeiro presente que ganho de uma amiga..."
32080-121 = "De agora em diante, vou cuidar muito bem deste hipopótamo pensando nele como se fosse você, Hifumi!"
32080-122 = "I-Isso dá um pouco de vergonha...!? E-E não é um hipopótamo, é um pássaro...!"
32080-126 = "Hum... O mundo dos hobbies é mesmo bem vasto, né?"
32080-127 = "..."
32080-129 = "(Com o moral de todas lá no alto, os estudos continuaram avançando em um ótimo clima.)"
32080-133 = "(E o tempo foi passando...)"
32080-135 = "...Finalmente é amanhã."
32080-136 = "U-Uhum..."
32080-137 = "A 2ª Prova Especial de Aptidão Acadêmica."
32080-138 = "Fufu... Passou num piscar de olhos, não foi?"
32080-139 = "Sim... Uma semana foi um período curto, mas nós acumulamos muito esforço direitinho. Acredito firmemente que nada disso será em vão."
32080-140 = "O resultado do simulado também foi ótimo e... do jeito que estamos agora, com certeza somos mais do que capazes de passar na 2ª Prova Especial de Aptidão Acadêmica!"
32080-141 = "Mas não podemos baixar a guarda, temos que dar o nosso melhor até o fim! Falta só mais um dia, então vamos fazer o máximo que pudermos!"
32080-142 = "Uhum, com certeza. Se bobear, vou mirar nos 100 pontos."
32080-143 = "E-Eu também!"
32080-144 = "Ora, então eu também vou nessa... Fufu♡"
32080-148 = "P-Para mim acho que tirar 100 pontos vai ser meio difícil, mas... e-enfim!"
32080-149 = "Vamos estudar com tudo neste último dia também!"
32080-150 = "[s] \"Isso aí, vamos dar o nosso melhor!\""
32080-153 = "...Eu estava esperando por você. Há quanto tempo, Sensei."
32080-154 = "Tudo tem corrido bem desde então? E quanto ao acampamento de estudos, houve algum problema ou dificuldade?"
32080-155 = "[s] \"Sim, graças a você estamos dando um jeito. Aliás, qual é o assunto de hoje?\""
32080-156 = "Fufu... Esse acampamento de estudos, por assim dizer, foi originalmente uma cortesia para que você \"pudesse observar bem as alunas\"."
32080-157 = "Sendo assim, como foi? Conseguiu descobrir alguma coisa?"
32080-158 = "Ou, sendo mais direta: quem você acha que é a \"traidora da Trinity\"?"
32080-159 = "[s] \"...Vou repetir o que disse antes, mas eu vou lidar com isso do meu jeito.\""
32080-160 = "...É mesmo, você disse isso. Contudo, com a 2ª Prova Especial de Aptidão Acadêmica prestes a acontecer, eu queria confirmar esse ponto mais uma vez."
32080-161 = "Por isso pedi que viesse até aqui hoje novamente."
32080-162 = "...Provavelmente a Mika-san também entrou em contato com você, não foi?"
32080-167 = "Sobre o que você conversou com a Mika-san... Se não se importar, poderia me contar?"
32080-169 = "Próximo;Mão Negra"
