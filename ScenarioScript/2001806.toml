[translation]
2001806-1 = "Черта"
2001806-2 = "Получив сообщение Моэ, я со всех ног побежал в парк Коусаги."
2001806-4 = "Ого! Не знала, что вы уже здесь, Сенсей!"
2001806-5 = "Вы добрались намного быстрее, чем я думала. Не обязательно было бежать..."
2001806-6 = "[s1] «*тяжело дышит* *тяжело дышит* Надеюсь, я успел...»\n[s2] «Бомба ведь не взорвалась?»"
2001806-7 = "Я ещё не рассортировала бомбы. Они сложены вон там..."
2001806-8 = "Я ещё не рассортировала бомбы. Они сложены вон там..."
2001806-9 = "...Вы тоже хотели взорвать бомбу?"
2001806-10 = "У меня есть самые разные. Скажите, какую хотите попробовать."
2001806-11 = "Что сначала? Светошумовую? Дымовую? Или мою любимую — зажигательную гранату...?"
2001806-12 = "[s3] «Я пришёл проверить, всё ли у тебя нормально! А не взрывать бомбы!»\n[s4] «Я пришёл, потому что боялся, что ты что-нибудь взорвёшь.»"
2001806-13 = "...Что? Вы примчались сюда, потому что решили, что я обязательно подорву бомбу?"
2001806-14 = "...Что? Вы примчались сюда, потому что решили, что я обязательно подорву бомбу?"
2001806-15 = "Я люблю взрывы, но даже я не настолько бездумна, чтобы поджигать фитиль во время сортировки припасов."
2001806-16 = "В конце концов, я оператор SRT и работаю со снабжением. Не стану просто так тратить наши припасы!"
2001806-17 = "...Ну, в большинстве случаев не стану."
2001806-18 = "[s] «Да, от этого мне не спокойнее.»"
2001806-19 = "Ну, всё равно спасибо. В одиночку разбирать все эти тяжёлые припасы было бы уныло."
2001806-20 = "...Вы всегда внезапно появляетесь, когда ученику нужна помощь, да?"
2001806-21 = "Для вас это не новость, но мне всё равно кажется странным. В хорошем смысле, наверное."
2001806-22 = "Тогда начинаем вечеринку!"
2001806-24 = ""
2001806-25 = ""
2001806-26 = ""
2001806-27 = ""
2001806-28 = "Похоже, современные кассетные гранаты рассчитаны на одновременный подрыв электрическим сигналом без подключения детонатора... Интересно."
2001806-29 = "То есть... одна эта кнопка может взорвать все гранаты здесь..."
2001806-30 = "[s] «Подожди, Моэ. Стой!»"
2001806-31 = "...Нужно будет обернуть каждую отдельно и установить антистатическое устройство, чтобы предотвратить случайное срабатывание."
2001806-32 = "Что такое, Сенсей? Хотели что-то сказать?"
2001806-33 = "[s] «Нет, ничего...»"
2001806-34 = "Хи-хи-хи. Вы странный, Сенсей."
2001806-35 = "Ну же, у нас не весь день!"
2001806-36 = ""
2001806-37 = ""
2001806-38 = "Это новая ЭМИ-бомба? Такая маленькая, но, судя по инструкции, восхитительно смертоносная."
2001806-39 = "Представьте, что будет, если я случайно её активирую."
2001806-40 = "Хи-хи... Все телефоны и машины в радиусе выйдут из строя... Начнётся абсолютный хаос!"
2001806-41 = "[s] «Подожди, это...»"
2001806-42 = ""
2001806-44 = ""
2001806-45 = "Давайте для надёжности положим её в специальный экранированный сейф."
2001806-46 = "Сенсей, что вы делаете...?"
2001806-47 = "Если закончили сортировать там, можете помочь мне здесь?"
2001806-48 = ""
2001806-52 = "Наконец-то свобода! Это заняло целую вечность!"
2001806-53 = "Но одной мне понадобилось бы гораздо больше времени, так что большое спасибо."
2001806-54 = "[s5] «Моэ, с тобой всё в порядке?»\n[s6] «Кто ты и что сделала с Моэ?»"
2001806-55 = "А? Почему? Я веду себя странно?"
2001806-56 = "А? Почему? Я веду себя странно?"
2001806-57 = "Хм, нет! Я всё та же единственная и незаменимая Моэ."
2001806-58 = "О... Вы правы. Сегодня ни одна кнопка меня не вывела из равновесия."
2001806-59 = "Ну... Видите ли..."
2001806-60 = "Может, было легче, потому что весь день я и так сдерживалась от того, чего очень-очень хочу."
2001806-61 = "[s] «Чего ты хочешь...?»"
2001806-62 = "Того, что полностью захватило мои мысли!"
2001806-63 = "Все остальные из отряда ушли. Здесь только я и Сенсей."
2001806-64 = "Я из последних сил держалась за самообладание кончиками ногтей."
2001806-65 = "Но раз уж вы сами заговорили... я больше не могу сопротивляться своим желаниям!"
2001806-66 = "Хех..."
2001806-67 = ""
2001806-72 = "― Сенсей.[wa:580]"
2001806-74 = "― В этом мире много табу.[wa:630]"
2001806-77 = "― Кнопки, которые нельзя нажимать,"
2001806-79 = "― границы, которые нельзя переходить..."
2001806-82 = "― И решения, которые могут привести вас[wa:1060]"
2001806-84 = "― к необратимому разрушению."
2001806-87 = "― Один неверный шаг — и можно потерять всё,[wa:10]"
2001806-89 = "― но что, если попытаться всё равно стоит...?[wa:2060]"
2001806-92 = "― Сенсей..."
2001806-94 = "― Что бы выбрали вы, Сенсей?[wa:10]"
2001806-97 = "― Я знаю, вопрос бессмысленный.[wa:960]"
2001806-99 = "― Вас не тянет к этому так, как меня.[wa:10]"
2001806-102 = "― Но я...[wa:700]"
2001806-104 = "― возможно, всё-таки перейду черту.[wa:1160]"
2001806-107 = "― Потому что момент разрушения"
2001806-109 = "― одновременно становится моментом, когда я доказываю себя.[wa:1040]"
2001806-112 = "― Поэтому, Сенсей.[wa:2360]"
2001806-115 = "― Не хотите..."
2001806-117 = "― перейти эту черту вместе со мной?[wa:650]"
2001806-120 = "*тяжело дышит* *тяжело дышит*"
2001806-121 = "Всё! Больше не могу себе отказывать!"
2001806-122 = "Моэ медленно поднялась и подошла ко мне..."
2001806-123 = "...и засунула мне в рот какую-то конфету."
2001806-124 = ""
2001806-125 = "[ns7] «...Ч-Что это?»\n[ns8] «Она такая сладкая...»"
2001806-126 = "Хи-хи... Очень сладкая, правда?"
2001806-127 = "Хи-хи... Вот именно!"
2001806-128 = "Это сверхкалорийная концентрированная конфета, которую я тайком добавила к нашему последнему заказу боеприпасов."
2001806-129 = "Технически она нужна, чтобы восстанавливаться после усталости во время операций, но иногда я ем их просто ради вкуса."
2001806-130 = "Есть настолько калорийную конфету так поздно ночью... Это ужасно вредно..."
2001806-131 = "Но какой греховный, разрушительный вкус... Чувство вины делает её ещё слаще."
2001806-132 = "[s9] «Это и была та черта, которую ты хотела перейти?»\n[s10] «Ты хотела... съесть конфету?»"
2001806-133 = "Что у вас с лицом?"
2001806-134 = "Что у вас с лицом?"
2001806-135 = "Сенсей... Вы подумали о чём-то извращённом? Не ожидала от вас такого. Хи-хи-хи..."
2001806-136 = "Ну, это тоже своего рода разрушение, но не такое, после которого можно вернуться обратно."
2001806-137 = "Разрушать — моя страсть, но, похоже, вы всё-таки кое-чему меня научили."
2001806-138 = ""
2001806-139 = "...Но знаете, люди могут забыть усвоенные уроки по щелчку пальцев."
2001806-140 = "Сегодня я была хорошей, но кто знает, что буду вытворять в будущем~"
2001806-141 = "Так что если я накосячу, вы должны меня простить, хорошо? Хи-хи-хи."
