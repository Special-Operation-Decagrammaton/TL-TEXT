[translation]
2600402-1 = "Книжный червь"
2600402-2 = "Привет, Сенсей! Рада, что вы пришли."
2600402-3 = "Хотя это ведь я вас позвала. Хи-хи. Всё равно спасибо."
2600402-4 = "Самое смешное, что здесь особо нечего делать."
2600402-5 = "Ой, простите. Можно чуть потише? Остальные читают..."
2600402-6 = "Можно немного поболтать. Библиотека большая, наши голоса не будут разноситься эхом."
2600402-7 = "Просто не хочу, чтобы здесь стало слишком шумно. Вот и всё."
2600402-8 = "Могу посоветовать вам что-нибудь почитать, раз уж вы здесь?"
2600402-9 = "Если советую я, можете быть уверены — не пожалеете!"
2600402-10 = "Что вы любите читать? Романы? Эссе? Нон-фикшн? Научные журналы...?"
2600402-11 = "[s1] «Давай попробуем роман.»\n[s2] «Мне нравятся кулинарные книги и путеводители.»"
2600402-12 = "О... Очень на вас похоже. Отлично! У меня как раз кое-что есть..."
2600402-13 = "О... Очень на вас похоже. Отлично! У меня как раз кое-что есть..."
2600402-14 = "То, что вам нужно, должно быть во-о-от здесь... Стоп."
2600402-15 = "А? Вы это слышали?"
2600402-16 = ""
2600402-18 = ""
2600402-19 = "Ха-ха-ха! Это умора! Хи-хи-хи! Ой, живот! Всё, не могу!"
2600402-21 = "Чё, шпана, проблемы? Вы тут библиотекой владеете, что ли? А?!"
2600402-22 = "*хрум* Чипсы отличные. Ой, крошки просыпались. Ну и ладно!"
2600402-23 = ""
2600402-25 = ""
2600402-26 = "..."
2600402-27 = "Подождите минутку, Сенсей. Как библиотекарь я не могу это игнорировать."
2600402-28 = ""
2600402-29 = "Прошу прощения. Вы мешаете окружающим."
2600402-30 = "А? Кто? Я?"
2600402-31 = "Да, вы. Это библиотека. Не могли бы вы говорить потише?"
2600402-32 = "Тихие разговоры в библиотеке разрешены, но голоса всё равно нужно приглушать."
2600402-33 = "А вот еда строго запрещена! Из напитков можно приносить только закрытые ёмкости, и пить нужно через трубочку!"
2600402-34 = "Пожалуйста, уважайте других посетителей!"
2600402-35 = "*вздох* Это шутка? С чего какая-то зубрилка вроде тебя решила мной командовать? Отвали и дай спокойно почитать!"
2600402-36 = "Хотя стой. Сейчас ты пожалеешь, что заговорила со мной таким тоном."
2600402-37 = ""
2600402-38 = "*шурх*"
2600402-39 = "...!"
2600402-40 = "..."
2600402-41 = "Что вы только что сделали?"
2600402-42 = "В-вы только что загнули страницу?"
2600402-43 = "А? Ну да! А как ещё мне запоминать, где остановилась?"
2600402-44 = ""
2600402-45 = "Ах ты...!"
2600402-48 = "Это же... кощунство!"
2600402-49 = ""
2600402-50 = "*БА-А-АХ*"
2600402-51 = "...?!"
2600402-52 = "Ч-что это было? П-почему всё стало серым...?"
2600402-53 = "Это... мои первые шаги? Первый день в начальной школе? Дни рождения... Все эти воспоминания..."
2600402-54 = "Что это? Река? Кто там на другом берегу...? Какой-то старик мне машет..."
2600402-55 = "Это... книга? Уголок...? На моей голове...?"
2600402-58 = "Я могла простить все остальные нарушенные вами правила, но порчу книги нельзя оставить без наказания!"
2600402-59 = "Дураков, которые не понимают ценности книг, надо проучить!"
2600402-60 = "За книгу, которую вы помяли, заплатите из собственного кармана!"
2600402-61 = "У-угх... Голова... Что сейчас произошло?"
2600402-62 = "Я чуть не умерла! У меня что, жизнь перед глазами пронеслась?!"
2600402-63 = "Чтобы убить человека, нужно гораздо больше. Я читала книгу, где объяснялось, как рассчитывать силу удара."
2600402-64 = "Ч-что за хрень? Что с тобой не так?! И ты называешь себя библиотекарем?!"
2600402-65 = "Ах ты...! Раз хочешь по-плохому, получай!"
2600402-66 = ""
2600402-68 = ""
2600402-69 = "*фьюх*"
2600402-70 = "[ns] «Шимико!»"
2600402-71 = ""
2600402-72 = ""
2600402-73 = ""
2600402-74 = "*хвать*"
2600402-75 = "...?"
2600402-76 = "Что...? Что произошло?"
2600402-77 = "Какого...? Ты только что одной рукой остановила мой удар?"
2600402-78 = "«Не суди книгу по обложке»."
2600402-79 = "Каждый читатель знает это простое правило. Думала, раз я библиотекарь, мной можно помыкать?"
2600402-80 = "Ты хоть представляешь, сколько книг библиотекарю приходится таскать каждый день?"
2600402-82 = "Я настолько накачана, что разобраться с такой шпаной, как вы, — раз плюнуть!"
2600402-83 = "Ч-что за...? Стой! Ты что... поднимаешь меня над полом?!"
2600402-84 = "А-аргх! О-отпусти! Я сказала, отпусти!"
2600402-85 = "Фух."
2600402-86 = "Я бы вышвырнула тебя в окно, но это устроит ещё больший шум."
2600402-87 = "Поэтому на этот раз ограничусь предупреждением. В следующий раз доброй библиотекарши не будет, поняла?"
2600402-88 = "Ладно! Ладно! Только отпусти..."
2600402-89 = ""
2600402-90 = "Простите..."
2600402-91 = "...думаешь, я так скажу?! Я забираю эту книгу в качестве компенсации!"
2600402-93 = "..."
2600402-94 = ""
2600402-95 = "...?"
2600402-96 = "Погоди. Когда ты успела оказаться вон там?"
2600402-97 = "*вздыхает*"
2600402-98 = "Ненавижу повторяться."
2600402-99 = "Что я только что сказала насчёт того, чтобы не недооценивать библиотекаря?"
2600402-100 = "Ты представляешь, как быстро библиотекари должны возвращать книги на полки? И какие расстояния ради этого пробегают?"
2600402-101 = "Я натренировалась бегать спринтом совершенно бесшумно. Меня никто не обгонит."
2600402-102 = "Впрочем, похоже, урок ты так и не усвоила."
2600402-103 = "Хорошо. Значит, будет по-плохому."
2600402-104 = "Х-ха! Ну да, конечно! Ты просто блефуешь!"
2600402-105 = ""
2600402-106 = "Н-не подходи ближе! Стой на месте...!"
2600402-107 = ""
2600402-109 = "А-а-а-а-а-а!"
2600402-110 = "Жалкий визг нарушительницы постепенно затих, когда Шимико начала свой «урок»."
2600402-112 = "Через несколько мгновений."
2600402-113 = "*вздох* Всегда найдётся кто-то, кого приходится учить соблюдать правила."
2600402-114 = "Простите, что вам пришлось увидеть меня такой, Сенсей. Я ведь позвала вас сегодня повеселиться."
2600402-115 = "Если честно, мне хотелось, чтобы вы увидели во мне интеллектуалку..."
2600402-116 = "[s3] «Какой интеллектуал не захочет защищать знания?»\n[s4] «Ты была великолепна. Отличная работа, Шимико!»"
2600402-117 = "...!"
2600402-118 = "...!"
2600402-119 = "В-вы... просто пытаетесь меня приободрить."
2600402-120 = "...Хи-хи-хи."
2600402-121 = "И всё же мне приятно это слышать — особенно от вас."
2600402-122 = "Спасибо, Сенсей. Теперь, когда всё улажено, можете спокойно читать!"
2600402-124 = "Остаток времени в библиотеке я провёл за книгами, которые посоветовала Шимико."
2600402-125 = "К счастью, мой холодный кофе был с крышкой и трубочкой."
