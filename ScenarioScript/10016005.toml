[translation]
10016005-1 = "Пролог;Огненная церемония открытия"
10016005-2 = "Студия вещания стадиона"
10016005-3 = "Здравствуйте и добро пожаловать на канал «Кронос»!"
10016005-4 = "Мы находимся в самой гуще событий и ведём прямой эфир! Это самое сердце Фестиваля Хало в Кивотосе — спортивный стадион!"
10016005-5 = "Посмотрите, сколько студентов уже толпится вокруг стадиона, несмотря на такую рань!"
10016005-6 = "Сегодня все они собрались здесь по одной особой причине, которую, уверена, вы прекрасно знаете."
10016005-7 = "Именно! Студенты выстраиваются в очередь, чтобы зарегистрироваться и получить именные бейджи для участия в спортивном фестивале!"
10016005-8 = "Фестиваль Хало в Кивотосе проводится раз в два года и является масштабным событием, равного которому в Кивотосе почти не бывает. Академии откладывают разногласия и отправляют студентов дружески бороться за победу."
10016005-9 = "Более того, помимо насыщенных соревнований между студентами, в этом году фестиваль принимает Научная школа «Миллениум», поэтому гостей ждут всевозможные развлечения, включая демонстрацию новейших изобретений школы."
10016005-10 = "Всем зрителям, которые смотрят нас из общежитий или просто из дома..."
10016005-11 = "Мы знаем, как обидно пропускать всё это веселье, но не бойтесь!"
10016005-12 = "Почему? Потому что канал «Кронос» — ваш единственный и эксклюзивный источник трансляции Фестиваля Хало, теперь ещё и в полном HD!"
10016005-13 = "Не пропустите ни секунды захватывающих событий спортивного фестиваля! Подписывайтесь, ставьте лайк и включайте уведомления на нашем канале..."
10016005-14 = ""
10016005-16 = ""
10016005-17 = ""
10016005-18 = "Ой! Исполнительный комитет отключит нас от эфира, если мы не прекратим рекламироваться."
10016005-19 = "Ладно! Тогда пусть событие говорит само за себя."
10016005-20 = "Без лишних слов, если вы вообще слышите нас сквозь рёв толпы..."
10016005-21 = "Мы рады представить вам..."
10016005-22 = "Фестиваль Хало в Кивотосе!"
10016005-29 = ""
10016005-30 = "Знаешь, Май, я очень переживала, что в этом году Фестиваль Хало отменят, учитывая нынешнюю обстановку в Кивотосе и целую череду происшествий. Я рада, что его всё-таки удалось провести по плану."
10016005-31 = "Думаешь, всё получилось благодаря превосходным технологиям «Миллениума»?"
10016005-32 = "Безусловно! Научная школа «Миллениум» задействовала весь арсенал передовых научных и технологических средств, чтобы организовать это мероприятие. В этом году Фестиваль Хало можно даже назвать выставкой «Миллениума»!"
10016005-33 = "Насколько я понимаю, благодаря техническому мастерству они смогли возвести эти огромные сооружения, подготовить роботов-проводников и многое другое..."
10016005-34 = "...Но также ходят слухи, что даже эта школа гениев столкнулась с немалым количеством проблем, из-за которых все сомневались, успеют ли закончить подготовку вовремя."
10016005-35 = "И до сих пор остаются вопросы по поводу внезапных изменений некоторых соревнований."
10016005-36 = "Что же могло произойти?"
10016005-37 = "К сожалению, новейшая система безопасности «Миллениума» делает правду почти недоступной."
10016005-38 = "Но никакая безопасность не остановит настойчивых репортёров школы «Кронос»! Мы раскрыли факт, который вас потрясёт!"
10016005-39 = "Человеком, предложившим изменить программу спортивного фестиваля, был никто иной, как..."
10016005-40 = "Кто?!"
10016005-41 = "Сенсей из Шале!"
10016005-42 = "Серьёзно? ТОТ САМЫЙ Сенсей?!"
10016005-43 = "Да! Тот самый Сенсей, который, кажется, всегда оказывается в центре скандалов, сыграл ключевую роль в подготовке Фестиваля Хало."
10016005-44 = "Какое крайне подозрительное — то есть интересное — совпадение!"
10016005-45 = "Полностью согласна! Вот что мы называем сенсацией!"
10016005-46 = ""
10016005-48 = ""
10016005-50 = "Ой, ещё одна жалоба от Исполнительного комитета..."
10016005-51 = "Кхм, ой! Возвращаясь к теме: представители спортсменок уже подходят к сцене, чтобы произнести клятву спортивного фестиваля — заключительную часть церемонии открытия."
10016005-52 = "Похоже, представителями спортсменок на Фестивале Хало этого года стали... Окусора Аяне из старшей школы «Абидос» и Урава Ханако из объединённой школы «Тринити»."
10016005-53 = "А теперь всё внимание на сцену!"
10016005-56 = "Я никогда не выступала перед такой огромной толпой... Немного нервничаю."
10016005-57 = "А если я запнусь или ошибусь?"
10016005-58 = "Ну-ну, Аяне. Не о чем переживать."
10016005-59 = "Да, толпа большая, и мы представители. Но эта клятва — о тебе и твоей решимости."
10016005-60 = "Пока ты честна с собой, всё будет хорошо. Публика не важна."
10016005-61 = "Хм, может, станет легче, если представить, что зрители — просто безобидные морковки и огурцы?"
10016005-62 = ""
10016005-64 = ""
10016005-65 = "Ты потрясающая, Ханако. Даже под таким давлением ты говоришь настолько спокойно. Очень подобает студенту «Тринити»."
10016005-66 = "Я не могу не восхищаться."
10016005-67 = "О боже. Ты слишком высоко меня оцениваешь, но мне приятно."
10016005-69 = "(Я справлюсь. Глубоко вдохнуть. Они все — огурцы...)"
10016005-70 = "Я торжественно клянусь от имени всех спортсменок!"
10016005-71 = "Я торжественно клянусь от имени всех спортсменок~"
10016005-72 = "Что все участницы Фестиваля Хало этого года...!"
10016005-73 = "Что все участницы Фестиваля Хало этого года...!"
10016005-74 = "Будут следовать духу истинной спортивной честности...!"
10016005-75 = "Будут следовать духу откровенных, личных желаний...!"
10016005-76 = "И посвятят себя предстоящим соревнованиям..."
10016005-77 = "И посвятят себя тесному физическому контакту..."
10016005-78 = ""
10016005-80 = ""
10016005-81 = "Эм, Ханако...? Кажется, клятва звучит не так... У тебя неправильная копия?"
10016005-82 = "Нет! Я ведь только что сказала... Не зацикливайся на мелочах и будь честна с собой."
10016005-83 = "Этот спортивный фестиваль — место дружбы и единения, где студенты разных академий откладывают оружие, чтобы тесно и физически взаимодействовать друг с другом..."
10016005-84 = "Короче говоря..."
10016005-85 = "Это прямо как ■■■!"
10016005-86 = ""
10016005-88 = ""
10016005-89 = "Ч-что вы имеете в виду...?"
10016005-90 = "Подождите, Ханако! Вы не выключили микрофон!"
10016005-91 = "Ах, не обращай внимания. Все эти зрители всё равно просто морковки и огурцы."
10016005-92 = "Я вот всё думаю. Тесная физическая борьба друг с другом ради укрепления отношений? Если вдуматься, фестиваль довольно непристойный. Хи-хи."
10016005-93 = "...Что, чёрт возьми, несёт этот студент?!"
10016005-94 = "Но идея мне очень нравится. Наши принадлежности и предубеждения могут мешать понимать друг друга, но кто знает? Может, мы сможем быть честны друг с другом... через наши тела, понимаешь?"
10016005-95 = "Если все студенты Кивотоса в хорошем настроении будут ■■■■■■ друг друга, то цель фестиваля — мирное соревнование — может оказаться не такой уж недостижимой...!"
10016005-96 = "Уберите её со сцены немедленно!"
10016005-97 = "О чём вообще думала «Тринити», выбирая её своим представителем?!"
10016005-98 = "Хи-хи... Мы все будем делать ■■, ■■ и ■■!"
10016005-99 = "Больше чувств! Больше страсти! Пока мы не ■■, ■■ и ■■!"
10016005-100 = ""
10016005-103 = ""
10016005-104 = ""
10016005-105 = "*шёпотом* ...Это ведь точно был косяк прямого эфира, да?"
10016005-106 = "Не могу поверить. Представительница «Тринити» перед глазами всей публики и зрителей начала выкрикивать непристойности, настолько пошлые, что их даже нельзя пустить в эфир."
10016005-108 = "Вот это мы и называем сенсацией!"
10016005-109 = "Ты всё сняла? Сейчас же разберём запись и выпустим специальный сюжет..."
10016005-110 = ""
10016005-114 = "...Простите? Одну минуту. Что значит, нам нельзя показывать эту запись?!"
10016005-115 = "В нашем контракте сказано, что школа «Кронос» обладает исключительными правами на весь контент, связанный со спортивной частью фестиваля!"
10016005-116 = "Если попытаетесь нарушить контракт, мне придётся раскрыть, что содержание нелегального фанбука, который мы получили из академии «Красная Зима», действительно правдиво... А ведь он вызывает большой интерес у студентов!"
10016005-117 = "Эй, притормози! Такие угрозы явно выше твоего уровня полномочий!"
10016005-118 = ""
10016005-120 = ""
10016005-121 = "Н-несмотря на некоторые технические трудности, канал «Кронос» продолжит эксклюзивное освещение Фестиваля Хало в Кивотосе!"
10016005-122 = ""
10016005-124 = ""
10016005-125 = "Все оставайтесь с нами!"
