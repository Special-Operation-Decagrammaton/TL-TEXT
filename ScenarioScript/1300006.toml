[translation]
1300006-1 = "Спящая горничная"
1300006-2 = "Таинственный офис"
1300006-3 = "Хр-р..."
1300006-4 = "*зевок*"
1300006-5 = "Хр-р..."
1300006-6 = "М-м... Карин. Это пудинг Нэру. Нельзя его есть..."
1300006-7 = "[s] Разбудить Аканэ."
1300006-8 = "Хм?"
1300006-9 = "[s] «Просыпайся.»"
1300006-10 = "...А?"
1300006-11 = "А! Г-Господин?!"
1300006-12 = "Как неприлично, Господин. Проникнуть в комнату спящей девушки — совсем не подобает."
1300006-13 = "Хотя если это ты, Господин... Хи-хи."
1300006-14 = "Погоди-ка. Это разве не сон?"
1300006-16 = "*зевок* Как же хорошо я выспалась!"
1300006-17 = "А? Мне не стоит радоваться тому, что я выспалась? Наверное, ты прав."
1300006-18 = "Похоже, нас связали."
1300006-19 = "А, да. Теперь вспомнила."
1300006-21 = "Город возле Миллениума"
1300006-22 = "Несколько часов назад."
1300006-23 = "Это здание принадлежит заказчику."
1300006-24 = "Тому, кто приказал тому громиле украсть документы и слить конфиденциальную информацию."
1300006-25 = "Корпорация Кайзер. Противостоять огромному конгломерату будет непросто."
1300006-26 = "Сначала попробую проникнуть внутрь. Жди от меня сообщения, Господин."
1300006-27 = ""
1300006-28 = ""
1300006-29 = ""
1300006-30 = "Если пройдёт достаточно времени, а я так и не свяжусь с тобой и не выберусь... дальше всё будет в твоих руках, Господин."
1300006-32 = "Таинственный офис"
1300006-33 = "Хм..."
1300006-34 = "Я думала, если не вернусь, ты свяжешься с C&C."
1300006-35 = "Не ожидала, что ты ворвёшься меня спасать и в итоге нас обоих схватят. Теперь мы в серьёзной переделке."
1300006-36 = "Хех. Я не виню тебя."
1300006-37 = "Мне очень приятно, что ты пришёл меня спасать."
1300006-38 = "Но... судя по виду из окна, мы здесь уже довольно долго, а здание весьма высокое."
1300006-39 = "Что же делать...? Похоже, остаётся только использовать бомбу."
1300006-40 = "Если повезёт, выживем."
1300006-41 = "Хотя... для тебя этот план, пожалуй, слишком рискованный, Господин."
1300006-42 = "Ох. Теперь мне становится неловко."
1300006-43 = "Это из-за меня ты оказался в такой опасности."
1300006-44 = "*всхлипывает*"
1300006-45 = "Ты... не против? Тебя похищение уже вообще не пугает?!"
1300006-46 = "Хм. Не похоже, что ты врёшь просто ради моего спокойствия..."
1300006-47 = "Хи-хи. Ну, если ты настаиваешь."
1300006-48 = "По правде говоря, я тоже не слишком переживаю."
1300006-49 = "Я всё думала, почему так."
1300006-50 = "Наверное, потому что мой господин рядом, а ещё..."
1300006-51 = "...обычно примерно в это время..."
1300006-53 = "*БУМ*"
1300006-54 = "Э-Это Нэру!"
1300006-55 = "Это C&C — валим отсюда!"
1300006-56 = "Чёрт! Так эта очкастая горничная и правда из C&C?!"
1300006-57 = "Вот почему я говорил не связываться с горничными... А-а-а!"
1300006-58 = "..."
1300006-59 = "Всегда происходит что-то подобное."
1300006-60 = "В конце концов моя команда проломит дверь и скажет что-нибудь вроде: «Хех. Не могли же мы оставить тебя тут...»"
1300006-61 = "Аргх! Мы этого не потерпим! Взорвать этаж, где держат заложников!"
1300006-62 = "...?!"
1300006-63 = "Н-Нет! Не...!"
1300006-65 = "*бум*"
1300006-66 = "Господин!"
1300006-73 = "Господин! Господин!"
1300006-75 = "А, Господин! Ты цел?!"
1300006-76 = "[s] «*зевок* Как же хорошо я выспался!»"
1300006-77 = "Не возвращай мне мои же слова!"
1300006-78 = "Фух. Слава богу."
1300006-79 = "Взрыв оказался не очень мощным."
1300006-80 = "Перила под нами хотя бы немного нас прикрыли."
1300006-81 = "И кроме того..."
1300006-82 = "...ты смягчил моё падение."
1300006-83 = "Ха-ха... Иного от тебя я и не ожидала, Господин."
1300006-84 = "Спасибо, что защитил меня."
1300006-85 = "Надеюсь, я и дальше смогу на тебя положиться."
