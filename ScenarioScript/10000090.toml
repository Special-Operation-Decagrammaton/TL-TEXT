[translation]
10000090-1 = "Эпизод 9; Мечта девушки"
10000090-2 = "Безумный план Датэ Мяуру, главы торговой гильдии торгового квартала Хяккияко, закончился провалом."
10000090-3 = "Оставшиеся Моурё разбежались, как только он сдался..."
10000090-4 = "...ну, почти все."
10000090-6 = "Тц. Живыми вы нас не возьмёте!"
10000090-7 = ""
10000090-8 = "*зевает* Даже после того, как с главным происшествием разобрались, тут ещё остались отдельные вредители."
10000090-9 = "Нам стоит вернуться к патрулированию, вдруг они из вредности попробуют устроить ещё что-нибудь. Пойдём, Цубаки! Мимори!"
10000090-10 = "Хорошо. Фестиваль ещё далеко не закончился, так что давайте насладимся им как следует!"
