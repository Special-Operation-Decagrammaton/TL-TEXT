[translation]
2003502-1 = "Ещё одна тренировка(?)"
2003502-4 = ""
2003502-5 = "*зевок*... хр-р..."
2003502-6 = ""
2003502-8 = "[ns] «...Цубаки?»"
2003502-9 = "Хм?"
2003502-10 = ""
2003502-12 = ""
2003502-13 = "О... Добро пожаловать, Сенсей... Я ждала вас..."
2003502-14 = "[s] «Ты сказала, что сменила наряд, вот мне и стало интересно, какой он теперь...»"
2003502-15 = "Ага. Это..."
2003502-16 = ""
2003502-18 = ""
2003502-19 = "Моя форма проводника по сну!"
2003502-20 = ""
2003502-22 = ""
2003502-23 = "Чтобы всегда и везде получать достаточно сна..."
2003502-24 = "Вот в чём моя тренировка... *зевок*..."
2003502-25 = "[s] «Проводника по сну?»"
2003502-26 = "Ага... Изначально я тренировалась быть экскурсоводом... для посетителей Хяккияко, но..."
2003502-27 = "Посмотрите шире, Сенсей..."
2003502-28 = "В наши дни... недосып — серьёзная общественная проблема."
2003502-29 = "[s] «Вот как?»"
2003502-30 = "Думаю, да..."
2003502-31 = "И... поэтому меня осенило..."
2003502-32 = "Проводник — это тот, кто ведёт тебя куда-то или к чему-то, верно...?"
2003502-33 = "А это значит..."
2003502-34 = "Как президент Клуба внутренней дисциплины... направлять людей к более здоровому сну..."
2003502-35 = "...это как раз то, чем я должна заниматься..."
2003502-36 = "[s] «Не уверен, что до конца понимаю, но... проводник по сну... ладно...»"
2003502-37 = "Ага... Именно об этом я и говорю. *зевок*..."
2003502-38 = "Так что, Сенсей... Может, я проведу для вас экскурсию по Хяккияко..."
2003502-39 = "Эй, я всё ещё проводник по сну. Я не бросила это..."
2003502-40 = "Как я и сказала... я ещё и тренируюсь быть экскурсоводом... для посетителей Хяккияко, так что..."
2003502-41 = "Если я хорошо выполню работу... тогда смогу хорошо поспать..."
2003502-42 = "Так что в некотором смысле быть экскурсоводом — это просто... часть работы проводника по сну..."
2003502-43 = ""
2003502-45 = ""
2003502-46 = "Хр-р..."
2003502-47 = "[ns] «Эй, просыпайся! Ещё слишком рано засыпать!»"
2003502-48 = ""
2003502-52 = ""
2003502-53 = "[ns1] «Разве ты не собиралась провести мне экскурсию по Хяккияко?»\n[ns2] «Почему мы в комнате Клуба внутренней дисциплины, Цубаки?»"
2003502-56 = "..."
2003502-57 = "Комната Клуба внутренней дисциплины... тоже часть Хяккияко..."
2003502-58 = ""
2003502-60 = ""
2003502-61 = "Хр-р..."
2003502-62 = "[s3] «Это правда, но...»\n[s4] «Как мы проведём экскурсию, если ты засыпаешь прямо в клубной комнате?!»"
2003502-65 = "Хм?"
2003502-66 = "Точно... Мне нужно провести вас..."
2003502-67 = "[s] «Да! Именно!»"
2003502-68 = "..."
2003502-69 = "Кстати, Сенсей..."
2003502-70 = "Говорят... человек проводит во сне примерно треть своей жизни..."
2003502-71 = "Если не высыпаться... в организме накапливаются отходы, а клетки мозга повреждаются."
2003502-72 = "Потому что... когда ты спишь, мозг отключает все органы чувств..."
2003502-73 = "Кроме того... если спать недостаточно..."
2003502-74 = ""
2003502-76 = ""
2003502-77 = "Иммунная система не сможет нормально работать... и... ты станешь уязвим ко всяким инфекциям... Бактериальным... Вирусным..."
2003502-78 = "[s] «Ты столько всего технического знаешь, Цубаки!»"
2003502-79 = "Ага... Я хочу сказать... и тебе, и себе... что сон очень-очень важен..."
2003502-80 = "Да... Так что теперь я проводник по сну Касуга Цубаки..."
2003502-81 = ""
2003502-83 = ""
2003502-84 = "Эй, Сенсей?"
2003502-85 = "Хотите немного вздремнуть?"
2003502-86 = ""
2003502-88 = ""
2003502-89 = ""
2003502-91 = "Цубаки легла в комнате Клуба внутренней дисциплины и погрузилась в глубокий, спокойный сон."
2003502-92 = "Я накрыл Цубаки одеялом и вернулся в Шале..."
