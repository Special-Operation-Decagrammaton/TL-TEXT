[translation]
1007106-1 = "SRT, отчёт!"
1007106-5 = "...Почему-то я проснулся на час раньше."
1007106-6 = "Возвращаться спать уже не было смысла, поэтому я решил прогуляться ранним утром."
1007106-7 = ""
1007106-11 = "[ns] Одеться и выйти."
1007106-18 = "Сенсей? Это вы?"
1007106-19 = "[ns] «Этот голос...»"
1007106-22 = "― [log=미야코 수영복]Доброе утро.[/log][wa:290]"
1007106-25 = "― [log=미야코 수영복]Вышли на утреннюю прогулку?[/log][wa:580]"
1007106-28 = "― [log=미야코 수영복]Обычно по утрам я бегаю,[/log][wa:1130]"
1007106-30 = "― [log=미야코 수영복]но сегодня решила поплавать.[/log][wa:20]"
1007106-33 = "― [log=미야코 수영복]Раз уж мы на пляже,[/log]"
1007106-35 = "― [log=미야코 수영복]я подумала, что неплохо попробовать что-нибудь новое.[/log][wa:720]"
1007106-38 = "― [log=미야코 수영복]Не ожидала, что вы увидите меня в таком виде...[/log][wa:2260]"
1007106-40 = "― [log=미야코 수영복]Мне немного неловко.[/log][wa:10]"
1007106-43 = "― [log=미야코 수영복]Апчхи![/log][wa:1800]"
1007106-46 = "― [log=미야코 수영복]Похоже, я слишком долго здесь стою.[/log][wa:780]"
1007106-48 = "― [log=미야코 수영복]Мне становится немного холодно.[/log][wa:10]"
1007106-51 = "[ns] «Хорошая ли идея плавать в такой холодной воде?»"
1007106-52 = "― [log=미야코 수영복]В этом вы правы.[/log][wa:1700]"
1007106-54 = "― [log=미야코 수영복]Говорят, кроликам нельзя лезть в воду, но...[/log][wa:610]"
1007106-57 = "― [log=미야코 수영복]Я не кролик.[/log][wa:1390]"
1007106-60 = "[ns] «Все в отряде RABBIT хорошо плавают?»"
1007106-61 = "Да. Студенты SRT должны уметь действовать в любых условиях."
1007106-62 = "Пусть мы и не лучшие пловцы, но базовые стили плавания изучают все."
1007106-63 = "Кроме того, плавание полезно как тренировка всего тела — оно задействует каждую мышцу."
1007106-64 = "Не так много упражнений столь же хорошо развивают физическую форму."
1007106-65 = ""
1007106-67 = ""
1007106-68 = ""
1007106-69 = "Эм..."
1007106-70 = "Как я и говорила, плавание — полноценная тренировка, которая требует много энергии..."
1007106-71 = "...так что, возможно, заниматься им на голодный желудок — не лучшая идея..."
1007106-72 = "[s] «Рядом есть магазин, который открывается рано.»"
1007106-73 = ""
1007106-75 = ""
1007106-76 = "[ns] «Хочешь позавтракать?»"
1007106-77 = ""
1007106-79 = ""
1007106-80 = "Да, Сенсей!"
1007106-82 = "Немного позже мы с Мияко вместе позавтракали ранним утром."
