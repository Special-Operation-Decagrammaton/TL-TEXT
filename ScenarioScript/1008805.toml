[translation]
1008805-1 = "Может показаться детской заносчивостью"
1008805-2 = "Я заглянул в офис «Проблемы 68», чтобы вернуть документы, которые брал в прошлый раз."
1008805-3 = ""
1008805-8 = ""
1008805-9 = ""
1008805-10 = "...А? Сенсей? Что вы здесь делаете?"
1008805-11 = "[s1] «Каёко? Этот наряд...?»\n[s2] «Хм. Снова платье?»"
1008805-14 = "Эй, вообще-то я первая спросила..."
1008805-15 = "...А?"
1008805-16 = "Документы?"
1008805-17 = "А, те, что вы брали раньше. Не ожидала, что вы так быстро их вернёте."
1008805-18 = "Оставьте их на том столе. Я потом разберусь."
1008805-19 = ""
1008805-21 = ""
1008805-22 = "А?"
1008805-23 = "Что насчёт моего платья?"
1008805-24 = ""
1008805-26 = ""
1008805-27 = "Я услышала с первого раза. Вы действительно настойчивы насчёт этого."
1008805-28 = "*вздох*... Ладно. Если игнорировать вас, станет только неловче, так что..."
1008805-29 = "Слушайте... ничего особенного. Я надела его по работе."
1008805-30 = "В последнее время многие задания Решал 68 требуют именно такой одежды."
1008805-31 = "И удобно иметь разные наряды для разных заказов."
1008805-32 = "Но всё же..."
1008805-33 = "Большинство моих заданий, правда, закончились провалом..."
1008805-34 = "[s3] «У тебя много всего навалилось, Каёко.»\n[s4] «...Не сдавайся.»"
1008805-35 = ""
1008805-36 = ""
1008805-38 = ""
1008805-39 = "Не нужно меня жалеть. Не то чтобы я ненавидела это или работа была слишком тяжёлой."
1008805-40 = "...А?"
1008805-41 = "Что, думаете, я просто всё ненавижу?"
1008805-42 = "Ну, то есть..."
1008805-43 = "Я ничего не имею против своей одежды. Это моя одежда."
1008805-44 = "Я могла говорить, что платье мне не подходит, но это не значит, что сам наряд мне не нравится."
1008805-45 = "И ещё были ваши слова..."
1008805-46 = ""
1008805-49 = ""
1008805-50 = "О том, как хорошо мне идёт платье... Надеюсь, это были не пустые слова."
1008805-51 = "Я поверила вам. Поэтому и могу продолжать носить этот наряд на работу."
1008805-52 = ""
1008805-56 = "[ns5] «Конечно. Оно тебе идеально подходит.»\n[ns6] «Аб-со-лют-но.»"
1008805-57 = ""
1008805-58 = ""
1008805-60 = ""
1008805-61 = "Я так и знала, что вы это скажете. Серьёзно..."
1008805-62 = "..."
1008805-63 = "...Хи-хи."
1008805-64 = "Кстати, Сенсей. Помните сообщение в MomoTalk, которое я отправила сегодня утром?"
1008805-65 = "Где спрашивала, есть ли у вас свободное время?"
1008805-66 = "Если вы не против, я хотела бы угостить вас ужином."
1008805-67 = "Раз уж я всё равно нарядилась..."
1008805-68 = "...думаю, заплачу я."
1008805-69 = "[s7] «Если речь о еде, платить должен я.»\n[s8] «Я не привык, когда угощают меня.»"
1008805-72 = "Не повезло."
1008805-73 = "Заплатить должна я. Иначе в чём смысл?"
1008805-74 = "И это необходимо."
1008805-75 = "Я знала, что ты так скажешь..."
1008805-76 = "Как насчёт того, чтобы я отплатила и за ваши слова..."
1008805-77 = ""
1008805-79 = ""
1008805-81 = "Совесть не позволит мне просто сидеть сложа руки. Мы, студенты, такие, Сенсей."
1008805-82 = ""
1008805-85 = "[ns9] «Хм, понятно...»\n[ns10] «Значит, решила сыграть именно так...»"
1008805-86 = "...Хи-хи."
1008805-87 = "...Хи-хи."
1008805-88 = "Шах и мат."
1008805-89 = "Не переживайте. Вы просто едите вкусную еду с хорошим студентом."
1008805-90 = "А если всё ещё неловко, спишите это на моё упрямство."
1008805-91 = "Пока этого будет достаточно."
1008805-92 = ""
1008805-95 = "Раз вы больше не паникуете и не меняете тему... полагаю, всё в порядке?"
1008805-96 = "Хорошо. Ваша способность принимать всё как есть — одновременно ваша самая большая слабость и сила."
1008805-97 = "...Спасибо, Сенсей."
1008805-98 = "И ещё..."
1008805-99 = ""
1008805-101 = ""
1008805-103 = ""
1008805-104 = "...Я буду ждать."
