[translation]
80000139-1 = "Шоколадный торт критика"
80000139-2 = "Вы знакомы с общим восприятием Дня святого Валентина обществом?"
80000139-3 = "[s] «Есть много... тонких и разнообразных мнений...»"
80000139-4 = "Фу-фу. Да. Одно из самых распространённых — что весь праздник лишь маркетинговая уловка шоколадных компаний..."
80000139-5 = "...знак того, что такие чистые понятия, как любовь и чувства, заменены банальным капиталистическим потреблением. Однако..."
80000139-6 = "[s] «Но...?»"
80000139-7 = ""
80000139-9 = ""
80000139-10 = "Это УЖАСНО скучно!"
80000139-11 = "Подобные «мнения» настолько заезжены, что не вызывают у меня ничего, кроме желания закатить глаза!"
80000139-12 = "Во-первых, почему так важно, КАК именно люди празднуют? Разве смысл не в том, чтобы ценить праздник, делиться шоколадом с близкими и..."
80000139-13 = "...пусть ненадолго, получить передышку и просто хорошо провести время?"
80000139-14 = "[s1] «Выходит, в таких вопросах ты довольно щедра.»\n[s2] «Я думал, ты строго придерживаешься принципов.»"
80000139-17 = "О боже. Это совершенно естественно, Сенсей."
80000139-18 = "Я считаю, что критик обязан идти в ногу со временем."
80000139-19 = "Критик должен понимать, что люди думают и чего хотят..."
80000139-20 = "Мне кажется, я как критик должна улавливать тенденции ещё до того, как сами люди осознают собственные мысли. Только тогда я докажу, что достойна своего положения."
80000139-21 = "Ну что же, думаю, для вступления этого достаточно."
80000139-22 = "А теперь попробуйте это, Сенсей."
80000139-23 = "Можно сказать, я «сделала» их."
80000139-24 = ""
80000139-26 = ""
80000139-27 = ""
80000139-29 = "Это мой валентиновский шоколад."
80000139-30 = "Если анализировать содержимое и детали, можно вывести множество смыслов и символических жестов."
80000139-31 = "Хотя ничего не ясно и достоверно раскрыть истину трудно..."
80000139-32 = "...именно эта неоднозначность и свобода интерпретации позволяют людям вновь подтвердить свои чувства и доверие друг к другу."
80000139-33 = "Знаете, один мудрец сказал: «Жизнь как коробка шоколадных конфет»."
80000139-34 = "[s3] «Понятно! Раз ты не рассказываешь мне о своих истинных чувствах...»\n[s4] «Они заключены в этих пирожных!»"
80000139-37 = "...!"
80000139-38 = "С-Сенсей, вы всегда...!"
80000139-39 = "Всегда... говорите так осторожно и обходно..."
80000139-40 = "Это пугает людей. Такая непрямота и непрозрачность могут заставить девушку... скрыть настоящие чувства."
80000139-41 = "Если бы вы неправильно истолковали этот шоколад... Я была бы по-настоящему счастлива."
80000139-42 = "[s] «Прости. Не расслышал.»"
80000139-43 = "Ничего!"
80000139-46 = "[ns] «Это... шоколадное пирожное?»"
80000139-47 = "Да. Шоколадное пирожное под названием «картошка»."
80000139-48 = "Фу-фу. Я так и думала, что вы с ним не знакомы."
80000139-49 = "Всё-таки это фирменное блюдо Красная Зима."
80000139-50 = "Каждое пирожное называет себя фирменным, но «картошка» действительно особенная."
80000139-51 = "Сначала нужно разломать печенье с патокой на мелкие кусочки и растолочь в порошок."
80000139-52 = "Затем смешать со сгущёнкой, сахаром, какао и корицей."
80000139-53 = "[s] «Немало времени и усилий, да?»"
80000139-54 = "Когда начинаешь, оказывается вполне посильно."
80000139-55 = "Я решила приготовить их, потому что подумала о вас, Сенсей..."
80000139-56 = "...когда возвращалась из более-менее приличной пекарни с печеньем из патоки в руках."
80000139-57 = "[s] «Думала обо мне?»"
80000139-58 = "Да."
80000139-59 = "..."
80000139-60 = "Сама патока — всего лишь побочный продукт производства сахара."
80000139-61 = "Это тёмная липкая жидкость с сильным карамельным запахом, но вкус у неё кисловатый, потому что весь сахар уже извлечён."
80000139-62 = "Её используют только как вспомогательный ингредиент, обычно на корм животным или как сырьё для других приправ."
80000139-63 = "...Но даже из ингредиента, в котором будто бы нет никакого потенциала..."
80000139-64 = "...можно создать прекрасные вещи, вроде печенья с патокой и «картошки»."
80000139-65 = "Я подумала..."
80000139-66 = "..."
80000139-67 = "...что это напоминает Сенсея, который видит потенциал в студентах и помогает им раскрыться."
80000139-68 = "[ns5] «(Это был невероятно добрый и освежающий комплимент...)»\n[ns6] «(Но кажется, что она слишком многое в нём увидела...)»"
80000139-71 = "...Сенсей? Почему у вас такое лицо? Вроде довольны, но как будто не совсем."
80000139-72 = "Н-Неужели...?"
80000139-73 = "..."
80000139-74 = "А-Ах! Как обычно, я снова не сказала прямо. Я склонна уходить в длинные рассуждения и перегибать, и опять это сделала. Простите."
80000139-75 = "Ух... Не стоило такое говорить... Нет, даже думать не стоило... Вот почему мне надо учиться вовремя останавливаться..."
80000139-76 = "[s7] «Вовсе нет, Таканэ! Это неправда!»\n[s8] «Ты критик, верно? Для тебя вполне естественно так говорить!»"
80000139-79 = "...Правда?"
80000139-80 = "[s9] «Да! Мне нравится тебя слушать. Ты всегда так оригинальна!»\n[s10] «Твои рецензии раскрывают скрытую истину!»"
80000139-83 = "..."
80000139-84 = "Хи-хи!"
80000139-85 = "Спасибо, Сенсей."
80000139-86 = "Тогда не поделитесь этим пирожным со мной?"
80000139-87 = "Я заварю подходящий чай. Одну минуту, пожалуйста."
80000139-89 = "Мы с Таканэ ели «картошку»."
80000139-90 = "Это и правда было хорошее шоколадное пирожное... с лёгким карамельным ароматом и тягучей, но влажной текстурой."
