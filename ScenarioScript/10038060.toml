[translation]
10038060-1 = "Эпизод 6;Мы из далёкого будущего"
10038060-6 = ""
10038060-7 = "...Вы в порядке, Сенсей?"
10038060-8 = "[s1] «Со мной всё нормально, но...»\n[s2] «А что с Кисаки, Миной... и Руми?»"
10038060-11 = "За этих троих не переживайте."
10038060-12 = "Мы отвели их в самое безопасное место на Променаде. Возможно, скоро придётся отвести туда и вас."
10038060-13 = "По крайней мере, для нас всё вышло удачно. Мы отплатили президенту свой долг."
10038060-14 = "А остальное наладится... когда президент разберётся с политическим кризисом, который внезапно на неё свалился."
10038060-15 = "[s] «Что говорит твоя информационная сеть?»"
10038060-16 = "Ну, во-первых, Руми всё ещё ребёнок. Ей и остальным студентам, у которых всё ещё Синдром Малыша..."
10038060-17 = "...трудно свободно ходить по улицам, потому что они слишком привлекают внимание."
10038060-18 = "Особенно Руми. Её слишком многие знают."
10038060-19 = "Но есть и хорошая новость: информационная сеть Променада действительно всё ещё работает, так что мы получаем новости отовсюду."
10038060-20 = "И большинство этих новостей сейчас — о Генрюмоне."
10038060-21 = ""
10038060-23 = ""
10038060-25 = "Президент столкнулась с сильной критикой. Даже с осуждением."
10038060-28 = "Знаю. Я сама сначала не могла поверить."
10038060-29 = "Конечно, не все в Генрюмоне так думают. В основном это сторонники жёсткой линии."
10038060-30 = "Если кратко, они ставят под сомнение законность Кисаки как президента."
10038060-31 = "Обычно существует установленная процедура выбора президента студсовета, но..."
10038060-37 = ""
10038060-38 = "Процедура назначения госпожи Кисаки вообще не была обычной!"
10038060-39 = "По традиции президентом должна быть третьекурсница. Госпожа Кисаки была лишь на втором курсе, когда заняла должность."
10038060-40 = ""
10038060-42 = ""
10038060-44 = "Но разве не потому, что Генрюмон сам её поддержал? И одна из причин была в том, что..."
10038060-45 = "...предыдущая президент лишилась своей должности."
10038060-46 = "Печально и необычно, но это действительно произошло."
10038060-47 = "Да, и если бы этого не случилось, Кисаки даже не рассматривали бы как кандидата в президенты."
10038060-48 = "Уже одно это было грубейшим нарушением традиций!"
10038060-49 = "И всё же решение приняли единогласно..."
10038060-50 = "А это лишь доказывает, что вся процедура от начала до конца была прогнившей! Её НУЖНО исправить!"
10038060-53 = "[ns] «Может, не стоит рассказывать Кисаки об этом...»"
10038060-54 = "Советую именно вам ей и рассказать. Иначе она расстроится, когда узнает, что вы от неё это скрыли."
10038060-55 = "Она воспримет это спокойно. Наверняка просто скажет: «Президент должен принимать суд народа»."
10038060-56 = ""
10038060-58 = ""
10038060-59 = "О? Я прямо как она прозвучала? Хи-хи... Спасибо."
10038060-60 = "Я ценю то, насколько вы... открыты. Со всеми нами."
10038060-61 = "[s] «Учитель всегда на стороне ученика.»"
10038060-62 = "Я не всегда понимаю, когда стоит быть открытой. Даже с вами, Сенсей..."
10038060-63 = ""
10038060-65 = ""
10038060-66 = "...но позвольте всё же рассказать остальное."
10038060-67 = ""
10038060-69 = ""
10038060-70 = "Учитывая, что всё это устроила Шинтани Кай, она почему-то не слишком заинтересована в последствиях."
10038060-73 = ""
10038060-74 = "...О, Генрюмон всё ещё спорит между собой?"
10038060-75 = "О том, как управлять в отсутствие Кисаки..."
10038060-76 = "...и законно ли она вообще получила свой титул?"
10038060-77 = "И как всё это поможет нам с зельем, м-м?"
10038060-78 = "Не тратьте время на сплетни. Сосредоточьтесь на зелье. Ради этого мы здесь."
10038060-79 = ""
10038060-81 = ""
10038060-82 = "Нам нужна лучшая обработка и больше материалов — особенно больше десятитысячелетнего женьшеня."
10038060-83 = "Чего не хватает — требуйте у Генрюмона. Если этого будет недостаточно, обращайтесь к Променаду Чёрной Черепахи. Я буду в лаборатории."
10038060-84 = "*вздыхает* Меня окружают идиоты..."
10038060-85 = ""
10038060-87 = ""
10038060-90 = "...Так что теперь Променад поднял шум и требует отменить ограничения, а Общество Восточной Алхимии разбрасывается заявками на снабжение направо и налево."
10038060-91 = "Обычно Генрюмон вмешался бы и всех рассудил. Но сейчас... ну да."
10038060-95 = "Променад Чёрной Черепахи хочет уйти от ответственности? Нет! Не выйдет!"
10038060-96 = "Они определённо приложили руку ко всей этой ситуации!"
10038060-97 = "Да они, наверное, вообще САМИ всё устроили, лишь бы Фестиваль Лунного Света отменили и ограничения с них сняли!"
10038060-98 = "Разве это не слишком притянуто...? Никаких доказательств ведь нет..."
10038060-99 = "Слушай ОЧЕНЬ внимательно! Ты либо за Генрюмон и всё, что Шаньхайцзин всегда отстаивал, либо нет."
10038060-100 = "Сейчас у нас нет президента. Так кто, если не мы, будет поддерживать порядок и защищать академию?!"
10038060-101 = "Ну, порядок нам действительно нужен, и без лидера мы не сможем нормально работать."
10038060-102 = "Но кого вы предлагаете?"
10038060-103 = "Не кого, а что. Нас должны направлять наши традиции."
10038060-104 = "Что ты имеешь в виду?"
10038060-105 = ""
10038060-107 = ""
10038060-108 = ""
10038060-110 = "Предлагаю сформировать временное правительство и выбрать руководителя — того, кто лучше всех воплощает наши традиции."
10038060-113 = "[ns] «Генрюмон пытается заменить Кисаки...?»"
10038060-114 = "......"
10038060-115 = "Знаете, как представительница Променада Чёрной Черепахи скажу: я никогда особо не любила Генрюмон."
10038060-116 = "Но я признаю, что Шаньхайцзину он нужен и, думаю, будет нужен всегда."
10038060-117 = "Не то чтобы я соглашалась с тем, что они сейчас делают, пытаясь изгнать Кисаки за нарушение «традиций»..."
10038060-118 = "[s] «...»"
10038060-120 = "[ns] «Что ещё нам известно?»"
10038060-121 = ""
10038060-123 = ""
10038060-124 = "Ну, в основном это всё. Кроме..."
10038060-125 = "...по последним слухам, сторонники жёсткой линии уже почти выбрали замену."
10038060-128 = ""
10038060-129 = "Вы хотите втянуть в это Клуб Пекинской Оперы?"
10038060-130 = "Они сохранили самую суть нашей культуры. Кто лучше сможет олицетворять традиции Шаньхайцзина?"
10038060-131 = "К тому же опера требует отличной физической подготовки, а ещё есть тренировки Кагуи — они одни из наших лучших бойцов."
10038060-132 = "Но правильно ли будет так поступить? Иными словами, соответствует ли это традициям?"
10038060-133 = "......"
10038060-134 = ""
10038060-136 = ""
10038060-137 = "Вот моё предложение:"
10038060-138 = "Мы освобождаем Кагую и позволяем ей высказать своё мнение. А дальше решим по ситуации."
10038060-139 = ""
10038060-141 = ""
10038060-143 = ""
10038060-145 = "[ns] «Звучит плохо...»"
10038060-146 = "Так и есть, и я не могу сказать, чем всё обернётся."
10038060-147 = "Поэтому я и хотела спросить вашего совета."
10038060-148 = ""
10038060-151 = "Разумеется, без давления. Можете просто... сказать первое, что приходит в голову."
10038060-152 = "Или просто продолжать слушать. Может, и этого достаточно."
10038060-153 = "[s5] «Хм, если хочешь знать, что я думаю...»\n[s6] «Это всего лишь моё личное мнение, но...»"
10038060-156 = "Спасибо, Сенсей. Хм, это почти похоже на урок."
10038060-157 = "Мне вам честь отдать, как на занятии? О... это уже перебор? Справедливо."
10038060-158 = "Хм? Слышала ли я выражение «власть не терпит пустоты»? Кажется, да, но..."
10038060-159 = "А... То есть оно означает не только то, что кто-то захватит власть, если место освободится..."
10038060-160 = "...но и то, что давление снизу само вытолкнет кого-то на эту позицию?"
10038060-161 = "Власть и полномочия должны идти рука об руку с ответственностью и подотчётностью."
10038060-162 = "И по жизни будут происходить разные вещи. Вопрос о том, кто несёт ответственность, ОБЯЗАТЕЛЬНО возникнет."
10038060-163 = "Кто-то должен задать направление, принять эту ответственность и вынести решение."
10038060-164 = ""
10038060-166 = ""
10038060-167 = "В этом смысле амбициозный человек, который сам пробивается к власти, действительно может обрести для себя счастье..."
10038060-168 = "...по крайней мере, удовлетворив собственные потребности и желания."
10038060-169 = "Но если человека без таких амбиций загонят на эту должность лишь ожидания окружающих..."
10038060-170 = ""
10038060-172 = ""
10038060-173 = "......"
10038060-174 = "Кагуя, которую я знаю, может быть какой угодно, но амбициозной её не назовёшь."
10038060-175 = "Она скорее мастер старой школы — строгая и негибкая."
10038060-176 = "[s7] «И если поставить её во главе...»\n[s8] «Тогда она может...»"
10038060-185 = ""
10038060-186 = "...Ага."
10038060-187 = ""
10038060-189 = ""
10038060-190 = "Мне приходит в голову слишком много способов, которыми всё это может закончиться очень плохо."
10038060-197 = ""
10038060-198 = "Кагуя, пожалуйста, выйди из камеры. ...Ты свободна."
10038060-199 = ""
10038060-201 = ""
10038060-203 = ""
10038060-204 = "Вот как, неожиданно. Это воля президента?"
10038060-205 = ""
10038060-208 = ""
10038060-209 = "......"
10038060-210 = "...Это воля Генрюмона."
10038060-212 = "Хм, такой ответ порождает больше вопросов, чем снимает."
10038060-213 = "Мы всё объясним. Пожалуйста, пойдёшь с нами?"
10038060-219 = ""
10038060-220 = "...Вот что ты пропустила в Шаньхайцзине."
10038060-221 = "Т-Так, попробую всё сложить. Президент исчезла, Шинтани Кай вернулась и захватила Общество Восточной Алхимии... Простите, я забегаю вперёд..."
10038060-222 = "...Болезнь под названием Синдром Малыша превращает людей в детей, Променад Чёрной Черепахи на карантине..."
10038060-223 = "...и Фестиваль Лунного Света могут отменить?!"
10038060-224 = "Как всё это могло произойти здесь одновременно?!"
10038060-225 = ""
10038060-227 = ""
10038060-229 = "......"
10038060-231 = "Итак, Кагуя, Генрюмон объединился и решил, что нам необходимо опереться на наши традиции."
10038060-232 = "Более того, нам нужна организация, которая хотя бы временно поможет нам их поддерживать."
10038060-233 = "И вы подумали о Клубе Пекинской Оперы..."
10038060-235 = "Верно."
10038060-236 = ""
10038060-239 = ""
10038060-240 = "Для меня, как и для всех нас, это было бы честью. ...Но подозреваю, вы хотите сказать мне что-то ещё."
10038060-241 = "Да. И скажем прямо."
10038060-242 = ""
10038060-244 = ""
10038060-245 = ""
10038060-247 = "Нам нужен президент. И мы хотим, чтобы хотя бы временно им стала ты."
10038060-248 = ""
10038060-251 = ""
10038060-253 = "......"
10038060-255 = "Шаньхайцзину отчаянно нужны и традиции, и порядок. А судя по твоим прежним вопросам, ты хотела разрешить Шинтани Кай вернуться в академию."
10038060-256 = "Так совпало, что это уже произошло, а если ты хорошо справишься с этой ситуацией, сможешь принимать и другие решения для Шаньхайцзина."
10038060-257 = ""
10038060-259 = ""
10038060-260 = ""
10038060-262 = "......"
10038060-264 = "Не знаю, как сказать об этом Руми или Кисаки."
10038060-265 = "[s] «С этой частью я разберусь.»"
10038060-266 = "Спасибо. После этого... что ж, придётся рассмотреть все варианты и решить, что делать дальше."
10038060-267 = "Даже если Кагую поставят во главе, проблемы всё равно останутся."
10038060-268 = "Её легитимность с самого начала окажется под вопросом."
10038060-269 = "Как ни странно, единственный человек, кто может заявить о настоящей легитимности, — Шинтани Кай."
10038060-272 = ""
10038060-273 = "Несмотря на обстоятельства, в противостоянии взглядов с Кисаки она победила."
10038060-274 = "Что важнее, она могла бы — а некоторые скажут, что и «должна была» — выпуститься из Шаньхайцзина."
10038060-277 = "Но Общество Восточной Алхимии, похоже, держится в стороне от этого спора, а Шинтани Кай остаётся там, где находится сейчас."
10038060-278 = "Если бы Шинтани Кай попыталась захватить ещё больше власти или, наоборот, отказалась от неё, всё шло бы гораздо проще."
10038060-279 = "Но сейчас..."
10038060-280 = "[s] «Очень многое будет зависеть от решения Кагуи.»"
10038060-281 = "Есть..."
10038060-282 = "Не просто многое. Всё."
10038060-285 = "Я понимаю."
10038060-286 = "Сейчас Шаньхайцзину больше всего необходимо восстановить порядок и традиции."
10038060-287 = ""
10038060-290 = ""
10038060-291 = "И с учётом этого..."
10038060-292 = "......"
10038060-293 = ""
10038060-296 = ""
10038060-297 = "......"
10038060-298 = "Я вынуждена отказаться. Я не могу занять пост президента."
10038060-299 = ""
10038060-302 = ""
10038060-303 = "Почему?!"
10038060-304 = "......"
10038060-306 = "Вы просите меня и Клуб Пекинской Оперы разрушить традиции Шаньхайцзина ради их защиты."
10038060-307 = "Э-Это...!"
10038060-308 = "Кроме того, занять место госпожи Кисаки, пока она отсутствует, означало бы стать не более чем узурпатором. Это было бы абсолютным проявлением неверности."
10038060-310 = "Кагуя..."
10038060-312 = "Я всего лишь артистка — постановщик и исполнитель. Любая участница Клуба Пекинской Оперы скажет то же самое."
10038060-313 = "Да, я могу быть строгой, а мои тренировки — суровыми, но всё это ради выступления..."
10038060-314 = "...и ради того, что это выступление значит для всего Шаньхайцзина. За этим никогда не стояло других амбиций или намерений."
10038060-315 = "Если бы я делала это из эгоизма хоть в какой-то степени, я заслуживала бы куда более сурового наказания, чем получила. Исключение было бы самым малым."
10038060-316 = "Но послушай. Сейчас Шаньхайцзин..."
10038060-317 = "...Да, я понимаю точку зрения Генрюмона."
10038060-318 = "И если хаос продолжится, от него пострадает каждый студент Шаньхайцзина."
10038060-319 = "Я люблю Шаньхайцзин и все его традиции. Мы с клубом поддерживаем их уже очень давно."
10038060-320 = "Поэтому я сделаю всё возможное для поддержания порядка — в пределах разрешённых школьных правил."
10038060-321 = ""
10038060-324 = ""
10038060-325 = "Что ж, тогда решено."
10038060-326 = ""
10038060-328 = ""
10038060-329 = "Спасибо, Кагуя."
10038060-332 = ""
10038060-333 = "Мы получили ещё одно сообщение от Общества Восточной Алхимии. Там сказано..."
10038060-334 = ""
10038060-337 = ""
10038060-338 = ""
10038060-339 = "«Все ресурсы и доступная поддержка Шаньхайцзина должны быть направлены Обществу Восточной Алхимии»."
10038060-340 = "Просто уточню: Общество всегда так часто выдвигало подобные требования?"
10038060-341 = "Нет, вовсе нет... На самом деле до сих пор позиция Общества обычно была ближе к: «Мы ничего не просим, так что не обращайте на нас внимания»."
10038060-342 = "Значит, это их новый подход... или, возможно, возвращение к очень старому."
10038060-343 = "......"
10038060-344 = "В любом случае выполнить такое требование будет довольно трудно."
10038060-345 = "Верно. Но справедливости ради, все мы в каком-то смысле обязаны им своими нынешними положениями, а ты косвенно обязана им своей свободой."
10038060-346 = "Будет сложно постоянно им отказывать."
10038060-347 = "Хм..."
10038060-348 = "Пока что мы могли бы помогать им настолько, насколько можем, а позже пересмотреть решение..."
10038060-349 = "Это общее мнение Генрюмона?"
10038060-350 = ""
10038060-352 = ""
10038060-353 = "......"
10038060-354 = "(Получается, никто не хочет брать на себя ответственность...)"
10038060-355 = "Хорошо, пока поступим согласно этому предложению."
10038060-357 = "При условии, что ты согласишься его утвердить."
10038060-358 = ""
10038060-360 = ""
10038060-362 = ""
10038060-363 = ""
10038060-364 = "*вздыхает*"
10038060-365 = ""
10038060-367 = ""
10038060-369 = ""
10038060-370 = ""
10038060-373 = "Дом подобен постоялому двору. Мы задерживаемся в нём ненадолго, но все мы путники. Однажды каждый идёт дальше."
10038060-374 = "Власть и положение подобны осеннему ветерку, скользнувшему по воротнику... во время ночной прогулки по неясной тропе."
10038060-375 = ""
