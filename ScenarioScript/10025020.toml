[translation]
10025020-1 = "Эпизод 2;Тень над деревней Ятоура"
10025020-2 = "Причал Ятоуры"
10025020-3 = ""
10025020-4 = ""
10025020-5 = ""
10025020-6 = ""
10025020-7 = ""
10025020-8 = ""
10025020-10 = ""
10025020-11 = ""
10025020-12 = ""
10025020-13 = ""
10025020-14 = "Здравствуйте, сэр."
10025020-15 = "..."
10025020-16 = "Вы местный?"
10025020-17 = "..."
10025020-18 = "Я приехала сюда отдыхать с друзьями, но море немного неспокойное."
10025020-19 = "Поблизости есть пляж, где лучше купаться?"
10025020-20 = "...Если приехали купаться, вы ошиблись городом."
10025020-21 = "Деревня Ятоура не для молодёжи вроде тебя. Тут у нас только креветки."
10025020-22 = "П-Правда? А по-моему, Ятоура довольно красивая..."
10025020-23 = "...О вкусах не спорят."
10025020-24 = ""
10025020-26 = ""
10025020-27 = "Делай что хочешь. Только не мешай мне работать."
10025020-28 = "О, эм, спасибо."
10025020-29 = ""
10025020-31 = ""
10025020-32 = "Это ваша креветочная лодка?"
10025020-33 = "Ага."
10025020-34 = "Она больше, чем я ожидала. Якорь поднят... Вы собираетесь выходить в море?"
10025020-36 = "Какой ленивый рыбак выходит ловить рыбу посреди дня?"
10025020-37 = "Эм... Что?"
10025020-39 = "Мы заканчиваем день ещё до того, как такие молодые, как ты, успевают позавтракать. Я как раз собирался бросить якорь."
10025020-40 = "П-Понятно..."
10025020-41 = "Сегодня много креветок поймали?"
10025020-43 = "Тебе-то что?"
10025020-44 = "П-Просто любопытно... Простите, если заставила вас чувствовать себя неуютно."
10025020-46 = "Просто... в последнее время в Д.У. почти нет креветок..."
10025020-47 = "А в соцсетях говорят, что у деревни Ятоура, должно быть, проблемы, раз все креветки ловят здесь..."
10025020-48 = ""
10025020-50 = ""
10025020-51 = "Никаких проблем здесь нет."
10025020-52 = "Но—"
10025020-53 = "А, так ты думаешь, ловить креветок легко?"
10025020-54 = "Я знаю одно: мы зависим от моря. Что поймаю — то поймаю, а что мир делает с моим уловом, меня не касается."
10025020-56 = "И никакая малолетка вроде тебя не будет учить меня, как вести дела."
10025020-58 = "Я не..."
10025020-59 = ""
10025020-61 = ""
10025020-63 = ""
10025020-64 = ""
10025020-65 = ""
10025020-66 = "Как я и сказал, не мешай мне работать."
10025020-67 = "Если сунешь нос не в своё дело, не удивляйся, если за тобой придут Глубинные..."
10025020-68 = ""
10025020-70 = ""
10025020-72 = ""
10025020-73 = "Глубинные...?"
10025020-75 = ""
10025020-78 = "Пост береговой охраны Валькирии в Ятоуре"
10025020-79 = ""
10025020-80 = ""
10025020-81 = ""
10025020-82 = "Эй! Здесь кто-нибудь есть?"
10025020-84 = ""
10025020-90 = "Уф... Кто там так шумит с самого утра...?"
10025020-91 = ""
10025020-95 = ""
10025020-96 = ""
10025020-97 = "А? Я тебя раньше здесь не видела. Ты кто?"
10025020-98 = "О, я просто туристка. Слышала, что в этой деревне хорошо купаться."
10025020-99 = "Купаться? Здесь?"
10025020-100 = "Ты, эм, уверена, что приехала куда надо? В округе много маленьких городков, их легко перепутать..."
10025020-101 = "То есть не то чтобы сюда совсем никто не приезжал купаться..."
10025020-102 = "Но туристка в этой дыре... Давненько такого не было."
10025020-103 = "У нас выбора нет, но поверь, я бы моментально запросила перевод, если бы думала, что его одобрят."
10025020-105 = "В таком скучном городке почти нет шансов себя проявить, понимаешь? И повышения не дождёшься..."
10025020-107 = "(Я ещё никогда не видела студентов Валькирии с настолько безответственным отношением...)"
10025020-109 = "Ну, есть что-нибудь, что туристу стоит знать об этой местности? Опасные участки берега? Всплески преступности?"
10025020-110 = "В городе в последнее время что-нибудь случалось?"
10025020-111 = "Без понятия."
10025020-112 = "...?!"
10025020-113 = "Если нужны свежие новости, купи газету. Не приставай к нам с этим."
10025020-114 = "Ага. У нас есть дела поважнее, чем развлекать туристов."
10025020-115 = "Вы же только что сказали, что вам нечего делать?!"
10025020-117 = "Я не знала, что студенты Полицейской школы Валькирии бывают такими..."
10025020-118 = ""
10025020-120 = ""
10025020-121 = ""
10025020-122 = "Эй, не то чтобы мы сами выбрали—"
10025020-123 = ""
10025020-125 = ""
10025020-127 = "...Забудь. Забудь, что мы вообще что-то сказали."
10025020-128 = "У нас работа. Пожалуйста, не создавай проблем."
10025020-130 = "Если какая-нибудь случайная туристка разозлит Глубинных, расплачиваться придётся всем нам."
10025020-132 = ""
10025020-135 = ""
10025020-137 = ""
10025020-139 = "Какая наглость...!"
10025020-140 = "Но что они имели в виду под «Глубинными»...?"
10025020-142 = ""
10025020-145 = ""
10025020-146 = ""
10025020-147 = ""
10025020-148 = "...За мной никто не смотрит, да?"
10025020-149 = "А-а-а, ну и ворчливая деревня. Я всего-то хочу помочь поймать одну маленькую рыбку, а на меня так косо смотрят..."
10025020-150 = "Но всё, что нужно, я уже узнала. Осталось совсем немного, и я поймаю самую большую—"
10025020-151 = "Эм..."
10025020-152 = ""
10025020-154 = ""
10025020-155 = "П-Простите, но вы стоите на моей леске..."
10025020-156 = "Ч-Что?! Когда ты здесь появилась?!"
10025020-157 = ""
10025020-159 = ""
10025020-160 = "Я всё это время была здесь..."
10025020-161 = "Я понимаю, п-почему вы не заметили такую скучную и незначительную личность, как я..."
10025020-163 = "Я почти как морская звезда на пирсе..."
10025020-165 = "Н-Нет! Ты всё неправильно поняла!"
10025020-166 = "Просто, эм, у меня много мыслей в голове. Я не смотрела, куда иду. Прости!"
10025020-167 = "Вот, возьми несколько моих приманок, только... пожалуйста, перестань так говорить..."
10025020-168 = ""
10025020-170 = ""
10025020-171 = "С-Спасибо..."
10025020-172 = "Кстати, ты пришла сюда рыбачить? Ты вроде одета соответственно..."
10025020-173 = "О, да. Говорят, здесь можно поймать что-то крупное."
10025020-174 = "П-Понятно... Друзья п-притащили меня сюда. Я не знала, что этот город известен рыбалкой..."
10025020-175 = "Какую рыбу здесь можно поймать?"
10025020-176 = "К-Какую? Эм..."
10025020-177 = "Эм... Скумбрию?"
10025020-178 = "Ну, скумбрия мелкая, так что не знаю, поймаешь ли ты, эм, что-то крупное..."
10025020-179 = "И приманка у тебя с-слишком большая для скумбрии..."
10025020-180 = "П-Правда...?"
10025020-181 = "Но, может, здесь есть очень большая скумбрия, которую можно поймать на такую приманку... да?"
10025020-183 = "Да что там, если Глубинные помогут, может, я поймаю даже метровую!"
10025020-185 = "Глубинные...?"
10025020-187 = "Ой...!"
10025020-188 = "Я этого не говорила! То есть я просто бормотала себе под нос."
10025020-189 = "О, я только что вспомнила другое место, где можно ловить рыбу. Пойду одна. Если пойдём вдвоём, рыба испугается..."
10025020-190 = "Не упоминай меня перед местными! Ладно, пока!"
10025020-191 = ""
10025020-195 = ""
10025020-196 = ""
10025020-197 = "Что-то тут не так..."
