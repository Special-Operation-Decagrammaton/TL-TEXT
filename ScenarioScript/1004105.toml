[translation]
1004105-1 = "Трудно отмыть"
1004105-2 = "..."
1004105-3 = "[s] «Мисаки, что случилось?»"
1004105-4 = "Простите. Долгая история..."
1004105-5 = "Я несколько дней не ела... и промокла под дождём до нитки."
1004105-6 = "Угх..."
1004105-7 = ""
1004105-9 = ""
1004105-11 = "[ns] «Мисаки?!»"
1004105-12 = "Мне немного нездоровится..."
1004105-13 = "[s] «У тебя жар далеко не „немного“.»"
1004105-15 = "...Где мы?"
1004105-16 = "[s] «Я пока арендовал офис.»"
1004105-17 = "..."
1004105-18 = "[s1] «Ты не ела и промокла под дождём.»\n[s2] «Неудивительно, что заболела. Сейчас тебе нужно отдыхать.»"
1004105-19 = "..."
1004105-20 = "..."
1004105-21 = "[s] «Я принёс тебе сухую одежду, чтобы переодеться.»"
1004105-23 = "[ns] «И еду тоже. Отдыхай и поешь, когда сможешь, Мисаки.»"
1004105-24 = "...Вы уходите?"
1004105-25 = "[s] «Прости, у меня работа.»"
1004105-26 = "Хорошо."
1004105-27 = ""
1004105-31 = "Это нелепо. Мне плевать на это дурацкое тело."
1004105-32 = "На этот бессмысленный сосуд, который постоянно мешает."
1004105-33 = "Хотела бы я... сбежать из своего тела."
1004105-34 = "Почему мир такой?"
1004105-35 = "..."
1004105-36 = "Мне... одиноко."
1004105-39 = "[ns] «Мисаки, я вернулся.»"
1004105-41 = "[ns] «Мисаки? Ты где?»"
1004105-43 = "[ns3] «Я слышу воду...?»\n[ns4] Открыть дверь."
1004105-48 = "― ...Сенсей? Вы вернулись.[wa:3200]"
1004105-50 = "― Забыли что-то важное?[wa:740]"
1004105-53 = "― Меня?[wa:1540]"
1004105-55 = "― Вы... переживали за меня?[wa:520]"
1004105-58 = "― Подумать только,[wa:1560]"
1004105-60 = "― вы беспокоитесь о таких незначительных вещах..."
1004105-63 = "― Для взрослого у вас слишком много свободного времени.[wa:350]"
1004105-66 = "― Этот холодный, шумный мир...[wa:1340]"
1004105-68 = "― и я."
1004105-71 = "―Дождь на самом деле никогда[wa:10]"
1004105-73 = "― ничего не очищает.[wa:90]"
1004105-76 = "― Хотела бы я[wa:2040]"
1004105-78 = "― поверить, что это возможно...[wa:1400]"
1004105-82 = "..."
1004105-83 = "Я жила без вдохновения."
1004105-84 = "Могу жить. Могу умереть. Неважно. Я ничего не чувствую."
1004105-85 = "Но когда вижу вас, Сенсей..."
1004105-86 = "...я чувствую злость."
1004105-87 = "Почти невыносимую..."
1004105-88 = "Раньше я такого не испытывала."
1004105-89 = "...Странное чувство."
1004105-90 = "[s] «П-Правда?»"
1004105-91 = "...Это не ваша вина. Вы только и делали, что помогали мне."
1004105-92 = "А когда вас не было... я..."
1004105-93 = "..."
1004105-94 = "В любом случае, как вы?"
1004105-95 = "[s] «Я зашёл после работы и принёс тебе лекарство.»"
1004105-96 = "...Понятно. Хорошо."
1004105-97 = "[s] «Я взял сладкое, чтобы было легче принимать.»"
1004105-98 = "..."
1004105-99 = "Что?"
1004105-100 = "Сладкий сироп... Как детское лекарство?"
1004105-101 = "Вы считаете меня ребёнком?"
1004105-102 = "[s] «...Я подумал, что горькое лекарство будет тяжело пить.»"
1004105-103 = "Думаете, я не умею глотать лекарства? Что для меня это тяжело?"
1004105-104 = "Объяснитесь! Почему вы так решили?"
1004105-105 = "[s] «Э-Это в аптеке посоветовали...»"
1004105-106 = "Для ребёнка?"
1004105-107 = "[s] «Н-Ну...»"
1004105-109 = "Мисаки какое-то время сердито допрашивала меня, прежде чем мне удалось заставить её принять лекарство."
