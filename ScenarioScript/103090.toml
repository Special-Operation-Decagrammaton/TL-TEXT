[translation]
103090-1 = "Эпизод 9; Последняя ночь на земле"
103090-2 = "Временное жильё Шале"
103090-4 = "Вот такая ситуация."
103090-5 = "Спасибо за новости. Я уже кое-что слышала."
103090-6 = "Пока вас не будет, мы защитим район Миллениум."
103090-7 = "Вернее, весь Кивотос."
103090-8 = "Хорошо. Я на вас рассчитываю."
103090-11 = "Нет, наоборот. Юука..."
103090-12 = ""
103090-14 = ""
103090-16 = ""
103090-18 = "Я рассчитываю, что ты позаботишься о себе и вернёшься домой целой."
103090-19 = ""
103090-22 = ""
103090-23 = "...Обещай."
103090-26 = "Хошино..."
103090-27 = "Я понимаю ситуацию, Аяне. Ты поднимаешься на Утнапиштиме вместе с Сенсеем, чтобы проникнуть в Ковчег."
103090-28 = "Но ты не пойдёшь одна, Аяне!"
103090-29 = "Н-Но..."
103090-31 = "Когда вы попадёте в Ковчег, впереди будут долгие и тяжёлые бои."
103090-32 = "Чем больше друзей рядом, тем лучше."
103090-33 = "И важнее всего..."
103090-34 = "Широко ведь на Ковчеге, да?"
103090-35 = ""
103090-38 = ""
103090-39 = ""
103090-41 = "..."
103090-42 = "...Это не точно, но думаю, да."
103090-43 = "Я хочу сама увидеть Широко. Мы все хотим."
103090-45 = "Если мы войдём в Ковчег, Широко придёт нас остановить."
103090-46 = "Наша задача — обезвредить и поймать Широко."
