103090-49 = ""
103090-52 = "Такая негативность совсем не в стиле крутой преступницы!"
103090-53 = "Ч-Что...?!"
103090-54 = ""
103090-56 = ""
103090-60 = ""
103090-62 = "Ого! ☆ Решатели проблем 68!"
103090-64 = ""
103090-65 = "Привет! Мы пришли в гости."
103090-66 = "Р-Рада вас видеть."
103090-67 = "*вздыхает* Хорошо, что не я одна переживаю..."
103090-68 = "Что вы тут болтаете про провал да про провал? Операция ещё даже не началась!"
103090-70 = "Н-Ну... это..."
103090-71 = ""
103090-73 = "В такие моменты...!"
103090-74 = ""
103090-76 = ""
103090-78 = "Нужно говорить: «Когда всё закончится, пойдём есть рамэн!»"
