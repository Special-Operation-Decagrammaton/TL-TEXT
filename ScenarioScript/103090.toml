103090-86 = "Мне почему-то это прозвучало немного зловеще."
103090-87 = "Хи-хи-хи. Она так говорит, но Ару чуть не расплакалась, когда услышала, что Каёко полетит одна."
103090-89 = "Что?! Н-Ничего подобного!"
103090-90 = "Хи-хи... Ты прямо говорила: «Каёко! Только не вздумай там пострадать, ладно?!»"
103090-91 = "Т-Такая преступница, как я, никогда бы так не сказала!"
103090-93 = "Честно говоря, прогулкой это не будет, но со мной всё будет хорошо."
103090-94 = "План составили лучшие студенты каждой академии. И главное — там будет Сенсей [USERNAME]."
103090-95 = "Пока Сенсей рядом... мне кажется, всё будет хорошо. Так что я особо не переживаю."
103090-96 = "...Ты права."
103090-98 = "Согласна."
103090-99 = "Вспомните всё, чего мы добились благодаря Сенсею."
103090-100 = "..."
103090-101 = "..."
103090-105 = ""
103090-115 = ""
103090-116 = ""
103090-118 = ""
103090-119 = ""
103090-121 = "...Точно. С нами происходили немыслимые вещи, когда Сенсей был рядом."
103090-122 = "Хех, верно? Так что давайте поверим в эти немыслимые вещи."
103090-123 = ""
103090-126 = ""
103090-127 = "...Хорошо!"
103090-128 = "Спасём Широко."
103090-129 = "Ага! Операция по поимке Широко!"
103090-131 = "В миллионный раз: она не дикое животное..."
103090-133 = "Временное жильё у места раскопок в пустыне"
103090-136 = "Я ходила посмотреть на межзвёздный корабль, но..."
103090-137 = "Ага, он немного не такой, как мы представляли."
103090-139 = "Да... В космос он даже выйти не может, оружия тоже нет. Наверное, это вообще не межзвёздный боевой корабль."
103090-141 = "Завтра Сенсей поднимется на нём и нападёт на злую базу в стратосфере..."
103090-142 = "Что нам теперь делать?"
103090-143 = "Хмм, может, вернуться в Миллениум, как сказала Юука...? Думаю, среди всей этой элиты мы будем только мешать..."
103090-144 = ""
103090-146 = ""
103090-148 = ""
103090-149 = "Я хочу пойти с Сенсеем."
103090-151 = "Алиса?"
103090-152 = "Ч-Что ты говоришь?"
103090-153 = "Она права. Алиса, дебюта Космического Героя сейчас не будет."
103090-154 = "Я расстроена из-за Космического Героя, но..."
103090-155 = "Только я могу защитить боевой корабль."
103090-157 = "А? Почему ты так думаешь?"
103090-158 = "П-Потому что на корабле нет оружия..."
103090-159 = "Это из-за Меча Света? Поэтому ты хочешь пойти?"
103090-161 = "Да. Меч Света был спроектирован Инженерным отделом для использования на межзвёздном корабле."
103090-162 = "И больше никто в Кивотос не способен им владеть."
103090-163 = ""
103090-165 = "..."
103090-167 = "Инженерный отдел на самом деле не проектировал его для космических сражений, так что они говорят, что в такой большой битве мощности будет недостаточно, но..."
103090-168 = "Если я единственная, кто может защитить корабль..."
103090-169 = "Если я могу хоть как-то помочь Сенсею, я хочу помочь."
103090-171 = "Н-Но всё равно..."
103090-172 = "Хорошо, я понимаю, что ты чувствуешь. Сенсей столько всего для нас сделал."
103090-173 = ""
103090-176 = ""
103090-177 = ""
103090-179 = ""
103090-181 = "...Тогда, может, пойдём все вместе?"
103090-183 = "А? Что?"
103090-184 = "Ю-Юзу...?"
103090-186 = "Если подумать, Алиса уже пережила много опасных ситуаций."
103090-187 = "Мы многое в них не понимали. Чтобы всё разрешить, нам нужна была помощь многих людей."
103090-188 = "Э-Это правда..."
103090-189 = "Если честно, я до сих пор многого не понимаю. Не знаю, почему президент преследует Алису и что скрывает."
103090-190 = "Я-я тоже..."
103090-191 = "Но это неважно!"
103090-192 = "П-Правда..."
103090-194 = "..."
103090-196 = "Я... я не хочу, чтобы нас оставили позади."
103090-197 = "Даже если мы не понимаем ситуацию, всё будет хорошо, если мы будем держаться вместе..."
103090-198 = "Ага... Я почти не понимаю, что происходило до сих пор... но мне было не так страшно, потому что рядом были Сенсей и все остальные..."
103090-199 = "Я познакомилась с новыми людьми... например, с отрядом RABBIT и главой Префектурной команды... хотя я их немного боялась..."
103090-200 = ""
103090-202 = ""
103090-204 = "Но... мне это нравилось больше, чем прятаться в шкафу."
103090-205 = "Так что... я хочу пойти с Алисой."
103090-206 = "Отдел разработки игр существует дальше благодаря Алисе."
103090-207 = "Так что если Алиса хочет что-то сделать... мы должны ей помочь."
103090-208 = "М-Мы же члены одной группы, помнишь?"
103090-209 = ""
103090-211 = ""
103090-213 = "..."
103090-215 = "Да, верно, Юзу! Мы должны пойти вместе! Так будет правильно!"
103090-216 = "Хорошо! Алиса, может, мы и не летим как космические герои, но будем защищать корабль рядом с тобой."
103090-218 = "Да. Я хочу пойти вместе со своими членами группы! Тогда мне не будет страшно!"
103090-220 = "Алиса... Ты боишься?"
103090-221 = "Да, боюсь."
103090-222 = ""
103090-224 = ""
103090-226 = "...Я до сих пор чувствую Кей внутри себя."
103090-227 = ""
103090-230 = ""
103090-232 = "Что?! Кей? Правда? Я думала, мы разнесли Кей Мечом Света!"
103090-233 = "К-Кей... Думаю, это не совсем правильное имя...!"
103090-235 = "Я не знаю, кто такая Кей и чего она от меня хочет."
103090-236 = "Если честно, я даже не знаю, кто я на самом деле."
103090-237 = "Кей говорит, что я принцесса, оставленная Безымянными богами, а президент Рио говорит, что я оружие, которое принесёт миру разрушение."
103090-238 = "Принцесса, Кей, Ковчег, Безымянные боги... Я ничего не знаю обо всём этом..."
103090-239 = "Но рядом со мной Момои, Мидори, Юзу и Сенсей..."
103090-240 = "Алиса... Ты боишься?"
