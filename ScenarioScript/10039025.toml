[translation]
10039025-2 = "Отличная работа, все! Мы обеих благополучно поймали."
10039025-3 = "Да, захват чистый, без потерь."
10039025-4 = "Да. Мы успешно захватили... Серику и Аяне."
10039025-6 = "Мне кажется или нас по очереди постоянно кто-то ловит?"
10039025-7 = "[s1] «Ну, значит, следующая будет...»\n[s2] «Хм, если подумать...»"
10039025-10 = ""
10039025-12 = ""
10039025-13 = "Ну..."
10039025-14 = "...Сенсей? Что вы имеете в виду...?"
10039025-15 = "...А. Вы просто разговаривали сами с собой? Понятно..."
10039025-16 = "В любом случае..."
10039025-17 = "Вы двое, уже заходите! Не стесняйтесь!"
10039025-18 = "Ладно, ладно. Уже заходим..."
10039025-19 = "У-уф...! Эм...!"
10039025-20 = "Только ничего не говорите. Я не хочу слышать ни одного комментария ни от кого из вас."
10039025-21 = "Х-Хорошо..."
10039025-27 = ""
10039025-29 = ""
10039025-31 = ""
10039025-32 = "[ns3] «...?!»\n[ns4] «...Ого.»\n[ns5] «...Ничего себе.»"
10039025-37 = "...!"
10039025-38 = "...Ого..."
10039025-39 = "[ns6] «...?»\n[ns7] «...Мари...?»"
10039025-43 = "З-Заткнитесь! Мы же сказали, ничего не говорите!"
10039025-44 = "Уф... Что это вообще ЗА костюм? Я теперь никогда от этого не отмоюсь..."
10039025-46 = "О, всё выглядит ровно так, как я представляла!"
10039025-47 = "Столько работы — найти дизайнера, снова и снова всё проверять... Я так счастлива."
10039025-49 = "Ты выглядишь как мама, которая смотрит на свою дочь!"
10039025-50 = "И-и! М-Мой пупок...!"
10039025-51 = "...! Э-Эм.... С-Сенсей...?!"
10039025-52 = "П-Подождите, СЕНСЕЙ?! Что вы здесь делаете...?!"
10039025-53 = ""
10039025-55 = ""
10039025-57 = "Серьёзно, что это такое?! Что вообще происходит?!"
10039025-58 = "Надо было догадаться, когда старшие вдруг стали действовать так слаженно!"
10039025-59 = "[s8] «Вы обе очень красивые. Я серьёзно.»\n[s9] «Вы двое просто потрясающие! Нет, правда.»"
10039025-62 = "Уф...! Серьёзно, я просто не могу!"
10039025-63 = "И хватит нам льстить!"
10039025-64 = "О нет, мы не льстим! Вы обе и правда выглядите прекрасно!"
10039025-65 = "Не только Сенсей так считает, я тоже! Как только вас увидела, сразу захотела себе такой же костюм!"
10039025-66 = "...Эй, Сенсей, кто это?"
10039025-67 = ""
10039025-69 = ""
10039025-70 = "Наверное, она из Сестринства. Что она здесь делает?"
10039025-71 = "...Чего?"
10039025-72 = "Вы хотите, чтобы МЫ научили вас быть поп-идолами? Какого..."
10039025-73 = ""
10039025-75 = ""
10039025-76 = "...Ладно, ПОЛАГАЮ, в это можно поверить. Не думаю, что Сенсей стал бы вас на такое подбивать..."
10039025-77 = ""
10039025-80 = "[ns10] «...Не ДУМАЕШЬ?»\n[ns11] «Конечно, когда Я это говорю — это лесть. А когда ОНА...»"
10039025-83 = "Хм?"
10039025-84 = "Да ладно, Сенсей. Мы же знаем, что вы всегда стараетесь сказать что-нибудь приятное, что бы ни происходило."
10039025-86 = "Ха... Хаха..."
10039025-87 = "А! Точно. Это уже ваша вина, Сенсей."
10039025-88 = "[s12] «*шмыг* Но я ведь всегда говорю искренне...»\n[s13] «Ну тогда поверьте, когда я говорю, что буду за вас болеть.»"
10039025-91 = ""
10039025-93 = ""
10039025-94 = "...Ну, если вы так говорите..."
10039025-95 = "С-Сенсей...?"
10039025-96 = ""
10039025-98 = ""
10039025-99 = "Эй, Сэрика, послушай."
10039025-100 = "Наверное, после всего, через что мы только что прошли, это прозвучит странно, но..."
10039025-101 = "Нет, я поняла. Если Сенсей будет там и станет за нас болеть, тогда... Ну, обещание есть обещание, верно?"
10039025-102 = "То есть, только поэтому! Никаких других причин. Мы просто должны выполнить обещание. Правда, Аяне?"
10039025-103 = "Эм, да! Это вообще не ради того, чтобы красоваться перед вами или кем-то ещё. Мы дали обещание и должны его выполнить, понятно?"
10039025-104 = "ВСЕ поняли? Сенсей? Старшие?"
10039025-105 = "Хех, они будто монеткой перевернулись."
10039025-106 = "Замолчи, Хошино!"
10039025-108 = "Я ценю, что вы сдерживаете своё обещание."
10039025-109 = "Отлично! Эм... ладно, пусть будет так!"
10039025-110 = "Хи-хи."
10039025-111 = "Большое спасибо за помощь, Сенсей. И тебе тоже, Мари!"
10039025-112 = "О, и конечно, вы ведь хотели узнать, как готовиться к роли идолов, верно? Мы расскажем. Это меньшее, что можем сделать."
10039025-113 = "Я расскажу вам всё о месте, где мы заказали костюмы, и о том, как мы их разрабатывали!"
10039025-115 = "После этого Нономи подробно всё объяснила."
10039025-119 = ""
10039025-121 = ""
10039025-123 = ""
10039025-125 = "— Костюм пройден —"
