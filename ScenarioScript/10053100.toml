[translation]
10053100-1 = "Послесловие;Барбекю и чили"
10053100-2 = ""
10053100-3 = "М-м. Хорошая корочка получилась."
10053100-4 = "Ставки на эти «стейки» ещё никогда не были так высоки! Все, берите тарелки!"
10053100-5 = ""
10053100-7 = ""
10053100-8 = ""
10053100-9 = "..."
10053100-10 = "Чего вы жмётесь? Я сказала: берите. Тарелки."
10053100-11 = "Ну... Эм, мы правда очень благодарны. Безмерно."
10053100-12 = "Но... вы уверены, что нам можно присоединиться к вашему... барбекю во дворе?"
10053100-13 = "...? Ты вообще о чём?"
10053100-14 = "Лучше голодать будете? Давайте. Чтобы жить, надо есть."
10053100-15 = "Ну, да, но..."
10053100-16 = "Тогда закройте рты и ешьте."
10053100-17 = "...? Одновременно?!"
10053100-18 = "...? Верно подмечено. Тогда сначала опустите маски, возьмите тарелку, а дальше разберётесь. И хватит ныть!"
10053100-20 = ""
10053100-21 = "..."
10053100-22 = "А у тебя что за проблема?"
10053100-23 = "Ну, Коноха... Если ты и дальше будешь такой доброй, кто-нибудь ударит тебя в спину."
10053100-24 = "О, правда?"
10053100-25 = "Ч-Что? Почему ты так—?"
10053100-26 = "Ой, да ты за меня волнуешься, правда?"
10053100-27 = "Шьяаах! Я такого не говорила!"
10053100-28 = "Я не... не волнуюсь!"
10053100-29 = "Ну и отлично! Потому что не о чем."
10053100-30 = ""
10053100-32 = ""
10053100-33 = "...Рэна, как старшая, я дам тебе два важных жизненных урока. Слушаешь?"
10053100-34 = "Первое: что бы ни случилось, как только ты по-настоящему встретишь проблему лицом к лицу, выход найдётся."
10053100-35 = "Второе: нет ничего, что нельзя решить силой... или небольшой ОГНЕВОЙ МОЩЬЮ. Ха-ха-ха!"
10053100-36 = ""
10053100-38 = ""
10053100-40 = ""
10053100-41 = "*вздох* Я бы тоже была такой беззаботной, если бы могла одним ударом разнести АВТОБУС пополам."
10053100-42 = ""
10053100-43 = "Ах, как же это прекрасно."
10053100-44 = "Я сто лет не ела мяса..."
10053100-45 = ""
10053100-48 = ""
10053100-49 = "..."
10053100-50 = "Ах!"
10053100-51 = "Я чуть не потеряла самообладание перед своей младшей. Нужно быть осторожнее..."
10053100-52 = "А? Что такое, президент? Почему вы перестали есть?"
10053100-53 = "А-А... О, просто я ТАК ЧАСТО ем отличное дорогое мясо, что мне наскучило прямо на середине куска. Ха-ха..."
10053100-54 = "Конечно, президент! Похоже, у вас, как всегда, всё прекрасно."
10053100-55 = "Н-Ну разумеется!"
10053100-56 = "Но, дорогая Цубаса... Ты точно хочешь сидеть... так близко ко мне?"
10053100-57 = "Ой, простите. Я просто очень рада снова вас видеть. Прошло столько времени."
10053100-58 = "Я мешаю...?"
10053100-59 = "О нет, н-ничуть! Мне просто стало интересно! С научной точки зрения!"
10053100-60 = "Т-Тогда... я ещё немного посижу с вами."
10053100-61 = "Фуфуфу."
10053100-62 = "...Я не могу есть, когда она так на меня смотрит..."
10053100-64 = ""
10053100-65 = "Эй, аферистка. Мошенница. Обманщица."
10053100-66 = "Не называй меня так!"
10053100-67 = "Ты, похоже, хороший лидер, даже если мошенница. По крайней мере, директор тебя любит. Очень."
10053100-68 = "Я НЕ мошенница...!"
10053100-70 = "Эй, Коноха."
10053100-71 = "Если не возражаешь, хочу тебе кое-что сказать. Нельзя слепо верить всему, что слышишь."
10053100-73 = "Видели...?"
10053100-75 = "Генеральный студсовет контролирует традиционные СМИ. И всем известно, что они заодно с Семинаром."
10053100-76 = "Нашего президента ложно обвинили."
10053100-77 = "Семинар почувствовал угрозу из-за её талантов, поэтому «Старшая Сестра» вмешалась и уничтожила её репутацию."
10053100-79 = "...А, так вот твоя версия?"
10053100-80 = "«Версия»?! Это ясный и неоспоримый факт, который я лично вытащила из Старшей Сестры!"
10053100-81 = "Ага, конеееечно."
10053100-82 = "Ты же ни единому слову не веришь?!"
10053100-83 = ""
10053100-85 = ""
10053100-86 = "Здесь вопросы задаю я."
10053100-87 = "Например, не было ли СЛИШКОМ уж странно лезть на второй этаж лишь затем, чтобы посмотреть, как спит твоя подопечная?"
10053100-88 = "Хотя я понимаю, почему можно переживать за директора..."
10053100-89 = "...О чём ты?"
10053100-90 = "Ну, в ту ночь, когда мы тебя поймали. Разве ты не говорила, что была за окном?"
10053100-91 = "Когда я такое говорила?"
10053100-92 = "...?"
10053100-93 = ""
10053100-95 = ""
10053100-96 = "Мост был разрушен, и я нашла ваш домик — весь освещённый. Я подумывала постучать... А потом вы приоткрыли окно и закричали. Конечно, я убежала."
10053100-97 = "Но раз уж вспомнили. Я хотела вас спросить."
10053100-98 = "У вашего окна ТОЧНО стояла какая-то женщина. Кто она? С тех пор я её не видела."
10053100-99 = ""
10053100-101 = ""
10053100-102 = ""
10053100-103 = "...?"
10053100-104 = "Эм..."
10053100-106 = "Ува-а-а-а?!"
