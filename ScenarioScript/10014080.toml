[translation]
10014080-1 = "Эпизод 8; Кат Палуг, Запечатанный Зверь"
10014080-3 = "...На следующий день."
10014080-4 = "О, вы пришли, Сенсей."
10014080-5 = "Хи-хи. Я пришла раньше вас."
10014080-6 = "Я заметила, что вы всегда приходите намного раньше назначенного времени."
10014080-7 = "[s1] «Доброе утро, ранняя пташка.» \n[s2] «До встречи ещё очень много времени...»"
10014080-8 = "Ха-ха. Просто почему-то захотелось прийти первой."
10014080-9 = "Ха-ха. Просто почему-то захотелось прийти первой."
10014080-10 = "Мне стало немного интересно, насколько рано вы на самом деле приходите."
10014080-11 = "И время у меня всё равно было — благодаря вам."
10014080-12 = "...Спасибо, Сенсей. За всё."
10014080-13 = "[s3] «Ты выглядишь спокойнее, чем раньше.»\n[s4] «Теперь ты говоришь более расслабленно, Казуса.»"
10014080-14 = "Ну... да."
10014080-15 = "Ну... да."
10014080-16 = "До того как я пришла к вам, я вообще не знала, что делать."
10014080-17 = "Я дошла до такого отчаяния, что просьба о помощи казалась единственным выходом."
10014080-18 = "Честно говоря, временами я совсем не понимала вашего поведения. Мне было трудно вам доверять."
10014080-19 = ""
10014080-21 = ""
10014080-22 = "...Сенсей."
10014080-23 = "Вы ведь знали, что на самом деле только я могла исправить ситуацию."
10014080-24 = "Поэтому вы всё время приходили ко мне, а не к Рейсе. Верно?"
10014080-25 = "Почему вы просто не сказали мне? Вы лишь смотрели, как всё разваливается."
10014080-26 = "Надеюсь, я не перехожу границы, но мне правда любопытно."
10014080-27 = "«Всё зависит от того, как на это посмотреть,» или: «Доверяй людям вокруг себя»..."
10014080-28 = "Оглядываясь назад, мне просто нужно было самой себе это сказать."
10014080-29 = "[s5] «...Задним числом всё очевидно.»\n[s6] «Это нельзя было решить одними нравоучениями.»\n[s7] «Ты должна была сама во всём разобраться.»"
10014080-30 = "...Хм."
10014080-31 = "...Хм."
10014080-32 = "...Хм."
10014080-33 = "Я всё ещё пытаюсь уложить это в голове, но..."
10014080-34 = "Кажется, я начинаю понимать."
10014080-35 = "А?"
10014080-36 = "Что?"
10014080-37 = "Остался ещё один вопрос, на который я не ответила? Какой?"
10014080-38 = "А... Почему я перестала быть хулиганкой... Я вам не рассказывала?"
10014080-39 = ""
10014080-41 = ""
10014080-42 = "Наверное, после всего этого вам и правда интересно..."
10014080-43 = "На самом деле там ничего драматичного."
10014080-44 = "Простите, если разочарую, но причина довольно глупая."
10014080-45 = "Ладно, ладно. Если вы действительно хотите знать..."
10014080-46 = "Ну, просто..."
10014080-48 = "Это был обычный день. Я победила какую-то девчонку в большой драке и шла домой, довольная собой."
10014080-49 = "И тут, проходя мимо, я увидела одну девочку."
10014080-50 = ""
10014080-51 = ""
10014080-52 = "Она сидела в милом кафе, болтала с друзьями и ела торт с парфе."
10014080-53 = ""
10014080-54 = "Я даже не люблю такое... И парфе было с мятным шоколадом. Но она смеялась с друзьями и ела десерты."
10014080-55 = ""
10014080-56 = "Я как вкопанная остановилась. Даже не знаю почему."
10014080-57 = "Звучит глупо. В этом ведь не было ничего особенного."
10014080-58 = ""
10014080-59 = "Но в этом совершенно обычном моменте они выглядели довольными. Счастливыми. По ту сторону стекла словно было тепло."
10014080-60 = ""
10014080-61 = "И тогда я поняла, что даже не знаю, каково это."
10014080-62 = ""
10014080-64 = ""
10014080-66 = "После этого прозрения мне просто захотелось измениться."
10014080-67 = "...Я захотела стать такой же, как она. Вот и всё."
10014080-68 = ""
10014080-70 = "Наверное, я думала, что смогу испытать то же счастье, если буду жить так же, как она. Поэтому я и оказалась здесь."
10014080-71 = ""
10014080-73 = ""
10014080-74 = "Но я не верила, что заслуживаю этого, пока каким-то образом не сотру всё плохое, что натворила."
10014080-75 = "Может быть... это я сама раздула из всего этого такую проблему."
10014080-76 = "Мне ведь не обязательно быть точной копией той девочки. Наверное, я могу просто быть собой."
10014080-77 = "......?!"
10014080-78 = "...!"
10014080-79 = "...Хаха."
10014080-80 = "...Ладно, хорошо. Тут вы меня поймали."
10014080-81 = "Сенсей..."
10014080-82 = "...Взрослые иногда такие задиры."
10014080-83 = "[s8] «Я горжусь тобой. Пойдём обратно.»\n[s9] «Поздравляю. Твоя просьба выполнена!»"
10014080-84 = ""
10014080-85 = ""
10014080-87 = ""
10014080-89 = "...Ага."
10014080-90 = ""
