[translation]
1008506-1 = "Без кофеина"
1008506-2 = "Кемпинг неподалёку от Миллениума"
1008506-4 = ""
1008506-5 = "А, Сенсей. Добро пожаловать."
1008506-6 = "Я пришла пораньше и уже поставила походный стол и стулья."
1008506-7 = "[s1] «Что это за попытка отказаться от кофеина?»\n[s2] «Я думал, ты не любишь кемпинг?»"
1008506-10 = "Кемпинг — лишь небольшая часть задумки. Понимаете..."
1008506-11 = "Помните, как я пыталась стать цифровым кочевником? Работала на ноутбуке на улице и всё такое?"
1008506-12 = "Хотя идея полностью провалилась..."
1008506-13 = "Думаю, только потому, что тогда у меня началась ломка без энергетиков."
1008506-14 = "Я взяла с собой не так много энергетиков. Когда они стали заканчиваться, всё пошло всё хуже и хуже."
1008506-15 = "В этот раз я просто вообще не возьму энергетики. Не будет кофеина в организме — не будет и ломки."
1008506-16 = "[s3] «Не кажется, что резко бросать немного рискованно?»\n[s4] «Надеюсь, ты понимаешь, что делаешь, Харэ.»"
1008506-19 = "Конечно. Я просто немного поработаю офлайн на свежем воздухе. Ни магазинов, ни холодильников — соблазнов не будет."
1008506-20 = "...А если соблазн всё-таки появится. Не то чтобы он появится, но если вдруг..."
1008506-21 = ""
1008506-23 = ""
1008506-25 = ""
1008506-26 = "Я хочу, чтобы вы за мной присмотрели, Сенсей. Будете моим поручителем!"
1008506-27 = "[s5] «Без проблем.»\n[s6] «Я буду поддерживать тебя на каждом шагу!»"
1008506-30 = "Отлично, тогда начнём?"
1008506-36 = "Меньше чем через час..."
1008506-40 = ""
1008506-41 = "Эм..."
1008506-42 = "Я не могу сосредоточиться..."
1008506-43 = "Я миллион раз делала такую работу, но сегодня смотрю на неё и всё в голове путается. Постоянно отключаюсь."
1008506-44 = "...Кажется, у меня началась ломка."
1008506-45 = "[s] «Всего через час?»"
1008506-46 = "Унн... Нужно не думать об энергетиках... но от этого я только ещё больше думаю об энергетиках!"
1008506-47 = "Я справлюсь. Забудь о холодных вкусных энергетиках. Сосредоточься на работе!"
1008506-48 = "Нужно держаться. Я смогу!"
1008506-50 = "Харэ, как выяснилось, не смогла. Со временем ломка только усиливалась..."
1008506-51 = ""
1008506-54 = "...Пока она не свернулась в клубок, закрыв лицо руками и уже ничего не способная делать."
1008506-56 = "Угх... А-а-ах..."
1008506-57 = "Кофеин... Нужен кофеин..."
1008506-58 = "В голове абсолютно пусто. Есть только кофеин..."
1008506-59 = "Что мне делать, Сенсей?"
1008506-60 = "Ещё немного, и я начну думать, как напасть на соседний лагерь и украсть весь их кофе..."
1008506-61 = "[s] «Давай всё-таки не будем этого делать...»"
1008506-63 = "[ns] «Подожди секунду.»"
1008506-64 = ""
1008506-71 = "[ns] Передать ей кофе из термоса."
1008506-72 = ""
1008506-74 = ""
1008506-75 = "Спасибо, Сенсей..."
1008506-76 = ""
1008506-78 = ""
1008506-79 = ""
1008506-80 = "А-а-а... вот это то, что надо."
1008506-81 = "Сладкий, сладкий кофеин. Кажется, я сейчас просто растаю."
1008506-82 = "...Даже представить страшно, насколько жалко я сейчас выгляжу, Сенсей."
1008506-83 = "Столько говорила, а без кофеина не продержалась и нескольких часов."
1008506-84 = "Безнадёжно. Я никогда не избавлюсь от зависимости от энергетиков."
1008506-85 = "[s] «Нет, ты отлично справилась, Харэ.»"
1008506-87 = "[ns] «Кофе, который я тебе дал, был без кофеина.»"
1008506-88 = ""
1008506-90 = ""
1008506-91 = "А? В том кофе не было кофеина?"
1008506-92 = "Но после него мне стало легче. Настроение полностью поднялось."
1008506-93 = ""
1008506-95 = ""
1008506-96 = "...Я слышала, что в таких вещах психологический настрой очень важен."
1008506-97 = "А может, потому что это был кофе от Сенсея."
1008506-98 = "[s] «Как ты себя сейчас чувствуешь?»"
1008506-99 = ""
1008506-101 = ""
1008506-102 = "Немного лучше."
1008506-103 = "Ваш кофе без кофеина помог сильнее, чем я ожидала, Сенсей."
1008506-104 = "В следующий раз, когда увидите меня бродящей со стеклянным взглядом и умирающей без кофеина..."
1008506-105 = ""
1008506-107 = ""
1008506-109 = ""
1008506-110 = "Можете сварить мне чашечку?"
