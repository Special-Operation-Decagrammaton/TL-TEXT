[translation]
1006005-1 = "Дела Департамента горячих источников"
1006005-6 = "После ужина я отправился в общежитие принять душ."
1006005-7 = "Но вода оказалась ледяной, так что пришлось отказаться от этой идеи."
1006005-8 = ""
1006005-13 = "[ns1] «(Кто может звонить в такой час?)»\n[ns2] Ответить на звонок."
1006005-14 = ""
1006005-15 = ""
1006005-18 = ""
1006005-19 = "О! Ты ответил."
1006005-20 = "Сенсей! Ты там? Конечно там, раз ответил на телефон. Правда, Сенсей?"
1006005-21 = "[s3] «...Мэгу?»\n[s4] «Я здесь. Что случилось?»"
1006005-24 = "Некогда объяснять, Сенсей! Всё расскажу, когда приедешь. Пожалуйста, приходи скорее!"
1006005-25 = "Прямо сейчас! Быстрее! Мы очень спешим, ладно? Я пришлю тебе местоположение!"
1006005-26 = ""
1006005-28 = ""
1006005-32 = "[ns] «...?»"
1006005-35 = "Мэгу прислала мне маршрут к подножию горы недалеко от Шале."
1006005-45 = "Мне пришлось пробираться через лес, подальше от цивилизации и нормальных дорог, но в конце концов я добрался до нужного места."
1006005-46 = ""
1006005-51 = "[ns5] «...А.»\n[ns6] «Я точно пришёл куда нужно.»"
1006005-52 = ""
1006005-53 = ""
1006005-59 = "...! Сенсей! Это ты, Сенсей? Ты же, да?"
1006005-60 = "Сенсей, сюда! Сюда!"
1006005-61 = "[ns] Идти на голос."
1006005-62 = "Сенсей!!"
1006005-65 = "― О! Сенсей, вот ты где![wa:1660]"
1006005-67 = "― Я тебя ждала!"
1006005-70 = "― Ты был занят? Прости![wa:980]"
1006005-72 = "― Просто дело немного срочное!"
1006005-75 = "[ns7] «Мэгу...? Что всё это такое?»\n[ns8] «Горячий источник...? Ты его сделала?»"
1006005-76 = "― А, ага! Ага, я его сделала, но...[wa:590]"
1006005-77 = "― А, ага! Ага, я его сделала, но...[wa:590]"
1006005-79 = "― Проблема в том, что этот горячий источник долго не продержится.[wa:10]"
1006005-82 = "― Осталось всего несколько часов!"
1006005-84 = "― Поэтому я очень хотела, чтобы ты успел прийти сюда, пока он не высох![wa:10]"
1006005-87 = "― ...А? Ага...[wa:960]"
1006005-89 = "― Я сделала его сама. А что?"
1006005-92 = "― Ну, я же всё-таки из Департамента горячих источников![wa:10]"
1006005-95 = "― Моя работа — приносить[wa:750]"
1006005-97 = "― горячую воду тем, кому она нужна![wa:180]"
1006005-100 = "― И, эм..."
1006005-102 = "― Тебе особенно хочется помочь! Хи-хи![wa:1280]"
1006005-105 = "― Ну же! Не стесняйся![wa:680]"
1006005-107 = "― Залезай, вода отличная![wa:10]"
1006005-110 = "― Это суперособенный горячий источник, который я сделала специально для тебя![wa:10]"
1006005-113 = "Эй, Сенсей?"
1006005-114 = "Почему ты просто стоишь? Не хочешь залезть?"
1006005-115 = "Хочешь знать, сколько я над ним работала?"
1006005-116 = "Эм, не уверена... Наверное, начала сразу после нашего прошлого разговора..."
1006005-117 = "То есть с самого утра?"
1006005-118 = "...Эм, Сенсей?"
1006005-119 = "Что-то не так? Что случилось?"
1006005-120 = "...Я?"
1006005-121 = "Что? Разве не очевидно? Я просто испачкалась, пока всё это делала!"
1006005-122 = "Ахаха! Не переживай! Для участницы Департамента горячих источников это обычный рабочий день!"
1006005-123 = "Ну, тогда, наверное, можем залезть оба!"
1006005-124 = "Думаю, двое поместятся, хотя будет немного тесновато..."
1006005-125 = "...А, хочешь, чтобы я пошла первой?"
1006005-126 = "Хм... Но разве не странно, если первой им воспользуюсь я? Я ведь сделала его для тебя!"
1006005-127 = ""
1006005-129 = ""
1006005-130 = "Ну, раз ты так хочешь, значит, всё нормально. Источник ещё должен продержаться достаточно долго для нас обоих."
1006005-131 = "Тогда я сначала помоюсь! Подожди немного, ладно, Сенсей?"
1006005-132 = ""
1006005-134 = ""
1006005-137 = "Когда Мэгу вернулась, настала моя очередь, и я смыл дневную усталость в горячем источнике, который она сделала для меня."
1006005-138 = "Как и ожидалось от участницы Департамента горячих источников, это отлично освежило."
1006005-139 = ""
1006005-142 = "Обратно мы шли вместе, поедая Моримори."
