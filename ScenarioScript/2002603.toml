[translation]
2002603-1 = "Минори-поворот"
2002603-2 = "Библиотека Академии Красной Зимы"
2002603-3 = "По делам Шале я заглянул в библиотеку Академии Красной Зимы, надеясь найти административные записи."
2002603-4 = ""
2002603-9 = ""
2002603-10 = ""
2002603-12 = ""
2002603-13 = "Там я столкнулся с Минори. Она затерялась среди стеллажей и была полностью поглощена книгой."
2002603-14 = "Хм..."
2002603-15 = "[ns] «Минори?»"
2002603-16 = "О, Сенсей? Что вы делаете в библиотеке академии?"
2002603-17 = "Надеюсь, вы не ищете административные записи академии..."
2002603-18 = "Я бы не стала тратить время. Большинство архивов Академии Красной Зимы после каждого переворота цензурируют и переписывают, так что оригиналов осталось немного."
2002603-19 = "Возможно, больше повезёт в подборке Фронта освобождения знаний. Там почти всё сохранилось без изменений."
2002603-20 = "У них есть даже старые романы, которые давно не печатают. Так что если ищете конкретную книгу, стоит заглянуть туда."
2002603-21 = "[ns] «Спасибо за совет. Но что ты сама здесь делаешь, Минори?»"
2002603-22 = "Что я делаю. Здесь. В библиотеке."
2002603-23 = "Читаю книги. Я думала, это очевидно..."
2002603-24 = "Вы ведь не думаете, что я как та девчонка из Секретариата, которая прячется в библиотеке, потому что здесь удобно спать?"
2002603-25 = "[s1] «Прости! Я не хотел тебя обидеть.»\n[s2] «Просто когда я думаю о тебе, мне сразу вспоминаются тяжёлая работа и физический труд...»"
2002603-28 = "Наверное, у Трудовой партии действительно довольно суровый образ. Но чтобы хорошо работать, нужны хорошие манеры и образование."
2002603-29 = "И как мы должны понимать свои трудовые договоры, если плохо читаем?"
2002603-30 = "Поэтому мне важно регулярно читать. Как президенту Трудовой партии."
2002603-31 = "Когда я не работаю и не участвую в забастовках, я часто читаю здесь, в библиотеке. К тому же здесь теплее, чем в большинстве зданий кампуса."
2002603-32 = "[s] «Какие книги тебе нравится читать?»"
2002603-33 = "Ну, научная фантастика и эссе всегда заставляют меня задуматься. Но больше всего я люблю классовую литературу."
2002603-34 = "[s] «Классовую литературу?»"
2002603-35 = "Ну знаете. Литературу, написанную ради просвещения и освобождения рабочего класса! Литературу, которая агитирует против капиталистической элиты!"
2002603-36 = "Как работнице, мне это очень близко. А ещё она учит меня, как бороться с капиталистами!"
2002603-37 = "[s] «П-Понятно...»"
2002603-38 = "Книг так много, что трудно выбрать, но посмотрим... Мои любимые..."
2002603-39 = ""
2002603-41 = ""
2002603-42 = ""
2002603-44 = ""
2002603-47 = ""
2002603-48 = "«Лисица и журавль»."
2002603-49 = "[s] «Эм... Это же Эзоп, верно?»"
2002603-50 = "А, вы знаете эту историю! Ну, она есть в библиотеке почти каждой школы, так что неудивительно."
2002603-51 = "Это классика партизанской литературы, где журавль из рабочего класса с помощью смекалки поднимает революцию против хитрой лисы-капиталиста."
2002603-52 = "Лиса обещает поделить еду поровну, но подаёт её на плоской тарелке, из которой журавль не может есть, тем самым присваивая ресурсы себе..."
2002603-53 = "[s] «Разве там всё было именно так...?»"
2002603-54 = "Да, именно так."
2002603-55 = "Но журавль делает выводы, понимаете? Поэтому, когда лиса приходит к нему домой, он подаёт ужин в узком кувшине. Лиса не может добраться до еды, и победа остаётся за журавлём!"
2002603-56 = "Это ведь басня. Мораль в том, что нужно заманить врага в среду, где преимущество будет на твоей стороне!"
2002603-57 = "[ns] «(Не думаю, что Эзоп имел в виду именно это...)»"
2002603-58 = "Что ещё... О, точно, «Три поросёнка»!"
2002603-59 = ""
2002603-61 = ""
2002603-62 = "Эта книга обязательна к прочтению для любого строителя. В ней разбираются правила безопасности на объекте на примере двух случаев провала и одного успешного."
2002603-63 = "Первый и второй поросята проигнорировали строительные нормы и использовали дешёвые материалы, поэтому их дома рухнули от сильного ветра! А третий поросёнок использовал одобренные материалы, и его дом оказался безопасным."
2002603-64 = "Конечно, было бы лучше, если бы он сначала сделал каркас из арматуры и бетона..."
2002603-65 = "Но это детская сказка, так что ей можно простить недостаток технических подробностей."
2002603-66 = "[s] «Это, эм, очень великодушно с твоей стороны...»"
2002603-67 = "Ах, и нельзя забывать про «Северный ветер и солнце»!"
2002603-68 = "Ветер и солнце вступают в сговор, чтобы отобрать плащ у бедного путника, сочетая жёсткие и мягкие методы, — прямо как капиталистический класс разделяет рабочих и заставляет их бороться друг с другом!"
2002603-69 = "Мораль в том, что работница никогда, ни при каких обстоятельствах не должна терять бдительность и обязана всегда сохранять боевой дух—"
2002603-71 = "Я слушал уникальные трактовки старых басен от Минори, пока солнце не опустилось низко над горизонтом..."
