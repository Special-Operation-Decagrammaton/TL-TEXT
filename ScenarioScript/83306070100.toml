[translation]
83306070100-5 = ""
83306070100-6 = "А, глава префектов. Вы здесь."
83306070100-7 = "Что произошло? Пострадавших довольно много."
83306070100-8 = "А... Ничего серьёзного. Просто во время обычного патруля Префектурной команды мы столкнулись с нарушителями."
83306070100-9 = "Многие члены Префектурной команды получили травмы, включая Иори."
83306070100-10 = "Даже Иори...? Сопротивление было настолько серьёзным?"
83306070100-11 = "Нет, я бы так не сказала. У большинства лишь царапины..."
83306070100-12 = "Но во время боя с нарушителями Иори провалилась в канализацию."
83306070100-14 = "Откуда я должна была знать, что там дыра?!"
83306070100-15 = ""
83306070100-16 = ""
83306070100-17 = "...Да, звучит как одна из её обычных катастроф."
83306070100-18 = "Сэна из Клуба неотложной помощи сейчас недоступна, поэтому одной мне понадобится время, чтобы обработать всех..."
83306070100-19 = "Тогда я помогу."
83306070100-21 = "Спасибо за помощь, глава префектов."
