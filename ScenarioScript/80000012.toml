[translation]
80000012-1 = "Застрявшие в городе"
80000012-2 = "По дороге в старшую школу Абидоса по делам Шале я вышел не на той станции."
80000012-3 = ""
80000012-10 = "Я свернул на улицу, которая показалась знакомой, но снова умудрился заблудиться посреди района..."
80000012-12 = "Жилой район Абидоса"
80000012-16 = "..."
80000012-17 = "Сенсей?"
80000012-18 = "Что ты делаешь так далеко? Это вообще не дорога к школе."
80000012-19 = "[s] Объяснить Широко, что произошло."
80000012-20 = "То есть ты вышел не на той станции и заблудился, пока бродил вокруг?"
80000012-21 = "Понятно. В районе Абидоса много заброшенных станций."
80000012-22 = "Если выйти не там, понять, куда идти, действительно сложно."
80000012-23 = "В такой ситуации лучше всего сохранять спокойствие и идти в одном направлении."
80000012-24 = "Если пройти 50 километров в любую сторону, рано или поздно снова доберёшься до цивилизации."
80000012-25 = "[s] «Ты говоришь так, будто 50 километров — это не безумно далеко...»"
80000012-26 = "Хм. Разве?"
80000012-27 = "В любом случае теперь тебе не о чем беспокоиться."
80000012-28 = "Я знаю эти улицы как свои пять пальцев.#nЯ покажу дорогу."
80000012-29 = "Что? Не можешь идти, потому что ноги ослабли?"
80000012-30 = "Это... типичный симптом низкого сахара в крови."
80000012-31 = "Кажется, у меня есть что-то съедобное."
80000012-32 = ""
80000012-34 = ""
80000012-36 = "Вот. Шоколадный протеиновый батончик."
80000012-37 = "Я собиралась съесть его во время велопоездки, но можешь взять."
80000012-38 = "[s] Взять протеиновый батончик."
80000012-39 = ""
80000012-42 = "..."
80000012-43 = "Это очень напоминает нашу первую встречу."
80000012-44 = "Тогда я дала тебе свой энергетик после того, как ты несколько дней блуждал."
80000012-45 = "[s] «Я всё глубже залезаю к тебе в долги, да?»"
80000012-46 = "Не совсем. Мне кажется, ты делаешь для меня гораздо больше, чем я для тебя."
80000012-47 = "Я могу лишь понемногу отплачивать такими мелочами."
80000012-48 = "И я рада, когда могу хоть чем-то быть тебе полезной."
80000012-49 = "[s] «Я полагаюсь на тебя гораздо сильнее, чем ты думаешь.»"
80000012-50 = "В таком случае..."
80000012-51 = "...надеюсь, ты и дальше будешь на меня полагаться, Сенсей."
80000012-55 = "Благодаря Широко я в итоге добрался до старшей школы Абидоса."
