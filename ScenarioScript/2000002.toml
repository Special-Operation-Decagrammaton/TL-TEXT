[translation]
2000002-1 = "Зови меня мастером"
2000002-2 = "Исполнительный офис Шале"
2000002-7 = "(Мой телефон сломан.)"
2000002-8 = "[s1] Отнести в ремонтную мастерскую.\n[s2] Навсегда отказаться от общения."
2000002-9 = "Оба варианта так себе."
2000002-10 = "Оба варианта так себе."
2000002-11 = "Что случилось, Сенсей? Генеральный студсовет прислал мне заявку, так что я была неподалёку."
2000002-12 = "Какую заявку? Да обычное техобслуживание оборудования."
2000002-13 = "Некоторые устройства, которыми пользуется Генеральный студсовет, изначально принадлежали Миллениуму."
2000002-14 = "Но здесь, похоже, никто не понимает, как они работают."
2000002-15 = "В любом случае, с телефоном всё будет нормально, не переживай."
2000002-16 = "То есть я могу тебе помочь."
2000002-17 = ""
2000002-18 = "И превратить его во что-нибудь поинтереснее обычного скучного телефона."
2000002-20 = "Я из Инженерного отдела! В Миллениуме никто не разбирается в технике лучше нас."
2000002-21 = "Поэтому мы с гордостью называем себя мастерами!"
2000002-22 = "Итак, если посмотреть на твой телефон..."
2000002-23 = "...похоже, во время зарядки ты перегрузил материнскую плату."
2000002-24 = "Если заменить конденсатор, всё должно заработать..."
2000002-25 = "...но раз уж мы здесь, почему бы не сделать ещё кое-что?"
2000002-26 = ""
2000002-28 = "Хм... Как насчёт системы самоуничтожения?"
2000002-29 = "[s3] «Идеально!»\n[s4] «Зачем мне это нужно?»"
2000002-30 = "Вот именно! Сейчас же займусь."
2000002-31 = "А... Точно."
2000002-32 = "Я только что вспомнила, что нам запретили делать системы самоуничтожения..."
2000002-33 = "*вздох* У нашего клуба непростое прошлое, а за некоторыми членами тянется длинный шлейф историй."
2000002-34 = "Но на то были причины. Наш клуб постоянно ищет новые способы развиваться."
2000002-35 = "Так что извини. Похоже, прежде чем добавить тебе такую функцию, придётся получить разрешение сверху."
2000002-36 = "Но оставим это. Сенсей... Наверняка ты думаешь, зачем телефону вообще самоуничтожение, особенно сразу после ремонта."
2000002-37 = "Подумай."
2000002-38 = "В твоём телефоне полно важной информации — такой, которой нет даже на других твоих устройствах."
2000002-39 = "Например, личные данные, связанные с твоей личностью."
2000002-40 = "Что может защитить их лучше встроенной системы самоуничтожения? Всё просто."
2000002-41 = "Что? Думаешь, самоуничтожение противоречит самой идее защиты?"
2000002-42 = "Зато телефон сможет заодно работать как бомба или граната, если понадобится!"
2000002-43 = "Ладно-ладно. Видимо, заставить тебя увидеть очевидное я не могу."
2000002-45 = "Вот. Телефон починен."
2000002-46 = "..."
2000002-47 = "Теперь должен работать нормально."
2000002-48 = "Звони, если телефон или другая электроника снова начнут барахлить."
2000002-49 = "Буду рада помочь."
