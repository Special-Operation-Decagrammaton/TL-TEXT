[translation]
84305300100-6 = ""
84305300100-8 = ""
84305300100-9 = "Н-Нэру...?!"
84305300100-10 = "...Ц. У нас гости."
84305300100-11 = "Гости...?"
84305300100-12 = ""
84305300100-16 = "О, как же приятно снова вас видеть! Вы оказали мне огромную услугу."
84305300100-17 = ""
84305300100-20 = ""
84305300100-22 = ""
84305300100-23 = "Легендарная Комната Старшей Сестры. Ого, она и правда настолько впечатляющая, как я слышала! Я не эксперт, но даже мне это понятно."
84305300100-24 = "Место вроде невидимой руки или глаз бога... способное наблюдать и манипулировать всем... абсолютно всем в Миллениум!"
84305300100-25 = "И спрятано оно было о-очень хорошо. Поверьте, я ПЫТАЛАСЬ найти его самостоятельно."
84305300100-26 = "Но благодаря вашему активному содействию мы наконец здесь! Даже не знаю, как вас отблагодарить!"
84305300100-27 = "Содействию...? О чём ты?"
84305300100-28 = "Ты не могла найти это сама...?"
84305300100-29 = ""
84305300100-31 = ""
84305300100-32 = "*вздох* Я поняла."
84305300100-33 = "Всё было ради этого. Все происшествия до этого момента... Всё."
84305300100-34 = "О, отлично, быстро соображаете! Сэкономили мне целый монолог."
84305300100-35 = "...?? О чём вы говорите? Что она задумала?"
84305300100-36 = "Нас провели. Всё это было уловкой."
84305300100-37 = "Все происшествия на Экспо. Все случайные акты вандализма и саботажа."
84305300100-38 = ""
84305300100-40 = ""
84305300100-41 = "Всё это было нужно, чтобы вынудить нас прийти сюда."
84305300100-43 = "...!!"
84305300100-45 = "Ч-Что?! Хочешь сказать...?"
84305300100-46 = "Да. Придя сюда, мы дали ей именно то, чего она хотела с самого начала."
84305300100-47 = "Эту комнату. А точнее — то, что находится внутри: Алгоритм Старшей Сестры."
84305300100-48 = "Хотя это всё ещё не объясняет, кто она такая."
84305300100-49 = ""
84305300100-52 = ""
84305300100-53 = "О, я разве не представилась? Простите, совсем вылетело из головы!"
84305300100-54 = "Меня... зовут Мирай. Бывший президент Клуба псевдонауки Миллениум."
84305300100-55 = ""
84305300100-58 = ""
84305300100-59 = "Клуб псевдонауки...?"
84305300100-60 = "Мирай...?"
84305300100-62 = "Именно. А президент студсовета Цукацуки Рио, с которой вы сейчас работаете..."
84305300100-63 = "...нас с ней связывает прошлое."
84305300100-64 = ""
84305300100-67 = ""
84305300100-68 = "...Что?"
84305300100-69 = "С Рио...?"
84305300100-71 = "Что?"
84305300100-72 = "Фуфу... О, Рио, только не строй теперь невинность."
84305300100-73 = "Ты стёрла весь мой клуб с доски, и меня вместе с ним."
84305300100-74 = "Я ждала этого дня."
84305300100-75 = "Ждала возможности отплатить тебе за то, что ты захватила Миллениум, запятнала моё имя, уничтожила наш бизнес..."
84305300100-76 = ""
84305300100-78 = ""
84305300100-79 = "..."
84305300100-80 = "..."
84305300100-81 = "..."
84305300100-82 = ""
84305300100-84 = ""
84305300100-85 = "Нет, серьёзно, что? Я тебя вообще не помню."
84305300100-86 = ""
84305300100-88 = ""
84305300100-89 = "...Вот как?"
84305300100-90 = "Я понятия не имею, кто ты. У меня никогда не было к тебе злых намерений, и я не пыталась тебе мешать. Похоже, произошло недоразумение."
84305300100-91 = ""
84305300100-93 = ""
84305300100-94 = "Ч-Что значит «понятия не имеешь»?! Как ты можешь так говорить?! Ты знаешь, КАК ТЯЖЕЛО мы боролись за право нашего клуба существовать?!"
84305300100-95 = "Ты забрала ВЕСЬ бюджет нашего клуба! Постоянно рушила все наши проекты!!"
84305300100-96 = "Я...? Какие проекты?"
84305300100-97 = "Ты СЕРЬЁЗНО спрашиваешь?! Мне ещё по буквам тебе всё разжевать?!"
84305300100-98 = ""
84305300100-100 = ""
84305300100-102 = "Проект «Вода знает». Проект «Сила пирамид». Наклейка электромагнитной защиты. Ты остановила ВСЁ это!!"
84305300100-103 = ""
84305300100-106 = ""
84305300100-108 = ""
84305300100-110 = "Единственное, что нам удалось хоть как-то выпустить, — германиевый браслет. Мы ОБАНКРОТИЛИСЬ из-за тебя!!"
84305300100-112 = "Сила пирамид? Защитная наклейка? Что?"
84305300100-113 = "...Кажется, я понимаю. Это была псевдонаука ИМЕННО такого рода. Мошенничество с правдоподобно звучащими научными терминами ради прибыли на людях, которые в них не разбираются."
84305300100-114 = "Хм? Так это же просто мошенничество, разве нет?"
84305300100-115 = "Да. Именно."
84305300100-117 = "«Мошенничество»?! Это просто области науки, которые ПОКА не доказаны!! Ух, вот поэтому я и не разговариваю с учёными!!"
84305300100-118 = "От твоего высокомерия частицы воды в моём теле искажаются от ярости, слышишь меня?!"
84305300100-119 = "Слышу, но не понимаю."
84305300100-120 = "Ну, по крайней мере теперь понятно, почему Рио их остановила."
84305300100-121 = "...А. Верно. Да, я действительно ввела определённую политику, которая мешала бы вам. Теперь понимаю."
84305300100-122 = "Ещё раз прошу прощения, если возникло недоразумение. Но, Мирай, я должна поправить тебя в одном моменте."
84305300100-123 = ""
84305300100-125 = ""
84305300100-126 = "В каком ещё «моменте»?"
84305300100-127 = "Во-первых, если что-то «ещё не доказано», настоящий учёный пытается это доказать. А если хочешь финансирование исследований или разработки, сначала нужно представить правдоподобную гипотезу."
84305300100-128 = "И это финансирование предназначено ИМЕННО для научных исследований, а не для производства или продажи товаров за пределами школы."
84305300100-129 = "Мы исследовательское учреждение, а не бизнес-конгломерат."
84305300100-131 = "Ага, если так сказать..."
84305300100-132 = "...то я понимаю на все сто."
84305300100-134 = "Ух, ты вообще ни капли не изменилась с тех пор, как разрушила нас!"
84305300100-135 = "Ладно, хорошо! Я и так знала, что ты меня не станешь слушать!"
84305300100-136 = "Но ничего. Мне всего лишь нужно забрать этот Алгоритм Старшей Сестры и продать тому, кто заплатит больше всех!"
84305300100-137 = "Нет, я не могу этого позволить. Он слишком опасен."
84305300100-138 = "Мы вообще пришли сюда только затем, чтобы его уничтожить."
84305300100-139 = "О, какая уверенность! Интересно, надолго ли её хватит."
84305300100-141 = "То же самое могу сказать о тебе. Ты вообще понимаешь, с кем связалась?"
84305300100-142 = "Ты правда собираешься справиться со мной..."
84305300100-143 = ""
84305300100-145 = ""
84305300100-146 = "...этой жалкой маленькой шайкой?"
84305300100-147 = "...!! У-Ух. Микамо Нэру..."
84305300100-148 = ""
84305300100-150 = ""
84305300100-151 = "Фуфу, но для тебя я уже приготовила кое-что ещё. Ты же не думала, что мы просто полезем на тебя в лоб, как идиоты?"
84305300100-152 = "Что?"
84305300100-153 = ""
84305300100-155 = ""
84305300100-156 = "...Та-дам!"
84305300100-157 = "Видишь это? Нажму кнопку — и позову всех наших людей, разбросанных по всему залу Экспо."
84305300100-158 = "Одно слово — и даже сейчас мы можем превратить Миллениум Expo в бардак исторического масштаба!! Жалко будет, правда? Разрушить отношения с Тринити после всех усилий, которые ушли на организацию?"
84305300100-159 = "...Ты!"
84305300100-160 = "Серьёзная угроза. Ты всё очень тщательно продумала."
84305300100-161 = "Фуфу, теперь понимаете, с кем имеете дело. Но не волнуйтесь. Пока не сделаете глупостей, это устройство будет тихонько лежать у меня."
84305300100-162 = "А теперь стойте смирно. Мне понадобится всего пара минут, чтобы извлечь оборудование алгоритма."
84305300100-163 = "Ты не понимаешь, что делаешь..."
84305300100-164 = "...но КАК ты вообще узнала об этом месте? О нём не должен знать никто, кроме меня."
84305300100-165 = "Фуфу, вот почему полезно разбираться в бизнесе! У нас был спонсор."
84305300100-166 = ""
84305300100-168 = ""
84305300100-169 = "Спонсор? Кто...?"
84305300100-171 = "Рио, мы можем что-нибудь сделать?"
84305300100-172 = "...Нет. Ничего."
84305300100-173 = ""
84305300100-175 = ""
84305300100-177 = ""
84305300100-178 = ""
84305300100-179 = "...Ха."
84305300100-180 = "Ладно, хватит этой чепухи."
84305300100-181 = ""
84305300100-184 = ""
84305300100-185 = "Нэру...?"
84305300100-186 = ""
84305300100-188 = ""
84305300100-189 = ""
84305300100-190 = ""
84305300100-191 = "А? Чт...?"
84305300100-192 = ""
84305300100-194 = ""
84305300100-195 = ""
84305300100-196 = "Ч-Что ты—?! Не подходи!"
84305300100-197 = ""
84305300100-199 = ""
84305300100-200 = "Я сказала стой!! Стой на месте!! Я это сделаю! Думаешь, не решусь?!"
84305300100-201 = ""
84305300100-203 = ""
84305300100-204 = "О, думаешь, я блефую? Ну тогда давай прямо сейчас—"
84305300100-206 = "Делай."
84305300100-207 = ""
84305300100-209 = ""
84305300100-210 = "А?"
84305300100-211 = ""
84305300100-213 = ""
84305300100-215 = ""
84305300100-216 = "Ты слышала. Делай. Эта твоя штука для связи? Давай. Нажимай кнопку."
84305300100-217 = "Нэру...!!"
84305300100-218 = "Нэру, это же...!!"
84305300100-220 = "Я-я правда это сделаю!! По-настоящему!! Ты уверена, что хочешь этого?!"
84305300100-222 = "Хватит тратить моё время и уже нажми."
84305300100-223 = ""
84305300100-226 = ""
84305300100-228 = "Нэру!!"
84305300100-229 = "Что?"
84305300100-230 = ""
84305300100-232 = "(Почему...? Она настолько злится, что не может нормально думать?)"
84305300100-233 = "(Нет, Нэру бы не потеряла голову в такой момент.)"
84305300100-234 = "(Тогда... может быть...?)"
84305300100-237 = "Ха, ха...!! Л-Ладно, раз ты настаиваешь! Надеюсь, ты готова!"
84305300100-238 = ""
84305300100-240 = ""
84305300100-241 = "Алло? Это я! Слышите меня? Все на позициях?"
84305300100-242 = "Начинайте..."
84305300100-243 = ""
84305300100-245 = ""
84305300100-246 = "...?? А?"
84305300100-248 = "Что за помехи...?"
84305300100-249 = ""
84305300100-253 = "...атакуют...!"
84305300100-254 = ""
84305300100-256 = ""
84305300100-259 = "Нас атакуют! На нас устроили засаду!! Нас выбили из всех укрытий...!"
84305300100-260 = "Эм..."
84305300100-261 = "...Что?!"
84305300100-262 = ""
84305300100-265 = "C&C...! Здесь C&C!!"
84305300100-266 = "C&C...?"
84305300100-267 = "Н-Не может быть! Микамо Нэру, ты...!"
84305300100-269 = "Все! Все остальные уже...!"
84305300100-270 = "Это ловушка, всё это ловушка!"
84305300100-273 = "Ловушка...? Все остальные?"
84305300100-274 = "Ч-Что вообще происходит...?"
84305300100-275 = ""
84305300100-277 = ""
84305300100-278 = "Только не говорите..."
84305300100-279 = "...Нэру!"
84305300100-280 = "Микамо Нэру, ты всё это спланировала...?"
84305300100-281 = ""
84305300100-283 = ""
84305300100-285 = "Ну..."
84305300100-286 = "...так уж получилось."
84305300100-287 = "В отличие от некоторых, я люблю действовать гибко."
84305300100-288 = "Так что когда происходит что-то настолько крупное..."
84305300100-289 = "...как я могла не подключить Сенсея?"
84305300100-290 = ""
84305300100-293 = ""
84305300100-294 = "*ворчит*"
84305300100-295 = "А...! Тогда зачистка, которую сейчас проводит C&C..."
84305300100-296 = "Ею руководит Сенсей?"
84305300100-297 = "Как..."
84305300100-298 = "Как давно...?"
84305300100-300 = "Кажется, с того момента, как ты впервые подошла ко мне и заговорила во время подготовки к Экспо."
84305300100-301 = "Это было больше двух недель назад!"
84305300100-302 = "Я никому больше не рассказывала, если тебя это беспокоит. Решила, что Сенсей умеет хранить секреты."
84305300100-303 = ""
84305300100-306 = "..."
84305300100-307 = "Так вот почему Сенсей встал на мою сторону, когда я разговаривала с Нагисой..."
84305300100-308 = "Всё было продумано ещё тогда..."
84305300100-310 = "О чём вы говорите?! Да о чём вы вообще говорите?!"
84305300100-311 = "Да не забивай голову деталями. Всё, что тебе нужно знать..."
84305300100-312 = ""
84305300100-314 = ""
84305300100-316 = "...тебе конец."
84305300100-317 = ""
84305300100-320 = ""
