[translation]
10039150-1 = "Послесловие;Экстравертная выставка"
10039150-2 = "Я пришёл в Центр искусств, где проходила выставка."
10039150-3 = ""
10039150-6 = "Вокруг Центра было очень тихо."
10039150-9 = "Рядом с произведениями искусства царила спокойная атмосфера."
10039150-10 = ""
10039150-13 = "[ns] «Ого, это же...»"
10039150-16 = "[ns] «Нагиса?»"
10039150-17 = ""
10039150-21 = "Сенсей...?"
10039150-22 = ""
10039150-28 = "Здравствуйте, Сенсей."
10039150-29 = "Что привело вас сюда...?"
10039150-30 = "[s] «Я услышал о выставке и решил заглянуть.»"
10039150-31 = "Хи-хи, добро пожаловать. Я организатор этой выставки."
10039150-32 = "И вы пришли очень вовремя. Как раз сейчас я свободна."
10039150-33 = "[s] «О, так ты организатор? Не знал, что ты интересуешься искусством.»"
10039150-34 = "Я здесь ещё и куратор. Позвольте объяснить замысел и значение этой работы."
10039150-37 = "Нагиса дала подробное объяснение."
10039150-40 = "...Так что помимо работ, принадлежащих Чаепитию, здесь выставлено и несколько моих собственных. Шедеврами я бы их не назвала, но они здесь."
10039150-41 = "[s] «Ты сама это нарисовала? Потрясающе!»"
10039150-42 = "О, уверяю вас, до потрясающего им далеко."
10039150-43 = ""
10039150-45 = ""
10039150-46 = ""
10039150-47 = "Хотя... студент «Дикой охоты», которая заходил раньше, дал им весьма лестную оценку."
10039150-48 = "...А поскольку она студент «Дикой охоты», она наверняка хорошо разбирается в искусстве. Её эстетический вкус должен быть очень развит."
10039150-49 = "Могу лишь предположить, что она хвалила выставку в целом, а не какую-то отдельную работу... но её слова всё же имеют вес. По крайней мере, мне хотелось бы в это верить."
10039150-50 = ""
10039150-52 = ""
10039150-53 = "..."
10039150-54 = "Ах..."
10039150-55 = "...Хи-хи... Простите, я увлеклась."
10039150-56 = "Я не хочу говорить с вами настолько окольными путями, Сенсей. Похоже, от этой привычки мне трудно избавиться..."
10039150-57 = "[s1] «Всё в порядке.»\n[s2] «Тебе просто хотелось немного похвастаться, да?»"
10039150-60 = "Эм..."
10039150-61 = "...Да, пожалуй."
10039150-62 = "Получить похвалу эксперта в области, в которой я хочу преуспеть, оказалось для меня очень значимым."
10039150-63 = "На самом деле это даже воодушевляет."
10039150-64 = "Я почувствовала, что меня признали, заметили."
10039150-65 = "[s] «Мне знакомо это чувство. Оно очень приятное.»"
10039150-66 = "Хи-хи... Обычно я, конечно, не бываю настолько откровенной."
10039150-67 = "Но рядом с вами мне легко расслабиться, Сенсей."
10039150-68 = ""
10039150-70 = ""
10039150-71 = "..."
10039150-72 = "Раз уж я СЕГОДНЯ откровенна, можно поделиться ещё кое-чем?"
10039150-73 = "[s3] «Я только за.»\n[s4] «Тем более здесь тихо и спокойно. Продолжай.»"
10039150-76 = "Хи-хи... Хорошо."
10039150-81 = "Изначально этой выставки не было в планах Карнавала."
10039150-82 = "Идея пришла мне во время одного из совещаний с остальными членами Чаепития."
10039150-83 = "Я размышляла, какими должны быть цели Карнавала, какую пользу — материальную и нематериальную — мы можем получить. Какие политические результаты это принесёт."
10039150-84 = "И вдруг меня осенило."
10039150-85 = "Я подумала, что... могу насладиться Карнавалом как обычный студент Тринити."
10039150-86 = "..."
10039150-87 = "Поэтому я отложила всё, что планировала до этого, и предложила мероприятие, которое лично мне хотелось попробовать. Хотя бы раз."
10039150-88 = "[s] «И этим мероприятием стала эта выставка.»"
10039150-89 = "Хи-хи. Именно."
10039150-90 = ""
10039150-92 = ""
10039150-93 = "Мне хотелось поделиться всеми этими эмоциями и художественным вдохновением с другими студентами."
10039150-94 = "Жаль только, что посетителей так мало. Интересно, почему..."
10039150-95 = "[s] «(Ох... Хм...)»"
10039150-97 = "[ns] «В-Всё будет хорошо. Уверен, совсем скоро придёт ещё много студентов.»"
10039150-98 = "Надеюсь, но..."
10039150-99 = "Уже одного того, что вы пришли посмотреть, для меня достаточно!"
10039150-100 = "[s] «Ты хорошо постаралась, Нагиса.»"
10039150-101 = ""
10039150-103 = ""
10039150-104 = "[ns5] «Ты не только член Чаепития, но и отдельный студент.»\n[ns6] «И я хочу поддерживать обе эти стороны тебя.»"
10039150-105 = ""
10039150-106 = ""
10039150-108 = ""
10039150-109 = "...Что ж, снова, как и всегда..."
10039150-110 = ""
10039150-112 = ""
10039150-113 = ""
10039150-114 = "Спасибо, Сенсей."
10039150-115 = "Я всегда буду дорожить вашей поддержкой и помнить о ней."
10039150-116 = "[s] «Не я один здесь за тебя болею.»"
10039150-117 = ""
10039150-119 = ""
10039150-120 = "О? Что вы имеете в виду...?"
10039150-121 = ""
10039150-126 = "Ха-ха-ха, посмотрите сюда. Десерты повсюду!"
10039150-127 = "Именно этого и ожидаешь от Нагисы."
10039150-128 = ""
10039150-130 = ""
10039150-131 = "Ох, не может быть..."
10039150-132 = ""
10039150-134 = ""
10039150-136 = ""
10039150-137 = "Эй, Наги! У тебя есть минутка? Я услышала о выставке, так что мы с Сейей пришли посмотреть! ☆"
10039150-138 = "Здорово, что всё это только для нас. ...Хотя для тебя, наверное, это не так уж здорово."
10039150-140 = "Мика, Сейя..."
10039150-142 = "[ns] «Привет вам обеим!»"
10039150-143 = ""
10039150-145 = ""
10039150-146 = "Сенсей?"
10039150-147 = "Здравствуйте, Сенсей."
10039150-148 = "Я слышала, что вы пришли на Карнавал. Не ожидала встретить вас здесь."
10039150-149 = "Хм? Когда ты это услышала? Я до сих пор ничего такого не слышала..."
10039150-151 = "Вы обе пришли... посмотреть мою выставку?"
10039150-153 = "Это была идея Мики. Она сказала, что твоя выставка наверняка скучная и почти никто не придёт, так что хотя бы нам стоит показаться ради тебя."
10039150-154 = "Эй, я не так это сказала..."
10039150-156 = "Ах... Значит, вот о чём ты думала, Мика..."
10039150-157 = "[s] «Как бы там ни было, они обе всё-таки пришли поддержать тебя.»"
10039150-158 = ""
10039150-160 = ""
10039150-161 = "Ну... это правда."
10039150-162 = "Ха-ха-ха, именно, Наги! Поблагодаришь нас потом!"
10039150-163 = "..."
10039150-164 = "Раз уж сегодня я делюсь своими чувствами..."
10039150-165 = ""
10039150-167 = ""
10039150-168 = ""
10039150-170 = "Я искренне благодарна, что вы пришли. Обе."
10039150-171 = ""
10039150-174 = ""
10039150-175 = "Хм?"
10039150-176 = "Ох."
10039150-178 = "На самом деле, кажется, сегодня я кое-чему научилась — быть честнее с самой собой."
10039150-179 = "Что ж, я как раз собиралась провести Сенсею экскурсию. Хотите присоединиться?"
10039150-180 = ""
10039150-183 = ""
10039150-184 = ""
10039150-185 = "Конечно! Давай, Наги, рассказывай нам всё!"
10039150-186 = "Искренняя благодарность, а потом ещё и личная экскурсия от самой Наги? Какой особенный день!"
10039150-187 = ""
10039150-189 = ""
10039150-191 = ""
10039150-192 = "[ns] «Веди нас, Нагиса.»"
10039150-193 = "Кхм..."
10039150-194 = ""
10039150-196 = ""
10039150-197 = "Все, пожалуйста, посмотрите налево..."
10039150-199 = "Как только Нагиса закончила экскурсию, один за другим начали заходить новые посетители."
10039150-200 = "В целом выставка имела большой успех."
10039150-201 = ""
10039150-204 = "Сейе и Мике довольно быстро стало скучно, но Нагиса выглядела очень счастливой, рассказывая им об искусстве."
