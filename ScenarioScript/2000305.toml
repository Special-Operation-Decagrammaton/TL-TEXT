[translation]
2000305-1 = "Испытание снайпера. Часть 1"
2000305-2 = "Крыша здания"
2000305-3 = "Говорят, снайпер — солдат, который ждёт своего шанса. Ни для кого терпение не является такой важной добродетелью, как для снайпера."
2000305-4 = "Выбрав цель, нельзя сдвинуться ни на сантиметр, пока враг не войдёт в линию огня."
2000305-5 = "Какие бы соблазны или неудобства ни пришлось терпеть!"
2000305-6 = "[s] «Даже если проголодаешься?»"
2000305-7 = "Конечно. Во время заданий мне уже не раз приходилось пропускать приёмы пищи."
2000305-8 = "[s] «Даже представить не могу. Ты невероятная, Маширо.»"
2000305-9 = "Не думаю, что это что-то невероятное. Это просто часть работы."
2000305-10 = "Я бы даже не стала называть себя «невероятной»."
2000305-11 = "На самом деле во время задания есть одна вещь, которая испытывает даже моё терпение."
2000305-12 = "[s] «Что это?»"
2000305-13 = "Эм... насекомые."
2000305-14 = "[s] «Насекомые?»"
2000305-15 = "Теперь, когда стало теплее, на территории школы и на крыше стало больше насекомых. Когда я занимаю позицию, они ползают по моим рукам."
2000305-16 = "Ощущение жуткое, и они мешают прицеливаться."
2000305-17 = "[s] «А нельзя их просто согнать?»"
2000305-18 = "Конечно нет! На позиции нужно контролировать каждое движение — даже дыхание. Несколько насекомых не оправдывают потерю концентрации."
2000305-19 = "Для хорошего снайпера это было бы позором!"
2000305-20 = "Но я пока недостаточно натренировалась, чтобы они совсем меня не отвлекали."
2000305-21 = "Поэтому я и хотела попросить вас о помощи."
2000305-22 = "[s] «Меня? А что я могу сделать?»"
2000305-23 = "Я буду стоять неподвижно и постараюсь сохранять самообладание. А вы щекочите меня так, как это делают насекомые."
2000305-24 = "Хорошо. Я готова в любой момент."
2000305-25 = "*вдох*"
2000305-26 = ""
2000305-27 = ""
2000305-28 = "[s] Пощекотать Маширо за руку."
2000305-31 = "Это пустяки. Чтобы я потеряла самообладание, потребуется нечто серьёзнее."
2000305-32 = "[s] Пощекотать Маширо по щеке."
2000305-35 = "Ах. Лицо? Нет. Элитный снайпер не позволит такому себя смутить..."
2000305-36 = "[s] Пощекотать Маширо за шею."
2000305-39 = "А-а-а! Ч-что вы делаете, Сенсей?!"
2000305-40 = ""
2000305-41 = ""
2000305-42 = "Нельзя просто щекотать меня за шею ради тренировки!"
2000305-43 = "Я думала... вы стоите на стороне справедливости, Сенсей!"
2000305-45 = "Большую часть оставшегося дня я пытался успокоить Маширо."
