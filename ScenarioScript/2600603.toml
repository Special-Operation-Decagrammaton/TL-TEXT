[translation]
2600603-1 = "Дневник наблюдений"
2600603-2 = "Крыша здания"
2600603-3 = ""
2600603-4 = "Нодока, чем-то увлечённая, смотрела в телескоп."
2600603-5 = "Странно... Сенсей ведь только что сидел в Исполнительном офисе..."
2600603-6 = "Сенсей пошёл в туалет?"
2600603-7 = "[s] «Кого ты ищешь?»"
2600603-8 = "А-а! С-Сенсей?"
2600603-9 = "К-Когда ты успел сюда прийти? Ещё минуту назад ты был в Шале..."
2600603-10 = "Ты пришёл, потому что забеспокоился после моего письма?"
2600603-11 = "Уф, если бы я знала, что так получится, не отправляла бы то сообщение..."
2600603-12 = "[s] «Ты наблюдала за мной через телескоп?»"
2600603-13 = "Эм, ну... я не то чтобы наблюдала за тобой через телескоп..."
2600603-14 = ""
2600603-15 = "Но ничего не могу с собой поделать. Мне нужна ежедневная порция Сенсея, чтобы сохранять мотивацию!"
2600603-16 = "И всё потому, что тебя так трудно увидеть, Сенсей!"
2600603-17 = "Я могу просто позвонить тебе, если захочу увидеть твоё лицо?"
2600603-18 = "С-Спасибо... но я бы предпочла так не делать."
2600603-19 = "Когда я тайком смотрю на тебя через телескоп, твоё лицо сияет ярче, чем когда я смотрю прямо на тебя!"
2600603-20 = "Я обожаю издалека наблюдать, как ты занимаешься своими делами... *вздох*"
2600603-21 = "Ах! Это сейчас прозвучало довольно жутко... З-Забудь, что только что услышал!"
2600603-23 = "После этого я попросил администрацию Красная Зима внимательнее присматривать за Нодокой."
2600603-24 = "...И срок пребывания Нодоки в Спецотряде был продлён."
