[translation]
1001506-1 = "Кошка и Арис"
1001506-2 = "У торгового района Миллениум"
1001506-3 = "..."
1001506-4 = ""
1001506-5 = "Арис безмолвно смотрела поверх крыш торгового района."
1001506-6 = "[s1] «Арис, что ты делаешь?»\n[s2] «На что смотришь?»"
1001506-7 = ""
1001506-8 = ""
1001506-9 = "Здравствуйте, Сенсей. Добрый день."
1001506-10 = "Я смотрю на кошку."
1001506-11 = "[s] «Кошка...?»"
1001506-12 = "И действительно, на втором этаже соседнего магазина стояла кошка, вздыбив шерсть при виде Арис."
1001506-13 = "*ш-ш-ш*"
1001506-14 = "Она злится, но я не знаю, чем её рассердила..."
1001506-15 = "Как думаете, кошка меня ненавидит?"
1001506-16 = "Вчера она тоже злилась."
1001506-17 = "Я хотела бы её погладить, но она не позволяет..."
1001506-19 = "[s3] Достать лакомства для кошек из кармана.\n[s4] «Хорошо, что они у меня есть.»"
1001506-20 = "Что это, Сенсей?"
1001506-21 = "Что это, Сенсей?"
1001506-22 = "Это ключевой предмет для повышения уровня связи с кошкой?!"
1001506-23 = "Вы знаете способ завоевать кошачье сердце?"
1001506-24 = "[s5] «Ха. Просто смотри.»\n[s6] Потрясти лакомствами перед кошкой."
1001506-25 = ""
1001506-26 = ""
1001506-30 = "*ш-ш-ш*"
1001506-31 = "[s7] «...?!»\n[s8] «Не работает?!»"
1001506-32 = "Она разозлилась ещё сильнее. Должно быть, вы выбрали не тот предмет."
1001506-33 = "Она разозлилась ещё сильнее. Должно быть, вы выбрали не тот предмет."
1001506-34 = "Нам стоит оставить её в покое. Мне жаль, что иначе не получается, но идей больше нет. Видимо, это плохая концовка её маршрута."
1001506-35 = "Прости. Я не хотела тебя беспокоить."
1001506-36 = "Пойдёмте, Сенсей."
1001506-37 = "[s9] «Ладно...»\n[s10] «Жаль, что мы ничего не можем сделать.»"
1001506-38 = ""
1001506-39 = ""
1001506-40 = "...Мяу."
1001506-41 = "...!"
1001506-42 = "Она только что спрыгнула и приземлилась прямо передо мной!"
1001506-43 = "Мяу."
1001506-44 = "Она всё ещё меня опасается, но уже не выглядит сердитой."
1001506-45 = "[s] «Может, теперь она даст себя погладить.»"
1001506-46 = "Думаете?"
1001506-47 = "Я могу попробовать..."
1001506-48 = "..."
1001506-49 = "Мяу!"
1001506-50 = "..."
1001506-51 = "Её шерсть тёплая и мягкая. Значит, вот какие кошки на ощупь."
1001506-52 = "Мяу..."
1001506-53 = "Кошка снова скрылась по другую сторону переулка."
1001506-54 = "..."
1001506-55 = "[s] «Ушла.»"
1001506-56 = "Да, но ничего страшного. Сегодняшний квест был всего лишь погладить её."
1001506-57 = "Сегодня я получила достаточно опыта, чтобы повысить уровень."
1001506-58 = "[s11] «Это хорошо.»\n[s12] «Да, ты растёшь с каждым днём.»"
1001506-59 = "Жаль только, что кошка не съела принесённые вами лакомства."
1001506-60 = "Жаль только, что кошка не съела принесённые вами лакомства."
1001506-61 = "Вы принесли их, чтобы помочь мне?"
1001506-62 = "[s13] «Кто знает?»\n[s14] «Я всегда ношу с собой кошачьи лакомства.»"
1001506-63 = "Я знаю, что именно для этого, даже если вы притворяетесь иначе."
1001506-64 = "Я знаю, что именно для этого, даже если вы притворяетесь иначе."
1001506-65 = "Ваша доброта не позволила бы вам просто смотреть, как мне тяжело."
1001506-66 = "В этом я уверена."
1001506-68 = "Возвращаясь в академию, я разговаривал о кошках с необычайно оживлённой Арис."
