[translation]
13230-1 = "Episódio 23;O Vale do Conselho Estudantil"
13230-3 = "...Canhão Ferroviário Shemata."
13230-4 = "Mas, por quê...?"
13230-9 = "O emblema de Gehenna?"
13230-12 = "E além disso,"
13230-17 = "Desse jeito, parece até..."
13230-19 = "Quer dizer que parece uma fortaleza militar?"
13230-25 = "...Tapa-olho-chan."
13230-26 = "(Tapa-olho-chan...?)"
13230-27 = "Originalmente não tinha essa aparência, mas...#nfoi drasticamente reformulado há um tempo."
13230-30 = "Senhorita, isso não está correto.#nO projeto de arma de guerra assimétrica#nsó veio à tona depois que o empreendimento ferroviário já havia começado."
13230-31 = "Provavelmente, houve alguém que colocou essa ideia na cabeça do Conselho Estudantil de Abydos."
13230-32 = "Quem faria uma coisa dessas...!"
13230-35 = "Tanto o Conselho Estudantil de Abydos quanto a Nephthys foram apenas manipulados por ela."
13230-36 = "...Tem alguém por trás de tudo isso?"
13230-37 = "Não, não é uma mente por trás disso.#nEla já se formou e deixou Kivotos."
13230-38 = "...Se formou?"
13230-39 = "Sim. A tirana de Gehenna que mergulhou Kivotos no caos há dois anos: a \"Imperatriz do Trovão\"."
13230-40 = "...Imperatriz do Trovão?"
13230-41 = "Ela era uma estrategista e inventora genial, além de política.#nDizem que até o Tratado do Éden preparado pela Presidente do Conselho Estudantil Geral#nera, na verdade, uma medida planejada contra a Imperatriz do Trovão."
13230-42 = "Nunca ouvi falar disso."
13230-43 = "...Entendo. Bem, não importa."
13230-44 = "De qualquer forma, o que deveria ser um simples projeto ferroviário#nacabou virando a semente de um conflito pelas mãos da Imperatriz do Trovão."
13230-45 = "E por que essa tal Imperatriz do Trovão faria uma coisa dessas?"
13230-46 = "...Não sei."
13230-47 = "Não há como saber o que se passava na cabeça da Imperatriz do Trovão."
13230-48 = "Não adianta tentar desvendar a mente de um gênio."
13230-49 = "Afinal, até a aproximação dela com Abydos pode ter sido só um capricho."
13230-50 = "De fato, depois que o projeto do Canhão Ferroviário foi interrompido,#nparece que a Imperatriz do Trovão nem sequer voltou a se envolver com Abydos."
13230-52 = "..."
13230-53 = "No fim, ela logo perdeu o poder por causa de suas subordinadas, e seu regime de punho de ferro chegou ao fim.#nContudo, as invenções que ela deixou ainda permanecem em Kivotos."
13230-54 = "Todas elas têm poder suficiente para colocar Kivotos em perigo num piscar de olhos.#n...Assim como o Canhão Ferroviário."
13230-55 = "Tapa-olho-chan, já terminou?#nO velhote aqui não tem tempo pra ficar ouvindo histórias do passado."
13230-56 = "(Velhote...?)"
13230-57 = "Então, por que me chamou aqui?#nEssa Imperatriz do Trovão tem alguma ligação com a Yume-senpai?"
13230-58 = "...Não, nenhuma."
13230-59 = "Então tem a ver com o contrato?"
13230-60 = "..."
13230-61 = "Ou será que a Tapa-olho-chan na verdade é uma aluna de Gehenna#ne queria recuperar a invenção da Imperatriz do Trovão?"
13230-62 = "Quem é você?#nQual é o seu objetivo?"
13230-63 = "..."
13230-64 = "Ah... Bom, tanto faz."
13230-68 = "Eu vou destruir o Canhão Ferroviário agora.#nImperatriz do Trovão, Gehenna... nada disso importa."
13230-69 = "Aquilo é algo que nega completamente a vontade da Yume-senpai.#nPor isso, eu não posso deixar isso pra lá."
13230-70 = "De jeito nenhum... É, de jeito nenhum."
13230-72 = "...Faça como quiser."
13230-73 = "Mas, para isso, primeiro terá que tomar o cartão de mim."
13230-79 = "O cartão dourado da Nonomi-chan...?"
13230-80 = "Para ativar o Canhão Ferroviário, este cartão é necessário.#nE, claro, para destruí-lo também."
13230-89 = "Não respondi à sua pergunta de antes, não é?#nMeu verdadeiro objetivo é Takanashi Hoshino — você."
13230-90 = "Se quiser destruir o trem, derrote-me e tome o cartão."
13230-91 = "...E então, quem é você?"
13230-92 = "Ah, eu também queria saber disso."
13230-93 = "Uma desgarrada sem escola, mercenária da Kaiser, pau-mandado da Nephthys,#nestrangeira na Highlander... e agente dupla de um fundo privado."
13230-94 = "Finalmente entendi o sentido de dar tantas voltas até chegar aqui."
13230-98 = "Era para lutar contra você."
13230-99 = "Estou aqui para negar o terror e a loucura de Abydos."
13230-104 = "O que faz você levar isso tão a sério?#nEu quero saber o motivo."
13230-106 = "...Pois bem.#nSe conseguir me derrotar, eu te direi onde está aquele caderno."
13230-110 = "...Pelo visto você só vai entender na base da dor, né?"
13230-112 = "Hmph, agora sim fez uma boa cara."
13230-117 = "Pois bem, vamos começar."
