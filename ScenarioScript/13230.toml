[translation]
13230-1 = "Эпизод 23;Долина председателей студсовета"
13230-3 = "...Железнодорожная пушка «Схемата»."
13230-4 = "Но почему..."
13230-9 = "...эмблема Геенны...?"
13230-12 = "И это место..."
13230-13 = ""
13230-15 = ""
13230-16 = ""
13230-17 = "Совсем не похоже на мемориал. Скорее..."
13230-19 = "...На военную крепость?"
13230-20 = ""
13230-22 = ""
13230-24 = ""
13230-25 = "...Повязка."
13230-26 = "(«Повязка»...?)"
13230-27 = "Ты права, Таканаши Хошино. Когда-то это место было историческим памятником, оставленным председателями студсовета сотни лет назад. Но кто-то перестроил его в военную крепость."
13230-30 = "Разумеется, я не занимала высокого поста и могу не знать всех деталей, но уверенно скажу: изначальной целью было строительство Транс-пустынной железной дороги. План Железнодорожной пушки появился позже."
13230-31 = "Кто-то предложил пушку студсовету как попытку спасти проблемный и убыточный проект."
13230-32 = "Что? Кто? Кто мог предложить такое...?"
13230-35 = "Тот, кто всё это устроил, манипулировал и студсоветом Абидоса, и Нефтис."
13230-36 = "Ты хочешь сказать, за всем стоял какой-то кукловод, Повязка?"
13230-37 = "Нет, теперь её уже нельзя назвать кукловодом. Она давно выпустилась и покинула Кивотос."
13230-38 = "...Выпустилась?"
13230-39 = "Да... Это была Тиран-Император Геенны, та, что два года назад погрузила Кивотос во тьму."
13230-40 = "...Тиран-Император?"
13230-41 = "Она была гениальным стратегом и изобретателем, а ещё умелым политиком. Есть даже теория, что Эдемский договор, инициированный председателем Генерального студсовета, был попыткой противостоять Тирану-Императору."
13230-42 = "Я никогда о ней не слышала."
13230-43 = "...Именно она вмешалась в проект Транс-пустынной железной дороги и направила его по совершенно другому пути."
13230-44 = "Из-за неё простой логистический и транспортный проект быстро стал очагом серьёзнейшего политического конфликта."
13230-45 = "Зачем Тирану-Императору вообще было вмешиваться?"
13230-46 = "...Никто не знает."
13230-47 = "...Даже тогда никто не понимал истинных намерений Тирана-Императора."
13230-48 = "Была ли она гением или просто эксцентричной... никто не понимал, что у неё в голове."
13230-49 = "Возможно, Абидос был для неё лишь игрой от скуки, мимолётной прихотью."
13230-50 = "Как бы там ни было, после остановки проекта Железнодорожной пушки её интерес к Абидосу быстро исчез."
13230-52 = "..."
13230-53 = "Её железное правление в итоге закончилось жестоким переворотом, поднятым собственными подчинёнными, но... говорят, многие её изобретения до сих пор разбросаны по Кивотосу."
13230-54 = "Многие жаждут силы, которую можно получить даже от одного такого изобретения. Например, Железнодорожной пушки."
13230-55 = "Этой старушке вообще, вообще плевать на твой урок истории, Повязка."
13230-56 = "(«Старушка»...?)"
13230-57 = "Но раз уж заговорили, зачем тебе понадобилась именно я? Тиран-Император как-то связана с Юмэ?"
13230-58 = "...Нет, совсем нет."
13230-59 = "...Тогда договор? Она как-то связана с договором Юмэ?"
13230-60 = "..."
13230-61 = "Или ты студент Геенны, которая хочет вернуть изобретение Тирана-Императора?"
13230-62 = "...Кто ты? Что ты задумала?"
13230-63 = "..."
13230-64 = "*вздох* Забудь. Перейду к делу."
13230-65 = ""
13230-67 = ""
13230-68 = "Меня совершенно не интересуют ни Геенна, ни Тиран-Император, ни что-либо ещё. Я здесь, чтобы уничтожить оружие за твоей спиной."
13230-69 = "Само существование этой мерзости плюёт на последнюю волю Юмэ. Я этого не допущу."
13230-70 = "Никогда. Ни при каких обстоятельствах."
13230-72 = "...Делай что хочешь, Хошино."
13230-73 = "Но сначала придётся отобрать у меня эту карту."
13230-74 = ""
13230-76 = ""
13230-79 = "Золотая карта Нономи...?"
13230-80 = "С ней я могу активировать Железнодорожную пушку. И тебе она понадобится, чтобы уничтожить оружие."
13230-81 = ""
13230-83 = ""
13230-88 = ""
13230-89 = "Победи меня и забери карту."
13230-90 = "Моей настоящей целью всегда была ты, Таканаши Хошино."
13230-91 = "...Ты. Кто ты?"
13230-92 = "Ах-ах. Я и сама долго задавалась этим вопросом."
13230-93 = "Скиталица без школы, наёмница ЧВК Кайзер, девочка на побегушках Нефтис, надзиратель академии Хайлендер, двойной агент фонда прямых инвестиций..."
13230-94 = "...Но теперь я точно знаю, кто я."
13230-95 = ""
13230-97 = ""
13230-98 = "Я твой враг, Таканаши Хошино. Твой, законной наследницы ужаса и безумия Абидоса."
13230-99 = "Но этот ужас и есть источник твоей силы. Значит, у меня нет другого выбора, кроме как противостоять тебе."
13230-100 = ""
13230-103 = ""
13230-104 = "Что мне сделать, чтобы довести тебя до отчаяния? Железнодорожной пушки недостаточно?"
13230-106 = "...Победи меня, и я скажу, где находится та тетрадь."
13230-107 = ""
13230-109 = ""
13230-110 = "...Я правда собиралась тебе поддаться, но ты... придётся сражаться всерьёз."
13230-112 = "Да, вот это выражение мне нравится."
13230-113 = ""
13230-115 = ""
13230-117 = "Начнём."
