[translation]
2300515-1 = "Дождь в Пустыне"
2300515-3 = "[ns1] \"Всё же успели до захода солнца!\"\n[ns2] \"Всё благодаря тебе, Аяне!\""
2300515-6 = ""
2300515-7 = "Я-Я ценю это, но я почти ничего не сделала."
2300515-8 = "Думаете, я всегда работаю быстро и чисто? Опять же, Вы меня переоцениваете..."
2300515-9 = "Но у меня вопрос!"
2300515-10 = "Чем Вы обычно занимаетесь, когда Вы, как сейчас, заканчиваете пораньше?"
2300515-11 = "[s3] «Отлыниваю с Аяне.»\n[s4] «Отдыхаю с Аяне.»"
2300515-14 = "С-Сенсей!"
2300515-15 = "..."
2300515-16 = "Ах. Я не хотела, чтобы это прозвучало в упрёк. Мне нравится… Сама эта мысль…"
2300515-17 = "По правде, я и сама думала об этом..."
2300515-18 = "В-В любом случае, позвольте принести Вам попить! Или перекусить! Или ещё что!"
2300515-19 = ""
2300515-21 = ""
2300515-24 = "Ик!"
2300515-25 = "[s] «Ты в порядке?!»"
2300515-26 = "Д-Да! Просто уронила заколку."
2300515-29 = ""
2300515-31 = ""
2300515-32 = "Вот, Сенсей. Я принесла Вам кофе и шоколад."
2300515-33 = "Хм? Откуда я узнала Ваш любимый кофе?"
2300515-34 = "Фу-фу..."
2300515-35 = "Мы же уже давно друг друга знаем, конечно же я всё знаю, Сенсей."
2300515-37 = "Мы с Аяне вместе наслаждались шоколадом и идеально сваренным кофе."
2300515-38 = ""
2300515-39 = "[ns] «Если так подумать, ты постоянно носишь эту заколку.»"
2300515-40 = ""
2300515-42 = "Хм?"
2300515-43 = "А, Вы заметили..."
2300515-44 = "[ns] «Ты же знаешь, как давно мы знакомы?»"
2300515-45 = "Есть..."
2300515-46 = "Это делает меня счастливой... Хе-хе."
2300515-47 = "Мне нравится форма этой заколки. Такого цветка Вы больше нигде не найдёте."
2300515-48 = "[ns] «Правда? А у тебя, будто бы, получилось найти!»"
2300515-49 = "Я тоже так думала, но перевернув всё вверх дном, ни нашла ни одного."
2300515-50 = "Самыми похожими будут камнеломки, но у них пять лепестков."
2300515-51 = "Мне он нравится потому что... на первый взгляд он выглядит обычным цветком, который можно увидеть где угодно."
2300515-52 = "Но почему-то именно это чувство обычности, что он вызывает, меня и притягивает."
2300515-53 = "Заставляет задуматься, что было бы здорово, удели ему хоть кто-то, пусть только я одна, то внимание, которое он заслуживает."
2300515-54 = "[ns] «У тебя такое доброе сердце, Аяне»."
2300515-55 = "Спасибо."
2300515-56 = "Важно уделять внимание мельчайшим деталям! Ведь именно их пропуск может стать причиной величайших потерь!"
2300515-57 = "Такие вещи, как квитанции, условия использования..."
2300515-58 = "Или положения о рисках, напечатанные таким мелким шрифтом, что для их прочтения внизу страховых договоров понадобится лупа!!"
2300515-59 = "[s] «У тебя такое… искреннее сердце, Аяне»."
2300515-60 = "Фух. Спасибо, Сенсей."
2300515-61 = "Я ношу это заколку с самого поступления в среднюю школу."
2300515-62 = "Я даже начала покупать носки с тем же узором."
2300515-63 = "...А?"
2300515-64 = "П-Почему я вообще начала Вам описывать, что за носки у меня в шкафу?!"
2300515-65 = "Я так люблю пилить сук, на котором сижу?"
2300515-66 = "[s] «Не думаю, что у меня есть на это ответ...»"
2300515-67 = "Ах. Вы правы. Простите. Переволновалась."
2300515-68 = ""
2300515-69 = ""
2300515-70 = "..."
2300515-71 = "Сенсей, вы знали, что даже в пустыне растут цветы?"
2300515-72 = "[s] «Правда? Как такое возможно?»"
2300515-73 = "Сама я, конечно, не видела."
2300515-74 = "Но в редких случаях, когда идёт дождь, раз в несколько лет или даже десятилетий..."
2300515-75 = "Семена, что были скрыты под слоем песка, разом расцветают."
2300515-76 = "Их жизнь коротка. Горячий ветер вновь всё осушит, а цветы вскоре завянут."
2300515-77 = "Но до тех пор, они оставляют семена, чтобы будущие поколения могли однажды вновь расцвести."
2300515-78 = "И эти семена будут ждать своего часа, пока не пойдёт тот редкий дождь."
2300515-79 = "Когда я услышала об этом впервые, мне почему-то показалось это очень близким."
2300515-80 = "...Думаете, и на улице Абидоса пойдёт свой дождь?"
2300515-81 = "[s] «Очень на это надеюсь.»"
2300515-82 = "Прежде чем в пустыне пойдет дождь..."
2300515-83 = "...обычно наблюдаются всевозможные климатические аномалии."
2300515-84 = "Так что это не обязательно хорошо..."
2300515-85 = "[s] «М-Может, мне взять свои слова назад?!»"
2300515-86 = "Ахаха, ну, не будем так далеко заходить."
2300515-87 = "Дождь ведь бывает по разным причинам, хорошим и плохим!"
2300515-88 = "В каком-то смысле, дождь в Абидосе уже пошёл."
2300515-89 = "[s5] «Вот как?»\n[s6] «Сказала бы мне тогда!»"
2300515-92 = "Фуфу... Так и знала, что Вы так скажете, Сенсей."
2300515-93 = "Хмм? Спрашиваете, не зацвели ли цветы?"
2300515-94 = "Ну..."
2300515-95 = "Для меня – вполне."
2300515-96 = "[s] «И что это должно значить?!»"
2300515-97 = "Н-Ну..."
2300515-98 = "Думаю, Вам лучше не знать."
2300515-99 = "[s] «Что? Почему?»"
2300515-100 = "И правда, почему же."
2300515-101 = "Когда в следующий раз пойдёт дождь..."
2300515-102 = "...и в пустыне распустятся цветы..."
2300515-103 = "..хотелось бы посмотреть на это вместе с Вами, Сенсей."
2300515-104 = "[s] «Конечно. Обещаю»."
2300515-105 = "Ну ладно, это обещание."
2300515-106 = "А скрепим наш договор..."
2300515-107 = "Вот этим. Возьмите."
2300515-108 = ""
2300515-110 = ""
2300515-112 = "Не волнуйтесь, у меня ещё есть."
2300515-113 = "Вам не нужно её надевать..."
2300515-114 = "Но берегите её, ладно?"
2300515-115 = "[ns] «Спасибо.»"
2300515-116 = ""
2300515-117 = "Совсем нет."
2300515-118 = ""
2300515-120 = ""
2300515-121 = ""
2300515-122 = "По правде..."
2300515-123 = "Это мне нужно Вас благодарить."
2300515-125 = "Я провёл замечательный день, отлынивая остаток дня с Аяне, которая почему-то выглядела счастливее, чем обычно."
