[translation]
90102070-1 = "Episode 7;The Fox and the Rabbit"
90102070-8 = "……To sum up what you've said, Senior."
90102070-9 = "The FOX Squad was released from the Correction Bureau through the General Student Council President's discretion, and is currently carrying out operations alongside [USERNAME]-sensei, is that correct?"
90102070-10 = "And whatever happened just now was part of that special operation."
90102070-11 = "That's correct, Squad Leader Tsukiyuki."
90102070-12 = "I don't believe I've fully atoned for the mistakes I've made yet. #nAt the General Student Council President's discretion that we return even a fraction of our abilities to society, #nparticipating in limited activities is our current status quo."
90102070-13 = "Of course, compared to when SRT Special Academy still existed, we've lost a lot. #nBut…… considering our sins, this is more than generous treatment."
90102070-17 = "I've heard about your current situation from Niko. #nI hear you're still fighting in that park to revive SRT."
90102070-18 = "As a senior, it's utterly pathetic."
90102070-19 = "I was planning to go greet you once everything was sorted out, but――"
90102070-20 = "I never thought we'd reunite in a manner like this. #n……I'm sorry."
90102070-25 = "Hah……."
90102070-26 = "……Are you disappointed?"
90102070-27 = "Yes."
90102070-28 = "Honestly, I am."
90102070-29 = "Was my acting really that terrible……?"
90102070-30 = "N-No, that's not it! #nI don't mean your acting……."
90102070-34 = "You managed to get out of the Correction Bureau, yet…… #nwhy didn't you let any of us know?"
90102070-35 = "Even if we reunited, we had no intention of holding a grudge #nหรือ demanding anything from you."
90102070-36 = "We just wanted to spend our days like normal."
90102070-37 = "Saki, Moe, and Miyu…… you have no idea how much they wanted to see you seniors."
90102070-41 = "……I'm sorry."
90102070-42 = "Senior."
90102070-43 = "Could it be…… that you still don't think of us as your allies?"
90102070-44 = "Th-That's――"
90102070-48 = "[ns] \"It seems there's some kind of misunderstanding.\""
90102070-49 = "[USERNAME]-sensei?"
90102070-50 = "[s1] \"Yukino wasn't intentionally avoiding you.\"\n[s2] \"The fact that she was released is top secret.\""
90102070-53 = "……Now that you mention it, no one is talking about it."
90102070-54 = "There's no way the Chronos Channel or social media would stay silent about this kind of news."
90102070-55 = "This is a top-secret matter known to no one except the General Student Council President and Sensei."
90102070-56 = "Not only is the target we're tracking an unknown entity whose threat level can't even be measured, but…… #nif this goes public, it could throw all of Kivotos into chaos."
90102070-57 = "So I'm sorry, but…… I must ask you to keep this from the other squad members for a while."
90102070-58 = "I don't want to drag you guys into this as well. #nBecause the ones who will shoulder 'tomorrow' are not us, but you."
90102070-59 = "You never change."
90102070-60 = "Last time, you pushed yourself to carry everything alone…… and failed, didn't you?"
90102070-61 = "That was――"
90102070-62 = "Still, I'm relieved to see that your sense of justice hasn't disappeared."
90102070-63 = "In exchange, I have a promise to make."
90102070-64 = "Once your current operation is over, and you've faced your past――"
90102070-65 = "Before anyone else in Kivotos…… please let us know."
90102070-66 = "I swear it on everything I am."
90102070-67 = "Yes, that's more than enough."
90102070-71 = "That aside, though... what was up with that acting earlier? #n Weren't you in the middle of a top-secret mission? I felt like you were standing out a bit too much……."
90102070-72 = "Ah, could it be that drawing attention was the goal?"
90102070-73 = "No, there were no such special circumstances."
90102070-74 = "If I had to say, the other squad members weren't feeling well today. #nNormally I'd leave it to them, but today I, as the squad leader, was handling the questioning."
90102070-75 = "Ah…… I see."
90102070-76 = "……Was my acting really that unnatural?"
90102070-80 = "…………Yes."
90102070-81 = "……I'll keep that in mind for the future."
90102070-82 = "[s3] \"It-It's fine…… probably…….\"\n[s4] \"Everyone has things they're good and bad at…….\""
90102070-85 = "That support really hits home……."
90102070-86 = "Fufu. Talking like this brings back memories."
90102070-89 = "[ns5] \"By the way, what brings Miyako here?\"\n[ns6] \"Isn't it a bit far from the Rabbit Platoon Park?\""
90102070-92 = "Actually…… I'm taking on a personal request."
90102070-93 = "A request……?"
90102070-94 = "A while ago, I helped a student who was being hassled by delinquents near the park."
90102070-95 = "She worked part-time at a bento shop, so we naturally became friends――"
90102070-96 = "The important part isn't how we met, though!"
90102070-97 = "Apparently, that girl's childhood friend went missing near Kawanishi Station."
90102070-98 = "While looking into the incident, I ended up here."
90102070-99 = "……Regarding that student, haven't you heard any stories about them disappearing after boarding an unfamiliar train?"
90102070-100 = "Eh? Could the incident you seniors are tracking also be...?"
90102070-101 = "I can't say for certain, but it's likely the same incident."
90102070-102 = "If you don't mind, would you be willing to share your information?"
90102070-103 = "Of course."
90102070-104 = "To be able to help with Senior's operation…… I'm glad."
90102070-106 = "The client apparently had a very close childhood friend."
90102070-107 = "They went to the same academy and were always close, but…… #nrecently, they drifted apart due to the client transferring schools."
90102070-108 = "However, last week, she suddenly received a message saying, 'A train to the past has arrived,' #nand haven't been able to make contact since."
90102070-109 = "Up to that point, it matches what we've gathered."
90102070-110 = "Do you have any other information?"
90102070-111 = "A few days later, while visiting Kawanishi Station to search for her childhood friend, the client #nsupposedly witnessed a 'strange train' pulling into the platform."
90102070-112 = "……A strange train?"
90102070-113 = "The client said it was a car from an old railway line that was already abandoned."
90102070-114 = "She felt suspicious and didn't board it, but…… #nshe thinks that train might be related to this disappearance case."
90102070-115 = "……That is certainly important information. Thanks for telling me."
90102070-116 = "If possible, could you let me meet this client directly?"
90102070-117 = "Understood. I'll contact her and set up a meeting."
90102070-121 = "[ns] \"It's a good thing we found a witness.\""
90102070-122 = "Yes. Up until now, we barely had any leads."
90102070-123 = "The missing students all had different academies and living areas…… so we couldn't find any common threads."
90102070-124 = "Common threads…… does Senior not know?"
90102070-125 = "Do you know something?"
90102070-126 = "The students who witnessed that train at Kawanishi Station, including the client, all share a commonality."
90102070-127 = "They all…… apparently hail from the now-closed 'Private Hyacinth Academy'."
90102070-129 = "Next Episode;Looking for a Friend"
