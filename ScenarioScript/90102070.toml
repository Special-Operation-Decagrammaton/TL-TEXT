[translation]
90102070-1 = "Эпизод 7;Лиса и кролик"
90102070-2 = ""
90102070-3 = ""
90102070-4 = ""
90102070-5 = ""
90102070-6 = ""
90102070-7 = ""
90102070-8 = "...Если обобщить рассказ."
90102070-9 = "Отряд FOX вышел из исправительного бюро по распоряжению президента Генерального Студенческого Совета,#nа сейчас выполняет операцию вместе с Сенсеем [USERNAME]. Так?"
90102070-10 = "И то, что было раньше, тоже часть этой спецоперации."
90102070-11 = "Верно, командир отряда [ruby=つきゆき]Цукиюки[/ruby]."
90102070-12 = "Я не считаю, что искупила все совершённые ошибки.#nПо решению президента Генерального Студенческого Совета, велевшей мне хоть немного#nпослужить обществу, мне разрешена ограниченная деятельность — такова текущая ситуация."
90102070-13 = "Разумеется, по сравнению с теми временами, когда Специальная академия SRT ещё существовала, потеряно многое.#nНо... если вспомнить о нашей вине, это чрезмерно щедрое обращение."
90102070-14 = ""
90102070-16 = ""
90102070-17 = "О ваших делах я слышала от Нико.#nГоворят, вы до сих пор в том парке продолжаете бороться за возрождение SRT."
90102070-18 = "...Я просто не могу себя простить."
90102070-19 = "Я собиралась прийти с приветствием, когда всё уладится, но―"
90102070-20 = "Не думала, что мы встретимся вот так.#n...Прости."
90102070-21 = ""
90102070-23 = ""
90102070-24 = ""
90102070-25 = "Эх..."
90102070-26 = "...Разочарована?"
90102070-27 = "Да."
90102070-28 = "Честно говоря, разочарована."
90102070-29 = "Неужели моя игра настолько плоха..."
90102070-30 = "Н-нет!#nДело не в игре..."
90102070-31 = ""
90102070-33 = ""
90102070-34 = "Вы ведь вышли из исправительного бюро...#nПочему же вы нам ничего не сообщили?"
90102070-35 = "Даже если бы мы встретились, я бы не стала высказывать обиды#nили чего-то требовать."
90102070-36 = "Я просто хотела жить обычной жизнью."
90102070-37 = "Саки, Моэ, Мию... как же они хотели увидеть вас."
90102070-38 = ""
90102070-40 = ""
90102070-41 = "...Прости."
90102070-42 = "Юкино."
90102070-43 = "Неужели... вы до сих пор считаете нас не союзниками?"
90102070-44 = "Э-это―"
90102070-45 = ""
90102070-47 = ""
90102070-48 = "[ns] «Кажется, тут какое-то недоразумение.»"
90102070-49 = "Сенсей [USERNAME]?"
90102070-50 = "[s1] «Юкино не избегала вас специально.»\n[s2] «Сам факт выхода из бюро — совершенно секретен.»"
90102070-53 = "...Если подумать, никто об этом не говорит."
90102070-54 = "О таком канал Кронос или соцсети молчать бы не стали."
90102070-55 = "Это совершенно секретная информация, о которой, кроме президента Генерального Студенческого Совета и Сенсея, не знает никто."
90102070-56 = "К тому же преследуемая цель — неизвестное существо, чью опасность даже измерить невозможно...#nЕсли это станет известно, может возникнуть хаос по всему Кивотосу."
90102070-57 = "Поэтому прости... но пока что прошу скрывать это и от остальных членов отряда."
90102070-58 = "Я не хочу втягивать и вас.#nВедь «завтра» несут не мы, а вы."
90102070-59 = "Всё как всегда."
90102070-60 = "В прошлый раз ведь тоже пытались всё взвалить на себя в одиночку... и потерпели неудачу."
90102070-61 = "То было―"
90102070-62 = "Но я рада, что справедливость Юкино не исчезла."
90102070-63 = "Взамен — обещание."
90102070-64 = "Когда нынешняя операция закончится и Юкино сможет встретиться лицом к лицу с прошлым―"
90102070-65 = "Раньше всех в Кивотосе... расскажите нам."
90102070-66 = "Клянусь всем, что у меня есть."
90102070-67 = "Да, этого достаточно."
90102070-68 = ""
90102070-70 = ""
90102070-71 = "Но, если отложить это в сторону, та ваша игра...#nВы ведь на секретном задании, верно? Мне показалось, вы слишком бросались в глаза..."
90102070-72 = "А, может, привлечь внимание и было целью?"
90102070-73 = "Нет, никаких особых обстоятельств не было."
90102070-74 = "Если уж на то пошло, сегодня остальные члены отряда чувствовали себя неважно.#nОбычно я поручаю это им, но сегодня опрос проводила я как командир отделения."
90102070-75 = "А-а... понятно."
90102070-76 = "...Неужели моя игра была настолько неестественной?"
90102070-77 = ""
90102070-79 = ""
90102070-80 = "......Да."
90102070-81 = "...Учту на будущее."
90102070-82 = "[s3] «В-всё нормально... наверное...»\n[s4] «У каждого есть свои сильные и слабые стороны...»"
90102070-85 = "Эта поддержка ранит в самое сердце..."
90102070-86 = "Хе-хе. Когда вот так разговариваем, становится как-то ностальгически."
90102070-88 = ""
90102070-89 = "[ns5] «Кстати, Мияко, почему ты здесь?»\n[ns6] «От парка Кроликов ведь далеко, да?»"
90102070-92 = "Вообще-то... я получила личный заказ."
90102070-93 = "Заказ?.."
90102070-94 = "Недавно я спасла студента, к которому приставали хулиганы возле парка."
90102070-95 = "Она подрабатывала в магазинчике бенто, и мы так подружились―"
90102070-96 = "Важно ведь не то, как вы познакомились!"
90102070-97 = "Говорят, её подруга детства пропала возле станции Каваниши."
90102070-98 = "Вот я и расследовала это дело, пока не добралась сюда."
90102070-99 = "...А про этого студента не говорили, что она исчезла, сев в незнакомый поезд?"
90102070-100 = "Ох, неужели вы тоже расследуете это дело?"
90102070-101 = "Утверждать не могу, но, вероятно, это то же происшествие."
90102070-102 = "Если не возражаешь, не поделишься информацией?"
90102070-103 = "Конечно."
90102070-104 = "Помогать в операции... как же это приятно."
90102070-106 = "У заказчицы, говорят, была близкая подруга детства."
90102070-107 = "Они учились в одной академии и всегда были близки, но...#nнедавно из-за перевода заказчицы они отдалились."
90102070-108 = "И на прошлой неделе вдруг пришло сообщение: «Прибыл поезд в прошлое»,#nа после этого связь с ней пропала."
90102070-109 = "До этого момента всё совпадает с тем, что известно нам."
90102070-110 = "Есть ещё какая-то информация?"
90102070-111 = "Через несколько дней заказчица, отправившаяся на станцию Каваниши искать подругу,#nслучайно увидела, как на платформу въехал «странный поезд»."
90102070-112 = "...Странный поезд?"
90102070-113 = "По словам заказчицы, это был вагон старой линии, уже закрытой."
90102070-114 = "Она почувствовала что-то подозрительное и не села, но...#nвозможно, этот поезд связан с нынешними исчезновениями."
90102070-115 = "...Действительно, важная информация. Спасибо, что рассказала."
90102070-116 = "Если можно, нельзя ли встретиться с этой заказчицей напрямую?"
90102070-117 = "Поняла. Я свяжусь с ней и договорюсь о встрече."
90102070-118 = ""
90102070-120 = ""
90102070-121 = "[ns] «Хорошо, что нашёлся свидетель.»"
90102070-122 = "Да. До сих пор у нас почти не было зацепок."
90102070-123 = "Пропавшие ученики были из разных академий и сфер жизни... и общих черт мы найти не могли."
90102070-124 = "Общих черт... вы разве не знаете?"
90102070-125 = "Ты что-то знаешь?"
90102070-126 = "У студентов, включая заказчицу, которые видели тот поезд на станции Каваниши, есть общее."
90102070-127 = "Все они... оказывается, выпускницы «Частной академии Гиацинт», которая сейчас закрыта."
90102070-129 = "Следующий эпизод;Ищу подругу"
