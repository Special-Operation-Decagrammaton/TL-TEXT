[translation]
10015005-163 = "#video;10015"
10015005-1 = "Пролог;Канун спортивного фестиваля"
10015005-2 = ""
10015005-5 = "Фестиваль Хало в Кивотосе... Спортивный праздник, испытывающий физические возможности студентов на пределе."
10015005-7 = "Это день единения. Студенты откладывают оружие и школьные распри, чтобы встретиться в духе дружеского соперничества."
10015005-8 = "Фестиваль Хало проходит раз в два года, и академии по очереди принимают его у себя. Это очень важная давняя традиция, помогающая поддерживать хорошие отношения между школами."
10015005-9 = ""
10015005-15 = "Даже самые непримиримые соперники негласно соглашаются отложить вражду ради этого одного особенного дня."
10015005-16 = ""
10015005-19 = "Разумеется, после исчезновения президента Генерального студсовета ситуация в Кивотосе была... неспокойной, и ходили слухи, что в этом году Фестиваль Хало отменят."
10015005-20 = ""
10015005-23 = "Но студенты Кивотоса вместе с самим «Шале» объединились, чтобы фестиваль всё-таки состоялся!"
10015005-24 = ""
10015005-27 = ""
10015005-28 = "А в этом году Фестиваль Хало..."
10015005-29 = ""
10015005-32 = ""
10015005-34 = "...будет принимать не кто иной, как Научная школа «Миллениум»!"
10015005-35 = "[s1] «Ух ты!»\n[s2] «Поздравляю!»"
10015005-38 = "Да, для нас это большая честь. Спасибо, что так быстро пришли, Сенсей."
10015005-39 = "Но важнее другое, Ноа."
10015005-40 = "Обязательно было так долго всё объяснять?"
10015005-41 = "О чём ты? Это была прямая цитата из вступительной речи."
10015005-42 = "Если изменить хоть одно слово или, что ещё хуже, пересказать кратко, первоначальный смысл размоется."
10015005-43 = "Настоящий летописец никогда не изменит, не опустит и никак иначе не исказит исходный текст."
10015005-44 = "[s] «...Летописец?»"
10015005-45 = "Ах, точно. Мы ведь ещё официально не знакомились, Сенсей."
10015005-46 = "Меня зовут Ноа. Я секретарь «Семинара» и штатный летописец Научной школы «Миллениум»."
10015005-47 = "Приятно познакомиться, [USERNAME]-сенсей."
10015005-48 = "[s] «Мне тоже приятно познакомиться, Ноа.»"
10015005-49 = "Ты даже для себя слишком воодушевлена."
10015005-50 = "Уф. Давайте уже вернёмся к делу."
10015005-51 = "Что-то не так, Юука~?"
10015005-52 = "Я всего лишь поприветствовала нашего дорогого Сенсея и постаралась произвести хорошее впечатление. С чего бы Юке из-за этого злиться?"
10015005-53 = "И правда, почему моя доброта к Сенсею так её раздражает... Хм..."
10015005-54 = ""
10015005-56 = ""
10015005-58 = "Ага! Ты, должно быть, ревнуешь!"
10015005-60 = "Я-я? Ревную?!"
10015005-61 = "Не выдумывай всякие странные сценарии у себя в голове, Ноа!"
10015005-62 = "Можешь хоть раз вести себя нормально?! Хватит заставлять Сенсея ждать, объясни уже проблему!"
10015005-63 = "Ладно, ладно. Как скажешь, Юука!"
10015005-64 = "Как я уже говорила, Фестиваль Хало в Кивотосе проводится раз в два года для всех академий."
10015005-65 = "Он не только объединяет школы, но и даёт принимающей академии отличный шанс немного себя показать."
10015005-67 = "В конце концов, не каждый день одна академия получает внимание всего Кивотоса."
10015005-68 = "Это больше, чем просто спортивные соревнования. Если мы произведём хорошее впечатление, для «Миллениума» это будет очень важно."
10015005-69 = "Исторически после проведения фестиваля число новых заявок в принимающую школу резко возрастает, а вместе с этим она получает приоритет у продавцов и поставщиков."
10015005-71 = "Научная школа «Миллениум» славится своими достижениями в науке и технологиях. На этом спортивном празднике мы обязаны соответствовать такой репутации."
10015005-72 = "Среди наших многочисленных планов — индивидуальные GPS-системы для каждого студента и сверхскоростные камеры, чтобы исключить ошибочные решения судей во время матчей."
10015005-73 = "Я могу с уверенностью сказать, что каждый клуб нашей школы уже несколько месяцев не покладая рук готовится к Фестивалю Хало."
10015005-75 = "И теперь, когда до него остался всего один день, «Семинару» нужно проверить всё оборудование и провести испытания, но..."
10015005-76 = "[s] «Но...?»"
10015005-77 = "Но, к сожалению, мы столкнулись с несколькими проблемами."
10015005-78 = ""
10015005-84 = "Всего двенадцать часов назад в Клубе разработки материалов произошёл... небольшой взрыв."
10015005-85 = "Полагаю, они опять смешивали химикаты, которые смешивать не следовало."
10015005-86 = "Никто не пострадал, но разработанный ими робот-болельщик теперь нуждается в срочном ремонте."
10015005-88 = "И это ещё не всё: оборудование начало пропадать, а некоторые объекты даже были разрушены."
10015005-89 = "[s3] «Звучит серьёзно.»\n[s4] «Вы думаете перенести фестиваль?»"
10015005-92 = "Это серьёзно, но думаю, переносить ничего не придётся. Мы лишь немного отстаём от графика."
10015005-93 = "Меня не так беспокоит ремонт или замена украденного оборудования."
10015005-94 = "Куда важнее выяснить, кто его крадёт, пока след не остыл."
10015005-95 = "А у «Семинара» и без того полно дел, ведь спортивный фестиваль уже завтра."
10015005-96 = "Поэтому наша просьба... Вы поможете нам поймать вора?"
10015005-97 = "[s5] «Конечно, но...»\n[s6] «Я могу помочь ещё чем-нибудь?»"
10015005-100 = "Хм? А, нет. Не беспокойтесь об этом."
10015005-101 = "В целом подготовка идёт хорошо."
10015005-102 = "Да, у нас было несколько неудач, но я всё предусмотрела в плане!"
10015005-103 = "Всё просто. Я выделила 300 минут на ремонт робота-болельщика, и этого как раз хватит, чтобы ещё посетить офис Исполнительного комитета."
10015005-104 = "После этого мне останется только рассчитать дополнительные расходы на ремонт и составить списки спортсменок для отправки другим школам. Вся подготовка завершится за 1850 секунд до начала церемонии открытия..."
10015005-105 = "[s] «(Что-то не похоже, что у неё всё хорошо...)»"
10015005-106 = ""
10015005-110 = ""
10015005-111 = "Юука! Я принесла тебе чёрный чай."
10015005-112 = "Что? Зачем?"
10015005-113 = "Ты ведь всегда пьёшь чёрный чай, когда работаешь всю ночь!"
10015005-114 = "А судя по твоему расписанию, расписанному до секунды, тебя явно ждёт бессонная ночь."
10015005-115 = "Я понимаю, но... твоя доброта выглядит подозрительно."
10015005-116 = "Ну, спасибо. Думаю, у меня хватит времени выпить его до начала ремонта..."
10015005-117 = ""
10015005-123 = ""
10015005-124 = "Ноа, вкус какой-то странный. Ты уверена, что заварила чёрный чай?"
10015005-125 = "Кофеин действует... прямо противоположно... тому, как должен..."
10015005-126 = ""
10015005-128 = ""
10015005-135 = "Всё по плану."
10015005-136 = "Юке сейчас нужны не дополнительные 1850 секунд работы, а отдых."
10015005-137 = "[s] «Что ты подмешала ей в чай?!»"
10015005-138 = "Можете не хмуриться. Это всего лишь травяной чай."
10015005-139 = "Он снимает тревожность и помогает заснуть."
10015005-140 = "Но я и правда не ожидала, что она просто свалится вот так."
10015005-141 = "Должно быть, она переработала ещё сильнее, чем я думала."
10015005-142 = "[s] «Но как же подготовка к спортивному фестивалю?»"
10015005-143 = ""
10015005-145 = ""
10015005-146 = "Я понимаю, что многого прошу, но именно поэтому вы нам и нужны, Сенсей."
10015005-147 = "Я хочу попросить вас помочь сделать так, чтобы Фестиваль Хало в Кивотосе прошёл гладко."
10015005-148 = "[s] «Это отличается от просьбы Юки?»"
10015005-149 = "Совершенно. Расследованием краж может заняться Полицейская школа «Валькирия»."
10015005-150 = "Я знаю, Юке это не понравится. Она хотела, чтобы со всеми аспектами подготовки справлялись студенты «Миллениума»."
10015005-151 = "Но, как я уже сказала, этот спортивный праздник готовят все студенты Кивотоса и для всех студентов Кивотоса."
10015005-152 = "И когда я говорю «всех студентов», я имею в виду и Юку тоже."
10015005-153 = "Она никогда в этом не признается, но никто не работал над этим больше и не ждал фестиваля сильнее Юки. А если она будет валиться с ног, то и насладиться им не сможет."
10015005-154 = "Как самопровозглашённая лучшая подруга Юки, я просто не могу этого допустить."
10015005-155 = "[s7] «На такое я не могу ответить отказом...» \n[s8] «Чем я могу помочь?»"
10015005-158 = "Хи-хи. Спасибо, Сенсей."
10015005-159 = "Шаг первый! Найдём студентов, которые помогут нам, пока Юука не проснулась."