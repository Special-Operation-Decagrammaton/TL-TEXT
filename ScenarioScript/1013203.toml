[translation]
1013203-1 = "Снова в модели...?!"
1013203-2 = "Кабинет директора художественной школы"
1013203-3 = "В-Вы пришли, Сенсей."
1013203-4 = "[s] «Что случилось, Цукуё?»"
1013203-5 = "Ну..."
1013203-6 = "М-Меня в этот раз наняли моделью для художественной школы."
1013203-7 = "Но я никогда раньше не работала моделью вот так... совсем вблизи."
1013203-8 = "Поэтому я подумала, что если вы будете рядом, мне, возможно, станет немного спокойнее..."
1013203-9 = ""
1013203-11 = ""
1013203-12 = "П-Погодите, я не слишком многого прошу? Не обременяю вас своими личными проблемами?"
1013203-13 = "П-Простите меня...!"
1013203-14 = "[s] «В-Всё нормально, Цукуё...!»"
1013203-16 = "[ns] «Но ты опять работаешь моделью...?!»"
1013203-17 = "П-По правде говоря..."
1013203-18 = "Вы помните менеджера, который подарил мне рекламный буклет к «У ниндзя семь жизней»?"
1013203-19 = ""
1013203-23 = "Он буквально умолял меня помочь ему всего с ещё одной работой..."
1013203-24 = "Похоже, модель, которую они наняли для этого заказа... сбежала навстречу приключениям или что-то вроде того."
1013203-25 = "А за такой короткий срок ему было очень трудно найти замену..."
1013203-26 = "Всё ведь довольно просто, правда? Мне нужно всего лишь совершенно неподвижно стоять, поэтому..."
1013203-27 = "[s1] «Понятно...!»\n[s2] «А я уж подумал, что ты решила стать художницей! Хотя это тоже неплохо.»"
1013203-30 = "К-Конечно нет!"
1013203-31 = "Моя единственная мечта — стать настоящей ниндзя!"
1013203-32 = "Что? А, почему я сегодня в платье?"
1013203-33 = "Ну, тема для студентов — «женщина в платье». ...Я стараюсь соответствовать заданию."
1013203-34 = "П-Поэтому заранее его надела."
1013203-35 = ""
1013203-39 = "Госпожа Цукуё? Не могли бы вы пройти в класс?"
1013203-40 = ""
1013203-42 = ""
1013203-43 = "С-Сейчас!"
1013203-44 = "Я-я скоро вернусь, Сенсей!"
1013203-46 = "Класс художественной школы"
1013203-49 = ""
1013203-50 = "А, вы, должно быть, модель на замену, госпожа Оно Цукуё."
1013203-51 = "О, да! Да, это я."
1013203-52 = "Раз вы здесь впервые, давайте объясню, что вам нужно будет делать..."
1013203-53 = "Вы будете позировать для подготовительного класса Академии искусств Вайлдхант."
1013203-54 = "Если точнее, студенты будут делать с вас наброски."
1013203-55 = "Я помогу выбрать точную позу, а вам останется только не двигаться."
1013203-57 = "П-Поняла!"
1013203-58 = "Я-я впервые делаю что-то подобное, но постараюсь изо всех сил!"
1013203-59 = "Ха-ха, не нужно так нервничать. Волноваться не о чем."
1013203-60 = ""
1013203-62 = ""
1013203-64 = "(...Надо хоть как-то её успокоить, даже если я сам в это не верю. Легко не будет. Никто ОТ ПРИРОДЫ не умеет хорошо позировать для художников.)"
1013203-65 = "(Если уж на то пошло, совершенно неподвижно стоять сложнее, чем ходить по подиуму или быстро менять позы на фотосессии.)"
1013203-67 = ""
1013203-68 = "(Она полностью разрушила мои ожидания!)"
1013203-69 = "(Она уже больше часа не сдвинулась ни на сантиметр!)"
1013203-70 = ""
1013203-72 = ""
1013203-74 = ""
1013203-75 = "Эм, модель ведь настоящий человек, да?"
1013203-76 = "О! А я думала, это манекен."
1013203-77 = "Ты серьёзно не знаешь? Это та самая модель, которая в последнее время наделала столько шума! Что, журналы вообще не читаешь?"
1013203-78 = "Эй, и правда!"
1013203-79 = ""
1013203-81 = ""
1013203-82 = "(Хм...)"
1013203-83 = "(Я так переживала, а это гораздо проще, чем быть моделью на показе...)"
1013203-84 = "(Пожалуй, я привыкла стоять неподвижно лучше большинства людей...)"
1013203-85 = "(Хи-хи. Похоже, все тренировки по маскировке ниндзя наконец окупились!)"
1013203-86 = "(Она гений...! Просто невероятно!)"
1013203-87 = "(За десять лет преподавания я ни разу не видел настолько образцовую натурщицу...!)"
1013203-88 = "(Да её прямо сейчас можно поставить на пьедестал в музее — и будет идеально...!)"
1013203-89 = "(Даже выражение лица такое спокойное...!)"
1013203-90 = "(Откуда у неё такой талант?! Как она развила подобное мастерство?)"
1013203-92 = "Студенты закончили наброски, и занятие подошло к концу."
1013203-95 = "Большое спасибо за усердную работу!"
1013203-96 = "Хи-хи, да это было не так уж трудно..."
1013203-97 = "Должен сказать, вы справились с этим заданием совершенно естественно."
1013203-98 = "Вы правда никогда раньше не позировали для художников?"
1013203-99 = "А? О, эм, нет, это был первый раз..."
1013203-100 = "(Значит, это врождённый талант...! Настоящий самородок!)"
1013203-101 = "Тогда, если позволите..."
1013203-102 = "Стой!"
1013203-103 = "Если вы не против, не могли бы вы попозировать ещё для одного занятия?"
1013203-104 = "Прошу прощения...?"
1013203-105 = "Просто классу скульптуры тоже нужна модель...!"
1013203-107 = "Мы заплатим вдвое больше! Считайте это сверхурочными!"
1013203-108 = "Н-Ну..."
1013203-109 = "Честно говоря, госпожа Цукуё, я никогда не видел модели, которая могла бы оставаться настолько неподвижной."
1013203-110 = "Мы просто обязаны дать большему числу студентов возможность увидеть ваш талант."
1013203-111 = "Уверен, это поможет развить их художественные способности! Вы поможете раскрыть их потенциал!"
1013203-112 = "Пожалуйста!"
1013203-113 = "Ну, эм..."
1013203-114 = ""
1013203-116 = ""
1013203-117 = "Т-Тогда, пожалуй, я соглашусь..."
1013203-120 = "Так Цукуё стала моделью и для класса скульптуры."
1013203-121 = "И, разумеется, снова выступила безупречно."
1013203-122 = "А затем, несколько часов спустя..."
1013203-125 = "Спасибо вам за всю сегодняшнюю работу, госпожа Цукуё."
1013203-126 = "С-Спасибо и вам за помощь! Вы отлично всё объясняли!"
1013203-127 = ""
1013203-129 = ""
1013203-130 = ""
1013203-131 = "Простите, Сенсей! В-Вы давно ждёте...?"
1013203-132 = "[s] «Вовсе нет. Мне было интересно смотреть, как работают студенты.»"
1013203-133 = "В-Вы слишком добры. Спасибо за понимание."
1013203-134 = "Если честно, рядом с вами мне было намного спокойнее."
1013203-135 = "Что? Как мне понравилось занятие по скульптуре?"
1013203-136 = "Хм, думаю, оно было довольно похоже на занятие по рисунку, где с меня делали наброски..."
1013203-137 = "Если не считать всей этой пыли и засохшей глины в воздухе... Но скульптура ведь такая, да?"
1013203-138 = "Вообще-то мне, наверное, нужно прочистить горло..."
1013203-139 = "[s3] «Похоже, пылью и сухой глиной ты наелась вдоволь.»\n[s4] «Так что давай теперь поедим настоящей еды.»"
1013203-140 = ""
1013203-141 = ""
1013203-143 = ""
1013203-144 = "Э-Эм..."
1013203-145 = "Т-Тогда в этот раз я должна—"
1013203-146 = "[s] «Не переживай. Я уже забронировал столик!»"
1013203-147 = "П-Правда...?"
1013203-148 = "С-Спасибо, Сенсей!"
1013203-150 = "Я отвёл Цукуё в место, которое заранее забронировал."
1013203-151 = "Это был ресторан Хяккияко с большим и очень полезным вегетарианским меню."
1013203-152 = ""
1013203-154 = ""
1013203-155 = "Скажем так: у меня было предчувствие, что Цукуё снова будет работать моделью."
