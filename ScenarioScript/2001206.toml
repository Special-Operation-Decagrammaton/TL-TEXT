[translation]
2001206-1 = "На дежурстве"
2001206-2 = "После работы я отправился туда, где Сэна дежурила в режиме готовности.#nЭто был малолюдный мост неподалёку от места аварии."
2001206-3 = "Было уже довольно поздно, и других студентов вокруг не было."
2001206-4 = ""
2001206-7 = "Хм? Сенсей."
2001206-8 = "[s] «Сэна?»"
2001206-9 = "Уже поздно. Что вы делаете здесь в такой час?"
2001206-10 = "Не стойте там. Заходите внутрь и присоединяйтесь."
2001206-14 = "― У меня немного, но хотите?[wa:2200]"
2001206-16 = "― У меня только еда из магазина у дома."
2001206-19 = "― Когда я дежурю, времени куда-нибудь сходить нет,[wa:1260]"
2001206-21 = "― так что это лучшее, что я могу предложить.[wa:140]"
2001206-24 = "― В любом случае, Сенсей. Что привело вас сюда?[wa:2230]"
2001206-26 = "― Вам ведь совсем не по пути."
2001206-29 = "― А? Вы пришли проверить, как я, потому что я выглядела уставшей?[wa:2650]"
2001206-32 = "― Вот почему. Разумеется.[wa:2060]"
2001206-35 = "― Теперь я понимаю.[wa:700]"
2001206-37 = "― Спасибо, что заглянули ко мне, Сенсей.[wa:240]"
2001206-40 = "― Я не ожидала, что вы придёте сюда...[wa:1660]"
2001206-42 = "― но я всегда рада быть с вами.[wa:1720]"
2001206-46 = "Затем мы с Сэной вышли из дежурной машины и немного прогулялись вместе."
2001206-47 = ""
2001206-49 = ""
2001206-50 = "[ns1] «Я так и думал, что ты всё ещё работаешь.»\n[ns2] «Наверное, тяжело постоянно быть на экстренном дежурстве.»"
2001206-51 = "На самом деле всё нормально. Я не против этой работы."
2001206-52 = "На самом деле всё нормально. Я не против этой работы."
2001206-53 = "Больше всего меня до сих пор удивляет, что вы пришли меня навестить."
2001206-54 = "Я ценю вашу заботу, но я к такому привыкла."
2001206-55 = "Обычно в ожидании вызова я разбираю документы#nи проверяю, всё ли в порядке с нашими записями."
2001206-56 = "Мне гораздо легче работать, когда остальных нет рядом."
2001206-57 = "Многие наши участницы уже вернулись в медпункт, чтобы перевезти погибших."
2001206-58 = "То есть раненых. У них были лишь лёгкие травмы. Все ушли сразу после оказания помощи."
2001206-59 = "Так что теперь здесь только я."
2001206-60 = "Точнее, только мы вдвоём."
2001206-61 = "[s3] «Ты так много работаешь совсем одна?»\n[s4] «Ты уверена, что это тебе по силам?»"
2001206-62 = "Я слежу за тем, чтобы не переутомляться и всегда быть готовой действовать в любую минуту."
2001206-63 = "Я слежу за тем, чтобы не переутомляться и всегда быть готовой действовать в любую минуту."
2001206-64 = "Я знаю, какую усталость способна выдержать. Поэтому спокойно работаю во время дежурства."
2001206-65 = ""
2001206-67 = ""
2001206-68 = "Спасибо, что снова так обо мне беспокоитесь. Мне приятно, что вам не всё равно."
2001206-69 = "Хотя теперь я немного не знаю, чем занять время."
2001206-70 = "Вы проделали весь этот путь, чтобы проверить, как я, но пока я на дежурстве, для вас почти ничего не могу сделать."
2001206-71 = ""
2001206-73 = ""
2001206-74 = ""
2001206-75 = ""
2001206-76 = ""
2001206-77 = ""
2001206-78 = "Хотите немного? Мне неловко предлагать то, что я раньше не доела, но больше у меня ничего нет."
2001206-79 = "[s5] «Всё нормально. Я не голоден.»\n[s6] «Тебе вовсе не обязательно меня чем-то угощать!»"
2001206-80 = "Правда? Хорошо."
2001206-81 = "..."
2001206-82 = "Полагаю, делиться чем-то подобным было бы не слишком гигиенично."
2001206-83 = ""
2001206-84 = "Знаете... иногда мне трудно выражать свои чувства.#nПусть по мне и не скажешь, но сегодняшний вечер меня очень радует."
2001206-85 = "Я подумала, что было бы замечательно почаще вот так разговаривать поздними вечерами."
2001206-86 = "Было бы здорово рассказывать друг другу, что произошло за день, и обсуждать будущее, когда есть время."
2001206-87 = "Хотя, возможно, слишком далеко вперёд заглядывать трудно."
2001206-88 = "Хм? Я сказала что-то не то?"
2001206-89 = ""
2001206-91 = ""
2001206-92 = "Тогда я остановлюсь. Ах, теперь понимаю."
2001206-93 = "Я снова была слишком прямолинейна, как вы это называете."
2001206-94 = "Мне хотелось бы думать, что я просто освежающе честна.#nНо простите, если вам от этого неуютно."
2001206-95 = "Не в этом дело? Ох. Тогда я рада это слышать."
2001206-96 = "Мы всегда можем поговорить о чём-нибудь другом."
2001206-97 = "Или..."
2001206-98 = "...а может, я уже сказала всё, что нужно."
2001206-99 = "Вы уже заметили, насколько прямолинейной я бываю."
2001206-100 = "Наверное, поэтому я и выбрала эту профессию.#nЭкстренная помощь требует точного и ясного общения."
2001206-101 = "Но рядом с вами... мне кажется, я могу расслабиться и никуда не спешить.#nУверена, вы понимаете, что я имею в виду."
2001206-102 = "Возможно, поэтому..."
2001206-103 = ""
2001206-105 = ""
2001206-106 = ""
2001206-107 = "...у меня есть определённые ожидания от вас."
2001206-109 = "Мы с Сэной ещё немного поболтали, пока её ночная смена не закончилась."
2001206-110 = "К счастью, ночь прошла спокойно и без новых происшествий."
