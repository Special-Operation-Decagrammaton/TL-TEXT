[translation]
10045060-1 = "Эпизод 6;Матч на возвращение: Пляжный волейбол"
10045060-2 = "Добро пожаловать обратно! Надеюсь, все хорошо отдохнули."
10045060-3 = "Но времени на отдых больше нет! Пусть начнётся первый матч на возвращение в этом турнире по пляжному волейболу!"
10045060-4 = "Игроки, выходите на площадку!"
10045060-8 = ""
10045060-12 = ""
10045060-14 = "Матч на выбывание. Кто первым наберёт 10 очков — победил!"
10045060-15 = "В этой напряжённой борьбе достаточно опередить соперника всего на одно очко, чтобы одержать победу!"
10045060-16 = "[ns] «Первая подача определится в „Камень, ножницы, бумага“!»"
10045060-17 = "Капитаны команд, выйдите вперёд!"
10045060-18 = ""
10045060-20 = ""
10045060-23 = ""
10045060-24 = "Кекеке. Я ставлю камень."
10045060-25 = "Хм, психологическая игра?"
10045060-26 = "Нет, вовсе нет! Я правда поставлю камень! Так что если хочешь победить, смело ставь бумагу. Всё честно!"
10045060-27 = "...Камень. Понятно."
10045060-28 = ""
10045060-29 = "[ns] «Камень, ножницы... бумага!»"
10045060-31 = "Камень! Юность всегда побеждает! ...А?!"
10045060-32 = "Кекеке! Будто я стану играть честно! Ты повелась! Бумага побеждает!"
10045060-33 = ""
10045060-34 = "...Прости, Кикё."
10045060-35 = "Это ничего не меняет. Мы быстро отыграемся. Мы ведь Хяккарёран, не так ли?"
10045060-37 = "У-у-у, хотя бы это прошло хорошо. Но что теперь? Что нам делать против таких монстров?"
10045060-38 = "Конечно, у меня есть идея."
10045060-39 = "Эта надменная Кикё ведь потеряла сознание, когда упала в воду, да?"
10045060-40 = "Наверняка она ещё восстанавливается. Значит, воспользуемся этим и будем целиться в неё!"
10045060-41 = "Эм... Я не очень хочу так делать..."
10045060-43 = "А теперь занимайте позиции!"
10045060-44 = "Пусть это будет честный бой!"
10045060-45 = ""
10045060-48 = "Получи! Амбициозный шип ярости!"
10045060-49 = ""
10045060-51 = ""
10045060-54 = ""
10045060-57 = "Уф!"
10045060-59 = "Ай! Мяч попадает в Кикё и улетает за пределы площадки!"
10045060-60 = "Первое очко получают Нарушительницы!"
10045060-61 = "Кеке. Я так и знала. Ты слабое звено."
10045060-62 = "Что значит... «слабое звено»?"
10045060-63 = "В нашей работе учишься читать людей. Мне достаточно посмотреть на тебя — и я уже всё про тебя знаю."
10045060-64 = "Дай угадаю, о чём ты думаешь."
10045060-66 = "«Я совсем не помогла своей команде.»"
10045060-67 = "«Только я тяну их назад.»"
10045060-68 = "Ну, я понимаю. Если бы не ты, им вообще не пришлось бы сейчас здесь быть после выбывания."
10045060-69 = "...!"
10045060-70 = "Она просто пытается тебя задеть, Кикё!"
10045060-71 = "...Я не из тех, кто попадается на такие дешёвые приёмы. Не переживай."
10045060-72 = "Хмф. Тогда получи!"
10045060-73 = ""
10045060-75 = ""
10045060-78 = ""
10045060-79 = "Ух...!"
10045060-81 = "Мяч в воздухе! Это главное. Я достану!"
10045060-82 = ""
10045060-85 = "Добивай, Кикё!"
10045060-86 = "Поняла!"
10045060-88 = "Эй! Енот! Блокируй!!"
10045060-89 = "Я-Я?! Ты меня енотом назвала?!"
10045060-90 = ""
10045060-94 = ""
10045060-95 = ""
10045060-96 = "Ик...?!"
10045060-97 = ""
10045060-99 = ""
10045060-101 = "Неожиданный, но эффективный блок лицом от Араты! Нарушительницы теперь ведут на 2 очка!"
10045060-102 = "Ах..."
10045060-103 = "Кекеке. Идеально! Пока придерживаемся этой стратегии...!"
10045060-104 = "Что тут идеального?! *шмыгает* У меня нос кво-овит..."
10045060-105 = "И что? Очко-то наше! Мы лучше них!"
10045060-106 = "Нужно просто продолжать бить по их слабому месту!"
10045060-108 = "..."
10045060-109 = "Ты вообще понимаешь, с кем разговариваешь?! Я заставлю тебя пожалеть о дне, когда ты посмела говорить свысока с Хяккарёран!"
10045060-111 = "Так жаркий матч продолжился."
10045060-112 = ""
10045060-122 = "Ого! И на этом первый матч окончен!"
10045060-123 = "Какие напряжённые розыгрыши! Я даже моргать боялась!"
10045060-124 = "*тяжело дышит* *задыхается*..."
10045060-125 = "..."
10045060-127 = "Фу... Фу-фу-фу..."
10045060-128 = "Мне конец..."
10045060-130 = "Финальный счёт — 10:7!"
10045060-131 = "Команда Хяккарёран №1 вырывает победу в первом матче!"
10045060-132 = "Они... правда сильные..."
10045060-133 = "Я говорила тебе это... с самого начала..."
10045060-134 = ""
10045060-136 = ""
10045060-139 = "А теперь послематчевое интервью!"
10045060-140 = "[ns] «Рэнгэ сегодня просто сияла!»"
10045060-141 = "Я лишь делала то, что могла."
10045060-142 = "В какой-то момент ваша команда полностью захватила контроль над площадкой. Как думаете, что стало переломным моментом?"
10045060-143 = "Они перешли на личности. Тогда я почувствовала, что просто НЕ МОГУ проиграть этим двоим."
10045060-144 = "Я изобью любого, кто оскорбит моих друзей!"
10045060-146 = "..."
10045060-147 = "Похоже, состояние Кикё ухудшается..."
10045060-148 = "И её взаимодействие с Рэнгэ в бою было не таким, как обычно."
10045060-149 = "Вот как..."
10045060-150 = "Наверное, ей тяжело пережить то, что произошло раньше."
10045060-151 = "Есть ещё кое-что, что я должна обсудить с тобой, Юкари."
10045060-152 = "Правая рука напряжена. Возможно, я перенапряглась во время матча на катере."
10045060-153 = "Т-Тогда нам нужно к врачу—"
10045060-154 = "Не нужно. Со временем пройдёт. Я просто хотела, чтобы ты знала."
10045060-155 = "А! Поняла! Я поднимусь на высоту вместо твоей заживающей правой руки!"
10045060-156 = ""
10045060-157 = "...Так вот в чём дело."
10045060-158 = "Хм? Что-то не так?"
10045060-159 = "Похоже, Нагуса не в лучшей форме. Я немного за неё переживаю."
10045060-160 = "А? Ты можешь понять это, просто посмотрев?"
10045060-161 = "Фуфу, у меня свои способы."
10045060-163 = "Пора второго матча! Игроки, выходите на площадку!"
10045060-167 = ""
10045060-171 = ""
10045060-173 = "Итак, проведём честный бой!"
10045060-175 = "Так начался второй матч."
10045060-176 = ""
10045060-185 = "Это была игра века."
10045060-186 = ""
10045060-187 = ""
10045060-188 = ""
10045060-190 = "Ах, неужели слухи правдивы? Мимори будто читает каждое движение соперника!"
10045060-191 = "Отличная связка! И этим великолепным розыгрышем они получают ещё одно очко против Хяккарёран!"
10045060-192 = "...Она права. Она очень умело предугадывает нас."
10045060-193 = "Читает мысли..."
10045060-194 = "Значит, если будем слишком много думать, проиграем!"
10045060-195 = "В таком случае..."
10045060-196 = "Очистим разум!"
10045060-197 = "Как танцующей мико моим телом будет управлять лёгкий ветер!#nКак падающие лепестки сакуры, я отдам себя воле природы!"
10045060-198 = "Я Юкари, и всё же я — не я!"
10045060-199 = "Следующая подача у Хяккарёран!"
10045060-200 = "Неси меня, ветер!"
10045060-201 = ""
10045060-208 = ""
10045060-209 = "О-о, ход игры изменился."
10045060-210 = "Согласна. Юкари и Нагуса двигаются в плавной синхронизации."
10045060-211 = "А я, с другой стороны..."
10045060-212 = "Эй, эй. Ты всё ещё дуешься из-за этого?"
10045060-213 = "Не будь к себе такой строгой. Никто не идеален, даже ты."
10045060-214 = "Переживания и рост — всё это часть нашей юности!"
10045060-216 = "..."
10045060-217 = "Ладно. Как тебе такое, Кикё?"
10045060-218 = "Победим мы или проиграем — после этого матча я научу тебя плавать."
10045060-219 = "Научишь... меня? Плавать?"
10045060-220 = "Ага, тебя. Это будет несложно. Ты всегда быстро всё схватываешь. И тогда у тебя не останется причин бояться воды."
10045060-221 = "...Откуда у тебя такая безосновательная уверенность во мне?"
10045060-222 = "Мы с тобой... давно рядом друг с другом, разве нет?"
10045060-224 = "Разве этого недостаточно?"
10045060-225 = ""
10045060-227 = ""
10045060-228 = "...Полагаю, я хорошо знакома с твоей нелепо доброй натурой."
10045060-229 = ""
10045060-232 = ""
10045060-233 = "Какой финал такого ожесточённого матча!"
10045060-234 = "Обе стороны выложились полностью! Кажется, у меня мурашки."
10045060-235 = "Счёт 10:8. Двое, кто пройдёт в финал из этого матча на возвращение..."
10045060-236 = "[ns] «Нагуса и Юкари!»"
10045060-237 = ""
10045060-238 = ""
10045060-239 = ""
10045060-240 = ""
10045060-241 = ""
10045060-242 = ""
10045060-243 = ""
10045060-244 = "..."
10045060-245 = ""
10045060-247 = "(Наша дружба с Рэнгэ долгая и глубокая.)"
10045060-248 = "(Да, наши характеры — день и ночь. Но я знаю её так же хорошо, как линии на своей ладони.)"
10045060-249 = "(...Ради таких отношений я должна отдать всё, что у меня есть.)"
10045060-250 = "(Я отказываюсь дальше идти по пути бесполезности.)"
10045060-251 = "(Мы должны победить.)"
10045060-252 = "(Не ради меня, а ради Рэнгэ!)"
