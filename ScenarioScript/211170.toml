211170-399 = "Y-yes! Please do!"
211170-400 = "To think it wasn't a prank..."
211170-401 = "..."
211170-402 = "Anyway, we'll keep doing what we can."
211170-403 = "If we stop, everyone will go hungry."
211170-404 = "[s] \"Thank you. Take care.\""
211170-405 = "Sensei... please be careful."
211170-406 = "If there's anything we can do, please call us anytime!"
211170-409 = "(The two from the School Lunch Club were the same as always.)"
211170-410 = "(People who changed and people who didn't... what's the difference?)"
211170-415 = "Sensei, did you hear that earlier?"
211170-416 = "I have no idea what's going on!"
211170-417 = "It's normal for the Pandemonium Society to say weird things, but I can't believe the Prefect Team went along with it."
211170-418 = "It was a prank~! Everyone got fooled~!"
211170-419 = "...I wonder when they'll reveal that? #nI think it's about time they did..."
211170-420 = "[s] \"Actually...\""
