[translation]
211170-1 = "Эпизод 17;Наследие прошлого"
211170-2 = "Речь закончилась, но я всё ещё не мог прийти в себя."
211170-3 = "Я решил, что для начала нужно понять, что вообще происходит."
211170-4 = ""
211170-7 = "[ns1] «Мне... НУЖНО найти Хину».\n[ns2] Отправиться в штаб Префектуры."
211170-13 = ""
211170-14 = "А... Сенсей."
211170-15 = "Сенсей..."
211170-16 = "...Вы пришли из-за того, что произошло на митинге?"
211170-17 = "[s3] «Да».\n[s4] «...С этими двумя всё в порядке?»"
211170-18 = ""
211170-19 = ""
211170-21 = ""
211170-22 = "...Нет..."
211170-23 = "Я... тоже совершенно растеряна."
211170-24 = "Мы же знаем, что Хина никогда бы такого не сказала."
211170-25 = "Она не только пожала руку председателю Макото, что само по себе безумие, но ещё и заговорила о войне со всем Кивотосом...? Будто какой-то дурной розыгрыш!"
211170-26 = "Не может же она говорить всерьёз? Наверняка они заключили какое-то... тайное соглашение, о котором нам не сообщили."
211170-27 = "Как бы то ни было, вы пришли как раз вовремя."
211170-28 = "Мы тоже собирались поговорить с ней. Пойдёмте вместе."
211170-29 = ""
211170-36 = ""
211170-39 = ""
211170-40 = "О, Сенсей. Добро пожаловать."
211170-41 = "Сегодня великий день, и я рада разделить эту радость с вами."
211170-42 = "Фу-фу. Вы видели меня сегодня на площади?"
211170-43 = "[s] «...Ты действительно имела это в виду?»"
211170-44 = ""
211170-46 = ""
211170-47 = "А... Разумеется. Я ведь не из тех, кто любит шутить."
211170-48 = "..."
211170-49 = "Сенсей, вы напряжены сильнее обычного... Что-то случилось?"
211170-50 = "[s] («...С чего же начать...?»)"
211170-51 = "Глава Префектуры, это что, розыгрыш? Над ВСЕЙ Геенной?"
211170-52 = "Вы с Макото всё спланировали, чтобы устроить сюрприз, или...?"
211170-53 = "Что ты имеешь в виду, Иори?"
211170-54 = "Послушайте! Ничего не сходится!!! «Завоевать Кивотос»? Вы всерьёз хотите объявить войну всему Кивотосу?!"
211170-55 = "Просто скажите, что это шутка! Я даже посмеюсь, и мы забудем об этом!"
211170-56 = ""
211170-58 = ""
211170-60 = ""
211170-61 = "Милая Иори, неужели ты всё ещё не понимаешь?"
211170-62 = "ЧЕГО я не понимаю?!"
211170-63 = "Истинного предназначения Префектуры! Пробудившейся цели Геенны!"
211170-64 = "Наша воля, закалённая железом и кровью, должна устремиться за пределы наших границ! Мы расширим жизненное пространство и установим истинный порядок во всём Кивотосе. Что ещё нам остаётся делать?"
211170-65 = "Старший администратор Ако, вы серьёзно?!"
211170-66 = "Уф, как же это раздражает. Иори, Чинацу. Почему вы не понимаете?"
211170-67 = "Если даже этот одержимый величием председатель осознал истину, почему до вас двоих так туго доходит...?!"
211170-68 = ""
211170-70 = ""
211170-72 = ""
211170-73 = "Что вас обеих не устраивает?"
211170-74 = ""
211170-77 = ""
211170-78 = "Это ненормально... Как вы вообще можете хотеть начать войну со всем Кивотосом?"
211170-79 = "Мы никогда об этом не говорили. Префектура существует совсем не для этого..."
211170-80 = "Вы... Вы же говорили, что мы проводим черту, которую нельзя переступать..."
211170-82 = "Я тебя слышу. Ты права."
211170-83 = ""
211170-85 = ""
211170-87 = "Я поклялась не позволить Геенне переступить эту черту."
211170-88 = "Но теперь черта, которую мы проводим, сама становится Геенной."
211170-89 = "Если каждый сантиметр земли под нашими ногами будет принадлежать Геенне, никто не сможет переступить эту черту."
211170-91 = "Э-Это..."
211170-92 = "Глава...!"
211170-93 = ""
211170-95 = ""
211170-97 = ""
211170-98 = "[ns] «Хина... Ако... Почему вы изменились?»"
211170-99 = "Сенсей..."
211170-100 = "Похоже, вы ещё не познали истину."
211170-101 = "Впрочем, я понимаю ваше замешательство. Я и сама осознала всё только сегодня."
211170-102 = "Нет, пожалуй, правильнее сказать, что я «вспомнила»...? Ведь я всегда это знала."
211170-103 = "...Решимость объединить силы Геенны и завоевать Кивотос."
211170-104 = "...Великое и славное стремление, которое дремало внутри нас."
211170-105 = "Фу-фу... Да. Со мной то же самое."
211170-106 = "Кажется, я вдруг пробудилась. Честно говоря, не понимаю, как могла столько времени не замечать нашего предназначения."
211170-107 = "Оно настолько очевидно, что даже этот председатель-болван его разглядел."
211170-108 = "Геенна, объединившаяся под единым знаменем, станет непобедимой. Фу-фу."
211170-109 = "...Если вы продолжите в том же духе, я уже не смогу считать это шуткой, знаете ли."
211170-110 = ""
211170-112 = ""
211170-113 = "Чинацу, тебе кажется, что я сейчас шучу?"
211170-114 = "Если вы и правда серьёзно, тогда у нас проблема куда серьёзнее!"
211170-115 = ""
211170-117 = ""
211170-118 = "Ух! ДА ВЫ ИЗДЕВАЕТЕСЬ?!"
211170-119 = "Что на вас нашло?! Почему вы ведёте себя так, словно ничего не понимаете? Мы ведь должны действовать сообща, как единое целое!"
211170-120 = "Разве это не естественно?! Разве не очевидно?! Вы же знаете, что Геенна должна сделать!"
211170-122 = "Завоевать Кивотос?!"
211170-123 = "Мы взяли в руки оружие не для того, чтобы топтать других, будто какие-то диктаторы!"
211170-124 = "«Защищать студентов, которые хотят спокойно учиться»...! Разве не ради этого мы работаем?!"
211170-125 = "Хина, которую я знала, всегда с опаской относилась к тем, кто бездумно злоупотребляет силой. С вами двумя что-то НЕ ТАК. Вы сами на себя не похожи."
211170-126 = ""
211170-128 = ""
211170-130 = ""
211170-131 = "Мы не двойники, Чинацу. Но да, возможно, мы изменились."
211170-132 = ""
211170-135 = ""
211170-137 = "Мои мысли сейчас ясны, как никогда, и я чувствую необыкновенную свежесть. Лишь освободившись от этого груза, я поняла, какое тяжёлое утомление давило на меня прежде."
211170-138 = "Меня мучили сомнения, ведь вместо того, чтобы выйти на предначертанное нам поле битвы, я занималась поддержанием мелочного порядка внутри этих тесных стен."
211170-139 = "Моя нерешительность и колебания отравляли жизнь и мне, и всей Геенне."
211170-141 = "Глава Префектуры... Прошу вас..."
211170-143 = "Не волнуйся. Когда знамя Геенны взовьётся в каждом уголке Кивотоса, все конфликты исчезнут. Тогда и наступит истинный порядок."
211170-145 = "...Глава Префектуры...!!!"
211170-146 = "[s] «Давайте немного передохнём»."
211170-147 = ""
211170-149 = ""
211170-150 = ""
211170-152 = ""
211170-153 = "[ns] «Я уведу этих двоих с собой»."
211170-154 = "Пожалуйста, Сенсей."
211170-155 = "Позаботьтесь о них, Сенсей. Похоже, они всё ещё растеряны."
211170-156 = ""
211170-163 = ""
211170-164 = "..."
211170-165 = "..."
211170-166 = "Не понимаю... Почему, как... Что происходит...?"
211170-167 = "Сенсей... Что... нам делать...?"
211170-168 = "[s5] «Я попробую во всём разобраться».\n[s6] «А вы пока отдохните»."
211170-171 = "М-м..."
211170-172 = "...Как страшный сон. Ненавижу... когда не можешь проснуться от кошмара."
211170-173 = "[s] «...»"
211170-175 = "Я решил навестить Пандемониум."
211170-176 = ""
211170-183 = "Что ты задумала?!"
211170-186 = "[ns] «...Здесь то же самое...»"
211170-189 = "Хватит устраивать представления. Ты зашла слишком далеко. Как ты могла нести такую чушь?!"
211170-190 = "Да ещё по школьному радио! Каждый студент наверняка услышал твой бред о мировом господстве!"
211170-191 = "Замолчи, Ироха! Что это ты называешь «чушью»?!"
211170-192 = "То есть ты считаешь это разумным? Мы должны завоевать Кивотос? Потому что это якобы законные владения Геенны?"
211170-193 = "Лучше бы хвасталась собой, как обычно, помешанная на величии дурища! Вот тебе и «исторический момент»!"
211170-194 = "И уж историческим он точно станет! Как самая чудовищная и кровавая ошибка за всю историю Геенны!"
211170-195 = ""
211170-197 = ""
211170-199 = "И-Ироха... Успокойся..."
211170-200 = "Ироха, Макото... Вы ссоритесь...?"
211170-202 = ""
211170-205 = ""
211170-206 = "...Чиаки. Уведи Ибуки на улицу."
211170-207 = ""
211170-210 = ""
211170-211 = "...Сейчас же!"
211170-212 = ""
211170-217 = "Ибуки, давай выйдем, чтобы они могли поговорить. Они не ссорятся! Это... спектакль!"
211170-218 = "Не ссорятся. Ссориться плохо..."
211170-221 = ""
211170-222 = "Ну что ж. Ироха, неужели моё священное решение показалось тебе лишь бредом безумца?"
211170-223 = "Да! Не священным, а безумным! Что нам даст война против всего Кивотоса? Бюджет? Власть? Нет, нас ждёт самоубийственная авантюра!"
211170-224 = "Нет, нет, нет! Какая же ты глупая, Ироха!!!"
211170-225 = "Вот как?"
211170-226 = "Неужели ты до сих пор не понимаешь, что всё это время Геенна стояла на шатком фундаменте мнимого мира? Позор, что Геенна месяцами боялась обидеть другие академии и вязла во внутренних дрязгах!"
211170-227 = "Это называется обычной дипломатией! Даже если мы не всегда ладим, мы понимаем, какую черту нельзя переступать."
211170-228 = ""
211170-230 = ""
211170-232 = "Мы разрушим этот прогнивший порядок и построим новый мир под властью Геенны, закалённой железом и кровью! Вот это и есть настоящая политика. Неужели не понимаешь?"
211170-233 = ""
211170-235 = ""
211170-236 = "Нет..."
211170-237 = "...Макото, зачем ты это делаешь? Что на тебя сегодня нашло?"
211170-238 = "Ки-хе-хе... Ироха, твоему недальновидному взору это может казаться странным."
211170-239 = "Сегодня я, Ханума Макото, стала «совершенной»! Меня охватил внезапный, неистовый прилив воли!"
211170-240 = "Что ты...?"
211170-241 = "Разве ты не видела, как даже ужасная глава Префектуры Сорасаки Хина покорилась мне? Она признала мою великую цель."
211170-242 = "Вот именно! В этом-то и проблема! Обычно она бы только посмеялась над твоей чушью!"
211170-243 = "Что ты с ней сделала? Сацуки, неужели тебе наконец-то удалось кого-нибудь загипнотизировать?"
211170-244 = ""
211170-246 = ""
211170-248 = ""
211170-249 = ""
211170-250 = "...!!!"
211170-251 = "...Не может быть..."
211170-253 = "Другого объяснения я не вижу...!"
211170-254 = "Хмф. Ты лишь увидела, как Хина наконец-то осознала свой долг."
211170-255 = "Вот увидишь, Ироха. Все твои сомнения вскоре рассеются перед объединённой мощью Геенны."
211170-256 = "...Так ты всерьёз... Макото..."
211170-257 = "Я всегда серьёзна, Ироха. Ты меня прекрасно знаешь."
211170-258 = "Да. Знаю. ...Знаю."
211170-259 = ""
211170-264 = ""
211170-265 = "..."
211170-266 = "..."
211170-267 = "Ц. Почему Ироха так остро реагирует?#nЯ ведь ещё даже не упомянула блицкриг..."
211170-268 = "Силы Геенны должны оставаться едины. Мы вот-вот начнём священный поход."
211170-269 = "..."
211170-272 = "[ns] Уйти прочь."
211170-273 = ""
211170-277 = "Выходит, в Пандемониуме тоже произошёл раскол."
211170-278 = "...Хотя мне не хотелось верить собственным ушам, Макото и Хина говорили совершенно серьёзно..."
211170-281 = "..."
211170-282 = ""
211170-286 = "[ns] «Ироха»."
211170-287 = ""
211170-289 = ""
211170-290 = "Сенсей."
211170-291 = ""
211170-293 = ""
211170-294 = "...Вы были здесь. Слышали наш разговор?"
211170-297 = "А. Понятно..."
211170-298 = "Как всё могло дойти до такого? Не понимаю, что произошло..."
211170-299 = "Сенсей, вы ведь знаете, что Макото бывает рассеянной и ненадёжной... но она не... Это на неё не похоже."
211170-300 = "[s] «Я знаю.»"
211170-301 = "*вздох* ...Как мне вообще объяснить всё это Ибуки...?"
211170-302 = ""
211170-304 = ""
211170-305 = "...Она ведь не собирается воплощать всё это в жизнь, правда?"
211170-306 = "[s] «Попробую выяснить, что происходит»."
211170-307 = "...Пожалуйста. Кажется, сейчас я могу положиться только на вас..."
211170-310 = "Я решил, что Ирохе стоит побыть рядом со студентами, которых перемены не затронули. И предложил ей остаться с Иори и Чинацу."
211170-311 = "[ns7] «...»\n[ns8] («Надо проверить, как дела у остальных клубов».)"
211170-312 = ""
211170-313 = ""
211170-319 = ""
211170-321 = ""
211170-323 = ""
211170-324 = ""
211170-325 = "Добро пожаловать, Сенсей."
211170-326 = "Простите, что не предлагаю угощения, но у нас сейчас полно работы."
211170-327 = "[s9] «Всё нормально, Сэна».\n[s10] «Вижу, вы заняты. Что случилось?»"
211170-330 = "А, да. Мы как раз согласовываем последние приготовления."
211170-331 = "«К чему готовимся»? Мне казалось, это очевидно."
211170-332 = "К обеспечению войск во время завоевания Кивотоса. Запасов потребуется много: нам предстоит оказывать первую помощь и вывозить тела... НЕТ, я хотела сказать... «пациентов» с поля боя."
211170-333 = "[s] «...Ты ведь серьёзно... да?»"
211170-334 = "А разве я когда-нибудь шучу? Нужно быть готовыми ко всему. Эта война может дойти до самых отдалённых земель."
211170-335 = "Хотя политика меня мало интересует и я в ней почти ничего не понимаю, меня радует, что Пандемониум и Префектура наконец действуют сообща."
211170-336 = "Теперь, когда Геенна объединилась, мы объявим священную войну Кивотосу."
211170-337 = "Скоро начнётся славная завоевательная война. Прошу вас поддержать нас, Сенсей."
211170-338 = "[s] «...Я зайду позже, Сэна»."
211170-339 = "Хорошо. Берегите себя."
211170-340 = ""
211170-344 = ""
211170-345 = "А... Сенсей."
211170-346 = ""
211170-349 = ""
211170-350 = "Сенсей, пусть ваш визит и был коротким... знайте, я всегда благодарна за то, что вы рядом."
211170-351 = "[s] «...И я благодарен за то, что ты рядом, Сэна»."
211170-354 = "[ns] «...»"
211170-357 = ""
211170-358 = "Фух, наконец-то закончила обжаривать лук."
211170-359 = "...Но разве сейчас мне стоит заниматься именно этим...?"
211170-360 = "..."
211170-361 = "Хм... Впрочем, какая разница. Каждый помогает чем может."
211170-362 = "[s] «Привет, Фуука»."
211170-363 = ""
211170-365 = ""
211170-366 = "А, Сенсей!"
211170-367 = "Ура! Здравствуйте! Хи-хи."
211170-368 = "Привет! Добро пожаловать, Сенсей!"
211170-369 = "[s11] «Привет, Джури».\n[s12] «...У вас здесь всё хорошо?»"
211170-370 = ""
211170-371 = ""
211170-373 = ""
211170-374 = "А... Да! У нас всё замечательно."
211170-375 = "Только плачем над луком да готовим еду!"
211170-376 = "[s] «Вы... слышали объявление по громкой связи?»"
211170-377 = "А... Вы про выступление председателя Макото?"
211170-378 = "Где она говорила о завоеваниях и расширении территорий? Да. Я как раз об этом думала..."
211170-379 = "Д-да. Мягко говоря, я удивилась. Даже глава Префектуры Хина..."
211170-380 = "А вы как думаете, Сенсей? Наверняка это была ирония или что-то в этом роде? Всё ведь подстроено, правда?"
211170-381 = "...Хотя для такой «постановки» им обеим пришлось бы хоть немного ладить друг с другом..."
211170-382 = "[s] «...Главное, что с вами обеими всё в порядке»."
211170-383 = "А почему с нами должно быть что-то «не в порядке»...?"
211170-384 = "Что-то случилось?!"
211170-387 = "Некоторое время спустя."
211170-390 = ""
211170-391 = "..."
211170-392 = "..."
211170-393 = "Вы хотите сказать, что некоторые студенты... ведут себя странно?"
211170-394 = "Т-то есть... то объявление было всерьёз?"
211170-395 = "Они действительно хотят завоевать Кивотос...? Серьёзно...?"
211170-396 = "[s13] «Я пока сам пытаюсь разобраться...»\n[s14] «Если узнаю что-нибудь ещё, расскажу вам»."
211170-399 = "А, понятно! Спасибо!"
211170-400 = "Что за... Это БЫЛ не розыгрыш...?"
211170-401 = "..."
211170-402 = "М-мы просто продолжим делать то, что в наших силах."
211170-403 = "Нельзя же оставлять студентов голодными."
211170-404 = "[s] «Спасибо, Фуука и Джури»."
211170-405 = "Будьте осторожны... Сенсей."
211170-406 = "Если понадобится помощь, обязательно скажите!"
211170-409 = "Участники Клуба школьного питания ничуть не изменились."
211170-410 = "Так в чём же разница? Почему одни изменились, а другие нет?"
211170-414 = ""
211170-415 = "Насчёт «той штуки», что прозвучала раньше...?"
211170-416 = "Вы тоже это слышали, Сенсей? Я такая: «ЧТО вообще происходит?!»"
211170-417 = "Они заговорили о завоеваниях и войне... Пандемониум часто несёт всякую чушь, но от Префектуры я такого не ожидала."
211170-418 = "Всё жду, когда они скажут: «Попалась! Это был розыгрыш, подруга!»"
211170-419 = "...Но ничего подобного до сих пор не было. Им ведь уже пора было раскрыть шутку?"
211170-420 = "[s] «Ну...»"
211170-423 = ""
211170-424 = "Что...? Они это всерьёз?"
211170-425 = "...Это очень плохо..."
211170-426 = "Не верится, что наши однокурсники могли так резко перемениться..."
211170-427 = ""
211170-429 = ""
211170-430 = "О."
211170-431 = "Что такое, Эри? У тебя лицо странное."
211170-432 = "Перед речью председателя Макото..."
211170-433 = "Там ведь кто-то очень быстро произнёс заклинание? Ты тоже слышала?"
211170-434 = "Эм... Да. Я думала, это просто техническая неполадка. Будто они случайно переключились на другую частоту."
211170-435 = "Может быть... Но мне кажется, я уже где-то это слышала..."
211170-436 = "Я вообще ничего не понимаю. А вы что думаете, Сенсей?"
211170-437 = "[s15] «Я всё ещё ищу ответ».\n[s16] «...Но рад, что вы обе остались прежними»."
211170-440 = "Да... Почему изменились лишь некоторые студенты? Ради драмы? Как-то бессмысленно..."
211170-441 = "Сенсей, обращайтесь, если нужна помощь. Похоже, дело серьёзное."
211170-442 = "...И берегите себя."
211170-448 = "Чем отличаются те, кто изменился, от тех, кто остался прежним...?"
211170-450 = "Мы нормальные... Что у нас общего? Хоть что-нибудь? Мы даже не общаемся друг с другом..."
211170-451 = "Мы все... не председатели?"
211170-452 = "Цвет волос...? Длина волос...? Характер...? Знаки зодиака...? Группы крови...? Рост...?"
211170-453 = "Всё разное! У нас НЕТ НИЧЕГО общего."
211170-455 = "С Макото и Хиной та же история. Сложно представить двух настолько непохожих людей."
