211170-366 = "Sensei!"
211170-367 = "Hello! Ehehe."
211170-368 = "Oh, welcome!"
211170-369 = "[s11] \"Mind if I come in?\"\n[s12] \"...Is everything normal here?\""
211170-374 = "No, nothing in particular..."
211170-375 = "We've been busy preparing school lunch... just like always."
211170-376 = "[s] \"Did you hear the broadcast earlier?\""
211170-377 = "The broadcast... the one from Chairperson Makoto?"
211170-378 = "The one where she was saying those dangerous things? #nHonestly, it made me feel a bit heavy..."
211170-379 = "It was surprising. Even Hina, the Prefect Team Chairperson, was in on it..."
211170-380 = "What do you think, Sensei? That was a joke, right? #nLike a prank the two of them planned together..."
211170-381 = "...Wait, were they even close enough to pull a prank together?"
211170-382 = "[s] \"...I'm glad. You two are the same as always.\""
211170-383 = "Yes?"
211170-384 = "What do you mean...?"
211170-387 = "(A while later...)"
211170-391 = "..."
211170-392 = "..."
211170-393 = "So, after that broadcast, there are people who have become strange...?"
211170-394 = "Then that means the broadcast was... serious?"
211170-395 = "Invading Kivotos... are they sane...?"
