[translation]
211170-1 = "Episode 17;Legacy of the Past"
211170-2 = "(Even after the speech ended, my thoughts wouldn't settle.)"
211170-3 = "(First, I need to get a grasp of the situation.)"
211170-7 = "[ns1] \"For now... I should look for Hina.\"\n[ns2] Head to the Prefect Team office."
211170-14 = "Ah..."
211170-15 = "Sensei..."
211170-16 = "...It's about what happened earlier, right?"
211170-17 = "[s3] \"Yeah.\"\n[s4] \"...Are you two okay?\""
211170-22 = "...No."
211170-23 = "We're... also confused."
211170-24 = "Our Chairperson isn't the type of person to say things like that."
211170-25 = "War, conquest... I want to believe it's some kind of joke..."
211170-26 = "There must be... something going on that we don't know about."
211170-27 = "Anyway, I'm glad you came, Sensei."
211170-28 = "Let's listen together."
211170-40 = "Oh, Sensei. Welcome."
211170-41 = "Today is such a wonderful day. #nI wanted to share this joy with you."
211170-42 = "Hehe. Did you see what happened at the plaza?"
211170-43 = "[s] \"...Are you serious?\""
211170-47 = "I don't think I'm the type to tell jokes."
211170-48 = "..."
211170-49 = "Sensei, what's wrong? You have such a scary look on your face..."
211170-50 = "[s] (Where should I even begin...)"
211170-51 = "Is this some kind of surprise involving all of Gehenna?"
211170-52 = "Like, you're teaming up with Chairperson Makoto to surprise everyone... or something."
211170-53 = "What do you mean?"
211170-54 = "Because that's impossible, right!? #nWar? The conquest of Kivotos? What is that even supposed to mean!!"
211170-55 = "If it's really a joke, just say so now! If you do, I'll just let it slide as 'it was funny'!!"
211170-61 = "Iori, do you still not understand?"
211170-62 = "Huh!?"
211170-63 = "The true mission of the Prefect Team! #nThe awakened will of Gehenna!"
211170-64 = "The 'Iron-Blooded Will' of Gehenna should be directed beyond our walls. #nEstablishing true order in the name of Gehenna throughout all of Kivotos—that is the reason for our existence."
211170-65 = "Administrative Officer Ako, are you serious!?"
211170-66 = "Ugh, seriously! It's so frustrating. Why don't you understand yet?"
211170-67 = "Even that foolish and selfish Chairperson Makoto realized it!?"
211170-73 = "...What do you two think the problem is?"
211170-78 = "What do you mean, 'what'... everything is wrong..."
211170-79 = "That's not what the Prefect Team is about, is it...? #nWhat have we been doing all this time...?"
211170-80 = "You said it yourself... that we are the ones who draw the line..."
211170-82 = "That's right. Exactly."
211170-87 = "I made a promise. To ensure Gehenna doesn't cross the line."
211170-88 = "So, I'm redrawing the line."
211170-89 = "If everything becomes Gehenna, then 'crossing the line' will never happen."
211170-91 = "Th-that's..."
211170-92 = "Chairperson...!"
211170-98 = "[ns] \"Hina... Ako... why...?\""
211170-99 = "Sensei..."
211170-100 = "You look like you still don't understand either, Sensei."
211170-101 = "It might have been sudden. I only realized it today, too."
211170-102 = "...No, I should say I remembered."
211170-103 = "The desire to unite Gehenna and conquer Kivotos."
211170-104 = "The great craving that was sleeping within us."
211170-105 = "Hehe... I feel the same."
211170-106 = "It feels like waking up from a dream... I don't even know how I could have forgotten."
211170-107 = "Besides, I was able to confirm that even that raccoon from the Pandemonium Society feels the same way."
211170-108 = "Gehenna, united under one flag, cannot be stopped by anyone."
211170-109 = "This is... no longer a joke."
211170-113 = "You really don't get it, do you? I'm telling you, it's not a joke."
211170-114 = "That's the big problem!!"
211170-118 = "Ugh! Seriously!!"
211170-119 = "Why are you pretending not to understand when such an important mission is before us?"
211170-120 = "What Gehenna must do. You should know, too. #nBecause it's only natural."
211170-122 = "Don't mess with me!!"
211170-123 = "We didn't pick up our guns to trample on others!"
211170-124 = "We did it to protect students who just want to live their lives from those who run wild selfishly...!! #nThat's why...! No matter how troublesome or difficult it was, we took it on! #nIsn't that right!?"
211170-125 = "The Chairperson I knew was most wary of those with power abusing it. #nThe current Chairperson and Administrative Officer are somehow wrong—you've changed too much."
211170-131 = "Changed... I see. Perhaps."
211170-137 = "Right now, my head is clearer and more refreshed than ever before. #nI think I finally understand the cause of the terrible fatigue that was crushing me."
211170-138 = "—It was because I was turning a blind eye to my 'true role' and only protecting order within a small wall."
211170-139 = "A 'power' that lost its target. Indecisiveness has been eating away at Gehenna. And at me."
211170-141 = "Chairperson... how could you..."
211170-143 = "Don't worry. Once the flag of Gehenna is raised throughout Kivotos, all conflict will disappear. #nAnd then, true order will arrive."
211170-145 = "...Chairperson...!"
211170-146 = "[s] \"Let's cool our heads a little.\""
211170-153 = "[ns] \"I'll be borrowing Iori and Chinatsu.\""
211170-154 = "Understood."
211170-155 = "Please take care of them. They seem to still be confused."
211170-164 = "..."
211170-165 = "..."
211170-166 = "I don't understand... why...? #nWhat on earth is happening...?"
211170-167 = "Sensei... what should we do...?"
211170-168 = "[s5] \"I'll look into the situation.\"\n[s6] \"You two should get some rest.\""
211170-171 = "Yeah..."
211170-172 = "I wish this were just a dream... I hate this nightmare..."
211170-173 = "[s] \"...\""
211170-175 = "(I decided to go check on the Pandemonium Society as well.)"
211170-183 = "What do you think you're doing!!"
211170-186 = "[ns] \"This place too...\""
211170-189 = "There's a limit to how far you can joke around!"
211170-190 = "It was a broadcast! It reached every student in the school, you know!? Are you stupid!?"
211170-191 = "Who are you calling stupid, you idiot!!"
211170-192 = "If that wasn't stupid, then what is it!"
211170-193 = "You should have just ended it with your usual bragging! #nWhat kind of 'historic speech' is that!"
211170-194 = "No, it will go down in history! As the most unprecedented outburst in Gehenna's history!!"
211170-199 = "I-Iroha-chan... please calm down..."
211170-200 = "Iroha-senpai, Makoto-senpai... are you fighting...?"
211170-206 = "...Chiaki, take Ibuki and go outside."
211170-211 = "Yes!"
211170-217 = "Let's wait outside for a bit. #nThat's just a discussion. It's not a fight."
211170-218 = "Fighting is bad, I don't like fighting..."
211170-222 = "Do you take this decision of mine to be an outburst?"
211170-223 = "That's exactly what it is! I can only think you've lost your mind! #nWhat do we have to gain by making all of Kivotos our enemy!?"
211170-224 = "You're the one saying stupid things!!"
211170-225 = "Huh?"
211170-226 = "Do you still not understand how much Gehenna has been coddled by a pathetic peace! #nThe days of worrying about the faces of other schools and bickering within our walls are the stain on Gehenna!"
211170-227 = "That's what's normal! #nEven if we bicker a bit, we don't cross the line. Isn't that common sense!"
211170-232 = "We will shatter the rotten old order and build a new world ruled by the iron-blooded Gehenna! #nWhy can't you understand that this is the true path we must follow!!"
211170-236 = "No..."
211170-237 = "...Senpai, what on earth happened to you? #nYou're always like this... but today you're even stranger."
211170-238 = "Kishishi... Iroha, it's no wonder it looks that way with your narrow perspective."
211170-239 = "This Hanuma Makoto has finally been 'completed' today. #nBy an intense will that suddenly welled up!"
211170-240 = "What is that supposed to mean..."
211170-241 = "You saw it too, didn't you? #nEven that Hina Sorasaki responded to my great cause and showed her submission!"
211170-242 = "That's why it's a big problem! Usually, she'd just laugh it off!"
211170-243 = "What did you do...? #nDid Satsuki-senpai's hypnosis succeed?"
211170-250 = "...!!"
211170-251 = "Could it be...?"
211170-253 = "There's no other way to explain it...!!"
211170-254 = "Hmph. Hina just awakened to the correct mission, that's all."
211170-255 = "Just watch. In front of a united Gehenna, your doubts will disappear too."
211170-256 = "...You're serious."
211170-257 = "I've always been serious. You know that, don't you?"
211170-258 = "Yes, I know... painfully well."
211170-265 = "..."
211170-266 = "..."
211170-267 = "Tch. Iroha, why is she reacting so sensitively?"
211170-268 = "Even though this is the moment for Gehenna to unite as one."
211170-269 = "..."
211170-272 = "[ns] Leave the scene."
211170-277 = "(I confirmed that the Pandemonium Society is in a similar situation.)"
211170-278 = "(I don't want to believe it, but it seems both Makoto and Hina are serious...)"
211170-281 = "..."
211170-286 = "[ns] \"Iroha.\""
211170-290 = "Sensei."
211170-294 = "By any chance... did you hear what we were talking about earlier?"
211170-297 = "I see..."
211170-298 = "Honestly... I can't understand it."
211170-299 = "You know it too, right, Sensei? #nMakoto-senpai can be a bit scatterbrained and unreliable at times. #n...But she wasn't that kind of person."
211170-300 = "[s] \"That's true.\""
211170-301 = "Sigh... I don't know how to explain this to Ibuki..."
211170-305 = "...That won't actually become reality, right?"
211170-306 = "[s] \"Anyway, I'll check on the other situations.\""
211170-307 = "...Please do. #nI can't think of anyone else I can rely on right now."
211170-310 = "(Thinking it would be more calming to be around people who hadn't changed, I encouraged Iroha to stay with Iori and Chinatsu.)"
211170-311 = "[ns7] \"...\"\n[ns8] (Let's go see how the other clubs are doing.)"
211170-325 = "Sensei. Please, come in."
211170-326 = "Things are a bit hectic, so I apologize for not being able to serve you tea."
211170-327 = "[s9] \"No, don't worry about it.\"\n[s10] \"You look busy, did something happen?\""
211170-330 = "Yes, we must prepare for our impending activities."
211170-331 = "Yes? #nAh, these are medical supplies for the conquest of Kivotos."
211170-332 = "Since all we can do is provide first aid on the battlefield, #nand transport the... well, the patients."
211170-333 = "[s] \"...You're serious, aren't you?\""
211170-334 = "Of course."
211170-335 = "I'm not interested in politics, so I don't know the details, but #nI think it's a very good thing that the Pandemonium Society and the Prefect Team are joining hands."
211170-336 = "With this, Gehenna has finally united. #nThe declaration of war on Kivotos should be soon."
211170-337 = "The smoke signal for the great war of conquest is rising. #nI hope you will support us, Sensei."
211170-338 = "[s] \"...I'll come back later.\""
211170-339 = "Yes. Take care on your way back."
211170-345 = "...Ah."
211170-350 = "I am always grateful to you."
211170-351 = "[s] \"...The feeling is mutual.\""
211170-354 = "[ns] \"...\""
211170-358 = "Phew, finally finished stir-frying..."
211170-359 = "But, is it really okay to be doing this...?"
211170-360 = "..."
211170-361 = "Hmm... I should just do what I can, right?"
