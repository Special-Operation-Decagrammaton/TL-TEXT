[translation]
211170-1 = "Episódio 17;Herança do Passado"
211170-2 = "(Mesmo após o encerramento do comício, meus pensamentos continuavam em turbilhão)"
211170-3 = "(Preciso, antes de mais nada, entender a real gravidade dos fatos)"
211170-4 = ""
211170-7 = "[ns1] \"Em primeiro lugar... preciso encontrar a Hina.\"\n[ns2] Dirijo-me à sede do Comitê de Disciplina."
211170-13 = ""
211170-14 = "Ah..."
211170-15 = "Sensei..."
211170-16 = "...Você também viu aquela loucura no pátio, não viu?"
211170-17 = "[s3] \"Sim.\"\n[s4] \"...Vocês duas estão bem?\""
211170-18 = ""
211170-19 = ""
211170-21 = ""
211170-22 = "...Não."
211170-23 = "Nós duas estamos... completamente atordoadas."
211170-24 = "A nossa Presidente jamais falaria atrocidades daquele naipe!"
211170-25 = "Guerra? Conquista armada? Eu queria acreditar do fundo do peito que é uma brincadeira de mau gosto, mas..."
211170-26 = "Tem alguma coisa... Algo terrível que foge ao nosso conhecimento operando por trás."
211170-27 = "Ainda bem que você veio, Sensei."
211170-28 = "Vamos exigir explicações juntos."
211170-29 = ""
211170-36 = ""
211170-39 = ""
211170-40 = "Ah, olá, Sensei. Seja bem-vindo."
211170-41 = "Hoje é uma ocasião gloriosa e resplandecente.#nEu ansiava por compartilhar este júbilo com você."
211170-42 = "Fufufu. Você assistiu à nossa proclamação na praça central?"
211170-43 = "[s] \"...Você tá falando sério, Hina?\""
211170-44 = ""
211170-46 = ""
211170-47 = "Eu não tenho perfil de fazer gracinhas, tenho?"
211170-48 = "......"
211170-49 = "Aconteceu algo, Sensei? Sua expressão está tão sombria e rígida..."
211170-50 = "[s] (Por onde eu começo a falar com ela...?)"
211170-51 = "Isso tudo... é uma pegadinha armada pra pregar uma peça em Gehenna inteira, não é?!"
211170-52 = "Você combinou com a Presidente Makoto pra dar um susto na galera... não foi?!"
211170-53 = "Por que está dizendo isso, Iori?"
211170-54 = "Porque é um disparate absurdo!!#nGuerra?! Conquistar Kivotos inteira?! O que deu em você, pelo amor de Deus?!"
211170-55 = "Se for brincadeira, fale agora mesmo! Eu prometo fingir que achei engraçado e esquecer tudo!!"
211170-56 = ""
211170-58 = ""
211170-60 = ""
211170-61 = "Iori, sua mente limitada ainda não alcançou a magnitude da conjuntura?"
211170-62 = "Como é que é?!"
211170-63 = "A verdadeira vocação existencial do Comitê de Disciplina!#nA vontade de Gehenna finalmente despertada!"
211170-64 = "A 'vontade de ferro e sangue' que pulsa em Gehenna deve ser projetada para além destes muros acanhados.#nConsagrar a ordem definitiva em toda Kivotos sob a soberania de Gehenna―― Essa é a nossa genuína razão de existir."
211170-65 = "Diretora Ako, você tá falando essa loucura a sério?!"
211170-66 = "Ai, quanta lentidão de raciocínio! Por que você se recusa a enxergar o óbvio?"
211170-67 = "Até mesmo a tola e egocêntrica Presidente Makoto já despertou para a verdade cósmica!"
211170-68 = ""
211170-70 = ""
211170-72 = ""
211170-73 = "...O que vocês duas veem de tão problemático nisso?"
211170-74 = ""
211170-77 = ""
211170-78 = "Como assim 'o que veem'?! Tá tudo errado nessa história...!"
211170-79 = "O Comitê de Disciplina não existe pra isso...!#nTodo o sangue que derramamos até hoje foi pra quê afinal...?!"
211170-80 = "Você mesma nos ensinou... Que a gente existia para traçar a linha que não se deve cruzar...!"
211170-82 = "Sim, recordo-me perfeitamente. E é a mais pura verdade."
211170-83 = ""
211170-85 = ""
211170-87 = "Eu assumi a promessa: garantir que Gehenna não cruzasse a linha divisória."
211170-88 = "Portanto, redesenharei a linha."
211170-89 = "Se tudo o que existe sob os céus tornar-se Gehenna, jamais haverá uma 'linha a ser cruzada'."
211170-91 = "M-Mas que loucura monstruosa..."
211170-92 = "Presidente...!"
211170-93 = ""
211170-95 = ""
211170-97 = ""
211170-98 = "[ns] \"Hina... Ako... por que vocês estão assim...?\""
211170-99 = "Sensei..."
211170-100 = "Vejo que o seu olhar também permanece obscurecido pela névoa da hesitação."
211170-101 = "Talvez tenha soado repentino demais. Eu mesma só despertei para a luz hoje."
211170-102 = "...Ou melhor: seria mais exato dizer que [ruby=lembrei]eu me lembrei[/ruby]."
211170-103 = "Do anseio primordial de unificar Gehenna e subjugar Kivotos aos nossos pés."
211170-104 = "Daquele ardor indomável que repousava adormecido nas profundezas da nossa alma."
211170-105 = "Fufufu... Compartilho da mesmíssima epifania."
211170-106 = "Sinto-me despertando de um longo torpor... É incompreensível como pude esquecer algo tão elementar por tanto tempo."
211170-107 = "E até mesmo aquela raposa insolente da Pandemônio alinhou o coração ao nosso diapasão."
211170-108 = "Gehenna marchando sob o mesmo estandarte imperial é uma força inelutável que ninguém deterá."
211170-109 = "Chega... Isso passou dos limites de qualquer tolerância admissível."
211170-110 = ""
211170-112 = ""
211170-113 = "Que criatura obtusa. Já não reiteramos à exaustão que não se trata de anedota?"
211170-114 = "É EXATAMENTE ESSE O PROBLEMA GRAVE!!"
211170-115 = ""
211170-117 = ""
211170-118 = "Aaah! Que exasperação!!"
211170-119 = "Diante de um chamado divino de tamanha glória, por que insistem em se fazer de desentendidas?!"
211170-120 = "O dever histórico que Gehenna deve cumprir: vocês duas também sabem no fundo do peito.#nTrata-se de uma obviedade axiomática."
211170-122 = "NÃO VENHA COM ESSA CONVERSA FIADA!!"
211170-123 = "Nós não empunhamos fuzis para pisotear e trucidar os outros!!"
211170-124 = "Nós pegamos em armas para proteger as alunas pacíficas da fúria daquelas que só queriam tocar o terror!!#nPor isso... Não importava o tamanho do perrengue, a gente sempre segurava a bronca na marra!#nNão era essa a nossa verdade?!"
211170-125 = "A Presidente Hina que eu reverenciava era quem mais temia e vigiava o abuso da força armada.#nA senhora e a diretora Ako que estão aqui na minha frente hoje... estão completamente enlouquecidas!"
211170-126 = ""
211170-128 = ""
211170-130 = ""
211170-131 = "Enlouquecidas... Talvez. Pode ser que aos seus olhos pareça assim."
211170-132 = ""
211170-135 = ""
211170-137 = "Mas pela primeira vez na vida sinto minha mente límpida, serena e revigorada.#nFinalmente compreendi a gênese daquela exaustão sufocante que quase me destruía por dentro."
211170-138 = "――Eu estava fechando os olhos para a minha verdadeira vocação, desperdiçando a vida mantendo uma ordem mesquinha dentro de um cercadinho."
211170-139 = "O poder dissociado de um propósito absoluto e a tibieza moral corroeram Gehenna... e a mim mesma."
211170-141 = "Presidente... Não pode ser..."
211170-143 = "Não temam. Quando o estandarte de Gehenna tremular em cada canto de Kivotos, as dissensões evaporarão.#nE então, a verdadeira paz e ordem finalmente reinarão."
211170-145 = "...Hina-sama...!"
211170-146 = "[s] \"Vamos esfriar a cabeça um pouco.\""
211170-147 = ""
211170-149 = ""
211170-150 = ""
211170-152 = ""
211170-153 = "[ns] \"Vou levar a Iori e a Chinatsu comigo por ora.\""
211170-154 = "Como quiser."
211170-155 = "Cuide delas, por gentileza. As mentes delas parecem ainda reféns de um choque compreensível."
211170-156 = ""
211170-163 = ""
211170-164 = "......"
211170-165 = "......"
211170-166 = "Eu não entendo... por que isso tá acontecendo...?#nO que diabos se apossou delas...?"
211170-167 = "Sensei... o que vai ser de nós agora...?"
211170-168 = "[s5] \"Vou investigar a fundo o que está acontecendo.\"\n[s6] \"Vocês duas precisam descansar um pouco agora.\""
211170-171 = "Sim..."
211170-172 = "Eu daria tudo pra que isso fosse só um pesadelo ruim... Um horror desses não pode ser real..."
211170-173 = "[s] \"......\""
211170-175 = "(Decidi averiguar a conjuntura no gabinete da Sociedade Pandemônio)"
211170-176 = ""
211170-183 = "QUAL É O SEU PROBLEMA, ME DIZ?!!"
211170-186 = "[ns] \"Aqui também tá o caos...\""
211170-189 = "Até a palhaçada tem limites aceitáveis!!"
211170-190 = "Na rádio da escola! Ao vivo pra cada aluna do colégio ouvir! A senhora perdeu o juízo de vez?!!"
211170-191 = "Como ousa questionar a sanidade da soberana com essa insolência?!!"
211170-192 = "Se aquela aberração não foi idiotice pura, foi o quê então?!"
211170-193 = "Tivesse ficado no seu falatório de praxe de puxar o próprio saco e tava tudo bem!#nQue palhaçada foi aquela de pronunciamento histórico?!"
211170-194 = "Histórico vai ser, com certeza! O maior vexame diplomático de toda a história de Gehenna!!"
211170-195 = ""
211170-197 = ""
211170-199 = "C-Calma, Iroha-chan... respira fundo..."
211170-200 = "Iroha-senpai... Makoto-senpai... Vocês tão brigando...?"
211170-202 = ""
211170-205 = ""
211170-206 = "...Chiaki. Tira a Ibuki daqui agora e espera no corredor."
211170-207 = ""
211170-210 = ""
211170-211 = "Sim, senhora!"
211170-212 = ""
211170-217 = "Vamos ali fora tomar um arzinho, Ibuki.#nElas tão só conversando, não é briga de verdade não."
211170-218 = "Brigar é feio... Ibuki odeia briga..."
211170-221 = ""
211170-222 = "Você se atreve a classificar meu decreto imperial como mero 'vexame'?!"
211170-223 = "Mas é óbvio que sim! É puro delírio psicótico!#nColocar Kivotos inteira como nossa inimiga mortal vai trazer que benefício pra gente, me explica?!"
211170-224 = "A tola míope e ignorante aqui é VOCÊ!!"
211170-225 = "Hã?!"
211170-226 = "Ainda não percebeu o quão humilhante era a paz covarde em que nos acomodamos?!#nPisar em ovos diante das outras escolas e viver nos digladiando feito ratos num cercado foi a maior vergonha de Gehenna!"
211170-227 = "Isso é o que as pessoas normais chamam de VIDA EM SOCIEDADE!#nA gente até se estranha, mas não ultrapassa o limite da civilidade! Isso é o básico do bom senso!"
211170-228 = ""
211170-230 = ""
211170-232 = "Pulverizaremos a velha ordem apodrecida e forjaremos um novo mundo sob o punho de ferro e sangue de Gehenna!#nPor que sua mente mesquinha não abraça a magnificência do nosso destino imperial?!!"
211170-233 = ""
211170-235 = ""
211170-236 = "Não..."
211170-237 = "...Veterana, o que aconteceu com você de verdade?#nA senhora sempre foi sem noção, mas... hoje tá bizarra demais."
211170-238 = "Kishishi... Iroha, com essa sua visão de curto alcance, é natural que enxergue assim."
211170-239 = "Esta que vos fala, Hanuma Makoto-sama, finalmente atingiu sua 'plenitude cósmica' hoje!#nDespertada por uma determinação avassaladora e irrefreável!"
211170-240 = "Mas que baboseira é essa..."
211170-241 = "Você testemunhou com seus próprios olhos, não testemunhou?!#nAté mesmo aquela arrogante da Hina Sorasaki curvou a cerviz e rendeu vassalagem à minha sagrada causa!"
211170-242 = "É EXATAMENTE ESSE O MOTIVO DO MEU PÂNICO! Em circunstâncias normais ela riria da sua cara e te mandaria calar a boca!"
211170-243 = "O que foi que você fez...?#nPor acaso aquela hipnose ridícula da Satsuki-senpai funcionou por milagre?!"
211170-244 = ""
211170-246 = ""
211170-248 = ""
211170-249 = ""
211170-250 = "...!!"
211170-251 = "Não me diga que...?"
211170-253 = "Não existe outra explicação plausível no universo...!!"
211170-254 = "Humph. Hina apenas foi agraciada com o discernimento da verdadeira missão."
211170-255 = "Apenas observe: diante de uma Gehenna unificada em um único punho, todos os seus medos tolos se dissiparão no ar."
211170-256 = "...A senhora tá falando seríssimo mesmo."
211170-257 = "Eu sempre fui séria em toda a minha existência. Você sabe muito bem disso, não sabe?"
211170-258 = "Sim, eu sei... até demais, infelizmente."
211170-259 = ""
211170-264 = ""
211170-265 = "......"
211170-266 = "......"
211170-267 = "Tsc. Por que a Iroha tem que reagir com tamanho histerismo?#nLogo agora que Gehenna finalmente marcha em união gloriosa."
211170-268 = ""
211170-269 = "......"
211170-272 = "[ns] Afasto-me dali em silêncio."
211170-273 = ""
211170-277 = "(Constato que a loucura na Pandemônio opera no mesmíssimo padrão aterrador)"
211170-278 = "(Custa a acreditar, mas tanto Makoto quanto Hina estão falando com convicção absoluta...)"
211170-281 = "......"
211170-282 = ""
211170-286 = "[ns] \"Iroha.\""
211170-287 = ""
211170-289 = ""
211170-290 = "Sensei."
211170-291 = ""
211170-293 = ""
211170-294 = "Por acaso... você escutou a nossa discussão lá dentro?"
211170-297 = "Entendo..."
211170-298 = "Sinceramente... é incompreensível."
211170-299 = "Você conhece ela tão bem quanto eu, né, Sensei?#nA Makoto-senpai tem um parafuso a menos e vive fazendo besteira... Mas ela nunca foi esse monstro."
211170-300 = "[s] \"É verdade.\""
211170-301 = "Ai, meu Deus... como é que eu vou explicar uma tragédia dessas pra Ibuki...?"
211170-302 = ""
211170-304 = ""
211170-305 = "...Aquele pesadelo não vai acontecer de verdade... vai?"
211170-306 = "[s] \"Eu vou averiguar a situação pelo restante do campus.\""
211170-307 = "...Por favor. Neste momento, você é a única pessoa com juízo a quem posso recorrer."
211170-310 = "(Aconselhei Iroha a reunir-se com Iori e Chinatsu, buscando amparo entre aquelas que preservaram a sanidade)"
211170-311 = "[ns7] \"......\"\n[ns8] (Preciso checar o estado dos demais clubes)"
211170-312 = ""
211170-313 = ""
211170-319 = ""
211170-321 = ""
211170-323 = ""
211170-324 = ""
211170-325 = "Sensei. Por favor, queira entrar."
211170-326 = "Peço escusas pelo ambiente caótico, estamos atarefadas demais para servir-lhe um chá digno."
211170-327 = "[s9] \"Não se preocupe com isso, Sena.\"\n[s10] \"O que está acontecendo por aqui?\""
211170-330 = "Estamos organizando os suprimentos médicos de campanha para a iminente operação de guerra."
211170-331 = "Como?#nAh, estes caixotes contêm anestésicos, torniquetes e material para a conquista de Kivotos."
211170-332 = "Nossa função restringe-se aos primeiros socorros no teatro bélico e ao translado de cadá... digo, de pacientes feridos."
211170-333 = "[s] \"...Você também está falando sério sobre isso?\""
211170-334 = "Evidentemente."
211170-335 = "Não possuo inclinação para tramas políticas, mas considero a aliança entre a Pandemônio e o Comitê de Disciplina um avanço formidável."
211170-336 = "Finalmente Gehenna alcançou a união orgânica. A declaração de guerra a Kivotos é iminente."
211170-337 = "A fumaça da gloriosa guerra de conquista elevar-se-á aos céus. Rogo que o Sensei reserve sua calorosa torcida ao nosso êxito."
211170-338 = "[s] \"...Eu volto mais tarde, Sena.\""
211170-339 = "Certamente. Tenha um trajeto seguro."
211170-340 = ""
211170-344 = ""
211170-345 = "...Ah."
211170-346 = ""
211170-349 = ""
211170-350 = "Nossa eterna gratidão pelo amparo de sempre, Sensei."
211170-351 = "[s] \"...Obrigado pelo seu trabalho, Sena.\""
211170-354 = "[ns] \"......\""
211170-357 = ""
211170-358 = "Ufa, finalmente terminei de refogar tudo..."
211170-359 = "Mas será que tá tudo bem continuar cozinhando normalmente com esse clima...?"
211170-360 = "......"
211170-361 = "Bom... o que me cabe é fazer a minha parte com capricho."
211170-362 = "[s] \"Olá, meninas.\""
211170-363 = ""
211170-365 = ""
211170-366 = "Sensei!"
211170-367 = "Oieee! Que surpresa boa! Ehehe."
211170-368 = "Ah, seja muito bem-vindo!"
211170-369 = "[s11] \"Com licença.\"\n[s12] \"...Vocês notaram algo estranho por aqui?\""
211170-370 = ""
211170-371 = ""
211170-373 = ""
211170-374 = "Não, nada fora do habitual..."
211170-375 = "A gente tá atolada até o pescoço cozinhando a merenda, tudo na mesma correria de sempre."
211170-376 = "[s] \"Vocês ouviram a transmissão de agora há pouco?\""
211170-377 = "A rádio...? Aquele anúncio da Presidente Makoto?"
211170-378 = "Aquele falatório perigoso e esquisito, né?#nPra ser sincera, aquilo me deu um aperto horrível no coração..."
211170-379 = "Eu quase caí dura de susto quando vi a Presidente Hina apoiando aquela loucura toda..."
211170-380 = "O que você acha, Sensei? É óbvio que aquilo era só uma pegadinha combinada entre elas, né?#nTipo um teatrinho pra chocar todo mundo..."
211170-381 = "...Quer dizer, desde quando as duas têm intimidade pra fazer piadinha juntas?"
211170-382 = "[s] \"...Que alívio. Vocês duas continuam sãs e salvas.\""
211170-383 = "Ué?"
211170-384 = "Como assim 'sãs e salvas'...?"
211170-387 = "(Momentos depois...)"
211170-390 = ""
211170-391 = "......"
211170-392 = "......"
211170-393 = "Quer dizer que depois daquele anúncio, várias veteranas perderam o juízo...?"
211170-394 = "Então aquele discurso todo... era pra valer mesmo?!"
211170-395 = "Marchar em guerra pra invadir Kivotos inteira... Elas piraram da cabeça de vez...?!"
211170-396 = "[s13] \"Estou mapeando a situação agora.\"\n[s14] \"Assim que descobrir algo, venho avisar vocês.\""
211170-399 = "S-Sim! Por favor, Sensei!"
211170-400 = "Pensar que não é uma pegadinha... que horror..."
211170-401 = "......"
211170-402 = "De qualquer forma, continuaremos cumprindo o nosso dever na cozinha."
211170-403 = "Se a gente parar as panelas, os alunos vão morrer de fome."
211170-404 = "[s] \"Muito obrigado pela dedicação de vocês.\""
211170-405 = "Sensei... tome muito cuidado lá fora, por favor."
211170-406 = "Se precisar de qualquer coisa que o Clube de Merenda possa ajudar, é só chamar!"
211170-409 = "(As duas integrantes do Clube de Merenda mantiveram-se inalteradas)"
211170-410 = "(Quem mudou e quem permaneceu sã... Qual seria o fator determinante dessa cisão?)"
211170-414 = ""
211170-415 = "Sensei, você ouviu aquela loucura no pátio?!"
211170-416 = "Eu não entendi patavina de nada, juro!"
211170-417 = "A Pandemônio soltar pérolas surreais é rotina, mas a Presidente do Comitê de Disciplina dançar no mesmo ritmo?!"
211170-418 = "Tô só esperando elas gritarem: 'Caiu na pegadinha do Mallandro! Pegamos vocês!'..."
211170-419 = "Cadê a revelação da pegadinha afinal?#nJá passou da hora do desfecho, né...?"
211170-420 = "[s] \"Acontece que...\""
211170-423 = ""
211170-424 = "...Oi?! Aquela sandice toda é pra valer?!"
211170-425 = "Aí já perdeu totalmente a graça..."
211170-426 = "Parece que a alma delas foi substituída num estalar de dedos."
211170-427 = ""
211170-429 = ""
211170-430 = "Espera aí."
211170-431 = "O que foi? Lembrou de algo?"
211170-432 = "Antes de a Presidente Makoto começar o discurso no microfone..."
211170-433 = "Não tocou uma gravação rápida que parecia um feitiço de hipnose nas caixas de som?"
211170-434 = "Pois é! Tocou mesmo! Eu achei que fosse interferência de rádio!"
211170-435 = "Será que aquele chiado misterioso não foi o gatilho...?#nTenho a nítida sensação de já ter ouvido aquelas palavras antes."
211170-436 = "Quanto mais a gente pensa, mais mistério aparece. O que você acha, Sensei?"
211170-437 = "[s15] \"Vou investigar o perímetro com cautela.\"\n[s16] \"Saber que vocês duas estão salvas já é um alívio imenso.\""
211170-440 = "Mas por que diabos só certas pessoas foram afetadas?"
211170-441 = "Se precisar de um reforço ou de uma cobertura estilosa, conta com a gente, Sensei! O clima tá pesado demais."
211170-442 = "...Se cuida, por favor."
211170-448 = "A linha divisória entre quem foi atingida e quem permaneceu ilesa..."
211170-450 = "Nós todas estamos bem... O que nós temos em comum?#n...Tem algum padrão?"
211170-451 = "Não sermos presidentes de clube...?"
211170-452 = "Cor do cabelo...? Tamanho do uniforme...? Altura...? Personalidade...?"
211170-453 = "Nada bate com nada! Não tem um único traço compartilhado entre nós!"
211170-455 = "E do outro lado, tem a Makoto-senpai e a Hina-senpai.#nQue ponto em comum aquelas duas inimigas mortais poderiam ter...?"
211170-456 = ""
211170-458 = ""
211170-459 = ""
211170-460 = "......"
211170-462 = "Serem do terceiro ano...?"
211170-463 = ""
211170-465 = ""
211170-466 = "A Diretora Sena também é aluna do terceiro ano..."
211170-467 = "A Ako-chan também!"
211170-469 = "E a Satsuki-senpai também é do terceiro ano."
211170-470 = "[s] \"Apenas as alunas do terceiro ano perderam a razão...?\""
211170-472 = "O diagnóstico fático aponta pra isso, mas... por quê?!"
211170-473 = "Que raio de motivo existiria para atingir unicamente o terceiro ano...?!"
211170-474 = ""
211170-478 = "Com licença, senhoritas."
211170-479 = ""
211170-481 = ""
211170-482 = ""
211170-483 = ""
211170-487 = ""
211170-489 = "Satsuki-senpai...!"
211170-490 = "[s] \"Satsuki...?!\""
211170-491 = "......"
211170-492 = "Eu creio ter a resposta para o enigma que vos aflige."
211170-493 = ""
211170-495 = ""
211170-497 = ""
211170-499 = "Diretora Satsuki, o que a senhora está insinuando...?"
211170-500 = "Afastem-se! A Diretora Satsuki também não pertence ao 'lado das enfeitiçadas'?!"
211170-501 = "Abra o jogo agora! Por que diabos vocês pretendem subjugar Kivotos na marra?!"
211170-502 = ""
211170-505 = ""
211170-506 = "Por qual razão eu me daria ao trabalho de cometer tamanha insensatez...?#nConquistar o mundo... Que tédio descomunal, abomino essa ideia."
211170-507 = ""
211170-509 = "...Hein?"
211170-510 = "Como assim?"
