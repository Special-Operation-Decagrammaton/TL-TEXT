[translation]
1008803-1 = "Наряд, подходящий атмосфере"
1008803-4 = "Я отправился в офис «Проблемы 68» на назначенную встречу с Каёко."
1008803-5 = ""
1008803-8 = "...А, вы пришли, Сенсей."
1008803-9 = "Открыто. Заходите."
1008803-10 = "[ns1] «Прошу прощения.»\n[ns2] Открыть дверь и войти."
1008803-11 = ""
1008803-12 = ""
1008803-17 = "Я ждала."
1008803-18 = "Удивлена, что вы заглянули в такой час."
1008803-19 = ""
1008803-21 = ""
1008803-22 = "Что касается остальных..."
1008803-23 = "Сейчас их нет. У каждой своя работа."
1008803-24 = "Они расстроились, что не смогут с вами увидеться. Может, заглянете как-нибудь, когда мы все будем здесь, чтобы компенсировать это."
1008803-25 = "Продолжим..."
1008803-26 = ""
1008803-28 = ""
1008803-29 = "Вы говорили, что пришли кое-что поискать, верно? Что ж, нам самим удалось кое-что найти. Надеюсь, это поможет."
1008803-30 = "Подождите здесь. Я принесу."
1008803-34 = "Хм... где-то здесь должно быть."
1008803-35 = ""
1008803-37 = ""
1008803-38 = "Это коробка с документами. О, вот и пропавшие боеприпасы. А где же оно?"
1008803-39 = "А ещё..."
1008803-40 = ""
1008803-43 = "[ns3] «О, Каёко. Эта коробка...»\n[ns4] «Это платье, которое ты носила во время прошлого задания.»"
1008803-46 = "...А?"
1008803-47 = "О, это..."
1008803-48 = "Ну... Это не повседневная одежда. А если я и буду его надевать, то для работы «Проблемы 68», так что..."
1008803-49 = "Я решила просто оставить его здесь с остальной одеждой."
1008803-50 = "[s5] «Оно всё в пыли.»\n[s6] «Разве не жалко оставлять его лежать в коробке?»"
1008803-53 = "Правда? Никогда об этом так не думала..."
1008803-54 = "Если честно, мне кажется, оно для меня слишком изысканное..."
1008803-55 = ""
1008803-57 = ""
1008803-58 = "Хм? Наш местный эксперт по моде считает, что оно стильное и мне идёт?"
1008803-59 = ""
1008803-61 = ""
1008803-62 = "Ну..."
1008803-63 = "Не верю, но комплимент приму."
1008803-64 = "Не нужно быть вежливым из чувства долга."
1008803-65 = "Я лучше кого-либо знаю, как выгляжу, так что..."
1008803-66 = "...Вы ведь искренне это говорите, да?"
1008803-67 = ""
1008803-69 = "Вы правда добрый, Сенсей."
1008803-70 = "Ладно, хватит об этом. Вернёмся к делу. У вас ведь тоже есть свои задачи..."
1008803-71 = ""
1008803-73 = ""
1008803-74 = "Подождите немного. Я скоро найду ту коробку."
1008803-81 = "Чуть позже Каёко передала мне нужные документы."
1008803-82 = ""
1008803-84 = ""
1008803-85 = "Наконец-то."
1008803-86 = ""
1008803-88 = ""
1008803-89 = "Вот они, Сенсей. Надеюсь, пригодятся."
1008803-90 = "Не нужно благодарить. После всего, что вы сделали, считайте это знаком моей признательности."
1008803-91 = ""
1008803-93 = ""
1008803-94 = "...Что?"
1008803-95 = "Сенсей, вы не можете угостить меня ужином в благодарность за мою благодарность!"
1008803-96 = ""
1008803-98 = ""
1008803-99 = "...Эм."
1008803-100 = "Я же только что сказала. В этом нет необходимости."
1008803-101 = "[s7] «Совесть не позволит мне просто сидеть сложа руки.»\n[s8] «Мы, взрослые, такие, Каёко.»"
1008803-102 = ""
1008803-103 = ""
1008803-105 = ""
1008803-106 = "*вздыхает*"
1008803-107 = "Как хотите. Только больше так не делайте."
1008803-108 = "Хотя... это ведь бесплатная еда."
1008803-109 = "Ладно. Спасибо."
1008803-110 = "Пока возвращайтесь. Дайте знать, когда освободитесь, и я подойду."
1008803-111 = ""
1008803-113 = ""
1008803-115 = ""
1008803-116 = "До встречи, Сенсей."
1008803-119 = "Получив от Каёко нужные документы, я вернулся в Шале и закончил оставшуюся работу."
1008803-120 = ""
1008803-123 = "Позже я заказал для нас столик в ближайшем ресторане."
1008803-127 = ""
1008803-133 = "Я слышал, что там отличная паста, и решил, что это будет хорошей наградой за наши труды."
1008803-134 = ""
1008803-138 = "Я думала, что пришла рано, но вы ещё раньше, Сенсей."
1008803-139 = ""
1008803-144 = ""
1008803-145 = "[ns9] «...А, Каёко.»\n[ns10] «Добро пожаловать, Каё—»"
1008803-146 = ""
1008803-147 = ""
1008803-150 = "[ns11] «...Каёко?!»\n[ns12] «Почему ты в платье?»"
1008803-153 = "Я так и думала, что вы удивитесь."
1008803-154 = "Разве вы не говорили, что жалко оставлять его в коробке? К тому же оно подходит к атмосфере ресторана."
1008803-155 = "Где мне ещё его носить?"
1008803-156 = "...Или, может... раньше вы говорили неискренне?"
1008803-157 = "[s13] «Нет! Вовсе нет.»\n[s14] «Это был приятный сюрприз, ведь платье такое стильное!»"
1008803-160 = "...Хи-хи. Я просто дразнюсь."
1008803-161 = "Скажем так, Сенсей не каждый день угощает меня бесплатно. Не могла же я прийти в своей обычной куртке."
1008803-162 = ""
1008803-164 = ""
1008803-166 = ""
1008803-167 = ""
1008803-168 = "Ну..."
1008803-169 = "...Спасибо за еду, Сенсей!"
