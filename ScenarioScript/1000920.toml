[translation]
1000920-1 = "День хот-дога"
1000920-2 = ""
1000920-4 = ""
1000920-5 = ""
1000920-6 = ""
1000920-7 = ""
1000920-8 = ""
1000920-9 = "О, Сенсей! Я тебя ждала!"
1000920-10 = "[s] «Привет, Изуми. Что ты хотела показать?»"
1000920-11 = "Видите ли..."
1000920-12 = "Та-дам! Смотри!"
1000920-13 = ""
1000920-15 = ""
1000920-16 = ""
1000920-18 = "[ns1] «Изуми? Даже если ты голодна, пластиковый хот-дог есть нельзя!»\n[ns2] «О нет, ты уже откусила...»"
1000920-21 = "Погоди, нет! Всё не так! За кого ты меня принимаешь?"
1000920-22 = "Даже я знаю, что пластик есть нельзя!"
1000920-23 = "[s3] «Какое облегчение. Я не был уверен...»\n[s4] «Он выглядит совсем настоящим!»"
1000920-26 = "Ага! Даже запах и текстура как у настоящего хот-дога."
1000920-27 = "Говорят, сейчас эти... 3D-принтеры... умеют делать такие штуки."
1000920-28 = "[s5] «Современные 3D-принтеры и правда удивительны.»\n[s6] «Но зачем ты носишь это с собой?»"
1000920-31 = "Хм? Потому что он приятно пахнет! И когда я ношу его с собой, мне постоянно попадается всякая вкусная еда!"
1000920-32 = "Так что для меня это вроде талисмана!"
1000920-34 = ""
1000920-37 = "Внезапно откуда ни возьмись появился огромный ворон!"
1000920-38 = ""
1000920-42 = "Ворон рванул прямо к хот-догу Изуми, схватил его и улетел!"
1000920-44 = "Что?! Нет, нет! Мой счастливый хот-дог!"
1000920-46 = ""
1000920-50 = ""
1000920-51 = ""
1000920-52 = ""
1000920-53 = "*Тяжёлое дыхание* *Тяжёлое дыхание*"
1000920-54 = "[s] «Мы гнались за вороном до самого сюда!»"
1000920-55 = "О, Сенсей! Ворон пытается накормить моим хот-догом своих птенцов!"
1000920-56 = "Но... у него не получается, потому что хот-дог пластиковый."
1000920-57 = "О нет... Если ничего не сделать, птенцы останутся голодными, а я ещё и потеряю хот-дог..."
1000920-58 = "[s] «Подожди здесь, Изуми. Я скоро вернусь.»"
1000920-59 = "А? Сенсей? Ты куда? Не оставляй меня!"
1000920-61 = ""
1000920-64 = "Борясь с чувством вины, я оставил Изуми, у которой уже наворачивались слёзы, и побежал в ближайший магазин."
1000920-65 = ""
1000920-66 = ""
1000920-68 = "О, Сенсей. Ты купил настоящий хот-дог! Он мне?"
1000920-69 = "Не мне? Эх... А почему?"
1000920-70 = "А... Он для воронов?"
1000920-72 = ""
1000920-78 = "Изуми помогла мне забраться на дерево."
1000920-79 = ""
1000920-82 = "И когда я положил хот-дог в гнездо, ворон..."
1000920-83 = ""
1000920-86 = "О, он откусил кусочек!"
1000920-87 = ""
1000920-91 = "И кормит им птенцов!"
1000920-92 = ""
1000920-100 = "Мой хот-дог!"
1000920-101 = "Т-Ты возвращаешь его мне? Какой умный! Спасибо!"
1000920-102 = ""
1000920-104 = ""
1000920-105 = ""
1000920-106 = ""
1000920-108 = "[ns7] «Вороны обычно очень умны.»\n[ns8] «Рад за тебя, Изуми.»"
1000920-111 = "Хи-хи!"
1000920-112 = "Но теперь после всей этой беготни я проголодалась..."
1000920-113 = "[s] «Ахаха... Я знал, что этим закончится.»"
1000920-114 = "А-А? Сенсей, у тебя есть идея?"
1000920-115 = ""
1000920-118 = "Это... хот-дог!"
1000920-119 = "[s9] «Мне внезапно захотелось хот-дог.»\n[s10] «Я купил лишний, так что можешь взять один.»"
1000920-122 = "Правда? Мне вообще позволено быть настолько счастливой?"
1000920-123 = "Спасибо, Сенсей! Я очень благодарна!"
1000920-124 = "[s] «Сегодня у Изуми какой-то свой „День хот-дога“.»"
1000920-125 = "Что это? День, когда весь день ешь только хот-доги?"
1000920-126 = "Ахаха! Звучит весело! Я бы когда-нибудь попробовала!"
1000920-127 = "Тогда... я добавлю на свой хот-дог соус со вкусом угря-желе, Purr Purr премиум со вкусом тунца и хлопья со вкусом шоколадной горчицы!"
1000920-128 = "О, хочешь немного на свой, Сенсей? Это точно выведет тебя на новый уровень гурманства!"
1000920-129 = ""
1000920-131 = "[ns] «О, нет, спасибо! Меня полностью устраивает обычный хот-дог!»"
1000920-132 = "Серьёзно...?"
1000920-134 = "Отказаться от искреннего предложения Изуми оказалось довольно непросто..."
