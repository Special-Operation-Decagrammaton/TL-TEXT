[translation]
34040-1 = "Episódio 4;No Limiar entre o Sonho e a Miragem"
34040-3 = "[ns] \"O fim... de Kivotos...?\""
34040-4 = "......"
34040-5 = "Sim, exatamente."
34040-6 = "Se devo dizer que ela encontrou seu fim e foi destruída... ou se esse será o resultado inevitável ao qual chegaremos... isso ainda permanece um completo mistério."
34040-7 = "[s] \"Como era essa visão...?\""
34040-9 = "Uma torre colossal desceu dos céus, tingindo o vazio de escarlate..."
34040-12 = "A torre sinistra retumbava como se soltasse um grito... corroendo este mundo pouco a pouco... e, então, cobriu \"algo\" com os fragmentos do mundo."
34040-13 = "Enquanto os estilhaços do mundo corroído sopravam como uma tempestade furiosa, uma luz negra desceu dos céus... inclinando o mundo rumo ao seu fim..."
34040-15 = "E assim... tudo em Kivotos desmoronou..."
34040-16 = "Sem deixar um único grão de poeira, tudo desapareceu no vazio."
34040-18 = "[ns] \".........\""
34040-19 = "Se o que eu vi foi apenas um simples pesadelo, ou se realmente observei o futuro, ou quem sabe algo que já aconteceu no passado..."
34040-20 = "Por enquanto, não sei de nada... mas, uma vez que testemunhei aquela cena, preciso descobrir a verdade."
34040-21 = "......"
34040-22 = "E assim, para esclarecer o que era aquela visão, vaguei por um sonho lúcido sem fim."
34040-23 = "...O sonho lúcido é o ato de mergulhar conscientemente no torpor tendo plena noção de que se está sonhando. Em troca de conseguir lembrar de tudo o que aconteceu, a fronteira entre o sonho e a realidade acaba se tornando turva."
34040-24 = "Para mim, que transitei repetidas vezes entre o sonho e a realidade, já não é mais possível sequer perceber de que lado está o mundo onde piso agora."
34040-25 = "[s] \"Isso parece um estado muito perigoso... Você está bem?\""
34040-26 = "...Bem, se eu negasse, estaria mentindo. Mas, ainda assim, é algo necessário."
34040-27 = "Se fosse a antiga eu, teria temido conhecer o futuro e fugido para o mundo do limiar. Contudo, desta vez não posso fazer isso."
34040-28 = "Minha intuição me diz que aquela visão não foi apenas um pesadelo."
34040-29 = "Aquilo é algo que não poderia existir em Kivotos — algo que veio de fora de Kivotos. Uma existência incompreensível, que ultrapassa de longe a minha imaginação."
34040-30 = "Isto é apenas uma suposição minha, mas quem provavelmente atraiu aquilo foi a \"Gematria\"..."
34040-31 = "Acredito que eles estejam tentando invocar uma existência externa para Kivotos e conduzi-la ao seu fim."
34040-32 = "[s] \"...A Gematria?\""
34040-40 = "Talvez exista alguma forma de evitar aquela ruína... Por isso, eu..."
34040-41 = "[ns] \"Seia.\""
34040-42 = "...Hum?"
34040-43 = "[s1] \"Se isso envolve a 'Gematria', é melhor se afastar agora mesmo.\"\n[s2] \"Seia, o que você está fazendo agora é perigoso demais.\""
34040-44 = "......"
34040-45 = "......"
34040-46 = "Sim, de fato... Rastrear os passos daquele grupo pode ser quase um suicídio."
34040-47 = "[s3] \"Mesmo que a sua suposição seja verdade, Seia, fazer isso desse jeito não está certo.\"\n[s4] \"Isso é algo que devemos fazer reunindo informações com cuidado e cooperando entre todos.\""
34040-50 = "......"
34040-51 = "[s] \"Deixe esse tipo de coisa com os adultos. Seia, olhe com atenção para a pessoa que está bem na sua frente.\""
34040-55 = "(Mika...)"
34040-56 = "...O que você diz faz todo o sentido."
34040-57 = "Sendo sobrepujada por aquele sonho sem ter nenhuma informação ainda... talvez eu apenas tivesse perdido a mim mesma."
34040-61 = "Além do mais, se algo acontecesse comigo agora, a Mika... ela acabaria fazendo a escolha errada outra vez."
34040-62 = "...É verdade."
34040-63 = "Neste momento, a Mika se encontra na pior situação imaginável."
34040-64 = "...Aquela garota viveu sendo mimada até hoje. Todos a veneravam e a elogiavam — como se fosse uma princesa saída de um conto de fadas."
34040-65 = "Para alguém como ela, tornar-se alvo do ódio do mundo inteiro como agora é, provavelmente, uma experiência inédita desde que nasceu."
34040-66 = "Para ela carregar nos ombros, esse destino pode ser cruel demais..."
34040-67 = "...Agora, salvar a Mika daquele lamaçal é a prioridade máxima."
34040-68 = "Como foi que eu não percebi isso até agora...?"
34040-69 = "Sinto como se a névoa tivesse se dissipado... Obrigada, Sensei. Nós devemos avançar passo a passo — começando por resolver o problema da Mika."
34040-70 = "[s] \"Obrigado, Seia. Aliás, a Mika queria muito te pedir desculpas.\""
34040-71 = "Pedir desculpas...? Mas eu já a perdoei..."
34040-72 = "...Ah, isso aconteceu dentro do sonho, não foi?"
34040-73 = "Entendo... Então a Mika ainda acha que não foi perdoada por mim."
34040-74 = "Do pecado que cometeu... ela certamente sente que a maior vítima fui eu."
34040-77 = "Que tola..."
34040-78 = "Egoísta, imprudente, impulsiva — e, apesar de gananciosa, tão autodestrutiva..."
34040-79 = "O papel de uma vilã mimada, atrevida e arrogante de um conto de fadas combinava tanto com você."
34040-80 = "Mas, dentre todos os caminhos..."
34040-82 = "A dama vilã que tentou fazer sofrer aqueles que não lhe agradavam..."
34040-83 = "Acabou reduzida a uma existência tola, tema não de um conto de fadas, mas de uma fábula moral."
34040-87 = "Contudo... se ainda há alguma salvação para ela..."
34040-88 = "É o fato de que, por eu ter sobrevivido, ela por muito pouco não caiu ao ponto de se tornar uma assassina."
34040-89 = "Se a Mika está conseguindo suportar essa situação infernal... deve ser graças a esse fato."
34040-90 = "Não é exagero dizer que o meu bem-estar se tornou o porto seguro do coração da Mika."
34040-91 = "......"
34040-92 = "Mesmo eu não tendo sido gentil com ela... por minha causa, ela chegou àquele ponto..."
34040-93 = "...É, você tem razão."
34040-94 = "Não somos mais crianças... O fato de nem eu nem a Mika conseguirmos dizer um simples \"me desculpe\"... é profundamente vergonhoso."
34040-95 = "— Vou pedir para chamarem a Mika aqui agora mesmo."
34040-96 = "Terei uma conversa com ela... e também participarei da audiência de amanhã."
34040-97 = "Como a acusação mais grave contra a Mika é a de ter me ferido — se eu, a própria vítima, estiver ao lado dela, a pena certamente será amenizada um pouco."
34040-102 = "Ch-Chamou, Seia-sama?"
34040-103 = "Desculpe o incômodo, mas quero ver a Mika. Poderia trazê-la aqui agora mesmo?"
34040-104 = "A-A Mika-sama? E-Entendido. Vou confirmar com a Nagisa-sama!"
34040-105 = "Obrigada. E... poderia avisar que, se possível, gostaria de conversar a sós com a Mika? De algum modo, seria embaraçoso ter outras pessoas presentes..."
34040-106 = "C-Certamente! Vou verificar isso também!"
34040-111 = "[ns] \"Bom, então eu também vou até a Nagisa para avisá-la sobre isso.\""
34040-112 = "Sim... Obrigada, Sensei."
34040-113 = "Eu — parece que interagi com pessoas demais depois de tanto tempo... Vou me deitar um pouco."
34040-114 = "...Perdoe-me, Sensei. Com licença..."
34040-115 = "[s] \"Até a audiência de amanhã, então. Boa noite, Seia.\""
34040-116 = "...Sim, boa noite. Vá com cuidado."
34040-118 = "(Comuniquei à Nagisa que a Mika e a Seia participarão da audiência de amanhã.)"
34040-119 = "(Recebendo as palavras de gratidão de uma Nagisa radiante, decidi voltar cedo para a Schale a fim de me preparar para a audiência que acontecerá amanhã.)"
34040-124 = "...Sendo assim, passemos à próxima pauta."
34040-125 = "É isso aí!"
34040-126 = "Não tenho objeções... mas, antes disso, há algo que eu gostaria de confirmar."
34040-130 = "(...)"
34040-131 = "(Ora essa... Eu pretendia apenas descansar um pouco antes de a Mika chegar... Acabei pegando no sono sem perceber?)"
34040-132 = "(Dentro de um sonho lúcido outra vez... E pensar que ultimamente tem ficado cada vez mais difícil despertar dos sonhos...)"
34040-133 = "(Mas... onde exatamente eu estou...?)"
34040-135 = "Maestro, há algo que o intriga?"
34040-136 = "......"
34040-138 = "(...Eles são... Não pode ser...!?)"
34040-139 = "Tenho uma pergunta para a Beatrice."
34040-144 = "...Sim, o que seria?"
34040-145 = "(A Gematria...!?)"
34040-147 = "Próximo;Os Incompreensíveis Buscadores"
