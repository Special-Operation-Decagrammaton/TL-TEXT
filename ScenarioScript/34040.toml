[translation]
34040-1 = "Эпизод 4;Между сном и миражом"
34040-2 = ""
34040-3 = "[ns] «Ты видела падение Кивотоса...?»"
34040-4 = "..."
34040-5 = "Да. Я была его свидетелем."
34040-6 = "Я не знаю, когда это произойдёт, но знаю как."
34040-7 = "[s] «Что ты видела?»"
34040-9 = "Из кроваво-красного неба появляется огромная башня."
34040-12 = "Она разъедает весь мир, окутывая всё своей зловещей силой. Вместе с ней раздаётся ужасный визг."
34040-13 = "Затем обломки разрушенного мира бушуют, словно буря, а потом рассыпаются на части. Я помню, как сверху сиял чёрный свет..."
34040-15 = "И наконец Кивотос падает."
34040-16 = "Не остаётся ни следа."
34040-17 = ""
34040-18 = "[ns] «...»"
34040-19 = "Сердце хочет верить, что это был просто кошмар. Но это могло быть что угодно: фрагмент прошлого или видение будущего."
34040-20 = "У меня осталось бесконечное число вопросов. И я намерена найти на них ответы."
34040-21 = "..."
34040-22 = "Чтобы узнать больше, я начала погружаться в осознанные сны."
34040-23 = "Они существуют на границе реальности и сна, поэтому там трудно отличить будущее от прошлого."
34040-24 = "Даже когда бодрствую, кажется, будто я всё ещё в бесконечном сне."
34040-25 = "[s] «Это звучит опасно...»"
34040-26 = "Наверное, так и есть."
34040-27 = "Я всегда боялась будущего. Но на этот раз не смогла убежать."
34040-28 = "Я не остановлюсь, пока не узнаю нашу судьбу. Это моя ответственность."
34040-29 = "Башня... разрушение... Всё это было вызвано чем-то за пределами Кивотоса."
34040-30 = "Это лишь моя догадка... но причиной может быть Гематрия..."
34040-31 = "Я полагаю, вы тоже знаете об этой загадочной организации."
34040-32 = "[s] «Думаешь, здесь замешана Гематрия?!»"
34040-33 = ""
34040-35 = ""
34040-37 = ""
34040-39 = ""
34040-40 = "Должен быть способ остановить апокалипсис."
34040-41 = "[s] «Сэя.»"
34040-42 = "Да?"
34040-43 = "[s1] «Если это связано с Гематрией, ты должна сейчас же остановиться.»\n[s2] «Одной тебе это слишком опасно.»"
34040-44 = "..."
34040-45 = "..."
34040-46 = "Да, знаю. Преследовать настолько загадочных существ действительно опасно."
34040-47 = "[s3] «И кроме того, ты не можешь так себя изматывать.»\n[s4] «Просто не делай это одна. Мы можем работать вместе.»"
34040-50 = "..."
34040-51 = "[s] «Кому-то здесь, в реальности, ты нужна гораздо сильнее, чем твоим снам.»"
34040-52 = ""
34040-54 = ""
34040-55 = "...Мика."
34040-56 = "Вы правы, Сенсей."
34040-57 = "Я заблудилась в своих снах и перестала замечать то, что действительно важно."
34040-58 = ""
34040-60 = ""
34040-61 = "Я не смогу помочь Мике, если со мной что-нибудь случится."
34040-62 = "Я была глупа."
34040-63 = "Ситуация Мики чрезвычайно тяжёлая."
34040-64 = "Она выросла словно сказочная принцесса, которую все любили. Неудивительно, что она привыкла ожидать, что мир исполнит любую её прихоть."
34040-65 = "И теперь ей впервые в жизни приходится быть объектом всеобщей ненависти..."
34040-66 = "Я не знаю, сможет ли она это выдержать."
34040-67 = "Верно. Сейчас помощь Мике — главный приоритет."
34040-68 = "Как я могла быть настолько слепой?"
34040-69 = "Кажется, я наконец просыпаюсь от этих снов. Спасибо, Сенсей. Я должна помочь подруге."
34040-70 = "[s] «Мика будет счастлива. Она очень хочет извиниться.»"
34040-71 = "Извиниться? Хотя я уже простила её?"
34040-72 = "А. Наверное, это было во сне."
34040-73 = "Понятно... Мика думает, что я всё ещё её не простила."
34040-74 = "Наверное, в её глазах я главная жертва её поступков."
34040-75 = ""
34040-77 = "Ох, Мика. Какая дурочка."
34040-78 = "Она всегда была эгоистичной, импульсивной, бездумной, а временами ещё и саморазрушительной."
34040-79 = "Мика идеально подошла бы на роль дерзкой, высокомерной сказочной принцессы."
34040-80 = "Но ей досталась не эта роль."
34040-81 = ""
34040-82 = "Она стала злодейкой, которая пыталась травить человека, который ей не нравился."
34040-83 = "А потом сама оказалась втянута в историю ужасов с насилием и убийствами."
34040-84 = ""
34040-85 = ""
34040-86 = ""
34040-87 = "Но если для неё ещё существует хоть какое-то спасение..."
34040-88 = "...то лишь в том, что я не умерла, а её душа осталась невиновной в убийстве."
34040-89 = "Эта натянутая улыбка, которую она изображает, держится на одной этой мысли."
34040-90 = "Для неё очень многое зависит от моего состояния."
34040-91 = "Мика..."
34040-92 = "Я не была с ней добра, а она всё равно настолько переживает."
34040-93 = "Этот разговор давно назрел."
34040-94 = "Мы уже не младшеклассницы. Мне стыдно, что мы так боялись честно поговорить друг с другом."
34040-95 = "Я попрошу сейчас привести ко мне Мику."
34040-96 = "Хочу нормально с ней поговорить... и сказать, что буду присутствовать на слушании."
34040-97 = "Самое тяжёлое из её преступлений — ранение меня, поэтому мои слова в её защиту будут иметь большой вес."
34040-98 = ""
34040-100 = ""
34040-102 = "В-Вы звали, госпожа?"
34040-103 = "Простите, что отвлекаю. Можете, пожалуйста, привести ко мне Мику?"
34040-104 = "М-Мику? Я попрошу разрешения у Нагисы."
34040-105 = "Спасибо. Эм... И, пожалуйста, сообщите Нагисе, что я хотела бы поговорить с Микой наедине, если возможно."
34040-106 = "Есть, госпожа!"
34040-107 = ""
34040-109 = ""
34040-111 = "[ns] «А я пока вернусь к Нагисе.»"
34040-112 = "Спасибо. Было приятно поговорить, Сенсей."
34040-113 = "Я немного устала, поэтому полежу, пока жду Мику."
34040-114 = "Прошу прощения, Сенсей. Если позволите."
34040-115 = "[s] «Увидимся на слушании, Сэя. Береги себя.»"
34040-116 = "И вы, Сенсей."
34040-118 = "(Я сообщил Нагисе, что и Мика, и Сэя будут завтра на слушании.)"
34040-119 = "(Она обрадовалась новости и выглядела немного спокойнее. Я решил пораньше вернуться в Шале и подготовиться к завтрашнему слушанию.)"
34040-120 = ""
34040-124 = "Перейдём к следующему пункту."
34040-125 = "Конечно!"
34040-126 = "Я не возражаю, но сначала хочу кое-что уточнить."
34040-127 = ""
34040-129 = ""
34040-130 = "(...)"
34040-131 = "(Ох... Я уснула, пока ждала Мику.)"
34040-132 = "(Похоже, осознанные сны сильно сказались на здоровье. И просыпаться становится всё тяжелее.)"
34040-133 = "(Но важнее другое... где я?)"
34040-135 = "Говорите, Маэстро."
34040-136 = "..."
34040-138 = "(Это...! Н-Неужели правда?)"
34040-139 = "У меня есть... вопрос к Беатриче."
34040-140 = ""
34040-142 = ""
34040-143 = ""
34040-144 = "Ко мне? Прошу."
34040-145 = "(Это... Гематрия?!)"
34040-147 = "Следующий эпизод;Непостижимые искатели"
