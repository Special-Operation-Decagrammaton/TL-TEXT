[translation]
51080-1 = "Эпизод 8;В погоне девушки за юностью(?) 2"
51080-2 = ""
51080-3 = ""
51080-5 = "Эм... Сенсей? Кто они?"
51080-6 = "[s] «А, они из Клуба внутренней дисциплины. А это Юкари из Хяккарёран.»"
51080-8 = "...О! Хяккарёран!"
51080-9 = "В последнее время я часто слышу это название..."
51080-10 = "Хи-хи, приятно познакомиться! Я Мимори."
51080-11 = "О, точно!"
51080-12 = "Здравствуйте! Я Каэдэ! Моя цель — стать настоящей леди!"
51080-13 = "Здравствуйте..."
51080-15 = "Здравствуйте! Я, Юкари, рада со всеми вами познакомиться!"
51080-16 = "Я много слышала о Клубе внутренней дисциплины..."
51080-17 = "Мне рассказывали, что вы патрулируете районы и защищаете невинных."
51080-18 = "Справляемся, хотя Цубаки и Каэдэ не дают мне расслабляться."
51080-19 = "Ахаха. Но уверена, нам далеко до Хяккарёран..."
51080-20 = "Нет! Вы делаете прекрасную работу!"
51080-21 = "Правда? Хи-хи, какое облегчение."
51080-22 = "[s] «Что привело сюда Клуб внутренней дисциплины?»"
51080-24 = "А, насчёт этого! Мы помогаем с подготовкой к фестивалю!"
51080-25 = "Нас нанял... Фестивальный отдел..."
51080-26 = "Они поручили нам всё: от обслуживания объектов до патрулирования улиц во время Фестиваля фонарей Хяккияко."
51080-27 = "Президент Фестивального отдела настояла, чтобы мы им помогли! Она всё повторяла, что это о-о-о-о-очень важный фестиваль!"
51080-29 = "Их рассказ был очень похож на то, что мне говорили в Клубе Инь-Ян."
51080-31 = "Как и можно ожидать от «фестиваля фонарей», когда он начинается, небо заполняют яркие фонари..."
51080-32 = ""
51080-33 = "А когда фестиваль подходит к концу..."
51080-34 = "Мы доверяем фонарям наши надежды на будущее вместе с грузом прошлого и отпускаем их вниз по реке."
51080-35 = "Шизуко сказала, что этот фестиваль должен успокоить сердца людей."
51080-36 = "Сенсей, вы ведь помните тот день, когда небо стало красным...?"
51080-40 = "С тех пор обстановка в академии остаётся напряжённой."
51080-41 = "Думаю, Шизуко... всё это не даёт покоя."
51080-43 = "Поэтому мы прогоним эту гнетущую атмосферу весёлым фестивалем! Президент Фестивального отдела изо всех сил старается это устроить!"
51080-44 = "Все смогут насладиться фестивалем и отпустить плохие воспоминания вместе со своими фонарями! Разве не здорово?"
51080-45 = "А ещё я слышала, что на сцене выступит потрясающая мико с песней и танцем!"
51080-46 = "Завидую! Я тоже так хочу!"
51080-47 = "[s] «Мико... Это снова будет Чисэ?»"
51080-48 = "Нет, я слышала, что мико будет из той же семьи, которая традиционно выступала на каждом Фестивале фонарей. По крайней мере, пока фестиваль не прекратили проводить двадцать лет назад."
51080-49 = "Наверняка это кто-то потрясающий, да? Не могу дождаться, когда увижу, какая она красивая, Сенсей!"
51080-50 = ""
51080-53 = ""
51080-55 = "Шизуко, Пина и Умика прямо сейчас стараются изо всех сил, пока мы здесь разговариваем."
51080-56 = "Мы, Клуб внутренней дисциплины, тоже должны приложить все силы, чтобы им помочь."
51080-57 = "[s] «Вы все очень стараетесь.»"
51080-58 = ""
51080-60 = ""
51080-62 = ""
51080-63 = "Понятно... значит, вот что происходит."
51080-64 = "Это... очень... очень..."
51080-65 = ""
51080-67 = ""
51080-68 = ""
51080-70 = "Впечатляет! Нет, поразительно!"
51080-72 = "А-А?"
51080-73 = "Устроить фестиваль, чтобы облегчить бремя академии..."
51080-74 = "Потрясающе... Вы сказали, её зовут Шизуко?"
51080-75 = "Должно быть, в ней живёт дух воина!"
51080-77 = "А, да. И правда живёт."
51080-78 = "Но... Юкари."
51080-79 = "Да?"
51080-80 = "...Мы раньше не встречались? Ты кажешься мне знакомой..."
51080-81 = ""
51080-83 = ""
51080-84 = "А, н-ну...!"
51080-85 = "Сегодня очень жарко! Просто пекло!"
51080-86 = "Нужно обязательно следить, чтобы мы пили достаточно воды!"
51080-87 = "А? Д-Думаю, ты права...?"
51080-88 = ""
51080-91 = ""
51080-92 = "В любом случае, Сенсей!"
51080-93 = "Если бы вы могли забыть что-нибудь, отправив это воспоминание прочь вместе с фонарём... Что бы вы хотели отпустить?"
51080-94 = ""
