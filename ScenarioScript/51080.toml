[translation]
51080-1 = "Episódio 8;Garota da Juventude (?) (2)"
51080-5 = "Hã, Sensei...? Quem são estas senhoritas...?"
51080-6 = "[s] \"Estas são as garotas do Clube de Disciplina Interior. E esta é a Yukari, do Hyakkaryouran.\""
51080-8 = "Uau, do Hyakkaryouran...!"
51080-9 = "Hm? Ué, mas o Hyakkaryouran não..."
51080-10 = "Hihi, prazer em conhecê-la. Eu me chamo Mimori."
51080-11 = "Ah, é verdade."
51080-12 = "Olá! Eu sou a Kaede! Estou me esforçando para ser uma dama incrível!"
51080-13 = "Prazer em conhecê-la~"
51080-15 = "Eu me chamo Yukari. É uma grande honra conhecê-las!"
51080-16 = "Já ouvi falar muito bem de todas vocês do Clube de Disciplina Interior."
51080-17 = "Soube que estão sempre atuando como vigilantes da cidade."
51080-18 = "Sim, sempre junto com a Kaede-chan e a Tsubaki-chan."
51080-19 = "Comparadas a alguém do Hyakkaryouran, não tenho tanta certeza se conseguimos ser tão úteis assim..."
51080-20 = "Por favor, não sejam tão modestas!#nAcho as atividades de vocês verdadeiramente admiráveis!"
51080-21 = "Acha mesmo? Hihi, muito obrigada."
51080-22 = "[s] \"E então, o que vocês do Clube de Disciplina Interior estão fazendo por aqui?\""
51080-24 = "A gente estava ajudando nos preparativos do festival!"
51080-25 = "Desta vez também fomos chamadas pelo Comitê de Organização de Festivais~"
51080-26 = "Estamos ajudando para que o \"Festival das Lanternas de Hyakkiyako\" aconteça sem nenhum problema."
51080-27 = "Disseram que o festival deste ano é suuuuper importante!"
51080-29 = "(Ao perguntar mais detalhes, a história era praticamente a mesma que ouvi do Clube Yin-Yang.)"
51080-31 = "Durante o \"Festival das Lanternas\", lanternas são acesas por toda a cidade..."
51080-33 = "E, no final do festival, fazemos a cerimônia das lanternas flutuantes~"
51080-34 = "Soko-Geishin... despedir-se do passado e acolher o novo.#nDesejar um bom futuro e confiar as lembranças dolorosas às lanternas para que o rio as leve..."
51080-35 = "Assim, preparamos o coração para seguir um novo caminho — foi o que a Shizuko-chan disse."
51080-36 = "O Sensei também se lembra, né — do dia em que o céu ficou tingido de vermelho."
51080-40 = "Desde então, um clima meio sombrio continuou pairando sobre Hyakkiyako..."
51080-41 = "Parece que a Shizuko estava bem preocupada com isso."
51080-43 = "Por isso ela está dando tudo de si neste festival, para mudar o clima com uma festa super divertida!"
51080-44 = "A gente se diverte no festival e manda as lembranças ruins embora nas lanternas com o Toko-Noshin?! Incrível, né!"
51080-45 = "E mais! No final do festival, uma sacerdotisa suuuuper linda vai dançar no palco!"
51080-46 = "Que legal, eu também queria tentar fazer isso~"
51080-47 = "[s] \"Se é uma sacerdotisa, então desta vez também é a Chise...?\""
51080-48 = "Não, ouvi dizer que quem vai dançar é alguém de uma família tradicional que conduziu o ritual no \"Festival das Lanternas\" de vinte anos atrás."
51080-49 = "Com certeza deve ser uma beldade! Mal posso esperar para conhecê-la, Sensei!"
51080-55 = "Neste exato momento, a Shizuko-chan, a Pina-chan, a Umika-chan e todas as outras estão trabalhando nos preparativos..."
51080-56 = "Então nós do Clube de Disciplina Interior queremos ajudar no que pudermos."
51080-57 = "[s] \"Todo mundo está se esforçando bastante, hein.\""
51080-63 = "...Hmm, entendo."
51080-64 = "Isso é verdadeiramente..."
51080-70 = "Uma determinação esplêndida! Simplesmente exceleeente!"
51080-72 = "S-Sim?"
51080-73 = "Essa nobre iniciativa de organizar um festival para todos os que carregam um passado doloroso!"
51080-74 = "Vejamos... Shizuko-san, não foi isso que disse?"
51080-75 = "Ela é verdadeiramente admirável!"
51080-77 = "Sim, eu também acho."
51080-78 = "Só que... bem, Yukari-san."
51080-79 = "Sim?"
51080-80 = "Nós... por acaso já não nos conhecemos em algum lugar antes?#nPor algum motivo, sinto algo nostálgico em você..."
51080-84 = "Ah, hã, isso é...!"
51080-85 = "N-Nossa! Está fazendo tanto calor hoje, não é mesmo?!"
51080-86 = "Precisamos cuidar bem da saúde! Vocês todas também, viu!"
51080-87 = "...É-É verdade, né?"
51080-92 = "Ei, ei, Sensei!"
51080-93 = "Que tipo de desejo o Sensei vai fazer neste festival~?"
51080-99 = "(Enquanto converso descontraidamente com a Yukari e o pessoal do Clube de Disciplina Interior...)"
51080-107 = "Achei você! Sua pirralha do Hyakkaryouran!"
51080-108 = "Teve muita coragem de fazer o que bem entendeu da última vez, hein?!"
51080-114 = "E quem seriam... as senhoritas?"
51080-117 = "Chefe! Essa daí não é a mesma garota, não!"
51080-118 = "Hã?! Que se dane! Está usando o haori azul-claro, então é da mesma laia!"
51080-119 = "Vamos descontar nela e nos vingar!"
51080-121 = "Faz sentido! Genial como sempre, chefe!"
51080-126 = "A Trupe Chimi..."
51080-127 = "Não sabemos o motivo, mas elas sempre aparecem para causar confusão na época dos festivais!"
51080-128 = "Vão causar problemas de novo? Não vamos deixar barato!"
51080-137 = "...Cuidado!"
51080-149 = "[ns] \"Estão todas bem?!\""
51080-151 = "Hmph, quem estiver no caminho que suma daqui!"
51080-159 = "...vou perdoar."
51080-161 = "Hm?"
51080-163 = "Causar tumulto num lugar como este...#nE ainda por cima envolver as inocentes integrantes do Clube de Disciplina Interior...!"
51080-168 = "Eu jamais vou perdoar vocês!"
51080-170 = "Oh? Vai encarar?!"
51080-172 = "Sim, pois eu..."
51080-179 = "Como uma integrante de elite do Hyakkaryouran, irei derrotar todas vocês!"
51080-181 = "Até que você tem coragem, admito!"
51080-183 = "Mas nós somos a Trupe Chimi!"
51080-192 = "Acha mesmo que dá conta de todas nós sozinha?!"
51080-194 = "Tsc...!"
51080-218 = "P-Por acaso isto é...!"
51080-220 = "Q-Quem está aí?!"
51080-222 = "Só tirei os olhos por um segundo e já está essa bagunça toda..."
51080-229 = "Se quiserem continuar fazendo baderna, é melhor estarem preparadas."
51080-234 = "Essa voz... não pode ser...!"
51080-241 = "Se querem atrapalhar a minha juventude, eu mesma, Renge Fuwa, vou ser a oponente de vocês."
51080-246 = "...Renge-senpai?!"
51080-248 = "Droga... a-acabem com elas!"
