[translation]
90001045-2 = ""
90001045-3 = "Она замедляется! Токи!"
90001045-4 = "Да, госпожа Рио! Начинаю атаку!"
90001045-5 = ""
90001045-11 = ""
90001045-12 = "Попадание эффективно! Хотя... похоже, мы позволили ей уйти."
90001045-13 = "Тактическое отступление. Жаль, что она снова сбежала."
90001045-14 = ""
90001045-17 = ""
90001045-18 = "Факт: её отступление нам выгодно. Нам нужно время на оценку ситуации и перегруппировку."
90001045-19 = "Сигнал Гебуры... потерян. Она очень эффективно передвигается. Ну и ладно."
90001045-20 = ""
90001045-21 = ""
90001045-22 = "..."
90001045-23 = ""
90001045-25 = ""
90001045-26 = ""
90001045-27 = ""
90001045-28 = "..."
90001045-29 = "Здравствуйте, госпожа Рио. Это был эффективный выход во многих смыслах. Идеальный момент."
90001045-30 = ""
90001045-32 = ""
90001045-33 = "Но... с вами всё в порядке, президент Химари?"
90001045-34 = "Я совершенно, абсолютно не понимаю, почему тебе вдруг понадобилось проверять, всё ли со мной в порядке, но я в полном порядке! Я ни капли, ни капельки не ревную к кое-кому, кто ворвался сюда в ореоле славы и украл всё внимание!"
90001045-35 = "Потому что я великодушная! Щедрая! И добрая! Понимаешь, Эйми?!"
90001045-36 = "Да. Я понимаю, что президент дуется."
90001045-37 = "Ты клевещешь так же легко, как дышишь!"
90001045-38 = ""
90001045-40 = ""
90001045-41 = ""
90001045-42 = "Хмф. Начнём с самого поверхностного приветствия, на какое я способна."
90001045-43 = "Рада снова тебя видеть, Рио. Как поживаешь?"
90001045-44 = ""
90001045-45 = ""
90001045-46 = "Я..."
90001045-47 = "Ты не слышала, что я сказала: начнём с поверхностного приветствия?"
90001045-48 = ""
90001045-50 = ""
90001045-51 = ""
90001045-52 = "[ns] «Можешь начать с простого „привет“, Рио.»"
90001045-53 = "А. Да. Понятно. Эм..."
90001045-54 = "Привет. Я... рада тебя видеть. Как ты? Эм."
90001045-55 = "Да. Я искренне отвечаю взаимностью, госпожа Рио."
90001045-56 = "Вы хорошо спите? Надеюсь, вы не бодрствуете всю ночь и не спите до самого дня."
90001045-57 = "?!"
90001045-58 = "Управление циркадным ритмом — единственное, с чем домашние роботы не могут вам помочь."
90001045-59 = "Э-Это было..."
90001045-60 = "Я стараюсь..."
90001045-62 = "(Кажется, я могу представить, какой была совместная жизнь госпожи Рио и Токи.)"
90001045-63 = ""
90001045-65 = ""
90001045-66 = ""
90001045-67 = ""
90001045-68 = "Кхм! Может, теперь понемногу перейдём к делу?"
90001045-69 = "Для начала: всё это время ты не возвращалась в Миллениум. Где ты скрывалась?"
90001045-70 = "Это..."
90001045-71 = "Кроме того! У одного казначея Семинар накопилось к тебе немало слов!"
90001045-72 = "?!"
90001045-73 = "И я просто не могу закрыть глаза на твоё драматичное появление в такой критический момент."
90001045-74 = "Только не говори, что ты думала..."
90001045-75 = "...«Мне нужно сделать что-то, чтобы оправдать своё возвращение. Я не могу снова показаться им на глаза, пока мне нечего предложить.»"
90001045-76 = ""
90001045-78 = ""
90001045-79 = "...Я выслеживала каждую зацепку, связанную с силой Безымянных богов."
90001045-80 = "Силой Безымянных богов...?"
90001045-81 = "Да. Она не просто исчезла после того, как проявилась в... тот день. По всему Кивотосу остались её следы."
90001045-82 = "Я не ожидала встретить вас во время расследования."
90001045-83 = "(Её расследование силы Безымянных богов... привело её к пророкам Декаграмматона?)"
90001045-84 = ""
90001045-86 = ""
90001045-87 = "Я по-прежнему делаю всё возможное, чтобы подготовиться к неизвестному явлению, способному опустошить Кивотос, и не допустить его. Это не изменилось с тех пор, как я впервые создала Отряд Исследования Сверхъестественного."
90001045-88 = "У меня нет харизмы, и я не слишком хороша в общении. Поэтому я хотела делать то, что умею."
90001045-89 = "Так я надеялась... искупить вину."
90001045-90 = ""
90001045-91 = "..."
90001045-92 = "Ладно. Это я могу принять. Однако!"
90001045-93 = "Ты просто свалила на меня обязанности Отряда Исследования Сверхъестественного и исчезла. Поставила меня в положение, где я не могла отказаться!"
90001045-94 = "Несмотря на твою неприязнь ко мне, я знала, что ты доведёшь дело до конца."
90001045-95 = "...С определённой точки зрения это можно считать угрозой!"
90001045-96 = "[s3] «Ну-ну, давайте не будем ссориться...»\n[s4] «Если бы Рио не пришла, у нас могли быть большие проблемы, верно?»"
90001045-99 = "...Да. Даже я могу это признать."
90001045-100 = "Вообще-то, и помимо этого случая мы все так или иначе у тебя в долгу."
90001045-101 = "На самом деле я пыталась сказать: хватит мяться из-за бесполезных вещей вроде «искупления» или «оправданий» и просто возвращайся в Миллениум..."
90001045-102 = "А? Что ты сказала? Я что-то услышала?"
90001045-103 = "Забудь!"
90001045-104 = "Однако Отряд Исследования Сверхъестественного в итоге выполнила свою роль именно так, как и задумывалось, госпожа Рио."
90001045-105 = "Да. И я, превосходный агент и идеальная горничная, тоже идеально исполнила свою роль."
90001045-106 = "...Если не считать Токи, как основатель Отряда Исследования Сверхъестественного, что ты чувствуешь?"
90001045-107 = ""
90001045-109 = ""
90001045-110 = "Я... всё ещё пытаюсь понять."
90001045-111 = "Я так и думала, что ты ответишь."
90001045-112 = "Одно могу сказать точно: происходящее здесь имеет большое значение, и его последствия разойдутся далеко по всему Кивотосу."
90001045-113 = "Если кратко, ты знаешь то, чего не знаем мы."
90001045-114 = "И уверена, что по пути мы собрали данные, которых нет у тебя."
90001045-115 = "Так что вот моё предложение. Обмен информацией."
90001045-116 = "Это логичный вывод. Проведём этот обмен, продолжая преследовать Гебуру?"
90001045-117 = "Я принимаю эти условия. Эйми, ты знаешь, в каком направлении отступила Гебура?"
90001045-118 = "Подтверждаю. Я помню."
90001045-119 = "Чего мы ждём? Выдвигаемся, Сенсей."
90001045-121 = "Следующий эпизод;Переменная"
