[translation]
10039090-1 = "Послесловие;Отряд по изъятию имущества на сцене"
10039090-7 = ""
10039090-8 = ""
10039090-9 = "Настал день генеральной репетиции конкурса поп-идолов — главного события Карнавала."
10039090-10 = "Мне не терпелось увидеть, какие образы придумали студенты."
10039090-11 = ""
10039090-17 = ""
10039090-18 = "[ns1] «Эй, Сэрика.»\n[ns2] «Всё в порядке?»"
10039090-21 = "С-Сенсей, вы меня слышите?"
10039090-22 = ""
10039090-27 = "Сэрика позвонила мне с срочным сообщением и попросила прийти к Отряду по изъятию имущества."
10039090-28 = ""
10039090-32 = ""
10039090-33 = "Сенсей, скорее..."
10039090-34 = "[s] «Что случилось?»"
10039090-35 = "Аяне..."
10039090-36 = ""
10039090-38 = ""
10039090-39 = "Аяне пропала!"
10039090-40 = "[s] «Пропала?»"
10039090-41 = ""
10039090-43 = ""
10039090-45 = "Ох, репетиция уже скоро... Это ужасно..."
10039090-46 = "Она не отвечает на сообщения. Я боюсь, что с ней что-то случилось."
10039090-47 = "Прямо как тогда с Сэрикой..."
10039090-48 = ""
10039090-51 = ""
10039090-52 = "Нет, не так! Это СОВСЕМ другое!"
10039090-53 = "Интуиция подсказывает, что она права, это и правда другое..."
10039090-54 = "В любом случае, мы уже всё обыскали. Где она может быть?"
10039090-55 = "Мы надеялись, что у вас есть идеи, Сенсей."
10039090-56 = "[s] «Давайте подумаем, где мы ещё не искали и где она могла бы быть.»"
10039090-57 = "Верно. Хорошо, нужно думать быстро..."
10039090-66 = "Мы обыскали все места, которые только пришли в голову, пока наконец..."
10039090-67 = ""
10039090-75 = ""
10039090-76 = "[ns] «Аяне, вот ты где.»"
10039090-77 = "Хм?"
10039090-78 = ""
10039090-80 = ""
10039090-82 = ""
10039090-83 = ""
10039090-84 = "Сенсей?!"
10039090-85 = "Как вы...?"
10039090-86 = "[s3] «Мы тебя везде искали.»\n[s4] «Ты в порядке?»"
10039090-89 = "С-Сенсей..."
10039090-90 = ""
10039090-96 = "*тяжело дышит* *тяжело дышит* Аяне, мы тебя нашли!"
10039090-97 = "Ах, Аяне... Вот ты где. Как хорошо."
10039090-98 = "Мы все волновались, когда ты пропала."
10039090-99 = "Главное, что ты в порядке."
10039090-101 = "С-Сэрика... Все..."
10039090-102 = "Но почему ты здесь одна? Просто ушла и ничего не сказала."
10039090-103 = ""
10039090-105 = ""
10039090-106 = "*всхлипывает* *всхлипывает*"
10039090-107 = ""
10039090-109 = ""
10039090-110 = "А-Аяне?"
10039090-111 = "М-Мне страшно..."
10039090-112 = "А? Чего ты боишься?"
10039090-113 = "...Сцены..."
10039090-115 = "...А?"
10039090-116 = ""
10039090-118 = ""
10039090-120 = ""
10039090-121 = ""
10039090-122 = "Сцена... Она такая большая...!"
10039090-123 = ""
10039090-126 = ""
10039090-128 = ""
10039090-130 = "Я поднималась туда раньше, и она просто огромная..."
10039090-131 = "И там столько мест для зрителей... Она намного, намного больше, чем я представляла."
10039090-132 = "Ну, это ЖЕ самая большая сцена среди крупнейших школ, так что да!"
10039090-133 = "Я знаю, просто не думала, что она будет НАСТОЛЬКО большой!"
10039090-135 = "Ну, наверное... раз ты обычно не любишь выделяться..."
10039090-136 = "Я... не уверена, как решить эту проблему."
10039090-138 = "Ну отлично, И ЧТО мне теперь делать? Я уже забыла часть хореографии."
10039090-139 = "Я собиралась просто смотреть на тебя и повторять!"
10039090-140 = "П-Прости... Я, наверное, только всё тебе испорчу..."
10039090-141 = "От одной мысли, что придётся стоять там перед всеми этими людьми, голова пустеет. Всё плывёт перед глазами, и мне трудно дышать..."
10039090-142 = "Но если я разрушу весь наш план..."
10039090-143 = "[s] «План...?»"
10039090-145 = "Мы собирались выиграть призовые, погасить долг школы и наконец заменить старый вентилятор."
10039090-146 = "Мы сразу поставили высокую цель. С самого начала шли за победой."
10039090-147 = "И когда Серика с Аяне вместе, мы думали, что у нас есть шанс... ☆"
10039090-149 = "Но теперь весь ПЛАН рухнул из-за того, что я слишком нервничаю..."
10039090-150 = "Ну, если поможет, призовые — скорее просто приятный бонус. На самом деле денег там не так уж много."
10039090-151 = ""
10039090-154 = ""
10039090-155 = "...Правда?"
10039090-157 = "Н-Но всё равно..."
10039090-158 = "Я ведь всем вам обещала... *всхлип*"
10039090-160 = "Вот из-за чего ты переживаешь...?"
10039090-161 = "Эй, Аяне, вставай! Сидя ты только ещё больше тратишь силы!"
10039090-162 = "Хм... А что если завязать тебе глаза? Тогда ты не увидишь зрителей."
10039090-164 = "Думаю, минусов будет больше, чем плюсов. Ей станет сложнее двигаться, и ошибок может стать ещё больше."
10039090-165 = "К тому же дело не только в том, что она видит или не видит. На такой сцене атмосфера тоже играет огромную роль. Воздух словно наэлектризован."
10039090-166 = "Да, даже я никогда раньше не выступала на настолько большой сцене."
10039090-167 = "Ну, надо как-то снять с неё давление, хотя бы немного."
10039090-168 = "Сенсей, у вас есть идеи?"
10039090-169 = ""
10039090-171 = ""
10039090-172 = ""
10039090-174 = ""
10039090-175 = "[ns] «...Аяне, можем поговорить минутку?»"
10039090-176 = ""
10039090-177 = "Сенсей..."
10039090-178 = "[s5] «Я понимаю, для тебя это совершенно новый опыт.»\n[s6] «Выступать перед всеми непросто.»"
10039090-181 = "Да ведь? Одно дело тренироваться в нашей маленькой комнате, а там..."
10039090-182 = "Стоит только представить всех этих людей, смотрящих на меня..."
10039090-183 = "Чем больше думаю, тем быстрее колотится сердце."
10039090-184 = "[s] «Тогда как насчёт такого?»"
10039090-185 = ""
10039090-187 = ""
10039090-189 = "[ns7] «Отряд по изъятию имущества тоже будет среди зрителей.»\n[ns8] «Сосредоточься на друзьях.»"
10039090-190 = ""
10039090-191 = ""
10039090-193 = ""
10039090-194 = "А-А?"
10039090-195 = "[s9] «Когда сильно концентрируешься, поле зрения сужается.»\n[s10] «Сделай так, и остальная толпа будет меньше мешать.»"
10039090-198 = "Д-думаешь...?"
10039090-199 = "[s] «Думаю. И я тоже буду сидеть там.»"
10039090-200 = "И вы тоже, да?"
10039090-201 = "Думаю, стоит попробовать."
10039090-202 = "Широко?"
10039090-203 = "Когда я предельно сосредоточена, вижу только цель."
10039090-204 = "Например, когда веду дрон через вентиляцию или отслеживаю цикл патрулирования охраны банка..."
10039090-205 = "Примеры подозрительно конкретные, но если работает — пусть."
10039090-206 = ""
10039090-208 = ""
10039090-210 = ""
10039090-211 = "Да, давай попробуем, Аяне!"
10039090-212 = ""
10039090-214 = ""
10039090-215 = "Это ведь всего лишь репетиция, правда? Даже если ошибёшься, это ещё не настоящее выступление."
10039090-216 = "Серика..."
10039090-217 = "Это не то, чего хотела ни одна из нас, но мы обе усердно тренировались, правда?"
10039090-218 = "Не хочется, чтобы весь этот труд пропал зря."
10039090-219 = "Давай попробуем идею Сенсея. Если всё равно не получится, будем думать дальше."
10039090-220 = ""
10039090-222 = ""
10039090-224 = ""
10039090-225 = "Но что бы ни случилось, выложимся на полную, как всегда!"
10039090-226 = ""
10039090-228 = ""
10039090-230 = ""
10039090-231 = ""
10039090-232 = "Хм..."
10039090-233 = "Да... Хорошо!"
10039090-235 = "Ладно, Аяне!"
10039090-236 = "Как сказала Сэрика, сейчас уже нельзя сдаваться."
10039090-237 = "Неважно, насколько огромна сцена, насколько огромная, страшная и пугающая толпа..."
10039090-238 = ""
10039090-240 = ""
10039090-241 = "Мы сделаем это ради всей крови, пота и слёз, которые уже пролили!"
10039090-242 = "Насчёт крови не уверена, но да."
10039090-243 = "Мы осветим эту сцену как светошумовая граната!"
10039090-244 = ""
10039090-246 = ""
10039090-247 = "МЕТАФОРИЧЕСКАЯ светошумовая граната. И это всё ещё репетиция. Оставь что-нибудь и для настоящего выступления!"
10039090-248 = ""
10039090-250 = ""
10039090-252 = "Хи-хи! Ну вот, моя милая младшая наконец ожила!"
10039090-253 = "Рада, что она снова настроилась."
10039090-255 = "Верно. С таким настроем мы справимся!"
10039090-256 = ""
10039090-258 = ""
10039090-259 = "Готова поспорить, как минимум половина зрителей будет на нашей стороне!"
10039090-261 = "...То есть мы эмоционально их покорим, да?"
10039090-262 = "Ну, идём заканчивать подготовку."
10039090-263 = ""
10039090-266 = ""
10039090-267 = "Давайте. Теперь меня уже ничто не остановит."
10039090-268 = "Все остальные, пожалуйста, смотрите!"
10039090-269 = "[s11] «Обязательно.»\n[s12] «Ты справишься, Аяне.»"
10039090-272 = "Хи-хи, спасибо..."
10039090-273 = ""
10039090-275 = ""
10039090-276 = "О, Сэрика, какую часть хореографии ты забыла? Давай быстро повторим вместе!"
10039090-277 = ""
10039090-280 = ""
10039090-281 = "А, да! Там где..."
10039090-283 = "Пора! Быстрее, вам пора на сцену! ☆"
10039090-287 = ""
10039090-289 = ""
10039090-290 = "Поначалу Аяне была зациклена на зрителях, но с началом выступления мы увидели, как она понемногу расслабляется."
10039090-291 = "Сцена находилась далеко от зрителей, поэтому друг для друга они казались маленькими."
10039090-296 = ""
10039090-297 = "Хотя это была лишь репетиция, даже на такой огромной сцене Аяне и Серика показали прекрасное выступление."
