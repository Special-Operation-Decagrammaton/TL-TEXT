[translation]
10055175-3 = "Wow! Satsuki-senpai! Amazing!"
10055175-4 = "W-wait, I won?"
10055175-5 = "I loooost..."
10055175-6 = "Ugh... to think that Chise-chan would lose...!"
10055175-7 = "Well, well, even a genius can lose sometimes~"
10055175-11 = "Summer sea,"
10055175-12 = "Hermit crab meeting,"
10055175-13 = "No moves left."
10055175-14 = "An impromptu haiku from Chise-chan!?"
10055175-15 = "To find inspiration in defeat...!#nTruly, turning a misfortune into a blessing...!"
10055175-16 = "Nyahaha. Ups and downs, back and forth—Kaho really is just like the Hyakkiyako Yin-Yang Club."
10055175-17 = "...What is the meaning of this!?"
10055175-18 = "Oops, looks like I've overstayed my welcome."
10055175-22 = "Why is the head of the Hyakkiyako Yin-Yang Club here!?"
10055175-24 = "...I see. So that's what happened while I was away."
10055175-25 = "Well done, Satsuki!"
10055175-26 = "In short, Pandemonium Society is one step closer to victory!"
10055175-27 = "No, isn't there something else you should be asking?"
10055175-28 = "There is no fact greater than a victory report! Hand over the star of the Yin-Yang Club at once!"
10055175-29 = "Yes, here you go~"
10055175-33 = "Kishishi! With this, Hyakkiyako is conquered too!"
10055175-34 = "You're free to interpret it however you like, but...#nwe aren't the representatives of Hyakkiyako, you know?"
10055175-35 = "I am well aware that the Yin-Yang Club is not the student council.#nHyakkiyako is a federation academy, after all."
10055175-36 = "It's a bit difficult to explain to outsiders... hmm?"
10055175-37 = "However, if we defeat the Yin-Yang Club, which effectively manages Hyakkiyako, #nthe other clubs will naturally acknowledge Gehenna's hegemony."
10055175-38 = "The only ones who might resist are the Hyakkiyaran Alliance, since they possess independent military power...#nIs there any error in my assessment?"
10055175-39 = "...Oh my, you certainly are well-informed~"
10055175-40 = "Kishishi! Praise me more!"
10055175-41 = "Nyahaha! As expected of President Makoto!"
10055175-42 = "...She's surprisingly not someone to be underestimated. It might have actually been lucky to meet her in person."
10055175-46 = "U-um... what is it?"
10055175-47 = "This."
10055175-51 = "...What is this? It just looks like sand."
10055175-52 = "Isn't it pretty?"
10055175-53 = "Well, it's mixed with seashells and it's sparkling... now that you mention it, it is pretty, but..."
10055175-54 = "Here, take it."
10055175-58 = "Hey! Don't just dump it in my hand like that...!"
10055175-59 = "Oh! Friendship blossoming after a match! This is truly a page out of a youth story!"
10055175-60 = "Motomiya Chiaki, I am moved!"
10055175-61 = "What part of that was moving...?"
10055175-62 = "S-stop! It's spilling! It's spilling everywhere!!"