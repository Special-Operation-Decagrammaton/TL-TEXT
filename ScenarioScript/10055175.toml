[translation]
10055175-2 = ""
10055175-3 = "Ого! Сацуки, это было здорово!"
10055175-4 = "Я-я победила?"
10055175-5 = "Повержена-а..."
10055175-6 = "Ох, Чисе...!"
10055175-7 = "Ничего, ничего. Иногда побеждаешь, иногда проигрываешь."
10055175-8 = ""
10055175-10 = ""
10055175-11 = "Лето у моря"
10055175-12 = "Сражаюсь с раком-отшельником"
10055175-13 = "Не видать мне победы"
10055175-14 = "*ах* Хайку? Она что, только что его сочинила?"
10055175-15 = "...Неужели поражение вдохновило её? В столь тёмный час нас осенило благословение!"
10055175-16 = "Ня-ха-ха! То грустят, то радуются, то носятся туда-сюда. Вот вам весь Клуб инь-ян."
10055175-17 = "ЧТО вообще здесь творится?!"
10055175-18 = "Ой. Похоже, мы слишком задержались."
10055175-19 = ""
10055175-21 = ""
10055175-22 = "Председатель Клуба инь-ян?! Что вы здесь делаете?!"
10055175-23 = ""
10055175-24 = "...Понятно. Похоже, вы славно потрудились."
10055175-25 = "И должна сказать, Сацуки, молодец!"
10055175-26 = "Общество Пандемониума снова победило!"
10055175-27 = "И это всё, что ты вынесла? Серьёзно?"
10055175-28 = "Что может быть важнее победы?! А теперь, Клуб инь-ян, отдавайте вашу звезду!"
10055175-29 = "Да-да. Вот, держите."
10055175-30 = ""
10055175-32 = ""
10055175-33 = "Ки-хе-хе! И вот великая Хяккияко пала перед нами!"
10055175-34 = "Ну, можно и так сказать, но наш клуб ведь не вся академия."
10055175-35 = "Знаю. Вы не студсовет. Хяккияко ведь союз школ."
10055175-36 = "Удивлена, что ты это знаешь. Обычно приходится долго объяснять."
10055175-37 = "И всё-таки именно ваш клуб объединяет различные фракции академии. Победив вас, мы показали всем окружающим своё превосходство."
10055175-38 = "Теперь бросить нам вызов осмелится разве что Совет по разрешению конфликтов «Хяккарёран» с собственной независимой вооружённой силой. Верно?"
10055175-39 = "...Ого, ты НЕВЕРОЯТНО хорошо осведомлена, знаешь?"
10055175-40 = "Ки-хе-хе! Ещё! Хвалите меня ещё!"
10055175-41 = "Ня-ха! Ты вполне оправдываешь свою репутацию, председатель Макото!"
10055175-42 = "...Встреча с ней неожиданно оказалась полезной. Недооценивать её нельзя."
10055175-43 = ""
10055175-45 = ""
10055175-46 = "Х-хм? Что такое?"
10055175-47 = "Вот это."
10055175-48 = ""
10055175-50 = ""
10055175-51 = "...Что, песок?"
10055175-52 = "Красивый, правда?"
10055175-53 = "...Ну, в каком-то смысле. В нём ракушки поблёскивают..."
10055175-54 = "На, возьми немножко."
10055175-55 = ""
10055175-57 = ""
10055175-58 = "Э-эй, постой! Нельзя просто высыпать его мне в руку!"
10055175-59 = "О! Юные соперники после напряжённого поединка обретают дружбу!"
10055175-60 = "Какая прекрасная история! Как трогательно!"
10055175-61 = "И что здесь трогательного...?"
10055175-62 = "Э-эй, прекрати! Ты везде его рассыпаешь!"
