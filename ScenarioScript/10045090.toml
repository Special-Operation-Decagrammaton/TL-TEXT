[translation]
10045090-1 = "Эпизод 9;Финальный раунд: Нокаут"
10045090-2 = "И снова добро пожаловать! Поприветствуйте тёплыми аплодисментами оставшихся игроков! Из первоначальных 100 осталось всего четверо!"
10045090-3 = ""
10045090-5 = ""
10045090-6 = "Кто из этих выдающихся участников останется последним на ногах? Узнаем только одним способом!"
10045090-8 = "Первой у нас оперативный офицер Хяккарёран. Враги дрожат при одном её появлении, ведь её тактическим навыкам нет равных!"
10045090-9 = "Несравненная Кирю Кикё! Но правда ли, что эта безупречная тактик боится воды?!"
10045090-10 = "И кто именно распускает такие слухи?"
10045090-11 = "And of course, we have the Hyakkaryouran's Assault Squad Captain! She's a force of nature who's known for her act-first-think-later policies!"
10045090-12 = "Но в глубине души она такая же девушка, как и мы, отчаянно ищущая смысл «юности» с невинным сердцем! Фува Рэнгэ!"
10045090-13 = "...Кто пишет эти представления?"
10045090-14 = ""
10045090-15 = "[ns] «...?!»"
10045090-16 = "Сенсей? Что случилось?"
10045090-17 = "[s] «Н-Ничего. Просто меня пробрал холодок, наверное, ветер.»"
10045090-18 = "Хм...?"
10045090-19 = "Н-Ну, в любом случае! Давайте начнём матч! Игроки, по местам!"
10045090-20 = "Итак, честный бой! Начинаем!"
10045090-21 = ""
10045090-24 = ""
10045090-25 = ""
10045090-26 = "Ну? Давай, нападай!"
10045090-27 = "Это мои слова. Я совершенно беззащитна, почему ты стоишь столбом?"
10045090-28 = "Ба! Совсем ты не выглядишь беззащитной!"
10045090-29 = "Ты... не сдалась."
10045090-30 = "Как я могла? Я не могла бы назвать себя подругой, если бы ответила на твою искренность грязными приёмами."
10045090-31 = "Именно. Я выиграю честно."
10045090-32 = "Вот как? Думаю, преимущество здесь у меня."
10045090-33 = "Почему ты так решила?"
10045090-34 = "Тактик никогда не раскрывает секретов. Если ты не идёшь, тогда пойду я."
10045090-35 = "Вот как?"
10045090-37 = "Тогда придётся выяснить самой!"
10045090-39 = ""
10045090-41 = ""
10045090-42 = ""
10045090-43 = ""
10045090-45 = "Началось!"
10045090-47 = ""
10045090-49 = ""
10045090-50 = ""
10045090-51 = "Хм? Не ожидала, что книжный червь вроде тебя так хорошо дерётся!"
10045090-52 = "Я из Хяккарёран. Я никогда не пренебрегала физическими тренировками."
10045090-53 = "А твоя проблема всё та же, что и в детстве. Ты придерживаешься философии грубой силы независимо от ситуации."
10045090-54 = "А? Что там было, когда мы были детьми?"
10045090-55 = "Помнишь наше соревнование на качелях в семь лет? Кто раскачается выше?"
10045090-56 = "...А?"
10045090-57 = "Фуфу. Возможно, ты вытеснила это воспоминание. Я победила, потому что ты, как всегда, полагалась только на силу."
10045090-58 = "Я до сих пор помню вкус сладостей, которые ты целую неделю покупала мне в наказание."
10045090-59 = "Это древняя история!"
10045090-61 = "Не слышала? История повторяется!"
10045090-62 = ""
10045090-65 = "Угх?!"
10045090-66 = ""
10045090-68 = ""
10045090-70 = "Боже мой! Одним быстрым движением Кикё выбивает ноги Рэнгэ из-под неё и валит её!"
10045090-71 = "И теперь...!"
10045090-72 = ""
10045090-75 = "Она обхватила Рэнгэ ногами и крепко удерживает! Ах! Она тянет её вниз!"
10045090-76 = "[ns] «Её план, должно быть, вымотать Рэнгэ и столкнуть её!»"
10045090-77 = "Из такого захвата выбраться непросто! Сможет ли Рэнгэ освободиться?"
10045090-78 = "Ух! Ты и твой большой мозг!"
10045090-79 = "Но не думай, что я сдамся без боя! Отпусти!"
10045090-80 = ""
10045090-83 = ""
10045090-84 = ""
10045090-85 = "Ух. Как ты выбралась...?"
10045090-86 = "Я уже не тот ребёнок, который не понимал, как раскачаться выше! Всё-таки я училась у лучших. Я приберегла часть силы на случай, если ты сделаешь что-то подобное."
10045090-87 = "Сначала я хотела увидеть, что ты задумала."
10045090-89 = "...Ты права. Похоже, в этой мышечной голове всё-таки работают несколько нейронов."
10045090-90 = "А ты? С каких пор ты умеешь делать треугольный удушающий?"
10045090-91 = "Это одна из основ вязания."
10045090-92 = "Что ты вообще такое вязала?!"
10045090-93 = "...Я связала свою цель."
10045090-94 = "*вздох* Наверное, для тебя это логично."
10045090-95 = "Надеюсь, у тебя есть ещё несколько приёмов в запасе, потому что второй раз это на мне не сработает!"
10045090-96 = ""
10045090-98 = ""
10045090-99 = ""
10045090-100 = ""
10045090-101 = ""
10045090-102 = ""
10045090-103 = ""
10045090-104 = "Я знала, что Кикё так легко не сдастся!"
10045090-105 = "Я рада видеть, что она сражается не ради других, а ради себя."
10045090-106 = "Но физический характер этой схватки склоняет чашу весов в пользу Рэнгэ, разве нет?"
10045090-107 = "Это правда. Некоторые сказали бы, что преимущество на её стороне."
10045090-108 = "Однако они не учитывают одну вещь о Кирю Кикё."
10045090-110 = "Она оперативный офицер Хяккарёран!"
10045090-111 = "И в тактическом мастерстве ей нет равных!"
10045090-112 = ""
10045090-113 = ""
10045090-114 = ""
10045090-116 = "...Ты открылась."
10045090-117 = ""
10045090-119 = ""
10045090-120 = "Что ты делаешь? Пол..."
10045090-121 = "Агх?!"
10045090-122 = ""
10045090-125 = "Ах! Как умно! Кикё использовала упругость платформы, чтобы резко бросить себя вперёд! А Рэнгэ потеряла равновесие!"
10045090-126 = "Я столкну тебя!"
10045090-127 = "Не позволю...!!"
10045090-128 = ""
10045090-131 = ""
10045090-132 = ""
10045090-133 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
10045090-134 = "*хрипит*"
10045090-135 = "Скажи мне кое-что. Что случилось? Раньше ты была решительно настроена сдаться."
10045090-136 = "Как я и сказала. Я просто ответила на твой зов."
10045090-137 = "И это всё?"
10045090-138 = "Это..."
10045090-139 = "...В конце концов, это был не мой бой, чтобы его бросать."
10045090-141 = "А? Что вы имеете в виду?"
10045090-142 = "Я с самого начала собиралась выйти из матча, как только он начнётся."
10045090-143 = "Мой долг — перед Хяккарёран. Всегда."
10045090-144 = "Но на этот раз... На этот раз я почувствовала, что обязана не только нашей команде."
10045090-146 = "...Я почувствовала долг перед теми, кто поверил в меня, несмотря на всё, чего мне не хватает."
10045090-147 = ""
10045090-149 = ""
10045090-150 = "Перед Нагусой и Юкари."
10045090-151 = ""
10045090-153 = ""
10045090-154 = ""
10045090-155 = "Перед теми, кто оказал мне помощь."
10045090-156 = ""
10045090-158 = ""
10045090-159 = ""
10045090-160 = "Перед Сенсеем и зрителями."
10045090-161 = ""
10045090-163 = ""
10045090-164 = ""
10045090-165 = "И... перед тобой, Рэнгэ."
10045090-166 = ""
10045090-167 = "Я обманула всех по своим эгоистичным причинам. Но никто не отвернулся от меня."
10045090-168 = "Поэтому я не буду — не могу сдаться здесь."
10045090-169 = "Ради чести Хяккарёран."
10045090-170 = "И ради всех, кто толкал меня вперёд."
10045090-171 = "И ради нашей дружбы. Всех нас."
10045090-172 = "Ха! Вот это мне нравится слышать."
