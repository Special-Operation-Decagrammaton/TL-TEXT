[translation]
101020-1 = "Эпизод 2; Катастрофа"
101020-3 = "Где-то во сне"
101020-4 = ""
101020-5 = "..."
101020-6 = "..."
101020-7 = "Ты ведь...? Что это за место?"
101020-8 = "Но важнее... твоё тело..."
101020-9 = ""
101020-11 = ""
101020-12 = "Ты столкнулась с Хромой, не так ли?"
101020-13 = ""
101020-15 = ""
101020-16 = "Как любопытно... Несмотря на контакт, твоё сознание, похоже, более-менее ясно."
101020-17 = "Хрома...?"
101020-18 = "Хрому проще всего описать как непостижимую... силу, таящуюся за пределами Кивотоса."
101020-19 = "Обладает ли она разумом? Личностью? Свободной волей? О её истинной природе я пока знаю слишком мало."
101020-20 = "Но я точно знаю одно: для жителей Кивотоса она смертельный яд."
101020-21 = "Стоит подвергнуться воздействию Хромы — и ты уже никогда не станешь прежней. Твой дух разобьётся на части, а тело исказится, приняв новую форму."
101020-22 = "Ты можешь и не умереть, но любой житель Кивотоса, соприкоснувшийся с ней, перестанет узнавать самого себя. Он полностью преобразится в новое существо."
101020-23 = "Не бойся, Хрома не найдёт Кивотос."
101020-24 = "Чтобы Хрома проникла в наш город, ей пришлось бы искать иголку в стоге сена. Это было бы одновременно чудом и катастрофой."
101020-25 = "Не думаю, что ты полностью соприкоснулась с Хромой, раз сохранила сознание. Расскажи, что с тобой произошло?"
101020-26 = "Ну..."
101020-27 = "Пожалуйста, дай мне осмотреть тебя. Не двигайся."
101020-28 = ""
101020-30 = ""
101020-31 = ""
101020-34 = ""
101020-35 = ""
101020-36 = "Итак. Прошу прощения, Пророчица Тринити."
101020-37 = "..."
101020-42 = "Ты застряла в моей паутине без выхода. Страшно, Сэя? Боишься силы за пределами Кивотоса, от которой не можешь отвести взгляд?"
101020-43 = "Само твоё существование привлекло её, как мотылька к огню."
101020-46 = "...Эта штука."
101020-47 = "Ты сделала лишний шаг навстречу силам, которых не понимала. И теперь они подчинили тебя."
101020-48 = ""
101020-49 = "...Понятно. Кто-то попытался использовать силу Хромы ради собственной выгоды."
101020-50 = "Они провели ритуал, чтобы призвать Хрому в Кивотос. К счастью для всех нас, ритуал был незавершён."
101020-51 = "Это и объясняет твоё нынешнее состояние. Ты не столкнулась с Хромой напрямую."
101020-52 = "Ты увидела лишь далёкий образ через окно — пейзаж, едва различимый сквозь дымку твоих снов."
101020-53 = "Если бы ты протянула руку через это окно, уйти оттуда так, как сейчас, уже не смогла бы."
101020-54 = "..."
101020-55 = "Хотя и без ран ты не ушла. Здесь, в этом пространстве, твой разум рядом со мной в безопасности, но твоё тело, вероятно, прямо сейчас распадается."
101020-56 = "Не может быть! Я не могу! Там есть вещи, которые могу сделать только я, и я обязана исполнить свой долг. А моя подруга... моя подруга..."
101020-57 = "Должен быть способ это остановить."
101020-58 = "Его нет."
101020-59 = ""
101020-61 = ""
101020-62 = "Таков был бы обычный ответ."
101020-63 = "Однако тебе повезло встретить меня — Кузуху, Великую пророчицу Хяккияко."
101020-64 = "...Кузуха."
101020-65 = "Я безопасно верну тебя в твоё тело. Но, конечно же, ничего нельзя получить без равноценной потери."
101020-66 = "Равноценной потери?"
101020-67 = "Да, своего рода плата. Ради безопасного возвращения тебе придётся пожертвовать одной из сущностей своей души. Ты должна оставить здесь способность видеть будущее."
101020-68 = "Хрома искажает эти сущности, о которых я говорю. А может, лишь вытаскивает наружу то, что скрывается под поверхностью. Как бы то ни было, если позволить заражённым сущностям разрастаться, из-за Хромы ты утратишь саму себя."
101020-69 = "Но отпусти её, извлеки яд прежде, чем его ползучие пальцы успеют вцепиться в твою душу, — и ты освободишься от разложения Хромы."
101020-70 = "Ну так что? Пожертвуешь ли ты навыком, которым так гордишься, чтобы исполнить свой провозглашённый «долг», Пророчица Тринити?"
101020-71 = ""
101020-73 = ""
101020-74 = ""
101020-76 = "Да. Пожертвую!"
101020-77 = "Столько решимости и ни тени сомнения. Ради друзей? Как похвально. Чудесно, чудесно."
101020-79 = "Тогда прощай, Сэя. Знай: в своём мире ты меня не найдёшь. Там меня не существует."
101020-80 = ""
101020-82 = ""
101020-83 = "...?!"
101020-84 = "Ах да. Вещие сны всё ещё могут мелькать на краю твоего зрения, словно калейдоскоп за окном. Удачи."
101020-85 = ""
101020-86 = ""
101020-87 = "А-а-а-а!"
101020-97 = "Зал совещаний Гематрия"
101020-99 = ""
101020-100 = "Прошу прощения за опоздание. Мне нужно было кое о чём позаботиться."
101020-101 = ""
101020-103 = ""
101020-104 = "..."
101020-105 = "..."
101020-106 = "..."
101020-107 = "Все в сборе."
101020-109 = "Начнём."
101020-110 = "Недавно мы обнаружили наследие Безымянных жрецов."
101020-111 = "..."
101020-112 = "Глупо даже спрашивать, но кто именно эти Безымянные жрецы, Чёрный Костюм?"
101020-113 = "Даже я понимаю основы. Способность Беатрис защищать королевскую кровь, крылатая ракета, достаточно мощная, чтобы уничтожить собор, — всё это дары Безымянных жрецов, разве нет?"
101020-114 = "Сложив головы вместе, я пришёл к выводу: рядом с их технологиями технологии Кивотоса выглядят как ребёнок, играющий в грязи."
101020-115 = "Верно. Когда-то Безымянные жрецы были хозяевами мира, существовавшего до Кивотоса."
101020-116 = "О-хо?"
101020-118 = "Именно. До мира, каким мы знаем его сейчас, существовали Безымянные боги — возвышенные существа своего времени. В по большей части загадочных летописях Кивотоса можно различить лишь слабейшие следы их существования."
101020-119 = "Мы знаем, в каких формах являлись эти боги: тайфуны, скалы и деревья, молнии — список можно продолжать. Они принимали грубые формы природы, но в действительности воплощали саму тайну и ужас сотворения."
101020-120 = "О Безымянных жрецах, поклонявшихся им, я могу сказать совсем немного, кроме того, что к Кивотосу и его жителям они добрых чувств не питают."
101020-121 = "И хотя самих жрецов мы так и не встретили, их технологии разбросаны по этим землям. Именно это меня и интересует."
101020-122 = "Ведь, как мы уже убедились, на чёрном рынке их технологии стоят очень, очень дорого. Хе-хе."
101020-123 = "..."
101020-124 = "Но Голконда сообщил мне, что ситуация изменилась и сейчас у нас есть куда более серьёзные заботы, чем ценники."
101020-125 = "Ах, да! Она промелькнула лишь на мгновение, но мы наблюдали Ковчег. Именно так."
101020-126 = "Что значит «наблюдали»? Это подразумевает, что Ковчег — не предмет, который можно увидеть, а явление, которое можно наблюдать."
101020-127 = "Ну..."
101020-128 = "Ха-ха! Увлекательно! Всё это время я искал физический Ковчег, но вы предполагаете, что он нематериален."
101020-129 = "А значит, использовать Кайзер Group, чтобы перерыть Пустыню Абидос, было напрасно. Похоже, я, так сказать... ошибся."
101020-130 = "Да, да. Любопытно. Если так, Ковчег вполне можно считать воплощённой концепцией — зверинцем переплетающихся тайн."
101020-131 = "Хм. Впрочем, домыслы никому не помогут. Продолжим."
101020-132 = "Безымянные жрецы и их войска, считавшиеся исчезнувшими, вновь дали о себе знать. Ситуация приняла неожиданный оборот."
101020-133 = "Появление Шале, неудача с захватом величайшей тайны Кивотоса, потеря нашей единственной территории в Ариусе, смерть Декаграмматона..."
101020-134 = "А теперь ещё наследие Безымянных жрецов и появление Ковчега..."
101020-135 = "Всё пошло наперекосяк. Хотя такой исход, полагаю, не был невозможен."
101020-136 = "Но реальность такова: непредсказанные и неподконтрольные переменные бесцеремонно вмешались в наши планы. Мы потеряли контроль над ситуацией."
101020-137 = "А что ещё хуже..."
101020-139 = "Вы хотите сказать, Беатрис сделала всё ещё хуже. Хрома никогда бы не обнаружила существование Кивотоса, если бы не её ритуал."
101020-140 = "..."
101020-142 = "Твой безвкусный ритуал позволил Хроме соприкоснуться с Кивотосом. Ты знала о рисках, когда гналась за своими желаниями?"
101020-143 = "Нет-нет. Связаться с Хромой никогда не было её целью — она хотела завладеть её силой! Мадам не стремилась подвергнуть нас её воздействию."
101020-144 = "Тем хуже! Она искала личной выгоды в силе Хромы! Какая наглость, какое варварство требуется, чтобы попытаться использовать нечто столь переливчато-непостижимое ради настолько смехотворной цели!"
101020-146 = "Ступай осторожнее, маленькая марионетка."
101020-147 = "..."
101020-148 = "Вы, «художники», провозглашаете возвышенное в собственных работах, а затем насмехаетесь над чужими. Неужели высокомерие — обязательная черта измученных, никому не нужных художников?"
101020-149 = "Глубокий вдох, мадам!"
101020-150 = "Ничего не хочу от тебя слышать, Декалькомания."
101020-151 = "..."
101020-152 = "Твоё нелепое чревовещание с фотографией в рамке — вовсе не та философская метафора противоборства фантазии и реальности, какой ты её считаешь. Я вижу лишь двух клоунов на цирковой арене."
101020-153 = "Ну разумеется—!!"
101020-154 = "Я понимаю тебя, Декалькомания, но умерь свой гнев. Следует проявить понимание к Беатрис — она всё ещё оправляется от ран."
101020-156 = "Ну-ну. Давайте вести себя как взрослые люди. Нам всем было любопытно, к чему приведут амбиции Беатрис, и она вовсе не намеревалась приводить Хрому в Кивотос."
101020-157 = "Как бы то ни было, мы ещё не подтвердили, что Хрома действительно нас обнаружила. Она лишь заглянула через окно во сне. Возможно, этим всё и ограничится — далёким сном."
101020-158 = "Верно. И это окно открылось только из-за Сенсея [USERNAME] из Шале. Я снова и снова повторяю: само существование Сенсея — причина всех этих искажений."
101020-159 = "..."
101020-160 = "..."
101020-161 = "...Мадам."
101020-162 = "Я не отказываюсь от своих слов. Нам следовало устранить Сенсея в тот самый момент, когда он впервые поднял свою уродливую голову."
101020-163 = "Пока мы существуем в рамках концепции Города академий, существование Сенсея [USERNAME] превзойдёт наше прежде, чем мы успеем сделать следующий вдох."
101020-164 = "Так выпали кости в этой истории! Если продолжим сидеть здесь как утки на воде, мы останемся подвластны правилам и законам этого мира."
101020-165 = "Да катись ты со своими правилами прямо в ад!"
101020-166 = "..."
101020-167 = ""
101020-168 = "Я понимаю. Положение отчаянное. Позвольте предложить этой разношёрстной компании спасение. Моё решение одним махом разберётся с Безымянными жрецами, Шале и Ковчегом."
101020-169 = "...Что?!"
101020-170 = "На самом деле Хрома прекрасно знает о существовании Кивотоса."
101020-171 = "...!"
101020-172 = "?!"
101020-173 = "!"
101020-176 = ""
101020-177 = "Откровенно говоря, я намеренно сообщил Хроме, где мы находимся. Она уже идёт."
101020-178 = "..."
101020-194 = "Сенсея больше нельзя защитить."
101020-196 = "Сенсей [USERNAME]."
101020-197 = "С этим..."
101020-198 = "С этим... всё закончится."
101020-199 = "[ns] «Ш... Широко?»"
101020-203 = "...Сенсей!"
101020-205 = "Класс Ароны"
101020-206 = "Сенсей! Вы в порядке?"
101020-207 = "Что случилось? Вам снова приснился тот сон?"
101020-208 = "[ns1] Проверить Арону.\n[ns2] Убедиться, что Арона не ранена."
101020-209 = ""
101020-210 = ""
101020-211 = "С-Сенсей...?!"
101020-212 = "Почему вы меня осматриваете? А?!"
101020-213 = "Что? В меня стреляли?"
101020-214 = "П-Погодите! Со мной всё хорошо, Сенсей! Во мне же нигде нет пулевых отверстий, правда? Смотрите!"
101020-215 = "Со мной всё в порядке, так что успокойтесь!"
101020-216 = "[s] «...Хорошо. Ты в безопасности.»"
101020-217 = ""
101020-218 = "[ns] «Слава богу, ты не ранена.»"
101020-219 = "..."
101020-220 = "Не волнуйтесь. Со мной всё хорошо, Сенсей."
101020-221 = "Это был всего лишь дурной сон. Всё в порядке."
101020-223 = ""
101020-224 = "Тот сон... Мир, лишённый цвета..."
101020-225 = "Девушка, наставившая на вас оружие... Её нимб... был искажён."
101020-226 = "Подробности расплывчаты, но я видела, как вы там умерли."
101020-227 = "[s3] «...»\n[s4] «Это хуже кошмара.»"
101020-230 = "..."
101020-231 = "Я не могу объяснить, почему мы с вами увидели один и тот же вещий сон."
101020-232 = "Возможно, как-то повлияли наши прошлые встречи во снах..."
101020-233 = "[s] «Ты... Ты знаешь, что это значит?»"
101020-234 = "Хотела бы я дать вам более точный ответ. Но с тех пор, как я отказалась от своей способности, мне доступны лишь обрывочные видения."
101020-235 = "С уверенностью могу сказать только одно: всё это должно быть связано с тем видением разрушения Кивотоса, которое я видела раньше."
101020-236 = "[s] «Разрушение Кивотоса...»"
101020-240 = "Шесть огромных башен спускаются с неба и окрашивают мир в красный."
101020-241 = "Они рассеиваются по шести регионам Кивотоса... Пока знакомый нам Кивотос не остаётся лишь смутным воспоминанием."
101020-243 = "[ns] «...»"
101020-244 = "Не волнуйтесь, Сенсей. Что бы ни случилось, я вас защищу!"
101020-245 = "[s5] «Да, я рассчитываю на тебя, Арона.»\n[s6] «Я всегда тебе благодарен.»"
101020-248 = "Хи-хи-хи. Именно! Я заслуживаю хоть немного признания!"
101020-249 = "Итак! Что сегодня по плану, Сенсей?"
101020-250 = "[s] Рассказать о своих планах."
101020-251 = "...Рин из Генерального студенческого совета?"
101020-252 = "Н-Но... Рин в это поверит?"
101020-253 = "[s7] «Уверен, Рин мне поверит.»\n[s8] «Рин прежде всего усердна.»"
101020-256 = "...Ну, если вы так говорите, Сенсей."
101020-257 = "Рин меня немного пугает, но... Я вас поддерживаю, Сенсей!"
101020-262 = "*вздыхает*"
101020-263 = ""
101020-268 = "..."
101020-269 = "Хех..."
101020-270 = ""
101020-274 = "Зал Генерального студенческого совета"
101020-276 = ""
101020-277 = "..."
101020-278 = "Вы сказали... разрушение?"
101020-279 = "[s] «Почему ты говоришь так недоверчиво?!»"
101020-280 = "...Вы увидели это во сне?"
101020-281 = "[s] «Ну, д-да, но...»"
101020-282 = "Вам приснилось разрушение Кивотоса."
101020-283 = "Но вы не знаете ни как, ни когда это произойдёт и у вас нет никаких доказательств в... реальности?"
101020-284 = "Любопытно... Разрушение..."
101020-285 = "[s] «Я-я просто подумал, что тебе важно знать, Ринни...»"
101020-286 = "...Я вежливо попрошу вас больше никогда меня так не называть."
101020-287 = "[s] «П-прости.»"
101020-288 = ""
101020-289 = ""
101020-290 = "..."
101020-291 = "Хорошо, Сенсей."
101020-292 = "Я просмотрю старые данные и записи Генерального студенческого совета — возможно, найду какой-нибудь прецедент."
101020-293 = "[s] «...А?»"
101020-294 = "Стоит также проверить архивы Объединённой академии Хяккияко... Организация довольно загадочная, поэтому база данных студентов далеко не полна. Но, возможно, мне удастся найти одну-две зацепки."
101020-295 = "[s] «То есть... ты мне веришь?»"
101020-296 = "Моя вера здесь ничего не значит. Даже вы сами, похоже, не уверены, было ли это реальностью."
101020-297 = "Но всё же... это должно было настолько вас встревожить, что вы проделали весь этот путь, чтобы сообщить мне. Вы настроены совершенно серьёзно."
101020-298 = "Президент Генерального студенческого совета выбрала вас, чтобы в её отсутствие вы заняли её место, поэтому моя работа — помогать вам."
101020-299 = "Чтобы исполнить волю президента."
101020-300 = "[s] «Ринни! Я знал, что на тебя можно положиться!!»"
