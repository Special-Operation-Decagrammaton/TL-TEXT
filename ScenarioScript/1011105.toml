[translation]
1011105-1 = "Парк развлечений с Нэру"
1011105-3 = ""
1011105-4 = "Йо, Сенсей. Я пришла."
1011105-5 = "В Шале всё по-старому."
1011105-6 = "[s] «Да, но ты выглядишь иначе.»"
1011105-7 = "Хахаха! Пожалуй, вы правы!"
1011105-8 = "Я ведь впервые пришла сюда без куртки, да?"
1011105-9 = "Вообще-то, кажется, это первый раз, когда я ушла так далеко от Миллениума в школьной форме."
1011105-10 = "И по дороге меня никто не узнал! Это всё ещё чертовски весело."
1011105-11 = "[s] «Но я вроде слышал, что сегодня последний день?»"
1011105-12 = "М-м, я ведь не могу пренебрегать C&C."
1011105-13 = "Поэтому, как я и писала в MomoTalk, я пытаюсь придумать, как сделать последний день запоминающимся."
1011105-14 = "Есть хорошие идеи, Сенсей?"
1011105-15 = "[s] «Что-нибудь, чтобы день запомнился...»"
1011105-17 = "[ns] «...Как насчёт этого?»"
1011105-18 = ""
1011105-20 = ""
1011105-21 = ""
1011105-22 = ""
1011105-23 = "Листовка?"
1011105-24 = ""
1011105-26 = ""
1011105-27 = "«Тематический парк Миллениума»? «Приходите с друзьями, семьёй или любимым человеком»?"
1011105-28 = "Ну, в парке развлечений я уже бывала..."
1011105-29 = "Но пойти туда в школьной форме..."
1011105-30 = ""
1011105-32 = ""
1011105-33 = "ВОТ это звучит весело."
1011105-34 = "[s] «Ладно, тогда выдвигаемся!»"
1011105-35 = "Вот это настрой!"
1011105-36 = "Вот за это вы мне и нравитесь, Сенсей!"
1011105-38 = "А, мы пришли в идеальное время. Народу не слишком много."
1011105-39 = "Карусель новая и блестящая, а американские горки полностью починили!"
1011105-40 = "[s] «Кстати, ты говорила, что уже бывала здесь.»"
1011105-41 = "Ага, в прошлый раз я была на задании."
1011105-42 = "Я преследовала преступника, он забежал в парк, и мне пришлось немного пошуметь, чтобы его задержать."
1011105-43 = ""
1011105-46 = "[ns] «(Наверное, поэтому американские горки и пришлось чинить.)»"
1011105-47 = "В общем, Сенсей, на чём хотите прокатиться первым?"
1011105-48 = "Очевидно же на этом, да? На американских горках?!"
1011105-49 = "Отлично, отлично! Вот это дух!"
1011105-50 = ""
1011105-52 = ""
1011105-56 = "Мы с Нэру три раза подряд прокатились на американских горках."
1011105-58 = "Ух, вот это было круто! Правда, Сенсей?!"
1011105-59 = "[ns] «У меня до сих пор голова кружится...»"
1011105-60 = "Хаха! Ну, тогда четвёртого раза, похоже, не будет."
1011105-61 = "Так, а дальше давайте..."
1011105-62 = "[s] «Карусель...?»"
1011105-63 = "Ага! Я всегда хотела прокатиться на лошади. Ну, эти ненастоящие, но ощущение, наверное, похожее, да?"
1011105-64 = "Конечно, если у вас всё ещё кружится голова, можете немного передохнуть."
1011105-65 = "[s] «Пожалуй, так и сделаю.»"
1011105-66 = "Хорошо, тогда до скорого!"
1011105-67 = ""
1011105-69 = ""
1011105-72 = "Ха! Было весело!"
1011105-73 = "Вы меня видели, Сенсей? Я сидела на самой большой лошади!"
1011105-74 = "А? Вы ненадолго отходили? В туалет или типа того?"
1011105-75 = "Нет? Тогда... куда?"
1011105-76 = "[s] «Хотел кое-что тебе купить.»"
1011105-77 = "Типа подарка?"
1011105-78 = ""
1011105-80 = ""
1011105-81 = ""
1011105-82 = "О-о, мороженое и... это бантик для волос?"
1011105-83 = "Я-я, конечно, спасибо... Обычно я бантики не ношу, но..."
1011105-84 = "М-м..."
1011105-85 = ""
1011105-87 = ""
1011105-88 = "Ну, ОБЫЧНО я их не ношу."
1011105-89 = "Но сегодня я не президент C&C и не позывной Double O..."
1011105-90 = "Хаха! А почему бы и нет? Спасибо!"
1011105-93 = "― [log=네루 교복]О! Посмотрите, Сенсей! Тут столько классных вещей![/log][wa:1050]"
1011105-96 = "― [log=네루 교복]А? Что это за взгляд?[/log][wa:220]"
1011105-99 = "[ns1] «Ничего, просто ты выглядишь совсем расслабленной.»\n[ns2] «Сегодня ты будто совсем другая Нэру.»"
1011105-102 = "― [log=네루 교복]А. Понятно. Ну конечно.[/log][wa:2630]"
1011105-105 = "― [log=네루 교복]Сейчас я не C&C и не чья-то старшая.[/log][wa:2110]"
1011105-108 = "― [log=네루 교복]И здесь нет никого из знакомых.[/log][wa:590]"
1011105-111 = "― [log=네루 교복]Мне не за кем присматривать, так что хоть немного расслабиться можно. Да?[/log][wa:10]"
1011105-114 = "― [log=네루 교복]Если только Сенсей случайно...[/log][wa:1360]"
1011105-116 = "― [log=네루 교복]Вам больше нравится обычная я?[/log]"
1011105-119 = "[ns3] «На сегодня мне нравится такая ты.»\n[ns4] «Сегодня роль опекуна беру на себя я. А ты веселись сколько хочешь.»"
1011105-122 = "― [log=네루 교복]Хаха! Ага, я знала, что вы так скажете![/log][wa:1200]"
1011105-125 = "― [log=네루 교복]Хотя времени у нас не так уж много...[/log][wa:380]"
1011105-128 = "― [log=네루 교복]Пойдёмте! Теперь вон туда![/log][wa:750]"
1011105-131 = "Я наслаждался парком развлечений вместе с весёлой и беззаботной Нэру."
1011105-133 = "Фух! Не могу поверить, что уже время закрываться."
1011105-134 = "Сегодня было так весело."
1011105-135 = "[s] «Я рад.»"
1011105-137 = "[ns] «Ну как, получился запоминающийся последний выходной?»"
1011105-138 = "А-а! Ага, я очень довольна!"
1011105-139 = "И прежде чем я..."
1011105-140 = ""
1011105-142 = ""
1011105-143 = "...вернусь к обычной жизни..."
1011105-144 = "Сенсей [USERNAME], как вам?"
1011105-145 = "[s] «Хм? Что именно?»"
1011105-146 = "Ну, последние несколько дней я ходила в школьной форме..."
1011105-147 = "...и вы единственный из знакомых, кто видел меня такой..."
1011105-148 = "Для меня это было совсем неплохо, но что в-вы..."
1011105-149 = ""
1011105-151 = ""
1011105-152 = "А-а-а, как же трудно это сказать!"
1011105-153 = ""
1011105-156 = "[ns] «Эй, ты в порядке?!»"
1011105-157 = "Я скажу это только один раз, так что слушайте внимательно!"
1011105-158 = "Ходить на улицу в школьной форме оказалось веселее, чем я ожидала!"
1011105-159 = "И-и когда-нибудь я снова так сделаю!"
1011105-160 = "Так что... поймите намёк и проведите со мной время, когда это случится!"
1011105-161 = "Поняли?!"
1011105-162 = "[s] «П-понял.»"
1011105-163 = "Кхм, ну и хорошо!"
1011105-164 = ""
1011105-166 = ""
1011105-167 = "Теперь пойдём обратно."
1011105-168 = "Выходной закончился, так что завтра возвращаемся к привычной жизни, да?"
