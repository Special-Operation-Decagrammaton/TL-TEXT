[translation]
10025060-1 = "Эпизод 6;Когда туман рассеивается"
10025060-2 = "На следующее утро..."
10025060-3 = ""
10025060-10 = ""
10025060-11 = ""
10025060-12 = "...Ещё один день впустую."
10025060-13 = "Ладно, с якорем хватит. Выбирай трос и привяжи защиту от крыс."
10025060-14 = "Надо убрать этот бардак, пока дневная жара не началась."
10025060-15 = "Эм, сэр...? Сушильню уже кто-то убрал."
10025060-16 = "А? Нас всё-таки обокрали?"
10025060-17 = "Ничего не пропало. Похоже, кто-то навёл порядок, пока мы были в море."
10025060-18 = "Даже весь ущерб после вчерашней заварушки починили..."
10025060-19 = ""
10025060-21 = ""
10025060-23 = "Кто бы стал этим заниматься...?"
10025060-25 = ""
10025060-27 = ""
10025060-28 = ""
10025060-29 = "Этого должно хватить."
10025060-30 = "Моэ, проверь распределительный щит. Сейчас всё должно загореться."
10025060-31 = "Окей-доки!"
10025060-33 = ""
10025060-35 = ""
10025060-36 = ""
10025060-37 = ""
10025060-38 = ""
10025060-41 = ""
10025060-43 = ""
10025060-44 = "Эй, ты! Что ты там делаешь?"
10025060-45 = "По этим проводам идут тысячи вольт!"
10025060-46 = "Спускайся, пока не покалечилась!"
10025060-47 = "Не волнуйтесь. Перед работой мы отключили питание."
10025060-48 = "Эм... Работой?"
10025060-49 = "Я здесь почти закончила, сейчас спущусь!"
10025060-51 = ""
10025060-58 = ""
10025060-59 = "Моэ, можешь снова поднять автомат."
10025060-60 = ""
10025060-62 = ""
10025060-63 = ""
10025060-65 = "И... готово. В конце концов, это было обычное короткое замыкание."
10025060-66 = "Провода, открытые морскому ветру, сильно износились. Небольшого скачка напряжения хватило, чтобы выбить автомат."
10025060-67 = "Мы заменили повреждённые провода и очистили ржавчину с распределительного щита."
10025060-68 = "Позже лучше вызвать специалиста и проверить нашу работу, но хотя бы пока рыбаки больше не будут спотыкаться в темноте."
10025060-70 = "Вы починили это... вдвоём?"
10025060-72 = "Пустяки. Ремонт щита не сильно отличается от прокладки полевых линий питания или связи."
10025060-73 = "Наверняка любой ученик Кивотоса умеет проложить временную проводку..."
10025060-74 = "Пф. Ты единственный студент, которого я знаю, способная на такое даже в SRT—"
10025060-76 = "S... Что ты сказала?"
10025060-78 = "Н-Ничего!"
10025060-79 = "Кстати! Я заметила, что на вашем причале нет ограждений... Разве это не опасно?"
10025060-81 = "Иногда кто-нибудь действительно падает в воду. Мы однажды пытались поставить защитные перила..."
10025060-82 = "Но рыбаки жаловались, что они мешают. Лодки не пришвартовать и улов на берег не вытащить."
10025060-83 = "В итоге идея не прижилась..."
10025060-85 = "Хм... Всё равно хотелось бы видеть здесь хоть какую-то меру безопасности."
10025060-86 = "Моэ, у тебя осталась та светящаяся краска?"
10025060-87 = "Ага, немного осталось после вчерашней операции... А что?"
10025060-88 = "Если покрасить край причала, ночью его будет легче заметить. Думаю, падать станут реже."
10025060-89 = "Пожалуйста, проведи линию отсюда по всему краю до того швартовочного столба."
10025060-90 = "Цк... Военная краска недешёвая, между прочим..."
10025060-91 = "О, теперь тебя волнует стоимость? Сколько ты потратила на боеприпасы за этот месяц?"
10025060-92 = "Мы сейчас вернёмся с краской."
10025060-94 = "О! Я ещё не заземлила уличные фонари, так что проследите, чтобы никто не подходил слишком близко к столбам!"
10025060-96 = "...Да."
10025060-98 = ""
10025060-101 = ""
10025060-102 = ""
10025060-104 = ""
10025060-105 = "...Ах."
10025060-106 = "Здравствуйте, сэр. Сегодня хорошая погода."
10025060-107 = "Вижу, вы уже совсем освоились, всё тут меняете налево и направо."
10025060-108 = "Старые опоры заменили, сломанные фонари..."
10025060-109 = "Ваш ремонт слишком новый. Не вписывается в деревню."
10025060-110 = "П-Простите. Мы просто хотели сделать город немного безопаснее."
10025060-111 = "Надеюсь, мы не перешли границу..."
10025060-112 = "Да чёрт с ним. Остальным жителям почему-то даже нравится то, что вы сделали."
10025060-113 = "Единственные, кому не нравится то, что вы сделали, — старые упрямцы, которые боятся перемен."
10025060-114 = ""
10025060-116 = ""
10025060-117 = "...Я должен извиниться за вчерашнее."
10025060-118 = "Я был слишком напуган, чтобы нормально соображать, но это не оправдание. Я вёл себя очень грубо."
10025060-119 = "Надо было успокоиться и внимательно выслушать вас и остальных..."
10025060-120 = "Ничего не поделаешь. Иногда все теряют контроль, особенно когда страшно."
10025060-121 = "И я бы соврал, если бы сказал, что мы не дали вам достаточно причин испугаться."
10025060-122 = "Не люблю это признавать, но это место намеренно сделано не слишком гостеприимным."
10025060-123 = "Ты ведь не о том, что..."
10025060-124 = "Нет, это не про Глубинных и ничего такого."
10025060-125 = "Некоторым из нас нравится тишина и покой нашей маленькой деревни, а жуткие страшилки отлично отпугивают туристов."
10025060-126 = "Деревне, которая не приветствует чужаков, не приходится меняться. Не приходится принимать новые идеи извне."
10025060-127 = "Но этот страх пожирал и нас изнутри."
10025060-128 = "...Я всё равно считаю деревню красивой."
10025060-129 = "Ты просто так говоришь."
10025060-130 = "А над чем ты там работаешь?"
10025060-131 = "О, это? Узел «обезьянья лапа»."
10025060-132 = "Этот бросательный конец выглядит уже старым, и я боялась, что груз может соскользнуть..."
10025060-133 = "Ты хорошо умеешь вязать узлы. Где научилась?"
10025060-134 = "А, такие узлы были частью моей подготовки для спец—"
10025060-136 = "Спец...?"
10025060-137 = "Эм... Специального кружка рукоделия."
10025060-139 = "В кружке рукоделия учат вязать «обезьянью лапу»?"
10025060-140 = ""
10025060-142 = ""
10025060-143 = "Ну... Знаете... Мир полон загадок."
10025060-144 = "Ха. Как эта деревня, да?"
10025060-145 = ""
10025060-147 = ""
10025060-148 = "Надеюсь, вскоре вам снова начнёт везти с креветками."
10025060-149 = "Я тоже."
10025060-151 = ""
10025060-153 = ""
10025060-156 = ""
10025060-157 = "Маленькая безынерционная катушка, семифутовое удилище для приманок..."
10025060-158 = "И лески 0,8 мм должно хватить..."
10025060-159 = "Наконец, я сделала вот эту металлическую приманку из гильзы..."
10025060-160 = ""
10025060-162 = ""
10025060-163 = ""
10025060-164 = ""
10025060-165 = ""
10025060-167 = "Эм..."
10025060-169 = "Ч-Что?! Откуда ты взялась?"
10025060-170 = "Я всё это время была здесь..."
10025060-171 = "П-Простите. Я привыкла, что люди меня не замечают, но обратное случается редко..."
10025060-172 = "Не переживай. Похоже, ты глубоко задумалась. Прости, что помешал."
10025060-173 = "Н-Нет... Всё нормально..."
10025060-175 = "(Это тот самый рыбак, который вчера читал странное заклинание...)"
10025060-176 = "(Похоже, он готов говорить. Как участница SRT, я обязана выжать из него всю возможную информацию!)"
10025060-177 = "(Н-Но... мне всё ещё страшно после всего, что случилось вчера...)"
10025060-179 = "Так... На что рыбачите?"
10025060-180 = "Н-На скумбрию..."
10025060-181 = "Остальной отряд занят уборкой деревни, поэтому я решила поймать рыбу на ужин."
10025060-182 = "Хотелось бы, как обычно, подобрать выброшенные бэнто, но в городе нет магазина..."
10025060-183 = "Отряд? Выброшенные бэнто...?"
10025060-184 = "Я-я имею в виду... Эм..."
10025060-185 = ""
10025060-187 = ""
10025060-188 = ""
10025060-189 = "О... Поплавок шевельнулся."
10025060-190 = "Скумбрия чувствительна к шуму, поэтому говорите потише."
10025060-191 = "Х-Хорошо..."
10025060-192 = "Не дай крючку сорваться... Медленно подтягивай леску..."
10025060-193 = ""
10025060-195 = ""
10025060-196 = ""
10025060-198 = "Поняла!"
10025060-199 = "Ого, какая большая! Не меньше 30 сантиметров!"
10025060-201 = "Н-Нет, наверное, всего... 20 сантиметров..."
10025060-202 = "Если поймаю ещё три такого размера, на ужин должно хватить..."
10025060-203 = "Ещё три? Такие же большие?"
10025060-204 = "Да. Обычно за раз можно поймать штук шесть скумбрий, плюс-минус..."
10025060-205 = "Ч-Что-то не так...?"
10025060-206 = ""
10025060-208 = ""
10025060-209 = "Прости. Я знаю, что пристаю к тебе со вчерашнего дня, но..."
10025060-210 = "Пожалуйста, научи меня рыбачить!"
10025060-212 = "Ч-что?!"
