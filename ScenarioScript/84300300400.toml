[translation]
84300300400-5 = ""
84300300400-6 = "Это вам о чём-нибудь говорит?"
84300300400-7 = "...А, прошу прощения. Я приводила мысли в порядок."
84300300400-8 = "Простите, если помешала."
84300300400-9 = "Нет, всё в порядке. Наоборот, раз уж мы теперь работаем вместе, стоит узнать, как каждая из нас обращается с информацией."
84300300400-10 = "Пока мы сотрудничаем, хочу, чтобы ты периодически связывалась со мной. Будем вместе сводить информацию и упорядочивать мысли."
84300300400-11 = "...Хотя обычно мыслей у меня, вероятно, будет больше, чем у тебя."
84300300400-12 = "Хорошо. Буду."
