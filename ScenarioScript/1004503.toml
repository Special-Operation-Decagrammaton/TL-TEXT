[translation]
1004503-1 = "Свежайшие продукты"
1004503-2 = "По просьбе Хошино я отправился на пляж."
1004503-7 = "Эй, Сенсей! Я здесь!"
1004503-8 = "[s] «Хошино?»"
1004503-12 = ""
1004503-13 = "Вы пришли один, как я и просила. Спасибо."
1004503-14 = "Честно говоря, не думала, что вы правда придёте. Но Серике и Аяне не говорите, хорошо?"
1004503-15 = "Почему?"
1004503-16 = "Ну, ничего особенного, просто..."
1004503-17 = "Я устала и отдыхала в уголке, а они подошли ко мне и сказали..."
1004503-18 = ""
1004503-20 = ""
1004503-21 = "что до заката я должна добыть для нас морепродукты."
1004503-22 = "А? Ага! Вы моё подкрепление."
1004503-23 = "Хи-хи-хи."
1004503-24 = "Я попросила держать это в секрете, потому что они бы не захотели, чтобы вы мне помогали."
1004503-25 = "Я уже слышу их: «Пожалуйста, хоть раз сделай всё сама!»"
1004503-26 = ""
1004503-28 = ""
1004503-29 = ""
1004503-31 = "В любом случае, раз уж вы проделали весь путь сюда, вы ведь не бросите меня просто так, правда?"
1004503-32 = "Вы же учитель. Не бросите студента, которому нужна помощь, да?"
1004503-33 = "[s1] «Я понимаю, к чему ты клонишь.»\n[s2] «Ну, значит, придётся выполнять свою работу.»"
1004503-34 = "Хех. Вы лучший. Спасибо, Сенсей."
1004503-35 = "Хех. Вы лучший. Спасибо, Сенсей."
1004503-36 = "Раз вы здесь..."
1004503-37 = "Я постараюсь не отлынивать всё время."
1004503-40 = "Мы с Хошино некоторое время собирали еду на пляже."
1004503-46 = "Ого... Что это такое...?"
1004503-47 = "Наверное, морепродуктов здесь так много потому, что никто не живёт. Кажется, будто их больше, чем воды!"
1004503-48 = ""
1004503-50 = ""
1004503-51 = ""
1004503-52 = "Сенсей, видите это? Я никогда не видела такого огромного морского ушка! Не знала, что они бывают такими большими!"
1004503-53 = "Смотрите, Сенсей, корзина уже полная, а мы даже не успели обойти здесь всё один раз."
1004503-54 = "Потрясающе... Океан удивляет меня каждый раз."
1004503-55 = "[s3] «Ты сегодня бодрее обычного.»\n[s4] «Ты почему-то выглядишь взволнованной, Хошино.»"
1004503-56 = ""
1004503-57 = ""
1004503-59 = ""
1004503-60 = ""
1004503-61 = "...Хм."
1004503-62 = "...Думаешь?"
1004503-63 = "Хех... Ну, может, и правда."
1004503-64 = "Я могла бы просто сказать: «Потому что я на летних каникулах.»"
1004503-65 = "Почему бы мне не признаться, что мне это нравится?"
1004503-66 = "Ну вы же понимаете. Если будет видно, что мне нравится усердно работать, они начнут ждать от меня этого постоянно."
1004503-67 = "Если они решат, что это разовая акция, потом приставать не будут."
1004503-68 = "С другой стороны..."
1004503-69 = "Вам иногда можно видеть и эту мою сторону."
1004503-70 = ""
1004503-72 = ""
1004503-73 = ""
1004503-75 = "Вот сейчас, когда мы вместе собираем морепродукты."
1004503-76 = "Это довольно весело и приятно."
1004503-77 = "Но я говорю это только потому, что сегодня особенный летний день, вокруг никого нет и мы на пляже, ясно?"
1004503-78 = "И говорю это только вам. Пожалуйста, никому не рассказывайте."
1004503-79 = "Хотя я и не думаю, что вы стали бы что-то говорить."
1004503-80 = "Правда?"
1004503-81 = "[s5] «Конечно, нет.»\n[s6] «Мы сообщники.»"
