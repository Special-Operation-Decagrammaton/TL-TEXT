[translation]
52280-1 = "Эпизод 28;Вместе ждать цветения"
52280-2 = "Стационарное отделение больницы"
52280-3 = ""
52280-5 = "Да, входите."
52280-6 = ""
52280-9 = "О, [USERNAME]-Сенсей?"
52280-10 = "Я не знала, что вы придёте..."
52280-11 = "[s1] «Я слышал, что ты всё ещё в больнице, поэтому пришёл навестить тебя.» \n[s2] «Как ты себя чувствуешь?»"
52280-14 = "Ньяхаха... Простите, что заставила вас зря волноваться."
52280-15 = "Можете сами меня осмотреть. Я уже в прекрасной форме."
52280-16 = "Но... Кахо настояла, что после «Ста историй о призраках» могут проявиться непредвиденные последствия, поэтому..."
52280-17 = "Меня насильно отправили сюда на обследование и лёгкое лечение. Так что вам не о чем беспокоиться."
52280-18 = "[s] «Если ты правда так говоришь, я рад.»"
52280-19 = "Между нами, Сенсей, немного неловко быть единственной, кто всё ещё лежит в больнице."
52280-20 = "Хяккарёран и остальные клубы сражались на поле боя изо всех сил и уже вернулись к обычной жизни. А я всё ещё валяюсь в постели."
52280-21 = "Зато теперь у меня есть неопровержимое оправдание, чтобы бездельничать. Фуфу..."
52280-22 = "[s] «Тогда что это за гора бумаг рядом с тобой?»"
52280-23 = ""
52280-25 = ""
52280-26 = "...Ах. Ну, понимаете, Сенсей..."
52280-27 = "Конечно, я бы предпочла лениво проводить дни, но некоторые слухи и обстоятельства требуют немедленной обработки. Иначе они разрастутся и выйдут из-под контроля."
52280-28 = "А после столь громкого происшествия ненавистники и любители посплетничать всегда выползают из всех щелей."
52280-29 = "Поэтому некоторые из этих первоочередных документов требовали НЕМЕДЛЕННОГО внимания."
52280-30 = "И это совершенно точно, абсолютно не потому, что мне втайне нравится эта работа, ясно?"
52280-31 = "[s3] «Как скажешь, Ния.» \n[s4] «Рад видеть, что ты снова в норме.»"
52280-34 = "Если кратко перечислить самые важные пункты, которые мне пока попались..."
52280-35 = "Фестиваль Вараку прошёл успешно!"
52280-36 = ""
52280-39 = "[ns] «Это... САМОЕ важное?»"
52280-40 = "А? Ну конечно! Часто ли выпадает возможность вживую увидеть очаровательное выступление Чисэ?"
52280-41 = "И что ещё важнее, песня Чисэ, похоже, немного завирусилась в соцсетях."
52280-42 = "Кахо всерьёз размышляет, не настало ли время для дебюта Чисэ в качестве айдола."
52280-43 = "С другой стороны, она переживает, что если Чисэ станет слишком популярной, у них останется куда меньше времени друг на друга. Вот дилемма."
52280-44 = "[s] «Кстати, у меня был вопрос насчёт фестиваля.»"
52280-45 = "Спрашивайте."
52280-46 = "[s5] «Фестиваль Вараку ослабил силу Хитоцумэ, верно?» \n[s6] «Фестивали Хяккияко были ритуалами для борьбы со Ста историями о призраках?»"
52280-49 = ""
52280-51 = ""
52280-52 = "Ай-яй, вовсе нет."
52280-53 = "Я довольно хорошо умею пускать пыль в глаза, когда нужно, и тогда просто пыталась выбить Азами из колеи. Фестиваль — это просто фестиваль."
52280-54 = "Говорят, в далёком прошлом фестивали действительно начинались как ритуалы общения с небесами... Но сейчас никто уже не помнит и не практикует этих обрядов."
52280-55 = "...Но представьте всеобщее отчаяние, если бы мы отменили столь долгожданный фестиваль?"
52280-56 = "Грустного ребёнка утешаешь сладостями, а истерику встречаешь дисциплиной."
52280-57 = "Это никак не связано ни с инь, ни с ян, ни с чем подобным. Просто одно из правил жизни."
52280-58 = "[s7] «Так ты всё это время блефовала?» \n[s8] «Хорошо, что Красота природы тебе поверила.»"
52280-61 = ""
52280-63 = ""
52280-64 = "Кстати, Хабу Азами утверждала, что она из спутниковой школы Эбису."
52280-65 = "Мы всегда общались лишь письмами, поэтому я отправила туда людей разобраться в ситуации."
52280-66 = "По их словам, Комитет самоуправления Эбису распустили много десятилетий назад."
52280-67 = "Более того, никто из местных даже не помнит Азами, и не нашлось ни одного человека, который действительно получал бы официальные уведомления, которые я отправляла..."
52280-68 = "[s] «Иными словами...»"
52280-69 = "...Да. Именно."
52280-70 = ""
52280-72 = ""
52280-73 = "Нам придётся взять на себя административные обязанности района Эбису."
52280-74 = ""
52280-77 = "[ns] «ТАК ВОТ что тебя беспокоило?!»"
52280-78 = "Конечно! Целая система, которая всё это время работала самостоятельно, теперь осталась без управляющего."
52280-79 = "Всё это время Красота природы прикрывалась Комитетом самоуправления, чтобы творить свои злодеяния."
52280-80 = "Да, непростительно, что они обманывали студентов ради собственной выгоды, но с административной работой района они справлялись довольно неплохо..."
52280-81 = "А теперь всё это свалится на меня... Я прямо вижу, как моя беззаботная жизнь... ускользает сквозь пальцы... Бедная я..."
52280-82 = "[s] «И никаких следов от них не осталось?»"
52280-83 = "Да. Как и в прошлый раз, едва происшествие закончилось, все следы Красоты природы исчезли словно дым."
52280-84 = "Президент Кокурико, Азами и даже Сюро, которая была вместе с нами, — все пропали."
52280-85 = "Вы бы видели лицо Сюро, когда она осознала, что натворила... Эх, если бы только я успела сделать фотографию."
52280-86 = "[s] «Какая же ты злая...»"
52280-87 = "Ньяхаха... Её аккаунт, где она публикует романы, всё ещё существует, так что, может быть, однажды она вдохновится начать новую серию."
52280-88 = "Я ведь и правда не врала, когда говорила, что прочитала все её истории. Это приятное времяпрепровождение, поэтому буду ждать новых работ."
52280-89 = "...Хотя сюжет, конечно, был полнейшим бардаком."
52280-90 = "[s] «Но ей ты говорила совсем другое...»"
52280-91 = "Ничего не поделать. Писатели — такие ранимые души, что даже самый пустяковый комментарий способен разрушить их волю."
52280-92 = "Если немного её приободрить и утешить, может, в следующей истории будет чуточку больше надежды."
52280-93 = "[s] «Да. Пусть следующая история будет мирной.»"
52280-94 = ""
52280-97 = "[ns] «А что насчёт Аямэ...?»"
52280-98 = "Ах, вы о президенте Аямэ."
52280-99 = ""
52280-101 = ""
52280-102 = "Не лучше ли спросить об этом её друзей, а не меня?"
52280-104 = "Фестивальная улица Хяккияко"
52280-106 = "Улицы Хяккияко, как всегда, кипели жизнью."
52280-107 = "Кто-то бегал туда-сюда, занимаясь подготовкой, а кто-то просто наслаждался праздником."
52280-108 = "Будто здесь праздновали бесконечный фестиваль..."
52280-109 = ""
52280-113 = ""
52280-114 = ""
52280-115 = "О, господин!"
52280-116 = ""
52280-118 = ""
52280-119 = "Сенсей! Вы в порядке!"
52280-120 = "Мы так и не получили от вас вестей... после окончания фестиваля... Я очень переживала!"
52280-121 = "[s9] «Прости, с тех пор навалилось много дел...» \n[s10] «Надо было раньше встретиться со всеми вами.»"
52280-124 = "Не извиняйтесь, господин! Изуна просто рада, что вы в безопасности!"
52280-125 = "Вы пытались найти комнату клуба Инь-Ян, Сенсей? Она в другой стороне..."
52280-126 = "[s11] «Вообще-то я собирался навестить Хяккарёран.» \n[s12] «Хотел узнать, как там Аямэ и Нагуса.»"
52280-129 = "Аямэ... президент Хяккарёран?"
52280-130 = "Я слышала... что теперь она официально вернулась."
52280-131 = ""
52280-133 = ""
52280-134 = ""
52280-135 = "Клуб Инь-Ян и Хяккарёран выступили с официальным заявлением, что Аямэ, которую мы все видели, на самом деле была подделкой, созданной Красотой природы."
52280-136 = "То есть мне и самой было трудно поверить, что Аямэ могла сделать нечто подобное, но..."
52280-137 = "Та Аямэ... с которой мы столкнулись... Она казалась такой настоящей, правда?"
52280-138 = "Вы... что-нибудь знаете, Сенсей?"
52280-139 = "[s] «Ну...»"
52280-141 = "Н-Не может быть! Это точно была не она!"
52280-142 = "...Изуна?"
52280-143 = "Когда-то плохие взрослые тоже обманули Изуну... и она едва не испортила фестиваль. Но тогда у Изуны не было тех друзей, что есть сейчас, друзей, которым можно было бы открыть сердце — рассказать о ниндзя и обо всём остальном."
52280-144 = "Если бы у Изуны тогда были друзья, они бы не позволили ей свернуть на плохой путь!"
52280-145 = "Изуна слышала, что Аямэ — очень хорошая подруга Нагусы."
52280-146 = "Значит, Аямэ ни за что не сделала бы ничего подобного! Не когда Нагуса рядом!"
52280-147 = "Я-я согласна! Я слышала, что президент Аямэ очень-очень добрая... и всегда отстаивала справедливость Хяккарёран!"
52280-148 = "Наверняка это был... всего лишь слух!"
52280-150 = "Понятно... Выходит, слухи — просто слухи!"
52280-151 = "[s] «Именно. Опасно слепо верить всему, что слышишь.»"
52280-152 = ""
52280-155 = "[ns13] «Я слышал, что с Клубом исследования ниндзюцу тоже что-то случилось...» \n[ns14] «Теперь у вас всё в порядке?»"
52280-158 = "А, точно! Сенсей, послушайте!"
52280-159 = "Когда чудовища напали на сцену во время фестиваля Вараку, мы все почувствовали, как внутри нас пробудилась невероятная сила!"
52280-160 = "Она была настолько мощной, будто мы открыли какое-то запретное ниндзюцу!"
52280-161 = "Д-Да! Всё именно так, как она описала! Ниндзюцу... которое увеличивало нашу скорость!"
52280-162 = "Мне не довелось попробовать, но, наверное, я смогла бы пробежать по мокрой бумажной сёдзи."
52280-163 = "Пробежать по мокрой бумажной сёдзи..."
52280-164 = "Это же кульминационная сцена из «Одиноких 77 странствующих ниндзя», да? Изуна всегда мечтала попробовать такое по-настоящему!"
52280-165 = ""
52280-167 = ""
52280-168 = "[ns] «Мичиру, тебе жаль, что ты лишилась этой силы?»"
52280-169 = "А? Да нет, не особо."
52280-170 = "Хм... Ну, если подумать... для канала «Мичирутти» я бы наверняка смогла снять что-нибудь очень крутое."
52280-171 = "С другой стороны, такая странная сила не слишком-то поможет распространять путь ниндзя."
52280-172 = "Ведь истинная ценность ниндзя не в могущественных техниках, а в наших узах."
52280-173 = "Я лучше останусь обычной ниндзя в окружении товарищей, чем буду одинокой обладательницей какой-нибудь легендарной силы."
52280-174 = ""
52280-176 = ""
52280-177 = "Именно так и говорили в «Одиноких 77 странствующих ниндзя»!"
52280-178 = "Изуна согласна!"
52280-179 = "Ага! Я тоже!"
52280-180 = ""
52280-181 = "[ns] «Я думаю так же.»"
52280-183 = "[ns15] «Тогда в следующий раз давайте все вместе посмотрим этот фильм в Шале.» \n[ns16] «В кинозале у нас отличная система объёмного звука.»"
52280-186 = "О, о! Давайте прямо сейчас!"
52280-187 = "Н-Но нам ведь нужно идти помогать с уборкой после фестиваля Вараку, помнишь?"
52280-188 = "Ах! Я забыла! Тогда в следующий раз!"
52280-189 = "Да! В следующий раз мы все посмотрим его вместе, господин!"
52280-190 = "П-Пожалуйста, берегите себя... Сенсей!"
52280-194 = "Тренировочная площадка Хяккарёран"
52280-195 = ""
52280-196 = ""
52280-198 = "Стой, Рэнгэ. Разве у тебя в руках не гортензия?"
52280-199 = "И ты собираешься посадить её рядом с саженцами камелии? Прошу тебя, подумай об эстетике: летний цветок среди зимних растений."
52280-200 = "Я знаю, что делаю! Если вот так смешать растения разных сезонов, цветами можно будет любоваться круглый год!"
52280-201 = "...Можешь перестать меня пилить и спуститься сюда помочь!"
52280-202 = "Не могу. Я должна руководить этой операцией с данной точки обзора. Из-за деревьев леса не видно."
52280-203 = "По-моему, ты просто не хочешь пачкать руки!"
52280-204 = ""
52280-206 = ""
52280-207 = "...Дело не в этом."
52280-208 = "Тогда поменяйся со мной! Это нечестно!"
52280-209 = ""
52280-211 = ""
52280-212 = ""
52280-213 = ""
52280-214 = ""
52280-215 = "Ой, Сенсей!"
52280-216 = "...Добро пожаловать, Сенсей."
52280-217 = ""
52280-218 = "[ns17] «Привет всем!» \n[ns18] «Я не вовремя?»"
52280-221 = "Вовсе нет. Сейчас мы не занимаемся официальными делами Хяккарёран."
52280-222 = "Смотрите! Сегодня я сажаю цветы вместе со старшими!"
52280-223 = "[s] «Сажаете цветы...?»"
52280-224 = "Да. По моим сведениям, теперь, когда фестиваль Вараку закончился, скоро пройдёт Фестиваль цветов. Там будут показывать сады, выращенные по всему Хяккияко."
52280-225 = "Поэтому мы забрали оставшиеся семена цветов у организаторов фестиваля..."
52280-226 = "И решили посадить их перед тренировочной площадкой, чтобы потом ухаживать за ними всем вместе!"
52280-227 = "Если мы каждый сезон будем видеть, как красиво распускаются цветы, наверняка нам ещё сильнее захочется каждый день приходить на тренировочную площадку!"
52280-228 = "Хотя вообще-то люди должны быть поглощены тренировками, а не любованием пейзажами..."
52280-229 = ""
52280-231 = ""
52280-232 = "Юкари, можешь передать мне тот мешок?"
52280-233 = "Он довольно тяжёлый. Будь осторожна и не поранься."
52280-234 = "Есть, госпожа!"
52280-235 = ""
52280-236 = ""
52280-238 = "[ns] «Как твоя рука?»"
52280-239 = "Прекрасно. Всё вернулось на свои места. И моя правая рука... и Аямэ."
52280-240 = "То, что мы оставили на Снежном поле в тот день, вернулось туда, где ему и место."
52280-241 = "По крайней мере, в какой-то степени... С того дня Аямэ так и не проснулась."
52280-242 = "Хотя серьёзных физических проблем, похоже, нет, она лежит неподвижно, словно погружённая в глубокий сон."
52280-243 = "[s] «Может, это последствие того, что она была заперта в мире духов?»"
52280-244 = "Мы не можем знать наверняка. По словам врача, её нынешнее состояние имеет скорее психологическую природу."
52280-245 = "Её тело просто отказывается просыпаться."
52280-246 = "А я-то уже предвкушала, как отругаю её за то, что заставила нас так переживать! Но как я это сделаю, если она всё ещё спит..."
52280-247 = "Я даже подумывала хорошенько её встряхнуть, но Нагуса не позволила."
52280-248 = "Оставаться во сне и размышлять — выбор Аямэ. И когда проснуться — тоже её выбор."
52280-249 = "Мы не знаем, по какой стране снов сейчас странствует Аямэ."
52280-250 = "...Нам остаётся лишь ждать рядом с ней, пока она сама оттуда не выйдет."
52280-251 = ""
52280-253 = ""
52280-254 = ""
52280-255 = "Кикё, Кикё! Что это за растение?"
52280-256 = "Это...? Саженец сакуры."
52280-257 = "Он вырастет в дерево, поэтому оставь вокруг него достаточно места и не сажай слишком близко к кустам."
52280-258 = "Ой! Вы хотите сказать, у нас будет собственная сакура? Как здорово!"
52280-259 = "Ну... Может пройти немало времени, прежде чем она вырастет настолько, чтобы зацвести."
52280-260 = "По крайней мере, пока мы ещё учимся в академии, вряд ли успеет."
52280-261 = ""
52280-263 = ""
52280-264 = "...Ничего страшного."
52280-265 = "Мы этого, может, и не увидим, но когда-нибудь далеко в будущем кто-то будет смотреть, как она цветёт."
52280-268 = "Так же, как те, кто был до нас..."
52280-277 = "Однажды это место заполнится сотней цветов, распустившихся одновременно."
52280-278 = "До тех пор я буду ждать тебя."
52280-283 = "Я буду ждать, когда ты проснёшься, моя подруга."
