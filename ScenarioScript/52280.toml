[translation]
52280-1 = "Episódio 28;Aguardando Juntos pelo Desabrochar"
52280-2 = "Ala de Internação do Hospital"
52280-5 = "Sim, sim~ Pode entrar."
52280-9 = "Ora, [USERNAME]-sensei?"
52280-10 = "O que faz por aqui...?"
52280-11 = "[s1] \"Ouvi dizer que você foi internada, então vim fazer uma visita.\"\n[s2] \"Como você está se sentindo?\""
52280-14 = "Nyaha... Peço mil desculpas por causar uma preocupação desnecessária."
52280-15 = "Como pode ver, estou esbanjando saúde.#nOs ferimentos também já estão quase todos curados."
52280-16 = "Só que a Kaho é tão teimosa... Ficou dizendo: \"Mesmo que seja um ferimento leve, se foi causado pelos Hyakumonogatari, é repouso absoluto!\""
52280-17 = "Fui internada apenas para tratamento e exames. Não é nada grave, de verdade, então pode ficar tranquilo."
52280-18 = "[s] \"Que alívio ouvir isso.\""
52280-19 = "Bom, sendo sincera... fico até um pouco sem graça de ser a única internada."
52280-20 = "O pessoal do Hyakkaryouran e todos os outros que enfrentaram aquela batalha mortal já voltaram à rotina normal... e só eu aqui descansando, né...?"
52280-21 = "Bem, não é todo dia que me mandam \"tirar folga do trabalho\", certo?#nPretendo aproveitar a calmaria... Hehe."
52280-22 = "[s] \"Pra quem tá de folga, tem uma pilha enorme de documentos do lado da cama...\""
52280-26 = "E-Err, isso aqui é que..."
52280-27 = "É claro que eu adoraria ficar de preguiça para sempre, sempre e seempre, sabe?#nSó que... rumores tendem a crescer com o tempo, e se a gente não cortar pela raiz, logo fogem completamente do controle."
52280-28 = "Depois de um incidente desse tamanho, os fofoqueiros de plantão vêm nos bombardear de perguntas."
52280-29 = "Por isso estou revisando primeiro os documentos de maior prioridade—"
52280-30 = "Mas NÃO! É! MESMO! Porque eu gosto de trabalhar! De jeito nenhum!"
52280-31 = "[s3] \"T-Tá bom, entendi...\"\n[s4] \"Que bom ver que a Niya de sempre voltou.\""
52280-34 = "Aproveitando que o Sensei está aqui, deixe-me relatar o assunto mais importante de todos..."
52280-35 = "...O \"Festival Waraku\" foi um sucesso estrondoso e encerrou suas cortinas sem nenhum problema!"
52280-39 = "[ns] \"...Esse era o assunto mais importante?\""
52280-40 = "Mas é claro! Não é todo dia que temos a chance de ver uma apresentação tão fofa da Chise-nyan ao vivo, concorda?"
52280-41 = "Além disso, ouvi dizer que a música nova que ela estreou está fazendo o maior sucesso nas redes sociais."
52280-42 = "A Kaho até veio me dizer, com a cara mais séria do mundo:#n\"Quem sabe não aproveitamos a oportunidade para uma estreia oficial como idol...!\""
52280-43 = "Mas logo depois ela ficou com a mão na cabeça, desesperada: \"Se a Chise-chan ficar ocupada demais, vou ter menos tempo para ficar ao lado dela...!\""
52280-44 = "[s] \"Falando nisso, queria perguntar uma coisa sobre o festival...\""
52280-45 = "Sim, pode falar."
52280-46 = "[s5] \"Logo que o Festival Waraku começou, o poder do Hitotsume enfraqueceu, né?\"\n[s6] \"Então os festivais de Hyakkiyako eram mesmo um ritual para afastar os Hyakumonogatari?\""
52280-52 = "Imagina~!"
52280-53 = "Foi só um blefe que inventei para abalar a Azami-san.#nNo fim das contas, um festival é só um festival."
52280-54 = "Dizem que, em tempos remotos, a origem dos festivais era mesmo a de ritos para afastar calamidades e rogar aos céus por felicidade... mas hoje em dia ninguém lembra disso, nem se importa."
52280-55 = "...Mas, se um festival tão esperado fosse cancelado, muita gente ficaria triste, não é?"
52280-56 = "Doces para a criança que chora, e castigo para a que faz birra."
52280-57 = "Antes das leis do Yin e Yang, essa é apenas a lei mais simples da vida."
52280-58 = "[s7] \"Não acredito que era tudo mentira...\"\n[s8] \"Ainda bem que o Clube Beleza da Natureza caiu nessa.\""
52280-64 = "Ah, é mesmo. Falando no Clube Beleza da Natureza, lembrei do caso da Azami Habu-san da Filial Ebisu..."
52280-65 = "Como eu só conhecia a Filial Ebisu por cartas, enviei algumas alunas para investigar a situação real de lá..."
52280-66 = "...O Comitê Autônomo da Filial Ebisu já estava completamente abandonado há décadas."
52280-67 = "Nenhum morador se lembrava da Azami-san, e muito menos—#nhavia alguém que tivesse recebido os documentos oficiais que enviamos até hoje..."
52280-68 = "[s] \"Então isso quer dizer que...\""
52280-69 = "...Sim."
52280-73 = "A partir de agora, nós também vamos ter que assumir a administração do Distrito Autônomo de Ebisu..."
52280-77 = "[ns] \"É com isso que você tá preocupada?!\""
52280-78 = "Mas é claro! Um trabalho que antes se resolvia sozinho acabou de virar um buraco enorme no nosso colo!"
52280-79 = "Pelo visto, o Clube Beleza da Natureza estava usando o nome do Comitê Autônomo para esconder sua verdadeira identidade."
52280-80 = "Enganar tantas alunas para benefício próprio é imperdoável, claro...#nMas, para não chamarem atenção demais, elas pelo menos faziam o trabalho direito..."
52280-81 = "Aaah... Mais papelada... Meus dias tranquilos ficando cada vez mais distantes..."
52280-82 = "[s] \"Vocês não conseguiram encontrar mais nenhum rastro do Clube Beleza da Natureza?\""
52280-83 = "Não. Assim como da última vez, depois que o incidente terminou, elas desapareceram como fumaça."
52280-84 = "A presidente Kokuriko, a Azami-san... e até a Shuro-san, que estava conosco até pouco tempo atrás."
52280-85 = "A cara que a Shuro-san fez quando percebeu o que tinha feito...#nEu queria tanto ter tirado uma foto... que pena."
52280-86 = "[s] \"Você é má demais, viu...\""
52280-87 = "Nyahaha... A conta dela no \"Vamos Escrever Histórias!\" ainda está ativa, então talvez ela volte a postar quando der na telha, não acha?"
52280-88 = "Ah, eu não menti quando disse que lia as histórias da Shuro-san, viu?#nSão um ótimo passatempo, então estou ansiosa pela próxima obra."
52280-89 = "...Bom, mesmo que o enredo seja uma bagunça completa."
52280-90 = "[s] \"Essa crítica foi bem ácida, hein?\""
52280-91 = "Nyaha... Afinal, escritores são seres tão delicados que perdem o ânimo por qualquer tropeço na soleira da porta."
52280-92 = "Justamente por isso, se soubermos agradá-la do jeito certo, quem sabe a próxima obra não seja uma história alegre e empolgante...?"
52280-93 = "[s] \"Pois é, que a próxima história seja pacífica.\""
52280-97 = "[ns] \"E a Ayame, como está desde então...?\""
52280-98 = "Ah, a Presidente Ayame?"
52280-102 = "Por que não pergunta às amigas dela em vez de perguntar a mim?"
52280-104 = "Hyakkiyako - Rua Principal do Festival"
52280-106 = "(As ruas de Hyakkiyako haviam recuperado sua agitação de sempre)"
52280-107 = "(Moradores aproveitando a festa, alunas preparando as barracas...)"
52280-108 = "(Como se o incidente de poucos dias atrás não tivesse passado de um sonho)"
52280-115 = "Ah, Mestre!"
52280-119 = "Sensei-dono, que bom que você está bem!"
52280-120 = "Não conseguimos falar com você desde o fim do festival, estávamos preocupadas!"
52280-121 = "[s9] \"Desculpa, fiquei sendo chamado de um lado pro outro depois...\"\n[s10] \"Estava resolvendo várias coisas e acabei demorando pra entrar em contato.\""
52280-124 = "De forma alguma! Só de ver que o Mestre está são e salvo, Izuna já fica aliviada!"
52280-125 = "Pra onde o Sensei-dono estava indo?#nA sala do Clube Yin-Yang fica pro outro lado..."
52280-126 = "[s11] \"Estou indo para a sala do comitê do Hyakkaryouran.\"\n[s12] \"Quero ver como a Ayame e a Nagusa estão.\""
52280-129 = "Ayame... É aquela Presidente do Hyakkaryouran, né?"
52280-130 = "Ouvi dizer que, agora que o incidente acabou, ela vai voltar oficialmente para o Hyakkaryouran..."
52280-135 = "O Clube Yin-Yang e o Hyakkaryouran anunciaram oficialmente que \"a Presidente Ayame que apareceu naquela hora foi criada pelo Clube Beleza da Natureza\"."
52280-136 = "Eu também... não quero acreditar que foi coisa da Presidente Ayame, mas..."
52280-137 = "O jeito como a Presidente Ayame agiu naquele momento parecia tão real..."
52280-138 = "Sensei-dono, você sabe de alguma coisa?"
52280-139 = "[s] \"Bem, isso...\""
52280-141 = "N-Não tem como ter sido a verdadeira!"
52280-142 = "...Izuna?"
52280-143 = "Izuna também já foi enganada por adultos maus e quase atrapalhou um festival... mas isso só aconteceu porque não tinha companheiros com quem conversar de verdade."
52280-144 = "Se você tem amigas ao seu lado para dar uma bronca e dizer \"isso está errado\"... elas com certeza te avisariam antes de você sair do caminho certo."
52280-145 = "Ouvi dizer que a Ayame-dono é uma amiga de longa data da Nagusa-dono."
52280-146 = "Enquanto a Nagusa-dono estiver ao lado dela...#na Ayame-dono jamais faria algo ruim!"
52280-147 = "I-Isso mesmo! Sempre ouvi dizer que a Presidente Ayame tem um grande senso de justiça e é gentil com todo mundo."
52280-148 = "Com certeza foi só impressão."
52280-150 = "É verdade... Então foi só impressão minha, né?"
52280-151 = "[s] \"Sim... Com certeza foi.\""
52280-155 = "[ns13] \"Falando nisso, ouvi dizer que algo estranho aconteceu com o Clube de Pesquisa Ninjutsu também,\"\n[ns14] \"vocês estão bem agora?\""
52280-158 = "Ah, é mesmo! Sensei-dono, escuta só!"
52280-159 = "Quando aqueles monstros atacaram o palco do Festival Waraku, do nada surgiu um poder incrível dentro da gente!"
52280-160 = "Será que aquilo também era algum tipo de feitiçaria?!"
52280-161 = "I-Isso mesmo! Eu consegui correr numa velocidade absurda, como se estivesse usando ninjutsu de verdade!"
52280-162 = "Naquela hora, acho que dava até pra correr em cima de papel shoji molhado."
52280-163 = "Em cima de papel shoji molhado—"
52280-164 = "É aquela cena icônica de \"Os 77 Ninjas Solitários Errantes\"?!#nIzuna sempre quis tentar fazer isso pelo menos uma vez!"
52280-168 = "[ns] \"Michiru... você ficou triste por ter perdido esse poder?\""
52280-169 = "Não?"
52280-170 = "Ah... Mas, pensando bem, com aquele poder eu podia ter feito uns efeitos novos bem legais pro Canal da Michirucchi."
52280-171 = "Só que não acho que um poder misterioso desses#nfaria todo mundo perceber o verdadeiro charme dos ninjas."
52280-172 = "O valor de um ninja não vem de poderes ou técnicas fortes. Vem dos laços que ele cria."
52280-173 = "\"Em vez de ter um poder único no mundo, prefiro ser um ninja comum cercado de vários amigos!\"..."
52280-177 = "É o que dizem em \"Os 77 Ninjas Solitários Errantes\"!"
52280-178 = "Izuna também concorda!"
52280-179 = "E-Eu também...!"
52280-181 = "[ns] \"É verdade, eu também concordo.\""
52280-183 = "[ns15] \"Que tal assistirmos a esse filme todos juntos qualquer dia desses?\"\n[ns16] \"Comprei umas caixas de som incríveis pra sala de audiovisual de Schale!\""
52280-186 = "Obaaa! Por mim a gente ia até agora!"
52280-187 = "M-Mas, presidente... Nós ainda temos a missão de arrumar as coisas do Festival Waraku...!"
52280-188 = "Ah, é mesmo... Então fica pra próxima!"
52280-189 = "Iremos visitá-lo em breve, Mestre!"
52280-190 = "V-Vá com cuidado... Sensei!"
52280-194 = "Em Frente à Sala do Comitê Hyakkaryouran - Pátio de Treino"
52280-198 = "Espera, Renge. Isso aí é uma hortênsia, né?"
52280-199 = "Camélias são flores de inverno. Se plantar hortênsias de verão no mesmo canteiro, vai perder toda a harmonia..."
52280-200 = "Até eu sei disso, pô. Mas se a gente plantar lado a lado, dá pra ver flores o ano inteiro, não é vantagem?"
52280-201 = "...Aliás, desce logo daí e vem ajudar!"
52280-202 = "Nada disso. Alguém precisa supervisionar. Não dá pra ver o formato da floresta estando no meio das árvores, né?"
52280-203 = "...Você só não quer sujar as mãos, isso sim."
52280-207 = "Claro que não..."
52280-208 = "Então troca de lugar comigo! Isso aqui é injusto demais—"
52280-215 = "Ora, ora, Sensei!"
52280-216 = "...Bem-vindo, Sensei."
52280-218 = "[ns17] \"Tudo bem com vocês?\"\n[ns18] \"Será que estou atrapalhando...?\""
52280-221 = "Não tem problema. Não é trabalho do comitê."
52280-222 = "Estamos plantando flores junto com as senpais!"
52280-223 = "[s] \"Flores?\""
52280-224 = "Sim. Parece que, depois do Festival Waraku, vão organizar um festival para apreciar várias flores."
52280-225 = "Ganhamos as sementes que sobraram dos preparativos, então—"
52280-226 = "Eu sugeri que plantássemos em frente ao pátio de treino para cuidarmos delas juntas!"
52280-227 = "Vai ser maravilhoso ver as flores desabrochando a cada estação aqui no pátio!"
52280-228 = "Bom, durante o treino a gente nem tem tempo pra olhar em volta, mas..."
52280-232 = "Yukari, pode pegar a terra lá em cima pra mim?"
52280-233 = "Cuidado que está pesada."
52280-234 = "Sim, senhora!"
52280-238 = "[ns] \"Seu braço já está melhor?\""
52280-239 = "Sim, voltou ao normal.#nMeu braço direito... e a Ayame também."
52280-240 = "Tudo o que deixei naquela planície nevada naquele dia voltou."
52280-241 = "Mas a Ayame... continua dormindo desde aquele dia."
52280-242 = "Parece que não há nada de errado com o corpo dela... mas ela não quer acordar."
52280-243 = "[s] \"Será que é algum tipo de sequela de ter caído no Crepúsculo?\""
52280-244 = "Os médicos disseram que a causa provavelmente é psicológica."
52280-245 = "Disseram que o corpo dela está se recusando a despertar."
52280-246 = "Eu tava pronta pra dar um baita sermão nela por ter feito a gente se preocupar tanto... mas desde aquele dia ela só fica dormindo."
52280-247 = "Pensei em chacoalhar ela pra acordar, mas a Nagusa-senpai não deixou."
52280-248 = "É porque ninguém está forçando ela a dormir."
52280-249 = "Não sei o que a Ayame está pensando, nem com o que está sonhando."
52280-250 = "...Mas posso ficar ao lado dela esperando."
52280-255 = "Senpai, de que flor são estas sementes aqui?"
52280-256 = "Essas são... de cerejeira."
52280-257 = "Elas crescem bastante, então é melhor plantar longe das outras sementes."
52280-258 = "Ora, então uma nova cerejeira vai florescer no pátio de treino? Mal posso esperar!"
52280-259 = "Mas demora um tempão até dar flor, né?"
52280-260 = "Mesmo plantando agora, sabe-se lá quando vai florescer..."
52280-264 = "...Tudo bem."
52280-265 = "Mesmo que nós não possamos ver, em um futuro distante alguém verá essas flores."
52280-268 = "As senpais do passado... com certeza pensavam do mesmo jeito."
52280-277 = "Um dia, cem flores desabrocharão aqui também."
52280-278 = "Até esse dia, estarei esperando."
52280-283 = "Por você, quando um dia despertar—"
