[translation]
10047010-1 = "Эпизод 1;Предначертанная встреча"
10047010-4 = "Тихая, спокойная площадь..."
10047010-5 = ""
10047010-8 = "[ns1] «Как круто...»\n[ns2] «Звучит... знакомо?»"
10047010-11 = ""
10047010-12 = "Невероятно! И это выступает студент?"
10047010-13 = "Этот дэт-метал... Он кричит прямо в мою душу!"
10047010-14 = ""
10047010-16 = ""
10047010-17 = "[ns] «Студент...? Дэт-метал...?»"
10047010-18 = ""
10047010-20 = ""
10047010-22 = "[ns] «А, точно! Исполнительница должна быть...!»"
10047010-24 = ""
10047010-26 = "Хех. Спасибо всем."
10047010-27 = "Меня зовут Шиина Цумуги, и я пришла из Страны чудес."
10047010-28 = "Хотя все вы знаете, что это всего лишь сказка, я хочу подчеркнуть, что..."
10047010-29 = ""
10047010-31 = ""
10047010-32 = ""
10047010-33 = "...ощущение..."
10047010-34 = "...это единственное, что важно."
10047010-35 = "[ns] «Это И ПРАВДА Цумуги!»"
10047010-36 = ""
10047010-38 = ""
10047010-39 = "А, вы..."
10047010-40 = "Какая неожиданная и судьбоносная встреча."
10047010-41 = "Однако... одна подруга сказала, что скоро я встречу особенного человека. Простите, что сомневалась в ней."
10047010-42 = "Теперь я вижу, что Красная Нить Судьбы совершенно точно... не выдумка."
10047010-43 = ""
10047010-45 = ""
10047010-46 = ""
10047010-47 = "Раз мы снова встретились, может, немного поговорим."
10047010-48 = "Думаю, на сегодня я уже достаточно поиграла на улице."
10047010-49 = "[s] «Конечно!»"
10047010-50 = "Тогда пойдём..."
10047010-51 = "...в Страну чудес."
10047010-52 = "[s] «Под Страной чудес ты имеешь в виду...»"
10047010-53 = ""
10047010-56 = "[ns3] «Лес в парке?»\n[ns4] «...Концертный зал дэт-метала?»"
10047010-59 = "Хех... Думаю, будет интереснее сохранить это в тайне."
10047010-60 = "А теперь сюда. Уверена, этот опыт вы не забудете."
10047010-61 = ""
10047010-63 = ""
10047010-65 = "Ну как? Каково это — прийти со мной в Страну чудес?"
10047010-66 = "[s] «Р-Разве это не обычное кафе с десертами?»"
10047010-67 = "...Сенсей. Чудо рождается из чего-то неожиданного, незнакомого и интригующего."
10047010-68 = "Мы вдвоём впервые пришли в это кафе. Разве уже это не нечто необычное и новое?"
10047010-69 = "[s] «Наверное...»"
10047010-70 = "Хм. Было бы жаль, если бы отношения студенты и учителя так сильно сковывала неловкость."
10047010-71 = "Так что... как насчёт этого? Давайте узнаем друг друга, создавая историю вместе."
10047010-72 = "[s] «То есть познакомимся поближе?»"
10047010-73 = "Хи-хи. Вы говорите так, будто я пригласила вас на свидание."
10047010-74 = "Я не стану полностью это отрицать. Нечто вроде такого..."
10047010-75 = ""
10047010-77 = ""
10047010-78 = ""
10047010-79 = "...чувства..."
10047010-80 = "...это единственное, что важно."
10047010-81 = "Кстати говоря, у меня есть вопрос."
10047010-82 = "Вам понравилось моё последнее выступление?"
10047010-85 = "МЫ ВСЕ ДОЛЖНЫ УМЕРЕ-Е-ЕТЬ!!!"
10047010-86 = "УОООАААХ!!!"
10047010-87 = ""
10047010-89 = "Сенсей?"
10047010-90 = "[s5] «А, ну...»\n[s6] «Б-Было весело...»"
10047010-93 = "Хи-хи, я рада."
10047010-94 = "Простите, что не смогла пригласить вас на вечеринку после выступления. Остальные участники немного застенчивые..."
10047010-95 = "Я хотела бы когда-нибудь познакомить вас со всеми, если представится возможность."
10047010-96 = "[s] «Они все участники группы из Вайлдханта?»"
10047010-97 = "Нет, мои товарищи по группе учатся в других академиях."
10047010-98 = "Видите ли, в Вайлдханте нет музыкального кружка."
10047010-99 = "Странно, правда? Некому вместе джемить, хотя мы Академия искусств."
10047010-100 = "Вообще-то в Вайлдханте нет никаких... официальных... кружков."
10047010-101 = "Полагаю, там считают, что почти все выплёскивают творческую энергию через свои профильные специальности. Обычно этого достаточно."
10047010-102 = "А потом... есть такие студенты, как я, которым нужно официальное разрешение на внешкольные занятия."
10047010-103 = "Это может показаться строгим, но... думаю, существуют неофициальные пути. Возможно, там студенты с похожими интересами могут тайно делиться ими..."
10047010-104 = "Хм. Мне так много хочется рассказать, но времени у нас нет."
10047010-105 = "Если коротко, я считаю Вайлдхант... Страной чудес надежд и мечтаний."
10047010-106 = "[s] «Страной чудес надежд и мечтаний...?»"
10047010-107 = "В Вайлдханте ты свободен принять свои мечты и следовать за ними, если у тебя хватает решимости."
10047010-108 = ""
10047010-110 = ""
10047010-111 = "А, да. Если у вас столько вопросов, лучше сразу окунуться внутрь..."
10047010-112 = ""
10047010-114 = ""
10047010-115 = "Сенсей. Отныне я буду вашим кроликом."
10047010-116 = "[s] «Что... ты имеешь в виду...?»"
10047010-117 = "Как кролик, который привёл девочку в Страну чудес, я приведу вас в Вайлдхант."
10047010-118 = "Я не настоящий кролик, но создать такую..."
10047010-119 = ""
10047010-121 = ""
10047010-122 = ""
10047010-123 = "...атмосферу..."
10047010-124 = "...это единственное, что важно."
10047010-125 = "Хорошо. Тогда давайте исследовать Вайлдхант и переживём множество историй вместе."
10047010-126 = "Я хочу познакомить вас с моими подругами из общежития."
10047010-127 = "Знаю, они с нетерпением ждут встречи с вами."
10047010-128 = "[s] «О-о! Подруги Цумуги! С удовольствием познакомлюсь!»"
10047010-129 = "Хи-хи, тогда решено."
10047010-130 = "Мне ещё нужно закончить несколько дел, так что чуть позже встретимся и как следует осмотрим академию."
10047010-131 = "Раз я ваш кролик, надену костюм девушки-кролика."
10047010-132 = "[s] «Э-Это не обязательно!»"
10047010-133 = "Правда? Какая жалость..."
10047010-134 = "Девушки-кролики и гитары так... значимы в истории музыки."
10047010-135 = "Я хотела вам показать..."
10047010-136 = "[s7] «Не в этот раз...»\n[s8] «Пожалуйста, оденься нормально.»"
10047010-139 = "Хех. Тогда сохраню это как особое угощение на следующий раз."
10047010-140 = "Ну что, закажем? Какое меню..."
10047010-141 = ""
10047010-143 = ""
10047010-144 = ""
10047010-145 = "Ого, Сенсей. Посмотрите на это описание."
10047010-146 = "Демоническое ассорти десертов, от одного кусочка которого голова пойдёт кругом."
10047010-147 = "А этот сверхъягодный торт бросает вызов моему восприятию одним лишь видом."
10047010-148 = "[s] «Ягоды сложены выше самого торта...?»"
10047010-149 = "То, что ягоды похожи на глазные яблоки, тоже довольно очаровательно."
10047010-150 = ""
10047010-152 = ""
10047010-153 = "Кстати, в моём общежитии есть старшая, которой бы очень понравились такие украшения."
10047010-154 = "А ещё одна всегда носит ведьминскую шляпу — такой эффектный стиль..."
10047010-155 = "Хи-хи. Скоро вы со всеми познакомитесь."
10047010-156 = "[s9] «Звучит... необычно.»\n[s10] «Похоже, интересная компания.»"
10047010-159 = ""
10047010-161 = ""
10047010-163 = "Хотя в тот момент я этого ещё не осознавала..."
10047010-164 = ""
10047010-166 = "Наша общая история уже началась."
