1202-128 = "О... О-о-о..."
1202-129 = "...Теперь понимаешь, что произошло."
1202-130 = "Асуна должна принимать решения в твоё отсутствие, помнишь?"
1202-131 = "Замолчи... Я поняла... Пожалуйста, просто... хватит..."
1202-132 = "А? Ты на меня злишься?"
1202-133 = "Мне не следовало...?"
1202-134 = "Мне просто показалось, что будет весело! И если всё пройдёт хорошо, нам ещё и заплатят! Разве это не здорово?"
1202-135 = ""
