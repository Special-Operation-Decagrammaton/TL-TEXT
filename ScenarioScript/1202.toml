[translation]
1202-1 = "Горничные в смятении, часть 1"
1202-5 = "...Алло? Здесь кто-нибудь есть?"
1202-6 = "Можно войти?"
1202-7 = ""
1202-10 = "Проходи. Дверь открыта."
1202-11 = "Здравствуйте! Спасибо, что приняли."
1202-12 = ""
1202-15 = ""
1202-17 = "Клубная комната и лекционный зал C&C"
1202-19 = ""
1202-20 = "О, ты и правда здесь. Слава богу!"
1202-21 = ""
1202-23 = ""
1202-24 = "*ахает*"
1202-25 = "Эй! Чего все так реагируют? Можно было хоть немного поприветствовать."
1202-26 = "Прошу прощения. Я не хотела."
1202-27 = ""
1202-29 = ""
1202-30 = "О боже, это Юука?"
1202-31 = "Что привело тебя сюда сегодня?"
1202-32 = "У тебя для нас заказ?"
1202-33 = "Боюсь, принять не смогу: президента нет... Но если хочешь, могу записать сообщение?"
1202-34 = "Нет, всё нормально. Это не совсем заказ."
1202-35 = "Или... может, всё-таки заказ?"
1202-36 = "Я хотела попросить кое о чём немного другом."
1202-37 = "О чём-то... другом? Что ты имеешь в виду?"
1202-38 = "Ну, то есть... вообще-то совсем другом."
1202-39 = "Это вроде как заказ, но не совсем миссия."
1202-40 = "Это... вообще ничего не прояснило."
1202-41 = "О! Это была шутка? Заказ, но не миссия..."
1202-42 = "Хи-хи. Неплохо!"
1202-43 = "Кхм. В общем, ничего особенного, но..."
1202-44 = "Наверняка вы видели, как в торговом районе готовятся к фестивалю."
1202-45 = "Да, конечно. На рынке электроники."
1202-46 = "Я уже видела вывески тематических ученических кафе."
1202-47 = "Все придумали самые разные темы, чтобы заработать деньги на фестиваль."
1202-48 = "Но, ну... есть проблема."
1202-49 = "Проблема?"
1202-50 = "Да... *вздох*"
1202-51 = "Проблема в том, что все студенты из Миллениум, поэтому..."
1202-52 = "Все темы немного..."
1202-53 = "Ха-ха-ха! Кажется, я понимаю, к чему ты."
1202-54 = "Всё вроде «Bytes and Bites» или «Кафе химической лаборатории»... Так всех посетителей распугают."
1202-55 = "*вздох* Что с нами не так? В Хяккияко и Тринити всегда говорят, что их фестивали приносят кучу денег."
1202-56 = "Но в любом случае торговый район попросил Семинар что-нибудь с этим сделать."
1202-57 = "Не знаю, почему это проблема Семинар, но... рынок электроники всё-таки часть района Миллениум."
1202-58 = "Ха-ха-ха... Понимаю проблему..."
1202-59 = "Но боюсь, не понимаю, какое отношение она имеет к нам."
1202-60 = "...Да. Вот именно."
1202-61 = "О, кстати, я давно не говорила..."
1202-62 = ""
1202-64 = ""
1202-65 = ""
1202-66 = ""
1202-68 = ""
1202-70 = "...какие замечательные горничные C&C?"
1202-71 = ""
1202-74 = ""
1202-75 = "Это ещё откуда взялось?"
1202-76 = "Комплимент от тебя... немного пугает."
1202-77 = "Я знаю, это маскировка, но вы всё равно горничные, верно?"
1202-78 = "В смысле, у вас и форма есть, и всё остальное."
1202-79 = "И я слышала, что у вас большой опыт внедрения в мейд-кафе."
1202-80 = "Да... Пожалуй, ты права..."
1202-81 = "Мы делали такое несколько раз..."
1202-82 = "Это всего один раз... И, кстати, если согласитесь, мы будем полностью в расчёте за всё. Вы больше ничего мне не будете должны."
1202-83 = ""
1202-85 = ""
1202-87 = "Так что... может, поработаете в мейд-кафе...? Всего неделю?"
1202-89 = "(Час спустя...)"
1202-92 = ""
1202-93 = ""
1202-94 = "Что. За. Хрень?! Ты вообще о чём?"
1202-95 = "Мейд-кафе? Ты с ума сошла? Нет, нет, нет! Не верится, что ты вообще меня об этом попросила!"
1202-96 = "Почему все думают, что если на нас форма горничных, то мы каким-то волшебным образом настоящие горничные?"
1202-97 = "Ну... обычно люди в форме горничных И ЕСТЬ горничные."
1202-98 = "Вообще-то это идеально."
1202-99 = "С такой легендой наше прикрытие будет безупречным. Все будут знать нас как горничных."
1202-100 = "Хватит. Нет. Ни за что!"
1202-101 = "Только через мой труп. Слышишь? Никогда!"
1202-102 = "Эм... Но... Дело в том... Мы уже..."
1202-103 = "...?!"
1202-104 = "Что? Уже что? Говори!"
1202-105 = "Мы уже согласились."
1202-106 = "Семинар даже выделил бюджет на проект, так что, боюсь, отказаться уже не получится."
1202-107 = "Мы даже подписали контракт. Если отменим, придётся платить штраф."
1202-108 = ""
1202-110 = ""
1202-111 = "...Простите?"
1202-112 = "Что ты сказала? Контракт? Ты шутишь, да? Скажи, что шутишь!"
1202-113 = "Стой-стой. Это вообще не сходится. Мы подписали контракт?"
1202-114 = "Насколько я помню, президент здесь я, и ничего не подписывала. Тогда как это возможно? Кто подписал?"
1202-115 = "А, это? Я!"
1202-116 = ""
1202-118 = ""
1202-119 = ""
1202-120 = "..."
1202-121 = "..."
1202-122 = "А...? Что такое?"
1202-123 = "Почему вы так на меня смотрите?"
1202-124 = ""
