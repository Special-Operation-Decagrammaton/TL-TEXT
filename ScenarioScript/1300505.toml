1300505-18 = ""
1300505-19 = ""
1300505-23 = "«Мне нужна лишь свобода смерти! Жить — бессмысленная мольба!»"
1300505-24 = "«Вырви сердце врага и упейся его кровью!"
1300505-25 = "..."
1300505-26 = ""
1300505-27 = "[ns] «Ч-Что это вообще за песня?»"
1300505-28 = "Цепляет, да? Это новая песня хеви-метал группы Black Death Poison."
1300505-29 = "Они какое-то время были на паузе. Я уже начала переживать, когда появились слухи о распаде."
1300505-30 = "Но они вернулись и выпустили ещё один абсолютный хит."
1300505-31 = "Хе-хе. Наверное, думаешь, что текст совсем не образовательный."
1300505-32 = "И вот тут ты ошибаешься! Песни Black Death Poison могут звучать жестоко, но в них полно важных жизненных уроков."
1300505-33 = "Послушай их дебютный альбом и поймёшь."
1300505-34 = "Вот, послушай."
1300505-35 = ""
1300505-36 = ""
1300505-40 = "«Эта земля — мусор, и ты тоже!»"
1300505-41 = "«Я всё переработаю и начну заново!»"
1300505-42 = "..."
1300505-43 = "Я слушал рекомендации Кайоко, пока у меня не онемели уши."
