1300505-12 = "Прости, я слушала музыку. Даже не слышала, как ты меня звал."
1300505-13 = "Что слушаю?"
1300505-14 = "Хе-хе. Новый сингл моей любимой группы."
1300505-15 = "Он шикарный! Я ставлю его на повтор по дороге в школу и обратно."
1300505-16 = "Хочешь тоже послушать?"
