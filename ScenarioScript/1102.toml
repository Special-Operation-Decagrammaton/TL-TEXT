[translation]
1102-1 = "Странный день Общества гурманов, часть 2"
1102-2 = "(Членов Общества гурманов запирают в камере Префектурной команды.)"
1102-3 = "Что?! Я тоже хочу трюфелей!"
1102-4 = "К сожалению, их у нас конфисковали..."
1102-5 = "Ну вы хотя бы успели их понюхать! Ведь именно за аромат их так ценят!"
1102-6 = "Это правда. Такой насыщенный, роскошный аромат... Я никогда его не забуду."
1102-7 = "Вот бы ещё попробовать их на вкус."
1102-8 = "*грохот* *бум* *бах* Да вы неисправимы! Вы собирались съесть их без меня?! Как грубо — даже не поделились!"
1102-10 = "Тихо там! В камере не шуметь!"
1102-11 = "Конфискованное вернут после того, как подтвердится, что оно не связано с преступной деятельностью. Это займёт примерно месяц."
1102-13 = "Месяц?! Это слишком долго!"
1102-14 = "Вот, Изуми. Понюхай."
1102-15 = "Фу! Не говори такое, протягивая мне трусики."
1102-16 = "С чего бы мне нюхать твоё бельё, Акари?"
1102-17 = "Но... именно в эти трусики были завёрнуты трюфели!"
1102-18 = ""
1102-19 = "Вдохни поглубже и насладись ароматом настоящих трюфелей — чёрных бриллиантов! ☆"
1102-20 = ""
1102-21 = ""
1102-23 = "Дай сюда! Чего сразу не сказала?!"
1102-24 = ""
1102-25 = "*нюх* *нюх* *ню-ю-юх*"
1102-26 = "Так вот как пахнет настоящий трюфель. Запомню навсегда!"
1102-27 = ""
1102-28 = "*нюх* *нюх* *нюх*"
1102-29 = "Вы все с ума сошли?"
1102-30 = "Какая прекрасная картина. Изуми, твоя преданность гастрономии тронула меня."
1102-31 = "По-моему, она больше похожа на извращенку."
1102-32 = "[s] «Всем привет.»"
1102-33 = "А! Сенсей? Давно вы здесь стоите?!"
1102-34 = "Что вы здесь делаете?"
1102-35 = "Дайте угадаю. Вас опять посадили сюда за непристойное поведение, да?"
1102-36 = "[s1] «Это неправда! Меня подставили!»\n[s2] «Это долгая история...»"
1102-37 = "Зная вас, Сенсей, в это трудно поверить. ☆"
1102-38 = "У меня есть кое-какие подозрения... но я предпочту поберечь уши остальных."
1102-41 = "Сенсей! У меня прямо на ладони остался аромат трюфелей. Хотите понюхать вместе?"
1102-42 = "[s3] «Ещё бы!»\n[s4] «Ни в коем случае.»"
1102-43 = "*нюх* *нюх* *ню-ю-юх*"
1102-44 = "Точно не хотите? Такой шанс выпадает не каждый день. Возможно, даже всей вашей месячной зарплаты не хватит, чтобы позволить себе понюхать нечто подобное."
1102-45 = "[s5] «Ну, если так...!»"
1102-46 = "*нюх* *нюх* *ню-ю-юх*"
1102-47 = "*лязг* *лязг*"
1102-48 = "*вздыхает* Прошу прощения, Сенсей. Я и не подозревала, что всё это было недоразумением."
1102-49 = "Когда мне доложили, что кто-то купается голышом в школьном бассейне, я решила, что это вы. Признаю, я немного поспешила вас задерживать."
1102-50 = "Такого бы не случалось, если бы вы нормально себя вели."
1102-51 = "[s] «*ню-ю-юх*?! Эм...»"
1102-52 = "...?!"
1102-54 = "Ну как, Сенсей? Самые пахучие трусики, которые вам доводилось нюхать, да?"
1102-55 = "..."
1102-56 = "..."
1102-57 = ""
1102-58 = "..."
1102-59 = "[s] «Н-Нет, погодите! Это недоразумение! Всё совсем не так, как выглядит...»"
1102-60 = "Оправдываться будете в аду."
1102-61 = "*ГРОХОТ*"
1102-62 = "Странный день Общества гурманов"
