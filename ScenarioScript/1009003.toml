[translation]
1009003-1 = "Когда-то и я была таким ребёнком"
1009003-4 = "Ура, Сенсей!"
1009003-5 = "Добро пожаловать в Момоёдо! Что будете заказывать?"
1009003-6 = "У нас есть самые разные традиционные сладости! Клубничный анмицу, яцухаси, булочки с красной фасолью, мандзю, клейкие рисовые пирожки..."
1009003-7 = "А запить всё можно матчей!"
1009003-8 = "[s1] «Мне что-нибудь... не слишком сладкое!»\n[s2] «Дай мне что-нибудь сладкое!»"
1009003-11 = "Хорошо! Заказ принят! Пожалуйста, подождите немного!"
1009003-12 = ""
1009003-14 = ""
1009003-19 = ""
1009003-20 = "[ns] «Странно... Сегодня здесь не так много посетителей?»"
1009003-21 = "Согласна... Но иногда бывают и такие дни."
1009003-22 = "К счастью, не слишком часто — может, один-два раза в неделю?"
1009003-23 = "Что? Вы хотите, чтобы я присела и немного отдохнула? Я не могу..."
1009003-24 = "А? Если вы разрешаете... тогда можно?"
1009003-25 = ""
1009003-27 = ""
1009003-28 = "Н-Ну тогда... пожалуй, я немного отдохну..."
1009003-29 = ""
1009003-31 = ""
1009003-32 = ""
1009003-34 = ""
1009003-35 = "*вздох*... Как же приятно присесть. Ноги уже болели..."
1009003-36 = "[s] «Я так и думал.»"
1009003-37 = "Вы всегда такой добрый... и внимательный..."
1009003-38 = "Ах да. Через три дня у озера будет фестиваль маримо, так что после закрытия Момоёдо мне нужно будет заняться подготовкой."
1009003-39 = "А ещё надо ходить на лекции и между всем этим готовиться к экзаменам."
1009003-40 = "[s3] «Момоёдо и фестиваль ещё можно было бы совместить, но сверху ещё лекции и экзамены?»\n[s4] «Ты образцовый студент, Умика. Я впечатлён.»"
1009003-43 = "Ах, Сенсей! Не плачьте! Мне будет ужасно неловко, если я доведу вас до слёз!"
1009003-44 = "Ученики должны учиться и заниматься. Это же само собой разумеется..."
1009003-45 = ""
1009003-47 = ""
1009003-48 = "Сенсей, почему вы плачете ещё сильнее?!"
1009003-53 = ""
1009003-54 = "[ns] «Подготовка к фестивалю идёт хорошо?»"
1009003-55 = "Да, всё идёт гладко."
1009003-56 = "Хи-хи-хи... Но работы от этого меньше не становится."
1009003-57 = "И всё же работа — тоже часть того, что делает фестиваль фестивалем!"
1009003-58 = "Хм? Почему я так люблю фестивали?"
1009003-59 = "...Хи-хи."
1009003-60 = ""
1009003-62 = ""
1009003-64 = ""
1009003-65 = "Ну... просто они навевают воспоминания."
1009003-66 = "Когда я была маленькой, я жила в деревне."
1009003-67 = "Воздух был чистым, вокруг всё спокойно... но заняться особо было нечем."
1009003-68 = "Это было умиротворённо, но знаете, ребёнку ведь хочется чего-нибудь захватывающего!"
1009003-69 = "[s] «Эй, взрослым тоже хочется впечатлений!»"
1009003-70 = "П-Правда?!"
1009003-71 = ""
1009003-73 = ""
1009003-74 = "Для ребёнка, выросшего в деревне, фестивали, которые проходили один-два раза в год, были самым захватывающим событием."
1009003-75 = "Примерно за месяц до фестиваля вся деревня начинала готовиться. Мы резали бамбук и бумагу для поделок, красили ткани, строили паланкин..."
1009003-76 = "Наверное, именно тогда всё и началось. Я и не заметила, как стала ребёнком, который готовился к фестивалям усерднее и быстрее всех в деревне."
1009003-77 = "Позже я поступила в Хяккияко. Я многому научилась, многое изменилось, но..."
1009003-78 = "Фестивали всё равно остались одним из моих любимых занятий."
1009003-79 = "Я могу изучать фестивали Кивотоса когда захочу. А если заранее всё спланировать, могу и сама побывать на них под видом учебной поездки."
1009003-80 = "Хотя планировать и готовить фестиваль совсем не просто. Мне ещё многому нужно научиться в Момоёдо, но..."
1009003-81 = "Стоит мне услышать слово «фестиваль», и я всё равно чувствую прилив восторга!"
1009003-82 = "Правда, многие говорят, что из-за этой одержимости я становлюсь немного рассеянной. Или что разговорами о фестивалях порчу атмосферу..."
1009003-83 = "[s] «А разве это проблема?»"
1009003-84 = ""
1009003-86 = ""
1009003-87 = "Разве нет...?"
1009003-88 = "[s] «Если от этого никто не страдает, думаю, нет.»"
1009003-89 = "Но каждый раз, когда меня охватывает фестивальная лихорадка, я перестаю замечать всё вокруг, а голова пустеет..."
1009003-90 = "[s5] «Ты умеешь направлять огромное количество энергии на одну цель.»\n[s6] «По-моему, это дар.»"
1009003-93 = ""
1009003-95 = ""
1009003-96 = ""
1009003-97 = "...Правда?"
1009003-98 = "Если Сенсей так говорит, значит это правда... да?"
1009003-99 = "Хи-хи-хи. Спасибо, Сенсей. Мне стало немного легче."
1009003-100 = "К-Конечно, раз уж я теперь работаю в Момоёдо, здесь я тоже буду стараться изо всех сил!"
1009003-101 = ""
1009003-104 = ""
1009003-105 = "...Хотя посетителей сегодня всё ещё немного..."
1009003-107 = ""
1009003-111 = ""
1009003-112 = "Здравствуйте! Что сегодня особенного?"
1009003-114 = "О, посетитель! Я возвращаюсь к работе, Сенсей!"
1009003-115 = ""
1009003-117 = ""
1009003-118 = "Добро пожаловать! Позвольте помочь вам найти место!"
1009003-120 = ""
1009003-122 = "В мгновение ока Момоёдо снова заполнился посетителями."
1009003-123 = "Понаблюдав за работой Умики, я оплатил счёт и вернулся в Шале."
