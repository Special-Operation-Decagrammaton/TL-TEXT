[translation]
10035070-1 = "Эпизод 7;Откуда ты взялся, Мехагатор?"
10035070-2 = "Ого! Он ещё и огнём плюётся!"
10035070-3 = "Это не обычный аллигатор!"
10035070-4 = "Металлическая броня, несколько встроенных орудий, высокая манёвренность..."
10035070-5 = "Предлагаю называть его Кибернетическим быстроходным носителем вооружения."
10035070-6 = "Слишком длинно! Давайте просто назовём его Мехагатором!"
10035070-7 = "Наша задача — отвлекать внимание Кибернетического быст..."
10035070-8 = "...Мехагатора, пока граждане не будут безопасно эвакуированы."
10035070-9 = "Будьте осторожны. Не входите в радиус его атаки!"
10035070-11 = "Директор! Броня слишком толстая! Пули не пробивают!"
10035070-12 = "А может, вы промахнулись."
10035070-13 = "Что?! Да не может быть...!"
10035070-15 = "Пригнитесь!"
10035070-16 = ""
10035070-18 = ""
10035070-21 = ""
10035070-22 = "Эй, кажется, получилось! Граната сработала!"
10035070-23 = "Нет, думаю, мы только оглушили его."
10035070-25 = "Внимание! Открытая часть комплекса закрыта. Просим всех посетителей, находящихся снаружи, пройти во внутренние зоны."
10035070-26 = "Повторяю! Открытая часть комплекса—"
10035070-28 = "Но внутри-то безопасно, да? Он ведь за нами туда не полезет?!"
10035070-29 = "Пожалуйста, не толкайтесь!"
10035070-30 = "Всё будет хорошо! Дверь слишком маленькая, аллигатор туда не пролезет!"
10035070-32 = ""
10035070-33 = "О-О нет! Что это?! Там правда ЕСТЬ аллигатор?!"
10035070-34 = "Технически это Мехагатор."
10035070-35 = "Прекрасно, конечно!"
10035070-36 = "Откуда он взялся? И почему он в моём парке?!"
10035070-37 = "Мы же раньше ничего не нашли!"
10035070-38 = ""
10035070-41 = "Угх! Проклятое чудовище!"
10035070-43 = "Именно об этом мы вам и говорили."
10035070-44 = "Теперь верите?"
10035070-45 = ""
10035070-47 = ""
10035070-48 = "Я-Я-Я..."
10035070-49 = ""
10035070-50 = "Вы... что?"
10035070-52 = "П-Простите!"
10035070-53 = "Это просто казалось совершенно невероятным!"
10035070-54 = "Ну сами подумайте! Никто не ожидает увидеть здесь аллигатора!"
10035070-55 = "Тем более РОБОТА-аллигатора?!"
10035070-56 = "Сейчас не время искать виноватых. Сначала нужно остановить чудовище."
10035070-57 = "Сможете прикрыть нас, пока мы продвигаемся вперёд?"
10035070-58 = "Есть, обязательно!"
10035070-59 = "Хорошо, что вы здесь, курсанты «Валькирии»! Я знаю, на вас можно положиться!"
10035070-61 = "(Раньше он говорил совсем другое...)"
