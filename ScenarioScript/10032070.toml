10032070-10 = "Фух! Этим крысам и правда нет конца. Всё лезут и лезут из канализации!"
10032070-11 = "А чего ты ожидала? Мы захватили главу целого союза банд. Они не позволят нам просто так уйти вместе с ним."
10032070-12 = "Кстати, как там Аранчино? Он уже очнулся?"
10032070-13 = "Так, посмотрим..."
10032070-14 = "Не-а! Спит как младенец!"
10032070-15 = "Он ещё долго будет в отключке. Я видела, как его раньше вырубило гранатой!"
10032070-16 = "*вздыхает*... Ну и каковы были шансы?"
10032070-17 = "Почему бы просто не отдать лишний груз? Ведь именно за ним они и гонятся, да?"
10032070-18 = "Нет. Плохая идея."
10032070-19 = "Они бы уже давно нас смяли, если бы Дон Аранчино не был у нас."
10032070-20 = "Сейчас они боятся его задеть. Но если мы его отдадим... Они вытащат тяжёлую артиллерию, и нам конец."
