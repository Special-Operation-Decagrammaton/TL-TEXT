[translation]
2004206-1 = "Новогодняя открытка"
2004206-2 = "Кафе Учебного центра Миллениума"
2004206-4 = "Я возвращался после визита в Миллениум по поводу годового финансового отчёта."
2004206-5 = ""
2004206-7 = ""
2004206-8 = "И случайно заметил Маки, которая сидела у террасы кафе, погружённая в раздумья."
2004206-9 = "М-м, хм..."
2004206-10 = "[s1] «Привет, Маки. О чём задумалась?»\n[s2] «Какие тайны скрывает этот чистый лист бумаги перед тобой?»"
2004206-13 = "А, Сенсей. Что привело вас в Миллениум?"
2004206-14 = "Вообще-то вы как раз вовремя!"
2004206-15 = "Эм... Вы же взрослый, поэтому наверняка получаете много новогодних открыток, да?"
2004206-16 = "[s3] «Одно не обязательно следует из другого...»\n[s4] «Но из-за работы в Шале мне и правда приходит довольно много.»"
2004206-19 = "Этого достаточно!"
2004206-20 = "Из всех новогодних открыток, которые вы получали до сих пор..."
2004206-21 = "...какая впечатлила вас больше всего?"
2004206-22 = "[s] «Посмотрим...»"
2004206-24 = "[ns] «Но почему ты вдруг заговорила о новогодних открытках?»"
2004206-25 = "Понимаете, Чихиро сказала, что раз я уже старшеклассница, мне стоит начать отправлять новогодние открытки людям, которым я была обязана в этом году."
2004206-26 = "Например, владельцу магазина электроники, куда я часто хожу, президентам других клубов и так далее..."
2004206-27 = "Но как ни подумай, разве рукописные сообщения не ужасно неэффективны?"
2004206-28 = "Я и так постоянно пишу людям в сообщениях и по электронной почте. Зачем мне ещё от руки писать то же самое на новогодней открытке?"
2004206-29 = "[s5] «Можно посмотреть и так...»\n[s6] «Но есть чувства, которые через цифру не передать.»"
2004206-32 = "В общем, я как раз придумывала оформление для новогодней открытки."
2004206-33 = "И никак не могу придумать достаточно красивый вариант, который мне понравится."
2004206-34 = "[s] «В магазинах полно красивых готовых дизайнов.»"
2004206-35 = "Так не пойдёт!"
2004206-36 = "Такие шаблонные дизайны вообще не будут выделяться среди остальных новогодних открыток."
2004206-37 = "Может, мне и не хочется этим заниматься, но раз уж делать — я сделаю лучшие новогодние открытки на свете! Люди просто НЕ СМОГУТ не прочитать мою открытку."
2004206-38 = "[s] «Вот это настрой.»"
2004206-39 = "Я слышала, что в новогодней открытке обычно должно быть что-то, что символизирует тебя и то, что случилось с тобой за год..."
2004206-40 = "Но в этом году произошло столько всего. Трудно выбрать что-то одно, что действительно передало бы его целиком."
2004206-41 = "Так что, Сенсей, как думаете, что мне нарисовать, чтобы новогодняя открытка снесла всем крышу?"
2004206-42 = "[s7] «Тут на самом деле нет правильного ответа...»\n[s8] «Открытка нужна, чтобы поделиться воспоминаниями и поздравить с Новым годом.»"
2004206-45 = "[ns] «Как насчёт того, чтобы нарисовать самый запоминающийся момент года?»"
2004206-46 = "Самый запоминающийся момент..."
2004206-47 = "М-м... Кажется, есть идея."
2004206-48 = ""
2004206-50 = ""
2004206-51 = ""
2004206-52 = "Дайте мне секундочку, Сенсей!"
2004206-53 = ""
2004206-55 = ""
2004206-59 = ""
2004206-60 = ""
2004206-61 = "И... готово!"
2004206-62 = "Ну как, Сенсей? Дизайн ведь супер-впечатляющий, правда?"
2004206-63 = "[s] «Крутой дизайн.»"
2004206-65 = "[ns] «Но мне кажется, я уже где-то это видел...»"
2004206-66 = "А, понимаете..."
2004206-67 = "Когда мы с вами впервые вместе рисовали граффити, я нарисовала именно это! Помните?"
2004206-68 = "В этом году я сделала кучу граффити, но то, которое мы рисовали вместе, определённо запомнилось сильнее всего."
2004206-69 = "Ни место, ни рисунок сами по себе не были чем-то особенным, но мне было так весело..."
2004206-70 = "Я-я не пытаюсь хвастаться нашими воспоминаниями, но..."
2004206-71 = "...все моменты, проведённые с вами, были для меня незабываемыми, Сенсей."
2004206-72 = ""
2004206-74 = ""
2004206-75 = ""
2004206-76 = "Ну что ж, Сенсей. Это моя первая настоящая бумажная новогодняя открытка."
2004206-77 = "И в следующем году я тоже на вас рассчитываю!"
