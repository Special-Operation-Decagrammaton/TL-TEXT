[translation]
2300806-1 = "Чего ты хочешь"
2300806-2 = "(Следуя указаниям Мари, я прибыл к месту встречи — на уединённый стрельбищный полигон в Тринити.)"
2300806-3 = "(Это было огромное открытое пространство, где не было ни души, — даже тише, чем в соборе.)"
2300806-4 = "Ты пришёл, Сенсей."
2300806-5 = ""
2300806-8 = ""
2300806-9 = "Я вас ждала. Я переживала, что могла слишком надавить на вас своим внезапным звонком."
2300806-10 = "И ведь дело даже не в чём-то важном..."
2300806-11 = "[s1] «Всё в порядке, но почему именно здесь...?»\n[s2] «Мари, на стрельбище...?»"
2300806-12 = "Ох... Простите. Наверное, всё-таки это и правда было неожиданно."
2300806-13 = "Ох... Простите. Наверное, всё-таки это и правда было неожиданно."
2300806-14 = "Я пришла сюда не совсем из-за оружия. Просто здесь тихо. Вот и всё."
2300806-15 = "Здесь тишина и почти нет людей, поэтому я могу сосредоточиться на молитве."
2300806-16 = "В такие моменты стрельбище может быть даже тише собора или исповедальни."
2300806-17 = "Поэтому, когда меня что-то тревожит или я хочу помолиться в одиночестве, я прихожу сюда."
2300806-18 = "Хм-м. Наверное, я всё-таки странная? Сестра, которая приходит на стрельбище..."
2300806-19 = "[s3] «Нет. Это совсем не странно.»\n[s4] «Если так объяснить, это действительно на тебя похоже.»"
2300806-20 = "Спасибо. Я боялась, что вы неправильно меня поймёте."
2300806-21 = "Спасибо. Я боялась, что вы неправильно меня поймёте."
2300806-22 = "Честно говоря, сначала я даже не знала, что это место существует."
2300806-23 = "Я лишь слышала, что сюда иногда приходят другие сёстры... Поэтому решила последовать их примеру."
2300806-24 = ""
2300806-26 = ""
2300806-27 = ""
2300806-28 = "Я обнаружила, что меня завораживает это уединение, эта глубокая тишина..."
2300806-29 = "Когда хочется очистить голову от праздных мыслей... Возможно, ради самоанализа или чтобы подбодрить себя..."
2300806-30 = "Когда хочется забыть то, что тревожит разум... здесь я нахожу ответы."
2300806-31 = "...Забыть."
2300806-32 = ""
2300806-34 = ""
2300806-35 = "[ns] «...Мари?»"
2300806-36 = "Ну..."
2300806-37 = "Честно говоря, после того выходного я решила попросить совета."
2300806-38 = "Другие сёстры любезно сказали, что это совершенно естественно, но..."
2300806-39 = "Я не хочу, чтобы это повторилось. Наверное, в каком-то смысле это вопрос самодисциплины..."
2300806-40 = "Тогда они сказали: «Хорошо всегда стремиться служить другим, но иногда важно находить время и на то, чего хочешь сама.»"
2300806-41 = "И я задумалась. Чего же именно я хочу."
2300806-42 = "Поэтому я пришла сюда — помолиться и привести мысли в порядок. И тогда поняла."
2300806-43 = "Но ответ оказался неожиданным. Я немного растеряна."
2300806-44 = ""
2300806-45 = "Сэн..."
2300806-46 = "[s5] «...Сэн?»\n[s6] «...Мари?»"
2300806-47 = "...Сенсей."
2300806-48 = "...Сенсей."
2300806-49 = "Эм. Иногда... Не обязательно часто..."
2300806-50 = "Е-Если это не доставит вам слишком много хлопот..."
2300806-51 = "...Э..."
2300806-52 = "Можно мне... снова иногда занимать немного вашего времени? Ничего особенного делать не нужно."
2300806-53 = "Я не знаю, как это сказать, но... когда вы мне помогли, я почувствовала столько радости... и, эм..."
2300806-54 = "К-Конечно, я понимаю. Такие разговоры не подобают сестре..."
2300806-55 = "Просить других заботиться обо мне или проводить со мной время..."
2300806-56 = "Я знаю, что это противоречит моей обязанности заботиться о других."
2300806-57 = "Я это понимаю, но всё же..."
2300806-58 = "А?"
2300806-59 = "В-Вы не против?"
2300806-60 = "Как вы можете говорить это так легко?!"
2300806-61 = "Вы правда не возражаете?"
2300806-62 = "[s7] «Как я уже сказал, мы учитель и студент.»\n[s8] «Не думаю, что тебе обязательно исполнять обязанности сестры двадцать четыре часа в сутки.»"
2300806-63 = "...!"
2300806-64 = "...!"
2300806-65 = "...Сенсей."
2300806-66 = ""
2300806-68 = ""
2300806-69 = "Хи-хи. Возможно, я слишком серьёзно ко всему этому относилась."
2300806-70 = "Я действительно хочу стать отличной сестрой, но в то же время я ещё и студент."
2300806-71 = "А раз я студент..."
2300806-72 = "...а вы учитель, возможно, рядом с вами мне можно иногда вести себя немного по-детски."
2300806-73 = "Странно. Я вдруг почувствовала такое облегчение."
2300806-74 = ""
2300806-76 = ""
2300806-77 = ""
2300806-79 = "Большое спасибо, Сенсей."
2300806-80 = "Тогда, впредь желаю удачи..."
2300806-81 = "учителю..."
2300806-82 = ""
2300806-84 = ""
2300806-85 = "которому придётся иметь дело с таким ребячливым студентом, как я."
2300806-87 = "(После этого я помолился вместе с Мари, а затем вернулся в Шале.)"
