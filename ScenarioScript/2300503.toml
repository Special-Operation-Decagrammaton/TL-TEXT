[translation]
2300503-1 = "Беги, Аяне, Беги!"
2300503-2 = "Я приехал в школу Абидос и увидел грузовик, заваленный металлоломом и готовый уехать."
2300503-3 = "Как всегда, спасибо, Аяне."
2300503-4 = "Хи-хи. Нет, это Вам спасибо."
2300503-5 = "Ну так, цена хорошая, да и момент лучше некуда. Отвезу всё в центр переработки и в печь."
2300503-6 = "Береги себя!"
2300503-7 = "Вы тоже! Спасибо!"
2300503-8 = ""
2300503-10 = ""
2300503-11 = "О, Сенсей!"
2300503-12 = "[s] «Кто это был?»"
2300503-13 = "Скупщик лома, с которым мы давно работаем. Мы только что заключили довольно выгодную сделку!"
2300503-14 = "Вам не не нужно было ехать сюда..."
2300503-15 = "[s] «Где ты нашла столько металлолома?»"
2300503-16 = "На заброшенном складе в дальнем углу школы. Всё было накрыто брезентом, поэтому я очень долго даже не знала, что он там есть."
2300503-17 = "Весило 300 килограммов, так что за него дали хорошую цену."
2300503-18 = "[s] «Какой именно склад?»"
2300503-19 = "Что?"
2300503-20 = "...Что-то не так?"
2300503-21 = "Вон там."
2300503-23 = "*клац*"
2300503-24 = "Вот здесь. Немного захламлено, потому что, кажется, здесь ещё хранят всякие отходы..."
2300503-25 = "Я нашла всё под этим брезентом."
2300503-26 = "[s] «Давай посмотрим под брезентом.»"
2300503-27 = "А...?"
2300503-28 = "Эй, тут что-то написано... Обращаться осторожно. Особая высокосортная сталь, хранить только в помещении с контролируемым климатом."
2300503-29 = "Особая высокосортная сталь?"
2300503-30 = "Высоко...сортная?!"
2300503-31 = "[s] ..."
2300503-32 = "..."
2300503-33 = "ЧЁРТ!"
2300503-34 = ""
2300503-37 = "Я не могу дозвониться скупщику!"
2300503-38 = "Он не отвечает!"
2300503-39 = "Ч-Что же мне делать?"
2300503-40 = "[s1] «Успокойся, Аяне!»\n[s2] «Мы наверняка можем что-нибудь сделать!»"
2300503-41 = "...Д-Да!"
2300503-42 = "...Д-Да!"
2300503-43 = "Соберись, Аяне... Спокойно, давай разберёмся!.."
2300503-44 = ""
2300503-45 = "Хорошо, сначала оценим ситуацию."
2300503-46 = "*выдыхает*"
2300503-47 = "*динь*—!"
2300503-48 = "Грузовик с металлоломом, скорее всего, едет на грузовую станцию к поезду, который отправится в центр переработки."
2300503-49 = "После погрузки на товарный поезд отследить металлолом будет уже невозможно!"
2300503-50 = "И после того как грузовик выйдет на шоссе к станции, мы тоже уже его не найдём!"
2300503-51 = ""
2300503-52 = ""
2300503-53 = "*тык* *тык* *тык* *тык*"
2300503-54 = "[s] «А если просто позвонить на грузовую станцию?»"
2300503-55 = "Станция беспилотная, отвечать там некому. И даже если выедем сейчас, грузовик уже не догоним."
2300503-56 = "А ехать на станцию бесполезно!"
2300503-57 = "[s] «Тогда что нам делать?»"
2300503-58 = ""
2300503-59 = ""
2300503-60 = "*тык* *тык* *тык* *тык* *тык*"
2300503-61 = "Я пытаюсь вычислить маршрут скупщика лома."
2300503-62 = "К счастью, он так давно работает с нашей школой, что у меня записана вся информация о нём."
2300503-63 = ""
2300503-64 = ""
2300503-65 = ""
2300503-66 = "*тык* *тык* *тык* *тык* *тык* *тык*"
2300503-67 = "Куда он поедет дальше? Хм-м... Обычно после этого он заезжает в центр управления стройматериалами в торговом районе Абидоса."
2300503-68 = "[s] «Значит, нам туда?»"
2300503-69 = "Только если в грузовике осталось место!"
2300503-70 = "Сейчас в нём 300 килограммов груза! Значит, в центре стройматериалов он физически не сможет ничего больше взять!"
2300503-71 = "А там работают только с крупными партиями!"
2300503-72 = "[s] «Что тогда?»"
2300503-73 = "Если он просто проедет мимо, следующим местом, скорее всего, будет..."
2300503-74 = "..."
2300503-75 = "...Вот оно!  Район 3 Центрального Парка Абидоса!"
2300503-76 = "Парк сейчас сносят, так что он наверняка захочет загрузить мелкие предметы!"
2300503-77 = "Всего три километра! Совсем рядом!"
2300503-78 = "Он должен быть там примерно через... десять минут!"
2300503-79 = "[s] «Возьмём такси? Или знаешь кого-нибудь с машиной?»"
2300503-80 = "Нет, такси не успеет..."
2300503-81 = "...Похоже, придётся бежать."
2300503-82 = "[s] «В смысле \"бежать\"?!»"
2300503-83 = ""
2300503-84 = "Грузовик поедет непрямым маршрутом и будет останавливаться на светофорах. По моим расчётам, мы можем пробежать три километра меньше чем за десять минут!"
2300503-85 = "[s] «Что?»"
2300503-86 = "Сенсей, мне нужно, чтобы Вы были моим навигатором."
2300503-87 = "[s] «...Что?!»"
2300503-88 = "Я не смогу одновременно бежать и смотреть маршрут... Вам придётся говорить, куда сворачивать!"
2300503-89 = "Пошли!"
2300503-90 = ""
2300503-91 = "Аяне исчезла как ветер."
2300503-92 = "Мне ничего не оставалось, кроме как стать её навигатором."
2300503-94 = "Сенсей! Я на перекрёстке! Куда?"
2300503-95 = "[s] «Эм... Направо!»"
2300503-96 = "Поняла!"
2300503-98 = "*тяжело дышит* *тяжело дышит* Сенсей! Мне нужно перейти дорогу, но перехода не видно!"
2300503-99 = "[s] «Беги прямо! Примерно через 300 метров будет мост!»"
2300503-100 = "Мост! Поняла! *тяжело дышит* *тяжело дышит*"
2300503-101 = "...Ай!"
2300503-102 = "*туп* *бах*"
2300503-103 = "[s] «Что случилось?!»"
2300503-104 = "А, ничего! Просто скажите, куда дальше!"
2300503-107 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
2300503-108 = "Мне правда... *тяжело дышит* ...надо начать... *тяжело дышит* *тяжело дышит* ...тренироваться..."
2300503-109 = "Хорошо, я добралась... *тяжело дышит* *тяжело дышит* ...Подождите, Мистер!"
2300503-110 = "А? Аяне? Ты чего тут делаешь?"
2300503-111 = "Ты поранилась?"
2300503-112 = "П-Подождите... *тяжело дышит* ...минутку... Груз..."
2300503-113 = "Гру...уз..."
2300503-114 = "(падает)"
2300503-115 = "А-Аяне?!"
2300503-117 = "В итоге за высокосортный металлолом мы получили вдвое больше первоначальной суммы."
2300503-118 = "Аяне радостно улыбалась, рассказывая мне хорошие новости, хотя сама была вся в синяках и ссадинах."
