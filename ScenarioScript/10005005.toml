[translation]
10005005-1 = "Пролог;Новый член C&C"
10005005-3 = "Проникновение успешно."
10005005-4 = "Чисто. Противников не обнаружено."
10005005-5 = "Отлично."
10005005-6 = ""
10005005-11 = "Машинное отделение на борту «Золотого руна»"
10005005-13 = ""
10005005-14 = "*вздох* И это всё? Я ожидала чего-то намного хуже."
10005005-15 = "Пробраться на движущийся круизный лайнер оказалось значительно проще, чем я предполагала..."
10005005-16 = "Причём на корабль, принадлежащий другой школе."
10005005-17 = "Мы проскользнули внутрь, и никто даже не заметил."
10005005-18 = "Всё идёт идеально по плану, не так ли? Хи-хи."
10005005-19 = "*вздыхает*"
10005005-20 = "Ты же не всерьёз. Всё это — катастрофа."
10005005-21 = "Я ненавижу каждую мелочь в этой ситуации!"
10005005-22 = "Мы выполняем приказы! Причём от казначея Семинара! И крадёмся тут как шайка грабителей!"
10005005-23 = "А вишенка на торте..."
10005005-24 = "(сверлит взглядом)"
10005005-25 = "[s1] «Я рассчитываю на тебя, Нэру.»\n[s2] «Я чувствую какую-то враждебность.»"
10005005-26 = "Хуже всего то, что к нам приставили няньку! И почему именно Сенсей?!"
10005005-27 = "Хуже всего то, что к нам приставили няньку! И почему именно Сенсей?!"
10005005-28 = "[s] «Я бы не сказал, что няньку...»"
10005005-29 = "Ну-ну. Мы вовсе не так относимся к Сенсею."
10005005-30 = "Не стоит так злиться из-за неприятной ситуации."
10005005-31 = "Может, Сенсей и не собирался, но Семинар определённо именно этого и хотел."
10005005-32 = "Вот именно! Я реально в бешенстве! За что мне всё это?"
10005005-33 = "Разве я не говорила, что справлюсь сама? Почему они просто не оставили всё мне и не дали делать свою работу?"
10005005-34 = "Аха... ха..."
10005005-35 = "Хм-м."
10005005-36 = "Ну..."
10005005-37 = "Думаю, ты здесь всё-таки не совсем невиновна..."
10005005-39 = "...Два дня назад."
10005005-42 = "Алло? Это Аканэ из C&C."
10005005-43 = "Как у вас связь?"
10005005-44 = "Д-Да! Всё чисто."
10005005-45 = "*вздох* Хотела бы я сейчас не вести этот разговор..."
10005005-46 = "Хи-хи. Сладкий звук нового заказа."
10005005-47 = "Но если смотреть с хорошей стороны, вы обращаетесь к нам, потому что доверяете нам выполнить работу, верно?"
10005005-48 = "О хорошей стороне поговорим после того, как я разгребу бардак, который вы, я уверена, устроите!"
10005005-49 = "Вы хоть раз за всю историю справлялись тихо, как я просила?"
10005005-50 = "Уничтоженное оборудование! Горящие здания! И бесконечная бумажная работа для меня!"
10005005-51 = "Помните прошлый месяц? Вы превысили бюджет почти в шесть раз! Вы мой худший кошмар!"
10005005-52 = "Больше никогда. Я поклялась себе — больше никогда."
10005005-53 = "Поэтому в этот раз я пришла с подкреплением."
10005005-54 = "Простите? Что вы имеете в виду?"
10005005-55 = "Поприветствуйте вашего нового... в некотором роде надзирателя."
10005005-56 = ""
10005005-58 = ""
10005005-60 = "Он просто подтвердит, были ли понесённые в ходе заказа убытки необходимыми расходами."
10005005-61 = "Считайте это небольшой процедурной проверкой, не более. Удачи!"
10005005-62 = "Аха-ха... Но..."
10005005-63 = "А...?"
10005005-64 = ""
10005005-66 = ""
10005005-67 = "Сенсей?"
10005005-69 = "Уф, всё ещё не верится, что это происходит."
10005005-70 = "Не думала, что эти придурки из Семинара опустятся так низко!"
10005005-71 = "И Юука! Бюджет превышен то, лазарет затоплен это!"
10005005-72 = "Разве разбираться с такими вещами не её работа?! Я делаю то же самое — просто выполняю свою работу!"
10005005-73 = "Чем больше думаю, тем сильнее злюсь! Аргх! Всё! Заходим!"
10005005-74 = "Пожалуйста, Нэру. Давайте оценим ситуацию и будем разумны."
10005005-75 = "Если будем безрассудны в другой школе, у нас могут быть большие неприятности."
10005005-76 = "А по-моему, оно того стоит! Если устрою конфликт между школами — пусть!"
10005005-77 = "Если боишься, ладно. Похоже, придётся мне самой обо всём позаботиться."
10005005-78 = "[s3] «Не думаю, что тебе стоит так делать, Нэру.»\n[s4] «Прости, Нэру, но тут я с тобой не соглашусь.»"
10005005-79 = "...А?"
10005005-80 = "...А?"
10005005-81 = ""
10005005-83 = ""
10005005-84 = ""
10005005-86 = "Повторите, Сенсей."
10005005-87 = "Вы на их стороне? Тоже согласны с этой занудой-казначеем?!"
10005005-88 = "[s5] «Ага.»\n[s6] «Нет значит нет.»"
10005005-89 = "Ч-Что?"
10005005-90 = "Ч-Что?"
10005005-91 = "Хм-м."
10005005-92 = ""
10005005-94 = ""
10005005-95 = "Я—! ААРГХ! Вы серьёзно? Серьёзно?!"
10005005-96 = "*вздох* Ладно. Хорошо. Останусь на месте."
10005005-97 = "Но чтобы было ясно: мне всё это всё равно не нравится."
10005005-98 = ""
10005005-100 = ""
10005005-102 = "Ого..."
10005005-103 = "Аканэ, т-ты видишь то же, что и я?"
10005005-104 = "Полагаю, да, Карин. Сомнительные методы казначея Семинара..."
10005005-105 = "...возможно, действительно оказались весьма эффективными. Даже президент не может отказать Сенсею."
10005005-106 = "На самом деле, возможно, это и было конечной целью Юки с самого начала."
10005005-107 = "Все заткнулись! У меня теперь плохое настроение, так что ни слова!"
10005005-108 = "Хи-хи. Да, мэм."
10005005-109 = "В любом случае, Сенсей, наша цель сегодня — быстро и тихо выполнить миссию."
10005005-110 = "Какой бы ни была причина, теперь вы будете с нами, так что, пожалуйста, поднимайтесь на борт."
10005005-112 = "Я своим глазам верю? Мастер?!"
10005005-113 = "Вы сегодня будете играть с нами?"
10005005-114 = "Мастер будет в нашей команде! Новый член C&C!"
10005005-115 = ""
10005005-118 = ""
10005005-119 = "А?"
10005005-120 = "...?"
10005005-121 = "Сенсей... как новый член C&C?"
10005005-122 = "Наверное, можно и так посмотреть."
10005005-123 = "О боже, никаких возражений! Хи-хи."
10005005-124 = "Теперь Сенсей один из нас. Какой неожиданный и интересный поворот."
10005005-126 = "Разве от этого тебе не становится хоть немного приятнее, президент?"
10005005-127 = "Ты издеваешься? Нет, мне от этого ни капли не лучше."
10005005-128 = "Точно? А меня это очень радует!"
10005005-129 = "Абсолютно, без малейшей тени сомнения, совершенно уверена."
10005005-130 = "Обнаружена лёгкая улыбка."
10005005-131 = "Я разве не сказала всем заткнуться?! Я не рада, ясно?! Я всё это ненавижу!"
10005005-132 = "[s7] «У тебя милое довольное выражение лица.»\n[s8] «Рад сегодня с тобой поработать.»"
10005005-135 = "...!"
10005005-136 = "...Аа... Аргх...!"
10005005-137 = ""
10005005-139 = ""
10005005-140 = "..."
10005005-141 = "Л-Ладно! Пожалуй, это не худшее, что со мной случалось."
