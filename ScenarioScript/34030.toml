[translation]
34030-1 = "Эпизод 3;Заключённая принцесса"
34030-2 = "После инцидента с Эдемским договором ситуация в Тринити, мягко говоря... шаткая."
34030-3 = "Общественное мнение о Мике постоянно ухудшается."
34030-4 = "Её уже отвергли сторонники фракции Pater, а завтра на слушании официально исключат из Чаепития."
34030-5 = "Люди уверены, что именно Мика была главным виновником сговора с академией Ариуса, приведшего к инциденту с Эдемским договором."
34030-6 = "[s] «...!»"
34030-7 = "Начались беспорядки с требованиями её исключения, а в окно камеры бросали камни и даже бомбы."
34030-8 = "Доску объявлений академии завалили нападками на Мику... Её комнату полностью разгромили в ярости."
34030-9 = "Одежду и аксессуары сожгли, вещи растащили. Виновных не нашли."
34030-10 = "[s] «Они заходят слишком далеко!»"
34030-11 = "...Да. Отряд правосудия делает всё возможное, но с такой толпой мы справиться полностью не можем."
34030-12 = "[s1] «Они даже всей истории не знают.»\n[s2] «Не могу поверить...»"
34030-13 = "Мика стала врагом номер один во всей Тринити."
34030-14 = "Мика стала врагом номер один во всей Тринити."
34030-15 = "Студенты могут считать всё это заслуженной ценой, но..."
34030-16 = "Наказание не соответствует преступлению. Я хочу ей помочь."
34030-17 = "[s3] «Я помогу. Просто скажи что делать.»\n[s4] «Я могу что-нибудь сделать?»"
34030-18 = "Я так и думала, что вы это скажете."
34030-19 = "Я так и думала, что вы это скажете."
34030-20 = "Но не думаю, что Мика готова себя защищать."
34030-21 = "[s] «Что? Почему?»"
34030-22 = "Она отказывается даже приходить на слушание. Если её там не будет... её исключат автоматически."
34030-23 = "Хотела бы я убедить её, но..."
34030-24 = "Если бы здесь была Сэя, уверена, она что-нибудь придумала бы... Но, как вы слышали, она прикована к постели."
34030-25 = ""
34030-27 = ""
34030-28 = "Поэтому я хочу попросить вас об услуге."
34030-29 = "[s] «Хорошо. Я попробую убедить Мику.»"
34030-30 = ""
34030-32 = ""
34030-33 = "Спасибо, Сенсей. Вас она наверняка послушает."
34030-34 = "Она этого не признает, но ждала вашего визита."
34030-35 = "*вздыхает*"
34030-36 = "По крайней мере одной заботой меньше, даже если ничего пока не решено."
34030-37 = "[s] «Ты в порядке, Нагиса?»"
34030-38 = "Я? О, да..."
34030-39 = "Как-нибудь я всегда справлюсь."
34030-40 = "Хи-хи. Я всегда могу рассчитывать, что вы будете обо мне переживать. Спасибо."
34030-41 = "В любом случае... Удачи, Сенсей."
34030-43 = "Я попрощался с Нагисой и пошёл к Мике."
34030-46 = "Как она посмела напасть на Сэю? Выведите её!"
34030-47 = "Отвратительно, что эта ведьма всё ещё состоит в Чаепитии!"
34030-48 = "Повесить предательницу!"
34030-50 = "Назад! Н-Не переходите черту!"
34030-51 = "Предательница должна заплатить за свои преступления!"
34030-52 = ""
34030-54 = ""
34030-55 = "[ns] «(Нагиса не преувеличивала...)»"
34030-58 = "Камера Мики"
34030-59 = "[ns] «Мика? Это я.»"
34030-60 = ""
34030-61 = "О, Сенсей. Тс-с."
34030-62 = ""
34030-64 = ""
34030-65 = "[ns5] «...?»\n[ns6] «Это музыка?»"
34030-66 = ""
34030-67 = ""
34030-69 = ""
34030-70 = "Прости, что заставила ждать. Нужно было дослушать службу. Её по телевизору транслируют, видишь?"
34030-71 = "Не кажется жестоким, что меня всё ещё заставляют ходить на занятия, даже пока я в тюрьме?"
34030-72 = "Я думала, хотя бы от этого избавлюсь."
34030-73 = "[s] «Но музыка была красивой.»"
34030-74 = "Правда так думаешь? По-моему, скучновато. Просто одна странная строчка повторяется снова и снова: «помилуй нас»."
34030-75 = "Kyrie Eleison... Даже название скучное. Зачем молить какого-то типа наверху, если я даже не знаю, существует ли он?"
34030-76 = "И вообще просить жалости выглядит слабостью."
34030-77 = "Но мелодия красивая, это признаю! У нас просто идеологические разногласия."
34030-78 = "О, точно! Ты же никогда не слышал, как я пою, да, Сенсей? Хочешь выступление?"
34030-79 = "Обычно бесплатно не пою, но для тебя сделаю исключение!"
34030-80 = "Как в сказках, где запертая принцесса поёт любимому с высокой башни!"
34030-81 = "[s] «Только мы в тюрьме, а не в башне.»"
34030-82 = "И вот я с размаху возвращаюсь в суровую реальность."
34030-83 = ""
34030-85 = ""
34030-86 = "...Так что привело тебя в моё скромное жилище, Сенсей?"
34030-87 = "[s7] «Я слышал о ситуации, Мика.»\n[s8] «Почему ты не хочешь идти на слушание? Нагиса переживает.»"
34030-88 = "..."
34030-89 = "..."
34030-90 = "Как там Наги? Держится?"
34030-91 = "Лидеры Сестринства и Рыцарей спасения явились без приглашения?"
34030-92 = "Не удивлена. Недостаток власти как вакуум. Когда положение Чаепития слабеет, меньшие силы вокруг начинают втягиваться внутрь."
34030-93 = "Уверена, она не ожидала, что они настолько прямо выступят против Чаепития."
34030-94 = "Бедная Наги. Живот опять болит? У неё всегда болит живот, когда она нервничает."
34030-95 = "[s] «Больше всего она переживает за твою безопасность. Я видел толпу по дороге сюда.»"
34030-96 = "А... Видел..."
34030-97 = "Ну а что делать? Мне никогда особо не было дела до того, что обо мне думают другие."
34030-98 = "Наги думает, что сможет защитить меня, если я просто приду на слушание, но мы обе знаем, насколько она наивна."
34030-99 = "Инцидент с Эдемским договором серьёзно ударил по авторитету Чаепития."
34030-100 = "Чем меньше доверия общества, тем меньше его политическая сила. Очевидно, это моя вина."
34030-101 = "И если она правда продолжит защищать меня в таких условиях..."
34030-102 = "...под угрозой окажется и Чаепитие, и позиции Наги с Сэей."
34030-103 = "Они не должны рисковать этим ради меня."
34030-104 = "Я и так слишком дорого им обошлась."
34030-105 = "[s9] «Если не придёшь, тебя исключат.»\n[s10] «Я слышал о твоей комнате. И вещах.»"
34030-108 = "..."
34030-109 = "[s] «По-моему, они заходят слишком далеко.»"
34030-110 = "Т-Ты правда так думаешь?"
34030-111 = "В этот раз я облажалась далеко не чуть-чуть. Даже если меня исключат..."
34030-112 = "...Д-Даже если они сожгли драгоценные памятные вещи из нашего с Наги детства..."
34030-113 = "...Ничто из этого не отменяет того, что я сделала. И... Сэя всё ещё меня ненавидит..."
34030-114 = "[s11] «Нет, Сэя никогда не смогла бы тебя ненавидеть.»\n[s12] «Сэя уже тебя простила.»"
34030-115 = "Нет, ты не понимаешь. Я несколько раз пыталась извиниться, но она..."
34030-116 = "Нет, ты не понимаешь. Я несколько раз пыталась извиниться, но она..."
34030-117 = "В последний раз..."
34030-119 = ""
34030-120 = "Привет, Сэя! Как всегда серьёзная! Опять поздно легла? Тебе нужно лучше заботиться о коже. Вот, можешь пользоваться моим лосьоном!"
34030-121 = "..."
34030-122 = "С-Сэя?"
34030-123 = "Так, эм... Вообще-то я хотела спросить..."
34030-124 = "Может, пообедаем вместе? Правда, в тюрьме в меню только рулеты."
34030-125 = "Наги реально злая! Серьёзно? Одни рулеты?"
34030-126 = "Мика..."
34030-127 = "Д-Да?"
34030-128 = "Прости, но у меня нет времени."
34030-129 = "О-О...? Точно! Прости! Ты, наверное, очень занята!"
34030-130 = "Мне нехорошо. Я возвращаюсь в комнату."
34030-131 = ""
34030-133 = ""
34030-134 = ""
34030-135 = ""
34030-137 = "[ns] «Сэя...»"
34030-138 = "..."
34030-139 = "Сэя полностью закрылась от всех. Не выходит, и к ней никто не заходит."
34030-140 = "Она всегда была слабенькой, но в последнее время действительно сильно болеет."
34030-141 = "И я постоянно слышу всякое... Например, что из комнаты слышат её плач..."
34030-142 = "Я не всегда понимаю, о чём Сэя думает или что говорит, но..."
34030-143 = "Я вижу, что она не хочет мириться."
34030-144 = "[s13] «Наверняка это недоразумение.»\n[s14] «Обещаю, Сэя правда тебя не винит.»"
34030-145 = "Ох, Сенсей. Спасибо, что пытаешься меня утешить. Я уже приняла последствия..."
34030-146 = "Ох, Сенсей. Спасибо, что пытаешься меня утешить. Я уже приняла последствия..."
34030-147 = "Я просто хотела бы нормально перед ней извиниться."
34030-148 = "Но не хочу лишний раз её тревожить и ухудшить здоровье..."
34030-149 = "Не знаю, что со мной будет, если с Сэей случится ещё что-нибудь."
34030-150 = "[s] «Я сам схожу и проверю, как она.»"
34030-151 = "С-Серьёзно?"
34030-152 = "[s] «Конечно. Я хочу, чтобы у тебя была возможность извиниться.»"
34030-153 = "...!"
34030-154 = "[s15] «А потом ты, я, Нагиса и Сэя вместе пойдём на слушание!»\n[s16] «И мы втроём будем поддерживать тебя на слушании!»"
34030-155 = "..."
34030-156 = "..."
34030-157 = "Ч-Что вы говорите, Сенсей?"
34030-158 = "Я не заслуживаю вашей помощи или прощения."
34030-159 = "Я правда поклялась больше никогда не плакать. Почему вы так добры ко мне?"
34030-160 = "Ну..."
34030-161 = ""
34030-163 = ""
34030-164 = "Вы победили, Сенсей."
34030-165 = "Раз уж настаиваете, придётся согласиться. Пора встретиться с последствиями."
34030-166 = "[s] «Я горжусь тобой, Мика. Правда.»"
34030-167 = "..."
34030-168 = "Я никогда особо не верила в судьбу... и давно отказалась от мысли о втором шансе."
34030-169 = "Хи-хи. Может, я и правда принцесса, запертая в башне?"
34030-170 = ""
34030-172 = ""
34030-173 = "В-Вы этого не слышали, Сенсей!"
34030-174 = "Тогда позаботьтесь о Сэе... Сенсей."
34030-176 = "[ns] Пойти в комнату Сэи."
34030-181 = "Лазарет Сэи"
34030-182 = ""
34030-183 = "Сенсей? Это вы?"
34030-184 = "[s] «Сэя, ты такая бледная! Что случилось?»"
34030-185 = "Хм? Вы... живы? Как это...? Это сон? Сенсей, я... я проснулась?"
34030-186 = "[s] «Что ты имеешь в виду...?»"
34030-187 = "..."
34030-188 = "Ох, простите. Я ещё не до конца проснулась."
34030-189 = "Совсем забыла. Вы должны были сегодня прийти в Тринити."
34030-190 = "Ещё раз простите. Граница между снами и реальностью в последнее время совсем размылась."
34030-191 = "Прошлое, настоящее и будущее перепутались."
34030-192 = "Ах, я просто болтаю."
34030-193 = "[s] «Все за тебя переживают. Что происходит?»"
34030-194 = "Правда?"
34030-195 = "Похоже, скрывать больше не получится... Мне нехорошо."
34030-196 = "Если я расскажу вам, никто другой не должен узнать, хорошо?"
34030-197 = "...Я пытаюсь решить невозможную проблему."
34030-198 = "[s] «Хорошо, я слушаю.»"
34030-199 = "Это не похоже ни на что из того, что мы с вами когда-либо переживали."
34030-200 = "Пожалуйста, внимательно выслушайте мои слова."
34030-201 = "[s] «Обещаю.»"
34030-202 = "Некоторое время назад мне приснился... сон."
34030-203 = "Как вы знаете, мои сны часто предсказывают будущее, будто я попадаю в кусочек реальности, которой суждено случиться."
34030-204 = "Такие сны мне снятся часто, но этот потряс меня до глубины души."
34030-205 = "Сенсей, я видела падение Кивотоса."
34030-207 = "Следующий эпизод;Между сном и миражом"
