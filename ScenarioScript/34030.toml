[translation]
34030-1 = "Episódio 3;A princesa na jaula"
34030-2 = "Desde o incidente do Tratado do Éden, a situação na Escola Geral Trinity ficou bastante complicada."
34030-3 = "Em especial, a opinião pública sobre a Mika-san piorou drasticamente..."
34030-4 = "A Mika-san já foi expulsa da facção Pater, à qual pertencia, e já está decidido que ela também terá seu cargo na Tea Party revogado na audiência de amanhã."
34030-5 = "Independentemente das circunstâncias ou da verdade... a Mika-san é a principal responsável por ter conspirado com a Filial Arius e causado o incidente do Tratado do Éden."
34030-6 = "[s] \"...!!\""
34030-7 = "Mesmo antes da audiência acontecer, já ocorreram vários tumultos exigindo a condenação dela, e até surgiram alunas atirando pedras na jaula onde a Mika-san está para tentar fazer justiça com as próprias mãos..."
34030-8 = "Os murais da escola foram inundados de mensagens condenando a Mika-san... e a facção Pater passou a receber olhares frios só porque ela fazia parte dela..."
34030-9 = "Os livros e pertences que a Mika-san usava foram confiscados, e as roupas e acessórios que ela colecionava com tanto carinho foram incinerados..."
34030-10 = "[s] \"Não sabia que tinha chegado a esse ponto...\""
34030-11 = "...O Comitê de Justiça está contendo os excessos, mas é quase impossível dissipar esse clima que se espalhou por toda a escola."
34030-12 = "[s1] \"...\"\n[s2] \"Entendo...\""
34030-13 = "...A Mika-san se tornou uma inimiga pública em Trinity."
34030-14 = "...A Mika-san se tornou uma inimiga pública em Trinity."
34030-15 = "Seria fácil descartar tudo isso dizendo que é apenas a punição que a Mika-san merece sofrer, mas..."
34030-16 = "...Ainda assim, eu quero defender a Mika-san. Pois ela já está pagando um preço muito maior do que o pecado que cometeu."
34030-17 = "[s3] \"Tem razão... Eu também vou ajudar.\"\n[s4] \"Tem alguma coisa que eu possa fazer?\""
34030-18 = "...Sim, muito obrigada, Sensei. Porém..."
34030-19 = "...Sim, muito obrigada, Sensei. Porém..."
34030-20 = "Parece que a própria Mika-san... não tem nenhuma intenção de se defender..."
34030-21 = "[s] \"A Mika...?\""
34030-22 = "A Mika-san pretende faltar à audiência. E uma audiência realizada nessas condições... sem dúvida levará diretamente à expulsão dela."
34030-23 = "Mas... eu não consegui convencê-la a comparecer..."
34030-24 = "Talvez a Seia-san conseguisse, mas... no momento, ela não está em condições para isso."
34030-28 = "...Por isso, eu gostaria de lhe pedir um favor."
34030-29 = "[s] \"Certo... Eu vou me encontrar com a Mika e tentar convencê-la.\""
34030-33 = "Muito obrigada. Se forem as suas palavras, Sensei, tenho certeza de que..."
34030-34 = "Além disso, parece que a Mika-san está esperando por você, Sensei..."
34030-35 = "...Ufa."
34030-36 = "Fiquei um pouco mais aliviada. Embora nada tenha sido resolvido ainda..."
34030-37 = "[s] \"E você, Nagisa, está bem...?\""
34030-38 = "Eu...? Ah..."
34030-39 = "Eu estou bem... Tudo está como sempre."
34030-40 = "...Fufu, só mesmo você para se preocupar comigo, Sensei. Muito obrigada."
34030-41 = "Bem, então... deixo o resto em suas mãos."
34030-43 = "Ao me despedir da Nagisa e ir ao encontro da Mika..."
34030-46 = "Arrastem para fora a traidora que tentou fazer mal à Seia-sama!"
34030-47 = "É imperdoável que uma criminosa que se juntou a Arius e arruinou o Tratado do Éden faça parte da Tea Party!"
34030-48 = "Punição para a pecadora! Condenação!"
34030-50 = "P-Pessoal! Por favor, não ultrapassem esta linha!"
34030-51 = "Punição para a traidora!! Que ela pague o preço por ter nos enganado!!"
34030-55 = "[ns] (O clima está muito pesado...)"
34030-58 = "Jaula onde Mika está presa"
34030-59 = "[ns] \"Mika...?\""
34030-61 = "Shh."
34030-65 = "[ns5] \"...?\"\n[ns6] (...Dá para ouvir uma música baixinha ao fundo.)"
34030-70 = "...Desculpa a demora. Era a hora do culto. Hoje é dia de ouvir hinos."
34030-71 = "Não acha meio cruel me obrigarem a participar do culto até mesmo aqui?"
34030-72 = "Bem que podiam fazer vista grossa pelo menos numa hora dessas, né?"
34030-73 = "[s] \"Mas é uma bela música.\""
34030-74 = "Acha mesmo? Não é meio entediante de ouvir? Fica repetindo \"tende piedade\" ou \"misericórdia\"—"
34030-75 = "Kyrie eleison... não gosto nem do nome. Por que a gente tem que se agarrar a uma existência que nem sequer pode ver?"
34030-76 = "Ficar dizendo \"tende piedade de nós\" só faz a gente parecer patética. Isso não é coisa que se faça nem consigo mesma, nem com os outros."
34030-77 = "Mas eu gosto de cantar! Só a letra que é meio duvidosa."
34030-78 = "Ah, é mesmo, Sensei. Você nunca me ouviu cantar, né?"
34030-79 = "Normalmente eu não cantaria de graça, mas para você eu abro uma exceção, sabe? Afinal, você veio até aqui me ver!"
34030-80 = "Uma princesa aprisionada na torre cantando uma serenata para a pessoa destinada a ela. Que tal? Parece até cena de conto de fadas, né?!"
34030-81 = "[s] \"Não é uma torre, é uma jaula.\""
34030-82 = "Uwaa, precisava me puxar de volta pra realidade desse jeito...? Bom, é a verdade, né."
34030-86 = "...E então, o que traz você aqui hoje, Sensei?"
34030-87 = "[s7]  \"Já me contaram toda a situação, Mika.\"\n[s8]  \"Soube que pretende faltar à audiência. A Nagisa está preocupada.\""
34030-88 = "..."
34030-89 = "..."
34030-90 = "A Nagi-chan está bem, né? ...Uhum, que bom."
34030-91 = "Provavelmente a Irmandade e a Capitã das Cavaleiras Socorristas estavam lá do lado da Nagi-chan, não estavam?"
34030-92 = "...Imaginei. Quanto mais a posição da Tea Party fica ameaçada, mais as outras facções ganham espaço."
34030-93 = "Só não achei que fossem pressionar a Tea Party de forma tão direta assim..."
34030-94 = "...O estresse da Nagi-chan deve estar horrível."
34030-95 = "[s] \"Pois é... Aliás, vi a multidão na praça quando estava vindo para cá.\""
34030-96 = "Ah... uhum, entendi."
34030-97 = "...Bom, a minha situação atual é essa que você viu. Não tem jeito, né?"
34030-98 = "A Nagi-chan parece achar que tudo vai se resolver bem se eu comparecer à audiência, mas... Trinity não é tão bondosa assim."
34030-99 = "...Desde aquele incidente, a autoridade da Tea Party caiu por terra."
34030-100 = "Tanto a opinião pública dentro da escola quanto a nossa posição política... Mas é natural, né? Depois de eu ter feito uma coisa daquelas."
34030-101 = "Com tudo em frangalhos desse jeito, quanto mais a Nagi-chan tentar me proteger..."
34030-102 = "Mais a posição da \"Tea Party\"... não só a da Nagi-chan, mas até a da Seia-chan vai acabar correndo perigo."
34030-103 = "Eu não quero que isso aconteça por causa de alguém como eu."
34030-104 = "Porque tudo isso é o preço que eu tenho que pagar."
34030-105 = "[s9]  \"Mas disseram que você pode acabar sendo expulsa...\"\n[s10] \"Além disso, você já passou por tanta coisa até agora, Mika...\""
34030-108 = "..."
34030-109 = "[s] \"Você já não pagou um preço alto o suficiente?\""
34030-110 = "M-Mas..."
34030-111 = "...Mesmo assim, a culpa é minha."
34030-112 = "Os tesouros preciosos, cheios de lembranças que juntei com a Nagi-chan, parecem ter sido todos queimados, mas..."
34030-113 = "Ainda assim, eu não posso ser perdoada... A Seia-chan ainda guarda rancor de mim..."
34030-114 = "[s11] \"A Seia não guarda rancor de você, Mika. Eu garanto.\"\n[s12] \"A Seia já perdoou você, Mika.\""
34030-115 = "...N-Não! Isso não é verdade... Afinal, eu tentei pedir desculpas várias vezes, mas não adiantou..."
34030-116 = "...N-Não! Isso não é verdade... Afinal, eu tentei pedir desculpas várias vezes, mas não adiantou..."
34030-117 = "Até mesmo outro dia, quando nos encontramos..."
34030-120 = "Seia-chan, você não está com uma cara muito boa hoje de novo. Não conseguiu dormir? Sua pele também está toda ressecada, sabia? Quer que eu te empreste um creme hidratante?"
34030-121 = "..."
34030-122 = "Hmm, Seia-chan...?"
34030-123 = "...Olha, se você não se importar, hum..."
34030-124 = "Que tal a gente comer alguma coisa juntas? Bom, digo comer, mas é só rocambole aqui dentro da jaula!"
34030-125 = "Francamente, a Nagi-chan também é muito rancorosa, né? Fazer todas as minhas três refeições serem só rocambole!"
34030-126 = "...Mika."
34030-127 = "U-Uhum? Quer comer?"
34030-128 = "Perdoe-me, mas agora..."
34030-129 = "Ah... É-É mesmo, né? Como eu imaginava, hum..."
34030-130 = "Não estou me sentindo muito bem... Sinto muito, mas vou voltar para o meu quarto."
34030-137 = "[ns] \"A Seia disse isso...?\""
34030-138 = "..."
34030-139 = "Ultimamente, a Seia-chan não sai do quarto e parece que não está deixando ninguém entrar lá..."
34030-140 = "Há até boatos de que ela está acamada... Afinal, a Seia-chan sempre teve a saúde frágil."
34030-141 = "Além disso, só tenho ouvido outros boatos ruins... como terem escutado soluços de choro vindo do quarto da Seia-chan..."
34030-142 = "As palavras da Seia-chan são sempre difíceis de entender, mas..."
34030-143 = "Provavelmente eu não fui perdoada..."
34030-144 = "[s13] \"A Seia disse com todas as letras que perdoava você, Mika.\"\n[s14] \"Não será apenas algum mal-entendido?\""
34030-145 = "...Obrigada, Sensei. Mas, sabe, eu não me importo se a Seia-chan guardar rancor de mim..."
34030-146 = "...Obrigada, Sensei. Mas, sabe, eu não me importo se a Seia-chan guardar rancor de mim..."
34030-147 = "Porque eu ainda nem consegui pedir desculpas direito para a Seia-chan..."
34030-148 = "E, nessa situação, se a saúde da Seia-chan piorar ainda mais por minha causa..."
34030-149 = "Se a Seia-chan acabar se esforçando além da conta de novo... eu... acho que jamais vou conseguir me perdoar..."
34030-150 = "[s] \"Eu vou falar com a Seia.\""
34030-151 = "V-Você, Sensei...?"
34030-152 = "[s] \"Para que você possa pedir desculpas direito para a Seia.\""
34030-153 = "...!"
34030-154 = "[s15] \"E depois... eu, a Nagisa, a Seia e você, Mika, todos juntos,\"\n[s16] \"vamos comparecer à audiência de amanhã!\""
34030-155 = "..."
34030-156 = "..."
34030-157 = "...E-Espera um pouco. Por que você..."
34030-158 = "S-Será que eu valho tanto esforço assim...?"
34030-159 = "Eu... eu jurei que nunca mais ia chorar, então por que..."
34030-160 = "...Por que você me diz uma coisa dessas?"
34030-164 = "...Uhum, está bem."
34030-165 = "Se você diz isso a esse ponto... eu vou para a audiência junto com todo mundo."
34030-166 = "[s] \"Isso. Obrigado por tomar essa decisão, Mika.\""
34030-167 = "..."
34030-168 = "...Para ser sincera, eu achei que nunca teria uma segunda chance... Mas, se esse é o destino..."
34030-169 = "Será que, no fim das contas, eu era mesmo uma princesa presa na torre...?"
34030-173 = "Ah... N-Não é nada, Sensei!"
34030-174 = "Bom, então cuida da Seia-chan por mim... conto com você, Sensei."
34030-176 = "[ns] Vou até o quarto da Seia."
34030-181 = "Enfermaria da Seia"
34030-183 = "...Sensei?"
34030-184 = "[s] \"Você está bem, Seia? Está completamente pálida.\""
34030-185 = "Sensei... Você está a salvo, então? Não, talvez seja apenas um sonho conveniente da minha parte. Uma ilusão, uma ficção, ou talvez ambos sejam a mesma coisa, mas..."
34030-186 = "[s] \"O-O que aconteceu...?\""
34030-187 = "..."
34030-188 = "Não, parece que me enganei... Esses olhos—"
34030-189 = "...Entendo. Hoje era o dia em que você visitaria Trinity, não é?"
34030-190 = "Perdoe-me. Ultimamente, a fronteira entre o sonho e a realidade tem estado mais turva do que nunca para mim..."
34030-191 = "Presente, passado, futuro... todos eles me envolvem incessantemente, a ponto de tornar incerto até mesmo o lugar onde estou pisando agora."
34030-192 = "Bem, em suma, não é nada com que precise se preocupar... Pode encarar dessa forma."
34030-193 = "[s] \"Todo mundo está preocupado. O que houve?\""
34030-194 = "...Entendo."
34030-195 = "Responder com precisão à pergunta do que houve é difícil... Mas, se há uma coisa que posso dizer..."
34030-196 = "É que agora tenho em mãos um futuro que não pode ser revelado a ninguém. Contudo, Sensei, se for para você..."
34030-197 = "...Poderia dar ouvidos às minhas palavras?"
34030-198 = "[s] \"Sim, é claro.\""
34030-199 = "O que direi a seguir é de uma natureza completamente distinta... algo totalmente diferente de todos os incidentes que você já vivenciou até hoje."
34030-200 = "Mas, por favor... mesmo que pareça absurdo, peço que me escute."
34030-201 = "[s] \"...Entendido.\""
34030-202 = "...Há alguns dias, o mensageiro dos sonhos veio me anunciar."
34030-203 = "Foi algo do tipo que se chamaria de \"sonho profético\" — em outras palavras, um vislumbre de um futuro que há de chegar algum dia... É claro que isso, por si só, é apenas um dos mundos que costumo enxergar."
34030-204 = "No entanto, apenas naquele dia, as coisas foram diferentes. Sim, naquele dia eu—"
34030-205 = "...Eu vi a cena do mundo, de Kivotos, chegando ao seu fim."
34030-207 = "Próximo;Entre o sonho e a miragem"
