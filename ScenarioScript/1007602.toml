[translation]
1007602-1 = "Чирлидер Котори"
1007602-2 = "Рано утром, ещё до начала мероприятий, я проверял оборудование на пустом стадионе."
1007602-3 = ""
1007602-9 = "Сенсей!"
1007602-10 = "Простите, что заставила вас ждать! Я пришла так быстро, как только смогла!"
1007602-11 = "[s1] «Всё нормально. Я не против тебя подождать.»\n[s2] «Какая же ты прилежная по утрам, Котори.»"
1007602-14 = "Я?! Большое спасибо, Сенсей! А-ха... Хи-хи..."
1007602-15 = "К-Когда день начнётся по-настоящему, вы ведь будете ужасно заняты, да? Я подумала, что лучше найти вас, пока ещё тихо."
1007602-16 = "Зачем? Не могу поверить, что вы не знаете, Сенсей! Это обязательная практика для хорошего начала дня!"
1007602-17 = "Утренняя разминка!"
1007602-18 = ""
1007602-20 = ""
1007602-21 = "О. Какая-то совсем вялая реакция. Неужели... Вы уже сделали утреннюю разминку?!"
1007602-22 = "Н-Не сделали? Слава богу!"
1007602-23 = "Даже если вы не спортсмен, сегодня у вас куча обязанностей! Разогреть тело точно будет полезно, обещаю!"
1007602-24 = "...А? Простите?"
1007602-25 = "Обязательно ли это делать...? Если не хотите получить травму... потянуть мышцу... или порвать связку... Тогда да! Абсолютно! Обязательно!"
1007602-26 = "...О!"
1007602-27 = "Чтобы вы знали, растяжка — это упражнение, при котором группы мышц и суставы намеренно напрягают и расслабляют, повышая их устойчивость. О её пользе впервые заговорили в научной работе по спортивной физиологии—"
1007602-28 = "[s3] «Х-Хорошо! Давай потянемся! Да!»\n[s4] «Давай начнём прямо сейчас! Ура!»"
1007602-31 = "Вот это настрой! Как и ожидалось от вас, Сенсей!"
1007602-32 = "Но даже перед простой растяжкой нужно сперва правильно изучить технику."
1007602-33 = "Поэтому я подготовилась! Я запомнила несколько полезных движений и упражнений, так что вам не придётся, Сенсей!"
1007602-34 = "Хорошо, я покажу, а вы повторяйте за мной!"
1007602-35 = "Первое! Это упражнение растягивает всё тело!"
1007602-36 = "Поднимите одну ногу вот так..."
1007602-37 = "А потом... вот так... дальше..."
1007602-38 = ""
1007602-40 = ""
1007602-41 = "В-Вот... так...?"
1007602-42 = ""
1007602-44 = ""
1007602-45 = ""
1007602-46 = "[ns5] «...Котори?»\n[ns6] «(Что она вообще делает...?)»"
1007602-49 = "А? Погодите... Нет... Что...?"
1007602-50 = "Нет, сначала надо вот так, а потом..."
1007602-51 = "...А-а?!"
1007602-54 = "― [log=코토리 응원단ND]Погодите, что...?[/log][wa:2060]"
1007602-56 = "― [log=코토리 응원단ND]Эм, хм... Руку нужно тянуть вот сюда...?[/log][wa:5320]"
1007602-59 = "― [log=코토리 응원단ND]Не может быть...![/log][wa:1300]"
1007602-61 = "― [log=코토리 응원단ND]А если я просто напрягу эту мышцу вот так!?[/log][wa:820]"
1007602-64 = "― [log=코토리 응원단ND]Ииик!?[/log]"
1007602-66 = "― [log=코토리 응원단ND]А-Ай, ай, ай, ай![/log][wa:440]"
1007602-69 = "[ns7] «Не перенапрягайся, Котори! Ещё травму получишь!»\n[ns8] «Просто расслабься. В растяжке нельзя делать через силу!»"
1007602-72 = "― [log=코토리 응원단ND]В-Всё должно было быть не так...![/log][wa:60]"
1007602-74 = "― [log=코토리 응원단ND]Я делаю движения точно так, как запомнила...![/log][wa:100]"
1007602-77 = "― [log=코토리 응원단ND]Я понимаю, что у тела каждого есть свои пределы, но...[/log][wa:180]"
1007602-79 = "― [log=코토리 응원단ND]Я не знала, что мой предел настолько низкий...[/log][wa:10]"
1007602-82 = "― [log=코토리 응원단ND]Е-Ещё одна попытка...[/log][wa:2280]"
1007602-84 = "― [log=코토리 응원단ND]А, аааа! Ай, ай! Больно![/log][wa:2340]"
1007602-87 = "― [log=코토리 응원단ND]К-Кажется, больше не могу...[/log][wa:1580]"
1007602-89 = "― [log=코토리 응원단ND]Уф... Э-Эм... Сенсей, это...[/log][wa:7290]"
1007602-92 = "― [log=코토리 응원단ND]Я представляла всё совсем...[/log][wa:1720]"
1007602-94 = "― [log=코토리 응원단ND]не так...[/log]"
1007602-97 = "― [log=코토리 응원단ND]В итоге я только выставила себя дурочкой...[/log][wa:3080]"
1007602-99 = "― [log=코토리 응원단ND]*шмыг*[/log][wa:220]"
1007602-102 = ""
1007602-103 = "Простите, Сенсей. Всё пошло совсем не так, как я планировала..."
1007602-104 = "Так я вам совсем не помогу! Я только трачу ваше время."
1007602-105 = "[s9] Помочь Котори, медленно надавив ей на спину.\n[s10] «Я помогу. Просто расслабься и выдохни.»"
1007602-108 = "С-Сенсей...?! Что вы...?!"
1007602-109 = "Я-Я не знаю почему, но мне внезапно стало ужасно неловко...!"
1007602-110 = "...Хм?"
1007602-111 = "Растяжку обычно делают вместе, в группе? Особенно новичкам?"
1007602-112 = "П-Правда? Я даже не рассматривала такой вариант!"
1007602-113 = "Т-Тогда...!"
1007602-114 = "Тогда рассчитываю на вас!"
1007602-116 = "Мы с Котори вместе сделали утреннюю растяжку, помогая друг другу с более сложными движениями, когда это требовалось."
1007602-117 = "Когда закончили, мои затёкшие мышцы расслабились и оставались такими весь остаток напряжённого дня."
