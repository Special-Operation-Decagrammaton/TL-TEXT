[translation]
13130-1 = "Episódio 13;Refém"
13130-9 = "...Voltei."
13130-13 = "Bem-vinda de volta, Shiroko-senpai."
13130-14 = "...Ah, fecha a porta direito. Tá entrando vento."
13130-15 = "D-Desculpa."
13130-20 = "Bem-vinda de volta, senpai."
13130-21 = "Ah, é verdade.#nJá que tá aí, acende a luz também?"
13130-23 = "T-Tá bom."
13130-27 = "Poxa, Serika-chan. Se ficar explorando a sua senpai desse jeito,#num dia desses você vai acabar levando um castigo, viu?"
13130-28 = "Q-Quê—"
13130-29 = "Vocês também ficaram com preguiça e ninguém quis levantar pra acender a luz!"
13130-34 = "...E então, como está o Sensei?"
13130-36 = "Não temos nenhuma informação detalhada..."
13130-37 = "Parece que o levaram pro hospital e ele não corre risco de vida.#nMas disseram que ainda não acordou."
13130-39 = "Hmm..."
13130-41 = "Ter se envolvido num acidente daqueles e não ter nem um arranhão#njá foi uma sorte no meio do azar, né."
13130-42 = "Pelo menos podemos ficar aliviadas por enquanto."
13130-44 = "...Mas parece que não vamos poder contar com a ajuda do Sensei."
13130-50 = "Precisamos dar um jeito de encontrar uma solução.#nPrimeiro continuar o contrato, e depois o Canhão Ferroviário..."
13130-52 = "...Que tal pedirmos a cooperação de outras academias?"
13130-54 = "Sem o Sensei, acho que vai ser difícil, né..."
13130-55 = "...Considerando a distância até a antiga sede, é melhor já irmos saindo."
13130-59 = "..."
13130-60 = "Haah... Não tem jeito, vamos ter que ir."
13130-64 = "A propósito, cadê a Nonomi?"
13130-65 = "A senpai disse que tinha um compromisso e saiu."
13130-66 = "...Quando será que ela volta?"
13130-68 = "Tô um pouco preocupada..."
13130-77 = "Senhor Mordomo... Como o senhor instruiu, vim sem contar nada para as outras."
13130-84 = "Parece que sim."
13130-90 = "Eu a segui desde a escola, não há dúvida."
13130-91 = "...Você!#nOnde está o senhor Mordomo?!"
13130-96 = "...Estou bem aqui, senhorita."
13130-97 = "Mas confesso que não esperava que a senhorita viesse até nós por conta própria."
13130-98 = "Isso é..."
13130-99 = "Por acaso mudou de ideia?"
13130-100 = "Decidiu se matricular na Highlander e retornar à Nephthys?"
13130-101 = "N-Não é isso!"
13130-105 = "Então, por que se deu ao trabalho de vir até aqui...?"
13130-106 = "Mesmo sem eu me tornar presidente do conselho estudantil da Highlander..."
13130-107 = "Deve haver uma forma de resolver o problema do Canhão Ferroviário.#n...Se for a Nephthys."
13130-108 = "..."
13130-109 = "A Nephthys tem uma relação de cooperação tanto com o fundo privado quanto com a Highlander, não tem?"
13130-110 = "Se reunirmos a força da empresa, com certeza..."
13130-116 = "Tanto o Conselho Estudantil de Abydos quanto o Comitê de Contramedidas são lugares insubstituíveis para mim."
13130-117 = "...Por favor, eu imploro."
13130-123 = "Esse é um pedido difícil."
13130-124 = "Querer obter tudo o que deseja sem pagar nenhum sacrifício..."
13130-125 = "...!"
13130-126 = "Senhorita, o mundo não é tão indulgente assim."
13130-127 = "Acha mesmo que fazer birra vai resolver alguma coisa?#nNão cresceu nada desde o ensino fundamental, não é?"
13130-128 = "Eu já lhe disse qual é a solução.#nBasta a senhorita se matricular na Highlander e tudo será resolvido."
13130-129 = "I-Isso..."
13130-130 = "Poderíamos até forçar a sua matrícula, mas...#nse possível, gostaríamos que fosse uma decisão de sua própria vontade."
13130-131 = "Contudo, não vou dizer que não exista outra alternativa."
13130-132 = "Q-Qual seria?!"
13130-133 = "...Se quer saber, não há algo que deveria dizer primeiro?"
13130-134 = "...!!"
13130-135 = "A senhorita faz ideia de quantas pessoas sofreram por causa dos prejuízos#nque causou ao se rebelar contra o Grupo Saint Nephthys?"
13130-137 = "De que adianta fazer alguém da própria família abaixar a cabeça?"
13130-138 = "Suou-san, não pedi a sua opinião.#nEste é um assunto da Nephthys."
13130-145 = "...Sim."
13130-146 = "...Eu sinto muito.#nPor ter causado problemas não só ao senhor Mordomo, mas a todos na Nephthys..."
13130-147 = "Sinto muito mesmo..."
13130-148 = "...Isso já basta.#nPeço desculpas também por ter falado de maneira tão rude."
13130-149 = "Pois bem, vou lhe contar o nosso plano."
13130-155 = "Nós pensamos da seguinte forma."
13130-156 = "Se o Comitê de Contramedidas descobrisse a existência do Canhão Ferroviário, jamais ficaria de braços cruzados."
13130-157 = "De algum modo, compareceriam à assembleia geral e solicitariam a continuação do contrato."
13130-158 = "...Mesmo que precisassem recorrer à ajuda da \"Schale\"."
13130-161 = "Nós também conhecemos bem o poder do Sensei."
13130-162 = "Afinal, mesmo na ausência de Takanashi Hoshino, a Kaiser PMC não foi páreo para ele."
13130-166 = "Por isso, presumimos que o fundo privado mobilizaria um grande número de soldados como contramedida."
13130-167 = "...Embora o Sensei provavelmente daria um jeito mesmo assim."
13130-170 = "Contudo, isso também fazia parte dos nossos planos."
13130-172 = "...Hã?!"
13130-173 = "Se a \"Schale\" e o \"fundo privado\" colidirem de frente, ambos sofrerão baixas inevitáveis."
13130-174 = "Nesse exato momento, a Nephthys entrará com suas forças#ne colherá os frutos enquanto os dois se desgastam."
13130-175 = "...Hã?!"
13130-176 = "E-Espere um segundo!#nA Nephthys e o fundo privado não estão cooperando entre si...?!"
13130-177 = "...De fachada, é exatamente como a senhorita disse."
13130-178 = "...!"
13130-179 = "D-Desde quando vocês planejam isso?!"
13130-180 = "Desde o princípio.#nAfinal, aquilo sempre foi propriedade nossa."
13130-181 = "Assim que colocarmos as mãos naquilo, o ressurgimento da Nephthys será acelerado."
13130-182 = "Na época nos causou um prejuízo tremendo, mas quem diria#nque acabaria se tornando uma mina de ouro..."
13130-186 = "De qualquer forma, quando será que o Sensei vai voltar?"
13130-187 = "Sem a ajuda da Schale, seria impossível para a senhorita chegar ao local da assembleia..."
13130-191 = "Estava preocupado que o plano pudesse sair dos trilhos, mas..."
13130-196 = "Quem diria que a senhorita viria até aqui tão ingenuamente."
13130-201 = "Você foi usada, senhorita."
13130-211 = "Aah...?!"
13130-215 = "(Senhor Mordomo...)"
13130-216 = "(Desde o começo, era isso que o senhor pretendia...)"
13130-222 = "Yume-senpai, por quê..."
13130-223 = "Onde você está, senpai...?#nPor favor... volta pra cá."
13130-224 = "Senpai, eu estava errada..."
13130-228 = "...Yume-senpai."
13130-230 = "(Ah...)"
13130-231 = "(Hoje também não conseguiu encontrá-la, não é...)"
13130-232 = "(Até quando ela vai continuar vagando por aquele deserto...?)"
13130-238 = "(Todos os dias, todos os dias...)"
13130-239 = "(Por que chegar a esse ponto...?)"
13130-240 = "(Se tivesse esquecido tudo e ido embora daqui...)"
13130-244 = "(Se tivesse fingido que tudo não passou de um sonho...)"
13130-245 = "(Não teria precisado sofrer tanto assim...)"
13130-246 = "(Por quê...?)"
13130-252 = "(Mas isso também vale para mim...)"
13130-253 = "(Se eu pudesse esquecer... se tudo não passasse de um sonho, teria sido tão melhor)"
13130-257 = "(Naquele dia, eu...)"
13130-261 = "...Hoshino-senpai."
13130-266 = "Bom trabalho, Suou-san.#nPor favor, recolha a carteirinha estudantil e o cartão da senhorita."
13130-267 = "...Aquilo de torná-la presidente do conselho estudantil da Highlander era mentira?"
13130-268 = "Mas é claro."
13130-269 = "A senhorita cumprirá um papel muito mais adequado do que o de presidente do conselho estudantil: o de refém."
13130-270 = "Ela não é, teoricamente, a herdeira da Nephthys?"
13130-271 = "Sim. Contudo, esta foi uma diretriz decidida pelo conselho administrativo.#nNaturalmente, não temos intenção de machucá-la."
13130-272 = "Pois bem, vou entrar em contato com o Comitê de Contramedidas e avisá-los para comparecerem à assembleia geral."
13130-273 = "E também que, caso não compareçam, a senhorita será transferida para a Highlander."
13130-275 = "...Tudo bem deixá-los continuar o contrato?"
13130-276 = "É o contrário."
13130-277 = "Faremos com que declarem que o \"Conselho Estudantil de Abydos\" nunca existiu de fato como organização.#nAssim, o contrato em si será invalidado e os direitos da ferrovia passarão para a Nephthys."
13130-279 = "...Entendi."
13130-280 = "Mesmo sem o Sensei da Schale,#nse dissermos que estamos com a senhorita, eles vão se esforçar o bastante."
13130-281 = "...Bem, pouco importa quem vença.#nQuem ficará de pé no final será a Nephthys."
13130-282 = "Ou seja, não importa o que aconteça, o Canhão Ferroviário vai acabar nas mãos da Nephthys."
13130-283 = "Exatamente. Agora, por favor, leve a senhorita."
13130-284 = "Vou entrar em contato com o Comitê de Contramedidas."
13130-294 = "Me desculpem, pessoal..."
13130-295 = "Cof, cof..."
13130-299 = "Desde o começo, eu nunca deveria ter ficado em Abydos."
13130-300 = "Não importa para onde eu vá, continuo sendo alguém da Nephthys."
13130-301 = "Alguém como eu, que veio para Abydos movida pela culpa, não tem o direito de ficar."
13130-302 = "Por favor, esqueçam que eu existo."
13130-303 = "Vocês não precisam apagar a presidente... nem o Conselho Estudantil de Abydos."
13130-304 = "Se for o Sensei, ele vai encontrar o Canhão Ferroviário e destruí-lo."
13130-313 = "...Foi isso que ela disse."
13130-314 = "Tudo o que o Comitê de Contramedidas precisa fazer na assembleia geral dos credores#né declarar que o Conselho Estudantil de Abydos era uma organização não reconhecida."
13130-315 = "Dessa forma, o contrato em si perderá a validade."
13130-316 = "A senhorita disse aquilo há pouco, mas...#nno fundo, ela com certeza deseja continuar ao lado de vocês."
13130-320 = "...Não resta muito tempo até a assembleia geral."
13130-321 = "Rezo para que façam uma escolha sábia."
13130-326 = "..."
13130-329 = "...Nonomi-senpai."
13130-330 = "N-Não pode ser..."
13130-331 = "Nonomi..."
13130-333 = "..."
13130-338 = "S-Senpai, onde você vai?!"
13130-339 = "...Pra assembleia geral."
13130-340 = "Vai fazer o que aquele mordomo mandou?!"
13130-341 = "Não quero perder mais ninguém importante pra mim."
13130-343 = "M-Mas, só nós..."
13130-344 = "É isso mesmo, Hoshino-senpai.#nVamos esperar o Sensei entrar em contato."
13130-346 = "...Vocês fiquem esperando aqui."
13130-351 = "Quê?!"
13130-353 = "Você vai sozinha?!#nCom tantos inimigos assim, não tem como vencer!"
13130-354 = "...Eu consigo vencer. Se for eu, consigo."
13130-355 = "...Depois de salvar a Nonomi, você pretende derrotar o fundo privado e a Nephthys, né?"
13130-356 = "..."
13130-357 = "Hã?!"
13130-358 = "Não precisam se preocupar com o que vier depois."
13130-359 = "O Comitê de Contramedidas não tem nenhuma responsabilidade nisso."
13130-360 = "O que você quer dizer com isso, senpai?!"
13130-361 = "Basta que só eu assuma a responsabilidade."
13130-362 = "Por isso, fiquem todas aqui."
13130-364 = "...!!"
13130-365 = "..."
13130-366 = "Quando você diz \"todas\", Hoshino-senpai, de quem está falando?"
13130-371 = "De todas do Comitê de Contramedidas.#nO verdadeiro conselho estudantil, reconhecido pela Schale."
13130-389 = "S-Shiroko-senpai?!"
13130-391 = "...Isso é perigoso, Shiroko-chan."
13130-396 = "Vamos lutar, senpai.#n...Vem comigo."
13130-402 = "Ei, Shiroko-senpai!"
13130-403 = "L-Lutar...?!"
13130-411 = "...Faz tempo que não temos um duelo, né."
13130-412 = "Este velhote aqui até ficou empolgado, apesar da idade."
13130-420 = "E-Esperem...!#nHoshino-senpai, Shiroko-senpai?!"
13130-421 = "Como isso foi acontecer..."
13130-422 = "S-Serika-chan..."
13130-423 = "Ah, que saco! Só nos resta ir atrás delas!"
13130-429 = "Próximo;Comitê de Contramedidas"
