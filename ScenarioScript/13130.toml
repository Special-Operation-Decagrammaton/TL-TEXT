[translation]
13130-1 = "Эпизод 13;Заложник"
13130-8 = ""
13130-9 = "Я вернулась."
13130-10 = ""
13130-12 = ""
13130-13 = "С возвращением, Широко."
13130-14 = "А, дверь за собой закроешь? Ветер задувает."
13130-15 = "Эм, да."
13130-16 = ""
13130-18 = ""
13130-20 = "С возвращением, Широко! Ты так быстро умылась и вернулась!"
13130-21 = "О, можешь ещё свет включить? Мне надо окончательно проснуться."
13130-23 = "Мм."
13130-24 = ""
13130-26 = ""
13130-27 = "Сэрика, ещё вляпаешься, если будешь так командовать Широко."
13130-28 = "Ч-Что?! Я вовсе не командовала!"
13130-29 = "Все иногда ленятся включать свет!"
13130-30 = ""
13130-32 = ""
13130-34 = "Эм... Есть новости о Сенсее?"
13130-36 = "Нет, пока ничего нового..."
13130-37 = "Мы знаем только, что Сенсей в больнице. Серьёзных травм нет, но он всё ещё не пришёл в сознание."
13130-39 = "Хм..."
13130-41 = "Полагаю, можно быть благодарными, что после такого ужасного происшествия он почти не пострадал..."
13130-42 = "Будто чудеса ходят за Сенсеем по пятам. Я рада, что с ним всё в порядке."
13130-44 = "Но пока придётся исходить из того, что помощи от Сенсея не будет."
13130-45 = ""
13130-48 = ""
13130-50 = "Нужно разобраться самим. Найти способ закрепить права на Железнодорожную пушку и сделать так, чтобы она никогда больше не сдвинулась с места."
13130-52 = "Можем попросить помощи у другой академии?"
13130-54 = "...Нет. Без Сенсея такое не провернуть."
13130-55 = "Да и времени нет. Если хотим успеть к собранию на Центральной станции, нужно выходить прямо сейчас."
13130-56 = ""
13130-59 = "..."
13130-60 = "Ах... Я морально к этому не готова..."
13130-61 = ""
13130-63 = ""
13130-64 = "Нономи не вижу. Куда она ушла?"
13130-65 = "А, она ненадолго вышла. Сказала, что нужно кое-что сделать."
13130-66 = "Но это было уже давно, разве нет? Она должна была вернуться."
13130-68 = "Хм. Что с ней? Не могу не волноваться..."
13130-76 = ""
13130-77 = "...Дворецкий? Я пришла одна, как обещала."
13130-78 = ""
13130-84 = "Подтверждаю."
13130-85 = ""
13130-87 = ""
13130-89 = ""
13130-90 = "Я проследила за вами после того, как вы покинули Абидос. За вами никто не шёл."
13130-91 = "Ты?! А где мой дворецкий?"
13130-92 = ""
13130-95 = ""
13130-96 = "Я здесь, госпожа."
13130-97 = "Ваш запрос меня удивил. Не думал, что вы сами со мной свяжетесь. Что-то произошло?"
13130-98 = "Но..."
13130-99 = "Может быть... вы передумали? Хотите вернуться в Хайлендер и стать председателем?"
13130-100 = "Наконец-то вы сделали правильный выбор! Тогда Нефтис без проблем получит полные права на Железнодорожную пушку."
13130-101 = "Нет! Я вовсе не это имела в виду... Я не уйду из Комитета по выплате долга!"
13130-102 = ""
13130-104 = ""
13130-105 = "Тогда что? Зачем всё это?"
13130-106 = "...Даже если я не стану председателем студсовета Хайлендер..."
13130-107 = "...у Нефтис наверняка есть какой-то способ решить вопрос с правами на Железнодорожную пушку."
13130-108 = "..."
13130-109 = "Нефтис состоит в фонде прямых инвестиций и сотрудничает с Хайлендер, значит... у них контрольная доля в фонде."
13130-110 = "Если Нефтис сосредоточит на этой проблеме всю свою силу и влияние, наверняка..."
13130-111 = ""
13130-114 = ""
13130-116 = "И Комитет по выплате долга, и студсовет Абидоса... для Широко и Хошино незаменимы и бесценны..."
13130-117 = "Пусть это всего лишь название, но если есть хоть какой-то способ защитить их... любой..."
13130-118 = ""
13130-121 = ""
13130-122 = ""
13130-123 = "...Ха... Ха-ха-ха! Госпожа, вы истинное воплощение наивности. Ваш взгляд на мир настолько поверхностен."
13130-124 = "Иными словами, вы хотите получить ровно то, что хотите, ничего не заплатив и ничем не пожертвовав."
13130-125 = "...!"
13130-126 = "Вы понимаете, госпожа? Бесплатного обеда не бывает. Всё строится на обмене. Одним упрямством ничего не решить."
13130-127 = "Вы правда думаете, что кто-то станет слушать эту чушь? Вы не понимаете, как устроен реальный мир! Совсем не изменились со средней школы."
13130-128 = "Я уже назвал решение. Вернитесь в академию Хайлендер. Тогда всё решится."
13130-129 = "Э-Это..."
13130-130 = "Знаете, я мог бы прямо сейчас насильно оформить ваше повторное зачисление, но не хочу так с вами поступать."
13130-131 = "Разумеется, есть решение, над которым мы работаем. Способ не дать Железнодорожной пушке попасть к фонду прямых инвестиций."
13130-132 = "К-Какой?!"
13130-133 = "Молите о прощении, госпожа."
13130-134 = "...!!"
13130-135 = "Извинитесь и попросите прощения за то, что бросили вызов Нефтис Group и причинили нам ущерб. Сделаете это — и я расскажу."
13130-137 = "...Эй."
13130-138 = "Не вмешивайся, Суо. Это важно."
13130-139 = ""
13130-141 = ""
13130-142 = ""
13130-144 = ""
13130-145 = "...Да. Поняла."
13130-146 = "Прошу прощения, Дворецкий... и все в Нефтис..."
13130-147 = "Мне жаль... за весь ущерб, который я причинила..."
13130-148 = "Хорошо, очень хорошо. Часть моего гнева наконец проходит."
13130-149 = "Пожалуй, этого достаточно. Теперь расскажу наш план."
13130-150 = ""
13130-153 = ""
13130-155 = "Наш первоначальный план был таким."
13130-156 = "Мы считали, что как только Комитет по выплате долга узнает о Железнодорожной пушке, он не сможет игнорировать ситуацию. Само её существование противоречит их убеждениям и ценностям."
13130-157 = "С помощью вечного союзника, Сенсея из Шале, они приложили бы все силы, чтобы попасть на общее собрание и сохранить договор."
13130-158 = "Как и тот председатель студсовета, они попытались бы удержать право Абидоса на пушку или вообще найти способ её уничтожить."
13130-161 = "Этот Сенсей... Мы видели масштаб его возможностей. Позволить такому варианту было бы... опасно."
13130-162 = "Комитет по выплате долга при поддержке Шале не смогла остановить даже ЧВК Кайзер. И всё это без Таканаши Хошино."
13130-165 = ""
13130-166 = "Поэтому фонд прямых инвестиций собрал в Абидосе огромное количество бойцов. Наверное, они решили, что даже могущественное Шале не прорвётся через такую силу..."
13130-167 = "Но Сенсей... и все вы, скорее всего, не остановились бы и перед этим."
13130-170 = "И именно... на это мы и рассчитывали."
13130-172 = "...Что?!"
13130-173 = "Нам неважно, кто победит. Главное, что столкновение Шале и фонда прямых инвестиций нанесёт огромные потери обеим сторонам."
13130-174 = "Пока две силы будут уничтожать друг друга, мы введём наших союзников и одним ударом ликвидируем и фонд, и Комитет по выплате долга."
13130-175 = "Что ты имеешь в виду?!"
13130-176 = "«Ваших союзников»...? Н-Но это значит...?!"
13130-177 = "Да. Наша конечная цель — устранить фонд прямых инвестиций и монополизировать Железнодорожную пушку."
13130-178 = "...!!!"
13130-179 = "Это... С самого начала был ваш план?!"
13130-180 = "Разумеется! Железнодорожная пушка изначально была нашей! Нашей! Мы никому её не отдадим!"
13130-181 = "С ней возрождение Нефтис ускорится минимум на десять лет."
13130-182 = "Кто бы мог подумать, что металлолом, который мы выбросили, считая себя обманутыми, на самом деле окажется рабочим...?"
13130-183 = ""
13130-185 = ""
13130-186 = "Однако..."
13130-187 = "Похоже, Сенсей ещё не вернулся в Абидос. Без помощи Шале Комитет по выплате долга не сможет успешно попасть на собрание."
13130-188 = ""
13130-190 = ""
13130-191 = "Я уже начал беспокоиться, что план разваливается... Хи-хи-хи."
13130-192 = ""
13130-195 = ""
13130-196 = "Хи-хи-хи... но я не думал, что вы вот так нам поможете."
13130-197 = ""
13130-199 = ""
13130-201 = "Вас использовали, госпожа."
13130-202 = ""
13130-204 = ""
13130-211 = "Ик...?!"
13130-212 = ""
13130-215 = "(Ах...)"
13130-216 = "(Вот как это было...)"
13130-220 = ""
13130-221 = ""
13130-222 = "Почему...? Юмэ, почему?"
13130-223 = "Где ты...? Прости... Пожалуйста... Пожалуйста..."
13130-224 = "Юмэ... *всхлип* Я... мне жаль... Я..."
13130-225 = ""
13130-227 = ""
13130-228 = "...Юмэ... *всхлип*..."
13130-230 = "(Ах...)"
13130-231 = "(Значит, сегодня ты снова не нашла то, что искала...)"
13130-232 = "(А завтра опять будешь бродить по этой пустоши...)"
13130-233 = ""
13130-238 = "(День за днём... ни разу не уставая... Почему...?)"
13130-239 = "(Почему...? Ради чего...?)"
13130-240 = "(Было бы лучше, если бы я просто всё забыла и покинула Абидос...)"
13130-241 = ""
13130-244 = "(Если бы я списала всё случившееся здесь на сон и забыла.)"
13130-245 = "(Тогда хотя бы не было бы боли...)"
13130-246 = "(Почему...?)"
13130-247 = ""
13130-252 = "(Почему... я решила остаться здесь...?)"
13130-253 = "(Да... Нужно было считать всё сном... позволить этому исчезнуть из памяти...)"
13130-254 = ""
13130-257 = "(Я...)"
13130-258 = ""
13130-261 = "Хошино..."
13130-262 = ""
13130-264 = ""
13130-265 = ""
13130-266 = "...Отличная работа, Суо. Забери студенческий билет госпожи и кредитную карту."
13130-267 = "...Предложение вернуться в Хайлендер и стать председателем было ложью?"
13130-268 = "Разумеется. Нам невыгодно ставить у власти человека, который отказывается выполнять приказы."
13130-269 = "Зато из неё выйдет отличный заложник."
13130-270 = "Наследница семьи... в качестве заложника...?"
13130-271 = "Да. Совет директоров одобрил этот план. Разумеется, причинять ей вред мы не собираемся."
13130-272 = "Теперь свяжемся с Комитетом по выплате долга и потребуем, чтобы они явились на общее собрание кредиторов."
13130-273 = "Если откажутся слушать, достаточно пригрозить переводом Нономи в академию Хайлендер."
13130-275 = "С какой целью? Вы ведь не хотите, чтобы они сохранили договор?"
13130-276 = "Разумеется нет. Наоборот."
13130-277 = "Мы заставим их признать, что студсовет Абидоса Кучинаши Юмэ и Таканаши Хошино был фиктивной организацией."
13130-279 = "Понятно."
13130-280 = "В любом случае без помощи Шале Комитет по выплате долга, скорее всего, не сможет добраться до собрания. Но это не помешает им сделать всё возможное ради возвращения Нономи."
13130-281 = "И чем больше хаоса они устроят, тем больше у нас возможностей полностью уничтожить фонд прямых инвестиций."
13130-282 = "А даже если им удастся прорвать блокаду фонда, их просто заставят отречься от прежнего студсовета, и Железнодорожная пушка окажется у вас. Довольно идеальный план."
13130-283 = "Тогда, пожалуйста, перевези Нономи в условленное место."
13130-284 = "А я свяжусь с Комитетом по выплате долга."
13130-285 = ""
13130-287 = ""
13130-288 = ""
13130-289 = ""
13130-294 = "*тршш* ...Прости, Хошино... Я... ошиблась..."
13130-295 = "*кашель* *кашель*... Широко... Аяне... Серика... *кашель* Хошино..."
13130-296 = ""
13130-299 = "С самого начала... мне вообще не следовало сюда приходить..."
13130-300 = "Я из Нефтис... одна из виновных..."
13130-301 = "Я осталась здесь лишь из чувства вины... так что неважно, если вернусь в Хайлендер..."
13130-302 = "Я лишь хочу, чтобы вы все могли жить без чувства вины... свободными."
13130-303 = "Пожалуйста, не отвергайте председателя Юмэ... и студсовет Абидоса как нечто фальшивое из-за меня..."
13130-304 = "Сенсей поможет, и вы найдёте способ уничтожить Железнодорожную пушку. Я верю в вас."
13130-305 = ""
13130-310 = ""
13130-311 = ""
13130-313 = "...Вот ваша нынешняя ситуация, Таканаши Хошино, Комитет по выплате долга."
13130-314 = "Найдите способ попасть на общее собрание кредиторов и признайте, что студсовет Абидоса был фиктивной организацией."
13130-315 = "Вы официально подтвердите, что вся деятельность студсовета Таканаши Хошино и Кучинаши Юмэ была несанкционированной."
13130-316 = "Только тогда Нономи позволят остаться с вами, а не отправят в подземную тюрьму Хайлендер."
13130-317 = ""
13130-319 = ""
13130-320 = "...Солнце встаёт. До собрания осталось совсем мало времени."
13130-321 = "Надеюсь, вы примете мудрое решение."
13130-322 = ""
13130-324 = ""
13130-326 = "..."
13130-328 = ""
13130-329 = "...Н-Нономи."
13130-330 = "Э-Это..."
13130-331 = "Нономи..."
13130-333 = "Хм. Значит, вот как всё складывается..."
13130-334 = ""
13130-336 = ""
13130-337 = ""
13130-338 = "Хошино?! Куда ты?"
13130-339 = "Мне нужно идти прямо сейчас. Если хотим вернуть Нономи, придётся сделать, как он сказал."
13130-340 = "Ч-Что?! Ты собираешься слушать этого урода?"
13130-341 = "Я не потеряю ещё одного дорогого человека. Я уже потеряла Юмэ... Если подведу и Нономи..."
13130-343 = "Н-Но против такой силы..."
13130-344 = "Она права. Нужно дождаться Сенсея. Он придёт помочь. Я знаю."
13130-346 = "Никого ждать не будем. Я пойду одна."
13130-347 = ""
13130-350 = ""
13130-351 = "Что?!"
13130-353 = "Что значит одна?! Ты собираешься сама прорваться через эту блокаду?!"
13130-354 = "Да. Смогу. Я уже решила."
13130-355 = "...Ты разберёшься с фондом прямых инвестиций, отобьёшься от Нефтис и спасёшь Нономи?"
13130-356 = "...Ух."
13130-357 = "Что значит «ух»?! И как ты собираешься разгребать последствия?"
13130-358 = "Какие последствия? Я приду, отрекусь от студсовета Абидоса и больше не буду вице-президентом."
13130-359 = "Разнесу фонд прямых инвестиций, уничтожу Железнодорожную пушку, и всё это никак не коснётся Комитета по выплате долга."
13130-360 = "Что это вообще за решение?! А ТЫ?"
13130-361 = "Хм... Ну, для меня это будет отстранение, разговор с Бюро исправительных работ, исключение... Полагаю, последним шагом станет уход из Кивотоса?"
13130-362 = "Вот поэтому вы и останетесь здесь."
13130-364 = "...!!"
13130-365 = "«Вы»?"
13130-366 = "Что именно ты имеешь в виду под «вы»?"
13130-367 = ""
13130-370 = ""
13130-371 = "Вы — Комитет по выплате долга. Разве не очевидно? Настоящий студсовет, утверждённый Сенсеем. Так всё красиво завяжется бантиком."
13130-372 = ""
13130-374 = ""
13130-376 = ""
13130-377 = ""
13130-378 = ""
13130-385 = ""
13130-386 = ""
13130-387 = ""
13130-389 = "С-Широко? В кого ты стреляешь?!"
13130-391 = "Это опасно, Широко!"
13130-392 = ""
13130-395 = ""
13130-396 = "Встретимся на крыше. Решим это боем."
13130-397 = ""
13130-399 = ""
13130-401 = ""
13130-402 = "Ч-Ч-Что вообще происходит?!"
13130-403 = "Б-Бой?"
13130-404 = ""
13130-407 = ""
13130-408 = ""
13130-410 = ""
13130-411 = "Хех. Бой, значит? Давненько не было, да?"
13130-412 = "Я что, в подростковой драме? Даже бабочки в животе!"
13130-413 = ""
13130-415 = ""
13130-416 = ""
13130-417 = ""
13130-420 = "П-Подождите...! Хошино, Широко?!"
13130-421 = "Что сейчас вообще происходит...? Это абсурд..."
13130-422 = "Ч-Что делать, Сэрика?"
13130-423 = "Идти за ними, очевидно!"
13130-424 = ""
13130-429 = "Следующий эпизод;Ты и мы"
