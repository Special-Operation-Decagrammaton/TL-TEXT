[translation]
63070-1 = "Эпизод 7;Попытка"
63070-2 = "...Незнакомый потолок."
63070-3 = "Нет, серьёзно."
63070-4 = ""
63070-7 = "Здравствуй, Субару. Я пришла на дневной осмотр."
63070-8 = ""
63070-10 = ""
63070-11 = "Прости. Утром у меня занятия, поэтому..."
63070-12 = "Утренние занятия, да. Понятно..."
63070-13 = "Наверное, именно так всё и должно быть."
63070-14 = "..."
63070-15 = ""
63070-17 = ""
63070-18 = "Как тебе лазарет Рыцарей исправительного курса?"
63070-19 = "...Хорошо. Если честно, это лучшие условия, которые я когда-либо видела."
63070-20 = "Благодаря этому, похоже, все идут на поправку."
63070-21 = "Я уже начинаю места себе не находить..."
63070-22 = "Нельзя ли нас уже выписать...?"
63070-23 = "Нет-нет, все! Вы должны оставаться на месте, пока Капитан не разрешит выписку!"
63070-24 = "Знаете, момент, когда вам кажется, что вы уже здоровы, на самом деле самый опасный."
63070-25 = "Вот видите? Именно так."
63070-26 = "..."
63070-27 = ""
63070-29 = ""
63070-30 = "Эм, Субару?"
63070-31 = "Хм?"
63070-32 = "Ты... ведь не ненавидишь нас или что-то такое?"
63070-33 = "С чего бы мне вас ненавидеть? После всего, что вы для нас сделали?"
63070-34 = "..."
63070-35 = "Вот что ты имела в виду."
63070-36 = "Есть..."
63070-38 = "(...В тот день.)"
63070-39 = "(В день, когда умолкли трубы ангелов.)"
63070-40 = "(Студенты из Клуба неотложной медицинской помощи Геенны и Рыцарей исправительного курса Тринити...)"
63070-41 = "(...а также многие другие прибыли в Ариус.)"
63070-42 = ""
63070-47 = ""
63070-48 = ""
63070-50 = ""
63070-51 = ""
63070-53 = ""
63070-54 = ""
63070-55 = ""
63070-56 = ""
63070-61 = ""
63070-62 = ""
63070-64 = "(Они перевезли нас в главное здание Рыцарей исправительного курса.)"
63070-65 = "(С тех пор мы всё это время здесь — лечимся и восстанавливаем силы.)"
63070-66 = ""
63070-67 = "Некоторым студентам трудно принять тот факт, что помогли нам именно Тринити и Геенна."
63070-68 = "Конечно, мы уже не в том положении, чтобы открыто высказывать свои чувства."
63070-69 = "Мне нужно ещё немного времени, чтобы разобраться со своими мыслями и чувствами. Прости."
63070-70 = ""
63070-72 = ""
63070-73 = "А, нет! Если уж на то пошло, это нам следует извиняться..."
63070-74 = "Ну..."
63070-75 = "Если отложить это в сторону..."
63070-76 = "Ещё раз спасибо за всё, что вы сделали, чтобы лечить нас и заботиться о нас."
63070-77 = ""
63070-79 = ""
63070-80 = "Н-Ничего страшного!"
63070-81 = ""
63070-82 = "Скорее это мы должны спрашивать о вашем состоянии. Как вы себя чувствуете?"
63070-83 = "Я в порядке. А ты, Мине?"
63070-84 = "Не обременяйте себя беспокойством обо мне. Мне многого не хватает, но это тело всё ещё принадлежит капитану Рыцарей исправительного курса."
63070-85 = "...Мине, что именно произошло с тобой в тот день?"
63070-86 = "Хм?"
63070-87 = "А. В тот день..."
63070-88 = "..."
63070-89 = "Я просто защищала тех, кого видела перед собой. Вот и всё."
63070-90 = "И возможность снова стоять лицом к лицу с каждой из вас — большая радость."
63070-91 = "...Если вы не возражаете, я тоже хотела бы кое о чём спросить. Субару, как человек из Ариуса..."
63070-92 = "Понятно. Если честно, на этом этапе было бы ложью сказать, что я вообще ничего по этому поводу не чувствую."
63070-93 = "..."
63070-94 = "Пока что я намерена жить дальше, даже если эти чувства всё ещё остаются внутри меня. Так или иначе."
63070-95 = "Не знаю, что будет дальше. Может, эти чувства усилятся, может, превратятся в тупую боль, а может, сгорят дотла."
63070-96 = "...Что бы ни случилось, я не могу просто перестать жить."
63070-97 = "Понятно. Этой твоей твёрдой решимости и мне есть чему поучиться."
63070-98 = "Да. Урок..."
63070-99 = ""
63070-101 = ""
63070-103 = "В таком случае с этого самого момента начинаем подготовку к пробным экзаменам!"
63070-104 = "Что?! П-Прямо сейчас?!?!"
63070-105 = "Соберитесь, все! Пробные экзамены уже совсем близко!"
63070-106 = "Теперь, когда ваши тела и умы восстановились, посвятить себя учёбе — именно то, что должна делать настоящий студент!"
63070-107 = "Мы, Рыцари исправительного курса, также обязаны сосредотачиваться на помощи нуждающимся..."
63070-108 = "...но у нас есть и обязанность академически доказать ценность Рыцарей исправительного курса как клуба!"
63070-109 = "Вы ведь согласны, все?"
63070-110 = "Есть, капитан!"
63070-111 = "Фуфу. Прекрасно."
63070-112 = "Тогда, Субару. И все остальные."
63070-113 = "Желаю вам удачи на экзаменах."
63070-114 = ""
63070-116 = ""
63070-117 = "Как такой хороший разговор закончился... вот этим?"
63070-118 = "Учёба, значит...?"
63070-119 = "...Я всё ещё не хочу этим заниматься."
63070-120 = "Если честно, я тоже."
63070-121 = "Я хочу попробовать!"
63070-122 = "У тебя столько энергии... Может, в этот раз уже мне нужно у тебя поучиться..."
63070-123 = ""
63070-125 = ""
63070-128 = "Хм? Что происходит...?"
63070-130 = ""
63070-131 = ""
63070-132 = ""
63070-133 = ""
63070-134 = ""
63070-135 = ""
63070-136 = ""
63070-137 = "Вот, пожалуй, и все основы ближнего боя в стиле Ариуса."
63070-138 = "Конечно, в идеале вообще никогда не стоит доводить дело до ближнего боя, но в полевых условиях может случиться что угодно."
63070-139 = "Ого-о..."
63070-140 = "Как круто...!"
63070-141 = ""
63070-143 = ""
63070-144 = "Х-Хм? Не думала, что реакция будет такой..."
63070-145 = "...В Ариусе, если ошибалась, телом запоминала, что именно сделала неправильно..."
63070-146 = "Э-Эм! Этому... мастерству ближнего боя... Вы могли бы нас научить?"
63070-147 = "Что? Н-Но вам всем вроде бы не особо нужно..."
63070-148 = "Ты же сама сказала! Никогда не знаешь, что случится, верно?"
63070-150 = "Даже таким юным леди, как мы, думаю, приходится жить в эпоху, когда самооборона в ближнем бою необходима!"
63070-152 = "Именно! Для леди... Нет, особенно потому, что мы леди!"
63070-153 = "Мы должны уметь защитить себя и преподать манеры любому грубияну, который перейдёт нам дорогу!"
63070-154 = "Да! Именно!"
63070-155 = ""
63070-157 = ""
63070-158 = "С Тринити... точно всё будет в порядке?"
63070-159 = "Кажется, мы только что разбудили что-то совершенно нелепое..."
63070-160 = "Хм, может, предложим создать клуб исследования CQC?"
63070-161 = "Отличная идея! Тогда президентом и вице-президентом клуба..."
63070-162 = "Очевидно, должны стать люди с самым большим опытом!"
63070-163 = ""
63070-165 = ""
63070-166 = "Именно! Мы на вас рассчитываем!"
63070-167 = ""
63070-169 = ""
63070-170 = ""
63070-171 = "М-Мы?! Мы не можем взять на себя что-то настолько важное..."
63070-172 = "А-Ах..."
63070-173 = "Не думайте слишком много! Мы поможем всем, чем сможем!"
63070-174 = "Все! Ещё один раунд аплодисментов нашим новым президенту и вице-президенту!"
63070-175 = ""
63070-177 = ""
63070-178 = "М-Мы надеемся на совместную работу..."
63070-179 = "К-Как всё снова пришло к этому?"
63070-180 = ""
63070-181 = "Эм... Субару?"
63070-182 = "Да? Что такое?"
63070-183 = "..."
63070-184 = "Как думаешь... это возможно?"
63070-185 = "Может, это будет не совсем так, как мы привыкли..."
63070-186 = ""
63070-188 = ""
63070-189 = ""
63070-190 = "...но как думаешь, сможем мы построить для себя новое гнездо?"
63070-191 = "..."
63070-192 = "Нужно хотя бы попытаться."
63070-194 = "Что... я вообще пыталась сделать?"
63070-195 = "Ты «пыталась защитить свой Ариус»."
63070-197 = "Если бы я знала, что всё кончится так, то, наверное, вообще ничего бы не делала."
63070-198 = "«Это неправда»."
63070-199 = "«Уже одного того, что ты вообще попыталась, достаточно»."
63070-201 = "«Иногда ничего не изменится, как бы сильно ты ни старалась»."
63070-202 = "«Можно провалиться или даже сделать хуже»."
63070-203 = "«Но подумай»."
63070-204 = "«Если ты действительно на самом дне, идти можно только вверх»."
63070-205 = ""
63070-206 = "Как бы всё ни закончилось."
63070-208 = "Следующий Эпизод;Чаепитие"
