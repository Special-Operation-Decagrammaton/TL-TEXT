70014030-65 = "Грохот, тряска, летящая повсюду пыль."
70014030-66 = "Откровенно говоря, мне не нравится ни первое, ни второе, ни третье."
70014030-67 = "Каждое из этих неудобств катастрофически мешает мне готовить препараты."
70014030-68 = ""
70014030-70 = ""
70014030-73 = "Грх?!"
70014030-74 = "А...? Пахнет... как-то... сладко?"
70014030-75 = ""
70014030-76 = ""
70014030-77 = ""
70014030-78 = "Что ж."
70014030-79 = "Для жизни это не опасно."
70014030-80 = "Ключевое слово здесь, разумеется, «жизни»."
70014030-82 = ""
70014030-83 = "*Ха-а* *ха-а* *ха-а*...!"
70014030-84 = ""
70014030-86 = ""
70014030-87 = ""
70014030-88 = ""
70014030-89 = ""
70014030-90 = "Раз ты здесь новенькая, это ещё не значит, что мы дадим тебе поблажку!"
70014030-91 = "Заняла денег на Чёрном рынке, значит, возвращай! И про проценты не забудь!"
70014030-92 = "Но вы же всё это сами накрутили, даже не спросив меня!"
70014030-93 = "Да неужели? А ты-то что? Деньги ведь потратила, не так ли?"
70014030-94 = "П-Потратила, но...!"
70014030-95 = "Но вы заставили меня всё спустить в вашем магазине! А цены там просто бешеные!"
70014030-96 = "Мы тут из кожи вон лезли, помогая новенькой, а она даже спасибо не скажет... Нет денег, расплатишься кровью!"
70014030-98 = "Вот что бывает, когда суёшься на Чёрный рынок без подготовки!"
70014030-99 = ""
70014030-100 = "Какая мелочность."
70014030-101 = "Хотя мне и не нравится, что девушка бездумно забрела в столь сомнительное место..."
70014030-102 = "Самодовольное высокомерие этих мошенников раздражает ещё сильнее."
70014030-103 = ""
70014030-104 = ""
70014030-105 = "Эй, вы двое."
70014030-106 = "Чего? Тебе тоже кредит нужен?"
70014030-107 = "Если нет, проваливай!"
70014030-108 = ""
70014030-110 = ""
70014030-111 = ""
70014030-113 = "Хм?"
70014030-114 = "А?"
70014030-116 = "Моё тело... не дви..."
70014030-117 = ""
70014030-119 = ""
70014030-120 = ""
70014030-121 = "Именно. Поспите пару дней."
70014030-122 = "А что с вами за это время случится, мне совершенно безразлично."
70014030-123 = "И ты..."
70014030-124 = ""
70014030-126 = ""
70014030-127 = "Ч-Что...?!"
70014030-128 = "Ц."
70014030-129 = "Буду кратка."
70014030-130 = "Если позволишь другим вытирать об тебя ноги, тебя сожрут заживо. Будь начеку."
70014030-131 = "Так устроен этот мир."
70014030-133 = "Эй, народ! Хватайте оружие! Сделаем этим типам предложение, от которого они не смогут отказаться!"
70014030-134 = "Каждый сам за себя! Кто предложит перемирие, тот чёртов предатель!"
70014030-135 = ""
70014030-144 = "Ч-Что...? Кто... Зачем...?"
70014030-145 = ""
70014030-150 = "Хватит дёргаться. Испачкаете мне пальто."
70014030-151 = "Это... и есть твоя причина...?"
70014030-152 = "*тук*"
70014030-153 = ""
70014030-155 = ""
70014030-156 = "[ns] «Эм, все, с кем мы сегодня столкнулись... С ними всё в порядке, да?»"
70014030-157 = "Хм? А, понимаю. Вот о чём вы беспокоились."
70014030-158 = "Не волнуйтесь. Живые подопытные всегда полезнее."
70014030-166 = "Что думаете, Сенсей?"
70014030-167 = "Удалось как следует осмотреть Чёрный рынок?"
70014030-168 = "[s] «Я всё ещё не понимаю, что о нём думать...»"
70014030-169 = "Естественно. Таково уж это место."
70014030-170 = "Образно говоря, оно находится где-то между смертельной и неизлечимой болезнью."
70014030-171 = "Одни считают этот район смертельным недугом и теряют надежду, другие видят в нём хроническую болезнь, с которой пытаются жить."
70014030-172 = "Для меня разницы нет."
70014030-173 = "...Всё равно это практически труп, на который лекарства уже не действуют."
70014030-174 = "[s] «И всё-таки мне хочется узнать ещё немного»."
70014030-175 = "Ха. Значит, вы из вторых. Наивный глупец, верящий, что во всём можно найти что-то хорошее."
70014030-176 = "..."
70014030-177 = "Что ж, пусть будет так. Для меня это лишь очередное развлечение."
70014030-178 = ""
70014030-181 = ""
70014030-182 = ""
70014030-183 = ""
70014030-184 = "Ты чего, старая карга?! Раз тебе полегчало, пора платить за крышу!"
70014030-185 = "Знаешь, какие мы добрые, что всё это время закрывали глаза на долги? Теперь раскошеливайся!"
70014030-186 = "Давай решим всё тихо-мирно. Необязательно кому-то страдать!"
70014030-187 = "В-Вы... МЕРЗАВЦЫ!"
