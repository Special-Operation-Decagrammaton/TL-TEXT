[translation]
70014030-1 = "Странствия аптекаря 3"
70014030-2 = ""
70014030-3 = "Чёрный... рынок? Вы и правда хотите осмотреть его лично, Сенсей? В одиночку?"
70014030-4 = "П-Почему?! Вас кто-то шантажирует?"
70014030-5 = ""
70014030-7 = ""
70014030-8 = "И всё это ради... полевого исследования?"
70014030-9 = "Н-Ну, если так, разумнее было бы поручить это другому студенту или кому-нибудь со стороны..."
70014030-10 = "[s1] «Я ценю твою заботу, но хочу узнать всё из первых рук».\n[s2] «Надеюсь, ты хоть немного мне доверишься»."
70014030-13 = "..."
70014030-14 = "..."
70014030-15 = ""
70014030-16 = "Ха."
70014030-17 = "[s] «Кай, ты...! Ты только что рассмеялась! Мне не послышалось?!»"
70014030-18 = "Просто интересуюсь, Сенсей... У вас случайно нет кошачьих генов в ДНК?"
70014030-19 = "[s] «...Кошачьих генов?»"
70014030-20 = "Ну, разве не говорят, что у кошек девять жизней? Они могут позволить себе немного безрассудства."
70014030-21 = "[s] «Ничего подобного!»"
70014030-22 = "Не могу сказать, что полностью вас понимаю, но мотивы мне ясны. Особенно когда речь идёт о вас, Сенсей."
70014030-23 = "И всё же я невольно немного сочувствую Генеральному студенческому совету."
70014030-24 = "Хм? Не думали, что я «способна на такое чувство»?"
70014030-25 = "Разумеется, оно не ОЧЕНЬ сильное. Кхе-хе-хе..."
70014030-26 = "Но что это за чувство и в каких обстоятельствах оно возникает...?"
70014030-27 = "По крайней мере, в теории я это знаю."
70014030-28 = "...Иными словами, Сенсей..."
70014030-29 = "Сейчас вы ведёте себя настолько безрассудно, что даже мне становится тревожно."
70014030-30 = "[s] «...Вот это замечание действительно задело»."
70014030-31 = "Начнём с того, Сенсей, что любой организации неразумно позволять высшему руководству лично заниматься мелочами на местах."
70014030-32 = "Кхе-хе... Но, учитывая, насколько медлителен Генеральный студенческий совет, пожалуй, действовать лично действительно лучше."
70014030-33 = "И как именно вы собираетесь докопаться до «подлинной правды» о Чёрном рынке...? Вы и правда удивительный чудак. Такой любопытный котик..."
70014030-34 = "Ладно. Мне интересно, так что пойдёмте."
70014030-35 = "[s] «Ты пойдёшь со мной?»"
70014030-36 = "...Вы пробудили мой интерес, Сенсей."
70014030-37 = "Мир полон скуки. По крайней мере, для меня. Поэтому..."
70014030-38 = "Если вы согласны стать моим «развлечением», я готова заплатить вам за это достойную цену."
70014030-39 = "В конце концов, в таком мире обещания очень важны."
70014030-46 = "Не отступать!"
70014030-47 = ""
70014030-49 = ""
70014030-50 = ""
70014030-51 = ""
70014030-52 = ""
70014030-53 = "Захватим этот угол, и вся улица будет нашей!"
70014030-54 = ""
70014030-55 = ""
70014030-56 = ""
70014030-57 = "Я слишком долго спускала всё на тормозах!"
70014030-58 = "Все здесь виноваты! Подумать только, они нас предали!"
70014030-59 = "Когда всё закончится, удвоим плату за крышу! УДВОИМ!"
70014030-63 = ""
