[translation]
101060-1 = "Эпизод 6; Предзнаменование"
101060-7 = "Ринни! Ринни!"
101060-8 = "Сколько раз я вам говорила, президент? Пожалуйста, не называйте меня Ринни."
101060-9 = "А? Н-Но для меня ты Ринни... Как же мне тебя ещё называть...?"
101060-10 = "Н-Нанагами...?"
101060-11 = "..."
101060-12 = "Просто Рин? Госпожа Рин?"
101060-13 = "...Называйте как хотите."
101060-14 = "Всё равно только вы меня так называете."
101060-15 = "Хорошо! Ринни! Ринни! Хи-хи!"
101060-16 = "...А? А-а? Ты сейчас улыбнулась, Ринни?"
101060-17 = "Нет."
101060-18 = "А вот и да! Я видела!"
101060-19 = "Нет. Не улыбалась."
101060-20 = "Точно-о-о? А по-моему, да!"
101060-21 = "..."
101060-22 = "Я совершенно серьёзно. Не улыбалась."
101060-24 = "Рин..."
101060-25 = "...!"
101060-26 = "Зал Генерального студенческого совета"
101060-27 = "Вы, должно быть, очень устали. Уже давно нормально не спали."
101060-28 = "О, Аюму... Похоже, я задремала."
101060-29 = "Простите, что разбудила. Но возник срочный вопрос..."
101060-30 = "Ничего. Идём."
101060-31 = ""
101060-36 = "Ух ты, Рин, Аюму. Вы так усердно работаете."
101060-37 = "Момока."
101060-38 = "Момока... Это срочно..."
101060-39 = "Знаю-знаю. Сюда."
101060-40 = ""
101060-42 = ""
101060-43 = ""
101060-45 = "Это...?"
101060-46 = "Эти показания были зафиксированы два часа назад."
101060-49 = "По всему Кивотосу обнаружены шесть объектов с невероятно высокой энергией."
101060-50 = "..."
101060-51 = "Посмотрим... Пустыня Абидос, заброшенный парк аттракционов возле Р.У., закрытая зона на окраине Миллениума, приграничная область между Тринити и Геенной, новый городок возле Миллениума... и центр башни Санктум."
101060-53 = "Центр башни Санктум..."
101060-54 = "Ага. Прямо над нами."
101060-55 = "Я попыталась собрать информацию с камер наблюдения, но ничего необычного не обнаружила."
101060-56 = "Та же самая старая башня Санктум."
101060-57 = "..."
101060-58 = "И в остальных местах, где были замечены энергетические объекты, тоже ничего."
101060-59 = "Сначала я подумала: может, это огромные тайфуны, которые идут громить Кивотос? Но не сходится — у тайфунов нет такой массы."
101060-60 = "Данные есть, но физически этого не существует..."
101060-61 = "Ха-ха-ха! Тогда вывод один. Аппаратура сломана!"
101060-62 = "Момока..."
101060-63 = "..."
101060-64 = "Нам придётся отправиться туда лично и проверить."
101060-65 = "Ч-Что ты имеешь в виду, Рин?"
101060-66 = "Простите? Вы хотите ехать во все эти районы? Я же говорю, мы проверили наблюдательные дроны — ничего! Ноль! Пусто!"
101060-67 = "И ни из одного района не поступало сообщений об аномалиях."
101060-68 = ""
101060-70 = ""
101060-71 = "...Пожалуйста, соберите представителей студенческих советов."
101060-72 = "...?!"
101060-73 = "Что?!"
101060-74 = "У Генерального студенческого совета недостаточно сил, чтобы реагировать на явление такого масштаба. Придётся координироваться с каждым районом и совместно анализировать феномен."
101060-75 = "Полномочиями исполняющей обязанности президента Генерального студенческого совета я ввожу чрезвычайный протокол. Пожалуйста, созовите Комитет экстренного реагирования Кивотоса."
101060-76 = "Не слишком ли радикально? Вдруг это всего лишь обычная неисправность оборудования? Что тогда?"
101060-77 = "Если так, это будет облегчением. Мы просто спишем всё на ошибку."
101060-78 = "Но пока мы не увидим полной картины, обязаны задействовать все силы Кивотоса."
101060-79 = "Для начала вызовите представителей Тринити, Геенны, Миллениума, Абидоса... всех районов, с которыми можем связаться."
101060-80 = "..."
101060-81 = "Ого... Серьёзно? Мы неделю спать не будем."
101060-83 = "Р-Рин... Ты уверена, что всё будет нормально?"
101060-84 = ""
101060-86 = ""
101060-87 = "Эм... Ну, в последнее время поступали жалобы, что вы злоупотребляете полномочиями своего управления..."
101060-88 = "Такие крайние меры могут поставить под угрозу ваше положение исполняющей обязанности президента. Особенно это наверняка воспримут как посягательство на полномочия Управления обороны."
101060-89 = "Формально вы, возможно, не выходите за рамки своих полномочий, но... Казначейство..."
101060-90 = "...Они вечно поднимают ненужные проблемы, не так ли?"
101060-92 = ""
101060-93 = "Ах! Начальник финансов..."
101060-94 = "Оки Аой."
101060-95 = "Главный администратор."
101060-97 = "И-и! Я, э-э, совсем забыла! У меня куча обязанностей! Пока-пока!"
101060-98 = ""
101060-100 = ""
101060-101 = ""
101060-102 = ""
101060-103 = ""
101060-105 = "*шёпотом* Момока, нельзя убегать!"
101060-106 = "*шёпотом* Ч-Что?! Отпусти, Аюму! Я тут умру!"
101060-108 = ""
101060-109 = "Объясните мне. С каких пор главный администратор начал посягать на полномочия Управления обороны?"
101060-110 = "Аой. Эта ситуация..."
101060-111 = "Объяснять не нужно. Я прекрасно понимаю ситуацию."
101060-112 = "Кивотос столкнулся с неизвестным явлением."
101060-113 = "Вы намерены реагировать на высшем уровне всеми доступными средствами, пока не убедитесь, что эти неизвестные объекты не представляют угрозы Кивотосу. С этим решением я не спорю."
101060-114 = "Точнее, я бы не спорила, будь это решение президента Генерального студенческого совета."
101060-115 = "..."
101060-116 = "Но вы ведь не она, правда? Вы всего лишь заместитель."
101060-117 = "Вы потеряли административный контроль над башней Санктум, закрыли академию SRT и даже одобрили такую неизвестную организацию, как Шале."
101060-118 = "С этим я ещё могла смириться. Но теперь? Смутное пророчество Шале? Предчувствие разрушения? Что за нелепость вы себе позволяете?"
101060-119 = "Как заместитель, вы уже перешли не одну черту."
101060-120 = "Аой, я понимаю, что ты не одобряешь ни меня, ни мои методы."
101060-121 = "Но мои решения не основаны на личных чувствах."
101060-122 = "Вы ошибаетесь. Я высоко оцениваю ваши способности. Более того, скажу: в своей области вы лучшая. Именно поэтому президент тоже признала вас."
101060-123 = "Но способности не делают вас президентом Генерального студенческого совета."
101060-124 = "Вы стали заместителем потому, что возглавляли Надзорное управление и потому были следующей в очереди после исчезновения президента. Это не было признанием вашей пригодности к должности."
101060-125 = "Один этот факт должен лежать тенью на каждом вашем шаге в роли исполняющей обязанности президента. Помните: каждое решение вы принимаете под этой тенью. Заместитель."
101060-126 = "..."
101060-127 = "Если, несмотря на всё это, вы всё же намерены созвать Комитет экстренного реагирования, вам понадобятся доказательства, оправдывающие такое вмешательство в полномочия Управления обороны."
101060-128 = "Ваши аргументы должны быть настолько безупречны, чтобы убедить меня."
101060-129 = "Иначе..."
101060-130 = "Общественность увидит в вас оппортунистку, пытающуюся укрепить своё положение, пока президент всё ещё отсутствует."
101060-131 = "..."
101060-132 = "Я приму твой совет к сведению."
101060-133 = "Хорошо. Тогда..."
101060-134 = ""
101060-136 = ""
101060-137 = ""
101060-138 = "Вам нужно больше отдыхать."
101060-139 = "Ваша кожа видала времена и получше."
101060-140 = ""
101060-142 = ""
101060-145 = "..."
101060-146 = "*выдыхает*"
101060-147 = "*пыхтит* *пыхтит* Я думала, не добегу..."
101060-148 = "Рин..."
101060-149 = "Аюму, подготовь Комитет экстренного реагирования."
101060-150 = ""
101060-152 = ""
101060-153 = "...!"
101060-154 = "..."
101060-156 = ""
101060-157 = ""
101060-158 = ""
101060-159 = "О, главный администратор Рин..."
101060-160 = "Начальник обороны..."
101060-161 = "Простите. Начальник финансов говорила так громко, что я невольно всё услышала."
101060-162 = "Ничего. Я прошу прощения за Комитет экстренного реагирования. Надеюсь, ты поймёшь."
101060-163 = "Понимаю. Это в пределах ваших полномочий."
101060-164 = "..."
101060-165 = "Тяжело занять место президента Генерального студенческого совета. Начальник финансов была с вами слишком сурова."
101060-166 = "Но факты остаются фактами. Многие оспаривают ваши полномочия... Как лучше с этим справиться?"
101060-167 = "Ах! Почему бы не попросить Шале присоединиться к Комитету экстренного реагирования?"
101060-168 = "Шале...?"
101060-169 = "Именно! Если там будет Сенсей из Шале, это поможет склонить представителей академий к нашей позиции."
101060-170 = "Достижения Шале к этому моменту известны по всему Кивотосу. Разве они даже не раскрыли коррупцию в Полицейской школе Валькирия? Они действительно способны на всё."
101060-171 = "Присутствие Сенсея поможет и вам меньше волноваться."
101060-172 = "Спасибо за совет. Сотрудничество Шале нам в любом случае понадобится."
101060-173 = "Тогда я могу сама связаться с Сенсеем."
101060-174 = "Когда Сенсей будет добираться сюда из здания Шале, понадобится охрана. Думаю, можно попросить Валькирию."
101060-175 = "Спасибо за помощь, Кая. Я рассчитываю на тебя."
101060-176 = "Не благодарите. В такие времена мы должны поддерживать друг друга, главный администратор."
101060-177 = "Тогда я пойду."
101060-178 = ""
101060-180 = ""
101060-181 = ""
101060-182 = "..."
101060-183 = ""
101060-185 = ""
101060-186 = ""
101060-187 = "...Да. Вам нужно быть готовой."
101060-189 = "Следующий Эпизод; Созыв Комитета экстренного реагирования"
