[translation]
10046060-1 = "Эпизод 6;Дьявол всегда просит плату"
10046060-2 = ""
10046060-3 = "...Конструкция небезопасна."
10046060-4 = "Земля снизу полностью провалилась. Забудьте о здании — я не уверена, что нам вообще стоит оставаться на этом пляже."
10046060-5 = ""
10046060-7 = ""
10046060-8 = ""
10046060-9 = "...Как такое могло произойти?"
10046060-10 = "Почему? Почему именно сегодня? Почему с нами?"
10046060-11 = "Мика..."
10046060-12 = "..."
10046060-13 = "...Всё нормально. Здесь никто не виноват."
10046060-14 = "Я знаю. Значит, придётся с этим смириться."
10046060-15 = "...Мне так жаль. Вы обе столько помогали."
10046060-16 = "Может... мне просто не суждено делать людей счастливыми."
10046060-17 = ""
10046060-19 = ""
10046060-20 = "Э-Это неправда! Это... несчастный случай! Неудача! Стихийное бедствие!"
10046060-21 = "Мы все знаем, как ты старалась..."
10046060-22 = "Спасибо, Ичика."
10046060-23 = "Но если виллы нет, то и отпуска нет."
10046060-24 = "Ага... Пойдём сообщим плохие новости Наги и Сэе."
10046060-25 = "И вернёмся обратно. Может, успеем добраться до общежития и немного поспать."
10046060-26 = ""
10046060-28 = ""
10046060-30 = ""
10046060-31 = "...Ну да, здание рухнуло. Но это ведь не значит—"
10046060-32 = "..."
10046060-33 = "Сенсей... Помогите мне тут."
10046060-34 = "Может, скажете что-нибудь воодушевляющее?"
10046060-35 = "[s1] «Хотел бы.»\n[s2] «Я не могу подвергать вас всех опасности.»"
10046060-36 = ""
10046060-37 = ""
10046060-39 = ""
10046060-40 = "...Пожалуй."
10046060-41 = "В конце концов, грунт нестабилен."
10046060-42 = "Как телохранитель, я понимаю, что нам следует уехать. Безопасность прежде всего."
10046060-43 = ""
10046060-45 = ""
10046060-46 = ""
10046060-47 = "..."
10046060-48 = "...Земля."
10046060-49 = "Если мы докажем, что участок безопасен, тогда отпуск можно продолжить, верно?"
10046060-50 = "Может, есть способ."
10046060-51 = "Ох, как же мне не хочется это делать..."
10046060-52 = "..."
10046060-53 = "..."
10046060-54 = "..."
10046060-55 = "...А! Я правда не хотела, чтобы до этого дошло!"
10046060-56 = "[s3] «Что такое...?»\n[s4] «Если ты настолько этого не хочешь, тогда не...»"
10046060-59 = "Нет, я готова. Я... в порядке. Я готова."
10046060-60 = "Хотя я очень стараюсь просто плыть по течению..."
10046060-61 = "...пришло время мне самой сделать шаг вперёд."
10046060-62 = ""
10046060-64 = ""
10046060-65 = ""
10046060-66 = "Сенсей, у меня есть просьба."
10046060-69 = ""
10046060-70 = ""
10046060-72 = ""
10046060-73 = "..."
10046060-74 = "Так, значит, у тебя на руках рухнувшее здание, да?"
10046060-75 = "И нужен кто-то, кто всё обследует и, если возможно, восстановит его?"
10046060-77 = "Да. Как бы мне ни было больно это признавать, в вашем кружке работают лучшие инженеры-строители из всех, кого я знаю."
10046060-78 = "О, я так рада, что ты это признаёшь. Я ведь так усердно учусь!"
10046060-79 = ""
10046060-81 = ""
10046060-82 = "Но сама знаешь, бесплатно ничего не бывает, Милашка. Придётся кое-что для меня сделать."
10046060-83 = "..."
10046060-84 = "Для начала — строительные материалы, которые ты конфисковала?"
10046060-85 = "...Хорошо. Они ваши."
10046060-86 = "Да? Отлично. Тогда мне ещё хотелось бы кусочек этого пляжа — официально. У меня есть кое-что, что хочется построить."
10046060-87 = "...Это не в моей компетенции."
10046060-88 = "Вот как? Эх, досада. Тогда, похоже, на этом всё. Переговоры окончены. Удачи с вашей развалюхой!"
10046060-89 = "..."
10046060-90 = "О? Это я вижу испепеляющий взгляд из этих прекрасных глаз?"
10046060-91 = "...Нет."
10046060-92 = "Я спрошу у Чаепития насчёт участка. Уверена, Мика согласится."
10046060-93 = ""
10046060-95 = ""
10046060-96 = "Это может сработать..."
10046060-97 = ""
10046060-99 = ""
10046060-100 = "Но ты же знаешь, я жадная, Ичика. Чем больше ты уступаешь, тем больше мне хочется взять."
10046060-101 = ""
10046060-103 = ""
10046060-104 = "...Я—"
10046060-105 = "Хм?"
10046060-106 = "Я сделаю всё, что ты захочешь."
10046060-107 = ""
10046060-109 = ""
10046060-111 = ""
10046060-112 = "О?"
10046060-113 = "Ну надо же. Какая смелая."
10046060-114 = "Ладно. Тогда договорились. Ты всё ещё согласна?"
10046060-115 = ""
10046060-117 = ""
10046060-118 = "Правда?!"
10046060-119 = "Мы ведь не чужие. Как я могу уйти, когда наша дорогая Ичика готова терпеть такое унижение?"
10046060-120 = "Но я всё ещё не удовлетворена. Так что скажи мне..."
10046060-121 = "...Почему ты это делаешь?"
10046060-122 = "Я не обязана отвечать."
10046060-123 = "Нет, вообще-то обязана."
10046060-124 = ""
10046060-126 = ""
10046060-128 = ""
10046060-129 = "Ты сказала, что сделаешь всё, что я захочу."
10046060-130 = "Тебе ещё повезло: я могла попросить «что угодно» на свете, а выбрала всего лишь это."
10046060-131 = "Так что, пока я не передумала, лучше отвечай честно. Прямо как есть."
10046060-132 = ""
10046060-134 = ""
10046060-136 = ""
10046060-137 = "...*вздох* Ох, как же я тебя ненавижу..."
10046060-138 = "Я хотела помочь Мике. Вот и всё. Всё настолько просто."
10046060-139 = "Да-да. Очень трогательная история."
10046060-140 = "Но это я уже слышала. Я хочу услышать НАСТОЯЩИЙ ответ."
10046060-141 = "Похоже, ты немного стесняешься. Может, я начну за тебя?"
10046060-142 = "Знаешь, что я слышала? Говорят, эта розовая принцесса, маленькая девочка Мика... та ещё нарушительница спокойствия!"
10046060-143 = "..."
10046060-144 = "Да я просто пошутила! Не будь такой напряжённой! Нам незачем выносить грязное бельё Тринити... прямо сейчас."
10046060-145 = "Но знаешь, когда я вижу Ичику в паре с такой плохой девочкой, как Мика... поневоле задумываюсь."
10046060-146 = "Что заставляет тебя хранить ей верность?"
10046060-147 = "...Это не верность."
10046060-148 = "О? Значит, вы стали подругами? Лучшие подружки?"
10046060-149 = "...Подругами..."
10046060-150 = "Подруги? Ха..."
10046060-151 = ""
10046060-153 = ""
10046060-155 = ""
10046060-157 = ""
10046060-159 = ""
10046060-160 = "Я думала, ты должна быть умной?"
10046060-161 = "...Хаха! Вот теперь другое дело!"
10046060-162 = "Тогда в чём причина?"
10046060-163 = "Конечно, я и раньше о ней слышала. Видела её по работе, встречала её имя в списках гостей... Знала её репутацию."
10046060-164 = "Но сегодня меня назначили сюда. Мы работали вместе."
10046060-165 = "Сначала я не удивилась. Всё было роскошно, идеально и... очень в духе Чаепития."
10046060-166 = "А потом... я продолжала наблюдать за Микой. И задумалась."
10046060-167 = ""
10046060-169 = ""
10046060-171 = "..."
10046060-172 = "В отличие от меня, она действительно сияет."
10046060-173 = "Я спросила себя, смогла бы я быть такой же доброй. Зашла бы я так далеко ради... счастья подруги? Конечно нет."
10046060-174 = "Но я не хочу, чтобы её сияние исчезло. Не хочу видеть, как она терпит неудачу."
10046060-175 = "Вот и вся правда."
10046060-176 = ""
10046060-178 = ""
10046060-180 = "..."
10046060-181 = "А-а, вот оно что! Как чисто, сладко и удобно."
10046060-182 = "Я была честна. Не издевайся."
10046060-183 = ""
10046060-185 = ""
10046060-186 = "Издеваться? Ни в коем случае! Просто ты напомнила мне об одной другой знакомой идиотке."
10046060-187 = "..."
10046060-188 = "Ладно. Обещание есть обещание!"
10046060-189 = ""
10046060-191 = ""
10046060-192 = "Правда?!"
10046060-193 = "Ну, доверие здесь значит всё."
10046060-194 = "И прости. Знаю, ты стеснительная, но я привела друзей."
10046060-195 = ""
10046060-197 = ""
10046060-198 = ""
10046060-199 = "Ой, опусти это! Послушай!"
10046060-200 = "Теперь моя очередь быть сентиментальной и искренней!"
10046060-202 = ""
10046060-204 = ""
10046060-207 = ""
10046060-208 = "Кхм."
10046060-209 = "Эй, народ! Новое задание!"
10046060-210 = ""
10046060-213 = ""
10046060-215 = ""
10046060-216 = "Что такое, президент? Что-то случилось?"
10046060-217 = "Разве мы не должны были... вернуть себе участок под покровом ночи?"
10046060-219 = "А, нет. Это отменяется."
10046060-220 = "...Вернуть?"
10046060-221 = "Видите ли, я пообещала моей подруге построить для неё кое-что особенное."
10046060-222 = "И сразу проясню! Это НАПРЯМУЮ не связано с горячими источниками. Участие НЕ обязательно. И денег за это не будет."
10046060-223 = "Так... кто хочет заняться изнурительным трудом под палящим солнцем?"
10046060-224 = ""
10046060-227 = ""
10046060-228 = "Я в деле. Что угодно ради президента Касуми!"
10046060-229 = "Мы уже столько раз не смогли построить горячие источники, почему бы не попробовать обычное здание?"
10046060-231 = "Эм... Я немного запуталась, но это всё ради того, чтобы помочь приятельнице президента Касуми, да?"
10046060-232 = "Тогда я в деле!"
10046060-233 = ""
10046060-235 = ""
10046060-237 = ""
10046060-238 = "Ха..."
10046060-239 = "...Хаха. Вахахаха! Клянусь, у меня лучший кружок во всём Кивотосе!"
10046060-240 = "Вот и хорошо, да, Ити-дружище?"
10046060-241 = ""
10046060-244 = ""
10046060-245 = "Ты..."
10046060-246 = "Ты думаешь, мы ДРУЗЬЯШКИ?!"
