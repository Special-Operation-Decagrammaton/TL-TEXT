[translation]
10029030-1 = "Эпизод 3;Как на экскурсии"
10029030-2 = "Получив сообщение от Химари, мы вернулись в диспетчерскую Отряда Исследования Сверхъестественного."
10029030-3 = ""
10029030-5 = ""
10029030-6 = ""
10029030-7 = ""
10029030-8 = ""
10029030-9 = ""
10029030-10 = ""
10029030-11 = "...! Новый мир!!"
10029030-12 = "Это правда совершенно другой мир! Посмотрите!! Как такое вообще возможно...!!"
10029030-13 = "Э-Это не сон. Всё по-другому! И это не Индийский покер!! Это настоящий... оккультизм...!!"
10029030-14 = "Буду признательна, если ты немного успокоишься. Я понимаю, что встреча с такой нежной и прекрасной гениальной хакершей, как я, вызывает восторг..."
10029030-15 = "Но вы, гости из другого мира, вызываете у меня не меньший интерес..."
10029030-16 = "Смотрите, за окном! В небе что-то парит! А люди...! Они ж-животные и роботы?!"
10029030-18 = "Ты вообще меня не слушаешь..."
10029030-19 = ""
10029030-22 = "...А. Вот и вы, Сенсей."
10029030-23 = "[s1] «Мы вернулись, Химари...»\n[s2] «Это она...?»"
10029030-26 = "Верно. Одна из трёх людей, которых Эйми принесла из руин Миллениума."
10029030-27 = "Она представилась как Сатэн Руико... И, похоже, пребывание здесь приводит её в восторг."
10029030-28 = "...!! А! Ещё один человек из другого мира!"
10029030-29 = "О! А этот ещё и взрослый! Здравствуйте!"
10029030-30 = "О, тут ещё кто-то... Эй, да это же форма средней школы Токивадай!"
10029030-31 = "...?! Мисака...?!"
10029030-32 = "[s3] «Вы знакомы?»\n[s4] «Она кажется дружелюбной.»"
10029030-35 = "А-а. Так третьей была ты, Сатэн."
10029030-36 = "*вздыхает*"
10029030-37 = "Чего вздыхаешь? Т-Ты разочарована?! Потому что я не Ширай, да...!"
10029030-38 = "С чего ты вдруг вспомнила Куроко?! Это был вздох облегчения!"
10029030-39 = "Я рада, что это ты! Ты хотя бы не станешь устраивать неприятности!"
10029030-41 = "Я же сказала, что ничего плохого не сделала..."
10029030-42 = "Если ты продолжишь меня обвинять, может, мне и правда стоит немного пошалить — всё равно ты мне не поверишь..."
10029030-43 = "[s5] «М-Может, сменим тему?!»\n[s6] «Х-Химари! Расскажите, что удалось выяснить!»"
10029030-46 = "Хи-хи. Как и ожидалось... Когда совсем прижмёт, вы обращаетесь ко мне, Сенсей. Ничего не поделаешь. В конце концов, именно я вам нужна."
10029030-47 = "Я не против. Вы решили положиться именно на меня, а значит, приняли правильное решение."
10029030-48 = "Конечно же, у меня уже есть все ответы о том, что сейчас происходит... Всё готово."
10029030-49 = "Ты говоришь о механизме в руинах? Похоже, анализ уже закончен."
10029030-50 = "Разумеется. Как я уже говорила, для такой нежной и прекрасной гениальной хакерши, как я, нет ничего невозможного."
10029030-51 = ""
10029030-52 = "...Подождите. Она нам вообще расскажет или..."
10029030-53 = "Мисс Мисака, думаю, таких людей лучше не подначивать. Чем больше реагируешь, тем дольше они говорят."
10029030-54 = "Радуйтесь, ибо я уже полностью разобралась в механизме, который перенёс вас сюда, и знаю, как его перезапустить."
10029030-55 = "Починить повреждения, снова запустить его и отправить вас туда, откуда вы пришли, будет совсем просто."
10029030-56 = "Подождите... Нам самим его чинить? И как мы..."
10029030-57 = "Для этого я тоже подготовила решение! Всё настолько просто, что справится даже ребёнок."
10029030-58 = "Сенсей. Возьмите этот чип."
10029030-59 = "[s7] «То есть мне нужно просто вставить его?»\n[s8] «Он просто вставляется в механизм...?»"
10029030-62 = "Да, всё действительно настолько просто. Конечно, я совершенна во всём, но в подобных вещах особенно совершенна."
10029030-63 = "Я почти закончила определять точное местоположение механизма и прокладывать кратчайший маршрут. К вашему отправлению вся информация будет готова."
10029030-64 = "Конечно, можно было бы устранить любую опасность, просто разбив механизм вдребезги, но..."
10029030-65 = "Мы не хотим неожиданностей, поэтому лучше убедиться, что вы все вернётесь домой целыми и невредимыми."
10029030-66 = "Так или иначе, с появлением вас троих наши два мира хоть немного, но соприкоснулись."
10029030-67 = "Кроме того..."
10029030-68 = ""
10029030-70 = ""
10029030-71 = ""
10029030-72 = ""
10029030-73 = "...Будет просто вежливо благополучно проводить гостя домой, правда?"
10029030-74 = "Раз уж вы проделали такой путь, почему бы перед возвращением немного не осмотреться?"
10029030-75 = "Раньше вам было опасно бродить самостоятельно, но теперь, когда рядом Сенсей, проблем быть не должно."
10029030-76 = ""
10029030-78 = ""
10029030-79 = "...Хотя жаль, что после возвращения вы ничего из этого не вспомните."
10029030-80 = "Простите?"
10029030-81 = "Что именно вы имеете в виду? Мы не будем этого помнить?"
10029030-82 = "Именно это я и имею в виду. Физически вы вернётесь в момент до того, как всё это с вами произошло."
10029030-83 = "После возвращения каждая продолжит с того самого места, где остановилась, в точности такой же, как прежде..."
10029030-84 = "Поскольку ваш мозг тоже является физическим органом, новые воспоминания также исчезнут. Разумеется, невозможно помнить то, чего изначально не происходило."
10029030-85 = "Что?! Тогда всё это будет как сон? Нет, даже хуже сна!"
10029030-86 = "Всё это — единственный в жизни опыт буквально из другого мира...! Неужели ничего нельзя сделать? Какая потеря!"
10029030-87 = "С-Сатэн... Ты относишься к этому как к отпуску..."
10029030-88 = "Хи-хи. Понятно. Отпуск..."
10029030-89 = "Приятный взгляд на ситуацию. И как местной жительнице мне, конечно, хочется оставить хорошее впечатление."
10029030-90 = "Но боюсь, каким бы невероятным ни был мой талант, это не в моих силах. Да и у меня есть своя работа."
10029030-91 = "В такой ситуации остаётся только одно..."
10029030-92 = "Сенсей?"
10029030-93 = "[s9] «Предоставьте это мне.»\n[s10] «Быть экскурсоводом звучит весело.»"
10029030-96 = "Хи-хи... Да. Уверена, вы отлично справитесь."
10029030-97 = ""
10029030-99 = ""
10029030-101 = "...? О чём вы все говорите?"
10029030-102 = "Экскурсовод? Отпуск? Разве мы не собирались прямо сейчас идти в руины?"
10029030-103 = "Ну, полагаю, можно и так. Но уже поздно, и..."
10029030-104 = "Наверное, ничего страшного, правда? Дать всем возможность немного развлечься, пусть даже всего день или два."
10029030-105 = "...Хм."
10029030-106 = "Не понимаю."
10029030-107 = "Вы сказали, что они даже не вспомнят, что были здесь. Если не вспомнят, какой в этом смысл?"
10029030-108 = "Не думаю, что это особенно эффективно."
10029030-109 = "Хи-хи... Да. Именно этого ответа я от тебя и ожидала, Эйми."
10029030-110 = "К слову, я бы хотела пригласить Эйми присоединиться к вашему небольшому отпуску, Сенсей."
10029030-111 = "Ты не против, Эйми?"
10029030-113 = "...? Я совершенно не понимаю, к чему всё это."
10029030-114 = "Если прикажете, я сделаю, Президент. Но я не понимаю ваших намерений."
10029030-115 = "Я должна быть их телохранителем?"
10029030-116 = "Хм... Хорошо. Пусть будет так. А что насчёт остальных? Вас троих?"
10029030-117 = "...? А, меня?"
10029030-118 = "Думаю, можно, да? Похоже, вернуть нас домой всё-таки будет не так сложно..."
10029030-119 = "Кажется, всё складывается нормально. Отдохнуть день-другой тоже звучит неплохо."
10029030-120 = "Точно! Раз уж мы зашли так далеко! Просто вернуться было бы жалко! И без того обидно, что мы ничего не вспомним!"
10029030-121 = "...Тогда зачем вообще... если вы всё равно не вспомните..."
10029030-122 = "...В этом мире меня совершенно никто не знает. В каком-то смысле провести здесь немного времени кажется даже целительным."
10029030-123 = "Тогда... Мы просто идём гулять и возвращаемся до наступления ночи?"
10029030-124 = "И нас сопровождает Сенсей? ...Возможно, каждой из нас стоит заняться чем-то своим."
10029030-125 = "..."
10029030-126 = "Хи-хи... Вы все довольно легко приспосабливаетесь. Наверное, и ваш мир — весёлое место, да?"
10029030-127 = "Весёлое...? Ха-ха... Думаю, всё зависит от того, как посмотреть... Но оживлённое — это точно."
10029030-128 = "Н-Ну тогда! Сенсей, если вы не против...!"
10029030-129 = "У нас заканчивается время! Секунды утекают прямо у нас на глазах! Давайте выбираться отсюда!"
10029030-130 = "Обязательно выберите какие-нибудь интересные места, куда нас сводить, Сенсей!"
10029030-131 = "...О?"
10029030-132 = "Сначала мне нужно что-то отдать? Эм... Что же это может быть?"
10029030-133 = "...А. Ага, я уже слышала эту фразу."
10029030-134 = "Мисака? Ты понимаешь, о чём они говорят?"
10029030-135 = "Они говорят вот об этом. Видишь?"
10029030-136 = "Сенсей тоже даст тебе одну. Они называют это «местным обычаем.»"
10029030-137 = "Эм... А. Хорошо..."
10029030-138 = ""
10029030-140 = ""
10029030-141 = ""
10029030-143 = ""
10029030-144 = "То есть... Этот пистолет — это... «местный обычай?»"
10029030-145 = "Стоит мне только забыть, что это другой мир, как такие вещи сразу напоминают..."
10029030-146 = "Похоже, в этом мире такие штуки столь же обычны, как школьные сумки и серьги. Не верится, что я это говорю, но..."
10029030-147 = "Говорят, ходить тут без такой штуки страннее, чем разгуливать голышом на публике..."
10029030-148 = "...?"
10029030-149 = "Не может быть, чтобы я правильно расслышала."
10029030-150 = "...А?!"
10029030-151 = ""
10029030-153 = ""
10029030-154 = "А?! П-Правда?!"
10029030-155 = "Это хуже, чем ходить голышом...?!"
10029030-156 = "[s11] «Нет, это преувеличение...»\n[s12] «Давайте уже выбираться отсюда. Нам ещё целый город смотреть!»"
10029030-157 = ""
10029030-158 = ""
10029030-160 = ""
10029030-161 = "..."
10029030-162 = "Эйми."
10029030-163 = "Да, президент."
10029030-164 = "...Я скоро вернусь."
10029030-165 = ""
10029030-167 = ""
10029030-168 = ""
10029030-170 = "Остаток дня я провёл, гуляя с нашими тремя гостьями и показывая им Кивотос."
10029030-171 = "Мы вернулись лишь глубокой ночью. Измотанные, мы сразу провалились в глубокий сон."
