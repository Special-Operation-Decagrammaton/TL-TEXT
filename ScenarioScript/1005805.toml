[translation]
1005805-1 = "Послеобеденное чаепитие"
1005805-6 = "[ns] «Чаепитие с Мине... Я даже немного взволнован.»"
1005805-9 = "Перед нами трёхъярусная этажерка."
1005805-10 = "На первом ярусе — сэндвичи с огурцом и салат с заправкой из бальзамического уксуса."
1005805-11 = "На втором — йогурт, сконы и густые сливки..."
1005805-12 = "...И наконец, на третьем — фрукты и тирамису."
1005805-13 = "Из напитков у нас кофе и чёрный чай, так что выбирай, что тебе больше нравится."
1005805-14 = "[s1] «Как изысканно. Тогда угощусь.»\n[s2] «Я только хотел спросить: а кекса у тебя нет?»"
1005805-15 = "Это совсем немного, но надеюсь, тебе понравится."
1005805-16 = "...Прости? Кекс...?!"
1005805-17 = "П... понятно. Если ты действительно так сильно его хочешь..."
1005805-18 = "Я могу сама сходить и купить..."
1005805-19 = "Если тебе во что бы то ни стало нужен кекс...!"
1005805-20 = "О, ты уверен, что всё нормально? Этого достаточно?"
1005805-21 = "Спасибо. Мне стало гораздо спокойнее, когда ты это сказал."
1005805-22 = "Это совсем немного, но надеюсь, тебе понравится."
1005805-23 = ""
1005805-25 = ""
1005805-26 = "*вздыхает*"
1005805-27 = "Хм? А я разве ничего не буду есть?"
1005805-28 = "Конечно... Я понимаю, что было бы странно, если бы я одна не участвовала в чаепитии, которое сама устроила."
1005805-29 = "Но... *вздыхает*"
1005805-30 = ""
1005805-33 = "[ns] «Тебя что-то беспокоит?»"
1005805-34 = ""
1005805-36 = ""
1005805-37 = "...Это моя дурная привычка, но я часто устраиваю чаепития, когда меня что-то тревожит."
1005805-38 = "В уютной обстановке всем, включая меня, проще открыть сердце."
1005805-39 = "И всё же я сомневаюсь, уместно ли было... втягивать тебя в это чаепитие."
1005805-40 = "[s3] «Мне нравится слушать о твоей жизни, пока ты мне помогаешь.»\n[s4] «На самом деле я был бы только рад такой возможности.»"
1005805-43 = "Я рада это слышать."
1005805-44 = "Что именно меня тревожит?"
1005805-45 = "Это..."
1005805-46 = ""
1005805-48 = ""
1005805-49 = ""
1005805-50 = ""
1005805-52 = ""
1005805-54 = ""
1005805-56 = "Ты, Сенсей."
1005805-57 = ""
1005805-60 = "[ns] «Я?»"
1005805-61 = "Я и сама не знаю точно почему, но... когда думаю о тебе..."
1005805-62 = "сердце начинает трепетать."
1005805-63 = "[s5] «А? Ты, эм... Что?»\n[s6] «Я-я не знаю, польщён я или просто ошарашен...»"
1005805-66 = "Я хотела лично пригласить тебя сюда..."
1005805-67 = "...в надежде понять, почему моё сердце так себя ведёт."
1005805-68 = "И потому я немного подумала."
1005805-69 = "Возможно, дело в том, что с самого твоего назначения в Кивотосе один инцидент следовал за другим."
1005805-70 = ""
1005805-73 = "[ns] «...Да, пожалуй, всё действительно так и было.»"
1005805-74 = "Конечно, я предпочла бы мирный Кивотос, где никто не получает травм."
1005805-75 = "И поэтому я снова начала размышлять."
1005805-76 = "А что, если независимо от твоих намерений причиной всех этих инцидентов являешься именно ты?"
1005805-77 = "[s] «Прости, Мине?»"
1005805-78 = "Разве большинство проблем не решилось бы, если просто взять тебя под стражу?!"
1005805-79 = "[s7] «Кто-нибудь, помогите!!!»\n[s8] «Я невиновен! Невиновен!»"
1005805-82 = "Всё будет хорошо, Сенсей! Наши помещения известны как самые безопасные и удобные!"
1005805-83 = "Поскольку никакие другие организации к нам не причастны, нет места ни политическим конфликтам, ни каким-либо другим разногласиям!"
1005805-84 = "Ведь для нас, рыцарей, помощь — превыше всего!"
1005805-85 = "[s] «Мне кажется, ты сейчас сосредоточилась совсем не на том!»"
1005805-86 = "Обещаю, ты сможешь доверить нам и тело, и душу!"
1005805-87 = "Клянусь всем, что мне дорого: я освобожу тебя от всех внешних забот!"
1005805-88 = ""
1005805-92 = "[ns] «Нееееет!»"
1005805-94 = "...Вот что мне хотелось бы сказать."
1005805-95 = "Но будь всё так просто, жизнь была бы лёгкой для всех."
1005805-96 = "[s] «Отлично! Ты пришла в себя!»"
1005805-97 = "Нет. На самом деле я понимала это с самого начала."
1005805-98 = "Если бы ограничение твоей свободы решало проблему, я бы уже сто раз это сделала, Сенсей..."
1005805-99 = "Но я понимаю, что это нереалистично."
1005805-100 = "И это лишь моя интуиция, но..."
1005805-101 = "мне кажется, ограничение твоих перемещений может вызвать ещё более серьёзную проблему, Сенсей..."
1005805-102 = "[s] «Так в чём был смысл сегодняшнего чаепития?»"
1005805-103 = "Я слышала, что в последнее время ты часто помогаешь Рыцарям помощи."
1005805-104 = "Я хотела поблагодарить тебя за это и заодно немного выговориться."
1005805-105 = "[s9] «Это выговаривание было ужасно вредно для моего сердечно-сосудистого здоровья...»\n[s10] «Так значит, особого глубокого смысла во всём этом и не было...»"
1005805-108 = "Хи-хи."
1005805-109 = "Но разве не думаешь, что настоящая цель чаепития — делиться историями, которым не обязательно иметь какой-то великий смысл?"
1005805-110 = "Ещё раз спасибо, что нашёл для меня время, Сенсей."
