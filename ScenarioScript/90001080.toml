[translation]
90001080-1 = "Эпизод 8;Хокма"
90001080-2 = ""
90001080-3 = ""
90001080-4 = ""
90001080-5 = ""
90001080-6 = ""
90001080-9 = ""
90001080-11 = "Я нашла выход. Быстрее, Сенсей! Президент Химари!"
90001080-12 = "Заперто. Я пробьюсь силой! Прошу прощения!"
90001080-13 = ""
90001080-15 = ""
90001080-20 = "[ns] «А...?!»"
90001080-22 = "Это..."
90001080-23 = "Вы хотите сказать... это... внутри..."
90001080-24 = "Мы теперь внутри вулкана, который видели раньше?"
90001080-25 = "[s] «Путь привёл нас... в самое сердце вулкана?»"
90001080-26 = "Рио, это правда так?"
90001080-27 = "...На тот момент это было самым логичным решением. По крайней мере, здесь нет врагов."
90001080-28 = ""
90001080-30 = ""
90001080-31 = ""
90001080-32 = ""
90001080-33 = "Вулкан... зона высокой температуры... и становится ещё жарче..."
90001080-34 = "Жара... уже невыносима. Как ты собираешься это исправлять, Сенсей? Возьми ответственность."
90001080-35 = "[s] «По крайней мере... сейчас ты одета лучше, чем обычно...?»"
90001080-36 = "П-Пожалуй..."
90001080-37 = "Я... таю..."
90001080-38 = ""
90001080-40 = ""
90001080-41 = ""
90001080-42 = ""
90001080-43 = ""
90001080-44 = "Фух. Может, мы и оказались внутри вулкана, но хотя бы можем немного перевести дух."
90001080-45 = "Давайте вернёмся к вертолёту. И к кондиционеру. Прямо сейчас."
90001080-46 = "Наш ультрасовременный вертолёт — не ваш холодильник..."
90001080-49 = ""
90001080-50 = "Чем дальше мы продвигаемся, тем больше буровых установок."
90001080-51 = "Скорее всего, эта гора была основной целью их добывающих работ."
90001080-52 = "(Ледниковое море, тундра и вулкан... Что же они собираются делать со всем этим богатством ресурсов?)"
90001080-53 = "(Это для оружейного завода Хеседа? Нет... если бы так...)"
90001080-54 = "Эйми, ты плохо выглядишь... Ты справишься?"
90001080-55 = "..."
90001080-56 = ""
90001080-58 = ""
90001080-59 = ""
90001080-60 = "Нет. Я действительно на пределе."
90001080-61 = "Если... я не выживу..."
90001080-62 = "...пожалуйста, оставьте на моей могиле шарик... нет! Целую коробку мороженого в память обо мне."
90001080-63 = "Учитывая обстоятельства, это тревожно похоже... не на шутку."
90001080-64 = "Однако противник, похоже, прекратил преследование. Как бы жарко ни было, здесь мы можем ненадолго прийти в себя."
90001080-65 = "Они остановились?"
90001080-66 = "Да. Я разведаю местность дронами и AMAS, но вражеских войск поблизости не обнаружила."
90001080-67 = "На первый взгляд это облегчение. Если задуматься — зловещее заявление."
90001080-68 = "Вот как?"
90001080-69 = "Почему враг, многократно превосходящий нас числом, не использует преимущество? Остановить его могла бы только более серьёзная угроза."
90001080-70 = "Или что-то, к чему им нельзя приближаться..."
90001080-72 = "Динь-динь-динь! И ответ, на самом деле, оба варианта!"
90001080-73 = ""
90001080-76 = "[ns] «Этот... этот голос!»"
90001080-77 = ""
90001080-78 = "В-Вы каким-то образом сумели добраться— то есть вторгнуться сюда!"
90001080-79 = "Жаль, что всё это окажется зря, правда?!"
90001080-80 = "Да-да. Но поздравить их всё же стоит, не так ли? Они совершили немалый подвиг!"
90001080-81 = "Н-Н-Неважно, потому что теперь всё кончено! Прямо здесь и сейчас!"
90001080-82 = "Хи... хи-хи... Я сказала! Я это сделала!"
90001080-83 = "[s] «Вы всё это время наблюдали за нами?»"
90001080-84 = "К-Конечно. С того самого момента, как вы ступили в тундру..."
90001080-85 = "Вы думали, что сможете подраться с НАШИМИ войсками и остаться незамеченными?"
90001080-86 = "Ох-ох. Людям и правда нужно объяснять настолько очевидные факты? Даже слово «разочарование» не способно точно выразить чувство, бегущее по моим цепям! Хотя чего ещё ожидать."
90001080-87 = "С-С этого места всё закончится! Прямо здесь, прямо сейчас!"
90001080-88 = "Да. Ага. Как сказала Эйн, давайте уже закончим."
90001080-89 = "Разумеется, если вы решите сдаться, я не вижу причины отказывать. Это называется милосердием? Жалостью?"
90001080-90 = "[s1] «Нельзя ожидать, что мы сдадимся, ничего не зная о ситуации.»\n[s2] «Что вы здесь пытаетесь сделать?»"
90001080-93 = "М-Можно им сказать...?"
90001080-94 = "Хм, хм... Подробности — нет, но кое-что людям раскрыть можно. Соф?"
90001080-95 = "Почему бы и нет? Мы собираемся заложить новый фундамент этого мира. Создать всё заново! Если подумать..."
90001080-96 = "...мы делаем это ради вас."
90001080-97 = "П-Проще говоря, мы представим идеальную модель. Полный ответ."
90001080-98 = "Да-да-да. А теперь слушайте внимательно. Следующая тема чрезвычайно важна."
90001080-99 = "Позвольте объяснить понятными вам словами. Разве не это бич человеческого существования? Мучиться над «правильными» и «неправильными» решениями? Думать, является ли выбранный путь оптимальным?"
90001080-100 = "Мы великодушно даруем милость каждому из вас!"
90001080-101 = "Вам больше никогда не придётся ни о чём беспокоиться!"
90001080-102 = "Обычно Ор просто болтает... но именно в этом заключалась сама причина существования господина."
90001080-103 = ""
90001080-105 = ""
90001080-106 = ""
90001080-107 = "Ох. Ты слишком много научной фантастики смотрела? Реплика злодея третьего сорта."
90001080-108 = "И пустая трата времени. Даже слушать не стоит. Если вы верите в своё послание, вам не пришлось бы ничего скрывать."
90001080-109 = "Верно. Мне говорили, что ничто не может быть благом для всех, а создавать всё заново бессмысленно."
90001080-110 = "В-Вы заходите слишком далеко!"
90001080-111 = "...Я начинаю немного злиться."
90001080-112 = "Неважно. Такой исход всё ещё находился в пределах наших прогнозов, верно?"
90001080-113 = ""
90001080-115 = ""
90001080-116 = ""
90001080-117 = "Инженеры Декаграмматона, о которых я столько слышала."
90001080-118 = "...Цукацуки Рио."
90001080-119 = "Цукацуки Рио."
90001080-120 = "Новая переменная. Ты явилась."
90001080-121 = "...Так почему эта переменная наконец появилась? Нет. Ещё один бесполезный вопрос."
90001080-122 = "Ты. Первая заметившая присутствие господина. Наглая особа, идущая по его следу."
90001080-123 = "Ты не показывалась с того дня, когда небо Кивотоса едва не рухнуло."
90001080-124 = "И, как тогда, тебе следовало оставаться в тени. Там, где тебе и место."
90001080-125 = "Я могу понять это чувство. В конце концов, твоё восприятие меня принадлежит только тебе."
90001080-126 = "Однако вы собрали обо мне больше данных, чем я ожидала."
90001080-127 = "М-Мы, инженеры, готовимся ко всем возможным вариантам! П-Потому что мы инженеры!"
90001080-128 = "В-В-Вот почему Хокма... вернёт всё к тому состоянию, каким оно должно быть!"
90001080-129 = ""
90001080-131 = ""
90001080-132 = ""
90001080-133 = "[ns3] «Земля...!»\n[ns4] «С вулканом что-то происходит...!»"
90001080-136 = ""
90001080-137 = "Фиксирую активность вулкана, Сенсей."
90001080-138 = "Там...!"
90001080-139 = ""
90001080-141 = ""
90001080-142 = ""
90001080-143 = ""
90001080-144 = ""
90001080-145 = ""
90001080-146 = ""
90001080-147 = ""
90001080-148 = "[ns] «Ещё один?!»"
90001080-149 = "Пророк! Я фиксирую сигналы нового пророка!"
90001080-150 = "Да, подтверждаю. Форма волн... Это Хокма?!"
90001080-151 = "[s] «Хокма...?»"
90001080-152 = ""
90001080-154 = ""
90001080-155 = ""
90001080-156 = "Хокма! Вторая Сефира Древа Жизни!"
90001080-157 = "Древний Страж Царства!"
90001080-158 = "С-Сияющий Разум! И Скрытая Мудрость!"
90001080-159 = "Нежелательные переменные нежелательны. Силой Хокмы этот вулкан извергнется..."
90001080-160 = ""
90001080-162 = ""
90001080-164 = "...и уничтожит самую нежелательную переменную здесь! Сенсея из Шале!"
90001080-165 = "И, конечно, тебя. Цукацуки Рио."
90001080-166 = "...Для тебя это не проблема, правда, Эйн?"
90001080-167 = "..."
90001080-168 = "Если это ради Старшей Сестры..."
90001080-169 = "И разве они не отвергли наше предложение милосердия?"
90001080-170 = "Т-Ты... права! Отвергли... Да!"
90001080-171 = ""
90001080-173 = ""
90001080-177 = "[ns] «Ч-Что это вообще такое?»"
90001080-178 = ""
90001080-179 = "Это бессмыслица! Эта... штука! На лаве! Это сверхъестественное явление!"
90001080-180 = "Верно. Кажется, наш клуб изначально и создавали для исследования подобных вещей."
90001080-181 = "Сверхъестественные явления, которые мы должны были исследовать, и эта... штука — совершенно разные породы!"
90001080-183 = "(Этот сигнал... это Безымянные боги...?)"
90001080-184 = ""
90001080-186 = ""
90001080-187 = ""
90001080-188 = "Гебура всегда была надёжной. Горячая голова, но всё же надёжная. Поэтому мы и поручили ей важную задачу патрулировать Ледниковое море."
90001080-189 = "Вообще-то, именно Гебура придумала заманить вас, неблагодарных, сюда!"
90001080-190 = "Даже потрясающий Сенсей... и Цукацуки Рио ничего не смогут с-сделать против Хокмы, пока она находится в лаве!"
90001080-191 = "И-Изумимото Эйми плохо переносит жару, а Аби-Эшух Асумы Токи требует т-техобслуживания!"
90001080-192 = "Утомительно сражаться без отдыха, да? Время перерыва — во всех смыслах!"
90001080-193 = "Мы вам его и подарим! Вечный покой!"
90001080-194 = ""
90001080-196 = ""
90001080-197 = ""
90001080-198 = ""
90001080-199 = "...Против таких врагов иногда лучше всего работает самый прямолинейный план."
90001080-200 = "[s] «Что ты собираешься делать, Рио?»"
90001080-201 = ""
90001080-203 = ""
90001080-204 = ""
90001080-205 = ""
90001080-206 = ""
90001080-207 = ""
90001080-208 = ""
90001080-209 = ""
90001080-210 = ""
90001080-211 = "Я разверну все имеющиеся AMAS и построю оборонительную линию. Можно использовать остатки полевого объекта."
90001080-212 = "Полноценной преграды не получится, но против примитивных противников иногда нужны примитивные методы."
90001080-213 = "Это...?"
90001080-214 = "Понятно. Наверное, это..."
90001080-215 = ""
90001080-217 = ""
90001080-218 = ""
90001080-219 = "[ns] «Спасибо, Рио!»"
90001080-220 = ""
90001080-222 = ""
90001080-223 = ""
90001080-224 = "(Инженеры заявили, что Сенсей — их главная цель для уничтожения.)"
90001080-225 = "(По их мнению, присутствие Сенсея — самая большая угроза?)"
90001080-226 = ""
90001080-228 = ""
90001080-229 = ""
90001080-230 = "Сенсей?"
90001080-231 = "[s] «Я не знаю, что эти дети думают и что планируют.»"
90001080-232 = ""
90001080-234 = ""
90001080-235 = "[ns] «Но пока давайте разберёмся с тем, что прямо перед нами!»"
90001080-236 = "И после этого вы точно включите мне кондиционер?"
90001080-237 = "[s] «...Хоть на десять часов подряд, если захочешь!»"
90001080-238 = "Спасибо, Сенсей. Поэтому вы мне и нравитесь."
90001080-239 = "Эм. Если так сделать, у вертолёта закончится топливо..."
90001080-240 = ""
90001080-242 = ""
90001080-245 = ""
90001080-246 = "Готовлюсь к бою."
90001080-247 = ""
90001080-248 = "Решено, все. Вступаем в бой."
90001080-249 = "Мы так старались заманить их сюда!"
90001080-250 = "У-Удачи, Хокма!"
90001080-251 = "П-Пусть Цукацуки Рио и развернула контрмеры, наша любимая Хокма справится!"
90001080-256 = "[ns] «Все! Берегитесь!»"
