[translation]
83300400400-5 = "А, глава префектов. Вы уже разобрались с нарушителями?"
83300400400-6 = "Да. Но тот, кто их нанял, оказался достаточно умён и не оставил никаких данных, по которым его можно было бы опознать."
83300400400-7 = "Пожалуй, было бы слишком удобно раскрыть всю загадку, просто допросив одну группу нарушителей."
83300400400-8 = "Хм. Но если повезёт, больше мы об этом не услышим."
83300400400-9 = "Пожалуйста, оставьте уборку нам."
83300400400-10 = "Спасибо за вашу работу сегодня, глава префектов."
