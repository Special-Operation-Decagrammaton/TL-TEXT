1004803-43 = "[s] «П-Подождите! Давайте разберёмся.»"
1004803-45 = "Из объяснений Саори мне удалось понять ситуацию."
1004803-48 = "[ns1] «Ты нашла работу, но так и не подписала контракт?!»\n[ns2] «Тебе уже три дня не платят?!»"
1004803-49 = "Когда я начала работать, меня не просили подписывать контракт."
1004803-50 = "Когда я начала работать, меня не просили подписывать контракт."
1004803-51 = "Я просто делала то, что они просили..."
1004803-52 = "Сенсей?"
1004803-53 = "[ns] «Тебя обманули! Я этого так не оставлю.»"
1004803-56 = "Хмф! Обманули? Не выставляй нас злодеями."
1004803-57 = "Она сама забыла подписать контракт!"
1004803-58 = "Раз не подписала, мы не обязаны ей платить."
1004803-59 = "[s] «А как же работа, которую Саори уже выполнила...?!»"
1004803-60 = "Цк! Считай, это была волонтёрская работа."
1004803-61 = ""
1004803-63 = ""
1004803-64 = ""
1004803-66 = "Хотя она нам здорово помогла."
