[translation]
2004702-1 = "Рекомендованный метод операционного офицера"
2004702-3 = "[ns] «Кикё! Я пришёл!»"
2004702-4 = "Что? Уже?"
2004702-5 = "Тогда идите сюда, пожалуйста. Мне нужна ваша помощь."
2004702-8 = "[ns] «Привет...»"
2004702-10 = "[ns1] «...О!»\n[ns2] «Э-Это...?!»"
2004702-13 = ""
2004702-14 = "Почему такой удивлённый вид?"
2004702-15 = "Сейчас лето, разве нет? Разве это не подходящая одежда для сезона?"
2004702-16 = "[s] «Но почему ты в купальнике?»"
2004702-17 = "Из-за этой... штуки. Я собиралась её надуть."
2004702-18 = "Может, вместо того чтобы просто глазеть, вы принесёте пользу и поможете мне."
2004702-19 = "[s] «Эм, надувной бассейн прямо в клубной комнате?»"
2004702-20 = "Довольно полноценный отпуск, не находите?"
2004702-21 = "Мне не нужно далеко уходить, и я могу играть в воде так, чтобы никто меня не видел."
2004702-22 = "Хм?"
2004702-23 = "...У вас такой вид, будто хотите что-то сказать."
2004702-24 = "Ну же. Говорите."
2004702-25 = ""
2004702-27 = ""
2004702-28 = "Лучше будьте честны, Сенсей."
2004702-29 = "Я приложила к этому немало усилий."
2004702-30 = "...Это странно?"
2004702-31 = "[s3] «Вовсе нет!»\n[s4] «Ты отлично выглядишь в купальнике!»"
2004702-34 = "...В купальнике?"
2004702-35 = ""
2004702-37 = ""
2004702-38 = "...!"
2004702-39 = "Я спрашивала НЕ об этом! Я имела в виду бассейн, Сенсей."
2004702-40 = "[s] «Но он правда тебе идёт...»"
2004702-41 = "Это само собой разумеется. С чего бы мне спрашивать ваше мнение о том, что я—"
2004702-42 = ""
2004702-45 = "...Я знаю это лицо. Говорите уже."
2004702-46 = "А. И чтобы вы знали."
2004702-47 = "Ещё одного шанса я вам не дам."
2004702-48 = "Так что советую тщательно выбирать слова."
2004702-49 = "[s5] «П-Пожалуйста, дай мне шанс!»\n[s6] «Я скажу честно, что думаю!»"
2004702-53 = "Хорошо. Вернёмся к теме."
2004702-54 = "Что вы думаете о моём плане с надувным бассейном?"
2004702-55 = "Довольно приятно вот так устроить простой отпуск, разве нет?"
2004702-56 = "...Хм? Чем это отличается от сидения под кондиционером в офисе?"
2004702-57 = "..."
2004702-58 = "Я понимаю, что вы имеете в виду, но..."
2004702-59 = "Поход на пляж, к реке или даже купание в бассейне... Полагаю, когда уже доберёшься, в этом действительно есть свои прелести."
2004702-60 = "Но сама дорога довольно утомительна, разве нет?"
2004702-61 = "Я именно так и думаю. Поэтому и поставила здесь надувной бассейн."
2004702-62 = "[s] «Ты не любишь отдых на свежем воздухе?»"
2004702-63 = "Не то чтобы. Всё зависит от компании."
2004702-64 = "Полагаю, если с вами, я бы подумала об этом."
2004702-65 = "[s] «О, о! Тогда давай вместе на пляж!»"
2004702-66 = "Вдвоём... с вами?"
2004702-67 = "[s] «Я именно это и имел в виду... Что скажешь?»"
2004702-68 = "...Хм."
2004702-69 = "В таком случае нужно начинать планировать прямо сейчас. На надувные бассейны времени нет."
2004702-70 = "Когда вы можете поехать?"
2004702-71 = "Хм? Был ли именно такой исход моей целью с самого начала?"
2004702-72 = "Думайте что хотите."
2004702-73 = "Как бы то ни было, обещание уже дано. Я никогда не прощу вас, если теперь попытаетесь от него отказаться."
2004702-74 = "...Фуфу."
2004702-76 = "Кикё выглядела довольно счастливой, пока мы планировали отпуск."
