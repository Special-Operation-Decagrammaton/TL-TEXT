[translation]
10001070-1 = "Эпизод 7; Пудинг для пролетариата!"
10001070-2 = "Главная улица академии Красная Зима"
10001070-3 = "Эй, есть какие-нибудь особые планы на праздник?"
10001070-4 = "Не-а, просто проведу фестиваль дома с семьёй."
10001070-5 = "Да ладно тебе! Это же праздник, надо выбраться в центр или ещё куда-нибудь!"
10001070-6 = "К тому же слышала, что студсовет устраивает большой костёр на перекрёстке в третьем районе!"
10001070-7 = "Может, встретим там кого-нибудь особенного. Хи-хи..."
10001070-8 = "Ну... пожалуй, я смогу выкроить немного времени погулять..."
10001070-9 = "..."
10001070-10 = "Хмф... Ужасно! Совсем они мне не нравятся!"
10001070-11 = "Что случилось, президент Черино?"
10001070-12 = "Посмотрите на них! Посмотрите на всех этих студентов Красная Зима, которые разгуливают по улицам из-за фестиваля!"
10001070-13 = "Пока они развлекаются вовсю, я, самый влиятельный человек академии, страдаю... Ни должности, ни сладостей, ни сна!"
10001070-14 = "Это так несправедливо!"
10001070-15 = "Они должны узнать мою боль! Все эти любители фестивалей будут целый месяц полоть сорняки!"
10001070-16 = "[s] «Но как ты это сделаешь, если ты не президент?»"
10001070-17 = "О... И правда."
10001070-18 = "Тогда я запишу имена всех этих гуляк и накажу их, когда снова стану президентом!"
10001070-19 = "Главный секретарь Томоэ, запиши имена студентов, которые только что прошли мимо!"
10001070-20 = "Но президент Черино, разве не вы хотели, чтобы каждый студент насладился фестивалем?"
10001070-21 = "Если вы станете отменять собственные приказы по прихоти, ваша поддержка наверняка упадёт."
10001070-22 = "Н-но это несправедливо! Почему только я не могу наслаждаться фестивалем?"
10001070-23 = "Не могу терпеть несправедливость! Мы здесь верим в свободу и равенство!"
10001070-24 = "Раз уж мы здесь, почему бы нам не насладиться фестивалем вместе со студентами?"
10001070-25 = "Что ты имеешь в виду?"
10001070-26 = "Как президент, вы всегда руководили такими мероприятиями, поэтому, наверное, вам никогда не удавалось просто наслаждаться фестивалем вместе с остальными студентами."
10001070-27 = "Возможно, если вы насладитесь праздником как обычный студент, это даст идеи для следующего фестиваля."
10001070-28 = "А..."
10001070-29 = "Прекрасная идея!"
10001070-30 = "Понимать своих подчинённых — ещё одна обязанность лидера! Иногда важно отложить работу и взглянуть на жизнь глазами студенты!"
10001070-31 = "...И я, конечно же, совсем не использую это как оправдание, чтобы бездельничать!"
10001070-32 = "Ладно."
10001070-33 = "Первое место, которое требует исследования, — вон та кондитерская! Полный вперёд, товарищ!"
10001070-35 = ""
10001070-36 = ""
10001070-37 = "*ням-ням* Ого... Как вкусно!"
10001070-38 = "Мёд в этом медовике такой сладкий! Я могла бы есть его каждый день!"
10001070-39 = "Черино, у тебя на усах крем."
10001070-40 = ""
10001070-41 = "Томоэ! Я не ребёнок! Не трогай мои усы когда тебе вздумается!"
10001070-42 = "Если не считать этого происшествия с усами, я только что поняла, что потратила все карманные деньги на этот месяц. Иван Купала опасен для моего кошелька..."
10001070-43 = "Теперь понятно, почему все торговцы Кивотоса выставляют на фестиваль свои сладости."
10001070-44 = "Хорошо, товарищ. Куда отправимся развлекаться... то есть исследовать дальше?"
10001070-45 = "[s] «Посмотри на эту огромную кучу дров.»"
10001070-46 = "Дров?"
10001070-47 = "А, это не дрова. Наверное, это алтарь, который строит Рабочая партия!"
10001070-48 = "Я лично велела им построить алтарь для традиционного сожжения огромной весенней куклы."
10001070-49 = "[s] «Всё равно похоже просто на кучу дров.»"
10001070-50 = ""
10001070-51 = "Ну... тут ты прав. Без украшений это и правда не очень похоже на алтарь..."
10001070-52 = "Фестиваль скоро начнётся, почему он до сих пор не готов?"
10001070-53 = "Эти лентяи! Они что, пытаются сорвать фестиваль?"
10001070-54 = "Успокойтесь, президент. Возможно, произошло недоразумение."
10001070-55 = "Недоразумение?! Лодырям, которые не заканчивают работу вовремя, не место в нашей академии! Всем взыскания!"
10001070-56 = "Но это не то место, где вы велели им строить алтарь. Он должен быть на площади перед зданием секретариата. Эта конструкция, должно быть, вообще не связана с фестивалем."
10001070-57 = "П-правда? Тогда что это за куча обломков дерева?"
10001070-58 = "Рядом собрались студенты из Рабочей партии. Давайте спросим у них."
10001070-61 = "Здравствуйте, товарищи! Как продвигается работа...?"
10001070-62 = ""
10001070-64 = ""
10001070-66 = ""
10001070-67 = "Мы ничьи не рабы! Мы станем хозяевами мира!"
10001070-69 = ""
10001070-70 = "ДА-А-А!"
10001070-72 = "Ч-что, чёрт возьми, происходит...?"
10001070-73 = "Товарищи, до начала Ивана Купалы осталось всего несколько дней."
10001070-74 = "Но что такое Иван Купала, если не время праздновать дары природы, отбросить зимнее солёное мясо и хлеб и насладиться свежими плодами солнца?"
10001070-75 = "Студенты Красная Зима не исключение из этой традиции. Мы имеем право наслаждаться фестивалем!"
10001070-76 = "Верно!"
10001070-77 = "Мы тоже хотим праздновать!"
10001070-78 = "Но вместо отдыха нас заставляют день и ночь работать в двойные смены на морозе!"
10001070-79 = "Это вопиющее нарушение ценностей свободы и равенства академии Красная Зима, поэтому мы осуждаем секретариат!"
10001070-80 = "ДА!"
10001070-81 = "Проваливайте!"
10001070-82 = "Президент Черино и остальные руководители должны гарантировать права Рабочей партии!"
10001070-83 = "Пока нам не гарантируют нормальный отдых, доплату и, э-э... два пудинга, забастовка продолжится!"
10001070-84 = "ДА-А-А!"
10001070-85 = ""
10001070-86 = "Бастуем!"
10001070-88 = "Стойте-стойте-стойте! Кто разрешил вам устраивать протесты?!"
10001070-89 = "Такое поведение без прямого разрешения секретариата карается взысканием! Все будете жестоко наказаны за неповиновение!"
10001070-90 = "...Президент Черино?"
10001070-91 = "Не знаю, что вы здесь делаете, но это отличный шанс!"
10001070-92 = "Товарищи! Схватить коварную президента Черино и привязать её к столбу!"
10001070-93 = ""
10001070-96 = ""
10001070-97 = ""
10001070-98 = ""
10001070-99 = ""
10001070-100 = ""
10001070-101 = "П-погодите! Отпустите меня! Вы знаете, кто я такая?!"
10001070-102 = ""
10001070-103 = "В-вы сейчас сказали «к столбу»? Я думала, это алтарь, а это правда просто дрова?"
10001070-104 = ""
10001070-105 = "...В-вы ведь не собираетесь сжечь меня на костре?!"
10001070-106 = ""
10001070-107 = "А...? Это, конечно, революция, но мы бы никогда не сделали ничего настолько ужасного."
10001070-108 = ""
10001070-109 = "Но ты всё равно ужасный лидер, сваливающий всю работу на нас! Твоему угнетательскому правлению должен прийти конец!"
10001070-110 = ""
10001070-111 = "Товарищи! Выставим эту униженную деспотку на улицах нашей академии как символ нашего нового будущего!"
10001070-112 = ""
10001070-113 = "ДА!"
10001070-114 = ""
10001070-115 = "Долой её! Долой!"
10001070-116 = ""
10001070-117 = "П-погодите! Если так связывать, вы мне руку сломаете!"
10001070-118 = ""
10001070-119 = "Ай! Т-товарищ! Томоэ! Помогите!"
