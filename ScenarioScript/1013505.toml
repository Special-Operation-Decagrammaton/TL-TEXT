[translation]
1013505-1 = "Мне нужна помощь"
1013505-2 = "Я срочно отправился в Миллениум!"
1013505-3 = ""
1013505-6 = ""
1013505-7 = "Попалась, Кей-Кей!"
1013505-8 = "П-Пожалуйста, отпусти меня!"
1013505-9 = "Тебе разве с нами не нравится, Кей-Кей?"
1013505-10 = "Дело не в этом, н-но... Ну..."
1013505-11 = "Ой, она смущается! Видишь, я же говорила. У неё своё собственное очарование, совсем не такое, как у Арис."
1013505-12 = "(Почему Арис можно быть просто «Арис», а я обязана быть «Кей-Кей»?)"
1013505-13 = ""
1013505-15 = ""
1013505-16 = "[ns1] «Я волновался, что дело срочное...»\n[ns2] «А это просто „Время тискать Кей-Кей“.»"
1013505-19 = "Сенсей?! Как вовремя! Как учитель, спасите студента в беде—"
1013505-20 = "О, Сенсей! Здравствуйте, Сенсей!"
1013505-21 = "Хотите присоединиться к нашему «Времени тискать Кей-Кей»? Отлично снимает стресс."
1013505-22 = "[s] «Конечно хочу!»"
1013505-23 = "Что?!"
1013505-24 = "..."
1013505-26 = "Я БЫЛА ИДИОТКОЙ, ЧТО ДОВЕРИЛАСЬ ЭТОМУ ВЗРОСЛОМУ!"
1013505-28 = ""
1013505-29 = "Так ты сестра-близнец Арис, да?"
1013505-30 = "А? Д-Да... Что-то... вроде того. Да..."
1013505-31 = "Ого, наверное, это так весело. Два комплекта в GDD. Но погоди! Волосы! У вас прямо противоположные оттенки."
1013505-32 = "О! Понятно! Вы разнояйцевые близнецы!"
1013505-33 = "Эм... Ух... Да... Пусть будет так..."
1013505-34 = "Теперь МОЯ очередь дать Кей-Кей особый квест!"
1013505-35 = "Опять это..."
1013505-36 = "О, тебе не нравится?"
1013505-37 = "Дело не в этом—!"
1013505-38 = ""
1013505-40 = ""
1013505-41 = "..."
1013505-42 = "...Не то чтобы мне совсем не нравилось."
1013505-43 = "Просто немного неловко, и я к этому не привыкла, так что..."
1013505-45 = "О-о-о-о-о!"
1013505-47 = "Ух, у меня ужасное предчувствие...!"
1013505-49 = "Кей-Кей такая милая!!"
1013505-50 = ""
1013505-52 = ""
1013505-53 = ""
1013505-54 = "[ns] «Кей-Кей И ПРАВДА такая милая!!»"
1013505-55 = "Почему ты к ним присоединяешься?!"
1013505-56 = "Кстати, не отнесёшь это в лекционный зал в соседнем здании?"
1013505-57 = "А, хорошо... Это квест по доставке, да?"
1013505-58 = "Да. И в этот раз награда выдаётся заранее. Вот, держи это ожерелье."
1013505-59 = "...!"
1013505-60 = "Оно... довольно красивое."
1013505-61 = "Украшения не настолько вычурные, чтобы отвлекать внимание, а драгоценный камень имеет синеватый металлический блеск и лёгкий жёлтый оттенок..."
1013505-62 = "Э-Это выглядит довольно ценным. Вы уверены, что мне можно его взять?"
1013505-64 = "Всё нормально, всё нормально. Это просто остатки материалов из Клуба разработки новых материалов. Иначе мы бы их переработали."
1013505-65 = "Это искусственный алмаз. Если посмотреть на его базовый состав, то это всего лишь углерод!"
1013505-67 = "Понятно... Искусственные алмазы сильно продвинулись, да?"
1013505-69 = "Тогда оставляем это тебе!"
1013505-70 = "Приходи к нам, если понадобятся новые квесты!"
1013505-72 = "Ха... да. Н-Нет, спасибо... Думаю, этого хватит."
1013505-73 = "...?"
1013505-74 = "И долго ты ещё собираешься там стоять, Сенсей? И что это за лицо?"
1013505-75 = "[s] «Ну, просто...»"
1013505-76 = "...Просто?"
1013505-77 = "[s] «Для меня честь стать свидетелем чего-то настолько потрясающего!»"
1013505-78 = "Ааааааах!!"
1013505-80 = ""
1013505-81 = "Ух, серьёзно... Почему всё внимание всегда достаётся мне...?"
1013505-82 = "Стоп, стоп. Я знаю, что ты сейчас скажешь. Что это так прекрасно, когда тебя ценят и лелеют, или что-то такое."
1013505-83 = "...Ой, хватит дуться! Серьёзно, ты такой—!"
1013505-84 = "[s] «Ну как тебе школьная жизнь?»"
1013505-85 = "..."
1013505-86 = "Ну, неплохо. Нормально."
1013505-87 = "[s] «Мой переводчик с языка Кей говорит, что это значит: „Мне очень нравится! Это чудесно!“»"
1013505-88 = "Не веди себя так странно! Зачем ты меня переводишь?! Мы говорим на одном языке."
1013505-89 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
1013505-90 = "Послушай, я выполняю квест, так что, пожалуйста, не мешай."
1013505-91 = "А? Я сказала, что выполняю квес..."
1013505-92 = "...!!"
1013505-93 = "П-Поручение!! Поручение!"
1013505-94 = "Убери это довольное выражение с лица!"
1013505-95 = "[s] «Я ничего не сказал!»"
1013505-96 = "И даже не начинай!"
1013505-97 = "[s] «А как же свобода слова?»"
1013505-98 = "Ты — ИСКЛЮЧЕНИЕ, Сенсей!"
1013505-99 = "О, это Кей. Что случилось?"
1013505-100 = ""
1013505-102 = ""
1013505-103 = ""
1013505-105 = ""
1013505-106 = "А...? Как вовремя. Мне дали квес— то есть, ПОРУЧЕНИЕ доставить это."
1013505-107 = "Посмотрим... Ага, результаты пришли. Сверхпроводимость этого металлического соединения составляет..."
1013505-108 = "Без обид, но разве это нельзя было отправить по электронной почте?"
1013505-109 = "В большинстве случаев я бы согласилась, но этот — исключение."
1013505-110 = "Почему?"
1013505-111 = "Из соображений безопасности! Результаты разрешено знать только нашему клубу. Мы не можем допустить утечки конфиденциальных данных другим группам!"
1013505-112 = "У интернета всего два недостатка: уязвимости безопасности и ограничения на хранение данных!"
1013505-113 = "А, понимаю. Это одна из главных причин, почему так сложно окончательно уничтожить данные, записанные на магнитную ленту."
1013505-114 = "Будь у меня средства, я бы архивировала всю нашу работу на кристаллических дисках — целую гору! Но вряд ли это случится."
1013505-115 = "Кстати, Кей. Раз уж ты проделала весь этот путь, чтобы найти меня, как насчёт сходить в игровой зал?"
1013505-116 = "А-А? Ну..."
1013505-117 = "Хм? Что такое? В прошлый раз тебе так понравилось."
1013505-118 = "Понравилось! То есть, я хотела сказать..."
1013505-119 = "[s] «Ага! Значит, Кей-Кей тоже любит игры!»"
1013505-120 = "Именно, Сенсей! Вы бы удивились! Она очень увлекается!"
1013505-121 = "Нет! Дело, ну, это был всего лишь...!"
1013505-122 = "А...? О, то есть тебе не понравилось? Ты пошла только потому, что чувствовала давление?"
1013505-123 = "И это тоже не так! Я вообще не это пытаюсь сказать!"
1013505-124 = ""
1013505-126 = ""
1013505-127 = "[ns] «Тогда в чём дело, Кей-Кей?»"
1013505-128 = "Т-Т-Ты—"
1013505-130 = "ТЫ УЖАСНЫЙ ВЗРОСЛЫЙ, РАЗ ПРИТВОРЯЕШЬСЯ, БУДТО НЕ ПОНИМАЕШЬ. ТЫ ПРЕКРАСНО ЗНАЕШЬ, ЧТО ПРОИСХОДИТ!"
