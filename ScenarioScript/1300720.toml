[translation]
1300720-1 = "Результаты упорного труда"
1300720-4 = ""
1300720-5 = ""
1300720-6 = "Джунко вбежала внутрь, тяжело дыша."
1300720-7 = "[s1] «Добро пожаловать.»\n[s2] «Теперь я узнаю, что ты закончила?»"
1300720-10 = "Хи-хи-хи. Готовься!"
1300720-11 = "Это... гастрономический блокнот района Шиба!"
1300720-12 = "[s] «Гастрономический блокнот?»"
1300720-13 = "Ага! Сборник мест, где стоит поесть."
1300720-14 = "Я записывала туда все рестораны, в которых бывала."
1300720-15 = "К сожалению, я не могу посетить вообще каждый ресторан Кивотоса..."
1300720-16 = "Поэтому разделяю всё по районам."
1300720-17 = "И смотри! Я закончила со всеми заведениями Шиба!"
1300720-18 = "[s] «Подожди, то есть ты побывала в каждом ресторане района Шиба?»"
1300720-19 = "Эм... Если честно, не совсем в каждом."
1300720-20 = "...Только НИКОМУ не рассказывай, но у меня есть хитрость, которая экономит время и деньги."
1300720-21 = "Я хожу только в рестораны, которые Харуна ещё не взорвала."
1300720-22 = "Неплохой первый фильтр, чтобы понять, стоит ли ресторан внимания."
1300720-23 = "[s3] «П-пожалуй, в этом есть смысл...»\n[s4] «Неужели можно позволить Обществу гурманов и дальше вести себя так...?»"
1300720-26 = "В-В любом случае!"
1300720-27 = "Главное, что я обошла все популярные места Шиба. И записала их в блокнот!"
1300720-28 = "[s] «А разве нельзя просто посмотреть отзывы в интернете?»"
1300720-29 = "Ну, знаешь, говорят, опыт — лучший учитель. Без обид, Сенсей. Хи-хи-хи."
1300720-30 = "Интернет-отзывам нельзя полностью доверять. Никогда не знаешь, кому заплатили или кто просто пытается попасть в тренды."
1300720-31 = "И даже если отзыв честный, он всё равно основан на чужих вкусах."
1300720-32 = "А чужие вкусы вовсе не обязаны совпадать с твоими."
1300720-33 = "А мой блокнот — уникальный ресурс: список ресторанов, подобранный именно под меня!"
1300720-34 = "[s5] «Единственный в своём роде? Правда?»\n[s6] «Гастрономия сложна...»"
1300720-37 = "Чтобы отметить завершение блокнота... Пора посетить ресторан №1 в районе!"
1300720-38 = "И ты идёшь со мной. Готовься, Сенсей!"
1300720-39 = "[s] «О? Хочешь, чтобы я пошёл?»"
1300720-40 = "Конечно! Но не волнуйся, сегодня плачу я."
1300720-41 = ""
1300720-49 = "Ух ты. Было очень вкусно! А тебе как, Сенсей?"
1300720-50 = "[s] «Это было лучшее!»"
1300720-51 = "М-м... Рада, что тебе так понравилось."
1300720-52 = "Для меня это не столько «лучшее место», сколько ресторан с отличным соотношением цены и качества."
1300720-53 = "Это лишь моё мнение, но хороший ресторан должен действительно насыщать посетителей. Уходить нужно сытым."
1300720-54 = "Поэтому выгодность так важна."
1300720-55 = "Но просто дешёвым быть недостаточно. Нужно найти баланс между ценой и вкусом."
1300720-56 = "[s] «Гастрономия ОЧЕНЬ сложная штука.»"
1300720-57 = "Ладно, идём! Простите! Можно счёт?"
1300720-58 = "[s7] «Кстати, о счёте...»\n[s8] «Я заплачу.»"
1300720-61 = "Что?"
1300720-62 = "О, ты хочешь, чтобы я поделилась блокнотом?"
1300720-63 = "[s9] «Мне как раз нужны рекомендации ресторанов поблизости.»\n[s10] «Так что поделись блокнотом, а я угощу тебя ужином в благодарность.»"
1300720-66 = "Эм... Но сегодня я должна платить за тебя."
1300720-67 = "Если заплатишь ты, всё пойдёт не по плану."
1300720-68 = "Иногда нужно позволять мне платить..."
1300720-69 = "Мне неловко, если я никогда не могу отплатить за добро."
1300720-70 = "[s11] «Хе-хе-хе. Но ты не учла одну вещь...»\n[s12] «Ты не смогла предсказать действия коварного учителя.»\n[s13] «Я украду плоды твоего труда всего за один ужин!»"
1300720-74 = "..."
1300720-75 = ""
1300720-77 = ""
1300720-78 = "Хахаха, ну хватит..."
1300720-79 = "Тогда, похоже, выбора у меня нет!"
1300720-80 = "Кто способен перехитрить учителя?"
1300720-82 = "Мы отлично провели время с ликующей Джунко."
