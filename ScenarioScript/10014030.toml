[translation]
10014030-1 = "Эпизод 3; Раздельные ингредиенты"
10014030-5 = "О! Я не знала, что вы здесь, Сенсей!"
10014030-6 = "[s] «Привет, Айри.»"
10014030-7 = "Привет и добро пожаловать! Что привело вас сюда?"
10014030-8 = "А? Сенсей?"
10014030-9 = "Ого! Вы не говорили, что заглянете. Что случилось?"
10014030-10 = "[s1] «Без причины... просто решил проверить, как вы.»\n[s2] «Просто зашёл ненадолго.»"
10014030-11 = "Хмф. Не ожидала, что именно Сенсей станет врать нам прямо в лицо."
10014030-12 = "Хмф. Не ожидала, что именно Сенсей станет врать нам прямо в лицо."
10014030-13 = "Вы явно пришли не просто проверить наше самочувствие. Выкладывайте!"
10014030-14 = "Ч-Что...?"
10014030-15 = "Вы хотите, чтобы Я «выложила» всё?"
10014030-16 = "А? Что вы вообще говорите?"
10014030-17 = "П-Простите, Сенсей! Ч-Что нам вам рассказывать?"
10014030-18 = "Айри?! Почему ты паникуешь?"
10014030-19 = "Ч-Что происходит? У нас проблема?!"
10014030-20 = "Похоже, мы с вами думаем об одном, Сенсей."
10014030-22 = "...Нацу?"
10014030-23 = ""
10014030-24 = "Больше нет смысла избегать правды."
10014030-25 = "Тревоги Сенсея — наши тревоги. А наши тревоги — тревоги Сенсея."
10014030-26 = "Наши мысли направлены к одной цели."
10014030-27 = "Дорога ведёт к единственной и неповторимой Кёяме Казусе."
10014030-28 = "Нацу..."
10014030-29 = "Что?"
10014030-30 = "Эй? Кто-нибудь объяснит мне, что происходит?"
10014030-31 = "Ёшими, ты уже забыла, что было вчера?"
10014030-32 = "А? Вчера?"
10014030-33 = "О! Ты про ту странную девчонку, которая пришла драться с Казусой?"
10014030-34 = "[s3] «Я так и думал.»\n[s4] «Значит, вы уже встречали Рейсу.»"
10014030-35 = "Откуда вы знаете, Сенсей?! И почему все так разволновались из-за какой-то драки?"
10014030-36 = "Откуда вы знаете, Сенсей?! И почему все так разволновались из-за какой-то драки?"
10014030-37 = "Казуса сильная и с характером. Наверняка в прошлом она со многими дралась."
10014030-38 = "Ей просто нужно научиться быть добрее к друзьям! Ха-ха-ха!"
10014030-39 = "[s5] «...Можно посмотреть и так.» \n[s6] «Они воспринимают её не так, как те...»"
10014030-40 = "Сенсей, вы бормочете. Я не расслышала."
10014030-41 = "Сенсей, вы бормочете. Я не расслышала."
10014030-42 = "Думаю, в этом и был смысл, Ёшими..."
10014030-43 = "Но дело было не столько в драке, сколько в поведении Казусы во время неё. Она будто стала другим человеком!"
10014030-44 = "Попробую объяснить, Ёшими."
10014030-45 = ""
10014030-47 = ""
10014030-48 = "Хотя нет, забудь. Хи-хи."
10014030-49 = "Мне правда нравится, насколько прямо ты смотришь на мир."
10014030-50 = "...?"
10014030-51 = "Что за чёрт! Я запуталась! И меня это бесит!"
10014030-52 = ""
10014030-54 = ""
10014030-55 = "В любом случае, у Сенсея, наверное, были похожие опасения. Вы пришли обменяться информацией?"
10014030-56 = "Я чувствую напряжение в воздухе. Если пойдём по этой дороге, пути назад может не быть."
10014030-57 = "Но Сенсей не из тех, кто строит заговоры. Он не злодей этой истории."
10014030-58 = "Так что, возможно, Сенсей действительно пытается помочь, как герой."
10014030-59 = "Но почему тогда Сенсей пришёл с завуалированными вопросами и секретами?"
10014030-60 = "Кажется, я знаю..."
10014030-61 = "Сенсей — главный герой романтического романа. Он пришёл проверить, как мы все, потому что такова его природа."
10014030-62 = "[s7] «Она снова за своё.» \n[s8] «В любом случае, рад, что всё вроде нормально.»"
10014030-63 = "Н-Ну, спасибо за рассказ, Нацу. Я рада, что мы все хотим для Казусы лучшего."
10014030-64 = "Н-Ну, спасибо за рассказ, Нацу. Я рада, что мы все хотим для Казусы лучшего."
10014030-65 = "Я мало знаю об Узаве Рейсе, но..."
10014030-66 = "У каждого есть прошлое и свой багаж. Это никогда не изменит моё мнение о Казусе."
10014030-67 = "Естественно. В этом и есть романтика нашей нерушимой дружбы."
10014030-68 = "Если мы разойдёмся только потому, что ингредиенты имеют разный вкус и происхождение, десерт никогда не получится."
10014030-69 = "Клуб сладостей после школы знает это лучше всех."
10014030-70 = "Если мы можем чем-то помочь, пожалуйста, скажите."
10014030-71 = "Мы хотим помогать Казусе всеми силами, как и вы!"
10014030-73 = ""
10014030-74 = "...Не понимаю."
10014030-75 = "Почему мы раздуваем такую проблему из пары драк?!"
10014030-76 = "Детям полезно драться! Это помогает развиваться и расти!"
10014030-77 = "[s9] «Ты говоришь так, будто сама не ребёнок.» \n[s10] «Кстати о росте, Ёшими...»"
10014030-78 = "Да хватит, Сенсей! Я просто говорю как есть!"
10014030-79 = "Да хватит, Сенсей! Я просто говорю как есть!"
10014030-80 = "Вы ведёте себя так, будто Казуса была в банде или типа того! Уверена, всё нормально."
10014030-81 = "Уgh, Сенсей! Это всё из-за вас!"
10014030-82 = "Вы постоянно ходите и раздуваете из глупостей огромную проблему...!"
10014030-83 = ""
10014030-86 = "А? Что это?"
10014030-87 = "Это ваша фотография, Сенсей? Кажется, вы её уронили."
10014030-88 = "[s] «О, это...»"
10014030-90 = "[ns11] «Погоди, стой!»\n[ns12] «Не смотри!»"
10014030-91 = "Что?! Почему? Я посмотрю."
10014030-92 = "Что?! Почему? Я посмотрю."
10014030-93 = "О... Это фото... Это..."
10014030-95 = "Длинное пальто, злой взгляд, маска под подбородком... Наверняка из банды."
10014030-96 = "...? Погоди, это лицо..."
10014030-97 = "Лицо? Какое лицо? О..."
10014030-98 = "...!"
10014030-99 = ""
10014030-101 = ""
10014030-102 = ""
10014030-103 = ""
10014030-104 = ""
10014030-105 = "ЧЕГООООО?!"
