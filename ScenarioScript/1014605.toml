[translation]
1014605-1 = "The Shy Council President's Summer"
1014605-2 = "(Concerned about Makoto's behavior, I visited the Pandemonium Society.)"
1014605-3 = "(And then...)"
1014605-7 = "[ns] \"Everyone, by any chance...\""
1014605-9 = "N-no!"
1014605-10 = "We don't know anything!"
1014605-11 = "Yes, we haven't seen Council President Makoto!"
1014605-15 = "[ns] \"...?\""
1014605-17 = "(And then...)"
1014605-19 = "Hm? Council President Makoto? Who's that?"
1014605-20 = "Oh, you mean the person who always dresses flashily and brings her personal guard everywhere?"
1014605-21 = "If it's her, I saw her heading toward the infirmary."
1014605-22 = "Ah~ I'm so jealous~ #nMaybe I should skip class too~"
1014605-24 = "(And furthermore...)"
1014605-26 = "Council President Makoto?"
1014605-27 = "She was here until just a moment ago, but..."
1014605-28 = "She seemed nervous and flustered for some reason. #nShe didn't seem to have any injuries, though..."
1014605-29 = "She left in such a hurry that I'm not sure if she'll be back."
1014605-30 = "If she returns, I'll let her know you were looking for her."
1014605-40 = "(I spent the whole day searching for Makoto, but we kept missing each other, and I couldn't find her.)"
1014605-44 = "[ns] \"...?\""
1014605-46 = "Is this really going to be okay...?"
1014605-47 = "I don't think there are any students left this late, are there?"
1014605-48 = "That's true, but..."
1014605-53 = "[ns] \"What is this...\""
1014605-56 = "Hm? What is it? Did Sensei come back again?"
1014605-57 = "But, the fact that I, Makoto, am hiding here—"
1014605-60 = "...?"
1014605-61 = "S-Sensei!? What is the meaning of this?"
1014605-62 = "[s1] \"I saw this posted up.\"\n[s2] \"'Pool Reserved'...\""
1014605-68 = "[ns3] \"I figured...\"\n[ns4] \"that only Makoto would do something like this.\""
1014605-71 = "W-what did you say!?"
1014605-72 = "Ugh! To think that my, Makoto's, scheme would backfire like this...!"
1014605-73 = "[s5] \"I happened to overhear you earlier...\"\n[s6] \"Were you avoiding me, by any chance?\""
1014605-76 = "T-that is...!"
1014605-77 = "..."
1014605-78 = "Since it's come to this, there's no point in saying anything else."
1014605-79 = "...That's right. I was avoiding you, Sensei."
1014605-80 = "The reason is as I mentioned on MomoTalk—"
1014605-85 = "—It is because I have become aware of my own feelings."
1014605-86 = "...Sensei of Schale."
1014605-87 = "I proposed a deal to you once before, didn't I?"
1014605-88 = "You turned it down back then, but... #nCould you listen to a new proposal from me, Makoto, once more?"
1014605-91 = "[wa:1590]― [log=마코토 수영복]I am—[/log] "
1014605-93 = "― [log=마코토 수영복]always standing as the representative of the Pandemonium Society and Gehenna.[/log] "
1014605-96 = "― [log=마코토 수영복]That is precisely why,[/log] "
1014605-98 = "― [log=마코토 수영복]I haven't been able to face my own desires and feelings.[/log] "
1014605-101 = "[ns] (Is that really how it was...?)"
1014605-103 = "[wa:1070]― [log=마코토 수영복]But, Sensei of Schale.[/log]"
1014605-105 = "― [log=마코토 수영복]This proposal is not as the President of the Pandemonium Society, but a personal one.[/log]"
1014605-108 = "― [log=마코토 수영복]I will admit it. Sensei has perhaps become...[/log] "
1014605-110 = "― [log=마코토 수영복]a somewhat special existence to me.[/log] "
1014605-113 = "[wa:1240]― [log=마코토 수영복]Even if I have to pay a price—[/log] "
1014605-115 = "― [log=마코토 수영복]you have become an object that I must obtain.[/log] "
1014605-118 = "[ns] \"An object that you must obtain...?\""
1014605-120 = "[wa:1200]― [log=마코토 수영복]No, secure...? Capture, perhaps?[/log] "
1014605-122 = "― [log=마코토 수영복]...I do not know how I should express this feeling.[/log] "
1014605-125 = "[wa:550]― [log=마코토 수영복]That's right. If I had to force it—[/log] "
1014605-127 = "― [log=마코토 수영복]—become mine.[/log] "
1014605-130 = "...It shouldn't be a bad proposal."
1014605-131 = "Before, I, Makoto, offered to give you half of Kivotos, but you refused."
1014605-132 = "I am not foolish enough to repeat the same mistake. Besides, this proposal is worth more."
1014605-133 = "That's right... Kivotos is nothing compared to this."
1014605-134 = "Making you mine means—you, too, will be able to hold me in your hands."
1014605-135 = "There is no other proposal more attractive than this, is there?"
1014605-139 = "[ns7] \"...I appreciate the sentiment, but.\"\n[ns8] \"I have no intention of becoming anyone's 'property'.\""
1014605-145 = "[ns] \"Because I am everyone's Sensei.\""
1014605-146 = "Cough, cough...!"
1014605-147 = "Cough, cough..."
1014605-148 = "I-I see..."
1014605-149 = "No, I am relieved. That is how Sensei should be."
1014605-150 = "I, Makoto, am not... #nI am not shaken in the slightest."
1014605-151 = "...It has become quite late. #nI shall have my limousine take you to Schale."
1014605-152 = "...I would appreciate it if you did not refuse this."
1014605-154 = "(Since it would be difficult to refuse any further, I decided to ride in the limousine Makoto had prepared and head back.)"