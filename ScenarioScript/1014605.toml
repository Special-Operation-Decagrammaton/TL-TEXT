[translation]
1014605-1 = "Застенчивое лето председателя"
1014605-2 = "Я всё ещё переживал за Макото и решил навестить её в клубной комнате Общества Пандемониума."
1014605-3 = "Но, когда я пришёл..."
1014605-4 = ""
1014605-5 = ""
1014605-6 = ""
1014605-7 = "[ns] «Эй, вы случайно не...»"
1014605-8 = ""
1014605-9 = "Н-Нет!"
1014605-10 = "Мы ничего не знаем!"
1014605-11 = "Не-а! Мы её не видели!"
1014605-12 = ""
1014605-14 = ""
1014605-15 = "[ns] «...?»"
1014605-17 = "А потом..."
1014605-18 = ""
1014605-19 = "А? Председатель Макото? Это ещё кто?"
1014605-20 = "А, та расфуфыренная особа, вокруг которой вечно толпа охранников и которая ни на секунду не замолкает?"
1014605-21 = "В медпункте, кажется. Или где-то там."
1014605-22 = "Ух, неплохо. Может, и мне прогулять занятия."
1014605-24 = "А потом..."
1014605-26 = "Макото?"
1014605-27 = "Ага, только что была здесь."
1014605-28 = "На вид не ранена, просто немного тревожная, будто на иголках."
1014605-29 = "И когда она уходила, у меня было чувство, что возвращаться она не собирается."
1014605-30 = "Но если вернётся, передам, что вы заходили."
1014605-40 = "Я продолжал искать Макото, но каждый раз казалось, что я разминулся с ней буквально на шаг."
1014605-41 = ""
1014605-44 = "[ns] «...?»"
1014605-45 = ""
1014605-46 = "Неужели так и правда можно...?"
1014605-47 = "Какой зануда вообще торчит в академии так поздно ночью?"
1014605-48 = "Наверное..."
1014605-49 = ""
1014605-51 = ""
1014605-53 = "[ns] «Это...»"
1014605-56 = "А? Что?! Сенсей снова меня нашёл?!"
1014605-57 = "Но ведь я здесь прячусь..."
1014605-59 = ""
1014605-60 = "...?"
1014605-61 = "С-Сенсей?! Что вы здесь делаете?!"
1014605-62 = "[s1] «Снаружи висело такое объявление».\n[s2] «О сдаче школьного бассейна в аренду...»"
1014605-65 = ""
1014605-68 = "[ns3] «По-моему, на такое могла решиться...»\n[ns4] «...только Макото»."
1014605-71 = "Вы серьёзно?!"
1014605-72 = "Ух, вот чего я не предусмотрела! Подумать только, собственная гениальность меня и подвела...!"
1014605-73 = "[s5] «Прости, что подслушал...»\n[s6] «Но ты ведь действительно меня избегала?»"
1014605-76 = "Э-Это...!"
1014605-77 = "..."
1014605-78 = "Раз уж всё зашло так далеко... Боюсь, словами ничего не исправить."
1014605-79 = "Должна признаться: да, я намеренно избегала Сенсея."
1014605-80 = "Причина в том..."
1014605-81 = ""
1014605-83 = ""
1014605-84 = ""
1014605-85 = "Я осознала, какие чувства скрываются у меня внутри."
1014605-86 = "...Сенсей из Шале."
1014605-87 = "Однажды я уже предлагала вам сделку."
1014605-88 = "Пусть тогда ничего не вышло, но выслушаете ли вы моё новое предложение?"
1014605-91 = "― [log=마코토 수영복]Я[/log][wa:1710]"
1014605-93 = "― [log=마코토 수영복]всегда ставлю превыше всего интересы Геенны и Общества Пандемониума.[/log][wa:10]"
1014605-96 = "― [log=마코토 수영복]С таким положением[/log]"
1014605-98 = "― [log=마코토 수영복]мне порой было трудно справляться с собственными желаниями и чувствами.[/log][wa:10]"
1014605-101 = "[ns] «(Серьёзно...?)»"
1014605-103 = "#st;[-1200,-442];serial;60;― [log=마코토 수영복]Однако, Сенсей из Шале.[/log][wa:1150]"
1014605-105 = "#st;[-1200,-542];serial;60;― [log=마코토 수영복]Это предложение исходит не от председателя Общества Пандемониума.#nОно гораздо более личное.[/log][wa:2170]"
1014605-108 = "― [log=마코토 수영복]Признаю. Для меня Сенсей...[/log][wa:770]"
1014605-110 = "― [log=마코토 수영복]возможно, стал кем-то особенным.[/log][wa:110]"
1014605-113 = "― [log=마코토 수영복]Тем, чьё расположение я должна завоевать,[/log][wa:680]"
1014605-115 = "― [log=마코토 수영복]чего бы это ни стоило.[/log][wa:1090]"
1014605-118 = "[ns] «Завоевать расположение...?»"
1014605-120 = "― [log=마코토 수영복]Хм, завоевать расположение...? Покорить...?[/log][wa:2720]"
1014605-122 = "― [log=마코토 수영복]...Не знаю, как выразить это чувство словами.[/log][wa:1480]"
1014605-125 = "― [log=마코토 수영복]Точно... Если всё же попытаться сказать...[/log][wa:600]"
1014605-127 = "― [log=마코토 수영복]Я хочу вас.[/log][wa:2040]"
1014605-130 = "...Однако это предложение будет выгодно нам обоим."
1014605-131 = "Когда-то я обещала вам половину Кивотоса, но вы не раздумывая отвергли моё предложение."
1014605-132 = "Я не настолько глупа, чтобы дважды совершить подобную ошибку. Разумеется, новое предложение намного лучше."
1014605-133 = "Да... Речь уже не только о Кивотосе."
1014605-134 = "Если вы отдадите мне себя целиком, я тоже отдам себя вам без остатка."
1014605-135 = "Не могу представить более заманчивого предложения."
1014605-136 = ""
1014605-138 = ""
1014605-139 = "[ns7] «...Спасибо, что поделилась своими чувствами».\n[ns8] «Но я не могу принадлежать одному человеку целиком»."
1014605-142 = ""
1014605-145 = "[ns] «Ведь я учитель для всех»."
1014605-146 = "*кашляет*...!"
1014605-147 = "*кашляет* *кашляет*"
1014605-148 = "В-вот как..."
1014605-149 = "Нет, мне даже стало легче. Знакомый мне Сенсей непременно ответил бы именно так."
1014605-150 = "МЕНЯ. ЭТО. СОВЕРШЕННО. НЕ. ЗАДЕЛО."
1014605-151 = "...Поскольку уже поздно, я распоряжусь подготовить лимузин, который отвезёт вас обратно в Шале."
1014605-152 = "Отказы не принимаются."
1014605-154 = "Мне было неловко снова ей отказывать, поэтому я вернулся домой на лимузине Макото."
