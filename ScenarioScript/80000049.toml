[translation]
80000049-1 = "Сладкие и нежные сны"
80000049-3 = "[ns] «Хм. Значит, вот так, и...»"
80000049-4 = ""
80000049-12 = "Утро Дня святого Валентина."
80000049-13 = ""
80000049-17 = "[ns1] «Посмотрим. Что дальше?»\n[ns2] «Этому нет конца.»"
80000049-18 = "Я работал всю ночь, но будто совсем не продвинулся."
80000049-19 = "Я работал всю ночь, но будто совсем не продвинулся."
80000049-21 = ""
80000049-27 = "[ns] «Может, я просто выгорел...»"
80000049-29 = "Я был так измотан, что казалось, вот-вот отключусь."
80000049-30 = ""
80000049-33 = "Сенсей, я пришла."
80000049-34 = "[s] «Цубаки? Что ты здесь делаешь?»"
80000049-35 = "Проходя мимо Шале, я почувствовала внезапную ауру истощения."
80000049-36 = "[s] «Ты что почувствовала?»"
80000049-37 = "Полагаю, вы безответственно не спали всю ночь."
80000049-38 = "Работа может быть важной, но без сна вы разрушите здоровье!"
80000049-39 = "И тогда больше не сможете тренироваться со мной."
80000049-40 = "[s] «Но у меня ещё столько работы...»"
80000049-41 = "Нет!"
80000049-42 = "[s] «Н-Нет...?»"
80000049-43 = "Я серьёзно."
80000049-44 = "Сон очень важен. Нельзя им пренебрегать."
80000049-45 = "Как товарищ по тренировкам, вы обязаны заботиться о себе и нормально высыпаться."
80000049-46 = "Поэтому я не могу просто стоять и позволять это."
80000049-47 = "[s3] «Но моя работа и правда бесконечна!»\n[s4] «Чем больше я сплю, тем сильнее отстаю от работы! »"
80000049-48 = "Стресс и правда сильно на вас действует. Нужно считать это медицинской чрезвычайной ситуацией."
80000049-49 = "Стресс и правда сильно на вас действует. Нужно считать это медицинской чрезвычайной ситуацией."
80000049-50 = "Всё будет хорошо, Сенсей."
80000049-51 = "Когда всё выглядит безнадёжно, вы всегда можете рассчитывать на меня."
80000049-52 = "К счастью, у меня есть для вас идеальный подарок."
80000049-53 = ""
80000049-55 = ""
80000049-56 = "Вот."
80000049-58 = "[s] «Что это?»"
80000049-59 = "Вы ведь не забыли, что сегодня День святого Валентина?"
80000049-60 = "Это маска для сна и шоколад, который поможет расслабиться."
80000049-61 = "Шоколад — специальная валентиновская версия, созданная для глубокого сна."
80000049-62 = "В последнее время он очень популярен среди специалистов по сну. В отличие от стереотипного шоколада, набитого сахаром и портящего сон, этот способен вырубить слона одним кусочком."
80000049-63 = "[s] «Что ВООБЩЕ в этом шоколаде?!»"
80000049-64 = "Не переживайте о мелочах. Просто примите его и превратитесь из#nСенсея в Сонсэя."
80000049-65 = "Вам и правда нужно лучше заботиться о себе."
80000049-66 = "Что все будут делать, если вы свалитесь? Особенно я."
80000049-67 = "[s] «Цубаки...»"
80000049-68 = "Хорошо."
80000049-69 = "Идите сюда, Сенсей. Ложитесь."
80000049-70 = "Обещаю, здесь мягко и удобно. Уснёте в мгновение!"
80000049-71 = ""
80000049-73 = ""
80000049-75 = "[ns] «П-Постой, Цубаки! Слишком близко... Что ты делаешь?»"
80000049-76 = "Предлагаю использовать мои колени как подушку."
80000049-77 = "Обычно я дала бы вам свой тренировочный инструмент, но сегодня его чистят..."
80000049-78 = "Мои колени недостаточно удобные? Хм..."
80000049-79 = "Что ещё можно использовать?"
80000049-80 = "Мою попу?"
80000049-81 = "[s] «Я выбираю колени.»"
80000049-82 = "Как пожелаете."
80000049-83 = ""
80000049-85 = ""
80000049-87 = "Хорошо, давайте вздремнём вместе."
80000049-88 = "Съешьте этот шоколад и будете спать как младенец, Сенсей."
80000049-89 = ""
80000049-91 = ""
80000049-98 = "[ns] «А-а-а...»"
80000049-99 = "Баю-бай, Сенсей, на вершине дерева..."
80000049-100 = "Спокойной ночи, Сенсей."
80000049-102 = "Благодаря колыбельной Цубаки и шоколаду я отлично выспался."
