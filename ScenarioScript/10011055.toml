[translation]
10011055-2 = "Отличная работа, все! Не самый стандартный способ пройти..."
10011055-3 = "Но вы всё-таки победили меня... Пусть и едва-едва, благодаря командам Сенсея..."
10011055-4 = "То есть мы можем пройти?"
10011055-5 = "Ага. Идите прямо и поверните направо — там следующее испытание!"
10011055-6 = "Кстати, я слышала в трансляции. Вы Исследовательский клуб ниндзюцу?"
10011055-7 = "О! Ха-ха, ну... Да."
10011055-8 = "Похоже, ниндзя всё-таки довольно крутые."
10011055-9 = ""
10011055-10 = "..."
10011055-11 = "...!!"
10011055-12 = "Правда?! Ниндзя самые крутые!"
10011055-14 = "Пока, Сенсей! Пока, ниндзя! Удачи всем!"
10011055-17 = "П-Президент. Только что..."
10011055-18 = "Знаю. Впервые другой студент сказал нам такое."
10011055-19 = "И она права! Ниндзя самые крутые! Правда, господин?"
10011055-20 = "[s] «Ага. Ниндзя очень крутые.»"
10011055-21 = "..."
10011055-22 = "Продолжаем движение. Пока мы говорим, похитители уходят всё дальше."
10011055-23 = "А! Ладно, идём!"
