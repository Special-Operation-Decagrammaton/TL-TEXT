[translation]
10009050-1 = "Эпизод 5;Пятое нападение!"
10009050-3 = "Патруль привёл нас с Сэной на рыночную улицу, когда... у меня снова появилось это чувство."
10009050-4 = "Что-то случилось?"
10009050-5 = "[s] «Чутьё подсказывало, что сейчас мне позвонят. Наверное, показалось.»"
10009050-6 = "Вот как?"
10009050-7 = ""
10009050-9 = ""
10009050-10 = "Я уже успел облегчённо подумать, что ошибся, но как только мы вошли на рынок..."
10009050-11 = "О, да это же Сенсей из Шале! Какими судьбами?"
10009050-12 = "[s] «Я патрулирую этот район.»"
10009050-13 = "Вы с этим студентом работаете в День святого Валентина?#nХа-ха-ха. Только не ПЕРЕРАБОТАЙТЕ!"
10009050-14 = "Но вы как раз вовремя. Сегодня в мой магазин привезли кое-что отличное."
10009050-15 = "Я знаю, как много вы всегда работаете, так что вот. Возьмите это."
10009050-16 = ""
10009050-18 = ""
10009050-19 = ""
10009050-21 = ""
10009050-22 = "[ns] «Эм, ладно. Спасибо.»"
10009050-23 = "Да пустяки!#nСпасибо за всё, что вы делаете!"
10009050-26 = "После этого во время патруля мы продолжали встречать жителей, которые узнавали меня."
10009050-28 = "О. Вы Сенсей [USERNAME] из Шале."
10009050-29 = "Патрулируете вместе со своим студентом?"
10009050-30 = "Вот как, вы всё так же усердно работаете."
10009050-31 = "Как насчёт нашего нового яблочного шоколада, чтобы снять усталость?"
10009050-32 = "О, да это же Сенсей."
10009050-33 = "Не хотите попробовать новинку нашего магазина?"
10009050-34 = "И нашу тоже! Попробуйте нашу новинку!"
10009050-35 = "О-о-о! И нашу попробуйте!"
10009050-36 = "Сенсей! Сенсеээй!"
10009050-38 = "Мы с Сэной присели отдохнуть на скамейке в парке и разобрать все вещи, которыми нас засыпали торговцы."
10009050-41 = "Они и правда были щедры..."
10009050-42 = "[s] «Ага. Не знаю, заслуживаю ли я всего этого...»"
10009050-43 = "Глупости. Они лишь хотели выразить свою благодарность."
10009050-44 = "Возможно, странно слышать это от меня, но не только жители перед вами в долгу. Вы уже давно заботитесь и о таких студентах, как я."
10009050-45 = "Я понимаю, что они чувствуют."
10009050-46 = "[s] «Но мне не кажется, что я сделал что-то особенно выдающееся.»"
10009050-47 = "Дело не обязательно в том, что ваши поступки были самыми заметными."
10009050-48 = "Охрана и предотвращение конфликтов..."
10009050-49 = "Помощь людям в городе и консультации студентов..."
10009050-50 = "Советы и готовность выслушать их проблемы..."
10009050-51 = "Я понимаю, что Шале создавали для решения определённых проблем..."
10009050-52 = "...но, на мой взгляд, вы делаете гораздо больше, чем от вас требуется."
10009050-53 = "Уверена, остальные чувствуют то же самое."
10009050-54 = ""
10009050-56 = ""
10009050-57 = "Без вашего вмешательства сегодняшние происшествия на фестивале могли закончиться гораздо хуже."
10009050-58 = "[s] «Да ладно. Ты меня сейчас заставишь покраснеть.»"
10009050-59 = "Подумайте, сколько людей сегодня смогли продолжать улыбаться."
10009050-60 = "Владельцы магазинов продавали шоколад и сладости, а их покупатели дарили их тем, кто им дорог."
10009050-61 = "Во многом именно в этом и заключается День святого Валентина."
10009050-62 = "И это заставляет меня задуматься..."
10009050-63 = "[s] «...?»"
10009050-64 = "Я говорю о Вакамо."
10009050-65 = "Почему она устроила хаос на фестивале?#nКазалось, у неё была какая-то причина."
10009050-66 = "Чего она могла добиваться?"
10009050-67 = "[s] «Хороший вопрос.»"
10009050-68 = "Судя по всем её нападениям, очевидно, что она целилась в вас..."
10009050-69 = "...но если её настоящей целью было нейтрализовать Шале, кое-что не сходится."
10009050-70 = "Зачем привлекать хулиганов и красть оборудование Валькирии?"
10009050-71 = "Зачем устраивать столько хаоса, если цель настолько конкретна?#nОна действует совершенно нелогично."
10009050-72 = "[s] «К-когда ты так говоришь, становится немного страшно.»"
10009050-73 = "Послушайте моего совета. Вам стоит вернуться в офис Шале.#nЭто самый быстрый и простой способ избежать её нападений."
10009050-74 = "Если защита Шале активна, добраться до вас для неё должно быть невозможно."
10009050-75 = ""
10009050-77 = ""
10009050-78 = ""
10009050-80 = "Поставить свою безопасность выше работы — самый простой способ предотвратить очередную чрезвычайную ситуацию."
10009050-81 = "Так что, раз уж так..."
10009050-82 = "[s] «Исключено.»"
10009050-83 = "Сенсей?"
10009050-84 = "[s1] «Этот патруль — просьба моих студентов.»\n[s2] «Я не могу сбежать после того, как жители были так добры ко мне.»"
10009050-85 = ""
10009050-86 = ""
10009050-88 = ""
10009050-89 = "Вы отказываетесь ставить себя выше других. Так?"
10009050-90 = "Это очень на вас похоже. Правда, не знаю, назвать такое отношение самоотверженным или безрассудным."
10009050-91 = "Как бы то ни было, я сделаю всё, что в моих силах, чтобы вы не стали следующим трупом — кхм, пациентом."
10009050-92 = "[s] «Рад это слышать. Спасибо, Сэна.»"
10009050-94 = "[s] «А что до Вакамо, у меня такое чувство, что она—»"
10009050-95 = ""
10009050-99 = ""
10009050-100 = ""
10009050-101 = "Сенсей, приём! У нас чрезвычайная ситуация!"
10009050-102 = "[s] «Ага. Так и знал.»"
