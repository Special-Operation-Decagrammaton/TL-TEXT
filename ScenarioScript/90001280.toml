[translation]
90001280-1 = "Эпизод 28;Тиферет"
90001280-2 = "С-Сенсей? Зачем вам это...?"
90001280-3 = "Э-Это очень жестоко по отношению к тому, кто построил этот объект! М-Мне это не нравится!"
90001280-4 = "О-Она права. Второе хранилище — сама причина существования этого места. И даже если я попробую..."
90001280-6 = "...не думаю, что смогу его сломать."
90001280-7 = ""
90001280-8 = "Что? Именно поэтому это сработает? О чём вы вообще говорите...?"
90001280-9 = ""
90001280-11 = ""
90001280-12 = ""
90001280-13 = ""
90001280-14 = ""
90001280-15 = "Неужели...!"
90001280-16 = ""
90001280-19 = "К-Кей? Что ты собираешься делать?"
90001280-21 = "(Если Сенсей именно это задумал...!)"
90001280-22 = ""
90001280-28 = "И всё же вы серьёзно?! Из всего оружия Кивотоса вы хотите, чтобы я сделала это голыми руками?"
90001280-29 = "*вздох* Бедная я..."
90001280-30 = ""
90001280-35 = "В любом случае, ты что творишь?! Тиферет или как тебя там!"
90001280-36 = "Твоим семенам грозит опасность!"
90001280-38 = "Ч-Что... они... делают?"
90001280-39 = "Понятия не имею..."
90001280-40 = "Что ж, полагаю, это и называют «бить дохлую лошадь»!"
90001280-42 = "И они думают, что если побьют лошадь, дверь откроется? Не слишком ли они наивны?"
90001280-43 = "Даже если дверь откроется, какова их цель? Украсть семена?"
90001280-44 = "Вот поэтому я и не понимаю глупость живых существ. Они понятия не имеют, что делают и к чему это приведёт..."
90001280-45 = ""
90001280-47 = ""
90001280-48 = ""
90001280-49 = ""
90001280-50 = ""
90001280-51 = ""
90001280-52 = ""
90001280-53 = ""
90001280-55 = "?!?!"
90001280-57 = "Ч-Что? Что случилось, Эйн?"
90001280-58 = "Т-Тифи прислала сообщение...!"
90001280-59 = "«Обнаружена угроза второму хранилищу.»"
90001280-60 = "«Необходимо перераспределить ресурсы.»"
90001280-61 = "«Вся мощность... направляется на защиту второго хранилища»?!"
90001280-62 = "Значит, она собирается установить перегородку, отрегулировать температуру и влажность, чтобы обеспечить безопасность хранилища..."
90001280-63 = "И ради этого планирует прекратить выпуск нервно-паралитического вещества?!"
90001280-64 = ""
90001280-66 = "А-а?!"
90001280-67 = "Вот это меня удивило... Чуть не замкнуло даже это тело. Но важнее другое..."
90001280-68 = "...Как и ожидалось. Подача газа прекратилась."
90001280-69 = "[ns] «Отличная работа, Кей!»"
90001280-70 = "..."
90001280-71 = "Хвалить не за что. Я почти ничего не сделала."
90001280-72 = "А? Я... тоже начинаю чувствовать, что силы возвращаются."
90001280-73 = ""
90001280-75 = ""
90001280-77 = ""
90001280-78 = "!!!"
90001280-79 = "Момой! Мидори! Юзу! Все! Вы в порядке?"
90001280-80 = ""
90001280-82 = "Ммм... хочу ещё поспать... Не будите меня..."
90001280-83 = "А...? Сенсей? Арис...?"
90001280-84 = ""
90001280-86 = ""
90001280-87 = "Уф... Что произошло?"
90001280-88 = "Эм, что вообще только что было...?"
90001280-89 = "Не уверена, уместно ли это говорить при нынешних обстоятельствах и уровне опасности."
90001280-91 = "Но я прекрасно выспалась. Могу заявить, что сейчас я, Асума Токи, непобедима."
90001280-93 = "Сенсей... Вы в порядке? Кажется, я потеряла сознание..."
90001280-94 = "Мой статус вернулся в норму! Я в идеальном состоянии!"
90001280-95 = ""
90001280-96 = "[ns] «Я рад, что все целы. А произошло вот что...»"
90001280-105 = "...Простите."
90001280-106 = "Это всё моя вина. Из-за меня..."
90001280-107 = "Если бы я... Если бы только я не настояла на том, чтобы Тиферет продолжила хранить семена..."
90001280-108 = "Угх..."
90001280-109 = ""
90001280-111 = ""
90001280-112 = "..."
90001280-113 = "Приди в себя, Соф!"
90001280-114 = ""
90001280-117 = ""
90001280-118 = ""
90001280-120 = "А-Ай?!"
90001280-121 = "Ор...?"
90001280-122 = "Прекрати хныкать, Соф. Ещё ничего не закончено!"
90001280-123 = "Прежде всего, мы верим в тебя, Соф. Эйн, Старшая сестра и Тиферет. Даже я."
90001280-124 = "М-м, ну. За остальных пророков я говорить не могу, но, скорее всего, они чувствуют то же самое."
90001280-125 = "Тебе обязательно было всё портить этим «скорее всего»...?"
90001280-126 = "И самое главное, Соф, если ты так скажешь, желание и решение Тиферет окажутся напрасными!"
90001280-127 = "Но..."
90001280-128 = "Я-я-я-я думаю, мы всё ещё можем... сделать то, что в наших силах."
90001280-129 = "Мы... Мы поможем тебе. Чем сможем. П-Потому что... ведь именно поэтому мы здесь, да...?"
90001280-131 = "Она права, Соф. Не нам судить, кто превосходит другого, а кто ему уступает."
90001280-132 = "Гармонию нельзя определять как единообразие и безоговорочное подчинение. Такие условия скорее похожи на принуждение, угнетение и насилие."
90001280-133 = "Напротив, гармония — это компромисс. Когда каждый ищет согласия на своих условиях."
90001280-134 = "Без такого уважения мы не сможем двигаться вперёд как единое целое."
90001280-136 = "Ответственность одного — ответственность всех. Счастье всех — счастье каждого."
90001280-137 = "Старшая сестра..."
90001280-138 = "Ува-а-а...!"
90001280-139 = "Сила не рождается в изоляции. Будь то жизнь или сознание."
90001280-140 = "Наш долг — протянуть руку помощи тем, кто страдает."
90001280-141 = "...Возможно, при желании мы могли бы придраться и назвать это ошибкой, возникшей из-за действий Тиферет и Соф."
90001280-142 = "Но даже тогда мы существуем для того, чтобы поддерживать тех, кто совершает такие ошибки."
90001280-143 = "Поэтому, Эйн? Не могла бы ты связаться с Тиферет?"
90001280-144 = "Д-Да! Старшая сестра!"
90001280-145 = "Тифи... Прости. Пожалуйста, послушай..."
90001280-146 = "Эти люди не пытаются уничтожить твои семена. Они... они только притворяются!"
90001280-147 = "Они вроде... злых, ворчливых людей, которые пытаются тебя обмануть!"
90001280-148 = "Поэтому, Тифи, тебе не нужно перенаправлять ресурсы."
90001280-149 = "Но если эти люди не оставят Тифи в покое, даже мы не знаем, что случится..."
90001280-150 = "Мы тоже хотим защитить твои драгоценные семена, Тифи. Поэтому нам придётся..."
90001280-151 = "...очень вежливо отправить их обратно туда, откуда они пришли."
90001280-152 = ""
90001280-154 = ""
90001280-155 = "Пожалуйста, Тифи... Мы тоже поможем тебе всем, чем сможем..."
90001280-156 = ""
90001280-164 = "...Итак, Тиферет следует выбранному пути. Доверимся её воле, Соф?"
90001280-165 = "Да... Спасибо вам всем..."
90001280-166 = "Да, да, да! Ну же, ну же, хватит унывать. Такое случается, просто считай, что теперь ты нам должна услугу."
90001280-167 = "О-Ор... Ты сейчас прямо как человек прозвучала... Эхехе..."
90001280-168 = "Блех?!"
90001280-169 = "Эм, отсюда вытекает ещё одна моя просьба. Это может прозвучать странно, но я хочу, чтобы мы сделали ещё кое-какие приготовления."
90001280-170 = "Другие приготовления?"
90001280-171 = "Какие... именно?"
90001280-172 = ""
90001280-174 = "Т-Ты хочешь сказать...!"
90001280-175 = "...Я знаю. С моей стороны это довольно бесстыдно, но..."
90001280-176 = "..."
90001280-177 = "Ну, разве это не нормально?"
90001280-178 = "Н-Нормально?!"
90001280-179 = "Если отбросить формулировки, разве ты не помнишь собственные слова, Соф?"
90001280-180 = "Однажды ты сказала: «Возможно, нам придётся рассмотреть вариант отступления Тиферет на Стальной континент»."
90001280-181 = "Даже с точки зрения сохранения сил эвакуация Тиферет кажется правильным решением."
90001280-183 = "Ах...! Т-Теперь, когда я об этом думаю... это ведь должна была сделать я...! П-Прости, Соф...!"
90001280-184 = "Нет, это мне следует извиниться..."
90001280-185 = ""
90001280-187 = ""
90001280-188 = "Поэтому стыдиться здесь нечего! Всё всё ещё идёт по нашему плану, разве нет?"
90001280-189 = "Ну, полагаю, в идеальном мире мы вообще не дошли бы до такого!"
90001280-190 = "...Спасибо вам всем. Я просто хочу сказать..."
90001280-191 = "...Когда мы все вместе... мне правда очень хорошо."
90001280-192 = "Эхехе..."
90001280-194 = "Ну всё, всё! Прекратите эти неловкие речи и за работу!"
90001280-195 = "Мы заставим этих вредителей познать... настоящий ужас Тиферет!"
90001280-200 = "Ч-Что случилось?"
90001280-201 = ""
90001280-204 = "Это...? Сигнал от нового пророка? «Тиферет»...?"
90001280-205 = "Все! Эвакуируемся!"
90001280-207 = "Начинаем эвакуацию! Сюда!"
90001280-208 = "Поняла! Сенсей, сюда!"
90001280-209 = ""
90001280-210 = "[ns] «Что бы ни случилось, безопасность прежде всего, все!»"
