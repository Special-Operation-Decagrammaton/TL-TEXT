[translation]
10031050-1 = "Эпизод 5;Рекламная стратегия председателя"
10031050-2 = "На третий день подготовки вечеринки я отправился в Общество Пандемониума."
10031050-3 = "[ns] «Теперь украшения есть даже в коридорах.»"
10031050-4 = "Куда ни пойди, всё постепенно приобретает всё более яркую, праздничную атмосферу."
10031050-8 = ""
10031050-9 = "Хм?"
10031050-10 = "Ого! Это Учитель! Привет-привет!"
10031050-11 = "[s] «А. Эрика, Кирара. Рад видеть вас здесь.»"
10031050-12 = "Я сама хотела это сказать! Кто бы мог подумать, что мы встретим Сенсея в собственной школе!"
10031050-13 = "Это и называют «совпадением»?"
10031050-14 = "По-моему, это просто приятный сюрприз!"
10031050-15 = "Фуфу, значит, сегодня у нас будет удачный день!"
10031050-16 = "[s] «Ч-Что ты имеешь в виду под удачным днём?»"
10031050-17 = "А, Кирара как раз об этом говорила. Сказала, что сегодня вайб отличный."
10031050-18 = "Ммм. Будто идёшь по улице... случайно смотришь вниз и замечаешь четырёхлистный клевер! Вот такое ощущение!"
10031050-19 = "Ахахаха! Да! Именно такое!"
10031050-20 = "[s] «Я не совсем понимаю... Но рад видеть вас обеих в хорошем настроении.»"
10031050-21 = "Кстати, зачем вы здесь, Сенсей?"
10031050-22 = "Всё ещё помогаете готовить Особую вечеринку Геенны Общества Пандемониума, которая будет через несколько дней?"
10031050-23 = "Похоже, работы у вас будет много."
10031050-24 = "Ахахаха! Потрясающе! Даже Учитель помогает!"
10031050-25 = "Тогда как думаешь, «те штуки» — тоже идея Учителя?"
10031050-26 = "Да ни за что, Кирара..."
10031050-27 = "Кто знает?"
10031050-28 = "[s] «Что значит „те штуки“?»"
10031050-29 = "Ну... По мере подготовки к вечеринке они начали расставлять вот такие скульптуры..."
10031050-30 = "Но они настолько странно выглядят, что люди чуть животы не надрывают от смеха! Сейчас среди учеников Геенны это настоящий хит!"
10031050-31 = "Ахаха! Мы пытаемся найти их, чтобы сделать фотки, выложить в SNS и набрать кучу лайков."
10031050-32 = "[s] «...?»"
10031050-33 = "Верно. По одному рассказу трудно понять."
10031050-34 = "Я просто покажу! Смотрите!"
10031050-35 = ""
10031050-37 = ""
10031050-41 = "[ns] «Это...»"
10031050-42 = "Видите? Смешно же, правда?"
10031050-43 = "С хорошим настроением у всех и помощью Сенсея вечеринка этого года будет просто взрывной."
10031050-44 = "Будем ждать результатов всей вашей подготовки, Учитель!"
10031050-45 = ""
10031050-46 = "[ns] «Д-Да... Спасибо.»"
10031050-48 = "После того как я попрощался с Кирарой и Эрикой, я отправился в исполнительный кабинет Общества Пандемониума."
10031050-49 = ""
10031050-53 = ""
10031050-54 = "Кихехе... Добро пожаловать, [USERNAME] Сенсей."
10031050-55 = "[s] «А, Макото. Как ты? Уже лучше?»"
10031050-56 = "Хм?"
10031050-57 = "О. Не нужно переживать."
10031050-58 = "Почему-то мои воспоминания о том, чем именно я занималась во время вчерашней подготовки, немного расплывчаты."
10031050-59 = "Такое иногда случается. Не стоит беспокоиться."
10031050-60 = "[s] «Такое часто бывает?!»"
10031050-61 = "А теперь, Сенсей, прошлое должно оставаться в прошлом."
10031050-62 = "Важно будущее впереди. Вечеринка, к которой нам с тобой нужно готовиться."
10031050-63 = "[s3] «Кстати, об этой подготовке...»\n[s4] «По дороге сюда я увидел кое-что очень странное.»"
10031050-66 = "... Погоди, в коридоре академии Геенны стояли странные что?"
10031050-67 = "Хм, наверное, их поставил какой-нибудь ученик Геенны, слишком увлёкшийся вечеринкой."
10031050-68 = "Пусть подчинённые с этим разберутся."
10031050-69 = "Всё это неважно, Сенсей."
10031050-70 = "Важно то, что я наконец закончила «это». Плод моих трудов на протяжении всей подготовки к вечеринке."
10031050-71 = "Сегодня я позвала тебя в исполнительный кабинет именно для того, чтобы показать это, Сенсей."
10031050-72 = "[s] «Опять это зловещее „это“. Что ты вообще сделала?»"
10031050-73 = "Кихехе. Узри!"
10031050-74 = ""
10031050-76 = ""
10031050-79 = "[ns] «Макото... это та самая странная статуя, которую мне показала Кирара по дороге сюда!»"
10031050-80 = "Что?! Да как ты смеешь!"
10031050-81 = "И чем, позволь спросить, моя статуя странная?!"
10031050-82 = "Эта статуя сделана на заказ вручную. Она отражает интеллект и храбрость Великой Ханумы Макото через смелое, выразительное искусство!"
10031050-83 = "Как ни посмотри, это потрясающая статуя, прямо-таки переполненная гордостью!"
10031050-84 = "[s] «Насчёт остального не уверен, но рад, что тебе понравился результат!»"
10031050-85 = ""
10031050-88 = "[ns] «Ты ещё и заказала их очень много. Есть какая-то особая причина?»"
10031050-89 = "Причина? Разве не очевидно?!"
10031050-90 = "Для рекламы Особой вечеринки Геенны!"
10031050-91 = ""
10031050-93 = ""
10031050-94 = ""
10031050-95 = "Я вложила всё в подготовку этой вечеринки. Значит, нам нужен символ моего достойного усердия!"
10031050-96 = "Поэтому я размещу эти специально заказанные статуи по всей Геенне..."
10031050-97 = "Каждый ученик на вечеринке увидит не только моё величие, но и величие Общества Пандемониума! Кекекеке!!!"
10031050-98 = "В SNS это уже стало вирусным! Смотри!"
10031050-99 = ""
10031050-101 = ""
10031050-103 = "<KiraKira Ururun☆>: Ахахаха! Смотрите на это! ОМГ! Сколько же тут статуй!"
10031050-104 = "<GehEricha0201>: Эм. Кажется, некоторые стоят прямо посреди дороги. Это безопасно?"
10031050-105 = "<akusi-girl>: Кажется, раньше я видела, как куча хулиганов их таскала."
10031050-106 = "<#Nyanko&>: Они такие убогие."
10031050-107 = ""
10031050-108 = "[ns5] «...Вирусным?»\n[ns6] «Кстати... сколько вообще стоило сделать столько статуй?»"
10031050-111 = "Ц-ц-ц."
10031050-112 = "Сенсей, не нужно переживать о такой мелочи, как стоимость..."
10031050-113 = "Потому что все счета за изготовление этих статуй и их размещение по академии Геенны выставили Дисциплинарной комиссии, а не Обществу Пандемониума!"
10031050-114 = "[s] «А-а?»"
10031050-115 = "Видишь ли, именно Общество Пандемониума определяет бюджет Дисциплинарной комиссии!"
10031050-116 = "Кихехехе! Мы использовали бюджет Дисциплинарной комиссии для всей подготовки к вечеринке! Это раздавит их финансово! Я рекламирую вечеринку, а Дисциплинарная комиссия рыдает в свой сок, пока её бюджет режут в клочья!"
10031050-117 = "Все в выигрыше! Два зайца одним выстрелом! Одна рука другую моет!"
10031050-118 = "Гениальный план: одним движением выполнить десятки задач!"
10031050-119 = "Кеке. Кекекеке! Кекекекеке!!"
10031050-120 = "[s] «Макото... Дисциплинарная комиссия вообще знает об этом?»"
10031050-121 = "Конечно нельзя!"
10031050-122 = "В прошлые годы глава Дисциплинарной комиссии всегда находила способ заблокировать мои старания."
10031050-123 = "Хорошо, что теперь у неё руки заняты репетициями на пианино!"
10031050-124 = "Должна сказать, возможно, это моя величайшая схема!"
10031050-126 = "А-а-а! Я не могу не восхищаться собственной гениальностью!"
10031050-127 = ""
