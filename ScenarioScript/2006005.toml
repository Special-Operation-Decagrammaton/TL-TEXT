[translation]
2006005-1 = "Ibuki and Food!"
2006005-2 = "Beach Stall District"
2006005-3 = "(Just as Ibuki said, there are stalls here I've never seen before.)"
2006005-4 = "[ns] \"Since when were these here...?\""
2006005-6 = "They say these shops only open when summer comes around."
2006005-7 = "It looks like they only operate when there are lots of people at the beach!"
2006005-8 = "[s] \"I see. So they're seasonal stalls.\""
2006005-12 = "Ah! Sensei, Sensei!"
2006005-13 = "Over there! Red sea bream yakisoba!"
2006005-14 = "And over there is grilled corn! #nSalty shaved ice... and clam ramen...!"
2006005-15 = "Hmm... which one should I pick...?"
2006005-16 = "Ibuki's allowance is... um..."
2006005-17 = "[s] \"Ibuki.\""
2006005-18 = "Yeah?"
2006005-19 = "[s] I take out my adult wallet."
2006005-23 = "[ns] \"It's a waste to agonize over a feast.\""
2006005-24 = "...!"
2006005-25 = "Are you sure!?"
2006005-26 = "But, Ibuki has her own allowance..."
2006005-27 = "[s] \"Let's start with the grilled corn!!\""
2006005-28 = "Okay!"
2006005-30 = "(And so, I went to buy food with Ibuki.)"
2006005-32 = "Grilled Corn Stall"
2006005-33 = "Hello!"
2006005-34 = "Welcome! What'll it be?"
2006005-35 = "Hmm..."
2006005-36 = "Ibuki will have the 'Umami Explosion Quattro Cheese Grilled Corn'!"
2006005-37 = "Oh! You've got a sharp eye, little lady! #nThat's our signature dish!"
2006005-38 = "Thanks to this, I was able to start setting up stalls at the beach... I've even got regulars now!"
2006005-39 = "I still remember the day I came up with the recipe, it was autumn five years ago... hm? Customer, are you ready to order?"
2006005-40 = "[s] \"I, I'll have the same thing...\""
2006005-41 = "Haha! Just a moment!"
2006005-46 = "Here you go! Fresh off the grill!"
2006005-48 = "Wow! Thank you!"
2006005-52 = "(I received a delicious-looking corn covered in plenty of toppings.)"
2006005-53 = "(...But, does Ibuki's look bigger?)"
2006005-55 = "Hm? Is something wrong?"
2006005-56 = "...Maybe there's just some natural variation in the size of the corn?"
2006005-57 = "[s] \"N-no way...\""
2006005-59 = "(After that, at the other stalls too...)"
2006005-61 = "Two orders of red sea bream yakisoba, coming right up!"
2006005-62 = "Yay! Thank you!"
2006005-63 = "You're so energetic and cute, little miss! Eat up!"
2006005-65 = "Two orders of rainbow icing candy apples, here you go!"
2006005-66 = "Hehehe! I'm so excited!"
2006005-68 = "(...Somehow)"
2006005-69 = "(Everyone kept giving Ibuki extra portions.)"
2006005-71 = "Thank you, Sensei! Let's dig in!"
2006005-72 = "[s] \"If it's not enough, I'll go buy more!\""
2006005-73 = "No! I have so much already!"
2006005-74 = "I got a little carried away and bought too much..."
2006005-79 = "Huh?"
2006005-86 = "T-the seagull..."
2006005-87 = "It took Sensei's food...!"
2006005-88 = "[s] \"A, a thief...!\""
2006005-89 = "W-what should we do..."
2006005-93 = "It's okay, Sensei!"
2006005-94 = "I have plenty, so let's share mine!"
2006005-95 = "[s] \"Ibuki...!\""
2006005-97 = "(After that, I shared a meal with Ibuki.)"
2006005-98 = "(Since she had been given extra portions, we were both able to eat our fill.)"