[translation]
2006005-1 = "Обедаем с Ибуки!"
2006005-2 = "Торговые ряды у пляжа"
2006005-3 = "Как и говорила Ибуки, неподалёку от пляжа действительно появились новые торговые ряды."
2006005-4 = "[ns] «Откуда здесь вдруг взялись магазины...?»"
2006005-5 = ""
2006005-6 = "Ибуки слышала, что эти магазины открываются только летом. Сезонно!"
2006005-7 = "Обычно у них большие магазины на другом рынке, а здесь они тоже продают еду, когда на пляже много людей!"
2006005-8 = "[s] «То есть это временные летние лавки»."
2006005-9 = ""
2006005-11 = ""
2006005-12 = "А? Сенсей, Сенсей!"
2006005-13 = "В этой палатке продают якисобу с морским карасём!"
2006005-14 = "А вон там жареная кукуруза... О! И солёный фруктовый лёд, рамен с моллюсками..."
2006005-15 = "Хм, что же Ибуки выбрать...?"
2006005-16 = "Посмотрим. Ибуки хватит на... Эм... Э-э-э..."
2006005-17 = "[s] «Ибуки.»"
2006005-18 = "М? Что такое, Сенсей?"
2006005-19 = "[s] Достать кошелёк."
2006005-20 = ""
2006005-23 = "[ns] «Если долго сомневаться, покупка затянется, Ибуки»."
2006005-24 = "...!"
2006005-25 = "С-Сенсей собирается за всё заплатить?!"
2006005-26 = "Но Ибуки не может всё время получать подарки от Сенсея..."
2006005-27 = "[s] «Может, начнём с жареной кукурузы, Ибуки? Со всеми добавками?»"
2006005-28 = "Безусловно!"
2006005-30 = "И мы с Ибуки принялись пробовать угощения."
2006005-31 = ""
2006005-32 = "Лавка жареной кукурузы"
2006005-33 = "Здравствуйте!"
2006005-34 = "Добро пожаловать! Что будете заказывать?"
2006005-35 = "М-м..."
2006005-36 = "Ибуки возьмёт «Жареную кукурузу с четырьмя сырами и взрывным вкусом»!"
2006005-37 = "Ха-ха! Отличный выбор, юная леди! Это наш хит продаж!"
2006005-38 = "Благодаря ему я даже смог открыть вторую торговую точку!"
2006005-39 = "Я придумал этот вкус осенью, пять тяжёлых лет назад... М? Простите, вы ещё не сделали заказ?"
2006005-40 = "[s] «М-мне то же самое»."
2006005-41 = "Ха-ха, замечательно! Одну минутку!"
2006005-42 = ""
2006005-44 = ""
2006005-45 = ""
2006005-46 = "Вот, держите! Приятного аппетита!"
2006005-48 = "Ура! Спасибо!"
2006005-52 = "Початок выглядел очень аппетитно, да и добавок на нём было предостаточно."
2006005-53 = "...Хотя у Ибуки их почему-то оказалось вдвое больше, чем у меня!"
2006005-54 = ""
2006005-55 = "Хм? Что случилось?"
2006005-56 = "Вы получили ровно то, за что заплатили. Стандартная порция по стандартной цене."
2006005-57 = "[s] «Не уверен, что это так...!»"
2006005-59 = "Мы купили ещё несколько закусок в других лавках."
2006005-60 = ""
2006005-61 = "Держите! Две порции хорошенько прожаренной якисобы с морским карасём! Осторожнее, милая, горячо!"
2006005-62 = "Ура! Спасибо!"
2006005-63 = "Какая же ты лапочка! Вот, угощайся!"
2006005-64 = ""
2006005-65 = "Два яблока в глазури с особой радужной посыпкой!"
2006005-66 = "Спасибо!"
2006005-68 = "Я невольно заметил одну странность..."
2006005-69 = "...Продавцы почему-то сами того не замечая давали Ибуки больше еды."
2006005-70 = ""
2006005-71 = "Хи-хи, спасибо, Сенсей!"
2006005-72 = "[s] «Тебе точно этого хватит, Ибуки?»"
2006005-73 = "Более чем, Сенсей!"
2006005-74 = "Вообще-то Ибуки, кажется, так обрадовалась, что купила слишком много..."
2006005-75 = ""
2006005-79 = "А?"
2006005-80 = ""
2006005-84 = ""
2006005-85 = ""
2006005-86 = "Ч-чайка..."
2006005-87 = "...утащила всю еду Сенсея! Всю до последнего кусочка! Ого..."
2006005-88 = "[s] «Не-е-ет...!»"
2006005-89 = "Ч-Что нам делать...?"
2006005-90 = ""
2006005-92 = ""
2006005-93 = "Нет, всё хорошо, Сенсей!"
2006005-94 = "У Ибуки много еды, так что можем поделиться!"
2006005-95 = "[s] «Ибуки...!»"
2006005-97 = "Мы устроили с Ибуки небольшой пир на двоих."
2006005-98 = "Благодаря огромным порциям Ибуки еды хватило нам обоим."
