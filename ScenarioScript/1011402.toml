[translation]
1011402-1 = "Радость работы официанткой"
1011402-2 = "Стоило мне прийти в кафе, как ко мне подошла Джури и сказала..."
1011402-3 = ""
1011402-6 = "О, Сенсей! Добро пожаловать!"
1011402-7 = "[s] «Привет, Джури! Как дела?»"
1011402-8 = "О, ну..."
1011402-9 = "Хи-хи. Вообще-то я увидела вас ещё издалека, поэтому..."
1011402-10 = "А, что я говорю? Сейчас не время для этого. Пожалуйста, проходите!"
1011402-12 = "Добро пожаловать, дорогой «посетитель». Что будете заказывать?"
1011402-13 = "[s1] «Фирменный кофе этого кафе!»\n[s2] «Я переживаю за вес, но всё равно хочу парфе!»"
1011402-14 = "Хорошо, тогда кофе. У нас есть горячий и холодный."
1011402-15 = "Какой предпочитаете?"
1011402-16 = "...Сейчас. Добавить сироп или сливки?"
1011402-17 = "Спасибо за заказ. Подождите немного, я скоро всё принесу."
1011402-18 = "А, парфе? Конечно."
1011402-19 = "Могу предложить шоколадно-вишнёвое парфе, раз сейчас сезон вишни?"
1011402-20 = "Спасибо! Это ограниченная позиция в меню, знаете ли."
1011402-21 = "Сверху мы также кладём маленький чизкейк, так что обязательно попробуйте и его."
1011402-23 = "Я с удовольствием изучал меню и одновременно наблюдал за работой Джури."
1011402-24 = "Я заказал немало блюд, чтобы не чувствовать, будто просто занимаю место в кафе."
1011402-26 = ""
1011402-27 = "...О нет, что же делать? У нас совсем закончилась сахарная пудра!"
1011402-28 = "Что? Сахарная пудра...? Можно проверить магазин дальше по улице!"
1011402-29 = ""
1011402-31 = ""
1011402-33 = "...Сахарная пудра сейчас распродана ВЕЗДЕ...?"
1011402-34 = "В-всё будет хорошо! Мы можем сделать её сами. Сахарную пудру получают, измельчая сахар до очень мелкого состояния, а затем добавляя немного крахмала..."
1011402-35 = "У нас закончились и обычный сахар, И крахмал! Что будем делать, Джури...?"
1011402-36 = "Следующая поставка завтра, а сахарная пудра нужна нам прямо сейчас!"
1011402-37 = "Д-да. И как же это исправить..."
1011402-38 = ""
1011402-40 = ""
1011402-42 = ""
1011402-43 = "Менеджер! Давайте попробуем аптеку!"
1011402-44 = "А? Зачем аптеку?"
1011402-45 = "Можно купить глюкозные конфеты!"
1011402-47 = "Потом измельчим их в порошок, а затем перетрём ещё мельче..."
1011402-48 = ""
1011402-50 = ""
1011402-51 = ""
1011402-52 = "Вот так, менеджер! Думаю, сегодня это сойдёт за замену!"
1011402-53 = "А ещё порошковая глюкоза плавится при более низкой температуре, чем обычный сахар."
1011402-54 = "Текстура будет немного другой, а вкус — приятным и освежающим, поэтому посетители с тонким вкусом могут заметить разницу..."
1011402-55 = "...но это всё равно лучше, чем ничего!"
1011402-57 = "Что? Масло закончилось, а нам нужно приготовить ещё сэндвичей с красной фасолью и маслом?"
1011402-58 = "Тогда... Точно! Почему бы не использовать сливочный сыр вместо масла?"
1011402-59 = "Конечно, характерную кислинку сливочного сыра полностью не скрыть, но..."
1011402-60 = "У них обоих мягкая текстура и насыщенный вкус, так что должно получиться достаточно похоже!"
1011402-61 = "Идея, конечно, хорошая, но сливочный сыр у нас тоже почти закончился...!"
1011402-62 = "Ч-что? Тогда что НАМ... а!"
1011402-63 = "Менеджер! У нас есть молоко и взбитые сливки?"
1011402-64 = "Этого у нас полно."
1011402-65 = "Тогда, возможно, получится выкрутиться! Вот что я предлагаю!"
1011402-66 = "Сначала нагреем молоко, добавим взбитые сливки, а затем ещё немного прогреем..."
1011402-67 = "...а если потом добавить лимонный сок, сливочная масса отделится от сыворотки."
1011402-68 = "После того как снимем слой сливок, из него должно получиться что-то вроде сливочного сыра!"
1011402-69 = "Хорошо! Попробуем!"
1011402-71 = "..."
1011402-72 = "Эй, менеджер? Этот хлеб не выглядит свежим!"
1011402-73 = "П-правда?! Но мне сказали, что его испекли только сегодня утром..."
1011402-74 = "У свежего хлеба на закваске всегда есть лёгкий запах этанола..."
1011402-75 = "...а у этого хлеба его нет! Вам стоит позвонить поставщику!"
1011402-76 = "Д-да, сейчас позвоню!"
1011402-78 = ""
1011402-79 = "...Ты попала точно в точку, Джури. Этот «свежий хлеб» на самом деле оказался остатками двухдневной давности."
1011402-80 = "Вот как..."
1011402-81 = "*вздыхает* Может, нам стоит сменить поставщика. В любом случае, у тебя впечатляющая внимательность к деталям!"
1011402-82 = "Ой, нет, ничего особенного..."
1011402-83 = "[ns] «Когда дело касается контроля продуктов, Джури нет равных.»"
1011402-84 = "И вы туда же, Сенсей!"
1011402-86 = "После всей этой суеты здесь вдруг стало так тихо..."
1011402-87 = "Хотя, наверное, после часа пик обычно так и бывает. ...Эм, Сенсей? Вам не скучно просто сидеть в этом кафе?"
1011402-88 = "Что? Вам не было скучно, потому что вы наблюдали за мной? Н-ну... это... то есть... Мне приятно. Хи-хи-хи."
1011402-89 = "Джури? Можешь сделать перерыв. Хорошая работа!"
1011402-90 = "П-правда? Тогда..."
1011402-91 = "Можно вас кое о чём попросить, Сенсей?"
1011402-92 = "[s] «Конечно, в любое время.»"
1011402-93 = "Тогда... я позволю себе сесть... прямо рядом с вами!"
1011402-94 = ""
1011402-96 = ""
1011402-97 = ""
1011402-98 = "Ещё раз здравствуйте, Сенсей."
1011402-99 = "[s] «Наверное, работать здесь, в кафе, непросто.»"
1011402-100 = "Ну, трудно, конечно, но ещё и весело."
1011402-101 = "И это совсем другое веселье, не такое, как работа в Клубе школьного питания."
1011402-102 = "Иногда приходится думать, что лучше подать в первую очередь."
1011402-103 = "Большинство посетителей здесь любят сладкое, поэтому я обычно рекомендую им десерты."
1011402-104 = "А потом им, скорее всего, захочется напиток, который перебьёт сладость."
1011402-105 = "Но некоторые посетители приходят только за напитками вроде чёрного кофе, поэтому за этим тоже нужно следить."
1011402-106 = "Ещё бывает весело наблюдать за посетителем и рекомендовать ему блюда из меню, если он не может определиться."
1011402-107 = "Обычно я советую что-нибудь с той страницы, на которой человек задерживает взгляд дольше всего. Обычно срабатывает."
1011402-108 = "Посетители, которые пьют много воды перед заказом, обычно сильно хотят пить... поэтому, когда я рекомендую освежающий напиток, они часто соглашаются."
1011402-109 = "А проще всего с посетителями, у которых урчит живот!"
1011402-110 = "Что ещё... А, точно! Ещё один большой плюс — можно самой пробовать все новинки меню."
1011402-111 = "Скоро добавят напиток из смеси персика и зелёного винограда с кокосовым желе сверху. Название ещё не придумали."
1011402-112 = "Когда я попробовала, всё отлично сочеталось: мягкая сладость, освежающий вкус и текстура кокосового желе!"
1011402-113 = "И ещё..."
1011402-115 = "Слушая Джури, я совсем потерял счёт времени."
1011402-117 = "Хорошо, рабочий день окончен! Всем спасибо за работу!"
1011402-118 = "Ага, отличная работа!"
1011402-119 = "Да, спасибо за ваш труд!"
1011402-120 = "[ns] «Хорошая работа сегодня, Джури. Ты отлично справилась.»"
1011402-121 = "С-Сенсей? Я, эм... Спасибо за добрые слова."
1011402-122 = "Вы правда так думаете? Т-тогда спасибо ещё больше..."
1011402-123 = "Кстати. Судя по тому, как ты сегодня работала... Думаю, ты справишься, Джури."
1011402-124 = "Хм? С чем?"
1011402-125 = "Ни с чем иным, как..."
1011402-126 = "...с конкурсом «Официантка месяца»! Ты там всех порвёшь!"
1011402-127 = "...Что? Это вообще что такое?"
1011402-128 = "Конкурс, на котором выбирают самую умелую и обаятельную официантку района."
1011402-129 = "Кафе, чья официантка побеждает, всегда становится невероятно популярным!"
1011402-130 = "Н-н-н-н-нет, менеджер! Это слишком! Да! Слишком!"
1011402-131 = "[ns] «Не хочешь попробовать?»"
1011402-132 = "...Не знаю. Эм... секунду. Дайте подумать."
1011402-133 = "..."
1011402-134 = "То есть я не совсем против... этой идеи."
1011402-135 = "Но я переживаю, что вообще смогу сделать на конкурсе..."
1011402-136 = "[s3] «Давай попробуем вместе. Я постараюсь тебе помочь!»\n[s4] «Почему бы просто не делать то же, что ты делала сегодня?»"
1011402-139 = "Видите? Даже вы уже загорелись, Сенсей."
1011402-140 = ""
1011402-142 = ""
1011402-143 = "..."
1011402-144 = "У-у-ум...!!"
