[translation]
80000104-1 = "Я не могу последовать, но..."
80000104-2 = "А, Сенсей! Сюда, сюда!"
80000104-3 = "Я вас ждала, ха-ха! Вы ведь знаете, что сегодня за день, да?"
80000104-4 = "...Хм? Не знаете? Ну, полагаю, мы всегда упоминали этот день лишь вскользь, так что неудивительно, что вы забыли."
80000104-5 = "Сегодня..."
80000104-6 = "[s1] «...Ах да! День святого Валентина!»\n[s2] «Я знаю. Сегодня День святого Валентина.»"
80000104-9 = "...?"
80000104-10 = "...Сенсей?"
80000104-11 = "Что вы только что сказали...?"
80000104-12 = "[s3] «А? Я задел больную тему?»\n[s4] «Я-я ошибаюсь? Ведь сегодня День святого—?»"
80000104-15 = "...Сенсей."
80000104-16 = "Вы ведь не думаете, что я, президент Рабочей партии..."
80000104-17 = "...стану праздновать праздник, созданный буржуазией для поклонения алтарю капитализма?!"
80000104-18 = "[s] «Один день не может быть настолько пло—»"
80000104-19 = "Ещё как может!"
80000104-20 = "Именно потому, что это всего один день, потребителям приходится, глотая слёзы, покупать шоколад по задранным ценам!"
80000104-21 = "К тому же валентиновские шоколадки могут быть завёрнуты в роскошную упаковку, но внутри всё равно дешёвый шоколад, который можно купить в любой другой день!"
80000104-22 = "Этот праздник насмехается над доверчивыми людьми, верящими в любовь, и заманивает их в ловушку ради прибыли! Очередное зло, обрушенное на нас корпоративными олигархами!"
80000104-23 = "Я никогда не прощу День святого Валентина! Будь моя воля, я бы вычеркнула этот проклятый день из всех календарей!"
80000104-24 = "[s5] «Верно, весь этот разговор кажется очень знакомым...»\n[s6] «Если речь не о Дне святого Валентина, тогда о чём ты хотела поговорить?»"
80000104-27 = "Ты правда не помнишь?"
80000104-28 = "Я хотела сегодня показать тебе отличное место с кацудоном."
80000104-29 = "Пойдём скорее! Ресторан рядом, и там очень вкусно..."
80000104-30 = "Если будем медлить, там быстро соберётся очередь. Пойдём!"
80000104-31 = ""
80000104-33 = ""
80000104-35 = "И мы с Минори пообедали в местном заведении с кацудоном."
80000104-36 = "Уверенность Минори оказалась оправданной. Еда была вкусной, а порции — щедрыми."
80000104-38 = "А! Отлично поели. Вкусная повседневная еда из обычных продуктов! Этот простой вкус всегда лучше любой изысканной кухни!"
80000104-39 = "Хотя, полагаю, сегодня ты очень занят, да? Наверняка у тебя ещё полно дел..."
80000104-40 = "Тогда, прежде чем ты уйдёшь..."
80000104-41 = ""
80000104-43 = ""
80000104-44 = ""
80000104-45 = "[ns7] «...Хм? Это мне?»\n[ns8] «Я думал, ты не отмечаешь День святого Валентина?»"
80000104-48 = "Н-Ну, понимаешь..."
80000104-49 = "Я сказала, что не позволю каким-то мерзким корпорациям наживаться на себе. Но я ничего не имею против того, чтобы дарить шоколад..."
80000104-50 = "Это тот самый шоколадный батончик, который мы едим во время работы. Ничего особенного, но дух рабочей солидарности делает его куда вкуснее и питательнее всего, что сейчас продают."
80000104-51 = "Ну..."
80000104-52 = ""
80000104-54 = ""
80000104-55 = "Ч-Что ты так на меня смотришь?! Прекрати! Это неловко!"
80000104-56 = "В любом случае, мне пора!! Хорошего дня, Сенсей!!"
80000104-57 = "...Ещё увидимся!"
80000104-58 = ""
80000104-60 = ""
80000104-64 = "...По крайней мере, её пролетарский шоколад и правда оказался вкусным."
