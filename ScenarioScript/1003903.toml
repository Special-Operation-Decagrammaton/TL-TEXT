[translation]
1003903-1 = "RABBIT 4, Мобилизация"
1003903-2 = "Как обычно, я пытался разобраться с накопившейся работой Шале в офисе."
1003903-3 = ""
1003903-5 = ""
1003903-6 = "Эм, С-Сенсей..."
1003903-7 = ""
1003903-9 = ""
1003903-10 = "Э-э-э..."
1003903-11 = ""
1003903-13 = ""
1003903-14 = ""
1003903-15 = ""
1003903-16 = "Угх..."
1003903-17 = ""
1003903-19 = ""
1003903-20 = "[ns1] «М-Мию?»\n[ns2] «Когда ты успела прийти?!»"
1003903-21 = "Я-я уже давно здесь..."
1003903-22 = "Я-я уже давно здесь..."
1003903-23 = "Даже С-Сенсей меня не заметил..."
1003903-24 = "Моё присутствие исчезает ещё сильнее..."
1003903-25 = "Интересно, мои друзья вообще меня помнят?"
1003903-26 = "И-Иногда мы объединялись в команду, и друзья забывали обо мне... Мне хочется с-спрятаться каждый раз, когда я в-вспоминаю, как они говорили: «А, т-точно. Мию тоже здесь.»"
1003903-27 = "Я-я могу умереть от одиночества..."
1003903-28 = "[s] «Обещаю, всё совсем не так.»"
1003903-29 = "В-Вы меня не услышали?"
1003903-30 = "Я довольно тихо хожу..."
1003903-31 = "Я-я научилась этому для заданий, но слишком привыкла..."
1003903-32 = "Теперь я вообще никогда не издаю звуков..."
1003903-33 = "Может, поэтому меня никто не замечает."
1003903-34 = "Н-Но я не думаю, что смогу изменить свою походку..."
1003903-35 = "[s] «А если носить колокольчик или что-нибудь такое?»"
1003903-36 = "Носить колокольчик?"
1003903-37 = "Т-Тогда люди будут слышать, как я иду!"
1003903-38 = "О. У меня есть колокольчик."
1003903-39 = ""
1003903-41 = ""
1003903-42 = "[ns] «Погоди, Мию. Это же кошачий.»"
1003903-44 = "И?"
1003903-45 = "Он раньше принадлежал моей кошке."
1003903-46 = "Но он состарился, поэтому я купила кошке новый ошейник."
1003903-47 = "Если я надену вот так колокольчик, люди н-наконец-то начнут меня замечать!"
1003903-48 = "[s] «Уверен, теперь тебя точно заметят.»"
1003903-49 = "Хи-хи. Я в-вся в предвкушении."
1003903-50 = "Сенсей, пойдём проверим!"
1003903-51 = ""
1003903-53 = ""
1003903-54 = "[s] «Мию, подожди минутку!»"
1003903-55 = ""
1003903-56 = ""
1003903-57 = ""
1003903-58 = "Что с этой девочкой? На ней ошейник для питомца."
1003903-59 = "А рядом с ней разве не Сенсей из Шале?"
1003903-60 = "Я слышала слухи: если Сенсей позовёт, надо немедленно бежать в офис Шале, без исключений."
1003903-61 = "Они так обращаются даже со студентами на задании?"
1003903-62 = "Какой ужас... Бедные студенты."
1003903-63 = "С-Сенсей! Кажется, меня замечают."
1003903-64 = "О-Они... Они прямо на меня смотрят! Они меня видят!"
1003903-65 = "Колокольчик и правда работает."
1003903-66 = "[s] «Пожалуйста, сними этот ошейник.»"
1003903-67 = "С-Снять?"
1003903-68 = "Но я не хочу снова стать н-незаметной."
1003903-69 = "В-Вы такой злой."
1003903-70 = "Сенсей только что сказал ей «сними это»?"
1003903-71 = "Этот милый маленький студент. Она плачет!"
1003903-72 = "Как такой жестокий человек вообще стал учителем?"
1003903-73 = "[s] «Пожалуйста, сними его! Прошу!»"
1003903-75 = "Я умолял её больше никогда не надевать этот ошейник, и в конце концов она согласилась."
1003903-76 = "Но после этого горожане ещё долго бросали на меня осуждающие взгляды..."
