[translation]
13050-1 = "Эпизод 5;Транс-пустынная железная дорога"
13050-2 = "Вход разрешён. Победная поза!"
13050-3 = "Почему здесь так тесно? Где нам сидеть? На полу?"
13050-4 = ""
13050-7 = ""
13050-8 = "..."
13050-10 = "Офицеры, пожалуйста, не трогайте чужие вещи без разрешения. Нет, холодильника здесь нет. Просто сядьте и не двигайтесь."
13050-11 = "Прыгать по стульям — полная противоположность «не двигаться». Сядьте."
13050-12 = "Э-Эм..."
13050-13 = "Ещё раз прошу прощения. Это клубная комната Комитета по выплате долга Абидоса?"
13050-15 = ""
13050-17 = ""
13050-18 = ""
13050-20 = ""
13050-21 = ""
13050-22 = ""
13050-23 = ""
13050-24 = ""
13050-26 = "Широко! Что бы ты там ни задумала — притормози!"
13050-27 = "...Я ничего не собиралась делать. Клянусь."
13050-29 = "Да. Мы Комитет по выплате долга."
13050-30 = "Ну, нашли нас. Давайте к делу, Хайлендер."
13050-31 = ""
13050-34 = ""
13050-35 = "Это... съедобно?"
13050-36 = "Алло-о-о, мы вообще-то гости. Где наш чай?"
13050-38 = "А-Ах! Точно... Секунду..."
13050-39 = "Пожалуйста, не напрягайтесь ради них. Мы ненадолго."
13050-40 = "Бу-у. Бу-у-у!"
13050-41 = "Если бы вы хоть раз нормально оценили ситуацию, офицеры, вы бы поняли, что здесь нам совсем не рады."
13050-42 = "Эти девушки были готовы выступить против гиганта Корпорация Кайзер, чтобы защитить школу."
13050-43 = "Считайте это локомотивом, который может взорваться в любую секунду."
13050-44 = ""
13050-46 = ""
13050-47 = ""
13050-48 = ""
13050-49 = ""
13050-50 = "Эм..."
13050-52 = "Хотя поводов для настоящего беспокойства нет. Если начнётся драка, я легко с ними разберусь."
13050-53 = ""
13050-56 = ""
13050-57 = ""
13050-58 = ""
13050-59 = ""
13050-60 = "Дыши глубже, Широко! Дыши!"
13050-61 = ""
13050-64 = ""
13050-66 = "Не собиралась. Двойная клятва."
13050-67 = "Почему ты строишь невинную?! Я знаю, ты уже была готова взорваться!"
13050-68 = "Ой."
13050-69 = ""
13050-71 = ""
13050-72 = "[ns1] «Давайте к делу, Суо.»\n[ns2] «Вы пришли поговорить с Комитетом по выплате долга?»"
13050-75 = "Да."
13050-76 = "Сенсей Шале, верно? Прошу прощения за прежнюю ситуацию."
13050-77 = "Однако боюсь, переговоры вы будете вести не с нами."
13050-78 = "*тршш* Район защищён. Можно проходить."
13050-79 = "*кашель* *кашель* Слава богу. Откуда в одном месте столько пыли?"
13050-80 = "Да, какая дикость. Не хочу находиться в этой токсичной среде дольше необходимого. Зайдём внутрь."
13050-81 = "К-Кто эти типы?"
13050-82 = "Следите за выражениями. В конце концов, это ваши кредиторы."
13050-83 = "...Кредиторы?"
13050-84 = "В смысле... наши кредиторы? Ты привела сюда этих акул?!"
13050-85 = "Давайте немного потише, Сэрика."
13050-86 = "Похоже, это те, кто выкупил производные облигации..."
13050-87 = "[s] «Полагаю, другого выбора, кроме как выслушать их, у нас нет.»"
13050-88 = "Хорошо..."
13050-90 = "..."
13050-92 = "Прошу прощения."
13050-93 = "Хмф. Так это комната студсовета Абидоса. Ещё теснее, чем я ожидал."
13050-94 = "Рады познакомиться. Мы — фонд прямых инвестиций, вложившийся в это предприятие. Для вас мы новые кредиторы Абидоса."
13050-95 = "А я их юридический представитель, выступающий от имени их интересов."
13050-97 = "Д-Добро пожаловать..."
13050-98 = "Кто вы вообще? Разве облигации не купила Нефтис? Вы не похожи на людей Нефтис."
13050-100 = "Верно. Они действительно приобрели права на Транс-пустынную железную дорогу Абидоса по довольно чрезмерной цене."
13050-101 = "Однако самостоятельно такую сумму они позволить себе не могли. Потребовались средства множества заинтересованных сторон."
13050-102 = "Для этого они создали фонд прямых инвестиций. Мы — его инвесторы."
13050-104 = "Фонд прямых инвестиций?"
13050-105 = "Это частная инвестиционная группа, обычно состоящая из небольшого числа заинтересованных сторон."
13050-107 = "Как сказала юная леди. Помимо нас есть и множество других инвесторов."
13050-108 = "Например, Союз долговых работников и Союз ломбардов, а также Гильдия аукционов по взысканию, Gelatin Gummies, Zako Business и—"
13050-110 = "Кучка мутных типов."
13050-111 = "Кхм! Хмм!"
13050-112 = "Ха-ха-ха. Она не ошибается. Я и сама когда-то торговала краденым на чёрном рынке."
13050-113 = "Мы не из тех, кто любит привлекать внимание. Вот поэтому Нефтис, законная компания с хорошей общественной репутацией, и выступает красивым лицом всей схемы."
13050-114 = "..."
13050-115 = "С каждой фразой вы звучите всё подозрительнее."
13050-116 = "Эм... Ну..."
13050-117 = ""
13050-119 = ""
13050-120 = "[ns3] «Простите, но у вас есть доказательства, что вы действительно кредиторы Абидоса?»\n[ns4] «Обеим сторонам выгодно убедиться, что всё в порядке.»"
13050-123 = "Вы смеете нам не доверять?"
13050-124 = "Как неприятно."
13050-125 = "Ну-ну. Давайте успокоимся и обсудим всё как цивилизованные взрослые."
13050-127 = "*тршш*... Я гарантирую, что эти кредиторы законны."
13050-128 = "А? Кто теперь?"
13050-129 = "Д-Дворецкий...?"
13050-130 = "Ты знаешь этого человека, Нономи?!"
13050-131 = "Да. Он сотрудник Нефтис Group... а ещё дворецкий, который фактически меня вырастил."
13050-133 = "Давно не виделись, госпожа. Простите, что наша встреча проходит при таких обстоятельствах."
13050-134 = ""
13050-136 = ""
13050-137 = "Я объясню ситуацию. Мы организовали фонд прямых инвестиций, чтобы собрать деньги и купить облигации."
13050-138 = "Их имена указаны в этих договорах фонда. Я отправлю вам копию, так что можете всё проверить."
13050-139 = "А, да... Спасибо."
13050-140 = "На первый взгляд всё, что они говорят, похоже на правду. Мм... Здесь вижу их принадлежность и права на облигации."
13050-142 = "Хмф! Как мы и сказали!"
13050-143 = "Этого доказательства достаточно, верно?"
13050-144 = "[s] «...Да. Спасибо за терпение.»"
13050-146 = "Хм. Значит, они не мутные мошенники."
13050-147 = "Сэрика, пожалуйста..."
13050-148 = "Ха-ха-ха. Раз теперь мы все понимаем ситуацию... Продолжим."
13050-149 = "Как кредиторы этого фонда мы пришли обсудить с вами один довольно важный вопрос."
13050-150 = "О Транс-пустынной железной дороге?"
13050-152 = "..."
13050-154 = "А. Да-да. Разумеется, вы подготовились."
13050-155 = "Верно. Нет смысла ходить вокруг да около. Наша цель — получить все права на Транс-пустынную железную дорогу."
13050-156 = ""
13050-158 = ""
13050-160 = "*кивок* *кивок*"
13050-161 = "Именно поэтому фонд прямых инвестиций и существует."
13050-163 = "Мы купили эти облигации у Кайзер по почти мошеннической цене только ради того, чтобы получить права на железную дорогу."
13050-164 = "В облигации входили права на строительство всех незавершённых линий. Поэтому прежние действия академии Хайлендер не нарушали закон."
13050-165 = "Ну да! Мы это и ГОВОРИЛИ. Права наши, значит, делаем что хотим."
13050-166 = "Агась. Что хотим!"
13050-167 = ""
13050-169 = ""
13050-170 = "Офицеры, пожалуйста, не провоцируйте их."
13050-171 = "Эм... Я не понимаю, зачем вам вообще понадобилась Транс-пустынная железная дорога."
13050-172 = "Пожалуйста, объясни, Дворецкий. Зачем вы это делаете?"
13050-173 = "Похоже, я оказался в несколько неудобном положении... *вздох*"
13050-174 = "Тогда отвечу я, юная госпожа Нефтис."
13050-175 = "Я понимаю, что проект Транс-пустынной железной дороги — болезненная тема и для Нефтис, и для Абидоса. В конце концов, именно он в одиночку ускорил падение района."
13050-176 = "Я не хочу слышать это от вас! Ты должен сказать, что думает Нефтис, Дворецкий!"
13050-177 = "Это изначально был опасный и безрассудный проект! Более того, строить такую транспортную инфраструктуру в этом пустынном месте вообще не имело смысла."
13050-178 = "К тому моменту в Абидосе не осталось ни ресурсов, ни торговли, ни даже нормальной экономики!"
13050-179 = "Он высосал последние средства и из Нефтис, и из Абидоса, а затем был брошен гнить. Если бы не этот проект...!"
13050-180 = "После всей боли, которую он причинил, вы хотите вернуть его? Почему? Почему, Дворецкий?"
13050-182 = "Какова цель? Ещё больше боли? Ещё больше жертв? Что вообще задумала Нефтис?!"
13050-183 = "Успокойся, Нономи."
13050-184 = "Нономи..."
13050-185 = ""
13050-187 = ""
13050-188 = "...Интересно. Но мы пришли не на допрос. Перейдём к вопросу."
13050-189 = "Однако прежде чем начнём..."
13050-190 = "Если не возражаете, я бы хотел продолжить разговор только с непосредственно вовлечёнными сторонами."
13050-191 = "Все, кто не является членом студсовета Абидоса, пожалуйста, выйдите."
13050-192 = "Хорошо. Пошли."
13050-193 = "Э-Эй! Убери от меня свои грязные лапы!"
13050-194 = "Уа. Обязательно? Хикари хотела ещё поиграть..."
13050-195 = ""
13050-197 = ""
13050-198 = "Я тоже откланяюсь."
13050-199 = ""
13050-201 = ""
13050-202 = ""
13050-203 = "Т-Тогда кто будет представлять Нефтис?"
13050-204 = "Нашим представителем выступит надзиратель Суо."
13050-205 = "...Простите?"
13050-206 = "Не вижу в этом проблемы. Да, она студент Хайлендер, но сейчас работает на Нефтис."
13050-207 = "Пусть она и состоит в CCC, она также одна из наших. Я считаю её достойной доверия."
13050-208 = "Ну что же, у меня есть и другие дела."
13050-209 = ""
13050-211 = ""
13050-212 = "..."
13050-214 = ""
13050-216 = ""
13050-217 = "Что вообще происходит..."
13050-218 = "..."
13050-219 = "Эм..."
13050-220 = "[s] «...»"
13050-222 = "Хм? Кажется, я просил присутствовать студсовет Абидоса. Насколько мне известно, туда входит только Таканаши Хошино."
13050-224 = "Н-Нет! Мы тоже члены студсовета!"
13050-225 = "Именно! Комитет по выплате долга — официальный студсовет, назначенный нашим советником!"
13050-226 = "[s] «Верно. Как их учитель, я это утвердил.»"
13050-227 = "...Понятно. Хм."
13050-228 = "Как странно. В документах указано, что единственный человек, связанный со студсоветом Абидоса, — госпожа Хошино... Значит, вы утверждаете, что существует ещё один студсовет под названием Комитет по выплате долга?"
13050-229 = "Э-Это..."
13050-231 = "А, да. Это моя вина. Формально я связана с обоими."
13050-232 = "Студсовет Абидоса носит официальное название, но уже много лет его функции выполняет Комитет по выплате долга."
13050-233 = "Хм... Довольно запутанно, но, кажется, понимаю."
13050-234 = "Тогда взгляните, пожалуйста, на это."
13050-235 = ""
13050-237 = ""
13050-239 = "Это...?"
13050-240 = "Этот документ... недавно случайно нашли в хранилище документов академии Хайлендер."
13050-242 = "Это договор, составленный прежним председателем студсовета Абидоса, Кучинаши Юмэ."
13050-243 = ""
13050-246 = ""
13050-248 = "...!!"
13050-250 = "Следующий эпизод;Договор купли-продажи"
