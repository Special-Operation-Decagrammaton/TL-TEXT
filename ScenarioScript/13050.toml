[translation]
13050-1 = "Episódio 5;Ferrovia Transdesértica"
13050-2 = "Entrada triunfal, seguida de pose de vitória!"
13050-3 = "Aqui não é meio apertado?#nOnde é que a gente vai sentar?"
13050-8 = "..."
13050-10 = "Não saiam zanzando por aí.#nSentem-se logo."
13050-11 = "Se ficarem pulando nas cadeiras, eu vou ficar brava de verdade."
13050-12 = "C-Com licença..."
13050-13 = "...Perdão pela cena.#nEstão todas as integrantes do Comitê de Contramedidas de Abydos aqui?"
13050-26 = "...Segura as pontas ainda, Shiroko-senpai."
13050-27 = "...Nn."
13050-29 = "Sim, nós somos o Comitê de Contramedidas."
13050-30 = "Não achei que vocês fossem mesmo aparecer...#nE então, o que querem?"
13050-35 = "Eu exijo esses docinhos aí~"
13050-36 = "Em Abydos vocês nem servem um chazinho pras visitas, é?"
13050-38 = "Ah... Só um instante, por favor."
13050-39 = "Não se incomode.#nA conversa vai ser breve."
13050-40 = "?"
13050-41 = "...Pra começo de conversa, é óbvio que não seríamos bem-vindas aqui."
13050-42 = "Essas garotas enfrentaram até a Kaiser para recuperar a terra delas."
13050-43 = "Eu já avisei que existe a chance de recorrerem à força.#nSe vieram achando que isso é brincadeira, voltem agora mesmo."
13050-50 = "..."
13050-52 = "Embora, mesmo que vocês partam para a força — quem vai vencer sou eu."
13050-60 = "Shiroko-senpai! Relaxa, relaxa!"
13050-66 = "Eu não ia fazer nada..."
13050-67 = "Como assim não ia?!#nVocê estava com cara de quem ia aprontar a qualquer segundo!"
13050-68 = "Nn..."
13050-72 = "[ns1] \"Então, indo direto ao assunto...\"\n[ns2] \"Você vai explicar o que aconteceu da última vez, certo?\""
13050-75 = "Sim, foi para isso que vim hoje."
13050-76 = "Sensei da Schale, certo?#nPeço desculpas pelo outro dia. Parece que houve um desencontro de informações."
13050-77 = "Eu mesma poderia explicar, mas... chamei outras pessoas."
13050-78 = "...Podem entrar."
13050-79 = "Cof, cof... Ufa, que sufoco.#nLá fora, então, a poeira de areia está terrível..."
13050-80 = "Concordo plenamente.#nVamos resolver logo o que temos para tratar e ir embora."
13050-81 = "Q-Quem são esses caras?"
13050-82 = "É melhor tomar cuidado com o que diz.#nPermitam-me apresentar: estes são os novos credores de Abydos."
13050-83 = "Credores..."
13050-84 = "...Hã?#nQuer dizer, agiotas?!"
13050-85 = "Serika-chan, tenta escolher melhor as palavras..."
13050-86 = "Ou seja, são os senhores que compraram os títulos da dívida..."
13050-87 = "[s] \"...Primeiro, vamos ouvir o que eles têm a dizer.\""
13050-88 = "Certo..."
13050-90 = "..."
13050-92 = "...Ah, fizeram-nos esperar bastante."
13050-93 = "Entendo, então esta é a sala do conselho estudantil de Abydos.#n...Não imaginava que fosse tão pequena."
13050-94 = "Muito prazer. Somos os responsáveis pelo grupo que investiu neste empreendimento."
13050-95 = "Dentre eles, sou eu quem atua como representante da associação de credores.#nÉ uma honra conhecê-las."
13050-97 = "O-Olá..."
13050-98 = "Mas não foi a Nephthys que comprou a dívida?#nVocês não parecem nem um pouco ser da Nephthys."
13050-100 = "Sim, quanto ao fato de a Nephthys ter adquirido a dívida, a senhorita está absolutamente correta.#nComo resultado, asseguramos os direitos sobre a Ferrovia Transdesértica."
13050-101 = "No entanto, não foi a Nephthys quem arcou sozinha com todo o capital da aquisição."
13050-102 = "— Se eu disser fundo de investimento privado, fica claro?"
13050-104 = "Fundo de investimento privado?"
13050-105 = "É um grupo que reúne capital de um número restrito de investidores para operar um negócio."
13050-107 = "Exatamente.#nAlém de nós, há outros que investiram neste projeto."
13050-108 = "A Cooperativa de Leilões de Bens Apreendidos, a Comercial Balinhas de Gelatina, a Indústria Amantes de Guaxinins, entre outros..."
13050-110 = "Só pelo nome já dá pra ver que é um bando de gente suspeita..."
13050-111 = "Aham!"
13050-112 = "Não vou negar.#nOriginalmente, eu mesmo lidava com mercadoria roubada no mercado negro."
13050-113 = "Justamente por isso, adquirimos os títulos em nome da Nephthys.#nNão convém expor demais nossos rostos em público."
13050-114 = "..."
13050-115 = "O clima está ficando cada vez mais esquisito..."
13050-116 = "Bem, hum..."
13050-120 = "[ns3] \"Os senhores têm algo que comprove que são credores?\"\n[ns4] \"Antes de tudo, deixe-me verificar isso.\""
13050-123 = "...Está duvidando de nós?"
13050-124 = "Que insolência absurda."
13050-125 = "Ora, acalmem-se todos.#nVamos manter uma conversa civilizada, como adultos —"
13050-127 = "...Esses senhores são, sem dúvida alguma, os credores."
13050-128 = "Quem é o senhor...?"
13050-129 = "M-Mordomo...?"
13050-130 = "Nonomi-senpai, você conhece ele?"
13050-131 = "Sim... Ele é um executivo do Grupo Nephthys#ne costumava cuidar de mim."
13050-133 = "Há quanto tempo, senhorita.#nPeço desculpas por ter de cumprimentá-la sob estas circunstâncias."
13050-137 = "Para efetuar a compra dos títulos da dívida, recorremos a diversos investidores para levantar o capital."
13050-138 = "Trouxe aqui uma cópia da documentação comprobatória.#n...Por favor, verifique."
13050-139 = "Ah, sim... Com licença."
13050-140 = "...Não há erro.#nEsses senhores realmente detêm os direitos."
13050-142 = "Isso satisfaz a sua curiosidade?"
13050-143 = "Ou ainda tem algo mais a dizer?"
13050-144 = "[s] \"Não, eu só precisava confirmar primeiro.\""
13050-146 = "Ora, vejam só.#nNo fim das contas, eu estava certa, são mesmo agiotas."
13050-147 = "Serika-chan, eu já disse pra cuidar das palavras..."
13050-148 = "Fico feliz que todas as dúvidas tenham sido dissipadas.#nPois bem, vamos prosseguir."
13050-149 = "O motivo da nossa visita hoje é uma pequena consulta."
13050-150 = "Sobre a Ferrovia Transdesértica, não é...?"
13050-152 = "..."
13050-154 = "...Entendo.#nEntão já estão a par da situação até certo ponto?"
13050-155 = "Sendo assim, vou ser bem direto.#nNosso objetivo é obter a totalidade dos direitos sobre a Ferrovia Transdesértica."
13050-160 = "..."
13050-161 = "Sim, foi exatamente para isso que o fundo privado foi criado."
13050-163 = "E foi por isso que desembolsamos toda aquela quantia para comprar a dívida da Kaiser."
13050-164 = "Ao menos os direitos de desenvolvimento da ferrovia já nos pertencem.#nOu seja, não há qualquer irregularidade nas ações da Academia Highlander."
13050-165 = "Isso aí! A gente só começou as obras depois que os títulos foram garantidos.#nNão tem problema nenhum, né?"
13050-166 = "Yeees, sem nenhum problema~"
13050-170 = "...Fiquem quietas um pouco."
13050-171 = "Com licença... mas por que a Ferrovia Transdesértica...?"
13050-172 = "Mordomo, o que isso significa?"
13050-173 = "Não sei bem como explicar..."
13050-174 = "Eu compreendo seus sentimentos, jovem herdeira da Nephthys."
13050-175 = "Não deve ser nada agradável ouvir o nome da Ferrovia Transdesértica.#nAfinal, foi por causa dela que o declínio de Abydos se acelerou."
13050-176 = "...Por favor, me diga, mordomo!#nO que a Nephthys está pensando?!"
13050-177 = "Aquele projeto já estava errado desde o início.#nConstruir uma infraestrutura de transporte gigantesca num distrito que não para de desertificar..."
13050-178 = "Abydos não é um eixo logístico e nem possui recursos subterrâneos...#nExpandir uma malha de transporte num lugar assim..."
13050-179 = "Só serviu para acelerar a decadência de Abydos..."
13050-180 = "Por que foram recomprar isso justamente agora?!#nInvestindo tanto dinheiro assim...!"
13050-182 = "O que diabos a Nephthys está tentando fazer?!"
13050-183 = "Calma, Nonomi-chan."
13050-184 = "Nonomi-senpai..."
13050-188 = "...Já terminou de falar?"
13050-189 = "Podemos finalmente apresentar a nossa pauta?"
13050-190 = "Ah, poderiam pedir a todos, exceto os responsáveis, que se retirem?"
13050-191 = "Vamos deixar apenas o pessoal do Conselho Estudantil de Abydos na sala."
13050-192 = "Anda, vamos."
13050-193 = "Já falei pra não me empurrar!"
13050-194 = "Não quero ir emboraaa~"
13050-198 = "Também vou me retirar, senhorita."
13050-203 = "M-Mas e o representante da Nephthys...?!"
13050-204 = "Deixaremos a supervisora Suou aqui como nossa representante."
13050-205 = "...Você está falando sério?"
13050-206 = "Claro. No momento, contratualmente falando, você trabalha para a Nephthys."
13050-207 = "Podem considerá-la uma representante da Nephthys, assim como nós."
13050-208 = "Com licença, então. Tenho outro compromisso."
13050-212 = "..."
13050-217 = "Ai, eu não estou entendendo mais nada..."
13050-218 = "..."
13050-219 = "..."
13050-220 = "[s] \"...\""
13050-222 = "...Não me ouviram?#nEu disse para ficarem apenas os membros do \"Conselho Estudantil de Abydos\".#nPeço que todos, exceto Hoshino Takanashi-san, se retirem."
13050-224 = "O quê?! Nós também somos do conselho estudantil!"
13050-225 = "Nós, do Comitê de Contramedidas, somos o atual conselho estudantil de Abydos!#nTemos inclusive o reconhecimento do Sensei da Schale, bem aqui!"
13050-226 = "[s] \"Ela tem razão.\""
13050-227 = "...Entendo, então é assim."
13050-228 = "Mas que curioso...#nNos registros, consta que apenas Hoshino-san pertence ao Conselho Estudantil de Abydos.#n...Quer dizer que existem dois conselhos estudantis em Abydos?"
13050-229 = "I-Isso é..."
13050-231 = "Ah... deve ser porque eu faço parte dos dois."
13050-232 = "O Conselho Estudantil de Abydos só existe no papel hoje em dia. O conselho de verdade agora é o \"Comitê de Contramedidas\" mesmo."
13050-233 = "Compreendo a situação.#nDesde que sejam o conselho estudantil, para nós tanto faz."
13050-234 = "Pois bem, deem uma olhada nisto."
13050-239 = "Isto é..."
13050-240 = "Um documento encontrado outro dia no depósito da Academia Highlander."
13050-242 = "Estão vendo a assinatura aqui em nome da antiga presidente do conselho estudantil de Abydos... Yume Kuchinashi?"
13050-248 = "...!"
13050-250 = "Próximo;O Contrato"
