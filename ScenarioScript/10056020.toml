[translation]
10056020-1 = "Episode 2;The Girl with Bad Eyes"
10056020-5 = "(After chasing Sayuri and Makina, I ran around the deck for a while.)"
10056020-6 = "(However, the two of them were not easily caught, and the chase continued...)"
10056020-11 = "Ah..."
10056020-17 = "(I collided with a student coming from around the corner.)"
10056020-19 = "[ns] \"S-Sorry! Are you okay?\""
10056020-22 = "I am fine. Are you hurt at all?"
10056020-23 = "I am not wearing my glasses so I cannot see well... I was not paying attention either."
10056020-24 = "I need to hurry to the clubroom to get my glasses..."
10056020-25 = "[s] \"Would you like me to help?\""
10056020-26 = "It is fine. It happens every day, and I could find my way even with my eyes closed."
10056020-27 = "Besides, were you not chasing someone? Is it okay for you to be talking to me like this?"
10056020-28 = "[s] \"...They probably got away by now.\""
10056020-29 = "What do they look like?"
10056020-30 = "[s1] \"A blue-haired girl holding a controller...\"\n[s2] \"A white-haired girl wearing a white swimsuit...\""
10056020-31 = "Could that be... Makina?"
10056020-32 = "Could that be... Sayuri?"
10056020-33 = "[s] \"That is right. Do you know about the Diving Club too?\""
10056020-34 = "Do you have some business with our club members?"
10056020-35 = "You better not be trying to lay a finger on them--"
10056020-36 = "[s3] \"That is not it at all!\"\n[s4] \"...Huh? Your club members?\""
10056020-39 = "You look suspicious."
10056020-43 = "Will you come with me?#nWe need to verify this at the Trident headquarters."
10056020-44 = "[s5] \"I do not mind, but...\"\n[s6] \"Who you are talking to right now is not me, but a poster.\""
10056020-50 = "Ah."
10056020-54 = "My eyesight is bad... I always mistake people for someone else."
10056020-59 = "...I have not heard that voice before... Are you from another academy?"
10056020-60 = "[s7] \"Um... You are too close.\"\n[s8] \"Could you back up a little...?\""
10056020-63 = "Hmm... From the feel of it, you do not seem to have a distinctive face."
10056020-64 = "Your arm muscles... With this level of build, you are definitely not an Odyssey student."
10056020-65 = "Let me touch here as well--"
10056020-66 = "[s9] \"T-That area is no good!\"\n[s10] \"Should we go get your glasses first!?\""
10056020-69 = "Kotone!"
10056020-74 = "Were you using your hands to feel and check the other person again?"
10056020-75 = "I told you to call me in times like this, right? Right?"
10056020-76 = "But President Kokoro, this person was chasing Makina and Sayuri."
10056020-77 = "Could they be a suspicious person?"
10056020-78 = "You are acting more suspicious right now, Kotone..."
10056020-79 = "[s11] \"Kokoro... President?\"\n[s12] \"Then are you also a Diving Club member?\""
10056020-82 = "Y-Yes! Well, yes, but..."
10056020-83 = "Do you have some business with our club?"
10056020-84 = "Or did one of our members do something rude to you..."
10056020-85 = "[s] \"Not at all.\""
10056020-86 = "Is that so... Thank goodness...#nWe have been getting a lot of complaints lately..."
10056020-90 = "Ah, I apologize for the late introduction.#nI am Toumi Kokoro, the president of the Diving Club..."
10056020-91 = "So, what is your business with us?"
10056020-92 = "[s] \"Huh? You are that person from...\""
10056020-96 = "Eh? Could it be--"
10056020-97 = "The peeping tom from back then?!"
