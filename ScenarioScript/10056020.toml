[translation]
10056020-1 = "Episode 2; The Girl With The Bad Eyesight"
10056020-5 = "(I chased the fleeing Sayuri and Makina around the ship.)"
10056020-6 = "(However, they were not so readily caught, so this game of tag persisted...)"
10056020-11 = "Ah…"
10056020-17 = "(I bumped into a student turning around the corner.)"
10056020-19 = "[ns] \"I-I'm so sorry! Are you alright?\""
10056020-22 = "I'm all right. How about you? Are you hurt?"
10056020-23 = "I can't see very well without my glasses, so my own negligence was at fault here as#nwell."
10056020-24 = "I really need to make my way to the clubroom to pick up my glasses…"
10056020-25 = "[s] \"Would you like me to help?\""
10056020-26 = "I'll be fine. Since this happens everyday, I can make it there with my eyes closed."
10056020-27 = "More importantly, weren't you chasing someone just now? Is it all right for you to be chatting away like this?"
10056020-28 = "[s] \"…They're probably already gone by this point.\""
10056020-29 = "Do they have any distinct characteristics?"
10056020-30 = "[s1] \"One was a blue haired girl holding a controller…\"\n[s2] \"One was a white haired girl wearing a white swimsuit…\""
10056020-31 = "So… Makina?"
10056020-32 = "So… Sayuri?"
10056020-33 = "[s] \"Yep, that's right. Do you know about the Diving Club as well?\""
10056020-34 = "What business do you have with our club members?"
10056020-35 = "Don't tell me you laid your hands on the two of them…"
10056020-36 = "[s3] \"There's no way I would!\"\n[s4] \"…Hm? 'Our' club members?\""
10056020-39 = "How suspicious…"
10056020-43 = "Could you come with me? #nI need to bring you in to Trident HQ for some confirmation."
10056020-44 = "[s5] \"I don't mind, but…\"\n[s6] \"That's not me you're talking to. That's a poster.\""
10056020-50 = "Ah."
10056020-54 = "My eyesight isn't very good, so I often get mixed up."
10056020-59 = "…This is my first time hearing your voice… Are you from another school?"
10056020-60 = "[s7] \"Umm... You're a little too close.\"\n[s8] \"Could you maybe back up just a bit...?\""
10056020-63 = "Hmm... By the feel of things, it doesn't seem like your face has any distinct#ncharacteristics."
10056020-64 = "Your arms... don't have enough muscle for you to be a student from Odyssey."
10056020-65 = "Let me feel this part as well—"
10056020-66 = "[s9] \"A-absolutely not there!\"\n[s10] \"Let's hurry up and get you your glasses!\""
10056020-69 = "Kotone!"
10056020-74 = "Are you checking people out by touching them again?"
10056020-75 = "I told you to call me if it ever came down to it, didn't I? Didn't I?"
10056020-76 = "But President Kokoro, this person was chasing Makina and Sayuri."
10056020-77 = "They could be suspicious."
10056020-78 = "The more suspicious one right now is you..."
10056020-79 = "[s11] \"President... Kokoro?\"\n[s12] \"Are you part of the Diving Club as well?\""
10056020-82 = "Y-yes! I am, but..."
10056020-83 = "Do you have some sort of business with our club?"
10056020-84 = "Or did one of our members do something impolite...?"
10056020-85 = "[s] \"That's not it.\""
10056020-86 = "Really? Oh, thank goodness... #nWe've been receiving a lot of complaints lately..."
10056020-90 = "Ah, I forgot to introduce myself. #nMy name is Toumi Kokoro. I'm the president of the Diving Club."
10056020-91 = "So then, what business do you have with us?"
10056020-92 = "[s] \"Huh? Weren't you the one from yesterday...?\""
10056020-96 = "Wait, are you..."
10056020-97 = "Are you the peeper from yesterday!?"