[translation]
1000820-1 = "Почему она носит бомбер"
1000820-2 = "Я отправился на площадь Миллениума встретиться с Нэру."
1000820-3 = ""
1000820-7 = "Я заметил Нэру, ожидающую на скамейке на другой стороне площади."
1000820-8 = ""
1000820-10 = ""
1000820-12 = "[ns] «...?»"
1000820-13 = ""
1000820-14 = "Н-Но... нам нужно идти т-туда..."
1000820-15 = "Не тупи! Ты её не видишь? Лучше обойдём."
1000820-16 = "Ага... Президент C&C такая страшная. Эм... Она точно выделяется из толпы."
1000820-17 = "Нам ещё повезло, что она так выделяется. Легче избегать. Может, именно поэтому она так одевается?"
1000820-18 = "О... понял. Может быть. Типа «не трогайте меня»..."
1000820-19 = "Наверняка. Так что лучше сделаем, как она хочет, и пойдём другой дорогой."
1000820-20 = ""
1000820-23 = ""
1000820-24 = "[ns] «...»"
1000820-26 = "[ns1] Подойти к Нэру.\n[ns2] Позвать Нэру."
1000820-29 = "...?"
1000820-30 = "...О, Сенсей! Не ожидала, что ты придёшь так быстро."
1000820-31 = ""
1000820-34 = ""
1000820-35 = "Мог бы хоть что-нибудь сказать. Чего просто стоял там?"
1000820-36 = "А? Что-то случилось? Нет, я звала тебя не из-за проблем. Как и сказала, ничего особенного не происходит."
1000820-37 = "Эй! Ты ведь не думаешь какую-нибудь хрень вроде «если ничего не происходит, зачем ты меня звала», да? После всего, что было..."
1000820-38 = "А? Что?"
1000820-39 = "...С чего вдруг тебя заинтересовали бомберы?"
1000820-40 = "А, этот? Мой бомбер? А что с ним?"
1000820-41 = "Только не говори..."
1000820-42 = "Я знала, что у тебя отличный вкус, Сенсей! Тебе тоже нужен!? Хочешь, я достану тебе один?!"
1000820-43 = "Сразу говорю, найти их непросто, но ради тебя, Сенсей, я сделаю что угодно..."
1000820-44 = "...Хм?"
1000820-45 = "Не это ты имел в виду? Тогда что?"
1000820-46 = "...Почему я его ношу?"
1000820-47 = "Мой бомбер..."
1000820-48 = "..."
1000820-49 = "[s3] «...Нэру?»\n[s4] «Эм, ты в порядке?»"
1000820-52 = "Ах."
1000820-53 = "Аха. Ах. Ха."
1000820-54 = "Ничего, ничего. Прости, мой косяк!"
1000820-55 = "Ты же Сенсей, не кто-то другой. Я подумала, что ты имеешь в виду... но нет. Просто на секунду напряглась."
1000820-56 = "Обычно, когда люди спрашивают, зачем я это ношу, они хотят подраться."
1000820-57 = "Вот я и напряглась. Но ты точно не за этим."
1000820-58 = "Ладно. Вернёмся к вопросу..."
1000820-59 = "Бомбер... Почему я его ношу... Ну..."
1000820-60 = "Но погоди, почему ты спрашиваешь именно сейчас? Что-то случилось, что заставило задуматься, или..."
1000820-61 = "[s5] «Мне было интересно, есть ли за этим какая-то история.»\n[s6] «Мне было интересно, есть ли в этом какой-то смысл.»"
1000820-64 = "...А... хм..."
1000820-65 = "Если так ставить вопрос, ответить сложно."
1000820-66 = "Если скажу «без причины», ты ведь не поверишь? Решишь, что я что-то скрываю."
1000820-67 = "Ты такой человек, Сенсей. Чересчур добрый, бессмысленно внимательный. Головная боль."
1000820-68 = "Так как же это объяснить?"
1000820-69 = "Хм?"
1000820-70 = "Просто сказать честно? Ты уверен?"
1000820-71 = "Нет, это не секрет и вообще ничего особенного. Если честно, я думала, никто не поверит, потому что причина слишком простая."
1000820-72 = "Но если ты правда хочешь знать, Сенсей, я скажу."
1000820-73 = "Я ношу его потому что..."
1000820-74 = "...он чертовски крутой."
1000820-75 = ""
1000820-77 = ""
1000820-78 = ""
1000820-79 = "И?"
1000820-80 = "Такого ответа ты ждал?"
1000820-81 = "[s7] «Это... определённо просто.»\n[s8] «Это... отличная причина.»"
1000820-84 = "Хахаха! Что у тебя за лицо? Я знала, что ты начнёшь странно реагировать."
1000820-85 = "Хотя я примерно представляю, о чём ты думал."
1000820-87 = "Наверное, что я компенсирую маленький рост или..."
1000820-88 = "Или что хочу, чтобы меня не трогали и считали страшной."
1000820-89 = "Обычно мне говорят что-то в таком духе. Ну, это их мнение. Мне всё равно."
1000820-90 = "А люди с особенно богатым воображением выдумывают, будто это чья-то старая куртка или подарок."
1000820-91 = ""
1000820-92 = "Но на самом деле я просто увидела её в магазине, подумала, что она крутая, и сразу купила."
1000820-93 = "Прости, если скучно, но ты хотел правду."
1000820-94 = "Что?"
1000820-95 = "Нет, я никому раньше этого не рассказывала. Ты первый, кто спросил и действительно хотел узнать."
1000820-96 = "Обычно люди либо хотят подраться и не слушают ответ, либо не давят дальше, когда я говорю, что причины нет."
1000820-97 = "...Наверное, правда довольно разочаровывающая, да?"
1000820-98 = "[s9] «Мне точно не было скучно.»\n[s10] «Ответ тебе подходит, Нэру.»"
1000820-101 = ""
1000820-103 = ""
1000820-104 = "...О!"
1000820-105 = "Я... удивлена. Ты правда предпочитаешь такой ответ всем диким историям, которые придумывают люди?"
1000820-106 = "Я буквально сказала, что смысла нет. Почему так лучше?"
1000820-107 = "[s11] «Причина ведь не обязательна, верно?»\n[s12] «Люди должны одеваться как хотят.»\n[s13] «...Потому что это чертовски круто.»"
1000820-111 = ""
1000820-113 = ""
1000820-114 = "*вздыхает*"
1000820-115 = "Сенсей, это..."
1000820-116 = "Вот именно поэтому..."
1000820-117 = ""
1000820-119 = ""
1000820-122 = ""
1000820-123 = ""
1000820-124 = ""
1000820-126 = "...ты мне нравишься."
