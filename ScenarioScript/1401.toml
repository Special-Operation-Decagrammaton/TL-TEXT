[translation]
1401-1 = "Оружие и перцы, часть 1"
1401-2 = "Мастерская Инженерного Департамента"
1401-3 = ""
1401-4 = ""
1401-5 = "Хм. Если уменьшить массу этого нижнего подшипника, соединённого с приводным валом, скорость будет..."
1401-6 = ""
1401-7 = "О, уже обед. Утаха! Обслуживанием двигателя займёшься после обеда. Давайте поедим, пока руки ещё не испачкали!"
1401-8 = "Хорошо, дай минутку. Я почти закончила проваривать швы. Доделаю — и вместе пойдём в столовую."
1401-9 = "Но наша рабочая одежда вся в саже. Я так увлеклась, что даже не заметила..."
1401-10 = "Знаю. Было бы довольно грубо заявиться туда в таком тряпье... Может, как вчера, закажем еду прямо в мастерскую?"
1401-11 = "Отличная идея! Мне как раз хочется жирного фастфуда с кучей ветчины и сыра."
1401-12 = "Нам нужен фастфуд с большим выбором, который легко делить и при этом почти не пачкать руки..."
1401-13 = ""
1401-14 = "Это пицца!"
1401-15 = "Согласна. Нет ничего лучше, чем заказать пиццу прямо в мастерскую."
1401-16 = "Ха. Вам двоим пицца вообще никогда не надоедает."
1401-17 = "Ну, не стану отрицать, мне тоже захотелось. Возьмём как обычно — пепперони и сырную."
1401-20 = "Доставка из «Камехаме Пицца»! Вы заказывали пиццу с пепперони и сырную?"
1401-21 = "Да, пожалуйста, поставьте на стол."
1401-22 = ""
1401-23 = "Понял. Спасибо, что выбрали «Камехаме»!"
1401-25 = "*вдыхает* Ох, этот насыщенный запах сыра... Я ещё даже не попробовала, а уже проголодалась!"
1401-26 = "Приступим."
1401-28 = ""
1401-29 = "М-м-м. Пицца с пепперони — лучшая! Нет ничего вкуснее тягучего сыра и солоноватого пепперони!"
1401-30 = "А мне нравится хорошая сырная пицца. Простого, лёгкого вкуса сыра мне вполне достаточно."
1401-31 = "Правда? От слишком большого количества сыра меня немного мутит...#nКотори, передашь острый соус?"
1401-32 = "Разве его не должны были положить в коробку? Тут нет."
1401-33 = "В коробке только тёртый сыр. Наверное, курьер забыл соус."
1401-34 = "Что? Непростительно. Все знают, что про остренькое забывать нельзя!"
1401-35 = "Давайте завалим раздел отзывов в приложении доставки и проучим этого курьера!"
1401-37 = "Успокойся, Котори. Все иногда что-нибудь забывают, особенно когда много работы. Ошибки случаются, давайте простим его."
1401-38 = "После прошлого раза в шкафчике клубной комнаты должен был остаться острый соус.#nЯ могу просто сходить за ним."
1401-39 = ""
1401-40 = ""
1401-41 = ""
1401-42 = ""
1401-43 = "А? Я точно оставляла соус где-то здесь... Куда он делся?"
1401-44 = "Этот шкаф всегда забит всяким хламом. Может, кто-то вытащил его, когда искал инструмент?"
1401-45 = "Эх. Значит, в этот раз пицца всё-таки будет без острого соуса..."
1401-46 = "Интересно, кто-нибудь уже изобрёл штуку, которая выдаёт соус когда угодно и где угодно..."
1401-47 = ""
1401-49 = "..."
1401-50 = "Слушай, Утаха. Мы постоянно заказываем пиццу. Почему бы не переделать бутылку острого соуса так, чтобы её можно было носить с собой?"
1401-51 = "Носимая бутылка соуса? Как?"
1401-52 = "Например... можно установить дозаторы острого соуса прямо на наше личное оружие. Тогда соус всегда будет под рукой!"
1401-54 = "Ты предлагаешь рискнуть выстрелить острым соусом вместо пули просто ради пиццы?"
1401-55 = "Это самая нелепая и бесполезная идея, которую я когда-либо слышала."
1401-56 = "..."
1401-57 = "..."
1401-58 = "За работу."
1401-59 = "(кивает)"
1401-61 = "Я знала, что идея хорошая!"
1401-62 = "Начнём с обратной разработки бутылки острого соуса!"
1401-64 = "Так Инженерный отдел и пришёл к абсурдному решению создать оружие с дозатором острого соуса..."
