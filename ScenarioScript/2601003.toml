[translation]
2601003-1 = "Как создавать воспоминания"
2601003-3 = "Во время прогулки я встретил Мию, которая чем-то занималась на пляже."
2601003-4 = ""
2601003-6 = ""
2601003-7 = ""
2601003-8 = ""
2601003-9 = "[ns1] «Привет, Мию.»\n[ns2] «Чем занимаешься в такой хороший день?»"
2601003-12 = ""
2601003-13 = "А-А... С-Сенсей...? Почему вы...?"
2601003-14 = "О, вы увидели меня издалека... и захотели поздороваться?"
2601003-15 = "Я просто, эм, занимаюсь своим обычным... делом..."
2601003-16 = "...Собираю камешки."
2601003-17 = "[s] «Нашла что-нибудь интересное?»"
2601003-18 = "Н-Ничего особенно интересного, просто... камни на пляже отличаются от тех, что встречаются в горах..."
2601003-19 = "Выветривание, текстура, особенности... У них почти есть собственный характер..."
2601003-20 = "Я подумала, раз уж мы здесь, можно собрать несколько красивых пляжных камешков..."
2601003-21 = "Так что я ничего такого не делаю... Надеюсь, вы не переживали..."
2601003-22 = "В-Вы хотите поискать камешки... вместе со мной...?"
2601003-23 = "Я ведь не ищу ничего особенного... или ценного... Так что не понимаю, зачем вам..."
2601003-24 = "[s3] «Как минимум, так я смогу лучше тебя узнать.»\n[s4] «Посмотрим, смогу ли я найти твой любимый камешек!»"
2601003-27 = "А-А, не думаю, что это что-то вроде соревнования..."
2601003-28 = "Но... если вы правда хотите составить мне компанию, тогда..."
2601003-29 = "Спасибо..."
2601003-31 = "Мы с Мию начали отбирать разные камешки."
2601003-32 = "Думая о Мию, я искал камешки без заметного блеска, но с маленькими очаровательными особенностями..."
2601003-33 = ""
2601003-34 = "Мы уже довольно долго ищем. Хм..."
2601003-35 = "Сенсей, вы нашли что-нибудь хорошее...?"
2601003-36 = "[s] Передать камешки."
2601003-37 = "О, а. Спасибо..."
2601003-38 = ""
2601003-40 = ""
2601003-41 = "...!"
2601003-42 = "Сенсей! Как вы...! Они идеальные!"
2601003-43 = "Да, именно такие я...! Я как раз искала такие камешки! Нужный размер, нужная форма...!"
2601003-44 = "О, о, и посмотрите на этот...! Потрясающий..."
2601003-45 = "Н-Нет, вот этот... О, и этот тоже... Все!"
2601003-46 = "..."
2601003-47 = "Сенсей..."
2601003-48 = "В прошлой жизни... вы были... оценщиком камней...?"
2601003-49 = "[s5] «Похоже, я хорошо выбрал.»\n[s6] «Рад, что они тебе нравятся, Мию.»"
2601003-52 = "Да... Они все мне так нравятся... Я даже не знаю, какие оставить..."
2601003-53 = "Вот этот... Океанские волны обточили его и сделали идеально круглым маленьким камешком..."
2601003-54 = "А у этого необычный красный оттенок, почти как краска, но при этом он идеально сливается с окружением..."
2601003-55 = "О, а посмотрите на этот камешек! Очевидно, это редкий минерал, но выглядит так знакомо, будто вы видели его недавно в парке..."
2601003-56 = "[s] «Ты, эм, действительно всё продумала.»"
2601003-57 = "Хм... Какие камешки выбрать..."
2601003-58 = "М-Можете выбрать за меня, Сенсей?"
2601003-59 = ""
2601003-62 = "[ns7] «Положись на меня!»\n[ns8] Изо всех сил уставиться на камни."
2601003-65 = ""
2601003-66 = "Я присел рядом с Мию и внимательно изучил собранные на земле камешки."
2601003-67 = ""
2601003-69 = ""
2601003-70 = ""
2601003-71 = ""
2601003-73 = "...В итоге мы решили собрать их все и добавить в её коллекцию."
