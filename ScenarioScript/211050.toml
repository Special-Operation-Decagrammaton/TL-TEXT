[translation]
211050-1 = "Episode 5;Make Gehenna Great Again...?"
211050-5 = "[ns] \"Haa, haa... Mayumi, you're fast...\""
211050-6 = "Oh, they've already started. Students are gathering, too."
211050-9 = "――But, what do you think of Gehenna right now?"
211050-10 = "It's pure chaos!"
211050-11 = "Everyone's just doing whatever they want, completely unorganized!!"
211050-16 = "Isn't that more fun, though?"
211050-17 = "Why is that a bad thing?"
211050-18 = "Because we're going to make Gehenna great again!"
211050-19 = "Do we really need to?"
211050-20 = "Was it ever actually great?"
211050-21 = "Of course! It was!"
211050-22 = "Don't overthink the word \"great.\""
211050-23 = "I'm not talking about studying difficult history or boring lectures on morality."
211050-24 = "Great means――being strong!!"
211050-29 = "Aren't we already strong enough?"
211050-30 = "We're one of the three major academies in Kivotos."
211050-31 = "Are you satisfied with just being one of the big three, lumped in with the others?#nGehenna used to be the strongest in all of Kivotos!"
211050-32 = "I'd never really thought about it like that..."
211050-33 = "Why do you think Gehenna got weak?"
211050-34 = "It's because we aren't united as one!"
211050-35 = "……Just imagine it."
211050-36 = "Imagine us united, becoming the strongest in Kivotos!"
211050-37 = "More budget, more ammo! We wouldn't have to worry about any other academy!"
211050-38 = "Overwhelming power that doesn't require us to walk on eggshells for anyone!#n\"Becoming great\" means seizing that with our own hands!"
211050-42 = "Doesn't it feel like we don't really care about that stuff anyway?"
211050-43 = "You're being a bit dramatic, aren't you?"
211050-47 = "So, how are you going to make it great?"
211050-48 = "Yeah, exactly. Just saying it won't change anything."
211050-49 = "That is..."
211050-54 = "Shouko!!"
211050-55 = "[s] \"No plan!\""
211050-60 = "Chairwoman Mayumi isn't good with the details. It's a matter of putting the right person in the right place."
211050-61 = "I'm Shouko Igarashi, secretary of the Gehenna Restoration Committee.#nI'll take it from here."
211050-62 = "Oh...?"
211050-63 = "Even \"greatness\" starts with a single step. Let's start with something simple."
211050-64 = "Let's use what's happening in Gehenna as an example."
211050-68 = "Someone fired a rocket launcher and broke the basketball hoop.#nThe Gehenna Academy Boundary Philosophy Club's ammo depot exploded, and the club building was completely destroyed.#nBoth of these happened today."
211050-69 = "Ah, that. I laughed so hard."
211050-70 = "Normally, what happens in those situations?"
211050-71 = "Uh... the Prefect Team shows up, right?"
211050-72 = "We get locked in the reflection room..."
211050-73 = "Points get deducted, we have to write apology letters..."
211050-74 = "Ugh... I don't even want to think about it..."
211050-75 = "Exactly. The Prefect Team is an organization that punishes rule-breakers."
211050-76 = "Public disturbances, riots, gunfire, setting off explosives—they're all targets."
211050-77 = "They're always so stiff-necked about everything."
211050-81 = "Then... what if the Prefect Team stopped interfering?"
211050-82 = "Huh?"
211050-83 = "That's impossible, isn't it?"
211050-84 = "If breaking the rules is the problem, then we should just make those actions \"legal.\""
211050-85 = "Let me give you another example."
211050-86 = "What if we did those things in a \"designated area for going wild\"?"
211050-87 = "What do you mean?"
211050-88 = "What if there was a place you could go whenever you wanted to test out ammo or throw a grenade?"
211050-89 = "And in that place, you wouldn't have to worry about the Prefect Team's eyes."
211050-90 = "Oh?"
211050-91 = "That doesn't sound too bad..."
211050-92 = "But isn't it better to just do that stuff whenever you feel like it?"
211050-93 = "Yeah, going out of our way to go somewhere is a bit..."
211050-94 = "That's the core of it. A little bit of effort to avoid much bigger trouble."
211050-95 = "Do you want to spend all day sitting in the Prefect Team's dungeon?"
211050-96 = "I definitely don't want that..."
211050-101 = "That's our Shouko! You're really good at this kind of thing."
211050-105 = "I've got it!"
211050-106 = "What is it?"
211050-107 = "If they use the facility, we give them points based on how often and how long they stay! What do you think?"
211050-108 = "Points...?"
211050-109 = "You know how you collect points at cafeterias and shops? Just like that!"
211050-110 = "The more you use it, the more you save up, and you can trade them for all sorts of things or get special perks!"
211050-111 = "……Can we actually manage that?"
211050-112 = "……."
211050-113 = "Shouko!!"
211050-114 = "[s] \"No plan!\""
211050-115 = "If we link points to each student, we'll need their personal information...#nIn other words, it's a convenient way to collect data..."
211050-116 = "It also strengthens our control over them."
211050-120 = "What are you going to use personal information for?"
211050-121 = "……The system itself isn't bad. It's worth considering."
211050-122 = "I go to shops just to get points too! It'll definitely work!"
211050-123 = "Well, if we're going to do it, why not? It's not like we're losing anything."
211050-124 = "Since we're at it, let's partner with shops in the district so they can actually use the points."
211050-125 = "You can even do that!?"
211050-126 = "Have you forgotten who is here with us?"
211050-127 = "Oh, right! We have Sensei!"
211050-128 = "[s] \"Wait, me?\""
211050-129 = "You'll help us, won't you?"
211050-130 = "There are students here who need Sensei's help.#nDo you intend to just look the other way?"
211050-131 = "It's fine, it's fine! I don't really get it, but... maybe you could lend us your name?"
211050-132 = "Like being a guarantor or putting up collateral!"
211050-136 = "Don't worry. I'll do my best, on my honor."
211050-137 = "――That's what Sensei thought."
211050-138 = "[s1] \"I don't remember putting my honor on the line!\"\n[s2] \"But, let's try doing it together.\""
211050-141 = "You're so reliable~"
211050-146 = "Sensei from Schale is helping too?"
211050-147 = "Then that means we can trust it, right?"
211050-148 = "Hmm, so in other words...?"
211050-149 = "We can go wild, the Prefect Team won't come, and we get points?"
211050-150 = "Exactly! Reduce the risk, increase the return!!"
211050-151 = "Sounds interesting. #nCan we use it starting now?"
211050-152 = "Of course! Anyone interested, follow me!"
211050-156 = "This is the best! I'm getting so hyped!"
211050-160 = "Well, might as well go and see!"
211050-168 = "The reaction is better than I thought!"
211050-169 = "Sensei, would you like to come along? I'd like to show you the site."
211050-170 = "[s] \"I was curious about it too.\""
211050-171 = "Then, this way..."
211050-177 = "Huh, it's actually better than I thought?"
211050-178 = "There are targets and buildings! This is worth aiming at."
211050-179 = "Hey, hey, can I shoot? Can I shoot now?"
211050-180 = "Before that, could you show me your student ID?"
211050-181 = "Why...?"
211050-182 = "Wait, do we even have those?#nDo you have yours?"
211050-183 = "Uh, I don't know. Is it bad if I don't?"
211050-184 = "……."
211050-185 = "It's within expectations... In that case, please write your grade and name here."
211050-186 = "Okay!"
211050-192 = "What are you going to use that for?"
211050-193 = "For point management. We haven't decided how to build it yet, though."
211050-194 = "Besides, if we digitize the data, it'll be easier to manage which students used the facility and when."
211050-195 = "When the organization grows in the future, we can use it as an asset."
211050-196 = "True! I hadn't thought that far ahead at all..."
211050-197 = "You're really sharp~"
211050-198 = "[s] \"Shouko is so smart.\""
211050-199 = "I am carrying the future of Gehenna on my shoulders, after all."
211050-200 = "Alright, I wrote it! Is that it?"
211050-201 = "Can't wait~!"
211050-205 = "Both of you are third-years, and your names are... yes, no problems here."
211050-217 = "Ahaha! It's been so long since I've shot this much!"
211050-218 = "Right! Let's try throwing grenades too! First one to blow up that drum can wins!"
211050-224 = "Everyone's so happy!"
211050-225 = "It was worth all the effort. I bet this will really resonate with a lot of students."
211050-226 = "Shoot, break, destroy.#nIt's a stress-relief method that releases suppressed instincts."
211050-227 = "We just need to correctly grasp supply and demand."
211050-228 = "[s] \"Everything feels great, but...\""
211050-232 = "[ns] \"You did get permission for this, right?\""
211050-234 = "Nope?"
211050-235 = "[s] \"You didn't!?\""
211050-236 = "I thought it would be easier to just make it a fait accompli."
211050-237 = "[s3] \"I do that a lot too, but...!\"\n[s4] \"But for something like this, you should really follow the proper procedures...\""
211050-240 = "That's why we need Sensei!"
211050-241 = "We already started, but it's a bit awkward to go ask for permission now."
211050-242 = "But it would be bad if they just thought we were a bunch of troublemakers gathering to cause chaos, right?#nIt would be pointless if they shut us down..."
211050-243 = "So, if we make it an official activity, there's no problem!"
211050-244 = "So, um..."
211050-245 = "Sensei, please come with us...!"
211050-246 = "[s] \"Sure.\""
211050-247 = "……You always answer immediately, but won't you be in trouble later?"
211050-248 = "[s] \"Yeah, I'm sweating bullets back here.\""
211050-249 = "Haha! And yet you still answer immediately."
211050-253 = "Is it because it's a teacher's duty to help students?"
211050-254 = "……."
211050-255 = "Hmm, I see why everyone relies on you."
211050-256 = "Let's do our best with the negotiations!"
211050-257 = "I'm counting on the plans you're making, Shouko-chan."
211050-258 = "Leave the fine details to me."
211050-259 = "Even if we fail, it's only Sensei's honor that gets hurt."
211050-260 = "[s] \"I wonder what my honor even is at this point...\""
211050-264 = "Come on, hurry, hurry! Let's go!"
211050-266 = "Next Episode;Negotiation"