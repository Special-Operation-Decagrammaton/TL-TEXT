#[!][Data: "20/09"]
[translation]
211050-1 = "Episódio 05;Gehenna Grande de Novo......?"
211050-4 = ""
211050-5 = "[ns] \"Arf, arf... Mayumi, você corre rápido pra caramba...\""
211050-6 = "Olha lá, ela já começou o comício. E já tem uma galera aglomerando."
211050-9 = "――Mas me digam: o que virou a Gehenna de hoje em dia?!"
211050-10 = "Uma pura baderna caótica!"
211050-11 = "Todo mundo desunido e cada um fazendo o que dá na telha!!"
211050-12 = ""
211050-14 = ""
211050-15 = ""
211050-16 = "Mas não é bem mais divertido assim?"
211050-17 = "Qual é o problema nisso?"
211050-18 = "O problema é que precisamos tornar Gehenna grande de novo!"
211050-19 = "E precisa ser grande?"
211050-20 = "Gehenna já foi grande algum dia por acaso?"
211050-21 = "É ÓBVIO QUE JÁ FOI!"
211050-22 = "Não fiquem encarando a palavra 'grandeza' como um bicho de sete cabeças!"
211050-23 = "Eu não tô falando de decoreba chata de aula de história nem de liçãozinha de moral barata!"
211050-24 = "Grandeza significa――SER FORTE!!"
211050-25 = ""
211050-27 = ""
211050-28 = ""
211050-29 = "Mas a gente já não é forte o bastante?"
211050-30 = "Somos uma das Três Grandes Academias de Kivotos, afinal."
211050-31 = "Três Grandes coisa nenhuma! Vocês tão satisfeitas em ficar empatadas com as outras?!#nAntigamente, Gehenna era A MAIS PODEROSA de Kivotos inteira!"
211050-32 = "Nunca tinha parado pra pensar por esse lado, mas..."
211050-33 = "Por que vocês acham que Gehenna perdeu a imponência?"
211050-34 = "Porque nós não conseguimos marchar unidas num único propósito!"
211050-35 = "......Agora imaginem só."
211050-36 = "Visualizem todas nós marchando juntas como a maior potência indiscutível de Kivotos!"
211050-37 = "Um orçamento gigantesco, montanhas de munição! Sem precisar pisar em ovos pra falar com nenhuma outra escola!"
211050-38 = "Um poder avassalador que não precisa abaixar a cabeça pra ninguém!#n'Tornar-se grande' significa conquistar tudo isso com as nossas próprias mãos!"
211050-39 = ""
211050-42 = "Mas ninguém liga pras outras escolas agora de qualquer jeito..."
211050-43 = "Meio exagerado o discurso, né?"
211050-44 = ""
211050-46 = ""
211050-47 = "E como você pretende tornar Gehenna grande?"
211050-48 = "Pois é. Falar até papagaio fala, como é que vai ser na prática?"
211050-49 = "Isso aí é..."
211050-50 = ""
211050-52 = ""
211050-53 = ""
211050-54 = "SHOKO!!"
211050-55 = "[s] \"Zero planejamento!\""
211050-56 = ""
211050-58 = ""
211050-59 = ""
211050-60 = "A Presidente Mayumi é inábil com pragmatismos operacionais. Cada peça no seu devido tabuleiro."
211050-61 = "Sou [ruby=Igarashi]Shoko Igarashi[/ruby], secretária do Comitê de Restauração de Gehenna.#nConduzirei as explicações técnicas a partir de agora."
211050-62 = "Opa...?"
211050-63 = "A grandeza se edifica degrau por degrau. Comecemos, portanto, pelo tangível."
211050-64 = "Citemos ocorrências fáticas do nosso cotidiano discente."
211050-65 = ""
211050-67 = ""
211050-68 = "Alguém disparou um lança-foguetes e demoliu a tabela da quadra de basquete.#nO depósito do Clube de Filosofia das Fronteiras explodiu, desintegrando o anexo inteiro.#nAmbos os incidentes ocorreram apenas hoje."
211050-69 = "Ah, foi daora aquilo! Eu rachei o bico vendo os escombros."
211050-70 = "Sob circunstâncias normais, qual é o desfecho mandatório de tais atos?"
211050-71 = "Bem... o Comitê de Disciplina baixa lá armada até os dentes, né?"
211050-72 = "A gente vai direto pro quartinho da solitária..."
211050-73 = "Perda de pontos, redação de reflexão de dez páginas..."
211050-74 = "Ugh... só de lembrar já me dá calafrio..."
211050-75 = "Exato. O Comitê de Disciplina é uma corporação desenhada estritamente para punir infratoras."
211050-76 = "Tumultos em praça pública, motins armados, tiroteios, detonações não autorizadas――tudo recai sob a jurisdição repressiva delas."
211050-77 = "Aquelas minas são cabeça-dura demais, não dão uma folga."
211050-78 = ""
211050-80 = ""
211050-81 = "Nesse caso... e se o Comitê de Disciplina não pudesse encostar um único dedo em vocês?"
211050-82 = "Quê?"
211050-83 = "Isso aí é viagem, impossível."
211050-84 = "Se o impasse repousa na violação das normas, a solução lógica reside em tornar tal conduta 'legal'."
211050-85 = "Permitam-me propor uma analogia prática."
211050-86 = "E se essas estripulias ocorressem em uma 'Zona de Baderna Regulamentada'?"
211050-87 = "Como assim, na prática?"
211050-88 = "E se houvesse um perímetro designado para onde recorrer quando sentissem vontade incontrolável de testar artilharia ou arremessar granadas?"
211050-89 = "E onde, adicionalmente, não fosse necessário temer a fiscalização do Comitê de Disciplina?"
211050-90 = "Opa?!"
211050-91 = "Não parece uma má ideia..."
211050-92 = "Mas a graça da bagunça é fazer na hora que dá na telha."
211050-93 = "Exato. Ter que se deslocar até lá quebra o clima."
211050-94 = "Aí repousa a chave mestra: tolerar um inconveniente ínfimo para extirpar uma dor de cabeça catastrófica."
211050-95 = "Vocês preferem passar o dia inteiro confinadas nas masmorras subterrâneas do Comitê de Disciplina?"
211050-96 = "Deus me livre, aquilo lá é o inferno..."
211050-97 = ""
211050-99 = ""
211050-100 = ""
211050-101 = "Mandou muito, Shoko! Você manja demais dessas articulações."
211050-102 = ""
211050-104 = ""
211050-105 = "TIVE UM ESTALO GENIAL!"
211050-106 = "O que foi?"
211050-107 = "A gente cria um sistema de pontuação por uso da área! Quantidade de visitas e tempo acumulado viram pontos! O que acham?!"
211050-108 = "Pontos...?"
211050-109 = "Que nem cartão-fidelidade de lanchonete e conveniência! A mesma coisa!"
211050-110 = "Quanto mais você usa e explode coisas, mais pontos ganha, podendo trocar por recompensas e regalias exclusivas!"
211050-111 = "......Mas vem cá, a gente dá conta de gerenciar essa logística toda?"
211050-112 = "......"
211050-113 = "SHOKO!!"
211050-114 = "[s] \"Zero planejamento de novo!\""
211050-115 = "Atrelar pontuações cadastrais a cada aluna demanda a coleta de dados pessoais...#nEm suma: uma via conveniente para mapear o corpo discente com consentimento..."
211050-116 = "O viés disciplinar e regulatório ganha musculatura substancial."
211050-117 = ""
211050-119 = ""
211050-120 = "Pra que diabos você quer coletar dados das garotas?"
211050-121 = "......A premissa não é desprovida de mérito. Merece deferência e consideração."
211050-122 = "Eu mesma vivo indo em lojinha só pra juntar selinho! Vai dar super certo, confia!"
211050-123 = "Bom, por mim tudo bem. Ninguém vai sair perdendo nada mesmo."
211050-124 = "Sendo assim, convém firmarmos convênios comerciais com os estabelecimentos do distrito para resgate dos pontos."
211050-125 = "Dá pra ir tão longe assim?!"
211050-126 = "Porventura olvidaram-se da ilustre autoridade presente ao nosso flanco?"
211050-127 = "É mesmo! Temos o Sensei aqui com a gente!"
211050-128 = "[s] \"Hein? Eu?!\""
211050-129 = "O senhor aquiesceu em nos prestar assistência, não foi?"
211050-130 = "Há alunas em busca do seu caloroso amparo institucional logo diante dos seus olhos.#nPretende simplesmente fechar os olhos e nos desamparar?"
211050-131 = "Relaxa, Sensei, vai ser molezinha! Não manjo muito, mas... tipo emprestar o seu nome pro contrato?"
211050-132 = "Virar nosso fiador oficial ou entrar com garantias fiduciárias!"
211050-133 = ""
211050-135 = ""
211050-136 = "'Não temam. Empenho a minha própria honra para consagrar este intento.'"
211050-137 = "――Foi o que o Sensei ponderou intimamente."
211050-138 = "[s1] \"Não lembro de ter empenhado honra nenhuma!\"\n[s2] \"Mas... vamos encarar isso juntos, vai.\""
211050-141 = "Sabia que dava pra contar com você!"
211050-142 = ""
211050-144 = ""
211050-145 = ""
211050-146 = "O Sensei da Schale tá envolvido no projeto?"
211050-147 = "Se ele tá junto, então dá pra botar fé."
211050-148 = "Hum, deixa ver se entendi..."
211050-149 = "A gente toca o terror o quanto quiser, o Comitê de Disciplina não enche o saco e ainda ganha pontos por isso?"
211050-150 = "Exatamente isso! Risco zero e retorno máximo!!"
211050-151 = "Parece bem interessante.#nEssa área já tá liberada pra usar agora?"
211050-152 = "Com certeza! Quem tiver interesse, é só vir atrás de nós!"
211050-153 = ""
211050-155 = ""
211050-156 = "Maneiro demais! A animação foi a mil agora!"
211050-157 = ""
211050-159 = ""
211050-160 = "Bom, não custa nada dar uma conferida!"
211050-161 = ""
211050-163 = ""
211050-165 = ""
211050-166 = ""
211050-167 = ""
211050-168 = "A adesão superou todas as expectativas!"
211050-169 = "Gostaria de nos acompanhar, Sensei? Ficaríamos gratas em exibir as instalações operacionais."
211050-170 = "[s] \"Eu estava mesmo curioso pra ver.\""
211050-171 = "Por aqui, se me permite conduzi-lo..."
211050-176 = ""
211050-177 = "Nossa, até que o lugar é bem estruturado, hein?"
211050-178 = "Tem alvos, prédios abandonados! Dá gosto de atirar!"
211050-179 = "Ei, ei, posso atirar? Já posso descarregar o pente?!"
211050-180 = "Antes do início das operações, poderiam apresentar as carteirinhas estudantis?"
211050-181 = "Pra quê...?"
211050-182 = "Pera, a gente tinha carteirinha?#nVocê tá com a sua aí?"
211050-183 = "Sei lá, acho que perdi. Não pode entrar sem?"
211050-184 = "......"
211050-185 = "Cenário amplamente previsto... Sendo assim, redijam o ano letivo e seus respectivos nomes nesta prancheta."
211050-186 = "Fechado!"
211050-187 = ""
211050-189 = ""
211050-191 = ""
211050-192 = "Pra que você quer saber os nomes delas, afinal?"
211050-193 = "Finalidades de cômputo de pontuação. Embora a infraestrutura ainda careça de desenvolvimento."
211050-194 = "Ademais, ao converter o fluxo em dados, mapearemos com precisão quais alunas usufruíram do perímetro e os horários de maior incidência."
211050-195 = "Quando a nossa instituição expandir no futuro, essa base servirá como precioso capital analítico."
211050-196 = "Caraca, pode crer! Eu jamais pensaria nisso tudo..."
211050-197 = "A garota não dá ponto sem nó mesmo."
211050-198 = "[s] \"Você é muito perspicaz, Shoko.\""
211050-199 = "Carrego o futuro de Gehenna sob os meus ombros, afinal."
211050-200 = "Pronto, tá assinado! Já posso ir pro tiroteio?!"
211050-201 = "Tô empolgada demais!"
211050-202 = ""
211050-204 = ""
211050-205 = "Ambas são do terceiro ano, e os nomes... perfeitamente em ordem."
211050-206 = ""
211050-208 = ""
211050-209 = ""
211050-217 = "Aahaha! Fazia tanto tempo que eu não descarregava tantas balas assim!"
211050-218 = "Né?! Vamos jogar granada também! Quem detonar aquele tambor primeiro ganha a aposta!"
211050-219 = ""
211050-220 = ""
211050-224 = "A galera tá radiante de felicidade!"
211050-225 = "Valeu a pena todo o suor pra aprontar esse lugar. Acertei em cheio no gosto do povo, né?"
211050-226 = "Atirar, estraçalhar, pulverizar.#nConstitui a válvula de escape catártica para liberar os instintos reprimidos do cotidiano."
211050-227 = "Bastava equilibrar a oferta com a pungência da demanda."
211050-228 = "[s] \"Está tudo muito bacana, mas...\""
211050-229 = ""
211050-231 = ""
211050-232 = "[ns] \"Vocês pegaram autorização oficial para isso aqui, né?\""
211050-233 = ""
211050-234 = "Ué, não?"
211050-235 = "[s] \"COMO ASSIM NÃO PEGARAM?!\""
211050-236 = "Julgamos que criar um fato consumado seria consideravelmente menos laborioso."
211050-237 = "[s3] \"Eu também vivo fazendo isso, mas...!\"\n[s4] \"Ainda assim, seguir o trâmite formal seria mais prudente...\""
211050-240 = "É por isso mesmo que precisamos de você, Sensei!"
211050-241 = "Depois que a coisa engrenou, ir lá pedir bênção agora dá uma vergonha danada..."
211050-242 = "Mas se acharem que somos só mais um bando de delinquentes armando motim, azeda o caldo!#nSe embargarem as nossas atividades, morre tudo na praia..."
211050-243 = "Sendo assim, se oficializarmos isso com a sua chancela, tá resolvido!"
211050-244 = "Então, por favor..."
211050-245 = "Sensei, vem com a gente dar essa força...!"
211050-246 = "[s] \"Tudo bem, eu vou.\""
211050-247 = "......Você sempre topa tudo no seco de primeira, não vai se arrepender depois?"
211050-248 = "[s] \"O suor frio já tá escorrendo nas minhas costas, na verdade.\""
211050-249 = "Hahaha! E ainda assim aceita na lata!"
211050-250 = ""
211050-252 = ""
211050-253 = "Porque amparar os alunos é o dever intrínseco de um professor?"
211050-254 = "......"
211050-255 = "Hummm... agora entendo por que tanta gente confia em você de olhos fechados."
211050-256 = "Bora dar o nosso melhor nessa negociação!"
211050-257 = "Tô confiando de olhos fechados na estratégia da Shoko-chan!"
211050-258 = "Concedam-me a primazia dos pormenores táticos."
211050-259 = "Afinal de contas, ainda que o pleito fracasse, a única coisa manchada será a reputação do Sensei."
211050-260 = "[s] \"O que a minha honra virou pra vocês, afinal...?\""
211050-261 = ""
211050-263 = ""
211050-264 = "Bora, bora, agiliza o passo! Let's go!"
211050-266 = "Próximo Episódio;Negociações"
