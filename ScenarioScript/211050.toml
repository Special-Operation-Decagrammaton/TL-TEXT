[translation]
211050-1 = "Эпизод 5;Слава Геенне...?"
211050-4 = ""
211050-5 = "[ns] «*пыхтит* *пыхтит* ...Какая же Маюми быстрая!»"
211050-6 = "Похоже, она уже начала. Надо же, даже небольшая толпа собралась!"
211050-9 = "И вот скажите мне: какой стала Геенна сегодня?"
211050-10 = "Это сплошной хаос!"
211050-11 = "У нас нет ничего, что нас объединяет. Мы просто плывём по течению, топчемся на месте, а сплочённость давно исчезла!"
211050-12 = ""
211050-14 = ""
211050-15 = ""
211050-16 = "Но ведь именно в этом и веселье, разве нет?"
211050-17 = "Зачем нам какой-то «якорь»? Чтобы тянуть нас на дно?"
211050-18 = "Чтобы вернуть Геенне былую славу! Славу великой Геенны!"
211050-19 = "А зачем Геенне вообще нужна эта «слава»?"
211050-20 = "Она хоть когда-нибудь была великой? Ну, если серьёзно?"
211050-21 = "Да! Была!"
211050-22 = "Слушайте, не цепляйтесь вы к слову «величие»."
211050-23 = "Я говорю не о СЛАВЕ из унылых учебников истории или так называемых уроков «этики»!"
211050-24 = "Быть «великим» значит быть сильным!!"
211050-25 = ""
211050-27 = ""
211050-28 = ""
211050-29 = "А разве мы и так недостаточно сильны?"
211050-30 = "Ага. Мы же в тройке сильнейших академий, детка!"
211050-31 = "Когда-то мы были НОМЕРОМ ОДИН во всём Кивотосе! Никто даже рядом с нами не стоял и не мог соперничать!"
211050-32 = "Я-я никогда об этом не задумывалась..."
211050-33 = "Так скажите мне, друзья, товарищи, ПОЧЕМУ наша Геенна ослабла?"
211050-34 = "Потому что мы перестали быть едины! Одним целым! Единая Геенна! Единое знамя! Геенна превыше всего!"
211050-35 = "Вам может КАЗАТЬСЯ, что вы счастливы, носясь туда-сюда и круша здания. Но задумайтесь, чего вы могли бы достичь НА САМОМ ДЕЛЕ."
211050-36 = "Представьте: мы объединимся, возьмёмся за руки и вновь станем сильнейшей силой Кивотоса!"
211050-37 = "Больше бюджета! Больше боеприпасов! И больше НИКАКОГО заискивания перед другими академиями и их драгоценными «чувствами»..."
211050-38 = "ВОТ что такое свобода! Свобода не оглядываться на чужое мнение! Вот истинное величие, и мы можем его достичь!"
211050-39 = ""
211050-42 = "Но мне и так плевать на чужое мнение..."
211050-43 = "Говоришь громко, но не слишком ли ты размахнулась?"
211050-44 = ""
211050-46 = ""
211050-47 = "Ну и каков твой план, умница? Как ты сделаешь Геенну «великой»?"
211050-48 = "Вот именно. Одними призывами толпу не изменишь."
211050-49 = "Это... Эм..."
211050-50 = ""
211050-52 = ""
211050-53 = ""
211050-54 = "Шоуко!!"
211050-55 = "[s] «Она совсем об этом не подумала?!»"
211050-56 = ""
211050-58 = ""
211050-59 = ""
211050-60 = "Как я уже говорила, детали не её сильная сторона. К счастью, у меня с этим всё в порядке."
211050-61 = "Здравствуйте. Я Игараши Шоуко, секретарь Лиги наследия Геенны. Дальше продолжу я."
211050-62 = "О...?"
211050-63 = "Любой великий путь начинается с первого шага. Поэтому начнём с малого."
211050-64 = "Вам нужна конкретика и реалистичные предложения. Давайте поговорим о сегодняшнем дне."
211050-65 = ""
211050-67 = ""
211050-68 = "Сегодня утром из гранатомёта разнесли баскетбольное кольцо. К обеду случайно сработала мина «Клеймор» и вызвала цепную детонацию, угодив в склад боеприпасов Клуба философии. Там до сих пор обсуждают, что всё это значит."
211050-69 = "А, точно! Вот умора была."
211050-70 = "И что же, а точнее КТО, обычно появляется после таких происшествий?"
211050-71 = "Эм... Префектура?"
211050-72 = "А виновника запирают до конца дня, чтобы он «подумал над своим поведением»."
211050-73 = "Потом ещё штрафные баллы, объяснительные..."
211050-74 = "Уф. И то и другое ужасно бесит."
211050-75 = "Именно. Префектура наказывает тех, кто нарушает правила академии."
211050-76 = "Под запретом беспорядки, насилие, стрельба и установка взрывчатки в общественных местах на территории академии."
211050-77 = "Да это же обычные житейские дела! Префектура слишком строгая."
211050-78 = ""
211050-80 = ""
211050-81 = "Но что, если... Префектура больше не сможет мешать столь бурным и естественным проявлениям вашей натуры?"
211050-82 = "Чего? Да не бывает такого."
211050-83 = "Как...?"
211050-84 = "Нужно лишь сделать подобные действия законными."
211050-85 = "К примеру..."
211050-86 = "Что, если выделить особую зону, где можно делать... всё, что захочется?"
211050-87 = "А? Ты это о чём?"
211050-88 = "Представьте место, где можно испытать новые боеприпасы... или швырнуть гранату, когда день не задался."
211050-89 = "Место, где можно делать что угодно и не бояться Префектуры."
211050-90 = "О?"
211050-91 = "Звучит неплохо..."
211050-92 = "Но ведь самое весёлое в стрельбе — её спонтанность!"
211050-93 = "Ага. Как-то это всё ограничивает. С чего мне тащиться в какую-то «разрешённую зону»?"
211050-94 = "Сами подумайте. Неужели небольшое неудобство не стоит того, чтобы избежать куда больших неприятностей?"
211050-95 = "Или вам больше нравится, когда вас уводят и запирают в пустой комнате только потому, что вы не смогли на минутку сдержать свой порыв?"
211050-96 = "Уф... Нет..."
211050-97 = ""
211050-99 = ""
211050-100 = ""
211050-101 = "Фу-фу. Вот так, Шоуко! Она потихоньку склоняет их на нашу сторону..."
211050-102 = ""
211050-104 = ""
211050-105 = "О, придумала!"
211050-106 = "И что же?"
211050-107 = "За посещение нашей зоны будем начислять студентам бонусные баллы! Чем чаще и дольше они здесь бывают, тем больше получают. Круто же, да?"
211050-108 = "«Бонусные баллы»...?"
211050-109 = "Ага! Знаешь, как в кафе и магазинах начисляют баллы за покупки? Вот то же самое! Программа поощрения!"
211050-110 = "Чем чаще студенты приходят, тем больше баллов копят. А потом обменивают их на разные штуки! И привилегии!"
211050-111 = "Эм... Но ведь со всем этим будет УЖАСНО много возни..."
211050-112 = "..."
211050-113 = "Шоуко!!"
211050-114 = "[s] «Опять за своё?!»"
211050-115 = "Хм, бонусная система. «Баллы лояльности»... В этом что-то есть."
211050-116 = "Нам понадобятся анкеты и личные данные для адресного привлечения и контроля..."
211050-117 = ""
211050-119 = ""
211050-120 = "Погоди. Сколько именно «личных данных»?"
211050-121 = "Идея неплохая. Думаю, стоит её рассмотреть."
211050-122 = "Правда?! Я иногда хожу в какие-то места только ради бонусов! Уверена, это сработает!"
211050-123 = "Ну, если вы все за, то и я не против! Звучит безобидно и даже весело!"
211050-124 = "Тогда стоит договориться с местными магазинами. Студенты смогут тратить накопленные баллы у наших партнёров."
211050-125 = "Ого! А мы правда так можем?"
211050-126 = "Вы забыли, кто стоит рядом с нами?"
211050-127 = "А! Точно! Всё решает Сенсей!"
211050-128 = "[s] «Кто? Я?»"
211050-129 = "Вы ведь обещали нам помочь, Сенсей."
211050-130 = "Перед вами три студента, которым ОТЧАЯННО нужна ваша помощь. Вы же нас не бросите?"
211050-131 = "Это совсем небольшая просьба, Сенсей! Я раньше такого не делала. Не могли бы вы нам помочь? Ну, своим именем и всё такое..."
211050-132 = "Вроде как стать поручителем! Просто предоставить небольшой залог!"
211050-133 = ""
211050-135 = ""
211050-136 = "«Не волнуйтесь! Я помогу всем, чем смогу. Честью клянусь!»"
211050-137 = "...Именно это вы хотели сказать, верно, Сенсей?"
211050-138 = "[s1] «Вот ЧЕСТЬЮ я рисковать не собираюсь!»\n[s2] «Но давайте вместе во всём разберёмся»."
211050-141 = "Я знала, что на вас можно положиться, Сенсей."
211050-142 = ""
211050-144 = ""
211050-145 = ""
211050-146 = "Сам Сенсей из Шале с вами?"
211050-147 = "Значит, всё по-настоящему."
211050-148 = "Так, давайте уточним..."
211050-149 = "Если мы будем пользоваться вашей зоной, Префектура нас не тронет, И ещё бонусные баллы начислят?"
211050-150 = "Всё верно! Меньше риска, больше выгоды!"
211050-151 = "А можно уже идти? У меня руки так и чешутся пострелять!"
211050-152 = "Разумеется! Зачем откладывать веселье? За мной!"
211050-153 = ""
211050-155 = ""
211050-156 = "Отпад! Уже не терпится!"
211050-157 = ""
211050-159 = ""
211050-160 = "Подождите меня!"
211050-161 = ""
211050-163 = ""
211050-165 = ""
211050-166 = ""
211050-167 = ""
211050-168 = "Вы только посмотрите! ВОТ это я понимаю, отклик!"
211050-169 = "Присоединяйтесь к нам, Сенсей. Мы давно хотели вам всё показать."
211050-170 = "[s] «Ладно. Мне и самому любопытно»."
211050-171 = "Тогда прошу за мной..."
211050-176 = ""
211050-177 = "Хм! А тут вполне неплохо!"
211050-178 = "Здесь и мишени, И здания! Можно оторваться по полной!"
211050-179 = "Можно я первая? Ну пожалуйста! ПОЖАЛУЙСТА!"
211050-180 = "Сперва покажите, пожалуйста, свои студенческие билеты."
211050-181 = "Студенческие билеты...?"
211050-182 = "А у нас такие есть? Ты свой взяла?"
211050-183 = "Нет. Я даже не знаю, где он валяется. Это обязательно?"
211050-184 = "..."
211050-185 = "Что ж, примерно этого я и ожидала. Тогда напишите здесь свой курс и имя."
211050-186 = "Ха! Уж ЭТО я точно наизусть помню!"
211050-187 = ""
211050-189 = ""
211050-191 = ""
211050-192 = "Шоуко! Зачем нам их имена и курсы?"
211050-193 = "Чтобы вести учёт бонусных баллов. Правда, саму систему нам ещё предстоит наладить..."
211050-194 = "Имея личные данные посетителей, мы сможем лучше управлять потоком. Будем знать, кто из студентов возвращается и в какие часы у нас больше всего народу."
211050-195 = "Поверьте, по мере роста нашей организации эти сведения станут ОЧЕНЬ ценными."
211050-196 = "О! И правда! Как я сама не додумалась?"
211050-197 = "Как всегда, ты всё предусмотрела!"
211050-198 = "[s] «Ты умная, Шоуко»."
211050-199 = "Иначе и быть не может. Ведь на моих плечах лежит будущее Геенны."
211050-200 = "Так! Имя и всё остальное я записала. Теперь можно заходить?"
211050-201 = "Хи-хи, давайте устроим тут грохот!"
211050-202 = ""
211050-204 = ""
211050-205 = "Оба с третьего курса... Прекрасно."
211050-206 = ""
211050-208 = ""
211050-209 = ""
211050-217 = "Ха-ха-ха! Вот это круто! Кажется, теперь я понимаю, что значит «стрелять без остановки»!"
211050-218 = "Точно! А давай покидаем гранаты? Кто первым взорвёт ту бочку, тот и победил!"
211050-219 = ""
211050-220 = ""
211050-224 = "Им нравится!"
211050-225 = "Хорошо, что мы столько сил вложили. Уверена, остальным тоже понравится! Я-ха!"
211050-226 = "Стрельба, взрывы, разрушения... Всё это отлично помогает нашим сокурсникам выпустить пар и снять напряжение."
211050-227 = "Мы создали необходимое место, где они могут дать волю своим подавленным порывам."
211050-228 = "[s] «Это, конечно, хорошо...»"
211050-229 = ""
211050-231 = ""
211050-232 = "[ns] «Но вы вообще получили разрешение?»"
211050-233 = ""
211050-234 = "Эм... Нет?"
211050-235 = "[s] «Не получили?!»"
211050-236 = "Мы решили, что проще сначала всё устроить, а уже потом разбираться с последствиями."
211050-237 = "[s3] «Я бы и сам так поступил...!»\n[s4] «Но разве не лучше было сперва получить разрешение?!»"
211050-240 = "Конечно! Поэтому мы и обратились к вам за помощью, Сенсей!"
211050-241 = "Мы так увлеклись делом, что теперь даже как-то неловко поднимать этот вопрос..."
211050-242 = "Думаю, Сенсей прав. Нужно известить Префектуру и Общество Пандемониума. Иначе нас ведь закроют, верно?"
211050-243 = "Они могут всё не так понять! Надо просто объяснить, что это официальное и... оздоровительное мероприятие!"
211050-244 = "Ну..."
211050-245 = "Пойдёте с нами, Сенсей? Пожалуйста!"
211050-246 = "[s] Согласиться."
211050-247 = "Ни секунды сомнений! Обожаю, как легко вы соглашаетесь на любые затеи, Сенсей!"
211050-248 = "[s] «Вообще-то это весьма серьёзная проблема!»"
211050-249 = "Я-ха! А всё равно согласились сразу же, верно?"
211050-250 = ""
211050-252 = ""
211050-253 = "Потому что ваша «работа — помогать студентам»?"
211050-254 = "..."
211050-255 = "Да-а-а... Теперь понятно, почему все на вас полагаются, Сенсей."
211050-256 = "Что ж, идём убеждать начальство. Рассчитываю на вас, Сенсей."
211050-257 = "Ну, если Шоуко придумала план, значит, всё получится! Я-ха!"
211050-258 = "Подробности оставьте мне."
211050-259 = "Не стоит беспокоиться, коллеги. Даже если нас ждёт провал, пострадает только репутация Сенсея."
211050-260 = "[s] «Интересно, какая у меня вообще репутация...»"
211050-261 = ""
211050-263 = ""
211050-264 = "Так, дружно шагаем! Вперёд!"
211050-266 = "Следующий эпизод;Переговоры"
