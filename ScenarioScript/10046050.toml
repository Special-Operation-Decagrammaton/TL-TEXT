[translation]
10046050-1 = "Эпизод 5;Никогда не лови мгновение"
10046050-3 = ""
10046050-4 = ""
10046050-6 = "...Так что, разумеется, кошки умеют улыбаться. Они просто предпочитают этого не делать."
10046050-7 = ""
10046050-9 = ""
10046050-10 = "Сэя, ты вообще меня слушаешь?"
10046050-11 = "Ух, я не ожидала полноценного чаепития после целой тарелки барбекю."
10046050-12 = "...? Нелепость. Даже если мы пропустим приём пищи, время чая нельзя пропускать никогда и ни за что."
10046050-14 = "Полностью согласна."
10046050-15 = ""
10046050-18 = ""
10046050-19 = "То есть я здесь в меньшинстве?"
10046050-20 = "Чёрный чай помогает, если переела. Выпей ещё чашку."
10046050-21 = "Да. Это поможет пищеварению. Я тебе налью."
10046050-22 = ""
10046050-24 = ""
10046050-25 = ""
10046050-26 = "..."
10046050-27 = "...!"
10046050-28 = ""
10046050-30 = ""
10046050-31 = "Эм, Нагиса? Почему ты так смотришь?"
10046050-32 = ""
10046050-34 = ""
10046050-35 = "Эм... ничего страшного. Я слышала слухи об этом... предпочтении."
10046050-36 = "Разнообразие нужно уважать."
10046050-37 = "Прости, но ты хочешь сказать, что я неправильно налила чай?"
10046050-38 = "Я вовсе не это имела в виду. Прошу прощения, если обидела."
10046050-39 = "Но лично я сначала налила бы молоко, а уже потом чай."
10046050-40 = ""
10046050-43 = ""
10046050-44 = "Ах."
10046050-45 = "...Я удивлена."
10046050-46 = "Не хочу грубить, но я знаю, что ты знаток чая. Поэтому..."
10046050-47 = "ЕСЛИ бы чай был плохого качества, я БЫ налила молоко первым, чтобы приглушить аромат листьев..."
10046050-48 = ""
10046050-50 = ""
10046050-51 = "Но это ремесленный чай, собранный в Чайном саду Шаньхайцзина. Он настолько великолепен, что обычно я вообще не стала бы добавлять молоко...!"
10046050-52 = "Поэтому сначала я покрыла чашку чёрным чаем, чтобы она пропиталась ароматом, а затем аккуратно влила холодное молоко, следя за идеальной температурой и цветом."
10046050-53 = "Разве это не правильный способ, Нагиса?"
10046050-54 = "Что-то не так с моим методом?"
10046050-56 = "Ах."
10046050-57 = "Разумеется, не существует «правильного» или «лучшего» способа наслаждаться чаем. Я бы никогда такого не утверждала."
10046050-58 = "Признаю, если хочется насладиться тонкими нотами и ароматом, лучше сначала наливать чай..."
10046050-59 = "Но разве это не недооценивает роль молока..."
10046050-60 = "...которое играет центральную роль в молочном чае?"
10046050-61 = ""
10046050-63 = ""
10046050-64 = "Когда кремовая текстура холодного молока мягко обволакивает кислотность горячего чёрного чая, происходит химическое изменение."
10046050-65 = "Для меня именно этот перепад температуры и химическая разница делают молочный чай... молочным чаем."
10046050-66 = "То есть ты утверждаешь, что вне зависимости от качества чая молоко обязательно нужно наливать первым?"
10046050-67 = "В конце концов, это молочный чай для послеобеденного чаепития."
10046050-68 = "Выходя за пределы вкуса, это становится обычаем, процедурой... Не будет преувеличением сказать, что чай выходит за рамки простого употребления и переходит в область культуры."
10046050-69 = "Время всё равно идёт, но пить чай лишь потому, что наступил определённый час... это всего лишь пунктуальность."
10046050-70 = ""
10046050-72 = "..."
10046050-73 = "..."
10046050-74 = ""
10046050-76 = ""
10046050-77 = ""
10046050-79 = ""
10046050-80 = "[ns1] «Эм, Мика...»\n[ns2] «Они всегда такие?»"
10046050-83 = "Не смотри на меня... Мне так стыдно."
10046050-84 = "Наги, пожалуйста, не начинай. Сенсей здесь."
10046050-85 = "А, простите. Хасуми обычно тоже более... сдержанная."
10046050-86 = "Интересно, может, всё ощущается иначе, потому что Нагиса такой эксперт по чёрному чаю..."
10046050-87 = ""
10046050-89 = ""
10046050-90 = "...А, фитиль уже зажжён."
10046050-91 = "Вы наткнулись на величайший спор, на тему, которую нельзя упоминать, на табу Тринити..."
10046050-92 = "«Что сначала — молоко или чай...?!»"
10046050-93 = "..."
10046050-94 = "..."
10046050-95 = ""
10046050-97 = ""
10046050-98 = ""
10046050-99 = "Полагаю, мы зашли в тупик."
10046050-100 = "Именно. Нам необходимо второе, экспертное мнение..."
10046050-101 = "Сэя!"
10046050-102 = "Сэя!"
10046050-103 = ""
10046050-106 = ""
10046050-107 = "М-Мика... Помоги..."
10046050-108 = ""
10046050-110 = ""
10046050-111 = "А, прости, Сэя! Я-я ужасно занята подготовкой и всем остальным!"
10046050-112 = ""
10046050-114 = ""
10046050-118 = ""
10046050-119 = "Ну же, Сэя! Уверена, в этом вопросе мы с тобой понимаем друг друга."
10046050-120 = "Хватит философии! Пусть попробует оба варианта!"
10046050-121 = ""
10046050-124 = ""
10046050-125 = "Аах..."
10046050-130 = ""
10046050-131 = "Простите, Сенсей..."
10046050-132 = "Наги в некоторых вопросах бывает немного... традиционалисткой. Даже упёртой."
10046050-133 = "Но неважно! Это удачная случайность. Пока эти двое занимают Наги, мы можем подготовить следующий пункт!"
10046050-134 = "Выложимся на полную, Сенсей!"
10046050-135 = "И Ичика тоже!"
10046050-136 = ""
10046050-139 = ""
10046050-140 = "А-А?! Я?! А, да, госпожа Мика! Я постараюсь!"
10046050-141 = "Ой, не будь такой официальной. Мы всего на год друг от друга отличаемся!"
10046050-142 = "Ох... Эм... Ты ведь меня НЕ БОИШЬСЯ, правда?"
10046050-143 = "Нет-нет! Вовсе нет! Вы замечательная..."
10046050-144 = "[s3] «Всё не так, как ты думаешь, Мика.»\n[s4] «Ичика немного застенчивая.»"
10046050-147 = "О? «Застенчивая»? Это что-то новенькое..."
10046050-148 = "Ладно, вернёмся к расписанию. Что дальше?"
10046050-149 = "Первым, кажется, обслуживание яхты?"
10046050-150 = "А, ты про ту яхту, что стоит на якоре у пляжа?"
10046050-151 = "Я немного импровизирую, но да! Думаю, будет здорово посидеть там и посмотреть на закат."
10046050-152 = "Разумеется, она работала достаточно хорошо, чтобы мы смогли её пришвартовать, но мы давно не выходили на ней в море."
10046050-153 = "То есть она не арендованная?"
10046050-154 = "Ага, это официальная яхта Чаепития. Но это не особо моё или Нагино «увлечение», понимаешь."
10046050-155 = "А у Сэи есть собственная личная яхта, поэтому про эту мы постоянно забываем..."
10046050-157 = "Мы живём в ОЧЕНЬ разных мирах..."
10046050-158 = "Хаха. Пожалуй."
10046050-159 = "Я никогда не считала яхту чем-то особенным. Мы о ней почти НИКОГДА не говорим."
10046050-160 = ""
10046050-162 = ""
10046050-163 = "А! Это должно было быть секретом?"
10046050-164 = "Наги и Сэя постоянно говорят мне, что нужно лучше осознавать наши... привилегии."
10046050-165 = "Хаха... Я ценю все твои старания."
10046050-172 = ""
10046050-173 = "Хорошо. Похоже, всё в порядке."
10046050-174 = "А теперь давайте прогреем двигатель."
10046050-175 = ""
10046050-177 = ""
10046050-181 = ""
10046050-182 = "...А?"
10046050-183 = "П-Почему?! Вчера на проверке всё было нормально! Я сама убедилась!"
10046050-184 = "Хм... Ну, дело не в стартере. И я слышу, что двигатель проходит полный цикл, прежде чем заглохнуть."
10046050-185 = "Может, что-то попало в винт?"
10046050-186 = "Я схожу проверю."
10046050-187 = ""
10046050-189 = ""
10046050-192 = ""
10046050-193 = "А, вот и проблема."
10046050-194 = "А? Я ничего не вижу."
10046050-195 = "Вон там. Вокруг винта намотался какой-то пластик."
10046050-196 = "Значит, его просто нужно снять?"
10046050-197 = "Надеюсь. Но, думаю, понадобится инструмент. Может, здесь найдётся какой-нибудь длинный рыболовный крюк..."
10046050-198 = "А нельзя просто сорвать его?"
10046050-199 = "А? Ну, это может быть чу-у-уточку опасно? Из-за лопастей?"
10046050-200 = "Но... у нас нет времени искать... гарпун или ещё что-нибудь. Может, я просто нырну. Я всё равно уже переодета!"
10046050-201 = "Предоставь это мне! Я отлично плаваю."
10046050-202 = "Да?"
10046050-203 = ""
10046050-205 = ""
10046050-206 = ""
10046050-208 = ""
10046050-211 = ""
10046050-212 = "М-Мика!!"
10046050-214 = "А-а, холодно! Так, где там винт..."
10046050-215 = ""
10046050-219 = "Ты права, Ичика! Это И ПРАВДА пластик! У тебя очень хорошее зрение!"
10046050-220 = "...Эм, а, спасибо. Ты... действительно нечто, Мика."
10046050-221 = "А теперь, может, позволишь мне разобраться с остальным?"
10046050-223 = "А? Всё нормально. Ты ещё сухая. Я уже в воде, так что сама достану!"
10046050-224 = "Но пластик весь в моторном масле..."
10046050-226 = "Сделаю что смогу. Ты и так уже очень помогла!"
10046050-227 = ""
10046050-229 = ""
10046050-230 = "..."
10046050-238 = ""
10046050-239 = ""
10046050-240 = "С яхтой разобрались! Спасибо всем!"
10046050-241 = "Да ладно, ТЫ сделала всю работу."
10046050-242 = "Не-а. Если бы я была одна, я бы никогда не поняла, в чём проблема."
10046050-243 = "Прошу только продолжать в том же духе! День ещё не закончен!"
10046050-244 = "Есть! Положитесь на меня!"
10046050-245 = ""
10046050-247 = ""
10046050-248 = ""
10046050-249 = "..."
10046050-250 = "Какая жалость. У неё был такой милый маникюр, а теперь..."
10046050-252 = "После этого мы продолжили осматривать всё вокруг."
10046050-257 = ""
10046050-258 = "*кашель* *кашель* Ух ты... Здесь так пыльно!"
10046050-259 = "Будет тяжко. Мика, можешь выйти наружу и—"
10046050-260 = "Вместе! Вдвоём мы закончим в два счёта."
10046050-261 = ""
10046050-263 = ""
10046050-265 = "А?! А, конечно! О, Мика! У тебя на голове паутина!"
10046050-266 = "А? А-а-а!"
10046050-267 = ""
10046050-270 = ""
10046050-279 = "Несколько провалов спустя..."
10046050-282 = ""
10046050-283 = ""
10046050-284 = "Все, огромное-преогромное спасибо за такую тяжёлую работу!"
10046050-285 = ""
10046050-287 = ""
10046050-289 = "Ничего себе, мы и правда справились! И даже вовремя!"
10046050-290 = "И похоже, Нагиса так ничего и не заподозрила."
10046050-291 = "Да, и всё благодаря вам двоим! Я буду вечно благодарна!"
10046050-292 = "И, знаете..."
10046050-293 = ""
10046050-295 = ""
10046050-296 = "...Простите."
10046050-297 = ""
10046050-299 = ""
10046050-300 = "Да?"
10046050-301 = "[s5] «Что такое, Мика?»\n[s6] «Тебя что-то беспокоит?»"
10046050-302 = ""
10046050-303 = ""
10046050-305 = ""
10046050-306 = "Ну, ничего такого. Просто я хотела кое-что сказать."
10046050-307 = "Вы все приехали на пляж и, наверное, хотели повеселиться. А вместо этого из-за моего упрямства вам пришлось работать весь день."
10046050-308 = "Мне стыдно, потому что вы обе были мне нужны, хотя до этого я настаивала, что справлюсь со всем сама."
10046050-309 = "Без любой из вас я бы с треском провалилась."
10046050-310 = "Так что спасибо. И, пожалуйста, примите мои извинения."
10046050-311 = "М-Мика! Не кланяйся! А если кто-нибудь увидит?"
10046050-312 = "И вообще-то извиняться должна я... Кажется, я совсем неправильно тебя понимала..."
10046050-313 = "А? В каком смысле?"
10046050-314 = ""
10046050-316 = ""
10046050-317 = "Эм! Ну, а..."
10046050-318 = "Знаете что? Нам нужно проверить виллу!"
10046050-319 = "Но мы же проверяли её утром... Что ты хотела сказать до этого?"
10046050-320 = ""
10046050-323 = ""
10046050-324 = "Ч-Что? Земля трясётся...!"
10046050-325 = ""
10046050-328 = "[ns7] «З-Землетрясение?!»\n[ns8] Закрой их своим телом."
10046050-329 = ""
10046050-330 = ""
10046050-345 = ""
10046050-346 = "Мика! Сенсей! Все целы?"
10046050-347 = ""
10046050-349 = ""
10046050-351 = ""
10046050-352 = "Да, со мной всё хорошо. Сенсей... О, хорошо. Вы целы!"
10046050-353 = "Что это был за грохот? И..."
10046050-354 = "Хм?"
10046050-357 = ""
10046050-358 = "...?"
10046050-359 = "...А."
10046050-361 = "...Что случилось?!"
