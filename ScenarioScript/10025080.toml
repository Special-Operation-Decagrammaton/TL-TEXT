[translation]
10025080-1 = "Эпизод 8;Подозрительная тень"
10025080-2 = "Риф Дьявола, деревня Ятоура"
10025080-3 = ""
10025080-4 = "Хм... Сегодня туман густой."
10025080-5 = "Я хотел здесь потренировать новые навыки рыбалки..."
10025080-6 = "...Но при такой погоде сначала нужно сделать кое-что другое..."
10025080-7 = "Осталось только правильно выстроить кадр... Море, туман — идеальная жуткая превьюшка для моего следующего..."
10025080-8 = ""
10025080-10 = ""
10025080-11 = ""
10025080-12 = ""
10025080-13 = "Хм? Это что?"
10025080-15 = ""
10025080-19 = "Корабль...?"
10025080-21 = ""
10025080-24 = ""
10025080-25 = ""
10025080-26 = "...И последний шаг гарантирует, что данные будут чистыми!"
10025080-27 = "Вот и всё — простой способ отслеживать движение судов и грузовые записи."
10025080-28 = "Ого... Обычно на этот отчёт уходят часы..."
10025080-29 = "Спасибо за помощь! Это сэкономит нам кучу времени на бумажной работе."
10025080-30 = "Проще простого. Обычный рабочий день."
10025080-31 = ""
10025080-33 = ""
10025080-35 = ""
10025080-36 = ""
10025080-37 = "Эта, эм, штука-приложение... Как её там снова запускать? Новомодные технологии..."
10025080-39 = "Позже ещё раз покажу. Это не так сложно!"
10025080-40 = "Не могу поверить, что ты состряпала приложение буквально в мгновение ока... Ты ведь не из Научной школы Миллениума?"
10025080-41 = "А, н-ну... Скажем так, я странствующий разработчик приложений..."
10025080-42 = ""
10025080-44 = ""
10025080-47 = ""
10025080-48 = "Мастер! У нас проблема! Большая проблема!"
10025080-50 = "Кого ты называешь мастером?"
10025080-52 = "И чего орёшь? Кто-то в море упал?"
10025080-53 = "Нет, ничего такого... Я снял кое-что очень странное наверху на Рифе Дьявола!"
10025080-54 = "Ты был на Рифе Дьявола?"
10025080-55 = "Разве я не велел тебе держаться оттуда подальше? Радуйся, что не споткнулся и не сломал проклятую лодыжку. Да ещё в такую погоду..."
10025080-56 = "Но с вершины рифа лучший ракурс на всю деревню. К тому же я хотел попробовать порыбачить во время отлива..."
10025080-57 = "В общем, пожалуйста, посмотрите! Я пытался снять море и увидел что-то... странное..."
10025080-58 = ""
10025080-60 = ""
10025080-61 = ""
10025080-63 = "Что это? Корабль?"
10025080-64 = "Конструкция довольно необычная. Похож на металлический ящик, плавающий по воде."
10025080-65 = "Кто вообще выйдет в море в таком густом тумане? Да ещё так близко к рифу..."
10025080-67 = "Вот это действительно странно. Из-за плохой видимости сегодня ни одно судно из порта не выходило..."
10025080-68 = "Т-Тогда неужели это..."
10025080-69 = ""
10025080-71 = ""
10025080-73 = ""
10025080-74 = ""
10025080-75 = "Это Стигийский корабль."
10025080-76 = "Стигийский корабль?"
10025080-77 = "Да. Говорят, это проклятое судно Глубинных."
10025080-78 = "Я несколько раз видел его вдали, когда рыбачил туманным утром, но... никогда раньше не видел его на фотографии..."
10025080-79 = "По легенде, в полнолуние Глубинные выходят на берег за дарами деревни. Если им угодить, они благословляют нас изобилием..."
10025080-81 = "А если дар особенно понравится... они забирают того, кто его принёс, и превращают в Глубинного..."
10025080-82 = "И-И-и..."
10025080-83 = ""
10025080-85 = ""
10025080-88 = "[ns] «Вы когда-нибудь видели его вблизи?»"
10025080-89 = "А с чего бы мне этого хотеть? Я не спешу, чтобы меня утащили в глубины!"
10025080-90 = "Время от времени слышишь о ком-то, кому взбрело в голову подобраться ближе, но никто из них не вернулся..."
10025080-91 = "Некоторые вещи табуированы не просто так. Нарушишь правила — заплатишь цену."
10025080-92 = "А это море... полно запретов и ужаса..."
10025080-93 = ""
10025080-95 = ""
10025080-97 = ""
10025080-98 = "[ns] «Как думаешь, Мияко?»"
10025080-99 = "Мне кажется..."
10025080-100 = "...этот корабль сделали люди, а не чудовища."
10025080-101 = "Люди? Стигийский корабль?"
10025080-102 = "Я вовсе не хочу проявить неуважение к вашим верованиям..."
10025080-103 = "Но в конструкции слишком много деталей, которые никак не имеют смысла, если судно принадлежит Глубинным."
10025080-104 = "Например, взгляните на это ограждение."
10025080-105 = "Очевидно, перила нужны, чтобы люди не падали в воду. Но зачем они Глубинным, которые живут под водой?"
10025080-106 = "Им разве не было бы удобнее убрать перила, как на местном причале, чтобы проще загружать и разгружать корабль?"
10025080-107 = "И посмотрите на эту конструкцию... Под водой она создавала бы слишком большое сопротивление. Настолько большое, что её, думаю, просто оторвало бы..."
10025080-108 = "Раз она до сих пор цела, вероятнее всего, корабль вообще не проводит время под водой."
10025080-109 = "Значит, это судно не для существ, живущих под водой, а для людей, живущих на суше."
10025080-110 = ""
10025080-112 = ""
10025080-114 = ""
10025080-115 = "..."
10025080-116 = "Хм. Теперь, когда ты сказала, похоже на обычную баржу, которую кто-то разукрасил..."
10025080-117 = ""
10025080-119 = ""
10025080-121 = "Если это мостик, тогда... вот это, получается, кран?"
10025080-122 = "Посмотрите на контейнер. Разве он не от Ред Хук Экспресс?"
10025080-123 = "Он самый... И почему мы всё это время так боялись обычной лодки?"
10025080-125 = ""
10025080-127 = "Потому что были невежественны!"
10025080-128 = "Невежество ослепляет, а когда ты слеп — начинаешь бояться."
10025080-129 = "Мы так испугались, что даже не попытались выяснить правду. Заткнули уши и спрятали головы в песок."
10025080-130 = "Но если кто-то использует наш страх и мешает нам зарабатывать..."
10025080-131 = "Я этого так не оставлю!"
10025080-132 = "Согласна. Это судно никак не может быть легальным."
10025080-133 = ""
10025080-135 = ""
10025080-137 = ""
10025080-138 = "Итак, как нам задержать Стигийский корабль... точнее, неопознанное судно?"
10025080-139 = "Ну..."
10025080-141 = "О, это просто!"
10025080-142 = "Мне всё равно, Стигийский это корабль или неопознанный плавучий объект. Раз он движется по воде, значит, у него есть какой-то винт."
10025080-143 = "Неважно, сделан винт из металла или из щупалец. Правильно установленная бомба мгновенно его остановит."
10025080-144 = "А потом просто залезем на борт и как следует всё обыщем, верно?"
10025080-146 = "Ладно, но даже если у нас есть бомба, как мы доставим её к кораблю?"
10025080-148 = "Об этом не беспокойтесь."
10025080-149 = "У нас есть первоклассная специалистка передовой группы, которая может провести такую подводную операцию хоть во сне."
10025080-150 = "Вот! Я же говорила, что всё это снаряжение пригодится!"
10025080-151 = "Ага. Слава богу, что ты взяла этот безвкусный купальник."
10025080-152 = "Он НЕ безвкусный!"
10025080-153 = "В общем! Взрывчатки на операцию хватит?"
10025080-154 = "У меня около сорока фунтов C4... Как думаете?"
10025080-155 = "Этого хватит, чтобы разнести их к небесам, даже если они боги, духи или кто там ещё."
10025080-156 = "Командир, мне нужно ваше разрешение на операцию."
10025080-158 = "Разрешаю."
10025080-159 = "RABBIT 2 приблизится к судну с помощью подводных движителей и выведет из строя двигательную систему."
10025080-160 = "Все остальные — подходим на надувной лодке IBS и высаживаемся сразу после остановки двигателя!"
10025080-162 = "Поняла!"
10025080-163 = ""
10025080-165 = ""
10025080-167 = ""
10025080-168 = ""
10025080-169 = "Когда вы дрались той ночью, я невольно заметил, что вы, девочки—"
10025080-170 = "Я понимаю, что после всего случившегося мы выглядим подозрительно."
10025080-172 = "Но как бы это ни выглядело... мы просто туристки, случайно оказавшиеся в нужном месте в нужное время."
