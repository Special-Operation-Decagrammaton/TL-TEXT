[translation]
80000092-1 = "Особые исправительные припасы"
80000092-2 = "В День святого Валентина меня вызвали в комнату Мине."
80000092-3 = ""
80000092-6 = "Входите, Сенсей."
80000092-7 = ""
80000092-13 = "Здесь немного тесно, но располагайтесь как дома."
80000092-14 = ""
80000092-17 = "[ns] «Это... шоколад? Ты тоже коллекционируешь шоколад?»"
80000092-18 = "О, это. Да, шоколад."
80000092-19 = "Я начала собирать его недавно. В ходе исследований я поняла, что шоколад можно считать разновидностью медицинского запаса."
80000092-20 = "[s] «Шоколад... это медицинский запас?»"
80000092-21 = "Да. Я выяснила, что во многих ситуациях шоколад может быть идеальным средством."
80000092-22 = "Более того, у него есть ряд свойств, которые делают его отличным для использования в полевых условиях Кивотоса."
80000092-23 = "При гипогликемическом шоке он неплох как источник сахара."
80000092-24 = "Конечно, сок лучше, но его гораздо сложнее носить с собой."
80000092-25 = "Есть даже продукт на основе шоколада с высоким содержанием кофеина для кратковременного повышения бодрости. Внешне он напоминает крем для обуви."
80000092-26 = "Его часто добавляют в овсянку. На вкус результат лишь чуть лучше упомянутого крема для обуви, поэтому добровольно его почти никто не выбирает."
80000092-27 = "Но по восстановлению энергии и калорий ему нет равных."
80000092-28 = "Поэтому я считаю, что шоколад вполне подходит как лечебное средство или медицинский запас."
80000092-29 = "И около недели назад я начала собирать шоколад."
80000092-30 = "[s1] «Шоколад как лекарство... Пожалуй, я понимаю, о чём ты.»\n[s2] «Но тогда почему у тебя так много шоколадок в красивых и милых обёртках?»"
80000092-33 = "?!"
80000092-34 = "У-У меня не было выбора!"
80000092-35 = "Большинство продающегося шоколада упаковано именно так! Поэтому..."
80000092-36 = "[s3] «О, я уже видел эту, в форме яйца.»\n[s4] «Внутри неё милая игрушка, верно?»"
80000092-39 = "...!"
80000092-40 = "Э-Э-Э-Это! Было! Исследование! Всё ради исследования. Эм. Потому что!"
80000092-41 = "Разве ребёнок не может подавиться игрушкой, если попытается проглотить шоколад целиком?"
80000092-42 = ""
80000092-44 = ""
80000092-46 = "[ns5] «О, эта в форме цыплёнка! Это белый шоколад со вкусом лимона?»\n[ns6] «Не знал, что ты такая поклонница милых зверушек!»"
80000092-47 = ""
80000092-48 = ""
80000092-50 = ""
80000092-51 = "..."
80000092-52 = "Да, фанатка! А что, нельзя?"
80000092-53 = "Это правда! Мне нравятся милые и красивые вещи."
80000092-54 = "Мне нельзя хотеть их или собирать? Для такой, как я, это неприемлемо?"
80000092-55 = ""
80000092-57 = ""
80000092-58 = "Даже вы думаете, что мне это не подходит, правда, Сенсей? Что я слишком прямолинейная и раздражающая, чтобы любить милые вещи?"
80000092-59 = "Я знаю. Знаю, что это странно, ясно? Но... Но..."
80000092-60 = "[s7] «Всё хорошо, Минэ. Тебе это определённо подходит.»\n[s8] «Милота — это жизнь!»"
80000092-61 = ""
80000092-62 = ""
80000092-64 = ""
80000092-65 = "...Правда?"
80000092-66 = "[s] «Да, правда.»"
80000092-67 = "..."
80000092-68 = "Я... думаю, должна извиниться. Я показала вам сторону себя, которой не горжусь."
80000092-69 = "Меня нечасто так дразнят... И, возможно, вы задели больное место."
80000092-70 = "Но в качестве извинения...!"
80000092-71 = ""
80000092-82 = "Я даже не заметил, что раскрыл рот от удивления, пока туда что-то не сунули."
80000092-83 = ""
80000092-86 = "Это было сладко и насыщенно, с лёгкой горчинкой."
80000092-88 = "С Днём святого Валентина!"
80000092-89 = ""
80000092-91 = ""
80000092-94 = "С этими словами Мине выбежала из комнаты."
80000092-95 = "Я остался в комнате Мине, наслаждаясь подаренным шоколадом, пока она не вернулась."
