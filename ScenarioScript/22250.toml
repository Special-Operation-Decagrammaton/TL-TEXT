[translation]
22250-178 = "#video;11000"
22250-1 = "Эпизод 25; Научная школа Миллениум"
22250-2 = ""
22250-3 = "Все объединили силы и наконец..."
22250-4 = "Кризис, угрожавший Эриду, Миллениуму и даже всему Кивотосу, подошёл к концу."
22250-6 = "В итоге я взяла на себя ответственность за отключение объектов Эриду."
22250-7 = "[ns] «Работы у тебя немало, Химари.»"
22250-8 = "Ну, угрозу нам как-то удалось остановить, но технически ничего ещё не решено."
22250-9 = "Как президент Отряда Исследования Сверхъестественного, я не могу оставить это без внимания. Иногда я всё же думаю, есть ли смысл во всей этой борьбе."
22250-10 = "Что ж, скажем так: всё к лучшему."
22250-11 = "У хрупкой гениальной хакерши всегда полно дел."
22250-12 = "[s] «Спасибо за твой труд.»"
22250-14 = "Исполнительный офис Семинара"
22250-15 = "Что касается Рио, главной виновницы произошедшего..."
22250-16 = ""
22250-23 = ""
22250-24 = ""
22250-25 = "Президент Рио?! О чём вы говорите? Вы хотите уйти с должности?"
22250-26 = "Президент?! Куда вы пропали?!"
22250-27 = "...Ах."
22250-28 = "Юука, президент оставила сообщение."
22250-29 = "А? Сообщение? Дай посмотреть..."
22250-30 = ""
22250-32 = ""
22250-33 = ""
22250-34 = "«Прости»..."
22250-35 = "..."
22250-36 = "...И-и это всё?!"
22250-38 = "Немного позже..."
22250-39 = "За здоровье президента! Ура!"
22250-40 = "Эм, ура."
22250-41 = "Да! Ура!"
22250-42 = ""
22250-44 = ""
22250-45 = ""
22250-46 = "...Что всё это значит?"
22250-47 = "Хи-хи. Мы же сказали, что отпразднуем, когда тебя благополучно выпишут."
22250-48 = "Поэтому сегодня здесь все из C&C!"
22250-49 = "Ладно, но что здесь делает Сенсей...?"
22250-50 = "[s1] «Меня пригласили, Нэру.»\n[s2] «Мне не следовало приходить?»"
22250-51 = "Я-я не то чтобы против, но..."
22250-52 = "Угх...! Я хочу сказать..."
22250-53 = "Почему бы вам не выпить, Мастер? Выпейте!"
22250-54 = "Мы одолжили у Веритас целую кучу банок Frenzy MAX!"
22250-55 = "[s] «...О, Frenzy MAX.»"
22250-56 = "Асуна, пожалуйста, успокойся. Ты смущаешь Сенсея..."
22250-58 = "Хи-хи. Карин. Иногда можно и пошуметь в такой день..."
22250-59 = "Верно, Сенсей?"
22250-60 = "[s] «Наверное...»"
22250-61 = "Хм-м, слишком скучно?"
22250-62 = "О!"
22250-63 = "Может, нам всем стоило надеть костюмы кроликов!"
22250-64 = "Хм? Мастер."
22250-65 = "Костюм кролика... это, пожалуй, чересчур..."
22250-66 = "То есть, это не невозможно... если Сенсей так хочет..."
22250-67 = "[s] «Пожалуйста, не надо. Люди подумают, что я извращенец!»"
22250-68 = "*вздох* ...Для кого вообще эта вечеринка...?"
22250-69 = "И правда... Костюмы кроликов можно оставить для афтепати."
22250-70 = "Вот как работает C&C. Каждый день узнаю что-то новое."
22250-71 = "Прекрасно. Просто прекрасно."
22250-72 = "Ох."
22250-73 = "...!"
22250-74 = "Ха-ха!"
22250-75 = "Простите за опоздание, старшие."
22250-76 = "Привет, Токи!"
22250-77 = "Ч-Что...? Почему она здесь...?!"
22250-78 = "Мне сказали, что здесь будут все члены C&C, поэтому я не хотела пропускать."
22250-79 = "Но ты работаешь на президента!"
22250-80 = "...К сожалению, она исчезла."
22250-81 = "Я не знала, что делать... И тогда подумала о C&C."
22250-82 = "Кто вообще приходит на вечеринку в честь человека, которого сам чуть не убил?!"
22250-83 = "...Хм?"
22250-84 = "Не прикидывайся передо мной невинной!"
22250-85 = "Ой, президент! Не будьте такой злой! Токи специально пришла нас навестить!"
22250-86 = "Мы ещё несколько дней назад сражались друг с другом!"
22250-87 = "[s] «Для детей естественно драться, пока они растут...»"
22250-88 = "Почему ты встаёшь на её сторону?!"
22250-90 = "О, Токи. Хочешь перекусить?"
22250-91 = "Звучит прекрасно. Спасибо."
22250-92 = "А теперь попробуй вот это!"
22250-94 = "...Хм, у Frenzy MAX весьма интересный вкус."
22250-95 = "Уф!"
22250-96 = "..."
22250-97 = "*вздох* ...Да какая разница."
22250-98 = "[s] «Нэру...?»"
22250-99 = "C&C выполнит любой приказ начальства."
22250-100 = "Ты получила поручение от президента и просто выполнила свою работу."
22250-101 = "Ты куда понятливее, чем я ожидала, Нэру."
22250-102 = "А кто, по-твоему, сделал меня такой, а?!"
22250-103 = "Кстати... судя по тому, что я видела, твои боевые навыки весьма впечатляют."
22250-104 = "Да, но если я подготовлюсь, то запросто тебя одолею..."
22250-105 = "Ладно, Токи. На, попробуй Frenzy MAX."
22250-106 = ""
22250-107 = "Так, погоди... Аканэ, ну, эм..."
22250-108 = ""
22250-110 = ""
22250-111 = "...А? Что ты сказала?"
22250-112 = "[s] «...Похоже, здесь и дальше будет весело.»"
22250-113 = ""
22250-115 = ""
22250-116 = ""
22250-118 = "После большого происшествия всё довольно быстро вернулось в норму."
22250-119 = ""
22250-120 = ""
22250-121 = ""
22250-122 = ""
22250-123 = ""
22250-124 = ""
22250-125 = ""
22250-127 = ""
22250-128 = ""
22250-135 = ""
22250-136 = ""
22250-142 = "То же самое произошло и с моей повседневной жизнью..."
22250-144 = "[ns] «...Вы звали?»"
22250-145 = "О, Сенсей! Добро пожаловать!"
22250-146 = "Мы как раз собирались вместе позаниматься!"
22250-147 = "[s] «Что вы изучаете?»"
22250-148 = "В смысле? Разве не очевидно!"
22250-149 = "Мы готовимся к следующему проекту: коллекционной RPG с прокачкой, где нужно захватить мир, заводя друзей среди милых монстров."
22250-150 = "[s] «Это же совершенно другой жанр!»"
22250-151 = "Тот проект отменили... потому что пройти дальше было невозможно..."
22250-152 = "А Момои сказала, что вместо него надо попробовать новый жанр..."
22250-153 = "[s] «...Опять?»"
22250-154 = "Ч-Что значит «опять»? Так и работает разработка игр!"
22250-155 = ""
22250-157 = ""
22250-158 = "Ва-а! Я не могу подружиться с этим милым монстром!"
22250-159 = "О, Алиса! Сначала нужно сразиться с ним и снизить его HP!"
22250-160 = "Тогда поймать его будет проще!"
22250-161 = "Но монстр ничего мне не сделал... Разве неправильно нападать на него первой?"
22250-162 = "Ой, если подумать, и правда странно..."
22250-163 = "Угх, но так устроена игровая система..."
22250-164 = "Вот о чём я говорю! Хватит валять дурака, нам надо заняться настоящим анализом!"
22250-166 = "Эм, м-мы можем не спешить..."
22250-167 = "[s] «Ладно, тогда давайте поработаем над этим вместе.»"
22250-168 = "Да! Сенсей, садитесь рядом со мной!"
22250-169 = "Хорошо! Теперь, когда все собрались, начинаем командный бой!"
22250-170 = "Ох, боже."
22250-171 = "Хи-хи..."
22250-173 = "И хотя им предстоит столкнуться с бесчисленными трудностями, которые причинят боль и заставят плакать..."
22250-174 = "Этот герой и члены её отряда продолжат идти вперёд."
22250-175 = "Да, приключение должно продолжаться."