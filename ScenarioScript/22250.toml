[translation]
22250-1 = "Episódio 25;Escola de Ciências Millennium"
22250-3 = "(E assim, unindo as forças de todos, conseguimos lidar com Eridu...)"
22250-4 = "(Conseguimos resolver uma crise que poderia ter ameaçado Millennium —#ne até mesmo toda Kivotos. E todos viveram felizes para sempre.)"
22250-6 = "...Eu mesma assumirei a responsabilidade de fechar as instalações de Eridu."
22250-7 = "[s] \"Bom trabalho. Obrigado, Himari.\""
22250-8 = "...Conseguimos conter aquela ameaça de alguma forma,#nmas nada foi resolvido de fato ainda."
22250-9 = "Como presidente da Força-Tarefa de Fenômenos Paranormais, não posso simplesmente ignorar isso...#nAh... Embora eu fique pensando por culpa de quem tenho que lidar com tudo isso."
22250-10 = "Bom, vamos dizer que estou fazendo isso por essa certa pessoa... pode ser?"
22250-11 = "Uma hacker beldade frágil, pura e supergênio está sempre tão ocupada... Francamente."
22250-12 = "[s] \"Ahaha, conto com você.\""
22250-14 = "Seminar — Escritório"
22250-15 = "(E, quanto à própria responsável por tudo isso, Rio...)"
22250-25 = "Presidente Rio?! O que está dizendo de repente?!#nRenunciar à presidência?!"
22250-26 = "Ei, Presidente?! Onde a senhora foi parar?!"
22250-27 = "...Ah."
22250-28 = "Yuuka-chan, tem uma mensagem da Presidente aqui."
22250-29 = "Hã? Uma mensagem?!#nDeixa eu ver..."
22250-34 = "\"Me desculpem\"...?"
22250-35 = "........."
22250-36 = "...I-Isso não é algo que se resolve só pedindo desculpas!! Presidenteeeee?!?!"
22250-38 = "(Enquanto isso, na C&C...)"
22250-39 = "Para comemorar a alta da presidente! Saúde!"
22250-40 = "Saúde."
22250-41 = "Sim, saúde~"
22250-46 = "...Que barulheira toda é essa, afinal?"
22250-47 = "Hehe.#nComo a presidente recebeu alta sã e salva, decidimos fazer uma festinha para comemorar."
22250-48 = "Por isso hoje a C&C inteira se reuniu aqui!"
22250-49 = "Não, isso eu entendi... mas por que o Sensei tá aqui?"
22250-50 = "[s1] \"Eu fui convidado. Parabéns pela alta, Neru.\"\n[s2] \"Afinal, será que minha presença está atrapalhando?\""
22250-51 = "A-Ah... valeu..."
22250-52 = "Urgh...! N-Não, não é nada disso não..."
22250-53 = "Vamos, vamos, Mestre, beba também! Beba!"
22250-54 = "Tem um montããão de Youkai MAX que a Veritas preparou pra gente!"
22250-55 = "[s] \"...Ah, é. Então isso aqui é Youkai MAX.\""
22250-56 = "Asuna-senpai, se ficar insistindo desse jeito, vai deixar o Sensei sem jeito..."
22250-58 = "Hehe. Karin, só por hoje não tem problema, não é?"
22250-59 = "Não é mesmo, Sensei?"
22250-60 = "[s] \"Por mim tudo bem, mas...\""
22250-61 = "Hmm, será que assim não tá animado o suficiente?"
22250-62 = "Ah!"
22250-63 = "Já sei! Será que seria melhor se todas nós estivéssemos de coelhinha?"
22250-64 = "Hein, Mestre?"
22250-65 = "De coelhinha... aí já é um pouco complicado..."
22250-66 = "Quer dizer... mas se o Sensei disser que quer ver... não é impossível..."
22250-67 = "[s] \"N-Não precisa! Vão acabar olhando torto pra mim!\""
22250-68 = "Ah... Afinal, essa comemoração é pra quem mesmo..."
22250-69 = "Entendo... Até nas comemorações se usa roupa de coelhinha."
22250-70 = "Então esse é o estilo da C&C. Aprendi mais uma coisa hoje."
22250-71 = "...Hã?"
22250-72 = "Ora."
22250-73 = "...!"
22250-74 = "Aha♪"
22250-75 = "Desculpem o atraso, senpais."
22250-76 = "Oiê~ Toki-chan!"
22250-77 = "Q-Quê... Espera... Por que diabos você tá... aqui...?!"
22250-78 = "Ouvi dizer que era uma comemoração com todos os membros da C&C, então decidi comparecer."
22250-79 = "Você não é exclusiva da Presidente?!"
22250-80 = "...Infelizmente, a referida Presidente desapareceu."
22250-81 = "Enquanto ficava parada sem saber o que fazer... me lembrei da C&C."
22250-82 = "E desde quando alguém aparece na festa de alta da pessoa que ela mesma espancou?!"
22250-83 = "...Sim?"
22250-84 = "Qual é! Não faz essa cara como se a errada fosse eu!"
22250-85 = "Ah! Que maldade, presidente! Logo agora que a Toki-chan veio!"
22250-86 = "Não, espera aí... Ela era nossa inimiga até outro dia, pô?!"
22250-87 = "[s] \"Dizem que quem briga demais acaba se dando bem...\""
22250-88 = "Ei! Até você vai defender ela, Sensei?!"
22250-90 = "Ah, Toki-chan. Já que está aqui, aceita uns petiscos?"
22250-91 = "Muito obrigada."
22250-92 = "Aqui! Agora experimenta isso!"
22250-94 = "...Hmm, o sabor do Youkai MAX é bem complexo."
22250-95 = "Hãããã?!?!"
22250-96 = "......"
22250-97 = "Ah... tanto faz."
22250-98 = "[s] \"Neru...?\""
22250-99 = "Bem, no fim das contas, a C&C só cumpre ordens de cima mesmo."
22250-100 = "— E você também só estava cumprindo a missão da Presidente, né."
22250-101 = "Neru-senpai é mais razoável do que eu pensava."
22250-102 = "E por culpa de quem você acha que foi?!"
22250-103 = "Mesmo assim... você manda bem pra caramba.#nNão tem nenhum movimento desperdiçado no seu jeito de lutar."
22250-104 = "Sim, em plenas condições, contra alguém do nível da Neru-senpai eu..."
22250-105 = "Vamos, Toki-chan. Experimente este Youkai MAX também, por favor."
22250-107 = "Sim, esp... Akane-senpai, isso, urgh..."
22250-111 = "...Hã? Que que cê disse?"
22250-112 = "[s] \"...Parece que as coisas vão ficar bem animadas daqui pra frente.\""
22250-118 = "(Mesmo depois de um incidente tão grande, o tempo continua passando como sempre...)"
22250-142 = "(E aqui não é diferente...)"
22250-144 = "[ns] \"...E foi por isso que me chamaram aqui.\""
22250-145 = "Ah! Sensei! Bem-vindo!"
22250-146 = "A gente tava bem no meio de uma sessão de estudos!"
22250-147 = "[s] \"...Estudando o quê?\""
22250-148 = "Ora, é claro!"
22250-149 = "Para criar o nosso próximo jogo,#n\"RPG de estratégia, coleta e criação onde você conquista o mundo recrutando monstrinhos fofos da estrada\",#né claro!"
22250-150 = "[s] \"Esse gênero não mudou em relação ao que vocês disseram outro dia?!\""
22250-151 = "Ah, sobre isso, a gente meio que travou nas ideias...#nAí viramos a mesa e recomeçamos do zero..."
22250-152 = "A mana disse que queria tentar um gênero novo..."
22250-153 = "[s] \"...De novo?\""
22250-154 = "D-De novo?! Que crueldade...!#nDesenvolvimento de jogos é assim mesmo, sabia?!"
22250-158 = "Buááá! Aris não consegue fazer amizade com esse monstrinho fofo!"
22250-159 = "Ah! Aris! Primeiro você tem que diminuir o HP dele em batalha!"
22250-160 = "Assim fica mais fácil de capturar!"
22250-161 = "Mas o senhor monstro não fez nada...#nA Aris tem que bater nele primeiro?"
22250-162 = "Hmm, pensando bem... talvez seja mesmo um pouco estranho...?"
22250-163 = "Uuu, mas nos jogos o sistema sempre foi meio assim..."
22250-164 = "Ei, vocês aí! Parem de falar besteira e vamos analisar direito!"
22250-166 = "É-É que... p-pode ir com calma..."
22250-167 = "[s] \"Certo. Então, vamos jogar juntos?\""
22250-168 = "Sim! Sensei, sente aqui! Do ladinho da Aris!"
22250-169 = "Beleza! Agora que tá todo mundo aqui, vamos começar uma batalha em equipe!"
22250-170 = "Ah... francamente."
22250-171 = "Hehe, sim..."
22250-173 = "(Mesmo esbarrando em inúmeras barreiras,#nàs vezes brigando, se machucando ou enfrentando frustrações—)"
22250-174 = "(Ainda assim, a aventura da heroína e seus companheiros continuará daqui em diante—)"
22250-175 = "(Sim, para todo o sempre...)"
