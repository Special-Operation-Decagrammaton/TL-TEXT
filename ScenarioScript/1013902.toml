[translation]
1013902-1 = "Омакасэ от Нико"
1013902-2 = "Через несколько минут после странного сообщения от Нико в MomoTalk..."
1013902-3 = ""
1013902-6 = "...в офисе зазвенел звонок. Посетителей я не ждал."
1013902-8 = "«Здравствуйте, это FOX EATS!»"
1013902-9 = "«Доставка еды прибыла!»"
1013902-10 = "[s1] Открыть дверь.\n[s2] Не открывать дверь."
1013902-11 = ""
1013902-14 = "«О боже. Похоже, дверь и в этот раз заперта...»"
1013902-15 = "«Ничего не поделаешь. Придётся взломать дверь...»"
1013902-16 = "[ns] «Уже иду! Уже иду!»"
1013902-19 = ""
1013902-20 = ""
1013902-21 = "Здравствуйте, Сенсей. Это FOX EATS."
1013902-22 = "Вы ведь ещё не ужинали?"
1013902-23 = "Как бы заняты ни были, нельзя пропускать еду. Это вредно для здоровья."
1013902-24 = "[ns] «Нет, ещё не ел.»"
1013902-26 = "[ns3] «Но откуда ты узнала...?»\n[ns4] «Ты за мной ШПИОНИЛА?»"
1013902-29 = "Фуфу, у подразделения специального назначения много способов добыть сведения."
1013902-30 = "Во-первых, ваш холодильник практически пуст."
1013902-31 = "И после обеда в Шале не приходил ни один курьер с едой."
1013902-32 = "И наконец, статус вашего компьютера всю ночь был «в сети», так что я решила, что вы не отходили от стола."
1013902-33 = "[s] «...Мне нечего ответить.»"
1013902-34 = "Вам нужно поесть, но и сидеть так долго на одном месте тоже не стоит."
1013902-35 = "Я всё подготовлю, а вы пока можете немного отдохнуть."
1013902-36 = "[s] «Было бы неплохо ненадолго отойти...»"
1013902-37 = ""
1013902-38 = "[ns] «Так что на ужин?»"
1013902-39 = "Фуфу. Готового блюда нет, но я принесла все необходимые ингредиенты."
1013902-40 = "В конце концов, нет ничего лучше свежеприготовленной еды."
1013902-41 = "Из этих ингредиентов я могу приготовить большинство простых блюд. Есть пожелания?"
1013902-42 = "Если это есть в моём репертуаре — к вашим услугам."
1013902-43 = "[s] «Я буду рад всему, что ты приготовишь...»"
1013902-44 = ""
1013902-47 = "[ns] «Тогда пусть будет фирменное блюдо шефа.»"
1013902-48 = "Хм, «фирменное блюдо шефа»?"
1013902-49 = "Моё лучшее блюдо довольно обычное... но, пожалуй, это инаризуси, которые я всегда готовлю для операций."
1013902-50 = "[s] «Для меня звучит идеально.»"
1013902-51 = "Договорились. Мне только нужно немного потушить жареный тофу."
1013902-54 = ""
1013902-55 = "...Готовить инаризуси перед вами вот так напоминает прошлое."
1013902-56 = "[s] «Когда мы впервые встретились?»"
1013902-57 = "Да. Тогда я тоже готовила вам много инаризуси."
1013902-58 = "Хотя мои намерения в то время были совершенно другими..."
1013902-59 = "Но думаю, мои инаризуси всегда наполнены искренними чувствами."
1013902-60 = "Потому что теперь это любимое постоянное блюдо моих товарищей по отряду."
1013902-61 = "[s] «Почему ты вообще начала готовить инаризуси?»"
1013902-62 = "Хм. Интересно, когда же это было..."
1013902-63 = "Наверное, когда только появился отряд FOX. Я подумала, что неплохо брать с собой аварийный паёк, если операция затянется."
1013902-64 = "Тогда я была совсем новичком в готовке, а инаризуси — одним из немногих блюд, которые умела делать."
1013902-65 = "Да и получалось не очень. Почти все кармашки жареного тофу рвались, потому что я неправильно их набивала."
1013902-66 = "Но товарищи по отряду всё равно говорили, что вкусно. Так приготовление инаризуси постепенно вошло в привычку."
1013902-67 = "Забавно, как всё складывается. Тогда я даже не особо любила жареный тофу."
1013902-68 = "[s] «Кажется, понимаю.»"
1013902-69 = ""
1013902-71 = ""
1013902-72 = "[ns5] «Некоторые блюда становятся вкуснее из-за хороших воспоминаний.»\n[ns6] «Значит, твои инаризуси наполнены дорогими тебе воспоминаниями!»"
1013902-75 = "...Да. Для меня это особенное блюдо."
1013902-76 = "А-а-а инаризуси готовы!"
1013902-77 = "[s7] «Уже?»\n[s8] «Так быстро...»"
1013902-80 = "Это и правда очень простое блюдо. Нужно только наполнить кусочки жареного тофу."
1013902-81 = "Само обжаривание тофу занимает немного времени, но в остальном всё просто."
1013902-82 = "[s] «Спасибо за еду!»"
1013902-83 = "Фуфу. Вы же сказали, что сегодня хотите фирменное блюдо шефа?"
1013902-84 = "Фуфу. Вы же сказали, что сегодня хотите фирменное блюдо шефа?"
1013902-85 = ""
1013902-87 = ""
1013902-88 = ""
1013902-89 = "Я ещё приготовила удон с жареным тофу. Пожалуйста, съешьте сегодня на ужин именно его!"
1013902-90 = "Тёплый бульон отлично насытит вас, ведь сегодня холодно."
1013902-91 = "[s] «Я не против, но что делать с инаризуси?»"
1013902-92 = "Вообще-то инаризуси — одно из тех блюд, которые на следующий день становятся даже вкуснее."
1013902-93 = "...Сенсей. Ваш план на завтрак был разогреть что-нибудь в микроволновке или вообще его пропустить?"
1013902-94 = "[ns] «...Это тоже разведданные обо мне?»"
1013902-95 = "Это была просто догадка. Хи-хи."
1013902-96 = "Я читаю вас как открытую книгу, Сенсей."
1013902-97 = "Съешьте инаризуси завтра на завтрак. Я положу их в холодильник."
1013902-98 = "И сегодня не перерабатывайте, хорошо?"
1013902-99 = "Спокойной ночи, Сенсей."
1013902-101 = "Домашний удон Нико с жареным тофу согрел меня с головы до пят."
