[translation]
80000110-1 = "Фирменная смесь директора"
80000110-2 = "Утром в День святого Валентина я отправился в полицейскую школу Валькирии по делам Шале."
80000110-3 = ""
80000110-7 = ""
80000110-8 = "Административный офис полицейской школы Валькирии"
80000110-9 = ""
80000110-10 = "Хм. Ну и беспорядок..."
80000110-11 = "...Хм?"
80000110-12 = ""
80000110-14 = ""
80000110-15 = "Доброе утро, [USERNAME] Сенсей."
80000110-16 = "Что привело вас в полицейскую школу Валькирии так рано?"
80000110-17 = "Пришли проверить график патрулирования на эту неделю?"
80000110-18 = "...Понятно. Какое облегчение."
80000110-19 = "Я вас не ждала, поэтому уже подумала, что у нас снова какой-то кризис."
80000110-20 = "[s] «А ты почему здесь так рано, Канна?»"
80000110-21 = "Печатаю отчёты о происшествиях. Всё как обычно."
80000110-22 = "Нужно оформить отчёт о расходах на боеприпасы, использованные во время операций. Отчёт об ущербе торговому комплексу после попадания гранат—"
80000110-23 = ""
80000110-26 = ""
80000110-27 = "Сегодня какой-то хаос. Наверное, проходит крупное мероприятие..."
80000110-28 = "...День святого Валентина?"
80000110-29 = "А, уже это время года."
80000110-30 = "Надо было догадаться, когда магазины возле станции начали продавать шоколад. Но на этой неделе я так занята, что совсем забыла."
80000110-31 = "День святого Валентина... В это время полицейской школе Валькирии приходится особенно тщательно патрулировать районы вокруг мероприятий по всему D.U., посвящённых шоколаду."
80000110-32 = "В это время года происходит много происшествий, связанных с безопасностью, поэтому студенткам Бюро общественной безопасности приходится несладко."
80000110-33 = "...Впрочем, эти происшествия не входят в юрисдикцию Бюро общественного порядка, поскольку мы обычно занимаемся только серьёзными преступниками."
80000110-34 = ""
80000110-36 = ""
80000110-37 = "..."
80000110-38 = "Раз уж вы здесь, хотите кофе, Сенсей?"
80000110-39 = "Я могу прямо сейчас сварить свежий."
80000110-40 = "[s] «Тогда... одну чашку горячего кофе, пожалуйста.»"
80000110-41 = "Хорошо. Как обычно?"
80000110-47 = ""
80000110-48 = ""
80000110-50 = "Вот."
80000110-51 = "[s] «Спасибо! Выглядит отлично.»"
80000110-52 = ""
80000110-54 = ""
80000110-57 = "[ns1] «А? Этот кофе на вкус...»\n[ns2] «...Немного отличается от обычного?»"
80000110-60 = "Что не так со вкусом?"
80000110-61 = "[s] «Ничего. Как всегда, очень вкусно.»"
80000110-63 = "[ns] «Но теперь у него сильный аромат тёмного шоколада.»"
80000110-64 = "Ну, существует много сортов кофе с фруктовыми или шоколадными нотами."
80000110-65 = "Хорошо обжаренные кофейные зёрна нередко пахнут шоколадом."
80000110-66 = "[s] «Но для этого кофе ты использовала те же зёрна, что и обычно, да?»"
80000110-67 = "Ага. Те же самые, что я использую всегда."
80000110-68 = "Но если вдруг их вкус оказался немного другим, чем обычно..."
80000110-69 = ""
80000110-71 = ""
80000110-72 = "Возможно, потому что при смешивании к ним примешалось немного чувств."
80000110-73 = ""
80000110-75 = ""
80000110-76 = ""
80000110-77 = "...Надеюсь, у вас будет хороший день."
80000110-81 = "Так мой день начался с горько-сладкого кофе от Канны."
