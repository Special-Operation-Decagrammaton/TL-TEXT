[translation]
10048020-1 = "Эпизод 2;Давайте вас выслушаем"
10048020-2 = "Внутри общежития Картеля свободной торговли"
10048020-3 = ""
10048020-4 = ""
10048020-5 = "[ns] «Кого... то есть ЧТО ты закопала?»"
10048020-6 = "Ва-а! Это не то, что вы подумали!"
10048020-7 = "Посев! Да, ты имеешь в виду ПОСЕВ! Правда, Рицу?"
10048020-8 = "Да! Посев завершён!"
10048020-9 = "Я точно посадила всё там, где сказала Миё!"
10048020-10 = "Х-хорошая работа...!"
10048020-11 = "Ага. Молодец, Рицу."
10048020-12 = "Спасибо!"
10048020-13 = "А? Погодите, а вы кто?"
10048020-14 = "[s] «Здравствуйте, я Сенсей из Шале.»"
10048020-15 = "Здравствуйте! Я Усуба Рицу!"
10048020-16 = "Моё хобби — торговля! И моя специализация — тоже торговля!"
10048020-17 = "А учусь я на... скульптора!"
10048020-18 = "[s] «П-приятно познакомиться!»"
10048020-19 = "Кстати, кажется, я видела вас в новостях!"
10048020-20 = "Я слышала, вы голышом пробежали через поле!"
10048020-21 = "[s] «Это... не совсем неправда! Но—»"
10048020-22 = "Так круто было узнать, что за пределами Вайлдханта люди тоже вытворяют такое!"
10048020-23 = "[s] «Это... обычное дело в Вайлдханте?»"
10048020-24 = "У нас есть факультет исполнительских искусств..."
10048020-25 = "Сенсей, у вас мало одежды? Вы тогда стирали вещи?"
10048020-26 = "Может, потом достать вам что-нибудь носить?"
10048020-27 = "[s] «Очень заботливо с твоей стороны, но...»"
10048020-28 = "Важнее другое: ты уже закончила с посевом! Отлично по времени."
10048020-29 = "Рицу, будь добра, проводи нас к месту посева."
10048020-30 = "Хм? Ага, конечно. Но зачем?"
10048020-31 = "Сенсей хочет посмотреть, чем мы занимаемся в Картеле свободной торговли."
10048020-32 = "Посмотреть?"
10048020-33 = "Ух ты! Звучит весело!"
10048020-34 = ""
10048020-36 = ""
10048020-37 = ""
10048020-38 = "Но... вы уверены, что так можно?"
10048020-39 = "Миё, ты ведь всегда подчёркивала «безопасность и осторожность», помнишь?"
10048020-40 = "Фуфу, Рицу... Сенсей — ответственный взрослый."
10048020-41 = "А у взрослых... есть работа, за которую платят деньги. Если подсадить ответственного взрослого, можно отлично заработать."
10048020-42 = "Но чтобы получить приличную отдачу от вложений, нам нужно показать, что мы... заслуживаем доверия."
10048020-43 = "[s] «Эй, я вообще-то всё слышу.»"
10048020-45 = "Девочки... пожалуйста. Сенсей стоит ПРЯМО здесь."
10048020-46 = "...В любом случае, раз уж решили, лучше держаться вместе."
10048020-47 = ""
10048020-49 = ""
10048020-50 = "Идёмте, все."
10048020-52 = "Парк Вайлдханта"
10048020-55 = ""
10048020-56 = "Вот первое место посева!"
10048020-57 = "[s] «Так... а что вообще значит „посев“?»"
10048020-58 = "Это способ доставки контрабанды клиенту."
10048020-59 = "Мы оставляем предмет в заранее оговорённом всеми сторонами месте, а клиент забирает его позже."
10048020-60 = "Поэтому мы и называем это «посевом». Мы сажаем предмет, а покупатель потом собирает урожай."
10048020-61 = "Вот там... Он должен быть закопан под той статуей."
10048020-62 = "Тсс... А вот и она..."
10048020-63 = ""
10048020-65 = ""
10048020-67 = ""
10048020-68 = ""
10048020-69 = ""
10048020-70 = ""
10048020-71 = "Нашла...!"
10048020-72 = "О, наконец-то у меня есть последняя деталь для полного эстетического экстаза...!"
10048020-73 = "Что она заказала?"
10048020-74 = "Жареную курицу со вкусом напалма."
10048020-75 = "[s] «...Вы ещё и еду доставляете?»"
10048020-76 = ""
10048020-78 = ""
10048020-79 = ""
10048020-80 = "Конечно. В Вайлдханте ОЧЕНЬ строго относятся к еде извне."
10048020-81 = "А поскольку входить и выходить отсюда непросто..."
10048020-82 = "...многие студенты утоляют свои гастрономические желания через нас."
10048020-83 = "Ну что, продолжим к следующей точке?"
10048020-85 = "Окраина леса Вайлдханта"
10048020-86 = "На этот раз мы остановились у ямы рядом со старым деревом."
10048020-87 = ""
10048020-90 = ""
10048020-91 = ""
10048020-92 = ""
10048020-93 = "Эврика!"
10048020-94 = "Наконец-то я смогу завершить свой шедевр!"
10048020-95 = "Видите, ей понадобилась особая краска для работы. Великолепная штука."
10048020-96 = "Но сейчас она «не разрешена» в Вайлдханте."
10048020-97 = "[s] «Почему...?»"
10048020-98 = "В ней, по сути, содержится немного пестицида. Будто она настолько глупа, чтобы её есть..."
10048020-100 = "После этого они показали мне ещё несколько мест посева."
10048020-101 = "И пока я наблюдал, как отчаявшиеся студенты забирают свои контрабандные вещи..."
10048020-102 = "...я почти не видел среди них ничего хоть сколько-нибудь опасного."
10048020-104 = "Парк Вайлдханта"
10048020-105 = "В конце мы решили отдохнуть на скамейке."
10048020-106 = "А теперь мы... закрываем лавочку! На сегодня Картель свободной торговли закончил работу!"
10048020-107 = "Итак, что думаете, Сенсей?"
10048020-108 = "Каково ваше честное впечатление от нашей... контрабанды?"
10048020-109 = "[s1] «Было интересно посмотреть.»\n[s2] «Большая часть казалась такой безобидной...»"
10048020-112 = "Ха, «безобидной». Это была лишь малая часть всей нашей работы."
10048020-113 = "Мы используем множество инновационных маршрутов контрабанды и способов доставки."
10048020-114 = "Почему ты говоришь так, будто хвастаешься?"
10048020-115 = "Потому что я и хвастаюсь! И не без причины!"
10048020-116 = "Почему такое хмурое лицо, дорогая Миё?"
10048020-117 = "Всё, что мы сегодня видели, — ТВОЯ работа, разве нет?"
10048020-118 = "[s] «М-м...?»"
10048020-119 = "П-погоди, это..."
10048020-120 = "Хитрые способы доставки, обширные маршруты контрабанды, планы экстренного отхода на случай, если нас поймает Совет..."
10048020-121 = "Всё это сделала ты, Миё."
10048020-122 = "Угх..."
10048020-123 = "Пожалуйста, перестань меня смущать."
10048020-124 = "Сенсей, Миё не просто так наш лидер, наш любимый президент."
10048020-125 = "Мозг Картеля свободной торговли, главный организатор и стратег..."
10048020-126 = "...Это президент Миё."
10048020-127 = "Гах...!"
10048020-128 = "Просто смирись, президент."
10048020-129 = "Ты королева контрабанды! Само её воплощение. Незаменимая икона."
10048020-130 = "Вот именно! Планы Миё никогда не подводят!"
10048020-131 = "А-а-а-а-а...!"
10048020-132 = ""
10048020-134 = ""
10048020-135 = "Именно поэтому я со всем смирением вынуждена снова просить тебя о помощи, Миё."
10048020-137 = "...Хм?"
10048020-138 = "Что ты...?"
10048020-139 = "Ха."
10048020-140 = "Похоже, нам подвернулся очень крупный куш."
10048020-141 = "Оплата —"
10048020-142 = "Отклонено."
10048020-143 = "Ой, да выслушай меня хотя бы!"
10048020-144 = "Если даже ТЫ считаешь сумму большой, Фую, значит она астрономическая."
10048020-145 = ""
10048020-147 = ""
10048020-148 = "...Не могу сказать, что ты неправа."
10048020-149 = "Легко не будет."
10048020-150 = "Но ведь тебя волнует не это, правда, Миё?"
10048020-151 = "...Хм?"
10048020-152 = "Главное ведь..."
10048020-154 = "...на твоём любимом сайте подержанных вещей наконец снова выставили на продажу Cutey Berry 87."
10048020-155 = "...!"
10048020-156 = "Правда? Настоящую? Не реплику?"
10048020-157 = "Именно. Сама проверь."
10048020-158 = ""
10048020-160 = ""
10048020-161 = ""
10048020-162 = "[ns] «Что такое Cutey Berry 87?»"
10048020-163 = "Это... проклятый шедевр, Сенсей."
10048020-164 = "Cutey Berry 87 — роскошное, изящное и трагически прекрасное творение, настолько опередившее своё время, что почти не успело побывать в продаже...!"
10048020-165 = "Проще говоря — старая печатная машинка."
10048020-166 = "Эй!"
10048020-167 = "[s] «Печатная машинка...?»"
10048020-168 = ""
10048020-170 = ""
10048020-171 = "Да, это ВИНТАЖНАЯ печатная машинка, за которой я охочусь уже очень давно."
10048020-172 = ""
10048020-173 = "Я люблю коллекционировать печатные машинки..."
10048020-175 = "[ns] «Ага...»"
10048020-176 = "Есть веская причина, почему её так и не продали, Сенсей."
10048020-177 = "Зачем печатной машинке противопехотные мины направленного действия?"
10048020-178 = "Не тебе это говорить — человеку, который ставит катапульту просто потому, что это «круто»."
10048020-179 = "Суть в том, что ты хочешь эту Cutey Berry 87, да?"
10048020-180 = "Но... денег тебе не хватает. Очень сильно не хватает."
10048020-181 = "Ты ничего не знаешь о моих финансах."
10048020-182 = "Мне не нужно разбивать яйцо, чтобы понять, сколько в нём желтков."
10048020-183 = "Про яйца с двумя желтками не слышала?"
10048020-184 = "...Только не от тебя."
10048020-185 = ""
10048020-187 = ""
10048020-188 = "Цк!"
10048020-189 = "Будь честна с собой, Миё. Ты хочешь купить Cutey Berry 87, но денег у тебя нет."
10048020-190 = "Но как только мы выполним эту работу..."
10048020-191 = "Тебе хватит на пять таких. И ещё на витрину."
10048020-192 = "..."
10048020-193 = ""
10048020-195 = ""
10048020-196 = "...Хорошо."
10048020-197 = "...Я выслушаю. Что за заказ?"
