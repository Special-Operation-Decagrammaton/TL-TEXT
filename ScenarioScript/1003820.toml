[translation]
1003820-1 = "Воспоминания о SRT"
1003820-2 = "Гостиная Шале"
1003820-3 = "Я помогал Мияко складывать бельё отряда RABBIT в гостиной Шале."
1003820-4 = "Спасибо, что помогаете, Сенсей."
1003820-5 = "Теперь наше бельё должно хорошо высохнуть."
1003820-6 = "Если бы вы не позволили нам воспользоваться сушилкой здесь, мы бы застряли с сырой одеждой посреди сезона дождей."
1003820-7 = "Даже представить не могу, насколько это было бы неудобно. И что холодная погода вместе с мокрой одеждой сделала бы со здоровьем отряда."
1003820-8 = "[s1] «Берегите себя там.»\n[s2] «При необходимости можете пользоваться и другими помещениями Шале.»"
1003820-11 = "Спасибо, Сенсей."
1003820-12 = "Когда мы только начали жить лагерем, нас беспокоила лишь погода. О необходимости принимать душ или стирать вещи мы вообще не думали."
1003820-13 = "Похоже, жизнь не так проста и прямолинейна, как операции в наших учебниках."
1003820-14 = "Кажется, мне ещё многому нужно научиться, прежде чем я стану полноценным командиром отряда."
1003820-15 = ""
1003820-18 = "А, остальное бельё тоже высохло."
1003820-19 = "Я его сложу. Можете немного отдохнуть, Сенсей."
1003820-20 = ""
1003820-22 = ""
1003820-24 = ""
1003820-25 = "[ns3] «Мияко, ты что-то уронила.»\n[ns4] «Это именная нашивка?»"
1003820-28 = "А..."
1003820-29 = "Вы очень наблюдательны, Сенсей. Наверное, она выпала из корзины с бельём."
1003820-30 = "[s5] «Может, стиральная машина оторвала её от формы?»\n[s6] «У меня есть набор для шитья, если хочешь пришить её обратно.»"
1003820-33 = "Нет, всё в порядке. Я никогда не носила эту нашивку на форме..."
1003820-34 = "Я всегда храню её в кармане."
1003820-35 = "[s] «Зачем носить с собой оторванную именную нашивку?»"
1003820-36 = "Это моя учебная нашивка. Я получила её, когда впервые пришла в Академию SRT."
1003820-37 = "Она предназначалась для нашей старой формы курсантов. После официального назначения в отряд мне больше не нужно было её носить."
1003820-38 = "Когда держу её в руках, вспоминаю те времена."
1003820-39 = "Нашу непоколебимую справедливость даже в самых суровых условиях. Моих старших товарищей — таких смелых и блистательных."
1003820-40 = "Даже когда мне тяжело, стоит вспомнить те дни, и я снова нахожу силы двигаться дальше."
1003820-41 = "Поэтому я храню эту нашивку в кармане — как личное напоминание о прошлом."
1003820-42 = "[s] «Это довольно трогательно...»"
1003820-43 = ""
1003820-46 = "[ns7] «Если подумать, мы ведь познакомились не при лучших обстоятельствах.»\n[ns8] «Хорошо вспоминать старые времена, но надеюсь, ты не вспоминаешь, как мы конфликтовали...»"
1003820-49 = ""
1003820-50 = "Не дерзите, Сенсей."
1003820-51 = "Тогда я считала, что вы только мешаете... Если честно? Я ещё вам не доверяла."
1003820-52 = "Но я помню и хорошие моменты, Сенсей."
1003820-53 = "Так что не переживайте. То, что я чувствую сейчас, уже не изменится..."
1003820-55 = "Мы с Мияко приятно провели время, вспоминая прошлое и складывая бельё."
