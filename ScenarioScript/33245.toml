[translation]
33245-3 = "..."
33245-4 = "Agradeço do fundo do coração, Sensei."
33245-5 = "É motivo de profunda vergonha tê-lo apresentado em uma forma incompleta, mas eu o concluirei em breve."
33245-6 = "O Terno Preto tinha razão... Embora eu raramente simpatize com ele, quanto a este assunto, não posso deixar de lhe agradecer."
33245-7 = "...Pois bem, Sensei [USERNAME]. Aguardo ansiosamente pelo dia em que nos encontraremos novamente."
33245-8 = "Mais uma vez, dentro de um sonho."
33245-13 = "Depois disso, procuramos por todas do Esquadrão Arius, mas no fim não conseguimos encontrá-las."
33245-14 = "Elas provavelmente fugiram por alguma das passagens subterrâneas da Antiga Catedral, mas não conseguimos identificar qual..."
33245-16 = "Cof, cof...!"
33245-17 = "V-Você está bem, Líder...?"
33245-18 = "...E então, pra onde a gente vai?"
33245-19 = "...Não podemos voltar para o distrito autônomo. Ela vai nos matar..."
33245-20 = "...Bom, terminar desse jeito também não seria tão ruim."
33245-21 = "I-Isso parece doloroso demais... E mesmo que não seja assim, daqui pra frente também será sempre..."
33245-22 = "Pois é, porque a vida é assim."
33245-30 = "..."
33245-32 = "Próximo;Epílogo"
