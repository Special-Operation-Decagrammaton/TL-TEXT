[translation]
2004102-1 = "Рациональная жизнь"
2004102-2 = "Я отправился туда, куда попросила меня прийти Рио."
2004102-3 = "Добраться туда через все системы безопасности оказалось довольно хлопотно."
2004102-4 = ""
2004102-7 = "Вы здесь, Сенсей? Давно ждёте?"
2004102-8 = "Только что пришли? Понятно. Я ошибочно предположила, что вы выберете дополнительный маршрут."
2004102-9 = "[s] «Можно тебя кое о чём спросить...»"
2004102-10 = "Хм? Что я обычно ем?"
2004102-11 = "Ну, конечно же, вечерние бэнто со скидкой и замороженные продукты. Очень рациональный выбор."
2004102-12 = "Во-первых, скидка на такое бэнто может доходить до 50%, а вкус вполне приемлемый."
2004102-13 = "Особенно хороши бэнто с кацу и рисовые боулы с караагэ. Вообще-то, они просто великолепны."
2004102-14 = "К сожалению, магазин, где я обычно их покупаю, сегодня закрыт."
2004102-15 = "В обычный день люди там буквально сражаются за еду. Настолько она хороша."
2004102-16 = "А замороженные продукты долго хранятся, и их можно закупать оптом."
2004102-17 = "Опять же — рациональный выбор."
2004102-18 = "[s1] «Так ты здоровье угробишь...»\n[s2] «Хотя бы закажи доставку чего-нибудь полезнее...»"
2004102-21 = "Я не могу заказывать доставку. Это нерационально. Заказы доставки можно отследить."
2004102-22 = "Если курьер случайно запомнит моё лицо, я окажусь в большой опасности."
2004102-23 = "Мало того, за отзывы там дают бонусы. Скидки и тому подобное."
2004102-24 = "Было бы нерационально ими не воспользоваться..."
2004102-25 = "...но, опять же, любой отзыв можно отследить до меня."
2004102-26 = "В просторечии это называется дилеммой."
2004102-27 = "А я предпочитаю по возможности избегать подобных дилемм."
2004102-28 = "Что, опять же, рационально."
2004102-29 = "[s] «Сейчас эта еда дешёвая, да, но счета из больницы дорогие.»"
2004102-30 = "Ч-что? Ну, бэнто и замороженная еда действительно часто жареные..."
2004102-31 = "...а значит, в них слишком много углеводов и жира и не хватает клетчатки и витаминов..."
2004102-32 = "...Да, это действительно стоит учитывать. Но я всегда могу принимать витаминные добавки."
2004102-33 = "А что касается клетчатки..."
2004102-34 = "Ну, до сих пор мой организм прекрасно обходился без неё."
2004102-35 = "[s] «Это не значит, что всё в порядке.»"
2004102-36 = "Насколько вообще растительная клетчатка может быть важна для организма? К тому же есть всевозможные добавки..."
2004102-37 = "...и вообще, я не умею готовить."
2004102-38 = "Что? А если сделать что-то вроде Avant Guard, только для готовки? Ну, чтобы он использовал рецепты из интернета?"
2004102-39 = "Не могу сказать, что когда-либо пробовала такое..."
2004102-40 = "[s] «...Но?»"
2004102-41 = ""
2004102-43 = ""
2004102-44 = "...Но мне страшно..."
2004102-45 = ""
2004102-48 = "[ns3] «Рио!!»\n[ns4] «Всё. Мы идём в супермаркет.»"
2004102-51 = "Нет, там слишком высокие цены. Это нерациональный выбор."
2004102-52 = "[s] «Я плачу. Пошли.»"
2004102-53 = "Х-хорошо..."
2004102-55 = "Я потащил Рио в супермаркет."
2004102-58 = "С-Сенсей, что ЭТО такое? Какой-то белый овощ с фрактальной структурой...? Хаусдорфова размерность... кажется, около 2,7..."
2004102-59 = "Это называется «цветная капуста»? С-страшно даже есть... Хм? Если правильно сварить, по вкусу похоже на картофель...?"
2004102-60 = ""
2004102-62 = ""
2004102-63 = ""
2004102-64 = "...Итак, здесь у нас картофель, морковь, лук и... помидоры. Да, их я знаю. Кстати..."
2004102-65 = "Вы уверены, что хотите купить столько мяса...?"
2004102-67 = "Так я учил Рио, которая совершенно ничего не знала о покупке продуктов, самостоятельно ходить за ними."
2004102-68 = "Честно говоря, я и сам не особенно разбирался в покупке продуктов, поэтому мне сильно помог интернет..."
2004102-70 = "..."
2004102-71 = "Понятно, основа — белок и овощи. А углеводов меньше, чем раньше."
2004102-72 = "И что теперь, Сенсей?"
2004102-73 = "[s] «Я приготовлю тебе еду в Шале.»"
2004102-74 = "Ч-что? Вы умеете готовить?"
2004102-75 = "Совсем не умеете? Тогда как...? ...Вы хотите просто взять рецепты из интернета и надеяться, что в итоге получится что-нибудь съедобное?"
2004102-76 = "...Послушайте, я обычно не придаю значения предчувствиям..."
2004102-77 = "...но сейчас у меня почему-то нехорошее ощущение."
2004102-78 = "[s] «Справедливо. Обидно, но справедливо...»"
2004102-80 = "Немного поплутав, мы всё-таки вернулись в Шале."
2004102-81 = ""
2004102-83 = ""
2004102-84 = "[ns] «Отдохни немного. А я... попробую что-нибудь приготовить.»"
2004102-85 = "Х-хорошо."
2004102-86 = ""
2004102-94 = "Это...?"
2004102-95 = "Рагу, хм? Значит... условно говоря, рагу может приготовить кто угодно?"
2004102-96 = "..."
2004102-97 = "Спасибо за еду, Сенсей."
2004102-102 = "Некоторое время мы молча опустошали миску с рагу."
2004102-104 = "Почему-то оно..."
2004102-105 = "[ns] «П-почему-то оно... что?»"
2004102-106 = "...не такое уж плохое на вкус."
2004102-107 = "Хотя ХОРОШИМ я бы его не назвала..."
2004102-108 = "[s] «Понятно...»"
2004102-109 = "..."
2004102-110 = "Но..."
2004102-111 = ""
2004102-113 = ""
2004102-114 = ""
2004102-115 = ""
2004102-117 = "...Но вкус у него... кажется, подходящее слово — «душевный»."
