[translation]
83303300300-5 = ""
83303300300-6 = "Г-глава префектов Хина! Чрезвычайная ситуация!"
83303300300-7 = "Что такое?"
83303300300-8 = "Это... те нарушители, которых вы усмирили..."
83303300300-9 = "Они внезапно начали скандировать что-то вроде: «Мы не можем подвести председателя!»"
83303300300-10 = "«Пусть мы преступники, но верность для нас — вопрос жизни и смерти! За Обществом Пандемониума! Это война против Префектурной команды!»"
83303300300-11 = "...А потом снова устроили погром!"
83303300300-12 = "Верность... Мне очень интересно, как Макото вообще сумела заслужить их преданность. У председателя Общества Пандемониума и хулиганов Геенны вроде бы не должно быть почти ничего общего."
83303300300-13 = "Но если хотят орать и буянить — пусть. В этот раз я оставлю их по-настоящему без слов."
