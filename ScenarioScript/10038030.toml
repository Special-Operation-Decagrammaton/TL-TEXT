[translation]
10038030-1 = "Эпизод 3;Один взрослый, много детей"
10038030-2 = ""
10038030-3 = "Обычно в этом парке полно студентов..."
10038030-4 = "Но сейчас здесь никого. Очень пустынно."
10038030-5 = "Не видно ни участниц Клуба Пекинской Оперы, которые обычно здесь репетировали, ни студентов, болтавших за танхулу или манговыми вафлями..."
10038030-6 = "......"
10038030-7 = ""
10038030-9 = ""
10038030-10 = "О, но один киоск с едой всё ещё работает! Давайте что-нибудь съедим, Сенсей. Мне ужасно хочется яичного тарта!"
10038030-11 = ""
10038030-13 = ""
10038030-14 = "Мне тоже, мне тоже! Я потом даже очень хорошо почищу зубы!"
10038030-15 = "[s] «Эм... Да... Хорошо...»"
10038030-16 = ""
10038030-17 = "Спасибо!"
10038030-20 = "Сенсей, Сенсей! Вы знали? В Персиковом Источнике начали продавать банджи!"
10038030-21 = "Третьекурсницы... стараются их избегать... потому что это против традиций, но..."
10038030-22 = "...стоит один раз попробовать — и сразу хочется ещё!"
10038030-23 = "Банджи? Никогда о таком не слышал."
10038030-24 = "Хи-хи... Банджи — это...!"
10038030-25 = ""
10038030-27 = ""
10038030-29 = "Это охлаждённый фруктовый торт со сливками: свежие сливки и фрукты внутри тонкой оболочки!"
10038030-30 = "Самый известный — с манго, но начинка может быть любой! Зелёный чай, шоколад, клубника — что угодно!"
10038030-32 = "Ого, звучит вкусно!"
10038030-33 = "Я ОЧЕНЬ хочу попробовать, Сенсей!"
10038030-34 = "[s] «Но разве ты только что не съела яичный тарт...?»"
10038030-35 = ""
10038030-37 = ""
10038030-38 = ""
10038030-39 = ""
10038030-40 = ""
10038030-42 = ""
10038030-43 = "Ну пожалуйста? Пожа-а-алуйста?!"
10038030-44 = "Он отлично сочетается с крепким зелёным чаем!"
10038030-45 = "Зелёный чай уравновешивает насыщенный вкус фруктов и сливок, поэтому каждый новый кусочек ощущается свежо..."
10038030-46 = ""
10038030-47 = "Ну можно? Пожа-а-алуйста?!"
10038030-48 = ""
10038030-51 = "[ns] «Ладно...»"
10038030-52 = ""
10038030-54 = ""
10038030-55 = "Ура! Спасибо!"
10038030-56 = "Кики больше всех любит Сенсея!"
10038030-57 = ""
10038030-59 = ""
10038030-60 = "Что такое? Вы чуть не подавились!"
10038030-61 = "Сенсей, так нельзя! Вы же взрослый! Нужно следить за манерами в общественном месте. Даже я это знаю!"
10038030-62 = "[s] «Ага... Хорошо...»"
10038030-66 = ""
10038030-67 = "Мы столько всего съели! Теперь надо немного пройтись!"
10038030-68 = "Отличная идея! И место для этого идеальное. Здесь всегда так спокойно!"
10038030-69 = "А если повезёт, встретим панду... О, вон там!"
10038030-70 = ""
10038030-72 = ""
10038030-73 = ""
10038030-75 = "Эм... разве это не опасно? Панды всё-таки медведи..."
10038030-76 = "Всё нормально! Здешние панды привыкли к людям. Им нравится быть рядом!"
10038030-77 = ""
10038030-79 = ""
10038030-80 = "Те, что живут с этой стороны, любят побеги бамбука, так что если сорвать один и протянуть им...!"
10038030-81 = ""
10038030-85 = "Пуу?"
10038030-86 = ""
10038030-89 = "Биии!"
10038030-90 = "Смотрите! Он ест!"
10038030-91 = "О-о-о! Я тоже хочу! Я тоже хочу!"
10038030-92 = "[s] «Хорошо, только не подходи слишком близко...»"
10038030-93 = ""
10038030-94 = "Х-Хорошо!"
10038030-97 = ""
10038030-98 = "Я вернулась!"
10038030-99 = "Фух... Какой невероятно насыщенный день."
10038030-100 = "Правда? Я так рада!"
10038030-101 = "А вы, Сенсей?"
10038030-102 = "[s] «Ну, главное, что студентам понравилось...»"
10038030-103 = "Мы скорее дети из Сада Сливового Цвета, чем настоящие студенты."
10038030-104 = "[s] «Тогда главное, что детям понравилось...»"
10038030-105 = "Но что у вас с лицом? Такой отрешённый вид, будто вы достигли просветления."
10038030-106 = "А, ничего? Мне не о чем беспокоиться? Хм... Правда...?"
10038030-107 = ""
10038030-113 = ""
10038030-114 = "О, Сенсей! Добро пожаловать в Сад Сливового Цвета. Я слышала, вы сегодня играли с детьми. Наверное, совсем вымотались."
10038030-115 = ""
10038030-117 = ""
10038030-118 = "Привет, давно не виделись! ...О, а кто это рядом с вами?"
10038030-119 = ""
10038030-122 = ""
10038030-123 = "Е-Её зовут Кики. Она недавно перевелась к нам! Шун её порекомендовала."
10038030-124 = ""
10038030-126 = ""
10038030-127 = "Здравствуйте, инструктор Кокона! Меня зовут Кики. Очень приятно познакомиться!"
10038030-128 = ""
10038030-131 = ""
10038030-132 = "*ахает*"
10038030-133 = "В-Видите, Сенсей? Я и правда настоящий инструктор!"
10038030-134 = ""
10038030-136 = ""
10038030-140 = ""
10038030-142 = ""
10038030-143 = "Х-Хм? Чего это вы вдруг улыбаетесь? И зачем гладите меня по голове...?!"
10038030-144 = "Что? Говорите, хорошо знать, что мир всё ещё работает как положено? Это ещё что значит...?"
10038030-145 = ""
10038030-148 = ""
10038030-149 = "Я-я пойду... поищу Шун. Вон там."
10038030-150 = ""
10038030-152 = ""
10038030-153 = "Я с вами!"
10038030-154 = ""
10038030-156 = ""
10038030-158 = "П-Подожди! Шун..."
10038030-159 = ""
10038030-162 = "Хм... А где вообще сегодня Шун?"
10038030-163 = "[s] «Я... помогу её поискать.»"
10038030-164 = "Сенсей? Очень мило с вашей стороны, но вам правда не обязательно..."
10038030-165 = "А? Это то, что вы ОБЯЗАНЫ сделать? Вы сегодня говорите столько странных вещей..."
10038030-166 = ""
10038030-168 = ""
10038030-169 = ""
10038030-170 = "Хорошо, тогда оставляю это вам. Мне нужно заняться остальными детьми."
10038030-171 = "И я прекрасно справлюсь, ведь я инструктор Сада Сливового Цвета! Никаких проблем!"
10038030-173 = ""
10038030-174 = "Фух, чуть не попались. У Коконы хорошее чутьё на такие вещи."
10038030-175 = "Хм-м."
10038030-176 = "По крайней мере, нашей цели — тайно исследовать Шаньхайцзин — мы добились. Хорошая работа."
10038030-177 = "...Как вы считаете, госпожа?"
10038030-178 = "Хм... Как бы это сказать...?"
10038030-179 = ""
10038030-183 = "Кисаки...?"
10038030-184 = ""
10038030-186 = ""
10038030-188 = ""
10038030-190 = ""
10038030-191 = "А?!"
10038030-192 = "О, здравствуйте! Меня зовут Кики. Я недавно сюда перевелась и ещё почти никого не знаю. А вас как зовут?"
10038030-193 = ""
10038030-195 = ""
10038030-196 = "......"
10038030-197 = "......"
10038030-198 = "Кисаки, что... ты делаешь...?"
10038030-199 = "Я-я же сказала, я Кики..."
10038030-200 = "Это уже немного чересчур..."
10038030-201 = "......"
10038030-202 = "Хех, похоже, тебя не обманешь."
10038030-203 = "...Кто-нибудь объяснит, что происходит? Кисаки? Сенсей?"
10038030-204 = "[s] «Давайте... сначала уйдём куда-нибудь в другое место.»"
10038030-207 = ""
10038030-208 = ""
10038030-209 = ""
10038030-210 = "...Хорошо, я проверила: вокруг никого, и наши голоса не должны далеко разноситься."
10038030-211 = "А даже если нас кто-то увидит, просто подумает, что дети из Сада Сливового Цвета гуляют в парке со своим инструктором."
10038030-212 = "Так что выкладывай уже, Кисаки. Что ты задумала?"
10038030-214 = "Беспокоиться не о чем."
10038030-215 = "Мы просто... выбрали одежду, которая как нельзя лучше подошла для наших целей."
10038030-216 = "А... Ты под прикрытием. Понятно..."
10038030-217 = "Я вообще-то знаю, что ты время от времени работаешь под прикрытием."
10038030-218 = "Но зачем весь этот спектакль с «Кики»?"
10038030-219 = "Ну... Одежда для тайного расследования должна учитывать время, ситуацию и окружающие обстоятельства..."
10038030-220 = "Ладно, раз ты так говоришь. Хех, напомнило, как ты однажды пробралась куда-то, переодевшись работницей Променада Чёрной Черепахи."
10038030-221 = "Ах, конечно, ты это помнишь. Внешне маскировка была идеальной. Всё шло прекрасно."
10038030-222 = "А потом ты решила готовить. Конечно же, это тебя и выдало! Хи-хи!"
10038030-223 = "Радуйся, что поймала тебя именно я. Если бы догадался кто-то другой, у тебя на руках оказался бы политический скандал."
10038030-224 = "И я полностью отплатила за тот долг."
10038030-225 = "Знаю, знаю. Просто вспоминаю старое."
10038030-226 = "Ладно, а ТЫ-то сама чем занимаешься?"
10038030-227 = "Я? Ну... поскольку ещё неизвестно, состоится ли в этом году Фестиваль Лунного Света, я хотела убедиться, что все дети Сада Сливового Цвета получат лунные пряники."
10038030-228 = "Хотите один? У меня осталось несколько."
10038030-229 = "Лунный пряник... Я по ним соскучилась. Спасибо, я очень благодарна."
10038030-230 = "А вы, Сенсей? Лунные пряники с Променада Чёрной Черепахи — местный специалитет."
10038030-231 = "[s] «Тогда я не могу отказаться...»"
10038030-232 = ""
10038030-234 = ""
10038030-236 = ""
10038030-239 = "Я откусил лунный пряник, и рот наполнился насыщенным, приятным вкусом."
10038030-241 = "Некоторое время мы молча ели угощение..."
10038030-244 = "...Это напоминает мне прежние времена. Помнишь первые лунные пряники, которые мы приготовили вместе?"
10038030-245 = "Ух, ты всё ещё это помнишь...?"
10038030-246 = "Мы использовали яичные желтки, грецкие орехи и пасту из красной фасоли."
10038030-247 = "Тебе пора научиться отпускать прошлое..."
10038030-248 = "Это было слишком яркое впечатление. Паста из красной фасоли слегка подгорела, желток был полусырым, а орехи раскрошились так сильно, что совсем не хрустели."
10038030-249 = "Кисаки, вообще-то именно ты утрамбовывала лунные пряники в форму."
10038030-250 = "Да, и именно поэтому они превратились в крошево."
10038030-251 = "Их вообще с трудом можно было назвать «лунными пряниками»."
10038030-252 = "Ну, с первого раза идеального результата ждать не стоит. Это часть процесса."
10038030-253 = "Верно. Но всё же..."
10038030-254 = "Сколько бы времени ни прошло, я всё ещё помню те лунные пряники."
10038030-255 = "...Примерно тогда я и решила стать поваром."
10038030-256 = "Скажешь, что достигла этой цели?"
10038030-257 = "Не уверена. Наверное, в каком-то смысле да. А ты, Кисаки?"
10038030-258 = "Я...? Сложно сказать. Ты же помнишь, я никогда не хотела быть президентом."
10038030-259 = "......"
10038030-260 = "Что ж, президент из тебя получился хороший."
10038030-261 = "И это я говорю, пока вся моя улица уходит в минус из-за твоих ограничений..."
10038030-262 = ""
10038030-265 = ""
10038030-266 = "...Мне так жаль. Я даже не знаю, что сказать."
10038030-267 = "Нет-нет. Я не ждала извинений. Во всяком случае, серьёзных."
10038030-268 = "На самом деле у всех были отложены средства на работу, и большинство понимает, что ты делаешь то, что должна. Но важнее другое..."
10038030-269 = "После всего, что происходило на Променаде, его участницам и правда не особенно есть на что жаловаться."
10038030-270 = "...Хотя потом успокаивать девочек будет непросто."
10038030-271 = "Могу себе представить."
10038030-272 = "Ну, тебе наверняка ещё тяжелее. Просто сохраняй решимость, как всегда, и я уверена, ты со всем разберёшься."
10038030-273 = "«Сохраняй решимость...»"
10038030-274 = "Хм? Что такое?"
10038030-275 = "Когда мы начинали, ТЫ была полна решимости."
10038030-276 = "Не уверена, что она у меня вообще когда-либо была."
10038030-277 = "Ну..."
10038030-278 = "[s] «И всё же ты со всем разберёшься.»"
10038030-279 = ""
10038030-281 = ""
10038030-282 = "...Что вы имеете в виду, Сенсей?"
10038030-283 = "[s1] «Если бы у тебя БЫЛА решимость, сейчас возникла бы проблема...»\n[s2] «А если её никогда не было, значит, ты её и не потеряла.»"
10038030-286 = "То есть я не могу потерять то, чего у меня никогда не было."
10038030-287 = "Фуфу... Пожалуй, в этом есть смысл. Совсем другой взгляд на ситуацию."
10038030-288 = "Тогда скажите честно: как, по-вашему, я справлялась до сих пор?"
10038030-289 = "[s] «...Я знаю, что ты стараешься изо всех сил.»"
10038030-290 = "...Понятно."
10038030-291 = "Но иногда одних стараний недостаточно, чтобы добиться результата."
10038030-293 = "А, на Променаде Чёрной Черепахи есть похожая поговорка."
10038030-294 = "«Сколько ни старайся готовить, если еда невкусная — толку нет.»"
10038030-295 = "Да, смысл тот же. Вот как Общество Восточной Алхимии всегда так старается..."
10038030-296 = "Не дразни Саю слишком сильно."
10038030-297 = "Я не хотела выделять именно Саю, но... раньше ведь уже была та проблема..."
10038030-298 = ""
10038030-300 = ""
10038030-301 = ""
10038030-302 = "Погоди... Общество Восточной Алхимии...?"
10038030-305 = "...Да. Люди говорят. Пока немногие, но говорят..."
10038030-306 = ""
10038030-308 = "Глава Общества Восточной Алхимии пропала..."
10038030-309 = ""
10038030-312 = "Президент Общества Восточной Алхимии Сая сотрудничает с расследованием, но полезных показаний мы пока не получили."
10038030-313 = "Предполагается, что Синдром Малыша связан с Обществом Восточной Алхимии. А это значит..."
10038030-314 = ""
10038030-317 = "П-Подождите! Это нечестно! Общество Восточной Алхимии тут вообще ни при чём!"
10038030-318 = "(Попробую взглянуть на это с другой стороны. Если бы я хотела вернуться в Шаньхайцзин...)"
10038030-319 = ""
10038030-322 = "Исключённому студенту было бы трудно вернуться без какой-либо официальной процедуры."
10038030-323 = "Тем более Шинтани Кай..."
10038030-324 = ""
10038030-326 = ""
10038030-327 = "*ахает*"
10038030-328 = "Что такое? Что случилось, Кисаки?"
10038030-329 = "Вот чего мне не хватало. Обществу Восточной Алхимии угрожает огромная опасность!"
10038030-330 = "Обществу Восточной Алхимии? Почему именно ему?"
10038030-331 = ""
10038030-333 = ""
10038030-337 = ""
10038030-338 = "Госпожа президент? Что случилось?"
10038030-339 = "Мина, нам немедленно нужна разведка в Обществе Восточной Алхимии."
10038030-340 = "*ахает* Я как раз собиралась сказать: Общество Восточной Алхимии только что прислало срочное сообщение!"
10038030-341 = ""
10038030-343 = ""
