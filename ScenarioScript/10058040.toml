[translation]
10058040-1 = "Episode 4;Time On Target"
10058040-2 = "What was that just now!? You can actually maneuver missiles like that?!"
10058040-3 = "To intentionally give it an unstable trajectory so it wouldn't get shot down, and then land a direct hit with pinpoint accuracy..."
10058040-4 = "That's not what I mean! I mean, are all the teams out there that unhinged?!"
10058040-5 = "Looks like we're the only ones who thought this was just a normal race."
10058040-6 = "You said you knew all about the Gehenna Cup, Elina?!"
10058040-7 = "The radio and newspapers said it was like a biathlon!"
10058040-8 = "You wouldn't expect it to be an actual 'warzone', would you?!"
10058040-9 = "It's like how novels don't bother to explicitly write 'they took a breath'."
10058040-14 = "Lana, stop!! There's a battle starting right over there!"
10058040-15 = "Why?! Everywhere we go is a damn battlefield!!"
10058040-16 = "Let's duck into those bushes and take a detour!"
10058040-17 = "If I'd known it would come to this, I should've welded a lawnmower to the front."
10058040-18 = "Never mind that, hurry!!"
10058040-21 = "Akari-san, the other side as well, please."
10058040-22 = "Let's pursue artillery fire with the same dedication as gourmet food. #nConsider that tank over there our practice dummy."
10058040-23 = "Waaah! Can someone switch with me~?! My lower back is killing me from loading these shells over and over~!"
10058040-24 = "Didn't you say you wanted to be the loader, Izumi?! We can't switch places right now!"
10058040-25 = "You said it was a 'ten', so I thought it'd be something delicious like fried shrimp tempura~!"
10058040-26 = "I'm just gonna keep right on firing away~★"
10058040-32 = "Both tracks destroyed! Mobility disabled!"
10058040-33 = "Yikes, we're completely being played with."
10058040-34 = "Mashiro, can you counterattack?"
10058040-37 = "Kyaah...!"
10058040-38 = "Hard to say. The barrel took a direct hit just a moment ago."
10058040-39 = "I think we could manage if we could compensate for the trajectory, but..."
10058040-40 = "Ah... In that case, forget it. #nIf the breech is damaged, it might explode inside the turret."
10058040-41 = "Well then... Everyone, thank you for your hard work."
10058040-44 = "Looks like they're determined to keep going until they're satisfied, so how about some tea in the meantime? #nThis tank actually comes with a teapot."
10058040-45 = "In that case, I'll have a milk tea, please."
10058040-46 = "A-And I'll take mine with just sugar, no milk...!"
10058040-47 = "Just wait a tiiiny bit longer~"
10058040-48 = "Hmm...? Wait, it's gotten awfully quiet. Are they out of ammo, maybe?"
10058040-49 = "That is..."
10058040-50 = "Ichika-senpai. Could you take a look at the Gehenna tank through the scope?"
10058040-51 = "Understood. Let's see here..."
10058040-60 = "Who... is that?"
10058040-61 = "Mashiro, you know how to read lips, right? Can you tell what she's saying?"
10058040-62 = "She's far away, so I can't be entirely certain, but..."
10058040-68 = "\"I told you so many times. I've reached my limit.\""
10058040-69 = "\"Hau, Ahari, Shyunko, Hizumi.\""
10058040-70 = "\"Give me back my truck.\""
10058040-72 = "Ooh—! And here comes a totally unexpected twist!"
10058040-73 = "The Gourmet Research Society skipped the preliminaries and gatecrashed the race using the Feeding Department's tank, but... #nIt looks like they've been forcibly retired by the hands of Feeding Department Director Fuuka!"
10058040-74 = "Well, those days happen!"
10058040-75 = "[s] \"Gatecrashing is allowed?!\""
10058040-76 = "No, obviously it's not?"
10058040-77 = "Even if they survived to the end, they wouldn't win anyway, #nso dropping out here might actually be a blessing in disguise!"
10058040-78 = "Still, that was super entertaining~!"
10058040-80 = "Wh-What's going on...?"
10058040-81 = "Ah, everyone's running outside to escape. There's only one person left."
10058040-82 = "\"Don't just leave me behind, come on. Waaah.\""
10058040-83 = "\"Ugh, you'll pay for this. I'm definitely getting you back someday.\""
10058040-84 = "I-It's fine now."
10058040-85 = "Shall we make repairs and get moving?"
10058040-86 = "Yeah..."
10058040-87 = "!!"
10058040-88 = "Incoming enemy artillery!"
10058040-95 = "With this rate of fire... We might be caught in a crossfire!"
10058040-96 = "Kyaaaaaah!!!"
10058040-101 = "Consider it lucky if one hits—"
10058040-102 = "Landing multiple hits simultaneously, that's amazing."
10058040-103 = "That's the fruit of our training! What's our next target?"
10058040-106 = "Naturally, the main base! We've cleared out the small fry around here, too!"
10058040-107 = "All units, listen up. Deflection 2745, elevation 550, for traffic control, propellant charge 8. #nReport as soon as you're ready!"
10058040-108 = "Deflection 2745, elevation 550, for traffic control, propellant charge 8—"
10058040-109 = "Mini-Patrol 3 here, ready to fire."
10058040-110 = "Fire!"
10058040-114 = "Ooh—! While all that was happening, Valkyrie Police Academy's #n\"Mini-Patrol 3 Team\" has shelled the fifth and final target! They're currently in 1st place!"
10058040-115 = "Those big sisters haven't moved an inch since the very beginning, though?"
10058040-116 = "[s] \"They've just stayed parked right by the starting line.\""
10058040-117 = "The point is just to hit all the targets and return to the starting line, after all! #nSo they probably figured they'd just resolve it right where they stood!"
10058040-118 = "It might be an extremely cowardly tactic... #nBut since it's not banned by the rules, we'll call it okay!"
10058040-119 = "The fact that they're technically following the rules is so very police-like! Ahaha!"
10058040-120 = "If the Valkyrie team crosses the finish line like this, the race is over! #nIf you're dying to know the heart-pounding results!?"
10058040-121 = "Keep that dial right where it is!"
10058040-123 = "To just shoot all the targets right from the starting point and call it a day—"
10058040-124 = "Not bad, Vice Director."
10058040-127 = "No way we're missing lunchtime!"
10058040-128 = "Besides, my horoscope today said, \"Don't waste too much time.\""
10058040-129 = "So if we knock this out real quick like this, bad luck will just blow right past us! Ahahaha!!"
10058040-130 = "Let's win this in a flash and go grab some tonkotsu ramen!"
10058040-131 = "Ugh... It's not a rule violation, but somehow I feel a little guilty..."
10058040-132 = "We're doing it strictly by the book, so of course it's fine! #nNow come on, let's get a move o—"
10058040-133 = "Hae?"
10058040-136 = "There's no one else left, right?!"
10058040-137 = "We should be totally fine by now! Anna, you worry too much~!"
10058040-139 = "Eh?"
10058040-140 = "Huh?"
10058040-143 = "Waaaah!!?"
10058040-144 = "Lana!! Reverse!! Reverse at full speed!!!!"
10058040-145 = "What are you spacing out for!! Shoot already!!"
10058040-146 = "Vice Director! We're completely out of ammo!"
10058040-147 = "Kirino! Hit the gas, hurry!!"
10058040-148 = "Still, that tank is insane! #nOn public roads, just the tuning parts alone would get you sent to the Correction Bureau!?"
10058040-150 = "What is with that ridiculously huge tank?!"
10058040-151 = "Was *that* the thing that just trashed the bottom of the hill?!"
10058040-152 = "What are you doing, Lana!! We have to run away, fast!!"
10058040-153 = "Even though it's a sleeping bear?"
10058040-154 = "Eh? A bear?"
10058040-155 = "Huh. It's not shooting at us, and it's not moving either."
10058040-156 = "Eh...?"
10058040-158 = "Let's go, let's goooo!!!"
10058040-159 = "Understood!!!"
10058040-160 = "Seatbelts, check!!"
10058040-161 = "Right, seatbelts..."
10058040-162 = "Eh!?"
10058040-163 = "Start the engine while pressing the brake!! #nGear, check! Rearview mirrors adjusted, check!!"
10058040-164 = "What on earth are you doingぉ!?!?!"
10058040-165 = "Pre-departure inspection!"
10058040-166 = "Where were we?! Ah, that's right! Turn signal, check!!"
10058040-167 = "This isn't a driving lesson, dammit!!!!!n"
10058040-170 = "Gwaaaaah!!!!"
10058040-173 = "Haaah... hah..."
10058040-174 = "Hah... hah..."
10058040-175 = "Oh, first blood."
10058040-176 = "Did we... take it down? With our own hands...?"
10058040-177 = "A-Ahaha... My hands are shaking..."
10058040-178 = "Yep."
10058040-179 = "Thrilling."
10058040-180 = "Lana, how can you be so calm?!"
10058040-181 = "This is no time to be saying things like that!! If we just sit here, we're gonna get got!!"
10058040-182 = "Let's go~"
10058040-191 = "Vice Director, are you alright!?"
10058040-192 = "I guess horoscopes really do come true after all..."
10058040-193 = "Kieeeh...!"
