[translation]
90000140-1 = "Эпизод 15;Ледниковое Море 1"
90000140-4 = "[ns] «Наконец-то добрались...»"
90000140-5 = ""
90000140-7 = ""
90000140-8 = "Да. Мы прибыли."
90000140-9 = "Здесь не так холодно, как рассказывают. По крайней мере, нет ветра, который мешал бы двигаться."
90000140-10 = "Да кого волнует движение?! Здесь зверски холодно. Мороз. Стужа. Я буквально чувствую, как кровь медленнее течёт по венам."
90000140-11 = "[s] «Ты же оделась по погоде, Химари.»"
90000140-12 = "Разумеется. Я обязана беречь этот хрупкий, но невероятно умный мозг. А такой холод — заклятый враг гения вроде меня."
90000140-13 = "На мне два утеплённых костюма, чтобы холод даже близко не подобрался к моей нежной безупречной коже. Немного громоздко и неудобно, зато я хотя бы не похожа на то чудище вон там..."
90000140-14 = "Да, прямо там."
90000140-15 = ""
90000140-17 = ""
90000140-19 = ""
90000140-20 = "Моё тело кажется таким лёгким. Это из-за прохладного воздуха?"
90000140-21 = ""
90000140-23 = ""
90000140-24 = ""
90000140-25 = ""
90000140-26 = ""
90000140-27 = ""
90000140-28 = ""
90000140-29 = ""
90000140-30 = "Да. Моё состояние превосходное. Это хорошо."
90000140-31 = "Эйми. Полагаю, другого способа поднять эту тему, кроме как сказать прямо, нет. За всё путешествие у тебя хотя бы раз случался момент саморефлексии? Ты хоть немного задумывалась о своих жизненных решениях?"
90000140-32 = "Хм? Что? Я что-то сделала?"
90000140-33 = ""
90000140-35 = ""
90000140-37 = ""
90000140-38 = ""
90000140-39 = ""
90000140-40 = ""
90000140-41 = "...Мой наряд?"
90000140-42 = "Да. Я очень старалась над ним. Вообще-то, Сенсей мне помог."
90000140-43 = "Сенсей...?"
90000140-44 = "Сенсей?"
90000140-45 = "[s1] «Не спрашивайте... Долгая история...»\n[s2] «Я правда пытался...»"
90000140-48 = "...Понятно. Раз моей коллеге весело, то у меня нет возражений."
90000140-49 = "Более того, Эйми редко проявляет такие радостные и положительные эмоции. Молодец, Эйми."
90000140-50 = "Ты так легко всё принимаешь... Похоже, здесь я бессильна."
90000140-51 = "*вздох* Давайте поскорее закончим и вернёмся в Миллениум."
90000140-52 = "Итак, псевдосигнал Декаграмматона исходил примерно отсюда. Нужно выяснить, находится ли здесь новый пророк или иное существо, либо это была всего лишь ложная приманка."
90000140-53 = "Вы двое начнёте прочёсывать район, а мы с Сенсеем обустроим базу в безопасном месте."
90000140-54 = "Поняла."
90000140-55 = "Да, мэм."
