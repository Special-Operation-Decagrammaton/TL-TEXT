[translation]
1601205-1 = "Поделись теплом"
1601205-2 = "Исполнительный офис Шале"
1601205-3 = "Прошу прощения за бесцеремонное вторжение."
1601205-4 = "[s] «Старшеклассницы такие страшные...»"
1601205-5 = "Чего ты боишься?! Здесь только ты и я, Сенсей!"
1601205-6 = "В любом случае, нельзя вот так упускать остаток праздников."
1601205-7 = "Ну что, Сенсей, есть хорошие идеи?"
1601205-8 = "[s1] «Раз уж ты здесь... Может, перекусим?»\n[s2] «Почему бы не завершить праздники хорошим ужином?»"
1601205-11 = "Ты думаешь, я круглые сутки мечтаю только о еде?!"
1601205-12 = "[s] «А разве нет?!»"
1601205-13 = "Умереть захотел?!"
1601205-14 = "[s] «Старшеклассницы такие страшные...»"
1601205-15 = ""
1601205-22 = "Мы пришли без всякого плана..."
1601205-23 = "Ого, рождественская ёлка всё ещё здесь."
1601205-24 = "[s] «Убирать её — та ещё морока.»"
1601205-25 = ""
1601205-26 = "Понимаю. Наверное, убирать после праздника даже тяжелее, чем всё устанавливать."
1601205-27 = "К тому же Рождество и Новый год идут почти подряд."
1601205-28 = "Что? У тебя однажды ёлка простояла до весны?"
1601205-29 = "...Не думаю, что это то же самое. Ты просто ленился."
1601205-30 = ""
1601205-32 = ""
1601205-33 = "Снег со вчерашнего вечера тоже ещё не растаял..."
1601205-34 = "Когда я вижу свежий снег, мне хочется оставить на нём следы. У тебя бывает такое?"
1601205-35 = "Что? Хочешь сделать снежного ангела?"
1601205-36 = "Как по-детски... Что? Когда я стану взрослой, мне тоже захочется побыть ребёнком?"
1601205-37 = "Иногда ты вообще говоришь без всякого смысла. *вздыхает*"
1601205-38 = ""
1601205-43 = ""
1601205-44 = ""
1601205-45 = ""
1601205-47 = ""
1601205-48 = ""
1601205-51 = ""
1601205-52 = ""
1601205-53 = ""
1601205-54 = ""
1601205-55 = ""
1601205-60 = ""
1601205-62 = ""
1601205-63 = ""
1601205-64 = ""
1601205-65 = ""
1601205-73 = "Как же здесь людно... Они все пришли по той же причине?"
1601205-74 = "Любопытно. Видимо, всем хочется напоследок насладиться праздничным настроением."
1601205-75 = "Думаешь, прощаться с уходящим годом немного грустно?"
1601205-76 = "Да... понимаю. Новый год и правда самый философски сложный праздник."
1601205-77 = "*ур-р-рч*"
1601205-78 = "Урчание в животе Джунко сотрясло сами небесные столпы."
1601205-79 = "..."
1601205-80 = "[s] «...»"
1601205-81 = "..."
1601205-82 = "[s] «...»"
1601205-83 = "Э-это урчание было не от голода!"
1601205-84 = "Не от голода! Это было урчание от... счастья? Да, от счастья! И попробуй не поверить!"
1601205-85 = "[s3] «Твоё урчание было честнее твоих слов.»\n[s4] «...Счастья от еды, на которую ты всё это время смотрела?»"
1601205-88 = "З-заткниииись!"
1601205-89 = ""
1601205-96 = "Она меня ударила."
1601205-97 = "Мне показалось, это было несправедливо... Но свои слова я бы всё равно не взял назад."
1601205-99 = "[ns] «На, съешь это.»"
1601205-100 = "Что это? Осируко?"
1601205-101 = "Отлично. Для него сейчас как раз сезон."
1601205-102 = "Спасибо, Сенсей."
1601205-105 = "― Вот, Сенсей. Я дам тебе немного.[wa:720]"
1601205-108 = "― П-почему ты так удивляешься?![wa:10]"
1601205-110 = "― П-просто для меня одной этого слишком много![wa:110]"
1601205-113 = "― Это...[wa:1080]"
1601205-115 = "― Ты купил это для меня..."
1601205-118 = "― И весь день был рядом со мной...[wa:10]"
1601205-121 = "― (Если подумать, я весь день провела с Сенсеем...)[wa:650]"
1601205-123 = "― (Ч-что я вообще думаю?!)[wa:1460]"
1601205-126 = "― Ой, да ладно! Я просто хочу поделиться с тобой![wa:10]"
1601205-128 = "― Ладно?![wa:420]"
1601205-131 = "*вздыхает* ...Как же это выматывает."
1601205-132 = "Что? Ты тоже устал?"
1601205-133 = "Но ты взрослый. Тебе нужно вести себя взрослее."
1601205-134 = "Уже поздно... а люди всё ещё здесь."
1601205-135 = "Мы ведь тоже всё ещё здесь? Ну да, но мы-то не какие-то там другие люди..."
1601205-136 = "[s] «Я рад встретить новый год вместе с тобой.»"
1601205-137 = "Ч-что? С чего это вдруг?"
1601205-138 = "Н-не то чтобы мне это не нравилось..."
1601205-139 = "Ух... Ну, наверное, для нынешнего настроения и момента это вполне уместно, так что..."
1601205-140 = ""
1601205-142 = ""
1601205-143 = "Я тоже буду рада провести с тобой ещё один год, Сенсей."
