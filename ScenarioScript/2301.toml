[translation]
2301-1 = "Собрание Фестивального отдела!"
2301-2 = "(Неторопливый праздничный день. Члены Отдела организации фестивалей собрались в уголке Момоёдо.)"
2301-3 = "Доска — есть. Маркер — есть. Ага, всё готово!"
2301-4 = "Как будешь готова, Пина."
2301-5 = "Поняла!"
2301-6 = "Теперь, когда президент дала добро, начинаем!"
2301-7 = ""
2301-8 = ""
2301-10 = "Объявляю собрание Отдела организации фестивалей открытым! Хия!"
2301-11 = ""
2301-12 = "Хммм..."
2301-13 = "Не могу не задуматься... Нам правда каждый раз нужно начинать собрания именно так?"
2301-14 = "Да! Правильная процедура обязательна, президент!"
2301-15 = "Регулярное собрание Фестивального отдела — важный и деликатный ритуал!"
2301-16 = "Поэтому важно, чтобы каждая из нас выкладывалась по полной!"
2301-17 = "Если ты так говоришь, Пина."
2301-18 = "В любом случае, к делу. Причина, по которой мы сегодня собрались, проста..."
2301-19 = "В следующем месяце торговый район Crowcawcaw проведёт фестиваль."
2301-20 = "Поскольку нам, Фестивальному отделу, поручили стать организаторами этого фестиваля, мы должны выложиться по полной!"
2301-21 = "К сожалению... Умики сейчас с нами нет. Она проводит выездное исследование фестиваля в Геенна."
2301-22 = "Остались только ты и я, Пина. Если объединим усилия, должны справиться."
2301-23 = "Поняла!"
2301-24 = "Переходим к делу. Есть идеи, которые помогут сделать фестиваль настоящим хитом?"
2301-25 = "Я готова выслушать любые предложения. Даже маленькая идея может запустить всё с места."
2301-26 = "Хм..."
2301-27 = ""
2301-29 = "О! Я! Я! Я! У меня есть! Есть хорошая идея!"
2301-30 = "*зевает*"
2301-31 = "О боже..."
2301-32 = ""
2301-33 = "А, ха!"
2301-34 = "Я пыталась тебя игнорировать! Перестань мешать!"
2301-35 = "И вообще, почему здесь члены Клуба внутренней дисциплины? Кто позволил посторонним присутствовать?!"
2301-36 = "Момоёдо сегодня тоже выходной?!"
2301-37 = "*зевает* Ну, давай объясню, что произошло..."
2301-38 = "Клуб внутренней дисциплины собирался на пикник, поэтому мы зашли купить закусок..."
2301-39 = "Но мы не знали, что Момоёдо сегодня отдыхает. Прости, Шизуко."
2301-40 = "Я увидела их грустные лица у главных ворот и не смогла не пригласить их, президент!"
2301-41 = "Пина?!"
2301-42 = "Надо помогать тем, кто в беде!"
2301-43 = "Вот она, правда! Я победила!"
2301-44 = "Ну, она права. Я знаю, что права, но..."
2301-45 = "В качестве извинения вот обед, который я приготовила себе. Поедим вместе, Шизуко?"
2301-46 = "Хм? А, спасибо! Ого, на этом рисовом шарике персонаж?"
2301-47 = "Выглядит вкусно! Возьму один..."
2301-48 = "Погодите, что я вообще говорю?!"
2301-49 = "Это же наше регулярное клубное время Фестивального отдела! Посторонним здесь нельзя!"
2301-51 = "Неправда, президент!"
2301-52 = "Пина...?"
2301-53 = "Думаю, идеи для фестиваля стоит брать и у посторонних, а не придумывать всё только самим!"
2301-54 = "Угх..."
2301-55 = "Стоячая вода обязательно начинает вонять!"
2301-56 = "Иными словами, чтобы сделать нашу организацию лучше, нам нужно принимать чужие взгляды!"
2301-57 = "Эта идея идеально показана в «Кулаке Верного Кота»!"
2301-58 = "Ух, я так и знала, что это из твоего дурацкого фильма!"
2301-59 = "Но всё же... *вздох*"
2301-60 = ""
2301-61 = "Ладно, Пина. В твоих словах есть смысл..."
2301-62 = "Иногда свежий взгляд со стороны действительно бывает полезен..."
2301-63 = "Так мы можем даже заметить что-то важное, что раньше упускали."
2301-64 = "Хорошо! Разрешаю!"
2301-65 = "Итак, Клуб внутренней дисциплины, если у вас есть хорошая идея — мы слушаем."
2301-66 = "А? Серьёзно? Нам правда можно?"
2301-67 = "Как ты вообще можешь это спрашивать после всего, что мы только что сказали?!"
2301-68 = "Идея для фестиваля? Эх, мне всё равно, лишь бы поспать... *храпит*"
2301-69 = "Эй! Фестивали не для сна!"
2301-70 = "А ты что скажешь, Каэдэ?"
2301-71 = "Кто, я?"
2301-72 = "Как человек, который каждый день усердно тренируется, чтобы стать настоящей леди..."
2301-73 = "(У неё правда есть что сказать или она просто пришла потусоваться?)"
2301-74 = "...у меня есть взрослый план, который приведёт к нам толпы покупателей!"
2301-75 = "...Погоди! «Взрослый» план? Что ты задумала?"
2301-76 = "О-о, взрослый план! Звучит захватывающе!"
2301-77 = "Уверена, если мы это попробуем, люди сбегутся отовсюду!"
2301-78 = "«Взрослый...» «Сбегутся отовсюду...»"
2301-79 = "Только не говори... Ты собираешься устроить что-то неприличное?!"
2301-81 = "Неприличное?"
2301-82 = "«Неприличное» может означать что-то бесстыдное, Каэдэ..."
2301-83 = "О! Тогда это точно будет бесстыдно!"
2301-84 = "Простите?"
2301-85 = ""
2301-87 = "Нет! Даже ради успешного фестиваля у Фестивального отдела есть правила и этика!"
2301-88 = "Хотя торговый район, который нас нанял, страдает от падения числа посетителей, а многие магазины на грани закрытия..."
2301-89 = "И когда я вспоминаю президента Гильдии торговцев, которая со слезами просила нас помочь..."
2301-90 = "Я правда хочу сделать всё возможное! Но..."
2301-91 = "Что, теперь струсила? Понятно... президент Фестивального отдела всего лишь ребёнок..."
2301-92 = "...Н-Но!"
2301-94 = "Ты что, маленькая? Хватит мяться, выкладывай!"
2301-95 = "Ну, это было бы запретное мероприятие..."
2301-96 = "Специальная распродажа, где мы будем продавать коробки с картами Mushiqueen, популярной коллекционной карточной игры. По одной коробке на человека!"
2301-97 = "Что? «Запретное»? Повтори-ка...?"
2301-98 = "Разве карты Mushiqueen не продаются в очень ограниченном количестве? Обычно не больше двух наборов на человека!"
2301-99 = "Ты собираешься продавать по целой коробке каждому?!"
2301-100 = "Это призовёт легион игроков Mushiqueen со всего Кивотоса!"
2301-101 = "Хм..."
2301-102 = "Верно! А вдобавок проведём специальный турнир по Mushiqueen!"
2301-103 = "Погодите, это может привлечь студентов из других школ... не только из Хяккияко, но и из Геенна, и даже из Тринити!"
2301-104 = "Если так, турнир получится эпического масштаба. Он определит сильнейшего игрока в Mushiqueen во всём Кивотосе!"
2301-106 = "Ого. Вот это будет фестиваль."
2301-107 = "Полный... Хр-р... Хаос..."
2301-109 = "*сглатывает* ...Это может спровоцировать полномасштабную войну между академиями!"
2301-110 = "Без проблем! Я не проиграю!"
2301-111 = "Президент Шизуко! Даже если начнётся война, позвольте мне с ней разобраться!"
2301-112 = ""
2301-113 = ""
2301-114 = ""
2301-115 = ""
2301-116 = ""
2301-117 = "Так, эм, а откуда мы вообще возьмём суперредкие карты...?"
2301-118 = "Неважно, я вообще-то пытаюсь сказать..."
2301-119 = "Собрание по поводу фестиваля... процедура..."
2301-120 = ""
2301-121 = ""
2301-122 = "Угх..."
2301-123 = ""
2301-125 = "Помоги мне, Умика! Когда ты вернёшься?!"
2301-126 = "Собрание Фестивального отдела!"
