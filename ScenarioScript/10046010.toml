[translation]
10046010-1 = "Эпизод 1;Сегодня пятница"
10046010-5 = "А-а-а! Не хочу!"
10046010-6 = "Нетнетнетнетнет!!"
10046010-9 = "Как вы можете? Невозможно! Ни за что!"
10046010-10 = "То, каким «путём» идёт жизнь, решаете не вы. Пожалуйста, перестаньте вести себя как ребёнок."
10046010-11 = "Как я всегда говорю, даже в... тяжёлых ситуациях член Чаепития должен сохранять должное самообладание."
10046010-12 = "И всё же какая третьекурсница закатывает такую истерику? Это совершенно не соответствует вашему положению."
10046010-13 = "Нет, нет! Мы должны были поехать! Мы все договорились! Мы обещали!"
10046010-14 = "И ты думаешь, можно всё отменить из-за... работы?! Без предупреждения? Ты знаешь, как мне это было нужно! Я даже приготовила милый наряд!"
10046010-16 = "Наги, дурочка! Думаешь, ты такая важная! Ненавижу тебя и твой дурацкий стол!"
10046010-17 = ""
10046010-22 = ""
10046010-23 = ""
10046010-24 = "Серьёзно? Столько шума из-за летнего отпуска..."
10046010-25 = "Хорошо. Мика, можешь отправляться в летний отпуск."
10046010-26 = ""
10046010-28 = ""
10046010-29 = "Нет!"
10046010-30 = ""
10046010-32 = ""
10046010-33 = "...Прошу прощения?"
10046010-34 = "Нет! Так неинтересно! Мы должны быть все вместе!"
10046010-35 = "Нужно выполнить обещание. Ты и Сэя тоже едете!"
10046010-36 = "Мика...!"
10046010-37 = ""
10046010-39 = ""
10046010-40 = ""
10046010-41 = "Я не могу просто..."
10046010-42 = "Сэя, Сэя, скажи что-нибудь. Мика хочет, чтобы ты поехала."
10046010-43 = "Хм?"
10046010-44 = "Любопытно. Ты ожидаешь, что я займусь ею? Вразуми её?"
10046010-45 = "Хм... О, Нагиса, ты не справляешься?"
10046010-46 = ""
10046010-48 = ""
10046010-49 = "Если ты отрицаешь мои общие полномочия и зовёшь только тогда, когда я нужна, я отказываюсь вмешиваться."
10046010-50 = "Или, может быть, ты отдашь мне часть своей работы, Нагиса? Я смогу управлять Тринити, пока ТЫ будешь в отпуске."
10046010-52 = "Ц! И ты туда же, Сэя!"
10046010-53 = "..."
10046010-54 = "Вы обе знаете, насколько я нужна этой школе, и притворяетесь, будто не замечаете моих обязанностей?"
10046010-55 = "Получить в ответ такое пренебрежение просто немыслимо!"
10046010-56 = "Хм, словесная манипуляция. Фирменный приём Нагисы."
10046010-57 = "Но ты выбрала не того противника. Видишь ли, всё идёт именно по её плану."
10046010-58 = "Хи-хи-хи!"
10046010-60 = "...Угх...!"
10046010-61 = ""
10046010-66 = ""
10046010-67 = "Ах! Ну и пусть. Вашей невыносимой кампании удалось добиться своего."
10046010-68 = "Я сдаюсь перед вашими детскими капризами!"
10046010-69 = ""
10046010-71 = ""
10046010-73 = ""
10046010-74 = ""
10046010-75 = "Отлично, Мика. Похоже, мы всё-таки едем на пляж."
10046010-76 = "Я правда впечатлена. Возможно, ты единственный человек, способный сломить упрямство Нагисы."
10046010-77 = "...Ты довольна, Мика?"
10046010-78 = ""
10046010-80 = ""
10046010-82 = ""
10046010-83 = "Да! Конечно!"
10046010-84 = "Это же золотая возможность. Мы почти не видимся!"
10046010-85 = "Как можно отказаться от прогулки, когда нас все трое? Полный комплект!"
10046010-86 = "Хи-хи. И на частный пляж! Частный, только для нас!"
10046010-87 = "Нагисы здесь нет, можешь прекратить спектакль. Я не идиотка."
10046010-88 = "Я раскусила твоё нытьё. Просто момент был подходящий, поэтому я позволила этому случиться."
10046010-89 = "Ты ведь сделала это ради Нагисы, правда? Хотя должна признать, я рада, что наконец-то получила хоть какую-то работу."
10046010-90 = ""
10046010-93 = ""
10046010-94 = "..."
10046010-95 = "...Не говори Наги."
10046010-96 = "Конечно, не скажу. В отличие от тебя, я не глупа."
10046010-97 = "Сэя...?"
10046010-98 = "Если позволить ей, Нагиса бы отменила отпуск, чтобы разобраться со своей огромной нагрузкой. Она бы никогда не остановилась."
10046010-99 = "Меня беспокоит, как быстро она вернулась к старым привычкам... Работа её поглощает."
10046010-100 = "Нужно воспользоваться этой возможностью и заставить её отдохнуть."
10046010-101 = "Даже если приходится делать это так... В конце концов, Чаепитие никогда не должно было управляться в одиночку, а объём работы слишком велик для одного человека."
10046010-102 = "...И это уже более фундаментальная проблема."
10046010-103 = "В общем, я пытаюсь сказать и никак не могу нормально выразить... Я благодарна тебе, Мика."
10046010-104 = ""
10046010-107 = ""
10046010-108 = "Ого, благодарность от Сэи? Редкость. Хи-хи."
10046010-109 = "Ну, этот отпуск и для меня тоже, знаешь ли! Как мне ценить роскошь Тринити, если я никогда её не покидаю?"
10046010-110 = "И мне ужасно неловко, когда ты говоришь со мной так, будто я... взрослая."
10046010-111 = "Я не говорила, что ты взрослая. И, кажется, не утверждала, что всё твоё нытьё было притворством."
10046010-112 = "Мы давно друг друга знаем, капризная принцесса."
10046010-113 = "Не можешь просто позволить трогательному моменту случиться? Злюка!"
10046010-114 = "Ха, как твоя незрелость, такова и моя натура. Прошу понять."
10046010-115 = "И я действительно хочу, чтобы мы втроём беззаботно повеселились. Столько времени прошло..."
10046010-116 = "Однако..."
10046010-117 = ""
10046010-119 = ""
10046010-120 = "...А? Что-то не так?"
10046010-121 = "Ну..."
10046010-122 = "Нет, ничего такого. Просто мимолётное беспокойство."
10046010-123 = "Хаха! Сэя, ты слишком много думаешь."
10046010-124 = "Не нужно так усердно всё обдумывать!"
10046010-125 = ""
10046010-127 = ""
10046010-129 = "Что вообще может случиться?"
10046010-130 = ""
10046010-132 = ""
10046010-142 = ""
10046010-143 = ""
10046010-145 = "...Вот так всё и произошло, поэтому нам нужны вы с Сенсеем!"
10046010-146 = "Пожалуйста, помогите Наги расслабиться и не думать о работе!"
10046010-147 = "Я знаю, у тебя, Оперативной группы Правосудия и Сенсея и без того дел по горло... Простите!"
10046010-148 = "Не волнуйся. Видишь ли, Сенсей, поддерживать Чаепитие — часть нашей работы."
10046010-149 = "Что касается Нагисы... Мы тоже за неё переживаем, поэтому благодарны Мике за просьбу."
10046010-150 = "Поэтому от имени Оперативной группы Правосудия я хотела бы официально попросить вас присоединиться к этой операции, Сенсей."
10046010-151 = "[s1] «Конечно. Вы все так о ней заботитесь.»\n[s2] «Звучит как хорошее дело.»"
10046010-154 = "Сенсей..."
10046010-155 = "Я ни секунды в вас не сомневалась."
10046010-156 = "...Девушки, уверена, все эти эмоции смущают Сенсея! Может, будем попроще?"
10046010-157 = "Ты права."
10046010-158 = "Фуфу, я знала, что Цуруги отправила тебя не просто так. И всё же команда у этой операции совсем небольшая."
10046010-159 = "Ну, мы ведь хотим, чтобы всё было непринуждённо и весело, правда?"
10046010-161 = "Именно! Если мы приведём сюда слишком много людей, Наги снова включит «режим управления.»"
10046010-162 = "Она невозможна! Стоит появиться зрителям, как она сразу пытается изображать безупречную, строгую председательницу."
10046010-163 = "Учитывая это, ну... может, Чаепитию стоит справиться с этой «операцией» самостоятельно..."
10046010-165 = "Не уверена. Защищать вас — наш высший приоритет, а этот пляж не выглядит особенно безопасным."
10046010-166 = "Да... но здесь вообще никого нет!"
10046010-167 = "Это частный пляж Чаепития. По-моему, здесь довольно безопасно."
10046010-168 = ""
10046010-170 = ""
10046010-171 = "...Что такое, Сенсей?"
10046010-172 = "Где остальные двое?"
10046010-174 = "Ну, Сэя и Нагиса уже в пути."
10046010-175 = "А мы приехали пораньше как своего рода разведгруппа! Ну, чтобы осмотреть пляж!"
10046010-176 = "...А?"
10046010-177 = "Правда, вот и всё. Нас здесь четверо, потом Сэя и Наги. Всего шестеро!"
10046010-178 = "О? Вы удивлены, почему я тоже приехала раньше?"
10046010-179 = ""
10046010-181 = ""
10046010-182 = "Потому что я составляю расписание!"
10046010-183 = "[s3] «Ты?!»\n[s4] «ЦЕЛОЕ расписание?»"
10046010-186 = "Хи-хи. Чего вы так удивились? Я далеко не впервые беру ситуацию под свой контроль."
10046010-187 = "Планирование отпуска — тоже работа, а я хочу, чтобы Наги была полностью свободна от всего этого."
10046010-188 = "Поэтому все сложные мысли я возьму на себя, чтобы она хоть раз в жизни смогла по-настоящему расслабиться!"
10046010-190 = "Понятно... Очень заботливо, и, скорее всего, это единственный способ заставить её действительно отдохнуть."
10046010-191 = "Но кто тогда займётся повседневными делами Чаепития?"
10046010-192 = "Сэя! А если ей станет слишком тяжело, она обратится к Сенсею. Вдвоём они с чем угодно разберутся!"
10046010-193 = "[s5] «А. Теперь понятно.»\n[s6] «Так вот зачем меня пригласили.»"
10046010-196 = "Хорошо. Но, Мика, я могла бы сама заняться этими делами."
10046010-197 = "Нет-нет! Это было бы нечестно! Оперативная группа Правосудия и так делает слишком много."
10046010-198 = "Так что обязательное время отдыха распространяется и на вас двоих!"
10046010-199 = "Хасуми, Ичика, я хочу, чтобы вы считали себя не телохранителями, а гостями! Это весёлая девичья пляжная вечеринка!"
10046010-200 = "А если что-нибудь случится, не скрывайте. Скажите мне! Я отвечаю за этот отпуск!"
10046010-201 = ""
10046010-203 = ""
10046010-205 = ""
10046010-206 = "Мика..."
10046010-207 = "...Это очень заботливо."
10046010-208 = "Но раз уж мы здесь, можно хотя бы установить периметр... одновременно наслаждаясь «весёлым девичьим пляжным» временем."
10046010-210 = "Да-да! Вот теперь вы поняли!"
10046010-211 = "Хотя мы не можем полностью забыть об обязанностях, ты права. Мы всё-таки уже ЗДЕСЬ."
10046010-212 = "И раз уж ты настаиваешь, мы позволим себе небольшой, ответственный отпуск!"
10046010-213 = "Да! Именно! Вот это настрой!"
10046010-214 = "Так, посмотрим. Чем же заняться нашей «разведгруппе»...?"
10046010-216 = "Для начала стоит осмотреть территорию. На первый взгляд это тихий пустой пляж..."
10046010-217 = "...но лучше всегда быть готовыми. Проверим объекты и изучим местность на предмет возможных опасностей."
10046010-219 = "А, вы уже знаете, что делать!"
10046010-220 = "Нас этому учили."
10046010-221 = "Пляж большой, может, разделимся? Я начну с того края. Эм... Совсем одна!"
10046010-222 = "Увидимся! Пока!"
10046010-223 = ""
10046010-225 = ""
10046010-226 = "Тогда я начну вон оттуда!"
10046010-227 = ""
10046010-229 = ""
10046010-231 = "...Как я и думала. Вы тоже это заметили, Сенсей?"
10046010-232 = "[s7] «Ты про Ичику?»\n[s8] «Кто-то выглядит нервно...»"
10046010-235 = "Ха, как всегда проницательно. Ичика — очень перспективный член Оперативной группы Правосудия."
10046010-236 = "На самом деле она побывала на стольких заданиях, что так и не успела... как следует познакомиться с уникальными особенностями Чаепития."
10046010-237 = "Хотя она делает вид, что всё нормально, мне кажется, она немного робеет."
10046010-238 = "Она так старается это скрыть, сохранять свою обычную дипломатичность..."
10046010-239 = "...Пожалуйста, присмотрите за ней, Сенсей."
10046010-240 = "[s] «Конечно, не волнуйся.»"
10046010-241 = "Хи-хи. Спасибо. Тогда, Сенсей... Почему бы вам не отдохнуть, пока я начну осматривать эти помещения?"
10046010-242 = ""
10046010-244 = ""
10046010-245 = "О? Хотите пойти со мной?"
10046010-246 = "Спасибо. Я как раз надеялась, что вы составите мне компанию."
10046010-247 = ""
10046010-249 = ""
10046010-250 = "Здесь не так много всего, так что это не займёт много времени. Сюда..."
10046010-257 = "Это душевая. После веселья мы здесь смоемся и переоденемся."
10046010-258 = "Чисто. Смотритель проверяет её каждый месяц. Нужно лишь убедиться, что вода работает..."
10046010-259 = "Наверняка здесь больше никого нет, кроме..."
10046010-260 = ""
10046010-265 = ""
10046010-266 = "...нас."
10046010-272 = ""
10046010-274 = ""
10046010-275 = ""
10046010-276 = ""
10046010-278 = ""
10046010-279 = ""
10046010-281 = "...?"
10046010-282 = "[s9] «Здесь кто-то есть...?»\n[s10] «О нет, этот силуэт...!»"
10046010-283 = ""
10046010-284 = ""
10046010-286 = ""
10046010-287 = "...?"
10046010-288 = ""
