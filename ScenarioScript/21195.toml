[translation]
21195-3 = "Коридор старого здания Миллениум"
21195-4 = "...*тяжело дышит*...*тяжело дышит*"
21195-5 = "Фух, еле ушли!"
21195-6 = "Но что теперь делать?"
21195-7 = "Ну, игру на Миллениум Prize мы уже отправили."
21195-8 = "Остаётся только бегать от них, пока не объявят результаты!"
21195-9 = "Не думаю."
21195-10 = "А?!"
21195-11 = ""
21195-12 = "*тра-та-та-та*"
21195-13 = "А-а-а!"
21195-14 = "Мидори!"
21195-15 = ""
21195-16 = ""
21195-18 = "..."
21195-19 = "Ах."
21195-20 = "Я так и думала."
21195-21 = "Значит, тот, кто привёл этих цыплят напасть на склад контрабанды..."
21195-22 = "...это ты, да?"
21195-23 = "Мне тоже называть тебя «Сенсей»?"
21195-24 = "Похоже, расследование Аканэ не было преувеличением."
21195-25 = "[s1] «Зачем ты здесь? Ради мести?»\n[s2] «Ты ведь понимаешь, что сама довольно маленькая?»"
21195-26 = "Ха! Ради такой фигни я бы сюда не пришла."
21195-27 = "Хотя... Эй, ты. Вон та."
21195-28 = "Не думай, что я забыла, как ты меня тогда обманула."
21195-29 = "И-и...! П-Прости!"
21195-30 = "Ты меня тогда здорово провела."
21195-31 = "А?"
21195-32 = "Сыграла идеально. Я реально поверила, что ты дрожишь от страха."
21195-33 = "(Н-Но я правда дрожала...)"
21195-34 = "Ладно, ты. Да, ты, с этой огромной пушкой..."
21195-35 = "Что?! Я на третьем курсе! Ещё раз назовёшь меня «маленькой» — лицо тебе проломлю!"
21195-36 = "Держи себя в руках, Нэру."
21195-37 = "Вау, кто-то и правда осмелился назвать Нэру маленькой прямо в лицо."
21195-38 = "Гр-р... *вздох*"
21195-39 = "Я ВОТ НАСТОЛЬКО была близка к тому, чтобы сорваться, но уже нормально. Так вот, ты там, с огромной пушкой..."
21195-41 = "*озирается по сторонам*"
21195-42 = "Да, ты!"
21195-43 = "Что со мной?"
21195-44 = "Ты не такая, как остальные."
21195-45 = "Ты стреляла прямо в C&C!"
21195-46 = "Мне нужно, чтобы ты кое-что услышала."
21195-48 = "О, я знаю эту ситуацию."
21195-49 = "Следующая реплика: «Я никогда раньше такого не чувствовала.»"
21195-50 = "Это признание. Маленькая горничная признаётся мне."
21195-51 = "Какого хрена ты несёшь?! И кого ты назвала маленькой?! Сдохнуть захотела, ты...!"
21195-52 = "Э-э-э..."
21195-53 = "М-Мы покойницы!"
21195-55 = "*вздыхает*"
21195-56 = "Вы меня доконаете. Давайте сразу к делу..."
21195-57 = "Я здесь не ради мести за то, что вы на нас напали."
21195-58 = "Да, я немного зла, но вы победили нас честно."
21195-59 = "Так что я готова это забыть. Но... вы привлекли моё внимание."
21195-60 = "Что ты имеешь в виду?"
21195-61 = "Есть кое-что, что я хочу увидеть сама."
21195-62 = "Так что давай драться."
21195-63 = "Если победишь — я ухожу, и на этом всё."
21195-64 = "Намного лучше какого-то расследования, не думаешь?"
21195-65 = "..."
21195-66 = "Хорошо."
21195-67 = "В твоих глазах огонь. Мне нравится."
21195-68 = "Значит, событие на арене? Поняла."
21195-69 = "Что теперь? Арена...?"
21195-70 = "В прошлый раз мои стратегии были ограничены из-за Mirror и тесного пространства."
21195-71 = "Однако..."
21195-72 = "...в этот раз мой MP полностью заряжен!"
21195-74 = "Это...!"
21195-75 = "Слепящий Свет!"
21195-77 = "*БУ-У-УМ*"
21195-79 = "Аргх!"
21195-80 = "Ого!"
21195-81 = "Это было потрясающе!"
21195-82 = "Стену полностью снесло!"
21195-83 = ""
21195-85 = "Это было потрясающе, Арис."
21195-86 = "Да, я такого ещё не видела."
21195-87 = "Я попала?"
21195-88 = "А-Арис! Нельзя произносить эту фразу!"
21195-89 = "А, точно. В таких ситуациях нужна более изящная и утончённая формулировка."
21195-90 = "Пала ли прекрасная дева в бою?"
21195-91 = "Н-Не совсем это я имела в виду..."
21195-92 = ""
21195-93 = ""
21195-95 = "[ns] «Ещё нет.»"
21195-96 = ""
21195-97 = "*тра-та-та-та*"
21195-98 = "Ах!"
21195-99 = ""
21195-100 = ""
21195-101 = "Да, атака необычная..."
21195-102 = "Но это всё, что ты умеешь?"
21195-104 = "П-Перезаряжаю MP!"
21195-106 = "Слишком медленно."
21195-107 = "О, н—"
21195-108 = "* бум*"
21195-109 = "Аргх!"
21195-111 = "Твоё оружие мощное, но между нажатием на спуск и попаданием в цель проходит слишком много времени."
21195-112 = "Из-за этой задержки на определённой дистанции оружие бесполезно."
21195-113 = "Потому что тебя саму заденет взрывом."
21195-114 = "И я скажу тебе, сколько людей в Кивотосе способны победить меня в ближнем бою."
21195-115 = "Ни одного."
21195-116 = "Ой-ой..."
21195-117 = "Алиса!"
21195-120 = "Какое разочарование. Не верится, что ты умудрилась разгромить моих горничных."
21195-121 = "..."
21195-122 = "*вжух*"
21195-123 = "Чёрт!"
21195-124 = "О-Она только что махнула рейлганом как битой?!"
21195-125 = "Хех. Для ближнего боя идея неплохая."
21195-126 = ""
21195-128 = "Но на этой дистанции преимущество всё ещё у меня."
21195-129 = "Даже если выстрелишь, прицелиться в меня не сможешь."
21195-130 = "Тогда я не буду целиться."
21195-131 = "Поехали!"
21195-132 = "Я же сказала, это бессмысленно... А?"
21195-134 = "Ч-Чего?! Ты стреляешь? Но на таком расстоянии...!"
21195-135 = "Ты даже не целишься в меня! Попадёшь в пол!"
21195-136 = "Ты психованная? Тебя же саму накроет взрывом!"
21195-137 = "Ослепляющий свет!!"
21195-139 = "*БУМ*"
21195-141 = "Арис! *кашляет* Дым!"
21195-142 = "Пол полностью обрушился... Вот ты где, Арис!"
21195-143 = "Физические повреждения достигли 48%. Нужно отступать!"
21195-145 = "[s] «Залезай мне на спину.»"
21195-146 = "Быстрее, Сенсей!"
21195-147 = "(торопливо убегает)"
21195-149 = "Президент!"
21195-150 = "Как думаете, с ней всё нормально? Её могло завалить обломками?"
21195-151 = "Я видела, как Арис выбралась, и выглядела она ужасно. Наша маленькая Нэру, наверное, уже лепёшка..."
21195-153 = "Кого ты назвала «маленькой»?!"
21195-155 = "Ой."
21195-156 = "Ого, вот это наша президент! Её какими-то обломками не возьмёшь!"
21195-157 = "Вы вообще на чьей стороне?!"
21195-158 = "В любом случае Арис больше не в состоянии сражаться. Скорее всего, она направляется в медпункт. Преследовать?"
21195-159 = "Хм. В Миллениум всего несколько медпунктов, так что найти её будет нетрудно."
21195-160 = ""
21195-162 = "..."
21195-163 = "..."
21195-164 = "Нэру?"
21195-165 = "Угх..."
21195-166 = "Всё нормально. Преследовать не надо. Отходим."
21195-167 = "После того как я тут всё разнесла, мне уже гораздо лучше."
21195-168 = "..."
21195-169 = "Ну, миссия выполнена, наверное. Хех. Теперь понимаю, почему Рио так заинтересована в Отделе разработки игр."
21195-170 = "И тот человек с ними..."
21195-171 = "Ты переживаешь за Сенсея, да?"
21195-172 = "П-Подожди! Всё совсем не так!"
21195-173 = "Понимаю. Хотя я тоже немного беспокоюсь."
21195-174 = "Учитывая, что их группа целиком состоит из маленьких девочек, интересно, Сенсей..."
21195-175 = "Рада за тебя, Нэру."
21195-176 = "ЗАТКНИСЬ! Ещё слово — и эти стволы будут смотреть тебе прямо в лицо."
21195-177 = "Хмф..."
21195-178 = ""
21195-179 = ""
21195-180 = "Сенсей... и Отдел разработки игр."
21195-181 = ""
21195-182 = ""
21195-183 = ""
21195-184 = "Хм-м."
21195-185 = "Пусть только попробуют расслабиться. Я заставлю их заплатить за то, что назвали меня маленькой."
21195-187 = "Ладно, я умираю с голоду. Пойдём за раменом."
21195-189 = "Хорошо!"
21195-190 = "Отличная идея!"
21195-191 = "О? Значит, скачок роста у тебя всё-таки случился..."
21195-194 = "Я сказала заткнись!"
21195-196 = "Следующий эпизод;Миллениум Prize"
