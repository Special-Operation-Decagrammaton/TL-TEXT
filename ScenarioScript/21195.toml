[translation]
21195-3 = "Millennium - Corredor do Prédio Antigo"
21195-4 = "Arf, arf..."
21195-5 = "C-Conseguimos despistar?"
21195-6 = "O-O que vamos fazer agora...?"
21195-7 = "Já terminamos de inscrever o jogo no Prêmio Millennium, então..."
21195-8 = "Por enquanto, vamos continuar fugindo até sair o resultado!"
21195-9 = "Acharam mesmo que iam conseguir escapar?"
21195-10 = "!?"
21195-12 = "(Ta-ta-ta-ta!)"
21195-13 = "Kyaa!"
21195-14 = "Midori!"
21195-18 = "..."
21195-19 = "Entendi."
21195-20 = "Por isso as decisões de vocês estavam afiadas demais."
21195-21 = "Quem comandou essas nanicas agora há pouco, e também na invasão ao depósito de itens confiscados da Millennium..."
21195-22 = "Foi você, né?"
21195-23 = "Devo te chamar de... Sensei?"
21195-24 = "O tal \"Sensei\" que a Akane investigou... Parece que os boatos não eram exagero..."
21195-25 = "[s1] \"O que você quer? Uma revanche?\"\n[s2] \"Nanicas? Mas você tem praticamente a mesma altura delas...\""
21195-26 = "Hah! Como se eu fosse vir até aqui por um motivo idiota desses."
21195-27 = "Se bem que, primeiro... você aí, a testuda."
21195-28 = "Teve muita coragem de me enganar naquele dia, hein...?"
21195-29 = "Hii...! M-Me desculpa!"
21195-30 = "Mandou bem, vou até te dar os parabéns."
21195-31 = "...Hã?"
21195-32 = "Fingir que tava morrendo de medo e tremendo inteira só para me passar a perna. Que atuação de primeira."
21195-33 = "(Acho que o medo não era atuação não... provavelmente)"
21195-34 = "Bom, deixando isso de lado... você aí com essa arma absurdamente gigante."
21195-35 = "NÃO TENHO NÃO! Eu sou do 3º ano, tá ouvindo?! Quer saber o que aconteceu com os idiotas que falaram da minha altura?!"
21195-36 = "...Calma, Líder."
21195-37 = "Chega a ser revigorante, de certa forma. Quem diria que ainda existe alguém com coragem de falar da altura da Neru-senpai."
21195-38 = "Ufa, ufa..."
21195-39 = "Quase perdi a cabeça... Enfim, isso não importa. Ei, você aí com essa arma exageradamente gigante."
21195-41 = "(Olha para os lados)"
21195-42 = "É com você mesmo, ô!"
21195-43 = "Está falando da Aris?"
21195-44 = "Isso, é com você que eu tenho assunto."
21195-45 = "Ouvi dizer que você deu um belo prejuízo na C&C, hein...?"
21195-46 = "Vem cá trocar uma ideia comigo."
21195-48 = "A-Aris conhece esse padrão!"
21195-49 = "\"Você foi a primeira pessoa a fazer algo assim comigo...\""
21195-50 = "É um evento de confissão! A Senhorita Maid Baixinha se apaixonou pela Aris. CG desbloqueada."
21195-51 = "C-Cala a boca, sua maluca! Aliás, quem é \"Senhorita Maid Baixinha\"?! Quer morrer?!"
21195-52 = "Hii...!"
21195-53 = "Q-Que medo!!"
21195-55 = "Argh..."
21195-56 = "Você sabe mesmo como me tirar do sério, mas deixa pra lá."
21195-57 = "Só para não ter mal-entendido: eu não vim me vingar porque você aprontou contra a C&C."
21195-58 = "Tinha uns pontos suspeitos no meio, mas da nossa parte era um serviço legítimo. E vocês só cumpriram o objetivo de vocês contra a gente."
21195-59 = "Não guardo rancor por isso... mas confesso que fiquei bem interessada."
21195-60 = "Interessada...?"
21195-61 = "Talvez \"confirmar\" seja a palavra certa..."
21195-62 = "Anda, vamos trocar uns tiros."
21195-63 = "Se você lutar comigo e vencer, eu vou embora na boa agora mesmo."
21195-64 = "É o jeito mais rápido de a gente se entender. E aí, simples assim, né?"
21195-65 = "..."
21195-66 = "Entendido."
21195-67 = "Opa, tá cheia de disposição, hein."
21195-68 = "É tipo uma batalha de evento um contra um... Entendi perfeitamente."
21195-69 = "Even... o quê?"
21195-70 = "Naquela vez o lugar era apertado e eu tinha a missão de levar o \"Espelho\" de volta, mas..."
21195-71 = "Agora...!"
21195-72 = "Lá vou eu! Energia mágica em 100%...!"
21195-74 = "Tsc, isso é...!"
21195-75 = "Luz!!"
21195-77 = "KABUUUUM!!"
21195-79 = "Guh!"
21195-80 = "Uau!"
21195-81 = "Que poder destrutivo...!"
21195-82 = "A ponto de pulverizar a parede do prédio com tanta facilidade...!"
21195-85 = "I-Incrível..."
21195-86 = "Nunca vi um poder de fogo desses..."
21195-87 = "...Eu consegui?"
21195-88 = "Aris-chan! Não fala essa frase assim sem pensar!"
21195-89 = "Ah, a Neru-senpai é do 3º ano. Vou reformular."
21195-90 = "S-Será que a derrotei...?"
21195-91 = "Não, o problema não é a formalidade...!"
21195-95 = "[ns] \"Ainda não.\""
21195-97 = "(Ta-ta-ta-ta!)"
21195-98 = "Uah?!"
21195-101 = "Realmente, não é um poder de fogo qualquer..."
21195-102 = "Mas é só isso."
21195-104 = "V-Vou carregar a energia mágica de novo...!"
21195-106 = "Lenta demais."
21195-107 = "Ah...!"
21195-108 = "(Pá!)"
21195-109 = "Kyaa!"
21195-111 = "Essa tua arma é forte mesmo. Só que depois de puxar o gatilho, leva pelo menos alguns décimos de segundo para disparar."
21195-112 = "E ainda por cima, por causa desse poder absurdo, se o inimigo chegar perto demais, você não pode atirar."
21195-113 = "Porque você mesma seria pega pela onda de choque."
21195-114 = "E nessa distância, em toda Kivotos, quase ninguém consegue me vencer..."
21195-115 = "...Não, ninguém consegue."
21195-116 = "Ugh..."
21195-117 = "Aris!"
21195-120 = "Mais decepcionante do que eu pensava. Que elas tenham perdido para alguém nesse nível..."
21195-121 = "..."
21195-122 = "(Vuuush!)"
21195-123 = "Guh!"
21195-124 = "Ela girou o cano da arma como porrete...?!"
21195-125 = "Hah, nada mal como reação para combate corpo a corpo... mas né."
21195-128 = "Nessa distância, a vantagem ainda é esmagadoramente minha."
21195-129 = "Mesmo que você tente atirar, não vai conseguir mirar em mim."
21195-130 = "...Não preciso mirar."
21195-131 = "Lá vai!"
21195-132 = "Já disse que é impossível... Hã?"
21195-134 = "Preparando o disparo nessa situação...? Ei, espera aí, você não vai...?!"
21195-135 = "Não é em mim... é no chão?!"
21195-136 = "Tá maluca?! Se atirar desse jeito, você também vai...!"
21195-137 = "Luz!!"
21195-139 = "(KABUUUM!)"
21195-141 = "Aris-chan! Cof, a fumaça não deixa ver nada...!"
21195-142 = "O chão quase desabou inteiro... Achei você, Aris!"
21195-143 = "D-Dano físico em 48%... Solicitando recuo!"
21195-145 = "[s] \"Eu te carrego nas costas.\""
21195-146 = "Por favor, depressa!"
21195-147 = "(Passos apressados...)"
21195-149 = "Líder!"
21195-150 = "V-Você está bem? Não me diga que foi atingida pelos escombros..."
21195-151 = "Eu vi a Aris-chan por um segundo e ela tava bem machucada. A essa altura, nossa Líder pequenininha já deve ter virado panqueca..."
21195-153 = "...Quem é que é pequenininha?!"
21195-155 = "Ops."
21195-156 = "Uau, essa é a nossa Líder! Tá inteirinha!"
21195-157 = "De que lado você tá, afinal...?!"
21195-158 = "A Aris está sem condições de lutar agora. Vamos atrás delas? Ela ficou bem ferida, deve estar indo para a enfermaria."
21195-159 = "Sim. Embora a Millennium tenha mais de uma dezena de enfermarias... não deve demorar para encontrá-las."
21195-162 = "..."
21195-163 = "......"
21195-164 = "Líder?"
21195-165 = "...Ah."
21195-166 = "Não, deixa pra lá. Sem perseguição, vamos voltar."
21195-167 = "Depois de quebrar tudo um pouco, já deu para desestressar."
21195-168 = "..."
21195-169 = "No geral, cumpri meu objetivo. Também entendi por que a Rio se interessou pelo Clube de Desenvolvimento de Jogos..."
21195-170 = "E além disso..."
21195-171 = "Já sei! Ficou interessada no Sensei, né?!"
21195-172 = "C-Claro que não! N-Não é nada disso...!"
21195-173 = "Hihi, eu entendo como se sente. Mas fico um pouco preocupada."
21195-174 = "Pelo porte físico daquelas meninas, o tipo do Sensei provavelmente é..."
21195-175 = "Pelo menos para a Líder, isso não é uma má notícia."
21195-176 = "Calem a boca! Se continuarem com essa conversa, eu vou arrebentar vocês!!"
21195-177 = "Argh..."
21195-180 = "Sensei, e o Clube de Desenvolvimento de Jogos, é...?"
21195-184 = "Hah."
21195-185 = "Pode esperar. Ainda vou fazer vocês pagarem por me chamarem de baixinha."
21195-187 = "...Depois de lutar tanto, bateu uma fome. Ei, bora comer um lámen."
21195-189 = "Parece ótimo."
21195-190 = "Eu topo, eu topo!"
21195-191 = "...Pensando bem, a Líder ainda está em fase de crescimento."
21195-194 = "JÁ CHEGAAAA!!"
21195-196 = "Próximo;Millennium Prize"
