[translation]
80000047-1 = "Особый опрос для особенного человека!"
80000047-3 = "О, господин! Добро пожаловать в Момоёдо! Хи-хи!"
80000047-4 = "Вы как раз вовремя!"
80000047-5 = "[s] «Ну, ты ведь сказала, что срочно.»"
80000047-6 = "Потому что срочно! Сегодня же День святого Валентина!"
80000047-7 = "В честь праздника мы добавляем в меню особые лимитированные десерты."
80000047-8 = "Но вот проблема... мы не знаем, какими они должны быть."
80000047-9 = "[s] «Это и есть твоя срочная проблема?!»"
80000047-10 = "Сенсей! Вы недооцениваете День святого Валентина?"
80000047-11 = "Думаете, нашим верным клиентам будет достаточно, если мы просто сунем в меню шоколадный торт?"
80000047-12 = "Постоянные гости, которые любят Момоёдо, и придирчивые ценители десертов будут оценивать каждое наше решение."
80000047-13 = "И-И если им не понравится, они напишут плохой отзыв!"
80000047-14 = "[s] «Только не плохой отзыв!»"
80000047-15 = "Теперь, когда вы понимаете ставки, вот десерт, который я приготовила."
80000047-16 = ""
80000047-18 = ""
80000047-19 = "Сейчас я подам вам целую серию десертов на дегустацию."
80000047-20 = "Пожалуйста, скажите, какие достаточно хороши для особого валентиновского меню."
80000047-21 = "[s] «Хорошо! Положись на меня.»"
80000047-23 = "Я попробовал каждый десерт, чтобы помочь Шизуко."
80000047-25 = "Никогда в жизни я не ел столько вкусных сладостей."
80000047-26 = "Ну и как?"
80000047-27 = "[s1] «Думаю, стоит сделать послаще.»\n[s2] «Может, добавить немного соли?»"
80000047-28 = "Согласна! Записала!"
80000047-29 = "Согласна! Записала!"
80000047-30 = "Теперь какой напиток лучше подойдёт к этому десерту?"
80000047-31 = "[s3] «Зелёный чай отлично подойдёт!»\n[s4] «Это будет хорошо сочетаться с чёрным чаем!»\n[s5] «С колой точно не ошибёшься!»"
80000047-32 = "В-Вы правы!"
80000047-33 = "В-Вы правы!"
80000047-34 = "В-Вы правы!"
80000047-35 = "Отличное предложение, Сенсей!"
80000047-37 = "После часа обсуждения десертов с Шизуко..."
80000047-39 = "Хм, ясно. Лучше не ограничивать выбор напитков, чтобы удовлетворить разные вкусы."
80000047-40 = "Мы слишком сильно держимся за традиционный образ Момоёдо.#nЗападные десерты сделают меню разнообразнее."
80000047-41 = "Этот чуть слаще... А этому не хватает ореховой нотки."
80000047-42 = ""
80000047-44 = ""
80000047-45 = "Ух ты! Вы так помогли, Сенсей! Мы полностью составили меню!"
80000047-46 = ""
80000047-48 = ""
80000047-50 = "[ns] «Рад, что смог помочь.»"
80000047-51 = "Хи-хи. Спасибо, Сенсей!"
80000047-52 = "У Момоёдо будет лучший День святого Валентина!"
80000047-53 = "[s] «Но меня кое-что беспокоит...»"
80000047-54 = "Что такое?"
80000047-55 = "А? Вы думаете, стоит спросить мнение и других людей?#nНе только ваше?"
80000047-56 = "О, но..."
80000047-57 = "Хи-хи! Всё совершенно нормально!"
80000047-58 = ""
80000047-60 = ""
80000047-61 = "Лимитированные десерты Момоёдо ведь все предназначены..."
80000047-62 = "...для одного очень особенного и конкретного человека."
80000047-63 = "[s] «А?»"
80000047-64 = "Хватит болтать! Момоёдо открывается!"
