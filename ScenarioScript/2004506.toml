[translation]
2004506-1 = "Предложение, от которого не отказаться"
2004506-2 = "Я снова присоединился к экскурсии Пины."
2004506-4 = "Дальше вами займётся экскурсовод замка!"
2004506-5 = "Пожалуйста, вернитесь в автобус вовремя! Спасибо!"
2004506-7 = "О... Невероятно!"
2004506-8 = "Я часто сюда прихожу, и даже территория вокруг просто захватывает дух!"
2004506-9 = "Как же хочется позволить себе сходить внутрь..."
2004506-10 = "[s1] («Воспользуюсь возможностью помочь Пине.»)\n[s2] «Извините, хотите занять моё место в экскурсии?»"
2004506-13 = "Правда? Спасибо!"
2004506-14 = "Какая замечательная возможность! Не могу дождаться!"
2004506-16 = "Я вернулся к автобусу, чтобы помочь Пине."
2004506-18 = "Так... зонтики на случай мелкого дождя..."
2004506-19 = ""
2004506-21 = ""
2004506-22 = "И нельзя забыть эти полезные буклеты..."
2004506-23 = "А бутылок воды у нас раз, два, три... Сколько там нужно?"
2004506-24 = "Вроде всё сходится, но на всякий случай пересчитаю ещё четыре раза! Раз... два..."
2004506-25 = "[s] «Ты усердно работаешь, Пина.»"
2004506-26 = "А!!! Сенсей!"
2004506-27 = "Эхе... Я просто проверяла запасы. Нельзя быть слишком подготовленной!"
2004506-28 = "Но почему вы... А-а?! Я ошиблась с вашей бронью?"
2004506-29 = "[s] Объяснить Пине, что я пришёл ей помочь."
2004506-30 = "Понятно! Но, как видите, у меня всё под контролем!"
2004506-31 = "Я всё тщательно проверила, чтобы не допустить ни единой ошибки. Больше никаких промахов!"
2004506-32 = "Но всё же пересчитаю ещё раз. Раз... два..."
2004506-33 = "[s3] «Думаю, уже достаточно.»\n[s4] «Как насчёт небольшого перерыва?»"
2004506-36 = "Но... я не хочу снова облажаться."
2004506-37 = "Раз уж есть свободное время, стоит потратить его на подготовку к работе, верно?"
2004506-38 = "[s5] «Ты уже отлично справляешься, Пина.»\n[s6] «Если отдохнёшь в свободное время, будешь работать ещё лучше.»"
2004506-41 = "Вот уж не ожидала услышать такое от своего наставника!"
2004506-42 = "Ну, раз вы настаиваете, пожалуй, позволю себе небольшую... передышку."
2004506-44 = "Мы с Пиной решили отдохнуть в автобусе."
2004506-47 = "― [log=피나 가이드]Эм-м!!! Ха![/log][wa:2590]"
2004506-49 = "― [log=피나 가이드]Похоже, я и правда была напряжена.[/log][wa:620]"
2004506-52 = "― [log=피나 가이드]Я даже не замечала этого рядом с гостями[/log][wa:1360]"
2004506-54 = "― [log=피나 가이드]потому что была слишком сосредоточена...[/log]"
2004506-57 = "― [log=피나 가이드]А когда я вот так рядом с вами,[/log][wa:600]"
2004506-59 = "― [log=피나 가이드]мне становится спокойно.[/log][wa:560]"
2004506-62 = "― [log=피나 가이드]Чтобы быть ловкой, растяжка необходима! Ещё раз![/log][wa:2770]"
2004506-65 = "― [log=피나 가이드]Хм, хм. У-Ух![/log][wa:1800]"
2004506-68 = "― [log=피나 가이드]Что? Вам приятно видеть, как я... расслабляюсь?[/log][wa:3730]"
2004506-71 = "― [log=피나 가이드]Н-Ну... Для гида[/log][wa:5500]"
2004506-73 = "― [log=피나 가이드]дух и чувство ответственности, конечно, очень важны...[/log]"
2004506-76 = "― [log=피나 가이드]Но когда мы только вдвоём... Как бы это сказать...[/log][wa:60]"
2004506-79 = "― [log=피나 가이드]Эм, я невольно расслабляюсь...[/log][wa:2160]"
2004506-83 = "Эй! Дверь заперта."
2004506-84 = "Мы слишком рано?"
2004506-85 = "Ой!"
2004506-86 = "Они вернулись! Мне нужно работать!"
2004506-87 = ""
2004506-92 = ""
2004506-93 = "С возвращением! Всем понравилось?"
2004506-94 = ""
2004506-97 = "Это было чудесно!"
2004506-98 = ""
2004506-100 = ""
2004506-101 = ""
2004506-102 = "Дух захватывает! Спасибо, что уступили мне своё место!"
2004506-103 = ""
2004506-105 = ""
2004506-106 = "!!!"
2004506-107 = "А... Эм... Д-Добро пожаловать!"
2004506-108 = ""
2004506-110 = ""
2004506-111 = ""
2004506-112 = "[ns] «Пина? Что теперь случилось?»"
2004506-113 = "Эм... дело в том... Сенсей, Босс..."
2004506-114 = "Я только сейчас поняла, что оставила туфли на каблуках в автобусе!!!"
2004506-115 = "[s7] «Для начала веди себя естественно!»\n[s8] «Не смотри вниз. Смотри на гостей!»"
2004506-118 = "Д-Да!!!"
2004506-120 = "Посадив гостей в автобус, Пина бросилась в его заднюю часть и быстро надела каблуки."
