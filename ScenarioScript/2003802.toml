[translation]
2003802-1 = "День слушателя"
2003802-2 = ""
2003802-3 = "А, Сенсей."
2003802-4 = "Хи-хи. Освежает видеть вас в другой обстановке и новой одежде."
2003802-5 = "[s] «Ты права. И тебя такой видеть непривычно.»"
2003802-6 = "Ох. Спасибо за комплимент."
2003802-7 = "...Я убеждаюсь в этом снова и снова, но вы тоже весьма искусно умеете делать комплименты."
2003802-8 = "[s] «'Тоже„'?“»"
2003802-9 = "Да. Что-то не так?"
2003802-10 = "О, вы подумали, что здесь скрыт какой-то смысл?"
2003802-11 = "Хи-хи. А есть ли?"
2003802-12 = "В конце концов, посеять сомнение в чужом разуме — один из методов пропаганды."
2003802-13 = "[s] «Пожалуйста, полегче со мной...»"
2003802-14 = "В любом случае, это отличная площадь."
2003802-15 = "Отсюда прекрасный обзор и почти ничего не мешает. Мой голос здесь будет далеко разноситься."
2003802-16 = "Хм? Я собираюсь произнести пропагандистскую речь?"
2003802-17 = "Хи-хи. А как вы думаете?"
2003802-18 = "[s] «Эта молчаливая улыбка — самый страшный ответ из возможных!»"
2003802-19 = "Если подумать, в Красной Зиме я постоянно занимаюсь пропагандой..."
2003802-20 = "Но если попытаться сделать такое в Шаньхайцзине, дело может перерасти в дипломатическую проблему, верно?"
2003802-21 = "Поэтому вместо этого, думаю, я спокойно проведу время, слушая других."
2003802-22 = "Что-то вроде того."
2003802-23 = "[s] «Думаю, отличная идея и хороший пример для других учеников.»"
2003802-24 = "Ещё один умелый комплимент. Спасибо."
2003802-25 = "Тогда пойдём послушаем других?"
2003802-26 = "Где это можно сделать? Что ж, ответ очевиден."
2003802-28 = ""
2003802-29 = "Все, позвольте представить инструктора Саширо Томоэ, которая сегодня присоединится к нам."
2003802-30 = "Поприветствуйте её громкими аплодисментами!"
2003802-31 = ""
2003802-33 = ""
2003802-34 = "[ns1] «Место, где можно послушать других...»\n[ns2] «...оказалось Садом Цветущей Сливы.»"
2003802-37 = "Да. Где бы вы ни были, дети всегда остаются будущим Кивотоса."
2003802-38 = "Если посмотреть с определённой стороны, дети — идеальная аудитория для максимального эффекта пропаганды."
2003802-39 = "Конечно, даже я понимаю, что есть границы, которые нельзя переходить."
2003802-40 = "[s3] «Почему мне внезапно стало очень тревожно...?»\n[s4] «Ты ведь ничего не задумала... правда?»"
2003802-43 = "Вам нужно научиться мне доверять, Сенсей."
2003802-44 = "Итак, ученики Сада Цветущей Сливы? О чём мы сегодня поговорим?"
2003802-45 = "Инструктор Томоэ! Смотрите! Мои ботинки светятся!"
2003802-46 = "О, и правда. Какие замечательные ботинки."
2003802-47 = "Эй, инструктор Томоэ. Говорят, два ботинка — это пара. Разве не смешно?"
2003802-48 = "Значит, если спрятать один ботинок, то ботинки уже не будут ботинками!"
2003802-49 = "Да! Но это не значит, что нужно прятать обувь друзей, хорошо?"
2003802-50 = "Я только что ходила смотреть на цветы. И вдруг прилетела бабочка!"
2003802-51 = "Но вы знали? Когда бабочки маленькие, они выглядят совсем по-другому!"
2003802-52 = "Тогда, возможно, и ты, когда вырастешь, станешь совершенно другим человеком."
2003802-53 = "Школьная система создана, чтобы с самого детства внушать мысль, будто от оков общества невозможно освободиться."
2003802-54 = "Так же как слон, которого с детства держали на верёвке, уже взрослым не пытается её разорвать."
2003802-55 = "Только никому не рассказывай, что я тебе это сказала, хорошо?"
2003802-56 = "Это будет наш тайный договор. Значит, мы тайные друзья."
2003802-59 = "Томоэ очень умело присматривала за детьми Сада Цветущей Сливы и выслушивала каждого."
2003802-60 = "Даже инструкторы Сада Цветущей Сливы по очереди благодарили Томоэ..."
2003802-62 = ""
2003802-63 = "Отличная работа, Сенсей."
2003802-64 = "[s5] «Хорошая работа, инструктор Томоэ...»\n[s6] «Ты исключительно хорошо ладишь с детьми.»"
2003802-67 = "Вот как? Похоже, за годы я как-то к этому привыкла."
2003802-68 = "А? Обычно от человека, который любит говорить..."
2003802-69 = "...вы не ожидали такого умения слушать?"
2003802-70 = "Хи-хи. Спасибо, Сенсей. Три комплимента за один день... Возможно, стоит отпраздновать."
2003802-71 = "Но я не просто «люблю говорить». Мне нравится искусство убеждения."
2003802-72 = "А изменить чьё-то мнение нельзя, сперва не выслушав его самого."
2003802-73 = "Сначала нужно понять его точку зрения. Тогда вы сможете воздействовать на неё и склонить человека на свою сторону."
2003802-74 = "И ещё..."
2003802-75 = "[s] «И?»"
2003802-76 = "Если не говорить об убеждении, мне просто нравятся искренние слова детей."
2003802-78 = "Когда Томоэ произнесла это, её лицо выглядело счастливее, чем когда-либо."
