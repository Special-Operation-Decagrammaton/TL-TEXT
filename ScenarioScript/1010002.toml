[translation]
1010002-1 = "Эксперт"
1010002-3 = ""
1010002-4 = "Здравствуйте, Сенсей."
1010002-5 = "[s] «Странно видеть тебя в такой... нормальной обстановке!»"
1010002-6 = "Эм... Правда?"
1010002-7 = "Мне понадобились некоторые припасы."
1010002-8 = "Я должна покупать их во время визитов в торговый район Абидоса, иначе потом это создаёт большие неудобства."
1010002-9 = "Раз уж мы вот так встретились, может, я угощу вас чем-нибудь, Сенсей? Недавно у меня появились деньги."
1010002-10 = "[s1] «...»\n[s2] «Деньги...?»"
1010002-13 = "Да."
1010002-14 = "[s] «У тебя... есть деньги...? То есть ты хочешь сказать...?»"
1010002-15 = ""
1010002-17 = ""
1010002-18 = "Я не занималась никакой незаконной деятельностью."
1010002-19 = "Я не хотела бы попасться и спровоцировать ситуацию, в которой люди примут меня за Широко этого мира и создадут проблемы ей и Оперативной группе по взысканию."
1010002-20 = "Чтобы уточнить: я не давала никому повода преследовать меня."
1010002-21 = "Эти деньги заработаны законным путём. Пожалуйста, не беспокойтесь, Сенсей."
1010002-22 = "[s] «Ты устроилась на подработку или что-то вроде того?»"
1010002-23 = "Что-то в этом духе."
1010002-24 = "Чем больше людей приходит в Абидос, тем больше появляется возможностей заработать."
1010002-25 = ""
1010002-28 = "[ns] «Понятно...»"
1010002-30 = "Купив всё необходимое, мы вместе вышли из торгового района."
1010002-35 = "Благодаря вашему присутствию, Сенсей, этот поход по магазинам оказался неожиданно приятным."
1010002-36 = "Ваша сумка, должно быть, тяжёлая. Позвольте мне понести её."
1010002-37 = "[s] «Нет, проще, если каждый понесёт по одной. У тебя всё-таки только две руки.»"
1010002-38 = "Что ж, пожалуй..."
1010002-39 = "[s] «Раз мы закончили, почему бы не зайти туда, где ты сейчас живёшь?»"
1010002-40 = "Туда... где я живу?"
1010002-41 = "Но... эм... ну..."
1010002-42 = "Я давно не убиралась... поэтому там немного беспорядок..."
1010002-43 = "[s] «Неважно. Я просто хочу убедиться, что с тобой всё хорошо, Широко.»"
1010002-44 = ""
1010002-46 = ""
1010002-47 = "О... Понятно."
1010002-48 = "Что-то вроде визита на дом. Понятно."
1010002-49 = ""
1010002-51 = ""
1010002-52 = "Тогда следуйте за мной, Сенсей."
1010002-53 = ""
1010002-55 = ""
1010002-57 = "[ns] Следовать за Широко."
1010002-62 = "Вход в заброшенное здание"
1010002-64 = "Сюда."
1010002-65 = "[s3] «Заброшенные руины...?»\n[s4] «Ты здесь живёшь?»"
1010002-68 = "Хм? Нет. Это короткий путь."
1010002-69 = "Так мы доберёмся быстрее."
1010002-70 = "[s] «А... хорошо.»"
1010002-71 = "Ещё немного."
1010002-76 = "Берегите голову, Сенсей."
1010002-77 = "[s] «Широко... Ты ведь не живёшь в палатке или картонном домике?»"
1010002-78 = "Нет, уже нет. Поначалу жила, но теперь у меня нормальный дом."
1010002-79 = "[s] «Ты жила в палатке?!»"
1010002-80 = "Эм... Сюда."
1010002-83 = "Район, погребённый под песком"
1010002-87 = "[ns5] «Заброшенный район...» \n[ns6] «В этих местах много пустующих домов...»"
1010002-90 = "Да. В Абидосе много незанятых домов."
1010002-91 = "[s7] «Разве так жить не трудно?» \n[s8] «Без электричества, водопровода и канализации...»"
1010002-94 = "Хм? Полагаю, для кого-то это было бы трудно."
1010002-95 = "[s] «...?»"
1010002-96 = "О. Это тоже не здесь, Сенсей."
1010002-97 = "Как вы и сказали, жить в этом заброшенном районе было бы довольно неудобно. Мой дом дальше."
1010002-98 = ""
1010002-100 = ""
1010002-102 = "[ns] «...»"
1010002-106 = "Мы пришли."
1010002-107 = ""
1010002-109 = ""
1010002-110 = "Заходите, Сенсей."
1010002-111 = ""
1010002-113 = ""
1010002-121 = ""
1010002-122 = "Это моя комната."
1010002-123 = "Простите за беспорядок. Последние несколько дней у меня не было возможности убраться."
1010002-124 = ""
1010002-127 = "[ns9] «Это здесь?»\n[ns10] «Выглядит совершенно обычно!»"
1010002-130 = "Дома... обычно и выглядят обычно..."
1010002-131 = "[s] «Ну, это правда, но... Понятно...»"
1010002-132 = "Пожалуйста, положите продукты в холодильник. А моющее средство — на полку над стиральной машиной. И—"
1010002-133 = "[s11] «У тебя есть электричество?!»\n[s12] «И водопровод?!»"
1010002-136 = "А, должно быть, жарко. Я включу кондиционер, одну минуту."
1010002-137 = ""
1010002-139 = ""
1010002-141 = "[ns] «У тебя даже кондиционер есть...?!»"
1010002-142 = "Да. Вы не ожидали, что у меня будут такие базовые удобства?"
1010002-143 = "[s] «Нет-нет. Именно на это я и надеялся! Я счастлив!»"
1010002-144 = "Обычно электричество и вода сюда не доходят, но это было легко исправить."
1010002-145 = "Студенческий совет установил неподалёку солнечную электростанцию, и я подключила к ней это здание. Также я установила аварийные генераторы."
1010002-146 = "Один дизельный и один бензиновый. Третий я переделала так, чтобы в крайнем случае вырабатывать электричество педалями велосипеда."
1010002-147 = "[s] «П-Понятно!»"
1010002-148 = "Хотя запас воды не бесконечный, я также подключила несколько резервуаров. Даже если дождя не будет, воды хватит на несколько месяцев."
1010002-149 = "Я подключила систему к фильтру и умягчителю воды, поэтому её можно безопасно пить."
1010002-150 = "Наверху есть тренажёрная, а гараж я переоборудовала в мастерскую для ремонта велосипедов."
1010002-151 = "Я собираю запчасти с брошенных велосипедов и из них восстанавливаю новые."
1010002-152 = "[s] «Ого... Ты и правда мастер на все руки!»"
1010002-153 = "Да. Район Абидоса — кладбище брошенных вещей. Я чиню их и продаю в торговом районе."
1010002-154 = "[s] «А, вот как...»"
1010002-155 = "Поскольку в район стало приезжать много людей, спрос заметно вырос."
1010002-156 = ""
1010002-159 = "[ns] «...Похоже, я зря за тебя волновался, Широко.»"
1010002-160 = "Да."
1010002-162 = "Я эксперт по выживанию, поэтому, пожалуйста, не беспокойтесь обо мне, Сенсей."
1010002-172 = "В конце концов стало поздно, и я собрался возвращаться."
1010002-177 = "[ns] «Я буду на связи, Широко.»"
1010002-178 = "Со мной может быть трудно связаться. Мне придётся уехать... на некоторое время."
1010002-179 = "[s13] «Ты уезжаешь?»\n[s14] «Собираешься в одну из своих долгих велопоездок?»"
1010002-180 = ""
1010002-181 = ""
1010002-183 = ""
1010002-184 = "Как ностальгично... Нет. Я больше не езжу на велосипеде."
1010002-185 = "[s] «...Не ездишь— Почему?!»"
1010002-186 = "..."
1010002-187 = "[ns] «Что значит — больше не ездишь?»"
1010002-188 = ""
1010002-190 = ""
1010002-191 = "...Я уеду, чтобы найти кое-что, что может мне понадобиться. Но не прямо сейчас."
1010002-192 = "Не знаю, сколько ещё пробуду здесь, но можете приходить ко мне в гости, Сенсей."
1010002-193 = ""
1010002-195 = ""
1010002-196 = "До свидания..."
1010002-197 = ""
1010002-199 = ""
