102180-67 = ""
102180-68 = "...? А?"
102180-69 = "Что это за звук...?"
102180-71 = "Президент! Цукуё! Сверху. Ого! Дирижабль пролетает!"
102180-72 = "Ч-Что?! Что-то падает..."
102180-73 = ""
102180-80 = "Ч-Что это...?"
102180-81 = "Что происходит...?"
102180-82 = "Т-Танк...? Танк упал!"
102180-83 = ""
102180-91 = "Ке-ке-ке-ке! Отличный тайминг, Ироха!"
102180-92 = "Ха-ха-ха. Уи-и! Как весело! Падаем-падаем!"
102180-93 = "*вздыхает* ...Ага, ага. Может, теперь наконец скажете, зачем мы здесь?"
102180-94 = "А? Ты не знала? Мы эффектно ворвались в последний момент, чтобы спасти друга в беде!"
102180-95 = "Что?"
102180-96 = "Да! Сегодня мы выступаем как союзники справедливости! Всё ради ниндзя, которых так любит Ибуки!"
102180-97 = "Привет-привет! Это ниндзя-сестрички Ибуки! Ибуки пришла помочь!"
102180-98 = ""
102180-99 = "О...! Я знаю этот голос..."
102180-100 = "И-Ибуки?!"
102180-101 = "Ироха...? К-Как вы...?"
102180-103 = "Ке-ке-ке... Не недооценивай мою информационную сеть. Я знаю всё, что происходит повсюду! Конечно, я первой узнала, что ниндзя отправили на опасную встречу!"
102180-104 = "Если ниндзя пострадают, наша дорогая Ибуки будет убита горем!"
102180-105 = "Поэтому, чтобы защитить нашего драгоценного ангела, мне оставалось только скрываться в тени и в идеальный момент эффектно спасти положение!"
102180-106 = "*вздыхает*"
102180-107 = "То есть... вы проделали весь этот путь, чтобы порадовать Ибуки?"
102180-108 = "Именно! Отличный шанс заработать очки у Ибуки! Я не могла упустить такую возможность!"
102180-109 = "После того случая с пудингом Ибуки даже в глаза мне не смотрит, не то что разговаривает!"
102180-110 = "...Ну, ты съела любимый пудинг Ибуки у неё за спиной."
102180-111 = "Я думала, это твой пудинг!"
102180-112 = "...А если мой — тогда можно?"
102180-113 = "Ага! Тогда Ибуки ненавидела Макото, но теперь всё хорошо! Макото самая лучшая!"
102180-114 = "Кья-ха-ха-ха! Слышала, Ироха? Немедленно спасай этих ниндзя!"
102180-118 = "Ультра-непобедимая стальная броня Toramaru! В бой!"
102180-120 = "*вздыхает* ...Ладно. В бой."
102180-121 = "Эй! Ибуки тоже будет вам помогать!"
102180-123 = "В-Вы пришли нам помочь? Спасибо!"
102180-124 = "Круто! Погнали!"
102180-125 = "Ура!"
