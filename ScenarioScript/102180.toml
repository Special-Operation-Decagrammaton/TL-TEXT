102180-11 = "У-Ух. Что происходит? Разве не говорили, что Великое снежное поле будет безопасным?"
102180-12 = "Сплошная ложь! Они навалились на нас, как только мы сюда ступили!"
102180-13 = "Д-Думаете... они следили за нами...?"
102180-14 = "Что?! За нами следили? Откуда они могли узнать о нашей сверхсекретной миссии?"
102180-15 = "Невозможно! Мы никому ни слова не сказали!"
102180-17 = "...Ке-ке-ке."
