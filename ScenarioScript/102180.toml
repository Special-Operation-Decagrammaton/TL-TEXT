102180-22 = ""
102180-23 = ""
102180-25 = "М-Мы окружены со всех сторон! Что делать, президент?"
102180-26 = "Такими темпами... мы..."
102180-27 = "Аргх! Хватит! Все, сейчас самое время показать нашу силу!"
102180-28 = "Президент..."
102180-29 = ""
102180-30 = "Президент..."
102180-31 = "Сенсей из Шале доверил эту миссию Клубу исследования ниндзюцу! Мы не можем провалиться на первом же препятствии!"
102180-32 = "Ниндзя никогда не нарушает своего слова!"
102180-33 = "Цукуё, Изуна! Покажем этим гадам силу нашей ниндзя-связи!"
102180-34 = "...Силу... нашей связи. Да, президент!"
102180-35 = "Нин-нин! Я не нарушу слово, данное господину!"
