102180-43 = "Н-Ниндзюцу Цукуё..."
102180-44 = ""
102180-50 = "Отлично! Сейчас наш момент!"
102180-51 = "Ультра-непобедимая стальная броня Toramaru!"
102180-52 = "Сброс!"
102180-53 = "Сбросить тебе бы это название... *вздыхает*"
102180-54 = "Ладно-ладно. Снижаемся. Ура. Поехали."
