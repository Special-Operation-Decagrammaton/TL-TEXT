[translation]
10020005-6 = ""
10020005-7 = "Теперь наша очередь."
10020005-8 = "А теперь момент, которого вы все ждали... Руководитель операции прибыл!"
10020005-9 = ""
10020005-11 = ""
10020005-12 = "Я проведу инструктаж по захвату Ковчега."
10020005-13 = ""
10020005-15 = ""
10020005-17 = ""
10020005-18 = "Для захвата мы должны взломать Ковчег до истечения времени и перехватить права управления."
10020005-19 = ""
10020005-23 = "Ковчег Атрахасиса — крупное многомерное аналитическое устройство. По сути, весь Ковчег похож на суперкомпьютер."
10020005-24 = "Он состоит из нескольких отдельных вычислительных устройств, которые работают вместе, выполняя многомерный анализ."
10020005-25 = "Учитывая это, нам нужно сосредоточиться на захвате каждой области внутри Ковчега, чтобы получить над ним полный контроль."
10020005-26 = "Прямо как «Царь горы»!"
10020005-28 = "Вообще-то да. Поскольку этот захват в основном сводится к занятию территории противника, сравнение вполне справедливое."
10020005-29 = "Наша цель — полностью захватить Ковчег и взять его под контроль. Это наш единственный путь к победе."
10020005-30 = "Видите ли, получив контроль, мы сможем запустить последовательность самоуничтожения Ковчега."
10020005-31 = "Но враги не позволят сделать это легко. На протяжении всего захвата они будут атаковать без остановки."
10020005-32 = "К счастью, наш Сенсей — эксперт по таким ситуациям."
10020005-33 = "[s] «Да. Предоставьте это мне.»"
10020005-34 = "На данный момент Арис удалось заморозить все функции Ковчега, не позволяя ему проводить многомерный анализ или перемещаться."
10020005-35 = "Но, конечно, она не сможет удерживать его бесконечно. В тот момент, когда она потеряет контроль, Ковчег снова исчезнет в мультивселенной."
10020005-36 = "А вместе с ним исчезнет и любая надежда снова его поймать."
10020005-37 = "Я отмечу предел подавления многомерного анализа."
10020005-38 = ""
10020005-40 = ""
10020005-42 = ""
10020005-43 = "Это временной лимит операции по захвату."
10020005-45 = "Теперь я могу рассказать вам о внутренней структуре Ковчега."
10020005-46 = ""
10020005-48 = ""
10020005-50 = "Ковчег разделён на 4 области."
10020005-51 = ""
10020005-60 = "Есть Область 1..."
10020005-61 = "...Область 2..."
10020005-62 = "...и Область 3 на окраине."
10020005-63 = "Область 4 находится в центре Ковчега."
10020005-64 = "Корабль Утнапиштима уже проник в Область 1."
10020005-65 = "Естественно, захват начнём с окраин: Областей 1, 2 и 3. Область 4 оставим напоследок."
10020005-66 = "В каждой Области есть собственный Двигатель измерений, предоставляющий вычислительную мощность. В самом центре находится устройство многомерных вычислений."
10020005-67 = "Мы должны уничтожить все 4 Двигателя измерений, прежде чем сможем взять Ковчег под контроль."
10020005-69 = "Чтобы победить, мы должны заставить Ковчег самоуничтожиться."
10020005-70 = "Только тогда в Кивотос снова вернётся мир."
10020005-71 = ""
10020005-73 = ""
10020005-74 = "После этого Сенсею и всем нам останется лишь безопасно спуститься на землю. К счастью, Инженерный отдел отремонтировал корабль Утнапиштима, так что с этим проблем не будет."
10020005-76 = "На этом инструктаж окончен. Дальше дело за Шале."
10020005-77 = "Да, Сенсей. Мы рассчитываем на вас."
10020005-78 = ""
10020005-80 = ""
10020005-81 = "У вас всё получится, Сенсей. Мы постараемся изо всех сил вас поддержать."
10020005-82 = "Держитесь."
10020005-83 = ""
10020005-85 = ""
10020005-86 = "[ns] «Спасибо, Веритас. Давайте все постараемся.»"
10020005-87 = "Спасибо за инструктаж, Веритас."
10020005-88 = "Теперь..."
10020005-89 = "Да начнётся захват Ковчега Атрахасиса!"
10020005-90 = "[s] «Хорошо. Приступим.»"
10020005-92 = "Я подготовила здесь всё необходимое для операции. Заходите в любое время, Сенсей."
10020005-93 = "Да! Мы всегда будем поддерживать Сенсея."
