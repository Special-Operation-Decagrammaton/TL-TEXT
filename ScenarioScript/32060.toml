[translation]
32060-1 = "Episódio 6;Confusão da Meia-Noite (2)"
32060-2 = "...Sociedade de Pesquisa Gourmet?"
32060-3 = "A propósito, senpai, onde você está agora? Se não nos der suas ordens logo, desse jeito a Tsurugi-senpai vai disparar... digo, sair voando na frente."
32060-4 = "P-Por ora, segurem a Tsurugi, por favor. Eu estou, bem, fora por um momento para resolver um assunto pessoal..."
32060-5 = "Ah, sem chance. Se não for a Hasumi-senpai, não tem muito como parar ela..."
32060-6 = "Ah, Tsurugi-senpai! Não vá, por favor! E aí não é a porta, é a parede—"
32060-11 = "Aah... Bom, por enquanto nós também vamos atrás dela e entrar em ação."
32060-12 = "(Bip)"
32060-13 = "..."
32060-18 = "Foi perto. Pelo som da explosão, deve ser a menos de 1 km daqui."
32060-19 = "H-Hãã...!?"
32060-20 = "...Pessoal."
32060-21 = "Desculpem pedir isso tão de repente, mas preciso da força de vocês. Podem me ajudar?"
32060-22 = "Com o Tratado do Éden tão próximo, estamos em um período muito delicado. Não é difícil imaginar que a situação ficaria desfavorável se, visto de fora, este problema fosse interpretado como um \"conflito entre o Comitê de Justiça da Trinity e a Gehenna\"."
32060-23 = "Ou seja, o ideal seria um cenário em que o Clube de Aulas de Reforço e a \"Schale\" resolvessem isso juntos... Sensei, posso contar com a sua ajuda...?"
32060-24 = "[s] \"Sim. Certo, então Clube de Aulas de Reforço, todos em marcha.\""
32060-26 = "Entendido. Seguirei as instruções do Sensei."
32060-27 = "Quêê!? U-Um combate assim do nada...!? A-Auuu..."
32060-28 = "Fufu... Bom, já que o Sensei está pedindo♡"
32060-32 = "Ah, e-eu também...? Junto com o Sensei... e com a Hasumi-senpai...?"
32060-33 = "Eu imaginava que algum dia chegaria a hora de lutarmos lado a lado assim... mas foi mais cedo do que eu esperava, Koharu."
32060-34 = "S-Sim! Vou dar o meu melhor...!"
32060-35 = "Pensando bem, é a primeira vez que luto pra valer sob o comando do Sensei. Não precisa se conter, Sensei. Pode me usar o quanto quiser."
32060-36 = "Ora, ora...♡"
32060-37 = "[s] \"Então, segurança em primeiro lugar.\""
