32060-22 = "Скоро подписание Эдемского договора, и ситуация крайне деликатная. Нам только не хватало межрайонного конфликта между Отрядом правосудия и академией Геенна."
32060-23 = "Я официально прошу Клуб дополнительных занятий о помощи через Шале. Сможете, Сенсей?"
32060-24 = "[s] «Конечно. Клуб дополнительных занятий, приготовиться к выходу.»"
32060-26 = "Понятно. Без проблем."
