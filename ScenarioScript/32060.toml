32060-1 = "Эпизод 6;Полуночный переполох, часть 2"
32060-2 = "Общество гурманов?"
32060-3 = "Где вы, вице-президент? Прошу, отдайте приказ, пока президент Цуруги... не взяла дело в свои руки."
32060-4 = "Пока постарайтесь её сдержать. Я сейчас... занята личным делом."
32060-5 = "Не уверена, что это возможно. Когда она в таком состоянии, она слушает только вас."
32060-6 = "А, президент Цуруги! Не уходите! Это не дверь — это стена!"
32060-7 = ""
