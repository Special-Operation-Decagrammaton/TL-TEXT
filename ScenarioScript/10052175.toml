10052175-226 = "[ns] «Арис! Кей!»"
10052175-228 = ""
10052175-229 = ""
10052175-230 = ""
10052175-232 = "Сенсей...? Все...?"
10052175-233 = "Хи-хи. Я в порядке. Совершенно в порядке. Просто... немного устала."
10052175-234 = "Я бы не назвала это «немного»..."
10052175-235 = "В-вы в порядке? С ними всё хорошо, да?! Арис! Кей-Кей!"
10052175-236 = "Похоже, что да. Раз они способны нормально выражаться, их состояние, судя по всему, не критическое."
10052175-237 = "У меня тоже был случай, когда Нэру немного меня избила."
10052175-238 = "Но с комплексной и целостной точки зрения серьёзных проблем не возникло."
10052175-239 = ""
10052175-241 = ""
10052175-242 = "...Ты меня сейчас утешаешь или издеваешься...?"
10052175-243 = "Токи. Иногда даже если что-то правда, это не значит, что это обязательно нужно произносить вслух."
10052175-244 = "Понятно... Снова убеждаюсь, что язык — штука довольно сложная."
10052175-246 = "Арис, Кей. Вы отлично справились. Давайте поглотим данные ядра Малкут, а потом..."
10052175-247 = "А потом войдём внутрь, заберём и поглотим ядро Нецаха."
10052175-248 = "И когда закончим, Кей достигнет максимального уровня!"
10052175-249 = "[s] «И мы наконец закроем историю Стального континента!»"
10052175-250 = "Да. Звучит верно. Тогда двинемся? Начнём с Малкут..."
10052175-251 = ""
10052175-253 = ""
10052175-254 = "...А?"
10052175-255 = ""
10052175-256 = "С-Старшая сестра...?"
