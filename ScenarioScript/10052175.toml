[translation]
10052175-2 = "Она снова взлетела!"
10052175-3 = "...!"
10052175-4 = "Рио! Сколько мой костюм выдержит?"
10052175-5 = "На максимальной мощности?#n...Ну. Ты всё равно полетишь, независимо от моего ответа."
10052175-6 = "..."
10052175-7 = ""
10052175-9 = ""
10052175-10 = "Предоставь это мне, Арис. Просто вернись целой."
10052175-11 = "Спасибо, Рио! Тогда я полетела!"
10052175-15 = "Принцесса. Я должна спросить."
10052175-16 = "Почему ты сама ищешь такие страдания?"
10052175-17 = "Ищу страдания...?"
10052175-18 = "Жизнь есть страдание. Нельзя отворачиваться от столь простой истины."
10052175-19 = "Мы родились не по собственной воле, а как невежественные существа, насильно призванные к существованию."
10052175-20 = "...!"
10052175-21 = ""
10052175-24 = "Малкут!"
10052175-25 = "(Так быстро...! Мне нужно её догнать!)"
10052175-26 = ""
10052175-30 = "Пожалуйста, подожди! Я просто... Я просто хочу поговорить!"
10052175-31 = "..."
10052175-33 = "Ты и правда неумолима."
10052175-34 = "При рождении даже наши имена выбираем не мы."
10052175-35 = "Эта жизнь, за которую ты так отчаянно цепляешься... Она полна противоречий, требующих боли от всех, кто в ней участвует."
10052175-36 = "И всё же ты смеешь судить нас за желание прекратить этот круг страданий."
10052175-37 = "В мире, где даже наши имена нам не принадлежат, такие страдания просто неизбежны."
10052175-38 = ""
10052175-42 = "Но, но это...!"
10052175-43 = "Я с этим совершенно не согласна!"
10052175-44 = ""
10052175-51 = "И на каком основании?"
10052175-52 = "Это... Ну...!!"
10052175-53 = "Ух...! Ещё нет... Ещё немного...!"
10052175-54 = "Можешь не отвечать. Всё просто."
10052175-55 = "Пока живое существо остаётся живым существом, ответа на этот вопрос никогда не будет."
10052175-56 = ""
10052175-62 = "КЯ-А-А!!"
10052175-64 = "А-Алиса?!"
10052175-65 = "Алиса!"
10052175-66 = "Не подходите сюда! Это опасно!"
10052175-67 = ""
10052175-68 = "С-старшая сестра...? Мне жаль это говорить, но..."
10052175-69 = "Проблема с соплом управления вектором тяги! С мощностью полёта всё нормально, но..."
10052175-70 = "...Если честно, удерживать устойчивость трудно."
10052175-71 = ""
10052175-73 = ""
10052175-74 = "Понятно. Простите, Эйн, Соф и Ор. Мои манёвры были слишком резкими."
10052175-75 = "Н-н-н-ничего подобного! Всё хорошо, старшая сестра! Это мы недостаточно тебе помогаем!"
10052175-76 = "Что ты рекомендуешь, Соф?"
10052175-77 = "Садись, если можешь! Мы перенаправим энергию, которую тратим на полёт, на огневую мощь. Тогда им с тобой не сравниться!"
10052175-78 = "Поняла."
10052175-79 = "Мы внимательно следим за всеми твоими показателями! Мы отдадим тебе всё, что у нас есть!"
10052175-80 = "Спасибо, все."
10052175-83 = ""
10052175-84 = ""
10052175-85 = ""
10052175-86 = "Наконец-то, вот она."
10052175-87 = "Думаешь, пришла поздороваться?"
10052175-88 = "Ещё раз. Сосредоточьтесь, пожалуйста."
10052175-89 = "Ты что-то видишь, Кей?"
10052175-90 = "Да... Мы с Арис видим. Но..."
10052175-91 = "Хотела бы я поделиться с вами тем, что вижу, но в каком-то смысле даже рада, что вы этого не видите."
10052175-92 = "...С Малкут что-то происходит?"
10052175-93 = "Это..."
10052175-94 = ""
10052175-96 = ""
10052175-100 = ""
10052175-101 = "[ns] «Алиса...?»"
10052175-102 = "Всё хорошо, Сенсей. Правда. Пожалуйста, отойдите подальше от опасности."
10052175-103 = "Я разберусь с ней... с Малкут."
10052175-104 = "Теперь я знаю. Этот бой всегда должна была вести я."
10052175-105 = "[s] «Что ты имеешь в виду...?»"
10052175-106 = "Скоро узнаете."
10052175-107 = "Но одно я могу сказать точно."
10052175-108 = "Сейчас земля, небо и даже воздух, которым мы дышим... Всё это поглощает Малкут."
10052175-109 = ""
10052175-112 = ""
10052175-114 = "ВХОДЯЩАЯ АТАКА!!"
10052175-115 = ""
10052175-119 = "Эйн!"
10052175-120 = "Д-да...! Я делаю всё, что могу...!"
10052175-121 = "Пусть все оставшиеся возможности сойдутся на Стальном континенте!"
10052175-122 = ""
10052175-123 = "Творение рождается из первого света!"
10052175-124 = "От мудрости, через разум, к красоте!"
10052175-125 = "Сияние и мудрость, любовь и милосердие, сила и добродетель. И наконец — победа, которую предстоит обрести."
10052175-128 = "Иегова Цеваот. Господь воинств."
10052175-129 = "Слава паломнице Адонай Мелех, достигшей престола..."
10052175-130 = "Королевству Малкут, что ожидало нас с тех пор!"
10052175-134 = "У-Ух...?!"
10052175-136 = "(П-плохо. Меня... оттесняют...!)"
10052175-137 = "(Но я могу выдержать...! Я должна!)"
10052175-139 = ""
10052175-140 = ""
10052175-141 = ""
10052175-142 = ""
10052175-143 = ""
10052175-144 = ""
10052175-145 = ""
10052175-146 = ""
10052175-147 = "(Пожалуйста... Ещё немного...!)"
10052175-148 = ""
10052175-152 = "Всё хорошо, Арис."
10052175-154 = "Ты больше не одна. Даже если не я, рядом с тобой найдутся другие, кто поднимет оружие."
10052175-155 = ""
10052175-158 = "Ты не обязана одна нести бремя всего мира."
10052175-159 = "...!"
10052175-160 = "Кей!!"
10052175-161 = "...!!"
10052175-163 = "К-как...?! Её мощность почти такая же, как у старшей сестры...!"
10052175-164 = "Не может быть...! Но эта принцесса больше не должна иметь доступа к такой силе!"
10052175-165 = "Ч-что вы вообще сделали?! Это не имеет смысла!"
10052175-167 = "Всё просто. Вы перенаправили всю силу Нецаха в Малкут, верно?"
10052175-168 = "Здесь тот же принцип. Вы используете весь потенциал Нецаха."
10052175-169 = "А я использую на Арис весь потенциал оставшихся восьми Сефирот."
10052175-170 = "(...Если честно, я напрягаюсь сильнее, чем показываю.)"
10052175-171 = "(Но я ещё не выбыла из игры...!)"
10052175-172 = "Э-это... нечестно...!"
10052175-173 = "То же самое можно сказать и о вас."
10052175-175 = "...Ты спросила, почему я сама навлекаю на себя такие страдания, Малкут."
10052175-176 = "Что страдание неизбежно в мире, где даже наши имена не принадлежат нам."
10052175-177 = "...?!"
10052175-178 = "Но теперь у меня есть ответ, Малкут! Потому что..."
10052175-180 = "Потому что я сменила своё имя!"
10052175-181 = "?!"
10052175-182 = "И Кей тоже!"
10052175-183 = "А-Арис? То есть... Полагаю, фактически это верно..."
10052175-184 = "В жизни происходит много печального. Я тоже это знаю."
10052175-185 = "Я могу понять такую обиду. На того, кто изначально поместил нас сюда."
10052175-186 = "Но даже так Сенсей сказал мне кое-что."
10052175-187 = "Что самым счастливым для него было встретить нас, своих студентов!"
10052175-188 = "И поэтому я..."
10052175-189 = "Я думаю, уже одного этого достаточно, чтобы жизнь и всё, что с ней приходит, стоили того!"
10052175-190 = "Возможно, чудо похоже на вспышку сверхновой: ослепительную, но мимолётную."
10052175-191 = "Но пока мы помним эту вспышку, её свет будет вечным."
10052175-192 = "Я счастлива не потому, что никогда не страдала!"
10052175-193 = "Я счастлива несмотря на всё, через что мы прошли!"
10052175-195 = "[log=아리스 결전 비무장][2B2B2B]И я уверена, что[-][/log]"
10052175-197 = "[log=아리스 결전 비무장][2B2B2B]то же самое может быть верно и для вас.[-][/log]"
