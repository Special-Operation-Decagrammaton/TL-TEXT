[translation]
10037095-3 = "А-а-а!"
10037095-4 = ""
10037095-7 = ""
10037095-9 = "Нас меньше! Они сильнее нас!"
10037095-10 = "[s] Встать рядом с Миной и Мариной."
10037095-11 = ""
10037095-15 = "[ns] Загородить Кисаки собой."
10037095-16 = ""
10037095-20 = ""
10037095-21 = "...Сенсей?"
10037095-22 = "Сенсей...?"
10037095-23 = "Ч-Что вы пытаетесь сделать, Сенсей?"
10037095-24 = "[s1] «Я знаю, что не должен слишком вмешиваться в столкновения между студентами.»\n[s2] «Но я бы хотел, чтобы вы не были так суровы к Кисаки.»"
10037095-27 = "...И почему же?"
10037095-28 = "[s] «(Потому что Кисаки нездорова, но я обещал...)»"
10037095-30 = "[ns] «Потому что Кисаки изо всех сил старается ради Шаньхайцзина.»"
10037095-31 = "Слишком многое произошло, чтобы называть это просто разницей взглядов."
10037095-32 = "Слишком много студентов открыто беспокоились из-за этой проблемы. Многие высказывались против происходящего."
10037095-33 = "Прежде всего мы пытаемся направить президента на правильный путь."
10037095-34 = "Так что, Сенсей, пожалуйста... Отойдите."
10037095-35 = "...Даже мы не хотим прослыть враждебными по отношению к Шале."
10037095-36 = "[s] «...»"
10037095-38 = "Пожалуйста, сделайте, как они говорят, Сенсей."
10037095-39 = "[s] «Но...»"
10037095-40 = "Всё хорошо. Они пришли за мной. И похоже, студенты Генрюмона чувствуют... растерянность."
10037095-41 = "Фуфу... Что ещё может сделать президент, потерявшая доверие своих членов?"
10037095-42 = "По традиции небесная воля приходит через голос Бога. А голос Бога — это голос народа."
10037095-43 = "И я, потерявшая его, не могу выбрать другой путь."
10037095-44 = ""
10037095-49 = "Я больше не могу это терпеть!"
10037095-50 = ""
10037095-52 = ""
10037095-53 = "Что это было?!"
