[translation]
33080-1 = "Episódio 8;O Dia Tingido de Fogo e Cinzas (2)"
33080-10 = "...É um número fora do comum. Há dezenas... não, centenas delas ao nosso redor..."
33080-18 = "Ngh!"
33080-21 = "...Consegui alcançar. Cópias do Conselho dos Santos também confirmadas."
33080-22 = "O tratado foi assinado... e parece que a negociação com o boneco também deu certo, né, Atsuko?"
33080-27 = "Hii...!!"
33080-28 = "U-Um boneco de madeira...!?"
33080-30 = "...Que falta de modos. Se for se dirigir a mim, gostaria que me chamasse de \"Maestro\", em respeito à arte."
33080-31 = "..."
33080-32 = "Talvez ainda seja cedo demais para que compreendam o que é a arte... Sendo assim, perdoem-me, mas receio que não seja possível manter um diálogo agradável com vocês."
33080-33 = "Intelecto, dignidade, experiência... Venham quando tiverem adquirido tudo isso. Alunas de Kivotos, peço que não me decepcionem."
33080-34 = "...Contudo, o simples fato de poderem copiar a \"majestade\" daquelas guardiãs despertou o meu interesse. Em consideração a isso, desta vez eu as ajudarei."
33080-35 = "A linhagem daqueles que protegeram os preceitos... Foi uma imensa satisfação poder testemunhar o \"Mandamento\" desse Sangue Real em funcionamento."
33080-36 = "..."
33080-37 = "Graças a isso, o meu experimento poderá se aproximar ainda mais do \"Sublime\"."
33080-38 = "...Hmm, explicações devem soar tediosas e inúteis para vocês. Pois bem, conforme o prometido, peço que me guiem até os dogmas que repousam neste subsolo."
33080-39 = "..."
33080-43 = "Venham, vamos..."
33080-51 = "Kieeehhhhhh!"
33080-66 = "Arf, arf..."
33080-67 = "...Não tem fim. Quem são essas coisas, afinal...?"
33080-68 = "I-Isso é ruim... Precisamos fazer ao menos o Sensei escapar...!?"
33080-74 = "...!!"
33080-75 = "Por aqui!"
33080-76 = "[ns] \"Hina...!\""
33080-77 = "A Chefe do Comitê Disciplinar de Gehenna...!?"
33080-78 = "Hiyori, não me diga que não conseguiram parar a Hina?"
33080-79 = "Cof, cof... M-Me desculpe, não deu... Antes mesmo do Conselho dos Santos se manifestar, ela já tinha derrubado todo mundo..."
33080-83 = "Comitê de Justiça, mandem o Sensei para cá! Não temos tempo!"
33080-84 = "..."
33080-85 = "..."
33080-86 = "...Entendido."
33080-87 = "Sensei, nós vamos segurar o inimigo aqui. Depois disso, aquela Chefe do Comitê Disciplinar com certeza dará um jeito, então vá depressa, por favor!"
33080-89 = "[s] \"E você e as outras, Hasumi!?\""
33080-91 = "...Nós vamos proteger a sua rota de fuga, Sensei."
33080-92 = "Sim. Por mais desagradável que seja... aquela Chefe do Comitê Disciplinar deve estar confiando que faremos exatamente isso. E, de fato, não há outra alternativa agora."
33080-93 = "[s] \"Mas...!\""
33080-94 = "Sensei, a liderança de Trinity está praticamente dizimada neste momento. Sem a Irmandade e sem a Tea Party aqui..."
33080-95 = "Se acontecer alguma coisa com você também, Sensei, a situação ficará completamente fora de controle!"
33080-96 = "[s] \"...\""
33080-97 = "...Rezo pela sua segurança, Sensei. Nós vamos proteger esse caminho custe o que custar!"
33080-98 = "Sensei, depressa!"
33080-99 = "...Sensei!"
33080-100 = "P-Por favor! Vá agora, Sensei...!"
33080-101 = "[s] \"...\""
33080-105 = "[ns] Correr até a Hina."
33080-107 = "Chefe do Comitê Disciplinar...! Por favor, cuide do Sensei!"
33080-115 = "...Pode deixar."
33080-116 = "Sensei, não há como enfrentar aqueles monstros de frente agora. No momento, furar o cerco e escapar é—"
33080-117 = "Ngh...!"
33080-118 = "[s] \"Hina, os seus ferimentos...!\""
33080-119 = "Isso não é nada demais... Sensei, não se afaste de mim."
33080-120 = "Eu vou abrir a nossa rota de fuga à força."
