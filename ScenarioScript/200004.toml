[translation]
200004-1 = "Episódio 4; O Trapezoedro Reluzente"
200004-4 = "G-Gente......"
200004-5 = "Elas não tão demorando muito pra voltar, não?"
200004-6 = "...... Não faz nem três minutos que mergulharam."
200004-7 = "M-Mas debaixo d'água tudo pode acontecer......"
200004-8 = "E se uma correnteza forte levar elas embora?#nOu se algum bicho perigoso atacar?!"
200004-9 = "...... Não sei."
200004-10 = "Mas relaxa, aquelas duas sabem se virar muito bem."
200004-11 = ""
200004-15 = "...... Olha lá, o sinal."
200004-16 = "Qual é a posição do localizador?"
200004-17 = "Mil pés a sudeste."
200004-18 = "A correnteza levou elas pra longe pra caramba, hein.#nJá tá um breu danado, bora logo buscar elas."
200004-19 = ""
200004-22 = "Ufaaa......"
200004-23 = "...... Vocês saíram bem longe do ponto previsto. O que pegou?"
200004-24 = "Mal aí, gente! A correnteza tava mais puxada do que a gente imaginava.#nA gente se enrolou um pouco pra conseguir acertar o rumo."
200004-25 = "...... Vocês fizeram a descompressão direitinho?"
200004-26 = "Mas é claro! Quem você acha que eu sou?"
200004-27 = "Eu aguentaria de boa sem fazer descompressão nenhuma, mas......"
200004-28 = "Nem brinca com isso. No fundo do mar, qualquer bobeira pode dar ruim."
200004-29 = "Uuuugh......"
200004-30 = ""
200004-33 = "E aí, como é que tava lá dentro daquele \"navio naufragado\"?"
200004-34 = "Perda de tempo total. A carcaça já tá lá há tempo demais."
200004-35 = "Pô, viagem perdida de novo...... que droga."
200004-36 = "Ah, mas espera aí...... a gente achou uma coisa bem curiosa."
200004-38 = "Isso é...... um caco de vidro?"
200004-39 = "Parece mais duro que vidro...... e tem um formato bem bonito."
200004-40 = "Dá até pra ver um brilho saindo dele, não dá? Parece meio com uma joia!"
200004-41 = "Pior que é. Essa luz...... parece até o horizonte banhado pelo pôr do sol."
200004-42 = "...... É melhor não ficar encarando muito.#nVai saber que tipo de efeito esquisito isso pode ter."
200004-43 = "Minha pele vai acabar toda queimada......"
200004-46 = "E aí, até quando a gente vai ter que ficar nessa missão?"
200004-47 = "Vai começar a reclamar agora?"
200004-48 = "...... Até chegar uma nova ordem. A gente não pode simplesmente largar o osso e ir embora."
200004-49 = "Essa é a nossa missão, afinal de contas."
200004-50 = "Vou acabar parecendo uma uva-passa de tanto ficar na água......"
200004-51 = ""
200004-54 = "...... Chega por hoje.#nBora logo recolher as coisas e ir pra casa."
200004-55 = "Levando este―― \"Trapezoedro Reluzente\"."
