[translation]
200004-1 = "Эпизод 4;Сияющий трапецоэдр"
200004-4 = "Э-Эм..."
200004-5 = "Разве это не слишком долго?"
200004-6 = "Не прошло даже трёх минут с тех пор, как она нырнула."
200004-7 = "Н-Но в воде может случиться что угодно..."
200004-8 = "Её могло унести обратным течением... или атаковать какое-нибудь морское чудовище..."
200004-9 = "...То есть всё всегда может пойти не так."
200004-10 = "Но пока причин беспокоиться нет."
200004-11 = ""
200004-15 = "Вот сигнал."
200004-16 = "Где маяк?"
200004-17 = "Тысяча футов. Юго-восток."
200004-18 = "Дальше от места встречи, чем я ожидала. Темнеет — пойдём за ней."
200004-19 = ""
200004-22 = "Фух..."
200004-23 = "Ты всплыла довольно далеко от места, о котором мы договорились. Что-нибудь случилось?"
200004-24 = "Прости-прости. Течение оказалось немного сильнее, чем я ожидала. Я слегка потеряла направление."
200004-25 = "Декомпрессию провела правильно?"
200004-26 = "Ну хватит. Я вообще-то не новичок."
200004-27 = "Если бы это была я, я бы уже—"
200004-28 = "Осторожности не бывает слишком много. В тёмной воде может случиться что угодно."
200004-29 = "Бу-у..."
200004-30 = ""
200004-33 = "Удалось заглянуть внутрь затонувшего корабля?"
200004-34 = "Не-а, всё слишком сгнило. Наверное, он лежит там дольше, чем мы думали."
200004-35 = "Опять зря потратили время..."
200004-36 = "Но я всё-таки нашла там вот это."
200004-38 = "Что это? Осколок стекла?"
200004-39 = "Он прочнее стекла и слишком непрозрачный."
200004-40 = "Смотрите, он ещё и немного светится. Прямо как магический самоцвет."
200004-41 = "Будто кто-то заключил цвета сумерек прямо в камне."
200004-42 = "Мы не знаем, из чего он сделан, так что постарайтесь лишний раз его не трогать. Такое свечение может оказаться вредным или даже радиоактивным."
200004-43 = "И-и-и! А вдруг от него у нас кожа слезет?!"
200004-46 = "Эй, и сколько нам ещё этим заниматься?"
200004-47 = "А почему ты спрашиваешь?"
200004-48 = "Пока не получим новых приказов — продолжаем."
200004-49 = "Такова наша миссия."
200004-50 = "Мы с этой миссией до старости провозимся."
200004-51 = ""
200004-54 = "Ладно, на сегодня хватит. Возвращаемся."
200004-55 = "...И забираем с собой этот Сияющий трапецоэдр."
