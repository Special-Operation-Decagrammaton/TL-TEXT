[translation]
80000075-1 = "Дар волхва"
80000075-2 = "Давно заброшенный отель"
80000075-3 = "Получив взволнованное сообщение от Хиёри, я поспешил её найти."
80000075-4 = "С-Сенсей?"
80000075-5 = "Хи-хи... Вы правда пришли!"
80000075-6 = "Хм? Говорите, что всегда придёте, когда я вас позову, Сенсей?"
80000075-7 = "Ах, когда я это слышу, мне так спокойно и радостно..."
80000075-8 = "О, потому что иначе вы будете волноваться... Понятно."
80000075-9 = "Да, теперь понятно... Моя жизнь как старый убитый телефон... Вечно создаёт проблемы..."
80000075-10 = "[s1] «Сейчас ведь всё хорошо, правда?»\n[s2] «Ты сказала, что у тебя есть нечто потрясающее. Что именно?»"
80000075-11 = "О, точно. Это..."
80000075-12 = "О, точно. Это..."
80000075-13 = "Вот. Для вас."
80000075-14 = ""
80000075-16 = ""
80000075-18 = "[ns] «Это... шоколад?»"
80000075-19 = "Хи-хи... Сегодня ведь День святого Валентина, да?"
80000075-20 = "Вроде как нужно отдавать долги людям, даря им шоколад."
80000075-21 = "Н-Но если шоколада недостаточно, чтобы покрыть долг... Тогда надо отдавать другое — например сердце или другие органы..."
80000075-22 = "А-А если и этого не хватит? У меня есть только этот старый убитый телефон!"
80000075-23 = "О нет... Всё плохо! Я никогда не знала, насколько страшен День святого Валентина!"
80000075-24 = "Возврат долгов — просто прикрытие... Л-Люди используют его как повод делать всё что захотят!"
80000075-25 = "П-Почему моя жизнь... всегда такой бардак... Я просто н-неудачница. Всё кончено! УА-А-А!"
80000075-26 = "[s3] «Успокойся, Хиёри!»\n[s4] «День святого Валентина совсем не об этом!»"
80000075-27 = "Н-неужели?"
80000075-28 = "Н-неужели?"
80000075-29 = "Но у вас так много всего, Сенсей... Разве этот крошечный, потрёпанный, никудышный шоколад может вас впечатлить...?"
80000075-30 = "[s5] «Мне понравится любой твой подарок, Хиёри...»\n[s6] «Получить подарок от тебя — новый для меня опыт.»"
80000075-31 = "Правда...? Хорошо. Это хорошо. Это замечательно! Хи-хи..."
80000075-32 = "Правда...? Хорошо. Это хорошо. Это замечательно! Хи-хи..."
80000075-33 = "[s] «Но откуда у тебя шоколад?»"
80000075-34 = "О! Хи-хи. Я просто продала свою коллекцию журналов в пункт приёма макулатуры."
80000075-35 = "[s7] «Твои журналы, Хиёри?!»\n[s8] «Разве это не самое дорогое, что у тебя есть?!»"
80000075-36 = "А? Но я когда-нибудь... как-нибудь... смогу собрать ещё. Не то чтобы с ними было легко расстаться, но..."
80000075-37 = "А? Но я когда-нибудь... как-нибудь... смогу собрать ещё. Не то чтобы с ними было легко расстаться, но..."
80000075-38 = "Сегодня особый день, и я хотела что-нибудь вам подарить..."
80000075-39 = "Н-Не стоило? Я просто... потратила ваше время, доставила неудобства или..."
80000075-40 = "Так и есть, да? Я знала. Простите. Мне вообще н-не надо пытаться что-то делать. Всё, что я умею... УА-А-А!"
80000075-41 = "[s] «Я не это имел в виду! Перестань плакать!»"
80000075-42 = "*всхлип* Вы переживали, что подарок... слишком дорог для вас?"
80000075-43 = "Всё хорошо... Вообще-то именно потому, что он мне дорог, я и хотела отдать его вам."
80000075-44 = "Пусть я могу дать только такие мелочи, но я хочу отдавать вам всё, что могу, Сенсей."
80000075-45 = "[s] «Спасибо, Хиёри. Я с удовольствием его съем.»"
80000075-46 = "Не за что. Хи-хи-хи! Пожалуйста. Я так рада."
80000075-47 = ""
80000075-49 = ""
80000075-50 = "А, Сенсей? Почему вы теперь гладите меня по голове...?"
80000075-51 = "Сенсей? Сенсей...? Можете перестать так улыбаться и ответить?"
80000075-52 = "Э-э-э... Не то чтобы мне неприятно, но это ужасно смущает...!"
