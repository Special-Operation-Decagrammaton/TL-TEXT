[translation]
10047080-1 = "Эпизод 8;Встреча"
10047080-2 = "Значит... чтобы нарисовать магический круг, нам придётся приблизиться к общежитию Совета префектов."
10047080-3 = "Да... Это рискованно."
10047080-4 = "Хех, неожиданное испытание. Каждому главному герою приходится преодолевать несколько таких."
10047080-5 = "Главный герой ещё и знает, когда пора остановиться!"
10047080-6 = "Ню-ху-ху. Прости. В моей книге магии нет статьи «остановиться»."
10047080-7 = "Думаю, мы справимся, если оставим здание Совета напоследок."
10047080-8 = "Если станет опасно... я буду приманкой."
10047080-9 = "Если вороны и кошки помогут... мы найдём способ."
10047080-11 = "Каноэ...!"
10047080-12 = ""
10047080-14 = ""
10047080-15 = "Мастер. Думаете, нам стоит это сделать?"
10047080-16 = "[s1] «Да. Если это поможет исполнить все ваши мечты.»\n[s2] «Я помогу всем, чем смогу.»"
10047080-19 = "Как и ожидалось от персонажа поддержки, стоящего рядом с главным героем, и вдохновения для всех."
10047080-20 = "Похоже, я правильно вас оценила."
10047080-21 = "[s] «И главное — НЕ рисуйте ничем опасным.»"
10047080-22 = "Ню-ху-ху, конечно! Я не настолько безрассудна... дважды."
10047080-23 = "Хотя было бы потрясающе запустить всё с громким взрывом!"
10047080-24 = "Эри..."
10047080-25 = "Ахаха! Шучу, шучу! Правда!"
10047080-26 = "Тогда, как посоветовал Мастер, сделаем всё безопасно и используем безвредные инертные материалы."
10047080-27 = "Итак, начинается план по возрождению древнего магического круга Вайлдханта и исполнению мечтаний каждого!"
10047080-28 = "Я называю его «Операция: Вальпургиева ночь»!"
10047080-29 = "Угх, ну вот опять..."
10047080-31 = "Но чем рисовать? Нам понадобится очень много материала, если хотим обвести весь кампус..."
10047080-32 = "А если использовать школьные запасы, Совет префектов может что-то заподозрить."
10047080-33 = "В конце концов, мы ТОЛЬКО ЧТО влипли в неприятности. Нельзя выглядеть подозрительно..."
10047080-34 = "Не волнуйтесь. Я знаю способ... безопасно кое-что достать..."
10047080-35 = "[s] «Как?»"
10047080-36 = "Оставим это в секрете, Сенсей."
10047080-37 = "Потому что... мне кажется, так веселее. Хи-хи."
10047080-38 = "Это не будет опасно, уверяю... Не беспокойтесь."
10047080-39 = "Тогда... мы все снова встретимся перед операцией, Сенсей."
10047080-40 = "В ночь полной луны..."
10047080-41 = "Вальпургиеву ночь."
10047080-42 = "Хи-хи... Э-хе-хе-хе...!"
10047080-43 = "[ns] «Д-Да. Тогда до встречи.»"
10047080-45 = "Я вернулся в Шале."
10047080-48 = "На следующий день."
10047080-49 = ""
10047080-53 = "Солнце светило ярко..."
10047080-54 = "Тогда... давайте проведём встречу..."
10047080-55 = "Встречу?"
10047080-56 = "Раз ты президент Оккультного общества, тебе следует знать..."
10047080-57 = "Идём, Эри... Я покажу тебе новый мир..."
10047080-58 = ""
10047080-60 = ""
10047080-61 = ""
10047080-62 = ""
10047080-66 = ""
10047080-67 = "Мы кого-то ждём?"
10047080-68 = "Тс-с... Она идёт."
10047080-69 = ""
10047080-71 = ""
10047080-73 = ""
10047080-74 = ""
10047080-75 = "Стой. Одно движение — и я выстрелю."
10047080-76 = "Эм... А?!"
10047080-77 = "Боль проходит..."
10047080-78 = ""
10047080-81 = ""
10047080-82 = "Н-Но красота остаётся."
10047080-83 = "..."
10047080-84 = "Я пытаюсь найти решающие моменты жизни."
10047080-85 = "В этом мире нет ничего... без решающего момента..."
10047080-86 = "Ого, этот разговор просто переполнен магической силой!"
10047080-87 = "У-у-у..."
10047080-88 = "Не могу поверить, что она использовала секретную кодовую фразу. Почему именно я...?"
10047080-89 = "У меня срочная просьба."
10047080-90 = ""
10047080-92 = ""
10047080-93 = "Хорошо. Давай отойдём куда-нибудь в уединённое место..."
10047080-95 = ""
10047080-96 = "...Некоторое время нам лучше побыть одним."
10047080-97 = "Итак... Что тебе нужно?"
10047080-98 = "Пожалуйста, «посей» эти «семена» в отмеченных местах."
10047080-99 = "Мне нужно, чтобы всё было готово... к кануну ближайшего полнолуния."
10047080-100 = ""
10047080-102 = ""
10047080-103 = ""
10047080-105 = ""
10047080-106 = ""
10047080-108 = "Этого... да ещё СТОЛЬКО? Для чего?"
10047080-109 = "Хи-хи... Всё раскроется в своё время."
10047080-110 = "Это ведь не для чего-то опасного?"
10047080-111 = "Конечно нет."
10047080-112 = "Доверься мне. Как всегда, залог заплачу заранее..."
10047080-113 = ""
10047080-115 = ""
10047080-116 = ""
10047080-117 = "Хууу... Ладно. Сделаю."
10047080-118 = "Тогда... оставляю это тебе, Миё. Хи-хи..."
10047080-119 = "А! Тебя зовут Миё! Приятно познакомиться, Миё! Я Ширао Эри, но можешь звать просто Эри!"
10047080-120 = "А... Да. Приятно познакомиться."
10047080-121 = "Так, Миё. Ты часто занимаешься такими мутными сделками?"
10047080-122 = "Как-то так выходит..."
10047080-123 = "...*вздох* Но после этой брошу. На этот раз серьёзно."
10047080-124 = "Ну, заказ я получила, так что пойду..."
10047080-125 = ""
10047080-127 = ""
10047080-128 = ""
10047080-129 = "Она делает вид, что не хочет, но ей можно доверять — доведёт дело до конца..."
10047080-130 = "Миё проносит в Вайлдхант столько вещей... которые обычными путями сюда не попадут."
10047080-131 = "Как она проходит контрольные пункты Совета префектов? А! Это магия телепортации?"
10047080-132 = "Возможно..."
10047080-133 = "Хи-хи, раз мы закончили, вернёмся и расскажем остальным..."
10047080-135 = "Некоторое время спустя..."
10047080-136 = ""
10047080-137 = ""
10047080-138 = ""
10047080-139 = ""
10047080-140 = "Теперь, когда материалы обеспечены, остаётся только само дело."
10047080-141 = "Дата... ночь полной луны. Всего через несколько дней..."
10047080-142 = ""
10047080-144 = ""
10047080-145 = "Ты всё ещё сомневаешься, Рэна?"
10047080-146 = "...Я многое пережила вместе с вами, но это слишком опасно."
10047080-147 = "В прошлый раз нам повезло отделаться легко. Если продолжим нарушать правила, будут последствия. Вы хотя бы о моих оценках подумайте!"
10047080-148 = "Не можете остановиться? Есть и другие весёлые занятия. Не обязательно всё делать настолько... драматично."
10047080-149 = "Я полностью понимаю, что ты чувствуешь, но... здесь прямо перед нами НАСТОЯЩИЙ древний магический круг! И он исполняет желания!"
10047080-150 = "Как исследователь оккультизма я обязана довести это до конца."
10047080-151 = "А если это просто защитный оберег? Талисман?"
10047080-152 = "Я видела похожие узоры в древнем искусстве, и они были всего лишь украшением."
10047080-153 = "Представьте. Вы пройдёте через все эти сложности... а магии не будет."
10047080-154 = "Столько мучений, а в ЛУЧШЕМ случае снова окажетесь в Комнате размышлений."
10047080-155 = "Вы всё ещё думаете... что оно того стоит?"
10047080-156 = ""
10047080-158 = ""
10047080-159 = "Рэна... Почему, по-твоему, альпинисты лезут на гору...?"
10047080-160 = "Потому что... гора существует..."
10047080-161 = "Со мной так же. Причина, по которой я изучаю оккультизм... в том, что оккультизм существует."
10047080-162 = "Рэна, мне тоже страшно, как и тебе. Это И ПРАВДА опасно."
10047080-163 = "И всё же... даже провал того стоит. Мы ведь говорим о НАСТОЯЩЕЙ магии."
10047080-164 = "И она действительно может исполнить мечты каждого."
10047080-165 = "Искусство всегда развивалось только через большой риск и испытания."
10047080-166 = "Я считаю, этот риск ничем не отличается."
10047080-167 = "Разумеется, не каждый риск оправдывается. Некоторые попытки проваливаются и превращаются в полную катастрофу."
10047080-168 = "Но мы ещё даже не пробовали."
10047080-169 = "Именно поэтому я снова и снова без колебаний выхожу на сцену. Потому что знаю: только стараясь, я получу шанс создать нечто великое."
10047080-170 = "И кто знает? Может, наши желания действительно сбудутся."
10047080-171 = ""
10047080-173 = ""
10047080-174 = ""
10047080-175 = "*вздох* Ага, примерно такого ответа я и ожидала."
10047080-176 = "Ладно, теперь моя очередь."
10047080-177 = "...Я вас не ненавижу. Пусть мы постоянно влипаем в неприятности, вместе нам весело."
10047080-178 = "Но сколько ни думаю, это всё кажется неправильным."
10047080-179 = "...Я ведь даже не верю во всю эту оккультную чушь."
10047080-180 = ""
10047080-182 = ""
10047080-183 = "Поэтому... в этот раз я не участвую."
