[translation]
2004403-1 = "Пейсмейкер"
2004403-2 = "Добро пожаловать. Тренер. Я ждала вас!"
2004403-3 = "Тренер?"
2004403-4 = "[s] «Почему ты так на меня смотришь?»"
2004403-5 = "М-м. Надеюсь, мне показалось, но..."
2004403-6 = "Изменение небольшое, однако вы... слегка себя запустили?"
2004403-7 = "[s1] «Эм, не уверен? Может быть...»\n[s2] «Я иногда тайком перекусываю во время работы...»"
2004403-10 = "ПЕРЕКУСЫ!"
2004403-11 = "Вот оно. Коварный враг. Вот в чём проблема."
2004403-12 = "Не беспокойтесь! У нас есть наука, логика и технологии тренировок. Я приведу вас в форму!"
2004403-13 = "Итак! Начнём с индекса массы тела!"
2004403-20 = "Сумирэ потащила меня за собой, заставив держать электроды, пока проводила измерения."
2004403-22 = "Интересно..."
2004403-23 = "[s3] «К-как там, Сумирэ...?»\n[s4] «Это опасно для жизни?!»"
2004403-26 = "К счастью, вы в допустимых пределах, Тренер. Однако..."
2004403-27 = "Совсем немного, но я наблюдаю избыток жировой ткани! Видите?"
2004403-28 = "Всё нормально? Нет, вовсе нет, Тренер! Неужели не понимаете?"
2004403-29 = "Жир — по сути запасённое топливо. Избыточная энергия и резерв калорий."
2004403-30 = "То есть жир — это ткань тела, которая несёт надежды и мечты однажды стать мышцами!"
2004403-31 = "Следовательно, прямо сейчас ваше тело — источник нереализованного потенциала!"
2004403-32 = "Хватит терять время. Начинаем тренировку!"
2004403-33 = "[s] «Раз ты настаиваешь...»"
2004403-35 = "Закончили разминку, Тренер? Хорошо. Отлично."
2004403-36 = "[s] «А что за наряд?»"
2004403-37 = "О, эта старая штука?"
2004403-38 = "Хотя это можно считать моей рабочей формой..."
2004403-39 = "...время от времени я надеваю её просто потому, что... мне нравится."
2004403-40 = "Бочка весом 25 килограммов приятно бодрит."
2004403-41 = "Итак, для начала лёгкая разминка — пробежка на 10 километров!"
2004403-42 = "Я тоже побегу с вами! И с напитками!"
2004403-43 = "Обычно я бы начала с расслабленной прогулки на 20 километров..."
2004403-44 = "Но для вас это может быть многовато, поэтому начнём полегче."
2004403-45 = "[s] «Десять километров? Почему не пять?»"
2004403-46 = "Не говорите так. Мы в одной команде. Вы справитесь."
2004403-47 = "Итак, начинаем!"
2004403-50 = "В итоге я побежал по дорожке вместе с Сумирэ...!"
2004403-54 = ""
2004403-58 = "[ns] *пыхтит* *пыхтит* *пыхтит* *пыхтит*"
2004403-59 = "Продолжайте! Мы уже прошли чуть больше половины! Вперёд!"
2004403-60 = ""
2004403-62 = ""
2004403-69 = ""
2004403-73 = ""
2004403-74 = "Хм? Похоже, вы... упёрлись в плато. Почему бы мне не бежать впереди?"
2004403-75 = "Знаете, в беге есть такая роль — «пейсмейкер»."
2004403-76 = "Это партнёр, который подстраивает скорость, помогая другому бегуну раскрыть свой максимум."
2004403-77 = "Он принимает на себя встречный ветер, чтобы бегущий позади мог восстановить силы."
2004403-78 = "Кроме того, бег в таком строю даёт важную моральную поддержку по сравнению с одиночным бегом."
2004403-79 = ""
2004403-81 = ""
2004403-88 = ""
2004403-91 = ""
2004403-92 = "Так что не унывайте, Тренер! Я здесь. И веду вас вперёд!"
2004403-93 = "Я верю в вас! Мы закончим это вместе!"
2004403-94 = "[s] «Это... очень мило... но...!»"
2004403-101 = "И вот благодаря Сумирэ в роли пейсмейкера..."
2004403-102 = "Я действительно закончил 10-километровую пробежку!"
2004403-105 = "― [log=스미레 아르바이트]Отличная работа, Тренер![/log][wa:1790]"
2004403-107 = "― [log=스미레 아르바이트]Это был действительно потрясающий забег.[/log][wa:660]"
2004403-110 = "― [log=스미레 아르바이트]Вот, выпейте. Я смешала это для вас.[/log][wa:550]"
2004403-113 = "[ns] «Это... напиток?»"
2004403-115 = "― [log=스미레 아르바이트]Да. Усилия должны вознаграждаться.[/log][wa:1750]"
2004403-117 = "― [log=스미레 아르바이트]Получить заслуженную награду — естественно.[/log][wa:1500]"
2004403-120 = "― [log=스미레 아르바이트]Конечно, не каждый человек в этом мире...[/log][wa:1170]"
2004403-122 = "― [log=스미레 아르바이트]...получает добро, которого заслуживает.[/log]"
2004403-125 = "― [log=스미레 아르바이트]Но всё же...[/log][wa:1160]"
2004403-127 = "― [log=스미레 아르바이트]Я надеюсь, что люди, которые усердно трудятся, получают за это награду.[/log][wa:1740]"
2004403-130 = "― [log=스미레 아르바이트]Вот, пожалуйста. Наслаждайтесь.[/log][wa:1290]"
2004403-132 = "― [log=스미레 아르바이트]Я тоже выпью.[/log][wa:780]"
2004403-135 = "Тронутый добротой Сумирэ, я сделал глоток...!"
2004403-136 = ""
2004403-142 = "[ns5] «О-он такой густой?!»\n[ns6] «Сумирэ, что это...?»"
2004403-145 = "Да, Тренер."
2004403-146 = "Там куча белка!"
2004403-147 = "[s] «От него мне ещё сильнее захотелось пить!»"
2004403-148 = "Послушайте, Тренер. Это очень важно."
2004403-149 = "После тренировки вам нужен белок для максимального синтеза мышечной ткани!"
2004403-150 = "Более того, животный белок эффективнее растительного."
2004403-151 = "В частности, этот сывороточный белок быстро переваривается и усваивается, помогая растить крепкие мышцы!"
2004403-152 = "Так что пейте!"
2004403-153 = ""
2004403-155 = ""
2004403-156 = "[ns] «Не могу... Просто оставь меня здесь.»"
2004403-157 = "Т-Тренер? Может, вам лучше спортивный напиток без сахара? Там есть электролиты."
2004403-159 = "Да. Очень хорошо. Пейте медленно, чтобы не подавиться."
2004403-160 = ""
2004403-162 = ""
2004403-163 = "О, не нужно меня благодарить."
2004403-164 = "Вообще-то это МНЕ следует благодарить ВАС за то, что так хорошо держались на дорожке!"
2004403-165 = "Итак, Тренер!"
2004403-166 = "Давайте соберёмся и нарастим эти мышцы!"
2004403-167 = "[s] «Мы будем делать ЕЩЁ?!»"
2004403-168 = "Да. Вы разве не слушали?"
2004403-169 = "Это была разминка. Всего 10 километров!"
2004403-170 = ""
2004403-174 = "Оглядываясь назад, тренировки Сумирэ явно были эффективными..."
2004403-175 = "Но следующие несколько дней я не мог нормально двигаться от боли в мышцах."
