[translation]
11180-2 = "Episódio 18;Não Somos Amigas!"
11180-3 = "Lámen Shibasaki"
11180-4 = "Chegou!! Bom apetite!"
11180-5 = "U-Uma tigela para cada uma... Podemos mesmo nos dar a um luxo desses?"
11180-8 = "Vocês são amigas das meninas de Abydos, não são? Se quiserem mais macarrão, é só pedir."
11180-11 = "...?!"
11180-12 = "Que estranho não ter clientes num lugar tão gostoso assim."
11180-13 = "Não é por causa da localização? Fica perto de uma escola prestes a fechar."
11180-14 = "Bom, estando gostoso, por mim tudo bem. Então, bom apet..."
11180-15 = "...não somos."
11180-16 = "Hã?"
11180-17 = "Nós não somos amigas coisa nenhumaaaa!!"
11180-18 = "(Bam!)"
11180-19 = "Uau?!"
11180-20 = "Entendi!! Agora eu entendi o que estava me incomodando! O problema é este restaurante, é este lugar!!"
11180-21 = "?!"
11180-22 = "Como assim?!"
11180-23 = "Nós viemos para esta região a trabalho! No estilo hard-boiled!! Como verdadeiras fora da lei!!"
11180-24 = "E aí o que é este lugar?! Dá pra comer até encher a barriga!!#nÉ acolhedor e gentil! Ficam puxando assunto, num clima amigável, caloroso e reconfortante!"
11180-25 = "Ficando aqui, parece que todo mundo vai acabar virando amigão!!"
11180-26 = "E tem algum problema nisso?"
11180-27 = "Claro que tem!! Vira tudo uma bagunça sem pé nem cabeça!#nPara eu me tornar uma vilã de verdade, não preciso de um lugar como este!!"
11180-28 = "O que eu preciso é de frieza, crueldade e impiedade! Não desse clima aconchegante!!"
11180-29 = "Não, acho que você está pensando demais nisso..."
11180-30 = "..."
11180-31 = "Isso quer dizer que... devemos mandar este restaurante pelos ares, não é, Aru-sama?"
11180-32 = "...Hã?"
11180-33 = "(Saca algo)"
11180-34 = "Que bom, finalmente posso ser útil para a Aru-sama."
11180-35 = "Um detonador? Por que você está com isso..."
11180-36 = "Haruka, e-espera um pouc..."
11180-38 = "(Aperta)"
11180-39 = "..."
11180-40 = "...Hã?!"
11180-42 = "(KABOOOOOOOM!)"
11180-44 = "Explosão detectada à frente, num raio de 10 km! Está perto!"
11180-45 = "10 km... isso é na área urbana? Será um ataque?!"
11180-46 = "Pelo formato da onda de choque, parece ser uma reação em cadeia de bombas C4.#nNão é bombardeio nem artilharia... Vou verificar melhor!"
11180-47 = "...Local da explosão confirmado. É na área urbana!#nA posição exata é..."
11180-48 = "Lámen Shibasaki...?!"
11180-49 = "O Lámen Shibasaki desapareceu sem deixar vestígios!"
11180-50 = "Hã?! Como assim?! Por que diabos atacariam aquele restaurante?!"
11180-51 = "Não é um ponto estratégico nem uma rota importante. Quem faria isso..."
11180-52 = "S-Será que estavam atrás de mim...?"
11180-53 = "Podemos especular depois. Primeiro precisamos fazer alguma coisa!"
11180-54 = "Isso mesmo! Não é hora para isso!! Vamos para lá!"
11180-55 = "Eu aviso a Hoshino-senpai! Vamos partir!!"
11180-57 = "O q-que aconteceu?! Mestre... por favor, esteja bem...!"
11180-59 = "(Fumaça subindo...)"
11180-61 = "Cof, cof... Nossa, o prédio sumiu mesmo, né?"
11180-62 = "Cof... O que foi que..."
11180-63 = "(Olhos girando)"
11180-65 = "Próximo;Eu Não Vou Perdoar Vocês!"
