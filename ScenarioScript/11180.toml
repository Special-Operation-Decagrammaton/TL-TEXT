[translation]
11180-2 = "Эпизод 18;Мы им не друзья!"
11180-3 = "Рамэнная «Шиба Сэки»"
11180-4 = "Пришли! Пора загружаться углеводами!"
11180-5 = "И каждой по целой миске. Какая роскошь."
11180-6 = ""
11180-7 = ""
11180-8 = "Вы ведь подруги тех девочек из Абидоса? Если что-нибудь ещё понадобится, только скажите."
11180-9 = ""
11180-11 = "...?!"
11180-12 = "Этот рамэн такой вкусный. Почему сюда не ходит больше людей?"
11180-13 = "Может, им стоит переехать в место получше? Всё-таки они прямо рядом с разваливающейся школой."
11180-14 = "Наверное. Хотя мне всё равно, пока еда вкусная. Давайте есть..."
11180-15 = "Мы им не..."
11180-16 = "Хм?"
11180-17 = "Мы им не друзья!"
11180-18 = "*бахает по столу*"
11180-19 = "Что?!"
11180-20 = "Знаете, в чём моя проблема? Я поняла. В этом заведении!#nВот в чём моя проблема!"
11180-21 = "...?!"
11180-22 = "Да что на тебя нашло?!"
11180-23 = "Мы ведь приехали сюда работать, верно? Опасная, суровая, крутая работа! Как у настоящих преступников!"
11180-24 = "А что это за место? Маленькая уютная забегаловка, где тебя кормят, когда проголодаешься!#nЗдесь тепло, мягко, а люди относятся к тебе исключительно по-доброму!#nОни ещё и смеют вежливо с нами разговаривать!"
11180-25 = "Если будем продолжать сюда ходить, то станем друзьями и постоянными клиентами!"
11180-26 = "И...? Что в этом плохого?"
11180-27 = "Это всё портит! Как я вообще стану настоящей, стопроцентной злодейкой, если буду постоянно ходить в такую душевную семейную забегаловку?!"
11180-28 = "Мне сейчас нужны хладнокровная безжалостность и стальная решимость! А не вся эта сладость и пушистость!"
11180-29 = "Господи, не обязательно относиться к этому настолько серьёзно..."
11180-30 = "..."
11180-31 = "То есть... ты хочешь сказать, что это заведение должно исчезнуть, Ару?"
11180-32 = "А?"
11180-33 = "*пододвигается*"
11180-34 = "Я так рада. Наконец-то я смогу быть вам полезна."
11180-35 = "Эй, а что ты делаешь с этим детонатором?"
11180-36 = "Харука! П-подожди!"
11180-37 = ""
11180-38 = "*щелчок*"
11180-39 = "..."
11180-40 = "Э...?"
11180-42 = "*БА-БА-БА-БА-БАХ*"
11180-44 = "В радиусе десяти километров зафиксирован взрыв!"
11180-45 = "Десять километров? Это же центр города! Засада?!"
11180-46 = "Похоже, ударная волна возникла из-за цепной детонации C4. На обстрел не похоже, но я постараюсь выяснить подробности!"
11180-47 = "Взрыв действительно был в центре! Точное место..."
11180-48 = "«Шиба Сэки Рамэн»?!"
11180-49 = "«Шиба Сэки Рамэн» полностью уничтожен!"
11180-50 = "Что?! Н-не может быть! Зачем кому-то понадобилось атаковать это место?"
11180-51 = "Это не стратегический объект и не часть важного транспортного маршрута. Зачем кому-то...?"
11180-52 = "Нет... Неужели они целились в меня?!"
11180-53 = "Гадать будем потом. Нужно двигаться!"
11180-54 = "Она права! Сейчас не время! Немедленно идём туда!"
11180-55 = "Я сообщу Хошино. Давайте, вперёд!"
11180-56 = ""
11180-57 = "Н-не могу поверить! Очень надеюсь, что хозяин в порядке..."
11180-59 = "*фьюх*"
11180-61 = "*кашляет* Ого, вы только посмотрите. От здания вообще ничего не осталось."
11180-62 = "*кашляет* *кашляет* Что вообще произошло...?"
11180-63 = "*ошарашена*"
11180-65 = "Следующий Эпизод;Вы за это заплатите!"
