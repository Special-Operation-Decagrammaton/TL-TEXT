[translation]
34260-1 = "Эпизод 26;Наше будущее"
34260-3 = ""
34260-6 = "Все будьте внимательны! Следуйте указаниям Сэи, иначе заблудитесь в катакомбах!"
34260-7 = "Есть, госпожа!"
34260-8 = "Ичика, доложи. Сенсея уже нашли?"
34260-9 = "*ш-ш-ш* Да, мы нашли Сенсея! Но Цуруги немного... Ну..."
34260-10 = "Цуруги? Она в порядке?"
34260-15 = ""
34260-17 = "Цуруги, пожалуйста. Это стена, а не дверь."
34260-18 = ""
34260-21 = "Уф. Поздно."
34260-22 = ""
34260-24 = ""
34260-26 = "...Ке-ке-ке."
34260-27 = ""
34260-29 = ""
34260-30 = "Кья-а-а-а!"
34260-31 = ""
34260-35 = "[ns] «Цуруги...»"
34260-36 = "Что здесь делает Отряд правосудия?"
34260-37 = "Приветствую, Сенсей. Я Ичика из Отряда правосудия."
34260-38 = "Мы ненадолго встречались при аресте Общества гурманов, но не представлялись официально. Я пришла вас спасать!"
34260-39 = "[s] «Спасибо, Ичика. Рад снова тебя видеть.»"
34260-40 = "Хи-хи. Взаимно."
34260-41 = ""
34260-43 = ""
34260-44 = "Хасуми, докладывает Ичика. Сенсей и Мика у нас."
34260-45 = "*ш-ш-ш* Отличная работа. Как можно скорее отступайте в безопасную зону. Мы обеспечили маршрут через катакомбы."
34260-46 = "Всё по плану! Вы двое готовы? Кое-кто с нетерпением ждёт вашего безопасного возвращения."
34260-47 = ""
34260-50 = ""
34260-54 = ""
34260-55 = "Сенсей! Мика! Слава богу, вы не пострадали."
34260-57 = "Наги?! Как ты здесь оказалась? Я умерла?"
34260-59 = "Определённо нет. Сейчас ты стоишь в командном центре операции по освобождению Ариуса."
34260-60 = "Но... как?! Как вы прошли через катакомбы?"
34260-62 = "Я показала путь."
34260-63 = "[ns] «Сэя?!»"
34260-64 = ""
34260-66 = ""
34260-68 = ""
34260-69 = "С..."
34260-70 = "Сэя..."
34260-71 = "Ты правда дурочка, Мика."
34260-72 = "Как всегда, твоя импульсивность всё испортила. Я ведь всегда говорила, что это твоя худшая черта."
34260-73 = "А ты всегда такая вредина! Но ч-что произошло? Ты в порядке?"
34260-74 = "Это долгая история."
34260-75 = ""
34260-77 = ""
34260-79 = "Я встретила кое-кого во сне."
34260-80 = "Путешествие было долгим, но если вкратце — я заключила сделку и вырвалась из хватки Беатриче."
34260-83 = "Сэя...?!"
34260-84 = "*кашляет* *кашляет*"
34260-85 = "К-Капитан! Сэя... Сэя...!"
34260-86 = "Пожалуйста... Мне нужна Нагиса... И приведите сюда Сестринство и Отряд правосудия. Быстрее."
34260-87 = "Что? Х-Хорошо! Раз ты так говоришь!"
34260-88 = "Времени нет. Сенсей и Мика в смертельной опасности."
34260-90 = "Как только проснулась, я попросила позвать Сестринство, Рыцарей спасения и Отряд правосудия."
34260-91 = "Во время разговора Нагиса поклялась отказаться от всей своей власти, лишь бы мы смогли спасти тебя, Мика."
34260-93 = "Умоляю вас помочь мне. Пожалуйста, спасите Мику."
34260-94 = "Я также вас прошу."
34260-95 = ""
34260-97 = ""
34260-99 = "..."
34260-100 = ""
34260-101 = "Это..."
34260-102 = "Поднимите головы, Нагиса. Сэя. Вам не нужно перед нами кланяться."
34260-103 = "Я понимаю ситуацию Мики. Но, Сэя, я также рада видеть, что ты поправилась. Что произошло?"
34260-105 = "Это... долгая история..."
34260-106 = "...Понятно."
34260-107 = "Не стану расспрашивать. Пока."
34260-108 = "Важнее другое: безопасность Сенсея — главный приоритет. Сестринство поддержит операцию."
34260-109 = "В Тринити много студентов, которые обязаны Сенсею, включая меня. Они будут рады помочь."
34260-110 = "Спасибо. И, пожалуйста, берегите себя."
34260-115 = "Это всё, что я знаю об изменяющихся маршрутах катакомб."
34260-116 = "Наверное, тебе было нелегко. Спасибо, Азуса."
34260-117 = "Но... вы точно не можете взять меня тоже?"
34260-118 = "Тогда кто встретит Сенсея, когда мы вернёмся с победой?"
34260-119 = "Да и наша репутация долго не протянет, если нам снова понадобится помощь Клуба дополнительных занятий... особенно твоя на этой конкретной миссии."
34260-120 = "Даже Ханако остаётся здесь, чтобы поддержать нас так, как умеет лучше всего."
34260-121 = "Поверь в нас."
34260-122 = "Л-Ладно."
34260-123 = "Э-Эм..."
34260-124 = "Всё нормально. Что ты хотела сказать?"
34260-125 = ""
34260-127 = ""
34260-128 = "Пожалуйста, спасите Ацуко."
34260-129 = "Если я знаю Сенсея, Ацуко уже в безопасности. А мы проследим, чтобы в безопасности был и Сенсей."
34260-130 = "Спасибо. И... надеюсь, остальных тоже можно спасти."
34260-131 = "Даже несмотря на то, что они направляли оружие на тебя? На твоих друзей?"
34260-132 = "Даже так. Может, они злодейки, совершившие ужасные преступления..."
34260-133 = ""
34260-135 = ""
34260-137 = "Но они были моей семьёй."
34260-140 = "У-Ух... Ты вообще знаешь, который сейчас час?"
34260-141 = "Да. Настолько рано, что даже птицы ещё не проснулись. А теперь ищи эту карту, Уй."
34260-142 = "Секунду... Во что ты одета?"
34260-143 = "О, это? Я гуляла... то есть плавала, когда получила сообщение."
34260-144 = "Кажется, это не она. Перейдём к следующей странице."
34260-145 = "Так что из двух? Ты плавала или гуляла?"
34260-146 = ""
34260-148 = ""
34260-149 = "Стой! Вот она! Старая карта катакомб, оставленная тем древним Советом!"
34260-150 = "Э-Эта страница? Она вот-вот рассыплется... и ужасно выцвела..."
34260-151 = "Да, поэтому я и пришла к тебе, Уй. Ты Волшебница Старой библиотеки."
34260-152 = "Угххх, ар-р..."
34260-153 = "Ты ведь можешь её восстановить? Времени совсем нет."
34260-154 = ""
34260-156 = ""
34260-158 = "Я знаю, у тебя получится, Козэки! Я помогу всем, чем смогу! ♡"
34260-159 = "Ух... Как я вообще в это втянулась?"
34260-162 = ""
34260-163 = "Двигайтесь, двигайтесь! Нельзя терять ни секунды!"
34260-165 = ""
34260-166 = "Есть, госпожа!"
34260-167 = ""
34260-169 = ""
34260-171 = "Эм..."
34260-172 = "А? Ты... Кохару?"
34260-173 = "Д-Да! Я-я тоже из Отряда правосудия... но сейчас состою в Клубе дополнительных занятий, поэтому мне нельзя идти."
34260-174 = "Не могли бы вы передать это кому-нибудь высокопоставленному в Чаепитии? Пожалуйста?"
34260-175 = ""
34260-177 = ""
34260-178 = ""
34260-179 = ""
34260-180 = "Что это? Лента и несколько украшений?"
34260-181 = "Они принадлежат одной участнице Чаепития. Они лежали на складе контрабанды Отряда правосудия."
34260-182 = "А, теперь понятно. Они Мики, верно?"
34260-183 = "Я слышала, их украли и сожгли разъярённые студенты. Наверное, то, что удалось вернуть Отряду правосудия, смешалось с конфискованными вещами."
34260-184 = "Технически да. Я тайком откладывала вещи, которые были в приличном состоянии. Знаю, мне нельзя было так делать, но..."
34260-185 = "...Понятно. Хорошо, Кохару."
34260-186 = "Я передам их Мике."
34260-187 = "Правда? Спасибо!"
34260-188 = ""
34260-190 = ""
34260-197 = "Все..."
34260-198 = "Мы не можем во всём полагаться на Сенсея. Любые отношения должны работать в обе стороны."
34260-199 = "Поэтому мы сами пришли сюда спасти тебя, Мика."
34260-200 = "Ты правда такая самовлюблённая! Всё выставляешь настолько важным и сложным!"
34260-201 = ""
34260-203 = ""
34260-204 = "Я всегда хотела сказать тебе это прямо!"
34260-205 = "Но знаешь что? Ты мне очень нравишься, Сэя."
34260-206 = "...?"
34260-207 = "И Наги! Ты серьёзно? Ты притащила чай аж в район Ариуса?"
34260-208 = ""
34260-211 = ""
34260-213 = "Ты чайная наркоманка? У тебя серьёзная проблема?"
34260-214 = "Но именно такую Наги, вместе со всем её чаем, я люблю больше всего."
34260-216 = "Не знаю, как реагировать на такое заявление."
34260-217 = "...?"
34260-218 = ""
34260-220 = ""
34260-222 = "Вы мои самые любимые."
34260-223 = "Спасибо, что пришли за мной. И простите. Мне так, так жаль."
34260-224 = ""
34260-226 = ""
34260-228 = "Мика..."
34260-229 = "Хватит, Мика. Это я должна перед тобой извиниться."
34260-230 = "Всё это время я говорила себе, что жду идеального момента для извинений."
34260-231 = "Но на самом деле я вела себя по-детски. Просто избегала разговора."
34260-232 = "Мика. Когда ты сказала, что хочешь помириться с Ариусом—"
34260-233 = "Всё хорошо, Сэя. Ты ничего плохого не сделала."
34260-234 = "Во всём виновата я. Мне просто ужасно жаль."
34260-235 = "Мика..."
34260-236 = "Мика..."
34260-237 = ""
34260-239 = ""
34260-242 = ""
34260-243 = "Простите, что прерываю ваше воссоединение, но у меня есть кое-что для тебя, Мика."
34260-244 = "Для меня?"
34260-245 = "Вот."
34260-246 = ""
34260-248 = ""
34260-249 = "Это..."
34260-250 = ""
34260-252 = ""
34260-253 = "Мои украшения?! Откуда они у тебя? Я думала, их сожгли вместе со всем остальным!"
34260-254 = "Одна участница отвечала за склад контрабанды..."
34260-255 = "Ух, как бы объяснить...?"
34260-256 = "Тот студент собрал украшения, которые не сгорели, и спрятал их."
34260-257 = "Кохару...?"
34260-258 = "Да, это была Кохару."
34260-259 = "Ого! Ты знаешь Кохару?"
34260-260 = "...Да, знаю."
34260-261 = "Передай ей от меня спасибо. Не могу поверить, что она это сделала, хотя я всегда над ней издевалась."
34260-262 = ""
34260-264 = ""
34260-266 = "..."
34260-267 = ""
34260-269 = ""
34260-271 = "..."
34260-272 = "[ns] «Уверен, вам ещё многое нужно друг другу сказать.»"
34260-273 = "Ещё бы."
34260-274 = "Но пока, думаю, всем нам нужно успеть на одно слушание."
34260-275 = "Да."
34260-276 = "П-Подождите. Вы хотите, чтобы я пришла на слушание в таком виде?"
34260-277 = "Можно сначала принять душ? Я хочу обработать раны и привести волосы в порядок. С красивой плойкой!"
34260-278 = ""
34260-280 = ""
34260-281 = "..."
34260-282 = "..."
34260-283 = "Да, Мика. Красивую плойку тоже можно."
34260-284 = "Да, а потом мы втроём вместе пойдём на слушание. Хотя сейчас все выглядим немного потрёпанно."
34260-285 = ""
34260-286 = "[ns] «Я тоже пойду.»"
34260-288 = "Конечно. Мы ведь все обещали Мике присутствовать, правда?"
34260-290 = "Следующий эпизод;Эпилог"
