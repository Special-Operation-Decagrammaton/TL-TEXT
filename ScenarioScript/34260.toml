[translation]
34260-1 = "Episódio 26;Nós, Daqui em Diante"
34260-6 = "Vamos, pessoal! O caminho pelas Catacumbas é exatamente como a Seia-sama nos ensinou!"
34260-7 = "S-Sim...!!"
34260-8 = "Ichika, como estão as coisas por aí? Encontraram o Sensei?"
34260-9 = "Ah, sim! Encontramos.#nMas... a Tsurugi-senpai está..."
34260-10 = "...Hã? A Tsurugi?"
34260-17 = "Preciso que você se acalme, Tsurugi-senpai.#nIsso aí não é uma porta, é uma parede..."
34260-21 = "Ah, já era."
34260-26 = "...Hehehehehehe."
34260-30 = "Kyaaaaaaaaah!!"
34260-35 = "[ns] \"Tsurugi...\""
34260-36 = "...O Comitê de Justiça?#nP-Por que estão aqui...?"
34260-37 = "A-Ah... Olá, Sensei.#nSou a Ichika, do Comitê de Justiça."
34260-38 = "A gente chegou a se ver outro dia durante a prisão da Sociedade de Pesquisa Gourmet, mas... talvez você não se lembre... Como pode ver, viemos ajudar."
34260-39 = "[s] \"Sim, fico muito feliz em vê-la, Ichika.\""
34260-40 = "Ehehe... Fico feliz em poder cumprimentá-lo também, Sensei."
34260-44 = "Hasumi-senpai, garantimos a segurança do Sensei e da Mika-sama."
34260-45 = "Nesse caso, recuem imediatamente para a zona segura... Guiaremos o Sensei pela rota garantida nas Catacumbas!"
34260-46 = "Beleza, entendido! Vamos lá!#nTem gente esperando por vocês."
34260-55 = "Sensei...!! Mika-san...!! Que bom que estão a salvo!"
34260-57 = "N-Nagi-chan...?#nUé, por que você está aqui...?"
34260-59 = "Este é o quartel-general de comando da operação de restauração de Arius..."
34260-60 = "C-Como vocês chegaram até aqui...?"
34260-62 = "Fui eu quem ensinou o caminho."
34260-63 = "[ns] \"Seia...!!?\""
34260-69 = "Se..."
34260-70 = "Seia... chan..."
34260-71 = "Você é mesmo uma tola, Mika."
34260-72 = "Como de costume, age por impulso e acaba errando o caminho. Esse é o seu pior defeito."
34260-73 = "...Seia-chan.#nC-Como...?"
34260-74 = "...Receio que nos falte tempo para tecer todas as palavras agora."
34260-79 = "Por acaso, tive um encontro inesperado com certa pessoa dentro de um devaneio..."
34260-80 = "Seria uma longa história, então vou poupar os detalhes, mas... digamos que fizemos uma pequena negociação."
34260-83 = "S-Seia-sama...!?"
34260-84 = "Cof, cof..."
34260-85 = "C-Capitã! A Seia-sama...!!"
34260-86 = "Por favor. Tragam a Nagisa imediatamente... e chamem a Irmandade e o Comitê de Justiça aqui...!"
34260-87 = "Hã!?#nE-Entendido!!"
34260-88 = "Não há tempo... Precisamos ir até o Sensei e a Mika agora mesmo...!!"
34260-90 = "E foi assim que... convoquei a Irmandade, as Cavaleiras Socorristas e o Comitê de Justiça e os mobilizei até aqui."
34260-91 = "Uma coisa é certa — a Nagisa chegou a declarar que abriria mão de toda a sua autoridade se fosse para salvar a Mika, mobilizando todos ao nosso redor."
34260-93 = "...Eu lhes imploro, pessoal...#nPor favor, salvem a Mika-san..."
34260-94 = "Eu também peço."
34260-99 = "..."
34260-101 = "Não pode ser..."
34260-102 = "Ergam a cabeça, por favor, Nagisa-sama, Seia-sama.#nVocês não devem se curvar diante de nós."
34260-103 = "Compreendo a situação da Mika-sama.#nE... acima de tudo, é um alívio vê-la a salvo, Seia-sama. O que houve, afinal?"
34260-105 = "Isso... seria uma longa história..."
34260-106 = "...Compreendo."
34260-107 = "Nesse caso, deixemos isso para depois."
34260-108 = "Nossa maior prioridade é o Sensei.#n...Eu também darei o meu melhor."
34260-109 = "Em Trinity, não sou apenas eu; há muitas alunas que têm grande apreço pelo Sensei.#nTenho certeza de que elas irão cooperar."
34260-110 = "Sim... Conto com você."
34260-115 = "...Esses são todos os padrões de mudança das Catacumbas que eu conheço."
34260-116 = "Foi de grande ajuda. Muito obrigada, Azusa."
34260-117 = "Hum... Tem certeza de que tudo bem eu não ir junto?"
34260-118 = "Sim. Por favor, aguarde pelo Sensei aqui."
34260-119 = "Se precisarmos recorrer à ajuda do Clube de Aulas de Reforço nesta missão... especialmente à sua,#nnosso orgulho e nossa reputação ficariam abalados."
34260-120 = "Também estamos evitando incomodar demais a Hanako-san."
34260-121 = "Por favor, deixe que nós mesmas resolvamos isso."
34260-122 = "Entendo..."
34260-123 = "H-Hum..."
34260-124 = "...Há mais alguma coisa?"
34260-128 = "É que... por favor, salvem a Atsuko."
34260-129 = "Azusa... acredito que o Sensei já tenha salvado essa garota.#nNós estamos indo para salvar o Sensei."
34260-130 = "...Eu sei.#nMas... já que vão até lá, eu queria que as outras também... pudessem ser salvas em segurança..."
34260-131 = "...Entendo.#nMesmo depois de elas terem apontado suas armas contra você..."
34260-132 = "...Sim. Elas cometeram inúmeros erros irreparáveis."
34260-137 = "Mas... elas também foram a minha família..."
34260-140 = "U-Uuh... Que horas você acha que são agora...?"
34260-141 = "Ufufu, é a hora em que todas estão dormindo, não é, Ui-san?#nPoderia procurar naquela página ali para mim?"
34260-142 = "N-Não, espera... aliás, por que você está vestida desse jeito...?"
34260-143 = "É que eu também recebi a notícia de repente no meio de uma caminhada... digo, enquanto nadava..."
34260-144 = "Hum, será que é este? Vamos procurar na próxima página."
34260-145 = "Nadando...? A essa hora...?#nNão, espera, antes disso você não ia dizer caminhada!?"
34260-149 = "Espere! Aí, é isso mesmo!#nEncontramos! O mapa das Catacumbas deixado pelo antigo Concílio dos Santos!"
34260-150 = "E-Esta página aqui?#nEstá muito danificada e terrivelmente desbotada..."
34260-151 = "Sim, e é exatamente por isso que vim até aqui.#nAté você, Kozeki Ui-san, a chamada Maga da Biblioteca Antiga..."
34260-152 = "U-Ah, uuh..."
34260-153 = "Você consegue restaurar este mapa, não consegue?#nNão temos tempo."
34260-158 = "Posso pedir que comece a restaurá-lo agora mesmo, Ko-ze-ki-sen-pai?#nEu vou ajudar com todas as minhas forças."
34260-159 = "U-Uuh...#nPor que eu tenho que passar por isso...?"
34260-163 = "Vamos lá, andando! A ruína mais próxima é aquela ali!"
34260-166 = "S-Sim!"
34260-171 = "H-Hum...!"
34260-172 = "Ué? Você é... a Koharu...?"
34260-173 = "A-Auh... E-Eu também sou do Comitê de Justiça, mas...#nc-como agora estou no Clube de Aulas de Reforço, não posso ir em missão com vocês... então, hum, senpai..."
34260-174 = "Entregue isto... para aquela pessoa da Tea Party."
34260-180 = "...O que é isto?#nFitas e acessórios...?"
34260-181 = "Hum... São pertences pessoais dela... que tinham sobrado no depósito de itens confiscados do Comitê de Justiça."
34260-182 = "Ah... É verdade.#nSão os acessórios que a Mika-sama colecionava."
34260-183 = "Ué, mas... eu tinha ouvido falar que tinham sido queimados durante o tumulto... Estavam no depósito?"
34260-184 = "Ah, hum... Eu recolhi escondida os que ficaram intactos no meio do que sobrou do fogo...#nH-Hum... Eu sei que não devia ter feito isso, mas..."
34260-185 = "...Entendi.#nPode deixar comigo, Koharu."
34260-186 = "Vou entregar e avisar à Mika-sama."
34260-187 = "Auh... Muito... obrigada."
34260-197 = "Pessoal..."
34260-198 = "Nós tampouco podemos continuar apenas dependendo da força do Sensei.#nAfinal, uma relação ideal só se concretiza quando também somos capazes de iluminar o caminho à frente daquela pessoa."
34260-199 = "Por isso... viemos para salvá-la, Mika."
34260-200 = "...Seia-chan, como sempre, eu não entendo nada do que você diz.#nVocê é tão arrogante, me dá nos nervos do fundo do coração."
34260-204 = "Perdi a conta de quantas vezes quis te dar uma lição."
34260-205 = "— E ainda assim, eu te amo, Seia-chan."
34260-206 = "...Hã?"
34260-207 = "E a Nagi-chan é histérica demais!#nAliás, não acha meio absurdo não conseguir largar o chá preto nem num lugar desses?"
34260-213 = "É vício em cafeína? Ou transtorno obsessivo?"
34260-214 = "— Mas eu amo essa Nagi-chan mesmo assim."
34260-216 = "N-Não, isto é... só porque eu fiquei nervosa..."
34260-217 = "...Hã?"
34260-222 = "Sim... Eu amo vocês duas."
34260-223 = "Obrigada, vocês duas... e me desculpem..."
34260-228 = "Mika-san..."
34260-229 = "...Não, quem deve pedir desculpas sou eu.#n...Perdoe-me, Mika."
34260-230 = "Eu sempre quis pedir desculpas a você."
34260-231 = "Contudo, uma teimosia infantil me impediu de fazê-lo..."
34260-232 = "Mika... quando você disse pela primeira vez que queria se reconciliar com Arius, eu..."
34260-233 = "Não, não diga nada... Já está tudo bem."
34260-234 = "Me desculpe... A culpa foi minha..."
34260-235 = "Mika-san..."
34260-236 = "Mika..."
34260-243 = "Ah, hum... Desculpa interromper esse clima tão bom, mas...#ntenho uma coisa para entregar à Mika-sama."
34260-244 = "Para mim...?"
34260-245 = "Aqui..."
34260-249 = "...Isto é."
34260-253 = "Os meus... acessórios...?#nHã, como assim? Não tinham sido todos queimados...!?"
34260-254 = "Ah, hum... A encarregada da sala de controle de itens confiscados..."
34260-255 = "Hmm, é meio difícil de explicar, mas..."
34260-256 = "Parece que ela guardou os acessórios da Mika-sama que escaparam do fogo."
34260-257 = "A Koharu-chan...?"
34260-258 = "Isso, a Koharu... Espera,"
34260-259 = "Hãã!?#nVocê conhece a Koharu?"
34260-260 = "...Sim. Conheço."
34260-261 = "Obrigada, Koharu-chan...#nMesmo depois de eu ter sido tão cruel com você..."
34260-266 = "..."
34260-271 = "..."
34260-272 = "[ns] \"Seria bom vocês tirarem um tempo para conversar bastante sobre tudo.\""
34260-273 = "...Sim, parece que sim."
34260-274 = "Bem, vamos indo?#nJá não temos muito tempo até a audiência da Mika-san."
34260-275 = "Sim."
34260-276 = "Ah, não... Eu tenho mesmo que ir vestida assim?"
34260-277 = "Eu queria pelo menos trocar de roupa... e tratar esses machucados também.#nVou aparecer na frente de todo mundo, então preciso arrumar o cabelo de novo."
34260-281 = "..."
34260-282 = "..."
34260-283 = "Haa... Faça como quiser."
34260-284 = "Sim. Além do mais, nós três viramos a noite em claro, não podemos ir nesse estado..."
34260-286 = "[ns] \"Eu também vou com vocês.\""
34260-288 = "...É claro, Sensei.#nAfinal, comparecer à audiência todos juntos é a nossa promessa."
34260-290 = "Próximo;Epílogo"
