[translation]
10059090-1 = "Episode 9;Negotiations Failed"
10059090-5 = "I had higher expectations for an academy's armed organization... but you're nothing special."
10059090-6 = "Don't let your guard down. That's your bad habit."
10059090-7 = "Don't let your guard down. That's your bad habit."
10059090-8 = "Stop saying the same thing, both of you!"
10059090-11 = "Those guys... they're actually talking down to us right to our faces...!"
10059090-12 = "I have heard of them before. #nThe Broker's direct subordinates are all hand-picked elites."
10059090-13 = "They say he only gathers people skilled enough to command an exceptional salary."
10059090-14 = "Hey, you know why we keep our faces hidden?"
10059090-15 = "Every one of us has a massive bounty on our heads. #nAnyone familiar with the underworld would recognize us just by looking."
10059090-16 = "The only one who put a price on us that matched our true worth was the Boss."
10059090-17 = "The Boss's organization isn't just for anyone. #nYou could say it's the top-tier corporation of the underworld."
10059090-18 = "So, what's your pay like? #nDo you get at least half of what we make?"
10059090-19 = "Shut up! Don't assume we're in the Dormitory Guard just for the money!"
10059090-20 = "...Since you've been so accommodating, shall we take this a bit more seriously?"
10059090-21 = "Agreed. I think we've held back enough."
10059090-29 = "...The Dormitory Guard situation is taking longer than expected."
10059090-30 = "According to our projections, it should have been settled by now..."
10059090-31 = "It seems they aren't just mere foot soldiers."
10059090-32 = "..."
10059090-33 = "Heh heh heh, we are all warriors worth a thousand!"
10059090-34 = "We are capable of going toe-to-toe with the armed forces of a large-scale academy."
10059090-35 = "You can't survive if you aren't strong. This world is survival of the fittest...!"
10059090-36 = "The ones you are opposing are led by such elites—our Boss! #nYou have no chance of winning!"
10059090-37 = "Come now, it's not too late yet. #nIf you quietly bow down and accept our terms—!"
10059090-38 = "In the way."
10059090-43 = "Gah...!"
10059090-48 = "You talk too much."
10059090-49 = "Time is money, after all."
10059090-50 = "[s] \"You really do think about everything in terms of money, don't you?\""
10059090-51 = "That's how I've lived my life."
10059090-52 = "[s] \"There are some things in this world that money can't solve.\""
10059090-53 = "..."
10059090-57 = "And so?"
10059090-58 = "That is the most annoying thing I've heard all day."
10059090-59 = "As a favor, I'll put you out of your misery right now."
10059090-60 = "You guys, block the escape route."
10059090-61 = "You're going to pay me back for making me angry, with interest."
