[translation]
10041020-1 = "Эпизод 2; Естественное разделение труда"
10041020-8 = ""
10041020-9 = "...Фух."
10041020-10 = "Вот мы и здесь. Похоже, ровно вовремя."
10041020-11 = "Я уже вижу студентов Тринити. Хм, можно просто подойти, присоединиться к ним и повести группу."
10041020-12 = "Хотя вести их, одновременно представляя Чаепитие И следя, не происходит ли чего подозрительного, может быть многовато..."
10041020-13 = ""
10041020-15 = ""
10041020-16 = "Но если я хочу снова научиться доверять самой себе..."
10041020-17 = "Ну..."
10041020-18 = ""
10041020-22 = "А? Вот ты где! Мы тебя повсюду искали!"
10041020-23 = ""
10041020-25 = ""
10041020-26 = ""
10041020-30 = ""
10041020-31 = "А ВОТ и наша важная гостья из Чаепития!"
10041020-32 = "Осматривайся сколько хочешь, но, пожалуйста, не уходи без нас. Мы твои телохранительницы."
10041020-33 = "Конечно, я не жду, что здесь случится что-то серьёзное, особенно рядом с площадкой Выставки..."
10041020-34 = "Но у нас есть работа, так что, пожалуйста, сообщай нам, если соберёшься куда-нибудь идти."
10041020-36 = "Ах, прошу прощения. Я на мгновение заблудилась."
10041020-37 = ""
10041020-39 = ""
10041020-40 = "Минутку. А где Сенсей...?"
10041020-41 = ""
10041020-44 = ""
10041020-45 = "Мастер? Мастер..."
10041020-47 = "(...«Мастер»...?)"
10041020-49 = ""
10041020-50 = "А-Асуна...! Сейчас нужно говорить «Сенсей», а не «Мастер»...!!"
10041020-52 = "(...Хм?)"
10041020-53 = "(Сенсей... чем же вы тут занимались...?)"
10041020-54 = ""
10041020-57 = ""
10041020-58 = "А, точно! СЕНСЕЙ только что ушёл вести другую группу студентов Тринити."
10041020-59 = "Да, Сенсей только что вызвался быть их гидом."
10041020-60 = "Странно. Я думала, ты узнаешь об этом раньше нас."
10041020-61 = ""
10041020-64 = ""
10041020-66 = "...? Сенсей ушёл их сопровождать?"
10041020-67 = ""
10041020-69 = ""
10041020-70 = "А-а, да. Я ведь... в каком-то смысле сама об этом попросила."
10041020-71 = ""
10041020-73 = ""
10041020-75 = "Но всё же, чтобы Сенсей сопровождал их без меня..."
10041020-76 = "...разве это не моя обязанность?"
10041020-77 = ""
10041020-79 = ""
10041020-81 = "Ну, Сенсей наверняка знает, как лучше."
10041020-82 = "Хм? Что такое?"
10041020-83 = "У тебя обеспокоенный вид. Ты хорошо себя чувствуешь?"
10041020-84 = "Ничего. Если уж на то пошло, в каком-то смысле мне даже стало легче."
10041020-85 = "Что ж, раз сейчас я, похоже, свободна..."
10041020-86 = ""
10041020-88 = ""
10041020-89 = "...позвольте воспользоваться вашим гостеприимством. Уверена, экскурсия будет замечательной."
10041020-91 = "Ещё бы!"
10041020-92 = "Кстати, сейчас ты их не видишь, но здесь есть и другие участницы, которые незаметно нас поддерживают."
10041020-93 = ""
10041020-97 = ""
10041020-98 = "Вы меня звали? Я как раз была в режиме ожидания."
10041020-99 = "Нет, Токи. Пожалуйста, сосредоточься на остальных задачах."
10041020-100 = "Ах..."
10041020-101 = ""
10041020-103 = ""
10041020-104 = ""
10041020-105 = ""
10041020-107 = ""
10041020-108 = ""
