[translation]
1013406-1 = "Когда начинается волшебство"
1013406-2 = "...сэй."
1013406-3 = "...?"
1013406-4 = "Мне показалось, что я откуда-то услышал голос Арис."
1013406-5 = ""
1013406-8 = "...Сенсей?"
1013406-9 = "Но нигде её не видел."
1013406-10 = ""
1013406-13 = "Сенсей! Сюда!"
1013406-14 = "[ns1] Посмотреть в сторону голоса.\n[ns2] Посмотреть в окно."
1013406-19 = "― [log=아리스 결전]Хи-хи. Сенсей, вы удивились? [/log][wa:2850]"
1013406-21 = "― [log=아리스 결전]Я позвала вас, потому что хотела вместе посмотреть на ночное небо.[/log][wa:2180]"
1013406-24 = "― [log=아리스 결전]Разве оно не прекрасное?[/log][wa:3500]"
1013406-27 = "― [log=아리스 결전]Я уверена, что в этом мире,[/log]"
1013406-29 = "― [log=아리스 결전]и даже во всех мирах, где мне ещё предстоит побывать,[/log]"
1013406-32 = "― [log=아리스 결전]наверняка есть множество[/log][wa:580]"
1013406-34 = "― [log=아리스 결전]прекрасных вещей, таких же, как эта.[/log]"
1013406-37 = "― [log=아리스 결전]Поэтому это так странно.[/log][wa:3570]"
1013406-40 = "― [log=아리스 결전]Когда в мире столько красоты...[/log][wa:630]"
1013406-42 = "― [log=아리스 결전]Почему люди решают сражаться?[/log]"
1013406-45 = "― [log=아리스 결전]Как звёзды, которыми усеяна ночь,[/log][wa:460]"
1013406-47 = "― [log=아리스 결전]я уверена, что мир[/log]"
1013406-50 = "― [log=아리스 결전]полон более чем достаточным количеством[/log]"
1013406-52 = "― [log=아리스 결전]прекрасных вещей, которыми хватит поделиться со всеми.[/log][wa:1940]"
1013406-55 = "― [log=아리스 결전]...Мне и правда трудно это понять.[/log][wa:3600]"
1013406-59 = ""
1013406-60 = "Хи-хи, а вот и я."
1013406-61 = "...Апчхи!"
1013406-62 = "[s3] «Арис, ты в порядке?! Тебе холодно?!»\n[s4] «Ты не простудилась?!»"
1013406-65 = "Не волнуйтесь! Я ещё ни разу не простужалась!"
1013406-66 = "Ах, рука Сенсея."
1013406-67 = ""
1013406-69 = ""
1013406-70 = ""
1013406-71 = "Такая тёплая и приятная. Хи-хи."
1013406-73 = "Я обнимал Арис, пока не почувствовал, что она согрелась, и она постепенно уснула."
1013406-74 = "...Потом я отнёс крепко спящую Арис обратно в кровать."
