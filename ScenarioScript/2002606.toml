[translation]
2002606-1 = "Источник недовольства"
2002606-2 = "Исполнительный офис Шале"
2002606-3 = "В день дежурства Минори в Шале..."
2002606-4 = ""
2002606-6 = ""
2002606-7 = ""
2002606-8 = "Хм..."
2002606-9 = "Хмммммммм..."
2002606-10 = "[s] «Что-то не даёт тебе покоя?»"
2002606-11 = "А, простите! Я не пытаюсь саботировать работу Шале своим мычанием."
2002606-12 = "Просто... кое о чём задумалась."
2002606-13 = "[s] «Хочешь поговорить об этом?»"
2002606-14 = "Вообще-то это связано с вами, [USERNAME] Сенсей."
2002606-15 = "[s] «Вот как...?»"
2002606-16 = "Помните, мы говорили в MomoTalk о том, как сделать всех в Кивотосе счастливыми?"
2002606-17 = "Знаете, страдания общества можно проследить до буржуазии, которая монополизирует ценные ресурсы, например пудинг."
2002606-18 = "Но пудинга всё-таки конечное количество, а некоторые ресурсы более... нематериальны."
2002606-19 = "Вот я и задумалась, как следует распределять такой ресурс."
2002606-20 = "[s] «Тут тебе придётся объяснить подробнее.»"
2002606-21 = "Вы знаете, сколько студентов хотят попасть в график дежурств Шале?"
2002606-22 = "Дежурство здесь означает провести время с вами наедине, Сенсей, да и сама работа довольно лёгкая. Поэтому так много студентов записываются."
2002606-23 = "В каком-то смысле график дежурств Шале — нематериальный ресурс, который делает людей счастливыми!"
2002606-24 = "Конечно, ваше время не бесконечно. Поэтому дежурства распределяются между студентами неравномерно, и лишь некоторые получают больше одного."
2002606-25 = "Разве это не разновидность монополии? Маленькая группа получает всё ваше внимание. Это социальное неравенство!"
2002606-26 = "[s] «Н-Наверное...»"
2002606-27 = "В отличие от пудинга, ваше время невозможно распределить поровну."
2002606-28 = "Даже если мы поделим дежурства Шале совершенно поровну, студентов настолько много, что некоторые успеют выпуститься, прежде чем вообще встретятся с вами."
2002606-29 = "Или можно каждый день назначать в Шале пару сотен студентов..."
2002606-30 = "[s1] «В офисе столько места нет...»\n[s2] «Будет хаос. Никто ничего не сделает.»"
2002606-33 = "Верно. Стоит ли делать всех счастливыми ценой того, что Шале не сможет выполнять свою работу?"
2002606-34 = "Но вся проблема в том, что вы один, а нас много."
2002606-35 = "Идеальным решением было бы разделить Сенсея на несколько частей и распределить вас..."
2002606-36 = "[s3] «Какая страшная идея!»\n[s4] «Даже ДУМАТЬ об этом не надо!»"
2002606-39 = "Ха-ха-ха! Шучу, шучу."
2002606-40 = "Такое решение никого не сделало бы счастливым."
2002606-41 = "Если бы сделать всех счастливыми было так просто, моим товарищам из Академии Красной Зимы не пришлось бы продолжать нашу праведную борьбу."
2002606-42 = "[ns] «Понимаю, к чему ты ведёшь, Минори.»"
2002606-44 = "[ns5] «Но не думаю, что одного дня со мной достаточно, чтобы сделать всех счастливыми.»\n[ns6] «Кажется, некоторые студенты даже рады, когда их не выбирают на дежурство...»"
2002606-47 = "Нет, такого не может быть!"
2002606-48 = "Даже я чувствую себя спокойнее и счастливее рядом с вами."
2002606-49 = "Если бы могла, я бы каждый день брала вас с собой на стройку—"
2002606-50 = ""
2002606-52 = ""
2002606-54 = ""
2002606-56 = "А, что я такое говорю?!"
2002606-57 = "Я понимаю, что это личный разговор, но как президент Трудовой партии обязана подавать пример пролетариату..."
2002606-58 = "А сама тут думаю о том, чтобы монополизировать вас, как какая-то грязная буржуйка!"
2002606-59 = "[s] «Не думаю, что тебе есть о чём беспокоиться...»"
2002606-60 = "В последнее время я провожу всё больше времени с... капиталистами. Неужели их жадность заразила и меня?"
2002606-61 = "Сенсей, мне необходимо провести сеанс самокритики!"
2002606-62 = "Пожалуйста, сядьте там и наблюдайте. И не стесняйтесь со всей суровостью порицать меня за то, в чём я сейчас признаюсь!"
2002606-63 = "[ns] «Это правда необходимо...?»"
2002606-66 = "Некоторое время я сидел и слушал красноречивую самокритику Минори."
