[translation]
1006108-1 = "Доказательство добрых намерений"
1006108-2 = "В назначенное Сакурако время я пришёл в парк за собором."
1006108-3 = "Парк был пуст, но вскоре я заметил приближающуюся Сакурако."
1006108-4 = ""
1006108-6 = ""
1006108-7 = "Большое спасибо, что согласились на мою просьбу, Сенсей. Прошу, идите за мной, я всё объясню по дороге."
1006108-8 = "Я надеялась решить проблему самостоятельно, но..."
1006108-9 = "Похоже, она лишь продолжает разрастаться, поэтому мне нужна ваша помощь."
1006108-10 = "[s1] «Я рад, что ты обратилась ко мне. Что случилось?»\n[s2] «Что значит „разрастается“?»"
1006108-13 = "Да. Я быстро объясню."
1006108-14 = "Недавно..."
1006108-15 = ""
1006108-17 = ""
1006108-18 = ""
1006108-20 = "Я заметила, что некоторые недоразумения достигли такой степени, что больше игнорировать их нельзя."
1006108-21 = ""
1006108-24 = "[ns3] «А. Да. Понятно. Да.»\n[ns4] «Этот день наконец настал.»"
1006108-25 = ""
1006108-26 = ""
1006108-28 = ""
1006108-29 = "Хм. Похоже, вы совсем не удивлены. Вы ожидали этого, Сенсей?"
1006108-30 = "Мы уже говорили о том, что некоторым другим сёстрам неловко рядом со мной."
1006108-31 = "Раньше я считала, что дело просто в моём положении, которое требует определённой строгости, и потому не вмешивалась."
1006108-32 = "Ну, если не считать нескольких попыток следить за трендами."
1006108-33 = "Но недавно я кое-что поняла. Дело не только в том, что другим неловко и им трудно общаться со мной..."
1006108-34 = "Возможно, они действительно меня боятся."
1006108-35 = "О, вы думаете, я слишком далеко зашла в своих выводах?"
1006108-36 = "Хм... Хотела бы я, чтобы вы были правы, но не думаю."
1006108-37 = "Я считаю это очень серьёзной проблемой. Я хочу, чтобы все сёстры чувствовали в соборе спокойствие и уют."
1006108-38 = "Поэтому, разумеется, я решила разобраться. Я не хотела действовать, основываясь на ложном впечатлении."
1006108-39 = "Я даже несколько раз отводила сестру в тихое место, чтобы поговорить с ней один на один."
1006108-40 = ""
1006108-43 = "[ns5] «...А? Ты что сделала?»\n[ns6] «Кажется, ты могла сделать только хуже...»"
1006108-46 = "К сожалению... да. Как вы, вероятно, и предположили, действуя в одиночку, я лишь усугубила проблему."
1006108-47 = "По какой-то причине эта конкретная проблема оказалась за пределами моих возможностей. Поэтому я и пришла к вам за помощью."
1006108-48 = "Как сестре, мне не следовало бы так поступать. Я должна сама отвечать за свои недостатки, а не перекладывать их на учителя."
1006108-49 = "Однако... Иногда важнее найти решение, чем цепляться за собственную гордость."
1006108-50 = "И это как раз один из таких случаев. По крайней мере, я так считаю."
1006108-51 = "Поэтому, Сенсей. Я понимаю, что моя просьба неразумна, но..."
1006108-52 = "И всё же..."
1006108-53 = "Вы поможете мне?"
1006108-54 = "[s7] «Конечно. Нет ничего плохого в том, чтобы просить о помощи.»\n[s8] «Нужно быть мудрой и смелой, чтобы признать, что с чем-то не справляешься.»"
1006108-57 = "Сенсей..."
1006108-58 = "Спасибо. Я не ожидала услышать от вас такие слова."
1006108-59 = "Именно от вас... Это действительно приносит облегчение."
1006108-60 = "Я была готова сделать всё сама на случай, если сегодня вы окажетесь заняты, но так будет лучше."
1006108-61 = "[s] «...»"
1006108-63 = "[ns] «Подожди. Сделать что именно?»"
1006108-64 = ""
1006108-66 = ""
1006108-67 = "Все уже ждут, Сенсей. Пойдёмте скорее."
1006108-68 = "Прошу, следуйте за мной. Если это скажете вы, я знаю, что все поверят от чистого сердца."
1006108-69 = ""
1006108-71 = ""
1006108-81 = "[ns9] «С-Сакурако? Что?»\n[ns10] «Почему здесь все сёстры?»"
1006108-82 = ""
1006108-83 = ""
1006108-86 = ""
1006108-87 = "Сёстры, благодарю вас за то, что нашли время в своих плотных графиках и собрались здесь сегодня. Как видите, я привела с собой Сенсея."
1006108-88 = "Сенсей, пожалуйста, помогите мне успокоить всех..."
1006108-89 = "И объяснить, что я..."
1006108-91 = "Не подозрительная!"
1006108-92 = "[s11] «П-подожди! Сакурако! Стой!»\n[s12] «Может, это не лучший способ—»"
1006108-95 = "Нам очень повезло, что сегодня Сенсей здесь и может поговорить с нами."
1006108-98 = ""
1006108-99 = ""
1006108-100 = "Сенсей пришёл сказать несколько слов, которые должны нас успокоить!"
1006108-101 = "Пожалуйста, слушайте внимательно и вдумчиво."
1006108-102 = ""
1006108-105 = "Хи-хи..."
1006108-106 = "Итак, Сенсей!"
1006108-107 = "Пожалуйста, начинайте. Спасибо."
1006108-108 = ""
1006108-112 = "Несмотря на сомнения, в итоге мне пришлось произнести речь о том, насколько Сакурако надёжна и совсем не страшна."
1006108-113 = "Сакурако явно осталась довольна и всё это время улыбалась, но..."
1006108-114 = ""
1006108-117 = "Недоразумений стало лишь ещё больше."
