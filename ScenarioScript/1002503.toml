[translation]
1002503-1 = "Как неудобно быть маленькой!"
1002503-2 = "Прочитав последнее сообщение Шун в MomoTalk, я сразу побежал в Сад цветущей сливы."
1002503-5 = "Сад цветущей сливы Шаньхайцзина"
1002503-7 = "[ns] «Шун, где ты?»"
1002503-8 = "Я здесь, наверху..."
1002503-9 = ""
1002503-13 = "[ns] «Я тебя не вижу...»"
1002503-14 = "Нет, не там. На шкафу для хранения почти под потолком."
1002503-15 = ""
1002503-19 = ""
1002503-20 = "Шун дрожала на вершине шкафа, словно кошка на дереве."
1002503-21 = "[s] «Почему ты там наверху?»"
1002503-22 = "Я, как обычно, хотела убрать игрушки до возвращения детей..."
1002503-23 = "...но когда забралась сюда, поняла, что слишком высоко. Обычно я легко достаю до таких мест, но теперь не могу спуститься."
1002503-24 = "И долго ты ещё будешь стоять и смотреть? Помоги мне спуститься, Сенсей."
1002503-25 = "[s] Поднять Шун и поставить на пол."
1002503-26 = ""
1002503-28 = ""
1002503-30 = "У-Ух. До того как я стала маленькой, добираться куда нужно было гораздо проще."
1002503-31 = "Оказывается, это крошечное тело всё-таки довольно неудобное."
1002503-32 = "В любом случае, наверху ещё много игрушек, которые я не смогла разобрать. Не знаю, что делать."
1002503-33 = "[s] «Может, я просто расставлю их за тебя?»"
1002503-34 = "Здесь столько разных игрушек, и их нужно сортировать по возрасту. Я же не могу по одной называть тебе категорию каждой — слишком хлопотно."
1002503-35 = "Вот бы был какой-нибудь другой способ доставать до самых высоких мест."
1002503-36 = ""
1002503-37 = "Подожди, я знаю один способ!"
1002503-38 = "Сенсей, дай мне сесть тебе на плечи!"
1002503-39 = "Если я встану тебе на плечи, то без проблем справлюсь."
1002503-40 = "Скорее..."
1002503-41 = "[s] Посадить Шун себе на плечи."
1002503-42 = ""
1002503-44 = ""
1002503-46 = "Ух ты! Как высоко! Такое чувство, что я вижу даже выше, чем при своём прежнем росте!"
1002503-47 = "Отсюда я смогу разобрать даже корзины на самом верху."
1002503-48 = ""
1002503-49 = "О-Ой, Сенсей! Держи меня крепче, иначе я упаду!"
1002503-51 = "Некоторое время я помогал Шун убираться в Саду цветущей сливы, пока она сидела у меня на плечах."
1002503-53 = "Мы наконец закончили уборку!"
1002503-54 = "Спасибо, что помог мне, Сенсей."
1002503-55 = "Я просидела у тебя на плечах полдня. Я ведь не была слишком тяжёлой?"
1002503-56 = "[s] «Ты сейчас намного легче обычного, так что проблем не было.»"
1002503-57 = "Понятно. Какое облегчение..."
1002503-58 = ""
1002503-59 = "...хотела бы я сказать, но что это вообще значит? Ты намекаешь, что раньше я была тяжёлой?"
1002503-60 = "[s1] «Н-Не это я имел в виду.»\n[s2] «Да.»"
1002503-61 = "Как грубо!"
1002503-62 = "...!"
1002503-63 = "Я сейчас очень на тебя обиделась!"
1002503-64 = "Ты за это заплатишь, Сенсей [USERNAME]!"
1002503-65 = ""
1002503-67 = ""
1002503-68 = ""
1002503-69 = "А теперь будем играть в «Выше и выше»."
1002503-70 = "[s] «Выше и выше»?"
1002503-71 = "Да, ты держишь меня под мышками и поднимаешь высоко вверх."
1002503-72 = "Я играю так с детьми из Сада цветущей сливы, когда они дуются. Ты задел мои чувства, так что теперь обязан поиграть так со мной."
1002503-73 = "Только не говори, что я слишком тяжёлая и ты не сможешь, ладно?"
1002503-74 = "[s3] Подхватить Шун под мышки и поднять вверх.\n[s4] «Одна порция „Выше и выше“ уже готова.»"
1002503-77 = ""
1002503-78 = ""
1002503-85 = ""
1002503-87 = "Хи-хи. Иногда приятно самой оказаться на другой стороне этой игры."
1002503-88 = "Теперь я понимаю, почему она так поднимает детям настроение."
1002503-89 = "А? Ты куда?"
1002503-90 = "Я ещё не перестала на тебя злиться!"
1002503-91 = ""
1002503-93 = ""
1002503-94 = ""
1002503-95 = "Ты должен продолжать поднимать меня, пока я совсем не перестану злиться. ♥"
1002503-97 = "Некоторое время мы с Шун весело играли в «Выше и выше»."
