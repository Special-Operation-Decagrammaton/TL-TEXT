[translation]
10016080-1 = "Эпизод 8;Счастливая случайность"
10016080-2 = "Когда пыль наконец улеглась..."
10016080-3 = "*тяжело дышит* Танк, то есть робот-болельщик, наконец отключён..."
10016080-4 = "Мы полностью уничтожили его гусеницы и источник питания, так что теперь всё безопасно."
10016080-5 = ""
10016080-7 = ""
10016080-8 = "Мы задержали студентов-правонарушительниц, которые пытались устроить протест."
10016080-9 = "И, к счастью, похоже, им не удалось собрать много сторонников."
10016080-10 = "Все спортсменки эвакуированы, а пострадавших отправили в Объединённый медицинский центр."
10016080-12 = "Похоже, ситуация теперь под контролем. Хорошая работа, все."
10016080-13 = "Я знаю, что говорила, будто это часть обязанностей Исполнительного комитета Фестиваля Хало Кивотоса, но я правда не ожидала, что придётся сражаться бок о бок со студентами других школ."
10016080-14 = "У тебя с этим проблемы?"
10016080-15 = "Наоборот. Эта новизна была по-своему освежающей."
10016080-16 = "Я прекрасно знаю боевые возможности Тринити, но способность Миллениума быстро обрабатывать информацию и адаптироваться на поле боя впечатляет."
10016080-17 = "Без того, что вы так быстро выявили слабости противника, мы бы не справились настолько успешно. Теперь понимаю, откуда у студсовета Миллениума такая репутация."
10016080-18 = "Твоя доброта немного подозрительна..."
10016080-20 = "Ну, вообще-то именно вы сделали робота, из-за которого и случился весь этот инцидент."
10016080-21 = "...Не вините наши технологии!"
10016080-22 = "То есть да, Инженерный департамент действительно любит добавлять изобретениям ненужные функции, но всё равно виноваты протестующие, которые использовали его неправильно!"
10016080-23 = "П-пожалуйста, не волнуйся, Юука. Никто не требует от Миллениума брать на себя ответственность."
10016080-24 = "О... Кхм! Ну, в любом случае такой анализ данных для меня обычное дело. Я казначей Семинара, расчёты — моя специальность."
10016080-25 = "Мне кажется, куда больше похвалы заслуживает стрельба Хасуми."
10016080-26 = "Как тебе удалось так точно попасть по движущейся турели, даже без прицела? В чём секрет?"
10016080-27 = "Сложно объяснить... Наверное, интуиция?"
10016080-28 = "Думаю, я естественно научилась этому за столько лет работы в Боевой группе Правосудия."
10016080-29 = "Интересно... В Миллениуме мы обычно куда больше доверяем формулам, чем интуиции."
10016080-30 = "Не возражаешь, если как-нибудь, когда будет время, мы проведём несколько измерений и запишем твою стрельбу?"
10016080-31 = "Буду рада помочь."
10016080-32 = "[s] «Сегодня все отлично поработали!»"
10016080-33 = "Вы тоже, Сенсей. Как всегда, ваше руководство привело нас к победе."
10016080-34 = "[s1] «Почему бы нам всем не поесть парфе вместе, если у вас есть время?»\n[s2] «Пойдёмте за парфе! Я угощаю!»"
10016080-35 = "Спасибо, но, кажется, в Объединённом медицинском центре не хватает людей. Я как раз собиралась пойти помочь."
10016080-36 = "Спасибо, но, кажется, в Объединённом медицинском центре не хватает людей. Я как раз собиралась пойти помочь."
10016080-37 = "Сейчас я куда больше устала, чем голодна... Пойду отдохну в комнате отдыха."
10016080-38 = "Я сейчас иду в комнату спортсменок Геенны. Хочу узнать, как там глава Дисциплинарного комитета перед последним матчем."
10016080-39 = ""
10016080-41 = ""
10016080-42 = "..."
10016080-43 = "[s] «А ты, Хасуми?»"
10016080-44 = "Эм... Боюсь, я откажусь от парфе."
10016080-45 = "Раз у меня нет срочных дел, думаю, я немного отдохну и пройдусь по периметру."
10016080-46 = "[s3] «Тогда почему бы тебе самой не поучаствовать?»\n[s4] «Думаю, новый опыт был бы весёлым. Например, участие в соревнованиях.»"
10016080-47 = "В соревнованиях...?"
10016080-48 = "В соревнованиях...?"
10016080-49 = "Я уже говорила. Участие в фестивале не входит в мои обязанности."
10016080-50 = "Если речь о победе Тринити... Точнее, ради успеха фестиваля лучше, чтобы участвовали студенты с выдающимися физическими способностями, вроде Цуруги."
10016080-51 = "Меня вполне устраивает моя нынешняя роль."
10016080-52 = "[s] «Но...»"
10016080-53 = "Что ж, прошу меня извинить."
10016080-54 = ""
10016080-56 = ""
10016080-60 = "Вы видели? Видели, как я в самую последнюю секунду сорвала с них шапку?"
10016080-61 = "Как жаль... Я бы победила, если бы не споткнулась в самом начале!"
10016080-62 = "В следующий раз MVP буду я! Берегитесь!"
10016080-63 = "Хаха! Принимаю вызов! С удовольствием добавлю ещё одну победу в свою коллекцию."
10016080-64 = ""
10016080-68 = "Похоже, все наслаждаются фестивалем."
10016080-69 = "(Ну, конечно. Это же фестиваль, тут много всего весёлого...)"
10016080-70 = "(Сенсей сказал, что будет веселее, если я поучаствую, но...)"
10016080-71 = "(Но, разумеется, не все могут беззаботно наслаждаться фестивалем. Мир поддерживается только благодаря чьей-то жертве.)"
10016080-72 = "(Ради справедливости я должна оставаться начеку.)"
10016080-73 = ""
10016080-76 = ""
10016080-78 = "Что же делать...? Кто мог предсказать, что президент потеряет сознание из-за расстройства желудка прямо перед финалом?"
10016080-79 = "...Я же предупреждала тебя насчёт этих такояки!"
10016080-80 = "Ингредиенты могли выглядеть нормально, но то, что оно ходило само по себе, точно, точно было ненормально!"
10016080-81 = "Сверкающий осьминог... Круглые такояки..."
10016080-82 = "Может, решение найдётся в облаках..."
10016080-83 = "Хотела бы я... хоть что-нибудь сделать..."
10016080-84 = "Но... у меня мало друзей... Где же нам кого-нибудь найти...?"
10016080-85 = "Ну, нас как раз четверо."
10016080-86 = ""
10016080-87 = "Эти студенты точно из Хяккияко..."
10016080-88 = "Понятно. Следующее соревнование — финальный матч между Хяккияко и Миллениумом."
10016080-89 = "Сейчас Миллениум лидирует. Надеюсь, команда Хяккияко сможет их остановить..."
10016080-90 = "О! Почему бы тебе не занять её место, Цукуё?"
10016080-91 = "Э-это невозможно...!"
10016080-92 = "Если такая большая, как я... попытается забраться сверху... Всё рухнет!"
10016080-93 = "М-может, тогда я смогу!"
10016080-94 = "Но я слишком низкая, чтобы кого-то держать!"
10016080-96 = "Осьминог в банке. Сны о пищевом отравлении..."
10016080-97 = ""
10016080-99 = ""
10016080-100 = "Похоже, этот матч станет лёгкой победой Миллениума."
10016080-101 = "Жаль, но мне не стоит вмешиваться в дела других школ."
10016080-102 = ""
10016080-103 = "Ух... Ничего не могу придумать..."
10016080-104 = "Вот бы мне придумать тайный план, как Кайбэй из «Одиноких 77 странствующих ниндзя»! Тогда победа была бы у нас в кармане."
10016080-105 = "Простите..."
10016080-106 = "Лучше бы... это я получила пищевое отравление... Я такая большая... и бесполезная..."
10016080-107 = "Простите, что я вообще существую... Я слишком высокая..."
10016080-108 = ""
10016080-110 = ""
10016080-111 = ""
10016080-112 = "За что ты извиняешься?"
10016080-113 = "К-кто...?"
10016080-115 = "(Они огромные...!)"
10016080-116 = "Я собиралась не вмешиваться, но не могла оставить этот комментарий без ответа."
10016080-117 = "Вы понимаете правила предстоящей кавалерийской битвы?"
10016080-118 = "Конечно понимаем!"
10016080-119 = "Мы объединяемся, чтобы сделать «лошадь», а сверху садится наездница. Потом наездница должна сорвать шапки с других наездниц!"
10016080-120 = "Да, побеждает та наездница, которая первой сорвёт шапки с соперниц."
10016080-121 = "Если хочешь дотянуться до головы соперницы и сорвать шапку, проще всего делать это сверху."
10016080-122 = "А значит, высокий рост — огромное преимущество в кавалерийской битве!"
10016080-124 = "П-понятно...!"
10016080-126 = "Но если Цукуё будет частью «лошади», из-за разницы в росте нам будет трудно удерживать равновесие..."
10016080-127 = "Может, нам надеть очень-очень высокие каблуки."
10016080-128 = "Вы неправильно поняли. Участницы, составляющие «лошадь», не обязательно должны быть одного роста."
10016080-129 = "Можно просто поставить под низкого студента платформу и выровнять вашу «лошадь»."
10016080-131 = "Но я не понимаю! Как мы будем двигаться, стоя на платформе?"
10016080-132 = "Никак. Технически в правилах не сказано, что вы обязаны постоянно двигаться. Просто обычно все так делают, потому что неподвижная цель слишком уязвима."
10016080-133 = "Но если обе студенты будут стоять на больших платформах, сомневаюсь, что другие наездницы вообще смогут дотянуться до вашей шапки."
10016080-134 = "Это будет как... построить замок!"
10016080-135 = "Тогда... совсем как ниндзя, защищающие резиденцию своего господина!"
10016080-137 = "Как вы так быстро придумали такую крутую стратегию?"
10016080-138 = "Прямо как тогда, когда Кайбэй навострил свои чёрные уши и остановил огромную армию в 108-м эпизоде «Одиноких 77 странствующих ниндзя»!"
10016080-139 = "Господин Кайбэй!"
10016080-140 = "Вы ко мне обращаетесь? Меня зовут Хасуми..."
10016080-141 = "Простите, Хасуми! Пожалуйста, поделитесь с нами своей мудростью!"
10016080-142 = "М-мудростью?"
10016080-143 = "С тех пор как наш президент потеряла сознание, мы бродим как странники, потерявшие своего господина."
10016080-144 = "В такой момент нам нужен стратег! Нам нужна ваша помощь, Хасуми!"
10016080-146 = "Да! Если нам поможет эта суперумная девушка из Тринити, мы точно победим!"
10016080-147 = "Жаркий полдень. Девушка с чёрными крыльями. Это должна быть судьба..."
10016080-148 = "П-Пожалуйста...!"
10016080-149 = ""
10016080-151 = ""
10016080-152 = ""
10016080-153 = "...Ладно, хорошо."
10016080-154 = "Я всё равно на перерыве, да и в долгосрочной перспективе это пойдёт Тринити на пользу..."
10016080-155 = "Я помогу вам."
