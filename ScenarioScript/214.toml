[translation]
214-1 = "Ночная передача о преданиях"
214-3 = ""
214-4 = ""
214-5 = "Добро пожаловать на «Ночную передачу с мистером Оруэллом»!"
214-6 = "Конечно!"
214-7 = "Добро пожаловать, дамы и господа."
214-8 = "Я ваш ведущий, мистер Оруэлл, и сегодня представлю вам всю панораму современной эпохи! Кто готов нырнуть с головой? Ха!"
214-9 = "Текст, который я покажу сегодня, — известная крипипаста, объединяющая два крайне распространённых символа."
214-10 = "Потому что это... Драмбарка!"
214-11 = ""
214-14 = "Разумеется! РАЗУМЕЕТСЯ!"
214-15 = "Составляющие легенды Драмбарки чрезвычайно просты."
214-16 = "Когда «неверие» в человека, выращивающего крабов-людоедов, смешивается с «практичностью» того, что для подобного краб должен быть чудовищно огромным..."
214-17 = "Скажем лишь, что родился новый текст! И вырос он так, как никто не мог предвидеть!"
214-18 = "Конечно!"
214-19 = "Может ли это новое существо, появившееся в нашем воспроизведённом мире, быть результатом... влияния? Заговора? Или всё это вымышленная конструкция, созданная массовыми СМИ?"
214-20 = "Или это след противоречия... перо, оставленное чёрным лебедем, прилетевшим из другого мира?"
214-21 = "Присоединяйтесь к обсуждению! Делитесь мнением, пока наше виртуальное сообщество не сгорело, а святилище не обратилось в пепел!"
214-22 = "Потому что это шоу принадлежит всем нам!"
214-23 = "Конечно!"
214-24 = ""
214-26 = ""
214-27 = ""
214-28 = "А что скажешь ты, друг? Каково твоё толкование? Как ТЫ думаешь, о чём всё это?"
214-29 = "Библиотека преданий хранит бесчисленные оригинальные тексты и столько же историй, сколько песчинок в Абидос."
214-30 = "Будь то проявление зловещей городской легенды, распространяющейся по маленькому городу..."
214-31 = "Или пародия на старые медиа..."
214-32 = "Или даже небольшая вариация чего-то всем знакомого, рождённая прихотью автора..."
214-33 = "Здесь нет «правильных» ответов."
214-34 = "Потому что ценность и достоверность символа полностью зависят от вас! Это ваш выбор! ВЫ — потребитель! ВЛАСТЬ в ваших руках!"
214-35 = "Конечно!"
214-36 = "А теперь слово нашим спонсорам."
214-37 = "Оставайтесь с нами ради следующей захватывающей истории."
214-38 = "Конечно!"
