[translation]
80000080-1 = "Идеальный Чокозавр!"
80000080-2 = "Утро Дня святого Валентина."
80000080-3 = ""
80000080-8 = "Сенсей! Сенсей! Большие новости!"
80000080-9 = "[s] «Привет, Каэдэ. Ты как всегда полна энергии.»"
80000080-10 = "О, правда?"
80000080-11 = "Точно! Я отлично себя чувствую! И утром плотно позавтракала!"
80000080-12 = "[s] «Замечательно. Я очень рад это слышать.»"
80000080-13 = "Хи-хи-хи..."
80000080-14 = "Стоп, я не это хотела сказать...!"
80000080-15 = "Конечно, я ужасно рада, что вы говорите обо мне приятные вещи, Сенсей!"
80000080-16 = "Но сейчас речь не об этом! У меня большие новости!"
80000080-17 = "[s] «Что тебя так взволновало?»"
80000080-18 = "Так вот. Я услышала об этом сегодня утром..."
80000080-19 = "Я смотрела телевизор и кое-что узнала!"
80000080-20 = "Оказывается, сегодня День святого Валентина!"
80000080-21 = ""
80000080-24 = "[ns] «О, эм... Это правда...?»"
80000080-25 = "*глоток* День святого Валентина — это типа... ТОТ САМЫЙ день, да, Сенсей?"
80000080-26 = "Единственный день в году, когда шоколад и порох соединяются в горько-сладкой гармонии!"
80000080-27 = "[s] «Каэдэ, можешь сказать, где ты это вычитала...?»"
80000080-28 = "А? В интернете, конечно."
80000080-29 = "[s] «Каэдэ! Хочешь вместе со мной научиться правильно пользоваться интернетом?»"
80000080-30 = "Учиться...? Хм..."
80000080-31 = "Конечно! Давайте!"
80000080-32 = "Учиться весело, когда я занимаюсь с вами, Сенсей!"
80000080-33 = "Но сначала! Я прочитала в интернете кое-что ещё!"
80000080-34 = "В День святого Валентина дарят шоколад важным для тебя людям!"
80000080-35 = "И вроде бы лучший — сделанный своими руками?"
80000080-36 = "Поэтому я хотела сделать сама, но..."
80000080-37 = "Мимори и Цубаки сказали, что мне опасно пользоваться огнём, поэтому одной на кухне нельзя."
80000080-38 = "[s] «В этом есть смысл.»"
80000080-39 = "Но если мне помогают, шоколад уже не совсем сделан своими руками, правда? Получается... его делали разные руки, не только мои!"
80000080-40 = "Так не годится. Я хочу подарить Сенсею шоколад, который сделала полностью сама!"
80000080-41 = "[s] «Уверен, я был бы рад любому твоему подарку, даже если бы тебе кто-то помог.»"
80000080-42 = "Точно?"
80000080-43 = "Вы правда будете рады, даже если я сделаю его не совсем сама?"
80000080-44 = "Хммм..."
80000080-45 = "О!"
80000080-46 = "Сенсей! У меня отличная идея!"
80000080-47 = "Подождите минутку!"
80000080-48 = ""
80000080-50 = ""
80000080-56 = "[ns] «Ч-Что? Каэдэ? Ты куда...?»"
80000080-58 = "Та-дам! Я кое-что вам принесла, Сенсей!"
80000080-59 = "[s] «Каэдэ, это...?»"
80000080-60 = "Ага-ага! Это шоколад с окаменелостями динозавров!"
80000080-61 = "Это не просто обычный шоколад. Он особенный, потому что..."
80000080-62 = "Внутри можно найти окаменелости динозавров!"
80000080-63 = "Поэтому надо очень осторожно выкапывать их из шоколада, чтобы не сломать!"
80000080-64 = "Может, не так впечатляет, как домашний шоколад, но..."
80000080-65 = "Но это неважно! Я выкопаю все окаменелости и подарю вам подарок так, как могу только я, Сенсей!"
80000080-66 = "[s] «Ты лучшая, Каэдэ!»"
80000080-67 = "Готовьтесь, Сенсей! Начинаю!"
80000080-69 = "Так начались раскопки Каэдэ."
80000080-71 = "Хорошо! Первая — окаменелость тираннозавра!"
80000080-72 = "Копаем!"
80000080-73 = ""
80000080-77 = "Что?! Нет! Морда тираннозавра сломалась..."
80000080-78 = "Н-Ничего! Следующую я точно достану целой!"
80000080-79 = ""
80000080-80 = "Дальше трицератопс! Тот самый с крутыми рогами."
80000080-81 = "Хорошо, этот будет идеальным!"
80000080-82 = "Хи-и-и-я!"
80000080-83 = ""
80000080-87 = "О нет! Тело трицератопса сломалось! Всё тело..."
80000080-88 = "Но... Но! Всё будет хорошо! Остался ещё один!"
80000080-89 = ""
80000080-90 = "Последний тоже очень крутой."
80000080-91 = "Это птеродактиль! Летающий динозавр!"
80000080-92 = "Думаю... этот я точно смогу достать целым!"
80000080-93 = "Ну, начинаю!"
80000080-94 = ""
80000080-99 = ""
80000080-101 = "Несмотря на переполнявшие Каэдэ уверенность и энтузиазм..."
80000080-102 = "...ей не удалось выкопать ни одной окаменелости, не сломав её."
80000080-104 = "Уа-а-а! Сенсей! Я ни одной не смогла достать..."
80000080-105 = "А вы так ждали... Простите меня, Сенсей!"
80000080-106 = "[s] «Нет, правда, всё нормально...»"
80000080-107 = "И сегодня ещё День святого Валентина..."
80000080-108 = "Я всего лишь хотела... выкопать шоколадные окаменелости..."
80000080-109 = "Чтобы подарить их вам..."
80000080-110 = "Но я всё испортила... *всхлип*"
80000080-111 = "[s] «Каэдэ.»"
80000080-112 = "...А?"
80000080-113 = "[s] «В подарке важнее всего не то, насколько он крутой или впечатляющий.»"
80000080-115 = "[ns] «Особенным его делает то, как сильно ты старалась, потому что хотела что-то мне подарить.»"
80000080-116 = "Значит... даже если шоколад сломан... всё равно нормально?"
80000080-117 = "Я рада, что вы так думаете, Сенсей, но всё же..."
80000080-118 = "...!"
80000080-119 = "Сломанный шоколад... Что-то, что могу сделать только я..."
80000080-120 = "Сенсей! Подождите!"
80000080-121 = "[s] «Что такое, Каэдэ?»"
80000080-122 = ""
80000080-124 = ""
80000080-125 = "Если положить этот кусочек сюда, а тот туда..."
80000080-126 = "...И вот! Готово!"
80000080-127 = "Сенсей! Держите! Особенный шоколад, который я сделала специально для вас!"
80000080-128 = ""
80000080-131 = "Я называю его... Ультимативный Шокозавр!"
80000080-132 = "[s] «Понятно! Ты соединила все целые кусочки!»"
80000080-133 = "Ну как? Разве это не намного круче обычного шоколада с окаменелостями динозавров?!"
80000080-134 = "[s] «Да. Спасибо. Это подарок прямо в твоём стиле.»"
80000080-135 = "Ахаха! Не за что! Но, хм, если на него смотреть..."
80000080-136 = "Он выглядит... очень вкусно! Можно мне тоже кусочек? Можно, Сенсей?"
80000080-138 = "Так мы вдвоём и съели сделанного Каэдэ Шокозавра."
