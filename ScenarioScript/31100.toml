[translation]
31100-1 = "Episódio 10;Começa o Acampamento!"
31100-5 = "Anexo da Trinity \"Alojamento do Acampamento\""
31100-7 = "Finalmente chegamos! Então este é o nosso..."
31100-8 = "Sim, o local do nosso acampamento. Finalmente chegamos, ufa..."
31100-9 = "Como ouvi dizer que era um prédio anexo que não era usado há um bom tempo, achei que teríamos que dormir peladas no chão frio, mas..."
31100-10 = "É espaçoso, bem cuidado e ainda tem camas fofinhas. Não poderia ser melhor."
31100-12 = "Assim parece que vamos poder dormir todas juntas, peladas♡"
31100-13 = "Por que você tá enfatizando essa história de \"peladas\" toda hora?! E tem camas suficientes pra todo mundo, não tem necessidade nenhuma de dormirmos juntas!"
31100-14 = "Já que estamos em um acampamento, esse tipo de estudo também não seria necessário?"
31100-15 = "Não pode! Coisas pervertidas são proibidas! Pena de morte!!"
31100-16 = "Bem, como ainda está claro, vamos deixar assim por enquanto. Afinal, a noite é uma criança...♡"
31100-17 = "Hã?! Q-Q-Que história é essa?!?!"
31100-22 = "Hum, como vamos dividir o mesmo teto, as refeições e os estudos durante uma semana a partir de agora, espero que todas se deem bem..."
31100-26 = "Espera... ué? Cadê a Azusa-chan...?"
31100-27 = "Ora, ela estava conosco até agorinha..."
31100-34 = "Reconhecimento concluído."
31100-35 = "Re-Reconhecimento...?"
31100-36 = "Estamos bem longe do prédio principal da Trinity, então pelo visto não há risco de tiros de precisão."
31100-37 = "Também gostei do fato de haver apenas duas entradas para o exterior."
31100-38 = "Em caso de emergência, bloquear uma das entradas e atrair os invasores para o ginásio do primeiro andar para uma batalha de aniquilação seria bem eficaz."
31100-39 = "Bem, também identifiquei algumas outras vulnerabilidades de segurança, mas nada que algumas reformas não resolvam."
31100-41 = "H-Hum..."
31100-42 = "Além disso, este é o quartel... digo, a área residencial. ...É bem limpa."
31100-43 = "Deixar uma instalação dessas abandonada sem uso... é um belo de um desperdício."
31100-44 = "Hum, Azusa-chan... Nós não viemos aqui para lutar, viemos para estudar, lembra...?"
31100-45 = "Sim, eu sei. É um treinamento intensivo de uma semana, certo? Proibido sair, zero tempo livre, um treinamento pesado de 24 horas por dia onde não podemos baixar a guarda em nenhum movimento."
31100-46 = "A-Acho que não chega a tanto, mas..."
31100-47 = "Eu também vim devidamente preparada. Uniforme de educação física, mudas de roupa, itens de higiene como escova e pasta de dente, sabonete, ração de emergência, cobertor, cantil..."
31100-48 = "Como esperado da Azusa-chan, sempre tão precavida."
31100-49 = "É claro. Uma preparação minuciosa é a chave para o sucesso."
31100-51 = "Ufufu. Todas juntas saciando o apetite, saciando o sono e movendo as mãos sem desviar o olhar rumo ao objetivo que todas desejam... Que maravilha é um acampamento."
31100-52 = "..."
31100-53 = "...É, você tem razão."
31100-57 = "Ah, mas vou cumprir a missão com certeza. Vou estudar direitinho e dar um jeito de passar na segunda prova especial de aptidão acadêmica. Foi por esse objetivo que vim para cá."
31100-58 = "...Não quero ser um fardo."
31100-59 = "Azusa-chan..."
31100-60 = "Não se preocupe, para o caso de um ataque inimigo, também trouxe minas antipessoal e Claymores. Além disso, um kit completo de materiais para fazer dispositivos explosivos improvisados e algumas minas antitanque—"
31100-61 = "A-Azusa-chan! Como eu estava dizendo, esse tipo de coisa não...!"
31100-63 = "...Enfim, retomando."
31100-64 = "É exatamente como a Nagisa-sama nos disse. Como infelizmente reprovamos na primeira prova especial de aptidão acadêmica..."
31100-65 = "Ficou decidido que faríamos um acampamento de estudos neste anexo. Vamos ficar hospedadas aqui durante uma semana até a segunda prova."
31100-66 = "Ouvi dizer que ficou abandonado por muito tempo, mas com uma boa limpeza dá para usar perfeitamente, e parece que o ginásio e os chuveiros também são muito bem equipados..."
31100-67 = "Sim, por falar nisso, também tinha uma piscina lá fora. Embora pareça não ser usada há algum tempo."
31100-68 = "Ah, é mesmo? Além disso, daqui dá para ir andando até o prédio principal da Trinity se nos esforçarmos um pouco, e como também vimos instalações parecidas com um refeitório no subsolo, não precisamos nos preocupar em passar fome."
31100-69 = "E enquanto estivermos aqui, o Sensei [USERNAME] também planeja ficar conosco o tempo todo, então acho que vai ficar tudo bem se acontecer alguma coisa!"
31100-70 = "[s] \"Sim, podem deixar comigo.\""
31100-71 = "Muito obrigada. Hum, também há quartos do outro lado do corredor, então o Sensei—"
31100-77 = "Não pode, de jeito nenhum!! Dormir no mesmo quarto é pervertido demais!!!! Pena de morte!!!"
31100-78 = "Hã, Koharu-chan? Eu ainda nem disse nada...?"
31100-79 = "Eu já sei muito bem onde essa conversa vai parar!! Quando eu digo que não pode, é porque não pode! Não vou deixar esse tipo de coisa acontecer!"
31100-80 = "A Koharu-chan é tão rigorosa..."
31100-81 = "Por mim, não tem problema nenhum o Sensei ficar aqui também. Tem camas sobrando, e não há necessidade de usar vários quartos à toa."
31100-82 = "[s] \"Aproveitem para fortalecer a amizade entre vocês. Se precisarem de algo, é só me chamar.\""
31100-83 = "E-Então vamos fazer assim por enquanto. Sendo assim, vamos guardar a bagagem e começar logo a estudar..."
31100-84 = "Ora, mas antes disso, não acha que temos outra coisa para fazer, Hifumi-chan?"
31100-85 = "Hã...?"
31100-90 = "Entendo, instalar armadilhas prevendo um ataque inimigo?"
31100-94 = "Não, não é isso..."
31100-95 = "Uma faxina, é claro♡"
31100-96 = "...U-Uma faxina?"
31100-97 = "Sim. Por mais que o prédio recebesse manutenção, como ficou muito tempo sem uso, não acham que acumulou bastante poeira?"
31100-98 = "Passar os dias aqui desse jeito não parece nada bom para a saúde, então que tal começarmos hoje com uma faxina para podermos estudar em um ambiente agradável?"
31100-99 = "Entendo, você tem toda razão. Começar organizando o ambiente ao nosso redor é o básico, e se não fizermos isso, vamos acabar nos distraindo no meio dos estudos..."
31100-100 = "Sim, a higiene é fundamental. Na verdade, até mesmo no campo de batalha, esse é um fator que afeta diretamente o moral."
31100-101 = "F-Faxina...? Hum, bom, se for só uma limpeza normal..."
31100-102 = "Sim, acho que a Hanako-chan tem razão. Não adianta nada termos motivação se acabarmos nos precipitando..."
31100-103 = "O que vamos fazer não é virar a noite estudando de última hora, mas sim estudar para a prova dentro de um período bem planejado... Ou seja, assim como numa corrida de longa distância, precisamos pensar na ordem, no ritmo e na estratégia."
31100-108 = "Sendo assim, vamos começar com uma grande faxina!"
31100-109 = "[s] \"Certo, vamos dar o nosso melhor!\""
31100-110 = "Então vamos colocar roupas que possam sujar e nos reunir em frente ao prédio daqui a 10 minutos!"
31100-111 = "Entendido."
31100-112 = "Sim♪"
31100-118 = "R-Roupas que possam sujar... P-Pode ser o uniforme de educação física...?"
31100-120 = "10 minutos depois..."
31100-122 = "Alojamento do Acampamento - Portão Principal"
31100-123 = "Sensei, desculpe a demora!"
31100-124 = "[s1] \"Oh, de uniforme de educação física.\"\n[s2] \"Assim dá mesmo um clima de faxina.\""
31100-125 = "Sim, começar pela roupa certa também é importante. O uniforme de educação física é mais fácil de se movimentar e também mais prático para lavar quando sujar."
31100-126 = "Sim, começar pela roupa certa também é importante. O uniforme de educação física é mais fácil de se movimentar e também mais prático para lavar quando sujar."
31100-127 = "...E então, o que eu devo fazer?"
31100-128 = "Ah, você foi rápida, Koharu-chan."
31100-129 = "Desculpem a demora."
31100-130 = "A Azusa-chan também— espera, por que você está com a sua arma...?"
31100-131 = "Uma arma não tem sentido se não estiver sempre junto ao corpo. Nunca se sabe quando um ataque pode acontecer."
31100-132 = "Não, quer dizer, como posso explicar... pode até ser verdade, mas..."
31100-137 = "Desculpem a demora. Vocês foram rápidas, não?"
31100-138 = "FORA DE COGITAÇÃO!!!"
31100-139 = "Ora...?"
31100-140 = "Por que você tá de maiô pra fazer faxina?! Você é idiota?! Só pode ser idiota, né?! Idiota!!"
31100-141 = "Mas é fácil de se movimentar, não tem problema se sujar com alguma coisa e é super simples de enxaguar—"
31100-142 = "O problema não é esse, né?! Maiô é roupa de usar na piscina! Aliás, o-o que você vai fazer se alguém te vir assim?!"
31100-143 = "Que alguém? Não tem mais ninguém aqui além de nós...?"
31100-144 = "En-Enfim, não pode! Fora de cogitação é fora de cogitação! Você está proibida de usar maiô!"
31100-146 = "Ora... Se bem que isso também..."
31100-147 = "Auuu..."
31100-149 = "Depois disso, Hanako trocou de roupa direitinho e voltou vestindo o uniforme de educação física."
31100-151 = "Próximo;Grande Faxina!"
