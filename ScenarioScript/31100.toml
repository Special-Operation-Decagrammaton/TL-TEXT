[translation]
31100-1 = "Эпизод 10;В учебный лагерь!"
31100-5 = "Дополнительный корпус на окраине Тринити"
31100-7 = "Наконец-то мы здесь! Значит, именно тут пройдёт наш учебный лагерь?"
31100-8 = "Х-Ха-ха... Похоже на то."
31100-9 = "Когда я услышала, что нас отправят в неиспользуемый корпус, подумала, что там вообще не будет мебели. Вот и не придётся спать голыми вместе на холодном твёрдом полу."
31100-10 = "Но здесь на удивление уютно и просторно. Даже кровати очень милые!"
31100-12 = "Как же хорошо, что нам не придётся лежать на полу, когда мы будем спать голыми вместе! ♥"
31100-13 = "Почему любой сценарий у тебя заканчивается тем, что мы спим вместе голышом?! И кроватей полно, спи в своей!"
31100-14 = "Ой, точно? Не каждый день мы вместе приезжаем в учебный лагерь. Мы тут учиться, так что... почему бы не изучить кое-что ещё друг о друге?"
31100-15 = "Мы не извращения изучать приехали! Никакой похабщины!"
31100-16 = "Жаль. Ну, день ещё впереди. Посмотрим, не изменишь ли ты мнение к вечеру. ♥"
31100-17 = "...?!"
31100-18 = ""
31100-20 = ""
31100-22 = "В общем. Здесь мы проведём следующую неделю за учёбой. Всё будем делать здесь: спать, есть. Поэтому я хочу, чтобы вы все..."
31100-23 = ""
31100-25 = ""
31100-26 = "Погодите. А где Азуса?"
31100-27 = "О, точно. Минуту назад она была с нами."
31100-28 = ""
31100-30 = ""
31100-33 = ""
31100-34 = "Разведка лагеря завершена."
31100-35 = "Разведка? Подожди, ты только что назвала корпус лагерем?"
31100-36 = "До главного здания Тринити комфортная дистанция. Снайперский огонь маловероятен. Место приемлемое."
31100-37 = "Наружу ведут только два входа, что тоже благоприятно."
31100-38 = "В худшем случае можно забаррикадировать один вход и заманить врага в засаду в спортзале первого этажа."
31100-39 = "Я также выявила несколько слабых мест в обороне, но после небольшого укрепления они не должны стать проблемой."
31100-41 = "Э-Э-э..."
31100-42 = "А это, должно быть, казармы... Простите. Правильнее сказать общежитие, да? Неожиданно роскошное."
31100-43 = "Удивительно, что столь ценная опорная точка простаивала. Какая трата."
31100-44 = "Азуса! Мы приехали учиться, а не готовиться к войне, помнишь?"
31100-45 = "Я в курсе. Мы здесь тренируемся неделю, верно? Интенсивная подготовка, во время которой нам нельзя покидать территорию, иметь свободное время, а наблюдение ведётся 24 часа в сутки."
31100-46 = "Всё не настолько строго..."
31100-47 = "Я готова ко всему. Взяла все личные вещи: сменную одежду, спортивный инвентарь, зубные щётки, пасту, мыло, сухие продукты, одеяла, воду..."
31100-48 = "О боже. Ты так основательно подготовилась, Азуса."
31100-49 = "Естественно. Подготовленность — ключ к выживанию."
31100-50 = ""
31100-51 = "Хи-хи-хи. Есть вместе, спать вместе, учиться ради одной цели... Разве учебный лагерь не звучит божественно?"
31100-52 = "Хм..."
31100-53 = "Да. Я жду его."
31100-54 = ""
31100-56 = ""
31100-57 = "Но выполнение миссии прежде всего. Я буду учиться и сдам второй аттестационный экзамен. Это наша главная цель."
31100-58 = "Я не намерена снова становиться обузой."
31100-59 = "Азуса..."
31100-60 = "Кстати, для возможных засад я подготовила противопехотные мины и «Клейморы». Ещё принесла материалы для изготовления СВУ и противотанковых мин."
31100-61 = "Х-Хватит, Азуса! Нам всё это не понадобится!"
31100-63 = "Хм-м."
31100-64 = "Нагиса сказала, что если мы провалим первый аттестационный экзамен, отправимся в учебный лагерь."
31100-65 = "Мы будем здесь неделю до второго экзамена."
31100-66 = "Здание старое и немного запущенное, но после уборки будет вполне пригодно. И удобств хватает: спортзал, душевые."
31100-67 = "Снаружи даже бассейн есть. Правда, похоже, им давно не пользовались."
31100-68 = "Ага, и до главного здания можно дойти пешком. В подвале есть кухня, где можно приготовить простую еду, так что голодать не будем."
31100-69 = "К тому же [USERNAME] Сенсей будет всё время с нами, так что при необходимости всегда можно попросить помощи..."
31100-70 = "[s] «Помогать — моё второе имя.»"
31100-71 = "Ха-ха. Спасибо, Сенсей. В другом конце коридора для вас тоже есть отдельная комната."
31100-72 = ""
31100-74 = ""
31100-75 = ""
31100-77 = "Стоять, Ханако! Никакой похабщины!"
31100-78 = "Я вообще ничего не сказала. Понятия не имею, о чём ты."
31100-79 = "У тебя всё на лице написано! Хочешь смертной казни?!"
31100-80 = "Ох, какая ты строгая."
31100-81 = "А Сенсею обязательно жить в комнате в конце коридора? Здесь хватает кроватей. Разделять наш отряд невыгодно."
31100-82 = "[s] «Я оставлю вас обустраиваться, зовите, если понадоблюсь.»"
31100-83 = "Х-Хорошо... Ну, давайте разложим вещи и займёмся сегодняшней учёбой."
31100-84 = "Погодите. Вам не кажется, что сначала надо сделать кое-что ещё?"
31100-85 = "А?"
31100-86 = ""
31100-89 = ""
31100-90 = "Потренироваться устанавливать ловушки под огнём?"
31100-91 = ""
31100-93 = ""
31100-94 = "Нет..."
31100-95 = "Я про уборку. ♥"
31100-96 = "У-Уборку?"
31100-97 = "Да! Снаружи всё обслуживали, но внутри столько пыли и грязи, потому что зданием давно не пользовались, разве нет?"
31100-98 = "Разве это полезно? Говорят, в здоровом теле здоровый дух, так что перед учёбой давайте как следует всё уберём!"
31100-99 = "Н-Наверное, ты права. Хотя бы парты действительно стоит очистить перед использованием."
31100-100 = "Гигиена — важнейшая обязанность. Она сильно влияет на мораль подразделения."
31100-101 = "Серьёзно? Уборка? Ну, если только немного..."
31100-102 = "Думаю, Ханако права. Не стоит слишком сильно напрягаться с самого начала."
31100-103 = "Помним: это марафон, а не спринт. Впереди долгая неделя."
31100-104 = ""
31100-106 = ""
31100-108 = "Ладно, команда! Зарядимся энергией и устроим генеральную уборку!"
31100-109 = "[s] «Погнали-и-и!»"
31100-110 = "Все переоденьтесь, чтобы не испачкать форму. Через десять минут встречаемся внизу!"
31100-111 = "Поняла."
31100-112 = "Ладненько!"
31100-113 = ""
31100-116 = ""
31100-117 = ""
31100-118 = "Одежда для уборки? Наверное, спортивная форма подойдёт."
31100-120 = "Десять минут спустя."
31100-122 = "Вход в дополнительный корпус"
31100-123 = "Простите, что заставила ждать, Сенсей!"
31100-124 = "[s1] «Ты выбрала спортивную форму?»\n[s2] «Выглядишь готовой к работе.»"
31100-125 = "Ну, нужно было надеть что-то подходящее. В спортивной форме легко двигаться, а если испачкается — легко отстирать."
31100-126 = "Ну, нужно было надеть что-то подходящее. В спортивной форме легко двигаться, а если испачкается — легко отстирать."
31100-127 = "И что теперь...?"
31100-128 = "Ты быстро пришла, Кохару."
31100-129 = "Прибыла."
31100-130 = "Эм, Азуса. Думаю, оружие сейчас можно было не брать..."
31100-131 = "Лучше иметь оружие и не нуждаться в нём, чем нуждаться и не иметь. Разве нет?"
31100-132 = "Наверное, в этом есть смысл..."
31100-133 = ""
31100-135 = ""
31100-137 = "О боже. Я последняя?"
31100-138 = "НЕТ! НИ ЗА ЧТО! АБСОЛЮТНО НЕТ!"
31100-139 = "О?"
31100-140 = "Зачем тебе купальник для генеральной уборки?!#nЭто совершенно неуместно!"
31100-141 = "Но в нём легко двигаться, и я привыкла... пачкаться, когда его ношу."
31100-142 = "Что ты несёшь?! Купальник носят в бассейне! А-Если кто-нибудь увидит?!"
31100-143 = "Что такого? Здесь только мы."
31100-144 = "Нет! Категорически, на сто процентов запрещено! С этого момента тебе запрещено носить купальник!"
31100-146 = "Эх."
31100-147 = "Х-Ха-ха... ха..."
31100-149 = "После этого Ханако ушла переодеваться в спортивную форму."
31100-151 = "Следующий эпизод;Генеральная уборка!"
