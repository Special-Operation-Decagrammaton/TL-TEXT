[translation]
1005105-1 = "Поддержка капитана, пронзающая небеса"
1005105-4 = "Перед раменной"
1005105-5 = ""
1005105-6 = ""
1005105-8 = ""
1005105-9 = "Эм..."
1005105-10 = "Если не ошибаюсь, я заказывал робота-болельщика для рекламы..."
1005105-11 = "...И что здесь делает мастер из Инженерного отдела?"
1005105-12 = "А, ну, понимаешь, эм..."
1005105-13 = "Я не смогла выполнить ваш заказ!"
1005105-14 = "Понятно. Жаль."
1005105-15 = "Но не переживайте. Робота у меня с собой нет, зато есть собственное тело! Я сама буду поддерживать вашу лавку."
1005105-16 = "Мастер из Инженерного отдела будет болеть за нас...?"
1005105-17 = "Эм... Всё в порядке, можно просто попросить кого-нибудь другого..."
1005105-18 = "Я этого не допущу! Я никогда не оставляю заказ невыполненным!"
1005105-19 = "К тому же вам даже не нужно мне платить. Наоборот, так я расплачусь за свою ошибку."
1005105-20 = "Е-Если ты так говоришь... т-тогда... пожалуй, рассчитываю на тебя?"
1005105-21 = ""
1005105-23 = ""
1005105-24 = "Итак... пусть у меня нет машинной точности, зато страсть моей поддержки не уступит ничьей!"
1005105-25 = ""
1005105-27 = ""
1005105-29 = "Раменная «Сузумэ» — никогда не падать!"
1005105-30 = "Раменная «Сузумэ» — всегда зажигать!"
1005105-31 = "Раменная «Сузумэ» — сражаться не переставать!"
1005105-32 = ""
1005105-35 = "[ns] «...А приготовление рамена правда требует столько сражений?»"
1005105-36 = "Управлять рестораном — и правда постоянная борьба."
1005105-37 = "Дорогая аренда в хорошем месте, вредители, создающие проблемы с санитарией..."
1005105-38 = "Ух ты, какой мощный у тебя голос. Просто слушая его, я уже наполняюсь энергией..."
1005105-39 = "Но почему ты болеешь перед кухней, а не перед рестораном...?"
1005105-40 = "Процветание ресторана зависит от воли его владельца, а не от клиентов."
1005105-41 = "Сколько бы гостей ни пришло, если хозяин не горит делом хотя бы так же сильно, как его плита, они быстро уйдут."
1005105-42 = "П-Понятно... Спасибо за совет."
1005105-43 = "...Кстати, ты только сейчас начинаешь месить лапшу?"
1005105-44 = "До открытия осталось совсем немного времени, а ты всё ещё готовишься..."
1005105-45 = "Ничего страшного. Клиенты редко приходят сразу после открытия. А если готовить позже, еда даже свежее..."
1005105-46 = ""
1005105-48 = ""
1005105-50 = "Это вообще противоположность «ничего страшного»!"
1005105-51 = "Без скорости продавец рамена — всего лишь торговец бульоном! Клиенты не будут ждать твою лапшу вечно!"
1005105-52 = "Как ты можешь называть себя легендарно известным мастером рамена подполья Кивотоса, если двигаешься так медленно?!"
1005105-54 = "Н-Но я себя так не называю..."
1005105-56 = "Раз можешь говорить — можешь и месить! Быстрее!"
1005105-57 = ""
1005105-59 = ""
1005105-60 = "В-Вот так?"
1005105-61 = "Мало! Быстрее! Тебе нужна скорость замеса!"
1005105-62 = "Эм, эм..."
1005105-63 = "Меси, меси изо всех сил! Это лишь тесто — ты победишь!"
1005105-64 = "Д-Да!"
1005105-65 = ""
1005105-67 = ""
1005105-69 = "Эй, смотри. Этот парень месит тесто с невероятной скоростью! ...И за него ещё болеют?"
1005105-70 = "Ох ты... Наверное, это тот самый легендарно известный мастер рамена подполья Кивотоса, о котором я столько слышала! А мы и не знали!"
1005105-71 = "Мне как раз хотелось рамена... Может, зайдём прямо сейчас?"
1005105-72 = "Хм, давай... Тогда два заказа!"
1005105-74 = "...Д-Да! П-Пожалуйста, подождите минутку!"
1005105-75 = "Не понимаю... Стоило открыть лавку, как клиенты сразу повалили..."
1005105-76 = "Н-Неужели это сила поддержки...?"
1005105-77 = ""
1005105-79 = ""
1005105-80 = "Хе-хе, конечно. На поддержку всегда можно положиться! Она сразу заводит людей!"
1005105-81 = "Ну что, Сенсей. Идём к следующему месту?"
1005105-82 = ""
1005105-84 = ""
1005105-87 = "...А? Ты не смогла закончить заказанного мной робота-болельщика?"
1005105-88 = "...Да, прости. Я не успела закончить модель, которая не взрывается."
1005105-89 = "Н-Ничего не поделаешь. Всё-таки я предупредила тебя в последний момент..."
1005105-90 = "Но не переживай. Мои кричалки, может, и не пробьют звуковой барьер... зато моя страсть пробьёт!"
1005105-91 = "А теперь расскажи мне о своей проблеме."
1005105-92 = "Д-Да... Моя проблема в том, что..."
1005105-93 = ""
1005105-95 = ""
1005105-96 = "Я обожаю Старшего Брата из Momo Friends. В его взгляде есть загадочное очарование. Он будто пронзает всё насквозь..."
1005105-97 = "Поэтому я состою в Большом фан-клубе Старшего Брата... и у нас проходят выборы Самого Большого Фаната... то есть президента клуба."
1005105-98 = "Я хочу участвовать в выборах и показать другим участникам, насколько сильно люблю Старшего Брата... Но мне не хватает смелости..."
1005105-99 = "Если я слишком боюсь показать другим, какая я внутри, разве я заслуживаю быть Самым Большим Фанатом Старшего Брата, чей взгляд видит всё насквозь..."
1005105-100 = ""
1005105-102 = ""
1005105-104 = ""
1005105-105 = "Это все данные, которые удалось получить."
1005105-107 = "Что?!"
1005105-109 = "Нет ничего постыдного в том, чтобы что-то любить!"
1005105-110 = "Не робей и не таи — о любви своей кричи!"
1005105-111 = "Если соврёшь, тогда ты... Постой, ты что, стесняешься того, что фанатка Старшего Брата?"
1005105-112 = "Н-Нет! Я люблю Старшего Брата сильнее всех!"
1005105-113 = "Тогда и говори об этой любви громче всех! Ну же, хочу услышать!"
1005105-114 = "Я-я люблю Старшего Брата."
1005105-115 = "Громче, громче, ну же, фанат! Не кричишь — и огонь твой слабоват!"
1005105-116 = ""
1005105-118 = ""
1005105-120 = "Я чертовски сильно люблю Старшего Брата!"
1005105-121 = ""
1005105-123 = ""
1005105-127 = ""
1005105-128 = "Простите? Почему вы кричите посреди улицы?"
1005105-130 = "Э-Эм, я пыталась выразить свои искренние чувства к Старшему Брату..."
1005105-132 = "Я понимаю ваши чувства, но кричать вот так посреди улицы..."
1005105-133 = ""
1005105-135 = ""
1005105-137 = "Я так растрогана!"
1005105-139 = "...А?"
1005105-141 = "Мне всегда хотелось выкрикнуть на улице, как сильно я люблю Старшего Брата, но я боялась, что подумают люди... и что кто-нибудь вызовет полицию..."
1005105-142 = "Ваша смелость так честно выражать свои чувства... Мне с вами не сравниться!"
1005105-143 = "Вы достойны стать следующим Самым Большим Фанатом!"
1005105-145 = "П-Правда?"
1005105-146 = "Вы правда думаете, что кто-то вроде меня сможет стать президентом фан-клуба Старшего Брата?"
1005105-147 = "Конечно!"
1005105-148 = "А теперь наполним воздух криками о том, какой Старший Брат крутой!"
1005105-149 = ""
1005105-151 = ""
1005105-152 = ""
1005105-153 = ""
1005105-154 = ""
1005105-155 = ""
1005105-157 = "Ещё один идеальный успех!"
1005105-158 = "[s] «Я поражён твоей энергией...»"
1005105-159 = "Хи-хи, спасибо за комплимент."
1005105-160 = "Но мы тратим драгоценное время поддержки. Нам ещё много кого нужно подбодрить!"
1005105-162 = "После этого мы с Утахой посетили всех, кто заказывал роботов-болельщиков. Она поддерживала их, а я поддерживал её."
1005105-167 = ""
1005105-168 = "Фух... Ну и суматошный день."
1005105-169 = "[s] «Спасибо за сегодняшнюю работу.»"
1005105-170 = "Да не за что. Я изначально не успела к сроку, так что это была моя проблема. К счастью, все, похоже, остались довольны."
1005105-171 = "К тому же иногда приятно сделать что-то без машин. Хоть изредка."
1005105-172 = "Всё это было довольно вдохновляюще. Ходить по улицам, разговаривать со всеми... я снова вспомнила, почему люблю создавать вещи."
1005105-173 = "Мастер извлекает один урок из успеха... А сегодня успехов было много, так что и уроков я получила немало."
1005105-174 = ""
1005105-177 = "[ns1] «Кстати, я всё хотела спросить...»\n[ns2] «Почему ты шепчешь?»"
1005105-178 = ""
1005105-179 = ""
1005105-181 = ""
1005105-182 = "Ах..."
1005105-183 = "Пламя, что горит вдвое ярче, сгорает вдвое быстрее..."
1005105-184 = ""
1005105-186 = ""
1005105-187 = ""
1005105-189 = "То есть я потеряла голос."
1005105-191 = "Похоже, огонь Утахи горел слишком ярко, и она потеряла голос. Поэтому мы вернулись в Шале."
