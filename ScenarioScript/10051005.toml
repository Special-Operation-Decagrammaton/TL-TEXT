[translation]
10051005-1 = "Пролог;Рамен и заговор"
10051005-3 = "[log]Ниндзя должен помнить.[/log]"
10051005-6 = "[log]Выбирай толстую лапшу![/log]"
10051005-8 = "[log]Сверху положи свиную грудинку![/log]"
10051005-12 = "[log]А затем полей маслом чили![/log]"
10051005-15 = "Раменная в Хяккияко"
10051005-16 = "Вот как настоящий ниндзя ест рамен!"
10051005-17 = "Это... новое официальное блюдо ниндзюцу?"
10051005-18 = "Спасибо за терпение, нин-нин!"
10051005-19 = "«Мичиручи: свиток девушки-ниндзя»! Совместный эпизод «Ниндзя и рамен»!"
10051005-20 = "Начинается... прямо сейчас!"
10051005-21 = "Эй, стойте, стойте!"
10051005-22 = "Кажется, камера немного наклонена."
10051005-23 = "Штатив не разболтался?"
10051005-24 = "Что? П-Простите! Мне следовало проверить!"
10051005-25 = "Хм. Нет, точно нет. Кадр выставляла я."
10051005-26 = "Не переживайте! Этот дубль будет ещё лучше."
10051005-27 = "Все по местам! Ещё раз..."
10051005-29 = "*грохот*"
10051005-31 = ""
10051005-32 = "Эй, хозяин! Что у тебя с бульоном? Он настолько жидкий, что с лапши стекает!"
10051005-33 = "И вообще, лапша жёсткая!"
10051005-34 = "Лапша и бульон будто друг с другом дерутся."
10051005-35 = "Мы всегда готовили по этому рецепту..."
10051005-36 = "И стол переворачивать было вовсе не обязательно!"
10051005-37 = "Пожалуйста, вы пугаете остальных посетителей!"
10051005-38 = ""
10051005-40 = ""
10051005-41 = ""
10051005-42 = "Ваша миска с раменом попала в нашу камеру!"
10051005-43 = "У-Уаа-а..."
10051005-44 = "Всё кончено!"
10051005-45 = "П-Президент... может, нам стоит...?"
10051005-46 = "..."
10051005-47 = ""
10051005-49 = ""
10051005-50 = "(Уф, ну и бардак... Я правда должна что-то с этим сделать?)"
10051005-51 = "(...Стоп, а у меня вообще есть шанс?)"
10051005-52 = ""
10051005-54 = ""
10051005-55 = "(Погодите. Я ведь не одна!)"
10051005-56 = "(Цукуё и Изуна тоже здесь!)"
10051005-57 = "...И какими бы ни были шансы, настоящий ниндзя..."
10051005-58 = "...никогда не отступит перед лицом несправедливости!"
10051005-59 = "О чём она говорит?"
10051005-60 = "Президент...?"
10051005-61 = ""
10051005-63 = ""
10051005-64 = "Получай! Ниндзюцу! Техника сверкающего огня!"
10051005-65 = ""
10051005-70 = ""
10051005-71 = ""
10051005-72 = "...Что это сейчас было?"
10051005-73 = "Выстрел... нет, петарды?"
10051005-74 = "Какого...? Оно просто сверкает, даже не щиплет!"
10051005-75 = "Ты чё, решила драться с нами этим... фокусом?!"
10051005-76 = "Эй, а что такое «ниндзюцу»? Это типа закуска?"
10051005-77 = "Не знаю—"
10051005-78 = ""
10051005-80 = ""
10051005-85 = "П-Пожалуйста, встаньте за мной!"
10051005-86 = "С-Спасибо!"
10051005-87 = ""
10051005-94 = ""
10051005-95 = "Угх..."
10051005-96 = "Они нас отвлекли... и напали со спины!"
10051005-97 = ""
10051005-99 = ""
10051005-101 = "Ха-ха! Именно! Классическая стратегия ниндзя!"
10051005-102 = "Вот истинный потенциал Техники сверкающего огня!"
10051005-103 = "А вот что могут трое ниндзя, действующие сообща: даже свирепого тигра поймают!"
10051005-104 = "Конечно!"
10051005-105 = "...Погодите, а мы точно можем?"
10051005-106 = "Эм, все..."
10051005-107 = "Хм?"
10051005-108 = "Я-Я вытерла бульон с камеры..."
10051005-110 = "Но она не включается...!"
10051005-111 = "..."
10051005-112 = "..."
10051005-114 = "Ааааа...!"
10051005-118 = "Хм..."
10051005-119 = "Проворные и расчётливые, при этом защищают невинного владельца раменной..."
10051005-120 = "...движениями, идеально подходящими для скрытности и защиты."
10051005-121 = "Я знала, что Клуб исследования ниндзюцу умелый, но ЭТО было впечатляюще."
10051005-122 = "А раз так..."
10051005-123 = "...у меня как раз есть для них подходящая миссия."
