[translation]
10017025-1 = "Эпизод 2;Отверженные...?"
10017025-10 = "Переулок"
10017025-11 = "*тяжело дышит* Эй! Ты в порядке? Ты вообще жива?"
10017025-12 = ""
10017025-14 = ""
10017025-15 = ""
10017025-16 = "Чёрт. Тупик!"
10017025-19 = "Мы загнали их в угол. Маширо, слышишь меня?"
10017025-20 = "Громко и чётко!"
10017025-21 = "Запрашиваю огневую поддержку."
10017025-22 = "Принято. Огонь разрешён!"
10017025-23 = "Остальное оставляю тебе."
10017025-24 = "Ке-хе-хе... Кьяхахаха!"
10017025-26 = ""
10017025-28 = ""
10017025-29 = "Какого чёрта?! Кто по нам стреляет?!"
10017025-30 = "Это не обычные пули! Неужели... член Боевой группы Правосудия?!"
10017025-31 = "Что мы вообще сделали, чтобы заслужить это?"
10017025-32 = "Вот именно! Мы же в этот раз даже никого не похищали!"
10017025-33 = "И улицу целиком в руины, как обычно, не превратили!"
10017025-34 = "Никаких бунтов! Никакой крамолы! Даже массовой драки ни одной!"
10017025-35 = "Мы тоже заслуживаем спокойного Рождества!"
10017025-37 = ""
10017025-39 = "*бум*"
10017025-40 = "И-Ик!"
10017025-41 = "Ч-Что происходит?"
10017025-42 = ""
10017025-44 = ""
10017025-46 = "Ха-ха-ха..."
10017025-47 = "Ке-хе-хе-хе-хе!"
10017025-49 = "Э-Это...?!"
10017025-50 = "Н-не убивайте меня! У м-меня дома камень-питомец! Камушек без меня пропадёт!"
10017025-52 = "А-а-а-а-а!"
10017025-53 = ""
10017025-64 = "..."
10017025-65 = "Вот и всё. Хорошая работа, Маширо, Цуруги."
10017025-66 = "Спасибо за ваши усилия, Хасуми и Цуруги."
10017025-68 = ""
10017025-70 = ""
10017025-71 = "...А что с предметом?"
10017025-72 = ""
10017025-74 = ""
10017025-75 = ""
10017025-76 = "Я его забрала. Не беспокойтесь."
10017025-77 = "Не могу поверить, что они додумались до такого на Рождество."
10017025-78 = "Изобретательно, злобно, опасно... Прямо как Геенна."
10017025-79 = "Нет никаких сомнений, что их поступок был ужасен."
10017025-80 = "Приходится разбираться с таким прямо перед вечеринкой... Полная катастрофа."
10017025-81 = "Это не то дело, которое можно доверить кому попало."
10017025-82 = "Разве не естественно, что Боевая группа Правосудия вершит правосудие?"
10017025-83 = "Правосудие не должно вершиться только тогда, когда нам удобно, Маширо, даже если сегодня Рождество."
10017025-84 = "Вы правы. У правосудия нет выходных, значит и у нас их быть не должно!"
10017025-85 = "Мне ещё многому нужно научиться. Буду стараться усерднее."
10017025-86 = "Эм, да. Только не забывай не перенапрягаться."
10017025-87 = "Хотя, возможно, уже поздно это говорить."
10017025-89 = "...Кстати о поздно, разве мы сейчас не..."
10017025-90 = "Точно, вечеринка."
10017025-91 = "Я и так переживала, что мы опоздаем, а теперь времени ещё меньше."
10017025-92 = "Надо спешить. Если опоздаем, доставим неудобства остальным."
10017025-93 = "Идём, Цуруги, Маширо."
10017025-95 = ""
10017025-98 = "...Они ушли?"
10017025-99 = "Ух... Я умираю."
10017025-100 = "Они совсем перешли черту! Что, преступникам теперь и Рождество нельзя праздновать?!"
10017025-101 = "Чем больше у них есть, тем больше им надо! ...Так, что теперь делать?"
10017025-102 = "Ну, наш план развалился, и они забрали всё, что у нас было..."
10017025-103 = "Давайте просто уйдём отсюда..."
10017025-105 = ""
10017025-107 = ""
10017025-108 = ""
10017025-110 = ""
10017025-112 = "Улицы Кивотоса"
10017025-113 = ""
10017025-114 = ""
10017025-115 = ""
10017025-116 = "Не плачь и не хнычь!"
10017025-117 = "Ханаэ, можешь, пожалуйста, идти помедленнее?"
10017025-118 = "Я же говорю почему. Санта-Клаус идё-ё-ёт в город. О, кстати, раз он идёт, нормально, что я в костюме Санты?"
10017025-119 = "Думаю, благотворительность в таком наряде заставила бы его гордиться нами."
10017025-120 = "Верно! Этот костюм налагает большую ответственность!"
10017025-121 = "Не могу дождаться! Нужно как можно скорее начать делать добрые дела!"
10017025-122 = ""
10017025-124 = ""
10017025-125 = "Х-Ханаэ? Осторожно! Земля скользкая!"
10017025-126 = ""
10017025-128 = ""
10017025-129 = ""
10017025-131 = "Рыцари скорой помощи и Сенсей из Шале? Чем они занимаются?"
10017025-132 = "Рыцари скорой помощи каждый год устраивают что-то с ящиком для пожертвований."
10017025-133 = "И всё? Удивительно, что они уговорили Сенсея присоединиться. Даже они отдыхают на Рождество."
10017025-134 = "Погоди. Рыцари скорой помощи... Сенсей... Рождество..."
10017025-135 = "Я придумала отличный план! Хотя нет, забудьте... Стойте! Всё, теперь точно придумала отличный план."
10017025-136 = "Ты уверена? Если честно, я очень не хочу снова получить пулю."
10017025-137 = "Да перестань на секунду переживать. Гарантирую: этот план ещё ни разу не проваливался."
10017025-139 = ""
10017025-141 = ""
10017025-142 = "Ты разве не только что его придумала?"
10017025-143 = "Посмотри на нас. Всё, что у нас осталось, — идеи. Значит, терять нам на самом деле нечего! Верно?"
10017025-144 = "Наверное? А, к чёрту, я в деле."
10017025-145 = "Для начала нужно выглядеть максимально жалко."
10017025-146 = "Ну, мы бесцельно шатаемся по улицам на Рождество после того, как потеряли всё и ужасно провалились..."
10017025-147 = "Так что с этим у нас всё готово."
10017025-148 = "От этих слов мне уже по-настоящему плакать хочется..."
10017025-149 = "Искренние слёзы оставь на свободное время."
