[translation]
2003205-1 = "Планирование операции"
2003205-2 = "Я закончил работу пораньше и решил заглянуть в клубную комнату Отряда Исследования Сверхъестественного."
2003205-3 = "[ns] «Эйми. Это я.»"
2003205-4 = "Хм..."
2003205-5 = "[s] «Эйми?»"
2003205-6 = "А? Сенсей?"
2003205-7 = "Сейчас подойду."
2003205-8 = ""
2003205-11 = ""
2003205-12 = "Я думала, вы заняты, так что не ожидала вас сегодня."
2003205-13 = ""
2003205-16 = "[ns] «Эйми... почему ты опять в этом купальнике?»"
2003205-17 = "А, это?"
2003205-18 = "Эм..."
2003205-19 = "Потому что мне в нём удобно?"
2003205-20 = "Не волнуйтесь. Зимнюю одежду, которую вы мне купили, я тоже носила."
2003205-21 = "Хотя сегодня внутри немного жарко."
2003205-22 = "Пока сниму её."
2003205-23 = ""
2003205-26 = "[ns] «...О, а это что там такое?»"
2003205-27 = "А? О, я делала специальный вентилятор для поездки к Ледяному морю."
2003205-28 = "Я хотела взять с собой ручной вентилятор... но Химари говорит, что там нужно держать руки в тепле."
2003205-29 = "Поэтому я придумала устройство, которое создаёт ветерок и одновременно согревает руки."
2003205-30 = "Хотите попробовать, Сенсей? Мне интересно ваше мнение."
2003205-31 = "[s] «Разумеется»."
2003205-32 = "Спасибо. Вот."
2003205-33 = ""
2003205-35 = ""
2003205-37 = "[ns] «А?»"
2003205-38 = "Нужно поместить вентилятор между ладонями и тереть их друг о друга."
2003205-39 = "Если вытянуть руки вперёд и продолжить тереть ладони..."
2003205-40 = ""
2003205-42 = ""
2003205-43 = "Пропеллер вентилятора начнёт вращаться и создавать ветерок."
2003205-44 = "Руки остаются в тепле, а по телу проходит прохладный воздух."
2003205-45 = "[s] «О! Оно работает?!»"
2003205-46 = "Правда? Я очень горжусь этим устройством."
2003205-47 = "Единственная проблема — эффективность не очень... Руки быстро устают, а ветер получается довольно слабым."
2003205-48 = ""
2003205-50 = ""
2003205-51 = "...Можно работать по очереди, раз ветер всё равно дует во все стороны?"
2003205-52 = "У вас всегда находится решение любой проблемы, Сенсей."
2003205-54 = "Хм... Тереть ладони правда утомительно, и под курткой я вся вспотела."
2003205-55 = "Я так увлеклась вентилятором, что забыла снять куртку. Сейчас сниму."
2003205-56 = "[s] «Подожди, Эйми, секунду!»"
2003205-57 = "Что такое, Сенсей?"
2003205-58 = "...Эта куртка не только защищает от холода, но и является частью модного ансамбля?"
2003205-59 = "...Она создаёт гармоничную модную синергию инь и ян между жаром и холодом?"
2003205-60 = "...И если я сниму куртку, весь образ разрушится? Но я вспотела, Сенсей..."
2003205-61 = "[s] «Настоящая мода не для слабаков!»"
2003205-63 = "[ns1] «...Но если тебе слишком жарко, можно немного убавить термостат?»\n[ns2] «Считай это тренировкой перед миссией в Ледяном море.»"
2003205-66 = "А? Эм... хорошо."
2003205-68 = "Я выкрутил термостат на минимум, чтобы Эйми не снимала и без того немногочисленную одежду."
2003205-69 = ""
2003205-72 = "Я настолько сильно понизил температуру, что в итоге сам простудился."
