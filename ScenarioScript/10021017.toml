10021017-12 = "Нужно это остановить!"
10021017-13 = "Если так продолжится, самоуничтожение может не успеть активироваться!"
10021017-14 = "Мы больше не можем ждать! Если не активируем сейчас, всё было зря!"
10021017-15 = "Но ещё не готово! Сейчас система слишком нестабильна для активации!"
10021017-16 = "Нам может не хватить времени на эвакуацию!"
10021017-17 = "Общество гурманов и Отдел разработки игр только что прибыли в комнату управления! Они поддержат Сенсея в бою!"
