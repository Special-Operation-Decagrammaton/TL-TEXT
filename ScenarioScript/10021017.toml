10021017-33 = "Верно. Всего 23 последовательности."
10021017-34 = "Нужно ли нам соблюдать какие-то меры предосторожности?"
10021017-36 = "Поскольку она использует вычислительную функцию Ковчега, цель должна находиться внутри Ковчега. То есть после его уничтожения использовать её уже нельзя."
