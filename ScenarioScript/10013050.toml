[translation]
10013050-1 = "Эпизод 5;Белоухие чудовища 1"
10013050-2 = ""
10013050-7 = "Следуя указаниям Шизуко, мы прибыли на уединённый пляж."
10013050-8 = "[ns] «Значит, здесь должны быть... Белоухие чудовища, уничтожающие проигравших...»"
10013050-9 = "И снова... какое пафосное кодовое имя..."
10013050-10 = "Ч-Чудовища? Д-Думаете, ниндзюцу Изуны сможет их победить?!"
10013050-11 = "Не знаю, но в любом случае всё будет хорошо! С нами Чисэ!"
10013050-13 = "*глоть*"
10013050-14 = ""
10013050-16 = ""
10013050-17 = ""
10013050-18 = ""
10013050-19 = "...Изгнание духов?"
10013050-20 = "[s] «Узнаем, настоящие ли это чудовища, когда доберёмся.»"
10013050-21 = "Да. У Отдела горячих источников было громкое название, а оказались обычные студенты!"
10013050-22 = "Как в народных сказках: просто слухи, которые превращаются в истории о духах и призраках."
10013050-23 = "Да! Я бы не слишком переживала из-за слова «чудовища»."
10013050-24 = ""
10013050-29 = "У-ух..."
10013050-31 = ""
10013050-33 = ""
10013050-34 = ""
10013050-35 = ""
10013050-36 = "Я-я должна идти..."
10013050-37 = ""
10013050-39 = ""
10013050-40 = "...на арену..."
10013050-41 = ""
10013050-43 = ""
10013050-46 = "Ч-Что это было...?"
10013050-47 = "Б-Босс! Их ещё больше!"
10013050-48 = ""
10013050-51 = ""
10013050-52 = "Я-я должна поспешить..."
10013050-53 = ""
10013050-55 = ""
10013050-56 = ""
10013050-57 = "...пока не стало слишком поздно..."
10013050-58 = ""
10013050-60 = ""
10013050-63 = "Они выглядят немного... дезориентированными."
10013050-64 = "[s] «Скорее одержимыми... может, чудовищем?»"
10013050-65 = ""
10013050-66 = "Не может быть! Чудовищ не существует, ясно?"
10013050-67 = ""
10013050-72 = "О! Звук корабельного гудка! Кажется, он оттуда!"
10013050-73 = ""
10013050-78 = "Какой огромный корабль."
10013050-79 = "На борту видно название!"
10013050-81 = "«Золотое руно»."
10013050-82 = "[s] «Золотое руно»... Я уже слышал это название..."
10013050-84 = ""
10013050-87 = "До окончания посадки тридцать минут!"
10013050-88 = "Если хотите участвовать в сегодняшней игре, поднимайтесь на борт, пока не поздно!"
10013050-89 = ""
10013050-91 = ""
10013050-92 = ""
10013050-93 = "Угххх..."
10013050-94 = ""
10013050-96 = ""
10013050-97 = ""
10013050-98 = ""
10013050-101 = "Они идут на корабль как загипнотизированные!"
10013050-102 = "М-Мы пойдём за ними, босс?"
10013050-103 = "Уgh! В-Всё это крайне подозрительно, но нужно что-то делать! У нас миссия!"
10013050-104 = "Нужно подняться на борт."
10013050-105 = "[s] «Все на борт.»"
10013050-106 = ""
10013050-119 = "[ns] «Здесь немного хаотично.»"
10013050-120 = ""
10013050-123 = ""
10013050-124 = ""
10013050-125 = ""
10013050-126 = ""
10013050-129 = ""
10013050-130 = ""
10013050-131 = ""
10013050-132 = ""
10013050-133 = ""
10013050-134 = ""
10013050-137 = ""
10013050-139 = "Все будто сосредоточены на чём-то вон там."
10013050-140 = "Что они вообще могут делать на корабле?"
10013050-141 = "Этот шум... люди, словно одержимые... и слово «игра», которое я слышала перед посадкой..."
10013050-142 = "Н-Неужели это место...? А если здесь происходит что-то незаконное?!"
10013050-143 = "[s] «Смотрите. Там кто-то кричит.»"
10013050-144 = ""
10013050-146 = ""
10013050-148 = "С-С-Сейчас мой ход...!"
10013050-149 = "Я сделаю особый призыв Человеко-ликой улитки! И одновременно станцую, чтобы повысить её защиту!"
10013050-150 = "Т-Тогда я призову Богомола-отличника!"
10013050-151 = "Я разыграю мост, чтобы повысить скорость Богомола-отличника!"
10013050-152 = "Я готова атаковать!"
10013050-153 = ""
10013050-155 = ""
10013050-156 = ""
10013050-157 = "Что они вообще говорят?"
10013050-158 = "О, я уже такое видела. Каэдэ просто без ума от этой игры."
10013050-159 = "Это карточная игра под названием Mushiqueen!"
10013050-160 = "...M-Mushiqueen?!"
10013050-161 = "[s] «А. Эта игра.»"
10013050-162 = "Почему вы все киваете, будто всё понимаете?! Почему они играют в неё здесь?"
10013050-163 = "И почему у всех такие страшные лица? Это же просто карточная игра!"
10013050-164 = "Что там Каэдэ всегда говорит?"
10013050-165 = "А! «Mushiqueen — страшная игра, где игроки сражаются, ставя на кон свою честь и убеждения!»"
10013050-166 = "Точно! Жестокая игра, где, если проиграешь, тебя могут запечатать в карте. Босс! С Пиной это уже много раз случалось!"
10013050-168 = "К-Какой ужас! Это игра?!"
10013050-169 = "Нет-нет-нет. Это всего лишь эффект анимации в игре! Их на самом деле не запирают!"
10013050-170 = "[s] «Но всё-таки. Почему они проводят здесь соревнования?»"
10013050-171 = ""
10013050-176 = "Бойцы Mushiqueen! Ожидание окончено!"
10013050-177 = ""
10013050-181 = ""
10013050-182 = "Сегодня вы яростно столкнёте свои колоды друг с другом!"
10013050-183 = "Добро пожаловать на подпольное соревнование Mushiqueen!"
10013050-184 = "Подпольное...?"
10013050-185 = "Как вы знаете, соревнование Mushiqueen на этом корабле — не обычный турнир!"
10013050-186 = "Победители уходят богаче, чем когда-либо, а проигравшим остаётся только плакать!"
10013050-187 = "Проиграл игру — потерял всё! Придётся оставить достоинство и всю колоду! Какая страшная мысль! Помилуйте!"
10013050-188 = "Это всё ещё просто карточная игра, да...?"
10013050-189 = "[s1] «Для них это гораздо больше, чем просто игра.» \n[s2] «Колода игрока — вроде его души. По крайней мере, по словам Каэдэ.»"
10013050-190 = "Тогда зачем вообще участвовать?"
10013050-191 = "Наверное, я могу это понять..."
10013050-192 = "Но зачем тогда рисковать такой огромной потерей?"
10013050-193 = "Конечно, где есть риск потери, есть и возможность!"
10013050-194 = "Победитель турнира получит ограниченный набор карт Mushiqueen и..."
10013050-195 = ""
10013050-197 = ""
10013050-199 = "...курортный контракт, позволяющий управлять этой ареной!"
10013050-200 = ""
10013050-202 = ""
10013050-203 = "[ns] «Какой щедрый турнир.»"
10013050-204 = "Что-о-о?! Они вообще о чём думают? Если отдадут контракт, потеряют всё! Их это устраивает?!"
10013050-206 = "Конечно! Для каждого бойца Mushiqueen это победа или смерть!"
10013050-207 = ""
10013050-209 = ""
10013050-210 = ""
10013050-211 = "Ч-что?!"
10013050-212 = "Мы получили сообщение, что кто-то устраивает беспорядки!"
10013050-213 = "Кто шумит на этой священной арене?"
10013050-214 = "Я всего лишь..."
10013050-215 = "Хм-м, судя по вам, вы пришли не участвовать."
10013050-216 = "[s] «Ты это определяешь просто по виду?»"
10013050-217 = "Когда ты боец Mushiqueen, огненный дух карт сияет в твоих глазах!"
10013050-218 = "Ни одно твоё слово для меня не имеет смысла!"
10013050-220 = "В любом случае, если вы не бойцы, проваливайте, сейчас же!"
10013050-221 = "Это место вот-вот превратится в поле боя!"
10013050-222 = "[s] «Мне кажется, оно уже превратилось...»"
10013050-223 = "Погодите! Вы что, Охотники?"
10013050-224 = "Если так, мы вас не простим! Выкинем с корабля за срыв нашего турнира!"
10013050-225 = ""
10013050-228 = ""
10013050-230 = ""
10013050-231 = ""
10013050-232 = "Вы всех, кто сюда приходит, выбрасываете в море? Вы что, пираты?!"
10013050-233 = "Ч-Что нам делать, босс?! Мы ещё слишком молоды, чтобы умирать!"
10013050-234 = "Господин! Даже если мы в опасности, Изуна защитит вас!"
10013050-236 = "*зевок*"
10013050-237 = "Пожалуйста, подождите минутку. Судя по тому, что вы сказали..."
10013050-238 = "Если мы примем участие в соревновании Mushiqueen, мы сможем остаться?"
10013050-239 = "[s] «Мимори?»"
10013050-241 = "А? Ну... наверное."
10013050-242 = "Мы никогда не станем мешать бойцу Mushiqueen."
10013050-244 = "Все, думаю, это хорошая возможность. Если воспользуемся ей, сражаться не придётся."
10013050-245 = "Нам просто нужно выиграть турнир и получить контракт."
10013050-246 = "Ты говоришь так, будто победить легко! Я почти ничего не знаю о Mushiqueen, не говоря уже о правилах..."
10013050-247 = "К счастью, у нас есть несколько экспертов, которые нас поддержат."
10013050-248 = "Это особые участницы Клуба внутренней дисциплины и Отдела фестивалей!"
10013050-249 = "[s] «...Это и правда происходит.»"
10013050-250 = "О!"
10013050-251 = ""
10013050-254 = ""
10013050-256 = ""
10013050-260 = ""
10013050-261 = "Поняла, президент!"
10013050-262 = "Мы приведём вас к победе!"
10013050-264 = "Хи-хи! Подкрепление прибыло!"
10013050-265 = "Пина! Каэдэ! Мы на вас рассчитываем!"
10013050-266 = "[s] «...Мы точно справимся?»"
10013050-267 = "Не знаю! Уghhh! Ладно! Что будет, то будет..."
10013050-268 = "Давайте выиграем турнир Mushiqueen!"
