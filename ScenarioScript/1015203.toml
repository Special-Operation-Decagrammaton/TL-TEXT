[translation]
1015203-1 = "Sleeping Beauty"
1015203-4 = "(Working the night shift...)"
1015203-8 = "[ns1] (...I'm so sleepy.)\n[ns2] \"I think I'll go get some fresh air...\""
1015203-12 = "Nearby Park"
1015203-14 = "(Stepping outside, I felt a bit more awake.)"
1015203-15 = "(Even so, I couldn't hold back a yawn...)"
1015203-16 = "[ns] \"Haaahhh...\""
1015203-17 = "Hehe, that was quite a dynamic yawn."
1015203-18 = "It just woke me from a sweet dream."
1015203-20 = "[ns] \"That voice...\""
1015203-24 = "Ta-da! Sleeping Beauty, Shiina Tsumugi, has arrived."
1015203-25 = "Oh my. You seem quite surprised."
1015203-26 = "Even though I had a feeling this would happen."
1015203-27 = "As I mentioned before, I felt... a sense of destiny."
1015203-28 = "[s] \"Don't tell me... you were sleeping in the park?\""
1015203-29 = "Yes. I find inspiration this way when I'm composing."
1015203-30 = "The city at midnight, bathed in starlight—"
1015203-31 = "The gentle silence of the night wrapping around me... the faint scent of young leaves..."
1015203-32 = "And me, all alone, counting the stars."
1015203-33 = "Doesn't just hearing that spark all sorts of inspiration?"
1015203-34 = "...When I surrender myself to the overflowing images, I gradually drift into a dreamlike state—#nand fall into a slumber."
1015203-35 = "[ns] (Come to think of it... it felt just like this when we first met...)"
1015203-37 = "[ns3] \"But it's dangerous to sleep outside.\"\n[ns4] \"Why don't you go back to the dorms?\""
1015203-40 = "Oh my. You're worried about me?"
1015203-41 = "Thank you. But that's a bit difficult."
1015203-42 = "If I go back... I'll get caught by the dorm patrol."
1015203-43 = "[s] \"You snuck out without permission!?\""
1015203-44 = "\"Experience much, think much, create much\"—"
1015203-45 = "Those are the three elements for creating a masterpiece."
1015203-46 = "A little detour like this during my youth is just another diverse experience. #nI'm sure it will bring me some valuable inspiration."
1015203-47 = "...You have a look of disbelief on your face."
1015203-48 = "I understand. Then, I shall look for a place where I can sleep in peace."
1015203-49 = "For example... Sensei's office, perhaps?"
1015203-50 = "Hehe, meeting like this must be fate. #nWould you mind if I stayed for just one night?"
1015203-51 = "I promise I won't get in the way of your work."
1015203-52 = "[s] \"If you say so, Tsumugi...\""
1015203-55 = "(And so, we headed to Schale...)"
1015203-60 = "This mountain of paperwork, what on earth..."
1015203-61 = "Just looking at it makes me want to fall asleep like a princess pricked by a spinning wheel."
1015203-62 = "Though, would it be more accurate to say I'd fall asleep from a paper cut?"
1015203-66 = "Regardless, is there anything I can help you with?"
1015203-67 = "[s] \"There's a lot that I have to do myself...\""
1015203-68 = "In that case..."
1015203-69 = "I shall play a soothing melody to help your work progress."
1015203-70 = "[s] \"Are you sure? I'd appreciate that!\""
1015203-75 = "(Tsumugi's gentle melody filled the office...)"
1015203-76 = "(Thanks to that, I felt my concentration sharpen...!)"
1015203-80 = "(However, that was short-lived...)"
1015203-84 = "(The sleepiness... is washing over me...)"
1015203-88 = "Hehe, not yet."
1015203-92 = "[ns] \"...!?\""
1015203-93 = "It seems your eyelids have reached their limit."
1015203-94 = "But do not worry."
1015203-95 = "I will play a \"special alarm\" for you."
1015203-96 = "[s5] \"O-okay! Give me some death metal!\"\n[s6] \"I'll finish this all at once with that momentum...!\""
1015203-99 = "Hehe, that's the spirit."
1015203-100 = "Then, let's go with this rhythm."
1015203-101 = "We shall shatter the spinning wheel that invites sleep and burn away the thorns blocking our path."
1015203-106 = "Now, are you ready?"
1015203-107 = "[s] \"Anytime...!\""
1015203-108 = "Then, here we go...!"
1015203-109 = "[s] \"U-Uwoooooh...!!\""
1015203-111 = "(That day, death metal echoed incessantly through the Schale office.)"
1015203-112 = "(Driven by the explosive sound, I somehow managed to finish my work...)"
