[translation]
1300809-1 = "Короткая передышка"
1300809-2 = ""
1300809-3 = ""
1300809-4 = ""
1300809-5 = "..."
1300809-6 = "Эй, Сенсей. Вы рано."
1300809-7 = "[s1] «Ты в порядке, Серика?»\n[s2] «Что случилось? У тебя ноги дрожат.»"
1300809-8 = "Я в порядке... Это пустяки..."
1300809-9 = "Я в порядке... Это пустяки..."
1300809-10 = "У-Уа!"
1300809-11 = ""
1300809-13 = ""
1300809-14 = "С-Спасибо, Сенсей. Я чуть не упала в обморок."
1300809-15 = "Я-я уже в порядке. Можете меня не держать."
1300809-16 = "Х-Хм? Я плохо выгляжу?"
1300809-17 = "Я-я просто немного устала, вот и всё!"
1300809-18 = "Я не спала со вчерашнего дня... но всё нормально. Не переживайте так."
1300809-19 = "[s] «Со вчерашнего дня?»"
1300809-20 = "А..."
1300809-21 = "Ага. Я-я работала всю ночь на патрульной подработке..."
1300809-22 = "[s] «Ты работала ночью?»"
1300809-23 = "А-после этого у меня была утренняя подработка с доставкой молока..."
1300809-24 = "[s] «И ты делала это до рассвета?»"
1300809-25 = "Н-Неважно. Если мы не начнём уборку... то не уложимся в срок..."
1300809-26 = "(пошатывается)"
1300809-27 = ""
1300809-29 = "*плюх*"
1300809-30 = "[s] «Серика?!»"
1300809-32 = "..."
1300809-33 = "У-Уаа!"
1300809-34 = ""
1300809-35 = "(встаёт)"
1300809-36 = "Я-я, видимо, отключилась!"
1300809-37 = "Это скамейка в парке?"
1300809-38 = "П-Почему вы меня не разбудили, Сенсей?! Что теперь будет с работой?"
1300809-39 = "О нет, уже день. Сколько я проспала?!"
1300809-40 = "[s3] «Успокойся.»\n[s4] «Я уже всё согласовал с твоим начальником.»"
1300809-41 = "А-А?"
1300809-42 = "А-А?"
1300809-43 = "Н-Но всё равно..."
1300809-44 = "[s] «Я не могу позволить тебе и дальше так себя загонять.»"
1300809-45 = "..."
1300809-46 = "Н-Не могу поверить, что отключилась прямо перед вами..."
1300809-47 = "А вы просто смотрели, как я сплю, вы... жуткий идиот! Я вообще-то невинная старшеклассница!"
1300809-49 = "..."
1300809-50 = ""
1300809-52 = "(*вздох* Сенсей прав.)"
1300809-53 = "(Нет смысла работать до тех пор, пока здоровье не перестанет позволять мне работать вообще...)"
1300809-54 = "(Тогда я только стану обузой для остальных.)"
1300809-55 = ""
1300809-57 = "..."
1300809-58 = ""
1300809-59 = "Раньше я часто приходила сюда и сидела на этих качелях."
1300809-60 = "Правда, это было давно. Уже не помню насколько..."
1300809-61 = "Ладно."
1300809-62 = ""
1300809-64 = "Серика села на качели."
1300809-67 = "― (Я должна продолжать делать всё, что могу.)"
1300809-69 = "― (Я не хочу, чтобы этот город просто исчез...)[wa:920]"
1300809-72 = "― По крайней мере, приятно... и-иметь взрослого, на которого можно положиться...[wa:320]"
1300809-75 = "― Сенсей, идите сюда. Хотите ко мне?[wa:2780]"
1300809-77 = "― Ха-ха. Я шучу. Не думаю, что здесь хватит места на двоих.[wa:1520]"
1300809-80 = "― Эй, вы меня слушаете? Я серьёзно.[wa:1940]"
1300809-82 = "― Честное слово."
1300809-85 = "― Хм? Думаете, мне пришлось через многое пройти?[wa:260]"
1300809-87 = "― Вы знаете, как сильно я стараюсь? Что вы имеете в виду...?[wa:2340]"
1300809-91 = "― Ч-Что... вы такое говорите?! Не пытайтесь меня утешать![wa:1000]"
1300809-94 = "― Ничего... Просто... пыль в глаза попала. Вот и всё![wa:1220]"
1300809-97 = "― (Но если бы не Сенсей... возможно, я бы и не дошла так далеко.)[wa:3420]"
1300809-99 = "― А...? Чего вы смотрите?! У меня что-то на лице...?[wa:440]"
1300809-102 = "― Что? Хотите покачать меня?"
1300809-104 = "― Нет... Не надо! А если кто-нибудь увидит?![wa:520]"
1300809-107 = "― То есть... вокруг никого нет, но всё равно![wa:10]"
1300809-109 = "― Е-Если люди узнают, что я вот так хожу на свидание с Сенсеем...[wa:840]"
1300809-111 = ""
1300809-112 = "..."
1300809-113 = "С-Спасибо за сегодняшний день."
1300809-114 = "Я прислушаюсь к вашему совету и постараюсь больше не перерабатывать, Сенсей."
1300809-115 = "П-Правда, возможно, мне иногда придётся на вас полагаться..."
1300809-116 = "..."
1300809-117 = "Не смейтесь! Я серьёзно!"
1300809-118 = "*вздох* А вы ведь здесь взрослый."
1300809-119 = "...Хотя в этой вашей стороне тоже есть своё очарование."
1300809-120 = "*зевок* Кажется, после отдыха мне уже лучше."
1300809-121 = "Думаю, завтра снова смогу выйти на работу."
1300809-122 = ""
1300809-123 = ""
1300809-124 = "Готовы идти, Сенсей?"
