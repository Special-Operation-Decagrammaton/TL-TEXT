[translation]
10049140-1 = "Послесловие;Рождение злой офицерши"
10049140-2 = "[log]3 дня назад...[/log]"
10049140-4 = "Эта должна идти сюда."
10049140-5 = "А эта — туда."
10049140-6 = "Идеально...! Посмотрите на все эти восстановленные книги, аккуратно расставленные."
10049140-7 = "Ночью в библиотеку никто не приходит. Хорошо."
10049140-8 = "Лучше вернуться в старую библиотеку, пока кто-нибудь не заглянул."
10049140-9 = "Волшебница... Злая офицерша..."
10049140-10 = "Волшебницы защищают мир во всём мире."
10049140-11 = "И-и—"
10049140-12 = "—ик..."
10049140-13 = ""
10049140-15 = ""
10049140-16 = "Злая офицерша, антагонист..."
10049140-17 = "(Фух, напугала... Это всего лишь Шимико.)"
10049140-18 = "(Она всё ещё сортирует? Я думала, все детские пожертвования уже подготовлены.)"
10049140-19 = "Злые офицеры — антагонисты... которые пытаются победить волшебниц..."
10049140-20 = "Что?!"
10049140-21 = "(Ч-Что...? Победить? Злые офицеры?)"
10049140-22 = "(Что говорит Шимико? Она заболела?)"
10049140-23 = "(Обычно я бы не вмешивалась, но это ведь Шимико...)"
10049140-24 = "(Кажется, она меня ещё не заметила, так что лучше понаблюдать...)"
10049140-25 = ""
10049140-26 = ""
10049140-27 = ""
10049140-28 = "(Она сложила на тележку кучу манги и романов...)"
10049140-29 = "(Я знаю, она любит читать наши книги, но почему именно сейчас...?)"
10049140-30 = "(Там около двухсот книг...)"
10049140-31 = ""
10049140-32 = ""
10049140-33 = ""
10049140-34 = "*бормочет*"
10049140-35 = "*шёпот* *шёпот*"
10049140-36 = "(Страшные глаза...!)"
10049140-37 = "(Она прочитала эту книгу по диагонали меньше чем за минуту?!)"
10049140-38 = "(Я знала, что она читает быстро, но НЕ НАСТОЛЬКО!)"
10049140-39 = "(И все книги про волшебниц. Она теперь ими увлеклась...?)"
10049140-40 = ""
10049140-41 = "*бормочет* «Я разнесу весь этот город... в руины...»"
10049140-42 = "...Хорошо."
10049140-43 = ""
10049140-45 = ""
10049140-46 = "(Что значит «хорошо»?!)"
10049140-47 = "(О, и на той тележке не только манга про девочек-волшебниц...)"
10049140-48 = "(«Современная криминальная психология»? «Массовая пропаганда»? «Практическое... шитьё одежды 2»?)"
10049140-49 = "(Зачем ей всё это?!)"
10049140-53 = "(Она закончила скорочтение. У меня голова закружилась от одного наблюдения...)"
10049140-54 = "(А теперь она направляется... в кинозал?)"
10049140-55 = "(С целой кучей DVD с аниме про девочек-волшебниц.)"
10049140-56 = "(Я знаю, что она умеет быстро читать, но как она собирается быстро СМОТРЕТЬ?)"
10049140-57 = ""
10049140-59 = ""
10049140-61 = "(А. Начала.)"
10049140-62 = "(Ну... думаю, разберётся.)"
10049140-63 = "(Никогда бы не подумала, что Шимико заинтересуется подобными вещами.)"
10049140-64 = "(Лучше вернусь в старую библиотеку...)"
10049140-65 = ""
10049140-68 = "?"
10049140-69 = "(Она перематывает вперёд?)"
10049140-70 = ""
10049140-74 = "И-и..."
10049140-75 = "(Погоди, она всё увеличивает скорость?)"
10049140-76 = ""
10049140-82 = "(В 32 раза быстрее обычного?!)"
10049140-83 = "(КТО вообще так смотрит аниме?!)"
10049140-84 = "(Она посмотрела целую серию за 50 секунд?)"
10049140-85 = "(Я даже не понимаю, что они говорят!!)"
10049140-86 = "(У-угх, от этих вспышек у меня уже голова болит...)"
10049140-87 = "(Лучше пока вернусь, а завтра спрошу её, когда всё будет выглядеть нормально...)"
10049140-88 = ""
10049140-90 = ""
10049140-92 = "..."
10049140-93 = "..."
10049140-95 = "..."
10049140-96 = "Угх, я вообще не спала..."
10049140-97 = "Всё из-за беспокойства о Шимико. Интересно, она уже вернулась?"
10049140-98 = "Может, пойду проверю, всё ли она ещё там."
10049140-99 = ""
10049140-100 = "..."
10049140-101 = "(Она всё ещё здесь?!)"
10049140-102 = "(Она смотрит уже 8 часов, значит...)"
10049140-103 = "(Она посмотрела 580 серий за одну ночь?!)"
10049140-104 = "(Что мне делать, что мне делать...? Что вообще заставило её на такое пойти?!)"
10049140-105 = "«Хмф, думаю, на этом всё»."
10049140-106 = "(И после ВСЕГО этого она говорит именно ТАК?!)"
10049140-107 = "«Теперь завеса тьмы должна быть в моих руках»."
10049140-108 = "(Завеса... чего?)"
10049140-109 = ""
10049140-111 = ""
10049140-112 = "(П-плохо дело. Ненавижу делать такие вещи, но...!)"
10049140-113 = "(...Мне нужно остановить Шимико. Вопросы задам потом...)"
10049140-114 = "(Если станет опасно, всегда можно выстрелить ей в голову. Это её вырубит.)"
10049140-115 = ""
10049140-116 = ""
10049140-117 = "(Что теперь-то...?)"
10049140-118 = "(Разве это не... светонепроницаемые шторы для защиты книг и чёрное покрытие для ремонта пола?)"
10049140-119 = "(Разве это не материалы для обслуживания библиотеки? Что она собирается с ними...?)"
10049140-120 = "(Она что... всю ночь занималась ремонтом...?)"
10049140-121 = "(Ну, по крайней мере, она не ВСЮ ночь смотрела аниме...)"
10049140-122 = "(Похоже, я зря переживала. Ладно, может, мне просто вернуться и...)"
10049140-123 = ""
10049140-126 = "(...Почему она режет всё это ножницами?)"
10049140-127 = "А?"
10049140-128 = "(Она режет и сшивает совершенно нормальные шторы и покрытие...)"
10049140-129 = ""
10049140-131 = ""
10049140-132 = "???"
10049140-133 = ""
10049140-135 = ""
10049140-137 = "(Э-это...!)"
10049140-139 = ""
10049140-140 = "(Погоди, да что это вообще такое?!)"
10049140-141 = "(Н-не может быть, чтобы Шимико стала делать такое...)"
10049140-142 = "(Г-говорят, если что-то сломалось, надо попробовать выключить и включить.)"
10049140-143 = "(Один выстрел в голову — и она, надеюсь, перезагрузится...)"
10049140-144 = ""
10049140-146 = ""
10049140-147 = "И-и..."
10049140-148 = "Кто там?!"
10049140-150 = "А-а-а!!!"
10049140-151 = ""
10049140-153 = ""
10049140-155 = ""
10049140-156 = "..."
10049140-157 = "Хм, надо сделать голос немного суровее."
10049140-158 = "Злой офицер должен говорить чуть более...!"
10049140-159 = "Кхм, кхм! А, а-а!"
10049140-160 = "Кто там?!"
