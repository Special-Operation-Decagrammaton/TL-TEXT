[translation]
2001205-1 = "Химуро Сэна"
2001205-3 = "Я пришёл к берегу реки, где мы договорились встретиться с Сэной, немного раньше."
2001205-4 = ""
2001205-5 = "К моему удивлению, Сэна уже была там."
2001205-6 = "О. Сенсей."
2001205-7 = "Вы рано. Я как раз вас ждала."
2001205-8 = "[s1] «Ты пришла ещё раньше меня.»\n[s2] «Ты давно ждёшь?»"
2001205-9 = "Ну..."
2001205-10 = "Ну..."
2001205-11 = "[s] «Сэна?»"
2001205-12 = "Ничего. Но если быть точной, я пришла на 1 час 27 минут раньше."
2001205-13 = "У меня не было ни работы, ни других планов, поэтому я пришла заранее прогуляться."
2001205-14 = "Я ждала встречи с вами."
2001205-15 = "Мне не хотелось показывать другим членам клуба, насколько я была рада."
2001205-16 = "[s3] «Ну, это очень прямолинейно.»\n[s4] «Знаешь, можешь немного расслабиться.»"
2001205-17 = "О. Верно."
2001205-18 = "О. Верно."
2001205-19 = "Мне стоит забрать обратно одеяло и полотенце."
2001205-20 = "Что?"
2001205-21 = "Это можно сделать позже? Я не совсем понимаю, что вы имеете в виду."
2001205-22 = "Зачем вы расстилаете одеяло на земле?#nВы хотите, чтобы мы здесь сели?"
2001205-23 = "Это коробки с обедом?"
2001205-24 = "Понятно. Значит, пикник. А я всё думала, что вы имели в виду, когда сказали, что хотите отплатить мне."
2001205-25 = "Вы переживаете, что мне такое может не понравиться?"
2001205-26 = "Нет, дело не в этом. На самом деле я давно хотела когда-нибудь сделать что-то подобное."
2001205-27 = "Простите... Я понимаю, что всегда слишком напряжена и не очень умею выражать свои чувства."
2001205-28 = "Но я действительно рада. Думаю, этот день запомнится надолго."
2001205-29 = "Я уже делала что-то похожее с Клубом экстренной медицинской помощи,#nно атмосфера была совсем другой, да и обычным пикником это не назовёшь."
2001205-30 = ""
2001205-32 = ""
2001205-33 = "Интересно... вот так ощущается свидание? Это волнительно."
2001205-34 = "Я никогда раньше не ходила на свидания, поэтому не уверена, правильно ли это так воспринимать."
2001205-35 = "[s5] «Свидание?!»\n[s6] «Я-Я не думал, что ты воспримешь это именно так!»"
2001205-36 = "О. Если это проблема, можем забыть мои слова и двигаться дальше."
2001205-37 = "О. Если это проблема, можем забыть мои слова и двигаться дальше."
2001205-38 = "Я всегда переживаю, что не умею ясно выражать свои мысли..."
2001205-39 = "...но думаю, если кто-то и способен меня понять, то это вы.#nВ конце концов, вы мой Сенсей."
2001205-40 = "Вообще-то с самой нашей встречи вы для меня в некотором смысле загадка."
2001205-41 = "Иногда вы ведёте себя именно так, как я ожидаю,#nа иногда полностью разрушаете мои ожидания."
2001205-42 = "И всё же эта ваша черта никогда не заставляла меня чувствовать себя неуютно."
2001205-43 = "Мы не так уж много времени проводили наедине,#nпоэтому интересно, что я уже начала так к вам относиться."
2001205-44 = "[s7] «Я тоже считаю тебя необычным человеком.»\n[s8] «Я мог бы сказать о тебе всё то же самое.»"
2001205-45 = "...?"
2001205-46 = "...?"
2001205-47 = "Правда? Значит, вы чувствовали то же самое."
2001205-48 = "Полагаю, мы во многом похожи."
2001205-49 = "Мне приятно это слышать."
2001205-50 = "Что ж, мы уже достаточно наговорились. Давайте насладимся обедом."
2001205-51 = "После можете вернуть мне вещи."
2001205-52 = "Чтобы я могла..."
2001205-53 = ""
2001205-55 = ""
2001205-56 = "Эм."
2001205-57 = "[s9] «...?»\n[s10] «Sena?»"
2001205-58 = "Ничего."
2001205-59 = "Ничего."
2001205-60 = "Это может подождать."
2001205-62 = "Затем мы с Сэной устроили небольшой пикник под ближайшим деревом."
2001205-63 = "Я ел тот же привычный обед из магазина у дома,#nно почему-то он казался вкуснее обычного."
