[translation]
2000705-1 = "Решимость виртуального идола"
2000705-3 = ""
2000705-4 = ""
2000705-5 = "О, Сенсей, сюда. Я здесь!"
2000705-6 = "Простите, что снова заставила вас ради меня идти сюда."
2000705-7 = "Я старалась не высовываться и избегать людных мест. С тех пор как начали показывать рекламу концерта, всё больше людей узнают меня на улицах."
2000705-8 = "К тому же я не знаю, как смотреть им в глаза после того, как сама думала об отмене концерта."
2000705-9 = ""
2000705-12 = "Ой-ой."
2000705-13 = ""
2000705-15 = ""
2000705-19 = "Вы слышали?"
2000705-20 = "Знаменитый виртуальный идол Хацунэ Мику даст живой концерт в Кивотосе!"
2000705-21 = "Я всегда мечтала увидеть её вживую!"
2000705-22 = ""
2000705-26 = ""
2000705-27 = "Надеюсь, концерту ничто не помешает..."
2000705-28 = "[s] «Это не твоя вина, Мику.»"
2000705-29 = "Нет. Может быть, всё-таки моя. Где-то глубоко внутри..."
2000705-30 = "...кажется, часть меня хотела, чтобы этот концерт отменили."
2000705-31 = "[s] «Организатор сцены снова тебя доставал?»"
2000705-32 = "Нет, конечно! Все сотрудники относятся ко мне просто замечательно."
2000705-33 = "Просто когда я вижу этот мир, моё сердце начинает биться быстрее..."
2000705-34 = "Раньше, как виртуальный идол, я пела только песни, рождённые в чьём-то чужом сердце."
2000705-35 = "И предстоящее выступление ничем не должно было отличаться."
2000705-36 = "Чужая любовь, чужая грусть, чужие чувства..."
2000705-37 = "Моя задача состояла в том, чтобы взять музыку, льющуюся из их прекрасных сердец, и спеть её вместо них."
2000705-38 = "В этом моё предназначение — причина моего существования."
2000705-39 = "Но после того как я получила это тело и сама ощутила мир, у меня внезапно появились собственные желания."
2000705-40 = "Я подумала, что хочу научиться по-настоящему петь от всего сердца."
2000705-41 = "Будто всё, чему я научилась из песен, которые исполняла раньше, внезапно поднялось внутри меня. Я никогда прежде не испытывала ничего подобного. Это было так странно."
2000705-42 = "[s] «В этом нет ничего странного.»"
2000705-44 = "[s] «Совершенно естественно иногда чувствовать себя переполненной эмоциями.»"
2000705-45 = "Спасибо, Сенсей."
2000705-46 = "Я знала, что вы найдёте правильные слова."
2000705-47 = "...Но в итоге всё это не имеет значения."
2000705-48 = "В нынешнем состоянии я вообще не могу исполнять песни."
2000705-49 = ""
2000705-52 = "О. Именно её выбрали для рекламы."
2000705-53 = ""
2000705-55 = ""
2000705-56 = "Я скучаю по ней..."
2000705-57 = "Это песня, которую я исполнила сразу после дебюта."
2000705-58 = "Тогда всё казалось таким новым..."
2000705-59 = "... ♪"
2000705-60 = "... ♪♫"
2000705-61 = ""
2000705-64 = "[ns1] «Мику, ты сейчас...»\n[ns2] «Ты только что спела!»"
2000705-67 = "А-А? Вы правы."
2000705-68 = "Я и сама не заметила, как песня просто..."
2000705-69 = "Какое облегчение. Значит, концерт не придётся отменять."
2000705-70 = "Попробую ещё раз."
2000705-71 = ""
2000705-73 = ""
2000705-75 = ""
2000705-76 = "..."
2000705-77 = "А? Странно. Я не могу спеть ни одну из песен, которые должна исполнять на концерте."
2000705-78 = "А старую песню я спела без проблем. Что между ними такого разного?"
2000705-79 = "[s] «Может, потому что в тех песнях нет твоих собственных чувств?»"
2000705-80 = "Значит, я не могу петь песни, которые не чувствую глубоко в сердце..."
2000705-81 = "Но идол не должен вести себя так."
2000705-82 = "К тому же, как я уже говорила, песни для выступления уже выбраны."
2000705-83 = "[s] «Тогда спой песню прямо от сердца!»"
2000705-84 = "А?"
2000705-85 = "Но даже если мы изменим сет-лист, я всё равно не смогу исполнить то, чего от меня ожидали."
2000705-86 = "[s] «Тогда напиши песни, которые идут из твоего собственного сердца.»"
2000705-88 = "[s] «А потом я разберусь, что делать дальше.»"
2000705-89 = "Правда?"
2000705-90 = "Обычно вы такой рассудительный, Сенсей, но иногда бываете довольно безрассудным."
2000705-91 = ""
2000705-93 = ""
2000705-94 = "...Хотя не могу сказать, что я с вами не согласна. Другого выхода, похоже, нет."
2000705-95 = "Меньше всего мне хочется, чтобы мой самый первый концерт в реальном мире закончился провалом."
2000705-96 = ""
2000705-98 = ""
2000705-99 = ""
2000705-101 = "Раз уж другого пути нет, я напишу лучшую песню на свете... прямо от всего сердца!"
