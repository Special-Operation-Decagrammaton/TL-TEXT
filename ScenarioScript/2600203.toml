[translation]
2600203-1 = "Рецепт девушки"
2600203-2 = "Студенческая столовая Геенны №8"
2600203-3 = "Сегодняшнее блюдо..."
2600203-4 = "...карри!"
2600203-5 = "[s] «О. Это... безопасно.»"
2600203-6 = "Мы не так уж часто готовим вместе, поэтому..."
2600203-7 = "...я подумала: почему бы не выбрать то, что нравится всем?"
2600203-8 = "Карри для тебя слишком простое?"
2600203-9 = "Можем снова приготовить гамбас, как в прошлый раз."
2600203-10 = "[s] «Нет-нет! Простое — отлично! Чем проще, тем лучше!»"
2600203-11 = "Хм. Правда так думаешь?"
2600203-12 = "Ладно, начнём с ингредиентов!"
2600203-14 = "Я заранее принесла всё, что понадобится для карри."
2600203-15 = "Вот брикет карри, свинина, три картофелины, одна луковица..."
2600203-16 = "...морковь и куча специй, с которыми потом можно поэкспериментировать."
2600203-17 = "Думаю, этого хватит."
2600203-18 = "[s] «На удивление нормально.»"
2600203-19 = "Простите?"
2600203-20 = "[s] «Эм. Ничего.»"
2600203-21 = "Хм? Ну, тогда займёмся подготовкой ингредиентов."
2600203-22 = "Согласно рецепту, для сладкого карри особенно важна текстура свинины."
2600203-23 = "Поэтому мясо нужно как следует размягчить."
2600203-24 = "[s1] «Размягчить его можно разными способами.»\n[s2] «Можно использовать измельчённый чеснок или молоко.»"
2600203-25 = "Согласна, вариантов у нас несколько..."
2600203-26 = "Согласна, вариантов у нас несколько..."
2600203-27 = "...но я как раз вспомнила один хороший способ."
2600203-28 = "Чем сильнее разминать мясо, тем мягче оно станет."
2600203-29 = "А что справится с этим лучше, чем ВОТ ЭТО?!"
2600203-30 = ""
2600203-31 = "[s] «Юри. Что это у тебя в руках?»"
2600203-32 = "Ружьё."
2600203-33 = "Если точнее, двустволка. Одним выстрелом я могу нашпиговать мясо десятками дробин и размолотить его!"
2600203-34 = "[s3] «Раздробить» — это ещё мягко сказано!\n[s4] «Вот уж действительно превратить в фарш!»"
2600203-35 = "Хия! ☆"
2600203-36 = "Хия! ☆"
2600203-44 = "Теперь мясо должно быть достаточно мягким."
2600203-45 = "[ns5] «Я бы не назвал это мягким!»\n[ns6] «Никогда не слышал о рецепте, где требуется оружие!»"
2600203-46 = "Я плохо справилась?!"
2600203-47 = "Я плохо справилась?!"
2600203-48 = "Так и знала..."
2600203-49 = "Остальные всегда пугаются и пытаются меня остановить, когда я достаю оружие на кухне."
2600203-50 = "А я думала, они просто хотят подсказать, как правильно держать его... *дуется*"
2600203-51 = "[s] «Ты думала, проблема в ХВАТЕ?!»"
2600203-52 = "Ну Сенсей! Все знают, насколько важна правильная техника при работе с инструментами!"
2600203-53 = "Если неправильно обращаться, например, с ножом, можно пораниться. Надо быть осторожнее!"
2600203-54 = "[s] «Почему это теперь МЕНЯ отчитывают?!»"
2600203-55 = "Я-Я могла один раз немного ошибиться, но дальше всё пойдёт как по маслу!"
2600203-56 = "Рецепт... Рецепт..."
2600203-57 = "А, вот и оно."
2600203-58 = "Следующий шаг — обжарить ингредиенты."
2600203-59 = "Согласно рецепту, правильный порядок обжарки такой..."
2600203-60 = "...сначала морковь, потом картошка, а лук — последним."
2600203-61 = "[s] «Без проблем. Начнём с моркови.»"
2600203-62 = "Но разве это не займёт слишком много времени?"
2600203-63 = "[s] «Что?»"
2600203-64 = "Клубу школьного питания всегда приходится быстро готовить огромные порции, чтобы успеть к обеду."
2600203-65 = "Я всё думала, как можно готовить быстрее в наших ограниченных сроках..."
2600203-66 = "...и в итоге пришла к ВОТ ЭТОМУ революционному решению!"
2600203-67 = "Ях!"
2600203-68 = ""
2600203-73 = "[s] «Нет. Стой. Погоди. Остановись!»"
2600203-74 = "Что-то не так, Сенсей?"
2600203-75 = "[s] «Нельзя просто бросить все ингредиенты в кастрюлю разом! Они приготовятся неравномерно!»"
2600203-76 = "Каждому овощу нужно разное время приготовления."
2600203-77 = "Ты ведь именно это хочешь, чтобы я учитывала?"
2600203-78 = "[s] «Это же здравый смысл!»"
2600203-79 = "Кхм! Я член Клуба школьного питания. Конечно, я это знаю! ♪"
2600203-80 = "Но вот тут и пригодится мой новый революционный метод."
2600203-81 = "Та-дам! Можно использовать это!"
2600203-82 = "[s] «Это что... паяльная горелка?»"
2600203-83 = "Ага. Если огня газовой плиты недостаточно, чтобы всё готовилось равномерно..."
2600203-84 = "...можно горелкой прожарить всё сразу со всех сторон!"
2600203-85 = "А если использовать плиту и горелку вместе, огневой мощи будет вдвое больше!"
2600203-86 = "[s] «Так готовка не работает! Ты же...!»"
2600203-87 = "Хия! ★"
2600203-90 = "(Метод Юри и правда оказался революционным. Масштаб разрушений после него внушал ужас.)"
2600203-92 = "(Чёрный обугленный порошок карри разбросан больше чем по половине пола столовой.)"
2600203-93 = "(Газовая плита пылает как костёр.)"
2600203-94 = "(Из кастрюли переливается смесь карри и рагу, кипящая словно лава.)"
2600203-95 = "К-Как это опять произошло...?"
2600203-96 = "[s] «Кажется, я знаю причину.»"
2600203-97 = "Я-Я просто хотела как можно быстрее приготовить карри для студентов..."
2600203-98 = "[s] «Вот именно. Ты поставила скорость выше соблюдения рецепта.»"
2600203-99 = "В-Всё нормально! Мы можем начать сначала!"
2600203-100 = "Для начала надо потушить огонь!"
2600203-101 = "Вот!"
2600203-102 = "[s] «Стой, Юри. Не надо...!»"
2600203-104 = "Ой. Похоже, взрыв включил систему пожаротушения..."
2600203-108 = "(Промокнув насквозь, мы с Юри жарко обсудили, что пошло не так.)"
