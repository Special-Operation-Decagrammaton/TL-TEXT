[translation]
10018040-1 = "Эпизод 4; Никто не заметит разницы!"
10018040-2 = "Внутри фабрики"
10018040-4 = ""
10018040-5 = "Единственный вкус, который имеет значение, — вкус денег!"
10018040-6 = "Главное — чтобы еду было достаточно безопасно есть! Приправы дадут массам нужный вкус!"
10018040-7 = "Изысканная еда — это просто когнитивный диссонанс!"
10018040-8 = "Прибыль — вот реальность!"
10018040-9 = ""
10018040-11 = ""
10018040-12 = "Покупаем посредственные ингредиенты огромными партиями, потом подмешиваем низкосортные, чтобы увеличить объём и маржу!"
10018040-13 = "Запатентованная синтетическая приправа Няо Фудс скроет качество, пока мы будем купаться в деньгах!"
10018040-14 = "Не переживайте из-за жалоб! Если жалуются — значит, покупают!"
10018040-15 = ""
10018040-17 = ""
10018040-18 = "Мва-ха-ха-ха! А вся эта прибыль пойдёт на благое дело..."
10018040-19 = "На работу и расширение Cafe Няо — сети будущего!"
10018040-20 = "Идиоты выращивают еду. А я выращиваю бизнес!"
10018040-21 = ""
10018040-22 = "Босс, у меня есть доклад."
10018040-23 = "Доклад, прекрасно. Мва-ха-ха. Кстати, я же велел здесь называть меня председателем Няо."
10018040-24 = "Ах да. Эм, председатель Няо, есть срочное сообщение."
10018040-25 = "Срочное? Пф. Мва-ха-ха."
10018040-26 = "Что может быть срочнее, чем хвастаться самому себе своими деньгами?"
10018040-27 = "Если это окажется не важнее, заплатишь за это. В буквальном смысле. Мва-ха-ха."
10018040-28 = "Итак... сообщение такое..."
10018040-30 = "Хм..."
10018040-31 = "Что нам делать, председатель Няо?"
10018040-32 = "Я как раз думал, что делать с этим рестораном..."
10018040-33 = "Для начала какой-то мелкий клуб вроде Общества гурманов меня совершенно не интересует."
10018040-34 = "А вот огромная академия, частью которой является этот клуб, Геенна, уже может стать проблемой."
10018040-36 = "Я слышал, что Общество гурманов не слишком популярно в Геенне."
10018040-37 = "Эта информация надёжна?"
10018040-38 = "А? Эм, да, конечно."
10018040-39 = "Хорошо. Твоя явная уверенность внушает мне доверие к этому ответу."
10018040-40 = ""
10018040-42 = ""
10018040-43 = "Теперь мне остаётся лишь прихлопнуть назойливую букашку под названием Общество гурманов..."
10018040-46 = "Внутри «Воробья»"
10018040-47 = "Пожалуйста, подумайте ещё раз. «Воробей» слишком ценен, чтобы от него отказываться!"
10018040-48 = "Да, мы только начали. Не сдавайтесь, даже не дав себе шанса..."
10018040-50 = "Спасибо вам всем. Я ценю вашу доброту."
10018040-51 = "Но мне настолько же неловко, насколько я благодарна. Я была для вас лишь обузой."
10018040-52 = "[s] «Редко увидишь, чтобы Харуна и Фуука соглашались друг с другом.»"
10018040-53 = "Сенсей? Что вы имеете в виду?"
10018040-54 = "...Сейчас об этом можно не переживать."
10018040-55 = "В любом случае, если мы вмешаемся ещё сильнее, придётся преодолеть множество проблем."
10018040-56 = "А такая крупная компания, как Няо Фудс, — слишком большая проблема."
10018040-57 = "Сначала я думала, что проблема лишь в недостатке моих навыков и мне просто нужна небольшая помощь..."
10018040-58 = "...но всё выходит из-под контроля всё сильнее."
10018040-59 = ""
10018040-60 = "Но этот ресторан передавался из поколения в поколение."
10018040-61 = "Верно, вы говорили, что хотите защитить его несмотря ни на что."
10018040-63 = ""
10018040-65 = ""
10018040-66 = "Вы правы... Возможно, лучше всего будет присоединиться к франшизе Няо Фудс."
10018040-67 = "По крайней мере, здание останется у меня."
10018040-68 = "Нет, это неправильно."
10018040-69 = "Изысканная кухня — это не только еда, но и место, атмосфера, история, обстоятельства..."
10018040-70 = "Гастрономия начинается тогда, когда все эти элементы вместе превращают покупку ужина во что-то большее, чем простая сделка."
10018040-71 = "Я не позволю «Воробью» потерять свою душу."
10018040-73 = ""
10018040-76 = ""
10018040-77 = ""
10018040-78 = "Думаю, вам не стоит сдаваться."
10018040-79 = "П-Правда?"
10018040-80 = ""
10018040-82 = ""
10018040-83 = "Я совсем не умею готовить."
10018040-84 = "Всё, что я делаю, заканчивается руинами. Единственное, что я способна создавать, — катастрофы."
10018040-85 = "Стоит мне допустить одну маленькую ошибку — и еда вдруг оживает и начинает нападать на людей."
10018040-87 = "...Что? Тебе не кажется, что ты упускаешь самую важную часть?"
10018040-88 = "Но сколько бы травм из-за пасты я ни причинила, я никогда не сдамся!"
10018040-89 = "Фуука и Сенсей всегда рядом, чтобы поддержать и подбодрить меня, а главное — я не хочу отворачиваться от готовки!"
10018040-90 = "Может, я и не хороший повар, но я люблю готовить!"
10018040-92 = "Ничто не делает меня счастливее, чем люди, которые едят мою еду."
10018040-93 = "Нет смысла бросать всё на полпути!"
10018040-94 = "Я знаю, однажды смогу каждый день готовить вкусную еду."
10018040-96 = "И я не хочу видеть, как вы тоже сдаётесь..."
10018040-97 = "Надеюсь, я не перешла границу, сказав вам это."
10018040-98 = "Все..."
10018040-99 = "Но если я не сдамся, то что мне вообще делать?"
10018040-100 = ""
10018040-102 = "[s] «Ну, еда у нас есть, повара у нас есть...»"
10018040-104 = "[ns] «Осталось лишь, чтобы о ней узнали покупатели.»"
10018040-105 = ""
10018040-106 = ""
10018040-107 = "Понятно. А как насчёт дегустационной акции?"
10018040-108 = "Да. Пора показать людям результаты нашей работы."
10018040-109 = "Новый, улучшенный «Воробей» с едой, которая способна подтвердить эти слова. Хи-хи."
10018040-110 = "Ресторан с верными посетителями переживёт что угодно! Давайте сделаем это вместе!"
10018040-112 = "Неужели..."
10018040-113 = ""
10018040-115 = ""
10018040-116 = ""
10018040-117 = "Мне правда можно дать себе ещё один шанс?"
10018040-118 = ""
10018040-120 = "Я ждала, когда вы спросите."
10018040-121 = "И ответ — да! Мы поможем вам во всём!"
10018040-123 = "Мы только начинаем."
10018040-124 = "!!"
10018040-125 = ""
10018040-128 = "[ns] «Пора дать людям попробовать „Воробья“.»"
