[translation]
1012602-1 = "Особое зелье"
1012602-2 = "Каноэ не ответила, поэтому я отправился в общежитие Общества оккультизма."
1012602-3 = ""
1012602-8 = "Общежитие Общества оккультизма"
1012602-9 = ""
1012602-10 = "Добро пожаловать, Сенсей..."
1012602-11 = "Ты так быстро пришёл ко мне. Должно быть, ты помнишь наши прошлые жизни... когда мы были возлюбленными."
1012602-12 = "[s1] «П-Прошлые жизни...?»\n[s2] «Возлюбленными?!»"
1012602-15 = "Именно. Мы с тобой были неразлучны."
1012602-16 = "...Хм? По твоему лицу видно, что ты всё-таки не помнишь."
1012602-17 = "После всего, что ты мне говорил, после всей той нежности..."
1012602-18 = ""
1012602-20 = ""
1012602-21 = ""
1012602-22 = ""
1012602-23 = "...ты правда всё забыл? Даже моё прикосновение, холодное как свежевыпавший снег...?"
1012602-24 = "[s] «А? Почему у тебя рука такая холодная...?»"
1012602-25 = "Значит, всё-таки забыл."
1012602-26 = "Мои руки могут быть холодными, но сердце у этой женщины тёплое-тёплое."
1012602-27 = "А разум полон воспоминаний. Воспоминаний о тебе."
1012602-28 = ""
1012602-30 = ""
1012602-31 = ""
1012602-32 = "Не говоря уже о моём таланте к оккультизму."
1012602-33 = "Вот... я помогу тебе вспомнить."
1012602-34 = "Именно... поэтому я позвала тебя сюда, Сенсей."
1012602-35 = "Смотри.#nС помощью алхимии и небольшого кулинарного мастерства... я сварю зелье, которое вернёт тебе все драгоценные воспоминания."
1012602-36 = "Как только у нас будут нужные ингредиенты, конечно."
1012602-37 = "И один из них нужен от тебя. Особый ингредиент, пропитанный твоими воспоминаниями."
1012602-38 = "[s] «И что конкретно за ингредиент?»"
1012602-39 = "Какая-нибудь твоя вещь."
1012602-40 = "Вообще-то все твои вещи. И одежда, разумеется."
1012602-41 = "Теперь они принадлежат мне."
1012602-42 = "[s] «Эм...?!»"
1012602-43 = ""
1012602-47 = ""
1012602-48 = ""
1012602-49 = "Ха. Прости, я тебя напугала."
1012602-50 = "Я шутила. Одежду оставь себе. Мне нужна всего одна безделушка на твой выбор."
1012602-51 = "Это может быть монетка из кармана или клочок бумаги."
1012602-52 = "[s] «Она тебе правда нужна, да...?»"
1012602-53 = "Конечно."
1012602-54 = "Мой котёл уже готов."
1012602-55 = "Добавишь правильные ингредиенты, перемешаешь как следует — и получишь всё, чего пожелаешь."
1012602-56 = "Хи-хи, тебе ведь хотя бы любопытно."
1012602-57 = ""
1012602-60 = "[ns3] Кивнуть из любопытства.\n[ns4] Пока что подыграть ей."
1012602-63 = "...Хорошо. Мы понимаем друг друга."
1012602-64 = "Дай мне одну из своих вещей. Ты не поверишь, что я сейчас для тебя сварю."
1012602-65 = "[ns5] Передать ей носовой платок.\n[ns6] Передать ей ручку."
1012602-68 = "Ах, какой прекрасный катализатор ты мне дал."
1012602-69 = "Я просто положу его в карман..."
1012602-70 = "[s] «Разве ты не собиралась положить его в котёл?»"
1012602-71 = "...Ты ведь понимаешь, что это зелье нужно ПИТЬ."
1012602-72 = "Все его ингредиенты должны быть съедобными."
1012602-73 = "Всё остальное было бы расточительством."
1012602-74 = "[s] «(Вообще-то логично...)»"
1012602-75 = "Тогда начнём."
1012602-76 = "Сначала... добавим варёные помидоры."
1012602-77 = ""
1012602-79 = ""
1012602-80 = "[ns] «К-Когда ты успела сварить помидоры?»"
1012602-81 = "Хи-хи, я предусмотрительная женщина."
1012602-82 = "Дальше — обжаренная маринованная говядина со смесью приправ..."
1012602-83 = ""
1012602-85 = ""
1012602-88 = "[ns] «Эм... ты ведь ТОЧНО варишь зелье, да?»"
1012602-89 = "Без сомнений."
1012602-90 = "Зелье, пробуждающее любовь и воспоминания."
1012602-91 = "Теперь добавим остальное и доведём до кипения..."
1012602-93 = "Каноэ продолжала складывать в котёл самые разные ингредиенты."
1012602-94 = ""
1012602-97 = "[ns] «Пахнет вкусно...»"
1012602-98 = "Некоторое время спустя..."
1012602-100 = ""
1012602-101 = "Вот... Готово."
1012602-102 = "Зелье любви сквозь жизни."
1012602-103 = ""
1012602-105 = ""
1012602-106 = "Томатное рагу с говядиной, до краёв наполненное моей любовью."
1012602-107 = "[s] «Но это ведь не зелье...»"
1012602-108 = "О, ещё какое. Попробуй — и тебя захлестнёт понимание моих истинных, самых глубоких чувств."
1012602-109 = "Ну же, не стесняйся... Чтобы прийти в чувство, сначала нужно побаловать чувства."
1012602-110 = "[ns7] Пожать плечами и попробовать зелье.\n[ns8] Поддаться потрясающему аромату и быстро всё съесть."
1012602-111 = ""
1012602-112 = ""
1012602-117 = "[ns] «Этот вкус...!!!»"
1012602-118 = "Хи-хи, ну как? Навевает воспоминания?"
1012602-119 = "Заставляет тосковать по такой потрясающей женщине, как я, которая всегда была и всегда будет рядом с тобой?"
1012602-120 = "[s] «Очень вкусно!!»"
1012602-121 = ""
1012602-123 = ""
1012602-124 = "[ns] «Совсем как то, что я ел в детстве.»"
1012602-125 = "«В-В детстве?»#nЯ надеялась, ты вспомнишь чуть более далёкие времена..."
1012602-126 = ""
1012602-128 = ""
1012602-129 = "Понятно... Даже мои таланты иногда дают сбой."
1012602-130 = "Хи-хи, но это лишь начало."
1012602-131 = "Если мои зелья не помогут, поможет моё обаяние. Мой ум, моё красноречие."
1012602-132 = "Наши разговоры пробудят такие яркие, пылающие воспоминания... что ты будешь думать обо мне, где бы ни находился."
1012602-133 = "Хи-хи... Э-хе-хе..."
1012602-134 = "Э-хе-хе-хе...!"
1012602-136 = "...После этого мы с Каноэ приятно поболтали за второй порцией её рагу."
