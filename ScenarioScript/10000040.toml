[translation]
10000040-1 = "Эпизод 4;Чудачки из Клуба внутренней дисциплины"
10000040-4 = "Тц. Сколько бы мы их ни побеждали, они всё равно продолжают появляться!"
10000040-5 = "Вот бы Пина была здесь!"
10000040-6 = ""
10000040-7 = "Хватит! Вашему злу пришёл конец, Уличные Моурё!"
10000040-8 = ""
10000040-9 = "К-Кто вы такие?!"
10000040-10 = ""
10000040-11 = "Хотите знать? Осторожнее со своими желаниями!"
10000040-13 = ""
10000040-14 = "Та-дам!"
10000040-15 = ""
10000040-16 = "Ха! Вжух! Свист!"
10000040-17 = "Драматично!"
10000040-18 = "Эм... спортивно?"
10000040-19 = "И... красиво? Так ведь?"
10000040-20 = "Узрите! Три нежных цветка сражаются как единое целое!"
10000040-21 = "Хранительницы порядка на улицах — Клуб внутренней дисциплины...!"
10000040-22 = "ПРИБЫЛ!"
10000040-23 = "Ого..."
10000040-24 = "Эм, да... Вот и мы."
10000040-25 = "Хмф! Мы идеально вышли, правда?! Цубаки?!"
10000040-26 = "*зевает* Наверное."
10000040-27 = "Эм, Каэдэ? Все на нас смотрят..."
10000040-28 = ""
10000040-29 = "Как я и говорила. Чудачки."
10000040-30 = "..."
10000040-31 = "Вы уже закончили?! Ч-что здесь вообще происходит?!"
10000040-32 = "Мы — Клуб внутренней дисциплины, который день и ночь тренируется, чтобы стать достойными юными леди!"
10000040-33 = "Говори за себя, Каэдэ."
10000040-34 = "Меня вполне устраивает наверстать недосып."
10000040-35 = "*зевает* Вообще, никто не против, если я здесь немного отдохну?"
10000040-36 = "Цубаки, нельзя дремать как обычно, когда мы сражаемся с Моурё!#nПроснись!"
10000040-37 = "Серьёзно! Если ты сейчас уснёшь, тогда...!"
10000040-38 = "Хи-хи. Ну... по крайней мере, её упорству можно позавидовать."
10000040-39 = "Отлично сказано, Мимори. Упорство в тренировках, чтобы стать лучшими леди и одновременно защищать улицы, — вот суть нашего клуба!"
10000040-40 = "Это дело требует, чтобы Клуб внутренней дисциплины взял всё в свои руки!"
10000040-41 = "Вы сами напросились, Уличные Моурё!"
10000040-42 = "Верно. Приготовьтесь..."
10000040-43 = "Да! Я-я надеюсь, вы готовы!"
10000040-46 = "Аргх! О-они становятся всё сильнее!"
10000040-47 = "Хе-хе! Бесполезно! У вас нет шансов, пока Сенсей на нашей стороне!"
10000040-48 = "Что ты только что сказала?! Сенсей из Шале?!"
10000040-49 = "Изуна...! Где эта глупая ниндзя, когда она нужна?!"
10000040-50 = "Вот-вот..."
10000040-51 = ""
10000040-52 = "Ниндзюцу Изуны! Получите дымовую завесу!"
10000040-55 = "Откуда взялся этот взрыв?!"
10000040-56 = "Эй! Не пугай меня так!"
10000040-57 = "Я и Сенсея нигде не вижу."
10000040-58 = "Что?! Сенсей пропал?!"
10000040-59 = ""
10000040-60 = "Это наш шанс! Быстро, все — пока у них суматоха...!#nВ АТАКУ!"
10000040-61 = ""
10000040-62 = "Изуна вернулась, как и обещала!"
10000040-63 = "[s] «*кашель* *кашель* Изуна...?!»"
10000040-64 = "После нашей последней встречи Изуна кое-что поняла."
10000040-65 = "Ты поддержал мечту Изуны, Сенсей! Значит, ты ОБЯЗАТЕЛЬНО хороший человек, а не злой взрослый."
10000040-66 = "Но сейчас мы враги... так что Изуна победит тебя и убедит измениться."
10000040-67 = "Это путь, который выбрала Изуна! Путь настоящей ниндзя!"
10000040-68 = "[s] «Правда? Всё равно что-то здесь не сходится.»"
10000040-69 = "Хватит разговоров! Приготовься!"
10000040-70 = "Изуна победит знаменитого Сенсея из Шале!"
10000040-71 = "Хия-я-я-я!"
