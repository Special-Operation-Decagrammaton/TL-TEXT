[translation]
201060-1 = "Episódio 6; O Retorno da Prodígio"
201060-2 = "（Explicamos tudo o que havia acontecido até aqui para a aluna que afirmava ser a Presidente do Conselho）"
201060-5 = "Conselho Estudantil Federal - Sala de Reuniões"
201060-6 = "...... Compreendo."
201060-7 = "Tantas coisas aconteceram durante o período em que me ausentei...... não tenho como expressar o quanto sinto por tudo isso."
201060-8 = ""
201060-10 = ""
201060-11 = "Contudo, na explicação trazida pelo Sensei, há alguns pontos que entram em contradição direta com as minhas lembranças."
201060-12 = "Para começar, essa tal \"Arca de Shittim\" que o Sensei diz ter recebido das minhas mãos."
201060-13 = "Aos meus olhos, não passa de um tablet comum."
201060-14 = "Pra começo de conversa, vincular a autoridade de controle da Sanctum Tower a um tablet portátil é uma ideia absurdamente perigosa.#nAfinal, isso daria controle absoluto sobre toda a infraestrutura de Kivotos."
201060-15 = "Se essa \"Arca de Shittim\" caísse nas mãos de pessoas mal-intencionadas,#nacabaria desencadeando uma catástrofe irreversível."
201060-16 = "Não concorda comigo?"
201060-19 = ""
201060-23 = "[ns] \"Pensando por esse lado, faz sentido, mas......\""
201060-24 = "Da mesma forma, aquele outro artefato mencionado pela Rin, o \"Cajado de Amendoeira\",#ntambém só parece um smartwatch comum."
201060-25 = "Sem contar que tentar solucionar as crises de toda Kivotos dependendo de artefatos misteriosos cujo funcionamento sequer compreendemos......"
201060-26 = "É algo que realmente não consigo conceber. Mesmo que digam que foi um plano traçado por mim no passado."
201060-27 = "Agora que retornei, acredito que uma \"revisão\" nesses planos se faz urgente."
201060-28 = "[s] （Não vai me dizer que...... ela pretende fechar a Schale?!）"
201060-29 = ""
201060-33 = "Eu apenas cumpri rigorosamente as minhas atribuições de acordo com os documentos deixados pela \"Presidente do Conselho\"."
201060-34 = ""
201060-36 = ""
201060-37 = ""
201060-38 = ""
201060-39 = "A fundação da Schale. A nomeação do Sensei.#nNão vai me dizer que você também não tem nenhuma lembrança ou documento sobre isso, né?"
201060-40 = "......"
201060-41 = ""
201060-43 = ""
201060-44 = "Independentemente do conteúdo, esta assinatura é indiscutivelmente da minha própria caligrafia."
201060-45 = "E os resultados obtidos pela Schale já foram amplamente documentados e compartilhados comigo."
201060-46 = "Jamais tive a intenção de desqualificar a existência da Schale, que se dedicou incansavelmente à segurança e à autonomia das alunas sem jamais abusar de sua autoridade."
201060-47 = "Muito pelo contrário: em nome de todo o Conselho Estudantil Federal, gostaria de expressar a minha mais profunda gratidão."
201060-48 = "[s1] \"Que alívio......\"\n[s2] \"Por um segundo achei que ia pro olho da rua......\""
201060-51 = "Imagina! Eu jamais seria inflexível a ponto de descartar o benfeitor que salvou Kivotos só porque minhas memórias estão confusas."
201060-52 = ""
201060-54 = ""
201060-55 = "Porém......"
201060-56 = "Para alinharmos nossas visões de mundo, precisaremos conversar muito mais daqui para frente."
201060-57 = ""
201060-59 = ""
201060-61 = ""
201060-62 = "Se você é de fato a verdadeira Presidente do Conselho Estudantil Federal......"
201060-63 = "Por que desapareceu de repente sem deixar rastros?"
201060-64 = "Onde esteve e o que andou fazendo durante todo esse tempo?"
201060-65 = "Infelizmente, não sou capaz de responder a essa pergunta."
201060-66 = "Minha última memória nítida antes do meu suposto sumiço registrado nos arquivos#né exatamente sobre a última tarefa que desempenhei no gabinete."
201060-67 = "Naquele dia, despachei os documentos públicos como sempre fazia, assinei e bati o ponto para ir embora."
201060-68 = "De lá para cá...... parece que uma névoa espessa se instalou na minha mente, e não consigo recordar de nada."
201060-69 = "Cheguei a cogitar se não teria caído num sono profundo sem perceber.#nMas quando finalmente despertei, muito tempo já havia se passado......#ne o cenário de Kivotos havia mudado drasticamente."
201060-70 = "E então me deparei com você, sem se lembrar de quem eu era."
201060-71 = "Mesmo que venha com uma explicação dessas, não tem como eu simplesmente aceitar e engolir......"
201060-72 = "Compreendo perfeitamente. Seria estranho se aceitasse de pronto."
201060-73 = "...... Afinal, nem eu mesma consigo entender totalmente a minha situação."
201060-74 = "Contudo, essa incerteza faz parte do coração deste mundo."
201060-75 = "Comparada às inúmeras tragédias e crises que assolam Kivotos, uma mera perda de memória é um detalhe insignificante."
201060-76 = "E nós não podemos ficar paralisadas só porque há coisas que não conseguimos decifrar."
201060-77 = "Afinal de contas, tenho a obrigação solene de cumprir com o meu dever de Presidente do Conselho."
201060-78 = "............"
201060-79 = "Rin. Vamos conversar sempre que tivermos um tempinho livre."
201060-80 = "Vou cooperar com todas as minhas forças até que você encontre a Presidente do Conselho que seu coração possa aceitar."
201060-81 = "Mesmo que na sua mente eu continue sendo vista como uma impostora...... não fugirei das minhas responsabilidades."
201060-82 = ""
201060-84 = ""
201060-86 = ""
201060-87 = "Por que você...... usa exatamente as mesmas palavras que ela usava......"
201060-88 = "Bom, tenho trabalho a fazer, então vou me retirar."
201060-89 = "Sensei da Schale, se precisar de qualquer coisa, as portas do Conselho estarão sempre abertas."
201060-90 = ""
201060-92 = ""
201060-98 = "Conselho Estudantil Federal - Sala de Mediação, Sala de Videoconferência 2"
201060-101 = ""
201060-102 = "...... Quanto tempo. Peço desculpas pelo contato repentino, mas gostaria de fazer um pedido.#nSeria possível reconsiderarem a revogação do decreto aprovado no mês passado sobre a restrição de circulação do chá de Trinity?"
201060-103 = ""
201060-104 = ""
201060-106 = ""
201060-107 = "Uma ligação direta da Presidente do Conselho Estudantil Federal.#nImaginei do que se tratava. É sobre aquele decreto, não é?"
201060-108 = "Nossa resposta permanece a mesma repassada à Diretora de Mediação no mês passado.#nNão revogaremos o decreto."
201060-110 = "B-Bem...... é que......"
201060-111 = "Este decreto visa reestruturar a rede logística e garantir o fornecimento estável de artigos de luxo às nossas próprias alunas."
201060-112 = "Além de proteger o valor inestimável das folhas de chá que são o orgulho de Trinity.#nEsperamos a compreensão do Conselho Estudantil Federal sobre nossa soberania."
201060-113 = "E se a minha memória não estiver falhando......#no Conselho Estudantil Federal sempre manteve uma postura de neutralidade e não intervenção quanto aos decretos de cada distrito, não é mesmo?"
201060-114 = "Por acaso a diretriz do Conselho mudou agora?"
201060-115 = "Não, de maneira alguma.#nCada distrito possui plena autonomia para formular suas leis, e o Conselho respeita isso integralmente."
201060-116 = "É exatamente por isso que estou fazendo um apelo amigável.#nO chá produzido em Trinity domina grande parte do mercado de Kivotos.#nCom a interrupção abrupta da distribuição, os preços dispararam vertiginosamente."
201060-117 = "E instituições que sempre dependeram da importação desse chá, como a Academia Federal Red Winter,#nestão sofrendo enormemente sem conseguir desfrutar de um bom momento de chá."
201060-118 = "Não creio que tenhamos a obrigação de nos preocupar com as carências de outras escolas."
201060-119 = "Sem dúvida, tem toda razão.#n...... Aliás, aquele chá que você me presenteou recentemente estava simplesmente divino."
201060-120 = "Notei um toque cítrico suave e refrescante que não havia nas versões anteriores......#nPor acaso desenvolveram um novo blend?"
201060-121 = ""
201060-123 = ""
201060-124 = "...... Quanta perspicácia. Acrescentei uma pitada de óleo cítrico de bergamota, no melhor estilo Lady Grey."
201060-125 = "Fico feliz que tenha agradado ao seu paladar requintado, mas por que tocar nesse assunto de repente......?"
201060-126 = "Ora, é que eu estava pensando como um doce refinado tornaria a experiência de degustar esse chá ainda mais sublime."
201060-127 = "Por exemplo: uma torta de chocolate artesanal recheada com mirtilos silvestres colhidos frescos nas florestas de Red Winter?"
201060-128 = "......"
201060-129 = "Se as alunas de Red Winter, acostumadas a frutas de altíssima qualidade,#npuderem degustar o prestigiado chá de Trinity harmonizado com suas próprias iguarias......#na imagem pública de Trinity alcançaria um patamar sem precedentes."
201060-130 = "O que me diz?"
201060-131 = "Para um chá verdadeiramente nobre, a elegância exige acompanhamentos à sua altura."
201060-132 = "...... Muito bem.#nPrometo submeter a revogação do decreto de restrição a uma reavaliação favorável."
201060-133 = "Agradeço de coração pela sua sensibilidade e compreensão."
201060-134 = "Pelo contrário. Havia muito tempo que eu não conversava com alguém que realmente entende a alma do chá.#nFoi uma troca imensamente proveitosa."
201060-135 = "Da próxima vez que nos visitar, farei questão de recebê-la com um blend inédito recém-saído da prensa."
201060-136 = "Com certeza, aguardo com grande entusiasmo."
201060-139 = "Ultimamente, as confusões armadas por arruaceiras no D.U. têm se tornado mais violentas a cada dia."
201060-140 = "Segundo o relatório do Departamento de Defesa, cerca de 50% dos tumultos dos últimos meses foram provocados por alunas oriundas de Gehenna."
201060-141 = "A Subsecretária de Defesa enviou um pedido formal de colaboração investigativa, mas ainda não recebemos nenhuma resposta."
201060-142 = "A líder da Sociedade Pandemônio, Vossa Senhoria Makoto, teria alguma informação sobre o caso......?"
201060-143 = ""
201060-145 = ""
201060-147 = "Kikiki...... que pergunta mais estúpida!"
201060-148 = "A resposta, obviamente, é――"
201060-149 = "NÃO SEI DE NADA!"
201060-150 = "............"
201060-151 = "Então poderíamos acertar isso a partir de agora?#nA Sociedade Pandemônio poderia enviar reforços e suprimentos para apoiar na contenção dessas baderneiras?"
201060-152 = "E por que raios você tá vindo cobrar isso de mim?!"
201060-153 = "Caçar baderneiras é trabalho do Comitê de Disciplina!#nSeja dentro ou fora de Gehenna, isso não é serviço da Sociedade Pandemônio!"
201060-154 = "Ou seja: se a escória de Gehenna continua solta por aí, a culpa é todinha......#nda incompetente da Líder Hina do Comitê de Disciplina!"
201060-155 = "E-Espere um momento! Repassar questões de cooperação institucional ao Comitê de Disciplina em vez do conselho estudantil oficial――"
201060-157 = "...... Entendo perfeitamente."
201060-158 = ""
201060-160 = ""
201060-161 = ""
201060-163 = ""
201060-164 = "Tudo não passa de pura incompetência da Líder Hina, não é mesmo?"
201060-165 = "P-Presidente?!"
201060-166 = "É...... hã? Pois é, exatamente isso que eu tô falando!"
201060-167 = "Fazer com que uma líder tão grandiosa como Vossa Excelência Makoto, que dá a vida pela escola mesmo carregando o peso de uma subordinada tão inútil, tenha que se preocupar com isso...... é de uma lástima sem tamanho."
201060-168 = "Não precisa pedir desculpas! Eu, a grande Makoto, sou generosa com quem reconhece os erros e demonstra arrependimento!"
201060-169 = "Acima de tudo, vejo que a Presidente do Conselho é alguém sensata que sabe conversar, diferente de certas pessoas por aí!"
201060-170 = "Se tiver qualquer demanda nossa, pode falar que eu ouço!"
201060-171 = "Não seria necessário incomodá-la com isso, Makoto-sama, até porque cuidar dos problemas do Comitê de Disciplina já consome todo o seu precioso tempo."
201060-172 = "Hahaha! Gostei de ver! Você é das minhas!"
201060-173 = "Daqui para frente, se tiver qualquer encheção de saco, mande direto pro Comitê de Disciplina!#nToda a responsabilidade de Gehenna é daquele comitê!"
201060-174 = "Guardarei suas palavras com carinho."
201060-175 = "Com licença, então."
201060-176 = ""
201060-178 = ""
201060-179 = ""
201060-180 = ""
201060-181 = "Subsecretária de Defesa. Contate agora mesmo o Comitê de Disciplina de Gehenna e formalize o pedido de cooperação.#nNão esqueça de repassar os dados de todas as suspeitas fichadas pelo nosso setor."
201060-182 = "Além disso, se o Comitê de Disciplina solicitar reabastecimento logístico, envie apoio irrestrito.#nA despesa deve ser faturada na conta de Gehenna pela Câmara de Conciliação."
201060-183 = "S-Sim, senhora......!"
201060-184 = "...... Ah, e por favor: envie à Comandante Sorasaki Hina uma caixa de tônicos revigorantes e remédios para o estômago. Tenho certeza de que ela vai precisar."
201060-187 = ""
201060-188 = ""
201060-189 = "Que palhaçada é essa aqui?!"
201060-190 = "Como assim o pudim sazonal de chocolate da Morigori não vai ser vendido no distrito de Red Winter?!"
201060-191 = "Qual é, eu já te falei mil vezes que não tenho nada a ver com a estratégia de vendas de empresas privadas......"
201060-192 = "Aliás, por que você veio cobrar isso logo do Departamento de Trânsito? Que preguiça......"
201060-193 = "Como é que é?! Não é você quem cuida de tudo relacionado a guloseimas no Conselho?!"
201060-194 = "No outro dia, quando abriram aquela loja temporária exclusiva da Galbee,#nvocê tava lá plantada na fila em pleno dia útil de trabalho!#nEu tinha certeza de que essa era a sua função aqui......"
201060-195 = ""
201060-197 = ""
201060-198 = "E-Ei...... não tá me confundindo com outra pessoa, não?"
201060-199 = "Enfim! Eu não tenho como resolver isso, vai reclamar em outro setor!"
201060-200 = "Grrr...... você acha mesmo que me engana com essa desculpinha esfarrapada?!"
201060-201 = "Vender o pudim em todo lugar e deixar só Red Winter de fora!#nIsso é uma discriminação descarada e um insulto direto à minha autoridade suprema!"
201060-202 = "Até que isso seja consertado, o secretariado de Red Winter vai protestar severamente contra o Conselho por todos os meios possíveis!"
201060-203 = "（Ai, que dor de cabeça......）"
201060-204 = ""
201060-206 = ""
201060-208 = "Com licença, me permite uma palavrinha?"
201060-209 = "E quem é você......?"
201060-210 = "Saudações a Vossa Excelência Cherino, ilustre Presidente da Academia Federal Red Winter, Diretora do Departamento de Limpeza, Secretária-Geral, Chefe do Comitê de Disciplina, Diretora do Setor de Merenda e dona do título de maior gourmet de Red Winter. Eu sou a Presidente do Conselho Estudantil Federal."
201060-211 = "O seu bigode continua tão imponente e espetacular quanto sempre.#nFico até tentada a perguntar qual é o seu segredo."
201060-212 = ""
201060-214 = ""
201060-215 = "Aham! Vejo que a Presidente do Conselho tem olhos clínicos para reconhecer a magnitude deste bigode!"
201060-216 = "Mas não vou revelar o segredo. Até porque eu não faço nada demais nele, ele é naturalmente perfeito!"
201060-217 = "Ostentar um bigode tão majestoso sem sequer precisar de manutenção...... é de dar inveja a qualquer um.#nAgora compreendo perfeitamente por que as alunas de Red Winter tanto admiram o seu bigode, Presidente Cherino."
201060-218 = "Mas a respeito do pudim de chocolate da Morigori, ouvi comentários de que ele é excessivamente grudento e costuma manchar a boca inteira.#nSeria uma vergonha inaceitável se o seu glorioso bigode ficasse todo sujo de chocolate na frente das alunas, não concorda?"
201060-221 = "É...... bem...... pensando por esse lado faz sentido......"
201060-222 = "Mas eu não posso simplesmente abrir mão do pudim que esperei tanto tempo pra comer......!"
201060-223 = "Por mera coincidência, temos em mãos uma unidade do pudim de caramelo de edição limitada da confeitaria L'Oiseau Bleu."
201060-224 = "É uma lembrancinha modesta, mas ficaria honrada em presenteá-la com ele. Poderia nos conceder a graça de encerrar os protestos por hoje?"
201060-225 = ""
201060-227 = ""
201060-228 = "O pudim de caramelo exclusivo da L'Oiseau Bleu......?!"
201060-229 = "H-Humph! Já que a própria Presidente do Conselho insiste tanto,#nvou me contentar com essa iguaria por hoje."
201060-230 = "Mas que fique claro: não vai ter próxima vez, ouviu bem?!"
201060-231 = "Agradeço imensamente pela sua generosidade e bom senso, Cherino-sama."
201060-232 = ""
201060-237 = ""
201060-239 = "Momoka......"
201060-240 = ""
201060-242 = ""
201060-243 = "N-Não é nada disso! Eu nunca fui em loja temporária nenhuma de doce em horário de trabalho!"
201060-244 = "Por mais apetitoso que seja, abandonar o posto em horário de expediente é inaceitável.#nNós devemos servir de exemplo para todas as alunas de Kivotos."
201060-245 = ""
201060-247 = ""
201060-248 = "...... Mas prometo sondar com o representante da indústria de doces de Kivotos na reunião da semana que vem se consigo algumas amostras grátis para nós."
201060-249 = ""
201060-251 = ""
201060-252 = "É SÉRIO MESMO?!"
201060-256 = "Caramba...... foi só a Presidente voltar que todos os pepinos travados se resolveram num estalo de dedos......"
201060-257 = "Ela dobra até as líderes mais cabeçudas e arrogantes na palma da mão......#nQue carisma surreal."
201060-258 = "Foi maravilhoso demais a Presidente ter voltado."
201060-259 = "Pois é. Não tem ninguém no mundo capaz de substituir a nossa Presidente."
201060-262 = ""
201060-263 = "......"
201060-264 = "...... Eu não posso deixar as coisas continuarem assim."
