[translation]
201060-1 = "Эпизод 6;Возвращение сверхчеловека"
201060-2 = "...Я объяснил студенту, называющему себя президентом Генерального студенческого совета, всё, что произошло за время его отсутствия."
201060-5 = "Приёмная Генерального ученического совета"
201060-6 = "...Понятно."
201060-7 = "Столько всего произошло, пока меня не было... Мне нечем оправдаться."
201060-8 = ""
201060-10 = ""
201060-11 = "Но кое-что всё равно не сходится."
201060-12 = "Я ничего не помню об этом «Ковчеге Шиттим», о котором вы говорите. И вы утверждаете, что его вам дала я?"
201060-13 = "По-моему, это выглядит как обычный планшет."
201060-14 = "Но допустим, что это действительно сделала я. Идея хранить полный доступ к операционной системе Башни Санктум на планшете, который так легко украсть, до абсурда небезопасна."
201060-15 = "Достаточно одному человеку со злым умыслом завладеть Ковчегом Шиттим — и мы столкнёмся с необратимым кризисом."
201060-16 = "Вы ведь согласны, Сенсей?"
201060-19 = ""
201060-23 = "[ns] «Это правда...»"
201060-24 = "Точно так же Посох Шакеда — второй артефакт, о котором упоминала Рин, — кажется мне обычными наручными часами."
201060-25 = "И самое главное: я бы не стала полагаться на загадочные артефакты неизвестного происхождения и принципа действия при решении серьёзных вопросов, от которых зависит весь Кивотос."
201060-26 = "В этом якобы моём плане столько дыр, что я не могу его понять."
201060-27 = "Поэтому я считаю, что некоторые вещи необходимо скорректировать."
201060-28 = "[s] «(Вот к чему она ведёт? Хочет закрыть Шале?)»"
201060-29 = ""
201060-33 = "Всё, что я делала, основывалось на документе, который президент Генерального ученического совета оставила перед исчезновением."
201060-34 = ""
201060-36 = ""
201060-37 = ""
201060-38 = ""
201060-39 = "Если вы действительно она, то должны помнить этот документ: в нём были учреждены и Шале, и назначение Сенсея на эту должность."
201060-40 = "..."
201060-41 = ""
201060-43 = ""
201060-44 = "Не могу отрицать, что подпись на этом документе моя."
201060-45 = "И достижения Шале в Кивотосе за время моего отсутствия нельзя недооценивать. Я уже ознакомилась с отчётами."
201060-46 = "А главное — я увидела, что вы усердно защищали самостоятельность и безопасность студентов и ни разу не злоупотребили предоставленными вам полномочиями. Я не собираюсь отрицать или отвергать Шале."
201060-47 = "Больше всего я должна поблагодарить вас от лица Генерального ученического совета за всё, что вы сделали."
201060-48 = "[s1] «Какое облегчение...»\n[s2] «Я уже боялась, что вот-вот потеряю работу...»"
201060-51 = "Ну что вы. Я не настолько негибка, чтобы из-за собственных проблем с памятью просто вышвырнуть спасителя Кивотоса."
201060-52 = ""
201060-54 = ""
201060-55 = "Однако..."
201060-56 = "Несмотря на наши провалы в памяти, нам придётся больше разговаривать и вместе прийти к взаимопониманию."
201060-57 = ""
201060-59 = ""
201060-61 = ""
201060-62 = "Если вы и правда «настоящая» президент Генерального ученического совета..."
201060-63 = "Тогда почему вы бросили свой пост и исчезли без предупреждения?"
201060-64 = "Где вы были всё это время? Что вы делали?"
201060-65 = "К сожалению, не думаю, что смогу дать вам удовлетворительный ответ."
201060-66 = "Я отчётливо помню последний день, когда исполняла свои обязанности до того, как я... до того, как президент Генерального ученического совета исчезла из всех записей."
201060-67 = "Как и в любой другой день, я просмотрела документы на столе, подписала их и ушла из кабинета."
201060-68 = "Но всё после этого... словно густой туман окутывает мой разум."
201060-69 = "Иногда я задавалась вопросом, не впала ли я в кому, сама того не осознав. Но в конце концов я пришла в себя... и обнаружила совершенно другой Кивотос, не тот, который знала."
201060-70 = "А потом встретила вас — человека, который меня совсем не помнит."
201060-71 = "Ваше объяснение лишь ещё больше меня запутывает."
201060-72 = "Понимаю. Я знаю, что это не отвечает ни на один ваш вопрос."
201060-73 = "Но всё потому, что я и сама ничего не понимаю."
201060-74 = "Этот мир всегда был загадочной головоломкой..."
201060-75 = "Если вспомнить все невозможные проблемы и происшествия, которые случаются в Кивотосе, моя потеря памяти — лишь капля в океане."
201060-76 = "Поэтому я не могу просто дрейфовать по воде, независимо от того, имеет происходящее смысл или нет."
201060-77 = "У меня есть обязанности президента Генерального ученического совета."
201060-78 = "... ..."
201060-79 = "Рин, давай продолжать этот разговор при каждой возможности."
201060-80 = "А я постараюсь соответствовать президенту Генерального ученического совета, пока ты не сможешь принять меня."
201060-81 = "Даже если в итоге ты полностью меня отвергнешь, я не стану убегать от своих обязанностей."
201060-82 = ""
201060-84 = ""
201060-86 = ""
201060-87 = "Как вы можете... говорить те же слова, что и она...?"
201060-88 = "Что ж, прошу меня простить. Мне предстоит разобрать целую гору накопившейся работы."
201060-89 = "Ах да, это приглашение относится и к вам, Сенсей из Шале. Если захотите поговорить со мной, приходите в Генеральный ученический совет в любое время."
201060-90 = ""
201060-92 = ""
201060-98 = "Удалённая переговорная №2 Регуляторного комитета Генерального ученического совета"
201060-101 = ""
201060-102 = "Прошу прощения, что вынуждена обращаться к вам с такой просьбой при нашей первой встрече за столь долгое время..."
201060-103 = "Но не могли бы вы отозвать правила распределения чайных листьев Тринити, предложенные Чаепитием в прошлом месяце, госпожа Нагиса?"
201060-104 = ""
201060-106 = ""
201060-107 = "Я вся извелась от любопытства, гадая, что президент Генерального ученического совета пожелала обсудить со мной после столь долгого отсутствия..."
201060-108 = "Однако должна признать, я несколько разочарована. Наш ответ остаётся прежним. Как мы уже сообщили главе Регуляторного комитета, мы не можем этого сделать."
201060-110 = "*вздох* Видите ли—"
201060-111 = "На самом деле это ещё довольно мягкая реакция со стороны Тринити. Это абсолютный минимум, необходимый, чтобы наши студенты получали положенную им долю и чтобы упорядочить наши каналы распределения."
201060-112 = "Мы гордимся тем, сколько заботы вкладываем в выращивание и хранение чайных листьев, и эти правила не позволяют рынку недооценивать их ценность. Надеемся на ваше понимание."
201060-113 = "Кроме того, насколько мне известно, Генеральный ученический совет не имеет полномочий вмешиваться в постановления отдельных академических округов."
201060-114 = "Или политика изменилась, а нас об этом не уведомили?"
201060-115 = "Нет, вовсе нет. Разумеется, каждый округ имеет право предлагать постановления исходя из собственных потребностей, и Генеральный ученический совет уважает это право."
201060-116 = "Но постарайтесь взглянуть и с моей стороны. Чайные листья Тринити составляют значительную долю поставок Кивотоса, и после того, как вы перекрыли городу этот источник, из-за спроса цены взлетели до небес."
201060-117 = "Возьмите хотя бы академию Красная Зима, которой приходится импортировать весь чай. Именно они оказались в самом невыгодном положении."
201060-118 = "Я не знала, что Тринити отвечает за благополучие других академий."
201060-119 = "Кстати, раз уж мы заговорили об этом, я только что выпила чашку чёрного чая, который прислало нам Чаепитие."
201060-120 = "Свежесть и лёгкие сладкие нотки были весьма необычны. Это новая смесь?"
201060-121 = ""
201060-123 = ""
201060-124 = "...Как проницательно. Да, в эту смесь добавили немного цитрусового масла."
201060-125 = "Я рада, что вам понравилось, но к чему такая смена темы?"
201060-126 = "Ну, я просто поймала себя на мысли, что к такой мягкой чашке чая леди Грей очень хочется вкусного десерта."
201060-127 = "Например, шоколадного пирога, щедро украшенного брусникой из Красная Зима."
201060-128 = "..."
201060-129 = "Я просто представила, как отреагировали бы студенты Красная Зима и что они говорили бы о Тринити, если бы попробовали чай Тринити, который так хорошо сочетается с их ягодами."
201060-130 = "Что скажете, госпожа Нагиса?"
201060-131 = "...Полагаю, хороший чай следует подавать с достойным десертом."
201060-132 = "Я прекрасно понимаю, на что вы намекаете. Я пересмотрю действующие правила распределения."
201060-133 = "Большего я и не прошу. Благодарю."
201060-134 = "Да, конечно. Должна признать, приятно поговорить с другим знатоком чая. Давно мне не доводилось обсуждать с кем-то тонкости чайного листа."
201060-135 = "Когда в следующий раз посетите Чаепитие, я угощу вас нашей новейшей смесью."
201060-136 = "Буду считать дни."
201060-139 = "На фоне роста преступности по всему D.U. в последнее время..."
201060-140 = "Внутреннее расследование Оборонного управления показало, что за последние несколько месяцев студенты Геенны были ответственны за 50% этих происшествий."
201060-141 = "При этом сообщается, что заместитель главы Оборонного управления направила в Геенну официальное письмо с просьбой о содействии расследованию, но ответа до сих пор не получила..."
201060-142 = "Госпожа Макото, как председатель Общества Пандемониума, вы что-нибудь знаете об этом...?"
201060-143 = ""
201060-145 = ""
201060-147 = "Кихехех... Глупый вопрос, на который даже отвечать не стоит."
201060-148 = "Конечно..."
201060-149 = "НЕТ!"
201060-150 = "..."
201060-151 = "Тогда согласится ли Общество Пандемониума предоставить необходимые кадры и ресурсы для более эффективного контроля преступной деятельности, исходящей из Геенны?"
201060-152 = "Почему вы просите об этом НАС?!"
201060-153 = "Это обязанность Префектурной команды! В Геенне, за пределами Геенны — без разницы! Следить за студентами не дело Общества Пандемониума!"
201060-154 = "Другими словами, вся эта проблема возникла из-за... главы Префектурной команды Хины!"
201060-155 = "П-Погодите. Если всё так, как вы говорите, мы едва ли можем и дальше поручать Префектурной команде административные задачи, как вы просили раньше."
201060-157 = "...Понятно. Теперь я полностью понимаю ситуацию."
201060-158 = ""
201060-160 = ""
201060-161 = ""
201060-163 = ""
201060-164 = "Так это всё действительно произошло из-за некомпетентности главы Префектурной команды Хины!"
201060-165 = "П-Председатель?"
201060-166 = "А-А...? Д-Да, наконец-то вы поняли."
201060-167 = "Не могу поверить, что потревожила председателя Макото, которая, должно быть, и без того совершенно измотана управлением такой некомпетентной главой Префектурной команды. Даже представить не могу нагрузку такого лидера, как вы. Мне нет оправдания."
201060-168 = "Не стоит извиняться. Я, великая Макото, великодушна! Я не караю тех, кто способен осмыслить свои ошибки."
201060-169 = "Кроме того, я рада, что президент Генерального ученического совета оказалась человеком, с которым можно договориться, в отличие от кое-кого."
201060-170 = "Обществу Пандемониума от вас что-нибудь нужно?"
201060-171 = "Нет, это всё. В конце концов, председатель Макото, разбираться с главой Префектурной команды наверняка занимает обе ваши руки."
201060-172 = "Мне нравится ход твоих мыслей!"
201060-173 = "Именно! Все эти надоедливые проблемы отправляйте Префектурной команде — они же отвечают за всё такое в Геенне!"
201060-174 = "Я это запомню."
201060-175 = "Благодарю. Хорошего вам дня."
201060-176 = ""
201060-178 = ""
201060-179 = ""
201060-180 = ""
201060-181 = "Заместитель главы Оборонного управления. Свяжитесь с Префектурной командой Геенны и запросите их содействие. Передайте им все данные и сведения о подозреваемых, предоставленные Оборонным управлением."
201060-182 = "Я одобряю любые ресурсы, которые может запросить Префектурная команда. Счёт направьте группе Регуляторного комитета, отвечающей за Геенну."
201060-183 = "Д-Да...!"
201060-184 = "И коробку кофеиновых таблеток и лекарство для желудка президенту Сорасаки. Она это оценит."
201060-187 = ""
201060-188 = ""
201060-189 = "Что ты только что мне сказала?!"
201060-190 = "Что значит, сезонный шоколадный пудинг Morikoori НЕ выйдет в Красная Зима?!"
201060-191 = "Я всего лишь сказала, что Генеральный ученический совет — НЕ то место, куда нужно обращаться по поводу выпуска конкретного продукта какой-то компании..."
201060-192 = "И уж тем более вы ошиблись, позвонив в Транспортное управление... Какая морока."
201060-193 = "А? Разве ты не отвечаешь в Генеральном ученическом совете за вопросы, связанные с десертами?"
201060-194 = "Я тебя однажды видела! Ты стояла в очереди у временного магазина Garubi, так что я сделала естественный вывод..."
201060-195 = ""
201060-197 = ""
201060-198 = "Э-Это... Эм. Это вообще была не я?"
201060-199 = "Суть в том, что я ничего не могу сделать с пудингом! Так что иди спрашивай кого-нибудь другого."
201060-200 = "Угх! Ты думаешь, единственная и неповторимая Черина поведётся на такую уловку?"
201060-201 = "Это откровенная дискриминация! Вы пытаетесь подорвать мой авторитет, выпуская пудинг в других академиях, но не у нас!"
201060-202 = "Управление Красная Зима задействует все возможные средства протеста против Генерального ученического совета, пока вы это не решите!"
201060-203 = "(Как же это бесит.)"
201060-204 = ""
201060-206 = ""
201060-208 = "Позволите вмешаться?"
201060-209 = "А ты...?"
201060-210 = "Давненько не виделись, председатель ученического совета академии Красная Зима, глава отдела благоустройства, Великий лидер, глава физического воспитания И отдела питания, а также главный гурман академии Красная Зима, Черина. Это президент Генерального ученического совета."
201060-211 = "Как всегда, ваши усы великолепно сияют. Если мой вопрос не покажется грубым, не могу не поинтересоваться, как вы за ними ухаживаете."
201060-212 = ""
201060-214 = ""
201060-215 = "Кхм, вы наверняка чувствуете вес власти, исходящий от моих идеально ухоженных усов. Очень наблюдательно, президент Генерального ученического совета!"
201060-216 = "Однако, к сожалению, мне нечего ответить на ваш вопрос! Всё натуральное!"
201060-217 = "Как я вам завидую! Теперь понимаю, почему столько студентов Красная Зима воспевают ваши усы, президент Черина."
201060-218 = "Кстати, я слышала, что новый лимитированный шоколадный пудинг Morikoori очень липкий. На него даже массово жалуются: после еды всё вокруг рта остаётся в нём."
201060-219 = "Разве бесчисленные студенты не будут убиты горем, если ваши драгоценные усы безнадёжно испачкаются... из-за пудинга?"
201060-221 = "Э-Это правда..."
201060-222 = "Нет! Я не откажусь! Я ждала этот лимитированный пудинг несколько месяцев!"
201060-223 = "Уверена, это вряд ли полностью утешит ваше тяжёлое разочарование, но у меня как раз есть немного лимитированного карамельного пудинга, который L’Oiseau Bleu выпустили совсем недавно."
201060-224 = "Не побудит ли этот подарок вас проявить великодушие и на этот раз простить злую корпорацию? Только один раз?"
201060-225 = ""
201060-227 = ""
201060-228 = "Карамельный пудинг L’Oiseau Bleu...!"
201060-229 = "К-Кхм... По вашей просьбе я спущу это с рук, президент Генерального ученического совета!"
201060-230 = "Но только в этот раз!"
201060-231 = "Благодарю за понимание, госпожа Черина."
201060-232 = ""
201060-237 = ""
201060-239 = "Момока..."
201060-240 = ""
201060-242 = ""
201060-243 = "Я-Я вообще понятия не имею, о чём она говорит! Ни в каком временном магазине десертов я никогда не была!"
201060-244 = "Даже ради десерта, который обожаешь и который выпадает раз в жизни, нельзя покидать офис в рабочее время. Как члены Генерального студенческого совета, мы должны подавать пример другим студентам."
201060-245 = ""
201060-247 = ""
201060-248 = "(шёпотом) ...На следующей неделе я встречаюсь с владельцами нескольких кондитерских компаний. Постараюсь достать тебе образцы."
201060-249 = ""
201060-251 = ""
201060-252 = "Правда?!"
201060-256 = "Ого... Президент Генерального ученического совета только вернулась, а уже одну за другой решает кучу давних проблем."
201060-257 = "Она управляется с этими самовлюблёнными главами академий, будто это послушные ягнята. Что бы я отдала за такую харизму!"
201060-258 = "Её слишком долго не было, но я рада, что она вернулась."
201060-259 = "Согласна. Серьёзно, президента никто никогда не заменит."
201060-262 = ""
201060-263 = "..."
201060-264 = "...Так не пойдёт."
