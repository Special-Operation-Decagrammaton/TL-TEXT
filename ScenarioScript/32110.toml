[translation]
32110-1 = "Эпизод 11;Второй экзамен, часть 2"
32110-2 = "Район Геенны"
32110-5 = "Наконец-то добрались."
32110-6 = "А где все? Понимаю, глубокая ночь, но город словно вымер."
32110-7 = ""
32110-10 = "Стрельба. Рядом идёт бой."
32110-11 = "Как бы ни было любопытно, нам нужно сосредоточиться. Пора добраться до места экзамена."
32110-15 = "Впереди контрольно-пропускной пункт."
32110-16 = "Стоять! Дальше проход запрещён!"
32110-17 = "Во всём районе действует комендантский час. Возвращайтесь в общежития."
32110-18 = "Погодите. Разве это не форма Тринити?"
32110-19 = "Что студенты Тринити делают в районе Геенны?! Вы замышляете нападение?! Отвечайте!"
32110-20 = "Н-Нет, конечно! Мы просто проходим мимо..."
32110-21 = "Студенты Тринити не могут «просто проходить мимо» Геенны!"
32110-22 = "Если вам так нужно знать, мы пришли сдавать экзамен. Нам не нужны неприятности."
32110-23 = "С каких это пор экзамены Тринити проводят в районе Геенны?! Думаете, мы в это поверим?!"
32110-24 = "П-Понимаю, звучит неправдоподобно, но это правда."
32110-25 = "Постой. Эта девушка в форме Отряда правосудия..."
32110-26 = ""
32110-28 = ""
32110-30 = ""
32110-31 = "На нас напали! Отряд правосудия начал вторжение!"
32110-33 = "Штаб, ответьте! Противник перешёл к действиям!"
32110-35 = "Что?! Всё совсем не так!"
32110-36 = "Бесполезно. Просто уничтожим их."
32110-37 = "Но разве тогда мы не будем выглядеть виновными?!"
32110-38 = ""
32110-40 = ""
32110-43 = "А-а-а-а-а!"
32110-44 = "Нам конец..."
32110-45 = ""
32110-48 = "Азуса, ЗАЧЕМ?!"
32110-49 = "Это не я."
32110-50 = "Гранату бросили из-за наших спин. Кто это мог быть?"
32110-54 = "Простите, что задержались, Сенсей. ★"
32110-55 = "Зоркий глаз, Акари. Что вы здесь делаете?"
32110-56 = "[s] «Общество гурманов!»"
32110-58 = "Р-Разве это не те, с кем мы дрались пару ночей назад?!"
32110-59 = "Верно. Это они напали на аквариум."
32110-60 = "Я уже ничего не понимаю..."
32110-62 = "Так вот что вы задумали. Вам просто нужно добраться до места экзамена, верно?"
32110-63 = "[s] «Это срочно.»"
32110-64 = "Вижу. Но момент вы выбрали крайне неудачный. Если вы не слышали, сейчас в районе творится кое-что любопытное."
32110-65 = "Департамент горячих источников устроил взрыв прямо посреди города. Там полный бардак."
32110-66 = "Префектурная команда по уши в устранении последствий, и у нас появилась отличная возможность улизнуть из камеры."
32110-67 = "И представьте себе: президент Клуба школьных обедов любезно разрешила нам одолжить фургон с едой. Какая же она добрая, правда?"
32110-68 = "М-м-м! М-м-м-м!"
32110-69 = "В нём ещё даже пахнет новым фургоном. Как мило с её стороны его одолжить. Настоящая подруга."
32110-70 = "М-м-м-м-м!"
32110-72 = "Кажется... в кузове кто-то связан."
32110-74 = "А, это? Просто Фуука так развлекается. Она у нас та ещё проказница."
32110-75 = "Никто не умеет изображать заложницу лучше неё! ★"
32110-76 = "Где вас чёрт носит?! Мы сумели сбежать. Давайте уже встретимся!"
32110-77 = "А-а-а! Префектурная команда всё ещё за нами гонится!"
32110-78 = "Прости, Джунко, но планы изменились."
32110-79 = "Что?! Почему?!"
32110-80 = "Мы сопроводим Сенсея и студентов Тринити. Должок надо вернуть."
32110-81 = "Остальное обсудим позже. А сейчас — поехали!"
32110-82 = "[s] «Хорошо. Ты за рулём.»"
32110-84 = "Э-Эм... Ну, спасибо, наверное?"
32110-85 = "Мы поедем на этом фургоне с едой?"
32110-86 = ""
32110-88 = ""
32110-89 = "Пристегнитесь все. Отправляемся! ★"
32110-91 = "Два часа спустя."
32110-95 = "А-а-а-а-а!"
32110-96 = ""
32110-99 = "Как до этого дошло?!"
32110-100 = "Не трясись так, Хифуми! Я не могу прицелиться!"
32110-101 = "Это не я! Под нами земля дрожит!"
32110-102 = ""
32110-105 = "А-а-а-а! Снова что-то взорвалось!"
32110-108 = "А эта девчонка из Тринити неплохо водит мотоцикл!"
32110-109 = "Давай! Постарайся не отстать!"
32110-110 = "Стараюсь! Стараюсь!"
32110-111 = "Акари, через восемь секунд будет новый взрыв."
32110-112 = "Ладушки. Без проблем. ★"
32110-113 = ""
32110-117 = "Хару-на-а-а! Да отпусти ты меня уже!"
32110-118 = "Слышишь? Даже Фуука нас подбадривает. Может, ещё немного оживим поездку?"
32110-119 = "Мне нравится ход твоих мыслей!"
32110-120 = ""
32110-125 = "Э-Это что, за нами экскаватор гонится?! И бульдозер?!"
32110-126 = "Почему за нами гонится Департамент горячих источников Геенны?!"
32110-127 = "Префектурная команда тоже уже близко!"
32110-128 = "Говорит отряд «Браво». Отряд «Альфа», ответьте."
32110-129 = "А-Азуса?!"
32110-130 = "Пользуйтесь позывными. В общем, операция провалилась. Нас окружили."
32110-131 = "Что?! Что ты только что сказала?"
32110-132 = "Департамент горячих источников перекрыл дорогу огнемётом, а сзади путь преградила та девчонка из Префектурной команды с двумя хвостиками."
32110-133 = "Мы с Ханако попробуем выбраться сами. Встретимся в условленном месте. Удачи."
32110-134 = "*щелчок*"
32110-135 = "Н-Не бросай трубку! Азуса!!!"
32110-136 = "Мы всего лишь хотим сдать экзамен! И всё!"
32110-137 = "ПОЧЕМУ ЭТО ПРОИСХОДИТ?!"
32110-138 = ""
32110-145 = ""
32110-146 = ""
32110-147 = ""
32110-148 = ""
32110-149 = ""
32110-150 = "Пусть это уже закончится..."
32110-151 = "Э-Это то самое место? Мы туда пришли?"
32110-152 = "[s] «Как хорошо, что с вами обеими всё в порядке.»"
32110-153 = "Сенсей! Вот вы где!"
32110-154 = "Я тоже рада, что вы в порядке. Простите, что мы разминулись."
32110-155 = "Я уже боялась худшего, когда фургон с едой упал в реку."
32110-156 = "[s] «Харуна показала большой палец, пока мы тонули. Надеюсь, с ней всё хорошо.»"
32110-157 = "А где Азуса и Ханако?!"
32110-158 = "Не волнуйся. Мы тоже здесь."
32110-159 = ""
32110-161 = ""
32110-162 = "*вдох* *выдох* Сейчас 2:45 ночи. Мы успели с запасом."
