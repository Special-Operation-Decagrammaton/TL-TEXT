32110-195 = "[s] «Это ещё не конец, Нагиса!»"
32110-196 = "Ну-ну. Сколько же в ваших голосах негодования... Шучу. Это запись, так что можете не кричать — до меня не докричитесь."
32110-197 = "[s] «...»"
32110-198 = "Завершите экзамен до указанного срока, после чего сможете вернуться."
32110-199 = "И не забывайте: всё это время я буду за вами наблюдать. Удачи, Клуб дополнительных занятий."
