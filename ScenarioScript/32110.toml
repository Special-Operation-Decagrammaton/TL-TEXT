32110-181 = "Это боеголовка буксируемого орудия L118, обычно её используют для демонстрации и пропаганды. Детонатор снят."
32110-182 = "L118 принадлежит Чайной партии. Значит, послание прислала Нагиса."
32110-183 = "Да. Внутри должно что-то быть."
