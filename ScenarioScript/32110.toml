32110-169 = "Да. Первый этаж заброшенного здания в зоне 15-77 района Геенны."
32110-170 = "Как мы должны сдавать экзамен в таком месте? И кто будет его принимать?"
32110-171 = "Не чувствую здесь никого. Наверное, они что-то для нас оставили."
32110-172 = ""
