[translation]
32110-1 = "Episódio 11;2º Exame Especial de Aptidão Acadêmica (2)"
32110-2 = "Distrito Autônomo de Gehenna"
32110-5 = "Hum, demos um jeito de entrar, mas..."
32110-6 = "Por mais que seja no meio da madrugada, não está deserto demais?"
32110-10 = "...São tiros. Está tendo um combate em algum lugar."
32110-11 = "Hmm, para chegarmos ao nosso destino não temos escolha a não ser seguir em frente... Vamos indo por enquanto?"
32110-15 = "Aquilo é... um bloqueio?"
32110-16 = "Parem! A entrada é proibida daqui em diante!"
32110-17 = "Para começo de conversa, hoje foi decretado toque de recolher na cidade inteira! Voltem logo—"
32110-18 = "...Esse uniforme é da Trinity?"
32110-19 = "O que fazem aqui...?! O que vieram fazer em Gehenna?! Qual é o objetivo de vocês?!"
32110-20 = "N-Não, hum, nós realmente só queremos passar por aqui...!"
32110-21 = "Até parece que alguém da Trinity viria a Gehenna sem nenhum objetivo!"
32110-22 = "Mas nós realmente só viemos fazer uma prova. Não viemos causar problemas nem nada do tipo..."
32110-23 = "E por que raios alunas da Trinity viriam ao distrito autônomo de Gehenna para fazer uma prova?! Inventem pelo menos uma mentira mais decente!"
32110-24 = "B-Bom argumento... Auuu..."
32110-25 = "...! Ei, você aí, não é do Comitê de Justiça?!"
32110-31 = "Quê?! É-É verdade! Ataque inimigo! O Comitê de Justiça veio nos atacar!"
32110-33 = "Reportem ao alto escalão! O Comitê de Justiça finalmente chegou!!"
32110-35 = "Hãã?! Não, quer dizer, s-sou sim, mas agora não é isso, uuh...!"
32110-36 = "Não tem jeito, vamos derrubá-las."
32110-37 = "Quêê?! Isso não vai só piorar o mal-entendido?!"
32110-43 = "Uaaah?!"
32110-44 = "E-Essas garotas, eu sabia..."
32110-48 = "Azusa-chaaaan?!"
32110-49 = "...Não, eu ainda não fiz nada. Foi outra pessoa."
32110-50 = "É verdade, esse disparo veio de muito atrás de nós. Mas quem será que..."
32110-54 = "Ora☆ Eu sabia que era você, Sensei!"
32110-55 = "Acertamos em cheio. Olá, como vai? O que está fazendo por aqui, Sensei?"
32110-56 = "[s] \"Pessoal da Sociedade de Pesquisa Gourmet!\""
32110-58 = "U-Ué?! Não são aquelas com quem lutamos outro dia...?!"
32110-59 = "Ora, aquelas que atacaram o aquário..."
32110-60 = "H-Hum...? E-Eu já não estou entendendo mais nada..."
32110-62 = "...Entendo, compreendi a situação no geral. Em resumo, vocês precisam chegar a esse local, não é?"
32110-63 = "[s] \"Sim.\""
32110-64 = "Entendi as circunstâncias, mas escolheram uma péssima hora... Esta região está no meio de um belo alvoroço agora."
32110-65 = "Parece que o Clube de Desenvolvimento de Fontes Termais explodiu tudo com um 'kabum☆' bem no meio do centro comercial, então está uma bagunça completa."
32110-66 = "Por conta disso, o Comitê Disciplinar também está se mobilizando às pressas... Bem, graças a essa oportunidade, nós também conseguimos escapar da cela do Comitê Disciplinar desse jeito. Fufu♪"
32110-67 = "Pois é. E, como estamos em estado de emergência, a Fuuka-san, do Clube de Merenda Escolar, que por coincidência estava lá de novo, gentilmente nos emprestou o carro do clube☆"
32110-68 = "Hmm?! Hmph! Hmmmmmm!!"
32110-69 = "Emprestar um carro novinho recém-comprado para nós... Isso sim é o que chamam de uma bela amizade☆"
32110-70 = "Hmm! Hmph, hmmmmmm!!"
32110-72 = "...Essa sua amiga não está amarrada dentro do porta-malas?"
32110-74 = "Não há problema algum, a Fuuka-san já está acostumada com esse tipo de coisa."
32110-75 = "Não seria exagero dizer que ela já é praticamente uma especialista☆"
32110-76 = "Haruna, Akari! Onde vocês estão?! Nós também furamos o cerco aqui, será que dá pra gente se juntar?!"
32110-77 = "Kyaaa! O Comitê Disciplinar ainda está atrás da gente!!"
32110-78 = "Junko-san, a operação de fuga está cancelada."
32110-79 = "Quê?! Por quê?!"
32110-80 = "Fufu, considere isso um agradecimento por aquela vez. Nós assumiremos a responsabilidade de guiar o Sensei e o pessoal da Trinity."
32110-81 = "Isso mesmo☆ Então, vamos, entrem logo!"
32110-82 = "[s] \"Obrigado, conto com vocês.\""
32110-84 = "H-Hum... então contamos com vocês...?"
32110-85 = "...É verdade, está escrito \"Merenda Escolar\". Bom, com licença então... mas você aí do Clube de Merenda Escolar tem certeza de que está tudo bem ficar desse jeito?"
32110-89 = "Segurem-se firme, por favor☆ Vamos partir!"
32110-91 = "(E cerca de duas horas depois...)"
32110-95 = "Uwaaaaaah?!"
32110-99 = "O que é isso, mas o que é isso?! Como foi que as coisas ficaram assim?!"
32110-100 = "Hifumi, não balança! Assim eu não consigo mirar!"
32110-101 = "N-Não sou eu que estou balançando! É-É o chão que não para de tremer desde agora há pouco...!"
32110-105 = "Explodiu de novooo?!"
32110-108 = "Ei, você aí da Trinity, pilota muito bem essa moto!"
32110-109 = "Mandou bem, mandou bem, continua assim!"
32110-110 = "Não, eu já estou no meu limiteee?!"
32110-111 = "Akari-san, outro bombardeio virá em 8 segundos."
32110-112 = "Sim, sem problemas☆"
32110-117 = "Harunaaa! Esquece o carro, só me deixa descer—?!"
32110-118 = "Como a Fuuka-san está torcendo tanto por nós, que tal fazermos as coisas de um jeito um pouco mais extravagante?"
32110-119 = "Concordo, vamos transformar essa torcida em força☆ E em velocidade♪"
32110-125 = "Tem até escavadeira e trator vindo atrás da gente?! Por quê?!"
32110-126 = "P-Por que até o Clube de Desenvolvimento de Fontes Termais de Gehenna está nos perseguindooo?!"
32110-127 = "Droga, o Comitê Disciplinar também chegou!"
32110-128 = "Aqui é a Equipe Bravo. Equipe Alfa, responda."
32110-129 = "A-Azusa-chan?!"
32110-130 = "Se você falar o meu nome, usar codinomes perde todo o sentido... Deixando isso de lado, desculpe. A operação de distração falhou, estamos cercadas."
32110-131 = "Como é que ééé?!"
32110-132 = "À frente está o Clube de Desenvolvimento de Fontes Termais com lança-chamas; atrás, uma integrante de maria-chiquinha absurdamente forte do Comitê Disciplinar. Nossa rota de fuga foi bloqueada."
32110-133 = "A Hanako e eu vamos dar um jeito de escapar por conta própria, então nos encontramos depois. Boa sorte."
32110-134 = "(Bip)"
32110-135 = "Azusa-chaaaan?!"
32110-136 = "N-Nós só viemos até aqui para fazer uma prova..."
32110-137 = "Por que tudo isso está acontecendo?! Buááááá!"
32110-150 = "A-Auuu..."
32110-151 = "O-O local da prova é aqui...?"
32110-152 = "[s] \"Que bom que vocês duas estão bem.\""
32110-153 = "Ah, Sensei!!"
32110-154 = "S-Sensei, que bom que está a salvo... No meio daquele desespero todo, acabamos nos separando sem perceber..."
32110-155 = "Que alívio... Quando o carro do Clube de Merenda Escolar mergulhou no rio, achei que fosse o fim, mas..."
32110-156 = "[s] \"A Haruna afundou fazendo sinal de positivo com o polegar, será que ela está bem...?\""
32110-157 = "E-E a Azusa e a Hanako?!"
32110-158 = "Desculpem a demora♡"
32110-162 = "2h45... Demos um jeito de chegar antes do horário de início. Confesso que cansei."
32110-164 = "Hum..."
32110-165 = "O-O que foi que aconteceu com vocês...?"
32110-166 = "[s] (Decidi não perguntar a fundo por enquanto.)"
32110-168 = "O local da prova é... aqui?"
32110-169 = "Distrito Autônomo de Gehenna, Área 15, Rua 77, 1º andar das ruínas... Sim, está certo. É este prédio mesmo."
32110-170 = "P-Por que fazer uma prova num lugar desses...? Ah, e como ficam as folhas de prova? Será que veio alguém aplicar...?"
32110-171 = "Não, parece não haver ninguém. Mas devem ter preparado algum meio."
32110-179 = "...É isto."
32110-180 = "Isso é... uma bomba não detonada?"
32110-181 = "É o projétil de um obuseiro rebocado L118. Deve ser do tipo usado para espalhar panfletos, então removeram a espoleta e a carga explosiva para não detonar."
32110-182 = "Entendo. Se é um L118, então vem da Tea Party... ou seja, da Nagisa-san."
32110-183 = "Deve haver algo aqui dentro."
32110-184 = "Vamos abrir."
32110-188 = "(Clack)"
32110-189 = "Ah, tem papéis dentro... Então estas são as folhas de prova!"
32110-190 = "Não parecem estar danificadas. E isto aqui é... um comunicador."
32110-191 = "...Se estão vendo isto, significa que chegaram em segurança."
32110-192 = "N-Nagisa-sama?!"
32110-193 = "..."
32110-194 = "Hã? Então essa pessoa é da Tea Party...?"
32110-195 = "[s] \"Nagisa...!\""
32110-196 = "Fufu... Quase posso ouvir as vozes cheias de rancor. Bem, como isto é uma gravação, não consigo ouvi-las em tempo real. Portanto, não adianta nada tentarem falar comigo agora."
32110-197 = "[s] \"...\""
32110-198 = "Pois bem, terminem a prova e retornem até o horário combinado, por favor."
32110-199 = "Continuarei monitorando vocês por precaução, então não se esqueçam disso... No mais, desejo-lhes boa sorte, pessoal do \"Clube de Aulas de Reforço\"."
32110-200 = "Por favor, tomem muito cuidado."
32110-202 = "(Bip)"
32110-203 = "Auuu..."
32110-204 = "Esse final soou meio carregado de segundas intenções, não acharam...?"
32110-205 = "De qualquer forma, não temos tempo. Vamos começar logo."
32110-206 = "S-Sim! Vamos entrar, pessoal! Finalmente chegou a hora do 2º Exame Especial de Aptidão Acadêmica!"
32110-207 = "Vamos sim."
32110-208 = "S-Sim!"
32110-209 = "[s] \"Certo, vamos dar o nosso melhor!\""
32110-215 = "E aí, é aqui o tal lugar?"
32110-216 = "É, pelo endereço parece que sim. Deve ser tudo daqui até lá do outro lado."
32110-217 = "Hehe. Não sei bem de onde veio essa informação, mas que gentileza nos contarem onde parece ter uma fonte termal. Muito bem-vindo."
32110-218 = "Beleza, preparar para detonação!"
32110-220 = "Hora do desenvolvimentoooo!!"
32110-226 = "2º Exame Especial de Aptidão Acadêmica, resultado —"
32110-228 = "Hanako — [FF6666]Folha de prova extraviada (Reprovada)[-]"
32110-230 = "Azusa — [FF6666]Folha de prova extraviada (Reprovada)[-]"
32110-232 = "Koharu — [FF6666]Folha de prova extraviada (Reprovada)[-]"
32110-234 = "Hifumi — [FF6666]Folha de prova extraviada (Reprovada)[-]"
32110-236 = "As folhas de prova, as folhas de provaaa...?!"
32110-237 = "Foram pelos ares sem deixar vestígios..."
32110-238 = "S-Sensei, você está bem...?"
32110-239 = "[ns] \"Estou bem por aqui...\""
32110-240 = "Entendo, entendo, então ela está disposta a ir tão longe assim... As coisas estão ficando bem interessantes, não é mesmo? Fufufu...♡"
32110-242 = "Clube de Aulas de Reforço, 2º Exame Especial de Aptidão Acadêmica — Todas reprovadas!"
32110-246 = "Próximo;De Volta à Estaca Zero"
