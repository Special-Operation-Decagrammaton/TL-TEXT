[translation]
10025070-1 = "Эпизод 7;Полуночное барбекю"
10025070-3 = ""
10025070-4 = ""
10025070-5 = "...Ну что."
10025070-6 = "Этот подозрительный тип хочет, чтобы ты научила его рыбачить?"
10025070-7 = "Подозрительный?! Я не подозрительный!"
10025070-8 = "Ты рыбак, который не умеет рыбачить."
10025070-9 = "Да, насчёт этого..."
10025070-11 = "Я видела, как ты ходишь с этим снаряжением, но никогда им не пользуешься..."
10025070-13 = "Ну да, может, и так, но..."
10025070-15 = "И вчера ночью мы слышали, как ты читал на пляже какое-то странное заклинание..."
10025070-17 = "..."
10025070-18 = "Ладно. Похоже, скрывать дальше бессмысленно."
10025070-19 = "На самом деле я не профессиональный рыбак. Я инфлюенсер."
10025070-20 = "Может, слышали о моём стриминговом канале «Рыбалка с Белым Медведем»?"
10025070-22 = ""
10025070-24 = ""
10025070-25 = "Кажется, нет..."
10025070-26 = ""
10025070-28 = ""
10025070-29 = ""
10025070-30 = ""
10025070-31 = "Я только что посмотрела. У него около тысячи подписчиков."
10025070-32 = "Тысяча подписчиков — это много?"
10025070-33 = "У официального канала академии SRT было примерно столько же прямо перед закрытием..."
10025070-35 = "Может, сейчас канал и маленький, но алгоритм меня подхватил. Вот увидите, скоро я взлечу...!"
10025070-36 = "Как ты вообще ведёшь канал о рыбалке, если сам не умеешь рыбачить?"
10025070-37 = "О, можно делать кучу контента, который вообще не требует настоящей... рыбалки..."
10025070-38 = "Например, я снимаю распаковки рыболовных снастей, обзоры игр про рыбалку и тревелоги по аквариумам..."
10025070-39 = "Не очень похоже на канал о рыбалке..."
10025070-40 = "Да, ну, всё больше зрителей говорят мне то же самое на стримах..."
10025070-41 = "Я спорил с ними насчёт своих навыков рыбалки и, ну... возможно, пообещал поехать к морю и поймать что-нибудь большое..."
10025070-42 = "Но забудьте про большую рыбу... Я даже малька поймать не смог. Искал в интернете, как быстро поймать крупную рыбу, и в итоге оказался здесь."
10025070-43 = "И каким образом поиск привёл тебя в деревню Ятоура...?"
10025070-44 = "Ну... Я прочитал в интернете, что здесь под водой живут существа, способные управлять рыбой..."
10025070-45 = "Звучало сомнительно, но я был в отчаянии. Решил, что если принесу им дар, они, может быть, помогут."
10025070-46 = ""
10025070-48 = ""
10025070-50 = ""
10025070-51 = ""
10025070-52 = "Значит, вчерашнее заклинание на самом деле было молитвой Глубинным."
10025070-53 = "Но даже если Глубинные пришлют тебе рыбу, её всё равно придётся самому поймать, разве нет?"
10025070-55 = "Вот почему я умолял местных научить меня, но все отказались..."
10025070-56 = "Пожалуйста! Если вернусь вот так, моей карьере конец. Пожалуйста-пожалуйста-ПОЖАЛУЙСТА, научи меня рыбачить...!"
10025070-57 = "Насчёт «крупной рыбы» не знаю, но скумбрию поймать помогу..."
10025070-58 = "Если тебя это устраивает, могу научить."
10025070-59 = "Спасибо! То есть спасибо, Мастер!"
10025070-60 = "М-Мастер...?"
10025070-62 = "Но почему нам пришлось выходить сюда ночью?"
10025070-63 = "Я даже поужинать не успел..."
10025070-64 = "П-Прости... Сейчас лучшее время для ловли скумбрии..."
10025070-65 = "После заката скумбрия подходит к берегу, преследуя мелкую рыбу."
10025070-66 = "Надо записать! Так, насколько далеко забрасывать?"
10025070-67 = "Н-Ну... Зависит от глубины... Просто забрось достаточно далеко, чтобы приманка заинтересовала скумбрию..."
10025070-68 = "Оке-е-ей... Приманкой надо трясти?"
10025070-69 = "Покачивай ровно настолько, чтобы она выглядела живой..."
10025070-71 = "Понял. А как подтягивать, если клюнет?"
10025070-72 = "Д-Достаточно сильно, чтобы леску не порвать...?"
10025070-73 = ""
10025070-75 = ""
10025070-77 = ""
10025070-78 = ""
10025070-79 = "Я так и думала, что Мию будет именно такой учительницей..."
10025070-80 = "Она из тех, кто больше всего полагается на интуицию. А её застенчивость только мешает."
10025070-81 = "Наверное, она даже сама не понимает, какие части лёгкие, а какие сложные..."
10025070-82 = "Они вообще что-нибудь поймают такими темпами...?"
10025070-83 = ""
10025070-85 = ""
10025070-87 = "Не хотела вмешиваться, но больше я этого терпеть не могу."
10025070-88 = ""
10025070-91 = ""
10025070-93 = "Это...!"
10025070-95 = ""
10025070-97 = ""
10025070-98 = ""
10025070-99 = ""
10025070-100 = "Если не хочешь скормить рыбе всю свою наживку, отдай удочку."
10025070-101 = "Я покажу, как надо."
10025070-102 = "Н-Но раньше вы говорили, что слишком заняты, чтобы учить меня..."
10025070-103 = "Хмпф... Какие-то назойливые туристки сделали за меня дела, так что теперь времени полно."
10025070-104 = "Для начала выбросим твою навороченную удочку и возьмём вот эту."
10025070-105 = "Эм... Но у этой удочки даже катушки нет? И она такая... лёгкая..."
10025070-106 = "Для катушки ты ещё не готов. В начале лучше простота. Теперь забрасывай."
10025070-107 = ""
10025070-109 = ""
10025070-111 = "Когда груз начнёт тонуть, медленно веди удилище по течению, чтобы приманка выглядела живой..."
10025070-112 = ""
10025070-114 = ""
10025070-116 = "Сейчас! Подсекай!"
10025070-118 = ""
10025070-120 = ""
10025070-121 = "О! Что-то сопротивляется!"
10025070-122 = "Держи ровно, иначе крючок сорвётся! Теперь это бой между тобой и рыбой: кто сдастся первым?"
10025070-123 = "Чуть вперёд..."
10025070-124 = ""
10025070-126 = ""
10025070-127 = ""
10025070-128 = ""
10025070-130 = "Поняла!"
10025070-132 = "Ого! Какая огромная!"
10025070-133 = "Я ещё никогда не видела такой большой скумбрии..."
10025070-135 = "П-Потрясающе... Я поймал рыбу собственными руками...!"
10025070-137 = "Спасибо!"
10025070-138 = "Это всего лишь скумбрия. Вас, городских, всё удивляет..."
10025070-139 = "В общем, основы ты понял. Продолжай практиковаться, и скоро станешь приличным рыбаком."
10025070-141 = "В рыбалке ты соревнуешься не с морем, а с самим собой—"
10025070-142 = ""
10025070-145 = ""
10025070-147 = "*урчит* *урчит*"
10025070-148 = "Классическая Саки."
10025070-149 = "Всегда портишь атмосферу своими странными тупыми звуками."
10025070-150 = "Я ничего не могу поделать! Я ничего не ела с обеда..."
10025070-152 = "Если подумать, уже и правда поздно."
10025070-153 = "Почему бы не приготовить скумбрию, которую Мию поймала раньше?"
10025070-154 = "Согласна!"
10025070-156 = "Звучит... хорошо..."
10025070-158 = "Свежая скумбрия... Вариантов бесконечно много...!"
10025070-159 = "Можно нарезать сашими! Или, может, лучше пожарить..."
10025070-161 = "Ты думаешь, одной скумбрией наешься?"
10025070-162 = ""
10025070-164 = ""
10025070-166 = ""
10025070-167 = "Вот, возьми."
10025070-169 = "Что это...?"
10025070-170 = "Свежий сегодняшний улов. Для продажи они не подходят, но всё ещё вкусные."
10025070-171 = "С-Спасибо..."
10025070-172 = "Ого... Мы перешли от скумбрии к морскому окуню, моллюскам и... это осьминог...?"
10025070-173 = "М-Мы правда можем принять столько дорогих морепродуктов...?"
10025070-175 = "Может, у вас они и дорогие, а мы здесь ловим столько, что не успеваем от всего избавиться."
10025070-176 = "Так что налетайте и наслаждайтесь."
10025070-178 = "Спасибо!"
10025070-180 = ""
10025070-186 = ""
10025070-187 = "Ого... Только положили на гриль, а запах уже чувствуется..."
10025070-188 = "Зацените этот аромат умами... Не могу дождаться!"
10025070-189 = ""
10025070-191 = ""
10025070-196 = ""
10025070-197 = "Прошу прощения! У вас есть разрешение на костёр...?"
10025070-198 = "[s] «Что-то вкусно пахнет...»"
10025070-200 = "А, Сенсей... и тот студент Валькирии с утра."
10025070-201 = "Подождите... Нам нужно разрешение для этого костра?"
10025070-202 = "Ну, если местные не против, ничего страшного... А, вижу, с вами житель деревни. Тогда, думаю, всё нормально."
10025070-203 = ""
10025070-205 = ""
10025070-208 = ""
10025070-209 = "[ns1] «Я так и думал, что вы тут что-нибудь жарите...»\n[ns2] «Поэтому принёс ещё кое-что для гриля.»"
10025070-212 = "Кое-что, говорите?"
10025070-213 = "Посмотрим... Баклажан, грибы, масло, чеснок... и лимон?"
10025070-214 = "Рыба с чесночным маслом... а сверху немного лимонного сока..."
10025070-215 = "Это будет потрясающе!"
10025070-216 = "Давай, Моэ, быстрее! Клади масло на рыбу!"
10025070-217 = "Я тороплюсь, тороплюсь! Такие вещи нельзя спешить! Ну и ну!"
10025070-219 = "Хи-хи... Если хотите сделать этот ужин по-настоящему незабываемым, пора достать моё секретное оружие..."
10025070-220 = "С-Секретное оружие...?"
10025070-221 = "Вот... сушёный кусая!"
10025070-223 = "Аргх! Ну обязательно было всё портить?!"
10025070-224 = "Убавь тон, мелкая. Без кусая жареная рыба — не жареная рыба. По-настоящему."
10025070-225 = "Но этот запах... и вкус ведь даже не такой уж хороший...!"
10025070-226 = "Значит, ты просто не пробовала НАСТОЯЩИЙ кусая!"
10025070-227 = "Вот, я приготовлю его как надо. Тогда узнаешь настоящий вкус!"
10025070-228 = ""
10025070-230 = ""
10025070-231 = ""
10025070-232 = "Гва-а...! Запах... распространяется...!"
10025070-233 = "Если вам это кажется плохим, попробуйте несколько лет доводить рассол до идеала. Слабаки..."
10025070-234 = ""
10025070-236 = ""
10025070-239 = "А-а... Запах кусая уже переходит на овощи..."
10025070-240 = "Он... вездесущий. Такое чувство, что если откусить хоть кусочек, запах останется на мне на годы..."
10025070-241 = "Представь, как открываешь банку такого в забитой столовой... Ха-ха-ха..."
10025070-242 = "Эй. Если поешь это, спать в моём спальнике тебе ЗАПРЕЩЕНО."
10025070-243 = "Ой, как обидно. Если тебя это так раздражает, лучше сразу привыкнуть — одним большим заходом."
10025070-245 = "Давай, Саки. Откуси!"
10025070-246 = "А-а! Не подходи!"
10025070-248 = "В ту ночь мы отлично провели время, жаря рыбу на пляже..."
