[translation]
1015406-1 = "The Inherited Will"
1015406-2 = "(I headed to the location Manami sent me.)"
1015406-4 = "A hallway in an apartment building in D.U."
1015406-5 = "Sensei, I have been waiting for you."
1015406-6 = "[s] \"The culprit is in here...?\""
1015406-7 = "It is highly likely."
1015406-8 = "Currently, other council members are standing by at what we believe to be the culprit's hideout."
1015406-9 = "All that remains is to receive your authorization, Sensei."
1015406-10 = "[s1] \"I see. That's why you called me here.\"\n[s2] \"To formally use force outside the autonomous district—\""
1015406-15 = "[ns] \"Under the supervision of Schale, I authorize the operation!\""
1015406-16 = "I have been waiting for those words."
1015406-17 = "Now is the time to settle the score for the past ten years."
1015406-18 = "Now, operation start!"
1015406-21 = "Forced entry of the entrance initiated!"
1015406-22 = "Executing!!"
1015406-27 = "Cough, hack! *Cough, cough*...!"
1015406-28 = "So you were hiding here after all."
1015406-29 = "Drag that person out in front of me."
1015406-30 = "W-what is this!? Explain yourself...!!"
1015406-34 = "You have the right to remain silent, and anything you say may be used as evidence against you in a court of law!"
1015406-35 = "And so on!"
1015406-39 = "H-hey! Let go of me!"
1015406-44 = "[ns] \"Are you the culprit from ten years ago...?\""
1015406-45 = "W-what are you talking about!"
1015406-46 = "I'm just a good citizen running a private business in D.U.!"
1015406-47 = "Is that so? Then, could you explain this?"
1015406-48 = "Ten years ago. A hair left at the scene... Why does it match yours—a supposedly good citizen?"
1015406-49 = "W-what did you say...?"
1015406-51 = "You must think your cleanup of the scene was perfect."
1015406-52 = "In fact, the investigation at the time found no significant evidence."
1015406-54 = "However, technological progress has been remarkable."
1015406-55 = "As a result, ten years later, we finally found it."
1015406-56 = "A clue to the culprit... from just a single hair."
1015406-57 = "...!!"
1015406-58 = "Everything else was wiped clean, but the hair caught in the gap of a broken frame... the one and only, yet greatest clue left at the scene."
1015406-59 = "You were probably too desperate to escape to pay attention to that."
1015406-60 = "T-that is...!"
1015406-61 = "That's enough of your pathetic excuses."
1015406-62 = "Take him away."
1015406-67 = "Damn it! To think I'd end up like this...!!"
1015406-68 = "[ns] \"Is this case closed now?\""
1015406-69 = "No, it is not over yet."
1015406-70 = "The other members should continue the investigation."
1015406-71 = "We must recover the academy's masterpiece."
1015406-76 = "(Afterward, the investigation continued until late.)"
1015406-84 = "(Thanks to everyone's efforts, we finally found the missing artwork.)"
1015406-85 = "(However, the storage conditions were poor... and it was severely damaged.)"
1015406-86 = "(For now, I returned to Wildhunt with everyone.)"
1015406-88 = "It has become quite late. I can handle the follow-up procedures on my own, so please head home, Sensei."
1015406-89 = "[s] \"I'm already involved, so I'd like to see it through to the end.\""
1015406-90 = "..."
1015406-91 = "This is... just me talking to myself, but..."
1015406-94 = "The culprit kept the stolen artwork for ten years."
1015406-95 = "They said they intended to dispose of it, but the academy's surveillance was too strict, so they couldn't."
1015406-96 = "Because of that, they kept the work in poor conditions as a petty act of revenge."
1015406-97 = "Because of that—the academy's masterpiece has been severely damaged."
1015406-98 = "It is shameful to even call this 'finding it'."
1015406-99 = "But I will not give up."
1015406-100 = "Tomorrow, I will gather the academy's experts and begin the restoration work."
1015406-101 = "The evidence was preserved through the efforts of my predecessors, and the will passed down through generations prevented the sale of the artwork."
1015406-102 = "And the obsession to recover the work led to the culprit's arrest."
1015406-103 = "That spirit which has been passed down... I will never let it be meaningless."
1015406-104 = "[s3] \"Feelings that transcend generations...\"\n[s4] \"This is also the kind of artistic sensibility Manami wants to cherish, isn't it?\""
1015406-111 = "That is correct."
1015406-112 = "You seem to have gained a deep understanding of me."
1015406-115 = "[wa:1120]― [log=마나미]My Wildhunt Art Academy is,[/log]"
1015406-117 = "― [log=마나미]an academy with a long history.[/log]"
1015406-120 = "― [log=마나미]The achievements of past excellent council presidents,[/log]"
1015406-122 = "― [log=마나미]are still [wa:1520]being told to this day.[/log]"
1015406-125 = "[wa:2250]― [log=마나미]However, [wa:1880]I [wa:2060]will likely not be among them.[/log]"
1015406-127 = "― [log=마나미]Even though there are circumstances, [wa:2340]I haven't been able to engage in my major's activities—[/log]"
1015406-130 = "― [log=마나미]and the academy's operation [wa:1920]is criticized as dictatorial.[/log]"
1015406-133 = "[wa:930]― [log=마나미]I do not [wa:960]think that is unjust.[/log]"
1015406-135 = "― [log=마나미]Art is something that [wa:2060]transcends time.[/log]"
1015406-138 = "― [log=마나미]The art I have protected,[/log]"
1015406-140 = "― [log=마나미]will surely be [wa:1920]passed on to future generations.[/log]"
1015406-143 = "[wa:1260]― [log=마나미]Protecting this academy and [wa:2210]the academy's art—[/log]"
1015406-145 = "― [log=마나미]that is the very reason [wa:1870]I continue to be [wa:1250]the council president.[/log]"
1015406-148 = "― [log=마나미]Therefore, [wa:1320]Sensei—[wa:2470]from now on as well...[/log]"
1015406-150 = "― [log=마나미]You will keep watching over [wa:2280]someone like me, won't you?[/log]"
1015406-153 = "Haha, I've been talking to myself for too long. Let's get back to work."
1015406-154 = "This incident has been resolved, but there are still many missing artworks."
1015406-155 = "I only hope that this will be the start of finding the others as well."
1015406-156 = "[s] \"What other kinds of works were stolen?\""
1015406-157 = "While not quite on the level of the academy's masterpiece like this one, other valuable items have gone missing."
1015406-158 = "I would like to say the case is solved by catching the culprit, but—the well-prepared thief escaped as if to mock us."
1015406-159 = "Haha, but I will definitely."
1015406-160 = "I will definitely catch them and sentence them to a lifetime of freeze-dried chicken breast treats."
1015406-161 = "[s] \"I'm rooting for you...!\""
1015406-163 = "(Afterward, I continued to help Manami clean up the incident.)"
1015406-164 = "(Hoping that one day, everyone will be able to understand Manami's feelings.)"
