[translation]
52260-1 = "Эпизод 26;Истинные намерения во тьме"
52260-2 = "«Сто историй о призраках» берут начало из череды древних сказаний."
52260-3 = "Давным-давно участники Хяккарёран собирались в полночь и в темноте шёпотом рассказывали истории о призраках. Завершив свой рассказ, каждый гасил одну свечу."
52260-4 = "С каждой рассказанной историей огоньки свечей один за другим угасали. Пока наконец тьма не укрывала всех тяжёлым покрывалом."
52260-5 = "Когда зрение меркнет, внутреннее «я» человека проявляется куда отчётливее."
52260-6 = "Как и эта странная история, человеческое сердце — непостижимая сила."
52260-7 = "Слухи, предания, истории о призраках и мифы — всё это можно назвать отражением желаний рассказчика."
52260-9 = "[log][ff4444]Взгляни во тьму и говори.[-][/log]"
52260-12 = "[log][ff4444]Какой ложью ты прикрываешь себя?[-][/log]"
52260-15 = "[log][ff4444]Какие пустые желания ты таишь?[-][/log]"
52260-18 = "[log][ff4444]От чего ты отводишь свой взор?[-][/log]"
52260-21 = ""
52260-22 = "Я..."
52260-23 = "Герои романтической манги всегда казались такими счастливыми."
52260-24 = "Пока я изматывала себя тренировками, отстаивая справедливость Хяккарёран, меня не покидало тревожное чувство."
52260-25 = "Ушедшее время уже не вернуть. А что, если я впустую растрачиваю свою юность?"
52260-26 = ""
52260-28 = ""
52260-29 = "...Ты ведь и так знала ответ, верно?"
52260-30 = "Что твоя жизнь, пропитанная пороховым дымом и потом, была бесконечно далека от той сияющей юности, о которой ты когда-то мечтала."
52260-32 = ""
52260-33 = "Я..."
52260-34 = "Будучи оперативным офицером Хяккарёран, я считала своим долгом поддерживать порядок."
52260-35 = "Во имя дисциплины я бросалась жестокими словами, которых на самом деле не имела в виду."
52260-36 = "Я винила старших, бросивших нас, и ненавидела реальность за то, что не могла изменить её по своему желанию."
52260-37 = ""
52260-39 = ""
52260-40 = "Правда в том... что именно я стала причиной падения Хяккарёран."
52260-42 = ""
52260-43 = "Я..."
52260-44 = "Они говорили, что я нужна, но я всегда была лишь временной заменой."
52260-45 = "Ни настоящая дочь семьи Кадэнокодзи, ни полноценная участница Хяккарёран."
52260-46 = ""
52260-48 = ""
52260-49 = "Всегда живущая ради роли, но никогда — как дорогой кому-то друг."
52260-50 = "...Лучше бы я и правда родилась куклой."
52260-52 = ""
52260-53 = "[ns] «...Что вы сделали с детьми?»"
52260-54 = ""
52260-55 = "Значит, даже сила тома бесполезна перед Сенсеем из Шале."
52260-56 = "...Убери этот обвиняющий взгляд."
52260-57 = "Я лишь направила их взор внутрь себя, чтобы они могли взглянуть на самих себя."
52260-58 = "Однако поразительно, как простое самокопание способно разорвать человека на части."
52260-59 = "Ведь людям не дано постичь дела сердца."
52260-60 = "Даже собственного."
52260-61 = "[s] «И какая разница, если не могут? В чём тут проблема?»"
52260-62 = ""
52260-65 = "[ns1] «Проявляя достаточно любопытства и общаясь, они со временем разбираются.» \n[ns2] «Именно поэтому люди живут рядом друг с другом.» \n[ns3] «Именно так люди постоянно учатся друг у друга.»"
52260-69 = "Вот как. Значит, это ты укрепила их уверенность пустыми надеждами."
52260-70 = "Продолжай. Наблюдай за плодами своего учения."
52260-71 = ""
52260-73 = ""
52260-74 = "Посмотри, к чему приведёт эта «надежда», которую ты в них посеяла."
52260-76 = "...Я..."
52260-77 = "Я ни на что не гожусь. Я безнадёжно неспособна чего-либо добиться собственными силами."
52260-80 = "Я изо всех сил пыталась защитить всё, что было мне дорого, и потерпела неудачу. Всё рассыпалось прямо у меня в руках."
52260-81 = ""
52260-82 = "Как бы я ни старалась, я никогда не могла стать Аямэ."
52260-83 = ""
52260-85 = ""
52260-86 = "...Потому что я — Горё Нагуса."
52260-91 = ""
52260-95 = ""
52260-104 = ""
52260-106 = "Я жалкая, некомпетентная и слабая. Всё, что у меня когда-либо было, — лишь моя ложь."
52260-107 = ""
52260-109 = ""
52260-110 = "Но ничто из этого не оправдывает слабость духа."
52260-111 = ""
52260-113 = ""
52260-114 = ""
52260-116 = "Сколько бы ты ни пыталась, Кокурико, твоей реальности мою не разрушить."
52260-117 = ""
52260-119 = ""
52260-120 = ""
52260-122 = ""
52260-123 = "Я — Горё Нагуса."
52260-124 = ""
52260-126 = ""
52260-127 = "Мне всё равно, что кто-нибудь скажет или подумает... потому что я — лучшая подруга Аямэ!"
52260-128 = ""
52260-130 = ""
52260-131 = ""
52260-132 = "...Понятно. Ты знала с самого начала."
52260-133 = "Ты прекрасно осознаёшь собственную хрупкость и то, насколько тщетно это ошибочное желание спасти своих товарищей."
52260-134 = "И всё же твоя решимость изменить саму реальность непоколебима. Потому ты закрыла том и поднялась по собственной воле."
52260-135 = "Непостижимо... Ты и правда непостижима."
52260-136 = "...Вот что ты сделала с Аямэ, да?"
52260-137 = "Ты заперла её в той кромешной тьме. Тени нашёптывали ей ядовитые слова, ломая её изнутри."
52260-138 = "Именно поэтому Аямэ сбежала."
52260-139 = "Именно. Перед этим сломалась даже та президент Хяккарёран, которой все восхищались. Так что, по-твоему, можешь сделать ты?"
52260-140 = "Ты, жалкая и ничтожная, думаешь, что способна спасти Аямэ?"
52260-141 = "Нет. Не способна, потому что я — не она. Только Аямэ может спасти саму себя."
52260-142 = "Но... я могу протянуть ей руку и держать её, пока она сама не поднимется."
52260-144 = ""
52260-147 = ""
52260-149 = ""
52260-150 = "Её рука... вернулась из мира духов?!"
52260-151 = "Лгунья! Ты не посмеешь позорить нас, носителей томов, дешёвым фокусом—"
52260-152 = ""
52260-154 = ""
52260-155 = ""
52260-157 = ""
52260-158 = "Я спрошу ещё раз."
52260-159 = "Где Аямэ?"
52260-160 = "К-Как такое возможно?"
52260-161 = "Подобно тому как мёртвая ветвь не может расцвести, то, что пало в мир духов, не способно вернуться в эту реальность..."
52260-162 = "К-Кокурико, что это значит?"
52260-163 = ""
52260-165 = ""
52260-166 = ""
52260-167 = "Необходимость придаёт истории неизбежность, но именно совпадение пробуждает интерес."
52260-168 = "Ты вырвала из мира духов тома не только собственную тень, но и руку, которой когда-то пожертвовала. У тебя, в частности, всегда была склонность к довольно занятным сюжетным поворотам."
52260-169 = ""
52260-171 = ""
52260-172 = "Возможно, и в тебе есть задатки рассказчика."
52260-173 = ""
52260-175 = ""
52260-176 = "Аямэ находится на верхнем этаже Тэнсюкаку. Даже сейчас она наблюдает."
52260-177 = "Если тебе всё же удастся спасти свою драгоценную Аямэ..."
52260-178 = ""
52260-180 = ""
52260-181 = "...я рассмотрю иной ход нашей следующей истории."
52260-182 = ""
52260-184 = ""
52260-185 = ""
52260-192 = "[ns] «...Стой!»"
52260-196 = "Она сбежала..."
52260-197 = ""
52260-199 = ""
52260-202 = ""
52260-203 = ""
52260-204 = "У-Ух ты...?! Ч-Что это было?!"
52260-205 = "Такое чувство, будто я очнулась от ужасного, кошмарного сна..."
52260-206 = "Кокурико... А что с Красотой природы?"
52260-207 = "Она сбежала... Мы не смогли её остановить."
52260-208 = "Неважно. Сейчас наша единственная задача — найти Аямэ."
52260-209 = ""
52260-211 = ""
52260-213 = ""
52260-214 = "[USERNAME]-Сенсей... Можно попросить вас ещё об одной, последней услуге?"
52260-215 = "Я не могу гарантировать вашу безопасность, но прошу вас досмотреть мою битву с Аямэ до самого конца."
52260-216 = "[s] «Что бы ни случилось, я не отведу взгляд.»"
52260-217 = "...Спасибо."
52260-218 = "Тогда идём. Мы спасём Аямэ."
