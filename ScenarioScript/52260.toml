[translation]
52260-1 = "Episódio 26;Do Fundo das Sombras Escuras e Profundas"
52260-2 = "Hyakumonogatari consiste em compartilhar cem histórias."
52260-3 = "Realizado na calada da noite, quando até as árvores e ervas dormem, apaga-se uma chama após a outra ao final de cada relato.#n— Uma história de terror nascida de um antigo passatempo de Hyakkiyako."
52260-4 = "Quanto mais se conta, menos luzes restam e mais densa se torna a escuridão."
52260-5 = "Quanto mais a escuridão nos envolve, mais se revela o nosso próprio interior."
52260-6 = "Um coração tão insondável quanto um conto bizarro."
52260-7 = "Rumores e boatos que envolvem o mundo... até as histórias de terror não passam de espelhos que refletem o desejo."
52260-9 = "[log][ff4444]Vamos, confesse ao fundo da escuridão.[-][/log]"
52260-12 = "[log][ff4444]Que máscara de mentiras você está usando?[-][/log]"
52260-15 = "[log][ff4444]Que desejos você guarda consigo —[-][/log]"
52260-18 = "[log][ff4444]E de que você está desviando o olhar?[-][/log]"
52260-22 = "Eu..."
52260-23 = "Eu me esforcei nos treinos para defender a justiça da Hyakkaryouran, mas também sentia insegurança."
52260-24 = "Nos mangás shoujo e romances, a juventude é sempre tão brilhante, enquanto eu..."
52260-25 = "Ficava pensando se não estava desperdiçando a minha juventude."
52260-29 = "...Você já sabia disso há muito tempo, não é?"
52260-30 = "Que uma rotina coberta de suor e pólvora passa longe do que é juventude."
52260-33 = "Eu..."
52260-34 = "Como Estrategista da Hyakkaryouran, achei que era meu dever corrigir tudo."
52260-35 = "\"Trazer a Hyakkaryouran de volta\"... Usando essa causa nobre como escudo, lancei palavras cruéis contra todas."
52260-36 = "Culpei a senpai que desapareceu e amaldiçoei uma realidade que não saía como eu queria..."
52260-40 = "Mesmo sendo eu... quem estava destruindo a Hyakkaryouran desse jeito."
52260-43 = "Eu..."
52260-44 = "Todas me acolheram. Mas... no fim, eu sou sempre apenas a substituta de alguém."
52260-45 = "Tanto como sacerdotisa dos Kadenokouji... quanto como membro da Hyakkaryouran..."
52260-49 = "Ninguém deseja quem eu realmente sou."
52260-50 = "...Se ao menos eu tivesse nascido como uma marionete."
52260-53 = "[ns] \"...O que você fez com elas?\""
52260-55 = "Ora, então o poder do livro maldito realmente não alcança o Sensei da Schale?#nQue problemático."
52260-56 = "...Eu não fiz nada."
52260-57 = "Apenas cobri os olhos delas para que pudessem olhar para si mesmas."
52260-58 = "Contudo, basta uma simples introspecção para que o coração se desfaça com fragilidade."
52260-59 = "Afinal, ninguém é capaz de compreender o coração humano."
52260-60 = "Nem mesmo quando se trata... do próprio coração."
52260-61 = "[s] \"E qual é o problema de não compreender?\""
52260-65 = "[ns1] \"Basta continuar perguntando até compreender.\"\n[ns2] \"É por isso que vivemos nos apoiando uns nos outros...\"\n[ns3] \"E nunca deixamos de aprender juntos.\""
52260-69 = "Ora... então foi você quem soprou esperança nessas garotas?"
52260-70 = "Pois bem, fique aí e assista atentamente."
52260-74 = "Veja aonde leva essa esperança vazia que você tanto pregou —"
52260-76 = "...Eu sou..."
52260-77 = "Uma chorona que não consegue fazer nada sozinha."
52260-80 = "Mesmo quando estendia a mão para o que me era precioso, tudo escorria pelos meus dedos... e eu só conseguia assistir enquanto se despedaçava."
52260-82 = "No fim, eu não consegui me tornar a Ayame."
52260-86 = "...Porque eu sou Goryou Nagusa."
52260-106 = "Vivo dando de cara com obstáculos... e só sei fingir ser outra coisa, mas..."
52260-110 = "— Nem por isso eu tenho o direito de desistir."
52260-116 = "Kokuriko. Não importa o quanto você me mostre a realidade, eu não vou mudar de ideia."
52260-123 = "Eu sou Goryou Nagusa."
52260-127 = "— Diga quem disser o que for, a melhor amiga da Ayame!"
52260-132 = "...Entendo, então você já sabia."
52260-133 = "Da própria fragilidade... da inutilidade de estender a mão."
52260-134 = "E ainda assim, fechou o livro maldito dizendo que vai mudar esta dura realidade?"
52260-135 = "...Realmente, não consigo compreender."
52260-136 = "...Você também mostrou isso para a Ayame, não foi?"
52260-137 = "Prendeu ela na escuridão e ficou sussurrando sem parar."
52260-138 = "Foi por isso que a Ayame se desesperou e fugiu."
52260-139 = "Muito perspicaz. Até a invejada Presidente da Hyakkaryouran teve o espírito quebrado e se juntou a nós.#nE você acha mesmo... que consegue trazê-la de volta?"
52260-140 = "Você, que é mais fraca do que a Ayame, acredita mesmo... que pode salvá-la?"
52260-141 = "Eu não consigo fazer isso.#nPorque... eu não sou a Ayame."
52260-142 = "Mas... eu posso estender esta mão para ela."
52260-150 = "Impossível... Esse braço direito deveria ter sido engolido pelo Crepúsculo."
52260-151 = "Se acha que pode zombar de nós, que manejamos o livro maldito, com um truque barato desses —"
52260-158 = "Vou perguntar mais uma vez."
52260-159 = "Onde está a Ayame?"
52260-160 = "Não... pode ser..."
52260-161 = "Assim como flores não brotam em árvores secas, o que foi engolido pelo Crepúsculo não deveria poder ser recuperado..."
52260-162 = "K-Kokuriko-sama..."
52260-167 = "A necessidade dá estrutura a uma história, e o acaso lhe confere fascínio."
52260-168 = "Quem diria que, do meio do Crepúsculo, você agarraria não só a própria sombra, mas também a mão estendida a outro.#nVocê realmente tem talento para agitar o palco..."
52260-172 = "Acho que você tem muito mais jeito para narradora do que para ficar na Hyakkaryouran."
52260-176 = "Ayame continua lá no alto da torre do castelo, observando vocês."
52260-177 = "Se, porventura, essa mão realmente alcançar a Ayame..."
52260-181 = "— Talvez eu também dê uma pequena olhada em uma história diferente."
52260-192 = "[ns] \"...Espere!\""
52260-196 = "Elas fugiram..."
52260-204 = "A-Aaaah...?! O-O que foi aquilo agora há pouco?"
52260-205 = "Tenho a impressão de que estava tendo um pesadelo terrível..."
52260-206 = "Kokuriko... e o Clube Beleza da Natureza?"
52260-207 = "...Desapareceram. Não consegui impedi-las."
52260-208 = "Mas agora, o mais importante é encontrar a Ayame."
52260-214 = "[USERNAME]-sensei. Por último... posso fazer um pedido?"
52260-215 = "Pode ser um pouco perigoso... mas eu quero que você testemunhe a minha luta contra a Ayame."
52260-216 = "[s] \"Vou acompanhar tudo, aconteça o que acontecer.\""
52260-217 = "...Obrigada."
52260-218 = "Então, vamos lá. Salvar a Ayame."
