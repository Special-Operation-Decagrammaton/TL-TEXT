[translation]
84308100401-5 = ""
84308100401-6 = "Я хотела спросить: ругать членов Отдела разработки игр вообще входит в её полномочия? Она вела себя так, будто это её работа..."
84308100401-7 = "Строго говоря, не входит. Но она часто вмешивается."
84308100401-8 = "В происшествия, ты имеешь в виду. Похоже, дел у неё и так по горло."
84308100401-9 = "Отчасти она сама этого ищет. Иногда, когда происшествий нет, она идёт и находит их."
84308100401-10 = "...Дружба — прекрасная вещь."
