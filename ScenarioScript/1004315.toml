[translation]
1004315-1 = "То, что высечено, — чистота"
1004315-4 = "Я отправился на пляж, где обещал встретиться с Вакамо."
1004315-5 = ""
1004315-8 = "Наконец-то, Сенсей. Вы пришли."
1004315-9 = "Я так долго этого ждала. Только мы вдвоём... на пляже."
1004315-10 = "[s1] «Да, пляж очень красивый.»\n[s2] «И довольно пустой.»"
1004315-13 = "Хи-хи, я не могла вынести мысли, что нам кто-нибудь помешает."
1004315-14 = "Поэтому я, Вакамо, приехала заранее и очистила территорию."
1004315-15 = "От меня не ускользнуло даже крошечное насекомое."
1004315-16 = "[s3] «Когда ты говоришь „очистила“, ты имеешь в виду...?»\n[s4] «Ты сделала это... мирно?»"
1004315-19 = "У этого выражения есть какой-то скрытый смысл?"
1004315-20 = "Я также сгребла острые осколки ракушек — и естественного, и... артиллерийского происхождения."
1004315-21 = ""
1004315-23 = ""
1004315-24 = "Вы хотите сказать, что... не довольны моей работой?"
1004315-25 = "[s] «Нет, что ты! Я неправильно понял. Мне очень нравится!»"
1004315-26 = "Хи-хи, какое облегчение."
1004315-27 = "А ещё заодно я прогнала всех грубых и назойливых людей."
1004315-28 = "[s] «Значит, я всё правильно поняла...»"
1004315-29 = "Не беспокойтесь."
1004315-30 = "Я вела себя хорошо — ради вас, Сенсей. Никакой драки... только убедительные слова."
1004315-31 = "Они поняли мой намёк и быстро ушли."
1004315-32 = "[s] «Ф-Фух, какое облегчение.»"
1004315-33 = "Ну что же, теперь давайте наслаждаться пляжем вдвоём."
1004315-34 = "[s] «Чем ты хочешь заняться, Вакамо?»"
1004315-35 = "Я, Вакамо... хочу прогуляться с вами по песку."
1004315-36 = "Просто слушать шум прибоя и понемногу разговаривать с вами — этого было бы..."
1004315-37 = "[s] «Достаточно?»"
1004315-38 = "Да. Более чем достаточно."
1004315-39 = "Уверена, вам тоже нужен отдых от всей вашей работы."
1004315-40 = "Прогулка по пляжу была бы хорошей сменой обстановки, не так ли?"
1004315-41 = "Если бы мы могли провести так хоть немного времени... я, Вакамо, не желала бы большего."
1004315-42 = "[s] «Конечно. В таком случае...»"
1004315-44 = "Мы с Вакамо пошли гулять вдоль пляжа."
1004315-45 = ""
1004315-50 = "Ах, если бы этот миг мог длиться вечно."
1004315-51 = "[s5] «Вакамо, ты могла бы выбрать мирную жизнь...»\n[s6] «Тогда мы смогли бы проводить больше времени вместе. Как сегодня.»"
1004315-54 = ""
1004315-56 = ""
1004315-57 = "...Нет, так не пойдёт. Я не могу изменить то, кем являюсь."
1004315-58 = "Моя жизнь никогда не будет спокойной. Она никогда такой не была."
1004315-59 = "И... я не могу никому доверять..."
1004315-60 = "...кроме вас, Сенсей."
1004315-61 = "[s] «Почему ты доверяешь мне, Вакамо?»"
1004315-62 = "...С того самого мгновения, как я вас увидела, моё сердце было пленено."
1004315-63 = "Я сама себя перестала узнавать."
1004315-64 = "Как я могла так быстро влюбиться в вас, если всегда убеждала себя, что мне лучше одной?"
1004315-65 = "Поэтому я продолжала наблюдать за вами издалека, размышляя, оценивая..."
1004315-66 = "...действительно ли я могу вам доверять."
1004315-67 = "Я хотела узнать о вас всё. Мне ещё многое предстоит узнать."
1004315-68 = "Но одно я знаю точно..."
1004315-69 = "...Вы по-настоящему хороший человек."
1004315-70 = "Независимо от времени и места, вы всегда искренни с другими."
1004315-71 = "Поэтому я решила поверить... рискнуть..."
1004315-72 = "...поверить, что вы сможете меня понять."
1004315-73 = "...Это отвечает на ваш вопрос?"
1004315-74 = "Однажды я расскажу вам все свои истории, чтобы вы по-настоящему меня узнали."
1004315-75 = "[s] «Я буду ждать.»"
1004315-76 = "Хи-хи, спасибо. Мне повезло иметь такого... учителя."
1004315-77 = "[s] «Мне повезло иметь такую... студента.»"
1004315-78 = "А-а... Такие искренние, сладкие слова...!"
1004315-79 = "И, раз уж мы об этом..."
1004315-80 = "Н-Не хотели бы вы... подвинуться... под мой зонтик...?"
1004315-81 = "Не подумайте, что у меня есть какой-то иной мотив..."
1004315-82 = "Просто солнце такое яркое, а ваша кожа..."
1004315-83 = ""
1004315-85 = ""
1004315-86 = "[ns] «...Ты ведь хочешь, чтобы я сел ближе, да?»"
1004315-87 = "Ух, вы уже всё поняли!"
1004315-88 = "Вы раскусили мою неуклюжую попытку. Я, Вакамо, провалилась бы под землю от стыда, если бы могла!"
1004315-89 = "Ах, я больше не могу! Это слишком!"
1004315-90 = ""
1004315-92 = ""
1004315-93 = "[ns7] «Эй, Вакамо?!»\n[ns8] «Всё нормально! Я рад, что ты говоришь честно!»"
1004315-96 = "...!"
1004315-97 = "В-Вы правы. Мне стоит быть честнее с самой собой..."
1004315-98 = "Смущаться и убегать — не дело..."
1004315-99 = "Понятно. Я, Вакамо, не сбегу!"
1004315-100 = ""
1004315-102 = ""
1004315-103 = "Ай...!"
1004315-104 = ""
1004315-106 = ""
1004315-107 = "Ах, мы так близко, что я чувствую ваше тепло. Словно сон."
1004315-108 = "...Я рада, что набралась смелости."
1004315-109 = ""
1004315-111 = ""
1004315-112 = ""
1004315-113 = "Я, Вакамо, буду беречь этот зонтик в память о сегодняшнем дне..."
1004315-114 = "...дне, когда мы подтвердили наши чувства. Пусть он станет символом нашей любви."
1004315-115 = "Именно. Мы вырежем наши имена на бамбуке."
1004315-116 = "Так наша любовь будет увековечена навеки..."
1004315-117 = ""
1004315-119 = ""
1004315-120 = ""
1004315-121 = "Ах, ай! Неужели это те, о ком я думаю?"
1004315-122 = "...Какое досадное пятно на столь прекрасном мгновении."
1004315-123 = "Хи-хи, я не могу устраивать переполох у вас на глазах, так что, полагаю, на этом всё."
1004315-124 = "Позвольте мне удалиться."
1004315-125 = ""
1004315-127 = ""
1004315-128 = "[ns9] «Пойдём вместе!»\n[ns10] «Без меня не уйдёшь!»"
1004315-131 = "Сенсей, вместе со мной...?"
1004315-132 = "...А-а!"
1004315-133 = "Не сыграем ли мы в игру «Поймай меня, если сможешь»?"
1004315-134 = "[s] «К-Кажется, ставки теперь немного выше.»"
1004315-135 = "Стоять! Не двигаться!"
1004315-136 = ""
1004315-138 = ""
1004315-139 = ""
1004315-140 = ""
1004315-142 = "Хи-хи. Похоже, игра уже началась. Давайте бежать вместе..."
1004315-143 = "...пока не доберёмся до самого края Кивотоса."
1004315-145 = "...И так мы с Вакамо начали нашу грандиозную погоню."
