[translation]
1006502-1 = "Посол Хяккияко Кахо"
1006502-2 = "Примерно через тридцать минут после того, как Кахо сообщила, что навестит Шале..."
1006502-3 = ""
1006502-6 = "Сенсей, спасибо, что подождали."
1006502-7 = "[s] «О, привет. Заходи.»"
1006502-8 = ""
1006502-13 = ""
1006502-14 = "Здравствуйте, Сенсей [USERNAME]."
1006502-15 = "[s] «Привет, Кахо. Ты пришла гораздо раньше, чем я ожидал.»"
1006502-16 = "Прошу прощения, что пришлось прийти так внезапно."
1006502-17 = "Мне следовало заранее назначить встречу."
1006502-18 = "Но поскольку я уже сообщила вам о деле, подумала, что лучше обсудить его поскорее, а не затягивать."
1006502-19 = "[s] «А, раз уж об этом...»"
1006502-20 = ""
1006502-22 = ""
1006502-23 = "[ns] «Я понятия не имею, о каком деле речь, так что, если можешь, объясни...»"
1006502-24 = "А, понятно. Я понимаю."
1006502-25 = "Я прекрасно осознаю, что было бы слишком многого требовать — понять всё только из письма, которое я отправила."
1006502-26 = "И нет ничего необычного в том, что у вас возникли сложности."
1006502-27 = "[s] «А, д-да, конечно?»"
1006502-28 = "Поэтому, пожалуйста, уделите мне немного времени..."
1006502-29 = "То есть, дайте возможность?"
1006502-30 = "Если вы не против, я постараюсь воспользоваться этой возможностью и объяснить всё так, чтобы вам было легко понять."
1006502-31 = "Собственно, именно поэтому я и пришла."
1006502-32 = "[s1] «А, да, с удовольствием.»\n[s2] «Вообще-то я и сам собирался попросить тебя об этом.»"
1006502-35 = "Спасибо."
1006502-36 = "Тогда, раз вы дали мне разрешение..."
1006502-37 = ""
1006502-39 = ""
1006502-40 = "Я, Куваками Кахо, главный стратег туристической и культурной отрасли Хяккияко..."
1006502-41 = "...начинаю презентацию предложения о совместном туристическом бизнесе Шале и Хяккияко!"
1006502-42 = "[s] «...Что...?»"
1006502-43 = ""
1006502-45 = ""
1006502-46 = "Пожалуйста, взгляните на эту диаграмму."
1006502-47 = ""
1006502-49 = ""
1006502-50 = "Кхм, на этой диаграмме показан график ежегодных продаж туристического бизнеса Объединённой академии Хяккияко."
1006502-51 = ""
1006502-53 = ""
1006502-54 = "Годовые продажи Объединённой академии Хяккияко росли на протяжении трёх лет с темпом роста 150%."
1006502-55 = "Такой стабильный рост можно считать чрезвычайно успешным результатом, который редко встретишь во всём Кивотосе..."
1006502-56 = "[s] «...Прости...?»"
1006502-57 = "Конечно, вы можете задаться вопросом, сохранится ли такой рост в будущем..."
1006502-58 = "...или можно ли его гарантировать — это уже отдельные вопросы."
1006502-59 = "Ни один бизнес не может процветать вечно..."
1006502-60 = "И мы в Хяккияко прекрасно понимаем, что без постоянной подпитки бизнес быстро рухнет."
1006502-61 = "[s] «Эм-м, ладно...?»"
1006502-62 = "Однако туристический бизнес Хяккияко обладает множеством особенностей, выгодно отличающих нас от отраслевого стандарта."
1006502-63 = "Согласно различным статистическим данным, бренд Хяккияко уже создал прочный фундамент...!"
1006502-64 = ""
1006502-66 = ""
1006502-67 = ""
1006502-68 = ""
1006502-70 = ""
1006502-78 = "Кахо внезапно начала с невероятным воодушевлением рекламировать Хяккияко."
1006502-79 = "Но её объяснение было переполнено профессиональной терминологией, и большую часть было крайне трудно понять."
1006502-80 = "Пока я совершенно потерянно пытался разобраться, рекламная речь Кахо достигла кульминации."
1006502-85 = "...и именно это, на мой взгляд, является ключевым моментом, который вам следует учитывать, и если вы доверитесь нам, Хяккияко, и согласитесь сотрудничать..."
1006502-86 = "Нет никаких сомнений, что сотрудничество с Шале откроет для нас новые возможности роста..."
1006502-87 = "Более того, можно будет создать новое направление, которое поведёт за собой культуру всего Кивотоса!"
1006502-88 = "На этом презентация, подготовленная мной, Куваками Кахо, окончена. Спасибо."
1006502-89 = ""
1006502-97 = "Фух."
1006502-98 = "Итак, Сенсей, пожалуйста, скажите, если у вас есть вопросы или что-то осталось непонятно и требует дополнительного объяснения."
1006502-99 = ""
1006502-102 = "[ns] «...Ну, в смысле...»"
1006502-103 = ""
1006502-104 = "[ns] «Прости, Кахо, но я не понял вообще ничего из того, что ты сказала.»"
1006502-105 = "..."
1006502-106 = "Тц."
1006502-107 = "[s] «О, кажется, я неправильно выразился. На самом деле я хотел сказать...!»"
1006502-108 = "Нет, всё в порядке. Я лишь поняла, что Сенсей из Шале действительно не так легко поддаётся, как я слышала..."
1006502-109 = "Да. Я только что это осознала."
1006502-110 = "Я представила достаточно данных, но вы смогли проницательно увидеть картину целиком."
1006502-111 = "...Полагаю, одних цифр на диаграмме оказалось недостаточно, чтобы убедить вас."
1006502-112 = "Вы хотите сказать, что по-настоящему важны не цифры, а сердце..."
1006502-113 = "Значит, я должна доказать вам своё доверие."
1006502-114 = "[s] «Что?»"
1006502-115 = "...Понятно."
1006502-116 = "Доказать доверие — задача непростая."
1006502-117 = "Однако я, Куваками Кахо, не отступлю."
1006502-118 = ""
1006502-120 = ""
1006502-121 = "[USERNAME] Сенсей, если вы любезно дадите мне ещё одну возможность..."
1006502-122 = "Я, хоть и недостойна, сделаю всё возможное, чтобы заслужить ваше доверие..."
1006502-123 = "Я б-б-буду ответственным лицом для [USERNAME] Сенсея, чтобы улучшить отношения между Шале и Объединённой академией Хяккияко, а также наше будущее сотрудничество..."
1006502-124 = "...п-посвятив вам всё своё сердце..."
1006502-125 = "...н-на службе..."
1006502-126 = "...в-вам..."
1006502-128 = "[ns] «Эй, я не знаю, что ты там себе придумала, но почти уверен, что всё не так!»"
1006502-129 = ""
1006502-130 = "...Ч-Что?"
1006502-131 = "В-вот как...?"
1006502-132 = "Но..."
1006502-133 = "[s] «А что вообще за „дело“, о котором ты всё это время говоришь?»"
1006502-134 = "Простите?"
1006502-136 = "После того как мы с Кахо обсудили всё по порядку, вывод оказался таким..."
1006502-139 = ""
1006502-140 = "Я-я-я-я..."
1006502-141 = "Мне так жаль!"
1006502-142 = "Я-я и представить не могла, что запрос о сотрудничестве с Шале..."
1006502-143 = "...до сих пор лежит у меня в почте неотправленным...!"
1006502-144 = "[s] «Ага, я чувствовал, что что-то не сходится...»"
1006502-145 = "Не зная правды, я всё это время объясняла вам то, о чём вы вообще ничего не могли знать..."
1006502-146 = "Я-я ещё раз ужасно извиняюсь! Это полностью моя вина!"
1006502-147 = "Если бы я отправила то письмо, мы бы..."
1006502-148 = "[s] «О, кстати, насчёт того, что ты рассказала...»"
1006502-149 = ""
1006502-151 = ""
1006502-152 = "[ns] «Прости, но Шале не сможет принять твоё предложение.»"
1006502-153 = "Подождите, Шале не может... принять... предложение о сотрудничестве?"
1006502-154 = "...Шале — всего лишь Федеральный следственный клуб, который выслушивает проблемы учеников и помогает их решать..."
1006502-155 = "Это не клуб, работающий ради экономической выгоды... вы говорите..."
1006502-156 = "...Значит... я-я всё это время..."
1006502-157 = "...изначально смотрела на всё совершенно неправильно...?"
1006502-158 = "[s] «Полагаю, так и вышло.»"
1006502-159 = "А, а-а-а... ох..."
1006502-160 = "П... понятно..."
1006502-161 = "Я... просто хотела рассказать всем о культуре Хяккияко и думала, что Сенсей из Шале, который помог бесчисленному количеству учеников Хяккияко..."
1006502-162 = "...сможет провести хорошее обсуждение, которое приведёт к отличному результату..."
1006502-163 = "Но это были... лишь мои фантазии..."
1006502-164 = "Я напрасно так разошлась и только запутала вас."
1006502-165 = "...Простите, что так вас разочаровала."
1006502-166 = "[s] «Нет, я не считаю тебя разочарованием.»"
1006502-167 = "...Что?"
1006502-168 = "[s] «Это ведь просто значит, что ты очень хотела рассказать всем о Хяккияко, верно?»"
1006502-169 = ""
1006502-171 = ""
1006502-172 = ""
1006502-174 = "Кахо так сильно хотела рассказать о Хяккияко, что даже пришла в Шале и страстно выступила со всеми подготовленными диаграммами."
1006502-175 = "И дело не только в том, что она посол..."
1006502-176 = "Она искренне хотела рассказать другим о том, что сама очень любит."
1006502-177 = ""
1006502-179 = ""
1006502-181 = "[ns] «(И чуть не сорвалась из-за этого...)»"
1006502-182 = ""
1006502-185 = "[ns] «Я никогда не разочаруюсь в искренней страсти, идущей от сердца.»"
1006502-186 = ""
1006502-188 = ""
1006502-189 = "...Я... понимаю..."
1006502-190 = "Вы... даже меня можете понять..."
1006502-191 = "...Да."
1006502-192 = "Спасибо, Сенсей."
1006502-193 = "Теперь я знаю, чем на самом деле занимается Шале и в чём заключались мои заблуждения."
1006502-194 = "Полагаю, вопрос о сотрудничестве пока можно отложить."
1006502-195 = "[s] «Спасибо, что поняла. Раз уж ты здесь, у тебя есть ещё какие-нибудь проблемы...?»"
1006502-196 = "А вместо этого..."
1006502-197 = "[s] «...Вместо этого...?»"
1006502-198 = ""
1006502-200 = ""
1006502-201 = "Раз уж всё сложилось именно так, ради улучшения отношений между Шале и Объединённой академией Хяккияко..."
1006502-202 = "Я хотела бы представить вам идею, которая только что пришла мне в голову..."
1006502-203 = "Не уделите мне немного времени, Сенсей?"
1006502-204 = "[s] «Э-э, эм... Ну, наверное...?»"
1006502-205 = "Хе-хе. Спасибо."
1006502-207 = "Тогда позвольте начать презентацию."
1006502-209 = "После этого мы с Кахо провели время, переполненное страстью к Хяккияко."
