[translation]
2002115-1 = "Важные вещи, важное дело"
2002115-2 = "Я знаю, что сказала, будто возникло важное дело..."
2002115-3 = "Но потом поняла: если это важно для меня, не значит, что для вас это тоже важно."
2002115-4 = "Может, я слишком остро отреагировала..."
2002115-5 = "[s1] «Да что ты! Всё, что важно для моих студентов...»\n[s2] «…важно и для меня.»"
2002115-8 = "П-Правда?"
2002115-9 = "Э-хе-хе. Спасибо, Сенсей!"
2002115-10 = "Так вот, насчёт того важного дела..."
2002115-11 = ""
2002115-13 = ""
2002115-14 = "Нам нужно наполнить этот мешок подарками!"
2002115-15 = "Я раздала почти все свои подарки, поэтому осталось совсем немного."
2002115-16 = "Но никогда не знаешь, когда вдруг появится кто-то, кому нужен подарок, поэтому..."
2002115-17 = "Я не могу просто сидеть без дела!"
2002115-18 = "К тому же мне нравится дарить подарки! Это делает всех счастливыми!"
2002115-19 = "[s3] «(Если ты уже раздала столько подарков...)»\n[s4] «(Не представляю, зачем может понадобиться ещё больше, но...)»"
2002115-20 = ""
2002115-21 = ""
2002115-23 = ""
2002115-25 = "Хорошо, Сенсей! Пойдём наполним этот мешок подарками!"
2002115-32 = "О, Сенсей, смотрите! Вот отличный подарок!"
2002115-33 = "[s] «...Домашний тренажёр?»"
2002115-34 = "Да! Здоровье — самое главное, поэтому тренажёр, помогающий держать себя в форме, — прекрасный подарок!"
2002115-35 = ""
2002115-37 = ""
2002115-38 = "Гантели, гири... О-о, тут даже коллагеновые капсулы для кожи! Мультивитамины? Берём, конечно!"
2002115-39 = "Извините! Мне, пожалуйста, по одной штуке всего — отсюда и досюда."
2002115-43 = ""
2002115-44 = "О! Сенсей, Сенсей! Тут тоже есть хорошие вещи!"
2002115-45 = "[s] «Разве это не массажёр для спины?»"
2002115-46 = "Да, говорят, он снимает усталость и улучшает кровообращение."
2002115-47 = "О, точно, давайте ещё возьмём аппарат для точечного массажа и что-нибудь для сна!"
2002115-48 = "Примете эту добавку с мелатонином за два часа до сна — и вырубитесь моментально!"
2002115-49 = "[s] «У меня... ОЧЕНЬ... плохое предчувствие.»"
2002115-50 = ""
2002115-52 = ""
2002115-53 = "Хм? Что такое, Сенсей?"
2002115-57 = "[ns] «Нам обязательно было приходить именно сюда?!»"
2002115-58 = "Что вы такое говорите, Сенсей? Никогда не знаешь, кому, где и когда понадобится подарок."
2002115-59 = "И по той же логике подарки можно покупать где угодно и когда угодно!"
2002115-60 = ""
2002115-62 = ""
2002115-63 = "Так... О, вот! Средства для прижигания моксой, банки, пластыри для стоп и даже массажные тапочки."
2002115-64 = "Налокотник с микротоками для защиты суставов! Надувной шейный вытяжитель, чтобы дать голове отдохнуть! И не забудьте дальнеинфракрасный германиевый согревающий компресс!"
2002115-65 = "Посмотрите, сколько всего, Сенсей! Разве это не доказывает, что разумно заходить в каждое место, какое только можем?"
2002115-66 = "[s] «Правда доказывает?!»"
2002115-69 = "[ns] «Мне правда кажется, что здесь не стоит искать подарки!»"
2002115-70 = "Что вы говорите, Сенсей? Как Санта обязан объехать весь мир, так и мы должны заглянуть за каждый угол в поисках подарков и тех, кому они нужны!"
2002115-71 = "Мы обязаны сделать всё, что можем! Нельзя подвести Санта-Клауса!"
2002115-72 = ""
2002115-74 = ""
2002115-75 = "Подходите все! Вот вам подарок..."
2002115-76 = ""
2002115-78 = ""
2002115-79 = "Ого! Генератор инь-ян ванны, искусственный кактус, поглощающий электромагнитные волны, бутылка для детокс-сока..."
2002115-80 = "А тут даже бензопила!"
2002115-81 = "[s] «Бензопила?!»"
2002115-82 = "Да! Это ценный медицинский инструмент!"
2002115-83 = ""
2002115-88 = "Эй, эй, эй."
2002115-89 = ""
2002115-91 = ""
2002115-92 = ""
2002115-96 = ""
2002115-97 = "До меня дошли слухи, что кто-то массово скупает товары для здоровья."
2002115-98 = "А вот и вы. Вас никто не учил не портить другим людям бизнес?"
2002115-100 = "Простите? Мы просто покупаем вещи, чтобы потом раздать людям. И платим полную цену. В чём проблема?"
2002115-102 = "В этом вся проблема, идиотка!"
2002115-103 = "Вы скупаете всё по рыночной цене! А наш бизнес — купить дёшево и продать дорого! Вы нам всё портите!"
2002115-104 = "[s] «Так вам вообще не следовало этим заниматься!»"
2002115-105 = "Прекрасно, они ещё и парочка правильных до тошноты!"
2002115-106 = ""
2002115-108 = ""
2002115-109 = ""
2002115-111 = ""
2002115-112 = "Теперь мне и стыдно, И злость берёт!"
2002115-113 = ""
2002115-114 = "Идите сюда! Пора вам узнать, что ни одно доброе дело не остаётся безнаказанным!"
2002115-115 = ""
2002115-117 = ""
2002115-119 = ""
2002115-120 = ""
2002115-121 = "Мало того что вы пытаетесь помешать мечте Санты дарить всем полезные для здоровья подарки..."
2002115-122 = ""
2002115-125 = ""
2002115-127 = ""
2002115-128 = "Так ещё и пытались наживаться на людях! Это очень непослушно! Прямо в список плохишей!"
2002115-129 = "Санта-Клаус принесёт вам только уголь!"
2002115-130 = ""
2002115-133 = ""
2002115-134 = "Что? Ты до сих пор веришь в Санта-Клауса? Это же—"
2002115-135 = "Стой. Это бензопила?! П-Положи её!"
2002115-137 = "Не бойтесь! От имени Санта-Клауса я покажу вам свет!"
2002115-138 = ""
2002115-140 = ""
2002115-142 = ""
2002115-143 = ""
2002115-147 = "И так Ханаэ... помогла непослушным хулиганам вернуться на путь истинный."
2002115-150 = "Она даже выдала им столь необходимые лекарст— подарки из своего мешка."
2002115-155 = "Вот. Наш мешок наконец снова полон, Сенсей!"
2002115-156 = ""
2002115-158 = ""
2002115-159 = ""
2002115-160 = "С ним, надеюсь, мы продолжим нести всем здоровье и счастье! Кхм. Кхм."
2002115-161 = ""
2002115-164 = "[ns] «Да... Было бы здорово...»"
2002115-166 = "На лице Ханаэ появилась ангельская улыбка."
2002115-167 = "Она была такой светлой и искренней, что очищала каждого, кто на неё смотрел."
