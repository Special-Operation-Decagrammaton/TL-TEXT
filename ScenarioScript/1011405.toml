[translation]
1011405-1 = "Сервис официантки"
1011405-2 = "Пока я ждал Джури, внезапно раздался настойчивый стук."
1011405-3 = ""
1011405-9 = "Сенсе-э-эй!"
1011405-10 = "[s] «Привет, Джури! Давай немного успокоимся?»"
1011405-11 = "Х-хорошо... *шмыгает носом*"
1011405-12 = "Хм? Я выгляжу так, будто меня преследуют?"
1011405-13 = "Нет, не совсем..."
1011405-14 = "Но мне действительно нужно вам кое-что рассказать."
1011405-15 = "Знаете, Сенсей, мне очень повезло стать Официанткой месяца, и я не жалуюсь, но..."
1011405-16 = ""
1011405-18 = "[ns1] «...То есть ты хочешь сказать...»\n[ns2] «Теперь у вас в ДЕСЯТЬ раз больше посетителей?!»"
1011405-21 = "Сначала я справлялась."
1011405-22 = "Менеджер был в восторге, ведь это приносило больше денег, а многие посетители меня узнавали..."
1011405-23 = "Мне было ужасно неловко, но некоторые очень доброжелательно поддерживали меня. Другие просили селфи..."
1011405-25 = ""
1011405-26 = "Ты такая милая, Джури! Можешь попозировать для нас?"
1011405-27 = "С-спасибо. Попозировать...? Я никогда особо этого не делала..."
1011405-28 = "Ой, это выражение было таким милым! Намного милее любой позы, которую ты могла бы принять!"
1011405-29 = "Неужели...?"
1011405-30 = ""
1011405-31 = "Здравствуйте, дорогие зрители! С вами Школа журналистики Кронос и наш репортаж с места событий!"
1011405-32 = "Мы пришли взять интервью у новой звезды — самой Ушимаки Джури! Поздороваетесь со зрителями?"
1011405-33 = "З-здравствуйте. Я... Джури..."
1011405-34 = "Да! Итак, по полученной нами информации, Джури недавно участвовала в конкурсе «Официантка месяца»..."
1011405-35 = "Правда ли, что вы смели всех соперниц огромным стаканом, полным кофе?"
1011405-36 = "Что?! Н-нет, такого не было! Я действительно переносила гигантские кружки с кофе, но это было всего лишь одним из испытаний..."
1011405-37 = "Боже, вы слышали это, зрители?! Похоже, полученная нами информация как минимум НАПОЛОВИНУ оказалась правдой!"
1011405-38 = "Воистину впечатляющий подвиг силы, достойный Официантки месяца!"
1011405-39 = "Нет! Совсем нет! Я такого не делала, я, эм...!"
1011405-40 = "Переходим к следующему вопросу! Согласно другому сообщению, вы сражались с роботом из Миллениума!"
1011405-41 = "Говорят, вы заявили: «Может настать день, когда официантки потерпят поражение и откажутся от своих обязанностей...»"
1011405-42 = "«...но не сегодня! Люди не созданы для поражения!» — прямо в лицо этому механическому чудовищу!"
1011405-43 = "А потом вы одержали победу над высокомерным роботом и заставили его самоуничтожиться! В этом есть хоть доля правды?!"
1011405-44 = "Нет! Всё было не так! Я просто, ну, эм...!"
1011405-45 = "Робот действительно ПОПЫТАЛСЯ самоуничтожиться, но я смогла убедить его этого не делать..."
1011405-46 = "Вы слышали, зрители?! Снова сообщение, которое оказалось почти НАПОЛОВИНУ правдивым!"
1011405-47 = "Как всем известно, здесь, в Школе Кронос, мы стремимся давать самые точные, самые сбалансированные и самые БЫСТРЫЕ репортажи в Кивотосе."
1011405-48 = "И мы очень благодарны, что снова смогли выполнить свой долг!"
1011405-49 = "Пока такие люди, как Джури, сражаются за нас на передовой, этому репортёру остаётся сказать лишь одно: будущее Кивотоса всё ещё сияет—"
1011405-50 = "Пожалуйста, просто выслушайте меня до конца!"
1011405-52 = "...*шмыгает носом*"
1011405-53 = "[ns3] «...»\n[ns4] «Ну, ты старалась изо всех сил. Особенно в конце...»"
1011405-56 = "Я и не знала, но слухи разошлись по всему интернету..."
1011405-57 = "Студенты Кроноса в итоге написали положительный репортаж. Менеджер тоже меня поздравил..."
1011405-58 = "Не то чтобы мне не нравилось признание, но по дороге домой люди даже просили автографы..."
1011405-59 = "[s] «Столько внимания, наверное, неприятно.»"
1011405-60 = "..."
1011405-61 = "Не... совсем в этом дело."
1011405-62 = "Меня узнаёт столько людей, я им нравлюсь, они просят сфотографироваться со мной или просто хотят увидеть меня..."
1011405-63 = "Мне это НЕ не нравится, и дискомфорта я не чувствую."
1011405-64 = "Но при этом кажется, будто меня привязывают к работе официанткой."
1011405-65 = "Работы в Клубе школьного питания становится всё больше, и мне кажется, что я уже не могу нормально заботиться обо всём, как раньше."
1011405-66 = "Из-за этого мне стыдно, будто я подвожу всех остальных..."
1011405-67 = "...и я начала думать, не стоит ли просто вернуться в столовую на постоянной основе, где меня ждут старшие."
1011405-68 = "Но теперь столько поклонников приходит в кафе только ради меня. Если уйти сейчас, я подведу уже кафе..."
1011405-69 = "[s] «Слушай, может, продолжим этот разговор в другом месте?»"
1011405-70 = "В другом... месте?"
1011405-72 = "Так это ваша комната отдыха?"
1011405-73 = "[s5] «Именно. А прямо сейчас...»\n[s6] «Она полностью отрезана от внешнего мира.»"
1011405-76 = "Хмм...?"
1011405-77 = "[s] «Такая внезапная популярность обычно быстро проходит.»"
1011405-78 = "А когда всё утихнет, я смогу просто вернуться в Клуб школьного питания, когда захочу?"
1011405-79 = "..."
1011405-80 = "Вы... Вы правы, Сенсей. Да. Такое ведь не будет длиться вечно."
1011405-81 = "Студенты Кроноса меня удивили, но..."
1011405-82 = "Хи-хи-хи. Наверное, у них всегда нюх на хорошие истории."
1011405-83 = "Кстати, почему именно мы здесь?"
1011405-84 = "[s] «Ты выглядела так, будто тебе нужно немного побыть в тишине, Джури.»"
1011405-85 = "Побыть в тишине..."
1011405-86 = "Если подумать, в последнее время у меня этого совсем не было."
1011405-87 = "Даже когда был только Клуб школьного питания... в обед там всегда творился хаос."
1011405-88 = "А ТЕПЕРЬ, ну да, о «времени наедине с собой» вообще говорить не приходится."
1011405-89 = "Спасибо, Сенсей. За то, что подумали обо мне."
1011405-91 = "После этого мы ещё некоторое время просто разговаривали обо всём, что приходило в голову."
1011405-92 = ""
1011405-98 = "Не всему в мире нужна цель или смысл. Иногда можно просто посидеть вместе и ничего не делать."
1011405-99 = ""
1011405-106 = "О боже... Куда делось время?!"
1011405-107 = "[s7] «Когда весело, время летит...»\n[s8] «Жаль, что на работе оно не идёт так же быстро.»"
1011405-110 = "Знаете, я... Кажется, я была с вами эгоистична, Сенсей."
1011405-111 = "Даже если вы скажете не переживать, я... всё равно буду."
1011405-112 = "..."
1011405-113 = "Но, Сенсей?"
1011405-114 = "Если хотите... в кафе я научилась делать фирменное парфе."
1011405-115 = "Хотите попробовать?"
1011405-116 = "[s] «Парфе... от тебя, Джури?»"
1011405-117 = "Ага! То есть вы не обязаны... если не хотите."
1011405-118 = "[s9] «Хм... Хорошо. С этого момента это место — „Кафе Шале“.»\n[s10] «Будьте добры, одно фирменное парфе от госпожи Джури.»"
1011405-121 = "*ахает*"
1011405-122 = "Да, конечно!"
1011405-123 = "Подождите минутку, дорогой «посетитель»."
1011405-124 = "Что касается ингредиентов... О, рядом же есть круглосуточный магазин!"
1011405-125 = ""
1011405-127 = ""
1011405-128 = "И так я ждал в комнате отдыха фирменное парфе Джури."
1011405-131 = "― [log=주리 아르바이트]Добро пожаловать в...[/log][wa:990]"
1011405-132 = "― [log=주리 아르바이트]кафе «Шале»! [/log][wa:1690]"
1011405-135 = "― [log=주리 아르바이트]Да, вот заказанное вами фирменное парфе![/log][wa:10]"
1011405-138 = "― [log=주리 아르바이트]Фуфу... Интересное ощущение...[/log][wa:1310]"
1011405-141 = "― [log=주리 아르바이트]Это кафе только для вас, Сенсей.[/log][wa:770]"
1011405-143 = "― [log=주리 아르바이트]И я здесь единственная официантка...[/log][wa:1650]"
1011405-146 = "― [log=주리 아르바이트]Сенсей, вы знали?[/log][wa:1730]"
1011405-148 = "― [log=주리 아르바이트]Parfait... означает «идеальный».[/log][wa:1520]"
1011405-151 = "― [log=주리 아르바이트]Я не идеальна.[/log][wa:2360]"
1011405-152 = "― [log=주리 아르바이트]Я даже не мастер.[/log][wa:1630]"
1011405-155 = "― [log=주리 아르바이트]Но однажды... я хочу сделать...[/log][wa:1090]"
1011405-157 = "― [log=주리 아르바이트]идеальное парфе.[/log][wa:1810]"
1011405-160 = ""
1011405-161 = "[ns] «Спасибо за угощение!»"
1011405-162 = "К-как вам...?!"
1011405-163 = "Совру, если скажу, что на всякий случай не приготовился к худшему, но..."
1011405-164 = "[ns11] «А... Это... совсем неплохо!»\n[ns12] «Сладкое, но при этом очень солёное и насыщенное...!»"
1011405-167 = "Правда?!"
1011405-168 = "Теперь я не знаю, почему парфе у вас получилось солёным и насыщенным, но..."
1011405-169 = "Слава богу... Слава богу, Сенсей! Я сейчас так счастлива!"
1011405-170 = ""
1011405-172 = ""
1011405-173 = ""
1011405-174 = "[ns] «Ого, Джури! Успокойся!»"
1011405-176 = "Джури бросилась мне в объятия. Я успокоил её."
1011405-177 = "Оставшуюся часть дня мы провели вместе и лишь поздно ночью разошлись по домам."
