[translation]
2601106-1 = "Удивительное качество"
2601106-2 = "Сатэн попросила меня встретиться с ней в тире."
2601106-3 = ""
2601106-7 = "Войдя внутрь, я увидел, что она уже тренируется."
2601106-8 = ""
2601106-10 = ""
2601106-11 = "Хорошо. На этот раз точно..."
2601106-12 = ""
2601106-14 = ""
2601106-16 = "...? Что?"
2601106-17 = "Да что такое... Всё точно как в прошлый раз..."
2601106-18 = ""
2601106-20 = ""
2601106-21 = "*вздох* Нужно было догадаться."
2601106-22 = "[s1] Тренируешься стрелять?\n[s2] Чего вздыхаешь?"
2601106-25 = "О, Сенсей? Что ты здесь делаешь?"
2601106-26 = "Погоди, я сама тебя сюда позвала? Правда?"
2601106-27 = ""
2601106-29 = ""
2601106-30 = "И правда... Видимо, написала на автомате. Совсем забыла, что отправила тебе сообщение."
2601106-31 = "Прости. Такое чувство, будто я позвала тебя сюда без причины. Ха-ха..."
2601106-32 = "О? Ты точно не против?"
2601106-33 = "Хочешь знать, почему я вдруг так заинтересовалась стрельбой. Ну..."
2601106-34 = "Ничего особенного... Правда..."
2601106-35 = "...*вздох*"
2601106-36 = "Просто захотелось попробовать. Вот и всё. На всякий случай, понимаешь?"
2601106-37 = "Никогда ведь не знаешь, правда? Вдруг у меня скрытый талант к стрельбе!"
2601106-38 = "То есть когда ещё мне доведётся вот так ходить с оружием? Я решила воспользоваться возможностью по максимуму."
2601106-39 = "А результат... Ну... примерно такой, какой можно было ожидать."
2601106-40 = "Не то чтобы я изначально многого ожидала, но..."
2601106-41 = "Наверное, всё равно немного обидно!"
2601106-42 = "Я ведь и в своём мире изо всех сил пыталась стать эспером..."
2601106-43 = "...но ничего из этого не вышло."
2601106-44 = "Н-Но попытка не пытка, правда? Я ведь ничего не теряю, если пробую!"
2601106-45 = "[s3] Ты совершенно права! Это потрясающе!\n[s4] У тебя просто идеальный настрой!"
2601106-48 = ""
2601106-50 = ""
2601106-51 = ""
2601106-52 = "А...?"
2601106-53 = "Эм... Ну, я не думала, что это НАСТОЛЬКО здорово."
2601106-54 = "Мне кажется, ты немного перебарщиваешь с похвалой."
2601106-55 = "...Хм? Ты правда так думаешь? Не понимаю..."
2601106-56 = "[s5] Ты удивительнее, чем сама думаешь.\n[s6] Не у многих такой сильный дух, Сатэн."
2601106-59 = "П-Правда? Не ожидала от тебя такой реакции..."
2601106-60 = "И ты ещё говоришь это совершенно серьёзно..."
2601106-61 = ""
2601106-63 = ""
2601106-64 = "Ну... Я не против! Не совсем понимаю, но похвала есть похвала, верно?"
2601106-65 = "Никогда не знаешь! Если продолжу пробовать разные вещи, обязательно найду какой-нибудь скрытый талант!"
2601106-66 = "И раз уж об этом..."
2601106-67 = "На всякий случай я возвращаюсь к тренировке стрельбы!"
2601106-68 = ""
2601106-70 = ""
2601106-75 = "С таким энтузиазмом Сатэн после этого возвращалась в тир ещё добрый десяток раз."
2601106-76 = ""
2601106-78 = ""
2601106-79 = ""
2601106-80 = ""
2601106-81 = ""
2601106-82 = "В конце концов её меткость бесспорно стала лучше, чем в начале."
