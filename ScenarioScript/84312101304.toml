[translation]
84312101304-5 = ""
84312101304-6 = "Я на самом деле удивилась. Обычно они не нравятся людям так... сразу."
84312101304-7 = "А? Почему? Это вкусно. И приятно холодит."
84312101304-8 = "Я-я тоже так думаю. Но не всем нравится..."
84312101304-9 = "Здесь довольно много людей, которым нравится такой вкус. Прохлада помогает прогонять усталость."
84312101304-10 = ""
84312101304-12 = ""
84312101304-13 = "О... Значит, чтобы не заснуть."
84312101304-15 = "(Интересно, о чём они говорят...)"
