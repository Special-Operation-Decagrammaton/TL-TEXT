[translation]
1300805-1 = "Прополка сорняков в парке"
1300805-2 = "Сегодня наша задача — вырывать сорняки в парке! Звучит просто, но работа будет тяжёлая."
1300805-3 = "Нам нужно сосредоточиться на участке здесь и ещё вон на том."
1300805-4 = "Тот особенно сильно зарос, так что если не вырывать сорняки с корнем, они быстро вырастут снова."
1300805-5 = "Кажется, на каждый вырванный сорняк появляются ещё два... *вздох* Напоминает старую историю о парне, который бесконечно катил камень в гору."
1300805-6 = "Вот бы у нас было профессиональное садовое оборудование. А у меня только перчатки и серп..."
1300805-7 = "[s] «Как-нибудь справимся.»"
1300805-8 = "Ну что, Сенсей! За работу!"
1300805-10 = "(Мы с Серикой весь день вырывали сорняки.)"
1300805-11 = "Мы закончили как раз перед закатом."
1300805-13 = "Всё! Этого должно хватить."
1300805-14 = "Вы неплохо справились! Наверное, уже привыкли к физическому труду?"
1300805-15 = "Моя спина... не в таком восторге."
1300805-16 = "Эта работа хороша тем, что можно заниматься после школы... но платят не особо много."
1300805-17 = ""
1300805-18 = "...Уже темнеет. Пойдёмте обратно, Сенсей."
1300805-19 = ""
1300805-21 = "(Мы с Серикой поковыляли домой, держась за ноющие спины.)"
