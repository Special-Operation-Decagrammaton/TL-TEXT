[translation]
212200-1 = "Episode 20;Those Left Behind"
212200-4 = "Here you go, grilled saury. And some miso soup."
212200-10 = "Yay! I'm absolutely starving!"
212200-11 = "It looks so delicious!"
212200-16 = "Hehe, thank you very much."
212200-17 = "Since you went through the trouble of making it, let's eat while it's still hot."
212200-18 = "I don't even know why I'm cooking for you, honestly..."
212200-19 = "But I can't just leave you when you're hungry."
212200-20 = "You really are kind, aren't you?"
212200-21 = "While you're being kind, could I ask for three more bowls of rice?"
212200-22 = "Yes, coming right up! #nI'll bring them in your usual extra-large bowl!"
212200-26 = "Nom, munch... mmm..."
212200-30 = "...Huh? What's wrong? #nYou were about to add your special sauce and then stopped."
212200-31 = "Hmm, I just felt like I didn't need it today."
212200-32 = "Fuuka put her heart into making this meal. It's delicious just as it is!"
212200-33 = "Oh, even Izumi says things like that. #nWhy don't you try enjoying the natural flavors more often?"
212200-37 = "That's different. #nOh! Then next time, let's try pickled ginger and peanut butter together—"
212200-38 = "I'll pass..."
212200-42 = "..."
212200-48 = "Haruna, are you thinking about something?"
212200-49 = "You're awfully quiet. It's actually kind of scary."
212200-53 = "...The sear on the saury is uneven. #nThe tofu in the miso soup is cut into inconsistent sizes."
212200-54 = "That's... well, I was in a rush to prepare it—"
212200-55 = "Hm? Wait a second, why am I making excuses?"
212200-56 = "I went through the trouble of making this for you, and if you're going to complain..."
212200-60 = "This is true gourmet."
212200-67 = "...As I ate this meal, I found myself reflecting."
212200-68 = "On the menus I forced upon you, the supply schedules, and the preparation processes."
212200-69 = "And... on myself, for monitoring all of you as you tried to correct my errors."
212200-70 = "..."
212200-76 = "It was enough to quietly soothe my pathetic soul, which had been tainted by all the actions I took—"
212200-80 = "Fuuka-san's cooking is so warm, isn't it?"
212200-84 = "Haruna..."
212200-85 = "Gourmet is, in essence, being grateful for someone's sincerity—#nI had forgotten that simple truth."
212200-86 = "Fuuka-san's delicate handiwork, Juri-san's devotion... #nI offer my apologies for my many rudenesses."
212200-87 = "...Well, it was the Kaiser's fault, right? #nIn that case, aren't you all victims too?"
212200-88 = "Regardless of the circumstances... I will not use that as an excuse."
212200-89 = "I forgot the very duty of a gourmet, and tried to force you all into a framework of control."
212200-90 = "That alone is more than enough reason to reflect. #nI am truly... so sorry."
212200-95 = "You two were really weird back then."
212200-96 = "...It was scary. That kind of Gourmet Research Society isn't fun at all."
212200-97 = "I thought Gehenna was going to fall apart..."
212200-103 = "I'm sorry for making you feel uneasy."
212200-108 = "..."
212200-109 = "Alright, that's enough! Being all mopey won't solve anything, right?"
212200-110 = "Instead, just remember this one thing."
212200-115 = "If you ever do that again, I'm never cooking for you ever again. Got it!?"
212200-120 = "Hehe, that would be a major problem."
212200-121 = "Us too! If that happens again, we won't go out to eat with you!"
212200-122 = "And we won't share our sauce with you either!"
212200-123 = "Oh my, oh my. You must train your mental fortitude. #nAt least enough so that brainwashing doesn't work on you from the start."
212200-124 = "So... could I have a refill? #nNo matter what you do, you need the power of a good meal first★"
212200-125 = "You already ate all three bowls!?"
212200-126 = "Coming right up! Please wait a moment!"
212200-128 = "(Everyone apologizes in their own way. But their feelings should have come across clearly.)"
212200-133 = "..."
212200-141 = "Sena-senpai."
212200-142 = "Oh, Chinatsu. What is it?"
212200-143 = "...How are you feeling?"
212200-144 = "I'm in top form. There haven't been any corpses... or patients, lately."
212200-145 = "That's good—"
212200-146 = "But my heart doesn't feel clear."
212200-147 = "..."
212200-148 = "I remember. #n...What I said to you, Chinatsu."
212200-149 = "That attacks are medical procedures, or that bleeding should be accepted as part of the surgical process—"
212200-150 = "I was spouting such sophistry."
212200-151 = "...As someone in charge of the Emergency Medicine Department, I am unfit to be a leader."
212200-152 = "I know that wasn't your true heart, Senpai."
212200-153 = "Even so. I cannot take back the words I once spoke."
212200-154 = "Greatness comes with sacrifice? Not at all. #nMedicine should never treat sacrifice as a matter of course."
212200-155 = "We should struggle to prevent even a single drop of blood from being spilled. #nThat is supposed to be our duty."
212200-159 = "You have... practiced that properly, Senpai. And you will continue to do so."
212200-160 = "..."
212200-161 = "I saw you fighting, Chinatsu."
212200-165 = "I saw you standing up to Prefect Team Leader Hina, raising your gun even while in pain."
212200-166 = "I saw you, Chinatsu, walking the path you believe in and resisting what is unreasonable..."
212200-167 = "Th-that is..."
212200-168 = "Before, when you said you were going to the Prefect Team, I took it as you straying from the path."
212200-169 = "But with this incident, I finally realized. #nYou became an emergency responder in the Prefect Team and transported me, who had lost my way, to the right place."
212200-170 = "Thank you. I am proud that you are my junior, Chinatsu."
212200-174 = "You have surpassed everything I taught you and performed the most perfect first aid."
212200-180 = "...I'm glad. I'm truly glad you've returned, Senpai."
212200-181 = "Hehe..."
212200-185 = "Now, the transport is finished, so we must begin rehabilitation therapy next."
212200-186 = "To ensure such a thing never happens again, #nI intend to propose a joint inspection between the Prefect Team and the Emergency Medicine Department."
212200-187 = "I will pass that on as well. The Prefect Leader will surely be pleased."
212200-188 = "...Once again, thank you for guiding my heart in the right direction."
212200-192 = "Sena-senpai, also..."
212200-193 = "Thank you for... believing in me."
212200-200 = "One down! #nNext! Where to next!?"
212200-201 = "We can't afford to be lazy! #nBecause there are hot springs we haven't discovered yet waiting for us!"
212200-202 = "Lately, all that talk about attacks and whatnot was just plain stupid, wasn't it? #nThere's nothing more important than hot springs!"
212200-203 = "Yeah, yeah!"
212200-208 = "Wow! The temperature is perfect, and the flow is amazing! This is the best hot spring ever!"
212200-209 = "The President was right after all!"
212200-210 = "Hahahaha! Naturally. We are capable of digging them up with our own strength."
212200-211 = "...So, you can forget about that map."
212200-212 = "Map...? #nOh, right! I forgot about that!"
212200-213 = "Haha. It means it was just that kind of item. #nNo need to worry about it."
212200-214 = "Ah... but that reminds me... #nWhy was I feeling like that?"
212200-215 = "Like, doing it for Gehenna... or wanting to be useful."
212200-216 = "That is—"
212200-217 = "But it doesn't matter anymore!"
212200-218 = "I don't really get complicated stuff. It's not exciting!"
212200-222 = "Ah, I suppose so. There's no fun in it. None at all."
212200-223 = "We're fine because we have the President!"
212200-224 = "..."
212200-225 = "Megu. You don't have to do exactly as I say, you know."
212200-226 = "Eh?"
212200-227 = "Because then, it would be no different from brainwashing..."
212200-231 = "What's important is what you want to do, Megu."
212200-232 = "Geez, I've heard that a million times."
212200-233 = "You don't have to worry about a thing!"
212200-237 = "What I want to do most is be with the President—and everyone else!"
212200-238 = "Digging hot springs together, eating delicious food, building buildings. #nI love that kind of stuff! I want to keep doing this forever!"
212200-243 = "Haha! Hahahaha!"
212200-244 = "If you put it that way, I have no choice. I, the President, shall make it happen."
212200-245 = "Yeah! Thanks as always, President!"
212200-252 = "Yeah, yeah! Well said, Team Leader Megu! #nEveryone! Who are we—!?"
212200-253 = "Hot Spring Development Department!!"
212200-254 = "We are here because there is a hot spring!"
212200-255 = "No, even if there isn't a hot spring, we are here!!"
212200-256 = "Now, move to the next location! #nWe're digging five more hot springs today! We can't waste a single second!"
212200-263 = "...President? Aren't you coming?"
212200-264 = "Hm? Ah. There's something I want to think about. #nI'll catch up later, so you go on ahead."
212200-265 = "Got it! Be careful! The path down is dangerous!"
212200-266 = "Ah, thanks for worrying about me, Megu. See you later."
212200-270 = "Now then..."
212200-271 = "This whole incident... it felt nostalgic somehow."
212200-272 = "The objective, the methods... they were reminiscent of 'that side'."
212200-273 = "If I assume they are the ones moving—"
212200-274 = "Hmm, I'm in danger."
212200-275 = "There are too many things that bother me, but what to do..."
212200-276 = "I have a feeling I'm only going to get dragged into more trouble..."
212200-280 = "Whoa, it's cold! Is it because we're at the summit?"
212200-281 = "Ha! No matter how cold the wind blows, it can't cool the boiling heat we have from the depths of the earth!"
212200-285 = "Ah, I suppose so."
212200-289 = "If that is your intention... then I welcome you."
212200-290 = "Bodensatz, all of you."
212200-292 = "Next Episode;The Indelible"