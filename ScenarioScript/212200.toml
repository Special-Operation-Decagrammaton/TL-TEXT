[translation]
212200-1 = "Episódio 20;O Que Restou"
212200-3 = ""
212200-4 = "Prontinho: peixe sanma grelhado com sal e missoshiro quentinho."
212200-5 = ""
212200-7 = ""
212200-8 = ""
212200-9 = ""
212200-10 = "Uhuuu! Meu estômago já tava roncando alto!"
212200-11 = "O cheirinho tá simplesmente divino!"
212200-12 = ""
212200-14 = ""
212200-15 = ""
212200-16 = "Fufufu, muito obrigada, Fuuka."
212200-17 = "Já que preparou com tanto carinho, saboreemos antes que esfrie."
212200-18 = "Eu nem sei por que tô cozinhando pra vocês depois de tudo o que aprontaram, sinceramente......"
212200-19 = "Mas ver gente passando fome na minha frente me corta o coração."
212200-20 = "A senhorita tem uma generosidade admirável."
212200-21 = "Aproveitando a bondade, poderia me servir mais três tigelas cheias de arroz?"
212200-22 = "Pode deixar, é pra já!#nVou trazer naquelas tigelas gigantes de sempre!"
212200-23 = ""
212200-24 = ""
212200-25 = ""
212200-26 = "Nham, nham...... hummm......"
212200-27 = ""
212200-29 = ""
212200-30 = "......Ué? O que houve, Izumi?#nVocê ia puxar aquele seu molho maluco e parou no meio do caminho."
212200-31 = "Ah, achei que hoje não precisa."
212200-32 = "A Fuuka cozinhou colocando todo o coração dela. Desse jeitinho já tá uma delícia pura!"
212200-33 = "Nossa, até você falando uma coisa dessas?#nQue tal começar a apreciar o sabor natural das coisas com mais frequência?"
212200-34 = ""
212200-36 = ""
212200-37 = "Uma coisa é uma coisa, outra coisa é outra coisa!#nAliás, que tal provarmos gengibre em conserva com pasta de amendoim da próxima vez――"
212200-38 = "Passo com louvor......"
212200-39 = ""
212200-41 = ""
212200-42 = "......"
212200-43 = ""
212200-45 = ""
212200-46 = ""
212200-47 = ""
212200-48 = "Haruna, tá com a cabeça cheia de pensamentos?"
212200-49 = "Você tá quieta demais pro meu gosto. Tá me dando até medo."
212200-50 = ""
212200-52 = ""
212200-53 = "......O tostado deste sanma apresenta ligeira irregularidade.#nOs cubos de tofu na sopa de missô variam de tamanho."
212200-54 = "É que...... bem, eu preparei tudo na maior correria――"
212200-55 = "Peraí um minuto! Por que é que eu tô me justificando pra você?!"
212200-56 = "Eu cozinho de bom grado e você ainda vem botar defeito?! Se não gostou......"
212200-57 = ""
212200-59 = ""
212200-60 = "Isto sim é a mais sublime gastronomia."
212200-61 = ""
212200-63 = ""
212200-64 = ""
212200-65 = ""
212200-66 = ""
212200-67 = "......Enquanto saboreava cada garfada, fiquei revisitando os meus atos."
212200-68 = "Os cardápios padronizados que exigi, os prazos de suprimento insanos, a rigidez mecânica das cozinhas."
212200-69 = "E mais do que tudo: a vergonha de ter vigiado vocês enquanto tentavam corrigir os nossos erros."
212200-70 = "......"
212200-71 = ""
212200-73 = ""
212200-74 = ""
212200-75 = ""
212200-76 = "A ponto de lavar em silêncio a minha alma manchada por ações tão ignóbeis――"
212200-77 = ""
212200-79 = ""
212200-80 = "A sua culinária é reconfortante e calorosa, Fuuka-san."
212200-81 = ""
212200-83 = ""
212200-84 = "Haruna......"
212200-85 = "Verdadeira gastronomia nada mais é do que agradecer com humildade pelo carinho de quem preparou.#nE eu havia esquecido essa verdade tão elementar."
212200-86 = "O empenho minucioso da Fuuka-san, a dedicação sem medidas da Juri-san......#Apresento minhas mais sinceras e solenes desculpas por todas as ofensas cometidas."
212200-87 = "......Bem, foi por causa do transe da Imperatriz do Trovão, não foi?#Sendo assim, vocês também foram vítimas da história."
212200-88 = "Não usarei circunstâncias externas como muleta para me eximir de culpa."
212200-89 = "Esqueci a nobreza da culinária para tentar enquadrar vocês nos moldes estéreis de uma ditadura."
212200-90 = "Apenas isso já é motivo suficiente para me cobrir de vergonha.#Peço perdão, de todo o coração."
212200-91 = ""
212200-93 = ""
212200-94 = ""
212200-95 = "Aquelas duas tavam assustadoras de tão estranhas."
212200-96 = "......Deu muito medo. Uma Sociedade Gastronômica daquele jeito perde toda a graça."
212200-97 = "Pensei sinceramente que Gehenna tinha entrado num colapso terminal......"
212200-98 = ""
212200-100 = ""
212200-101 = ""
212200-102 = ""
212200-103 = "Perdoem-me por tê-las feito sofrer com tamanha angústia."
212200-104 = ""
212200-106 = ""
212200-107 = ""
212200-108 = "......"
212200-109 = "Pronto, chega de drama! Ficar com cara de enterro não vai adiantar nada!"
212200-110 = "Mas tratem de gravar muito bem o que vou falar agora:"
212200-111 = ""
212200-113 = ""
212200-114 = ""
212200-115 = "Se vocês duas inventarem de surtar desse jeito de novo, NUNCA MAIS cozinho nada pra vocês nesta vida! Fui clara?!"
212200-116 = ""
212200-118 = ""
212200-119 = ""
212200-120 = "Fufufu, essa sim seria uma calamidade existencial irreparável."
212200-121 = "E nós também! Se acontecer de novo, a gente nunca mais sai pra comer juntas!"
212200-122 = "E nem divido meus molhos secretos com você!"
212200-123 = "Minha nossa! Teremos que fortalecer a musculatura espiritual para sermos imunes a qualquer lavagem cerebral futura."
212200-124 = "Sendo assim...... teria mais arroz, por favor?#Afinal de contas, saco vazio não para em pé★"
212200-125 = "Já rapou as três tigelas inteiras?!"
212200-126 = "Saindo mais três no capricho!"
212200-128 = "(Cada uma expressa seu arrependimento à sua maneira, mas a sinceridade toca fundo no coração)"
212200-131 = ""
212200-132 = ""
212200-133 = "......"
212200-134 = ""
212200-139 = ""
212200-140 = ""
212200-141 = "Sena-senpai."
212200-142 = "Ah, é você, Chinatsu. O que a traz aqui?"
212200-143 = "......Como a senhora está se sentindo?"
212200-144 = "Em excelente forma física. Ultimamente não surgiram cadáveres...... digo, pacientes graves por aqui."
212200-145 = "Que bom que――"
212200-146 = "Contudo, o meu íntimo permanece envolto em névoas pesadas."
212200-147 = "......"
212200-148 = "Eu me recordo com nitidez das palavras que proferi a você."
212200-149 = "Que a ofensiva bélica seria um ato médico, que o sangue derramado seria apenas a incisão cirúrgica natural......"
212200-150 = "Eu me prestei ao papel de justificar atrocidades com sofismas repugnantes."
212200-151 = "......Como líder à frente do Clube de Resgate Médico, falhei de forma imperdoável."
212200-152 = "Eu sei muito bem que aquilo não era a voz do seu coração, senpai."
212200-153 = "Mesmo assim. As palavras lançadas ao vento não podem ser recolhidas."
212200-154 = "A grandeza cobra sacrifícios? Que disparate. A medicina jamais pode tratar vidas perdidas como dano colateral aceitável."
212200-155 = "Lutar com todas as forças para estancar até a última gota de sangue inocente: esse sempre foi o nosso verdadeiro dever."
212200-156 = ""
212200-158 = ""
212200-159 = "A senhora sempre colocou esse dever em prática com devoção admirável. E continuará colocando."
212200-160 = "......"
212200-161 = "Eu vi você em combate, Chinatsu."
212200-162 = ""
212200-164 = ""
212200-165 = "Enfrentando a Presidente Hina, empunhando a arma com o coração em prantos."
212200-166 = "Eu vi você caminhando pelo que considerava justo, rebelando-se contra a aberração em que nos tornamos."
212200-167 = "Aquilo......"
212200-168 = "No passado, quando me disse que iria para a Disciplina, julguei com tristeza que tínhamos nos desencontrado em caminhos opostos."
212200-169 = "Mas através deste episódio compreendi:#você se tornou a paramédica de emergência do Comitê de Disciplina para resgatar a mim, que havia perdido o rumo, de volta à razão."
212200-170 = "Muito obrigada. Tenho imenso orgulho de você ser a minha júnior, Chinatsu."
212200-171 = ""
212200-173 = ""
212200-174 = "Você superou tudo o que lhe ensinei e executou o procedimento de socorro mais perfeito de todos."
212200-175 = ""
212200-177 = ""
212200-178 = ""
212200-179 = ""
212200-180 = "......Que alívio imenso. Que bom que a senhora voltou em segurança para nós, senpai."
212200-181 = "Fufufu......"
212200-182 = ""
212200-184 = ""
212200-185 = "Bem, agora que o resgate emergencial foi concluído, precisamos iniciar o protocolo de reabilitação profilática."
212200-186 = "Para evitar que semelhantes distorções mentais se repitam,#pretendo propor uma rotina de checagem médica conjunta entre a Disciplina e o Resgate Médico."
212200-187 = "Levarei a proposta à Presidente Hina. Tenho certeza de que ela receberá com muita alegria."
212200-188 = "......Reitero a minha gratidão por ter conduzido a minha mente de volta ao leito correto."
212200-189 = ""
212200-191 = ""
212200-192 = "Sena-senpai......"
212200-193 = "Muito obrigada...... por ter confiado em mim até o fim."
212200-199 = ""
212200-200 = "Mais um poço perfurado no capricho!#Próximo! Cadê o próximo ponto?!"
212200-201 = "Não podemos perder tempo de bobeira!#Águas termais desconhecidas aguardam as nossas brocas!"
212200-202 = "Ficar falando em guerra e invasão foi a maior perda de tempo do universo!#Não tem nada mais valioso nesta vida do que poços termais!"
212200-203 = "Isso aí, falou tudo!!"
212200-204 = ""
212200-206 = ""
212200-207 = ""
212200-208 = "Uauuu! A temperatura tá perfeita e a pressão de vapor tá altíssima! É a melhor água termal do mundo!"
212200-209 = "A chefa tava certíssima nas coordenadas, como sempre!"
212200-210 = "Hahahahaha! Mas é claro. Nós somos plenamente capazes de encontrar água por nossa própria conta."
212200-211 = "......Sendo assim, pode esquecer aquele mapa antigo de vez, Megu."
212200-212 = "Mapa......?#Ah, é mesmo, tinha aquele mapa! Já tinha até esquecido!"
212200-213 = "Hahaha. Isso apenas prova o quão descartável ele era. Não precisa se preocupar com ele."
212200-214 = "Hum...... mas falando nisso, me veio uma dúvida agora......#Por que será que eu tava com aquela empolgação toda pra guerra?"
212200-215 = "Aquela história de lutar pela grandeza de Gehenna......"
212200-216 = "Aquilo foi――"
212200-217 = "Mas quer saber? Dane-se! Não ligo a mínima!"
212200-218 = "Eu não entendo de política complicada e aquilo não dava frio na barriga nenhum!"
212200-219 = ""
212200-221 = ""
212200-222 = "Pois é. Não havia graça ou encanto algum naquilo. Absolutamente nenhum."
212200-223 = "Com a nossa chefa no comando, tamo seguras pro que der e vier!"
212200-224 = "......"
212200-225 = "Megu. Não precisa ficar obedecendo cegamente a tudo o que eu digo."
212200-226 = "Ué? Por que não?"
212200-227 = "Se você apenas me obedecer sem pensar, não haverá diferença alguma daquele transe mental de antes......"
212200-228 = ""
212200-230 = ""
212200-231 = "O que realmente importa é o que a própria Megu quer fazer da vida."
212200-232 = "Poxa, chefa, você já me disse isso um milhão de vezes!"
212200-233 = "Não precisa esquentar essa cabecinha nem um pouco!"
212200-234 = ""
212200-236 = ""
212200-237 = "O que eu mais amo e quero nesta vida é ficar perto de você, chefa! Perto de todo mundo do clube!"
212200-238 = "Cavar poços termais juntas, comer coisas gostosas, construir cabanas de madeira!#Eu amo essa rotina e quero viver assim pra sempre!"
212200-239 = ""
212200-241 = ""
212200-242 = ""
212200-243 = "Hahaha! Hahahahahaha!"
212200-244 = "Ouvindo uma declaração dessas, não tenho outra escolha senão realizar todos os seus desejos!"
212200-245 = "Ebaaa! Muito obrigada por tudo, chefa!"
212200-246 = ""
212200-250 = ""
212200-251 = ""
212200-252 = "Falou bonito demais, encarregada Megu!#Meninas! Quem somos nós――?!"
212200-253 = "DEPARTAMENTO DE FONTES TERMAIS!!"
212200-254 = "Onde houver água termal, nós estaremos lá!"
212200-255 = "E onde NÃO HOUVER água termal, nós abriremos caminho na dinamite!!"
212200-256 = "Bora pro próximo ponto! Temos que perfurar mais cinco nascentes antes do pôr do sol! Nem um segundo a perder!"
212200-257 = ""
212200-259 = ""
212200-260 = ""
212200-261 = ""
212200-262 = ""
212200-263 = "......Chefa? Não vem com a gente?"
212200-264 = "Hum? Ah, sim. Tenho algumas coisinhas para matutar na cabeça.#Podem ir descendo na frente, já alcanço vocês."
212200-265 = "Tá bom! Mas desce com cuidado, a trilha é escorregadia!"
212200-266 = "Pode deixar, obrigada pela preocupação, Megu. Até daqui a pouco."
212200-267 = ""
212200-269 = ""
212200-270 = "Muito bem......"
212200-271 = "Essa conspiração toda...... teve um gosto amargo e nostálgico demais."
212200-272 = "O método cirúrgico, o modus operandi...... lembrava descaradamente aquela gente."
212200-273 = "Partindo da premissa de que aqueles canalhas estão se mexendo nas sombras――"
212200-274 = "Hummm...... o meu próprio pescoço corre sério perigo."
212200-275 = "Há peças demais fora do lugar, um quebra-cabeça espinhoso de engolir."
212200-276 = "Meu faro apita dizendo que serei arrastada para uma encrenca colossal em breve......"
212200-277 = ""
212200-280 = "Uau, que frio cortante! Deve ser por estarmos no topo da serra."
212200-281 = "Hah! Não importa o quão gélido seja o vento: ele jamais resfriará o fervor que borbulha nas profundezas da terra!"
212200-282 = ""
212200-284 = ""
212200-285 = "Sim, exatamente."
212200-286 = ""
212200-288 = ""
212200-289 = "Se essa for a intenção de vocês...... sejam muito bem-vindos."
212200-290 = "Senhores do [ruby=Bodensatz]Bodensatz[/ruby]."
212200-292 = "Próximo Episódio;Chamas Eternas"
