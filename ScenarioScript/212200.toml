[translation]
212200-1 = "Эпизод 20;Что останется"
212200-3 = ""
212200-4 = "Ну вот. Мисо-суп и жареная сайра."
212200-5 = ""
212200-7 = ""
212200-8 = ""
212200-9 = ""
212200-10 = "Ничего себе! Настоящий обед из нескольких блюд от самой шеф-повара Фууки!"
212200-11 = "М-м-м, выглядит объедением!"
212200-12 = ""
212200-14 = ""
212200-15 = ""
212200-16 = "Фу-фу, спасибо, Фуука."
212200-17 = "Моё почтение повару."
212200-18 = "...Зачем я вообще это делаю?"
212200-19 = "Уф. Просто не смогла пройти мимо голодного человека."
212200-20 = "Ты правда такая добрая, Фуука!"
212200-21 = "Не хватит ли твоей доброты ещё на три миски риса? Я только разогрелась!"
212200-22 = "Уже несу! Большие порции, да?"
212200-23 = ""
212200-24 = ""
212200-25 = ""
212200-26 = "...М-м-м, вкусно!"
212200-27 = ""
212200-29 = ""
212200-30 = "А? Изуми, ты забыла свою бутылочку с особым соусом?"
212200-31 = "Я думала о нём, но решила, что никакого дополнительного соуса не нужно!"
212200-32 = "Хочу насладиться блюдом именно таким, каким его задумала Фуука."
212200-33 = "Ух ты... Ты что, повзрослела? Может, и с другими блюдами попробуем ценить их чистый вкус?"
212200-34 = ""
212200-36 = ""
212200-37 = "Хи-хи, хорошая идея! Тогда начнём с маринованного имбиря и арахисовой пасты..."
212200-38 = "К-кажется, мы немного не туда свернули..."
212200-39 = ""
212200-41 = ""
212200-42 = "..."
212200-43 = ""
212200-45 = ""
212200-46 = ""
212200-47 = ""
212200-48 = "Харуна, сегодня у тебя манеры за столом ещё безупречнее, чем обычно."
212200-49 = "...И почему ты ТАКАЯ тихая? Мне стоит волноваться?"
212200-50 = ""
212200-52 = ""
212200-53 = "...Рыбья кожа поджарена неравномерно. И кусочки тофу нарезаны неровно."
212200-54 = "Ну... Я же готовила на скорую руку..."
212200-55 = "Стоп, нет-нет. Почему я вообще оправдываюсь?"
212200-56 = "Я старалась, чтобы накормить вас. Если вам что-то не нравится, тогда..."
212200-57 = ""
212200-59 = ""
212200-60 = "Это поистине великолепная трапеза."
212200-61 = ""
212200-63 = ""
212200-64 = ""
212200-65 = ""
212200-66 = ""
212200-67 = "...Я размышляла над вашим блюдом, Фуука."
212200-68 = "И с каждой новой ложкой в голове возникала новая мысль."
212200-69 = "Мой холодный, взыскательный взгляд невольно оценивает ваши старания в поисках безупречного качества."
212200-70 = "..."
212200-71 = ""
212200-73 = ""
212200-74 = ""
212200-75 = ""
212200-76 = "Эта моя жалкая душа, столь жестокая в последнее время..."
212200-77 = ""
212200-79 = ""
212200-80 = "Фуука, ваша еда согревает сердце настолько, что способна растопить её до самой глубины."
212200-81 = ""
212200-83 = ""
212200-84 = "Харуна..."
212200-85 = "Я забыла самую суть пути гурмана: благодарность за доброту тех, кто нас кормит."
212200-86 = "Забота Фууки и усердие Джури... Я должна перед вами извиниться. За то, что забыла столь простые истины."
212200-87 = "...Вы же находились под влиянием Императора-тирана. В каком-то смысле вы сами стали жертвами."
212200-88 = "Нет... Мы не можем прятаться за этим оправданием. Только не в таком деле."
212200-89 = "Харуна права. Мы принесли принуждение и контроль туда, где должно царить наслаждение едой, и проявили неуважение к вашей готовке."
212200-90 = "Мы обязаны загладить вину. Перед всеми. Так что... простите нас."
212200-91 = ""
212200-93 = ""
212200-94 = ""
212200-95 = "Теперь, когда всё позади... Вы обе тогда ужасно меня напугали."
212200-96 = "Угу. Было страшно. Очень страшно! То Общество гурманов совсем не радовало."
212200-97 = "Я... так боялась, что с нами и вправду случится что-то ужасное."
212200-98 = ""
212200-100 = ""
212200-101 = ""
212200-102 = ""
212200-103 = "Прошу прощения у каждой из вас за мои проступки."
212200-104 = ""
212200-106 = ""
212200-107 = ""
212200-108 = "..."
212200-109 = "Так! Всё! Хватит себя жалеть из-за того, в чём вы даже не виноваты."
212200-110 = "Я просто вас предупрежу."
212200-111 = ""
212200-113 = ""
212200-114 = ""
212200-115 = "Если ещё хоть раз так поступите, я больше никогда для вас не приготовлю!"
212200-116 = ""
212200-118 = ""
212200-119 = ""
212200-120 = "Фу-фу, не хотелось бы испытать на себе такое наказание."
212200-121 = "Именно! И за обедом больше не сможете сидеть с нами!"
212200-122 = "Даже не думайте так делать! Иначе я больше не поделюсь своим особым соусом!"
212200-123 = "Раз уж вы начали так угрожать, пожалуй, стоит потренировать мозг сопротивляться промыванию."
212200-124 = "Хм... Думаю, для этого нужна ещё одна миска! На голодный желудок ведь не позанимаешься! ★"
212200-125 = "Ты уже и предыдущую доела?!"
212200-126 = "Фу-фу, без проблем! Сейчас принесу!"
212200-128 = "Каждый по-своему просил у друзей прощения, но искренность чувств ощущалась всякий раз."
212200-131 = ""
212200-132 = ""
212200-133 = "..."
212200-134 = ""
212200-139 = ""
212200-140 = ""
212200-141 = "Сэна."
212200-142 = "Чинацу. Проходи, пожалуйста."
212200-143 = "Сэна, как... ты себя чувствуешь?"
212200-144 = "Лучше не бывает. Да и тру... простите, пациентов в последнее время почти нет."
212200-145 = "Я рада, что..."
212200-146 = "...Хотела бы я так сказать. Но на душе у меня всё ещё тяжело."
212200-147 = "..."
212200-148 = "Я помню всё, что говорила тебе, Чинацу."
212200-149 = "С каким равнодушием рассуждала о войне и операциях..."
212200-150 = "Помню оскорбительную софистику, которую пыталась тебе навязать."
212200-151 = "Принимая эту должность, я поклялась защищать жизнь. А вместо этого поддержала массовое убийство мирных жителей и студентов. Как после этого с гордостью продолжать свою работу?"
212200-152 = "Но ты ведь говорила не от себя! Я это знаю!"
212200-153 = "Намерения не отменяют последствий."
212200-154 = "Я считала жертвы необходимой платой за славу... Медик никогда не должен видеть в человеческой жизни всего лишь цифру в отчёте."
212200-155 = "Мы сражаемся ради своей клятвы. Отчаянно ищем выход, который обойдётся наименьшей кровью."
212200-156 = ""
212200-158 = ""
212200-159 = "Ты всегда так поступала. И будешь поступать впредь."
212200-160 = "..."
212200-161 = "Я видела, как ты боролась, Чинацу."
212200-162 = ""
212200-164 = ""
212200-165 = "Видела, чего тебе стоило поднять оружие против главы Префектуры Хины."
212200-166 = "Видела твою силу, когда ты встала на защиту своих убеждений."
212200-167 = "Н-Ну..."
212200-168 = "Когда ты подала заявление об уходе ради перехода в Префектуру, мне казалось, что мы прощаемся."
212200-169 = "Но ты принесла дух скорой помощи с собой в Префектуру. И помогла мне вернуться на верный путь, когда я думала, что его уже нет."
212200-170 = "Спасибо. Я горжусь тем, что ты мой младший товарищ, Чинацу."
212200-171 = ""
212200-173 = ""
212200-174 = "Младший товарищ и правда превзошёл наставника. Лучшей медицинской помощи я ещё не видела."
212200-175 = ""
212200-177 = ""
212200-178 = ""
212200-179 = ""
212200-180 = "...Спасибо. Спасибо, что вернулась, Сэна."
212200-181 = "Фу-фу..."
212200-182 = ""
212200-184 = ""
212200-185 = "Теперь, когда эвакуация закончена, нужно перейти к восстановлению."
212200-186 = "Предлагаю нашим организациям провести совместную проверку, чтобы не допустить новых случаев отклонений в поведении старших студентов."
212200-187 = "...Отличная мысль! Уверена, глава Префектуры поддержит. Обязательно ей передам."
212200-188 = "И ещё раз спасибо, что достучалась до моего сердца, когда я отвернулась от тебя, Чинацу."
212200-189 = ""
212200-191 = ""
212200-192 = "Сена..."
212200-193 = "Спасибо... что всегда верила в меня, Сэна."
212200-199 = ""
212200-200 = "Так, куда теперь?!"
212200-201 = "Некогда рассиживаться! Нам ещё горячие источники копать!"
212200-202 = "О чём мы только думали, болтая о войне и завоеваниях? Вот горячие источники — настоящий смысл жизни!"
212200-203 = "Верно! Они прямо сейчас зовут нас!"
212200-204 = ""
212200-206 = ""
212200-207 = ""
212200-208 = "Ух ты! Председатель Касуми вывела нас прямо к отличному горячему источнику!"
212200-209 = "Вода идёт как надо, и температура в самый раз!"
212200-210 = "Ва-ха-ха! Вот именно! И у нас ещё полно работы!"
212200-211 = "Так что можешь забыть о той карте сокровищ, Мегу."
212200-212 = "М-м-м? Какой карте сокровищ?"
212200-213 = "Вот это моя Мегу! Ва-ха-ха!"
212200-214 = "И чего мне вообще такие мысли в голову лезли?"
212200-215 = "Поверить не могу, что хотела сделать что-то полезное для Геенны, да ещё и помогать в ВОЙНЕ."
212200-216 = "Это..."
212200-217 = "Но теперь я совсем такого не хочу!"
212200-218 = "Столько думать — не моё! Особенно о скучных вещах!"
212200-219 = ""
212200-221 = ""
212200-222 = "Вот именно. Никакого веселья в этом нет."
212200-223 = "Нам нужно лишь исполнять приказы председателя Касуми, как всегда!"
212200-224 = "..."
212200-225 = "С одной оговоркой. Не обязательно ВСЕГДА делать В ТОЧНОСТИ то, что я говорю."
212200-226 = "А?"
212200-227 = "Иначе это ничем не отличается от промывания мозгов..."
212200-228 = ""
212200-230 = ""
212200-231 = "Твои желания тоже важны, Мегу."
212200-232 = "Вот это наша председатель Касуми!"
212200-233 = "Хи-хи! Даже не переживай об этом!"
212200-234 = ""
212200-236 = ""
212200-237 = "Я хочу оставаться здесь, с тобой и с потрясающими ребятами из нашего клуба!"
212200-238 = "Мне нравится раскапывать горячие источники, есть вкусную еду и строить здания вместе с друзьями! И я не хочу останавливаться!"
212200-239 = ""
212200-241 = ""
212200-242 = ""
212200-243 = "Ва-ха! Выходит, я зря переживала!"
212200-244 = "Чего бы ты ни захотела, я всегда это устрою, Мегу. Положись на меня!"
212200-245 = "Знаю! Хи-хи. Спасибо, как всегда."
212200-246 = ""
212200-250 = ""
212200-251 = ""
212200-252 = "Всё как сказала капитан Мегу! Народ, напомните-ка, кто мы такие?"
212200-253 = "ОТДЕЛ РАЗРАБОТКИ ГОРЯЧИХ ИСТОЧНИКОВ!!"
212200-254 = "Ва-ха-ха! Где горячий источник, там и мы!"
212200-255 = "Нет, даже если источника нет, мы всё равно там!!"
212200-256 = "Так, народ! Хотим откопать сегодня пять источников — шевелите задницами! Все к следующему месту!"
212200-257 = ""
212200-259 = ""
212200-260 = ""
212200-261 = ""
212200-262 = ""
212200-263 = "Вы... с нами не идёте, председатель?"
212200-264 = "Мне нужно кое-что хорошенько обдумать, так что я пойду в обход, полюбуюсь видами."
212200-265 = "Ладушки! Но там скользкий спуск, так что осторожнее!"
212200-266 = "Ага-ага, спасибо, Мегу. Встретимся там."
212200-267 = ""
212200-269 = ""
212200-270 = "..."
212200-271 = "Всё это... отчего-то кажется таким знакомым..."
212200-272 = "Их методы... вообще всё... Напоминает мне «тех самых»..."
212200-273 = "Если они снова зашевелились..."
212200-274 = "Главное, опасность грозит и мне. Та-дам."
212200-275 = "А у меня и без того забот по горло! Что делать? Что же де-е-елать?"
212200-276 = "*Вздох* Да уж, ветер явно дует не в мою сторону."
212200-277 = ""
212200-280 = "Ого, как же холодно в горах!"
212200-281 = "И что с того? Ни одна горная вершина не остудит пыл страсти, кипящей в наших душах!"
212200-282 = ""
212200-284 = ""
212200-285 = "Ва-ха! Вот именно! Нас не охладить!"
212200-286 = ""
212200-288 = ""
212200-289 = "Ну что ж, теперь твоя очередь."
212200-290 = "Проклятые Бодензац."
212200-292 = "Следующий эпизод;Неугасимое"
