[translation]
13420-1 = "Эпизод 42;Эпилог 1"
13420-2 = "Доброе утро, Сенсей!"
13420-3 = "Сегодня у Комитета по выплате долга Абидоса снова насыщенный день."
13420-4 = "...Что? Вас только что накрыло дежавю?"
13420-5 = "Ха-ха... Вот как?"
13420-6 = "Оглядываясь назад, кажется, будто с того момента, когда мы спасли похищенную Хошино, прошло невероятно много времени. Хотя на самом деле не так уж и много..."
13420-7 = "Вы тоже так думаете, Сенсей? Не только я?"
13420-8 = "Ха-ха... Рада слышать."
13420-9 = ""
13420-11 = ""
13420-13 = ""
13420-14 = "*вздох* Мы вернулись."
13420-15 = "Сэрика...? И Широко? Вы с головы до ног в грязи. Где вы были?"
13420-16 = "У оазиса..."
13420-17 = "Серьёзно?! Вы всё ещё не сдались?"
13420-18 = "Есть небольшой шанс, что взрыв уничтожил не всё! Я подумала: если нас двое и мы будем копать очень-очень глубоко..."
13420-19 = "Восемь метров спустя — ничего."
13420-20 = "Всё и правда взорвалось... Десять миллионов йен за сто граммов..."
13420-21 = ""
13420-23 = ""
13420-25 = "Хочешь знать, почему у вас ничего не получилось, Сэрика?"
13420-26 = "Хошино?!"
13420-27 = "Мы упустили какое-то условие?!"
13420-28 = ""
13420-30 = ""
13420-32 = "Потому что вы пошли не в купальниках."
13420-33 = "Кто вообще так думает?! Мы не такие, как ты с Юмэ!"
13420-34 = "Ты правда думаешь, оазис вдруг взорвётся и нас обольёт водой? Зачем готовиться к невозможному? Оазисы появляются из дождя, а не из грунтовых вод!"
13420-35 = ""
13420-37 = ""
13420-38 = "Широко. Если ты не перестанешь строить это лицо «Сэрика знает элементарные факты, и я так ею горжусь»..."
13420-39 = "Факты ты знаешь правильно, Сэрика, но забываешь об истории! О традициях! Их тоже нужно уважать, не думаешь?"
13420-40 = "В следующий раз надень купальник. Хех. Это приказ председателя студсовета, ясно?"
13420-41 = "Ух... Она пользуется должностью только в таких ситуациях..."
13420-42 = ""
13420-44 = ""
13420-45 = "Угу. Я рада, что Хошино наконец приняла должность председателя студсовета."
13420-46 = "Потребовалась целая череда событий, но она наконец заняла место, которое так долго пустовало."
13420-47 = "Мы двигаемся вперёд маленькими осторожными шагами. Но ощущаются они довольно значительными, правда?"
13420-48 = "Хм? Я?"
13420-49 = "Ха-ха... Я попробовала пару дней, но такая властная роль мне совсем не подходит."
13420-55 = "Этого достаточно, председатель?"
13420-56 = ""
13420-58 = ""
13420-59 = "Нет. Даже близко нет. Не хочу, чтобы от работы Тирана-Императора остался хоть один осколок."
13420-60 = "П-Поняла!"
13420-62 = "Несите ещё взрывчатку!"
13420-63 = ""
13420-65 = ""
13420-66 = "..."
13420-67 = ""
13420-69 = ""
13420-71 = ""
13420-72 = ""
13420-73 = "Председатель Общества Пандемониума и глава Дисциплинарного комитета разобрались со следами прежнего лидера Геенны, оставшимися в Долине председателей студсовета."
13420-74 = "Я слышал, эти двое как огонь и вода — вообще никогда не ладят. Но удивительно, здесь они ни разу не поссорились."
13420-75 = "Они мало что рассказали, так что подробностей я не знаю... Интересно, что случилось в их прошлом?"
13420-77 = "Что касается президента Кайзер, он заперся в больнице и нигде не показывается."
13420-78 = "Может, он потерял цель после того, как мы уничтожили Железнодорожную пушку, за которой он так отчаянно гонялся?"
13420-79 = "Но поскольку Абидос всё ещё должен Кайзер, нам нужно внимательно следить за их движениями."
13420-82 = "Я вернулась! ♧"
13420-83 = "О, Нономи. Как прошло?"
13420-84 = "Восстановление железной дороги завершилось успешно! Осталось только провести испытания!"
13420-85 = "Три участка смогут начать работу уже на следующей неделе!"
13420-86 = "О-о-о! Наконец-то!"
13420-87 = "Хех. Быстро работают."
13420-88 = ""
13420-90 = ""
13420-91 = "А, ещё у меня хорошие новости!"
13420-92 = "После последних событий Нефтис решила снова начать инвестировать в район Абидоса."
13420-93 = "Пока это лишь небольшой проект совместно с академией Хайлендер: соединить ранее изолированную железную дорогу Абидоса с несколькими маршрутами Транс-пустынной железной дороги..."
13420-94 = "...но надеюсь, это улучшит транспорт во всём районе. Возможно, даже привлечёт больше туристов."
13420-97 = "Отлично! Двигается!"
13420-98 = "Что там внутри поезда? Есть проблемы?"
13420-101 = "Здесь всё нормально!"
13420-103 = "(ёрзает) В-Всё работает как надо?"
13420-104 = "Более-менее? CCC было почти всё равно, зато Надзорный офис неожиданно активно помогал, поэтому всё прошло довольно гладко."
13420-105 = "Этот проект совсем не прибыльный... так что если что-то пойдёт не так, мы можем—"
13420-106 = "Эй-эй, не сглазь."
13420-107 = "Нам всего-то нужно восстановить центральную железную дорогу Абидоса к зиме — и ваш бизнес не уйдёт в минус!"
13420-111 = "..."
13420-112 = "Надзиратель?"
13420-113 = "Да?"
13420-114 = "Эта средняя школа закрылась довольно давно... У вас здесь дела?"
13420-115 = "Не особо. Просто она попалась мне на глаза, и я зашла."
13420-116 = "Ну, в Абидосе заброшенных школ на выбор хватает."
13420-117 = "Но вернёмся к делу: не могли бы вы отправиться на объект? Сейчас он под юрисдикцией CCC, и... ну..."
13420-118 = "...Опять близняшки?"
13420-119 = "Д-Да. Никто больше не умеет справляться с этими офицерами..."
13420-120 = ""
13420-122 = ""
13420-123 = "А-Ах?! П-Подождите! Надзиратель? Подождите меня!"
13420-124 = ""
13420-126 = ""
13420-129 = ""
13420-134 = "Не знаю, из-за этого проекта или нет, но район Абидоса в последнее время начал оживать."
13420-135 = "Центр Абидоса, долгое время бывший городом-призраком, увидел всплеск новых предприятий."
13420-136 = "...Хотя не все из них действительно новые."
13420-137 = "Смотри сюда. Мы уже размещаем рекламу в этом переходе."
13420-138 = "Ищите другое место. Наш магазин владеет этим участком уже сто лет."
13420-139 = "Смело с твоей стороны нарываться на драку, учитывая, что ты собственный бизнес угробила!"
13420-140 = "Твоя компания тоже разорилась! Ну давай!"
13420-141 = ""
13420-143 = ""
13420-145 = "...Как жалко."
13420-146 = "*вздох* Начинать всё заново в таком месте..."
13420-148 = "Дай мне несколько лет, и я сбегу из этого проклятого района! Клянусь!"
13420-150 = "А что до другой Широко... После инцидента мы её вообще не видели."
13420-151 = "Вы тоже ничего не смогли найти, Сенсей?"
13420-152 = "[s] «Нет... Я перепробовал всё.»"
13420-153 = "Понятно... М-м..."
13420-154 = "..."
13420-155 = ""
13420-157 = ""
13420-158 = "Ну, говорят, отсутствие новостей — хорошая новость! У неё во всём гораздо больше опыта, чем у нас, так что уверена, она там отлично справляется!"
13420-159 = "Да... Уверена, с ней всё хорошо."
13420-160 = ""
13420-162 = ""
13420-164 = "Да. Когда-нибудь наши пути снова пересекутся!"
13420-165 = "Я даже не успела её поблагодарить..."
13420-169 = ""
13420-170 = ""
13420-173 = "Следующий эпизод;Эпилог 2"
