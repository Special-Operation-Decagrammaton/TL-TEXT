[translation]
13420-1 = "Episódio 42;Epílogo (1)"
13420-2 = "Bom dia, Sensei!"
13420-3 = "Hoje o dia do Comitê de Contramedidas de Abydos está agitado mais uma vez."
13420-4 = "...De alguma forma, sinto que já disse algo parecido antes."
13420-5 = "A-Ahaha..."
13420-6 = "Parece que o dia em que fomos resgatar a Hoshino-senpai já foi há tanto tempo."
13420-7 = "...Você também sente isso, Sensei?"
13420-8 = "Fufu, então não era só comigo."
13420-14 = "...Haa, voltei."
13420-15 = "O que aconteceu para você voltar toda coberta de areia?"
13420-16 = "...Fui dar uma passada no oásis."
13420-17 = "Hein, você não tinha desistido?"
13420-18 = "Se a gente cavasse mais fundo, podia ter sobrado alguma coisa, né."
13420-19 = "Cavamos 8 metros, mas não saiu nada."
13420-20 = "Será que acabou tudo mesmo...?"
13420-25 = "Fufufu~."
13420-26 = "Hoshino-senpai?!"
13420-27 = "Você sabe de alguma coisa?"
13420-32 = "Fufu... Isso foi porque vocês não estavam de maiô."
13420-33 = "Dá para não misturar as coisas?!"
13420-34 = "Para começo de conversa, nem ia jorrar com toda aquela força, né!"
13420-38 = "...Shiroko-senpai, diz alguma coisa também!"
13420-39 = "Ora~, a gente tem que valorizar a história — ou melhor, a tradição — não acha?"
13420-40 = "Por isso, da próxima vez vão de maiô!#nÉ uma ordem da presidente do conselho estudantil~."
13420-41 = "Usar a autoridade de presidente do conselho estudantil só nessas horas..."
13420-45 = "A Hoshino-senpai finalmente aceitou assumir como presidente do conselho estudantil."
13420-46 = "Será que ela conseguiu colocar os sentimentos em ordem?"
13420-47 = "É um passo pequeno, mas acho que é um passo muito importante para nós."
13420-48 = "...Eu?"
13420-49 = "Ahaha... O cargo de presidente do conselho estudantil não combina comigo."
13420-55 = "Assim está bom?"
13420-59 = "...Não, ainda não.#nFaçam isso direito, até o fim!"
13420-60 = "S-Sim!"
13420-62 = "Tragam mais explosivos!"
13420-66 = "..."
13420-73 = "A presidente da Sociedade Pandemônio e a Chefe do Comitê Disciplinar deram um fim ao legado do \"Imperador do Trovão\"."
13420-74 = "Ouvi dizer que as duas se davam como cão e gato,#nmas não pareceu nem um pouco."
13420-75 = "Será que houve algum motivo especial...?"
13420-77 = "Parece que o Presidente da Kaiser está no hospital desde aquilo tudo."
13420-78 = "Será que ele perdeu o propósito...?"
13420-79 = "...De qualquer forma, ainda não terminamos de pagar a dívida,#nentão pretendemos continuar em alerta."
13420-82 = "Voltei~♧"
13420-83 = "Nonomi-chan, como foi?"
13420-84 = "A restauração da linha ferroviária foi concluída.#nAgora só falta a operação de teste!"
13420-85 = "Até a semana que vem, já será possível operar em três trechos."
13420-86 = "Finalmente?!"
13420-87 = "Parece que está tudo indo bem~."
13420-91 = "Ah, também tenho uma boa notícia!"
13420-92 = "Parece que a Nephthys vai voltar a investir no Distrito Autônomo de Abydos."
13420-93 = "Bem, por enquanto eles só anunciaram que vão retomar parcialmente o projeto da ferrovia transdesértica#nem parceria com a Academia Ferroviária Highlander..."
13420-94 = "Se a rede de transporte se desenvolver assim, talvez mais pessoas comecem a circular por aqui."
13420-97 = "Certo, vamos ligar."
13420-98 = "Como está aí dentro?"
13420-101 = "Parece estar tudo em ordem."
13420-103 = "Será que vai dar tudo certo mesmo...?"
13420-104 = "Bom, acho que funcionar, vai sim.#nA Sala de Supervisão arranjou mecânicos excelentes para nós."
13420-105 = "Mas se não der lucro, desta vez nós..."
13420-106 = "O que você está dizendo antes mesmo de começar?!"
13420-107 = "A Linha Central de Abydos também está prevista para ser restaurada no próximo inverno,#nentão com certeza vai dar certo!"
13420-111 = "..."
13420-112 = "Supervisora?"
13420-113 = "...Ah."
13420-114 = "Será que este lugar era uma escola de ensino fundamental antigamente?"
13420-115 = "...Não é nada. Vamos."
13420-116 = "Se você diz, tudo bem...#nBom, existem muitos lugares assim em Abydos, afinal."
13420-117 = "E parece que o CCC está causando confusão de novo."
13420-118 = "...Aquelas gêmeas de novo?"
13420-119 = "Sim, chegou um pedido de reforço."
13420-123 = "Ah... Não me deixe para trás, Supervisora!"
13420-134 = "—E, desse jeito, a cidade está recuperando o movimento aos poucos."
13420-135 = "Até abriram lojas novas."
13420-136 = "...Embora muitas das pessoas pareçam bem familiares."
13420-137 = "Ei, este terreno é onde vai ficar a placa da nossa loja!"
13420-138 = "Nada disso, este terreno é nosso há 100 anos!"
13420-139 = "Do que está falando, se vocês acabaram falindo no final?"
13420-140 = "Você também não está na mesma?!"
13420-145 = "...Bando de patéticos."
13420-146 = "Ter que recomeçar em uma rua comercial como esta..."
13420-148 = "Vou fazer esta loja crescer rapidinho."
13420-150 = "Quanto à outra Shiroko-san...#nPerdemos totalmente o contato com ela desde então."
13420-151 = "Você também não sabe onde ela está, Sensei?"
13420-152 = "[s] \"Desculpa.\""
13420-153 = "Entendi..."
13420-154 = "..."
13420-158 = "Bom, dizem que falta de notícias é boa notícia, né!"
13420-159 = "...É verdade."
13420-164 = "Com certeza vamos nos encontrar com ela de novo um dia, não é?"
13420-165 = "Afinal, nem conseguimos agradecer direito ainda."
13420-173 = "Próximo;Epílogo (2)"
