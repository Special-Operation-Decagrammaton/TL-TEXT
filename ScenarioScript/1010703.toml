[translation]
1010703-1 = "Интервью секретаря"
1010703-2 = "Вскоре после того, как я получил сообщение от Чиаки..."
1010703-6 = ""
1010703-7 = "Йохо! Привет, Сенсей!"
1010703-8 = "Я принесла подарок за подписку, как и обещала!"
1010703-9 = "Ну как? Супер-супер-супер-захватывающе, правда?"
1010703-10 = "[s] «Приве-е-ет, Чиаки...»"
1010703-11 = "А?! Почему вы так устало выглядите, Сенсей?"
1010703-12 = "Вы же не заболели или что-то такое?"
1010703-13 = ""
1010703-16 = "Вы... случайно не всю ночь работали?"
1010703-17 = "В таком случае... отлично!"
1010703-18 = "[s] «А-а?»"
1010703-19 = "Дело в том... Та-дам! Подарок за подписку на «Еженедельник Общества Пандемониума» специально для Сенсея!"
1010703-20 = "Загляните в конверт. Сами увидите!"
1010703-21 = "Ага! Вот, открывайте!"
1010703-22 = "[s] Открыть конверт."
1010703-24 = "[ns] «Разве это не...?»"
1010703-25 = "Ага! Бесплатный купон на десертный шведский стол. На двоих!"
1010703-26 = "Когда устаёшь, нет ничего приятнее сладкого десерта."
1010703-27 = "Я знаю по себе: когда выматываюсь после редактирования «Еженедельника Общества Пандемониума», всегда иду за сладостями!"
1010703-28 = "Так что прямо сейчас это идеальный подарок для вас!"
1010703-29 = "[s] «Чиаки... Я так тронут!»"
1010703-30 = "Хи-хи, не стоит благодарности."
1010703-31 = "Работа важна, но достаточно отдыхать тоже важно."
1010703-32 = "Так что... почему бы не воспользоваться им прямо сейчас?"
1010703-33 = "[s] «Но у меня ещё осталась работа...»"
1010703-34 = "Ну, с ней ведь будет проще справиться, если у вас станет больше сил, правда?"
1010703-35 = "«Шаг назад, два вперёд», верно?"
1010703-36 = "Погрузитесь в эти супер-супер-супер-сладкие десерты хотя бы ненадолго!"
1010703-37 = "[s] «М-Может, и правда?»"
1010703-38 = "Конечно!"
1010703-39 = "Идите за мной. Я вас проведу!"
1010703-41 = "Ого! Тут всё буквально пропитано сладким ароматом! Слюнки текут, правда, Сенсей?"
1010703-42 = "Хочу скорее приступить!"
1010703-43 = "Добро пожаловать! Столик на двоих?"
1010703-44 = "Агааа!"
1010703-45 = ""
1010703-46 = "[ns] «Вот купон.»"
1010703-47 = "Поняла!"
1010703-48 = "Я провожу вас к столу."
1010703-50 = ""
1010703-51 = "...Вот и всё объяснение. Есть вопросы?"
1010703-52 = "Нет, всё поня— А!"
1010703-53 = "Можно я сделаю репортаж об этом месте и напишу статью?"
1010703-54 = "Здесь такая уютная атмосфера и столько разных десертов. Это прямо моё место!"
1010703-55 = "Если это место попадёт в «Еженедельник Общества Пандемониума», ему ещё и реклама будет!"
1010703-56 = "А, если так, конечно, пожалуйста!"
1010703-57 = "Ура! Отлично! Спасибо!"
1010703-58 = "Тогда приятного десерта."
1010703-59 = ""
1010703-61 = ""
1010703-62 = "Теперь я полностью готова к главной статье следующего выпуска!"
1010703-63 = "И подумать только, всё началось с десертного кафе, куда я заглянула случайно. Вот что значит блестящий нюх секретаря-репортёра-редактора-издателя!"
1010703-64 = "Тут написано, что у них больше ста видов десертов! Если я напишу отзыв на каждый..."
1010703-65 = "...«Еженедельник Общества Пандемониума» может стать бестселлером!"
1010703-66 = "[s] «Думаешь, осилишь все сто десертов за один раз?»"
1010703-67 = ""
1010703-69 = ""
1010703-70 = "А?! Я об этом не подумала! Мой предел — где-то пять макаронов!"
1010703-71 = "Ух... Ну, тогда так не получится..."
1010703-72 = "А-ха-ха... Эм, Сенсей... Мне неловко просить об этом, ведь это ваш подарок за подписку, но..."
1010703-73 = "[s1] «Я помогу тебе.»\n[s2] «Мне просто нужно всё попробовать и рассказать, что думаю, верно?»"
1010703-76 = "Ух, да, спасибо..."
1010703-77 = "Давайте разделим их, чтобы ничего не повторялось..."
1010703-79 = ""
1010703-80 = "...Так, дальше сфотографируем этот манговый тарт и..."
1010703-81 = ""
1010703-83 = ""
1010703-84 = "Скажите «а-а», Сенсей!"
1010703-85 = "[ns3] Открыть рот и сказать «а-а».\n[ns4] Взять тарт у Чиаки рукой."
1010703-87 = ""
1010703-88 = "Ага, отлично!"
1010703-89 = "Теперь расскажите мне про этот тарт..."
1010703-90 = ""
1010703-95 = ""
1010703-96 = "Ну как? Как вам?"
1010703-97 = "[s] «Эм... Он сладкий и...»"
1010703-98 = "И?"
1010703-99 = "[s] «Сладкий и вкусный?»"
1010703-100 = "Но про то вишнёвое печенье вы сказали почти то же самое!"
1010703-101 = "А мы только на десятом..."
1010703-102 = "Хм, не слишком ли много мы на себя взяли...?"
1010703-103 = "[s] «Физически это и правда тяжеловато...»"
1010703-104 = "Эх, а я так хотела сделать большой материал об этом месте..."
1010703-105 = ""
1010703-107 = ""
1010703-108 = "...Ага!"
1010703-109 = "Тогда можно попросить помочь остальных посетителей!"
1010703-110 = "Наверняка многие захотят попробовать другие десерты!"
1010703-111 = "[s] «И так можно.»"
1010703-112 = ""
1010703-115 = "Смотрите, вон компания из двух человек, прямо как мы!"
1010703-117 = ""
1010703-118 = ""
1010703-120 = "[ns] «Мы уверены, что это хорошая идея?»"
1010703-122 = ""
1010703-123 = "Ну, мы ведь хотим охватить как можно больше десертов, да?"
1010703-124 = "Уверена, если я попрошу, они не будут против помочь!"
1010703-125 = ""
1010703-127 = ""
1010703-128 = ""
1010703-129 = "Здравствуйте!"
1010703-130 = "А?"
1010703-131 = "Я делаю репортаж для «Еженедельника Общества Пандемониума». Можно задать вам несколько вопросов?"
1010703-132 = "Вы не видите, что мы едим?"
1010703-133 = "Вижу! Именно поэтому и спрашиваю ВАС!"
1010703-134 = "А-А?"
1010703-135 = "Не расскажете, какой на вкус этот парфе?"
1010703-136 = "Н-Ну, сладкий, очевидно."
1010703-137 = "Сладкий! Отлично!"
1010703-138 = "Сладкий как шоколад? Или сладкий как ананас?"
1010703-139 = "А-А? Разве это разная сладость?"
1010703-140 = "Конечно! Шоколад тает во рту. А ананас ВЗРЫВАЕТСЯ вкусом!"
1010703-141 = "Эм, я бы, наверное, выбрала другое слово, но да, понимаю."
1010703-142 = "Конечно понимаете! Потому что знаете свои вкусы!"
1010703-143 = "А теперь поговорим об этом печенье."
1010703-144 = "Хотите кусочек?"
1010703-145 = "Конечно! Я только немного откушу и..."
1010703-146 = ""
1010703-147 = ""
1010703-150 = "Ау! Оно острое!"
1010703-151 = "А-ха-ха! Ага, туда добавляют острый соус. Нас в первый раз тоже нехило прихватило."
1010703-152 = "Вот, хотите молока?"
1010703-153 = ""
1010703-155 = ""
1010703-156 = "Ух... Что ж... это был новый опыт! По крайней мере, теперь есть о чём написать!"
1010703-157 = "Попробуйте эти макароны. Они очень вкусные."
1010703-158 = ""
1010703-160 = ""
1010703-161 = "[ns] «(Она подружилась с ними за считаные минуты...)»"
1010703-162 = ""
1010703-163 = ""
1010703-164 = ""
1010703-165 = ""
1010703-167 = "...Ого, как быстро летит время! Жаль, сегодня мы не смогли пройти все сто!"
1010703-168 = "Зато я наелась под завязку! Кажется, столько десертов за раз я ещё никогда не ела..."
1010703-169 = "Что ж, благодаря вам и всем остальным получится отличная статья!"
1010703-170 = "Сама я бы не осилила даже четверти этих сладостей!"
1010703-171 = "Теперь я смогу сделать «Еженедельник Общества Пандемониума» ещё слаще!"
1010703-172 = "А главное, всегда приятно заводить новых друзей!"
1010703-173 = "[s] «Ты про учеников, которые помогали тебе с дегустацией?»"
1010703-174 = "Ага!"
1010703-175 = "Они оба сказали, что подпишутся!"
1010703-176 = "И я ещё сфотографировалась с ними!"
1010703-177 = "Если посмотреть здесь в камере..."
1010703-178 = ""
1010703-180 = ""
1010703-181 = "А-А?"
1010703-182 = "[s] «Все фотографии... размытые.»"
1010703-183 = "Д-Да, вы правы... И не только фотографии с ними, но даже снимки десертов, которые я собиралась поставить на обложку...!"
1010703-184 = "Что же делать...?"
1010703-185 = "...Ну, что есть, то есть!"
1010703-186 = "Похоже, придётся начать всё сначала!"
1010703-187 = "[s] «Н-Начать сначала?!»"
1010703-188 = "Именно! Ради «Еженедельника Общества Пандемониума»! Ради журналистики, от которой глаза на лоб полезут!"
1010703-189 = "К счастью, у меня осталось ещё несколько подарочных купонов за подписку, так что тут проблем нет!"
1010703-190 = "Тогда я пошла!"
1010703-191 = ""
1010703-193 = ""
