[translation]
10037050-1 = "Эпизод 5;Облака не знают, что их разрывают"
10037050-3 = "[ns] «Черино и Марина легли спать раньше?»"
10037050-4 = "Да. Особенно Великий Вождь Черино выглядела очень уставшей."
10037050-5 = "Неудивительно, учитывая насколько плотным был её график."
10037050-6 = "А? Ты хочешь знать, устала ли я?"
10037050-7 = "Беспокоишься обо мне? Спасибо. Хи-хи."
10037050-8 = "Совру, если скажу, что не устала... Думаю, мне нужно немного привести мысли в порядок."
10037050-9 = "[s] «Ты переживаешь, что у встречи по обмену есть скрытая цель?»"
10037050-10 = "Хм-м, интересно, что бы это могло быть..."
10037050-11 = ""
10037050-13 = "Если честно, у меня есть предположение о намерениях президента."
10037050-14 = "Хотя узнать, верно ли оно, у меня никак не получится."
10037050-15 = "[s] «Я всё ещё не могу понять.»"
10037050-18 = "Вот как? Хи-хи! Ну, если я права, президент и не стала бы особенно из-за этого переживать."
10037050-19 = "[s] «Что ты думаешь о Шаньхайцзине, Томоэ?»"
10037050-20 = "Ох, надо же. Теперь ты звучишь прямо как одна из студентов Шаньхайцзина."
10037050-21 = "Наверное, раз ты находишься в Шаньхайцзине по просьбе президента, ничего не поделаешь. Ха-ха..."
10037050-22 = "Это правда. Шаньхайцзин... прекрасен."
10037050-25 = "Он впечатляет своей историей... А главное, здесь оказалось столько удивительных вещей."
10037050-26 = "И ещё интереснее то, что сами студенты Шаньхайцзина даже не считают их какими-то скрытыми жемчужинами."
10037050-27 = "[s] «Можешь немного объяснить, что имеешь в виду?»"
10037050-30 = "Вот как это выглядит, Сенсей."
10037050-31 = "Секреты существуют только в умах тех, кто их хранит."
10037050-32 = "Если люди не осознают что-то как секрет и не скрывают этого, то и самого секрета не существует."
10037050-33 = "Это просто вещь, чьё существование или истинная природа ещё не были обнаружены."
10037050-34 = "В Шаньхайцзине было много скрытых жемчужин, которые замечают такие чужаки, как мы..."
10037050-35 = "Но сами студенты Шаньхайцзина, похоже, даже их не замечают."
10037050-36 = "Разумеется, это лишь моё мнение после всего одного дня знакомства с Шаньхайцзином. Хи-хи!"
10037050-37 = "[s] «Что ты думаешь о Кисаки?»"
10037050-38 = "Президент... удивительный человек. Да, действительно."
10037050-39 = "Я понимаю, почему столько студентов всей душой следуют за ней."
10037050-40 = "Конечно, она не такая милая, как Черино. Можно даже сказать, она слишком взрослая? Почти неестественно."
10037050-41 = "Она настолько опытна и невозмутима, будто была рождена лидером. И решения принимает разумные..."
10037050-42 = "Теперь, когда я думаю об этом, становится интересно, почему в тот раз она вела себя так странно."
10037050-43 = "[s] «В тот раз?»"
10037050-44 = "Да, тогда — когда она не пошла с нами на дневную экскурсию по Шаньхайцзину."
10037050-45 = "[s] «О...»"
10037050-46 = "Не кажется ли тебе немного странным, что хозяйка лично не сопровождала нас по своей территории?"
10037050-47 = "И речь ведь о человеке, который прекрасно знает этикет, как президент."
10037050-48 = "Хотя она и сказала, что у неё было дело, которого совершенно невозможно избежать..."
10037050-49 = "Знаю, говорить такое невежливо, но думаю, не я одна сомневаюсь в её намерениях."
10037050-50 = ""
10037050-52 = ""
10037050-54 = ""
10037050-55 = "Интересно, что думаешь ты, Сенсей... Хи-хи! Нет, отвечать не нужно. Твоё лицо и так всё говорит."
10037050-56 = "Нет, не думаю, что это было настолько очевидно. Просто я чувствительнее к таким вещам, чем остальные студенты."
10037050-57 = "[s] «А что насчёт студентов Шаньхайцзина?»"
10037050-58 = "А, вот это уже забавная тема!"
10037050-59 = ""
10037050-61 = ""
10037050-62 = "Сегодня мы встретили в Шаньхайцзине Исполнительного Офицера Мину, ту девушку по имени Кагуя, президента торговой гильдии Руми, всех из Сада Сливового Цвета..."
10037050-63 = "О, и других студентов, мимо которых мы проходили во время экскурсии по Шаньхайцзину."
10037050-64 = "..."
10037050-65 = "Моё впечатление такое..."
10037050-66 = ""
10037050-68 = ""
10037050-69 = "Они напомнили мне стог сена через несколько мгновений после того, как его подожгли."
10037050-70 = "[s] «Что... ты имеешь в виду?»"
10037050-71 = "Перед серьёзными последствиями всегда появляются предупреждающие признаки."
10037050-72 = "Студенты Шаньхайцзина снаружи кажутся спокойными..."
10037050-73 = "Но внутри я почувствовала едва заметную нервозность и напряжение... а может, страх."
10037050-74 = "Кроме того, статистика показывает: одному крупному происшествию предшествуют 29 меньших происшествий по той же причине, а им, в свою очередь, примерно 300 потенциальных происшествий."
10037050-75 = "[s] «И это... плохо?»"
10037050-76 = "Да! Конечно, возможно, я просто преувеличиваю свои первые впечатления."
10037050-77 = "Однако... мы с Красной Зимой немного чувствительнее к таким настроениям."
10037050-78 = ""
10037050-80 = ""
10037050-81 = "Спрашиваете, почему?"
10037050-82 = ""
10037050-84 = ""
10037050-85 = "..."
10037050-86 = "Ну, потому что в Красной Зиме государственный переворот в среднем случается один-два раза в неделю."
10037050-93 = ""
10037050-94 = "..."
10037050-95 = "Я пришла сюда после того, как услышала, что ты упомянула признаки, появляющиеся в Шаньхайцзине, во имя верности..."
10037050-96 = "Но это странное место. Оно принадлежит Шаньхайцзину, но будто и не Шаньхайцзин. Окраина без студентов и каких-либо объектов."
10037050-97 = "Мало кто вообще знает, что такое место существует..."
10037050-98 = ""
10037050-102 = "Ты намекаешь, что те, кто знает, какие-то странные?"
10037050-103 = ""
10037050-105 = ""
10037050-106 = "Кто...?"
10037050-107 = ""
10037050-110 = ""
10037050-111 = ""
10037050-112 = "Путь тёмен, но ночь не способна скрыть свет. Разве не так?"
10037050-113 = "Ты...? Шинтани Кай?! Как ты сюда попала?!"
10037050-114 = "Охо. Не думала, что ты всё ещё меня помнишь. Это немного удивляет."
10037050-115 = "...Да. Даже если все остальные забыли... кто-то должен помнить прошлое."
10037050-116 = "Кех-хех... Ты совсем не меняешься, Кагуя. Я плохо запоминаю лица, но некоторых людей не забываю никогда."
10037050-117 = "Да, я знаю, что Клуб Пекинской Оперы всё ещё существует."
10037050-118 = "Видимо, жизнь у тебя совсем беззаботная, раз есть время переживать о деятельности чужого клуба."
10037050-119 = "Кех-хех. Я слышу в твоих словах беспокойство? Ха! Не думала, что мне придётся решать, благодарить тебя или нет."
10037050-120 = "Не нужно. Твоё исключение... было решением, которое я до сих пор считаю правильным, особенно учитывая итог."
10037050-121 = "«Учитывая итог» можно понимать очень по-разному."
10037050-122 = "...Президент злоупотребила полномочиями и исключила тебя в обход положенной процедуры. А потом стёрла все связанные с тобой записи."
10037050-123 = "Пытаешься пробудить старые воспоминания? Я помню... Кех-хех. Если бы меня не исключили, я бы закончила обучение первой в классе. Но мои записи загадочным образом исчезли..."
10037050-124 = "Некоторое время я действительно была обузой для Исправительного Бюро. А потом незаметно скиталась по окраинам Кивотоса... словно живой призрак."
10037050-125 = "...Удивительно. Та самая Шинтани Кай жалуется, что была обузой."
10037050-126 = "Вот как ты это восприняла? Похоже, и моё красноречие от этого страдает."
10037050-127 = "Зачем ты меня позвала?"
10037050-128 = "Я хочу поговорить о нынешнем Шаньхайцзине."
10037050-129 = "Что ты вообще знаешь о нынешнем Шаньхайцзине?"
10037050-130 = "Кех-хех... Прогоняешь дух прошлого? Как колко."
10037050-131 = "Ну а чего ты ожидала от той, кто одновременно и принадлежит Шаньхайцзину, и не принадлежит ему?"
10037050-132 = ""
10037050-134 = ""
10037050-135 = "Просто... Как только прибыли гости из Красной Зимы, я внезапно начала слышать о беспокойстве в Шаньхайцзине."
10037050-136 = ""
10037050-139 = ""
10037050-140 = "Откуда ты это знаешь...?!"
10037050-142 = "Шаньхайцзин забыл меня. Это я знаю. Но я не забыла Шаньхайцзин. И не могу."
10037050-143 = "...Значит, у тебя есть собственный способ узнавать, что происходит в Шаньхайцзине..."
10037050-144 = "Кех-хех-хех... Я слышала, вы поставили Пекинскую оперу для гостей из Красной Зимы. Что ты почувствовала, Кагуя?"
10037050-145 = "...Я не стану отвечать."
10037050-146 = "Ничего страшного. Отказ отвечать — тоже ответ. Это было унизительно, да?"
10037050-147 = "...!"
10037050-148 = "Все усилия, которые ты вкладывала всю жизнь, остались непризнанными людьми, которые не знают ни ценности традиций, ни смысла Пекинской оперы..."
10037050-149 = "Я знаю. Очень хорошо знаю. Даже если все остальные говорят, что не понимают, я понимаю это чувство."
10037050-151 = "Изгнанница, не смей оспаривать решения и суждения госпожи!"
10037050-153 = "Охо! Разве ты сама не сомневалась в решениях и суждениях Кисаки?"
10037050-154 = "Если нет, у тебя не было бы причины приходить сюда через весь путь."
10037050-155 = "...!!!"
10037050-156 = ""
10037050-159 = ""
10037050-160 = "Я вижу это. Беспокойство в Шаньхайцзине и бурю, которую оно неизбежно принесёт."
10037050-161 = "Если так продолжится, сама Пекинская опера станет пережитком прошлого, и в конце концов никто не будет к ней обращаться."
10037050-162 = "Вот что такое перемены. Как речная вода стачивает валун, изменения затрагивают всё, даже если это не сразу заметно."
10037050-163 = ""
10037050-166 = ""
10037050-167 = "Не смей насмехаться над культурной ценностью и смыслом Пекинской оперы!"
10037050-168 = "Я бы никогда не стала насмехаться! Сколько бы людей ни презирали Пекинскую оперу, всегда должен оставаться хотя бы один человек, который защитит её и её традиции."
10037050-170 = "...Ты предлагаешь мне стать этим человеком?"
10037050-171 = "А кто ещё?"
10037050-172 = "Почему я?"
10037050-173 = "Потому что Клуб Пекинской Оперы всегда понимал ценность и смысл традиций Шаньхайцзина."
10037050-174 = "...По крайней мере, так должно было быть, когда я училась в Шаньхайцзине."
10037050-175 = "...!"
10037050-176 = "...Все так легко говорят о традициях, будто это пустяк..."
10037050-177 = "Редко кто действительно понимает, насколько традиции важны."
10037050-178 = "Мы должны уважать прошлое и историю людей, которые из него вышли! Настоящее стоит корнями в прошлом!"
10037050-179 = "В конце концов, главная проблема — Променад Чёрной Черепахи."
10037050-180 = ""
10037050-182 = "Эти ядовитые грибы! Они прикрываются готовкой и торговлей, чтобы распространять свои споры повсюду!"
10037050-183 = "И госпожа Президент виновата не меньше, раз позволяет Променаду Чёрной Черепахи творить такое... Почему она спускает им всё с рук?"
10037050-184 = "Она достаточно умна, чтобы понимать, сколько проблем создают эти хулиганы."
10037050-185 = ""
10037050-187 = "Мало того что приглашение Сенсея из Шале само по себе отвлекает всех, так теперь ещё и гости из Красной Зимы..."
10037050-188 = "Кех-хех-хех-хех..."
10037050-190 = "Понятно. Но если твоя верность в первую очередь принадлежит Клубу Пекинской Оперы, разве не о нём тебе стоит беспокоиться прежде всего?"
10037050-191 = "Если хочешь по-настоящему защищать традицию, начать нужно именно с этого."
10037050-192 = "Что ты имеешь в виду?"
10037050-193 = "Ну, например, почему бы не попробовать оперу с новым содержанием?"
10037050-194 = ""
10037050-196 = ""
10037050-197 = ""
10037050-198 = "И можно поэкспериментировать с хореографией на сцене Пекинской оперы..."
10037050-199 = ""
10037050-202 = ""
10037050-204 = ""
10037050-205 = "...?! Что ты говоришь, Шинтани Кай?! У меня и Клуба Пекинской Оперы нет таких полномочий!"
10037050-207 = "Забавно слышать это от президента Клуба Пекинской Оперы."
10037050-208 = "До сих пор именно Клуб Пекинской Оперы серьёзнее всех чтил традиции Шаньхайцзина. Если не у тебя, то у кого вообще могут быть такие полномочия?"
10037050-209 = "...!"
10037050-210 = "Впрочем, всё это может быть лишь бредом изгнанницы из Шаньхайцзина."
10037050-211 = "Если мы всё-таки поставим новую Пекинскую оперу... и она провалится..."
10037050-212 = "Забавно. Разговор об успехе и провале — это признак верности?"
10037050-213 = "...!!!"
10037050-214 = "Кех-хех-хех... Похоже, даже президент Клуба Пекинской Оперы может поддаться мирским желаниям. Но чего ожидать? Единственная постоянная — это перемены, верно?"
10037050-215 = "Не говори так опрометчиво! Если хотя бы один человек помнит, даже если все остальные забудут...!"
10037050-216 = "А, вот такого духа я и ждала! Не переживай. Я помогу тебе подготовиться."
10037050-217 = ""
10037050-219 = ""
10037050-220 = "Как...?"
10037050-221 = "Кех-хех. У изгнанницы есть свои способы."
10037050-222 = "...Это дело не имеет к тебе отношения, Шинтани Кай."
10037050-223 = "Что бы ни случилось, Клуб Пекинской Оперы верен Шаньхайцзину. Я лично прослежу за этим!"
10037050-224 = "Конечно. Разумеется. Или нет. Как хочешь."
10037050-225 = ""
10037050-227 = ""
10037050-228 = ""
10037050-229 = "Кех-хех-хех... Ну и искры полетели."
10037050-230 = ""
10037050-232 = ""
10037050-235 = ""
10037050-236 = ""
10037050-237 = "Я всё слышала. Что тебе нужно, Кай?"
10037050-238 = "Угли."
10037050-239 = ""
10037050-240 = "Угли...?"
10037050-241 = "Да. Угли. Даже самая маленькая искра ярко светит во тьме."
10037050-242 = "Если возможно, я надеюсь, что эти маленькие, но сильные угли разгорятся в бушующий пожар."
10037050-243 = "А ты?"
10037050-244 = ""
10037050-247 = ""
10037050-248 = ""
10037050-249 = "...Я надеюсь, Общество Восточной Алхимии найдёт настоящего президента."
10037050-250 = "Вижу, ты не изменилась. Наверное, поэтому ты единственная, кто до сих пор мне подчиняется."
10037050-251 = "Президент Сая — то есть Якуши Сая — не подходит на роль президента Общества Восточной Алхимии. По сравнению с тобой ей не хватает и мастерства, и квалификации."
10037050-252 = "Общество Восточной Алхимии должно найти своего истинного хозяина. Вот и всё."
10037050-253 = "Вот как."
10037050-254 = ""
10037050-256 = ""
10037050-258 = "В таком случае есть кое-что, что ты должна для меня сделать."
10037050-259 = "Жду ваших приказов."
10037050-260 = "Даже если то, что мне нужно, помешает твоему будущему?"
10037050-261 = "Сейчас моё будущее в Обществе Восточной Алхимии всё равно от меня ускользает."
10037050-262 = ""
10037050-265 = ""
10037050-266 = "Хорошо. Тогда возвращайся в Общество Восточной Алхимии... и сделай всё необходимое."
10037050-267 = "Сделаю, как вы скажете."
10037050-268 = ""
10037050-270 = ""
