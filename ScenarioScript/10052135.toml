[translation]
10052135-3 = "Мы прорвались!"
10052135-4 = "...Значит, эта штука всё-таки ломается."
10052135-5 = "Видели, Сенсей? Я сделала это! Наш реванш удался!"
10052135-6 = "Д-десантные капсулы всё равно слишком страшные... Ух..."
10052135-8 = "Но мы ведь всё равно сделали всё безопасно, да? Значит, проблемки нет! Хи-хи!"
10052135-9 = "Теперь нужна только Кей, Сенсей! Позаботьтесь о ней!"
10052135-10 = ""
10052135-12 = ""
10052135-14 = ""
10052135-15 = "[ns] «Ну что, спустимся?»"
10052135-16 = ""
10052135-18 = ""
10052135-19 = "[ns] «Что такое, Кей-Кей? Ты выглядишь... обеспокоенной.»"
10052135-20 = "Я просто размышляю об их... высокомерии. Подумать только, они так оскверняют силу Безымянных Богов..."
10052135-21 = "В мои времена... я бы...!"
10052135-22 = "[s] «А, вот оно. Началась речь „в мои времена“.»"
10052135-23 = ""
10052135-25 = ""
10052135-26 = "...Ты смотришь на меня свысока и намекаешь, что я узколобая мелкая нахалка..."
10052135-27 = "...которая обобщает всё, опираясь только на собственный опыт, и настаивает, что её способ единственно правильный?"
10052135-28 = "[s] «Я не заходил так далеко...»"
