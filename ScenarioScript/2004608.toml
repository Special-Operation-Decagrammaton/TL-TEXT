[translation]
2004608-1 = "Под защитой Небес, почитаемая Землёй"
2004608-2 = ""
2004608-3 = "Сенсей."
2004608-4 = "Я знала, что вы придёте."
2004608-5 = "С возвращением в Хяккияко."
2004608-6 = "[s] «Что ты задумала?»"
2004608-7 = "О, не называйте это так. Я просто пользуюсь возможностью."
2004608-8 = "И, рискуя испортить момент, сразу скажу:"
2004608-9 = "Я собираюсь захватить мир."
2004608-10 = ""
2004608-13 = "Знаю. Звучит нереалистично, правда? Но я провела всевозможную подготовку."
2004608-14 = "Например... помните, что я говорила? О том, что Клуб Инь-Ян не может управлять Хяккияко?"
2004608-15 = "О том, что мы незначительны и у нас нет настоящей власти?"
2004608-16 = "Даже Дисциплинарный комитет Геенны согласился бы со мной, а они ведь безупречны, правда?"
2004608-17 = "Но откуда вообще взялась эта мысль? Кто первым начал так говорить?"
2004608-18 = "Ньяха... Я."
2004608-19 = ""
2004608-21 = ""
2004608-22 = ""
2004608-23 = "Самый опасный клинок — тот, которого не видишь."
2004608-24 = "Покажи всем, что твой меч в ножнах и перевязан как знак мира, — и никто даже не станет искать кинжал."
2004608-25 = "Я всё это время незаметно сосредотачивала власть у нас в руках. Даже у вас под носом, Сенсей."
2004608-26 = "Вся власть Хяккияко — в одном месте. Теперь нас никто не остановит."
2004608-27 = ""
2004608-29 = ""
2004608-32 = ""
2004608-35 = ""
2004608-38 = ""
2004608-39 = "Геенна и Тринити заняты борьбой друг с другом. Миллениум — это... хех, Миллениум."
2004608-40 = ""
2004608-46 = "Чёрный Дракон запер ворота, боясь бури, а Красный Медведь состоит из кучки спорящих между собой дилетантов."
2004608-47 = "Про Валькирию даже упоминать не будем."
2004608-48 = ""
2004608-51 = ""
2004608-52 = "Единственное возможное препятствие — Генеральный студенческий совет... или, если точнее..."
2004608-53 = ""
2004608-55 = ""
2004608-56 = "Сенсей [USERNAME] из Шале."
2004608-57 = "[ns] «Ния.»"
2004608-58 = "А, снова это страшное лицо. Не волнуйтесь. Я привела вас сюда не для драки."
2004608-59 = "Насилие грубо и примитивно. Лучший стратег побеждает без него."
2004608-60 = "Я давно наблюдаю за вами, Сенсей. Я знаю, на что вы способны. Нам ведь нет смысла становиться врагами, правда?"
2004608-61 = "Простите за клише, но не предпочтёте ли присоединиться к нам? Уверяю, мои условия покажутся вам вполне разумными."
2004608-62 = "[ns1] «Ния, мне нужно сказать тебе кое-что серьёзное.»\n[ns2] «Разговор будет долгим, так что слушай внимательно.»"
2004608-65 = "...Вы проделали весь этот путь только для того, чтобы читать мне нотации?"
2004608-66 = "Понятно. Видимо, я ослепила вас всем этим."
2004608-67 = ""
2004608-69 = ""
2004608-70 = "Как бы то ни было, я больше не ваш студент, а вы для меня больше не Сенсей."
2004608-71 = "Теперь мы с вами либо партнёры, либо враги."
2004608-72 = "И если вы выберете быть моим врагом..."
2004608-73 = "...я НАЖМУ на спуск. Теперь всё ясно?"
2004608-74 = "[s3] «Это ничего не меняет.»\n[s4] «Ния, ты всё ещё мой студент, а я всё ещё твой учитель.»"
2004608-77 = ""
2004608-80 = "[ns5] «И если студент делает неправильный выбор...»\n[ns6] «...моя работа — направить её на верный путь.»"
2004608-83 = "...Хорошо. Вы звучите достаточно искренне. Поверю вам на слово."
2004608-84 = ""
2004608-86 = ""
2004608-87 = ""
2004608-88 = ""
2004608-89 = "Какое разочарование..."
2004608-90 = ""
2004608-92 = ""
2004608-93 = ""
2004608-94 = "...Та-дам!"
2004608-95 = "Ну как вам моя игра, Сенсей? Ньяхаха..."
2004608-96 = ""
2004608-98 = ""
2004608-99 = "Немного выбила вас из колеи, да?"
2004608-100 = "Не волнуйтесь. Это была всего лишь маленькая сценка, которую я придумала."
2004608-101 = "Я не собираюсь ничего захватывать, а видео, которое показала, было поддельным."
2004608-102 = "Война мне ничего не даст. Основной доход Хяккияко строится на туризме. Кто станет платить за экскурсию по зоне боевых действий?"
2004608-103 = "Так что, полагаю, вы гадаете, зачем я вообще всё это сказала."
2004608-104 = "В основном ради развлечения. Я знала, что вы отреагируете."
2004608-105 = "Я уже много раз звала вас сюда, и вы всегда прибегали. Даже по самым пустяковым поводам."
2004608-106 = "Разве не было бы огромным сюжетным поворотом, если бы оказалось, что всё это время я просто использовала вас в какой-то извращённой игре?"
2004608-107 = "Забавный факт: если бы захотела, я МОГЛА бы сделать всё, о чём только что говорила."
2004608-108 = "[s] «Но ты не сделала.»"
2004608-109 = "Ньяхаха! Верно, я говорю чисто гипотетически."
2004608-110 = "Или... нет?"
2004608-111 = "Неужели я ПРАВДА не способна на всё это?"
2004608-112 = "[s7] «В общем смысле ты, конечно, способна...»\n[s8] «Но ты не стала бы...»"
2004608-115 = "...Я ведь СКАЗАЛА «гипотетически», разве нет?"
2004608-116 = "Если серьёзно, захотев, я могла бы превратить Клуб Инь-Ян в куда более могущественную организацию."
2004608-117 = "Может, и не настолько, чтобы стать «угрозой всему Кивотосу», но уж точно достаточно, чтобы контролировать все остальные клубы Хяккияко."
2004608-118 = "Так что вопрос не в том, МОГЛА бы я или нет. Могла бы, несомненно."
2004608-119 = "[s9] «Нет, не смогла бы.»\n[s10] «Ты слишком сильно любишь Хяккияко.»"
2004608-122 = "Ньяха...?"
2004608-123 = "...Вы хотите сказать, что из-за моей любви к Хяккияко я никогда не сделала бы ничего, что могло бы ему навредить...?"
2004608-124 = "И поэтому вы с самого начала не поверили в мою игру...?"
2004608-125 = "..."
2004608-126 = "Ньяхаха! Ну, справедливо!"
2004608-127 = "Ого, может, я просто глупая, раз пыталась вас провести."
2004608-128 = "Но хоть какую-то реакцию я из вас всё-таки вытянула."
2004608-129 = "Наверное, дальше мне стоит быть с вами немного честнее."
2004608-130 = "*вздох* Если подумать, да, простите. Я вытащила вас сюда в такой час только затем, чтобы вы смотрели, как я сама с собой мечусь из стороны в сторону..."
2004608-131 = "Я президент клуба, символизирующего баланс, но, похоже, во мне куда больше инь, чем ян."
2004608-132 = "Даже когда я во всю «ньяхаха»-ю, баланс едва держится. Хотя все мои милые младшие и друзья довольно «янские», так что это помогает его уравновесить."
2004608-133 = "Хм, стоит упомянуть..."
2004608-134 = "...что предложение присоединиться к нам, вступить в Клуб Инь-Ян, не было частью спектакля. Оно настоящее. Что скажете?"
2004608-135 = "[s11] «Я всегда на стороне своих студентов, так что...»\n[s12] «Баланс и гармония — мне с ними тоже непросто.»"
2004608-138 = "Ньяхаха! Хороший ответ. Честный ответ."
2004608-139 = "У вас это хорошо получается, Сенсей. Правда хорошо."
