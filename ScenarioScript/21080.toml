[translation]
21080-1 = "Episódio 8;Avaliação de Qualificação"
21080-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21080-3 = "Muito bem! Agora que escapamos da crise do fechamento do clube, podemos jogar à vontade sem preocupação!"
21080-4 = "Então, Aris, vamos fazer uma raid hoje! Tá pronta?"
21080-5 = "Estratégia compreendida. Equipamento exclusivo de raid também obtido. Anunciando: \"Iniciantes bem-vindos / Expedição à 'Floresta Ardente' / 4 jogadores / Procura-se Healer e DPS à distância\". Ah! \"Perorochan32 entrou no grupo\"."
21080-6 = "E-Ei, não é meio cedo pra relaxar desse jeito?!"
21080-7 = "Você já avisou a Yuuka? Que agora somos 4 membros e cumprimos os requisitos do clube?"
21080-8 = "Claaaro! Por isso mesmo ela disse que vem hoje à tarde fazer a avaliação de qualificação da Aris... Ah, Aris! Isso é a animação de ataque de sopro! Cuidado!"
21080-9 = "Perigo detectado! Ativando magia de barreira!"
21080-10 = "O perigo de verdade tá na vida real agora! Que história é essa de avaliação de qualificação?! É a primeira vez que ouço falar disso!"
21080-11 = "A sobrevivência do nosso clube depende dessa \"avaliação de qualificação\"... Não é hora de ficar jogando raid tranquilamente, né?!"
21080-12 = "Você se preocupa demais! A preparação da Aris já tá impecável."
21080-13 = "Hein? Sério mesmo?"
21080-16 = "Aris, sua apresentação!"
21080-18 = "Meu nome é Aris, a de Olhos Azuis, cavaleira lanceira da tribo dos anões. Minha arma é a lança-canhão \"Presa do Dragão de Fogo\", e minha terra natal são as Montanhas de Aço. Quando pequena, perdi minha família num ataque dos demônios e adentrei sozinha a mina em chamas..."
21080-19 = "Não o perfil do seu avatar no jogo, o seu próprio perfil, Aris!"
21080-20 = "Ah, entendido."
21080-22 = "Meu nome é Aris, aluna do 1º ano da Escola de Ciências Millennium. Como fui transferida recentemente e perdi o prazo de inscrição das matérias, ainda não estou matriculada nas aulas, mas planejo começar a frequentá-las oficialmente no mês que vem."
21080-23 = "Como me informaram que é permitido participar de atividades de clube mesmo sem frequentar as aulas ainda, entrei para o Clube de Desenvolvimento de Jogos."
21080-24 = "Ah, até que convence bastante."
21080-25 = "Meu papel no Clube de Desenvolvimento de Jogos é tanque e atacante de elemento luz..."
21080-26 = "Não, não! Seu papel é programadora!"
21080-27 = "P-Programadora! Desde que nasci, eu já usava Jaba antes mesmo da minha língua materna..."
21080-28 = "Uuuh, será que isso vai dar certo mesmo...?!"
21080-29 = "...Não pode ser."
21080-31 = "Uma nova integrante no Clube de Desenvolvimento de Jogos? Não pode ser...!"
21080-32 = "Pena pra você, mas é a pura verdade!"
21080-33 = "Yuuka..."
21080-36 = "...?"
21080-37 = "Você é a famosa Aris-chan, né? A quarta integrante que entrou para o Clube de Desenvolvimento de Jogos."
21080-38 = "Hmm, eu achava que conhecia praticamente todas as alunas de Millennium, mas..."
21080-39 = "É meio difícil acreditar que eu não conhecia uma garota tão fofa assim."
21080-40 = "(Sobressalto)"
21080-41 = "...???"
21080-42 = "Fa-"
21080-43 = "Um fantasma apareceu...!"
21080-44 = "E-Essa garota acabou de me chamar de \"fantasma\"?!"
21080-45 = "V-Você entendeu errado! Ela disse \"fada\", você só ouviu mal! Ai, a Aris não consegue mesmo mentir, né~"
21080-46 = "Tsc... Mesmo já estando acostumada a fazer papel de vilã, nunca imaginei ser tratada como um fantasma por alguém que acabei de conhecer."
21080-47 = "Você tem muita coragem, hein...!"
21080-48 = "C-Calma aí! O conselho estudantil não pode deixar sentimentos pessoais interferirem, né?!"
21080-50 = "Enfim, atingimos o número mínimo de membros! Com isso o Clube de Desenvolvimento de Jogos pode continuar existindo, certo?"
21080-51 = "Continuar existindo..."
21080-52 = "De fato... Isso se essa garota realmente tiver vindo para cá por vontade própria, é claro."
21080-53 = "(Coração dispara)"
21080-54 = "Originalmente, bastaria registrar a entrada da nova integrante e pronto..."
21080-55 = "Mas ultimamente o regulamento de funcionamento dos clubes mudou um pouco, e passou a ser necessário fazer uma verificação mais rigorosa."
21080-56 = "Por isso, vou fazer um breve interrogatório com a Aris-chan... Ops, escapou sem querer..."
21080-57 = "Enfim, vou fazer algumas perguntas simples, tá bem?"
21080-59 = "Acho que ela deixou escapar o que realmente pensa..."
21080-62 = "Não vai demorar muito."
21080-63 = "(Engole em seco)"
21080-64 = "D-Dependendo das minhas escolhas, existe a chance de cair num final ruim?"
21080-65 = "Final ruim... Bom, talvez possa acontecer, sim. Muito bem... Aris-chan."
21080-68 = "Vou começar as perguntas."
21080-70 = "Próximo;A Pergunta de Yuuka"
