[translation]
21080-1 = "Эпизод 8;Соответствие Критериям"
21080-2 = "Департамент Разработки Игр Милленниума"
21080-3 = "Ха-ха! Теперь, когда всё сложное позади, можно расслабиться и поиграть, правда?"
21080-4 = "Сегодня рейд. Готова, Алиса?"
21080-5 = "Стратегию понимаю. Экипировка готова, и я разместила объявление: \"Новички приветствуются — Экспедиция в Горящий Лес на 4 человека — нужны хилеры/DPS\". А. Присоединился Peroro32."
21080-6 = "Мы правда можем позволить себе расслабиться?"
21080-7 = "Ты поговорила с Юукой и сказала ей, что теперь нас четверо?"
21080-8 = "Конечно. Она сказала, что придёт днём проверить соответствие Алисы... О! Алиса! Босс сейчас использует AOE-дыхание! Осторожно, иначе нас стерут!"
21080-9 = "Манёвр уклонения! Накладываю защитную магию."
21080-10 = "Нам и в реальной жизни грозит опасность! Проверить соответствие?! Что это вообще значит?"
21080-11 = "На кону выживание нашего клуба, а вы в рейде в MMO!"
21080-12 = "Расслабься, Мидори. Алиса полностью готова."
21080-13 = "А?"
21080-14 = ""
21080-16 = "Алис! Представься!"
21080-17 = ""
21080-18 = "Меня зовут Алиса Синеглазка. Я дворф-копейщица с ружьём-копьём \"Клык Пламенного Дракона\". Я родом из Стальных гор, но в детстве потеряла семью при нападении демонов—"
21080-19 = "Нет, не игрового персонажа! Я про тебя саму, Алиса!"
21080-20 = "А, поняла."
21080-21 = ""
21080-22 = "Здравствуйте. Меня зовут Алиса. Я первокурсница школы Милленниума. Я недавно перевелась, но пропустила регистрацию, поэтому начну занятия только со следующего месяца."
21080-23 = "Хотя я пока не посещаю занятия, мне сказали, что вступать в клубы можно, поэтому я присоединилась к Департаменту Разработки Игр."
21080-24 = "О-о. Вообще-то очень даже не плохо."
21080-25 = "Моя роль в Департаменте Разработки Игр — танковать и наносить ближний световой урон..."
21080-26 = "Ты программист!"
21080-27 = "Т-Точно! Программирование... Я научилась писать код на JABA ещё до того, как произнесла первое слово..."
21080-28 = "Мы вообще это переживём...?"
21080-29 = "...Это не может быть правдой."
21080-30 = ""
21080-31 = "Не может быть, чтобы кто-то сейчас вступил в Департамент Разработки Игр!"
21080-32 = "Извини, но ты ошибаешься!"
21080-33 = "Юука..."
21080-34 = ""
21080-36 = "...?"
21080-37 = "Значит, ты и есть та самая \"Алиса\", о которой все говорят. Якобы четвёртая участница Департамента Разработки Игр."
21080-38 = "Хм. Я думала, что знаю всех студентов школы Милленниума..."
21080-39 = "Как я могла пропустить такую милую девочку...?"
21080-40 = "(Акх!)"
21080-41 = "А?"
21080-42 = "О."
21080-43 = "Вот оно, привидение..."
21080-44 = "К-Кого ты назвала привидением?!"
21080-45 = "Э-Эм, это недоразумение! Алиса немного рассеянная и не договорила. Наверное, она хотела сказать \"привлекательная\" или что-то такое!"
21080-46 = "Угх... Не люблю, когда незнакомцы так со мной разговаривают."
21080-47 = "Язык у тебя острый, новичок."
21080-48 = "У-Успокойся! Она не хотела тебя оскорбить!"
21080-49 = ""
21080-50 = "Несмотря на всю эту путаницу, нужное количество участников у нас есть! Теперь-то мы можем сохранить Департамент Разработки Игр?"
21080-51 = "То, что ты говоришь, верно..."
21080-52 = "...при условии, что ваша новая участница вступила по собственной воле."
21080-53 = "(Акх!)"
21080-54 = "Раньше клубам хватало просто уведомить нас, что они нашли новых участников."
21080-55 = "Но в последнее время правила стали строже."
21080-56 = "Поэтому по новым правилам Алису ждёт допрос... Стоп, я не это хотела сказать."
21080-57 = "В любом случае, у меня всего несколько простых вопросов."
21080-59 = "Ты ТОЧНО именно это и хотела сказать..."
21080-61 = ""
21080-62 = "Не волнуйтесь. Это ненадолго."
21080-63 = "*глоть*"
21080-64 = "М-Можно ли получить плохую концовку в зависимости от выбранных ответов?"
21080-65 = "Ну... полагаю, возможно всё. Что ж, хорошо. Алиса."
21080-66 = ""
21080-68 = "Начнутся же игры."
21080-70 = "Следующий эпизод;Вопросы Юуки"
