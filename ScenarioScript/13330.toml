[translation]
13330-1 = "Episódio 33;Manifestação"
13330-6 = "..."
13330-9 = "Yume, senpa..."
13330-12 = "[ns] \"Mas o que...?!\""
13330-13 = "H-Hoshino-san..."
13330-14 = "...A existência dela se inverteu."
13330-15 = "Desse jeito, ela já..."
13330-17 = "N-Não há nenhum jeito?!"
13330-21 = "...Afirmativo. Não há."
13330-22 = "[ns] \"...?!\""
13330-23 = "N-Não pode ser...!"
13330-24 = "Seria como tentar trazer de volta à vida alguém que já morreu..."
13330-25 = "[ns] \"Hoshino...!\""
13330-29 = "Desde o início, o Canhão Ferroviário não passava de uma isca."
13330-30 = "O verdadeiro alvo era aquele, o maior Místico de Kivotos."
13330-31 = "O sexto koan: \"A verdade do não-ser é verdade?\" —"
13330-32 = "Um dia, todos nós morreremos.#nEsse é um destino já selado."
13330-33 = "Contudo, o ser humano é incapaz de perceber a própria morte."
13330-34 = "Apenas percebemos a morte dos outros.#nLogo, nossa compreensão jamais alcança a morte!"
13330-35 = "...Mas daquele Místico, obtive uma resposta."
13330-36 = "Nós já conhecíamos um conceito capaz de se equiparar à \"morte\"."
13330-37 = "— O \"sofrimento\"."
13330-38 = "Assim como os outros não podem compreender o nosso próprio sofrimento,#ntambém é impossível compreender verdadeiramente o sofrimento alheio."
13330-39 = "...Sim, este é um Místico invertido pelo sofrimento.#nPor assim dizer, a manifestação do \"Terror\"."
13330-43 = "Aquele que se ergue no ápice da divindade, a origem mais antiga e grandiosa dos deuses — \"Hórus\"."
13330-46 = "...Mesmo assim, precisamos detê-la."
13330-47 = "Hã?"
13330-48 = "Agora, a Hoshino-san se inverteu em Terror e se tornou Hórus."
13330-50 = "Se continuar assim, guiada por sua essência, ela levará o mundo à ruína."
13330-51 = "...!"
13330-52 = "[ns] \"...?!\""
13330-59 = "...n, pai."
13330-60 = "Yume... sen, pai."
13330-62 = "...!"
13330-63 = "...Hoshino-senpai."
13330-64 = "A-Aquilo é a Hoshino-senpai...?!"
13330-65 = "O que está acontecendo...?"
13330-69 = "[ns] \"Hina!\""
13330-73 = "Sen, sei..."
13330-74 = "[s] \"Hina, você está bem?!\""
13330-78 = "Eu não consegui... impedir..."
13330-83 = "[ns] \"...!\""
13330-88 = "Senpai!"
13330-89 = "Ca... derno..."
13330-91 = "Hoshino-senpai, volte a si!"
13330-99 = "Aaaah?!"
13330-102 = "[ns] \"Hoshino—!\""
13330-103 = "..."
13330-108 = "Tome cuidado!#nAquele ataque, nem mesmo nós...!"
13330-109 = "Senpai, segure minha mão!"
13330-120 = "[ns] (Não dá...)"
13330-125 = "[ns] (Eu não consegui fazer nada...)"
13330-127 = "[ns] (...Nada)"
13330-129 = "[ns1] (Eu não consigo trazer os mortos de volta à vida)\n[ns2] (Nem consigo mudar o passado)"
13330-133 = "[ns] (Plana... o que eu deveria ter feito?)"
13330-136 = "O-OOOOOH!"
13330-137 = "OOOOOOOOOH—!"
13330-138 = "Agora é a sua vez!"
13330-139 = "Entendo, respondendo à divindade de Hórus!"
13330-140 = "O arqui-inimigo da divindade primordial Hórus,#naquele que se opôs a ele na criação deste mundo..."
13330-141 = "\"Fúria de Set\"!"
13330-154 = "É uma textura de antes de alterar as regras, mas servirá."
13330-155 = "O embate entre a \"Fúria de Set\" e \"Hórus do Alvorecer\".#nEsta é, de fato, a batalha da criação do mundo!"
13330-156 = "Depressa, depressa, mostrem-me!#nO mito de Místico e Terror contado através das eras!"
13330-160 = "A verdade do não-ser é verdade? —"
13330-161 = "A essa pergunta indecifrável, aquele Místico e aquele Terror estão respondendo!"
13330-162 = "A verdade sempre foi observada,#nmas ninguém pode experimentar tudo isso por si mesmo."
13330-163 = "Por isso, jamais chegou o dia em que alcançássemos a verdade. Ah! Exatamente!"
13330-164 = "Este mundo será destruído."
13330-165 = "Seres incapazes de compreender o sofrimento alheio#nestavam, desde o princípio, fadados à destruição."
13330-168 = "Terno Preto, realizei isso em seu lugar."
13330-169 = "Esta é a cena que você tanto queria ver —"
13330-173 = "— A destruição do mundo!"
13330-177 = "Verificação de situação.#nSensei [USERNAME], se continuar assim, o mundo será destruído."
13330-178 = "[s] Existe alguma forma de deter a Hoshino?"
13330-179 = "Resposta.#n...A única opção é destruir o halo da Hoshino-san."
13330-185 = "[ns] De jeito nenhum."
13330-186 = "De qualquer forma, para deter a Hoshino-san agora que ela se tornou Hórus,#nprecisaríamos de uma divindade com poder capaz de rivalizar com ela..."
13330-187 = "[s] ...Uma divindade."
13330-188 = "Porém, não há nenhuma existência assim aqui..."
13330-189 = "...Um \"Terror\" à altura de outro \"Terror\"."
13330-190 = "[s] Não, Hoshino..."
13330-191 = "Arona-senpai. Se continuar assim, o Sensei..."
13330-196 = "Cof, cof... Shiroko-senpai."
13330-197 = "Vamos... fugir..."
13330-198 = "Shiroko-chan..."
13330-202 = "Yume, senpai..."
13330-212 = "..."
13330-213 = "Isso aconteceu porque eu fui fraca."
13330-214 = "Mas acho que agora eu entendi."
13330-215 = "Agora, só eu posso deter a Hoshino-senpai."
13330-216 = "A Ayane, a Serika, a Nonomi, a Hoshino-senpai..."
13330-221 = "E o Sensei também. Eu vou salvar todos, com certeza."
13330-226 = "Porque é para isso que eu existo aqui."
13330-232 = "O \"Chroma\" foi detectado!"
13330-233 = "P-Por quê... bem nessa hora?!"
13330-234 = "S-Sensei!"
13330-235 = "Confirmado. Ele perdeu a consciência.#nPulso instável."
13330-237 = "A vida do Sensei está em perigo, Arona-senpai...!"
13330-238 = "...!"
13330-242 = "Eu... preciso detê-la...!"
13330-248 = "Eu."
13330-272 = "...Ei~."
13330-273 = "Você já precisa acordar..."
13330-274 = "Sensei [USERNAME]?"
13330-281 = "Próximo;Pedido de Desculpas"
