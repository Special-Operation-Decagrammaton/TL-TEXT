13330-113 = ""
13330-120 = "[ns] «(Слишком поздно... Я ничего не могу сделать...)»"
13330-125 = "[ns] «(Я ничего не смог сделать...)»"
13330-127 = "[ns] «(...Ничего.)»"
13330-129 = "[ns1] «(Я не могу воскресить мёртвых.)»\n[ns2] «(Я не могу отменить уже случившееся.)»"
13330-132 = ""
13330-133 = "[ns] «(Я бессилен... Плана.)»"
13330-136 = "О-о-о, о-о-о...!"
13330-137 = "О, о, о-о-о!"
13330-138 = "Неужели твоё время пришло?"
13330-139 = "Да! Первородное божество — Хорус! А следом является противник Хоруса! Мифические существа, столкнувшиеся ещё при самом сотворении этого мира, восстают!"
13330-140 = "Ты пробудился в ответ на божественность Хоруса!"
13330-141 = "Ярость Сета!"
13330-142 = ""
13330-145 = ""
13330-154 = "Это текстура времён до пересмотра правил, но неважно!"
13330-155 = "Битва Ярости Сета и Хоруса Рассвета! Это столкновение богов за само сотворение мира!"
13330-156 = "Явитесь и раскройте этому миру свои мифы! Битва Ярости Сета и Хоруса Рассвета! История непревзойдённой силы и великолепия, пропитанная тайной и страхом!"
13330-157 = ""
13330-160 = "Остаётся ли истиной то, чего никогда не существовало?"
13330-161 = "На этот непостижимый вопрос отвечает эта тайна, этот страх!"
13330-162 = "Истина настолько отчётливая, что её видно ясно, и всё же я никогда её не испытывал. Истина за пределами самого опыта."
13330-163 = "Мы никогда не сможем почувствовать боль другого! А значит, эта истина непостижима! Да, именно!"
13330-164 = "Этот мир рухнет."
13330-165 = "Такова его судьба. Неспособные постичь страдание других, мы были существами, обречёнными на уничтожение."
13330-168 = "Ах да, Чёрный Костюм. Я добился того, чего не смог ты."
13330-169 = "Разве не это зрелище ты так жаждал увидеть?"
13330-170 = ""
13330-173 = "Уничтожение этого мира."
13330-176 = ""
13330-177 = "Проверка состояния. Сенсей [USERNAME], такими темпами мир будет уничтожен."
