13330-179 = "Ответ. ...Необходимо разрушить нимб Хошино."
13330-180 = ""
13330-185 = "[ns] Нет. Мы не можем."
13330-186 = "Хошино сейчас превратилась в сам Ужас. Подавить её способно лишь божество, способное сравниться с этим Ужасом."
13330-187 = "[s] Должен быть другой способ."
