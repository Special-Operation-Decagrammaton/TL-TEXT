[translation]
13330-1 = "Эпизод 33;Озарение"
13330-6 = "..."
13330-9 = "...Ю...мэ..."
13330-12 = "[ns] «Что, чёрт возьми, случилось с Хошино?!»"
13330-13 = "Х-Хошино..."
13330-14 = "...Её существование было инвертировано."
13330-15 = "Хошино, которую вы видите... больше не..."
13330-17 = "М-Мы можем хоть что-нибудь сделать?"
13330-18 = ""
13330-20 = ""
13330-21 = "...Отрицательно. Ничего."
13330-22 = "[ns] «...?!»"
13330-23 = "К-Как такое возможно...?"
13330-24 = "Это... попросту невозможно. Это было бы сродни воскрешению."
13330-25 = "[ns] «Хошино...!»"
13330-26 = ""
13330-29 = "Да, Железнодорожная пушка была лишь приманкой. Каждый мой ход! Приманкой!"
13330-30 = "Моей истинной целью была Великая Тайна Абидоса — Хорус Рассвета."
13330-31 = "Шестой коан: остаётся ли истиной то, чего никогда не существовало? Я нашёл ответ."
13330-32 = "Однажды мы все умрём. Это абсолютная истина, давно предрешённая."
13330-33 = "Но истина, которую мы не могли постичь. Ибо смерть — лишь понятие."
13330-34 = "Мы способны увидеть только смерть других, но никогда собственную. Поэтому истинное понимание, настоящее постижение смерти навечно ускользает от нас! В этом и есть сама сущность смерти!"
13330-35 = "Однако боль Хошино раскрыла другую тайну."
13330-36 = "Мы уже встречались со смертью — в иной форме."
13330-37 = "Боль."
13330-38 = "Моя боль неизвестна другим, а чужая боль неизвестна мне. Боль. Да, по праву своему она тоже является смертью."
13330-39 = "...Да, это тайна, обращённая через боль. Воплощение Ужаса."
13330-43 = "Божественная среди божественных. Древнейшая и величайшая сила богов — Хорус."
13330-46 = "...Нужно остановить Хошино. Арона! Сенсей!"
13330-47 = "Д-Да?"
13330-48 = "Таканаши Хошино превратилась в существо, называемое Хорусом. Если оставить это... существо... его природа неизбежно заставит его перевернуть мир."
13330-50 = "Иными словами... этот мир будет уничтожен руками Хошино."
13330-51 = "...!!"
13330-52 = "[ns] «...!»"
13330-53 = ""
13330-58 = ""
