[translation]
1008405-1 = "Звуки природы 2"
1008405-3 = ""
1008405-4 = "Я много думала о том, почему моя прошлая запись провалилась."
1008405-5 = "Думаю, потому что я слишком сильно пыталась контролировать и искусственно создавать звуки."
1008405-6 = "Люди любят природную атмосферу за её спонтанность. За те случайные факторы, которые невозможно предсказать."
1008405-7 = "А я пыталась поймать эту естественную случайность с помощью искусственного костра..."
1008405-8 = "[s] «Ты уверена, что дело было не в том, что у тебя просто устали руки?»"
1008405-9 = "В-В любом случае!"
1008405-10 = "После прошлых неудач сегодня я решила просто подняться в горы без какой-либо особой цели."
1008405-11 = "Если идти тихо и внимательно слушать... может, удастся поймать все те звуки, которых не услышишь в городе."
1008405-12 = "[s] «Звучит как хорошая идея.»"
1008405-14 = "[ns1] «Но сейчас всё ещё разгар зимы.»\n[ns2] «Разве здесь вообще будет что слушать?»"
1008405-17 = "Всё нормально. Даже когда всё замёрзло... можно услышать беспокойный шёпот тех, кого не пугает холод."
1008405-18 = "На такой тихой зимней горе у нас особенно хороший шанс поймать эти едва слышные звуки."
1008405-19 = "И из-за своей редкости они будут особенно ценными."
1008405-20 = ""
1008405-22 = ""
1008405-23 = "Ну что ж... отправимся вверх по горе?"
1008405-25 = "Позже..."
1008405-29 = ""
1008405-30 = "Сенсей."
1008405-31 = "Можете подойти на минутку?"
1008405-32 = ""
1008405-34 = ""
1008405-35 = "Видите вон то дерево?"
1008405-36 = "[s] «Огромное.»"
1008405-37 = "Да. Ему, наверное, уже не меньше нескольких десятилетий."
1008405-38 = "Хотите послушать, какие истории оно может нам рассказать?"
1008405-41 = "― [log=코타마 캠핑]Тсс...[/log]"
1008405-45 = "[ns] «Котама, ты что...»"
1008405-46 = "― [log=코타마 캠핑]Сенсей, пожалуйста, говорите тише.[/log][wa:2560]"
1008405-49 = "― [log=코타마 캠핑]Не шумите и подойдите ближе к дереву...[/log][wa:2490]"
1008405-52 = "― [log=코타마 캠핑]Послушайте звуки,[/log]"
1008405-54 = "― [log=코타마 캠핑]которые идут изнутри ствола.[/log]"
1008405-57 = "― [log=코타마 캠핑]Слышите?[/log][wa:1250]"
1008405-60 = "― [log=코타마 캠핑]Это вода поднимается вверх по дереву.[/log][wa:1390]"
1008405-63 = "― [log=코타마 캠핑]Это дерево сбросило все листья,[/log][wa:2050]"
1008405-65 = "― [log=코타마 캠핑]будто отказалось от жизни.[/log][wa:2290]"
1008405-68 = "― [log=코타마 캠핑]Но даже так[/log]"
1008405-70 = "― [log=코타마 캠핑]оно изо всех сил тянется к воде.[/log][wa:10]"
1008405-73 = "― [log=코타마 캠핑]Хотя кажется, будто гора погрузилась в полную тишину,[/log][wa:2020]"
1008405-75 = "― [log=코타마 캠핑]на самом деле она полна самых разных звуков...[/log][wa:410]"
1008405-78 = "― [log=코타마 캠핑]...Хи-хи. Знаете, мне кажется,[/log][wa:1090]"
1008405-80 = "― [log=코타마 캠핑]я могла бы слушать их вечность и не устать.[/log]"
1008405-83 = "Хи-хи. Какая прекрасная атмосфера."
1008405-84 = "Из этого получится легендарный ASMR-трек—"
1008405-85 = ""
1008405-87 = ""
1008405-88 = ""
1008405-89 = "[ns] «Пустой желудок тоже входит в атмосферу?»"
1008405-90 = "...Прошу прощения."
1008405-91 = "Я и раньше чувствовала голод, но не ожидала, что мой живот будет урчать настолько громко."
1008405-92 = "...Похоже, если убрать весь фоновый шум, услышишь не только «звуки природы»."
1008405-93 = ""
1008405-96 = "[ns3] «Костёр я разжечь не могу, зато еду взял...»\n[ns4] «Можем поделить моё бэнто, если хочешь перекусить.»"
1008405-97 = ""
1008405-98 = ""
1008405-100 = ""
1008405-101 = "[ns] «Будешь?»"
1008405-102 = ""
1008405-104 = ""
1008405-105 = "...Да!"
1008405-107 = "Мы с Котамой с удовольствием съели вкусный бэнто на горной тропе."
