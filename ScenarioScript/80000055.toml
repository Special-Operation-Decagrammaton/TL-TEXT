80000055-22 = "Она кажется вам странной? Возможно, стоило выбрать что-нибудь более обычное."
80000055-23 = "[s3] «Мне нравится её необычность.»\n[s4] «Очень в твоём духе.»"
80000055-24 = "П-Правда? Вам нравится?"
80000055-25 = "В-Вы так думаете? Правда?"
80000055-26 = "Какое облегчение..."
80000055-27 = "Я так рада, что вам понравилось, Сенсей."
80000055-28 = "Я немного боялась, что вы сочтёте подарок странным. Ха-ха..."
80000055-29 = "Я хотела сделать подарок вам, но кажется, что сама получила намного больше."
80000055-30 = "Я так счастлива, что вы его приняли."
80000055-31 = ""
80000055-34 = "Хм?"
