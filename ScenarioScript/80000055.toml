[translation]
80000055-1 = "Это богохульство?"
80000055-2 = "Я пришёл на встречу с Мари в условленное время."
80000055-3 = "Я очень рада вас видеть, Сенсей. Спасибо, что пришли."
80000055-4 = "Зачем я попросила вас встретиться со мной? Ну, в-видите ли..."
80000055-5 = "Эм..."
80000055-6 = ""
80000055-8 = ""
80000055-9 = "В-Вот зачем. Если вы не против..."
