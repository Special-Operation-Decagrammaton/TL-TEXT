80000055-38 = "..."
80000055-39 = "Ох."
80000055-40 = "Ох, э-эм... Ну..."
80000055-41 = "К-Конечно, не с головы... М-Может, с руки? Но это тоже странно.#nЭм... Снизу?"
80000055-42 = "Но если съесть всё остальное, в конце ведь останется одна голова!"
80000055-43 = "Ч-Что же нам делать?!"
80000055-45 = "Мы продолжили гадать, с какой части шоколада лучше начать."
80000055-46 = ""
80000055-49 = "После нескольких часов размышлений ни один вариант не показался правильным, поэтому мы решили поставить его на витрину и не есть."
