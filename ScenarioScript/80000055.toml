80000055-12 = ""
80000055-14 = "[ns1] «Статуэтка для молитв?!»\n[ns2] «Из шоколада?!»"
80000055-15 = "Э-Это не статуэтка! Это шоколад!"
80000055-16 = "О, вы поняли, что это шоколад!"
80000055-17 = "Сегодня День святого Валентина, поэтому..."
80000055-18 = "...я слышала, что принято дарить шоколад тому, кем восхищаешься."
80000055-19 = "И, конечно же, я подумала о вас."
