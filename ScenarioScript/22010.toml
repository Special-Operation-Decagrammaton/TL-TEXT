22010-15 = ""
22010-17 = ""
22010-18 = "Зрение станет ещё хуже, Рио."
22010-19 = ""
22010-23 = ""
22010-25 = "Наша встреча должна остаться тайной для внешнего мира. Я просто обеспечиваю конфиденциальность."
22010-26 = "Выключить свет и не оставлять следов."
22010-27 = "Я убедилась, что в базе нет истории твоего визита. Официально сегодня мы не встречались."
22010-28 = "Всё это разумные меры для защиты конфиденциальности."
22010-29 = "Рио, ты всегда слишком серьёзная. Я ожидала, что ты скажешь: \"Не указывай мне! Ты мне не старшая сестра!\""
22010-30 = "Вот так супер-гениальный и хрупкий прекрасный цветок разряжает обстановку."
22010-31 = "...Что ты несёшь, Химари? Конечно, ты мне не старшая сестра. Можешь хоть раз говорить разумно?"
22010-32 = "...Точно, ты всегда была такой."
22010-33 = "Слово \"разумно\"... Это твоё любимое слово."
22010-34 = "Не сказала бы, что любимое. Я просто констатировала факты."
22010-35 = "Я думала, мы обе согласны, что сегодняшняя встреча должна быть конфиденциальной."
22010-36 = "Если тебя так беспокоят посторонние глаза, могли встретиться где-нибудь ещё."
22010-38 = "...Где-нибудь ещё?"
22010-39 = "Да, например..."
22010-41 = "В тайном месте, которое кто-то построил..."
22010-42 = "Вроде убежища... или что-то такое."
22010-43 = ""
22010-44 = "..."
22010-46 = "Хватит. Перейдём к делу."
22010-47 = "Не интересует светская беседа? Ха-ха, ладно, неважно."
22010-48 = ""
22010-52 = "Тогда проверим, одинаково ли мы понимаем ситуацию."
22010-53 = ""
