[translation]
22010-1 = "Episódio 1;Reunião Secreta"
22010-10 = "Millennium - Escritório do Seminar"
22010-12 = "Ora... Receber a visita de uma beldade frágil, pura e supergênio#nsem nem sequer acender as luzes..."
22010-13 = "Não ter a menor intenção de receber bem suas visitas#né bem a sua cara, devo admitir..."
22010-14 = "Mas ficar encarando o monitor num quarto escuro faz mal para a vista, sabia?"
22010-18 = "— Rio."
22010-25 = "Estou apenas tomando todas as precauções — ninguém de fora pode saber desta reunião."
22010-26 = "Se for por isso, esse nível de desconforto não é problema algum."
22010-27 = "Esta visita não ficará registrada no banco de dados.#nOu seja, oficialmente, nós nunca nos encontramos."
22010-28 = "Tudo isso — para proteger o sigilo do que estamos prestes a discutir."
22010-29 = "Ah, Rio, você é tão séria...#nSe não consegue nem rebater com um \"Você é minha irmã mais velha, por acaso?\", está bem longe de ter senso de humor."
22010-30 = "O que eu disse agora há pouco foi só uma brincadeirinha desta beldade frágil, pura e supergênio.#nHihi."
22010-31 = "...Você não é minha irmã.#nFalar algo tão irracional do nada... O que deu em você, Himari?"
22010-32 = "...Sim, sim. É verdade.#nVocê é esse tipo de pessoa, mesmo."
22010-33 = "Não entender humor e já puxar o papo de \"racionalidade\"... Essa sempre foi a sua palavra favorita, não é?"
22010-34 = "Não é uma questão de gostar ou não... É apenas um fato, não acha?"
22010-35 = "Eu achava que você pelo menos compreendia que esta reunião é confidencial."
22010-36 = "Será mesmo?#n— Para começar, se você está tão preocupada com olhares indiscretos, não teria sido melhor escolher outro lugar?"
22010-38 = "...Outro lugar?"
22010-39 = "Sim, por exemplo..."
22010-41 = "Aquele lugar que certa pessoa anda construindo às escondidas —"
22010-42 = "Um \"refúgio\"... talvez?"
22010-44 = "..."
22010-46 = "...Vamos direto ao assunto."
22010-47 = "Ora, ora, vai mesmo mudar de assunto?#nHihi... Tudo bem, não me importo."
22010-52 = "Primeiro, vamos alinhar nossas conclusões."
22010-54 = "Toda aquela confusão recente causada por alunas de Millennium em torno do \"Espelho\" —"
22010-55 = "Foi algo que nós duas orquestramos juntas, certo?"
22010-61 = "Sim. Eu forneci o meio, o \"Espelho\", e você providenciou a crise, a \"C&C\"..."
22010-62 = "Foi uma rara ocasião em que nós duas cooperamos por um objetivo em comum."
22010-64 = "Exato — para revelar a verdadeira identidade de Aris."
22010-70 = "Já faz bastante tempo desde então...#nVocê chegou a uma conclusão na sua análise?"
22010-71 = "É claro."
22010-73 = "A verdadeira identidade de Aris...#nEla é —"
22010-74 = "Um \"OOPArt\" venerado pelos Sacerdotes Sem Nome —"
22010-75 = "— E que consta nos registros de um passado remoto como..."
22010-79 = "A \"Princesa dos Deuses Sem Nome\"."
22010-81 = "..."
22010-82 = "..."
22010-83 = "Entendo... Parece que chegamos à mesma conclusão."
22010-88 = "Ou seja... a verdadeira natureza \"daquela existência\" é..."
22010-89 = "Sim. A Aris, aquela garota, é —"
22010-93 = "\"Uma arma que levará o mundo à destruição.\""
22010-94 = "\"Uma 'caloura adorável', não é mesmo? ♪\""
22010-100 = "...?"
22010-101 = "...Ora."
22010-102 = "...O que exatamente você está dizendo?"
22010-103 = "Eu é que pergunto: o que exatamente você está dizendo, Rio...?"
22010-104 = "..."
22010-105 = "..."
22010-111 = "...Entendo. Então isso significa que a nossa aliança termina aqui."
22010-112 = "Pois é.#nEmbora não fosse bem uma aliança, e sim uma trégua..."
22010-113 = "..."
22010-114 = "..."
22010-122 = "Ah, então é este o famoso... brinquedinho que você anda construindo ultimamente."
22010-126 = "Agora que a aliança foi desfeita, não posso simplesmente deixar você ir embora."
22010-128 = "Bem... eu já esperava por isso.#nSabia que você faria algo assim."
22010-135 = "Tsc...?!#nMeu escritório... foi hackeado...?!"
22010-136 = "Ora, ora... Por acaso achou que a sala da Big Sister era invencível?"
22010-137 = "AMAS, capturem a Himari...!"
22010-138 = "Hihi, nada é impossível para uma beldade frágil."
22010-144 = "(Todas as unidades AMAS pararam de funcionar...?)"
22010-145 = "(Não me diga que, no exato instante em que o sistema de iluminação caiu...?!#nEla executou um ataque dessa escala em uma fração de segundo...?)"
22010-146 = "(...Não é hora para ficar impressionada. Preciso retomar o controle dos drones.)"
22010-163 = "Hm? Por que o sistema de iluminação está respondendo...?"
22010-168 = "Urgh...!"
22010-173 = "A Himari..."
22010-179 = "...Entendo, ela conseguiu escapar."
22010-180 = "Como esperado da presidente da Veritas..."
22010-181 = "Se fosse possível, eu gostaria de tê-la mantido como aliada, mas..."
22010-182 = "É realmente uma pena."
22010-184 = "Ah... Este método irracional era o único que eu não queria escolher —"
22010-193 = "Agir sem a menor hesitação no instante em que percebe uma divergência de opiniões..."
22010-194 = "Faz tempo que eu não via isso... Você não mudou nada, Rio."
22010-195 = "Bem, contra uma beldade frágil e supergênio como eu, isso é inútil ♪"
22010-196 = "Ora, ora... Agora, antes da Rio..."
22010-203 = "Hm...?"
22010-211 = "Ghh...?!#nQuem... é você...?"
22010-219 = "Você é..."
22010-220 = "Não pode ser... a quinta integrante da C&C..."
22010-228 = "Próximo;O Cotidiano Comum do Clube de Desenvolvimento de Jogos"
