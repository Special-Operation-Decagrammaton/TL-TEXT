22010-1 = "Эпизод 1; Тайная встреча"
22010-10 = "Исполнительный офис Семинара"
22010-11 = ""
22010-12 = "Ого, к тебе пришла хрупкая супер-гениальная красавица, а ты даже свет не включила, чтобы встретить..."
22010-13 = "Очень в твоём стиле — настолько негостеприимно относиться к гостям."
