[translation]
10001005-97 = "#video;10001"
10001005-1 = "Пролог; Великий президент студсовета"
10001005-2 = "Главные ворота академии Красная Зима"
10001005-5 = ""
10001005-6 = "Здравствуйте, Сенсей. Добро пожаловать в академию Красная Зима."
10001005-7 = "Президент Черино ждёт вас внутри."
10001005-8 = "Сюда..."
10001005-11 = "Президентский кабинет академии Красная Зима"
10001005-15 = "[ns] «Это...?»"
10001005-19 = "Вы об этом портрете?"
10001005-20 = "Это Черино, наш уважаемый президент, Благоустроитель земель, Великий лидер, капитан спортивного клуба, начальник санитарной службы, глава всех префектов и распорядитель школьного питания."
10001005-21 = "[s1] «Впечатляющий список должностей.»\n[s2] «Красивые усы.»"
10001005-22 = "Великий лидер. Позвольте представить вам... Сенсея."
10001005-23 = ""
10001005-24 = ""
10001005-25 = ""
10001005-26 = "У вас безупречный вкус. В этих усах заключена вся власть над Красная Зима."
10001005-27 = "Я рада, что они вам понравились."
10001005-28 = "Великий лидер. Позвольте представить вам... Сенсея."
10001005-29 = ""
10001005-30 = ""
10001005-31 = ""
10001005-32 = ""
10001005-33 = ""
10001005-34 = ""
10001005-35 = "...Прекрасная работа, Томоэ. Как истинный и верный товарищ, ты будешь награждена почётной медалью."
10001005-36 = "Вы слишком добры, о Великий лидер."
10001005-37 = ""
10001005-38 = "Ну что же... Добро пожаловать в великую академию Красная Зима, товарищ."
10001005-39 = ""
10001005-40 = "Перед вами — прославленная Черино!"
10001005-41 = "Уважаемый президент академии Красная Зима, Благоустроитель земель, Великий лидер, начальник санитарной службы..."
10001005-42 = "Эм..."
10001005-43 = "Как там дальше-то было...?"
10001005-44 = "Капитан спортивного клуба, начальник санитарной службы, глава всех префектов и распорядитель школьного питания."
10001005-45 = "...Ну, то, что она сказала! Неважно! Просто знай, что я очень важная и именно я здесь главная! Считай это честью, товарищ!"
10001005-46 = "[s] «Ты совсем не похожа на свой портрет.»"
10001005-47 = "А? Не цепляйся к таким мелочам! Этот портрет изображает меня через год. Вот так-то!"
10001005-48 = "Тебя что-то не устраивает в моём портрете, товарищ?"
10001005-49 = "От взрослого я ожидала бы вкуса получше..."
10001005-50 = "Ч-Что...?!"
10001005-51 = ""
10001005-52 = ""
10001005-54 = "Великий лидер?!"
10001005-55 = "А-а-ай, больно..."
10001005-56 = "Во имя усов, Томоэ! Сколько раз мне просить тебя расправлять ковёр?! Хочешь, чтобы я раздавила тебя своим сапогом?!"
10001005-57 = "Ч-Черино! Т-т-твои усы...!"
10001005-58 = "...А?"
10001005-59 = "А? А-а?! Мои усы!"
10001005-60 = ""
10001005-62 = ""
10001005-65 = ""
10001005-67 = ""
10001005-68 = "Т-ты ничего не видел. В-верно, товарищ Томоэ?"
10001005-69 = "Разумеется, Великий лидер."
10001005-70 = "[s] «Кстати, зачем вы вдруг меня позвали?»"
10001005-71 = "Хех. Всё просто..."
10001005-72 = "Чтобы подготовиться к Ивану Купале!"
10001005-73 = "[s] «Что за событие?»"
10001005-74 = "Товарищ, возможно, ты уже знаешь, но скоро наступит самый длинный день в году — летнее солнцестояние."
10001005-75 = "Каждый год академия Красная Зима проводит фестиваль Ивана Купалы в честь радостного времени, когда тает снег и всё вокруг покрывается зеленью!"
10001005-76 = "Фестиваль Ивана Купалы — уникальная традиция академии Красная Зима, поэтому секретариат мобилизует всех студентов, чтобы подготовить лучший Иван Купалу в истории!"
10001005-77 = "Не так ли, главный секретарь Томоэ?"
10001005-78 = "Именно. Согласно вашим приказам введены двойные смены, а образцовых работников публично отмечают. Благодаря вашим реформам на прошлой неделе производительность выросла на двести пятьдесят процентов."
10001005-79 = "...Это же хорошо, да?"
10001005-80 = "Превосходно! В этом году Иван Купала будет совершенно идеальным!"
10001005-81 = "[s3] «Но до летнего солнцестояния ещё целый месяц, разве нет?»\n[s4] «Тебе нужна моя помощь?»"
10001005-82 = "Ты меня за дурочку держишь?! Я прекрасно это знаю!"
10001005-83 = "Ха! Под моим безупречным руководством наша академия ни в чём не нуждается!"
10001005-84 = "Я позвала именно тебя из-за... твоей должности в Шале."
10001005-85 = "По работе в Шале тебе, должно быть, часто приходится общаться со студентами других академий."
10001005-86 = "Чтобы распространить славу нашей великой академии, сначала мы должны тебя подкупить..."
10001005-87 = "Или правильнее сказать «продать тебя»...?"
10001005-88 = "Черино! Нужно сказать «расположить тебя к нам»!"
10001005-89 = "К-конечно! Потому что расположить к себе сотрудника Шале — первоочередная задача!"
10001005-90 = ""
10001005-92 = ""
10001005-93 = ""
10001005-94 = "А теперь за мной, товарищ! Мы узрим всё великолепие подготовки академии Красная Зима к Ивану Купале и разнесём весть о её славе по всему Кивотосу!"