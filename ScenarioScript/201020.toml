[translation]
201020-1 = "Эпизод 2;Выходной главного администратора 2"
201020-2 = "Перед зданием Генерального ученического совета"
201020-3 = "Как и договаривались, в субботу утром я пришёл к зданию Генерального ученического совета, чтобы встретиться с Рин."
201020-4 = "Она ждала меня у входа..."
201020-5 = ""
201020-7 = ""
201020-8 = "[ns] «Рин...?»"
201020-9 = "...Позвольте объяснить."
201020-10 = "Я понимаю, какие выводы вы, вероятно, сделали из-за моей одежды, но уверяю — они ошибочны."
201020-11 = "[s] «Тогда объясняй.»"
201020-12 = "Проснувшись, я собиралась надеть свою обычную форму."
201020-13 = "Но Аой... нет, глава финансового отдела, украла всю форму из моего шкафа. Она заявила, что в эти выходные я должна полностью отгородиться от работы."
201020-14 = "Так что я фактически была вынуждена прийти к вам в повседневной одежде. Надеюсь на ваше понимание."
201020-15 = "[s1] «О, по-моему, в этом совсем нет проблемы!»\n[s2] «Этот наряд так мило на тебе смотрится!»"
201020-18 = "..."
201020-19 = "Ещё раз подчеркну: это НЕ свидание."
201020-20 = "[s] «Можешь подчёркивать сколько угодно! А для меня это свидание.»"
201020-21 = "Сенсей...!"
201020-22 = "*вздох* Я предпочту проигнорировать этот комментарий."
201020-23 = "Если я буду реагировать на каждую вашу шутку, мы так и проведём весь мой выходной на этой лестнице."
201020-24 = "...Итак, куда мы сегодня идём?"
201020-25 = "[s] «А? Я должен был что-то запланировать?»"
201020-26 = "Разумеется. Это ведь вы пригласили меня провести вместе выходной, Сенсей."
201020-27 = "Только не говорите..."
201020-28 = "Если вы ничего конкретного не придумали, я вернусь к себе и немного поработаю."
201020-29 = "[s3] «Т-ты шутишь? У меня всё расписано по минутам!»\n[s4] «Сегодняшнее свидание: Кивотос глазами местной жительницы!»"
201020-32 = "«Местного»...?"
201020-33 = "Я знаю, что вы уже некоторое время живёте здесь, но, полагаю, в D.U. я прожила значительно дольше вас, Сенсей."
201020-34 = "Что ж, пожалуй, взглянуть на район вашими глазами — не худший способ провести время."
201020-35 = ""
201020-37 = ""
201020-38 = ""
201020-39 = "Начнём?"
201020-41 = "Переулок в Рамини-тауне, город Ширатори"
201020-43 = ""
201020-44 = "Где это мы...?"
201020-45 = "[s5] «Это гастрономическая улица в городе Рамини.»\n[s6] «Здесь можно попробовать самые разные кухни!»"
201020-48 = "Я видела отчёты о недавней прибыли Рамини-тауна... но одно дело цифры, и совсем другое — увидеть всё своими глазами. Здесь буквально чувствуешь энергию этой суеты."
201020-49 = "Теперь весь переулок занят торговыми палатками, а очереди к ним тянутся до самой главной дороги."
201020-50 = "...Я и не понимала, насколько здесь тесно. Нужно будет выделить больше ресурсов для организации пешеходного потока."
201020-51 = "Надо записать, чтобы связаться с Валькирией и попросить направить сюда сотрудников—"
201020-52 = "[s] «Весь смысл сегодняшнего дня в том, чтобы НЕ думать о работе, Рин.»"
201020-53 = ""
201020-55 = ""
201020-56 = "О! Сенсей!"
201020-57 = "Снова один? Сегодня сделаю особую скидку — заходи, заходи!"
201020-58 = "[s7] «Здравствуйте, давно не виделись.»\n[s8] «Вообще-то сегодня со мной студент.»"
201020-61 = "Что? Вывел студента погулять — и притащил его в эту дыру?"
201020-62 = "Она заслуживает чего-то получше уличной еды! Отведи её в приличный ресторан!"
201020-63 = "Не пользуйся своей популярностью и обращайся со студентами как следует!"
201020-64 = "С таким отношением ты однажды точно влипнешь! Ха-ха-ха!"
201020-65 = "[s] «Я это учту...»"
201020-66 = "(Сенсей здесь совсем как свой. Горожане обращаются с ним как с обычным местным.)"
201020-67 = ""
201020-69 = "[ns] «Посмотрим... Что сегодня за блюдо дня?»"
201020-70 = "Хм... Советую якисобу с морепродуктами. Сегодня утром из порта Канэсаки привезли свежайших кальмаров."
201020-71 = "[s] «Тогда две якисобы с морепродуктами!»"
201020-72 = "Сейчас будет!"
201020-73 = ""
201020-75 = ""
201020-79 = ""
201020-80 = "Держите! Две якисобы с морепродуктами. Ешьте, пока горячее!"
201020-81 = "С-Спасибо."
201020-82 = ""
201020-84 = ""
201020-85 = "...Давно я не ела якисобу."
201020-86 = "[s9] «Ах. Я заказал, даже не спросив тебя.»\n[s10] «Прости. Ты не любишь якисобу?»"
201020-89 = "Нет-нет. Дело не в этом."
201020-90 = "Обычно я работаю даже во время еды, поэтому выбираю что-нибудь простое и быстрое."
201020-91 = "Мне редко удаётся поесть что-то вроде якисобы. Лапша быстро размокает, поэтому её лучше есть сразу после приготовления."
201020-92 = "Но когда президент Генерального ученического совета была здесь..."
201020-93 = "Как бы занята она ни была, она всегда находила время ненадолго остановиться и перекусить. Если подумать, мы часто ели вот такую уличную еду."
201020-94 = ""
201020-96 = ""
201020-97 = "Так что для меня это скорее ностальгия. Рада, что вкус совсем не изменился."
201020-98 = "Правда? Сейчас так сложно понять, что нравится студентам, поэтому мне прямо душу греет такое слышать!"
201020-99 = "Клянусь, будто ещё вчера все помешались на том, чтобы делать еду настолько острой, насколько вообще возможно! А теперь модно заливать всё сыром."
201020-100 = "Вот и думаю, не пора ли менять рецепт, чтобы не отставать от времени."
201020-101 = "Умение приспосабливаться к переменам важно, но не менее важно сохранять нашу культуру и ценности."
201020-102 = "...Потому что всегда найдутся те, кто скучает по привычным временам."
201020-103 = "Умеешь ты успокоить старика. Ха-ха-ха!"
201020-104 = ""
201020-106 = ""
201020-107 = "А теперь, когда я тебя получше разглядел... Лицо-то знакомое! Я обычно клиентов не забываю!"
201020-108 = "А, я..."
201020-109 = "[s11] «Это Ринни!»\n[s12] «Она главный администратор Генерального ученического совета!»"
201020-110 = "Не называйте меня Ринни."
201020-112 = "А, точно! Я видел тебя на экстренной пресс-конференции Кронос. Исполняющая обязанности президента, верно?"
201020-113 = "А на свидание-то как нарядилась! Вот почему я тебя не узнал. Ха-ха!"
201020-114 = "Это не свидание..."
201020-115 = "Очень кстати. В последнее время у меня тут одна проблема. Может, поможешь?"
201020-116 = "С водоснабжением D.U. что-то не так? В последнее время воду отключают когда вздумается!"
201020-117 = "Вчера я чуть не закрылся в минус, потому что воду перекрыли прямо посреди дня. И ни слова предупреждения!"
201020-118 = "От имени Генерального ученического совета приношу искренние извинения за причинённые неудобства."
201020-119 = "Мы всё ещё восстанавливаем Башню Санктум, которая в значительной степени отвечает за управление инфраструктурой Кивотоса. Пока ремонт не завершён, подобные перебои могут повторяться."
201020-120 = "Недавно мы увеличили число сотрудников, работающих над Башней, поэтому просим вас проявить ещё немного понимания."
201020-121 = "К-Конечно. Теперь мне даже неловко, что я жаловался."
201020-122 = ""
201020-124 = ""
201020-125 = "[ns] «А? Я думал, восстановление уже закончили.»"
201020-126 = "Само здание — да, конструктивно оно восстановлено. Но Башня Санктум бессмысленна без операционной системы, и именно с ней у нас больше всего проблем. Пока мы установили временные решения, чтобы вернуть жителям электричество и воду."
201020-127 = "ОС Башни Санктум, как и многие другие сверхъестественные технологии Кивотоса, была понятна только президенту. В её отсутствие мы ещё могли поддерживать систему, но восстановить её с нуля — совсем другое дело."
201020-128 = "Временная система работает достаточно хорошо, но до возможностей исходной системы управления ей далеко."
201020-129 = "[ns13] «(О нет. У Рин включился рабочий режим.)»\n[ns14] «(Нужно любой ценой увести разговор подальше от работы!)»"
201020-132 = "[ns] «Раз уж мы поели, хочешь что-нибудь посмотреть?»"
201020-133 = "У вас есть что-то конкретное на примете?"
201020-134 = "[s15] «Недавно вышел новый фильм, который очень нравится студентам.»\n[s16] «Ты слышала о „Большом приключении Шуппо“?»"
201020-137 = "«Сюппо»... Это тот щенок-талисман, который победил в конкурсе персонажей, устроенном Управлением дорог D.U. и Транспортным отделом?"
201020-138 = "Согласно отчётам, его выбрали как самый «безопасный» вариант, поскольку использование персонажей Momo Friends в официальных документах вызывало слишком много проблем."
201020-139 = "Но среди студентов он так и не прижился, поэтому многие отделы критикуют проект как пустую трату ресурсов."
201020-140 = "[s17] «П-пока не попробуешь, не узнаешь, верно?»\n[s18] «Может, это из тех вещей, которые нужно увидеть своими глазами?»"
201020-143 = "Хм... Хорошо. Заодно смогу лично оценить эффект и возможные улучшения."
201020-144 = "[s] «ПОЖАЛУЙСТА, перестань думать о работе!!»"
201020-146 = "Но, похоже, Рин просто не умела думать ни о чём, кроме работы."
201020-148 = "Перед кинотеатром в D.U."
201020-149 = "[ns19] «Фильм оказался серьёзнее, чем я ожидал...»\n[ns20] «А что думаешь ты, Рин?»"
201020-152 = "Хм. Я думаю..."
201020-153 = "Проход к аварийному выходу слишком узкий для зала такого размера."
201020-154 = "При эвакуации такой узкий проход может создать затор и подвергнуть жителей опасности. Позже придётся направить заведению предписание и проверить, соответствует ли всё здание нормам."
201020-155 = "[s] «ВОТ что ты вынесла из фильма?!»"
201020-157 = "Я надеялся, что по ходу дня она всё-таки выйдет из «рабочего режима», но..."
201020-159 = "Сенсей, вы взяли чек за ту одежду?"
201020-160 = "Даже если платили наличными и покупали для себя, пожалуйста, сохраняйте чеки для налоговой отчётности."
201020-161 = "Что? Вы скрываете свои покупки от одной конкретной особы?"
201020-162 = "Вы ведь не имеете в виду кого-то из Казначейства, правда?"
201020-164 = ""
201020-165 = "Сумомо, я сейчас в центре Аоба..."
201020-166 = "Башню Сэйун должны были снести ещё в прошлом месяце, разве нет? Почему я до сих пор вижу её здесь?"
201020-167 = "...Итак, если подытожить, снос отложили, потому что переговоры о стоимости с подрядчиком зашли в тупик?"
201020-168 = "Об этом следовало доложить мне сразу же."
201020-169 = "...Пожалуйста, предоставьте подробный отчёт о причинах произошедшего к следующему вторнику."
201020-170 = ""
201020-171 = "Куда бы мы ни шли, Рин всё равно ставила работу выше собственного отдыха."
201020-173 = "[ns21] «(Этого не было в моём первоначальном плане...)»\n[ns22] «(Но, похоже, придётся прибегнуть к крайним мерам!)»"
201020-176 = "...Что это?"
201020-178 = "[ns] «Мы в игровом центре!»"
201020-180 = "[ns23] «Какое же свидание выходного дня без игрового зала!»\n[ns24] «Ты раньше бывала в игровом зале, Рин?»"
201020-181 = "Это не свидание... Я уже устала поправлять вас."
201020-182 = "...Но нет. Даже до вступления в Генеральный ученический совет я ни разу там не бывала."
201020-183 = "Нет, для меня это впервые. Даже до вступления в Генеральный ученический совет я ни разу там не бывала."
201020-184 = "[s] «Как это вообще возможно?»"
201020-185 = "Это настолько удивительно? Я просто никогда не видела причины туда ходить."
201020-186 = "Видеоигры меня особо не интересовали, да и таланта к ним у меня нет."
201020-187 = "И для учёбы или работы они бесполезны. Поэтому я не видела смысла тратить на них время."
201020-188 = "[s25] «Выходит, даже у тебя есть слабости, Рин.»\n[s26] «В таком случае...»"
201020-191 = ""
201020-194 = "[ns27] «...Сразись со мной в Student Fighter 2!»\n[ns28] «Победитель сможет потребовать от проигравшего что угодно!»"
201020-197 = "Что? Вы ведь не серьёзно..."
201020-198 = "К тому же шансы слишком сильно на вашей стороне. Я даже не знаю, как играть."
201020-199 = "[s29] «Так ты убегаешь, Нанагами Рин?»\n[s30] «Если боишься проиграть, так и скажи!»"
201020-202 = "Дворовые подначки на меня не действуют."
201020-203 = ""
201020-206 = "И вообще, ставка не обязательна. Если цель — развлечься, я бы предпочла играть без каких-либо последствий."
201020-207 = "Хм? Вы решили, что без достаточно высокой ставки мне будет неинтересно?"
201020-208 = "*вздох* Не беспокойтесь об этом. Вы прямо как она..."
201020-209 = ""
201020-210 = "Ринни, Ринни! Хочешь сыграть в реверси? Я нашла старую коробку в кладовой!"
201020-211 = "Давай на что-нибудь поспорим! Проигравший покупает победителю напиток!"
201020-212 = "А? Но если я ничего не ставлю, ты ведь никогда не играешь всерьёз, Ринни."
201020-213 = "Я хочу, чтобы тебе было так же интересно, как и мне!"
201020-214 = ""
201020-215 = "А-а-а?! Я всего лишь моргнула, а ты уже заполнила всю доску чёрными фишками!"
201020-216 = ""
201020-217 = ""
201020-218 = "...Ладно. Я принимаю ставку, при условии что просьба останется в разумных пределах."
201020-219 = "[s] «А что для тебя значит „разумных“?»"
201020-220 = "Именно то, что звучит разумно. Например, купить победителю напиток или сделать за него работу..."
201020-221 = "О вас ходит немало слухов, но я уверена, что вы не станете всерьёз просить студента о чём-то абсурдном — например, лизать вам ноги или вставать на четвереньки."
201020-222 = ""
201020-225 = "Пожалуй, какая-нибудь награда действительно сделает игру интереснее."
201020-226 = "Раз уж мы всё равно здесь, стоит получить от этого максимум."
201020-227 = ""
201020-229 = ""
201020-230 = ""
201020-231 = "Но первый раунд дайте мне на то, чтобы привыкнуть к управлению."
201020-232 = ""
201020-233 = "РАУНД 1, БОЙ!"
201020-234 = ""
201020-236 = ""
201020-237 = ""
201020-238 = "Так, вот мои приёмы. Понятно."
201020-239 = ""
201020-241 = ""
201020-242 = ""
201020-243 = "Эта кнопка — блокировать атаку..."
201020-244 = "Теперь я понимаю."
201020-245 = ""
201020-246 = "[USERNAME], ПОБЕДА!"
201020-247 = "...Продолжим."
201020-248 = ""
201020-249 = "РАУНД 2, БОЙ!"
201020-250 = "Мой персонаж сильнее на дистанции... Если просто держать давление..."
201020-251 = ""
201020-253 = ""
201020-254 = ""
201020-255 = "А затем ударить снизу..."
201020-256 = ""
201020-258 = ""
201020-259 = ""
201020-260 = ""
201020-261 = ""
201020-262 = "НАНАГАМИ РИН, ПОБЕДА!"
201020-263 = "ФИНАЛЬНЫЙ РАУНД!"
201020-264 = ""
201020-266 = ""
201020-267 = ""
201020-268 = "..."
201020-269 = ""
201020-271 = ""
201020-272 = ""
201020-273 = ""
201020-274 = "..."
201020-275 = ""
201020-277 = ""
201020-278 = ""
201020-279 = ""
201020-280 = ""
201020-281 = ""
201020-282 = ""
201020-283 = ""
201020-284 = ""
201020-285 = "НАНАГАМИ РИН, ИДЕАЛЬНАЯ ПОБЕДА!"
201020-286 = ""
201020-287 = "[ns31] «...ИДЕАЛЬНАЯ ПОБЕДА?!»\n[ns32] «Ты ТОЧНО никогда раньше не играла?»"
201020-290 = "Я ведь сказала, когда мы только пришли... Это мой первый раз в игровом центре."
201020-291 = "И нет, в игры этого жанра я тоже раньше не играла. Но ведь нужно всего лишь вовремя нажимать кнопки атаки и блока, разве нет?"
201020-292 = "Это определённо проще, чем работать в Генеральном ученическом совете. Там я должна быть готова отреагировать на что угодно и в любую секунду."
201020-293 = "[s33] «Говоришь так, будто это проще простого...»\n[s34] «Возможно, у тебя талант гениального игрока...»"
201020-296 = "Вы мне льстите. Даже если у меня есть какие-то задатки, любой человек, который действительно хорошо играет, наверняка рассмеялся бы над таким утверждением."
201020-297 = "Например..."
201020-298 = ""
201020-300 = ""
201020-301 = "...Сенсей. Немного рановато, но можно я прямо сейчас озвучу свою просьбу?"
201020-302 = "[s35] «Я не против...»\n[s36] «Но ты уверена? Вокруг нас много людей.»"
201020-305 = "Да о чём вы вообще думаете?!"
201020-306 = "...Я хочу попросить вас сходить со мной в одно место."
201020-307 = "Есть человек, с которым я хочу поговорить."
201020-309 = "Следующий Эпизод;Ферзевый гамбит"
