[translation]
201020-1 = "Episódio 2; A Folga da Administradora-Chefe (2)"
201020-2 = "Em frente ao prédio do Conselho Estudantil Federal"
201020-3 = "（Sábado de manhã）"
201020-4 = "（A figura de Rin parada em frente ao edifício é――）"
201020-5 = ""
201020-7 = ""
201020-8 = "[ns] \"Rin......?\""
201020-9 = "...... É um mal-entendido."
201020-10 = "Dá para ver pela sua cara o que está pensando, então é um mal-entendido.#nDeixe-me explicar antes de mais nada."
201020-11 = "[s] \"Pode falar, sou todo ouvidos.\""
201020-12 = "Hoje de manhã, quando acordei no dormitório, fui vestir o meu uniforme como de costume."
201020-13 = "Só que a Aoi―― quer dizer, a Diretora Financeira disse que 'assim pareceria que estou trabalhando de novo' e levou embora todos os meus uniformes......"
201020-14 = "...... Então não tive outra escolha a não ser vestir isso aqui. Por favor, releve."
201020-15 = "[s1] \"Ué, mas achei que ficou ótimo em você!\"\n[s2] \"Combinou super bem, ficou uma graça!\""
201020-18 = "............"
201020-19 = "...... Repito mais uma vez: não considero isso um encontro."
201020-20 = "[s] \"Tudo bem. Eu considero!\""
201020-21 = "O quê......?!"
201020-22 = "Ai...... vou fingir que não ouvi essa."
201020-23 = "Se eu for reagir a cada gracinha sua, o dia de folga vai acabar antes da hora."
201020-24 = "...... E então, qual é a programação de hoje?"
201020-25 = "[s] \"Ué? Eu que tenho que decidir aonde vamos?\""
201020-26 = "Não foi o Sensei quem me convidou?"
201020-27 = "Não me diga que......"
201020-28 = "Se veio sem plano nenhum, estou voltando agora mesmo para os meus aposentos――"
201020-29 = "[s3] \"N-Não, imagina! O plano tá montado e tinindo!\"\n[s4] \"Preparei o melhor roteiro possível pela visão dos nativos!\""
201020-32 = "Visão dos nativos......"
201020-33 = "Tenho a impressão de que moro em D.U. há bem mais tempo do que você, mas......"
201020-34 = "...... Bem, conhecer D.U. através dos olhos do Sensei não parece ser uma má ideia."
201020-35 = ""
201020-37 = ""
201020-38 = ""
201020-39 = "Então, vamos indo?"
201020-41 = "Distrito de Shiratori - Beco nos arredores da antiga Raminy Town"
201020-43 = ""
201020-44 = "Onde estamos......?"
201020-45 = "[s5] \"É o point gastronômico de rua de Raminy Town!\"\n[s6] \"Um lugar cheio de barraquinhas com todo tipo de rango!\""
201020-48 = "Já tinha ouvido falar por alto...... mas não imaginava que fosse tão movimentado."
201020-49 = "Tantas barracas...... algumas até com filas enormes."
201020-50 = "Hum...... acho melhor reavaliar o patrulhamento de segurança desta região."
201020-51 = "Mais tarde vou contatar a Valkyrie para――"
201020-52 = "[s] \"A gente combinou de esquecer o trabalho hoje, lembra......?\""
201020-53 = ""
201020-55 = ""
201020-56 = "Opa, Sensei!"
201020-57 = "Sozinho de novo hoje, chefia? Se ainda não almoçou, cola aqui na minha barraca que faço um preço camarada!"
201020-58 = "[s7] \"E aí, tudo bom?\"\n[s8] \"Hoje eu tô acompanhado de uma aluna!\""
201020-61 = "Hã?! Qual é, rapaz, você trouxe uma garota pra comer em Raminy?!"
201020-62 = "Numa hora dessas a gente leva a moça num restaurante de respeito!"
201020-63 = "Sei que você é mó famosão com a mulherada da escola e tal.#nMas trazer a garota pra comer rango de rua é mancada, hein? Cadê o romantismo?"
201020-64 = "Desse jeito ela vai te dar um belo de um fora, hein!"
201020-65 = "[s] \"Vou levar essa lição pra vida......\""
201020-66 = "（...... O Sensei parece ser bem chegado com os cidadãos locais）"
201020-67 = ""
201020-69 = "[ns] \"O que tem de bom saindo hoje?\""
201020-70 = "Deixa eu ver...... que tal o yakisoba de frutos do mar?#nChegou uma remessa de lula fresquinha lá do Porto de Kanesaki hoje cedo!"
201020-71 = "[s] \"Manda dois no capricho, então!\""
201020-72 = "É pra já! Valeu pela preferência!"
201020-73 = ""
201020-75 = ""
201020-79 = ""
201020-80 = "Saindo no capricho! Dois yakisobas de frutos do mar! Comam enquanto tá pelando de quente!"
201020-81 = "O-Obrigada."
201020-82 = ""
201020-84 = ""
201020-85 = "...... Pensando bem, faz bastante tempo que não como yakisoba."
201020-86 = "[s9] \"Eita, desculpa! Pedi sem nem te perguntar antes......\"\n[s10] \"Por acaso você não curte yakisoba?\""
201020-89 = "Não, não é isso."
201020-90 = "É que na correria eu só como lanches rápidos que dê para engolir enquanto trabalho......"
202020-91 = "Raramente tenho a oportunidade de saborear uma refeição recém-saída da chapa assim.#nAinda mais comida de barraca de rua."
201020-92 = "...... Embora na época da Presidente do Conselho fosse diferente."
201020-93 = "Não importava o quanto estivesse atolada de serviço, ela sempre arrumava tempo para beliscar um lanche.#nEu sempre a acompanhava, e a gente comia muita comida de rua juntas."
201020-94 = ""
201020-96 = ""
201020-97 = "Que delícia...... tem aquele mesmo gostinho nostálgico de antigamente."
201020-98 = "Fico feliz demais em ouvir isso, moça! O gosto da garotada de hoje tá difícil de decifrar."
201020-99 = "Até outro dia a moda era pimenta braba de arrancar o bico, agora inventaram de tacar queijo em absolutamente tudo, sabia?"
201020-100 = "Vendo essas modinhas, eu tava até matutando se não devia mudar a receita da casa."
201020-101 = "Acho importante se adaptar às mudanças, sim.#nMas preservar a tradição de um sabor autêntico tem o mesmo valor."
201020-102 = "...... Afinal, por mais que o mundo mude depressa, sempre há momentos em que bate a saudade daquele sabor marcante."
201020-103 = "Ouvir você falar isso até me dá um ânimo novo pra continuar firme na labuta, hahaha!"
201020-104 = ""
201020-106 = ""
201020-107 = "...... Mas vem cá, moça, cê já não veio comer aqui antes? Seu rosto não me é estranho."
201020-108 = "Ah, eu sou......"
201020-109 = "[s11] \"É a Rin-chan!\"\n[s12] \"É a Administradora-Chefe do Conselho Estudantil Federal!\""
201020-110 = "Quem você tá chamando de \"Rin-chan\"?"
201020-112 = "Caramba, agora eu lembrei! Vi você no canal da Chronos!#nÉ a Presidente Interina daquela coletiva de emergência!"
201020-113 = "Cê tá toda arrumadinha de civil que nem te reconheci!"
201020-114 = "Não, não é nada disso――"
201020-115 = "Aproveitando a prosa, deixa eu te perguntar uma coisa."
201020-116 = "Deu algum xabu na rede de água de D.U.? De vez em quando a torneira seca do nada."
201020-117 = "Ontem mesmo cortou sem aviso prévio. Quase tive que baixar as portas da barraca mais cedo!"
201020-118 = "Peço imensas desculpas por esse transtorno."
201020-119 = "A restauração da Sanctum Tower, responsável pela gestão da infraestrutura, ainda não terminou.#nPor conta disso, o fornecimento de luz e água tem sofrido oscilações ocasionais."
201020-120 = "Estamos reforçando o efetivo de manutenção, então peço um pouco de compreensão por enquanto."
201020-121 = "Ah, não, puxa vida...... agora até me senti mal por ter reclamado......"
201020-122 = ""
201020-124 = ""
201020-125 = "[ns] \"Mas a reconstrução da Sanctum Tower não tinha sido concluída?\""
201020-126 = "A reconstrução da estrutura física do edifício foi concluída.#nNo entanto, o sistema central de controle da Sanctum Tower ainda não foi recuperado......#nAtualmente, estamos apenas segurando as pontas com equipamentos substitutos provisórios."
201020-127 = "Como mencionei antes, o sistema de controle da Sanctum Tower só podia ser operado exclusivamente pela Presidente do Conselho.#nDar manutenção em algo existente é uma coisa, mas recriar aquilo do zero é um desafio de outra dimensão."
201020-128 = "Tivemos a sorte de manter o básico funcionando com os sistemas reservas, mas......#na capacidade de operação nem se compara com o potencial original da torre......"
201020-129 = "[ns13] （Ixi, a Rin entrou de cabeça no modo trabalho......）\n[ns14] （Preciso mudar de assunto rápido!）"
201020-132 = "[ns] \"Já que a barriga tá cheia, que tal a gente ir ver um filme?\""
201020-133 = "Tem alguma recomendação em mente?"
201020-134 = "[s15] \"Tem um filme novo que tá bombando entre as alunas em cartaz!\"\n[s16] \"Já ouviu falar de 'A Grande Aventura de Shuppo'?\""
201020-137 = "Shuppo...... se não me engano, é aquele cachorrinho mascote adotado no concurso de design do Departamento de Trânsito de D.U."
201020-138 = "Disseram que abriram o concurso público alegando que os 'Momo Friends' eram inadequados para documentos oficiais, mas......"
201020-139 = "Pelo que soube, a receptividade do público foi um fiasco total.#nOs outros setores vivem criticando dizendo que foi puro desperdício de dinheiro público."
201020-140 = "[s17] \"Opinião é que nem braço, cada um tem os seus......\"\n[s18] \"Vai ver assistindo ao filme a impressão seja outra!\""
201020-143 = "É verdade. É uma excelente oportunidade para eu conferir de perto a reação da população na sala de cinema."
201020-144 = "[s] \"Mulher, esquece o trabalho um minuto......\""
201020-146 = "（Mesmo depois disso, a Rin continuou pensando em trabalho o tempo inteiro......）"
201020-148 = "Em frente a um cinema no centro de D.U."
201020-149 = "[ns19] \"Até que a história foi bem mais séria do que parecia, né......\"\n[ns20] \"O que você achou, Rin?\""
201020-152 = "Vejamos......"
201020-153 = "Achei que o corredor de acesso às saídas de emergência é estreito demais para a capacidade total da sala."
201020-154 = "Em caso de evacuação, aquilo vai virar um gargalo extremamente perigoso.#nVou expedir uma recomendação para alargarem aquele espaço imediatamente."
201020-155 = "[s] \"Você tava prestando atenção NISSO?!\""
201020-157 = "（Tentei caminhar pela cidade para espairecer a cabeça dela, mas......）"
201020-159 = "Sensei, você pegou a nota fiscal daquelas roupas que comprou agora há pouco?"
201020-160 = "É fundamental guardar os comprovantes para manter o controle exato dos seus gastos."
201020-161 = "Como disse? Tem alguém que você prefere que não veja os seus recibos......?"
201020-162 = "Não vai me dizer que está com medo da Diretora Financeira, vai?"
201020-164 = ""
201020-165 = "Sumomo, estou aqui na área central de Aoba."
201020-166 = "A demolição da Torre Seiun não estava agendada para o mês passado?#nPor que ela ainda continua de pé?"
201020-167 = "...... Como? Foi adiada? As negociações de custos com a empreiteira travaram?"
201020-168 = "...... Essa informação não constava em nenhum dos meus relatórios."
201020-169 = "...... Exijo uma justificativa formal por escrito na minha mesa até terça-feira."
201020-170 = ""
201020-171 = "（A Rin estava tão atolada nas preocupações do Conselho que não conseguia curtir a folga de jeito nenhum）"
201020-173 = "[ns21] （Eu não pretendia vir até aqui, mas......）\n[ns22] （É o único jeito de tirar a cabeça dela do trabalho!）"
201020-176 = "...... Sensei, que lugar é esse?"
201020-178 = "[ns] \"É um fliperama!\""
201020-180 = "[ns23] \"Encontro de verdade no fim de semana tem que ter fliperama!\"\n[ns24] \"Você já entrou num fliperama antes?\""
201020-181 = "Já disse que não é um enc―― quer saber, cansei de corrigir."
201020-182 = "...... Um fliperama? É a primeira vez na minha vida que piso num lugar desses."
201020-183 = "Sim, primeira vez absoluta."
201020-184 = "[s] \"Sério mesmo?!\""
201020-185 = "...... Nunca tive motivo para vir."
201020-186 = "E nunca tive o menor interesse."
201020-187 = "É algo perfeitamente dispensável para a minha rotina, então nunca achei que valesse a pena gastar tempo aqui."
201020-188 = "[s25] \"Pelo visto tem coisas que nem a Rin domina, né?\"\n[s26] \"Então é o seguinte......\""
201020-191 = ""
201020-194 = "[ns27] \"Vamos disputar uma partida de 'Student Fighter 2'!\"\n[ns28] \"Quem perder vai ter que realizar um desejo do vencedor!\""
201020-197 = "Hã? De onde tirou essa loucura do nada?"
201020-198 = "Eu nem faço ideia de como se joga, o que você pretende com isso......"
201020-199 = "[s29] \"Se tiver com medinho de perder, pode fugir, tá?\"\n[s30] \"Se tá com medo da derrota, é só admitir logo!\""
201020-202 = "Provocação barata não funciona comigo."
201020-203 = ""
201020-206 = "Para começo de conversa, não vejo lógica em envolver apostas numa partida.#nSe jogássemos normalmente――"
201020-207 = "Como disse? Ter algo em jogo faz a gente se dedicar mais?"
201020-208 = "Que disparate...... você fala exatamente como uma certa pessoa falava――"
201020-209 = ""
201020-210 = "Rin-chan, Rin-chan! Vamos jogar Othello?#nAchei esse jogo no depósito!"
201020-211 = "Quem perder vai ter que pagar um suquinho pro outro, fechado?"
201020-212 = "Ué, se a gente não apostar nada, você vai jogar com preguiça, né?"
201020-213 = "Pra tirar o melhor da Rin-chan...... é uma batalha com tudo!"
201020-214 = ""
201020-215 = "Uaaaaa...... perdi de novo!"
201020-216 = ""
201020-217 = ""
201020-218 = "...... Se for um pedido dentro dos limites do bom senso, eu aceito."
