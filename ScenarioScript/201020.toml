201020-287 = "[ns31] \"Tomei um PERFECT sem nem encostar um golpe nela?!\"\n[ns32] \"É sério mesmo que é a sua primeira vez jogando?!\""
201020-290 = "Sim, acabei de dizer que é a minha primeira vez."
201020-291 = "Na verdade, é a primeira vez que jogo qualquer tipo de videogame na vida.#nMas depois que compreendi a mecânica, revelou-se bem elementar."
201020-292 = "Como exige um número reduzido de tarefas simultâneas, foi fácil manter a concentração.#nComparado às demandas do Conselho Estudantil Federal, isso aqui é trivialidade pura......"
201020-293 = "[s33] \"Que talento assustador......\"\n[s34] \"Acho que a Rin tem vocação oculta pra ser pro-player de games......\""
201020-296 = "Está me superestimando demais. Perto de quem realmente se dedica aos jogos a sério, eu não sou ninguém."
