[translation]
2002902-1 = "Летняя леди"
2002902-2 = "Коридор отеля"
2002902-3 = ""
2002902-4 = ""
2002902-5 = "Я взяла пляжный зонт, полотенце, немного еды, стул, сумку-холодильник..."
2002902-6 = "...очки для плавания, круг и запасной купальник. Говорят, слишком подготовленным быть нельзя, но этого должно хватить, Сенсей!"
2002902-7 = "[s1] «Ого... спа...сибо?»\n[s2] «Ты уверена, что „слишком подготовиться“ невозможно...?»"
2002902-10 = "Заместитель главы Комитета внутренней дисциплины должна быть готова к любому возможному развитию событий! Это часть работы!"
2002902-11 = "С-Сенсей? Почему вы забираете все вещи? Ох, ох нет! Мне будет неловко, если заставлю вас нести их за меня!"
2002902-12 = "Но, пожалуй... мне также будет неловко отказать вам... Тогда, если вы настаиваете, Сенсей! Спасибо!"
2002902-13 = "Тогда, Сенсей, прежде чем мы пойдём на пляж..."
2002902-14 = ""
2002902-16 = ""
2002902-18 = ""
2002902-19 = "*раскрывает объятия*"
2002902-20 = ""
2002902-23 = "[ns] «Мимори? П-Почему ты раскрыла руки?»"
2002902-24 = "Хи-хи. Пожалуйста, обнимите меня перед тем, как мы пойдём."
2002902-25 = "[s] «Ты ведь не про... окситоциновые объятия?!»"
2002902-26 = "Да, Сенсей. Именно про них."
2002902-27 = "Ну же, у нас не так много времени."
2002902-28 = "[s3] «Ах, но мы же прямо в коридоре...»\n[s4] «Если нас кто-нибудь увидит... разве не будет немного неловко?»"
2002902-31 = "Ах... Значит, мои объятия вам не нужны...?"
2002902-32 = "[s5] «На этот вопрос довольно сложно ответить!»\n[s6] «Д-Давай сначала доберёмся до пляжа! Сегодня отличная погода!»"
2002902-35 = "М-м..."
2002902-37 = ""
2002902-41 = "Пляж"
2002902-42 = ""
2002902-43 = "По дороге на пляж я пытался понять настроение Мимори."
2002902-44 = ""
2002902-47 = "Вела она себя как обычно, но казалась немного расстроенной."
2002902-48 = ""
2002902-50 = ""
2002902-51 = "Зонт раскрыт, коврик расстелен. Благодаря вашей помощи всё прошло гладко, Сенсей."
2002902-52 = "Хм? Конечно, со мной всё хорошо. Как и всегда. Почему спрашиваете?"
2002902-53 = "Без особой причины? Ах, ну, раз вы так говорите."
2002902-54 = "Итак, Сенсей, чем вы хотите заняться сначала? Поиграть в море? Понырять? Или... позагорать?"
2002902-55 = "[s] «М-Может, позагораем...»"
2002902-56 = "Ах, позагорать. Тогда ложитесь вот здесь. Я нанесу на вас солнцезащитный крем."
2002902-57 = ""
2002902-59 = ""
2002902-61 = ""
2002902-62 = ""
2002902-63 = ""
2002902-64 = "Щекотно? Ох, потерпите ещё немного. Если я нанесу крем не везде, некоторые участки кожи могут обгореть!"
2002902-65 = ""
2002902-67 = ""
2002902-71 = "Так, готово. Я освобожу для вас место вот здесь, так что..."
2002902-72 = "Я? Я буду наблюдать из тени под зонтом, Сенсей."
2002902-73 = "Кстати, не забудьте про солнцезащитные очки!"
2002902-75 = "Тронутый заботой Мимори, я лёг на солнечном месте."
2002902-76 = ""
2002902-81 = "Под тёплым солнцем и шум волн я постепенно задремал."
2002902-82 = ""
2002902-89 = ""
2002902-92 = "Через некоторое время я проснулся от прохладного ветерка."
2002902-93 = "Он дул мне в затылок — мягко и успокаивающе."
2002902-94 = ""
2002902-96 = ""
2002902-98 = "О, Сенсей. Вы проснулись?"
2002902-99 = ""
2002902-101 = "[ns] «Мимори?!»"
2002902-102 = ""
2002902-103 = "[ns7] «...А, понятно. Ты всё это время обмахивала меня.»\n[ns8] «И ещё устроила мне подушку из коленей?»"
2002902-106 = "Конечно. Как член Комитета внутренней дисциплины, я просто стараюсь стать настоящей леди."
2002902-107 = "Тогда, думаю, нам стоит..."
2002902-108 = ""
2002902-110 = "[ns] «...»"
2002902-111 = "Неловкое молчание продолжалось."
2002902-112 = ""
2002902-114 = "[ns] «Н-Ну, погода всё ещё отличная! Может, прогуляемся?»"
2002902-115 = "Ах, Сенсей. Если так резко встать...!"
2002902-116 = ""
2002902-118 = "[ns9] «Ох...?»\n[ns10] «У-У меня вдруг закружилась голова...»"
2002902-122 = ""
2002902-124 = "Сенсей!"
2002902-125 = ""
2002902-127 = ""
2002902-128 = ""
2002902-130 = ""
2002902-131 = "[ns] «Ох... Мимори...?»"
2002902-132 = "Когда я пришёл в себя, понял, что лежу в объятиях Мимори."
2002902-133 = "..."
2002902-134 = "Хи-хи."
2002902-135 = "Похоже, у нас всё-таки получились окситоциновые объятия!"
2002902-136 = "[s] «П-П-П-Получились?!»"
2002902-137 = "Осторожно, осторожно..."
2002902-138 = "Я помогу вам до самого конца!"
2002902-139 = ""
2002902-141 = ""
2002902-142 = "Я медленно поднялся с помощью сияющей от радости Мимори."
2002902-144 = ""
2002902-148 = "Вместе мы приятно прогулялись вдоль пляжа."
