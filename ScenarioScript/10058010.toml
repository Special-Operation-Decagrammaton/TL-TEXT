[translation]
10058010-1 = "Episode 1;The Souvenir is the Championship Trophy"
10058010-3 = "Listen! It's a huge emergency!"
10058010-4 = "The pillows are stuffed with actual cotton!"
10058010-5 = "Whoa, seriously! And I don't mean polyester, it's actual cotton!"
10058010-6 = "With the accommodation being free... does that mean we can use these fluffy pillows as much as we want?"
10058010-7 = "Obviously! I'm gonna go ask later if we can take one home as a souvenir~"
10058010-8 = "Water even came straight out of the faucet when I turned the handle."
10058010-9 = "It just comes out like that without having to leave it running all night? Amazing~!"
10058010-10 = "Gehenna really is a bourgeois academy..."
10058010-11 = "Ah! Right, I need to take a picture! #nIf I go back and tell everyone, they won't believe me!"
10058010-20 = "Captain Anna, I've spotted the target of our report outside the window."
10058010-21 = "What is it, Agent Rana? Please give me your report."
10058010-22 = "At 12 o'clock... I've confirmed a buffet being prepared in the resort courtyard."
10058010-23 = "A buffet!? An all-you-can-eat one?!"
10058010-24 = "All troops, charge!!!"
10058010-25 = "Running at full speed~! We gotta burn at least a few calories!!"
10058010-30 = "Fufu, as expected of you. #nTo think you'd keep it this fresh all the way at the buffet."
10058010-31 = "Thank you for your hard work, Fuuka."
10058010-32 = "It's thanks to the Gourmet Research Society's new truck. #nIt has enough power to tow the trailer, too."
10058010-33 = "...I'm telling you, don't touch the truck. I will get mad."
10058010-34 = "Oh, there's dessert too?"
10058010-35 = "Don't change the subject!!"
10058010-39 = "Everyone here is a main tournament contestant. They look so strong..."
10058010-40 = "Whaddya getting so timid for?! #nWe're contestants too, so let's puff out our chests and march right in!"
10058010-41 = "Huh, come to think of it, where's Rana? #nIf she gets separated from us in a crowded place like this, she'll get lost..."
10058010-42 = "Amazing. It's true that would make it simple."
10058010-43 = "We could reduce even more parts, but... #nthere's a risk of ignition."
10058010-44 = "...That's Rana's voice!"
10058010-51 = "Where were you going? With so many people around, you're going to get lost."
10058010-52 = "That's my line!!"
10058010-53 = "Let me introduce them. These are members of Millennium Science School's Engineering Department."
10058010-54 = "Their club president, Utaha Shiraishi."
10058010-55 = "Kotori Toyomi! #nLeave explanations and commentary to me!"
10058010-56 = "Hibiki Nekozuka. My favorite thing is self-destruct functions."
10058010-57 = "Anna Niki from Red Winter Federal Academy. #nAnd this is Elina Niki and Rana Furuhata."
10058010-58 = "By the way... you like self-destruct functions...?"
10058010-59 = "Ah, I slipped..."
10058010-62 = "Do you mean using explosive bolts to detach components? #nOr the kind that completely destroys the whole thing?"
10058010-63 = "Could it be... the kind where gas fills the engine room and a stray spark ignites it?"
10058010-64 = "Or perhaps the kind that erases all data?"
10058010-68 = "Where should we even start talking (discussing)!"
10058010-71 = "...You just do this here, and it's done."
10058010-72 = "Hacking a power plant to make it self-destruct is easier than eating medovik."
10058010-73 = "Fufun. As expected of my Rana!"
10058010-74 = "Haah~!? Whose Rana did you say~?!"
10058010-75 = "I'm moved that you've elevated self-destruction to such an artistic realm."
10058010-76 = "Aside from the fact that it takes three months to overwrite the OS using punch cards, #ntechnically speaking, it's perfect!"
10058010-77 = "No problem. If we parallelize the card readers, one month will be plenty."
10058010-78 = "Plus... if we use the Engineering Department's new polymer material instead of paper, #nwe should be able to cut the weight in half."
10058010-85 = "Even after talking to someone we just met for over 30 minutes..."
10058010-86 = "Nobody is acting surprised or treating us specially..."
10058010-87 = "And they actually listen to our explanations all the way to the end... #nC-Could we exchange contact info? For research cooperation!"
10058010-88 = "Does a VHF frequency count as contact info? #nMomoTalk can't receive signals when the weather is bad."
10058010-89 = "If you don't mind, I'd love to talk like this again."
10058010-90 = "Hey, got a minute?"
10058010-92 = "That tank you guys built... #nDidn't you say the big red one is the self-destruct button so don't press it?"
10058010-93 = "There are like 30 of them, which one is the one we aren't supposed to press?!"
10058010-94 = "It's the red button, 6.2 centimeters in diameter, R155, G17, B30."
10058010-95 = "R-R155... what are you even talking about?! Just tell me where it is normally!"
10058010-96 = "Right beside the start button. The slightly bigger one."
10058010-97 = "Don't put it in such a weird spot! What am I supposed to do if I press it by mistake!?"
10058010-100 = "...Huh? Who are they?"
10058010-101 = "They're from Red Winter."
10058010-102 = "Apparently they built their own tank and entered the race."
10058010-103 = "Built a tank...? Heh, sounds interesting."
10058010-104 = "Neru Mikamo, Maid Club President. #n...I'm entering this race, too."
10058010-105 = "Y-You're participating?! It's a pleasure to meet you!"
10058010-106 = "My club members were making such a fuss about entering... Well, nice meeting ya."
10058010-107 = "Well then! We're rivals! #nBecause we're the ones who are gonna win!"
10058010-108 = "Eh, Elina!? That's suddenly so rude!!"
10058010-109 = "Ha! You've got a great look in your eyes! #nDamn right, if you're gonna enter, you gotta aim for the championship!"
10058010-110 = "Heh-heh~♪ You said it!"
10058010-111 = "I-I was startled... I thought a fight was going to break out..."
10058010-112 = "Also, we don't need a self-destruct button, so take it off. #nIf you won't, I'll just yank it out myself."
10058010-113 = "If you pull that button, it'll trigger the self-destruct anyway, so please be careful!"
10058010-114 = "Why are you trying so hard to make it self-destruct?!"
10058010-115 = "And... um, was it Red Winter? Let's give it our all tomorrow."
10058010-116 = "You better be ready!"
10058010-120 = "I'm glad I met you too. Good luck in tomorrow's race."
10058010-126 = "I see... so this is a competition after all..."
10058010-127 = "It's a race, so... it can't be helped, but..."
10058010-130 = "...That means whoever gets 1st place..."
10058010-131 = "Means someone else can't get 1st place."
10058010-132 = "Yeah. Next, we have to win the main tournament."
10058010-133 = "If we've come this far and lose, it'll just be too frustrating..."
10058010-134 = "The special class got blown away by artillery fire, so if we go back now, we're definitely gonna freeze~!#nHiii~n..."
10058010-135 = "Hmm..."
10058010-136 = "Anna, Elina. What's with you guys suddenly getting so nervous?"
10058010-137 = "I don't know, I just suddenly got all tense..."
10058010-138 = "Everyone else looks so relaxed, right? And look at us, we don't even have a turret!"
10058010-139 = "That's why I said we should make it a rotating turret~..."
10058010-140 = "Opinion exchange, round one..."
10058010-141 = "That's right... It's my fault... When aiming at a target, we have to rotate the whole vehicle body..."
10058010-142 = "?"
10058010-143 = "U-Um, I agreed with it at the time too... #nThere's no point in whining about it now, sorry..."
10058010-144 = "Hiii~n..."
10058010-149 = "(Usually, RWWE would start around now)"
10058010-150 = "(Neither of them even has the energy to fight)"
10058010-151 = "(It's way too peaceful... it feels kind of weird)"
10058010-156 = "Sigh... At times like this, going to a sauna would clear my head..."
10058010-157 = "No way we can have a Red Winter-style sauna in a place like this~"
10058010-158 = "Haah..."
10058010-159 = "(A sauna...!)"
10058010-160 = "(That's right. If we whip our bodies with tree branches dipped in hot water, we should feel refreshed.)"
10058010-161 = "(We've gotta get everyone's energy back up.)"
10058010-165 = "If they tell us to go back to Room 183, we're gonna spend our days living in a tent on a tank...?"
10058010-166 = "Just imagining it makes me cold~"
10058010-167 = "Uwaaahn..."
10058010-172 = "This one doesn't have leaves, so no good."
10058010-176 = "This one's... meh."
10058010-180 = "...This is it!"
10058010-183 = "There's a sound coming from the other side of the bushes..."
10058010-188 = "Koharu-chan, could you bring me a can of white paint?"
10058010-189 = "Yep, leave it to me!"
10058010-190 = "Painting our bodies with swimsuit patterns using this indigo paint sounds like it'd be refreshing."
10058010-191 = "Did the paint fumes fry your brain!?"
10058010-192 = "This green one would make good camo."
10058010-193 = "Ahaha... It's oil-based, so it'll be a pain to wash off later."
10058010-194 = "Now then..."
10058010-199 = "..."
10058010-200 = "Huh?"
10058010-201 = "My, have we gotten lost?"
10058010-202 = "That's my line..."
10058010-203 = "Oh my, are you a little lost child?"
10058010-204 = "People call me that a lot, but my real name is Rana."
10058010-205 = "Shirasu Azusa."
10058010-206 = "I see. What is your family name?"
10058010-207 = "How long are you going to keep this up!"
10058010-209 = "...Anyway, I was looking for branches to use for hitting our bodies in the sauna."
10058010-210 = "And I found just the thing."
10058010-211 = "Stripping naked with everyone and doing something like that...! Lewd things are not allowed! Execution!!"
10058010-212 = "There will be no execution. Saunas are currently legal in Red Winter."
10058010-213 = "Hitting each other with tree branches... Red Winter customs are certainly fascinating."
10058010-214 = "I want to ease everyone's tension and soothe their anxiety."
10058010-215 = "How noble! #nIf Koharu-chan gets nervous, I'll do the same for you too♡ #nLet's beat each other up♡"
10058010-216 = "Absolutely not!"
10058010-217 = "Rana~! Where are youー?"
10058010-218 = "Raaa-na!"
10058010-220 = "I hear my friends' voices."
10058010-221 = "It seems they've gotten lost."
10058010-222 = "Ahaha... They probably came looking for you, Rana-san?"
10058010-228 = "Rana! We've been looking everywhere for you!"
10058010-229 = "We thought someone might have kidnapped you!"
10058010-230 = "You guys looked so down, so I was getting sauna supplies ready."
10058010-234 = "Are these branches okay?"
10058010-235 = "If we get hit with those... #ninstead of relieving tension, we probably won't be able to walk for a while..."
10058010-236 = "It's more like a punishment than a sauna..."
10058010-237 = "And who are these people?"
10058010-240 = "They're members of Trinity General School's Remedial Class who are competing in tomorrow's race."
10058010-241 = "Right now they're working on maintaining their tank."
10058010-242 = "As introduced, we are Trinity's Remedial Class."
10058010-243 = "Good evening. Ajitani Hifumi."
10058010-244 = "You must be Anna-san and Elina-san, whom Rana-san mentioned?"
10058010-245 = "Yes! Anna Niki from Room 183. And this is Elina."
10058010-246 = "Um... what did Rana say about us?"
10058010-247 = "She told us about things up until now. Like how you guys lost your motivation until a little while ago."
10058010-248 = "Don't worry. She didn't mention the part about you crying with snot running down your nose in the snowfield."
10058010-249 = "You just brought it up right now!!"
10058010-250 = "Well, it's true so it can't be helped."
10058010-251 = "To build a tank yourselves in such harsh conditions is amazing!"
10058010-252 = "We've made plenty of improvised booby traps, #nbut building a tank isn't something just anyone can do."
10058010-253 = "Pouring your sweat out together, pressing your soft bodies close, and getting so absorbed in it... How nice♡"
10058010-254 = "You're saying that on purpose, aren't you!?"
10058010-255 = "No, Hanako is right. Sweating and doing your best is a good thing."
10058010-256 = "If we don't win this race... #nwe'll have to stay in the special class forever."
10058010-257 = "That's right. Coming here made it suddenly sink in..."
10058010-258 = "Even though I thought we'd gotten past it... #nI can't help feeling scared that we're going to fail again..."
10058010-259 = "Seeing the other contestants just makes it worse... I'm losing my confidence..."
10058010-260 = "Hiiin..."
10058010-261 = "And that's why they're in this state."
10058010-262 = "C-Cheer up! I don't really get it, but you'll be fine!"
10058010-265 = "Urm..."
10058010-266 = "It might not be my place as an outsider to chime in, but #nwould you mind listening to just my personal opinion?"
10058010-267 = "While I haven't had the exact same experience... #nI don't think trials and failures are only bad things."
10058010-268 = "Uu... Does that mean it's okay to fail?"
10058010-269 = "It might not be the result you hoped for, #nand you might be left with bitter memories, but..."
10058010-270 = "The 'process' of working hard together with your friends doesn't disappear."
10058010-271 = "The process..."
10058010-272 = "I believe that very important process is the true good result..."
10058010-273 = "Because making memories with your friends is one of a kind!"
10058010-274 = "No matter what the future holds, #nthat irreplaceable memory will never fade."
10058010-275 = "So, um... 'Let's focus on enjoying the present!' is what I mean..."
10058010-276 = "Ahaha... That's just how I see it, though. #nPlease don't think too hard about it!"
10058010-279 = "Fufu. How was that? Was I able to be of help to you all?"
10058010-280 = "Hmm."
10058010-281 = "4,294,967,296 points!"
10058010-282 = "What does that even mean!? Aren't there too many digits!?"
10058010-283 = "I see, so that's one point higher than Rana. Ahaha..."
10058010-284 = "This is Rana's way of expressing gratitude."
10058010-285 = "It's true, at first we only wanted to finish building the tank... #nand before we knew it, our goals kept climbing to entering the preliminaries and winning the main tournament."
10058010-286 = "As we climbed the stairs right in front of us, #nI think we unconsciously kept raising the bar higher and higher."
10058010-287 = "I've finally been able to realize that I was too fixated on a grand goal. Thank you."
10058010-288 = "Well, staying in the special class might not be so bad after all. Though being with Anna is the worst."
10058010-289 = "That's my line!"
10058010-290 = "Hmm. The fact that you're starting to fight means you've got your energy back."
10058010-291 = "We have nothing to return for such wonderful advice, but #nif you don't mind, would you accept this branch?"
10058010-292 = "We no longer need it to relieve tension, but #nI feel it has a lot of potential..."
10058010-293 = "It has a good grip and strike feel... and the durability seems fine too."
10058010-294 = "That's not a branch, that's a stick!"
10058010-295 = "Still... it might actually come in handy in situations where using guns is difficult."
10058010-296 = "If you don't mind, I'll take it."
10058010-297 = "I feel so refreshed! It's like I had forgotten the phrase 'nothing to lose'!"
10058010-298 = "Thanks for the encouraging talk! Tomorrow we're gonna fight with all our might and have fun~!"
10058010-299 = "What a wonderful attitude. #nSomehow my body is getting warm... I'm starting to feel a weird sensation too♡"
10058010-300 = "Just say it normally!"
10058010-301 = "Besides, we can't just have fun! #nThey told us that depending on our tournament results, we might be exempt from retakes!"
10058010-302 = "Retakes are an absolute no!"
10058010-303 = "Y-You entered in place of taking retakes...?"
10058010-304 = "Ahaha... Oh, look at the time...! We have to go to vehicle inspection!"
10058010-305 = "Well then, see you tomorrow!"
10058010-306 = "When we meet next, we'll be enemies."
10058010-307 = "Rana!? Jeez, what are you saying..."
10058010-308 = "Yeah, of course... Let's both do our best."
10058010-312 = "Ahaha... The two of them seem to get along well."
10058010-313 = "We need to head back and get some sleep too! Let's go in perfect condition!"
10058010-314 = "See you tomorrow~!"
10058010-321 = "Yesterday..."
10058010-322 = "After listening to Hifumi-san's talk..."
10058010-323 = "I thought there was nothing left to worry about, but..."
10058010-326 = "Don't tell me, Elina couldn't sleep either...?"
10058010-327 = "I started thinking about 'ways to enjoy the present' and couldn't fall asleep... #nRana was sleeping like a log though..."
10058010-328 = "Sigh..."
10058010-329 = "Hiiiiin!"
10058010-330 = "Zzz, zzz..."
