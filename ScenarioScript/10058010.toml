[translation]
10058010-1 = "Episode 1;Bringing Home the Trophy as a Souvenir"
10058010-3 = "Listen up! This is big news!"
10058010-4 = "These pillows have stuffing in them!"
10058010-5 = "Whoa, you're right! And it's not polyester either! They're using cotton!"
10058010-6 = "Since our lodging is covered for... Does that mean we can use these fluffy pillows#nall we like?"
10058010-7 = "Of course! I'm gonna ask if we can take one of these home as a souvenir later!"
10058010-8 = "The faucets too. Water immediately comes out after you turn the handles."
10058010-9 = "It works even without having to leave it on all night!? That's freaking awesome!"
10058010-10 = "It seems Gehenna is a bourgeois school..."
10058010-11 = "*Gasp!* I almost forgot to take pictures! #nThe people back at home aren't going to believe any of this!"
10058010-20 = "Captain Anna, I have discovered a target outside the window that needs reporting."
10058010-21 = "What is it, Private Rana? Give us your report."
10058010-22 = "At 12 o'clock... In the resort courtyard, I have confirmed that a buffet is#nbeing prepared."
10058010-23 = "A buffet!? You mean that all-you-can-eat kind of event!?"
10058010-24 = "All hands, charge!!"
10058010-25 = "Full speed aheaaad! Gotta burn off some calories for this!!"
10058010-30 = "Heheh, well done. #nIf there was someone who could keep a buffet this fresh, it could only be you."
10058010-31 = "Excellent work, Fuuka-san."
10058010-32 = "It's all thanks to the School Lunch Club's new truck. #nThis thing has enough power to pull a trailer behind it."
10058010-33 = "...With that said, do NOT touch our truck. I'll get mad."
10058010-34 = "My, there's even dessert."
10058010-35 = "Don't change the topic!"
10058010-39 = "Everyone here is a finalist, huh? They all look so strong..."
10058010-40 = "What're you being so timid for!? #nC'mon, we're also finalists! Stand proud!"
10058010-41 = "Huh? By the way, where's Rana? With this many people around, if she gets#nseparated from us, I'm afraid she'll get lost..."
10058010-42 = "Incredible. Certainly, it is a lot simpler if you do it like that..."
10058010-43 = "The number of parts can potentially be reduced even further, but... #nYou then run the risk of it catching fire."
10058010-44 = "...That's Rana's voice!"
10058010-51 = "Where were you two? With this many people around, you might have gotten lost."
10058010-52 = "That should be our line!"
10058010-53 = "Let me introduce you. These are the people of Millennium Science School's#nEngineering Department."
10058010-54 = "I'm the president, Shiraishi Utaha."
10058010-55 = "I'm Toumi Kotori! #nLeave the explanations and expositions to me!"
10058010-56 = "Nekozuka Hibiki. My favorite things are self-destruct mechanisms."
10058010-57 = "I'm Niki Anna from Red Winter Federal Academy. #nThese two here are Niki Erina and Furuhato Rana."
10058010-58 = "By the way... when you said you like self-destruct mechanisms..."
10058010-59 = "Ah, I didn't mean to say that..."
10058010-62 = "Did you mean using explosive bolts to decouple sections? #nOr did you mean blowing the entire body to smithereens?"
10058010-63 = "Or maybe... Flooding the engine room with gas and igniting it with a spark?"
10058010-64 = "Or perhaps by erasing all of the data?"
10058010-68 = "Where should we even begin (Where should we even start trying out)!?"
10058010-71 = "...If you do this, then it's done."
10058010-72 = "Hacking a power plant to self-destruct is easier than eating medovik."
10058010-73 = "Heheh. That's my Rana for you!"
10058010-74 = "'Scuse you! Rana belongs to who!?"
10058010-75 = "I'm truly moved by how you've elevated self-destruction to such an artistic degree."
10058010-76 = "Ignoring how we'd have to spend three months rewriting the OS to operate under punched cards, it's technologically perfect!"
10058010-77 = "That's not a problem. If you set up the card readers to run in parallel, then one#nmonth is more than enough."
10058010-78 = "Moreover... If we use our Engineering Department's new advanced polymers#ninstead of paper, we should be able to cut down the weight by about half."
10058010-85 = "To think we could talk to someone we'd just met for over 30 minutes..."
10058010-86 = "And no one was scared or treated us any differently..."
10058010-87 = "On top of that, they even listened to the explanations until the very end... #nW-Would you like to trade contacts? For the sake of collaborative research,#nof course!"
10058010-88 = "Would a VHF frequency qualify as contact information? #nThe reception on Momotalk does not always work during bad weather."
10058010-89 = "I'd love to have another conversation like this some time."
10058010-90 = "Yo, got a moment?"
10058010-92 = "It's about the tank y'all made. #nYou said to not press the giant red self-destruct button, right?"
10058010-93 = "But you've slapped like thirty different buttons on this thing.#nHow the hell am I supposed know which one it is!?"
10058010-94 = "It's the 6.2cm diameter R155 G17 B30 red button."
10058010-95 = "Are-155... what are you saying!? Just tell me where this thing is! In normal speak!"
10058010-96 = "The one next to the start button. The slightly larger one."
10058010-97 = "Why'd you put it in such a weird place!? What if someone pushes it by accident!?"
10058010-100 = "...Hm? Who are these girls?"
10058010-101 = "They're from Red Winter."
10058010-102 = "Apparently they made their own tank to join the race."
10058010-103 = "They made their own tank...? Heh, interesting."
10058010-104 = "Name's Mikamo Neru. I'm the leader of the Maid Club. #n...I'll also be joining this race."
10058010-105 = "Y-You're also participating in the race!? Best of luck to the both of us then!"
10058010-106 = "My clubmates wouldn't stop pestering me about joining...#nAnyway, nice meeting you."
10058010-107 = "'Kay! Then we're rivals! #nWe'll be the ones to take home the cup, after all!"
10058010-108 = "E-Erina!? Why're you being so rude all of a sudden!?"
10058010-109 = "Hahah! I like that look in your eyes! #nYou're right. Anyone who joins oughta aim for the top!"
10058010-110 = "Eheh ♪ You're exactly right!"
10058010-111 = "O-Oh thank goodness... I thought a fight was going to break out..."
10058010-112 = "I don't need the self-destruct button, so get rid of it for me later. #nIf you don't, then I'll rip it out myself."
10058010-113 = "Just so you know, pulling on the button triggers the self-destruct as well!#nBest be careful!"
10058010-114 = "Why does that even trigger the self-destruct!?"
10058010-115 = "And, uhh... You're from Red Winter, right? Let's go at it for real tomorrow."
10058010-116 = "Prepare yourselves!"
10058010-120 = "I really enjoyed meeting you three too. Good luck with the race tomorrow."
10058010-126 = "Right... This was a competition..."
10058010-127 = "It's a race, so that's just how it is... but..."
10058010-130 = "...Getting first place means that #nnobody else can be first place."
10058010-131 = "Yeah. And we HAVE to win this."
10058010-132 = "It'd be too frustrating to lose after coming this far..."
10058010-133 = "And we blew away the building with the main gun, so it's gonna be freezing cold#nback home!"
10058010-134 = "Waaaah..."
10058010-135 = "Hmm..."
10058010-136 = "Anna, Erina. Why are you two so nervous all of a sudden?"
10058010-137 = "I'm just feeling really tense for some reason..."
10058010-138 = "'Cause, like, everyone else looks so calm. Look at us—we don't even have a turret!"
10058010-139 = "This is why I kept saying we should've had a rotating turret..."
10058010-140 = "That marks the first deliberation..."
10058010-141 = "You're right... That was my fault... Now we have to turn the entire tank just to#nshoot at the enemy..."
10058010-142 = "?"
10058010-143 = "W-Well I did agree to it at the time... #nNo use talking 'bout it now, I guess. Sorry..."
10058010-144 = "Waaaaah...."
10058010-149 = "(Normally, they would have started their RWWE match by now.)"
10058010-150 = "(It seems neither of them even have the energy to fight.)"
10058010-151 = "(It's too peaceful... It doesn't feel right.)"
10058010-156 = "*Sigh*... A sauna right about now would really help clear my mind..."
10058010-157 = "Fat chance we'll find a Red Winter style sauna out here though."
10058010-158 = "*Sigh*..."
10058010-159 = "(A sauna...!)"
10058010-160 = "(I see. If they could slap a branch coated in hot water over themselves, it should#nhelp them refresh.)"
10058010-161 = "(It's all up to me to get their spirits back up.)"
10058010-165 = "If they tell us to go back to 183, are we supposed to spend out days under a tent#npitched using our tank...?"
10058010-166 = "Just the thought's making me shiver..."
10058010-167 = "Uwaaaan..."
10058010-172 = "Not this one; it doesn't have any leaves."
10058010-176 = "This one... probably not."
10058010-180 = "...This one!"
10058010-183 = "I hear voices coming from beyond the bushes..."
10058010-188 = "Koharu-chan, could you bring me the white paint?"
10058010-189 = "Yeah, leave it to me!"
10058010-190 = "I feel like if we painted swimsuits over our bodies using this indigo paint, it would#nfeel very refreshing."
10058010-191 = "Have you gone mad from huffing too much paint!?"
10058010-192 = "If we use this green paint instead, we could camouflage ourselves."
10058010-193 = "Ahaha... It's oil-based paint though, so it might be difficult to wash off later."
10058010-194 = "Now then..."
10058010-199 = "..."
10058010-200 = "Huh?"
10058010-201 = "Interesting. Are you lost out here?"
10058010-202 = "We should be the ones asking that..."
10058010-203 = "Oh my. Are you a lost child?"
10058010-204 = "People often call me that, but my real name is Rana."
10058010-205 = "Shirasu Azusa."
10058010-206 = "I see. And what is your last name?"
10058010-207 = "How long are you going to keep this up!?"
10058010-209 = "...And so, I came out here to find a branch that could be slapped against the body#nin a sauna."
10058010-210 = "I've managed to find the perfect specimen."
10058010-211 = "Everyone strips down naked to do what...!? Indecency is forbidden!#nDeath sentence to you!"
10058010-212 = "No one will be sentenced to death. Saunas are currently still legal in Red Winter."
10058010-213 = "What an interesting culture you have at Red Winter, slapping each other with#nbranches."
10058010-214 = "I wanted to to help them relax and ease their stress a just a little."
10058010-215 = "How wonderful! #nKoharu-chan, if you ever feel nervous, I can do the same for you. ♡ #nI wouldn't mind us spanking each other! ♡"
10058010-216 = "Abso-LUTELY not!"
10058010-217 = "Ranaa! Where are yooou!?"
10058010-218 = "Raaanaaa!"
10058010-220 = "I hear my friends."
10058010-221 = "It seems they've gotten lost."
10058010-222 = "Ahaha... I think they're actually here looking for you."
10058010-228 = "Rana! We've been searching everywhere for you!"
10058010-229 = "I genuinely thought you got kidnapped by someone!"
10058010-230 = "You two seemed very glum, so I wanted to prepare a sauna for you."
10058010-234 = "Will this branch work for you?"
10058010-235 = "With a branch like that... #nForget slapping the tension outta me. I don't think I'd be able to walk for a while#nafterward..."
10058010-236 = "It seems less for a sauna and more for punishment..."
10058010-237 = "Anyways, who are they?"
10058010-240 = "They're from Trinity General School's Make-up Work Club. They'll be participating#nin the race tomorrow."
10058010-241 = "They're in the middle of servicing their tank."
10058010-242 = "It's a pleasure meeting you. We're Trinity's Make-up Work Club."
10058010-243 = "Hello. I'm Ajitani Hifumi."
10058010-244 = "You must be the Anna and Erina that Rana mentioned."
10058010-245 = "Yes! I'm Niki Anna from Spec Ops No. 183, and she's Erina."
10058010-246 = "Umm... What did Rana say exactly?"
10058010-247 = "I told them about everything that's happened, beginning from a little while back#nwhen you were feeling demotivated."
10058010-248 = "No need to worry. I didn't tell them about the time when you two ran out into the snowfields, noses dripping and tears running."
10058010-249 = "Well now you did!"
10058010-250 = "Meh. I meaaan, it did happen, anyhow!"
10058010-251 = "It's amazing that you managed to build your own tank in such a harsh place!"
10058010-252 = "I've made my fair share of booby traps, #nbut building your own tank is different; it's not something anyone can do."
10058010-253 = "Working up a sweat together, pressing your supple bodies together, and getting#nabsorbed in it all... That sounds nice. ♡"
10058010-254 = "You're doing this on purpose, aren't you!?"
10058010-255 = "No, Hanako is right. It's a good thing to work hard until you sweat."
10058010-256 = "If we don't win this time... #nWe'll likely be stuck in 183 indefinitely."
10058010-257 = "That's true. Now that we've come this far, reality's really beginning to set in..."
10058010-258 = "I thought I'd overcome it by now... #nBut I still can't help but to be scared of failing again..."
10058010-259 = "And after seeing our other competitors... I'm feeling even less confident than#nbefore..."
10058010-260 = "Waaah..."
10058010-261 = "And that's how we've gotten to this point."
10058010-262 = "C-Cheer up! I'm not really sure, but I think you'll be just fine!"
10058010-265 = "Hmm..."
10058010-266 = "It might not be my place to chime in as an outsider, #nbut I'd like you to hear my personal opinion on this matter."
10058010-267 = "My experience wasn't the same as yours, but... #nI don't think trials and failures are necessarily a bad thing."
10058010-268 = "Urgh... So you're saying it's okay to fail?"
10058010-269 = "It might not be the result you wanted, #nand you might be left with bitter memories..."
10058010-270 = "But the journey you went through, working hard with your friends—#nthat's not something that disappears."
10058010-271 = "The journey..."
10058010-272 = "That precious journey IS what makes it all worth it... At least, that's what I think."
10058010-273 = "After all, the memories you make with your friends are all one-of-a-kind!"
10058010-274 = "No matter what the future holds, #nthose irreplacable memories will never disappear."
10058010-275 = "So, um... What I'm trying to say is to \"live in the moment!\"..."
10058010-276 = "Ahaha... Of course, that's just what I think. #nDon't think too deeply into it!"
10058010-279 = "Heheh. What do you think? Was that of any help?"
10058010-280 = "Heh."
10058010-281 = "4,294,967,296 points!"
10058010-282 = "What the heck! Why the humongous number!?"
10058010-283 = "I see. That's one point higher than Rana. Ahaha..."
10058010-284 = "That's just Rana's way of saying thanks."
10058010-285 = "Certainly, I would've been happy just to finish the tank in the beginning... #nBut then it became passing the qualifiers, and then winning the finals...#nBefore I knew it, I was aiming way too high."
10058010-286 = "I think that in climbing the steps laid out in front of me, #nI ended up setting the bar higher and higher without realizing."
10058010-287 = "I finally understand that I've been too fixated on these grand goals.#nThank you so much."
10058010-288 = "Well, it's not so bad being in 183 I guess. Except for Anna. Being with her sucks."
10058010-289 = "I should be the one saying that!"
10058010-290 = "Hm. Seeing as they're fighting again, I'd say they're back to their usual selves."
10058010-291 = "I may not have anything I can offer in exchange for that excellent advice, #nbut would you be willing to accept this branch instead?"
10058010-292 = "Even though I no longer need it to calm their nerves, #nI can still sense immense potential in this branch..."
10058010-293 = "It has good ergonomics and the impacts feel solid...it seems to be durable as well."
10058010-294 = "That's not a branch anymore! That's a whole baton!"
10058010-295 = "Hm... But it could be helpful in situations where guns aren't an option."
10058010-296 = "I'll take it if you don't mind."
10058010-297 = "Somehow, I feel a lot less stressed now! Looks like I forgot about the idea of#nhaving nothing to lose!"
10058010-298 = "Thanks for the pep talk! I look forward to fightin' tomorrow, full power!"
10058010-299 = "What a wonderful mindset. #nIt's making my body's started to heat up for some reason... and now I'm feeling#nsomething strange myself. ♡"
10058010-300 = "Speak like a normal person, would you!?"
10058010-301 = "Besides, we're not here just to have fun either! #nRemember! How we do in this tournament will decide if we have to take make-up exams or not!"
10058010-302 = "I am NOT taking the make-up exam!"
10058010-303 = "D-Did you join the tournament just so you didn't have to take a make-up exam...?"
10058010-304 = "Ahaha... Ah, it's already this late...! We have to get to the vehicle inspections!"
10058010-305 = "We have to go! See you tomorrow!"
10058010-306 = "We'll be enemies the next time we meet."
10058010-307 = "Rana!? Geez, what are you saying right now...!"
10058010-308 = "Ah, but of course... Let's do our best."
10058010-312 = "Ahaha... Seems like you two have really hit it off."
10058010-313 = "We should also hurry back and get some rest! Let's start tomorrow in perfect#ncondition!"
10058010-314 = "See you tomorrow!"
10058010-321 = "Yesterday..."
10058010-322 = "After hearing what Hifumi-san said yesterday..."
10058010-323 = "I thought I wouldn't be feeling nervous at all..."
10058010-326 = "Let me guess... You didn't manage to get any sleep either, Erina...?"
10058010-327 = "I was thinking of ways to live in the moment, and I ended up not sleeping at all... #nLooks like Rana's sleepin' like a log though..."
10058010-328 = "*Sigh*..."
10058010-329 = "Waaaaaaaaah!"
10058010-330 = "Zzz... Zzz..."