[translation]
2005002-1 = "Камень заговорил!"
2005002-2 = "Офис Шале"
2005002-3 = "На следующий день."
2005002-4 = ""
2005002-7 = "Рицу должна была прийти ещё 30 минут назад, но до сих пор не появилась."
2005002-8 = "Куда она могла уйти?"
2005002-9 = "[ns] «Она не отвечает на телефон...»"
2005002-10 = "Я беспокойно ходил по комнате и выглянул в окно."
2005002-11 = ""
2005002-14 = "[ns] «...Рицу?»"
2005002-15 = "Я увидел её снаружи."
2005002-16 = "Рицу постукивала молотком и зубилом по валуну во дворе."
2005002-17 = "[ns] «...Что она делает?»"
2005002-20 = "Передний двор Шале"
2005002-21 = "Я поспешил наружу."
2005002-22 = "И увидел Рицу, высекающую что-то из камня, который был куда больше неё самой."
2005002-23 = "[ns] «Эм, Рицу...?»"
2005002-24 = ""
2005002-25 = "О! Сенсей!"
2005002-26 = "Здравствуйте!"
2005002-27 = "О! Сегодня ведь я представительница учеников, да?"
2005002-28 = "[ns1] «Привет, Рицу.»\n[ns2] «Эм... Ты вырезаешь скульптуру из садового украшения?»"
2005002-31 = "Ага! Этот камень заговорил со мной!"
2005002-32 = "[s] «Камень заговорил с тобой...?»"
2005002-33 = "Да! Под поверхностью у каждого камня скрыта собственная форма."
2005002-34 = "Этот сказал мне, что внутри него спрятана настоящая красота!"
2005002-35 = "Поэтому..."
2005002-36 = "...я его разбила!"
2005002-37 = "[s] «Ты что сделала?!»"
2005002-38 = "Его истинная форма может проявиться только после того, как отбить внешнюю оболочку."
2005002-39 = "Поэтому мне пришлось убрать грубую и бугристую поверхность, чтобы раскрыть настоящую форму!"
2005002-40 = "[ns3] «А-а, вот что ты имела в виду...»\n[ns4] «В следующий раз начинай с этого...!»"
2005002-43 = "[ns] «В любом случае... Это вообще разрешено школьными правилами?»"
2005002-44 = "Хм? Конечно н..."
2005002-45 = "..."
2005002-46 = "Ну, рада тебя видеть, Сенсей!"
2005002-47 = "[s] «Ты уклонилась от вопроса!»"
2005002-48 = ""
2005002-52 = ""
2005002-53 = "Можешь меня поднять повыше?"
2005002-54 = "[s] «Но ты уже лезешь на меня!»"
2005002-55 = "Выше!"
2005002-56 = "Хи-хи. Я была недостаточно высокая, чтобы достать до вершины камня!"
2005002-57 = "Теперь смогу нормально работать! Спасибо, Сенсей! Закрой глаза!"
2005002-60 = "Рицу продолжила вырезать камень, сидя у меня на плечах."
2005002-61 = "Сверху непрерывно сыпалась каменная пыль."
2005002-62 = ""
2005002-63 = ""
2005002-64 = ""
2005002-65 = "Так, осталось только доработать эту часть...!"
2005002-66 = "И наконец, здесь нужно ещё немного..."
2005002-67 = "Ой. Сенсей, ты в порядке? У тебя всё лицо в пыли! Не облизывай её!"
2005002-68 = "[s] «Пф-ф. Пф-ф.»"
2005002-69 = "Ч-Что делать?"
2005002-70 = "А! А что если развернуться? Я буду сидеть у тебя на плечах, а ты повернёшься в другую сторону?"
2005002-71 = "Тогда пыль будет падать тебе на спину!"
2005002-72 = "[s] «Нет! Не надо!»"
2005002-73 = "А, правда? Мне казалось, идея хорошая."
2005002-74 = "Тогда я быстро закончу!"
2005002-77 = "Наконец она завершила скульптуру."
2005002-79 = "Готово! И моя работа... закончена!"
2005002-80 = "[s] «Выглядит отлично, Рицу.»"
2005002-81 = "Спасибо, Сенсей. Хи-хи."
2005002-82 = "[s5] «Кстати, эта скульптура...»\n[s6] «Она такая... Как бы сказать...»"
2005002-85 = "Ты пытаешься рассказать, какие чувства она у тебя вызывает?"
2005002-86 = "Не обязательно!"
2005002-87 = "[s] «Хм?»"
2005002-88 = "Ты только что увидел её впервые, а я стою прямо рядом."
2005002-89 = "Наверное, из-за этого трудно честно выразить чувства, да?"
2005002-90 = "Дай себе время подумать, что она у тебя вызывает."
2005002-91 = "Особенно когда я не буду стоять рядом и смотреть на тебя!"
2005002-92 = "И неважно, сколько времени тебе понадобится. Когда найдёшь правильные слова..."
2005002-93 = "...тогда и расскажешь мне, что чувствуешь, Сенсей!"
2005002-94 = "[s] «Это очень заботливо с твоей стороны, Рицу.»"
2005002-95 = "Кстати, хочешь, я перенесу её? Могу поставить у тебя в офисе."
2005002-96 = "[s] «Предложение интересное...»"
2005002-97 = ""
2005002-100 = "[ns7] «Но всё-таки мне кажется, такая работа будет красивее всего...»\n[ns8] «...там, где её смогут видеть люди, например здесь.»"
2005002-103 = "Ах..."
2005002-104 = "...Спасибо, Сенсей."
2005002-105 = "Мне кажется, сегодня был очень насыщенный день!"
2005002-106 = "[s9] «Не так быстро, Рицу.»\n[s10] «У тебя ещё есть обязанности представительницы учеников.»"
2005002-109 = "...Ах."
2005002-110 = "[s] «Будет весело. Отправимся в путешествие по бумажной работе!»"
2005002-111 = "...Ваа!"
2005002-113 = "Я помогал Рицу с обязанностями представительницы учеников до самой ночи."
