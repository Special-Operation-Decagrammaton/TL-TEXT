[translation]
42110-1 = "Episódio 11;Café Preto"
42110-2 = "Próximo à Estação Kousagi"
42110-3 = "(No dia seguinte, enquanto eu caminhava pelo centro para encontrar o Esquadrão RABBIT...)"
42110-7 = "...Não é não!#nUma aluna da Valkyrie pretende ignorar as regras?"
42110-8 = "Esta pessoa não é suspeita!#nÉ um cidadão que mora nesta região!"
42110-9 = "Ainda ontem mesmo nos cumprimentamos em frente à estação..."
42110-10 = "Se acontecer qualquer coisa, eu mesma assumo a responsabilidade,#nentão será que poderiam abrir uma exceção desta vez...?"
42110-11 = "Esse não é um problema que possa ser ignorado só com a palavra de uma aluna.#nSe tem alguma reclamação sobre as regras, procure o responsável."
42110-12 = "Se a Valkyrie não pode se responsabilizar pela segurança dos cidadãos,#nquem exatamente poderia?!"
42110-17 = "Urgh, me desculpe..."
42110-18 = "[s] \"...O que aconteceu aqui?\""
42110-23 = "Ah, Sensei...!"
42110-24 = "...Tsc, é o Sensei da Schale."
42110-25 = "É que... quando este cidadão tentou pegar o trem para ir ao hospital..."
42110-26 = "A Kaiser Security disse que \"as normas de uso do metrô mudaram\", bloqueou as entradas e começou uma revista..."
42110-27 = "Algum problema?#nEstamos apenas seguindo as regras e inspecionando indivíduos suspeitos."
42110-28 = "Ultimamente, elementos subversivos insatisfeitos com a nova Presidente Interina do Conselho Estudantil Geral têm aparecido por toda parte. Até ataques terroristas já aconteceram."
42110-29 = "Por isso, com base na \"Nova Ordem Executiva para a Segurança do Transporte Público do D.U.\", todos os cidadãos que entrarem ou saírem da estação devem apresentar aos seguranças#no \"bilhete de ida e volta\", o \"recibo\", a \"permissão de passagem\", o \"mapa das linhas do metrô\" e uma \"cópia do histórico de empréstimos da Biblioteca Municipal do D.U.\"."
42110-30 = "[s1] \"...Só para pegar o trem?\"\n[s2] \"'Cópia do histórico de empréstimos da biblioteca'...?\""
42110-31 = "Todas essas normas foram ordenadas pela Presidente Interina do Conselho Estudantil Geral para criar uma Kivotos segura e acolhedora."
42110-32 = "Se alguém pegar um livro na biblioteca municipal e ficar em outro distrito autônomo por muito tempo sem devolver, vai dar dor de cabeça para os funcionários, não vai?"
42110-33 = "Todas essas normas foram ordenadas pela Presidente Interina do Conselho Estudantil Geral para criar uma Kivotos segura e acolhedora."
42110-35 = "M-Mas até ontem só precisava do bilhete...#nNunca ouvi falar de precisar de tantos documentos só para pegar um trem."
42110-36 = "Mesmo que peçam o histórico da biblioteca municipal... faz anos que eu nem vou à biblioteca..."
42110-37 = "Se não pode apresentar os documentos, só resta desistir de entrar na estação."
42110-38 = "Volte quando reunir toda a papelada ou procure outro meio de transporte."
42110-39 = "Mas os ônibus de Kousagi Town não estão circulando... E para ir a pé até o hospital mais próximo levaria mais de uma hora..."
42110-43 = "Ugh... minha barriga..."
42110-45 = "I-Isso é uma emergência!#nPrecisamos levá-lo ao hospital logo—"
42110-47 = "Isso não é problema nosso."
42110-53 = "A nova ordem executiva já havia sido divulgada com aviso para todos verificarem, não foi?"
42110-54 = "Não tente jogar a culpa da sua própria negligência em cima de nós."
42110-56 = "...Como é que disse?"
42110-57 = "Opa, que cara é essa?"
42110-58 = "Uma aluna da Academia de Polícia Valkyrie, subordinada ao Gabinete de Defesa, pretende desafiar a Kaiser Security, que recebeu plenos poderes da Presidente Interina Kaya?"
42110-59 = "Se espalharem que uma aluna da Academia de Polícia Valkyrie fez uma coisa dessas,#ncomo será que os cidadãos vão passar a ver a Valkyrie?"
42110-60 = "Eu não tinha intenção de brigar, mas isso já passou dos limites..."
42110-61 = "[s] \"Kirino, espera—\""
42110-66 = "Se os documentos estiverem completos, ele pode passar, certo?"
42110-74 = "Se for assim... deixe comigo."
42110-76 = "...Diretora Kanna!"
42110-77 = "Hmph, vai levar esse cidadão até a prefeitura agora, é?"
42110-79 = "Não há necessidade. Posso providenciar tudo agora mesmo."
42110-83 = "Os recibos passaram a ser digitais no mês passado, então já deve ter chegado por e-mail. Verifique a caixa de entrada no seu celular."
42110-87 = "Ah, é verdade... O recibo chegou mesmo!"
42110-89 = "Quanto à permissão de passagem, há uma cláusula adicional determinando que, durante o período de transição após o anúncio da ordem executiva, alunas da Academia de Polícia Valkyrie podem emitir permissões temporárias no lugar dos órgãos públicos—"
42110-93 = "—Este é o formulário da permissão.#nKirino, assine aqui embaixo."
42110-94 = "S-Sim...!"
42110-95 = "O mapa das linhas do metrô é distribuído gratuitamente na própria estação."
42110-97 = "...E a cópia do histórico de empréstimos da biblioteca municipal?"
42110-99 = "A Biblioteca Municipal do D.U. não emite cópia do histórico de empréstimos para usuários inativos há muito tempo."
42110-103 = "Este cidadão não usa a biblioteca há mais de dois anos.#nPortanto, está isento da obrigatoriedade de apresentar esse documento."
42110-104 = "...Com isso, todos os documentos exigidos estão aqui, certo?"
42110-108 = "...Tsc, passem."
42110-110 = "M-Muito obrigado...!"
42110-117 = "Ah... desde que voltei ao trabalho, é só dor de cabeça..."
42110-119 = "Muito obrigada, Diretora Kanna!#nGraças à senhora, conseguimos ajudar o cidadão!"
42110-124 = "...Kirino Nakatsukasa!"
42110-129 = "S-Sim?!"
42110-130 = "Agora há pouco... você levou a mão à arma. O que exatamente pretendia fazer?"
42110-131 = "Só porque não dava para conversar com eles... você ia abrir fogo no meio da cidade?"
42110-132 = "N-Não! De jeito nenhum!"
42110-133 = "É que... eu pensei em usar uma granada de fumaça para sair da situação#ne escoltar o cidadão até a plataforma da estação..."
42110-134 = "Você acha mesmo que seguranças da Kaiser Security com armamento pesado#nvão deixar passar por causa de uma simples granada de fumaça?"
42110-135 = "B-Bem... pensando assim, é verdade..."
42110-136 = "Haah... você precisa aprender a pedir ajuda a outros setores—"
42110-142 = "Ei, que confusão toda é essa...?"
42110-143 = "Parece que a Kaiser Security e uma aluna da Valkyrie estavam discutindo..."
42110-144 = "Será que tem a ver com a ordem executiva que saiu recentemente?#nAs regras estão cheias de burocracia e são bem chatas, mas arranjar briga por isso..."
42110-145 = "...Vamos sair daqui."
42110-146 = "Estou cansada de tudo isso, deu vontade de tomar um café."
42110-147 = "Ah, então pode deixar comigo!"
42110-148 = "Tem uma cafeteria aqui perto com donuts deliciosos!"
42110-149 = "Eu não faço questão de donuts... Mas tudo bem, vamos."
42110-158 = "[ns3] \"Com licença, três cafés quentes e\"\n[ns4] \"um combo de donuts de chocolate, por favor.\""
42110-163 = "...Por que o Sensei fez o pedido?"
42110-164 = "Deixe que eu pago..."
42110-165 = "[s5] \"Vocês duas se esforçaram bastante.\"\n[s6] \"Deixem que eu pago desta vez.\""
42110-170 = "...O Sensei continua o mesmo de sempre."
42110-177 = "Desculpem a espera!#nAqui estão os cafés quentes e o combo de donuts de chocolate!"
42110-179 = "Ah, chegou!#nO donut especial de chocolate daqui é uma delícia!"
42110-180 = "Foi a Fubuki que me recomendou este lugar, e combina perfeitamente com café..."
42110-181 = "O chocolate é meio amargo, mas quando você come junto com o café, o docinho suave se destaca—"
42110-185 = "<...A Kaiser Security é diferente das preguiçosas da Academia de Polícia Valkyrie, que abandonam a manutenção da ordem para ficar comendo donuts por aí.>"
42110-189 = "<Por meio de nossos agentes veteranos vindos da PMC, oferecemos as melhores soluções de segurança pública baseadas em ampla experiência operacional.>"
42110-190 = "<Aqui no D.U. também, seguindo as diretrizes da nova Presidente Interina do Conselho Estudantil Geral, Kaya, reforçamos a segurança e realizamos fiscalizações em diversos pontos, alcançando uma redução de mais de 50% na taxa de criminalidade.>"
42110-191 = "<A Kaiser Security se compromete com a paz e a justiça social do D.U.>"
42110-192 = "...Que paz."
42110-193 = "Ahaha... é, pois é..."
42110-197 = "...Ouvi rumores de que você recusou a proposta de reestruturação da Schale apresentada pela Presidente Interina Kaya."
42110-198 = "Não sei dos detalhes, mas ouvi dizer que não era uma proposta ruim para o Sensei..."
42110-199 = "Mesmo assim, você recusou... porque ia contra as suas convicções?"
42110-203 = "[ns] \"...É isso mesmo.\""
42110-204 = "...Entendo.#nManter-se fiel às próprias convicções também é importante."
42110-205 = "Porém, ela é ambiciosa. Recusar pode acabar gerando problemas sérios. Acredito que o Sensei saiba bem disso."
42110-206 = "[s] \"Você também me ajudou seguindo as suas próprias convicções, não foi, Kanna?\""
42110-207 = "Isso..."
42110-212 = "...É verdade."
42110-213 = "[s7] \"...Seus ferimentos daquela vez já sararam?\"\n[s8] \"Você já voltou ao trabalho?\""
42110-214 = "Sim, felizmente."
42110-218 = "Indo direto ao ponto—"
42110-222 = "Indo direto ao ponto—"
42110-230 = "Eu não sou mais a Diretora do Departamento de Segurança Interna."
42110-231 = "Para ser mais exata... fui suspensa disciplinarmente e destituída do cargo."
42110-232 = "[s] \"Será que foi por minha causa—\""
42110-233 = "Não se preocupe. Não é culpa do Sensei."
42110-234 = "Mesmo em estado de emergência, a Diretora do Departamento de Segurança Interna, que deveria ser a mais rigorosa de todas,#ndesobedeceu às ordens de uma superior por julgamento pessoal e se voltou contra ela."
42110-235 = "Mesmo que a decisão tenha sido correta, não posso fugir da responsabilidade. Afinal, quanto mais exceções se abrem às regras, mais facilmente elas são abusadas."
42110-236 = "Este é o preço que pago por seguir minhas convicções. É uma punição justa.#nNa verdade, comparada ao que eu estava preparada para enfrentar, foi até leve demais..."
42110-238 = "Porém..."
42110-244 = "Talvez na tentativa de aliviar minha punição, as alunas do Departamento de Segurança Interna passaram a resistir às ordens da chefia... e o departamento acabou perdendo sua capacidade de operar normalmente."
42110-245 = "Acredito que seja por isso que a Presidente Interina Kaya recorreu a uma empresa privada."
42110-246 = "A Kaiser Security é uma organização mais eficiente e racional do que o Departamento de Segurança Interna."
42110-247 = "Com certeza eles seguirão as regras à risca e protegerão a paz de Kivotos sem vacilar."
42110-251 = "...Se há algo que me preocupa..."
42110-262 = "Para prevenir crimes, diversas restrições foram endurecidas, e os seguranças vigiam os becos tão de perto que não passa nem um rato."
42110-263 = "As atividades de todas as empresas, exceto a Kaiser Corporation, estão encolhendo,#ne os cidadãos evitam sair de casa por medo dos olhos da Kaiser..."
42110-264 = "Mesmo que seja para prevenir crimes... será que as coisas podem mesmo continuar assim?"
42110-267 = "...Eu já não sei mais de nada."
42110-268 = "—Só posso rezar para que a minha decisão não tenha sido um erro."
42110-269 = "[s] \"Sim. Você só fez o que precisava fazer, Kanna.\""
42110-270 = "O que precisava fazer... Não é bem assim.#nNão foi nada tão nobre quanto—"
42110-271 = "Eu não passo de uma vilã de terceira categoria."
42110-272 = "Alguém que já devia ter saído de cena há muito tempo, mas perdeu a hora de sair—"
42110-273 = "A-A Diretora Kanna não é nenhuma vilã de terceira categoria!"
42110-274 = "...Kirino?"
42110-275 = "A senhora é ótima no tiro, perfeita na papelada#ne está sempre tratando os cidadãos com gentileza...!"
42110-277 = "Dizer que a diretora admirada por todas as alunas da Valkyrie é de terceira categoria...#nMesmo que todo mundo concorde, eu jamais vou aceitar isso!"
42110-278 = "Eu me esforço no treino de tiro todos os dias sem falta para me tornar uma policial incrível como a Diretora Kanna! Por favor, não fale assim de si mesma!"
42110-284 = "O que deu em você para dizer uma coisa dessas..."
42110-285 = "Infelizmente, mesmo que você treine tiro todos os dias, nunca vai se tornar como eu."
42110-287 = "N-Não diga isso..."
42110-288 = "...Mas o mesmo vale para mim."
42110-292 = "Por mais que eu me esforce, jamais conseguiria ser uma excelente oficial do Departamento de Segurança Pública em quem os cidadãos confiam tanto quanto em você."
42110-293 = "Você tem qualidades que são só suas. Jamais se esqueça disso."
42110-294 = "Diretora Kanna...!"
42110-300 = "...Presidente Interina Kaya, admita seus erros! Admita!"
42110-301 = "O Conselho Estudantil Geral deve garantir cinco dias de folga por semana!"
42110-302 = "Se não aceitarem nossas exigências, eu vou comer três pudins inteiros!"
42110-304 = "De onde diabos esse pessoal surgiu?!"
42110-305 = "Não importa quantos a gente prenda, não param de aparecer!#nDroga, lidar com eles vai paralisar o posto de controle...!"
42110-306 = "Reforços, solicito reforços!"
42110-307 = "...Pelo visto, ainda precisam da nossa ajuda."
42110-311 = "Kirino, vamos indo."
42110-312 = "Mesmo que a manutenção da ordem tenha sido transferida para a Kaiser Security,#nenquanto formos alunas da Academia de Polícia, não podemos fazer vista grossa para o caos na cidade."
42110-313 = "S-Sim!"
42110-314 = "...Então até a próxima, Sensei."
42110-315 = "Muito obrigada pelos donuts, Sensei [USERNAME]!"
42110-323 = "(Terminei de tomar o café e segui para o Parque Kousagi, onde o Esquadrão RABBIT estava)"
42110-325 = "Próximo;Determinação"
