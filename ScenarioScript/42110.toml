[translation]
42110-1 = "Эпизод 11: Чёрный кофе"
42110-2 = "Окрестности станции Коусаги"
42110-3 = "На следующий день, по пути через город на встречу с отрядом RABBIT..."
42110-4 = ""
42110-7 = "Я сказала нет! Студент Валькирии уж должен знать правила, разве нет?"
42110-8 = "Этот человек не подозрительный! Он живёт по соседству!"
42110-9 = "Только вчера мы, как обычно, обсуждали перед станцией цены на яйца!"
42110-10 = "Если что-то случится, я возьму всю ответственность на себя. Не можете просто пропустить его?"
42110-11 = "Мы не можем обходить закон только потому, что какая-то девчонка заявила, будто подозрительный человек безопасен. Не согласны с порядком — обращайтесь в соответствующий отдел."
42110-12 = "Если студенты Полицейской академии Валькирия не способны защищать граждан и обеспечивать их безопасность... Тогда кто способен?"
42110-13 = ""
42110-15 = ""
42110-17 = "Угх! Аргх!"
42110-18 = "[s] «...Объясните, что здесь происходит?»"
42110-19 = ""
42110-22 = ""
42110-23 = "Слава богу! Сенсей!"
42110-24 = "Ц. Сенсей из Шале."
42110-25 = "Этот гражданин живёт по соседству! Ему нужно было воспользоваться метро, чтобы попасть на приём к врачу."
42110-26 = "Но этот охранник Кайзер преградил нам путь, сказал, что правила изменились, и начал проводить вот эту проверку!"
42110-27 = "Мы лишь следуем инструкции. Правила дают нам единоличное право проводить плановые проверки в любое время."
42110-28 = "После недавних изменений в Генеральном студенческом совете число террористических угроз выросло."
42110-29 = "Согласно новому административному распоряжению о безопасности общественного транспорта D.U., гражданам для входа в метро нужны билет туда-обратно, квитанция о покупке билета, государственное разрешение на проезд, карта метро и копия записи из городской библиотеки D.U."
42110-30 = "[s1] «...Не думал, что для общественного транспорта нужно столько бумаг.» \n[s2] «...Не понимаю, как читательский формуляр влияет на способность человека сидеть в поезде.»"
42110-31 = "Это новая мера временного Генерального студенческого совета ради более безопасного Кивотоса. Благодарим за дальнейшее сотрудничество."
42110-32 = "Если кто-то слишком долго находится в другом районе и из-за этого не возвращает книгу, нашим библиотекарям будет немало хлопот."
42110-33 = "Это новая мера временного Генерального студенческого совета ради более безопасного Кивотоса. Благодарим за дальнейшее сотрудничество."
42110-35 = "Но у меня есть только билет. Я-я понятия не имел, что для метро понадобится столько документов."
42110-36 = "Записи о книгах? Да я уже... даже не помню, сколько лет ничего не брал в городской библиотеке!"
42110-37 = "Нет документов — нет прохода."
42110-38 = "Не можете предоставить необходимые документы — ищите другой способ добраться до приёма."
42110-39 = "Но автобусов здесь нет... М-Мне идти пешком? До больницы примерно час ходьбы..."
42110-40 = ""
42110-42 = ""
42110-43 = "Угх... Не знаю, выдержит ли это мой желудок..."
42110-45 = "Это очевидная медицинская ситуация! Сейчас нашим главным приоритетом должно быть доставить его в больницу!"
42110-47 = "Личные обстоятельства отдельного человека не являются оправданием несоблюдения правил."
42110-48 = ""
42110-51 = ""
42110-53 = "Мы заранее дали гражданам достаточно времени ознакомиться с новыми правилами до их вступления в силу."
42110-54 = "Соблюдать закон — обязанность граждан, какими бы неудобствами это для них ни оборачивалось."
42110-56 = "Я правильно сейчас расслышала?"
42110-57 = "У вас есть претензии к моим словам?"
42110-58 = "Вы, студент Полицейской академии Валькирия, пытаетесь подорвать полномочия Служба безопасности Кайзер, предоставленные не кем иным, как временной председательницей Каей?"
42110-59 = "Ай-ай. Уже вижу заголовки: «Студент Валькирии устроил погром в центре города! Можно ли ещё доверять Полицейской академии?!»"
42110-60 = "Я не хотела драки, но если вы решили вести себя именно так..."
42110-61 = "[s] «Кирино! Стой—»"
42110-62 = ""
42110-66 = "Ну что, прокатимся сегодня вечером на метро?"
42110-67 = ""
42110-69 = ""
42110-70 = ""
42110-73 = ""
42110-74 = "Если проблема в бумагах, возможно, я смогу помочь."
42110-76 = "...Директор Канна!"
42110-77 = "Вы собираетесь сопровождать этого гражданина в городскую администрацию за обязательными документами?"
42110-79 = "Я похожа на экскурсовода? Всё можно уладить прямо здесь."
42110-80 = ""
42110-82 = ""
42110-83 = "Квитанции за билеты электронные и отправляются автоматически. Просто проверьте почту."
42110-84 = ""
42110-86 = ""
42110-87 = "О-О! Вот она, в папке со спамом — квитанция от транспортного отдела!"
42110-89 = "Что дальше? Разрешение на проезд? Мы недавно добавили пункт о льготном периоде после введения новых правил. Пока он действует, студенты Валькирии имеют право выдавать временные разрешения."
42110-90 = ""
42110-92 = ""
42110-93 = "Бланк разрешения, Кирино. Подпиши внизу."
42110-94 = "Е-Есть, госпожа!"
42110-95 = "Так... Карту метро можно бесплатно взять на станции."
42110-97 = "Остаётся только запись из библиотеки."
42110-99 = "Городская библиотека D.U. автоматически удаляет записи о читателях, которые не проявляли активности два года и более."
42110-100 = ""
42110-102 = ""
42110-103 = "Этот гражданин как раз подходит под эту категорию, поэтому данное требование на него не распространяется."
42110-104 = "Ну что, теперь всё в порядке?"
42110-105 = ""
42110-107 = ""
42110-108 = "...Похоже на то. Проходите."
42110-110 = "Огромное спасибо! Я этого никогда не забуду!"
42110-111 = ""
42110-113 = ""
42110-115 = ""
42110-116 = ""
42110-117 = "Угх, всего один день как вернулась — и уже по горло в работе..."
42110-119 = "Это было потрясающе, директор Канна! Огромное спасибо! Если бы не вы, этот гражданин—"
42110-120 = ""
42110-122 = ""
42110-124 = "Накацукаса Кирино!"
42110-125 = ""
42110-128 = ""
42110-129 = "Г-Госпожа?!"
42110-130 = "О чём ты думала, когда положила руку на оружие?"
42110-131 = "Ты столкнулась с охранниками Служба безопасности Кайзер, которые тебя не слушали, и первым порывом было открыть огонь посреди города?"
42110-132 = "Н-Нет, госпожа! Вовсе нет!"
42110-133 = "Я... я не собиралась стрелять! Охранник не хотел слушать доводы, поэтому я хотела бросить дымовую гранату и помочь гражданину сбежать..."
42110-134 = "Одна дымовая граната против охранников Служба безопасности Кайзер, вооружённых лучшими технологиями, известными Кивотосу?"
42110-135 = "Я... Я понимаю, к чему вы клоните..."
42110-136 = "Тебе нужно научиться думать. Бюрократия всегда должна быть твоим первым—"
42110-137 = ""
42110-139 = ""
42110-142 = "Что это за шум был?"
42110-143 = "Слышал, студент Валькирии сцепился с охранником Кайзер, и у них там всё всерьёз разгорелось."
42110-144 = "Наверняка из-за одного из новых правил. Честно говоря, я её не виню."
42110-145 = "...Давайте перейдём куда-нибудь поуединённее."
42110-146 = "За то, что я тебя там вытащила, ты должна мне чашку кофе."
42110-147 = "Так точно, госпожа! Хотите — куплю вам десять чашек!"
42110-148 = "Тут неподалёку есть место, где делают ещё и самые пышные пончики!"
42110-149 = "Пончики я не люблю, а вот кофе возьму."
42110-150 = ""
42110-152 = ""
42110-158 = "[ns3] «Три кофе, пожалуйста. И набор шоколадных пончиков.» \n[ns4] «Мне кофе, а им — что захотят.»"
42110-159 = ""
42110-160 = ""
42110-162 = ""
42110-163 = "По какому поводу, Сенсей?"
42110-164 = "Я-я вообще-то должна была заплатить..."
42110-165 = "[s5] «Небольшая благодарность нашим трудолюбивым сотрудницам Валькирии.»\n[s6] «Как ваш учитель, я хотя бы это могу себе позволить.»"
42110-166 = ""
42110-167 = ""
42110-169 = ""
42110-170 = "Мир сейчас будто перевернулся вверх дном, но вы каким-то образом всегда остаётесь прежним, Сенсей."
42110-171 = ""
42110-173 = ""
42110-177 = "Вот ваш заказ! Три кофе и набор шоколадных пончиков!"
42110-179 = "Выглядит вкусно! Фирменные пончики здесь — мои любимые."
42110-180 = "Это Фубуки показала мне это кафе! Обожаю, как хорошо пончики сочетаются с кофе."
42110-181 = "Они используют горько-сладкий тёмный шоколад, поэтому, когда ешь его вместе с кофе—"
42110-182 = ""
42110-185 = "...До сих пор Кивотос защищали новички. В конце концов, офицеры Полицейской академии Валькирия — всего лишь студенты, которых поиск очередной лучшей пончиковой волнует больше, чем общественная безопасность."
42110-186 = ""
42110-188 = ""
42110-189 = "У Служба безопасности Кайзер, напротив, в постоянной готовности находятся опытные бывшие бойцы ЧВК. При любых обстоятельствах мы готовы и способны обеспечить лучшую безопасность, какую только могут предложить современные технологии."
42110-190 = "Только в D.U., под руководством временной председательницы Генерального студенческого совета Каи, мы усилили охрану, установили строгие контрольно-пропускные пункты и сумели снизить уровень преступности на целых 50%."
42110-191 = "Служба безопасности Кайзер стремится вернуть мир и порядок в D.U."
42110-192 = "...Мир, значит? Звучит неплохо."
42110-193 = "Д-Да, звучит..."
42110-194 = ""
42110-196 = ""
42110-197 = "...Сенсей, я слышала, вы отклонили предложение Каи о реформе."
42110-198 = "У меня не было времени изучить его особенно внимательно, но, насколько я поняла, терять вам было почти нечего."
42110-199 = "Поэтому полагаю, что ваш отказ был скорее вопросом принципов."
42110-200 = ""
42110-203 = "[ns] «...Ты хорошо всё подытожила.»"
42110-204 = "Если бы это был просто жест для успокоения обстановки — пожалуйста, сколько угодно стойте на своих принципах и всё такое."
42110-205 = "Но, думаю, мне не нужно напоминать, что сказать Кае «нет» никогда не бывает так просто. Она совсем не из тех, кто позволяет неприятной теме спокойно затихнуть."
42110-206 = "[s] «Канна, когда ты помогла мне, ты ведь тоже поступила согласно своим принципам?»"
42110-207 = "Ну..."
42110-210 = ""
42110-212 = "Время от времени всем нам приходится твёрдо стоять на своём, разве нет?"
42110-213 = "[s7] «Кстати, рад видеть, что ты снова на ногах.» \n[s8] «Как ты? Тебя уже допустили обратно к полевой работе?»"
42110-214 = "Да, благодаря тому, что вы обо мне позаботились."
42110-215 = ""
42110-217 = ""
42110-218 = "Ладно. Сразу к делу..."
42110-219 = ""
42110-221 = ""
42110-222 = "В целом да, но..."
42110-223 = ""
42110-230 = "Я ушла с должности директора Бюро общественного порядка."
42110-231 = "Если точнее, меня временно отстранили от должности."
42110-232 = "[s] «Если это месть за то, что ты помогла мне...»"
42110-233 = "Я не позволю вам брать на себя ответственность за мои решения, Сенсей."
42110-234 = "Какими бы ни были обстоятельства, директор отдела не может и не должна нарушать протокол. Никогда. А я ослушалась прямого приказа начальства и вступила в бой с союзниками с враждебными намерениями."
42110-235 = "Даже если в итоге моё решение было правильным, я всё равно обязана отвечать за свои действия. Чем чаще мы гнём правила и делаем исключения, тем проще недобросовестным людям этим пользоваться."
42110-236 = "Я пошла на это, понимая, что придётся заплатить цену, и я с ней смирилась. Честно говоря, я рада, что всё не закончилось хуже."
42110-238 = "Но были вещи, которых я не предусмотрела..."
42110-239 = ""
42110-244 = "Многие студенты Бюро общественного порядка поддержали моё неподчинение и последовали за мной. Их постигла та же участь, что и меня, и теперь у нас нет бюро, которое обеспечивало бы безопасность граждан."
42110-245 = "Именно поэтому Кая так легко смогла передать безопасность D.U. под контроль Кайзер."
42110-246 = "Кайзер — крупнейшая и наиболее успешная корпорация Кивотоса. У них есть ресурсы и опыт, значительно превосходящие возможности Бюро общественного порядка."
42110-247 = "Я верю, что они способны соблюдать законы и полицейские нормы Кивотоса."
42110-248 = ""
42110-251 = "Но..."
42110-252 = ""
42110-254 = ""
42110-256 = ""
42110-258 = ""
42110-262 = "Но меня беспокоит, насколько жёсткими стали эти правила и насколько резко увеличилось число охранников."
42110-263 = "Другие компании, помимо Корпорация Кайзер, фактически оттеснены в сторону. Граждане сидят по домам, напуганные силами почти военного уровня, которые маршируют по их районам."
42110-264 = "Да, уровень преступности снизился, но... оправдывает ли цель такие средства?"
42110-267 = "Признаюсь, в последнее время я вообще мало в чём уверена."
42110-268 = "Единственное, что мне остаётся, — надеяться, что моё решение не было ошибкой."
42110-269 = "[s] «Ты приняла решение, которое считала правильным. Это главное.»"
42110-270 = "Не нужно меня защищать."
42110-271 = "В любой истории злодейке в конце концов приходится расплачиваться за свои поступки, верно?"
42110-272 = "Если честно, мне стоило уйти ещё давным-давно. Теперь я даже не уверена, что не упустила свой шанс."
42110-273 = "В-Вы вовсе не какая-то третьесортная злодейка, директор Канна!"
42110-274 = "...Кирино?"
42110-275 = "Вы прекрасно стреляете, безупречно справляетесь с бумажной работой и, несмотря на весь ваш опыт, всё ещё искренне переживаете за людей..."
42110-277 = "Я больше не могу просто сидеть и слушать, как вы принижаете себя! Не когда столько студентов Валькирии равняются на вас!"
42110-278 = "Я тренируюсь каждый день в надежде когда-нибудь стать хотя бы вполовину такой же хорошей, как вы, директор Канна!"
42110-279 = ""
42110-281 = ""
42110-283 = ""
42110-284 = "К сожалению, Кирино..."
42110-285 = "Ты можешь тренироваться дважды в день каждый день и всё равно не станешь даже на четверть такой хорошей, как я."
42110-287 = "Д-Директор...! Прямо в сердце!"
42110-288 = "...Но то же самое я могу сказать и о себе."
42110-289 = ""
42110-291 = ""
42110-292 = "Я никогда не смогла бы стать сотрудницей Бюро общественной безопасности и заслужить такую веру и доверие граждан, какие заслужила ты."
42110-293 = "Пусть стреляешь ты паршиво, но ты действительно доказала, чего стоишь."
42110-294 = "Д-Директор Канна!"
42110-295 = ""
42110-299 = ""
42110-300 = "...Долой временную председательницу Генерального студенческого совета Каю!"
42110-301 = "Мы заслуживаем двухдневную рабочую неделю!"
42110-302 = "Выполните наши требования, иначе я съем весь ваш пудинг!"
42110-304 = "Откуда вообще взялись эти типы?"
42110-305 = "Что бы мы ни делали, они всё лезут и лезут! Как мухи! Мы не можем работать, пока они постоянно путаются под ногами!"
42110-306 = "Нам нужно подкрепление! Подкрепление!"
42110-307 = "Пора за работу, Кирино."
42110-308 = ""
42110-310 = ""
42110-311 = "Пойдёмте."
42110-312 = "Неважно, кто отвечает за безопасность, наш долг как студентов Валькирии никуда не делся. Мы окажем поддержку."
42110-313 = "Есть, госпожа!"
42110-314 = "До встречи, Сенсей."
42110-315 = "Спасибо за пончики, [USERNAME] Сенсей!"
42110-316 = ""
42110-318 = ""
42110-323 = "Я допил кофе и отправился в парк Коусаги, чтобы увидеться с участницами отряда RABBIT."
42110-325 = "Следующий эпизод: Решимость"
