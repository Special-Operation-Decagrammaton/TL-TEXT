[translation]
1008002-1 = "Mental Out"
1008002-2 = "По дороге в торговый район я заметил Шокухо, сидящую в роскошном кафе."
1008002-3 = ""
1008002-5 = ""
1008002-6 = "Сенсей? Это вы?"
1008002-7 = "Вот уж не ожидала встретить вас в таком месте."
1008002-8 = "Сегодня одна удача за другой... Должно быть, мой счастливый день."
1008002-9 = "[s1] «Удача, говоришь?»\n[s2] «Одна хорошая вещь за другой?»"
1008002-12 = "А как это ещё назвать? Погода прекрасная..."
1008002-13 = "...Я нашла хорошее органическое кафе..."
1008002-14 = "...и человек, которому я собиралась позвонить, пришёл сам."
1008002-15 = "Что это, если не удача? Возможно, вы не чувствуете того же, Сенсей."
1008002-16 = "О, вы тоже рады меня видеть? Хмм."
1008002-17 = ""
1008002-19 = ""
1008002-20 = "Мне немного не по себе, когда я не могу подтвердить, что вы действительно чувствуете. Но вы кажетесь достаточно надёжным, так что оставим всё как есть, Сенсей."
1008002-21 = "О, хотите знать, что я имею в виду под «подтвердить»?"
1008002-22 = "Вообще-то это небольшая проблема. Обычно я проверяю каждого, кого встречаю."
1008002-23 = "О чём они думают, во что верят..."
1008002-24 = "По меньшей мере мне нравится проверять, что это за человек. Я предпочитаю заглянуть в чужие мысли и уже потом принимать решения."
1008002-25 = "А здесь... К сожалению, получается не очень. Это действительно довольно утомительно."
1008002-26 = "Конечно, если я по-настоящему постараюсь, нет ничего невозможного..."
1008002-27 = ""
1008002-29 = ""
1008002-30 = "...Хм?"
1008002-31 = "Вы так смотрите, Сенсей. Я вас напугала?"
1008002-32 = "[s3] «О, нет. Я переживаю, что тебе слишком некомфортно.»\n[s4] «Наверное, тяжело оказаться в месте, где ничего не работает так, как ожидаешь.»"
1008002-35 = "...Ох."
1008002-36 = "Я думала, вы захотите держаться от меня подальше. Честно говоря, именно этого и ожидала."
1008002-37 = "Хм? Вы благодарите меня за то, что я вам доверяю?"
1008002-38 = "Ну что вы. Я не то чтобы решила вам доверять. У меня ведь, по сути, нет других вариантов, да?"
1008002-39 = "С учётом ситуации, в которую я попала, доверять вам — лучший выбор."
1008002-40 = "...Это не слишком расчётливо для вас?"
1008002-41 = "[s5] «Нет, всё нормально.»\n[s6] «Я вижу, что ты многим жертвуешь, чтобы всё получилось.»"
1008002-44 = "Вы настолько хороший человек, что это почти скучно, Сенсей."
1008002-45 = ""
1008002-47 = ""
1008002-48 = ""
1008002-49 = "Вы пробудили моё любопытство. Может, мне воспользоваться способностью на вас? Наверняка ничего страшного не будет, если попробовать один раз?"
1008002-50 = "Хм?"
1008002-51 = "Мне можно попробовать? Тогда вам определённо придётся объяснить свой ответ подробнее."
1008002-52 = "Пожалуйста, объясните. Признаю, вы застали меня врасплох."
1008002-53 = "Звучит подозрительно... Так что давайте послушаем."
1008002-54 = "А? У вас дедлайн, и, может, я смогу с помощью способности помочь вам из него выбраться...?"
1008002-55 = "...И всё?"
1008002-56 = "О, или я могла бы сделать так, чтобы вы были счастливы закончить работу...?"
1008002-57 = ""
1008002-59 = ""
1008002-60 = ""
1008002-61 = ""
1008002-62 = "...Сенсей."
1008002-63 = "Похоже, мне придётся забрать назад сказанное раньше. Я считала вас хорошим человеком, но, возможно, вы просто дурак."
1008002-64 = "Или, может, для вас всё это просто игра... Честно говоря, я не могу понять."
1008002-65 = "Но если уж называете себя взрослым, то должны вести себя соответственно и разбираться со своей работой самостоятельно."
1008002-66 = "Вот уж правда. Ни один учитель ещё не просил меня использовать способности таким образом."
1008002-67 = "..."
1008002-68 = "Сейчас они всё равно работают плохо, так что вопрос бессмысленный. ☆ Но даже если бы работали, я всё равно отказала бы вам."
1008002-69 = "Хм... С другой стороны..."
1008002-70 = "Мне всё-таки нужно как-то отплатить вам за всю помощь..."
1008002-71 = "[s7] «В таком случае...»\n[s8] «Ты...?»"
1008002-74 = "..."
1008002-75 = "И речи быть не может. Ты ведь не думал, что я передумаю, правда?"
1008002-76 = "Вот. Этот органический сок поможет тебе взбодриться."
1008002-77 = "И ещё..."
1008002-78 = ""
1008002-80 = ""
1008002-81 = ""
1008002-82 = ""
1008002-83 = "Удачи с переработками, Сенсей."
