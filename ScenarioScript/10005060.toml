[translation]
10005060-1 = "Эпизод 6;Охота на кроликов"
10005060-4 = "А-а-а-а-ай! Какого чё-ё-ёрта?!"
10005060-5 = "Она вытянула S всего за 20 попыток? Нечестно! Всё точно подкручено!"
10005060-6 = "Я потратила столько денег и ничего не получила! Как это вообще возможно?!"
10005060-7 = "[s1] «Ты наконец пришла в себя?»\n[s2] «Мир гачи жесток, девочка.»"
10005060-8 = "А-а-а-а!"
10005060-9 = "А-а-а-а!"
10005060-10 = "Я иду за тобой, мелкая!"
10005060-11 = "...! А-а-а-ай!"
10005060-12 = "Хахахаха! Отлично! Да, ещё!"
10005060-13 = "Дай мне насладиться тем, как ты плачешь! А потом я передам тебя казначею Семинара!"
10005060-15 = "Последний смех будет за мной! За мной! Хахахаха!"
10005060-16 = "Беги, маленький кролик, беги! Сможешь бежать и плакать одновременно?"
10005060-17 = "Если я слишком легко тебя поймаю, накажу ещё и за это!"
10005060-19 = "Помоги-и-и-и-и-ите!"
10005060-20 = ""
10005060-22 = ""
10005060-23 = "Ахахаха! Да, идеально! Беги, пока лёгкие не взорвутся!"
10005060-24 = ""
10005060-26 = ""
10005060-28 = ""
10005060-29 = "С-Сенсей, это нормально?"
10005060-30 = "[s3] «Я здесь не для того, чтобы вас контролировать. Всё нормально.»\n[s4] «Нэру слишком долго сдерживалась, пусть оторвётся.»"
10005060-31 = "...Вы..."
10005060-32 = "...Вы..."
10005060-33 = "Вы правда так думаете...?"
