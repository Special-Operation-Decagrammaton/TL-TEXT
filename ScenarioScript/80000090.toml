[translation]
80000090-1 = "Медаль председателя Комитета безопасности"
80000090-2 = ""
80000090-3 = "А, Сенсей. Простите за срочную просьбу."
80000090-4 = "Возникла проблема, с которой я просто не могу справиться самостоятельно."
80000090-5 = "Мне нужна ваша мудрость, Сенсей."
80000090-6 = "[s1] «Всё хорошо. Никаких проблем.»\n[s2] «Что за срочное дело?»"
80000090-7 = "Вы знаете о шоколаде «Черенка», Сенсей?"
80000090-8 = "Вы знаете о шоколаде «Черенка», Сенсей?"
80000090-9 = "Это особый молочный шоколад, производимый академией Красная Зима. Я рада сообщить, что его необычное сочетание вкусов принесло ему широкую известность. Говорят, у него даже есть культ поклонников за пределами академии."
80000090-10 = "К сожалению, поставки ингредиентов нестабильны, поэтому объёмы производства постоянно скачут."
80000090-11 = "Некоторое время назад президент Черино назначила меня управляющей фабрикой «Черенка». С тех пор мы превысили средний объём производства на 200%..."
80000090-12 = "[s] «Это здорово!»"
80000090-14 = "[ns] «Но ты не выглядишь счастливой...»"
80000090-15 = "Эм... Ну, президент Черино отметила мой вклад в производство шоколада «Черенка» специально изготовленной медалью."
80000090-16 = "Вот они."
80000090-17 = ""
80000090-19 = ""
80000090-21 = "[ns] «Это... шоколад?»"
80000090-22 = "Эта Особая шоколадная медаль за заслуги сделана из тех же ингредиентов, что и «Черенка», главным образом из молочного шоколада. Поэтому она сильно отличается от обычных медалей, сделанных, ну, из металла."
80000090-23 = "Я понимаю идею шоколадной медали в честь вклада в производство шоколада, но..."
80000090-24 = "Я переживаю, что в тёплом месте она потеряет форму. Кроме того, «Черенка» — молочный шоколад с высоким содержанием молочных продуктов, так что он может испортиться."
80000090-25 = "Поэтому мне нужно тщательно продумать, как хранить эту медаль."
80000090-26 = "Сенсей, у вас есть идеи?"
80000090-27 = "[s3] «Если это шоколадная медаль...»\n[s4] «Почему бы просто её не съесть?»"
80000090-28 = "Что?! Но если я съем медаль, у меня её больше не будет..."
80000090-29 = "Что?! Но если я съем медаль, у меня её больше не будет..."
80000090-30 = "Эта медаль символизирует результат нескольких месяцев тяжёлой работы на фабрике «Черенка»!"
80000090-31 = "Съесть её — значит уничтожить материальное воплощение моих усилий и достижений."
80000090-32 = "Это расточительство! Я, Марина, не могу с этим согласиться!"
80000090-33 = "[s] «Тебе не нужна медаль как доказательство твоих усилий, Марина.»"
80000090-34 = "Хм? А что тогда использовать?"
80000090-35 = "Мне не выдавали никаких других грамот или медалей за управление фабрикой..."
80000090-36 = "[s] «Другие студенты будут помнить, как усердно ты работала, Марина.»"
80000090-38 = "[ns] «Медаль имеет смысл только благодаря людям, которые знают, что она символизирует.»"
80000090-39 = ""
80000090-40 = "П-Понятно. Хм... Тогда, Сенсей, не съедите ли вы эту медаль за меня?"
80000090-41 = "[s5] «А? Ты правда хочешь отдать её мне?»\n[s6] «Разве она не очень важна для тебя?»"
80000090-42 = "Конечно, она мне очень дорога, но если бы не ваш совет, думаю, я бы позволила ей испортиться и выбросила..."
80000090-43 = "Конечно, она мне очень дорога, но если бы не ваш совет, думаю, я бы позволила ей испортиться и выбросила..."
80000090-44 = "А это было бы оскорблением ценности самой медали."
80000090-45 = "Совет, который вы дали мне сегодня, бесценен, и я хочу вас отблагодарить. Сейчас эта медаль — всё, что у меня есть."
80000090-46 = "Ценность моего труда останется в памяти людей. А если вы насладитесь шоколадом «Черенка», то тоже его запомните."
80000090-47 = "Ну..."
80000090-48 = "Окажите мне честь и съешьте эту медаль, Сенсей."
