[translation]
1600006-1 = "Ошибочное предположение"
1600006-3 = "(Задыхаясь, я вбежал в лес, где, по идее, исчезла Харука.)"
1600006-4 = "(Но лес оказался глубоким и огромным, и во время поисков я заблудился. Вскоре в беде оказался уже я.)"
1600006-6 = "(...Я уже не помнил, сколько времени бродил.)"
1600006-7 = ""
1600006-9 = "(Я прислонился к ближайшему дереву, чтобы дать измученному телу передышку, и в конце концов уснул...)"
1600006-10 = "..."
1600006-12 = "...сэй."
1600006-13 = "[ns] «...?»"
1600006-14 = "...нсэй!"
1600006-15 = "...Сенсей! Проснитесь, Сенсей!"
1600006-16 = "Сенсей!"
1600006-17 = ""
1600006-18 = "Сенсей, вы в порядке? Сенсей!"
1600006-19 = "О... Вы очнулись. Фух... Вы меня напугали..."
1600006-20 = "[s] «...Харука...?»"
1600006-21 = "А-ах... Да... Это я..."
1600006-22 = "*ахает*"
1600006-23 = "П-простите. Я так испугалась, что даже не заметила, что...!"
1600006-24 = "Я-я просто пыталась поддержать вас, но м-мне не стоило к-касаться вас...!"
1600006-25 = "Что...? Вы не против...? П-просто хотите немного отдохнуть...?"
1600006-26 = "Н-но...! Э-эм...!"
1600006-27 = "Н-нет! Не то чтобы я не хотела...! Просто...!"
1600006-28 = "...С-Сенсей?"
1600006-29 = "В-вы так бледны... Вам лучше?"
1600006-30 = "[s1] «Да. Увидев тебя, я почувствовал себя лучше.»\n[s2] «Мне повезло так проснуться. Рад, что пришёл сюда.»"
1600006-31 = "...?"
1600006-32 = "...?"
1600006-33 = "#%^&*@#?!?!"
1600006-34 = ""
1600006-36 = ""
1600006-37 = "Простите простите простите простите простите не знаю, что вы имеете в виду, но простите..."
1600006-38 = "В-вы точно в порядке? Н-но..."
1600006-39 = "К-кстати, почему вы вообще оказались в таком грязном и мрачном месте...?"
1600006-40 = "С-сюда никто кроме меня не приходит... Такое заброшенное место..."
1600006-41 = "...? Что? Что я здесь делала?"
1600006-42 = "А-ах... Н-ну..."
1600006-43 = "Я просто искала новую землю... чтобы посадить сорняки..."
1600006-44 = "Я-я иногда прихожу сюда выкопать землю и забрать с собой... а если повезёт... нахожу что-нибудь для компоста..."
1600006-45 = "[s3] «А. Значит, ты пришла сюда ради растений.»\n[s4] «Я тебя неправильно понял. Ха-ха-ха.»"
1600006-46 = "...А? Ч-что вы имеете в виду, Сенсей...?"
1600006-47 = "...А? Ч-что вы имеете в виду, Сенсей...?"
1600006-48 = "Эм... Т-тогда зачем вы сюда пришли...?"
1600006-49 = "Т-только не говорите, что пришли сюда ради меня...?! В такую глушь...?! Ради т-такого человека, как я...?!"
1600006-50 = "[ns] «...»"
1600006-51 = "Я как можно мягче объяснил Харуке текущую ситуацию."
1600006-52 = "..."
1600006-53 = "Но по мере того как Харука слушала, её плечи всё сильнее опускались."
1600006-54 = "..."
1600006-55 = "...Прос..."
1600006-56 = "[s] «...Харука, подожди»."
1600006-57 = "Простите простите простите простите простите простите простите простите простите простите..."
1600006-58 = ""
1600006-60 = ""
1600006-61 = "Простите простите простите простите простите я не знала, правда не знала. Не думала, что вы решите такое..."
1600006-62 = "Простите. Простите за оправдания. Простите за неприятности. Похоже, чтобы доказать искренность, мне всё-таки придётся остаться здесь...!"
1600006-63 = "Что? Мне не нужно этого делать? Н-но я доставила вам столько проблем, Сенсей...!"
1600006-64 = "А?"
1600006-65 = "Обычно во время походов вы столько и ходите? П-правда? Н-но вы ведь только что лежали здесь без сознания...?"
1600006-66 = "О нет! Совсем нет! Я не пытаюсь спорить или оспаривать ваши слова, просто...!"
1600006-67 = "[s5] Посмотреть на руку Харуки, чтобы сменить тему.\n[s6] «Что у тебя в руке?»"
1600006-68 = "...А? О-ой, это...?"
1600006-69 = "...А? О-ой, это...?"
1600006-70 = "О-о... Это земля, о которой я говорила раньше... Я только что её выкопала..."
1600006-71 = "Сорняки, которые я хочу посадить... не отсюда. Местная трава не совсем «сорняки»..."
1600006-72 = "Я выращиваю более бесполезные... случайные виды, которые пробиваются из трещин тротуаров и дорог."
1600006-73 = "Но... даже у таких маленьких растений есть любимая почва, так что... я просто хотела о них позаботиться..."
1600006-74 = "Я-я сама как эти сорняки... всегда принимаю чужую помощь. Совершенно, абсолютно бесполезная..."
1600006-75 = "Т-так что раз я никак не могу отплатить людям, хотя бы сорнякам хочу... быть полезной."
1600006-76 = "[s7] «У тебя такая добрая душа, Харука.»\n[s8] «Ты просто хочешь быть кому-нибудь полезной.»"
1600006-77 = "Н-нет, всё совсем не так...! У т-такого человека, как я, нет никакого доброго сердца! Просто...!"
1600006-78 = "Н-нет, всё совсем не так...! У т-такого человека, как я, нет никакого доброго сердца! Просто...!"
1600006-79 = "Н-нет! Я имею в виду! Я не говорю, что вы неправы, Сенсей, но я...!"
1600006-80 = "...Э-эм..."
1600006-81 = "...Т-тогда."
1600006-82 = "...Если вы настаиваете, Сенсей, т-тогда я просто соглашусь. Пусть так и будет...!"
1600006-83 = "...Ч-что? Уже так?"
1600006-84 = "Н-но... не может же... Ой, я имею в виду! Я не говорю, что это невозможно, и не пытаюсь сказать, что вы неправы!"
1600006-85 = "Э-это... Угх... Угхх...!"
1600006-86 = "Л... ладно... Е-если вы настаиваете... пусть будет так!"
1600006-87 = "...Будем считать, что так...! Д-да!"
1600006-89 = "После этого я встал и вместе с Харукой и её землёй вернулся в школу."
1600006-90 = "К счастью, Харука хорошо знала лесные тропы, так что мы быстро вернулись и не заблудились."
1600006-91 = ""
1600006-94 = "Если честно, мне было немного неловко, что я умудрился заблудиться и свалиться на таком коротком расстоянии..."
