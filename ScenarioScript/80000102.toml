[translation]
80000102-1 = "Тема консультации"
80000102-2 = "Я ждал, пока Момидзи прибудет в Шале после её внезапного сообщения..."
80000102-3 = "Сенсей! Долго ждали? Простите..."
80000102-4 = "Всё нормально? Н-Ну конечно, вы бы так и сказали..."
80000102-5 = "А? Я пришла на двадцать минут раньше назначенного времени?"
80000102-6 = "О, точно... Т-Тогда простите уже по другой причине. Что же делать?"
80000102-7 = "[s1] «Для начала успокойся, Момидзи.»\n[s2] «Так... что случилось?»"
80000102-10 = "А, да! Ну... Я смогла достать мангу, которую только что переиздали!"
80000102-11 = "Это романтическая манга о шоколадном кондитере... Моё новое увлечение!"
80000102-12 = "Хе-хе... Было непросто, но я урвала все три книги, которые хотела."
80000102-13 = "А? Это не три разных тома, а три копии одной книги?"
80000102-14 = "Ну конечно! Одна для коллекции, одна чтобы любоваться... а последняя — для обращения новых фанатов!"
80000102-15 = "Ах, стойте! Нельзя срывать плёнку с той, которой я любуюсь. Она слишком важная, ясно?"
80000102-16 = "Вот, можете прочитать ту, что для обращения!"
80000102-17 = "[s] «О-Отлично. Спасибо?»"
80000102-18 = ""
80000102-20 = ""
80000102-21 = "Я взял книгу у сияющей Момидзи и открыл её..."
80000102-22 = "И именно в этот момент..."
80000102-23 = ""
80000102-25 = ""
80000102-27 = "[ns] «А?»"
80000102-28 = "О, это... Поздравляю, Сенсей!"
80000102-29 = "Это приз розыгрыша! Брелок плюс шоколад в форме главного героя!"
80000102-30 = "Хи-хи. Вам точно везёт, Сенсей. Погодите. Мангу купила я, так что, может, повезло мне."
80000102-31 = "А? Раз книгу купила я... призы должны быть моими?"
80000102-32 = "Н-Нет! Они ваши, Сенсей! Можете не возвращать! Более того, обязательно заберите их!"
80000102-33 = "П-Почему я так нервничаю? Ну, видите ли..."
80000102-34 = "Забудьте! Вы точно должны их взять! Хорошо?"
80000102-35 = "[s] «Х-Хорошо. Возьму...»"
80000102-36 = "..."
80000102-37 = "Слава богу..."
80000102-38 = "Ну тогда, не возражаете, если я полюбуюсь своей мангой?"
80000102-39 = ""
80000102-41 = ""
80000102-42 = "Когда Момидзи открыла купленную для любования мангу, произошло нечто невероятное."
80000102-43 = ""
80000102-47 = "..."
80000102-48 = "[s] «...?»"
80000102-49 = "У-Увааа?! Э-Это— Сенсей, я...!"
80000102-50 = "...точно НЕ покупала их как парный набор для себя и Сенсея! Я... могу объяснить!"
80000102-51 = "Эммм... Что сказать? В общем...!"
80000102-52 = "[s] «Всё нормально, Момидзи.»"
80000102-53 = "Ч-Что?"
80000102-54 = "[s] «Ты ведь тоже выиграла приз, да?»"
80000102-55 = "..."
80000102-56 = "Ага. Именно. Правда."
80000102-57 = "Хи-хи... Хи-хи-хи..."
80000102-58 = "..."
80000102-59 = "Эм, Сенсей?"
80000102-60 = "Раз уж у нас теперь эти брелоки... Можно украсить ими ваш стол?"
80000102-61 = "И, эм, оставить их рядом? Раз они изначально шли парой."
80000102-62 = "[s] «Хм? Конечно. Почему нет.»"
80000102-63 = "П-Правда? Вы не против?"
80000102-64 = "О... Конечно! Небольшие украшения точно оживят ваш стол."
80000102-65 = "Д-Да! Именно! Лучше и не скажешь!"
80000102-66 = "Если стол слишком пустой, на него скучно смотреть. Может, вы даже работать нормально не сможете... Это точно плохо, да!"
80000102-67 = "..."
80000102-68 = "Ну. Сенсей. С брелоками разобрались..."
80000102-69 = "А насчёт шоколада... Жалко пропадать, так что хотите съесть вместе?"
80000102-70 = "[s] «Конечно. Давай.»"
80000102-71 = "*ахает*"
80000102-72 = "Да! Не могу дождаться!"
80000102-73 = "Мы ещё можем вместе почитать мангу? П-Правда? Можно?!"
80000102-74 = "Э-хе-хе... Я так рада, что сегодня пришла в Шале."
80000102-76 = "После этого мы ели шоколад и читали необычную мангу вместе с подозрительно счастливой Момидзи..."
