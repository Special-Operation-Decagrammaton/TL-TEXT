[translation]
84310100400-5 = ""
84310100400-7 = ""
84310100400-9 = ""
84310100400-10 = "А, здравствуйте. Простите, но... можно спросить, что здесь происходит?"
84310100400-11 = ""
84310100400-13 = ""
84310100400-14 = "Хм? А! Здравствуйте! Вы пришли на тренировку?"
84310100400-15 = "На тренировку...? Вы упражняетесь?"
84310100400-16 = "(Значит, это не наказание. Похоже, мне незачем было вмешиваться.)"
84310100400-17 = "Немного оздоровительной нагрузки, да. В здоровом теле — здоровый дух!"
84310100400-18 = "Посмотрите на эти освежившиеся лица!"
84310100400-19 = ""
84310100400-22 = ""
84310100400-23 = "В каком месте это «освежились»?!"
84310100400-24 = "...Ты вообще наших лиц не видишь! Мы все в шлемах! Не говори что попало!!"
84310100400-26 = "(...Освежились, значит?)"
84310100400-27 = "В любом случае мне правда очень жаль, но все места на тренировке заняты. Свободных сейчас нет..."
84310100400-28 = "Н-Нет. Всё хорошо. Я просто ненадолго осматриваюсь..."
84310100400-30 = ""
84310100400-32 = ""
84310100400-33 = "...!! Вы это слышали?"
84310100400-34 = "Конечно!! Место?! Она сказала, что свободных мест нет?!"
84310100400-35 = "Не может быть! Эта тренировка — ад..."
84310100400-36 = ""
84310100400-39 = ""
84310100400-41 = ""
84310100400-42 = "...ски весёлая и освежающая. Было бы жалко, если бы только мы ею наслаждались! Правда же?!"
84310100400-43 = "Ага! Можете занять моё место и попробовать сами! Может, ВЫ доберётесь до десяти!"
84310100400-44 = ""
84310100400-47 = ""
84310100400-48 = "...Э."
84310100400-49 = ""
84310100400-51 = ""
84310100400-53 = "(Что это за чувство? Этот холодок... будто тело говорит мне бежать...)"
84310100400-54 = "(Это... Да... Именно оно.)"
84310100400-55 = "(...Инстинкт выживания!!)"
84310100400-56 = ""
84310100400-63 = "Какие вы все ЩЕДРЫЕ — уступить место новенькой!"
84310100400-64 = "Наверное, это эндорфины от тренировок. Они настроили вас позитивно!"
84310100400-65 = "Итак, похоже, место всё-таки есть. Подходите!"
84310100400-66 = "Познайте мир тренировок вместе с..."
84310100400-67 = ""
84310100400-69 = ""
84310100400-70 = "...А?"
84310100400-71 = ""
84310100400-74 = "...Куда она делась?"
