[translation]
2003403-1 = "Сделай сам!"
2003403-2 = "Итак, сегодня мы идём на мастер-класс по приготовлению моти. ★"
2003403-3 = "[s] «...Типичная Акари.»"
2003403-4 = "Хи-хи. Говорят, если хочешь, чтобы всё было сделано как следует, лучше сделать это самому, верно?"
2003403-5 = ""
2003403-7 = ""
2003403-9 = ""
2003403-10 = "Добро пожаловать на наш мастер-класс по приготовлению моти!"
2003403-11 = "Ну конечно. Если в блюде не хватает моти, лучше всего всегда иметь при себе свои!"
2003403-12 = "Свежеприготовленные моти очень вкусные! А если ещё и самому попотеть над ними, вкус становится только лучше!"
2003403-13 = "[s] «...Ты собираешься делать моти прямо в этом?»"
2003403-14 = "Хм? А, ты про моё кимоно?"
2003403-15 = "Хи-хи. То, что я в кимоно, ещё не значит, что я не могу делать моти, верно?"
2003403-16 = "А если что-нибудь испортится или износится, я просто отдам это в починку. Или куплю совсем новый наряд."
2003403-17 = "Съесть побольше вкусных моти важнее какой-то нарядной одежды, разве нет?"
2003403-18 = "[s] «...Ну, раз ты так говоришь...»"
2003403-19 = "Хорошо, Сенсей. Начнём?"
2003403-22 = "― [log=아카리 새해]*вздох*...[/log][wa:360]"
2003403-23 = "― [log=아카리 새해]Оказывается, тут нужно больше силы, чем я ожидала.[/log][wa:990]"
2003403-26 = "― [log=아카리 새해]Всё в порядке, Сенсей.[/log][wa:290]"
2003403-27 = "― [log=아카리 새해]Я ещё могу продолжать.[/log][wa:870]"
2003403-30 = "― [log=아카리 새해]Спасибо за беспокойство...[/log][wa:600]"
2003403-31 = "― [log=아카리 새해]Но как тут не радоваться?[/log][wa:4230]"
2003403-34 = "― [log=아카리 새해]Какие моти у нас получатся?[/log][wa:10]"
2003403-35 = "― [log=아카리 새해]Какие новые блюда можно будет из них приготовить?[/log][wa:2560]"
2003403-38 = "― [log=아카리 새해]...А потом[/log][wa:1160]"
2003403-39 = "― [log=아카리 새해]я смогу разделить все эти блюда с вами...[/log][wa:10]"
2003403-42 = "― [log=아카리 새해]...Эм, Сенсей?[/log][wa:1300]"
2003403-45 = "― [log=아카리 새해]Не окажете ли вы мне честь[/log]"
2003403-46 = "― [log=아카리 새해]первым попробовать мои моти, когда они будут готовы?[/log][wa:10]"
2003403-49 = "― [log=아카리 새해]Вы не против?[/log]"
2003403-52 = "Ух ты, у вас отлично получается! Вы точно впервые готовите моти?!"
2003403-53 = ""
2003403-55 = ""
2003403-56 = "Они такие липкие и при этом идеально мягкие!"
2003403-57 = "Очень хочу попробовать озони с этими моти!"
2003403-58 = "С самого начала я хотела приготовить моти именно для озони, но..."
2003403-59 = "Теперь мне хочется добавить их во все блюда, где только можно использовать моти."
2003403-60 = "[s] «Погоди... Акари, ты собираешься готовить всё сама?»"
2003403-61 = "Было бы замечательно, если бы я могла, но..."
2003403-62 = "Придётся обратиться за помощью к одному из немногих ресторанов, с которыми у Общества гурманов ещё остались хорошие отношения."
2003403-63 = "[s] «(Наверное, к ресторану, который с ними ещё не работал...)»"
2003403-64 = "Пойдёмте, Сенсей?"
2003403-65 = ""
2003403-67 = ""
2003403-68 = ""
2003403-69 = "Озони, осируко, охаги, исобэяки... Хи-хи, из моти можно приготовить столько всего!"
2003403-71 = "Так мне довелось попробовать множество самых разных блюд с моти."
2003403-72 = "...Честно говоря, я не смог осилить и половины. Но моти Акари всё равно были очень вкусными."
