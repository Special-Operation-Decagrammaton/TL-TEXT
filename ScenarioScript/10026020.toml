[translation]
10026020-1 = "Эпизод 2;Всё хорошо, что хорошо кончается"
10026020-2 = "Ну..."
10026020-3 = "Для Сакурако и Уи это идеальный способ помириться."
10026020-4 = "Разумеется, как заинтересованное лицо в деле о писании, вы тоже здесь, Сенсей."
10026020-5 = "...Поняла?"
10026020-6 = "[s] «...»"
10026020-8 = "[ns1] «Эм, ага... Вроде логично...»\n[ns2] «Эм... Что понятно?»"
10026020-11 = "Хи-хи... Я так и думала, что вам понадобится объяснение поподробнее."
10026020-12 = "Когда Сестринство обнаружило руины на острове неподалёку от Тринити..."
10026020-13 = "Они провели огромное исследование, пытаясь понять, что это за место и зачем его построили."
10026020-15 = "Но тот древний язык настолько сложен, что даже Сестринство не смогло его расшифровать. Проект уже много лет стоит без движения."
10026020-16 = ""
10026020-17 = "И вот тут пригодятся выдающиеся способности Уи к расшифровке древних текстов и её глубокие знания археологии."
10026020-18 = "У неё как раз есть знания, которые нужны нам, чтобы наконец понять это место! В выигрыше остаются все! ♡"
10026020-19 = "Ну... Теперь всё понятно?"
10026020-20 = "[s3] «...Понятно. Всё сложно.»\n[s4] «Кажется, теперь я понимаю...»"
10026020-23 = "Т-Только один вопрос, Ханако... Почему мы в купальниках, если исследуем древние руины?"
10026020-24 = "И почему твой так отличается от наших?"
10026020-26 = "Хината, дорогая, не забивай себе голову ненужными подробностями. ♡"
10026020-27 = "Это вовсе не ненужная подробность!"
10026020-28 = "Кохару?"
10026020-29 = "Ты сказала, что случилась чрезвычайная ситуация! Почему мы на острове посреди чёрт знает где?"
10026020-30 = "Из всех мест, где мы могли бы быть, и всех дел, которыми могли бы сейчас заниматься, почему именно здесь и именно это?"
10026020-31 = "Потому что этим летом мы так и не поиграли вместе на пляже, и мне было грустно."
10026020-32 = "Вот я и подумала, что вместо этого мы можем поиграть здесь, Кохару..."
10026020-33 = "Поиграть? Ты приехала сюда играть?!"
10026020-34 = "Тебе станет легче, если я скажу, что ты нужна здесь, чтобы присматривать за всеми в рамках своих обязанностей элитного бойца Комитета справедливости?"
10026020-35 = "Да плевать, что я чувствую! То есть да, как элитный боец я обязана это делать, но—"
10026020-36 = "Ух! Серьёзно? Компания девушек в откровенных купальниках застряла на необитаемом острове...?"
10026020-37 = "..."
10026020-38 = "Это же самое заезженное клише из всех возможных..."
10026020-40 = "А?"
10026020-41 = "Такое бывает только в дешёвых—"
10026020-42 = "Боже мой!! Боже мой, ты ведь специально всё это развратное безобразие устроила?!"
10026020-43 = "Развратное? Кохару, понятия не имею, о чём ты говоришь. Пожалуйста, объясни."
10026020-44 = "Я— Ты— Ты прекрасно понимаешь, о чём я!"
10026020-45 = "Честно говоря, нет. Расскажи, пожалуйста. И как можно подробнее, чтобы я точно знала, чего остерегаться в будущем..."
10026020-46 = "Хватит так на меня смотреть, ты... ты... извращенка!"
10026020-47 = "Что? Мы просто немного развлекаемся на солнышке. Всё-таки лето."
10026020-48 = "Ты что— Эй! Отойди от меня! Не приближайся!!"
10026020-49 = "Ты, может быть, имела в виду... вот это? Ннгх! ♡"
10026020-50 = ""
10026020-52 = ""
10026020-53 = "А-а-а-а! Отпусти меня! Сенсей, помогите! Остановите её! Ува-а!"
10026020-54 = "[ns] «Так, девушки, хватит дурачиться.»"
10026020-55 = "Почему...? Как всё дошло до такого...?"
10026020-56 = "Я всего лишь хотела докопаться до истины... А теперь меня вытащили в какую-то глушь под эту палящую жару."
10026020-57 = "И всё, что мне дали надеть, — это... это... Ух! Больше никогда не позволю кому-то другому собирать мои вещи!"
10026020-58 = ""
10026020-60 = ""
10026020-61 = "Но, полагаю, оно того стоит, если нам удастся найти..."
10026020-62 = "Хм... Если я смогу расшифровать тайны этих руин, у меня появится неопровержимое доказательство того, что Сестринство—"
10026020-63 = "Что такое, Уи?"
10026020-64 = "К-О-Д-З-Э-К-И?"
10026020-65 = "И-и-ик! Н-Не подкрадывайся ко мне так!"
10026020-66 = "И я ничего не говорила! Просто разговаривала сама с собой!"
10026020-68 = "Ох... Можешь поверить, что нам разрешила сама Сакурако? Это решит все наши проблемы!"
10026020-69 = "Когда ты с нами, Уи, у нас всё получится!"
10026020-70 = "Хината..."
10026020-71 = "Я серьёзно! Ты справишься, Уи! И пусть это не моя область знаний..."
10026020-72 = "Я останусь рядом и буду помогать всем, чем смогу!"
10026020-73 = "А-а-а-а-а!"
10026020-75 = "У-Уи?! Что случилось?! Что не так?!"
10026020-76 = "Как ты можешь быть такой оптимистичной и поддерживающей?!"
10026020-77 = "Я приехала сюда, чтобы закончить это дело и очистить своё имя. Я не ожидала... То есть..."
10026020-79 = "Я не выдержу всего этого альтруизма! Это слишком!"
10026020-80 = "Ч-Что значит «слишком»?! Я всего лишь пыталась—"
10026020-81 = "Н-Нет! Я ни в чём тебя не виню, Хината. Я просто..."
10026020-82 = "Не знаю, что ещё сказать, кроме того, что... Это моя проблема, и решать её должна я, а не ты."
10026020-83 = "*вдыхает* Фух..."
10026020-84 = "Хината, Сенсей, простите меня..."
10026020-85 = "Мне ужасно стыдно. Всё это моя вина."
10026020-86 = "Я так зациклилась на писании, что даже не задумалась, как мои действия повлияют на вас всех."
10026020-87 = "[s5] «Мы понимаем. Просто... постарайся не повторять своих ошибок, хорошо?»\n[s6] «Не переживай. Все иногда ошибаются.»"
10026020-90 = "Именно. К тому же сестра Сакурако ведь не обвиняла нас напрямую."
10026020-91 = "Как и сказал Сенсей, все ошибаются. Просто впредь тебе нужно быть осторожнее!"
10026020-92 = "Если подумать, ты уже помогала мне раньше."
10026020-93 = "Так что теперь я просто возвращаю долг. А помогать подруге мне приятно!"
10026020-94 = "*давится*"
10026020-95 = "Уи...?!"
10026020-96 = "[s7] «У вас двоих очень разные взгляды на жизнь.»\n[s8] «Тут дело не только в построении здоровых отношений.»"
10026020-99 = "Ну, не такой реакции я ожидала, но, кажется, понимаю..."
10026020-100 = "*вдыхает* Вздох..."
10026020-101 = "Да... Хорошо... Значит, вот так всё и будет."
10026020-102 = "Раз это касается и вас всех, я постараюсь изо всех сил. Договорились?"
10026020-103 = "Да! Спасибо, Уи! Спасибо тебе—"
10026020-104 = "Х-Хватит! Пожалуйста..."
10026020-105 = "Правда. Не стоит благодарности... Но если ты всерьёз хочешь помочь, можешь подсобить мне с этим багажом."
10026020-106 = "Хорошо?"
10026020-107 = "Знаю, его много, но всё это входит в мой набор для исследования руин."
10026020-108 = "Исследование, которое нам предстоит, невероятно сложное, поэтому понадобится множество инструментов."
10026020-109 = "У меня есть словарь мёртвого языка, чернила для снятия копий, реагенты для удаления загрязнений... всё!"
10026020-110 = "Но будь осторожна. Эти сумки гораздо тяжелее, чем выглядят."
10026020-111 = "Нннгх!"
10026020-112 = "Сейчас! Я возьму эту!"
10026020-113 = "Оп!"
10026020-115 = "...?"
10026020-116 = "Как ты подняла это одной рукой?!"
10026020-117 = "В смысле? Я что-то сделала не так?"
10026020-118 = "Н-Нет, я просто удивилась. Мне приходится напрягать все силы, чтобы хотя бы тащить их..."
10026020-119 = "О! Тогда за меня не переживай. Я отвечаю за все припасы собора, так что успела неплохо накачать мышцы!"
10026020-120 = "А... Ну, если с тобой всё хорошо, тогда ладно."
10026020-121 = ""
10026020-123 = ""
10026020-124 = "...Эм, Хината?"
10026020-125 = "Да, Уи?"
10026020-126 = "Знаю, то, что я сейчас скажу, прозвучит странно, но..."
10026020-127 = "Я не вижу другого способа справиться с этим и прошу тебя отнестись с пониманием."
10026020-128 = "Сможешь?"
10026020-129 = "Ты не очень понятно объясняешь, но... ладно."
10026020-130 = "...Спасибо, Хината. Мне нужно... Ну..."
10026020-131 = ""
10026020-133 = ""
10026020-134 = "Когда здесь все... На меня слишком давит! Мне нужно пространство. В буквальном смысле... постоянно держитесь хотя бы в двух метрах от меня..."
10026020-135 = ""
10026020-137 = ""
10026020-138 = "Ч—"
10026020-139 = "А?!"
10026020-141 = "Клянусь, я ничего такого не имею в виду! Просто... это моя собственная... странная... особенность... Хорошо?"
10026020-142 = "В общем... Эм... Мы не можем таскать всё это с собой повсюду, так что... Почему бы не разбить базовый лагерь?"
10026020-143 = "Вон там! Похоже на хорошее место. Иди за мной, Хината... на расстоянии."
10026020-144 = ""
10026020-146 = ""
10026020-149 = "Два метра."
10026020-150 = ""
10026020-153 = ""
10026020-154 = "П-П-Почему, Уи?! Уи!"
10026020-155 = ""
10026020-157 = ""
10026020-158 = "[ns] «Не переживай. Вам двоим просто нужно немного времени, чтобы привыкнуть друг к другу.»"
10026020-160 = ""
10026020-161 = "[ns9] «Ты в порядке, Кохару?»\n[ns10] «Прости, что тебя втянули во всё это.»"
10026020-164 = "Ну, я не сказать чтобы в восторге от всего этого, но со мной всё будет нормально. К тому же у нас есть работа."
10026020-165 = "Я толком не понимаю, зачем мы исследуем эти руины, но знаю, что это важно."
10026020-166 = "Так что как элитный боец Комитета справедливости я сделаю всё, что смогу!"
10026020-167 = "Несмотря на то, что мы на необитаемом острове... в одних купальниках... вместе с Ханако..."
10026020-168 = "..."
10026020-169 = "Аргх! Смерть! Казнь!"
10026020-170 = "[s] «А?!»"
10026020-171 = "С этого момента я буду пристально за ней следить!"
10026020-172 = "Как элитный боец Комитета справедливости я обязана защищать честь Тринити!"
10026020-173 = "[s] «...Отлично. Я за тебя болею, Кохару.»"
10026020-175 = "Так началось исследование руин."
