[translation]
2001702-1 = "Девушка всё ещё хочет читать"
2001702-2 = "Узнав, где находится Хиёри, я отправился её искать."
2001702-4 = "Где-то в незарегистрированном районе"
2001702-5 = "Хиёри висела на электрическом столбе."
2001702-6 = "[s] «Привет, Хиёри.»"
2001702-7 = "А-Ай...?!"
2001702-10 = "О-Ой..."
2001702-11 = "С-Сенсей, что вы здесь делаете?!"
2001702-12 = "Точно... Вы спрашивали, где я."
2001702-13 = "Не думала, что найдёте меня в незарегистрированном районе. Генеральный студсовет такие вещи не отслеживает."
2001702-14 = "[s] «Если честно, это было довольно легко.»"
2001702-15 = "Я-я вижу... Взрослые и правда впечатляют."
2001702-16 = "[s] «Но важнее другое — что ты делала?»"
2001702-17 = "О, я? Ну, мне пришлось залезть на электрический столб..."
2001702-18 = "...чтобы зарядить телефон."
2001702-19 = "[s] «Прямо там наверху?»"
2001702-20 = "Да. Как вы знаете, у меня нет дома и я не принадлежу ни к какой академии."
2001702-21 = "В заброшенных зданиях, где мы живём, нет ни воды, ни электричества."
2001702-22 = "Так что если я хочу зарядить телефон, приходится идти в город и где-нибудь воровать электричество."
2001702-23 = "На меня накричали за то, что я заряжала пять разных аккумуляторов в круглосуточном фастфуде..."
2001702-24 = "Но стрелять-то было необязательно... Городские такие злые. Хе... хе..."
2001702-25 = "[s] «...»"
2001702-26 = "А вчера я прочитала в журнале, что в распределительных коробках на электрических столбах есть розетки. Вот поэтому вы и нашли меня там."
2001702-27 = "[s1] «Не стоит так мешать другим.»\n[s2] «И не делай так — это опасно.»"
2001702-28 = "Хи-хи-хи... Но этот район тоже ворует электричество у большого города рядом. Так разве плохо воровать у воров?"
2001702-29 = "Хи-хи-хи... Но этот район тоже ворует электричество у большого города рядом. Так разве плохо воровать у воров?"
2001702-30 = "[s] «Всё равно это неправильно.»"
2001702-31 = "Ч-Что?! Правда?"
2001702-32 = "Но... его ведь уже украли! Если закрасить чёрное чёрным, ничего не изменится, правда?!"
2001702-33 = "Жизнь — бесконечное страдание... Разве мне нельзя хотя бы такое маленькое утешение?"
2001702-34 = "Я смотрю боли прямо в глаза... Что я буду делать без своих вебтунов?"
2001702-35 = "Чёрный экран телефона похож на мою жизнь. Пустой, без будущего. Бесплодный."
2001702-36 = "Может, взрослым вроде вас никогда не приходится страдать от того, что нельзя читать вебтуны из-за севшей батареи!"
2001702-37 = "Но такова моя жизнь, Сенсей! Со мной это постоянно! Вчера, сегодня, завтра и послезавтра!"
2001702-38 = "А чтобы отправить хотя бы одно простое сообщение в MomoTalk, мне приходится махать рукой, как птице, пытаясь поймать бесплатный Wi-Fi!"
2001702-39 = "[s] «Успокойся, Хиёри!»"
2001702-40 = "Почему моя жизнь такая? Полный бардак. Я неудачница. Всё кончено. УАААА!"
2001702-41 = "Я хочу читать вебтуны на максимальной яркости! Неужели я слишком многого прошу?!"
2001702-42 = "[s] «(Похоже, выбора у меня нет.)»"
2001702-44 = "Оплата за три одноразовых аккумулятора получена. Большое спасибо!"
2001702-46 = "..."
2001702-47 = "[s] «Они одноразовые, так что береги их для экстренных случаев.»"
2001702-48 = "Эм, н-ну..."
2001702-49 = "Мне правда можно это принять? Не знаю. Лидер сказала ни на кого не полагаться..."
2001702-50 = "Вот так просто возьмёте и отдадите мне это? Она ещё говорила, что у людей, которые кажутся добрыми, всегда есть скрытая цель!"
2001702-51 = "Ч-Чего вы от меня хотите...?"
2001702-52 = "[s] «Наверное, чтобы ты не лазила по электрическим столбам?»"
2001702-53 = "Х-Хорошо..."
2001702-54 = "Э-Это я могу."
