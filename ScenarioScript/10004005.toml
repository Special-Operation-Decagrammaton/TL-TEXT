[translation]
10004005-1 = "Пролог;С моими маленькими ангелочками"
10004005-2 = "Гончарная мастерская"
10004005-3 = "Все! Сегодня на экскурсии мы посетим гончарную мастерскую Сенсея Некоты, лучшего мастера-керамиста в Шаньхайцзине."
10004005-4 = "Ещё раз хочу поблагодарить Сенсея Некоту за то, что разрешил нам провести здесь особую экскурсию. А теперь давайте узнаем, как делают керамику!"
10004005-5 = "Хорошо!"
10004005-6 = "Сенсей Некота, огромное спасибо, что позволили нам сегодня провести экскурсию в мастерской."
10004005-7 = "Не стоит. Мне совсем не сложно."
10004005-8 = "Дети — будущее академии. Я буду очень рад, если эта экскурсия вдохновит воспитанников Сада сливового цветка."
10004005-9 = "Да. Детские мечты очень важны."
10004005-10 = "На что посмотрим сначала?"
10004005-13 = "Сенсей Некота, что это за глиняная чашка?"
10004005-14 = "О, это новая работа для предстоящей выставки..."
10004005-15 = "Ой, поверхность такая мягкая и податливая!"
10004005-16 = "Акх!"
10004005-18 = "На работе, которую делали десять часов, остались отпечатки рук!"
10004005-19 = "В-Все! Пожалуйста, не трогайте работы Сенсея Некоты!"
10004005-20 = "Я-я виновата. Нужно было лучше объяснить детям правила..."
10004005-21 = "Всё нормально. Я на всякий случай сделал запасные экземпляры."
10004005-22 = ""
10004005-23 = "К-Кстати, это студенты Сада сливового цветка забрались на печь?!"
10004005-24 = "Ух ты! Как высоко!"
10004005-25 = "В-Все! Не залезайте на печь! Это опасно!"
10004005-26 = "Аргх! Она продолжает кидать в меня глину!"
10004005-27 = "Но она первая бросила в меня гранату!"
10004005-28 = "Н-Нельзя бросаться в друзей ни глиной, НИ гранатами!"
10004005-29 = ""
10004005-31 = ""
10004005-32 = "Это печь для обжига керамики?"
10004005-33 = "Ага, но огонь какой-то слабый..."
10004005-34 = "Точно, давайте поможем Сенсею Некоте!"
10004005-35 = ""
10004005-38 = "Не бросайте в печь белый фосфор!"
10004005-39 = "Ах, печь, моя мастерская... Они горят!"
10004005-40 = "Шун, я в туалет!"
10004005-41 = "Я домой!"
10004005-42 = ""
10004005-44 = "Все, пожалуйста, не разбегайтесь! Слушайте мои указания!"
