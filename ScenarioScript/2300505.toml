[translation]
2300505-1 = "Ремонт Школы Суровой Жизни"
2300505-2 = "Школа Абидос"
2300505-3 = "Ох... Проводить выходной за ремонтом школы..."
2300505-4 = "Я-то не против, но что насчёт Вас, Сенсей?"
2300505-5 = "[s1] «Всё хорошо.»\n[s2] «Мне всё равно было нечем заняться.»"
2300505-6 = "Но я уверена, что у Вас есть дела..."
2300505-7 = "Но я уверена, что у Вас есть дела..."
2300505-8 = "Здание школы очень старое, поэтому ремонтировать нужно буквально всё."
2300505-9 = "Обычно мы просто оставляем всё как есть, но..."
2300505-10 = "...вечно игнорировать это нельзя. Поэтому приходится выделять время на ремонт."
2300505-11 = "[s] «Ладно! Тогда начнём.»"
2300505-14 = "Кран на Школьном Дворе"
2300505-16 = "[ns] «Это кран.»"
2300505-17 = "Именно! Несколько дней назад вода внезапно перестала течь..."
2300505-18 = "Думаю, проблема с трубами... Из-за клубных дел я так и не успела разобраться."
2300505-19 = "[s3] «Проблема с водопроводом звучит серьёзно.»\n[s4] «Думаешь, мы справимся сами?»"
2300505-20 = "Ну, я уже не раз его чинила."
2300505-21 = "Ну, я уже не раз его чинила."
2300505-22 = "[s] «Правда?»"
2300505-23 = "Да. Когда он сломался впервые, я вызвала мастера и внимательно наблюдала за ним."
2300505-24 = "Подумала, что смогу сделать сама, и с тех пор чиню его самостоятельно."
2300505-25 = "[s] «Это впечатляет, Аяне.»"
2300505-26 = "Ахаха... Ну, я не изучала руководство по ремонту или книги по сантехнике..."
2300505-27 = "Так что ничего такого удивительного."
2300505-28 = "Ладно, посмотрим, что здесь сломалось..."
2300505-29 = ""
2300505-30 = "*писк* *писк*"
2300505-31 = "..."
2300505-32 = "[s] «Даже если повернуть кран, вода не идёт.»"
2300505-33 = "Хм... В таких случаях обычно проблема с нижним счётчиком трубы..."
2300505-34 = ""
2300505-36 = "*шорох*"
2300505-37 = "Хм... Он должен быть где-то здесь..."
2300505-38 = "(шарит)"
2300505-39 = "...А?"
2300505-40 = "[s] «Эм, что-то не так?»"
2300505-41 = "Да, похоже..."
2300505-42 = "(встаёт)"
2300505-43 = "*БАМ*"
2300505-44 = "Аргх!"
2300505-45 = "Пытаясь встать, Аяне с громким треском ударилась головой о бетонный угол крана."
2300505-46 = "[s5] «Ты в порядке, Аяне?!»\n[s6] «Что это был за звук?!»\n[s7] «Почему ты закричала?!»"
2300505-47 = "Ааах... Уф..."
2300505-48 = "Ааах... Уф..."
2300505-49 = "Ааах... Уф..."
2300505-50 = "...Я-я в порядке... Ай... Зато теперь знаю, в чём проблема..."
2300505-51 = "*шорх*"
2300505-52 = "[s8] «...»\n[s9] «...»"
2300505-53 = "Если... Если бы это была протечка, счётчик всё равно бы капал. Но он вообще не работает..."
2300505-54 = "Если... Если бы это была протечка, счётчик всё равно бы капал. Но он вообще не работает..."
2300505-55 = "[s10] «Думаю, сначала нужно позаботиться о тебе...»\n[s11] «Но твоя голова...»"
2300505-56 = "Просто слегка ударилась. Всё нормально..."
2300505-57 = "Просто слегка ударилась. Всё нормально..."
2300505-58 = "..."
2300505-59 = "*шмыг* И мне ничуточки не больно..."
2300505-60 = "Хорошо. Раз мы поняли, в чём дело... идём дальше."
2300505-61 = ""
2300505-62 = ""
2300505-63 = ""
2300505-64 = "Мне хотелось сказать Аяне, что плакать нормально..."
2300505-65 = "...но я не хотел смущать её ещё сильнее."
2300505-67 = "Подвал школы Абидос"
2300505-68 = "*вж-ж-ж*"
2300505-69 = "Сюда сходятся все трубы школьного здания."
2300505-70 = "Все, без которых можно обойтись, я перекрыла... Открыты только трубы душевых, туалетов и кухни."
2300505-71 = "И, конечно, кран на школьном дворе тоже должен быть открыт..."
2300505-72 = "[s] «Странно... Он перекрыт.»"
2300505-73 = "О, правда? Значит, кто-то закрыл вентиль."
2300505-74 = "Наверняка случайно. Если бы кто-то хотел нам навредить, логичнее было бы перекрыть туалеты..."
2300505-75 = "..."
2300505-76 = "[s] «Я не расслышал. Что ты сказала?»"
2300505-77 = "Эм... Наверняка кто-то из Комитета, хотя я не понимаю, зачем им это делать."
2300505-78 = "В любом случае, теперь мы знаем причину... Нужно просто открыть вентиль."
2300505-79 = "Мне понадобится ключ на 12..."
2300505-80 = "Эм... Наверное, он в кладовой спортзала."
2300505-81 = "[s] «Мне сходить?»"
2300505-82 = "Нет, самому там трудно найти дорогу... Я пойду с Вами, Сенсей."
2300505-84 = "*скрип*"
2300505-85 = ""
2300505-86 = "*кашляет* *кашляет*"
2300505-87 = "Уф... Дверью так давно не пользовались, что она даже нормально не открывается."
2300505-88 = "У кладовой стальная дверь, поэтому открывать её всегда тяжело."
2300505-89 = "Кажется, раньше здесь было бомбоубежище."
2300505-90 = "Если эта дверь заклинит, изнутри её уже не открыть. Когда-нибудь придётся попросить кого-нибудь починить её, пока этого не случилось..."
2300505-91 = "*клац*"
2300505-92 = "..."
2300505-93 = "[s] «Звучало нехорошо...»"
2300505-94 = "Ч-Что...?!"
2300505-95 = ""
2300505-96 = "*тук* *тук* ...Дверь заперта?"
2300505-97 = "Ох, чёрт!.."
2300505-98 = "Не открывается! Ч-Что делать?!"
2300505-99 = "[s12] «Всё хорошо. Успокойся, Аяне.»\n[s13] «Ничего страшного. Не беспокойся!»"
2300505-100 = "Н-Нет, Вы правы. Всё будет нормально..."
2300505-101 = "Н-Нет, Вы правы. Всё будет нормально..."
2300505-102 = "Если просто позвоним остальным членам клуба и скажем, что застряли в кладовой, нас быстро вытащат..."
2300505-103 = "\"Аяне? Что ты делала в кладовой наедине с Сенсеем?\" ...Я не знаю, что бы ответила..."
2300505-104 = "[s] «Почему просто не сказать правду?»"
2300505-105 = "..."
2300505-106 = "П-Правда... Конечно, они поймут, да?"
2300505-107 = "..."
2300505-108 = "А точно поймут? Ну... серьёзно?"
2300505-109 = "Да! Конечно... если это Вы... то я не против... То есть вообще всегда пожалуйста... Но..."
2300505-110 = "А если они будут смотреть на меня с изумлением и восхищением? Наверняка не думали, что я такая смелая..."
2300505-111 = "Уф! Я тогда просто захочу сжаться и умереть..."
2300505-112 = "[s14] «Аяне, успокойся.» \n[s15] «Кажется, у меня есть решение.»"
2300505-113 = "...А?!"
2300505-114 = "...А?!"
2300505-115 = "[ns] «Что там на стене?»"
2300505-117 = ""
2300505-118 = "А..."
2300505-119 = "Окно."
2300505-120 = "[s] «Именно.»"
2300505-121 = ""
2300505-122 = ""
2300505-123 = "Похоже, один человек сможет протиснуться... но оно очень высоко!"
2300505-124 = "[s16] «Я подсажу.»\n[s17] «Думаю, тебе стоит пролезть.»"
2300505-125 = "Что?!"
2300505-126 = "Что?!"
2300505-127 = "Хотите сказать, чтобы я встала Вам на плечи?!"
2300505-128 = "Н-Но..."
2300505-129 = "[s] «Можем вместо этого позвонить остальным.»"
2300505-130 = "..."
2300505-131 = "...Ладно, я встану!"
2300505-133 = "Хорошо, рассчитываю на тебя."
2300505-134 = "*натужно кряхтит*"
2300505-135 = "Простите, Сенсей. Я немного тяжёлая, да?"
2300505-136 = "Уф... Наверное, стоило надеть чулки или что-нибудь такое..."
2300505-137 = "*грохот*"
2300505-138 = "Ох, гора с плеч, окно открыто..."
2300505-139 = "Поехали!"
2300505-140 = "*вжух*"
2300505-141 = "Агх!"
2300505-142 = "*туп*"
2300505-143 = "[s] «Ты в порядке, Аяне?»"
2300505-144 = "*кашель* *кашель* Я... Я просто немного упала... И во рту земля... Тьфу..."
2300505-145 = "Но я выбралась..."
2300505-146 = "Сейчас пойду открою дверь."
2300505-150 = "*тык* *тык* *тык* *тык* *тык*"
2300505-151 = "*клац*"
2300505-152 = "*скрип*"
2300505-154 = "..."
2300505-155 = "[s18] «Ты справилась, Аяне!»\n[s19] «Ого! Ты вся в грязи.»"
2300505-156 = "А-ха-ха..."
2300505-157 = "А-ха-ха..."
2300505-160 = "После этого мы нашли ключ и вернулись открыть вентиль у крана."
2300505-162 = "..."
2300505-163 = ""
2300505-164 = "*писк* *писк*"
2300505-165 = "*кап* *кап* *кап*"
2300505-166 = "*вздох* Вода пошла, Сенсей."
2300505-167 = "Хорошая работа. Кран починили."
2300505-168 = "[s] «Ты тоже отлично справилась.»"
2300505-169 = "*вздох* Я вся в грязи... хочу пить... и вообще ужасно выгляжу..."
2300505-170 = ""
2300505-171 = ""
2300505-173 = "Мне нужно немного привести себя в порядок, Сенсей."
2300505-176 = "― А? Сенсей? Вы здесь?[wa:4520]"
2300505-178 = "― Я почти ничего не вижу... Всё мыльное.[wa:1180]"
2300505-181 = "[ns] «Никогда раньше не видел тебя без очков.»"
2300505-182 = "― А? О. Ну да. Обычно у меня нет причин их снимать.[wa:2520]"
2300505-184 = "― А-Ахаха... По сути я их только в душе и снимаю.[wa:1580]"
2300505-187 = "― Ну вот. Я чувствую, что краснею...[wa:1280]"
2300505-189 = "― Я постоянно выставляю себя перед Вами в неловком свете...[wa:40]"
2300505-192 = "[ns20] «По-моему, это мило.»\n[ns21] «Ты такая милая, когда смущаешься.»"
2300505-195 = "― Что?! В-Вы считаете это милым? Не понимаю, о чём Вы...[wa:720]"
2300505-197 = "― У-Уф...[wa:940]"
2300505-200 = "― П-Прошу, не смотрите на меня так...[wa:80]"
2300505-202 = "― В-Вы меня смущаете...[wa:360]"
