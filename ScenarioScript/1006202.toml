[translation]
1006202-1 = "Повседневные хлопоты"
1006202-2 = "Исполнительный офис Шале"
1006202-8 = "Я едва успел сесть за свой стол..."
1006202-9 = "Как вдруг..."
1006202-10 = "Доброе утро, Сенсей."
1006202-11 = "[s1] «Кто?!»\n[s2] «...Токи?!»"
1006202-12 = "..."
1006202-13 = "Понятно. Вы совершенно обо мне забыли, Сенсей."
1006202-14 = "Ничего страшного. Правда, всё в порядке. Я не из тех, кого может ранить такая мелочь. Я прощаю вас за то, что вы меня забыли."
1006202-15 = "Но интересно... простят ли вас мой безупречный костюм горничной и идеально чистый ракетомёт?"
1006202-16 = "[ns3] «Н-Нет! Прости! Я не забыл. Просто удивился!»"
1006202-18 = "[ns4] «Токи! Это же Токи, верно? Асума Токи!»"
1006202-19 = "О, вы вспомнили. Спасибо, Сенсей."
1006202-20 = "Спасибо, что помните меня, Сенсей."
1006202-21 = "Хотя я не думала, что так сильно вас удивлю. Немного тревожно... Я что-то сделала неправильно?"
1006202-22 = "[ns5] «Н-Нет, всё нормально. Ученики должны свободно приходить к своему учителю, когда захотят!»"
1006202-24 = "[ns6] «Но в следующий раз... я был бы благодарен, если бы ты хотя бы сначала связалась со мной.»"
1006202-25 = "Я связалась."
1006202-26 = "[s7] «Связалась...?»"
1006202-27 = "Просто не раскрыла свою личность."
1006202-28 = "[ns8] «Ты вообще слышишь, что говоришь?»"
1006202-29 = "Итак, вы хотели знать, почему я так рано утром нахожусь в Шале."
1006202-30 = "Итак, вы хотели знать, почему я так рано утром нахожусь в Шале."
1006202-31 = "Просто в моём расписании внезапно появилось свободное время."
1006202-32 = "[s] «...Это вообще ничего не прояснило.»"
1006202-33 = "Вот как? Хм... Эта штука под названием «объяснение» довольно сложная."
1006202-34 = "[s] «(Правда?)»"
1006202-35 = "Попробую ещё раз. Раньше я служила одному человеку."
1006202-36 = "Я была её телохранителем и помощницей."
1006202-37 = "Но затем кое-что произошло."
1006202-38 = "Она исчезла, оставив мне лишь несколько распоряжений."
1006202-39 = "Внезапно я осталась без обязанностей, без долга. Я задумалась, что делать дальше."
1006202-40 = "[s] «Здорово, что ты смогла обдумать проблему и найти решение.»"
1006202-41 = "Да. Я пришла к выводу, что буду заниматься вашими повседневными делами, Сенсей."
1006202-42 = "[s] «Почему?»"
1006202-43 = "Я считаю, что раз именно вы ответственны за моё нынешнее положение, то и исправить его — тоже ваша ответственность."
1006202-44 = ""
1006202-48 = "Воспринимайте это не как проблему, а как возможность задуматься о последствиях своих действий."
1006202-49 = "[s] «Ну это уже перебор!»"
1006202-50 = "Нет. Это в высшей степени логично и справедливо. Очень разумный вывод, если позволите мне так сказать."
1006202-51 = ""
1006202-53 = ""
1006202-55 = "В общем, всё именно так. Поэтому отныне я буду заботиться о вас, Сенсей."
1006202-56 = "[ns] «П-подожди! Токи? Стой, Токи?!»"
1006202-58 = "Несмотря на мои протесты, забота Токи началась..."
1006202-60 = "Улица в центре города"
1006202-61 = ""
1006202-64 = ""
1006202-65 = ""
1006202-66 = ""
1006202-69 = "Эй... это же Сенсей из Шале? Он правда заставляет студента ходить за ним в костюме горничной?"
1006202-70 = "Сенсей из Шале вроде кажется хорошим человеком, но я слышала, что иногда он заставляет учеников делать всякое странное. Неужели слухи всё-таки правдивы?"
1006202-72 = "А, я слышу, как прохожие хвалят мою работу."
1006202-73 = "Разве я не являюсь воплощением идеальной горничной, Сенсей?"
1006202-74 = "[s] «Мне кажется, хвалят не тебя, а критикуют меня...»"
1006202-75 = ""
1006202-77 = ""
1006202-79 = "Понятно. Тогда воспользуюсь случаем и покажу вам ещё одну сторону моего безупречного сервиса: я способна защитить вас от любой угрозы."
1006202-80 = "Повышаю уровень тревоги. Перехожу в боевой режим."
1006202-81 = ""
1006202-87 = ""
1006202-88 = ""
1006202-89 = "Боже! Теперь он ещё и заставляет студента переодеваться?!"
1006202-90 = "И прямо посреди людной улицы... Какой позор!"
1006202-91 = "[ns9] «Нет-нет-нет! Токи!»\n[ns10] «Пожалуйста, отключи боевой режим!»"
1006202-94 = ""
1006202-96 = ""
1006202-98 = ""
1006202-102 = ""
1006202-104 = "Разочаровывает. Понижаю уровень тревоги на одну ступень. Я продолжу вас защищать."
1006202-106 = "А, Сенсей. У вас есть минутка?"
1006202-107 = ""
1006202-109 = ""
1006202-110 = ""
1006202-111 = "Подождите. Если вы хотите поговорить с Сенсеем, сначала должны получить моё разрешение."
1006202-112 = "А?"
1006202-113 = "На какую тему вы хотите поговорить с Сенсеем? По какой причине? Какой тон разговора вы предполагаете?"
1006202-114 = "Сколько времени это займёт? Какой цели вы хотите достичь за это время?"
1006202-115 = "Я, эм, просто..."
1006202-116 = "[ns] «Стойте, стойте. Подождите!»"
1006202-118 = "И вот так Токи весь день «заботилась» обо мне."
1006202-119 = "Во многих смыслах это был... интересный день."
1006202-124 = "[ns] «Токи, спасибо тебе за... усердную работу сегодня...»"
1006202-125 = "Хм. Вы выглядите уставшим. Всё в порядке?"
1006202-126 = "Вы не хотите, чтобы я переживала? Но..."
1006202-127 = "..."
1006202-128 = "Может быть, моя забота утомила вас, Сенсей?"
1006202-129 = "[s] «Не совсем, но... пожалуй, это было немного чересчур.»"
1006202-130 = "О? Но если уж на то пошло, сегодня я вела себя даже сдержаннее обычного."
1006202-131 = "Что? Вы думаете, я шучу?"
1006202-132 = ""
1006202-134 = ""
1006202-136 = "Посмотрите мне в глаза. Я похожа на студента, который часто шутит?"
1006202-137 = "[s] «Я именно потому это и сказал, что ты не шутишь!»"
1006202-138 = "О, слава богу. Приятно видеть доказательство вашей здравой рассудительности, Сенсей."
1006202-139 = "[s] «В любом случае, когда помогаешь мне, не обязательно заходить так далеко.»"
1006202-140 = "Серьёзно?"
1006202-141 = "Вам следует лучше осознавать важность своего положения, Сенсей."
1006202-142 = "Но если вы настаиваете... Я поняла."
1006202-143 = "[s11] «Мне понравилось провести сегодняшний день с тобой, Токи.»\n[s12] «Надеюсь, в будущем ты будешь вести себя со мной немного непринуждённее.»"
1006202-146 = "Непринуждённее. Понятно..."
1006202-147 = "Я поняла, Сенсей."
1006202-148 = "Лады, Сенсей. Надеюсь, сработаемся, ага?"
1006202-149 = ""
1006202-153 = "...Шучу. Подражание — один из навыков превосходной горничной. Не надо так удивляться."
1006202-154 = "[s] «Я думал, ты не шутишь!»"
1006202-155 = "Иногда шучу."
1006202-156 = "[s] «Ты меня предала! Ты ранила мои чувства!»"
1006202-157 = "..."
1006202-158 = "Верно. Я ранила ваши чувства. А значит, победа за мной."
1006202-159 = "[s] «А я, выходит, проиграл... Могу ли я теперь вообще называться учителем...?»"
1006202-160 = "Что ж, это проблема. Вы должны оставаться учителем, чтобы я могла продолжать вам помогать."
1006202-161 = "Это ваш долг, чтобы я могла продолжать исполнять свой."
1006202-162 = "[s] «Просто интересно: это твой способ вести себя непринуждённо...?»"
1006202-163 = "...Хех."
1006202-164 = "...А если я скажу «да», что вы ответите?"
1006202-165 = "[s] «Ну, если тебе так комфортнее... Хех. Ха-ха-ха...»"
1006202-166 = "Замечательно. Спасибо, Сенсей."
1006202-168 = "Токи ушла с самодовольным выражением лица."
1006202-169 = "А затем, на следующий день..."
1006202-173 = ""
1006202-176 = ""
1006202-178 = "Доброе утро, Сенсей."
1006202-179 = "[s] «Я так и думал, что это произойдёт.»"
1006202-180 = "Спасибо, что помните меня, Сенсей."
1006202-181 = "Сегодня я снова буду о вас заботиться."
1006202-182 = ""
1006202-184 = ""
1006202-186 = ""
1006202-187 = "Пойдёмте, Сенсей?"
1006202-189 = "У меня было смутное предчувствие, что впереди ещё один насыщенный день."
