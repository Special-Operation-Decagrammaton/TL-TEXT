84300200600-11 = "Я принесла товар. Деньги у вас?"
84300200600-12 = ""
84300200600-14 = ""
84300200600-15 = "Конечно. У нас контракт. Только не говори, что теперь занервничала."
84300200600-16 = "Как и обещали, если всё пройдёт хорошо, получите свои 25 процентов."
84300200600-17 = "Хочешь знать, сколько это будет?"
84300200600-18 = "Ну, всё зависит от того, насколько хорошо вы справитесь с работой! Так что это уже от вас зависит."
84300200600-20 = "Верно. Таков был договор."
84300200600-21 = "Но устроить «Катастрофу Выставки Миллениума»... это довольно... амбициозно."
84300200600-22 = ""
84300200600-24 = ""
84300200600-26 = "*ахает*"
84300200600-27 = "(Что...? Катастрофу?)"
84300200600-29 = "То есть деньги — это, конечно, хорошо, но..."
84300200600-30 = "Послушайте, друзья. Ещё никто не разбогател, делая то же, что и все остальные."
84300200600-31 = "Хотите грести деньги лопатой — делайте то, о чём никто до вас даже не мечтал."
84300200600-32 = "Кто первым пересёк финиш, тот и забрал золото! Понятно?"
84300200600-33 = "А мне пора делать ещё несколько предложений другим клиентам."
84300200600-34 = "Если что-то случится — звоните! Увидимся!"
84300200600-35 = ""
84300200600-37 = ""
84300200600-38 = ""
84300200600-39 = ""
84300200600-41 = "(Они собираются разрушить Выставку Миллениума... ради прибыли...?)"
84300200600-42 = "Это... нелепо..."
84300200600-43 = "(Ай, я сказала это вслух!)"
84300200600-45 = "А? Что? Вы это слышали?"
84300200600-46 = "Не может быть... Если нас раскроют, нам конец."
84300200600-47 = "Особенно если нас найдёт C&C! Тогда нам ещё и не заплатят!"
84300200600-48 = "Для начала давайте просто уйдём отсюда. Мне уже не по себе."
84300200600-49 = "Я пошла! Не отставайте!"
84300200600-50 = ""
84300200600-52 = ""
84300200600-53 = "Э-эй! Не бросай меня!"
84300200600-54 = ""
84300200600-56 = ""
84300200600-58 = ""
84300200600-59 = "(...Фух.)"
84300200600-60 = "(Чуть не попалась.)"
84300200600-62 = ""
84300200600-65 = "Хмф. Упустила их. В этот раз почти схватила."
84300200600-66 = "(...?)"
84300200600-67 = "(Это...)"
84300200600-68 = ""
84300200600-70 = ""
84300200600-73 = ""
84300200600-74 = "Привет."
84300200600-75 = "(...?)"
84300200600-76 = "Эй, ты. Отвечать не собираешься?"
84300200600-77 = ""
84300200600-79 = ""
84300200600-80 = "Ты там. Да, ты. И дальше будешь меня игнорировать после того, как испортила мой план?"
84300200600-81 = "(...!)"
84300200600-82 = "Выходи. Бить не буду. Ты не похожа на человека, с которым мне хотелось бы драться."
84300200600-83 = ""
84300200600-85 = ""
