[translation]
1013402-1 = "Тренировка героя"
1013402-2 = "Бум-бум-бум!"
1013402-3 = "У меня появилось новое снаряжение!"
1013402-4 = ""
1013402-6 = ""
1013402-7 = "Теперь оружие и доспехи героя вновь вместе!"
1013402-8 = "Собрав всё легендарное снаряжение, я переродилась в истинного героя!"
1013402-9 = "[s1] «Ого, поздравляю!»\n[s2] «Теперь ты непобедима!»"
1013402-10 = ""
1013402-11 = ""
1013402-13 = "Нет... Я забыла кое-что очень важное."
1013402-14 = "Одного наличия снаряжения недостаточно."
1013402-15 = "Чтобы раскрыть его истинный потенциал, я должна повысить навык владения снаряжением!"
1013402-16 = "[s3] «Аби-Эшух и так является высокомобильным оружием.»\n[s4] «А версия Арис теперь ещё и умеет летать.»"
1013402-19 = "Да, именно! Будто мой мир превратился из сайд-скроллера в трёхмерный..."
1013402-20 = "Можете считать меня Арис 64!"
1013402-21 = "Чтобы эффективно сражаться, я должна без труда ориентироваться в своём положении и направлении в воздухе!"
1013402-22 = "Это испытание требует Тренировки героя!"
1013402-23 = "Мудрый мудрец научил меня управлять доспехами..."
1013402-24 = "Теперь я должна освоить их бесконечными повторениями!"
1013402-25 = "Но тренировка героя непроста... Такое чувство, будто я играю в платформер со сломанным джойстиком!"
1013402-26 = "Поэтому, Сенсей, мне нужна ваша помощь!"
1013402-27 = "[s5] «Хорошо! Поддержку оставь мне!»\n[s6] «Просто скажи, что нужно!»"
1013402-30 = "Пожалуйста, подбадривайте меня со стороны!"
1013402-31 = ""
1013402-34 = "[ns7] «...?»\n[ns8] «...И всё?»"
1013402-37 = "Да!"
1013402-38 = "Ведь вы талисман! Одно ваше присутствие придаёт мне сил!"
1013402-39 = "Пока вы состоите в моей группе, я смогу преодолеть любую тренировку, какой бы сложной она ни была!"
1013402-40 = "...Что-то не так, Сенсей?"
1013402-41 = "Вы выглядите как брошенный щенок."
1013402-42 = "А? Ничего?"
1013402-43 = "...?"
1013402-44 = "Хорошо! Раз вы так говорите! А теперь пора начинать Тренировку героя!"
1013402-46 = "И так Арис приступила к своей интенсивной Тренировке героя...!"
1013402-49 = "Может, если я сделаю вот так..."
1013402-50 = ""
1013402-53 = "Ай! Не туда! Нужно просто включить обратную тягу..."
1013402-54 = ""
1013402-57 = "Не те ускорители! И-и!"
1013402-58 = "Я кручу-у-у-усь!!"
1013402-60 = "...Хотя тренировка вышла насыщенной событиями, к счастью, всё обошлось без серьёзных происшествий."
1013402-62 = ""
1013402-63 = "*тяжело дышит* *тяжело дышит*"
1013402-64 = "Может, если повернуть вправо резче..."
1013402-65 = ""
1013402-67 = ""
1013402-68 = "...Тренировка Арис продолжалась довольно долго."
1013402-69 = "Шло время, и становилось ясно, что останавливаться она не собирается."
1013402-70 = ""
1013402-72 = ""
1013402-73 = ""
1013402-74 = "...Кья-а-а!"
1013402-75 = ""
1013402-78 = ""
1013402-79 = "В прошлый раз у меня получилось..."
1013402-80 = "Но сейчас никак не выходит! Я не понимаю!"
1013402-81 = "[s9] «Может, сделаешь перерыв?»\n[s10] «Наверняка ты просто устала.»"
1013402-84 = "Н-Нет! Я в порядке!"
1013402-85 = "Я всё ещё работаю на 100%! Я пережила бесчисленные бессонные ночи за видеоиграми!"
1013402-86 = "Ах, кстати! Я ведь играла во множество игр с похожим управлением!"
1013402-87 = ""
1013402-89 = ""
1013402-90 = ""
1013402-91 = "Поэтому! Просто смотрите, как я—!"
1013402-92 = "А-А-А!!"
1013402-93 = ""
1013402-95 = ""
1013402-97 = "[ns11] «Ты в порядке?!»\n[ns12] Подбежать к Арис."
1013402-100 = ""
1013402-101 = "Сенсей..."
1013402-102 = "Я в порядке. Возможно, я немного повредила ногу, когда споткнулась."
1013402-103 = "...Ай."
1013402-104 = ""
1013402-106 = ""
1013402-107 = "Надо было послушать вас, Сенсей."
1013402-108 = "Контроль усталости — базовая механика любого симулятора тренировок!"
1013402-109 = "Если слишком перегружать персонажа, можно даже получить снижение характеристик!"
1013402-110 = "Даже такой ветеран, как я, иногда ошибается..."
1013402-111 = "..."
1013402-112 = ""
1013402-114 = "[ns] «...Пойдём обратно, Арис?»"
1013402-117 = "Сенсей...?"
1013402-118 = "Почему вы опустились на колени...?"
1013402-119 = "[s13] «Я понесу тебя на спине.»\n[s14] «На такой ноге тебе нельзя идти!»"
1013402-122 = "А? Н-Но я могу долететь обратно на своих доспехах..."
1013402-123 = "[s15] «Ну же! Всё нормально!»\n[s16] «Такая возможность бывает раз в жизни!»"
1013402-126 = "Что ж..."
1013402-127 = ""
1013402-129 = ""
1013402-130 = "Хи-хи-хи."
1013402-131 = "Хотела бы я, чтобы Сенсей носил меня так каждый день."
1013402-132 = "Когда она прижалась к моей спине, я почувствовал, насколько холодным стало тело Арис после нескольких часов тренировки на холодном ветру."
1013402-134 = "«Доспехи», которые несла Арис, оказались тяжелее, чем я думал."
1013402-135 = ""
1013402-141 = "...И для моей спины они тоже оказались тяжелее, чем я ожидал."
