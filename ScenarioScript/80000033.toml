[translation]
80000033-1 = "Что-то маленькое, но сладкое"
80000033-2 = "На День святого Валентина я договорился встретиться с Хасуми в офисе Рыцарей справедливости."
80000033-3 = ""
80000033-6 = "Открыто."
80000033-7 = "[s] «Вхожу.»"
80000033-8 = ""
80000033-12 = "Клубная комната JTF"
80000033-13 = "О, Сенсей. Вы быстро добрались."
80000033-14 = "[s] «Ты же сказала, что срочно.»"
80000033-15 = "Да... Когда я писала, это и правда казалось срочным."
80000033-16 = "[s] «Я решил, что раз это от тебя, значит дело важное.»"
80000033-17 = "Я торопилась, когда отправляла сообщение, так что, возможно, немного преувеличила."
80000033-18 = "И всё же, если посмотреть с определённой стороны, это не менее важно.#nНаверное."
80000033-19 = "[s] «...?»"
80000033-20 = "Причина, по которой я вас позвала, это, ну..."
80000033-21 = "Вот это."
80000033-22 = ""
80000033-24 = ""
80000033-25 = "[ns1] «Здесь столько шоколада, что и не сосчитать.»\n[ns2] «Вот ЭТО действительно гора шоколада.»"
80000033-26 = "Несколько студентов Тринити прислали его Рыцарям справедливости."
80000033-27 = "Несколько студентов Тринити прислали его Рыцарям справедливости."
80000033-28 = "[s] «Столько?»"
80000033-29 = "Да, хотите верьте, хотите нет..."
80000033-30 = "Иногда студенты присылают нам подарки в знак благодарности, это не редкость."
80000033-31 = "Но девушки из Тринити порой бывают немного... чрезмерными.#nИ это только то, что было адресовано мне."
80000033-32 = "[s] «Тебе прислали СТОЛЬКО?! Ничего себе!»"
80000033-33 = "Д-Думаете?"
80000033-34 = "Они ещё написали несколько писем с благодарностями."
80000033-35 = "Это было очень мило, хотя я всего лишь выполняла свой долг по защите справедливости. Никто из нашего клуба не занимается этим ради признания."
80000033-36 = "Но должна признать, получать такие небольшие знаки внимания довольно приятно."
80000033-37 = "[s] «Так что там было за срочное дело?»"
80000033-38 = "Вот именно. Я от всего сердца благодарна студентам за их признательность..."
80000033-39 = "...но, как видите, это немного подавляет — я о количестве шоколада."
80000033-40 = "Мне страшно представить, что станет со здоровьем, если съесть столько одной."
80000033-41 = "Т-Так что, если вы не против... моя срочная просьба — разделить этот шоколад со мной!"
80000033-42 = "[s] «Не думаю, что могу это принять.»"
80000033-43 = "Вы... не можете?"
80000033-44 = ""
80000033-46 = ""
80000033-47 = "Конечно. Простите. Вы заняты, а мне не следовало обременять вас такими глупыми неудобствами."
80000033-48 = "[s] «Я не это имел в виду.»"
80000033-49 = "Тогда что?"
80000033-50 = "[s3] «Эти шоколадки предназначались именно тебе.»\n[s4] «Будет неправильно есть подарки, которые предназначены тебе.»"
80000033-51 = "О. Понимаю."
80000033-52 = "О. Понимаю."
80000033-53 = "Это искренние подарки студентов мне. Я вообще не должна была принимать их, если не собиралась съесть."
80000033-54 = "Конечно. Вы снова преподали мне важный урок, Сенсей."
80000033-55 = "Вы правы! Я обязана принять и благодарность этих студентов, и все эти пустые калории!"
80000033-56 = "Пятый день моей диеты ничто перед вашими словами!"
80000033-57 = "[s] «Что? Я не говорил, что нужно съесть всё сегодня!»"
80000033-58 = "Благодаря вам все мои сомнения исчезли."
80000033-59 = "Н-Ну. Все, кроме одного..."
80000033-60 = "Вот. Я хочу, чтобы вы взяли это."
80000033-61 = ""
80000033-63 = ""
80000033-65 = "[ns] «Что это?»"
80000033-66 = "Этот шоколад — знак моей благодарности вам."
80000033-67 = "Ничего особенного — небольшая низкокалорийная сладость, которая мне нравится.#nНо она для меня особенная и предназначена только вам."
80000033-68 = "В-Вы примете?"
80000033-69 = "[s] «Разумеется»."
80000033-70 = "Хи-хи. Тогда давайте вместе насладимся шоколадом ко Дню святого Валентина?"
80000033-75 = "Мы с Хасуми пили чай и ели шоколад."
