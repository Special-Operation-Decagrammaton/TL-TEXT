[translation]
31030-1 = "Эпизод 3;Чаепитие"
31030-2 = "Мне было интересно, как вы выглядите, Сенсей. Вы не так уж сильно отличаетесь от нас."
31030-3 = "Кажется, вы мне нравитесь, Сенсей! А ты как думаешь, Нагиса?"
31030-4 = "Не думаю, что вежливо обсуждать подобное прямо перед Сенсеем, Мика."
31030-5 = "В привязанности нет ничего постыдного, но для неё есть подходящее время и место."
31030-6 = "О. Вот как это работает?"
31030-7 = "Простите, Сенсей. Похоже, я вела себя слишком неформально. Наверное, надо сказать что-то вроде... рада познакомиться!"
31030-8 = "[s] «Мне тоже приятно познакомиться»."
31030-9 = "..."
31030-10 = "Хи-хи."
31030-11 = "Если память мне не изменяет, вы первый человек не из Тринити, которого пригласили на Чаепитие."
31030-12 = "Обычно обычным студентам едва ли стоит надеяться получить сюда приглашение."
31030-13 = "Ой, Наги! Не делай из этого такое событие!"
31030-14 = "..."
31030-15 = "*вздох* Я вовсе не это имела в виду, Мика."
31030-16 = "Ладно, моя вина. Буду помалкивать."
31030-17 = "..."
31030-18 = "Мы пригласили вас сюда, потому что хотим попросить о небольшой услуге."
31030-19 = "[s] «И о какой?»"
31030-21 = "Подожди, Наги. Мы правда сразу перейдём к делу?!"
31030-22 = "Разве не надо сначала, ну, поговорить о чём-нибудь? Немного поболтать, чтобы разрядить обстановку?"
31030-23 = "Можно обсудить прекрасную погоду или что мы ели вчера. Мы правда всё это пропустим?"
31030-24 = "Разве смысл Чаепития не в общении?"
31030-25 = "..."
31030-26 = "Можешь сколько угодно сверлить меня этими красивыми глазами, но я не отступлю. Это вопрос правильного этикета Чаепития!"
31030-27 = "Когда ты будешь хозяйкой, Мика, сможешь придерживаться этих ценностей сколько угодно. Сейчас хозяйка я, и ты будешь следовать моему порядку."
31030-28 = "..."
31030-29 = "..."
31030-30 = "Простите нас. Некрасиво ссориться перед гостем."
31030-31 = "Давайте сменим тему, как предложила Мика."
31030-32 = "[s] «Вы ведь все выполняете обязанности президентов Студсовета Тринити, верно?»"
31030-33 = "Ого, Сенсей прекрасно чувствует атмосферу! Смотри внимательнее, Наги. Вот это взрослые навыки общения. Какая речь, какой плавный переход!"
31030-34 = "...Если это проигнорировать, то да, вы правы, Сенсей. Мы — президенты Студсовета Тринити."
31030-35 = "Вы, возможно, удивлены, почему президентов несколько. По традиции Студсовета Тринити сразу несколько президентов служат одновременно."
31030-36 = "Эй! Почему ты меня проигнорировала, Наги?"
31030-37 = "До объединения Тринити представители каждой академии-ветви устраивали чаепития, чтобы решать споры..."
31030-38 = "Ты серьёзно? Это так подло. Мои чувства..."
31030-39 = "Представители академий Pater, Filius и Sanctus собирались на чаепития, создавая атмосферу примирения, и с тех пор..."
31030-40 = "Ты просто откровенно меня игнорируешь, Наги. Мстишь мне? Какая же ты ужасная. Так ты обращаешься с подругой, которую знаешь больше десяти лет?"
31030-41 = "...Студсовет Тринити стал называться Чаепитием, а представители каждой фракции по очереди выступают хозяйками—"
31030-42 = "Да заткнёшься ты наконец?!"
31030-43 = "..."
31030-44 = "Я вообще-то говорю! Ты можешь хоть ненадолго закрыть рот?!"
31030-46 = "Мика!"
31030-47 = "И всё болтаешь, и болтаешь!"
31030-48 = "Если ты не закроешь свой маленький рот..."
31030-49 = "...я сама заткну его рулетом!"
31030-50 = ""
31030-51 = "..."
31030-52 = ""
31030-53 = ""
31030-54 = "..."
31030-55 = "[s] «...»"
31030-56 = "..."
31030-57 = "Простите. Не знаю, что на меня нашло."
31030-58 = "*выдох* Прошу прощения, Мика... Сенсей."
31030-59 = "Т-Так страшно..."
31030-60 = "[s] «(Надеюсь, мы когда-нибудь всё-таки перейдём к делу...)»"
31030-62 = ""
31030-63 = "Просьба у нас довольно простая, Сенсей."
31030-64 = "Да, простая, но важная."
31030-65 = "Очень важная."
31030-66 = "Не могли бы вы взять на себя руководство Клубом дополнительных занятий?"
31030-67 = "[s] «Клубом дополнительных занятий?»"
31030-68 = "Да. Проще говоря, мы хотим, чтобы вы вели специальный класс для спасения отстающих студентов."
31030-69 = "Тринити — учебное заведение с долгой историей интеллектуального и боевого превосходства."
31030-70 = "Но каким-то образом в этом гордом заведении нашлось целых четыре отстающих студенты."
31030-71 = "Ага. У нас сейчас и без того дел по горло."
31030-72 = "Из-за Эдемского договора всё довольно хаотично."
31030-73 = "Нужно срочно разобраться с этими отстающими, но у нас не хватает людей и времени..."
31030-74 = "И тут мы прочитали это! Статью обо всех невероятных делах Шале!"
31030-75 = "Искать кошек, убирать улицы, доставлять посылки — возможно, Шале лучшие исполнители поручений во всём Кивотосе!"
31030-76 = "Подумать только, всё это время прямо у нас под носом был человек, на которого можно свалить всю самую нудную работу! Вы наше спасение!"
31030-77 = "[s] «...»"
31030-78 = "Я бы не заходила так далеко, Мика..."
31030-79 = "Почему? Мы ведь именно это и делаем, разве нет?"
31030-80 = "К тому же вы учитель, Сенсей."
31030-81 = "Сейчас лекции проводят с Blu-ray-дисков. У нас всё ещё есть преподаватели, администрация, приглашённые лекторы и доценты,#nно обычный учитель — большая редкость."
31030-82 = "Учитель — это тот, кто использует собственные знания, чтобы направлять других, верно?#nИными словами, лидер."
31030-83 = "В этом смысле учитель — тот, кто вызывает уважение и помогает другим выбрать направление в жизни. Для Клуба дополнительных занятий подходит идеально."
31030-84 = "Да, но я слышала, что с Сенсеем я бы не стала советоваться о своём жизненном пути..."
31030-85 = "Ха-ха. Понимаю. Мы много историй о вас слышали. Не буду смущать вас, повторяя их."
31030-86 = "[s1] «(Что за отчёты они получают?!)»\n[s2] «(Даже знать не хочу...)»"
31030-87 = "В общем! Мы немного в тупике, так что будет замечательно, если вы возьмётесь за это!"
31030-88 = "В общем! Мы немного в тупике, так что будет замечательно, если вы возьмётесь за это!"
31030-89 = "Клуб дополнительных занятий — всего лишь временная мера, созданная, чтобы дать отстающим студентам необходимую помощь."
31030-90 = "Поскольку он создаётся в столь особых обстоятельствах, для его учреждения потребуется внесудебная власть Шале."
31030-91 = "Это необходимая мера, если она поможет отстающим студентам."
31030-92 = "Что скажете, Сенсей? Вы ведь не отвернётесь от студентов, которым нужна помощь..."
31030-93 = "[s] «Я не откажусь, если это поможет студентам, которым я нужен.»"
31030-94 = "Да, получилось! Спасибо, Сенсей!"
31030-95 = "..."
31030-96 = "Хорошо. Я и не ожидала, что вы обязательно откажете нам, но..."
31030-97 = "Неважно. Тогда, пожалуйста, взгляните на этот документ."
31030-98 = "[ns] Возьмите список."
31030-100 = "Вот эти студенты."
31030-102 = "Ага. Каждая, так сказать, заноза в боку Тринити."
31030-103 = "Можно было выразиться тактичнее, Мика. Скажем иначе: это студенты, которым нужна любовь Тринити."
31030-104 = "Ладно, как скажешь."
31030-105 = ""
31030-106 = ""
31030-107 = "[ns] «(Погодите-ка...!)»"
31030-108 = "Хм? Вы кого-то из них знаете, Сенсей?"
31030-109 = "[s3] «Ну, не совсем...»\n[s4] Ответить уклончиво."
31030-110 = "Мы отправим вам документы со всеми подробностями. Есть ещё вопросы?"
31030-111 = "Мы отправим вам документы со всеми подробностями. Есть ещё вопросы?"
31030-113 = "[s] «Что такое Эдемский договор?»"
31030-114 = "..."
31030-115 = "..."
31030-116 = "Хм... Непростой вопрос."
31030-117 = "История довольно длинная, так что выделим на неё время позже. Информация всё-таки засекречена."
31030-118 = "В любом случае к вашей работе с Клубом дополнительных занятий это отношения не имеет."
31030-119 = "[s] «Разве в Чаепитии не должно быть трёх президентов Студсовета?»"
31030-120 = "..."
31030-121 = "Ну, да, но..."
31030-122 = "Сэя сейчас не в Тринити. Она заболела."
31030-123 = "Верно. Хозяйкой этого Чаепития должна была быть Сэя, но... поскольку её нет, я заменяю её."
31030-124 = "Мы по очереди выступаем хозяйками Чаепития. Впрочем, это тоже вас не касается."
31030-125 = "[s] «Пожалуй, это всё...»"
31030-126 = "Прекрасно."
31030-127 = "Как только подготовка завершится, вы официально сможете работать на Тринити."
31030-128 = "Ещё раз благодарим за помощь. Для нас это будет большой поддержкой."
31030-129 = "Пока, Сенсей! Надеюсь, ещё увидимся."
31030-130 = "Вообще-то все хозяйки Чаепития редко собираются в одном месте."
31030-131 = "Ой, не делай вид, будто мы вечно заняты. И всё же встреча с Сенсеем — первый раз за долгое время, когда я увидела твоё лицо. Приятно."
31030-132 = "Я тоже рада, Мика."
31030-133 = "Хи-хи."
31030-134 = "Мы рассчитываем на вас, Сенсей. Отныне как хозяйка Чаепития я буду вас сопровождать."
31030-135 = "[s] «Буду рассчитывать на вас.»"
31030-141 = "(Я решил навестить студента, чьё имя узнал в списке Клуба дополнительных занятий.)"
31030-142 = ""
31030-144 = ""
31030-145 = "[ns] «Так это и правда ты!»"
31030-146 = "А-Аха-ха... Здравствуйте, Сенсей."
31030-147 = "Я могу всё объяснить."
31030-148 = "Ну..."
31030-150 = "Следующий эпизод;Отстающие студенты, часть 1"
