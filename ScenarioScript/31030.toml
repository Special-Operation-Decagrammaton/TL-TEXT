[translation]
31030-1 = "Episódio 3;Tea Party"
31030-2 = "Uau~, então esse é o famoso Sensei? Não parece ser tão diferente assim da gente, né?"
31030-3 = "Entendi~, huum... É, eu achei bem legal!! O que você acha, Nagi-chan?"
31030-4 = "...Mika-san, esse tipo de comentário em um primeiro encontro é uma falta de educação."
31030-5 = "Transbordar amor é algo admirável, mas precisamos saber escolher a hora e o lugar."
31030-6 = "Uuh, bom, nisso você tem razão..."
31030-7 = "Foi mal, Sensei, tá? Mas enfim, prazer em conhecer e conto com você daqui pra frente!"
31030-8 = "[s] \"O prazer é meu. Conto com vocês.\""
31030-9 = "..."
31030-10 = "...Fufu."
31030-11 = "...Que eu me lembre, o Sensei é a primeira pessoa de fora da Trinity a ser convidada para este salão da Tea Party."
31030-12 = "Normalmente, até mesmo para as alunas comuns da Trinity, este é um lugar para o qual não se recebe um convite facilmente..."
31030-13 = "Ah~, qual é, Nagi-chan, isso soou meio esnobe! Parece até que está jogando um favor na cara!"
31030-14 = "..."
31030-15 = "...Perdoe-me, Sensei. Não foi essa a minha intenção, mas... deixando isso de lado, Mika-san?"
31030-16 = "Ah~... desculpa, vou ficar quietinha. Na medida do possível."
31030-17 = "...Pois bem, retomando."
31030-18 = "O motivo pelo qual convidamos o Sensei aqui hoje é porque temos um pequeno favor a lhe pedir."
31030-19 = "[s] \"Um favor?\""
31030-21 = "Opa, já vai direto ao ponto assim, Nagi-chan!?"
31030-22 = "Não precisa de um quebra-gelo antes, não? Uma conversinha fiada e elegante pra descontrair?"
31030-23 = "Tipo \"Que tempo agradável hoje, não?\" ou \"O que você jantou ontem?\". Não vai puxar nenhum papo desses?"
31030-24 = "Olha, a Tea Party é basicamente um círculo da alta sociedade, não é?"
31030-25 = "..."
31030-26 = "Não adianta me fuzilar com esses olhos lindos, isso é uma questão de princípios sobre o que é a Tea Party, então nada feito~! Temos que fazer direito!"
31030-27 = "Mika-san, por favor, busque esse tipo de abordagem quando for a sua vez de ser a anfitriã. Como no momento a anfitriã sou eu, peço que siga os meus métodos."
31030-28 = "..."
31030-29 = "..."
31030-30 = "Bem, é verdade que prolongar uma discussão dessas na frente de um convidado tampouco é uma postura desejável."
31030-31 = "...De fato. Como a Mika-san sugeriu, vamos mudar um pouco o rumo da conversa."
31030-32 = "[s] \"Vocês são as presidentes do conselho estudantil da Trinity, certo?\""
31030-33 = "Uau, o próprio Sensei leu o clima pra gente! Viu só, Nagi-chan!? Essa é a lábia de um adulto! Uma condução super natural da conversa!"
31030-34 = "...Sim. Como disse, nós somos as presidentes do conselho estudantil da Escola Geral Trinity."
31030-35 = "O termo \"presidentes\" no plural pode soar pouco familiar... Explicando desde o princípio, a presidência do conselho estudantil da Trinity é, geração após geração, exercida por múltiplas pessoas."
31030-36 = "Ué, Nagi-chan, tá me ignorando? Será que fui ignorada~? Oooi?"
31030-37 = "Antigamente... antes de a \"Escola Geral Trinity\" nascer, as representantes de cada facção organizaram uma \"Tea Party\" para solucionar seus conflitos, e foi daí que essa história começou."
31030-38 = "Nossa, que maldade... Snif, fiquei até um pouquinho magoada..."
31030-39 = "Pater, Filius e Sanctus... Tendo à frente as representantes dessas três academias, realizou-se uma festa do chá, o que deu origem ao movimento de reconciliação."
31030-40 = "A Nagi-chan me ignorou de verdade... Isso é bullying... Não é maldade demais? A gente é amiga de infância há dez anos, sabia? Tudo bem que até hoje isso... já aconteceu várias vezes, mas..."
31030-41 = "...Desde então, o conselho estudantil da Trinity passou a ser chamado pelo nome de \"Tea Party\", e as representantes de cada facção assumem em rodízio o papel de \"anfitriã\"—"
31030-42 = "Ah, mas que barulheira insuportável!?"
31030-43 = "Iih..."
31030-44 = "Eu estou no meio de uma explicação agora, sabia!?"
31030-46 = "E mesmo assim, você não para um segundo!"
31030-47 = "Fica aí do lado resmungando e murmurando sem parar...!"
31030-48 = "Se você realmente não consegue ficar calada, nessa sua boquinha..."
31030-49 = "Eu vou enfiar um rocambole inteiro goela abaixo!?"
31030-51 = "..."
31030-54 = "..."
31030-55 = "[s] \"...\""
31030-56 = "...Oh, céus."
31030-57 = "...Onde já se viu eu usar esse tipo de linguajar..."
31030-58 = "...Peço perdão pela indelicadeza, Sensei... e a você também, Mika-san."
31030-59 = "Nossa~, que medo, que medo..."
31030-60 = "[s] (Não chegamos nunca ao assunto principal...)"
31030-63 = "...Vamos entrar logo no assunto principal. O que gostaríamos de pedir ao Sensei é algo simples."
31030-64 = "É simples, mas muito importante, viu?"
31030-65 = "Sim, exatamente."
31030-66 = "...Poderia se tornar o conselheiro do Clube de Aulas de Reforço?"
31030-67 = "[s] \"Clube de Aulas de Reforço?\""
31030-68 = "Sim. Em outras palavras, gostaríamos que salvasse alunas que estão correndo o risco de serem reprovadas. Embora tenha o formato de um \"clube\", neste caso talvez seja mais adequado chamá-lo de \"professor responsável\" do que de conselheiro."
31030-69 = "A Escola Geral Trinity é uma academia onde a história e a tradição permanecem vivas, prezando desde os tempos antigos pela excelência tanto nos estudos quanto nas artes marciais em Kivotos."
31030-70 = "E, no entanto, por incrível que pareça, logo neste momento, temos nada menos que 4 alunas com notas deploráveis..."
31030-71 = "Pra nós, isso veio num momento meio complicado, sabe..."
31030-72 = "Estamos numa correria só por causa da questão do \"Tratado do Éden\"."
31030-73 = "Precisamos dar um jeito na situação dessas garotas também, mas falta pessoal e falta tempo..."
31030-74 = "Foi bem nessa hora que eu encontrei! As matérias no jornal falando sobre as façanhas da \"Schale\"!"
31030-75 = "Desde procurar gatos perdidos e limpar a cidade até entregar encomendas, um trabalho incrível em todas as frentes!"
31030-76 = "Aí pensei: para essa tal de \"Schale\", com certeza dá pra empurrar esse abacaxi!"
31030-77 = "[s] \"...\""
31030-78 = "...Não deve chamar isso de \"abacaxi\", Mika-san."
31030-79 = "B-Bom, mas de certo modo é a pura verdade..."
31030-80 = "E além do mais, você é um \"Sensei\", não é?"
31030-81 = "Hoje em dia todo mundo estuda por BDs. Funcionários da escola ou palestrantes até existem, mas o conceito de um \"Sensei\" é algo bem raro."
31030-82 = "A palavra \"Sensei\" significa aquele que trilhou o caminho antes... ou seja, alguém cujo papel é \"guiar\", certo?"
31030-83 = "Alguém digno de respeito, ou um guia de vida que estende a mão a todas e mostra o caminho... Achei que isso caía como uma luva para o conselheiro do \"Clube de Aulas de Reforço\"!"
31030-84 = "Embora, segundo os boatos, as opiniões estejam bastante divididas sobre se a palavra \"respeito\" realmente se aplica..."
31030-85 = "Ah~, é mesmo, né? Dependendo do relatório, a impressão muda da água pro vinho... Bom, pela honra do Sensei, é melhor eu nem comentar nada."
31030-86 = "[s1] (Mas que tipo de boatos são esses...?)\n[s2] (...Melhor fingir que não ouvi!)"
31030-87 = "Enfim! Como estamos um pouco ocupadas agora, queremos muito que o Sensei assuma a responsabilidade por essas garotas!"
31030-88 = "Enfim! Como estamos um pouco ocupadas agora, queremos muito que o Sensei assuma a responsabilidade por essas garotas!"
31030-89 = "Explicando um pouco mais a fundo... este \"Clube de Aulas de Reforço\" não é um clube permanente, mas sim algo criado em resposta a circunstâncias especiais, no qual ingressam alunas que precisam de auxílio."
31030-90 = "É um formato um tanto atípico, mas como há certa urgência, estamos tomando emprestada a autoridade extralegal da Schale... e estruturando dessa maneira."
31030-91 = "Há várias complicações burocráticas, mas a essência é unicamente \"resgatar as alunas com baixo desempenho acadêmico\". É justamente por isso que a criação do clube nesse formato especial foi permitida..."
31030-92 = "O que me diz, Sensei? Poderia estender a mão às alunas que precisam de ajuda?"
31030-93 = "[s] \"Se estiver ao meu alcance, será um prazer.\""
31030-94 = "Eba! Brigadão~, Sensei!"
31030-95 = "..."
31030-96 = "Fufu, eu já imaginava que você certamente não recusaria..."
31030-97 = "Muito obrigada. Sendo assim, por favor, pegue isto."
31030-98 = "[ns] Receber a lista de nomes das alunas."
31030-100 = "Essas são as alunas em questão."
31030-102 = "Ou seja, as encren—"
31030-103 = "Essa expressão carece de amor, Mika-san. Vamos colocar desta forma: são as \"alunas que precisam de amor\" na Trinity."
31030-104 = "Bom, por mim pode chamar do que quiser~."
31030-107 = "[ns] (Ué, essa garota é...)"
31030-108 = "Hm? Viu alguém que chamou a sua atenção aí, Sensei?"
31030-109 = "[s3] \"...Não, não é nada.\"\n[s4] Assobiar."
31030-110 = "Entraremos em contato posteriormente com os detalhes. Há mais algum ponto que lhe cause dúvida?"
31030-111 = "Entraremos em contato posteriormente com os detalhes. Há mais algum ponto que lhe cause dúvida?"
31030-113 = "[s] \"O que é... o Tratado do Éden?\""
31030-114 = "..."
31030-115 = "..."
31030-116 = "Huum... Como é que eu posso explicar isso?"
31030-117 = "Explicar esse assunto levaria bastante tempo, então conversaremos sobre isso em outra ocasião. Até porque, de certa forma, trata-se de uma informação confidencial interna..."
31030-118 = "Além disso, não é algo que tenha muita relação com o caso do Clube de Aulas de Reforço..."
31030-119 = "[s] \"E onde está a outra presidente do conselho estudantil da Tea Party?\""
31030-120 = "..."
31030-121 = "Sobre isso..."
31030-122 = "A Seia-chan não está na Trinity agora. Ela está internada no hospital..."
31030-123 = "Originalmente, a anfitriã atual deveria ser a Seia-san, mas... como ela está ausente devido a essas circunstâncias, estou exercendo a função de anfitriã no momento."
31030-124 = "Até porque o papel de anfitriã da Tea Party sempre funcionou em sistema de rodízio."
31030-125 = "[s] \"Entendi, tomara que ela melhore logo. ...Acho que era só isso que eu queria perguntar por enquanto.\""
31030-126 = "Compreendo. Se surgir qualquer outra dúvida, fique à vontade para perguntar."
31030-127 = "Sendo assim, logo que os preparativos estiverem concluídos, gostaríamos que o Sensei viesse à Escola Geral Trinity na condição de enviado especial."
31030-128 = "Agradeço imensamente pela sua cooperação, Sensei. Com isso, posso ficar mais tranquila."
31030-129 = "Bom, até mais, Sensei! Não sei se vamos conseguir nos ver de novo tão cedo, mas tchauzinho!"
31030-130 = "É verdade. Especialmente agora que estamos em um período tão atarefado, não há garantias de que as presidentes da Tea Party possam se reunir assim novamente tão cedo."
31030-131 = "Fufu, a coisa tá corrida mesmo, né? Bom, mas graças ao Sensei deu pra ver o rostinho da Nagi-chan, então já valeu a pena."
31030-132 = "Sim, digo o mesmo. Mika-san."
31030-133 = "Fufu."
31030-134 = "Pois bem, contamos com você daqui em diante, Sensei. Como anfitriã da Tea Party, também farei questão de escoltá-lo."
31030-135 = "[s] \"Sim, conto com vocês.\""
31030-141 = "(Primeiro, vou encontrar a aluna da lista do Clube de Aulas de Reforço cujo nome me parecia familiar...)"
31030-145 = "[ns] \"Eu sabia...!\""
31030-146 = "A-Ahaha... Olá, Sensei."
31030-147 = "É-É que, veja bem, houve circunstâncias inevitáveis para isso..."
31030-148 = "Auu..."
31030-150 = "Próximo;As Alunas do Clube de Aulas de Reforço (1)"
