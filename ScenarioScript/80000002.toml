[translation]
80000002-1 = "Ошибочный заказ"
80000002-2 = "Здание Шале, Ангел 24"
80000002-4 = ""
80000002-5 = "Д-Добро пожаловать, Сенсей!"
80000002-6 = ""
80000002-8 = "..."
80000002-9 = "Эм, Сенсей. Не хотите немного нашего шоколада?"
80000002-10 = "В Ангел 24 сейчас акция «купи один — второй бесплатно»!"
80000002-11 = "Отличная возможность признаться в чувствах сразу двум людям!"
80000002-12 = "[s] «Звучит не очень-то хорошей идеей...»"
80000002-13 = "Н-Наверное, вы правы..."
80000002-14 = "Угх. Что же мне делать со всем этим?"
80000002-15 = "[s] «Что случилось?»"
80000002-16 = "Дело в том, что я заказала слишком много шоколада ко Дню святого Валентина."
80000002-17 = "Вместо 20 коробок я написала 20 ЯЩИКОВ..."
80000002-18 = "Я придумала провести акцию «два по цене одного», но покупателей так мало, что я, наверное, никогда не продам двадцать ящиков шоколада."
80000002-19 = "Когда главный офис узнает, у меня будут большие проблемы."
80000002-20 = "Возможно, мне придётся оплатить всё из своей зарплаты.#nОна такого не выдержит!"
80000002-21 = "[s] «Тогда пойдём и продадим шоколад сами!»"
80000002-22 = "А? Вы имеете в виду — вне магазина?"
80000002-23 = "Наверное, это и правда эффективнее, чем продавать только тем, кто приходит в здание Шале..."
80000002-24 = "Но как мы умудримся продать двадцать ящиков всего за один день?#nЭто больше двухсот плиток шоколада..."
80000002-25 = "[s1] «Не волнуйся. Мы справимся.»\n[s2] «Я помогу тебе это продать.»"
80000002-26 = "(Угх. Последнее, чего я хотела, — оказаться в долгу у Сенсея после всех подозрительных слухов вокруг Шале...)"
80000002-27 = "(Угх. Последнее, чего я хотела, — оказаться в долгу у Сенсея после всех подозрительных слухов вокруг Шале...)"
80000002-28 = "(...но выбора у меня нет. И Сенсей никогда не казался плохим человеком.)"
80000002-29 = "Хорошо. Если вы не против, тогда... спасибо, Сенсей."
80000002-31 = "Мы с Сорой вышли из Ангел 24 продавать шоколад."
80000002-32 = ""
80000002-38 = "Мы изо всех сил зазывали проходящих мимо студентов и очень быстро продали весь шоколад до последней плитки."
80000002-40 = "Не могу поверить! Мы распродали всё почти мгновенно!"
80000002-41 = "Кажется, среди покупателей даже были известные студенты из Тринити и Геенны."
80000002-42 = "Неудивительно, что про Сенсея ходит столько слухов..."
80000002-43 = "[s] «А? Что ты сказала в конце?»"
80000002-44 = "Н-Ничего!"
80000002-45 = ""
80000002-47 = ""
80000002-48 = "Пусть Сенсей и слегка подозрительный, ему всё равно можно доверять."
80000002-49 = ""
80000002-51 = ""
80000002-52 = "Эм, Сенсей. Вообще-то осталась ещё одна шоколадка."
80000002-53 = "Если вы не против, возьмёте её?"
80000002-54 = ""
80000002-56 = ""
80000002-58 = "И не потому, что я забыла её продать!"
80000002-59 = "Это... от меня. Вам."
80000002-60 = "С Днём святого Валентина, Сенсей!"
