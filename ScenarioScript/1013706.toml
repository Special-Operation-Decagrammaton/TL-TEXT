[translation]
1013706-1 = "Напарник детектива"
1013706-2 = "Я сел на автобус и отправился в деревню за городом, где Коно́ка попросила встретиться."
1013706-4 = "Сюда, сенсей!"
1013706-5 = "Спасибо, что пришли. После того, что показал гороскоп, я не могла рисковать и идти одна."
1013706-6 = "Сегодня базовая тренировка, так что никого из Валькирии взять не получилось."
1013706-7 = "[s] «Что за работа?»"
1013706-8 = "Хороший вопрос! Будем опрашивать местных."
1013706-9 = "Кто-то устроил небольшие проблемы в D.U. и сбежал. Последний раз её видели садящейся на автобус в эту сторону."
1013706-10 = "Подозреваемая наверняка будет выделяться, так что несколько дружелюбных местных точно укажут правильное направление."
1013706-11 = "Прогноз обещал дождь, так что давайте красиво завершим всё до того, как польёт!"
1013706-12 = "Тогда пошли!"
1013706-14 = ""
1013706-15 = ""
1013706-16 = ""
1013706-17 = ""
1013706-18 = ""
1013706-19 = ""
1013706-20 = ""
1013706-21 = ""
1013706-22 = ""
1013706-23 = ""
1013706-25 = "Бла-а-а. Отстой."
1013706-26 = "Не нашли ни одного свидетеля! Может, у неё выросли крылья и она улетела за горизонт? Или зарылась глубоко под землю?"
1013706-27 = "Уже слишком поздно опрашивать ещё кого-то..."
1013706-28 = "Может, она ушла в горы...? Я ЕЁ вынюхаю, даже если придётся вырвать здесь каждое дерево по одному!"
1013706-29 = "[s] «Подумай об экологии! О животных!»"
1013706-30 = "Да ну! Потом посажу обратно, когда найду её! Я всё-таки законопослушный офицер."
1013706-31 = "Пока след окончательно не остыл, нам нужно—"
1013706-32 = ""
1013706-35 = ""
1013706-36 = "А?!"
1013706-37 = "КЬЯ-А-А!! Холодный ливень!"
1013706-38 = "Давайте спрячемся вон там!!! А-а-а, не верится!!"
1013706-41 = "Мы с Коно́кой поспешили вместе укрыться от дождя."
1013706-42 = "Коно́ка, до этого угрюмо сидевшая в углу из-за того, как прошёл день, внезапно поднялась и сняла куртку."
1013706-45 = "― [log=코노카]А-а, я вся промокла.[/log][wa:2967]"
1013706-47 = "― [log=코노카]Ух... Холодно.[/log][wa:250]"
1013706-50 = "― [log=코노카]Льёт как из ведра.[/log][wa:1268]"
1013706-52 = "― [log=코노카]Говорят, до поздней ночи не прекратится. *вздох*[/log][wa:581]"
1013706-55 = "― [log=코노카]Ну, наверное, неплохо немного остановиться и перевести дух.[/log][wa:1047]"
1013706-58 = "[ns] «Ты в порядке? Не расстроилась?»"
1013706-59 = "― [log=코노카]Хм? А, ну...[/log][wa:2110]"
1013706-61 = "― [log=코노카]Совру, если скажу, что не расстроилась.[/log][wa:402]"
1013706-64 = "― [log=코노카]Потратила время впустую, вся промокла...[/log][wa:1193]"
1013706-67 = "― [log=코노카]Но всё равно сегодняшний день прошёл ровно как предсказал гороскоп.[/log][wa:10]"
1013706-69 = "― [log=코노카]В итоге получился хороший день с напарником рядом.[/log][wa:521]"
1013706-72 = "― [log=코노카]...И всё благодаря вам.[/log][wa:442]"
1013706-75 = "― [log=코노카]Так что, если уж говорить...[/log][wa:1444]"
1013706-77 = "― [log=코노카]Я счастлива.[/log]"
1013706-80 = "― [log=코노카]...А, нет, постойте! Я имела в виду![/log][wa:623]"
1013706-82 = "― [log=코노카]Нам очень повезло так быстро найти укрытие от дождя! Вот почему я счастлива![/log][wa:266]"
1013706-85 = "― [log=코노카]В-Вот примерно... это я хотела сказать...[/log][wa:622]"
1013706-88 = "..."
1013706-89 = "Главное, что сегодня мне не выпало ничего плохого!"
1013706-90 = "Только это я и имела в виду..."
1013706-91 = ""
1013706-94 = ""
1013706-95 = "Ого?! Не знала, что здесь уже кто-то есть."
1013706-96 = "Моя вина! Не хочу мешать вашему личному моменту или типа того, но дайте я тоже втиснусь и не промокну."
1013706-97 = "...?"
1013706-98 = "За тобой тоже гонятся? Ха! Похоже, мы в одной лодке."
1013706-99 = "Вы тут поблизости не видели копов из Валькирии?"
1013706-100 = ""
1013706-102 = ""
1013706-103 = "Это что, реально...?"
1013706-104 = ""
1013706-105 = "[ns] «Вообще-то видел...»"
1013706-106 = ""
1013706-107 = "Эм..."
1013706-108 = "А, мне внезапно захотелось потанцевать под дождём!! Облака зовут меня!!"
1013706-109 = ""
1013706-111 = ""
1013706-112 = "Стоять!!"
1013706-113 = ""
1013706-115 = ""
1013706-116 = "ДА ЛАДНО!! Да не может быть, что ты коп!! Разве для работы под прикрытием нет каких-то правил?!"
1013706-117 = "За это тебе ещё и срок утяжелят!!"
1013706-118 = "Что?! Но ПОЧЕМУ?!"
1013706-119 = "За то, что испортила хороший момент!!"
1013706-121 = "Коно́ка рванула под дождь и быстро арестовала подозреваемую."
1013706-122 = "Всю дорогу обратно она молча смотрела в окно."
