[translation]
2003803-1 = "Главный секретарь из холодной страны"
2003803-2 = ""
2003803-3 = "Фух..."
2003803-4 = "[s] «Тебе правда так жарко?»"
2003803-5 = "Да. В Шаньхайцзине температура гораздо выше, чем в Красной Зиме."
2003803-6 = "Поэтому я и переоделась, но, как бы это сказать...?"
2003803-7 = "Даже ощущение того, как тело впитывает тепло, здесь другое."
2003803-8 = "Поэтому я и пришла сюда в поисках чего-нибудь холодного попить. Однако..."
2003803-9 = "[s] «...Кажется, я уже знаю продолжение.»"
2003803-10 = "Да. Похоже, ни один продавец в Шаньхайцзине не продаёт холодные напитки."
2003803-11 = "Я понимаю, что холодные напитки вредны для пищеварения..."
2003803-12 = "Даже у меня бывало расстройство желудка, когда я выпивала слишком много холодной воды. Сама идея не лишена смысла."
2003803-13 = "Но пить тёплый чай в такой жаркий день тоже как-то неправильно, разве нет?"
2003803-14 = "А некоторые академии заходят настолько далеко, что даже подогревают напитки, которые принято подавать холодными..."
2003803-15 = "[s] «Не знаю, поможет ли, но пока как тебе такое...?»"
2003803-16 = ""
2003803-18 = ""
2003803-21 = ""
2003803-22 = "Ох, это...?"
2003803-23 = "Веер Гэнрюмона? Хи-хи. На самом деле он довольно красивый. И милый."
2003803-24 = "По своей природе веера в Красной Зиме почти не нужны и не используются..."
2003803-25 = "Но мне любопытно. Посмотрим..."
2003803-29 = "― [log=토모에 치파오]Прохладный ветерок... Достаточная тень...[/log][wa:3420]"
2003803-30 = "― [log=토모에 치파오]И хороший веер для циркуляции воздуха...[/log][wa:2090]"
2003803-33 = "― [log=토모에 치파오]Хи-хи. Для меня это новый опыт.[/log][wa:2540]"
2003803-36 = "― [log=토모에 치파오]Такие впечатления[/log][wa:1180]"
2003803-37 = "― [log=토모에 치파오]дополняют и расширяют кругозор.[/log][wa:2790]"
2003803-40 = "[ns] «Широкий кругозор Томоэ... Хотелось бы увидеть.»"
2003803-42 = "― [log=토모에 치파오]Ох. Возможно, это не так интересно, как вы думаете.[/log][wa:2940]"
2003803-45 = "― [log=토모에 치파오]Хи-хи, Сенсей. Не стойте там и не смотрите...[/log][wa:2250]"
2003803-46 = "― [log=토모에 치파오]Подойдите сюда.[/log][wa:2340]"
2003803-49 = "― [log=토모에 치파오]А теперь позвольте мне обмахивать вас.[/log][wa:3790]"
2003803-53 = ""
2003803-54 = "Эй, посмотри на те перила."
2003803-55 = "Что там? Ого..."
2003803-56 = "Правда? Разве не прямо атмосфера?"
2003803-57 = "Не могу не смотреть... Грациозная, красивая, элегантная."
2003803-58 = "Самый обычный повседневный веер."
2003803-59 = "Но почему-то в её руках он выглядит невероятно роскошно."
2003803-60 = ""
2003803-61 = "...!"
2003803-62 = "[s1] «Что такое, Томоэ? Тебе всё ещё жарко?»\n[s2] «Лицо стало ещё краснее...»"
2003803-65 = "Н-Нет. Не потому что я... Ну, если смотреть в целом, здесь действительно жарко."
2003803-66 = "Но вообще-то мне просто очень неловко. Может, уйдём?"
2003803-67 = "[s] «Тогда у меня отличная идея!»"
2003803-68 = "Что? Хотите пойти поесть баобин? Что это?"
2003803-69 = "А... вид строганого льда? Отлично! Звучит именно как то, что нам нужно."
2003803-70 = "Может, по дороге я продолжу обмахивать вас? Как вам?"
2003803-72 = "Мы с Томоэ отправились на поиски чего-нибудь холодного."
2003803-73 = "По дороге мы играли в «Камень, ножницы, бумага», решая, кто будет обмахивать, а кого будут обмахивать."
