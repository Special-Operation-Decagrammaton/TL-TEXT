[translation]
83300500200-5 = "Спасибо за вашу работу сегодня, глава префектов."
83300500200-6 = "Я сверила сведения, которые мы собрали из разных источников. Как и ожидалось, Общество Пандемониума действительно устраивает вечеринку."
83300500200-7 = "Но в этом году она, судя по всему, совсем другого масштаба, чем раньше. Подготовка очень сильно отличается от их обычного подхода."
83300500200-8 = "Да. Хотя мы никогда не переставали за ними следить, я немного обеспокоена."
83300500200-9 = ""
83300500200-11 = ""
83300500200-12 = "Как бы то ни было, уже поздно. Хорошо отдохните, глава префектов."
83300500200-13 = "Да. Спокойной ночи, Ако."
