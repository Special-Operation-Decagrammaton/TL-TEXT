[translation]
102-1 = "Поручение: поиск предметов"
102-2 = "Ситуационная комната Генерального студенческого совета"
102-3 = "Разрушенный комплекс — студенты называют его Slumpia — когда-то был тематическим парком Utopia, построенным Momo Group."
102-4 = "Из-за плохого управления он закрылся меньше чем через полгода. Кто бы мог подумать. *хрум*"
102-5 = "Но в последнее время про это место ходят странные слухи."
102-6 = "Будто ночью машины двигаются сами по себе, хотя электричества нет, студенты там пропадают... ну и всё такое."
102-7 = "Мне плевать на какие-то ржавые машины, но пропавшие студенты — уже большая проблема."
102-8 = "Было бы здорово, если бы ты выяснил, что там происходит."
102-9 = "Все найденные зацепки сразу приноси в Генеральный студенческий совет."
