[translation]
1009306-1 = "Кирара на улице"
1009306-2 = "Получив восторженное сообщение от Кирары, я отправился встретиться с ней."
1009306-3 = ""
1009306-7 = ""
1009306-8 = ""
1009306-9 = "Учитель! Учитель! Я здесь!"
1009306-10 = "Ого-о-о, какой вы пунктуальный, Учитель! Пришли на двадцать минут раньше!"
1009306-11 = "[s1] «Ты давно ждёшь?»\n[s2] «Ты сама пришла ещё раньше!»"
1009306-14 = "Ха-ха! Я так ждала нашей прогулки, что случайно пришла чуточку раньше!"
1009306-15 = "Я наконец закончила пересдачу, так что теперь свободна! Давайте делать что-нибудь весёлое!"
1009306-16 = "Где вы любите закупаться, Учитель?"
1009306-17 = "...А? Вы были слишком заняты работой, чтобы изучить район?"
1009306-18 = "Так это же идеально!"
1009306-19 = "Я покажу вам все свои любимые места. Может, вы даже найдёте магазин, который понравится вам, Учитель!"
1009306-20 = "Ну же! Быстрее, быстрее!"
1009306-22 = ""
1009306-23 = "Два огромных крепа, один с клубникой и один с бананом, пожалуйста!"
1009306-24 = "Два крепа, сейчас будут!"
1009306-25 = ""
1009306-27 = ""
1009306-28 = ""
1009306-29 = "Это место просто бомба! Вы влюбитесь с первого укуса!"
1009306-30 = "Здесь вообще не жалеют клубники, бананов, черники и взбитых сливок! Другого места с таким количеством и качеством не найдёте!"
1009306-31 = "Ваши огромные крепы!"
1009306-32 = ""
1009306-34 = ""
1009306-35 = ""
1009306-37 = "Ура! Этот ваш, Учитель!"
1009306-38 = "[ns] «Не откажусь...»"
1009306-41 = "Нравится? Ну как?"
1009306-42 = "[s] «М-м. Вкусно!»"
1009306-43 = "Правда?! Я знала, что вам понравится, Учитель!"
1009306-44 = "Вот, попробуйте мой!"
1009306-45 = "Вдвое больше впечатлений, вдвое больше вкуса! Или как-то так!"
1009306-46 = "Ладно! Скажите: «А-а-а!»"
1009306-47 = "А? Ну же, что такое? Я знаю, выглядит немного смешно, но это только потому, что я уже откусила несколько раз! Обещаю, он всё ещё супервкусный."
1009306-48 = "[ns] Откусить от крепа Кирары."
1009306-49 = ""
1009306-52 = "Супервкусно, да? Не просто же так это моё любимое место с крепами!"
1009306-53 = ""
1009306-55 = ""
1009306-56 = "Ха-ха-ха! Учитель, у вас всё лицо в сливках! Вы их на потом оставили, что ли?"
1009306-57 = "Ладно, идите сюда!"
1009306-58 = "[s] «А. Не надо вытирать—»"
1009306-59 = "Нет! Так не пойдёт! Если уж гуляете со мной, надо выглядеть опрятно!"
1009306-60 = "Так... А, салфеток мы не взяли."
1009306-61 = "Пока моя рука сойдёт..."
1009306-62 = ""
1009306-64 = ""
1009306-65 = "(лижет)"
1009306-66 = "[ns] «?!?!»"
1009306-67 = ""
1009306-68 = "Ладно, следующее место!"
1009306-70 = ""
1009306-71 = ""
1009306-72 = ""
1009306-73 = "Учитель! Смотрите! Какая милота!"
1009306-74 = "А? Эта футболка по акции «купи одну — получи вторую»?"
1009306-76 = "Как думаете, Учитель? Будем одинаковыми? Хи-хи."
1009306-78 = ""
1009306-80 = ""
1009306-81 = ""
1009306-82 = ""
1009306-85 = ""
1009306-87 = ""
1009306-88 = ""
1009306-89 = ""
1009306-90 = ""
1009306-92 = ""
1009306-93 = ""
1009306-95 = ""
1009306-96 = ""
1009306-98 = ""
1009306-99 = ""
1009306-104 = ""
1009306-105 = "О боже, уже так поздно!"
1009306-106 = "Вы не устали, Учитель?"
1009306-107 = "[s] «Я достиг предела уже давным-давно...»"
1009306-108 = "А! Надо было сказать!"
1009306-109 = "Простите... Я совсем увлеклась..."
1009306-110 = "А? Но вам всё равно было весело? Даже несмотря на усталость?"
1009306-111 = "Ха-ха-ха! А-а, ладно! Спасибо. Мне стало легче."
1009306-112 = "Хм... Но не хочется заканчивать день вот так..."
1009306-113 = "Давайте перед тем как расходиться зайдём в парк, Учитель!"
1009306-115 = ""
1009306-116 = "Фух! У меня тоже ноги устали!"
1009306-117 = "Даже не помню, когда последний раз ходила столько, что ноги заболели!"
1009306-118 = "[s] «Ты ведь постоянно куда-то ходишь с друзьями, Кирара?»"
1009306-119 = "Ага! Мне нравится шумная компания, обычно нас трое-четверо!"
1009306-120 = "Но сегодня даже вдвоём мы прошли намного больше обычного!"
1009306-121 = "Кажется, я немного увлеклась моментом!"
1009306-122 = "[s] «Может, это адреналин после успешной пересдачи?»"
1009306-123 = "Это точно повлияло! Но вообще-то..."
1009306-124 = ""
1009306-126 = ""
1009306-127 = "Думаю, больше всего дело было в компании, которая была со мной сегодня..."
1009306-128 = "Я-Я имею в виду, кто знает? Я не знаю! Ладно, нам пора!"
1009306-130 = "Мы с Кирарой ещё немного погуляли, а потом я вернулся в Шале."
