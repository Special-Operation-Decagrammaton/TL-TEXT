[translation]
2300803-1 = "Мысли и молитвы"
2300803-6 = "(Когда я пришёл в собор, вокруг не было ни души.)"
2300803-7 = "(Пустой собор казался одновременно величественным и безупречно чистым.)"
2300803-8 = "Вы пришли, Сенсей. Сюда."
2300803-9 = "[s1] «...?»\n[s2] Посмотреть в сторону, откуда доносится голос."
2300803-14 = "― Спасибо, что пришли, Сенсей.[wa:3120]"
2300803-17 = "― Да. Я как раз молилась за вас, Сенсей.[wa:770]"
2300803-20 = "― В таком тихом месте очень хорошо молиться.[wa:3160]"
2300803-22 = "― Когда я молюсь, мне кажется, будто моё сердце очищается.[wa:1850]"
2300803-25 = "― Есть пути, которые вы уже прошли,[wa:1990]"
2300803-27 = "― и пути, которые вам ещё предстоит пройти.[wa:640]"
2300803-30 = "― Пусть мир и счастье найдут вас[wa:1230]"
2300803-32 = "― куда бы вы ни решили отправиться."
2300803-35 = "― Хм? Молилась ли я когда-нибудь за себя?[wa:3180]"
2300803-37 = "― Это... Нет, всё в порядке.[wa:3130]"
2300803-40 = "― Я счастлива, если счастливы вы, Сенсей.[wa:3330]"
2300803-42 = "― Другими словами, это может быть молитва за нас обоих.[wa:2830]"
2300803-45 = "Честно говоря, я хотела вознести эту молитву гораздо раньше, но в последнее время была немного занята работой в соборе..."
2300803-46 = "Хм-м. Наверное, это всего лишь оправдание."
2300803-47 = "Сестре не следует привыкать оправдываться."
2300803-48 = "Простите, что лишь сейчас смогла уделить внимание вашим нуждам, Сенсей."
2300803-49 = "[s3] «Вовсе нет. Похоже, из тебя получится образцовая сестра.»\n[s4] «Я и так вижу, что ты уже замечательная сестра.»"
2300803-50 = "Ч-Что? П-Правда?"
2300803-51 = "Ч-Что? П-Правда?"
2300803-52 = "В-Вы опять меня дразните, да? Ну правда, Сенсей!"
2300803-53 = "Лгать нехорошо, Сенсей. В прошлый раз из-за этого вы чуть не попали в большие неприятности."
2300803-54 = "Я каждый день молюсь, чтобы подобное больше не повторилось, но..."
2300803-55 = "А?"
2300803-56 = "Вы не думаете, что случившееся в прошлый раз было из-за того, что вы солгали?"
2300803-57 = "П-Правда? Тогда из-за чего?"
2300803-58 = "В-В любом случае..."
2300803-59 = "Сенсей. Если вы не против, можете подойти немного ближе?"
2300803-60 = ""
2300803-62 = ""
2300803-63 = ""
2300803-65 = "Есть несколько разных способов молиться."
2300803-66 = "Один из них..."
2300803-67 = ""
2300803-69 = ""
2300803-70 = "— сложить руки вместе и поднять их вот так во время молитвы."
2300803-71 = "Лично я верю, что такую молитву легче услышать."
2300803-72 = "А такие люди, как вы, Сенсей, которые склонны ставить других на первое место..."
2300803-73 = "Что ж, думаю, вы наверняка сначала помолитесь за студентов, а уже потом за себя."
2300803-74 = "Именно поэтому, мне кажется, рядом должен быть кто-то, кто останется и будет молиться вместе с вами вот так."
2300803-75 = "Я возьму на себя эту роль, потому что однажды хочу стать великой сестрой."
2300803-76 = "А теперь, пожалуйста, закройте глаза, Сенсей."
2300803-77 = "Давайте ещё раз вместе помолимся о вашем счастье."
2300803-79 = "...И обо мне, которая желает, чтобы эта молитва сбылась."
