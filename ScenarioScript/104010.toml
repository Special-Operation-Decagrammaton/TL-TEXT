104010-164 = "Вероятнее всего, этот облик появился под влиянием Chroma."
104010-165 = "[ns] «...»"
104010-167 = "После этого... Сенсей привёл меня сюда... чтобы я исполнила своё предназначение — уничтожила все миры."
104010-168 = ""
104010-170 = ""
104010-171 = "Вы... это я...?"
