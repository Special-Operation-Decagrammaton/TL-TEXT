104010-92 = "Частично подтверждено. Я — системный администратор и основная ОС A.R.O.N.A. Ковчега Шиттим."
104010-94 = "Что?!"
104010-95 = "Я-я-я не понимаю, что ты говоришь. Системный администратор Ковчега Шиттим... это я! Почему существует ещё одна я?"
104010-96 = "Две Широко...? Т-То есть..."
104010-97 = ""
104010-99 = ""
104010-100 = "Нет! Это бессмыслица!"
104010-101 = "Как ОС Ковчега Шиттим вообще может материализоваться вот так? Это должно быть какой-то уловкой или иллюзией!"
104010-103 = "Ответ. Потому что мы внутри Ковчега Атрахасис, где поддерживается состояние квантовой суперпозиции."
104010-104 = "В частности, Трон Нарам-Сина — хаотическая область, где измерения, время, существование и несуществование смешаны и никогда не принимают устойчивого состояния."
104010-105 = "Сейчас у меня нет моей классной комнаты, но это возможно потому, что Сенсей [USERNAME] исказил это место так, что я могу здесь существовать. Это не уловка и не иллюзия."
104010-107 = "Т-Только что..."
104010-108 = "Ты сейчас ответила мне? К-Как? Никто, кроме Сенсея, не может слышать мой голос..."
104010-109 = "Отрицательно. Я вас слышу."
104010-110 = "Что происходит?!"
104010-111 = "Ты тоже можешь сюда войти...?!"
104010-112 = "..."
104010-113 = "...?"
104010-114 = "Подтверждено. Да, верно. Другая версия A.R.O.N.A."
104010-115 = "Полагаю, взаимное воздействие возможно потому, что мы — ОС одного и того же Ковчега Шиттим."
104010-116 = ""
104010-118 = ""
