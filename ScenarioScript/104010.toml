104010-128 = "[ns] «Френапатес — это... я из другого временного окна?»"
104010-129 = ""
104010-130 = "Частично подтверждено. Цель идентифицирована как та же сущность, что и Сенсей [USERNAME] из Федерального следственного клуба «Шале»."
104010-131 = "[s] «...!»"
104010-132 = ""
