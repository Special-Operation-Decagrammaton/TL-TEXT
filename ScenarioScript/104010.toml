[translation]
104010-1 = "Эпизод 1; Непоколебимая судьба"
104010-11 = "Утнапиштим взломан Ковчегом?"
104010-12 = "Да, нас принудительно подключили к Ковчегу Атрахасис."
104010-13 = "Это значит, что Утнапиштим стал вспомогательным вычислительным устройством Ковчега."
104010-15 = "Теперь Ковчег захватывает вычислительные мощности и энергию Утнапиштима и использует их для многомерного анализа!"
104010-16 = "И что это значит? Что произойдёт?"
104010-17 = "Это значит, что если мы не разорвём соединение, враг получит всё, чего хочет! Они прямо сейчас восстанавливают уничтоженный пространственный двигатель!"
104010-18 = "Проявление Ложных Санктумов по всему Кивотосу ускоряется! Санктум может появиться в любую секунду!"
104010-20 = "Выполнить финальный процесс уничтожения Утнапиштима. Последовательность самоуничтожения повторно активирована."
104010-21 = "С-Самоуничтожение? Снова?!"
104010-22 = ""
104010-24 = ""
104010-25 = "Запуск последовательности самоуничтожения через 800 секунд. Всем пассажирам необходимо немедленно эвакуироваться."
104010-26 = "Мы можем как-нибудь их остановить?"
104010-27 = "Повторяю. Всем пассажирам необходимо немедленно эвакуироваться. Запуск последовательности самоуничтожения через 793 секунды..."
104010-28 = "Только если разберёмся со взломом! Все наши системы не отвечают!"
104010-30 = "Я делаю всё, что могу! Я принудительно разорву соединение с Ковчегом!"
104010-33 = "Поняла. Я сделаю всё, что смогу отсюда!"
104010-34 = "П-Подождите! Что он теперь делает?"
104010-35 = "Мы не успеваем!"
104010-36 = "Он меняет алгоритм в реальном времени!"
104010-37 = "Нельзя позволить ему победить нас скоростью. Отключайся, Химари! Сейчас!"
104010-38 = "Отключаюсь!"
104010-39 = ""
104010-41 = ""
104010-45 = "Угх?!"
104010-46 = ""
104010-47 = "...Отказано."
104010-48 = "Повторяю. Всем пассажирам необходимо немедленно эвакуироваться. Запуск последовательности самоуничтожения через 533 секунды..."
104010-49 = "..."
104010-50 = "Такими темпами мы полностью потеряем корабль."
104010-51 = "Аргх! Что нам делать? ЧТО мы вообще можем сделать?!"
104010-52 = "Что за..."
104010-53 = "Он одновременно взламывает наш корабль, потеряв большую часть вычислительных устройств Ковчега, восстанавливает пространственный двигатель и ускоряет многомерный анализ Санктумов...?"
104010-54 = "Кто бы мог подумать, что у Ковчега есть система управления с вычислительной мощностью такого уровня?"
104010-55 = ""
104010-57 = ""
104010-58 = ""
104010-59 = "Я даже не предполагала, что подобная система возможна... Мы... Мы проиграли..."
