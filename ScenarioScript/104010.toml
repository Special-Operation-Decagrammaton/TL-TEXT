104010-225 = "У-Ух... *кхе*"
104010-226 = ""
104010-227 = ""
104010-228 = "Такова судьба Сунаоками Широко. Мы — бог, ведущий миры к смерти. От этого не сбежать."
104010-229 = "[ns] «Широко…!!»"
104010-230 = ""
104010-232 = "Н-Нет... Сенсей... Не подходите ко мне..."
104010-233 = ""
104010-236 = ""
104010-237 = "Ты не сможешь со мной сражаться."
104010-238 = "Я пережила то, что тебе ещё только предстоит, и знаю то, чему тебе ещё предстоит научиться. Ты не сможешь преодолеть разрыв между нами."
104010-239 = "*кхе* Ты... *кхе*"
104010-240 = "Почему...?"
104010-241 = ""
104010-243 = ""
104010-244 = "Существование Сунаоками Широко..."
104010-245 = "Я не знала, какие переменные ты внесёшь в план Френапатеса. В одном мире может существовать лишь одно возвышенное воплощение смерти и разрушения."
104010-246 = "Чтобы исполнить своё предназначение в этом мире, мне было необходимо, чтобы ты — другой бог разрушения — не существовала."
104010-247 = "Поэтому я похитила тебя и заперла в этом Ковчеге, где существование и несуществование едины."
104010-248 = "Но..."
104010-252 = "...Я сочувствую тебе, Сунаоками Широко."
104010-253 = "Мне и правда хотелось, чтобы ты тихо встретила свой конец, ничего не узнав о своём предназначении."
104010-254 = "Тогда тебе не пришлось бы познать боль от смерти любимых у тебя на глазах."
104010-256 = "И всё же... ты настаиваешь на бессмысленном сопротивлении. Значит, будешь страдать снова, и снова, и снова."
