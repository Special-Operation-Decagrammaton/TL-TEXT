104010-173 = "Я убила... Сенсея...?"
104010-174 = "Да."
104010-176 = "Моё предназначение... уничтожить все миры?"
104010-177 = "Да."
104010-178 = "Закрой свой лживый рот!!!"
104010-179 = ""
104010-181 = ""
104010-182 = ""
104010-183 = ""
104010-189 = "Ты врёшь! Всё это ложь!"
104010-190 = "Я? Навредить Сенсею? Захотеть уничтожить мир? Я не потерплю такой лжи!"
