104010-138 = "[s] «Арона...?»"
104010-139 = "Она права. Вы одинаковые, но в то же время разные."
104010-140 = "Я тоже проверила биометрию Френапатеса. Это определённо тот же человек... хотя форма и внешний вид явно изменились..."
104010-141 = "Этот Френапатес... т-технически Сенсей... из другого временного окна... но..."
104010-142 = "Френапатес... то есть... этот Сенсей из другого времени..."
104010-143 = "он..."
104010-144 = ""
104010-146 = "он мёртв..."
