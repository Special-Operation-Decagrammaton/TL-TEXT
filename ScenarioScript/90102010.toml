[translation]
90102010-1 = "Эпизод 1;Поезд в прошлое"
90102010-2 = "Станция Каваниши, Р.У."
90102010-4 = "Слушай, у пятого выхода, ты заметила?"
90102010-5 = "Магазин, который всё время ремонтировали, открылся."
90102010-6 = "Э, правда? Что за магазин?"
90102010-7 = "Похоже, это была блинная."
90102010-8 = "Там было написано: «Начали продавать блины со сливками!»"
90102010-9 = "Давай как-нибудь сходим попробовать."
90102010-10 = "Магазин, куда мы часто ходили, внезапно закрылся."
90102010-11 = "А, тот, что перед академией?#nОбожала там бананово-шоколадные блины~"
90102010-12 = "Понимаю тебя~!"
90102010-13 = "Ох... мне вдруг захотелось чего-нибудь сладкого."
90102010-14 = "Э? Разве ты только что не сказала, что наелась?"
90102010-15 = "Для десерта всегда есть место!"
90102010-16 = ""
90102010-22 = ""
90102010-23 = "..."
90102010-24 = "Эх... а ведь раньше мы часто ходили... в ту блинную."
90102010-25 = "После перевода сюда я ни разу там не была."
90102010-26 = "Боязно одной заходить в такие стильные места..."
90102010-29 = ""
90102010-30 = "...Вот поэтому я не хотела переводиться."
90102010-31 = "И красивые цветы по дороге в школу, и любимое кафе... в новой академии ничего этого нет."
90102010-32 = "И друзья―"
90102010-33 = "Все разбрелись кто куда после закрытия школы."
90102010-34 = ""
90102010-36 = ""
90102010-37 = "...Эх, вернуться бы в прошлое."
90102010-38 = "Если бы можно было вернуться... я бы на всё пошла."
90102010-39 = ""
90102010-42 = ""
90102010-43 = ""
90102010-44 = "«Скоро на 4-й путь прибудет поезд»"
90102010-45 = "...Что?"
90102010-46 = "Он не рано?"
90102010-47 = "Может, график сбился?"
90102010-48 = ""
90102010-51 = "«Скоро прибудет поезд до частной академии Гиацинт»"
90102010-52 = "«Во избежание несчастных случаев отойдите за жёлтую линию»"
90102010-53 = ""
90102010-56 = ""
90102010-57 = "...До академии Гиацинт?"
90102010-58 = "Ведь её уже закрыли, почему?.."
90102010-59 = ""
90102010-61 = ""
90102010-62 = "Но... если этот поезд правда меня туда доставит―"
90102010-63 = ""
90102010-67 = "«Двери закрываются. Пожалуйста, не пытайтесь вскочить в поезд»"
90102010-68 = "«Следующий поезд... не предусмотрен»"
90102010-70 = "Следующий эпизод;Безбилетный проезд"
