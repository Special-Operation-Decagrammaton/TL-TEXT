[translation]
90102010-1 = "Episode 1;Train Bound for the Past"
90102010-2 = "D.U. Kawanishi Station"
90102010-4 = "Hey, did you notice in front of Exit 5?"
90102010-5 = "That shop that was under construction for so long finally opened."
90102010-6 = "Oh, really? What kind of shop was it?"
90102010-7 = "Looked like a crepe shop."
90102010-8 = "It said, \"Fresh cream crepes now available!\""
90102010-9 = "Let's go grab some next time."
90102010-10 = "That place we used to go to suddenly closed down, after all."
90102010-11 = "Ah, the one that was in front of the academy?#nI really loved their banana chocolate crepes~"
90102010-12 = "I know, right~!"
90102010-13 = "Ah... Now I'm starting to crave something sweet."
90102010-14 = "Huh? Didn't you just say you were full?"
90102010-15 = "There's always room for dessert~!"
90102010-23 = "...."
90102010-24 = "Hah... We used to go all the time... to that crepe shop."
90102010-25 = "Ever since I transferred here, I haven't been even once."
90102010-26 = "It's too scary to go into a trendy place like that by myself..."
90102010-30 = "...That's why I didn't want to transfer in the first place."
90102010-31 = "The pretty flowers blooming along the route to school, the café I loved... my new academy has none of that."
90102010-32 = "And my friends--"
90102010-33 = "They all drifted apart when the school closed down."
90102010-37 = "...I want to go back to the old days."
90102010-38 = "If I could go back... I'd do anything."
90102010-44 = "\"A train is now approaching Track 4.\""
90102010-45 = "...Huh?"
90102010-46 = "Isn't it early?"
90102010-47 = "Is the schedule messed up?"
90102010-51 = "\"The express train bound for Private Hyacinth Academy is now approaching.\""
90102010-52 = "\"For your safety, please stand behind the yellow line.\""
90102010-57 = "...Bound for Hyacinth Academy?"
90102010-58 = "That line was discontinued, so why...?"
90102010-62 = "But... if this train really will take me there--"
90102010-67 = "\"Doors closing. Please refrain from forcing your way onto the train.\""
90102010-68 = "\"There are no... further trains scheduled.\""
90102010-70 = "Next Episode;Fare Evasion"
