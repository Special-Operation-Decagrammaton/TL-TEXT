[translation]
1006603-1 = "Учёба! Великая операция горничной!"
1006603-2 = "Получив сообщение от Арис, я отправился в Клуб разработки игр."
1006603-3 = ""
1006603-7 = ""
1006603-8 = "Клубная комната Отдела разработки игр"
1006603-9 = "Сенсей! Я ждала вас."
1006603-10 = "Вы пришли раньше, чем я ожидала, значит, торопились. Вас что-то беспокоило?"
1006603-11 = "[s1] «Эм, ты ведь сказала „учёба горничной“, да...?»\n[s2] «Мне показалось неправильным оставлять тебя одну с этой „учёбой горничной“...»"
1006603-14 = "Вот как? Но это даже хорошо."
1006603-15 = "Я слышала, что учиться гораздо лучше вместе!"
1006603-16 = ""
1006603-18 = ""
1006603-19 = "А если вам интересно, какие материалы я нашла..."
1006603-20 = ""
1006603-22 = ""
1006603-24 = ""
1006603-27 = ""
1006603-28 = "Та-дам! Вот!"
1006603-29 = "[s] «Это... только не говори, что...»"
1006603-30 = "Верно! Это видеоматериалы, в которых появляются разные горничные!"
1006603-31 = "Нет никаких сомнений, что, обучаясь по этим материалам, я получу ещё больше EXP!"
1006603-32 = "По сути, это книги опыта!"
1006603-33 = "«Kamen no Maid Lady,» «Maboromatic» и «Tachibana Maid Team!»"
1006603-34 = "Это самые лучшие рекомендации!"
1006603-35 = "[s] «Для начала... откуда ты вообще взяла эти рекомендации?»"
1006603-36 = "Хм? Конечно же, из интернета."
1006603-37 = "В интернете я могу найти любую нужную информацию. Очень удобно!"
1006603-38 = "[s] «Знаешь, так это звучит ещё опаснее!»"
1006603-39 = "Опаснее...? Не понимаю."
1006603-40 = "Некоторые писали в отзывах, что эти произведения изменили их жизнь и были очень трогательными."
1006603-41 = "[s] «Я знаю, что такие люди есть, и даже понимаю их, но...!»"
1006603-42 = "Если что-то настолько трогательное, что способно изменить чью-то жизнь... я очень хочу это посмотреть! У меня тоже были похожие переживания!"
1006603-43 = "И даже если это опасно, я не боюсь! Пусть я новичок, но я герой! И сейчас я бросаю себе вызов — стать горничной! Я смогу защитить себя от опасности!"
1006603-44 = "...Хм? Опасность не в этом смысле? Я не понимаю. Тогда вы мне поможете?"
1006603-45 = "Вы ведь часто это говорите! Обязанность Сенсея — помогать ученикам!"
1006603-46 = "[s3] «Ну, если ты так ставишь вопрос, я не могу сказать, что это неправда!»\n[s4] «...Наверное, в такой ситуации лучше, чтобы за тобой присматривал взрослый...»"
1006603-49 = "Значит, вы будете со мной?"
1006603-50 = "Ура! Получилось! Теперь я смогу стать ещё сильнее!"
1006603-51 = "Сенсей присоединился к группе! Та-дам!"
1006603-53 = "И я вместе с Арис посмотрел её материалы о горничных."
1006603-54 = ""
1006603-55 = "..."
1006603-56 = "[s] «...»"
1006603-57 = "..."
1006603-58 = "[s] «Ну что... Арис?»"
1006603-59 = "..."
1006603-60 = "[ns] «Арис? Арис?!»"
1006603-61 = "Я наконец всё поняла!"
1006603-62 = "[s] «А?!»"
1006603-63 = "Так вот что значит быть горничной! Это так глубоко и сложно..."
1006603-64 = "Я действительно почти ничего об этом не знала! Мне стоит изменить то, как я обращаюсь к вам, Сенсей."
1006603-65 = "Господин!"
1006603-66 = "[s] «Арис...? По-моему, это обращение немного...»"
1006603-67 = "И... всё то, что я считала ошибками, оказалось... базовым этикетом горничной!"
1006603-68 = "Например, принести не то блюдо, потерять равновесие и налететь на кого-нибудь, перепутать соус и вообще быть неуклюжей...!"
1006603-69 = "Всё это, по сути, сервис для душевного исцеления!"
1006603-70 = "[s] «Эй, это уже становится опасно! Всё совсем не так!»"
1006603-72 = "После этого Арис ещё долго рассказывала о «базовых принципах» работы горничной..."
1006603-73 = "Потребовалось немало времени, чтобы исправить её заблуждения."
1006603-74 = ""
1006603-75 = "Было очень весело, Сенсей."
1006603-76 = "Теперь я очень хорошо разбираюсь в горничных!"
1006603-77 = "[s] «Ну... если тебе было весело...»"
1006603-78 = "Почему вы выглядите совершенно выжатым? Такое чувство, будто с вас сейчас пепел посыплется."
1006603-79 = "Узнавать новое ведь должно быть весело. Вам разве не понравилось?"
1006603-80 = "Это... из-за меня...?"
1006603-81 = "[s5] «Нет, мне тоже было весело. Просто иногда веселье утомляет.»\n[s6] «Если снова устроишь такую учебную сессию... Обя-за-тель-но позови меня, хорошо?»"
1006603-84 = "Вот как? Тогда я рада!"
1006603-85 = "Мне нравится, когда вы рядом, Сенсей."
1006603-86 = "Буду ждать нашей следующей встречи..."
1006603-87 = "Господин!"
