[translation]
33160-1 = "Episódio 16;Alguns Fragmentos"
33160-6 = "Azusa..."
33160-7 = "O quanto você deve ter sofrido com essa decisão...? Um presente que você realmente prezava como a própria vida. Usá-lo como uma ferramenta para matar..."
33160-8 = "Originalmente, era uma bomba preparada para destruir o meu halo..."
33160-9 = "E o que você não usou naquela ocasião, usou neste exato momento..."
33160-12 = "Cof, cof! Urgh, argh...!"
33160-13 = "...!"
33160-14 = "Princesa, Princesa!!!!"
33160-15 = "..."
33160-16 = "...Contudo, a Saori está a salvo. Embora esteja gravemente ferida, o halo dela não foi destruído."
33160-17 = "Mas e a Atsuko, que a protegeu...?"
33160-18 = "Princesa!! Não, Atsuko! Aguente firme!!"
33160-19 = "Atsuko, aquela garota chamada de Princesa..."
33160-20 = "Deve ser alguém muito importante para a Saori."
33160-22 = "..."
33160-23 = "O poder do Sangue Real enfraqueceu. Será que houve alguma anomalia com a vida dela...?"
33160-24 = "Hum, será que isso vai atrapalhar o experimento...? Mas ainda..."
33160-25 = "..."
33160-26 = "...Ah, entendo."
33160-27 = "Então ela já havia deixado uma precaução preparada... Faz sentido, por se tratar do precioso Sangue Real."
33160-28 = "Bem, que seja. Vai levar um certo tempo, mas... de um jeito ou de outro, somos camaradas. Isso é o mínimo que posso fazer."
33160-33 = "Ora, vamos ao trabalho."
33160-35 = "Urgh..."
33160-36 = "Princesa, você está bem!?"
33160-37 = "(Assente)"
33160-38 = "Ah, que alívio. Princesa..."
33160-43 = "...Imperdoável."
33160-44 = "Azusa... como ousa ferir a Princesa desse jeito..."
33160-45 = "Eu jamais vou te perdoar, Azusa!!"
33160-47 = "A Atsuko não morreu..."
33160-48 = "Se aquela bomba tivesse me atingido, sem dúvida o meu halo teria sido \"destruído\"."
33160-49 = "Até mesmo a Saori, que não sofreu o impacto direto, recebeu todo aquele dano."
33160-50 = "Parece que o halo dessa garota chamada Atsuko... está sendo protegido por alguém."
33160-51 = "..."
33160-52 = "...No entanto, um grande contratempo está surgindo nos planos do Esquadrão Arius."
33160-53 = "O ataque a Trinity ainda não pôde ser realizado e, com o ferimento da Atsuko, o poder do Conselho das Santas de Justina também está enfraquecendo."
33160-54 = "Além de os combates na Antiga Catedral estarem começando a se acalmar..."
33160-55 = "Ambas as academias estão em um impasse, e o transporte das feridas também está começando."
33160-56 = "...Azusa. Espero que isso alivie o seu desespero, nem que seja um pouco..."
33160-58 = "Ferida encontrada, iniciando transporte!!"
33160-59 = "Tragam uma maca para cá!"
33160-60 = "Por ali, ainda há várias feridas!"
33160-62 = "Presidente! Resgatamos as membras da Pandemonium Society do dirigível que caiu no lago! Informaram que a Presidente Makoto também estava entre elas!"
33160-63 = "Como esperado da Presidente, sortuda como sempre. Até cair no lago foi uma sorte..."
33160-64 = "Continuem com os resgates em todas as áreas. Por regra, levem todas obrigatoriamente para a unidade de terapia intensiva."
33160-65 = "Sim!"
33160-66 = "E quanto ao Comitê Disciplinar?"
33160-67 = "No momento, a Administradora Ako-san está coordenando tudo. Segundo as informações, a Chefe está gravemente ferida e inconsciente."
33160-68 = "..."
33160-69 = "A Chefe do Comitê Disciplinar... justo ela, que provavelmente era quem mais desejava este tratado..."
33160-70 = "...Presidente?"
33160-71 = "...Não, não é nada. Por favor, continuem resgatando as feridas."
33160-75 = "..."
33160-76 = "...Parece que vai chover. Vamos nos apressar."
33160-79 = "A Presidente Tsurugi, do Comitê de Justiça, está gravemente ferida! E informam que a Vice-Presidente Hasumi está em estado crítico!"
33160-80 = "A Sakurako-sama também está em estado crítico! Como a enfermaria das Cavaleiras Socorristas está com todos os leitos ocupados no momento, ela está sendo levada para o dormitório da Biblioteca Antiga!"
33160-85 = "A-Ah... Sakurako-sama..."
33160-86 = "...E a Nagisa-san?"
33160-87 = "Quanto a ela, informaram que as buscas ainda estão em andamento!"
33160-88 = "..."
33160-89 = "...! Chegou a informação de que uma ala extremista está prestes a declarar guerra contra Gehenna!!"
33160-91 = "Como é!?"
33160-92 = "Não pode ser, fazer algo assim aqui e agora é...!"
33160-96 = "Temos informações de que o Comitê de Justiça está tentando entrar na Grande Catedral! Um confronto começou no salão central contra as Irmãs que tentaram impedi-las!"
33160-97 = "O quê...!?"
33160-101 = "A confusão está se espalhando por toda parte..."
33160-102 = "Precisamos interromper os combates logo e nos concentrar nos resgates...!"
33160-105 = "(São variáveis demais e ainda estamos nesta situação... O que é que eu devo fazer...?)"
33160-106 = "(Seia-chan...)"
33160-108 = "(Sensei...)"
33160-110 = "Gehenna - Enfermaria"
33160-111 = "A Chefe desapareceu!?"
33160-112 = "S-Sim... ela estava deitada aqui até agora há pouco, mas..."
33160-113 = "Procurem por ela imediatamente! Para onde ela poderia ter ido com aqueles ferimentos...!?"
33160-114 = "S-Sim!"
33160-119 = "Chefe..."
33160-121 = "...Parece que a Chefe do Comitê Disciplinar desapareceu."
33160-122 = "O que será que aconteceu com o coração dela, depois de ter se esforçado tanto até agora...?"
33160-124 = "Tea Party - Sala de Aula"
33160-125 = "O texto da declaração de guerra está pronto!?"
33160-126 = "Sim, está tudo certo!"
33160-127 = "Ótimo, então vamos imediatamente...!"
33160-131 = "Esperem, por favor!"
33160-132 = "O quê, Urawa Hanako-san...? Por que você está aqui!?"
33160-133 = "Pelas regras da escola, uma declaração de guerra não pode ser proclamada sem a Anfitriã!"
33160-134 = "..."
33160-135 = "Vocês viram aquelas imagens, não viram!? O inimigo não é Gehenna!"
33160-136 = "Aquilo com certeza é \"alguma outra coisa\" controlada por Arius!"
33160-137 = "Através das ruínas espalhadas pelo distrito autônomo de Trinity e das Catacumbas conectadas ao subterrâneo delas—"
33160-139 = "...Prendam-na."
33160-145 = "...!?"
33160-147 = "Urawa Hanako-san... É lamentável que as coisas tenham chegado a este ponto."
33160-148 = "O que estão...!?"
33160-149 = "Se está falando das imagens, nós de fato as verificamos. Aquele grupo de identidade desconhecida, o \"Conselho das Santas de Justina\"."
33160-150 = "Já sabemos muito bem que aquilo tem relação com a Irmandade. É exatamente por isso que estamos prestes a agir desta maneira."
33160-151 = "A brincadeira de detetive acabou, Hanako-san."
33160-152 = "...!"
33160-153 = "Também confirmamos o local de lançamento do míssil de cruzeiro. Foram as ruínas da catedral sob a administração da Irmandade, não é mesmo?"
33160-154 = "Que Arius tenha invadido nosso distrito autônomo por conta própria através das Catacumbas logo abaixo... Certamente, essa possibilidade existe."
33160-155 = "Mas, em primeiro lugar, que tal a hipótese de Arius e a Irmandade estarem trabalhando juntas desde o início?"
33160-156 = "...! Isso é...!"
33160-157 = "Elas são um grupo de sigilo absoluto. Não seria nenhuma surpresa se fossem capazes de algo assim."
33160-158 = "Nós, da facção Pater, decidimos responder rapidamente a esta situação perigosa."
33160-159 = "Isso quer dizer que... não pode ser..."
33160-160 = "Sim. Quanto às facções Filius e Sanctus, que se opuseram à nossa decisão ou se abstiveram de julgar, já as colocamos sob custódia."
33160-161 = "É um golpe de Estado...!"
33160-162 = "Não, está enganada. Afinal de contas, ainda temos uma legítima membra da Tea Party presente."
33160-163 = "...!?"
33160-167 = "A líder da facção Pater e membra da Tea Party, Mika-sama."
33160-168 = "Vamos libertá-la e iniciar uma guerra total contra Gehenna, exatamente como ela sempre desejou."
33160-169 = "...!!!"
33160-172 = "..."
33160-173 = "Mika-san, por aqui."
33160-174 = "...Huum?"
33160-179 = "Azusa... o que você pretende fazer agora?"
33160-180 = "Graças à sua determinação, muitas pessoas foram salvas. Porém, embora os preceitos tenham enfraquecido, o \"Conselho das Santas de Justina\" continua existindo."
33160-181 = "Hina, a Chefe do Comitê Disciplinar de Gehenna, desapareceu para algum lugar, e a Hanako está prestes a ser presa."
33160-182 = "E a Mika está sendo libertada."
33160-183 = "No fim, este é mesmo o desfecho."
33160-184 = "Afinal, tudo foi sem sentido, uma história vazia demais, como um sonho..."
33160-185 = "...Ainda não."
33160-186 = "Azusa...?"
33160-188 = "Ainda não é hora de se deixar abater, Azusa."
33160-189 = "Mova-se, pense. Se tem tempo para desistir e ficar triste, procure um jeito agora mesmo e dê um jeito de..."
33160-190 = "O próximo plano... o próximo..."
33160-195 = "Não posso parar, tenho que me mexer... achar algum jeito..."
33160-196 = "O \"Conselho das Santas de Justina\" não desapareceu... Tanto a Saori quanto a Atsuko estão a salvo... Isso é... Não, mas..."
33160-197 = "Tenho que ir... custe o que custar, preciso deter a Saori..."
33160-198 = "Senão..."
33160-206 = "Azusa... você ainda pretende lutar?"
33160-207 = "Mesmo sabendo que tudo é em vão, ainda assim você..."
33160-208 = "Tendo perdido tudo, por que você continua tão..."
33160-210 = "Está tendo uma briga violenta logo ali! Alguém vá impedir!"
33160-211 = "Ocorreu um incidente no Prédio Escolar nº 5! O que faremos!?"
33160-213 = "U-Uuh..."
33160-214 = "E-Eu..."
33160-215 = "Ué? Você... não estava no Clube de Aulas de Reforço agora? Por que está aqui? Você não estava proibida de voltar ainda?"
33160-216 = "I-Isso é, hum..."
33160-217 = "Bom, agora não é hora para isso. Se não tem nada para fazer, pode ir lá para o lado da prisão? Disseram que parece ter um grupo estranho prestes a aparecer por lá..."
33160-221 = "E-Eu...!"
33160-223 = "S-Saori-san..."
33160-224 = "Líder..."
33160-226 = "Vamos atacar Trinity agora mesmo...!"
33160-227 = "Antes disso, há algo que precisamos fazer."
33160-228 = "A-A Princesa-chan se machucou, e estão surgindo problemas na manifestação do \"Conselho das Santas de Justina\"..."
33160-229 = "...Precisamos voltar àquela Antiga Catedral e renovar os preceitos."
33160-230 = "..."
33160-231 = "...Entendido. Vamos para a Antiga Catedral."
33160-232 = "Partiremos imediatamente."
33160-233 = "..."
33160-234 = "Vamos!"
33160-236 = "Mika-sama, por aqui."
33160-237 = "Mika-sama!!"
33160-238 = "Perdão pela demora, a senhorita já está livre!"
33160-242 = "Huum... entendi, entendi. É, já saquei mais ou menos a situação. Ou seja..."
33160-243 = "Vocês todas são minhas fãs, é isso? Puxa, não tem jeito mesmo. Querem que eu dê um autógrafo?"
33160-244 = "N-Não, não se trata disso. Como a senhorita já deve ter visto, atualmente Trinity está—"
33160-246 = "Sim, eu sei mais ou menos de tudo. E então, o que vocês todas querem aqui? Não me digam que estão pensando em declarar guerra contra Gehenna ou algo assim?"
33160-247 = "Sim, exato! Agora é a nossa chance de eliminar aquelas garotas de Gehenna de uma vez por todas!"
33160-248 = "Uma guerra total contra Gehenna, exatamente como a senhorita desejava...!"
33160-249 = "Vamos, dê a ordem de combate para toda Trinity agora mesmo!"
33160-250 = "...Aha."
33160-251 = "Vocês têm uma memória muito boa, né? É, eu odeio Gehenna do fundo do coração."
33160-252 = "...E daí? O que tem isso? Por que vieram aqui tão desesperadas por uma ordem?"
33160-253 = "...Como?"
33160-254 = "Vocês já contiveram as outras facções, não foi? Na prática, nem precisam mais de uma formalidade como uma declaração de guerra. Era só irem lá atacar Gehenna agora mesmo, mas querem que eu sinta raiva no lugar de vocês e dê a ordem... Que história é essa? Vocês são bem engraçadas, sabiam?"
33160-255 = "M-Mika-sama!? O que está dizendo...!?"
33160-256 = "Ahaha, desculpa se ofendi."
33160-257 = "É, eu odeio Gehenna. A ponto de querer dar um jeito nelas se tivesse a oportunidade."
33160-258 = "Mas sabe, agora eu não tô muito no clima pra isso. Então, foi mal, mas será que vocês podem ir embora?"
33160-259 = "C-Clima...?"
33160-260 = "A senhorita entende o quão crucial é este momento? E mesmo assim, por uma mera questão de clima..."
33160-261 = "...\"Mera\"? Do que você tá falando? Isso é o mais importante, não é?"
33160-262 = "Eu odeio Gehenna por uma questão de humor e dos meus próprios sentimentos. Qual é o problema nisso? Não existe nenhum motivo oculto ou objetivo por trás disso, sabia?"
33160-263 = "Vocês sabem muito bem que numa situação dessas não precisa de declaração de guerra nenhuma, né? E mesmo assim vêm com essa conversa estranha pedindo pra eu odiar no lugar de vocês..."
33160-264 = "Podem ir embora logo? Eu não tô no clima pra isso agora, e já tá começando a ficar irritante."
33160-265 = "...O que disse?"
33160-266 = "Quer que eu limpe os seus ouvidos? Eu tô perguntando se vocês não conseguem nem sequer odiar se não receberem uma ordem."
33160-267 = "Ora, sua... a gente te deixa falar e você...!"
33160-272 = "...Urgh."
33160-273 = "Sua princesinha mimada que não sabe nada do mundo! Tivemos todo o trabalho de vir te tirar da cela e você já fica se achando...!"
33160-277 = "Ah, quer saber..."
33160-283 = "...Isso dói, viu?"
33160-287 = "Entenda a sua posição! Você está a um passo de ser destituída da Tea Party!"
33160-291 = "Tivemos a bondade de vir até aqui por você, e é assim que...!"
33160-300 = "..."
33160-301 = "O-O que vocês tão fazendo!?"
33160-302 = "Q-Quem é você!?"
33160-303 = "B-Bullying é proibido! Por que juntaram tantas de vocês contra uma só...!?"
33160-305 = "E-Eu não vou permitir uma coisa dessas!!"
33160-306 = "...!"
33160-309 = "[ns] Abrir os olhos."
33160-315 = "[ns] Levantar o corpo."
33160-317 = "S-Sensei!? Você acordou...!!"
33160-318 = "Ainda não pode se mexer! Sensei, aonde você pretende ir...!?"
33160-320 = "...Sensei, você pretende mesmo enfrentar tudo isso até o fim?"
33160-321 = "Para que as alunas não sejam nada além..."
33160-322 = "...de simplesmente alunas?"
33160-323 = "[s] \"Porque eu acredito que é assim que deve ser.\""
33160-324 = "...Contudo, Sensei."
33160-325 = "O que se ergue no seu caminho são o ódio e a desconfiança. A encarnação de sentimentos acumulados ao longo de um tempo quase eterno."
33160-328 = "[ns] \"Então, primeiro, eu vou lá ficar cara a cara com isso.\""
33160-332 = "Próximo;A Verdadeira Face do Ódio"
