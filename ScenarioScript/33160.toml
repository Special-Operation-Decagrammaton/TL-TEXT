[translation]
33160-1 = "Эпизод 16;Осколки"
33160-6 = "Азуса..."
33160-7 = "Ты превратила подарок, которым дорожила не меньше собственной жизни, в орудие убийства."
33160-8 = "Бомбу, которой собиралась уничтожить мой нимб."
33160-9 = "Ты всё это время хранила её."
33160-12 = "*кашель* *кашель*..."
33160-13 = "Х-Химэ?!"
33160-14 = "Химэ!!!"
33160-15 = "..."
33160-16 = "Но Саори всё ещё жива. Раны тяжёлые, но она выжила..."
33160-17 = "...потому что Ацуко защитила её."
33160-18 = "Химэ, приди в себя...! Ацуко!"
33160-19 = "Ацуко, та, которую они называют Химэ..."
33160-20 = "Должно быть, она очень дорога Саори."
33160-22 = "..."
33160-23 = "Сила королевской крови ослабла... Неужели она мертва?"
33160-24 = "Я не могу позволить сорвать мои эксперименты. Communio Sanctorum ещё не готов."
33160-25 = "..."
33160-26 = "А. Возможно, я ошибся."
33160-27 = "Она уже приняла меры предосторожности. Так и подобает носительнице драгоценной королевской крови."
33160-28 = "Пусть будет так. Закрою глаза на эту небольшую помеху. Полагаю, это меньшее, что я могу сделать для партнёра."
33160-29 = ""
33160-31 = ""
33160-32 = ""
33160-33 = "Эксперимент продолжается."
33160-35 = "Са...о..."
33160-36 = "Химэ! Ты в порядке?"
33160-37 = "*кивает*"
33160-38 = "Слава богу..."
33160-39 = ""
33160-41 = ""
33160-42 = ""
33160-43 = "Ей это с рук не сойдёт."
33160-44 = "Азуса... Как ты посмела ранить Химэ?"
33160-45 = "Ты за это заплатишь... Азуса!"
33160-47 = "Итак, Ацуко всё ещё жива."
33160-48 = "И всё же я почти не сомневаюсь, что та бомба уничтожила бы мой нимб."
33160-49 = "Она даже ранила Саори, хотя Ацуко прикрыла её от основной силы взрыва."
33160-50 = "Возможно, у нимба Ацуко есть собственный ангел-хранитель."
33160-51 = "..."
33160-52 = "Как бы то ни было, это наверняка нарушит планы отряда Ариуса."
33160-53 = "Их полномасштабное наступление на Тринити задержано, а власть над Советом ослабла."
33160-54 = "Бои у собора тоже начинают стихать."
33160-55 = "Пока обе стороны зашли в тупик, появится возможность искать и спасать раненых."
33160-56 = "Что до Азусы... этот поворот событий может хотя бы немного ослабить её отчаяние."
33160-58 = "Ещё один раненый! Нужна транспортировка!"
33160-59 = "Сюда! Несите носилки!"
33160-60 = "Там! Ещё один!"
33160-62 = "Председатель! Мы спасли членов Общества Пандемониума с дирижабля, упавшего в озеро! Среди них была председатель Макото!"
33160-63 = "В озеро? Председателю повезло."
33160-64 = "Транспортировку возьмём на себя. Продолжайте спасательные работы. Всех найденных отправляйте в отделения интенсивной терапии."
33160-65 = "Есть, госпожа!"
33160-66 = "Что с Дисциплинарным комитетом?"
33160-67 = "Старший администратор Ако всё ещё командует. Глава Дисциплинарного комитета получила тяжёлые ранения и остаётся без сознания."
33160-68 = "..."
33160-69 = "Глава Дисциплинарного комитета поддерживала Эдемский договор сильнее всех нас..."
33160-70 = "А?"
33160-71 = "Ничего. Продолжайте работу."
33160-72 = ""
33160-74 = ""
33160-75 = "..."
33160-76 = "Надвигается буря. Поторопитесь."
33160-79 = "Председатель Отряда правосудия Цуруги серьёзно ранена, а заместитель Хасуми в критическом состоянии!"
33160-80 = "Сакурако тоже тяжело ранена! Лазарет Рыцарей спасения переполнен, поэтому их перевозят в свободные комнаты старой библиотеки!"
33160-81 = ""
33160-83 = ""
33160-85 = "Н-Нет... Сакурако..."
33160-86 = "А что с Нагисой?"
33160-87 = "Мы всё ещё её ищем!"
33160-88 = "..."
33160-89 = "Чрезвычайная ситуация! Радикальные сторонники Чаепития готовятся объявить войну Геенне!"
33160-91 = "Что?!"
33160-92 = "Мы не можем этого допустить. Особенно сейчас."
33160-93 = ""
33160-96 = "Это Отряд правосудия! Они идут к собору! Один из наших отрядов изо всех сил пытается их остановить."
33160-97 = "А?! Что?!"
33160-98 = ""
33160-101 = "Младшие члены Чаепития, должно быть, в полном хаосе."
33160-102 = "Нужно что-то сделать. Бои должны прекратиться, чтобы мы смогли сосредоточиться на спасательных работах."
33160-103 = ""
33160-105 = "(Всё выходит из-под контроля. Что мне делать?)"
33160-106 = "(Сэя...)"
33160-108 = "(Помоги мне, Сенсей...)"
33160-110 = "Временный лазарет Геенны"
33160-111 = "Что значит председатель исчезла?!"
33160-112 = "Я-Я имею в виду... она ещё минуту назад лежала здесь..."
33160-113 = "Найдите её! Она не могла уйти далеко! С такими ранами ей вообще нельзя никуда идти!"
33160-114 = "Е-Есть, госпожа!"
33160-115 = ""
33160-117 = ""
33160-118 = ""
33160-119 = "Председатель Хина..."
33160-121 = "Значит, глава Дисциплинарного комитета исчезла."
33160-122 = "Её сердцу пришлось вынести слишком многое. Надеюсь, оно не сломалось..."
33160-124 = "Офисы Чаепития"
33160-125 = "Официальная декларация готова?"
33160-126 = "Готова!"
33160-127 = "Хорошо. Не будем терять ни секунды."
33160-128 = ""
33160-131 = "Я-Я вас умоляю — подождите!"
33160-132 = "Урава Ханако? Кто тебя впустил?!"
33160-133 = "Согласно уставу Тринити, войну нельзя объявить без законной хозяйки Чаепития."
33160-134 = "..."
33160-135 = "Вы разве не видели запись?! Геенна нам не враг!"
33160-136 = "Я ещё не знаю всех подробностей... но уверена, за происходящим стоит Ариус."
33160-137 = "Им удалось проникнуть через катакомбы под районом Тринити."
33160-139 = "Арестовать её."
33160-140 = ""
33160-142 = ""
33160-144 = ""
33160-145 = "...?!"
33160-147 = "Значит, ты всё-таки присягнула Сестринству."
33160-148 = "Что?!"
33160-149 = "Ты права — мы изучили запись. Эти странные сущности опознаны как Совет Святой Юстины."
33160-150 = "Мы также знаем о современных связях Сестринства с Советом. Именно поэтому у нас не было выбора, кроме как взять собор под контроль."
33160-151 = "Можешь прекращать играть в детектива, Урава Ханако."
33160-152 = "...!"
33160-153 = "Мы также подтвердили точку запуска ракеты. Она прилетела из руин собора — территории, контролируемой Сестринством."
33160-154 = "Твоя версия может быть верной. Возможно, Ариус действительно проник в наш район через катакомбы..."
33160-155 = "...но тогда выходит, что Ариус и Сестринство всё это время действовали сообща."
33160-156 = "...!"
33160-157 = "Это вполне возможно, особенно учитывая, насколько тщательно Сестринство окутывает себя тайнами."
33160-158 = "Поэтому мы, фракция Pater, взяли дело в собственные руки."
33160-159 = "Не говорите, что остальные из Чаепития..."
33160-160 = "Верно. Члены фракций Filius и Sanctus, выступившие против наших действий или воздержавшиеся от решения, помещены под стражу."
33160-161 = "Это государственный переворот!"
33160-162 = "Разве? Ты забываешь, что одна хозяйка Чаепития всё ещё остаётся."
33160-163 = "...?!"
33160-164 = ""
33160-166 = ""
33160-167 = "Лидер фракции Pater и участница Чаепития — Мисоно Мика."
33160-168 = "Её освободят, чтобы мы смогли начать полномасштабную войну против Геенны — как она и хотела."
33160-169 = "...!"
33160-172 = "..."
33160-173 = "Сюда, госпожа Мика."
33160-174 = "Хм?"
33160-179 = "Что ты теперь будешь делать, Азуса?"
33160-180 = "Своей решимостью ты спасла многих, но не смогла уничтожить Совет, отменив заповеди."
33160-181 = "Хина из Геенны исчезла, а Ханако из Тринити арестована."
33160-182 = "Даже Мика теперь на свободе."
33160-183 = "За такой финал ты сражалась?"
33160-184 = "В конце концов всё действительно оказалось тщетным. Мимолётным и бессмысленным, как сон..."
33160-185 = "Нет. Ещё нет."
33160-186 = "Азуса?"
33160-188 = "Сейчас не время сдаваться."
33160-189 = "Нужно действовать. Если есть время жалеть себя, значит, есть время придумать решение."
33160-190 = "Следующий план. Следующая цель. Что угодно, лишь бы двигаться дальше..."
33160-195 = "Я не могу остановиться здесь. Должен быть способ..."
33160-196 = "Совет не исчез. Саори и Ацуко всё-таки целы... Нет. Даже независимо от этого..."
33160-197 = "...я должна продолжать двигаться. Саори нужно остановить."
33160-198 = "Другого способа нет."
33160-199 = ""
33160-201 = ""
33160-202 = ""
33160-203 = ""
33160-204 = ""
33160-206 = "Азуса, ты... всё ещё собираешься сражаться?"
33160-207 = "Даже зная, что всё тщетно, продолжаешь настаивать."
33160-208 = "Почему? Как?"
33160-210 = "Начался бой! Нужно реагировать!"
33160-211 = "В корпусе 5 бунт! Что делать?"
33160-213 = "Э-э..."
33160-214 = "Я-я..."
33160-215 = "А? Разве тебя не отправили в Клуб дополнительных занятий? Тебе ещё официально не разрешили вернуться к службе, верно? Что ты здесь делаешь?"
33160-216 = "А-А? Ну, я..."
33160-217 = "У нас нет времени. Если заняться нечем, иди в блок хранения. Там наверняка найдётся работа."
33160-218 = ""
33160-220 = ""
33160-221 = "Но я...!"
33160-223 = "С-Саори."
33160-224 = "Лидер..."
33160-226 = "Приготовиться к наступлению на Тринити!"
33160-227 = "Нам нужно больше времени."
33160-228 = "О-Она права. Химэ ранена, да и Совет не в лучшем состоянии..."
33160-229 = "Другого выбора нет. Нужно вернуться к собору и обновить заповеди."
33160-230 = "..."
33160-231 = "Хорошо. Сделаем, как ты сказала."
33160-232 = "Сейчас. Идём."
33160-233 = "..."
33160-234 = "Я сказала — сейчас!"
33160-236 = "Пожалуйста, госпожа Мика. Сюда."
33160-237 = "Госпожа Мика!"
33160-238 = "Простите, что так долго. Теперь вы свободны!"
33160-239 = ""
33160-241 = ""
33160-242 = "Понятно."
33160-243 = "Теперь я понимаю, что происходит. Вы что, все мои фанатки? Пришли за автографом?"
33160-244 = "Н-Нет, дело не в этом. Тринити находится в состоянии—"
33160-246 = "Чрезвычайного положения, знаю! Вы собираетесь объявить войну Геенне, да?! Ха-ха-ха! Вот умора."
33160-247 = "Именно! Это наш шанс стереть Геенну с карты!"
33160-248 = "Как вы и хотели, госпожа Мика."
33160-249 = "Мы будем следовать вашим приказам. Пожалуйста, прикажите всей Тринити готовиться к бою!"
33160-250 = "А-ха-ха. Ха!"
33160-251 = "Вы правы — я ДЕЙСТВИТЕЛЬНО ненавижу Геенну! Как мило, что вы запомнили!"
33160-252 = "И что? Поэтому вы все ведёте себя как стая обезумевших фанатичек?"
33160-253 = "Прошу... прощения?"
33160-254 = "Это даже жалко! Врываетесь сюда, давите на мою ненависть, умоляете сделать за вас грязную работу! Вы не видите, насколько это смешно?!"
33160-255 = "Г-Госпожа Мика! Вам не кажется, что вы переходите черту...?"
33160-256 = "Правда? Простите, если именно вас это оскорбляет."
33160-257 = "Вы ведь сами сказали: я ненавижу Геенну. Иногда настолько, что хочется сжечь их всех, как муравьёв под лупой."
33160-258 = "Но знаете что? Сейчас не один из таких моментов. Услышали? Мне НЕ ХОЧЕТСЯ! Так что будьте хорошими девочками и идите домой. Вы зря тратите время."
33160-259 = "В-Вам... не хочется?"
33160-260 = "Как вы можете так говорить? Это критический момент в истории Тринити..."
33160-261 = "И что? Неправильно заставлять человека делать то, чего он не хочет."
33160-262 = "С моей ненавистью к Геенне так же. Она... просто есть!#nЗа ней нет какого-то великого смысла или цели."
33160-263 = "Так что хватит тратить слова и ступайте. У меня нет настроения с этим разбираться."
33160-264 = "Найдите кого-нибудь другого, кто позволит вам использовать его ненависть ради ваших целей."
33160-265 = "Что вы только что сказали...?"
33160-266 = "Я что, невнятно выразилась? Говорю: глупо ждать чьего-то приказа, чтобы воплощать собственную ненависть."
33160-267 = "Э-Это... неправда!"
33160-268 = ""
33160-270 = ""
33160-272 = "Хмф."
33160-273 = "Ты... гарпия! Вот наша благодарность за то, что мы вытащили тебя из тюрьмы?!"
33160-274 = ""
33160-277 = "Ай. Нападать на безоружную немного нечестно, не думаете?"
33160-278 = ""
33160-283 = "Л-Ладно, вот это было больно..."
33160-284 = ""
33160-287 = "Знай своё место! Или хочешь лишиться места в Чаепитии?!"
33160-288 = ""
33160-291 = "Вот так ты проявляешь благодарность?! А?!"
33160-292 = ""
33160-295 = ""
33160-300 = "..."
33160-301 = "Ч-Что вы делаете?!"
33160-302 = "А ты ещё кто?"
33160-303 = "И-Издеваться незаконно! Их против неё слишком много!"
33160-305 = "Я этого не позволю!"
33160-306 = "...!"
33160-309 = "[ns] Открыть глаза."
33160-315 = "[ns] Сесть."
33160-317 = "С-Сенсей? Вы проснулись!"
33160-318 = "Вам ещё нельзя двигаться! Куда вы собрались?!"
33160-320 = "Вы тоже настаиваете на борьбе, Сенсей?"
33160-321 = "Чтобы ваши студенты могли оставаться просто студентами. Чтобы им не приходилось становиться солдатами или убийцами."
33160-322 = "Именно такой исход вы пытаетесь предотвратить, верно?"
33160-323 = "[s] «Потому что так и должно быть.»"
33160-324 = "Всё не так просто, Сенсей."
33160-325 = "Вы столкнулись со злобой и недоверием, которым уже поколения — почти вечность."
33160-328 = "[ns] «Значит, кому-то пора положить этому конец.»"
33160-332 = "Следующий эпизод;Воплощение ненависти"
