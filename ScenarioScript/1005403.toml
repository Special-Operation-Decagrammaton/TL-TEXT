[translation]
1005403-1 = "Сестра на скамейке"
1005403-6 = "У беговой дорожки стадиона"
1005403-7 = "Обеспокоенный, я отправился к краю беговой дорожки стадиона, где, как я слышал, должна была быть Мари."
1005403-8 = "Она лежала на краю скамейки, совершенно измотанная."
1005403-9 = ""
1005403-11 = ""
1005403-12 = ""
1005403-13 = ""
1005403-14 = "*тяжело дышит* *тяжело дышит* *тяжело дышит* ... *тяжело дышит* ..."
1005403-15 = "Хаха... ха... Мир меркнет..."
1005403-16 = "Кажется... я тоже исчезаю... О... вижу свет и кого-то, машущего мне издалека..."
1005403-17 = ""
1005403-20 = "[ns1] «М-Мари...?!»\n[ns2] «Что случилось? Что с тобой?!»"
1005403-23 = "...?!"
1005403-24 = "А-А?! С-Сенсей? Как давно ты здесь?!"
1005403-27 = "― *тяжело дышит* *тяжело дышит*[wa:1640]"
1005403-28 = "― Мне так жаль, Сенсей...[wa:1560]"
1005403-31 = "― Я-я не хотела... чтобы ты...[wa:2620]"
1005403-32 = "― видел меня... такой...[wa:2140]"
1005403-35 = "― Прости.[wa:2060]"
1005403-36 = "― Сначала... мне просто нужно отдышаться...[wa:3480]"
1005403-39 = "― *вдох* *выдох*[wa:2460]"
1005403-42 = "[ns3] «Хорошо, продолжай дышать. Просто отдохни. Я могу чем-нибудь помочь?»\n[ns4] «Ты в порядке? Скажи, что тебе нужно.»"
1005403-43 = "― Простите?[wa:120]"
1005403-44 = "― Простите?[wa:120]"
1005403-45 = "― Ох, вам не нужно обо мне беспокоиться...![wa:1260]"
1005403-48 = "― С-Спасибо большое. Я ценю вашу заботу... Да...[wa:2980]"
1005403-51 = "― (Подумать только, Сенсей так переживает обо мне...)[wa:2570]"
1005403-54 = "― (Я... Я даже мечтать о таком не могла...)[wa:2460]"
1005403-57 = "― Я... Эм...[wa:4000]"
1005403-58 = "― Надеюсь, вы простите меня за такие слова, но...[wa:1440]"
1005403-61 = "― Мне кажется, в последнее время Сенсей часто был только со мной...[wa:840]"
1005403-62 = "― Не знаю, грех ли это, но...[wa:5840]"
1005403-65 = "― Проводить время с вами...[wa:2020]"
1005403-66 = "― делает меня такой счастливой![wa:2600]"
1005403-69 = ""
1005403-70 = "Спасибо, Сенсей. Кажется, пульс почти пришёл в норму."
1005403-71 = "...А? Как так получилось? Эм, не знаю. Мне кажется, я даже не так уж много сделала..."
1005403-72 = "Я просто помогала тем, кому это было нужно. Когда подошла очередь моего соревнования, я уже немного устала... Но всё равно хотела постараться."
1005403-73 = "[s5] «Ты всё это время бегала и помогала другим?»\n[s6] «Не перенапрягайся так. Ты можешь пострадать.»"
1005403-76 = "О, простите... Но когда я вижу, что кому-то плохо..."
1005403-77 = "Я не могу просто пройти мимо! Мне нужно помочь. Хахаха..."
1005403-78 = "...Но всё равно мне не следовало заставлять тебя переживать."
1005403-79 = "Так что в следующий раз я попрошу помощи у персонала или у тебя."
1005403-80 = "...Хм?"
1005403-81 = "О, я? Нравится ли мне сегодняшний спортивный праздник?"
1005403-82 = "...Да! Даже больше, чем я ожидала. Хаха, я так старалась, что совсем вымоталась!"
1005403-83 = "Правда, до прихода сюда я больше волновалась, чем радовалась."
1005403-84 = "Но как только начала заниматься, всё прошло! Я почувствовала прилив сил."
1005403-85 = "Может, я даже продолжу после окончания спортивного праздника!"
1005403-86 = "А..."
1005403-87 = "Кстати, а ты, Сенсей? Есть соревнование, в котором тебе хотелось бы поучаствовать?"
1005403-88 = "Ты всегда так занят, присматривая за нами, поэтому..."
1005403-89 = "Мне просто кажется обидным, что ты сам толком не можешь наслаждаться такими событиями."
1005403-90 = "[s7] «Ничего страшного. Это моя работа.»\n[s8] «Я тоже отлично провожу время, так что не переживай.»"
1005403-91 = "Сенсей..."
1005403-92 = "Правда? Ты не просто так говоришь? Не уверена, что понимаю."
1005403-93 = "И всё же... заботиться обо всех нас, должно быть, очень тяжело. Даже не знаю, как могу тебя отблагодарить."
1005403-94 = ""
1005403-96 = ""
1005403-97 = "...Эй, Сенсей."
1005403-98 = ""
1005403-100 = ""
1005403-102 = ""
1005403-103 = "Я даже не знаю, что именно тебе может понадобиться, но..."
1005403-104 = "Если я когда-нибудь смогу хоть немного облегчить твою ношу, пожалуйста, скажи. Я хочу хотя бы раз помочь тебе."
1005403-105 = "Хорошо? Обещаешь мне?"
1005403-106 = "[s9] «Хорошо. Я скажу.»\n[s10] Обещаем на мизинцах."
1005403-109 = "...!"
1005403-110 = "Не забудь обещание, Сенсей!"
1005403-111 = "Хи-хи."
1005403-112 = "Буду ждать."
1005403-114 = "Мари, вновь полная сил, встала со скамейки и побежала обратно на дорожку участвовать в следующем соревновании."
1005403-115 = "Я медленно опустился на скамейку, где до этого сидела Мари..."
1005403-116 = ""
1005403-120 = "...И внезапно откуда-то прилетел мяч и ударил меня в лицо."
