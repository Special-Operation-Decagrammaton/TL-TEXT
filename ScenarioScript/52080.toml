[translation]
52080-1 = "Эпизод 8;Кошмар"
52080-6 = ""
52080-7 = "...Моя Аямэ была яркой и тёплой, словно полуденное солнце."
52080-8 = "Она была нашим президентом, всегда протягивала руку помощи и умела всё."
52080-9 = "Её уверенная улыбка всегда убеждала меня, что всё... как-нибудь наладится."
52080-12 = ""
52080-13 = "Не хватает поваров на Осенний фестиваль? Я с радостью помогу! Я живу одна, так что привыкла готовить."
52080-16 = ""
52080-17 = "Пара Моурё шумит у Обсерватории Древа божеств...? Не переживайте. Я разберусь за минуту."
52080-21 = ""
52080-22 = "О, милая, ты потеряла родителей в толпе? Не плачь. Я их найду. Сможешь быть смелой и подождать здесь?"
52080-25 = ""
52080-28 = "Когда бы что-нибудь ни случалось, Аямэ была рядом. Все тянулись к ней."
52080-29 = "Даже когда от неё требовали слишком многого, Аямэ просто улыбалась."
52080-30 = ""
52080-33 = "Президент Аямэ! Пожалуйста, потренируйтесь со мной!"
52080-38 = ""
52080-39 = "Аямэ, помоги нам выбрать лозунг фестиваля!"
52080-40 = "Аямэ, очень неловко просить, но сможешь выйти в ночную смену на выходных? Мой повар заболел..."
52080-41 = ""
52080-43 = ""
52080-45 = ""
52080-46 = "Без проблем! Я справлюсь!"
52080-47 = ""
52080-49 = "А я... едва за ней поспевала."
52080-50 = "Я плакала из-за каждой неожиданной трудности, каждой критики. Сколько бы ни тренировалась, ни разу не победила Аямэ в спарринге."
52080-51 = "Это жестоко... но глядя на неё, я начинала ненавидеть себя. Как мне соперничать? Как вообще сравниваться?"
52080-56 = "Без Аямэ я совершенно беспомощна. Я мошенница."
52080-57 = "Мне никогда не стать Аямэ."
52080-58 = "Никто другой не достоин занять её место. Аямэ навсегда останется настоящим президентом Хяккарёран."
52080-61 = "И всё же она всегда ярко и весело улыбалась, протягивая мне руку."
52080-62 = ""
52080-65 = ""
52080-70 = "Всё хорошо."
52080-71 = "Потому что правда в том—"
52080-72 = ""
52080-79 = "Ты никогда не была моей подругой, Горё Нагуса."
52080-83 = "Уф!"
52080-84 = ""
52080-86 = ""
52080-88 = "*тяжело дышит* *тяжело дышит*... Опять сон."
52080-89 = "Почему мне постоянно снится этот кошмар..."
52080-90 = ""
52080-94 = "О, уже проснулась, Нагуса? И вся в поту!"
52080-95 = "Может, просто скучаешь по старой подушке..."
52080-96 = ""
52080-98 = ""
52080-99 = ""
52080-102 = ""
52080-103 = "...Ябуки Сюро."
52080-104 = "Собственной персоной, можно сказать!"
52080-105 = "Как весело встретить тебя здесь! Будто сцена из сказки."
52080-106 = "...Хотя, может, это была судьба, раз именно ты пришла ко мне."
52080-107 = ""
52080-109 = ""
52080-111 = "Что заставило трусливую Нагусу вернуться на великий Север?"
52080-112 = "Аямэ? Ты ведь скучаешь по ней?"
52080-113 = "Я могла бы спросить тебя о том же, Сюро."
52080-114 = "Что ты задумала? Это ты ради своих больных развлечений воплощаешь Духов артефактов в Эбису?"
52080-115 = "О, кто знает? Я ненавижу спойлеры! Нельзя же просто ВЫДАТЬ концовку!"
52080-116 = "Но наблюдать за твоими жалкими кошмарами было очень весело. Правда."
52080-117 = "И всё же, думаю, пора сделать их реальностью."
52080-118 = ""
52080-120 = ""
52080-121 = ""
52080-123 = ""
52080-124 = ""
52080-125 = ""
52080-126 = ""
52080-128 = ""
52080-129 = ""
52080-131 = ""
52080-133 = ""
52080-135 = ""
52080-137 = ""
52080-139 = "Ха-ха-ха! О, это была Сотня Лотосов? Уверенность впечатляет!"
52080-140 = "Только не говори, что всё ещё веришь, будто можешь заменить Аямэ, жалкая Нагуса."
52080-141 = "Неважно, во что я верю."
52080-142 = "Важно лишь то, что я исполню свою роль."
52080-143 = ""
52080-145 = ""
52080-146 = "Как благородно! Давайте похлопаем девочке!"
52080-147 = "Но... что бы ты себе ни говорила, как далеко ни зашла... ты всё равно останешься СОБОЙ."
52080-148 = "Интересно, сколько выдержит моя мягкая, чувствительная Нагуса."
52080-149 = ""
52080-154 = ""
52080-155 = ""
52080-156 = ""
52080-158 = ""
52080-159 = "Ну что, начнём по-настоящему. Все по местам!"
