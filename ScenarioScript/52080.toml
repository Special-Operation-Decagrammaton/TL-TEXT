[translation]
52080-1 = "Episódio 8;Pesadelo"
52080-7 = "...Nas minhas memórias, a Ayame era uma garota#nradiante e acolhedora como o sol da manhã."
52080-8 = "A Presidente da Hyakkaryouran, que nunca fazia cara feia para nenhum pedido."
52080-9 = "Aquele sorriso trazia paz a todos."
52080-13 = "Faltando gente nas barracas do festival? Deixa comigo!#nMoro sozinha há bastante tempo, já estou acostumada a cozinhar."
52080-17 = "A Trupe Chimi está aprontando na frente do Mirante da Árvore Sagrada?#nQue garotas problemáticas... Vou lá dar uma olhada!"
52080-22 = "Você se perdeu da sua irmã mais velha?#n...Calma, calma, eu vou procurar ela para você!#nSeja uma boa menina e espere aqui, tá bom?"
52080-28 = "Sempre que acontecia alguma coisa, todos procuravam a Ayame e contavam com ela."
52080-29 = "Mesmo nos pedidos que fariam qualquer outra pessoa franzir a testa, a Ayame estava sempre sorrindo—"
52080-33 = "Presidente Ayame! Conto com você no treino de hoje também!"
52080-39 = "Ayame-senpai. É sobre o slogan do próximo festival, estamos sem ideias..."
52080-40 = "Desculpa incomodar, Ayame-chan, mas será que você poderia cuidar da loja no fim de semana...?#nA menina que ia vir acabou passando mal..."
52080-46 = "Claro! Deixa comigo!"
52080-49 = "Enquanto isso, eu... já dava tudo de mim só para tentar alcançar a Ayame."
52080-50 = "Bastava bater em qualquer obstáculo que as lágrimas já escorriam sozinhas.#nNunca consegui vencer a Ayame uma única vez em uma disputa."
52080-51 = "Toda vez que eu via todos confiando na Ayame...#npalavras que eu não conseguia dizer em voz alta ecoavam dentro do meu peito."
52080-56 = "Sem a Ayame, eu não consigo fazer nada. Não tem como eu conseguir."
52080-57 = "Porque eu não sou a Ayame."
52080-58 = "Porque só a Ayame tem o que é preciso para ser a Presidente da Hyakkaryouran."
52080-61 = "Mas a Ayame percebia o que eu estava sentindo#ne sempre estendia a mão para mim com um sorriso radiante."
52080-70 = "Está tudo bem, Nagusa."
52080-71 = "Afinal, eu—"
52080-79 = "Eu... nunca considerei você minha amiga."
52080-83 = "...Ah!"
52080-88 = "Arf, arf... De novo, um sonho..."
52080-89 = "Por que continuo tendo esse pesadelo sem parar...?"
52080-94 = "...Já acordou, é?"
52080-95 = "Pelo visto você é do tipo que não dorme bem fora da própria cama, né, Nagusa-chan?"
52080-103 = "...Shuro Yabuki."
52080-104 = "Sim, siiim. Sou eu mesma, ora?"
52080-105 = "Nos encontrarmos de novo num lugar desses... que destino curioso, não acha?"
52080-106 = "...Ou melhor, foi a Nagusa-chan quem veio meter o nariz onde não devia, não foi?"
52080-111 = "Por que será que você se deu ao trabalho de vir até uma terra infestada de monstros e assombrações como esta?"
52080-112 = "Não me diga que veio alimentando a esperança idiota de...#nreencontrar sua amiga de infância?"
52080-113 = "...Essa é a minha fala."
52080-114 = "O que você está fazendo aqui?#nEssas Hyakumonogatari que andam aparecendo por aqui são obra sua?"
52080-115 = "Quem sabe, né? Afinal, spoilers são estritamente proibidos em histórias de terror."
52080-116 = "Eu queria te presentear com um pesadelo sem fim como boas-vindas pelo nosso reencontro...#nMas se já acordou, não tem jeito, né?"
52080-117 = "Vou transformar o pesadelo em realidade para você, tá?"
52080-139 = "Ahaha!#nEntão conseguir usar a \"Hyakuren\" daquela vez não foi sorte mesmo!"
52080-140 = "Não pode ser, não pode ser...#nVocê ainda acha mesmo que pode ser a líder da Hyakkaryouran#nno lugar da Ayame?"
52080-141 = "Não é uma questão de poder ou não."
52080-142 = "Para proteger todo mundo, eu vou fazer isso.#n...Nem que seja só fingindo ser a Presidente, eu vou conseguir."
52080-146 = "Uau, que historinha mais bonita."
52080-147 = "Mas... não importa o quanto você fique forte, não consegue fazer o trabalho de duas pessoas, não é?"
52080-148 = "Quanto tempo será que você aguenta esse terror que nunca para de atacar?"
52080-159 = "Vamos lá, que tal abrirmos as cortinas de uma nova história? Ihihi!"
