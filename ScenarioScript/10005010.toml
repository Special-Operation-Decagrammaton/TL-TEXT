[translation]
10005010-1 = "Эпизод 1;Действовать с умом"
10005010-2 = "Два дня назад, на инструктаже."
10005010-5 = "Примерно тридцать семь часов назад первокурсница Куросаки Коюки, кодовое имя «Белый Кролик», сбежала из комнаты саморефлексии."
10005010-6 = "Она вышла из зоны действия сети наблюдения Семинара раньше, чем мы осознали ситуацию."
10005010-7 = "О боже, опять она?"
10005010-8 = "Она просто не даёт нам забыть о себе, да?"
10005010-9 = "Что на этот раз натворила наша местная преступница? Подделка оценок? Удаление записей учеников?"
10005010-10 = "...Выпуск несанкционированных облигаций."
10005010-11 = "И это ещё не всё — она выпускает их от имени Семинара."
10005010-12 = "Если мои расчёты верны — а они, конечно, верны, — через три дня мы обанкротимся."
10005010-13 = ""
10005010-15 = ""
10005010-16 = "Вы понимаете всю серьёзность ситуации?"
10005010-17 = "Ой-ой."
10005010-18 = "Пока что это её лучшее выступление."
10005010-19 = "[s1] «...Белый Кролик?»\n[s2] «Куросаки Коюки?»"
10005010-20 = "Эм."
10005010-21 = "Эм."
10005010-22 = "Прошу прощения. Не думаю, что вы раньше слышали это имя. Позвольте объяснить."
10005010-24 = ""
10005010-25 = "Операции по задержанию девушки по имени Куросаки Коюки проводились не раз. Кодовое имя: «Белый Кролик»."
10005010-26 = "Когда-то она была связана с Семинаром, а теперь стала его крупнейшей головной болью и известной угрозой в Миллениуме."
10005010-27 = "Она создаёт проблемы или проблемы сами её находят? Она — воплощённый хаос, совершенно неуправляемая."
10005010-28 = ""
10005010-30 = "Сенсей спрашивает, как ей всё это сходит с рук?"
10005010-31 = "Это..."
10005010-32 = "У неё особая склонность к этому. Можно сказать, дар."
10005010-33 = "Её способность быстро и точно производить математические расчёты пугает."
10005010-34 = "Для неё наши шифры и системы безопасности — детская игра."
10005010-35 = "Проще говоря, она использует математический талант, чтобы взломать любой пароль на пути."
10005010-36 = "Менять пароли бессмысленно. Она всё равно проскочит через них, словно их нет."
10005010-37 = "Разве не впечатляет? Она взламывает наши лучшие системы безопасности быстрее компьютера."
10005010-38 = "*вздох* Изначально мы приняли её в Семинар именно из-за её поразительных способностей."
10005010-39 = "Кто бы мог подумать, что вместо этого она станет такой занозой у тебя в боку, как сама любит говорить. Хи-хи."
10005010-40 = "Скорее огромной гильотиной, висящей у меня над головой."
10005010-41 = "Если бы не её связи с Семинаром, она уже гнила бы в Исправительном бюро."
10005010-42 = "Но учитывая объём конфиденциальной информации, которую она накопила, я не могу просто отправить её туда."
10005010-43 = "...В любом случае, следуйте обычной процедуре."
10005010-44 = "Конечно. Как всегда, C&C к вашим услугам."
10005010-45 = "Чтобы было ясно, других вариантов у меня просто нет."
10005010-46 = "Главная проблема в том, что автоматоны и дроны исключены."
10005010-47 = "Вот эта деталь меня особенно удивила. Почему?"
10005010-48 = "Пусть её вычислительные способности и невероятны, боевые навыки далеко не столь хороши. Разве дрон не справился бы с ней быстро?"
10005010-49 = "Видите ли..."
10005010-50 = "Белый Кролик сбежала туда, куда мы не можем просто отправить автоматонов."
10005010-51 = "Она вообще покинула Миллениум и D.U. и ушла в район другой школы."
10005010-52 = "[s3] «В район другой школы?»\n[s4] «Она не в Миллениуме?»"
10005010-53 = "Она сбежала в Морскую академию «Одиссея». Их школа расположена на целой флотилии кораблей."
10005010-54 = "Она сбежала в Морскую академию «Одиссея». Их школа расположена на целой флотилии кораблей."
10005010-55 = "Точнее, на корабль под названием «Золотое руно»."
10005010-56 = "У нас с Одиссеей хорошие отношения, поэтому я даже отправила личный запрос..."
10005010-57 = "По моей информации, «Золотое руно» — старый корабль, который они практически бросили умирать."
10005010-58 = "Она не говорит, что делает там и почему сбежала, лишь утверждает, что заработает деньги по-своему."
10005010-59 = "О боже... Похоже, проблемный ребёнок забрался на проблемное судно."
10005010-60 = "Чего она вообще пытается добиться выпуском фальшивых облигаций? Переворота?"
10005010-61 = "Это было моим главным опасением. Если она решила перейти от мелких преступлений к настоящему восстанию..."
10005010-62 = "Причём финансировать его облигациями от имени Семинара!"
10005010-63 = "Уф, кажется, головная боль возвращается."
10005010-64 = "В любом случае, пусть «Золотое руно» и заброшено, это всё ещё корабль Одиссеи."
10005010-65 = "Если отправим за ней дрон, нарушим правила."
10005010-66 = "А, значит..."
10005010-67 = "Теперь вам нужны агенты. Хи-хи."
10005010-68 = "...Я бы хотела подчеркнуть: нам нужны ТАЙНЫЕ агенты."
10005010-69 = "Ага... ха-ха..."
10005010-70 = "Вот и весь инструктаж. Ожидаю, что C&C будет действовать в соответствии с серьёзностью ситуации."
10005010-71 = "Вы не можете провалить это, хорошо? В этот раз я уже не смогу вам помочь."
10005010-72 = "Никаких позывных, никакой формы. Мы просто обычные гражданские прохожие."
10005010-73 = "Обычные гражданские, которых на этой миссии не поймают. Не. Поймают."
10005010-74 = "Это не наша школа, поэтому каждое ваше действие будет иметь последствия. Так что тихо! Не попадайтесь! Я уже говорила «тихо»?"
10005010-75 = "Действуйте с умом! Пожалуйста..."
10005010-77 = "Хм... С умом..."
10005010-78 = "[s5] «...Тогда что будем делать дальше?»\n[s6] «У меня чувство, что у тебя уже есть план.»"
10005010-79 = "Хи-хи. Как всегда проницательны, Сенсей."
10005010-80 = "Хи-хи. Как всегда проницательны, Сенсей."
10005010-81 = "Для начала устроим базу операций."
10005010-82 = "Найдём пустую каюту на палубе и оборудуем временную базу."
10005010-83 = "Потом тихонько прокрадёмся в системный кабинет, отключим наблюдение, найдём Белого Кролика и затем..."
10005010-84 = "Эй! Кто там?"
10005010-85 = "...?!"
10005010-86 = "...!"
10005010-87 = "...?"
10005010-88 = ""
10005010-90 = ""
10005010-93 = ""
10005010-94 = "Почему вы в машинном отделении? Немедленно назовитесь!"
10005010-95 = "А?! А вы сами почему не представитесь?"
10005010-96 = "И вообще, что на вас такое надето?"
10005010-97 = "...? В смысле?"
10005010-98 = "Это ВЫ одеты в неразрешённую форму!"
10005010-99 = "Это не форма пассажирской школы и не одежда охраны."
10005010-100 = "Это форма горничной? Её запретили целую вечность назад!"
10005010-101 = "Я определила вас как подозрительную угрозу. Советую сотрудничать."
10005010-102 = "Все сюда! Здесь какие-то странные..."
10005010-103 = "...!"
10005010-104 = ""
10005010-106 = ""
10005010-113 = "...Хрргх?!"
10005010-114 = ""
10005010-116 = ""
10005010-118 = "Ах!"
10005010-119 = "Что ж. Нельзя отрицать, действуешь ты быстро."
10005010-120 = "А казначей Семинара столько раз просила нас не попадаться..."
10005010-121 = "Аха-ха! Похоже, это мы уже провалили!"
10005010-122 = "П-Подождите, это... Эм...!"
10005010-123 = "Сенсей, послушайте! Это была не моя вина!"
10005010-124 = "[s7] «Думаю, этого нельзя было избежать.»\n[s8] «Наверное, всё ещё будет нормально... да?»"
10005010-125 = "П-Правда?! Вы так думаете?"
10005010-126 = "П-Правда?! Вы так думаете?"
10005010-127 = "Эм, то есть да! Я согласна!"
10005010-128 = "Ахахаха!"
10005010-129 = "Всё по плану! Ха-ха-ха!"
10005010-130 = "Кто-нибудь ещё это слышал?"
10005010-131 = "Нарушители! Нарушители в машинном отделении!"
10005010-132 = ""
10005010-135 = ""
10005010-136 = "..."
10005010-137 = "..."
10005010-139 = ""
10005010-141 = ""
10005010-143 = "Пора бежать!"
