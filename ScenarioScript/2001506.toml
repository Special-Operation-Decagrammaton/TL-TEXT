[translation]
2001506-1 = "Из девочки в леди"
2001506-2 = "О, Сенсей! Сюда!"
2001506-3 = "[s1] «Я пришёл так быстро, как смог.»\n[s2] «Ты сказала, случилось что-то важное?»"
2001506-4 = "Хорошо, Сенсей. Обещайте, что не будете слишком удивляться."
2001506-5 = "Хорошо, Сенсей. Обещайте, что не будете слишком удивляться."
2001506-6 = "По сведениям из сверхсекретного источника, сегодня в 15:00 в Супермаркете..."
2001506-7 = "[s] «В Супермаркете...?»"
2001506-8 = "Будут продавать новые лимитированные наборы карт «Мушикуин»! Невероятно, правда?!"
2001506-9 = "[s] «А? Лимитированные?»"
2001506-10 = "Мы не можем упустить такую золотую возможность! Я копила всё карманное пособие ради этого момента!"
2001506-11 = "[s] «Каэдэ? Это и есть то самое важное событие, о котором ты говорила?»"
2001506-12 = "Конечно, Сенсей! Это главное событие года!"
2001506-13 = "Вы вообще представляете, насколько изменилась мета «Мушикуин», когда вышел прошлый лимитированный набор?!"
2001506-14 = "[s] «...Эм.»"
2001506-15 = "Вы должны мне помочь, Сенсей!"
2001506-16 = "За лимитированные товары всегда идёт жестокая борьба. Мне немного страшно идти одной."
2001506-17 = "Пожалуйста!"
2001506-18 = "Кроме того, я уверена, где-то глубоко внутри вас... пылает неукротимая душа бойца «Мушикуин»! Разве вы не хотите испытать нашу дружбу в огне карточной битвы?"
2001506-19 = "[s3] «Нет. И никогда не хотел.»\n[s4] «Если это просто поход за покупками, я пойду с тобой.»"
2001506-20 = "Ну... Вы ещё передумаете!"
2001506-21 = "Ну... Вы ещё передумаете!"
2001506-22 = "Будет здорово работать вместе!"
2001506-23 = "Мы идеальный дуэт!"
2001506-24 = "Хи-хи! Когда мы доберёмся до финального босса и вам придётся трагически пожертвовать собой..."
2001506-25 = "Я смогу пробудиться и победить босса!"
2001506-26 = "[s] «А почему жертвовать должны именно мной?»"
2001506-27 = "Ладно, Сенсей! Вперёд!"
2001506-28 = "Каэдэ потащила меня в Супермаркет."
2001506-31 = "Быстрее! Скорее, Сенсей! Пока всё не распродали!"
2001506-32 = ""
2001506-34 = ""
2001506-35 = "Ох... О нет... Плохие новости..."
2001506-36 = "Хм? Что случилось?"
2001506-37 = ""
2001506-39 = ""
2001506-41 = "О боже... Почему именно сегодня?!"
2001506-43 = "..."
2001506-44 = "[s] «Каэдэ? Почему ты остановилась?»"
2001506-45 = "Там... Там кому-то нужна помощь!"
2001506-46 = ""
2001506-48 = ""
2001506-50 = "Вон они!"
2001506-51 = "А? Чем вам помочь, мисс?"
2001506-52 = "Я Каэдэ из Клуба внутренней дисциплины! Всё в порядке?"
2001506-53 = "Ну... Я потеряла контактную линзу."
2001506-54 = "[s] «О, ей и правда нужна помощь.»"
2001506-55 = "Да... Но всё нормально. Не хочу вас беспокоить. Наверняка вы заняты."
2001506-56 = "Да, мы очень заняты! Лимитированный набор «Мушикуин» чрезвычайно важен."
2001506-57 = "Мушикуин...?"
2001506-58 = "Да! Но всё равно!"
2001506-59 = "[s] «Настоящая леди никогда не бросит человека в беде. Правда, Каэдэ?»"
2001506-60 = "Да! Вы правы, Сенсей! Моя цель — стать настоящей леди, поэтому я вам помогу!"
2001506-61 = "О... Большое спасибо!"
2001506-63 = "Через несколько мгновений."
2001506-65 = "Спасибо! Благодаря вам я снова вижу!"
2001506-66 = "[s] «Кто бы мог подумать, что линзу утащила ворона...»"
2001506-67 = "Я рада, что мы её нашли!"
2001506-68 = "Как мне вас отблагодарить? Можно дать вам свою визитку?"
2001506-69 = "У нас нет времени, Сенсей! Распродажа вот-вот начнётся!"
2001506-70 = "Нам пора! Пока-пока! И больше не давайте этой вороне таскать ваши вещи, хорошо?!"
2001506-71 = ""
2001506-72 = "[s] «П-Подожди, Каэдэ. Стой! Эм... До свидания!»"
2001506-73 = ""
2001506-76 = "А? Пока?"
2001506-78 = "Добраться до Супермаркета оказалось непросто..."
2001506-79 = "О, Поппи! Нет! Стой! Кто-нибудь, помогите поймать мою собаку!"
2001506-80 = "Эй! Стой на месте!"
2001506-81 = "О! Большое спасибо!"
2001506-82 = "Пустяки для динамичного дуэта: Сенсея и меня, бойца «Мушикуин»!"
2001506-84 = "О! Студенты Валькирии ещё не приехали! Таймер бомбы заканчивается! Какой провод резать?!"
2001506-85 = "А-а-а!!! Не знаю! Красный!"
2001506-86 = "*щелк*"
2001506-88 = "Не уверена, будет ли продаваться наш новый напиток..."
2001506-89 = ""
2001506-90 = "*глоток* Вкусно! Одобрено!"
2001506-92 = "О, этот пончик..."
2001506-93 = ""
2001506-94 = "Мягкий и вкусный!"
2001506-96 = "Мы провели бесчисленное количество спасательных операций и помогли множеству людей..."
2001506-99 = "*тяжело дышит* Наконец-то мы здесь!"
2001506-100 = "[s] «Хорошая работа, Каэдэ.»"
2001506-101 = "Мы успели! Набор мой!"
2001506-102 = "Здравствуйте! Один набор карт, пожалуйста!"
2001506-103 = "Ого! Вам очень повезло. У меня остался ровно один набор."
2001506-104 = "ОГО! Наконец-то! Смотрите, Сенсей! Как блестит! Красиво, правда? В каждом наборе есть одна редкая карта!"
2001506-105 = "[s] «Ты выглядишь такой счастливой, Каэдэ.»"
2001506-106 = "А? Неважно! Сенсей, нам надо идти собирать колоду!"
2001506-107 = "А? В-Всё распродано?!"
2001506-108 = "А?"
2001506-110 = "Да... Простите. У нас больше ничего нет."
2001506-111 = "Но... я рано встала... четыре часа ехала на метро... и теперь всё распродано...?"
2001506-112 = "Сенсей... Этот ребёнок приехал издалека..."
2001506-113 = "[s] «Да... Четыре часа — это немало.»"
2001506-114 = "*всхлипывает*"
2001506-115 = "Эм... Эй! Не плачь!"
2001506-116 = "...А?"
2001506-117 = "Вот! Можешь взять мой набор «Мушикуин»!"
2001506-118 = "П-Правда? Ты отдашь его мне?"
2001506-119 = "[s] «Ты уверена, Каэдэ?»"
2001506-120 = "Всё нормально! Ты ведь приехала издалека именно ради него?"
2001506-121 = "В «Мушикуин» есть такая история!"
2001506-122 = "Какой бы тяжёлой ни была битва, если трудиться достаточно усердно, тебя ждёт награда! Таков путь «Мушикуин»!"
2001506-123 = "Ага! Я знаю! Это злодей сказал в 139-й серии «Мушикуин»!"
2001506-124 = "Вот видишь, понимаешь? Тогда забирай!"
2001506-125 = "Большое спасибо!"
2001506-126 = ""
2001506-129 = "[ns] «Каэдэ.»"
2001506-130 = "Хи-хи! Это ведь было очень по-ледийному, Сенсей?"
2001506-131 = "[s] «Да, самое по-ледийному из всего, что я видел!»"
2001506-132 = "Ура! Я рада!"
2001506-133 = "О! Вот вы где!"
2001506-134 = "Разве вы не та девушка, которая потеряла контактную линзу?"
2001506-135 = "Вообще-то я..."
2001506-136 = "[s] «Пиар-менеджер „Мушикуин“?!»"
2001506-137 = "А?! Пиар-менеджер?"
2001506-138 = "По дороге сюда я встретила ещё нескольких людей, которым вы помогли."
2001506-139 = "Вы не бросили людей в беде и специально остановились помочь им, хотя очень спешили..."
2001506-140 = "Именно в этом суть мышления настоящего бойца «Мушикуин»!"
2001506-141 = "[s] «...П-Правда?»"
2001506-142 = "Да! «Мушикуин» — идеальный пример для настоящей леди, Сенсей!"
2001506-143 = "Сегодня я увидела настоящего бойца «Мушикуин»... Настоящую леди! И у меня сразу появилось множество новых идей!"
2001506-144 = "...?"
2001506-145 = "Если вы не против, можно включить сегодняшние события в рекламный документальный фильм о «Мушикуин»?"
2001506-146 = "Название будет «Боец Мушикуин: настоящая леди»!"
2001506-147 = "Разумеется, я не прошу вас делать это бесплатно."
2001506-148 = ""
2001506-150 = ""
2001506-151 = "Поскольку мы будем использовать вашу историю в маркетинговых целях, я подарю вам двадцать лимитированных наборов карт «Мушикуин»!"
2001506-152 = "ЧЕГОООО?! Что мне делать, Сенсей? Я правда могу их принять?"
2001506-153 = "О... Если вы не хотите... Наверное, я могу предложить что-то другое..."
2001506-154 = "Н-Нет! Дело не в этом!"
2001506-155 = "Что мне делать, Сенсей?!"
2001506-156 = "[s5] «Ты это заслужила, Каэдэ. Ты так старалась.»\n[s6] «Помнишь? Ту серию „Мушикуин“.»"
2001506-157 = "А? О!"
2001506-158 = "А? О!"
2001506-159 = "«Если трудиться достаточно усердно, тебя ждёт награда!»"
2001506-160 = "Да!"
2001506-161 = "Это плоды всех моих усилий стать настоящей леди! Большое спасибо!"
2001506-162 = "Не за что!"
2001506-163 = "Когда вернёмся, надо потренироваться в боях с моими новыми наборами карт, Сенсей!"
2001506-164 = "Я не буду вам поддаваться, Сенсей! Приготовьтесь!"
2001506-165 = "[s] «Ладно! Давай!»"
2001506-167 = "Мы вернулись в комнату клуба и устроили несколько захватывающих сражений в «Мушикуин». На удивление, было весело."
2001506-169 = "Хорошо! Мой ход... Бросаю кубик..."
2001506-170 = "Ура! Выпала шестёрка! Теперь я могу взять карту..."
2001506-171 = ""
2001506-173 = ""
2001506-174 = "Мне выпал «Кролик с Бурильным Рогом — Ультимейт»! Это мой козырь!"
2001506-175 = "Сенсей, Сенсей! Это решающий момент! Я чувствую душу карты! Она говорит со мной!"
2001506-176 = "[s] «Правда...?»"
2001506-177 = "Хи-хи! Сейчас я станцую, чтобы призвать «Кролика с Бурильным Рогом — Ультимейт»!"
2001506-178 = "Хи-хи. Особый призыв Каэдэ: «Кролик с Бурильным Рогом — Ультимейт» с особым танцем призыва!"
2001506-179 = ""
2001506-181 = ""
2001506-182 = ""
2001506-183 = "А вот и уникальный навык «Кролика с Бурильным Рогом — Ультимейт»! Милота «Кролика с Бурильным Рогом — Ультимейт», усиленная моей милотой!"
2001506-184 = "Это увеличивает ATK «Кролика с Бурильным Рогом — Ультимейт» в десять раз!"
2001506-185 = "[s] «Игра правда так работает...?»"
2001506-186 = "Сенсей! Не расслабляйтесь! Мой ход ещё не закончен!"
2001506-187 = "Приготовьтесь! Начинаю!"
2001506-190 = "― Хи-хи.[wa:1120]"
2001506-192 = "― Кажется, сегодня столько всего произошло.[wa:1060]"
2001506-195 = "― Было суматошно, но...[wa:1400]"
2001506-197 = "― Благодаря вам я стала ещё на шаг ближе к настоящей леди![wa:1440]"
2001506-200 = "― Я очень вам благодарна, Сенсей![wa:910]"
2001506-202 = "― Спасибо, что всегда мне помогаете![wa:420]"
2001506-205 = "[ns7] «Ты заставляешь меня краснеть.»\n[ns8] «Когда понадобится моя помощь — я сразу примчусь.»"
2001506-206 = "― Правда?! Хорошо![wa:2400]"
2001506-207 = "― Правда?! Хорошо![wa:2400]"
2001506-209 = "― Тогда, раз уж так, я сейчас атакую вас, Сенсей![wa:3460]"
2001506-212 = "[ns] «У нас же был трогательный момент. И ты вот так просто меня атакуешь?»"
2001506-213 = "― Получайте![wa:960]"
2001506-215 = "― Буровой Удар «Кролика с Бурильным Рогом — Ультимейт»![wa:900]"
2001506-218 = "― Хи-хи-хи!"
2001506-222 = "Вот и всё! Я победила! Победная серия Каэдэ продолжается!"
2001506-223 = "Вот она, сила бойца «Мушикуин», Сенсей! Разве я не потрясающая?"
2001506-224 = "Может, я даже слишком сильная. Хи-хи!"
2001506-225 = "[s9] «Я столько раз играл и до сих пор не понимаю правил.»\n[s10] «Это уже можно назвать особой игрой Каэдэ.»"
2001506-226 = "Всё нормально, Сенсей!"
2001506-227 = "Вот это было бы круто, Сенсей!"
2001506-228 = "Я могу играть с вами снова и снова, пока вы не разберётесь!"
2001506-229 = "Хорошо, давайте ещё раз, Сенсей!"
2001506-231 = "Мы с Каэдэ продолжали играть до поздней ночи. И я продолжал проигрывать каждую партию."
