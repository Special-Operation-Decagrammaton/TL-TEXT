[translation]
10033055-3 = "*вздыхает* Ладно-ладно. Должна признать, мы, возможно, слегка увлеклись из-за возбуждения от поездки."
10033055-4 = "Если оглянуться назад, парфе из ванили и такояки с морским огурцом было немного безумным, да?"
10033055-6 = "Я рада, что всё решилось мирно. Но мне придётся составить отчёт на нелицензированный ларёк, прежде чем..."
10033055-7 = "(...?! Весь ларёк исчез без следа...?)"
10033055-8 = "[ns] «Что случилось, Умика?»"
10033055-9 = "Н-нет... Ничего..."
10033055-10 = "Давай скорее вернёмся к ресторану, Умика! Мы ведь уже отстаём от расписания, да?"
10033055-11 = "Ох! Мы ужасно опаздываем! Пина, Каэдэ, пожалуйста, соберите студентов здесь и отведите их к следующей точке. Я соберу тех, кто остался в ресторане."
10033055-12 = ""
10033055-14 = ""
10033055-16 = ""
10033055-17 = ""
10033055-18 = "(Я стараюсь мыслить позитивно, но Пина права...)"
10033055-19 = "(Я снова не смогла удержать нас в рамках маршрута... Снова!)"
