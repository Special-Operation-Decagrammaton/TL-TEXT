[translation]
32185-2 = "*вздох* Неужели это действительно шах и мат?"
32185-3 = "Почему? Почему именно так?"
32185-4 = "Сестринство даже не шелохнулось после смерти Сэи, а теперь вдруг решило вмешаться. Какая жестокая шутка."
32185-5 = "Я что-то упустила? Не заметила важную деталь?"
32185-6 = "Или всё потому, что я недооценила тебя, Ханако?"
32185-7 = "..."
32185-8 = "Нет. Урава Ханако исключительна, но в конечном счёте безобидна. Не было причин учитывать её больше, чем я уже учла."
32185-9 = "Может, дело в предательстве Азусы?"
32185-10 = "..."
32185-11 = "Нет. Она была всего лишь марионеткой. Осталась бы верной или нет — на исход это не повлияло."
32185-12 = "Может быть, Хифуми? Нет, она просто обычная девушка. А Кохару глупая, так что учитывать её тоже не было необходимости."
32185-13 = "Тогда почему? Почему я проиграла чему-то вроде Клуба дополнительных занятий?"
32185-14 = "Где всё пошло не так?"
32185-15 = "[s] «...»"
32185-16 = "А, понятно. Я упустила самую большую переменную."
32185-17 = "Именно вмешательство Шале и Сенсея стало причиной моего падения."
32185-18 = "Это должно было быть лишь мерой предосторожности. Наги устроила столько шума из-за какого-то предателя, и я подумала, что это хорошее решение... В тот момент моя судьба и была решена."
32185-19 = "Какая глупая ошибка."
32185-20 = "Похоже, здесь для меня всё и заканчивается."
32185-21 = "Мика, насчёт Сэи..."
32185-22 = "Как я уже сказала, убивать Сэю никто не собирался. Может, я и выгляжу злодейкой, но я не настолько злая."
32185-23 = "Это был несчастный случай. Сэя и без того была слабой, и..."
32185-24 = "Сэя жива, Мика!"
32185-25 = "...?!"
32185-26 = "Мы лишь сделали вид, что она умерла."
32185-27 = "Её тайно вывезли из Тринити и спрятали в безопасном месте... поскольку мы не смогли найти нападавшего."
32185-28 = "Сэя... не умерла?"
32185-29 = "Её раны ещё не до конца зажили, и она остаётся без сознания... но глава Рыцарей спасения продолжает о ней заботиться."
32185-30 = "Капитан Мине?"
32185-31 = "Да. А человеком, который спас Сэю, скорее всего, была..."
32185-32 = "..."
32185-33 = "Неважно. Думаю, лучше спроси её сама."
32185-34 = "Понятно. Значит, она жива..."
32185-35 = "Это прекрасная новость."
32185-36 = ""
32185-40 = ""
32185-41 = "Я сдаюсь. Вы победили."
32185-42 = "Поздравляю, Клуб дополнительных занятий, Сенсей... Вы это заслужили."
32185-43 = "А теперь делайте со мной что хотите."
32185-44 = "..."
32185-45 = "Ты ведь понимаешь, какие последствия будут у твоих действий, Азуса?"
32185-46 = "Конечно."
32185-47 = "Надеюсь, ты не думаешь, что Тринити станет тебя защищать."
32185-48 = "За тобой будут охотиться, куда бы ты ни убежала. Всегда."
32185-49 = "У тебя больше никогда не будет спокойного сна."
32185-50 = "От Саори не сбежать. Ты и сама прекрасно знаешь это как человек из Ариуса: et omnia vanitas..."
32185-51 = "Знаю. И всё равно буду бороться до самого конца — пока совсем не смогу."
32185-52 = ""
32185-54 = ""
32185-55 = "Что ж, хорошо."
32185-59 = ""
32185-60 = ""
32185-61 = "[ns] «Мика...»"
32185-62 = "Стой, Сенсей. Больше ни слова."
32185-63 = "Как я уже сказала, втянуть Шале было моей самой большой ошибкой."
32185-64 = "И всё же..."
32185-66 = "[ns] «Если я когда-нибудь понадоблюсь тебе, я буду рядом.»"
32185-68 = ""
32185-69 = "Услышать это от тебя сделало меня по-настоящему счастливой. Правда."
32185-70 = "Если бы я сделала другой выбор, тогда, возможно, мы..."
32185-71 = "Нет. Забудь."
32185-72 = "Прощай, Сенсей."
32185-73 = ""
32185-76 = ""
32185-79 = "Следующий эпизод;Третий экзамен"
