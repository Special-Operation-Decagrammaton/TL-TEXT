[translation]
32185-2 = "...O que é isso? Isso já perdeu a graça."
32185-3 = "...Por quê?"
32185-4 = "Vocês nem se mexeram quando a Seia-chan foi atacada... A Irmandade intervir justo agora só pode ser uma piada de muito mau gosto."
32185-5 = "...Onde foi que eu calculei errado?"
32185-6 = "...Será que foi por ter subestimado a Hanako-chan?"
32185-7 = "..."
32185-8 = "Não, eu sabia que a \"Urawa Hanako\" era alguém formidável. Mas, antes que eu percebesse, ela tinha se tornado inofensiva. A ponto de eu nem precisar calculá-la como uma variável."
32185-9 = "...Será que foi porque a Azusa-chan me traiu?"
32185-10 = "..."
32185-11 = "Não, a Azusa-chan era só uma marionete. Quer ela me traísse ou não, isso não mudava em nada o resultado que eu queria."
32185-12 = "...A Hifumi-chan é só uma garota comum, e a Koharu-chan é só uma bobinha, né? Nenhuma delas era alguém que pudesse se tornar uma variável."
32185-13 = "E mesmo assim, como foi que eu perdi...?"
32185-14 = "Onde foi que tudo começou a desandar...?"
32185-15 = "[s] \"...\""
32185-16 = "...Pensando bem, eu me esqueci da maior variável de todas, né?"
32185-17 = "O Sensei da Schale... É, tem razão. Pensando bem, com certeza eu já tinha perdido no momento em que trouxe você para cá."
32185-18 = "Como a Nagi-chan estava fazendo o maior alarde dizendo que havia um traidor, pensei \"fazer o quê, né?\", achei que calharia bem e entrei em contato com a \"Schale\"... Entendi, então foi naquela hora..."
32185-19 = "Nossa... eu sou um desastre mesmo..."
32185-20 = "Haa..."
32185-21 = "Mika-san, sobre a Seia-chan..."
32185-22 = "...Eu juro que não tinha a intenção de matá-la. Embora qualquer coisa que eu diga agora vá parecer só uma desculpa..."
32185-23 = "Provavelmente foi um acidente. A Seia-chan sempre teve a saúde frágil... e além disso..."
32185-24 = "...A Seia-chan está a salvo."
32185-25 = "...!?"
32185-26 = "Nós forjamos isso durante todo esse tempo."
32185-27 = "Como não havíamos encontrado o culpado pelo ataque, também por questões de segurança... ela está escondida fora da Trinity."
32185-28 = "A Seia-chan está... a salvo...?"
32185-29 = "Sim. Como os ferimentos ainda não cicatrizaram, ela ainda não acordou, mas... a capitã das Cavaleiras Socorristas está protegendo-a bem de perto neste exato momento."
32185-30 = "A Capitã Mine está...?"
32185-31 = "Sim. E quem salvou a Seia-chan naquela ocasião foi..."
32185-32 = "..."
32185-33 = "...Não, é melhor que você ouça isso diretamente da boca da própria pessoa."
32185-34 = "...Entendi. Então ela está viva..."
32185-35 = "...Que alívio..."
32185-41 = "...Eu me rendo. Eu perdi."
32185-42 = "Parabéns, Clube de Aulas de Reforço... e Sensei. Vou deixar a vitória para vocês."
32185-43 = "Já não me importo com mais nada, façam o que quiserem comigo também."
32185-44 = "..."
32185-45 = "...Azusa-chan. Você sabe bem o que está fazendo e o que vai acontecer daqui para frente como resultado disso, não sabe?"
32185-46 = "É claro."
32185-47 = "...Você acha mesmo que a Trinity vai te proteger?"
32185-48 = "Você vai ser caçada para sempre a partir de agora. Para sempre, não importa aonde vá."
32185-49 = "...Será que algum dia você vai conseguir dormir em paz?"
32185-50 = "...Além disso, acha mesmo que consegue fugir da Saori? Se você veio de Arius, é claro que sabe, né? Et omnia vanitas..."
32185-51 = "Sim, eu sei. Mesmo assim, vou lutar com todas as minhas forças até o fim, até o meu último instante."
32185-55 = "...É, entendi."
32185-61 = "[ns] \"Mika...\""
32185-62 = "Agora... eu não quero ouvir nada de você, Sensei..."
32185-63 = "No fim das contas, envolver a Schale foi mesmo o meu maior erro."
32185-64 = "É, mas..."
32185-66 = "[ns] \"É claro que também estou do seu lado, Mika.\""
32185-69 = "...Quando ouvi aquelas palavras, eu fiquei muito, muito feliz de verdade."
32185-70 = "Naquela hora, se..."
32185-71 = "...Não, deixa pra lá, não é nada."
32185-72 = "Tchauzinho, Sensei."
32185-79 = "Próximo;3º Exame Especial de Proficiência Acadêmica"
