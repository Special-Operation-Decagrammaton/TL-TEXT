[translation]
1013008-1 = "Щедрая старшая"
1013008-2 = ""
1013008-3 = "Привет, Субару! О, и Сенсей тоже!"
1013008-4 = "Привет. Надеюсь, у тебя всё хорошо."
1013008-5 = ""
1013008-7 = ""
1013008-8 = "О? Субару, разве это не..."
1013008-10 = "...легендарная кукурузная палочка? Та самая, с редким сезонным вкусом барбекю и сыра?"
1013008-11 = "Ч-Что?"
1013008-12 = "Ну, да..."
1013008-13 = ""
1013008-15 = ""
1013008-16 = "..."
1013008-17 = "Хочешь?"
1013008-18 = ""
1013008-20 = ""
1013008-21 = ""
1013008-22 = "Для меня... это будет честью!"
1013008-23 = "Ха-ха, хорошо. Вот, держи."
1013008-24 = "Правда? Отлично, спасибо!"
1013008-25 = ""
1013008-27 = ""
1013008-28 = "..."
1013008-29 = "(А я хотела оставить её на потом...)"
1013008-30 = "[s] «Ты в порядке, Субару?»"
1013008-31 = "А? Конечно. Ничего такого."
1013008-32 = "О, по моему лицу было видно обратное?"
1013008-33 = "Хватит так пялиться на моё лицо! Ты всё выдумываешь!"
1013008-35 = ""
1013008-36 = "Постой, сок со вкусом заварного крема?"
1013008-37 = "Заварной крем и так вкуснейший десерт. А они ещё и сок из него сделали? Ого."
1013008-38 = "Точно. И он приятно холодный."
1013008-39 = "..."
1013008-40 = "Эм... Субару...?"
1013008-41 = "Если можно... Можно мне глоточек?"
1013008-42 = "..."
1013008-43 = "Лучше забери целиком."
1013008-44 = "Ты уверена?!"
1013008-45 = "Абсолютно. Но постарайся поделиться с остальными, хорошо?"
1013008-46 = "Большое спасибо!"
1013008-47 = ""
1013008-49 = ""
1013008-50 = ""
1013008-51 = "(А его было непросто достать...)"
1013008-52 = "[s] «Ты точно в порядке...?»"
1013008-53 = "Что?!"
1013008-54 = "..."
1013008-55 = "Да, конечно. Как всегда."
1013008-57 = ""
1013008-58 = "Спасибо!"
1013008-59 = "Не за что."
1013008-60 = ""
1013008-61 = "Потрясающе! Ты лучшая, Субару!"
1013008-62 = "Д-Да ничего особенного. Наслаждайся."
1013008-64 = "Ради Субару я опущу подробности, но..."
1013008-65 = "Когда всё закончилось, Субару осталась практически с пустыми руками."
1013008-66 = ""
1013008-67 = "..."
1013008-68 = "[s] «...»"
1013008-69 = "..."
1013008-70 = "[s] «...»"
1013008-71 = "П-Почему ты так на меня смотришь...?"
1013008-72 = "[s] «Передо мной тебе не нужно изображать сильную.»"
1013008-73 = "Нет... Ты всё не так поняла."
1013008-74 = ""
1013008-76 = ""
1013008-77 = "Но всё же..."
1013008-78 = "Вот последнее угощение... Его немного жаль."
1013008-79 = "[s1] «Субару, ты не оставляешь мне выбора.» \n[s2] «Тебя придётся похитить.»"
1013008-82 = "...А?"
1013008-83 = ""
1013008-84 = "С-Сенсей? Что это за место...?"
1013008-85 = "А? «Сначала ешь, вопросы потом»?"
1013008-86 = "..."
1013008-87 = "А, понимаю, к чему всё идёт. Слушай, я не нуждаюсь в благотво—"
1013008-89 = "Вот ваш заказ. Не торопитесь и приятного аппетита."
1013008-90 = ""
1013008-92 = ""
1013008-93 = ""
1013008-94 = "[ns] «...Ты уверена?»"
1013008-95 = "К-Конечно! Я в порядке!"
1013008-96 = "Н-Но позволь спросить..."
1013008-97 = "...Ты... каким-то образом заказала... только мои любимые блюда...?"
1013008-98 = "[s3] «Мы же проводили время вместе, Субару!»\n[s4] «Когда ты была в Шале и всё попробовала!»"
1013008-101 = "!"
1013008-102 = "Э-Это очень трогательно."
1013008-104 = "Она дождалась, пока я отвернусь и ненадолго отвлекусь."
1013008-105 = ""
1013008-106 = ""
1013008-107 = ""
1013008-108 = "Небольшой кусочек еды исчез — я даже не заметила."
1013008-110 = "После этого меня на мгновение увлекло множество других вещей в кафе."
1013008-111 = ""
1013008-112 = ""
1013008-113 = ""
1013008-114 = "Еда исчезала кусочек за кусочком!"
1013008-115 = ""
1013008-116 = "[ns] «О, странно.»"
1013008-117 = "А? Что?"
1013008-118 = "[s] «Кажется, еда исчезает.»"
1013008-119 = "М-Может, ты сама съела немного и не заметила...?"
1013008-120 = "Мне стоит поработать над отговорками?"
1013008-121 = "Э-Это довольно хороший урок, Сенсей."
1013008-122 = "..."
1013008-123 = "Да, признаю! Это была я."
1013008-124 = "...Наверное, тебе не нравятся старшеклассницы, которые столько едят, да?"
1013008-125 = "[s] «...!»"
1013008-126 = ""
1013008-129 = "[ns5] «Вовсе нет! Вам всем нужно хорошо есть и расти!»\n[ns6] «Нет ничего лучше сытых студентов!»"
1013008-132 = "В-Вы правда так думаете?"
1013008-133 = "..."
1013008-134 = "Спаси... бо."
1013008-135 = "А? Кроме этого ты имеешь в виду... мне ещё над чем-то нужно поработать?"
1013008-136 = "Над тем, как я... удовлетворяю свои желания...?"
1013008-137 = "...Сенсей, ты ведь не ходишь и не говоришь подобные вещи всем остальным студентам, правда?"
1013008-138 = ""
1013008-140 = ""
1013008-141 = "Почему ты отводишь взгляд? Посмотри мне в глаза и скажи правду!"
1013008-143 = "Я уклонилась от её пронизывающего взгляда и намеренно потащила её гулять по городу."
1013008-144 = ""
1013008-145 = ""
1013008-146 = ""
1013008-147 = ""
1013008-148 = ""
1013008-149 = ""
1013008-150 = ""
1013008-151 = "[ns] «Ну как тебе?»"
1013008-152 = "...Наверное, у меня немного кружится голова."
1013008-153 = "Дело не в страхе перед неизвестным, скорее..."
1013008-154 = "...Просто всё это мне непривычно. А остальные, похоже, часто вот так непринуждённо гуляют."
1013008-155 = "Мне уже приходилось разрешать конфликты за пределами Ариуса... но это..."
1013008-156 = ""
1013008-158 = ""
1013008-159 = "Так называемая «светлая сторона» жизни..."
1013008-160 = "Понимаешь, я никогда раньше не делала ничего подобного..."
1013008-161 = "*ахает*"
1013008-162 = "Что это за музыка, Сенсей?!"
1013008-163 = "МЫ ВСЕ ДОЛЖНЫ УМЕРЕ-Е-ЕТЬ!!!"
1013008-165 = "Глаза Субару загорелись. Я отвела её в музыкальный магазин."
1013008-166 = ""
1013008-167 = "Тяжёлый... металл? Это такой жанр музыки?"
1013008-168 = "Нравится ли он мне? Эм, я даже не знаю, что сказать... Может быть..."
1013008-169 = "Он мощный!"
1013008-170 = "[ns] «Ещё бы!»"
1013008-171 = "Он энергичный, быстрый, будто переполнен жизнью, опасностью и острыми ощущениями!"
1013008-172 = "А больше всего мне нравится, что в тексте требуют утащить этот жестокий мир прямиком в ад!"
1013008-173 = "[ns] «Только не тащи его туда по-настоящему!»"
1013008-174 = ""
1013008-175 = "Ого. Это было потрясающе, Сенсей."
1013008-176 = "У меня до сих пор звенит в ушах и колотится сердце..."
1013008-177 = "А? Думаешь, у меня врождённая склонность к металлу? Возможно..."
1013008-178 = "Не уверена. Просто он меня зацепил, вот и всё."
1013008-179 = "...Особенно слова песен."
1013008-180 = "[s] «...Ты всё ещё хочешь, чтобы мир утащили в ад?»"
1013008-181 = "..."
1013008-182 = "Ну, даже не знаю."
1013008-183 = "С одной стороны, да, но, пожалуй, не всерьёз."
1013008-184 = "Но ты ведь говорил мне, что человеческое сердце никогда не бывает простым, верно?"
1013008-185 = "..."
1013008-186 = "Так что, возможно, я готова поверить, что этот мир всё ещё чего-то стоит. Если тебе есть что сказать в его защиту..."
1013008-187 = "[ns] «Ого! Вот это ответственность!»"
1013008-188 = "Вот как? Ты же взрослый!"
1013008-189 = "[s] «Взрослые не всезнающие.»"
1013008-190 = "Но ты столько всего мне показал, Сенсей."
1013008-191 = "[s] «Не могу сказать, что не показывал...»"
1013008-193 = "Мы болтали о всяких пустяках, пока я провожал её обратно."
