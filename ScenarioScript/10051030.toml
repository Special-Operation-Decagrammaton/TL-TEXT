[translation]
10051030-1 = "Эпизод 3;Встреча с талантом"
10051030-2 = "Комната Клуба Инь-Ян"
10051030-3 = "...И всё это произошло вчера?"
10051030-4 = "Эм... Да. К сожалению."
10051030-5 = "Такова жизнь. Тем не менее платье хорошо починили, и вы вернули его в отличном состоянии."
10051030-6 = "Но... и мне очень жаль Цукуё, платья большего размера у нас в запасе нет."
10051030-7 = "Эээ?!"
10051030-8 = "[s] «Может, сходим в магазин платьев?»"
10051030-9 = "Я уже связалась с ближайшими бутиками..."
10051030-10 = "...и мне сказали, что платье, которое подошло бы Цукуё, придётся... шить на заказ."
10051030-11 = "Тогда нужно скорее сделать заказ...!"
10051030-12 = "...Вы ведь понимаете, что мероприятие начинается через час?"
10051030-13 = "...А!"
10051030-14 = "Ну что ж, обстоятельства загнали нас в угол."
10051030-15 = "На данный момент у нас остаётся только один вариант."
10051030-16 = "Есть ещё вариант?"
10051030-17 = "Конечно."
10051030-18 = "Хотя... он может разбить девичье сердце..."
10051030-19 = "А...?"
10051030-21 = "Прошёл час."
10051030-22 = "Наконец миссия Клуба исследования ниндзюцу по охране началась."
10051030-24 = "Банкетный зал модного показа"
10051030-26 = "Народу и правда много. Я едва понимаю, что происходит..."
10051030-27 = "Ну-ну. Соберись, Мичиручи! Главное — миссия!"
10051030-28 = "Так, ага, ага. Сосредоточься. «Кружащаяся кукла», приём?"
10051030-29 = ""
10051030-31 = ""
10051030-32 = "Да! Изуна слышит вас великолепно, Президент!"
10051030-33 = "Пожалуйста, не забывай про кодовые имена. Твоё текущее местоположение?"
10051030-34 = "Ожидаю на восточной стороне банкетного зала, как и было приказано."
10051030-35 = "Хорошо, спасибо."
10051030-36 = ""
10051030-38 = ""
10051030-39 = "Итак, раз она на месте..."
10051030-40 = "...«Ожидающая беседка», приём?"
10051030-42 = "Главный вход в банкетный зал модного показа"
10051030-43 = ""
10051030-44 = "Да. Я слышу вас ясно..."
10051030-45 = "Я стою у главного входа... наблюдаю..."
10051030-46 = "П-Прости, Цукуё..."
10051030-47 = "Что отправили тебя туда одну..."
10051030-48 = "Мне правда жаль из-за дресс-кода и того, что тебе пришлось всё пропустить."
10051030-49 = "В-Вам не за что извиняться!"
10051030-50 = "Это моя вина, что я такая большая, внушительная и слишком крупная для того платья."
10051030-51 = "В-Вообще-то я... здесь даже чувствую себя удобнее. Я могу носить свою одежду."
10051030-52 = "Ты слишком хороша для нас, Цукуё..."
10051030-53 = "Ладно! Давайте сосредоточимся, а когда всё закончится, съедим по огромной миске рамена!"
10051030-54 = "И закончим видео! Разве не здорово?"
10051030-55 = "З-Звучит отлично, Президент!"
10051030-56 = "Толстая лапша, свиная грудинка, политая маслом чили..."
10051030-57 = "А?!"
10051030-58 = "Что происходит?!"
10051030-59 = "Президент! Шайнкэт здесь! Дизайнер!"
10051030-60 = ""
10051030-64 = ""
10051030-65 = ""
10051030-66 = ""
10051030-67 = "Так, орёл приземлился! То есть... кот! Всем по позициям!"
10051030-68 = "...Неплохо прозвучало, да?"
10051030-69 = ""
10051030-71 = ""
10051030-72 = "(Спокойно, спокойно...!)"
10051030-73 = "(Просто стой и наблюдай. Не веди себя неловко и не привлекай внимания. Никто сюда не пришёл смотреть на меня...)"
10051030-74 = ""
10051030-76 = ""
10051030-77 = ""
10051030-78 = ""
10051030-79 = "О тебе."
10051030-80 = "М-Мне?!"
10051030-81 = "Ты что здесь делаешь?"
10051030-82 = "Чт...?! Я-Я должна..."
10051030-83 = "Показ вот-вот начнётся, а ты просто бродишь снаружи? Ты даже не переодета! Что ты за модель такая?"
10051030-84 = "«Модель»... человека?"
10051030-85 = "Соберись, девочка! Хватит таращиться, быстро в гримёрку!"
10051030-86 = "Но я, я, я..."
10051030-88 = "...не модель!"
10051030-89 = ""
10051030-91 = ""
10051030-92 = ""
10051030-93 = "А? Не модель?"
10051030-94 = "А выглядишь именно так."
10051030-95 = "Эм... Я всего лишь о-охранник..."
10051030-96 = "Хм."
10051030-97 = "Прошу прощения. Не хотел показаться таким грубым."
10051030-98 = "Но... Хм..."
10051030-99 = ""
10051030-101 = ""
10051030-102 = ""
10051030-104 = ""
10051030-105 = "Какая жалость."
10051030-106 = "Работать в охране, имея такую фигуру, такой природный магнетизм..."
10051030-107 = "Что...?"
10051030-108 = "Н-Ничего. Не обращай внимания."
10051030-109 = "Всего лишь сожаление провидца..."
10051030-110 = "Ничто не говорит, что ты обязана идти по определённому пути... даже если ты гений."
10051030-111 = "И всё же... Хм..."
10051030-112 = "...?"
10051030-113 = "Жаль расставаться вот так."
10051030-114 = "Итак, девочка, почему бы тебе не назвать своё имя?"
10051030-115 = "Что?!"
10051030-116 = "Я-Я Оно Цукуё..."
10051030-117 = "Я из Клуба исследования ниндзюцу, и я..."
10051030-118 = "Достаточно. Твоё прошлое меня не интересует."
10051030-119 = "А вот будущее? Оно Цукуё... Я запомню это имя."
10051030-120 = "Так что и ты запомни моё."
10051030-121 = "Вот."
10051030-122 = "В-визитка...!"
10051030-123 = "Кстати об этом, у меня дела. Прошу меня извинить, Оно Цукуё."
10051030-124 = ""
10051030-126 = ""
10051030-127 = "(Ч-Что сейчас вообще произошло?!)"
10051030-128 = "(Почему такой человек, как Шайнкэт, спросил моё имя...? Да ещё и дал такую стильную визитку...?)"
10051030-129 = "(Что у него на уме?)"
10051030-130 = "(А-а...)"
10051030-131 = "(Нет-нет. Не будем об этом думать.)"
10051030-132 = "(Я здесь по работе...!)"
10051030-133 = "Ну что ж! Миссия Цукуё по наружной охране официально началась!"
10051030-135 = "Гримёрная модного показа"
10051030-136 = "Ну, как всё выглядит?"
10051030-137 = "Великолепно, Шайнкэт!"
10051030-138 = "И вы проследили, чтобы с моим платьем обращались аккуратно? Повесили как было? Климат-контроль?"
10051030-139 = "Эта вещь единственная в своём роде. Кутюр. Запасной нет."
10051030-140 = "Да! Оно аккуратно висит в этой комнате! У него отдельная стойка!"
10051030-141 = "И сюда не попадает прямой солнечный свет, а ещё работает идеальная система осушения и устранения запахов."
10051030-142 = "Хотите... сами его проверить?"
10051030-143 = "Разумеется."
10051030-144 = "Этим моделям лучше уже начинать переодеваться. Нам ещё нужно время на мелкие правки."
10051030-145 = "Так в какой комнате у нас гардероб, напомните?"
10051030-146 = "Я провожу вас."
10051030-147 = "Пожалуйста, следуйте за мной."
10051030-151 = "Итак, вот наша..."
10051030-152 = "Эм... Кто... Почему... замок не защёлкивается?"
10051030-153 = "Есть проблема?"
10051030-154 = "Н-Нет! Конечно нет!"
10051030-155 = "Оно должно быть здесь! Ваше платье! Ваша работа!"
10051030-156 = ""
10051030-158 = ""
10051030-159 = "Э-Э...! АААААА!"
10051030-160 = "Хм? Что случилось?"
10051030-161 = "Э-Э-Этого не может быть...!"
10051030-162 = "Sh-Sh-Шайнкэт..."
10051030-163 = "П-п-п-простите...!"
10051030-164 = "Так не должно быть! О нет, это ужасно!"
10051030-165 = "Что такое? Говорите!"
10051030-166 = "Н-Ну..."
10051030-167 = "Ваша вещь... ваша работа... ваше прекрасное платье..."
10051030-168 = "Нет, я, должно быть... с-снюсь себе...!"
10051030-169 = "Ты что, сломалась? С дороги!"
10051030-170 = ""
10051030-172 = ""
10051030-173 = "М-Моя работа...!"
10051030-174 = "Мой дизайн, моё платье... пропало?!"
10051030-175 = "Мне ужасно жаль. Оно было здесь буквально мгновение назад!"
10051030-176 = "Э-Эээ...!"
10051030-178 = "Найдите их и приведите ко мне НЕМЕДЛЕННО!"
10051030-179 = "Что?! Их?"
10051030-180 = "Что тут непонятного? Я говорю: НАЙДИТЕ вора и приведите его КО МНЕ!"
10051030-181 = "Если вы не поймаете этого жалкого грабителя, вы все уволены! ЭТО вам понятно?!"
10051030-182 = "И-Ик! Да!"
10051030-183 = ""
10051030-185 = ""
