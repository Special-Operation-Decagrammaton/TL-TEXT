[translation]
13040-1 = "Episódio 4;Aqueles Que Seguem Adiante"
13040-2 = "Snif, como é que eu fui acabar assim..."
13040-3 = "Como assim \"como\"? A culpa é sua por acreditar tão fácil nos outros."
13040-4 = "Mas é que...#nMe disseram que trabalhando 90 horas por semana eu ia ganhar um salário enorme..."
13040-5 = "Você tem que ser maluca pra achar que existe emprego decente num distrito autônomo decadente desses."
13040-6 = "Haha, impressionante que você tenha sobrevivido até hoje com essa cabeça.#nUsa um pouco o cérebro, pô!"
13040-7 = "E-E o dinheiro...?"
13040-8 = "É óbvio que nunca teve dinheiro nenhum, sua idiota!#nVocê é burra ou o quê?!"
13040-10 = "N-Não pode ser, e a dívida da escola...?!#nE se eu não voltar logo, minha caloura vai ficar preocupada..."
13040-12 = "Em vez de se preocupar com a escola, que tal se preocupar consigo mesma primeiro?"
13040-13 = "Afinal, nós tomamos conta deste prédio!"
13040-14 = "Não sei quem é essa caloura nem me importa,#nmas se tá achando que seus amiguinhos vão vir te salvar, pode esquec—"
13040-18 = "...Hã?"
13040-19 = "Tsc...#nQue tremor é esse... Um terremoto?"
13040-23 = "Saiam da frente!!"
13040-24 = "O quê...?!"
13040-25 = "Quem é essa pirralha?!"
13040-27 = "H-Hoshino-chan...?!"
13040-28 = "Eu procurei você por toda parte, Senpai!#nPor favor, não suma assim justo quando estamos tão ocupadas!"
13040-29 = "Vamos voltar logo!"
13040-31 = "Q-Que porra você pensa que tá fazendo, sua pirralha?!"
13040-32 = "Ei, entra em contato com o pessoal lá de baixo agora!#nDroga, aqueles inúteis tão dormindo ou o quê?!"
13040-34 = "Se está esperando reforços, não vem ninguém.#nOs caras lá de baixo, eu já derrubei todos."
13040-36 = "O quê?!"
13040-37 = "E-Ela deu conta de todo aquele pessoal sozinha...?!"
13040-46 = "Uaaaaah!"
13040-47 = "Guaaaaah?!"
13040-51 = "S-Snif... Que medo que eu passei, Hoshino-chan..."
13040-52 = "Caiu no golpe de adultos suspeitos de novo... Por favor, já está na hora de aprender, não acha?"
13040-53 = "Mas..."
13040-54 = "Cada vez mais gente vai embora, e o lugar virou um antro cheio de delinquentes..."
13040-55 = "Abydos hoje em dia é terra sem lei."
13040-56 = "Por favor, considere todo desconhecido como uma pessoa má."
13040-57 = "...Mas e se for alguém que realmente esteja precisando de ajuda?"
13040-58 = "Não existe gente assim!#nTodo mundo aqui não passa de um bando de bandidos!"
13040-59 = "Será que é assim mesmo...?"
13040-60 = "Mesmo que a gente estenda a mão, vão nos trair na primeira oportunidade!#nDesse jeito não vamos conseguir proteger a escola!"
13040-64 = "Senpai, ainda dá tempo de..."
13040-65 = "Hoshino-chan."
13040-66 = "...?"
13040-67 = "Não, Hoshino-chan.#nVocê está errada."
13040-72 = "Y-Yume-senpai...?"
13040-76 = "É algo muito importante, então escute bem."
13040-77 = "Err... Não acha que está um pouco perto demais...?"
13040-82 = "Suspeita, desconfiança, violência, mentiras...#nSe a gente passar a achar tudo isso normal,"
13040-83 = "um dia, nós mesmas vamos acabar nos perdendo."
13040-85 = "..."
13040-86 = "Mesmo que a gente recupere Abydos desse jeito,#nela não vai ser a Abydos com que sonhamos."
13040-87 = "Se um dia as pessoas voltarem para Abydos...#ne encontrarem uma cidade assim... eu ficaria muito triste."
13040-88 = "Por isso, Hoshino-chan.#nSe houver alguém em apuros, estenda a mão.#nSe alguém estiver com fome ou tremendo de frio, ajude essa pessoa."
13040-89 = "..."
13040-90 = "Não tenho certeza se consegui explicar direito, mas..."
13040-91 = "Se for você, Hoshino-chan, vai entender o que eu quero dizer, né?"
13040-95 = "...E se nos traírem por causa disso, o que fazemos?#nE se você acabar em perigo de novo, como hoje?"
13040-96 = "...Nessa hora, você vai vir me salvar, não vai, Hoshino-chan?"
13040-97 = "...Bom, eu vou, né."
13040-98 = "Fufu."
13040-99 = "D-Do que você está rindo?!"
13040-100 = "Hmm?#nEstava pensando em anotar o que você disse, Hoshino-chan, para nunca esquecer!"
13040-101 = "Hã?!"
13040-107 = "Ei, não escreve isso!#nAliás, que caderno estranho é esse?!"
13040-108 = "Já não está na hora de trocar por um novo?#nVocê não está mais no fundamental..."
13040-109 = "Ah, é mesmo, Yume-senpai.#nEu tive uma ótima ideia de plano..."
13040-110 = "Acho que com isso a segurança de Abydos também vai melhorar!"
13040-111 = "...Yume-senpai?"
13040-115 = "...Yume-senpai?"
13040-121 = "..."
13040-122 = "Yume-senpai..."
13040-123 = "..."
13040-124 = "......"
13040-125 = "O-Onde eu estou...?"
13040-126 = "......"
13040-127 = "Ah, é verdade..."
13040-135 = "...É mesmo."
13040-136 = "Eu tinha vindo fechar a sala do conselho estudantil..."
13040-137 = "Por quanto tempo será que eu dormi...?"
13040-138 = "..."
13040-139 = "Eu preciso fechar esta sala..."
13040-140 = "..."
13040-148 = "...Vou deixar para amanhã."
13040-149 = "Amanhã eu fecho sem falta...... Senpai."
13040-154 = "Ué, você é..."
13040-155 = "Estava esperando por você!#nVice-Presidente do Conselho Estudantil!"
13040-156 = "Hã... Eu?"
13040-157 = "Sim! Tenho algo para conversar com você!"
13040-158 = "...Conversar sobre o quê?"
13040-159 = "E-Eu... É verdade que eu sou ligada ao Grupo Nephthys."
13040-160 = "Não posso mudar esse fato, mas...#nmesmo assim, há algo que eu posso fazer!"
13040-161 = "Algo que você pode fazer...?"
13040-166 = "Vou usar este cartão dourado para quitar toda a dívida da escola!"
13040-172 = "E-Espera... O quê?#nCartão dourado...?"
13040-173 = "Ah, bem... Este é o meu cartão de crédito pessoal...#nCom ele, posso sacar fundos da Nephthys."
13040-174 = "...Escuta aqui, você pensou direito antes de falar isso?"
13040-175 = "...!!"
13040-176 = "Você entende mesmo o que significa pagar a dívida com esse cartão?"
13040-177 = "O-O que significa...?"
13040-178 = "Eu sei que você está falando por boa vontade.#nMas como acha que os outros vão enxergar isso?"
13040-179 = "Esse cartão pertence à Nephthys, não é?#nOu seja, quem teria pago a dívida da escola seria a Nephthys, não você."
13040-180 = "M-Mas eu..."
13040-181 = "Só porque você pode gastar à vontade, não quer dizer que esse dinheiro seja seu, mocinha."
13040-182 = "Você já ganhou dinheiro por conta própria alguma vez?#nNem que seja ajudando em casa."
13040-183 = "Isso..."
13040-184 = "É melhor pensar bem em quem realmente providenciou esse dinheiro."
13040-185 = "No instante em que você pagar a dívida com esse cartão,#na posse desta escola passará a ser da Nephthys. Pelo menos é assim que eles vão ver."
13040-186 = "E-Então..."
13040-187 = "Como é que se pode pagar a dívida de Abydos?"
13040-189 = "..."
13040-190 = "Pagando com dinheiro ganho como uma aluna de Abydos, ué."
13040-191 = "..."
13040-192 = "...Assim como você faz?"
13040-193 = "...Hã?"
13040-194 = "...Entendi.#nEu vou me preparar e voltar."
13040-195 = "E além disso, eu não sou \"mocinha\"."
13040-197 = "Meu nome é Nonomi, Hoshino-senpai."
13040-198 = "...Hã?"
13040-200 = "Então, até logo."
13040-204 = "Hein...?"
13040-207 = "S-Senpai?! Onde você está?!"
13040-215 = "Yume-senpai!#nEstou aqui! Senpai!!"
13040-216 = "Yume-senpai!!!"
13040-220 = "...!!"
13040-221 = "..."
13040-222 = "H-Hoshino-senpai..."
13040-226 = "............"
13040-227 = "...Ah, é você de novo."
13040-228 = "E-Err... V-Você está bem...?"
13040-229 = "..."
13040-230 = "Quem disse que você podia entrar?#nAlunas do fundamental não são bem-vindas aqui."
13040-231 = "É que eu ouvi um grito..."
13040-232 = "...E além disso, já me formei, então não sou mais do fundamental."
13040-233 = "Foi decidido que eu vou ingressar numa escola parceira da Nephthys.#nA Academia Ferroviária Highlander...#nOs documentos de matrícula já devem estar chegando em casa."
13040-234 = "Então é melhor você ir logo para lá.#nEm vez de ficar perdendo tempo num lugar como este."
13040-235 = "...Sim.#nPor isso, eu queria dar uma última olhada neste lugar."
13040-239 = "Aí, quando eu estava no pátio, ouvi o grito..."
13040-240 = "E-Eu definitivamente não sou nenhuma perseguidora nem nada do tipo!"
13040-241 = "...Entendi."
13040-242 = "Então dê uma olhada rápida e vá para casa."
13040-243 = "...Eu soube."
13040-247 = "Sobre o desaparecimento da Presidente do Conselho Estudantil...#nO nome dela era Yume-san... não era?"
13040-251 = "Alguns dizem que ela fugiu porque havia problemas demais, mas..."
13040-252 = "Era para ser confidencial, mas chegou aos meus ouvidos.#nA presidente não desapareceu, na verdade..."
13040-256 = "E quem a encontrou primeiro foi..."
13040-257 = "M-Me desculpe!#nTrazer um assunto desses à tona na sua frente, Senpai..."
13040-258 = "Tudo bem, não precisa se preocupar com isso."
13040-259 = "Err..."
13040-260 = "Você parou de ir ao deserto...?"
13040-261 = "Mesmo depois que encontraram a presidente, você continuou indo ao deserto porque estava..."
13040-262 = "Estava procurando alguma coisa, não estava...?"
13040-267 = "P-Por falar nisso, aqui é a sala do conselho estudantil de Abydos, né?#nAntes estava trancada, mas..."
13040-268 = "Por acaso você está procurando algo?"
13040-269 = "...Eu já vou indo."
13040-274 = "Ah! E-Espera, Senpai!"
13040-280 = "Cof, cof... Quanta poeira..."
13040-281 = "...Faz muito tempo que ninguém limpa por aqui.#nE eu não tenho ânimo de fazer isso sozinha.#nCuidado aí... o piso está bem desgastado."
13040-282 = "Na verdade, o prédio anexo nunca foi tão bem cuidado assim."
13040-283 = "...Sim, eu também ouvi dizer.#nQue o prédio principal, o mais antigo de Kivotos, já foi soterrado pelo deserto..."
13040-284 = "É verdade.#nO prédio de quando eu entrei na escola também já está enterrado na areia."
13040-285 = "Vocês se mudaram para cá logo depois que você entrou na escola, Hoshino-senpai, não foi?"
13040-286 = "...Você sabe bastante, hein?"
13040-287 = "...Bem, um pouco.#nMesmo sendo um anexo, até que a estrutura daqui é bem equipada."
13040-288 = "Olha, a secretaria do festival escolar... Até essa sala existe aqui."
13040-290 = "\"Festival escolar\"... Será que é o Festival da Areia do Oásis?"
13040-294 = "Ei, não vai entrando assim..."
13040-296 = "Se for um festival, eu também tenho ótimas ideias!#nPor exemplo, criar um evento novo!"
13040-297 = "E também...#nQue tal um show de idols?"
13040-298 = "...Ué."
13040-299 = "...Não tem nada aqui."
13040-300 = "Claro que não.#nO Festival da Areia deixou de existir há muito tempo."
13040-301 = "...É verdade.#nVocê tem razão..."
13040-302 = "Aaah..."
13040-306 = "...Afinal, por que você veio aqui?"
13040-307 = "Hã? Para ser idol com a Senpai..."
13040-308 = "Não estou falando disso. Estou perguntando por que está me seguindo."
13040-309 = "E você nem é desta escola para ficar me chamando de Senpai."
13040-310 = "Academia Ferroviária Highlander, né?#nNão ia se matricular lá?"
13040-311 = "B-Bem, é que..."
13040-312 = "...Acho que, se eu for para lá assim, vou me arrepender para sempre."
13040-313 = "Por quê?#nNão é uma escola que tem contatos com a Nephthys?"
13040-314 = "Sim. Com certeza vão me receber com um tratamento maravilhoso.#nAcho que eu até conseguiria me tornar presidente do conselho estudantil..."
13040-315 = "Nossa, presidente do conselho estudantil?#nE não é ótimo?"
13040-316 = "..."
13040-317 = "...Bom, eu entendo que você também tem seus motivos, mocinha."
13040-318 = "Mas vir para cá só vai te fazer se arrepender do mesmo jeito.#nO que você vai fazer numa escola que não tem nada?"
13040-319 = "Mocinh— quer dizer, Nonomi-chan, você ainda é muito jovem.#nÉ melhor escutar direitinho o que o velhote aqui está dizendo."
13040-320 = "(Velhote...?)"
13040-321 = "Como assim \"velhote\"...?#nAcho que a nossa diferença de idade não é quase nenhuma..."
13040-322 = "Você é do fundamental, não é?"
13040-323 = "Eu já me formei, viu..."
13040-324 = "Ah, tanto faz."
13040-333 = "Como não temos muito tempo, vou explicar de forma resumida sobre a Academia Ferroviária Highlander!"
13040-335 = "Highlander é uma academia especializada na gestão de ferrovias e na educação voltada para essa área.#nElas administram parte das linhas ferroviárias de Kivotos,#ne também conduzem vários outros empreendimentos."
13040-336 = "A Academia Ferroviária Highlander não possui um distrito autônomo próprio.#nEm vez disso, as próprias linhas férreas que elas administram cumprem o papel de distrito autônomo."
13040-337 = "É mesmo um formato bem incomum, né."
13040-338 = "Sim...#nE como aquela supervisora comentou,#nparece ser verdade que há algum tipo de atrito entre os setores internos."
13040-339 = "O órgão administrativo responsável pela manutenção das ferrovias e o órgão de segurança são independentes.#nO grupo que cuida da administração da academia é o Centro de Controle Central... mais conhecido como \"CCC\"."
13040-340 = "Tipo o conselho estudantil de Highlander?"
13040-342 = "Sim, parece que aquelas gêmeas são membros do conselho estudantil."
13040-347 = "Já a Suou Asagiri-san, que apareceu por último,#nparece ser uma supervisora enviada pelo conselho diretor para manter o CCC sob controle..."
13040-348 = "Parecia que estavam se vigiando mutuamente,#nmas ainda não sabemos nada com certeza..."
13040-350 = "Isso é tudo o que sabemos sobre a Academia Ferroviária Highlander até agora."
13040-354 = "Ué...?"
13040-359 = "Hã...?"
13040-360 = "Q-Quem será...?#nFaz tanto tempo que essa campainha não..."
13040-362 = "Chegamos~."
13040-363 = "Somos do CCC de Highlander, dá pra abrir logo?#n...Ué, ninguém nem responde.#nHikari, manda ver naquela lá."
13040-364 = "Técnica secreta da jogadora Hikari: toca-campainha de 16 toques por segundo~."
13040-373 = "Hããã?!"
13040-374 = "Q-Qual é a dessas duas?!"
13040-375 = "Uhee~, é aquele ditado, falando no diabo...#nMas não achei que fossem aparecer tão rápido."
13040-378 = "...Não compliquem as coisas. Se vão sair da frente, saiam logo."
13040-382 = "Ooooh~?"
13040-383 = "Não empurra!"
13040-384 = "...Com licença.#nSou Suou Asagiri, Supervisora de Gestão."
13040-385 = "...Podem ficar tranquilas, não vim aqui para brigar.#nContudo, meu tempo é limitado.#nPoderiam abrir a porta o mais rápido possível?"
13040-387 = "O-O que fazemos...?"
13040-388 = "...Vamos deixar elas entrarem, né.#nTambém seria um problema se quebrassem a campainha."
13040-390 = "Próximo;Ferrovia Transdesértica"
