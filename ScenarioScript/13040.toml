[translation]
13040-1 = "Эпизод 4;То, чего больше нет"
13040-2 = "Уа-а-а. Как так вышло?"
13040-3 = "Хи-хи-хи. Разве не очевидно? Наивная доверчивая душа..."
13040-4 = "Н-Но...! Вы мне сказали...! Сказали, что будет 90 часов стабильной работы в неделю и за это хорошо заплатят!"
13040-5 = "Ты правда думала, что в разваливающемся районе вроде Абидоса есть стабильная работа? Ха!"
13040-6 = "Здесь хватаешь любую работу, которая подвернётся."
13040-7 = "Н-Но мне ведь всё равно должны заплатить?"
13040-8 = "Ха-ха-ха! Ну ты даёшь!"
13040-10 = "Но... Мне нужно получить деньги! Нужно заработать много, чтобы выплачивать долг школы! А если моя младшая узнает об этом, она ужасно разволнуется и—"
13040-12 = "Ты сейчас переживаешь вообще не о том."
13040-13 = "Теперь ты наша пленница! Каждый сантиметр этого здания забит нашими вооружёнными до зубов людьми! Никто тебя не спасёт, милашка!"
13040-14 = "Так что—"
13040-15 = ""
13040-17 = ""
13040-18 = "...А?"
13040-19 = "З-Землетрясение? Всё здание..."
13040-20 = ""
13040-23 = "Мерзкие ублюдки!"
13040-24 = "У-Уа-а-а?!"
13040-25 = "Ч-Что за?!"
13040-26 = ""
13040-27 = "Х-Хошино...?"
13040-28 = "Серьёзно! Обязательно исчезать именно когда у меня и так куча дел? Ты знаешь, сколько времени ушло, чтобы тебя найти?!"
13040-29 = "У нас работа. Пошли!"
13040-31 = "Д-Думаешь, просто возьмёшь и уйдёшь отсюда?"
13040-32 = "Эй! Немедленно остановите эту мелкую!"
13040-34 = "Ты к кому обращаешься? Если только у тебя нет ещё сообщников на потолке, весь мусор я уже вынесла."
13040-36 = "К-Как такое возможно?"
13040-37 = "Ты сделала это одна?! Ты что, сверхчеловек?"
13040-38 = ""
13040-40 = ""
13040-46 = "А-А-а-а!"
13040-47 = "Кха-а-а!"
13040-51 = "У-Уа-а-а! Я так испугалась! Хошино-о-о!"
13040-52 = "Можешь перестать попадаться на удочку очевидно мутных взрослых?"
13040-53 = "Но..."
13040-54 = "Сколько раз повторять? В Абидосе больше нет ни правил, ни приличий. Когда жители ушли, районы превратились в трущобы, кишащие преступниками."
13040-55 = "Абидос — мусорная свалка Кивотоса для сомнительных и нежелательных типов."
13040-56 = "Так что если не знаешь человека — просто считай его плохим!"
13040-57 = "Н-Но вдруг он не плохой? Вдруг ему правда нужна помощь?"
13040-58 = "Это фантазия! В Абидосе остались только преступники с плохими намерениями!"
13040-59 = "Эм... Но..."
13040-60 = "Никаких «но»! Попробуешь кому-то помочь — тебя используют раньше, чем успеешь моргнуть. Единственный способ защитить школу — подозревать всех и каждого."
13040-61 = ""
13040-63 = ""
13040-64 = "Вот почему я и говорю, тебе нужно быть более—"
13040-65 = "Хошино."
13040-66 = "...?"
13040-67 = "То, как ты говоришь... Это неправильно, Хошино."
13040-68 = ""
13040-70 = ""
13040-71 = ""
13040-72 = "Ю-Юмэ...?"
13040-73 = ""
13040-75 = ""
13040-76 = "Это о-о-очень важно, так что, пожалуйста, слушай внимательно, Хошино."
13040-77 = "П-Постой, не обязательно говорить мне это так близко!"
13040-78 = ""
13040-80 = ""
13040-82 = "Хошино, нельзя прожить жизнь, подозревая каждого встречного. Считать насилие и ложь нормой... принимать их как должное..."
13040-83 = "Если так делать, однажды мы проснёмся и поймём, что сами стали теми, кого ненавидим больше всего."
13040-84 = ""
13040-85 = "..."
13040-86 = "Ты права. Может, твоими методами мы и спасём Абидос. Но это уже будет не наш Абидос."
13040-87 = "Я не вынесу мысли, что Абидос станет синонимом лжи и насилия. От этого мне... грустно."
13040-88 = "Знаю, тебе это кажется глупым, но я надеюсь, что мы всегда сможем протянуть руку тем, кому нужна помощь, особенно в такие времена. Можем дать еду голодным и одежду тем, кто мёрзнет..."
13040-89 = "..."
13040-90 = "Я глупенькая, так что не знаю, правильно ли всё объясняю..."
13040-91 = "Но думаю, если это ты, то поймёшь, что я пытаюсь сказать."
13040-92 = ""
13040-94 = ""
13040-95 = "Нет! Вот именно об этом я и говорю! Твоя нелепая невинность постоянно втягивает тебя в неприятности! А если доверие к людям снова приведёт к ситуации вроде сегодняшней?!"
13040-96 = "Если так случится, ты ведь снова придёшь меня спасать?"
13040-97 = "...Ну да."
13040-98 = "Хи-хи-хи."
13040-99 = "Ч-Чего ты хихикаешь?!"
13040-100 = "Хорошо! Я это запишу, чтобы мы никогда не забыли этот разговор! «Сегодня Хошино сказала...»"
13040-101 = "Что?!"
13040-102 = ""
13040-106 = ""
13040-107 = "П-Прекрати сейчас же! Ненавижу, когда ты достаёшь эту тетрадь! И опять же, что за дизайн?! Эй?! Я сказала, хватит писать!"
13040-108 = "Пожалуйста... хотя бы заведи другую тетрадь... Мы уже не в начальной школе..."
13040-109 = "Знаешь что, забудь про тетрадь. Я хотела обсудить с тобой один план, Юмэ."
13040-110 = "Если всё получится, думаю, Абидос станет хотя бы немного безопаснее..."
13040-111 = "...Юмэ?"
13040-112 = ""
13040-114 = ""
13040-115 = "Юмэ?!"
13040-116 = ""
13040-121 = "..."
13040-122 = "Юмэ..."
13040-123 = "..."
13040-124 = "..."
13040-125 = "Э-Это место..."
13040-126 = "..."
13040-127 = "О-Ой..."
13040-128 = ""
13040-135 = "Точно. Я отвлеклась."
13040-136 = "Я пришла запереть... комнату студсовета Абидоса..."
13040-137 = "Кажется, опять уснула..."
13040-138 = "..."
13040-139 = "Мне просто нужно запереть её, да...?"
13040-140 = "*вздыхает*"
13040-141 = ""
13040-143 = ""
13040-148 = "Спешить некуда. Сделаю завтра."
13040-149 = "Да, завтра. Точно..."
13040-150 = ""
13040-151 = ""
13040-153 = ""
13040-154 = "...Ты."
13040-155 = "Я вас ждала, вице-президент!"
13040-156 = "...Для меня? Почему?"
13040-157 = "Я хочу кое-что вам сказать!"
13040-158 = "Вот как? Хорошо... Говори."
13040-159 = "В-Вы правы. Я из Нефтис Group."
13040-160 = "Н-Но я не думаю, что это должно мешать мне помогать Абидосу, если я хочу!"
13040-161 = "Помогать Абидосу...?"
13040-162 = ""
13040-164 = ""
13040-166 = "Я полностью погашу долг школы! Вот этой золотой картой!"
13040-167 = ""
13040-170 = ""
13040-171 = ""
13040-172 = "Эм... постой... Что? Золотой картой...?"
13040-173 = "Технически это моя личная кредитная карта... Ну, её финансирует Нефтис, но я вроде как могу ей пользоваться..."
13040-174 = "Не думаешь, что ведёшь себя слишком высокомерно, мелкая?"
13040-175 = "...!!"
13040-176 = "Если ты погасишь долг школы этой картой, значит, отныне школа будет принадлежать тебе. В этом твоя цель?"
13040-177 = "Ч-Что?! Нет! Конечно нет! Я... Я просто хотела помочь. Мне ничего не нужно в собственность..."
13040-178 = "Так это не работает. Может, злого умысла у тебя и нет, но ты слишком наивна."
13040-179 = "Эту карту финансирует Нефтис, так что формально она принадлежит им. Если расплатишься ей, получится, что наш долг погасила Нефтис."
13040-180 = "Я-я..."
13040-181 = "То, что ты тратишь эти деньги, ещё не делает их твоими, мелкая."
13040-182 = "Скажи, ты хоть палец в жизни о палец ударила? Работала? Стирала? Стол протирала?"
13040-183 = "Н-Ну..."
13040-184 = "Вот тебе жизненный урок. Деньги принадлежат тому, кто их заработал. А не привилегированной наследнице, которая тратит их не задумываясь."
13040-185 = "Если хочешь передать эту школу Нефтис — пожалуйста, погаси наш долг своей модной карточкой."
13040-186 = "Что ж..."
13040-187 = "Что мне делать? Как я могу помочь выплачивать долг Абидоса?"
13040-189 = "..."
13040-190 = "Если правда хочешь, можешь найти работу и помогать с выплатами. Как студент Абидоса."
13040-191 = "..."
13040-192 = "Хорошо. Я поняла. Как и вы, да?"
13040-193 = "Ч-что?!"
13040-194 = "Я вернусь раньше, чем вы заметите, хорошо? Только сначала улажу несколько дел!"
13040-195 = "А... И меня зовут не «мелкая»..."
13040-197 = "Я Нономи... Старшекурсница Хошино!"
13040-198 = "Ч-Что...?"
13040-200 = "Прошу прощения!"
13040-201 = ""
13040-203 = ""
13040-204 = "Ч-что?!"
13040-207 = "Юмэ?! Где ты?!"
13040-208 = ""
13040-215 = "Юмэ! Я здесь! Юмэ!"
13040-216 = "Юмэ!!!"
13040-217 = ""
13040-220 = "...!!"
13040-221 = "..."
13040-222 = "Х-Хошино?"
13040-223 = ""
13040-225 = ""
13040-226 = "..."
13040-227 = "А. Это всего лишь ты."
13040-228 = "П-Прости, что разбудила... Ты... в порядке?"
13040-229 = "..."
13040-230 = "Среднешкольницам не стоит совать нос куда не следует. Это всё-таки старшая школа."
13040-231 = "Я... услышала, как кто-то кричал."
13040-232 = "И вообще-то я уже официально выпустилась, так что больше не среднешкольница."
13040-233 = "Меня приняли в Железнодорожную академию Хайлендер. У них договор о сотрудничестве с Нефтис... Думаю, мои документы сейчас оформляют."
13040-234 = "Поздравляю. Рада за тебя. А теперь кыш. Иди наслаждайся своей модной новой школой."
13040-235 = "Я надеялась... Хотела в последний раз осмотреть район Абидоса перед отъездом."
13040-236 = ""
13040-238 = ""
13040-239 = "Я не преследовала вас или что-то такое! Просто проходила мимо школы..."
13040-240 = "...Но услышала чей-то крик и пришла проверить."
13040-241 = "Понятно."
13040-242 = "Ну и наслаждайся. Хорошей прощальной прогулки, мелкая из Нефтис."
13040-243 = "Эм, я слышала новости..."
13040-244 = ""
13040-246 = ""
13040-247 = "Председатель студсовета пропала? Её звали Юмэ?"
13040-248 = ""
13040-250 = ""
13040-251 = "Ходит много слухов... Что председатель была легкомысленной и плохо справлялась со школой, что она бросила вице-президента..."
13040-252 = "Но я посмотрела закрытые документы. Председатель не пропала, а... Ну..."
13040-253 = ""
13040-255 = ""
13040-256 = "Я прочитала, что человек, давший свидетельские показания..."
13040-257 = "П-Простите! Мне не следовало лезть. Разговоры ничего не изменят."
13040-258 = "Да ладно, здесь всё равно только мы."
13040-259 = "Ты..."
13040-260 = "Ты перестала искать? То, что было в пустыне?"
13040-261 = "Ты продолжала, верно? Даже после того, как председателя нашли, ты всё равно искала в пустыне."
13040-262 = "Что ты искала?"
13040-263 = ""
13040-265 = ""
13040-266 = ""
13040-267 = "И это комната студсовета Абидоса, да? Здесь уже всё упаковано..."
13040-268 = "Но ты специально взломала опечатанную дверь... Не могу отделаться от мысли, что искала что-то. Нашла?"
13040-269 = "Пойдёмте."
13040-270 = ""
13040-273 = ""
13040-274 = "А? П-Подождите меня!"
13040-275 = ""
13040-277 = ""
13040-280 = "*кашель* *кашель* Здесь так пыльно..."
13040-281 = "Я тут одна, знаешь ли. У нас нет уборщиков. Песок испортил полы и почти всё остальное."
13040-282 = "Нас загнали в этот корпус после того, как остальные здания мумифицировало опустынивание Абидоса. Не самые современные условия."
13040-283 = "Я читала историю. Когда главное здание Абидоса поглотила пустыня, это считалось трагедией, ведь когда-то этот район был старейшим и самым прославленным во всём Кивотосе."
13040-284 = "Хорошо подготовилась. Даже здания, которыми мы пользовались на моём первом курсе, уже давно нет."
13040-285 = "Да... Кажется, вы поступили в школу, а вскоре после этого пришлось переехать сюда?"
13040-286 = "...Кажется, ты подготовилась даже слишком хорошо."
13040-287 = "Мне была интересна история! Несмотря на то что это пристройка, здесь всё ещё есть всё необходимое для занятий— Хм?"
13040-288 = "Что это за класс, Хошино? «Штаб школьного фестиваля»? Я не видела его ни на планах, ни в документации."
13040-290 = "О! Может, это связано с Фестивалем оазиса?"
13040-291 = ""
13040-294 = "Эй! Не врывайся просто так—"
13040-296 = "У меня отличная идея! Можно оживить школу и вернуть посетителей весёлыми мероприятиями вроде Фестиваля оазиса!"
13040-297 = "Ага-ага! Можно устроить милое выступление айдолов! ♧"
13040-298 = "О."
13040-299 = "...Пусто."
13040-300 = "Ну да. Фестиваля оазиса уже много лет нет."
13040-301 = "Вы... совершенно правы. Кажется, я немного увлеклась."
13040-302 = "*вздыхает*"
13040-303 = ""
13040-305 = ""
13040-306 = "Эй. Зачем ты здесь?"
13040-307 = "Хм? Ну, я подумала, что выступление айдолов могло бы—"
13040-308 = "Нет, не в этой комнате. Почему ты вообще всё время за мной ходишь, мелкая из Нефтис?"
13040-309 = "У меня есть дела, а развлекать среднешкольницу в планы не входило. Так зачем ты являешься сюда со своими вопросами и идеями?"
13040-310 = "Ты ведь уже зарегистрирована и готовишься поступать в Хайлендер, верно?"
13040-311 = "Я просто..."
13040-312 = "В глубине души чувствую, что если выберу Хайлендер, буду жалеть об этом всю жизнь."
13040-313 = "Разве они не сотрудничают с Нефтис? Для тебя звучит как роскошная жизнь."
13040-314 = "Вы не ошибаетесь... Наверное, ко мне будут хорошо относиться, даже назначат председателем студсовета..."
13040-315 = "Модная должность для модной девочки, да?"
13040-316 = "..."
13040-317 = "...Слушай. Я понимаю. У тебя свои обстоятельства и переживания."
13040-318 = "Но оглянись. Здесь ровно один студент. В этом печальном старом городе-призраке нет ничего привлекательного."
13040-319 = "У тебя впереди светлое будущее, Нономи. Так что послушай совет старушки, ладно?"
13040-320 = "(Старушки...?)"
13040-321 = "Вы не настолько старше меня, Хошино..."
13040-322 = "Что значит «не настолько», мелкая среднешкольница? Нас целые классы разделяют."
13040-323 = "Технически я уже выпустилась..."
13040-324 = "Да одно и то же."
13040-325 = ""
13040-327 = ""
13040-330 = ""
13040-331 = ""
13040-332 = ""
13040-333 = "Кратко расскажу о Железнодорожной академии Хайлендер! Сейчас время особенно ценно."
13040-335 = "Академия обслуживает железные дороги по всему Кивотосу. Некоторые линии в городе она даже напрямую владеет и управляет ими, плюс ведёт несколько коммерческих проектов."
13040-336 = "От других академий она отличается тем, что не принадлежит какому-то одному району. Железнодорожные линии выступают границами районов, которыми управляют отдельные фракции."
13040-337 = "То есть все эти точки и линии — разные районы? Необычно — это мягко сказано."
13040-338 = "Да, а постоянная борьба за влияние над железнодорожными районами создаёт сложную политическую структуру, о которой и говорила надзиратель."
13040-339 = "Секретариат и служба безопасности отвечают за содержание и управление железными дорогами... а Центральный центр управления ведёт административные дела академии."
13040-340 = "То есть CCC можно считать чем-то вроде студсовета Хайлендер."
13040-341 = ""
13040-342 = "Именно, Сэрика. Близняшки, с которыми нам не повезло встретиться, — офицеры CCC. Иными словами, члены студсовета."
13040-343 = ""
13040-345 = ""
13040-346 = ""
13040-347 = "А Асагири Суо, надзиратель, работает на совет директоров. Её главная задача — держать CCC под контролем."
13040-348 = "Похоже, Суо не лгала, когда сказала, что они с близняшками не союзники, но... опять же, всё довольно сложно."
13040-349 = ""
13040-350 = "На этом мой краткий доклад о Железнодорожной академии Хайлендер окончен."
13040-351 = ""
13040-354 = "А?"
13040-355 = ""
13040-359 = "Э-Это дверной звонок?!"
13040-360 = "Мы поставили его для посетителей, но это первый раз, когда в него вообще позвонили!"
13040-362 = "Привет-привет."
13040-363 = "Это мы! CCC Хайлендер. Алло-о-о! Хикари, не переставай звонить. Мы пришли! Впустите нас!"
13040-364 = "Принято... Приготовьтесь к фирменному комбо Хикари: шестнадцать звонков за одну секунду и побег...!"
13040-365 = ""
13040-367 = ""
13040-368 = ""
