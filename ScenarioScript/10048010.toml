[translation]
10048010-1 = "Эпизод 1;Облачно, местами товары"
10048010-2 = "[log]Двумя часами ранее...[/log]"
10048010-4 = "Главные ворота Академии искусств Вайлдхант"
10048010-5 = "В Академии искусств Вайлдхант вот-вот должна была открыться специальная выставка «Вероника»."
10048010-6 = "На ней собирались представить изысканные произведения искусства, принадлежащие компании «Вероника», производителю предметов роскоши."
10048010-7 = "Меня вызвали в Вайлдхант, чтобы выполнить обычную бумажную и административную работу, необходимую для этого мероприятия."
10048010-8 = "И, разумеется, на входе уже шёл досмотр."
10048010-9 = ""
10048010-10 = ""
10048010-11 = "Если хотите закончить побыстрее, положите открытую сумку в лоток и поднимите руки над головой."
10048010-12 = "У меня только краски. Это правда необходимо?"
10048010-13 = "Правила обновились. Напитки с кофеином теперь запрещены."
10048010-14 = "И при чём тут это? Это краска! В художественной академии!"
10048010-15 = "...Вы могли смешать с краской кофеин в высокой концентрации."
10048010-16 = "О, конечно."
10048010-17 = "...Нет! Постойте, что вы вообще несёте?! Кто станет пить краску?!"
10048010-18 = "Давным-давно был один художник, который это делал..."
10048010-19 = "Зачем кому-то...? Да ещё при ТАКИХ ценах?!"
10048010-20 = "Хватит! Это особое распоряжение капитана Совета префектов! Прошу подчиниться!"
10048010-21 = "К-капитана Совета префектов?!"
10048010-22 = "Если это её приказ, похоже, выбора у меня нет..."
10048010-23 = ""
10048010-25 = ""
10048010-26 = "Посмотрим... Эта краска..."
10048010-27 = "Все эти марки разрешены. И все упаковки новые, не вскрытые."
10048010-28 = "Хорошо. Проходите."
10048010-29 = ""
10048010-31 = ""
10048010-32 = ""
10048010-33 = "Теперь СЛЕДУЮЩИЙ. Проходите через... А?"
10048010-34 = "О, вы ведь Сенсей из Шале?"
10048010-35 = "[s] «Здравствуйте. Похоже, вы усердно работаете.»"
10048010-36 = "Ха-ха. Да. Дел хватает."
10048010-37 = "Но у нас приказ сверху..."
10048010-38 = "Итак, вы позволите провести досмотр?"
10048010-39 = "[s] «Конечно. Иди.»"
10048010-40 = "Тогда я осмотрю содержимое вашей сумки."
10048010-41 = ""
10048010-43 = ""
10048010-44 = "...А!"
10048010-45 = "[s] «Есть проблема...?»"
10048010-46 = "Сенсей, мне придётся конфисковать эту керамическую кружку."
10048010-47 = "Сейчас пронос любой керамики извне на территорию академии запрещён."
10048010-48 = "[s] «Зачем?!»"
10048010-49 = "В прошлом месяце мы нашли несколько упаковок запрещённого пигмента, спрятанных внутри керамики."
10048010-50 = "[s] «...»"
10048010-52 = "И строгий досмотр продолжился."
10048010-54 = "Всё готово."
10048010-55 = "Перед уходом подойдите сюда, и мы вернём конфискованные вещи."
10048010-56 = "С возвращением в Вайлдхант, Сенсей."
10048010-57 = "[s] «Ага, спасибо. Хорошая работа.»"
10048010-59 = "Я вошёл на территорию Вайлдханта. И всего через час..."
10048010-60 = "...закончил свои дела."
10048010-62 = "Парк Вайлдханта"
10048010-64 = "Закончив работу, я прогуливался по территории академии и наткнулся на свободную площадку."
10048010-65 = "До главных ворот ещё было далеко идти..."
10048010-66 = "[ns] «Может, немного отдохнуть здесь.»"
10048010-67 = "И как только я собирался сесть на скамейку..."
10048010-68 = "Эй! Эй! Осторожно!"
10048010-69 = "[ns] «Что?»"
10048010-71 = "Я увидел, как с неба что-то падает."
10048010-72 = "Оно было круглым, зелёным и, к несчастью, большим..."
10048010-74 = "[ns] «...Тюк?»"
10048010-78 = "А потом я потерял сознание."
10048010-79 = ""
10048010-80 = "[ns] «...Так вот как я здесь оказался.»"
10048010-81 = "В-вы помните?"
10048010-82 = "Мы перенесли вас без сознания обратно в наше общежитие."
10048010-83 = "[s] «Но... что именно в меня попало...?»"
10048010-84 = "А, ну..."
10048010-85 = "...Всего лишь немного... контрабанды."
10048010-86 = "[s] «Контрабанды?!»"
10048010-87 = "Да. Моя подруга перебросила её через стены академии с помощью катапульты."
10048010-88 = "[s] «Катапульты?»"
10048010-89 = "Вы просто случайно оказались в месте приземления... и вас задело..."
10048010-90 = "У-у-у... Простите..."
10048010-91 = "От лица Картеля свободной торговли приношу искренние извинения..."
10048010-92 = "Я никогда не хотела представлять НАСИЛЬСТВЕННЫЙ клуб..."
10048010-93 = "[s] «Всё нормально. Я почти не пострадал.»"
10048010-94 = "В общем, моя подруга, Фую..."
10048010-95 = "Я говорила ей не использовать катапульту... Я знала, что так может случиться."
10048010-97 = "Да ладно, другого способа не было."
10048010-100 = ""
10048010-101 = "Когда вы пришли?"
10048010-102 = "Для катапульты была очень веская, законная и необходимая причина, Президент."
10048010-103 = "Ладно. Я готова выслушать твою чушь."
10048010-104 = "Ха, отлично. Потому что причина..."
10048010-106 = "Это было круто!"
10048010-107 = "...Пожалуйста, больше ничего не говори."
10048010-108 = "Почему?!"
10048010-109 = "А ты как думаешь?! Из-за твоей катапульты пострадал человек!"
10048010-110 = "Я положила в мешок кучу мягкой набивки! Он был отлично защищён."
10048010-111 = "Да... чтобы защитить товар! Не делай вид, будто беспокоилась, что он может в кого-то попасть!"
10048010-112 = "[s] «Эм, пожалуйста, успокойтесь все...»"
10048010-113 = ""
10048010-115 = ""
10048010-116 = "О, Сенсей уже очнулся! Отлично."
10048010-117 = "Ты пытаешься сменить тему?!"
10048010-118 = "Рада знакомству, Сенсей. Я Вакаса Фую, менеджер по продажам Картеля свободной торговли. А ещё... немного занимаюсь технологиями."
10048010-119 = "Менеджер по продажам? Я никогда не давала тебе такой должности..."
10048010-120 = ""
10048010-122 = ""
10048010-123 = "Я захватила для вас мазь из медпункта. Просто нанесите её прямо на ушиб."
10048010-124 = "И вот моя визитка, прошу."
10048010-125 = "Когда ты успела сделать визитки?!"
10048010-126 = "У каждой уважающей себя деловой женщины должна быть визитка."
10048010-127 = "Эм... Ты ведь понимаешь, что наш клуб НЕЗАКОННЫЙ? То есть... буквально нарушает закон?"
10048010-128 = "Ага, и управляешь им ты."
10048010-129 = "Я! Никогда! Не хотела! Быть президентом!"
10048010-130 = "Не кипятись так, Президент. Всё ведь хорошо закончилось, правда?"
10048010-131 = "И всё же признаю, что мы... доставили Сенсею неудобства."
10048010-132 = "Так что, если вам понадобится небольшая... «помощь», мы бесплатно вас проконсультируем."
10048010-133 = "Как ты можешь заниматься бизнесом в такой момент...?"
10048010-134 = "[ns1] «Для начала у меня есть вопрос...»\n[ns2] «Чем именно занимается Картель свободной торговли...?»"
10048010-137 = "Прекрасный вопрос, Сенсей."
10048010-138 = "Позвольте объяснить весь процесс шаг за шагом."
10048010-139 = "«Шаг за шагом»...?! Мы ввозим запрещённую контрабанду и продаём её."
10048010-140 = "Уверена, вы поняли необходимость нашего бизнеса уже в тот момент, когда вошли в Вайлдхант, Сенсей."
10048010-141 = "Фую? Ты меня игнорируешь?"
10048010-142 = "Вы, как и все студенты, подвергаетесь необоснованным, строгим, постоянным и навязчивым досмотрам, основанным на случайных прихотях."
10048010-143 = "У студентов Вайлдханта есть потребности. Мы художницы! Нас нельзя ограничивать, особенно таким произвольным и капризным списком запретов."
10048010-144 = "И вот тут в дело вступает Картель."
10048010-145 = "Мы помогаем студенту получить нужную вещь и берём небольшую комиссию за услугу... цену свободы."
10048010-146 = "И уверяю вас: наши комиссии ОЧЕНЬ разумные."
10048010-147 = "Мы предоставляем... свободу обменивать деньги на необходимые вещи. Отсюда и название — «Картель свободной торговли»."
10048010-148 = "[s] «Но вы нарушаете правила...!»"
10048010-149 = "Фуфу, понимаю, почему вы можете так считать."
10048010-150 = "У меня есть предложение, Сенсей."
10048010-151 = "Как насчёт того, чтобы провести с нами немного времени и оценить деятельность нашего клуба?"
10048010-152 = "А после этого вы сможете воспользоваться своей безграничной мудростью и САМИ решить, действительно ли то, что мы делаем, плохо — независимо от того, что академия велит вам думать."
10048010-153 = "Как вам? Не хотите немного понаблюдать за нашей работой? Провести, так сказать, компетентный аудит?"
10048010-154 = "[s3] «Если позволите, то да.»\n[s4] «Мне и самому любопытно.»"
10048010-157 = "Ты согласна, Президент?"
10048010-158 = "Что бы ни думали мы с Сенсеем, власть здесь у тебя."
10048010-159 = "..."
10048010-160 = "...Да. Я хочу, чтобы Сенсей увидел всё таким, какое оно есть на самом деле."
10048010-161 = "Хорошо, тогда..."
10048010-162 = ""
10048010-164 = ""
10048010-165 = ""
10048010-167 = ""
10048010-168 = "Миё! Я всё закопала!"
10048010-169 = ""
10048010-171 = ""
10048010-172 = "[ns] «...Закопала что?»"
10048010-173 = ""
