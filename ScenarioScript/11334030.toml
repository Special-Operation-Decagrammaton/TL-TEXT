[translation]
11334030-1 = "Состояние;Групповой гипноз 1"
11334030-4 = "Я пришла. Я последняя...?"
11334030-5 = "Чт...?! Ч-Что происходит?! Почему все лежат на полу?!"
11334030-6 = "Б-Больше не могу... пожалуйста... Нет..."
11334030-7 = "Я будто полностью опустошена. Иначе и не описать."
11334030-8 = "Ой-ой..."
11334030-9 = "Этих двоих я ещё могу понять, но ты тоже, Айри?! Что здесь произошло?!"
11334030-10 = "...Как грубо, даже не стараясь."
11334030-11 = "А-ха-ха..."
11334030-12 = "Можешь дальше нас подначивать, а можешь попробовать проявить хоть немного великодушия."
11334030-13 = "Есть в тебе хоть капля такого великодушия, юная леди? Или ты пришла только посмеяться над чужими страданиями?"
11334030-14 = ""
11334030-16 = ""
11334030-17 = "*вздыхает*"
11334030-18 = "Я так и думала, что к этому моменту все уже дойдут до предела. Уф, но я не ожидала, что всё будет настолько плохо..."
11334030-19 = ""
11334030-21 = ""
11334030-22 = "...Может, быстренько прервёмся на перекус?"
11334030-23 = "*ахает*"
11334030-24 = "Казуса...!"
11334030-25 = "О-о-о!! Что это? Хорошая идея? Не думала, что ты на такое способна!!"
11334030-27 = "О, так ТЕПЕРЬ ты решила меня похвалить."
11334030-28 = "Хм... Вообще-то..."
11334030-29 = "Может, это скорее..."
11334030-30 = "А? Казуса?"
11334030-31 = "Н-Неважно, забудь."
11334030-32 = "..."
11334030-34 = "Это может неплохо поднять боевой дух..."
