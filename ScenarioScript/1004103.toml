[translation]
1004103-1 = "Неуправляемое тело"
1004103-2 = "..."
1004103-3 = "[s] «...»"
1004103-4 = "Почему это постоянно случается? Я не собиралась с вами встречаться."
1004103-5 = "[s] «Ты никогда не собираешься.»"
1004103-6 = "Не могу спорить. Чего вы хотите?"
1004103-7 = "[s] «Ничего особенного, но...»"
1004103-8 = "Хорошо. Пока."
1004103-9 = "[s] «П-Постойте!»"
1004103-10 = "Вы неисправимо настойчивы."
1004103-11 = "[s] «Я хотел немного сблизиться с тобой.»"
1004103-12 = "Зачем?"
1004103-13 = "[s] «Связь между людьми очень важна.»"
1004103-14 = "Не согласна."
1004103-15 = "Люди — просто потерпевшие кораблекрушение, запертые на изолированных островах под названием наши тела."
1004103-16 = "Каждый рождается один и каждый умирает один."
1004103-17 = "Любые связи между этими моментами — лишь иллюзии."
1004103-18 = "[s] «Тебе кто-нибудь говорил, что ты немного цинична?»"
1004103-19 = "..."
1004103-20 = "*вздыхает*"
1004103-21 = "Как скажешь."
1004103-22 = "Ладно. Что хотите делать?"
1004103-23 = "[s] «Эм... О, может, подышим свежим воздухом?»"
1004103-24 = "..."
1004103-25 = "Считайте, что я выполняю приказ."
1004103-27 = "..."
1004103-28 = "[s] «Цветы.»"
1004103-29 = "Да, цветы."
1004103-30 = "[s] «Река.»"
1004103-31 = "Это река."
1004103-32 = "[s] «Эм... Ну...»"
1004103-33 = "..."
1004103-34 = "Вот и всё. Ничего глубже. Река и цветы."
1004103-35 = "[s] «Если ты так это видишь...»"
1004103-36 = "Можем уйти? *шмыгает носом* Я пришла только потому, что вы приказали."
1004103-37 = "[s] «Почему ты всегда носишь маску?»"
1004103-38 = "Без причины. *шмыгает носом*"
1004103-39 = "[s1] «Ты даже на прогулке не снимаешь маску?»\n[s2] «Она же сводит на нет весь смысл свежего воздуха.»"
1004103-40 = "Я-я... Постойте... Это... Н-Не подходите... ближе... Ах..."
1004103-41 = "Я-я... Постойте... Это... Н-Не подходите... ближе... Ах..."
1004103-42 = "А-А-Ах..."
1004103-43 = "А-А-А! Что...? Почему?"
1004103-44 = "[s] «...?!»"
1004103-45 = "А-А-А! Что...? Почему?"
1004103-46 = "Ааапчхи!"
1004103-47 = "Апчхи, ааапчхи!"
1004103-48 = "[s] «...»"
1004103-49 = "Уф... Пыльца..."
1004103-50 = "[s] «Мисаки... У тебя...»"
1004103-51 = "Послушайте. У м-меня аллергия, ясно?"
1004103-52 = "[s] «Нет, дело не в этом. У тебя нос течёт.»"
1004103-53 = "А?"
1004103-54 = "Аааааа?!"
1004103-55 = "Мне нужны салфетки...! Помогите! Он не перестаёт течь?!"
1004103-56 = "[s3] «П-Подожди! Стой! Вот!»\n[s4] «У меня есть носовой платок!»"
1004103-57 = ""
1004103-58 = ""
1004103-60 = ""
1004103-61 = ""
1004103-63 = "Через несколько мгновений."
1004103-65 = "*вздыхает*"
1004103-66 = "[s] «...Т-Ты в порядке, Мисаки?»"
1004103-67 = "...Пожалуйста, уведите меня отсюда."
1004103-70 = "[ns] «Вот, я принёс тебе напиток.»"
1004103-71 = "Спасибо, Сенсей."
1004103-72 = "*вздыхает*"
1004103-73 = "...Моё тело — отстой."
1004103-74 = "[s] «У тебя и правда довольно сильная аллергия...»"
1004103-75 = "Благодаря вам всё было не так плохо."
1004103-76 = "[s] «Правда??? Я рад, что смог помочь!»"
1004103-77 = "..."
1004103-78 = "[s] «Может, это знак, что нам стоит стать друзьями!»"
1004103-79 = "Вы сами создали эту ситуацию."
1004103-80 = "Не празднуйте."
1004103-81 = "[s] «...Мне очень жаль.»"
1004103-82 = "..."
1004103-83 = "И всё же, спасибо..."
1004103-84 = "Я постираю платок и верну его."
1004103-85 = "[s] «А? Нет, просто верни как есть.»"
1004103-86 = "..."
1004103-87 = "[s] «Прости. Мне показалось это смешным.»"
1004103-88 = "*вздыхает*"
