[translation]
1300820-1 = "Критерии хорошей вещи"
1300820-4 = "*Тяжёлое дыхание* *Тяжёлое дыхание*"
1300820-5 = "Вам нужно оставаться в укрытии, Сенсей! Здесь небезопасно."
1300820-6 = ""
1300820-8 = ""
1300820-10 = ""
1300820-11 = "Не двигайтесь отсюда, пока я не скажу, хорошо? Обещайте мизинцем!"
1300820-12 = "[s1] «Да, мэм! Госпожа Паникёрша!»\n[s2] «Уж что-что, а волноваться Серика умеет.»"
1300820-15 = "Ч-Чего я переживаю?! Не говорите ерунды!"
1300820-16 = "Ух! Просто берегитесь гранат! И что бы ни случилось... Не! Высовывайтесь!"
1300820-17 = ""
1300820-19 = ""
1300820-21 = "Серика, не задумываясь, убежала, велев мне оставаться на месте."
1300820-23 = ""
1300820-26 = ""
1300820-27 = "Похоже, маленькая кошечка загнала себя в тупик."
1300820-28 = ""
1300820-30 = ""
1300820-31 = "Ке-ке-ке. Если бы она послушалась, пока мы говорили по-хорошему, теперь не пришлось бы её наказывать."
1300820-33 = ""
1300820-35 = ""
1300820-36 = ""
1300820-37 = "...Что, простите?"
1300820-38 = "Ты правда думаешь, что ТЫ достаточно сильна, чтобы наказать МЕНЯ?"
1300820-39 = "Господи! Не могу поверить, что трачу день на таких отбросов!"
1300820-41 = ""
1300820-42 = "Ух! Ай! Хватит! Отвали!"
1300820-43 = "Что происходит? Я думал, эта мелкая умеет только убегать!"
1300820-44 = ""
1300820-46 = ""
1300820-48 = ""
1300820-50 = "Это только начало! Сейчас покажу вам, что значит по-настоящему выйти из себя!"
1300820-51 = "У-Ух! Отступаем! Валим отсюда!"
1300820-52 = ""
1300820-54 = ""
1300820-55 = "Не бросайте меня! Она жутко страшная!"
1300820-56 = ""
1300820-58 = ""
1300820-59 = "А ну вернитесь! Я сейчас вас так отделаю—"
1300820-61 = "[s] «Тише-тише, Серика. Думаю, они усвоили урок.»"
1300820-62 = ""
1300820-64 = ""
1300820-65 = ""
1300820-66 = ""
1300820-67 = ""
1300820-68 = "Сенсей?! Вы обещали не двигаться! Я ещё не сказала, что всё безопасно!"
1300820-69 = "...Вы думали... я о вас забыла?"
1300820-70 = "Что это вообще значит?! Что бы Широко ни говорила, я НЕ теряю голову от злости! И вообще я не злилась!"
1300820-71 = "[s] «Да-да. Как скажешь, Серика.»"
1300820-72 = "...Вы мне вообще не верите."
1300820-73 = ""
1300820-77 = "А? Подождите, моя сумка..."
1300820-78 = "На ремне порез... И посмотрите на угол. Он весь порвался..."
1300820-79 = "..."
1300820-80 = "[ns] «Серика?»"
1300820-81 = "Мне очень нравится эта сумка..."
1300820-82 = ""
1300820-84 = ""
1300820-86 = "Н-Ну, такие вещи случаются. И она у меня уже целую вечность...!"
1300820-87 = ""
1300820-89 = ""
1300820-90 = "..."
1300820-91 = "Но я правда... очень любила эту сумку..."
1300820-92 = "[s] «...Пойдём, Серика!»"
1300820-93 = "А? Куда? Нам куда-то нужно?"
1300820-94 = ""
1300820-96 = ""
1300820-97 = "Н-Не тяните меня! Я сама пойду, ладно? Сенсей!"
1300820-98 = ""
1300820-100 = ""
1300820-102 = ""
1300820-103 = "Где... мы?"
1300820-104 = "Вы приходите сюда за переделками и ремонтом? Нужно что-то забрать?"
1300820-105 = "[s3] «Просто немного мне доверься.»\n[s4] «Хозяин? Вы здесь?»"
1300820-108 = ""
1300820-110 = ""
1300820-111 = "Ну-ну-ну. Если это не мой любимый Сенсей."
1300820-112 = "[s] «Понимаете...»"
1300820-114 = ""
1300820-115 = "Теперь ясно. Молодая леди, чинить будем вашу сумку?"
1300820-116 = "О-О, да, вот она..."
1300820-117 = ""
1300820-119 = ""
1300820-120 = ""
1300820-122 = "Посмотрим, что у нас тут... Порванный ремень, разрыв на углу..."
1300820-123 = "И ожидаемый уровень обычного износа."
1300820-124 = "Угх..."
1300820-125 = "Но в остальном сумка в отличном состоянии. Снимаю перед вами шляпу."
1300820-126 = "П-Правда...?!"
1300820-127 = "Без сомнений. Ценность вещи определяет не цена, а забота о ней, пока она честно выполняет своё назначение. И я вижу, что вы о ней очень хорошо заботились."
1300820-128 = "Спасибо! Н-Надеюсь, вы не думаете, что это странно."
1300820-129 = "Вовсе нет. Если уж на то пошло, мне даже интереснее за неё взяться. Подождите здесь минутку."
1300820-130 = ""
1300820-132 = ""
1300820-133 = ""
1300820-135 = "[ns] «Какое облегчение. Я рад за тебя, Серика.»"
1300820-136 = "Я тоже..."
1300820-137 = "Но это ведь просто сумка. Вы оба слишком раздуваете из этого событие."
1300820-138 = "[s] «Если она важна для тебя, это не пустяк.»"
1300820-139 = "А-А?! Всё совсем не так! Это просто—"
1300820-140 = ""
1300820-142 = ""
1300820-143 = "Э-Это просто... просто сумка..."
1300820-144 = "..."
1300820-145 = "[s] «Похоже, она много для тебя значит.»"
1300820-146 = "Нет. Правда ничего такого особенного."
1300820-147 = "Наверное, я просто немного к ней привязалась, потому что это первая вещь, которую купила себе на самую первую зарплату после того, как начала работать."
1300820-148 = "Реклама была ужасно крутая! Всё звучало ровно так, как я хотела: универсальная, идеальна для школы или спортзала, учёбы..."
1300820-149 = "[s] «Значит, это всё-таки не „просто сумка“, да?»"
1300820-150 = "Вы тоже так думаете, Сенсей?"
1300820-151 = "Хи-хи. Вы правы. Это моя сумка! И она правда соответствует всем обещаниям!"
1300820-152 = "Она очень удобная и в ней столько карманов! Почему-то её постоянно хочется брать с собой."
1300820-153 = "Получается, это действительно хорошо сделанная и прочная сумка, да?"
1300820-154 = "Всё-таки у меня хороший глаз на вещи!"
1300820-155 = "[s] «...»"
1300820-156 = "Ч-Что это за выражение лица, Сенсей?!"
1300820-157 = ""
1300820-160 = "П-Прекратите! Уберите эту дурацкую улыбку и скажите что-нибудь!"
1300820-161 = "..."
1300820-162 = "Ух! Я в туалет!"
1300820-163 = ""
1300820-165 = ""
1300820-166 = ""
1300820-167 = ""
1300820-169 = "Теперь она должна ощущаться как новая. Ну же, попробуйте."
1300820-170 = "Стало ещё лучше! Выглядит прямо как в день покупки, и ремень теперь не так давит на плечо!"
1300820-171 = "Рад слышать! Нравится?"
1300820-172 = "Н-Нравится? У меня слов нет..."
1300820-173 = "Так и запишем. Старый пёс ещё умеет работать."
1300820-174 = "Большое вам спасибо. Эм, сколько с меня...?"
1300820-175 = "А, счёт? Хм, давайте возьму только базовую стоимость ремонта, и на этом всё."
1300820-176 = "Подождите, но вы столько всего сделали! Вы уверены?"
1300820-177 = "Не могу накручивать цену, когда постоянный клиент приводит нового. Тем более такого, кто настолько дорожит своей сумкой! Считайте скидкой для нового клиента."
1300820-178 = "..."
1300820-179 = ""
1300820-181 = ""
1300820-182 = ""
1300820-183 = ""
1300820-184 = "Огромное-огромное спасибо! Обещаю очень хорошо о ней заботиться!"
1300820-185 = "Ах! Время! Я опоздаю на работу, Сенсей! Скоро увидимся, ладно? Ещё раз спасибо!"
1300820-186 = ""
1300820-188 = ""
1300820-189 = "...Ну что."
1300820-190 = "Довольны результатом, Сенсей?"
1300820-191 = "[ns] Кивнуть."
1300820-192 = "Ремонт сумки и всё остальное обошлись недёшево... Хотя мне всё равно заплатили, так что ничего страшного."
1300820-193 = "Даже с учётом срочности вы внесли довольно крупную предоплату."
1300820-194 = "[s5] «Просто Серика редко покупает что-то для себя.»\n[s6] «Я хотел починить для неё сумку, чтобы она не беспокоилась о расходах.»"
1300820-197 = ""
1300820-199 = ""
1300820-200 = "...Понятно."
1300820-201 = "Что ж, считайте миссию выполненной. Гарантирую, она прослужит ещё очень долго."
1300820-203 = "Мы ещё немного тепло поговорили о Сэрике, а затем я наконец вернулся в Шале."
