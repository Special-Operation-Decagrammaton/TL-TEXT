[translation]
52090-1 = "Episódio 9;A Presidente da Hyakkaryouran"
52090-2 = "Dormitório da Filial Ebisu - Salão de Banquetes"
52090-6 = "Hummm, que delícia!"
52090-7 = "Como é bom comer uma refeição quentinha depois de tanto tempo! Aquece até a alma!"
52090-8 = "Desculpa, posso repetir mais uma tigela?"
52090-12 = "É claro!"
52090-13 = "Obrigada! Se puder, mais missoshiru também...!"
52090-24 = "O que houve com vocês? Estão com cara de quem viu um fantasma..."
52090-29 = "Bem, não é que você seja um fantasma, mas..."
52090-30 = "É que ver você aqui dá um susto, sabe..."
52090-31 = "...Fico feliz que você esteja bem, Presidente Ayame."
52090-32 = "Mas, como Estrategista da Hyakkaryouran, preciso perguntar.#n...Onde você esteve e o que fez esse tempo todo?"
52090-33 = "Eu sempre achei você difícil de decifrar.#nMas... por você ter sumido do nada,#na Hyakkaryouran ficou à beira da dissolução."
52090-34 = "Sinceramente, até duvido se devo continuar te chamando de \"Presidente\"."
52090-35 = "Se tiver alguma desculpa, estou ouvindo."
52090-37 = "...Você não mudou nada, Kikyou."
52090-41 = "Eu abandonei a responsabilidade de Presidente da Hyakkaryouran...#nQuanto a isso, não tenho desculpa nenhuma."
52090-42 = "Especialmente você, Nagusa, que teve que assumir como Presidente Interina do nada...#nSinto muito mesmo. Deve ter sido duro, né? Você se sentiu sozinha, né?"
52090-46 = "Não, só de você ter voltado já é mais do que suficien—"
52090-47 = "Nagusa-senpai, fique quieta."
52090-53 = "O que eu quero saber é o motivo de você ter desaparecido de repente."
52090-54 = "E também sobre o braço direito da Nagusa-senpai."
52090-58 = "...Vai ser uma história um pouco longa, tudo bem?"
52090-59 = "Sim, é claro."
52090-60 = "Se for para desfazer os mal-entendidos sobre a senpai, pode levar o tempo que for preciso."
52090-61 = "Yukari, do primeiro ano... certo? Obrigada."
52090-62 = "...Primeiro, antes de começar, me respondam uma coisa."
52090-63 = "Qual é a qualificação para ser a \"Presidente\" da Hyakkaryouran?"
52090-64 = "Eu, eu! Eu sei a resposta!"
52090-65 = "Vencendo a Presidente anterior no Torneio de Sucessão, obtém-se a qualificação!"
52090-66 = "Hehe, você sabe mesmo. Mas não é só isso, sabia?"
52090-70 = "O que a vencedora do Torneio de Sucessão recebe não é o \"título de Presidente\".#nÉ a \"prova de qualificação\" passada pela Grande Profetisa Kuzunoha."
52090-71 = "Ou seja, o Torneio de Sucessão é o ritual para herdar a \"Hyakuren\"."
52090-72 = "Por isso, quem é Presidente da Hyakkaryouran#nprecisa manejar a \"Hyakuren\" como se fosse parte do próprio corpo."
52090-73 = "Mas... então, ainda mais por isso,#nnão existe nenhuma aluna mais digna de ser Presidente do que a Ayame..."
52090-74 = "Até em habilidade de tiro, ninguém se compara à Ayame..."
52090-75 = "Se o oponente for humano, sim."
52090-81 = "...Contra o que você estava lutando, Presidente?"
52090-87 = "Alguns dias antes de eu deixar a Hyakkaryouran, eu estava patrulhando Hyakkiyako como de costume."
52090-97 = "Talvez por ser logo depois do festival, não havia viva alma na cidade.#nE, por algum motivo, só naquele dia as luzes da cidade piscavam de forma irregular."
52090-101 = "Continuei a ronda assim mesmo e, quando me aproximei da ponte—#ndo outro lado, havia uma aluna parada."
52090-111 = "Cabelos loiros brilhantes e olhos roxos.#nE um uniforme branco com um haori azul-claro..."
52090-112 = "Ela tinha exatamente a minha aparência."
52090-113 = "\"Aquilo\" tinha até o meu rosto. Era como estar olhando no espelho."
52090-114 = "Mesmo com a aparência idêntica — não, justamente por ser idêntica —#neu soube por instinto que \"aquilo\" não era eu."
52090-123 = "\"Aquilo\" olhou para mim e abriu um sorriso — como se estivesse me esperando."
52090-124 = "Balas comuns não funcionam contra esse tipo de entidade."
52090-128 = "Mas eu tinha a \"Hyakuren\" em mãos.#nPela primeira vez desde que me tornei Presidente, apontei a arma para uma aparição."
52090-142 = "Mas... não teve efeito algum."
52090-143 = "\"Aquilo\" veio se aproximando como se nem tivesse levado um tiro..."
52090-156 = "...E simplesmente se dissolveu na escuridão da noite."
52090-157 = "Eu poderia ter deixado para lá e pensado que foi só um sonho de uma noite...#nMas, naquele momento, eu não consegui."
52090-160 = "\"Por que a Hyakuren não funcionou?\""
52090-161 = "\"Eu não tenho qualificação? Ou será que a Hyakuren é falsa?\""
52090-162 = "\"Para começo de conversa, a Grande Profetisa Kuzunoha-sama... existe mesmo?\""
52090-165 = "Quase esmagada pela ansiedade, parti para a Grande Planície Nevada, onde diziam existir o Templo do Crepúsculo, só para ver a Kuzunoha-sama com meus próprios olhos."
52090-166 = "Parece idiotice, né? Mas... eu sentia que, se não fizesse isso, não conseguiria me perdoar."
52090-167 = "E eu... fracassei."
52090-168 = "Tudo o que encontrei foram ruínas que pareciam ser do \"Templo do Crepúsculo\"."
52090-169 = "No fim, a Kuzunoha-sama não apareceu diante de mim."
52090-175 = "...Isso é tudo?"
52090-176 = "Sim."
52090-177 = "Ainda falta uma parte muito importante, não?"
52090-178 = "O braço da Nagusa-senpai... e o que você disse quando desapareceu com o Clube Beleza da Natureza."
52090-179 = "O braço da Nagusa...?"
52090-180 = "Ah... o que aconteceu com essas ataduras? Você se machucou?"
52090-185 = "Isso é..."
52090-186 = "Ayame, você não se lembra? A gente se encontrou na Grande Planície Nevada!"
52090-187 = "Você na Grande Planície Nevada...? Naquela hora estava uma nevasca terrível, então..."
52090-188 = "......"
52090-189 = "Você não se lembra mesmo?"
52090-190 = "Você afastou a mão da Nagusa-senpai e disse \"Nunca te considerei minha amiga\"..."
52090-195 = "Eu nunca faria uma coisa dessas!"
52090-202 = "D-Desculpa..."
52090-203 = "Mas eu jamais diria algo assim. A Nagusa sempre foi uma amiga muito importante para mim."
52090-204 = "Você não ouviu errado? Ou confundiu com outra pessoa..."
52090-205 = "É-É verdade, né...? A Ayame jamais faria isso..."
52090-206 = "Mesmo que a Nagusa-senpai aceite isso, eu não acredito."
52090-207 = "A Presidente Ayame que eu conheço também jamais diria isso... mas muita coisa aconteceu enquanto você esteve fora."
52090-208 = "Entre uma Presidente que desapareceu sem dizer nada e uma Vice-Presidente que enfrentou a crise de Hyakkiyako... eu acredito na segunda."
52090-209 = "Se quer que as coisas voltem a ser como antes, conte tudo o que aconteceu na planície nevada."
52090-211 = "Senpai..."
52090-215 = "Está bem. Bem, eu nem pretendia esconder nada desde o começo!"
52090-216 = "Mas posso terminar de comer primeiro?"
52090-217 = "Porque desperdiçar comida traz castigo!"
52090-219 = "Próximo;Memórias Incompletas"
