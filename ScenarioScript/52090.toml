[translation]
52090-1 = "Эпизод 9;Президент Хяккарёран"
52090-2 = "Банкетный зал общежития Эбису"
52090-6 = "О, как вкусно!"
52090-7 = "Как же приятно снова есть горячую еду..."
52090-8 = "Прошу прощения, можно добавки?"
52090-9 = ""
52090-11 = ""
52090-12 = "Д-Да! Столько хватит?"
52090-13 = "Идеально! И если не слишком нагло, можно ещё чашку мисо-супа?"
52090-14 = ""
52090-16 = ""
52090-18 = ""
52090-19 = ""
52090-21 = ""
52090-23 = ""
52090-24 = "...Хм? Что такое? Вы смотрите так, будто увидели призрака!"
52090-25 = ""
52090-28 = ""
52090-29 = "Я бы не сказала... «призрака»..."
52090-30 = "Просто... немного трудно поверить—"
52090-31 = "...Президент Аямэ. Я рада видеть, что вы целы."
52090-32 = "Но как офицер Хяккарёран я обязана спросить о ваших действиях во время отсутствия."
52090-33 = "Во время вашего отречения Хяккарёран едва не распался."
52090-34 = "Откровенно говоря, я не уверена, что вы всё ещё должны носить титул президента."
52090-35 = "Но я хочу услышать ваше объяснение."
52090-37 = "...Ах. Всё та же Кикё. Рада видеть."
52090-38 = ""
52090-40 = ""
52090-41 = "Во-первых, у меня нет достойного оправдания тому, что я оставила вас, бросила президентскую должность и отказалась от обязанностей."
52090-42 = "Я понимаю, что взвалила на Нагусу невозможную задачу. Мне искренне жаль. Пожалуйста, прости."
52090-43 = ""
52090-45 = ""
52090-46 = "О, Аямэ, пожалуйста—"
52090-47 = "Нет, Нагуса."
52090-48 = ""
52090-50 = ""
52090-51 = ""
52090-52 = ""
52090-53 = "Ещё раз спрашиваю: почему вы бросили должность президента и исчезли?"
52090-54 = "Кроме того, я хочу услышать вашу версию того, что произошло с рукой Нагусы."
52090-55 = ""
52090-57 = ""
52090-58 = "...История будет долгой. Вы не против?"
52090-59 = "Конечно!"
52090-60 = "Я с радостью буду слушать всю ночь!"
52090-61 = "А ты первогодка Юкари? Спасибо за поддержку."
52090-62 = "...Но прежде чем начну, позвольте задать вопрос—"
52090-63 = "Как получают Полномочие президента Хяккарёран?"
52090-64 = "Я, я! Я знаю ответ!"
52090-65 = "Нужно победить предыдущего президента в поединке за наследование!"
52090-66 = "Ты не ошиблась! Но кое-чего не хватает."
52090-67 = ""
52090-69 = ""
52090-70 = "Дело не столько в президентском титуле, сколько в Полномочии, передаваемом со времён Великой Пророчицы—"
52090-71 = "То есть поединок за наследование на самом деле определяет, кто унаследует Сотню Лотосов!"
52090-72 = "Именно поэтому президент Хяккарёран способен навязать свою волю и владеть Сотней Лотосов."
52090-73 = "Ну, теперь, когда ты вернулась, это снова должна быть ты, Аямэ."
52090-74 = "Никто другой даже сравниться не сможет!"
52090-75 = "...Возможно, если речь о людях."
52090-76 = ""
52090-78 = ""
52090-80 = ""
52090-81 = "Что ты имеешь в виду, Аямэ?"
52090-82 = ""
52090-84 = ""
52090-86 = ""
52090-87 = "За несколько дней до того, как я вас оставила, я патрулировала улицы Хяккияко."
52090-91 = ""
52090-92 = ""
52090-93 = ""
52090-97 = "Фестиваль только закончился. Улица была тихой, но я заметила мерцающий свет..."
52090-100 = ""
52090-101 = "Я собиралась перейти мост, но в этот момент передо мной прошл другой студент."
52090-102 = ""
52090-109 = ""
52090-111 = "У неё были светлые волосы, фиолетовые глаза, белая нижняя рубашка, а сверху голубой хаори..."
52090-112 = "Короче говоря, она выглядела точь-в-точь как я."
52090-113 = "Я подумала, что ошиблась, но это было словно смотреть в зеркало."
52090-114 = "Инстинкты велели действовать. Это наверняка был какой-то трюк!"
52090-115 = ""
52090-121 = ""
52090-123 = "Она не удивилась, увидев меня. Просто улыбнулась."
52090-124 = "Поэтому я сделала единственное, что могла."
52090-125 = ""
52090-128 = "Впервые с тех пор, как стала президентом, я подняла Сотню Лотосов и направила её на другого."
52090-129 = ""
52090-131 = ""
52090-132 = ""
52090-133 = ""
52090-134 = ""
52090-135 = ""
52090-136 = ""
52090-137 = ""
52090-138 = ""
52090-139 = ""
52090-140 = ""
52090-142 = "И это не дало никакого эффекта."
52090-143 = "Другая я даже не заметила пулю. Просто продолжила идти."
52090-144 = ""
52090-147 = ""
52090-149 = ""
52090-150 = ""
52090-154 = ""
52090-156 = "...И прошла мимо меня, а затем исчезла."
52090-157 = "Знаю, звучит безумно, но меня это до сих пор преследует!"
52090-160 = "«Почему Сотня Лотосов не сработала?»"
52090-161 = "«У меня не было Полномочия? Или сама Сотня Лотосов — иллюзия?»"
52090-162 = "«...А Великая Пророчица Кузуноха вообще существовала?»"
52090-165 = "Неуверенность проникла в меня, и я решила найти Сумеречный храм и Кузуноху."
52090-166 = "Это была глупая затея, но моя."
52090-167 = "И в итоге... я потерпела неудачу."
52090-168 = "Единственное, что нашла, — руины там, где, как мне казалось, должен стоять Сумеречный храм."
52090-169 = "Кузуноха так и не встретила меня. Всё было впустую."
52090-170 = ""
52090-172 = ""
52090-174 = ""
52090-175 = "...И это всё, что вы хотите сказать?"
52090-176 = "Всё. Других оправданий у меня нет."
52090-177 = "Нет. Остался ещё вопрос."
52090-178 = "Рука Нагусы... Перед тем как уйти с «Красотой природы», вы что-то ей сказали."
52090-179 = "Рука Нагусы...?"
52090-180 = "Кстати, что это у тебя за бинты? Ты поранилась?"
52090-181 = ""
52090-184 = ""
52090-185 = "Моя рука..."
52090-186 = "Аямэ, ты забыла? Мы встретились на Великом снежном поле."
52090-187 = "Встретились? Я не... Ты уверена? Может, я ослепла от снега?"
52090-188 = "..."
52090-189 = "Ты не помнишь, Аямэ?"
52090-190 = "Нагуса сказала, что ты отвергла её и заявила, будто вы никогда не были подругами!"
52090-191 = ""
52090-194 = ""
52090-195 = "Невозможно!"
52090-196 = ""
52090-199 = ""
52090-201 = ""
52090-202 = "П-Прости... Я не хотела кричать..."
52090-203 = "Но я ни за что такого не сказала бы. Никогда не сказала бы ничего настолько жестокого своей дорогой подруге."
52090-204 = "Ты точно правильно услышала? Может, это был самозванец?"
52090-205 = "Вполне возможно. Я могла ошибиться."
52090-206 = "Нет. Ещё не всё. Пусть ты и убедила Нагусу, у меня остались вопросы."
52090-207 = "Я согласна, что Аямэ никогда не была бы такой жестокой, но с тех пор произошло слишком многое..."
52090-208 = "Если выбирать между президентом, которая исчезла без предупреждения, и вице-президентом, которая взяла всё на себя во время кризиса Хяккияко, естественно, я выберу вторую."
52090-209 = "Если хотите вернуть моё доверие, советую быть более открытой."
52090-211 = "Кикё..."
52090-212 = ""
52090-214 = ""
52090-215 = "Хорошо. Мне нечего скрывать."
52090-216 = "Но можем продолжить после завтрака?"
52090-217 = "Мне понадобится энергия. Полагаю, вам тоже."
52090-219 = "Следующий эпизод;Неполная память"
