[translation]
1011505-1 = "То, что нельзя пропустить"
1011505-3 = "[ns] «Какая невероятно напряжённая игра...»"
1011505-4 = "Ещё бы! Эти две команды уже очень давно соперничают!"
1011505-5 = "А у их болельщиков друг к другу какая-то странная смесь любви и ненависти."
1011505-6 = "Это одно из лучших классических противостояний в истории бейсбола!"
1011505-8 = "Уа-а... Уа-а...!!"
1011505-9 = "А? Мне послышался детский плач среди всех этих криков...?"
1011505-10 = ""
1011505-12 = ""
1011505-13 = "Мама... Папа... где вы...?"
1011505-14 = "С-Сенсей, смотри..."
1011505-15 = "[s] «Наверное, он потерял родителей в толпе.»"
1011505-16 = "Ч-Что делать?"
1011505-17 = ""
1011505-19 = ""
1011505-20 = "А, точно! Сначала надо сообщить сотрудникам стадиона. Не знаю, почему я сразу об этом не подумала."
1011505-21 = "Идём за мной, Сенсей. Я знаю, куда."
1011505-22 = ""
1011505-24 = ""
1011505-26 = ""
1011505-27 = "И эй, мы побудем с тобой, пока не найдутся родители, хорошо?"
1011505-28 = "Серьёзно...?"
1011505-30 = "Так мы сообщили сотрудникам стадиона о потерявшемся ребёнке."
1011505-31 = "И решили подождать вместе с ним, пока не найдутся его родители."
1011505-32 = ""
1011505-33 = "Ну что, тебе нравится бейсбол?"
1011505-34 = "Бейсбол...? Не знаю. Наверное, маме с папой нравится, иначе они бы меня сюда не привели."
1011505-35 = "Но я теперь не знаю, где они... Уа-а..."
1011505-36 = "В-Всё хорошо. Не бойся! Мы останемся с тобой."
1011505-37 = ""
1011505-42 = "А? Это фол-болл летит прямо сюда...?"
1011505-44 = "О, вот он..."
1011505-45 = ""
1011505-47 = ""
1011505-48 = ""
1011505-49 = ""
1011505-50 = ""
1011505-51 = "Поймала! Ух ты, сегодня мне везёт!"
1011505-52 = "..."
1011505-53 = ""
1011505-55 = ""
1011505-56 = "Хочешь, отдам тебе?"
1011505-57 = "Бейсбольный мяч...?"
1011505-58 = "Знаешь, бейсбол сильно отличается от других видов спорта, где для набора очков используют мяч."
1011505-59 = "Чем...?"
1011505-60 = "Ну, в других играх очки приносит сам мяч. Поэтому обычно его не меняют посреди матча и уж точно не отдают болельщикам вот так."
1011505-61 = "А в бейсболе всё иначе. Здесь очки набирают люди. Поэтому сам мяч не настолько важен, и за него не держатся."
1011505-62 = "Даже прямо во время игры, если мяч улетит к зрителю, тот может оставить его себе. Бейсбол умеет делиться."
1011505-63 = "Мяч просто уходит домой вместе с болельщиком. Разве не здорово?"
1011505-64 = "Ну... наверное."
1011505-65 = "Н-Наверное?!"
1011505-66 = ""
1011505-71 = "Третий страйк! Аут!"
1011505-72 = ""
1011505-75 = "А, видел? После того фола бэттер занервничал."
1011505-76 = "Питчер этим воспользовался и сделал вид, будто собирается бросить падающий крученый мяч..."
1011505-77 = "А потом — бац! Фастбол прямо по центру! Вот это дуэль!"
1011505-78 = ""
1011505-80 = ""
1011505-81 = "Я вообще ничего из этого не понял!"
1011505-82 = "...Но мама с папой наверняка понимают. Им, видимо, ОЧЕНЬ нравится эта игра. Они даже до сих пор не пришли меня искать."
1011505-83 = "И почему она им вообще нравится? Скукотища. Все просто стоят на месте. Не то что баскетбол или футбол..."
1011505-84 = "Даже когда ловят мяч, немного пробегут и снова останавливаются..."
1011505-85 = "Отстой! Ненавижу маму, ненавижу папу... Ненавижу бейсбол!"
1011505-86 = "..."
1011505-87 = "(Бейсбол скучный...?)"
1011505-88 = "(Если подумать, кажется, в таком возрасте я говорила то же самое.)"
1011505-89 = "В том-то и дело. Бейсбол и ДОЛЖЕН быть скучным."
1011505-90 = "[s] «Любопытное заявление, комментатор Рэй.»"
1011505-91 = "П-Погоди, Сенсей..."
1011505-92 = ""
1011505-94 = ""
1011505-95 = "*кхм* Смотри. Когда ты играешь в защите, тебе хочется, чтобы всё шло по одному и тому же привычному сценарию."
1011505-96 = "Если все три бэттера с первой же подачи выбивают граундер или флай-аут — для тебя это идеальный вариант."
1011505-97 = "Если этого не происходит, значит, кто-то ошибся. Смысл в том, чтобы сохранять игру «скучной» и не допускать ошибок."
1011505-98 = "Так что когда всё выглядит скучно, это потому, что вся команда изо всех сил старается сохранить именно такой порядок."
1011505-99 = "Нужно выкладываться на полную, чтобы со стороны всё выглядело максимально непринуждённо."
1011505-100 = "И мне почему-то очень нравится эта ирония."
1011505-101 = "Знаешь лебедей? На поверхности они просто спокойно плывут, словно облака... а под водой их лапы без остановки работают изо всех сил."
1011505-102 = "Стараться изо всех сил, чтобы выглядеть обычно и не привлекать внимания..."
1011505-103 = "...по-моему, это достойно уважения. В этом есть что-то крутое."
1011505-105 = "..."
1011505-106 = "...Правда?"
1011505-107 = "Ага. Я бы сказала, что да."
1011505-108 = "Хм..."
1011505-109 = "Это и правда звучит круто. Может, бейсбол всё-таки ничего..."
1011505-110 = "Правда?"
1011505-111 = ""
1011505-116 = "Шестой бэттер ОТЛИЧНО отбивает падающий крученый мяч!"
1011505-117 = "Мяч приземляется в правой части центра поля! Бэттер проходит первую базу. Он направляется ко второй!"
1011505-118 = "Беги! Беги! Делай дабл!"
1011505-119 = "Вот это скорость! Защита бросает на вторую базу. Игрок на базе тянется за мячом..."
1011505-120 = "Подкат! И решение судьи...?!"
1011505-121 = ""
1011505-123 = ""
1011505-124 = "Сэйф! Какой рывок — превратить сингл в дабл!"
1011505-125 = "Ага!"
1011505-126 = "У-у!"
1011505-127 = "Понравилось?"
1011505-128 = "Ага, это было круто!"
1011505-129 = "Правда?"
1011505-131 = "Игра становилась всё напряжённее."
1011505-132 = "Вскоре появились родители ребёнка."
1011505-133 = "Судя по их лицам, они искали его уже довольно долго."
1011505-134 = ""
1011505-135 = "Спасибо... Спасибо вам... Я даже не знаю, как вас отблагодарить..."
1011505-136 = "Ты в порядке? Мы так волновались... Мне ужасно жаль. Как же хорошо, что ты цел."
1011505-137 = "Всё нормально! Со мной были Сенсей и сестрёнка, они со мной играли!"
1011505-138 = "Ладно, Сенсей, сестрёнка! Мне пора! Было очень весело! Спасибо!"
1011505-139 = ""
1011505-141 = ""
1011505-142 = ""
1011505-143 = "Я рада. Всё... вышло довольно неплохо. Хи-хи."
1011505-144 = "[ns] «У тебя очень впечатляющая теория бейсбола, Рэй.»"
1011505-145 = "Ч-Что?! Теория...? Да ну."
1011505-146 = "..."
1011505-147 = "Н-Не дразни меня, Сенсей."
1011505-148 = "[s] «Я и не дразню.»"
1011505-149 = "Ну, мне всё равно неловко, так что... да."
1011505-151 = "Сказав это, Рэй натянула кепку пониже."
1011505-152 = "Но её уши уже успели покраснеть до кончиков."
