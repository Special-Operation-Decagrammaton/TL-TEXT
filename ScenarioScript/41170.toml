[translation]
41170-1 = "Эпизод 17;Операция «Клевер», часть 1"
41170-4 = "Коридор главного здания Полицейской школы Валькирии"
41170-7 = ""
41170-8 = ""
41170-9 = ""
41170-10 = "RABBIT 1 докладывает. Время 23:30. Прибыла в точку «Эхо»."
41170-11 = "Охрана пока не обнаружена, но в противоположном коридоре замечено несколько электронных сигналов, предположительно камеры наблюдения."
41170-12 = "Лагерь RABBIT на связи. Подтверждаю. Камеры там были, но я уже взяла их под контроль. Хи-хи."
41170-13 = "Я слежу за видеопотоками, так что путь к точке «Сьерра» чист. Ни одного охранника."
41170-14 = "О-Ого! Ты так быстро их взломала, Моэ!"
41170-15 = "Хи-хи-хи! Обойти такую защиту проще, чем взорвать здание."
41170-16 = "...Почти. На сервере случайный числовой код, который меняется каждые тридцать минут, так что дольше этого ничего не обещаю. Либо закончите за это время, либо всё провалится."
41170-17 = "На этом коде буквально стоит подпись вице-президента Веритас. Вот же заноза."
41170-18 = "Но это главное здание Полицейской школы Валькирии. Как здесь может не быть ни одного патрульного?"
41170-19 = "У тебя что, уши заложило? Я же сказала, камеры и сигнализацию отключила!"
41170-20 = "Я вообще не о тебе. Просто не верится, насколько у них слабая охрана и насколько они зависят от технологий."
41170-21 = "По-моему, это недисциплинированно и жалко. Вот живое воплощение того, почему я не хотела учиться в этой школе."
41170-22 = "Мы поняли, госпожа Совершенство. Реестр Бюро общественного порядка — то есть «Клевер» — находится в точке «Сьерра», на третьем подземном этаже. Идите к западной лестнице. Маршрут всё ещё чист."
41170-23 = "И ещё раз: я могу держать сигнализацию отключённой только тридцать минут. Вы, дурочки, должны вернуться к точке сбора до истечения времени."
41170-24 = ""
41170-26 = ""
41170-28 = "RABBIT 1, поняла."
41170-29 = "Эм, а г-где Сенсей?"
41170-30 = "Нам пришлось спускаться на тросах с большой высоты, чтобы проникнуть незаметно. Для Сенсея без подготовки это было бы опасно, поэтому он поддерживает нас из тыла."
41170-31 = "И мы не могли рисковать тем, что какой-нибудь враг прорвётся через линию огня и навредит Сенсею..."
41170-32 = "[s1] «Вы раскрыли мою страшную тайну. Я боюсь высоты.»\n[s2] «Я многое умею, но спуск на тросах не входит в список.»"
41170-33 = "Придётся выполнить эту миссию самим. Впрочем, так было всегда."
41170-34 = "Придётся выполнить эту миссию самим. Впрочем, так было всегда."
41170-35 = "В-Верно... Мы всегда с-справлялись сами..."
41170-36 = "Только мы..."
41170-37 = "Почему такое лицо, Мияко? Что случилось?"
41170-38 = "А, ничего. Просто ещё раз прокручиваю план."
41170-39 = ""
41170-41 = ""
41170-42 = "Хорошо, отряд RABBIT. Не расслабляться и прикрывать друг друга. Выдвигаемся к точке «Сьерра»."
41170-46 = ""
41170-47 = "Э-Это архивная комната со всеми документами..."
41170-48 = "Неудивительно, что её закрывает цельная стальная дверь. Преступники готовы на многое, чтобы спрятать доказательства своих преступлений."
41170-50 = "Кого волнует большая дверь? Ни одного охранника рядом."
41170-51 = "Хотя жаловаться не буду. Пока операция идёт гладко."
41170-52 = "Ну что, Мияко? Пора. Времени мало."
41170-53 = "Это не обычный замок. Открывается только электронным сигналом."
41170-54 = "Моэ, наверное, уже пытается взломать код..."
41170-55 = "Что? Это входит в наши тридцать минут?"
41170-56 = ""
41170-58 = ""
41170-60 = "Я и так работаю так быстро, как могу, ясно? Уф!"
41170-61 = "У нас нет времени. Нельзя просто взорвать дверь?"
41170-62 = "Да. Пожалуйста. Взорви цельную стальную дверь. Милости прошу."
41170-63 = "А заодно разбуди всю школу. И что ты будешь делать потом, тупая качалка?"
41170-64 = ""
41170-66 = ""
41170-67 = "Запускаю программу дешифровки с секретным ключом, который нашла через открытый текст..."
41170-68 = ""
41170-70 = ""
41170-71 = ""
41170-73 = "Мы внутри, дамы и дамы!"
41170-74 = ""
41170-79 = "...Это заняло больше трёх минут."
41170-80 = "Ты думаешь, я тут просто палочкой машу?"
41170-81 = "Если всё так легко, в следующий раз сама попробуй."
41170-83 = "Сейчас не время ругаться."
41170-84 = "Система безопасности скоро снова включится."
41170-85 = "Главное — найти доказательства, которые прижмут Бюро общественного порядка."
41170-86 = "Ты права."
41170-87 = "Я возьму стеллажи справа."
41170-88 = ""
41170-90 = ""
41170-93 = "Я-я ненавижу тёмные места..."
41170-94 = ""
41170-96 = ""
41170-100 = "Так, посмотрим..."
41170-101 = "Журналы транзакций... Журналы транзакций..."
41170-102 = ""
41170-104 = ""
41170-105 = ""
41170-106 = "Квитанция, поданная Кайзер Индастриз неделю назад..."
41170-107 = ""
41170-109 = ""
41170-110 = "Джекпот!"
41170-111 = ""
41170-113 = ""
41170-114 = ""
41170-115 = "Отлично, Саки. Дай посмотреть."
41170-120 = "Похоже, Сенсей был прав."
41170-121 = ""
41170-123 = ""
41170-124 = "Сенсей, «Клевер» добыт."
41170-125 = "Всё как вы сказали. Кайзер Индастриз бесплатно поставляла оружие Бюро общественного порядка в обмен на выселение всех бездомных из города Коусаги."
41170-126 = "[s3] «Значит, чутьё меня не подвело.»\n[s4] «Тогда у нас есть всё необходимое.»"
41170-127 = "Да, именно это нам нужно, чтобы остановить этот несправедливый сговор."
41170-128 = "Да, именно это нам нужно, чтобы остановить этот несправедливый сговор."
41170-129 = "Ха-ха-ха! Не могу дождаться, когда ткну этим в морду этим головорезам из Бюро общественного порядка!"
41170-130 = ""
41170-133 = ""
41170-134 = ""
41170-136 = ""
41170-137 = "Мию, что ты делаешь у двери?"
41170-138 = "Н-Ну... о-она закрыта..."
41170-139 = "Ладно. Открой."
41170-140 = "Д-Дело в том... д-д-дверь..."
41170-141 = "Изнутри у неё нет ручки."
41170-142 = ""
