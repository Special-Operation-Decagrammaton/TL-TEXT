[translation]
41170-1 = "Episódio 17;Operação Trevo (1)"
41170-4 = "Academia de Polícia Valkyrie - Corredor"
41170-10 = "Aqui é RABBIT 1, hora atual 2330. Acabamos de chegar ao Ponto E."
41170-11 = "Nenhuma sentinela à vista. Confirmados vários dispositivos que parecem ser câmeras de segurança no corredor oposto."
41170-12 = "Aqui é o Acampamento RABBIT. Já hackeei essas câmeras de segurança, então podem seguir tranquilas~"
41170-13 = "Pelo que vejo na tela, não há nenhum guarda por perto. Podem ir de boa até o Ponto S."
41170-14 = "Moe-chan, rápida como sempre..."
41170-15 = "Hehehe, uma segurança desse nível é moleza."
41170-16 = "...Foi mal estragar a empolgação, mas o hack só deve durar 30 minutos. Parece que um código aleatório é gerado a cada 30 minutos, e esse circuito é meio puxado. Então, por favor, terminem a missão em até 30 minutos."
41170-17 = "Pelo estilo, aposto que foi aquela vice-presidente do Veritas de novo... Que saco."
41170-18 = "Mesmo sendo o prédio principal da Valkyrie, como assim não tem nenhum guarda?"
41170-19 = "Tá tudo bem, confia em mim!"
41170-20 = "Não tô falando de você, Moe, tô falando da Valkyrie."
41170-21 = "...Mesmo sendo nossas inimigas agora, isso é lamentável. É por isso que eu não quero ir pra Valkyrie."
41170-22 = "Enfim, o Ponto S, onde está guardado o livro de transações do Departamento de Segurança Interna — \"Trevo\" — fica no terceiro subsolo. Por precaução, usem a escada do lado oeste, que tem menos movimento."
41170-23 = "...Vou repetir, o limite de tempo é de 30 minutos. Conto com vocês."
41170-28 = "RABBIT 1, entendido."
41170-29 = "E-E quanto ao Sensei...?"
41170-30 = "Diferente da última vez, a rota de infiltração é muito rigorosa para o Sensei. Depois de conversarmos, decidimos deixá-lo para trás à força."
41170-31 = "Além disso, se formos descobertas por acaso, pode acabar em um tiroteio."
41170-32 = "[s1] \"Desculpa por não poder ajudar...\"\n[s2] \"Vou ficar torcendo por vocês nos bastidores...\""
41170-33 = "Bom, de certa forma, é a equipe de sempre."
41170-34 = "Bom, de certa forma, é a equipe de sempre."
41170-35 = "É-É verdade..."
41170-36 = "Sim. Só nós mesmas..."
41170-37 = "Miyako, que cara é essa? Algum problema?"
41170-38 = "N-Não. Só estava pensando na operação."
41170-42 = "Então, avancem até o Ponto S em estado de alerta!"
41170-47 = "Todos os documentos da Valkyrie estão nesta sala..."
41170-48 = "É uma porta bem resistente. Como todas as provas ligadas a crimes também devem estar aqui, é de se esperar."
41170-50 = "Mesmo assim, continua sem ter nenhum guarda por aqui."
41170-51 = "Bem, quanto mais fácil, melhor."
41170-52 = "...Aliás, o que estamos esperando? Não vamos entrar logo?"
41170-53 = "Esta porta é eletrônica."
41170-54 = "A Moe-chan está se esforçando bastante para destravar agora..."
41170-55 = "...Ei, não me diga que esse tempo está contando nos \"30 minutos\", né?"
41170-60 = "Não me apressa! Eu também tô correndo aqui!"
41170-61 = "Tsc, não dá pra simplesmente arrombar a porta?"
41170-62 = "Você acha que consegue com essa espessura? Se acha que dá, tenta aí!"
41170-63 = "Mas não me responsabilizo se o alarme disparar."
41170-67 = "Ah, entendi. Se eu decodificar isso..."
41170-73 = "...Liberado!"
41170-79 = "...3 minutos, até que demorou bastante."
41170-80 = "Isso foi bem rápido, tá bom?!"
41170-81 = "Você tem ideia de como isso era difícil?!"
41170-83 = "Não é hora para ficarmos brigando."
41170-84 = "Não temos muito tempo sobrando, vamos nos apressar."
41170-85 = "Procurem as provas sobre aquela propina."
41170-86 = "Então,"
41170-87 = "eu vou começar pela estante da direita."
41170-93 = "Uuh, tá escuro..."
41170-100 = "Hmm, vamos ver..."
41170-101 = "Departamento de Segurança Interna, Departamento de Segurança Interna..."
41170-106 = "\"Kaiser Industry\", registro de uma semana atrás..."
41170-110 = "É isso!"
41170-115 = "Ótimo trabalho, Saki. Posso dar uma olhada?"
41170-120 = "...Entendo."
41170-124 = "\"Trevo\"... Garantimos as provas de propina ilegal entre a \"Kaiser Industry\" e o Departamento de Segurança Interna."
41170-125 = "Exatamente como o Sensei disse. Parece que o assunto da \"reurbanização de Kousagi Town\" realmente estava envolvido no meio disso."
41170-126 = "[s3] \"Entendi, era isso mesmo...\"\n[s4] \"Por enquanto, bom trabalho a todas.\""
41170-127 = "Com este documento, acho que conseguiremos deter os movimentos delas."
41170-128 = "Com este documento, acho que conseguiremos deter os movimentos delas."
41170-129 = "Vamos dar um belo susto naquele pessoal do Departamento de Segurança Interna."
41170-137 = "Hã? O que você tá fazendo, Miyu?"
41170-138 = "E-Eu acabei fechando a porta..."
41170-139 = "...Se fechou, é só abrir de novo."
41170-140 = "M-Mas esta porta..."
41170-141 = "É do tipo que não tem maçaneta nem nada... Acho que não dá pra abrir."
41170-146 = "...O quê?!"
41170-148 = "Próximo;Operação Trevo (2)"
