[translation]
70009010-1 = "И всё же Префектурный совет продолжает работу 1"
70009010-3 = "Птицы поют, цветы распускаются..."
70009010-7 = "Какой прекрасный день."
70009010-10 = "Идеальный день, чтобы пить эспрессо за столиком уличного кафе."
70009010-11 = ""
70009010-15 = "Как жаль, что вместо этого я застряну на тёмном досмотровом пункте."
70009010-16 = ""
70009010-22 = "...Мне даже на меланхоличные мечтания времени не оставляют."
70009010-23 = "Да слышу я! Досмотровый пункт сейчас откроется!"
70009010-24 = ""
70009010-26 = ""
70009010-28 = ""
70009010-30 = "Проходите. Предъявите пропуск."
70009010-31 = "Вот."
70009010-33 = "Ничего не декларируете, да?... Тогда пройдите краткий личный досмотр."
70009010-34 = "Ой, это точно обязательно? Вы же знаете, у этой формы карманы декоративные!"
70009010-35 = "Ничего личного. Просто работа."
70009010-36 = ""
70009010-38 = ""
70009010-39 = ""
70009010-40 = ""
70009010-41 = ""
70009010-42 = ""
70009010-43 = "П-Подождите! Даже ТАМ?"
70009010-44 = "Контрабанды стало больше. Нам прислали новые инструкции по досмотру."
70009010-45 = ""
70009010-47 = ""
70009010-48 = ""
70009010-49 = "Нет, я... Хи-хи! Подождите, я ужасно боюсь щекотки! П-Прекратите!"
70009010-50 = "...Похоже, вы ничего не прячете. Можете идти."
70009010-51 = "Я же говорила!"
70009010-52 = ""
70009010-54 = ""
70009010-55 = "Вот поэтому все ненавидят Совет...!"
70009010-56 = "Добросовестная работа вознаграждается несправедливой критикой."
70009010-57 = "*вздох*... Жалобами этот день быстрее не закончишь..."
70009010-58 = "Следующая! Проходите. Предъяви—"
70009010-59 = ""
70009010-61 = ""
70009010-62 = "Ага, пропуск и сумка, вот, держите."
70009010-63 = "Спасибо. Теперь я проверю содержимое вашей сумки."
70009010-64 = ""
70009010-66 = ""
70009010-67 = ""
70009010-68 = ""
70009010-69 = ""
70009010-70 = "Хм. Картофельные чипсы со вкусом икры минтая."
70009010-72 = "И что с ними?"
70009010-73 = ""
70009010-75 = ""
70009010-76 = "Запрещены. Я обязана их конфисковать."
70009010-77 = "Почему?!"
70009010-78 = "Этот товар классифицирован как несоответствующий требованиям. Он не соответствует стандартам пищевой безопасности Вайлдхант."
70009010-79 = ""
70009010-81 = ""
70009010-82 = "Каким ещё стандартам?"
70009010-83 = "Этот бренд использует недостаточно азота в упаковке, поэтому продукт подвержен повреждениям и загрязнению при перевозке."
70009010-84 = "Азота...? Да они совершенно безопасные. Вы просто сами хотите съесть мои чипсы, да?"
70009010-85 = "Правила устанавливаю не я. Все жалобы необходимо официально направлять по почте в офис Ассамблеи."
70009010-86 = ""
70009010-88 = ""
70009010-89 = "А дальше у нас... эта кукла. Она может быть в списке..."
70009010-90 = "Хм... А, нашла. «Пероро» из «Momo Friends». Да, это тоже придётся конфисковать."
70009010-91 = "Мне уже надоело это слушать... но почему?"
70009010-92 = "Хм... Здесь сказано, что Ассамблея установила: «объект Пероро проявил непоследовательность характера в одном из недавних эпизодов, поэтому в качестве дипломатического протеста...» Что за..."
70009010-93 = "...Решение остаётся в силе. Все товары Momo Friends временно запрещены. Кроме того—"
70009010-94 = "«Кроме того»?!"
70009010-95 = ""
70009010-98 = ""
70009010-99 = "Есть ещё вот это."
70009010-100 = "Это ананас?"
70009010-101 = "Очевидно же, да. Ананас. И что с ним не так?"
70009010-102 = "...Ничего. Просто удивляюсь, сколько всего помещается в эту сумку. И да, это тоже подлежит конфискации."
70009010-103 = "Почему?! Это фрукт!"
70009010-104 = "Запрещено. Единственный способ полностью исключить возможность пиццы с ананасом — устранить источник."
70009010-105 = "Кто вообще придумал такое правило...?"
70009010-106 = "Я. Я не люблю пиццу с ананасом."
70009010-108 = "Это абсолютно предвзято и несправедливо!"
70009010-109 = "Инспекторы обязаны действовать по своему усмотрению, когда речь идёт о конфискации товаров, способных привести к тяжким преступлениям."
70009010-110 = "Пицца с ананасом — НЕ преступление..."
70009010-111 = ""
70009010-113 = ""
70009010-114 = "И наконец...? Что это вообще такое?"
70009010-115 = "А, кажется, автобиография президента студсовета Геенна? Мне показалось забавным, что её никто не покупал даже со скидкой, да и переплёт красивый. Вот и взяла."
70009010-116 = "Этой книги нет в официальном реестре. Пока я должна её конфисковать."
70009010-117 = "Что?! Вы вообще представляете, насколько тяжело было тащить её сюда?"
70009010-118 = "Если книга успешно пройдёт официальную проверку, её внесут в реестр. После этого вы сможете забрать книгу, подав официальный запрос в Ассамблею."
70009010-119 = "Это всё. Можете идти."
70009010-120 = ""
70009010-122 = ""
70009010-124 = "Ага, «всё»! У меня теперь сумка пустая! В других школах можно иметь... чипсы, кукол и фрукты! С какого права вы всё это забираете?!"
70009010-125 = "Права инспектора перечислены в официальном регламенте."
70009010-127 = "Кто его вообще читает, кроме Префектурного совета?! Ух!"
70009010-128 = ""
70009010-130 = ""
70009010-131 = ""
70009010-132 = "*вздох* Вот именно. Проблема — в незнании правил..."
70009010-133 = "Запру это в хранилище... Следующая! Проходите."
70009010-134 = ""
70009010-136 = ""
70009010-137 = "Уф! Тяжёлая, секунду."
70009010-138 = "Вы много всего упаковали. Теперь я проверю содержимое сумки."
70009010-139 = "Конечно! Там должно быть ровно то, что я задекларировала."
70009010-140 = ""
70009010-142 = ""
70009010-143 = ""
70009010-145 = "Посмотрим... 50 наборов кистей Red Flower, 50 связок кистей Cruger SB, 100 холстов и банка промышленной смывки для краски..."
70009010-146 = "Хм? Что под этим холстом?"
70009010-147 = "О! Это...!"
70009010-148 = ""
70009010-154 = "...Что это?"
70009010-155 = "Как видно по этикетке... это напалм производства Миллениум."
70009010-156 = "Пистолет-пулемёт, фугасная граната... Это оружие НЕ было задекларировано."
70009010-157 = "А, ну, это мои личные вещи! Я столько всего собирала, что забыла, что они лежат на дне сумки."
70009010-158 = ""
70009010-160 = ""
70009010-161 = "Не хотела вас удивлять. Но разве такие мелочи вообще нужно декларировать?"
70009010-162 = ""
70009010-164 = ""
70009010-165 = "Нет. Как вы и сказали, это мелочи. Всё равно что заставлять декларировать шляпу и куртку."
70009010-166 = "Всё чисто. Можете идти."
70009010-167 = "Спасибо! Хорошего дня!"
70009010-168 = ""
70009010-170 = ""
70009010-171 = ""
70009010-172 = "Если бы только все брали с неё пример и соблюдали правила... *вздох* Следующая! Проходите."
70009010-173 = ""
70009010-175 = ""
70009010-176 = "Вот! Мой пропуск и мой предмет! Быстрее! Меня осенило божественное вдохновение!"
70009010-177 = "Да-да, хорошо. Секунду. ...?"
70009010-178 = ""
70009010-180 = ""
70009010-181 = ""
70009010-182 = "Что... это за предмет?"
70009010-183 = "Статуя из Тринити! Если растереть её и сделать из неё краску, получится тонкий, мягкий, неземной белый цвет!"
70009010-184 = "...А создатель статуи дал вам разрешение измельчать его работу?"
70009010-185 = "А? Вы слепая? Очевидно же, это антиквариат. Практически реликвия!"
70009010-186 = "Да. Я вижу."
70009010-187 = "Художник, который её создал, очевидно, уже умер!"
70009010-188 = "...Пока я это конфискую. Кроме того... мне кажется, вам требуется дополнительная проверка. Подождите здесь."
70009010-189 = "Что? ЖДАТЬ?! Вдохновение никого не ждёт!!"
70009010-190 = ""
70009010-192 = ""
70009010-193 = "...*ахает* Я поняла, что происходит! Вы хотите украсть мою идею, да?!"
70009010-194 = "Не говорите глупостей. На эту импортную статую распространяются санкции."
70009010-195 = "Санкции...? Вы пытаетесь контролировать искусство! ЦЕНЗУРА!"
70009010-196 = "Вы... действительно сейчас совершаете преступление?"
70009010-198 = "Я не подчинюсь угнетающей власти! Это МОЁ видение! Искусство рождается только в борьбе!"
70009010-199 = ""
70009010-202 = ""
70009010-203 = "Ах! Охрана! Она убегает!"
70009010-204 = ""
70009010-206 = ""
70009010-207 = "А? Куда она делась?"
70009010-208 = "Догнать и задержать её!"
70009010-210 = "Что происходит? Что за крики?"
70009010-211 = "То есть её вы просто пропускаете вместе со всем барахлом? Верните мой ананас!"
70009010-212 = "Это наш шанс. Они не смогут остановить всех."
70009010-214 = "Ч-Что?! Всем держать строй!"
70009010-215 = "Это досмотровый пункт! У нас чрезвычайная ситуация! Студенты бунтуют и прорываются через ворота. Запрашиваем подкрепление!"
70009010-217 = "Вместе! Разорвём цепи Префектурного совета и вернём себе свободу!"
70009010-218 = "Да здравствует Вайлдхант! Мы ничьи не рабы!"
70009010-219 = ""
70009010-221 = ""
70009010-222 = ""
70009010-223 = ""
70009010-229 = "Ах..."
70009010-230 = ""
70009010-232 = ""
70009010-236 = "...Голубь."
