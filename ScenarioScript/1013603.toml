[translation]
1013603-1 = "Тепловое равновесие"
1013603-2 = ""
1013603-3 = ""
1013603-4 = "Возможно, я немного преувеличила, назвав это «ночным патрулём». Не думаю, что произойдёт что-то особенное."
1013603-5 = "Почему я так думаю? Хм..."
1013603-6 = "Интуиция?"
1013603-7 = "[s] «Не думал, что ты доверяешь таким вещам, как „интуиция“.»"
1013603-8 = "Хм, правда? По-своему интуиция может быть очень эффективной."
1013603-9 = "Если обобщить мой двузначный жизненный опыт..."
1013603-10 = "И огромный объём генетических данных человечества как вида за более чем 100 000 лет... Вот база данных, из которой черпает интуиция."
1013603-11 = "Это не какое-то расплывчатое внутреннее чувство. Это эвристический алгоритм."
1013603-12 = "Люди склонны избегать людей или мест, которые «кажутся» подозрительными, как вполне понятную меру безопасности."
1013603-13 = "В том же духе я полагаюсь на инстинкты, когда это разумно."
1013603-14 = "Разумеется, заранее составить эффективный план для любой миссии всё равно обязательно."
1013603-15 = "Но нет ничего плохого в том, чтобы осторожно сокращать объём работы там, где можно."
1013603-16 = "[s] «Ты тоже ненавидишь работать, Эйми?»"
1013603-17 = "А кто любит? Ну, в мире есть эти сверхусердные трудоголики."
1013603-18 = "[s] «Это правда...»"
1013603-19 = ""
1013603-23 = "[ns] «Апчхи!!»"
1013603-24 = "Вам холодно?"
1013603-25 = "Просто немного знобит? Хм. Понятно."
1013603-26 = "В конце концов, мы всё ещё в полярном регионе."
1013603-27 = "Фуфу. В таком случае."
1013603-28 = ""
1013603-32 = "Эйми прижалась ко мне, делясь теплом, и взяла меня под руку."
1013603-33 = "[ns] «Э-Эйми?!»"
1013603-35 = ""
1013603-36 = "Теперь теплее, Сенсей?"
1013603-37 = "Мне? Мне идеально. Не слишком жарко и не слишком холодно."
1013603-38 = "Мне? Мне идеально. Не слишком жарко и не слишком холодно."
1013603-39 = "Хм? Это тоже эффективно?"
1013603-40 = "Можно и так сказать..."
1013603-41 = "..."
1013603-42 = "Но ещё это довольно приятно."
1013603-43 = "[s] «...А?»"
1013603-44 = "«А»? Что за выражение, Сенсей? Я вам не нравлюсь?"
1013603-45 = "Фуфу. Шучу. Теперь я немного лучше понимаю, почему вы ведёте себя именно так, Сенсей."
1013603-46 = "Да."
1013603-47 = "Прежняя я никогда бы такого не сказала и даже не подумала."
1013603-48 = "Но когда мы вот так прижимаемся друг к другу, делясь имеющимся теплом..."
1013603-49 = "Наверное, это тоже своего рода тепловое равновесие."
1013603-50 = "Я чувствую, что ваше тело тёплое, Сенсей."
1013603-51 = "А вы чувствуете, что моё тело горячее."
1013603-52 = "С определённой точки зрения именно так люди изменяют друг друга."
1013603-53 = "Люди склонны учиться друг у друга и благодаря этому меняться."
1013603-54 = "[s] «Думаешь... ты изменилась из-за меня, Эйми?»"
1013603-55 = ""
1013603-57 = ""
1013603-58 = ""
1013603-59 = "Да. Я бы так сказала."
1013603-60 = "Да. Я бы так сказала."
1013603-61 = "Если бы я никогда не встретила Сенсея из Шале..."
1013603-62 = "Возможно, навсегда осталась бы на месте."
1013603-63 = "Так и осталась бы человеком, которому никогда не пришло бы в голову согреть кого-то собственным теплом вот так."
1013603-64 = "Но теперь..."
1013603-65 = "..."
1013603-66 = "Фуфу. Эту мысль я оставлю при себе."
1013603-67 = "..."
1013603-68 = "В конце концов, говорить её вслух немного неэффективно."
