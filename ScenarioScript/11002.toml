[translation]
11002-3 = ""
11002-4 = "Клубная комната Шале уже прямо впереди!"
11002-5 = "Я наконец выяснила, кто стоит за этими беспорядками."
11002-7 = "Её зовут Вакамо. Она беглянка, сбежавшая из Исправительного бюро после отстранения в Объединённой академии Хяккияко."
11002-8 = "Она рецидивистка, поэтому советую не терять бдительности."
11002-10 = ""
11002-11 = "Ну надо же. Генеральный ученический совет даже не соизволил явиться лично. Впрочем, неважно."
11002-12 = "Понятия не имею, что находится в этом здании, но если оно важно для Генерального ученического совета... значит, мне остаётся только его уничтожить."
11002-13 = "Ахх... Не могу дождаться, что будет дальше. Хи-хи-хи. ♥"
