[translation]
11002-4 = "A sede do Schale já está bem na nossa frente!"
11002-5 = "Acabamos de confirmar a identidade da aluna por trás de toda essa confusão."
11002-7 = "Wakamo. Uma aluna que foi suspensa da Academia Aliada Hyakkiyako e depois escapou do Departamento Correcional."
11002-8 = "Ela é extremamente perigosa e tem várias passagens por incidentes parecidos, então tomem muito cuidado."
11002-11 = "...Ora, ora. Parece que o Conselho Estudantil Geral não apareceu. Huhu, tudo bem, não faz mal."
11002-12 = "Não faço ideia do que há dentro daquele prédio, mas só de saber que é algo precioso para o Conselho Estudantil Geral... eu não vou sossegar enquanto não destruir tudo..."
11002-13 = "Ah... Fazia tempo que eu não me divertia assim, ufufufu♡"
