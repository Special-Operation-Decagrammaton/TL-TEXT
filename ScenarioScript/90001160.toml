[translation]
90001160-1 = "Эпизод 16;Звуки призыва"
90001160-5 = "*вдох* *выдох*"
90001160-6 = "Время пришло!"
90001160-7 = ""
90001160-10 = "Д-Да!"
90001160-11 = ""
90001160-13 = ""
90001160-14 = "...Да. Именно. Мы должны собраться. С этого момента нельзя допустить ни единой ошибки."
90001160-15 = "Д-Да...! Наконец-то, наконец-то... пришло время разбудить С-Старшую сестру!"
90001160-17 = "Эйн! Тебе тоже запрещено заикаться!"
90001160-19 = "Э-Э?!"
90001160-20 = "Хорошо... Я постараюсь..."
90001160-21 = "Да. Нервозность не должна заставить нас ошибаться, а самоуверенность — стать небрежными."
90001160-24 = ""
90001160-25 = "Проверка остатка охлаждающей жидкости... Едва хватает!"
90001160-26 = "Перенаправить всю доступную энергию в Основание Зоара. Многомерный барьер тоже на мгновение отключится."
90001160-28 = "Немного опасно, но делать нечего."
90001160-29 = ""
90001160-31 = ""
90001160-32 = "Начинаем, девочки!"
90001160-33 = ""
90001160-36 = ""
90001160-47 = "Преобразование плотности Геля данных."
90001160-48 = "Проверка соединения нервных сигналов."
90001160-50 = "Проверка прочности соединения."
90001160-51 = "Подтверждено. Значения стабильны."
90001160-52 = "Начинаю взаимное соединение."
90001160-53 = ""
90001160-58 = "Стабилизация взаимного соединения подтверждена. Проверяю активные области коннектома."
90001160-59 = "Активация коннектома стабилизирована... Вывести результаты?"
90001160-60 = "Не нужно, Эйн. Я тебе доверяю."
90001160-61 = ""
90001160-64 = ""
90001160-65 = ""
90001160-66 = "Приближаемся к первой сфере сознания — Пешат. Поверхностная область коры в норме. Дельта-волны подтверждены."
90001160-67 = "Далее приближаемся ко второй сфере сознания — Ремез. Центральный слой продолговатого мозга в норме. Тета-волны подтверждены."
90001160-68 = "Приближаемся к третьей сфере сознания — Дераш. Внутренняя область ядра— О-ошибка сигнала?!"
90001160-69 = "Ч-Ч-Что нам делать? Это же катастрофа, да?!"
90001160-70 = "Нет, Эйн. Всё идёт как задумано. Это нормально."
90001160-72 = "Она права. Эти сферы больше не принадлежат нам и не подчиняются нашей воле."
90001160-73 = ""
90001160-77 = ""
90001160-78 = "Четвёртая сфера сознания, Сод... Наблюдение успешно."
90001160-79 = "Подача энергии стабилизирована. Временно отключаю Многомерный барьер."
90001160-80 = "Полагаю, теперь нам остаётся только ждать результатов."
90001160-82 = "Т-Тогда что... нам делать...?"
90001160-83 = ""
90001160-85 = ""
90001160-86 = "..."
90001160-87 = "Молиться, наверное."
90001160-88 = "Превосходное предложение. В конце концов, мы поклоняемся нашему господину."
90001160-89 = "Д-Да... Молча молиться, в глубине наших сердец..."
90001160-91 = "...чтобы наша Старшая сестра Малкут благополучно пробудилась в этой земле."
90001160-92 = ""
90001160-101 = "Теперь давайте обсудим «Kei.sav»."
90001160-102 = "Я использовала все доступные мне способы, чтобы проанализировать его, но они не дали никаких результатов."
90001160-103 = "Однако ты говоришь, что при уровне технологий Кивотоса именно этого и следовало ожидать."
90001160-104 = "Верно. Я так сказала."
90001160-105 = "И ты сказала, что тебе нужно как можно больше областей данных. Поэтому мы собрали все устройства хранения данных, какие только есть на этой базе."
90001160-106 = "Но если ты собираешься перенести «Kei.sav» в область данных, толку будет немного. Я уже пробовала."
90001160-107 = "Потому что сама область была неподходящей. Для технологии Безымянных богов нужна правильная среда."
90001160-108 = ""
90001160-110 = ""
90001160-111 = "...Пожалуйста, поясни."
90001160-112 = "Если «Kei.sav» действительно является ключом или следом Безымянных богов, он не будет совместим с привычными нам типами хранилищ данных."
90001160-113 = "Если провести аналогию с биологией... ему нужна подходящая для ситуации среда."
90001160-114 = "То есть...?"
90001160-115 = "То есть..."
90001160-118 = ""
90001160-119 = "...Получается, ты приравниваешь это к живому, обладающему сознанием существу?!"
90001160-120 = "Прежняя я отвергла бы определение «живое», однако..."
90001160-121 = "...теперь я уже не уверена, как именно и до какой степени мы вообще способны определить «жизнь». Так что в некотором смысле — да."
90001160-122 = "Если говорить о гомеостазе, обратной связи и самосознании, определённо есть аспекты, которые можно трактовать именно так."
90001160-123 = ""
90001160-125 = ""
90001160-126 = ""
90001160-128 = ""
90001160-130 = ""
90001160-131 = "[ns1] «Токи, Эйми, вы обе невероятны...»\n[ns2] «Я вообще не понимаю, о чём сейчас говорят...»"
90001160-132 = ""
90001160-133 = ""
90001160-135 = ""
90001160-136 = "Не беспокойтесь, Сенсей. Я совершенно не понимаю происходящего."
90001160-137 = "...Но выглядело так, будто я понимаю, что делаю? Спасибо за такие слова."
90001160-138 = "Однако всё, что я знаю, я узнала, наблюдая за Рио. Даже сейчас я лишь выполняю их указания."
90001160-139 = "А поскольку сейчас я закончила выполнять приказы и мне скучно, я требую, чтобы вы со мной поиграли."
90001160-140 = ""
90001160-142 = ""
90001160-143 = "Мм. Даже по моим меркам это была по-настоящему сильная и безупречная фраза, достойная горничной. Пожалуйста, поспешите похвалить меня."
90001160-144 = "А я-то гадала, чем ты занята, Токи. Пытаешься улизнуть и забрать Сенсея целиком себе."
90001160-145 = ""
90001160-147 = ""
90001160-149 = ""
90001160-152 = ""
90001160-153 = ""
90001160-154 = "Сенсей, теперь вы обязаны когда-нибудь поиграть со мной наедине. Это обещание. Возможно, вы его не давали, но я дала. Хорошо?"
90001160-155 = "[s] «Да-да...»"
90001160-156 = ""
90001160-158 = ""
90001160-159 = ""
90001160-161 = ""
90001160-162 = "Возможно, это прозвучит противоречиво из уст всезнающего существа вроде меня—"
90001160-163 = "Подожди. Почему бы тебе не создать НАСТОЯЩУЮ учёную степень и не присвоить её самой себе?"
90001160-164 = "Что за чушь, Эйми? Ты выставляешь меня какой-то хрупкой и жалкой исследовательницей, которую захватил популизм и которая отказалась от своих принципов ради академической славы."
90001160-165 = "Насчёт хрупкой и жалкой я не уверена, но ладно..."
90001160-166 = "Как бы то ни было. Мы вот-вот ступим за горизонт совершенно новой дисциплины, которой в этом мире ещё никогда не касались."
90001160-167 = ""
90001160-169 = ""
90001160-171 = "Именно поэтому я с самого начала пыталась ограничить и контролировать эту область знаний."
90001160-172 = "Человечество слишком часто пытается использовать знания, которых на самом деле не понимает."
90001160-173 = "И потому прошлое повторяется."
90001160-174 = "Да. Прошлое повторяется."
90001160-182 = ""
90001160-183 = "Подготовка... завершена?"
90001160-184 = "Первый этап — да. Но следующий шаг критически важен."
90001160-185 = "Теперь нам нужно перенести Кей в эту область данных..."
90001160-186 = "С нашей стороны ничего особенно сложного делать не нужно. Наша задача — наблюдать."
90001160-187 = "Однако если вдруг... произойдёт что-то неожиданное..."
90001160-188 = ""
90001160-191 = ""
90001160-192 = "Тогда зачем?"
90001160-194 = "Единственный доступный нам вариант — физическая сила."
90001160-196 = "Теперь понятно. Ты оставила этот диск данных открытым внешней среде, чтобы его можно было отключить в любой момент."
90001160-197 = "То есть уничтожить его, если произойдёт что-то странное?"
90001160-199 = "...Если кратко, да."
90001160-200 = ""
90001160-202 = ""
90001160-204 = ""
90001160-205 = "Почему ты так на меня смотришь, Рио?"
90001160-206 = "Я ожидала, что ты станешь возражать против моих методов. Что они слишком варварские, что это так на меня похоже..."
90001160-207 = ""
90001160-209 = ""
90001160-210 = "...Я умею признавать реальность. Даже если говорить скромно, это чистый и элегантный метод."
90001160-211 = "И прежде всего, никто не знаком с силой Безымянных богов так близко, как ты."
90001160-212 = "Я не собираюсь судить или критиковать твою работу в области, в которой ты специалист."
90001160-213 = "...Спасибо."
90001160-215 = "Надеюсь, нам всё же не придётся к этому прибегать."
90001160-216 = "С нашей стороны подготовка завершена. Можете начинать, когда будете готовы."
