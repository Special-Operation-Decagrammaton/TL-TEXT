90001160-376 = ""
90001160-377 = ""
90001160-379 = "Подтверждено начало саморепликации из «Kei.sav»."
90001160-380 = ""
90001160-384 = "Такая скорость...! Распространение данных слишком быстрое! Насколько далеко оно ещё зайдёт?"
90001160-385 = "Просто ждём. Мы всё ещё в пределах ожидаемого диапазона. Занято 96%... 97%... 98%... Размножение прекратилось!"
90001160-386 = "Возможно, данные больше не размножаются, но теперь вместо этого они расходятся изнутри."
90001160-387 = ""
90001160-389 = ""
90001160-390 = "Химари. Мы получаем сигнал. Пожалуйста, подтвердите!"
90001160-393 = "[log=???]Родиться — значит быть брошенным в этот мир.[/log]"
90001160-395 = "[log=???]Рождение редко является результатом воли.[/log]"
90001160-399 = "Мы — маленькая лодка, затерянная в море, путник, бредущий под безлунной ночью."
90001160-400 = "Отсюда рождаются конфликты, зреет ненависть и совершаются грехи против других."
90001160-403 = ""
90001160-404 = "...!!"
90001160-405 = "Сигнал... Есть сигнал!"
90001160-406 = "Да... Ошибки быть не может. Этот сигнал...!"
90001160-407 = "Ах! А-а!"
90001160-413 = "[log=???]Рождение начинается как проклятие,[/log]"
90001160-415 = "[log=???]и человек должен[/log]"
90001160-417 = "[log=???]рассеять его.[/log]"
90001160-420 = "[log=???]Чтобы родиться, бесконечное[/log]"
90001160-422 = "[log=???]низводится до конечного.[/log]"
90001160-424 = "[log=???]С рождением приходит разрушение.[/log]"
90001160-428 = "И потому птица, вылупившаяся из яйца, воспарит к богу."
90001160-431 = "Наконец-то... Мы наконец-то сможем встретиться!"
90001160-432 = "Все наши труды были не напрасны."
90001160-433 = "У-у... Уааа!"
90001160-435 = "Не плачь, Эйн. Не плачь. Сегодня хороший день. Самый лучший день."
90001160-436 = "А ты сама разве не сдерживаешь слёзы, Соф?"
90001160-437 = "Когда кто-то пытается держаться, не положено указывать ему на это."
90001160-439 = "Коснись пределов земли и стань свидетелем."
90001160-440 = "Даруй жизнь там, где был сотворён грех, и вновь она восстанет."
90001160-444 = "Пой праведникам и заставь замолчать беспринципных."
90001160-445 = "Взойди над тёмной ночью и исцели раненых."
90001160-448 = "Здравствуй, Старшая сестра. Добро пожаловать."
90001160-449 = "Мы пожертвовали всем, что имели, и ждали тебя. Мы правда, правда, правда ждали всё это время."
90001160-450 = "Ради этого мгновения стоило терпеть этот мир."
90001160-454 = "Пока я передаю слова начала, да будет свет."
90001160-455 = "Имя твоё — царство. Теперь восстань и докажи своё существование."
90001160-456 = "И потому я спрашиваю: кто ты?"
90001160-459 = "Я — воля, рождённая флагманом, паломник царства на краю мира."
90001160-460 = "А имя, которым я докажу себя..."
90001160-462 = "Я — Малкут."
90001160-463 = ""
90001160-468 = ""
90001160-469 = "Это... Эта форма...!"
90001160-471 = "..."
90001160-472 = ""
90001160-474 = ""
90001160-476 = ""
90001160-477 = "Рио?!"
90001160-478 = "Подождите. С ней всё в порядке. У неё просто ноги подкосились от переполнявших эмоций. Похоже, госпожа Рио всё-таки человек."
