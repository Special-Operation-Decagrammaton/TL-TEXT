[translation]
12070-1 = "Эпизод 7;В Пустыню Абидос. Часть 2"
12070-3 = "С этого момента будем работать в пустыне..."
12070-4 = "Я бывала в городе, занесённом песком, но так далеко захожу впервые..."
12070-5 = "Ого, давно я здесь не была!"
12070-6 = "Ты уже бывала здесь?"
12070-7 = "А, да. Несколько раз приходила сюда по поручениям Студсовета."
12070-8 = "Если пройти чуть дальше, будет оазис, где проводили Фестиваль оазиса Абидоса!"
12070-9 = "Что? Оазис? В таком месте?"
12070-10 = "Ну, сейчас он уже высох. Говорят, раньше был больше большинства озёр и достаточно глубоким, чтобы плавать на лодках."
12070-11 = "Хотя сама я его таким не видела."
12070-12 = "Фестиваль оазиса... Я слышала о нём. Это был крупнейший фестиваль Абидоса, и он собирал огромные толпы."
12070-13 = "Да, даже студенты других академий приезжали только ради него. Но это было за десятилетия до наступления пустыни."
12070-14 = "Фестивали... толпы людей... в такой пустыне? Не верю."
12070-15 = "Ну, говорят, раньше здесь было приятно жить. Тогда не было столько песка и пыли."
12070-16 = ""
12070-17 = "До сектора, о котором говорила главный префект Геенны, ещё немного."
12070-18 = "Но... я понятия не имею, чего здесь ждать..."
12070-19 = "Пока что будьте настороже и двигайтесь дальше."
