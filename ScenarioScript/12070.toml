[translation]
12070-1 = "Episódio 7;Rumo ao Deserto de Abydos (2)"
12070-3 = "Daqui em diante é o deserto abandonado..."
12070-4 = "Eu já tinha ido à área urbana coberta de areia, mas daqui em diante também é a primeira vez para mim..."
12070-5 = "Puxa, faz tempo que não vejo essa paisagem também."
12070-6 = "Você já veio aqui antes, senpai?"
12070-7 = "Sim, algumas vezes antes, a trabalho do Conselho Estudantil."
12070-8 = "Se avançarmos só um pouco mais, lá fica ninguém menos que o oásis onde antigamente acontecia o Festival da Areia de Abydos!"
12070-9 = "Hein, um oásis? Num lugar desses?"
12070-10 = "Sim, bom, agora já secou tudo, né. Dizem que originalmente era maior que qualquer lago comum por aí, grande o suficiente até pra navegar de barco."
12070-11 = "Bem, eu mesma nunca cheguei a ver pessoalmente."
12070-12 = "Festival da Areia... eu também já ouvi falar. Dizem que era um festival famoso em Abydos e que reunia uma multidão enorme."
12070-13 = "Isso mesmo, vinha gente até de outras escolas só pra ver o festival. Bem, isso foi décadas antes da desertificação começar a avançar."
12070-14 = "Nossa... hoje em dia ficou desse jeito, mas acontecia um festival tão incrível assim bem aqui...?"
12070-15 = "Parece que antes essa região até que era um lugar bem bom de se morar. Naquela época não tinha toda essa poeira de areia. Aliás, Ayane-chan, ainda falta muito pro nosso destino?"
12070-17 = "Parece que ainda vai levar um pouco mais de tempo até chegarmos ao setor que a Chefe do Comitê Disciplinar de Gehenna mencionou."
12070-18 = "Pelo que parece, não há nada em especial por aqui..."
12070-19 = "Por enquanto, continuem avançando em alerta."
