[translation]
1013302-1 = "Что такое робот-горничная?"
1013302-2 = "Я начал задумываться, поддерживает ли Рио порядок в своей комнате."
1013302-3 = "Забеспокоившись, я решил заглянуть к ней."
1013302-4 = ""
1013302-9 = ""
1013302-10 = "Сенсей? Что вас сюда привело?"
1013302-11 = "[ns1] «...О?»\n[ns2] «Ого-о-о!»"
1013302-14 = "...?"
1013302-15 = "[ns3] «Какая чистая комната!»\n[ns4] «Я так тобой горжусь, Рио!»"
1013302-18 = "А, понятно. Вы переживали за меня."
1013302-19 = "Не волнуйтесь. Теперь мне помогает убираться один друг."
1013302-20 = "Позвольте представить вам Домработника Avant Guard."
1013302-21 = ""
1013302-23 = ""
1013302-25 = "Внешне он похож на предшественника, но эту версию я модифицировала специально для домашних дел."
1013302-26 = "Ну как? Отлично, правда?"
1013302-27 = "[ns] «То есть сама ты вообще не убиралась...»"
1013302-28 = ""
1013302-30 = "Если уборку выполнил Avant Guard, которого создала я, разве это не то же самое, что я убралась сама?"
1013302-31 = "В любом случае испытание прошло очень успешно."
1013302-32 = "Я собираюсь пользоваться Домработником Avant Guard и после возвращения в академию."
1013302-33 = "Если получится, неплохо было бы наладить массовое производство и распространение."
1013302-34 = "[s] «Если планируешь массовое производство, обычный робот-горничная был бы лучше!»"
1013302-35 = "Робот-горничная...?"
1013302-36 = "Робот-горничная — это робот, который помогает с уборкой и другими домашними делами, верно?"
1013302-37 = "В таком случае разве Домработник Avant Guard..."
1013302-38 = "...уже не является превосходным роботом-горничной?"
1013302-39 = "...Хм? Вы выглядите неубеждённым."
1013302-40 = "А. Точно. Мне не хватает самого важного элемента горничной."
1013302-41 = "Униформы."
1013302-42 = "В таком случае перед началом массового производства я надену на Домработника Avant Guard форму горничной."
1013302-43 = "[s] «Подожди секундочку!!»"
1013302-44 = "Хм? Что такое?"
1013302-45 = "Разве форма горничной не решает проблему?"
1013302-46 = "[s] «Я пытаюсь сказать, что было бы здорово изменить его внешний вид!»"
1013302-47 = ""
1013302-49 = ""
1013302-50 = "Пожалуйста, объясните подробнее."
1013302-51 = "Как, по-вашему, должен выглядеть робот-горничная, Сенсей?"
1013302-52 = "[s] «Мило и очаровательно!»"
1013302-53 = "Разве Avant Guard... не милый и очаровательный?"
1013302-54 = "[s] «И иметь грациозную, элегантную осанку!»"
1013302-55 = "Опять же, у Avant Guard она тоже есть... с определённой точки зрения."
1013302-56 = "[s] «Надёжное существо, способное на всё!»"
1013302-57 = "То есть... вроде Avant Guard?"
1013302-58 = "[s] «И-и в милой форме горничной!»"
1013302-59 = "Разве мы уже не обсудили его одежду?"
1013302-60 = "Но Avant Guard превосходит остальных даже в этом аспекте."
1013302-61 = "Например, C&C тоже носит форму горничных. Но поскольку они не роботы, их нельзя назвать «роботами-горничными»."
1013302-62 = "Даже если надеть форму горничной на Арис, она не станет «роботом-горничной». Она человек, а не робот."
1013302-63 = "А вот Домработник Avant Guard — РОБОТ."
1013302-64 = "Следовательно, если надеть на Домработника Avant Guard форму горничной..."
1013302-65 = "он станет лучшим роботом-горничной из существующих."
1013302-66 = "[s] «(В-В этом... есть логика...!)»"
1013302-67 = "...Похоже, мы зашли в тупик."
1013302-68 = "Я не знала, что наши вкусы настолько сильно различаются."
1013302-69 = "Давайте соберём больше данных у остальных."
1013302-70 = "Можно надеть на Avant Guard форму горничной и спросить мнение у всех."
1013302-71 = "Форма горничной и робот..."
1013302-72 = "Объединяются и становятся... роботом-горничной..."
1013302-73 = "Всем придётся признать эту неопровержимую истину."
1013302-74 = "[s] «И где ты собираешься найти форму горничной...?»"
1013302-75 = "Может, у Токи найдётся одна-две запасных формы?"
1013302-76 = "[s] «Форма Токи на эту штуку не налезет!!»"
1013302-77 = "Тогда я модифицирую Avant Guard так, чтобы налезла."
1013302-78 = "Значит, нужно пойти одолжить у Токи форму горничной."
1013302-79 = "До встречи."
1013302-80 = ""
1013302-82 = ""
1013302-83 = "[ns] «Она говорит совершенно серьёзно...»"
1013302-85 = "Мне стало... болезненно любопытно, чем закончится эта затея."
