[translation]
1000508-1 = "Как поймать удачу"
1000508-2 = "Торговый центр на окраине D.U."
1000508-3 = ""
1000508-4 = "После долгой прогулки Хошино наконец купила книгу, которую хотела."
1000508-5 = "Спасибо, что хорошо провели со мной время сегодня, Сенсей."
1000508-6 = "Мой городок далеко в провинции, поэтому такие новые издания найти сложно."
1000508-7 = ""
1000508-8 = "Та-дам! Специальный выпуск журнала «Любители воды»! В комплекте твёрдый справочник на две тысячи видов тропических рыб!"
1000508-9 = "И за всю эту информацию всего 1000 иен. Да они практически ОТДАЮТ её даром!"
1000508-10 = "Не терпится заглянуть. Давайте найдём внутри место, где можно присесть. Любое подойдёт!"
1000508-12 = "[s] Последовать за ней."
1000508-14 = "Ух ты, вы только посмотрите! Статья о том, как самостоятельно выращивать морских ежей."
1000508-15 = "Правда, я слышала, что морские аквариумы очень сложно содержать. Хм."
1000508-16 = "[s] «Ты и правда любишь рыб, да, Хошино?»"
1000508-17 = "Ну, я бы хотела когда-нибудь завести своих... но мне и просто смотреть на них нравится."
1000508-18 = ""
1000508-19 = "..."
1000508-20 = "Немного по-детски... правда? Не так уж много людей моего возраста увлекаются чем-то подобным..."
1000508-21 = "[s1] «Не думаю, что это важно.»\n[s2] «Увлечения не зависят от возраста.»"
1000508-22 = "...Хе-хе."
1000508-23 = "...Хе-хе."
1000508-24 = "О, смотрите, Сенсей. На обратной стороне есть стираемый билет!"
1000508-25 = "«Празднование грандиозного открытия аквариума. Бесплатный вход максимум для 30 человек». ...Ч-Что-о-о?! Это то, о чём я думаю?"
1000508-26 = "Аквариум — это ведь...?"
1000508-27 = "[s] «Место с огромными резервуарами, полными самых разных рыб.»"
1000508-28 = "Там самые разные рыбы?!"
1000508-29 = "...!"
1000508-30 = "Т-То есть здесь написано, что можно выиграть два билета по 15 000 иен каждый?"
1000508-31 = "Мне нужно лишь стереть слой с этого лотерейного билета...? Подождите!"
1000508-32 = "М-Мне нужна монетка..."
1000508-33 = ""
1000508-34 = "С-Сенсей! Пожелайте мне удачи!"
1000508-35 = "[s3] «Вперёд!»\n[s4] «Удачи!»"
1000508-36 = "(скребёт)"
1000508-37 = "(скребёт)"
1000508-38 = "(скребёт) (скребёт)"
1000508-39 = "(скребёт) О."
1000508-40 = "[s5] «Ты победила?»\n[s6] «Что случилось?»"
1000508-41 = "Не выиграла..."
1000508-42 = "Не выиграла..."
1000508-43 = "Хм... Я так и знала, что всё слишком хорошо, чтобы быть правдой."
1000508-44 = "..."
1000508-45 = "Ладно. Пойдёмте, Сенсей."
1000508-46 = "Сегодня всё равно был хороший день. Мы погуляли вместе, и я купила книгу, которую хотела!"
1000508-47 = "[s] Отвести Хошино в книжный магазин."
1000508-48 = "А? Ч-Что вы делаете, Сенсей? Куда мы идём?"
1000508-51 = "..."
1000508-52 = "Я купил ещё пятьдесят экземпляров того же журнала."
1000508-53 = "Сенсей, вы пытаетесь...?"
1000508-54 = "[s] «Сдаваться ещё рано! Стирай, пока не сорвёшь джекпот!»"
1000508-55 = "..."
1000508-56 = "Раз вы настаиваете! Вы здесь главный, кто я такая, чтобы спорить?"
1000508-57 = "Я выиграю этот приз, даже если придётся стереть 30 билетов!"
1000508-58 = "ХААААААА!"
1000508-60 = "К счастью, на 38-й попытке мне выпал приз, и я отдал выигрышный билет Хошино."
1000508-61 = "У меня осталось ещё пятьдесят журналов, поэтому я решил пожертвовать их библиотеке Шале."
