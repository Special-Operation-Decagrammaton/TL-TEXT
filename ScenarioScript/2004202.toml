[translation]
2004202-1 = "Сгребая листья"
2004202-2 = "Учебный центр Миллениума"
2004202-3 = "Несмотря на выходные, я отправился в Миллениум помочь Маки сгребать листья — это было её волонтёрское поручение."
2004202-4 = ""
2004202-6 = ""
2004202-7 = ""
2004202-8 = ""
2004202-9 = ""
2004202-10 = ""
2004202-11 = "А, Сенсей. Вы правда пришли помочь!"
2004202-12 = "Спасибо, что пришли. Если бы мне пришлось одной убирать весь этот огромный учебный центр, я бы тут застряла навечно."
2004202-13 = "[s1] «Я не смогу помогать слишком долго...»\n[s2] «Но до обеда могу побыть с тобой.»"
2004202-16 = "Не переживайте. Уже одно ваше присутствие очень помогает, Сенсей."
2004202-17 = "Ц, в отличие от вас, остальные из Веритас сделали вид, что не заметили, когда я попросила их помочь."
2004202-18 = "Чихиро отказала мне, сказав, что я не осознаю свои ошибки как следует, если не сделаю всё сама."
2004202-19 = "А Харе и Котама просто отказались, потому что на улице холодно."
2004202-20 = "[s] «На этой неделе и правда внезапно похолодало.»"
2004202-22 = "[ns] «Поэтому ты так тепло оделась?»"
2004202-23 = "Ага. Если надеть мой обычный наряд, я могу простудиться."
2004202-24 = "Хотя холод и правда пришёл ни с того ни с сего. Клянусь, ещё вчера на улице было жутко жарко."
2004202-25 = "Но теперь деревья готовятся к зиме, а осенние листья, которые раскрашивали кампус, уже все опали. Время летит."
2004202-26 = "Эм, и такими темпами наступит Новый год, прежде чем я успею собрать все эти листья."
2004202-27 = "Начнём?"
2004202-28 = ""
2004202-30 = ""
2004202-31 = ""
2004202-32 = ""
2004202-33 = "После этого мы с Маки усердно сгребали все опавшие листья."
2004202-35 = "Примерно час спустя..."
2004202-37 = "Мы справляемся быстрее, чем я ожидала!"
2004202-38 = ""
2004202-40 = ""
2004202-41 = "Смотрите, Сенсей! Куча листьев уже почти с меня ростом!"
2004202-42 = "Хи-хи, а из-за разных цветов она выглядит как какая-то супер-крутая художественная скульптура!"
2004202-43 = "Если подумать, осенние листья довольно классные."
2004202-44 = "У большинства живых организмов в природе цвета неяркие, а осенние листья настолько красочные, что их легко заметить даже издалека."
2004202-45 = "Представьте, каким красочным был бы мир, если бы у диких животных были такие же яркие цвета, как у осенних листьев..."
2004202-46 = "Почему всё вокруг обычно таких скучных, тусклых цветов?"
2004202-47 = "[s] «Наверное, потому что слишком сильно выделяться было бы проблематично.»"
2004202-48 = "Проблематично? В каком смысле?"
2004202-49 = "[s3] «Яркие цвета могут привлечь нежелательных гостей.»\n[s4] «Например, соперников и хищников...»"
2004202-52 = "М-м... Если подумать, возможно, вы правы. Яркая внешность иногда действительно привлекает нежелательных гостей."
2004202-53 = "Это как с моими более броскими тегами для граффити или даже хакинга: тогда больше людей пытаются бросить мне вызов. Они закрашивают мои граффити или анонимно пытаются меня взломать."
2004202-54 = "Может, в ярких цветах есть что-то такое, что будит в людях дух соперничества?"
2004202-55 = "[s5] «Но яркие цвета привлекают не только нежелательных гостей...»\n[s6] «Вспомни красивые цветы или павлиньи перья.»"
2004202-58 = "Тоже верно. Если бы я скрывала свои цвета и сидела взаперти, я бы не встретила многих замечательных людей, которые сейчас есть в моей жизни."
2004202-59 = "Из-за граффити мне попадались и неприятные типы, но большинство людей, которых я встретила, были хорошими."
2004202-60 = "Вообще-то, если бы не граффити, я бы даже не познакомилась со всеми из Веритас."
2004202-61 = "[s] «А мне нравятся твои ярко-красные волосы.»"
2004202-62 = "Ч-Что...?"
2004202-63 = "[ns7] «Когда я вижу твою рыжую голову в толпе...»\n[ns8] «Твоя живая энергия сразу поднимает мне настроение.»\n[ns9] «Может, это чем-то похоже на твои граффити?»"
2004202-67 = "Э-это случайно не значит, что..."
2004202-68 = "Нет. Я понимаю, что вы хотите сказать, но— А-А-А?!"
2004202-69 = ""
2004202-71 = ""
2004202-73 = "[ns] «Ты в порядке, Маки?»"
2004202-74 = ""
2004202-75 = "Я-я в порядке. Просто неудачно шагнула и... упала прямо на кучу листьев."
2004202-76 = "Уф, но теперь все листья, которые мы собрали, снова разлетелись."
2004202-77 = "[s10] «Но теперь мы наверняка быстро соберём их снова.»\n[s11] «Красные осенние листья ведь видно отовсюду.»"
2004202-80 = ""
2004202-82 = ""
2004202-83 = "...Да."
2004202-84 = "Спасибо, что сказали это, Сенсей."
