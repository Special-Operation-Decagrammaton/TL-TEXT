[translation]
1008602-1 = "Хина и платье 1"
1008602-2 = "Здравствуйте, Сенсей. Я пришла."
1008602-3 = "[s1] «Заходи, Хина. Хочешь что-нибудь выпить?»\n[s2] «Кофе? Чёрный чай? О, кажется, у нас ещё есть улун и кола...»"
1008602-6 = "Мне кофе."
1008602-7 = "[s] «Хорошо, предоставь это мне!»"
1008602-8 = ""
1008602-11 = "Хм. Вот я снова в офисе Шале."
1008602-12 = "Кажется, будто я не была здесь целую вечность."
1008602-13 = "[s] «Да, твой визит — довольно неожиданный, но я ему рад!»"
1008602-14 = "Ой, перестаньте. Ничего особенного..."
1008602-15 = ""
1008602-17 = ""
1008602-18 = "Хм? Это что... старые стаканчики от лапши на вашем столе?"
1008602-19 = "И не только... Я вижу разбросанные носки... Раковина забита посудой..."
1008602-20 = "И совершенно новая игрушка?"
1008602-21 = "[s] «Я могу объяснить...»"
1008602-22 = "...Сенсей."
1008602-23 = "[s3] «Слушай, в последнее время работа просто чуточку совершенно меня завалила.»\n[s4] «Рано или поздно я всё уберу. Обещаю!»"
1008602-26 = "О, нет. Я не хотела вас ругать, Сенсей."
1008602-27 = "Я знаю, как легко закрутиться в повседневной суете и перестать следить за порядком."
1008602-28 = "...И это нормально. Мне совершенно всё равно. Ни капли не волнует."
1008602-29 = "Но через Шале могут проходить студенты, и они могут... Это хороший шанс подать им пример!"
1008602-30 = "[s] «Ух! Ты права. Нужно прибраться.»"
1008602-31 = "Если вы не против, может, я буду время от времени заходить в Шале и помогать вам с уборкой?"
1008602-32 = "Если позволите самой так сказать, в офисах Префекторской команды я поддерживаю безупречный порядок."
1008602-33 = "Конечно, только если вы не против."
1008602-34 = "[s5] «Нет, у тебя есть дела поважнее.»\n[s6] «Я не могу просить главу Префекторской команды убираться за мной.»"
1008602-37 = "Вот как?"
1008602-38 = "..."
1008602-39 = ""
1008602-41 = ""
1008602-42 = "Вы уверены? Точно?"
1008602-43 = "[s] «Эм... Хина... я что-то не то сказал?»"
1008602-44 = "Сказали? Я ничего не слышала."
1008602-45 = "...Итак, перейдём к делу, Сенсей."
1008602-46 = "[s] «С-Сейчас же!»"
1008602-47 = "Кхм..."
1008602-48 = "Вообще-то сегодня я хотела кое-что обсудить."
1008602-49 = "Общество Пандемониума организует огромную вечеринку для всей Геенны. Разумеется, в последний момент."
1008602-50 = "[s] «Не думал, что в Геенне вообще устраивают вечеринки...»"
1008602-51 = "Это будет светский приём для всех важных персон Геенны и Кивотоса в целом."
1008602-52 = "Откровенно говоря, я не думаю, что посещение стоит всей этой головной боли."
1008602-53 = "...Однако это публичное мероприятие. Я всё-таки лидер, и моих подчинённых может обеспокоить, если меня там не будет."
1008602-54 = "Так что мне стоит хотя бы показаться."
1008602-55 = "...Как бы сильно меня это ни раздражало."
1008602-56 = ""
1008602-58 = ""
1008602-59 = "Нужно делать то, что необходимо. Даже если это ОЧЕНЬ раздражает."
1008602-60 = "[s] «(Если это её раздражённое лицо, не хотел бы я видеть её по-настоящему злой.)»"
1008602-61 = "И вопрос в том... Ну... Ненавижу это признавать..."
1008602-62 = "Я не особо светский человек, поэтому понятия не имею, чего ожидать..."
1008602-63 = "Мне нужно подготовиться к вечеринке, но я даже не знаю, с чего начать."
1008602-64 = "Поэтому я пришла к..."
1008602-65 = "Я понимаю, что это несколько ниже моего достоинства. Глава Префекторской команды не должна цепляться за своего Сенсея и просить помощи по каждой мелочи..."
1008602-66 = "Но..."
1008602-67 = "[s] «Не стесняйся, Хина. Я рад, что ты мне доверяешь.»"
1008602-68 = "О. Правда?"
1008602-69 = "[s] «Хм, дел много, но есть одна вещь, которая совершенно необходима на любом светском мероприятии...»"
1008602-71 = "[ns] «У тебя есть вечернее платье?»"
1008602-72 = "Платье...?"
1008602-73 = "[s7] «О, но сначала убедись, что понимаешь TPO: время, место и повод.»\n[s8] «Хотя это довольно очевидно. Извини, если ты и так знала.»"
1008602-76 = "Ух. Нет, всё нормально."
1008602-77 = "Это настолько очевидно, что я даже не подумала об этом."
1008602-78 = "Представляю, как неуместно я буду выглядеть на вечеринке в обычной форме Префекторской команды."
1008602-79 = "Мне определённо понадобится «вечернее платье.»"
1008602-80 = "Хм, но ведь одним платьем не обойтись, верно? Нужны подходящие аксессуары... О, и обувь... Хм, может, ещё сделать причёску?"
1008602-81 = "Спасибо, Сенсей. Кажется, у меня уже складывается план."
1008602-82 = "[s] «Рад помочь.»"
1008602-84 = "[ns] «Тебе помочь выбрать платье?»"
1008602-85 = "Хм? О, нет. Если речь только о платье, покупать новое не придётся."
1008602-87 = "[ns] «Платье лежит на складе?»"
1008602-88 = "Да. На складе, которым я пользуюсь."
1008602-89 = "Я храню там личные вещи и то, чем редко пользуюсь."
1008602-90 = "Где-то здесь должно быть платье."
1008602-91 = "[s] «Почему у меня такое чувство дежавю?»"
1008602-92 = "Одежду я храню на этой стойке... Стоп, нет."
1008602-93 = ""
1008602-95 = ""
1008602-96 = "Может, здесь?"
1008602-97 = "Ах."
1008602-98 = ""
1008602-101 = "[ns] «Нашла, Хина?»"
1008602-103 = ""
1008602-105 = "...Ах."
1008602-106 = "[s] «...Эм, Хина, это не платье. Это балетная пачка. Дай я—»"
1008602-107 = "Н-Не беспокойтесь об этом, Сенсей! Одежду я сама достану."
1008602-108 = ""
1008602-111 = ""
1008602-112 = ""
1008602-113 = "...Фух. Продолжим поиски?"
1008602-114 = "[s] «Ты стесняешься своей старой одеж—?»"
1008602-115 = "ПРОДОЛЖИМ поиски, Сенсей?"
1008602-116 = "[s] «Д-Да...»"
1008602-117 = ""
1008602-119 = ""
1008602-120 = "Фух. На этой стороне ничего нет... Посмотрим с другой..."
1008602-121 = ""
1008602-123 = ""
1008602-124 = "Тут точно должно что-то быть..."
1008602-125 = "Ах."
1008602-126 = ""
1008602-129 = "[ns] «У этого платья интересный фасон.»"
1008602-132 = "[ns] «Подожди. Кажется, это спортивный костюм...»"
1008602-133 = "О, так вот где он был. Я давно его потеряла."
1008602-134 = "[s] «...»"
1008602-135 = ""
1008602-138 = ""
1008602-140 = ""
1008602-141 = ""
1008602-142 = "Ч-Что вы сейчас делали, Сенсей?!"
1008602-143 = "[s] «А! Э-Эм! ...Ничего особенного?»"
1008602-144 = "Вы держали эту одежду... слишком близко к лицу..."
1008602-145 = "Неважно, п-просто положите её!"
1008602-146 = "Простите... Возможно, я слишком остро отреагировала."
1008602-147 = "[s9] «То есть...»\n[s10] «Может, и нет?»"
1008602-148 = "Ч-что?!"
1008602-149 = "*вздох* Рядом с вами нельзя терять бдительность."
1008602-150 = "Хорошо..."
1008602-151 = "...Отныне просто сосредоточимся на поиске платья. С одеждой разберусь я."
1008602-152 = "И будем надеяться, что больше никаких неловких нарядов не найдётся..."
1008602-154 = "Мы продолжили рыться на складе. В конце концов нашли то, что искали."
1008602-156 = "А! Вот оно."
1008602-157 = "Смотрите, Сенсей. Когда-то это было моё любимое платье."
1008602-158 = ""
1008602-160 = ""
1008602-162 = "Теперь не придётся тратить деньги на новое."
1008602-163 = "[s] «Хм. Хина. Меня кое-что беспокоит...»"
1008602-164 = "Подождите здесь. Я примерю его."
1008602-165 = "Когда вернусь, скажете, что думаете."
1008602-166 = "[s] «Конечно, но мне кажется, оно—»"
1008602-167 = "Тогда я пошла."
1008602-168 = ""
1008602-170 = ""
1008602-171 = "Так, вот так... Теперь отсюда..."
1008602-172 = "М-м. Может, если просто..."
1008602-173 = "...Почему... оно не налезает...?"
1008602-174 = ""
1008602-177 = "...Ах."
1008602-178 = "[s] «Хина?! Ты в порядке?! Я слышал, как что-то порвалось!»"
1008602-179 = "Я-я в порядке! Ничего серьёзного!"
1008602-180 = "...Я слишком сильно потянула и порвала платье..."
1008602-181 = "[s] «Это очень серьёзно!»"
1008602-182 = "С-Стойте на месте! И продолжайте смотреть в стену! Нельзя, чтобы вы увидели меня в таком виде!"
1008602-183 = "Если хоть раз взглянете, я никогда вас не прощу!"
1008602-184 = "[s] «Есть, мэм.»"
1008602-188 = "...Господи. Сначала мне пришлось буквально в него врываться, а потом так же вырываться обратно."
1008602-189 = "Я ведь и раньше несколько раз надевала старую одежду, так что не понимаю, почему..."
1008602-190 = "Неужели я выросла и сама не заметила?"
1008602-191 = "[s] «Хина, просто из любопытства... когда ты в последний раз надевала это платье?»"
1008602-192 = "Хм? Кажется, на какой-то рождественской вечеринке в начальной школе."
1008602-193 = "Во втором классе, наверное?"
1008602-194 = "[s] «Да одежда, которую ты носила тогда, никак не может подойти тебе сейчас!»"
1008602-195 = "П-Правда?"
1008602-196 = "Взрослеть трудно..."
1008602-197 = "...Что же теперь делать?"
1008602-198 = "[s] «Хина, послушай. Может, просто пойдём в магазин и купим тебе платье?»"
1008602-199 = "...Мы вдвоём?"
1008602-200 = "Хм-м. Если надо... Мне действительно нужно подготовиться к вечеринке..."
1008602-201 = "И вы ведь проделали весь этот путь..."
1008602-202 = "Но я... Хм... Хорошо. Сенсей, я знаю, что вы заняты, но поможете мне купить платье?"
1008602-203 = "[s] «Конечно! Просто оставь это мне!»"
1008602-204 = "Д-Да... Спасибо."
1008602-205 = "Позже..."
1008602-206 = ""
1008602-208 = ""
