[translation]
2600206-1 = "То, что под силу даже новичку"
2600206-2 = "Столовая Геенны №8"
2600206-3 = "Я и не заметил, как наступили выходные."
2600206-4 = "Как и обещал Юри, я пришёл в студенческую столовую."
2600206-5 = ""
2600206-9 = ""
2600206-10 = "О, Сенсей! Я так рада, что ты наконец пришёл!"
2600206-11 = "[s1] «Спасибо за ожидание. Каков план?»\n[s2] «...Что всё это такое, Джури?»"
2600206-14 = "О, ты про это?"
2600206-15 = ""
2600206-17 = ""
2600206-19 = "Разве не очевидно? Лопата, серп и молоток!"
2600206-20 = "[s] «Да, но что ты собираешься делать со всем этим...?»"
2600206-21 = "Ну, лопатой копать — БУХ, серпом резать — ВЖУХ, а молотком колотить — БАХ!"
2600206-22 = "А! Не переживай. Это далеко не все инструменты."
2600206-23 = "У меня ещё куча разных."
2600206-24 = ""
2600206-26 = ""
2600206-28 = "Так что можешь не беспокоиться, что нам чего-то не хватит, Сенсей."
2600206-29 = "Доверь дело Юри из Клуба школьного питания!"
2600206-30 = "[s] «Погоди-погоди. Какое ещё „дело“ ты собралась делать...?!»"
2600206-31 = "О. Разве не очевидно?"
2600206-32 = "Садоводство!"
2600206-34 = "Я пошёл за Юри к задней стороне студенческой столовой Геенны."
2600206-35 = "Она привела меня в большой огород, где росло множество разных продуктов."
2600206-36 = "Хи-хи. Нравится?"
2600206-37 = "Это гордость Клуба школьного питания — наш огород!"
2600206-38 = "[s3] «Ух ты... Не верится, что ты всё это вырастила.»\n[s4] «Но почему за столовой такой сад?»"
2600206-41 = "Ну, понимаешь... У Клуба школьного питания всегда туго с бюджетом, а достать достаточно продуктов для сотен и сотен обедов очень непросто..."
2600206-42 = "Поэтому мы решили выращивать часть ингредиентов сами!"
2600206-43 = "К тому же совсем рядом с Геенной есть вулкан."
2600206-44 = ""
2600206-46 = ""
2600206-47 = ""
2600206-49 = "Из-за него почва у нас очень плодородная!"
2600206-50 = "Сажаешь семена, поливаешь, подрезаешь, когда нужно, и — та-дам! Словно магия!"
2600206-51 = ""
2600206-53 = ""
2600206-56 = "А теперь мы можем использовать самые свежие овощи и продукты прямо с грядки, которые вырастили своими руками!"
2600206-57 = "Хи-хи. Разве не потрясающе?"
2600206-58 = "[s5] «Да, он почти так же удивителен, как ты.»\n[s6] «Ты прямо сияешь, когда говоришь об этом, Джури.»"
2600206-61 = "Ч-Что?! П-Правда? Ты так думаешь?"
2600206-62 = "Хи-хи. Наверное, ты прав. Готовка всегда будет для меня главным, но садоводство я тоже очень люблю."
2600206-63 = "Мне ещё далеко до мастерства в готовке... Я пока не могу приготовить такое блюдо, чтобы все с первого кусочка сказали: «Вкусно!»..."
2600206-64 = "Но я подумала, что хотя бы могу помочь нам добывать качественные ингредиенты дешевле."
2600206-65 = "Хорошие продукты вкусны ещё до готовки! Именно это я и хотела дать Клубу школьного питания."
2600206-66 = "Это не значит, что я отказалась от мечты стать великим поваром! Просто я хотела уже сейчас сделать то, что могу с моими нынешними навыками, чтобы студенты были счастливее и здоровее."
2600206-67 = "[s] «Ага. Я был прав. Ты правда потрясающая, Юри.»"
2600206-68 = "Я-я...?! Потрясающая? Я-я всего лишь обычный студент..."
2600206-69 = "Я просто хотела хоть чем-то помочь, раз я всё ещё начинающий повар."
2600206-70 = "Н-Но услышать от тебя такой огромный комплимент, Сенсей..."
2600206-71 = "Ч-Что же мне делать?!"
2600206-72 = "Н-Неважно! Мы здесь по делу!"
2600206-73 = "Давай займёмся садом! Перед началом я-я принесла тебе соломенную шляпу, нарукавники и солнцезащитный крем! Обязательно воспользуйся."
2600206-74 = ""
2600206-76 = ""
2600206-78 = "Т-Тогда начнём, Сенсей?"
2600206-81 = "― А. Смотри, Сенсей.[wa:2200]"
2600206-84 = "― Этот спелый помидор[wa:1040]"
2600206-85 = "― выглядит очень вкусно, правда?[wa:960]"
2600206-88 = "― Хи-хи. Всё это результат труда всех из Клуба школьного питания.[wa:480]"
2600206-89 = "― Не зря мы столько работали над этим огородом![wa:2000]"
2600206-92 = "― О, помидоры вон там тоже выглядят отлично...[wa:1480]"
2600206-95 = "[ns] «А? Где?»"
2600206-96 = "― Эм, ну, там, н-но...[wa:3400]"
2600206-97 = "― Мы сейчас не слишком близко друг к другу...?[wa:5240]"
2600206-100 = "― Если ты так близко, то, эм, ну...[wa:4160]"
2600206-103 = "― (Ах! Сенсей так близко, что я чувствую его запах...)[wa:2400]"
2600206-104 = "― (П-Почему-то сердце забилось быстрее...!)[wa:4920]"
2600206-107 = "[ns] «Юри... Ты вся покраснела. Тебе жарко?»"
2600206-108 = "― Я-я в порядке! Н-Не волнуйся...![wa:2700]"
2600206-111 = "― Просто, понимаешь... Эм...[wa:4760]"
2600206-112 = "― Моё лицо так горит... И-и-и...![wa:7820]"
2600206-115 = "Мы довольно долго работали в саду вместе."
2600206-116 = "Обычно Юри была очень сосредоточена на работе, но сегодня постоянно отвлекалась и ёрзала."
2600206-117 = "[ns] «Эй, Юри...?»"
2600206-118 = "(Я всё время работаю в саду, но рядом с Сенсеем это совсем другое чувство... сердце просто выпрыгивает из груди...)"
2600206-119 = "Так вот, эм... Дело в том..! Понимаешь!"
2600206-120 = "Ч-Что...?!"
2600206-121 = "А-а! Мне нужно пространство — то есть вода! Нам нужна вода для растений! Д-Да. Я схожу принесу!"
2600206-122 = ""
2600206-124 = ""
2600206-126 = "После того как Юри поспешно убежала, я некоторое время ухаживал за огородом один. Почему-то возвращалась она очень долго."
