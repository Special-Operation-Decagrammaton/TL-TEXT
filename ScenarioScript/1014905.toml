[translation]
1014905-1 = "Diver and Miso Soup"
1014905-2 = "(The next morning. Since the weather was rough from the morning, I worried and headed to Kokoro's diving spot.)"
1014905-3 = "(By the time I reached the coast, the waves had calmed down. Kokoro surfaced looking more tired than usual.)"
1014905-8 = "Ugh, diving on a day like this is the absolute worst..."
1014905-9 = "Oh, Sensei?"
1014905-10 = "What brings you here today?"
1014905-11 = "Is there some kind of emergency?"
1014905-12 = "[s1] \"Not really, I was just worried about you, Kokoro.\"\n[s2] \"The sea has been rough since this morning.\""
1014905-15 = "Ah... You were thinking of me."
1014905-16 = "Thank you for coming all this way... But I am fine."
1014905-17 = "The waves have calmed down now, and... I prepared thoroughly just in case."
1014905-18 = "I set up a descent line so I would not lose my sense of direction, and I applied anti-fog to my goggles. Plus--"
1014905-19 = "I even prepared a marker buoy for emergencies!"
1014905-20 = "[s] \"As expected, you are very thorough.\""
1014905-24 = "[ns3] \"Still, on a day like this, you will catch a cold...\"\n[ns4] \"You should warm up by the stove quickly.\""
1014905-27 = "Oh... Thank you."
1014905-28 = "If I had known Sensei was coming, I would have..."
1014905-33 = "Ah... Sensei!"
1014905-34 = "Um... Have you had lunch yet?"
1014905-35 = "Actually... I made some miso soup to drink when I got back. #nIt is just... there is too much for me alone."
1014905-36 = "If you do not mind... Would you like to eat with me?"
1014905-37 = "[s5] \"Really?\"\n[s6] \"I was just getting hungry!\""
1014905-40 = "Please wait a moment. I will go warm it up right away."
1014905-41 = "[s7] \"Huh? But did not you say before...?\"\n[s8] \"That you hate miso soup...\""
1014905-44 = "Eh? Me...?"
1014905-45 = "No, I do not hate miso soup--"
1014905-49 = "...Ah!"
1014905-50 = "I am sorry. I did not explain well enough."
1014905-51 = "The \"miso soup\" I mentioned then is diver slang..."
1014905-52 = "When the sea gets murky from currents or heavy rain and visibility drops, we call it \"miso soup.\""
1014905-53 = "Because the sea stirred up with floating debris turns brown and murky, just like miso soup..."
1014905-54 = "[s9] \"I see!\"\n[s10] \"Now that you mention it, it does look like miso soup!\""
1014905-57 = "I should have avoided using confusing words..."
1014905-58 = "I am sorry for making you misunderstand..."
1014905-59 = "[s] \"It is fine. Do not worry about it.\""
1014905-63 = "[ns] \"So you actually do like the kind of miso soup you \"drink,\" Kokoro?\""
1014905-64 = "Yes!"
1014905-65 = "Drinking miso soup after coming out of the cold sea on a bad weather day is--just the best."
1014905-66 = "The gentle warmth spreading through, and the rich flavor soaking into a tired body... #nIt is addictive..."
1014905-67 = "Sometimes, I look forward to the miso soup after the dive even more than the dive itself."
1014905-68 = "[s] \"Hearing you say that makes me look forward to it even more.\""
1014905-72 = "Ah, it looks like it is ready."
1014905-73 = "I will pour some into a bowl."
1014905-77 = "[wa:3540]-- [log=코코로]Haa... [wa:1820]So warming...[/log]"
1014905-79 = "-- [log=코코로]This cup after coming up to the surface... [wa:2310]is exceptional.[/log]"
1014905-82 = "[wa:500]-- [log=코코로]Ah... [wa:1480]Is it to your liking, Sensei?[/log]"
1014905-84 = "-- [log=코코로]Is the flavor too strong, [wa:1720]or too weak...?[/log]"
1014905-87 = "[wa:2380]-- [log=코코로]I am glad...[/log]"
1014905-89 = "-- [log=코코로]...The secret ingredient, [wa:1440]you ask?[/log]"
1014905-92 = "-- [log=코코로]There is nothing special about it...[/log]"
1014905-94 = "-- [log=코코로]I just made it following a recipe I found online.[/log]"
1014905-97 = "-- [log=코코로]Removing the grit from the clams...[/log]"
1014905-99 = "-- [log=코코로]And skimming the scum...[/log]"
1014905-102 = "[wa:520]-- [log=코코로]Ah, [wa:1040]but... [wa:1640]I suppose.[/log]"
1014905-105 = "-- [log=코코로]Thinking of the person who would drink it,[/log]"
1014905-107 = "-- [log=코코로]I did make it more carefully than usual--[/log]"
1014905-110 = "[wa:1230]-- [log=코코로]Ah... [wa:630]J-, [wa:720]just kidding.[/log]"
1014905-113 = "[wa:800]-- [log=코코로]Eh? [wa:1710]You want to drink the miso soup I make [wa:2930]every morning...?[/log]"
1014905-116 = "-- [log=코코로]S-, [wa:430]Sensei... [wa:1440]What does that...[/log]"
1014905-119 = "[wa:460]-- [log=코코로]Ah, [wa:346]no...[/log]"
1014905-121 = "-- [log=코코로]I-, [wa:661]I am not troubled by it or anything...[/log]"
1014905-124 = "-- [log=코코로]...Yes. [wa:1522]If that is what you wish, Sensei...[/log]"
1014905-126 = "-- [log=코코로]I do [wa:2330]not mind at all.[/log]"
1014905-129 = "(I spent a wonderful time drinking warm miso soup with Kokoro.)"
