[translation]
1005806-1 = "Там, где нужна помощь"
1005806-6 = "С помощью Мине я быстро разобрался с административными задачами."
1005806-7 = "Похоже, на сегодня это всё."
1005806-8 = "[s] «Ты ещё и с документами отлично справляешься, Мине...»"
1005806-9 = "Мне приятно это слышать."
1005806-10 = "Когда управляешь организацией, приходится становиться умелым во множестве вещей."
1005806-11 = "Наверное, это вроде навыка или таланта, который я вовсе не собиралась приобретать."
1005806-12 = "[s] «Но всё же твоя помощь очень пригодилась, Мине.»"
1005806-13 = ""
1005806-15 = ""
1005806-16 = "...!"
1005806-17 = "Понятно. Значит, в каком-то смысле это тоже разновидность помощи...!"
1005806-18 = "Спасибо, Сенсей. Я многому научилась."
1005806-19 = "[s] «(Стоило ли воспринимать это настолько серьёзно?)»"
1005806-20 = ""
1005806-23 = "Телефонный звонок...?"
1005806-24 = "[s] «Давай, ответь.»"
1005806-25 = "Хорошо, Сенсей."
1005806-26 = ""
1005806-28 = ""
1005806-29 = ""
1005806-30 = "Здравствуйте. Вы позвонили Рыцарям помощи. Вам требуется помощь?"
1005806-31 = ""
1005806-34 = ""
1005806-36 = "П-помогите! Я заблудилась..."
1005806-37 = "В лесу... В Лесу Кивотоса!"
1005806-38 = "Хм? В Лесу Кивотоса?!"
1005806-39 = "Можете подробнее описать свою ситуацию?"
1005806-40 = "Не знаю!"
1005806-41 = "The surroundings are so dark, and all these trees look the same..."
1005806-42 = ""
1005806-45 = "А ещё... И...!"
1005806-46 = ""
1005806-50 = "Алло? Алло??"
1005806-51 = ""
1005806-53 = ""
1005806-54 = "Связь оборвалась..."
1005806-55 = ""
1005806-57 = ""
1005806-58 = "Сенсей. Нельзя терять ни секунды."
1005806-59 = "[s] «Ч-Что происходит?»"
1005806-60 = "Кто-то просит помощи из Леса Кивотоса!"
1005806-61 = "Я немедленно отправляюсь туда!"
1005806-62 = "[s] «Лес Кивотоса...?»"
1005806-63 = "О, ты не знаешь?"
1005806-64 = "Лес Кивотоса известен своей необычайной густотой..."
1005806-65 = "Говорят, что GPS там почему-то не работает, а компас начинает сбоить сразу после входа в лес."
1005806-66 = "А ещё говорят, что если там заблудиться, дорогу обратно уже не найдёшь."
1005806-67 = "[s] «Разве такое место не должно быть закрыто для посещения?!»"
1005806-68 = "Подобные меры уже приняли, но..."
1005806-69 = "Как ты прекрасно знаешь, запрет лишь сильнее соблазняет некоторых людей попробовать."
1005806-70 = "Испытание храбрости, ролик для соцсетей или просто любопытство — время от времени люди всё равно решаются зайти в Лес Кивотоса."
1005806-71 = "Наверное, тот тревожный звонок, который я только что получила, был от одного из таких людей."
1005806-72 = "В любом случае, спасибо тебе за сегодняшний день!"
1005806-73 = "Тогда я отправляюсь!"
1005806-74 = ""
1005806-76 = ""
1005806-83 = "[ns] «Подожди секунду!»"
1005806-95 = ""
1005806-96 = ""
1005806-97 = "Тебе не обязательно идти со мной в Лес Кивотоса, Сенсей..."
1005806-98 = "[s1] «Даже если это был тревожный звонок...»\n[s2] «Я не могу отпустить своего студента в опасное место одну...»"
1005806-101 = "Меня, твою...?"
1005806-102 = "Ху-ху, понятно. Я забыла о собственном статусе."
1005806-103 = "Тогда пока что будем считать, что и ты являешься частью «помощи» Рыцарей помощи, Сенсей."
1005806-104 = "Как насчёт того, чтобы хотя бы временно сделать тебя почётным советником Рыцарей помощи?"
1005806-105 = "[s] «Ты всё ещё помнишь про это предложение стать советником...»"
1005806-106 = "Конечно нет."
1005806-107 = "Повторю ещё раз: у тебя превосходный дух и талант к помощи."
1005806-108 = ""
1005806-110 = ""
1005806-111 = "Тогда идём, Сенсей."
1005806-112 = "На самом деле я и сама впервые ступаю в Лес Кивотоса."
1005806-113 = "Я довольно сильно нервничаю."
1005806-114 = "[s] «Не думал, что ты умеешь нервничать, Мине.»"
1005806-115 = "...Разве ты не говорил, что я тоже одна из твоих студентов?"
1005806-116 = "Хи-хи. Я шучу. Не нужно так волноваться."
1005806-117 = "Тогда идём. Рыцари помощи уже в пути!"
1005806-121 = ""
1005806-122 = "Осторожно, Сенсей! Берегись этих лоз."
1005806-123 = ""
1005806-127 = "Так мы расчистим более удобную тропу."
1005806-128 = "А? Думаешь, по возможности лучше беречь наши ресурсы?"
1005806-129 = ""
1005806-131 = ""
1005806-132 = "Это тоже верно."
1005806-133 = ""
1005806-135 = ""
1005806-136 = "Давай внимательнее смотреть под ноги, пока продвигаемся дальше."
1005806-139 = "Кажется, мы зашли уже довольно далеко, но никаких следов людей нет."
1005806-140 = "Я переживаю. Уверена, студенты, которым нужна наша помощь, чувствуют то же самое."
1005806-141 = ""
1005806-147 = "Ты в порядке, Сенсей?"
1005806-148 = ""
1005806-151 = "К счастью, лес такой густой, что защищает от жары своей тенью. Здесь можно не переживать."
1005806-154 = ""
1005806-155 = "Похоже, прошло уже довольно много времени..."
1005806-156 = "Слухи о том, что GPS здесь не работает, похоже, оказались просто слухами."
1005806-157 = ""
1005806-160 = "А вот батарея моего телефона..."
1005806-161 = "Это моя оплошность. Нужно было подготовить достаточно запасных аккумуляторов."
1005806-162 = "Мы так внезапно сорвались сюда, что ничего нельзя было поделать? Ху-ху, спасибо, что смотришь на это так."
1005806-164 = "В конце концов даже к наступлению ночи нам так и не удалось найти в Лесу Кивотоса ни следов, ни подсказок..."
1005806-166 = "..."
1005806-167 = "Уже ночь."
1005806-168 = "Прости, Сенсей. Я... Когда попадаю в такие ситуации, кажется, перестаю замечать всё остальное."
1005806-169 = "Из-за своего упрямства я лишь доставила тебе неудобства."
1005806-170 = "[s3] «Всё в порядке.»\n[s4] «Ты ведь просто пыталась кому-то помочь, верно?»"
1005806-171 = ""
1005806-172 = ""
1005806-174 = ""
1005806-175 = ""
1005806-176 = "...Спасибо. За то, что видишь это именно так."
1005806-177 = ""
1005806-179 = ""
1005806-180 = ""
1005806-181 = "Вон там... Кажется, это естественная поляна."
1005806-182 = "Может, немного отдохнём? Похоже, мы оба совсем выбились из сил."
1005806-183 = ""
1005806-185 = ""
1005806-187 = ""
1005806-189 = "Думаю, ты можешь сесть вот на этот пень, Сенсей."
1005806-190 = "Большую часть грязи я уже убрала, теперь начну дезинфицировать."
1005806-195 = "― Сенсей, всё хорошо?[wa:1100]"
1005806-197 = "― Ты точно нигде не ранен?[wa:170]"
1005806-200 = "― Ах, какой приятный ночной воздух![wa:1690]"
1005806-203 = "― Сладкий запах травы, тихий шум реки...[wa:10]"
1005806-205 = "― Такая успокаивающая атмосфера.[wa:10]"
1005806-208 = "― ...Что случилось?[wa:70]"
1005806-210 = "― Ослепляет?[wa:1240]"
1005806-213 = "― Понимаю. Хи-хи.[wa:2970]"
1005806-216 = "― Если нервничаешь, можешь опереться на меня![wa:1420]"
1005806-218 = "― А если хочешь закрыть глаза, можешь положить голову мне на колени.[wa:10]"
1005806-221 = "― Не волнуйся, Сенсей.[wa:160]"
1005806-224 = "― Что бы ни случилось,"
1005806-226 = "― я буду рядом и защищу тебя.[wa:840]"
1005806-229 = "Благодаря Мине ночь в лесу прошла спокойно."
1005806-234 = ""
1005806-235 = "Наконец нам удалось вернуться ко входу в лес..."
1005806-236 = ""
1005806-238 = ""
1005806-239 = "Наверное, это небольшая цена, но заряд телефона остался всего около 15%."
1005806-240 = "[s] «Хорошая работа, капитан Мине...»"
1005806-241 = "Всё благодаря тебе, Сенсей. В роли нашего временного советника тебе пришлось гораздо тяжелее."
1005806-242 = "Ху-ху... Надеюсь, однажды мы сможем убрать из этого титула слово «временный»."
1005806-243 = ""
1005806-247 = "Ещё один звонок...?"
1005806-248 = ""
1005806-250 = ""
1005806-251 = "П-помогите...! Я заблудилась..."
1005806-252 = "В лесу... В Лесу Кивотоса!"
1005806-253 = "...Можете подробнее описать ситуацию?"
1005806-254 = "Не знаю!"
1005806-255 = "The surroundings are so dark, and all these trees look the same..."
1005806-256 = "...Мы уже в Лесу Кивотоса. Где вы?"
1005806-257 = ""
1005806-260 = "Вы уже там...?!"
1005806-261 = "Ого, серьёзно? Они правда пришли? Вот это жесть!"
1005806-262 = ""
1005806-264 = ""
1005806-266 = "Подумать только, мы и правда смогли разыграть Рыцарей помощи! Отлично!"
1005806-267 = "Наверное, они там уже долго бродят, да?"
1005806-268 = "Найти кого-то в этом лесу — как иголку в стоге сена, так что нас никогда не поймают!"
1005806-270 = ""
1005806-271 = ""
1005806-272 = ""
1005806-273 = "..."
1005806-274 = "[ns] «Эм... Мине?»"
1005806-275 = "Эти люди допустили три ошибки."
1005806-276 = "Первая — решили, что даже я дважды попадусь на одну и ту же уловку."
1005806-277 = "Вторая — на этот раз они недостаточно быстро завершили звонок."
1005806-278 = "И наконец, хоть мне и не хотелось прибегать к чему-то подобному..."
1005806-279 = "Последняя ошибка в том, что, используя имя Рыцарей помощи, отследить местоположение человека очень просто...!"
1005806-280 = "Сенсей."
1005806-281 = "С этого момента я отправлюсь лично доставить настоящую «помощь» тем, кто действительно в ней нуждается."
1005806-282 = "Если кто-то идёт по неверному пути..."
1005806-283 = "...то лично прийти и убедиться, что он вернулся на правильный, — тоже «помощь»!"
1005806-284 = "Ты ведь тоже так думаешь, Сенсей?!"
1005806-285 = ""
1005806-288 = "[ns5] «Да... Только не слишком жёстко с ними...?»\n[ns6] «Не перестарайся с ними...?»"
1005806-291 = "Спасибо за понимание."
1005806-292 = "Прошу прощения, но я пойду вперёд."
1005806-293 = "Медицина не знает границ!"
1005806-294 = ""
1005806-296 = ""
1005806-299 = "Мине очень быстро куда-то исчезла."
1005806-300 = ""
1005806-303 = "...Судьба студентов, устроивших тот розыгрыш по телефону, и по сей день известна лишь Мине..."
