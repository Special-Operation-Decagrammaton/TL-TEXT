[translation]
1001020-1 = "Бережёного бог бережёт"
1001020-2 = "Район Абидоса"
1001020-3 = "Мне пришлось посетить старшую школу Абидос, чтобы разобраться с некоторыми административными вопросами."
1001020-4 = ""
1001020-11 = "Сенсей? Что вы здесь делаете?"
1001020-12 = "О? Нужно что-то сделать в академии?"
1001020-13 = "Понятно. Я тоже направлялась в академию."
1001020-14 = "Но что вы делаете именно здесь?"
1001020-15 = "Эм..."
1001020-16 = "..."
1001020-17 = "Понятно. Совпадение."
1001020-18 = "..."
1001020-19 = "...Совпадение."
1001020-20 = "[s] «Может... пойдём до академии вместе?»"
1001020-21 = "Хорошо..."
1001020-26 = "[ns] «У меня дежавю.»"
1001020-27 = "Дежавю?"
1001020-28 = "А... вы про тот раз, когда упали в обморок."
1001020-29 = "[s] «Я выжил благодаря тебе, Широко...»"
1001020-30 = "Ну..."
1001020-31 = "Не совсем. Но если вы настаиваете, Сенсей..."
1001020-32 = "Думаете, вы должны мне не только за это?"
1001020-33 = "Это... Я не знаю, что с этим делать."
1001020-34 = "Сенсей, одного того, что вы здесь..."
1001020-35 = "Хм... неважно."
1001020-36 = "Что? Нет, не извиняйтесь за то, что мне приходится вести велосипед."
1001020-37 = "Всё совершенно нормально."
1001020-38 = "Он даже не тяжёлый. Рама из углепластика."
1001020-39 = "Мы с Широко шли к академии и разговаривали."
1001020-44 = ""
1001020-47 = "[ns1] «Осторожно, Широко!»\n[ns2] «Что-то летит прямо на нас!»"
1001020-50 = "А? О..."
1001020-51 = "Всё нормально, Сенсей. Это просто мой дрон."
1001020-52 = ""
1001020-54 = ""
1001020-55 = "Широко спокойно подобрала дрон и положила в сумку."
1001020-56 = "[s] «О, значит, у тебя... есть дрон?»"
1001020-57 = "Ага. Он случайно у меня оказался, но с тех пор я его немного доработала."
1001020-58 = "[s] «Случайно...?»"
1001020-59 = "Да, случайно."
1001020-60 = "Хм? Почему вы так на меня смотрите?"
1001020-61 = "[s3] «Ничего.»\n[s4] «Я доверяю тебе, Широко.»"
1001020-64 = "Хотите знать, для чего я его использую?"
1001020-65 = "Обычно как GPS во время велопоездок или для съёмки."
1001020-66 = "[s] «А, и всё? Хорошо.»"
1001020-67 = ""
1001020-68 = "Ты меня слышал?! А ну стой!"
1001020-69 = "И раз уж мы здесь, почему бы тебе не потратить немного денег? Хе-хе-хе."
1001020-70 = "И-и-и! Но... у меня больше нет денег!"
1001020-71 = "Хе-хе. Не глупи. Как говорится, и из камня можно кровь выжать."
1001020-72 = "Я не... Не думаю, что поговорка звучит именно так... Пожалуйста, отпусти меня хотя бы в этот раз!"
1001020-73 = ""
1001020-74 = "Эм."
1001020-75 = ""
1001020-77 = ""
1001020-80 = "Широко внезапно запустила дрон."
1001020-81 = ""
1001020-84 = "Ай, ай, больно! Что это?!"
1001020-85 = "Р-Ракета? Откуда взялась ракета?!"
1001020-86 = "Я сваливаю!"
1001020-87 = ""
1001020-90 = ""
1001020-91 = "[ns] «Широко, разве ты не говорила, что дрон нужен для съёмки?!»"
1001020-92 = "Ну... В основном."
1001020-93 = "Ещё он умеет стрелять ракетами. На экстренный случай."
1001020-94 = "[s] «И ты не сочла нужным это упомянуть?!»"
1001020-95 = "...Эм."
1001020-96 = ""
1001020-97 = "Да это же пустяковая просьба, ну. Никогда раньше имя не подписывал?"
1001020-98 = "Всего одна маленькая подпись на юридически обязательном документе — это всё, что нам нужно."
1001020-99 = "Ю-Юридически обязательном? Но..."
1001020-100 = "...!"
1001020-101 = ""
1001020-105 = "Ай! Ракета?!"
1001020-106 = "Кем бы ты ни был, в следующий раз мы тебя достанем!"
1001020-108 = "Эй-эй, мне просто нужно ненадолго одолжить этот двигатель. Обещаю вернуть."
1001020-109 = "Разумеется, ничего не могу гарантировать насчёт его... исходного состояния. Ха-ха-ха!"
1001020-110 = "Аргх!"
1001020-111 = ""
1001020-116 = "Э-Это ракетный залп!"
1001020-117 = "Бежим! Он разнесёт машину!"
1001020-118 = ""
1001020-119 = "[ns] «...Так ты абсолютно уверена, что дрон нужен для съёмки?»"
1001020-120 = "...Да. Ракеты... это дополнение. Просто режим защиты..."
1001020-121 = "[s] «Похоже, режимом защиты ты пользуешься довольно часто.»"
1001020-122 = "...Наверное."
1001020-123 = "[s5] «Я должен спросить, Широко.»\n[s6] «Ты ведь будешь пользоваться этим дроном ответственно?»"
1001020-126 = "Ага... Я не включаю режим защиты без причины."
1001020-127 = "Вообще-то я добавила его всего по одной причине."
1001020-128 = ""
1001020-130 = ""
1001020-131 = "На случай, если при ограблении банка возникнут осложнения."
1001020-132 = ""
1001020-134 = ""
1001020-135 = "[ns] «Нет-нет-нет! Это ещё хуже!»"
1001020-136 = ""
