[translation]
901010400210-6 = "Com licença, desculpe atrapalhar o serviço."
901010400210-7 = "Hã? Quem é você?"
901010400210-8 = "Olá! De entregas de marmita até reservas nos melhores restaurantes — somos o serviço multifuncional \"FOX EATS\"!"
901010400210-9 = "Em comemoração à expansão da nossa área de entrega para o Porto de Kanezaki, estamos distribuindo marmitas de cortesia..."
901010400210-10 = "Gostaria de experimentar um delicioso inarizushi caseiro?"
901010400210-11 = "Hum... agradeço a gentileza, mas agora tô no meio de um aperto danado."
901010400210-12 = "Aconteceu alguma coisa grave?"
901010400210-13 = "É que... você por acaso não viu sacos de serragem jogados por aqui?"
901010400210-14 = "Sacos de serragem?"
901010400210-15 = "Isso. Sacos cheios de serragem fina que sobra da marcenaria."
901010400210-16 = "A gente precisa disso pra encaixotar os caranguejos vivos... mas parece que alguém moveu os sacos todos de lugar."
901010400210-17 = "Sem a serragem o trabalho tá empacado..."
901010400210-18 = "Se vir algum \"saco de serragem abandonado\" por aí, me dá um toque?"
901010400210-19 = "A vida e a frescura dos caranguejos dependem disso... Quebra essa pra mim!"
901010400210-21 = "Pode deixar! Se eu encontrar esses sacos de serragem abandonados, venho avisar na hora."
