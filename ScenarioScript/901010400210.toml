[translation]
901010400210-6 = "Извините!"
901010400210-7 = "Да? Чего тебе?"
901010400210-8 = "Здравствуйте! От доставки бэнто до бронирования ресторанов! FOX EATS — ваш универсальный сервис, когда у ВАС урчит в животе."
901010400210-9 = "Мы только что расширили доставку до порта Канэсаки. В честь этого бесплатно раздаём местным жителям бэнто!"
901010400210-10 = "Хотите немного отдохнуть и попробовать вкусные инаризуси?"
901010400210-11 = "Эм... Я бы не отказался, но сейчас не могу позволить себе перерыв."
901010400210-12 = "Ох. Что-то случилось?"
901010400210-13 = "Ну... Вы случайно не видели мешок с опилками, который где-то валяется?"
901010400210-14 = "Мешок с опилками?"
901010400210-15 = "Ага. Ну, это обычный мешок. А внутри такие пескообразные отходы после обработки дерева."
901010400210-16 = "Мне он нужен, чтобы укладывать крабов в ящики. Мы засыпаем их опилками, чтобы всё лежало плотно и безопасно... Но, похоже, кто-то унёс мешок."
901010400210-17 = "Без него я работать не могу..."
901010400210-18 = "Если увидишь брошенный мешок с опилками, дай знать, ладно?"
901010400210-19 = "Он помогает крабам оставаться свежими. Это очень важно!"
901010400210-21 = "Поняла. Если увижу брошенный мешок с опилками, сразу сообщу вам!"
