[translation]
1008406-1 = "Эхо"
1008406-2 = ""
1008406-6 = ""
1008406-7 = "*Тяжёлое дыхание* *Тяжёлое дыхание*"
1008406-8 = "Почему... нам вдруг обязательно... лезть на самую вершину?"
1008406-9 = "Внизу горы полно хороших звуков."
1008406-10 = "А наверху ещё и деревьев мало, поэтому ветер ужасно сильный."
1008406-11 = "[s] «Но разве не ты сама говорила, что редкие звуки ценнее?»"
1008406-12 = "Угх..."
1008406-13 = "Не могу поверить, что мои же слова используют против меня."
1008406-14 = "[s1] «Осталось совсем немного.»\n[s2] «Серьёзно, вершина уже совсем близко!»"
1008406-17 = "Угх..."
1008406-18 = "Сенсей, мне кажется, общение с нашим вице-президентом плохо на вас влияет."
1008406-27 = "Мы... пришли."
1008406-28 = "Ноги дрожат. Я больше ни шага не сделаю..."
1008406-29 = ""
1008406-31 = ""
1008406-32 = "Погодите... Сенсей, что это там, на другой стороне горы?"
1008406-33 = ""
1008406-37 = "[ns] «Ау!»"
1008406-38 = ""
1008406-41 = "А... у..."
1008406-43 = "[ns3] «Слышишь, Котама?»\n[ns4] «Я слышу собственный голос с другой стороны горы.»"
1008406-46 = "...Понятно. Это эхо."
1008406-47 = "Из-за отсутствия листвы эхо звучит особенно громко и чисто."
1008406-48 = "[s5] «Ты уже не так воодушевлена, как раньше.»\n[s6] «Устала после подъёма?»"
1008406-51 = "Дело не в усталости..."
1008406-52 = "Просто я не очень люблю эхо."
1008406-53 = "[s] «Почему?»"
1008406-54 = "Оно мешает моим записям."
1008406-55 = ""
1008406-57 = ""
1008406-58 = "Эхо — это явление, при котором исходный звук отражается от поверхности и распространяется дальше. Обычно возникает реверберация, своего рода ответ на первоначальный звук."
1008406-59 = "Те, кто, как я, работает с профессиональной записывающей аппаратурой, стараются максимально снизить количество эха вокруг."
1008406-60 = "Если только запись не ведётся в полном вакууме, эхо неизбежно, и оно искажает исходный звук."
1008406-61 = "А я всего лишь хотела записать голос Сенсея как можно чище..."
1008406-62 = "[s] «Вот почему ты его не любишь...»"
1008406-64 = "[ns] «Но разве по-своему оно не может быть забавным?»"
1008406-65 = "Нет. Пока у меня есть оригинальная запись, я и сама могу добавить эхо."
1008406-66 = "В конце концов, эхо — всего лишь дешёвая копия звука."
1008406-67 = "В старых легендах говорят, что эхо — это голоса древесных ёкаев по имени «кодама»."
1008406-68 = "Из-за того что моё имя звучит похоже, в детстве меня этим дразнили."
1008406-69 = "Так что сомневаюсь, что когда-нибудь полюблю это явление."
1008406-70 = "[s] «Хм, ты уверена, что это правда всего лишь дешёвая копия звука?»"
1008406-71 = "А чем ещё оно может быть?"
1008406-72 = "Эхо — не более чем несовершенная копия. Какой в ней вообще может быть смысл?"
1008406-73 = "[s7] «Но ведь в пещере и на горе эхо звучит по-разному...»\n[s8] «Эхо отражает среду, которая его породила.»"
1008406-76 = "[ns] «Возможно, звука без эха вообще не существует.»"
1008406-77 = ""
1008406-79 = ""
1008406-80 = "...Чепуха."
1008406-81 = "Философские рассуждения не заставят меня изменить мнение об эхе."
1008406-82 = "Н-Но..."
1008406-83 = ""
1008406-85 = ""
1008406-86 = ""
1008406-87 = ""
1008406-89 = "Здравствуйте!"
1008406-90 = ""
1008406-93 = "А... у..."
1008406-96 = ""
1008406-97 = "Если в этом эхе есть голос Сенсея, возможно, у него всё-таки есть особая ценность."
1008406-98 = "Так же как ваш голос остаётся приятным, даже когда к нему примешиваются другие звуки."
1008406-99 = "Гора создаёт эхо вашего голоса. В каком-то смысле, возможно, я тоже «кодама», которая смешивает его со своим собственным эхом."
1008406-100 = ""
