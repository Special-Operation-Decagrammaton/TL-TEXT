1008406-105 = "Эй, Сенсей. Хотите вместе крикнуть в сторону горы?"
1008406-106 = "Давайте создадим собственное эхо. Гармоничное смешение наших голосов."
1008406-107 = "Звук, которым можно насладиться только в таком месте."
1008406-109 = "Мы с Котамой радостно покричали в сторону горы, а затем отправились домой."
