[translation]
10000070-1 = "Эпизод 7;Разрушая планы"
10000070-3 = "Вот здесь я видела, как они увели Сенсея..."
10000070-4 = "Это клиент приказал им?"
10000070-7 = "(Изуна слышит голоса!)"
10000070-8 = "Они идут оттуда. Изуне стоит спрятаться на крыше..."
10000070-9 = ""
10000070-10 = ""
10000070-13 = ""
10000070-14 = ""
10000070-15 = ""
10000070-16 = "Изуна могла поклясться, что голоса доносились откуда-то отсюда."
10000070-17 = ""
10000070-18 = "Босс! Мы привели цель!"
10000070-19 = "Вот он!"
10000070-20 = "Хорошая работа. И вовремя."
10000070-21 = "(Тут Моурё, клиент... и Сенсей!)"
10000070-23 = "Так это знаменитый Сенсей из Шале. Очень приятно... наконец-то познакомиться."
10000070-24 = ""
10000070-26 = ""
10000070-27 = ""
10000070-28 = "[ns] «Датэ Мяуру? Президент гильдии торговцев?»"
10000070-29 = ""
10000070-30 = "Я НЕ Датэ Мяуру!"
10000070-31 = "Меня зовут... Мяусамунэ."
10000070-32 = "Я Одноглазый Дракон переулков! Датэ Мяусамунэ!"
10000070-33 = "Та-дам!"
10000070-34 = "..."
10000070-35 = ""
10000070-36 = "Кхм. Я знала, что тот, кто мешает нашим планам, должен быть неплохим тактиком."
10000070-37 = "Так ты тот самый человек из Шале, о котором все говорят?"
10000070-38 = "Полагаю, ты уже встречался с моей второй половиной в Момоёдо?"
10000070-39 = "[s1] «Возможно.»\n[s2] «Не припоминаю.»"
10000070-40 = "Ха-ха! Раз ты настолько спокоен, наверняка у тебя есть козырь в рукаве."
10000070-41 = "Ха-ха! Раз ты настолько спокоен, наверняка у тебя есть козырь в рукаве."
10000070-42 = "Не хочу рушить твою надежду, но твой запасной план уже у меня."
10000070-43 = ""
10000070-44 = "[s] «Мой телефон...»"
10000070-45 = "Разумеется, я приказала его конфисковать. Я бы никогда не допустила такой небрежной ошибки."
10000070-46 = "Теперь у тебя нет способа вызвать подкрепление."
10000070-47 = "Даже если будешь кричать во всё горло, твои мольбы не достигнут отдела организации фестивалей. Ты совсем один."
10000070-48 = "Теперь понимаешь, в каком положении оказался?"
10000070-49 = "[s3] «Зачем ты это делаешь?»\n[s4] «Что ты получишь, испортив фестиваль?»"
10000070-50 = ""
10000070-51 = ""
10000070-53 = "[ns] «Это из-за традиций фестиваля?»"
10000070-54 = "Традиций? Ты про шоу фейерверков и всё такое?"
10000070-55 = "Ха-ха! Не смеши меня!"
10000070-56 = "То, о чём мы говорили в Момоёдо, было лишь отвлекающим манёвром."
10000070-57 = "Ты слишком всё усложняешь. Моей целью всегда были деньги."
10000070-58 = "[s] «И всё? Деньги...?»"
10000070-59 = "Ты хоть представляешь, сколько денег проходит через Фестиваль цветения сакуры Хяккияко?"
10000070-60 = "И при этом всем этим распоряжается только отдел организации фестивалей. Вот что меня раздражает."
10000070-61 = "Подумай, сколько они потратили впустую ради «веселья»!"
10000070-62 = "С какой стати им тратить целое состояние на оборудование из Миллениума ради «веселья»?!"
10000070-63 = "Это смешно! Под моим управлением фестиваль приносил бы куда больше денег!"
10000070-64 = "[s] «Ты портишь фестиваль только из-за этого?»"
10000070-65 = "Именно. Поэтому я и прибегла к саботажу."
10000070-66 = "Если фестиваль отменят, отдел организации фестивалей будет вынужден уйти из оргкомитета."
10000070-67 = "Тогда фестиваль окажется под моим контролем."
10000070-68 = "[s] «И ради этого ты используешь Изуну...»"
10000070-69 = "Изуну? Эту самопровозглашённую ниндзя?"
10000070-70 = "Да, Изуна оказалась полезной."
10000070-71 = "И нанять её стоило совсем недорого..."
10000070-72 = "Она отлично справлялась, а мне нужно было лишь подыгрывать её маленькой фантазии о ниндзя."
10000070-73 = "Ха-ха. Вот это выгодная сделка. С ней у меня будто было ещё дюжина Моурё в распоряжении."
10000070-74 = "[s] «Фантазии о ниндзя...?»"
10000070-75 = "Именно: фантазии. Просто детская игра воображения."
10000070-76 = "Она ходила и несла что-то вроде: «Ты мой клиент, поэтому я буду выполнять твои приказы», и «Устранить врагов клиента — путь настоящей ниндзя.»"
10000070-77 = "Ты не представляешь, как смешно было слушать этот её бред."
10000070-78 = "Я просто подыгрывала её фантазиям."
10000070-79 = "Мне приходилось изо всех сил сдерживать смех каждый раз, когда она кричала что-то вроде: «Я выполню поручение как настоящая ниндзя!»"
10000070-80 = "Босс права. Это было о-очень смешно. Ха-ха-ха!"
10000070-81 = "Просто умора."
10000070-82 = "Как удобно — и ещё дёшево! Ха-ха-ха!"
10000070-83 = "[s] «Значит, ты воспользовалась мечтой Изуны.»"
10000070-84 = "Мечтой? Ты с ума сошёл?"
10000070-85 = "Ты ведь не всерьёз называешь детские фантазии этой девчонки «мечтой»,#nправда?"
10000070-87 = "...!"
10000070-88 = "(Клиент попросил Изуну выполнять обязанности... ниндзя.)"
10000070-89 = "(Но всё было ложью? Клиент обманывал Изуну?)"
10000070-90 = "(Изуна чувствует себя такой глупой, что поверила!)"
10000070-91 = "Значит, ты знал, что Изуна выполняет мои приказы?"
10000070-92 = "И всё же ты пошёл искать и её, и Моурё, хотя знал, что они тоже выполняют мои приказы."
10000070-93 = "В этом и была твоя ошибка. Я подумала, что смогу найти тебя, если позволю Изуне действовать самой. Я приказала Моурё следить за ней и похитить тебя при первой возможности."
10000070-94 = "Блестящая стратегия, если позволишь мне самой так сказать. И всё благодаря Изуне! Ха-ха-ха!"
10000070-95 = "...!"
10000070-96 = "(Всё это потому, что Изуна позволила клиенту себя обмануть!)"
10000070-97 = "(Сенсей верил в Изуну, а теперь он...!)"
10000070-98 = ""
10000070-99 = "[ns] «Возможно, встречаться с Изуной наедине было неосторожно с моей стороны...»"
10000070-100 = "Хм. Значит, признаёшь, что тебя перехитрили?"
10000070-101 = "[s] «...но Изуна в этом не виновата.»"
10000070-104 = "Сэн... сэй?"
10000070-105 = ""
10000070-106 = ""
10000070-107 = "[ns] «Ты назвала её мечту детской фантазией, верно?»"
10000070-108 = "Ты всё слышал. Это всего лишь игра воображения."
10000070-109 = "Это какие?"
10000070-110 = "[s] «Заблуждаешься здесь именно ты. Быть ниндзя — это...»"
10000070-111 = ""
10000070-112 = ""
10000070-113 = ""
10000070-116 = "[ns5] «...самая крутая вещь, какую только можно представить!»\n[ns6] «...мечта, о которой мечтал бы кто угодно!»"
10000070-117 = "...!"
10000070-118 = "...!"
10000070-120 = "...?"
10000070-121 = "Э, что?"
10000070-122 = "С каких пор?"
10000070-123 = "И ЭТО ты называешь мечтой?"
10000070-124 = "[s7] «Называй её глупой. Называй детской. И что?»\n[s8] «Кто сказал, что это не круто?!»"
10000070-125 = "Ха..."
10000070-126 = "Ха..."
10000070-127 = "Ха-ха-ха! Бесценно!"
10000070-128 = "Я ожидала большего от прославленного Сенсея из Шале!"
10000070-129 = "Понятно, до тебя не достучаться. Если продолжишь нести такую чушь, нам придётся заставить тебя замолчать!"
10000070-130 = "Сенсей из Шале, ты в последний раз вмешался в мои планы...#nПора прощаться. Моурё! В атаку!"
10000070-131 = "Поняла! Хия-я-я!"
10000070-132 = ""
10000070-134 = ""
10000070-135 = ""
10000070-136 = ""
10000070-137 = ""
10000070-140 = "Потолок рухнул! Что происходит?!"
10000070-141 = "*кашель* Ч-что случилось, босс?!"
10000070-142 = "Э-это произошло из ниоткуда!"
10000070-143 = ""
10000070-144 = "Нин-нин! Пришло время сделать следующий шаг на пути к великой ниндзя!"
10000070-145 = "Изуна прибыла!"
10000070-146 = "[s] «Изуна!»"
10000070-147 = "Изуна?! Почему ты была на крыше?!"
10000070-148 = "Изуна слышала весь разговор."
10000070-149 = "И самое главное — Изуна услышала чувства Сенсея... и теперь знает, что Сенсей действительно верит в мечту Изуны!"
10000070-150 = "Теперь всё кристально ясно!"
10000070-151 = ""
10000070-153 = "Изуна сможет идти за своей мечтой, пока остаётся рядом с Сенсеем!"
10000070-154 = "Что?!"
10000070-155 = "Сенсей..."
10000070-156 = "Нет, мой господин!"
10000070-157 = "[s] «Ты только что назвала меня... своим господином?!»"
10000070-158 = ""
10000070-159 = "С сегодняшнего дня Изуна будет сражаться рядом с вами! Нин-нин!"
