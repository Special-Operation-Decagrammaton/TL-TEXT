[translation]
10038020-1 = "Эпизод 2;Как бороться со слухами"
10038020-6 = ""
10038020-7 = "А, Сенсей. Сюда."
10038020-8 = "[s] «Рад, что ты позвала меня, Рэйдзё.»"
10038020-9 = "Я рада это слышать."
10038020-10 = "Хм... Вы ведь уже несколько раз бывали в Источнике Персикового Цвета, да? Но не в этой чайной, прямо в самом его сердце."
10038020-11 = "Здесь члены обсуждают... дела, касающиеся Променада Чёрной Черепахи."
10038020-12 = "[s] «Неудивительно, что атмосфера здесь немного другая.»"
10038020-13 = "Да, эта комната звукоизолирована, так что наши разговоры не выйдут наружу."
10038020-14 = "Что здесь такого секретного, спрашиваете? Ну..."
10038020-15 = "...Как вы знаете, доступ к Променаду Чёрной Черепахи сейчас ограничен."
10038020-16 = "К тому же его президент... превратилась в ребёнка и находится в карантине."
10038020-17 = "Так что ответственность за Променад Чёрной Черепахи ложится на меня..."
10038020-18 = "Это тяжёлая ноша. У меня от неё уже болит живот и пропал сон."
10038020-19 = "Если искать светлую сторону, весь Променад Чёрной Черепахи сейчас фактически закрыт."
10038020-20 = "Так что управлять почти нечем."
10038020-21 = "[s] «Это едва ли можно назвать светлой стороной.»"
10038020-22 = "Да и нельзя, если честно. Я просто пыталась немного разрядить плохую ситуацию."
10038020-23 = "В любом случае, я попросила вас прийти, Сенсей, потому что хотела... поделиться слухом, который ходит по Шаньхайцзину."
10038020-24 = "Я понимаю, конечно, что вы здесь как гость Генрюмона, но..."
10038020-25 = "...я не была уверена, что они расскажут вам об этом."
10038020-26 = "Вы ведь с ними общались, да?"
10038020-27 = "Что бы они ни решили вам рассказать, я подумала, что вы должны услышать и другой взгляд."
10038020-28 = "[s] «Звучит довольно серьёзно...»"
10038020-29 = "Простите. Не хочу драматизировать, но учитывая ситуацию..."
10038020-30 = ""
10038020-32 = ""
10038020-34 = ""
10038020-36 = "Ходят... шёпотки об одном исключённом студенте."
10038020-37 = "[s] «Шинтани Кай?»"
10038020-38 = ""
10038020-40 = ""
10038020-41 = "О? Откуда вы знаете это имя...?"
10038020-44 = "Я рассказал Рэйдзё о разговоре с Кисаки."
10038020-47 = "Понятно. Значит, Президент..."
10038020-48 = "......"
10038020-49 = "Да, по улицам ходят слухи о Шинтани Кай, в основном среди третьекурсниц."
10038020-50 = "Особенно подчёркивают именно «среди третьекурсниц». Первокурсницы и второкурсницы о ней почти ничего не знают, а если и знают, то считают всё это преувеличением."
10038020-51 = "И вдобавок к этому появились и другие, куда более зловещие слухи."
10038020-52 = "В том числе... связанные с той встречей по обмену."
10038020-53 = "Хочешь, чтобы я говорила конкретнее? Хорошо. Например..."
10038020-54 = ""
10038020-56 = "Интересно, что случилось с Кагуей."
10038020-57 = "Говорят, она ушла обдумать своё поведение, но я ещё слышала, что её увели за излишнюю откровенность..."
10038020-58 = ""
10038020-60 = "Если Шинтани Кай и правда вернулась..."
10038020-61 = "...то президент могла быть к этому причастна."
10038020-62 = ""
10038020-64 = "Её исключили, и она одна из Семи Узников."
10038020-65 = "Не может быть, чтобы она просто так вернулась в Шаньхайцзин без каких-либо условий..."
10038020-67 = "Но разве не президент в своё время исключила Шинтани Кай?"
10038020-68 = "В этом... может что-то быть."
10038020-71 = "С Шаньхайцзином всё будет в порядке?"
10038020-72 = ""
10038020-75 = ""
10038020-76 = "Можно ли доверять Генрюмону? И президенту...?"
10038020-79 = "Вот что мне удалось выяснить."
10038020-80 = "Если подытожить, старшекурсницы всё сильнее... тревожатся из-за Генрюмона."
10038020-81 = "Конечно, отношения между Променадом Чёрной Черепахи и Генрюмоном не самые лучшие. Это неоспоримый факт."
10038020-82 = "И всё же торговля на Променаде возможна только благодаря существованию Генрюмона..."
10038020-83 = "Я знаю. Но все эти правила и стандарты, мелочные придирки..."
10038020-84 = "...постоянные жалобы о «нарушении традиций» или «неуважении к гордости Шаньхайцзина»... Иногда это уже слишком."
10038020-85 = ""
10038020-87 = ""
10038020-88 = "Прости, я отвлеклась. По мере приближения Фестиваля Лунного Света ситуация наверняка будет только накаляться..."
10038020-89 = "[s] «А при чём тут Фестиваль Лунного Света?»"
10038020-90 = ""
10038020-92 = ""
10038020-93 = "Много ли вы знаете о Фестивале, Сенсей?"
10038020-95 = "...Понятно. Время молиться о процветании и делиться едой друг с другом... Да, большинство воспринимает его именно так."
10038020-96 = "Но есть и другие стороны, о которых говорят гораздо реже."
10038020-97 = "Например, история о мудреце, который отправился на Луну и вернулся примерно ко времени Фестиваля..."
10038020-98 = "[s] «Мудреце?»"
10038020-99 = ""
10038020-101 = ""
10038020-102 = "То есть о человеке, который благодаря постоянной практике и учёбе достиг просветления и стал... кем-то особенным."
10038020-103 = "Одна из целей Фестиваля Лунного Света — почтить этого мудреца."
10038020-104 = "Легенда гласит, что мудрец и по сей день спускается к нам с Луны, осматривает земли, а затем вновь уходит."
10038020-105 = "И якобы его визиты становятся причиной странных происшествий."
10038020-106 = "Да, некоторые действительно считают, что всё происходящее сейчас в Шаньхайцзине связано именно с этим."
10038020-107 = ""
10038020-109 = ""
10038020-110 = "Я? Обычно я считаю это суеверием или фольклором, но..."
10038020-111 = "...учитывая нынешнюю ситуацию, невольно начинаешь задумываться."
10038020-113 = "Выслушав Рэйдзё о распространяющихся слухах, я направился в Генрюмон."
10038020-114 = ""
10038020-120 = "Собрание Генрюмона... превратилось в настоящий хаос."
10038020-121 = "Мы ограничили доступ на улицу Променада Чёрной Черепахи, но Синдром Малыша продолжает распространяться. Нужны дополнительные меры!"
10038020-122 = "С эпидемиологическим исследованием проблемы. Мы всё ещё не знаем, как он передаётся!"
10038020-123 = "Люди на месте могут сделать лишь ограниченное количество вещей. Нам нужен более масштабный план!"
10038020-124 = ""
10038020-126 = ""
10038020-128 = "Well, we have found out one thing. Patients with Tyke Syndrome become much less contagious after the first three days."
10038020-130 = "Но мы не можем отслеживать историю симптомов каждого студента и обеспечивать каждой уход. У нас просто не хватает людей!"
10038020-131 = "Пожалуйста, госпожа президент! Проводить сейчас Фестиваль Лунного Света, возможно, не стоит..."
10038020-132 = ""
10038020-135 = ""
10038020-137 = ""
10038020-138 = "Следи за языком! Не забывай, с кем разговариваешь!"
10038020-139 = ""
10038020-142 = ""
10038020-144 = "Нет, всё в порядке. Сейчас как раз нужно выслушать всех."
10038020-145 = "Учитывая обстоятельства, я прекрасно понимаю, почему все чувствуют такую срочность."
10038020-146 = "Пожалуйста, продолжай."
10038020-147 = ""
10038020-150 = ""
10038020-151 = "Да, ну... ко всему прочему распространяется не только болезнь, но и слухи. Они никак не утихают."
10038020-152 = "Я бы не стала беспокоиться об этом, если бы... эти слухи не убеждали людей, что Генрюмон теряет контроль."
10038020-153 = "Ещё обсуждают изоляцию Клуба Пекинской Оперы и то, где сейчас находится Кагуя..."
10038020-154 = "Авторитет Генрюмона, похоже, слабеет повсюду. При нас все делают вид, что следуют приказам, но стоит им скрыться из виду..."
10038020-156 = "Вот как...? Это действительно проблема. Что ты предлагаешь?"
10038020-157 = ""
10038020-160 = ""
10038020-161 = "......"
10038020-162 = "...Мне тяжело это говорить, но..."
10038020-164 = "Всё в порядке. Говори свободно."
10038020-165 = ""
10038020-168 = ""
10038020-170 = "Мы хотим не допускать посторонних на Фестиваль Лунного Света."
10038020-171 = ""
10038020-174 = ""
10038020-175 = "Это...!"
10038020-176 = "Такова ситуация, офицер Мина. Многие наши студенты считают, что именно посторонние виноваты во всём этом."
10038020-177 = ""
10038020-179 = ""
10038020-181 = ""
10038020-182 = "......"
10038020-183 = "Если на Фестиваль придёт ЕЩЁ БОЛЬШЕ посторонних... мы можем полностью потерять контроль над ситуацией."
10038020-184 = "К-Конечно, мы МОГЛИ БЫ провести фестиваль как обычно и просто делать вид, будто никаких проблем нет, но..."
10038020-185 = "......"
10038020-187 = "...но джинн уже выпущен из бутылки, так сказать."
10038020-188 = "Игнорируя проблему, мы её не решим. Нам действительно нужен план."
10038020-189 = "Госпожа президент...!"
10038020-191 = "Н-Ну... это..."
10038020-192 = ""
10038020-195 = ""
10038020-196 = "Ты хотела сказать что-то ещё?"
10038020-197 = ""
10038020-200 = ""
10038020-201 = "Нет, это всё. Мы рады, что вы понимаете. Но..."
10038020-203 = "Я понимаю. И прекрасно понимаю, что вы имеете в виду."
10038020-204 = ""
10038020-206 = ""
10038020-207 = "......"
10038020-208 = ""
10038020-210 = ""
10038020-211 = "На Фестиваль Лунного Света в этом году доступ студентам извне будет ограничен."
10038020-212 = ""
10038020-215 = ""
10038020-216 = "Госпожа!"
10038020-217 = "Госпожа...!"
10038020-219 = "Улица Променада Чёрной Черепахи останется закрытой. Однако ни одного студента не будут держать в карантине дольше трёх дней."
10038020-220 = ""
10038020-222 = ""
10038020-224 = ""
10038020-225 = "......"
10038020-226 = "Что касается слухов, с дезинформацией нужно бороться решительно, но часть этих слухов в какой-то мере может оказаться правдой."
10038020-227 = "С этого момента охрана и проверки внутри Шаньхайцзина будут усилены."
10038020-228 = "Это официальные приказы Рюгэ Кисаки, президента Генрюмона."
10038020-230 = "Да, госпожа!"
10038020-231 = "Мы немедленно объявим и исполним ваши приказы!"
10038020-232 = ""
10038020-234 = ""
10038020-236 = "Вы уверены, госпожа президент...?"
10038020-237 = "Да. Сейчас важнее всего прислушиваться к голосам тех, кто находится непосредственно на месте."
10038020-238 = "......"
10038020-239 = "Мне тоже следует осмотреть место лично. Мина, подготовь всё необходимое."
10038020-240 = ""
10038020-242 = ""
10038020-243 = "Хм?! Н-нет, не думаю, что это хорошая идея, госпожа президент...!"
10038020-244 = "Это твоё личное мнение как Коноэ Мины или мнение исполнительного офицера?"
10038020-245 = "*ахает*"
10038020-246 = ""
10038020-248 = ""
10038020-249 = ""
10038020-250 = ""
10038020-252 = "Я говорю как... Я УМОЛЯЮ вас как исполнительный офицер."
10038020-253 = "Пожалуйста, ещё немного доверьтесь нам и Генрюмону..."
10038020-254 = ""
10038020-256 = ""
10038020-257 = "...Ладно."
10038020-258 = ""
10038020-260 = ""
10038020-261 = "Хорошо, я вернусь в свой кабинет. Немедленно сообщайте мне обо всех новых событиях."
10038020-262 = "Да, госпожа Президент."
10038020-263 = ""
10038020-265 = ""
10038020-267 = "А-А-А-А..."
10038020-268 = "[s] «Ты хорошо справилась, Мина...»"
10038020-269 = "Хех... Обычный рабочий день исполнительного офицера Генрюмона!"
10038020-270 = "[s] «Всё равно впечатляет, особенно при таких обстоятельствах.»"
10038020-271 = ""
10038020-273 = ""
10038020-274 = "Вот как...?"
10038020-275 = "Ну, С-Сенсей, я ведь не ради вашей похвалы стараюсь."
10038020-276 = "Я здесь, чтобы выполнять свои обязанности. Хладнокровно и по-взрослому."
10038020-284 = "Я... ненадолго вернусь в свою комнату. Но не потому, что устала и хочу отдохнуть или что-то такое!"
10038020-285 = "Конечно же нет, говорите? Хех, вы действительно меня понимаете. Тогда прошу меня ненадолго извинить..."
10038020-286 = ""
10038020-288 = ""
10038020-289 = ""
10038020-290 = "Кстати, Сенсей... вы ведь тоже посторонний. Значит..."
10038020-291 = "К чему я веду? Ну..."
10038020-292 = "Вам стоит быть осторожнее и какое-то время не попадаться на глаза."
10038020-293 = "Например, не стоит разговаривать с кем-то дольше необходимого или..."
10038020-294 = "...безрассудно соглашаться на предложение президента самим выйти туда."
10038020-295 = "[s1] «Логично, учитывая, насколько всё нестабильно.»\n[s2] «Постараюсь не высовываться, хотя это может быть невозможно...»"
10038020-298 = "Уф... Мне неловко просить вас об этом."
10038020-299 = "Но мы не можем просто игнорировать обстоятельства."
10038020-300 = "Вы понимаете это и думаете, что мне стоит пойти отдохнуть? Я же уже сказала! Мне не нужен «отдых». Я не устала..."
10038020-301 = ""
10038020-305 = ""
10038020-306 = "П-Почему вы пытаетесь меня выпроводить?! Сенсей, вам правда не нужно... Я просто..."
10038020-307 = ""
10038020-309 = ""
10038020-311 = "В клубной комнате внезапно стало тихо."
10038020-312 = ""
10038020-317 = "Я подумал, не позвать ли кого-нибудь, но вспомнил слова Мины. Поэтому решил сдержаться."
10038020-318 = ""
10038020-321 = "Кстати говоря..."
10038020-323 = "Пока ни у кого не наблюдалось никаких симптомов, кроме «обратного старения». Кроме того, студенты Отдела дисциплинарной поддержки — Сада Сливового Цвета — не пострадали."
10038020-326 = "Well, we have found out one thing. Patients with Tyke Syndrome become much less contagious after the first three days."
10038020-330 = "[ns] «Хм, значит ли это...?»"
10038020-333 = "Вдруг я вспомнил одного студента."
10038020-334 = ""
10038020-337 = "Помня просьбу Мины избегать ненужных разговоров, я решил воспользоваться MomoTalk."
10038020-338 = "[ns] «Привет, Шун. Чем занимаешься?»"
10038020-339 = ""
10038020-345 = "О, Сенсей? Как неожиданно получить от вас сообщение в MomoTalk."
10038020-346 = "Наверняка это хорошая примета!"
10038020-347 = "Я слышала, вы сейчас в Шаньхайцзине. И всё же вы так долго ждали, прежде чем написать мне!"
10038020-348 = "[s] «Ага, прости... С тех пор как я приехал, приходится быть осторожным.»"
10038020-349 = "Осторожным? Из-за чего?"
10038020-352 = "Я рассказал Шун обо всём, что произошло."
10038020-355 = "..."
10038020-356 = "Понятно. Это... звучит непросто."
10038020-357 = ""
10038020-360 = "Хи-хи, у меня есть идея. Дадите мне минутку?"
10038020-361 = "Знаете, вам повезло, что вы мне написали."
10038020-362 = "[s] «А? Ты о чём?»"
10038020-363 = ""
10038020-366 = "О, скоро узнаете."
10038020-371 = "Хм?"
10038020-376 = ""
10038020-377 = "Привет, Сенсей!"
10038020-378 = ""
10038020-382 = "[ns] «Сю...! То есть, Шунлинь!»"
10038020-383 = "Хе-хе-хе. Всё верно, Сенсей! Это ваша Шунлинь!"
10038020-384 = "Как я сюда попала? Даже Генрюмон пропускает студентов Сада Сливового Цвета!"
10038020-385 = "По вашему взгляду вижу: «Но ты же не студент Сада Сливового Цвета», — но не переживайте! Увидели возможность — пользуйтесь!"
10038020-386 = "Как я превратилась в ребёнка? Ну, эм..."
10038020-387 = "Я заразилась Синдромом Малыша."
10038020-388 = "Но не волнуйтесь. Кокона меня ещё не поймала, а остальные студенты Сада Сливового Цвета ничего не подозревают."
10038020-389 = ""
10038020-391 = ""
10038020-393 = ""
10038020-395 = "К тому же быть ребёнком приятно. Плечи больше не затекают, грудь не тяжёлая — вообще всё тело стало таким лёгким!"
10038020-396 = ""
10038020-398 = ""
10038020-399 = "Стоп, сейчас не до этого. Я пришла помочь президенту!"
10038020-400 = "Как именно? Хи-хи... Ну..."
10038020-402 = ""
10038020-403 = "Вы и правда инструктор Шун?"
10038020-404 = "Да, госпожа президент! Вы ведь уже заставили меня пройти проверку!"
10038020-405 = "Да, конечно... И всё же в это трудно поверить."
10038020-406 = "Как бы это сказать...? Ваш характер СИЛЬНО отличается от той третьекурсницы, которую мы знаем."
10038020-407 = ""
10038020-409 = ""
10038020-410 = "Н-Не понимаю, о чём вы! Я просто... остаюсь собой."
10038020-411 = "Что ж, отложим это. Можно сказать, теперь у нас с тобой есть ещё один общий секрет."
10038020-412 = "О, как верно. Но не позволяйте этому слишком вас тяготить. Я уж точно не буду."
10038020-413 = "Именно. Но вернёмся к другому..."
10038020-414 = ""
10038020-416 = ""
