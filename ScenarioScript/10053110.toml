[translation]
10053110-1 = "Послесловие;Небо Оккультного общества, весна НЛО"
10053110-2 = ""
10053110-3 = "..."
10053110-4 = ""
10053110-6 = ""
10053110-7 = ""
10053110-8 = "Рэна. Ты занята? Что делаешь?"
10053110-9 = "Минутку. Пишу соседкам по комнате."
10053110-10 = "Надо сообщить им, что я была права. Никакого Цучиноко не существует."
10053110-11 = "Нет-нет. Оно точно существует! В наших сердцах..."
10053110-12 = "Не в таком смысле!! Я говорю о НАСТОЯЩЕМ Цучиноко. Которого не существует. Буквально. В этой реальности."
10053110-13 = "А, точно. Настоящего, материального Цучиноко мы так и не нашли."
10053110-14 = "И все свидетельства о Цучиноко распространяли только те бандиты снаружи... Те, что сейчас чинят мост."
10053110-15 = "Именно. Это я и написала соседкам."
10053110-16 = "Ты правда...?"
10053110-17 = "И теперь они наконец поймут, что «оккультизм» — это просто обман!"
10053110-18 = "...Не думаю, что это сработает."
10053110-19 = "Смотрите! Они уже отвечают."
10053110-21 = ""
10053110-22 = "Ох."
10053110-23 = "Нюхуху."
10053110-24 = "Э-хе-хе..."
10053110-26 = ""
10053110-27 = "Ч-Что это должно значить?"
10053110-29 = ""
10053110-30 = "Мне было интересно, чем Рэна занимается в своей... «личной поездке.»"
10053110-31 = "Она проехала весь этот путь только ради поисков Цучиноко. Как любопытно."
10053110-32 = "Как я и думала... Рэна — преданная участница Оккультного общества..."
10053110-34 = ""
10053110-35 = "Подождите, нет! Вы всё не так поняли!"
10053110-36 = "Нет! Я не думала, что оно настоящее! Мне не было любопытно!"
10053110-37 = ""
10053110-39 = ""
10053110-40 = ""
10053110-41 = ""
10053110-42 = ""
10053110-43 = "Шьяаах!! Я же говорю!! Всё не так! Вы меня не слушаете!"
10053110-44 = "Я же говорила, что это не сработает..."
10053110-45 = "Ну... Я пришла сказать, что все готовы. Пойдём наружу."
10053110-46 = "А? Наружу? Зачем?"
10053110-47 = "...Так поздно? Почему?"
10053110-48 = "Мы так далеко от города, высоко в горах. И небо ясное."
10053110-49 = ""
10053110-51 = ""
10053110-53 = "Чем ещё заниматься ночью?"
10053110-57 = ""
10053110-58 = "Космос космо... Алия алиали..."
10053110-59 = "Ответьте на наш зов."
10053110-60 = "Космос космо..."
10053110-61 = "Алия алиали..."
10053110-63 = "...??"
10053110-64 = "Что ты делаешь?"
10053110-66 = "Тише! Если нарушишь призыв, внесёшь тёмную энергию во Вселенную!"
10053110-67 = "Существа за пределами Млечного Пути! Ответьте на наш зов!"
10053110-68 = ""
10053110-70 = ""
10053110-71 = ""
10053110-72 = "...Сделай что-нибудь. Она же твоя младшая."
10053110-73 = "Ну... Когда Цубаса начинает, лучше дать ей закончить."
10053110-74 = "Это всё равно что сказать ребёнку, что Санты не существует."
10053110-75 = "Поняла тебя громко и чётко."
10053110-76 = "Ага. Я поняла."
10053110-78 = "Эй! Связь рвётся! Наша связь с внешним миром слабеет!"
10053110-79 = ""
10053110-81 = ""
10053110-82 = ""
10053110-83 = "Алия алиали..."
10053110-84 = "Вложите душу!"
10053110-85 = "Космос космо..."
10053110-87 = "Так, будто правда верите!"
10053110-89 = "АЛИЯ АЛИАЛИ!!"
