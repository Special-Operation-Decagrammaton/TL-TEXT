[translation]
101130-1 = "Эпизод 13; Операция по возвращению Шале 1"
101130-3 = "Мы благополучно сбежали с базы PMC и спрятались в парке Коусаги."
101130-4 = "Понятно. Значит, вас втянули в заговор и похитили."
101130-5 = "Если бы не директор Канна, для вас всё могло закончиться очень плохо, Сенсей."
101130-6 = "Бешеная Гончая бросилась навстречу опасности, чтобы спасти Сенсея... Трудно поверить."
101130-7 = "О-она была так сильно ранена..."
101130-8 = "Сейчас она приходит в себя в палатке. Такая крепкая, как директор Канна, отдохнёт и будет в порядке."
101130-9 = "Сейчас главное — собрать как можно больше информации и проанализировать наши варианты."
101130-10 = "Мы не сможем придумать дальнейший план, пока сначала не разберёмся в ситуации."
101130-12 = "Сейчас в D.U. действует военное положение: запрещены связь, логистика и передвижение, а административная система отключена."
101130-13 = "Поскольку вся исходящая связь из D.U. заблокирована... мы не можем получить помощь из других академических районов, а местонахождение остальных начальников неизвестно..."
101130-14 = "Чтобы отменить введённое Кайзер военное положение, нужно вернуть административный контроль, но Генеральный студенческий совет потерял все полномочия после принятия резолюции о недоверии главному администратору!"
101130-15 = "Единственный способ это исправить — собрать шестерых начальников управлений, поддержавших резолюцию, и заставить их отменить недоверие или провести голосование о доверии."
101130-16 = "Но при военном положении собрать их невозможно! Замкнутый круг!"
101130-18 = "То есть сейчас мы вообще не можем рассчитывать на Генеральный студенческий совет?"
101130-19 = "А когда могли?"
101130-20 = "Но чтобы административная власть целиком перешла одной компании... Если бы академия SRT всё ещё существовала, этого можно было избежать..."
101130-21 = "И-и вдобавок башня Санктум всё ещё под контролем K-Кайзер... Что н-нам делать?"
101130-22 = "[s] «Вариантов у нас немного...»"
101130-24 = "Единственный путь — вторгнуться в единственное место, откуда сейчас управляют башней Санктум, и остановить их!"
101130-25 = "[s] «Что ты имеешь в виду? Куда?»"
101130-26 = "...В Шале!"
101130-27 = "[s] «Здание Шале...?»"
101130-28 = "Да. Точнее, в подвал Шале. В Производственную камеру!"
101130-29 = "Производственная камера — генератор материалов, оставленный президентом Генерального студенческого совета. Изначально доступ к нему имел только управляющий Шиттимским сундуком..."
101130-30 = "Похоже, Корпорация Кайзер пытается обойти аутентификацию и с помощью Производственной камеры получить контроль над башней Санктум!"
101130-31 = "Может, именно поэтому Кайзер похитили главного администратора Рин и заперли её в Шале!"
101130-32 = "[s] «Рин в Шале...?»"
101130-33 = "Да! Её заперли в тюрьме Шале! Вроде не ранена, но..."
101130-35 = ""
101130-37 = "Понятно. Нам нужно вернуть Шале, захваченный PMC."
101130-38 = "Т-только нашими силами...?"
101130-39 = "Ага. С другими районами связаться нельзя, так что либо мы, либо никто."
101130-40 = "Отлично! Я уже давно хотела взорвать Шале!"
101130-41 = "Принято! Я постараюсь изо всех сил!"
101130-42 = "Угх... но легко не будет... Наш противник — Кайзер, могущественная корпорация."
101130-43 = "Если они не идиоты, то знают, что мы придём. И я не думаю, что они идиоты..."
101130-45 = "...Вызовите спецназ Кайзер."
101130-46 = "С-Спецназ? В Шале?"
101130-47 = "Да. Сенсей придёт сюда."
101130-48 = "Сенсей лучше кого-либо знает, куда ударить в такой ситуации. Поэтому мы будем готовы."
101130-49 = "Изначально они были нашим козырем против тех лис, но используем их здесь."
101130-50 = "Быстрее!"
101130-51 = "П-Поняла!"
101130-52 = ""
101130-54 = "У меня есть запасной план на каждый запасной план. Застать меня врасплох не выйдет, так что покажи всё, на что способен, Сенсей из Шале."
101130-56 = "Угх... Нам нужно спасти главного администратора... и о-остановить заговор Кайзер... М-Мы правда всё это сможем...?"
101130-57 = "Вопрос не в том, сможем ли мы, Мию. Мы обязаны."
101130-58 = "Да, именно! От нас зависит мир в Кивотосе!"
101130-59 = "Х-хорошо... Я п-постараюсь...!"
101130-60 = ""
101130-62 = ""
101130-63 = "Угх, ладно! После этого я хочу минимум месяц отпуска. Этот вечный овертайм — полный кошмар!"
101130-64 = "Да чего вы вообще боитесь? PMC — ничто по сравнению с академией SRT, лучшими из лучших агентов во всём Кивотосе!"
101130-65 = "Технически мы новобранцы с очень небольшим полевым опытом..."
101130-66 = "И SRT вообще больше не существует..."
101130-67 = "И базируемся мы в лагере..."
101130-68 = "И у них даже учебников нет, поэтому они одалживают материалы Валькирии..."
101130-69 = "И что с того?! Я получила прекрасное образование по Blu-ray Валькирии!"
101130-70 = "Знаю-знаю! Хотя я бы не возражала, если бы они забрали их все..."
101130-71 = ""
101130-73 = ""
101130-74 = "[ns] «Мы справимся. Отряд RABBIT и Бюро общественной безопасности — начинаем.»"
101130-75 = "Для начала, Мияко, назови операцию."
101130-76 = "Х-хорошо. Тогда... раз нужно вернуть Шале... начнём операцию «Петрушка»..."
101130-77 = "А? Петрушка? В этом есть какой-то смысл? Звучит отстойно."
101130-78 = "Ну... П-потому что кролики любят петрушку..."
101130-79 = "По такой логике как насчёт морковки? Операция «Морковь» звучит круто!"
101130-80 = "М-мы уже использовали э-это название..."
101130-81 = "Тогда операция «Пончики»? Операция «Глазированные пончики»!"
101130-82 = "Звучит как название семейного рождественского спецвыпуска."
101130-83 = "Стоит вспомнить исходную цель. Как насчёт операции «Клевер»?"
101130-84 = "...Остановимся на «Операции по возвращению Шале»."
101130-85 = "Э-эх, как скучно."
101130-86 = "[ns] «Операция по возвращению Шале — начать!»"
101130-89 = "Сенсей... Пожалуйста, будьте осторожны. У меня чувство, что под поверхностью скрывается нечто большее..."
101130-90 = "Зловещие метеоры, которые я видела... Интересно, что они означали..."
101130-94 = ""
101130-96 = ""
101130-98 = ""
101130-99 = "Мы проверили вражеские танки Crusader и подтвердили численность войск! Они подготовили ударные вертолёты и баррикады..."
101130-100 = "Они определённо нас ждут..."
101130-101 = "Л-лобовой прорыв н-невозможен... Мияко, ч-что нам делать?"
101130-102 = "Если бы у нас было ещё немного подкреплений..."
101130-103 = ""
101130-109 = "А? Что это за сигнал...?"
101130-110 = ""
101130-112 = ""
101130-114 = "Мы их нашли! Сюда!"
101130-115 = "Мы получили ваше сообщение, Сенсей! Мы пришли помочь!"
101130-117 = "Бюро общественного порядка!"
101130-118 = "Правда?! Инициатива обычно не самая сильная сторона Бюро общественного порядка..."
101130-119 = "[s] «Валькирия! У нас подкрепление!»"
101130-121 = "Мы всё это время ждали приказов... А потом я увидела директора Канну и Сенсея возле городка Коусаги!"
101130-122 = "Мы сделаем всё возможное, чтобы помочь, Сенсей!"
101130-123 = ""
101130-125 = ""
101130-126 = "Мияко, с этим..."
101130-127 = "Да. Мы справимся."
101130-128 = "Тогда, Сенсей, каковы ваши приказы?"
101130-129 = "[s] «Я следую за тобой, Мияко. Я здесь, чтобы поддержать вас.»"
101130-130 = "...Поняла. Хорошо."
101130-131 = "Итак, все. Чтобы снять военное положение в D.U. и раздавить заговор Кайзер Group... начинаем Операцию по возвращению Шале!"
101130-132 = "Да!"
