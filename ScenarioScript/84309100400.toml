[translation]
84309100400-5 = "Ладно, всё решено. Проблема закрыта."
84309100400-6 = "Подтверждаю. Неполадка устранена, система безопасности стабильна."
84309100400-7 = "Хмм, раз уж мы взломали систему безопасности, теперь можем ей управлять?"
84309100400-8 = "Это избавило бы нас от кучи проблем и от всей этой возни с прятками."
84309100400-9 = "Хорошая мысль, но я не добавляла такую функцию. Я лишь сделала хотфикс для сбоя."
84309100400-11 = "Хм?"
84309100400-12 = "Погоди, мы знаем, что ты умеешь удалённо управлять компьютерами, мы сами это видели..."
84309100400-13 = "...у тебя был шанс взять под контроль всю систему наблюдения, и ты решила НЕ делать этого?!"
84309100400-14 = ""
84309100400-16 = ""
84309100400-17 = "Э-Это было бы неэтично. Я уже усвоила урок."
84309100400-18 = ""
84309100400-20 = ""
84309100400-21 = "Н-Ну, наверное."
84309100400-22 = "То есть это не совсем..."
84309100400-23 = ""
84309100400-25 = ""
84309100400-26 = ""
84309100400-27 = "*вздох* Ладно, неважно. Ты права."
84309100400-28 = "К тому же не хотим же мы сделать всё СЛИШКОМ лёгким, правда? Небольшой вызов — это хорошо."
84309100400-29 = "Тебе реально это нравится."
84309100400-30 = "А тебе нет?"
84309100400-31 = "Нет."
84309100400-33 = "...Хорошая работа. Обеих."
84309100400-34 = "Если возникнет что-то ещё, сообщу."
