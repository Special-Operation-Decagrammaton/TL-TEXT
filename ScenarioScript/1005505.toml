[translation]
1005505-1 = "По-дружески близко"
1005505-2 = "Я ждал Шигурэ возле ресторана в городе, где мы договорились встретиться."
1005505-3 = ""
1005505-6 = "Через некоторое время я увидел, как она идёт ко мне издалека."
1005505-7 = "[ns1] Помахать рукой.\n[ns2] «Я здесь, Шигурэ!»"
1005505-10 = "Ну же, Сенсей! Я знаю, уже иду!"
1005505-11 = ""
1005505-14 = ""
1005505-15 = "Перестаньте так махать! Люди могут нас увидеть."
1005505-16 = "Или вы хотели похвастаться, что вы со мной? *ахает* Сенсей! Вы специально?"
1005505-17 = ""
1005505-19 = ""
1005505-20 = "Хаха! Не смущайтесь так. Я просто вас дразнила."
1005505-21 = "Ну..."
1005505-22 = "Почему вы хотели встретиться в центре? От академии «Красная Зима» довольно далеко."
1005505-23 = "Хотите пойти в ресторан? Со мной?"
1005505-24 = "[s3] «Если есть предпочтения, скажи.»\n[s4] «Раз мы в центре, расскажи, что тебе нравится!»"
1005505-27 = "Ну, спасибо, Сенсей. Я рада, что пришла."
1005505-28 = "В Бывшем институте нам нечасто выпадает возможность поесть в хорошем ресторане."
1005505-29 = "Признаю, для кого-то вроде меня это довольно редкая роскошь."
1005505-30 = "Вы случайно... уже забронировали столик?"
1005505-31 = "Так я и думала. Тогда ведите."
1005505-32 = ""
1005505-34 = ""
1005505-35 = ""
1005505-37 = "...Я очень жду."
1005505-38 = ""
1005505-46 = "Мы с Шигурэ вкусно поели в ресторане и отлично провели время."
1005505-47 = "...Если не считать, что половину ужина я пытался помешать Шигурэ заказать водку."
1005505-48 = ""
1005505-53 = ""
1005505-54 = "Ух ты. Было очень вкусно. Спасибо, Сенсей."
1005505-55 = "Как бы сказать..."
1005505-56 = "Сегодня вы познакомили меня со множеством новых вещей."
1005505-57 = "Я отлично провела время... Мы поели вдвоём, причём вкусно и в хорошем ресторане... и я выпила чашку тёплого чая, которого никогда не найти в институте."
1005505-58 = "И только посмотрите на ночной центр города."
1005505-61 = "― Какой красивый вид...[wa:10]"
1005505-64 = "― Спасибо, что показали мне"
1005505-66 = "― эту удивительную ночь, Сенсей.[wa:980]"
1005505-69 = "[ns5] «Если хочешь, можем выбираться куда-нибудь чаще.»\n[ns6] «Можешь в любое время сказать, если чего-то захочешь.»"
1005505-70 = "― Мне приятно это слышать, но...[wa:1540]"
1005505-71 = "― Мне приятно это слышать, но...[wa:1540]"
1005505-73 = "― Честно, мне достаточно этого самого момента.[wa:40]"
1005505-76 = "― В городе[wa:550]"
1005505-78 = "― не видно звёзд."
1005505-81 = "― Здесь слишком сильное световое загрязнение,[wa:10]"
1005505-83 = "― и оно скрывает их сияние.[wa:900]"
1005505-86 = "― А мне"
1005505-88 = "― достаточно смотреть на них в темноте.[wa:1090]"
1005505-91 = "― Пока я могу разделить напиток[wa:10]"
1005505-93 = "― с дорогим мне человеком..."
1005505-96 = "― мне не нужно, чтобы вы водили меня в особенные места.[wa:10]"
1005505-99 = "Вообще-то мне даже немного неловко перед остальными студентами спецотряда в Бывшем институте."
1005505-100 = "Я забираю всё ваше особое отношение себе."
1005505-101 = "Нодока, наверное, даже немного меня возненавидит. Хи-хи."
1005505-102 = "[s7] «Мы можем прийти сюда все вместе.»\n[s8] «В следующий раз позовём весь спецотряд?»"
1005505-103 = ""
1005505-104 = ""
1005505-106 = ""
1005505-107 = ""
1005505-108 = "Хмм, Сенсей..."
1005505-109 = "Это был неправильный ответ."
1005505-110 = "Хотя, наверное, примерно этого я и ожидала."
1005505-111 = "[s] «О, я сказал что-то не то?»"
1005505-112 = "Я шутила. В основном."
1005505-113 = "Если хотите, думаю, идея неплохая."
1005505-114 = "Студенты спецотряда очень стараются. Они тоже будут рады такому."
1005505-115 = "Есть ли у меня предпочтение, куда пойти?"
1005505-116 = ""
1005505-118 = ""
1005505-119 = "Куда угодно, наверное."
1005505-120 = ""
1005505-122 = ""
1005505-123 = ""
1005505-125 = "Пока рядом со мной спецотряд и Сенсей..."
1005505-126 = "Это моё счастливое место."
