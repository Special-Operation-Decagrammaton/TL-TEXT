[translation]
1011705-1 = "Девушка в приключении"
1011705-2 = "Я отправился туда, где была Хикари."
1011705-3 = ""
1011705-5 = ""
1011705-6 = ""
1011705-7 = ""
1011705-8 = "[ns] «Эй, Хикари, чем сегодня занимаешься?»"
1011705-9 = ""
1011705-10 = "Беда. Большая-пребольшая беда..."
1011705-11 = ""
1011705-14 = "[ns] «Но тут же ничего нет...»"
1011705-15 = "Смотри, Сенсей. Смотри вниз. Пол — это лава."
1011705-16 = "Белое — камень. Там безопасно."
1011705-17 = "Всё остальное — лава. Упадёшь — умрёшь."
1011705-18 = ""
1011705-21 = "[ns1] «А...!»\n[ns2] «О, я помню эту игру!»"
1011705-24 = "Ты СТОИШЬ В ЛАВЕ."
1011705-25 = "Уходи оттуда! Прыгай-прыгай!"
1011705-28 = "Я запрыгнул на ближайший белый блок."
1011705-29 = ""
1011705-30 = "И-и-и... безопасно!"
1011705-31 = "Теперь туда! Не падай! Упадёшь — умрёшь!"
1011705-32 = "[s] «Ладно. Поехали.»"
1011705-33 = ""
1011705-35 = ""
1011705-36 = ""
1011705-38 = ""
1011705-39 = "Ищи что-нибудь красное! Это летающие острова!"
1011705-40 = "Не падай! Не поджарься!"
1011705-41 = ""
1011705-43 = ""
1011705-44 = "[ns] «Рядом со мной вообще нет ничего красного!»"
1011705-45 = "Тот магазин! Красный ковёр!"
1011705-46 = "Прыгай-прыгай, быстрее!"
1011705-47 = "[s] «Ты правда думаешь, я допрыгну?»"
1011705-48 = "Выбора нет! Давай!"
1011705-49 = "[s] «Цок...! Ладно, я сделаю это!!»"
1011705-50 = ""
1011705-55 = ""
1011705-56 = ""
1011705-57 = "[ns] «У-Ух ты!»"
1011705-58 = ""
1011705-61 = "О боже!"
1011705-62 = "[s] «Я... Мне ужасно жаль.»"
1011705-63 = "Ч-Что вы делаете...? Вы пытаетесь зайти внутрь?"
1011705-64 = "[s] «Н-Нет, понимаете, тут такое дело...»"
1011705-65 = ""
1011705-67 = ""
1011705-68 = ""
1011705-69 = "Красное."
1011705-70 = "Красное ИЛИ СМЕРТЬ."
1011705-71 = ""
1011705-73 = ""
1011705-74 = "Летающие острова — жизнь! Лава — нет!"
1011705-75 = "А?"
1011705-76 = "Ах..."
1011705-77 = "А-а, теперь понятно, что происходит."
1011705-78 = "Я тоже играл в это в детстве."
1011705-79 = "Ха-ха, тогда смотрите не упадите!"
1011705-80 = ""
1011705-82 = ""
1011705-83 = ""
1011705-84 = "[ns] «...К-Как же стыдно...»"
1011705-85 = "Стыд пройдёт!"
1011705-86 = "А смерть — нет!"
1011705-87 = "[s] «С этим не поспоришь, но...»"
1011705-88 = ""
1011705-91 = "[ns] «А, да какая разница. Давай просто продолжим!»"
1011705-92 = "Прыгай-прыгай..."
