1011705-106 = "Так я ненадолго вернулся в детство и ещё довольно долго наслаждался приключением вместе с Хикари. В конце концов мы добрались до Шале."
1011705-107 = ""
1011705-108 = "Фух. Новый рекорд. Дольше всего прожила."
1011705-109 = "[s3] «Было весело. Мне пора возвращаться к работе.»\n[s4] «Кстати, а ты-то куда шла, Хикари?»"
1011705-112 = ""
1011705-114 = ""
1011705-115 = "Не знаю. Забыла."
1011705-116 = "[s] «Надеюсь, из-за меня ты не пропустила ничего важного.»"
1011705-117 = "Не-а. Прошла без смертей. Хикари довольна."
1011705-118 = "Ты умер восемь раз, Сенсей. Для первой попытки неплохо."
1011705-119 = "[s] «Спасибо. Хотя это была не первая моя попытка.»"
1011705-120 = "..."
1011705-121 = "О. Дальше не пройти."
1011705-122 = "Тупик."
1011705-123 = "[s5] «Да, насчёт этого...»\n[s6] «Дальше все блоки одного цвета.»"
1011705-126 = "Смерть со всех сторон. Идти некуда."
1011705-127 = "Было весело, Сенсей. Дальше сам."
1011705-128 = "Не забывай."
1011705-129 = ""
1011705-132 = "[ns] «Ещё чего. Я тебя спасу!»"
1011705-133 = ""
1011705-134 = "Я поднял Хикари на руки и отнёс её в офис."
1011705-135 = "Ого! Мой герой!"
1011705-137 = "Хикари ещё долго гостила в Шале, прежде чем вернуться домой."
