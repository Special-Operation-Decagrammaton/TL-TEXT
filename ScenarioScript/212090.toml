[translation]
212090-1 = "Эпизод 9;Сацуки"
212090-3 = "[ns] «А если попробовать вот так...»"
212090-4 = ""
212090-9 = "[ns] «О, открыто»."
212090-10 = ""
212090-15 = "Вся комната была заставлена разнообразными электронными устройствами."
212090-16 = ""
212090-18 = ""
212090-19 = ""
212090-20 = "...Выделить несущую волну и..."
212090-21 = ""
212090-23 = ""
212090-24 = ""
212090-25 = ""
212090-26 = "Сацуки была так поглощена работой, что даже не заметила моего прихода."
212090-28 = "[ns] «Я пришёл, Сацуки»."
212090-29 = ""
212090-31 = ""
212090-32 = "А, Сенсей. Рада, что вы смогли прийти."
212090-33 = "[s] «Да. Не ожидал, что добираться сюда будет так непросто...»"
212090-34 = "Фу-фу. Сейчас нам приходится соблюдать строжайшую секретность."
212090-35 = "Вы убедились, что за вами никто не следил? Вас точно не преследовали?"
212090-36 = "[s] «Я несколько раз проверил»."
212090-37 = "Хорошо. Поверю вам на слово, Сенсей."
212090-38 = "Вы хотите знать, для чего нужна эта комната?"
212090-39 = "Добро пожаловать в тайную лабораторию Разведывательного комитета Пандемониума."
212090-40 = "Это моё крайне, исключительно личное помещение, где я в основном занимаюсь исследованиями контроля над разумом."
212090-41 = "Вы первый человек не из Пандемониума, побывавший здесь. Поистине большая честь."
212090-42 = "А теперь сразу к делу. Я позвала вас, чтобы официально попросить... стать моим подопытным."
212090-43 = "[s] «Что? Я?»"
212090-44 = "Да! Разве вы не обещали помогать моим исследованиям способов противодействия «NK Ультра»?"
212090-45 = "[s] «Э-это правда, но...!»"
212090-46 = "Я ведь не могу просто позвать сюда случайных студентов с площади! Это совершенно секретное помещение Пандемониума!"
212090-47 = "А поскольку вы пообещали сотрудничать со мной на протяжении следующей тысячи лет, да что там, даже дольше, я без колебаний вас пригласила."
212090-48 = "И к тому же проверять мою нынешнюю теорию на настоящем студенте было бы слишком рискованно."
212090-49 = "[s] «Ну, раз так...»"
212090-50 = "Я подумала, что человек с несгибаемой волей, не поддающийся ни соблазнам, ни пыткам, наверняка переживёт испытание. Кто подойдёт лучше вас, Сенсей?"
212090-51 = ""
212090-54 = "Хм? Откуда такое встревоженное выражение лица? Перестаньте притворяться. Нам нужно работать."
212090-55 = "Мне нужно всего лишь немного времени, чтобы уточнить формулу."
212090-58 = "Я молча сел и осмотрелся."
212090-62 = "...Если принудительно зафиксировать мозговые волны в определённом состоянии..."
212090-63 = "...С помощью бинауральных биений? Попробуем пока совместить эти методы..."
212090-64 = ""
212090-66 = ""
212090-67 = ""
212090-68 = "Сацуки выглядела необычайно серьёзной, продолжая расчёты."
212090-75 = "Некоторое время спустя..."
212090-78 = ""
212090-79 = "Хм, ничего не бывает просто..."
212090-80 = "Но я обязана справиться."
212090-81 = "Как глава Разведывательного комитета Пандемониума я не могу позволить прошлому победить."
212090-82 = "Вообще-то мне нужен перерыв. Сенсей, хотите чего-нибудь выпить? У меня есть кофе и... что-то ещё вон там."
212090-83 = ""
212090-87 = "Правда? Тогда, может, продемонстрирую вам своё умение заваривать кофе."
212090-88 = ""
212090-90 = ""
212090-94 = "Мы с Сацуки выпили горячего кофе и немного отдохнули."
212090-97 = "[ns] «Кстати, Сацуки...»"
212090-98 = "А?"
212090-99 = "«Старый Разведывательный комитет Геенны»...?"
212090-100 = "А, я ведь о нём упоминала, верно?"
212090-101 = "Значит, вы запомнили, как я представилась наследником упразднённого Разведывательного комитета Студенческого совета Геенны."
212090-102 = "Как вы, наверное, догадались, старый Разведывательный комитет подчинялся непосредственно Императору-тирану."
212090-103 = "У него был доступ к самой разной секретной и опасной информации, в том числе к этому злополучному проекту «NK Ультра»."
212090-104 = "Я не входила в прежний Разведывательный комитет... Вообще-то самым известным его участником была..."
212090-105 = "Нет, вы ведь спрашивали, почему я назвала себя наследником, преемником..."
212090-106 = ""
212090-108 = ""
212090-109 = "Фу-фу, это долгая и запутанная история..."
212090-110 = "Если вкратце, кто-то должен был собрать опасные исследования Императора-тирана, чтобы уничтожить их или надёжно спрятать."
212090-111 = "А почему это поручили мне... Большинство участников Разведывательного комитета ушли вместе с Императором-тираном. У остальных и без того хватало дел."
212090-112 = "Кому-то нужно было этим заняться, вот я и вызвалась."
212090-113 = "Наверное, Макото верила, что я не стану злоупотреблять полученной информацией."
212090-114 = "[s] «Теперь понятно...»"
212090-115 = "Так старый Студенческий совет Геенны был полностью упразднён. Как и прежний Разведывательный комитет."
212090-116 = "Немногие из нынешних участников Разведывательного комитета Пандемониума знают эту историю. Им это и не нужно."
212090-117 = "С тех пор мы неустанно уничтожали сведения и проекты Императора-тирана..."
212090-118 = ""
212090-120 = ""
212090-121 = "..."
212090-122 = "Думаю, Макото и представить не могла, что мы окажемся в таком тупике."
212090-123 = "[s] «...»"
212090-124 = "Не знаю, как проект «NK Ультра» Императора-тирана вернулся к жизни..."
212090-125 = "Но если это не случайность, значит, кто-то получил доступ к соответствующим сведениям и запустил его."
212090-126 = "И я не думаю, что это был кто-то из Геенны."
212090-127 = "Даже найденные нами в академии материалы были неполными, и всё обнаруженное мы уничтожили. Мы с Макото лично этим занимались."
212090-128 = "[s] «Значит... трансляцию устроил кто-то извне...?»"
212090-129 = "Весьма вероятно."
212090-130 = "...В Кивотосе ещё остались люди, поклоняющиеся Императору-тирану."
212090-131 = "Нам так и не удалось выяснить, где они находятся. Они действуют тайно, маленькими группами внутри разрозненной сети."
212090-132 = "Возможно, всем руководят бывшие члены Студенческого совета, бежавшие после свержения Императора-тирана..."
212090-133 = ""
212090-135 = ""
212090-136 = ""
212090-137 = "А...! А что, если попробовать...?!"
212090-138 = ""
212090-144 = "Сацуки, которую внезапно осенила идея, бросилась обратно к столу и продолжила работу."
212090-145 = ""
212090-148 = "Хотя её эксперимент мы так и не провели, похоже, она добилась некоторого прогресса."
212090-150 = "Следующий эпизод;Сопротивление"
