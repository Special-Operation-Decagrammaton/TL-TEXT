[translation]
212090-1 = "Episode 9;Satsuki"
212090-3 = "[ns] \"Let's see, do this... and then...\""
212090-9 = "[ns] \"Oh, it opened.\""
212090-15 = "(Stepping inside, the room was filled to the brim with electronic equipment.)"
212090-20 = "Extracting the carrier wave..."
212090-26 = "(She seems so focused that she hasn't noticed me.)"
212090-28 = "[ns] \"Satsuki.\""
212090-32 = "Oh, Sensei. I'm glad you managed to find your way here."
212090-33 = "[s] \"Yeah. But I had no idea there was a room that required such a complex procedure to enter...\""
212090-34 = "We can't have this information leaking out, can we?"
212090-35 = "You weren't followed on your way here, were you?"
212090-36 = "[s] \"I checked multiple times.\""
212090-37 = "Good. I'd expect nothing less from you, Sensei."
212090-38 = "This room? Oh, my apologies. I haven't explained it yet, have I?"
212090-39 = "Welcome to the Pandemonium Society Intelligence Department's secret chamber."
212090-40 = "I conduct my mind control research here."
212090-41 = "You're the first outsider I've ever brought in. Welcome."
212090-42 = "I've kept you waiting long enough. #nI called you here because I want you to be my test subject."
212090-43 = "[s] \"Me?\""
212090-44 = "You did say you'd actively cooperate with my research to counter the Kaiser's NK-Ultra project, didn't you?"
212090-45 = "[s] \"I did say that, but...!\""
212090-46 = "I can't exactly call other students here, can I? #nAfter all, this is a top-secret room for the Pandemonium Society's Intelligence Department."
212090-47 = "There's no one more qualified than you, Sensei."
212090-48 = "Besides, the hypothesis I've developed has too many dangerous variables to test on other students."
212090-49 = "[s] \"If that's the case...\""
212090-50 = "With your indomitable spirit—the kind that doesn't yield to any temptation or torture—#nyou should be fine even if there are side effects."
212090-54 = "Oh, so you can make that kind of face, too. #nThere's no need to put on a front just because you're nervous, you know?"
212090-55 = "I'll be done crunching these formulas in a moment, so please wait."
212090-58 = "(I sat down in a chair and looked around the room.)"
212090-62 = "If the brain waves are being forcibly locked into a specific state..."
212090-63 = "...using binaural beats? #nIf I synthesize this with this... for now—"
212090-68 = "(Satsuki continued to calculate something endlessly.)"
212090-75 = "(I wonder how much time has passed...)"
212090-79 = "It's not as simple as I thought."
212090-80 = "But I have to see this through."
212090-81 = "As the head of the Intelligence Department, it wouldn't look good if I lost to the past."
212090-82 = "That said, efficiency drops if I push myself too hard... I'll take a short break. #nWould you like something to drink, Sensei? I have a variety of things."
212090-87 = "Coffee, you say? Understood."
212090-94 = "(I took a short break with Satsuki, drinking warm coffee together.)"
212090-97 = "[ns] \"By the way.\""
212090-98 = "Yes?"
212090-99 = "...About the old Intelligence Department?"
212090-100 = "I believe I mentioned it when I introduced myself. #nThat I took over the Gehenna Student Council Intelligence Department that once existed."
212090-101 = "Hehe. So you remembered."
212090-102 = "Yes, that's right. The old Student Council Intelligence Department was an agency under the direct control of the Kaiser."
212090-103 = "It was an organization that handled highly classified information, including the NK-Ultra project in question."
212090-104 = "But I wasn't part of the Intelligence Department back then. #n...Actually, the one who was in the Intelligence Department was—"
212090-105 = "So, you're wondering why I call myself the successor to the Intelligence Department?"
212090-109 = "Well... there are many circumstances involved..."
212090-110 = "To put it simply, it's to recover, dispose of, and manage the information the Kaiser left behind."
212090-111 = "The reason I took it on was... because someone had to do it. #n...That's all."
212090-112 = "Most of the people who were originally in the Intelligence Department disappeared along with the Kaiser. #nEven those who remained had more pressing matters to attend to."
212090-113 = "I suppose Makoto-chan was convinced that I wouldn't misuse the information."
212090-114 = "[s] \"I see...\""
212090-115 = "Regardless, the Intelligence Department vanished along with the old Gehenna Student Council. #nThat's why the Pandemonium Society Intelligence Department was newly established."
212090-116 = "Hardly anyone among the current students knows about the old days. #nAnd there's no need for them to know, either."
212090-117 = "I've been finding and disposing of the Kaiser's information and plans all this time, but..."
212090-121 = "..."
212090-122 = "Makoto-chan probably never imagined something like this would happen either."
212090-123 = "[s] \"...\""
212090-124 = "...Why was NK-Ultra revived?"
212090-125 = "If it wasn't an accident, then someone is pulling the strings behind the scenes."
212090-126 = "I don't think it's anyone from within Gehenna."
212090-127 = "The old documents were incomplete, and we disposed of everything when the Kaiser was ousted. #nMakoto-chan and I did it personally."
212090-128 = "[s] \"If that's the case... an outsider...?\""
212090-129 = "Likely."
212090-130 = "...Somewhere in Kivotos, there are forces left that still worship the Kaiser."
212090-131 = "I haven't been able to locate the organization. I haven't even been able to catch a glimpse of them yet."
212090-132 = "I suspect it's being run by former student council executives who disappeared when the Kaiser was ousted, though..."
212090-137 = "Ah...! Could it be that this method...?"
212090-144 = "(Satsuki, having had a sudden realization, turned back to her desk and began working.)"
212090-148 = "(In the end, we couldn't conduct the experiment, but it seemed she had gained something from it.)"
212090-150 = "Next Episode;Resistance Formed"