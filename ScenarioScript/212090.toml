[translation]
212090-1 = "Episódio 09;Satsuki"
212090-3 = "[ns] \"Aqui assim, e depois......\""
212090-4 = ""
212090-9 = "[ns] \"Opa, abriu.\""
212090-10 = ""
212090-15 = "(Ao entrar, dei de cara com uma sala apinhada de aparelhos eletrônicos por todos os lados)"
212090-16 = ""
212090-18 = ""
212090-19 = ""
212090-20 = "Extraindo a onda portadora......"
212090-21 = ""
212090-23 = ""
212090-24 = ""
212090-25 = ""
212090-26 = "(Ela parecia tão concentrada que nem notou a minha presença)"
212090-28 = "[ns] \"Satsuki.\""
212090-29 = ""
212090-31 = ""
212090-32 = "Ora, Sensei! Que bom que conseguiu chegar sem se perder."
212090-33 = "[s] \"Consegui. Mas que ritual complicado pra entrar nessa sala, hein......\""
212090-34 = "Essas informações não podem vazar de jeito nenhum, compreende?"
212090-35 = "Não foi seguido no caminho até aqui, foi?"
212090-36 = "[s] \"Chequei várias vezes antes de vir.\""
212090-37 = "Excelente. Vindo de você, sei que não daria mole."
212090-38 = "Sobre este lugar? Ah, perdão, esqueci de fazer as devidas apresentações."
212090-39 = "Seja muito bem-vindo à Câmara Secreta do Departamento de Inteligência da Sociedade Pandemônio."
212090-40 = "É aqui que conduzo minhas pesquisas sigilosas sobre controle mental."
212090-41 = "Você é a primeira pessoa de fora a pisar aqui. Sinta-se honrado."
212090-42 = "Mas chega de rodeios.#nSe eu te chamei aqui, foi para que sirva de cobaia no meu experimento."
212090-43 = "[s] \"Cobaia...... eu?!\""
212090-44 = "Acaso não prometeu cooperar ativamente com as pesquisas para combater o Projeto NK-Ultra da Imperatriz do Trovão?"
212090-45 = "[s] \"Eu prometi ajudar, mas não ser cobaia......!\""
212090-46 = "Eu não poderia trazer qualquer aluna para cá, concorda?#nAfinal, esta sala é classificada como segredo de Estado de nível máximo da Pandemonium."
212090-47 = "Não há ninguém mais qualificado para essa tarefa além de você, Sensei."
212090-48 = "Sem contar que as minhas hipóteses teóricas ainda carregam riscos elevados demais para testar em jovens frágeis."
212090-49 = "[s] \"Sendo assim......\""
212090-50 = "Alguém com uma força mental de aço como você, inabalável diante de qualquer tentação ou tortura,#ncertamente tirará de letra quaisquer efeitos colaterais eventuais."
212090-51 = ""
212090-54 = "Nossa, olha só que carinha apavorada.#nNão precisa fingir pose se estiver tremendo na base, viu?"
212090-55 = "Falta pouco para eu fechar essas fórmulas matemáticas, espere só mais um instante."
212090-58 = "(Sentei na cadeira e fiquei observando os monitores ao redor)"
212090-62 = "Se as ondas cerebrais foram forçadas a um estado específico de fixação......"
212090-63 = "......E se eu usar batimentos binaurais?#nSintetizando isso com isso aqui......"
212090-64 = ""
212090-66 = ""
212090-67 = ""
212090-68 = "(Satsuki continuou fazendo cálculos intermináveis nos terminais)"
212090-75 = "(Quanto tempo será que se passou......?)"
212090-78 = ""
212090-79 = "Que quebra-cabeça espinhoso."
212090-80 = "Mas eu preciso dar conta."
212090-81 = "Como Diretora de Inteligência da Pandemonium, seria uma vergonha imperdoável ser derrotada pelo passado."
212090-82 = "Ainda assim, forçar demais a vista só derruba a produtividade...... vou fazer uma pausa rápida.#nAceita algo para beber, Sensei? Tenho várias opções."
212090-83 = ""
212090-87 = "Café, então? Deixe comigo."
212090-88 = ""
212090-90 = ""
212090-94 = "(Fizemos uma pausa agradável saboreando o café quente)"
212090-97 = "[ns] \"Mudando de assunto......\""
212090-98 = "Diga lá."
212090-99 = "......Quer saber sobre o antigo departamento de inteligência?"
212090-100 = "Acho que cheguei a mencionar quando me apresentei a você:#nque herdei as funções do antigo órgão de inteligência do conselho estudantil de Gehenna."
212090-101 = "Fufufu. Fico feliz que ainda se lembre disso."
212090-102 = "Pois é. O antigo órgão de inteligência respondia diretamente à finada Imperatriz do Trovão."
212090-103 = "Era a divisão encarregada dos arquivos mais ultra-secretos e obscuros, incluindo o famigerado Projeto NK-Ultra."
212090-104 = "Porém, eu nunca fiz parte daquele conselho antigo.#n......Na verdade, quem operava por lá era――"
212090-105 = "E por que eu me intitulo a sucessora do departamento de inteligência, você se pergunta?"
212090-106 = ""
212090-108 = ""
212090-109 = "É uma longa história cheia de pormenores, mas......"
212090-110 = "Em resumo: assumi para recolher todos os dados deixados pela Imperatriz, destruí-los ou colocá-los sob vigilância estrita."
212090-111 = "Eu topei essa incumbência ingrata porque...... alguém precisava fazer o trabalho sujo.#n......Apenas por isso."
212090-112 = "A grande maioria dos oficiais originais da inteligência sumiu do mapa junto com a derrocada da Imperatriz do Trovão.#nE quem sobrou tinha urgências muito maiores para administrar."
212090-113 = "Além disso, a Makoto-chan tinha plena certeza de que eu jamais usaria aquelas informações para o mal."
212090-114 = "[s] \"Entendi perfeitamente......\""
212090-115 = "De todo modo, junto com a dissolução do antigo conselho estudantil, aquele órgão de inteligência foi extinto.#nE foi então criada a Diretoria de Inteligência da Sociedade Pandemônio."
212090-116 = "Quase nenhuma aluna da geração atual faz ideia dessa história antiga.#nNem precisam saber, pra falar a verdade."
212090-117 = "Desde então, passei meu tempo caçando cada rastro e plano da Imperatriz para incinerar tudo, mas......"
212090-118 = ""
212090-120 = ""
212090-121 = "......"
212090-122 = "Nem a Makoto-chan poderia prever um pesadelo desses acontecendo agora."
212090-123 = "[s] \"......\""
212090-124 = "......Por que o NK-Ultra ressuscitou do nada?"
212090-125 = "Se não foi um acidente fortuito, significa que há alguém movendo as peças pelas sombras."
212090-126 = "E não creio que seja alguém de dentro de Gehenna."
212090-127 = "As anotações antigas estavam incompletas, e destruímos tudo na queda da Imperatriz.#nA Makoto-chan e eu, com nossas próprias mãos."
212090-128 = "[s] \"Se não foi de dentro...... seria alguém de fora......?\""
212090-129 = "Muito provavelmente."
212090-130 = "......Em algum recanto obscuro de Kivotos, ainda operam forças remanescentes que idolatram a Imperatriz do Trovão."
212090-131 = "Ainda não consegui localizar a base dessa organização. Nunca sequer conseguimos segurar a ponta do rastro delas."
212090-132 = "Suspeito que seja operada pelos antigos altos escalões do conselho estudantil que fugiram na época da queda, mas......"
212090-133 = ""
212090-135 = ""
212090-136 = ""
212090-137 = "Ah......! Espere aí! E se usarmos essa rota......?!"
212090-138 = ""
212090-144 = "(Parecendo ter tido uma iluminação genial, Satsuki voltou correndo para a mesa de trabalho)"
212090-145 = ""
212090-148 = "(No fim, o teste em mim não aconteceu, mas parecia que ela havia encontrado uma pista preciosa)"
212090-150 = "Próximo Episódio;Nasce a Resistência"
