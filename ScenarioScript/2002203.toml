[translation]
2002203-1 = "Даже если немного не так"
2002203-2 = "Столовая Геенны"
2002203-3 = "Я ждал Фууку в ученической столовой Геенны, как она и попросила."
2002203-4 = ""
2002203-7 = ""
2002203-8 = "Добро пожаловать, Сенсей."
2002203-9 = "[ns] «О, Фуука! Когда ты успела переодеться?»"
2002203-10 = ""
2002203-12 = ""
2002203-13 = ""
2002203-14 = "Н-ну как? Тебе... нравится?"
2002203-15 = "[ns1] «Мило! Тебе очень идёт!»\n[ns2] «Фуука в кимоно! Какая прелесть!»"
2002203-18 = "Хи-хи. Спасибо, Сенсей."
2002203-19 = "Я немного стеснялась этого... Глупо, знаю."
2002203-20 = "Хм? Тебе неловко, что ты позвал меня обратно в столовую во время праздничных каникул?"
2002203-21 = "Не пойми неправильно! Столовая — это моё святилище и поле боя!"
2002203-22 = "И я могу быть в этом святилище вместе с тобой, Сенсей! Только вдвоём!"
2002203-23 = "Это делает меня счастливее любого праздника."
2002203-24 = "[s] «Но... получается, ты работаешь в свой драгоценный выходной.»"
2002203-25 = "Сенсей. Хватит переживать о таких глупостях."
2002203-26 = ""
2002203-28 = ""
2002203-29 = "Пожалуйста, подожди здесь немного. Всё уже подготовлено, так что я быстро."
2002203-30 = "Через несколько минут ты попробуешь лучшую новогоднюю лапшу в своей жизни!"
2002203-32 = ""
2002203-34 = ""
2002203-35 = ""
2002203-36 = ""
2002203-37 = "Я заранее приготовила бульон кацуо-даси и поставила его в холодильник..."
2002203-38 = ""
2002203-40 = ""
2002203-41 = ""
2002203-43 = "Сначала нарежем маринованные куриные бёдра и зелёный лук небольшими кусочками..."
2002203-44 = ""
2002203-46 = ""
2002203-47 = ""
2002203-49 = "Сначала обжарим зелёный лук... потом на том же масле куриные ножки..."
2002203-50 = "Добавим в кацуо-даси сахар, соевый соус и мирин и слегка проварим гарнир..."
2002203-51 = ""
2002203-53 = ""
2002203-55 = "Лапша... Ей не нужно долго вариться. Отлично, теперь промою её холодной водой..."
2002203-56 = ""
2002203-58 = ""
2002203-59 = ""
2002203-61 = "И наконец, зальём бульоном и добавим гарнир..."
2002203-62 = "Готово, Сенсей! Новогодняя лапша Фууки на двоих!"
2002203-63 = "Я смешала вкус куриного сока и зелёного лука, так что должно получиться вкусно."
2002203-64 = "Изначально я хотела приготовить ещё и жареные креветки, но..."
2002203-65 = "[s3] «И так уже идеально.»\n[s4] «Этого более чем достаточно.»"
2002203-68 = "Т-ты правда так думаешь? Я рада. Хи-хи."
2002203-69 = "Приятного аппетита!"
2002203-70 = "[s] «Спасибо за еду, Фуука!»"
2002203-71 = "Давай есть, Сенсей!"
2002203-73 = "Мы с Фуукой опустошили свои миски в мгновение ока."
2002203-75 = "Н-ну... Как тебе? Тебе... понравилось?"
2002203-76 = "[s5] «Это была лучшая еда на свете, Фуука.»\n[s6] «Это самая вкусная новогодняя лапша, которую я когда-либо ел.»"
2002203-79 = "Правда? Ты серьёзно? Спасибо!"
2002203-80 = "Нет ничего приятнее, чем видеть, что кому-то нравится моя еда."
2002203-81 = "Особенно если этот кто-то — ты."
2002203-82 = "Ты... благодаришь меня?"
2002203-83 = "Н-нет, Сенсей! Что ты! Это я должна тебя благодарить за то, что ты потакал моей прихоти и пришёл сюда!"
2002203-84 = "Я всё ждала подходящего момента, чтобы сказать это, но..."
2002203-85 = ""
2002203-87 = ""
2002203-89 = ""
2002203-90 = "С Новым годом, Сенсей!"
2002203-91 = "[ns] «И тебя с Новым годом, Фуука.»"
2002203-93 = "Мы ещё немного остались в святилище Фууки, разговаривая и перекусывая, а затем я проводил её домой."
