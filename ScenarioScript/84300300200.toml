[translation]
84300300200-5 = "Я оценила ситуацию, Юризоно Сейя."
84300300200-6 = "К счастью, пришла к выводу, что причин опасаться тебя нет."
84300300200-7 = "Более того... да, мы должны извиниться, что втянули тебя во внутреннее дело Миллениума."
84300300200-8 = "Нет, это я должна извиниться, что вмешалась в ваши дела."
84300300200-9 = "Но, похоже, мои подозрения всё же были обоснованы."
84300300200-10 = "Вы сообщили «Семинару»? Думаю, нужно сказать им немедленно."
84300300200-11 = "Обычно мы бы так и сделали... но сейчас всё сложно."
84300300200-12 = "Мы не знаем точно, что они задумали. Знаем только, что готовится нечто крупное."
84300300200-13 = "Если придём в «Семинар» только с этим, они остановят Выставку Миллениума. А я этого не хочу."
84300300200-14 = "Я понимаю, но ничего не поделать. Другого выхода у нас..."
84300300200-15 = ""
84300300200-17 = ""
84300300200-18 = ""
84300300200-19 = "...Понятно."
84300300200-20 = "Вот как всё обстоит."
84300300200-21 = "Поэтому ты скрывалась вместе с Микамо Нэру и пыталась решить проблему из тени."
84300300200-22 = "Цукацуки Рио. Ты вполне оправдываешь свою репутацию."
84300300200-23 = "Выставка Миллениума — одно из важнейших событий нашей школы. Что бы ни потребовалось и что бы они ни задумали, мы обязаны её спасти."
84300300200-24 = "Во время подготовки Выставки мы обнаружили подозрительные пакеты данных. Нам нужно выяснить, что это за данные."
84300300200-25 = "Мы пока даже не знаем, чего они хотят..."
84300300200-27 = "...Погодите."
84300300200-28 = "Нэру?"
84300300200-29 = "МЫ не знаем, но ОНА подслушивала ещё до нашего прихода."
84300300200-30 = "Ты ведь заметила их первой, да? И пошла следом, как сама сказала. Значит, что-то слышала."
84300300200-32 = "Точное замечание."
84300300200-33 = "Да, действительно, часть их плана я услышала."
84300300200-34 = "Это хорошие новости. Не поделишься с нами?"
84300300200-35 = "Конечно..."
84300300200-36 = ""
84300300200-38 = ""
84300300200-39 = "...за определённую цену."
84300300200-40 = "Что?"
84300300200-42 = "Что?"
84300300200-43 = "По-моему, ты не понимаешь, что здесь поставлено на карту. Может, мы слишком с тобой добры..."
84300300200-44 = "Отойди, Нэру. Она из Чаепития Тринити. Если с ней что-нибудь случится, ситуация, мягко говоря, сильно обострится."
84300300200-45 = "И?"
84300300200-46 = "Ты серьёзно спрашиваешь?"
84300300200-47 = "...Для начала выслушаем её."
84300300200-48 = "Если ей нужны деньги или какая-то сделка между школами, то, пока требования разумны, я могу помочь это устроить."
84300300200-49 = "Мы просто позволим ей нами помыкать?"
84300300200-50 = "Я этого не сказала. Я лишь указываю, что не стоит принимать решения, пока не выясним все переменные."
84300300200-51 = "Итак, Юризоно Сейя, чего ты хочешь?"
84300300200-53 = "Ты сговорчивее, чем я думала. Благодарю."
84300300200-54 = "Мне не нужны деньги и ничего между нашими школами. Это личный вопрос, тесно связанный с этим делом."
84300300200-55 = ""
84300300200-57 = ""
84300300200-58 = "Я хочу... присоединиться к вашей операции."
84300300200-59 = ""
84300300200-62 = ""
84300300200-63 = "Ты... что?"
84300300200-64 = "О чём ты говоришь?"
84300300200-65 = "Я не совсем понимаю. Ты хочешь сотрудничать с нами, чтобы раскрыть это дело?"
84300300200-66 = "По сугубо личным причинам, которые я не считаю нужным раскрывать, да."
84300300200-68 = "Что ты несёшь?"
84300300200-69 = "Рио, нам не обязательно это слушать. Дай я выведу её отсюда и где-нибудь высажу."
84300300200-71 = "И что потом, Нэру? Допустим, она расскажет кому-нибудь, что задумали они или что задумали МЫ. Что тогда?"
84300300200-72 = "Кроме того, о наших целях она знает больше нас. Игнорировать это было бы нелогично."
84300300200-73 = "Ладно, тогда я заставлю её говорить..."
84300300200-74 = ""
84300300200-76 = ""
84300300200-77 = "Юризоно Сейя."
84300300200-78 = "...Есть долг, который я ещё не вернула."
84300300200-79 = ""
84300300200-81 = ""
84300300200-82 = "Хорошо. Разрешаю присоединиться к операции при условии, что ты будешь выполнять мои приказы, что бы ни случилось."
84300300200-83 = ""
84300300200-86 = ""
84300300200-87 = ""
84300300200-88 = "Чего?"
84300300200-89 = "Всё нормально, Нэру. Ей можно доверять. Она не сделает ничего, что подвергнет нас риску."
84300300200-90 = "Хм?"
84300300200-91 = "...Ха."
84300300200-92 = "Ого. Ты правда произнесла слово «доверять»? Наконец-то взрослеешь?"
84300300200-93 = "Она ДЕЙСТВИТЕЛЬНО заслуживает доверия, Нэру, и я хочу, чтобы ты это поняла."
84300300200-94 = "Хм..."
84300300200-95 = "Ладно, как скажешь. Но нянчиться с ней я не буду. И пусть не мешается под ногами."
84300300200-96 = "Не переживай. У вас с ней будут совершенно разные роли."
84300300200-97 = "В отличие от нас, она может свободно ходить по залу Выставки — то есть действовать открыто. Никто не посмотрит на неё дважды, поэтому так она сможет безопасно собрать много информации."
84300300200-98 = "Сейя, раз тебя изначально пригласили на мероприятие, осмотрись и докладывай обо всём подозрительном."
84300300200-99 = "Тем временем мы с Нэру проверим Центр данных и другие похожие источники, чтобы выяснить, что скрывается под поверхностью."
84300300200-100 = "Атака с двух направлений. Договорились?"
84300300200-101 = ""
84300300200-103 = ""
84300300200-105 = "..."
84300300200-106 = "Что, проблема? Извини, если работа кажется слишком скучной."
84300300200-107 = "Не думай, что без тебя мы пойдём на пикник."
84300300200-108 = "Нет, ты права, это лучший вариант. Я выдвинула тяжёлое требование, а ты меня выслушала и согласилась. Спасибо."
84300300200-110 = "Хорошо. Решено. Теперь твоя часть сделки."
84300300200-111 = "Что ты услышала, пока пряталась?"
84300300200-112 = "Их имён я не слышала, да и подробностей было немного..."
84300300200-113 = "Но я совершенно ясно услышала, чего они хотят."
84300300200-114 = "А вон то..."
84300300200-115 = "..."
84300300200-116 = "..."
84300300200-117 = ""
84300300200-119 = ""
84300300200-120 = ""
84300300200-121 = "...устроить «Катастрофу Выставки Миллениума»."
