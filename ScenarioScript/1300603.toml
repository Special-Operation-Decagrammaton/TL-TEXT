[translation]
1300603-1 = "Невысказанный секрет бесёнка"
1300603-2 = "(По просьбе Муцуки я пришёл в офис Решатели проблем 68.)"
1300603-3 = "Добро пожаловать, Сенсей!"
1300603-4 = "Я приготовила кучу всего для наших сегодняшних игр, Сенсей. ♥"
1300603-5 = ""
1300603-6 = "[s] «Это та сумка, которую ты всегда носишь.»"
1300603-7 = "Начнём с игральных карт..."
1300603-8 = "У меня есть шахматы, реверси, нарды... О, и карута!"
1300603-9 = "[s] «Это всё настольные игры?»"
1300603-10 = "Ага, это игры, которые я принесла на сегодня."
1300603-11 = "Веселиться снаружи хорошо, но расслабиться дома за настолками тоже должно быть весело. Я уверена!"
1300603-12 = "С какой начнём, Сенсей?"
1300603-14 = "(Так мы с Муцуки сыграли во множество настольных игр.)"
1300603-15 = "(Примерно пять часов спустя...)"
1300603-17 = "Хаха, было весело!"
1300603-18 = "Ого, посмотри на время! Так быстро пролетело!"
1300603-19 = "[s] «Такова магия настольных игр...»"
1300603-20 = "Устал, Сенсей? Хочешь передохнуть?"
1300603-21 = "Я вот хочу пить. Секунду. Где-то здесь должны быть напитки..."
1300603-22 = ""
1300603-23 = ""
1300603-24 = ""
1300603-25 = "А, точно!"
1300603-26 = "Кстати, даже не думай заглядывать в мою сумку, пока меня нет, ясно?"
1300603-27 = "Это женский секрет!"
1300603-28 = "Понял?"
1300603-29 = ""
1300603-31 = "[s] «Сумка?»"
1300603-32 = "(Я понял, что все настольные игры, в которые мы играли, Муцуки доставала из этой сумки.)"
1300603-33 = "(Их было как минимум двадцать...)"
1300603-34 = "[s1] «Постой.»\n[s2] «Это... физически возможно?»"
1300603-35 = "*дёрг*"
1300603-36 = "*дёрг*"
1300603-39 = "[ns] «Сумка только что шевельнулась?»"
1300603-44 = "[ns] «Наверное, показалось...»"
1300603-46 = "[ns] «Лучше уберу настолки, пока Муцуки не вернулась...»"
1300603-47 = "*дёрг*"
1300603-50 = "[ns] «Я точно это видел...!»"
1300603-51 = "*шевелится* *шевелится*"
1300603-52 = "[ns] *глоть*"
1300603-54 = "[ns3] «...Н-надо проверить.»\n[ns4] «Как сказала Муцуки... нельзя заглядывать в чужую сумку.»"
1300603-55 = "(Глоток)"
1300603-58 = "[ns5] «Ну тогда...»"
1300603-60 = "(...!)"
1300603-62 = "(Внутри сумки было...)"
1300603-63 = "(Мне показалось неправильным заглядывать в чужую сумку, пока хозяина нет.)"
1300603-64 = "Сенсей?"
1300603-66 = "[ns] «Гах?!»"
1300603-67 = "Что такое, Сенсей? У тебя вид, будто привидение увидел."
1300603-68 = "[s] «А? Только что сумка...»"
1300603-69 = "Что с сумкой?"
1300603-71 = "[s] «Эм, ничего...»"
1300603-72 = "Ну и ладно. Я принесла напитки."
1300603-73 = "Некогда на это отвлекаться. У нас ещё столько игр!"
1300603-74 = "Так что начинаем второй раунд. ♥"
1300603-76 = "(Я играл с Муцуки до заката, и больше ничего странного не случилось.)"
1300603-78 = "Кихихихихи..."
1300603-79 = "Рада, что ты не узнал, что внутри, Сенсей."
1300603-80 = "И я не расскажу. Ни сейчас, ни когда-либо. ♥"
