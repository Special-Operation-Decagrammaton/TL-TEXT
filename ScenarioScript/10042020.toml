[translation]
10042020-1 = "Эпизод 2;Одно правило"
10042020-4 = "Здравствуйте, Сенсей."
10042020-5 = "Не думала, что мы встретимся вот так, но всё равно рада вас видеть."
10042020-6 = "Так что за дело, о котором вы говорили? Судя по тому, что вы вызвали сразу двух членов Префектурной команды Геенны, оно довольно серьёзное."
10042020-7 = "Если это окажется пустяком... ну, мы всё равно разберёмся, но после этого я вам всё выскажу!"
10042020-8 = "[s1] «Ну, насчёт этого...»\n[s2] «Это будет сложно объяснить...»"
10042020-11 = ""
10042020-13 = ""
10042020-16 = ""
10042020-17 = "Д-Чинацу. Иори..."
10042020-18 = ""
10042020-19 = "Клуб школьной столовой? Неожиданно..."
10042020-20 = "И правда. Такое скорее ждёшь от Департамента горячих источников или Общества гурманов, но от Клуба школьной столовой?"
10042020-21 = "Будьте добры, расскажите подробности."
10042020-22 = "Ну, видите ли…"
10042020-24 = "..."
10042020-25 = "Эм... То есть твоя готовка породила какую-то странную форму жизни, а потом она сбежала?"
10042020-26 = "[s] «Знаю, в это трудно поверить...»"
10042020-27 = "...Погодите, стоп."
10042020-28 = "Это мне кое-что напоминает..."
10042020-29 = "С вечеринки Общества Пандемониума, верно?"
10042020-30 = "Да, время от времени мы получаем подобные отчёты..."
10042020-31 = "Тогда что... Это какой-то новый вид биотерроризма?"
10042020-32 = "В Геенне полно террористов... но я не ожидала, что Клуб школьной столовой тоже в этом замешан."
10042020-33 = "Т-терроризм?! Вы ставите нас в один ряд с Харуной...?!"
10042020-34 = "Полагаю, это скорее несчастный случай."
10042020-35 = "Если подумать, мы, вероятно, уделяли им недостаточно внимания лишь потому, что они НАЗЫВАЮТСЯ Клубом школьной столовой."
10042020-36 = "Кстати, во время их санитарной проверки мы ведь нашли тот странный апельсиновый сок..."
10042020-37 = "?!"
10042020-38 = "Н-ну... Это было...!"
10042020-39 = "Иори. Как бы там ни было, Клуб школьной столовой всё же действует из лучших побуждений."
10042020-40 = "Да ладно, неважно. Я ведь и сама ем школьные обеды."
10042020-41 = "Значит, ничего серьёзного. Я бы и одна с этим справилась."
10042020-42 = "Отойдите и смотрите. Особенно вы... Сенсей."
10042020-43 = "...Если с вами что-нибудь случится, проблемы будут у меня."
10042020-44 = "[s] «О... Значит, ты всё-таки обо мне переживаешь...»"
10042020-45 = "Ч-что вы такое говорите?! Всё совсем не так!"
10042020-46 = "В любом случае, предоставьте это мне. Я скоро вернусь."
10042020-47 = ""
10042020-50 = "[log]Стоило ей это сказать...[/log]"
10042020-53 = "[log]...как меня внезапно пронзило острое дурное предчувствие![/log]"
10042020-55 = ""
10042020-57 = "[ns5] «И-Иори?»\n[ns6] «Погоди! Подожди секунду!»"
10042020-60 = "Я пошла!"
10042020-61 = ""
10042020-63 = ""
10042020-64 = ""
10042020-65 = "...Вот и ушла."
10042020-66 = "Ей стоило вас послушать, Сенсей."
10042020-67 = "Я бы хотела подробнее узнать, что произошло. Конечно, если Клуб школьной столовой готов всё объяснить."
10042020-68 = "Уа-а, простите нас... Уа-а..."
10042020-69 = "Пожалуйста, не падайте духом."
10042020-70 = "Хорошо... Спасибо, Чинацу."
10042020-71 = "...Когда свидетели падают духом, их показания обычно становятся менее подробными."
10042020-72 = "Так вот что ты имела в виду?!"
10042020-73 = "...Фуфу."
10042020-74 = "Я хочу сказать, что вам не о чем переживать."
10042020-76 = "...И, кажется, это всё, что я знаю."
10042020-77 = "Понятно. У Клуба школьной столовой был выходной. Фуука ушла по своим делам, а Джури устроилась на подработку."
10042020-78 = "Из-за неожиданного стечения обстоятельств тебе пришлось работать на кухне. И внезапно оказалось, что панкейки у тебя получаются очень хорошо."
10042020-79 = "Да, точно! Именно так!"
10042020-80 = "Хм."
10042020-81 = "Что ж, возможно, я пока не ДО КОНЦА понимаю ситуацию..."
10042020-82 = "Н-Ну..."
10042020-83 = "И всё же проблема остаётся проблемой, а до сих пор ты отлично справлялась как подработчик."
10042020-84 = "Думаю, это вполне можно назвать «несчастным случаем»."
10042020-85 = "В-вы правда так думаете? Я была бы очень благодарна..."
10042020-86 = "Ты упомянула взрыв в кладовой кафе."
10042020-87 = "Хотя, конечно, по местным меркам даже это довольно обыденно."
10042020-88 = "[ns7] «(„Довольно обыденно“, значит?)»\n[ns8] «(Типичная Геенна.)»"
10042020-91 = "В любом случае Иори скоро должна вернуться с результатами."
10042020-92 = "Вообще-то, я ей позвоню. Одну минуту..."
10042020-93 = ""
10042020-95 = ""
10042020-97 = "Хм?"
10042020-98 = "Она не отвечает. Попробую ещё раз..."
10042020-99 = ""
10042020-101 = ""
10042020-103 = "...Странно. Но... что ж, не всё всегда идёт по плану."
10042020-104 = "Неужели...?"
10042020-105 = "Ещё раз..."
10042020-106 = ""
10042020-108 = ""
10042020-110 = "И она... всё ещё не отвечает."
10042020-111 = "..."
10042020-112 = "Сенсей? Джури? Та необъяснимая форма жизни, о которой вы говорили..."
10042020-113 = "Что случилось с первым посетителем, на которого она напала?"
10042020-114 = "Ну, он потерял сознание, а всё лицо было залито сиропом..."
10042020-115 = "Вот как..."
10042020-116 = "[ns] «О чём ты думаешь, Чинацу?»"
10042020-117 = "Думаю, мне стоит немного пересмотреть своё первоначальное мнение об этой ситуации."
10042020-118 = "Если точнее, я перешла от полного недоверия к... осторожному подозрению."
10042020-119 = "То, что Иори недоступна, крайне необычно. Она всегда была надёжной и исполнительной."
10042020-120 = "Другими словами, она всегда отвечает сразу, если только у неё нет очень веской причины. А чтобы она пропустила три звонка подряд..."
10042020-121 = "[s] «Дай я тоже попробую ей позвонить, на всякий случай.»"
10042020-122 = "Да, пожалуйста."
10042020-123 = ""
10042020-125 = ""
10042020-128 = "...Всё ещё ничего?"
10042020-129 = "Н-невозможно...!"
10042020-130 = "[s9] «Я примерно этого и ожидал, судя по тому, как развивается сюжет...»\n[s10] «В таких жанрах никогда нельзя разделяться...»"
10042020-133 = "...? О чём вы говорите, Сенсей...?"
10042020-134 = "Эм, простите! Может, нам уже пойти искать Иори?"
10042020-135 = "Да, пожалуй. Сенсей, у меня очень плохое предчувствие насчёт всего этого..."
10042020-136 = "...И Сенсей, у вас наверняка есть свои мысли. Как вы оцениваете ситуацию?"
10042020-137 = "[s11] «Иори, возможно, уже вся в сиропе...»\n[s12] «К тому времени, как мы её найдём, она может быть сладкой с головы до ног.»"
10042020-140 = "Ч-что?!"
10042020-141 = "Иори... хорошо приправлена?"
10042020-143 = ""
10042020-144 = "Наверное, это самая тёмная улица на самой окраине Геенны..."
10042020-145 = "Ну, именно сюда нас и привели лужи слизи..."
10042020-146 = "А?! В-вон там! Смотрите! Под всей этой слизью кто-то лежит! Это Иори?"
10042020-149 = "[ns] «О нет! Иори, ты в порядке?!»"
10042020-150 = "Хм... Одну минуту. Дайте я её осмотрю..."
10042020-151 = ""
10042020-153 = ""
10042020-154 = ""
10042020-155 = "...По крайней мере, её жизни ничего не угрожает. Но пахнет она довольно странно..."
10042020-156 = "...Да, боюсь, этот запах останется с ней надолго. И это вещество очень липкое..."
10042020-157 = "И это всё, что ты можешь сказать? Она вообще без сознания!"
10042020-158 = "Когда долго работаешь с Иори, подобное со временем перестаёт пугать."
10042020-159 = "...Но всё же, на всякий случай, нам стоит проконсультироваться со специалистом."
10042020-160 = "[s] «Со специалистом...?»"
10042020-161 = "Кроме тебя, есть ещё специалист по такому?"
10042020-162 = "Да. В подобных вопросах я знаю как раз того человека, который сможет помочь."
10042020-163 = "Хотя она и довольно эксцентрична..."
10042020-165 = "...Понятно. Значит, поэтому вы меня позвали. Ясно."
10042020-166 = "Но я согласна с мнением Чинацу. С ней всё должно быть в порядке."
10042020-167 = "...Похоже, сироп оказался не в её вкусе."
10042020-168 = "...?! С-сироп...? Вкус...? От этого правда можно потерять сознание?!"
10042020-169 = "..."
10042020-170 = "...Вкус показался ей крайне неприятным."
10042020-171 = "Ладно, но это вообще-то не отвечает на вопрос!"
10042020-172 = ""
10042020-174 = ""
10042020-175 = "[ns13] «П-по крайней мере, теперь мы знаем, что с ней всё будет хорошо!»\n[ns14] «И, кстати, прости! Я не знал, что сегодня у тебя выходной!»"
10042020-178 = "[ns] «...И тебе очень идёт повседневная одежда!»"
10042020-179 = "Всё в порядке. Клуб неотложной медицины всегда должен быть готов первым прийти на помощь."
10042020-180 = "И спасибо за комплимент. Мне приятно."
10042020-181 = "Я заберу тело — то есть ИОРИ — под опеку Клуба неотложной медицины."
