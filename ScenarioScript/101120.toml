[translation]
101120-1 = "Эпизод 12; Побег 2"
101120-3 = "Сюда!"
101120-5 = "[ns] «Арона, можешь найти способ связаться с другими студентами?»"
101120-6 = "Сложно... Башня Санктум отключила сети связи..."
101120-7 = "Но не невозможно! Я, Супер-Арона, перехитрю башню Санктум! Сейчас что-нибудь придумаю!"
101120-8 = "Хм..."
101120-9 = "Угх..."
101120-10 = "*пых-пых* Не получается. Если бы физически находиться поближе, я бы смогла что-то сделать..."
101120-11 = "Но сейчас..."
101120-12 = "О! Подключилась!"
101120-13 = "Секундочку! Хоть что-нибудь...!"
101120-14 = ""
101120-16 = ""
101120-17 = "... *вздох* Меня снова выбросило."
101120-18 = "Кажется, я едва-едва смогла связаться с кем-то поблизости, но..."
101120-19 = "Я вас подвела... Простите, Сенсей."
101120-20 = "[s1] «Всё хорошо. Ты отлично справилась.»\n[s2] «Спасибо. Ты очень помогла, Арона.»"
101120-23 = "А? П-правда...?"
101120-27 = ""
101120-29 = ""
101120-31 = "А-а-а-а! О-они здесь...!"
101120-32 = "И-Их так много..."
101120-33 = "Похоже, дальше дороги нет..."
101120-34 = ""
101120-36 = ""
101120-37 = ""
101120-38 = "Сдавайтесь сейчас, иначе от вас не останется ничего, что смогут найти!"
101120-39 = ""
101120-42 = "А? Что это за дрон...?"
101120-43 = "Дрон запущен. Отряд, берегитесь взрывов."
101120-45 = "А-Аргх...! Ч-Что это...?"
101120-46 = "Хия-а!!!"
101120-47 = ""
101120-54 = ""
101120-56 = "Дымовая граната может немного щипать глаза! RABBIT 2 на месте!"
101120-57 = "RABBIT 1, обеспечиваю безопасность Сенсея и остальных. RABBIT 3, обнаружить все вражеские цели."
101120-59 = "В-Вы кто такие?!"
101120-60 = "RABBIT 3 на связи! Уже готово, отправляю координаты! RABBIT 4, запусти вражеского командира в космос!"
101120-61 = "Всем войскам, сей—"
101120-62 = ""
101120-64 = ""
101120-66 = "Цель уничтожена... В-Все в порядке?"
101120-67 = "[s] «Отряд RABBIT! Вы здесь!»"
101120-68 = "Хмпф. Не то чтобы мы пришли, потому что вы просили о помощи."
101120-69 = "Именно. Мы просто случайно увидели ваше сообщение и решили немного прогуляться."
101120-70 = "Н-Но вы все паниковали и т-торопились..."
101120-71 = ""
101120-73 = ""
101120-74 = "Не слушайте их. Отряд RABBIT отвечает на запрос Сенсея о поддержке."
101120-75 = "Хи-хи. Сенсей умеет вот так запросто вызвать подкрепление. Впечатляет."
101120-76 = "Раз SRT здесь, бояться нечего!"
101120-77 = ""
101120-81 = "Глупцы! Не думайте, что сможете отсюда уйти!"
101120-82 = "Вся кавалерия в сборе... даже поддержка с воздуха... Сенсей, что вообще происходит?"
101120-83 = "Спорю, как обычно, втянулись в какую-нибудь нелепую ситуацию."
101120-84 = "Хи-хи. Очень похоже на Сенсея. Что вы на этот раз натворили? Выглядит суперопасно. Хи-хи-хи."
101120-85 = "Согласна, учитывая, что здесь замешан Сенсей [USERNAME]..."
101120-86 = "К-кажется, они говорят, что для Сенсея это о-обычное дело..."
101120-87 = "[s] «Больно такое слышать...»"
101120-88 = "Директор Канна."
101120-89 = "Отряд RABBIT..."
101120-90 = "Мы у вас в долгу за прошлый раз. Рада снова вас видеть."
101120-91 = "Я думала, административные войска сейчас не могут действовать из-за военного положения..."
101120-92 = "Ну... Как вы знаете... Мы живём в парке..."
101120-93 = "У н-нас нет о-официального командира..."
101120-94 = "Военное положение? Так вот почему я не могла зайти на обычные сайты."
101120-95 = "А-откуда нам было знать?! Нам вообще никто ничего не сообщает!"
101120-96 = "П-потому что Сенсей — единственный, кто с нами разговаривает... *шмыг*"
101120-97 = "Пока сосредоточимся на текущей миссии. Отряд RABBIT, прорываемся через силы PMC и сопровождаем Сенсея и директора Канну в безопасное место. Понятно?"
101120-98 = "Поняла, командир отряда!"
101120-99 = "Я-я готова!"
101120-100 = "*пых-пых* Подготовка огневой поддержки с воздуха полностью готова. Сейчас будет БА-БАХ!"
101120-101 = "Прошу прощения, но я хотела бы запросить сотрудничество Бюро общественной безопасности Валькирии в этой операции."
101120-102 = "Да! Готова выполнять приказ!"
101120-103 = "Пожалуй, мы и правда вам задолжали с прошлого раза."
101120-104 = "Тогда начинаем операцию!"
