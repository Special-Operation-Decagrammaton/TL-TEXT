[translation]
2000115-1 = "Symbol of a Maid"
2000115-6 = "(After a while, Karin arrived.)"
2000115-11 = "Let us inspect the equipment first."
2000115-15 = "(Karin took out various cleaning tools.)"
2000115-16 = "(Mops, dustcloths, sponges, brushes, cleaners, detergents, and so on...)"
2000115-17 = "[ns1] \"This is pretty hardcore.\"\n[ns2] \"I thought we were just going to mop and take out the trash...\""
2000115-20 = "If we are going to do it, we do it thoroughly."
2000115-21 = "In the name of C&C, we will eliminate every last danger lurking in this room."
2000115-22 = "[s] \"I do not think there are any dangers that serious...\""
2000115-23 = "Sensei, you do not understand the dangers of dust."
2000115-24 = "Each speck is too small to see, but #nif they gather, they cause air pollution and threaten our health."
2000115-25 = "If left alone, they can cause computer malfunctions or scratches."
2000115-26 = "Cleaning the inside of a PC regularly is also to prevent that."
2000115-27 = "PM2.5 is especially bad. It has a negative impact on the lungs."
2000115-28 = "That is why wearing a mask is recommended on days when there is a lot of it, right?"
2000115-29 = "[s] \"Dust... small but formidable enemies.\" "
2000115-30 = "Exactly."
2000115-34 = "Now, let us begin cleaning."
2000115-35 = "...Ah, right. Do you have an apron?"
2000115-36 = "[s] \"I do not think I have one here...\""
2000115-37 = "Then you can use mine. I brought two spares."
2000115-42 = "With this little one, your clothes should be safe from dust."
2000115-46 = "No, wait... is it too cute for an adult to wear?"
2000115-47 = "But this is all we have right now..."
2000115-48 = "Ummm..."
2000115-49 = "Sensei, what should we do? #n...Will you use it?"
2000115-50 = "[s] \"I will use it!\""
2000115-51 = "Understood. #nIt is hard to tie the back, so I will help you."
2000115-63 = "It suits you."
2000115-64 = "[s3] \"Is it cute?\"\n[s4] \"Is it cool?\""
2000115-67 = "D-Do not ask things like that!"
2000115-68 = "Come on, let us start cleaning already."
2000115-69 = "[s] \"Okay!\""
2000115-72 = "(Opened the window and started cleaning)"
2000115-76 = "(Searched thoroughly for dust and cleaned every nook and cranny)"
2000115-79 = "(Several hours later...)"
2000115-83 = "[ns] \"All done!\""
2000115-85 = "Phew, good work."
2000115-86 = "It feels great when things are clean."
2000115-87 = "[ns5] \"The office is sparkling clean!\"\n[ns6] \"Maids really are amazing!\""
2000115-90 = "Y-You are exaggerating. I just did what needed to be done."
2000115-91 = "Cleaning is done, so I will take my apron back."
2000115-95 = "...Is something wrong? #nIt looks like you do not want to return it..."
2000115-96 = "[s] \"I got it dirty, so I will wash it and return it.\""
2000115-97 = "Even if it got dirty, it is just a little dust, right?"
2000115-98 = "Could it be... Sensei, do you cherish aprons too?"
2000115-99 = "...You are similar to me."
2000115-100 = "May I ask why?"
2000115-101 = "[s7] \"Because it is cute.\"\n[s8] \"Because it is Karin's.\""
2000115-104 = "I-I see..."
2000115-105 = "[s] \"What about you, Karin?\""
2000115-109 = "Cuteness is part of it, but... the main reason is elsewhere."
2000115-110 = "An apron sacrifices itself for the sake of other clothes."
2000115-111 = "Standing at the very front, taking the dirtiest role first."
2000115-112 = "An existence that takes the initiative in doing the jobs nobody else wants to do..."
2000115-113 = "That is why I think it resembles a maid's spirit."
2000115-114 = "Because maids also find fulfillment in service."
2000115-115 = "In other words, the apron is also a symbol of a maid."
2000115-121 = "That is why we must cherish it."
2000115-122 = "To reward this little one, who is so similar to us, as much as possible."
2000115-123 = "[s9] \"Karin, you are so kind.\"\n[s10] \"You hold it very dear, do you not?\""
2000115-126 = "...Yeah. #nI always want to be with it, so I have even worn it over other clothes before."
2000115-127 = "Gym uniforms, swimsuits, even kimonos."
2000115-128 = "No matter the outfit, wearing an apron makes me feel like a maid."
2000115-129 = "It is perfect for recalling the maid spirit and steeling my resolve."
2000115-130 = "[s11] \"You wear an apron over other outfits too!?\"\n[s12] \"I have never seen that before!\""
2000115-135 = "I-I just tried wearing it a bit when I was alone. #n...It is embarrassing in front of people."
2000115-136 = "Especially an apron over a swimsuit is --"
2000115-137 = "..."
2000115-141 = "A-Anyway, it is embarrassing!"
2000115-142 = "[s] \"Is that so... I understand.\""
2000115-143 = "Ah, yeah... thank you."
2000115-147 = "...Alright, enough of this talk."
2000115-148 = "Cleaning is not over until the cleanup is done. #nLet us finish everything."
2000115-150 = "(While cleaning up, we talked about the maid spirit.)"
2000115-151 = "(I learned that both service and the apron are symbols of a maid.)"
