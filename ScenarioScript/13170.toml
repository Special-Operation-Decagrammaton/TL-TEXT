[translation]
13170-1 = "Эпизод 17;Погоня"
13170-5 = "...Пусть победа останется за вами. Признаю, ход битвы изменился."
13170-6 = "Похоже, следующий ход ваш, Сенсей [USERNAME]."
13170-7 = "Атака и защита, туда и обратно. Таково правило честной игры."
13170-8 = "Разумеется, честность не входит в мои цели. Хи-хи-хи..."
13170-9 = "Это не эксперимент, не ритуал и даже не исследование. Вся эта кампания — часть моего великого замысла! Равенства не существует, и нет нужды связывать себя такой мелочью, как правила."
13170-10 = "Теперь начинается моя третья стратегия. «Сердце невозможно предсказать или контролировать»."
13170-11 = "В человеческом сердце... желания, грехи, страхи и одержимости сталкиваются, гасят друг друга, вспыхивают и растворяются одно в другом... создавая непостижимый первобытный хаос..."
13170-12 = "Именно... именно это предстанет перед вами."
13170-13 = ""
13170-15 = ""
13170-16 = "Ну что же, утолите моё любопытство... как вы встретите сам хаос?"
13170-19 = "[log]Все юридические трактовки, появляющиеся в этом произведении,#nполностью вымышлены и не имеют отношения к реальному законодательству.[/log]"
13170-24 = "[ns] «Я нашёл Нономи.»"
13170-25 = "Где она?!"
13170-26 = "[ns] «Её держат в здании районного офиса Центральной станции Абидоса.»"
13170-27 = "Это..."
13170-28 = "Да. Именно там проходит общее собрание кредиторов."
13170-29 = "Нам повезло. Я боялась, что придётся разделиться на две группы."
13170-30 = "Спасибо, Сенсей. С вашими сведениями всё становится проще."
13170-31 = "Мы можем одновременно остановить Хошино, заверить договор и спасти Нономи."
13170-33 = "Сила взрослого всегда поражает."
13170-34 = "Угу. Напоминает тот случай, когда Сэрику похитила Банда в шлемах, а Сенсей нам помог."
13170-35 = "Э-Это древняя история! Зачем сейчас такое вспоминать?"
13170-36 = "...Мы все тогда очень переживали."
13170-37 = "П-Правда...? Н-Не смущайте меня!"
13170-39 = "Ха-ха-ха... Мы все были в шоке, когда поняли, что ты пропала, Сэрика..."
13170-40 = "Угу. Особенно Хошино."
13170-41 = "Сначала она просто тревожно ходила кругами по комнате. А потом сама побежала за помощью к Сенсею."
13170-42 = "Хошино? Правда?"
13170-43 = "[ns1] «Хошино склонила голову и попросила помочь спасти тебя.»\n[ns2] «Но я никому об этом не рассказывал.»"
13170-44 = ""
13170-45 = ""
13170-48 = "А что с её телефоном?"
13170-49 = "Он уже несколько часов выключен..."
13170-50 = "Начальник сказал, что она закончила смену и ушла как обычно. Она так и не добралась домой?"
13170-51 = "Ничего подобного раньше не случалось. Она всегда благополучно возвращалась домой..."
13170-52 = "Не думаете же вы... что это Банда шлемов?"
13170-53 = "Что? Банда шлемов?!"
13170-54 = "Возможно, но не будем делать поспешных выводов. Хошино и Сенсей всё ещё расследуют."
13170-55 = "..."
13170-57 = "(открывает дверь)"
13170-58 = "Простите, что заставили ждать."
13170-59 = "Хошино! Сенсей!"
13170-60 = "[s] «Мы вернулись»."
13170-61 = "Вы выяснили, что произошло?"
13170-62 = "Сенсею удалось войти в центральную сеть связи Генерального ученического совета."
13170-63 = "Вы смогли попасть в их сеть? Ого. Сенсей — это серьёзно..."
13170-64 = "Только это секрет. Если нас поймают, будут большие проблемы."
13170-67 = "А... Так вот как всё было..."
13170-68 = "Да. А потом она сделала вид, будто ничего особенного не произошло."
13170-69 = "Ха-ха-ха... Я помню. Такое чувство, будто прошло ужасно много времени."
13170-70 = "Да. Хотя на самом деле не так уж много."
13170-71 = "Ну, спасибо, что тогда спасли меня, Сенсей."
13170-72 = ""
13170-73 = "[ns] «Это моя работа.»"
13170-74 = ""
13170-76 = ""
13170-78 = "Текущее время: 8:5X утра."
13170-80 = "Сейчас я введу всех в курс дела!"
13170-81 = ""
13170-83 = ""
13170-84 = "Наша задача — добраться до верхнего этажа районного офиса Центральной станции Абидоса и попасть на общее собрание кредиторов! Крайний срок — полдень."
13170-85 = "Там мы спасём Нономи, которую держат в плену."
13170-86 = "И наконец остановим Хошино от отрицания законности студсовета Абидоса и заявим о намерении Комитета по выплате долга продолжить исполнение договора!"
13170-87 = "Хорошо, поняла, председатель студсовета Аяне."
13170-88 = "..."
13170-89 = "Почему ты смущаешься, Аяне? Привыкай."
13170-90 = "Ну... всё это лишь чтобы подтвердить наши полномочия... ради договора..."
13170-91 = "[s3] «Заставь их всех преклониться перед твоими приказами.»\n[s4] «Заявляй смело, председатель студсовета Аяне!»"
13170-94 = "...Для этой операции нужен человек, который сможет заверить и договор, и нашу законность, поэтому я пойду вместе со всеми."
13170-96 = "Уклонилась."
13170-97 = "Увернулась."
13170-99 = "Кхм! Дальше — оперативный инструктаж!"
13170-100 = "Сейчас силы фонда прямых инвестиций блокируют все четыре пути к Центральной станции Абидоса: восточный, западный, южный и северный!"
13170-101 = ""
13170-102 = "Районный офис Центральной станции — восточная сторона"
13170-103 = "Восточный маршрут перекрыла Банда Пушистых Шлемов, нанятая лидером Союза долговых работников."
13170-104 = "Их бойцы, похоже, самые слабые, но зато их больше всего! А у нас жёсткий лимит времени — нужно попасть к цели до полудня."
13170-105 = "Поэтому именно этот маршрут, вероятно, будет сложнее всего прорвать!"
13170-107 = "Подъездная дорога к районному офису Центральной станции — запад"
13170-110 = ""
13170-111 = "Запад охраняют Рыночные стражи, нанятые лидером Гильдии аукционов по взысканию!"
13170-112 = "Их немного, но это Рыночные стражи! У них первоклассное тяжёлое вооружение, лучшие боевые вертолёты и танки. Их учили убивать, и они умеют действовать как организованное подразделение."
13170-113 = "Местность здесь не даёт ни преимуществ, ни недостатков, но у противника самая высокая огневая мощь, поэтому этот путь стоит избегать, если у нас не будет серьёзного стратегического преимущества!"
13170-114 = ""
13170-115 = "Открытая площадка к югу от районного офиса Центральной станции"
13170-117 = "Лидер Союза ломбардов нанял жестокую банду Курокамэ охранять южный маршрут!"
13170-118 = "Их мало, командование у них ужасное, но зато у них куча турелей. Хуже того — вся местность открытая. Без подготовки приближаться не стоит."
13170-120 = "Подъездная дорога к районному офису Центральной станции — север"
13170-122 = ""
13170-123 = "И наконец северный маршрут укреплён баррикадами наёмников, которых наняла ZYAKO Industries."
13170-124 = "Иными словами, этот маршрут гораздо сильнее сосредоточен на обороне, чем на атаке. В их огневой мощи или боеспособности нет ничего особенного, но без тяжёлой техники прорваться, скорее всего, невозможно!"
13170-127 = "Хм... Так какой путь?"
13170-128 = "Может, просто пойдём туда же, куда пошла Хошино?"
13170-129 = "Давайте попробуем оценить варианты с точки зрения Хошино..."
13170-130 = "Мы не слишком всё усложняем? У нас же здесь эксперт по Хошино!"
13170-132 = "Хм..."
13170-133 = "Да, эксперт по Хошино Широко, что думаешь?"
13170-134 = "Ну... Сильная сторона Хошино — чистая боевая мощь, особенно ближний бой."
13170-135 = "Сейчас по ней не скажешь, но Хошино была известна агрессивным стилем, совершенно не заботясь о собственной безопасности."
13170-136 = "Наверное, Хошино очень долго сражалась в одиночку."
13170-137 = "Ну..."
13170-142 = "Подъездная дорога к районному офису Центральной станции — запад"
