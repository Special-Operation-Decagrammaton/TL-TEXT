[translation]
13170-1 = "Episódio 17;Perseguição"
13170-5 = "...Muito bem."
13170-6 = "A seguir, Sensei [USERNAME]... é o seu turno."
13170-7 = "Em um jogo, ataque e defesa sempre se alternam."
13170-8 = "Claro, não pretendo ficar apenas na defensiva.#nHe, hehehe..."
13170-9 = "Afinal, esta campanha é unicamente a minha busca pessoal.#nNão é um experimento, nem pesquisa, nem um ritual.#nLogo, não há necessidade alguma de me prender às regras."
13170-10 = "Terceira dica de estratégia — \"O coração não pode ser previsto nem controlado\"."
13170-11 = "Desejo, culpa, medo, obsessão, pesar..."
13170-12 = "...O caos nascido do choque entre tudo isso#nlogo cairá sobre você."
13170-16 = "Pois bem, mal posso esperar para ver como você, agora como jogador, vai superar isso."
13170-19 = "As interpretações jurídicas apresentadas nesta obra são puramente fictícias#ne não possuem qualquer relação com a realidade."
13170-24 = "[ns] \"Descobri a localização da Nonomi.\""
13170-25 = "Onde ela está?!"
13170-26 = "[ns] \"No antigo prédio da Estação Central de Abydos.\""
13170-27 = "Lá é..."
13170-28 = "O local onde vai acontecer a assembleia geral dos credores."
13170-29 = "Eu estava prevendo que teríamos que nos dividir em dois grupos...#nQue alívio."
13170-30 = "Obrigada, Sensei."
13170-31 = "Assim, capturar a Hoshino-senpai, manter o contrato e resgatar a Nonomi...#nPodemos resolver tudo de uma vez."
13170-33 = "O Sensei é mesmo incrível, hein."
13170-34 = "Sim. Quando a Serika foi levada pela Gangue dos Capacetes,#no Sensei também nos ajudou assim."
13170-35 = "D-De quanto tempo atrás você tá falando?!#nJá disse pra esquecer isso!"
13170-36 = "...É que eu fiquei preocupada."
13170-37 = "Falando desse jeito, até fico um pouco envergonhada..."
13170-39 = "Ahaha...#nMas foi um susto enorme mesmo, sabia?"
13170-40 = "Nn. No fundo, a Hoshino-senpai era quem estava mais desesperada."
13170-41 = "A ponto de dizer que ia pedir ajuda ao Sensei e sair sozinha."
13170-42 = "Isso é verdade...?"
13170-43 = "[ns1] \"É porque você é muito importante para ela, Serika.\"\n[ns2] \"Mesmo que ela não costume dizer isso em voz alta.\""
13170-48 = "Vocês tentaram ligar para ela?"
13170-49 = "...Sim. Mas parece que o celular está desligado há várias horas..."
13170-50 = "Parece que ela saiu do trabalho no horário normal. Quer dizer que não voltou para casa depois disso."
13170-51 = "Ela nunca tinha ficado fora até tão tarde assim antes, né...?"
13170-52 = "Será que foi... o pessoal da Gangue dos Capacetes?"
13170-53 = "Hã?! A Gangue dos Capacetes pegou a Serika-chan...?!"
13170-54 = "Vamos esperar por enquanto. A Hoshino-senpai e o Sensei estão investigando."
13170-55 = "..."
13170-57 = "(Clac)"
13170-58 = "Desculpa a demora, pessoal~."
13170-59 = "Hoshino-senpai! Sensei!"
13170-60 = "[s] \"Voltei.\""
13170-61 = "Como foi, senpai?"
13170-62 = "Usando as permissões do Sensei, conseguimos acessar a Rede Central administrada pelo Conselho Estudantil Geral."
13170-63 = "A Rede Central...#nSensei, você tem até esse nível de autorização..."
13170-64 = "Uhe~ Escondido, claro. Se descobrirem, vai sobrar um belo relatório de advertência~"
13170-67 = "Então foi isso..."
13170-68 = "A senpai só não quis se dar ao trabalho de contar."
13170-69 = "...De alguma forma, parece que faz tanto tempo."
13170-70 = "Nn."
13170-71 = "...Obrigada, pessoal."
13170-73 = "[ns] \"É só o meu dever como Sensei.\""
13170-78 = "AM 08:5X"
13170-80 = "Então, vamos começar a reunião!"
13170-84 = "Nós precisamos comparecer à \"Assembleia Geral dos Credores\"#nque será realizada no antigo prédio da Estação Central de Abydos.#nO prazo limite é hoje ao meio-dia."
13170-85 = "Nosso objetivo é resgatar a Nonomi-senpai, que está mantida refém."
13170-86 = "E, antes que a Hoshino-senpai negue a existência do Conselho Estudantil de Abydos,#nreivindicaremos a legitimidade do Comitê de Contramedidas."
13170-87 = "Entendido, Presidente do Conselho Estudantil."
13170-88 = "..."
13170-89 = "Que foi, Ayane-chan?#nVocê é a presidente do conselho estudantil agora, tem que se acostumar logo."
13170-90 = "E-Eu só me tornei presidente do conselho estudantil por causa do contrato..."
13170-91 = "[s3] \"Mostre a eles o poder da Presidente Ayane!\"\n[s4] \"Conto com você, Presidente Ayane.\""
13170-94 = "...Como precisarei me pronunciar na assembleia, desta vez eu também irei a campo."
13170-96 = "Ah, ela mudou de assunto."
13170-97 = "Fugiu do assunto."
13170-99 = "Vamos passar para a próxima etapa da reunião de estratégia!"
13170-100 = "No momento, todas as rotas que levam à Estação Central de Abydos#nestão bloqueadas pelas forças do fundo privado."
13170-102 = "Antigo Prédio da Estação Central — Setor Leste"
13170-103 = "O Setor Leste está sendo guardado pela Gangue dos Capacetes Fofinhos."
13170-104 = "Deixando de lado a força individual, o número deles é esmagador."
13170-105 = "Como nosso tempo é limitado, vamos evitar esta rota."
13170-107 = "Antigo Prédio da Estação Central — Setor Oeste"
13170-111 = "No Setor Oeste, há uma alta concentração de Guardas do Mercado."
13170-112 = "Há uma grande chance de estarem usando helicópteros de combate, tanques e armamento pesado poderoso."
13170-113 = "A menos que tenhamos vantagem tática, também prefiro evitar este caminho."
13170-115 = "Antigo Prédio da Estação Central — Setor Sul"
13170-117 = "O Setor Sul está com o Clã da Tartaruga Negra."
13170-118 = "Como eles possuem uma grande quantidade de torres autônomas, não será fácil se aproximar..."
13170-120 = "Antigo Prédio da Estação Central — Setor Norte"
13170-123 = "O Setor Norte parece ser guardado por mercenários contratados,#nmas há barricadas especiais instaladas lá."
13170-124 = "O poder de combate deles não é tão alto,#nmas seria difícil romper essas barricadas com equipamento comum."
13170-127 = "...Qual rota devemos escolher?"
13170-128 = "Não seria melhor irmos pelo mesmo caminho que a Hoshino-senpai?"
13170-129 = "Nesse caso, precisamos pensar como ela pensaria..."
13170-130 = "A Shiroko-senpai deve saber!"
13170-132 = "Hmm..."
13170-133 = "É verdade...#nNa sua opinião, Shiroko-senpai, qual rota você acha que ela escolheria?"
13170-134 = "...O ponto forte da Hoshino-senpai é o combate corpo a corpo."
13170-135 = "Ouvi dizer que, antigamente, ela tinha um estilo de luta ainda mais imprudente."
13170-136 = "Ela provavelmente está acostumada a enfrentar inimigos com muito armamento pesado."
13170-137 = "Por isso..."
13170-142 = "Antigo Prédio da Estação Central — Setor Oeste"
13170-146 = "Quem está aí?!"
13170-154 = "A-Aquela é...!"
13170-155 = "Ela chegou! É a Takanashi Hoshino!"
13170-164 = "P-Para onde ela foi?!"
13170-188 = "...Acho que pelo Setor Oeste."
13170-189 = "Então vamos lá!"
13170-196 = "Concentrem todas as forças na Takanashi Hoshino!"
13170-197 = "Não a deixem passar de jeito nenhum até a assembleia começar!"
13170-199 = "S-Sim, senhor!"
13170-204 = "...Outro helicóptero?"
13170-207 = "Posição do alvo confirmada!"
13170-208 = "Às 6 horas!!"
13170-213 = "Alvo confirmado, mira travada."
13170-219 = "Míssil ar-superfície AGM-114, disparar!"
13170-226 = "Impacto direto no alvo!"
13170-231 = "O quê...?!"
13170-239 = "Ela está vindo na nossa direção...!"
13170-240 = "Do que você tá falando?!#nNós estamos no ar—"
13170-248 = "O-Onde ela se meteu?!"
13170-249 = "E-Embaixo!#nEla está pendurada no trem de pouso do helicóptero!"
13170-255 = "A-Aaaah?!"
13170-264 = "O que diabos está acontecendo..."
13170-269 = "Tsc..."
13170-274 = "Parece que vocês falharam."
13170-276 = "Cale a boca, Nephthys!"
13170-288 = "Que palhaçada é essa?"
13170-289 = "Já sabemos muito bem o que vocês estão tramando."
13170-290 = "Tramando, é...?"
13170-291 = "Vocês estão tentando trair o nosso fundo privado, não estão?"
13170-304 = "K-Kaiser PMC?!"
13170-310 = "Tenha cuidado com as palavras."
13170-311 = "O Canhão Ferroviário sempre nos pertenceu desde o início."
13170-317 = "A-Atirem!"
13170-331 = "Q-Que som é esse...?"
13170-333 = "..."
13170-338 = "Antigo Prédio da Estação Central — Setor Oeste"
13170-348 = "P-Peguem ela!"
13170-357 = "AM 09:4X"
13170-360 = "O que está acontecendo aqui?!"
13170-361 = "Onde está a Hoshino-senpai...?"
13170-366 = "...Encontrei! Está a 600 metros à frente!"
13170-367 = "700m, 750m... Ela está se afastando cada vez mais!"
13170-369 = "N-Não tá rápida demais...?!"
13170-370 = "Vamos atrás dela."
