10047095-11 = "Вот они! Мы их окружили!"
10047095-12 = "Бежать некуда! Сдавайтесь мирно, руки вверх!"
10047095-14 = "Угх, осталось только общежитие Совета. И попасться именно сейчас..."
10047095-15 = "Их бдительность... оказалась выше, чем мы ожидали..."
10047095-16 = "...Хех, не расстраивайтесь. Даже это может стать хорошим опытом."
10047095-17 = "Путь художника не обязан быть лёгким."
10047095-18 = "Пусть без боли не обойдётся, я верю, что мы найдём свои ответы. В искусстве..."
10047095-19 = ""
10047095-21 = ""
10047095-22 = ""
10047095-23 = "...вызов..."
10047095-24 = "...это единственное, что важно!"
10047095-26 = "Хватит болтать! ВАЖНО то, что вас поймали с поличным. Арестовать их!"
10047095-27 = ""
10047095-29 = ""
10047095-30 = ""
10047095-32 = ""
10047095-35 = ""
10047095-37 = "Ч-что это? Откуда звонят эти колокола?"
10047095-38 = "Вон там. Э-это же—"
10047095-39 = "...Безымянная колокольня."
10047095-40 = "Она звонит... легендарный колокол..."
10047095-41 = "...который сам начинает звонить в День погибели!"
