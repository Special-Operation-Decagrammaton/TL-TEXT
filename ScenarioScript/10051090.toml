[translation]
10051090-1 = "Эпизод 9;Намеренная случайность"
10051090-2 = "Офис Шале"
10051090-3 = "Мой господин, мой господин!"
10051090-4 = "Это... Это..."
10051090-5 = "Президент ведёт себя странно...!"
10051090-6 = "[s1] «Успокойся, Изуна.»\n[s2] «В чём именно Мичиру ведёт себя странно?»"
10051090-9 = "Она была в порядке... Вы же были с нами, когда мы ели рамен."
10051090-10 = "...Но после этого что-то изменилось!"
10051090-11 = "[s] «Изменилось?»"
10051090-12 = "Будто огонь в её глазах погас. Она потеряла мотивацию, стала робкой..."
10051090-13 = "Вчера даже случилось ВОТ ТАКОЕ!"
10051090-15 = "Переулок торгового района Хяккияко"
10051090-17 = "Фух, спасибо за еду!"
10051090-18 = "И снова «Блюдо ниндзя» не подвело!"
10051090-19 = "Верно, Президент?"
10051090-20 = "..."
10051090-21 = "Президент?"
10051090-22 = "Хм? А, да. Вкусно. Было вкусно."
10051090-23 = "Что-то случилось?"
10051090-24 = "Хм? Нет-нет. Всё нормально. Я в порядке. Нин... нин, знаете."
10051090-25 = ""
10051090-27 = ""
10051090-28 = "(Ты совсем не выглядишь нормально...)"
10051090-29 = "Тогда, Президент, обсудим выпуск «Мичиручи: свиток девушки-ниндзя» на следующую неделю?"
10051090-30 = "Рядом с магазином тканей открылась новая чайная. Можно выпить чашечку и всё обсудить."
10051090-31 = "Хм? Нет, я не собираюсь снимать видео на следующую неделю—"
10051090-32 = "То есть вы хотите обсудить это с Изуной?! Да, Президент, мы придумаем тему!"
10051090-33 = "Нет, дело в том, что я..."
10051090-34 = "А в той чайной ещё появилось новое меню данго! Столько цветов! Давайте заглянем, Президент!"
10051090-35 = "Чайная прямо..."
10051090-36 = ""
10051090-38 = ""
10051090-39 = ""
10051090-40 = "Стой, Изуна, я..."
10051090-41 = ""
10051090-45 = "*бум*"
10051090-46 = ""
10051090-47 = "Э-Э...?!"
10051090-48 = "Кто-то взорвал дымовую бомбу перед магазином тканей!"
10051090-49 = ""
10051090-51 = ""
10051090-53 = "Во! Вот это хорошая дымовая бомба, чувствуешь?"
10051090-54 = "Ага! И по делу! Такое... негостеприимное место надо скрыть от глаз публики!"
10051090-55 = "Как они смеют игнорировать разумную просьбу? Клиент всегда прав, знаете ли."
10051090-56 = "Такому заведению вообще закрыться надо, ясно?"
10051090-57 = ""
10051090-59 = ""
10051090-60 = "Зачем вы сделали это с моим магазином?"
10051090-61 = "А ты как думаешь?! Из-за твоего недружелюбного отношения. Ты проигнорировала просьбу платящего клиента."
10051090-62 = "Я проигнорировала вашу просьбу...?"
10051090-63 = "Это магазин ТКАНЕЙ, девочки. Как я должна подать вам кофе и такояки?"
10051090-64 = "Почему ты пререкаешься с клиентом? У нас тут враждебная владелица бизнеса!"
10051090-65 = "С таким упрямством ты в этой отрасли не выживешь."
10051090-66 = "Да о чём вы вообще?! Вы двое — самая большая угроза тому, что я выживу в этой отрасли!"
10051090-67 = "Тц... В этом есть смысл."
10051090-68 = "Не сдавай назад! Просто вспомни про наш заказ!"
10051090-69 = "Стоп, что ты сейчас сказала? «Заказ»? Кто вообще заплатил бы вам за такое?"
10051090-70 = "А, я ничего не говорила!"
10051090-71 = ""
10051090-73 = ""
10051090-75 = "Президент, эти члены Моурё устраивают хаос перед магазином тканей!"
10051090-76 = "Нам нужно пойти и... А? Президент?"
10051090-77 = ""
10051090-78 = ""
10051090-79 = "Хм? Что такое, Изуна?"
10051090-80 = "Президент! Изуна считает, что пора героически вмешаться!"
10051090-81 = "Хм? Т-Ты права, но..."
10051090-82 = "Разве это не больше... дело Хяккарёран...? У них это так хорошо получается."
10051090-83 = "К тому же с нами нет Цукуё, понимаешь..."
10051090-84 = "Но дух ниндзя! Чтобы быть ниндзя, нам не нужна Цукуё!"
10051090-85 = "Уф, справедливо, но..."
10051090-86 = ""
10051090-88 = ""
10051090-89 = ""
10051090-90 = "П-Президент!"
10051090-91 = ""
10051090-93 = ""
10051090-95 = "Офис Шале"
10051090-96 = "...и вот что произошло."
10051090-97 = "Она подавлена и робка..."
10051090-98 = "Изуна не знает такую сторону президента..."
10051090-99 = "[s] «Да, это совсем не похоже на Мичиру...»"
10051090-100 = "Вы тоже так думаете, мой господин?"
10051090-101 = "Что могло вызвать такую перемену...?"
10051090-102 = "[s] «А ты как думаешь, Изуна?»"
10051090-103 = "..."
10051090-104 = "...Изуна, возможно, знает причину."
10051090-105 = "То, что Цукуё не возвращается в Клуб исследования ниндзюцу... скорее всего, и есть причина."
10051090-106 = "Из-за этого президент пала духом и помрачнела. Поэтому Изуна старалась вести себя ещё бодрее."
10051090-107 = "Потому что... если мы обе будем унывать, ничего не получится!"
10051090-108 = "Но, мой господин, Изуна больше не знает, что делать...!"
10051090-109 = "До Цукуё всё ещё не дозвониться... хотя, похоже, с ней всё хорошо. Она появляется в видео о подготовке к новогоднему модному показу..."
10051090-110 = "[s] «Тогда как насчёт того, чтобы вместе поискать Цукуё?»"
10051090-111 = "Это было бы здорово... но президент, скорее всего, не пойдёт."
10051090-112 = "Кажется, она намеренно избегает Цукуё..."
10051090-113 = "Но всё равно нам нужно заставить их поговорить друг с другом, мой господин."
10051090-114 = "Только тогда мы сможем найти решение."
10051090-115 = "[s3] «То есть нам нужно устроить встречу Мичиру и Цукуё?»\n[s4] «В таком случае у меня есть план.»"
10051090-118 = ""
10051090-120 = ""
10051090-121 = "Какой, мой господин?!"
10051090-122 = "[s] «Я всё выясню и позвоню тебе позже.»"
10051090-123 = "Да! Мой господин! Изуна будет ждать!"
10051090-124 = ""
10051090-126 = ""
10051090-128 = "...Это несложная просьба, Сенсей."
10051090-129 = "Я попробую с ними поговорить."
10051090-130 = "[s] «Прости, что так внезапно прошу тебя об этом.»"
10051090-131 = "Ня-ха-ха, не говорите так."
10051090-132 = "С точки зрения Клуба Инь-Ян это почти как получить одноразовый безлимитный «Пропуск Сенсей нам должен», так что сделка на самом деле очень выгодная."
10051090-133 = "[s] «Кто вообще выпускает такие пропуска...?!»"
10051090-134 = ""
10051090-135 = "Ня-ха-ха, уже предвкушиваете? Надеюсь!"
10051090-136 = ""
10051090-138 = ""
10051090-139 = "Моурё и здесь начали создавать проблемы."
10051090-140 = "Похоже, теперь, когда год почти закончился, они чу-у-уть сильнее переходят черту. Наверное, у них есть «квота на неприятности», которую нужно выполнить. Впрочем, по одной проблеме за раз..."
10051090-141 = "Посмотрим, кто поможет мне выполнить просьбу Сенсея? Хм."
10051090-142 = "Да. Я бы так сказала."
10051090-143 = "«Комитет новогоднего модного показа Хяккияко»... Сначала поговорю с ними."
10051090-145 = "Прошло несколько дней. Наконец наступили праздники в конце года."
10051090-147 = "Так... Здесь проходит какое-то... «мероприятие, связанное с ниндзя»?"
10051090-148 = "Да, президент!"
10051090-149 = "И ради этого нам нужно нарядиться, а мне — сделать причёску?"
10051090-150 = "Новый год уже совсем близко, Президент! Все берегли лучшие наряды именно для этого момента. Мы не можем отставать!"
10051090-151 = "Ты права, но..."
10051090-152 = "Стой, разве это не чёрный вход? На мероприятие ведь обычно заходят через главный, да?"
10051090-153 = ""
10051090-155 = ""
10051090-157 = ""
10051090-158 = "А, вы пришли."
10051090-159 = "Чидори Мичиру и Куда Изуна. Всё верно?"
10051090-160 = "Да! Верно!"
10051090-161 = "О-о, Изуна, ты сделала бронь? Типа по телефону?"
10051090-162 = "[s] «Привет, Мичиру и Изуна.»"
10051090-163 = "А?! Достопочтенный Сенсей тоже здесь?!"
10051090-164 = "Если достопочтенный Сенсей здесь... значит, это огромное мероприятие!"
10051090-165 = "Итак, все. Пожалуйста, возьмите эти внутриушные рации."
10051090-166 = "А? Рации?"
10051090-167 = "О, это типа... самостоятельная экскурсия?"
10051090-168 = "Работа простая. Ходите среди толпы. Если заметите кого-то подозрительного, сообщите нам или задержите сами."
10051090-169 = "Хорошо, задерживать подозрительных... Стоп."
10051090-170 = "Работа? Задерживать?"
10051090-171 = "Изуна, это ведь...?"
10051090-172 = ""
10051090-174 = ""
10051090-175 = "Добро пожаловать в команду охраны новогоднего модного показа Хяккияко."
10051090-176 = ""
10051090-178 = ""
10051090-179 = ""
10051090-180 = "Какого...?!"
10051090-181 = "Команда охраны?! Изуна, мне кажется, тебя обманули! Это мошенничество с работой! Хитрость организаторов!"
10051090-182 = "Неправда, президент!"
10051090-183 = "Всё это было частью моего плана!"
10051090-184 = "Что ты имеешь в виду?!"
10051090-185 = "Погодите, это здание..."
10051090-186 = "Это тот модный показ, где сегодня главная звезда — Цукуё?"
10051090-187 = "Это совершенно НЕ «мероприятие, связанное с ниндзя»!"
10051090-188 = "Если в нём участвует ниндзя, значит, оно «связано с ниндзя»!"
10051090-189 = "Президент, вы ведь не намекаете, что у Цукуё нет сердца ниндзя?"
10051090-190 = "Конечно я такого не говорю!"
10051090-191 = "П-Просто... Цукуё..."
10051090-192 = "Ладно, все, идём. Пора."
10051090-193 = "Идём, Президент!"
10051090-194 = ""
10051090-196 = ""
10051090-197 = "А-Аааах...!"
