[translation]
83301200400-5 = ""
83301200400-6 = "Простите, вы ведь состоите в Отделе горячих источников, верно?"
83301200400-7 = "Хм?"
83301200400-8 = "А-а?! Глава префектов?! Что вы здесь делаете?!"
83301200400-9 = "Я-я сегодня ничего не делала! Просто отдыхаю — после обеда у меня выходной!"
83301200400-10 = "Я пришла не за тем, чтобы тебя наказывать."
83301200400-11 = "Я лишь хочу узнать больше о разработке горячего источника у Зала собраний Общества Пандемониума."
83301200400-12 = "Что?! Вы думаете, я стукачка?! Я никогда не предам свой клуб!"
83301200400-13 = "Предательство... Да, понимаю, почему ты можешь воспринимать это именно так."
83301200400-14 = "...Но я не собираюсь заставлять тебя говорить."
83301200400-15 = "Просто слышала слух, что Отдел горячих источников задумал нечто сомнительное."
83301200400-16 = "Кажется, это называлось... революцией горячих источников...? Для которой ещё продавались какие-то подозрительные билеты раннего доступа...?"
83301200400-17 = "Но, глядя на тебя, я уверена, что ты не стала бы устраивать беспорядки ради такой бессмысленной цели..."
83301200400-18 = "Что... вы сказали?"
83301200400-19 = "...?"
83301200400-20 = "Вы смеете называть нашу мечту бессмысленной?!"
83301200400-21 = "Хе! Конечно, глава Префектурной команды слишком упряма, чтобы увидеть её красоту!"
83301200400-22 = "Вы все слепы к великим и славным планам Отдела горячих источников! Вы понятия не имеете, как усердно президент Касуми и прораб Мэгу работают ради нашей цели!"
83301200400-23 = "Великим и славным, значит?"
83301200400-24 = "Источник, который мы начали копать у Общества Пандемониума, был лишь центральным соединительным проходом!"
83301200400-25 = "Когда мы закончим все горячие источники, которые прямо сейчас копаем по всей Геенне..."
83301200400-26 = "Геенну ждёт революция горячих источников, превосходящая самые смелые мечты!"
83301200400-27 = "До завершения операции «Пузырь Геенны» осталось всего несколько шагов!"
83301200400-28 = "Операция... «Пузырь Геенны»?"
83301200400-29 = "...О нет! Я так разозлилась, что всё вам рассказала!"
83301200400-30 = ""
83301200400-32 = ""
83301200400-34 = ""
83301200400-35 = "Б-бежим!"
83301200400-36 = ""
83301200400-38 = ""
83301200400-39 = "Стой!"
