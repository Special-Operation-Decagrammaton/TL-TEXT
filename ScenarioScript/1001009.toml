[translation]
1001009-1 = "Личная консультация"
1001009-2 = "В классе Абидоса"
1001009-3 = ""
1001009-4 = "(Широко нервно ждёт.)"
1001009-5 = "Эм..."
1001009-6 = "Я пришла, как вы велели, Сенсей. Так о чём речь?"
1001009-7 = "Это связано с Шале? Или с Абидосом?"
1001009-8 = "Хотите, чтобы я села? Хорошо..."
1001009-9 = ""
1001009-10 = ""
1001009-12 = "..."
1001009-15 = "― Вы хотели со мной о чём-то поговорить?[wa:1200]"
1001009-19 = "― (О чём думает Сенсей? Хотела бы я знать.)[wa:1300]"
1001009-23 = "― (Что он задумал?)[wa:1060]"
1001009-27 = "― Просто хочу, чтобы вы знали: я на вашей стороне, Сенсей.[wa:1300]"
1001009-32 = "― Когда вы... вот так гладите меня по голове...[wa:80]"
1001009-34 = "― Нет, меня это не беспокоит или что-то такое.[wa:80]"
1001009-37 = "[ns] Спросить, что она делала прошлой ночью."
1001009-38 = ""
1001009-39 = "Прошлой ночью? Я каталась, потом приняла душ, а на ужин ела жареную рыбу..."
1001009-40 = "А до этого? Я была на рекламном щите шоссе KV и притворялась, что захватываю грузовой фургон..."
1001009-41 = "О. Вы это видели?"
1001009-42 = "[s] Сказать, что вы переживаете из-за того, что она подвергает себя опасности."
1001009-43 = "Э-э..."
1001009-44 = "Я понимаю, к чему вы клоните... но, как я и говорила, это просто моё глупое хобби."
1001009-45 = "Эм... Я знаю, что всё, что я скажу, прозвучит как оправдание..."
1001009-46 = "..."
1001009-47 = "Поняла, поняла. Вы говорите это только потому, что волнуетесь за меня. Я прислушаюсь."
1001009-48 = "Я... простите. Не хотела доставлять столько хлопот."
1001009-49 = "Я правда заставила вас переживать, да?"
1001009-50 = "..."
1001009-51 = ""
1001009-52 = ""
1001009-53 = "...Спасибо."
1001009-55 = "(Широко вышла из класса уже в лучшем настроении.)"
