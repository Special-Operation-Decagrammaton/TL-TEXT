[translation]
10011070-1 = "Эпизод 7;Четвёртое препятствие: Дом с ловушками"
10011070-2 = ""
10011070-5 = ""
10011070-6 = "Привет всем! Добро пожаловать на следующее препятствие — Дом с ловушками!"
10011070-7 = "Он набит бесчисленными ловушками и хитрыми устройствами и считается туристическим местом номер один в Кинодеревне Водоворота!"
10011070-8 = "Разве это не просто особняк ниндзя?"
10011070-9 = "Пожалуйста, не придирайтесь к мелочам!"
10011070-10 = "Слушайте! Я Исами Каэдэ, и я отвечаю за четвёртое испытание — Дом с ловушками! Мне пятнадцать лет, а моё хобби — ловить жуков!"
10011070-11 = "[s] «Вот такого хранителя я и ожидал.»"
10011070-12 = "Хе-хе! Именно! А заговорщики, похитившие принцессу, уже скрылись внутри особняка! Или что-то вроде того! Подскажите реплику?"
10011070-13 = "В общем! Пройти испытание просто!"
10011070-15 = "Пройдите через тот особняк..."
10011070-18 = "Преодолейте все препятствия внутри..."
10011070-21 = "И доберитесь до финиша, чтобы спасти принцессу!"
10011070-23 = "Но осторожно! Звучит просто, но я бы не недооценивала Дом с ловушками."
10011070-24 = "Ладно, поняли! Дом с ловушками, особняк ниндзя, неважно — мы готовы!"
10011070-25 = "П-Подождите, Президент...! Не спешите..."
10011070-26 = "Президент! В доме с ловушками невозможно переоценить важность безупречной стратегии!"
10011070-27 = "Всё нормально. Нормально! Всё будет хорошо!"
10011070-28 = "Это всего лишь аттракционы! Их специально делают так, чтобы пройти было легко!"
10011070-29 = ""
10011070-31 = ""
10011070-32 = "Подождите! Я ещё не закончила объяснять!"
10011070-33 = ""
10011070-35 = ""
10011070-36 = ""
10011070-38 = "А?"
10011070-39 = "[s] «Мичиру, осторожно!»"
10011070-40 = ""
10011070-46 = "Бу-ха-ха! Испытания всё не заканчиваются, а эти девушки продолжают идти вперёд!"
10011070-47 = "И конечно, вы всё время рядом с ними."
10011070-48 = "Я ожидала многого, но боже."
10011070-49 = "Получается даже лучше, чем я надеялась. Как весело. Как невероятно, невероятно весело."
10011070-50 = "Ния! Что происходит?!"
10011070-51 = "Хм? Что-то случилось, Кахо?"
10011070-52 = "Мне позвонили работники, которые должны были играть похитителей принцессы, и спросили, когда начинается представление."
10011070-53 = "Кто тогда сейчас с Ибуки?"
10011070-54 = "Вот как? Какая странность. О боже."
10011070-55 = "Как думаешь, что происходит?"
10011070-56 = "Опять?! Пожалуйста, Ния! Кто на этот раз привлёк ваше внимание?"
10011070-57 = ""
10011070-59 = ""
10011070-60 = "Вообще-то я не хочу этого слышать. Придётся разобраться лично. До свидания."
10011070-61 = ""
10011070-63 = ""
10011070-65 = "Бу-ха-ха! Ох уж эта Кахо! Ей было бы гораздо лучше просто расслабиться. ♪"
10011070-66 = ""
10011070-68 = ""
10011070-69 = "Ну и что вы теперь будете делать?"
10011070-70 = "По сравнению с препятствиями, которые вы до сих пор проходили играючи, следующее окажется довольно чувствительным и... осмелюсь сказать, деликатным?"
10011070-71 = "Какой ответ вы найдёте перед таким испытанием?"
10011070-72 = "Хм, Сенсей?"
10011070-74 = ""
10011070-78 = ""
10011070-81 = "Договорились. Члены Исследовательского клуба ниндзюцу, рассчитываю на вашу помощь с представлением! ♪"
10011070-83 = ""
10011070-87 = "Не забывайте, мы, Вольные Морё, пришли с конкретной целью. Выполнить миссию быстро и убрать любого, кто встанет на пути. Без отвлечений."
10011070-89 = ""
10011070-93 = "Сразиться на равных с президентом Клуба внутренней дисциплины? Что вообще за Исследовательский клуб ниндзюцу?"
10011070-94 = "Что за дурацкое название «Исследовательский клуб ниндзюцу»? Пф."
10011070-101 = ""
10011070-102 = "(Я никогда не сдамся. Такой шанс бывает раз в жизни.)"
10011070-103 = "(Мы можем всё решить. Наконец станем официальным клубом.)"
10011070-104 = "(И я смогу с гордостью смотреть в глаза Изуне и Цукуё!)"
10011070-105 = "(Поэтому несмотря ни на что...!)"
10011070-106 = ""
10011070-108 = ""
10011070-110 = ""
10011070-114 = "А? Где я...?"
10011070-115 = "[s] «Эй, Мичиру. Ты в порядке? Мы приземлились здесь, когда ты попала в ту ловушку.»"
10011070-116 = "Ловушку? В особняке? В туристическом месте?"
10011070-117 = "Да погодите вы секунду! Это настоящий особняк ниндзя?!"
10011070-118 = "Нужны все руки! Достопочтенный Сенсей! Вперёд!"
10011070-119 = "[s1] «Ну... Мне сейчас немного трудно двигаться.»\n[s2] «Кажется, я неудачно приземлился на ногу, когда ты падала.»"
10011070-122 = "Ногу? Падение?"
10011070-123 = "Достопочтенный Сенсей... Вы... Вы хотите сказать, что пострадали, потому что... поймали меня при падении?"
10011070-124 = "И всё потому, что я одна рванула вперёд?"
10011070-125 = "[s] «Это не... совсем твоя вина, Мичиру.»"
10011070-126 = ""
10011070-128 = ""
10011070-129 = ""
10011070-130 = "...испорчено..."
10011070-131 = "[s] «Что ты сказала, Мичиру?»"
10011070-132 = "Всё испорчено..."
10011070-133 = "УА-А-А-А! Простите! Что мне делать? Я всё испортила!"
10011070-134 = ""
10011070-142 = "[ns] «Теперь немного легче?»"
10011070-143 = "Ух. *шмыг* ...Да."
10011070-144 = "[s3] «Так, Мичиру, что ты имела в виду под „всё испорчено“?»\n[s4] «Хочешь поговорить о том, как всё испортила?»"
10011070-147 = "...Это я. Мой эгоизм."
10011070-148 = "Когда Ибуки похитили, я специально не доложила."
10011070-149 = "Я должна была сразу сообщить клубу Инь-Ян и Хяккарёран, как положено..."
10011070-150 = "Но... я стала жадной..."
10011070-151 = "[s] «Ты не хотела упустить шанс сделать клуб официальным?»"
10011070-152 = "В-Вы всё это время знали?"
10011070-153 = "Это правда... но не только поэтому..."
10011070-154 = "Я правда хочу распространить культуру ниндзя по всему Кивотосу. Но... что, если все будут надо мной смеяться?"
10011070-155 = "Я так боялась насмешек... Поэтому больше всего хотела воспользоваться шансом сделать клуб официальным."
10011070-156 = "Другого такого шанса может уже не быть! Поэтому я должна была добиться успеха! Любой ценой!"
10011070-157 = ""
10011070-160 = ""
10011070-161 = "У меня есть ответственность перед всеми. Перед Изуной и её сияющим восхищением ниндзя..."
10011070-162 = "И перед милой, доверчивой Цукуё..."
10011070-164 = "Цукуё, верно?"
10011070-165 = "...!"
10011070-166 = "Ты хочешь вступить со мной в Исследовательский клуб ниндзюцу?"
10011070-168 = "Я хотела стать примером, которым они могли бы гордиться. Вот и всё."
10011070-169 = "Если бы единственным последствием сегодняшнего дня был сорванный спектакль и то, что нас не признают официально... Я бы пережила."
10011070-170 = ""
10011070-172 = ""
10011070-173 = "Но из-за того, что я тянула с докладом, ребёнок, которого похитили Морё..."
10011070-174 = ""
10011070-175 = "Я обещала защищать её. А теперь она где-то плачет, и я не могу ей помочь."
10011070-177 = "Из-за моей жадности ситуация вышла из-под контроля."
10011070-178 = "Если люди узнают, что если Изуну и Цукуё начнут винить просто за то, что они состоят в Исследовательском клубе ниндзюцу?"
10011070-179 = "Если бы я не была такой эгоистичной..."
10011070-180 = "Что, если Изуна и Цукуё узнают?"
10011070-181 = "Они так во мне разочаруются, если узнают, что всё случилось по моей вине."
10011070-182 = "...Я... Я так..."
10011070-183 = "[s] «Ладно, нога уже намного лучше. Пойдём?»"
10011070-184 = "Чего?! У нас тут был эмоциональный момент! Разве нет?!"
10011070-185 = "В фильме про ниндзя я была бы главной героиней, которая наконец раскрывает огромный секрет, который носила в себе всю историю!"
10011070-186 = "Нельзя так равнодушно относиться к кульминации, достопочтенный Сенсей!"
10011070-187 = "Вот, теперь я плачу! Как вам? То есть я и так уже плакала! Я знаю!"
10011070-188 = "[s] «То есть ты слишком боялась подать официальную заявку?»"
10011070-189 = "А?"
10011070-190 = "То есть... Как я вообще могла подать заявку?!"
10011070-192 = "Какой нормальный обычный человек воспринимает ниндзя всерьёз? Мы же называемся Исследовательским клубом ниндзюцу!"
10011070-193 = "Мы только и делаем, что косплеим ниндзя из аниме и комиксов!"
10011070-194 = "Кто вообще нас примет?"
10011070-195 = "Никто не поймёт! Нас уже называют странными дурочками с тупыми увлечениями!"
10011070-197 = "Думаете, им будет не всё равно? Они выставят нас идиотками!"
10011070-198 = "Они выставят идиотками моих друзей!"
10011070-199 = "Поэтому я не могу!"
10011070-200 = ""
10011070-203 = "[ns5] «Если ты так считаешь, Мичиру, мне больше нечего сказать.»\n[ns6] «Думаю, тебе стоит услышать, что скажут остальные двое, Мичиру.»"
10011070-207 = "Достопочтенный Сенсей...? Я не понимаю..."
10011070-208 = "[s] «Пора идти. Давай вытрем слёзы с твоего лица.»"
10011070-209 = "Ты права."
10011070-210 = "А сейчас наш приоритет — выбраться отсюда."
10011070-211 = ""
10011070-213 = ""
10011070-214 = "...Спасибо, достопочтенный Сенсей."
10011070-215 = "[s] «Не за что. И ещё, у тебя макияж потёк.»"
10011070-216 = "Ч-Что-о-о?!"
10011070-217 = "Эй! Можно было сказать помягче!"
10011070-218 = "...Я уже не знаю, что говорить. Как мы вообще до этого дошли?"
10011070-219 = "Знаю-знаю. Главное — как отсюда выбраться."
10011070-220 = "Но и этого я не понимаю..."
10011070-221 = ""
10011070-223 = ""
10011070-224 = "А?"
10011070-225 = "[s] «Что случилось?»"
10011070-226 = "Погодите-ка... Всё это выглядит очень знакомо."
10011070-227 = "Этот коридор, планировка комнаты..."
10011070-228 = "Комнаты в особняке, эта структура... Неужели это... «Kama-Boko Gale Battle»...?"
10011070-229 = "Если так... Тогда, кажется, у меня действительно есть идея."
10011070-230 = "Достопочтенный Сенсей, сюда!"
10011070-231 = "[ns] «Веди.»"
10011070-233 = ""
10011070-240 = ""
10011070-241 = ""
10011070-242 = ""
10011070-245 = ""
10011070-246 = ""
10011070-247 = ""
10011070-248 = ""
10011070-249 = ""
10011070-252 = "Я так и знала! Это место — точная копия особняка ниндзя из эпизода «Kama-Boko Gale Battle»!"
10011070-253 = "Это разве не нарушение авторских прав?! Понимаю, сейчас есть дела поважнее, но какого чёрта!"
10011070-254 = "[s] «Вообще-то такое довольно часто бывает в туристических местах, разве нет?»"
10011070-255 = "Ух, потом я выскажу администрации всё, что думаю! Сейчас нам нужно спасти принцессу."
10011070-256 = "Ого! Два прошедших! Сенсей и Мичиру!"
10011070-257 = "[s] «Каэдэ? Что происходит?»"
10011070-258 = "Не могу поверить, что вы рванули вперёд, не дослушав правила! Я совсем растерялась!"
10011070-259 = "Кхм! Но раз уж вы добрались, я могу закончить объяснение!"
10011070-260 = "Тот, кто преодолеет лабиринт внутри особняка, получает право стать претендентом!"
10011070-262 = "Претендентом?"
10011070-263 = "Именно! Так что тот, кто выйдет первым..."
10011070-264 = ""
10011070-268 = ""
10011070-269 = "...Получит право сразиться с хранителем, то есть со мной! Каэдэ! Аплодисменты!"
10011070-270 = "Если победите меня — вы выиграли! Так что готовы или нет, я иду!"
10011070-271 = "Погодите, то есть мы прошли всю полосу препятствий только ради боя с ней?"
10011070-272 = "[s] «Похоже на то.»"
