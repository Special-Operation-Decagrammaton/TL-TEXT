[translation]
1002006-1 = "Что ты делаешь?"
1002006-2 = "(Я настолько устал, что едва не падаю с ног, но всё же пришёл туда, где договорился встретиться с Кохару.)"
1002006-3 = "(К тому моменту, как я пришёл, Кохару уже ждала меня.)"
1002006-4 = "Сюда, Сенсей. Я... рада, что ты пришёл."
1002006-5 = "О-Обычно я бы не рискнула приводить тебя в такое опасное место..."
1002006-6 = "[s1] «Почему это место опасное?»\n[s2] «На что у тебя на этот раз разыгралось воображение?»"
1002006-7 = "Т-Ты не считаешь его опасным?"
1002006-8 = "Т-Ты не считаешь его опасным?"
1002006-9 = "В-Вход в школу после занятий, вокруг ни души..."
1002006-10 = "Никогда не знаешь, кто может зайти. Столько историй начинается именно так."
1002006-11 = "Разве ты не чувствуешь надвигающуюся опасность?"
1002006-12 = "...Погоди."
1002006-13 = "М-Может... ты из тех людей, которым нравится такая опасность."
1002006-14 = "О-О нет. Я об этом не подумала..."
1002006-15 = "Если так, тогда...!"
1002006-16 = "[s3] «Ты опять себе что-то напридумывала.»\n[s4] «Мы закончили? Думаю, мы закончили.»"
1002006-17 = "Серьёзно?"
1002006-18 = "Точно?"
1002006-19 = "Как я могу тебе доверять?"
1002006-20 = "П-Погоди!"
1002006-21 = "Ладно, я поняла..."
1002006-22 = "В общем, вот зачем я тебя позвала."
1002006-23 = "Это печенье из сувенирного магазина."
1002006-24 = "Я-я хотела отблагодарить тебя за прошлую помощь, поэтому..."
1002006-25 = "В-Вот и всё. Понятно?"
1002006-26 = "[s] «Спасибо. Выглядит вкусно.»"
1002006-27 = "Н-Не подумай ничего такого."
1002006-28 = "Клянусь, я не подмешивала туда ничего странного. Ты наверняка слышал истории о таком..."
1002006-29 = "Вообще-то, думаю, большинство людей сразу пришли бы именно к такому выводу."
1002006-30 = "Или, может... ты знал, что я знаю, о чём ты подумаешь, и поэтому специально сказал, что печенье выглядит вкусно!"
1002006-31 = "[s5] «Опять началось...»\n[s6] «Так устал... Сейчас вырублюсь...»"
1002006-32 = "П-Почему ты так смотришь?"
1002006-33 = "П-Почему ты так смотришь?"
1002006-34 = "Если кто и должен так смотреть, то это я."
1002006-35 = "Разве не я должна была следить за тобой?"
1002006-36 = "[s7] (Больше не могу. Отчитаю Кохару.)\n[s8] (Больше не могу. Напугаю Кохару.)"
1002006-37 = ""
1002006-39 = ""
1002006-40 = ""
1002006-42 = ""
1002006-43 = ""
1002006-46 = "А?! С-Сенсей?!"
1002006-49 = "― Ч-Что ты...?![wa:360]"
1002006-52 = "― (О-О нет. Этого не может быть!)[wa:2130]"
1002006-55 = "― Я ведь н-не сказала ничего плохого, да?[wa:2150]"
1002006-58 = "― (П-Погоди. Такими темпами мы с Сенсеем...)[wa:2050]"
1002006-61 = "― (Это то, о чём я думаю? Я столько раз читала о таком в книгах.)[wa:370]"
1002006-63 = "― (Это правда происходит?!)[wa:720]"
1002006-66 = "― (Что мне делать? Закрыть глаза?)[wa:1870]"
1002006-69 = "― (Н-Не может быть! Как далеко всё зайдёт?!)[wa:2490]"
1002006-72 = "― Сенсей... Я знаю, чего ты добиваешься.[wa:1740]"
1002006-75 = "― (Это ПЛОХО! Очень плохо.)[wa:10]"
1002006-77 = "― (Я-я не готова к такому...)[wa:1320]"
1002006-80 = "[ns] Погладить Кохару по голове."
1002006-82 = ""
1002006-83 = "...?"
1002006-84 = "Какого...?!"
1002006-87 = "..."
1002006-88 = "С-Сенсей?"
1002006-89 = "(Я успокоил Кохару, после чего вернулся в офис и немного поспал.)"
