[translation]
41105-3 = "Guaaaah?!"
41105-4 = "E-Essa força é absurda... Fujam!"
41105-8 = "E-Ei, pessoal! Aonde vocês vão? O inimigo ainda..."
41105-9 = "Eu nem queria fazer nada pra começo de conversa, como é que eu vou lutar?!"
41105-10 = "Vou embora,"
41105-11 = "já deu dessa vida!"
41105-12 = "E-Esperem aí!!"
41105-20 = "Ah, o esconderijo da \"Felicidade da Posse\"... Até os enfeites caros que eu juntei com tanto esforço, tudo queimou..."
41105-21 = "[s] \"Desculpa perguntar de novo, mas vocês não eram contra o apego à 'posse'...?\""
41105-22 = "Cala a boca!! Buscar o luxo é da natureza humana, não é?!"
41105-23 = "Se não fosse por vocês... se vocês não tivessem aparecido...!"
41105-27 = "...Setor A, limpo."
41105-28 = "Todos os atiradores do 2º andar também foram neutralizados..."
41105-29 = "Setor B também está limpo."
41105-30 = "Alguns conseguiram fugir, mas imobilizei o resto todo."
41105-32 = "Certo, bom trabalho a todas."
41105-33 = "Não conseguimos nada de útil, mas o importante é que ninguém se feriu..."
41105-37 = "...Hum? Miyako, isso aqui não é comida enlatada? Tá vencida, mas..."
41105-41 = "Salmão defumado e bacon..."
41105-45 = "Tem até vieiras em conserva no azeite!"
41105-46 = "Uau... Só com isso, até um bentô comum vira uma refeição de luxo...!"
41105-48 = "E-Espera, não encosta nisso!"
41105-49 = "Esses enlatados finos aí, eu tava guardando com todo carinho pra comer de petisco com minha bebida depois...!"
41105-51 = "Miyako-chan, tem um monte de sacos de dormir e lonas impermeáveis aqui..."
41105-52 = "A gente sempre passava sufoco quando chovia, mas com isso..."
41105-53 = "...Entendo, faz sentido."
41105-57 = "Moe, pode providenciar um veículo agora mesmo?"
41105-58 = "Parece que o espólio vai ser maior do que pensávamos."
41105-60 = "E-Ei, desde quando vocês tão tratando isso como \"espólio\"?!"
41105-61 = "Isso tudo é meu! Não encostem nas minhas posses!"
41105-62 = "[s] \"E onde foi parar toda aquela história de 'não-posse'...\""
41105-64 = "Mas isso aqui tá quase tudo perto de vencer, sabia?"
41105-65 = "Seus subordinados já deram no pé... Não tem como você comer tudo sozinho, né?"
41105-66 = "Quem abriu fogo de advertência primeiro foram vocês."
41105-67 = "Como compensação pelo prejuízo, não poderíamos ficar com uma parte, mesmo que não seja tudo?"
41105-72 = "Ugh, grrr..."
41105-74 = "Parasitas! Escória da sociedade! Se querem tanto isso, por que não vão arrumar um trabalho honesto?!"
41105-75 = "Fortes desse jeito, vocês nem precisariam depender de bentô vencido pra sobreviver! Poderiam virar mercenárias ou qualquer outra coisa!"
41105-76 = "Nós não somos mercenárias. Somos da SRT."
41105-77 = "E eu lá quero saber! Se vocês pertencem a uma instituição séria, que tal cederem pelo menos uns bentôs?!"
41105-78 = "A gente tá aqui lutando pra sobreviver, e vocês chegam com armas de última geração e discursinho de justiça..."
41105-79 = "Tudo o que vocês dizem não passa de sofisma!"
41105-80 = "Quem só fala sofisma aqui é você, não?!"
41105-81 = "Fica falando de \"não-posse\" e de \"buscador da verdade\", mas na prática só segue os próprios desejos..."
41105-82 = "Se é um buscador da verdade, aja como um e vai comer bentô de broto de feijão!"
41105-83 = "Cala a boca! Até um buscador da verdade quer comer bentô de carne grelhada!!"
41105-84 = "[s] \"Calma, calma...\""
41105-86 = "[s1] \"De qualquer forma, eu também tenho culpa nisso, então eu compro as lonas e o que mais precisarem.\"\n[s2] \"Vocês também, deixem as coisas daqui onde estão.\""
41105-89 = "..."
41105-95 = "Vou repetir mais uma vez: não precisamos da ajuda do Sensei."
41105-96 = "Não importa o que o Sensei diga, nós não vamos mudar de ideia..."
41105-97 = "...Cansei. Já perdi até quase todo o apetite."
41105-98 = "Vamos voltar, comer um bentô de broto de feijão e dormir..."
41105-99 = "E-Eu também..."
41105-100 = "...Tem razão. Comer algo gorduroso de repente faria mal pro estômago..."
41105-104 = "Acampamento RABBIT, aqui é RABBIT 1."
41105-105 = "Operação encerrada, retornando à base."
41105-106 = "Ué, cadê o espólio? Cadê o bentô de bife wagyu?!"
41105-107 = "Infelizmente, acabou não dando certo."
41105-108 = "Vamos ficar com o bentô de broto de feijão hoje."
41105-109 = "Quêêê?! E eu que tive todo o trabalho de arrumar o veículo?!"
41105-110 = "Cala a boca, encara como dieta."
41105-117 = "H-Hehe, esse olhar cheio de cobiça..."
41105-118 = "Realmente, a \"posse\" cega as pessoas e corrompe seus corações..."
41105-119 = "[s] \"Acho que o seu olhar está bem parecido...\""
41105-120 = "E-"
41105-121 = "Eu não sou nada assim?!"
41105-122 = "Com este olhar puro, eu sou capaz de discernir o verdadeiro valor de todas as coisas! Como resultado, muitos camaradas..."
41105-123 = "P-Pensando bem, os camaradas foram todos embora..."
41105-124 = "...Já que estamos aqui, Sensei, não gostaria de se juntar à \"Felicidade da Posse\"?"
41105-125 = "Vamos, abra mão das suas posses, Sensei, e juntos buscaremos o refúgio do espírito..."
41105-126 = "[s] \"Dispenso...\""
41105-129 = "Próximo;Alerta de Chuva Forte"
