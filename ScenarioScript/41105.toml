[translation]
41105-3 = "Кха-а-а!"
41105-4 = "О-они слишком сильны… Бежим!"
41105-5 = ""
41105-8 = "Т-товарищи? Вы куда? Противник ведь всё ещё здесь…"
41105-9 = "Да у этих слабаков даже кишка тонка устроиться на работу. Разумеется, они трусливо сбежали с поля боя!"
41105-10 = "Всё, я возвращаюсь домой."
41105-11 = "Я не хочу больше быть бомжом!"
41105-12 = "Постойте, нет! Вы должны сражаться за меня!"
41105-13 = ""
41105-20 = "О нет… Моя драгоценная база… Все мои драгоценные декорации, которые я с таким трудом собирал… Всё горит в огне…"
41105-21 = "[s] «А как же отказ от мирских желаний?»"
41105-22 = "Заткнись! Заткнись! Всем нравятся красивые и дорогие вещи!"
41105-23 = "Ты… Если бы не ты…"
41105-26 = ""
41105-27 = "Сектор А зачищен."
41105-28 = "И я... сняла в-всех снайперов…"
41105-29 = "Сектор Б зачищен."
41105-30 = "Не считая тех, кто сбежал, все противники на первом этаже нейтрализованы."
41105-32 = "Чистая работа, девочки."
41105-33 = "Пусть мы ничего и не получили, главное - никто не пострадал."
41105-34 = ""
41105-36 = ""
41105-37 = "Мияко, глянь сюда. Кажется.. это целый склад консервов."
41105-38 = ""
41105-40 = ""
41105-41 = "Копчёный лосось, бекон…"
41105-42 = ""
41105-44 = ""
41105-45 = "Тут даже есть морские гребешки в масле!"
41105-46 = "Вот это добыча! Представляете, как круто будет добавить эти деликатесы в наши бенто!"
41105-48 = "Постойте… А ну убрали свои алчные ручонки!"
41105-49 = "Я бережно хранил эти премиальные консервы Канцума, чтобы шикануть под выпивку!"
41105-51 = "М-Мияко. Я тут тоже кое-что нашла. Спальные мешки, брезент…"
41105-52 = "Мы сможем подстилать его, когда спим! А то во время дождя земля становится такой сырой."
41105-53 = "Отличная работа, Мию."
41105-54 = ""
41105-56 = ""
41105-57 = "Мое, прошу, организуй нам транспорт."
41105-58 = "Здесь добычи гораздо больше, чем мы рассчитывали. Своими силами мы всё это не утащим."
41105-60 = "Добычи? ДОБЫЧИ?! Это мои ВЕЩИ."
41105-61 = "Это всё моё! Моё добро. Моё драгоценное имущество. Всё моё! Вы не имеете права это забрать!"
41105-62 = "[s] «О да. Я тоже без ума от благородных идеалов нестяжания.»"
41105-64 = "И ты вот этот весь хлам называешь \"драгоценным имуществом\"?"
41105-65 = "Твоих прихвостней всё равно след простыл. Так что не думаю, что тебе теперь вообще хоть что-то из этого понадобится."
41105-66 = "Именно. К тому же ты сам заманил нас сюда с помощью дезинформации и пытался ликвидировать."
41105-67 = "Я считаю, что всё это даже близко не компенсирует убытки, понесённые нами в результате твоих противоправных действий."
41105-68 = ""
41105-71 = ""
41105-72 = "Гх… Аааа!.."
41105-74 = "Да вы просто паразиты! Трутни! Бесполезные попрошайки! Какого чёрта вы сами не пойдёте работать, чтобы честно зарабатывать себе на хлеб?!"
41105-75 = "Если вы такие из себя сильные, какого чёрта вы вообще дерётесь за просроченные бенто?! Найдите уже нормальную работу! Наёмниками станьте, да кем угодно! Мне плевать кем!"
41105-76 = "Мы не наёмники. Мы оперативники SRT."
41105-77 = "Хм! Ну, тогда вам тем более не следовало воровать наши бенто!"
41105-78 = "Нищие люди каждый божий день ведут борьбу за выживание! А вы думаете, что можете просто прийти, помахать своими большими крутыми пушками и силой заставить всех делать то, что вам вздумается? Да?!"
41105-79 = "Вы… Вы лицемерки!"
41105-80 = "Мы? Лицемерки? Приятель, в зеркало сначала посмотри."
41105-81 = "Благородное стремление. Нестяжание. На деле же всё твоё хвалёное просветление - обычная дешёвая фальшивка, призванная скрыть тот факт, что ты обычный ленивый бездельник!"
41105-82 = "Настоящему монаху было бы плевать, что есть - хоть вагю, хоть бенто с ростками маша!"
41105-83 = "Заткнись! Я тоже заслуживаю есть бенто с якинику!"
41105-84 = "[s] «А ну-ка хватит, вы двое.»"
41105-86 = "[s1] «Не нужно отбирать у него вещи. Я куплю вам всё, что необходимо.»\n[s2] «Отряд RABBIT, оставьте его пожитки в покое. У меня есть кредитная карточка.»"
41105-87 = ""
41105-88 = ""
41105-89 = "..."
41105-90 = ""
41105-92 = ""
41105-94 = ""
41105-95 = "Мы не нуждаемся в Вашей помощи, Сенсей."
41105-96 = "И мы вовсе не обязаны слушаться Вас во всём… Но…"
41105-97 = "Странно, что-то аппетит совсем пропал. Должно быть, перетрудилась."
41105-98 = "Думаю, я просто съем дома бенто с ростками маша."
41105-99 = "Я-я тоже..."
41105-100 = "…Да. Думаю, у нас только живот разболится, если мы станем пихать в себя еду через силу."
41105-101 = ""
41105-103 = ""
41105-104 = "База, я RABBIT 1. Отменяй транспорт. Операция завершена."
41105-105 = "Мы возвращаемся в лагерь."
41105-106 = "А как же бенто с вагю высшего качества?! Сенсей же сказал, что они там!"
41105-107 = "К сожалению, выяснилось, что элитные бенто здесь расхватаны подчистую."
41105-108 = "К счастью, у нас есть бенто с ростками маша. До истечения их срока годности остаётся ещё целая пара дней."
41105-109 = "Меня в этом отряде вообще кто-нибудь ценит?! Я уже транспорт подогнала!"
41105-110 = "Извини, Мое. Считай это уроком нестяжания."
41105-111 = ""
41105-113 = ""
41105-116 = ""
41105-117 = "Ну ты видел?!  Этот свирепый, алчный блеск в их кровожадных глазках…"
41105-118 = "Всё в точности, как я и говорил! Привязанность к материальным благам ослепляет людей жадностью, что неизбежно приводит к насилию!"
41105-119 = "[s] «Как и сказала Саки… Тебе бы самому не помешало посмотреть в зеркало.»"
41105-120 = "Я?! Ослеплён жадностью?"
41105-121 = "Да ни за что на свете!"
41105-122 = "Я - просветлённый муж! Я один понимаю, в чём заключается истинная ценность в этом погрязшем во грехе обществе!"
41105-123 = "Пусть сегодня я и лишился соратников, но я отстрою общину заново!"
41105-124 = "Вообще-то… мне тут пришла в голову отличная мысль. Сенсей, а почему бы тебе самому не примкнуть к Преследователям?"
41105-125 = "Всё, что от тебя потребуется для вступления - это доказать верность идеалам нестяжания и пожертвовать нам одну крохотную, совсем малюсенькую часть своего имущества."
41105-126 = "[s] «Я бы лучше съел бенто с ростками маша.»"
41105-129 = "Следующий эпизод;Предупреждение о сильном дожде"
