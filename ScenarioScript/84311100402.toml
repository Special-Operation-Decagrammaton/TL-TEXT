[translation]
84311100402-5 = ""
84311100402-6 = "Тебя всё ещё не поймали. Как сказала Нэру, ты, должно быть, очень хорошо убегаешь."
84311100402-7 = "Фуфу, конечно. Я не первый раз этим занимаюсь."
84311100402-8 = ""
84311100402-10 = ""
84311100402-11 = "А? Но кто ты? Похожа на студента Тринити... и, судя по виду, наверное, какая-то важная персона."
84311100402-12 = "Очень проницательно. Но здесь, на Экспо, я просто студент."
84311100402-13 = "Вот как? Фуфу, обязательно повеселись! Здесь довольно скучно, но, по крайней мере, они очень постарались!"
84311100402-14 = "Скучно...? Здесь?"
84311100402-15 = "Для сравнения: какое место ты считаешь нескучным?"
84311100402-16 = ""
84311100402-18 = ""
84311100402-19 = "А? Могу назвать несколько. Игровой центр, казино, лаунж Шале..."
84311100402-20 = "(По этому списку уже немного видно, какой у неё характер.)"
84311100402-21 = "Хм... а зачем спрашиваешь?"
84311100402-22 = "Да так. Просто вкусы у нас, похоже, довольно похожие."
84311100402-23 = "Хмм? О-о-о!"
84311100402-25 = "Тогда можно твой номер? Когда-нибудь сходим туда вместе."
84311100402-26 = "Звучит хорошо. Давай."
84311100402-28 = "Но официально этого номера не существует. Держи его в секрете."
84311100402-29 = "Фуфу, всё становится всё интереснее."
84311100402-30 = "Ладно! Запомню!"
