[translation]
1010905-1 = "Без вкуса"
1010905-2 = "Гостиная Шале"
1010905-4 = "На следующий день я отдыхал на кровати в гостиной Шале."
1010905-5 = ""
1010905-10 = ""
1010905-11 = "Прошу прощения!"
1010905-12 = "Здравствуйте, Сенсей. Как и обещала, я пришла вас навестить."
1010905-13 = "Ну... Вы нормально спите? Не бывает внезапной дрожи или... ночных кошмаров?"
1010905-14 = "[s1] «...Ноа, ты и правда пришла.»\n[s2] «Прости, я не могу встать и встретить тебя как следует.»"
1010905-17 = "Не напрягайтесь. Я знаю, что вы плохо себя чувствуете."
1010905-18 = ""
1010905-20 = ""
1010905-21 = "Вы не против, если я уберу со стола напитки и пустой контейнер от обеда?"
1010905-22 = "Ах! И мусор пора вынести. Я тоже этим займусь."
1010905-23 = ""
1010905-25 = ""
1010905-26 = "Что это под книгой...? Похоже на счёт за коммунальные услуги за этот месяц."
1010905-27 = "И срок оплаты уже скоро. Я могу с этим разобраться."
1010905-28 = "[s] «Тебе правда не нужно всё это делать за меня...»"
1010905-29 = "Нет-нет. Это совсем не трудно."
1010905-30 = "Ваша единственная задача — отдыхать и не думать о работе."
1010905-31 = "К тому же всё это всё равно входит в обязанности представителя студентов."
1010905-32 = "[s3] «Но сегодня ты даже не на дежурстве...»\n[s4] «Может, хотя бы переоденешься во что-нибудь поудобнее?»"
1010905-35 = "Во что-нибудь поудобнее...?"
1010905-36 = ""
1010905-38 = ""
1010905-39 = ""
1010905-40 = "Тогда можно мне воспользоваться раздевалкой?"
1010905-41 = "[s] «Конечно. Иди.»"
1010905-42 = "Хи-хи. Тогда одну минутку."
1010905-43 = ""
1010905-45 = ""
1010905-47 = "Немного позже..."
1010905-49 = ""
1010905-50 = "Я вернулась."
1010905-51 = "[s] «Ноа, твоя одежда...»"
1010905-52 = "Да? Что-то не так?"
1010905-53 = "Вы же сами сказали одеться поудобнее. Я решила, что пижама подойдёт."
1010905-54 = "[s] «Другие студенты могут неправильно понять...»"
1010905-55 = "Сегодня никаких студентов на посещение не запланировано."
1010905-56 = "И это вы сами сказали мне устроиться поудобнее."
1010905-57 = "Или есть какой-то другой наряд, который вы хотели бы на мне увидеть?"
1010905-58 = ""
1010905-61 = "[ns] «...Надень то, в чём тебе удобно.»"
1010905-62 = "Хорошо. Тогда просто лежите и отдыхайте, пока я здесь закончу."
1010905-64 = ""
1010905-65 = ""
1010905-66 = ""
1010905-67 = "Кажется, всё..."
1010905-68 = "Сенсей, вы уже обедали?"
1010905-69 = "[s] «Нет, аппетита особо нет...»"
1010905-70 = "Даже если не хочется, для быстрого выздоровления очень важно нормально питаться!"
1010905-71 = "...Если я правильно помню, когда вы навещали меня, вы приготовили мне кашу с яйцом, верно?"
1010905-72 = "Так что на этот раз я приготовлю что-нибудь для вас."
1010905-73 = "[s] «Еда, которую приготовишь ты? Хочу попробовать.»"
1010905-74 = "Ничего особенного не будет, но..."
1010905-75 = "Что ж, подождите немного."
1010905-76 = ""
1010905-78 = ""
1010905-83 = ""
1010905-84 = "Спасибо, что подождали!"
1010905-85 = "Я приготовила суп с креветками и бамией, которые нашла в холодильнике, а к нему — яйцо на пару."
1010905-86 = "Я сделала всё так, как обычно готовлю для себя. Надеюсь, вам понравится."
1010905-87 = "[s5] «Мне понравится всё, что ты приготовишь!»\n[s6] «Спасибо, Ноа.»"
1010905-90 = "Да, пожалуйста, ешьте, пока не остыло."
1010905-91 = ""
1010905-94 = ""
1010905-95 = "Эм... Вам не понравилось?"
1010905-96 = "[s] «Нет, очень вкусно!»"
1010905-97 = "После первого глотка вы выглядели... растерянно."
1010905-98 = "[s7] «Просто я обычно ем довольно сильно приправленную еду.»\n[s8] «Я забыл, что для больных обычно готовят с малым количеством соли.»"
1010905-101 = "А..."
1010905-102 = "Простите. Но я сделала его пресным не поэтому."
1010905-103 = "На самом деле я просто приготовила так, как обычно ем сама. Мне стоило учесть ваши предпочтения."
1010905-104 = "Когда я ем одна, почти не использую специи и соль. Полагаю, это незаметно вошло у меня в привычку."
1010905-105 = "[s] «Ты не любишь приправлять еду?»"
1010905-106 = "Да. Слишком много приправ может скрыть настоящий вкус ингредиентов."
1010905-107 = "Моё стремление жить нейтрально, не влияя на окружающее, чтобы беспристрастно фиксировать жизни других людей..."
1010905-108 = "...похоже, отрицательно сказалось на моей попытке приготовить для вас вкусную еду."
1010905-109 = ""
1010905-112 = "[ns] Быстро доесть еду Ноа."
1010905-115 = "С-Сенсей, горячо же, ешьте медленнее—"
1010905-116 = "[s] «Прости. Было так вкусно, что я не смог остановиться.»"
1010905-118 = "[ns] «Ноа, можно попросить тебя ещё об одной услуге?»"
1010905-119 = "Услуге от меня?"
1010905-120 = "[s] «Да. Это можешь сделать только ты!»"
1010905-121 = "Только я...?"
1010905-122 = ""
1010905-132 = "― [log=노아 파자마]«Мерцающие звёзды сияли тихо и послушно, словно огромное стадо овец...» [/log][wa:5650]"
1010905-135 = "― [log=노아 파자마]Вы бываете таким непредсказуемым человеком, Сенсей.[/log][wa:670]"
1010905-137 = "― [log=노아 파자마]Не могу поверить, что вы хотите уснуть под моё скучное чтение.[/log][wa:1610]"
1010905-140 = "[ns] «Когда ты читаешь, я гораздо сильнее погружаюсь в историю.»"
1010905-142 = "― [log=노아 파자마]...Интересно, почему.[/log][wa:2950]"
1010905-144 = "― [log=노아 파자마]Может, мой монотонный голос помогает яснее передать смысл...?[/log][wa:3450]"
1010905-147 = "― [log=노아 파자마]Спасибо, Сенсей.[/log][wa:4410]"
1010905-149 = "― [log=노아 파자마]Благодаря вам я смогла принять себя гораздо полнее.[/log][wa:1160]"
1010905-152 = "― [log=노아 파자마]...Сенсей? Вы уснули?[/log][wa:3200]"
1010905-155 = "― [log=노아 파자마]Среди бесчисленных звёзд есть одна — самая яркая и хрупкая.[/log][wa:2340]"
1010905-157 = "― [log=노아 파자마]Она сбилась с пути и тихо уснула.[/log][wa:4760]"
1010905-160 = "Мягкий, монотонный голос Ноа постепенно проникал в моё измученное тело."
1010905-161 = "...Благодаря ей я впервые за долгое время смог крепко выспаться."
