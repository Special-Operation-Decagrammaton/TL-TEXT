[translation]
1300502-1 = "Полицейский допрос"
1300502-2 = "Улицы Кивотоса"
1300502-3 = ""
1300502-4 = ""
1300502-5 = ""
1300502-6 = "Полиция допрашивает Кайоко возле тёмного переулка."
1300502-7 = "Я уже сказала! Я ничего не делала!"
1300502-8 = "Не лги мне! Как тогда объяснишь такой подозрительный наряд...?"
1300502-9 = "И кто станет просто так бродить по району с высокой преступностью?"
1300502-10 = "Потому что..."
1300502-11 = "...Потому что?"
1300502-12 = "...Неважно. Мне нечего вам сказать."
1300502-13 = "Хмф. Я так и знал. Ты что-то от нас скрываешь!"
1300502-14 = "Для начала мне понадобится твой ученический билет, чтобы установить личность."
1300502-15 = "(Префектурная команда будет не в восторге, если узнает, что я из Геенны...)"
1300502-16 = "(Теперь у меня серьёзные проблемы.)"
1300502-17 = ""
1300502-18 = ""
1300502-20 = "[ns] «Она мой студент. В чём проблема?»"
1300502-21 = "Хм? А вы кто?"
1300502-22 = "[s] «Я советник Шале.»"
1300502-23 = "Советник?"
1300502-24 = "Что ты здесь делаешь...?"
1300502-26 = "Я постарался выгородить Кайоко."
1300502-28 = ""
1300502-29 = "Хм... Здесь всё сходится. Значит, вы действительно работаете в Шале."
1300502-30 = ""
1300502-32 = ""
1300502-33 = ""
1300502-34 = "...Зачем ты мне помог?"
1300502-35 = "Я выглядела так, будто попала в беду? Ну, наверное, ситуация и правда была неприятная..."
1300502-36 = "Но я привыкла, что меня называют подозрительной. Не стоит из-за этого переживать."
1300502-37 = "Для меня полицейский допрос — почти обычный вторник..."
1300502-38 = "Наверное, первое впечатление от меня не самое лучшее. Я выгляжу довольно пугающе, поэтому постоянно попадаю в неприятности."
1300502-39 = "Что, хочешь узнать, что я на самом деле здесь делала?"
1300502-40 = "Жаль. Не твоё дело."
1300502-41 = "..."
1300502-42 = "*вздох* Ладно. Я кормила бездомную кошку. Правда, она убежала, как только появилась полиция."
1300502-43 = "Почему я сразу им этого не сказала?"
1300502-44 = "Потому что они бы решили, что я вру, очевидно."
1300502-45 = "Ты и сам, наверное, с трудом в это веришь."
1300502-46 = "Я похожа на девушку, которая ради удовольствия кормит бездомных кошек?"
1300502-47 = ""
1300502-48 = "Погоди... ты не считаешь это странным? Ох, эм... спасибо."
1300502-49 = "Похоже, я у тебя в долгу, даже если не хочу этого признавать."
1300502-50 = "Но я обязательно отплачу. Обещаю."
1300502-52 = "После этого я проводил Кайоко обратно в офис Решатели проблем 68."
