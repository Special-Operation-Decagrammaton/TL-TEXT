[translation]
84309100101-5 = ""
84309100101-6 = "Вы двое, похоже, довольно близки."
84309100101-7 = "О чём ты говоришь?"
84309100101-8 = "...Ни о чём."
84309100101-10 = "Эй, Рио, я тут подумала: если позже будет шанс, тебе стоит сходить с нами в эскейп-рум. Они очень похожи на наши задания."
84309100101-11 = "Здесь такое, может, и не прокатит, но где-нибудь ещё — наверняка. Например, в Тринити."
84309100101-13 = "Эскейп-рум? То есть игра? Хм."
84309100101-14 = "Я-я... У меня всё ещё нет права наслаждаться таким досугом..."
84309100101-15 = "Это «да» или «нет»?"
84309100101-16 = "..."
84309100101-17 = "...Когда закончу со всем, что должна здесь сделать, дам знать."
84309100101-18 = "Фуфу, хорошо. Обещание. И ты тоже, Нэру."
84309100101-19 = ""
84309100101-21 = ""
84309100101-22 = "...? Я тоже??"
84309100101-23 = "Да. ...Все втроём."
