[translation]
201070-1 = "Эпизод 7;Сопряжение"
201070-2 = "Перед входом в здание Генерального ученического совета"
201070-5 = "Закончив дела в Генеральном ученическом совете, я уже собирался возвращаться в Шале."
201070-6 = ""
201070-10 = "...Сенсей."
201070-11 = "Можно попросить немного вашего времени?"
201070-12 = "[s1] «О, Плана! Привет!»\n[s2] «Обычно ты не связываешься первой.»"
201070-15 = "Есть тема, которую я хотела бы с вами обсудить."
201070-16 = ""
201070-23 = ""
201070-24 = "Как вы оцениваете ту женщину, Сенсей?"
201070-25 = "[s] «Ты о президенте Генерального ученического совета?»"
201070-27 = "[ns] «Эм... Она не показалась мне плохой девушкой.»"
201070-28 = "Отрицательно. Ей нельзя доверять."
201070-29 = "Она подделка. Она не президент Генерального ученического совета."
201070-30 = "Истинная личность и намерения неизвестны. Рекомендация: соблюдать осторожность рядом с ней."
201070-31 = "[s3] «Значит, ты тоже считаешь её подделкой...»\n[s4] «Может ли быть, что мои воспоминания ошибочны?»"
201070-34 = "Отрицательно. Ваши воспоминания не ошибочны, Сенсей."
201070-35 = "Потому что настоящая президент Генерального ученического совета..."
201070-36 = ""
201070-38 = ""
201070-39 = "Ах, Плана! Ты узнала, где находится настоящая президент Генерального ученического совета?"
201070-40 = "Даже я, Супер-Арона, не смогла выяснить, где она, а ведь я ОС Ковчега Шиттим! Как тебе удалось?"
201070-41 = "И что ещё важнее — чего мы тогда ждём?"
201070-42 = ""
201070-44 = ""
201070-46 = "..."
201070-47 = "Отрицательно. Мне неизвестно местоположение настоящей."
201070-48 = "Однако я уверена, что эта — подделка."
201070-49 = "Прежде всего, она не узнала нас — ОС Ковчега Шиттим."
201070-50 = "Мы не просто артефакт. Ковчег Шиттим способен воздействовать на саму сущность Кивотоса."
201070-51 = "Так было в моём мире. Так происходит в каждом мире. Вывод: президент Генерального ученического совета Кивотоса не может не знать о Ковчеге Шиттим."
201070-52 = "И президент Генерального ученического совета не может быть президентом, если неспособна воспринимать Ковчег Шиттим таким, какой он есть. Никакая компетентность не способна преодолеть этот разрыв."
201070-53 = "Как тот Мимесис, который притворяется президентом."
201070-54 = "Как и в других случаях с Мимесисами, она разрушит порядок и принесёт Кивотосу хаос."
201070-55 = "[s] «Если это правда...»"
201070-56 = "Постой, Плана! Нельзя судить о человеке только по его способностям!"
201070-57 = "Арона...?"
201070-58 = "Может, она просто потеряла память из-за серьёзной аварии и поэтому ничего не помнит о Ковчеге Шиттим!"
201070-59 = "Нельзя делать столько выводов о человеке, даже не поговорив с ним лицом к лицу! Это невежливо!"
201070-60 = ""
201070-62 = ""
201070-63 = "...*вздох*"
201070-64 = "Что это был за тяжёлый вздох?!"
201070-65 = "...Как бы то ни было, она всё равно неправильно использует власть президента Генерального ученического совета."
201070-66 = "Ты уже знаешь, что происходит, когда неконтролируемая сила остаётся без присмотра, Арона."
201070-67 = "Угх, это правда, но..."
201070-68 = "[s] «Плана, ты что-нибудь знаешь о Посохе Шакеда?»"
201070-69 = "Отрицательно. Поскольку я тоже являюсь ОС, находящейся внутри Ковчега Шиттим, в моей базе нет информации о других устройствах, которыми распоряжается президент Генерального ученического совета."
201070-70 = "Даже в мире, откуда я пришла, Посох Шакеда не использовался вплоть до последних времён."
201070-71 = "...Но если Посох Шакеда — артефакт того же уровня, что и Ковчег Шиттим, как заявила бывшая глава Оборонного управления, тогда я могу частично получить доступ к его структуре."
201070-72 = "[s] «...Как?»"
201070-73 = "Серьёзно, как?"
201070-74 = "Процесс проверки личностей, авторизованных президентом Генерального ученического совета, и доступа к Башне Санктум выполняется по беспроводной связи."
201070-75 = "Поэтому два устройства, использующие один и тот же процесс, теоретически должны иметь возможность «сопрячься» друг с другом и синхронизировать данные."
201070-76 = "Это базовая функция Ковчега Шиттим..."
201070-77 = ""
201070-79 = ""
201070-80 = ""
201070-81 = "Я-Я знала! Просто за этот разговор произошло столько неожиданного, что я забыла!"
201070-82 = "С вашего разрешения, [USERNAME] Сенсей, я могу прямо сейчас запросить у Посоха Шакеда передачу уникальной идентификационной информации."
201070-83 = "Запрашиваю авторизацию."
201070-84 = "[s] Авторизовать."
201070-85 = ""
201070-91 = "..."
201070-94 = "..."
201070-97 = "..."
201070-101 = "[log]Сопряжение с [FF6666]Посохом Шакеда...[-][/log]"
201070-103 = "Попытка сопряжения..."
201070-104 = "Проверка ответа вспомогательной операционной системы S.Q.D."
201070-105 = ""
201070-108 = "..."
201070-111 = "..."
201070-114 = "..."
201070-120 = "...Как и ожидалось. Требование: дополнительная биометрическая аутентификация."
201070-121 = "Сенсей, могу я попросить вас обновить биометрические данные для аутентификации?"
201070-122 = "[s] «Под биометрическими данными... ты имеешь в виду что-то вроде отпечатков пальцев?»"
201070-123 = "Положительно. Похоже, для разблокировки новой операционной системы требуется повторная аутентификация."
201070-124 = "Формальность, но важная. Прошу содействия."
201070-125 = ""
201070-131 = "Немного ближе."
201070-132 = ""
201070-136 = "Пожалуйста, приложите палец к кончику моего пальца."
201070-137 = "Да, словно мы даём обещание."
201070-138 = ""
201070-145 = "..."
201070-146 = "[s] «...Что-то не так?»"
201070-147 = "...Отрицательно. Просто всплыло старое воспоминание. Вот и всё."
201070-148 = "Подтверждение получено. [USERNAME] Сенсей, пользователем операционной системы A.R.O.N.A. по-прежнему являетесь вы."
201070-149 = "Повторяю попытку сопряжения с обновлёнными биометрическими данными."
201070-150 = ""
