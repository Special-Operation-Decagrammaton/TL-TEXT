201070-157 = "[log]Загрузка системных данных[/log]"
201070-159 = "[log]из [FF6666]Посоха Шакеда[-]...[/log]"
201070-162 = "..."
201070-165 = "..."
201070-168 = "..."
201070-172 = "[log]...Сопряжение завершено.[/log]"
201070-174 = "[log]Авторизация доступа к вспомогательной операционной системе S.Q.D.[/log]"
201070-177 = "[log]Перезагрузка ОС[/log]"
201070-179 = "[log]для запуска новой системы...[/log]"
201070-185 = ""
201070-186 = "...А? Где мы?!"
201070-187 = "Почему всё чёрно-белое?!"
201070-188 = "Приношу извинения. Я временно оптимизировала среду, чтобы система нового устройства могла адаптироваться внутри Ковчега Шиттим."
201070-189 = "Проблема вызвана перегрузкой системы. После завершения процесса всё должно вернуться в норму."
201070-190 = "Ну и ну, в следующий раз предупреждай! Я уже подумала, что у меня зрительные конденсаторы накрылись!"
201070-191 = "Принято."
201070-192 = "[s5] «Постой. Если тебе удалось с ним соединиться...»\n[s6] «Разве это не значит, что Посох Шакеда действительно был артефактом Президента?»"
201070-195 = "Положительно. Похоже, умные часы, которые забрала бывшая глава Оборонного управления, были настоящими."
201070-196 = "Дополнение: её одержимость сверхчеловеком, и особенно президентом Генерального ученического совета, нельзя игнорировать."
201070-197 = "Угх... Ты уверена, что всё вернётся в норму?"
201070-198 = "Моё клубничное молоко... и пудинг... Они же теперь будут совсем не такими на вкус."
201070-199 = ""
201070-203 = ""
201070-204 = "А? Эта коробка в углу новая."
201070-205 = "Плана, здесь находятся новые данные с Посоха Шакеда?"
201070-206 = "Положительно. Это новые данные из S.Q.D., которых ещё нет в Ковчеге Шиттим."
201070-207 = "Так, посмотрим..."
201070-208 = "В основном это фиктивные данные, используемые системой накопителя."
201070-209 = ""
201070-211 = ""
201070-212 = ""
201070-213 = "...Подтверждено. Вот здесь находится основной файл системы S.Q.D."
201070-214 = "Он похож на маленький фрукт."
201070-215 = "Но без цветов мы не можем понять, что это за фрукт!"
201070-216 = "Плана, нельзя ненадолго отключить режим оптимизации?"
201070-217 = "Да. В текущей среде анализ будет затруднён."
201070-218 = "Временно отключаю режим оптимизации системы для анализа данных."
201070-219 = "Отключение режима оптимизации через 3... 2... 1..."
201070-220 = ""
201070-222 = ""
201070-226 = ""
201070-227 = "...?!"
201070-228 = "А-А?! Э-Это слишком много данных, я не успеваю всё обработать..."
201070-229 = "У меня... голова кружится..."
201070-230 = "[s] «Арона, Плана!»"
201070-231 = "Объём временных данных превысил предел обработки."
201070-232 = "Такими темпами память операционной системы переполнится..."
201070-233 = "Н-Необходимо выполнить принудительное завершение работы операционной системы..."
201070-235 = "[ns] «Принудительное отключение! Сейчас же!»"
201070-236 = ""
201070-240 = "Выполняю принудительное завершение работы основной операционной системы A.R.O.N.A."
201070-241 = "Обнаружены ошибки, связанные с переполнением, и сбои логических схем. Попытка перезагрузки из резервного файла."
201070-242 = "Перезагрузка ОС для повторного запуска системы..."
201070-243 = ""
201070-248 = "...*вздох*"
201070-249 = "...Мы успели."
201070-250 = "Ч-Что сейчас произошло, Плана?"
201070-251 = "Я потеряла бдительность."
201070-252 = "Наши вычислительные возможности улучшились благодаря Perez Uzzah. Однако Посох Шакеда — тоже операционная система, созданная для поддержки управления Башней Санктум."
201070-253 = "При нашей нынешней мощности невозможно одновременно запускать A.R.O.N.A. и анализировать ядро системы S.Q.D."
201070-254 = "Я не смогла ничем помочь. Прошу прощения, Сенсей."
201070-255 = "[s7] «Я просто рад, что вы обе в безопасности.»\n[s8] «Спасибо, что разобралась в этом, Плана.»"
201070-256 = ""
201070-257 = ""
201070-259 = ""
201070-261 = "Фуфу, я бы не сказала, что всё было бессмысленно."
201070-262 = "Потому что я, Супер-ИИ Арона, крепко-крепко держала ядро Шакеда, пока система перезагружалась!"
201070-263 = "Вот, смотрите!"
201070-264 = ""
201070-266 = ""
201070-267 = ""
201070-268 = "...Арона."
201070-269 = "То, что ты сейчас держишь, — обычный миндаль, в котором нет никаких данных."
201070-270 = "Э? Н-Но как...?!"
201070-271 = "Я же держала его изо всех сил! Когда он успел ускользнуть?"
201070-272 = "Похоже, данные сопряжения были потеряны во время перезагрузки ОС."
201070-273 = "Бу-у..."
201070-274 = "...Нам следует подробнее исследовать Посох Шакеда позже."
201070-275 = "Но важнее другое, Сенсей. Кажется, за вами кто-то следит."
201070-276 = ""
201070-284 = "...Вы заметили."
201070-285 = "Хотя я вовсе не собиралась, чтобы меня заметили."
201070-286 = "[ns9] «Разве этот голос не...»\n[ns10] «...Ринни?»"
201070-287 = ""
201070-288 = ""
201070-291 = ""
201070-292 = "...Не называйте меня Ринни."
