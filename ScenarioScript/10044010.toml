[translation]
10044010-1 = "Эпизод 1;Обычная миссия"
10044010-2 = "[log]Несколько часов назад...[/log]"
10044010-5 = ""
10044010-6 = "...поэтому мы вас и вызвали."
10044010-7 = "А, значит обычный грузовой рейс."
10044010-8 = "Как всегда. Скука."
10044010-9 = "Погоди... Ты вообще слушала? Я только что сказала, эта миссия крайне важна."
10044010-10 = "Да, но ведь ничего НЕ СЛУЧИТСЯ, верно? Поезд грузит штуку, поезд везёт штуку."
10044010-11 = "Туда и обратно. Готово."
10044010-12 = "*вздох* И только вы двое сейчас свободны. Какой кошмар..."
10044010-13 = "Просто проследите, чтобы всё добралось без проблем. Я назначу вам инженера."
10044010-14 = "Всё, о чём я прошу, — доставить груз к месту назначения вовремя."
10044010-15 = "Да-да. Поняли."
10044010-16 = "Груз к месту назначения вовремя. Проще простого."
10044010-17 = "Вам правда нужно относиться к этому серьёзнее..."
10044010-18 = ""
10044010-20 = ""
10044010-21 = "А, хватит уже ворчать."
10044010-22 = "Ага, пошли."
10044010-23 = ""
10044010-25 = ""
10044010-26 = ""
10044010-28 = ""
10044010-29 = "Ха-ха... И ты правда уверена в этих двоих?"
10044010-30 = "*вздох* Да, они позорные, но в их навыках сомневаться не приходится."
10044010-31 = "В них действительно есть какая-то... бесстрашность. Возможно, именно это важнее всего на этом... конкретном рейсе."
10044010-32 = "Одно могу сказать точно: они доставят груз вовремя и целым."
10044010-33 = "Так и должно быть. Так и обязано быть. Ха-ха..."
10044010-36 = "Станция отправления грузовых поездов"
10044010-40 = ""
10044010-41 = "Это тот поезд, на котором мы поедем? Выглядит совершенно обычно."
10044010-42 = "Надо наклеить на него огромную наклейку «ВАЖНЫЙ ГРУЗ!»"
10044010-43 = "Пахяхя! Ага, тогда за нами ВСЕ побегут!"
10044010-44 = "Звучит весело. В следующий раз так и сделаем."
10044010-45 = ""
10044010-47 = ""
10044010-48 = "Э-Эм..."
10044010-49 = ""
10044010-51 = ""
10044010-52 = "З-Здравствуйте... Вы же офицеры CCC, да...?"
10044010-53 = "Ага. И что?"
10044010-54 = "Ты кто?"
10044010-55 = "А... точно. Хи-хи..."
10044010-56 = "Я-я Уцуми Аоба..."
10044010-57 = "Меня прислало Бюро. Я буду вашим инженером."
10044010-58 = "А, точно, они говорили, что кого-то пришлют."
10044010-59 = "Новенькая, значит?"
10044010-60 = "Что ж, рады видеть. Если что-то сломается, МЫ всё равно это не починим. Пахяхя!"
10044010-61 = "Д-Да...(п-потому что вы две просто избалованные мелкие богачки, которые умеют только водить)..."
10044010-62 = ""
10044010-64 = ""
10044010-65 = "Хм? Что ты сказала?"
10044010-66 = "Я-я займусь любыми поломками и неполадками в работе!"
10044010-67 = "Нет, кажется, ты сказала что-то другое..."
10044010-68 = "Не переживайте. Вы просто ведите поезд, а остальным займусь я."
10044010-70 = "А, ладно. Значит, всё остальное на тебе."
10044010-71 = "Я Тачибана Хикари. А это Тачибана Нозоми."
10044010-73 = "Д-Да... Надеюсь, мы хорошо сработаемся..."
10044010-74 = "Я рада возможности... увидеть лица этих двух серебряных ложек с задирающими носы рожами, которые раздают свои тупые приказы..."
10044010-75 = "Ты ведь понимаешь, что мы тебя слышим?"
10044010-76 = "Я-я просто пошутила... Хи-хи..."
10044010-77 = "Не-а, назад уже не отыграть."
10044010-79 = "Это был переход на личности. А теперь мы перейдём в атаку!"
10044010-81 = ""
10044010-83 = ""
10044010-84 = ""
10044010-85 = ""
10044010-86 = ""
10044010-88 = "О да. Мстииительный ШЛЁП!"
10044010-89 = ""
10044010-92 = "А-Ай... Это..."
10044010-93 = ""
10044010-95 = ""
10044010-96 = "...вообще не больно. П-Почему вы такие слабые...?"
10044010-97 = "Бу. Хикари голодная. Сил нет."
10044010-99 = "До отправления ещё есть время, можем зайти в служебное помещение станции."
10044010-100 = "Можно заказать туда пиццу."
10044010-101 = "О-о, с пепперони."
10044010-102 = "Пахяхя! Отлично! Пицца — самое то для такого рейса!"
10044010-103 = "П-Погодите. Если вы просто ворвётесь в служебное помещение..."
10044010-104 = "Хм? Что-то случилось?"
10044010-105 = "Н-Ну, вы офицеры. Персонал может напрячься, вот и всё."
10044010-106 = ""
10044010-108 = ""
10044010-109 = "Им не о чем волноваться. Мы просто немного там отдохнём."
10044010-110 = "Я-я в смысле, им может быть неуютно находиться с вами в одной комнате."
10044010-111 = "Неуютно? Не-а, нам очень уютно."
10044010-112 = "Ага, персонал мне не мешает, так в чём их проблема?"
10044010-113 = "Ну, вы офицеры, а они нет..."
10044010-114 = "Эх, да какая разница. Пойдём уже ноги вытянем!"
10044010-115 = ""
10044010-117 = ""
10044010-118 = "..."
10044010-119 = "*вздох* Офицеры. Всегда одно и то же..."
10044010-121 = ""
10044010-122 = "Система с самого утра ведёт себя странно."
10044010-123 = "Вот как?"
10044010-124 = "Система автоматического отправления всё время посылает сигналы на платформу, когда не должна."
10044010-125 = "Хм... Ну, это не такая уж большая проблема, пока в кабине машиниста кто-то есть."
10044010-126 = "Это правда, но меня всё равно беспокоит."
10044010-127 = "Оставь. Мы всё равно ничего не можем сделать."
10044010-128 = "Цк, ладно."
10044010-129 = ""
10044010-133 = ""
10044010-135 = "У-у-у-ух!"
10044010-136 = "В-Вы кто...? Сюда только персоналу..."
10044010-137 = "Привет! Мы из CCC!"
10044010-138 = ""
10044010-140 = ""
10044010-141 = "А-А! Что привело сюда наших офицеров...?"
10044010-142 = "Э-Это внезапная проверка?"
10044010-144 = "Ха, нет, не волнуйтесь. Мы просто отдыхаем тут перед отправлением нашего поезда."
10044010-145 = "Пахяхя, диван мой!"
10044010-146 = "Гиперпрыжок!"
10044010-147 = ""
10044010-149 = ""
10044010-151 = "...Ладно... Конечно..."
10044010-152 = ""
10044010-154 = ""
10044010-155 = "П-Простите... Они довольно напористые..."
10044010-156 = "Хаха... Ну, эм, вы застали нас немного неготовыми к гостям, но... располагайтесь!"
10044010-157 = "Д-Да... Простите за беспокойство, спасибо..."
10044010-158 = ""
10044010-160 = ""
10044010-161 = ""
10044010-162 = "Кто бы мог подумать, что офицеры вот так внезапно влетят?"
10044010-163 = "Ух, теперь воздух прямо давит..."
10044010-164 = "Я вообще НИЧЕГО не сделал, а уже чувствую себя виноватым..."
10044010-165 = "*вздох* Похоже, денёк будет тот ещё..."
10044010-166 = "Могло быть хуже. Мог бы оказаться на станции, где сегодня Кронос берёт интервью."
10044010-167 = "А... Вся эта уборка, наведение порядка и репетиции наверняка для них кошмар."
10044010-168 = "Вот-вот. Давайте просто работать и выжмем из этого дня максимум."
10044010-170 = "10 минут спустя..."
10044010-178 = ""
10044010-179 = "Ура, пицца приехала!"
10044010-180 = "Уже? Быстро! Пахяхя!"
10044010-182 = "Они ещё и пиццу заказали...?"
10044010-183 = ""
10044010-185 = ""
10044010-187 = ""
10044010-188 = "Доставка!"
10044010-189 = "Сюда!"
10044010-190 = "Большая пицца с пепперони и газировка, верно?"
10044010-191 = "Вот!"
10044010-192 = "Ого, она ещё парит, вы так быстро её привезли..."
10044010-193 = "..."
10044010-194 = "Стоп."
10044010-195 = "А?"
10044010-196 = "Посмотри на это! Почему пицца выглядит ВОТ ТАК?"
10044010-197 = ""
10044010-199 = ""
10044010-201 = "И как нам это есть?"
10044010-202 = "Выглядит как куча пассажиров после резкого поворота. Полный бардак."
10044010-203 = ""
10044010-206 = ""
10044010-207 = "Ну, она всё ещё съедобная. Можете разложить обратно, если хотите."
10044010-208 = "А-а-а?"
10044010-209 = "Вы должны меня благодарить, что я так быстро её привезла."
10044010-210 = "В доставке ведь главное скорость, да?"
10044010-211 = "Это что за шутка...? Я подаю жалобу. Хикари, звони в их главный офис."
10044010-212 = "О-о-о. Бесконечная музыка ожидания, мы идём."
10044010-213 = "Да просто ЕШЬТЕ её!! Я доставила её молниеносно!"
10044010-214 = ""
10044010-216 = ""
10044010-217 = ""
10044010-218 = ""
10044010-225 = "С какой скоростью ты ехала, чтобы она стала такой? Ты что, с кем-то на дороге воевала?!"
10044010-226 = "Теперь в офисе полный разгром..."
10044010-228 = "Ладно, хотите играть так? Я тоже могу кое-кому позвонить! Как вам понравится больше никогда не выезжать на дорогу?"
10044010-229 = "Ага, мы на поездах ездим. Дороги нам не нужны, тупица!"
10044010-230 = "Ну погоди у меня, мелкие засранки из Хайлендер!"
10044010-231 = "Я вообще-то из гоночной ассоциации Vroom Vroom! Ха, испугались теперь? Вы ещё заплатите мне за это!!"
10044010-232 = ""
10044010-234 = ""
10044010-235 = ""
10044010-236 = "Я... НЕ МОГУ поверить, что это только что произошло."
10044010-238 = "Голод 100%... 500 миллионов урона в секунду..."
10044010-239 = "Потерпи ещё немного. Они сказали, что пришлют другого доставщика."
10044010-241 = "З-Значит, вам всё-таки вернули деньги... Наверное, вы привыкли всегда добиваться своего."
10044010-242 = "Хотя злить байкерскую банду, возможно, было не лучшей идеей..."
10044010-243 = "Эх. Байкеры по рельсам не ездят. Всё будет нормально."
10044010-244 = "Я не о вас двоих переживаю. Я о себе переживаю."
10044010-245 = "*ворчит* Переживать о вас двоих — пустая трата времени..."
10044010-246 = "Хикари, шлёпни её!"
10044010-248 = "Бу... Слишком голодная. Нет сил на месть..."
10044010-253 = "Некоторое время спустя..."
10044010-255 = ""
10044010-256 = ""
10044010-257 = ""
10044010-258 = "*зевает* Хорошо поспала."
10044010-259 = "Уже почти время отправления. Пойдём?"
10044010-261 = "А, вы уходите?"
10044010-262 = "Поели, поспали... Вы и правда тут как дома устроились..."
10044010-263 = "Удачи вам со всей этой работой!"
10044010-264 = "Адиос."
10044010-265 = ""
10044010-267 = ""
10044010-269 = "П-Простите за всё это...!"
10044010-270 = ""
10044010-272 = ""
10044010-274 = "Ага..."
10044010-275 = ""
10044010-277 = ""
10044010-279 = "А, они наконец ушли."
10044010-280 = "Да... Нервы меня совсем доконали. Фух."
10044010-284 = ""
10044010-285 = "Н-Не зря же существует целая процедура проверки."
10044010-286 = "Да говорю тебе, всё нормально..."
10044010-287 = ""
10044010-289 = ""
10044010-290 = "А?"
10044010-291 = "Хм? Почему ты...?"
10044010-292 = "Куда делся наш поезд?"
10044010-293 = "Что ты имеешь в виду?"
10044010-294 = "Он раньше был здесь. Куда делся?"
10044010-295 = "Что?!"
10044010-296 = "...Его не-е-ет."
10044010-297 = "О-Офицеры... Нельзя так шутить."
10044010-298 = "Мы не шутим."
10044010-299 = "Серьёзно, куда он делся?"
10044010-300 = "..."
10044010-301 = ""
10044010-303 = ""
