[translation]
90102110-1 = "Эпизод 11;Бенто в поезде"
90102110-2 = "(Примерно через неделю после того, как дело было раскрыто...)"
90102110-3 = "(Возвращаясь с обхода, сел в поезд)"
90102110-4 = ""
90102110-7 = ""
90102110-8 = "Уважаемые пассажиры, с этого момента мы начинаем проверку билетов в вагоне."
90102110-9 = "Пожалуйста, займите указанные места и приготовьте свои билеты."
90102110-12 = ""
90102110-13 = "Уважаемый пассажир, предъявите, пожалуйста, ваш билет."
90102110-14 = "[s] «А, подожди немного?»"
90102110-15 = "Не думаю, что это так, но...#nесли у вас нет билета, а вы тянете время―"
90102110-16 = "[s1] «Н-нет!»\n[s2] «В этот раз у меня он точно есть!»"
90102110-19 = "Вот как."
90102110-20 = "Я тоже рада, что не придётся утруждать себя выбрасыванием безбилетников из поезда."
90102110-21 = ""
90102110-23 = ""
90102110-24 = "Да. Подтверждаю―"
90102110-25 = "...А? Этот билет... странный."
90102110-26 = "[s] «Есть какая-то проблема?»"
90102110-27 = "Взгляните. Этот билет не до центрального района Р.У., а до Геенны."
90102110-28 = "Похоже, билет выдали по ошибке, или вы сели не на тот поезд."
90102110-29 = "[s3] «Т-так...»\n[s4] «И что мне теперь делать?..»"
90102110-32 = "Если у вас нет правильного билета, то вы не пассажир.#nНемедленно покиньте поезд."
90102110-33 = "Я открою аварийную дверь, не могли бы вы быстро выйти?"
90102110-34 = "[s5] «Мы же едем!?»\n[s6] «Это же слишком опасно!?»"
90102110-37 = "Если вы не хотите подчиниться, ничего не поделаешь."
90102110-38 = "Придётся лично помочь вам выйти..."
90102110-39 = "[s] «П-пожалуйста, помягче―!»"
90102110-40 = "Эм..."
90102110-41 = ""
90102110-43 = ""
90102110-44 = ""
90102110-46 = "Вы обронили билет?"
90102110-47 = "[s] «Мияко?..»"
90102110-48 = ""
90102110-50 = ""
90102110-51 = "Тсс..."
90102110-52 = "Сейчас просто подыграйте мне."
90102110-53 = ""
90102110-55 = ""
90102110-56 = "Подтверждаю. Действительно, билет до центрального района на сегодня.#nОднако―"
90102110-57 = "Похоже, вы ошиблись местом.#nУказано место рядом с этим студентом, поэтому немедленно пересядьте."
90102110-58 = "[s] «П-понял!»"
90102110-59 = "Итак, счастливого пути."
90102110-60 = ""
90102110-62 = ""
90102110-64 = "Хе-хе, всё обошлось в последний момент, Сенсей."
90102110-65 = "Вас чуть не вышвырнули, знаете ли?"
90102110-66 = "[s7] «Большое спасибо.»\n[s8] «Благодаря тебе мне удалось спастись...!»"
90102110-69 = "Не стоит беспокоиться."
90102110-70 = "Сенсей столько для нас делает, это же мелочь."
90102110-71 = "Наоборот, я рада, что смогла помочь."
90102110-72 = "[s] «И всё-таки, откуда у тебя этот билет?»"
90102110-73 = "У члена отряда, который должен был поехать со мной, появились срочные дела, и билет остался лишним."
90102110-74 = "Билет, который с таким трудом достали, чуть не пропал зря."
90102110-75 = "То, что его удалось так использовать, — счастливая случайность."
90102110-76 = "[s] «Когда вернусь в Шале, сразу переведу деньги за билет.»"
90102110-77 = "А, нет! Всё в порядке."
90102110-78 = "Сенсей и так делает для нас много хорошего.#nК тому же это всё равно был билет, которому не нашлось применения."
90102110-79 = "Пожалуйста, не беспокойтесь――"
90102110-80 = ""
90102110-82 = ""
90102110-83 = ""
90102110-84 = "...Прошу прощения."
90102110-85 = "Я торопилась к самому отправлению... и осталась без обеда."
90102110-86 = "[s9] «Будешь? Экибэн.»\n[s10] «Купил только что, но что-то желудок не в порядке.»"
90102110-89 = "Если вы не будете... я с благодарностью возьму."
90102110-90 = ""
90102110-91 = ""
90102110-92 = ""
90102110-93 = "Впервые ем бэнто в поезде."
90102110-94 = "Это само по себе интересный опыт."
90102110-95 = "Ах, эти шиу-май с гребешком — с каждым укусом раскрывается вкус... очень вкусно."
90102110-96 = "[s11] «Хорошо, что тебе понравилось.»\n[s12] «Может, в следующий раз купить и для всех?»"
90102110-99 = "Не стоит до такой степени..."
90102110-100 = "...[ruby=私たち]SRT[/ruby] постоянно полагаемся на помощь Сенсея."
90102110-101 = "[s] «Вовсе нет, мы помогаем друг другу.»"
90102110-102 = ""
90102110-105 = "[ns] «И в этой операции нам помог отряд FOX.»"
90102110-106 = "Кстати, похоже, операция, о которой говорила Юкино-сэмпай, завершилась успешно."
90102110-107 = "«Подруга детства благополучно вернулась» — от моей подруги пришло сообщение с благодарностью."
90102110-108 = "...Нет, вообще-то отряд FOX не мог провалить операцию.#nПохоже, я зря волновалась."
90102110-109 = "[s] «Отряд FOX ни разу не терпел неудачу?»"
90102110-110 = "Если не считать сопутствующего ущерба частью определения неудачи,#nнасколько я знаю, они ни разу не упустили цель операции."
90102110-111 = "И когда уничтожили семью Риволита, распространявшую нелегальное оружие на чёрном рынке, и когда арестовали Семь заключёных во главе с Вакамо..."
90102110-112 = "Отряд FOX всегда был безупречен."
90102110-113 = "Но раз вы так говорите―вас что-то беспокоит в их операциях?"
90102110-114 = "[s13] «Скорее не отряд FOX, а Юкино.»\n[s14] «Кажется, её беспокоит прошлое.»"
90102110-117 = "Юкино...?"
90102110-118 = "Она всегда держалась стойко перед нами... так что мне немного любопытно."
90102110-119 = "[s15] «Иногда казалось, что она сожалеет о выборе в прошлом.»\n[s16] «Вот и подумал, не случилось ли чего в прошлых операциях.»"
90102110-122 = "..."
90102110-123 = "Возможно... речь о [ruby=・   ・   ・   ・]том происшествии[/ruby]."
90102110-124 = "[s] «Том происшествии?»"
90102110-125 = "Помните закрытый парк развлечений «Утопия»?#nЭто место, где мы вместе проводили операцию во время вторжения Цвета."
90102110-126 = "После закрытия его стали называть «Слампия»,#nи он стал местом действия множества страшилок."
90102110-127 = "Считается, что «Утопия» закрылась из-за финансовых трудностей,#nно есть малоизвестный факт."
90102110-128 = "В начале «Утопия» была любима многими горожанами.#nГоворят, финансовое положение тоже было вовсе не плохим."
90102110-129 = "Но... из-за одного-единственного решения#nона превратилась в проклятое место, которого все избегают."
90102110-130 = ""
90102110-132 = ""
90102110-134 = "Человек, вытащивший в реальность пространство мечты и фантазий, любимое всеми―"
90102110-135 = "это Юкино."
90102110-137 = "Преследование аномалий;Продолжение следует в главе 4"
