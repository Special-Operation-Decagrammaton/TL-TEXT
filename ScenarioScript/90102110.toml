[translation]
90102110-1 = "Episode 11;Ekiben"
90102110-2 = "(Around a week after the incident was resolved...)"
90102110-3 = "(I boarded a train on my way back from field work.)"
90102110-8 = "Attention passengers, we will now begin ticket inspection."
90102110-9 = "Please be seated in your reserved seats and have your tickets ready."
90102110-13 = "Excuse me, may I see your ticket?"
90102110-14 = "[s] \"Ah, hold on a second?\""
90102110-15 = "Surely not...#nIf you don't have a ticket and are just trying to buy time――"
90102110-16 = "[s1] \"W-Wait, no!\"\n[s2] \"I actually have it this time!\""
90102110-19 = "Is that so?"
90102110-20 = "Personally, I'd be glad to save myself the trouble of tossing a freeloading fare-dodger off the moving train."
90102110-24 = "Yes. Ticket confirmed—"
90102110-25 = "…Huh? This ticket… Is strange."
90102110-26 = "[s] \"Is there a problem?\""
90102110-27 = "Take a look. This ticket is for Gehenna, not D.U. Central District."
90102110-28 = "It seems it was issued in error, or you boarded the wrong train."
90102110-29 = "[s3] \"N-No way…\"\n[s4] \"Then what am I supposed to do…?!\""
90102110-32 = "If you do not possess a valid ticket, you are not a passenger.#nYou will be required to leave the train immediately."
90102110-33 = "I will be opening the emergency door, so could you please step off promptly?"
90102110-34 = "[s5] \"We're moving right now, you know!?!?\"\n[s6] \"Isn't that way too dangerous?!\""
90102110-37 = "If you refuse to cooperate, I have no choice."
90102110-38 = "I suppose I'll have to assist you off myself..."
90102110-39 = "[s] \"P-Please go easy on me――!\""
90102110-40 = "Excuse me..."
90102110-46 = "You dropped your ticket, you know?"
90102110-47 = "[s] \"Miyako...?\""
90102110-51 = "Shh..."
90102110-52 = "Just play along with me for now."
90102110-56 = "Confirmed. Indeed, this is today's valid ticket to the Central District.#nHowever――"
90102110-57 = "It appears you are in the wrong seat.#nYour designated seat is right next to this student here, so please move immediately."
90102110-58 = "[s] \"O-Okay!\""
90102110-59 = "Well then, have a pleasant trip."
90102110-64 = "Phew, that was a close one, Sensei."
90102110-65 = "You almost got thrown out, you know?"
90102110-66 = "[s7] \"Thank you so much.\"\n[s8] \"You really saved my skin...!\""
90102110-69 = "Think nothing of it."
90102110-70 = "Sensei has taken good care of us, so this is nothing."
90102110-71 = "If anything, I'm just glad I could be of help."
90102110-72 = "[s] \"Even so, how did you end up with that ticket?\""
90102110-73 = "One of the squad members who was supposed to accompany me had an emergency come up, so it was extra."
90102110-74 = "It would have been a waste for the ticket we secured to go unused."
90102110-75 = "It's a blessing in disguise that we could put it to use like this."
90102110-76 = "[s] \"Once we get back to Schale, I'll send you the fare right away.\""
90102110-77 = "Ah, no! It's fine."
90102110-78 = "You've already been so good to us, Sensei.#nBesides, it was a ticket with no use for it anyway."
90102110-79 = "Please don't worry about it—"
90102110-84 = "…Pardon me."
90102110-85 = "I was rushing because I was cutting it close to departure time... and I missed lunch."
90102110-86 = "[s9] \"Want some? Station bento.\"\n[s10] \"I bought it earlier, but my stomach's acting up.\""
90102110-89 = "If you aren't going to eat it... I will gratefully accept."
90102110-93 = "This is my first time eating a boxed lunch on a train."
90102110-94 = "This is a nice experience in its own right."
90102110-95 = "Ah, this scallop shumai bursts with flavor with every bite... It's delicious."
90102110-96 = "[s11] \"I'm glad it suits your taste.\"\n[s12] \"Should I buy some for everyone next time?\""
90102110-99 = "You really don't have to go that far..."
90102110-100 = "…SRT is always relying on Sensei to bail us out."
90102110-101 = "[s] \"That's not true, we help each other out.\""
90102110-105 = "[ns] \"After all, even this latest operation was thanks to the FOX Platoon.\""
90102110-106 = "Speaking of which, it seems the operation Yukino-senpai mentioned earlier concluded safely."
90102110-107 = "A friend of mine contacted me to thank me, saying, \"My childhood friend came back safely.\""
90102110-108 = "…No, of course the seniors wouldn't fail an operation in the first place.#nIt seems I was worrying needlessly."
90102110-109 = "[s] \"Has the FOX Platoon really never failed once?\""
90102110-110 = "If we exclude collateral damage from the definition of failure,#nAs far as I know, they have never once failed to secure their operational objectives."
90102110-111 = "Whether it was annihilating the Rivolta Family for distributing illegal weapons in the Black Market, or arresting the Seven Prisoners including Wakamo..."
90102110-112 = "The FOX Platoon was always flawless."
90102110-113 = "However, the fact that you say that—is there something bothering you about the seniors' operation?"
90102110-114 = "[s13] \"Rather than the FOX Platoon, I mean Yukino.\"\n[s14] \"She looked like she was brooding over the past.\""
90102110-117 = "Yukino-senpai...?"
90102110-118 = "She always puts on a brave face in front of us... so that's a bit concerning."
90102110-119 = "[s15] \"At times, she looked like she regretted past choices.\"\n[s16] \"So I wondered if something happened during an old operation.\""
90102110-122 = "…"
90102110-123 = "It's possible... she might be referring to that incident."
90102110-124 = "[s] \"That incident?\""
90102110-125 = "Do you remember an abandoned amusement park called \"Utopia\"?#nIt's a place where we previously conducted an operation alongside you during the Chroma invasion."
90102110-126 = "After closing down, it came to be known as \"Thrampia\"#n and has been talked about as the setting for numerous ghost stories."
90102110-127 = "Utopia is said to have closed due to financial difficulties, but#nactually, there is a little-known fact about it."
90102110-128 = "When Utopia first opened, it was beloved by many citizens.#nIts financial state wasn't bad at all, so they say."
90102110-129 = "However... due to a single decision,#nIt transformed into a cursed place that everyone avoids."
90102110-134 = "The person who dragged that space of dreams and illusions—beloved by all—into reality..."
90102110-135 = "...is Yukino-senpai."
90102110-137 = "Roa Tracking Arc;To be Continued in Chapter 4"
