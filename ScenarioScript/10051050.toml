[translation]
10051050-1 = "Эпизод 5;Другая сторона ниндзя"
10051050-2 = "Сад скульптур у места проведения модного показа"
10051050-3 = "Нет... Показ окончен...! Всё разрушено!"
10051050-4 = "Ну... Мы вернули ваше платье. По-моему, с ним всё в порядке."
10051050-5 = "Да, вернули. И я искренне..."
10051050-7 = "...совершенно НЕ благодарен за ваши усилия!"
10051050-8 = "Ик!"
10051050-9 = "Смотрите! Смотрите, если ваши глаза вообще работают! Моя муза, моя главная модель, та, для кого я создавал это платье, лежит кучей на земле!"
10051050-10 = "И всё из-за вашей «битвы»! Из-за вашей неосторожности!"
10051050-11 = ""
10051050-13 = ""
10051050-14 = ""
10051050-15 = "Погодите, вы серьёзно вините в этом нас?"
10051050-16 = "Эм... То есть человек, который лежит здесь на земле, это..."
10051050-17 = "...звёздная модель сегодняшнего показа?!"
10051050-18 = "Тогда что она вообще делает здесь?"
10051050-19 = "[s] «Может, попала под перекрёстный огонь...?»"
10051050-20 = "А? Но здесь были только мы и банда Шлемников. Почему она...?"
10051050-21 = "Президент, посмотрите! Она лежит без сознания, протянув руки к чехлу с платьем."
10051050-22 = "Наверняка она побежала за платьем прямо перед тем, как её задело!"
10051050-23 = "Изуна уверена, что она пострадала, отважно пытаясь вернуть платье! Нин-нин!"
10051050-24 = "Вот оно что...!"
10051050-25 = "О-Очень логично..."
10051050-26 = "Образцово! Ты рассуждаешь как настоящий ниндзя, Изуна!"
10051050-27 = "Хватит уже нахваливать друг друга! И вообще, что это ваше «ниндзя» значит?"
10051050-28 = "Неважно... А теперь! Вставай, прекрасная лентяйка! Проснись! Ты должна подняться и пройтись ради меня! Ради НАС!"
10051050-29 = "Эм, пожалуйста, отойдите, мистер Шайнкэт. В ближайшее время она выступать не сможет."
10051050-30 = "Что?!"
10051050-31 = "Сотрясение. Видите ожоги на затылке и нижней челюсти? Мой диагноз: прямое попадание гранаты."
10051050-32 = "Даже если вколоть адреналин и дать понюхать нашатырь, ей понадобится несколько часов, чтобы нормально двигаться."
10051050-33 = "О небеса...!"
10051050-34 = ""
10051050-36 = ""
10051050-37 = "То есть даже если мы её разбудим, она не сможет пройтись ради меня? Ради НАС?"
10051050-38 = "Сэр, вы хотите, чтобы пациентка участвовала в показе?"
10051050-39 = "Так она сможет ходить или нет? Говорите прямо."
10051050-40 = "...Её будет сильно трясти. И я не рекомендую на неё давить — ни буквально, ни фигурально."
10051050-41 = "После такого удара её главный приоритет — отдых и восстановление. Ради её здоровья."
10051050-42 = "*вздох* Понимаю..."
10051050-43 = "Вы профессионалы. Позаботьтесь о ней. В конце концов, контракт ещё действует."
10051050-44 = "Разумеется. А теперь доставим её в больницу."
10051050-45 = ""
10051050-47 = ""
10051050-48 = "Но... А моё платье? Мой показ?! Ах..."
10051050-49 = "...Что ж, похоже, у меня нет выбора."
10051050-50 = "Вы трое."
10051050-51 = "Да?!"
10051050-52 = "Хмф, для начала прошу прощения за свою реакцию. Вы хорошо справились и вернули моё платье."
10051050-53 = "...Хотя справились бы ещё лучше, если бы взяли пару уроков стрельбы. Подумайте об этом."
10051050-54 = "А теперь до свидания."
10051050-55 = ""
10051050-57 = ""
10051050-59 = "Гримёрная модного показа"
10051050-60 = "*вздыхает*"
10051050-61 = "*вздыхаааааает*"
10051050-62 = "Что же мне делать... Как продолжать? Кто ещё сможет показать красоту моей работы?"
10051050-63 = "Эм, у нас здесь полно моделей. Может, кто-то из них заменит её?"
10051050-64 = "Хорошо сказано. Я вас слышу."
10051050-65 = "Но взгляните! Осмыслите! Что вы видите, когда смотрите на это платье? Что чувствуете?"
10051050-66 = "Эм... Оно довольно красивое...?"
10051050-67 = "Нет, посмотрите на размер! На размах! Посмотрите на эту большую прекрасную длину, на гордый силуэт!"
10051050-68 = "Я создавал его для башни среди женщин! Рост модели должен быть 5 футов 11 дюймов, ясно?"
10051050-69 = "Но есть ли здесь такая величественная, грандиозная, высокая женщина? Есть ли кто-то такого роста? СМОТРИТЕ!"
10051050-70 = "Н-Нет!"
10051050-71 = "Вот именно! Девушку ростом 5 футов 11 дюймов найти непросто! И в такой поздний час где мы вообще—"
10051050-72 = ""
10051050-74 = ""
10051050-75 = "...Стоп. Она У НАС есть. Прямо здесь."
10051050-76 = "Кто?"
10051050-77 = "Оно Цукуё."
10051050-78 = "Эм, а кто это?"
10051050-79 = "Ты тупица! Невежда! Она стояла прямо перед тобой! Та самая высокая охранница с ужасной осанкой и безграничным потенциалом!"
10051050-80 = "Ты даже имён собственных сотрудников не знаешь?"
10051050-81 = "Эм, она скорее подрядчик..."
10051050-82 = "Неважно! Мы должны её завербовать."
10051050-83 = "Что?! Вы хотите прямо сейчас заставить охранницу работать моделью?!"
10051050-84 = "Да. Я распознал её талант с первого взгляда. Дело не только в росте. И не только в пропорциях. Дело в ауре. В... НЕЙ."
10051050-85 = "Так что приведите её ко мне. Немедленно."
10051050-86 = "П-Правда?!"
10051050-87 = ""
10051050-89 = ""
10051050-91 = "Я похож на шутника? Хи-хи?!"
10051050-92 = "П-Поняла!"
10051050-93 = ""
10051050-95 = ""
10051050-97 = "Сад скульптур у места проведения модного показа"
10051050-98 = "Что?! В-Вы хотите, чтобы Я стала м-моделью?"
10051050-99 = "Да, у нас почти не осталось времени!"
10051050-100 = "Н-Н-Но я этому никогда не училась. Моделям нужны навыки и занятия! И осанка!"
10051050-101 = "Конечно! Но Шайнкэт велел привести именно тебя. Он хочет ТЕБЯ!"
10051050-102 = "У-Уааа...!"
10051050-103 = "Пожалуйста, всего один раз. Обещаю, вам хорошо заплатят!"
10051050-105 = "Эм-м... Н-Но всё же..."
10051050-106 = "Ты ведь видела гримёрную? Пожалуйста, просто иди туда. О тебе позаботятся, а я скоро подойду!"
10051050-107 = ""
10051050-109 = ""
10051050-111 = "Аааа... Президент, ч-что мне делать?"
10051050-112 = "Как я могу быть моделью? На таком большом показе...?"
10051050-113 = "Да и вообще, кому нужна девушка, которая такая о-огромная!"
10051050-114 = "Меня освистают и прогонят со сцены!"
10051050-115 = "А услышав это, я увяну и проведу остаток дней в постели, смотря работы Шиба Пса Ван-Вана...!"
10051050-116 = "Это неправда, Цукуё."
10051050-117 = ""
10051050-119 = ""
10051050-120 = "Цукуё, помнишь, что я сказала, когда мы впервые встретились?"
10051050-121 = "...Вы сказали, что я пугающе большая, да?"
10051050-122 = "Я-Я это сказала, но...!"
10051050-123 = "Но ещё я сказала, что именно поэтому ты — лучший ниндзя!"
10051050-124 = "...!"
10051050-125 = "Это высшее испытание для величайшего ниндзя!"
10051050-126 = "Президент...!"
10051050-127 = "Ты должна понять: ВЕЛИЧАЙШИЙ дизайнер заметил именно ТЕБЯ. Насладись этим."
10051050-128 = "Выпрямись и иди с гордостью, Цукуё!"
10051050-129 = "И даже если что-то случится и всё пойдёт не так, как ты хотела..."
10051050-130 = "Это всё вина организаторов! Вали всё на них! Как всегда говорит Сенсей."
10051050-131 = "[s1] «Когда это я...?!»\n[s2] «Это известная цитата?»"
10051050-134 = "Угх..."
10051050-135 = ""
10051050-137 = ""
10051050-138 = "...Как пожелаете. Я попробую!"
10051050-140 = "Гримёрная модного показа"
10051050-142 = "Хм? Кто это?"
10051050-143 = ""
10051050-147 = ""
10051050-148 = "Вот и она. Значит, решила быть... великолепной?"
10051050-149 = "...Да!"
10051050-150 = "Талант у тебя есть. Но легко не будет."
10051050-151 = "И всё же обещаю тебе вот что. Если будешь работать, желанная слава станет твоей!"
10051050-152 = "Но я ведь не говорила, что жажду «славы»?"
10051050-153 = "И всё же, что это на тебе? «Ниндзевское» одеяние? Фу."
10051050-154 = "Что бы это ни было, с эстетической точки зрения с этим покончено."
10051050-155 = "Забудь, кем была, и прими моё творение! Думаю, оно тебе подойдёт."
10051050-156 = "Вот, держи платье. Надевай. Примерочная вон там."
10051050-157 = "Эм..."
10051050-158 = "Что такое? Коротко, у нас мало времени."
10051050-159 = "Эм... Это ведь только чрезвычайная ниндзевская мера? Скоро всё закончится?"
10051050-160 = "...И потом я смогу вернуться в свой клуб?"
10051050-161 = "Хорошо. Я сейчас же переоденусь!"
10051050-162 = ""
10051050-164 = ""
10051050-165 = ""
10051050-166 = "Ах..."
10051050-168 = "...Небеса, помогите этой девушке."
10051050-170 = "Главная сцена модного показа"
10051050-172 = "*вздох* ...Показ вот-вот начнётся."
10051050-173 = "Изуна очень надеется, что Цукуё отлично выступит и всем понравится!"
10051050-174 = "Изуна в восторге!"
10051050-175 = "Стойте. Кажется, начинается!"
10051050-176 = ""
10051050-178 = ""
10051050-182 = ""
10051050-183 = ""
10051050-184 = ""
10051050-185 = ""
10051050-186 = ""
10051050-187 = ""
10051050-188 = ""
10051050-189 = ""
10051050-190 = ""
10051050-191 = "...Президент."
10051050-192 = "...Да?"
10051050-193 = "Что... мы только что увидели?"
10051050-194 = "Эм..."
10051050-196 = "...Искусство?"
