[translation]
10027080-117 = "Red Winter Federal Academy - City Streets"
10027080-1 = "Эпизод 8;Лицом к лицу"
10027080-2 = "После нескольких перипетий мы встретились с Момидзи."
10027080-3 = ""
10027080-7 = "Библиотека Фронта освобождения знаний"
10027080-8 = ""
10027080-9 = ""
10027080-10 = "Нет! Я не могу! Я не пойду! Сделаю это в другой раз!"
10027080-11 = "[s] «Ну же. Ты должна сдержать слово.»"
10027080-12 = "Нет. Вы меня обманули, Сенсей! Мне нужно ещё эмоционально подготовиться. Мне надо настроить себя на это. Иначе..."
10027080-13 = "[s] «Ну-ну. Будь хорошей, доброй девочкой, Мэру.»"
10027080-14 = "Я же говорила, что я не хорошая девочка! Я не пойду!"
10027080-15 = ""
10027080-19 = "[ns] «Мэру. Ты грубишь. Идём со мной.»"
10027080-24 = "Эй! Отпустите меня! Куда вы меня тащите?! А-а-а! Сенсей похищает студентов!"
10027080-25 = ""
10027080-34 = "Улица Красной Зимы"
10027080-35 = ""
10027080-36 = "..."
10027080-37 = "..."
10027080-38 = "[s] «Уже пять минут никто не сказал ни слова.»"
10027080-39 = "Извините..."
10027080-40 = ""
10027080-42 = ""
10027080-44 = "Мне жаль, Момидзи."
10027080-46 = "?!"
10027080-47 = "Я была... слишком резкой. Я думала, что «Луна» забавная."
10027080-48 = "Нет, это я должна извиниться. Я лучше всех знаю, как много ты работаешь."
10027080-49 = "Прости. Я слишком на тебя давила."
10027080-50 = "Знаешь... я могла бы заказать тебе ещё жареных блинчиков..."
10027080-51 = "Прости, что дублировала уже сделанные тобой заказы книг. Просто мне казалось, что как библиотекарь я обязана..."
10027080-52 = "..."
10027080-53 = "..."
10027080-54 = "Момидзи, мне нужно кое-что сказать."
10027080-55 = "Ничего, если ты не согласишься с тем, что я сейчас скажу. И если решишь, что я просто несу чушь, тоже нормально."
10027080-56 = "На самом деле мне, возможно, даже будет проще, если ты так подумаешь."
10027080-57 = "Эм... Хорошо..."
10027080-58 = "Когда я посетила съезд фанфиков по «Луне», я встретила огромное количество фанатов «Луны»."
10027080-59 = "Каждый хотел добавить в свою работу что-то своё. Они творили самые разные вещи."
10027080-60 = "Кто-то может подумать, что я занимаюсь глупостью, или спросить, зачем вообще стараться. Какой смысл делать собственную версию незаконченного произведения?"
10027080-61 = "Но чужое мнение неважно. Важно, что мы это любим."
10027080-62 = "В какой-то момент я об этом забыла."
10027080-63 = "..."
10027080-64 = "Я и представить не могла..."
10027080-65 = "Столько фанатов «Луны» до сих пор активно участвуют в движении фанфиков."
10027080-66 = "Будто я встретила тысячу Момидзи!"
10027080-67 = "Странно прозвучало. Как будто я считаю, что искусство заслуживает внимания только когда у него есть фанаты."
10027080-68 = "Любая история заслуживает внимания."
10027080-69 = "Как я могла забыть об этом?"
10027080-70 = "Я! Художница манги!"
10027080-71 = "Момидзи, ещё раз прости меня. Мне правда очень жаль."
10027080-73 = "..."
10027080-74 = "Ух ты, Мэру, у меня мурашки. Это так на тебя не похоже."
10027080-75 = "Кья! После всего, что я сказала от чистого сердца, вот так ты отвечаешь?!"
10027080-77 = "Ещё некоторое время они продолжали извиняться друг перед другом."
10027080-78 = ""
10027080-84 = ""
10027080-85 = "[ns1] «Ну, раз мы все помирились...»\n[ns2] «Что будешь делать с „Луной“?»"
10027080-88 = "Ну..."
10027080-89 = "Ага..."
10027080-90 = "Возможно, 22-й том «Луны» и не нужно заканчивать."
10027080-91 = "Мэру..."
10027080-92 = "[s] «Точно...»"
10027080-93 = "...Но я всё равно нарисую его, до самого конца!"
10027080-94 = "Мэру?"
10027080-95 = "В конце концов, творческая работа сама по себе должна быть наградой, верно?"
10027080-96 = "[s] «Желание дви—»"
10027080-97 = "Да. Желание движет творчеством, правда?"
10027080-98 = "Именно. А сейчас я просто хочу именно этого — творить."
10027080-99 = "Я хочу написать такой 22-й том «Луны», которым смогу гордиться."
10027080-100 = "И хочу подарить его своей лучшей подруге. Так что поможешь мне, Момидзи?"
10027080-101 = "Ну, немного необычно просить человека помочь сделать подарок для него же самого..."
10027080-102 = "Но ради тебя... с радостью."
10027080-103 = "[s] «Я тоже сделаю всё возможное, чтобы помочь!»"
10027080-105 = "Хорошо! Тогда возвращаемся к работе!"
10027080-106 = ""
10027080-108 = ""
10027080-112 = "В этот момент облака разошлись, и ярко засияло солнце."
10027080-113 = "Будто сама вселенная говорила нам, что мы сделали первый шаг по верному пути."
10027080-114 = "Я молился, чтобы их отношения в будущем стали ещё крепче."
10027080-115 = ""
10027080-119 = "Что, чёрт возьми, ты тут задумала?! Что теперь будет с Луной?!"
10027080-120 = "Это сюжетный поворот! Не волнуйся. Я всё тщательно продумала! Нам нужна кульминация, чтобы у истории была захватывающая концовка!"
10027080-121 = "Ты понимаешь, что до этой концовки у тебя осталось всего несколько страниц? Мэру, ты снова повторяешь те же ошибки с темпом повествования!"
10027080-122 = "А-а-а! Ладно! Значит, просто нарисую больше страниц! Фанаты всегда любят больше контента."
10027080-123 = "Но как насчёт времени?! Если только кто-то не свалится с неба и не поможет тебе, времени на это точно не хватит. Нужно делать то, что можешь, с оставшимися временем и ресурсами!"
10027080-124 = ""
10027080-126 = ""
10027080-129 = "[ns] «Почему мы снова ссоримся?!»"
10027080-131 = "О, простите, Сенсей. Всё нормально. Это обычная часть работы здесь, во Фронте освобождения знаний."
10027080-132 = "Не волнуйтесь. Мы просто... обмениваемся идеями, чтобы найти лучшее решение."
10027080-133 = "[s] «Не уверен, что верю в это...»"
10027080-134 = "Верите вы нам или нет, на этом этапе уже неважно. Вахахаха!"
10027080-135 = "Ну, я рада, что тебя всё это хотя бы веселит."
10027080-136 = "Но вернёмся к делу... Я не могу сдаться. Я готова на всё, лишь бы закончить историю так, как, по моему мнению, она должна закончиться."
10027080-137 = "Но тогда объём удвоится, а это значит, что мы сейчас закончили только треть!"
10027080-139 = "Мне нужен клон! Или чудо!"
10027080-140 = "У нас нет ни того, ни другого!"
10027080-141 = ""
10027080-144 = "[ns] «...»"
10027080-145 = ""
10027080-146 = "[ns] «Вы обе точно уверены, что способны работать вместе?»"
10027080-148 = ""
10027080-150 = "Библиотека Красной Зимы"
10027080-151 = ""
10027080-152 = ""
10027080-153 = "Ах... Как давно я не была в библиотеке."
10027080-154 = "Пожалуй, и правда давно, да?"
10027080-155 = "И всё же именно здесь я больше всего чувствую себя дома. Хахаха... Я буквально растекаюсь по этому креслу."
10027080-156 = "Что ты делаешь, Момидзи? У нас нет времени растекаться! С этого момента мы должны полностью сосредоточиться на рукописи!"
10027080-157 = "Ой, дай мне хотя бы немного предаться сентиментальности, ладно? Боже! Ты как всегда вспыльчива..."
10027080-159 = ""
10027080-161 = "Остался 1 день"
10027080-164 = "Положить материалы сюда?"
10027080-165 = "Да. Складывай туда. Хех... Я закончила разбирать весь сюжет «Луны»."
10027080-166 = "Ты выглядишь очень взвинченной, Мэру."
10027080-167 = "Ну, у этой истории невероятно богатая история и преданная фанатская база. Многое может пойти не так."
10027080-168 = "Да, кстати об этом. Не хочу показаться поверхностной, но—"
10027080-169 = "Мне бы очень не хотелось получить вялые отзывы вроде: «Её неопытность была заметна, но она старалась!»"
10027080-170 = "Мэру, мне нравится твоя мотивация, но, пожалуйста, не забывай о сроках."
10027080-171 = "Что это было...? Кажется, я услышала шёпот на холодном ветру..."
10027080-172 = "Не игнорируй меня! Если рукопись опоздает, страдать при печати буду я! Мне придётся умолять, чтобы нас пропустили вперёд очереди!"
10027080-173 = "Момидзи, я ни разу не пропустила дедлайн, если только сама этого не собиралась."
10027080-174 = "То есть ты специально доводишь меня до седины?"
10027080-175 = "Момидзи, я в потоке. Сейчас задействовано что-то большее, чем я сама. Будто через меня проходит какая-то древняя сила. Перо держу я, но рисую не я. Теперь остаётся только позволить этому случиться."
10027080-176 = "О нет. Так не пойдёт. Я не позволю тебе свалить опоздание на «вселенную»."
10027080-178 = ""
10027080-200 = "День Х"
10027080-203 = ""
10027080-204 = "..."
10027080-205 = "..."
10027080-206 = ""
10027080-209 = "[ns] «...»"
10027080-210 = "Это..."
10027080-211 = "Ты сделала это..."
10027080-212 = "[s] «Ты закончила...»"
10027080-213 = "Это реально? Или какой-то странный сон, который даст мне ложную надежду?"
10027080-214 = "О, вполне реально. Будь это сон, я бы сейчас не умирала от усталости."
10027080-215 = "Ну не расслабляйся пока! Всё не закончено, пока не закончено, а закончится оно только после печати!"
10027080-216 = "Похоже, придётся идти в Издательский отдел, но... у меня плохое предчувствие."
10027080-218 = "Плохое предчувствие или нет — нам нужно печатать! Мне всё равно, даже если завтра Кивотос рухнет в небытие. Ничто не остановит меня!"
10027080-220 = "Давайте, Сенсей! Сколько времени осталось?"
10027080-221 = "[s] «Около трёх часов... Поспешим!»"
10027080-223 = "Да!"