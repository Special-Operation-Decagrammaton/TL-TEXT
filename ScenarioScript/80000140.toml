[translation]
80000140-1 = "Шоколадный медовик"
80000140-2 = "Вопрос немного внезапный: каковы, по-вашему, три принципа переговоров?"
80000140-3 = "[s] «Звучит так, будто ты готовишься читать лекцию.»"
80000140-4 = "Хм, быстро поняли. Вот за это вы мне и нравитесь, Сенсей. Хе-хе-хе."
80000140-5 = "Первый и главный принцип — активное слушание."
80000140-6 = "[s] «Мм. Это важно.»"
80000140-7 = "Потому что важно угро— ТО ЕСТЬ убедить другую сторону выслушать, что вы хотите сказать."
80000140-8 = "[s] «Погоди.»"
80000140-9 = "Во-вторых, прибыль. Прибыль всегда важна, очевидно."
80000140-10 = "Поэтому необходимо убедить другую сторону, что выгода будет взаимной."
80000140-11 = "И наконец, доверие."
80000140-12 = "Нужно создать атмосферу, в которой нарушение обещания приведёт к катастрофе, не оставляя вообще никакого пути к отступлению."
80000140-13 = "[s] «Принципы мне нравятся, но что с объяснениями?!»"
80000140-14 = "Если основы вам понравились, разве нельзя считать это... хотя бы НАПОЛОВИНУ успехом?"
80000140-15 = "В конце концов, переговоры требуют техники."
80000140-16 = "Полезно вести разговор так: «мы дадим вам это, а взамен вы достанете нам то»."
80000140-17 = "К слову, вот. Я принесла это."
80000140-18 = ""
80000140-20 = ""
80000140-21 = ""
80000140-23 = "[ns] «Это... шоколадное пирожное?»"
80000140-24 = "Да. Точнее, этот торт называется медовиком."
80000140-25 = "Его делают, чередуя тонкие коржи с мёдом, затем сахаром, затем снова коржом."
80000140-26 = "Это фирменное блюдо Красная Зима. Видите слои коржей, мёда и крема?"
80000140-27 = "А это ШОКОЛАДНЫЙ медовик — с шоколадными коржами и шоколадным кремом."
80000140-28 = "И, кстати, он ручной работы. Сегодня День святого Валентина — день, знакомый любому человеку с деньгами."
80000140-29 = "И вручить в такой день шоколад ручной работы..."
80000140-30 = "Уж Сенсей-то понимает, что это значит, правда? Хе-хе-хе."
80000140-31 = "[s] «Хм...»"
80000140-32 = "Честно говоря, этот вид мне особенно нравится."
80000140-33 = "Поскольку торт строится слой за слоем, разрез напоминает стопку книг."
80000140-34 = "[s] «Довольно романтичное наблюдение.»"
80000140-35 = "И ещё он похож на высокую пачку денег."
80000140-36 = "[s] «...А вот это уже звучит как Якумо...»"
80000140-37 = "То есть медовик для меня важный торт. От одного вида сердце наполняется чувствами, Сенсей."
80000140-38 = "И ещё раз: он ручной работы. Руч-ной. Ра-бо-ты."
80000140-39 = "Подарить такой торт в этот праздник прямо здесь, в типографии — моём рабочем месте, святилище и поле боя."
80000140-40 = "«Уж Сенсей-то понимает, что это значит, правда?» Хе-хе-хе."
80000140-41 = "[s] «Так, Якумо.»"
80000140-42 = "Да, что такое, Сенсей?"
80000140-43 = "[s] «Кому ты заказала его приготовить?»"
80000140-44 = "Что?! К-Как вы...?!"
80000140-45 = "Что? Мне надо «вспомнить своё прошлое поведение»?"
80000140-46 = "Вы слишком жестоки! Я обычно не настолько...!"
80000140-47 = "...настолько..."
80000140-48 = "..."
80000140-49 = "Разве не стоит оставить прошлое позади и сделать новые мудрые шаги к светлому будущему?"
80000140-50 = "[s] «Якумо, Якумо...»"
80000140-51 = "...Ладно, поймали..."
80000140-52 = "Но я покупала его не ТОЛЬКО ради показухи."
80000140-53 = "И запомните! Я не лгала!"
80000140-54 = "Потому что, как уже говорила, доверие — один из трёх принципов переговоров!"
80000140-55 = "В конце концов, кафе ведь сделало торт РУКАМИ, правда?"
80000140-56 = "Просто рядом с Красная Зима открылось новое кафе, и они пришли ко мне за качественной рекламой."
80000140-57 = "Я попробовала с ними «поторговаться», но из-за праздника..."
80000140-58 = "...согласилась дать скидку ПРИ УСЛОВИИ, что они предоставят мне особый торт на пробу."
80000140-59 = "Уверяю, я согласилась только потому, что думала о вас."
80000140-60 = "[s] «Да. Спасибо за сам жест.»"
80000140-61 = "Именно. Шоколадный медовик на День святого Валентина. Я заключила выгодную сделку, и теперь мы оба в плюсе."
80000140-62 = "[s] «...Да. Спасибо за честность...»"
80000140-63 = "...А кто сказал, что я честна?"
80000140-64 = "Не спешите и наслаждайтесь. Эм... Похоже, у меня кончились уловки, так что я пойду. Хе-хе-хе."
80000140-65 = ""
80000140-67 = ""
80000140-68 = ""
80000140-69 = "С-Сенсей?! П-Почему вы вдруг схватили меня за руку...?"
80000140-70 = "Что? Если мы не «съедим вместе», это будет бессмысленно? Но ведь я достала его специально для вас."
80000140-71 = "«Тем более»?"
80000140-72 = "Здесь? В типографии? Мне здесь нравится, но сомневаюсь, что вам приятна атмосфера."
80000140-73 = "...Это не пикник: лязг, жара, запах чернил... Разве всё это не отталкивает?"
80000140-74 = "Ну... почти как я, наверное."
80000140-75 = "Если подумать, возможно, такой финал даже подходит."
80000140-76 = "[s] «Тогда просто пойдём в другое место.»"
80000140-77 = "Ч-Что?"
80000140-78 = "Это... это правда, но..."
80000140-79 = "..."
80000140-80 = "Хорошо."
80000140-81 = "Раз уж дошло до этого, давайте проведём настоящие «переговоры» и превратим всё в хорошую прогулку. Хе-хе-хе."
80000140-83 = "И мы с Якумо отправились в недавно открывшееся кафе."
80000140-85 = ""
80000140-86 = ""
80000140-87 = ""
80000140-88 = ""
80000140-89 = "Разумеется, разговор с Якумо местами был самоуверенным, слегка опасным и определённо проходил совсем рядом с границей допустимого."
80000140-90 = "Но всё равно было весело."
