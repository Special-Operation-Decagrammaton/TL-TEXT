[translation]
1600403-1 = "Главное — что внутри"
1600403-2 = "Вы пришли как раз вовремя, Сенсей! Мне нужна ваша помощь."
1600403-3 = "Аргх... Всё плохо! Одна я с этим не справлюсь!"
1600403-4 = "Драка? Нет? С чего вы вообще решили, что я подралась?"
1600403-5 = "Мне просто нужно купить одежду, и я хочу, чтобы вы пошли со мной."
1600403-6 = "[s] «...Одежду?»"
1600403-7 = "Конечно. Недавно я посмотрела «Шиба на ветру», и одежда главного героя выглядела так круто!"
1600403-8 = "Вот я и решила купить такую же..."
1600403-9 = "Вы не против, Сенсей? Заодно можем немного поглазеть на витрины. Будет очень весело."
1600403-10 = "Почему я не позвала друзей? Ну, вообще-то звала, но..."
1600403-11 = "..."
1600403-12 = "Каждый раз, когда я предлагаю им пойти со мной за одеждой, они вдруг замолкают и убегают..."
1600403-13 = "Вообще ничего не понимаю. Я звала их несколько раз, но они всё время только извинялись..."
1600403-14 = "Все что-то говорили про размер груди или выбор стиля."
1600403-15 = "Как думаете, Сенсей? Я что-то делаю не так?"
1600403-16 = "(Если присмотреться, одежда Пины действительно довольно открытая.)"
1600403-17 = "[s1] «Насчёт гардероба я понимаю их точку зрения.»\n[s2] «...Некоторые вещи от тебя не зависят.»"
1600403-18 = "А-а? Понимаете?!"
1600403-19 = "Что... это значит? Это кто-то другой контролирует?"
1600403-20 = "Ну, неважно."
1600403-21 = "Вот почему мне нужен ваш совет, Сенсей. Пойдёте со мной?"
1600403-22 = "[s3] «С радостью!»\n[s4] «Я от тебя не отвернусь.»"
1600403-23 = "Ура! Вы лучший, Сенсей. Пойдём!"
1600403-24 = "Ура! Вы лучший, Сенсей. Пойдём!"
1600403-25 = "Пошли!"
1600403-27 = "Вот магазин с одеждой, которую я ищу!"
1600403-28 = "Вам нравится наша одежда? Тогда у вас, несомненно, превосходный вкус."
1600403-29 = "Хе-хе. Естественно! Восходящей звезде мафии нельзя расслабляться в вопросах моды."
1600403-30 = "Маф...ии? Понятия не имею, о чём вы говорите, но ладно."
1600403-31 = "Вот! Именно такой образ мне нужен. Уже нашла!"
1600403-32 = "Это в точности одежда Шибы из «Шиба на ветру»!"
1600403-33 = "Можно я примерю? Очень хочется!"
1600403-34 = ""
1600403-35 = "П-простите, госпожа! Эта одежда...!"
1600403-36 = "А? Размер не тот?"
1600403-37 = "А? П-погодите! Э-э...!"
1600403-38 = "*тр-р-ресь* *шлёп*"
1600403-39 = ""
1600403-40 = "...?"
1600403-41 = "Она..."
1600403-42 = "...порвалась."
1600403-43 = "Ч-что случилось?! Я же просто хотела её примерить!"
1600403-44 = "Потому что это одежда Шибы..."
1600403-45 = "...её шили специально по его меркам."
1600403-47 = "(Мы долго извинялись перед управляющим, оплатили ущерб и ушли из магазина.)"
1600403-48 = "(Мы посетили ещё несколько бутиков, но Пина так и не нашла ничего, что ей нравилось бы и подходило по размеру.)"
1600403-49 = "(Солнце село, а она так и не купила ни одной новой вещи.)"
1600403-51 = "Я так и не нашла ничего, что мне подходит..."
1600403-52 = "Главные герои «Шиба на ветру» и «Жизни мафиозного кота»..."
1600403-53 = "...если подумать, собака и кот. Конечно, я не могла влезть в их одежду."
1600403-54 = "*вздыхает*"
1600403-55 = "Я всего лишь хотела стать настоящей гангстершей."
1600403-56 = "Может, у меня просто нет того, что нужно, чтобы стать как Шиба или Мафиозный кот..."
1600403-57 = "..."
1600403-58 = "[s] (Я протянул Пине Blu-ray, который купил на рынке.)"
1600403-59 = "А? Что это?"
1600403-60 = "«Банда сексуальных котят»...? Это гангстерский фильм?"
1600403-61 = "Я такого ещё не видела! Главная героиня — босс мафии? И она кошка! Какая милая!"
1600403-62 = "Эм..."
1600403-63 = "Но на обложке... у неё открыты плечи."
1600403-64 = "Это немного похоже на..."
1600403-65 = "...то, что я ношу сейчас."
1600403-66 = "А?"
1600403-67 = "Так обычно и одеваются героини гангстерских фильмов? Как я сейчас?"
1600403-68 = "Не совсем то же самое, но похоже... Невероятно."
1600403-69 = "А?"
1600403-70 = "Важно не то, что снаружи, а то, что внутри?"
1600403-71 = "Если я уже гангстер, значит, моя одежда тоже гангстерская...?"
1600403-72 = "Я... настоящий гангстер..."
1600403-73 = "..."
1600403-74 = "Хи-хи."
1600403-75 = "Как-нибудь мне надо угостить вас чаем, Сенсей."
1600403-76 = "Потому что если это говорите вы, значит, это правда!"
1600403-77 = "Я так переживала, а решение всё это время было гораздо ближе, чем я думала!"
1600403-78 = "Что? Не хотите чая? Не волнуйтесь, пока не стоит цепляться к мелочам."
1600403-79 = "Хи-хи."
1600403-80 = "В конце концов, важно ведь не то, как выглядит сосуд снаружи, а то, что внутри!"
1600403-82 = "(Когда Пине стало лучше, мы пошли смотреть «Банду сексуальных котят».)"
1600403-83 = "(Похоже, новое озарение её полностью удовлетворило, и Пина больше никогда не жаловалась на одежду.)"
