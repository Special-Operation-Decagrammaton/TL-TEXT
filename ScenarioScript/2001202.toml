[translation]
2001202-1 = "Перевозка раненых"
2001202-2 = "Сэна сообщила мне о вспыхнувшей драке, и я отправился на место, поскольку беспокоился за студентов."
2001202-3 = "Драки в Геенне — обычное дело, но на этот раз раненых, похоже, было больше обычного."
2001202-5 = ""
2001202-6 = "Среди множества пострадавших я заметил Сэну, отдававшую указания членам Клуба экстренной медицинской помощи."
2001202-7 = "Погрузите трупы — то есть раненых — в машину скорой помощи.#nТе, кто ещё может ходить, пусть ждут вон там."
2001202-8 = "Можете сделать предупредительный выстрел рядом с теми, кто притворяется без сознания, чтобы проверить, действительно ли они ранены."
2001202-9 = "За работу."
2001202-11 = "Вперёд!"
2001202-12 = ""
2001202-16 = "А-а-а! Ладно, ладно! Я пойду, пойду сама!"
2001202-17 = "Кто вообще стреляет в людей, которые могут быть ранены?!#nВы что, ненормальные?!"
2001202-18 = "Когда закончите переносить симулянтов, соберитесь здесь."
2001202-19 = "Бой ещё не закончился. Нужно подготовиться к возможному появлению новых трупов — то есть раненых."
2001202-20 = ""
2001202-22 = ""
2001202-23 = "Стоп."
2001202-24 = "Стоим!!!"
2001202-25 = "Мне нужно ненадолго отойти. Пока меня нет, продолжайте действовать по протоколу."
2001202-26 = "Продолжайте."
2001202-27 = "Продолжаем!!!"
2001202-28 = ""
2001202-32 = ""
2001202-33 = ""
2001202-34 = "Здравствуйте, Сенсей. Что привело вас сюда?"
2001202-35 = "Мне казалось, из моего сообщения было ясно, что вам следует держаться подальше отсюда.#nЗдесь всё ещё хаос."
2001202-36 = "А?"
2001202-37 = "Вы пришли проверить, как я, потому что беспокоились?"
2001202-38 = "О."
2001202-39 = "Понятно. Полагаю, неудивительно, что вы не смогли просто проигнорировать подобную ситуацию."
2001202-40 = "Тогда это моя ответственность, что вы сюда пришли. Прошу прощения."
2001202-41 = "Отныне я не буду сообщать вам о подобных ситуациях."
2001202-42 = "Хм? Дело не в этом?"
2001202-43 = "Вы действительно не против оказаться втянутым во что-то подобное?#nНо..."
2001202-44 = "Хорошо, Сенсей. Если вы настаиваете, я продолжу держать вас в курсе."
2001202-45 = "Вы считаете, что я... слишком много работаю?"
2001202-46 = "Я ценю вашу заботу, но за меня беспокоиться не нужно.#nЭто моя работа."
2001202-47 = "Сегодняшний конфликт серьёзнее обычного, и число жертв выше среднего..."
2001202-48 = "Разумеется, я имею в виду раненых студентов."
2001202-49 = "И всё же скоро сюда прибудет Дисциплинарный комитет и возьмёт ситуацию под контроль.#nНашему клубу не нужно выходить на передовую."
2001202-50 = "Как раз вовремя. Дисциплинарный комитет прибыл."
2001202-51 = ""
2001202-53 = ""
2001202-55 = ""
2001202-56 = "Мы на месте! Арестовать всех!"
2001202-57 = "Уничтожить их всех! А-а-а-а!"
2001202-58 = ""
2001202-60 = ""
2001202-66 = ""
2001202-67 = "Как я и говорила..."
2001202-68 = "[s1] «Здесь всегда так.»\n[s2] «Обычный день в Геенне.»"
2001202-69 = "Верно. То же относится и к нашему клубу. Мы, как обычно, лишь занимаемся ранеными."
2001202-70 = "Верно. То же относится и к нашему клубу. Мы, как обычно, лишь занимаемся ранеными."
2001202-71 = "Мы бы никогда ничего не успевали, если бы вмешивались во всё, что выходит за рамки наших обязанностей. Такова Геенна."
2001202-72 = "Тогда нам пора вернуться к работе."
2001202-73 = "Стой!"
2001202-74 = ""
2001202-76 = ""
2001202-78 = ""
2001202-79 = "Стойте. Вы из Клуба экстренной медицинской помощи, верно?"
2001202-80 = "Я Химуро Сэна, президент клуба. Чем могу помочь?"
2001202-81 = "В-Вы президент? Тогда прошу простить мои манеры."
2001202-82 = "Я пришла поговорить о том раненом студенте, что лежит вон там.#nОна одна из организаторов этого инцидента."
2001202-83 = "Понятно."
2001202-84 = "И?"
2001202-85 = "Ч-Что значит «и»?"
2001202-86 = "Я спрашиваю, почему вы говорите со мной об этом студенте."
2001202-87 = "П-Потому что её нужно доставить на допрос. Поэтому я прошу передать её нам."
2001202-88 = "Это невозможно."
2001202-89 = "А?"
2001202-90 = "Клуб экстренной медицинской помощи отвечает за раненых с момента их обнаружения. Исключений нет."
2001202-91 = "Вам придётся подождать, пока она не восстановится."
2001202-92 = "Это нелепо. Нам нужно провести расследование!"
2001202-93 = "Если вы не подчинитесь, нам придётся применить силу."
2001202-94 = "Как хотите..."
2001202-95 = ""
2001202-97 = ""
2001202-100 = "[s] «Сэна?!»"
2001202-102 = ""
2001202-103 = "Здесь ещё одна раненая."
2001202-104 = "Она без сознания. Пожалуйста, погрузите её в машину скорой помощи."
2001202-105 = "Это приказ."
2001202-106 = "Поняла!"
2001202-107 = ""
2001202-110 = "[ns3] «А так вообще МОЖНО?»\n[ns4] «По-моему, это уже похоже на похищение.»"
2001202-111 = "Всё в порядке. Я вырубила её гранатой, но серьёзных травм у неё нет."
2001202-112 = "Всё в порядке. Я вырубила её гранатой, но серьёзных травм у неё нет."
2001202-113 = "Это был самый эффективный способ разобраться с ситуацией."
2001202-114 = "Хм..."
2001202-115 = ""
2001202-117 = ""
2001202-118 = ""
2001202-119 = ""
2001202-120 = ""
2001202-121 = "Думаю, теперь все погибшие учтены."
2001202-122 = "[s5] «Ты имеешь в виду раненых.»\n[s6] «Ты никак не избавишься от этой привычки, да?»"
2001202-123 = ""
2001202-124 = ""
2001202-126 = ""
2001202-127 = "Простите, но у меня ещё работа. Я ухожу."
2001202-128 = "До встречи."
