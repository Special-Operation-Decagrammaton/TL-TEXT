[translation]
10055190-1 = "Незамерзающий, непобедимый,#nбронированный порт"
10055190-2 = ""
10055190-3 = "...Здесь есть горячий источник?"
10055190-4 = "Горячий источник прямо у пляжа. Просто мечта!"
10055190-5 = "Хотя немного не к месту, не находишь?"
10055190-6 = ""
10055190-8 = ""
10055190-9 = "..."
10055190-10 = "Макото? Ты притихла. О чём думаешь?"
10055190-11 = "...Хм."
10055190-12 = "О нет! Я забыла!"
10055190-13 = "А, н-напугала!"
10055190-14 = "...А, Сацуки. Ты в порядке?"
10055190-15 = "Макото! Ты меня до смерти напугала!"
10055190-16 = "Хм... Какой промах. Не могу поверить, что упустила нечто столь важное."
10055190-17 = "После Тринити Геенне предстоит преодолеть ещё одно препятствие!"
10055190-19 = "А? Разве кроме Тринити есть ещё академия, которой нам стоит опасаться...?"
10055190-20 = "Ироха, ты ведь была там вместе со мной! Неужели не заметила?!"
10055190-21 = "Я ведь была там с тобой... Ты говоришь о...?"
10055190-22 = "Хи-хи-хи. Как всегда проницательна, председатель Макото."
10055190-23 = ""
10055190-25 = ""
10055190-26 = ""
10055190-27 = "Именно! Это я, почтенная председатель академии «Красная зима», Благоустроитель земель, Великий вождь, капитан спортивного клуба, начальник санитарной службы...!"
10055190-28 = ""
10055190-29 = "#st;[400,95];smooth;90;Незамерзающий, непобедимый,#nбронированный порт"
10055190-32 = ""
10055190-34 = "...Благоустроитель земель и, эм..."
10055190-35 = "А ещё глава всех префектов, знаток школьного питания и лучший дегустатор пудинга этого месяца — Черино."
10055190-36 = "Да! Прекрасно сказано!"
10055190-37 = "А теперь я ещё и хозяйка этого приморского горячего источника, И сильнейший боец крабовых поединков!"
10055190-38 = ""
10055190-40 = ""
10055190-41 = "Wait..."
10055190-42 = "Макото, ты больше опасалась «Красной зимы», чем Тринити?"
10055190-43 = "Н-нет!!"
10055190-44 = "Ты думаешь, я боюсь, что за время моего правления Геенна может...?"
10055190-45 = "Я НИ РАЗУ не тревожилась, что мы можем отстать от «Красной зимы» и её малолетней предводительницы! Ни капельки!"
10055190-46 = "Как-то уж слишком подробно ты описала то, о чём якобы не тревожишься..."
10055190-47 = "Она права, Макото. «Красная зима», серьёзно?"
10055190-48 = "Ты так говоришь лишь потому, что не видела её своими глазами, Сацуки!"
10055190-49 = "Её огромные территории тянутся чуть ли не бесконечно, а студентов там не счесть!"
10055190-50 = "Если бы столь сильный лидер, как я, Великая Макото, сумел объединить их... они могли бы превзойти Геенну, а то и все три крупнейшие академии Кивотоса!"
10055190-51 = "Да, председатель Макото! Вы отлично понимаете «Красную зиму»!"
10055190-52 = "Пусть наш последний переворот и провалился, следующий непременно приведёт «Красную зиму» к светлой новой эпохе."
10055190-53 = "О? Марина, ты готовишь новый переворот?"
10055190-54 = "...Похоже, последняя чистка была недостаточно тщательной."
10055190-55 = "Что?! Нет! После последней чистки я ВСЕЦЕЛО предана секретариату!"
10055190-56 = "Не думаю, что нам стоит ждать их объединения в ближайшее время."
10055190-57 = "Ахаха-ха! Есть академия хуже нашей!"
10055190-58 = "...Чиаки."
10055190-59 = "Мне кажется, ты порой не понимаешь, насколько жестокой можешь быть."
10055190-60 = "А?!"
10055190-61 = "Ар-р! Хватит! Вы же знаете, зачем мы здесь!"
10055190-62 = "Я сокрушу вас непобедимым крабом «Чистильщик № 2»!"
10055190-63 = "П-постой, этот краб огромный!"
10055190-64 = "Это НЕ может быть разрешено правилами."
10055190-65 = "Ещё как может. В правилах чётко сказано, что в «Крабовых боях» могут участвовать ЛЮБЫЕ виды ракообразных."
10055190-66 = "Все труды по поиску краба, достойного Великого вождя Черино, наконец окупились."
10055190-67 = "А-а! Смотрите, раки-отшельники съёжились от страха в его тени!"
10055190-68 = "Что?! Вставай, Тайгершаркмару! Ты смелее! Ты сильнее!"
10055190-69 = "...И никакой реакции."
10055190-70 = "Не может быть! Мы проиграем ещё до начала боя?!"
10055190-71 = ""
10055190-73 = ""
10055190-74 = "...Всё хорошо. Я знаю. Я знаю, что тебе страшно."
10055190-75 = ""
10055190-77 = ""
10055190-78 = "На, держи Ибуки за пальчик."
10055190-79 = ""
10055190-81 = "О, смотрите! Маленький крабик поднял клешню. Он что, действительно её понял?"
10055190-82 = "*ах* Неужели? Пробудился именно здесь и сейчас?"
10055190-83 = "Талант Ибуки как бойца крабовых поединков...?!"
10055190-84 = "Вместе мы сможем быть храбрыми!"
10055190-85 = "Давай, господин Клешня! Проучим этого большого злодея!"
10055190-86 = "Щип!"
