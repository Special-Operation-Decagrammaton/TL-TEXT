[translation]
10055190-1 = "The Invincible Armor-Piercer of the Ice-Free Port"
10055190-3 = "Is this... a hot spring?"
10055190-4 = "A hot spring on the beach, how romantic!"
10055190-5 = "Romantic? It feels more like a mismatch to me..."
10055190-9 = "..."
10055190-10 = "Makoto-chan? What have you been thinking about so intently?"
10055190-11 = "...Ah."
10055190-12 = "Gyaaaaah! Oh no, I messed up!"
10055190-13 = "G-goodness, you scared me! What was that for?!"
10055190-14 = "...Ah, forgive me. I lost my composure for a moment."
10055190-15 = "Seriously! What would you have done if you gave me a heart attack?!"
10055190-16 = "No, you see, I just remembered something truly critical."
10055190-17 = "Gehenna... besides Trinity, there is still another wall we must overcome!"
10055190-19 = "Besides Trinity...? Is there somewhere else?"
10055190-20 = "Iroha, you were with me! How do you not know?!"
10055190-21 = "We were together...?"
10055190-22 = "Heh heh heh, sharp as always. As expected of Chairperson Makoto."
10055190-27 = "That's right, I am the Student Council President of Red Winter Federal Academy, and the Head of the Environmental Beautification Department, Secretary General, Representative of the Sports Department, Head of the Cleaning Department, and...!"
10055190-29 = "The Invincible Armor-Piercer of the Ice-Free Port"
10055190-34 = "Oh... and also the Head of the Environmental Beautification Department..."
10055190-35 = "And the Prefect Team Leader, Head of the School Lunch Department... and Chairperson Cherino, who was selected as this month's Best Pudding Taster."
10055190-36 = "Oh, yes! Well said!"
10055190-37 = "And now... I am the proprietress of this hot spring, and the strongest Crab Fighter!"
10055190-41 = "...Eh?"
10055190-42 = "Wait, Makoto-senpai, were you more worried about Red Winter than Trinity?"
10055190-43 = "N-no, that's not it!"
10055190-44 = "It's just that... Gehenna Academy! In this generation, under my leadership!"
10055190-45 = "I have never felt even a shred of anxiety that we might fall behind a Red Winter led by a mere shrimp like her!!"
10055190-46 = "That's a very specific source of anxiety..."
10055190-47 = "I don't think Red Winter is really worth being that cautious about..."
10055190-48 = "Satsuki, you can say that because you haven't seen it!"
10055190-49 = "An endlessly vast territory and countless students!"
10055190-50 = "If a brilliant leader like me were to appear there and unite the students... their hidden potential could surpass Gehenna and even overwhelm the three major academies of Kivotos!"
10055190-51 = "As expected of Chairperson Makoto! You know so much!!"
10055190-52 = "The last coup d'état ended in failure, but next time, we will make Red Winter even better..."
10055190-53 = "Hm? Marina, were you planning another coup?"
10055190-54 = "...It seems the purges were insufficient."
10055190-55 = "N-no, that's not it! Ever since the last purge, I have pledged my absolute loyalty to the Secretariat!"
10055190-56 = "And besides, that... what was it, a brilliant leader?"
10055190-57 = "Ahahaha! I guess there are schools even worse off than ours!"
10055190-58 = "Chiaki is really something..."
10055190-59 = "She says such ruthless things with a straight face sometimes."
10055190-60 = "Feh!?"
10055190-61 = "Enough! Quiet! Regardless, this is the goal, isn't it!"
10055190-62 = "I'll scatter them with the invincible crab, 'Purge-kun No. 2'!"
10055190-63 = "W-what is that giant crab!?"
10055190-64 = "Isn't that cheating?"
10055190-65 = "Heh heh heh, it is not cheating. Any species of crustacean can participate in a 'Crab Fight'."
10055190-66 = "It was worth the effort to find a crab worthy of Secretary General Cherino."
10055190-67 = "Ahhh!? The hermit crabs are terrified by its size!"
10055190-68 = "What!? Stand up, Tiger Shark-maru! You aren't the type to break over something like this!"
10055190-69 = "...There's no response."
10055190-70 = "Don't tell me! Are you admitting defeat before the fight even begins!?"
10055190-74 = "...I see, you're scared."
10055190-78 = "It's okay. Ibuki will hold your hand."
10055190-81 = "Ohhh!? It's as if the hermit crab understood Ibuki-chan's feelings, it's moving its legs...!"
10055190-82 = "Could it be... has she blossomed...!?"
10055190-83 = "Ibuki's talent as a Crab Fighter...!!"
10055190-84 = "We won't be scared if we fight together!"
10055190-85 = "Let's go, Mr. Crab! Let's teach the bad crab a lesson together!"
10055190-86 = "Crab~!"