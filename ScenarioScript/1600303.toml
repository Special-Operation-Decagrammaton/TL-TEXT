[translation]
1600303-1 = "Сиять ослепительно ярко"
1600303-2 = "Вот вы где, Сенсей. Сюда. Это Сузуми."
1600303-3 = "Скажите, куда вам нужно. Я вас провожу."
1600303-5 = "...Хм. Хорошо."
1600303-6 = "Далековато, но не волнуйтесь. Я прослежу, чтобы вы добрались безопасно."
1600303-7 = "...!"
1600303-8 = "[s] «...Сузуми?»"
1600303-9 = "Опасно, Сенсей! Спрячьтесь за машиной! Быстрее!"
1600303-10 = "Применяю светошумовую гранату!"
1600303-12 = "*бах* *звя-я-я-янь*"
1600303-13 = "А-а-а-а! Ч-что происходит?! Мои глаза...! Ничего не вижу!"
1600303-14 = "У меня кружится голова! Угх. Всё плывёт...!"
1600303-15 = "Ч-что, чёрт возьми, происходит?!"
1600303-16 = "Сейчас наш шанс. Уходим отсюда! Быстрее, за мной!"
1600303-19 = "...Фух. Теперь мы должны быть в безопасности."
1600303-20 = "Подумать только, они нацелились на вас средь бела дня... Какая наглость."
1600303-21 = "Что? Вы думали, это обычные студенты? Не будьте наивны, Сенсей."
1600303-22 = "Вы же видели, как они держали телефоны?"
1600303-23 = "Наверняка пытались сфотографировать вас, чтобы доложить начальству."
1600303-24 = "[s1] «Неожиданно...»\n[s2] «Ты уверена?»"
1600303-25 = "Полной уверенности быть не может, но вероятность высока."
1600303-26 = "Полной уверенности быть не может, но такая возможность вполне вероятна."
1600303-27 = "Даже вам нужно сохранять бдительность во время задания."
1600303-28 = "Сейчас моя задача — сопроводить вас до места назначения."
1600303-29 = ""
1600303-30 = "...! Там кто-то подозрительный!"
1600303-31 = "Светошумовая граната!"
1600303-33 = "*бах* *звя-я-я-я-янь*"
1600303-34 = "А! Что это было?!"
1600303-35 = "Что происходит?! Я ничего не вижу!"
1600303-36 = "Толпа и правда слишком опасна. Нужно двигаться!"
1600303-37 = "За мной! Сюда!"
1600303-40 = "*тяжело дышит* *тяжело дышит*"
1600303-41 = "Вы в порядке, Сенсей? Пока что мы должны быть в безопасности."
1600303-42 = "Но даже с этим я справлюсь. За таким количеством людей я могу следить."
1600303-43 = "Если дальше заметим кого-то слишком подозрительного, я смогу атаковать отсюда."
1600303-44 = "Простите? Думаете, я перегибаю?"
1600303-45 = "Нет, Сенсей. Сегодня я здесь, чтобы сопровождать вас."
1600303-46 = "Если с вами что-нибудь случится, я... не смогу себе этого простить."
1600303-47 = "Откуда вдруг такая обеспокоенность, Сенсей?"
1600303-48 = "Думаете, я вышла за рамки своих обязанностей?"
1600303-49 = "[s3] «Я благодарен, не пойми неправильно. Но ты слишком напряжена.»\n[s4] «Расслабься. Считай, что мы просто мирно гуляем.»"
1600303-50 = "После таких слов я нервничаю ещё сильнее..."
1600303-51 = "После таких слов я нервничаю ещё сильнее..."
1600303-52 = "...но я постараюсь. Если хотите, чтобы я расслабилась, я выполню просьбу."
1600303-53 = "Если пойдём прямо, доберёмся очень быстро. Идёмте, Сенсей."
1600303-54 = ""
1600303-55 = "[s] (Я пошёл вслед за Сузуми.)"
1600303-58 = "К счастью, мы добрались без происшествий."
1600303-59 = "Возможно, вы были правы. Я зря держала оборону настолько высоко."
1600303-60 = "Может, из меня плохой сопровождающий. Без меня вы, наверное, добрались бы быстрее..."
1600303-61 = "Вы ожидали, что всё закончится именно так? Тогда почему вы...?"
1600303-62 = "...? Вы просто хотели пройтись со мной...?"
1600303-63 = "С-Сенсей, что на вас нашло?! Что вы вообще думаете о сервисах Патрульной команды?!"
1600303-64 = "Н-не то чтобы я не хотела, чтобы вы мне звонили...!"
1600303-65 = "Если бы вы просто попросили с самого начала, я бы подумала..."
1600303-66 = "Я-я имею в виду... так нельзя!"
1600303-67 = "..."
1600303-68 = "...Эм."
1600303-69 = "В следующий раз можете обратиться прямо ко мне, Сенсей."
1600303-70 = "Если вам нужна только компания, а не защита, я буду вести себя иначе."
1600303-71 = "Так я справлюсь гораздо лучше, чем сегодня."
1600303-72 = "...Так что, эм... да."
1600303-73 = "Рада, что мы оба... согласны...!"
1600303-74 = ""
1600303-76 = "(Сузуми вдруг сама сорвалась с места и убежала, оставив меня позади.)"
1600303-77 = "(Убегала она так же неловко, как и в прошлый раз.)"
