[translation]
1012906-1 = "Сияние, за которым гналась девушка"
1012906-2 = "Я отправился туда, куда она просила."
1012906-3 = "Это был тихий парк аттракционов Тринити."
1012906-6 = "Примерно через десять минут пришла Сузуми."
1012906-7 = ""
1012906-10 = "Сенсей, простите, что опоздала!"
1012906-11 = "Пожалуйста, примите мои извинения."
1012906-12 = "[s1] «Не извиняйся, я сам только что пришёл!»\n[s2] «Всё хорошо, всё хорошо.»"
1012906-15 = "Спасибо за великодушие..."
1012906-16 = "Э-Этот костюм? У меня есть причина. Из-за него я и задержалась."
1012906-17 = "Дело в том, что вчера..."
1012906-18 = "Я немного устала. Кажется, положила маркер вместе с бельём в стирку..."
1012906-19 = "...И... это было всё, что у меня осталось. Поэтому, конечно, пришлось ещё и причёску сделать."
1012906-20 = "Но правда! Я позвонила в парк, и мне разрешили прийти в этом костюме!"
1012906-21 = "Сегодня у них нет никаких мероприятий, поэтому меня никто не перепутает с сотрудницей парка."
1012906-22 = "[s3] «Спасибо, что всё равно пришла.»\n[s4] «Ты отлично справилась!»"
1012906-25 = "Потому что такие вещи... важны."
1012906-26 = "(...И, конечно, я не могла упустить возможность увидеть Сенсея...)"
1012906-27 = "(Мне так сильно хотелось его увидеть...)"
1012906-28 = "[s5] «Ты выглядишь очень красиво!»\n[s6] «Ты идеально вписываешься в парк аттракционов!»"
1012906-31 = "П-Правда? Тогда я спокойна."
1012906-33 = "Я провёл время в парке аттракционов вместе с Сузуми."
1012906-34 = "Её костюм сделал её довольно популярной!"
1012906-38 = "А теперь! Узрите мою гига-молнию!"
1012906-39 = "Ещё монстры появились?!"
1012906-40 = "Это... довольно впечатляющее сценическое выступление."
1012906-41 = "Битва с армией монстров. Какая фантазия."
1012906-42 = "..."
1012906-44 = "Сузуми некоторое время смотрела на сцену."
1012906-45 = ""
1012906-51 = "Ах."
1012906-52 = "Прошу прощения. Я заставила вас так долго ждать."
1012906-53 = "[s] «Ты о чём-то задумалась?»"
1012906-54 = "Наверное... можно и так сказать."
1012906-55 = "Похоже, людям нравятся истории, в которых герой кого-то спасает."
1012906-56 = "В этом костюме я не могу не думать об этом."
1012906-57 = "Может быть, все так жаждут таких историй именно потому, что в обычной жизни их почти не бывает."
1012906-58 = "...Вот о чём я думала."
1012906-59 = "[s7] «Но прямо передо мной есть герой.»\n[s8] «...Кто-то, кто совершал геройские поступки в геройском костюме.»"
1012906-60 = ""
1012906-61 = ""
1012906-63 = ""
1012906-64 = "Вот как?"
1012906-65 = "..."
1012906-66 = "Я никогда не хотела называть себя героем..."
1012906-67 = "...но слышать это от Сенсея приятно."
1012906-68 = "Потому что вы говорите так искренне..."
1012906-69 = "...мне приятно слышать ваши добрые слова."
1012906-70 = "[s9] «Потому что ты крутая, Сузуми!»\n[s10] «Ты особенная!»"
1012906-73 = "Спасибо, что остались со мной."
1012906-74 = "И спасибо, что так добры и слушаете мои скучные истории."
1012906-75 = "А, уже стемнело."
1012906-76 = ""
1012906-78 = ""
1012906-79 = ""
1012906-81 = "Кажется, отсюда я тоже могла бы дотянуться до звёзд."
