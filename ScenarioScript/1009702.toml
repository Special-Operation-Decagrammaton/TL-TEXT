[translation]
1009702-1 = "Взрывоопасные угрозы"
1009702-2 = "Я получил сообщение от Моэ и отправился в указанное ею место."
1009702-3 = "Я увидел Моэ под тенистым навесом на пляже. Она скучающе зевала."
1009702-4 = ""
1009702-6 = ""
1009702-7 = "*зевок*"
1009702-8 = "О, Сенсей. Ты пришёл."
1009702-9 = "Мне совсем нечего было делать, кроме как ждать вас, хи-хи."
1009702-10 = "Садитесь, поболтаем."
1009702-11 = "[s] «А где остальные участницы отряда RABBIT?»"
1009702-12 = "Далеко отсюда, на операции."
1009702-13 = "Я отвечаю за управление и поддержку, так что просто отдыхаю здесь перед аппаратурой связи..."
1009702-14 = "Отряд RABBIT и так отлично знает, что делать, поэтому оператору особо нечем заняться."
1009702-15 = "Моя поддержка в основном сводится к тому, чтобы сидеть здесь и ждать связи."
1009702-16 = "[s] «А, так ты позвала меня составить тебе компанию.»"
1009702-17 = "Ага."
1009702-18 = "То есть, мне скучно, но это МОЙ пост. Уйти я не могу, а занять себя нечем."
1009702-19 = "Я увидела, что вы где-то рядом, и написала вам."
1009702-20 = "[s1] «Я не против составить тебе компанию, но...»\n[s2] «Сейчас из меня может быть не лучший собеседник.»"
1009702-23 = "Да какая разница, о чём говорить? Вы здесь со мной — мне уже хорошо."
1009702-24 = "Разве что хотите поделиться свежими сплетнями о новых студентах..."
1009702-25 = "[s] «(Похоже на девчачьи разговоры.)»"
1009702-26 = "О-о, или вам попадалась какая-нибудь новая взрывчатка? Ха-ха..."
1009702-27 = "[s] «(А вот это уже меньше похоже на девчачьи разговоры.)»"
1009702-28 = ""
1009702-30 = ""
1009702-31 = ""
1009702-32 = ""
1009702-33 = ""
1009702-34 = ""
1009702-35 = "О, смотрите, Валькирии. Для такого раннего утра они прямо очень стараются."
1009702-36 = "И их бикини стараются не меньше."
1009702-37 = "Форма Валькирии всегда стильная, но я не думала, что и купальникам уделят столько же внимания."
1009702-38 = "[s] «Хорошее наблюдение.»"
1009702-39 = ""
1009702-41 = ""
1009702-42 = "Хи-хи..."
1009702-43 = "Эй, Сенсей, я только что видела ваш взгляд."
1009702-44 = "Вы украдкой поглядывали в их сторону, правда?"
1009702-45 = "[s3] «Я не поглядывал.»\n[s4] «...Н-Ничего подобного!»"
1009702-48 = "Да ладно, незачем отрицать. Вполне естественно, что взгляд притягивают откровенные купальники."
1009702-49 = "Не зря же про эффектных девушек говорят «бомба»."
1009702-50 = "Невозможно НЕ смотреть ни на огромный взрыв, НИ на откровенный наряд."
1009702-51 = "...О-о, интересно, что будет, если они наденут такое прямо перед гигантским взрывом. Хи-хи..."
1009702-52 = "[s] «Это уже немного чересчур.»"
1009702-53 = ""
1009702-56 = "[ns] «Похоже, ты и сама любишь бикини, Моэ.»"
1009702-57 = "Ну да!"
1009702-58 = "Одного взгляда на них достаточно, чтобы оказаться на грани катастрофы."
1009702-59 = "Плавание — нагрузка на всё тело. Двигать руками и ногами через сопротивление воды само по себе уже рискованно."
1009702-60 = "А плавать в крошечном кусочке ткани, который и при ходьбе-то едва всё прикрывает, не говоря уже о плавании..."
1009702-61 = "Противоречие между назначением и практичностью... катастрофа, которая может случиться в любой момент...!"
1009702-62 = "От одного воображения уже невыносимо! *тяжело дышит* *тяжело дышит*"
1009702-63 = "[s] «Л-Ладно, успокойся...»"
1009702-64 = ""
1009702-67 = "[ns5] «Сейчас многие что-нибудь надевают поверх бикини.»\n[ns6] «Ты ведь тоже в худи, Моэ.»"
1009702-70 = "Ну, это потому что..."
1009702-71 = "Если честно, я ношу худи, потому что прячу под ним «кое-что опасное»."
1009702-72 = "Нечто с разрушительной силой даже больше, чем у бикини..."
1009702-73 = "[s7] «Разрушительная сила больше, чем у бикини...»\n[s8] «Т-Ты хочешь сказать...?»"
1009702-76 = "Именно то, о чём вы, скорее всего, подумали, Сенсей."
1009702-77 = "Если я сниму худи, люди закричат, и начнётся хаос."
1009702-78 = "О-о... У меня мурашки от одной мысли."
1009702-79 = "Э-Эй, Сенсей? Искушение становится слишком сильным. Так и хочется сорвать худи и выпустить разрушение наружу. Что же делать, что же делать?"
1009702-80 = "[s9] «Эй, погоди!»\n[s10] «Что у тебя там спрятано?»"
1009702-83 = "Хи-хи... Теперь мне ещё сильнее хочется показать..."
1009702-84 = "Смотрите хорошенько своими глазами. Даже бикини не сравнится с мощью..."
1009702-85 = ""
1009702-87 = ""
1009702-88 = ""
1009702-90 = "Композитной взрывчатки типа C!"
1009702-91 = ""
1009702-94 = "[ns] «...Что?»"
1009702-95 = ""
1009702-96 = "Вчера я купила новую пластичную взрывчатку. Остальные в отряде не знают."
1009702-97 = "Этот милый маленький брусок весом в четверть фунта может уничтожить целый танк, хи-хи..."
1009702-98 = "Я подумала, что отряду это может не понравиться, поэтому спрятала её под одеждой."
1009702-99 = "Ну как, Сенсей? Дух захватывает от такой разрушительной силы, правда?"
1009702-100 = "Если бы кто-нибудь здесь узнал, сколько взрывной мощи скрывается под этим невзрачным худи, только представьте их реакцию, ха-ха-ха..."
1009702-101 = "[s] «...Моэ.»"
1009702-102 = "А? Что такое, Сенсей?"
1009702-103 = ""
1009702-105 = ""
1009702-106 = ""
1009702-107 = "Ч-Что это за страшное лицо?"
1009702-108 = "[s] «Я конфискую эту бомбу. Это опасно.»"
1009702-109 = "Серьёзно?!"
1009702-111 = "Конфисковав бомбу, я строго отчитал Моэ за обращение со взрывчаткой."
1009702-112 = "...А ещё предупредил её, чтобы она не задирала верх одежды на публике без всякой причины."
