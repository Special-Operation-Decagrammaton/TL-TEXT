[translation]
1008903-1 = "Теперь мы немного похожи"
1008903-2 = "Ару позвала меня в зал деловых презентаций, где часто собирались крупные предприниматели и представители преступного мира."
1008903-3 = ""
1008903-6 = "Добро пожаловать, Сенсей. Я вас ждала."
1008903-7 = "[s1] «Ару?»\n[s2] «Это деловая презентация?»"
1008903-10 = "Хи-хи. Ну, я пришла посмотреть презентации нескольких проектов, которые меня заинтересовали, и тут вспомнила ваши слова."
1008903-11 = "«Мне не нужно искать идеальный повод для платья. Нужно сохранить его до тех пор, пока идеальный повод сам не появится.»"
1008903-12 = "Если я буду ходить здесь в школьной форме... Люди могут смотреть на меня свысока из-за того, что я студент."
1008903-13 = "Поэтому я нарядилась и пригласила вас — самого надёжного партнёра Решал 68."
1008903-14 = "Хи-хи. Ну как? Теперь-то я произведу на них впечатление, верно?"
1008903-15 = ""
1008903-17 = ""
1008903-18 = "...Точно?"
1008903-19 = "[s3] «О... Определённо!»\n[s4] «Гениально! Именно это я и имел в виду!»"
1008903-22 = "Хи-хи-хи. Разумеется."
1008903-23 = "В таком случае у меня для вас предложение. Не как у студента, а как у начальницы."
1008903-24 = "Составите мне компанию на этих деловых презентациях? Разумеется, я вас щедро вознагражу."
1008903-25 = "Если всё пройдёт хорошо, обещаю вам вполне достойную награду."
1008903-26 = "Ну что ж."
1008903-27 = ""
1008903-29 = ""
1008903-30 = "...Готовы войти, Сенсей?"
1008903-31 = ""
1008903-34 = "Я прошёл вместе с Ару по залу деловых презентаций. Мы посмотрели множество выступлений."
1008903-37 = "...Каждая презентация без исключения была набита преувеличениями и мошенничеством. Полная катастрофа."
1008903-38 = ""
1008903-40 = ""
1008903-41 = "Почему?!"
1008903-42 = ""
1008903-43 = "Почему, почему, почему?! Здесь нет ни одного нормального проекта!"
1008903-44 = ""
1008903-45 = "Магия треугольников, германиевые браслеты, вода с эмоциями!!"
1008903-46 = "Они правда думают, что я вложусь в эту оккультную чушь? За кого они меня принимают?"
1008903-47 = "[s5] «У-Успокойся.»\n[s6] «Если честно, такое случается довольно часто.»"
1008903-50 = "*вздох* Я так устала..."
1008903-51 = "Я думала, что это будет идеальный шанс показать, какой взрослой и серьёзной руководительницей я на самом деле являюсь."
1008903-52 = "А в итоге вместо того, чтобы укрепить репутацию, я выгляжу как нарядно одетый клоун."
1008903-53 = ""
1008903-55 = "...Вы так не думаете?"
1008903-56 = ""
1008903-58 = "Сенсей..."
1008903-59 = ""
1008903-61 = ""
1008903-62 = ""
1008903-63 = "Я ценю вашу поддержку, но всё нормально. Я умею оценивать обстановку, знаете ли."
1008903-64 = "Сегодня всё провалилось. Я зря отняла ваше время, приведя вас сюда."
1008903-65 = "Не переживать?"
1008903-66 = "К чему ты клонишь?"
1008903-67 = "[s7] «Умение распознавать мошенников — часть взросления.»\n[s8] «И поверь мне, мошенников встречается ОЧЕНЬ много.»"
1008903-70 = "Ч-Что? Что это вообще должно значить?"
1008903-71 = "Если честно, похоже, вы просто пытаетесь меня утешить."
1008903-72 = "А?"
1008903-73 = "Вы хотите, чтобы я пошла за вами? К-Куда? День уже почти закончился!"
1008903-74 = "В классное место?"
1008903-75 = ""
1008903-77 = ""
1008903-78 = "...Откуда вы знаете, что мне там понравится?"
1008903-79 = "[s9] «Я уверен, ты там отлично впишешься.»\n[s10] «Я сделаю так, чтобы сегодняшний день не оказался полным провалом.»"
1008903-82 = "Л-Ладно... Ну... Если вы настаиваете..."
1008903-83 = ""
1008903-85 = ""
1008903-86 = "Где мы?"
1008903-87 = ""
1008903-92 = "...???"
1008903-93 = "Это раменная?"
1008903-94 = "Именно сюда вы хотели меня привести, Сенсей?"
1008903-95 = "[s11] «Ага. Садись.»\n[s12] Сесть и заказать рамен."
1008903-98 = "С-Сенсей?!"
1008903-99 = ""
1008903-101 = ""
1008903-102 = ""
1008903-103 = ""
1008903-105 = ""
1008903-106 = "Мне стало любопытно, что вы имели в виду, когда сказали, что я тут впишусь... Это же раменная..."
1008903-107 = "Н-Не то чтобы я не любила рамен... Если выбирать, это одно из моих любимых блюд..."
1008903-108 = "Но такого я точно не ожидала. Что вы задумали?"
1008903-109 = "Ведь это не сильно отличается от других случаев, когда вы угощали меня раменом, верно?"
1008903-110 = "Так что изменилось?"
1008903-111 = "Почему сейчас всё ощущается иначе?"
1008903-112 = "[s13] «День был паршивый, вот мы и пришли сюда выпустить пар.»\n[s14] «Именно для этого я и ищу такие места.»"
1008903-115 = "Эм..."
1008903-116 = "Зачем вообще...?"
1008903-117 = ""
1008903-119 = ""
1008903-120 = "...О."
1008903-121 = "Т-То есть вы хотите сказать..."
1008903-122 = "Это просто одна из вещей, которые делают взрослые?"
1008903-123 = ""
1008903-125 = ""
1008903-126 = "[ns15] «Вот теперь ты понимаешь.»\n[ns16] «Ну как? Не так уж сложно, правда?»"
1008903-129 = "...Хех."
1008903-130 = "Хи-хи. Хи-хи-хи..."
1008903-131 = "Серьёзно... ваши слова никогда не перестают меня удивлять, Сенсей."
1008903-132 = "Ну..."
1008903-133 = "...Ага."
1008903-135 = "...И правда всё так просто."
1008903-138 = "― [log=아루 드레스]*вздох*... Никогда не думала, что всё обернётся именно так.[/log][wa:2810]"
1008903-139 = "― [log=아루 드레스]Но... как вы и сказали, всё не так уж плохо.[/log][wa:4620]"
1008903-142 = "― [log=아루 드레스]Если честно, это довольно интересно...[/log][wa:880]"
1008903-145 = "― [log=아루 드레스]Подумать только, обеспеченный взрослый...[/log]"
1008903-146 = "― [log=아루 드레스]...ужинает в таком месте...[/log][wa:2220]"
1008903-149 = "― [log=아루 드레스]Но теперь... кажется, я понимаю немного больше.[/log][wa:1660]"
1008903-152 = "― [log=아루 드레스]Пусть причины у всех разные...[/log][wa:10]"
1008903-153 = "― [log=아루 드레스]Уверена, каждый хотя бы раз чувствовал себя так.[/log][wa:3460]"
1008903-156 = "― [log=아루 드레스]...Даже вы, Сенсей.[/log][wa:1370]"
1008903-159 = "― [log=아루 드레스]Хи-хи... Может, я начинаю становиться немного похожей на вас?[/log][wa:3850]"
1008903-162 = "За горячей миской рамена я слушал, как Ару делится своими проблемами."
1008903-163 = "Сначала это были лишь жалобы на трудности «бизнеса.» Но затем она стала хвалить и благодарить сотрудников «Проблемы 68»."
1008903-164 = "Мы разговаривали до поздней ночи. Потом я проводил её домой."
