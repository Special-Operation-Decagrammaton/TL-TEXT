#[!][Data: "20/09"]
[translation]
90100040-1 = "Episódio 04;Uma Nova Base de Operações"
90100040-2 = "Corredor Subterrâneo da Schale"
90100040-4 = ""
90100040-5 = "Tudo bem que viemos junto com o Sensei pra Schale, mas..."
90100040-6 = "Aonde... carambolas a gente tá indo?"
90100040-7 = ""
90100040-9 = ""
90100040-10 = ""
90100040-11 = "Eu nem sonhava que existia uma ala dessas aqui embaixo."
90100040-12 = "Pois é. Da última vez que invadimos, pegamos a rota mais curta até a sala de controle para conter o alvo..."
90100040-13 = "[s1] \"Foi mal, tá meio escuro demais, né?\"\n[s2] \"É uma ala subterrânea que quase nunca usamos... aguentem só mais um pouquinho.\""
90100040-16 = "Pela nossa experiência em operações táticas, estamos plenamente habituadas a ambientes de baixa luminosidade."
90100040-17 = "Contudo, até onde vai essa escadaria interminável?#nEu não fazia ideia de que o subsolo da Schale era tão profundo."
90100040-18 = "[s] \"Para falar a verdade, eu mesmo nunca desci até o fundo daqui......\""
90100040-19 = ""
90100040-21 = "[ns] \"Dá até pra guardar tanques de guerra, deve ter pelo menos uns três andares pra baixo.\""
90100040-22 = "Nem o próprio Sensei sabe a extensão do prédio...#nQual é a verdadeira arquitetura deste complexo afinal?"
90100040-23 = "Deveríamos ter mapeado a planta inteira na nossa última infiltração..."
90100040-24 = "Acho que o Sensei só não teve tempo de vistoriar tudo ainda, né?#nEle vive atolado em trabalho."
90100040-25 = "......Pensando bem, vi um boato bizarro circulando na internet outro dia."
90100040-26 = "Diziam que no fundo do subsolo da Schale tem um quarto secreto proibido até para as alunas de plantão,#ne que qualquer garota que desobedece o Sensei é trancada lá dentro para receber 'punições noturnas'――"
90100040-27 = "Ponto cego ideal para monitoramento, rota de fuga praticamente nula. Para interrogatório e contenção de prisioneiros, o subsolo da Schale seria a escolha tática perfeita."
90100040-28 = "Gente, não viaja na maionese, isso é um exagero sem tamanho!#nE que história é essa de 'punições'..."
90100040-29 = "Não, pior que esse boato... pode ter um fundo de verdade sim!"
90100040-30 = "Quando eu tava coletando informações disfarçada pela cidade, umas alunas de Gehenna me soltaram uma fofoca."
90100040-31 = "Disseram que no armário pessoal do Sensei tem coleiras, algemas de ferro e até uniforme de enfermeira!"
90100040-32 = "Misericórdia......"
90100040-33 = "Se essa lenda for verdade, temos um problema tático gravíssimo para resolver agora mesmo."
90100040-34 = ""
90100040-36 = ""
90100040-37 = "O-O que foi?!"
90100040-38 = "......O Sensei pode acabar descobrindo a cinta modeladora com enchimento que a FOX3 usa por baixo do uniforme."
90100040-39 = "O Sensei parece não ter notado ainda, mas pela honra da FOX3, acho prudente batermos em retirada antes qu――"
90100040-40 = "POR QUE VOCÊS FORAM METER A MINHA ROUPA DE BAIXO NO MEIO DISSO, SUAS MALDITAS?!"
90100040-41 = "Ora, ora... então você não nega que usa enchimento no sutiã, né?"
90100040-42 = "......FOX3, FOX4. Nós temos uma dívida de honra impagável para com o Sensei."
90100040-43 = "Caso ele venha a nos exigir qualquer coisa, fugir ou recusar iria contra todos os princípios morais da nossa conduta."
90100040-44 = "......Diante da magnitude dessa dívida, as calcinhas e sutiãs da Kurumi são meros detalhes insignificantes."
90100040-45 = "CALA A BOCA, YUKINO!!"
90100040-46 = ""
90100040-48 = ""
90100040-49 = "[ns3] \"Vocês tão bem animadas aí atrás, né...\"\n[ns4] \"Do que é que tão falando afinal?\""
90100040-52 = ""
90100040-53 = "N-Não é nada, Sensei! Não se preocupe!"
90100040-54 = "É que fazia tanto tempo que a gente não saía da cela que ficamos meio empolgadas."
90100040-55 = "[s] \"Se é só isso, fico mais tranquilo......\""
90100040-56 = ""
90100040-59 = "[ns] \"Prontinho, chegamos!\""
90100040-62 = ""
90100040-63 = "Aqui é......"
90100040-64 = ""
90100040-65 = "[ns5] \"O novíssimo [ruby=QG]Quartel-General[/ruby] do Esquadrão FOX!\"\n[ns6] \"Arrumei tudo às pressas, então ainda tá meio bagunçado, mas...\""
90100040-68 = "Q-Que instalação impressionante... Eu não imaginava que a Schale escondia uma sala dessas no subsolo..."
90100040-69 = "Paredes com blindagem antiexplosão, circuito fechado de servidores independentes..."
90100040-70 = "Com uma estrutura dessas, dá para traçarmos operações da mesma envergadura da época da Academia Especial SRT!"
90100040-71 = "Sensei, o que era este local originalmente?"
90100040-72 = "[s7] \"Era uma antiga sala de servidores em desuso.\"\n[s8] \"Para ser honesto, eu mesmo só soube da existência dela pela Presidente do Conselho Estudantil Federal.\""
90100040-73 = ""
90100040-74 = ""
90100040-76 = ""
90100040-77 = "[ns9] \"Por isso, nenhuma das alunas de plantão conhece este setor.\"\n[ns10] \"Podem usar o espaço com total segurança para manutenção, descanso e planejamento.\""
90100040-81 = "......Então foi uma gentileza providenciada pela própria Presidente."
90100040-82 = "Estabelecer uma base temporária em um ponto inacessível a civis para rastrear anomalias que ameaçam Kivotos..."
90100040-83 = "De fato, para mantermos o sigilo das alunas e contarmos com a retaguarda do Sensei,#npermanecer no subsolo da Schale é a decisão tática mais acertada."
90100040-84 = "No entanto, ocupar o espaço pessoal do Sensei para as nossas operações nos deixa com certo remorso..."
90100040-85 = ""
90100040-87 = ""
90100040-88 = ""
90100040-89 = "[ns] \"Esta não é uma operação só de vocês.\""
90100040-90 = "......Como assim, Sensei?"
90100040-91 = "[s11] \"A SRT foi criada para resolver os problemas de toda Kivotos, não foi?\"\n[s12] \"Portanto, esta missão é para o bem de todas as alunas de Kivotos.\""
90100040-94 = ""
90100040-96 = ""
90100040-97 = "Já faz algum tempo que venho pensando nisso..."
90100040-98 = "O senhor não costuma ouvir com frequência que é uma pessoa 'suspeita'?"
90100040-99 = "[s] \"Bem... agora que você falou, acho que já ouvi sim......\""
90100040-100 = "Se um pedaço suculento de carne for deixado de bobeira no meio da floresta, qualquer fera desconfiará de imediato."
90100040-101 = "Quando uma presa tão apetitosa aparece sem esforço algum diante dos nossos olhos,#né quase certeza de que se trata de uma armadilha fatal."
90100040-102 = "Porém, ao perceber que não há veneno algum――e que aquele banquete foi preparado exclusivamente para acolhê-la..."
90100040-103 = "Chamar o senhor apenas de 'um adulto excêntrico' já não é suficiente para defini-lo."
90100040-104 = "[s] \"Ué? Eu por acaso falei alguma bobagem?\""
90100040-105 = "......Não, esqueça o que eu disse."
90100040-106 = "Em nome de todo o Esquadrão FOX――reitero nossos mais profundos agradecimentos por todo o seu apoio."
90100040-107 = "A Yukino é certinha demais, credo.#nNão precisava falar parecendo uma estátua de bronze."
90100040-108 = "Mas expressar gratidão é um dever militar essencial."
90100040-109 = "Ai, ai, só de pensar que voltamos à ativa depois de tanto tempo, sinto um formigamento gostoso nos dedos."
90100040-110 = ""
90100040-112 = ""
90100040-113 = "Pois bem, declaro iniciados os preparativos e a coleta de dados da――"
90100040-114 = "[s] \"Não vamos batizar o codinome da operação primeiro?\""
90100040-115 = "......Como andávamos simplificando os processos ultimamente, acabei me esquecendo desse detalhe."
90100040-116 = "Sendo assim, para celebrar o renascimento do Esquadrão FOX, sugiro 'Operação Kon-Kon'――"
90100040-117 = "Não, não, não! Pelo amor de Deus, esse nome é infantil demais da conta!"
90100040-118 = "Pois é. Por que não mantemos a simplicidade tática de sempre, sem inventar firula?"
90100040-119 = ""
90100040-121 = ""
90100040-122 = "Eu entendo o carinho da Yukino... mas acho que desta vez um codinome funcional seria melhor."
90100040-123 = "Como o nosso alvo é rastrear as Lendas Urbanas, que tal 'Operação: Caça às Lendas Urbanas'?"
90100040-124 = "Apoiado com louvor!"
90100040-125 = ""
90100040-127 = ""
90100040-128 = ""
90100040-129 = "............"
90100040-130 = "[s] \"......A gente usa 'Operação Kon-Kon' na próxima missão, que tal?\""
90100040-131 = "......Entendido, Sensei."
90100040-132 = ""
90100040-134 = ""
90100040-135 = "Atenção a todas――iniciar imediatamente a 'Operação: Caça às Lendas Urbanas'."
90100040-137 = "Próximo Episódio;Coleta de Pistas"
