[translation]
90100040-1 = "Эпизод 4;Новая база"
90100040-2 = "Подземный коридор Шале"
90100040-4 = ""
90100040-5 = "Эм, мы были не против пройтись с вами до Шале после ужина, но..."
90100040-6 = "...Где именно мы сейчас?"
90100040-7 = ""
90100040-9 = ""
90100040-10 = ""
90100040-11 = "Я уже второй раз внутри Шале... но раньше этой части здания не видела."
90100040-12 = "Ага. В прошлый раз мы были немного заняты штурмом здания..."
90100040-13 = "[s1] «Прости, здесь немного темно.»\n[s2] «Это подземная зона, которой мы почти не пользуемся. Идите за мной.»"
90100040-16 = "Я привыкла работать в темноте."
90100040-17 = "И всё же лестниц было немало. Насколько глубоко вообще уходит подвал Шале?"
90100040-18 = "[s] «Не знаю. Я никогда не проверял...»"
90100040-19 = ""
90100040-21 = "[ns] «Раз здесь можно хранить танк, наверное, минимум на три этажа вниз?»"
90100040-22 = "Вы управляете этим зданием и даже не знаете его вместимости?"
90100040-23 = "Возможно, во время прошлого проникновения мне стоило тщательнее изучить планировку..."
90100040-24 = "Или, полагаю, Сенсей просто слишком занят, чтобы разбираться в таких вещах?"
90100040-25 = "...Знаете, я читала об этом месте. Кажется, в интернете."
90100040-26 = "Глубоко в подвале Шале Сенсей запирает плохих студентов и подвергает их непристойным и необычным наказаниям..."
90100040-27 = "...Понятно. Если понадобится допрашивать заложника, место идеальное. Надёжная охрана, сбежать практически невозможно."
90100040-28 = "Н-Не кажется ли вам, что этот слух немного перебор? Особенно часть про «непристойные наказания»..."
90100040-29 = "В нём может быть доля правды."
90100040-30 = "Однажды я слышала подозрительный рассказ от студента Геенны."
90100040-31 = "Она сказала, что в личном хранилище Сенсея есть верёвки, наручники и загадочные костюмы медсестры..."
90100040-32 = "Угх..."
90100040-33 = "...И если этот слух правдив, есть проблема куда серьёзнее."
90100040-34 = ""
90100040-36 = ""
90100040-37 = "«Куда серьёзнее»? И что же это?"
90100040-38 = "...Есть риск, что Сенсей узнает о... специальных подкладках FOX 3."
90100040-39 = "Конечно, похоже, [USERNAME] Сенсей пока ничего не заметил, но предлагаю быстро отступить ради сохранения чести FOX 3..."
90100040-40 = "О-О чём ты вообще?! Как извращённость Сенсея связана с моим нижним бельём?!"
90100040-41 = "Хм, то есть ты даже не отрицаешь. Под ним действительно что-то особенное."
90100040-42 = "...FOX 3, FOX 4. Отставить. [USERNAME] Сенсей оказал нам невероятную помощь."
90100040-43 = "Чего бы от нас ни потребовали глубоко в этом зловещем подвале, мы не вправе отказываться и отступать, пока остаёмся у него в долгу."
90100040-44 = "...На этом фоне вставки Куруми не имеют особого значения."
90100040-45 = "Что?! Юкино!!"
90100040-46 = ""
90100040-48 = ""
90100040-49 = "[ns3] «Эм, что-то случилось?»\n[ns4] «Сзади стало шумно...»"
90100040-52 = ""
90100040-53 = "Хаха... Ничего."
90100040-54 = "Мы просто так... рады снова выбраться на задание."
90100040-55 = "[s] «Ну, раз так...»"
90100040-56 = ""
90100040-59 = "[ns] «Мы пришли!»"
90100040-62 = ""
90100040-63 = "Это место..."
90100040-64 = ""
90100040-65 = "[ns5] «Это новая штаб-квартира отряда FOX!»\n[ns6] «Простите за небольшой беспорядок. Я торопился...»"
90100040-68 = "Э-Это огромный подземный комплекс. Никогда бы не подумала, что всё это просто находится под Шале."
90100040-69 = "Здесь даже взрывоустойчивые стены и защищённая внутренняя сеть..."
90100040-70 = "С такой базой мы сможем проводить операции на уровне тех, что выполняли в академии SRT."
90100040-71 = "Сенсей, где именно мы находимся?"
90100040-72 = "[s7] «Это выведенная из эксплуатации серверная.»\n[s8] «О ней мне рассказала президент Генерального ученического совета...»"
90100040-73 = ""
90100040-74 = ""
90100040-76 = ""
90100040-77 = "[ns9] «Большинство студентов, дежурящих в Студенческом совете, о ней не знает...»\n[ns10] «Так что можете спокойно собираться и отдыхать здесь.»"
90100040-81 = "...Понимаю. Президент Генерального ученического совета проявила большую предусмотрительность."
90100040-82 = "Организовать защищённую базу в подвале Шале только ради того, чтобы мы могли отслеживать аномалии по всему Кивотосу..."
90100040-83 = "Согласна, нам лучше оставаться в здании Шале. Здесь мы можем получать вашу поддержку незаметно для остальных студентов, но..."
90100040-84 = "Мне не по себе от того, что мы действуем прямо на вашем рабочем месте. Во время миссии мы наверняка будем вам мешать."
90100040-85 = ""
90100040-87 = ""
90100040-88 = ""
90100040-89 = "[ns] «Это не только „ваша“ миссия.»"
90100040-90 = "...Что ты имеешь в виду?"
90100040-91 = "[s11] «SRT — специальная группа, которая решает „проблемы Кивотоса“, верно?»\n[s12] «Значит, эта миссия — ради ВСЕХ жителей Кивотоса.»"
90100040-94 = ""
90100040-96 = ""
90100040-97 = "...Я уже некоторое время думаю об одном, Сенсей."
90100040-98 = "Другие студенты часто называют вас «подозрительным», разве нет?"
90100040-99 = "[s] «Некоторые, возможно?»"
90100040-100 = "Обычно дикая лиса достаточно умна, чтобы распознать ловушку. Например, когда ей просто так подсовывают аппетитный кусок мяса."
90100040-101 = "Любой сообразительный зверь понимает: если добычу предлагают без усилий, скорее всего, это приманка."
90100040-102 = "Но в тот момент, когда лиса понимает, что это не приманка для капкана, а подарок, настоящий пир..."
90100040-103 = "...Она может научиться доверять руке, которая его предложила."
90100040-104 = "[s] «Так ты считаешь меня „подозрительным“?»"
90100040-105 = "...Нет."
90100040-106 = "От имени отряда FOX я ещё раз благодарю вас за щедрую поддержку."
90100040-107 = "Ну ты даёшь, Юкино. Не обязательно всё время быть такой официальной."
90100040-108 = "Важно искренне выражать благодарность! Верно?"
90100040-109 = "Хи-хи. Конечно. Просто я так воодушевлена тем, что мы снова отправляемся на миссию!"
90100040-110 = ""
90100040-112 = ""
90100040-113 = "Верно. Тогда начнём планирование и сбор улик согласно распоряжению Генерального ученического совета..."
90100040-114 = "[s] «Вы дадите миссии название?»"
90100040-115 = "...Ах, я упустила это. В последнее время мы слишком всё упрощали."
90100040-116 = "Раз уж мы празднуем возвращение отряда FOX и хотим себя поздравить, как насчёт... «Операции Кон-Кон»?"
90100040-117 = "Ох, ужасное название. Мы что, дети?"
90100040-118 = "Ага. Звучит слабовато. Давайте проще."
90100040-119 = ""
90100040-121 = ""
90100040-122 = "Мне нравится твой энтузиазм, Юкино... Но, может, в этот раз назовём прямо и понятно, чтобы снова втянуться?"
90100040-123 = "Например, «Операция: Погоня за Преданиями» — ведь мы охотимся за неуловимыми «Преданиями»..."
90100040-124 = "Возражений нет!"
90100040-125 = ""
90100040-127 = ""
90100040-128 = ""
90100040-129 = "..."
90100040-130 = "[s] «...В следующий раз можем использовать твоё название.»"
90100040-131 = "...Понятно."
90100040-132 = ""
90100040-134 = ""
90100040-135 = "Итак, отряд FOX. Начинаем операцию «Погоня за Преданиями»!"
90100040-137 = "Следующий эпизод;Местонахождение туза"
