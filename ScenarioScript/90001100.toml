[translation]
90001100-1 = "Эпизод 10;Наследие Безымянных богов"
90001100-2 = "Подведём итог: мы проследовали за Хокмой от Ледникового моря сюда и раскрыли её деятельность в вулканическом районе."
90001100-3 = "Полагаем, она добывала ресурсы для перевозки во второе место."
90001100-4 = "Да. Мы наблюдали, как она строила транспортные маршруты, хотя пока неясно, куда отправляются ресурсы. И в районе ещё остались объекты."
90001100-5 = "Провести разведку района, госпожа Рио, президент Химари?"
90001100-6 = "Да. Спасибо, Токи."
90001100-7 = ""
90001100-9 = ""
90001100-10 = ""
90001100-11 = ""
90001100-13 = ""
90001100-14 = "Мне присоединиться к ней?"
90001100-15 = "Нет. Для тебя у меня отдельная задача, Эйми."
90001100-16 = "Что такое?"
90001100-17 = "Нужно проанализировать оставшиеся объекты Декаграмматона."
90001100-18 = "Моя задача — добыть образцы."
90001100-19 = "Именно. В таком деле чем больше образцов, тем лучше."
90001100-20 = ""
90001100-22 = ""
90001100-23 = ""
90001100-24 = ""
90001100-25 = ""
90001100-26 = ""
90001100-27 = "...? Что ты делаешь, Рио?"
90001100-29 = ""
90001100-30 = "Хм? Разве ты не сказала, что тебе нужно больше образцов?"
90001100-31 = "То есть ты... предлагаешь помочь?"
90001100-32 = "...Обязательно было проговаривать это вслух? Глупость какая-то."
90001100-33 = "Ладно. Отлично. Тогда давайте уже закончим, хорошо?"
90001100-34 = "[s] «Несмотря ни на что...»"
90001100-35 = ""
90001100-37 = ""
90001100-38 = "[ns] «Вы две близкие подруги!»"
90001100-39 = "Определённо нет!"
90001100-40 = "Вы совершенно ошибаетесь, Сенсей."
90001100-44 = ""
90001100-45 = ""
90001100-46 = "Этих образцов хватит, президент?"
90001100-47 = "Да. Этого должно хватить, Эйми. Анализ почти завершён. Рио, получаешь результаты?"
90001100-48 = "Получение подтверждено. Я сделала несколько выводов."
90001100-49 = "О, вот как? Ну, продолжай."
90001100-50 = "Считаю это вопросом большой важности. Мы можем подтвердить всё на месте."
90001100-51 = "В образцах я обнаружила следы реконструкции материи."
90001100-52 = "А, вижу. Мы уже сталкивались с чем-то подобным."
90001100-53 = "[s] «А? Сталкивались?»"
90001100-54 = "Да, Сенсей. Помните Ковчег Атрахасиса?"
90001100-55 = "И то, что случилось с объектом— то есть, с Алисой и Кей?"
90001100-56 = ""
90001100-58 = ""
90001100-67 = "[ns] «А!»"
90001100-68 = ""
90001100-69 = "Да, именно, Сенсей."
90001100-70 = "Да. То же самое."
90001100-71 = "Реконструкция материи — одна из характерных сил Безымянных богов."
90001100-72 = "Подтвердить наверняка невозможно, поскольку у нас нет прямого доступа к Хокме. Но если посмотреть на методы добычи ресурсов, транспортные объекты и даже сами силы..."
90001100-73 = "Да. Всё это было создано посредством реконструкции материи... силой Безымянных богов."
90001100-74 = "И теперь, думаю, наша гипотеза почти доказана."
90001100-75 = "[s] «Доказана?»"
90001100-76 = "Да. Все кусочки сходятся. —"
90001100-77 = ""
90001100-79 = ""
90001100-80 = ""
90001100-83 = ""
90001100-84 = "Асума Токи докладывает. Я вернулась."
90001100-85 = "Я подтвердила наличие поспешно построенных рельсов, ведущих из вулканического района. Вдоль путей также размещены несколько небольших оборонительных отрядов."
90001100-86 = "[s] «Хорошо. Отличная работа, Токи.»"
90001100-87 = "Да. Разумеется. Сенсей, вам следует смелее и активнее осыпать меня комплиментами."
90001100-88 = ""
90001100-90 = ""
90001100-92 = ""
90001100-93 = "Если конкретнее, вот несколько вариантов: погладить по голове, слегка обнять или положить руки мне на талию."
90001100-94 = ""
90001100-95 = ""
90001100-96 = "Сенсей? Почему вы вдруг смутились?"
90001100-97 = "Токи...?"
90001100-99 = ""
90001100-100 = "Я бы не стала задаваться этим вопросом, госпожа Рио. Не могу сказать, показала ли она истинную натуру или просто изменилась, но теперь Токи именно такая."
90001100-101 = "...Продолжим, Сенсей."
90001100-102 = "[s] «Д-Да! Что ты имела в виду, говоря, что все кусочки сходятся?»"
90001100-103 = "...Разочаровывает."
90001100-104 = "До прибытия в Ледниковое море Отряд Исследования Сверхъестественного столкнулась с тремя пророками Декаграмматона: Бина, Хесед и Ход..."
90001100-105 = "Ни один из этих трёх пророков не был связан с силой Безымянных богов."
90001100-106 = "Но у Гебуры и Хокмы, пророков, которых мы встретили здесь, мы обнаружили следы силы Безымянных богов."
90001100-107 = "Что могло бы объяснить довольно сюрреалистичную сцену корабля, плавающего по лаве, которую мы все наблюдали."
90001100-108 = "[s1] «То есть точно известно, что Декаграмматон и его пророки...»\n[s2] «...уже используют силу Безымянных богов, верно?»"
90001100-111 = "Да. Похоже, это неоспоримый факт."
90001100-112 = "Настоящий вопрос в том, что они собираются делать с этой силой."
90001100-113 = ""
90001100-116 = "Что—?! Рио, только что...?!"
90001100-117 = "Да. Я тоже фиксирую это отсюда."
90001100-118 = ""
90001100-120 = ""
90001100-121 = ""
90001100-123 = "Что такое, президент? Что-то случилось?"
90001100-124 = "Вы что-то нашли, госпожа Рио? Пожалуйста, объясните."
90001100-125 = ""
90001100-127 = ""
90001100-128 = ""
90001100-129 = ""
90001100-130 = ""
90001100-131 = ""
90001100-132 = ""
90001100-133 = ""
90001100-134 = ""
90001100-135 = ""
90001100-136 = ""
90001100-137 = ""
90001100-138 = "Да. Если такое произошло... нас ждёт серьёзная чрезвычайная ситуация."
90001100-139 = "Иными словами, мы обнаружили нового пророка."
90001100-140 = "Но совершенно другого масштаба."
90001100-141 = ""
90001100-143 = ""
90001100-145 = "Сигнал очень, очень мощный."
90001100-147 = "Следующий эпизод;Тупик"
