[translation]
1002402-1 = "Велопутешествие по Кивотосу"
1002402-2 = "Я прибыл к главным воротам Абидоса как раз тогда, когда Широко выезжала на велосипеде."
1002402-5 = "А? Сенсей?"
1002402-6 = "[s1] «Широко?!»\n[s2] «Ч-Что случилось? Что-то произошло?!»"
1002402-7 = "А? Почему ты так напряжён?"
1002402-8 = "А? Почему ты так напряжён?"
1002402-9 = "Я проехала пару сотен кругов по трассе, чтобы перед отъездом убедиться, что все передачи работают нормально."
1002402-10 = "Что ты делаешь здесь так рано, Сенсей?"
1002402-11 = "...!"
1002402-12 = "Только не говорите..."
1002402-13 = ""
1002402-15 = ""
1002402-16 = ""
1002402-17 = "Ты наконец заинтересовался тренировками?"
1002402-18 = "В таком случае хочешь присоединиться?"
1002402-19 = "Я собираюсь объехать Кивотос по кругу."
1002402-20 = "[s] «По кругу вокруг Кивотоса?»"
1002402-21 = "Да. Как я писала тебе раньше, какое-то время со мной может быть трудно связаться."
1002402-22 = "Благодаря тому, что ты для нас сделал, в моём расписании появилось больше времени на такие спокойные занятия."
1002402-23 = "Я очень давно хотела попробовать дальнюю поездку, поэтому решила, что сейчас подходящий момент."
1002402-24 = "Проще говоря, я просто буду ехать из одного места в другое по шоссе Кивотоса."
1002402-25 = "Полный круг по всему Кивотосу занял бы у меня несколько месяцев."
1002402-26 = "[s] «А, вот чем ты собираешься заниматься.»"
1002402-27 = "Почему ты выглядишь таким облегчённым?"
1002402-28 = "Прости. Наверное, я сказала что-то, что можно было неправильно понять."
1002402-29 = "Я всего лишь говорила о своём увлечении. Не хотела заставлять тебя переживать."
1002402-30 = "[s] «Ты поедешь одна?»"
1002402-31 = "Да... Я звала остальных, но им, похоже, это неинтересно."
1002402-32 = "В среднем на 4000 километров уходит около трёх недель... но, думаю, дизайн велокостюмов тоже повлиял на их решение."
1002402-33 = "Однако такие костюмы необходимы для дальних поездок."
1002402-34 = "[s] «...»"
1002402-35 = "Хм? Не переживай за меня, Сенсей. Я к этому тренировалась."
1002402-36 = ""
1002402-37 = ""
1002402-38 = "Я ещё провела обслуживание велосипеда. У меня есть запасные камеры, инструменты для ремонта, переносной насос и походные принадлежности с гигиеническими средствами для ночёвок на улице."
1002402-39 = "[s] «Ты ещё и ночевать будешь под открытым небом?!»"
1002402-40 = "Да. На некоторых участках придётся по несколько дней ехать по безлюдным дорогам."
1002402-41 = "При необходимости я могу не спать три дня, но предпочла бы этого не делать. Я знаю, что отдых важен, поэтому заранее предусмотрела остановки."
1002402-42 = "О, и на всякий случай я взяла эту маску."
1002402-43 = "[s] «Вот это я заберу!»"
1002402-44 = "Но почему...?"
1002402-45 = "[s] «Я всё ещё переживаю. Ты уверена, что справишься?»"
1002402-46 = "Лично я не думаю, что есть о чём беспокоиться."
1002402-47 = "..."
1002402-48 = "Но, видя, насколько ты переживаешь, я начинаю сомневаться."
1002402-49 = "Может, отложить поездку?"
1002402-50 = "А?"
1002402-51 = "Думаешь, не стоит? Но ты только что говорил, что переживаешь."
1002402-52 = "[s3] «Просто... обязательно почаще выходи на связь.»\n[s4] «Хочу, чтобы ты регулярно писала мне в MomoTalk.»"
1002402-53 = "Сообщений в MomoTalk будет достаточно?"
1002402-54 = "Сообщений в MomoTalk будет достаточно?"
1002402-55 = "О."
1002402-56 = "И правда. Во время поездки я всегда смогу связаться с тобой через MomoTalk."
1002402-57 = "Главное — писать тебе достаточно часто?"
1002402-58 = "[s5] «Да, пока мы можем связаться друг с другом.»\n[s6] «Иногда я, возможно, сам буду приезжать тебя искать.»"
1002402-61 = ""
1002402-63 = ""
1002402-64 = ""
1002402-65 = ""
1002402-66 = "Спасибо, Сенсей. Теперь мне немного спокойнее."
1002402-67 = "Обязательно буду писать тебе... на каждой остановке."
1002402-68 = "Увидимся позже, Сенсей."
1002402-69 = "[s] «Счастливого пути.»"
1002402-70 = "Да."
