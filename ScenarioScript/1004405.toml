[translation]
1004405-1 = "Звёзды на песке"
1004405-2 = "Я не мог уснуть, поэтому вышел подышать воздухом."
1004405-5 = "Все спали, и слышно было только стрекотание сверчков."
1004405-6 = ""
1004405-9 = "[ns1] «Кто-то не спит?»\n[ns2] Пойти туда, откуда донёсся звук."
1004405-15 = "Я подумала, что это можете быть вы."
1004405-16 = "[s3] «А, конечно.»\n[s4] «Этот голос...!»"
1004405-17 = ""
1004405-18 = ""
1004405-21 = ""
1004405-22 = "Хи-хи-хи. Я спряталась, чтобы вас удивить!"
1004405-23 = "Почему вы вышли в такой час?"
1004405-24 = "Вы чем-то... занимаетесь?"
1004405-25 = "[s5] «Я пошёл за тобой.»\n[s6] «Хотел немного подышать воздухом.»"
1004405-26 = "Хм... Вы странный, Сенсей."
1004405-27 = "Хм... Я вам поверю."
1004405-28 = "Хи-хи. В последнее время мне трудно заснуть."
1004405-29 = ""
1004405-31 = ""
1004405-32 = "Может, прогулка поможет!"
1004405-37 = "Ага, ага!"
1004405-38 = "Эм..."
1004405-39 = "[s7] «...Нономи?»\n[s8] «Что случилось?»"
1004405-40 = ""
1004405-41 = ""
1004405-43 = ""
1004405-44 = "А, ничего."
1004405-45 = "Я просто... думала, почему в последнее время не могу уснуть."
1004405-46 = "Такое чувство, будто..."
1004405-47 = "Не знаю почему, но... мне кажется, что спать — пустая трата времени."
1004405-48 = "Когда я засыпаю, завтра наступает так быстро! Кажется, будто я теряю столько времени..."
1004405-49 = "Здесь было так весело. Думаю, поэтому мне грустно из-за того, что время уходит."
1004405-50 = "Я говорю какую-то ерунду. Хаха..."
1004405-51 = "А?"
1004405-52 = "Куда ты идёшь?"
1004405-53 = "Что вы хотите мне показать?"
1004405-54 = "Но пляж в другой стороне."
1004405-55 = "Уже поздно. Так далеко от курорта может быть небезопасно!"
1004405-56 = "Хм?"
1004405-57 = "Вы мой опекун, значит всё в порядке?"
1004405-58 = ""
1004405-60 = ""
1004405-61 = "...Это правда."
1004405-62 = ""
1004405-64 = ""
1004405-65 = ""
1004405-67 = "Хорошо, я пойду за своим опекуном!"
1004405-71 = ""
1004405-72 = "Мы на пляже! Ночью!"
1004405-73 = ""
1004405-76 = "Здесь прохладно и приятно. Ветер чувствуется особенно хорошо."
1004405-77 = "На этом острове больше никто не живёт... поэтому нигде нет огней, и звёзды сияют ярче обычного."
1004405-78 = ""
1004405-80 = ""
1004405-81 = "Сенсей?"
1004405-82 = "[s] «...Нономи.»"
1004405-84 = "[ns9] «Посмотри туда.»\n[ns10] «Там тоже есть звёзды.»"
1004405-85 = ""
1004405-86 = ""
1004405-88 = "...?"
1004405-89 = ""
1004405-91 = ""
1004405-92 = ""
1004405-93 = "...!!!"
1004405-96 = "― Смотрите, Сенсей! Оно сверкает![wa:2010]"
1004405-98 = "― Океан похож на ночное небо![wa:200]"
1004405-101 = "― Вы..."
1004405-103 = "― привели меня сюда, чтобы показать это?[wa:640]"
1004405-106 = "― Если подумать...[wa:110]"
1004405-108 = "― Кажется, я видела это в буклете.[wa:410]"
1004405-111 = "― «Планктон ночью сияет, как звёзды...»[wa:2350]"
1004405-113 = "― Как красиво.[wa:1300]"
1004405-116 = "[ns11] «Довольна?»\n[ns12] «Тебе стало немного лучше?»"
1004405-117 = "― Хи-хи. Может быть?[wa:4820]"
1004405-118 = "― Хи-хи. Может быть?[wa:4820]"
1004405-121 = "― Я шучу.[wa:1110]"
1004405-123 = "― Думаю, сегодня я смогу хорошо выспаться.[wa:50]"
1004405-126 = "― Спасибо, Сенсей.[wa:1670]"
1004405-128 = "― Сегодня всё было как во сне.[wa:640]"
1004405-131 = "― Ну... я рада, что смогла приехать на этот остров.[wa:1030]"
1004405-134 = "― Но ещё совсем чуть-чуть...[wa:1720]"
1004405-136 = "― Ещё немного... вы можете побыть со мной?[wa:1000]"
