[translation]
10004040-1 = "Эпизод 4;Диверсант в форме"
10004040-2 = "Персиковый источник"
10004040-3 = "Это чайный дом Шаньхайцзина — Источник персикового цветка!"
10004040-4 = "Студенты Шаньхайцзина часто пьют чай здесь после еды вместо похода в кафе."
10004040-5 = "Чай здесь не только пахнет божественно, но и помогает переварить тяжёлую пищу."
10004040-6 = "Это место не так знаменито, как Момоёдо академии Хяккияко, но вкус и аромат чая здесь лучшие во всём Кивотосе!"
10004040-7 = "[s] «Думаешь, Шун здесь?»"
10004040-8 = "Эм... не уверена."
10004040-9 = "Д-Давайте выпьем чашечку чая и подождём. Кто знает? Может, Шун заглянет сюда."
10004040-10 = "В Источнике персикового цветка есть и вкусные сладости к чаю. О, вон там лунный пряник с зелёным чаем."
10004040-11 = "[s] «Ты ведёшь себя подозрительно...»"
10004040-12 = ""
10004040-15 = ""
10004040-16 = "А? Вы тот самый сенсей из Шале."
10004040-17 = "Не ожидала встретить вас в таком месте."
10004040-18 = "(Уф. Ещё одна помеха.)"
10004040-19 = "[s1] «Привет, Кирино.»\n[s2] «Что студент Валькирии делает в районе Шаньхайцзина?»"
10004040-20 = "О, я здесь не по работе. Это исключительно личное."
10004040-21 = "О, я здесь не по работе. Это исключительно личное."
10004040-22 = "Ничего особенного... но я услышала странный слух от Бюро безопасности."
10004040-23 = "[s] «Слух?»"
10004040-25 = "Вы ведь знаете о Генрюмон, студсовете Шаньхайцзина, и Променаде Чёрной Черепахи, торговой ассоциации?"
10004040-26 = "[s] «Немного.»"
10004040-27 = "Обе группы — крупные организации Шаньхайцзина, и каждая считает другую главным препятствием для развития школы. Они уже давно ищут момент, чтобы раздавить соперника."
10004040-28 = "Согласно совершенно секретным данным, которые недавно получило Бюро безопасности..."
10004040-29 = "...в район Шаньхайцзина поступает крупная партия огнестрельного оружия неизвестного происхождения!"
10004040-30 = "Рано или поздно между Генрюмон и Променадом Чёрной Черепахи может начаться крупный конфликт."
10004040-31 = "[s3] «Ничего хорошего это не сулит...»\n[s4] «Тебе вообще можно мне это рассказывать?»"
10004040-32 = "Т-Так что, эм, мне придётся попросить вас..."
10004040-33 = "Т-Так что, эм, мне придётся попросить вас..."
10004040-34 = "Пожалуйста, сохраните это в тайне!"
10004040-35 = "В любом случае! Как кадет Полицейской школы Валькирия, я не могу просто ждать, пока в центре города начнётся крупномасштабное насилие и поставит наших студентов под угрозу."
10004040-36 = "К тому же если я сама прекращу борьбу между Генрюмон и Променадом, начальство наверняка признает мои способности!"
10004040-37 = "Это может быть золотой шанс выбраться из Бюро общественной безопасности и перевестись в Бюро безопасности!"
10004040-38 = "[s5] «Понятно. Удачи!»\n[s6] «Надеюсь, всё получится.»"
10004040-39 = "Спасибо, Сенсей. Моя обязанность как офицера — бороться за безопасность граждан!"
10004040-40 = "Спасибо, Сенсей. Моя обязанность как офицера — бороться за безопасность граждан!"
10004040-41 = "Кстати, а вы что здесь делаете, Сенсей? Не похоже, что вы пришли только попить чаю..."
10004040-42 = "[s] Спросить, не видела ли она Шун."
10004040-43 = "Шун... Вы о высокой инструкторше из Сада сливового цветка?#nЯ её здесь не видела."
10004040-44 = "Это как-то связано с тем маленькым студентом рядом с вами?"
10004040-45 = "[s] Объяснить, что произошло до сих пор."
10004040-46 = "Тогда предоставьте это мне. Я всё равно патрулирую здесь."
10004040-47 = "Заодно отведу Шунлинь обратно в Сад Цветущей Сливы."
10004040-48 = "Забота о потерявшихся детях — одна из важных задач Бюро общественной безопасности!"
10004040-49 = "[s] «Спасибо. Я был бы очень признателен.»"
10004040-51 = "Ч-что?!"
10004040-52 = ""
10004040-54 = "(Кто этот студент-полицейский?! Почему она мешает мне проводить время с Сенсеем?!)"
10004040-55 = "(И вдобавок она так непринуждённо разговаривает с Сенсеем [USERNAME]... Мне это совсем не нравится!)"
10004040-56 = "(Ничего личного, но тебе придётся уйти!)"
10004040-57 = ""
10004040-59 = "О! Там офицер Генрюмон с большой страшной пушкой!"
10004040-60 = "А? Нет... Неужели борьба между двумя группами уже началась?"
10004040-61 = "Простите, Сенсей. Сейчас мой главный приоритет — не дать конфликту вспыхнуть."
10004040-63 = "Кирино к вашим услугам!"
10004040-64 = ""
10004040-66 = ""
10004040-68 = "Фух, наконец-то помеха ушла."
10004040-69 = ""
10004040-71 = ""
10004040-72 = ""
10004040-73 = "Ну что, выпьем чаю и хорошо проведём время?"
10004040-76 = ""
10004040-77 = ""
10004040-78 = ""
10004040-79 = "О-Обман!"
10004040-80 = "А? Уже вернулась, госпожа полицейская?"
10004040-81 = "Что это значит, Шунлинь?! Я расспросила студентов снаружи, но никто не видел ни студента с тяжёлым оружием, ни тем более офицера Генрюмон!"
10004040-82 = ""
10004040-83 = "Ты дала полиции ложную информацию. Это воспрепятствование правосудию — серьёзное преступление!"
10004040-84 = "Но я правда видела, как кто-то из Генрюмон проходил мимо..."
10004040-85 = "Вы будете меня наказывать?"
10004040-86 = ""
10004040-87 = "У-ух..."
10004040-88 = ""
10004040-89 = "Было бы нелепо злиться на маленького ребёнка из-за простого недоразумения."
10004040-90 = ""
10004040-91 = "В любом случае, не хочу больше мешать Сенсею, так что сейчас просто отведу тебя в Сад сливового цветка..."
10004040-92 = "О! Это девушки с Променада Чёрной Черепахи несут ножи?"
10004040-93 = ""
10004040-94 = "Ах! Я не могу позволить этой холодной войне стать горячей!"
10004040-95 = ""
10004040-96 = "Кирино к вашим услугам!"
10004040-97 = ""
10004040-99 = ""
10004040-100 = "Похоже, эта полицейская девушка совсем не учится на ошибках."
10004040-101 = "А теперь вернёмся к чаю и этой рисовой лепёшке с бобами!"
10004040-103 = ""
10004040-104 = ""
10004040-105 = ""
10004040-106 = "Я должна была это предвидеть."
10004040-107 = "Так, даже если ты маленький ребёнок, ты дважды соврала полиции. Теперь у тебя большие неприятности!"
10004040-108 = ""
10004040-109 = "Извините, госпожа полицейская..."
10004040-110 = "Что ещё?"
10004040-111 = "Те плохие девочки там пристают к сотруднице."
10004040-112 = "Ха! Первый раз обманула — стыд тебе. Второй раз... тоже стыд тебе! Но третий? Ни за что!"
10004040-113 = ""
10004040-115 = ""
10004040-117 = "Что это за убогая чайная?"
10004040-118 = "И что за меню? Один горький противный чай! Что за чайная без молочного чая с тапиокой?"
10004040-119 = "Н-Но это традиционный чайный дом, поэтому у нас нет современных..."
10004040-120 = "Ты СЕРЬЁЗНО думаешь, что спорить с клиентом — хорошая идея? А?!"
10004040-121 = "Мы хотим блинчики со свежими сливками и молочный чай с тапиокой!"
10004040-123 = "Хм. Вот как."
10004040-124 = "Эй, стоять! Ни один нарушитель не будет угрожать безопасности наших граждан!"
