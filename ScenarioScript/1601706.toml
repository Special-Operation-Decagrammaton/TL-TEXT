[translation]
1601706-1 = "Ненавижу этот мир (без тебя)"
1601706-2 = "Получив сообщение от Аобы, я отправился в ремонтное депо."
1601706-3 = ""
1601706-8 = ""
1601706-9 = ""
1601706-10 = ""
1601706-11 = "А, С-Сенсей..."
1601706-12 = "Т-Ты правда пришёл... снова..."
1601706-13 = "[s1] «Как я и говорил, я всегда стараюсь отвечать.»\n[s2] «Не уверен, насколько смогу помочь, но я здесь.»"
1601706-16 = "Я-Я уверена, ты очень поможешь!"
1601706-17 = "Даже если ты просто посидишь рядом и ничего не будешь делать, мне уже будет хорошо от того, что ты здесь."
1601706-18 = ""
1601706-20 = ""
1601706-21 = "Хм? Ты не можешь просто сидеть и ничего не делать...?"
1601706-22 = "К-Как и ожидалось от Сенсея..."
1601706-23 = "Ладно, тогда забудь, что я это сказала."
1601706-24 = "ВОЗВРАЩАЯСЬ к делу: работы у меня действительно много... и я хотела спросить, не мог бы ты помочь."
1601706-25 = "[s] «С радостью!»"
1601706-28 = "Я переоделся в принесённую рабочую одежду и начал помогать Аобе с обслуживанием."
1601706-31 = ""
1601706-32 = ""
1601706-35 = ""
1601706-36 = ""
1601706-37 = ""
1601706-38 = ""
1601706-45 = ""
1601706-46 = ""
1601706-47 = "Я почти не понимал, что делаю, но старался точно следовать её указаниям."
1601706-49 = "Спустя некоторое время..."
1601706-52 = "Е-Если затянуть вот этот винт..."
1601706-53 = ""
1601706-55 = ""
1601706-56 = ""
1601706-57 = "...Готово! Закончили...!"
1601706-58 = "[s] «Ура, мы справились!»"
1601706-59 = "Мы закончили всё за один день..."
1601706-60 = "И всё благодаря тебе, Сенсей!"
1601706-61 = "[s] «Мы неплохо сработались.»"
1601706-62 = "Д-Да! Хотя для тебя это был, так сказать, первый рабочий день. Ты потрясающий!"
1601706-63 = "Ой, уже столько времени..."
1601706-64 = "...да, переоденемся и будем заканчивать."
1601706-71 = ""
1601706-72 = ""
1601706-73 = "..."
1601706-74 = "(И-Интересно, откуда всё время тянет запахом масла...)"
1601706-75 = "..."
1601706-76 = "...А?"
1601706-77 = "(Н-Неужели...?)"
1601706-78 = ""
1601706-80 = ""
1601706-81 = ""
1601706-82 = ""
1601706-83 = ""
1601706-85 = "А-А-а...!!"
1601706-86 = "[ns] «А-Аоба?»"
1601706-87 = ""
1601706-92 = "― [log=아오바]Н-Не заходи сюда... Уф...![/log][wa:1930]"
1601706-95 = "[ns] «Погоди, стой...»"
1601706-96 = "― [log=아오바]М-Моя... одежда...[/log][wa:3960]"
1601706-99 = "― [log=아오바]...от неё ужасно пахнет м-маслом...[/log][wa:880]"
1601706-101 = "― [log=아오바]Нет... Так совсем нельзя...[/log][wa:50]"
1601706-104 = "― [log=아오바]Я-Я просто сниму это...[/log][wa:10]"
1601706-106 = "― [log=아오바]Так что, пожалуйста... подожди там...![/log][wa:1830]"
1601706-109 = "[ns3] «Эй-эй!»\n[ns4] «Так станет только хуже — сразу в нескольких смыслах!»"
1601706-110 = "― [log=아오바]А? Что... ты имеешь в виду...?[/log][wa:3700]"
1601706-111 = "― [log=아오바]А? Что... ты имеешь в виду...?[/log][wa:3700]"
1601706-114 = "― [log=아오바]...Эм... Ну...[/log][wa:3820]"
1601706-117 = "― [log=아오바]...А-а?! Н-Ну...[/log][wa:1340]"
1601706-119 = "― [log=아오바]У-Уааа!![/log][wa:900]"
1601706-122 = "Я поспешно вышел из комнаты и подождал, пока она закончит."
1601706-126 = "..."
1601706-127 = "Я-Я переоделась в чистую одежду..."
1601706-128 = "Так что теперь от меня не пахнет. Можем спокойно закончить смену."
1601706-129 = "[s] «Отлично, тогда пойдём?»"
1601706-130 = "Ага!"
1601706-137 = "Н-На улице так приятно и свежо..."
1601706-138 = "Если бы тебя не было, рабочий день выдался бы тяжёлым."
1601706-139 = "[s] «У тебя все рабочие дни такие?»"
1601706-140 = "Наверное, большинство. Ну, то есть..."
1601706-141 = "Это единственное ремонтное депо поблизости..."
1601706-142 = "И-И со всем, что происходит вокруг, поезда постоянно требуют ремонта..."
1601706-143 = "[s] «На тебе и правда очень много всего, да?»"
1601706-144 = "В-Вообще-то теперь это уже не кажется таким тяжёлым, как раньше..."
1601706-145 = "Не знаю почему. Почти ничего ведь не изменилось..."
1601706-146 = "..."
1601706-147 = ""
1601706-149 = ""
1601706-150 = "Ах."
1601706-151 = ""
1601706-155 = ""
1601706-156 = "А... А-а..."
1601706-157 = "Т-Так вот почему... Ха, хаха..."
1601706-158 = "[s] «Хм? Случилось что-то хорошее?»"
1601706-159 = ""
1601706-161 = ""
1601706-162 = "М-Можно и так сказать! Ахаха..."
1601706-163 = "Ч-Что-то... Да, случилось кое-что хорошее."
1601706-164 = "[s] «Рад это слышать.»"
1601706-165 = "Что-то хорошее..."
1601706-166 = "Очень хорошее."
1601706-167 = ""
1601706-169 = ""
1601706-170 = "Раньше я... чувствовала себя иначе."
1601706-172 = "Каждый день мне всё осточертевало... Всё, на что меня хватало, — рухнуть в кровать и уснуть."
1601706-173 = "И желать, чтобы солнце больше никогда не взошло."
1601706-174 = "Я кое-как переживала один день, а впереди меня ждал только следующий — точно такой же."
1601706-175 = ""
1601706-177 = "[ns] «...»"
1601706-178 = "Но теперь всё иначе."
1601706-179 = "Перед сном я жду следующего дня."
1601706-180 = "Думаю о том, что может случиться и каким он будет."
1601706-181 = "Даже если это будет самый обычный день."
1601706-182 = "Странно, правда...? Работы у меня всё столько же..."
1601706-183 = "...офицеры всё так же раздражают..."
1601706-184 = "..."
1601706-185 = "...но да, кажется, впервые в жизни я каждый день жду завтрашнего дня."
1601706-186 = "То, что... одно лишь существование кого-то... может настолько всё изменить..."
1601706-187 = "[s5] «Это замечательно, Аоба!»\n[s6] «Надеюсь, впереди тебя ждёт ещё больше хорошего!»"
1601706-188 = ""
1601706-189 = ""
1601706-191 = ""
1601706-192 = "Фуфу... Да, я тоже."
1601706-193 = "Больше хорошего. Больше хороших дней."
1601706-195 = "Таких, как этот..."
