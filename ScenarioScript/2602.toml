[translation]
2602-1 = "Игрушка для взрослых. Часть 2"
2602-2 = "Шаньхайцзин, Персиковый источник"
2602-3 = "Обычно после работы у меня никогда не бывает столько свободного времени."
2602-4 = "Самое время расслабиться за чашкой чая и медитацией."
2602-5 = "Это ведь она, да? Преподавательница из Сада сливовых цветов, которая купила... ну, сама знаешь."
2602-6 = "Я всегда думала, что она такая милая и невинная, но если в свободное время занимается такими вещами, кто знает, что ей вообще нравится?"
2602-7 = "...Кстати, на Променаде Чёрной Черепахи и правда можно купить такие вещи?"
2602-8 = "Похоже, на Променаде действительно есть всё."
2602-9 = "Хм. Почему мне кажется, что остальные на меня смотрят?"
2602-10 = "В последнее время, когда бы я ни шла по улицам Шаньхайцзина, кажется, будто все студенты на меня глазеют."
2602-11 = "Вроде бы я ничего плохого не сделала. Интересно, что происходит."
2602-12 = "[s] «Привет, Шун.»"
2602-13 = "О. Здравствуйте, Сенсей. Давно не виделись."
2602-14 = "Вы пришли выпить чаю?"
2602-15 = "[s] «Угадала. Ты тоже отдыхаешь?»"
2602-16 = "Вообще-то я уже закончила на сегодня, поэтому пытаюсь насладиться свободным временем."
2602-17 = "Ах. Значит, вы заметили, что меня что-то беспокоит."
2602-18 = "Вы, как всегда, очень проницательны, Сенсей."
2602-19 = "Ничего серьёзного — просто мелочь, которая не даёт мне покоя."
2602-20 = "[s1] «Если хочешь, всегда можешь рассказать мне.»\n[s2] «Сенсей должен выслушивать своих студентов.»"
2602-21 = "Спасибо. Тогда скажу честно."
2602-22 = "Спасибо. Тогда скажу честно."
2602-23 = ""
2602-25 = ""
2602-26 = ""
2602-27 = "Почему-то мне кажется, что другие студенты в последнее время странно на меня смотрят."
2602-28 = "Даже те, кто обычно относится ко мне особенно тепло, начали держаться на расстоянии. Я даже не могу спокойно посидеть здесь, в чайном доме, не чувствуя, что обо мне шепчутся."
2602-29 = "Но сколько ни вспоминаю, ничего такого, чем могла бы это заслужить, мне в голову не приходит."
2602-30 = "[s3] «Эм...»\n[s4] «Возможно, это из-за...»"
2602-31 = "Вы что-то знаете, Сенсей?"
2602-32 = "Вы что-то знаете, Сенсей?"
2602-33 = "Если я неосознанно сделала что-то плохое, пожалуйста, скажите!"
2602-34 = "[s] Рассказать Шун, с чего, скорее всего, начался слух."
2602-36 = ""
2602-37 = "Что?! Вы думаете, слухи связаны с тем, что я купила игрушку для взрослых?!"
2602-38 = "[s] «Тебя все слышат.»"
2602-39 = "О-Ой... Кажется, я немного вспылила."
2602-40 = "Н-Но важнее другое: как вообще мог появиться такой нелепый слух? У меня нет ничего подобного!"
2602-41 = "[s] Спросить о предмете, который она купила на Променаде Чёрной Черепахи."
2602-42 = "Откуда вы об этом знаете?"
2602-43 = "Что?! Так вот откуда начался этот слух?!"
2602-44 = "*вздох* Я действительно просила доставить эту вещь тайно, но даже представить не могла, что это вызовет такое недоразумение..."
2602-45 = "Вы всё не так поняли!"
2602-46 = "Это просто... Это обычный..."
2602-47 = "Это массажный ролик для ухода за кожей."
2602-48 = "[s] «Массажный ролик?»"
2602-49 = "Да. В последнее время я особенно переживаю из-за кожи и появления морщин, поэтому заказала на Променаде массажный ролик, который, говорят, полезен для кожи."
2602-50 = "Мне было неловко, если бы студенты узнали, что я настолько переживаю из-за морщин, поэтому я хотела сохранить это в тайне."
2602-51 = "Кто бы мог подумать, что из-за попытки скрыть правду разойдётся такой нелепый слух. Ух..."
2602-52 = "Это моя вина, что я пыталась что-то скрыть. Придётся пройтись и объяснить всем, что произошло недоразумение."
2602-53 = "Вы знаете, с чего вообще начался этот слух, Сенсей?"
2602-54 = "Я не могу контролировать всё, во что верят люди, но хочу знать, кто распустил такой мерзкий слух!"
2602-55 = "Пожалуйста, расскажите мне всё, что знаете!"
2602-57 = "Я не выдержал давления и признался во всём, что в тот день произошло между мной и Коконой."
2602-60 = "Кокона. Это правда, что у Шун есть страшная игрушка для взрослых?"
2602-61 = "Не называйте меня просто Коконой. Называйте меня инструктор Кокона!"
2602-62 = "Ну, это секрет, но да, Шун действительно купила страшную игрушку для взрослых на Променаде."
2602-63 = "Жуткую игрушку, от одного взгляда на которую ребёнок цепенеет от страха—"
2602-64 = ""
2602-67 = ""
2602-68 = "Кокона?"
2602-69 = "Разве ты не говорила мне, что не смотрела, что было внутри?"
2602-70 = "И-Ик!"
2602-71 = "Ш-Шун? Т-Ты же сегодня не работаешь?!"
2602-72 = "Да, но потом я услышала, что моя милая младшая сестрёнка распускает обо мне небылицы, и сразу вернулась."
2602-73 = "Н-Небылицы? Значит, в пакете была не игрушка для взрослых?"
2602-74 = "Конечно нет! С чего бы мне заказывать такую вещь?"
2602-75 = "То есть ты вообще не заглядывала внутрь, и именно поэтому всё так вышло из-под контроля?"
2602-76 = "Как бы то ни было, инструктору Сада сливовых цветов недопустимо распространять слухи. Какой пример ты подаёшь маленьким детям?"
2602-77 = "Поэтому я приняла решение. За распространение таких грубых сплетен..."
2602-79 = "...тебе придётся пройти мой особый урок!"
2602-81 = "Только не это! Пожалуйста, прости меня, Шун!"
2602-83 = "После того дня слухи перестали распространяться..."
2602-84 = "...но заблуждение о том, что у Шун есть страшная «игрушка для взрослых», ещё некоторое время жило среди студентов Шаньхайцзина."
2602-85 = "Игрушка для взрослых"
