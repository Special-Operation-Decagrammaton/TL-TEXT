[translation]
52210-1 = "Episódio 21;O Olhar"
52210-2 = "Quando eu estava no Hyakkaryouran, eu sempre atraía o olhar de todos."
52210-6 = "Ei, ei, Ayame."
52210-7 = "Com licença... Ayame-senpai..."
52210-8 = "É a Presidente Ayame!"
52210-12 = "Olhares cheios de admiração e inveja foram me aprisionando."
52210-13 = "Não era apenas que eu já não conseguia tirar a máscara de \"Presidente do Hyakkaryouran\".#nNinguém podia saber que essa máscara era pesada, nem que ela já estava começando a me machucar."
52210-16 = "Aquela postura digna que até as flores invejam... A Presidente Ayame é realmente maravilhosa, não é?"
52210-17 = "Bela, elegante e de conduta exemplar..."
52210-18 = "Para ser líder do Hyakkaryouran, só alguém tão talentosa e graciosa quanto ela..."
52210-19 = "E-Eu só queria pedir um pequeno favor..."
52210-20 = "...Você não vai se incomodar, né?"
52210-21 = "Relaxa, relaxa! Afinal, é a Presidente Ayame, né?"
52210-22 = "Sim, tudo bem! Pode me pedir o que quiser!"
52210-23 = "— Isso era mentira."
52210-24 = "A máscara do sorriso colado no rosto continuava me sufocando.#nQuanto mais eu atendia às vozes de todos, mais os olhares de expectativa e admiração aumentavam... moldando o meu rosto de novo e de novo."
52210-25 = "Sempre sorrindo, nunca franzindo a testa.#nFicar de mau humor era fora de cogitação."
52210-26 = "Correr para ajudar sempre que alguém estivesse em apuros.#nEncarar tudo de frente, até mesmo aquilo de que todos queriam desviar o olhar."
52210-27 = "Mesmo assim, havia dias em que eu me cansava e parava.#nNesses momentos —"
52210-30 = "Hoje a senhora não parece a Presidente de sempre."
52210-31 = "Aconteceu alguma coisa?"
52210-32 = "Se descansar um pouco, logo volta a ser a Presidente de sempre!"
52210-36 = "...Sem que eu percebesse, todos passaram a achar que a máscara era o meu verdadeiro eu."
52210-37 = "Por que será que eu coloquei essa máscara?"
52210-38 = "Por que será que todos acharam que essa máscara era eu?"
52210-39 = "Por que eles não conseguem resolver sozinhos...?"
52210-42 = "Eu não consigo fazer direito como a Presidente Ayame..."
52210-43 = "A Presidente Ayame consegue fazer de tudo, é incrível!"
52210-44 = "Só a Presidente consegue fazer isso!"
52210-48 = "Se isto era uma máscara ou meu verdadeiro rosto... aos poucos, fui deixando de saber."
52210-63 = "Mas, quando encarei a sombra na escuridão — percebi que não conseguia usar o poder de Hyakuren.#n...Eu acabei percebendo."
52210-64 = "Eu não sou perfeita."
52210-65 = "Isso era imperdoável para uma Presidente — e, ainda assim, havia um \"eu\" que sentiu alívio."
52210-67 = "[log=아야메 황혼 1]É claro.[/log]"
52210-70 = "[log=아야메 황혼 1]Uma máscara, no fim das contas, é só uma máscara.[/log]"
52210-71 = "[log=아야메 황혼 1]Porque não sou eu.[/log]"
52210-74 = "[log=아야메 황혼 1]Essa responsabilidade —[/log]"
52210-75 = "[log=아야메 황혼 1]Não é minha.[/log]"
52210-79 = "Mas, se for a Kuzunoha-sama... ela com certeza vai resolver tudo."
52210-80 = "Os pedidos sufocantes, os olhares de todos — a Kuzunoha-sama vai assumir tudo isso no meu lugar."
52210-83 = "Vamos voltar logo."
52210-84 = "A Kuzunoha-sama não existe. É só uma lenda —"
52210-85 = "Aquela garota disse isso sem hesitar."
52210-86 = "Logo ela, que é uma chorona."
52210-87 = "Logo ela, que nunca conseguiu me vencer uma única vez."
52210-88 = "Logo ela, que não conseguia fugir dos olhares grudentos nem tirar a própria máscara."
52210-90 = "..."
52210-94 = "...Garota tola."
52210-95 = "É por isso que você nunca vai conseguir sair daí."
52210-100 = "Alguma preocupação?"
52210-106 = "Só estava me lembrando um pouco do passado."
52210-107 = "De todos que dependiam de mim."
52210-108 = "Hmm?"
52210-109 = "Os olhares de todos... clamando por mim."
52210-110 = "O pessoal de Hyakkiyako continua o mesmo, né."
52210-111 = "Todos têm medo de errar e se arrepender, então tentam jogar tudo para outra pessoa fazer."
52210-112 = "Mas não dá para ficar cuidando deles... para sempre."
52210-113 = "No fim, eu não consegui corresponder aos olhares de todos..."
52210-114 = "Mas quem você é agora consegue, não consegue?"
52210-115 = "Para a lenda que você é agora, onde o arrependimento e o ódio guardados no coração desabrocham com tanto esplendor, nada é impossível."
52210-116 = "...É verdade."
52210-121 = "Chega de corresponder a eles."
52210-122 = "Agora é a vez de todos serem observados por mim."
52210-147 = "Aah...! Que magnífico..."
52210-148 = "Sim, esta é exatamente a visão que eu tanto buscava...!"
52210-149 = "Eu sabia que não estava enganada."
52210-150 = "Por mais horrenda que seja uma aberração, enquanto não se está frente a frente com ela, no fim das contas é problema dos outros.#nHá um limite para quem se pode aterrorizar."
52210-151 = "Porém... o Hyakumonogatari nascido deste \"Toutei Bukkairoku\" tem uma natureza diferente. Como uma pintura macabra, ele derrama um terror sempre fresco sobre as pessoas."
52210-152 = "Para onde quer que fujam, não há como escapar dos olhares que se agarram a eles."
52210-153 = "Ah... como devo chamar este belo Hyakumonogatari?"
52210-154 = "— Em meio a incontáveis olhos que desabrocham em profusão, o destino final é um único terror."
52210-159 = "Sim... que tal chamarmos de \"Hitotsume\"?"
52210-161 = "Ayame... não, ó Hitotsume."
52210-162 = "Chegou o dia de fazer aqueles que só sabiam se agarrar aos outros — e que a mantinham aprisionada — provarem desse mesmo sentimento."
52210-163 = "Ensine a eles que, para quem teme o olhar alheio, nem mesmo piscar é permitido."
52210-167 = "..."
52210-169 = "Próximo;O Festival Continua"
