[translation]
52210-1 = "Эпизод 21;Чужой взгляд"
52210-2 = "В Хяккарёран мне казалось, будто на меня постоянно смотрят."
52210-3 = ""
52210-5 = ""
52210-6 = "Аямэ."
52210-7 = "Старшая Аямэ..."
52210-8 = "...Президент Аямэ!"
52210-9 = ""
52210-11 = ""
52210-12 = "Эти взгляды, переполненные одновременно завистью и восхищением, проклятием и благословением... Они намертво приковали меня к моей роли."
52210-13 = "Моя маска... Маска президента Хяккарёран словно была пришита к коже. Я не могла согнуться под чужими взглядами, не могла позволить им увидеть, насколько тяжёлой и болезненной была эта ноша."
52210-15 = ""
52210-16 = "Само воплощение президентства — Аямэ."
52210-17 = "Красота, благопристойность, безупречное поведение..."
52210-18 = "Именно этого ждёшь от главы Хяккарёран!"
52210-19 = "Для президента Аямэ ведь нет ничего слишком сложного, правда?"
52210-20 = "...Она примет все наши чувства, хорошие и плохие, даже бровью не поведя."
52210-21 = "...Разумеется! Она же президент."
52210-22 = "Конечно! Со мной всё хорошо!"
52210-23 = "...Ложь. Сплошная ложь."
52210-24 = "Я медленно задыхалась под этой маской, понемногу. Они приварили её к моему лицу, вырезая и придавая ей ту форму, которая была удобна им."
52210-25 = "Улыбайся, Аямэ. Будь спокойной, Аямэ. Улыбайся. Продолжай улыбаться."
52210-26 = "Я была обязана в любую секунду реагировать на любой конфликт. Там, где другие разводили руками и отворачивались, я собирала осколки."
52210-27 = "А в дни, когда усталость подкрадывалась всё ближе, а трещины в моей маске становились глубже..."
52210-29 = ""
52210-30 = "Сегодня вы сами на себя не похожи, президент Аямэ."
52210-31 = "Что-то случилось?"
52210-32 = "Идите отдохните! Чтобы поскорее снова стать собой."
52210-33 = ""
52210-35 = ""
52210-36 = "...Маска расплавилась и срослась с моей кожей. Для остальных уже не существовало разницы между мной и ролью, которую я играла."
52210-37 = "Почему я вообще решила надеть эту маску?"
52210-38 = "Почему они решили, что эта маска и есть я?"
52210-39 = "Почему никто не способен решать собственные проблемы?"
52210-41 = ""
52210-42 = "Мне никогда не стать такой хорошей, как президент Аямэ..."
52210-43 = "Президент Аямэ может всё... Она потрясающая!"
52210-44 = "Только президент Аямэ способна нести эту маску!"
52210-45 = ""
52210-47 = ""
52210-48 = "Вскоре грань между мной и маской размылась... даже для меня самой."
52210-50 = ""
52210-51 = ""
52210-52 = ""
52210-53 = ""
52210-54 = ""
52210-55 = ""
52210-56 = ""
52210-57 = ""
52210-58 = ""
52210-59 = ""
52210-60 = ""
52210-61 = ""
52210-62 = ""
52210-63 = "И тогда, столкнувшись со своей тенью в ночной темноте, я поняла, что не могу владеть Сотней Лотосов."
52210-64 = "Тогда я поняла, что не идеальна."
52210-65 = "Как президент я была провалом. И почувствовала... облегчение."
52210-67 = "[log=아야메 황혼 1]Понятно.[/log]"
52210-70 = "[log=아야메 황혼 1]Эта идеальная маска[/log]"
52210-71 = "[log=아야메 황혼 1]всего лишь маска.[/log]"
52210-74 = "[log=아야메 황혼 1]Эта ответственность[/log]"
52210-75 = "[log=아야메 황혼 1]никогда не должна была лежать на мне.[/log]"
52210-79 = "Кузуноха решит всё."
52210-80 = "Чужие взгляды, требования... Кузуноха заберёт то, что никогда изначально мне не принадлежало."
52210-83 = "...Вернись со мной, Аямэ."
52210-84 = "Ты ведь понимаешь? Кузуноха — всего лишь легенда."
52210-85 = "Но она сказала это мне без малейшего колебания."
52210-86 = "Хотя сама плакса."
52210-87 = "Хотя ни разу не смогла победить меня в поединке."
52210-88 = "Хотя никогда не могла сбежать от ожиданий и снять свою маску."
52210-90 = "..."
52210-91 = ""
52210-93 = ""
52210-94 = "...Глупая девочка."
52210-95 = "Вот почему ты никогда не двинешься дальше."
52210-96 = ""
52210-98 = ""
52210-100 = "О чём задумалась?"
52210-101 = ""
52210-103 = ""
52210-105 = ""
52210-106 = "Вспоминаю."
52210-107 = "Я вспоминала ощущение взглядов всех тех, кто когда-то смотрел на меня."
52210-108 = "Их взглядов?"
52210-109 = "Угу. Их оценивающие взгляды, умоляющие глаза. Просили меня о помощи."
52210-110 = "Это место совсем не изменилось."
52210-111 = "Они живут, боясь сделать шаг, потому что страшатся осуждения и порицания."
52210-112 = "А я не могла вечно играть для них эту роль."
52210-113 = "В итоге меня раздавили их ожидания."
52210-114 = "Но теперь уже нет, правда?"
52210-115 = "Ты расцвела во что-то изысканное: чудовище, питаемое сожалением и ненавистью. Неудержимая сила."
52210-116 = "...Да."
52210-117 = ""
52210-119 = ""
52210-121 = "Когда-то именно я была в центре их взглядов..."
52210-122 = "...но теперь уже они окажутся под моим взглядом."
52210-124 = ""
52210-142 = ""
52210-143 = ""
52210-144 = ""
52210-145 = ""
52210-147 = "А-а-ах... Как красиво! Как изысканно."
52210-148 = "Да. Именно так я и представляла."
52210-149 = "И в итоге я была права."
52210-150 = "Каким бы чудовищным или непостижимым что-то ни было, если не видишь этого своими глазами — тебя это не касается."
52210-151 = "В отличие от тома той соплячки, «Фантомные иллюстрации Тоутэй» создают Истории о призраках, которые затопят этот район ярким, безупречно нарисованным ужасом."
52210-152 = "Бегите. Прячьтесь и отводите глаза. Старайтесь сколько хотите — наш взгляд повсюду."
52210-153 = "Ах, какое имя подошло бы этому прекрасному Фантомному сказанию?"
52210-154 = "Среди бесчисленных глаз, открывающихся по всему городу, все они увидят одно и только одно."
52210-155 = ""
52210-157 = ""
52210-159 = "Изысканно. Назовём его Одноглазым — Хитоцумэ."
52210-161 = "Аямэ... нет, Хитоцумэ."
52210-162 = "Обрати свой взгляд на жалких людей этой академии."
52210-163 = "Покажи им: те, кто прячется за чужими взглядами, не заслуживают собственного."
52210-164 = ""
52210-166 = ""
52210-167 = "..."
52210-169 = "Следующий эпизод;Фестиваль должен продолжаться"
