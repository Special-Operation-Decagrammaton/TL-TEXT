[translation]
2004402-1 = "Подработка на стадионе"
2004402-2 = "Прочитав сообщение Сумирэ, я отправился на спортивный стадион."
2004402-3 = "Она попросила ждать в конкретном месте, чтобы мы не потерялись в толпе."
2004402-8 = "Тренер! Ты пришёл."
2004402-9 = "[s] «Сумирэ, это...?»"
2004402-10 = "Да. Это моя подработка."
2004402-11 = "Я хожу по проходам и разливаю напитки из этой бочки."
2004402-12 = "Знаю, эта форма немного непривычная..."
2004402-13 = "Она определённо привлекает много внимания."
2004402-14 = "Но я не против, если вы заметили, Тренер."
2004402-15 = "Вообще-то... мне хочется показать вам чуть больше."
2004402-16 = "Итак, Тренер. Вы выглядите так, будто хотите пить."
2004402-17 = ""
2004402-19 = ""
2004402-20 = ""
2004402-21 = ""
2004402-23 = "Я поблагодарил её за холодный напиток."
2004402-24 = ""
2004402-30 = ""
2004402-31 = "[ns1] «Так, насчёт этой новой работы...»\n[ns2] «Ты сказала, что это тоже форма тренировки?»"
2004402-34 = "А, сразу к делу. Вот это мой сосредоточенный Тренер!"
2004402-35 = ""
2004402-38 = "Хм? Вы выглядите озадаченным. Разве не очевидно?"
2004402-39 = "Хорошо. Я объясню. Смотрите."
2004402-40 = "Во-первых, эта полная бочка тяжёлая! Это вес!"
2004402-41 = "[s] «И что с того?»"
2004402-42 = "Наверное, вы обезвожены. Вы упускаете главное."
2004402-43 = "Ничего страшного. Это как с тренировками. Если слишком себя нагружать, начинаешь забывать об основах."
2004402-44 = "Например... поднимать веса без разминки! Бегать без заминки после..."
2004402-45 = "И, конечно, нужна правильная техника. Хорошее владение основами помогает избежать травм и износа суставов."
2004402-46 = "Такое часто бывает. Люди гонятся за большим прогрессом, пренебрегают техникой — и БАХ. Растяжение мышцы, и весь сезон насмарку."
2004402-47 = "Но вернёмся к сути..."
2004402-48 = "Ещё раз: эта бочка — вес! Вес...?"
2004402-49 = "То есть силовая тренировка!"
2004402-50 = "[s] «А, вот что ты имела в виду!»"
2004402-51 = "Именно. Полностью заполненная бочка весит примерно от 20 до 25 килограммов..."
2004402-52 = "Для меня это звучит легко, но отлично подходит для тренировки с низкой интенсивностью и большим количеством повторений!"
2004402-53 = "Более того, когда кто-то просит стакан, мне приходится присесть на колено и налить напиток..."
2004402-54 = "То есть я могу включить полноценное приседание с весом!"
2004402-55 = "Что? Думаете, это опасно? Я травмируюсь из-за глубокого приседания? Что я только что сказала, Тренер?"
2004402-56 = "Большинство травм на тренировках происходят из-за пренебрежения основами. Поэтому пока сохраняется правильная техника..."
2004402-57 = "...я могу совмещать тренировку с работой и при этом не травмироваться!"
2004402-58 = "Вообще-то глубокое приседание лучше полуприседа, потому что задействует больше мышц."
2004402-59 = "Зачем делать наполовину? Весь смысл приседаний — довести себя почти до предела!"
2004402-60 = "[s3] «Ты права, но...»\n[s4] «Для подработки такой настрой кажется немного экстремальным...»"
2004402-63 = "...А, верно. Это всего лишь подработка, но она важна."
2004402-64 = "И, Тренер, дело не только в тренировке. Мне ещё нужно улыбаться, быть внимательной и общаться с посетителями."
2004402-65 = "Без этих трёх основ..."
2004402-66 = "Болельщики не вернутся!"
2004402-67 = "И не забывайте: из-за большого веса далеко не каждый способен выполнять такую работу."
2004402-68 = "Поэтому платят здесь больше, чем на других подработках, а ещё есть бонус в зависимости от объёма продаж."
2004402-69 = "Так что да, это идеальная подработка для меня!"
2004402-70 = "Эй! Можно нам того фиолетового?"
2004402-71 = "Да. Сейчас!"
2004402-72 = ""
2004402-74 = ""
2004402-75 = ""
2004402-76 = ""
2004402-77 = "А, льда поменьше! Спасибо!"
2004402-78 = "Конечно. Я положила меньше льда, потому что вы выглядели очень измученным жаждой и я знала, что вы выпьете всё залпом."
2004402-79 = "Слишком холодные напитки могут вызвать спазм мышц желудка и помешать оптимальному восполнению жидкости."
2004402-80 = "Зовите меня в любое время. Где бы вы ни сидели, я прибегу! Приятного матча!"
2004402-81 = ""
2004402-84 = ""
2004402-85 = ""
2004402-87 = "Сумирэ продолжала бегать по всему стадиону..."
2004402-88 = "И работала так, будто это было её призвание."
2004402-90 = "Хотите ещё? У меня здесь ещё много!"
2004402-91 = "Отлично! Вот дополнительный напиток. Хм? Ещё и улыбку хотите?"
2004402-92 = "Конечно. Вот! За счёт заведения!"
2004402-93 = ""
2004402-95 = ""
2004402-97 = "Спрашиваете, почему я пришла сама, хотя вы меня не звали? Ну, вы выглядели немного уставшим."
2004402-98 = "Понятно. Вы решили, что я слишком занята!"
2004402-99 = "В следующий раз не сомневайтесь. Достаточно жеста или взгляда."
2004402-100 = "Я могу выглядеть занятой, но обещаю, что слежу за вами."
2004402-101 = "Пейте. За мой счёт и до краёв. Это должно вас взбодрить."
2004402-103 = "Да? Чем могу помочь? А, вы спрашиваете, не слишком ли тяжело?"
2004402-104 = "Вовсе нет. На самом деле, пожалуй, даже немного слишком легко."
2004402-105 = "Так что, если не хотите глоток... может, показать вам идеально выполненный выпад?"
2004402-106 = "О, считаете, что это уже слишком, раз вы ничего не заказывали? Тогда давайте это исправим."
2004402-108 = "А потом, прежде чем мы вообще успели это осознать..."
2004402-109 = "Сумирэ стала звездой стадиона!"
2004402-111 = "Сюда! Ты Сумирэ? Сфотографируйся со мной!"
2004402-112 = "Конечно! Но откуда вы знаете моё имя?"
2004402-113 = "Ведь этот бейджик такой маленький..."
2004402-114 = "Сумирэ, что ты делаешь после смены?"
2004402-115 = "Хм. Давайте всё-таки держаться в рамках профессионального общения."
2004402-116 = "Но если придёте в Клуб спортивных тренировок Миллениума, я смогу помочь вам потренироваться."
2004402-117 = "Сумирэ, Сумирэ! Позируй на камеру!"
2004402-118 = "Я не очень разбираюсь в позах... но могу показать несколько бодибилдерских стоек?"
2004402-119 = "Хорошо! Тогда... сначала боковая грудь!"
2004402-120 = ""
2004402-122 = ""
2004402-123 = "Ура-а-а!"
2004402-124 = ""
2004402-126 = ""
2004402-127 = "А теперь... трицепс!"
2004402-128 = "Ты лучшая!"
2004402-129 = ""
2004402-131 = ""
2004402-132 = "И наконец... двойной бицепс!"
2004402-133 = "Вы только посмотрите на эти пушки!"
2004402-135 = "Я уже не мог понять, пришла ли толпа ради матча или ради Сумирэ."
2004402-136 = "А Сумирэ... стала MVP стадиона!"
