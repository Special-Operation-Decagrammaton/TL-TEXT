[translation]
10025050-1 = "Эпизод 5;Страх неизвестного"
10025050-8 = ""
10025050-9 = ""
10025050-10 = ""
10025050-11 = "Цк... Эти туристки умеют драться."
10025050-12 = "Но вы всё равно как рыба в бочке!"
10025050-13 = "Кумагаи, зови ребят с третьего пирса!"
10025050-14 = "Эти бездельники наверняка только сейчас добираются до лодок."
10025050-15 = ""
10025050-17 = ""
10025050-18 = ""
10025050-19 = "Уф... Их слишком много..."
10025050-20 = "У нас п-превосходство в огневой мощи, но такими темпами они нас задавят числом..."
10025050-21 = "Ну и ну... Я тут уже почти спотыкаюсь о ящики и коробки со снастями..."
10025050-22 = "Боеприпасы заканчиваются... RABBIT 1, приказы!"
10025050-24 = "..."
10025050-25 = ""
10025050-27 = "(Они прижали нас. Нужна поддержка с воздуха, чтобы выманить их... Но я не могу просто разбомбить деревню...)"
10025050-28 = "(Нет. Эти культисты, похоже, контролируют весь город, а мой отряд в опасности...)"
10025050-29 = "(...У меня нет другого выбора.)"
10025050-30 = ""
10025050-33 = ""
10025050-34 = "RABBIT 3, у нас есть боеприпасы воздушного подрыва?"
10025050-35 = "Конечно. Я взяла несколько вместо обычных зенитных."
10025050-36 = "Готовься вести огонь над укрытиями противника. Выманим их."
10025050-37 = "Координаты—"
10025050-38 = ""
10025050-40 = ""
10025050-44 = "[ns] «Хватит! Все, прекратите!»"
10025050-45 = "Этот голос..."
10025050-46 = "...Сенсей [USERNAME]?"
10025050-47 = ""
10025050-49 = ""
10025050-52 = ""
10025050-53 = "О боже... Вы опять дерётесь? Вам никогда не надоедает...?"
10025050-54 = "Сэр, как я уже говорила, если у вас проблемы с приезжими, сначала обращайтесь к нам. Если эти туристки подадут жалобу, всем нам потом расхлёбывать..."
10025050-56 = "Хмпф. Мне не нужно твоё разрешение, чтобы защищать частную собственность!"
10025050-58 = "Просто отойди, офицер. Я избавлюсь от этих крыс за десять минут."
10025050-59 = "Кого ты назвал крысами? Давайте уже закончим!"
10025050-60 = ""
10025050-62 = ""
10025050-65 = "[ns] «Пожалуйста, это всего лишь недоразумение!»"
10025050-66 = "Да нет, я всё прекрасно понимаю."
10025050-67 = "Вы девчонки проникли в мою сушильню и попытались украсть рыбу. Всё предельно ясно."
10025050-68 = "Это сушильня?"
10025050-69 = "Здесь вся рыба испортилась! Такой очевидной ложью нас не обманешь!"
10025050-70 = "Эй, она не испорчена, это—"
10025050-71 = "[s] «Он делает соус кусая.»"
10025050-72 = "Соус... кусая...?"
10025050-74 = "В этом вонючем рассоле выдерживают скумбрию, а потом сушат."
10025050-75 = "В Д.У. он не слишком популярен, но это один из фирменных продуктов деревни Ятоура."
10025050-76 = "Говорят, вкусно, но я ничего, что ТАК пахнет, ко рту не поднесу..."
10025050-77 = "Ты сколько уже здесь живёшь и до сих пор не можешь есть кусая?"
10025050-78 = "Я имею право на собственные вкусы!"
10025050-79 = ""
10025050-81 = ""
10025050-83 = ""
10025050-84 = ""
10025050-85 = "Эй, ты. Ты знаешь про кусая."
10025050-86 = "Но мы его не экспортируем, так что сомневаюсь, что в вашем модном городе такое найдёшь..."
10025050-87 = "[s1] «У меня есть несколько студентов, которым интересны редкие деликатесы.»\n[s2] «Скажем так, с моей дегустацией кусая связана отдельная история.»"
10025050-91 = "Но как же то, что мы слышали от вас!"
10025050-92 = "Вы говорили, что город поглотит тьма и что рыбак пострадал!"
10025050-94 = "Поглотит... Что?"
10025050-95 = "А, ты про сломанные фонари."
10025050-96 = "Местная погода здорово изнашивает старые линии электропередачи. Некоторые уличные фонари начали отключаться."
10025050-97 = "Когда солнце садится, становится так темно, что собственных ног не видно."
10025050-98 = "Один молодой рыбак споткнулся о камень и повредил ногу."
10025050-99 = "Я уже несколько раз отправлял запросы в районную службу на ремонт, потому что это серьёзная проблема безопасности..."
10025050-100 = "Говорят, людей не хватает и остаётся только ждать, но уже больше месяца прошло..."
10025050-102 = "Т-То есть... вы не имели в виду, что земля уйдёт под воду... Слава богу..."
10025050-104 = "Но что вы вообще делали здесь так рано утром?"
10025050-105 = "Мы гуляли ночью и заметили подозрительного человека. Поэтому пошли за ним."
10025050-106 = "На местного он не был похож, но нёс удочку. Мы подумали, вдруг он ловит без лицензии..."
10025050-107 = ""
10025050-109 = ""
10025050-110 = "А, этот тип..."
10025050-111 = "Он уже всем в городе надоел просьбами научить его рыбачить."
10025050-112 = "Выглядит он мутно, но все необходимые разрешения и лицензии у него есть."
10025050-113 = "[s3] «Возможно, это было недоразумение, но прошу прощения за причинённые неудобства.»\n[s4] «Приношу извинения от имени своих студентов.»"
10025050-116 = ""
10025050-118 = ""
10025050-119 = "...Ладно, мужики. Расходимся."
10025050-120 = "Работы полно, если хотим выйти в море до рассвета."
10025050-121 = "Если пропустите сегодняшний улов креветок из-за драки с туристами, вся деревня будет над вами смеяться."
10025050-122 = "Ну да, ну да."
10025050-124 = ""
10025050-127 = ""
10025050-128 = ""
10025050-129 = "[ns] «Ну что... напряжённая ночка, да?»"
10025050-130 = "Простите..."
10025050-131 = "Командир отряда должен оценивать ситуацию спокойно и хладнокровно. Всё это моя вина..."
10025050-132 = "Я пыталась сохранять контроль, но по мере того, как конфликт обострялся, будто что-то овладевало мной..."
10025050-133 = "...пока я не начала верить, что вся деревня замешана в каком-то культовом заговоре."
10025050-134 = "Со мной было так же. С самого начала я была уверена, что всё это просто суеверная ерунда."
10025050-135 = "Но чем больше я видела и... чувствовала запахов... тем сильнее даже мне начинало казаться, что легенды могут быть правдой."
10025050-136 = "Н-Нет, это всё моя вина... Я постоянно говорила эти ужасные вещи... ковыряла и ковыряла собственные страхи..."
10025050-137 = "Надо было просто молчать..."
10025050-139 = "Да брось. Мы все об этом думали. Просто только у тебя хватило смелости сказать вслух."
10025050-140 = "На самом деле тут никто не виноват."
10025050-142 = "...Мы пришли к совершенно нелепому выводу."
10025050-143 = "Если местные говорят о тьме, очевидно, речь об уличных фонарях. Если видим ферментированную рыбу, очевидно, это какой-то морепродукт."
10025050-144 = "А вместо этого мы решили, что это религиозное жертвоприношение какой-то мерзости из морских глубин."
10025050-145 = "Почему на этот раз мы так быстро пришли к таким безумным предположениям?"
10025050-146 = "Мы ведь не были буквально околдованы этим городом, правда?"
10025050-147 = "[s] «Мне кажется, у вас было слишком много информации.»"
10025050-148 = "...То есть информационная перегрузка?"
10025050-149 = "Ну, в итоге мы действительно перелопатили кучу местных легенд, которые обычно в сводку расследования не попадают."
10025050-150 = "В городе мы бы смотрели отчёты об авариях и журналы происшествий, а здесь у нас были только страшилки местных."
10025050-151 = "Ага, я сейчас смотрю протокол нашего совещания, и он весь забит разговорами о Глубинных. Больше похоже на сценарий фильма ужасов, чем на расследование SRT..."
10025050-152 = "И я никак не могла перестать думать о том, что сказал тот человек из Ред Хук Экспресс..."
10025050-153 = "Даже сейчас слышу его голос..."
10025050-155 = "Я знаю, что ложная информация может привести к недопониманию и помешать мыслить рационально, но..."
10025050-156 = "[s] «Возможно, вы просто ещё и устали.»"
10025050-158 = "Устали? От этого?"
10025050-159 = "Мы все прошли суровую подготовку SRT! Думаете, этого достаточно, чтобы нас утомить?"
10025050-160 = "[s] «Есть физическая усталость, а есть ещё и умственная.»"
10025050-161 = "И вы думаете, мы умственно истощены?"
10025050-162 = "[s5] «Отряды SRT постоянно имеют дело с заговорами и интригами...»\n[s6] «Если всё время смотреть на всех с подозрением, конечно устанешь.»"
10025050-165 = "А как иначе? Людьми движут инстинкты, всё просто."
10025050-166 = "Даже самые крупные заговоры в Кивотосе начинались с того, что кто-то чего-то хотел."
10025050-167 = "...Похоже, ты сейчас описываешь саму себя, Моэ."
10025050-168 = "Вы удивитесь, насколько... спонтанными могут становиться люди у власти, когда думают, что никто не смотрит. Хи-хи-хи..."
10025050-169 = "[s7] «Если всё время ждать заговора, начнёшь видеть его за каждым углом.»\n[s8] «Попробуйте снова взглянуть на деревню, но теперь свежим взглядом.»"
10025050-173 = "Но если заговор действительно есть, мы должны что-то сделать."
10025050-174 = "Это мой долг как студенты академии SRT."
10025050-175 = "А как вообще понять, существует заговор или это всё только у нас в голове?"
10025050-176 = "[s] «Нужно отойти на шаг назад и начать заново.»"
10025050-177 = "..."
10025050-178 = "[s] «А для начала вам всем нужно отдохнуть!»"
10025050-179 = ""
10025050-182 = "[ns9] «Мы у океана, так что давайте немного им насладимся.»\n[ns10] «Не думайте ни о Глубинных, ни о Мелководных, ни о чём между ними.»"
10025050-185 = "...Ладно."
10025050-186 = "Отряд, на сегодня операция завершена."
10025050-187 = "Спасибо всем за работу допоздна."
10025050-189 = "Хорошая работа, все."
