[translation]
10047110-1 = "Эпилог;Повседневная жизнь продолжается"
10047110-3 = "[ns] «Создать шедевр было здорово, но...»"
10047110-6 = "[ns] «...нас опять заперли здесь.»"
10047110-7 = "Сами виноваты. Радуйтесь, что после всех устроенных вами проблем вы отделались ТОЛЬКО этим."
10047110-8 = ""
10047110-10 = ""
10047110-11 = ""
10047110-12 = "Но почему... ты здесь, Рэна...?"
10047110-13 = "Я, конечно же, сама призналась. Я проникла в запретную зону и позвонила в колокол."
10047110-14 = "В отличие от ВАС, я очень сознательный студент."
10047110-15 = "Так я и думала. Это ты заставила колокол запеть."
10047110-16 = "Хи-хи, звонить в колокол Дня погибели... Какая смелость..."
10047110-17 = "День погибели? Какой ещё День погибели? Всё это глупости и городские легенды!"
10047110-18 = "Но это сработало. Он исполнил наши желания."
10047110-19 = "Только твоё желание и сбылось, Эри."
10047110-20 = "Нет. Моё тоже сбылось."
10047110-21 = "Скоро у меня музыкальный баттл, и я думала, как сокрушить соперницу."
10047110-22 = "Пока я убегала от Совета префектов, мне внезапно пришли новые, ещё сырые строки и мелодии."
10047110-23 = "Хех. Так что благодаря Эри моя проблема решилась."
10047110-24 = "Я уже прокручивала всё в голове. Хотите, исполню вслух?"
10047110-25 = "Н-нет! Не надо! Мне больше нравится, когда ты добрая и нежная!"
10047110-26 = "Я всегда добрая... и нежная."
10047110-27 = "А, значит, тебе я всегда нравлюсь."
10047110-28 = ""
10047110-30 = ""
10047110-33 = ""
10047110-34 = "Шья-а...!"
10047110-35 = "Вообще-то я... тоже кое-что поняла."
10047110-36 = "И ты тоже?"
10047110-37 = ""
10047110-39 = ""
10047110-40 = "Я вспомнила... любовь из своей прошлой жизни. Хи-хи..."
10047110-41 = ""
10047110-43 = ""
10047110-44 = "Сначала я не была уверена... Но чем больше наблюдала, тем сильнее убеждалась."
10047110-45 = "Тебе разве не интересно, кто это...?"
10047110-46 = "Ни капли. Сейчас опять начнёшь нести чушь."
10047110-47 = "Понятно, Рэна... не верит в прошлые жизни."
10047110-48 = "Ты забыла моё нежное прикосновение... Мне грустно..."
10047110-49 = "Ч-что ты несёшь? Какое ещё «нежное прикосновение»?"
10047110-50 = "...Ты же не хочешь сказать, что Я была твоей прошлой любовью?"
10047110-51 = "Мы... очень дорожили друг другом..."
10047110-52 = "Я была хозяйкой..."
10047110-53 = ""
10047110-55 = ""
10047110-57 = "...а Рэна — милой кошечкой..."
10047110-59 = ""
10047110-61 = ""
10047110-62 = ""
10047110-63 = "Шья-а! Прекрати!"
10047110-64 = "Вижу. И правда, Рэна довольно милая."
10047110-65 = "Шья-а...!"
10047110-67 = "В любом случае, спасибо тебе, Рэна. Благодаря твоей помощи все получили благословение."
10047110-68 = "Не все... Я ничего не получила."
10047110-69 = "Нюхуху! Неправда. Твоё желание тоже исполнилось."
10047110-70 = "Моё? Какое ещё желание?"
10047110-71 = "Желание ещё больше веселиться вместе с нами."
10047110-72 = "К-когда это я такого желала?!"
10047110-74 = "Клянусь вам... однажды вы сами увидите! Я докажу, что никакой оккультизм не существует."
10047110-75 = "Хех, да. Буду иметь в виду."
10047110-76 = "...И клянусь, что я не замечала, как Рэна одержимо читает перед сном книги по астрологии."
10047110-77 = "...!"
10047110-78 = "И клянусь... что не замечала, как Рэна каждый раз подглядывает из-за колонны, когда я пользуюсь атанором."
10047110-79 = "...!!"
10047110-80 = "Нюхуху. И я клянусь, что НИКОГДА не забуду, с каким пылом Рэна спрашивала, почему мои расклады Таро всегда сбываются!"
10047110-81 = "...!!!"
10047110-82 = "[s] «Так... Рэна и правда интересуется оккультизмом?»"
10047110-83 = "А, да ну вас! Вы все слишком много болтаете!"
10047110-84 = ""
10047110-86 = ""
10047110-88 = "Нюхуху, тогда спланируем нашу следующую работу?"
10047110-89 = "Чем бы нам теперь всех поразить?"
10047110-90 = "...А обязательно всех поражать? Нельзя просто сделать что-нибудь нормальное?"
10047110-91 = "Если это никого не поражает, значит, и делать не стоит! Мы стремимся к революции!"
10047110-92 = "Революции..."
10047110-93 = "Тогда... может, посетим личный музей президента Ассамблеи?"
10047110-94 = "Говорят, там хранятся самые мистические произведения искусства Вайлдханта."
10047110-95 = "Обычным студентам туда категорически запрещено. И никто никогда не объяснял почему."
10047110-96 = "Возможно, там мы найдём подсказки... и они помогут раскрыть тайну Портрета Бытия."
10047110-97 = "Личный музей президента Ассамблеи... Мне тоже любопытно."
10047110-98 = "Интересно, какие оккультные тайны там скрыты. Хи-хи..."
10047110-99 = "Ты никогда там не была, Каноэ?"
10047110-100 = "Нет... Кроме президента Ассамблеи... туда ещё никто никогда не заходил..."
10047110-101 = ""
10047110-103 = ""
10047110-105 = "Даже Благородная воровка."
10047110-106 = ""
10047110-108 = ""
10047110-109 = "В-вы хотите туда пробраться?! Вы серьёзно?!"
10047110-110 = "Нюхуху. Когда мы вместе, нет ничего невозможного! Правда?"
10047110-111 = ""
10047110-113 = ""
10047110-114 = ""
10047110-115 = "А-а, эти лица...! Они и правда собираются это сделать!"
10047110-116 = "Сенсей! Сделайте что-нибудь! У нас и так проблем выше крыши! Остановите их! Проявите ответственность!"
10047110-117 = "[ns] «Если честно, мне самому стало интересно...»"
10047110-118 = ""
10047110-121 = "[ns1] «Но... сначала попробуем официальным путём.»\n[ns2] «Посмотрю, смогу ли я договориться о более свободном доступе для студентов.»"
10047110-124 = "Даже если это будет не совсем разрешено, мы как-нибудь справимся..."
10047110-125 = "Хи-хи... Э-хе-хе-хе...!"
10047110-126 = "Когда Каноэ входит в такое состояние, её уже не остановить. У меня сердце колотится."
10047110-127 = "Нюхуху. Похоже, наша следующая операция уже определена!"
10047110-128 = ""
10047110-130 = ""
10047110-131 = "Итак! Как президент Общества исследования оккультизма, я официально объявляю...!"
10047110-132 = "Наша следующая цель — музей президента Ассамблеи! Мы исследуем все оккультные тайны, которые там скрываются!"
10047110-133 = "*вздыхает* И что мне со всеми вами делать...?"
10047110-135 = "Удастся ли следующая вылазка Общества исследования оккультизма...?"
10047110-141 = "...Похоже, они задумали что-то весёлое. Будет интересно посмотреть, во что они ввяжутся."
10047110-142 = "Как член Совета префектов..."
10047110-143 = "...и как Благородная воровка..."
10047110-144 = "Я буду ждать дня, когда мы встретимся снова."
10047110-145 = ""
10047110-147 = ""
10047110-153 = "...На какой бы сцене это ни произошло. Фуфуфу..."
10047110-154 = "Мы — Общество исследования оккультизма! Древние заклинания и тайны"
