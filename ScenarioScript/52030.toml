52030-50 = "Босс, «Операция: Случайно-нарочно сломать вывеску Чисэ, предложить починить её, а потом незаметно заменить другой!» провалилась!"
52030-51 = ""
52030-53 = ""
52030-54 = ""
52030-55 = "Ч-Что? Не помню, чтобы я это утверждала!"
52030-56 = "Переходим к «Операции: Захватить фестиваль оружием и бомбами в обычном стиле Моурё и тогда незаметно подменить вывеску!»?"
52030-58 = "...«Обычном стиле Моурё»? Если подумать, я узнаю этих придурков..."
52030-59 = ""
52030-61 = ""
52030-62 = "Да! Каждый раз, когда проходит праздник, вы устраиваете драки и грабите туристов ради фестивальных билетов. Так?"
52030-64 = "Хмф. Может, когда-то и так, но теперь нам плевать на какие-то билеты. Фестиваль Вараку — личное дело!"
52030-65 = "Маленькая принцесса Вараку думает, что она такая милая и заслуживает ВСЕГО внимания. Но рядом с нашей великой Аратой она ничто!"
52030-66 = "Эм, ого. Это... очень лестно."
52030-67 = "Вы... правда можете так не говорить."
52030-69 = "А, так вот почему вы пытаетесь саботировать фестиваль?"
52030-70 = "Просто завидуете, потому что Чисэ всем нравится и она популярна?"
52030-72 = "Нет! Конечно нет! Причина, по которой мы пытаемся испортить вывеску с хайку..."
52030-73 = "Это конкурс хайку на прошлой неделе!"
52030-75 = "Хмм... Ты про конкурс хайку, который проводил клуб Инь-Ян?"
52030-77 = "Да! Наш босс отправила на конкурс идеальное, вдохновляющее и выразительное произведение..."
52030-78 = "...и даже не прошла отбор из-за саботажа и кумовства клуба Инь-Ян!"
52030-79 = ""
52030-82 = ""
52030-83 = "Эй! Я БЫЛА в отборе!"
52030-85 = "Но конечно все глазели на хайку прекрасной принцессы Вараку, хотя у босса было в тысячу раз лучше!"
52030-86 = "Да! Я его прочитала и прямо почувствовала себя... поэтично!"
52030-87 = "Если заставить всех прочитать хайку Араты, они увидят, насколько она гениальна!"
52030-89 = "Хи-хи! Ой, хватит! Вы меня смущаете!"
52030-90 = ""
52030-92 = ""
52030-93 = "Постой. ВОТ из-за чего всё это? Только из-за меня? Вы даже... не собираетесь портить фестиваль как обычно?"
52030-95 = "Конечно, босс. Вы потрясающая. Вас ограбили!"
52030-96 = "И когда ваше хайку выставят, все поймут, что победить должны были вы!"
52030-97 = "Вообще, давайте прочитаем прямо сейчас! ВСЕ! СЛУШАЙТЕ!"
52030-99 = "Нет, пожалуйста, хватит—"
