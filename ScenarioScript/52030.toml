[translation]
52030-1 = "Episódio 3;Um Novo Festival"
52030-5 = "Ei, não deixa cair!"
52030-6 = "Olha onde pisa e vai devagar."
52030-12 = "Opa...! Essa placa não tá maior do que tinham falado?"
52030-13 = "Será que foi um erro de pedido do Comitê de Organização de Festivais...?"
52030-14 = "Não, isso aí é encomenda especial do Clube Yin-Yang.#nDizem que já era pra ser desse tamanho mesmo."
52030-15 = "Parece que querem exibir um haicai escrito à mão pela própria Chise-sama.#nE de um jeito que dê pra ver de qualquer lugar do festival."
52030-29 = "Uaaah...?!"
52030-30 = "Não corre num lugar desses! É perigoso, sabia?!"
52030-35 = "Ei, você tá bem?"
52030-40 = "Tsc, fracassamos..."
52030-44 = "Hã...?"
52030-50 = "Líder!#nA \"Operação Quebrar e Trocar a Placa da Chise-sama\" fracassou!"
52030-55 = "Hã...? A gente bolou uma operação dessas?"
52030-56 = "Ah, então será que a \"Operação Troca Rápida no Meio de um Tiroteio\"#nnão combina mais com a Trupe Chimi?!"
52030-58 = "Trupe Chimi...?#nAcho que já ouvi esse nome em algum lugar—"
52030-62 = "Ah! Lembrei!#nA gangue de delinquentes que sempre aparece quando um festival tá chegando!#nEntão são vocês que ficam arranjando encrenca pra roubar cupons!"
52030-64 = "Hmph.#nOutros festivais até vai,#nmas não tô nem aí pros cupons do \"Festival Waraku\"!"
52030-65 = "Isso aí! Isso aí!#nMesmo sendo a Princesa Waraku,#nela não chega nem aos pés do carisma da nossa Líder!"
52030-66 = "F-Fico feliz que vocês pensem assim, mas..."
52030-67 = "Acho que agora não é bem a hora de dizer isso..."
52030-69 = "Quê? Então por que vocês tão atrapalhando?!"
52030-70 = "Não me diga que vocês têm mesmo algum rancor da Chise-sama—"
52030-72 = "A Princesa Waraku não tem nada a ver com isso!"
52030-73 = "Essa placa aí é do concurso de haicai da semana passada, né?!"
52030-75 = "Ah, o organizado pelo Clube Yin-Yang? Quem venceu foi a Chise-sama."
52030-77 = "Pois é!#nA nossa Líder também participou com tudo, mas..."
52030-78 = "Uuh... por causa de uma sabotagem covarde, nem nas eliminatórias..."
52030-83 = "Eu participei das eliminatórias, tá?!"
52030-85 = "Todo mundo só elogia a Princesa Waraku, mas o poema da Líder é muito melhor!"
52030-86 = "Isso aí, isso aí! O sentimento naquelas palavras fez minha alma tremer!"
52030-87 = "Se todo mundo visse o haicai da Líder, ia perceber na hora como ele é incrível!"
52030-89 = "Hehe... assim fico até sem graça."
52030-93 = "...Espera, foi por isso que vocês tentaram trocar a placa?!"
52030-95 = "É que a Líder#nficou toda cabisbaixa desde o fim do concurso."
52030-96 = "Então pensei em colocar o haicai da Líder bem no meio do festival#npra espalhar a genialidade dele por aí!"
52030-97 = "Já que chegou a esse ponto, não tem jeito...#nVamos fazer todo mundo aqui ouvir o haicai da Líder!"
52030-99 = "E-Espera! Isso não—"
52030-106 = "Co#nmi#nda#ndo#nfes#nti#nval"
52030-108 = "Sem#ncu#npom#nde#ndes#ncon#nto"
52030-110 = "Não#ntem#nco#nmo#ncur#ntir,#nné?"
52030-121 = "Olha só, Líder! Todo mundo ficou tão emocionado que nem consegue falar!"
52030-123 = "...Pra começo de conversa, isso aí é um haicai?"
52030-124 = "Bom... \"festival\" é uma palavra de estação do verão, pelo menos."
52030-126 = "Cala a boca! Se a Líder disse que é haicai, então é haicai!"
52030-127 = "Não tenta enquadrar a arte em regrinhas!"
52030-132 = "É, acho que não é um haicai mesmo..."
52030-134 = "U... Uuuh...!"
52030-138 = "J-Já que é assim, vou logo acabar com esse festival!"
52030-146 = "Estranhei toda essa algazarra..."
52030-152 = "Q-Quem está aí?!"
52030-161 = "Eu entendo a vontade de mostrar seu haicai, mas não vou deixar atrapalharem o festival."
52030-162 = "Fazer baderna por rancor pessoal não é nada admirável."
52030-164 = "Estão querendo estragar a juventude de todo mundo?!"
52030-165 = "Não toleraremos mais nenhum ultraje da parte de vocês!"
52030-171 = "H-Hyakkaryouran...!"
52030-172 = "L-Líder, o que a gente faz?!#nParece que tem mais gente do que antes!"
52030-174 = "Eu já pensei... numa estratégia contra a Hyakkaryouran!"
52030-178 = "Vamos acertar as contas! Hoje eu lavo a minha honra...!"
