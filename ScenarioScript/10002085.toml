10002085-1 = "Эпизод 8; Пляжная хижина, часть 2"
10002085-2 = "Пляжная хижина"
10002085-3 = "Гх! П-почему? Что вы, неудачники, тоже здесь делаете?!"
10002085-4 = "Теперь понятно. Эти мошенники всё это время были заодно с этим коррумпированным рестораном!"
10002085-5 = "Отплатить за гостеприимство — обычная вежливость. Дать отпор — меньшее, что мы можем сделать!"
10002085-6 = "Вежливость?! Гостеприимство?! Вы все с ума сошли?!"
10002085-7 = "Уф. Вы за это заплатите...! Все заплатите!"
10002085-8 = ""
10002085-10 = ""
10002085-12 = "*шмыгает носом*"
10002085-13 = "Спасибо, что пришли мне на помощь! Вы меня реально спасли!"
10002085-14 = "Благодаря вам ресторан всё ещё стоит."
10002085-15 = "Не стоит благодарности — этим и занимается Оперативная группа правосудия. Рада, что мы смогли спасти ресторан."
10002085-16 = "Ага! Слава богу!"
10002085-17 = "Это, конечно, не отплатит вам как следует, но вот."
10002085-18 = ""
10002085-19 = ""
10002085-20 = "За мой счёт, выпейте все!"
10002085-21 = "Это полностью бесплатно, в знак моей благодарности."
10002085-22 = "Мы не ждали награды, но раз вы настаиваете."
10002085-23 = "А что это вообще? Сок? Цвет довольно необычный."
10002085-24 = "Поверьте — вкусно. Попробуйте угадать по вкусу."
10002085-25 = "И вам тоже! Держите!"
10002085-26 = "За безопасность ресторана!"
10002085-27 = "За нас!"
