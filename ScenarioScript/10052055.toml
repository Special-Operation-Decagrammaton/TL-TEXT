[translation]
10052055-2 = "Мы справились... как-то."
10052055-3 = "..."
10052055-4 = "[s] «Тебя что-то беспокоит?»"
10052055-5 = "Я бы не сказала «беспокоит»..."
10052055-6 = "...Сейчас у меня нет места в голове для тревог о чём-либо, кроме нашей безопасности."
10052055-7 = "Но всё же..."
10052055-8 = "Знаете, Сенсей..."
10052055-9 = "[s] «Хм?»"
10052055-10 = "Почему... мы все так стремимся драться друг с другом?"
10052055-11 = "[ns] «Конфликты возникают, когда не удаётся найти компромисс.»"
10052055-12 = "У каждого есть принципы, которыми он не может поступиться. Я это понимаю."
10052055-13 = "Но мне кажется, что здесь ни одна сторона толком даже не понимает, в чём её принципы."
10052055-14 = ""
10052055-16 = ""
10052055-17 = "...Интересно, сможет ли жизнь, смогут ли люди когда-нибудь находить компромисс. Смогут ли примириться?"
10052055-18 = "[s] «Мне хочется в это верить.»"
10052055-19 = "«Хочется». Значит, даже вы не уверены."
10052055-20 = "[s1] «Можно сказать и так.»\n[s2] «Но даже несмотря на это...»"
