[translation]
1602005-1 = "Одиночество одного снайпера"
1602005-2 = "Увидев загадочное сообщение Отоги в MomoTalk, я отправился в подземный штаб отряда FOX."
1602005-3 = ""
1602005-7 = "Штаб отряда FOX"
1602005-8 = "Но дома никого не было, даже Отоги."
1602005-10 = "Я около десяти минут бродил по окрестностям."
1602005-11 = ""
1602005-12 = ""
1602005-13 = "Наконец я нашёл Отоги на скамейке в ближайшем парке. Она задумчиво смотрела на фонарь."
1602005-14 = ""
1602005-15 = "[ns] «Отоги!»"
1602005-16 = "...О? Сенсей..."
1602005-17 = "Что вы делаете здесь так поздно?"
1602005-18 = "Не стоит бродить по местам, где вокруг никого нет."
1602005-19 = "[s1] «Это я должен тебя спросить.»\n[s2] «Почему ты гуляешь так поздно?»"
1602005-22 = "Просто захотелось сменить обстановку."
1602005-23 = ""
1602005-25 = ""
1602005-26 = ""
1602005-27 = "А, вы видели мой MomoTalk."
1602005-28 = "Простите. Не хотела заставлять вас волноваться."
1602005-29 = "Правда ничего серьёзного. Мне неловко, что вы вышли сюда так поздно."
1602005-30 = "Я действительно просто пришла сменить обстановку, так что можете возвращаться, Сенсей."
1602005-31 = "Завтра у вас важная встреча, верно? Разве не нужно лечь пораньше?"
1602005-32 = "[s3] «Твои переживания для меня важнее.»\n[s4] «Да и мне самому захотелось ночной прогулки.»"
1602005-35 = "...Вы правда всегда делаете что хотите."
1602005-36 = "А. Хотя, наверное, это скорее про меня."
1602005-37 = "[ns5] «На что ты смотрела?»\n[ns6] «Я не вижу ничего интересного.»"
1602005-40 = "Видите фонарь у входа?"
1602005-41 = "Тот справа... Он немного тусклее остальных."
1602005-42 = "Я узнала это во время прошлой операции. У него старая проводка, и он довольно часто ломается."
1602005-43 = "Сейчас фонари автоматизированы, и датчики сами определяют, взошло солнце или нет."
1602005-44 = "Но датчик у этого фонаря изношен, поэтому примерно раз в час он гаснет."
1602005-45 = "Поэтому ночной сотрудник парка следит по камерам и, если свет выключился, вручную подаёт питание обратно. Хлопотно, правда?"
1602005-46 = "На днях, когда проходила здесь, я увидела, как он снова загорелся."
1602005-47 = "И подумала: а, значит, по ту сторону этого фонаря есть кто-то."
1602005-48 = "Этот человек тоже не спит и следит, чтобы дорога оставалась освещённой."
1602005-49 = "...Поэтому, когда мне одиноко, я прихожу в этот парк и просто смотрю, как этот фонарь гаснет."
1602005-50 = "[s] «Сегодня тебе было одиноко?»"
1602005-51 = "Иногда такое бывает. Сегодня остальные участницы отряда задержались на операциях допоздна."
1602005-52 = "Бывают отключения связи... или радиомолчание. В зависимости от ситуации прекращение связи вполне обычное дело."
1602005-53 = "Особенно у снайперов. Иногда мы отключаем связь, когда нужно лучше слышать окружение."
1602005-54 = "Помните, я говорила, что для снайпера важно общение? Думаю, ещё важнее и сложнее — научиться спокойно переносить одиночество."
1602005-55 = "Иногда я вообще не вижу врагов, не говоря уже о возможности поговорить с союзниками. Кажется, будто во всём мире осталась только я."
1602005-56 = "И даже тогда обязанность снайпера — сидеть в изолированной позиции и ждать цель."
1602005-57 = "Я выбрала снайперскую специализацию только потому, что у меня хорошее зрение и твёрдая рука."
1602005-58 = "Но мне легко становится одиноко. И когда такое случается..."
1602005-59 = "Иногда думаю, не ошиблась ли я с выбором пути."
1602005-60 = "[s7] «Когда ищешь свой путь, не бывает неправильного выбора.»\n[s8] «Поэтому ты и студент. Ты исследуешь возможности.»"
1602005-63 = "Но если в итоге я решу, что снайперская работа мне не подходит, разве это не значит, что всё сделанное до сих пор было зря?"
1602005-64 = "Если бы сразу выбрала правильно, могла бы расти быстрее и сильнее. А так, возможно, держусь за то, что вообще не моё."
1602005-65 = "...От одной мысли немного сводит с ума."
1602005-66 = "[ns9] «Что ты сама говорила раньше?»\n[ns10] «Даже ошибку всегда можно исправить.»"
1602005-69 = "[ns] «Всё нормально. У вас впереди ещё куча времени.»"
1602005-70 = "Не особо. Я уже на третьем курсе."
1602005-71 = "Разве менять путь уже не поздно?"
1602005-72 = "Я ведь не могу быть студентом вечно."
1602005-73 = "[s11] «Это неправда. Пока человек готов учиться...»\n[s12] «Любой может быть учеником.»"
1602005-76 = "Тогда это значит, что и вы можете быть учеником?"
1602005-77 = "Забавная логика."
1602005-78 = "Вы определённо странный взрослый."
1602005-79 = "...Но спасибо. Мне уже не так одиноко."
1602005-80 = "А, фонарь опять погас."
1602005-81 = "...И снова загорелся."
1602005-82 = "Пока что я буду верна своим приказам."
1602005-83 = "Даже если задача проста — включать и выключать свет..."
1602005-84 = "Я буду продолжать. Может, это зажжёт свет и в чьём-то сердце."
1602005-86 = "Мы с Отоги смотрели, как фонарь гаснет и снова загорается, прогоняя одиночество друг друга в тишине ночи."
