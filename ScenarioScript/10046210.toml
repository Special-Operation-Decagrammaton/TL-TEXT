[translation]
10046210-2 = ""
10046210-3 = "...Как и ожидалось."
10046210-4 = "Так вот почему в последнее время в Геенне так тихо?"
10046210-5 = "...Главный префект?!"
10046210-6 = "А, я помешала? Прости."
10046210-7 = "Я уйду, как только закончу оценку обстановки."
10046210-8 = "Помешали...? Я бы не сказала—"
10046210-9 = "Я просто удивилась. Вы в другой... одежде."
10046210-10 = "Хм? Да, я переоделась, потому что мы на пляже. Не хотелось бы намочить хорошую одежду."
10046210-11 = "А... понятно. Отдавать её в химчистку было бы кошмаром..."
10046210-12 = "Ладно, что ты здесь делаешь?"
10046210-13 = "...Судя по виду, не отдыхаешь..."
10046210-14 = "...А, точно. Это пляж Чаепития, поэтому его охраняет Оперативная группа Правосудия. Мне следует как следует объясниться."
10046210-15 = "Для начала прошу прощения, что пришла без предупреждения."
10046210-16 = "Г-Главный префект?! Не нужно кланяться—"
10046210-17 = "Мне следовало помнить о своём положении и понимать, как это будет выглядеть."
10046210-18 = "Но я пришла сюда как Сорасаки Хина, а не как член Префектской команды."
10046210-19 = "..."
10046210-20 = "Понимаю, что члену Оперативной группы Правосудия это может быть трудно принять."
10046210-21 = "Некоторые могли бы сказать..."
10046210-22 = "Если честно, я здесь, чтобы привести в чувство нарушителей из Геенны. Знаю, они доставили вам немало проблем."
10046210-23 = "Ещё как..."
10046210-24 = "Но даже если это общественный пляж, присутствие Префектской команды на территории Чаепития наверняка всё усложнит."
10046210-25 = "Студенты Геенны — наша ответственность. Я не хочу, чтобы ситуация обострялась."
10046210-26 = "И поэтому вы пришли одна...?"
10046210-27 = "Да. Это личный визит. Я стараюсь действовать дипломатично."
10046210-28 = "...Хотя приехать сюда было крайней мерой."
10046210-29 = "У меня есть предложение, Ичика."
10046210-30 = "Если ты не против, может ли доброволец из другой академии помочь с патрулированием пляжа?"
10046210-31 = "Помощь от главного префекта?!"
10046210-32 = "Не от главного префекта. Просто от Сорасаки Хины из академии Геенна."
10046210-33 = "А, точно. Эм, да, Хина... я буду очень рада вашей помощи!"
10046210-34 = "Спасибо, что согласилась. Тогда решено."
10046210-35 = "...Ничего себе. Теперь мне кажется, что нам любой по плечу!"
10046210-36 = "Ничего не изменилось. У тебя уже есть отличная команда в Оперативной группе Правосудия."
10046210-37 = "Я ничем не лучше них. Тебе стоит гордиться всем, что ты уже сделала."
10046210-38 = "Что ж, пойдём?"
10046210-39 = ""
10046210-41 = ""
10046210-42 = ""
10046210-43 = "А, так вот она какая, главный префект Геенны."
10046210-44 = "В ней определённо чувствуется вес."
10046210-45 = "Интересно, хватит ли даже ЕЁ, чтобы приструнить студентов Геенны..."
10046210-46 = "..."
10046210-47 = "Не будем зацикливаться."
