[translation]
10050090-1 = "Эпизод 9;Как текущая река"
10050090-2 = "...Итак, президент Черно. Это предложенное нами соглашение о культурном обмене между Тринити и Красной Зимой."
10050090-3 = "Это соглашение одобрено и санкционировано Сенсеем из Шале и Библиотечным комитетом Тринити. Чаепитие поддерживает их решение."
10050090-4 = "...При условии, что никакие книги или культурные материалы не будут распространяться в Тринити без предварительного согласования."
10050090-5 = "Уверена, это предложение вас устроит. В конце концов, как сказала ваша Якумо: «культура должна течь»."
10050090-6 = "О. Эм..."
10050090-7 = "Вот незадача... В основном потому, что Издательский отдел просто взял и сделал всё по-своему..."
10050090-8 = "Погодите. Вы сказали «Сенсей из Шале»? То есть, товарищ? Понятно!"
10050090-9 = "В таком случае Шале выступит официальным представителем Красной Зимы по этому делу."
10050090-10 = "[s] «А? Я?»"
10050090-11 = "Хм? Значит, вы хотите, чтобы Шале, а следовательно и Сенсей, вели переговоры от вашего имени?"
10050090-12 = "Да. Считайте слово Сенсея словом Красной Зимы. Но только в этом случае!"
10050090-13 = "Что ещё важнее, мне нужно идти на встречу, которую я НИ В КОЕМ СЛУЧАЕ не могу пропустить!!"
10050090-14 = "Д-Должно быть, она очень важная..."
10050090-16 = "Да! Поспать!"
10050090-17 = "П-поспать?! Наверное, это какое-то выражение Красной Зимы."
10050090-18 = "[s] «(Нет, совсем нет...)»"
10050090-19 = "И-и Шале будет представителем Красной Зимы в этом культурном обмене?"
10050090-20 = ""
10050090-22 = ""
10050090-23 = "(Неужели?! Если с соглашением что-то пойдёт не так, Шале, как представитель Красной Зимы, придётся взять на себя часть ответственности...)"
10050090-24 = "(А это, в свою очередь, вынудит Тринити оказаться в противостоянии с Шале!)"
10050090-25 = "(Тогда... вполне возможно, что это соглашение испортит мнение Сенсея о Тринити... как в политическом, так и в эмоциональном смысле...)"
10050090-26 = "(Красная Зима тонко и ненавязчиво держит Тринити под контролем...)"
10050090-27 = "(...даже не запачкав мизинца. Неужели это политическая изощрённость Красной Зимы?)"
10050090-28 = "П-Президент Черно! Подождите!"
10050090-29 = ""
10050090-31 = ""
10050090-32 = ""
10050090-33 = "[ns] «Что случилось, Нагиса? Ты плохо выглядишь...»"
10050090-34 = "Н-Нет! Совсем нет! Конечно! Да, Сенсей, в этом деле мы оправдаем ваши ожидания и даже превзойдём их."
10050090-35 = "Ух, Наги, ты ещё не закончила? Мне так ску-у-учно."
10050090-36 = "Мика. Сенсей здесь, веди себя прилично."
10050090-37 = "П-Правда. Простите, Сенсей..."
10050090-38 = "А? Мне можно делать что хочу? Хи-хи! Вы лучший, Сенсей! Вы же знаете, что вы мне нравитесь, да?"
10050090-39 = "Позвольте ещё раз поприветствовать вас, члены Чаепития. Я должна выразить вам глубочайшую благодарность за вашу щедрость."
10050090-40 = "Здравствуйте, Издательский отдел. Приятно наконец познакомиться с вами официально."
10050090-41 = "Со стороны Тринити мы надеемся, что этот инцидент станет отправной точкой для крепких и плодотворных отношений с Красной Зимой."
10050090-42 = "Пожалуйста, и дальше снабжайте Тринити отличной литературой."
10050090-43 = "Да, спасибо, мэм. Для меня честь получить возможность оправдать ваши ожидания."
10050090-45 = "Эй-эй, Якумо, да? Приятно познакомиться! Я Мика из Чаепития!"
10050090-46 = "Можно быстренько поговорить? Только вдвоём?"
10050090-47 = "А, здравствуйте. Арамаки Якумо."
10050090-48 = "(Это одна из трёх участниц Чаепития...)"
10050090-49 = "(Будто я стою перед аналогом президента Черно в Тринити.)"
10050090-50 = "(Хотя не совсем. Будь это она, я бы куда лучше контролировала ситуацию.)"
10050090-51 = "Я прочитала книгу, которую вы привезли! Просто хотела сказать спасибо."
10050090-52 = "А, да."
10050090-53 = "И, эм, ну... Это просто моё личное мнение, ладно?"
10050090-54 = "Просто... главная героиня немного напомнила мне Сенсея. Именно это меня и зацепило."
10050090-55 = "Так что это личная просьба... Или, скорее, просто надежда?"
10050090-56 = "Я подумала... Если бы вы могли немного изменить дизайн партнёрши, это бы здорово дополнило историю!"
10050090-57 = "...?"
10050090-58 = "О... Хо-хо. Хе-хе-хе."
10050090-59 = "Спасибо за прекрасный отзыв, Мика."
10050090-60 = "Мне очень нравится ваше предложение, но понадобится чуть больше подробностей. Какие изменения вы представляете?"
10050090-61 = "Правда? Ура! Ну, например... Может, сделать её волосы более розовыми? О, и немного волнистыми! Было бы очень мило!"
10050090-62 = "Хм... Она немного озорная, и люди называют её неуклюжей, но когда становится серьёзно, она справляется!"
10050090-63 = "Кто-то, кто поднимает всем настроение! И можно сделать маленький пучок с одной стороны! А, если что, это можно убрать."
10050090-64 = "Её любимая еда — гигантское парфе! А ещё она любит BB-крем и духи Samuela «The Beyond»!"
10050090-65 = "Только никаких больше рулетов. Я ими уже сыта..."
10050090-66 = "В общем! В общем! Что думаете?"
10050090-67 = "Да-да. Я прекрасно это представляю."
10050090-68 = "То есть я прекрасно представляю совершенно новую книгу. Если честно, чтобы воплотить вашу идею, придётся начинать с нуля."
10050090-69 = "О-О. Понятно..."
10050090-70 = "И в процессе это станет книгой только для вас. Специально для Мисоно Мики."
10050090-71 = "А? К-Книга только для меня...?"
10050090-72 = "Боже мой! Да! Это было бы ПОТРЯСАЮЩЕ!"
10050090-73 = "Да-да. Для человека вашего положения это, пожалуй, единственный подходящий вариант. Однако каждое решение способно породить новые проблемы."
10050090-74 = "О чём ты?"
10050090-75 = "Видите ли, из-за самой природы издательского дела невозможно избежать эффекта масштаба."
10050090-76 = "Производство для нескольких избранных, а не для масс, резко увеличивает затраты."
10050090-77 = "Особенно если речь о таком индивидуальном заказе... Написать книгу для одного человека... Это настолько редко, что, думаю, прецедентов вообще нет. Даже цену определить сложно."
10050090-78 = "Если совсем откровенно, это дорогое удовольствие."
10050090-79 = "А...? Насколько дорого?"
10050090-80 = ""
10050090-82 = ""
10050090-83 = "...Этого хватит?"
10050090-84 = "?!?!"
10050090-85 = "Ч-Что?! У меня вообще-то есть совесть, ясно?! Даже половины этого было бы достаточно."
10050090-86 = "Ах, ну блин! Вы просто дразнили меня, когда сказали, что это дорого? Я зря нервничала! Хорошо! Тогда—"
10050090-87 = "Мика, дорогая?"
10050090-88 = ""
10050090-91 = ""
10050090-92 = "Д-Да, Наги?"
10050090-93 = "Мне правда каждый раз нужно тебе всё разжёвывать?"
10050090-94 = "У-у-ух... Ладно... Наги, ты вредина!"
10050090-96 = "Спасибо за всю вашу тяжёлую работу, Издательский отдел."
10050090-97 = "Это мы должны вас благодарить. Мы вовсе не хотели доставить столько проблем Библиотечному комитету и Комитету правосудия."
10050090-99 = "Да, но вы также принесли хорошие перемены. В последнее время я заметила, что библиотеку посещает больше участников."
10050090-100 = "И благодаря вашей книге общий интерес к чтению тоже вырос."
10050090-101 = "Это касается и меня. Я начала читать книги не только о справедливости и старых выражениях."
10050090-102 = "Да-да. Но, пожалуйста, следите, чтобы все вовремя возвращали книги."
10050090-103 = "Да, мэм. Конечно. И, эм, Таканэ?"
10050090-104 = "Да, Маширо?"
10050090-105 = "Эта история всё ещё не закончена, верно?"
10050090-106 = "Да... Это так..."
10050090-107 = "Если не возражаешь... когда выйдет следующий том... свяжись со мной..."
10050090-108 = "Фуфу. Тебе понравилось?"
10050090-109 = "Очень."
10050090-110 = "Разумеется. Любой, кто любит истории, — мой товарищ."
10050090-111 = "А, да. Я не знаю, что это значит, но группа студенток Тринити попросила передать сообщение."
10050090-112 = "«Пожалуйста, выпустите сборник критических эссе Принцессы Красной Зимы!»"
10050090-113 = "..."
10050090-114 = "Я подумаю..."
10050090-115 = "Спасибо, Таканэ. Буду рада дальнейшему сотрудничеству."
10050090-116 = ""
10050090-118 = ""
10050090-119 = ""
10050090-120 = ""
10050090-121 = "Президент!!"
10050090-122 = "А? Что такое, Таканэ?"
10050090-123 = "НЕ пытайтесь прикидываться дурочкой. Вы это слышали, так как теперь намерены за всё отвечать?!"
10050090-124 = "Ну, эм. Понимаешь..."
10050090-126 = "Всё ради маркетинга!"
10050090-127 = "Это оправдание не будет работать вечно!!"
10050090-129 = ""
10050090-130 = ""
10050090-131 = ""
10050090-132 = ""
10050090-133 = ""
10050090-139 = "[ns] «Ты довольна, Якумо?»"
10050090-140 = "Вполне."
10050090-141 = "[s1] «Рад это слышать.»\n[s2] «Но с этого момента я буду следить за тобой гораздо внимательнее!»"
10050090-144 = "Вот чёрт. Но почему?"
10050090-145 = "А? Потому что я слишком хорошо понимаю такие вещи?"
10050090-146 = "Например, я знаю вес договора и умею отложить гордость в сторону ради бизнеса...?"
10050090-147 = "[s3] «Да. Это отличный навык, и когда его используют во благо, он действительно достоин восхищения.»\n[s4] «Но из-за него слишком легко перейти черту. А мои возможности не безграничны.»"
10050090-150 = "..."
10050090-151 = "Знаю-знаю."
10050090-152 = "Я ведь успела заработать репутацию довольно подозрительной особы, не так ли? Тут уж спорить не стану."
10050090-153 = "Что же до того, что вы за мной присматриваете..."
10050090-154 = "Я предпочту считать это проявлением вашего ненасытного любопытства ко мне и буду этим наслаждаться."
10050090-155 = "[s] «Если бы ты поменьше сыпала сладкими речами, людям было бы проще тебя выносить, знаешь ли!»"
10050090-156 = "Именно это я и пытаюсь сказать! Сенсей вовсе не вкладывал ничего подобного в свои слова! Если бы не вмешательство Сенсея во весь этот бардак... *вздох*"
10050090-157 = "Отличная работа, Сенсей. Я искренне благодарна."
10050090-158 = "[s] «Я справился только благодаря твоей помощи, Таканэ.»"
10050090-159 = "С-Спасибо, что так это воспринимаете..."
10050090-160 = "*вздох* Если бы я знала, что всё равно всё закончится именно так, я бы с самого начала просто связалась с Сенсеем."
10050090-161 = "Кстати, если подумать, почему вы этого не сделали, Президент? Для вас это довольно нетипичная оплошность."
10050090-162 = "А, ну... Я об этом думала, но..."
10050090-163 = "Но?"
10050090-164 = ""
10050090-166 = ""
10050090-168 = "...Я не хотела получить нагоняй?"
10050090-169 = "Президент!!"
10050090-170 = "[s] «Якумо!!»"
10050090-171 = ""
10050090-173 = ""
10050090-174 = ""
10050090-175 = ""
10050090-176 = ""
10050090-177 = ""
10050090-178 = "[ns] «Ну что ж.»"
10050090-180 = "[ns] «Сегодня хорошая погода. Как всегда.»"
10050090-182 = "Возрождение зимнего неба: трактат о культурном обмене"
