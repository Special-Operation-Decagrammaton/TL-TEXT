[translation]
2300206-1 = "Хирургические процедуры Тринити"
2300206-2 = "Медпункт Рыцарей исправительного курса Тринити"
2300206-3 = "Спасибо, что сегодня помог перенести лекарства, Сенсей."
2300206-4 = "В документах оказалось гораздо больше пропусков, чем я думала. Если бы я одна разбирала склад, ушёл бы весь день."
2300206-5 = "[s] «Пустяки.»"
2300206-6 = "Благодаря тебе я даже смогла немного передохнуть! Хи-хи."
2300206-7 = "Кстати, Сенсей. Пол недавно мыли, поэтому здесь скользко, осторожно..."
2300206-9 = "*грохот*"
2300206-10 = "С-Сенсей! Ты в порядке?"
2300206-11 = ""
2300206-13 = "[ns] «Немного ушибся, но всё нормально.»"
2300206-14 = "Но колено кровоточит! Нужно скорее обработать..."
2300206-15 = "Нам придётся немедленно ампутировать ногу, чтобы не допустить инфекции!"
2300206-16 = "[s] «С-Стой!»"
2300206-17 = "А? В чём проблема, Сенсей?"
2300206-18 = "Если не ампутировать быстро, инфекция распространится и рана загноится."
2300206-19 = "Так написано в старой медицинской книге!"
2300206-20 = "[s] «Насколько старой?»"
2300206-21 = "Не знаю. Может... лет пятьсот?"
2300206-22 = "Не волнуйся! Согласно книге, умелый врач может закончить ампутацию меньше чем за минуту..."
2300206-23 = "Нужно сделать это немедленно, пока не стало хуже!"
2300206-24 = "[s] «Для такой раны хватит пластыря.»"
2300206-25 = "Точно?"
2300206-26 = ""
2300206-27 = "Тогда хотя бы сначала позволь продезинфицировать рану. Сиди спокойно."
2300206-30 = "― Хорошо, сейчас я продезинфицирую рану,[wa:1020]"
2300206-32 = "― поэтому сними носок и не двигайся.[wa:10]"
2300206-35 = "― Если рану плохо обработать,[wa:10]"
2300206-37 = "― может начаться инфекция. Это серьёзно.[wa:2000]"
2300206-40 = "― Может немного щипать, но ты справишься![wa:880]"
2300206-42 = "― Начинаем! Сейчас всё почистим![wa:1860]"
2300206-45 = "― Хорошо, молодец.[wa:740]"
2300206-47 = "― Почти закончили.[wa:10]"
2300206-50 = "― Может, я[wa:420]"
2300206-52 = "― поколдую над тобой, Сенсей? Рана быстрее заживёт.[wa:10]"
2300206-55 = "― Боль-боль, уходи![wa:3240]"
2300206-57 = "― Вот! Совсем не болит, правда?[wa:60]"
2300206-59 = ""
2300206-60 = "Наносим лекарство... закрываем пластырем..."
2300206-61 = "Готово! Молодец, Сенсей."
2300206-62 = "Смотри, чтобы пластырь не отклеился!"
2300206-63 = "[s] «Какой яркий пластырь.»"
2300206-64 = "Да, мой любимый. Он не только красивый — если потереть сверху, сладко пахнет."
2300206-65 = "Но он слишком маленький для больших ран или мест ампутации."
2300206-66 = "Поэтому отрезать тебе ногу было бы плохо."
2300206-67 = "[s] «Ты думаешь, проблема ампутации именно в этом?!»"
