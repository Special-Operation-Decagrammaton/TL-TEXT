[translation]
1600205-1 = "Сенсей — это ответ!"
1600205-2 = "Вот ты где, Сенсей! Я тебя ждала!"
1600205-3 = "Я позвала тебя сегодня потому что...!"
1600205-4 = "(пристально смотрит)"
1600205-5 = "Эм."
1600205-6 = "Это библиотека. Нужно шептать, иначе библиотекари..."
1600205-7 = "Ну, библиотекари здесь довольно страшные. У нас есть история..."
1600205-8 = "Что? Нет, конечно, я не в чёрном списке!"
1600205-9 = "...Но в списке предупреждений. Меня часто просят говорить тише."
1600205-10 = "Хи-хи."
1600205-11 = "В общем, причина, по которой я позвала тебя, Сенсей... вот!"
1600205-12 = "Почему книги по психологии?"
1600205-13 = "Во-первых, не только они. Ещё несколько биографий и журналов со сплетнями..."
1600205-14 = ""
1600205-15 = ""
1600205-16 = "Недавно один студент задал мне несколько вопросов."
1600205-17 = "Я удивилась, потому что обычно ученики от меня убегают. Даже немного занервничала."
1600205-18 = "Что значит «не выгляжу нервной»? Поверь, я нервничаю!"
1600205-19 = "Я хотела ответить на её вопрос настолько безупречно и идеально, насколько возможно."
1600205-20 = "Она спросила..."
1600205-21 = ""
1600205-22 = "«Это было связано с её чувствами, да?»"
1600205-23 = "«Что-то вроде: „Почему я так себя чувствую? Ты ведь должна знать, Котори.“»"
1600205-24 = ""
1600205-26 = "...Именно. Она говорила о чувстве, когда сердце начинает бешено колотиться, а я не знала, что ответить."
1600205-27 = "Если бы вопрос был научным, я могла бы говорить часами."
1600205-28 = "Но поскольку нет темы, которую я не способна объяснить, я сказала, что отвечу позже."
1600205-29 = "Мне нужно выяснить, какое чувство заставляет её сердце так биться!"
1600205-30 = "...Вот на этом я и застряла."
1600205-31 = "Но к ответу так и не приблизилась."
1600205-32 = "В книгах противоречивая информация, а интернет вообще оказался бесполезен..."
1600205-33 = "Создать базу данных, которая даст однозначный ответ, невозможно."
1600205-34 = "Что мне делать, Сенсей? Что бы сделал ты?"
1600205-35 = "Ты случайно не знаешь, что это за чувство?"
1600205-36 = "[s1] «Может, найти ближайшие существующие данные, соответствующие вопросу?»\n[s2] «Может, изучить надёжную выборку?»"
1600205-37 = "Такое существует? Где найти что-то подобное..."
1600205-38 = "Такое существует? Где найти что-то подобное..."
1600205-39 = "А?"
1600205-40 = "Я?"
1600205-41 = "Почему я...?"
1600205-42 = "Мне нужно подумать о собственных чувствах?"
1600205-43 = "Не понимаю, о чём ты..."
1600205-44 = "Я не такая, как она. Мы совсем разные..."
1600205-45 = "Думаешь, я уже чувствовала то же самое?"
1600205-46 = "Наверное, стоит ещё раз вспомнить, как она выглядела, когда спрашивала."
1600205-47 = "Хм-м."
1600205-48 = "Если это твой совет, Сенсей, тогда я подумаю."
1600205-49 = "Когда она задала вопрос, выражение лица было таким..."
1600205-50 = ""
1600205-51 = "Хм. Что могло заставить меня вести себя так? Если бы это была я..."
1600205-52 = "Если бы я оказалась в такой ситуации..."
1600205-53 = "В такой ситуации я бы думала о..."
1600205-54 = "Ага! Эврика! Теперь понимаю!"
1600205-55 = "Значит, она чувствовала..."
1600205-56 = "...потому что именно так чувствую себя я... когда думаю о Сенсее..."
1600205-57 = "...!"
1600205-58 = "[s] «...Котори?»"
1600205-59 = "Ну, эм. Сенсей... Можно я..."
1600205-60 = "Можно я... быстро схожу в туалет?"
1600205-61 = "Я ненадолго!"
1600205-62 = "[s] «...?»"
1600205-63 = "Скоро буду!"
1600205-65 = "Kotori ran to the restroom and, for reasons unknown, never returned."
1600205-66 = "Позже мне пришло сообщение: «Прости, что так убежала. Благодаря тебе кризис миновал. Спасибо»."
