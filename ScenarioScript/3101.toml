[translation]
3101-1 = "Проверка концепции 1"
3101-2 = "Конференц-зал Семинар"
3101-7 = ""
3101-8 = "Раз все здесь..."
3101-9 = "Можем начинать."
3101-10 = ""
3101-12 = ""
3101-14 = "Добро пожаловать на 28-е заседание Комитета по пересмотру бюджета Миллениум!"
3101-15 = ""
3101-19 = "Как вы уже знаете, заседание Комитета по пересмотру бюджета проводится регулярно: мы оцениваем перспективы исследований и разработок каждого клуба и соответственно распределяем финансирование."
3101-20 = "Если клуб хочет больше средств, мы должны определить, заслуживает ли он их — обычно по способности создавать полезные продукты."
3101-21 = "На прошлом заседании было полно странных вещей, совершенно лишённых практического смысла. Как и на заседании до него..."
3101-22 = "Но я... я всё ещё верю в потенциал наших студентов."
3101-23 = ""
3101-25 = "Начнём с... «Мягкого цемента» Клуба разработки новых материалов!"
3101-26 = "Мягкого...?"
3101-27 = ""
3101-29 = ""
3101-31 = "Да! Это новый, инновационный подход к цементу!"
3101-32 = "...Что именно значит «мягкий» применительно к цементу?"
3101-33 = "Как всем известно, цемент — любимый строительный материал: он пластичен во влажном виде и твёрдый после высыхания."
3101-35 = "Но у цемента есть один роковой недостаток... После затвердевания он становится слишком твёрдым!"
3101-36 = "В зданиях живут люди! Но наши исследования показывают, что тело обычного человека куда слабее цемента, поэтому при падении или ударе о цемент можно получить травму."
3101-37 = "А «Мягкий цемент» решает эту проблему, оставаясь мягким даже после затвердевания. Вы не только не поранитесь — вам даже захочется на нём полежать!"
3101-39 = "Строительный материал, мягкий на ощупь? Поистине революционно..."
3101-41 = "Хм... Всё это очень интересно, однако..."
3101-42 = "Если он настолько мягкий, как именно он не согнётся под весом других строительных материалов — например стали или кирпича?"
3101-43 = "А... Ну, насчёт этого... Как говорится, лучшие изобретения всегда оставляют место для улучшений..."
3101-44 = ""
3101-46 = ""
3101-47 = "То есть, если коротко, вы взяли строительный материал, который часто используют для фундаментов и других задач, требующих прочности и жёсткости, и сделали его мягким?"
3101-49 = "Отклонено!"
3101-50 = ""
3101-53 = ""
3101-54 = "Н-Не-е-ет!"
3101-55 = "Следующее!"
3101-57 = "Следующая разработка — «Драконий дастер», предложенный Мурокасой Аканэ."
3101-58 = ""
3101-60 = ""
3101-63 = ""
3101-64 = "А? Аканэ? C&C подали исследовательскую заявку?"
3101-65 = "*шёпот* Бюджет C&C и так выделяется отдельно в зависимости от масштаба операций... Этого недостаточно?"
3101-66 = "О нет, это не предложение C&C. Я подала его лично."
3101-67 = "Я преданный член C&C..."
3101-68 = "Но ещё я студент научной школы Миллениум."
3101-69 = "Вносить вклад в технологическое развитие академии новыми идеями — ещё один вид служения, который я хочу предоставить!"
3101-71 = "Какое прекрасное отношение для студента Миллениум! Мы все должны по возможности стремиться к инновациям и творчеству."
3101-72 = "У меня плохое предчувствие..."
3101-73 = "Давайте выслушаем. Чем этот «Драконий дастер» отличается от обычной метёлки для пыли?"
3101-75 = "Метёлки для пыли — один из моих любимых инструментов для уборки."
3101-76 = "Но я часто сталкиваюсь с пятнами, которые обычной метёлкой просто не удалить."
3101-77 = "Очевидно, есть предел количеству инструментов, которые можно носить с собой, а каждый раз ходить за другим — неудобно и занимает время."
3101-78 = ""
3101-80 = ""
3101-81 = "Поэтому я придумала «Драконий дастер»... Метёлку для пыли со встроенным распылителем сжатого газа!"
3101-82 = ""
3101-84 = ""
3101-85 = "Распылителем сжатого газа...?"
3101-86 = "И не простого газа. При активации этой функции сжатый газ воспламеняется во время распыления и полностью испепеляет цель!"
3101-87 = "Ни одно стойкое пятно или липкое вещество не выдержит очищающего пламени «Драконьего дастера»."
3101-88 = "Инструмент, который извергает огонь..."
3101-89 = "Аканэ, это огнемёт."
3101-90 = "О... Но разве это не новый вид огнемёта?"
3101-91 = "Нет. Не думаю, что нам нужно финансировать уже существующий продукт."
3101-93 = "Отклонено. Следующее!"
3101-95 = "Дальше..."
3101-96 = ""
3101-98 = ""
3101-99 = "О боже... Это предложение от Момои из Отдела разработки игр, получившей специальную награду на последней премии Миллениум."
3101-100 = ""
3101-102 = ""
3101-104 = "Хе-хе... Юука может быть Холодным Бесчувственным Бухгалтером, но увидев моё безупречное предложение, сама будет умолять вложиться."
3101-105 = ""
3101-108 = ""
3101-109 = "Отказ."
3101-110 = "С-Стой! Ты даже не выслушала!"
3101-111 = "И не нужно. Отдел разработки игр целыми днями только играет вместо настоящей клубной деятельности."
3101-112 = "Э-Это нечестно! Когда мы работаем — мы выдаём результат!"
3101-113 = "К тому же мы уже придумали модель прибыли с использованием передовых технологий!"
3101-114 = "...Модель прибыли с использованием передовых технологий?"
3101-115 = "Да! В этом проекте игры используется новейшая технология блокчейна!"
3101-116 = "Когда играешь, часто получаешь игровую валюту, правда? Благодаря этой технологии мы просто превратим игровые деньги в настоящие!"
3101-117 = "То есть можно просто сидеть, играть и зарабатывать деньги! Хи-хи."
3101-118 = "Звучит правдоподобно. Если привязать это к криптовалюте, игроки смогут выводить деньги."
3101-119 = "Верно, но кто будет обменивать на неё реальные деньги?"
3101-120 = "...Обменивать? Реальные деньги...?"
3101-121 = "Ну... Разве Семинар не может просто их напечатать...?"
3101-122 = ""
3101-124 = ""
3101-126 = "Я так и знала! Отклонено!"
3101-127 = ""
3101-129 = ""
3101-132 = "Неужели опять отклонят вообще каждое предложение..."
3101-133 = "Несколько выглядели многообещающе."
3101-134 = ""
3101-136 = ""
3101-137 = "По сравнению с прошлым годом число предложений с использованием новых технологий выросло на 37%."
3101-138 = "И это хорошо? Ни один из предложенных способов использования этих технологий не имел смысла!"
3101-139 = "...Я просто не понимаю, почему всех так тянет к настолько непрактичным исследованиям."
3101-140 = "Наша работа — не решать, в каком направлении должны идти исследования."
3101-141 = "И кто знает? Сейчас исследование может выглядеть бессмысленным, но в будущем стать основой революционной технологии."
3101-142 = "...Проблема Миллениум."
3101-143 = "..."
3101-145 = "Семинар, который можно считать сердцем Миллениум, изначально был собранием исследователей с одной целью: найти решения семи неразрешимых проблем современного мира."
3101-146 = "Чтобы решить эти проблемы, проводились бесчисленные эксперименты, разрабатывались подходы, тесты и многое другое... А по мере расширения этих усилий появилась научная школа Миллениум, какой мы знаем её сегодня."
3101-147 = "Конечно, большинство нынешних студентов даже не знает, что это за проблемы..."
3101-148 = "Но каждое исследование, каждый безумный эксперимент — всё это часть процесса решения тех семи проблем."
3101-149 = "...Пожалуй, да. Пока есть хотя бы крошечный шанс на прогресс, в Миллениум поощряются и рекомендуются любые размышления и эксперименты."
3101-151 = "Но никто не знает, принесут ли эти безумные идеи плоды. Зато мы точно можем знать, каким будет наш бюджет."
3101-152 = "Можно сколько угодно поддерживать студентов, но если бесконечно их финансировать, академия обанкротится."
3101-153 = "Хи-хи. Великие исследователи часто замечают практичные вещи вроде времени и денег только тогда, когда те заканчиваются."
3101-154 = "Школе Миллениум так повезло иметь такого блестящего казначея, как Юука."
3101-155 = "...Ты ведь издеваешься надо мной, да?"
3101-156 = "Если тебя так беспокоят финансы Миллениум, почему ты раньше не говорила больше?"
3101-157 = "Когда мы обсуждали полезность так называемой «Умной бомбы» Отдела исследований ИИ, которая якобы сама определяет момент взрыва без участия человека, твои слова были бы куда убедительнее, Ноа..."
3101-158 = "Прости, но я всего лишь секретарь."
3101-159 = "Хороший секретарь не вмешивается ни при каких обстоятельствах. Мы должны быть столь же нейтральны, как наши записи."
3101-160 = "Какая удобная логика..."
3101-161 = "Похоже, ты сама выбираешь, когда быть секретарём Семинар, а когда — Ушио Ноа..."
3101-162 = "Хи-хи! Кем бы я ни была, это не меняет того факта, что ты мне нравишься, Юука!"
3101-163 = "Да-да. Наверное, не стоило удивляться..."
3101-164 = ""
3101-166 = ""
3101-167 = "...Что это за документ?"
3101-168 = "Мы пропустили предложение при рассмотрении бюджета?"
3101-169 = "Невозможно. Мы выслушали каждый клуб из списка."
3101-170 = ""
3101-172 = ""
3101-173 = "Хм... Автор предложения..."
3101-174 = ""
3101-176 = ""
3101-177 = ""
3101-179 = "Президент Веритас?!"
