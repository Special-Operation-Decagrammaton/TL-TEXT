[translation]
1503-1 = "Проблемы и следопыты, часть 3"
1503-2 = "Хакерская комната Веритас"
1503-4 = "Подтверждено заражение вредоносным ПО через внедрение кода. Бэкдор установлен."
1503-5 = "Приближается ещё одна попытка взлома."
1503-6 = ""
1503-7 = "Исправь, исправь, исправь, исправь, исправь...!#nИсправь, исправь, исправь!"
1503-8 = "За кого ты меня принимаешь? За всезнающий суперкомпьютер?"
1503-9 = "Но такими темпами из хакеров мы превратимся во взломанных!"
1503-10 = "Я тебя умоляю! Ты наша последняя надежда!"
1503-11 = ""
1503-13 = ""
1503-14 = "*вздох* Отойди. Защитный код — не моя специализация, но сделаю всё, что смогу."
1503-15 = ""
1503-18 = ""
1503-19 = "Сформирую пакет, чтобы сбить их со следа. А? Что?! Они уже его обошли."
1503-20 = ""
1503-22 = ""
1503-23 = "А если вызвать перегрузку, заложив логическую бомбу в уязвимую папку...? Не выйдет. Уже заблокировали."
1503-24 = ""
1503-26 = ""
1503-27 = ""
1503-28 = "Всё плохо. Даже я, возможно, не смогу нас отсюда вытащить."
1503-29 = "Т-Ты шутишь! Но ты же лучшая..."
1503-30 = "Меня загоняют в угол со всех сторон. Будто они заранее знают каждый мой ход."
1503-31 = "Трудно поверить, что за пределами Веритас есть кто-то настолько талантливый."
1503-32 = "Из-за длительного соединения растёт сетевой трафик."
1503-33 = "Если немедленно не отключимся, Семинар нас обнаружит."
1503-34 = "Ты права. Прости, Маки, но больше рисковать ради правок записей студентов нельзя."
1503-36 = "Ух... Ладно. Меньше всего я хочу снова сидеть на одной из лекций Юки."
1503-37 = "Я выхожу. Харэ, можешь отзывать дрон."
1503-38 = "SYSTEM: Удаление журнала. Система завершает работу."
1503-40 = "Позже тем же вечером."
1503-41 = ""
1503-44 = "Это я."
1503-45 = "О. Привет..."
1503-46 = "Что случилось? Тут атмосфера как на похоронах."
1503-47 = "Сегодня нам пришлось лицом к лицу столкнуться с пределами собственных возможностей."
1503-48 = "Как бы хороша ты ни была, всегда найдётся кто-то лучше."
1503-50 = "Сегодня утром какой-то неизвестный хакер сумел взломать нас в ответ."
1503-51 = "Он даже Харэ обвёл вокруг пальца. Я до сих пор в шоке."
1503-52 = "Вот как? Неохотно признаю, это впечатляет."
1503-53 = "Кстати о хакерах: сегодня, когда я проверяла сервер с данными студентов, мне попался один довольно талантливый."
1503-54 = "Он копался в результатах медосмотра. Работал так быстро, что даже мне было непросто с ним справиться."
1503-55 = "С-Сервер с данными студентов?"
1503-56 = "Теперь понятно, почему с ними было так трудно."
1503-57 = "Нашим противником была вице-президент?!"
1503-59 = "Вы серьёзно? Так это вы трое устроили весь тот бардак, когда сегодня взломали данные студентов?"
1503-60 = "Я должна была догадаться. Я ведь сразу почувствовала в этих приёмах что-то знакомое..."
1503-61 = "Мы с самого начала вели проигрышную битву."
1503-62 = "Я была разочарована собой из-за поражения неизвестному хакеру, но теперь хоть могу успокоиться: это была Чихиро."
1503-63 = "Я так и знала! Лучше Веритас никого нет, теперь всё сходится!"
1503-65 = "Сотри эту ухмылку с лица! Я вас ничему не научила? Как можно так безответственно обращаться с чужой личной информацией?"
1503-66 = ""
1503-68 = ""
1503-69 = "Вас всех ждёт суровое повторное обучение хакерской этике. Так что готовьтесь."
1503-70 = "П-Переобучение?! Это же просто кодовое слово для наказания! Полегче с нами!"
1503-72 = "Коридор Милленниума"
1503-73 = "Несколько дней спустя..."
1503-74 = ""
1503-77 = "Эй, слышала?"
1503-78 = "Да кто не слышал? Юука весит 100 килограммов — это же главная сплетня года!"
1503-79 = "Но по ней не скажешь... Как думаешь, как она это скрывает?"
1503-80 = "Может, она разработала какой-нибудь голографический проектор и постоянно носит его на себе?"
1503-81 = "Какая глупость! Кто станет тратить столько сил на такую штуку? Проще просто заняться спортом!"
1503-82 = "Информация, утёкшая в соцсети, была подделкой! Почему этот слух всё ещё распространяется?!"
1503-83 = ""
1503-85 = ""
1503-86 = ""
1503-87 = "Если я доберусь до того, кто это сделал, он будет жалеть об этом до конца жизни!"
1503-88 = "Проблемы и следопыты"
