[translation]
2600503-1 = "Смертельное испытание макаронами"
2600503-2 = "Сенсей! Вы пришли. Чего я хочу? Ну, вы наверняка видели одну из вывесок по дороге сюда..."
2600503-3 = "Именно! В этом кафе каждый год проходит знаменитое мероприятие. Это..."
2600503-4 = "Соревнование по поеданию макарон!"
2600503-5 = "Что такое соревнование по поеданию макарон? Разве название не говорит само за себя? Побеждает команда, которая съест больше всех."
2600503-6 = "Все участники могут бесплатно есть макароны. ...Пока не сдадутся, конечно."
2600503-7 = "А? Что будет, если сдаться? Тогда придётся заплатить за всё, что успели съесть. Так что бесплатно поест только одна команда!"
2600503-8 = "Вообще-то это довольно опасное мероприятие! Некоторые участники даже падали в обморок, и их увозили в больницу!"
2600503-9 = "Понимаете, Сенсей? Мы пришли сюда не развлекаться. Мы выходим на поле боя!"
2600503-10 = "А? Разве не я плачу? Конечно, если проиграем, я заплачу за все макароны."
2600503-11 = "Но всё нормально... Мы не проиграем!"
2600503-12 = "Сенсей, вы взрослый, а у взрослых желудки больше! Да и сами вы взрослый вполне приличных размеров!"
2600503-13 = "Что? Для обычной еды и десертов желудок работает по-разному? Да ну! Вы просто заранее боитесь!"
2600503-14 = "Начинается! Несите макароны!"
2600503-16 = "(И вот соревнование по поеданию макарон началось!)"
2600503-17 = "Однако, вопреки большим надеждам Ёшими, меня затошнило уже после семи макарон."
2600503-19 = "А-агх... Это так тяжело... Но я в порядке... В порядке. Я ещё могу есть..."
2600503-20 = "Эм, Сенсей? Почему ваш рот перестал двигаться...?"
2600503-21 = "[s1] «Они слишком сытные... Убейте... меня...»\n[s2] «Эта война проиграна... Мама...»"
2600503-22 = "Что вы творите?! Вы взрослый! И это всё, на что вы способны?"
2600503-23 = "(Сенсей выглядит неважно... Такими темпами мы проиграем!)"
2600503-24 = "Сенсей, вы ещё можете есть! Нужно всего-то съесть ещё хотя бы двадцать! Вы справитесь!"
2600503-25 = "Мы не можем сдаться, проделав весь этот путь! Вы знаете, сколько мы уже съели?!"
2600503-26 = "Я вас покормлю, Сенсей! Просто ложитесь и откройте рот!"
2600503-27 = ""
2600503-28 = "Стойте! Куда вы убегаете?! Откройте рот! Летит ещё один макарон!"
2600503-29 = "[s] (Отчаянно сжать губы.)"
2600503-30 = "Сдавайтесь, Сенсей. Сопротивление бесполе—а?"
2600503-31 = "Ой нет, нога соскользнула! Я... А-А-А-А-А!!"
2600503-32 = ""
2600503-33 = "*тук*"
2600503-35 = "А-а! Как же саднит зад..."
2600503-36 = "Я уже подумала, что сломала копчик. Хорошо, что подо мной оказалось что-то мягкое..."
2600503-37 = "Сенсей? Где вы?"
2600503-38 = "[s] «Эм...»"
2600503-39 = "..."
2600503-40 = "Что?!"
2600503-41 = "Ч-ч-ч-что вы там делаете?! Извращенец!"
2600503-42 = "Вылезайте! Нет, стойте... Лучше я сама слезу. Нет-нет! Эй! Это...!"
2600503-43 = "Хватит! А-а-а-а!! Я не...! Что за глупость! Угх!"
2600503-45 = "(После этого Ёшими запихнула в рот оставшиеся макароны и убежала с невероятной скоростью.)"
2600503-46 = "(А поскольку больше неё никто не съел, макароны достались бесплатно!)"
