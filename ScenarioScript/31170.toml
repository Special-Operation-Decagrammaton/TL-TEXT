[translation]
31170-1 = "Эпизод 17;Предатель Тринити"
31170-2 = "Наги взялась всерьёз, да? Даже разрешила вам пользоваться этими помещениями для дополнительных занятий."
31170-3 = "Ну и как? Надеюсь, вы не просто изображаете занятость, чтобы устраивать вечеринки в бассейне со студентами. Вы ведь не станете так делать, правда?"
31170-4 = "[s] «...»"
31170-5 = "..."
31170-6 = "Не нужно так настораживаться, Сенсей. Вы заденете мои чувства."
31170-7 = "Вы хотя бы нормально едите? Я могу организовать кейтеринг для занятий, если хотите. Подойдут чай и торт?"
31170-8 = ""
31170-10 = ""
31170-11 = "Прошу прощения. Понимаю."
31170-12 = "Вас не интересует светская беседа. Тогда сразу к делу."
31170-13 = "И к слову, Наги не знает, что я сейчас здесь. Как видите, я одна."
31170-14 = "..."
31170-15 = "Она предложила вам сделку, верно?"
31170-16 = "[s] «Сделку...?»"
31170-17 = "Я о поиске предателя Тринити."
31170-18 = "[s] «...»"
31170-19 = "Так и думала. Она ещё та штучка."
31170-20 = "Готова поспорить, она даже не рассказала вам всех подробностей. Просто свалила ответственность на вас и велела работать."
31170-21 = "И нормальной причины или намерения тоже не объяснила, верно? Наги сказала, зачем Клуб дополнительных занятий создали именно так?"
31170-22 = "Вот же... Ничего не рассказала и повесила на вас столько всего."
31170-23 = "[s] «Я отказался от её предложения.»"
31170-24 = "Отказались? Почему?"
31170-25 = "Потому что не хотели подозревать собственных студентов, или...?"
31170-26 = "[s] «Искать предателя Тринити — не моя роль.»"
31170-27 = "О?"
31170-28 = "Вот оно что. Вы представляете Шале, а значит, в конечном счёте вы чужак во всей этой истории — не принадлежите Тринити."
31170-29 = "Для нас, чей мир вращается вокруг Тринити, вполне естественно с трудом понимать вашу логику."
31170-30 = "Как интересно. По крайней мере, это свежий взгляд."
31170-31 = "Тогда на чьей вы стороне, Сенсей?"
31170-32 = "Если не на стороне Тринити... тогда Геенна? Генерального студсовета? Или вообще ни на чьей..."
31170-33 = "[s] «Я на стороне учеников.»"
31170-34 = "..."
31170-35 = "Ох..."
31170-36 = "Не ожидала от вас такого ответа."
31170-37 = "..."
31170-38 = "Ну, если так..."
31170-39 = "...значит, вы и на моей стороне? Иногда я, может, и не похожа, но технически я тоже студент... знаете."
31170-40 = "[s] «Если тебе когда-нибудь понадобится, я буду рядом.»"
31170-41 = "..."
31170-42 = "Вау... Вы умеете польстить девушке, Сенсей."
31170-43 = "Все взрослые такие гладкие? Похоже, скрыть, насколько меня это обрадовало, уже не получится. Хи-хи."
31170-44 = "Но разве это не доказывает мою мысль? Если вы на стороне всех, значит, по-настоящему выбрать сторону вы тоже не можете, верно?"
31170-45 = "Так почему бы мне не предложить вам свою сделку?"
31170-46 = "[s] «Сделку...?»"
31170-47 = ""
31170-49 = ""
31170-50 = ""
31170-51 = "Я скажу, кто из Клуба дополнительных занятий — предатель."
31170-52 = "[s] «...!»"
31170-53 = "Тот самый предатель, которого ищет Наги — человек, которого она любой ценой хочет исключить."
31170-54 = "Но на деле всё куда сложнее, чем кажется."
31170-55 = "Было бы невежливо просто смотреть, как Наги склоняет вас на свою сторону."
31170-56 = "Знаете, пригласить вас стать куратором Клуба дополнительных занятий предложила именно я?"
31170-57 = "[s] «Ты, Мика?»"
31170-58 = "Ага. Наги была против. Сказала, что не хочет тратить услугу, которую вы ей должны, на такое."
31170-59 = "..."
31170-60 = "Я хотела, чтобы это был человек ни из Тринити, ни из Геенна."
31170-61 = ""
31170-63 = ""
31170-64 = "Ах да. Что касается предателя..."
31170-65 = "...она действительно одна из студентов вашего Клуба дополнительных занятий."
31170-68 = ""
31170-69 = "Ширасу Азуса."
31170-71 = ""
31170-72 = ""
31170-73 = ""
31170-74 = ""
31170-75 = "Ты опоздала."
31170-76 = "..."
31170-77 = ""
31170-79 = ""
31170-80 = ""
31170-81 = "Как идут приготовления?"
31170-82 = "Гладко. Пока всё по плану."
31170-84 = "[s] «Это Азуса?»"
31170-85 = "Верно. Как вы знаете, она не всегда училась в Тринити."
31170-86 = "Изначально она была студентом школы-сателлита Ариус, давно отколовшейся от союза Тринити."
31170-87 = "Хотя слово «студент» тут не совсем точное."
31170-88 = "Образование в привычном смысле никогда не было частью жизни Азусы."
31170-89 = "[s] «Почему ты мне это рассказываешь?»"
31170-90 = "..."
31170-91 = "Уверена, вы когда-то спрашивали о том же Наги. Но понятия не имею, что она ответила."
31170-92 = "Не буду утомлять оправданиями, скажу прямо."
31170-94 = ""
31170-96 = ""
31170-97 = ""
31170-100 = ""
31170-101 = "Вы должны защитить её."
31170-103 = "Эдемский договор;Продолжение во второй главе"
