[translation]
31170-1 = "Episódio 17;A Traidora da Trinity"
31170-2 = "Mas olha só, a Nagi-chan está mesmo empenhada nisso, né~? Até emprestou uma instalação como esta."
31170-3 = "Aliás, como está indo o acampamento de estudos? Já que estão tão longe, não estão aproveitando para fazer algo divertido? Tipo todo mundo de maiô numa festa na piscina!"
31170-4 = "[s] \"...\""
31170-5 = "...Aha."
31170-6 = "Fico até chateada de te ver tão na defensiva assim~ Pode não parecer, mas eu sou bem sensível e me magoo fácil, sabia?"
31170-7 = "Por sinal, como estão as refeições por aqui? Quer que eu mande alguma coisa gostosa? Tipo bolo ou chá-preto."
31170-11 = "...Hehe, desculpa. Você também não é muito fã de rodeios longos, né, Sensei?"
31170-12 = "Então, que tal irmos direto ao assunto?"
31170-13 = "Ah! A propósito, a Nagi-chan não sabe que eu estou aqui, tá? Como pode ver, vim sem escolta nem nada, agindo totalmente por conta própria!"
31170-14 = "Sendo assim, voltando ao assunto principal..."
31170-15 = "...Sensei, a Nagi-chan não te propôs algum tipo de acordo?"
31170-16 = "[s] \"Um acordo?\""
31170-17 = "Por exemplo, deixa eu ver... pedir para você procurar a \"traidora da Trinity\", ou algo assim."
31170-18 = "[s] \"...\""
31170-19 = "...Ufa, sabia. Poxa, essa Nagi-chan é tão previsível."
31170-20 = "E ela te deu alguma informação detalhada? Ou não disse nada disso e só pediu para você \"procurar\"?"
31170-21 = "E quanto aos motivos ou objetivos? A Nagi-chan não te contou por que o Clube de Aulas de Reforço é formado por essas integrantes?"
31170-22 = "...Entendi~ Poxa, jogar um fardo desses nas suas costas sem te explicar nada, Sensei..."
31170-23 = "[s] \"...Eu recusei essa proposta.\""
31170-24 = "...Hã? Sério? Por quê?"
31170-25 = "Porque não quer duvidar das suas próprias alunas? Ou será que..."
31170-26 = "[s] \"Achei que esse não era o meu papel.\""
31170-27 = "...Ué?"
31170-28 = "Entendi, entendi~... De fato, você pertence à \"Schale\", né, Sensei? Uma terceira parte que, originalmente, não tem relação nenhuma com a Trinity."
31170-29 = "Faz sentido. Bem, como para nós a própria \"Trinity\" sempre pareceu o centro do mundo, acaba sendo meio estranho pensar assim, mas..."
31170-30 = "...É uma resposta interessante. Entendo, chega a ser revigorante. E você tem toda razão nisso."
31170-31 = "Sendo assim, Sensei, de que lado você está?"
31170-32 = "Se você não está do lado da Trinity... está do lado de Gehenna? Do lado do Conselho Estudantil Geral? Ou será que... não está do lado de ninguém?"
31170-33 = "[s] \"Eu estou do lado das alunas.\""
31170-34 = "..."
31170-35 = "A-Aah..."
31170-36 = "Do lado das alunas, é...? Entendi... Essa eu não esperava~..."
31170-37 = "..."
31170-38 = "E-Escuta... Isso quer dizer que, bom..."
31170-39 = "Posso considerar que você... também está do meu lado, Sensei? Mesmo estando nesta posição, eu não deixo de ser uma aluna..."
31170-40 = "[s] \"É claro que também estou do seu lado, Mika.\""
31170-41 = "...Wao~"
31170-42 = "Você fala umas coisas incríveis na maior naturalidade, né, Sensei..."
31170-43 = "Que adulto, hein. Parte de mim se pergunta se isso é só lábia sua, mas... é, acho que fiquei genuinamente feliz. Ehehe..."
31170-44 = "Só que aceitar isso ao pé da letra também é um pouquinho difícil~... Afinal, ao mesmo tempo, dá para interpretar que você não está do lado de ninguém, não é?"
31170-45 = "Por isso, em vez de só aceitar de cara, acho que vou te propor um acordo da minha parte, Sensei."
31170-46 = "[s] \"Um acordo...?\""
31170-51 = "Eu vou te contar quem é a \"traidora\" dentro do Clube de Aulas de Reforço."
31170-52 = "[s] \"...!\""
31170-53 = "A tal \"traidora da Trinity\" de quem a Nagi-chan fala, a pessoa que ela está procurando desesperadamente agora para expulsar."
31170-54 = "Para falar a verdade, existe um problema ainda maior e mais complexo por trás disso, mas..."
31170-55 = "Ficar só olhando a Nagi-chan te manipular desse jeito... me faz sentir um pouco culpada."
31170-56 = "...Para começo de conversa, fui eu quem te convidou para ser o conselheiro do Clube de Aulas de Reforço, Sensei. Você sabia disso?"
31170-57 = "[s] \"Foi você, Mika...?\""
31170-58 = "Sim, embora a Nagi-chan tenha sido contra o tempo todo. Ficou dizendo que não devíamos gastar um favor tão valioso de um jeito desses e tudo mais. Rolou bastante coisa entre você e a Nagi-chan, né?"
31170-59 = "...Bom, eu também tinha os meus próprios motivos."
31170-60 = "Eu queria uma terceira parte que não fosse nem da Trinity, nem de Gehenna."
31170-64 = "...Ah, estávamos falando da \"traidora\", né."
31170-65 = "A \"traidora da Trinity\" que está no Clube de Aulas de Reforço é..."
31170-69 = "...Shirasu Azusa."
31170-75 = "Você demorou."
31170-76 = "..."
31170-81 = "E como foi?"
31170-82 = "...Por enquanto, tudo conforme o plano."
31170-84 = "[ns] \"A Azusa...?\""
31170-85 = "Sim. Talvez você já saiba, mas aquela garota, na verdade, não estava na Trinity desde o começo."
31170-86 = "Ela é uma aluna vinda da \"Filial Arius\"... uma facção dissidente que se separou da Trinity há muito tempo."
31170-87 = "...Hmm, pensando bem, nem sei se podemos mesmo chamá-la de \"aluna\"."
31170-88 = "Será que dá para chamar de aluna alguém que nunca teve a oportunidade de \"aprender algo\"?"
31170-89 = "[s] \"Qual é o seu motivo para me contar isso?\""
31170-90 = "...Hehe."
31170-91 = "...Você tem um olhar muito bom, de verdade. Faz eu criar expectativas."
31170-92 = "Não parece que vai adiantar ficar enrolando... Então tá, vou direto ao ponto."
31170-101 = "Eu quero que você proteja aquela garota."
31170-103 = "Arco do Tratado do Éden;Continua no Capítulo 2"
