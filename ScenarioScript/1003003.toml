[translation]
1003003-1 = "Терапия якузэн"
1003003-3 = "Сенсей, это Чинацу."
1003003-4 = "Я принесла то, о чём упоминала раньше. Можно войти?"
1003003-5 = "[s] «Входи.»"
1003003-6 = ""
1003003-10 = ""
1003003-11 = "Спасибо, что приняли меня. Мне удалось найти хорошие ингредиенты, и я хотела показать их вам, Сенсей."
1003003-12 = "Я не мешаю вам отдыхать?"
1003003-13 = "[s1] «Я как раз тоже думал выпить чаю.»\n[s2] «Я тоже хотел тебя увидеть, Чинацу.»"
1003003-14 = "Хи-хи, понятно. Это здорово."
1003003-15 = "...?!"
1003003-16 = "Я-Я не знаю, как реагировать на такие шутки, Сенсей."
1003003-17 = "Но вернёмся к делу: сегодня я хотела показать вам чай якузэн."
1003003-18 = "[s] «Чай якузэн?»"
1003003-19 = "Да, якузэн — это пища с лечебными свойствами. Это способ укрепить организм, готовя блюда из трав и лекарственных ингредиентов, полезных для здоровья."
1003003-20 = "В частности, чаи якузэн заваривают из лекарственных трав вместе с чайными листьями, благодаря чему полезные вещества быстро усваиваются, а аромат успокаивает разум и тело."
1003003-21 = "Поэтому я подготовила несколько ингредиентов для вас — ведь вы наверняка устали от переработок."
1003003-22 = ""
1003003-24 = ""
1003003-25 = ""
1003003-27 = ""
1003003-28 = "Первое, что я приготовила, — имбирный чай из имбиря, маринованного в мёде."
1003003-29 = "Хотя у имбиря резкий и пряный аромат, он богат витаминами, которые укрепляют иммунитет и улучшают кровообращение."
1003003-30 = "А сладкий мёд смягчит остроту и придаст энергии."
1003003-31 = ""
1003003-33 = ""
1003003-34 = "Следующее — чай из сушёных хризантем."
1003003-35 = "Хризантемы содержат несколько полезных антиоксидантов, которые, как говорят, помогают снимать усталость и напряжение глаз."
1003003-36 = "Кроме того, насыщенный аромат заваренных хризантем успокаивает разум и тело."
1003003-37 = "А следующее..."
1003003-38 = "[s3] «Подожди, Чинацу.»\n[s4] «Я не смогу выпить всё это!»"
1003003-39 = "Н-неужели?"
1003003-40 = "Н-неужели?"
1003003-41 = "Похоже, в своём энтузиазме я немного перестаралась."
1003003-42 = "Я лишь хотела помочь вам снять усталость, Сенсей..."
1003003-43 = "[s5] «Мне достаточно чашки имбирного чая.»\n[s6] «Мне достаточно чашки чая из хризантем.»"
1003003-44 = "Хорошо, тогда позвольте мне его приготовить."
1003003-45 = "Хорошо, тогда позвольте мне его приготовить."
1003003-46 = ""
1003003-48 = ""
1003003-49 = ""
1003003-51 = "Чинацу вскипятила воду и начала готовить чай."
1003003-52 = "[s] «Мне уже лучше...»"
1003003-53 = "А? Вода ведь ещё даже не закипела."
1003003-54 = "Хи-хи. Но, кажется, я понимаю, о чём вы."
1003003-55 = "Без ответственности и нагрузки, провести спокойный день, слушая успокаивающие звуки заваривающегося чая..."
1003003-56 = "Говорят, лучший отдых — это время, когда освобождаешь мысли и ничего не делаешь."
1003003-57 = "Сенсей, возможно, время, проведённое с вами сейчас, и есть истинный смысл терапии якузэн."
1003003-59 = "После этого мы с Чинацу провели спокойный день за чаем."
