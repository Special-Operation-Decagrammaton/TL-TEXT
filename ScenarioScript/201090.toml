[translation]
201090-1 = "Эпизод 9;Добрый вечер, мистер Оруэлл"
201090-2 = "Бар Triad Drink"
201090-6 = ""
201090-7 = "...Здесь кто-нибудь есть?"
201090-8 = ""
201090-10 = ""
201090-11 = "[ns] «Похоже, здесь пусто.»"
201090-12 = "Я не вижу ни посетителей, ни даже бармена."
201090-13 = "Может, они закрыты?"
201090-15 = "Нет-нет. Ибо это место — не бар для посетителей."
201090-16 = ""
201090-19 = "Бар — место, где наслаждаются напитком, не так ли? Однако напитком можно наслаждаться почти где угодно. Не только в баре."
201090-20 = "Истинное назначение этого места — упиваться социальной иерархией, тёмной атмосферой и завышенными ценами на напитки, внушающими ложное чувство собственной значимости."
201090-21 = "Логика Знаков, процветающих в обществе потребления."
201090-22 = "Так скажите мне: вы желаете, чтобы это место было Инструментом? Или Знаком?"
201090-23 = "Полагаю, вы выберете Знак. Тогда позвольте мне, всего лишь посетителю, вошедшему за мгновение до вас, обеспечить вам развлечение."
201090-24 = ""
201090-28 = "...Давненько мы не встречались, не так ли, дорогой Сенсей?"
201090-29 = "Конечно!"
201090-30 = ""
201090-33 = "[ns1] «Голконда...?»\n[ns2] «Нет, Фрэнсис...?»"
201090-36 = "Ах да. Мне следует заново определить себя для вас. Именно поэтому вы затрудняетесь понять, как ко мне обращаться."
201090-37 = "Конечно!"
201090-38 = "С чего начать подобное предприятие? Если вы не против, возможно, нам стоит вернуться к нашей последней встрече."
201090-40 = "Прикосновение Хромы преобразило Голконду во Франциска. Вместе с этим изменилось и его восприятие. Он увидел мир таким, каков он есть: деконструированным жанром."
201090-41 = "В искусственно созданной реальности, где композиция ваших жизней больше не имеет значения. Контекст, вероятность — всё это пустяки."
201090-42 = "Он верил, что стоящий перед ним учитель глубоко погрузится в бездну как душа без личности. Как абсолютное ничто."
201090-43 = "Конечно!"
201090-45 = "Однако история ещё никогда не видела такого протагониста. Такого, как вы."
201090-46 = "Возможно, даже слово «протагонист» — оскорбление тому, чем вы стали. Знак «Сенсей»... Вы использовали его возможности в полной мере, восстановив израненный Текст этого мира в историю школьной жизни и юности."
201090-47 = "И когда изменилась история, изменился и сам образ мышления Декалькомании."
201090-48 = ""
201090-51 = "Этот мир — не просто один-единственный жанр. В нём заложена куда более фундаментальная ценность."
201090-52 = "Разумеется, сам Франциск был лишь мимолётным явлением."
201090-53 = "Ведь сам голос Декалькомании был необходимой частью истории! Он был нужен, чтобы заполнить этот пустой порядок и создать Авторитет!"
201090-54 = "Конечно!"
201090-55 = "И так Декалькомания, глубоко погрязшая в трясине индуктивного мышления, впитала утверждения, соответствующие её имени."
201090-56 = "Возможно, сама эта концепция бессмысленна. Его имя — дань великому художнику. И всё же теперь именно он развивает аргумент, опровергающий само его существование."
201090-57 = "[s] «...»"
201090-58 = "Прошу прощения. Я вспомнил одну забавную историю."
201090-59 = "Некоторое время назад у вас была встреча с нашим бывшим коллегой, верно? Из Гематрия?"
201090-61 = "Обитатель Подземелья. Тот, кто плевал на реальность ради кодекса — свода правил, механизмы которого были известны лишь ему. Можно сказать, для нас это была весьма занятная симуляция."
201090-62 = "И всё же, И ВСЁ ЖЕ, возвышенное вновь оказалось лишь Инструментом в ваших руках, Сенсей. Очередное вмешательство мета-уровня и очередная неудачная попытка определить то, что мы называем нашим миром."
201090-63 = "Неудача Обитателя Подземелья повлияла на рассуждения Декалькомании. Какой властью обладает иллюзия перед настоящей тяжестью реальности?"
201090-65 = "И в этом мире, в этой реальности, что поглощает Знаки? Где сталкиваются послания и тексты этого мира? Где реальность и иллюзия танцуют вместе?"
201090-66 = ""
201090-104 = "...Медиа. Ответ на всё — медиа."
201090-105 = "Зверинец медиа раскинул тончайшие нити своей паутины по нервной системе общества. Пристанище для всего, что есть, было и будет, — и хозяин, рождающий Мистики. В этом мире это сила определять."
201090-107 = "Нам больше не нужно искать правильные ярлыки, чтобы неуверенно навязывать их обществу. Я — новое сознание, и с нетерпением жду Знаков, которые вы мне предложите."
201090-109 = "[ns] «Ты Декалькомания?»"
201090-110 = "Вы говорите бессмыслицу. Прежде отдельного существования мы — сам Знак."
201090-111 = "Я — эпистема Декалькомании. Всё, что он воспринимает, и всё, что остаётся после него. Я — наблюдатель реальности такой, какой она стала."
201090-112 = "Желание! Искусство! Великолепие! Общество потребления по самой своей природе есть общество желания. Я, способный определять, вновь определю самого себя. Искусство снова может быть искусством, будучи обращённым на чьи-то цели."
201090-113 = "Добрый вечер, Сенсей."
201090-115 = "Прошу, зовите меня мистер Оруэлл."
201090-117 = "Следующий Эпизод;Маскарад"
