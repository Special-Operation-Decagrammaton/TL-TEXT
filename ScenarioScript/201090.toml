[translation]
201090-1 = "Episódio 9; Boa Noite, Sr. Orwell"
201090-2 = "Drink Bar - 'Triad'"
201090-6 = ""
201090-7 = "...... Com licença."
201090-8 = ""
201090-10 = ""
201090-11 = "[ns] \"Parece que não tem ninguém aqui......\""
201090-12 = "É verdade. Não sinto presença de viva alma."
201090-13 = "Será que já encerraram o expediente de ho――"
201090-15 = "Pelo contrário. Este estabelecimento nunca teve o propósito de atrair clientes comuns, sabem?"
201090-16 = ""
201090-19 = "Um 'drink bar' é popularmente concebido como um 'recinto' para se consumir bebidas.#nContudo, se o objetivo fosse meramente ingerir um líquido, ninguém precisaria se dar ao trabalho de entrar num bar."
201090-20 = "Alguns buscam a penumbra para desfrutar da interação social, enquanto outros saboreiam o fútil deleite de ostentar o poder aquisitivo de pagar caro por um drinque."
201090-21 = "Esta é, precisamente, a lógica dos 'símbolos' que só tem razão de existir numa sociedade de consumo."
201090-22 = "A ilustre visita de vocês a este lugar deu-se na condição de 'instrumento'? Ou de 'símbolo'?"
201090-23 = "Se for a segunda opção, mesmo eu sendo apenas um cliente que chegou mais cedo, ficaria honrado em lhes proporcionar uma breve diversão."
201090-24 = ""
201090-28 = "...... Quanto tempo, Sensei."
201090-29 = "É DISSO QUE EU TÔ FALANDO!!"
201090-30 = ""
201090-33 = "[ns1] \"Você é...... o Golconde?\"\n[ns2] \"Ou seria o Francis......?\""
201090-36 = "Ora, agora que me dei conta: ainda não me redefini sob uma nova identidade diante de você.#nÉ perfeitamente compreensível a sua confusão."
201090-37 = "É DISSO QUE EU TÔ FALANDO!!"
201090-38 = "Por onde deveríamos começar a conversa......?#nRememorar o nosso último e fatídico encontro não seria uma má ideia."
201090-40 = "Quando Golconde foi transmutado em Francis pela 'Cor', ele passou a enxergar este mundo como um mero gênero literário desmantelado."
201090-41 = "Num mundo arbitrário, desprovido de coerência, estrutura narrativa ou verossimilhança――"
201090-42 = "Ele supôs que você acabaria despencando no abismo como uma nulidade absoluta."
201090-43 = "É DISSO QUE EU TÔ FALANDO!!"
201090-45 = "Contudo, você―― desempenhou com primor o seu papel de protagonista."
201090-46 = "...... Não, na verdade você superou o próprio papel de protagonista.#nVocê consumiu com maestria o símbolo do 'Sensei' e conseguiu restaurar o texto deste mundo de volta a uma 'história de juventude e vida escolar'."
201090-47 = "Ao testemunhar esse milagre, Decalcomanie iniciou uma linha de raciocínio inteiramente nova."
201090-48 = ""
201090-51 = "Contrariando o veredito de Francis, ele vislumbrou que este mundo talvez guardasse um valor muito superior a um mero gênero narrativo engessado."
201090-52 = "Evidentemente, a existência de Francis não passou de uma anomalia transitória."
201090-53 = "Para redefinir a ordem que havia se esvaído no vácuo e restabelecer uma nova autoridade, fazia-se imperativo amplificar a voz de Decalcomanie."
201090-54 = "É DISSO QUE EU TÔ FALANDO!!"
201090-55 = "Assim, Decalcomanie repetiu sucessivas deduções indutivas, absorvendo premissas uma após a outra."
201090-56 = "O fato de a alcunha inspirada num grande artista carregar o mesmo nome do inventor da lógica que nega a sua própria existência......#nnão deixa de ser um contrassenso fascinante, não acham? Hehehe......"
201090-57 = "[s] \"............\""
201090-58 = "Perdão. Acabei me lembrando de uma ironia excessivamente cômica."
201090-59 = "Estou a par de que o Sensei teve um embate recente com um antigo colega da Gemátria."
201090-61 = "Aquele 'Habitante do Subsolo'―― que profanava a realidade tratando este mundo como um mero códice de regras de jogo――#nprestou-se a um excelente simulacro para nós."
201090-62 = "Entretanto, quando o Sensei realizou uma nova intervenção panorâmica através do sublime,#na tentativa dele de retalhar este mundo sob as amarras de um único gênero fracassou retumbantemente outra vez."
201090-63 = "Após observar atentamente o fracasso do Habitante do Subsolo, Decalcomanie transcendeu as ilusões rasas#ne pôs-se a contemplar a realidade por conta própria."
201090-65 = "Onde seria o palco onde se consomem os símbolos, as mensagens e as imagens que moldam este mundo?#nQue lugar seria esse onde nada de fato é gerado, mas onde absolutamente tudo reside e existe――?"
201090-66 = ""
201090-104 = "―― Esse lugar é a mídia."
201090-105 = "A teia midiática entrelaçada por este mundo é a soma de todos os artefatos concretos da realidade e o ventre que gesta novos mistérios.#nSem dúvida alguma, ela se consagrou como o 'verdadeiro poder de definição' desta nova era."
201090-107 = "Que tipo de símbolos ela nos ofertará como rito vicário de representação?#nÉ impossível conter o meu entusiasmo."
201090-109 = "[ns] \"Você é o Decalcomanie?\""
201090-110 = "Que pergunta sem sentido. Antes de ser um indivíduo isolado, sou o próprio símbolo encarnado."
201090-111 = "Eu sou a episte-mê de Decalcomanie, a sua própria sombra projetada.#nReconheço este mundo em sua mais pura existência concreta."
201090-112 = "Num mundo onde tudo é vorazmente consumido pelos desejos alheios,#neu distorço mais uma vez as obras dos grandes artistas para redefinir a mim mesmo."
201090-113 = "Boa noite, Sensei."
201090-115 = "Faça a gentileza de me chamar apenas de...... Senhor Orwell."
201090-117 = "No Próximo Episódio; Baile de Máscaras"