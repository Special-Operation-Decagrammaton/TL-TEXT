[translation]
2002403-1 = "Правильная речь"
2002403-2 = "Комната Чаепития Тринити"
2002403-3 = "Мы с Нагисой разговаривали о работе Шале."
2002403-4 = "А ещё меня уже некоторое время беспокоит число учеников Тринити, которые используют неотёсанную речь."
2002403-5 = "[s] «Неотёсанную речь?»"
2002403-6 = "Именно. Заметно выросло число учеников, использующих невоспитанные, грубые или откровенно вульгарные выражения."
2002403-7 = "Боюсь, общение с учениками некоторых других академий плохо повлияло на наших..."
2002403-8 = "Полагаю, нарушителям придётся вынести предупреждение."
2002403-9 = "[s1] «Не уверен, что это необходимо...»\n[s2] «Разве ученики Тринити и так не отличаются необычно хорошими манерами?»"
2002403-10 = "Разумеется, большинство учеников Тринити по-прежнему говорит цивилизованно."
2002403-11 = "Разумеется, большинство учеников Тринити по-прежнему говорит цивилизованно."
2002403-12 = "К счастью, пока проблема ограничена несколькими несчастными случаями, но я должна быть начеку, чтобы она не распространилась."
2002403-13 = "Вы бы не поверили, какие нарушения мне доводилось слышать."
2002403-14 = "Например, использование сокращений."
2002403-15 = "[s] «Сокращений?»"
2002403-16 = "Да. Уверена, вы знаете, что мессенджеры вроде MomoTalk в последнее время становятся всё популярнее. Ученики сокращают слова, а в особо вопиющих случаях — целые предложения, лишь бы печатать быстрее."
2002403-17 = "Например, «HBD» вместо «Happy Birthday» и «TY» вместо «Thank You»."
2002403-18 = "А на днях я даже услышала, как кто-то вслух произнёс «SMH»."
2002403-19 = "[s] «Что плохого в небольшом чатном сленге? Вы же всё-таки ученики.»"
2002403-20 = "Что в нём плохого? Да всё."
2002403-21 = "Сокращение фраз и слов затрудняет понимание. Жертвовать ясностью ради удобства — признак посредственного собеседника."
2002403-22 = "Какими бы хорошими ни были ваши манеры во всём остальном, злоупотребление сленгом заставляет вас звучать легкомысленно и несерьёзно. Верный способ потерять доверие окружающих."
2002403-23 = "Ученики Общеобразовательной школы Тринити пользуются уважением и даже завистью всех остальных академий Кивотоса. Чтобы быть достойными этого, нужно говорить с высочайшим достоинством и изяществом."
2002403-24 = "И дело не только в аббревиатурах. Я слышала, как ученики добавляют к словам загадочные суффиксы. Вы знаете, что означает -pero? Звучит зловеще. Я не позволю ученикам Тринити запугивать окружающих агрессивной речью."
2002403-25 = "Как хозяйка Чаепития, я обязана направлять и исправлять этих заблудших учеников."
2002403-26 = "[s] «А ты сама не используешь такую речь, Нагиса?»"
2002403-27 = "Конечно нет. Даже не думайте! Если хозяйка Чаепития, которая должна служить примером всем остальным ученикам, начнёт выражаться грубо, что о нас подумают другие академии?"
2002403-28 = "Теперь о решении. Регулярная практика правильной речевой этики необходима, чтобы ученик мог хорошо говорить в любой ситуации."
2002403-29 = "При достаточной практике, даже если ученик разволнуется или разозлится, ему не придётся сбиваться—"
2002403-30 = ""
2002403-33 = "Эм, простите, Нагиса..."
2002403-34 = "Что настолько важно, что вам понадобилось перебить меня? И почему у вас такое ошеломлённое выражение лица?"
2002403-35 = "Просто... возникла проблема, требующая срочного внимания..."
2002403-36 = "Согласно отчёту Отряда правосудия, прошлой ночью студента поймали сидящей в купальнике в фонтане на площади Тринити."
2002403-38 = "Ч-Что ещё за безумие?!"
2002403-39 = ""
2002403-41 = ""
2002403-42 = ""
2002403-43 = "Хм..."
2002403-44 = "Возможно ли, что Отряд правосудия ошибся?"
2002403-45 = "Просто невозможно, чтобы студент Тринити так одевался в столь неподходящем месте."
2002403-46 = "Пожалуйста, больше не перебивайте меня, пока сами не проверите информацию."
2002403-47 = "[s] «Нагиса, когда ты только что говорила...»"
2002403-48 = "Хм? Я сказала что-то не так, Сенсей?"
2002403-49 = "Мне сообщили о проблеме, и я, как обычно, легко и изящно её разрешила."
2002403-50 = "Как я и говорила, регулярная практика правильной речевой этики позволит вам—"
2002403-51 = ""
2002403-53 = "Н-Нагиса, новая ситуация! Члены Библиотечного комитета применили слезоточивый газ против группы учеников, у которых, предположительно, скопилось много просроченных книг!"
2002403-54 = "Ой, только что пришёл ещё один отчёт! Ученики Клуба чайной церемонии бросают коробки с чаем в бассейн, протестуя против некачественных сэндвичей с огурцом, которые недавно подавали!"
2002403-55 = "Отряд правосудия мобилизовали, чтобы остановить протест, но... во время столкновения двор Института №3 загорелся и теперь полностью выгорел..."
2002403-56 = ""
2002403-58 = ""
2002403-59 = "Да чтоб вас!"
2002403-60 = "Неужели здесь нельзя прожить хотя бы один день без того, чтобы ученики вели себя как законченные хулиганы?"
2002403-61 = "Слушайте сюда! Это Общеобразовательная школа Тринити. Ученики должны быть благодарны за возможность учиться в школе с такой богатой историей и традициями!"
2002403-62 = "Отныне, если мне на глаза попадётся ученик, который ведёт себя недостойно ученика Тринити и позорит эту академию, я..."
2002403-63 = "Я запихну ему в рот столько черствых макаронов, что он лопнет!"
2002403-64 = "[ns] «...»"
2002403-65 = "Ах."
2002403-66 = "Эм... Возможно, я... неудачно выразилась."
2002403-67 = "Позвольте объяснить. Мне кажется, вы могли неправильно понять—"
2002403-68 = "[s3] «Всё нормально! Не нужно объяснять.»\n[s4] «Иногда полезно выпустить пар, Нагиса.»"
2002403-69 = "Нет! Я же сказала, вы неправильно поняли!"
2002403-70 = "Нет! Я же сказала, вы неправильно поняли!"
2002403-72 = "Я ещё некоторое время слушал оправдания Нагисы, наслаждаясь тем, как она становилась всё более взволнованной."
