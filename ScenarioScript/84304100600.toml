[translation]
84304100600-5 = "Огромное спасибо! Вы спасли мне жизнь!"
84304100600-6 = "Хорошо, что ты так любишь тренироваться, но всё же не стоит перенапрягаться..."
84304100600-7 = ""
84304100600-9 = ""
84304100600-10 = "Н-Нет! Всё не так! Я не пыталась выжать из себя максимум...!"
84304100600-11 = "Н-Ну, я увеличила сложность, потому что хотела сбросить вес..."
84304100600-12 = "Но я не думала, что он разгонится настолько. Он сам начал ускоряться!"
84304100600-13 = "Сам...?"
84304100600-14 = "Не может быть. Пользовательские настройки для такой скорости, к сожалению, ещё не реализованы."
84304100600-16 = "(К сожалению...?)"
84304100600-17 = "К сожалению...?!"
84304100600-18 = "Странно. Интересно, не сломалось ли что-нибудь в тренажёре?"
84304100600-19 = "..."
84304100600-20 = ""
84304100600-24 = "Ц. Я думала, это сработает..."
84304100600-25 = "По крайней мере почти сработало. До сих пор ничего не получалось, сколько бы мы ни повышали сложность. Так что это уже обнадёживает."
84304100600-26 = ""
84304100600-28 = ""
84304100600-29 = "Хм?"
84304100600-30 = ""
84304100600-32 = ""
84304100600-34 = "Проблема, должно быть, была в цели... Та девушка в спортивном костюме — всё это время проблема была в ней!"
84304100600-35 = "Ага. Сколько бы мы ни увеличивали вес и ни крутили настройки, она даже не вспотела!"
84304100600-36 = "На этот раз мы всё настроили, как нам велели, так что валим."
84304100600-37 = "Уже можно уходить? Разве не стоит посмотреть и убедиться, что демонстрация точно сорвана?"
84304100600-38 = "Этого не было в контракте. Мы сделали, как сказали, значит, деньги получим. Если только нас не поймают, пока мы тут торчим."
84304100600-39 = "Верно..."
84304100600-40 = "Давай, пошли. Сейчас наш шанс, пока все смотрят на ту здоровенную девчонку."
84304100600-41 = "Пошли!"
84304100600-42 = ""
84304100600-44 = ""
84304100600-46 = ""
84304100600-47 = "...О?"
84304100600-48 = "Похоже, Рио всё-таки была права."
84304100600-49 = ""
84304100600-51 = ""
84304100600-52 = "Эй, Рио. Ты это слышала?"
84304100600-53 = ""
84304100600-57 = "Да. Похоже, мы наконец нашли зацепку."
84304100600-58 = "Наконец-то."
84304100600-59 = "Я пойду за ними."
84304100600-60 = "Давайте уже покончим с этим."
