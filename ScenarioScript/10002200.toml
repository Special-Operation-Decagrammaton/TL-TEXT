[translation]
10002200-1 = "Послесловие;Фейерверк Миллениум 60"
10002200-3 = "Здравствуйте. Я Миллениум 60, бомба из Научной школы Миллениум."
10002200-4 = "И я наполнена напалмом! Мой рост — целых 23 сантиметра, а вес — невероятные 44 килограмма."
10002200-5 = "Что до моего возраста... это секрет."
10002200-6 = "Наверное, вы сейчас думаете, что напалм делает в пляжной лавке."
10002200-7 = "Изначально я предназначалась для сноса заброшенных зданий. Но для этого создали более эффективное оборудование, и я осталась без работы."
10002200-8 = "После этого какое-то время я скиталась по Тринити, пока наконец не оказалась здесь."
10002200-9 = "Честно говоря, я даже не помню, как давно это было. Кажется, будто я здесь целую вечность."
10002200-10 = "В моём новом доме есть всё: прекрасный вид на океан, освежающий бриз... Чудесно."
10002200-11 = "Конечно, я здесь выгляжу не к месту. Не могу отрицать, что просто собираю пыль, как делала бы это где-нибудь в кампусе."
10002200-12 = "Я не так желанна, как те фейерверки вон там, которые люди постоянно покупают."
10002200-13 = "Когда я смотрю на них, мне и удивительно, и завидно видеть, сколько радости они приносят людям."
10002200-14 = "Смогла бы я тоже заставлять всех улыбаться, если бы родилась фейерверком?"
10002200-15 = "Может, это и звучит грустно, но именно такие мысли дают мне надежду на лучшие дни впереди."
10002200-16 = "Это и—"
10002200-17 = "Сэр, сюда! Фейерверки! Мне нужно ещё фейерверков!"
10002200-18 = "О. Клиенты."
10002200-20 = ""
10002200-21 = ""
10002200-23 = "Неприемлемо. Мы выбрали их первыми. Не думайте, что сможете увести их у нас из-под носа без последствий."
10002200-24 = "Не можете просто отстать от нас, неудачницы? Если здесь кто и хулиганы, так это вы."
10002200-25 = "А этот? Он продаётся?"
10002200-26 = "Этот фейерверк просто огромный!"
10002200-27 = "Огромный...? Они обо мне?"
10002200-28 = "Ха-ха-ха. Боюсь, нет, юная леди. Это напалм, а не фейерверк."
10002200-29 = "Да какая разница, что это?!"
10002200-30 = "Главное, чтобы оно взрывалось. Так оно взрывается или нет?!"
10002200-31 = "Ну, полагаю, да. Более того, взрыв будет настолько ярким, что осветит ночное небо словно солнце."
10002200-32 = "А?"
10002200-33 = "Отлично, беру. Этого хватит, чтобы заплатить?"
10002200-34 = "Заверните!"
10002200-35 = "...А?"
10002200-36 = "П-Постойте минутку. Вы ведь понимаете, что это БОМБА, а не просто фейерверк?"
10002200-37 = "Сколько раз мне повторять? Мне всё равно, лишь бы взрывалось. Если взорвать её в воздухе, она станет фейерверком, верно?"
10002200-38 = "В общем, мне пора. У нас планы на вечер. Увидимся!"
10002200-39 = ""
10002200-40 = ""
10002200-41 = ""
10002200-42 = ""
10002200-43 = "Ну, вообще-то она не совсем неправа."
10002200-45 = "Здравствуйте. Я Миллениум 60, бомба из Научной школы Миллениум."
10002200-46 = "..."
10002200-47 = "То есть... Миллениум 60, фейерверк из Научной школы Миллениум."
10002200-48 = ""
