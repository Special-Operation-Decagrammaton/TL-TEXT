[translation]
13010-1 = "Эпизод 1;Пролог"
13010-4 = "Я наконец-то нашёл тебя."
13010-5 = "Наш старый союзник, изгнанный из Гематрии, погребённый и запечатанный."
13010-7 = "Больно... Больно..."
13010-8 = "Нет, твоя аскеза заканчивается здесь. Восстань, «Обитатель подземелья»."
13010-9 = "..."
13010-10 = "...Этот голос."
13010-11 = "«Безымянный наблюдатель», это ты...?"
13010-12 = "Нет. В этот раз зови меня «Фрэнсис»."
13010-13 = "Нет... Неважно. Пожалуйста... просто оставь меня в покое..."
13010-14 = "Не знаю, зачем ты меня разыскал... Но мне неинтересно. Хи-хи-хи..."
13010-15 = "Что бы это ни было... Я больше..."
13010-18 = "Гематрия распущена."
13010-19 = "..."
13010-20 = "Что... вы имеете в виду?"
13010-21 = ""
13010-22 = "Гематрии больше нет. Можешь считать её расформированной или распущенной."
13010-23 = "Причина всего одна."
13010-24 = "Это существование Шале и Сенсея [USERNAME]... того самого человека, который исказил все законы причинности и жанра."
13010-25 = "Но чтобы теперь противостоять ему..."
13010-26 = "...Тс-с."
13010-27 = ""
13010-29 = ""
13010-30 = ""
13010-31 = "...Хм."
13010-32 = "Ну надо же. Значит, Кодекс обновлён..."
13010-33 = ""
13010-39 = ""
13010-40 = "Новый мир... Да, я его чувствую. Чужеродный элемент в этом мире."
13010-41 = "Если нам выдали новую редакцию... значит, правила изменились, хи-хи. Полагаю, это нулевая сессия новой кампании."
13010-42 = "П-П-Понятно... Хи-хи-хи. Тогда это совершенно новая история."
13010-43 = "Интересно, какие уроки я усвою из э-э-этой редакции..."
13010-44 = "Посмотрим... Ты сказал...[USERNAME]?"
13010-45 = "Это главный злодей этой кампании? Ну тогда п-п-посмотрим."
13010-46 = "Новый Кодекс — это..."
13010-47 = ""
13010-52 = "Город академий...?"
13010-53 = ""
13010-58 = "И Сенсей...?"
13010-59 = ""
13010-60 = "Ч-Что за... Разве это не с-с-слишком высокая сложность...? Такое..."
13010-61 = ""
13010-64 = "...Но стратегия найдётся для в-в-всего. Слепая зона... стихийная слабость... ахиллесова пята... сойдёт что угодно..."
13010-65 = "Не недооценивай этого учителя, Обитатель подземелья."
13010-66 = ""
13010-68 = ""
13010-69 = "Толкуй этот мир как хочешь. Но то, что ты воображаешь его настольной игрой, ещё не делает тебя победителем."
13010-70 = "..."
13010-71 = "Я дам тебе подсказку. «Лучший билд» для борьбы с этим человеком — это..."
13010-72 = ""
13010-75 = ""
13010-77 = "Не смей мне всё испортить!!! Мусор!!!"
13010-78 = ""
13010-82 = "М-М-Мусор вроде тебя даже не знает, что такое смерть!"
13010-83 = "Подумать только, что такие паразиты, как ты, способны понять мои с-с-страдания, моё одиночество, мой страх!!"
13010-84 = "Проваливай, «Безымянный наблюдатель»!!! Это моя кампания!!!"
13010-85 = "Важно лишь просветление, достигнутое моей аскезой!!!"
13010-86 = "Не СМЕЙ вставать у меня на пути—!!!"
13010-87 = ""
13010-91 = "Не СМЕЙ портить мо-о-ою кампанию—!!!"
13010-92 = ""
13010-102 = "*тяжело дышит*... *тяжело дышит*..."
13010-103 = "Победа... Победа... Почему все так помешаны на такой г-г-глупости, как победа?"
13010-104 = "Концовка уже предрешена!!! В конце мы все умрём! Это неизменно!"
13010-105 = "Нам всем суждено проиграть!!! Но важно не это!"
13010-106 = "Важно лишь... путешествие... То, что ты переживаешь в пути... и к каким осознаниям приходишь... Вот это имеет значение."
13010-107 = "Как ты смеешь прикрываться возвышенным именем «Гематрии»! Э-Э-Это..."
13010-108 = "Настоящий позор!"
13010-109 = ""
13010-110 = "*тяжело дышит*... *тяжело дышит*..."
13010-111 = "С-С-Спокойно. Мне нужно успокоиться..."
13010-112 = "Мне нужно... п-п-продумать первый ход..."
13010-113 = ""
13010-115 = ""
13010-116 = "Г-Г-Гематрия распущена?"
13010-117 = "Нет! Истинная Гематрия — это я!"
13010-118 = "Отныне я п-п-покажу истинное лицо Гематрии…"
13010-119 = "Хи-хи-хи. Хорошо. Хорошо! Сначала стоит изучить этот мир... Новый кодекс. Новую кампанию..."
13010-120 = "А-а. Ха-ха-ха... Начать стоит... с того места."
13010-122 = "...Абидос."
13010-123 = "Империя, породившая первых великих Мистиков... Интересно, как их описали в этом кодексе..."
13010-124 = ""
13010-125 = "Хи-хи... Не терпится узнать."
13010-126 = ""
13010-128 = ""
13010-130 = "Пожалуйста... Только не вздумай меня разочаровать."
13010-131 = ""
13010-136 = "Хошино, смотри!"
13010-138 = "Здесь написано, что старый студсовет закопал нечто удивительное в Великом оазисе Абидоса!"
13010-139 = "А? Нечто удивительное?"
13010-140 = "Да! Похоже на что-то, что использовали для фейерверков. Может, это целая куча петард из редких минералов."
13010-141 = "Тут сказано, если нагреть их до высокой температуры, получится какой-то плазменный фейерверк, озаряющий всё небо красивым светом."
13010-142 = "Смотри, они даже могли взрываться в виде вот таких фигур! Разве не мило?"
13010-143 = ""
13010-145 = ""
13010-146 = "Наверное, их хотели использовать на фестивале... Но почему-то они не сработали как надо, и их выбросили в озеро."
13010-147 = "...Хм."
13010-148 = "Разве это не потрясающе? Представь: выбросить вещь из редкого минерала стоимостью больше миллиона иен за сто граммов только потому, что она сразу не заработала..."
13010-149 = "Хотя чего ещё ждать от того самого студсовета Абидоса, который использовал гимнастические маты с утиным пухом просто потому, что денег было некуда девать..."
13010-150 = "Лучше бы они оставили нам хотя бы сотую часть своего бюджета... Ух..."
13010-151 = "...Но тот оазис высох уже очень давно."
13010-152 = "Да. Ты права."
13010-153 = "Теперь там одни песчаные дюны... В прошлый раз мы не видели ничего похожего на фейерверки. К чему ты ведёшь?"
13010-154 = "Хи... хи... хи... Хошино, ты видишь только то, что лежит на поверхности, да?"
13010-155 = "Эти записи относятся к тем временам, когда там ещё было озеро. Значит, это случилось очень давно, правда?"
13010-156 = "И на что ты намекаешь?"
13010-157 = "Те дорогущие фейерверки..."
13010-158 = "Наверняка они до сих пор погребены где-то под песком."
13010-159 = ""
13010-161 = ""
13010-162 = "Под высохшим дном озера Великого оазиса погребены ценные минералы? Ты это хочешь сказать?"
13010-163 = "Вот именно!"
13010-164 = ""
13010-166 = ""
13010-167 = "...Юмэ. Ты хоть представляешь, сколько времени займут раскопки в этой пустыне?"
13010-169 = "Эм... Ну..."
13010-170 = ""
13010-172 = ""
13010-173 = "Нельзя терять ни минуты! Надо начинать прямо сейчас!"
13010-174 = "Да! Я именно об этом! Пора на поиски сокровищ!"
13010-175 = "Э-хе-хе-хе! Вперёд, Юмэ!"
13010-176 = "Мы разбогатеем, Хошино!"
13010-178 = ""
13010-180 = ""
13010-187 = "Хошино... Эм..."
13010-188 = "Не говори, Юмэ! Я тоже это чувствую!"
13010-189 = "Правда? Значит, не мне одной так кажется? Тогда... может, пора заканчивать?"
13010-190 = "М-Может, покопаем ещё совсем чуть-чуть...?"
13010-191 = "Прости, Хошино... Думаю, нам конец."
13010-192 = "У-угх..."
13010-194 = "Хошино... Где же мы так ошиблись...?"
13010-195 = "Когда ты придумала этот нелепый план?"
13010-196 = "Ну-у... Но Хошино, тебе ведь тоже понравилось. Это всё моя вина...?"
13010-197 = "...Я-Я и так знаю, не надо мне говорить!"
13010-198 = ""
13010-202 = "Если подумать, купальники нам вообще, наверное, были не нужны..."
13010-203 = "...То есть это же было очевидно, да?! Зачем ты вообще сказала их надеть?"
13010-204 = "Ну... Я подумала, вдруг мы копаем, а потом... Бум! Добираемся до водоносного слоя, и наружу хлынет подземная вода..."
13010-205 = "Так вообще бывает?!"
13010-207 = "Только представь! Мы одновременно разбогатеем и решим проблему опустынивания...!"
13010-208 = "Да такого не может быть!"
13010-209 = "Ну-у..."
13010-211 = "М-м. Надо записать всё, что сегодня случилось... и хорошенько обдумать свои поступки…"
13010-212 = "П-Подожди, Юмэ— Что ты пишешь?"
13010-213 = "Ты собираешься записать эту глупость? Не надо — это же стыдно!"
13010-214 = "Но это моя обязанность как президента студсовета... Чтобы в будущем ты могла поступить лучше..."
13010-215 = "Во-первых, в этой тетради одни наши провалы! И кому вообще захочется получить в наследство такую потрёпанную старую штуку?! Я куплю новую!"
13010-216 = "Ну-у..."
13010-222 = "Комната Комитета по предотвращению закрытия"
13010-223 = "Хорошо, начнём наше очередное собрание Комитета по предотвращению закрытия Абидоса..."
13010-224 = "...Но прежде чем начнём, разве кого-то не хватает?"
13010-225 = ""
13010-227 = ""
13010-228 = "Ага-ага! Той самой, которая никогда не приходит вовремя! ☆"
13010-229 = "Да. Хошино нет."
13010-230 = "И куда она опять сбежала? Только не говорите, что снова где-то спряталась поспать!"
13010-231 = "Я видела, как она спит в соседнем классе."
13010-232 = "Что? Тогда надо было привести её, Широко! Ты же знала, что у нас собрание!"
13010-233 = "Я... не хотела её будить..."
13010-234 = "Почему? Потому что она снова беззаботно задремала?"
13010-235 = "Понимаю. У Широко слабость к Хошино."
13010-236 = "Я сейчас за ней схожу."
13010-237 = "А, я с тобой, Широко."
13010-238 = ""
13010-240 = ""
13010-242 = "Не обязательно идти всем..."
13010-243 = "А-ха-ха... Похоже, все слишком любят Хошино, чтобы просто ждать..."
13010-246 = "Хошино. Пора на собрание."
13010-247 = "Ага-ага, пора просыпаться! ☆"
13010-248 = "...Хм?"
13010-255 = "Хошино?"
13010-256 = ""
13010-259 = ""
13010-260 = ""
13010-261 = "Ты не спала?"
13010-262 = "...Ах."
13010-263 = "...Точно. У нас собрание, да?"
13010-264 = "А, виновата, виновата. Эта старушка постоянно всё забывает."
13010-265 = "Да."
13010-266 = "А? На этот раз не скажешь что-нибудь вроде «Ты не намного старше нас!»?"
13010-267 = "Ну и ладно тогда...! Пойдём! Когда Аяне злится, она страшная."
13010-268 = ""
13010-270 = ""
13010-271 = "Хошино, подожди меня."
13010-272 = ""
13010-274 = ""
13010-275 = "..."
13010-276 = ""
13010-278 = ""
13010-282 = "[ns] «А, хорошо. Все собрались.»"
13010-283 = "Да, Сенсей. Теперь, когда Комитет в полном составе, начнём."
13010-284 = "Для начала обсудим странную активность, замеченную в районе Абидоса."
13010-285 = "Странную активность?"
13010-286 = "Будут проблемы?"
13010-288 = "...Пока это просто то, за чем стоит следить..."
13010-289 = "Что такое, Аяне?"
13010-290 = "Это связано с Кайзер Group."
13010-292 = "Все мы знаем о недавних раскопках Корпорация Кайзер в Пустыне Абидос, которые они только недавно завершили."
13010-293 = "Хотя поначалу мы точно не знали, что именно Кайзер пыталась найти..."
13010-296 = ""
13010-297 = "Ну... теперь все знаем, что они откопали."
13010-298 = "Хотя тот корабль был полностью уничтожен..."
13010-300 = "Да. После уничтожения Утнапиштим над стратосферой никаких следов его обломков так и не нашли."
13010-301 = "А после уничтожения линкора Кайзер, похоже, потеряла всякий интерес к дальнейшей оккупации Пустыни Абидос."
13010-302 = "Кайзер вывела свои силы из пустыни, и теперь все руины стоят пустыми."
13010-304 = "Да. Мы заметили их активность и подтвердили отступление с места раскопок."
13010-305 = "Ага! Будто мечта сбылась! Пусть только попробуют снова сунуться в Абидос!"
13010-306 = "Но Абидос всё ещё должен Кайзер..."
13010-308 = "Да... Наша школа всё ещё должна Кайзер. Их уход никак не изменил наше финансовое положение."
13010-309 = ""
13010-310 = "Хотя, похоже, президента Корпорация Кайзер сейчас куда больше интересует новая Sanctum Tower, чем Пустыня Абидос..."
13010-311 = ""
13010-312 = "Но суть не в этом."
13010-313 = "Суть..."
13010-314 = "Да."
13010-315 = "Что происходит, Аяне?"
13010-317 = "Если коротко, Кайзер Group объявила, что превратит долг Абидоса в облигации и продаст их на долговом рынке."
13010-318 = "Что? Облигации...?"
13010-319 = ""
13010-321 = ""
13010-322 = "Долговой рынок? Ч-Что это значит?"
13010-323 = "Они собираются секьюритизировать право взыскивать с нас долг..."
13010-324 = "...То есть продать кому-то право владения нашим долгом."
13010-325 = "Что?! И что тогда будет?"
13010-326 = "Тот, кто купит облигации, сможет получать наши выплаты по долгу..."
13010-327 = "Т-То есть нам придётся платить кому-то, кроме Кайзер?! Разве это не хорошо?"
13010-329 = "Это..."
13010-330 = "Нет, это не сходится..."
13010-331 = "Хошино...?"
13010-332 = "Люди покупают облигации только тогда, когда считают, что смогут на них заработать."
13010-333 = "На бумаге с нас можно получить много денег, но долг академии, которая в любой момент может закрыться, — огромный риск."
13010-334 = "Никто не станет покупать облигации в надежде заработать на пяти студентах, которые едва справляются с выплатами."
13010-336 = "..."
13010-337 = "Это правда, но..."
13010-339 = "Это знак того, что Кайзер полностью потеряла к нам интерес... или потеряет, если найдёт того, кто выкупит долг."
13010-340 = "...Хотя, возможно, они просто пытаются вернуть часть убытков, продав долг подешевле."
13010-341 = "Т-То есть нам придётся вернуть меньше?"
13010-342 = "К сожалению, нет, Сэрика. Они продают право на наш долг дешевле, но сумма, которую мы должны, не изменится..."
13010-343 = "Они могут продать право взыскать миллион иен всего за тысячу... но мы всё равно останемся должны миллион."
13010-344 = "Я-Я поняла! Можешь больше не объяснять, Широко!"
13010-345 = "Хм..."
13010-346 = ""
13010-348 = ""
13010-349 = "Аяне, какую часть нашего долга Кайзер превратила в облигации? Не думаю, что они перевели в них всё."
13010-350 = "Да... согласно объявлению, это около 45% того, что Абидос должен Корпорация Кайзер."
13010-351 = "Хм... Интересно, что они задумали..."
13010-353 = "А что, если мы сами выкупим свой долг по низкой цене...?!"
13010-354 = "Если они продают права дёшево, мы можем просто купить их сами!"
13010-356 = "Да. Именно поэтому я и подняла этот вопрос..."
13010-357 = "Я думала использовать наши накопления, чтобы купить эти облигации, как только откроется долговой рынок."
13010-358 = "Гениально! Так и сделаем, Аяне!"
13010-359 = "Надо следить за колебаниями цены, прямо как на фондовом рынке..."
13010-360 = "Хорошо, тогда..."
13010-363 = "...Ч-Что?"
13010-364 = "Что такое?"
13010-365 = "Ц-Цена наших облигаций... стремительно растёт!!"
13010-366 = "Р-Растёт?!"
13010-367 = ""
13010-372 = "200% — 300% — нет, 450% от номинала?! К-Кто-то скупает облигации по безумной цене!"
13010-373 = "Ч-что?!"
13010-374 = "Кто вообще...?!"
13010-375 = "Эм, и-и-их очень много... Проверяю покупателя..."
13010-376 = ""
13010-379 = ""
13010-380 = "...Распродано."
13010-381 = "Облигации Абидоса... полностью распроданы..."
13010-382 = "К-Кто же мог..."
13010-383 = "М-Мы уже можем проверить..."
13010-384 = "Группа, которая приобрела все производные облигации, обеспеченные промышленной инфраструктурой Абидоса..."
13010-385 = ""
13010-387 = ""
13010-388 = "...Нефтис Group?"
13010-389 = "..."
13010-390 = "...?!"
13010-391 = "..."
13010-393 = "...!!!"
13010-394 = "[ns] «...!!!»"
13010-397 = ""
13010-398 = "Вот так. Первые ходы, достойные прохождения по гайду."
13010-399 = "Надеюсь, ты готов к своему первому ходу, мой дорогой игрок— Нет, мой дорогой Сенсей."
13010-400 = ""
13010-401 = "Через нашу игру мы п-п-постигнем истинную глубину смерти."
13010-402 = ""
13010-410 = "Комитет по предотвращению закрытия;Глава 3"
13010-412 = "Следы мечты"
