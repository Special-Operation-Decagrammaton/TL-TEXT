[translation]
13010-1 = "Episódio 1;Prólogo"
13010-4 = "...É aqui."
13010-5 = "Ó irmão selado, expulso da Gematria e sepultado no esquecimento..."
13010-7 = "Que agonia... que agonia..."
13010-8 = "Sua penitência termina agora.#nDesperte, \"Morador do Subterrâneo\"."
13010-9 = "..."
13010-10 = "...Essa voz."
13010-11 = "O \"Peregrino Anônimo\"... é você, não é...?"
13010-12 = "Não — agora me chame de \"Francis\"."
13010-13 = "Tanto faz... Por favor, deixe-me em paz..."
13010-14 = "Seja qual for o motivo... não tenho interesse... Hihi, hi..."
13010-15 = "Eu não vou mais..."
13010-18 = "— A Gematria foi aniquilada."
13010-19 = "..."
13010-20 = "O que quer dizer com isso...?"
13010-22 = "A Gematria não existe mais. Pode considerar que foi desmantelada, ou dissolvida."
13010-23 = "...Por uma única razão."
13010-24 = "Por causa de um ser chamado Sensei [USERNAME], da Schale. Essa pessoa distorceu a causalidade e o gênero da história."
13010-25 = "Enfrentar essa pessoa agora seria—"
13010-26 = "Shh! ...Silêncio."
13010-31 = "Hmm..."
13010-32 = "Entendo... o \"Livro de Regras\" foi atualizado, não é?"
13010-40 = "Um novo mundo... Sim, eu sinto.#nA estranheza deste mundo..."
13010-41 = "Se o livro foi alterado e as regras mudaram, então... uma nova campanha começou..."
13010-42 = "É-É mesmo...? Hihi, hi! ...Então isso muda tudo."
13010-43 = "Q-Que tipo de revelação... este novo livro me trará?"
13010-44 = "Vejamos, vejamos... você disse [USERNAME]...?"
13010-45 = "Essa pessoa é o chefe desta campanha...?"
13010-46 = "O novo \"Livro de Regras\" é..."
13010-52 = "Uma cidade acadêmica..."
13010-58 = "E um Sensei?"
13010-60 = "H-Hmm...? M-Mas o quê?! A dificuldade é m-muito maior do que eu imaginava...!"
13010-64 = "M-Mas tudo neste mundo tem uma estratégia de vitória...! Vejamos, vejamos... um ponto cego, uma fraqueza... uma falha... Qualquer coisa serve...!"
13010-65 = "Não subestime essa pessoa, Morador do Subterrâneo."
13010-69 = "Não me interessa como você enxerga este mundo.#nMas, se continuar achando que isto é algum joguinho de tabuleiro, jamais alcançará uma verdadeira vitória."
13010-70 = "..."
13010-71 = "Vou lhe dar a resposta. Para vencer essa pessoa..."
13010-77 = "NÃO SE INTROMETA!! SEU LIXO!!!!"
13010-82 = "Alguém como você, que nem conhece a \"morte\"?! Hã?!"
13010-83 = "Acha que consegue compreender o meu sofrimento, a minha solidão... o meu terror?!"
13010-84 = "Não se meta onde não foi chamado, seu Peregrino Anônimo!! ESTA É A MINHA CAMPANHA!!"
13010-85 = "O que importa é a revelação que eu vou alcançar através da minha penitência!!"
13010-86 = "NÃO OUSE ATRAPALHAR ISSO!!!!!"
13010-91 = "NÃO SE INTROMETA NA MINHA CAMPANHA—!!!"
13010-102 = "Arf... arf..."
13010-103 = "Vitória...?#nPor que todos são tão obcecados por isso?"
13010-104 = "O resultado já está decidido!!#nTodos nós morreremos um dia — essa é a única verdade imutável!"
13010-105 = "No fim, todos estamos fadados à derrota... Não é isso que importa!!"
13010-106 = "Isso mesmo... o que importa é o processo...!#nO que eu vivencio e que revelação alcanço ao longo dele — só isso tem significado..."
13010-107 = "Vermes como vocês ousando reivindicar a nobre busca da \"Gematria\"...?#nI-Isso mancha o nome da Gematria...!!"
13010-108 = "Vocês são uma vergonha para esse nome—?!!!"
13010-110 = "Arf... arf..."
13010-111 = "C-C-Calma... preciso me acalmar..."
13010-112 = "Preciso d-decidir... o que fazer a partir de agora..."
13010-116 = "A Gematria... foi aniquilada?"
13010-117 = "Não — a verdadeira Gematria sou eu."
13010-118 = "Eu mostrarei a verdadeira forma da Gematria..."
13010-119 = "Hihi, hi... M-Muito bem. Primeiro, preciso conhecer este mundo...#nUm novo Codex, uma nova campanha..."
13010-120 = "Ah, sim... Então começarei minha busca a partir de lá."
13010-122 = "...Abydos."
13010-123 = "Aquele império onde nasceram os \"Mistérios\" ancestrais... Que forma ele terá assumido neste novo Codex...?"
13010-125 = "Hihi, hihi..."
13010-130 = "Por favor, garanta que eu me divirta."
13010-136 = "Olha, olha, Hoshino-chan!"
13010-138 = "Parece que o antigo conselho estudantil enterrou uma coisa incrível no \"Grande Oásis\" de Abydos!!"
13010-139 = "Uma coisa incrível?"
13010-140 = "Sim! São fogos de artifício, mas feitos com um mineral raro..."
13010-141 = "Dizem que eles usam uma tecnologia que, quando ativada, solta faíscas de plasma que pintam todo o céu!"
13010-142 = "E tem até fogos com um formato assiiim! Não é uma fofura~?!"
13010-146 = "Originalmente eram pra ser usados num festival, mas não funcionaram direito por algum motivo, então jogaram o resto no lago."
13010-147 = "...Entendi."
13010-148 = "Incrível, né? Jogar fora algo feito com um mineral que custa mais de um milhão de ienes a cada 100g!"
13010-149 = "Só podia ser o antigo conselho estudantil de Abydos... o pessoal que usava colchonetes de ginástica de pena de ganso..."
13010-150 = "Podiam ter deixado pelo menos um centésimo disso pra gente... buáá."
13010-151 = "...Mas esse oásis já não secou há muito tempo?"
13010-152 = "Uhum, pois é."
13010-153 = "Agora é só um areal vazio, não tinha nada lá."
13010-154 = "Fufufu... Hoshino-chan, você ainda tem muito o que aprender!"
13010-155 = "Isso foi na época em que ainda existia o lago, então faz bastante tempo, né?"
13010-156 = "Ou seja...?"
13010-157 = "Ou seja, esses fogos... estão lá no oásis seco..."
13010-158 = "Enterrados bem debaixo da areia!"
13010-162 = "Quer dizer que tem um mineral raro enterrado debaixo do \"Grande Oásis\"?"
13010-163 = "Isso mesmo!"
13010-167 = "...Yume-senpai, você tem noção do que acabou de dizer?"
13010-169 = "Eh...? Bem..."
13010-173 = "Não temos tempo a perder! Vamos procurar agora mesmo!!"
13010-174 = "ISSO!! Era exatamente o que eu queria dizer! ...Caça ao tesouro, começar!"
13010-175 = "Uhehe, vamos lá, Senpai!!"
13010-176 = "Sim! Agora a gente vai ficar podre de rica, Hoshino-chan!"
13010-187 = "Hoshino-chan... sabe..."
13010-188 = "Nem diga mais nada! Eu também já tô começando a perceber!"
13010-189 = "Né? Não sou só eu, né...? Já tá na hora de parar?"
13010-190 = "S-Só mais um pouquinho de esforço...!"
13010-191 = "...Desculpa, Hoshino-chan. Deu ruim de vez~."
13010-192 = "A-Argh..."
13010-194 = "Ei, Hoshino-chan... onde será que a gente errou...?"
13010-195 = "Desde o momento em que você veio com esse plano maluco, Senpai."
13010-196 = "Buáá... mas você também ficou toda animada, Hoshino-chan... A culpa é minha? É mesmo?"
13010-197 = "...E-Eu já sei disso! Não precisa jogar na cara!"
13010-202 = "Pensando bem agora, acho que a gente nem precisava ter vindo de maiô..."
13010-203 = "Você realmente não pensou em nada, né?!#nPor que falou pra gente vestir isso?!"
13010-204 = "Ué, é que... eu achei que se a gente cavasse, podia jorrar água subterrânea com um \"BUUUM!\"..."
13010-205 = "E por acaso existe alguma chance disso acontecer?!"
13010-207 = "Aí a desertificação ia se resolver sozinha e todo mundo viveria feliz para sempre~..."
13010-208 = "Claro que não, né!"
13010-209 = "Buáá..."
13010-211 = "Hmm... preciso anotar o que aconteceu hoje pra refletir sobre os nossos erros..."
13010-212 = "E-Espera aí, Senpai, o que você tá escrevendo..."
13010-213 = "Para de registrar um mico desses!"
13010-214 = "Mas é tipo um dever da presidente do conselho estudantil... e acho que pode acabar sendo útil pra você no futuro, Hoshino-chan..."
13010-215 = "Isso aí só tem registro de fracasso! E quem ia querer um caderno caindo aos pedaços desses?! Eu compro um novo pra mim!"
13010-216 = "Buááá..."
13010-222 = "Comitê de Contramedidas - Sala de Aula"
13010-223 = "Bem, vamos dar início à reunião ordinária do Comitê de Contramedidas de Abydos..."
13010-224 = "...É o que eu gostaria de dizer, mas está faltando uma pessoa."
13010-228 = "Uhum, uhum! A pessoa de sempre~☆"
13010-229 = "Nn, a Hoshino-senpai não está aqui."
13010-230 = "Onde será que ela se meteu agora?! Tá tirando outro cochilo por aí?"
13010-231 = "Agora há pouco ela estava dormindo na sala ao lado."
13010-232 = "Então tinha que ter trazido ela, Shiroko-senpai! A reunião já vai começar!"
13010-233 = "É-É... mas fiquei sem jeito de acordar ela..."
13010-234 = "Por quê? Ela tava dormindo com aquele sorrisinho bobo de novo?"
13010-235 = "A Shiroko-chan é muito boazinha com a Hoshino-senpai, né."
13010-236 = "Vou lá buscar ela agora."
13010-237 = "Ah, eu também vou, Shiroko-chan!"
13010-242 = "Não precisava ir as duas só pra isso!"
13010-243 = "Ahaha... todo mundo adora a Hoshino-senpai, né..."
13010-246 = "Hoshino-senpai, a reunião vai começar."
13010-247 = "Uhum, uhum, já está na hora de acordar~☆"
13010-248 = "...Ué?"
13010-255 = "Hoshino-senpai?"
13010-261 = "Você já estava acordada."
13010-262 = "...Ah."
13010-263 = "É mesmo... tinha reunião, né."
13010-264 = "Uhe~, foi mal, foi mal. Acho que é a idade chegando, este velhote anda meio esquecido ultimamente."
13010-265 = "U-Uhum."
13010-266 = "Ué? Ninguém vai retrucar com um \"a gente quase tem a mesma idade!\"?"
13010-267 = "Vamos logo, vamos~. A Ayane-chan dá medo quando fica brava."
13010-271 = "Espera, Senpai."
13010-275 = "..."
13010-282 = "[ns] \"Estão todas aqui?\""
13010-283 = "Sim. Já que todos chegaram, vamos começar a reunião."
13010-284 = "Primeiro, gostaria de compartilhar algumas movimentações incomuns que aconteceram recentemente nos arredores do Distrito Autônomo de Abydos."
13010-285 = "Movimentações incomuns?"
13010-286 = "Aconteceu alguma coisa?"
13010-288 = "...Sim. Por enquanto acho que é só algo para ficarmos de olho, mas..."
13010-289 = "O que houve, Ayane-chan?"
13010-290 = "Bem... tudo começou com o Grupo Kaiser."
13010-292 = "Como todas sabem, até pouco tempo atrás a Kaiser Corporation estava realizando escavações no Deserto de Abydos."
13010-293 = "Nós não sabíamos o que a Kaiser estava procurando lá, mas..."
13010-297 = "Bom... no fim das contas, descobrimos o que era, né."
13010-298 = "Mesmo que tenha acabado em pedacinhos..."
13010-300 = "Sim. No fim, a \"Nave-Mãe de Utnapishtim\" foi destruída na estratosfera, e nem mesmo seus destroços ou vestígios puderam ser encontrados."
13010-301 = "E acho que, a partir do momento em que a nave foi destruída, a Kaiser perdeu o motivo para ocupar o Deserto de Abydos."
13010-302 = "Eles foram se retirando gradualmente do deserto, e agora o local está praticamente em ruínas."
13010-304 = "Nn. Eu vi eles se retirando da área de escavação."
13010-305 = "Isso deu um alívio enorme! Que nunca mais voltem aqui!"
13010-306 = "Mas isso não quer dizer que a nossa dívida com a Kaiser sumiu, né..."
13010-308 = "Sim... Como a dívida de Abydos ainda está nas mãos da Kaiser, a nossa situação não mudou nada..."
13010-310 = "Além disso, parece que o presidente da Kaiser Corporation está mais interessado na reconstrução da Torre Sanctum do que no Deserto de Abydos..."
13010-312 = "Porém, agora vem o ponto principal."
13010-313 = "O ponto principal..."
13010-314 = "Nn."
13010-315 = "O que aconteceu, Ayane-chan?"
13010-317 = "Indo direto ao ponto... o Grupo Kaiser está convertendo a dívida de Abydos em títulos de crédito para vendê-la no mercado de títulos."
13010-318 = "Eh, títulos de crédito...?"
13010-322 = "Mercado de títulos...? Q-Que negócio é esse?!"
13010-323 = "Eles vão transformar o direito de cobrar a nossa dívida em títulos negociáveis—"
13010-324 = "...Resumindo, vão vender o direito de cobrar a nossa dívida pra outra pessoa."
13010-325 = "Quê?! E o que acontece então?!"
13010-326 = "Quem comprar esses títulos passa a receber os pagamentos da dívida de Abydos, então..."
13010-327 = "Quer dizer que vamos pagar a dívida pra outra pessoa? Isso é bom pra gente?"
13010-329 = "Isso..."
13010-330 = "Não, isso é impossível."
13010-331 = "Hoshino-senpai...?"
13010-332 = "Negociar títulos de dívida só faz sentido se houver perspectiva de lucro."
13010-333 = "Mas comprar os títulos de uma escola como a nossa, que pode desaparecer a qualquer momento, é puro risco."
13010-334 = "Acho que ninguém compraria a dívida de uma escola onde só cinco alunas estão pagando a conta."
13010-336 = "..."
13010-337 = "É... faz sentido, mas..."
13010-339 = "Até dá pra interpretar como a Kaiser lavando as mãos sobre a gente de vez, mas só se aparecer algum comprador."
13010-340 = "...Bom, talvez a intenção seja se livrar disso vendendo a preço de banana."
13010-341 = "E-Então o valor que a gente tem que pagar também diminui?"
13010-342 = "Não, Serika-chan. Eles só estão vendendo o direito de cobrança mais barato; a nossa dívida não muda nada."
13010-343 = "É como comprar o direito de receber um milhão de ienes por novecentos mil. O valor que a gente deve continua igual."
13010-344 = "T-Tá bom, já entendi, não precisa explicar mais, Shiroko-senpai!"
13010-345 = "A-Ah... desculpa."
13010-349 = "Ayane-chan, quanto da dívida a Kaiser converteu em títulos? Com certeza não foi tudo, né?"
13010-350 = "Sim. O valor divulgado até o momento é... cerca de 45% da dívida de Abydos que a Kaiser Corporation detém."
13010-351 = "Hmm... entendi..."
13010-353 = "Ah... se for assim, e se nós mesmas comprarmos barato...?!"
13010-354 = "...É mesmo?! É só a gente comprar!"
13010-356 = "Sim. Eu também queria conversar com todas sobre isso..."
13010-357 = "Pensei que, assim que o mercado de títulos abrir, poderíamos usar nossas economias para comprar."
13010-358 = "Boa ideia, manda ver, Ayane-chan!"
13010-359 = "Primeiro, assim como na bolsa de valores, precisamos observar bem as oscilações..."
13010-360 = "Certo, então—"
13010-363 = "U-Ué...?"
13010-364 = "O que foi?"
13010-365 = "O-Os nossos títulos... estão disparando!"
13010-366 = "D-Disparando?!"
13010-372 = "200% do valor nominal... 300%... 450%?!#nA-Alguém está comprando tudo em uma velocidade absurda!!"
13010-373 = "Q-Quê...??"
13010-374 = "Quem diabos está fazendo isso...?!"
13010-375 = "O volume é tão grande que está difícil identificar..."
13010-380 = "...Esgotaram."
13010-381 = "Os títulos de Abydos... foram todos comprados..."
13010-382 = "N-Não pode ser..."
13010-383 = "B-Bom... compartilhando o que descobri até agora..."
13010-384 = "Quem arrematou todos os derivativos de Abydos foi—"
13010-388 = "— O Grupo Nephthys, ao que tudo indica..."
13010-389 = "..."
13010-390 = "...!?"
13010-391 = "..."
13010-393 = "...!!"
13010-394 = "[ns] \"...!!\""
13010-398 = "Muito bem... a estratégia de vitória está completa."
13010-399 = "Vamos começar, jogador... ou melhor, Sensei... Hihi, hi."
13010-401 = "Neste jogo, descobriremos o verdadeiro significado da morte."
13010-410 = "Comitê de Contramedidas — Capítulo 3"
13010-412 = "As Pegadas Deixadas por um Sonho"
