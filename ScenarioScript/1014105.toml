[translation]
1014105-1 = "Ночная прогулка"
1014105-2 = "Я спустился к главному входу здания."
1014105-3 = "Я спустился к главному входу здания."
1014105-4 = ""
1014105-6 = ""
1014105-7 = ""
1014105-8 = ""
1014105-9 = ""
1014105-10 = ""
1014105-11 = "С-Сенсей?!"
1014105-12 = "[s] «Привет, Харука.»"
1014105-13 = "Простите, что беспокою вас так поздно ночью!"
1014105-14 = "Простите, что беспокою вас так поздно ночью!"
1014105-15 = "Х-Хотите знать, что случилось?"
1014105-16 = "Ну..."
1014105-17 = "Эм... Сегодня у меня снова была подработка охранником, и по дороге домой я случайно проходила мимо Шале..."
1014105-18 = "[s] «Как прошла работа?»"
1014105-19 = "Хорошо! Очень хорошо! Я ПОСТАРАЛАСЬ не повторить прошлую ошибку."
1014105-20 = "Если что-то выглядело хотя бы немного подозрительно, я сразу нажимала на спуск!"
1014105-21 = "[s] «...А?»"
1014105-22 = "Работодатель был очень доволен! Сказал, что порядок на площадке был намного лучше обычного!"
1014105-23 = "[s] «В итоге... Насилие действительно решение?»"
1014105-24 = "А?"
1014105-25 = "[s1] «Хочешь немного прогуляться со мной?»\n[s2] «Я провожу тебя домой.»"
1014105-28 = "В-Вы проводите меня домой...?"
1014105-29 = "Н-Нельзя...!"
1014105-30 = "Я уже беспокою вас посреди ночи. Не могу стать ещё большей обузой..."
1014105-31 = "[s3] «Всё нормально, Харука.»\n[s4] «Я всегда рад любому поводу отойти от стола.»"
1014105-34 = "А...? П-Правда?"
1014105-35 = "Если так, тогда..."
1014105-36 = "Я-я буду благодарна..."
1014105-38 = "Так мы с Харукой отправились домой по тихой ночной улице."
1014105-40 = "Э-э..."
1014105-41 = "Вокруг никого..."
1014105-42 = "Темно и немного одиноко..."
1014105-43 = "Простите... что написала вам так поздно..."
1014105-44 = "[s] «Ты весь день работала! Ничего не поделаешь.»"
1014105-45 = "Моя работа..."
1014105-46 = "Эм, насчёт этого..."
1014105-47 = "... ...Моя смена закончилась два часа назад."
1014105-48 = "[s] «А?»"
1014105-49 = ""
1014105-52 = "[ns] «Так ты ДВА часа просто ходила перед Шале туда-сюда?!»"
1014105-53 = "Есть..."
1014105-54 = "Почему я так долго не решалась написать?"
1014105-55 = "А вдруг вы были заняты срочным делом?"
1014105-56 = "Или вообще ушли из офиса..."
1014105-57 = "Или я помешала бы вашему отдыху, или вам просто не хотелось выходить на улицу..."
1014105-58 = "Я начала слишком много думать и всё больше сомневалась."
1014105-59 = "Не хотела шокировать вас внезапным появлением."
1014105-60 = "Я просто не хочу быть для вас обузой, Сенсей."
1014105-61 = "[s] «Да, любой из этих вариантов мог случиться.»"
1014105-62 = "Я-я так и знала...!"
1014105-63 = "[s5] «Но в итоге ты написала, а ничего из этого не случилось.»\n[s6] «И теперь мы можем вместе весело прогуляться ночью.»"
1014105-66 = "Э...?"
1014105-67 = "[s] «Спасибо, что первой связалась со мной, Харука.»"
1014105-68 = "Э-Это..."
1014105-69 = "Значит, если такое случится снова, мне не нужно сомневаться и стоит просто написать...?"
1014105-70 = "Потому что я не умею читать ваши мысли? Значит, нужно просто сказать?"
1014105-71 = ""
1014105-73 = ""
1014105-74 = "Е-Если так, Сенсей..."
1014105-75 = "Даже если это я... Такая, как я..."
1014105-76 = "Можно вас кое о чём попросить, Сенсей?"
1014105-77 = ""
1014105-79 = ""
1014105-80 = ""
1014105-82 = "Харука нерешительно сделала шаг ближе и мягко потянула меня за рукав, хотя сама сжимала ткань побелевшими пальцами."
1014105-83 = ""
1014105-85 = ""
1014105-86 = "Пока мы не доберёмся..."
1014105-87 = "...можем идти чуть-чуть медленнее?"
1014105-89 = "У меня не было причин отказывать."
1014105-90 = "Не спеша, мы с Харукой наслаждались долгой ночной прогулкой."
