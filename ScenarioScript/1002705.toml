[translation]
1002705-1 = "Непредвиденный итог"
1002705-2 = "Карин привела меня не куда-нибудь, а в собственную комнату. Там было очень чисто."
1002705-3 = "Карин выглядела как обычно, но на её лице читалась решимость."
1002705-6 = "[ns] «У тебя довольно чисто в комнате.»"
1002705-7 = "Да. Заходите, Сенсей."
1002705-8 = "И спасибо вам."
1002705-9 = "Я знаю, насколько это для вас важно, и вы всё равно доверились мне и пришли на мой зов."
1002705-10 = "[s1] «...Да.»\n[s2] «Это важно. Очень важно.»"
1002705-11 = "Верно. Так вот, насчёт этого, Сенсей."
1002705-12 = "Верно. Так вот, насчёт этого, Сенсей."
1002705-13 = "А?"
1002705-14 = "Что? Почему я в своей обычной форме горничной?"
1002705-15 = "Что вы имеете в виду? Сегодня ваш день, Сенсей, а не мой."
1002705-16 = "Если я надену ту одежду, вы не сможете её примерить."
1002705-17 = "Если вам неловко, я могу выйти из комнаты. Примеряйте сколько захотите, а потом позовите меня."
1002705-18 = "И, конечно..."
1002705-19 = ""
1002705-21 = ""
1002705-23 = ""
1002705-24 = "Я никому не скажу. Кажется, это всё, верно?"
1002705-25 = ""
1002705-27 = ""
1002705-28 = "Вот, держите."
1002705-29 = "Я знаю, что вы чувствуете к этому наряду. Наслаждайтесь."
1002705-30 = "...?"
1002705-31 = "Не возьмёте? Почему...?"
1002705-32 = "Ах, я ещё не заслужила вашего доверия? Но вы ведь даже пришли сюда."
1002705-33 = "[s3] «Я не это имел в виду.»\n[s4] «Я никогда не хотел его надевать.»"
1002705-34 = "Вы не это имели в виду?"
1002705-35 = "Вы никогда не хотели его надевать?"
1002705-36 = "Не понимаю."
1002705-37 = "[s] «Я говорил о тебе.»"
1002705-38 = ""
1002705-40 = ""
1002705-41 = "Ах!"
1002705-42 = "...?"
1002705-43 = "...А. Так вот что вы имели в виду..."
1002705-44 = "Эм."
1002705-45 = "Простите. Я всё это время неправильно понимала."
1002705-46 = "Так вот в чём всё это время было дело..."
1002705-47 = "Простите. За то, что неправильно поняла."
1002705-48 = "Но тогда почему вы задавали те вопросы?"
1002705-49 = "[s5] «Потому что казалось, что тебе нравится эта одежда.»\n[s6] «Потому что я хотел побольше узнать о твоих увлечениях.»"
1002705-50 = "Ах!"
1002705-51 = "Ах!"
1002705-52 = "Так вот и всё? Кажется, теперь я понимаю."
1002705-53 = "Вам были интересны мои интересы. Я-я даже не осознавала..."
1002705-54 = "Честно говоря, раньше никто не проявлял ко мне интереса и не спрашивал о том, чем я занимаюсь."
1002705-55 = "Но, эм, понятно. Просто потому, что на мне была другая одежда... Вот и всё."
1002705-56 = "Если подумать, на заданиях C&C я всегда носила эту форму горничной."
1002705-57 = "Школьную форму я почти не носила... как, впрочем, и любую другую одежду."
1002705-58 = "Хи-хи. Может, меня подсознательно привлекало само волнение от того, что я надела что-то новое?"
1002705-59 = "Я впечатлена, Сенсей. Я сама этого даже не осознавала, а вы сразу заметили."
1002705-60 = "Я беру назад всё, что говорила о доверии. Теперь мне, вообще-то, довольно неловко."
1002705-61 = "В конце концов, вы всегда мне помогаете, правда?"
1002705-62 = "Что? Я всё ещё могу вам чем-то помочь?"
1002705-63 = "...Вы хотите это увидеть?"
1002705-64 = "*вздыхает* Вы и правда никогда не меняетесь, Сенсей."
1002705-65 = "Ну ладно. Если это вас порадует, тогда я согласна."
1002705-66 = "Тогда можете ненадолго выйти? Чтобы я могла переодеться."
1002705-67 = "[s] Ненадолго выйти из комнаты Карин."
1002705-68 = ""
1002705-76 = ""
1002705-77 = "Ну как? Что скажете?"
1002705-78 = "Ч-Что такое? Когда вы так на меня смотрите, мне становится как-то неловко..."
1002705-79 = "В-В общем, что думаете? Только честно."
1002705-80 = "А?"
1002705-81 = "Вы хотите, чтобы я подумала о том, что сейчас чувствую?"
1002705-82 = "Хи-хи. Так вот почему. Хорошо."
1002705-83 = ""
1002705-85 = ""
1002705-86 = ""
1002705-87 = "Дайте подумать."
1002705-88 = "Наверное, как вы и сказали, это очень приятное чувство."
1002705-90 = "Да, мне определённо нравится!"
