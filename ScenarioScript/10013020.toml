[translation]
10013020-1 = "Эпизод 2;Давайте разберёмся"
10013020-2 = "Пока все разошлись готовиться..."
10013020-3 = ""
10013020-5 = ""
10013020-6 = "О чём вообще думает Шизуко? Мой план был намного лучше."
10013020-7 = "И подумать только, Мимори и Чисэ тоже переметнулись! Вот это поворот."
10013020-8 = "Что думает наш мудрый Сенсей?"
10013020-9 = "[s] «Да ничего особенного. Здесь нет правильного и неправильного.»"
10013020-10 = ""
10013020-13 = "[ns] «Но я уважаю решение Шизуко.»"
10013020-14 = "Как же бесит. Вы совсем не изменились."
10013020-15 = "Ня-ха-ха! На этом моя глава в этой скучной истории закончена."
10013020-16 = "Если мои советы всё равно будут игнорировать, я вернусь туда, где меня ценят."
10013020-17 = "[s] «Хорошо, Ния. Удачи.»"
10013020-18 = "Удача? Ня-ха-ха! Я в такие вещи не верю, Сенсей."
10013020-19 = ""
10013020-21 = ""
10013020-23 = ""
10013020-26 = ""
10013020-27 = "Добро пожаловать в Пляжную хижину, Сенсей!"
10013020-28 = "[s] «Привет, Шизуко... На тебе что...?»"
10013020-29 = "Что значит «что»? Купальник, конечно."
10013020-30 = "Дальше нас ждёт ожесточённая борьба! Нужно быть готовыми во всём."
10013020-31 = "Очевидно, я должна одеться по обстановке."
10013020-32 = "Разве это не умно? Я обо всём думаю."
10013020-33 = "Я профессионал во всех аспектах! Я готовлюсь к любому случаю."
10013020-34 = "[s] «Д-Да... Наверное, звучит логично...»"
10013020-35 = "Хи-хи. Конечно."
10013020-36 = "Хех."
10013020-37 = ""
10013020-39 = ""
10013020-40 = ""
10013020-42 = ""
10013020-44 = "Т-Так вот... поэтому я его надела, но..."
10013020-45 = "...У-У-У вас есть какое-нибудь мнение... о моём купальнике?"
10013020-46 = "Н-Ну знаете, например, насколько х-хорошо я выгляжу?"
10013020-47 = "Господи-и-и-и-и-ин!"
10013020-48 = ""
10013020-50 = ""
10013020-53 = "[ns] «Ого, И-Изуна?!»"
10013020-59 = "Ага! Изуна прямо как Шизуко!"
10013020-60 = "Изуна переоделась в подходящий боевой костюм!"
10013020-61 = ""
10013020-63 = ""
10013020-64 = "Это прямо как ниндзюцу! Вам нравится, господин?"
10013020-65 = ""
10013020-67 = ""
10013020-68 = "[ns] «Эм... Да...»"
10013020-69 = "Уgh. Изуна...!"
10013020-70 = "Как замечательно видеть, что все полны энергии."
10013020-71 = "Сенсей. Вы можете понять, что это я? Я замаскировалась."
10013020-72 = "Я переоделась, значит..."
10013020-73 = "Теперь я могу бегать по воде?"
10013020-74 = "[s] «Нет. Пожалуйста, даже не пробуй.»"
10013020-75 = "Как странно."
10013020-77 = "Однако! Чисэ!"
10013020-78 = "Сейчас ты, может, ещё не можешь, но тебе стоит попробовать тренировать ниндзюцу!"
10013020-79 = "Потому что ниндзя умеют бегать по воде! Изуна думает, у тебя тоже получится!"
10013020-80 = "[s] «Уверенность — это неплохо, но...!»"
10013020-81 = ""
10013020-84 = ""
10013020-85 = "[ns] «В любом случае, все быстро переоделись.»"
10013020-86 = "О, да..."
10013020-87 = "Цукуё и президент выбрали это для меня! Они так гордились, что я отправляюсь на задание совсем одна. Хи-хи!"
10013020-88 = "Президент Ния сказала, что на пляже это повысит мою силу."
10013020-89 = "[s] «Если она так говорит... А ты, Мимори?»"
10013020-90 = "О... Я-я?"
10013020-93 = "Я сказала Цубаки и Каэдэ, что у меня есть дела на пляже, и они очень обрадовались..."
10013020-94 = "Я пришла сюда потому, что беспокоюсь за Шизуко, а не чтобы отлынивать от обязанностей под видом отпуска."
10013020-95 = "Мне немного... неловко."
10013020-97 = ""
10013020-98 = "[ns1] «Всё нормально, ты ведь нечасто бываешь на пляже.»\n[ns2] «Я рад, что все так воодушевлены.»"
10013020-101 = "С-Спасибо, Сенсей."
10013020-102 = "Я-я тоже так подумала!"
10013020-103 = "Согласна! Здорово видеть всех не в форме."
10013020-104 = "Настоящий маленький рай! Может, стоит устроить здесь фестиваль."
10013020-105 = "...Жаль, я тоже не взяла купальник."
10013020-106 = "Наверное, это просто значит, что я смогу любоваться красотой фестиваля со стороны."
10013020-107 = "Верно, Сенсей?"
10013020-108 = "[ns] «Д-Да, наверное...?»"
10013020-110 = "Умика, дай Сенсею немного пространства..."
10013020-112 = ""
10013020-116 = ""
10013020-117 = "Раз показ мод окончен, давайте обменяемся информацией."
10013020-118 = ""
10013020-124 = "По словам Нии, на курорте «Потерянный рай» есть несколько крупных группировок."
10013020-125 = "Она считает, что их около четырёх..."
10013020-127 = ""
10013020-128 = "Да. Самые агрессивные из них — Бандиты в шлемах."
10013020-129 = "Именно они на нас напали. Шумные и раздражающие."
10013020-130 = "К счастью, поэтому их местоположение и пути снабжения хорошо задокументированы."
10013020-132 = "По сути, это единственная группа, о которой у нас много информации. Остальные стараются передвигаться как можно тише."
10013020-133 = "Бандиты в шлемах — единственные, кому хватило наглости не использовать кодовое имя."
10013020-134 = "[s] «Кодовое имя?»"
10013020-135 = "Да, группировки взяли себе кодовые имена, чтобы скрывать личность. Например, на острове прямо рядом с нами..."
10013020-136 = ""
10013020-139 = ""
10013020-140 = "«Серные шахтёры в поисках раскалённых земель, что кипят вечно.»"
10013020-141 = "Как мило! Так романтично! ☆"
10013020-142 = "[s] «Р-Романтично...?»"
10013020-144 = ""
10013020-145 = "Есть ещё «Белoухие чудовища, уничтожающие проигравших...»"
10013020-147 = ""
10013020-148 = "О, а здесь написано «Посланники Чёрной Черепахи, требующие постоянной компенсации», господин!"
10013020-149 = "О! Звучат как злодеи, которые сражаются с ниндзя!"
10013020-150 = "[s] «Я не очень вижу связь...»"
10013020-151 = "По-моему, они звучат как персонажи мультфильма."
10013020-153 = "И последнее кодовое имя..."
10013020-154 = ""
10013020-156 = ""
10013020-157 = "О. «Бандиты в шлемах, которые в любой момент затевают случайные драки.»"
10013020-158 = "Кто вообще использует настоящее название внутри кодового?"
10013020-159 = "По крайней мере, понятно, кто это. Больше информации у нас почти нет."
10013020-160 = "Ага... Многого мы всё ещё не знаем."
10013020-162 = "Эм... Какой у нас следующий ход, Шизуко?"
10013020-163 = ""
10013020-165 = ""
10013020-166 = ""
10013020-168 = ""
10013020-169 = ""
10013020-170 = ""
10013020-171 = ""
10013020-172 = ""
10013020-173 = "Ну... Эм... Думаю, нам стоит..."
10013020-174 = "Хм-м. Чтобы действовать эффективнее..."
10013020-175 = ""
10013020-177 = ""
10013020-181 = "Хорошо. У меня есть предложение."
10013020-182 = "Давайте разделимся на две команды."
10013020-183 = "[s] «Думаешь, это безопасно?»"
10013020-184 = "Может быть немного опаснее, но так мы ускоримся."
10013020-185 = "Репутация Момоёдо падает прямо сейчас."
10013020-186 = "Так что мы наперегонки со временем!"
10013020-187 = "[s3] «Полагаю, разделимся по школам?» \n[s4] «Тогда на команды Абидоса и Хяккияко.»"
10013020-190 = ""
10013020-192 = ""
10013020-193 = ""
10013020-194 = "Да, так мы сможем охватить больше территории. Мы пойдём сюда, а Абидос — туда."
10013020-195 = "Хорошая мысль, Шизуко."
10013020-196 = "Именно! Всем удачи."
10013020-197 = "Давайте устроим величайший фестиваль в истории!"
10013020-199 = "Ниндзя всегда готова! Вперёд!"
10013020-200 = "[s] «Берегите себя, каждая из вас.»"
10013020-201 = "Да! Начиная с этого момента, битва за захват курорта «Потерянный рай»..."
10013020-202 = "...начинается!"
