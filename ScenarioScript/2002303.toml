[translation]
2002303-1 = "Обязанности директора"
2002303-5 = ""
2002303-6 = "*шшшк* Цель этой операции — задержать подозреваемого, обвиняемого во взломе припаркованной машины Бюро безопасности и краже из неё наличных и секретных документов."
2002303-7 = "Сумма украденных денег невелика, а документы не имеют особой важности, но..."
2002303-8 = "Если станет известно, что вор может украсть имущество Бюро безопасности и уйти безнаказанным, доверие общества к Полицейской школе Валькирии пострадает."
2002303-9 = "Для подобных происшествий участие сотрудников Бюро общественного порядка необычно."
2002303-10 = "Однако в деле, способном подорвать доверие граждан, крайне важно задержать подозреваемого и вернуть украденное до того, как общественность узнает о преступлении."
2002303-11 = "Бюро общественного порядка получило сведения, что база подозреваемого находится в районе улицы Сунаомачи. Вероятно, он использует поддельную личность."
2002303-12 = "Подозреваемый — трёхцветный кот с короткими усами, загнутыми ушами и большим шрамом через один глаз— *шшк*"
2002303-13 = ""
2002303-16 = ""
2002303-18 = ""
2002303-20 = "Сенсей [USERNAME]...?"
2002303-21 = "Что привело вас сюда так поздно ночью?"
2002303-22 = "[s1] «Я слышал, что тебя отправили на наблюдение.»\n[s2] «Пришёл тебя поддержать!»"
2002303-25 = "Спасибо, но..."
2002303-26 = "Наблюдение не требует непосредственной поддержки. Учитывая время, вам лучше вернуться домой."
2002303-27 = "[s] «Я... буду мешать?»"
2002303-28 = "Напрямую — нет."
2002303-29 = "Но у вас и без того огромная нагрузка. Я не могу позволить себе втягивать вас в наблюдение, которому не видно конца."
2002303-30 = "Не хочу отвечать за то, что вы заболеете."
2002303-31 = "[ns] «Обещаю уйти домой, если слишком устану.»"
2002303-33 = "[ns3] «И вообще, одна голова хорошо, а две лучше, правда?»\n[ns4] «Я могу помочь заметить что-нибудь подозрительное.»"
2002303-36 = "...Если вы настаиваете."
2002303-37 = "Пока не будете слишком себя изматывать, можете остаться."
2002303-39 = "*шшк* Текущее время — 00:30. Видимость хорошая. Пока подозрительных лиц в районе не замечено."
2002303-40 = "Продолжаю наблюдение с текущей позиции. Сохраняю бдительность— *шшк*"
2002303-41 = ""
2002303-45 = ""
2002303-47 = "[ns] «...Прости. Я не успел поужинать...»"
2002303-48 = "Ничего страшного. Я тоже не ужинала."
2002303-49 = "Если вы голодны, поблизости есть несколько круглосуточных магазинов."
2002303-50 = "Или, поскольку в такое время больше ничего не работает, можете вернуться в Шале—"
2002303-51 = "[s] «Тебе что-нибудь нужно?»"
2002303-52 = "Нет. Во время наблюдения я никогда не ем."
2002303-53 = "Нам выделяют бюджет на провизию, но я не могу позволить еде мешать полноценному наблюдению."
2002303-54 = "Чтобы не заснуть, мне достаточно двух стаканов крепкого чёрного кофе."
2002303-55 = "Так что обо мне не переживайте. И не спешите. Если вам нужно отдохнуть—"
2002303-56 = "[s] «Я скоро вернусь.»"
2002303-57 = "Конечно."
2002303-58 = ""
2002303-63 = ""
2002303-64 = ""
2002303-66 = "...Вы вернулись быстрее, чем я ожидала."
2002303-67 = "Уверена, завтра у вас будет много работы. Почему вы так настойчиво хотите помогать?"
2002303-68 = "И что в этом пакете?"
2002303-69 = "[s5] «Я купил достаточно на двоих.»\n[s6] «Булочки с красной фасолью и молоко для нас обоих!»"
2002303-72 = "Хаха... Булочки с красной фасолью?"
2002303-73 = "Классическая еда для наблюдения..."
2002303-74 = "Но я откажусь. Ешьте сами."
2002303-75 = "[s7] «Почему?!»\n[s8] «Ты не любишь булочки с красной фасолью?»"
2002303-78 = "Нормально отношусь. Дело не во вкусе."
2002303-79 = "В такое время суток, если я наемся, есть риск уснуть."
2002303-80 = "Если я, студент Полицейской школы Валькирии, переем, усну и упущу преступника, стану посмешищем всего Кивотоса."
2002303-81 = "Так что я ценю ваш жест, но всё равно откажусь."
2002303-82 = ""
2002303-87 = "Я решил попробовать ещё раз, но..."
2002303-89 = "Сенсей? Я думала, теперь вы уже пойдёте домой..."
2002303-90 = "Что вы принесли на этот раз? Пончики на случай, если я проголодаюсь?"
2002303-91 = "Как я уже сказала, во время наблюдения я не ем."
2002303-92 = "Поэтому и это не приму."
2002303-94 = "Этот запах... Вы купили ещё что-то?"
2002303-95 = "...Гамбургер? Просто... зачем?"
2002303-96 = "Фильм? Вы видели фильм, где детективы ели гамбургеры во время наблюдения?"
2002303-97 = "Но это же выдумка. Очевидно. И, как я уже неоднократно говорила—"
2002303-98 = "Не знаю, чего вы пытаетесь добиться, но, пожалуйста, прекратите. Если подозреваемый заметит, что вы слишком часто приходите и уходите, это может вызвать подозрение, и он сбежит."
2002303-100 = "Что на этот раз?"
2002303-101 = "[s9] «Якисоба!»\n[s10] «Какое наблюдение без лапши!»"
2002303-104 = ""
2002303-106 = ""
2002303-108 = "Ни за что."
2002303-109 = "Я никак не могу есть настолько жирную и ароматную еду во время наблюдения."
2002303-111 = "На каждую мою попытку следовало решительное «нет»."
2002303-113 = "Сенсей. Почему вы так упорно продолжаете мешать?"
2002303-114 = "Если вы и дальше будете препятствовать операции..."
2002303-115 = "Мне не останется ничего другого, кроме как арестовать вас за воспрепятствование правосудию."
2002303-116 = "[s11] «Я-Я вовсе не хотел тебе мешать!»\n[s12] «Просто не хотел, чтобы ты пропускала еду из-за работы.»"
2002303-119 = "Это всего один приём пищи. Не так уж важно."
2002303-120 = "Конечно, я понимаю, что нерегулярное питание вредит здоровью, но иногда приходится ставить другие вещи выше."
2002303-121 = "Для сотрудника полиции нет ничего важнее задержания преступника."
2002303-122 = "[s] «Твоё здоровье важнее!»"
2002303-123 = "Серьёзно?"
2002303-124 = "[s13] «Если подведёт здоровье, ты вообще никого не сможешь поймать.»\n[s14] «Еда всегда должна быть в приоритете.»"
2002303-127 = "*вздыхает*"
2002303-128 = "Раз уж вы явно не собираетесь сдаваться, я съем одну булочку с красной фасолью."
2002303-129 = "Вы действительно раздражаете меня сразу во многих смыслах."
2002303-130 = "И где вы вообще нашли всю эту еду?"
2002303-131 = "Этот логотип не принадлежит ни одному из ближайших магазинов. И еда похожа на заказ из ресторана."
2002303-132 = "Но в такое время ни один ресторан поблизости уже не должен работать."
2002303-133 = "[s] «Я купил это в уличной палатке неподалёку.»"
2002303-134 = "Уличная палатка посреди ночи на улице, где почти нет прохожих?"
2002303-135 = "Да. Я бы так сказала."
2002303-136 = "Сенсей, помните, как выглядел продавец в этой палатке?"
2002303-137 = "[s] «Трёхцветный кот со шрамом через один глаз. А, ещё с загнутыми ушами.»"
2002303-138 = ""
2002303-140 = ""
2002303-142 = "Это подозреваемый!"
2002303-143 = "Сенсей, ведите меня к этой палатке!"
2002303-147 = "Канна нашла преступника у подставной уличной палатки и немедленно его арестовала."
2002303-148 = "Но даже после успешного завершения операции она так и не взяла ничего из еды."
2002303-149 = "К счастью, еды у меня осталось по-настоящему огромное количество, и другие дежурившие студенты Полицейской школы с радостью её разобрали."
