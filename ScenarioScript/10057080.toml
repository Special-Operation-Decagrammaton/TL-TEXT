[translation]
10057080-1 = "Episode 8;Joy and Worry"
10057080-3 = "[log]Until the Tank Race Qualifiers[/log]"
10057080-5 = "[log]D-1[/log]"
10057080-27 = "[log]Tank Race Qualifiers[/log]"
10057080-29 = "[log]D-Day[/log]"
10057080-32 = "It’s finally here..."
10057080-36 = "Qualifiers Day!!!"
10057080-40 = "Clap, clap, clap."
10057080-41 = "[s] \"Clap, clap, clap.\""
10057080-42 = "You could at least clap with your hands instead of just saying it! You too, Sensei!"
10057080-43 = "My hands are frozen, so no thanks."
10057080-44 = "[s] \"It's so cold today...\""
10057080-45 = "Well, that's true. Even the metal is so cold it hurts to touch... Last night's work was tough..."
10057080-46 = "The heater went out by morning, too. I feel like I'm going to catch a cold..."
10057080-47 = "Anyway, we managed to make it in time for the qualifiers! Great work, everyone!"
10057080-48 = "Especially you, Anna! Good job."
10057080-55 = "Huh? O-oh, yeah! Ahaha... it wasn't that big of a deal..."
10057080-56 = "Alright, now I'll finally show Sensei the finished product! Mouth-drum, start!"
10057080-61 = "Badum-badum-badum-badum!"
10057080-62 = "Badum-badum-badum-badum..."
10057080-63 = "[s] \"Badum-badum-badum-badum!\""
10057080-67 = "Ta-da!!"
10057080-75 = "[ns] \"Oh! Wow!! Huh? Wow!!!\""
10057080-77 = "[ns] \"Wait... is that what a tank is supposed to look like?\""
10057080-78 = "How rude!"
10057080-79 = "—is what I'd like to say. Ugh, I knew it would end up like this..."
10057080-80 = "We didn't have enough parts for a standard rotating turret."
10057080-81 = "So we decided to fix the cannon in place! It doesn't even have basic armor, but... it's a tank, technically!"
10057080-85 = "B-but! We did everything we could! The phosphate coating for rust prevention is perfect!"
10057080-86 = "It follows all the race regulations, so there's no issue with our eligibility."
10057080-87 = "If there's no turret, we can just turn the whole chassis."
10057080-88 = "Anyway, it's finished, so everything is A-OK!"
10057080-89 = "We even named it! It's called the 'Puppy'!"
10057080-90 = "[s] \"There are... a lot of things attached to the chassis.\""
10057080-91 = "Looks cool, right? I picked these up at the junkyard!"
10057080-92 = "I saw these parts for the first time and wondered what they were, then I found them in an article I'd saved!"
10057080-93 = "They were attached to a confiscated biker gang's car, so I'm pretty sure they're for speed!"
10057080-94 = "This must be the secret to our speed!"
10057080-95 = "Just looking at it gets me excited, so it should help with morale too!"
10057080-96 = "[s] (Watches Erina and the others happily)"
10057080-100 = "Oh, right! We need to test it immediately!"
10057080-101 = "Anna, our tank expert! Please, do the honors!"
10057080-107 = "O-okay..."
10057080-111 = "First, exterior check. Checking the tightness of the bolts and nuts on the chassis..."
10057080-112 = "2, 4, 6... Yep! No problems!"
10057080-113 = "...Next, checking the shell loading status and the sight."
10057080-117 = "Check, no issues! The scale is a bit off, but I'll fix that once we get to the venue."
10057080-122 = "Aren't you a bit too nervous? It'll go fine, don't worry!"
10057080-123 = "Yeah... ahaha..."
10057080-124 = "...Checking hydraulic and electrical systems. Rana, please."
10057080-130 = "Hydraulics, normal. Voltage is..."
10057080-134 = "Something's wrong. It's rated for 12 volts, but it's reading 11.2."
10057080-135 = "What!? What does that mean?"
10057080-136 = "The engine won't start below 11.6 volts."
10057080-142 = "You're kidding! So what do we do?"
10057080-143 = "We just need to switch to the backup battery."
10057080-149 = "A system without a backup isn't a system. That's why I set up a redundant configuration."
10057080-153 = "Yep. 14.3 volts. It's overcharged, but that's fine."
10057080-154 = "Y-you scared me, geez."
10057080-155 = "You're overreacting."
10057080-157 = "..."
10057080-158 = "If we have time, let's stop by the downtown area to warm up the engine! We need to get some sugar at a cafe, too! Hehe, maybe we can look at some clothes?"
10057080-162 = "Oh, sure."
10057080-163 = "And let's show it off to everyone while we're at it! Don't you think they'll be surprised when we tell them we made it out of scrap?"
10057080-164 = "You want them to say, 'Niki Anna, you're amazing,' right?"
10057080-165 = "Yeah, I guess..."
10057080-166 = "Your energy is so low! Fine, fine! We'll go downtown after the qualifiers!"
10057080-167 = "Alright, let's continue the check! Next is—"
10057080-171 = "...Hey, is there still more to check? We're going to be late, let's go!"
10057080-172 = "I think we should check a little more..."
10057080-173 = "We checked the whole list, didn't we? All that's left is to start the engine!"
10057080-174 = "But just in case, let's do it one more time from the beginning..."
10057080-175 = "You're usually so confident, what's gotten into you?"
10057080-176 = "Don't worry! We made this together, right? Have more confidence!"
10057080-177 = "Of course! If we win this, we can say goodbye to Anna and this snowy mountain wilderness! Yahoo!"
10057080-178 = "Where should we go if we pass the qualifiers? Znamya Cafe? No, maybe clothes first!"
10057080-179 = "That's not what I meant, I mean..."
10057080-180 = "Oh, sorry! I forgot!"
10057080-181 = "Rana! Start the engine! I want to hear this monster roar!!"
10057080-183 = "Roar, roar."
10057080-191 = "Huh?"
10057080-192 = "The engine won't start? Try it again!"
10057080-199 = "W-what's wrong? Another battery issue?"
10057080-200 = "It's not a battery issue—"
10057080-205 = "There's no fuel."
10057080-209 = "Oh no! I forgot to add 'Refuel' to the list!"
10057080-210 = "Anna, that was your job! Hurry up and put some fuel in!"
10057080-216 = "...If I knew this would happen, I should have had more confidence."
10057080-217 = "Huh? What?"
10057080-218 = "We don't have time! Where's the fuel?"
10057080-226 = "...!"
10057080-231 = "It's over there."
10057080-235 = "...In the heater."