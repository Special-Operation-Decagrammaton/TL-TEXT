[translation]
10057080-1 = "Episode 8; Joy and Unease"
10057080-3 = "[log]Tank race qualifiers[/log]"
10057080-5 = "[log]D-1[/log]"
10057080-27 = "[log]Tank race qualifiers[/log]"
10057080-29 = "[log]D-Day[/log]"
10057080-32 = "At last, the time has come..."
10057080-36 = "Today's the qualifiers!!"
10057080-40 = "Clap clap clap."
10057080-41 = "[s] \"Clap clap clap.\""
10057080-42 = "At least clap with your hands, not your mouth! Sensei, you too!"
10057080-43 = "My hands are frozen, so I'd rather not."
10057080-44 = "[s] \"It's really cold today...\""
10057080-45 = "Meh, you're right. It's so cold that it huuurts when you touch metal. #nIt was a real struggle working last night..."
10057080-46 = "The heater ran outta gas earlier this morning too. Feel like I've got a cold comin'#non..."
10057080-47 = "Anyway, we somehow finished in time for the qualifiers! Awesome job, everyone!"
10057080-48 = "Especially you, Anna! Great job."
10057080-55 = "Huh? Y-yeah! Aahah... It wasn't that big of a deal..."
10057080-56 = "'Kay, Sensei. This time, I introduce you to absolute peeerfection! #nDrumroll please!"
10057080-61 = "Dun dun dun dun dun!"
10057080-62 = "Dun dun dun dun dunnn."
10057080-63 = "[s] \"Dun dun dun dun dunnn!\""
10057080-67 = "Tadaaaa!!"
10057080-75 = "[ns] \"Whoaa! Wow!! Wha- wow!!!\""
10057080-77 = "[ns] \"Huh...? Is this... what a tank looks like?\""
10057080-78 = "Rude!!"
10057080-79 = "―I just wanted to try saying that, actually. #nBut ugh, I knew it would end up like this..."
10057080-80 = "We couldn't do a typical rotating turret because we didn't have enough parts for#nthat."
10057080-81 = "So, we decided to fixed the gun in place instead! #nIt has like no armor, not even in the slightest... But, it IS still tank!"
10057080-85 = "I-in our defense! We did everything we possibly could! #nEven the phosphatization anti-rust treatment is perfect!"
10057080-86 = "We made sure to comply with the regulations, so there should no problems#nparticipating in the race."
10057080-87 = "If the turret cannot rotate, we simply have to rotate the entire hull."
10057080-88 = "Anyway, as long as we finished, everything's A-OK!"
10057080-89 = "I've even thought of a name for it! I present to you, Puppy!"
10057080-90 = "[s] \"Seems you've put quite a few… things on tank.\""
10057080-91 = "It's cool, right!? It's all stuff that we salvaged from the scrapyard!"
10057080-92 = "I was reaaally confused what these parts were at first, #nbut then I remembered I had a clipping that mentioned them!"
10057080-93 = "They were originally on a vehicle seized from some delinquent biker, #nso I'm assuming they make things go fast!"
10057080-94 = "I'm sure this is the secret to going fast!"
10057080-95 = "Just looking at it's making me excited too! Hoping that means it also boosts#nmorale!"
10057080-96 = "[s] (Watch over Erina and the others having fun.)"
10057080-100 = "Ah, right! We gotta hurry up and give this thing a test!"
10057080-101 = "Anna-san, our tank expert! Start the test for us please!"
10057080-107 = "G-got it…"
10057080-111 = "We'll check the exterior first. Check the tightness of every nut and bolt on the#nhull…"
10057080-112 = "2, 4, 6… Yep! All green!"
10057080-113 = "…Next, confirm that all shells have been loaded and the condition of the sights."
10057080-117 = "Confirmed! Everything is normal! The reticle isn't quite calibrated, but we can fix#nthat on-site."
10057080-122 = "Hey, you're being an actual worrywart here. It'll go well, so stop stressing out!"
10057080-123 = "Yeah... Ahaha..."
10057080-124 = "…Hydraulic and electrical systems. Rana, if you would."
10057080-130 = "Hydraulics, normal. Voltage..."
10057080-134 = "Odd. This is rated for 12 volts, but it's only reading 11.2 volts."
10057080-135 = "Huh!? So, what does that mean?"
10057080-136 = "The engine will not start if the voltage is under 11.6 volts."
10057080-142 = "You're kidding!? What should we do then?"
10057080-143 = "All we have to do is replace the battery with the spare."
10057080-149 = "A system without any backups cannot be called a proper system. That is why we#nincoporated redundancies."
10057080-153 = "Good. 14.3 volts. It is overcharged, but that shouldn't pose any problems."
10057080-154 = "I-I thought my heart was gonna stop! Gosh..."
10057080-155 = "You're overreacting."
10057080-157 = "..."
10057080-158 = "Since we've got time to spare, let's drive to the shopping district to get the engine warmed up! #nWe gotta hit up a cafe to get our sugar levels topped up! Ehehe, or maybe we could look at some#nclothes."
10057080-162 = "Ah, sure."
10057080-163 = "How 'bout we go show off our baby to everyone while we're at it!? #nYou think their jaws will drop if we tell them it's made all out of junk?"
10057080-164 = "Don't you want people to go all like, \"Wow, Niki Anna! You're amaaazing!\""
10057080-165 = "Yeah, that's true..."
10057080-166 = "Absoluuutely no enthusiasm! Alright, alright! We can save the shopping district#ntrip for later!"
10057080-167 = "'Kay, then let's keep the checks going. Next is..."
10057080-171 = "...Hey, is there even anything left to check? #nWe're gonna be late! Let's hurry up and roll out already!"
10057080-172 = "I think we should keep checking a little longer..."
10057080-173 = "We've already gone through the whole list, y'know? All that's left is to start up the engine!"
10057080-174 = "But to be safe, we should go over the list again one last time..."
10057080-175 = "You're usually so full of confidence. What's up with you right now?"
10057080-176 = "Stop worrying so much! This is something the three of us made TOGETHER!#nHave a bit more confidence!"
10057080-177 = "BUT! Of course, once we take home the trophy, #nit's sayonara to both you and these mountains full of a whole lotta nothin' but#nsnow! Wahoo!"
10057080-178 = "Wonder where we should go after the qualifiers are done? #nIt's gotta be Znamya Cafe, right? Or no, maybe we go clothes shopping first!?"
10057080-179 = "That's not what I meant. I mean to say..."
10057080-180 = "Ah, sorry! I forgot!"
10057080-181 = "Rana, start up the engine! Let's hear this monster roar!!"
10057080-183 = "Raaawr."
10057080-191 = "Huh?"
10057080-192 = "The engine's not starting? Try it again!"
10057080-199 = "Wh-why isn't it working? Is it more battery issues?"
10057080-200 = "This isn't a problem with the batteries."
10057080-205 = "There's no fuel."
10057080-209 = "Whoopsies! We forgot to put fueling on the checklist!"
10057080-210 = "Anna, you were in charge of the fuel! Hurry up and put some in!"
10057080-216 = "...I should've been more confident if I'd known it would go this well."
10057080-217 = "Huh? What?"
10057080-218 = "We don't have time! Where's the fuel?"
10057080-226 = "...!"
10057080-231 = "It's there."
10057080-235 = "...In the heater."