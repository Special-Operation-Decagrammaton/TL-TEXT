[translation]
10057080-1 = "Episode 8;Joy and Worry"
10057080-3 = "[log]Until the Tank Race Preliminaries[/log]"
10057080-5 = "[log]D-1[/log]"
10057080-27 = "[log]Tank Race Preliminaries[/log]"
10057080-29 = "[log]D-Day[/log]"
10057080-32 = "It is finally here..."
10057080-36 = "The preliminaries are today!!!"
10057080-40 = "Clap, clap, clap."
10057080-41 = "[s] \"Clap, clap, clap.\""
10057080-42 = "At least clap with your mouth if you are not going to do it with your hands, Sensei!"
10057080-43 = "My hands are freezing, so I am passing."
10057080-44 = "[s] \"It is just so cold today...\""
10057080-45 = "Well, true. Even the metal is cold enough to hurt when you touch it.#nWorking last night was so tough..."
10057080-46 = "The stove went out by morning, and I feel like I am going to catch a cold..."
10057080-47 = "Anyway, we somehow made it in time for the preliminaries! Good work, everyone!"
10057080-48 = "Especially you, Anna! Great job."
10057080-55 = "Huh? Y-Yeah! Ahaha... It is not really that big a deal..."
10057080-56 = "Now, it is finally time to show Sensei our masterpiece!#nDrum roll, start!"
10057080-61 = "Ba-dum, ba-dum, ba-dum!"
10057080-62 = "Ba-dum, ba-dum, ba-dum-dum."
10057080-63 = "[s] \"Ba-dum, ba-dum, ba-dum-dum!\""
10057080-67 = "Ta-da!!"
10057080-75 = "[ns] \"Oh! Wow!! Huh? Wow!!!\""
10057080-77 = "[ns] \"Wait...? Is this what a tank is supposed to look like...?\""
10057080-78 = "Rude!!"
10057080-79 = "Or so I tried to say.#nUgh, of course it turned out like this..."
10057080-80 = "We did not have enough parts for a standard rotating turret."
10057080-81 = "So we decided to fix the cannon in place!#nIt does not even have basic armor, but... it is a tank, sort of!"
10057080-85 = "B-But! We did everything we could, you know?!#nOur rust prevention treatment with phosphate film is flawless!"
10057080-86 = "It complies with the race regulations, so there are no issues with our eligibility."
10057080-87 = "If we do not have a turret, we can just turn the whole body."
10057080-88 = "Anyway, it is finished, so all is well!"
10057080-89 = "We even decided on a name! Appropriately named Puppy!"
10057080-90 = "[s] \"There is... quite a lot attached to the body.\""
10057080-91 = "Cool, right? We picked up some stuff from the junkyard and attached it!"
10057080-92 = "I saw a part I had never seen before and wondered what it was, but#nit was featured in an article I scrapped!"
10057080-93 = "It was attached to a street racer's car that got busted, so#nI am pretty sure it is for speeding up!"
10057080-94 = "This must be the secret to our speed!"
10057080-95 = "Just looking at it gets us hyped up, so we can expect a boost in morale too!"
10057080-96 = "[s] (Watches Elina and the others, looking amused)"
10057080-100 = "Ah, right! We need to test it out right away!"
10057080-101 = "Anna, our tank expert! If you please!"
10057080-107 = "Y-Yeah..."
10057080-111 = "First, a visual check. Checking the tightness of the bolts and nuts on the chassis..."
10057080-112 = "2, 4, 6... Yup! No problems!"
10057080-113 = "...Next, check the shell loading status and the sight."
10057080-117 = "Checked, no abnormalities! I will fix the slightly misaligned scale once we get to the venue."
10057080-122 = "Aren't you a little too nervous? It will be fine, nothing to worry about!"
10057080-123 = "Yeah... ahaha..."
10057080-124 = "...Checking the hydraulic and electrical systems. Lana, please."
10057080-130 = "Hydraulics, normal. Voltage is..."
10057080-134 = "Strange. The rating is 12 volts, but it is showing 11.2 volts."
10057080-135 = "Huh?! Wait, what does that mean?"
10057080-136 = "The engine will not start if it is below 11.6 volts."
10057080-142 = "No way?! Then what do we do?"
10057080-143 = "We just switch to the backup battery."
10057080-149 = "A system without a backup is not a system. That is why we set up redundancy."
10057080-153 = "Yup. 14.3 volts. Overcharged, but no problem."
10057080-154 = "G-Gave me a scare, jeez..."
10057080-155 = "You are overreacting."
10057080-157 = "..."
10057080-158 = "If we have time to spare, let us drop by the shopping district to warm up the engine!#nWe need to refuel with some sugar at a cafe too! Hehe, maybe look at some clothes?"
10057080-162 = "Oh, yeah."
10057080-163 = "Let us brag to everyone while we are at it!#nDon't you think they will be shocked when we tell them we made it out of junk?"
10057080-164 = "Don't you want them to say, 'Niki Anna, you're amazing'?"
10057080-165 = "Yeah, sure..."
10057080-166 = "Low energy! Fine, fine! We are going to the shopping district after the preliminaries are over!"
10057080-167 = "Now, let us continue the check! Next is--"
10057080-171 = "...Hey, is there more to check?#nWe are going to be late, so let us get going!"
10057080-172 = "I think we should check a little more..."
10057080-173 = "We checked the whole list, didn't we? All that is left is to start the engine!"
10057080-174 = "Just to be safe, from the beginning, one more time..."
10057080-175 = "You are usually so confident, what's gotten into you all of a sudden?"
10057080-176 = "There is nothing to worry about! We made this together by combining our strengths! Have more confidence!"
10057080-177 = "Of course! If we win this, it is goodbye to Anna and#nthis snow-covered mountain, too! Yay!"
10057080-178 = "Where should we go if we pass the preliminaries?#nZnamya Cafe, obviously! No, clothes first!"
10057080-179 = "That is not what I meant, I mean..."
10057080-180 = "Ah, sorry! I forgot!"
10057080-181 = "Lana! Start the engine! I want to hear this monster roar!!"
10057080-183 = "Rawr rawr."
10057080-191 = "Huh?"
10057080-192 = "The engine won't start? Try it again!"
10057080-199 = "W-What's wrong? Another battery issue?"
10057080-200 = "It is not a battery problem--"
10057080-205 = "There is no fuel."
10057080-209 = "Oops! I forgot to put 'Fuel Injection' on the list!"
10057080-210 = "Anna, that was your job! Hurry up and put fuel in!"
10057080-216 = "...If it was going to come to this, I should have had more confidence."
10057080-217 = "Huh? What?"
10057080-218 = "We don't have time! Where is the fuel?"
10057080-226 = "...!"
10057080-231 = "Over there."
10057080-235 = "...In the stove."
