[translation]
10030070-1 = "Эпизод 7;Первый вид"
10030070-5 = "Ммм... *храп*"
10030070-6 = ""
10030070-9 = "Маки, пора вставать."
10030070-10 = "Мы же собирались вместе встретить первый рассвет года, помнишь?"
10030070-11 = ""
10030070-13 = ""
10030070-15 = ""
10030070-16 = "Ммм... Ещё десать минуточек..."
10030070-17 = "Прости, но если скоро не выйдем, рискуем пропустить рассвет."
10030070-18 = "Давай, вставай и готовь снаряжение к подъёму. Утром холодно, так что не забудь одеться теплее."
10030070-19 = "Ага..."
10030070-24 = ""
10030070-25 = "[ns1] «Доброе утро, Маки.»\n[ns2] «С Новым годом.»"
10030070-26 = "Доброе утро, Сенсей... *зевает*"
10030070-27 = "С Новым годом..."
10030070-28 = "...Сегодня правда первый день нового года, да?"
10030070-29 = "Обычно в новогоднюю ночь я не сплю до утра и ложусь уже после восхода, так что сейчас вставать как-то странно..."
10030070-30 = "Хотя, если подумать, я почти каждую ночь не сплю..."
10030070-31 = ""
10030070-36 = "...Ты тоже проснулась, Маки."
10030070-37 = "Доброе утро, Сенсей."
10030070-38 = "[s] «Доброе утро вам обеим.»"
10030070-39 = "*зевает* ...Спать хочется."
10030070-40 = "В такие моменты нужен энергетик с высоким содержанием кофеина..."
10030070-41 = "Я бы и сама сейчас не отказалась от энергетика..."
10030070-42 = ""
10030070-44 = ""
10030070-46 = "Энергетиков нет, но вот вам крепкий кофе."
10030070-47 = ""
10030070-49 = ""
10030070-50 = "Не забудьте взять шоколадный батончик или немного ореховой смеси, даже если сейчас не хочется есть. Для утреннего подъёма нужна энергия."
10030070-51 = "И если почувствуете себя плохо, сразу скажите мне или Сенсею. Хорошо?"
10030070-52 = ""
10030070-55 = ""
10030070-56 = "Есть, госпожа!"
10030070-58 = "Быстро сменив снаряжение, мы начали подъём к вершине."
10030070-63 = "*тяжело дышит* *тяжело дышит*"
10030070-64 = "Моя выносливость... уже закончилась..."
10030070-65 = "Так устала..."
10030070-66 = "Эй... До вершины ещё далеко?"
10030070-67 = ""
10030070-69 = ""
10030070-71 = "Мы прошли половину. Держитесь."
10030070-72 = ""
10030070-74 = ""
10030070-75 = "...Хотя погода немного беспокоит."
10030070-76 = "Если облака не разойдутся, мы можем не увидеть рассвет даже с вершины..."
10030070-77 = ""
10030070-80 = ""
10030070-82 = ""
10030070-83 = "Хм? Почему тот куст трясётся?"
10030070-84 = "Неужели это тот медведь со вчерашнего дня...?"
10030070-85 = "И-и-ик!"
10030070-86 = ""
10030070-88 = ""
10030070-93 = ""
10030070-95 = ""
10030070-100 = ""
10030070-101 = "О? Снова Веритас? И Тренер..."
10030070-102 = ""
10030070-104 = ""
10030070-106 = ""
10030070-107 = ""
10030070-108 = "А, Сумирэ. Привет!"
10030070-110 = "Здравствуйте, Маки. Не ожидала снова вас встретить."
10030070-111 = "Всех с Новым годом!"
10030070-112 = "[s] «С Новым годом, Сумирэ.»"
10030070-114 = "[ns] «Хорошо спала прошлой ночью?»"
10030070-115 = ""
10030070-117 = ""
10030070-118 = "Нет. Возможно, я слишком возбудилась из-за первой за долгое время тренировки на природе, но уснуть было трудно..."
10030070-119 = "Поэтому я решила немного пройтись, чтобы размяться."
10030070-120 = "После вчерашней лёгкой тренировки у меня осталось ещё полно энергии!"
10030070-121 = "Это вообще не было лёгкой тренировкой!"
10030070-122 = "Будто одного медведя было мало, мы несколько раз бежали спринтом вверх по сухому руслу вместо обычной тропы..."
10030070-123 = "Насколько же ты спортивная, Сумирэ?!"
10030070-124 = "Хи-хи. Тело может быть сильным лишь настолько, насколько позволяет дух."
10030070-125 = "Если продолжишь тренироваться со мной, не удивлюсь, если поставишь рекорд по хоум-ранам подряд!"
10030070-126 = ""
10030070-128 = ""
10030070-129 = "Хоум-раны один за другим... Рёв толпы, несущий меня через домашнюю базу словно великолепная волна... Тогда ничего не поделаешь."
10030070-130 = "Но я рада видеть, что вы все встали так рано и уже идёте в поход."
10030070-131 = "...Неужели вы тоже решили сделать физические упражнения своим новогодним обещанием?"
10030070-133 = "Упражнения находятся довольно низко в моём рейтинге увлечений..."
10030070-134 = "Но идея вице-президента встретить первый рассвет года оказалась лучше, чем я ожидала."
10030070-136 = "Верно, вы хотите посмотреть рассвет с вершины горы..."
10030070-137 = ""
10030070-139 = ""
10030070-140 = "Извините, но на этот раз, возможно, лучше вернуться."
10030070-141 = ""
10030070-143 = ""
10030070-144 = "Почему?!"
10030070-145 = "Сейчас ещё темно и плохо видно, но облака довольно плотные."
10030070-146 = "С такой облачностью вы, скорее всего, почти не увидите рассвет."
10030070-147 = "Мне бы не хотелось, чтобы вы поднялись до самой вершины, а потом ваши надежды рухнули с обрыва."
10030070-149 = "Но прогноз обещал солнечную погоду..."
10030070-150 = "[s] «Что будем делать?»"
10030070-151 = ""
10030070-153 = ""
10030070-154 = ""
10030070-155 = "...Что думаете?"
10030070-156 = "Я понимаю, что именно я настояла на этой поездке, но нет смысла силой тащиться к вершине, если погода против нас."
10030070-157 = ""
10030070-160 = ""
10030070-161 = ""
10030070-163 = ""
10030070-164 = ""
10030070-165 = "Я... хочу продолжить."
10030070-166 = "Ага. Я думала, ты захочешь вернуться—"
10030070-167 = ""
10030070-169 = ""
10030070-170 = "...А? Ты правда хочешь идти дальше?"
10030070-171 = "Ну, я всё-таки впервые за долгое время выбралась наружу. Можно уж воспользоваться шансом."
10030070-173 = "Мы зашли так далеко. Будет обидно повернуть назад, признав поражение, не добравшись до вершины."
10030070-174 = "Гринд в реальной жизни намного хуже, чем в игре, но..."
10030070-175 = "Нельзя выбрасывать файл сохранения прямо перед боссом!"
10030070-177 = "Но мы всё ещё только на полпути к вершине..."
10030070-178 = "Разве ты... не ненавидишь тяжёлую работу без награды?"
10030070-180 = "Ну да, будет обидно добраться наверх и не увидеть рассвет..."
10030070-181 = "Но в клубной комнате я могу посмотреть сколько угодно рассветов на мониторах."
10030070-182 = "Единственный опыт, который мы не можем воспроизвести, — это совместное восхождение на гору."
10030070-183 = ""
10030070-186 = ""
10030070-187 = ""
10030070-188 = "...Я сплю? Такими темпами мы доберёмся до вершины и увидим, как новогоднее солнце взойдёт на западе."
10030070-189 = "Вот это отличный настрой!"
10030070-190 = "Об этом часто забывают, но истинная ценность тренировки не в красивом теле. Она в дисциплине, которую прививают сами упражнения."
10030070-191 = "Точно так же лучшая часть восхождения — то, чему оно учит тебя о себе, а не вид с вершины!"
10030070-193 = "Ваш дух вдохновляет меня, Веритас! Клуб спортивных тренировок сопроводит вас до самой вершины!"
10030070-194 = "Рэй! Пора спринтом на вершину!"
10030070-195 = ""
10030070-197 = ""
10030070-198 = "П-Погоди! Ты же сказала, что сегодня мы будем тренироваться только на части подъёма, а не идти до самого верха!"
10030070-199 = ""
10030070-201 = ""
10030070-202 = ""
10030070-203 = ""
10030070-204 = ""
10030070-206 = "Подождите—!"
10030070-207 = ""
10030070-209 = ""
10030070-211 = "И убежали. Ну что, давайте и мы постараемся и вместе дойдём до вершины?"
10030070-212 = "До рассвета уже совсем немного..."
10030070-213 = ""
10030070-216 = ""
10030070-228 = "...Мы добрались."
10030070-229 = "Это вершина горы Хигасидакэ."
10030070-230 = ""
10030070-233 = "Ого, какой сильный ветер!"
10030070-234 = "На открытой вершине стало ещё холоднее..."
10030070-235 = "Облака хоть немного разошлись? В темноте сложно понять..."
10030070-237 = ""
10030070-238 = "Ну, не уверена, но..."
10030070-239 = ""
10030070-241 = ""
10030070-242 = "А, небо начинает светлеть."
10030070-243 = "Солнце наконец восходит?"
10030070-244 = ""
10030070-246 = ""
10030070-248 = ""
10030070-253 = "Ах..."
10030070-254 = "...Красиво."
10030070-255 = "Небо будто озаряют миллионы фейерверков после хоум-рана..."
10030070-256 = "Я видела записи рассветов, но вживую всё совершенно иначе..."
10030070-257 = "Он намного ярче, насыщеннее и..."
10030070-258 = "...Намного теплее."
10030070-262 = "Когда тяжёлый труд награждается таким видом, вдохновение ни с чем не сравнить."
10030070-263 = "...Рада, что пришла посмотреть вживую?"
10030070-264 = ""
10030070-267 = ""
10030070-268 = "Ага."
10030070-269 = "Оно того стоило."
10030070-270 = "Когда ты впервые предложила разбить лагерь ради рассвета, мне казалось, что это пустая трата времени..."
10030070-271 = "Но теперь я понимаю."
10030070-273 = "Я рада, что ты так думаешь."
10030070-274 = ""
10030070-276 = ""
10030070-277 = "...В жизни есть множество вещей, которые невозможно по-настоящему понять, пока не испытаешь самому."
10030070-278 = ""
10030070-281 = ""
10030070-283 = "Этот звук только что..."
10030070-284 = ""
10030070-287 = ""
10030070-288 = "Рэй, ты случайно не голодна?"
10030070-289 = "Э-Это... Ну..."
10030070-290 = "Я ничего не могу с собой поделать! Мы занимаемся кардио с самого раннего утра, конечно я голодна!"
10030070-292 = "Почему бы нам не вернуться в лагерь и не позавтракать вместе?"
10030070-293 = "Я взяла немного хлеба для быстрого завтрака."
10030070-294 = ""
10030070-297 = ""
10030070-298 = "[ns] «Джемом и маслом тоже хватит на всех.»"
10030070-300 = "О, я превращу хлеб в холст для шедевра из джема и масла!"
10030070-301 = "Мне достаточно просто кусочка хлеба с маслом..."
10030070-302 = "Я бы лучше выпила ещё чашку кофе. Или две."
10030070-304 = ""
10030070-305 = "Добавим протеиновый коктейль — и получится вполне хороший завтрак."
10030070-306 = "Да-да. Когда вернёмся в лагерь, каждый приготовит себе завтрак как хочет."
