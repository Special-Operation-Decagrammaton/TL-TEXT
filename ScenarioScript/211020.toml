[translation]
211020-1 = "Эпизод 2;Комитет по восстановлению Геенны"
211020-2 = ""
211020-3 = "А ты...?"
211020-4 = "Мы пришли положить конец вашим бессмысленным перебранкам."
211020-5 = "На вопрос она так и не ответила."
211020-8 = ""
211020-9 = "Ждите беды!"
211020-10 = "И беды вдвойне!"
211020-11 = "Чтобы вернуть Геенне утраченную гордость и возродить эпоху былого величия!"
211020-15 = "На сцену выходит Комитет по восстановлению Гееены!"
211020-16 = ""
211020-21 = "Яха! Кажется, теперь все немного успокоились. Подумать только, старшекурсники уже готовы были друг друга растерзать..."
211020-22 = "Мёраку Карен, заместитель председателя Комитета по восстановлению Геенны, к вашим услугам."
211020-25 = "Простите за переполох. Но радикальные перемены всегда сопровождаются потрясениями."
211020-26 = "Я Игараши Шоуко, секретарь Комитета по восстановлению Геенны."
211020-29 = "А я её скромный председатель, Фурихата Маюми! Рада знакомству!"
211020-31 = ""
211020-32 = "«Возрождение»...? Вы хотите возродить культуру Геенны?"
211020-33 = ""
211020-35 = ""
211020-37 = ""
211020-38 = "Да! Именно так!"
211020-39 = "Кихе! Какие же вы амбициозные! У наших младших товарищей поразительный боевой дух."
211020-40 = "И всё же... одна вещь не даёт мне покоя."
211020-41 = "Вы говорите так, будто Геенна сейчас не процветает."
211020-42 = "С чего вы вообще это взяли?"
211020-43 = ""
211020-45 = ""
211020-46 = ""
211020-47 = ""
211020-48 = ""
211020-49 = "«С чего», говорите...?"
211020-50 = "Да потому что..."
211020-51 = ""
211020-53 = ""
211020-54 = "Нынешняя Геенна совсем НЕ процветает!"
211020-55 = "Простите?! Что вы хотите этим сказать?!"
211020-56 = "Именно то, что сказали, уважаемая председатель. Нынешней Геенне далеко до былого величия. Её положение даже «приемлемым» не назовёшь."
211020-57 = "Вздор! Если при моём правлении Геенна не величественна, то что же тогда вообще можно назвать величественным?!"
211020-58 = "В этом-то и проблема!"
211020-59 = "Что?!"
211020-60 = ""
211020-62 = ""
211020-63 = "Она права. Именно на это мы и хотим указать."
211020-64 = "Сегодня Геенна стала посмешищем для всего Кивотоса. Её считают сборищем хулиганов и неудачников."
211020-65 = "Но раньше Геенна была другой. Её уважали, у неё была славная история."
211020-66 = "Наша великая академия распространяла своё влияние по всему Кивотосу. Другие академии и боялись Геенну, и восхищались ею."
211020-67 = "А теперь все школы и студенты считают нас нарушителями порядка. Чуть ли не людьми второго сорта!"
211020-68 = "И неудивительно! Здесь нет ни дисциплины, ни единства, ни гордости за свою академию! Один сплошной хаос."
211020-69 = "Председатель Макото и члены Общества Пандемониум, я официально заявляю..."
211020-70 = "Именно вы виноваты в плачевном состоянии Геенны!"
211020-71 = "Ц-ц!!!"
211020-72 = "Это..."
211020-73 = "Общество Пандемониум. Вы, лучшие из нас, представляете студентов Геенны, но отреклись от своих обязанностей."
211020-74 = "Вы превратились в шайку, которая пользуется безразличием студентов и разбазаривает бюджет на нелепые инициативы."
211020-75 = "Ну, большую часть времени. Но иногда... очень редко, КРАЙНЕ редко мы всё-таки..."
211020-76 = "«Редко» недостаточно! Вы должны ВСЕГДА трудиться на благо академии!"
211020-77 = "Чаще кажется, будто вам важнее изводить команду Префектов, чем помогать нам, студентам."
211020-78 = "Ну, этим занимается только Макото..."
211020-79 = "Вы растрачиваете скудный бюджет и не выделяете деньги на действительно важные нужды! Из-за вас Геенна утратила свою конкурентоспособность!"
211020-80 = "И это ещё не всё. С тех пор как сорвался Эдемский договор, мы даже официально не ВЫРАЖАЛИ несогласия с Тринити!"
211020-81 = "Мы поставили на первое место соглашение с Шале..."
211020-82 = "Но в итоге выходит, что Геенна просто отступила! Мы потеряли своё влияние!"
211020-83 = "Этого вы хотите, председатель? Разве так поступает способный и великодушный лидер?"
211020-84 = "Ц-ц... Да вы издеваетесь надо мной...?!"
211020-85 = ""
211020-87 = ""
211020-88 = ""
211020-89 = "Ну, вот ЭТО уже что-то новенькое...!"
211020-90 = "Команда Префектов, вы тоже часть проблемы."
211020-91 = "Что?"
211020-92 = "Команда Префектов должна поддерживать дисциплину и общественный порядок в академии Геенна."
211020-93 = "Но в народе ГОВОРЯТ, что все вы, кроме главы Префектов, только мешаетесь под ногами."
211020-94 = "Что?! Да как ты смеешь...!"
211020-95 = "Но я с этим не согласна."
211020-96 = "А...?"
211020-97 = "Даже без главы команда Префектов остаётся сильнейшей вооружённой силой Геенны. В этом я нисколько не сомневаюсь."
211020-98 = "И тем не менее!"
211020-99 = "Обладая такой силой, вы лишь гоняете мелких хулиганов да ссоритесь с Обществом Пандемониум."
211020-100 = "Нет, мы всегда сначала стараемся уладить конфликт миром. Насилие... то есть применение необходимой силы идёт уже потом!"
211020-101 = "Яха! Ты не поняла, о чём мы!"
211020-102 = "Мы говорим, что вы тоже виноваты в том, что академия с безграничным потенциалом так и не смогла объединиться!"
211020-103 = "В чём цель команды Префектов? Поддерживать тот сомнительный порядок... который существует сейчас и уже давно?"
211020-104 = "Или вы только изображаете из себя «Команду Префектов», когда вам попадаются непокорные студенты?"
211020-105 = "Что...? «Изображаем»?!"
211020-106 = "Возможно, Карен выражается резко, но она права! Команда Префектов не сумела как следует справиться ни с одной задачей!"
211020-107 = "Зачем эти полумеры? Почему не проявить инициативу и не добиться настоящих перемен?"
211020-108 = ""
211020-110 = ""
211020-112 = "Я могу ответить на этот вопрос."
211020-113 = "Г-глава Префектов..."
211020-114 = "Глава...!"
211020-115 = "«Полумеры»... Возможно, со стороны это выглядит именно так."
211020-116 = ""
211020-118 = ""
211020-119 = "Я считаю, что мы успешно справляемся со своей задачей. Иногда необходимо оставлять место неопределённости и неоднозначности."
211020-120 = ""
211020-122 = ""
211020-123 = "Похоже, вы хотите, чтобы мы установили жёсткий порядок и дисциплину."
211020-124 = "На словах это звучит неплохо, но не такую Геенну мы пытаемся построить."
211020-125 = "Ведь наша цель — свободная Геенна."
211020-126 = "Это красиво лишь на словах. Ты говоришь так, будто свобода всегда идёт во благо."
211020-127 = "В современной Геенне свобода уже давно выродилась во вседозволенность."
211020-128 = "Именно поэтому существует команда Префектов. Мы проводим черту, которую нельзя переступать."
211020-129 = "Тому, кто захочет её пересечь, придётся сначала пройти через нас. И мы не отступим."
211020-130 = "..."
211020-131 = ""
211020-133 = ""
211020-134 = ""
211020-135 = "Х-хмф... Одним позёрством круче не станешь..."
211020-136 = "Глава Префектов, если подытожить..."
211020-137 = "Команда Префектов намерена и впредь придерживаться своей расплывчатой позиции. Неоднозначной, но авторитетной. Я правильно понимаю?"
211020-138 = "Проще говоря, да."
211020-139 = "Вот её ответ, председатель."
211020-140 = "Да. Я слышала."
211020-141 = "Я поняла позицию Префектуры! И Общества Пандемониума тоже!"
211020-142 = "Значит, никто не хочет объединить Геенну."
211020-143 = "Тогда нам больше не о чем говорить! Раз проблема ясна, осталось только её решить!"
211020-144 = "И что вы собираетесь делать?"
211020-145 = ""
211020-147 = ""
211020-148 = ""
211020-149 = ""
211020-150 = "Чтобы объединить Геенну..."
211020-151 = ""
211020-153 = ""
211020-154 = "Мы предпримем всё, что потребуется!"
211020-155 = ""
211020-157 = ""
211020-158 = ""
211020-159 = ""
211020-160 = "Например...?"
211020-161 = "Я не очень умею объяснять, так что сейчас не могу раскрыть все подробности..."
211020-162 = "Но просто наблюдайте за тем, что мы собираемся сделать!"
211020-163 = "Ведь именно здесь начнётся возрождение Геенны!"
211020-164 = ""
211020-166 = ""
211020-167 = ""
211020-168 = ""
211020-169 = ""
211020-170 = ""
211020-171 = ""
211020-172 = "...Какие энергичные младшекурсники."
211020-173 = "Хмф... Рвения им не занимать, но за ним стоят одни пустые слова."
211020-174 = "У них нет ни навыков, ни опыта. Как ни старайся, им никогда не пошатнуть незыблемое положение меня, великой Макото! Кихехе!"
211020-175 = ""
211020-177 = ""
211020-178 = ""
211020-179 = ""
211020-180 = "П-похоже, начинается что-то интересное!"
211020-182 = "Следующий эпизод;Слава Геенне!"
