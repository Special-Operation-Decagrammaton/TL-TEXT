[translation]
211020-1 = "Episode 2;Gehenna Revitalization Committee"
211020-3 = "Who are you people...?"
211020-4 = "Senpai, you should stop with the pointless fighting."
211020-5 = "Who are you people...?"
211020-9 = "If you're asking for our names—"
211020-10 = "We shall enlighten you!"
211020-11 = "We are the standard-bearers of revolution, here to reclaim Gehenna's pride and usher in a new golden age!"
211020-15 = "The Gehenna Revitalization Committee—has arrived!!"
211020-21 = "Yay, everyone's gone quiet."
211020-22 = "I'm Karen Myouraku.#nThe Vice-Chair of the Gehenna Revitalization Committee."
211020-25 = "Apologies for the noise.#nHowever, change is always accompanied by shock—"
211020-26 = "I am Shoko Igarashi, the Secretary of the Gehenna Revitalization Committee."
211020-29 = "And I am the Chair, Mayumi Furihata! Nice to meet you!"
211020-32 = "Revitalization... does that mean you intend to make Gehenna strong again?"
211020-38 = "Exactly!"
211020-39 = "Heh-heh-heh! That ambition is truly bold! You juniors have some backbone."
211020-40 = "But—I cannot let that slide."
211020-41 = "Gehenna is still plenty proud as it is. It would be no exaggeration to call it the greatest."
211020-42 = "...Why do you think it needs to be 'again'?"
211020-49 = "That is because—"
211020-50 = "Obviously—"
211020-54 = "Because the current Gehenna isn't great!"
211020-55 = "What did you say?"
211020-56 = "I mean, the current Gehenna just isn't cool."
211020-57 = "Nonsense! Are you saying that Gehenna, ruled by Lord Makoto, is not great?"
211020-58 = "Yes!"
211020-59 = "Whaaaat!?"
211020-63 = "That is precisely the point we wish to make."
211020-64 = "Gehenna is the laughingstock of Kivotos. We've been branded as a dumping ground for problem children."
211020-65 = "But the Gehenna of the past was different."
211020-66 = "Our ambitions spread across all of Kivotos, and every academy feared and respected Gehenna."
211020-67 = "Just being from Gehenna gets you treated like a delinquent wherever you go."
211020-68 = "There is no order! No discipline! All that exists is a chaotic school culture."
211020-69 = "The reason Gehenna ended up like this is—"
211020-70 = "It's all the fault of Chair Makoto and the others!!"
211020-71 = "Ugh...!"
211020-72 = "That is..."
211020-73 = "Pandemonium Society. You are the representatives of Gehenna, yet you do not perform the duties befitting your position."
211020-74 = "You take advantage of the students' apathy and waste the budget on bizarre policies."
211020-75 = "There is... well, almost no room for defense. But occasionally, and I mean very occasionally, you do do some good things—"
211020-76 = "Occasionally isn't good enough! It has to be all the time!"
211020-77 = "I've been watching, and you're putting all your effort into bullying the Prefect Team, aren't you?"
211020-78 = "That is only Makoto-senpai."
211020-79 = "You waste a limited budget and refuse to invest in what actually matters.#nThat's why Gehenna's competitiveness keeps dropping!"
211020-80 = "Since the Eden Treaty incident, you haven't even protested against Trinity, have you?"
211020-81 = "That was a decision made with priority given to our relationship with Schale—"
211020-82 = "I'm saying that, as a result, it just looks like you 'surrendered'!"
211020-83 = "Is that what you call being a 'leader'? Can you truly be proud of that as Chair?"
211020-84 = "Guh...! To think they'd say such things so brazenly...!"
211020-89 = "To think there'd be someone who would say it so bluntly...!"
211020-90 = "No. The same applies to you all."
211020-91 = "Excuse me?"
211020-92 = "The Prefect Team exists to protect Gehenna's discipline and order, right?"
211020-93 = "Yet, everyone just thinks of you as 'annoying.' Oh, wait, maybe the Chair is the exception."
211020-94 = "What did you say!?"
211020-95 = "But I don't think that."
211020-96 = "...Huh?"
211020-97 = "Even without the Chair, the Prefect Team is Gehenna's strongest armed force."
211020-98 = "But!"
211020-99 = "You have the power, yet all you do is beat up problem children or fight with the Pandemonium Society, right?"
211020-100 = "No...! We warn them with words first, and only use force after that!"
211020-101 = "No, that's not what I'm talking about."
211020-102 = "Gehenna has incredible potential.#nThe fact that we can't unite is also the Prefect Team's responsibility."
211020-103 = "What is it that the Prefect Team even wants to do?"
211020-104 = "This loose discipline and control like we have now? Or are you just... playing house as Prefects?"
211020-105 = "...Playing house?"
211020-106 = "It's a bit harsh to say, but it's not wrong, is it? Because the Prefect Team hasn't decided on anything at all!"
211020-107 = "You're always so vague. Why don't you take more initiative?"
211020-112 = "If you want to know, I'll answer you."
211020-113 = "C-Chair...!"
211020-114 = "Chair...!"
211020-115 = "Vague... is it?"
211020-119 = "If that's what you want to think, then so be it."
211020-123 = "You seem to be seeking discipline and control."
211020-124 = "But that is not the Gehenna we aim for."
211020-125 = "We aim for a free Gehenna."
211020-126 = "Those are pleasant-sounding words. You speak as if you truly believe that freedom always leads to positive outcomes."
211020-127 = "Even though in the current Gehenna, it has devolved into 'license'."
211020-128 = "That is precisely why we are here to draw the line."
211020-129 = "If you wish to cross it—I'll be your opponent."
211020-130 = "..."
211020-135 = "Hmph... all talk, I see."
211020-136 = "Regardless, the conclusion is—"
211020-137 = "The Prefect Team will maintain their vague stance. Is that how we should interpret this?"
211020-138 = "Yes, that's fine."
211020-139 = "You heard her, Chair."
211020-140 = "So it seems."
211020-141 = "The Pandemonium Society's thoughts! And the Prefect Team's thoughts! We understand them perfectly!!"
211020-142 = "In other words, nobody has any intention of uniting Gehenna."
211020-143 = "Then that makes things simple! All that's left is to take action!!"
211020-144 = "What do you intend to do?"
211020-150 = "In order to create a 'United Gehenna'—"
211020-154 = "We're going to do lots and lots of things!!"
211020-160 = "...Huh?"
211020-161 = "I'm not good with the details, so I don't know the specifics yet, but—"
211020-162 = "Make sure you watch what we do!"
211020-163 = "Gehenna's transformation begins today, from this very moment!!"
211020-172 = "...What energetic juniors."
211020-173 = "They have spirit, but it will end in vain."
211020-174 = "They lack both experience and tenure. No matter how much they struggle, not a single crack will appear in my, Makoto's, reign! Heh-heh-heh!"
211020-180 = "W-well... this is getting interesting!"
211020-182 = "Next Episode;Make Gehenna Great!"