[translation]
211020-1 = "Episódio 02;O Comitê de Restauração de Gehenna"
211020-2 = ""
211020-3 = "Vocês são...?"
211020-4 = "Veteranas, chega dessa treta inútil aí, vai."
211020-5 = "Quem são vocês...?"
211020-8 = ""
211020-9 = "Já que perguntou quem somos――"
211020-10 = "Faremos as honras de nos apresentar!"
211020-11 = "As pioneiras da revolução que resgatarão o orgulho de Gehenna e erguerão uma nova era de glória!"
211020-15 = "O Comitê de Restauração de Gehenna――apresenta-se!!"
211020-16 = ""
211020-21 = "Eita... todo mundo ficou em silêncio de repente."
211020-22 = "Eu sou [ruby=Myouraku]Karen Myouraku[/ruby].#nAssessora da Presidente do Comitê de Restauração de Gehenna."
211020-25 = "Peço escusas pelo estardalhaço.#nNo entanto, toda transformação genuína exige um abalo sísmico――"
211020-26 = "Sou [ruby=Igarashi]Shoko Igarashi[/ruby], secretária do Comitê de Restauração de Gehenna."
211020-29 = "E eu sou a Presidente, [ruby=Furihata]Mayumi Furihata[/ruby]! Muito prazer com todas vocês!"
211020-31 = ""
211020-32 = "Restauração... Isso significa tornar Gehenna forte novamente?"
211020-33 = ""
211020-35 = ""
211020-37 = ""
211020-38 = "Exatamente isso!"
211020-39 = "Kishishi! Uma ambição audaciosa e atrevida! Calouras com fibra moral, gostei de ver!"
211020-40 = "Contudo――tem algo aí que não posso deixar passar batido."
211020-41 = "Gehenna já transborda orgulho e imponência neste exato momento! Chamar de ápice absoluto não seria exagero algum!"
211020-42 = "......Por que vocês falam em '[ruby=novo]de novo[/ruby]'?"
211020-43 = ""
211020-45 = ""
211020-46 = ""
211020-47 = ""
211020-48 = ""
211020-49 = "É porque――"
211020-50 = "Obviamente――"
211020-51 = ""
211020-53 = ""
211020-54 = "A Gehenna de hoje NÃO é nem um pouco grandiosa!"
211020-55 = "O que disse?!"
211020-56 = "É isso aí! A Gehenna de hoje em dia não tem nada de maneira!"
211020-57 = "Que ultraje! Está insinuando que a [ruby=nossa]Gehenna governada por Makoto-sama[/ruby] não é grandiosa?!"
211020-58 = "Isso mesmo!"
211020-59 = "O QUÊÊÊ?!"
211020-60 = ""
211020-62 = ""
211020-63 = "Esse é precisamente o cerne da nossa argumentação."
211020-64 = "Gehenna virou chacota em toda Kivotos. Fomos rotuladas como um mero depósito de encrenqueiras sem futuro."
211020-65 = "Porém, a Gehenna de outrora era completamente diferente."
211020-66 = "Nossas ambições ecoavam pelos quatro cantos do mundo, e todas as outras academias tremiam e reverenciavam o nosso nome."
211020-67 = "Hoje, só de carregar a insígnia de Gehenna, em qualquer lugar já tratam a gente que nem bicho peçonhento."
211020-68 = "Não temos ordem! Não temos disciplina! A única coisa que sobrou é uma cultura escolar imersa em puro caos!"
211020-69 = "E Gehenna ter virado essa esculhambação generalizada――"
211020-70 = "É CULPA INTEIRAMENTE SUA E DA PANDEMÔNIO, PRESIDENTE MAKOTO!!"
211020-71 = "Guh...!"
211020-72 = "Quanto a isso..."
211020-73 = "[ruby=Pandemônio]Sociedade Pandemônio[/ruby]. Vocês representam Gehenna perante o mundo, mas não movem uma palha que justifique essa posição."
211020-74 = "Aproveitam-se da apatia dos alunos para torrar a verba pública em projetos bizarros e sem sentido."
211020-75 = "Não há como negar quase nada disso, de fato...#nMas de vez em quando, muito raramente mesmo, a gente faz alguma coisa boa――"
211020-76 = "De vez em quando não cola! Tinha que ser SEMPRE!"
211020-77 = "Dá pra ver de longe que vocês gastam toda a energia do mandato perseguindo o Comitê de Disciplina!"
211020-78 = "Ah, isso aí é só a Makoto-senpai mesmo."
211020-79 = "Desperdiçam o orçamento limitado com inutilidades e não investem em nada relevante!#nÉ por isso que a competitividade de Gehenna só despenca ladeira abaixo!"
211020-80 = "E desde o incidente do Tratado do Éden, vocês não deram um único pio de protesto contra Trinity, não é?!"
211020-81 = "Aquilo foi priorizando a diplomacia com a Schale e――"
211020-82 = "O que nós estamos dizendo é que, pros olhos do mundo, pareceu pura frouxidão e submissão!"
211020-83 = "É essa a 'envergadura colossal' de que você tanto se gaba? Tem orgulho de ser presidente assim?!"
211020-84 = "Guh...! Quanta insolência saída dessa sua boca atrevida...!"
211020-85 = ""
211020-87 = ""
211020-88 = ""
211020-89 = "Quem diria que alguém esfregaria tudo isso na cara dela com tanta precisão...!"
211020-90 = "Não se iludam. Vocês do Comitê de Disciplina estão exatamente no mesmo barco."
211020-91 = "Como disse?!"
211020-92 = "O Comitê de Disciplina existe para resguardar a ordem e os bons costumes de Gehenna, não é?"
211020-93 = "No entanto, os alunos só enxergam vocês como 'um bando de chatas desocupadas'.#nAh, com exceção da Presidente Hina, claro."
211020-94 = "O que foi que você falou?!"
211020-95 = "Mas eu não penso dessa forma rasa."
211020-96 = "......Hein?"
211020-97 = "Mesmo sem a Presidente Hina, o Comitê de Disciplina continua sendo a força armada mais devastadora de toda Gehenna."
211020-98 = "Só que...!"
211020-99 = "Apesar de deterem tamanho poder, tudo o que fazem é encher encrenqueiras de bala e arrumar briga boba com a Pandemônio!"
211020-100 = "Mentira...! Nós sempre fazemos a advertência verbal primeiro, o uso da força é só a última instância!"
211020-101 = "A questão não é essa, veterana."
211020-102 = "Gehenna possui um potencial assombroso.#nSe a academia não consegue marchar unida rumo a um ideal, o Comitê de Disciplina também tem muita culpa no cartório."
211020-103 = "Afinal de contas, o que vocês querem de verdade?"
211020-104 = "Essa disciplinazinha frouxa e meia-boca de sempre?#nOu estão só... brincando de policiazinha?"
211020-105 = "......Brincando?!"
211020-106 = "A escolha das palavras pode ter sido meio dura, mas é a pura verdade.#nAfinal, o Comitê de Disciplina não toma uma única postura decisiva!"
211020-107 = "Vivem em cima do muro! Por que não dão um passo adiante e assumem o controle de vez?!"
211020-108 = ""
211020-110 = ""
211020-112 = "Se querem uma resposta, eu mesma direi."
211020-113 = "P-Presidente...!"
211020-114 = "Presidente...!"
211020-115 = "Em cima do muro... entendo."
211020-116 = ""
211020-118 = ""
211020-119 = "Se é assim que preferem enxergar, que seja."
211020-120 = ""
211020-122 = ""
211020-123 = "Vocês parecem clamar desesperadamente por rigidez e controle irrestrito."
211020-124 = "Mas essa... não é a Gehenna que nós almejamos."
211020-125 = "Porque a Gehenna pela qual lutamos deve ser livre."
211020-126 = "Um discurso muito poético e melodioso aos ouvidos.#nFala como se cresse piamente que a liberdade sempre desemboca em virtuosismo."
211020-127 = "Mesmo diante da evidência claríssima de que ela se degenerou em mera libertinagem inconsequente."
211020-128 = "É precisamente por isso que existimos: para traçar a linha divisória."
211020-129 = "Se desejam cruzá-la──estou pronta para lidar com vocês."
211020-130 = "......"
211020-131 = ""
211020-133 = ""
211020-134 = ""
211020-135 = "Humph... só sabem ladrar com palavras bonitas."
211020-136 = "De qualquer forma, a conclusão que tiramos é esta――"
211020-137 = "O Comitê de Disciplina manterá sua postura frouxa e passiva. É assim que devemos interpretar?"
211020-138 = "Sim, interprete como quiser."
211020-139 = "Foi o que ela disse, Presidente."
211020-140 = "Parece que sim."
211020-141 = "A postura da Pandemônio! E a postura do Comitê de Disciplina! Já ficaram mais do que nítidas para nós!!"
211020-142 = "Em suma: nenhuma das lideranças tem coragem de unir Gehenna num punho de ferro!"
211020-143 = "Sendo assim, o assunto encerra aqui! Agora é botar a mão na massa!!"
211020-144 = "E o que pretendem fazer, por gentileza?"
211020-145 = ""
211020-147 = ""
211020-148 = ""
211020-149 = ""
211020-150 = "Para forjar uma 'Gehenna Unida e Imbatível'――"
211020-151 = ""
211020-153 = ""
211020-154 = "Vamos aprontar um mooonte de coisas!!"
211020-155 = ""
211020-157 = ""
211020-158 = ""
211020-159 = ""
211020-160 = "......Hã?"
211020-161 = "Eu sou péssima com detalhes chatos, então ainda não faço ideia do quê exatamente――"
211020-162 = "Mas fiquem bem atentas a tudo o que vamos realizar!"
211020-163 = "A virada de chave de Gehenna começa hoje, a partir deste exato segundo!!"
211020-164 = ""
211020-166 = ""
211020-167 = ""
211020-168 = ""
211020-169 = ""
211020-170 = ""
211020-171 = ""
211020-172 = "......Que calouras cheias de pique."
211020-173 = "Muita garganta pra pouco resultado. Estão fadadas ao fracasso mais retumbante."
211020-174 = "Falta idade, falta casca grossa!#nNão importa o quanto esperneiem, meu glorioso reinado soberano não terá uma única rachadura! Kishishi!"
211020-175 = ""
211020-177 = ""
211020-178 = ""
211020-179 = ""
211020-180 = "E-Eita... agora a história começou a ficar divertida!"
211020-182 = "Próximo Episódio;Gehenna Grande de Novo!"
