[translation]
51120-1 = "Эпизод 12;Кирю Кикё и Поединок за преемство 1"
51120-3 = "На следующий день."
51120-4 = ""
51120-7 = ""
51120-8 = "Сенсей! Сенсей!"
51120-9 = "Хи-хи! Доброе утро!"
51120-10 = "[s] «Доброе утро, Юкари. Тебе уже лучше?»"
51120-11 = "Вы спрашиваете о моём душевном или физическом состоянии?"
51120-12 = "Хи-хи-хи..."
51120-13 = "Что бы вы ни имели в виду, я свежа, словно цветок сакуры!"
51120-14 = "Однако у нас есть гораздо более срочные дела."
51120-15 = "Мы найдём Кикё, и она станет свидетелем моего Поединка за преемство Хяккарёран!"
51120-17 = "Тогда у нас будет всё необходимое, чтобы начать новую эпоху."
51120-18 = "Свет! Занавес! Начинается великая легенда Юкари из Хяккарёран!"
51120-19 = "[s] «Кикё так легко согласится?»"
51120-20 = "Хи-хи. Признак настоящего педагога. Вы умеете задавать правильные вопросы! Ведь прежде чем вступать в бой, нужно понять своего противника."
51120-21 = "Если описать Кикё... Она самый умный, логичный и здравомыслящий человек из всех, кого я встречала."
51120-22 = "Был один случай..."
51120-25 = ""
51120-26 = "Юкари. Ты прекрасно знаешь правила."
51120-27 = "Д-Да...! *глоток*"
51120-28 = ""
51120-30 = ""
51120-31 = "Я уже говорила. Тебе можно одно мороженое в день."
51120-32 = "Я прекрасно это помню! Однако, Кикё...!"
51120-33 = "Правила есть правила. И хорошие правила существуют не просто так. Избыток сладкого перед сном вреден для зубов и здоровья."
51120-34 = ""
51120-36 = ""
51120-37 = "К тому же ты чистишь зубы после еды? Как следует?"
51120-38 = "К-К-К-К-Конечно!"
51120-39 = "Разумеется, мне и в голову не пришло бы лениться чистить зубы и заменять это ополаскивателем! Никак нет."
51120-40 = ""
51120-42 = ""
51120-44 = "Всё. Начиная с сегодняшнего дня я буду проверять твои зубы после еды."
51120-45 = "ЧТОООО?!"
51120-47 = "Вот идеальный пример характера Кикё!"
51120-48 = "С таким безупречным характером она наверняка протянет нам руку помощи!"
51120-49 = ""
51120-51 = "[ns] «Д-Да! Ты и правда очень в неё веришь!»"
51120-52 = "Хи-хи!"
51120-53 = "Каждая прошедшая секунда — потерянное время!"
51120-54 = ""
51120-56 = ""
51120-57 = "Пошли!"
51120-58 = ""
51120-60 = ""
51120-64 = "Здравствуйте? Кикё, это Юкари!"
51120-65 = ""
51120-68 = ""
51120-69 = "Я войду!"
51120-70 = ""
51120-75 = "Клубная комната Хяккарёран"
51120-76 = ""
51120-77 = ""
51120-78 = ""
51120-80 = ""
51120-81 = "Ч-Что? Сенсей?"
51120-83 = "...?"
51120-84 = "[s] «Шизуко? Вот так встреча.»"
51120-85 = "Юкари?"
51120-86 = "Это я! Я так по вам скучала, Кикё!"
51120-87 = "А, Юкари... Давно не виделись. Рада, что твоя живость ничуть не угасла."
51120-88 = "Сегодня ирония следует за мной по пятам. Встретить тебя именно сегодня, именно сейчас..."
51120-89 = "Возможно, высшие силы решили раскрыть свои карты."
51120-90 = "...?"
51120-91 = "Тебе придётся подождать своей очереди, Юкари."
51120-92 = "Моей очереди...?"
51120-94 = "[ns] «Что привело тебя сюда, Шизуко?»"
51120-95 = "А! Сейчас объясню!"
51120-96 = "От имени всех студентов я хочу объявить о возрождении Фестиваля фонарей Хяккияко!"
51120-97 = "...Вы уже знали? О-О! Спасибо, Сенсей! Мы правда очень старались!"
51120-98 = "Хи-хи-хи."
51120-99 = "Ваши слова поддержки так меня... Хи-хи..."
51120-100 = ""
51120-102 = ""
51120-103 = "Ах! Хватит меня отвлекать, Сенсей! У меня нет времени болтать ногами и хихикать!"
51120-104 = "Итак! Шаг первый: найти мико из семьи Кадэнокодзи и попросить её провести главную церемонию фестиваля!"
51120-105 = "[s] «Кадэнокодзи...? Разве Юкари не...?»"
51120-107 = "...Ах."
51120-109 = "Кадэнокодзи — одна из старейших и наиболее уважаемых семей, связанных с ритуалами и церемониями Хяккияко."
51120-110 = "Их значение и то, что они олицетворяют, невозможно переоценить."
51120-111 = "Отлично сказано!"
51120-112 = "Поэтому, естественно, именно семья Кадэнокодзи проводила ритуал фестиваля. По крайней мере, пока его не запретили двадцать лет назад."
51120-113 = "В записях говорится, что во время церемонии что-то пошло не так, и с тех пор фестиваль больше не проводили."
51120-114 = "И вот мы возвращаемся к нашей изначальной цели! Только нынешняя мико Кадэнокодзи имеет законное право возродить Фестиваль фонарей!"
51120-115 = "Я лично ходила в их резиденцию, но её не было дома! Пришлось искать другой подход."
51120-116 = "[s] «Так вот почему ты пришла к Хяккарёран!»"
51120-117 = "Иногда удачу нужно создавать своими руками!"
51120-118 = "Я слышала, что мико Кадэнокодзи состоит в Хяккарёран, поэтому сразу пришла сюда."
51120-120 = "Хотите ответить, Кадэнокодзи Юкари?"
51120-121 = "Ах! Я понятия не имела, что это вы! Наконец-то рада познакомиться!"
51120-122 = "Отлично! Значит, вы уже в курсе дела. Вы будете сотрудничать с Фестивальным отделом? Пожалуйста?"
51120-123 = ""
51120-125 = ""
51120-127 = ""
51120-128 = "Я... Ну..."
51120-129 = ""
51120-131 = ""
51120-132 = "*глоть*"
51120-133 = ""
51120-135 = ""
51120-137 = "Я искренне хотела бы помочь, но вынуждена отказаться, президент Фестивального отдела Шизуко."
51120-138 = "...А?"
51120-139 = "П-Почему? Я вас чем-то обидела?"
51120-140 = ""
51120-142 = ""
51120-143 = "Нет! Просто..."
51120-144 = "Моё место — в Хяккарёран!"
51120-145 = "Именно поэтому я пришла сюда, Кикё! Потому что моё место здесь!"
51120-147 = "...Что это за бред?"
51120-148 = "Я собираюсь объявить Нагусе Поединок за преемство."
51120-149 = ""
51120-151 = ""
51120-152 = ""
51120-159 = "Я слышала новости, Кикё! Декларация о роспуске? Я не понимаю."
51120-160 = "..."
51120-161 = "Должно быть, это какое-то недоразумение! Пожалуйста, объясните! Кикё!"
51120-162 = ""
51120-165 = "Юкари."
51120-166 = "Слухи распространяются во все стороны, и люди теряют веру в Хяккарёран."
51120-168 = "Я собираюсь исправить эту ситуацию с помощью Поединка за преемство!"
51120-170 = "И именно поэтому ты сегодня здесь."
51120-171 = "Я пришла умолять вас о помощи, Кикё! Пожалуйста, станьте свидетелем моего Поединка за преемство!"
51120-172 = "С вашей поддержкой мы вместе сможем вернуть Хяккарёран былую славу!"
51120-173 = ""
51120-175 = ""
51120-177 = ""
51120-178 = "Теперь я понимаю твои мотивы."
51120-179 = "Я гадала, когда Кадэнокодзи Юкари сделает свой ход после публикации Декларации о роспуске."
51120-180 = "Признаю, Поединка за преемство в моих расчётах не было. Хотя, возможно, мне следовало его ожидать."
51120-181 = "Да... Теперь я вижу, как ты пришла к этой стратегии."
51120-182 = "...!"
51120-183 = "Я знала, что вы поймёте, Кикё!"
51120-185 = "Если именно так ты решила действовать..."
51120-186 = "Нет."
51120-187 = ""
51120-189 = ""
51120-191 = "Я СОВСЕМ не ожидала, что всё пойдёт в эту сторону!"
51120-192 = "[s] «А...?»"
51120-194 = "Н-Нет? Я не понимаю..."
51120-195 = "Вы всегда защищали идеалы Хяккарёран всем сердцем и душой! Я искренне верила, что уж вы-то..."
51120-196 = "Соглашусь? Поддержу тебя?"
51120-197 = "Позволь объяснить."
51120-198 = ""
51120-200 = ""
51120-202 = "Ты живёшь иллюзиями. Ты высокомерна. Я разочарована, Кадэнокодзи Юкари."
51120-203 = "...!!"
51120-205 = "Я собрала и проанализировала всю относящуюся к делу информацию. Исчезновение Нагусы и её последующие появления, даже твою встречу с Клубом Инь-Ян."
51120-206 = "Пылким надеждам нет места в реальности."
51120-207 = "Нагуса больше никогда не вернётся в Хяккарёран."
51120-208 = "Она уже попрощалась."
51120-209 = "Она в последний раз вернулась в Хяккарёран, чтобы отказаться от президентского поста, который Аямэ передала ей."
51120-212 = ""
51120-214 = ""
51120-216 = ""
51120-217 = ""
51120-219 = ""
51120-220 = ""
51120-221 = ""
51120-223 = "[ns] «(Вот что имела в виду Рэнгэ...)»"
51120-224 = "Н-Нагуса... Вы встречались с ней? Я-я не могу поверить, что она отказалась от должности."
51120-225 = "Н-Неужели она правда...?"
51120-226 = "Рэнгэ была слишком мягкой, чтобы сообщить тебе эту новость."
51120-227 = "Не жди такой деликатности от меня. Я не стану лгать ради твоих чувств."
51120-228 = "Она бросила нас. Она больше не член Хяккарёран."
51120-229 = "Но...!"
51120-230 = "И всё равно я хочу—"
51120-231 = "Хорошо. Допустим на мгновение, что этот Поединок за преемство возможен."
51120-232 = "Ты собираешься победить Нагусу, стать законным президентом и восстановить Хяккарёран. Твоим амбициям нет предела, и за это я тебя хвалю."
51120-233 = "Но есть одна проблема, которую Рэнгэ пыталась осторожно тебе показать. А я сейчас скажу прямо."
51120-234 = "...!"
51120-235 = ""
51120-237 = ""
51120-238 = "Слушай внимательно, Кадэнокодзи Юкари."
51120-239 = "Ты никогда не сможешь победить Нагусу в бою."
51120-240 = ""
51120-243 = ""
51120-245 = "В этом мире не существует стратегии, способной привести к такому исходу."
51120-246 = "Знай пределы своих возможностей и сдайся."
51120-248 = "Н-Нет! Ни за что!"
51120-249 = "Я не сдамся! Я, Юкари, одолею её!"
51120-250 = "Я...!"
51120-251 = "Я ведь элита Хяккарёран, разве нет?!"
51120-253 = "Тогда как ты собираешься её победить, если не можешь одолеть даже меня?"
51120-254 = "П-Поражение ничего не значит, пока дух остаётся сильным!"
51120-255 = ""
51120-257 = ""
51120-258 = "Пусть так. Я покажу вам свою силу! Здесь и сейчас!"
51120-259 = "Кирю Кикё! Я вызываю вас на тренировочный бой. Если я одержу победу—"
51120-261 = "Нет."
51120-262 = ""
51120-264 = ""
51120-265 = ""
51120-267 = "Если собираешься что-то доказывать — делай это как следует."
51120-268 = ""
51120-270 = ""
51120-271 = "Вызови меня на Поединок за преемство."
51120-272 = ""
51120-275 = ""
51120-276 = "...Ч-Что?"
51120-277 = "Ты сражаешься за идеалы, которым сама не можешь следовать?"
51120-278 = "Сила — это справедливость. Именно в это мы верим в Совете урегулирования Хяккарёран."
51120-279 = "Хочешь, чтобы я преклонила колено? Навяжи мне свою волю. Победи в этом Поединке за преемство — и я стану твоим свидетелем."
51120-280 = "...!!"
51120-281 = "[s] «Я ожидал совсем другого способа урегулирования конфликтов!»"
51120-283 = "Так, эм... Сенсей...!"
51120-284 = "М-Может, я просто... зайду в другой раз?"
51120-285 = ""
51120-288 = ""
51120-289 = "Теперь я уже не могу отступить..."
51120-290 = ""
51120-292 = ""
51120-294 = "Я объявляю Поединок за преемство офицеру по операциям Кирю Кикё!"
51120-302 = ""
51120-303 = ""
51120-305 = ""
51120-308 = ""
51120-309 = "Я принимаю вызов, Кадэнокодзи Юкари."
51120-310 = "Сенсей [USERNAME] из Шале выступит свидетелем этого поединка за должность офицера по операциям. Традиция требует двух свидетелей, однако..."
51120-311 = "Учитывая обстоятельства, мы признаём особое соглашение между двумя сторонами."
51120-312 = "Как члены Хяккарёран, Кадэнокодзи Юкари и Кирю Кикё участвуют в этом поединке лишь с одним свидетелем."
51120-313 = "Вы согласны с этими условиями?"
51120-314 = ""
51120-316 = ""
51120-318 = ""
51120-319 = ""
51120-320 = "Да! Я подготовила своё сердце!"
51120-323 = ""
51120-324 = ""
51120-325 = ""
51120-326 = ""
51120-328 = "Тогда начнём."
