[translation]
51120-1 = "Episódio 12;Kikyou Kiryuu e o Torneio de Sucessão (1)"
51120-3 = "(No dia seguinte)"
51120-8 = "Senseeei!"
51120-9 = "Bom dia! Fufu!"
51120-10 = "[s] \"Bom dia, Yukari. Como você está hoje?\""
51120-11 = "Quando diz \"como estou\"... refere-se à minha saúde ou ao meu humor?!"
51120-12 = "De qualquer forma..."
51120-13 = "Estou em absolutamente ótima forma!"
51120-14 = "Vamos! Não temos tempo a perder. Hoje é um dia muitíssimo importante!"
51120-15 = "Afinal, hoje vamos encontrar a Kikyou-senpai e pedir que ela seja testemunha do Torneio de Sucessão...!"
51120-17 = "Sim! Fazendo isso, será missão cumprida!"
51120-18 = "É o começo da lenda de Yukari Kadenokouji!"
51120-19 = "[s] \"Que tipo de pessoa é a Kikyou?\""
51120-20 = "Ufufu, como esperado do Sensei!#nQue diligência impecável em fazer uma pesquisa prévia!"
51120-21 = "Se eu tivesse que descrever a Kikyou-senpai em poucas palavras... ela é uma pessoa muito racional, lógica... e extremamente pragmática!"
51120-22 = "Para dar um exemplo de como ela é—"
51120-26 = "Yukari. Eu já te disse antes, não disse?"
51120-27 = "(Gulp...)"
51120-31 = "É só um sorvete por dia. Não me diga que você esqueceu?"
51120-32 = "C-Claro que não...! Mas, Kikyou-senpai...!"
51120-33 = "Não preciso de desculpas.#nPara começo de conversa, comer logo antes de dormir não faz bem para a saúde, não é?"
51120-37 = "Você tem escovado os dentes direitinho?"
51120-38 = "C-C-C-Claro que sim!!"
51120-39 = "Eu jamais pensaria \"hoje estou cansada, acho que só um enxaguante bucal já basta\"—"
51120-44 = "Entendi. A partir de hoje, vou checar sua escovação todos os dias."
51120-45 = "O quêêê?!?!"
51120-47 = "—E foi isso que aconteceu."
51120-48 = "Sendo a Kikyou-senpai quem é, tenho certeza de que ela nos emprestará sua força!"
51120-51 = "[ns] \"Deu para perceber bem o quanto você confia na Kikyou.\""
51120-52 = "Fufu."
51120-53 = "Com certeza!"
51120-57 = "Pois bem! Vamos imediatamente!!"
51120-64 = "Kikyou-senpai! Eu cheguei!"
51120-69 = "Com licença!"
51120-75 = "Sala de Mediação da Hyakkaryouran"
51120-81 = "U-Ué...? S-Sensei?!"
51120-83 = "...?"
51120-84 = "[s] \"Shizuko? O que você está fazendo aqui...?\""
51120-85 = "Yukari?"
51120-86 = "Kikyou-senpai! Quanto tempo!"
51120-87 = "Ah... sim. Faz tempo mesmo. Que bom ver que você continua cheia de energia como sempre."
51120-88 = "Embora a hora não seja das melhores..."
51120-89 = "Será que isso é uma peça do destino?"
51120-90 = "...?"
51120-91 = "Hoje eu já tinha uma visita."
51120-92 = "Uma visita..."
51120-94 = "[ns] \"Sobre o que vocês duas estavam conversando?\""
51120-95 = "Aham, bem, é que..."
51120-96 = "Desta vez, vamos unir forças com todos para reviver o \"Festival das Lanternas de Hyakkiyako\"...!"
51120-97 = "Ah, você já estava sabendo...?#nQue parece dar trabalho, mas está torcendo por nós...?"
51120-98 = "Ehehe~"
51120-99 = "Só de ouvir o Sensei dizer isso, a Shizuko já fica...!"
51120-103 = "...Quer dizer, não é isso!#nFico muito feliz por isso, claro, mas agora não é hora de comemorar!"
51120-104 = "Enfim! Para o clímax do festival,#ngostaríamos de pedir a ajuda da \"Sacerdotisa da família Kadenokouji\"."
51120-105 = "[s] \"A Sacerdotisa da família Kadenokouji...?\""
51120-107 = "...Ah."
51120-109 = "A família Kadenokouji — um clã que, por gerações, desempenha papéis importantes nos rituais e cerimônias da Academia Aliada Hyakkiyako."
51120-110 = "Acho que nem preciso explicar a importância deles, não é?#nÉ uma família tão ilustre que todo mundo em Hyakkiyako conhece o nome."
51120-111 = "Exatamente!"
51120-112 = "Na verdade, no festival de vinte anos atrás, também foi a família Kadenokouji quem ficou encarregada da dança ritual."
51120-113 = "Segundo os registros, há vinte anos o ritual acabou não sendo realizado..."
51120-114 = "Então, para o festival deste ano, tentei entrar em contato para pedir a ajuda da sacerdotisa, mas..."
51120-115 = "Ainda não recebi resposta... e quando fui à residência dela, não havia ninguém..."
51120-116 = "[s] \"Ou seja, o motivo de você ter vindo à Hyakkaryouran é...\""
51120-117 = "Sim, não dava para ficar só esperando!"
51120-118 = "Ouvi dizer que a sacerdotisa dos Kadenokouji estava na Hyakkaryouran, então vim direto para cá!"
51120-120 = "Parece que é isso mesmo, Yukari Kadenokouji."
51120-121 = "Ah! Por acaso a pessoa ao lado do Sensei é a Kadenokouji-san?!"
51120-122 = "Que sorte a minha! Junto conosco do Comitê de Organização de Festivais—"
51120-128 = "E-Eu..."
51120-132 = "(Gulp...)"
51120-137 = "Peço mil desculpas, honorável Presidente do Comitê de Organização de Festivais.#nInfelizmente, não poderei prestar auxílio."
51120-138 = "...Quêêê?!"
51120-139 = "P-Por quê?"
51120-143 = "Eu..."
51120-144 = "Quero pertencer à Hyakkaryouran."
51120-145 = "E é por isso que vim pedir a ajuda da Kikyou-senpai."
51120-147 = "...O que você quer dizer?"
51120-148 = "Kikyou-senpai, eu pretendo desafiar a Nagusa-senpai para um \"Torneio de Sucessão\"."
51120-159 = "Ouvi dizer que, recentemente... uma \"Ordem de Dissolução\" foi emitida."
51120-160 = "..."
51120-161 = "Aquilo é mesmo verdade?#nTodas estão confusas, sem saber o que fazer."
51120-165 = "...Yukari."
51120-166 = "Por isso, antes que esse boato se espalhe ainda mais!"
51120-168 = "Eu, Yukari Kadenokouji... vencerei a Nagusa-senpai no \"Torneio de Sucessão\" e resolverei esta situação!"
51120-170 = "...E foi por isso que você foi ao Clube Yin-Yang e depois veio até mim?"
51120-171 = "Sim! Portanto, Kikyou-senpai, a senhora aceitaria ser a testemunha do Torneio de Sucessão?"
51120-172 = "Eu farei o Comitê de Mediação de Conflitos Hyakkaryouran voltar ao que era antes!"
51120-178 = "Entendi. Eu imaginei que você viria correndo assim que ouvisse sobre a \"Ordem de Dissolução\", mas..."
51120-179 = "...nunca pensei que fosse propor um \"Torneio de Sucessão\"."
51120-180 = "Bem a sua cara, devo dizer... mas confesso que não esperava por essa."
51120-181 = "...Entendi o que você quer dizer."
51120-182 = "...!"
51120-183 = "Então, Kikyou-senpai...!"
51120-185 = "Sim, talvez eu nem precisasse dizer em voz alta, mas—"
51120-186 = "—Eu recuso."
51120-191 = "Ah, quê? P-Por quê...?!"
51120-192 = "[s] \"...Quê?\""
51120-194 = "P-Por que motivo, Kikyou-senpai?!"
51120-195 = "Afinal, a senhora continua aqui na Sala de Mediação até hoje,#nentão é claro... é claro que concordaria com a minha ideia...!"
51120-196 = "Você achou que eu concordaria?"
51120-197 = "Se é assim, vou ter que te dizer uma coisa..."
51120-202 = "Você não está se achando demais, não?"
51120-203 = "...!!"
51120-205 = "Eu também já sei sobre a Nagusa-senpai. Sei onde ela apareceu e como entrou em contato com o Clube Yin-Yang."
51120-206 = "Mas minha resposta não muda."
51120-207 = "Ela... não vai voltar para a Hyakkaryouran."
51120-208 = "Não... pensando bem, ela de fato voltou uma vez, se quiser colocar nesses termos."
51120-209 = "Para devolver a \"Prova\" que recebeu da Presidente Ayame."
51120-223 = "[ns] (Era disso que a Renge estava falando.)"
51120-224 = "A Nagusa-senpai... devolveu a \"Prova\"...?#nI... Isso não pode ser..."
51120-225 = "Mas a Nagusa-senpai..."
51120-226 = "...A Renge provavelmente não te contou pensando no seu bem."
51120-227 = "Mas eu sou diferente. Não se deve desviar o olhar da realidade."
51120-228 = "É melhor parar de considerar como parte da Hyakkaryouran alguém que nos abandonou."
51120-229 = "Mas..."
51120-230 = "Mesmo assim...!"
51120-231 = "Então, digamos que o \"Torneio de Sucessão\" aconteça como você quer—"
51120-232 = "Derrotar a Nagusa-senpai e assumir o posto de Presidente.#nA ideia em si é admirável, eu admito."
51120-233 = "Só que você não está esquecendo de um detalhe?"
51120-234 = "...!"
51120-238 = "Você acha mesmo..."
51120-239 = "que consegue vencer a Nagusa-senpai?"
51120-245 = "Ela é forte."
51120-246 = "Muito mais forte do que você."
51120-248 = "Não...!"
51120-249 = "Eu... eu consigo vencer!"
51120-250 = "Afinal, eu sou..."
51120-251 = "da elite da Hyakkaryouran...!"
51120-253 = "Mesmo sem conseguir vencer nem a mim?"
51120-254 = "N-Não saberemos até tentarmos!"
51120-258 = "Pois bem... se é assim que a senhora pensa, provarei minha força aqui e agora!"
51120-259 = "Kikyou-senpai, eu a desafio para uma luta simulada!"
51120-261 = "—Certo."
51120-267 = "Se você insiste tanto, vou te acordar desse sonho."
51120-271 = "Desafie-me para um \"Torneio de Sucessão\"."
51120-276 = "...Quê?"
51120-277 = "Não me diga que esqueceu."
51120-278 = "Na Hyakkaryouran, a justiça é decidida pela força."
51120-279 = "Se quer tanto que eu te reconheça, me derrote."
51120-280 = "...!!"
51120-281 = "[s] \"Esperem. Vocês duas, acalmem-se primeiro...\""
51120-283 = "A-Au... S-Sensei..."
51120-284 = "S-Será que eu... cheguei na pior hora possível?!"
51120-289 = "E... Entendido."
51120-294 = "Sendo assim, eu, Yukari Kadenokouji...#ndesafio você, Kikyou-senpai, para um \"Torneio de Sucessão\"!"
51120-309 = "Eu aceito o desafio do Torneio de Sucessão da desafiante Kadenokouji e declaro aqui o seu início."
51120-310 = "Este Torneio de Sucessão, que disputa não o cargo de Presidente, mas o de \"Estrategista\", terá [USERNAME]-sensei de Schale como observador — e, embora normalmente fosse necessária mais uma testemunha..."
51120-311 = "Considerando que esta batalha ocorre sob mútuo acordo, abriremos uma exceção apenas desta vez."
51120-312 = "Portanto, como membros da Hyakkaryouran, Yukari Kadenokouji e Kikyou Kiryuu atuarão como testemunhas uma da outra."
51120-313 = "Alguma objeção?"
51120-320 = "Nenhuma."
51120-328 = "—Então, vamos começar."
