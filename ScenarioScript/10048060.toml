[translation]
10048060-1 = "Эпизод 6;Изменения в плане"
10048060-2 = ""
10048060-3 = "С частью про... ультрамариновую краску, «твёрдое небо» и ляпис-лазурь я согласна..."
10048060-4 = "Но часть про плачущих улиток... Слёзы ведь прозрачные, верно?"
10048060-6 = "Фиолетовые."
10048060-7 = "Фиолетовые?"
10048060-8 = "Давным-давно пурпурный пигмент делали, растирая железы морских улиток мурекс. Чтобы получить грамм красителя, нужны были тысячи улиток."
10048060-9 = "Думаю, улитки «плакали» из-за жестокости этого процесса."
10048060-10 = "А что с улыбающимся королём? Это что? Белый? Жёлтый?"
10048060-11 = "Нет. Синие и пурпурные красители были настолько редкими и сложными в производстве, что носить их могла только знать."
10048060-12 = "Я уже говорила, насколько сложными когда-то были эти процессы."
10048060-13 = "Последняя фраза лишь подтверждает предыдущие две. Синий и пурпурный были не для простолюдинов. Им нельзя было ни носить эти цвета, ни писать ими."
10048060-14 = "Отсюда и «лишь король улыбнётся.»"
10048060-15 = "Значит, Благородная воровка охотится за картиной в синих и пурпурных тонах. Возможно, старой..."
10048060-16 = "Именно."
10048060-17 = "Значит, если мы вместе просмотрим все картины, которые будут выставлены, то хотя бы сможем предположить, что —"
10048060-19 = "Эй, эй, разве она уже не лежит в футляре у Фую?"
10048060-20 = "А? Я пока ничего не крала... пока."
10048060-21 = "...О."
10048060-22 = "А...!"
10048060-23 = "«Любовь пурпурного и синего света»!"
10048060-24 = "Вот оно! Это же так очевидно. Она была прямо ТАМ. И... прямо здесь!"
10048060-25 = "[s] «К тому же у нас ещё и подлинник...!»"
10048060-26 = "Верно."
10048060-27 = "Подумать только, у нас уже есть то, что нужно воровке. Она об этом не знает, но..."
10048060-28 = ""
10048060-30 = ""
10048060-31 = "...Погодите, С-Сенсей?!"
10048060-32 = "К-Как давно вы здесь...?!"
10048060-33 = "[s] «Фую попросила помочь, вот я и пришёл.»"
10048060-34 = "Официальное название Шале — «Федеральный следственный клуб „Шале“.»"
10048060-35 = "И теперь мы оказались посреди «расследования» дела Благородной воровки..."
10048060-36 = "Вот я и подумала, что нам не помешает помощь! Они всё равно уже по уши в наших делах..."
10048060-37 = "[s] «...Конечно, никакой дополнительной информации у меня нет.»"
10048060-38 = "Ха."
10048060-39 = "То есть... ты ещё сильнее втянула Сенсея без всякой причины?"
10048060-40 = "Но они принесли торт! Бери кусочек, Миё. Вилки есть."
10048060-41 = "И... разве торт с друзьями в парке — недостаточная «причина»?"
10048060-43 = "Ага! Он ОЧЕНЬ вкусный, Миё!"
10048060-44 = "[s] «В кафе он ещё вкуснее.»"
10048060-45 = "Да ладно тебе, Миё. Пара кусочков в честь праздника. Сенсей УМЕЕТ выбирать десерты."
10048060-46 = "[s] «Всем своим знаниям я обязан нескольким блестящим студентам...»"
10048060-47 = "Погоди. Сенсей, а как вы вообще пронесли сюда еду извне? Вы ведь не катапультой торт закинули?"
10048060-48 = "Полагаю, сотрудникам извне разрешено кормить заключённых."
10048060-49 = "Заключённых..."
10048060-50 = "Это школа, а не тюрьма."
10048060-51 = "Я бы ОЧЕНЬ с этим поспорила."
10048060-52 = "Вот поэтому я и говорю: надо втянуть Сенсея в наш новый премиальный сервис по контрабанде еды! Будем возить торты, суфле, латте со слив—"
10048060-53 = "[s] «Отклонено, Фую.»"
10048060-54 = "Эх."
10048060-55 = ""
10048060-57 = ""
10048060-58 = "[ns] «В любом случае, мы не слишком отвлеклись от темы?»"
10048060-59 = "Точно. Миё говорила о Благородной воровке."
10048060-60 = "Итак, вернёмся к делу."
10048060-61 = "Благородная воровка нацелилась на ту же картину, которую мы намерены ЭТИЧНО подменить."
10048060-62 = "«Любовь пурпурного и синего света»..."
10048060-63 = "Мы хотим заменить её, а она — украсть..."
10048060-64 = "Всё становится запутаннее..."
10048060-66 = "Хм?"
10048060-67 = "Вообще-то, по-моему, всё довольно просто."
10048060-68 = "Просто...?"
10048060-69 = "В конце концов, наша цель не в том, чтобы вынести или оставить у себя подделку."
10048060-70 = "...Наша цель — поместить подлинную картину туда, где ей и место."
10048060-71 = "Если Благородная воровка вынесет подделку из хранилища, нам останется лишь поставить на её место оригинал."
10048060-72 = "Так мы выполним условия заказа и не будем хранить у себя никаких улик."
10048060-73 = "...!"
10048060-74 = "...!"
10048060-75 = "Нам даже не придётся мучиться, вынося картину из хранилища."
10048060-76 = "Очень кстати Благородная воровка сделает всю эту работу за нас."
10048060-77 = "А мои исследования показали, что Воровка не возвращает украденное на рынок. Она крадёт вещи и оставляет их себе."
10048060-78 = "...Иными словами, здесь выиграют все. Она украдёт свою картину, а компания Вероники наконец получит настоящую работу, за которую заплатила столько денег."
10048060-79 = "Даже уборкой заниматься не придётся."
10048060-80 = ""
10048060-82 = ""
10048060-83 = "..."
10048060-84 = "Я уже много лет это говорю, но у тебя ДЕЙСТВИТЕЛЬНО талант к преступлениям, Миё."
10048060-85 = "В лучшем случае это комплимент с подвохом."
10048060-86 = "У-у-у... Я поступала на литературу не для того, чтобы писать такие истории..."
10048060-87 = "[s] «А о чём бы ты хотела писать, Миё?»"
10048060-88 = "Н-Ну..."
10048060-89 = "С-Сейчас не время. Нам ещё нужно —"
10048060-90 = "Это романтика. Тут нечего стыдиться."
10048060-91 = "Миё так любила читать и разбирать любовные романы, что теперь пишет свои."
10048060-93 = "А-а-а! Да заткнись ты уже...?"
10048060-94 = "Д-Д-Да, ты права, ладно? Но... пожалуйста, потише."
10048060-95 = "[s] «Можно мне почитать твои работы?»"
10048060-96 = "Я-я-я не могу... Нет! Нет, они ещё не закончены."
10048060-97 = "...Как и этот план."
10048060-98 = "Мы разгадали только половину визитной карточки..."
10048060-99 = "О. Ага, точно."
10048060-100 = "Там было продолжение."
10048060-101 = "«Когда двери закроются и радуга сольётся, в тот волшебный миг... я явлюсь.»"
10048060-102 = "Хм... Не думаю, что знаю..."
10048060-103 = "Отличная память, Рицу. Если первая часть указывает на цель, может, эта говорит о времени? В расписании есть какие-нибудь... радужные события?"
10048060-104 = "Очень проницательный вопрос. Не знаю."
10048060-109 = ""
10048060-110 = "Хм..."
10048060-111 = "Эм... Давайте пока вернёмся в общежитие."
10048060-112 = "Не хочется попасться после комендантского часа. На сегодня я уже достаточно наговорилась с людьми."
10048060-113 = "Да, уже начинаются сумерки."
10048060-114 = "Прости, Сенсей. Похоже, вы только пришли... а потом просто смотрели, как мы пялимся в пустоту."
10048060-115 = "[s] «Ничего страшного. Я всё равно пришёл уже под конец дня.»"
10048060-116 = "Но веселье ещё не закончилось... Сенсей, может, я провожу вас до во—"
10048060-117 = "Погоди! Фую, что ты только что сказала?"
10048060-118 = "А? Эм... комендантский час? Провожу?"
10048060-119 = "Не тот."
10048060-120 = "Эм... сумерки?"
10048060-122 = "Да, именно! Сумерки!"
10048060-123 = "А что с ними...?"
10048060-124 = "Посмотри на небо. Какого оно цвета?"
10048060-125 = "Оранжевого...?"
10048060-126 = "Серьёзно? Нет. Посмотри ещё раз."
10048060-128 = "Да, в основном оно оранжевое, но не только."
10048060-129 = "Рядом с солнцем небо оранжевое, а вдали — лавандовое, пурпурное..."
10048060-130 = "А тонкие облака пыльно-белые, в то время как густые окрашены тенями в глубокий ультрамариновый синий..."
10048060-131 = "Во время сумерек цвета радуги смешиваются в единый спектр."
10048060-133 = "«Радуга сольётся, в тот волшебный миг...»"
10048060-134 = "Да. Она прямо сказала время! Сумерки!"
10048060-135 = "Сумерки...!"
10048060-136 = "О, теперь вижу. В этом что-то есть."
10048060-137 = "Сумерки сразу после заката. Мы называем это «волшебным часом.»"
10048060-138 = "Волшебный час?"
10048060-139 = "Да. Он бывает и прямо перед рассветом. Это «час», когда день и ночь смешиваются."
10048060-140 = "Отличное время для фотографий. В рассеянном свете тени исчезают. Это романтично, красиво и..."
10048060-141 = "...коротко. Намного короче часа. Минут двадцать максимум."
10048060-142 = "Волшебный час..."
10048060-143 = "Может, поэтому воровка и сказала «тот волшебный миг.»"
10048060-144 = "По сравнению с длинным днём это действительно всего лишь вспышка времени."
10048060-145 = "...Но откуда ты это знаешь, Фую?"
10048060-146 = "Я учусь на медиаискусстве. Мы проходили это на модуле фотографии."
10048060-147 = "Отлично подмечено."
10048060-148 = "В любом случае, значит, картину будут красть с наступлением сумерек..."
10048060-149 = "Да. Только..."
10048060-150 = "?"
10048060-151 = "Технически сумерки бывают дважды в день. Один раз перед рассветом и один после заката."
10048060-152 = "Так какие она имела в виду?"
10048060-153 = "Хм..."
10048060-154 = "«Когда двери закроются и радуга сольётся, в тот волшебный миг...»"
10048060-156 = "Эй, эй! Может, речь о вечере?"
10048060-157 = "Хм?"
10048060-158 = "Потому что мы говорим, что «двери закрываются», когда рабочий день окончен. Особенно с комендантским часом!"
10048060-160 = "А теперь мы... закрываем лавочку! На сегодня Картель свободной торговли закончил работу!"
10048060-161 = ""
10048060-162 = "...Заканчиваем дела, закрываем двери."
10048060-163 = "И сумерки, волшебный час..."
10048060-164 = "[s] «Тогда... вы закончили...?»"
10048060-165 = "Да. Шифр разгадан."
10048060-166 = "Итак, чтобы все понимали одинаково, мы согласны, что в карточке сказано..."
10048060-167 = "...что кто-то собирается украсть «Любовь пурпурного и синего света» в сумерках, верно?"
10048060-168 = ""
10048060-170 = ""
10048060-172 = ""
10048060-173 = "...Именно. Теперь у меня есть персонажи, мотивация и ставки."
10048060-174 = "Сюжет требует переработки."
10048060-175 = "...!"
10048060-176 = "Итак, новый поворот: теперь мы готовимся к появлению Благородной воровки."
10048060-177 = "...И поможем ей совершить кражу."
