[translation]
10056050-1 = "Episode 5;Compensation for Damages"
10056050-2 = "Island - Captain's Office"
10056050-6 = "...You were cleaning the hull, and a barnacle exploded?"
10056050-7 = "...Yes."
10056050-8 = "It is hard to believe..."
10056050-9 = "That being said, holes in the ship caused by accidents during work are an everyday occurrence."
10056050-10 = "For example... trying to blast away attachments with a bomb because cleaning is too much trouble."
10056050-11 = "........"
10056050-12 = "Does any of that ring a bell?"
10056050-16 = "I would not say... it is entirely impossible, yes..."
10056050-20 = "...I am truly sorry, President Kokoro."
10056050-21 = "If it were an accidental mishap, there would have been room for leniency, but..."
10056050-22 = "Since it was caused by personal negligence, the Diving Club will also have to bear the repair costs."
10056050-23 = "U-Um..."
10056050-24 = "I am embarrassed to ask something like this, but..."
10056050-25 = "Uhm... about how much would the amount be...?"
10056050-26 = "Considering the repair costs and compensation for the items soaked in seawater..."
10056050-30 = "This is the rough estimate."
10056050-31 = "Eek...!"
10056050-32 = "U-Um... isn't there some kind of mistake?"
10056050-33 = "This looks like more than our entire annual activity budget..."
10056050-34 = "There are no mistakes in the calculation."
10056050-35 = "In fact, I am estimating on the lower side here.#nIsland will cover the losses while the ship is out of commission."
10056050-36 = "Uuu..."
10056050-37 = "[s1] \"Isn't there something we can do?\"\n[s2] \"Like, maybe make an exception...\""
10056050-40 = "An exception, you say..."
10056050-41 = "Sensei. In a voyage with many uncertain factors, what do you think is the worst decision you can make?"
10056050-42 = "The answer is granting exceptions."
10056050-44 = "It was not intentional. It cannot be helped. It is only this once."
10056050-45 = "No matter the reason, the moment you start allowing exceptions--"
10056050-46 = "The ship's unity will slacken in an instant, and it will lose the power to overcome rough seas."
10056050-48 = "It is fortunate that we are currently docked, but if this had happened in the middle of the ocean...#nthat small mistake could have led to a major accident threatening our lives."
10056050-49 = "A single plank missing from where it should be is sometimes enough to sink a ship."
10056050-50 = "[s] \"But...\""
10056050-51 = "Even with Sensei putting in a good word, I cannot apply an exception to this case.#nHowever... there is a way to clear the slate, if you are willing."
10056050-52 = "Compensation is billed to the club, not the individual members. If the club itself ceases to exist, it is waived."
10056050-53 = "Disbandment is also an option... what will you do?"
10056050-54 = "Eh...?"
10056050-55 = "I do not think it is that difficult of a choice."
10056050-56 = "The Diving Club members have high physical abilities, so you should be able to do well in Trident or other clubs."
10056050-57 = "But... we need to be the Diving Club if we want to do underwater activities..."
10056050-58 = "Yes, I understand that as well."
10056050-62 = "...Excuse me. I will discuss this with everyone."
10056050-70 = "Phew..."
10056050-71 = "Playing the villain is not my hobby, you know."
10056050-72 = "It cannot be helped. That is what being a captain is all about."
10056050-73 = "Waaah."
10056050-74 = "Please refrain from using childish language."
10056050-81 = "...President!"
10056050-82 = "Sorry, President... You got chewed out big time, didn't you?"
10056050-83 = "...I am sorry."
10056050-87 = "No, it is okay. It could not be helped."
10056050-88 = "I never thought a barnacle would suddenly explode..."
10056050-89 = "Are you... going to be okay with the compensation claim?"
10056050-90 = "If our debt increases any more, we won't be able to handle it."
10056050-91 = "Maybe we should just give up after all..."
10056050-92 = "N-No way!"
10056050-93 = "We cannot lose heart now. There must be a way out of this."
10056050-94 = "...For example?"
10056050-98 = "Like a treasure map where we can strike it rich..."
10056050-99 = "Pardon me, are you members of the Diving Club?"
10056050-100 = "Hah, eh, yes!?"
10056050-101 = "S-Sorry!#nIf this is about the net we broke--"
10056050-106 = "A net...?#nNo. I have a favor to ask of you."
10056050-107 = "I heard that the most talented divers in Odyssey have gathered here..."
10056050-111 = "Counting on those skills... may I make a request?"
