10056050-83 = "...Sorry."
10056050-87 = "No, it's fine. It couldn't be helped."
10056050-88 = "Who could've thought that a barnacle would suddenly explode..."
10056050-89 = "The damages weren't too bad... right?"
10056050-90 = "If our debt goes any higher, we won't be able to handle it any longer."
