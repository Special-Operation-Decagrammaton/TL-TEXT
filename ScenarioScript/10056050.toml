[translation]
10056050-1 = "Episode 5; Damages"
10056050-2 = "Island - Stateroom"
10056050-6 = "So you're saying that while you were cleaning the ship's hull... a barnacle#nexploded?"
10056050-7 = "...Yes."
10056050-8 = "That sounds a little hard to believe..."
10056050-9 = "That said, holes being blown open during work on a ship is an everyday thing."
10056050-10 = "For example... If someone were to use explosives to clean off build-up because#nthey thought it would be a pain to deal with."
10056050-11 = "..."
10056050-12 = "Does nothing come to mind?"
10056050-16 = "Nothing really... doesn't come to mind..."
10056050-20 = "I'm very disapppointed, Club President Kokoro."
10056050-21 = "If it truly were an accident, there may have been some room for leniency..."
10056050-22 = "However, if it were caused by individual negligence, then the Diving Club will have to shoulder part of the repair costs."
10056050-23 = "U-umm..."
10056050-24 = "It's a little embarrassing for me to be asking this, but..."
10056050-25 = "Uh... How much are we talking about here...?"
10056050-26 = "If we take into account the repair cost, as well as reparations for any items that#nwere damaged by seawater..."
10056050-30 = "The total should be approximately this much."
10056050-31 = "Eeek!"
10056050-32 = "S-sorry, but... There has to be some kind of mistake here, right?"
10056050-33 = "This is more than our total annual operating budget..."
10056050-34 = "The calculations are correct."
10056050-35 = "If anything, this estimate is on the lower end. #nAfter all, Island is already paying for losses incurred while the ship is inoperable."
10056050-36 = "Urgh..."
10056050-37 = "[s1] \"Is there really nothing that can be done?\"\n[s2] \"Like, at least an exception...\""
10056050-40 = "An exception, you say...?"
10056050-41 = "Sensei. Tell me, what do you think is the worst possible thing you could do on a#nvoyage that is already full of uncertainties?"
10056050-42 = "The answer is making exceptions."
10056050-44 = "Oh, it wasn't intentional. Oh, it couldn't be helped. Oh, if it's just this once."
10056050-45 = "No matter the reason is, the moment you start making exceptions..."
10056050-46 = "The lashings tying the ship together will immediately slacken, and the ship#nloses its ability to overcome a storm."
10056050-48 = "We're fortunate that today's incident occured while the ship was moored.#nHowever, it would have been a different story if it had been out at sea. Out there, a small mistake is#nall it can take for a serious, life-threatening accident to occur."
10056050-49 = "Even a single plank out of place is enough to cause a ship to sink."
10056050-50 = "[s] \"But...\""
10056050-51 = "Vouch for them all you'd like, but I cannot make an exception. #nHowever... There is a way for us to pretend this never happened."
10056050-52 = "The damages are billed to your club, not its individual members. If the club no#nlonger exists, then those damages will be waived."
10056050-53 = "The option to disband the club is up to you... What will you do?"
10056050-54 = "Huh...?"
10056050-55 = "I don't think it's a particularly difficult choice, though."
10056050-56 = "Since the members of the Diving Club possess excellent physical capabilities, they should be able to excel in Trident or any other club."
10056050-57 = "But... The Diving Club is THE place to be active underwater..."
10056050-58 = "Yes, I understand that as well."
10056050-62 = "...Please excuse me for now. I would like to discuss this with the rest of the#nclub first."
10056050-70 = "Phew..."
10056050-71 = "It's not really my thing to be playing the villainess."
