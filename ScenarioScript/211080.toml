[translation]
211080-1 = "Эпизод 8;Зона безудержной стрельбы"
211080-3 = "На площади, похоже, что-то происходило."
211080-4 = "[ns] «Это же...»"
211080-5 = ""
211080-7 = "Я! Я! Я первая пришла! Дай мне билет!"
211080-8 = ""
211080-10 = ""
211080-11 = ""
211080-12 = "Ещё бы! Ты у нас номер один! Первая в очереди, молодец!"
211080-13 = ""
211080-15 = ""
211080-16 = "Все, пожалуйста, в очередь! Сейчас раздам билеты!"
211080-17 = ""
211080-19 = ""
211080-20 = "Уф, опоздала... И какой у меня номер?"
211080-21 = "Встаньте, пожалуйста, вон туда. Ваш номер — 27."
211080-22 = "Передо мной двадцать шесть человек? Я знала, что очередь будет длинной, но чтобы настолько..."
211080-23 = "Очередь пойдёт быстро. Первые тридцать мест уже заняты, так что начинаем первый сеанс."
211080-24 = "Всем пройти на отведённые места, пожалуйста."
211080-25 = ""
211080-27 = ""
211080-28 = ""
211080-29 = ""
211080-30 = ""
211080-31 = ""
211080-32 = ""
211080-34 = ""
211080-36 = ""
211080-38 = "Знаешь, двигаться со всеми в одном ритме даже как-то... весело? По-своему?"
211080-39 = "Ага. Сначала было непривычно, а потом я сама не заметила, как начала шагать в ногу со всеми!"
211080-40 = "Сегодня заработаю целую кучу бонусных баллов. А вы как?"
211080-42 = ""
211080-43 = "Что это там...?"
211080-44 = "Они все движутся синхронно. Чем это они занимаются?"
211080-45 = "А, похоже, вы ещё не слышали новостей! Вот листовка о САМОМ КРУТОМ месте в академии."
211080-46 = ""
211080-48 = ""
211080-49 = "А? Это же..."
211080-50 = ""
211080-52 = ""
211080-53 = ""
211080-54 = "...«Стреляй вволю, взрывай сколько хочешь! В Зоне безудержной стрельбы можно всё»?"
211080-55 = "«Свобода от Префектуры»?!"
211080-56 = "Постой... Что? Нам и правда всё это можно?"
211080-57 = "Может, попробуем?"
211080-58 = "Разрешено стрелять и всё взрывать? Да я что, дура, отказываться? Что мне терять?!"
211080-59 = ""
211080-61 = ""
211080-68 = ""
211080-69 = "Хм, мне здесь нравится."
211080-70 = "Так и что, просто подходишь и стреляешь? Во все стороны и без разбора?"
211080-71 = "Кто раньше пришёл, тот раньше и проходит! Стройтесь здесь, пожалуйста! В порядке прибытия!"
211080-72 = ""
211080-73 = ""
211080-74 = ""
211080-75 = ""
211080-76 = ""
211080-77 = "Эй! Я раньше пришла!"
211080-78 = "Так надо было раньше и в очередь вставать! Чего стоишь в сторонке? Я первая заняла место, а ты иди в конец!"
211080-79 = "Что? Ты издеваешься? Соблюдай правила!"
211080-80 = "А? Какие ещё правила? Те, что ты сама себе выдумала? Смешно! Проваливай!"
211080-81 = "Эй, сюда! Она меня оттесняет, хотя знает, что я пришла первой! Сделайте что-нибудь!"
211080-82 = ""
211080-84 = ""
211080-85 = "Эй. Без очереди не лезть. Жди своей очереди."
211080-86 = "Хочешь в самый конец или всё-таки встанешь на своё место?"
211080-87 = "Уф... Л-ладно. Поняла."
211080-88 = ""
211080-90 = ""
211080-91 = "Вот! Видите, насколько всё эффективнее, когда каждый соблюдает порядок?"
211080-93 = "[ns] «Они соблюдают правила лучше, чем я ожидал»."
211080-94 = ""
211080-95 = "Сенсей! Значит, решили сами на всё посмотреть?"
211080-96 = ""
211080-100 = ""
211080-101 = "Добро пожаловать, Сенсей."
211080-102 = "Приветики, Сенсей!"
211080-103 = "Я-ха! Всё верно, теперь все соблюдают правила по собственной воле. Удивлены?"
211080-104 = "И не забывайте: сегодня нас ждёт ОЧЕНЬ важное объявление."
211080-105 = "Раз Сенсей здесь, самое время его сделать. Вы снова нас поддержите, правда?"
211080-106 = "«Что нужно сделать»?"
211080-107 = "То же, что и в прошлый раз! Будьте собой! Ведите себя естественно! Но стойте рядом с нами и выглядите внушительно!"
211080-108 = ""
211080-110 = ""
211080-111 = "Всем привет! Ну что, хорошо проводите время?"
211080-112 = "Ещё как!"
211080-113 = "Рада слышать, потому что у нас для вас важное и невероятно весёлое объявление!"
211080-114 = "Чтобы создать для вас ещё более комфортные условия, отныне Зона безудержной стрельбы будет работать только в специально установленные часы!"
211080-115 = "Чего? То есть приходить когда вздумается больше нельзя?"
211080-116 = "Именно! Совершенно верно!"
211080-117 = "Бу-у! Ну уж нет! Почему?"
211080-118 = "Если придётся тащиться сюда по расписанию, тогда какой вообще смысл..."
211080-119 = "А в благодарность за вашу поддержку скоро пройдёт особое событие! Вы сможете заработать ВДВОЕ больше бонусных баллов!"
211080-120 = "Погодите! Серьёзно?"
211080-121 = "Мне как раз чуть-чуть баллов не хватает на новый прицел."
211080-122 = "Эх, но всё равно обидно, что время работы сокращают."
211080-123 = "Ага. Вот захочу я вдруг пальнуть в друга из гранатомёта — и что тогда?"
211080-124 = "Думаю, ты прекрасно знаешь, почему вне этой зоны так делать не стоит. Когда за тобой в последний раз гонялась Префектура?"
211080-125 = "Да поняла я. Всё-таки приятно, что наконец-то от нас отстали."
211080-126 = "Фу-фу. Если, конечно, тебе не больше нравится, когда за тобой гоняются и арестовывают."
211080-127 = "Конечно нет... И я больше ни минуты не выдержу наедине со своими мыслями в комнате саморефлексии."
211080-128 = ""
211080-130 = ""
211080-131 = ""
211080-132 = "После того как я почувствовала здесь свободу, отказываться от неё уже не хочется."
211080-133 = "К тому же немного потерпеть иногда даже полезно, знаешь ли."
211080-134 = ""
211080-136 = ""
211080-137 = "А? Это как?"
211080-138 = "Ну, когда внутри постепенно нарастает напряжение и желание, и ты предвкушаешь тот самый момент..."
211080-139 = "Ч-что?"
211080-140 = "Понимаешь, о чём я? Это покалывание. Когда нетерпение всё нарастает, подводит тебя к самому пределу... И вдруг — ба-бах!! Всё, что копилось внутри, вырывается наружу!"
211080-141 = "Почему это звучит так пугающе?"
211080-142 = "..."
211080-143 = "А мне... мне, кажется, понравится! Ладно, я согласна!"
211080-144 = "Я-ха! Если удовольствие доступно в любой момент, острота ощущений теряется."
211080-145 = "Плод кажется ещё слаще, если долго ждать... и терпеть... прежде чем сорвать его."
211080-146 = ""
211080-147 = "Хм, а ведь она дело говорит."
211080-148 = "Может, и правда стоит иногда откладывать удовольствие... Хоть пару раз."
211080-149 = "Эм, так когда нам МОЖНО пользоваться зоной?"
211080-150 = ""
211080-152 = ""
211080-153 = "Я раздам расписание. За мной."
211080-155 = "Некоторое время спустя..."
211080-157 = "Фух, всё прошло гораздо лучше, чем я ожидала!"
211080-158 = "Спасибо, Сенсей! Одно ваше присутствие рядом нам очень помогло!"
211080-159 = "«Зачем мы ограничили время работы», спрашиваете?"
211080-160 = "За этим местом нужен постоянный уход. Мы не можем держать его открытым круглые сутки."
211080-161 = "Ограничить часы работы предложила Шоуко."
211080-162 = "Сенсей, только подумайте! Раньше студенты стреляли и устраивали взрывы где угодно и когда угодно!"
211080-163 = "А ТЕПЕРЬ они знают, что можно прийти сюда, специально выделить время и выпустить пар в более организованной обстановке. И они уже привыкли!"
211080-164 = "И раз уж мы приучили всех соблюдать границы МЕСТА... Почему бы заодно не приучить их соблюдать границы ВРЕМЕНИ?"
211080-165 = ""
211080-167 = ""
211080-168 = "По Геенне прокатывается волна дисциплины и порядка!"
211080-169 = "Студенты станут менее импульсивными, а значит, мы сделаем ещё один шаг к великой и единой Геенне! Что скажете?"
211080-170 = "Постепенно приучаем их к дисциплине и контролю... Совсем как лягушку, которую медленно варят в котле."
211080-171 = "Я-ха! Когда ты так говоришь, звучит жутковато! Шоуко, ну и фантазия у тебя, честное слово."
211080-172 = "Но если не считать эту часть про «свариться заживо», она права. Мы добиваемся перемен постепенно, небольшими посильными шагами."
211080-173 = "В конце концов, взгляды человека не меняются за одну ночь... Обычно."
211080-174 = "Ага, у нас же нет никакого луча для контроля разума! Ха-ха-ха!"
211080-175 = "Верно. Фу-фу. Какая нелепость."
211080-176 = "Чем дальше, тем яснее вижу, что наши труды не напрасны."
211080-177 = "Прощай, беспорядочная, хаотичная Геенна, где всё идёт наперекосяк."
211080-178 = "Все эти буйные студенты своим поведением затмевали невероятный потенциал Геенны!"
211080-179 = "Если мы продолжим менять всё понемногу и незаметно приучать их к правилам и порядку, наша академия станет величайшей во всём Кивотосе!"
211080-180 = "[s1] «Мне трудно представить...»\n[s2] «...Такую Геенну»."
211080-183 = "А? Что за реакция? Я думала, вы будете нас подбадривать!"
211080-184 = "Разве вы не хотите, чтобы Геенна стала ЕЩЁ величественнее?"
211080-185 = "[s3] «Нет, я не это имел в виду».\n[s4] «Просто как бы это объяснить...?»"
211080-188 = "Что вы имеете в виду под нашей «самобытностью»?"
211080-189 = "Разве самобытность не формируется со временем? Разве она не меняется?"
211080-190 = "Мне стоит поддерживать возможности «каждого студента в отдельности, а не академии в целом»? Эм..."
211080-191 = "Возможно! Звучит разумно, но..."
211080-192 = ""
211080-194 = ""
211080-195 = "...Ведь мы все части единого целого. Значит, это «наш» общий потенциал, разве нет?"
211080-196 = "..."
211080-197 = "«Путей к величию может быть много»? Но..."
211080-198 = "Разве нам не следует действовать сообща, согласованно, стремиться к одной цели? Раньше Геенна никогда не могла на такое, а теперь может."
211080-199 = ""
211080-202 = ""
211080-203 = "Дух сотрудничества и чувство единства необходимы, чтобы построить великую, славную Геенну."
211080-204 = "Ведь никто не ЗАСТАВЛЯЛ студентов сюда поступать!"
211080-205 = "Они выбрали Геенну, потому что здесь весело, потому что сюда поступили их друзья или просто из любопытства. Им хотелось стать частью чего-то большего."
211080-206 = "Мы никого ни к чему не принуждали. Перемены ничего не стоят, если они навязаны силой."
211080-208 = ""
211080-209 = ""
211080-210 = ""
211080-211 = ""
211080-212 = ""
211080-213 = "[ns] «Да. Возможно, я зря волновался»."
211080-214 = "Хи-хи, вот именно! А вы просто продолжайте поддерживать студентов, как и прежде, Сенсей."
211080-215 = ""
211080-217 = ""
211080-218 = "«Я готов отдать жизнь за Геенну, так что не беспокойтесь»."
211080-219 = "...Вы ведь именно это подумали, правда, Сенсей?"
211080-220 = "[s] «Ничего подобного я НЕ думал!»"
211080-221 = "Ц."
211080-222 = "Не отвлекаемся! У нас у всех одна задача!"
211080-223 = "Вернуть Геенне былую славу!"
211080-224 = "За единую Геенну!"
211080-225 = ""
211080-226 = ""
211080-227 = ""
211080-228 = ""
211080-229 = "Студенты с энтузиазмом трудились ради лучшего будущего."
211080-230 = "Моя задача как взрослого — не мешать им и поддерживать их начинания."
211080-232 = "...Мне казалось, что так будет лучше для всех."
211080-234 = "Следующий эпизод;Возможность"
