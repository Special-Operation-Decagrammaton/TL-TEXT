[translation]
211080-1 = "Episódio 08;Zona do Gatilho Fácil"
211080-3 = "(Um burburinho incomum tomou conta da praça)"
211080-4 = "[ns] \"O que será aquilo...?\""
211080-5 = ""
211080-7 = "A senha! Me dá a minha senha da fila! Eu fiquei esperando a manhã inteira!"
211080-8 = ""
211080-10 = ""
211080-11 = ""
211080-12 = "Calma, calma aí... pronto, dados confirmados!#nParabéns! Você é a primeiríssima da fila hoje!"
211080-13 = ""
211080-15 = ""
211080-16 = "Bora lá, galera! Quem quer senha, vai fazendo fila indiana bonitinha aqui!"
211080-17 = ""
211080-19 = ""
211080-20 = "Nossa, dormi no ponto... É aqui o fim da fila?"
211080-21 = "Correto. Pode aguardar aqui. Sua senha é a de número 27."
211080-22 = "Já foi parar tão longe assim?! Eu sabia que tava cheio, mas..."
211080-23 = "O fluxo é ágil, logo chegará a sua vez."
211080-24 = "...Atingimos a cota de trinta discentes, portanto o primeiro pelotão já pode marchar.#nPor gentileza, mantenham a formação em fila."
211080-25 = ""
211080-27 = ""
211080-28 = ""
211080-29 = ""
211080-30 = ""
211080-31 = ""
211080-32 = ""
211080-34 = ""
211080-36 = ""
211080-38 = "Fazer as coisas em conjunto desse jeito é bem legal, né?"
211080-39 = "Pior que é! Depois que pega o costume, meio que vicia!"
211080-40 = "Quando me dei conta, já tinha juntado um monte de pontos.#nQuantos pontos vocês duas já têm acumulados?"
211080-42 = ""
211080-43 = "O que tá rolando ali...?"
211080-44 = "Fila pra quê?"
211080-45 = "Hihihi! Bateu a curiosidade?#nEntão toma... aqui está o folheto informativo!"
211080-46 = ""
211080-48 = ""
211080-49 = "Ué? Ah, valeu."
211080-50 = ""
211080-52 = ""
211080-53 = ""
211080-54 = "Deixa eu ver...#n'Tiroteio, explosões e adrenalina liberados! Conheça a Zona do Gatilho Fácil onde tudo é permitido'?"
211080-55 = "'Nunca mais tema o Comitê de Disciplina!'... É sério isso?!"
211080-56 = "Nem sabia que existia um lugar desses por aqui."
211080-57 = "Bora lá dar uma olhada?"
211080-58 = "Bom, mal não vai fazer. Pelo menos rende assunto.#nSe for chato, a gente toca o terror do jeito tradicional mesmo!"
211080-59 = ""
211080-61 = ""
211080-68 = ""
211080-69 = "Caraca, achei muito louco!"
211080-70 = "É só chegar e usar? Já posso começar a descarregar o pente?!"
211080-71 = "Por ordem de chegada, quem chega primeiro leva!#nA fila começa bem aqui, pessoal!"
211080-72 = ""
211080-73 = ""
211080-74 = ""
211080-75 = ""
211080-76 = ""
211080-77 = "Opa, qual foi?! Eu cheguei primeiro!"
211080-78 = "Você tava moscando parada no canto!#nQuem entrou na fila primeiro fui eu. Vai pro finalzinho da fila, vai."
211080-79 = "Qual é a sua?! Respeita as regras, garota!"
211080-80 = "Regra? Tem regra especial só pra você agora?#nA regra oficial é por ordem de chegada na fila. Entendeu ou quer que desenhe?"
211080-81 = "Ei, fiscal! Tem uma folgada querendo dar golpe aqui! Dá um jeito nela!"
211080-82 = ""
211080-84 = ""
211080-85 = "Opa, opa! Sem furar fila, pessoal! A ordem de chegada tem que ser respeitada."
211080-86 = "Você prefere ficar quietinha no seu lugar aí ou quer recomeçar do final da fila? Escolhe aí."
211080-87 = "...T-Tá bom, já entendi. Eu espero a minha vez."
211080-88 = ""
211080-90 = ""
211080-91 = "Muito bem. Seguir a ordem poupa tempo pra todo mundo."
211080-93 = "[ns] \"As alunas estão respeitando as regras bem melhor do que eu imaginava.\""
211080-94 = ""
211080-95 = "Sensei! Você veio!"
211080-96 = ""
211080-100 = ""
211080-101 = "Seja muito bem-vindo."
211080-102 = "E aí, Sensei!"
211080-103 = "Todo mundo tá seguindo as nossas regras à risca!#nHahaha, não é demais?!"
211080-104 = "Ah, é mesmo! Hoje a gente tem um comunicado super importante pra dar!"
211080-105 = "Já que você tá aqui, vamos fazer o anúncio agora mesmo.#nPode nos dar uma mãozinha de novo?"
211080-106 = "O que você precisa fazer?"
211080-107 = "A mesma coisa de antes! Só fica de pé do nosso lado com essa presença imponente!"
211080-108 = ""
211080-110 = ""
211080-111 = "ATENÇÃO, PESSOAL! VOCÊS ESTÃO SE DIVERTINDO?!"
211080-112 = "SIM!!"
211080-113 = "Temos um comunicado importantíssimo para todas!!"
211080-114 = "Para oferecer um ambiente ainda melhor e mais organizado, a 'Zona do Gatilho Fácil'――#npassará a ter horários pré-determinados de funcionamento!"
211080-115 = "Quê?! Não vai mais ser vinte e quatro horas liberado?!"
211080-116 = "Precisamente!"
211080-117 = "Qual é, por que isso?!"
211080-118 = "Se botarem limite até de horário, perde a graça de vir aqui!"
211080-119 = "POOORÉM... Em contrapartida, lançaremos um evento especial!#nUma oportunidade fantástica de acumular PONTOS EM DOBRO!"
211080-120 = "Eita! Pontos em dobro?!"
211080-121 = "Salvou a pátria! Tava faltando pouquinho pra eu trocar pela mira holográfica nova!"
211080-122 = "Mas restringir o horário do tiroteio ainda é meio paia..."
211080-123 = "Pois é. E se der aquela vontade incontrolável de atirar de madrugada, faz como?"
211080-124 = "Pessoal, puxem pela memória:#nquando foi a última vez que vocês viram o Comitê de Disciplina por aqui?"
211080-125 = "Bem... é verdade. Aqui dentro a gente atira e explode tudo sem o comitê brotar do bueiro..."
211080-126 = "Fufufu. Viver sendo perseguida, algemada e levada arrastada dia sim, dia não... Não é nada agradável, convenhamos."
211080-127 = "...Ser jogada na solitária é um pesadelo horrível mesmo..."
211080-128 = ""
211080-130 = ""
211080-131 = ""
211080-132 = "Mas aqui dentro a gente tem 'liberdade'..."
211080-133 = "E cá entre nós: segurar a vontade um pouquinho nem é tão ruim assim, sabia?"
211080-134 = ""
211080-136 = ""
211080-137 = "Como assim?"
211080-138 = "Segurar o ímpeto no peito... pra soltar tudo de uma vez só na hora certa!"
211080-139 = "...Do que você tá falando?"
211080-140 = "Sabe aquela coceira incontrolável?! Aquela frustração prestes a estourar, e de repente... BOOOM! Disparar com tudo! O êxtase é mil vezes maior!"
211080-141 = "Essa conversa tá tomando um rumo meio estranho, não tá...?"
211080-142 = "Mas..."
211080-143 = "...Pior que faz sentido! Pode ser uma boa!"
211080-144 = "Prazer fácil que você tem a qualquer segundo perde a graça com o tempo, né?"
211080-145 = "Ficar na vontade... aguentar... resistir... 'não aguento mais, cheguei no limite!'#nAí quando finalmente você explode tudo, a sensação bate muito mais forte!"
211080-146 = ""
211080-147 = "Pensando por esse lado... até que tem lógica."
211080-148 = "Aguentar um pouquinho não custa nada, vai."
211080-149 = "E afinal, quais vão ser os horários liberados pra gente vir?"
211080-150 = ""
211080-152 = ""
211080-153 = "Quem desejar detalhes das faixas horárias, dirija-se à bancada cadastral."
211080-155 = "(Momentos depois)"
211080-157 = "Ufa! O anúncio correu muito mais tranquilo do que eu imaginava!"
211080-158 = "Tudo graças ao Sensei! Só de você ficar ali imponente já impõe maior respeito!"
211080-159 = "Hum? Por que restringimos os horários de vez?"
211080-160 = "Ah, ficar vinte e quatro horas por dia cuidando disso é humanamente impossível.#nNós somos estudantes, não dá pra morar aqui dentro."
211080-161 = "Essa foi uma sacada brilhante da Shoko-chan～"
211080-162 = "Pensa comigo, Sensei!#nAntes, a rotina de Gehenna era tiroteio e granada em qualquer esquina sem hora nem lugar, né?"
211080-163 = "Mas agora mudou! Pra desabafar o estresse, as alunas vêm de livre e espontânea vontade pra cá.#nA rotina e os hábitos delas já começaram a mudar!"
211080-164 = "Agora, se alunas que já aprenderam a respeitar o local também aprenderem a respeitar o horário, o que você acha que acontece?"
211080-165 = ""
211080-167 = ""
211080-168 = "――A ordem e a disciplina começam a nascer de verdade em Gehenna!!"
211080-169 = "A baderna irracional e a anarquia vão evaporar, e Gehenna ficará cada vez mais grandiosa! Não é fantástico?!"
211080-170 = "Habituá-las gradualmente ao regramento institucional... precisamente como a teoria da rã na panela fervente."
211080-171 = "Caraca, Shoko, você falando assim faz a gente parecer uma seita do mal!#nVocê tem um lado bem sinistro às vezes, credo!"
211080-172 = "Embora seja uma analogia assustadoramente perfeita."
211080-173 = "Salvo em anomalias estatísticas, a mentalidade humana não se transforma da noite para o dia."
211080-174 = "Se existisse hipnose em massa seria bem mais rápido, mas né... isso não existe!"
211080-175 = "Certamente."
211080-176 = "Mas... é por isso mesmo que todo esse suor tá valendo a pena!"
211080-177 = "Chegou a hora de dizer adeus praquela Gehenna caótica e sem futuro!"
211080-178 = "Antes ninguém dava nada pelo potencial da nossa escola..."
211080-179 = "Mas eu tenho certeza de que um dia Gehenna será a academia mais ordeira, limpa e grandiosa de todas!"
211080-180 = "[s1] \"Uma Gehenna assim, é...?\"\n[s2] \"É meio difícil de imaginar...\""
211080-183 = "Ué, Sensei? Que resposta mais chocha foi essa?"
211080-184 = "Não curtiu muito a ideia?"
211080-185 = "[s3] \"Não é isso, é que...\"\n[s4] \"Fico pensando na identidade de Gehenna.\""
211080-188 = "Ué, como assim?"
211080-189 = "Identidade é algo que a gente forja daqui pra frente, não é?"
211080-190 = "Acreditar no potencial individual de cada aluna..."
211080-191 = "É uma postura que combina demais com você, Sensei!"
211080-192 = ""
211080-194 = ""
211080-195 = "Afinal... você acreditou no nosso potencial desde o início."
211080-196 = "......"
211080-197 = "O caminho da grandeza não é único... e ninguém precisa ser uma cópia da outra, entendo..."
211080-198 = "Mas olha, caminhar rumo a um mesmo objetivo comum é algo maravilhoso, não acha?#nGehenna nunca teve isso antes."
211080-199 = ""
211080-202 = ""
211080-203 = "Cooperação mútua e consciência coletiva constituem atributos basilares para uma Gehenna restaurada."
211080-204 = "E além do mais: todas as alunas aqui presentes se reuniram por livre arbítrio."
211080-205 = "Porque acharam legal, porque a amiga convidou, ou por pura curiosidade.#nOs motivos variam, mas o primeiro passo veio delas mesmas."
211080-206 = "A gente jamais forçaria nada de goela abaixo. Mudança na marra não dura um dia."
211080-208 = ""
211080-209 = ""
211080-210 = ""
211080-211 = ""
211080-212 = ""
211080-213 = "[ns] \"Entendi... acho que eu estava me preocupando além da conta.\""
211080-214 = "Viu só?! O seu papel como professor é só confiar na gente e torcer pelo nosso sucesso!"
211080-215 = ""
211080-217 = ""
211080-218 = "Daqui pra frente, empenharemos corpo e alma por Gehenna, então pode relaxar o coração."
211080-219 = "――Foi o que o Sensei ponderou intimamente."
211080-220 = "[s] \"Eu não cheguei a pensar tão longe assim!\""
211080-221 = "Ah, que sem graça..."
211080-222 = "De qualquer forma, a nossa missão continua uma só!"
211080-223 = "TORNAR GEHENNA GRANDE DE NOVO!!"
211080-224 = "Por uma Gehenna unida e imbatível!"
211080-225 = ""
211080-226 = ""
211080-227 = ""
211080-228 = ""
211080-229 = "(Elas estão trilhando com coragem o caminho que escolheram por conta própria)"
211080-230 = "(Como adulto e professor, meu dever é dar o suporte necessário para que avancem)"
211080-232 = "(Decidi colocar todo o meu empenho para apoiá-las neste momento)"
211080-234 = "A Seguir;Uma Oportunidade"