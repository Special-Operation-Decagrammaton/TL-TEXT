[translation]
211080-1 = "Episode 8;Trigger Happy Zone"
211080-3 = "(Somehow, the plaza seems even noisier than usual.)"
211080-4 = "[ns] \"What is that...?\""
211080-7 = "A numbered ticket! Give me a numbered ticket! I've been waiting forever!"
211080-12 = "Just a moment... Alright, verification complete! #nCongratulations! You're the first one today!"
211080-16 = "Alright everyone, line up in a single file to get your numbered tickets!"
211080-20 = "Ugh, I'm late... Is this the right line?"
211080-21 = "Yes. Please wait in line as you are. That makes you number 27."
211080-22 = "Is it already that far back? I thought there were a lot of people, but..."
211080-23 = "Your turn will come around soon."
211080-24 = "...Alright, we've reached 30 people, so let's have the first group head out. #nEveryone, please move forward in line."
211080-38 = "Moving together like this is surprisingly fun, isn't it?"
211080-39 = "I know, right! It's like it becomes a habit once you start."
211080-40 = "Before you know it, you've racked up a ton of points. #nHow many have you two got?"
211080-43 = "What's that...?"
211080-44 = "What's the line for?"
211080-45 = "Heh heh heh, curious? #nWell then... here, have a pamphlet!"
211080-49 = "Huh? Oh, thanks."
211080-54 = "Let's see... #n'Shoot, blow things up, anything goes! The anything-goes Trigger Happy Zone'?"
211080-55 = "'No more fear of the Prefect Team!'...?"
211080-56 = "I didn't know a place like this existed."
211080-57 = "Want to go check it out?"
211080-58 = "Well, it might make for a good story. #nIf it's not that great, we can just go on a rampage like always!"
211080-69 = "Oh, that sounds good!"
211080-70 = "Can we use it as soon as we get there? Can I start shooting already?"
211080-71 = "It's first-come, first-served, so hurry up! #nYes, line up right here!"
211080-77 = "Hey, what gives!? I was here first!"
211080-78 = "No, you were just standing around in a weird spot. #nI got in line first. You go to the back."
211080-79 = "Huh? What's that supposed to mean! Follow the rules!"
211080-80 = "Huh? Do you have your own special rules? #nThe rule here is first-come, first-served in line. Get it?"
211080-81 = "Hey, staff! Someone's being selfish here! Do something about it!"
211080-85 = "Alright, alright, no cutting in line, okay? Let's respect the order."
211080-86 = "Do you want to wait patiently, or go to the very back of the line? Which will it be?"
211080-87 = "...F-fine, I get it. I'll follow the order."
211080-91 = "Good. That'll be faster for everyone in the end."
211080-93 = "[ns] \"Everyone's following the rules better than I expected.\""
211080-95 = "Sensei! You came!"
211080-101 = "Welcome."
211080-102 = "Yahoo, Sensei!"
211080-103 = "Everyone is following the rules we made. #nIsn't that amazing?"
211080-104 = "Oh, that's right! Actually, today... we have an important announcement."
211080-105 = "Since you're here, Sensei, let's do it now. #nWill you help us again?"
211080-106 = "Oh, is it something for me to do?"
211080-107 = "Same as before! I just want you by my side!"
211080-111 = "Everyone! Are you having fun!?"
211080-112 = "Yeah!"
211080-113 = "We have an important announcement today!"
211080-114 = "To provide a better environment, the 'Trigger Happy Zone' will now— #nhave set operating hours!"
211080-115 = "Wait, so it won't be 24 hours anymore!?"
211080-116 = "That's right!"
211080-117 = "Why!?"
211080-118 = "If you're going to set hours, what's the point of coming here?"
211080-119 = "B-but... in exchange, we're holding a special event! #nA chance to earn double the points!"
211080-120 = "Oh! For real!?"
211080-121 = "That helps. I was just a little short for that new scope."
211080-122 = "But still, having my time restricted is..."
211080-123 = "Exactly. What if I suddenly feel like shooting something?"
211080-124 = "Everyone, think back. #nWhen was the last time you saw the Prefect Team?"
211080-125 = "That's... well. Here, we can shoot and blow things up without the Prefect Team showing up..."
211080-126 = "Fufu. Getting chased, getting arrested. Over and over. That's not fun, is it?"
211080-127 = "...I don't want to be sent to the reflection room."
211080-132 = "But here, we're 'free'..."
211080-133 = "Besides, maybe holding back isn't so bad."
211080-137 = "What do you mean?"
211080-138 = "Holding it all in, then letting it all explode at once later."
211080-139 = "...What are you talking about?"
211080-140 = "You know... that itchy feeling! #nThe pleasure of unleashing all that pent-up frustration in one big BOOM!"
211080-141 = "Is this conversation getting dangerous...?"
211080-142 = "But..."
211080-143 = "...I get it. That might actually be good!"
211080-144 = "Pleasure you can get anytime eventually loses its value, right?"
211080-145 = "Holding back... waiting... enduring... I can't take it anymore, I'm at my limit...! #nThe pleasure you get at that moment. It really hits different."
211080-147 = "When you put it that way, I guess..."
211080-148 = "Maybe holding back once in a while isn't so bad."
211080-149 = "Wait, so when can we actually use it?"
211080-153 = "If you want to hear the details, please gather over here."
211080-155 = "(A while later)"
211080-157 = "Phew. That went smoother than I thought!"
211080-158 = "Sensei, you're a lifesaver! It's a huge help just having you there."
211080-159 = "Hm? Why did we limit the hours?"
211080-160 = "Well, 24 hours is impossible. Managing this is our job. #nWe can't just be stuck here forever."
211080-161 = "This was Shoko's idea~"
211080-162 = "Sensei, think about it! #nBefore, we'd shoot anywhere, throw bombs, and that was just daily life, right?"
211080-163 = "But it's different now. They've started coming here specifically to vent their stress. #nTheir habits are starting to change!"
211080-164 = "So, what do you think happens if the students who started protecting this place also start respecting the time?"
211080-168 = "—Rules and order will be born in Gehenna!!"
211080-169 = "Reckless and selfish behavior will decrease, and we'll get closer to a great Gehenna! How about that? How about that?"
211080-170 = "Slowly getting them used to discipline and control... just like the boiling frog theory."
211080-171 = "Yaha, that makes us sound like an evil organization. #nShoko-chan, you can be pretty dark sometimes~"
211080-172 = "I think it's a perfect analogy, though."
211080-173 = "Unless it's a very special case, people's way of thinking doesn't change in a day or so."
211080-174 = "It would be easier if we had hypnosis... but that's impossible!"
211080-175 = "That's true."
211080-176 = "But... that's exactly why it's worth working hard, step by step."
211080-177 = "Say goodbye to the disorderly and chaotic Gehenna!"
211080-178 = "We couldn't see Gehenna's potential before, but..."
211080-179 = "I'm sure one day it will be more orderly, beautiful, and proud than any other academy!"
211080-180 = "[s1] \"That kind of Gehenna...\"\n[s2] \"I can't really imagine it...\""
211080-183 = "Sensei, why is your reaction so lukewarm?"
211080-184 = "Are you not really into it?"
211080-185 = "[s3] \"It's not that...\"\n[s4] \"It's about the identity.\""
211080-188 = "Why?"
211080-189 = "Can't we just build an identity from here on out?"
211080-190 = "Oh, hmm... believing in the potential of each and every student is..."
211080-191 = "I think that's a very 'Sensei' opinion!"
211080-195 = "Because... you believed in our potential, didn't you?"
211080-196 = "..."
211080-197 = "There's more than one path to greatness... so we don't all have to be the same, huh..."
211080-198 = "But wouldn't it be wonderful if we could all aim for the same place? #nGehenna has never been able to do that."
211080-203 = "Cooperation and collective consciousness are essential qualities for a great Gehenna."
211080-204 = "Besides, every student here gathered of their own free will."
211080-205 = "Because it looked fun, because a friend was going, because they were just curious. #nEven if the reasons are different, they moved on their own."
211080-206 = "We will never force them. There's no point in changing by force."
211080-213 = "[ns] \"I see, maybe I was just worrying too much.\""
211080-214 = "Exactly! I want you to believe in the students and support us, Sensei."
211080-218 = "From now on, I'll work with the determination to give my all for Gehenna, so you don't have to worry."
211080-219 = "—That is what Sensei thought."
211080-220 = "[s] \"I wasn't thinking that far!\""
211080-221 = "Che."
211080-222 = "Anyway, there's only one thing for us to do!"
211080-223 = "Make Gehenna great again!!"
211080-224 = "For a united Gehenna!"
211080-229 = "(The students are trying to walk the path they chose themselves.)"
211080-230 = "(As an adult, I will support those feelings.)"
211080-232 = "(I decided in my heart to give it my all.)"
211080-234 = "Next Episode;Chance"