[translation]
211040-1 = "Episode 4;Make Gehenna Great Again...!"
211040-3 = "[ns] \"…….\""
211040-5 = "……."
211040-6 = "……."
211040-7 = "……."
211040-9 = "[ns] \"Um... hello?\""
211040-10 = "It's the real deal... so this is what a Sensei from Schale is like."
211040-11 = "I think we'll get along, right?"
211040-12 = "Sensei, it's a pleasure to meet you."
211040-13 = "[s] \"You're the ones who called me... is that right?\""
211040-14 = "Yep! We're the ones who sent the message!"
211040-15 = "Oh, is it okay if we talk casually? I don't really like feeling like there's a distance between us."
211040-19 = "You've been talking casually the whole time, though."
211040-20 = "I'd like to keep things frank too~"
211040-21 = "I apologize on their behalf. Please, forgive them."
211040-22 = "Are you the only one who's going to keep acting like that, Shoko?"
211040-23 = "It's too late to pretend to be polite now. Even though you ate all the snacks we were going to give to Sensei by yourself."
211040-24 = "That! ...is not important right now!!"
211040-25 = "[s] \"You all are very energetic.\""
211040-29 = "Sorry, sorry. We got a little carried away just between ourselves."
211040-30 = "We have a favor to ask of you, Sensei."
211040-31 = "……."
211040-32 = "Please help the Gehenna Restoration Committee!!"
211040-33 = "[s1] \"I've heard a bit about what kind of committee it is, but...\"\n[s2] \"What do you need me to do?\""
211040-36 = "Shoko! Please explain!"
211040-40 = "Once again, I am Shoko Igarashi, the secretary of the Gehenna Restoration Committee."
211040-41 = "We are a group of students aiming to make Gehenna great again and achieve a \"Unified Gehenna.\""
211040-42 = "That said, the committee was only recently established."
211040-43 = "Currently, we lack external influence."
211040-44 = "So, we thought that if we could involve a Sensei from Schale as a collaborator, it would add some prestige."
211040-45 = "In other words, we're borrowing the tiger's authority."
211040-46 = "Is it really okay to say that to their face?"
211040-50 = "We cannot afford to be picky about our methods if we want to secure cooperation."
211040-51 = "Wha...!"
211040-52 = "Sensei's authority is something everyone in Kivotos acknowledges."
211040-56 = "However... strong light casts deep shadows. There are rumors that you use the General Student Council to satisfy your own desires. So, I thought it would be better to be frank—"
211040-57 = "[s] \"That's not true at all!\""
211040-58 = "My apologies for that."
211040-59 = "Did we just ruin our first impression?"
211040-60 = "A-anyway!"
211040-61 = "We love Gehenna. We're proud to be students of Gehenna."
211040-62 = "That's why we want Gehenna to be more recognized, and we want to be able to do cooler things at this academy."
211040-63 = "[s] \"That's a good mindset to have.\""
211040-64 = "Right~? That's why we want to change Gehenna."
211040-67 = "But, not everyone thinks that way, you know."
211040-69 = "Huh, what's that supposed to mean..."
211040-70 = "You're so serious."
211040-72 = "An academy is just an academy, right? Isn't it just a place you either like or dislike?"
211040-74 = "Gehenna's image? Hmm, chaos?"
211040-78 = "Huh? Why would I be bothered by that? It's just the truth."
211040-79 = "Besides, denying it won't change anything."
211040-80 = "And honestly, isn't it a good thing? I wouldn't be able to stand an academy like Trinity."
211040-81 = "Ugh. Yeah, that'd be impossible..."
211040-82 = "You definitely couldn't skip class to go have fun there, right?"
211040-83 = "And you couldn't smash a vending machine to steal a juice, right?"
211040-84 = "Well, you'd probably get caught by the Prefect Team in Gehenna too, but... isn't it great that you can do whatever you want until you get caught?"
211040-86 = "Basically, that's how it is."
211040-87 = "[s3] \"...I see.\"\n[s4] \"I suppose that's a common story in Gehenna...\""
211040-90 = "There are almost no students who think about trying to improve Gehenna. Everyone just wants to do whatever they please."
211040-91 = "But that only leads to chaos."
211040-92 = "Since everyone's desires are all over the place, it's impossible to get them to work together on anything."
211040-93 = "The Pandemonium Society and the Prefect Team are always at each other's throats. They have absolutely no intention of joining hands."
211040-94 = "Council President Makoto and Prefect Hina seem obsessed with a \"Free Gehenna,\" but... honestly, I don't really see what's so good about that."
211040-95 = "In the end, we're lacking everything, and this is the state we're in."
211040-96 = "Don't you think so too, Sensei? That Gehenna's school culture is completely different from other academies."
211040-97 = "[s] \"...I can't deny that.\""
211040-98 = "But, it seems Gehenna wasn't always like this."
211040-99 = "It was before I enrolled, so I don't know the details, but..."
211040-100 = "It seems there was a time when there was strict discipline and everyone followed the school rules."
211040-105 = "...That's a thing of the past that will never return."
211040-106 = "[s] \"So there was an era like that.\""
211040-107 = "I hear it was different from now in many ways."
211040-108 = "There must have been virtues back then that don't exist now."
211040-109 = "That's exactly why it gave us courage."
211040-110 = "Thinking that if such an era existed, maybe we could return to it."
211040-115 = "That's where we got the committee's name from, too!"
211040-119 = "Exactly. The club that will make Gehenna great again—the Gehenna Restoration Committee."
211040-120 = "And, back to the point... could you lend us your strength, Sensei?"
211040-121 = "[s] \"What kind of help do you need?\""
211040-122 = "Good question!"
211040-123 = "Actually, it's nothing major. We just want you to stand next to us when we're talking to people!"
211040-124 = "Sensei, you've earned the trust of Gehenna's students, after all. Our activities will have more persuasive power with you there."
211040-125 = "We've prepared a lot of things because we want to change Gehenna."
211040-126 = "It would be so reassuring if you could just add a word or two, you know~?"
211040-130 = "If you lend us a hand, we should be able to launch large-scale activities under your name."
211040-131 = "[s] \"...Hmm?\""
211040-132 = "Even if we exaggerate a little, the students will believe us without doubt if you're standing right there."
211040-133 = "Of course, we won't actually do that, so don't worry!"
211040-134 = "We want to make Gehenna great, so we can't cheat, right?"
211040-135 = "Tch."
211040-136 = "We are always fair and square. We're going to charge forward with all our might."
211040-137 = "[s5] \"Understood.\"\n[s6] \"I'll help you with all my might as well.\""
211040-143 = "Really!? You're agreeing to this so easily?"
211040-144 = "[s] \"It's my job to be a support for my students, after all.\""
211040-145 = "……."
211040-146 = "I'm starting to see what kind of person you are, Sensei."
211040-147 = "Yay, Sensei is so easygoing!"
211040-148 = "Thanks! It feels like the wind is finally in our sails!"
211040-152 = "Alright, let's go!!"
211040-153 = "[s] \"Right now!?\""
211040-154 = "We don't have time to hesitate!"
211040-155 = "If we drag our feet, our motivation will just cool down, right? You have to do things the moment you think of them!"
211040-160 = "The Committee Chair is always like this. She can't rest easy unless she's moving immediately."
211040-161 = "Well, that's one of her good points, though."
211040-162 = "Yay, Sensei seems like he'll get along great with us!"
211040-163 = "Sometimes momentum is important. Let's follow the Chair."
211040-164 = "Let's go, Sensei!"
211040-170 = "Next Episode;Make Gehenna Great...?"