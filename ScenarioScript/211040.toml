[translation]
211040-1 = "Episódio 04;Gehenna Grande de Novo......!"
211040-3 = "[ns] \"......\""
211040-4 = ""
211040-5 = "......"
211040-6 = "......"
211040-7 = "......"
211040-8 = ""
211040-9 = "[ns] \"É... olá? Tudo bem?\""
211040-10 = "É de verdade mesmo... Então o Sensei da Schale tem essa cara!"
211040-11 = "Eu até que curti o estilo, hein?"
211040-12 = "Sensei, é uma honra indescritível conhecê-lo pessoalmente."
211040-13 = "[s] \"Foram vocês que me chamaram... certo?\""
211040-14 = "Isso aí! Fomos nós que te mandamos mensagem!"
211040-15 = "Ah, posso falar sem cerimônia com você? Não sou muito fã dessa distância formal toda."
211040-16 = ""
211040-18 = ""
211040-19 = "Como se você já não estivesse falando na maior intimidade desde o início."
211040-20 = "Eu também quero tratar você na boa, beleza?"
211040-21 = "Peço desculpas pela grosseria das duas. Por favor, releve essa falta de compostura."
211040-22 = "Só você que vai manter essa pose de senhorita culta, Shoko?"
211040-23 = "Pagar de educada agora não cola mais.#nAinda mais depois de comer sozinha todos os doces que tinha comprado pro Sensei."
211040-24 = "Esse assunto...! ...Não tem a menor relevância neste momento!!"
211040-25 = "[s] \"Vocês são bem animadas, hein.\""
211040-26 = ""
211040-28 = ""
211040-29 = "Foi mal, foi mal! A gente acabou se empolgando no nosso mundinho."
211040-30 = "A verdade é que temos um grande pedido para fazer a você, Sensei."
211040-31 = "......"
211040-32 = "Ajuda o Comitê de Restauração de Gehenna!!"
211040-33 = "[s1] \"Já ouvi falar por cima sobre o comitê...\"\n[s2] \"O que exatamente preciso fazer?\""
211040-36 = "Shoko! Pode mandar ver na explicação!"
211040-37 = ""
211040-39 = ""
211040-40 = "Apresentando-me formalmente mais uma vez: sou [ruby=Igarashi]Shoko Igarashi[/ruby], secretária do Comitê de Restauração de Gehenna."
211040-41 = "Nossa organização é um coletivo de alunas cujo propósito é reerguer a grandeza de Gehenna rumo a uma 'Gehenna Unida'."
211040-42 = "Contudo, fomos fundadas recentemente."
211040-43 = "Nossa real influência política e externa ainda é expressivamente deficiente."
211040-44 = "Por essa razão, avaliamos que ter o ilustre Sensei da Schale como colaborador nos conferiria imenso prestígio."
211040-45 = "O famoso adágio da raposa que se aproveita do rugido feroz do tigre."
211040-46 = "Ô Shoko, falar isso na cara do próprio tigre não pega meio mal, não?"
211040-47 = ""
211040-49 = ""
211040-50 = "Para assegurar cooperação estratégica, não nos cabe o luxo de florear intenções."
211040-51 = "M-Mano...!"
211040-52 = "A autoridade moral do Sensei é reconhecida unanimemente em toda Kivotos."
211040-53 = ""
211040-55 = ""
211040-56 = "Entretanto... luzes reluzentes projetam sombras profundas.#nHá rumores nebulosos de que usa o Conselho Estudantil Federal para saciar desejos escusos...#nLogo, ser transparente desde o princípio me pareceu――"
211040-57 = "[s] \"Nada a ver isso aí!!\""
211040-58 = "Peço escusas pela indelicadeza da dedução."
211040-59 = "Nossa primeira impressão acabou de ser completamente assassinada, né?"
211040-60 = "D-De qualquer forma!"
211040-61 = "Nós amamos Gehenna de verdade! Temos o maior orgulho de estudar nesta escola!"
211040-62 = "Por isso queremos que Gehenna receba o devido reconhecimento, e queremos poder realizar feitos lendários aqui dentro!"
211040-63 = "[s] \"Essa é uma ótima atitude.\""
211040-64 = "Não é?! Por isso queremos transformar Gehenna com tudo!"
211040-65 = ""
211040-67 = "Só que... nem todo mundo enxerga as coisas desse jeito por aqui."
211040-68 = ""
211040-69 = "Ué, papo furado é esse...?"
211040-70 = "Quanta seriedade pra nada."
211040-71 = ""
211040-72 = "Escola é escola, ué. Pra que ficar amando ou odiando lugar de estudo?"
211040-73 = ""
211040-74 = "A imagem de Gehenna? Hum... pura anarquia?"
211040-75 = ""
211040-77 = ""
211040-78 = "Se eu acho ruim? Por que acharia? É a pura verdade."
211040-79 = "E mesmo se negar, não vai mudar nada."
211040-80 = "Aliás, nem é uma coisa ruim, sabia?#nSe eu estudasse num colégio de almofadinhas feito Trinity, surtava no primeiro dia."
211040-81 = "Nossa, nem me fale... pesadelo total."
211040-82 = "Lá com certeza não dá pra matar aula e sair vagabundeando por aí."
211040-83 = "Nem dá pra estourar a máquina de refrigerante pra pegar lata de graça!"
211040-84 = "Quer dizer, em Gehenna o Comitê de Disciplina te caça igual, mas...#no legal é poder aprontar tudo até ser pega, não é?"
211040-85 = ""
211040-86 = "Em linhas gerais... é nesse nível aí."
211040-87 = "[s3] \"......É verdade.\"\n[s4] \"É uma opinião bem típica de se ouvir em Gehenna...\""
211040-90 = "Quase nenhuma aluna pensa em arregaçar as mangas pra melhorar o colégio.#nTodo mundo só quer tocar o terror do próprio jeito."
211040-91 = "Sendo que isso só gera ainda mais confusão e destruição."
211040-92 = "Como os interesses são totalmente divergentes, marchar em união é uma utopia."
211040-93 = "A [ruby=Pandemônio]Sociedade Pandemônio[/ruby] e o Comitê de Disciplina só sabem viver às turras. Não têm a menor intenção de apertar as mãos."
211040-94 = "A Presidente Makoto e a Presidente Hina são obstinadas por essa tal 'Gehenna Livre', mas...#nsinceramente, até agora eu não entendi o que há de tão bom nisso."
211040-95 = "No fim, falta tudo por aqui e o resultado é esse circo."
211040-96 = "Você não concorda, Sensei? Que a cultura de Gehenna é completamente fora da curva em relação às outras?"
211040-97 = "[s] \"......Não tem como negar, de fato.\""
211040-98 = "Só que me contaram que Gehenna nem sempre foi esse caos todo."
211040-99 = "Aconteceu antes de eu entrar na escola, então não sei dos detalhes exatos, mas..."
211040-100 = "Dizem que existiu uma era onde imperava uma disciplina de ferro e todo mundo seguia o regimento à risca."
211040-101 = ""
211040-103 = ""
211040-104 = ""
211040-105 = "......Uma história pretérita, sepultada no tempo."
211040-106 = "[s] \"Existiu mesmo uma época assim, então.\""
211040-107 = "Relatos atestam que aquele cenário diferia do atual sob múltiplos aspectos."
211040-108 = "Virtudes ausentes na modernidade indubitavelmente reluziam naquele ecossistema."
211040-109 = "Foi exatamente isso que nos deu coragem de lutar!"
211040-110 = "Se já existiu um momento grandioso desses, podemos trazê-lo de volta!"
211040-111 = ""
211040-113 = ""
211040-114 = ""
211040-115 = "O nome do nosso comitê nasceu justamente dessa ambição!"
211040-116 = ""
211040-118 = ""
211040-119 = "Exato. O clube incumbido de tornar Gehenna grande de novo――o Comitê de Restauração de Gehenna."
211040-120 = "Então, voltando ao assunto... Você nos emprestaria a sua ilustre força, Sensei?"
211040-121 = "[s] \"De que tipo de ajuda vocês precisam?\""
211040-122 = "Excelente pergunta!"
211040-123 = "Na real, não é nada de outro mundo.#nQuando a gente for discursar pro povo, só queremos que você fique de pé do nosso lado!"
211040-124 = "Visto que o Sensei goza de inestimável prestígio perante as discentes de Gehenna,#nnossas ações carregarão um peso persuasivo incomparável."
211040-125 = "A gente preparou um monte de coisa bacana pra sacudir Gehenna."
211040-126 = "Se o Sensei ainda soltar uma palavrinha amiga de apoio, vai ser ouro puro! O que acha?"
211040-127 = ""
211040-129 = ""
211040-130 = "Caso nos ofereça seu aval, poderemos empreender operações em escala colossal sob a chancela da sua honra."
211040-131 = "[s] \"......Hum?\""
211040-132 = "Mesmo que façamos pequenas extrapolações retóricas, as alunas acreditarão piamente ao verem o Sensei impassível ao lado."
211040-133 = "Claro que a gente NÃO vai fazer nada disso, pode ficar tranquilão!"
211040-134 = "Se queremos reconstruir a grandeza de Gehenna, trapaça está fora de cogitação!"
211040-135 = "Tsc."
211040-136 = "A nossa conduta é límpida e transparente! Vamos encarar qualquer obstáculo de frente!"
211040-137 = "[s5] \"Tudo bem.\"\n[s6] \"Vou colaborar no que estiver ao meu alcance.\""
211040-140 = ""
211040-142 = ""
211040-143 = "Sério mesmo?! Você topou assim de primeira, de boa?!"
211040-144 = "[s] \"Apoiar os alunos é o meu trabalho, afinal.\""
211040-145 = "......"
211040-146 = "A índole do Sensei acaba de se revelar com clareza cristalina."
211040-147 = "Aeee! O Sensei é dos nossos, curti a vibe!"
211040-148 = "Muito obrigada! Dá pra sentir o vento soprando a nosso favor!"
211040-149 = ""
211040-151 = ""
211040-152 = "Então bora pra cima!!"
211040-153 = "[s] \"Agora mesmo?!\""
211040-154 = "Não temos um segundo a perder com indecisões!"
211040-155 = "Se a gente ficar enrolando, o fogo da empolgação esfria!#nTeve a ideia brilhante, tem que botar pra rodar no ato!"
211040-156 = ""
211040-158 = ""
211040-159 = ""
211040-160 = "A Presidente é sempre essa loucura. Se não agir na hora, não sossega um milésimo."
211040-161 = "Mas, sinceramente, é isso que faz ela ser tão legal."
211040-162 = "Hihi! Dá pra ver que o Sensei tem tudo a ver com a nossa turma!"
211040-163 = "Em certas circunstâncias, o ímpeto voraz é indispensável. Vamos atrás da Presidente."
211040-164 = "Bora, Sensei!"
211040-165 = ""
211040-167 = ""
211040-168 = ""
211040-170 = "Próximo Episódio;Gehenna Grande de Novo......?"
