[translation]
211040-1 = "Эпизод 4;Слава Геенне...!"
211040-3 = "[ns] «...»"
211040-4 = ""
211040-5 = "..."
211040-6 = "..."
211040-7 = "..."
211040-8 = ""
211040-9 = "[ns] «З-здравствуйте?»"
211040-10 = "...Хм, понятно... Так вот какой он, Сенсей из Шале. Любопытно!"
211040-11 = "Меня всё устраивает."
211040-12 = "Приятно познакомиться, Сенсей."
211040-13 = "[s] «Вы меня звали?»"
211040-14 = "Ага! Это мы, Комитет по восстановлению Геенны, решили сами с вами связаться!"
211040-15 = "Можно мы будем общаться без лишних церемоний? Не хочется, чтобы вам было с нами неловко."
211040-16 = ""
211040-18 = ""
211040-19 = "Маюми, ты и так без всяких церемоний."
211040-20 = "И я тоже! Яха!"
211040-21 = "Простите за их непосредственность, Сенсей. Знайте, что мы уважаем вас как старшего и авторитетного человека."
211040-22 = "Шоуко, ты нас смущаешь..."
211040-23 = "Это ты-то решила изображать мисс Вежливость? Особенно после того, как слопала все угощения, которые мы приготовили для Сенсея!"
211040-24 = "Это! Вообще! Не относится к делу!"
211040-25 = "[s] «Какая у вас весёлая компания»."
211040-26 = ""
211040-28 = ""
211040-29 = "Кхм, простите нас! Раскудахтались тут, словно курицы. Мы знаем, что вы ОЧЕНЬ заняты..."
211040-30 = "Поэтому сразу к делу. Мы хотим кое о чём попросить. ПОЖАЛУЙСТА, выслушайте нас!"
211040-31 = "..."
211040-32 = "Сенсей, пожалуйста, помогите Комитету по восстановлению Геенны!!!"
211040-33 = "[s1] «Я немного слышал о вашем клубе...»\n[s2] «Но чем именно я могу вам помочь?»"
211040-36 = "Твой выход, Шоуко!"
211040-37 = ""
211040-39 = ""
211040-40 = "Я Игараши Шоуко, секретарь Комитета по восстановлению Геенны."
211040-41 = "Вы уже о нас слышали, поэтому буду краткой. Вы спросите: «Что такое Комитет по восстановлению Геенны?»"
211040-42 = "Мы объединение студентов, стремящихся вернуть Геенне былое величие и единство. Пусть наш клуб и создан недавно, у нас ясная цель, большие амбиции и серьёзные намерения."
211040-43 = "Однако мы пока ещё малоизвестны и почти не имеем влияния."
211040-44 = "Но если бы вы, Сенсей из Шале, поддержали нас... Ваш авторитет позволил бы нам значительно расширить круг сторонников! Мы бы стали не просто клубом, а движением, которое захлестнёт всю Геенну! ...В идеале."
211040-45 = "Это как хитрая лиса, одолжившая силу тигра."
211040-46 = "Эм... Ты уверена, что так стоит выражаться? Мы ведь не хотим намекнуть, будто Сенсей..."
211040-47 = ""
211040-49 = ""
211040-50 = "Председатель, вы собирались скрывать наши истинные намерения от Сенсея?"
211040-51 = "Что...?"
211040-52 = "Сенсей из Шале обладает непререкаемым авторитетом и безграничным влиянием. Его признают во всём Кивотосе."
211040-53 = ""
211040-55 = ""
211040-56 = "Одни говорят, что Сенсей работает без отдыха и посвящает себя помощи студентам. Другие шепчутся, будто он использует сотрудников Генерального Студенческого Совета для удовлетворения личных прихотей."
211040-57 = "[s] «Это неправда!»"
211040-58 = "Вот как? Тогда прошу прощения. Рада это слышать."
211040-59 = "Шоуко, ты портишь всё первое впечатление!"
211040-60 = "Знаете что?! Эм! Мы хотели сказать..."
211040-61 = "Короче говоря, комитет объединяет студентов, которые искренне любят Геенну."
211040-62 = "Мы гордимся тем, что учимся здесь, хотим, чтобы нашу академию больше уважали, и мечтаем добиться здесь чего-то выдающегося."
211040-63 = "[s] «Хорошее стремление»."
211040-64 = "Вот именно! Мы хотим сделать Геенну лучше!"
211040-65 = ""
211040-67 = "Но, видите ли, не все студенты с нами согласны."
211040-68 = ""
211040-69 = "А? Это ещё что за дурацкий вопрос?"
211040-70 = "«Люблю ли я Геенну»...? Чего вы к этому так прицепились?"
211040-71 = ""
211040-72 = "Академия и академия. Какая ещё «любовь»? Вы что, жениться на ней собрались?"
211040-73 = ""
211040-74 = "Моё «общее впечатление» от Геенны? Ну... полный дурдом?"
211040-75 = ""
211040-77 = ""
211040-78 = "И меня это «беспокоит»? С какой стати? Такая уж Геенна."
211040-79 = "Всё равно мы ничего с этим не сделаем. И что дальше?"
211040-80 = "И вообще, разве «дурдом» — это так плохо? Я бы, например, и дня не выдержала в Тринити."
211040-81 = "Фу! Это же академия для чопорных «леди»! С их печеньками, церемонными речами и бесконечным чаем!"
211040-82 = "Там ведь нельзя швырнуть гранату в столовой, если еда отвратительная, или прогулять занятия, когда нет настроения..."
211040-83 = "И уж ТОЧНО нельзя взорвать торговый автомат, когда денег нет!"
211040-84 = "Ага, рано или поздно нас ловит команда Префектов, но до тех пор всё нормально, правда? Чистая свобода.#nНаверное, именно за это я и «люблю» Геенну. Пф."
211040-85 = ""
211040-86 = "Вот так-то."
211040-87 = "[s3] «Д-да уж...»\n[s4] «Похоже на обычный день в Геенне...»"
211040-90 = "...Никто не хочет сделать Геенну лучше. Каждый просто делает что вздумается."
211040-91 = "А когда каждый сам по себе, получается один сплошной хаос."
211040-92 = "И поскольку мы не можем договориться об общих целях и действовать сообща, в итоге НИКТО не получает желаемого."
211040-93 = "К тому же вы знаете, что Общество Пандемониум и Команда Префектов даже не собираются сотрудничать. Только и делают, что ссорятся."
211040-94 = "Председатель Макото и глава Префектов Хина словно одержимы идеей «свободной Геенны»... Но я не понимаю, что в ней хорошего."
211040-95 = "Вот к чему приводит эта «свобода», правда?"
211040-96 = "Сенсей, вы столько всего повидали. Наверняка заметили, насколько Геенна отличается от других академий!"
211040-97 = "[s] «Не могу с этим поспорить»."
211040-98 = "Но я слышала, что Геенна не всегда была такой."
211040-99 = "Не знаю... Но до моего поступления..."
211040-100 = "Здесь царили дисциплина и сплочённость, а все студенты были объединены одной общей целью!"
211040-101 = ""
211040-103 = ""
211040-104 = ""
211040-105 = "Похоже, эти ценности остались в прошлом."
211040-106 = "[s] «Значит, и правда были такие времена...»"
211040-107 = "Звучит совсем не похоже на сегодняшнюю Геенну."
211040-108 = "Наши студенты забыли об этих благородных идеалах, утратили гордость за академию..."
211040-109 = "...Именно поэтому мы решили действовать!"
211040-110 = "Ведь если Геенна уже была такой однажды, она сможет стать такой снова! Это наше наследие! Наша сущность!"
211040-111 = ""
211040-113 = ""
211040-114 = ""
211040-115 = "Ага! Поэтому мы так и назвали клуб."
211040-116 = ""
211040-118 = ""
211040-119 = "«Комитет по восстановлению Геенны»! Чтобы вновь вернуть Геенне былую славу!"
211040-120 = "Вот, собственно, почему мы хотели с вами встретиться. Нам пригодилась бы небольшая поддержка."
211040-121 = "[s] «Какая помощь вам нужна?»"
211040-122 = "Отличный вопрос! Именно его мы и хотели услышать!"
211040-123 = "По правде говоря, почти никакая! Вам нужно только стоять рядом, пока ВСЁ говорим мы."
211040-124 = "Видите ли, студенты Геенны необычайно сильно доверяют вам, Сенсей."
211040-125 = "У нас полно идей, как сделать Геенну лучше."
211040-126 = "А если бы вы помогли рассказать о них остальным, они прозвучали бы куда убедительнее! Яха!"
211040-127 = ""
211040-129 = ""
211040-130 = "С вашей поддержкой мы могли бы использовать вашу репутацию для куда более масштабных начинаний."
211040-131 = "[s] «Что? Мою репутацию?»"
211040-132 = "Именно. Даже если мы будем обещать невозможное или приукрашивать действительность, студенты поверят любому нашему слову... Пока вы рядом, Сенсей."
211040-133 = "Но, разумеется, мы так делать не станем!"
211040-134 = "Нельзя же вернуть Геенне славу обманом, верно?"
211040-135 = "Тц."
211040-136 = "Мы будем действовать честно и приложим все силы. Обещаю!"
211040-137 = "[s5] «Тогда...»\n[s6] «Я тоже помогу вам всем, чем смогу»."
211040-140 = ""
211040-142 = ""
211040-143 = "Что?! Серьёзно?! Вот так просто?!"
211040-144 = "[s] «Помогать старательным студентам — моя работа»."
211040-145 = "..."
211040-146 = "Пожалуй, теперь я начинаю понимать, что вы за человек, Сенсей."
211040-147 = "Правда, Сенсей? Яха! Я ЗНАЛА, что вы классный!"
211040-148 = "Спасибо, Сенсей! Чувствую, всё получится!"
211040-149 = ""
211040-151 = ""
211040-152 = "Тогда ПРИСТУПИМ!"
211040-153 = "[s] «Прямо сейчас?!»"
211040-154 = "Чем раньше начнём, тем лучше!"
211040-155 = "Чем дольше откладываешь дело, тем меньше хочется за него браться. Мы здесь, чтобы ДЕЙСТВОВАТЬ, а не прохлаждаться!"
211040-156 = ""
211040-158 = ""
211040-159 = ""
211040-160 = "Вот такая у нас председатель. Если ей что-то взбрело в голову, она не остановится, пока не доведёт дело до конца."
211040-161 = "Я восхищаюсь такой прямолинейностью."
211040-162 = "А ВЫ, Сенсей? По-моему, мы с вами отлично поладим!"
211040-163 = "Тогда пойдёмте за председателем. Главное сейчас — не сбавлять темп."
211040-164 = "Наперегонки, Сенсей!"
211040-165 = ""
211040-167 = ""
211040-168 = ""
211040-170 = "Следующий эпизод;Слава Геенне...?"
