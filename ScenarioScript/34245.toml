[translation]
34245-2 = "GUAAAAAAAH!!"
34245-3 = "Por quê?! Como...?! Eu sou... O meu...!!"
34245-4 = "O meu plano... o meu domínio... a minha consciência..."
34245-5 = "O meu... M-Meu..."
34245-6 = "Guh... Aah... Aaah..."
34245-13 = "Arf... arf... arf..."
34245-14 = "A-Acabou...?"
34245-18 = "Ah! A P-Princesa!!"
34245-19 = "A-Atsuko...!!"
34245-21 = "Ela ainda está lá!"
34245-22 = "A-Ai, meu Deus... V-Vamos tirá-la de lá rápido!"
34245-32 = "P-Princesa..."
34245-37 = "Princesa... aguenta firme..."
34245-38 = "P... Princesa..."
34245-39 = "...Os ferimentos são graves. Ela perdeu sangue demais."
34245-40 = "Princesa... Atsuko... por favor, abra os olhos..."
34245-41 = "Eu imploro... Atsuko... abra os olhos, por favor..."
34245-42 = "..."
34245-43 = "..."
34245-51 = "Saori-chan...?"
34245-52 = "Atsuko...!!"
34245-53 = "Princesa..."
34245-54 = "P-Princesa!! Você acordou?!"
34245-55 = "Sim..."
34245-56 = "Saori, Hiyori, Misaki... Bom dia, pessoal."
34245-66 = "Atsuko...!!!"
34245-67 = "Ah, Saori...?"
34245-68 = "Que bom... Ainda bem, de verdade..."
34245-69 = "S-Sim...?"
34245-70 = "Atsuko... obrigada por estar viva...#nMuito obrigada mesmo..."
34245-71 = "...Sim."
34245-72 = "Snif... uuh..."
34245-73 = "Saori... não chore. Eu estou bem."
34245-74 = "Foi o Sensei que nos ajudou, não foi...?"
34245-75 = "É... foi sim..."
34245-76 = "Obrigada, Sensei...#nAgora tudo vai ficar bem."
34245-79 = "...Sim. Está tudo bem, Saori.#nTenho certeza de que tudo acabou."
34245-81 = "[ns] Aproximar-se de Beatrice, caída no chão."
34245-85 = "Guh, urgh..."
34245-86 = "[s] \"Acabou, Beatrice.\""
34245-87 = "Como ousa... E-Eu ainda... ainda não!"
34245-88 = "Não fique se achando só porque interrompeu um mero ritual!"
34245-89 = "Eu ainda tenho a Barbara e as forças de Arius intactas!#nE também mantenho o meu poder de replicação!!"
34245-90 = "Uma única vitória não significa que isso acabou—"
34245-92 = "Não, esta história termina aqui."
34245-93 = "[ns] \"...!!\""
34245-98 = "Golconde...!!"
34245-99 = "Ora, acalme-se, por favor. Peço desculpas se o assustei.#nEu sou Golconde, da \"Gematria\"..."
34245-100 = "— Vamos pular as apresentações.#nAfinal, é possível que já tenhamos nos encontrado antes."
34245-101 = "Eu não vim para lutar.#nVim apenas para levar a Madame de volta."
34245-102 = "Me levar...?!"
34245-103 = "Além do mais, não tenho nenhuma confiança de que venceria em combate.#nNem todos na \"Gematria\" conseguem se transformar em monstros como a Madame, sabe."
34245-104 = "Sim, Madame. Agora ficou claro.#n— O Sensei não é o seu antagonista. Esta não é a sua história."
34245-105 = "...!!"
34245-106 = "Todos os incidentes, conflitos e processos que você causou...#nForam rebaixados a \"coisas que sequer precisam ser conhecidas\"."
34245-107 = "Longe de ser a protagonista... você nem mesmo é a antagonista do Sensei.#nNão passou de um mero \"recurso de roteiro\"."
34245-108 = "...Guh... urgh...!!"
34245-109 = "Sensei... quando você intervém, todos os conceitos se transformam.#nOriginalmente, o desfecho desta história não deveria ter sido assim."
34245-110 = "Uma história sobre superar adversidades com amizade e vencer através do esforço...?#nO texto que eu desejava deveria ser algo muito mais literário..."
34245-111 = "[s] \"...\""
34245-112 = "Hum... Peço perdão. Parece que acabei desagradando você."
34245-113 = "Pois bem, vou levar a Madame de volta.#nMadame, levante-se, por favor."
34245-118 = "Cof... Você..."
34245-119 = "[s] \"Espere...!!\""
34245-120 = "Por acaso pretende ficar no meu caminho?#nPeço que não tome tal decisão, Sensei."
34245-121 = "Por exemplo... eu sou capaz de produzir diversas ferramentas.#nAquela \"bomba destruidora de halos\" que está em suas mãos também é uma obra minha."
34245-122 = "[s] \"...!!\""
34245-123 = "Ah... é claro que não tenho a menor intenção de detoná-la aqui.#nAlém de não surtir efeito em você, parece que esse experimento acabou sendo um fracasso."
34245-124 = "Não pude confirmar uma única vez se essa bomba era mesmo capaz de destruir um halo. O meu plano definitivamente não era esse, mas...#nEnfim, por isso mesmo, pretendo descartá-la."
34245-125 = "Madame, o experimento desta vez falhou.#nVamos embora."
34245-126 = "Golconde...!"
34245-127 = "Com licença, Sensei.#nAté a próxima."
34245-134 = "Próximo;Uma Pessoa Importante"
