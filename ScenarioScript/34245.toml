[translation]
34245-2 = "Ах! Р-А-А-А!"
34245-3 = "К-Как...! Почему...? Моя..."
34245-4 = "Мой план... мои владения... мой ритуал..."
34245-5 = "Моя... моя... сила!"
34245-6 = "А-а-а-а!"
34245-7 = ""
34245-10 = ""
34245-13 = "*тяжело дышит*... *тяжело дышит*... *тяжело дышит*..."
34245-14 = "В-Всё... закончилось?"
34245-15 = ""
34245-17 = ""
34245-18 = "Ах! С Химэ всё хорошо?!"
34245-19 = "Ацуко! Нет!"
34245-20 = ""
34245-21 = "Она всё ещё там наверху. Не знаю, жива ли..."
34245-22 = "Снимите её! П-Пожалуйста! Прямо сейчас!"
34245-23 = ""
34245-32 = "О нет..."
34245-33 = ""
34245-37 = "Химэ! Химэ! Проснись! П-Пожалуйста... проснись..."
34245-38 = "Х-Химэ..."
34245-39 = "Её раны... Она потеряла слишком много крови."
34245-40 = "Химэ... А-Ацуко... Прости. Мне так жаль... так что, пожалуйста, открой глаза... Я сделаю что угодно..."
34245-41 = "Не... н-не оставляй меня. Химэ...!"
34245-42 = "..."
34245-43 = "..."
34245-44 = ""
34245-51 = "Саори...?"
34245-52 = "А-Ацуко! Да! Да, это я!"
34245-53 = "Химэ!"
34245-54 = "Х-Химэ! Ты нас слышишь?!"
34245-55 = "Доброе утро."
34245-56 = "Саори, Хиёри, Мисаки... Я вернулась."
34245-57 = ""
34245-66 = "С возвращением, Ацуко. Ты дома."
34245-67 = "Привет, Саори."
34245-68 = "Химэ. Т-Ты жива. Ты в порядке."
34245-69 = "Я... прямо здесь."
34245-70 = "Я чувствую тебя в своих руках, поэтому могу поверить. Спасибо... Спасибо, что выжила, Ацуко."
34245-71 = "Ты... Ты пришла за мной. Ты меня спасла."
34245-72 = "*всхлипывает*"
34245-73 = "Хватит слёз, Саори. Я в безопасности... благодаря тебе."
34245-74 = "Сенсей... помог нам?"
34245-75 = "Да. Именно..."
34245-76 = "Спасибо, Сенсей. Теперь всё будет хорошо. Я это чувствую."
34245-79 = "Да. Теперь всё хорошо."
34245-81 = "[ns] Подойти к поверженной Беатриче."
34245-82 = ""
34245-85 = "У-ух..."
34245-86 = "[s] «Всё кончено, Беатриче.»"
34245-87 = "Я никогда не проиграю... не тебе...!"
34245-88 = "Думаешь, победил? Ты всего лишь сорвал мой ритуал, Сенсей!"
34245-89 = "У меня всё ещё есть Барбара и войска Ариуса! У меня всё ещё есть Мимесисы!"
34245-90 = "Не смотри на меня сверху вниз! Ты ничего не выиграл! Думаешь, теперь всё кончено?!"
34245-92 = "Не всё, но эту маленькую книжку сказок пора закрыть."
34245-93 = "[ns] «...!»"
34245-94 = ""
34245-97 = ""
34245-98 = "Голконда?!"
34245-99 = "Ну-ну. Давайте без театра. Прошу прощения, если напугал вас. Я Голконда из Гематрии."
34245-100 = "Хотя представление, возможно, излишне, Сенсей. Мы уже встречались. Может быть. А может и нет. Кто знает!"
34245-101 = "Опустите эти глупые пушечки. Я здесь только забрать Мадам."
34245-102 = "Меня?!"
34245-103 = "Я не собираюсь ввязываться в дурацкую драку! В конце концов, не вся Гематрия умеет превращаться в монстров, как Мадам."
34245-104 = "И да-да. Мадам, это была не ваша история, в которую следовало лезть, а Сенсей не был вашим соперником. Даже Я это ВИЖУ! Ха-ха-ха, поняли?"
34245-105 = "...!"
34245-106 = "События, конфликты и процессы, которые вы начали, теперь лишь незначительное прошлое."
34245-107 = "Моя прекрасная Мадам. Вы не главный герой и даже не антагонист. Лучше найдите в словаре термин «сюжетный инструмент»."
34245-108 = "У-Ух...!"
34245-109 = "Сенсей, где бы вы ни вмешались, вы переписываете историю под желаемую концовку. Если бы не вы, бедная Мадам добилась бы успеха."
34245-110 = "Ваш способ разрешения конфликтов — вера в студентов? На мой вкус, немного пресно и избито."
34245-111 = "[s] «...»"
34245-112 = "О боже, о боже. Я заставил вас чувствовать себя неловко? Как невежливо с моей стороны."
34245-113 = "Я заберу Мадам. Прошу, вставайте, Мадам."
34245-114 = ""
34245-116 = ""
34245-118 = "*кашель* Ты..."
34245-119 = "[s] «Стой...!»"
34245-120 = "Вы хотите меня остановить? Я настоятельно не советую, Сенсей."
34245-121 = "Я умею пользоваться разными инструментами. Бомба, разрушающая нимбы, которая у вас, — одно из моих творений."
34245-122 = "[s] «...!»"
34245-123 = "Ой, я бы не стал взрывать её в этом святом месте. Против вас она вообще неэффективна. Совсем."
34245-124 = "Мне так и не удалось подтвердить, способна ли она действительно разрушить нимб. Хм. Наверное, просто выброшу."
34245-125 = "Мадам, ваш эксперимент провалился. Нам пора."
34245-126 = "Голконда!!"
34245-127 = "Прошу нас извинить. Ещё увидимся, Сенсей."
34245-128 = ""
34245-130 = ""
34245-134 = "Следующий эпизод;Кто-то особенный"
