[translation]
1013205-1 = "Теперь моя очередь!"
1013205-2 = "Ресторан"
1013205-3 = "В час дня я пришёл в отель и встретился с Цукуё в дорогом ресторане."
1013205-4 = "З-Здравствуйте, Сенсей!"
1013205-5 = "Вы... голодны?"
1013205-6 = "Н-Надеюсь, что да!"
1013205-7 = "[s] «Должен быть!»"
1013205-8 = "Просто... в последнее время вы так часто угощали меня бесплатно."
1013205-9 = "Поэтому я очень хотела воспользоваться случаем и отплатить вам...!"
1013205-10 = "И-Именно поэтому я привела вас сюда!"
1013205-11 = "[s] «Но разве здесь... не довольно дорого?»"
1013205-12 = "Хи-хи, всё в порядке."
1013205-13 = "На последних модельных подработках я заработала довольно много, знаете ли."
1013205-14 = "А главное, обеденное меню заметно дешевле вечернего!"
1013205-15 = "Я получу дополнительную скидку, если оставлю отзыв, и у меня даже есть купон, срок которого скоро закончится!"
1013205-16 = ""
1013205-18 = ""
1013205-19 = "Ой, надеюсь, я не звучу как скряга!"
1013205-20 = "[s] «В экономности нет ничего плохого!»"
1013205-21 = "В-Вы правда так думаете...?"
1013205-22 = "Спасибо, Сенсей!"
1013205-23 = "Ну что ж, давайте посмотрим меню—"
1013205-24 = ""
1013205-28 = ""
1013205-29 = "О, прошу прощения, Сенсей."
1013205-30 = ""
1013205-32 = ""
1013205-33 = ""
1013205-34 = "А-Алло?"
1013205-35 = ""
1013205-41 = "О, да. Эм... Простите, думаю, я не смогу..."
1013205-42 = "Что? Вы хотите МЕНЯ в качестве главной модели?"
1013205-43 = "Н-Ну, дело в том, что..."
1013205-44 = "Да, верно, простите... Да..."
1013205-45 = ""
1013205-47 = ""
1013205-48 = "[ns] «Что это был за звонок?»"
1013205-49 = "О, эм, это был тот менеджер, о котором я рассказывала. Тот, что постоянно находит мне работу..."
1013205-50 = "В этот раз он спросил, не могла бы я поработать «примерочной моделью»..."
1013205-51 = "...Но, честно говоря, в последнее время всего этого стало слишком много. Я собираюсь отказать."
1013205-52 = "Эм, в любом случае, может, посмотрим меню?"
1013205-53 = "Что вам нравится, Сенсей?"
1013205-55 = "...Мы с Цукуё приятно пообедали."
1013205-56 = "После небольшой прогулки мы забрели в универмаг, соединённый с рестораном."
1013205-58 = "Подвальный этаж универмага"
1013205-60 = "Эм, Сенсей. Надеюсь, еда вам понравилась..."
1013205-61 = "[s1] «Это было лучшее...»\n[s2] «Все блюда были восхитительными!»"
1013205-64 = "Хи-хи, я-я так рада это слышать...!"
1013205-65 = "Ну... раз мы уже поели, не хотите десерт?"
1013205-66 = "Недавно открылся новый магазин домашнего мороженого..."
1013205-67 = "Они полностью сосредоточены на авторских вкусах и вкусовых качествах, а не на питательности!"
1013205-68 = "[s] «Не уверен, что это лучшая идея!»"
1013205-69 = "Н-Но многие говорят, что там очень вку—"
1013205-71 = "...Почему я такая высокая? Почему именно я?"
1013205-72 = ""
1013205-74 = ""
1013205-75 = "А...?"
1013205-78 = "Смотрите! Видите, ни одна милая одежда не подходит к моей долговязой фигуре."
1013205-79 = "То же самое с обувью. Ни одна милая пара не подходит на мои огромные ступни."
1013205-80 = "М-Может, всё-таки получится что-нибудь подобрать?"
1013205-81 = "Даже если мы что-то найдём, я всё равно останусь такой же..."
1013205-82 = "С таким огромным телом на мне никогда ничего не будет смотреться хорошо!"
1013205-83 = "Да просто посмотрите на манекены. Ни один из них мне даже до плеча не достанет! Я слишком высокая!"
1013205-84 = "Ну, ты и правда высокая, но..."
1013205-87 = ""
1013205-88 = "Эм, Сенсей."
1013205-89 = "Вы не против, если я быстро позвоню?"
1013205-90 = "[s] «Конечно, звони.»"
1013205-91 = "Извините..."
1013205-92 = ""
1013205-94 = ""
1013205-95 = ""
1013205-96 = "Да, сэр. Это Цукуё."
1013205-97 = "Вы всё ещё ищете примерочную модель? Да, да... Замечательно. Спасибо!"
1013205-98 = ""
1013205-100 = ""
1013205-101 = "[ns] «Цукуё, этот звонок только что...»"
1013205-102 = "Да, я согласилась на работу примерочной моделью."
1013205-103 = "П-Просто... я поняла, что девушек с такой внешностью, как у меня, не так уж много. Но они есть."
1013205-104 = "...И я подумала, что работа моделью могла бы помочь им почувствовать, что их тоже замечают. Что они... нормальные!"
1013205-105 = "Я хочу показать им, что в одежде можно чувствовать себя красивой... независимо от размеров!"
1013205-106 = "...Не думаете, что я слишком самонадеянна?"
1013205-107 = "[s3] «Совсем нет!»\n[s4] «Лучшая модель во всём Кивотосе не должна в себе сомневаться!»"
1013205-110 = "М-Мне кажется, это уже слишком...!"
1013205-111 = "Ну, я... просто, эм..."
1013205-112 = "...Думаю, мороженое можно съесть и в другой день."
1013205-116 = "Несколько дней спустя..."
1013205-118 = "Подвальный этаж универмага"
1013205-120 = ""
1013205-121 = "(Они повесили моё фото на витрине магазина одежды?)"
1013205-122 = "(Ух... Я знала, на что подписываюсь, но всё равно так неловко.)"
1013205-123 = "(...И всё же интересно, правильно ли я поступила...?)"
1013205-124 = ""
1013205-128 = "Эй, посмотри на тот плакат. Это новая модель, да?"
1013205-129 = ""
1013205-131 = ""
1013205-134 = "О?"
1013205-135 = "И правда... Ого, она такая высокая! Выглядит довольно... знакомо, да?"
1013205-136 = "Эй... и правда."
1013205-137 = "Ну вот, что я тебе говорила? Даже если ты высокая, всё равно можно выглядеть круто и элегантно! Может, рост даже помогает!"
1013205-138 = ""
1013205-141 = "...Да. Наверное, надежда всё-таки есть, да?"
1013205-144 = ""
1013205-145 = "...Хи-хи."
1013205-146 = ""
1013205-148 = ""
1013205-149 = ""
