[translation]
80000079-1 = "Шоколад скрытых чувств"
80000079-2 = "Здравствуйте, все. Спасибо, что пришли отпраздновать с нами День святого Валентина."
80000079-3 = "Я так рада, что вы присоединились к мастер-классу Клуба внутренней дисциплины по изготовлению шоколада."
80000079-4 = "[s] «Наставляйте нас, вице-президент Мимори!»"
80000079-5 = "Хи-хи... Для нас честь, что на сегодняшнем занятии присутствует Сенсей из Шале."
80000079-6 = "Я приложу все силы как член Клуба внутренней дисциплины и как та, кто стремится стать настоящей леди."
80000079-7 = "Я хочу сделать..."
80000079-8 = "А, понятно. Вишни в шоколаде ручной работы!"
80000079-9 = "Вишнёвое дерево символизирует «единственную истинную любовь». Уверена, получатель очень это оценит."
80000079-10 = "К-Как вы узнали?! Я же ничего не сказала... Хотя стоило ожидать такого от могущественной телепатки и тайной правительницы Хяккияко, Мимори...!"
80000079-11 = "Что? Н-нет! Это совсем неправда! Где вы вообще такое услышали...?"
80000079-12 = "Ну, эм..."
80000079-13 = "А-ха. Понятно, вы стремитесь к самой истинной форме домашнего шоколада, поэтому принесли какао тёртое и какао-масло."
80000079-14 = "Удачи! Подобрать правильное соотношение молока и сахара может быть трудно, но уверена, получатель оценит, сколько сил вы вложили."
80000079-15 = "Д-думаете? Я не очень хорошо готовлю, поэтому... Может, я замахнулась слишком высоко..."
80000079-16 = "Всё хорошо! Пока вы готовы продолжать попытки, вы сможете всё. Любая неудача — лишь часть пути."
80000079-17 = "Я хочу... Хи-хи..."
80000079-18 = "Что...? Вы пытаетесь сделать... мягкий, скользкий, похожий на слизь шоколад?"
80000079-19 = "И хотите увидеть, как получателя медленно поглощает шоколадная слизь...? Чтобы он принадлежал вам телом и душой...?"
80000079-20 = "Н-Нет! Это слишком..."
80000079-21 = "Слишком бесстыдно!"
80000079-22 = "Ох... Наверное, это было слишком хорошо, чтобы быть правдой..."
80000079-24 = "Фух. Отличная работа, Сенсей!"
80000079-25 = "[s1] «Всю работу сделала ты, Мимори.»\n[s2] «Ты всегда меня поражаешь.»"
80000079-26 = "Ч-Что?! О чём вы?"
80000079-27 = "Ч-Что?! О чём вы?"
80000079-28 = "О... Вы говорите, что нелегко понять, о чём думает человек, и вовремя предложить ему помощь. Наверное, но..."
80000079-29 = "Ну, ничего особенного, просто..."
80000079-30 = "Я всё ещё не знаю мыслей самого важного для меня человека."
80000079-31 = "[s3] «...?»\n[s4] «Есть что-то, чего не знает волшебная чтица мыслей...?!»"
80000079-32 = "Всё совсем не так!"
80000079-33 = "Всё совсем не так!"
80000079-34 = "Эм... Сенсей? Если вы не против... Можно мне отдать вам это?"
80000079-35 = ""
80000079-37 = ""
80000079-39 = "[ns5] «Шоколад от тебя, Мимори?»\n[ns6] «Ты всё это время его прятала? Спасибо!»"
80000079-40 = "Во время занятия я выкроила немного времени и сделала один сама."
80000079-41 = "Во время занятия я выкроила немного времени и сделала один сама."
80000079-42 = "Мне немного неловко, ведь я использовала время, когда должна была помогать другим, на что-то для себя."
80000079-43 = "Наверное, это лишь отдаляет меня от цели стать настоящей леди..."
80000079-44 = "[s] «Это неправда, Мимори.»"
80000079-45 = "Хи-хи."
80000079-46 = "Вы раньше говорили, что я всегда понимаю, о чём думают другие. Но это вовсе не так."
80000079-47 = "Прямо сейчас, отдавая вам этот шоколад... я не могу услышать ваши мысли из-за грома собственного сердца."
80000079-48 = "[s] «Ну—»"
80000079-49 = "Тссс!"
80000079-50 = "Пока ничего не говорите, хорошо?"
80000079-51 = "Я хочу наслаждаться этим волнением до конца дня."
80000079-52 = "Так что, эм... Прошу меня простить!"
80000079-53 = ""
80000079-55 = ""
80000079-56 = "[ns] «О, эм... Пока...?»"
80000079-57 = "Я смотрел вслед убегающей Мимори, а затем осторожно открыл сделанный ею шоколад."
80000079-58 = "[ns7] «Я определённо чувствую в нём её чувства.»\n[ns8] «Он... очень вкусный.»"
