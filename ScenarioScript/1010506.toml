[translation]
1010506-1 = "Смелость быть другой"
1010506-2 = "По просьбе Мари вечером, закончив работу, я отправился в собор Тринити."
1010506-3 = ""
1010506-8 = "[ns1] «...Мари?»\n[ns2] «Похоже, здесь никого нет...»"
1010506-11 = "...О, здравствуйте, Сенсей."
1010506-12 = "Спасибо, что нашли время прийти сюда."
1010506-13 = "...Вы выглядите удивлённым."
1010506-14 = "Это было слишком внезапно...?"
1010506-15 = "Я сомневалась, стоит ли специально звать вас сюда..."
1010506-16 = "...но не знала, где ещё можно было бы встретиться."
1010506-17 = "...А, не переживайте."
1010506-18 = "Сейчас здесь больше никого нет."
1010506-19 = "Только мы вдвоём."
1010506-20 = "Именно... поэтому я и попросила вас прийти."
1010506-21 = "...Сенсей?"
1010506-22 = "Если вы не против... вы примете мою просьбу?"
1010506-23 = "До этого момента произошло столько всего."
1010506-24 = "И было немало ситуаций, когда без вашей помощи я бы не справилась."
1010506-25 = "Но, как мы оба знаем, я всего лишь обычная сестра из собора."
1010506-26 = "Я мало что могу для вас сделать... кроме как молиться."
1010506-27 = "...Точнее, раньше мало что могла."
1010506-28 = "Люди не будут вечно видеть меня такой. Возможно, даже недолго."
1010506-29 = "Поэтому я настояла на возможности вроде этой."
1010506-30 = "Когда айдолы поют и выступают перед людьми, это своего рода служение им."
1010506-31 = "И для вас это тоже будет моим служением."
1010506-32 = "Позвольте мне предложить вам нечто помимо молитв."
1010506-33 = "[s3] «Так вот зачем ты меня позвала.»\n[s4] «Персональный партизанский концерт. Неплохо.»"
1010506-36 = "...Хи-хи."
1010506-37 = "Я знала, что вы поймёте. Спасибо, теперь мне не придётся придумывать ещё больше неловких оправданий."
1010506-38 = "Не знаю, что вы об этом подумаете..."
1010506-39 = "...но мне пришлось долго собираться с духом, чтобы всё это устроить."
1010506-40 = "Так что перейдём прямо к делу..."
1010506-41 = "...и с вами в качестве единственного зрителя я устрою концерт прямо здесь и сейчас."
1010506-42 = "Не как сестра..."
1010506-43 = ""
1010506-45 = ""
1010506-46 = "...а как айдол."
1010506-48 = "Там, в пустом соборе, Мари устроила концерт только для меня."
1010506-49 = "Сначала она нервничала, но, начав выступление, буквально озарила собой весь зал. Мне даже стало немного неловко, что всё это представление досталось одному мне."
1010506-52 = "После концерта я проводил её до комнаты."
1010506-53 = "Я-я не хотела доставлять вам столько хлопот..."
1010506-54 = "Правда, со мной всё хорошо. Не нужно волноваться. Вам стоит вернуться и отдохнуть..."
1010506-55 = "...Хм? Уже поздно, и вы хотите убедиться, что я благополучно доберусь до комнаты?"
1010506-56 = "Я-я ведь не так уж далеко иду..."
1010506-57 = "...и мне кажется, что я снова окажусь у вас в долгу..."
1010506-58 = "Н-Ну, наверное, с вашей точки зрения это просто естественно, да?"
1010506-59 = "...А."
1010506-60 = "С вашей точки зрения..."
1010506-61 = ""
1010506-63 = ""
1010506-64 = "...Хи-хи."
1010506-65 = "[s5] «...Мари?»\n[s6] «Что это была за улыбка...?»"
1010506-68 = "А, простите. Я и не заметила, что..."
1010506-69 = "Я, эм, должна была раньше попытаться взглянуть на всё с вашей стороны."
1010506-70 = "Это было невнимательно с моей стороны. Я думала только о ситуации прямо перед собой..."
1010506-71 = "...Со мной много хлопот, правда?"
1010506-72 = "..."
1010506-73 = "Но всё же... думаю, я неплохо справилась."
1010506-74 = "Мне было нелегко решиться на это и воспользоваться такой возможностью. Даже пришлось немного настоять на своём."
1010506-75 = "Но, кажется, я многому научилась."
1010506-76 = "Завтра я снова вернусь к своей обычной благочестивой жизни..."
1010506-77 = "...но не из чувства долга и без каких-либо сожалений."
1010506-78 = "Мне нравится и та жизнь... и эта."
1010506-79 = "[s7] «Отличный настрой.»\n[s8] «Тогда больше ничего и не нужно.»"
1010506-82 = "Хи-хи..."
1010506-83 = "Ещё раз огромное спасибо вам за всё это, Сенсей."
1010506-84 = "И ещё..."
1010506-85 = "...пожалуйста, присматривайте за сестрой Мари так же, как присматривали за айдолом Мари."
