[translation]
2000520-1 = "Полуночное чаепитие"
2000520-2 = "Хотя я приехал на пляж отдыхать, куда бы ни пошёл, меня заваливали просьбами."
2000520-3 = ""
2000520-5 = ""
2000520-6 = ""
2000520-7 = ""
2000520-8 = "Извините..."
2000520-9 = "Вы ведь тот самый знаменитый стратег и решатель проблем, Сенсей [USERNAME]...?"
2000520-10 = "[s] «Ну, не могу сказать, что это совсем не так...»"
2000520-11 = "Ух ты, какая честь видеть вас здесь, Сенсей [USERNAME]!"
2000520-12 = "Когда я услышал, что вы приехали в этот район, я так обрадовался — надеялся, что вы заглянете к нам!"
2000520-13 = "Мы запустили новое меню, но студентам оно, кажется, не очень нравится."
2000520-14 = "Я пытаюсь смотреть на всё их глазами, но я уже слишком стар, чтобы понимать, что нравится молодёжи."
2000520-15 = "Вы часто общаетесь со студентами. Не могли бы вы высказать своё мнение о нашем меню?"
2000520-16 = "[s] «Ну, если моё мнение действительно что-то значит...»"
2000520-17 = ""
2000520-19 = ""
2000520-21 = ""
2000520-22 = "П-Помогите...! Плохие студенты на пляже украли мой кошелёк...!"
2000520-23 = "Там были деньги на еду на всю эту неделю..."
2000520-24 = "Если я его не верну, мне, возможно, придётся до конца каникул питаться одними сушёными водорослями..."
2000520-25 = "[s1] «Подожди минутку. Я его верну.»\n[s2] «Я заберу кошелёк у этих студентов и верну тебе.»"
2000520-28 = ""
2000520-30 = ""
2000520-31 = ""
2000520-32 = "*всхлип* Сестрёнка, куда ты ушла?"
2000520-33 = "Надо было оставаться на месте и ждать её... *всхлип*"
2000520-34 = "[s3] «Ты потерялась? Пойдём, найдём твою сестру.»\n[s4] «Секундочку, я помогу найти твою старшую сестру.»"
2000520-37 = ""
2000520-39 = ""
2000520-40 = ""
2000520-41 = ""
2000520-45 = "К тому времени, как я закончил решать бесчисленные проблемы, солнце давно зашло. Уже наступила ночь."
2000520-47 = "И как раз когда я собирался насладиться поздней прогулкой вдоль пляжа..."
2000520-48 = ""
2000520-58 = ""
2000520-59 = "[ns] «Х-Хифуми...?»"
2000520-60 = "О, Сенсей? Что ты делаешь на пляже так поздно?"
2000520-61 = "...Понятно. Ты устал после целого дня решения чужих проблем и вышел прогуляться, чтобы расслабиться..."
2000520-62 = "Ахаха... Какое совпадение. Я тоже решила прокатиться и подышать свежим ночным воздухом у пляжа."
2000520-63 = "[s5] «Но для поездки уже довольно поздно...»\n[s6] «Это не опасно?»"
2000520-66 = "Всё в порядке. Я хорошо подготовилась к ночной поездке."
2000520-67 = "Вот фонарик в форме Angry Adelie, чтобы освещать пляж, и..."
2000520-68 = "...моё одеяло с Пероро, чтобы не замёрзнуть ночью!"
2000520-69 = "А ещё я взяла с собой осколочный боеприпас для «Крусейдера» — на случай неприятностей."
2000520-70 = "[s] «Мне кажется, последнее было не особо нужно...»"
2000520-71 = "О, ещё я взяла вот это...!"
2000520-72 = ""
2000520-74 = ""
2000520-75 = ""
2000520-77 = "Специальный чайник Momo Friends к первой годовщине — для танков!"
2000520-78 = "Я подумала, что могу устроить чаепитие, поэтому взяла этот чайник с собой на прогулку."
2000520-79 = ""
2000520-81 = ""
2000520-82 = ""
2000520-83 = ""
2000520-85 = "[ns] «Чайник... для танков?»"
2000520-86 = "Ага. Как я уже говорила, при эксплуатации танка довольно часто нужна горячая вода."
2000520-87 = "Например, для чаепития во время поездки или для мытья танка..."
2000520-88 = "Или... когда неожиданно встречаешь Сенсея на пляже среди прекрасных ночных пейзажей..."
2000520-89 = ""
2000520-91 = ""
2000520-92 = "Если хочешь, Сенсей, я могу заварить нам по чашке чёрного чая."
2000520-93 = "Я обожаю пить чай и смотреть на пляж под звёздным небом."
2000520-94 = "[s] «Одну чашку чая со вкусом танка, пожалуйста!»"
2000520-95 = "Хорошо! Сейчас принесу!"
2000520-97 = ""
2000520-100 = "А затем мы с Хифуми спокойно пили чай на пляже, освещённом лунным светом."
