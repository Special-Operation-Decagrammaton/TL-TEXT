[translation]
1300606-1 = "Особый заказ"
1300606-2 = "Ю-ху, Сенсей! Сюда!"
1300606-3 = "[s] «Что ты имела в виду под „особым заказом“?»"
1300606-4 = "Хахаха! Невероятно!"
1300606-5 = "Эм, ничего..."
1300606-6 = "Просто у нас куча заказов, и мне отчаянно нужна твоя помощь."
1300606-7 = "[s1] «Если даже ты называешь это „особенным“...»\n[s2] «Если тебе так отчаянно нужна помощь...»"
1300606-8 = "Хе-хе! Ну? Как тебе?"
1300606-9 = "Хе-хе! Ну? Как тебе?"
1300606-10 = "Ты ведь не оставишь бедного беспомощного студента в минуту нужды? Ты обязан помочь!"
1300606-11 = "[s] «Кстати, если заказы для всей Решатели проблем 68, почему ты здесь одна...?»"
1300606-12 = ""
1300606-13 = ""
1300606-14 = "Ты. Мне. Поможешь."
1300606-15 = "Правда, Сенсей?!"
1300606-16 = "Ты уже пришёл сюда, теперь отступать поздно!"
1300606-17 = "[s3] «...М-м, похоже, моего мнения тут не спрашивают.»\n[s4] «Что ж... придётся согласиться...»"
1300606-18 = "Ахаха! Я знала, что ты согласишься, Сенсей!"
1300606-19 = "Ахаха! Я знала, что ты согласишься, Сенсей!"
1300606-20 = "[s] «С какого заказа начнём?»"
1300606-21 = "К счастью, список всех заказов я записала здесь."
1300606-22 = "[s] «Круто, можно посмотреть?»"
1300606-23 = ""
1300606-24 = ""
1300606-25 = "Прости, Сенсей. Нельзя!"
1300606-26 = "Не могу же я раздавать личные данные клиентов, правда?"
1300606-27 = "Увы, нельзя. Я не могу показать это никому, даже тебе."
1300606-28 = "[s] «Понятно. Ты настоящий профессионал, Муцуки.»"
1300606-29 = "Ага, именно. Настоящий профессионал!"
1300606-30 = "Кхм. Ладно, без лишних слов — первый заказ!"
1300606-31 = "Он про..."
1300606-33 = "Sugar Sweet, магазин домашних десертов"
1300606-34 = "[ns] «...Ты уверена, что это настоящий заказ?»"
1300606-35 = "Ага! Клиент требует, чтобы мы «попробовали каждый креп в этом десертном кафе...»"
1300606-36 = "«...и определили лучший»!"
1300606-37 = "[s5] «Лучший из всех крепов...!»\n[s6] «Но в меню их больше десяти.»"
1300606-38 = "Хаха! Найти лучший очень важно! Единственная проблема — бюджет."
1300606-39 = "Хм... Интересно, сработает ли так."
1300606-40 = "Ну, не волнуйся. Мы без проблем всё съедим. Главное..."
1300606-41 = "...расходы можно оставить тебе, Сенсей! ♪"
1300606-42 = "[s] «Эм...»"
1300606-43 = "Правда? Ты ведь не можешь отказать просьбе студенты, да, Сенсей?"
1300606-44 = "Особенно когда твой драгоценный студент так усердно выполняет заказ клиента."
1300606-45 = "Или..."
1300606-46 = "Ты собираешься сказать «нет»?"
1300606-48 = "[s] «Э-Эй! Я не твой личный кошелёк!»"
1300606-49 = "Ахахаха! Спасибо, Сенсей!"
1300606-50 = ""
1300606-51 = "М-м. Клубника всегда беспроигрышный вариант! ♪"
1300606-52 = "Бананы такие сладкие!"
1300606-53 = "Как ты там, Сенсей?"
1300606-54 = "[s7] «Клубника, банан, шоколад, карамель... Крепы повсюду...»\n[s8] «Во рту сплошной сахар. Кажется, я впадаю в кому...»"
1300606-55 = "Держись, Сенсей. Осталось совсем немного, так что не сдавайся!"
1300606-56 = "Держись, Сенсей. Осталось совсем немного, так что не сдавайся!"
1300606-57 = "[s] «О-О-ох...!»"
1300606-59 = "(Мы с Муцуки поглощаем гору крепов.)"
1300606-61 = "Ахаха! Кажется, этот лучший! Но выбрать так трудно..."
1300606-62 = "[s] «Уф, во рту до сих пор противно сладко.»"
1300606-63 = "Ладно, с этим хватит. Переходим к следующему заказу!"
1300606-64 = "[s] «Это то, что можно сделать здесь, в парке развлечений?»"
1300606-65 = "Второй заказ простой!"
1300606-66 = "Ага, значит..."
1300606-67 = "Клиент хочет, чтобы мы «выяснили, какая лошадка на карусели в этом парке аттракционов самая быстрая!»"
1300606-68 = "[ns9] «...Карусель?»\n[ns10] «Самая быстрая лошадь?»"
1300606-73 = "[ns] «Разве они... не все одинаковые?»"
1300606-74 = "Ну же, Сенсей, не будь таким. Просто выбери одну. Я ставлю на ту красную лошадку!"
1300606-75 = "Готова поспорить, она раза в три быстрее остальных!"
1300606-76 = "А! Она начинает двигаться!"
1300606-77 = "[s] «Эм...?»"
1300606-79 = "(Разумеется, все лошадки на карусели двигались с одинаковой скоростью.)"
1300606-81 = "Ахаха! Они все едут с одинаковой скоростью! Ну, тут уж ничего не поделаешь."
1300606-82 = "Кихихи! Переходим к третьему поручению, Сенсей!"
1300606-83 = "[s] «Д-Да...»"
1300606-85 = "Библиотека Геенны 13"
1300606-86 = "(Следующее поручение привело нас в библиотеку.)"
1300606-87 = "[s] *шёпотом* «Что за поручение?»"
1300606-88 = "Тут написано..."
1300606-89 = "«Поставьте все книги на полках вверх ногами так, чтобы никто не заметил.»"
1300606-90 = "[s] «Погоди, это же просто обычный розыгрыш...»"
1300606-91 = "Работа есть работа. И никто не запрещает потом вернуть всё как было. Верно, Сенсей?"
1300606-92 = "[s11] «Как ни крути, это заказ, а потом мы всё вернём на место...»\n[s12] «Ну... похоже, придётся...»"
1300606-93 = "Ахаха! Спасибо, Сенсей! ♥"
1300606-94 = "Ахаха! Спасибо, Сенсей! ♥"
1300606-96 = "(После этого я выполнил ещё множество заданий, следуя за Муцуки.)"
1300606-97 = "(Спустя некоторое время...)"
1300606-99 = "[ns] «Мы выполнили уже довольно много поручений.»"
1300606-100 = "Кихихи, и правда."
1300606-101 = "[s] «Сколько ещё осталось?»"
1300606-102 = "А, это..."
1300606-103 = ""
1300606-104 = "Оставшиеся поручения..."
1300606-106 = "Ой, мой листок..."
1300606-107 = "Лист с поручениями Муцуки подхватило ветром и унесло в небо."
1300606-111 = "[ns13] «Не волнуйся, Муцуки! Я справлюсь!»\n[ns14] «Посмотрим, какие заказы остались...»"
1300606-112 = "Ой, Сенсей! Не переживай, просто верни мне листок..."
1300606-113 = "Ой, Сенсей! Не переживай, просто верни мне листок..."
1300606-114 = "[ns] «Хм? Имя клиента...»"
1300606-115 = ""
1300606-116 = "[ns] «Имя клиента: Муцуки...?»"
1300606-117 = ""
1300606-118 = ""
1300606-119 = "Вот блин...!"
1300606-120 = ""
1300606-121 = ""
1300606-122 = ""
1300606-123 = "[ns] «Погоди... Муцуки?!»"
1300606-128 = "― Ах, какая жалость.[wa:830]"
1300606-130 = "― Похоже, меня всё-таки раскрыли! ♪[wa:200]"
1300606-133 = "― Сенсей. Сегодняшним милым клиентом была[wa:3570]"
1300606-135 = "― не кто иная, как я!"
1300606-138 = "― Хотя, если честно...[wa:200]"
1300606-140 = "― Я ведь не могу одна заниматься поручениями Решатели проблем 68.[wa:790]"
1300606-143 = "― Ну как, Сенсей?[wa:880]"
1300606-145 = "― Мой розыгрыш сработал безупречно, правда?[wa:530]"
1300606-148 = "― Чего ты так остолбенел?[wa:1920]"
1300606-150 = "― Это так смешно! Ахаха! ♪[wa:410]"
1300606-153 = "― Сегодня мы столько всего весёлого сделали.[wa:1530]"
1300606-156 = "― Поели крепов, заглянули в парк аттракционов,[wa:400]"
1300606-158 = "― и даже стали сообщниками в библиотеке![wa:200]"
1300606-161 = "― Ах... А ведь я могла водить тебя за нос до самого конца. Какая жалость![wa:2410]"
1300606-164 = "― Но в следующий раз я обязательно обману тебя до последнего![wa:500]"
1300606-166 = "― Жди с нетерпением![wa:10]"
1300606-169 = "― Ах, как же сегодня было весело![wa:2890]"
1300606-171 = ""
1300606-172 = "Раз уж ты меня раскусил, мне пора!"
1300606-173 = ""
1300606-174 = "[ns] «Я попался...»"
1300606-176 = "(Муцуки, хихикая и махая рукой, скрылась вдали, а я так и остался стоять в оцепенении.)"
