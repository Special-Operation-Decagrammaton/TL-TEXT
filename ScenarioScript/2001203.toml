[translation]
2001203-1 = "Экстренная ситуация"
2001203-5 = "Площадь Геенны"
2001203-7 = "Я в полусонном состоянии прибыл в академию Геенна по работе."
2001203-8 = "Как только я приехал, Сэна вышла меня встречать."
2001203-9 = "Здравствуйте, Сенсей. Я вас ждала."
2001203-10 = ""
2001203-11 = "[s] «...?»"
2001203-13 = "[ns1] «Сэна?»\n[ns2] «Давно ты здесь?»"
2001203-14 = "Я хотела как можно скорее проверить ваше состояние."
2001203-15 = "Я хотела как можно скорее проверить ваше состояние."
2001203-16 = "Обычно Клуб экстренной медицинской помощи занимается только погибшими..."
2001203-17 = "То есть ранеными."
2001203-18 = "Однако если вы свалитесь от переутомления из-за работы,#nто тоже станете одним из раненых."
2001203-19 = "Вы выглядите гораздо хуже, чем я думала."
2001203-20 = "Не думаю, что в таком состоянии вам стоит продолжать работать.#nМожете ненадолго отложить дела?"
2001203-21 = ""
2001203-23 = ""
2001203-24 = "Хм. Понятно. Значит, не можете."
2001203-25 = "Тогда я не могу оставить вас одного."
2001203-26 = "В таком случае позвольте мне сопровождать вас."
2001203-27 = "Что?"
2001203-28 = "Я предлагаю стать вашим... секретарём?"
2001203-29 = "Я бы так не сказала. Я лишь слежу за вашим здоровьем и пытаюсь предотвратить новые жертвы."
2001203-30 = "Но если такая формулировка делает моё предложение для вас более приемлемым,#nможете понимать его именно так."
2001203-31 = "Помимо медицинской помощи, я помогу справляться со всем, что может вызвать у вас чрезмерный стресс."
2001203-32 = "Хм?"
2001203-33 = "Вы рады это слышать?"
2001203-34 = "..."
2001203-35 = "[s3] «Сэна?»\n[s4] «Я что-то не то сказал?»"
2001203-36 = "*вздох* Сенсей."
2001203-37 = "*вздох* Сенсей."
2001203-38 = "Учитывая ваше состояние, не будет преувеличением уже сейчас причислить вас к раненым."
2001203-39 = "В таком случае я могла бы следовать протоколу и силой доставить вас в медпункт нашего клуба."
2001203-40 = "Пожалуйста, поймите: я делаю очень редкое исключение, не поступая так,#nиз уважения к вашему расписанию и пожеланиям."
2001203-41 = "[s5] «Ты убедила. Прости.»\n[s6] «Постараюсь об этом помнить...»"
2001203-42 = "..."
2001203-43 = "..."
2001203-44 = "Итак, куда мы идём сначала?"
2001203-45 = "Расскажите мне своё расписание, и я поведу вас."
2001203-47 = "Я рассказал Сэне детали своего расписания, и мы отправились в путь."
2001203-48 = "Она помогала мне не только следить за физическим состоянием, но и организовывать работу и проводить исследования."
2001203-49 = "Я думал, что это займёт весь день, но мы закончили всего за несколько часов."
2001203-51 = "Хорошая работа, Сенсей. Нам удалось закончить ваши дела без каких-либо проблем."
2001203-52 = "Когда вы только пришли, казалось, что можете свалиться в любую секунду,#nно вы продержались гораздо лучше, чем я ожидала."
2001203-53 = "Вам удалось позаботиться и о работе, и о здоровье."
2001203-54 = "[s7] «Благодаря тебе, Сэна.»\n[s8] «Без тебя я бы не справился.»"
2001203-55 = "Не стоит благодарности. Я лишь помогала."
2001203-56 = "Не стоит благодарности. Я лишь помогала."
2001203-57 = "Здесь ваша работа закончена, но вам всё ещё нужно восстановиться."
2001203-58 = "Вам следует вернуться домой и отдохнуть."
2001203-59 = ""
2001203-61 = "Хм?"
2001203-62 = "Что-то не так?"
2001203-63 = "[s9] «Прости. Просто вдруг закружилась голова.»\n[s10] «Наверное, из-за усталости и стресса.»"
2001203-64 = ""
2001203-65 = ""
2001203-67 = ""
2001203-68 = "*вздыхает*"
2001203-69 = "Глупости."
2001203-70 = "Следить за вашим здоровьем — моя обязанность, и пока вы здесь, моя работа не закончена."
2001203-71 = "Раз так, позвольте мне проводить вас обратно в Шале.#nЭто будет моим последним заданием на сегодня."
2001203-72 = "Однако если по дороге вы потеряете сознание..."
2001203-73 = ""
2001203-75 = ""
2001203-76 = ""
2001203-77 = "...я отвезу вас в медпункт Клуба экстренной медицинской помощи."
2001203-78 = "Ясно?"
2001203-79 = "[s11] «Да, мэм.»\n[s12] «Не хочу становиться трупом!»"
2001203-80 = ""
2001203-81 = ""
2001203-83 = ""
2001203-84 = "..."
2001203-85 = ""
2001203-87 = ""
2001203-88 = ""
2001203-89 = "В таком случае позвольте мне вести."
2001203-90 = ""
2001203-92 = ""
2001203-94 = "Я изо всех сил старался не заснуть и шёл за Сэной, пока мы благополучно не добрались до здания Шале."
2001203-95 = "Как только мы вошли, я лёг и отключился. Когда проснулся, на мне было одеяло, а на лбу — влажное полотенце."
