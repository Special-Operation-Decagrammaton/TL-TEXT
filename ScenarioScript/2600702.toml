[translation]
2600702-1 = "Что значит наслаждаться"
2600702-3 = "О, Сенсей. Сюда!"
2600702-4 = "Простите, что заставила вас проделать весь путь сюда."
2600702-5 = "[s1] «Всё нормально, не переживай.»\n[s2] «Что это за место?»"
2600702-6 = "Спасибо, Сенсей."
2600702-7 = "...А? Это место?"
2600702-8 = "Это задняя часть курорта, здесь есть небольшая кладовая."
2600702-9 = "Это задняя часть курорта, здесь есть небольшая кладовая."
2600702-10 = "Я открыла её, чтобы взять инструменты для уборки и обслуживания, но нашла гораздо больше..."
2600702-11 = "Я нашла кучу брошенного оборудования... и не смогла пройти мимо. Ахаха..."
2600702-12 = "[s3] «Ты усердно работаешь даже здесь.»\n[s4] «...Ты очень постоянна.»"
2600702-15 = "Н-Но ведь это случайность, правда? Простите..."
2600702-16 = "Я знаю, что немного странная, но мне трудно измениться."
2600702-17 = "В таком месте мне правда стоило бы хоть немного забыть о делах Абидоса..."
2600702-18 = "Я действительно собиралась наслаждаться отдыхом на курорте... но в итоге просто рылась в кладовой."
2600702-19 = "Если подумать, это никуда не годится. Так у меня вообще не останется времени нормально отдохнуть."
2600702-20 = "Хм?"
2600702-21 = "Вы думаете, я и так наслаждаюсь? ...Правда?"
2600702-22 = "Но... всё, что я делала в свободное время — разбирала кладовую..."
2600702-23 = "[s5] «Наслаждаться — значит делать то, что тебе хочется.»\n[s6] «По-моему, для тебя это похоже на поиск сокровищ.»"
2600702-24 = "……!!"
2600702-25 = "……!!"
2600702-26 = "П-Правда? Наверное, так и есть!"
2600702-27 = "Мне стало легче это услышать, особенно от вас!"
2600702-28 = ""
2600702-30 = ""
2600702-31 = ""
2600702-33 = "Я-я переживала... пока разбирала кладовую."
2600702-34 = "Мне казалось, что я должна заниматься чем-то другим, понимаете?"
2600702-35 = "Раз уж мы на пляже, мне вроде как полагается плавать и пользоваться удобствами курорта..."
2600702-36 = "Мне казалось, что я делаю что-то неправильно, если не занимаюсь этим."
2600702-37 = "Поэтому мне и было неловко копаться в коробках..."
2600702-38 = "[s7] «Да, я так и подумал.»\n[s8] «Всё нормально. Именно поэтому я и пришёл.»"
2600702-39 = "Ах!"
2600702-40 = "Ах!"
2600702-41 = "Вы думали об этом с тех пор, как я отправила вам сообщение в MomoTalk."
2600702-42 = "Кажется, я опять нечаянно попросила вас о помощи... Ахаха..."
2600702-43 = "Хм?"
2600702-44 = "Вы пришли сюда, чтобы провести время со мной?"
2600702-45 = "Но... почему?"
2600702-46 = "Думаете, мне будет веселее заниматься этим не одной?"
2600702-47 = ""
2600702-49 = ""
2600702-50 = "Сенсей..."
2600702-51 = "Хм, даже не знаю, что сказать. Я не очень умею подбирать слова..."
2600702-52 = "Так... эм..."
2600702-53 = "..."
2600702-54 = "...Спасибо."
2600702-55 = ""
2600702-57 = ""
2600702-58 = "Хорошо! Тогда начинаем поиски сокровищ!"
2600702-59 = "Это состязание! Посмотрим, кто найдёт вещь получше!"
2600702-60 = "[s9] «Вызов принят.»\n[s10] «На каждый раунд по пять минут.»"
2600702-61 = "Хи-хи! Вам будет нелегко! У меня есть опыт руководства Оперативной группой по взысканию долгов!"
2600702-62 = "Хи-хи! Вам будет нелегко! У меня есть опыт руководства Оперативной группой по взысканию долгов!"
2600702-63 = "Готовы..."
2600702-64 = ""
2600702-66 = ""
2600702-67 = "...Начали!"
2600702-68 = ""
2600702-70 = ""
2600702-72 = "Мы с Аяне начали перебирать коробки."
2600702-73 = "Мы находили самые разные вещи. Устали, вспотели, а потом поняли."
2600702-74 = "Большая часть вещей была слишком большой, чтобы поместиться в вертолёт."
