[translation]
212150-1 = "Episode 15;Operation Planning"
212150-8 = "……."
212150-16 = "……."
212150-22 = "……."
212150-27 = "……."
212150-35 = "The cuckoo—"
212150-36 = "flies above the nest."
212150-42 = "Come in."
212150-50 = "Welcome, Iroha."
212150-51 = "Haa... it's getting suffocating in here, isn't it?"
212150-52 = "Tell me about it. The surveillance is getting stricter by the day."
212150-53 = "And since we've been flagged as persons of interest, it's hard to even find a gap to slip out."
212150-54 = "At this rate, we'll reach our limit soon."
212150-55 = "But we can't afford to be impatient. One mistake and we're out."
212150-61 = "Haa... we've got a problem."
212150-65 = "What happened...?"
212150-66 = "Did the tail find us out!?"
212150-67 = "No, I wouldn't make such a sloppy mistake."
212150-68 = "The problem is much more troublesome than that..."
212150-69 = "……What is it?"
212150-70 = "It turns out there's a remote control system in the Central Command Room."
212150-75 = "Remote control...? For what?"
212150-76 = "The broadcasting room. It seems they can operate the equipment remotely."
212150-77 = "……!!"
212150-78 = "In other words...?"
212150-79 = "……It means the moment we touch the broadcasting equipment, the Central Command Room will know."
212150-81 = "Exactly. The moment we turn on the power to the broadcasting equipment, they'll shut it down remotely."
212150-82 = "To achieve our goal, we either need to deceive it... or neutralize the system itself."
212150-83 = "Is that even possible...?"
212150-84 = "The Prefect Team leader is stationed in the operation room. We can't just walk in there."
212150-85 = "But to infiltrate the broadcasting room and play the jamming signal, we have to do something about that remote control system..."
212150-86 = "Don't ask for the impossible..."
212150-90 = "It's not like flipping the academy is supposed to be easy, right?"
212150-91 = "That may be true, but...! Whose side are you on, anyway!?"
212150-92 = "I'm saying you need to cool your head. Getting excited won't solve anything."
212150-93 = "I know that, but..."
212150-94 = "Still, you're really unpleasant."
212150-95 = "Heh, birds of a feather, aren't we?"
212150-96 = "……Huh?"
212150-100 = "Come now. You've cooled off a bit, right?"
212150-101 = "Mmph..."
212150-103 = "It seems like a dead end, but... is there any other way...?"
212150-104 = "Infiltrating the broadcasting room... the broadcasting room..."
212150-105 = "Satsuki-senpai, is it possible to disconnect the remote control system from the broadcasting room equipment?"
212150-106 = "……I can't say for sure. I don't have knowledge of every single piece of communication equipment."
212150-107 = "Either way, considering the time it would take to analyze the frequencies, we simply don't have enough time."
212150-108 = "Haa..."
212150-112 = "Wait. Now that I think about it—"
212150-113 = "Did you think of something?"
212150-114 = "I know someone who seems to be very familiar with the broadcasting room..."
212150-128 = "We'll do it! We'll do it!!"
212150-129 = "That was an instant answer!? Do you even understand what you're getting into?"
212150-130 = "Kirara-chan, calm down."
212150-131 = "Well... we were planning on doing it anyway."
212150-132 = "I thought of you two because you have experience with school broadcasts, but honestly, I didn't expect you to agree so quickly..."
212150-133 = "By the way, Iroha-chan, did you really quit Pandemonium Society?"
212150-134 = "Eh, has that spread that far already?"
212150-135 = "You quit because the direction Pandemonium Society was heading didn't align with yours, right?"
212150-136 = "……Yes, well. That's right."
212150-137 = "A lot has happened lately, hasn't it?"
212150-139 = "We weren't feeling too good about it either."
212150-140 = "Attacking Kivotos? That makes no sense."
212150-141 = "We have friends in other academies too, so you want us to fight them for real? I'll pass on that."
212150-143 = "……Yes. Honestly, what are they even thinking?"
212150-144 = "Yeah, yeah. We feel the same way."
212150-146 = "So we'll help you."
212150-152 = "It's good to have friends."
212150-154 = "Oh, that makes me so happy!"
212150-155 = "I'm counting on you from here on out."
212150-156 = "So, what exactly do we need to do?"
212150-167 = "—That's the situation. Do you remember how to use the equipment?"
212150-168 = "Can I clarify something first?"
212150-169 = "We just need to bypass the remote control system, right?"
212150-170 = "Yes. It would be ideal if we could connect directly to the transmitter without going through the power supply."
212150-171 = "……I think we can do that."
212150-173 = "Y-you can!?"
212150-174 = "Erika-chan is actually pretty good at this kind of stuff!"
212150-175 = "It's nothing to brag about, but... for the equipment that was in the broadcasting room, at least."
212150-176 = "Does that mean the problem is solved!?"
212150-177 = "The final piece has fallen into place. I wonder if our luck is finally turning."
212150-178 = "Heh, looks like things might actually work out, right?"
212150-179 = "Then, let's plan the operation while the School Lunch Club buys us some time."
212150-180 = "We should be able to buy at least a few days. If we're lucky, maybe even a few weeks—"
212150-186 = "T-trouble...!!"
212150-190 = "Calm down. What happened?"
212150-194 = "The attack... it's about to start soon!!"
212150-195 = "Why!?"
212150-204 = "—That is the situation..."
212150-205 = "W-wait a second. Chemical shells!?"
212150-206 = "And ones with incredible power, at that..."
212150-208 = "The scale is so huge I can't even keep up~!"
212150-209 = "This... this is the scariest thing I've heard so far..."
212150-211 = "Something like that actually existed in Gehenna...?"
212150-215 = "……It did."
212150-219 = "To be precise, I should say it 'existed'..."
212150-220 = "Makoto-chan... so you did remember. You just didn't build it..."
212150-221 = "Why does Makoto-senpai know about that!?"
212150-222 = "Didn't I tell you? We disposed of the Kaiser's traces together."
212150-223 = "In other words, she saw it all with her own eyes."
212150-224 = "Is it possible to remember that much just by looking at it...?"
212150-225 = "Makoto-chan has a very good memory when it comes to fields she's interested in."
212150-227 = "Seriously... she's only competent at times like this."
212150-228 = "This is what it means when they say a serious Makoto-chan is more troublesome than anyone else in Kivotos."
212150-229 = "Wait, if that's true, then we have almost no time left, right?"
212150-230 = "We don't have time to be leisurely planning an operation...!!"
212150-234 = "……Let's go, right now."
212150-236 = "Eh? Already!?"
212150-237 = "Let's go immediately. At this point, that's for the best. The basic plan is already set."
212150-238 = "I'm scared, but... if I can be of help, I'll do my best!"
212150-239 = "……I didn't think the time for the decisive battle would come so soon."
212150-240 = "Ah, and I'll contact the others as well."
212150-241 = "We have no choice but to rely on them... even if I'm not thrilled about it."
212150-242 = "Right now, we are allies who share the same goal."
212150-243 = "Yes. Then—"
212150-252 = "Next Episode;Gehenna Reclamation Operation (1)"