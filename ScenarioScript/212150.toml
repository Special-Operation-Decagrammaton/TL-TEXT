212150-32 = ""
212150-35 = "Кукушка."
212150-36 = "Пролетела над гнездом."
212150-37 = ""
212150-42 = "Приём."
212150-43 = ""
212150-45 = ""
212150-46 = ""
212150-49 = ""
212150-50 = "Рада видеть тебя, Ироха."
212150-51 = "*вздох* Давление становится всё сильнее."
212150-52 = "А, я тоже заметила. Кругом глаза и уши, улицы заполонила охрана..."
212150-53 = "...Мы все теперь под подозрением. Просто чудо, что смогли уйти незамеченными."
212150-54 = "Долго так продолжаться не может."
212150-55 = "Действуйте осторожно. Малейшая ошибка может всё разрушить."
212150-56 = ""
212150-60 = ""
212150-61 = "*вздох* Дамы, у нас проблема."
212150-62 = ""
212150-64 = ""
212150-65 = "Что случилось, Сацуки...?"
212150-66 = "Ой, за тобой кто-то следил?!"
212150-67 = "Нет. Я не настолько беспечна."
212150-68 = "Всё куда сложнее... и срочнее."
212150-69 = "...Что такое?"
212150-70 = "В стратегическом штабе установлена система удалённой защиты."
212150-71 = ""
212150-73 = ""
212150-75 = "Для «защиты» чего...?"
212150-76 = "Оборудования в радиорубке."
212150-77 = "...!!!"
212150-78 = "Р-разве это не значит...?"
212150-79 = "...Они мгновенно узнают, если мы тронем вещательное оборудование."
212150-81 = "Да. Пока главный сервер работает, доступ для нас закрыт. Стоит включить аппаратуру в радиорубке, в штабе получат сигнал тревоги и сразу смогут отключить питание."
212150-82 = "Чтобы добыть нужные данные, нам придётся либо обмануть систему, либо вывести из строя удалённую защиту."
212150-83 = "Т-тогда что же нам делать...?"
212150-84 = "Глава Префектуры постоянно находится в штабе. Мимо неё нам не пройти."
212150-85 = "Но чтобы проникнуть в радиорубку и заглушить сигнал, нужно отключить систему удалённого управления..."
212150-86 = "Ух, почему всё так сложно?!"
212150-87 = ""
212150-89 = ""
212150-90 = "А ты думала, свергнуть власть в академии будет легко?"
212150-91 = "Нет, но...! Погоди, ты вообще на чьей стороне?"
212150-92 = "Я говорю тебе успокоиться, Иори. Если будешь вспыхивать из-за каждой мелочи, мы никуда не продвинемся."
212150-93 = "...Это правда, но..."
212150-94 = "Всё равно ты меня бесишь."
212150-95 = "Яха. Какая же ты душка."
212150-96 = "...Что?"
212150-97 = ""
212150-99 = ""
212150-100 = "Уже успокоилась?"
212150-101 = "Угх..."
212150-103 = "Что ещё можно сделать? Какие... у нас вообще варианты?"
212150-104 = "Попасть в радиорубку... Радиорубку..."
212150-105 = "Сацуки, а можно как-нибудь отключить эти удалённые датчики или что там стоит на оборудовании?"
212150-106 = "Ничего не могу гарантировать. Я почти не знаю это место."
212150-107 = "Если мы попадём внутрь, мне и так придётся полностью сосредоточиться на анализе частот. А времени и без того мало."
212150-108 = "А-а..."
212150-109 = ""
212150-111 = ""
212150-112 = "Погодите. А ведь если подумать..."
212150-113 = "Есть идея?"
212150-114 = "Я знаю пару студентов, которые могут разбираться в оборудовании радиорубки..."
212150-115 = ""
212150-117 = ""
212150-126 = ""
212150-128 = "Я в деле! Я ОПРЕДЕЛЁННО в деле!"
212150-129 = "Уже?! Ты вообще поняла, что мы задумали?"
212150-130 = "*вздох* Кирара, ты слишком быстро согласилась."
212150-131 = "Но... это ничего не меняет. Конечно, мы поможем."
212150-132 = "...Я позвала вас двоих, потому что только у вас есть опыт работы со школьным вещанием. Но почти не надеялась на успех..."
212150-133 = "Эм. Ироха. Ты ведь ушла из Пандемониума?"
212150-134 = "Ух, об этом уже все знают?"
212150-135 = "И ты ушла потому, что была с ними не согласна, верно? Ваши взгляды не совпали?"
212150-136 = "...Эм, да. Именно так."
212150-137 = "Столько заявлений Пандемониума, а ещё Префектура и военная подготовка..."
212150-139 = "Нам всё это тоже было не по душе."
212150-140 = "Все эти громкие речи о завоевании Кивотоса... У нас обеих есть друзья в других академиях."
212150-141 = "И они всерьёз хотели, чтобы мы сражались со своими друзьями и проливали кровь ради Геенны? Ни за что."
212150-143 = "...Да. Это полный абсурд."
212150-144 = "И раз мы против всего этого..."
212150-146 = "...то мы союзники."
212150-147 = ""
212150-150 = ""
212150-151 = ""
212150-152 = "...Я рада, что мы подружились."
212150-154 = "Как мило! Слышишь, Эрика? Друзья до гроба!"
212150-155 = "Надеюсь, до гроба не дойдёт. Но мы поможем всем, чем сможем."
212150-156 = "Так что именно нам нужно сделать?"
212150-165 = ""
212150-167 = "...Вот, в общем-то, и всё. Вы знакомы с вещательным оборудованием?"
212150-168 = "Эм... Если я правильно поняла..."
212150-169 = "Нам нужно обойти систему удалённой защиты, верно? Потому что она позволяет аварийно отключить оборудование?"
212150-170 = "Верно. Лучше всего подключиться непосредственно к передатчику."
212150-171 = "Думаю, это возможно."
212150-173 = "П-правда? Ты сможешь?"
212150-174 = "Эрика просто супер разбирается в электронике!"
212150-175 = "Я не эксперт, но оборудование видела и знаю, с чем придётся работать. Справлюсь."
212150-176 = "Ничего себе! Значит, проблема решена?"
212150-177 = "Фу-фу, удача снова на нашей стороне. Нужные люди нашлись в нужный момент."
212150-178 = "Я чувствовала, что всё получится. Очко в пользу хороших ребят! Яха!"
212150-179 = "Ну что, пока Клуб школьного питания выигрывает для нас время, займёмся планом?"
212150-180 = "Они должны обеспечить нам как минимум несколько дней, а если повезёт, то и недель..."
212150-181 = ""
212150-185 = ""
212150-186 = "У-У НАС ОГРОМНАЯ ПРОБЛЕМА!"
212150-187 = ""
212150-189 = ""
212150-190 = "Хм? Что случилось, Чиаки?"
212150-191 = ""
212150-193 = ""
212150-194 = "...В-война начнётся! УЖЕ СКОРО!!!"
212150-195 = "Что? Но как?"
212150-198 = ""
212150-199 = ""
212150-201 = ""
212150-202 = ""
212150-204 = "...И вот что произошло..."
212150-205 = "П-погодите. Химические боеголовки?!"
212150-206 = "Да...! Причём оружие массового уничтожения..."
212150-208 = "Э-это уже слишком серьёзно!"
212150-209 = "Становится по-настоящему страшно..."
212150-211 = "В нашей академии есть такое оружие...?"
212150-212 = ""
212150-214 = ""
212150-215 = "...Есть."
212150-216 = ""
212150-218 = ""
212150-219 = "Точнее, БЫЛО."
212150-220 = "Макото... Значит, ты всё помнила. Просто не пользовалась этими знаниями..."
212150-221 = "П-почему Макото вообще знает, как создавать боеголовки?"
212150-222 = "Я ведь говорила. Мы вместе уничтожали всё, что осталось от Императора-тирана."
212150-223 = "А значит, собственными глазами видели все её исследования."
212150-224 = "Но как она могла запомнить всё это, увидев всего раз...? Она даже своё расписание толком не помнит."
212150-225 = "У Макото потрясающая память, когда дело касается того, что ей интересно."
212150-227 = "...Тц, серьёзно... ИМЕННО СЕЙЧАС ей вздумалось проявить способности."
212150-228 = "...Я же говорила. Когда Макото берётся за что-то всерьёз, она опаснее кого угодно в Кивотосе."
212150-229 = "Но если это правда, значит, у нас почти не осталось времени?"
212150-230 = "Мы больше не можем позволить себе запасные планы и долгие раздумья."
212150-231 = ""
212150-233 = ""
212150-234 = "...Идём. Сейчас же."
212150-236 = "А? Вот так сразу?"
212150-237 = "Да. Теперь чем быстрее, тем лучше. Основной план у нас есть. Мы доверяем друг другу."
212150-238 = "Мне жутко страшно... Но если мы МОЖЕМ помочь, значит, обязаны!"
212150-239 = "...Спасибо. Не думала, что столкновение произойдёт так скоро."
212150-240 = "А, и я сообщу «им», что мы выступаем."
212150-241 = "Полагаю, придётся... Предчувствие у меня плохое, но времени нет."
212150-242 = "Знайте, что мы союзники... Нет, друзья, объединённые одной достойной целью."
212150-243 = "Да. Тогда..."
212150-244 = ""
212150-246 = ""
212150-252 = "Следующий эпизод;Операция «Возвращение Геенны», часть 1"
