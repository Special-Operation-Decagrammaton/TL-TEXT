212150-49 = ""
212150-50 = "Bem-vinda, Iroha-chan."
212150-51 = "Ufa...... esse clima tá ficando cada vez mais sufocante."
212150-52 = "Nem me fale. A vigilância tá aumentando a cada minuto."
212150-53 = "Ainda mais nós, que estamos na lista negra de monitoramento prioritário.#nConseguir escapar pra cá foi quase um milagre."
212150-54 = "Se continuarmos assim, o cerco vai se fechar de vez."
212150-55 = "Mas não podemos nos afobar. Um tropeço em falso e acabou pra todas nós."
212150-56 = ""
212150-60 = ""
212150-61 = "Ai, ai...... surgiu um problemão daqueles."
212150-62 = ""
212150-64 = ""
212150-65 = "O que foi que aconteceu......?"
212150-66 = "Descobriram o nosso esconderijo?!"
212150-67 = "Não, eu não cometeria uma cabacice dessas."
212150-68 = "Mas a encrenca é muito mais espinhosa......"
212150-69 = "......Desembucha logo."
212150-70 = "Descobri que a sala de comando central possui um sistema de controle remoto."
212150-71 = ""
212150-73 = ""
212150-75 = "Controle remoto......? De onde?"
212150-76 = "Da sala da rádio. Eles conseguem manipular os transmissores à distância."
212150-77 = "......!!"
212150-78 = "O que significa que......?"
212150-79 = "......Que no exato segundo em que encostarmos no console da rádio, a sala de comando central vai saber."
212150-81 = "Exatamente. Bastará ligarmos a chave geral para que eles cortem o sinal remotamente lá de dentro."
212150-82 = "Para que nosso plano dê certo, teremos que burlar esse sistema...... ou neutralizá-lo por completo."
212150-83 = "E tem como fazer uma coisa dessas......?!"
212150-84 = "A Presidente Hina fica de plantão dentro da sala de comando o tempo todo. Não dá pra simplesmente chutar a porta."
212150-85 = "Mas para invadirmos a rádio e transmitirmos a frequência, precisamos desativar esse bloqueio de qualquer jeito......"
212150-86 = "Não viaja na maionese, pô......"
212150-87 = ""
212150-89 = ""
212150-90 = "Você achou que dar um golpe de Estado numa academia ia ser moleza, querida?"
212150-91 = "Eu sei que não é fácil! Mas de que lado você tá afinal, ô sem noção?!"
212150-92 = "Tô mandando você esfriar os miolos. Ficar histérica não vai consertar nada."
212150-93 = "Pior que você tá certa, mas......"
212150-94 = "Mesmo assim, você é insuportavelmente antipática."
212150-95 = "Hahaha, duas farinhas do mesmo saco, né?"
212150-96 = "......Como é que é?!"
212150-97 = ""
212150-99 = ""
212150-100 = "Pronto, pronto. Deu uma esfriada na cabeça agora?"
212150-101 = "Hunf......"
212150-103 = "Parece um beco sem saída, mas...... será que não tem outra alternativa?"
212150-104 = "Invasão da rádio...... sala da rádio......"
212150-105 = "Satsuki-senpai, você conseguiria desligar fisicamente o receptor remoto direto nos aparelhos da sala da rádio?"
212150-106 = "......Não posso dar garantias. Não tenho o mapeamento elétrico de todos aqueles consoles antigos."
212150-107 = "E considerando o tempo para analisar a frequência antes de transmitir, o tempo simplesmente não fecha."
212150-108 = "Ai meu Deus......"
212150-109 = ""
212150-111 = ""
212150-112 = "Espera aí! Pensando bem――"
212150-113 = "Lembrou de algo, Iroha?"
212150-114 = "Conheço pessoas que dominam aquela sala da rádio de olhos fechados......"
212150-115 = ""
212150-117 = ""
212150-126 = ""
212150-128 = "Tamo dentro! Pode contar com a gente!!"
212150-129 = "Assim, de primeira?!#nVocês entenderam a gravidade do que estamos prestes a fazer?"
212150-130 = "Kirara-chan, calma o facho."
212150-131 = "Bem...... de qualquer forma, a gente já tava querendo fazer alguma coisa mesmo."
212150-132 = "Pensei em vocês duas por causa da experiência com as transmissões escolares, mas confesso que não esperava uma adesão tão rápida......"
212150-133 = "Fiquei sabendo que você pulou fora da Sociedade Pandemônio, Iroha-chan."
212150-134 = "Eita, essa fofoca já correu tanto assim?"
212150-135 = "Se você saiu, é porque a Pandemonium tá marchando pra um abismo tenebroso, né?"
212150-136 = "......É, exatamente isso."
212150-137 = "Ultimamente só acontece doideira por aqui."
212150-139 = "A gente também tava de saco cheio desse clima pesado."
212150-140 = "Atacar Kivotos inteira? Que ideia de jerico sem pé nem cabeça!"
212150-141 = "Eu tenho um montão de amigas queridas nas outras escolas! Sair trocando tiro com elas? Nem morta!"
212150-143 = "......Pois é. Quem em sã consciência concordaria com uma barbaridade dessas?"
212150-144 = "Com certeza! Nós pensamos igualzinho."
212150-146 = "Então vamos ajudar com força total!"
212150-147 = ""
212150-150 = ""
212150-151 = ""
212150-152 = "Ter amigos de verdade é a melhor coisa da vida."
212150-154 = "Aaaah, fico super hiper feliz em ouvir isso!"
212150-155 = "Tamo juntas pro que der e vier."
212150-156 = "Mas diz aí: o que exatamente a gente tem que fazer?"
212150-165 = ""
212150-167 = "――Em suma, é essa a situação. Vocês ainda se lembram de como operar aquela aparelhagem?"
212150-168 = "Deixa eu ver se entendi o resumo da ópera:"
212150-169 = "Basta a gente contornar o bloqueio do sistema de controle remoto, né?"
212150-170 = "Sim. O ideal seria puxar um fio direto da antena pro transmissor sem passar pela alimentação central."
212150-171 = "......Moleza. Eu consigo fazer isso tranquilamente."
212150-173 = "S-Sério mesmo?! Você consegue?!"
212150-174 = "A Erika-chan é fera demais nessa parte técnica de cabos e circuitos!"
212150-175 = "Não é nada pra ficar se gabando...... mas com o maquinário daquela sala, tiro de letra."
212150-176 = "Então nosso maior obstáculo técnico tá resolvido?!"
212150-177 = "O último quebra-cabeça se encaixou. Parece que a sorte finalmente começou a sorrir para nós."
212150-178 = "Uhuuu! Parece que vai dar super bom!"
212150-179 = "Agora podemos traçar o plano tático com calma enquanto o Clube de Alimentação segura o cronograma delas."
212150-180 = "Temos no mínimo alguns dias; com sorte, semanas inteiras de fôlego――"
212150-181 = ""
212150-185 = ""
212150-186 = "G-G-GENTEEE!! DEU RUIM!!"
212150-187 = ""
212150-189 = ""
212150-190 = "Calma, respira fundo! O que aconteceu?!"
212150-191 = ""
212150-193 = ""
212150-194 = "O ataque...... o ataque vai começar a qualquer momento!!"
212150-195 = "COMO ASSIM?!"
212150-198 = ""
212150-199 = ""
212150-201 = ""
212150-202 = ""
212150-204 = "――E foi isso o que eu acabei de flagrar na reunião de cúpula......"
212150-205 = "P-Pera aí, pera aí...... Mísseis com ogivas químicas?!"
212150-206 = "E de destruição em massa devastadora......"
212150-208 = "Essa loucura passou dos limites da estratosfera, gente!!"
212150-209 = "Isso...... é a coisa mais apavorante que eu já ouvi em toda a minha vida......"
212150-211 = "Gehenna tinha armas desse calibre escondidas esse tempo todo......?"
212150-212 = ""
212150-214 = ""
212150-215 = "......Tem."
212150-216 = ""
212150-218 = ""
212150-219 = "Mais precisamente: tinha no passado."
212150-220 = "Makoto-chan...... ela realmente guardou todas as fórmulas na cabeça. Só não tinha fabricado antes......"
212150-221 = "Mas como a Makoto-senpai sabe construir uma coisa dessas?!"
212150-222 = "Eu não disse a vocês? Nós incineramos juntas todo o entulho da Imperatriz."
212150-223 = "Em outras palavras: ela viu e dissecou cada projeto pessoalmente."
212150-224 = "Ela tem capacidade de decorar tudo com tanta exatidão só de bater o olho......?"
212150-225 = "A Makoto-chan tem uma memória fotográfica assustadora quando o assunto desperta o interesse dela."
212150-227 = "Puta que o pariu...... por que ela só demonstra essa competência monstra nas piores horas possíveis?!"
212150-228 = "Eu avisei: a Makoto-chan jogando sério é o adversário mais perigoso de toda a Kivotos."
212150-229 = "Peraí, se isso for verdade, não nos sobrou tempo nenhum!"
212150-230 = "Não dá mais pra ficar filosofando sobre estratégias no papel......!!"
212150-231 = ""
212150-233 = ""
212150-234 = "......Vamos agora. Imediatamente."
212150-236 = "Hã?! Agora mesmo?!"
212150-237 = "Ataque-relâmpago! Tem que ser agora! A espinha dorsal do plano já tá pronta!"
212150-238 = "Dá um baita frio na barriga...... mas se eu puder ajudar, vou com tudo!"
212150-239 = "......Não imaginei que a hora da verdade chegaria tão repentinamente."
212150-240 = "Ah, e tem mais: vou mandar um sinal cifrado para o [ruby=・]ou[/ruby][ruby=・]tro[/ruby] [ruby=・]la[/ruby][ruby=・]do[/ruby]."
212150-241 = "Não temos outra escolha senão confiar nelas...... mesmo me dando calafrios."
212150-242 = "Neste momento, somos todas [ruby=・]com[/ruby][ruby=・]pa[/ruby][ruby=・]nhei[/ruby][ruby=・]ras[/ruby] unidas pelo mesmo ideal."
212150-243 = "Sim. Portanto――"
