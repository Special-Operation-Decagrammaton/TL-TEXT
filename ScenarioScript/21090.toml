[translation]
21090-1 = "Эпизод 9;Вопросы Юуки"
21090-2 = "Департамент Разработки Игр Милленниума"
21090-3 = "Псс. Эй, Алиса, если Департамент Разработки Игр угрозами заставляет тебя здесь оставаться, моргни левым глазом."
21090-4 = "(пустой взгляд)"
21090-5 = "Что ты там шепчешь?! Что ты пытаешься сделать с нашей Алисой?!"
21090-6 = ""
21090-8 = ""
21090-10 = "Вот, взгляни на этот безупречный студенческий! Она настоящий студент!"
21090-11 = "Хмм... Я уже подтвердила, что она есть в реестре студентов и ей выдан студенческий билет."
21090-12 = "Но этого будет мало, чтобы меня убедить."
21090-14 = "(Акх!)"
21090-15 = "(О-Она нас раскусила?!)"
21090-16 = ""
21090-17 = "Хватит предисловий, начинаем допрос."
21090-18 = "В этот раз она даже не попыталась этого скрыть..."
21090-19 = ""
21090-20 = "Итак, Алиса, расскажи, как ты вступила в Департамент Разработки Игр?"
21090-21 = "Ну, когда я проснулась, я была здесь... Стоп, нет, не так..."
21090-22 = "Момои, можешь перестать сверлить нас таким взглядом?"
21090-23 = "Я, эм... хотела поиграть в Castlemania, а потом услышала, что здесь есть игровой клуб..."
21090-24 = "Хмм... Понятно."
21090-25 = "(Отлично! У тебя прекрасно получается, Алиса!)"
21090-26 = "В предыдущем ответе ты сказала \"игровой клуб\". Как ты наверняка уже знаешь, Департамент Разработки Игр существует не только для того, чтобы играть в игры."
21090-27 = "Если ты участвуешь в разработке, какая у тебя здесь роль?"
21090-28 = "Танк и боец ближнего боя светового типа..."
21090-29 = "...Что?"
21090-30 = "Ой! Я-Я хотела сказать... я... п-п-про...гламмист!"
21090-31 = "Ты имеешь в виду \"программист\"?"
21090-32 = "О, да, именно! Я воплощение идеального программиста."
21090-33 = "(Она всё запорола!)"
21090-34 = "Понятно... Программирование — тяжёлая работа."
21090-35 = "О, да, быть п-программистом тяжело. Иногда мы умираем от переработок."
21090-36 = "Ч-что?!"
21090-37 = "Но на самом деле это не такая большая проблема!"
21090-38 = "СМЕРТЬ — не большая проблема?!"
21090-39 = "Да! Обычно просто просыпаешься в трактире или отдаёшь деньги собору — и полностью воскресаешь!"
21090-40 = "А...? Ч-Что ты вообще говоришь?"
21090-41 = "Хм? Это же общеизвестно. Разве ты не играла в The Fable of Heroes или какую-нибудь игру серии Brother?"
21090-43 = "Они очень хорошие. Тебе стоит попробовать."
21090-44 = "..."
21090-46 = "Гейм овер..."
21090-48 = "..."
21090-49 = "Ладно, думаю, на этом закончим."
21090-50 = "Теперь я отлично понимаю, кто такая Алиса."
21090-52 = "(Нам конец!)"
21090-53 = "(Ч-Ч-Что нам д-делать?!)"
21090-54 = ""
21090-56 = "Эм..."
21090-57 = "Во-первых, я вижу, что ты чудаковатая."
21090-58 = "Но ещё важнее — ты любишь исследовать новые миры, работать с друзьями и достигать новых целей..."
21090-59 = ""
21090-60 = "Я ни капли не сомневаюсь, что ты участница Департамент Разработки Игр."
21090-62 = "Погоди, правда...?"
21090-63 = "Тогда это значит...?!"
21090-65 = "Вы выполнили необходимые требования для сохранения статуса официального клуба."
21090-67 = "Вуху!"
21090-68 = "Мы сделали это!"
21090-69 = "З-Значит, у нас останется клубная комната? О, и мы получим бюджет?!"
21090-70 = "Конечно."
21090-71 = "Ну, до конца семестра."
21090-72 = "Вау! Стоп... что?"
21090-73 = "Ч-что вы сказали?!"
21090-74 = "Но нас теперь достаточно! Чего ещё тебе нужно?!"
21090-76 = "А? О, я думала, вы уже знаете."
21090-77 = "Да, малое количество участников было проблемой, но клуб также должен показать какие-то ощутимые результаты."
21090-78 = "Конечно, вам будет предоставлен льготный период, поскольку правила изменились совсем недавно."
21090-79 = "Но если за месяц вы не покажете результатов, клуб закроют независимо от того, будет у вас четыре участника или четыреста!"
21090-80 = "Э-этого не может быть!"
21090-81 = "Но это и происходит! Я уже объяснила это всем президентам клубов."
21090-82 = "Если подумать, ваш президент, Юзу, на том собрании отсутствовала."
21090-83 = "А?!"
21090-84 = "Таким образом, ответственность за соблюдение изменений ложится на вас."
21090-85 = "Гр-р... Это несправедливо!"
21090-86 = "Что тут несправедливого? Наоборот, заставить всех соблюдать одинаковые правила — это так-то и есть определение справедливости."
21090-87 = "Если честно, у меня всё ещё есть подозрения насчёт личности Арис,#nи сегодня я пришла сюда с намерением закрыть этот клуб."
21090-88 = "А?!"
21090-89 = "Но одно для меня совершенно ясно — Алиса по-настоящему любит игры."
21090-90 = "Видя такую страсть, я не могу с чистой совестью лишить вас льготного периода. Если эта страсть настоящая, она должна дать соответствующий результат."
21090-91 = "Насколько я помню, Момои, разве ты не говорила, что на Премии Милленниума ты покажешь нам что-то невероятное?"
21090-92 = "Я... кажется, говорила."
21090-93 = "Что ж, теперь у вас есть новый участник, а значит больше ресурсов, чтобы сделать новую игру ещё веселее, верно?"
21090-94 = "Буду с нетерпением ждать возможности поиграть в неё. Пока!"
21090-95 = ""
21090-97 = "Стой, ты... Ты...! А-а-аргх!"
21090-98 = "Она ушла..."
21090-100 = "Хм..."
21090-101 = "Получается, в итоге мы всё ещё в большой беде."
21090-102 = "Гах! Отстой! Они просто пытаются от нас избавиться!"
21090-103 = "...Простите. Нужно было пойти на собрание клубов."
21090-104 = "Э-Это не твоя вина, Юзу! Если ты не могла, Момои должна была пойти вместо тебя!"
21090-105 = "Точно, но, эм..."
21090-106 = "Ну, понимаешь, тогда шанс выпадения предметов удвоили."
21090-107 = "Удали эту игру прямо сейчас!"
21090-108 = "Ух... Остался только один вариант."
21090-109 = "Ага..."
21090-110 = "Нам нужно сделать игру, которую можно представить на Премии Милленниума."
21090-111 = "И всё равно нам нужна Г.БИБЛИЯ! Угх, значит, нам снова идти в руины?"
21090-112 = "..."
21090-113 = ""
21090-114 = ""
21090-116 = "Это всё моя вина."
21090-117 = "А? Что ты сказала, Юзу?"
21090-118 = "Если вы возвращаетесь в руины... то я пойду с вами."
21090-119 = "Ты ЧТО?!"
21090-120 = "Н-Но ты полгода не выходила из здания школы. Даже все занятия проходила онлайн!"
21090-121 = "Я должна ответить за свою ошибку... Этот клуб принадлежит всем нам, не только мне."
21090-122 = "Ради всех я хочу его защитить."
21090-123 = "Юзу..."
21090-124 = ""
21090-126 = "Пам-па-ка-пан! Юзу присоединилась к отряду!"
21090-127 = "Ладно. Сделаем это!"
21090-128 = "Алиса. Проверь оружие и снаряжение!"
21090-129 = ""
21090-130 = ""
21090-131 = "Снаряжение готово. Я экипировала Сверхновую: Меч Света в слот оружия."
21090-132 = ""
21090-134 = "Вот это настрой! В этот раз Г.БИБЛИЯ будет наша! Пошли!"
21090-135 = "..."
21090-136 = "Точно."
21090-137 = "Мы вместе защитим эту клубную комнату!"
21090-139 = "Следующий эпизод;Назад в руины"
