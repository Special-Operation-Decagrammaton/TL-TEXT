[translation]
21090-1 = "Episódio 9;A Pergunta de Yuuka"
21090-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21090-3 = "...Aris-chan. Se você estiver sendo ameaçada pelo Clube de Desenvolvimento de Jogos e obrigada a ficar aqui, pisque com o olho esquerdo."
21090-4 = "...?"
21090-5 = "Ei, que pergunta é essa logo de cara?! Mesmo falando baixinho eu consigo ouvir! E aliás, a gente nunca faria isso!!"
21090-10 = "Olha só pra essa carteirinha estudantil reluzente! É a prova incontestável de que ela é aluna da Millennium!"
21090-11 = "Hmm... De fato, eu também confirmei que a Aris-chan está registrada no cadastro de alunas, mas..."
21090-12 = "Eu não sou o tipo de pessoa que se deixa enganar tão fácil assim."
21090-14 = "(Sobressalto)"
21090-15 = "(E-Ela descobriu?!)"
21090-17 = "Bem, então vamos retomar o interrogatório?"
21090-18 = "Ela nem faz mais questão de disfarçar..."
21090-20 = "Aris-chan, o que te levou a entrar no Clube de Desenvolvimento de Jogos?"
21090-21 = "Quando dei por mim já estava aqui... quer dizer, não é isso..."
21090-22 = "Momoi, por que você está encarando a Aris-chan desse jeito? Pare com isso."
21090-23 = "É que... eu queria jogar \"Castelo do Rei Demônio: Drácula\"... e aí acabei descobrindo o Clube de Desenvolvimento de Jogos..."
21090-24 = "Hmm... entendi."
21090-25 = "(Isso! Continua assim, Aris-chan!)"
21090-26 = "Mas aqui não é um clube de jogos retrô, e sim o Clube de Desenvolvimento de Jogos."
21090-27 = "Ou seja, você também vai participar da criação de jogos, certo? Qual vai ser a sua função?"
21090-28 = "Tanque e atacante de atributo Luz..."
21090-29 = "Hã?"
21090-30 = "Quer dizer, é... p-p-p... programarosa!"
21090-31 = "...Oi? Você não quis dizer programadora?"
21090-32 = "Ah, sim! Isso mesmo, exatamente. Sem dúvida nenhuma, eu sou uma programadora perfeita."
21090-33 = "(Ferrou...?!)"
21090-34 = "Programadora, é... Ouvi dizer que é uma função bem difícil."
21090-35 = "Sim, é-é verdade. Ser p-programadora é bem puxado. Às vezes até perco a consciência por excesso de trabalho."
21090-36 = "O-O quê?!"
21090-37 = "Mas está tudo bem!"
21090-38 = "Não, não está tudo bem, não... Você precisa descansar direito..."
21090-39 = "É só dormir na pousada e acordar, ou pagar uma taxa na catedral, que eu revivo junto com os meus companheiros!"
21090-40 = "C-Claro que não é assim que funciona!!"
21090-41 = "Não funciona assim...? Achei que fosse senso comum... Por acaso você não conhece \"Mito dos Heróis\" nem \"Lenda da Lança Sagrada\"?"
21090-43 = "São verdadeiras \"obras-primas dos games\"."
21090-44 = "..."
21090-46 = "Acabou... acabou tudo..."
21090-48 = "..."
21090-49 = "...Obrigada. Eu entendi."
21090-50 = "Foi pouco tempo, Aris-chan, mas já deu para entender boa parte sobre você."
21090-52 = "(Já eraaa!)"
21090-53 = "(O que a gente faz...?!)"
21090-56 = "...?!"
21090-57 = "Ainda há algumas coisas meio suspeitas, mas..."
21090-58 = "Que você gosta de jogos... e que ama histórias de aventura por mundos novos e conquistas ao lado dos amigos... isso ficou bem claro."
21090-60 = "Não há nada de estranho em alguém assim ser membro do Clube de Desenvolvimento de Jogos."
21090-62 = "Hã...?"
21090-63 = "Isso quer dizer que...?!"
21090-65 = "Como vocês atingiram o número mínimo de membros, reconheço novamente o Clube de Desenvolvimento de Jogos como um clube oficial... e aprovo a continuidade das suas atividades."
21090-67 = "Ebaaa!"
21090-68 = "Que alívio!"
21090-69 = "E-Então a gente também vai receber verba e pode continuar usando a sala do clube?!"
21090-70 = "Sim, claro."
21090-71 = "Pelo menos até o fim \"deste semestre\"... né."
21090-72 = "Uhuuu... hã?"
21090-73 = "P-P-Por quê?!"
21090-74 = "Como assim?! A gente até atingiu o número mínimo de membros!"
21090-76 = "Ora, vocês não sabiam?"
21090-77 = "Agora não basta apenas cumprir o número mínimo de integrantes; também é obrigatório comprovar resultados como clube."
21090-78 = "Claro, como essa exigência mudou faz pouco tempo, existe um prazo de carência..."
21090-79 = "Esse prazo vai até o fim deste mês. Se vocês não apresentarem resultados até lá, o clube será fechado, tenham vocês 4 ou 400 membros."
21090-80 = "Mentira! Isso é impossível!"
21090-81 = "É bem possível, sim! Tudo isso foi devidamente explicado na reunião geral dos presidentes de clube outro dia."
21090-82 = "Só que a presidente de vocês, a Yuzu, não compareceu."
21090-83 = "?!"
21090-84 = "Ou seja, a responsabilidade é de vocês."
21090-85 = "Grr... Sua covarde!"
21090-86 = "Se me chamasse de \"carrasca\" eu até entenderia, mas o que há de \"covarde\" em seguir as regras...?"
21090-87 = "Sendo sincera, a identidade da Aris-chan ainda é suspeita, e eu até pensei em exigir a desocupação da sala hoje mesmo..."
21090-88 = "?!"
21090-89 = "...Mas, deixando a identidade de lado, achei genuíno esse amor puro dela pelos jogos."
21090-90 = "Se dei esse prazo de carência, é porque espero que vocês entreguem resultados à altura desse sentimento."
21090-91 = "Momoi, você mesma disse, não foi? Que vai surpreender todo mundo com os resultados no Prêmio Millennium."
21090-92 = "B-Bem, isso é verdade, mas..."
21090-93 = "Agora que vocês têm uma nova integrante, com certeza vão conseguir fazer um jogo bem mais divertido que antes, não é?"
21090-94 = "Pois bem, vou ficar aguardando ansiosamente. Até mais~"
21090-97 = "E-Ei, espera! Golpista! Burocrata! Aaaahhh!"
21090-98 = "Ela foi embora..."
21090-100 = "Hmm..."
21090-101 = "No fim das contas, o Clube de Desenvolvimento de Jogos continua correndo risco de ser fechado... né?"
21090-102 = "Mas isso aí, por qualquer ângulo que se olhe, é golpe! É uma conspiração!!"
21090-103 = "...Desculpa. Foi porque eu não consegui ir na reunião dos presidentes de clube..."
21090-104 = "N-Não é culpa sua, Yuzu-chan! Nessas horas, não era pra mana ter ido no seu lugar?"
21090-105 = "...Não deu pra evitar."
21090-106 = "É que bem naquela hora estava rolando um evento de drop de itens em dobro..."
21090-107 = "No fim a culpa era mesmo da mana! Apaga esse jogo agora!"
21090-108 = "Uuh... Enfim, só tem uma coisa que podemos fazer agora."
21090-109 = "É verdade."
21090-110 = "Fazer um jogo incrível, capaz de ganhar o Prêmio Millennium."
21090-111 = "Então, no fim das contas, a gente precisa mesmo do G.Bible! Vamos ter que voltar praquelas Ruínas?! Eu não querooo!!"
21090-112 = "..."
21090-116 = "...Eu preciso assumir a responsabilidade."
21090-117 = "Hã, Yuzu-chan?"
21090-118 = "Se vocês vão voltar às Ruínas para procurar o G.Bible... eu também vou junto."
21090-119 = "H-Hã?! Sério?!"
21090-120 = "Yuzu-chan, você não sai do prédio da escola faz quase meio ano... Até as aulas você assiste só pela internet..."
21090-121 = "...No fundo, a culpa... é minha. E além disso, esta sala do clube... não é mais só minha."
21090-122 = "...Quero protegê-la junto com vocês."
21090-123 = "Yuzu-chan..."
21090-126 = "Pan-paka-paaan! Yuzu entrou para o grupo."
21090-127 = "...Certo, vamos nessa! Não tem jeito, hora de ir!"
21090-128 = "Aris-chan, pega suas armas e equipamentos também!"
21090-131 = "Item selecionado. \"Espada da Luz: Supernova\" equipada."
21090-134 = "Beleza, vamos lá! Desta vez, vamos conseguir o G.Bible!"
21090-135 = "..."
21090-136 = "...Sim!"
21090-137 = "Vamos todas proteger a nossa sala do clube!"
21090-139 = "Próximo;De Volta às Ruínas"
