[translation]
901010400110-6 = ""
901010400110-7 = "Говорит FOX 1. FOX 2, удалось проникнуть на объект?"
901010400110-8 = "Подтверждаю. Говорит FOX 2. Я вошла в точку Альфа. Пока проблем нет. Продолжаю миссию."
901010400110-9 = ""
901010400110-11 = ""
901010400110-13 = ""
901010400110-14 = "Говорит FOX 3. Мы с FOX 4 прибыли в точку Сьерра. Цель хорошо просматривается. Здесь тоже без проблем."
901010400110-15 = "Я так переживала, когда тебя остановили на КПП, FOX 2."
901010400110-16 = "Ты ловко разобралась с охраной, FOX 2. Ты и правда выглядишь как настоящий курьер."
901010400110-18 = "Фуфу, надеюсь. Всё-таки мне нужно, чтобы люди поверили, будто я действительно из FOX EATS."
901010400110-19 = "...FOX 1. Кто наша первая цель?"
901010400110-20 = "Последний пропавший — некий Миягучи. Молодой мужчина, предположительно работал на краболовном судне. В последний раз его видели в точке нашей операции — порту Канэсаки."
901010400110-21 = "Хотя в рыболовной отрасли он работал недолго, его знали за расточительность и вечные жалобы. Несколько раз ввязывался в драки, а по слухам, ещё и набрал серьёзных долгов."
901010400110-22 = "Долги и конфликты... Возможностей тут слишком много."
901010400110-23 = "Частные займы — короткая дорога к неприятностям. ВСЕМ вам следует быть осторожнее с покупками в кредит."
901010400110-24 = "FOX 4, слышишь меня?"
901010400110-25 = "А...? Почему сразу я?"
901010400110-26 = "Потому что ты иногда покупаешь патроны в кредит. И не помнишь случай, когда забыла срок платежа и заказала дорогой цевьё...?"
901010400110-27 = ""
901010400110-29 = ""
901010400110-30 = "П-Погодите, это было сто лет назад!"
901010400110-31 = "Я не в курсе. Расскажешь подробнее, FOX 3?"
901010400110-32 = "Сейчас не время вспоминать старое! М-Мы должны сосредоточиться на миссии."
901010400110-34 = "Она права. FOX 2, продолжаю инструктаж."
901010400110-36 = "...Поняла. Пока что."
901010400110-37 = "Угх..."
901010400110-39 = "По словам его коллег-рыбаков, Миягучи внезапно исчез неделю назад после того, как сошёл с пришвартованного рыболовного судна."
901010400110-40 = "Он будто растворился в воздухе, оставив на судне вещи и одежду."
901010400110-41 = "То есть только другие рыбаки видели, как он сходил на берег, верно?"
901010400110-42 = "Да. Так что помни: любой рыбак, которого ты встретишь, может быть подозреваемым."
901010400110-43 = "Действуй осторожно и не вызывай подозрений."
901010400110-44 = "Моя специализация!"
901010400110-45 = "Так... где найти этих рыбаков?"
901010400110-47 = "У причала 3 пришвартовано краболовное судно. Южная сторона."
901010400110-48 = "Примерно сейчас они должны заниматься снастями. Возможно, найдётся время поговорить."
901010400110-49 = "Хорошо. Тогда я пошла."
