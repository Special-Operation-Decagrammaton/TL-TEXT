[translation]
901010400110-6 = ""
901010400110-7 = "Aqui é a FOX1. #nFOX2, conseguiu entrar no perímetro alvo?"
901010400110-8 = "FOX2 na escuta. Acabei de ingressar no Ponto Alfa. #nNenhum contratempo até agora. Prosseguindo com o plano."
901010400110-9 = ""
901010400110-11 = ""
901010400110-13 = ""
901010400110-14 = "Aqui é a FOX3. Eu e a FOX4 já nos posicionamos no Ponto Sierra. #nLinha de visão excelente sobre a área operacional. Tudo calmo por aqui."
901010400110-15 = "Quase tive um troço quando a FOX2 quase foi parada na blitz agora há pouco..."
901010400110-16 = "A FOX2 arrasou demais! Parecia mesmo uma entregadora de aplicativo de verdade."
901010400110-18 = "Hihi, eu entrei de cabeça no papel de entregadora do \"FOX EATS\", ué."
901010400110-19 = "...Mas e aí, FOX1? #nQuem é o nosso primeiro alvo de conversa?"
901010400110-20 = "A vítima desaparecida mais recente aqui no Porto de Kanezaki é um jovem chamado Miyaguchi, que trabalhava num barco pesqueiro de caranguejos."
901010400110-21 = "Ele era novato na tripulação, mas tinha fama de ser encrenqueiro e gastão. #nDizem que vivia atolado em dívidas de agiotas."
901010400110-22 = "Dívida de agiota e confusão... Uma combinação manjadíssima."
901010400110-23 = "Quem cai no conto de empréstimo fácil nunca mais consegue voltar a ter uma vida normal... #nFiquem espertas com isso, meninas."
901010400110-24 = "Ouviu bem, FOX4?"
901010400110-25 = "Ué...? Por que virou pra mim do nada?!"
901010400110-26 = "Você vive pedindo munição fiado quando pega carga no arsenal! #nNo outro dia mesmo encomendou um guarda-mão caríssimo e esqueceu de pagar a fatura—"
901010400110-27 = ""
901010400110-29 = ""
901010400110-30 = "E-ei, isso foi há séculos, não viaja!"
901010400110-31 = "Huuum... Depois você me conta essa história direitinho com detalhes, FOX3."
901010400110-32 = "Qual é, gente, não é hora pra lavar roupa suja! #nVamos manter o foco na operação!"
901010400110-34 = "Correto, FOX2. Continuando o briefing."
901010400110-36 = "...É verdade. A gente conversa sobre isso mais tarde."
901010400110-37 = "Uuuugh..."
901010400110-39 = "Segundo os colegas pescadores... Miyaguchi desembarcou do pesqueiro ancorado há uma semana e nunca mais foi visto."
901010400110-40 = "Os pertences dele continuam todos na cabine do barco. Literalmente, só a pessoa sumiu."
901010400110-41 = "E quem viu ele desembarcando foram apenas os colegas de tripulação?"
901010400110-42 = "Exatamente. Portanto, os próprios pescadores também figuram como suspeitos no inquérito."
901010400110-43 = "Aproxime-se com cautela redobrada. #nNão levante suspeitas."
901010400110-44 = "Pode deixar comigo."
901010400110-45 = "E onde... estão esses pescadores agora?"
901010400110-47 = "Tem um pesqueiro de caranguejo atracado no Cais 3."
901010400110-48 = "A essa hora do dia, eles devem estar arrumando as redes e os covos por ali."
901010400110-49 = "Entendido, tô indo lá."
