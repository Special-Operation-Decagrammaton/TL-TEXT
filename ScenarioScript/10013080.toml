[translation]
10013080-1 = "Эпизод 8;Бандиты в шлемах! Финальная схватка!"
10013080-3 = ""
10013080-5 = ""
10013080-6 = "Мы пришли!"
10013080-7 = "Наконец прибыли! Этот курорт принадлежит Бандитам в шлемах, крупнейшей группировке архипелага «Потерянного рая»!"
10013080-8 = "Но, Шизуко..."
10013080-9 = "Здесь как-то жутко!"
10013080-13 = "[ns] «Почему-то здесь пусто...?»"
10013080-14 = ""
10013080-15 = "А..."
10013080-16 = "[s] «Чисэ?»"
10013080-17 = "Сверкающая божья коровка!"
10013080-18 = "А? Чисэ, какая божья коровка? Я ничего не вижу!"
10013080-19 = ""
10013080-23 = ""
10013080-24 = "...Кто эта божья коровка с идеальным балансом красного и чёрного?!"
10013080-25 = "[s] «Ты сразу поняла! Потрясающе!»"
10013080-27 = "Ты офицер Банды Шлемов?"
10013080-28 = "Они слишком быстро нас окружили. Были готовы."
10013080-29 = "Мы сами зашли прямо в ловушку?!"
10013080-31 = "Ха-ха! Именно! Это место с самого начала должно было стать вашей могилой! И вы сами её выкопали, придя сюда!"
10013080-32 = "[s] «Но откуда вы знали, что мы придём?»"
10013080-34 = "Мы заботимся о наших клиентах."
10013080-35 = "Это девиз корпорации Кайзер."
10013080-36 = ""
10013080-40 = ""
10013080-41 = "[ns] «Я так и подозревал, но ты...»"
10013080-42 = "Давно не виделись, Сенсей из Шале."
10013080-43 = "[s1] «Директор Кайзер!»\n[s2] «Полагаю, вы здесь в отпуске?»"
10013080-46 = "О! Вы один из сотрудников Банка «Осьминог»!"
10013080-47 = "Рад вас видеть!"
10013080-48 = "[s] «Это ты выдал им этот контракт?»"
10013080-49 = "Именно я представил этим детям выгодное предложение по курорту «Потерянный рай»."
10013080-50 = "Мои планы в Абидосе провалились благодаря вам. Мне пришлось уйти с поста директора."
10013080-51 = "Теперь я отвечаю за выездные продажи в Банке «Осьминог»!"
10013080-52 = "[s] «Вот что с тобой случилось потом.»"
10013080-53 = "Но что вы делаете здесь?"
10013080-54 = ""
10013080-56 = ""
10013080-58 = "Я бы ожидала, что управление курортом — работа на полный день."
10013080-59 = "Как вы смеете! Мы пришли вернуть незаконный контракт, который вы раздавали кому попало!"
10013080-60 = "Мы знаем, что вы сделали! Заложить в контракт лазейку было отвратительно!"
10013080-61 = "О чём вы говорите? Я лишь предложил хороший продукт, когда вы пришли в банк."
10013080-62 = "Я никого не заставлял. Это вы сами купили продукт в надежде заработать!"
10013080-63 = "Это...!"
10013080-64 = "Но то, что вы делаете сейчас, неприемлемо. Нельзя забирать контракты других курортов."
10013080-65 = "Я не могу позволить вам выходить за рамки наших полномочий. Поэтому пришлось лично приехать и разобраться с этим безумием."
10013080-66 = "Я даже привёл телохранителя."
10013080-68 = "Ха-ха-ха!"
10013080-69 = "Это абсурд. Именно вы с самого начала ввели Шизуко в заблуждение."
10013080-70 = ""
10013080-71 = "[ns] «Вашей целью всегда был Момоёдо, верно?»"
10013080-72 = "Отдел проведения фестивалей полезен. У них есть право устраивать фестивали в Академии Хяккияко. Нельзя упускать такую возможность."
10013080-73 = ""
10013080-76 = "Наша цель была запятнать репутацию Момоёдо."
10013080-77 = ""
10013080-81 = ""
10013080-82 = "Для этого мы заманили на архипелаг самых разных подозрительных типов."
10013080-88 = "Когда этот инцидент разрушит репутацию Хяккияко, у Момоёдо не останется выбора, кроме как продаться."
10013080-89 = "Гениальный план, знаю."
10013080-91 = "Но вот вы снова здесь, Сенсей из Шале. И снова рушите мои планы."
10013080-92 = "[s] «Я разрушил твои планы?»"
10013080-93 = "Что вы сделали на этот раз?"
10013080-94 = "Стали опорой для Момоёдо? Сказали им никогда не сдаваться? Какими сладкими словами вы их подбодрили?"
10013080-95 = "Неважно. Я сделаю вам предложение, от которого вы не сможете отказаться."
10013080-96 = "Что ты имеешь в виду?"
10013080-97 = "Я заключу с вами сделку. Вложусь в ваш маленький бизнес."
10013080-98 = "В-Вложитесь? Банк «Осьминог», то есть корпорация Кайзер, хочет инвестировать в нас?"
10013080-99 = "Да. Раз вы зашли так далеко, значит, вы лучше, чем я думал."
10013080-100 = "По дороге сюда я слышал, что вы заключили франчайзинговые договоры с разными людьми. Мы получим и их."
10013080-101 = "Конечно, репутация Отдела проведения фестивалей немного пострадала, поскольку контракты распространялись от его имени."
10013080-102 = "Но деньги решают и не такое."
10013080-103 = "Мы инвестируем. Это ваш шанс заработать большие деньги."
10013080-104 = "На этот раз без лжи."
10013080-105 = "Отдел проведения фестивалей будет управлять курортом «Потерянный рай» и получать огромную прибыль."
10013080-106 = "Нужно быть идиотом, чтобы отказаться от такой возможности!"
10013080-107 = ""
10013080-110 = ""
10013080-111 = "Босс..."
10013080-112 = "Shizuko."
10013080-113 = "..."
10013080-114 = "Очень заманчиво."
10013080-115 = "Шизуко..."
10013080-116 = "Однако."
10013080-117 = ""
10013080-119 = ""
10013080-120 = "Похоже, я и правда идиотка. Отказываюсь!"
10013080-121 = "Что?! Это предложение всей жизни."
10013080-123 = ""
10013080-124 = "Знаете, что сказала мне Ния?"
10013080-125 = "Когда мы узнали, что нас обманули, Ния сказала просто вернуться домой."
10013080-126 = "Она сказала, что сама отомстит виновникам за такие грязные методы. Что разберётся со всем."
10013080-128 = "Но я знала, что должна остаться."
10013080-129 = "Я должна была защитить бренд Хяккияко."
10013080-130 = "Но была ещё одна причина."
10013080-131 = "Я не могу простить людей, которые не уважают фестивали!"
10013080-132 = ""
10013080-134 = ""
10013080-135 = "Что за чушь ты сейчас несёшь?"
10013080-136 = "Студенты Отдела горячих источников..."
10013080-138 = ""
10013080-140 = ""
10013080-141 = ""
10013080-142 = "Они так старались ради своей мечты."
10013080-143 = "Поэтому я предложила им сделку."
10013080-144 = ""
10013080-147 = ""
10013080-148 = ""
10013080-149 = "Те студенты проводили турнир Mushiqueen, потому что любили игру — прямо как большой фестиваль."
10013080-150 = "Мне понравилась их страсть, поэтому я предложила контракт."
10013080-151 = ""
10013080-154 = ""
10013080-155 = "Но вы, ребята, другие. Вы точно как Датэ Мяуру."
10013080-156 = "Даже прямо сейчас гости страдают из-за этой «Охоты на курорты», которая идёт по всему архипелагу."
10013080-158 = "Самая приятная часть лета разрушается из-за жадности корпорации Кайзер!"
10013080-159 = ""
10013080-161 = ""
10013080-162 = "Я этого не допущу!"
10013080-163 = "И никогда не прощу корпорацию Кайзер за то, что она вообще создала эту ситуацию!"
10013080-164 = "Так что на ваше тупое предложение у меня только один ответ!"
10013080-165 = "Нет! Категорически НЕТ! Никогда!"
10013080-167 = "Босс!"
10013080-168 = "Shizuko!"
10013080-170 = "Какая по-настоящему глупая и идеалистичная причина отказаться от возможности заработать."
10013080-171 = "[s] «Это вовсе не глупо. Это причина Шизуко.»"
10013080-172 = "Сенсей из Шале..."
10013080-173 = "[s3] «Если честно, я ничего не делал. Всё решала Шизуко.»\n[s4] «Я лишь сопровождал их. Я доверял решениям Шизуко и следовал им.»"
10013080-176 = "Твоей глупости нет предела! Кому вообще нужны какие-то убеждения?"
10013080-177 = "Ну что ж, значит так. Злиться бессмысленно."
10013080-178 = "Если это ваш ответ, Бандитам в шлемах придётся самим вступить в Охоту на курорты!"
10013080-179 = "Рабу, зови всех!"
10013080-180 = "Ха-ха-ха! Я этого ждала!"
10013080-181 = ""
10013080-183 = ""
10013080-184 = ""
10013080-186 = ""
10013080-188 = ""
10013080-190 = ""
10013080-192 = ""
10013080-195 = "Все, собирайтесь!"
10013080-197 = ""
10013080-199 = ""
10013080-201 = "О-Ого! Их так много! Ч-Что нам делать, господин?!"
10013080-202 = "О-о. Уже пора веселиться?"
10013080-203 = "Я люблю хорошие вечеринки. Босс! Что прикажете?"
10013080-205 = "Их слишком много! Нужно найти путь к отступлению!"
10013080-206 = "Ха! Никуда вы не уйдёте! Эй, новички Бандитов в шлемах! Перекрыть тыл!"
10013080-207 = ""
10013080-210 = "[ns] «Отступить не получится. Мы окружены.»"
10013080-211 = ""
10013080-212 = "Мы набрали новых Бандитов в шлемах с выдающимися навыками! Теперь прикончите их!"
10013080-213 = ""
10013080-214 = "Хех! Я же говорила, что сработает!"
10013080-215 = ""
10013080-216 = "Ты такого не говорила! Ты сказала что-то вроде «Ну, давайте попробуем!» или другую глупость!"
10013080-217 = ""
10013080-218 = "Но смотрите! Попробовали — и получилось. ☆"
10013080-219 = ""
10013080-220 = ""
10013080-221 = ""
10013080-223 = "Стратегия «замаскироваться под Бандитов в шлемах и проникнуть во вражеский лагерь» завершена."
10013080-224 = "[s] «...»"
10013080-225 = "А-А-а?!"
10013080-226 = "Что с вами, новобранцы?! Перекройте им путь и добейте!"
10013080-227 = "[s] «Эм... Ну...»"
10013080-228 = "Погоди, Рабу. Неужели...?"
10013080-229 = "Те новые, умелые новобранцы Бандитов в шлемах, о которых ты говорила по дороге..."
10013080-230 = "Эй! Что с вами?"
10013080-232 = ""
10013080-234 = ""
10013080-235 = ""
10013080-236 = ""
10013080-237 = "М-Мне кажется, я вас знаю?"
10013080-238 = ""
10013080-240 = ""
10013080-241 = ""
10013080-242 = "...Или у меня уже крыша едет?"
10013080-243 = "Уgh! Забудьте! Новобранцы Бандитов в шлемах! Готовьтесь к бою!"
10013080-244 = ""
10013080-247 = ""
10013080-248 = "Хех. Хех."
10013080-249 = "А-А-а?! Я вас и правда знаю!"
10013080-250 = "..."
10013080-251 = "...Ох ты ж."
10013080-252 = "О, Сенсей. Бабоч—"
10013080-253 = "Что Абидос делает здесь? Рабу! Что произошло?!"
10013080-254 = "Я-я и правда подумала, что они немного странные, но их шлемы были такими крутыми и модными!"
10013080-255 = "Пусть это и было немного необычно, Сенсей был прав, что доверился им... наверное..."
10013080-256 = "[s] «То есть я и сам не думал, что они задумали именно это...»"
10013080-257 = "Мы приехали сюда из-за вашего фальшивого приза! За всем этим снова стояли вы!"
10013080-258 = "И снова мы вас раскусили, директор Кайзер!"
10013080-259 = "Погодите, не может быть. Я специально продавал контракты только проблемным типам, которые устроят переполох."
10013080-261 = "...Вы его выиграли?! Как?!"
10013080-262 = "[s] «Мы так и не узнали, где Серика его выиграла.»"
10013080-263 = "А? О..."
10013080-264 = "Я просто выиграла в бинго, которое проводил владелец рамэнной «Шиба Сэки»..."
10013080-265 = ""
10013080-267 = ""
10013080-268 = "[ns] «Теперь всё логичнее... Наверное.»"
10013080-269 = "И всё равно благодаря Серике мы все оказались здесь вместе."
10013080-271 = "Согласна! Я рада, что мы все встретились!"
10013080-272 = ""
10013080-275 = ""
10013080-276 = "[ns] «Начинаем совместную операцию Хяккияко и Абидоса!»"
