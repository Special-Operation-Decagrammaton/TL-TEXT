[translation]
1010105-1 = "Вечеринка на двоих"
1010105-2 = "По приглашению Саори я пришёл посмотреть на её диджейское выступление."
1010105-6 = "Вот это было круто! У меня голова до сих пор качается в такт."
1010105-7 = "Я переживал, ведь диджей новичок, но она просто разнесла зал!"
1010105-8 = "Видели, как она вспотела? Её страсть чувствовалась даже с танцпола!"
1010105-9 = ""
1010105-11 = ""
1010105-13 = "[ns1] «(Саори, ты правда выложилась на полную...)»\n[ns2] «(Зрители точно почувствовали твои эмоции.)»"
1010105-14 = ""
1010105-15 = ""
1010105-21 = ""
1010105-22 = "[ns] «Саори.»"
1010105-23 = ""
1010105-25 = ""
1010105-26 = "...Хм?"
1010105-27 = "А. Вы пришли, Сенсей. Спасибо."
1010105-28 = "Как вам моё выступление?"
1010105-29 = "[s3] «Это было так захватывающе!»\n[s4] «Просто потрясающе. Во всех смыслах.»"
1010105-32 = "Правда?"
1010105-33 = "Я рада, что вам понравилось."
1010105-34 = "Я допустила много ошибок, но по крайней мере зрители хорошо провели время."
1010105-35 = "Я переживала, достаточно ли хорошо справилась, но ваши слова очень успокаивают."
1010105-38 = "[ns] «Почему ты одна? Куда делись остальные сотрудники?»"
1010105-39 = "Ушли ужинать. Они собираются устроить вечеринку после выступления."
1010105-40 = "Я отказалась от приглашения."
1010105-41 = "Я хочу привести в порядок заметки... и мне всегда не по себе в толпе."
1010105-42 = "Я предпочитаю одиночество."
1010105-43 = ""
1010105-45 = ""
1010105-46 = "*кашляет*"
1010105-47 = "[s] «Ты в порядке?»"
1010105-48 = "Кхм. Да."
1010105-49 = "Просто немного пересохло во рту. Не о чем беспокоиться."
1010105-50 = ""
1010105-53 = "А? ...Ваш напиток? Вы случайно принесли с собой?"
1010105-54 = "Я постоянно что-то у вас беру. Спасибо."
1010105-55 = "[s] «Совсем нет.»"
1010105-56 = ""
1010105-58 = ""
1010105-59 = ""
1010105-60 = "Хотите присесть? Идите сюда, Сенсей."
1010105-67 = "― [log=사오리 수영복]Есть что-то одинокое в том, чтобы смотреть на пустые места после окончания концерта.[/log][wa:930]"
1010105-68 = "― [log=사오리 수영복]Зрители разошлись, свет погас. [/log][wa:3520]"
1010105-71 = "― [log=사오리 수영복]Та яркая сцена затихла, будто ничего и не было.[/log][wa:3160]"
1010105-74 = "― [log=사오리 수영복]Видеть, как место, только что полное страсти и криков, внезапно становится таким тихим...[/log][wa:280]"
1010105-75 = "― [log=사오리 수영복]В этом есть что-то пустынное.[/log][wa:3380]"
1010105-78 = "― [log=사오리 수영복]...Но теперь всё нормально.[/log][wa:4520]"
1010105-81 = "― [log=사오리 수영복]Хотя почти ничего не изменилось... мне стало спокойнее.[/log][wa:2560]"
1010105-84 = "― [log=사오리 수영복]Да... Наверное, потому что вы рядом со мной, Сенсей.[/log][wa:4530]"
1010105-87 = "Спасибо за напиток, Сенсей. Я снова полна сил."
1010105-88 = "[s] «Всего от одной банки газировки?»"
1010105-89 = "Думаю, мне больше ничего не нужно—"
1010105-90 = ""
1010105-92 = ""
1010105-93 = ""
1010105-94 = "...Это было неожиданно."
1010105-95 = "Видимо, во время выступления я потратила больше сил, чем думала."
1010105-96 = "[s5] «Устроим свою вечеринку после выступления?»\n[s6] «Тихо, только вдвоём?»"
1010105-97 = ""
1010105-98 = ""
1010105-100 = ""
1010105-101 = "Если ты так говоришь, Сенсей."
1010105-102 = ""
1010105-104 = ""
1010105-105 = ""
1010105-106 = "Я пойду за вами."
