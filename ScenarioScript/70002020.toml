[translation]
70002020-1 = "Сверкающий день Кирары и Эрики 2"
70002020-4 = ""
70002020-5 = "Йаху! Очень приятно!"
70002020-6 = "Мы по адресу? Это комната отдыха Общества Пандемониума?"
70002020-7 = "Я слышала, здесь можно пройти пробное вступление!"
70002020-8 = ""
70002020-10 = ""
70002020-11 = ""
70002020-15 = "...Вы прибыли."
70002020-16 = "Вы те, кто желает лично испытать величественное превосходство президента ученического совета Геенна!"
70002020-17 = "Добро пожаловать в Общество Пандемониума!"
70002020-18 = ""
70002020-21 = ""
70002020-22 = "Величественное превосходство? Эм, звучит круто, наверное! Здесь так здороваются?"
70002020-23 = "Думаю, именно это она пыталась сказать..."
70002020-24 = "Ты, наверное, встречаешь гостей? Типа хозяйки?"
70002020-26 = "Х-Хозяйки?! Встречаю гостей...?"
70002020-27 = "Вот ваша реакция на лик Великой Макото?!"
70002020-28 = "Я вечный лидер Общества Пандемониума! Великая Макото! Мне суждено править всем Кивотос!"
70002020-29 = "Хм? Молодец!"
70002020-30 = "У тебя на лице огромными буквами написано, что тебе всё равно..."
70002020-31 = "Нет! Я не позволю своей самооценке пострадать из-за какой-то новенькой, которая просто ещё не поняла моего величия."
70002020-32 = "Кхм. Начнём сначала."
70002020-33 = "Кихехе! Значит, вы хотите узнать о чрезвычайно важной работе Общества Пандемониума!"
70002020-34 = "Мне нравится ход ваших мыслей! Кирара! Эрика!"
70002020-35 = "Хм? Откуда ты знаешь наши имена?"
70002020-36 = "Кихехе. Это же очевидно."
70002020-37 = "Естественно, я запомнила имена добродушных студентов, которые захотели пройти пробное вступление в Общество Пандемониума!"
70002020-38 = "Для меня, Великой Макото, такая задача так же проста, как дыхание."
70002020-39 = "Кихехе. Если будете усердно трудиться и посвятите себя мне, я вижу в вас огромный потенциал! Вы даже сможете стать офицерами Общества Пандемониума."
70002020-40 = "А. Я не особо по всей этой теме с «усердным трудом»."
70002020-41 = "Что?!"
70002020-42 = "Цк. Понятно. Можно привести лошадь к воде, но нельзя заставить её пить."
70002020-43 = "А! Да, ты обязана обдумывать груз ответственности, а не бездумно соглашаться на каждую возможность. Это тоже одно из качеств настоящего лидера...!"
70002020-44 = "Ты с самого начала играла в шахматы, Ёдзакура Кирара!"
70002020-45 = "Честно говоря, она вообще настолько далеко не думала."
70002020-47 = ""
70002020-48 = "Ага, привет. Добро пожаловать на пробу."
70002020-49 = "Довольно... редко кто хочет проходить пробное вступление."
70002020-51 = "Серьёзно? Ну, спасибо! А вы в Обществе Пандемониума делаете что-нибудь весёлое?"
70002020-52 = "Они примерно как наш ученический совет."
70002020-53 = "Так что, наверное, занимаются бюджетом академии? Куча бумажной работы?"
70002020-55 = "Ну, это тоже часть нашей работы..."
70002020-56 = "...но в основном мы занимаемся внешними делами. Мы представляем Геенна при заключении контрактов с поставщиками и всё такое."
70002020-57 = "Это вроде бы наша главная роль... но большую часть времени мы разгребаем последствия выходок Макото и устраняем ущерб."
70002020-58 = "(пристально смотрит)"
70002020-59 = "А? Чего смотришь? У меня пудинг на лице?"
70002020-60 = "Нет... Ничего... *вздох*"
70002020-62 = "Похоже... вам тут нелегко?"
70002020-63 = ""
70002020-65 = ""
70002020-66 = "Ибуки вернулась!"
70002020-67 = "О? Сёстры из Клуба «Домой после уроков»!"
70002020-69 = "А?"
70002020-70 = "Божечки! Это Ибуки! Привет!"
70002020-71 = "Снова встретились. Привет, Ибуки."
70002020-72 = "Ура! Ибуки так рада вас видеть! Вы пришли поиграть с Ибуки?"
70002020-73 = "Мы хотели посмотреть, в каком клубе Ибуки и как там всё устроено! Формально, наверное, это почти то же самое, что прийти поиграть!"
70002020-74 = "Правда-правда? Добро пожаловать!"
70002020-75 = "Мы давно не виделись с Ибуки, но почему-то совсем так не ощущается."
70002020-76 = "Может, потому что я повсюду вижу её фотографии и статьи? Кажется, только вчера видела одну в «Еженедельнике Общества Пандемониума»."
70002020-78 = "Хм... Безумный план Макото, который реализовала Чиаки... действительно что-то дал..."
70002020-79 = "Кихехе! Склонитесь перед моим величием! Признай ценность моих новаторских идей, Ироха!"
70002020-80 = "Да-да..."
70002020-81 = "Кхм. Но нам нужно заняться важными делами..."
70002020-83 = "Ибуки!"
70002020-84 = "Я положила купленный для тебя пудинг в холодильник!"
70002020-86 = "Кстати, Ибуки! В той статье «Еженедельника Общества Пандемониума» я прочитала, что ты типа супер-круто играешь в камешки!"
70002020-87 = "Покажешь нам?"
70002020-88 = "Ибуки любит камешки! Конечно!"
70002020-89 = "Ибуки много-много тренировалась и стала очень хороша, так что Ибуки может вас научить!"
70002020-90 = "Йаху! Играть в камешки с Ибуки звучит для меня суперзахватывающе!"
70002020-91 = "Здесь немного тесно. Давайте поиграем вон там."
70002020-92 = ""
70002020-94 = ""
70002020-97 = "..."
70002020-98 = "И-Ибуки? Но... пудинг... Я купила тебе пудинг..."
70002020-99 = "П-Пуд..."
70002020-101 = "Ибуки любит их больше, чем меня? Хотя почти их не знает? Ибуки?!"
70002020-102 = "Это... просто невозможно! П-Правда?"
70002020-103 = "Скажи, что я ошибаюсь! Пожалуйста, Ибуки! ИБУКИИИ!"
70002020-104 = ""
70002020-106 = ""
70002020-108 = ""
70002020-109 = "...Пожалуй, так даже лучше."
70002020-110 = "Может, хоть сегодня у нас будет тихий день."
70002020-115 = ""
70002020-116 = "Играть с Ибуки было супер-весело!"
70002020-117 = "Ага, но нам надо спешить на следующую пробу. Мы опоздаем."
70002020-118 = "Хахаха! Я вообще не заметила, сколько времени прошло. Куда дальше?"
70002020-120 = "Дальше..."
70002020-122 = ""
70002020-123 = "Добро пожаловать в Клуб школьного питания Геенна!"
70002020-124 = "Надеюсь, вам понравится пробное вступление у нас!"
70002020-126 = "Вкуснятина! Пахнет та-а-ак хорошо. Кажется, у меня живот заурчал!"
70002020-127 = "Мы, конечно, всё время в столовой, но на кухне я ещё ни разу не была."
70002020-129 = "Большинство не бывает. Именно здесь мы готовим все обеды для студентов!"
70002020-130 = "А какой у вас обеих опыт в готовке?"
70002020-131 = "Эм, иногда дома готовлю тушёное мясо с картошкой..."
70002020-132 = "Никакого! Ноль! Хахаха."
70002020-134 = "Ничего страшного! Готовить всегда можно научиться!"
70002020-135 = "Хотя сегодня всего лишь пробный день, постараюсь научить вас всему, чему смогу!"
70002020-136 = "Я бы с радостью помогла, но мне нужно начинать готовить ужин."
70002020-137 = "Обычно мы просто получаем все ингредиенты, а потом — раз-два! — перевозим их на кухню! С грузовиком всё проходит гладко и легко."
70002020-138 = "Но наш грузовик... Грузовик Клуба школьного питания... он..."
70002020-139 = ""
70002020-141 = ""
70002020-142 = "...Ух!"
70002020-143 = "Ф-Фуука!"
70002020-144 = "*вздох* В общем, такая ситуация. Поэтому сегодня я оставлю вас на попечение Джури."
70002020-145 = "Ни о чём не переживай, Фуука! Я научу их всем основам!"
70002020-146 = "Спасибо. Скоро увидимся..."
70002020-147 = ""
70002020-149 = ""
70002020-150 = "Вы двое, пожалуйста, сюда!"
70002020-151 = "Я проведу экскурсию по помещениям Клуба школьного питания, а потом устроим демонстрацию готовки!"
70002020-153 = "Хахаха! Как захватывающе! Кирара становится шефом — версия повара!"
70002020-155 = ""
70002020-156 = "Это наша кухня!"
70002020-157 = "Здесь храним все тарелки, тут гриль, а плита вот здесь..."
70002020-159 = "Эта кухня огромная. Сколько еды вы готовите за день?"
70002020-161 = "Хм... Каждый день нам нужно приготовить еду на несколько тысяч человек!"
70002020-163 = "*ах* Серьёзно?!"
70002020-164 = "Я никогда об этом не задумывалась, но ведь логично. Каждый день в столовую приходит куча студентов!"
70002020-165 = "Вы здесь реально вкалываете!"
70002020-166 = "Поначалу было тяжеловато, но со временем привыкаешь!"
70002020-167 = "А теперь смотрите внимательно. Как су-шеф этой кухни, я проведу демонстрацию!"
70002020-168 = "Начнём с очень простого блюда — омурайсу!"
70002020-169 = "Ого...?"
70002020-170 = ""
70002020-172 = ""
70002020-173 = ""
70002020-174 = ""
70002020-175 = ""
70002020-180 = "Совсем чуть-чуть этого и этого... выкладываем. И та-дам!"
70002020-181 = ""
70002020-182 = "Ну как?"
70002020-183 = ""
70002020-186 = "Профессиональные повара — это совсем другой—"
70002020-187 = ""
70002020-193 = ""
70002020-194 = "...Погоди. Тут... что-то не так."
70002020-195 = "С каких пор омурайсу зелёный?"
70002020-196 = "С-С самого начала?"
70002020-197 = "Вообще, что важнее... оно двигается? Как ты это вообще приготовила?"
70002020-198 = "Хахаха! Смотрите, оно извивается. Типа мерзковато, но немного мило?"
70002020-199 = "Божечки! Оно протягивает маленькую ручку. Кажется, хочет поздороваться!"
70002020-200 = "П-Погоди. Ты уверена, что это безопасно, Кирара?"
70002020-202 = "Но оно ведь милое? Дай пять!"
70002020-203 = ""
70002020-205 = ""
70002020-207 = "Она с ним общается?!"
70002020-208 = ""
70002020-210 = ""
70002020-211 = "Я не знала, что так вообще можно..."
70002020-212 = "Хотя удивляться не стоило. Это просто ты, Кирара."
70002020-213 = "А? Ому?"
70002020-214 = ""
70002020-216 = ""
70002020-223 = "А, убежало."
70002020-224 = "И ты только что дала ему имя?"
70002020-225 = "Ому! Вернись!"
70002020-226 = "Ага. Она дала ему имя."
70002020-227 = "У меня будут проблемы, если ты сбежишь!"
70002020-228 = "Пожалуйста, вернись сюда!"
70002020-229 = ""
70002020-231 = ""
70002020-232 = "У Клуба школьного питания... свои трудности, да?"
70002020-233 = "Хахаха! Обожаю этот хаотичный вайб!"
70002020-234 = "ОМУУУ!"
70002020-236 = "Пробное вступление в Клуб школьного питания закончилось неожиданно."
70002020-240 = ""
70002020-241 = "Это вы записались на пробу?"
70002020-243 = "Мы! Я Кирара! Очень приятно!"
70002020-244 = "Я Эрика."
70002020-246 = "Здравствуйте, я президент Клуба экстренной медицинской помощи, Химуро Сэна."
70002020-247 = "Я удивилась, что вообще удалось записаться к вам на пробное вступление."
70002020-248 = "Вы всегда такие занятые. Я не думала, что у вас найдётся на это время."
70002020-249 = "Верно, но именно поэтому мы и проводим пробу."
70002020-250 = "Вот как?"
70002020-251 = "Из-за нескольких территориальных разборок между хулиганками района сюда доставляют множество трупов, прошу прощения, пациентов."
70002020-253 = "Во время пробного вступления вы будете помогать бригаде экстренного реагирования."
70002020-254 = "В-Вы уверены? Мы вообще-то не обученные специалисты..."
70002020-255 = "Я неплохо клею пластыри!"
70002020-257 = "Не волнуйтесь. Я не попрошу вас делать ничего, что требует медицинской подготовки."
70002020-258 = "Ваша задача — успокаивать раненых пациентов, пока я готовлю их к лечению."
70002020-259 = "А теперь по местам!"
70002020-261 = "По местам!"
70002020-262 = ""
70002020-264 = ""
70002020-265 = "Ну, посмотрим, что из этого выйдет."
70002020-267 = ""
70002020-268 = "Ай... Больно..."
70002020-269 = "Цк. Я бы всё ещё дралась там, но мне прострелили колено..."
70002020-270 = "Мы реально потеряем территорию такими темпами! Хватит драматизировать!"
70002020-272 = "Тебе правда нужна медицинская помощь из-за маленькой царапины? А?"
70002020-273 = "И что нам делать?!"
70002020-274 = "Надо драться! А теперь заткнись и иди за мной. Прокрадёмся мимо президента Клуба экстренной медицинской помощи!"
70002020-275 = "Ладно...!"
70002020-276 = ""
70002020-280 = "Йаху! Здравствуйте, пациенты! Временная ангельская медсестра Кирара к вашим услугам? Я правильно сказала?"
70002020-281 = ""
70002020-283 = ""
70002020-284 = "К-Кто вы такие?!"
70002020-286 = "Мы просто участницы пробного вступления. Вы новые пациенты?"
70002020-287 = "Очень приятно!"
70002020-289 = "Мы ни с кем знакомиться не будем! Мы уходим отсюда!"
70002020-290 = "Ага! Вы нас здесь не удержите!"
70002020-292 = "А? Вы не хотите лечить раны?"
70002020-293 = "Они небольшие, но ведь всё равно болят."
70002020-294 = "Мы хулиганки! Закалённые хулиганки! Нам боль нипочём!"
70002020-295 = "Защита нашей территории важнее всего!"
70002020-297 = "Серьёзно? А где ваша территория?"
70002020-298 = "Знаете, если пройти ещё немного от перекрёстка, там за палаткой с едой есть переулок? Вот там."
70002020-299 = "О? Я знаю это место! Там палатка с крепами!"
70002020-300 = "Божечки, разве там не супер-вкусно? Я постоянный клиент!"
70002020-302 = "П-Правда? Мир тесен, получается."
70002020-303 = "Мой любимый заказ — мороженое, клубника и шоколадные крошки! А вы что берёте?"
70002020-304 = "Банан неплох."
70002020-305 = "А ананас с мороженым пробовала? Хорошее сочетание."
70002020-306 = "Мне такое даже в голову не приходило! Звучит вкусно!"
70002020-308 = "Я фрукты не люблю! Поэтому беру кучу печенья с шоколадной крошкой и взбитые сливки. Вот это тема."
70002020-309 = "Ого! В следующий раз точно попробую!"
70002020-310 = "Придумала! Почему бы нам всем—"
70002020-311 = ""
70002020-315 = "Ай?! П-Президент?"
70002020-317 = ""
70002020-319 = ""
70002020-320 = ""
70002020-321 = ""
70002020-322 = ""
70002020-323 = ""
70002020-324 = ""
70002020-325 = "Упс. Я немного увлеклась разговором с ними."
70002020-326 = ""
70002020-328 = ""
70002020-331 = "Анестезия завершена."
70002020-332 = "А разве нормально вот так стрелять в пациентов?"
70002020-333 = "Это было ради лечения. Один шаг назад, два шага вперёд."
70002020-334 = "Впечатляет ваш природный талант. Вы удерживали этих хулиганок на месте, пока я готовила уколы."
70002020-335 = "Мы почти ничего не сделали... Считайте это суперсилой Кирары."
70002020-336 = "Я хотела... поесть с ними крепов..."
70002020-337 = "Почему бы не оставить им свой номер? Тогда сможем сходить вместе, когда они проснутся."
70002020-338 = "Идеально! Можно так, президент?"
70002020-339 = ""
70002020-341 = ""
70002020-342 = "Обычно по правилам мы избегаем любых личных контактов с пациентами вне работы."
70002020-343 = "Но... думаю, в благодарность за вашу работу можно сделать исключение."
70002020-344 = "Йаху! Спасибо, през! Я тебе тоже один куплю, ладно?"
70002020-345 = "Это... вовсе не обязательно."
70002020-346 = "Да не парься! Я угощаю!"
70002020-348 = ""
70002020-349 = "Фух! День пролетел незаметно!"
70002020-350 = "В этой школе типа о-о-очень много клубов!"
70002020-351 = "Сегодня я точно получила кучу новых впечатлений."
70002020-352 = "Ну так что, нашла?"
70002020-353 = "Хм? Что нашла?"
70002020-354 = "Ты совсем забыла, зачем мы всё это делали, да?"
70002020-355 = "Мы искали клуб, в который ты захочешь вступить, помнишь?"
70002020-356 = "А! Точно! Хахаха! Совсем вылетело из головы!"
70002020-357 = "Хм... Дай подумать. Первый... второй... и... Ну, все они были супер-весёлыми!"
70002020-358 = "Я познакомилась с новыми друзьями и попробовала кучу нового!"
70002020-359 = "Так что из всех клубов я выберу..."
70002020-360 = ""
70002020-362 = ""
70002020-363 = "...ни один!"
70002020-365 = "А?"
70002020-366 = "Ты только что сказала, цитирую, «супер-весёлыми»!"
70002020-367 = "Ага! Весело! Захватывающе!"
70002020-368 = "Мне понравилось играть с Ибуки, смотреть кухню Клуба школьного питания и даже помогать пациентам!"
70002020-369 = "Это всё правда было офигенно весело!"
70002020-370 = "Тогда... в чём проблема?"
70002020-371 = "Потому что, ну... Разве не будет как-то обидно..."
70002020-372 = "...выбрать только один?"
70002020-373 = "Обидно...?"
70002020-374 = "Ага! Просто подумай, Эри!"
70002020-375 = "Если вступим только в один клуб, каждый день будет одинаковым."
