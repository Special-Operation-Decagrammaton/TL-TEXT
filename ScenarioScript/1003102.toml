[translation]
1003102-1 = "До конца года"
1003102-2 = "(За несколько дней до Нового года.)"
1003102-3 = "О, Сенсей, сюда. Я здесь."
1003102-4 = "[s1] «Так что случилось? Зачем ты меня позвала?»\n[s3] «Надеюсь, причина веская, Ару.»"
1003102-5 = "Хех. Ну что, вам интересно, что я здесь делаю?"
1003102-6 = "Конечно интересно. Да. Ещё бы!"
1003102-7 = "[s2] «Не особо. Тогда увидимся позже.»"
1003102-8 = "А?!"
1003102-9 = "Я-Я шучу, Сенсей! Просто шучу!"
1003102-10 = "Не нужно воспринимать это так серьёзно. Я лишь хотела, чтобы вы немного мне подыграли!"
1003102-11 = "А? Правда?"
1003102-12 = "П-Простите. Наверное, я и правда позвала вас слишком внезапно."
1003102-13 = "Это понятно. Вы ведь почти всегда очень заняты."
1003102-14 = "Наверное, мне стоило всё оформить как положено и заранее назначить встречу. Ну, знаете, чтобы мои люди связались с вашими."
1003102-15 = "Приношу глубочайшие извинения за столь внезапную просьбу прийти сюда."
1003102-16 = "[s4] «Я соврал, так что всё нормально. Мне всё равно нечем заняться.»"
1003102-17 = "Вы такой добрый — говорите, что всё в порядке, даже после того, как я отняла время у вашего занятого дня."
1003102-18 = "...А? Погодите."
1003102-19 = "(Это всё было ложью?! Сенсей, вы невозможны!)"
1003102-23 = "К-Кхм. Так вот, как я пыталась сказать раньше..."
1003102-24 = "Год почти закончился, Сенсей."
1003102-25 = "А это значит..."
1003102-26 = "[s] «А это значит...?»"
1003102-27 = "Что Новый год уже совсем скоро!"
1003102-28 = "Теперь понимаете, Сенсей?"
1003102-29 = "Это серьёзное дело, знаете ли. У нас чрезвычайная ситуация. Настоящая чрезвычайная ситуация."
1003102-30 = "[s5] «Ты раскроешь свой великий план на Новый год. Я так и знал!»\n[s6] «Я ждал этого дня. Давайте изменим мир, босс!»"
1003102-31 = "А?! О чём вы вообще говорите?! Я ничего такого не планирую!"
1003102-32 = "А?! О чём вы вообще говорите?! Я ничего такого не планирую!"
1003102-33 = "И что, по-вашему, я имела в виду, Сенсей?!"
1003102-34 = "Я просто хочу взять напрокат кимоно на Новый год!"
1003102-35 = "[s] «Напрокат?»"
1003102-36 = "Кхм. Очевидно же, начинается новый финансовый квартал. Новый год — один из важнейших дней в году для такой деловой женщины, как я."
1003102-37 = "Это возможность встретить новые деловые перспективы с обновлённым телом и свежим умом..."
1003102-38 = "Так что вполне естественно надеть что-нибудь подходящее к случаю."
1003102-39 = "[s] «И кимоно для этого подходит как нельзя лучше.»"
1003102-40 = "Нужно носить одежду, подходящую времени, месту и случаю."
1003102-41 = "Или «TPO», как я это называю. Быть готовой ко всему — часть бизнеса."
1003102-42 = "Итак, к делу..."
1003102-43 = "Прежде чем принять решение, я хочу услышать ваше мнение, Сенсей."
1003102-44 = "Я позвала вас сюда, потому что мне нужно взрослое чувство вкуса. Вы не против?"
1003102-45 = "[s] «Если это ради тебя, Ару, то я всегда не против.»"
1003102-46 = "А-а. Вы даже не задумались, прежде чем это сказать. Вы и правда опасный человек."
1003102-47 = "Но ладно."
1003102-48 = "За работу, Сенсей."
1003102-51 = "[ns7] «Уже знаешь, какое кимоно хочешь?»\n[ns8] «Есть какой-нибудь бренд на примете?»"
1003102-52 = "Ох, Сенсей. В такие моменты нужно проявлять деловую хватку."
1003102-53 = "Ох, Сенсей. В такие моменты нужно проявлять деловую хватку."
1003102-54 = "Только новичок совершит ошибку и переплатит за кимоно, которое наденет лишь на Новый год."
1003102-55 = "Но и выглядеть представительной деловой женщиной в дешёвых тряпках из-за слишком жёсткого бюджета тоже не получится."
1003102-56 = "[s] «Хорошо. И?»"
1003102-57 = "Главное — найти правильный баланс."
1003102-58 = "Если хорошо разбираешься в ткани и качестве работы, сразу увидишь, оправдана цена или нет."
1003102-59 = "С Новым годом всё особенно сложно: торговцы поднимают цены, зная, что люди в это время охотнее тратят деньги."
1003102-60 = "Если быть неосторожной, легко попасться на классическую подмену товара и потратить куда больше, чем рассчитывала."
1003102-61 = "Здравствуйте! Не хотите что-нибудь стильное, чтобы встретить Новый год?"
1003102-62 = "Выглядите наилучшим образом в особенный день с семьёй, друзьями или любимым человеком!#nУ нас прокат по самым низким ценам!"
1003102-63 = "Как раз вовремя. Смотрите внимательно, Сенсей. Сейчас я покажу, на что способна."
1003102-65 = ""
1003102-66 = "Извините. Я хотела бы взять кимоно напрокат."
1003102-67 = "Добро пожаловать, госпожа! Ищете что-нибудь конкретное?"
1003102-68 = "Да, мой примерный бюджет — около 5000 иен."
1003102-69 = "О, это выглядит неплохо. И цена вполне разумная."
1003102-70 = "О, какой у вас тонкий вкус. Позвольте спросить, по какому случаю?"
1003102-71 = "Семейная встреча? Посиделки с друзьями? Может быть, свидание?"
1003102-72 = "С-Свидание?!"
1003102-73 = "Кхм, нет. Я собираюсь надеть его на важное мероприятие, где будут обсуждаться деловые вопросы."
1003102-75 = "Вы собираетесь на деловую встречу в таком дешёвом прокатном кимоно?!"
1003102-77 = "Что?! Но вы же сказали, что оно хорошее!"
1003102-78 = "Да, для непринуждённой встречи с семьёй или друзьями."
1003102-79 = "Но для важной деловой встречи оно совершенно не годится..."
1003102-80 = "Вам нужно надеть то, что подчеркнёт вашу ценность, и дополнить образ аксессуарами, демонстрирующими достоинство!"
1003102-81 = "Н-Не говорите ерунды. Ценность человека не определяется такими вещами."
1003102-82 = "Вы забыли, что Новый год бывает лишь раз в году?!"
1003102-83 = "Это шанс создать драгоценные воспоминания с дорогими вам людьми!"
1003102-84 = "Правда?!"
1003102-85 = "А вы там! Разве не согласны?!"
1003102-86 = "[s9] «Ну...»\n[s10] «Наверное.»"
1003102-87 = "С-Сенсей!"
1003102-88 = "С-Сенсей!"
1003102-89 = "Как насчёт этого? Думаю, оно прекрасно подойдёт к случаю."
1003102-90 = ""
1003102-92 = ""
1003102-93 = "Каждый стежок вручную вышит мастером. Это лучшее кимоно в нашем магазине!"
1003102-94 = "Но оно намного дороже моего бюджета!"
1003102-95 = "Считайте это инвестицией. Наденете его — ваш бизнес будет процветать, и вы легко окупите расходы. Вы обеспечите и себя, и свою семью на поколения вперёд!"
1003102-96 = "Э-Это кимоно способно на всё это?!"
1003102-97 = "И это ещё не всё! Вы сможете покорить сердце того самого особенного человека! Освободите своё измученное сердце!"
1003102-98 = "Я смогу покорить сердце Сенсея и освободить своё?!"
1003102-99 = "Что думаете, Сенсей...?"
1003102-100 = "[s11] «Тебе пойдёт это кимоно, но...»\n[s12] «Ару, ты цену видела?!»"
1003102-101 = "Я знаю!"
1003102-102 = "Я знаю!"
1003102-103 = "Настоящая деловая женщина увидит скрытую ценность этого кимоно и сделает разумную инвестицию — особенно по такой цене!"
1003102-104 = "В-Вы правы... Быть деловой женщиной — значит делать разумные инвестиции."
1003102-105 = "Х-Хорошо! Пан или пропал! Я беру!"
1003102-106 = "Сейчас упакую!"
1003102-110 = ""
1003102-112 = "[ns13] «Ты точно уверена?»\n[ns14] «Куда делась твоя деловая хватка?»"
1003102-113 = "Всё нормально. Это же инвестиция!"
1003102-114 = "Всё нормально. Это же инвестиция!"
1003102-115 = "Да, всё будет хорошо!"
1003102-116 = "С-Совершенно хорошо... Я уверена..."
1003102-118 = "(После этого Ару вернулась в обычное состояние, но её ноги ещё некоторое время слегка дрожали.)"
