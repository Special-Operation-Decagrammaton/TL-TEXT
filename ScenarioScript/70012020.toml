[translation]
70012020-1 = "В ЭФИРЕ: Геенна 2"
70012020-2 = "Ки-хе-хе, я знала, что ты справишься, Ироха!"
70012020-3 = "Ты моментально нашла идеальную замену!"
70012020-4 = "Если честно, это они нашли меня..."
70012020-5 = "Хатами Эрика и Ёдзакура Кирара станут идеальными сосудами, чтобы превратить нашу передачу во что-то, действительно воплощающее достоинство и престиж Общества Пандемониума!"
70012020-6 = "Разумеется, она знает их имена..."
70012020-7 = "Ну, вот так всё и вышло. Они вас заменят. Потом не передумывай."
70012020-8 = "Чтобы использовать кого-то, нужно ему доверять, а доверившись, нельзя жалеть!"
70012020-9 = "Вот какой смелый настрой требуется лидеру Общества Пандемониума! Не переживай и действуй, Ироха!"
70012020-10 = "Да-да. Звучит замечательно, как скажешь..."
70012020-12 = "После того как вы согласились стать ведущими, мы объявили, что следующий выпуск будет особенным."
70012020-13 = "Народ довольно сильно заинтересовался."
70012020-14 = "Серьёзно? Ого! Круто."
70012020-15 = "Ну, вы обе довольно известны по всей школе. Мне это хотя бы жизнь облегчило."
70012020-16 = "Ох, какое давление. У вас есть какой-нибудь гайд для новичков или инструкция?"
70012020-17 = "Вы ведь раньше слушали передачу? Просто делайте примерно то же самое."
70012020-18 = "Эм... Ну, наверняка я её когда-то слушала, но..."
70012020-19 = "Был выпуск с Ибуки! Тот, где она пела!"
70012020-20 = "А? Нам ТОЖЕ придётся петь?"
70012020-21 = "Нет-нет. Это было только с Ибуки. Считайте это... подкастом, наверное."
70012020-22 = "Например, рубрика с историями слушателей. В этот раз нам вроде прислали кучу писем, но если хотите, можете вообще её пропустить."
70012020-23 = "Ой, это же слишком жестоко! Они наверняка столько сил потратили, чтобы написать и отправить."
70012020-24 = "Я бы стопудово слушала каждый выпуск и ждала, когда прочитают мою историю. Нельзя их подводить!"
70012020-25 = "Ну, понимаю... Суть в том, что можете делать что хотите."
70012020-26 = "Вы серьёзно даёте нам полную свободу?"
70012020-27 = "Мы сказали, что доверяем вам."
70012020-28 = "И вы двое выглядите куда менее склонными всё испортить, чем некоторые другие люди в этой школе..."
70012020-29 = "Ого, слышать такое из уст самой руководительницы Общества Пандемониума. Я уже немного нервничаю."
70012020-30 = "От меня никакого давления... Просто вы не похожи на тех, кто станет создавать проблемы."
70012020-31 = "Хотя мне, если честно, всё равно."
70012020-32 = "А-ха-ха! Не волнуйся! Мы вас не подведём."
70012020-33 = "Я благодарна за энтузиазм, но это мы втянули вас в последний момент. Так что ещё раз: никакого давления."
70012020-34 = ""
70012020-36 = ""
70012020-37 = ""
70012020-38 = "Кажется, пора."
70012020-39 = "Ну тогда удачи."
70012020-40 = ""
70012020-42 = ""
70012020-43 = "Мы справимся, Ироха!"
70012020-44 = "*фух*... А я реально нервничаю."
70012020-45 = "Не переживай, не переживай. Смотри, тут даже есть описания каждой рубрики, так что мы хотя бы не совсем вслепую идём."
70012020-46 = "Ты права. Ну что, готова?"
70012020-47 = ""
70012020-49 = ""
70012020-50 = ""
70012020-51 = ""
70012020-52 = "Кхм. В прямом эфире из студии..."
70012020-53 = "...и ведущая сегодняшнего специального выпуска «В ЭФИРЕ: Геенна» — я, Ёдзакура Кирара!"
70012020-54 = "И я, Хатами Эрика!"
70012020-55 = "Мы впервые ведём передачу, так что заранее простите за ошибки. Ну а теперь начинаем!"
70012020-57 = ""
70012020-58 = "Хм? Сегодняшняя передача какая-то другая."
70012020-59 = "Ведущая другая, да?"
70012020-60 = "Стой, это же КИРАРА?"
70012020-62 = "Пора первой рубрики! Время рекламы клубов!"
70012020-63 = "Нам пришло много сообщений от тех, кто хочет рассказать о своих клубах."
70012020-64 = "О-о, давай начнём с этого! Оно такое красивое, сразу бросается в глаза."
70012020-65 = "Они явно хотели многое сказать... Вот это преданность делу."
70012020-66 = "Ну что, прочитаем, что это за клуб."
70012020-67 = "«Это письмо впервые появилось в Тринити и приносило удачу получателю. Если в течение следующей недели не отправить это письмо семерым людям, несчастья будут преследовать каждый ваш шаг...»"
70012020-68 = "А?"
70012020-69 = "Ого-о. Старый добрый классический розыгрыш! Не знала, что кто-то ещё рассылает письма счастья."
70012020-70 = "Но про клуб тут точно ничего нет! Так что переходим к следующему."
70012020-72 = ""
70012020-73 = "Стой!! Но мы же тоже услышали сообщение! Значит, теперь нам надо отправить его семерым людям, иначе нам не повезёт?"
70012020-74 = "Я даже не уверена, что знаю семь человек... Сколько там людей в Обществе Пандемониума...?"
70012020-76 = "Ладненько, открываем следующее сообщение. Надеюсь, в этот раз оно правда про клуб!"
70012020-77 = "Твой выход, Эрика!"
70012020-78 = "Кхм..."
70012020-79 = "«Клуб философии границы школьных ворот НУЖДАЕТСЯ В ТЕБЕ. Сядь прямо на границе территории школы и позволь неопределённости питать твои философские взгляды! Погрузись в томительное сомнение: пойдёшь ты на урок или нет!»"
70012020-80 = "А, а! Я их видела! Они реально любят сидеть НАВЕРХУ школьных ворот!"
70012020-81 = "Это... правда была клубная деятельность? А не люди, притворяющиеся горгульями?"
70012020-82 = "Кем бы они ни были, если хотите вступить, они собираются у западных ворот каждый вторник и четверг. Поддержите Клуб философии границы школьных ворот!"
70012020-84 = ""
70012020-85 = ""
70012020-86 = ""
70012020-87 = ""
70012020-89 = "(Идёт намного лучше, чем я ожидала. Я точно правильно сделала, что оставила всё этим двоим.)"
70012020-90 = ""
70012020-92 = ""
70012020-93 = "Сегодняшняя передача довольно неплохая."
70012020-94 = "И не говори. Обычно они ведь просто включают гимны Общества Пандемониума?"
70012020-95 = "Если так и дальше пойдёт, я, может, даже начну её ждать."
70012020-96 = ""
70012020-98 = ""
70012020-99 = "(И реакция людей хорошая.)"
70012020-100 = "(А. Макото это, наверное, не понравится.)"
70012020-102 = "А дальше у нас..."
70012020-103 = "О-о-о, знаю, вы все этого ждали. «Блести-блести, истории слушателей» возвращаются!"
70012020-104 = "По-моему, рубрика называлась не так... Ну, наверное, неважно."
70012020-105 = "Сегодня историй очень много, так что простите, если вашу прочитать не успеем."
70012020-106 = "Так, вот первая."
70012020-107 = ""
70012020-109 = ""
70012020-110 = "«Я учусь на втором курсе. Мне нравится спокойно обедать в одиночестве. Но иногда друзья хотят есть вместе со мной, и мне от этого немного тяжело»."
70012020-111 = "«Но если я откажусь, боюсь отдалиться от компании, а друзья мне всё-таки нравятся. Что мне делать?»"
70012020-112 = "А! Я знаю кучу таких людей!"
70012020-113 = "И правда дилемма... Ставить на первое место себя? Или дружбу?"
70012020-114 = "У меня, Ёдзакуры Кирары, есть очень хороший ответ!"
70012020-115 = "О? Правда?"
70012020-116 = "Есть, госпожа!"
70012020-117 = "Знаю, это трудно, но с друзьями нужно быть честной! Скажи, что они тебе нравятся, но ты ещё очень ценишь время наедине с собой!"
70012020-118 = "И не бойся их оттолкнуть! Наоборот, думаю, вы станете даже ближе, потому что они узнают о тебе что-то новое."
70012020-119 = ""
70012020-121 = ""
70012020-122 = "...Ого."
70012020-123 = "Если говорить от сердца, они обязательно поймут. Вы же друзья! Не переживай так сильно!"
70012020-124 = "Ха-ха. Верно. Друзья понимают предпочтения и характер друг друга. Для этого они и нужны."
70012020-125 = ""
70012020-127 = ""
70012020-128 = "Перейдём к следующему письму, Кирара?"
70012020-129 = "Да. Следующее тоже анонимное. От первокурсницы."
70012020-130 = ""
70012020-131 = "«Моя проблема в том, что несчастья преследуют меня, куда бы я ни пошла. Я постоянно спотыкаюсь и роняю данго или сладости. Стоит мне начать есть в ресторане, как там что-нибудь взрывается, а потерянные талоны на еду или автоматы, съевшие мои деньги, — обычное дело. Со мной что-то не так?»"
70012020-133 = "Я сейчас сама расплачусь!"
70012020-134 = "Я слышу вот что: несмотря на всё, через что тебе пришлось пройти, ты не позволяешь этому мешать тебе жить! Это правда достойно восхищения."
70012020-135 = "Ага-ага! Ещё говорят, что общее количество удачи в жизни заранее определено. Так что, держу пари, совсем скоро тебя ждёт что-то очень хорошее."
70012020-136 = "Может, ей стоит попробовать вести влог или стримы."
70012020-137 = "Если подумать, это отличный контент. Люди будут заходить посмотреть, какая неудача случится сегодня."
70012020-138 = "Типа превратить кризис в возможность! Эти маленькие неудачи сделают тебя запоминающейся. Это может стать твоей фишкой!"
70012020-139 = "А если ничего плохого не случится — тоже хорошо. В любом случае выигрыш!"
70012020-140 = "Той, кто поделилась историей: не сдавайся и держись! Мы за тебя болеем!"
70012020-141 = "А теперь перейдём к следующей исто—"
70012020-143 = ""
70012020-149 = "Ай! Мои уши!"
70012020-150 = "Похоже, у нас технические неполадки."
70012020-155 = "Что за...?! Что происходит? Я же слушала с удовольствием..."
70012020-157 = "...!!"
70012020-159 = "Что делать? Отключить эфир?"
70012020-160 = "Может, проблема просто в заземлении или кабеле..."
70012020-161 = ""
70012020-163 = ""
70012020-166 = "Распутаем провод и..."
70012020-167 = ""
70012020-172 = "Вот. Исправила."
70012020-173 = "Потрясающе, Эри!"
70012020-174 = "Кабели в радиостудии обычно дешёвые и плохо разведены, поэтому очень не любят, когда их перекручивают."
70012020-175 = "В общем, я просто распрямила провода."
70012020-176 = "Эри, ты реально умеешь всё! Круто."
70012020-177 = "Ну, кажется, мы уже подходим к концу."
70012020-178 = ""
70012020-180 = ""
70012020-181 = "Кхм. Простите за нестабильный сигнал. Возвращаемся к эфиру!"
70012020-182 = "У нас ещё остались письма слушателей!"
70012020-183 = ""
70012020-185 = ""
70012020-186 = ""
70012020-188 = "(Кажется, среди помех я услышала какой-то странный звук...)"
70012020-189 = "(Наверное, показалось.)"
70012020-191 = "Ух, ну конечно, технические проблемы начались ровно тогда, когда всё шло гладко..."
70012020-192 = "Макото. Если мы собираемся продолжать эфир, может, стоит заменить эти кабели?"
70012020-193 = "..."
70012020-194 = "Макото? Ты слушаешь?"
70012020-195 = "Хм? А."
70012020-196 = "Ки-хе-хе. Если подумать, популярная передача принесёт нам огромную пользу."
70012020-197 = "Тогда ещё больше студентов будут слушать песни и речи, восхваляющие меня!"
70012020-198 = "Ироха! Активно предлагай идеи, как оживить школьный эфир!"
70012020-199 = "*вздох*... Я так и знала, что ты скажешь что-то подобное."
70012020-201 = "Ну что, пора понемногу заканчивать..."
70012020-202 = "А?"
70012020-203 = "Кто-то прислал заявку на песню!"
70012020-204 = "О, идеально для завершения передачи."
70012020-205 = "...Ай!"
70012020-206 = "А? Что?"
70012020-207 = "У-У нас... нет песни, которую попросили!"
70012020-208 = "А? Нельзя просто подключить телефон?"
70012020-209 = "У нас нет такого оборудования... а на жёстком диске сохранены только гимны Общества Пандемониума..."
70012020-210 = "Это вообще не то настроение, которое просил слушатель!"
70012020-211 = "Эх, ничего не поделаешь. Придётся пропу—"
70012020-212 = ""
70012020-214 = ""
70012020-215 = "Эри, Эри!"
70012020-216 = "А?"
70012020-217 = "Почему бы тебе самой не спеть, Эри? За тобой гитара."
70012020-218 = "А? М-Мне?"
70012020-219 = "Ага! Ты хорошо поёшь! И ты стопудово пела эту песню в караоке в прошлый раз!"
70012020-220 = "Нет, я не хорошо пою. Просто знаю мелодии..."
70012020-221 = "И петь в эфире — совсем не то же самое, что в караоке!"
70012020-222 = "Хи-хи. Правда? Есть тот, кто поёт, и тот, кто слушает. Вот и всё, что важно."
70012020-223 = "И нельзя разочаровывать человека, который заказал песню!"
70012020-224 = "По-моему, он не просил живое исполнение!"
70012020-225 = ""
70012020-227 = ""
70012020-228 = "*вздох* Ладно. Почему бы и нет."
70012020-229 = "Ура! Эри поёт в прямом эфире!!"
70012020-230 = "Фух..."
70012020-231 = ""
70012020-233 = ""
70012020-236 = "Вот заказанная песня."
70012020-237 = "-"
70012020-239 = ""
70012020-240 = ""
70012020-241 = ""
70012020-243 = ""
70012020-245 = "-"
70012020-246 = ""
70012020-248 = ""
70012020-250 = "Так школьный эфир Клуба «Блести-блести» успешно завершился."
70012020-252 = "Ого... Отличная работа. Правда..."
70012020-253 = "Ха-ха, нам тоже было весело! Может, радиовещание подходит мне больше, чем я думала."
70012020-254 = "Да. Общение с неопределённой аудиторией оказалось новым опытом. Как отреагировали люди?"
70012020-255 = "Хорошо. ОЧЕНЬ хорошо. Слушателям понравилось."
70012020-256 = "О, отлично! Наверное, и тебе стало легче!"
70012020-257 = "Типа того... Может, реакция даже слишком положительная."
70012020-258 = "А? В смысле?"
70012020-259 = "Как вообще реакция может быть СЛИШКОМ положительной?"
70012020-261 = "Просто... есть один раздражающий человек с раздражающими мнениями. Она просто закатывает истерику."
70012020-263 = "Будь моя воля, я бы попросила вас вернуться..."
70012020-264 = "..."
70012020-265 = "Но у вас обеих есть свои клубные дела, так что это наверняка будет проблемой."
70012020-266 = "Спасибо, что вообще так сказала!"
70012020-267 = "Ха-ха, ага. Это уже больше похвалы, чем мы заслуживаем."
70012020-268 = "И ведь раньше эфир вёл другой студент, да?"
70012020-269 = "Да. Она сказала, что должна уйти по личным причинам..."
70012020-270 = "Ну, кто знает, вернётся ли она..."
70012020-271 = "Но мы бы не хотели занять её место насовсем. Наверное, ей было бы неприятно."
70012020-272 = "Ну, в любом случае спасибо за добрые слова..."
70012020-273 = "Но мы ведь просто временно подменяли её! Да?"
70012020-274 = "Фу-фу, ага. Именно так, Кирара."
70012020-275 = ""
70012020-277 = ""
70012020-278 = ""
70012020-279 = "Да, я понимаю, что вы имеете в виду. Вы очень добры."
70012020-280 = "В любом случае не знаю, вернётся ли тот студент, но я передам ей ваши слова."
70012020-281 = "А, точно. Я хотела подарить вам что-нибудь небольшое за помощь."
70012020-282 = "Сначала я думала об автографе Макото, написанном от руки, но если хотите что-то другое..."
70012020-283 = "А? Подарок?"
70012020-284 = "Эри, что думаешь?"
70012020-285 = "Хм... Ты думаешь о том же, о чём и я?"
70012020-286 = "Ха-ха, думаю, да. Тогда..."
70012020-287 = ""
70012020-289 = ""
70012020-290 = "Не надо подарка, Ироха! Нам достаточно того, что мы получили блестящий опыт!"
70012020-291 = "Да. Новый опыт был весёлым, и нам достаточно того, что мы смогли помочь."
70012020-292 = "...Вот как."
70012020-293 = "А как насчёт твоего ID в MomoTalk? Вот это был бы идеальный подарок."
70012020-294 = "..."
70012020-295 = "Фу-фу. Хорошо. Я и сама хотела вас об этом спросить."
70012020-296 = "Кья! ☆ Ироха такая мила-а-ая!!"
70012020-297 = "Можно я тебе напишу? А, если ты сегодня вечером не слишком занята..."
70012020-299 = "[log]Сверкающие дни — навсегда.[/log]"
70012020-303 = "В ЭФИРЕ: Геенна"
