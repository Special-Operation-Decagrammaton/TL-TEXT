[translation]
70016020-1 = "The Road to the Dragon Palace (2)"
70016020-3 = "Hum hum~ Hum hum hum~♪"
70016020-4 = "The name of that ship was a Billy o' Tea~♪"
70016020-9 = "Ah, please don't put your feet on the dashboard."
70016020-10 = "Hm?"
70016020-11 = "Fear not, for these boots be practically good as new!"
70016020-12 = "No, I'm more worried about your safety! If we get in an accident, then the airbags will deploy."
70016020-13 = "Air bug?"
70016020-14 = "...I cannot say that I understand, but if the helmsman says so, then I shall oblige."
70016020-15 = "(...Has she never ridden a car before?)"
70016020-16 = "By the way... You mentioned me smelling earlier. It's not too bad, is it?"
70016020-17 = "But of course! On the contrary... I would say that the smell of the seashore#nsoothes me."
70016020-18 = "You really do like the sea, huh? Going as far as to go there arbitrarily this late at#nnight."
70016020-19 = "Tis not arbitrary of the sort! I am merely returning to my rightful place!"
70016020-20 = "You're returning home... to the sea...?"
70016020-21 = "Haha, it's like you're the messenger from the fairy tale about the Dragon Palace."
70016020-22 = "It's a little exciting to think that I'm headed towards the Dragon Queen."
70016020-23 = "Hm? Do you not fear the Dragon Queen?"
70016020-24 = "Fear? Why?"
70016020-25 = "You know how it usually goes in the fairy tales, right? #nLike when you return a turtle in distress back to the sea, and the Dragon Queen#ngrants you a wish—"
70016020-26 = "After hearing something like that... Rather than feeling fear, I began wishing to#nmeet her instead."
70016020-27 = "Hm... So you have a wish, then?"
70016020-28 = "Of course I do. Well, it's a fairly boring wish though..."
70016020-29 = "...Something like being able to live my life without worrying about money."
70016020-30 = "A little more than that would be great... Actually, I'd be happy with just enough#nmoney to live an honest life."
70016020-31 = "..."
70016020-32 = "...Sorry about that. I know you aren't interested in listening to me talk about#nsomething so boring."
70016020-33 = "Nay, this be the sort of topic that I love! Desire is what drives humans forward,#nafter all!"
70016020-34 = "I see. So this is how the landlubbers perceive the Dragon Queen."
70016020-41 = "...Huh? Where are we? The way to the sea was back at that intersection..."
70016020-42 = "Are you attempting to swindle me—"
70016020-43 = "That's not it. I just have to finish up today's work first... #nI need to make a quick stop by the office for that."
70016020-44 = "I'll be back in just a bit, so please wait right there for me. #nI would say to listen to the radio to kill some time, but it's currently broken.#nI'm really sorry about that."
70016020-48 = "Whoa, it's already this late! Anyway, please sit tight for me!"
70016020-52 = "...Hmmmm."
70016020-53 = "...Hmm."
70016020-54 = "...Mere moments ago, you were as a jellyfish, floating free and staying true to#nyourself, but now you share the likeness of a mackerel encountering a shark."
70016020-60 = "Truck number six! Get over here!"
70016020-64 = "Y-yes!!"
70016020-65 = "What is this? An invoice for a tire change?"
70016020-66 = "Y-yes. The tires were in a dire state, so..."
70016020-67 = "Excuse me? Your tires are perfectly usable! They haven't even blown open yet, so don't do something like this again without asking!"
70016020-68 = "But if the tires blow out, then it'll turn into a major incident..."
70016020-69 = "IF it gets torn, that is. I will be deducting the cost of this unauthorized replacement#nstraight from your salary."
70016020-70 = "No way...!"
70016020-71 = "Next! Truck number three! #nYou were carrying such a measly load, and yet you had the nerve to take a nap at#na service area!? You damn scoundral!"
70016020-72 = "If I loaded anymore onto this truck, I would've been violating regulations... #nThe fines incurred from that would've been paid off using my own wages too..."
70016020-73 = "And you're harping on me for napping, but I've been running around without#nsleep for three nights now! Are you saying I'm not allowed to even have a single#nhour of rest!?"
70016020-74 = "Then you should've picked up the pace and got it over with! You'd speed right#npast the regulations too. That's two birds with one stone!"
70016020-75 = "I'm deducting costs incurred by your laziness from your salary!"
70016020-76 = "Next! Truck number seven! Where in the world are you!?"
70016020-77 = "H-here! I just arrived!"
70016020-78 = "It's already been a while since we've started... Must be nice being all privileged,#nhuh?"
70016020-82 = "Seriously, where did you go to be wasting all of that gas!? #nLook at you acting all hoity-toity by using diesel!"
70016020-83 = "What's wrong with using diesel on a diesel truck...?"
70016020-84 = "Didn't I say to use kerosene!? It's way cheaper! #nWhat? Do you think gas comes out of the ground or something!?"
70016020-86 = "(Gas is made of petroleum, so you quite literally can just dig it out of the ground...)"
70016020-87 = "(Bastard! You don't even pay us properly, and yet you're still trying to cut costs!)"
70016020-89 = "Are you looking to get fired? #nI can make you disgorge all of the money you received from that salary#nadvancement, you know?"
70016020-93 = "Ugh! ...Please, anything but that..."
70016020-99 = "The land isn't even moving, and yet you feel a need to disgorge?#nAre you feeling dizzy?"
70016020-100 = "At times like these, I would suggest finding something to chew on.#nEating jerky or the like is a good choice."
70016020-105 = "W-wait a second! Didn't I tell you to sit tight!?"
70016020-106 = "Haah? Who are you?"
70016020-108 = "I know naught of what you are doing, but please finish anon. #nThis fellow here ought to take me to the sea."
70016020-110 = "Are you kidding me? Now you've got a side gig as a taxi driver? The audacity to be picking up customers without any permission."
70016020-111 = "Th-that's not it! She was all alone by the roadside, so I felt bad and decided to give#nher a lift..."
70016020-112 = "Huh? For FREE? Is that where all that gas went!?"
70016020-113 = "Hey, missy. There's nothing that's for free in this world. #nSince you've already been driven this far, you gotta pay up somethin'."
70016020-114 = "This girl has nothing to do with this...!"
70016020-119 = "Of course."
70016020-120 = "...Huh?"
70016020-121 = "Nothing in this world comes without a price; that much is not exclusive to those on land.#n I know this very well. I have no intention to let someone who has shown me kindness return#nhome empty handed."
70016020-122 = "Are you the captain around here? If so, let us move elsewhere and have a talk."
70016020-123 = "Or perhaps you'd like to discuss this here? Though I will say, you do not strike me as the type to share profits with others."
70016020-124 = "...What are you trying to pull?"
70016020-125 = "Exactly what you said—paying up. So long as it is within my possession, then I may#nbestow upon you anything you so desire, in any amount you wish."
70016020-126 = "In any case, there is no harm in hearing me out. #n'Twould certainly be better than fleecing the small fry here for pocket change."
70016020-127 = "..."
70016020-131 = "Everyone get back to work."
70016020-132 = "Missy, you come with me to my office."
70016020-133 = "Hehe, glad to hear we're on the same page."
70016020-142 = "What in the world is she planning to do...? She's clearly flat out broke..."
70016020-152 = "I'm tired and I want to go home, but... I'm worried about her."
70016020-163 = "No no no, allow me to get the door for you! Aren't you already carrying a lot?"
70016020-164 = "There's no need for you to flatter me like this."
70016020-165 = "I-indeed. Hehe..."
70016020-166 = "Would you like a ride on my car?#nMaking you ride on a truck seems a little bit... well."
70016020-167 = "Nay, 'tis fine. I have already made prior arrangements on whose vehicle I shall ride#nand who shall drive me."
70016020-168 = "Sailors are terribly wary. We treat those who we don't know with suspicion."
70016020-169 = "I-I see! Hey, truck number seven! Lead her to the sea!"
70016020-171 = "Umm... Are you saying the little missy here paid her fare?"
70016020-173 = "Why do you care!? Stop asking already and drive her there!"
70016020-174 = "Let us depart for the sea!"
70016020-179 = "G-got it..."
70016020-185 = "..."
70016020-186 = "Ooh! I smell it! The sea! It's close!"
70016020-187 = "..."
70016020-188 = "..."
70016020-189 = "Hm. Are you not going to ask anything?"
70016020-190 = "The boss told me to not ask."
70016020-191 = "Then treat this as my own little monologue."
70016020-192 = "Tis enough for you to merely listen."
70016020-193 = "Unlike man... The sea is transparent. It cannot hide its intentions."
70016020-194 = "It stirs endlessly, laying its very being bare for all to see. Yet, the people of the land#ndo not even attempt to listen."
70016020-195 = "When I speak of the sea precisely as I have heard it, #npeople behave as if it were the first time they have ever heard it."
70016020-196 = "..."
70016020-197 = "Therefore... #nso long as I sprinkle in a little of what the other party wants to hear, along with what I know... #nI can make others believe what I say without even a droplet of doubt."
70016020-198 = "What in the world did you talk about...?"
70016020-199 = "Finally showing interest, are you? Let me tell you then. 'Tis something you ought#nto know."
70016020-200 = "Earlier, I saw the sea at that intersection... and floating atop was a dredger."
70016020-201 = "What's more, based on the coastal terrain... One can infer that whales often come here to frolic."
70016020-202 = "Y-yeah. That's true, but... How did you know all this? Isn't this your first time here?"
70016020-203 = "Just as I said—the sea tells you everything. This is precisely \"what I know.\""
70016020-204 = "So I spoke thus—there was ambergris mixed in with the sand on that dredger."
70016020-205 = "However, ambergris is considered an unexpected byproduct. #nAs such, I would need a contractor to manage it in secret... #nThat is what I told your boss."
70016020-206 = "Vast riches readily available without any hassle; all by simply paying a small fee."
70016020-207 = "That is what the \"other party wants to hear.\" You landlubbers are weak to these#nsorts of talks."
70016020-208 = "Thus, I received an initial upfront payment—a broker fee, as some would call it."
70016020-209 = "What do you think? Not as big of a deal as you thought, was it?"
70016020-210 = "Calling it no big deal is insane..."
70016020-211 = "(Was this why she wanted to go to the sea so badly?)"
70016020-216 = "Heh heh heh!"
70016020-217 = "Tis the sea! Just in time for the sunrise, at that! Excellent!"
70016020-218 = "Avast! All stop! Hahaha!"
70016020-219 = "H-hey, that's dangerous! The truck's still moving, so don't open the door just yet!"
70016020-231 = "Sniff... Haaaah..."
70016020-232 = "The waves that crash against the wee little boat sailing with resolve... The guiding winds..."
70016020-236 = "O sea, the Dragon Queen has returned."
70016020-241 = "Huh? Isn't the dredger over there? Is this the agreed-upon location?"
70016020-242 = "The wind's strong, so I'll wait in the car. I'll get cold otherwise."
70016020-243 = "There are neither winds too strong, nor was anything agreed-upon. Besides—"
70016020-247 = "What Dragon Queen would fear the sea?"
70016020-251 = "What!? Then, everything you told the boss is...?"
70016020-253 = "Supposing 'twere true, what reason would I have to tell that knave? #nThe one who has taken the helm and brought me this far, is none other than you."
70016020-254 = "You've truly helped me out. Being separated from the sea makes me terribly glum."
70016020-255 = "Come to think of it, you mentioned the tale of the Dragon Queen earlier. #nYou mentioned how you longed to meet the Dragon Queen, who grants wishes in return for acts of kindness."
70016020-256 = "The money from that knave is in your truck. 'Tis all probably money scrounged from the weak,#nanyhow. Take it and scurry away somewhere. It should be enough for you to live without #nworry for a time."
70016020-257 = "B-but... That's a crime... And..."
70016020-258 = "Good grief, what a ne'er-do-well you are."
70016020-259 = "Have you truly ever read the fairy tale to its end?"
70016020-260 = "Wishes come at a price. In due time, misfortune will befall all who cross paths with the Dragon Queen."
70016020-264 = "If you do not pursue that immediate boon, #nthen you shall come to regret having ever gotten involved."
70016020-265 = "N-no way..."
70016020-266 = "Ah, 'twould seem I have yet to introduce myself."
70016020-267 = "I am the Dragon Queen who rules the vast oceans of Kivotos; the one who#ncommands the winds and the waves. I am the one they call the Sea Dragon—"
70016020-271 = "Next up..."
70016020-272 = "The fugitive, Gonokami Nanami... is a highly violent... dangerous individual."
70016020-275 = "If she is sighted... Please immediately report her—"
70016020-276 = "The Road to the Dragon Palace"