[translation]
70016020-1 = "The Road to Ryugu (2)"
70016020-3 = "Fufu-n, fufufu-n~♪"
70016020-4 = "The name of the ship was the, the beauty~♪"
70016020-9 = "Ah, please do not put your feet on the dashboard."
70016020-10 = "Hm?"
70016020-11 = "No need to worry! These boots are as good as new!"
70016020-12 = "That is not what I mean, it is dangerous! If an accident happens, the airbags will deploy."
70016020-13 = "Airbag?"
70016020-14 = "......I do not quite understand, but it is what the helmsman says. I suppose I will follow."
70016020-15 = "(......Could it be that she has never ridden in a car before?)"
70016020-16 = "Come to think of it... you said you smelled something earlier, are you alright?"
70016020-17 = "Of course I am alright! If anything... smelling the sea breeze sets my mind at ease."
70016020-18 = "You must really like the ocean. To suddenly want to go to the sea at an hour like this."
70016020-19 = "It is not sudden! I am merely returning to where I truly belong!"
70016020-20 = "Returning... to the ocean...?"
70016020-21 = "Haha, you sound just like a messenger from the Dragon Palace in a fairy tale."
70016020-22 = "Thinking about going to see the Dragon King makes me feel strangely excited."
70016020-23 = "Hm? Are you not afraid of the Dragon King?"
70016020-24 = "Afraid? Why would I be?"
70016020-25 = "Isn't it a common trope in fairy tales? #nLike when you take a troubled turtle to the sea, and the Dragon King grants your wish--"
70016020-26 = "Hearing a story like that... rather than being afraid, I actually want to meet him."
70016020-27 = "I see... So you have a wish as well."
70016020-28 = "Well, of course. Though, it is a rather modest wish..."
70016020-29 = "......Like wanting to live a life where I do not have to worry about money, or something."
70016020-30 = "I hope to have a bit more leeway... No, I just want to earn enough to live a normal life."
70016020-31 = "......"
70016020-32 = "......I am sorry. You probably do not want to hear such boring talk, right?"
70016020-33 = "No, I love stories like that! Because desire is the driving force that moves humanity!"
70016020-34 = "I see. So the people of the land think that way about the Dragon King."
70016020-41 = "......Hmm? Where is this? The ocean is just past that fork in the road we passed earlier, but..."
70016020-42 = "Could it be that you deceived me--"
70016020-43 = "No, I just need to finish today's work first... #nWe are stopping by the office for a moment."
70016020-44 = "I will be right back, so please wait here. #nI am sorry there is nothing to pass the time with since the radio is broken..."
70016020-48 = "Whoa, look at the time! Anyway, please stay put!"
70016020-52 = "......Huum."
70016020-53 = "......Huum."
70016020-54 = "......Until just now, you were like a jellyfish drifting at ease, #nbut now you look like a horse mackerel that encountered a shark."
70016020-60 = "Truck Number 6! Get out here!"
70016020-64 = "Y-Yes!!"
70016020-65 = "What is this? An invoice for tire replacement?"
70016020-66 = "Y-Yes. The wear and tear on the tires was severe..."
70016020-67 = "Ha? They are not even torn, they are still usable! Don't do whatever you want!"
70016020-68 = "If they tore, that would cause a major accident..."
70016020-69 = "If they tore, sure. I am deducting whatever you changed without permission from your pay."
70016020-70 = "No way...!"
70016020-71 = "Next! Truck Number 3! #nWith that kind of cargo weight, how could you afford to take a nap at a service area! You parasite!"
70016020-72 = "If we load anything more on this truck, it will violate regulations... #nEven the fines are coming out of our own pay..."
70016020-73 = "You say nap, but we have been driving for three days straight without sleep!? #nAre we not even allowed a single hour of rest!?"
70016020-74 = "Then step on the gas and finish quickly! Breaking regulations is killing two birds with one stone, right?"
70016020-75 = "I am deducting the time you wasted from your pay!"
70016020-76 = "Next! Truck Number 7! Where are you!"
70016020-77 = "Y-Yes! Coming!"
70016020-78 = "The time has long since passed... Living the high life, are we?"
70016020-82 = "And another thing, where did you waste all that oil!? #nLording it up and using diesel of all things!"
70016020-83 = "What is wrong with putting diesel oil in a diesel truck..."
70016020-84 = "I told you to use cheaper kerosene! #nDo you think oil just bubbles up if you dig into the dirt!?"
70016020-86 = "(It is petroleum, so it does come out if you dig in the dirt...)"
70016020-87 = "(Damn it! You don't even pay us properly...!)"
70016020-89 = "Do you want to get fired? #nShall I make you cough up all the pay I advanced you right here on the spot?"
70016020-93 = "Ugh! ...Please, anything but that..."
70016020-99 = "Why do you need to cough up anything on solid ground? Are you feeling dizzy?"
70016020-100 = "When that happens, chewing on something helps. You should put some dried meat in your mouth."
70016020-105 = "W-Wait! I told you to wait here, didn't I?!"
70016020-106 = "Huh? Who the hell are you?"
70016020-108 = "I know not what you are doing, but finish it quickly. #nThis person must take me to the ocean."
70016020-110 = "Hey, hey, are you moonlighting as a taxi now? Picking up customers without permission."
70016020-111 = "N-No! She was all alone by the roadside, so I just felt sorry for her and gave her a ride..."
70016020-112 = "Ha? For free? Then that means you wasted that much oil on her?!"
70016020-113 = "Hey, girl. There is no such thing as a free ride in this world. #nSince she gave you a lift all the way here, shouldn't you pay something?"
70016020-114 = "This child has nothing to do with this...!"
70016020-119 = "Naturally."
70016020-120 = "......Ha?"
70016020-121 = "The fact that nothing in this world is free is not limited to the land. I know this well. #nI have no intention of sending someone who showed me kindness away empty-handed."
70016020-122 = "Are you the captain here? If so, I wish to speak with you. Let us change locations."
70016020-123 = "Or shall we speak here? You do not strike me as the type to share profits with others."
70016020-124 = "......What is your game?"
70016020-125 = "Did I not say that something must be paid? If it is something I possess, I shall give you as much as you like."
70016020-126 = "Either way, you will lose nothing by listening to what I have to say. #nRather than petty-pocketing pocket change from small fry here."
70016020-127 = "......"
70016020-131 = "Hey, all of you back to work."
70016020-132 = "Girl, come to the office."
70016020-133 = "Fufu, how convenient that you are quick to understand."
70016020-142 = "Just what does she plan to do...? She looks penniless no matter how you look at her..."
70016020-152 = "I am tired and want to go home already, but... I am worried about that kid..."
70016020-163 = "No, no, I will open the door myself! You must have a lot of luggage!"
70016020-164 = "You need not fawn over me to such an extent."
70016020-165 = "I-Is that so? Hehe..."
70016020-166 = "Then, shall I guide you in my own car? There is no way I could let you ride in a truck..."
70016020-167 = "No, it is fine. What kind of car I ride in and who I go with has already been arranged."
70016020-168 = "Seafarers are wary. If an unknown person is present, they will grow suspicious."
70016020-169 = "I-I see! Hey, Truck Number 7! Guide this person to the ocean!"
70016020-171 = "Uhm... Does that mean the young lady paid?"
70016020-173 = "It is none of your business! Just shut up and guide them!"
70016020-174 = "Let us go, to the ocean!"
70016020-179 = "I-Understood..."
70016020-185 = "......"
70016020-186 = "Oh! The smell of the ocean! We are getting close!"
70016020-187 = "......"
70016020-188 = "......"
70016020-189 = "Hmph. You ask no questions?"
70016020-190 = "The boss told me not to ask anything."
70016020-191 = "Then, from here on is my own monologue."
70016020-192 = "You need only listen as you are."
70016020-193 = "Unlike humans, the ocean... is transparent and hides no true intentions."
70016020-194 = "It swirls endlessly, baring all of itself, yet the people of the land do not even have ears to listen."
70016020-195 = "When I speak truthfully of what I have heard from the sea, #nthey end up making faces as if hearing it for the very first time."
70016020-196 = "......"
70016020-197 = "Therefore... #nif I mix what I know with what the listener wants to hear... #n they believe it without a single doubt."
70016020-198 = "Just what kind of story did you...?"
70016020-199 = "Finally curious, are you? Then I shall tell you. You ought to know."
70016020-200 = "Earlier, we saw the ocean beyond the fork in the road... and there was a dredging ship there."
70016020-201 = "Also, judging by the coastal topography... I can infer that whales frequently visit to play."
70016020-202 = "Y-Yes. That is true. But why? This was your first time coming here, right?"
70016020-203 = "Did I not say? The ocean tells me everything. This is a 'story I know'."
70016020-204 = "So I told him this--that ambergris from whales is mixed in the sand of the dredging ship."
70016020-205 = "However, ambergris is an unexpected byproduct. #nTherefore, I am looking for a contractor to dispose of it in secret... #nthat is what I told your boss."
70016020-206 = "By paying a small commission, you can acquire a large sum of money without any hassle."
70016020-207 = "This is the 'story the listener wanted to hear'. The people of the land are weak to such tales."
70016020-208 = "And so, I received the first payment in advance. Under the guise of paying the intermediary."
70016020-209 = "What do you think? Not as big a deal as you thought, is it?"
70016020-210 = "Not a big deal? That is an outrageous story..."
70016020-211 = "(So even saying you wanted to go to the ocean was ultimately for this reason?)"
70016020-216 = "Fuffuffu!"
70016020-217 = "The ocean! The morning sun is rising just in time! Splendid!"
70016020-218 = "Stop, stop! Stop both engines! Hahaha!"
70016020-219 = "D-Dangerous! We are still moving, so please do not open the door!"
70016020-231 = "Huu~, haa~..."
70016020-232 = "The waves beating against the boldly advancing boat, the guiding wind..."
70016020-236 = "O ocean, the Dragon King has returned."
70016020-241 = "Huh? The dredging ship is that way, but is this place alright for our rendezvous?"
70016020-242 = "The wind is strong, so let us wait inside the car. You will catch a chill."
70016020-243 = "There is neither a wind too strong, nor a promise to keep. Besides--"
70016020-247 = "Would the Dragon King fear the ocean?"
70016020-251 = "Huh!? Then everything you told the boss was...?"
70016020-253 = "Even supposing such a tale existed, what reason would I have to teach it to that fellow? #nWas it not you who took the helm and brought me this far?"
70016020-254 = "You have my thanks. When I am away from the ocean, my spirits invariably sink."
70016020-255 = "Come to think of it, you were speaking of the Dragon King earlier. #nHow you wanted to meet the Dragon King who grants wishes as thanks for an act of kindness."
70016020-256 = "The money I received from that fellow is in the car. It was extorted from the weak anyway. #nIf you take that and go somewhere, you should be able to live without worry for a while."
70016020-257 = "B-But... That is a crime... And besides..."
70016020-258 = "Good grief, what a troublesome creature."
70016020-259 = "Did you actually read that fairy tale to the very end?"
70016020-260 = "Every wish comes with a price. All who become entangled with the Dragon King inevitably meet a misfortune."
70016020-264 = "If you will not seize the happiness right in front of you, #nyou will come to wish you had never gotten involved from the very beginning."
70016020-265 = "T-That's..."
70016020-266 = "Ah, come to think of it, I have not yet introduced myself."
70016020-267 = "I am the Dragon King who rules the oceans of Kivotos, the jiao of tidal waters who governs the wind and waves--"
70016020-271 = "Now for the next news..."
70016020-272 = "Fugitive, Gonokami Nanami... she is extremely violent... and a dangerous individual."
70016020-275 = "If sighted... please report it immediately--"
70016020-276 = "The Road to Ryugu"
