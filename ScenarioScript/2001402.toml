[translation]
2001402-1 = "Северный ветер и Солнце"
2001402-2 = "Офис Шале"
2001402-3 = "Жарким полуднем."
2001402-4 = "Ух. Как же жарко."
2001402-5 = "Клянусь, с каждым днём становится всё жарче."
2001402-6 = "Ну, хотя бы в Шале есть кондиционер!"
2001402-7 = "...Почему тогда здесь так жарко?"
2001402-8 = "[s] «Кондиционер сломался. Его должны починить.»"
2001402-9 = "Серьёзно? Именно сегодня?"
2001402-10 = "Я вообще-то пришла в Шале главным образом, чтобы охладиться."
2001402-11 = "...Похоже, придётся терпеть."
2001402-12 = "[s] «Если тебе так жарко, почему не снять шлем?»"
2001402-13 = "Что вы такое говорите, Сенсей?"
2001402-14 = "Мой шлем защищает голову — самый жизненно важный орган тела. Я не могу просто снять его во время задания!"
2001402-15 = "Вам стоит посмотреть статистику солдат, которых подстрелили после того, как они сняли шлем во время миссии."
2001402-16 = "Вероятность получить пулю здесь невелика, но работа в Шале всё равно считается заданием."
2001402-17 = "И представьте, что скажут другие студенты, если увидят агента SRT, обнажившего голову только потому, что ей стало немного жарко?"
2001402-18 = "[s] «Скорее всего, ничего. Большинство из них вообще не носит шлемы.»"
2001402-19 = "То, что они расслабились, не значит, что и я должна."
2001402-20 = "В общем! Во время задания я шлем не сниму! Ни за что!"
2001402-21 = "[s] «Ни за что?»"
2001402-22 = "Ни за что!"
2001402-23 = "Дальше за тобой!"
2001402-25 = "Я перепробовал один способ за другим, пытаясь заставить Саки снять шлем, чтобы она могла немного остыть."
2001402-27 = ""
2001402-28 = "[ns] «Саки! У тебя на шлеме жук!»"
2001402-29 = "А?"
2001402-30 = ""
2001402-32 = ""
2001402-33 = "Странно. Я ничего там не почувствовала. Он уже улетел?"
2001402-34 = "[s] «...Ты сейчас пыталась поймать его рукой?»"
2001402-35 = "Да, а что?"
2001402-36 = "Вы думали, я устрою истерику и расплачусь из-за какого-то ничтожного жука?"
2001402-37 = "Я иду первой в отряде. Я выхожу на передовую, когда больше никто не решается. Что мне может сделать какой-то жук?"
2001402-38 = "Забудьте про жука, чудак. Следующее в списке дел..."
2001402-40 = ""
2001402-41 = "[ns] «Недавнее исследование показало, что стойка на руках полезна для здоровья.»"
2001402-42 = "...Здорово."
2001402-43 = ""
2001402-45 = ""
2001402-46 = "Итак, срок службы карабинов и фиксирующих штифтов, используемых в Шале..."
2001402-47 = "[ns] «Может, тебе стоит попробовать постоять на руках.»"
2001402-48 = "Прямо сейчас? Здесь?"
2001402-49 = "..."
2001402-50 = "Я слышала, что вы странный взрослый, но..."
2001402-51 = "С чего вы вообще просите студента в юбке встать на руки?"
2001402-52 = "[s] «Я-Я не это имел в виду...»"
2001402-53 = "Не надо оправданий, Сенсей. Я прекрасно понимаю, о чём вы думаете."
2001402-54 = "Хватит валять дурака и сосредоточьтесь."
2001402-56 = "(...Мне пришлось прибегнуть к последнему средству.)"
2001402-58 = "[ns] Подкрасться к Саки сзади и снять с неё шлем."
2001402-60 = ""
2001402-61 = ""
2001402-62 = "...Сенсей. Да что с вами не так?!"
2001402-63 = "Вы воспользовались моей слепой зоной и подкрались ко мне."
2001402-64 = "Вы проверяете мою ситуационную осведомлённость?"
2001402-65 = "Я пытаюсь работать, Сенсей. Перестаньте мне мешать."
2001402-66 = "[s] «П-Прости...»"
2001402-68 = "Я сдался и перестал пытаться заставить Саки снять шлем..."
2001402-69 = ""
2001402-71 = "*вздох* Наконец-то закончили."
2001402-72 = "[s] «...Хорошая работа.»"
2001402-73 = "И вы тоже, Сенсей."
2001402-74 = "Но вы выглядите измотанным. Из-за жары?"
2001402-75 = "Не могу вас винить. Я сама вымоталась."
2001402-76 = ""
2001402-78 = ""
2001402-79 = ""
2001402-80 = "[ns] «Саки, ты сейчас только что...?»"
2001402-81 = "А?"
2001402-82 = "[s] «Ты же говорила, что никогда не снимаешь шлем во время задания.»"
2001402-83 = "Ну да. По протоколу во время миссии нужно носить шлем."
2001402-84 = "Но работу мы уже закончили, так что..."
2001402-85 = "Вы в порядке, Сенсей?"
2001402-86 = "[s1] «Саки. Однажды ты поймёшь... Ничто не имеет смысла...»\n[s2] «Что я всё это время делал... Ради чего...?»"
2001402-87 = "...Вы и правда странный."
2001402-88 = "...Вы и правда странный."
2001402-90 = "...Даже уходя обратно в лагерь, Саки в последний раз недоверчиво посмотрела на меня."
