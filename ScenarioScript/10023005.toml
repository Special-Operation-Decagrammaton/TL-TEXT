[translation]
10023005-1 = "Пролог; Я же говорила, эта форма опасна"
10023005-2 = "Офис Токи"
10023005-3 = "Добро пожаловать, Сенсей."
10023005-4 = "Я всё ещё обживаюсь, так что прошу простить скромную обстановку."
10023005-5 = "[s] «Ты здесь одна, Токи?»"
10023005-6 = "...Технически да. Да, одна."
10023005-7 = "Остальные в поле, выполняют задание."
10023005-8 = "Да... выполняют задание... то, чего я до сих пор не сделала, хотя тоже являюсь членом C&C..."
10023005-9 = "Ну, не то чтобы я им нужна. Они и сами работают как хорошо смазанный механизм."
10023005-10 = "Мой позывной, Ноль-Четыре, может просто пылиться... забытый и никому не нужный... *шмыг*"
10023005-11 = "[s] «Т-Ты случайно, эм... не расстроена?»"
10023005-12 = "Почему вы спрашиваете? Я профессиональный высококвалифицированный агент. Мне всё равно. Я. В. Порядке."
10023005-13 = "[s1] «Ты очень стараешься меня убедить...»\n[s2] «Звучит так, будто это была последняя капля...»"
10023005-14 = "Ваша оценка ситуации полностью неверна, Сенсей."
10023005-15 = "Ваша оценка ситуации полностью неверна, Сенсей."
10023005-16 = "Мне никогда не было лучше. Пульс оставался стабильным, и я не проявляла обычных физических признаков эмоциональной реакции."
10023005-17 = "И независимо от моих чувств, Семинар отказался официально переводить меня в другой отдел."
10023005-18 = "Единственные люди, от которых мне сейчас разрешено принимать приказы, — Генеральный студенческий совет. А значит, следовательно, и вы как член Шале."
10023005-19 = "Поэтому, если только вам не нужно, чтобы я сегодня сортировала бумаги или принесла кофе, я нахожусь в бессрочном резерве. И меня это устраивает. Полностью и абсолютно."
10023005-20 = "[s] «Токи...?»"
10023005-21 = "Я профессионал. Профессионалы не жалуются на задания. Даже на их отсутствие. У меня нет никаких проблем с нынешней ситуацией."
10023005-22 = "[s] «...»"
10023005-23 = "Да. Никаких проблем."
10023005-24 = "..."
10023005-25 = "Я понимаю смысл вашего выражения лица и всё равно остаюсь при своём мнении."
10023005-26 = "В любом случае, могу я чем-нибудь помочь? О! Вы поэтому пришли? Хотите поручить C&C работу? Что-нибудь, что могла бы сделать я?"
10023005-27 = "...Кхм. Не то чтобы я на что-то такое надеялась. Потому что нынешняя ситуация меня полностью устраивает."
10023005-28 = "[s] «Вообще-то у меня действительно есть просьба...»"
10023005-29 = "...Я ценю ваши усилия, но всё в порядке, Сенсей."
10023005-30 = "[s] «А-А? Что ты имеешь в виду?»"
10023005-31 = "Я понимаю, что вы делаете. Пытаетесь поднять мне настроение."
10023005-32 = "Не нужно. Мне не нужна какая-то мелкая работа, придуманная из жалости."
10023005-33 = "Я ни капли не одинока, не подавлена и не настолько скучаю, чтобы самой ворваться в Семинар и требовать работу. Даже близко нет."
10023005-34 = "[s3] «Я не придумываю тебе задания, обещаю.» \n[s4] «У меня правда есть настоящая просьба к C&C!»"
10023005-35 = ""
10023005-36 = ""
10023005-38 = ""
10023005-39 = "Анализирую лёгкую складку на ваших бровях и искренний блеск в глазах... Вы серьёзны."
10023005-40 = "Тогда я отвечу на вашу решимость тем же."
10023005-41 = "Для вашей просьбы нужна подходящая атмосфера. Хотите чаю, Сенсей?"
10023005-42 = "Не нужно? Но..."
10023005-43 = "Понятно. Просто... это моё первое задание с тех пор, как я вступила в C&C."
10023005-44 = "Это немного по-детски, но... для меня это кажется важным моментом."
10023005-45 = "Я готова. Какова моя самая первая миссия в качестве члена C&C?"
10023005-46 = "[ns] «Мне нужны формы горничных. »"
10023005-47 = "...Формы горничных?"
10023005-48 = "..."
10023005-49 = "...Понятно."
10023005-50 = "[s] «Что это было за осуждающее молчание?!»"
10023005-51 = "Это было не осуждение, а скорее... любопытство: когда и почему вы начали носить форму горничной, Сенсей."
10023005-52 = "Но, как я уже сказала, осуждать вас не буду. Надеюсь, здешние формы удовлетворят ваши потребности... Это может быть сложно, но я попробую найти запасную вашего размера."
10023005-53 = "Если просьба срочная, хотите, я сниму свою? Хотя сомневаюсь, что она вам подойдёт..."
10023005-54 = "[s] «Стой, стой, стой! Ты неправильно поняла!»"
10023005-56 = "[ns] «Мне нужны формы горничных для Отдела разработки игр!»"
10023005-57 = "Что?"
10023005-58 = "Отдел разработки игр...?"
