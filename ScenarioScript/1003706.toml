[translation]
1003706-1 = "Недоразумение председателя Комитета безопасности"
1003706-2 = "Пост безопасности, 8-й район Красной Зимы"
1003706-3 = "Вы правда думаете, что вам это сойдёт с рук?!"
1003706-4 = "Я устрою чистку каждому из вас, как только вернусь в Секретариат!"
1003706-5 = "Тишина! Вы проникли в запретную зону."
1003706-6 = "Ведите себя прилично!"
1003706-7 = "Больше никогда не выйду из дома без ученического удостоверения..."
1003706-8 = "[s] «Что здесь происходит?!»"
1003706-9 = "А? Ты кто такая?"
1003706-10 = "Это передовая Академии Красной Зимы. Сюда суются только дураки и шпионы, так кто же вы?"
1003706-11 = "Если у вас нет надлежащего удостоверения, я и вас арестую как шпиона!"
1003706-12 = "[s] Покажи удостоверение."
1003706-13 = "В этом удостоверении написано... вы тот самый Сенсей из Шале? Товарищ, заслуживший высочайшее доверие Великого лидера?"
1003706-14 = "Простите, что не узнала вас. Здесь такая глушь, что фотографии доходят до нас целую вечность."
1003706-15 = "Но я читала о ваших достижениях в газете «Красный Медведь».#nДля меня честь познакомиться с вами!"
1003706-16 = "[s1] «Итак, объяснишь, что здесь происходит?»\n[s2] «Почему ты арестовала Марину?»"
1003706-17 = "А, вы про эту шпионку, которая выдаёт себя за председателя Комитета безопасности?"
1003706-18 = "А, вы про эту шпионку, которая выдаёт себя за председателя Комитета безопасности?"
1003706-19 = "Она пыталась проникнуть в запретную зону под охраной Совета безопасности без какого-либо удостоверения!"
1003706-20 = "И у неё ещё хватило наглости заявить, что она сама председатель Комитета безопасности."
1003706-21 = "Что мне нужно сделать, чтобы вы мне поверили?!"
1003706-22 = "Замолчи, шпионка! Ты никак не можешь быть председателем Комитета безопасности!"
1003706-23 = "Согласно «Красному Медведю»... председатель Комитета безопасности Марина миниатюрна, но страшна настолько, что обычному студенту и не представить. Даже самый свирепый зверь ей не соперник."
1003706-24 = "А тут какая-то неуклюжая дурёха, которая заблудилась на прогулке, убегая от бездомной кошки, заявляет, что она председатель Комитета безопасности. Ха!"
1003706-25 = "О-Ох. Ну, это потому что..."
1003706-26 = "Кроме того, председатель Комитета безопасности — близкая помощница президента Черино и отвечает за безопасность Великого лидера..."
1003706-27 = "А ты даже не знаешь её рост!"
1003706-28 = "Как ты смеешь выдавать себя за великую Марину?! Ни стыда ни совести!"
1003706-29 = "Настоящая председатель Марина — достойный восхищения и уважаемый человек!"
1003706-30 = "..."
1003706-31 = "[s] «Вообще-то это—»"
1003706-32 = "Нет, Сенсей. Я не председатель Комитета безопасности."
1003706-33 = "После того, как она меня описала... Я не хочу разочаровывать членов Совета безопасности, которые восхищаются идеальной версией меня, до которой я не дотягиваю."
1003706-34 = "Поэтому лучше сделайте вид, что не знаете, кто я."
1003706-36 = "Я объяснил ситуацию членам Совета безопасности и забрал Марину с собой."
1003706-38 = "Мне так стыдно... Я не могу вернуться в Секретариат в таком виде."
1003706-39 = "Вместо того чтобы быть примером для подчинённых, я опозорилась и ещё нуждалась в вашей помощи, Сенсей."
1003706-40 = "Я не заслуживаю звания председателя Комитета безопасности Академии Красной Зимы."
1003706-41 = "Я немедленно подам президенту Черино заявление об отставке."
1003706-42 = "[s3] «Это уже немного чересчур.»\n[s4] «Для Совета безопасности это будет большой потерей.»"
1003706-43 = "Что вы имеете в виду, Сенсей?"
1003706-44 = "Что вы имеете в виду, Сенсей?"
1003706-45 = "Я боюсь бездомных кошек и даже не могу запомнить данные из профиля президента..."
1003706-46 = "Как я могу быть достойна своей должности?"
1003706-47 = "[s] «Хм. Если ты так считаешь.»"
1003706-48 = "Что это вообще должно значить?!"
1003706-49 = "Если хотите меня подбодрить, делайте это как следует!"
1003706-50 = "[s5] «Ты доверяешь людям!»\n[s6] «Ты отлично убираешь туалеты!»"
1003706-51 = "И какое отношение к чему-либо имеет то, что я доверяю людям?"
1003706-52 = "Потому что я без подозрений доверяю подчинённым, они отвечают мне тем же?"
1003706-53 = "Ну... Если подумать, члены Совета безопасности всегда следовали за мной, когда я устраивала переворот."
1003706-54 = "Уборка туалетов? И это тут при чём?"
1003706-55 = "Моя самоотверженность в защите студентов от бактерий достойна восхищения?"
1003706-56 = "Если подумать... у нас и правда никогда не было проблем из-за плохой санитарии."
1003706-57 = "Что ж, раз вы настаиваете. Я ещё подумаю над отставкой."
1003706-58 = "Всё равно никто не достаточно талантлив, чтобы занять моё место! И говорят же: споткнувшись, можно избежать падения!"
1003706-59 = "Я искуплю сегодняшнюю ошибку и продолжу показывать пример величия!"
1003706-61 = "Я пошёл за Мариной к Секретариату. Она внезапно была необычайно воодушевлена..."
1003706-62 = "...но всё равно умудрилась свернуть не туда и снова заблудиться."
