[translation]
10040100-1 = "Послесловие;БУМ!"
10040100-2 = "...Нет, «Поймай Джокера» вообще не подходит. У Ноа слишком огромное преимущество."
10040100-3 = "Такая односторонняя игра совсем не весёлая."
10040100-4 = ""
10040100-6 = ""
10040100-7 = ""
10040100-8 = "Ох. Кажется, я немного слишком увлеклась."
10040100-9 = "Тогда, может, попробуем что-нибудь другое? Есть предложения...?"
10040100-10 = "Я, я! Теперь моя очередь выбирать игру!"
10040100-11 = "Хорошо, Конури Маки, говори."
10040100-12 = "Если уж всю ночь вместе играть, настолки — это, конечно, хорошо, но настоящая классика — всем набиться перед большим телевизором и играть в видеоигры!"
10040100-13 = "Так что теперь сражаемся геймпадами!"
10040100-15 = "...Видеоигры? Это даёт Веритас преимущество, так что я не против."
10040100-16 = "Но ты взяла с собой консоль? И я не уверена, что у нас вообще есть игры для компании..."
10040100-18 = "Хи-хи-хи. Ты забыла про «BOOM,» Харе? Пока у нас есть процессор и монитор, в классическую версию можно играть где угодно!"
10040100-19 = "Просто запускаем процесс модификации прошивки с телефона, настраиваем ввод... вуаля!"
10040100-20 = "Только потом верни телевизор в исходное состояние, Маки."
10040100-21 = "Да не парься! Это делается одной кнопкой! И потом так же легко можно снова поставить, если захотите ещё раз сыграть в «BOOM»!"
10040100-22 = "Стойте-стойте. Мы забываем, что это Комната самоанализа Коюки. Точно стоит добавлять сюда ещё больше развлечений, отвлекающих её от, ну... самоанализа?!"
10040100-24 = "Хотя подозреваю, что у Коюки где-то здесь и так припрятана настоящая игровая консоль."
10040100-25 = "BOOM — одиночный шутер, разве нет? Как мы будем играть вместе?"
10040100-26 = "Там есть режим спидрана, который записывает лучшее время прохождения!"
10040100-27 = "Каждая проходит первый этап, и выигрывает та, у кого самое быстрое время! Проигравшая идёт в магазин за снеками!"
10040100-28 = "И правда, если только первый этап, то он довольно прямолинейный и без серьёзных ловушек. Похоже на честное состязание."
10040100-30 = "Мне подходит. Я давно не играла, так что, если честно, немного нервничаю."
10040100-31 = "Я в такое не играю... так что этот раунд пропущу."
10040100-32 = "Да ладно тебе, Чихиро! Давай вместе! Я тебя научу!"
10040100-33 = "Тебе ещё может понравиться! Вдруг обнаружишь в себе неожиданный талант к видеоиграм!"
10040100-34 = "Ты просто пытаешься уговорить меня, чтобы потом победить?"
10040100-35 = "Н-ну, не скажу, что эта мысль мне совсем не приходила. А-ха... ха..."
10040100-36 = "Просто садись сюда и бери геймпад. Я покажу, как им пользоваться."
10040100-38 = ""
10040100-39 = "Хм? Появились какие-то демоны? Мне их атаковать?"
10040100-40 = "Угу! Эти инопланетные пираты пытаются прикончить твоего персонажа, Бумгая. Нажми нижнюю кнопку, чтобы ударить их."
10040100-41 = ""
10040100-43 = ""
10040100-44 = "О, сработало. Я вырубила пришельцев."
10040100-45 = "Кулаки эффективны, но дальность у них совсем маленькая. Так что просто возьми дробовик, который висит вон на—"
10040100-46 = ""
10040100-48 = ""
10040100-49 = ""
10040100-50 = ""
10040100-51 = ""
10040100-52 = "Ого... Эффекты ощущаются такими настоящими. В играх и такое бывает?"
10040100-53 = ""
10040100-55 = ""
10040100-56 = "Эм, дробовики вообще-то эффективнее, чем—"
10040100-57 = ""
10040100-59 = ""
10040100-60 = ""
10040100-61 = ""
10040100-62 = ""
10040100-63 = ""
10040100-64 = ""
10040100-65 = ""
10040100-66 = "...Вице-президент, эм... у того пришельца HP... уже ноль...?"
10040100-67 = "Фуфу. Не ожидала, что это окажется таким хорошим способом снять стресс."
10040100-68 = "А? Кажется, я победила всех врагов в этой комнате. Маки, где следующий?"
10040100-69 = "Следующий враг... в комнате справа."
10040100-70 = ""
10040100-72 = ""
10040100-73 = ""
10040100-75 = "Чихиро дольше всех проходила этап, потому что продолжала избивать врагов одними кулаками..."
10040100-76 = "Участницы Веритас, включая Маки, поклялись какое-то время не злить Чихиро."
