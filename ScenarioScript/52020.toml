[translation]
52020-1 = "Эпизод 2;Новая история о призраках"
52020-7 = ""
52020-8 = "...Хорошему настою нужно время."
52020-9 = "Эта тишина уже застоялась. Неужели я слышу, как за стенами шуршит маленькая змейка?"
52020-10 = ""
52020-14 = "Как всегда, вы изысканны, госпожа Кокурико."
52020-17 = ""
52020-18 = "А тебя... давно не было."
52020-19 = "Боюсь, я была занята. Видите ли, госпожа, я целиком погрузилась в создание новой истории."
52020-20 = "Ах... далеко продвинулась? Эта история будет нарастать? Томиться и медленно заползать в сердца всех, кто её прочтёт?"
52020-21 = "Я нацелилась на нечто чуть более... впечатляющее. Слова требуют воображения и внимания, а хорошо созданный образ мгновенно захватывает разум."
52020-22 = "А, да. Понимаю, ты считаешь себя настоящей художницей."
52020-23 = "Но помни: истинно изысканная красота расцветает естественно и в своём темпе. Как времена года — её нельзя торопить."
52020-24 = ""
52020-26 = ""
52020-27 = "Именно..."
52020-28 = "К слову, я слышала, цветок, который ты посадила, почти готов распуститься."
52020-29 = "Правда? Боже, как летит время!"
52020-30 = "Прекрасно. Не могу дождаться, когда прижму эти изящные лепестки к страницам «Фантомных иллюстраций Тоутэй». Вот ЭТО будет история на века."
52020-31 = "Отличная работа. Скоро мы закончим свои истории и наконец... найдём наш дом."
52020-32 = ""
52020-34 = ""
52020-35 = "И когда мы будем пировать в Сумеречном храме, дорогая, я прослежу, чтобы ты сидела рядом со мной."
52020-36 = "Для меня будет честью, госпожа Кокурико."
52020-39 = "Я знаю. Но перейдём к более практичным вопросам: где Сюро?"
52020-40 = "Она исчезла после того огненного фестиваля... Боюсь, сидит где-то и дуется."
52020-41 = "Не переживайте, госпожа Кокурико. Сюро совершенно здорова... насколько это вообще применимо к ней."
52020-42 = "Она всё ещё неустанно трудится, чтобы исполнить ваше желание."
52020-43 = "Как и все мы. «Красота природы» намерена закончить новые «Сто историй о призраках». Скоро пылающая изысканность, которой вы желали, будет завершена."
52020-44 = "Как приятно иметь прилежных работников."
52020-45 = "Когда в следующий раз увидишь маленькую Сюро, передай ей мои наилучшие пожелания."
52020-46 = "Как пожелаете."
52020-54 = ""
52020-55 = "Нагуса-а—"
52020-56 = "Нагуса-а-а-а-а—"
52020-57 = ""
52020-63 = "Эта бесполезная вдохновляющая идиотка испортила мою историю! Она была идеальна!"
52020-64 = "Она должна была развалиться на части. И тогда не было бы никакого Хяккарёран, никакого тупого Сотни Лотосов и никакой надежды против моего прекрасного, изысканного, идеально разъярённого Каташиро!"
52020-65 = "Это должна была быть трагедия на века! Они должны были сломаться и захлебнуться в безнадёжности!"
52020-66 = "...Где история свернула не туда?"
52020-67 = "Может, всё из-за этого слюнявого Сенсея с его бредом про силу дружбы? Именно он дал трещину моему творению. Ух!"
52020-68 = "Гр-р... Во всём виновата эта тупая девчонка! Она не понимала ни изысканности, ни повествовательного ритма, и финал был испорчен! Всё впустую!"
52020-69 = "А потом, ПОТОМ, я потеряла драгоценный том, который дала мне госпожа Кокурико..."
52020-70 = "Ух! Ненавижу тебя, Нагуса-а-а—! Слышишь меня?!"
52020-71 = ""
52020-75 = "Опять монолог, дорогая Сюи?"
52020-76 = "Я понимаю, у всех свои способы... справляться, но если продолжишь так размахивать руками, разрушишь это святилище."
52020-77 = ""
52020-79 = ""
52020-80 = "...Что? Тоже хочешь меня дразнить? Выплюнуть свой яд?"
52020-81 = "Вовсе нет. Я здесь лишь потому, что... по-дружески беспокоюсь."
52020-82 = "...И чтобы передать сообщение госпожи Кокурико."
52020-83 = ""
52020-85 = ""
52020-86 = "...Госпожи Кокурико? Она... она спрашивала обо мне?"
52020-87 = "Госпожа Кокурико хочет меня? НУЖДАЕТСЯ во мне?"
52020-88 = "Вижу, провал тебя ничему не научил, Сюи."
52020-89 = "Подумать только, госпожа Кокурико всё ещё хочет тебя видеть после такого провала. Ц."
52020-90 = "Ух...!"
52020-91 = "Она совершенно справедливо потеряла в тебя веру. Сомневается в твоих и без того ограниченных способностях."
52020-92 = "Она сказала: если скоро не создашь новую историю о призраках, отправишься в мир духов. Там хотя бы будешь вести себя тихо."
52020-93 = ""
52020-96 = ""
52020-97 = "Э-Этого не случится. Не-а. Госпожа Кокурико всегда меня поддерживает!"
52020-98 = "Даже после прошлого раза она сказала не переживать из-за—"
52020-99 = "Если после того, как ты испортила драгоценный том и сбежала, тебя всё ещё ничто не тревожит... боюсь, надежды на тебя нет."
52020-100 = "Или... возможно, госпожа Кокурико настолько разочаровалась в твоём поведении, что ей уже вообще всё равно, что ты делаешь."
52020-101 = ""
52020-104 = ""
52020-105 = "Нет... Только не это!"
52020-106 = "Что мне делать? Как вернуть её доверие?"
52020-107 = "Не тревожься. Я пришла помочь."
52020-108 = ""
52020-110 = ""
52020-111 = "Сюро, вот твой второй шанс."
52020-112 = ""
52020-114 = ""
52020-115 = ""
52020-117 = ""
52020-118 = "Это... «Фантомные иллюстрации Тоутэй»?"
52020-119 = "Да. Последний оставшийся том «Красоты природы». Красивый, правда?"
52020-120 = "Изначально у «Красоты природы» была троица томов."
52020-123 = "Один госпожа Кокурико потеряла на Великом снежном поле двадцать лет назад."
52020-124 = "Ты, если вдруг забыла, повредила второй, когда в панике бежала из Хяккияко."
52020-125 = "А «Фантомные иллюстрации»... последний. Я очень долго хранила его в безопасности."
52020-126 = "Если твои «Фантомные записи Ино» были сосредоточены на воплощении смертных желаний в реальность, то «Фантомные иллюстрации Тоутэй» действуют прямее. Они пробуждают страх."
52020-127 = "Ну что скажешь, Сюро?"
52020-128 = "Если готова, я буду лапочкой и одолжу тебе свой драгоценный том."
52020-129 = ""
52020-134 = ""
52020-136 = "Представь, какой ужас ты сможешь вызвать. Какие Фантомные сказания воплотить..."
52020-137 = "...какой недавно возрождённый совет уничтожить... если, конечно, снова всё не запорешь."
52020-138 = ""
52020-140 = ""
52020-141 = ""
52020-142 = "Да. Я могу всё это сделать..."
52020-143 = "Пока у меня есть том, я могу создавать истории о призраках."
52020-144 = ""
52020-146 = ""
52020-147 = "Я создам незабываемый кошмар бесконечного ужаса!"
52020-148 = "Вот это настрой, Сюи."
52020-149 = ""
52020-151 = ""
52020-152 = "Всё будет завершено."
52020-154 = "И твоя история о призраках... и моя."
52020-156 = "Следующий эпизод;Новый фестиваль"
