[translation]
52020-1 = "Episódio 2;Um Novo Conto Macabro"
52020-8 = "...Um talo de chá em pé."
52020-9 = "Então... que bons ventos te trazem hoje?"
52020-14 = "Há quanto tempo, Senhora Kokuriko."
52020-18 = "Quanto tempo faz desde a última vez que vi esse rosto, hein?"
52020-19 = "Hehe... acabei me deixando levar pela escrita."
52020-20 = "...Conseguiu escrever uma história capaz de arrebatar o coração de todos?"
52020-21 = "Ver para crer.#nContar com minhas próprias palavras seria deselegante, não acha?"
52020-22 = "É mesmo?#nAcredito conhecer muito bem o seu talento como \"Artista do Macabro\"."
52020-23 = "Mas... a verdadeira elegância#nbrota naturalmente no coração das pessoas, como as cerejeiras que anunciam a primavera.#n...Tenha isso em mente."
52020-27 = "...Sim."
52020-28 = "A \"semente\" que recebi outro dia criou raízes sem problemas.#nO dia em que os botões irão desabrochar não deve estar longe."
52020-29 = "Oh, já estamos nessa época?"
52020-30 = "Se unida ao \"Toutei Bukkairoku\", certamente revelará uma cena de pura elegância.#nE servirá de alicerce para reduzir este mundo a cinzas..."
52020-31 = "Bom trabalho.#nAssim se tece o Hyakumonogatari, alcançando a outra margem...#nNão é maravilhoso?"
52020-35 = "No dia em que fizermos um grande banquete no templo do Crepúsculo,#nacho que vou reservar um lugar de confidente para você."
52020-36 = "Sinto-me profundamente honrada."
52020-39 = "...A propósito, você sabe onde está a Shuro?"
52020-40 = "Ela não apareceu mais desde aquele incidente...#nFico preocupada que esteja emburrada em algum canto."
52020-41 = "Não se preocupe. A Shuro está bem."
52020-42 = "Mesmo agora, ela está se dedicando de corpo e alma para realizar o desejo mais profundo da Senhora Kokuriko."
52020-43 = "— Em breve, a verdadeira elegância estará completa."
52020-44 = "Isso é esplêndido."
52020-45 = "Quando a vir, dê uma palavrinha com ela por mim."
52020-46 = "Como desejar."
52020-55 = "Nagu... sa...!"
52020-56 = "Nagusa, Nagusa, Nagusa, Nagusa-chaaan!!"
52020-63 = "A minha história tão perfeitinhaaa... foi arruinada por culpa daquela idiota!"
52020-64 = "Sem a sucessora da \"Hyakuren\", o Hyakkaryouran#ndeveria ter apenas fugido de medo!"
52020-65 = "Era para eu ver uma tragédia patética#nde gente só lamentando a própria impotência...!"
52020-66 = "Onde foi que deu tudo errado...?"
52020-67 = "Quando o Sensei da Schale começou com aquelas baboseiras metidas a espertas?#nQuando a Efígie Sem Rosto rachou?"
52020-68 = "Aaaah...! É tudo culpa da Nagusa-chan!#nPor culpa daquele bando que não entende a elegância, tuuudo, tudo foi por água abaixo!"
52020-69 = "E até o \"Inou Mononokeroku\" tão, tão precioso#nque a Se-Senhora Kokuriko me deu... sumiu..."
52020-70 = "Uuuugh...! Eu não vou perdoar...! Nagusa-chaaan!!!"
52020-75 = "Ora, ora, descontando a raiva num lugar desses?#nShuro-chan."
52020-76 = "Fique à vontade para fazer escândalo... mas pegue leve."
52020-80 = "Você também veio tirar sarro de mim...?"
52020-81 = "De jeito nenhum. Estou preocupada com você... que crueldade."
52020-82 = "Ah, é mesmo.#nQuer ouvir o recado da Senhora Kokuriko?"
52020-86 = "...Senhora Kokuriko? A Senhora Kokuriko estava me procurando?!"
52020-87 = "Ela ainda precisa de mim, não é?"
52020-88 = "Mesmo depois de fracassar, você continua bem arrogante, hein?"
52020-89 = "Depois de fazer aquela besteira toda,#nachou mesmo que a Senhora Kokuriko continuaria sendo gentil com você?"
52020-90 = "Ugh...!"
52020-91 = "Naquele dia, você traiu as expectativas da Senhora Kokuriko."
52020-92 = "Trate de criar logo o próximo conto macabro.#nA próxima a ser jogada no Crepúsculo pode ser você, sabia?"
52020-97 = "M-Mentira!#nA Senhora Kokuriko sempre acreditou em mim..."
52020-98 = "Até sobre o que aconteceu outro dia, ela disse para não me preocupar —"
52020-99 = "Arruinou um livro macabro precioso.#nE mesmo assim está aqui fazendo birra tranquilamente.#n...Então, qual é o seu valor agora?"
52020-100 = "...Ah, espera.#nVocê está sendo deixada de lado justamente porque não tem mais valor, né?"
52020-105 = "Não... só isso não!"
52020-106 = "O-O que eu faço...?!#nComo posso corresponder às expectativas da Senhora Kokuriko...?"
52020-107 = "Hehe, fique tranquila. Eu vim justamente para ajudar você."
52020-111 = "Shuro — vou te dar uma chance."
52020-118 = "Isso é... o \"Toutei Bukkairoku\"?"
52020-119 = "Sim, o último exemplar restante do Clube Beleza da Natureza."
52020-120 = "— O Clube Beleza da Natureza possuía três livros macabros."
52020-123 = "Um que a Senhora Kokuriko perdeu há 20 anos, na Grande Planície Nevada."
52020-124 = "Um que você arruinou em Hyakkiyako."
52020-125 = "E o último — o \"Toutei Bukkairoku\", que estava sob minha guarda."
52020-126 = "Se o seu \"Inou Mononokeroku\" reflete o desejo humano neste mundo,#neste \"Toutei Bukkairoku\" dá forma ao medo."
52020-127 = "O que acha?"
52020-128 = "Só desta vez, vou emprestar este Toutei Bukkairoku para você."
52020-136 = "Dê forma ao medo de todos e encurrale-os com o Hyakumonogatari Fantasmagórico... simples, não é?"
52020-137 = "Você poderá até consumar sua vingança contra o Hyakkaryouran."
52020-142 = "É verdade... eu consigo."
52020-143 = "...Com isso, poderei tecer contos macabros mais uma vez."
52020-147 = "Desta vez, vou mostrar a eles o verdadeiro pesadelo do Hyakumonogatari!!"
52020-148 = "É assim que se fala, Shuro-chan."
52020-152 = "Com certeza, agora ele ficará completo."
52020-154 = "— O seu, e também o meu Hyakumonogatari."
52020-156 = "Próximo;Um Novo Festival"
