[translation]
1000605-1 = "Тайная сделка"
1000605-2 = "Чёрный рынок"
1000605-4 = "О, наконец-то пришёл."
1000605-5 = "Я так и думал, что однажды увижу знаменитого Сенсея из Шале на Чёрном рынке."
1000605-6 = "Наверняка многие удивились бы, узнав, что ты интересуешься такими вещами. Внешность бывает обманчива, да?"
1000605-7 = "[s] «Товар у тебя?»"
1000605-8 = "Разумеется. На Чёрном рынке есть всё."
1000605-9 = "Мы достанем всё, чего пожелает душа! Пока есть деньги..."
1000605-10 = "[s] Провести сделку с торговцем Чёрного рынка."
1000605-12 = "Позвольте уточнить цену..."
1000605-14 = ""
1000605-16 = "Стоять, ублюдок!"
1000605-17 = "Что? Что здесь делает префект Геенны?"
1000605-18 = "Приятно было иметь дело. Бывай!"
1000605-20 = "Эй! Стой, контрабандист!"
1000605-23 = ""
1000605-24 = "Чёрт... Ушёл. Зато одного мы всё-таки поймали."
1000605-25 = ""
1000605-26 = ""
1000605-27 = "...Сенсей?"
1000605-28 = "Что ты делаешь в таком месте...? И главное, что ты покупал у этого контрабандиста?"
1000605-29 = "[s1] «Ты всё неправильно поняла.»\n[s2] «Я не могу тебе сказать.»"
1000605-30 = "Ты вечно что-то скрываешь..."
1000605-31 = "Ты вечно что-то скрываешь..."
1000605-32 = "Жалкое зрелище."
1000605-33 = "Неважно. Я не могу отпустить преступника без наказания. Отдай контрабанду."
1000605-34 = "[s3] Настаивать, что нельзя ей это отдавать.\n[s4] Сделать невинный вид."
1000605-35 = "Хватит вести себя как ребёнок и отдай мне!"
1000605-36 = "Не прикидывайся дурачком! Отдай!"
1000605-38 = "Иори выхватила у меня то, что я получил от торговца."
1000605-39 = "Фотоальбом...? Погоди, это мой школьный альбом из начальной школы!"
1000605-40 = "Что ты с ним делаешь?"
1000605-41 = "[s5] «Я не хотел, чтобы твой школьный альбом попал в общий доступ...»\n[s6] «Он нужен мне для одного дела Шале...»"
1000605-42 = "Не ври! Ты собирался использовать его для чего-то неприличного!"
1000605-43 = "Не ври! Ты собирался использовать его для чего-то неприличного!"
1000605-44 = "Ты... Ты извращенец!"
1000605-46 = "Иори ещё какое-то время меня отчитывала, но в конце концов мне удалось забрать у неё альбом."
