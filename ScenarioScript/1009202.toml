[translation]
1009202-1 = "Чувство стиля"
1009202-2 = "Получив сообщение от Ёшими, я пришёл в торговый центр к назначенному времени."
1009202-7 = ""
1009202-8 = "Наряды важны. Так что не валяйте дурака, Сенсей."
1009202-9 = "Если выберете какой-нибудь странный костюм животного, бикини или что-то такое, я заставлю вас пожалеть. Поняли?"
1009202-10 = "[s1] «О... ты меня провоцируешь?»\n[s2] «После таких слов мне как раз хочется это сделать.»"
1009202-13 = "Не в этом дело! Если я заранее не запрещу, вы ведь обязательно что-нибудь такое протащите!"
1009202-14 = "...*вздох* Да, сама виновата, что подала вам идею."
1009202-15 = ""
1009202-17 = ""
1009202-18 = "Выбирать буду я, а вы просто давайте отзыв. Так надёжнее."
1009202-22 = ""
1009202-23 = "Сначала куртка."
1009202-24 = "А дальше... Посмотрим..."
1009202-25 = ""
1009202-27 = ""
1009202-28 = ""
1009202-29 = "Мы хотим придерживаться общей темы, так что юбки и обувь по возможности тоже должны сочетаться. Было бы красиво сохранить один дизайн, немного меняя цвета."
1009202-30 = "Для футболки... пока поставим заглушку. Когда появится логотип группы, разместим его там."
1009202-31 = "И потом... эм... аксессуары..."
1009202-32 = ""
1009202-34 = ""
1009202-35 = "...Хм? Что?"
1009202-36 = "...Когда это моё чувство стиля стало лучше?"
1009202-37 = "Хи-хи-хи. Ну, понимаете..."
1009202-38 = ""
1009202-40 = ""
1009202-41 = ""
1009202-42 = "Стоп, что это вообще ЗНАЧИТ, Сенсей?"
1009202-43 = "Вы хотите сказать, раньше оно было плохим?"
1009202-44 = "Послушайте, Сенсей, оно всегда было хорошим и всегда таким и было."
1009202-45 = "Я плохо умею что-то мастерить, но это вообще отдельная тема, ясно?"
1009202-46 = "К тому же я единственная в группе, кто вообще серьёзно относится к «дизайну»."
1009202-47 = "...Хм? Что?"
1009202-48 = "Почему я не позвала остальных? Потому что..."
1009202-49 = "...Эм... Это..."
1009202-50 = "[ns3] «Прости. Я не понял атмосферу и задал неуместный вопрос?»\n[ns4] «Если не хочешь отвечать, не обязана.»"
1009202-51 = ""
1009202-52 = ""
1009202-54 = ""
1009202-55 = ""
1009202-56 = "Серьёзно, что мне вообще с вами делать?"
1009202-57 = "Ургх! Я знала, что вы рано или поздно это скажете! Ну хоть раз нельзя было пропустить? Ни разу!"
1009202-58 = "Всё совсем не так! Ну, не СОВСЕМ не так, но это не главная причина!"
1009202-59 = ""
1009202-61 = ""
1009202-62 = "Главная причина... Эм..."
1009202-63 = ""
1009202-65 = ""
1009202-66 = "*вздыхает*"
1009202-67 = "[s5] «Вдруг такой вздох?»\n[s6] «Если так вздыхать, воздуха не останется.»"
1009202-71 = ""
1009202-72 = "Вы вообще ничего не понимаете, Сенсей."
1009202-73 = "Дело не в том, что я их не позвала. Мне не стоило их звать."
1009202-74 = "Если бы я оставила дизайн на остальных..."
1009202-75 = "...это была бы катастрофа, понимаете...?"
1009202-76 = "Что я имею в виду? Хотите, чтобы я прямо сказала?"
1009202-77 = "Сенсей, вы же не хотите увидеть..."
1009202-78 = ""
1009202-80 = ""
1009202-81 = "...что-нибудь вроде «Моды четвёртого измерения», «Мятно-белой спам-моды» или «Бандитского стиля», правда?"
1009202-82 = ""
1009202-85 = "[ns7] «...»\n[ns8] «...Ага...»"
1009202-88 = "[ns9] «Вот оно как... Понятно...»\n[ns10] «Хорошо, что их рядом нет и они этого не слышат.»"
1009202-91 = "Ну, как есть. Я специально сказала им не приходить сюда до того, как сама пришла встретиться с вами."
1009202-92 = "А вот вас я хотя бы хочу взять с собой и показать всё."
1009202-93 = ""
1009202-95 = ""
1009202-96 = "В общем, вот так. Теперь насчёт сочетания этого комплекта..."
1009202-99 = ""
1009202-101 = ""
1009202-103 = ""
1009202-104 = ""
1009202-107 = "Хм..."
1009202-108 = "...Хорошо? Думаете, так подойдёт...?"
1009202-109 = "[s11] «По-моему, уже получается.»\n[s12] «Может, посмотрим на весь образ целиком?»"
1009202-112 = "...Хм. Думаете?"
1009202-113 = "Хорошо, значит наряды остальных будут примерно совпадать с моим."
1009202-114 = ""
1009202-116 = ""
1009202-117 = "И раз уж об этом..."
1009202-118 = "Подождите здесь. Я пойду переоденусь."
1009202-119 = ""
1009202-121 = ""
1009202-126 = ""
1009202-127 = "...Хм."
1009202-128 = "Так вот как это ощущается..."
1009202-129 = "К-Как вам? Это... Эм..."
1009202-130 = "Я... к-красивая?"
1009202-131 = "И если вы собираетесь сказать что-нибудь странное: не надо."
1009202-132 = "[ns13] «Сплошная милота.»\n[ns14] «Тебе вообще не о чем переживать.»"
1009202-133 = "Д-Да? Ну, тогда хорошо."
1009202-134 = ""
1009202-136 = ""
1009202-137 = "Есть одна деталь, о которой вы не спросили, так что, может, не заметили..."
1009202-138 = "Он мне великоват. Но, по-моему, в этом как раз и есть часть очарования наряда."
1009202-139 = ""
1009202-141 = ""
1009202-142 = ""
1009202-143 = "...Хм-м..."
1009202-144 = "Хорошо. Остановимся на этом. Да, будет отлично. Те же линии, другой цвет."
1009202-145 = "Но если я куплю все четыре полных комплекта, одной мне может быть тяжеловато их нести..."
1009202-146 = ""
1009202-148 = ""
1009202-149 = ""
1009202-150 = "...А? Сенсей, что вы только что сказали?"
1009202-151 = "Вы понесёте их... за меня?"
1009202-152 = "[s15] «Вообще-то именно поэтому я сюда и пришёл.»\n[s16] «Тяжести — работа взрослого.»"
1009202-155 = "Ч-Что...?"
1009202-156 = "П-Правда...? Я-Я об этом даже не подумала."
1009202-157 = "Вы уверены? Там будет правда тяжело..."
1009202-158 = ""
1009202-162 = "[ns17] Взять сумку.\n[ns18] «Пойдём! К кассе!»"
1009202-163 = ""
1009202-164 = ""
1009202-166 = ""
1009202-167 = "А, С-Сенсей!"
1009202-168 = ""
1009202-170 = ""
1009202-171 = "Сенсей, подождите...! Подождите меня...!"
1009202-172 = ""
1009202-174 = ""
1009202-176 = "Мы всё купили, и я понёс сумки за неё."
