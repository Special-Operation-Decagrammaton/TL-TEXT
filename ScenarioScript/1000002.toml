[translation]
1000002-1 = "Как мотивировать работников"
1000002-2 = "Хе-хе-хе. Итак, Сенсей..."
1000002-3 = "Если бы я предложила тебе награду за работу, чего бы ты захотел?"
1000002-4 = "[s1] «Золотой слиток.»\n[s2] «Пожалуйста, один раз погладь меня по голове.»"
1000002-5 = "Это лучшее, что ты смог придумать?!"
1000002-6 = "Почему бы не попросить что-нибудь более... роскошное?"
1000002-7 = "Угх. Ты хочешь, чтобы я погладила тебя по голове?!"
1000002-8 = "Ты же не серьёзно."
1000002-9 = "Ты правда этого хочешь...? Знаешь, я могу дать тебе что угодно."
1000002-11 = "[s] «Тогда как насчёт поцелуя в щёку?»"
1000002-12 = "П-поцелуя... в щёку?!"
1000002-13 = "Ни за что. Да, у нас хорошие рабочие отношения, но для такого ещё слишком рано!"
1000002-14 = "Наш первый поцелуй должен быть в романтическом ресторане с видом на ночное небо..."
1000002-15 = "[s] «Тогда всё-таки возьму золотой слиток.»"
1000002-16 = "(Ты меня дразнишь, Сенсей?!)"
1000002-19 = "*вздох* Голова болит."
1000002-20 = "Отнесись к этому серьёзно, Сенсей. Награда должна соответствовать твоей работе."
1000002-21 = "Как иначе мне поддерживать мотивацию моих маленьких рабочих пчёл?"
1000002-22 = "[s] «Ты всегда упряма в таких вещах.»"
1000002-23 = "Хе-хе. Если я хочу, чтобы у меня работали лучшие, я сама должна быть лучшим начальником."
1000002-24 = "Любой великий лидер знает, что нужно подавать пример."
1000002-25 = "Мои сотрудники будут поражены моим великолепным лидерством. Хахаха!"
1000002-26 = "[s] «Ну, если настаиваешь. Есть кое-что, чего я хочу.»"
1000002-27 = "Хм?"
1000002-29 = "Сладкий куб"
1000002-30 = "Ты хочешь... чтобы мы вместе съели парфе?"
1000002-31 = "Ты уверен, что именно такую награду хочешь, Сенсей?"
1000002-32 = "[s] «Важно, чтобы мы съели его вместе, Ару.»"
1000002-33 = "П-Почему так важно есть его именно со мной...?"
1000002-34 = "Х-Хмф... Ну, если ты так говоришь."
1000002-35 = "Только потом не передумай и не попроси чего-нибудь ещё, понял?"
1000002-36 = "Так, какое парфе ты заказал?"
1000002-37 = ""
1000002-38 = ""
1000002-42 = "Ваш заказ: специальное трёхъярусное гигантское парфе для пар! Приступайте и покорите бесконечную гору сливок!"
1000002-43 = "Ч-Челлендж? Что это значит?"
1000002-44 = "[s] «Если съедим всё за 20 минут, оно бесплатно.»"
1000002-45 = "Мы должны съесть всё целиком за ограниченное время...?"
1000002-46 = "Хе. Очень на тебя похоже, Сенсей."
1000002-47 = "Выбирать самый выгодный вариант даже тогда, когда это вроде бы твоя награда..."
1000002-48 = "Вот почему тебе стоит стать консультантом Решатели проблем 68 по управлению!"
1000002-49 = "[s] «Консультантом по управлению?»"
1000002-50 = "Ладно, хватит разговоров! Вызов принят!"
1000002-51 = "Едим, Сенсей!"
1000002-52 = "Ням-ням."
1000002-53 = ""
1000002-55 = "(Погоди-ка...)"
1000002-56 = "(Это вообще-то парфе для пар?!)"
1000002-57 = "(Ты не упомянул эту часть, Сенсей!)"
1000002-58 = "(Х-Хмф!)"
1000002-59 = "(О чём я думаю? Д-Для меня это должно быть легко...)"
1000002-60 = "(Надеюсь, Сенсей не заметил, что я смутилась!)"
