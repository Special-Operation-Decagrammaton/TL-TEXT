[translation]
90102050-1 = "Episode 5;The Ranks and the Execs"
90102050-5 = "Do you have a moment?#nI'm with Highlander Railway Academy."
90102050-6 = "W-Well, I have a proper ticket, you know!?"
90102050-7 = "Ah, no, I'm not here to check tickets..."
90102050-9 = "Rest assured. #nWe're not station staff here, but members of Highlander Railway Academy's Central Control Center, the CCC."
90102050-10 = "We're currently conducting a customer satisfaction survey."
90102050-11 = "We plan to actively use your feedback for improvements, so please share your honest opinions!"
90102050-12 = "Opinions..."
90102050-13 = "If I answer honestly... you're not going to throw me onto the tracks, right?"
90102050-14 = "Of course we aren't!?"
90102050-15 = "(Why are Highlander students always so feared by the passengers...)"
90102050-16 = "Well, as for the crew members... I feel like they're a bit unfriendly."
90102050-17 = "Not all of them, mind you.#nOn the older lines, though, they treat passengers like Correction Bureau prisoners."
90102050-18 = "If you look even slightly suspicious, they pull out their guns right away, you know?"
90102050-19 = "That's troubling..."
90102050-20 = "We sincerely apologize for making you feel uncomfortable."
90102050-21 = "To prevent this from happening again, could you share the specific details with us?"
90102050-22 = "Well, last week, I suppose."
90102050-23 = "I was working overtime, so I got to the platform right at the last train."
90102050-24 = "And then the doors started closing right in front of me."
90102050-25 = "When I instinctively stuck my umbrella in, the station staff pointed a gun at me and told me to get away from the train!?"
90102050-26 = "It wouldn't hurt them to just open the door for a second, what cheapskates—"
90102050-30 = "Whoa!?#nDidn't you say I could speak honestly!"
90102050-31 = "Pardon me. Just a slip of the tongue."
90102050-32 = "I understand how you feel, but..."
90102050-33 = "Please refrain from jamming umbrellas in the doors, as it causes malfunctions and accidents."
90102050-34 = "Tch... So inflexible."
90102050-38 = "W-It's nothing!"
90102050-39 = "Anything else?"
90102050-40 = "For example, have you seen any trains not listed on the timetable..."
90102050-41 = "No, nothing like that.#nHighlander is strict about time, so I have no complaints there."
90102050-42 = "Though I do occasionally see them speeding by at absurd velocities."
90102050-43 = "I see... Thank you for cooperating with our survey."
90102050-44 = "As a token of our gratitude... Here's a live grenade with the safety pin pulled!"
90102050-50 = "W-W-Wait, wait, wait, what are you expecting me to do with this!"
90102050-51 = "You can't just hand someone something like this—"
90102050-52 = "It'll explode if you let go of the safety lever, so hold on tight, okay?"
90102050-57 = "It's true what they say about Highlander executives being totally unhinged..."
90102050-58 = "I shouldn't have answered honestly if I knew this would happen!"
90102050-60 = "(After that, Otogi and Kurumi continued gathering information from citizens...)"
90102050-64 = "This is FOX 1.#nFOX 3, FOX 4. Did you turn up any new intel?"
90102050-65 = "FOX 3 here. Nothiiing. Total bust."
90102050-66 = "It's no different from what's online... And more importantly, not a single person has seen that train."
90102050-67 = "Everyone's just complaining about Highlander's service."
90102050-68 = "Though a lot of the passengers' complaints sound like their own fault."
90102050-69 = "Like fare evasion, or shady peddlers starting up business inside the cars..."
90102050-70 = "Why is it that trains attract weirdos so much more easily than other transit?"
90102050-71 = "Probably just because they have that many more users."
90102050-72 = "This is FOX 2.#nWhile FOX 3 and FOX 4 were doing interviews, I checked the security cameras that were cut off during the incident."
90102050-73 = "There was no structure allowing external hacks, and#nwe found no anomalies other than some aged circuitry."
90102050-74 = "Turns out the recording being down at that exact time might have just been a coincidence after all."
90102050-75 = "True, the possibility of a coincidence can't be ruled out.#nEven so, we must consider how overly convenient the circumstances were for the culprit."
90102050-76 = "...Any longer and the station staff will get suspicious. Head to the station office soon."
90102050-77 = "FOX 3, FOX 4.#nContinue interviewing the target while making sure not to blow your cover."
90102050-78 = "Understood!"
90102050-80 = "Kawanishi Station - Station Office"
90102050-82 = "W-Welcome! We're so glad to have you!"
90102050-83 = "To what do we owe the pleasure today...?"
90102050-87 = "Oh, you don't need to be so nervous. Drop your shoulders and relax."
90102050-88 = "Like I told the kid earlier, we just happened to be passing by."
90102050-89 = "That's right. Just thought we'd check in and see if you're having any trouble."
90102050-90 = "I-Is that so..."
90102050-91 = "Please, take a seat for now."
90102050-92 = "If we'd known ahead of time you were coming, we would have prepared some tea snacks...#nI apologize, but we only have cheap tea bags."
90102050-93 = "This is plenty."
90102050-94 = "I'm not really in the mood to eat sweets anyway."
90102050-95 = "We can talk just fine without tea snacks."
90102050-96 = "..."
90102050-97 = "Well then, let's get down to business."
90102050-98 = "Um, the number of trains passing through Kawanishi Station is...#nWhoa, across all lines, that's nearly a thousand trains a day!"
90102050-99 = "...Wait, does that mean about one train every single minute?"
90102050-100 = "Managing all that while handling station upkeep and everything else... That sounds rough.#nThanks for your hard work every day."
90102050-101 = "Th-That is too kind of you..."
90102050-102 = "Still, with you being this busy, there must be times when things slip through the cracks, right?"
90102050-103 = "Eh? What do you mean by that...?"
90102050-104 = "You're dizzyingly busy, yet your staffing is kept to the bare minimum."
90102050-105 = "Doesn't that mean there are times when an unlisted train passes through and nobody notices?#nHow about it?"
90102050-106 = "I don't think so.#nIf we're talking about visual checks, it's true we can't watch every single platform..."
90102050-107 = "Train operations are entirely managed by our system.#nThere is absolutely no way an unscheduled train could enter the platform—"
90102050-108 = "Now, now, I'm not blaming the station staff or anything."
90102050-109 = "If you're busy, you can just be honest and say you're busy.#nWho knows, maybe higher-ups would increase your staff?"
90102050-114 = "...Pardon me for a moment."
90102050-118 = "If you don't mind, could I see both of your IDs?"
90102050-119 = "Why all of a sudden...?"
90102050-120 = "...Something feels off."
90102050-121 = "It felt strange the moment you showed up without notice, but#nyour vibe is completely different from the executives I know."
90102050-122 = "Far from barging into the station office to sponge off snacks or push chores onto us—"
90102050-123 = "For the CCC to start worrying about frontline conditions... No matter how you look at it, it's unnatural.#n\"We have enough staff\" used to be your catchphrase."
90102050-124 = "I'm just going to cross-check your IDs with the academy's internal network. It won't take long."
90102050-125 = "This is just a precaution, so please forgive me."
90102050-126 = "To think we'd get suspected over something like this..."
90102050-127 = "I have an ID, but the moment it gets checked against the database, we'll be exposed as fakes instantly..."
90102050-128 = "Should we move to Plan B?"
90102050-129 = "...No, wait a second. I have an idea."
90102050-130 = "Of course I'll cooperate."
90102050-131 = "Umm, now where did I put my ID...?"
90102050-136 = "Come to think of it, I was talking with a customer on the platform."
90102050-137 = "Ah, yes."
90102050-138 = "Is it true that a passenger jammed an umbrella in the door and caused a fuss?"
90102050-139 = "Ah, something like that did happen.#nOur station staff pulled it out, so it didn't turn into a major issue, but..."
90102050-140 = "And? It departed right on schedule, exactly as planned, didn't it?"
90102050-141 = "Th-That is..."
90102050-142 = "Surely you didn't let such a trivial little trouble cause a delay, did you?"
90102050-143 = "On-time operation is the bedrock of what we do. It guarantees customer convenience and supports our rolling stock efficiency.#nAn irresponsible situation where we couldn't depart on schedule didn't happen, right?"
90102050-144 = "Umm... I suppose I'd need to check that day's logs."
90102050-145 = "N-No, there's no need to go that far..."
90102050-146 = "Why's that?#nAs the station master said, double-checking just in case is important, isn't it?"
90102050-147 = "The station master seems meticulous, so of course you understand, right?"
90102050-152 = "(Sigh... Talk about poking a sleeping snake...)"
90102050-153 = "(These two... without a doubt, they're CCC executives...!)"
90102050-154 = "(Now that I think about it, I heard the CCC executives have a pair of remarkably nasty, pint-sized brats...)"
90102050-155 = "(...Could it be these two?)"
90102050-156 = "...I-I am so sorry!#nI didn't realize you were executives and made a rude request."
90102050-157 = "Your IDs... won't be necessary."
90102050-158 = "Really?#nGlad we didn't have to deal with the hassle~"
90102050-159 = "(Phew... That was bad for my heart...)"
90102050-161 = "As you said, D.U.'s railway control is managed via network#nin cooperation with the Traffic Office."
90102050-162 = "Because of that, unscheduled trains basically never enter the system...#nThough recently, I've caught wind of a rather concerning rumor."
90102050-166 = "Are you familiar with the Broker of Greed?#nHe's a notorious figure among the Seven Prisoners, originating from Highlander Railway Academy."
90102050-168 = "Of course we know him!"
90102050-169 = "Do you have any idea how many trains we had to transfer between to catch that guy—"
90102050-170 = "Eh? You caught the Broker of Greed?"
90102050-171 = "Ah, pay it no mind. That was back when I was in the Railway Safety Department, RSD."
90102050-172 = "More importantly, why are you suddenly bringing up the Broker of Greed?"
90102050-173 = "It's only a rumor, but... the Broker of Greed has apparently resumed his activities."
90102050-174 = "Lately on social media, there have been scattered posts about people seeing an unfamiliar train late at night."
90102050-175 = "Given that the Broker of Greed is a former CCC executive, he's well-versed in train control systems.#nAnd his driving skills are quite exceptional, too."
90102050-176 = "Slipping trains into gaps in the timetable to disguise their destinations#nwas always the Broker of Greed's signature modus operandi."
90102050-177 = "...That's it!"
90102050-178 = "Pardon?"
90102050-179 = "Thanks. Because of you, we got our hands on some solid intel."
90102050-180 = "This might give us the outline of the case."
90102050-181 = "FOX 4—no, Otogi. Let's head back quickly and share this."
90102050-182 = "I'm glad I could be of help, but... an \"incident\"?"
90102050-183 = "That mysterious train that appears late at night... does it actually exist...?"
90102050-184 = "Oh, just in case."
90102050-185 = "What happened today. Don't you dare talk about this to the other station staff, let alone any other CCC executives, got it?"
90102050-186 = "You wouldn't want to work at an unstaffed station near the Abydos Desert, would you?"
90102050-187 = "O-Of course not! I will never breathe a word of this!"
90102050-188 = "Have a safe trip back..."
90102050-195 = "Haaah...#nSeriously, CCC executives always—"
90102050-196 = "Nothing good ever comes from meeting them!"
90102050-198 = "Next Episode;An Unexpected Reunion"
