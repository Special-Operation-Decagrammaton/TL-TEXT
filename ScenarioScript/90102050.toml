[translation]
90102050-1 = "Эпизод 5;Рядовые и начальство"
90102050-2 = ""
90102050-4 = ""
90102050-5 = "Можно вас на минуту?#nЯ из Железнодорожной академии Хайлендер."
90102050-6 = "У-у меня есть билет, честно!?"
90102050-7 = "А, нет, я пришла не билеты проверять..."
90102050-9 = "Не волнуйтесь.#nМы не работники этой станции, а относимся к [ruby=Центральный диспетчерский центр]ЦДЦ[/ruby] Железнодорожной академии Хайлендер."
90102050-10 = "Сейчас мы проводим опрос удовлетворённости клиентов."
90102050-11 = "Для улучшений мы планируем активно учитывать ваши отзывы, поэтому, пожалуйста, поделитесь своим откровенным мнением!"
90102050-12 = "Мнением..."
90102050-13 = "Если я отвечу честно... вы же не бросите меня на рельсы?"
90102050-14 = "С чего бы это!?"
90102050-15 = "(Почему учеников Хайлендера так остерегаются пассажиры...)"
90102050-16 = "Тогда насчёт проводников... они как-то не очень любезны."
90102050-17 = "Не все, конечно.#nНа старых линиях пассажиров обрабатывают как заключённых исправительного бюро."
90102050-18 = "Если хоть что-то заподозрят, сразу пистолет достают, знаете ли?"
90102050-19 = "Это действительно проблема..."
90102050-20 = "Приносим извинения за доставленные неудобства."
90102050-21 = "Чтобы предотвратить повторение, не могли бы вы рассказать подробнее?"
90102050-22 = "Ближайший случай — на прошлой неделе, пожалуй."
90102050-23 = "Задержался на работе, вернулся поздно и едва успел на последний поезд."
90102050-24 = "И вот прямо передо мной двери начали закрываться."
90102050-25 = "Я сунул зонт, и тут работник станции направил на меня пистолет со словами «Отойди от поезда»!?"
90102050-26 = "Могли бы просто открыть двери, жадюги―"
90102050-27 = ""
90102050-29 = ""
90102050-30 = "Ай!?#nВы же сами сказали, что можно говорить честно!"
90102050-31 = "Прошу прощения. Случайно вырвалось."
90102050-32 = "Я понимаю ваши чувства, но..."
90102050-33 = "Это может привести к поломке или аварии, поэтому, пожалуйста, не зажимайте зонт в дверях."
90102050-34 = "Тц... какие же вы несговорчивые."
90102050-35 = ""
90102050-37 = ""
90102050-38 = "Н-ничего!"
90102050-39 = "Что-нибудь ещё?"
90102050-40 = "Например, не видели ли вы поезд, которого нет в расписании..."
90102050-41 = "Нет, такого не было.#nУ Хайлендера по части времени всё чётко, тут претензий нет."
90102050-42 = "Правда, иногда замечаю, как они несутся с бешеной скоростью."
90102050-43 = "Понятно... спасибо за помощь в опросе."
90102050-44 = "В знак благодарности... примите от нас гранату с выдернутой чекой!"
90102050-45 = ""
90102050-47 = ""
90102050-48 = ""
90102050-50 = "Эй, эй-эй-эй, что мне с этим делать!?"
90102050-51 = "Взять вот так внезапно такое―"
90102050-52 = "Если отпустить предохранительный рычаг — взорвётся, так что держите крепко, хорошо?"
90102050-53 = ""
90102050-55 = ""
90102050-57 = "Похоже, слухи о том, что среди начальства Хайлендера нет нормальных, правдивы..."
90102050-58 = "Знал бы — лучше бы соврал!"
90102050-60 = "(После этого Отоги и Куруми продолжили опрашивать горожан...)"
90102050-61 = ""
90102050-64 = "Это FOX1.#nFOX3, FOX4. Есть новая информация?"
90102050-65 = "Это FOX3. Совсе-е-ем ничего. Ноль результатов."
90102050-66 = "Не сильно отличается от того, что в интернете... и главное — никто не видел тот самый поезд."
90102050-67 = "Все только жалуются на сервис Хайлендера."
90102050-68 = "Хотя многие жалобы пассажиров — результат их же поведения."
90102050-69 = "Безбилетники, или те, кто начинает торговать подозрительными вещами в вагоне..."
90102050-70 = "Почему именно в поездах по сравнению с другим транспортом собирается столько странных людей?"
90102050-71 = "Может, просто потому, что пассажиров много."
90102050-72 = "Это FOX2.#nПока FOX3 и FOX4 опрашивали, я проверила камеры наблюдения, которые были отключены во время происшествия."
90102050-73 = "Конструкция не позволяла взломать их извне,#nи кроме износа части цепи никаких аномалий не обнаружилось."
90102050-74 = "Похоже, отсутствие записи именно в тот момент было случайностью."
90102050-75 = "Действительно, случайность тоже нельзя исключать.#nНо следует учитывать, что обстоятельства слишком удобно сложились для преступника."
90102050-76 = "...Ещё немного — и работники станции нас заподозрят. Пора двигаться в станционный кабинет."
90102050-77 = "FOX3, FOX4.#nПродолжайте опрос объекта, стараясь не выдать себя."
90102050-78 = "Есть!"
90102050-80 = "Станция Каваниши · Станционный кабинет"
90102050-81 = ""
90102050-82 = "Д-добро пожаловать!"
90102050-83 = "С чем вы сегодня к нам?.."
90102050-84 = ""
90102050-86 = ""
90102050-87 = "Да бросьте вы так напрягаться. Расслабьтесь."
90102050-88 = "Я и той девочке говорила — я просто заглянула по пути."
90102050-89 = "Точно-точно. Решила проверить, есть ли у вас какие-то проблемы."
90102050-90 = "В-вот как..."
90102050-91 = "Пожалуйста, присаживайтесь."
90102050-92 = "Если бы я знал заранее, что вы придёте, приготовил бы сладости...#nИ чай только дешёвый в пакетиках, прошу прощения."
90102050-93 = "Этого достаточно."
90102050-94 = "Мне сейчас не до сладкого."
90102050-95 = "И поговорить можно и без сладостей."
90102050-96 = "..."
90102050-97 = "Тогда перейдём к делу."
90102050-98 = "Так, сколько поездов проходит через станцию Каваниши...#nОго, если сложить все линии, это почти 1000 поездов в день!"
90102050-99 = "...Э, это примерно один поезд в минуту?"
90102050-100 = "И со всем этим справляться, плюс управление станцией и всё такое... тяжело, да.#nСпасибо за ваш ежедневный труд."
90102050-101 = "Ч-что вы, это слишком..."
90102050-102 = "Но ведь при такой загруженности бывает, что за всем не уследишь, да?"
90102050-103 = "Э? Что вы имеете в виду..."
90102050-104 = "Голова кругом от работы, а персонала минимум."
90102050-105 = "Значит, бывает, что и не заметишь, как прошёл поезд вне расписания, а?#nКак считаете?"
90102050-106 = "Думаю, такого быть не может.#nВизуально — да, уследить за всеми платформами невозможно, но..."
90102050-107 = "Движение всех поездов управляется системой.#nПоезд, которого нет в расписании, ни за что не сможет заехать на платформу―"
90102050-108 = "Да нет-нет, я же не обвиняю работников станции."
90102050-109 = "Если тяжело — так и скажите честно.#nМожет, начальство и увеличит штат?"
90102050-110 = ""
90102050-112 = ""
90102050-113 = ""
90102050-114 = "...Можно вас на минуту."
90102050-115 = ""
90102050-117 = ""
90102050-118 = "Если не возражаете, можно проверить ваши удостоверения?"
90102050-119 = "С чего вдруг?.."
90102050-120 = "...Что-то тут не так."
90102050-121 = "Уже то, что вы появились без предупреждения, вызвало недоумение,#nно вы чем-то не похожи на тех руководителей, которых я знаю."
90102050-122 = "Вместо того, чтобы ворваться в станционный кабинет, клянчить сладости или сваливать на нас поручения―"
90102050-123 = "То, что ЦДЦ вдруг начала беспокоиться о сотрудниках на местах... это просто ненормально.#nРазве «персонала достаточно» не было их дежурной фразой?"
90102050-124 = "Я лишь сверю удостоверения с сетью академии. Это не займёт много времени."
90102050-125 = "Это просто проверка на всякий случай, прошу отнестись с пониманием."
90102050-126 = "И почему нас заподозрили из-за такого..."
90102050-127 = "Удостоверения у нас есть, но если проверят по базе — фальшивка раскроется моментально..."
90102050-128 = "Может, перейти к плану Б?"
90102050-129 = "...Нет, подожди. У меня есть идея."
90102050-130 = "Конечно, я помогу."
90102050-131 = "Так-с, где же у меня удостоверение~?"
90102050-132 = ""
90102050-134 = ""
90102050-135 = ""
90102050-136 = "Кстати, я тут поговорила с одним пассажиром на платформе."
90102050-137 = "А, да."
90102050-138 = "Правда, что был скандал из-за того, что пассажир зажал зонт в дверях?"
90102050-139 = "А, да, был такой случай.#nРаботник станции оттащил его, так что до серьёзного не дошло..."
90102050-140 = "И что? Поезд ведь [ruby=・   ・   ・   ・]отправился по расписанию[/ruby]?"
90102050-141 = "Э-это..."
90102050-142 = "Не думаю, что такое возможно, но ведь поезд не задержался из-за такой мелочи?"
90102050-143 = "Точное соблюдение расписания — наша основа. Оно гарантирует удобство пассажиров и эффективность использования подвижного состава.#nБезответственной ситуации, когда поезд не отправился по расписанию, ведь не было, а?"
90102050-144 = "Ммм... на всякий случай нужно проверить записи за тот день."
90102050-145 = "Н-нет, не нужно до такой степени..."
90102050-146 = "Почему?#nКак говорит начальник станции, проверка на всякий случай — это важно, разве нет?"
90102050-147 = "Начальник станции, похоже, человек аккуратный, так что наверняка понимает, да?"
90102050-148 = ""
90102050-150 = ""
90102050-151 = ""
90102050-152 = "(Эх... разворошили змеиное гнездо...)"
90102050-153 = "(Эти двое... точно руководство ЦДЦ...!)"
90102050-154 = "(Кстати, я слышала, что среди руководства ЦДЦ#nесть парочка низкорослых с ужасным характером...）"
90102050-155 = "(...Неужели это они?)"
90102050-156 = "...П-прошу прощения!#nНе зная, что вы руководство, я обратилась с неподобающей просьбой."
90102050-157 = "Удостоверения... не нужны."
90102050-158 = "Да?#nХорошо, что удалось избежать лишних хлопот~"
90102050-159 = "(Фух... чуть сердце не остановилось...)"
90102050-161 = "Как вы и сказали, управление железными дорогами Р.У. осуществляется через сеть#nв сотрудничестве с транспортным отделом."
90102050-162 = "Поэтому поезд вне расписания в принципе не может заехать, но...#nв последнее время я слышу слухи, которые меня немного беспокоят."
90102050-163 = ""
90102050-165 = ""
90102050-166 = "Вы знаете Алчного брокера?#nОн известен как один из Семи заключённых, выходец из Железнодорожной академии Хайлендер."
90102050-167 = ""
90102050-168 = "Конечно знаю!"
90102050-169 = "Думаешь, сколько поездов я сменила, чтобы его поймать―"
90102050-170 = "Э? Вы поймали Алчного брокера?"
90102050-171 = "А, не обращай внимания. Это ещё когда я была в [ruby=Отдел безопасности железных дорог]RSD[/ruby]."
90102050-172 = "Лучше скажи, почему вдруг Алчный брокер?"
90102050-173 = "Это всего лишь слухи, но... Алчный брокер возобновил деятельность."
90102050-174 = "В последнее время и в соцсетях стали появляться посты о том, что поздно ночью видели незнакомый поезд."
90102050-175 = "Алчный брокер, будучи бывшим руководителем ЦДЦ, отлично разбирается в системе управления поездами.#nК тому же у него отличные навыки вождения."
90102050-176 = "Провести поезд в промежуток между рейсами и скрыть его пункт назначения —#nизлюбленный приём Алчного брокера."
90102050-177 = "...Вот оно!"
90102050-178 = "Что?"
90102050-179 = "Спасибо. Благодаря тебе я получила ценную информацию."
90102050-180 = "Теперь картина происшествия начинает проясняться."
90102050-181 = "FOX4― нет, Отоги. Скорее возвращаемся, чтобы поделиться."
90102050-182 = "Рад, что смог помочь, но... о каком происшествии речь?"
90102050-183 = "Таинственный поезд, появляющийся по ночам... он существует на самом деле?.."
90102050-184 = "А, на всякий случай."
90102050-185 = "О сегодняшнем. Ни другим работникам станции, ни другому руководству ЦДЦ — никому не рассказывать, ясно?"
90102050-186 = "Ведь не хочешь работать на безлюдной станции где-то рядом с пустыней Абидоса?"
90102050-187 = "К-конечно! Никому ни слова!"
90102050-188 = "Счастливого пути..."
90102050-189 = ""
90102050-191 = ""
90102050-192 = ""
90102050-195 = "Эх-х-х...#nВот уж действительно руководство ЦДЦ―"
90102050-196 = "Каждая встреча — сплошная головная боль!"
90102050-198 = "Следующий эпизод; Неожиданная встреча"
