[translation]
221110-1 = "Episode 11; Change of Heart"
221110-3 = "Olympus - Island Officer's Room"
221110-5 = "Phew..."
221110-6 = "...That was quite an ordeal."
221110-7 = "[s] \"Are you okay?\""
221110-8 = "Yes. Falling into the ocean is a common occurrence aboard the Odyssey."
221110-9 = "I did not swallow any seawater, and I changed clothes immediately, so I am fine."
221110-10 = "Above all... Sammy is safe."
221110-11 = "Meow."
221110-12 = "Sammy, what were you thinking today?#nCause trouble all over the place."
221110-13 = "That means no snacks for a week--"
221110-17 = "--Well, saying that does not change anything, I suppose."
221110-18 = "Meow?"
221110-23 = "This took longer than expected.#nThank you for your hard work, everyone."
221110-24 = "--Now, let us get to the signing we could not finish this morning.#nThis is the document to transfer Sammy's custody."
221110-25 = "..."
221110-26 = "General Student Council President, I am terribly sorry to bring this up now, but..."
221110-27 = "Could you please pretend that the plan to have Sammy disembark never happened?"
221110-28 = "Captain?!"
221110-29 = "...Let me confirm just to be sure."
221110-30 = "Sammy's disembarkation has been announced as an official directive from the General Student Council."
221110-31 = "If the captain of the Odyssey refuses, it will create ripples both inside and outside the academy."
221110-32 = "Understanding that, do you have a reason strong enough to overturn the General Student Council's directive?"
221110-33 = "...Until just a moment ago, I thought we must never go against taboos and traditions."
221110-34 = "The moment I broke a taboo kept for hundreds of years and peeked behind the carpet--#nI was scared, feeling as if years of karma were crashing down on me all at once."
221110-36 = "...No, that is not quite right. I am still afraid."
221110-38 = "But when I fell into the ocean, Sammy did not hesitate to jump in after me."
221110-39 = "To a cat, human taboos and traditions mean nothing.#nSammy simply acted out of worry for me."
221110-40 = "When our eyes met, I felt so ashamed..."
221110-41 = "Is the taboo of the Odyssey truly so important that we must drive out a friend to protect it?"
221110-42 = "And is the role of the Odyssey's captain truly meant for a coward who cannot conquer her fears?"
221110-44 = "...A long time ago, the maiden voyage of the Odyssey must have been aboard an unreliable ship, with unknown routes and destinations."
221110-45 = "It must have been incomparably scarier than it is now.#nYet, our seniors took up their oars because they wanted to know what lay beyond the sea."
221110-46 = "If those seniors had stopped moving their hands out of fear back then...#n...The present Odyssey Marine High School would not exist."
221110-47 = "That is why--!#nIf I send Sammy away... I feel like I will never be able to make a decision again..."
221110-48 = "I am well aware that this is a presumptuous request."
221110-49 = "But please--please! Could you reconsider Sammy's fate?"
221110-55 = "So that is your answer."
221110-56 = "...Understood. Let us pretend Sammy's disembarkation never happened."
221110-57 = "W-Just like that...?"
221110-58 = "Were you hoping for a turn of events where the Odyssey takes up arms against the General Student Council?"
221110-59 = "No, of course not..."
221110-60 = "Fufu, it is alright."
221110-61 = "To the students of the Odyssey, the decisions of the General Student Council might seem like whims, but--"
221110-62 = "Absurdity is simply the nature of such things."
221110-63 = "...Thank you."
221110-64 = "Meow~"
221110-67 = "Sigh... In the end, we are right back where we started."
221110-68 = "How do you plan to persuade the students who believe Sammy brings bad luck?"
221110-69 = "I have been thinking about it..."
221110-70 = "Huh?!"
221110-71 = "Well, trying to convince people to change opposing views is tough."
221110-72 = "Explaining why it is good to be with a friend is much easier, right?"
221110-73 = "Even when scary and incomprehensible things happen,#nif you can feel the warmth of the Sammy you are hugging--"
221110-74 = "That is far more persuasive than any roundabout explanation."
221110-80 = "That sounds like a long-term project."
221110-81 = "Still... I am sure, someday."
221110-86 = "[ns1] \"Is this case closed, then?\"\n[ns2] \"I am glad we could resolve it without anyone getting hurt.\""
221110-89 = "If there is anything I lost in this incident,#nI suppose it would be my image within the Odyssey."
221110-90 = "[s3] \"W-We definitely have not forgotten your hard work!\"\n[s4] \"It must have been so tough...\""
221110-93 = "Fufu, it is fine."
221110-94 = "I was the one who took on the role of the bad guy first."
221110-95 = "Come to think of it... Apparently, there is an ice cream you can only get at the Odyssey."
221110-96 = "I think treating me to some would cheer me up... What do you say?"
221110-97 = "[s] \"Are you really okay with just that?\""
221110-98 = "Yes, of course."
221110-100 = "(Thus the story ends, and they lived happily ever after--)"
221110-104 = "(--Or so it did not go)"
221110-109 = "Hello?"
221110-110 = "Pardon the late-night call.#nI am Sanae Funamori, the Odyssey ship doctor who greeted you the other day."
221110-111 = "Do you have a moment?"
221110-112 = "[s5] \"Sanae?\"\n[s6] \"What is the matter at this hour?\""
221110-115 = "This is urgent, so I will get straight to the point."
221110-116 = "Could you please hurry over to the Odyssey?"
221110-117 = "[s] \"Did someone get seriously injured or something?\""
221110-118 = "...It is not a student."
221110-119 = "Well..."
221110-121 = "Tonight is... the critical moment for Sammy."
221110-123 = "Next Episode; Taking Up the Oar"
