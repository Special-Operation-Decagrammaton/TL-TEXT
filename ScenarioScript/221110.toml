[translation]
221110-1 = "Episódio 11;Mudança de Ideia"
221110-2 = ""
221110-3 = "Olympos - Sala de Oficiais do Island"
221110-5 = "Ufaaa......"
221110-6 = "......Que sufoco inacreditável."
221110-7 = "[s] \"Você tá bem, Minato?\""
221110-8 = "Sim. Cair na água é algo corriqueiro para quem vive na Odisseia."
221110-9 = "Não cheguei a engolir água do mar e já troquei de roupa, então estou ótima."
221110-10 = "E o mais importante de tudo...... o Sammy está são e salvo."
221110-11 = "Myao."
221110-12 = "O que deu em você hoje, hein, Sammy?#nAprontando travessuras pelo navio inteiro desse jeito."
221110-13 = "Vai ficar uma semana inteira de castigo sem petisco――"
221110-14 = ""
221110-16 = ""
221110-17 = "――Quer dizer... falar isso agora não faz o menor sentido, né?"
221110-18 = "Myaau?"
221110-19 = ""
221110-21 = ""
221110-22 = ""
221110-23 = "A busca se prolongou consideravelmente além do esperado.#nBom trabalho a todos pelo esforço."
221110-24 = "――Pois bem, poderíamos formalizar a assinatura que ficou pendente pela manhã?#nRefiro-me ao termo de custódia e transferência do Sammy."
221110-25 = "......"
221110-26 = "Ilustre Presidente... sei que é uma inconveniência imperdoável pedir isto a esta altura do campeonato, mas..."
221110-27 = "Seria possível revogar e desconsiderar a ordem de desembarque do Sammy?"
221110-28 = "Capitã Minato?!"
221110-29 = "......Gostaria de confirmar alguns pontos antes, apenas por prudência."
221110-30 = "A determinação do desembarque já foi anunciada publicamente como uma diretriz do Conselho Estudantil Federal."
221110-31 = "Se a Capitã da Odisseia declinar neste momento, isso provocará repercussões dentro e fora da academia."
221110-32 = "Ciente de tudo isso, você tem uma razão de peso suficiente para revogar uma instrução formal do Conselho Estudantil Federal?"
221110-33 = "......Até instantes atrás, eu acreditava piamente que era um pecado mortal desafiar os tabus e os costumes da escola."
221110-34 = "Sentia um pavor esmagador de que, ao quebrar uma regra secular e olhar a sujeira escondida sob o tapete――#ntoda a maldição acumulada por gerações desabaria de uma só vez sobre nós."
221110-36 = "......Não, minto. Eu ainda sinto esse medo correndo pelas minhas veias agora mesmo."
221110-38 = "Porém, quando caí na água, o Sammy não hesitou nem por um segundo em se debruçar na beirada para tentar me acudir."
221110-39 = "Para um felino, tabus e superstições humanas não significam nada.#nO Sammy agiu movido unicamente pelo amor e pela preocupação que sentia por mim."
221110-40 = "No instante em que meus olhos cruzaram com os dele, senti uma vergonha imensa de mim mesma..."
221110-41 = "Será que os dogmas da Odisseia valem tanto a ponto de termos que expulsar um companheiro leal para preservá-los?"
221110-42 = "E será que o posto de Capitã da Odisseia é um fardo destinado a covardes incapazes de superar os próprios medos?"
221110-43 = ""
221110-44 = "......Em um passado longínquo, a [ruby=・   ・   ・   ・   ・   ・   ・   ・   ・   ・   ・]primeira expedição marítima da Odisseia[/ruby] partiu em barcos frágeis e precários,#nsem rota traçada e sem saber o destino que as aguardava."
221110-45 = "O terror que sentiam devia ser infinitamente maior do que qualquer medo que sentimos hoje.#nAinda assim, nossas pioneiras ergueram os [ruby=remos]remos[/ruby] com orgulho, movidas pela ânsia de desbravar o horizonte desconhecido."
221110-46 = "Se naquele dia fatídico nossas antecessoras tivessem paralisado as mãos de pavor...#n......o Colégio Marítimo Odisseia jamais existiria hoje."
221110-47 = "E é exatamente por isso――!#nSe eu mandar o Sammy embora agora... sinto que jamais terei coragem de decidir mais nada na minha vida!"
221110-48 = "Reconheço que é um capricho insolente e egoísta da minha parte."
221110-49 = "Mas eu lhe suplico――do fundo da minha alma! Por favor, reconsidere a partida do Sammy!"
221110-50 = ""
221110-52 = ""
221110-53 = ""
221110-54 = ""
221110-55 = "Então essa é a sua verdadeira resposta."
221110-56 = "......Muito bem. Consideremos cancelada a ordem de desembarque de Sammy."
221110-57 = "A-Assim... com tanta facilidade...?!"
221110-58 = "A Capitã acaso preferia um confronto bélico contra as forças do Conselho Estudantil Federal?"
221110-59 = "N-Não, de jeito nenhum, é só que..."
221110-60 = "Fufufu, fique tranquila."
221110-61 = "Aos olhos das estudantes, parecerá apenas mais um capricho arbitrário e instável da Presidente do Conselho Estudantil Federal――"
221110-62 = "Mas a natureza do poder arbitrário é exatamente essa."
221110-63 = "......Muitíssimo obrigada por tudo."
221110-64 = "Myaau～"
221110-66 = ""
221110-67 = "Haaah... No fim das contas, voltamos exatamente para a estaca zero."
221110-68 = "Como a Capitã pretende convencer as alunas que têm pavor de que o Sammy traga desgraça para o navio?"
221110-69 = "Fiquei pensando nisso o caminho todo... e acho que não precisamos 'convencer' ninguém com discursos lógicos."
221110-70 = "Como é que é?!"
221110-71 = "Ora, persuadir alguém a mudar de ideologia é uma batalha desgastante e inglória."
221110-72 = "Mas explicar por que queremos ficar ao lado de um amigo querido é infinitamente mais simples e humano, não acha?"
221110-73 = "Mesmo quando fatos assustadores e inexplicáveis acontecerem no mar.#nBasta abraçar o Sammy e sentir o calor do corpinho dele batendo no peito――"
221110-74 = "Isso terá um poder de convencimento muito maior do que qualquer retórica rebuscada."
221110-75 = ""
221110-77 = ""
221110-78 = ""
221110-79 = ""
221110-80 = "Pelo visto, teremos uma longa e paciente jornada pela frente."
221110-81 = "Mas tenho fé de que... com o tempo, todas compreenderão."
221110-84 = ""
221110-86 = "[ns1] \"Parece que o caso foi finalmente encerrado, né?\"\n[ns2] \"Que alívio ver tudo resolvido sem ninguém sair machucado.\""
221110-89 = "Se algo saiu machucado de toda essa confusão,#nfoi unicamente a minha reputação perante as alunas da Odisseia."
221110-90 = "[s3] \"M-Mas nós nunca vamos esquecer o quanto você se esforçou!\"\n[s4] \"Você segurou uma barra daquelas......!\""
221110-93 = "Fufufu, não se aflija."
221110-94 = "Fui eu mesma quem se propôs a assumir o papel da megera afinal."
221110-95 = "Aliás... ouvi dizer que existe um sorvete artesanal exclusivo que só é servido aqui na Odisseia."
221110-96 = "Se o Sensei me convidasse para uma taça, meu ânimo com certeza se renovaria num instante... O que me diz?"
221110-97 = "[s] \"Tem certeza de que só isso basta?\""
221110-98 = "Sim, mais do que suficiente."
221110-100 = "（E assim, nossa história parecia caminhar para um final feliz e harmonioso――）"
221110-101 = ""
221110-104 = "（――Porém, o destino nos reservava outro desfecho.）"
221110-108 = ""
221110-109 = "Alô?"
221110-110 = "Perdoe-me pelo incômodo a estas horas da madrugada.#nSou a médica da Odisseia, [ruby=Funamori]Sanae[/ruby] Funamori."
221110-111 = "O Sensei teria um minuto?"
221110-112 = "[s5] \"Sanae?\"\n[s6] \"Aconteceu alguma coisa a essa hora da noite?\""
221110-115 = "A situação é crítica, serei direta e breve."
221110-116 = "O Sensei poderia vir com a máxima urgência até a Odisseia agora mesmo?"
221110-117 = "[s] \"Alguém sofreu um acidente grave?!\""
221110-118 = "......Não se trata de nenhuma aluna."
221110-119 = "É que――"
221110-121 = "Esta noite... é o momento decisivo para o Sammy."
221110-123 = "Próximo Episódio;Erguer os Remos"
