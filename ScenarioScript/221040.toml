[translation]
221040-1 = "Episode 4;White Uniforms and Curry"
221040-3 = "Olympus - Island Officer Room"
221040-6 = "Today's dinner is seafood curry with a cod fillet."
221040-7 = "Please, enjoy."
221040-8 = "[ns1] \"It looks like normal curry, but....\"\n[ns2] \"What is the problem?\""
221040-11 = "Well, you see...."
221040-12 = "As an Odyssey tradition, on the day we make port, every ship has curry for dinner."
221040-13 = "It is hard to find someone who dislikes it, and we can use up all the ingredients we could not finish during the voyage at once."
221040-14 = "However, some students dislike curry for reasons other than taste preferences...."
221040-15 = "An allergy issue?"
221040-16 = "No, nothing like that--"
221040-17 = "If curry splatters on white clothes, it is hard to get out."
221040-18 = "I see."
221040-19 = "President. I know this is overstepping, but you really do not have to force yourself...."
221040-20 = "Some students even volunteered for Trident just because they hate failing to wash out curry splatters and wanted a black uniform...."
221040-21 = "Thank you for your concern. #nHowever, I have no intention of spurning such a kind treat."
221040-22 = "Well then... bon appetit."
221040-28 = "This taste is--"
221040-29 = "[ns] \"A mariage of seafood and curry....\""
221040-30 = "Curry is a collection of spices. #nNot only does it bring out a good flavor, but it also masks unwanted odors."
221040-31 = "Even if they dislike the fishy smell of seafood, many students can eat seafood curry."
221040-32 = "Though of course, the cruise management's cooking skills are also quite solid."
221040-36 = "[ns3] \"The cod fillet goes so well with it!\"\n[ns4] \"It is so delicious I cannot stop using my spoon...!\""
221040-42 = "...Sensei."
221040-43 = "I recommend eating the fish without flipping it over, removing the bones as you go."
221040-44 = "[s] \"...Is that also a taboo on board?\""
221040-45 = "Yes. I apologize for the inconvenience, but please understand."
221040-46 = "[s] \"Well, it is not difficult, so I do not mind....\""
221040-51 = "(Dinner continued in a calm atmosphere.)"
221040-54 = "...Thank you for the meal."
221040-55 = "[ns5] \"Thanks for the meal!\"\n[ns6] \"It was super delicious!\""
221040-58 = "It seems to have been to your liking. #nIt was worth preparing it with such enthusiasm."
221040-59 = "I will pass on your compliments to the students in the kitchen."
221040-60 = "Actually, we even considered preparing a winning dish mixed with plenty of habanero sauce--"
221040-61 = "Please absolutely do not do that. Do you intend to cause a diplomatic incident?"
221040-62 = "Even so, General Student Council President, to finish your meal without soiling your white attire...!"
221040-63 = "As expected, the rumors of you being a superhuman are true...!"
221040-64 = "I do not think the title of superhuman means that."
221040-65 = "I am honored by the praise. #nHowever, I do not believe I was paying special attention to my clothes."
221040-66 = "I was just eating with gusto, and that is how it ended up."
221040-67 = "You did that subconsciously...?"
221040-68 = "When there are so many students pulling their hair out over laundry... #nI would definitely like to know your secret."
221040-69 = "If you do not mind, for your next visit, we could make the meal curry udon--"
221040-70 = "Do not test weird things on the General Student Council President."
221040-71 = "Yes...."
221040-74 = "Now then, shall we get to the main topic?"
221040-75 = "I apologize, but could everyone other than Vice-Captain Ami step outside?"
221040-76 = "There is a possibility we will be handling academy secrets."
221040-77 = "Understood."
221040-78 = "Please be sure to call us as soon as the talks are over!"
221040-85 = ".........Sigh."
221040-86 = "I am tired...."
221040-87 = "Captain. The talks have not even started yet. Please sit up straight."
221040-88 = "But... don't you think we can let our guard down at least when there are no other Odyssey students around?"
221040-89 = "I am sure the General Student Council President and Sensei do not mind something like this."
221040-90 = "Captain!"
221040-91 = "Hehe."
221040-92 = "As I thought, Captain Umiji is like this in everyday settings."
221040-93 = "I apologize for showing you such an unseemly side of us...."
221040-94 = "[s] \"I find this easier to talk to.\""
221040-95 = "See, Vice-Captain. Sensei says so, too."
221040-96 = "...Tch."
221040-97 = "A tsk?!"
221040-98 = "Sigh... Well then, let us begin the talks."
221040-99 = "If you have any concerns about our academy, please feel free to ask during this opportunity."
221040-100 = "[s] \"Hmm... The first thing that caught my attention was--\""
221040-105 = "[ns7] \"It feels like Odyssey is too sensitive to superstitions.\"\n[ns8] \"I know that cultures differ from academy to academy, but....\""
221040-108 = "...Indeed, there are many things we worry about."
221040-112 = "Sensei, have you ever been out to the open sea?"
221040-115 = "In seas close to land, the winds are calm, and waves rarely wash over the deck. #nBut out in the open ocean, it is a different story. #nIt is not rare for the wind direction to change from moment to moment and for waves to slam against the deck."
221040-116 = "When operating a ship in such a fickle environment, danger comes easily."
221040-117 = "Being struck by heavy cargo, falling into the sea, burning from oil...."
221040-118 = "To prepare for situations that threaten their lives, sailors have created rules."
221040-120 = "That is precisely what taboos are."
221040-121 = "Even if they seem like absurd superstitions, they are safety guidelines built on blood and sweat by sailors over a long history."
221040-122 = "[s] \"Whistling and rabbits, too?\""
221040-123 = "Yes. #nLet me give you an example."
221040-124 = "There is a taboo that says, 'Do not help someone who is floating vertically and drowning in the water.' #nWhy do you think such a taboo was created?"
221040-125 = "[s9] \"Hmm....\"\n[s10] \"Because a demon is trying to drag them into the sea... or something?\""
221040-128 = "Many students think so. #nHowever, the true reason is different."
221040-129 = "When a drowning person is in a vertical posture relative to the water surface, #nthere is a high possibility they are being pulled into a vortex."
221040-130 = "Approaching carelessly could drag the rescuer into danger as well. #nThat is why it was made into a rule and continues to be passed down as a taboo."
221040-131 = "Whistling and rabbits are the same."
221040-132 = "Ship alarms and distress signals sound similar to high-pitched whistling. #nTherefore, whistling became a taboo to prevent misidentification."
221040-133 = "Rabbits became a taboo in the era of wooden ships because they could damage the hull, #nand that has likely remained to this day."
221040-134 = "[s] \"What about not being able to flip fish over to eat them...?\""
221040-135 = "...There are also things whose origins are unknown."
221040-136 = "Perhaps it was forbidden because they disliked the meat falling apart...?"
221040-137 = "Even if we cannot make sense of all of them, it means they are not being forced upon us without reason."
221040-138 = "Yes. We remember them as just the way things are and uphold them."
221040-139 = "[ns] \"But if that is the case, there is a limit.\""
221040-141 = "[ns] \"If a situation happens that is not covered by the taboos--\""
221040-143 = "Sensei. Did you call us back just to talk about taboos?"
221040-144 = "...No. That is not it."
221040-145 = "The other day, [USERNAME] Sensei discovered a distress signal that appeared to be from Odyssey."
221040-146 = "A distress signal?"
221040-147 = "If that is true, then who on earth...?"
221040-148 = "Do the two of you know anything about this?"
221040-153 = "This is...!"
221040-154 = "Good. It seems you have an idea."
221040-155 = "Yes, I know it well. #nThis orb is something I made."
221040-156 = "I dropped it in the sea during our previous voyage, but--"
221040-164 = "--Meow!"
221040-165 = "Sammy!"
221040-166 = "I am sorry. Sammy is acting up again...."
221040-167 = "Sammy, come over here! #nDo you seriously want to be punished?"
221040-168 = "Meow...."
221040-169 = "Oh my... It has gotten noisy."
221040-170 = "But thanks to that, we were able to check our answers."
221040-171 = "Captain Umiji. What was that orb made for?"
221040-172 = "As you can see--"
221040-173 = "It is Sammy's toy."
221040-175 = "Next Time;The Elderly Cat, Sammy"
