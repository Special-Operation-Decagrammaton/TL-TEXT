#[!][Data: "20/09"]
[translation]
221040-1 = "Episódio 04;Uniforme Branco e Curry"
221040-3 = "Olympos - Sala de Oficiais do Island"
221040-5 = ""
221040-6 = "O jantar de hoje é um saboroso curry de frutos do mar acompanhado de filé de pescada."
221040-7 = "Por favor, fiquem à vontade e sirvam-se."
221040-8 = "[ns1] \"Parece um prato de curry bem apetitoso...\"\n[ns2] \"Qual seria o problema afinal?\""
221040-11 = "Bem, a questão é a seguinte..."
221040-12 = "Por tradição inabalável da Odisseia, todas as alunas de todos os navios jantam curry no primeiro dia de retorno ao porto."
221040-13 = "É um prato democrático, quase todo mundo adora, e nos permite consumir rapidamente as provisões que restaram da expedição."
221040-14 = "O único problema é que certas alunas detestam dia de curry por um motivo completamente alheio ao paladar..."
221040-15 = "Por causa de alguma alergia alimentar?"
221040-16 = "Não, nada relacionado à saúde――"
221040-17 = "É que manchas de curry em roupas brancas são uma desgraça quase impossível de remover."
221040-18 = "Ah... compreendo perfeitamente."
221040-19 = "Ilustre Presidente. Sei que é audácia minha adverti-la, mas não se sinta constrangida caso prefira declinar..."
221040-20 = "Temos até alunas que se alistaram no Trident apenas para poderem usar o uniforme preto, de tanto trauma de respingar curry nas roupas brancas..."
221040-21 = "Agradeço o carinho e a preocupação, senhorita Minato.#nMas de modo algum farei desfeita de um banquete preparado com tanta dedicação."
221040-22 = "Com sua licença... bom apetite a todos."
221040-23 = ""
221040-25 = ""
221040-27 = ""
221040-28 = "Esse sabor requintado é――"
221040-29 = "[ns] \"O casamento perfeito entre os frutos do mar e as especiarias do curry......\""
221040-30 = "O curry é uma sinfonia de temperos aromáticos.#nAlém de realçar o paladar, neutraliza completamente qualquer resquício de maresia."
221040-31 = "Mesmo alunas que torcem o nariz para peixe cru devoram o curry de frutos do mar com gosto."
221040-32 = "E claro, as cozinheiras do Clube de Cruzeiros dominam a culinária com maestria invejável."
221040-33 = ""
221040-35 = ""
221040-36 = "[ns3] \"O filé de peixe desmancha na boca!\"\n[ns4] \"Tá bom demais, não consigo parar de comer......!\""
221040-39 = ""
221040-40 = ""
221040-41 = ""
221040-42 = "......Sensei."
221040-43 = "Recomendo que coma o peixe retirando as espinhas com cuidado, sem nunca virar a posta de lado no prato."
221040-44 = "[s] \"......Isso por acaso também é outro tabu de marinheiro?\""
221040-45 = "Sim. Peço desculpas pela chatice, mas é de praxe a bordo."
221040-46 = "[s] \"Tranquilo, não custa nada obedecer......\""
221040-47 = ""
221040-49 = ""
221040-51 = "（O jantar prosseguiu em um ambiente tranquilo e agradável.）"
221040-53 = ""
221040-54 = "......Estava divino. Muito obrigada pela refeição."
221040-55 = "[ns5] \"Obrigado pela comida!\"\n[ns6] \"Tava uma verdadeira delícia!\""
221040-58 = "Fico imensamente feliz que tenha agradado ao paladar refinado de vocês.#nValeu a pena todo o empenho da cozinha."
221040-59 = "Vou repassar os calorosos elogios às alunas do rancho."
221040-60 = "Na verdade, tínhamos cogitado a ideia de colocar molho habanero concentrado num dos pratos como pegadinha de boas-vind――"
221040-61 = "Nem pense nisso, por amor de Deus! Quer provocar um incidente diplomático interestadual?!"
221040-62 = "Mas impressionante mesmo foi a Presidente do Conselho Estudantil Federal: limpou o prato inteiro sem deixar um único respingo na alvura imaculada do seu vestido...!"
221040-63 = "Aquela fama de 'super-humana' que corre nos bastidores é a mais pura verdade...!"
221040-64 = "Não creio que a alcunha de super-humana tenha sido cunhada para se referir à habilidade com talheres."
221040-65 = "Agradeço o generoso elogio, mas garanto que não fiquei me policiando tanto assim."
221040-66 = "Estava tão concentrada saboreando o prato que simplesmente aconteceu de forma natural."
221040-67 = "Conseguiu essa proeza de forma inconsciente...?!"
221040-68 = "Com tantas alunas arrancando os cabelos nos tanques de lavar roupa...#npodemos implorar que nos ensine o seu segredo?"
221040-69 = "Na próxima visita, poderíamos recepcioná-la com um saboroso lámen udon com curry para testar――"
221040-70 = "Já falei para parar de inventar testes esdrúxulos com a Presidente do Conselho Estudantil Federal!"
221040-71 = "Sim, senhora......"
221040-73 = ""
221040-74 = "Pois bem, creio que já podemos adentrar no tópico central da nossa reunião."
221040-75 = "Sinto muito pelo incômodo, mas peço que todos, com exceção da Vice-Capitã Ami, se retirem do recinto."
221040-76 = "Pois trataremos de assuntos sob sigilo de segurança da academia."
221040-77 = "Entendido, Capitã!"
221040-78 = "Assim que a audiência terminar, nos chame imediatamente!"
221040-79 = ""
221040-81 = ""
221040-82 = ""
221040-84 = ""
221040-85 = "............Haaaaah."
221040-86 = "Tô só o pó da rabiola......"
221040-87 = "Capitã! A conferência mal começou, recomponha sua postura imediatamente."
221040-88 = "Ah, qual é, Ami... Não tem mais ninguém da Odisseia aqui por perto, custa deixar eu relaxar os ombros um pouquinho?"
221040-89 = "Tenho certeza de que nem a Presidente nem o Sensei vão se importar com um instante de descanso."
221040-90 = "Capitã Minato!"
221040-91 = "Fufufu."
221040-92 = "Então essa é a verdadeira e descontraída essência da Capitã [ruby=Kairo]Minato[/ruby]."
221040-93 = "Peço sinceras desculpas por presenciarem essa postura tão desleixada..."
221040-94 = "[s] \"Para falar a verdade, acho bem mais fácil conversar assim.\""
221040-95 = "Viu só, Ami? O próprio Sensei tá dizendo que prefere assim!"
221040-96 = "......Tsc."
221040-97 = "Estalou a língua de deboche na minha cara?!"
221040-98 = "Haaah... Pois bem, iniciemos formalmente a reunião."
221040-99 = "Caso haja alguma dúvida pertinente à nossa instituição, por favor, fiquem à vontade para indagar."
221040-100 = "[s] \"Olha... a primeira coisa que realmente me chamou a atenção foi――\""
221040-101 = ""
221040-103 = ""
221040-105 = "[ns7] \"Achei que o pessoal da Odisseia leva superstições a sério até demais.\"\n[ns8] \"Sei que cada escola tem seus próprios costumes peculiares, mas...\""
221040-108 = "......De fato, a lista de cuidados e crendices é bastante extensa."
221040-109 = ""
221040-111 = ""
221040-112 = "Sensei, você já teve a experiência de navegar em alto-mar longe da costa?"
221040-115 = "Nas águas mansas perto do porto, a brisa é suave e quase nunca uma onda se atreve a varrer o convés.#nPorém, em alto-mar aberto a história é bem diferente.#nO vento muda de direção sem aviso, tempestades desabam e ondas gigantescas castigam o casco a qualquer segundo."
221040-116 = "Ao manobrar embarcações gigantes em um ambiente tão traiçoeiro e volátil, a tragédia espreita a cada esquina."
221040-117 = "Seja ser esmagado por um contêiner solto, despencar em abismos escuros ou morrer queimado em óleo inflamado..."
221040-118 = "Para sobreviver diante de tamanha frieza da natureza, gerações de marinheiros forjaram [ruby=・]re[/ruby][ruby=・]gras[/ruby] absolutas."
221040-119 = ""
221040-120 = "E foi assim que nasceram os tabus."
221040-121 = "Mesmo que soem como crendices sem pé nem cabeça aos ouvidos modernos,#neles residem as 'diretrizes de segurança' esculpidas com suor, lágrimas e sangue durante séculos de navegação."
221040-122 = "[s] \"Até mesmo proibir assobio ou a palavra coelho?\""
221040-123 = "Com certeza.#nVou lhe dar um exemplo claro."
221040-124 = "Existe um tabu náutico que diz: 'Jamais tente resgatar alguém que esteja boiando na vertical'.#nPor que acha que uma regra tão cruel foi criada?"
221040-125 = "[s9] \"Huum... deixa ver...\"\n[s10] \"Porque um monstro das profundezas tá puxando a pessoa pra baixo...?\""
221040-128 = "Muita aluna novata pensa exatamente essa bobagem mística.#nNo entanto, a explicação real e científica é outra."
221040-129 = "Se um náufrago permanece com o corpo em posição vertical na lâmina d'água,#né sinal quase certo de que caiu no vórtice de um redemoinho violento."
221040-130 = "Se alguém se aproximar sem o devido cuidado para tentar puxá-lo, o socorrista será tragado junto pelas correntes para o fundo.#nPor isso se transformou numa diretriz de ferro transmitida de geração em geração como tabu."
221040-131 = "Com os assobios e os coelhos, a lógica é idêntica."
221040-132 = "As sirenes de neblina e os sinais sonoros de emergência do navio emitem frequências agudas muito semelhantes a um assobio.#nPara evitar confusão e pânico em falso, assobiar virou estritamente proibido."
221040-133 = "Já os coelhos, na era das caravelas de madeira, costumavam roer o cavername e os cabos vitais do casco, abrindo furos.#nPor isso até hoje seu nome traz mau agouro a bordo."
221040-134 = "[s] \"E por que não se pode virar o peixe no prato?\""
221040-135 = "......Esse aí, para ser sincera, ninguém sabe ao certo a origem histórica."
221040-136 = "Talvez algum marinheiro no passado tenha achado de mau gosto despedaçar a carne do peixe... algo nessa linha?"
221040-137 = "Quer dizer que, mesmo não sabendo todos os pormenores,#nnão são crendices inventadas ao acaso sem propósito."
221040-138 = "Exatamente. Nós as decoramos como [ruby=・]dogmas[/ruby] [ruby=・]sagrados[/ruby] e as obedecemos com zelo para continuarmos vivas."
221040-139 = "[ns] \"Mas depender só disso tem seus limites perigosos.\""
221040-140 = ""
221040-141 = "[ns] \"Se surgir uma crise que os tabus nunca previram――\""
221040-142 = ""
221040-143 = "Sensei. Por acaso fomos convocadas a retornar a D.U. apenas para filosofar sobre superstições navais?"
221040-144 = "......Não, de forma alguma."
221040-145 = "Dias atrás, o Sensei resgatou nas águas da costa de D.U. um sinal de socorro que parecia ter partido da Odisseia."
221040-146 = "Um pedido de socorro...?"
221040-147 = "Se isso for verdade, quem em sã consciência teria lançado algo assim...?"
221040-148 = "Vocês duas reconhecem este objeto?"
221040-149 = ""
221040-151 = ""
221040-152 = ""
221040-153 = "Mas isso é......!"
221040-154 = "Que alívio. Vejo que lhe é familiar."
221040-155 = "Sim, conheço muitíssimo bem.#nAfinal de contas, fui eu mesma quem trançou esta bola."
221040-156 = "Deixei cair na água durante a nossa viagem anterior, mas――"
221040-158 = ""
221040-164 = "――Myaaa!"
221040-165 = "Sammy!"
221040-166 = "Ai, meu Deus, mil perdões! O Sammy aprontando de novo..."
221040-167 = "Sammy, vem cá imediatamente!#nQuer ficar de castigo mesmo, é?!"
221040-168 = "Myaaawn......"
221040-169 = "Ora, puxa vida... virou uma bagunça gostosa."
221040-170 = "Mas graças a isso, fechamos a nossa charada."
221040-171 = "Capitã Kairo. Para que finalidade essa bola foi tecida afinal?"
221040-172 = "Pois como podem ver com os próprios olhos――"
221040-173 = "Não passa de um brinquedo de morder pro Sammy."
221040-175 = "Próximo Episódio;Sammy, o Velho Gato Marinheiro"
