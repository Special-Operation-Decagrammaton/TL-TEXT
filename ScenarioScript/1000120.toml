[translation]
1000120-1 = "Горячий ветер"
1000120-2 = "Я отправился с Эйми исследовать пустыню неподалёку от Миллениума."
1000120-3 = "...Хотя исследование продолжалось несколько часов, ничего необычного мы не обнаружили."
1000120-4 = ""
1000120-6 = ""
1000120-7 = ""
1000120-8 = "Хм..."
1000120-9 = ""
1000120-11 = ""
1000120-12 = ""
1000120-13 = "Хммм..."
1000120-14 = "[s1] «...Эйми?»\n[s2] «Ты в порядке? Устала?»"
1000120-17 = "...О."
1000120-18 = "Нет, Сенсей. Обо мне не беспокойся."
1000120-19 = "Хотя исследование не слишком успешно, это было ожидаемо."
1000120-20 = ""
1000120-24 = ""
1000120-25 = "На самом деле само знание того, что здесь нет ничего аномального, уже является результатом."
1000120-26 = "Я довольно привычна к длительной тяжёлой работе на открытом воздухе."
1000120-27 = "Меня больше беспокоишь ты, Сенсей..."
1000120-28 = "Ты в порядке? Ты заметно замедлился."
1000120-29 = "[s3] «Мм. Жарче, чем я ожидала.»\n[s4] «Я не так уж устала, но здесь очень жарко.»"
1000120-32 = "Это правда. Местный климат очень изматывает."
1000120-33 = "Совсем нет тени, прямое палящее солнце и никакого ветра..."
1000120-34 = "Здесь легко выдохнуться, даже если пить достаточно воды."
1000120-35 = "Я тоже быстро перегреваюсь. Со мной всё нормально, но сейчас я уже вся мокрая от пота."
1000120-36 = "В такой ситуации лучше всего снять одежду, чтобы эффективнее отводить тепло и пот..."
1000120-37 = ""
1000120-40 = "...Я знаю, ты меня остановишь. Прошлый опыт многому научил."
1000120-41 = "Но беспокоиться не о чем."
1000120-42 = "Я ведь уже говорила, да? Я готовлюсь ко всему, чтобы ничего не стало неожиданностью."
1000120-43 = "И вот у меня..."
1000120-44 = ""
1000120-46 = ""
1000120-47 = ""
1000120-50 = "[ns5] «Карманный электровентилятор?»\n[ns6] «Ты принесла довольно милый гаджет.»"
1000120-54 = "...Не суди устройство по его милому виду, Сенсей."
1000120-55 = "Я взяла его, потому что с точки зрения эффективности это лучший выбор."
1000120-56 = "Я слегка модифицировала его для таких ситуаций."
1000120-57 = "Если вот так включить переключатель..."
1000120-58 = ""
1000120-62 = "[ns7] «Ч-что за... Что это за мощность?»\n[ns8] «Ты уверена, что модификация была „небольшой“?!»"
1000120-65 = "В экстремальных условиях нужны экстремальные меры."
1000120-66 = "Я знала, что свободного времени будет мало, поэтому он должен быстро охлаждать наши тела. Чем сильнее ветер, тем меньше времени потребуется."
1000120-67 = "Ну..."
1000120-68 = ""
1000120-70 = ""
1000120-71 = "Подойди сюда, Сенсей."
1000120-72 = ""
1000120-75 = "Несмотря на мощность, это всё ещё карманный вентилятор. Зона действия небольшая."
1000120-76 = "Чтобы эффективно охладить нас обоих, нужно стоять близко друг к другу."
1000120-77 = "То есть тебе следует подойти как можно ближе. Понятно?"
1000120-78 = ""
1000120-81 = "...? Сенсей?"
1000120-82 = "Почему не двигаешься? Я попросила подойти ближе."
1000120-83 = "...Ты в порядке?"
1000120-84 = "Лучше не стоять слишком близко? Почему?"
1000120-85 = "...Не понимаю твоей логики. Какова бы ни была причина, сейчас важнее тебя охладить. Эффективность — наш приоритет."
1000120-86 = "Эм..."
1000120-87 = "Тебе нужно подойти ближе."
1000120-88 = ""
1000120-90 = ""
1000120-92 = "...Иди сюда, Сенсей."
1000120-94 = "..."
1000120-95 = "Мы с Эйми ненадолго остановились передохнуть с её вентилятором."
1000120-96 = "Однако жар, исходивший от Эйми, по сути превратил вентилятор в обогреватель..."
