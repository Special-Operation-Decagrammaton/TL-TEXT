[translation]
10034150-1 = "4 дня назад: Суть клуба"
10034150-3 = "...Я голодна."
10034150-4 = "Как ты успела проголодаться, если только что пришла? Мы ещё даже не начали."
10034150-5 = "Я голодна, когда голодна. Разве у голода есть подходящее время и место?"
10034150-6 = "Здесь вообще-то должно быть..."
10034150-7 = ""
10034150-9 = ""
10034150-10 = "Справедливо. С начала наших тренировок количество топлива, которое мы получаем... было далеко от идеала."
10034150-11 = "Как автомобилю нужны масло и бензин, так и нам нужна пища."
10034150-12 = "Как бы усердно мы ни тренировались, нельзя забывать, что представляет собой наш клуб."
10034150-13 = "Не думаю, что суть нашего клуба сейчас под угрозой..."
10034150-14 = "Ты ешь везде, куда бы ни пошла. А здесь будто забываешь об этом — или делаешь вид."
10034150-15 = "И, кажется, мы знаем почему..."
10034150-16 = ""
10034150-18 = ""
10034150-19 = ""
10034150-20 = "А-ха-ха..."
10034150-21 = "...Может, сегодня будем перекусывать прямо во время репетиции."
