[translation]
1001806-1 = "Подработка застенчивой девушки 2"
1001806-2 = "Главный вход в парк развлечений"
1001806-3 = ""
1001806-4 = "Ни за что..."
1001806-5 = "Вы сказали, что это подработка без прямого контакта с людьми, а сами привели меня в парк развлечений, полный людей..."
1001806-6 = "Сенсей, я вам доверяла... Я вам доверяла!"
1001806-7 = "[s] «Не волнуйся. Это не такая работа, как в прошлый раз.»"
1001806-8 = "Но в парке развлечений не бывает работы, где совсем не сталкиваешься с людьми!"
1001806-9 = "...А? Нужно надеть костюм и раздавать детям воздушные шарики?"
1001806-10 = "К-конечно, это лучше, чем встречаться с людьми лицом к лицу, но... всё равно страшно подходить к незнакомцам..."
1001806-11 = "К тому же студенты-подработчики в костюмах — лёгкая мишень для розыгрышей..."
1001806-12 = "А что если дети положат гранаты мне в костюм? Или будут гоняться за мной с дробовиками?"
1001806-13 = "[s] «Это... удивительно конкретные опасения.»"
1001806-14 = "Д-да? Я слишком переживаю?"
1001806-15 = "[s1] «Это проще прошлой работы, так что проблем не будет.»\n[s2] «Юзу, ты справишься с чем угодно.»"
1001806-16 = "...Вы правы, Сенсей. Если я продолжу убегать из страха перед людьми, так и останусь в шкафу, создавая проблемы остальным."
1001806-17 = "...Вы правы, Сенсей. Если я продолжу убегать из страха перед людьми, так и останусь в шкафу, создавая проблемы остальным."
1001806-18 = "Я не могу вечно быть одиночкой..."
1001806-19 = "На этот раз я постараюсь!"
1001806-20 = "Я, Ханаока Юзу, постараюсь изо всех сил!"
1001806-28 = ""
1001806-29 = "П-привет, ребята. Вот вам шарик. Н-ну же, берите!"
1001806-30 = "Ух ты, спасибо!"
1001806-31 = "П-пожалуйста. Ха, ха-ха..."
1001806-32 = ""
1001806-34 = "(Может, это из-за костюма... но разговаривать с людьми уже не так тяжело, как раньше.)"
1001806-35 = "(Если просто продержаться до закрытия...)"
1001806-36 = ""
1001806-38 = "Простите... девушка в костюме?"
1001806-39 = "Д-да? В-вы ко мне обращаетесь?"
1001806-40 = "Да. Это костюм Пероро, верно?"
1001806-41 = "Д-да...! И-именно...! Это Пероро!"
1001806-42 = "А-а! К-кстати, Пероро ведь так не разговаривает, верно?"
1001806-43 = "П-простите, перо-перо! П-пожалуйста, не стреляйте в меня, перо-перо!"
1001806-44 = "Я таким не занимаюсь... Просто хочу сфотографироваться с Пероро..."
1001806-45 = "Можно сфотографироваться вместе?"
1001806-46 = "О, в таком случае... к-конечно. Перо-перо..."
1001806-47 = "Ух ты, спасибо! Мам, сюда. Сюда! Скорее сфотографируй меня с Пероро!"
1001806-48 = ""
1001806-50 = "(Кажется, всем... весело...)"
1001806-51 = "(Видеть, как люди так веселятся... Может, эта подработка и не такая уж плохая...)"
1001806-54 = "Фух... К-как-то я всё-таки закончила смену..."
1001806-55 = "[s] «Похоже, ты уже действительно привыкла к этой работе.»"
1001806-56 = "Н-Ничего подобного! Я всё ещё боюсь встречаться с незнакомыми людьми..."
1001806-57 = "Но всё же... думаю, приятно осознавать, что можешь сделать кого-то счастливым."
1001806-58 = "Если благодаря мне кто-то может хорошо провести время и стать счастливее, то даже если мне тяжело и страшно, оно того стоит."
1001806-59 = "Прямо как при разработке игры..."
1001806-60 = "Сенсей, я буду стараться ещё больше!"
1001806-61 = "Так что, пожалуйста... продолжай присматривать за мной!"
