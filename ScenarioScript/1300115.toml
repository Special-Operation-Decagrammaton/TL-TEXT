[translation]
1300115-1 = "Звук приближающегося ветра"
1300115-4 = "Получив MomoTalk от Чисэ, я пришёл в комнату Клуба Инь-Ян."
1300115-5 = ""
1300115-7 = ""
1300115-8 = "[ns] «Чисэ?»"
1300115-9 = ""
1300115-11 = ""
1300115-12 = ""
1300115-13 = "О, Сенсей."
1300115-14 = "Я здесь."
1300115-15 = "[s] «Что ты делаешь на полу?»"
1300115-16 = "Солнце жарит, поэтому..."
1300115-17 = "Я просто сижу здесь."
1300115-18 = "Если не буду, могу растаять."
1300115-19 = "[s] «И правда. Иногда даже от малейшего движения начинаешь потеть.»"
1300115-20 = "Посиди здесь со мной, Сенсей."
1300115-21 = "Скоро услышишь."
1300115-22 = "[s] «Тот „звук приближающегося ветра“, о котором ты говорила?»"
1300115-23 = "Да. Красивый звук."
1300115-24 = "И освежающий."
1300115-25 = "Послушай внимательно. Слышишь?"
1300115-26 = "[s] «...»"
1300115-27 = "Сенсей, просто сиди спокойно..."
1300115-28 = "Слушай внимательно, тихо жди..."
1300115-29 = ""
1300115-31 = ""
1300115-33 = ""
1300115-34 = "Услышал?"
1300115-35 = "[s] «...Колокольчики?»"
1300115-36 = "Не совсем."
1300115-37 = "На самом деле это..."
1300115-38 = ""
1300115-40 = ""
1300115-42 = "[ns] «Ветряные колокольчики?»"
1300115-43 = "Да, они."
1300115-44 = "Я повесила их, чтобы слышать, когда приходит ветер."
1300115-45 = "[s] «Ну, когда они звенят, всегда понятно, что ветер дует.»"
1300115-46 = "Да, звук чистый."
1300115-47 = "Каждое лето я вешаю эти колокольчики."
1300115-48 = "Они мои любимые."
1300115-49 = "[s] «Выглядят как обычные колокольчики.»"
1300115-50 = "Может, и так, но..."
1300115-51 = "...звук у них особенный. Более синий."
1300115-52 = "[s] «Более... синий звук?»"
1300115-53 = "Да, поэтому каждый год я вешаю их именно туда."
1300115-54 = "Чтобы слышать их чистый, синий звук."
1300115-55 = ""
1300115-57 = ""
1300115-58 = ""
1300115-59 = "Послушай со мной, Сенсей."
1300115-60 = "Просто ложись здесь на пол."
1300115-61 = ""
1300115-63 = ""
1300115-64 = "Вот так."
1300115-65 = ""
1300115-71 = "Я лёг рядом с Чисэ."
1300115-74 = "Хорошо, Сенсей."
1300115-75 = "Теперь слушай внимательно."
1300115-76 = "[s] «...»"
1300115-77 = ""
1300115-81 = "[ns1] «Понимаю. Оно голубое и чистое.»\n[ns2] «Понимаю. Оно голубое и освежающее.»"
1300115-84 = "Именно!"
1300115-85 = "О, хм. Только что придумала стихотворение."
1300115-86 = ""
1300115-89 = "Жаркий летний день"
1300115-91 = "Я лежу прямо на полу"
1300115-93 = "Ветер по коже"
1300115-98 = "После этого мы ещё некоторое время лежали рядом с Чисэ, слушая спокойный синий ветер."
