[translation]
90002025-2 = "Мы сделали это!"
90002025-3 = "У нас и правда получилось... Они отступают!"
90002025-4 = "Похоже... они перестали наступать... Фух."
90002025-6 = "Спасибо, Эйми! Без твоей помощи у нас были бы проблемы!"
90002025-7 = "Полевые операции — моя специальность, так что благодарить меня не нужно."
90002025-8 = "И главное, Сенсей правильно решил отправить меня сюда."
90002025-11 = ""
90002025-12 = "Сенсей? Вы слышите? Мы только что завершили аварийное восстановление двигателя."
90002025-13 = "Да. Я тоже в этом участвовала. Быстрее хвалите меня."
90002025-14 = "[s] «Рио, Токи, отличная работа!»"
90002025-15 = "Спасибо. Делать хорошие вещи действительно приятно."
90002025-17 = "Да. Подтверждаю. Кей, сколько функций корабля удалось восстановить?"
90002025-18 = "Мы сможем поднять его в воздух, но ещё одного попадания он, скорее всего, не переживёт."
90002025-19 = ""
90002025-24 = ""
90002025-25 = "Сенсей! Химари! Кей! Это Арис. Мы завершили квест и все в безопасности!"
90002025-26 = "Отличная работа, Отдел разработки игр. И Эйми тоже."
90002025-27 = "Раз уж вы там, можете собрать несколько образцов этих новых сил Декаграмматона для исследований?"
90002025-28 = "Да, в этот раз их полно. Сколько? Двадцать?"
90002025-29 = "...Это хоть и транспортный корабль, но даже у него есть предел возможностей."
90002025-31 = "Внешняя камера снова работает. Вывожу изображение."
90002025-37 = "Это..."
90002025-38 = "..."
90002025-39 = "[s] «...»"
90002025-41 = "[ns] «Стальной континент.»"
90002025-44 = "Следующий эпизод;Мобилизация"
