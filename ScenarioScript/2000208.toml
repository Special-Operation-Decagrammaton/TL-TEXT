[translation]
2000208-1 = "Любовное зелье"
2000208-2 = "Лаборатория Саи"
2000208-3 = "Кое-что не выходит у меня из головы. Я начала странно себя чувствовать из-за того, что мы проводим столько времени вместе..."
2000208-4 = "Если объяснять... Каждый раз, когда я смотрю на тебя, сердце начинает колотиться, а лицо краснеет. Я будто становлюсь сама не своя."
2000208-5 = "Такими темпами я не смогу сосредоточиться на исследованиях. Я спросила совета у ассистентов, и они сказали, что я влюбилась!"
2000208-6 = "Любовь... Как ни неприятно это признавать, я ничего о ней не знаю. Поэтому..."
2000208-7 = "Так это..."
2000208-8 = "[s] «Это...?»"
2000208-9 = "Эликсир, который заставляет кого-то в тебя влюбиться! Любовное зелье!"
2000208-10 = "Хахаха! Любой выдающийся учёный знает: смелые заявления должны подтверждаться данными."
2000208-11 = "Чтобы проверить, действительно ли то, что я чувствую, — любовь, мне сначала нужно наблюдать за поведением того, кто ТОЧНО влюблён."
2000208-12 = "Для этого и нужно моё любовное зелье. Один вдох — и ты по уши влюбишься в первого, кого увидишь!"
2000208-13 = "Другими словами, если твоё поведение станет таким же, как моё сейчас, это докажет, что я влюблена! Я гений. Хахаха!"
2000208-14 = "[s] «И кто будет пить эликсир?»"
2000208-15 = "Ты, конечно!"
2000208-16 = "[s] Сбежать."
2000208-17 = "Стой, не убегай! Клянусь, этот эликсир безопасен! Ты не превратишься в золото и не обрастёшь шерстью."
2000208-18 = "Умоляю. Пожалуйста, помоги мне с экспериментом!"
2000208-19 = "[s] Указать на Незусукэ."
2000208-20 = "Незусукэ? Извини, но на животных зелье не действует. Нужен ты, Сенсей!"
2000208-21 = ""
2000208-22 = "Ну что... посмотрим, что будет!"
2000208-23 = "[s] Попытаться сбежать."
2000208-24 = "П-Подожди! Не тряси флакон так!"
2000208-26 = "Что с тобой? Я так старалась над этим любовным зельем..."
2000208-30 = "― Не могу поверить, что допустила такую глупую ошибку... Со мной такого не бывает.[wa:60]"
2000208-32 = "― Что мне теперь делать? Я просто не могу отвести от тебя взгляд, Сенсей...[wa:1060]"
2000208-35 = "― Сенсей, пожалуйста, не уходи... Побудь рядом![wa:3880]"
2000208-37 = "― Всё, чего я хочу... чтобы ты вот так остался со мной...[wa:10]"
2000208-40 = "― Ах... Это точно нехорошо.[wa:1160]"
2000208-42 = "― Я всё ещё не могу отвести от тебя взгляд, Сенсей.[wa:10]"
2000208-45 = "― Сейчас ты напоминаешь мне... аппетитный кусок сыра![wa:2320]"
2000208-48 = "― Ничего не могу с собой поделать... Сенсей... Можно я всего один раз укушу...? Можно ведь? Один маленький укус?[wa:4440]"
2000208-51 = "(прыжок)"
2000208-52 = "Сая продолжала кусать меня за руку, пока действие зелья не закончилось..."
