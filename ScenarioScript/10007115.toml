[translation]
10007115-1 = "Эпилог;Один день из жизни академии Красной Зимы"
10007115-4 = "Бывший курорт горячих источников №227"
10007115-6 = ""
10007115-7 = "[ns] «...»"
10007115-9 = "Э-Это был огромный взрыв. Сенсей, ты в порядке?"
10007115-10 = "[s1] «Я успел убежать, так что всё нормально.»\n[s2] «Со мной всё будет в порядке.»"
10007115-11 = "Слава богу, ты не пострадал."
10007115-12 = "Слава богу, ты не пострадал."
10007115-13 = "Курорт горячих источников..."
10007115-14 = "Он рухнул так, что ни одной опоры не осталось. Это настоящая трагедия."
10007115-15 = ""
10007115-17 = ""
10007115-20 = ""
10007115-21 = "Хуже некуда."
10007115-22 = "Любимые нами горячие источники пересохли, а даже здание курорта, которое президент Черино милостиво позволила нам оставить, уничтожено."
10007115-23 = "Ничего не изменилось по сравнению с нашей прежней жизнью в бывшем институте!"
10007115-24 = "На самом деле всё стало ещё хуже: после взрыва кругом один пепел!"
10007115-25 = ""
10007115-27 = ""
10007115-28 = "Ну... наверное, так уж вышло."
10007115-29 = "В этом мире ещё столько прекрасного, чего мы не видели, поэтому нельзя сдаваться из-за чего-то подобного."
10007115-30 = ""
10007115-32 = ""
10007115-33 = ""
10007115-35 = "И главное — наш драгоценный Сенсей и друзья в безопасности. Я благодарна хотя бы за это!"
10007115-36 = "Я тоже. Слава богу, все целы!"
10007115-37 = "[s] «Я буду болеть за тебя, Нодока.»"
10007115-38 = "Хи-хи. Спасибо, Сенсей."
10007115-39 = "Вот бы только я не была вся покрыта пылью после взрыва. Волосы и одежда тоже в ужасном состоянии."
10007115-40 = "Жаль, что источников больше нет. Я бы сейчас не отказалась от ванны."
10007115-42 = "Я тоже!"
10007115-43 = "На моих усах полно какой-то грязи. Неприемлемо."
10007115-44 = "В бывшем институте есть место, где можно помыться?"
10007115-45 = "Туалет есть, но воду там уже давно отключили. Раньше студенты спецотряда грели воду в бочке и пользовались ею."
10007115-46 = "То есть ты хочешь сказать, что я, самый могущественный человек академии Красной Зимы, должна вернуться в Секретариат в таком виде? Это опозорит мою репутацию!"
10007115-47 = ""
10007115-50 = ""
10007115-51 = ""
10007115-52 = "Нодока, вон там осталась одна открытая купальня, которую не задел взрыв."
10007115-53 = "Вода всё ещё чистая, думаю, ей можно пользоваться."
10007115-54 = "Серьёзно?"
10007115-55 = "Отлично!"
10007115-56 = "Тогда давайте скорее приведём себя в порядок."
10007115-57 = "Стойте! Как смеют отстранённые студенты бывшего института бросать меня позади! Неприемлемо!"
10007115-58 = "Я тоже иду в купальню!"
10007115-60 = "Если президент Черино идёт, тогда и я."
10007115-61 = "Я больше не хочу никакого шума... Хочу просто расслабиться в тёплой воде."
10007115-62 = "Вы ещё и право на мытьё пытаетесь монополизировать?"
10007115-63 = "Если студенты Секретариата идут в купальню, мы тоже!"
10007115-65 = "П-Подождите! Купальня слишком маленькая, столько людей туда одновременно не поместится!"
10007115-66 = "А почему нет? Я не против, если все будут вместе в тесной купальне."
10007115-67 = "К тому же пока осталась хотя бы одна купальня, курорт горячих источников №227 всё ещё работает, верно?"
10007115-68 = "Надеюсь, пока мы здесь, ты продолжишь нас обслуживать, дорогая «управляющая»."
10007115-69 = "*вздыхает*"
10007115-70 = "Если ты так ставишь вопрос, выбора у меня особо нет, да?"
10007115-71 = ""
10007115-73 = ""
10007115-74 = "Курорт горячих источников №227 временно возобновляет работу!"
10007115-78 = "*вздыхает* Какая прекрасная ванна. Кажется, вся усталость за день смывается."
10007115-79 = "Жаль, что скоро мы больше не сможем наслаждаться такой хорошей купальней."
10007115-80 = "Есть ли способ построить новые горячие источники, не повредив Секретариату?"
10007115-81 = "Черино, ты не смоешь грязь, просто поливая лицо водой."
10007115-82 = "Иди сюда. Я сама тебя помою."
10007115-83 = "Уф! Я не ребёнок! Не трогай мои усы!"
10007115-84 = ""
10007115-88 = "Есть что-то особенное в том, чтобы пить морс в горячей купальне."
10007115-89 = "А? Что в этой бутылке из-под сакэ?"
10007115-90 = "Ты же не настолько бесстыдна, чтобы пить алкоголь прямо перед Советом безопасности Секретариата?"
10007115-91 = "Конечно нет. Это особый морс, который я приготовила прошлой весной."
10007115-92 = "Он просто немного перебродил."
10007115-93 = "А? Что ты сейчас сказала?"
10007115-94 = "Хи-хи. Ничего."
10007115-95 = "Если так подозреваешь, не хочешь тоже попробовать?"
10007115-96 = "Ну, пожалуй, только глоток."
10007115-97 = ""
10007115-101 = "Товарищи! Хотя сегодня мы отступили из-за нового оружия злого тирана, это ни в коем случае не наше поражение! Мы делаем один шаг назад, чтобы затем сделать два вперёд!"
10007115-102 = "В следующий раз сначала устроим диверсию против этого проблемного танка, устраним нависшую угрозу и добьёмся революционной победы!"
10007115-103 = "Диверсия! Революция!"
10007115-104 = ""
10007115-108 = "Уф. Вот поэтому я и не хотела купаться вместе со всеми. Слишком шумно."
10007115-109 = "[s] «И всё же приятно видеть, что все в таком хорошем настроении.»"
10007115-110 = "Трудно представить студентов Красной Зимы какими-то другими."
10007115-112 = "Сенсей."
10007115-113 = "Я знаю, сегодня много всего произошло, но тебе понравилось на курорте?"
10007115-114 = "[s3] «День был весёлым.»\n[s4] «Я отлично провёл время.»"
10007115-115 = "Рада это слышать. Хи-хи."
10007115-116 = "Рада это слышать. Хи-хи."
10007115-117 = "Пусть у нас больше и нет горячих источников, надеюсь, ты ещё к нам заглянешь."
10007115-118 = "В спецотряд №227, я имею в виду."
10007115-119 = ""
10007115-121 = ""
10007115-122 = ""
10007115-124 = "Мы будем ждать тебя, Сенсей!"
10007115-125 = "Ежедневные записи курорта горячих источников №227!"
