[translation]
1002703-1 = "Непредвиденное недоразумение"
1002703-3 = "О, Сенсей. Ты пришёл."
1002703-4 = "...?"
1002703-5 = "[s] «...»"
1002703-6 = "А? Что у вас с лицом?"
1002703-7 = "О, хотите знать, почему я снова в этом наряде?"
1002703-8 = "Мы проводим тайное расследование в этом кафе."
1002703-9 = "Вообще-то вы и в прошлый раз об этом спрашивали. Каждый раз, когда я его надеваю, вы задаёте этот вопрос."
1002703-10 = "Почему? Такое чувство, будто вы специально спрашиваете..."
1002703-11 = "Нет никакой причины?"
1002703-12 = "Теперь я подозреваю ещё сильнее."
1002703-13 = "Сенсей."
1002703-14 = "Только не говорите, что вас интересуют такие вещи."
1002703-15 = "[s1] «Что? Что ты сказала?»\n[s2] «Кажется, произошло огромное недоразумение.»"
1002703-16 = "Что это за реакция?"
1002703-17 = "Что это за реакция?"
1002703-18 = "Подождите. Неужели я и правда угадала...?"
1002703-19 = "Неожиданно. Никогда бы не подумала, что Сенсей интересуется костюмами девушек-кроликов."
1002703-20 = "Довольно неожиданно... Ах! Простите, мне не стоило так говорить о чужих увлечениях."
1002703-21 = "Я не испытываю неприязни и не осуждаю людей за их странные увлечения."
1002703-22 = "Я обещаю с пониманием относиться к вашим необычным интересам, Сенсей. К тому же носить красивую одежду приятно."
1002703-23 = "И, конечно, я вас поддержу. В конце концов, вы столько раз мне помогали..."
1002703-24 = "Это недоразумение? Всё совсем не так?"
1002703-25 = "Хи-хи."
1002703-26 = "Сенсей. Вы мне всё ещё не доверяете? Видимо, этот вопрос для вас действительно очень важен."
1002703-27 = "Понятно. Прошу прощения, давайте сделаем вид, что этого разговора никогда не было."
1002703-28 = "[s] «Нет, дело не в этом. Ты всё неправильно поняла!»"
1002703-29 = "Конечно, Сенсей. Я поняла. Я вообще ничего не знаю."
1002703-30 = "Но даже если бы знала, я бы не стала относиться к вам иначе. Просто чтобы вы знали."
1002703-31 = ""
1002703-33 = ""
1002703-34 = "Эй-эй! Карин! Что ты делаешь? Опять такие простые ошибки!"
1002703-35 = "...?!"
1002703-36 = "[s] «...?!»"
1002703-37 = "Сколько раз тебе говорить называть всех посетителей «Господин»? Ну что за девочка!"
1002703-38 = "Ах!"
1002703-39 = "Д-Да. Я-я..."
1002703-40 = "Да, простите. Я буду внимательнее."
1002703-41 = "*вздох* Я знаю, что ты стараешься, но в таком кафе обращения действительно очень важны."
1002703-42 = "Пожалуйста, следи за этим внимательнее."
1002703-43 = "Д-Да."
1002703-44 = ""
1002703-46 = ""
1002703-47 = ""
1002703-48 = "Фух."
1002703-49 = "Чуть не попалась. Простите, Сенсей."
1002703-50 = "[s3] «Я же говорю, дело совсем не в этом.»\n[s4] «Пожалуйста, выслушай меня...»"
1002703-51 = "О, понятно. Конечно."
1002703-52 = "О, понятно. Конечно."
1002703-53 = "Чем больше мы это обсуждаем, тем выше шанс, что кто-нибудь узнает. Я буду осторожна!"
1002703-54 = "Вам совершенно не о чем волноваться, Сенсей."
1002703-55 = "Погодите, то есть..."
1002703-56 = "Ваш секрет в полной безопасности со мной, Господин. Доверьтесь мне."
1002703-57 = "А теперь вернёмся к делу. Добро пожаловать, Господин. Прошу сюда."
1002703-58 = ""
1002703-60 = ""
1002703-61 = "[ns] «...»"
1002703-63 = "В итоге недоразумение так и не разрешилось."
