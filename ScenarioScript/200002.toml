[translation]
200002-1 = "Episódio 2; A Carta da Presidente"
200002-4 = ""
200002-5 = "Atenção, cidadãos de Kivotos."
200002-6 = "Aqui é Nanagami Rin, chefe de gabinete e Presidente Interina do Conselho Estudantil Federal."
200002-7 = "Ultimamente, temos registrado um aumento preocupante de feridos por disparo acidental."
200002-8 = "Lembrem-se de que mesmo um leve esbarrão pode acionar o gatilho, portanto, nada de apontar a arma para os outros de bobeira."
200002-9 = "Além disso, mesmo após remover o carregador, sempre confiram se não ficou nenhuma bala na câmara.#nE não se esqueçam da manutenção periódica do cano da arma."
200002-10 = "Por fim, o uso de munição sem a homologação do Conselho Estudantil Federal é estritamente proibido.#nPela segurança de todos, contamos com a colaboração de vocês."
200002-11 = "Era este o comunicado do Conselho Estudantil Federal de Kivotos."
200002-12 = ""
200002-20 = "＜Este anúncio é um oferecimento do Conselho Estudantil Federal de Kivotos e do Departamento de Jornalismo da Chronos＞"
200002-21 = "＜Para dúvidas e informações sobre anúncios, entre em contato com o Departamento de Jornalismo da Chronos――＞"
200002-22 = ""
200002-23 = "Corta! Ficou per-fei-to!"
200002-24 = "...... Ai, que canseira."
200002-25 = ""
200002-27 = "Gabinete da Presidente Interina do Conselho Estudantil Federal"
200002-29 = "B-Bom trabalho pra todo mundo!"
200002-30 = "Obrigada pelo apoio nos preparativos, pessoal."
200002-31 = "As gravações de hoje finalmente acabaram?"
200002-32 = "Sim, sim. Já encerramos o aviso da nova lei de trânsito e o comercial da campanha de arrecadação de impostos."
200002-33 = "Obrigada por quebrar esse galho pro Departamento Financeiro."
200002-34 = ""
200002-36 = ""
200002-37 = ""
200002-38 = "Caraca, e a Rin-senpai ainda mandou tudo de primeira, hein?"
200002-39 = "Se fosse eu, mas nem a pau.#nRin-senpai, você é braba demais～"
200002-40 = "Quem sabe você não vira estrela de novela?"
200002-41 = "Uma coisa não tem nada a ver com a outra...#nNão é como se eu achasse o máximo ficar na frente das câmeras."
200002-42 = "Aliás... por que cargas d'água eu que tenho que fazer a propaganda de outros departamentos?"
200002-43 = "Não faria muito mais sentido a chefe de cada setor apresentar o seu?"
200002-45 = "B-Bom, é que......"
200002-46 = "Rin, meu anjo...... você tem noção de que você é a cara do Conselho Estudantil Federal?"
200002-47 = "Você tá sempre sob os holofotes, né?#nO povo vai engolir as medidas muito melhor vindo de você do que se fossem funcionárias desconhecidas como nós."
200002-48 = "Sem falar que esse era um trabalho que a própria Presidente sempre fazia.#nFoi mal, mas você vai ter que aceitar isso como parte do pacote de Presidente Interina."
200002-50 = "...... É, você tem razão.#nMais uma obrigação da Presidente......"
200002-51 = "Falando nisso...... ela adorava tirar fotos, né?#nVivia dizendo que não tem jeito melhor de guardar recordações."
200002-52 = "Se eu vou continuar nesse cargo, acho bom eu ir me acostumando com a câmera......"
200002-53 = ""
200002-55 = ""
200002-56 = "Por falar em foto, lembrei de uma coisa――"
200002-57 = "Ayumu. De onde veio aquela carta?"
200002-58 = "Hã?! C-Como assim?!"
200002-60 = "Ah...... a carta que eu te entreguei assim que você voltou da Arca, né?"
200002-61 = "Então...... me perdoa.#nEu só peguei da caixa de correio...... não tinha remetente nenhum."
200002-62 = "S-Será que tinha alguma coisa ruim escrita nela......? Tipo uma ameaça?!"
200002-63 = ""
200002-64 = "Não, não é nada disso......"
200002-65 = "É que a letra parecia muito com a da Presidente――"
200002-66 = "Da Presidente?!"
200002-67 = "Da Presidente do Conselho?"
200002-68 = "Uma carta da Presidente do Conselho Estudantil Federal?!"
200002-69 = ""
200002-71 = ""
200002-72 = ""
200002-73 = "...... Calma, gente, abaixem a bola.#nAinda não tem nada confirmado."
200002-74 = "É só que estava escrito \"Pra Rin-chan\" no envelope com uma caligrafia idêntica à dela, só isso......"
200002-75 = "Dentro nem tinha carta nenhuma."
200002-76 = "Em vez disso, tinha várias fotos que parecem ter sido tiradas pela Presidente."
200002-80 = "Eu me lembro da maioria delas, mas......"
200002-82 = "Hahaha! Não acredito que a Rin-senpai já teve essa carinha de novinha!#nDe quando é essa foto?"
200002-83 = "...... Momoka."
200002-84 = "Essa deve ser de...... uns dois anos atrás, eu acho.#nFoi na época em que a Presidente assumiu o cargo."
200002-85 = "Lembro que deu o maior bafafá por ela ser a aluna mais jovem da história a virar Presidente."
200002-87 = "E essa aqui é do...... acampamento de verão? Do ano passado? Retrasado?"
200002-88 = "...... Ano retrasado.#nMas enfim, eu não chamei vocês aqui pra gente ficar no momento nostalgia......"
200002-91 = "Dêem uma olhada nisso aqui."
200002-92 = "...... Uma foto em preto e branco?"
200002-93 = "Essa aí...... eu nunca vi na vida."
200002-94 = "Será que tacaram algum filtro vintage nela?"
200002-95 = "Provável. Hoje em dia ninguém usa câmera analógica...... ainda mais filme preto e branco, a não ser que seja muito aficionado."
200002-96 = ""
200002-97 = "Mas o que mais me intriga é o lugar onde a foto foi tirada."
200002-98 = "A Presidente que eu conhecia vivia atolada em trabalho no gabinete dia e noite.#nMesmo nos dias de folga, era raríssimo ela botar os pés pra fora do D.U."
200002-99 = "E ainda assim, vejam essa foto......#nAté onde eu saiba, não existe nenhum lago em D.U. tão gigantesco a ponto de se enxergar a linha do horizonte."
200002-100 = "Por acaso alguém aqui reconhece esse lugar?"
200002-103 = "Ué...... faço a menor ideia."
200002-105 = "No Próximo Episódio; Sonho Estranho"
