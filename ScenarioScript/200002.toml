[translation]
200002-1 = "Эпизод 2;Письмо президента ГCC"
200002-4 = ""
200002-5 = "Добрый день, жители Кивотоса."
200002-6 = "С вами Нанагами Рин, глава Контрольного отдела и исполняющая обязанности президента Генерального Студенческого Совета."
200002-7 = "Сегодня я обращаюсь к вам в связи с недавним ростом числа травм граждан из-за случайных выстрелов."
200002-8 = "Помните: огнестрельное оружие — смертельно опасный инструмент, и его нельзя направлять на человека, если вы не намерены стрелять. Также всегда соблюдайте правила обращения с оружием и после извлечения магазина проверяйте, что патронник пуст."
200002-9 = "Не допускайте попадания посторонних предметов в оружие, чтобы избежать загрязнения ствола, и не используйте и не приобретайте боеприпасы у продавцов, не авторизованных Генеральным Студенческим Советом."
200002-10 = "Ваши небольшие решения помогают сохранять Кивотос безопасным."
200002-11 = "Сообщение подготовлено Генеральным Студенческим Советом."
200002-12 = ""
200002-20 = "«Это социальное объявление одобрено Генеральным Студенческим Советом Кивотоса и Школой журналистики Кронос»."
200002-21 = "«По всем вопросам, связанным с рекламой, обращайтесь в Школу журналистики Кронос»."
200002-22 = ""
200002-23 = "Снято! Отличный дубль!"
200002-24 = "...Спасибо за вашу работу."
200002-25 = ""
200002-27 = "Исполнительный офис ГСС"
200002-29 = "О-Отличная работа, Рин."
200002-30 = "Спасибо, что организовали всё необходимое."
200002-31 = "Это был последний ролик на сегодня?"
200002-32 = "Да. Мы отсняли всё необходимое для объявления о введении нового Закона о дорожном движении и информационного ролика, поощряющего уплату налогов."
200002-33 = "Благодарю за помощь Казначейству."
200002-34 = ""
200002-36 = ""
200002-37 = ""
200002-38 = "Ого-о! Я в шоке, что ты смогла всё сделать с одного дубля, Рин."
200002-39 = "Я бы точно начала запинаться, если бы перед лицом стояла камера."
200002-40 = "Может, ты зря не стала актрисой?"
200002-41 = "Не сказала бы, что люблю находиться перед камерой."
200002-42 = "Но мне стало интересно... Разве другие отделы не должны сами заниматься съёмками? Конечно, работу Контрольного отдела я возьму на себя, но..."
200002-43 = "Мне кажется, послание было бы убедительнее, если бы главы соответствующих отделов сами представляли свою политику."
200002-45 = "Н-Ну, это—"
200002-46 = "Именно поэтому это должна быть ты. Для общественности именно ты — лицо Генерального Студенческого Совета, глава Рин."
200002-47 = "Граждане лучше воспринимают любые новости — плохие или хорошие — от знакомого лица, а не от какой-нибудь безликой начальницы, чьего имени они даже не знают."
200002-48 = "Президент Генерального Студенческого Совета во время своего срока тоже участвовала в таких рекламных роликах. Поэтому надеюсь, ты сможешь потерпеть эти неудобства."
200002-50 = "...Понятно. Работа президента Генерального Студенческого Совета."
200002-51 = "Если подумать, президент действительно любила фотографироваться при любой возможности. Говорила, что нет лучшего способа сохранить воспоминания."
200002-52 = "Полагаю, уверенно чувствовать себя перед камерой — ещё одна необходимость для человека у власти."
200002-53 = ""
200002-55 = ""
200002-56 = "Кстати о камерах..."
200002-57 = "Аюму, помнишь, откуда пришло это письмо?"
200002-58 = "Ч-что?!"
200002-60 = "А... То самое, которое я передала вам, когда мы вернулись с Ковчега."
200002-61 = "Прошу прощения! Оно смешалось с кучей другой почты, поэтому подтвердить личность отправителя будет трудно..."
200002-62 = "Э-Это письмо с угрозами?"
200002-63 = ""
200002-64 = "Нет-нет. Ничего такого."
200002-65 = "Просто... почерк был похож на почерк президента—"
200002-66 = "Президента Генерального Студенческого Совета?"
200002-67 = "Ты сказала президента Генерального Студенческого Совета?"
200002-68 = "Президент написала тебе письмо?!"
200002-69 = ""
200002-71 = ""
200002-72 = ""
200002-73 = "...Пожалуйста, успокойтесь. Ничего не подтверждено."
200002-74 = "Знакомым показалось только «Для Ринни», написанное снаружи конверта."
200002-75 = "Но самого письма внутри не было."
200002-76 = "Вместо него там лежало несколько фотографий. Хотя, похоже, их действительно сделала она."
200002-80 = "Большинство из них я, впрочем, помню..."
200002-82 = "Ха-ха, а это когда было? Не могу поверить, что это ты, Рин."
200002-83 = "...Момока."
200002-84 = "Это было два года назад. Сразу после избрания президента Генерального Студенческого Совета."
200002-85 = "А, помню. Все новостные станции тогда шумели, потому что она стала самым молодым президентом в истории."
200002-87 = "А это с нашего летнего лагеря, да?"
200002-88 = "...Да. Но я показывала вам фотографии не ради ностальгии."
200002-91 = "Вот ради этой."
200002-92 = "Почему она чёрно-белая?"
200002-93 = "Кажется, я раньше её не видела..."
200002-94 = "Её могли напечатать со специальным фильтром или обработать уже после съёмки."
200002-95 = "Поскольку сейчас почти все снимки цифровые, это наиболее вероятно. Плёнка слишком редка, а чёрно-белая — тем более."
200002-96 = ""
200002-97 = "Меня беспокоит место, где сделан этот снимок."
200002-98 = "Та президент Генерального Студенческого Совета, которую я знала, всегда была полностью завалена работой и фактически жила в здании Совета. Даже в выходные она почти не покидала Д.У."
200002-99 = "Это озеро... и фон... Я никогда их не видела."
200002-100 = "Кто-нибудь узнаёт это место?"
200002-103 = "Нет, не думаю..."
200002-105 = "Следующий Эпизод;Странный сон"
