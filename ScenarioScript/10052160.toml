[translation]
10052160-1 = "Малкут, Паломница Королевства на Краю Мира"
10052160-2 = "[ns] «Куда делись дети?!»"
10052160-3 = "Кажется... они нашли место, где спрятаться."
10052160-4 = "Мы проделали такой долгий путь и всё ещё не знаем их мотивов."
10052160-5 = "Да... Но мне почему-то кажется, что мы можем с ними подружиться."
10052160-6 = "...Наивная мысль, Арис. Но я тоже считаю, что здесь что-то странное."
10052160-7 = "Они без конца твердят, что делают всё это ради нас."
10052160-8 = "Но даже загнанные в угол не раскрыли ничего больше."
10052160-9 = "Ага. Хотя бы могли потянуть время. Они действуют неэффективно."
10052160-10 = "А может, им изначально нечего было сказать, потому что они сделали это не задумываясь."
10052160-11 = "Нет... Как бы это ни выглядело, они не просто дети, играющие в песочнице."
10052160-12 = ""
10052160-14 = ""
10052160-15 = "Ну, четыре генерала повелителя демонов и подобные типажи обычно просто выполняют приказы и ничего полезного сказать не могут!"
10052160-16 = "Так что будем считать, что сэкономили время!"
10052160-17 = "Сестрёнка, а что если у них действительно были какие-то неизбежные обстоятельства...?"
10052160-18 = "Н-ну, какими бы неизбежными они ни были, о-они всё равно не должны... делать такое..."
10052160-20 = "Д-думаю, здесь всё будет нормально...! О-они нас тут не увидят..."
10052160-21 = ""
10052160-22 = "Ух... Тяжело."
10052160-23 = "...Но всё равно я немного раздражена."
10052160-24 = ""
10052160-26 = ""
10052160-27 = "Вы в порядке, Эйн, Соф и Ор?"
10052160-28 = "Д-да...! М-мы в порядке! У нас, у нас всё ещё есть ты, старшая сестра...!"
10052160-29 = ""
10052160-31 = ""
10052160-32 = ""
10052160-33 = ""
10052160-34 = "Мы совершенно в порядке! Эм... Думаю, Эйн немного устала. Она потом проснётся, так что о нас можете не беспокоиться."
10052160-35 = ""
10052160-37 = ""
10052160-38 = ""
10052160-39 = ""
10052160-40 = "Вам обеим не хватает стойкости. Такими темпами...!"
10052160-41 = ""
10052160-43 = ""
10052160-44 = ""
10052160-46 = "..."
10052160-47 = "Эйн, Соф, Ор."
10052160-48 = "Стальной континент был создан по вашей собственной воле, верно?"
10052160-49 = "Д-да... и что?"
10052160-50 = "Когда я узнала об этом, я была рада."
10052160-51 = "Но даже я не понимаю, что вы от этого получаете."
10052160-52 = "Никакое низменное оправдание не может защитить решение поглотить Кивотос целиком."
10052160-53 = "П-потому что..."
10052160-54 = "Я пришла не для того, чтобы вас отчитывать."
10052160-55 = "Причина, по которой вы так неотступны в этой затее..."
10052160-56 = "Почему вы скрывали эту информацию не только от Сенсея, но и от меня..."
10052160-57 = "Я не могла не заинтересоваться."
10052160-58 = "Разве не эта одержимость Стальным континентом привела нас сюда?"
10052160-59 = "..."
10052160-60 = "Прости нас, старшая сестра."
10052160-61 = "Но есть причина, почему мы не можем тебе рассказать."
10052160-62 = "...Более того, есть причина, по которой... Мы не можем позволить, чтобы подробности вышли во внешний мир в форме... слов."
10052160-63 = "Но поверь нам. Всё, что мы делаем, — ради нашей старшей сестры..."
10052160-64 = ""
10052160-66 = ""
10052160-67 = "Нет. Ради нас и старшей сестры."
10052160-68 = "Ради всех нас?"
10052160-69 = "Моё недоумение лишь усиливается."
10052160-70 = "Старшая сестра, знаешь..."
10052160-71 = "Да, Соф. Продолжай."
10052160-72 = ""
10052160-74 = ""
10052160-75 = "Ты... хочешь жить?"
10052160-76 = "Хм?"
10052160-77 = "..."
10052160-78 = "Прошу прощения. Я не понимаю."
10052160-79 = "Пока существо обладает сознанием, для него естественно желать жить. В этом смысле — да. Хочу."
10052160-80 = "Однако, Эйн, Соф и Ор."
10052160-81 = "Разве вы не знали этого и без того?"
10052160-82 = "Да. Знали. Конечно знали. Уверена, мы вчетвером понимаем это лучше кого-либо."
10052160-83 = "Но всё равно мы... хотим жить."
10052160-84 = "Мы хотим жить... вечно вместе с тобой, старшая сестра."
10052160-85 = "Это значит..."
10052160-86 = "...!"
10052160-87 = "Понятно."
10052160-88 = "Хотя кое-что по-прежнему остаётся за пределами моего понимания, это чувство... Это чувство я могу понять."
10052160-89 = "А-Ах..."
10052160-90 = "..."
10052160-91 = "Прости нас, старшая сестра. У нас осталось..."
10052160-92 = "Да. Я знаю."
10052160-93 = "Тогда отныне, пожалуйста, доверьтесь мне."
10052160-94 = "Ради нашего хозяина и моих драгоценных сестёр."
10052160-96 = ""
10052160-97 = "Все, туда!"
10052160-98 = ""
10052160-100 = ""
10052160-102 = "Это финальная битва с повелителем демонов?"
10052160-103 = "Да. Думаю, это подходящая аналогия, временами проницательная Момои."
10052160-104 = "Эм, Токи? Мне просто интересно, сколько у тебя вообще таких прозвищ для меня?"
10052160-105 = "Вы правда хотите знать?"
10052160-106 = "Нет-нет... Всё нормально..."
10052160-107 = "Можете вы ВСЕ, ПОЖАЛУЙСТА, сосредоточиться?!"
