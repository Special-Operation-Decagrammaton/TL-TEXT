[translation]
51130-1 = "Эпизод 13;Кирю Кикё и Поединок за преемство 2"
51130-8 = "*тяжело дышит*..."
51130-9 = "[s] «Ты можешь встать? Юкари!»"
51130-10 = "Я... Я в порядке!"
51130-11 = "Это правда необходимо?!"
51130-12 = "Вы заходите слишком далеко..."
51130-13 = ""
51130-15 = ""
51130-17 = "Нет. Не захожу. Таков Поединок за преемство Хяккарёран."
51130-18 = "Посмотри в лицо тяжести своей реальности, Кадэнокодзи."
51130-19 = "Проблема не в том, чтобы найти свидетеля для твоего Поединка за преемство. Нагуса — непреодолимая стена, через которую тебе не пройти."
51130-20 = "Реальность не прогнётся под одними лишь чувствами. Твои мечты невозможны."
51130-22 = "... ..."
51130-23 = "Это... Я просто..."
51130-24 = "Я лишь хотела, чтобы всё вернулось в норму... Чтобы мы снова стали Хяккарёран..."
51130-26 = "Вернуться? Вернуться к чему?"
51130-27 = "Твоё легкомыслие оскорбительно."
51130-28 = "Победить Нагусу? Возглавить Хяккарёран?"
51130-29 = "Как? Ты даже меня победить не можешь."
51130-30 = "Этому детскому поведению пора положить конец."
51130-31 = "Потому что разве это действительно твоё желание? «Вернуться»?"
51130-32 = ""
51130-35 = ""
51130-36 = "Мы все знаем, что это неправда."
51130-37 = "Тебе следует вернуться домой, госпожа Кадэнокодзи. Игры окончены."
51130-38 = ""
51130-40 = ""
51130-41 = "[ns1] «Кикё, ты ведь сама так не думаешь.»\n[ns2] «Юкари совершенно серьёзна. Ещё вчера...»"
51130-44 = "Если вы так считаете, ответьте мне на один вопрос, Сенсей из Шале."
51130-45 = "Наша госпожа рассказала вам всё, прежде чем просить о помощи?"
51130-46 = "Обязанности, которые несёт принадлежность к семье Кадэнокодзи, тяжёлые, и от них не уйти."
51130-47 = "И всё же она продолжает пренебрегать ответственностью, чтобы вместо этого играть в семью с Хяккарёран."
51130-48 = "Она хоть что-нибудь рассказала вам о жизни, которой с вашей помощью пренебрегает?"
51130-49 = ""
51130-52 = ""
51130-54 = "...Иного я и не ожидала."
51130-55 = "Теперь понимаете, Сенсей? Вы были ещё одним персонажем в её грандиозном спектакле."
51130-56 = "Кадэнокодзи Юкари. В отличие от тебя, Хяккарёран — это всё, что у нас есть."
51130-57 = "Мы потеряем Хяккарёран и останемся ни с чем. А ты вернёшься в свои роскошные залы и к своей богатой жизни."
51130-58 = "Поэтому слышать от тебя разговоры о Поединке за преемство, о том, что ты станешь спасительницей от всех наших проблем..."
51130-59 = ""
51130-61 = ""
51130-62 = "Это неприятно."
51130-63 = "У тебя есть своя роль в обществе. И, позволь сказать прямо, она не связана с Хяккарёран."
51130-64 = "..."
51130-66 = "Пора взглянуть реальности в лицо."
51130-67 = "Игры с Хяккарёран окончены, госпожа Кадэнокодзи."
51130-68 = "Неужели... Вот как вы меня видите, Кикё?"
51130-69 = "Ты хоть раз слышала, чтобы я говорила то, чего не думаю? Ты раздражаешь не меньше, чем в детстве."
51130-70 = "Иллюзии были только у тебя."
51130-71 = ""
51130-73 = ""
51130-74 = ""
51130-76 = "Я... в глубине души понимала всё, что вы сказали!"
51130-77 = ""
51130-79 = ""
51130-80 = "Я не настолько слепа, чтобы думать, будто смогу так легко победить Нагусу."
51130-81 = "Я понимала, что мои шансы победить в Поединке за преемство почти равны нулю."
51130-82 = "Я не питала иллюзий!"
51130-83 = "..."
51130-84 = "[s] «Юкари...»"
51130-85 = ""
51130-87 = ""
51130-88 = "И несмотря на всё это... Да. Я хотела вернуться. Правда хотела!"
51130-91 = "Я хочу, чтобы президент Клуба Инь-Ян засвидетельствовала мой Поединок за преемство Хяккарёран!"
51130-93 = "У меня не было другого выхода! Я просто подумала, что... если провести Поединок за преемство..."
51130-94 = "Если я просто смогу победить Нагусу...! Тогда я стану президентом, а потом... А потом..."
51130-98 = "Тогда мы сможем вернуться..."
51130-100 = "Если бы я просто смогла всё это сделать, тогда все снова улыбались бы!"
51130-101 = "Вот что я думала..."
51130-102 = "Но сначала Рэнгэ, а теперь и Кикё... Похоже, все ждут, что я откажусь от своих надежд."
51130-103 = "Как я могу просто бросить воспоминания о том, как наш смех наполнял комнату, когда мы были вместе?"
51130-104 = "... *вздох*"
51130-105 = ""
51130-107 = ""
51130-108 = ""
51130-109 = "Похоже, моя незрелость превратила меня в обузу..."
51130-110 = "Я... простите, все. Сенсей."
51130-111 = ""
51130-113 = ""
51130-115 = "[ns] «Нет, Юкари! Вернись!»"
51130-116 = ""
51130-117 = "Почему вы так упорно вмешиваетесь в дела, о которых ничего не знаете?"
51130-118 = "Юкари гонится за тенью мечты. Наш путь оказался высечен в камне в тот момент, когда Нагуса отказалась от своей должности."
51130-119 = "Слухи почти мгновенно разлетелись среди членов клуба, словно лесной пожар."
51130-120 = "Шёпот становился всё громче: «Хяккарёран конец»."
51130-121 = "Мы сделали то, что должны были сделать в ответ. Вот чего вы не понимаете, посторонний."
51130-122 = "Этот ребёнок боготворил едва ли не сам воздух, которым дышала Нагуса."
51130-123 = "И нашей обязанностью было отправить её домой прежде, чем последствия причинят ей боль."
51130-124 = "Вот... Вот как мы её защищаем."
51130-125 = "Она не понимает. Разбитое зеркало уже не собрать заново."
51130-126 = "Те из нас, кто остался, продолжат нести бремя, о котором она скоро забудет."
51130-128 = "[ns] «Ты ошибаешься. Во всём.»"
51130-129 = ""
51130-131 = ""
51130-132 = "...Простите?"
51130-133 = "[s] «Это ты переходишь границы, Кикё.»"
51130-135 = "[ns] «Ты правда любишь свой клуб, Юкари.»"
51130-136 = "Да!"
51130-137 = "Это естественно."
51130-138 = "Хяккарёран... это клуб, которым я всегда восхищалась."
51130-140 = "[ns] «Юкари имеет право сама решать, как хочет прожить свою жизнь.»"
51130-141 = "Как вы смеете..."
51130-142 = ""
51130-145 = ""
51130-146 = "Я понимаю, что это не моё дело, но не могу не согласиться с Сенсеем."
51130-147 = "...И что же президент Фестивального отдела хочет сказать по этому поводу?"
51130-148 = "Место человека в этом мире..."
51130-149 = ""
51130-151 = ""
51130-153 = "Разве смысл жизни не в том, чтобы самому понять, где оно?"
51130-155 = ""
51130-157 = ""
51130-159 = "Вы говорите, что это ради неё самой, что так она будет счастливее, но простите..."
51130-160 = "Это просто неправильно."
51130-161 = ""
51130-163 = ""
51130-165 = ""
51130-166 = "[ns] «Юкари сама сказала: она знала, что проиграет Поединок за преемство.»"
51130-168 = "[ns] «Разве она не хваталась за любой повод, лишь бы снова увидеться со всеми?»"
51130-169 = "...Говорите что хотите."
51130-170 = "Это ничего... Это ничего не меняет."
51130-171 = "Я сказала правду. Вот и всё."
51130-172 = "[s] «Правда? Ты действительно считаешь Юкари легкомысленной? Что она просто играет в семью?»"
51130-173 = ""
51130-175 = ""
51130-176 = "[ns3] «Ложь ради защиты всё равно остаётся ложью...»\n[ns4] «Ты просто наговорила ей вещей, которые ранили её.»"
51130-179 = "...!!"
51130-180 = "Кхм! П-Почему бы пока не сосредоточиться на том, что мы можем сделать?"
51130-181 = "Давайте сначала найдём Кадэно— то есть Юкари."
51130-182 = "[s] «Пойдём, Шизуко.»"
51130-183 = ""
51130-191 = ""
51130-192 = ""
51130-193 = ""
51130-199 = ""
51130-200 = "Чего они от меня хотят?"
51130-201 = ""
51130-203 = ""
51130-205 = "..."
51130-206 = "На самом деле они хотят... тебя."
51130-207 = "Все смотрят на пустое место, которое ты оставила, Нагуса..."
51130-208 = ""
51130-210 = ""
51130-211 = "..."
51130-212 = ""
51130-214 = ""
51130-216 = ""
51130-222 = ""
51130-224 = "...Рэнгэ? Это я."
51130-227 = "Хяккарёран весь день нами помыкает!"
51130-228 = "Нас уже наполовину избили, а фестиваль ещё даже не начался!"
51130-229 = ""
51130-231 = ""
51130-233 = "Может, пора сдаться, главарь..."
51130-234 = "Ага! Давайте просто забудем обо всём этом и повеселимся на большом фестивале, главарь?"
51130-235 = "Он скоро начнётся, так что нам уже пора идти!"
51130-237 = "Хм... Вообще-то звучит вроде неплохо? Наверное?"
51130-238 = "В конце концов, кто-то великий однажды сказал: только идиоты глазеют на дерево, на которое не могут забраться!"
51130-239 = ""
51130-242 = ""
51130-243 = "(П-Правда? Кто...?)"
51130-245 = "Да не в этом дело!"
51130-246 = "Мы же Моурё, народ! Злая организация, способная рассмешить даже плачущего ребёнка!"
51130-247 = ""
51130-250 = ""
51130-251 = "(Это вообще не звучит как что-то злое...)"
51130-253 = "Мы самые большие и самые страшные! Нельзя просто поджать хвост и спрятаться!"
51130-254 = "Я не сдамся! Именно сейчас главарь должен проявить себя и показать пример!"
51130-255 = "Для нашего главаря это может быть чутка сложновато..."
51130-256 = ""
51130-258 = ""
51130-259 = "Что?!"
51130-260 = ""
51130-262 = ""
51130-263 = "Ничего! Я ничего не сказала!"
51130-264 = "Угх! Мы не сдаёмся! Я больше никогда не усну, если не отомщу!"
51130-265 = ""
51130-269 = "Ох. Ну и жалкое же вы зрелище."
51130-270 = "Фестивали созданы для веселья и радости. Я просто не могу закрыть глаза на такие унылые лица в столь счастливое время."
51130-271 = "Не могу. И не стану!"
51130-272 = ""
51130-275 = ""
51130-276 = "К-Кто здесь?"
51130-277 = ""
51130-281 = ""
51130-282 = "Идите сюда. Я протяну вам лапку помощи."
51130-283 = "Хи-хи... Хотя я, разумеется, никакая не кошка."
51130-284 = ""
51130-286 = ""
51130-288 = "Так или иначе, не хотите немного помощи?"
51130-290 = "Следующий эпизод;Решительная девушка"
