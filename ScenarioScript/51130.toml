[translation]
51130-1 = "Episódio 13;Kikyou Kiryuu e o Torneio de Sucessão (2)"
51130-8 = "Arf... arf..."
51130-9 = "[s] \"Yukari!\""
51130-10 = "E-Eu... estou bem..."
51130-11 = "N-Não precisava ir tão longe assim..."
51130-12 = "Isso não é um pouco cruel demais?!"
51130-17 = "Este é o Torneio de Sucessão de Hyakkaryouran."
51130-18 = "Entendeu agora? Esta é a realidade."
51130-19 = "Mesmo que faça um \"Torneio de Sucessão\" contra a Nagusa-senpai, você nunca venceria."
51130-20 = "Seu capricho não passa de um conto de fadas.#nDesde o início, era só uma brincadeira egoísta de casinha."
51130-22 = "E-Eu..."
51130-23 = "Eu apenas..."
51130-24 = "Só queria recuperar aqueles dias... em que todas nós atuávamos juntas como Hyakkaryouran..."
51130-26 = "Hah..."
51130-27 = "Não me faça rir."
51130-28 = "Você diz que vai derrotar a Nagusa-senpai e se tornar a Presidente, mas..."
51130-29 = "Se não consegue vencer nem a mim, isso nem sequer pode ser chamado de sonho."
51130-30 = "...Diferente da Renge, eu não sou boazinha, então vou perguntar diretamente."
51130-31 = "Você acha mesmo que derrotando a Nagusa-senpai tudo vai voltar ao normal?"
51130-36 = "Não consegue responder, não é?"
51130-37 = "Afinal, o próprio fato de você estar em Hyakkaryouran#nnão passa de um passatempo até herdar a sua família."
51130-41 = "[ns1] \"Kikyou...\"\n[ns2] \"Isso é—\""
51130-44 = "Deixe-me perguntar uma coisa ao Sensei de Schale."
51130-45 = "Essa senhorita aí contou tudo para você antes de pedir ajuda?"
51130-46 = "Que ela pertence à família Kadenokouji e tem um \"dever\" por ter nascido nela."
51130-47 = "— Mas que, por puro capricho, quer continuar nas atividades de Hyakkaryouran."
51130-48 = "Você ouviu sobre esses assuntos familiares direito, da própria boca dela?"
51130-54 = "É claro que não."
51130-55 = "Porque tudo isso não passa de uma brincadeira."
51130-56 = "Mesmo se Hyakkaryouran desaparecer, você ainda tem um lugar para onde voltar."
51130-57 = "Desde o começo, você é diferente de nós."
51130-58 = "Tente se colocar no meu lugar, tendo que aturar os sonhos ingênuos de alguém como você..."
51130-62 = "Sério, sinceramente... me dá nojo."
51130-63 = "Dá para encerrar essa brincadeira de senhorita por aqui?#nEi, já acordou do seu sonho?"
51130-64 = "......"
51130-66 = "Que tal admitir logo?"
51130-67 = "A brincadeira de Hyakkaryouran já acabou."
51130-68 = "Kikyou-senpai... você sempre me viu dessa maneira...?"
51130-69 = "Sim. Você não faz ideia do quanto era irritante."
51130-70 = "Pela sua cara, parece que você nem tinha percebido."
51130-76 = "Desde o início..."
51130-80 = "...Desde o início, eu sabia que não seria páreo para a Nagusa-senpai..."
51130-81 = "Que eu não tinha a menor chance de vencer..."
51130-82 = "Eu estava plenamente ciente disso..."
51130-83 = "......"
51130-84 = "[s] \"Yukari...\""
51130-88 = "Ainda assim... ainda assim, eu queria recuperá-los..."
51130-91 = "Por favor, seja testemunha do \"Torneio de Sucessão de Hyakkaryouran\"!"
51130-93 = "Se ao menos o Torneio de Sucessão fosse reconhecido..."
51130-94 = "Se ao menos eu pudesse derrotar a Nagusa-senpai e assumir o cargo de Presidente..."
51130-98 = "Aquele dia... aquele tempo..."
51130-100 = "Eu acreditei que poderia recuperar os dias tranquilos que passava com todas vocês..."
51130-101 = "...Mas tanto a Renge-senpai quanto a Kikyou-senpai..."
51130-102 = "Dizem que Hyakkaryouran já acabou... que não podemos mais voltar àqueles dias..."
51130-103 = "Eu só sentia tanta saudade do tempo que passava com vocês...!"
51130-104 = "Ugh...!"
51130-109 = "...Sensei."
51130-110 = "Por todo o transtorno que causei... eu sinto... muitíssimo mesmo..."
51130-115 = "[ns] \"Espera! Yukari—\""
51130-117 = "Já estava tudo acabado... por que insistir até esse ponto..."
51130-118 = "Desde o momento em que a Nagusa-senpai tentou devolver a \"Prova\", já era óbvio que ia terminar assim."
51130-119 = "Todo mundo dizia a mesma coisa..."
51130-120 = "Que era o fim de Hyakkaryouran, que tudo tinha se quebrado."
51130-121 = "Então, pôr um fim nisso antes que se despedace de vez é um ato de compaixão, não é...?"
51130-122 = "Antes que ela, que admirava a Nagusa-senpai mais do que ninguém, se machuque ainda mais—"
51130-123 = "Ela ainda tem um lugar para onde voltar... antes que isso vire uma ferida profunda demais..."
51130-124 = "Por isso, assim foi melhor.#nSim... assim."
51130-125 = "Algo que se rachou uma vez nunca mais volta à sua forma original."
51130-126 = "Portanto, basta que só eu... fique para trás."
51130-128 = "[ns] \"Kikyou, isso não é verdade.\""
51130-132 = "...?"
51130-133 = "[s] \"Não cabe a outra pessoa decidir isso.\""
51130-135 = "[ns] \"A Yukari realmente ama Hyakkaryouran, não é?\""
51130-136 = "Sim!"
51130-137 = "Hyakkaryouran é—"
51130-138 = "Tudo o que eu mais admiro."
51130-140 = "[ns] \"Os sentimentos da Yukari pertencem só a ela.\""
51130-141 = "...O que um forasteiro como você pode saber sobre nós?"
51130-146 = "Com licença... talvez eu não devesse me intrometer, mas..."
51130-147 = "...Até você?"
51130-148 = "Quem decide onde é o seu lugar..."
51130-153 = "Não é outra pessoa, e sim você mesma, eu acho."
51130-159 = "Mesmo que esteja pensando no bem da outra pessoa..."
51130-160 = "Eu acho... que não se deve impor isso a ela. Pelo menos, seria melhor ouvir o lado dela direito e conversarem sobre isso..."
51130-166 = "[ns] \"Parece que a própria Yukari sabia que quase não tinha chances de vencer.\""
51130-168 = "[ns] \"Mas, com certeza, ela só queria um motivo para ver todas vocês.\""
51130-169 = "...De que adianta dizer isso agora?"
51130-170 = "A Yukari já..."
51130-171 = "Além disso... eu não acho que disse nada de errado—"
51130-172 = "[s] \"Você realmente acha que é só uma 'brincadeira', Kikyou?\""
51130-176 = "[ns3] \"Se isso for só um pretexto pensando no bem dela...\"\n[ns4] \"Só vai acabar machucando vocês duas.\""
51130-179 = "...!!"
51130-180 = "...Sensei! Não temos tempo a perder!"
51130-181 = "Vamos procurar a Kadenokouji-san... quero dizer, a Yukari-san!"
51130-182 = "[s] \"Sim. Vamos lá.\""
51130-200 = "...O que querem que eu faça?"
51130-205 = "......"
51130-206 = "De quem nós precisamos..."
51130-207 = "É de você, Nagusa-senpai..."
51130-211 = "......"
51130-224 = "Renge...? Sim, sou eu."
51130-227 = "...Tsc!"
51130-228 = "Justo às vésperas do festival, e a gente só leva surra de Hyakkaryouran!"
51130-233 = "Chefe, não tá na hora de desistir não...?"
51130-234 = "É verdade, vamos só curtir o festival de boa..."
51130-235 = "Concordo plenamente!"
51130-237 = "Hmm... será que eu devia mesmo...?"
51130-238 = "Acho que algum sábio por aí disse: \"Aprenda a se contentar com o que tem\"."
51130-243 = "(Quem terá sido...)"
51130-245 = "Mas, contudo, todavia!"
51130-246 = "Nós somos a Trupe Chimi, que faz até criança chorona cair na gargalhada!"
51130-251 = "(Isso não quer dizer que estão rindo da nossa cara...?)"
51130-253 = "Não posso recuar tão facilmente assim...!"
51130-254 = "Como líder, tenho que dar o exemplo e mostrar que nunca desisto...!"
51130-255 = "Olha, ninguém aqui espera isso de você, chefe..."
51130-259 = "Como é que é?!"
51130-263 = "A-Abaixo o peteleco na testa!"
51130-264 = "Grr... De qualquer jeito, desse jeito vou ficar com tanta raiva que nem vou conseguir dormir!"
51130-269 = "...Ora, ora... que situação complicada."
51130-270 = "Logo num dia de festival tão, tão alegre,#nhaver alguém afogado em tristeza assim..."
51130-271 = "Sim. Eu acho isso muito, muiiito... lamentável."
51130-276 = "...Q-Quem está aí?!"
51130-282 = "Posso emprestar uma mãozinha, sabia?#nVocês estão tão desesperados que aceitariam até a pata de um gato, não é?"
51130-283 = "Hihi... Embora eu não seja um gato, sabe."
51130-288 = "— Precisam de uma pata de gato?"
51130-290 = "Próximo;A Determinação da Garota"
