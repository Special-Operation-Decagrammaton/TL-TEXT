[translation]
212040-1 = "Episódio 04;Gehenna Unida"
212040-2 = "Sociedade Pandemônio - Sala de Comando Tático"
212040-3 = ""
212040-4 = "Até hoje, preciosos recursos bélicos vinham sendo desperdiçados em nome de uma suposta liberdade."
212040-5 = "De agora em diante, todo e qualquer suprimento existirá [ruby=・]a[/ruby][ruby=・]p[/ruby][ruby=・]e[/ruby][ruby=・]n[/ruby][ruby=・]a[/ruby][ruby=・]s[/ruby] em benefício da glória suprema de Gehenna!"
212040-10 = ""
212040-11 = ""
212040-14 = "Interrompam a circulação interna do distrito. Todos os estoques de rações e munições devem ser transferidos aos depósitos militares."
212040-15 = "As instalações atuais serão insuficientes. Ordenem ao Departamento de Fontes Termais que construa oito novos armazéns classe M imediatamente."
212040-16 = "Utilizem a área do parque no setor leste da academia. Foi construído por decreto meu no passado, mas diante da grandeza desta guerra, tais caprichos são irrelevantes."
212040-17 = "Até a deflagração da ofensiva, o controle de fronteira será absoluto. Qualquer transmissão de rádio ou rede com o exterior deve ser impiedosamente interceptada."
212040-18 = "Executem tudo sem a menor falha!"
212040-19 = ""
212040-21 = ""
212040-23 = "Enfrentar Kivotos inteira de uma só vez...... sem dúvida será uma campanha vigorosa."
212040-24 = "Mas é apenas isso: um desafio vigoroso. De forma alguma impossível."
212040-25 = ""
212040-27 = ""
212040-28 = "Hina, como estão os preparativos do Comitê de Disciplina?"
212040-29 = ""
212040-31 = ""
212040-33 = ""
212040-34 = "Os planos de ataque cirúrgico aos quartéis-generais de cada academia estão finalizados.#nSe o elemento surpresa funcionar, liquidaremos todas as defesas centrais em menos de 30 minutos."
212040-35 = "A simulação de consumo de artilharia também foi calculada. Com a nossa reserva atual, sustentamos 48 horas ininterruptas de bombardeio devastador sobre os centros administrativos rivais."
212040-36 = "E isso sem contar os estoques civis apreendidos. Se confiscarmos os estoques de todo o distrito, prolongamos o cerco indefinidamente.#nEmbora duvide muito que os inimigos resistam por tanto tempo."
212040-37 = "Figuras individuais de destaque podem ser ignoradas.#nComo a vitória virá em curto prazo, resistências isoladas são irrelevantes no quadro geral."
212040-38 = "E se for estritamente necessário, eu mesma vou até a linha de frente e extermino as pendências."
212040-40 = "Kwahaha! Esta sim é a formidável Sorasaki Hina!#nUma garota que sempre teve preguiça de tudo, bastou ganhar um objetivo nobre para virar uma máquina de guerra impiedosa e letal!"
212040-41 = "Isto é o que chamo de ter um senso de propósito genuíno."
212040-42 = "Minha mente só pensa em pintar o mapa de Kivotos inteiro com as cores de Gehenna."
212040-43 = "Excelente."
212040-44 = ""
212040-48 = ""
212040-49 = "Com a devida vênia, líderes, permitiriam uma sugestão estratégica?"
212040-51 = "Ora, se não é Igarashi Shoko, nossa assessora de operações! Tem a palavra."
212040-52 = "Apenas com o poder bélico convencional de Gehenna, temo que imprevistos possam ameaçar o cronograma."
212040-53 = "Para garantir uma vitória incontestável, recomendo acelerar o desenvolvimento bélico.#nPor exemplo...... o desenvolvimento de uma arma estratégica capaz de aniquilar a moral inimiga com um único disparo."
212040-54 = "Ah, essa questão já estava em meus planos."
212040-55 = "A finada Imperatriz do Trovão era uma inventora e engenheira genial.#nMandarei reproduzir o arsenal deixado por ela em versões ainda mais mortíferas."
212040-56 = "Isso é possível? Pensei que todo o legado da Imperatriz do Trovão tivesse sido incinerado."
212040-57 = "Sorasaki Hina! Por quem você me toma?!"
212040-58 = "Quem mais conhece as engrenagens daquela mulher neste mundo sou eu, a grande Makoto!#nEu dissequei e analisei cada parafuso daquelas criações!"
212040-59 = "Todo o meu suor para derrotar a Imperatriz agora se converte no nosso maior trunfo de guerra.#nÉ uma ironia poética deliciosa, kwahaha!"
212040-60 = "......Se é assim, por mim tudo bem."
212040-62 = "Em suma...... a nobre chama da grande Imperatriz do Trovão voltará a arder nesta academia.#nPelas mãos visionárias da líder Makoto!"
212040-64 = "Kwahaha! Trata-se apenas de usar as ferramentas certas na hora certa."
212040-65 = "――Aliás, cadê os outros membros da diretoria da Sociedade Pandemônio?#nEnquanto a Disciplina e a Restauração trabalham duro, não vejo meus próprios assessores!"
212040-66 = "Creio que estejam atarefadas com suas obrigações setoriais."
212040-67 = "Sei não. Seja qual for o motivo, demonstraram hesitação quanto à declaração de guerra."
212040-68 = "......Do nosso lado a situação foi parecida. As opiniões no escalão inferior se dividiram."
212040-69 = "Tsc! Por que essa incapacidade crônica de enxergar a grande causa?!"
212040-70 = "Ficam choramingando com sentimentalismos fracos de covarde......"
212040-72 = "Mudam-se as circunstâncias, mudam-se as posturas. É compreensível, porém deveras lamentável."
212040-73 = "Mentes que não atingiram a iluminação não compreendem o quadro geral. A confusão delas é natural."
212040-74 = "Antes de marcharmos contra o mundo exterior, devemos considerar o aperto do cerco interno."
212040-75 = "Kwahaha! Muito bem colocado! Somente quando todas estiverem unidas seremos verdadeiramente invencíveis!"
212040-78 = ""
212040-79 = "Atenção! Por ordem superior, todas as munições de uso pessoal estão confiscadas!"
212040-80 = "Quê?! Mas eu acabei de comprar essa caixa ontem na lojinha!"
212040-81 = "Diante da iminência de um conflito total, sua posse pessoal não tem relevância alguma."
212040-82 = "Ei, como assim?! Eu não tenho nada a ver com essa doideira de vocês, e a munição é MINHA!"
212040-83 = "A guerra de sobrevivência de Gehenna está prestes a começar, aluna!"
212040-84 = "E o que eu tenho a ver com isso, meu Deus do céu?!"
212040-85 = ""
212040-89 = ""
212040-90 = "Paradas aí. Qualquer resistência posterior será tratada como crime de traição sob a Lei Marcial de Emergência."
212040-91 = ""
212040-93 = ""
212040-94 = "Comitê de Disciplina! Que bom que vocês chegaram!#nElas tão querendo roubar as minhas balas na mão grande! Dá um jeito nelas!"
212040-95 = "Artigo 8º da Lei Marcial de Emergência:#n'Em situação de ameaça à existência da academia, todo o material bélico disponível reverte-se ao Comando Unificado de Gehenna'. Sem exceções."
212040-96 = "O quê?!#nDe onde saiu esse artigo bizarro que nunca existiu?!"
212040-97 = "Não compare a anarquia do passado com a ordem marcial de agora.#nGehenna enfrentará Kivotos. A propriedade privada se curva ao esforço de guerra."
212040-98 = "Este decreto foi assinado conjuntamente pela Presidente da Disciplina e pela Líder da Pandemonium. Entregue tudo por bem."
212040-99 = "Ou prefere levar o carimbo de traidora e apodrecer na solitária da prisão disciplinar?"
212040-100 = "Traidora......? Mas gente...... são só as minhas balas que eu paguei com a minha mesada......"
212040-101 = ""
212040-103 = ""
212040-104 = "Alunas colaborativas receberão 'Pontos de Contribuição Patriótica'. Vocês já conhecem o sistema de pontos, não conhecem?"
212040-105 = "Mas caso prefiram a desobediência...... temos autorização para aplicação sumária de pena aqui mesmo."
212040-106 = ""
212040-108 = ""
212040-109 = "Tá, tá bom! Toma logo essa porcaria, saco!"
212040-110 = "O que deu nesse colégio, meu Deus do céu......?"
212040-111 = ""
212040-113 = ""
212040-114 = "Contribuição registrada. Próxima."
212040-115 = ""
212040-117 = ""
212040-119 = ""
212040-120 = "......"
212040-124 = "......Menina, você viu os olhos daquelas veteranas? Elas tão possuídas, não é normal não."
212040-126 = "Nem me fale. Se eu desse um pio a mais na hora do confisco, juro que levava um tiro no meio da testa."
212040-127 = "Dá um medo danado...... mas cá entre nós, não é meio insano de da hora também?"
212040-128 = ""
212040-131 = ""
212040-132 = "Insano como?"
212040-133 = "Desde que entrei nessa escola, nunca vi a Pandemonium e a Disciplina marchando juntas do mesmo lado."
212040-134 = "Ah, nisso cê tem razão. Acho que é inédito na história de Gehenna."
212040-136 = "E tipo...... essa parada de atacar Kivotos inteira... será que não dá bom mesmo?"
212040-137 = "Se as duas maiores forças da escola tão juntas pra valer, talvez a gente ganhe mesmo......?"
212040-139 = "Passei pelo campo de treinamento agora há pouco e quase caí pra trás de tanto tanque de guerra enfileirado.#nEu nem sabia que Gehenna tinha tanto tanque guardado......"
212040-140 = "......Mas enfim, por que diabos inventaram essa guerra do nada?#nPor mim, tava bom do jeito que tava."
212040-142 = "Ah, mas pensando bem, não deve ser tão ruim assim, né?"
212040-143 = "Dar tiro e explodir parede a gente já faz todo dia mesmo!#nA única diferença é que agora o alvo vai ser nas outras academias, ué!"
212040-144 = ""
212040-147 = ""
212040-148 = "Sem contar que dá aquela adrenalina de estar participando de um momento histórico......"
212040-149 = "É, bem melhor do que levar tiro taxada de traidora da pátria......"
212040-150 = "Pois é...... vai que a gente bate o pé e mandam a gente pro xadrez......"
212040-152 = "Pra falar a verdade, eu sempre tive uma vontade secreta de jogar um morteiro bem na fachada cheia de pose de Trinity."
212040-154 = "Nossa, eu também!"
212040-155 = "Eu queria tacar fogo na Árvore Sagrada de Hyakkiyako!#nFui lá passear uma vez e fiquei pensando como aquele negócio ia queimar bonito!"
212040-156 = "......Pensando por esse lado, até que pode ser divertido!"
212040-158 = "Se a gente só obedecer e seguir o fluxo, nada de ruim acontece com a gente, né?"
212040-160 = "As veteranas devem saber o que tão fazendo, afinal de contas."
212040-161 = ""
212040-168 = ""
212040-169 = "......"
212040-170 = "......"
212040-171 = "Karen......"
212040-172 = "Fala, Mayumi."
212040-173 = "A gente...... não queria uma 'Gehenna Unida'?"
212040-174 = "Uma escola onde Pandemonium e Disciplina não se matassem, e todo mundo caminhasse junto em direção a um ideal comum......#nNão era isso?"
212040-175 = "......Era. Era exatamente isso."
212040-176 = "Onde as alunas com nota baixa, as baderneiras, todo mundo sentisse orgulho de estufar o peito sob a bandeira de Gehenna......#nA gente sonhava com uma escola grandiosa assim."
212040-177 = "Será que...... é isso aqui?"
212040-178 = "Eu......"
212040-179 = "Eu já não sei de mais nada......"
212040-180 = "......"
212040-181 = ""
212040-183 = ""
212040-185 = "Então só tem um jeito: vamos ter que tirar isso a limpo com a própria Makoto."
212040-186 = ""
212040-188 = ""
212040-190 = "Próximo Episódio;Tô Fora!"
