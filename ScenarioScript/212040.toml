[translation]
212040-1 = "Chapter 4;A United Gehenna"
212040-2 = "Pandemonium Society - Operations Room"
212040-4 = "Until now, too many resources have been squandered in the name of freedom."
212040-5 = "From here on out, all supplies will be utilized solely for the sake of Gehenna."
212040-14 = "Cut off all distribution within the autonomous district. Consolidate all food and ammunition into the military warehouses."
212040-15 = "Existing facilities won't have enough storage space. #nOrder the Hot Spring Development Department to construct eight new warehouses."
212040-16 = "Use the park on the east side of the academy for the site. #nI may have ordered its construction once, but in this situation, it is not worth considering."
212040-17 = "Strictly control all entry and exit throughout the academy until the moment the attack begins. #nIf there are any radio transmissions heading outside the autonomous district, intercept them all."
212040-18 = "Understood, we shall leave no stone unturned!"
212040-23 = "A war against the entirety of Kivotos... It certainly won't be easy."
212040-24 = "But that is all it is. It is by no means impossible."
212040-28 = "Hina, how is the progress on the preparations?"
212040-34 = "The strike plans for each academy's command center are complete. #nIf the surprise attack succeeds, we can settle everything within 30 minutes."
212040-35 = "The ammunition consumption simulation results are also in. #nWith our current stockpiles, we can sustain a total of 48 hours of scorched-earth bombardment against the central hubs of each academy."
212040-36 = "This calculation does not include civilian stockpiles. #nIf we requisition them from across the autonomous district, we can continue the battle for even longer. #nThough, I doubt it will drag on that long in the first place."
212040-37 = "You can ignore any standout combatants. #nSince this will be a short-term engagement, there is no meaning in individual resistance."
212040-38 = "If it becomes necessary, I can handle them myself."
212040-40 = "Hehehe, as expected of Hina Sorasaki. #nSomeone so lazy becomes cruelly competent the moment they have a goal."
212040-41 = "This is what having a proper sense of purpose is like, I suppose."
212040-42 = "My mind is occupied with nothing but painting the map of Kivotos in the colors of Gehenna."
212040-43 = "Well done."
212040-49 = "If I may, I would like to offer a suggestion."
212040-51 = "Shoko Igarashi, our operations staff officer, isn't it? You have permission to speak."
212040-52 = "With Gehenna's current forces alone, there remain concerns regarding our response to unforeseen circumstances."
212040-53 = "To ensure victory, I believe an expansion of our military capabilities is desirable. #nFor example... the development of a strategic weapon capable of shattering the enemy's will to fight in a single blow."
212040-54 = "Ah, I had already considered that."
212040-55 = "The Kaiser was a genius engineer and inventor. #nLet us have his legacy manufactured in an even more advanced form."
212040-56 = "Is that possible? We were supposed to have destroyed all of the Kaiser's legacy, weren't we?"
212040-57 = "Hina Sorasaki. Who do you think you are talking to?"
212040-58 = "I, Lord Makoto, am the one who knows more about that than anyone else. #nBecause I analyzed every single piece of it thoroughly."
212040-59 = "The efforts made to counter the Kaiser are now becoming our own strength. #nHow ironic, hehehe."
212040-60 = "...If you say so."
212040-62 = "In other words... the great flame of the Kaiser will be lit once again in Gehenna. #nThanks to the brilliant leadership of Chairman Makoto!"
212040-64 = "Hehehe, I am simply using what is available according to the situation."
212040-65 = "—And where have the other Pandemonium Society executives gone? #nEven though the Prefect Team and the Restoration Committee are working so hard for Gehenna."
212040-66 = "I imagine they are busy with their own respective roles."
212040-67 = "I wonder. I don't know the reason, but they were pushing back against this declaration."
212040-68 = "...Same here. We couldn't reach a consensus."
212040-69 = "Tch. Why can't they understand the greater cause?"
212040-70 = "Spouting nothing but weak-willed nonsense..."
212040-72 = "When the situation changes, positions change as well. It is only natural, but it is truly frustrating."
212040-73 = "Those who cannot reach enlightenment cannot see the big picture. It is only natural that they are confused."
212040-74 = "Before we go to war, we should consider tightening our internal discipline."
212040-75 = "Hehehe. A fair point. Only when everyone is united can we truly become strong."
212040-79 = "From this moment on, all ammunition is being requisitioned."
212040-80 = "Eh, but I just bought this yesterday?"
212040-81 = "In this critical situation, that is irrelevant."
212040-82 = "Wait, why? I don't know anything about your circumstances, and this is mine, okay?"
212040-83 = "Gehenna's total war is about to begin!"
212040-84 = "I don't care what you say~"
212040-90 = "That is enough. Any further resistance will be considered a violation of the Emergency Martial Law."
212040-94 = "Prefect! You're just in time! #nThey're trying to take my ammo! Do something about it!"
212040-95 = "Emergency Martial Law Article 8: #n'In situations where the academy's survival is at stake, all usable ammunition belongs to the Gehenna Unified Command.' There are no exceptions."
212040-96 = "What is that!? #nWhen was that article even written?"
212040-97 = "Do not equate the chaotic past with the present. #nGehenna is taking on all of Kivotos. It is only natural that this takes precedence over private ownership."
212040-98 = "This is a matter agreed upon by the Prefect Team leader and our Chairman. Now, hand it over quietly."
212040-99 = "Or would you rather be branded a traitor and thrown into the Prefect prison?"
212040-100 = "A traitor... but, this is... my ammunition..."
212040-104 = "Students who comply willingly will be awarded 'Contribution Points.' #nYou're familiar with points, aren't you?"
212040-105 = "But if you refuse... I am authorized to dispose of you on the spot."
212040-109 = "Fine, I get it, I'll give it to you."
212040-110 = "What is even happening? Seriously..."
212040-114 = "Contribution points recorded. Next."
212040-120 = "..."
212040-124 = "...Hey, did you see? The look in the eyes of the Prefect Team and the Pandemonium Society seniors. That wasn't just a normal situation."
212040-126 = "Yeah. If we had said anything extra when they were taking our ammo, we might have been shot."
212040-127 = "It's a little scary, but... isn't it also kind of amazing?"
212040-132 = "What is?"
212040-133 = "I've never seen the Pandemonium Society and the Prefect Team working together since I enrolled."
212040-134 = "Ah, that's true. It might be a first in Gehenna history."
212040-136 = "I feel like attacking Kivotos might actually go well, don't you think?"
212040-137 = "If those two really joined forces, maybe they could actually pull it off...?"
212040-139 = "When I passed by the training grounds earlier, there were more tanks than I've ever seen. #nDid we always have that many...?"
212040-140 = "...So, in the end, why is this even happening? #nI was fine with how things were before."
212040-142 = "But well, it's not that scary, is it?"
212040-143 = "Shooting and blowing things up is just business as usual, right? #nWe're just doing it at other academies now, right?"
212040-148 = "Besides, it feels like we're witnessing a turning point in history..."
212040-149 = "I-it's probably better than being treated like a traitor..."
212040-150 = "Yeah... if we're the only ones saying something different, who knows what will happen to us..."
212040-152 = "Actually, I've always wanted to fire a mortar at a Trinity building."
212040-154 = "Oh, me too."
212040-155 = "I'm thinking of the Sacred Tree. The one in Hyakkiyako. #nI've been wondering what would happen if I burned it ever since I visited."
212040-156 = "...Maybe it's not such a bad idea?"
212040-158 = "If we just do what we're told, won't things work out?"
212040-160 = "The seniors must have some kind of plan, right?"
212040-169 = "..."
212040-170 = "..."
212040-171 = "Hey, Prefect."
212040-172 = "Yeah."
212040-173 = "We... wanted to create a 'Gehenna United,' right?"
212040-174 = "The Pandemonium Society and the Prefect Team not fighting, and all the students moving forward toward the academy's goal... #nThat kind of image."
212040-175 = "...Yeah, that was it."
212040-176 = "Where dropouts and troublemakers alike could feel pride under the Gehenna flag... #nWe dreamed of such a great academy."
212040-177 = "Is this... what that looks like?"
212040-178 = "I..."
212040-179 = "I don't know anymore..."
212040-180 = "..."
212040-185 = "Then, we have no choice but to go and ask."
212040-190 = "Next Episode;I Quit"