[translation]
212040-1 = "Эпизод 4;Объединённая Геенна"
212040-2 = "Стратегический штаб Пандемониума"
212040-3 = ""
212040-4 = "Изъять все припасы, которые растрачивались под жалким предлогом «свободы»."
212040-5 = "Отныне все ресурсы должны служить исключительно священному походу Геенны."
212040-10 = ""
212040-11 = ""
212040-14 = "Закрыть все торговые кварталы Геенны, а продовольствие и боеприпасы сосредоточить на военных складах."
212040-15 = "Поскольку хранилищ пока недостаточно, поручим Отделу горячих источников построить ещё восемь складов."
212040-16 = "Подойдёт студенческий парк к востоку от академии. Я сама его когда-то построила и теперь считаю, что для войны он совершенно бесполезен."
212040-17 = "И до официального объявления войны ограничить доступ ко всем академиям. Немедленно установить экраны Фарадея, чтобы блокировать любые исходящие сигналы."
212040-18 = "Поняла!"
212040-19 = ""
212040-21 = ""
212040-23 = "Вести войну против всего Кивотоса непросто."
212040-24 = "Но и невозможным это не назовёшь."
212040-25 = ""
212040-27 = ""
212040-28 = "Хина, как идут приготовления?"
212040-29 = ""
212040-31 = ""
212040-33 = ""
212040-34 = "Планы ударов по командным центрам каждой академии завершены. Успешная молниеносная атака должна обеспечить полное уничтожение целей за 30 минут."
212040-35 = "По расчётам расхода боеприпасов, текущих запасов хватит на 48 часов полномасштабного наступления на центры всех академий."
212040-36 = "При необходимости сможем продлить бои, реквизировав боеприпасы по всему округу, но, думаю, нужды в этом не возникнет."
212040-37 = "Пока оставьте «элиту» в покое. Когда обстрел ослабит их, я лично вступлю в бой и добью."
212040-38 = "В любом случае, если война завершится быстро, отдельные очаги сопротивления ничего не изменят."
212040-40 = "Ки-хе-хе. Прекрасно, Сорасаки Хина. Обычно ты превращаешь любое дело в головную боль, но на войне проявляешь беспощадную эффективность."
212040-41 = "Наконец-то у меня появилась настоящая цель."
212040-42 = "Меня заботит лишь одно: завоевать жизненное пространство для нас. Скоро над всем Кивотосом будет развеваться флаг Геенны."
212040-43 = "Ки-хе. Превосходно."
212040-44 = ""
212040-48 = ""
212040-49 = "Прошу прощения, могу я кое-что добавить?"
212040-51 = "Игараши Шоуко, наш оперативный офицер. Говорите свободно."
212040-52 = "Боюсь, при нынешней численности наших сил удерживать под контролем весь Кивотос после завоевания будет непросто."
212040-53 = "Возможно, стоит вложиться в... мощное стратегическое оружие, способное одним ударом сломить волю противника."
212040-54 = "А, я уже об этом думала."
212040-55 = "Император-тиран был гениальным инженером и изобретателем. Мы продолжим исследования её военных машин и немедленно запустим производство."
212040-56 = "Это возможно? Насколько я помню, именно мы уничтожили всё наследие Императора."
212040-57 = "Ки-хе... Сорасаки Хина, за кого ты меня принимаешь?"
212040-58 = "Я знаю Императора-тирана лучше всех в Геенне. Я изучила её труды до мельчайших подробностей."
212040-59 = "И вот теперь знания, добытые нами для победы над Императором-тираном, стали нашей силой. Какая ирония. Ки-хе-хе."
212040-60 = "...Это успокаивает."
212040-62 = "Вы всё предусмотрели, председатель Макото. Видимо, буря Императора-тирана вновь обрушится на мир."
212040-64 = "Ки-хе, я просто умею пользоваться тем, что есть."
212040-65 = "Кстати, о ресурсах. Где остальные члены Пандемониума? Префектура и Лига наследия так стараются ради Геенны, а моего собственного совета нигде нет!"
212040-66 = "Полагаю, они исполняют свои обязанности."
212040-67 = "А... По правде говоря, в последнее время мои младшие товарищи начали возражать."
212040-68 = "...Мои тоже высказывают недовольство. Мы не сошлись во взглядах."
212040-69 = "Ц. Не понимаю, почему они не видят общей картины."
212040-70 = "Только и ноют о «морали» да «дипломатии». Нынешняя молодёжь..."
212040-72 = "Обстоятельства изменились, и их взглядам пора измениться вместе с ними. Это уже порядком раздражает."
212040-73 = "Те, кого ещё не озарило понимание, не видят великой и славной цели. Потому, естественно, пребывают в замешательстве."
212040-74 = "...Возможно, прежде чем начать войну, стоит провести внутреннюю проверку."
212040-75 = "Ки-хе-хе. Прекрасная идея. Только объединившись, мы станем по-настоящему сильными."
212040-78 = ""
212040-79 = "...Итак, ВСЕ БОЕПРИПАСЫ подлежат немедленной сдаче на Военный склад № 1. НЕМЕДЛЕННО!"
212040-80 = "Да я же только вчера их купила! У меня даже чек сохранился!"
212040-81 = "Мне всё равно, когда ты их купила, младшая. Ты что, не понимаешь, насколько серьёзно положение?"
212040-82 = "Ч-что? Какое ещё «серьёзное положение»? Почему вы отбираете мои патроны?"
212040-83 = "Сейчас военное время! Скоро Геенна начнёт полномасштабную завоевательную войну!"
212040-84 = "А я тебе уже сказала: при чём тут вообще я?"
212040-85 = ""
212040-89 = ""
212040-90 = "Хватит. Дальнейшее сопротивление запрещено и будет считаться нарушением чрезвычайных законов военного времени."
212040-91 = ""
212040-93 = ""
212040-94 = "А? Эй, это же Префектура? Отлично! Смотрите, они пытаются отобрать мои патроны! Сделайте что-нибудь!"
212040-95 = "Закон Геенны о военном положении, статья 8: «Во время священного похода все доступные боеприпасы принадлежат Верховному командованию снабжения Геенны». Без исключений."
212040-96 = "...Что? Погодите, это вообще что значит...? Раньше такого закона не было!"
212040-97 = "Не сравнивай хаос прошлого с порядком настоящего. Сейчас цель Геенны — полномасштабная война с Кивотосом. Естественно, она важнее частной собственности."
212040-98 = "Слышала? Это совместное решение главы Префектуры и нашей председательницы. Сдавай припасы."
212040-99 = "Или предпочитаешь, чтобы тебя объявили предателем и бросили в тюрьму Префектуры?"
212040-100 = "«П-предателем»...? Да это же просто мои патроны..."
212040-101 = ""
212040-103 = ""
212040-104 = "Студенты, добровольно сдающие боеприпасы, получат «баллы военного вклада». С системой баллов ты ведь знакома?"
212040-105 = "Но если откажешься... Мы можем прямо здесь наказать тебя за сокрытие стратегических ресурсов."
212040-106 = ""
212040-108 = ""
212040-109 = "...Л-ладно. Забирайте."
212040-110 = "Серьёзно, вы все с ума посходили..."
212040-111 = ""
212040-113 = ""
212040-114 = "Приём взноса завершён. Следующий. Соблюдайте порядок в очереди."
212040-115 = ""
212040-117 = ""
212040-119 = ""
212040-120 = "..."
212040-124 = "...Видела? Старшие из Префектуры и Пандемониума были ТАК серьёзны."
212040-126 = "Они бы нас, наверное, пристрелили, скажи мы ещё хоть слово, пока они вытряхивали патроны из наших подсумков."
212040-127 = "Знаешь... Понимаю, это страшно, но разве не впечатляет?"
212040-128 = ""
212040-131 = ""
212040-132 = "М? Ты о чём?"
212040-133 = "Пандемониум и Префектура работают вместе. Никогда не думала, что такое увижу."
212040-134 = "Точно. Наверное, впервые за всю историю Геенны. Даже эти двое сумели договориться."
212040-136 = "А, кстати. Я тут подумала... Может, завоевать Кивотос не так уж и невозможно."
212040-137 = "Если эти два клуба смогли объединиться..."
212040-139 = "Ага... И ты видела все эти танки на полигоне? У нас всегда их было столько?"
212040-140 = "Никак не пойму. Почему нам вдруг нужно начинать войну? Я ведь отлично проводила время и занималась своими делами..."
212040-142 = "Поначалу я тоже так думала. Но, может, война не настолько плоха, как все говорят."
212040-143 = "Разве это не просто стрельба и взрывы, только на территории другой академии?"
212040-144 = ""
212040-147 = ""
212040-148 = "Возможно. Такое чувство, будто вот-вот произойдёт нечто грандиозное."
212040-149 = "И-и лучше уж подчиняться, чем прослыть предателем."
212040-150 = "...Наверное. Кто знает, что будет, если я начну возражать? Все так рьяно готовятся и толкуют о «славе»..."
212040-152 = "К тому же я давно мечтала шарахнуть из миномёта по какому-нибудь зданию Тринити. У них такие ШИКАРНЫЕ окна..."
212040-154 = "А. Ага, это было бы круто."
212040-155 = "А помнишь Древо божеств из нашей поездки в Хяккияко? Представляешь, как здорово оно выглядело бы в огне?"
212040-156 = "А знаешь... Может, война и правда не такая уж плохая идея."
212040-158 = "Всё будет хорошо, если не высовываться и делать, что нам велят."
212040-160 = "Ага. Уверена, у старших есть план. Просто мы недостаточно умные, чтобы его понять."
212040-161 = ""
212040-168 = ""
212040-169 = "..."
212040-170 = "..."
212040-171 = "Знаешь, председатель..."
212040-172 = "М?"
212040-173 = "Мы ведь... хотели объединить Геенну."
212040-174 = "Чтобы Пандемониум и Префектура не враждовали. Чтобы студенты вместе шли вперёд ради академии."
212040-175 = "...Ага, хотели."
212040-176 = "Великую академию... где даже лентяи и нарушители порядка могли бы гордо сплотиться под знаменем Геенны."
212040-177 = "...Это и есть... та славная Геенна, о которой мы мечтали?"
212040-178 = "Я..."
212040-179 = "Не знаю..."
212040-180 = "..."
212040-181 = ""
212040-183 = ""
212040-185 = "Тогда давай выясним."
212040-186 = ""
212040-188 = ""
212040-190 = "Следующий эпизод;Я ухожу"
