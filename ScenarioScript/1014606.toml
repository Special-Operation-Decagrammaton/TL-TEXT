[translation]
1014606-1 = "The Perfect Council President's Summer"
1014606-6 = "That expression right now, it's perfect!"
1014606-7 = "Could you tuck your chin in a little more?#nKeep your chest as it is, don't puff it out too much!"
1014606-11 = "Yes, just like that! Perfect!"
1014606-18 = "(When I arrived at the scene, the shoot had already begun.)"
1014606-22 = "Oh, is that Sensei from Schale?"
1014606-23 = "I was told we would have a visitor, but I never expected it to be you, Sensei."
1014606-24 = "It is an honor to meet you."
1014606-25 = "……Look at that! Isn't it wonderful?"
1014606-26 = "Makoto-san—no, I mean Council President Makoto."
1014606-32 = "Even professional models struggle with posing, yet...#nTo think she could carry herself so naturally."
1014606-33 = "Tall, beautiful face, great figure... she is truly a perfect talent!"
1014606-37 = "Such a breathtakingly beautiful and dignified presence...!"
1014606-38 = "To be able to pose in front of all this equipment without a hint of fear... that is pure talent."
1014606-43 = "It's such a waste that someone with this much raw potential isn't aiming to be a professional...!"
1014606-44 = "If you don't mind, could you try to persuade her, Sensei?"
1014606-45 = "[s1] \"I'll ask her, but...\"\n[s2] \"Her own wishes are what matter most.\""
1014606-48 = "Yes! Of course. #nI'm grateful enough that you're even willing to ask!"
1014606-54 = "That's quite the expert analysis."
1014606-55 = "If Council President Makoto were to debut as a model, taking over the entertainment industry wouldn't just be a dream!"
1014606-56 = "Is that so...?"
1014606-57 = "I don't really know much about fashion, though."
1014606-58 = "[s3] \"Wait, you're...!\"\n[s4] \"The one who came to yell at Makoto the other day...!\""
1014606-61 = "Ahaha... you remembered me."
1014606-62 = "Isn't it harder to try and forget?"
1014606-63 = "A Prefect Team member storming into Pandemonium Society headquarters is a major incident that will go down in Gehenna's history, you know?"
1014606-64 = "Really? I think our Prefect Prefect would have done something even more dramatic."
1014606-65 = "No, that Prefect Prefect is on a whole different level..."
1014606-67 = "[ns5] \"……? You two...\"\n[ns6] \"You've become friends, haven't you?\""
1014606-70 = "Ahaha... well, one thing led to another."
1014606-71 = "Actually, the day after that..."
1014606-80 = "I was surprised when she suddenly came to our classroom, but..."
1014606-81 = "Once we talked, I realized she wasn't actually a bad person."
1014606-82 = "When I was worrying about what happened that day..."
1014606-83 = "“What's wrong with saying what's on your mind?!”"
1014606-84 = "...she said that to encourage me."
1014606-85 = "[s7] \"Ah, I can totally see that...\"\n[s8] \"That sounds just like Makoto.\""
1014606-88 = "Right? Everyone said the same thing."
1014606-89 = "...And so, before I knew it, I had made a friend in the Pandemonium Society."
1014606-90 = "I help out like this when I'm off duty... we're both busy, after all."
1014606-91 = "Oh, and this is strictly between us—don't tell the Prefect Prefect or the Administrative Officer..."
1014606-93 = "(After that, Makoto's shoot continued to go smoothly.)"
1014606-94 = "(And when the shoot ended...)"
1014606-99 = "Great work, everyone!"
1014606-102 = "Oh, Sensei. You were here?"
1014606-103 = "You should have said something if you were."
1014606-104 = "[s9] \"I didn't want to get in the way of the shoot...\"\n[s10] \"And Makoto was focused.\""
1014606-107 = "Kishishi! No need to worry about that."
1014606-108 = "For me, Makoto-sama, you are the top priority, Sensei."
1014606-109 = "That's why I want you to let me know when you visit. #nI can't afford to miss out on time with you!"
1014606-110 = "...So, how was the shoot today?"
1014606-111 = "[s11] \"You looked very used to it.\"\n[s12] \"I don't think you needed my help.\""
1014606-114 = "Hm? Ah, it seems you've misunderstood something."
1014606-115 = "I, Makoto-sama, did not call you here to ask for your help."
1014606-116 = "I called you here to help you understand."
1014606-117 = "Ever since you turned down my proposal—"
1014606-118 = "I've been thinking about what the problem could have been."
1014606-119 = "It is simply impossible for anyone to reject me, Makoto-sama."
1014606-120 = "If it were to happen, it must be because they don't understand just how great and perfect I am."
1014606-121 = "In short, I reached the conclusion that you still don't understand me, Sensei."
1014606-122 = "...Maintaining such a perfect and beautiful appearance is not particularly difficult."
1014606-123 = "However, if you fail to see the charm of Makoto-sama, there's no point in showing off my beauty, is there?"
1014606-124 = "That is why I want you to stay by my side."
1014606-125 = "If you do that, you'll naturally become mine, won't you, Sensei?"
1014606-126 = "[s13] \"I'll do my best...\"\n[s14] \"It's hard to be by your side all the time, though...\""
1014606-129 = "Kiki. I suppose I'll be satisfied with that for now."
1014606-133 = "……."
1014606-134 = "Ah, I'd like to ask you again..."
1014606-135 = "...So, how was the shoot today?"
1014606-137 = "(Afterward, I went back to the Pandemonium Society with Makoto to look at the photos.)"
1014606-138 = "(Every single photo was truly beautiful.)"