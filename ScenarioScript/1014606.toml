[translation]
1014606-1 = "Идеальное лето председателя"
1014606-2 = ""
1014606-3 = ""
1014606-4 = ""
1014606-6 = "Отличное выражение лица!"
1014606-7 = "Чуть приподнимите подбородок! Расправьте плечи!"
1014606-8 = ""
1014606-10 = ""
1014606-11 = "Да, идеально!"
1014606-12 = ""
1014606-13 = ""
1014606-14 = ""
1014606-15 = ""
1014606-17 = ""
1014606-18 = "Когда я прибыл на место, фотосессия уже началась."
1014606-19 = ""
1014606-20 = ""
1014606-22 = "А! Вы Сенсей из Шале?"
1014606-23 = "Мне сказали, что к нам приедет важный гость, но я и не подозревала, что это будете вы, Сенсей!"
1014606-24 = "О вас столько рассказывают! Для меня большая честь познакомиться с вами!"
1014606-25 = "Но разве это не потрясающе?"
1014606-26 = "Этот студент... То есть председатель Макото."
1014606-27 = ""
1014606-29 = ""
1014606-30 = ""
1014606-32 = "Многим профессиональным моделям такое далось бы с трудом, а она справляется с лёгкостью."
1014606-33 = "Её высокий рост, фигура, лицо... Безупречна во всём!"
1014606-34 = ""
1014606-36 = ""
1014606-37 = "Но больше всего поражает её невероятная уверенность в себе!"
1014606-38 = "Она ведь впервые перед софитами и камерами, верно? Это прирождённый талант."
1014606-39 = ""
1014606-40 = ""
1014606-42 = ""
1014606-43 = "Из неё получилась бы потрясающая модель, но она сказала, что не хочет заниматься этим профессионально!"
1014606-44 = "Не могли бы вы как-нибудь её убедить, Сенсей?"
1014606-45 = "[s1] «Я могу спросить».\n[s2] «Но главное — желание самого студента»."
1014606-48 = "Понимаю. Буду благодарна, если вы хотя бы замолвите словечко."
1014606-49 = ""
1014606-51 = ""
1014606-53 = ""
1014606-54 = "Ого... И это говорит профессионал."
1014606-55 = "Стоит Макото начать карьеру модели, и она покорит весь мир моды!"
1014606-56 = "Вот... как?"
1014606-57 = "Я в этом не очень разбираюсь."
1014606-58 = "[s3] «А, так это ты?!»\n[s4] «Разве не ты в прошлый раз поссорилась с Макото...?!»"
1014606-61 = "Ха-ха, вы помните."
1014606-62 = "Такое трудно забыть."
1014606-63 = "Член Префектуры в одиночку врывается в клубную комнату Пандемониума? Да это происшествие войдёт в историю Геенны!"
1014606-64 = "Но глава Префектуры постоянно так делает, разве нет?"
1014606-65 = "Такое поведение вообще-то нельзя назвать нормальным..."
1014606-66 = ""
1014606-67 = "[ns5] «...? А вы двое...»\n[ns6] «...похоже, подружились?»"
1014606-70 = "Как-то само собой получилось."
1014606-71 = "Если честно, на следующий день..."
1014606-73 = ""
1014606-75 = ""
1014606-76 = ""
1014606-77 = ""
1014606-78 = ""
1014606-80 = "Когда она пришла ко мне в класс, я здорово испугалась."
1014606-81 = "Но мы немного поболтали, и оказалось, что она не такая уж плохая."
1014606-82 = "Я ведь тогда очень переживала из-за своего поступка..."
1014606-83 = "А что плохого в том, чтобы открыто высказывать своё мнение?!"
1014606-84 = "...Вот что она мне сказала. Так меня приободрила."
1014606-85 = "[s7] «А, прекрасно понимаю...»\n[s8] «Это действительно в духе Макото»."
1014606-88 = "Правда? Все так говорят."
1014606-89 = "Ну вот мы и помирились, а потом даже подружились."
1014606-90 = "Так что теперь я иногда помогаю, когда есть возможность. В обоих наших клубах дел невпроворот, знаете ли."
1014606-91 = "А, только прошу, держите это в секрете от главы Префектуры и старшего администратора."
1014606-93 = "Фотосессия прошла гладко, без единой заминки."
1014606-94 = "А когда она закончилась..."
1014606-95 = ""
1014606-99 = "Отличная работа!"
1014606-101 = ""
1014606-102 = "О, Сенсей. Вы уже здесь."
1014606-103 = "Нужно было сообщить, когда пришли."
1014606-104 = "[s9] «Не хотел мешать...»\n[s10] «Ты была так сосредоточена»."
1014606-107 = "Ки-хе-хе, совершенно излишняя забота."
1014606-108 = "Для меня нет ничего важнее, чем лично удостоить вас своим вниманием."
1014606-109 = "А если вы не сообщите о своём прибытии сразу, я могу упустить что-то важное! Так что не проявляйте лишней деликатности!"
1014606-110 = "...Ну и как вы меня оцените?"
1014606-111 = "[s11] «У тебя настоящий талант».\n[s12] «Кажется, моя помощь тебе совсем не понадобилась»."
1014606-114 = "Хм? А, понятно. Вы ошибаетесь."
1014606-115 = "Я позвала вас не потому, что нуждалась в помощи, Сенсей."
1014606-116 = "Как раз наоборот."
1014606-117 = "Когда вы отвергли моё предложение..."
1014606-118 = "Я снова и снова размышляла: что пошло не так?"
1014606-119 = "Ведь отвергнуть меня просто так невозможно."
1014606-120 = "Это может означать лишь одно: вы ещё не осознали, насколько я великолепна и совершенна."
1014606-121 = "Единственный возможный вывод: вы пока недостаточно хорошо меня знаете."
1014606-122 = "Как вы сегодня убедились, моя ослепительная красота — неотъемлемая часть самой моей сущности."
1014606-123 = "Но очевидно, что вы ещё не успели познать её в полной мере."
1014606-124 = "Вот почему вы должны всегда оставаться рядом со мной."
1014606-125 = "И, разумеется, однажды вы станете моим."
1014606-126 = "[s13] «Я подумаю...»\n[s14] «Всегда — это немного сложно...»"
1014606-129 = "Меня это устраивает."
1014606-130 = ""
1014606-132 = ""
1014606-133 = "..."
1014606-134 = "Я-я ещё раз спрошу..."
1014606-135 = "Как... Как вам понравилась съёмка?"
1014606-137 = "После этого мы с Макото вернулись в Общество Пандемониума и вместе посмотрели фотографии."
1014606-138 = "На каждой она выглядела прекрасно."
