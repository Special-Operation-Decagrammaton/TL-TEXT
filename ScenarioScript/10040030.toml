[translation]
10040030-1 = "Эпизод 3;Больше ни минуты не выдержу"
10040030-5 = "О...?"
10040030-6 = "О...! Нгх! *ВЗДОХ*"
10040030-7 = "[ns1] «Что, что?! Хорошая выпала?»\n[ns2] «Скорее покажи!»"
10040030-10 = "Ого! Невероятно! Посмотри, Сенсей!"
10040030-11 = "Ого, ОГО! Эффект просто безумный! Нихаха! О чём разработчики думали, выпуская такую карту? Игре конец! Нихахаха! Она ведь наверняка только сезонная или что-то такое, да?"
10040030-12 = "Я знала, что не зря тебе позвонила! С тобой мне стало намного больше везти!"
10040030-13 = "...Что? При чём тут ты? При всём! Очевидно же?!"
10040030-14 = "Я бы ни за что не вытащила такое сама. Получила бы только кучу бесполезного мусора!"
10040030-15 = "Именно поэтому я тебе и позвонила! Чтобы ты помог мне их открывать... фуфуфу..."
10040030-16 = "И я была абсолютно права! Использую всё, что могу, даже чужую удачу! Сделаю невозможное возможным!"
10040030-17 = "Я всегда найду способ! Нихахаха!"
10040030-18 = "[s3] «Я для тебя талисман удачи, Коюки?»\n[s4] «Рад, что ты так обо мне думаешь.»"
10040030-21 = "Хихи, ну конечно! И я всегда отвечаю добром на добро!"
10040030-22 = "Так что... эм... насчёт этого..."
10040030-23 = ""
10040030-25 = ""
10040030-26 = "...Вот, она твоя!"
10040030-27 = "[s5] «...А? Ты отдаёшь её мне?»\n[s6] «Разве ты сама её не хотела?»"
10040030-30 = "Ну да, я бы соврала, если бы сказала, что не хотела..."
10040030-31 = "...но даже если они не такие хорошие, как эта, у меня есть другие карты! И эту я бы вообще не получила, если бы тебя тут не было."
10040030-32 = "Так что эта твоя, Сенсей! Но это значит, что в следующий раз, когда я буду открывать наборы, ты тоже должен помочь."
10040030-33 = "Эта карта символизирует нашу верность и союз! Это... символ нашей связи!"
10040030-34 = "[s7] «Коюки...!»\n[s8] «У тебя есть неожиданно достойные стороны...»"
10040030-37 = "Нихахаха! Ты мне столько раз помогал, что мне тоже нужно иногда зарабатывать очки!"
10040030-38 = ""
10040030-41 = "...А? Сигнализация...?"
10040030-42 = "Почему сработала сигнализация...?"
10040030-43 = "[s9] «А? ...Сигнализация?»\n[s10] «Какая сигнализация?»"
10040030-46 = "А, ничего особенного. Я просто настроила систему, которая предупреждает меня, когда кто-то входит или выходит из здания Семинар."
10040030-47 = "Такие меры безопасности нужны, когда живёшь в Комнате самоанализа! Хихи."
10040030-48 = "Хм. Но время действительно странное для того, чтобы кто-то входил в здание..."
10040030-49 = "Кто бы это мог быть? Сейчас посмотрю камеры!"
10040030-50 = "Так, посмотрим..."
10040030-51 = ""
10040030-54 = "...А?"
10040030-55 = "Ах! Ах, ах, ах, АХ!"
10040030-56 = "[ns11] «...Коюки?»\n[ns12] «Что происходит?»"
10040030-59 = "К-как...? Почему...?"
10040030-60 = "...Почему старшие вернулись?!"
10040030-61 = "[ns13] «...? Юука и Ноа?!»\n[ns14] «Они не ушли домой?!»"
10040030-64 = "Э-это не входило в мои планы! Ч-что происходит?! Почемууу?"
10040030-65 = "Н-нужно спрятать эти карты!"
10040030-66 = "...Н-нет! Важнее другое: что мне делать с тобой?!"
10040030-67 = "[s15] «О нет. Нам конец!»\n[s16] «Меня нельзя здесь поймать!»"
10040030-70 = "Ты прав... Нам конец!"
10040030-71 = "Я не могу придумать ни одного оправдания... ни... единого!"
10040030-72 = "Что делать? Как мне из этого выбраться...?"
10040030-73 = ""
10040030-75 = ""
10040030-76 = ""
10040030-77 = "...Шкаф!"
10040030-78 = "Сенсей! Шкаф совершенно пустой!"
10040030-79 = "Ты можешь спрятаться там! Наверное, им просто нужно что-то забрать или вроде того!"
10040030-80 = "Просто спрячься, а потом сбеги, когда подвернётся подходящий момент!"
10040030-81 = "Это наш единственный вариант! Сделаем так и будем надеяться на лучшее!"
10040030-82 = "...А?"
10040030-83 = "Можно ли так? Да, можно!"
10040030-84 = "По сути, это уже моя комната! Так что если я говорю, что можно, значит можно!"
10040030-85 = "Хватит терять время, залезай туда! Быстрее! Они вот-вот будут здесь!"
10040030-86 = ""
10040030-89 = "Хочешь жить — прячься!"
10040030-90 = ""
10040030-100 = "Эм... а?! Кто там?"
10040030-101 = "Почему вы так быстро вернулись?"
10040030-103 = "Что это за удивлённое лицо? Почему ты так нервничаешь?"
10040030-104 = "Юука сказала, что переживает: тебе может быть одиноко встречать Новый год в одиночестве."
10040030-105 = "Ты всё ещё наказана, поэтому выпустить тебя из Комнаты самоанализа мы не можем."
10040030-106 = "Поэтому решили вместо этого устроить пижамную вечеринку прямо здесь, вместе с тобой."
10040030-107 = "Иногда из-за тебя нам приходится слишком уж стараться."
10040030-108 = "Вот, переоденься в это. Без пижам это будет ненастоящая пижамная вечеринка."
10040030-110 = ""
10040030-112 = "Хм? Это что?"
10040030-113 = ""
10040030-115 = ""
10040030-116 = "...Одежда? ...Пижама?"
10040030-117 = "Да! Очаровательный комплект пижамы, который Юука лично и очень тщательно для тебя выбрала."
10040030-118 = "Н-Ноа! Я же сказала, это была просто случайная покупка! Я просто—"
10040030-119 = ""
10040030-121 = ""
10040030-122 = "...А?"
10040030-123 = "Подожди. Что это за лицо? Похоже, ты совсем не рада."
10040030-124 = "Э-эээээ?! Кто такое сказал?! Неправда! Я в восторге! В экстазе!"
10040030-125 = "Н-но, просто чтобы точно понять: это значит, вы двое собираетесь... ночевать? Здесь? В этой комнате? Прямо сейчас?"
10040030-126 = "Похоже, ты совсем не хочешь, чтобы мы оставались... хотя мы столько старались."
10040030-128 = "И правда странно. Обычно ты радуешься, когда мы приходим..."
10040030-129 = "...Хм."
10040030-130 = ""
10040030-132 = ""
10040030-133 = "...А?"
10040030-134 = ""
10040030-136 = ""
10040030-137 = "А... Так вот в чём дело. Фуфуфу."
10040030-138 = "...Ноа?"
10040030-139 = "...Сейчас увидишь, Юука."
10040030-140 = ""
10040030-142 = ""
10040030-144 = "Коюки, что ты там прячешь?"
10040030-145 = "...А, хмм? Ч-что ты имеешь в виду? Что я вообще могу прятать в этой печальной-печальной комнате, где меня заперли?"
10040030-146 = "Ох-ох. Значит, решила играть так? Видишь те коробки за собой... Сегодня утром они стояли иначе."
10040030-147 = "...А?"
10040030-148 = "К-как ты вообще постоянно запоминаешь такие странные мелочи?!"
10040030-149 = ""
10040030-151 = ""
10040030-152 = ""
10040030-153 = "Что там? Что ты опять натворила?! Сейчас же отойди, Коюки! Отойди!"
10040030-154 = "А, нет! Пожалуйста, только это...! Это проблема следующего года! Не этого!! Этот год ещё не закончился!"
10040030-155 = "О чём ты вообще говоришь...?!"
10040030-156 = ""
10040030-160 = ""
10040030-161 = ""
10040030-162 = "...Что это?"
10040030-163 = "Это... куча карт?"
10040030-164 = "Н-ну, дело в том, что..."
10040030-166 = "...Ага. Вот что тут происходило."
10040030-167 = "Я... Я не могу поверить!"
10040030-168 = ""
10040030-170 = ""
10040030-171 = ""
10040030-172 = ""
10040030-173 = "КО! Ю! КИИИ!!"
10040030-174 = ""
10040030-184 = "КЬЯ-А-А! А, а-а-а! ААА!"
10040030-185 = ""
10040030-188 = "ЮУКА, НЕТ! Пожалуйста! Ты даже не представляешь, сколько стоит эта карта!"
10040030-189 = ""
10040030-194 = "А-а, Юука! Прошу! Юука, умоляю тебя! А! ПОЖАЛУЙСТА!!!"
10040030-195 = "Серьёзно?! Ты не повзрослела НИ НА КРОХУ?!"
10040030-196 = ""
10040030-201 = "А, а! Аааааа! ААА!"
10040030-202 = "Кья-а-а! Время аварийного выхода!"
10040030-203 = ""
10040030-209 = "Ты куда собралась?! Вернись сюда, Коюки!"
10040030-210 = ""
10040030-212 = ""
10040030-213 = "Ноа, помоги!"
10040030-214 = "Она даже пижаму утащила!"
10040030-215 = ""
10040030-217 = ""
10040030-218 = "Фуфу. Значит, вот так мы отмечаем канун Нового года."
10040030-219 = "...Мне и правда нравится, насколько непредсказуемо тут всё становится."
10040030-220 = ""
10040030-222 = ""
10040030-226 = "[ns] «...Коюки.»"
10040030-228 = "[ns17] «...Я никогда тебя не забуду.»\n[ns18] Почтить её память минутой молчания."
10040030-232 = "[ns] «В любом случае, мне лучше воспользоваться моментом и самой сбежать...»"
10040030-235 = "[ns19] «...А? Дверь заперта?»\n[ns20] «И другая тоже? Все выходы заперты?»"
10040030-241 = "...Кажется, я понимаю, что происходит."
10040030-242 = "Я хотела подсмотреть, как сотрудники Семинар наслаждаются пижамной вечеринкой. Не ожидала увидеть здесь ещё и вас."
10040030-243 = ""
10040030-245 = ""
10040030-246 = "...Какой приятный сюрприз."
10040030-247 = "[s21] «А...? Котама?!»\n[s22] «Откуда ты знала, что я здесь?»"
10040030-250 = "Я подслуши— Кхм. Я оценивала эффективность технологий Веритас."
10040030-251 = "И тогда случайно обнаружила, что вы заперты в Комнате самоанализа."
10040030-252 = "Поскольку она предназначена для изоляции проблемных студентов, замки здесь автоматические и открываются только снаружи."
10040030-253 = "Разумеется, Коюки уже нашла способ входить и выходить когда захочет, но обычный человек останется заперт, пока Семинар не решит иначе."
10040030-254 = "...Но вам не о чем беспокоиться."
10040030-255 = "Мы проведём вас по оптимальному безопасному маршруту побега."
10040030-256 = "[s] «...Мы? Кто ещё с тобой?»"
10040030-257 = "Харе здесь."
10040030-258 = "С помощью этого гениального хакера, которого признаёт даже вице-президент Веритас, вы сможете незаметно выбраться, не активировав систему безопасности Миллениум."
10040030-259 = "Погоди, Котама. Нам правда стоит сегодня избегать новых неприятностей..."
10040030-260 = ""
10040030-261 = "[ns23] «...Ты всё ещё ставишь устройства для прослушки?» \n[ns24] «Котама, я больше не могу игнорировать такое поведение...»"
10040030-264 = "...Похоже, вы ещё не сдали годовой финансовый отчёт Шале."
10040030-265 = "Мне-то, конечно, всё равно, но представьте, что будет, если бухгалтер Семинар узнает, что всё это время вы развлекались в Комнате самоанализа..."
10040030-266 = "Я бы сказала, начало нового года у вас будет весьма хлопотным."
10040030-267 = ""
10040030-270 = "[ns] «...Чего ты хочешь?»"
10040030-271 = "Десять разных записей, где вы желаете мне доброго утра."
10040030-272 = "Я подготовлю текст, вам останется лишь позволить нам записать, как вы его читаете."
10040030-273 = "При таких условиях, уверена, Харе тоже согласится сотрудничать."
10040030-274 = "Слышать, как голос Сенсея желает мне доброго утра... звучит совсем неплохо..."
10040030-275 = ""
10040030-276 = "[ns25] «Неужели это мой единственный вариант...?»\n[ns26] «...Когда выберусь отсюда, тебя ждёт серьёзная лекция.»"
10040030-279 = "Буду считать это согласием."
10040030-280 = "Харе, пожалуйста, сними ограничения доступа в Комнату самоанализа."
10040030-281 = "Это точно нормально...?"
10040030-283 = ""
10040030-284 = ""
10040030-287 = ""
10040030-290 = "Ну, я открыла."
10040030-291 = "Можете выходить, но будьте осторожны в коридорах. Побег Коюки активировал дополнительные меры безопасности."
10040030-292 = "А если вы случайно встретите студента... её память я уже не взломаю."
10040030-293 = "Для начала идите по коридору к гостиной, где мы сейчас находимся. Я смогу предупреждать вас, если кто-то идёт навстречу."
10040030-294 = "Я прекрасно слышу каждую звуковую волну вокруг вас, Сенсей. Хихи..."
10040030-295 = "[s27] «Сколько же у тебя здесь устройств прослушки...?»\n[s28] «Я серьёзно насчёт лекции, когда выберусь!»"
10040030-298 = "Если мне удастся услышать, как вы ругаете меня лично, прямо рядом... это даже может быть выгодно..."
10040030-299 = "...Может, стоит добавить пару сердитых реплик в записи утреннего приветствия."
10040030-300 = "Нет времени болтать, Сенсей. Несколько студентов прямо сейчас идут к Комнате самоанализа."
10040030-301 = "Быстрее!"
10040030-302 = ""
