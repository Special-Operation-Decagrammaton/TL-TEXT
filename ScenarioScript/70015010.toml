70015010-202 = ""
70015010-203 = "Макото слопала весь пудинг Ибуки!"
70015010-204 = "Поэтому Ибуки не хочет видеть её дурацкую физиономию, пока не перестанет злиться!"
70015010-205 = ""
70015010-207 = ""
70015010-208 = ""
