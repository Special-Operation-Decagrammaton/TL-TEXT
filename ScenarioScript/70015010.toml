70015010-123 = "...But what is Ibuki doing all the way out here?"
70015010-127 = "Hello, adorable little lady. What's the matter?"
70015010-128 = "...Ah, hello pretty Onee-chan."
70015010-129 = "P-Pretty..."
70015010-130 = "Th-this girl's got a good eye! I like her!"
70015010-131 = "Don't worry. Your Onee-chan here's going to help guide you back to where you#ncame from."
