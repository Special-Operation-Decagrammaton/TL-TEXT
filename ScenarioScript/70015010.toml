[translation]
70015010-1 = "Исчезновение Ибуки, часть 1"
70015010-2 = "Зал заседаний Пандемониума"
70015010-3 = ""
70015010-4 = "А-А-А! НЕ-Е-ЕТ!"
70015010-5 = "Ибуки НЕНАВИДИТ Макото!"
70015010-6 = ""
70015010-8 = ""
70015010-9 = ""
70015010-10 = ""
70015010-11 = ""
70015010-12 = "НЕ-Е-ЕТ! ИБУКИ-И-И!"
70015010-13 = ""
70015010-15 = ""
70015010-16 = ""
70015010-17 = "Ты опять за своё."
70015010-18 = "Это вышло случайно! Правда!"
70015010-19 = "Ты... Ироха! Это твоя вина! Надо было подписать пудинги!"
70015010-20 = "Тогда ты бы выбрала мой и съела его."
70015010-21 = "Ещё бы! Зато случайно не взяла бы пудинг Ибуки!"
70015010-22 = "То есть мой можно есть?!"
70015010-23 = "Поверить не могу! Как я опять умудрилась?!"
70015010-24 = ""
70015010-26 = ""
70015010-27 = ""
70015010-28 = "Пока мы спорили, Ибуки незаметно ушла. Я собиралась пойти за ней, но..."
70015010-29 = "Похоже, на этот раз она совсем расстроилась, Макото. Ты уверена, что всё обойдётся?"
70015010-30 = "Угх..."
70015010-31 = "Может, всё-таки пойти за ней?"
70015010-32 = "Пока она в кампусе, с ней ничего не случится. Здесь ведь все знают Ибуки."
70015010-33 = "Д-да, верно!"
70015010-34 = ""
70015010-36 = ""
70015010-37 = ""
70015010-38 = ""
70015010-39 = ""
70015010-40 = "И-Ибуки... Прости меня..."
70015010-41 = "Она совсем убита горем..."
70015010-42 = "Давайте найдём её! Одной ей станет только грустнее."
70015010-43 = "П-прекрасная мысль... Идём. Ибуки! ИБУКИ-И-И!"
70015010-44 = "Далеко она уйти не могла. Может, она в комнате отдыха или в убежище Ирохи?"
70015010-45 = "Нужно найти её. Немедленно."
70015010-47 = "Несмотря на тщательные и настойчивые поиски..."
70015010-49 = ""
70015010-50 = ""
70015010-52 = ""
70015010-53 = "Ибуки!"
70015010-54 = ""
70015010-56 = ""
70015010-58 = "Ибуки-и-и!"
70015010-60 = ""
70015010-61 = ""
70015010-62 = ""
70015010-63 = "ИИИБУУУКИ-И-И!!!"
70015010-65 = "...нигде не удалось найти Ибуки."
70015010-67 = "Ку-фу-фу. Сегодня удача на нашей стороне."
70015010-68 = "Удача?! Это мастерство! Одно лишь мастерство!"
70015010-69 = "Ну конечно. Пусть будет так."
70015010-70 = ""
70015010-72 = ""
70015010-73 = "В последнее время нам достаются хорошие заказы! Всё благодаря нашему несомненному таланту, о котором уже заговорил преступный мир!"
70015010-74 = "Хе-хе, хи-хи... Хи... Именно... Никто в мире не умеет решать проблемы так, как Ару..."
70015010-75 = "И ты тоже, Харука! Сегодня была на высоте. Продолжим трудиться!"
70015010-76 = "У-услышать это от самой Ару..."
70015010-77 = "Спасибоспасибоспасибо...!"
70015010-78 = ""
70015010-80 = ""
70015010-81 = "Значит, благодаря нашим выдающимся талантам мой кошелёк в этом месяце заметно потяжелел!"
70015010-82 = "Наконец-то мы смогли оплатить аренду офиса..."
70015010-83 = "А мне нравилось то местечко снаружи, где мы раньше спали. Ночью там почти не продувало!"
70015010-84 = "Хватит вспоминать об этом с такой нежностью! Мы будем расти! Добьёмся большего!"
70015010-85 = "Ку-фу-фу, тогда как насчёт роскошного пентхауса в центре, как у нашего заказчика? И каждому по отдельной комнате! Было бы здорово!"
70015010-86 = "*глоть*"
70015010-87 = "О-хо-хо! К-когда наш бизнес разрастётся, это будет проще простого... Наверное! Возможно!"
70015010-89 = ""
70015010-90 = ""
70015010-91 = "Это ведь...?"
70015010-93 = ""
70015010-94 = "...Хмф!"
70015010-95 = "Ибуки ненавидит Макото. Она большая обманщица."
70015010-96 = "Макото поклялась на мизинчиках, что больше никогда не съест пудинг Ибуки."
70015010-97 = "Глупая Макото. Дурочка! Морская анемона!"
70015010-98 = "..."
70015010-99 = "Ой... Нет, это слишком грубо... Прости, Макото..."
70015010-100 = ""
70015010-102 = ""
70015010-103 = "Но...! Но съесть пудинг Ибуки ЕЩЁ РАЗ было тоже ужасно!!"
70015010-104 = "..."
70015010-105 = "*шмыг*"
70015010-106 = ""
70015010-108 = ""
70015010-109 = "Но, эм... Где же Ибуки?"
70015010-110 = "Ибуки так разозлилась, что совсем не смотрела по сторонам! Наверное, Ибуки зашла слишком далеко."
70015010-111 = "Угх..."
70015010-113 = ""
70015010-114 = "Каёко, идём. На что ты там смотришь?"
70015010-115 = "А, вон туда..."
70015010-116 = "М-м? Там маленькая девочка. Она потерялась?"
70015010-117 = "Хи-хи, если потерялась, надо помочь ей найти взрослых!"
70015010-118 = ""
70015010-120 = ""
70015010-121 = "Погоди, босс... Кажется, эта девочка..."
70015010-122 = "Вечно убегает, даже не дослушав..."
70015010-123 = "...Что Ибуки здесь делает?"
70015010-125 = ""
70015010-126 = ""
70015010-127 = "Привет, барышня!"
70015010-128 = "З-здравствуйте, красивая тётя."
70015010-129 = "К-красивая..."
70015010-130 = "О-хо-хо-хо! А у тебя отменный вкус! Нравишься ты мне, малышка!"
70015010-131 = "Эта красивая тётя поможет тебе благополучно добраться домой!"
70015010-132 = "А? Вы знаете, куда Ибуки нужно идти?"
70015010-133 = "Вот сейчас и выясню..."
70015010-134 = ""
70015010-136 = ""
70015010-137 = "Погоди... Ты ведь...?"
70015010-138 = ""
70015010-140 = ""
70015010-141 = "П-постой. Ты..."
70015010-142 = "П-Пандемониум?!"
70015010-143 = "Ого! Вы и правда знали!"
70015010-144 = ""
70015010-146 = ""
70015010-147 = ""
70015010-148 = ""
70015010-149 = "П-П-Пандемониум?!?!"
70015010-150 = "Та самая малышка! Которая вечно ходит с Макото или Ирохой! А я-то думаю, лицо знакомое!"
70015010-151 = "Что делать? Что же мне теперь делать?"
70015010-152 = ""
70015010-154 = ""
70015010-155 = "Хмф. Ну и что, если она оттуда?"
70015010-156 = "Она же не младенец. Просто отведите поближе к Геенне, дальше сама разберётся."
70015010-157 = ""
70015010-159 = ""
70015010-160 = ""
70015010-161 = "Она напугана и совсем одна. Надо ей помочь!"
70015010-162 = ""
70015010-164 = ""
70015010-165 = ""
70015010-166 = "Что?! Разве мы не договорились больше не связываться с Геенной?!"
70015010-167 = "Если ты забыла, именно Пандемониум управляет Геенной! Думаешь, можно просто заявиться туда и оставить её?"
70015010-168 = ""
70015010-170 = ""
70015010-171 = ""
70015010-172 = "Представь, каково ей, маленькому ребёнку в незнакомом месте. Нельзя её просто бросить!"
70015010-173 = ""
70015010-175 = ""
70015010-176 = ""
70015010-177 = "Э-э..."
70015010-178 = ""
70015010-180 = ""
70015010-181 = ""
70015010-182 = ""
70015010-183 = "Ты в порядке? С тебя пот ручьём... Ты простудилась?"
70015010-184 = "(Она, наверное, ужасно напугана, но это она берёт меня за руку и пытается успокоить...)"
70015010-185 = ""
70015010-187 = ""
70015010-188 = ""
70015010-189 = "Вот! Просто пойдём со мной! Я отведу тебя домой, в Пандемониум!"
70015010-190 = ""
70015010-192 = ""
70015010-193 = "Ты это серьёзно, босс? Хочешь пойти в их штаб-квартиру?"
70015010-194 = "...Мы обязаны это сделать!"
70015010-195 = "Не то чтобы я удивлена твоему решению, но постой секунду..."
70015010-196 = "Настоящий крутой преступник обязан указать заблудшей овечке путь домой!"
70015010-197 = "Я не против самого поступка, но не уверена, что его можно назвать «крутым»...#nПостой, нет, я вообще-то пытаюсь сказать..."
70015010-198 = "Ибуки никуда не пойдёт!"
