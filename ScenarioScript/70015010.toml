70015010-149 = "Pandemonium Society!?!?"
70015010-150 = "I had a feeling I'd seen her before... But who would've guessed she was from#nthere..."
70015010-151 = "Wh-what should I do...?"
70015010-155 = "What you should do is obvious. Involve yourself as little as possible."
70015010-156 = "If you bring her near Gehenna, then she'll find her own way back."
70015010-161 = "Don't do that! She should be feeling uneasy from being all alone right now.#nWe need to help her!"
70015010-166 = "Don't be stupid! We've already decided to not get involved with Gehenna!"
70015010-167 = "Not to mention, it's THE Pandemonium Society we're talking about here!#nWho knows what could possibly go wrong..."
70015010-172 = "You know just how lonely it is for a kid to be all by themself, don't you? #nWe HAVE to stay with her."
70015010-177 = "H-hnngh..."
70015010-183 = "Onee-chan, why're you sweating so much? Does somewhere hurt?"
70015010-184 = "(This girl... She should be anxious from being all alone, but she's still worried#nabout me...)"
70015010-189 = "Very well... We'll bring you back to the Pandemonium Society!"
70015010-193 = "...Aru-chan, are you actually gonna go to the Pandemonium Society?"
70015010-194 = "...Of course! It's what I have to do!"
70015010-195 = "I can roughly guess what chain of thought led you to this conclusion...#nBut I'm going to need you to calm down for a second, Boss."
70015010-196 = "If a hard-boiled outlaw sees a lost lamb... Then they must guide it down the right#npath!"
70015010-197 = "Hard-boiled or not, I don't think that's something an outlaw would do..."
70015010-198 = "No way! Ibuki's not going back!"
70015010-203 = "Makoto ate Ibuki's pudding!"
