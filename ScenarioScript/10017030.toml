[translation]
10017030-1 = "Эпизод 3;Рождественский кошмар"
10017030-2 = "Центр Кивотоса"
10017030-3 = ""
10017030-5 = ""
10017030-6 = ""
10017030-7 = "Подарите любовь на Рождество! Помогите нуждающимся!"
10017030-8 = ""
10017030-10 = ""
10017030-11 = ""
10017030-12 = "Помогайте тем, кому это нужно! Помогайте тем, кому тяжело!"
10017030-14 = "Эй, это ящик для пожертвований Рыцарей скорой помощи? Ну да, всё-таки Рождество."
10017030-15 = "Вот. Для нуждающихся."
10017030-16 = ""
10017030-18 = ""
10017030-20 = "Большое спасибо. Пожалуйста, примите этот подарок."
10017030-21 = ""
10017030-23 = ""
10017030-24 = "Шапка и перчатки ручной работы лично от меня! Хи-хи!"
10017030-26 = ""
10017030-28 = ""
10017030-29 = "Вы сами это сделали? Это стоит гораздо больше, чем мы пожертвовали..."
10017030-30 = "Вот именно. Нам самим надо заняться благотворительностью, чтобы компенсировать."
10017030-32 = "Н-нет! Мы вовсе не хотели заставить вас чувствовать себя виноватыми..."
10017030-33 = "Большое спасибо! Хорошего конца года! Счастливого Рождества!"
10017030-35 = ""
10017030-37 = "[ns] «Для некоторых это уже ежегодная традиция.»"
10017030-38 = "Н-ничего особенного. Мы просто выполняем работу Рыцарей скорой помощи..."
10017030-39 = "Именно, Сенсей! Когда мы делаем людей счастливыми, сами становимся счастливее!"
10017030-40 = "[s] «Так светло... Так чисто... Кажется, я сейчас заплачу.»"
10017030-41 = "Сенсей? Вы в порядке?"
10017030-42 = "Эй! Взрослые не должны плакать!"
10017030-44 = "Не хочу портить настроение, но..."
10017030-45 = ""
10017030-47 = ""
10017030-49 = ""
10017030-50 = "О, сразу видно, что эти люди — плохиши!"
10017030-51 = "Так нельзя, Ханаэ. Не стоит судить людей подобным образом."
10017030-52 = "Вы ранены? Вас ведь часто избивают..."
10017030-53 = "Если нужна первая помощь, оставьте это Рыцарям скорой помощи!"
10017030-55 = "Что? Нет, мы не совсем... Погодите, то есть да! Ох! Так больно! Очень больно! Чёрт, э-э, раны!"
10017030-56 = "Но неважно, я хочу, чтобы вы нас выслушали."
10017030-57 = "Сейчас Рождество, да? А Рождество — время помогать нуждающимся. Верно?"
10017030-58 = "Что делать, Сенсей?"
10017030-59 = "[s] «Давайте их выслушаем.»"
10017030-60 = "Хм... Хорошо! Раз вы так говорите, Сенсей!"
10017030-62 = "Это... Серьёзно?"
10017030-63 = "Зачем Боевой группе Правосудия делать такое?"
10017030-65 = ""
10017030-67 = "Я сама не понимаю! Мы ведь вообще ничего не сделали!"
10017030-68 = "*всхлип* Мы просто хотели курицы на Рождество."
10017030-69 = "И не только для себя! Мы хотели подарить другим наше особое блюдо из курицы!"
10017030-70 = "[s1] «Особое блюдо из курицы?»\n[s2] «(Боевая группа Правосудия... забрала у них курицу?)»"
10017030-73 = "Мы просто хотели сделать что-нибудь необычное!"
10017030-74 = "Да! Точно!"
10017030-75 = "А потом они внезапно напали на нас и забрали всю курицу!"
10017030-76 = "И вот я спрашиваю вас сегодня: неужели мы так сильно неправы? Разве наслаждаться курицей на Рождество — преступление? Ну да, индейка, наверное, лучше..."
10017030-77 = "Мы потратили на эту курицу все деньги до последней монеты."
10017030-78 = "Просто хотели немного разнообразия, и тут бах! Врывается Боевая группа Правосудия!"
10017030-79 = "[s3] «Немного разнообразия...?»\n[s4] «Что именно вы делали?»"
10017030-82 = "Н-ну, подробно это объяснить довольно сложно..."
10017030-83 = "Главное — искренность! И то, как нашу искренность растоптали!"
10017030-84 = "Именно! И ещё в Рождество! Мы хотели сделать доброе дело! А они нам не позволили!"
10017030-85 = "В Боевой группе Правосудия одни хладнокровные убийцы! У них нет милосердия!"
10017030-87 = "Мне так жаль, что они с вами так поступили. Санта-Клаус тоже в них разочаруется."
10017030-88 = "Верно. Ваше прошлое не должно обесценивать нынешние добрые поступки."
10017030-89 = "Боевая группа Правосудия поступила неправильно."
10017030-90 = "[s5] «Вам не кажется всё это немного... подозрительным?»\n[s6] «Хмммммммммммм...»"
10017030-93 = "Так нельзя, Сенсей! На Рождество нельзя сомневаться в пострадавших! Как вам не стыдно!"
10017030-94 = "Нельзя судить книгу по обложке! Что бы сказал Санта?!"
10017030-95 = "[s] «...Мне очень жаль.»"
10017030-96 = "А пока возьмите эти перчатки и шапки. На улице очень холодно."
10017030-97 = ""
10017030-99 = ""
10017030-101 = ""
10017030-102 = "*всхлип* Спасибо, спасибо... Но ничто не заполнит эту дыру размером с курицу в моём сердце."
10017030-103 = "Кстати, где капитан Рыцарей скорой помощи?"
10017030-105 = "Капитан скоро должна быть здесь."
10017030-106 = "Она сказала, что придёт после патруля по Тринити."
10017030-107 = "А почему спрашиваешь?"
10017030-109 = ""
10017030-111 = "Да так, ничего... Просто..."
10017030-112 = "Да ничего. Спасибо, что выслушали наши куриные страдания... Курица, которую мы больше никогда не увидим..."
10017030-114 = "Мне жаль... Мы можем ещё чем-нибудь помочь?"
10017030-115 = "Только скажите — мы постараемся!"
10017030-117 = ""
10017030-119 = ""
10017030-120 = "Просто... Просто помните о нас..."
10017030-121 = "И помните: даже на Рождество всегда есть такие, как мы. Те, кто бродит по улицам, замёрзшие, одинокие, без курицы... *всхлип*"
10017030-122 = ""
10017030-124 = ""
10017030-125 = ""
10017030-127 = ""
10017030-129 = ""
10017030-130 = "Они ушли..."
10017030-131 = "Нам пойти за ними?"
10017030-132 = "[s7] «Не знаю, хорошая ли это идея.»\n[s8] «Это выглядит... немного как преследование?»"
10017030-135 = "Думаете? Но..."
10017030-136 = "Это просто так грустно, Сенсей. *хнычет*"
10017030-137 = "Сенсей, вас что-то беспокоит?"
10017030-138 = "[s] «...Зачем Боевой группе Правосудия вообще делать что-то подобное?»"
10017030-139 = "Верно. Обычно они такие добрые..."
10017030-140 = "Но иногда они слишком сильно перегибают палку!"
10017030-141 = "Хахаха... Может быть. Нам часто приходится заранее готовиться, когда мы слышим, что Боевую группу Правосудия отправляют на задание."
10017030-142 = "Ага! Проверяем оборудование, готовим лекарства, достаём носилки — и бах! Это наш сигнал выдвигаться."
10017030-143 = "[s] «...Как по расписанию.»"
10017030-144 = "П-просто Рыцари скорой помощи должны быть готовы к любой ситуации!"
10017030-145 = "Да, но к этой мы готовы не были... Мне от этого плохо."
10017030-146 = "[s] «Эй, ну же, не грусти, Ханаэ. Уверена, мы получим нормальное объяснение. Хорошо?»"
10017030-147 = "Хм... Хорошо! Не буду унывать!"
