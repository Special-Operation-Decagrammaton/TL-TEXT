[translation]
1007803-1 = "Я люблю взрывы"
1007803-3 = "В следующий раз мы встретились с Касуми уже глубокой ночью... в очередной заброшенной фабрике."
1007803-4 = "[ns1] «Заброшенная фабрика...»\n[ns2] «Ты правда хотела встретиться именно здесь?»"
1007803-7 = "Как всегда, Сенсей, вы точно вовремя!"
1007803-8 = ""
1007803-11 = "И да, именно так! Добро пожаловать в секретное убежище номер 89!"
1007803-12 = "Знаю-знаю. На три номера больше, чем в прошлый раз."
1007803-13 = "Что поделать? Два мне не подошли, а ещё одно не поладило с моей взрывчаткой, вот мы и здесь."
1007803-14 = "Но теперь всё это лишь обломки на свалке. В большой картине мира номера убежищ ничего не значат."
1007803-15 = "Нет уж! У нас есть темы куда важнее моей кочевой жизни."
1007803-16 = "А теперь идите за мной, Сенсей. Я хочу поделиться с вами потрясающим планом!"
1007803-17 = ""
1007803-19 = ""
1007803-21 = ""
1007803-22 = "М-м! Да, это как раз то место."
1007803-23 = "Простите, что место такое... сомнительное, но если я хочу скрываться, мне нужно что-нибудь укромное."
1007803-24 = "В последнее время я весьма популярна — даже печально знаменита. Меня ищут повсюду."
1007803-25 = "Префектская команда, бандиты в шлемах, производители оружия, клубы, пострадавшие от прошлых подрывов..."
1007803-26 = "Но такова жизнь, правда? Я знаю, всё наладится, стоит мне наткнуться на горячий источник!"
1007803-27 = "...Хм? Что это за лицо, Сенсей?"
1007803-28 = "А?"
1007803-29 = "...Не скажу, что легко продолжать перед лицом невзгод, нет..."
1007803-30 = "И да, неудачи совсем не воодушевляют."
1007803-31 = ""
1007803-33 = ""
1007803-34 = "...Хаха."
1007803-35 = "Но, если позволите сказать, Сенсей, вы смотрите на всё неправильно."
1007803-36 = "Создание потрясающего нового горячего источника — не единственная мера моего успеха."
1007803-37 = "Да, это моя цель. Но это вовсе не значит, что если я не добьюсь её, то проиграла."
1007803-38 = "Сенсей..."
1007803-39 = "То, что мне действительно нравится — то, что я люблю — это подрыв."
1007803-40 = "Любая возможность поработать со взрывчаткой, удачная или нет, для меня уже победа."
1007803-41 = "Неважно, что именно. Большое, маленькое, успешное, неудачное..."
1007803-42 = "Подрыв, после которого за тобой гонятся, подрыв, который саботировали, подрыв, сработавший несмотря на саботаж..."
1007803-43 = "Благодаря подрывам в необычных и далёких местах я вижу потрясающие картины."
1007803-44 = "Даже когда Префектская команда срывает подрыв, который я месяцами планировала и готовила, сам процесс всё равно приносит мне радость."
1007803-45 = "Пока есть хоть какая-то возможность найти горячий источник, я счастлива! Да что там, даже смутной надежды достаточно!"
1007803-46 = "Вы смотрите на меня как на сумасшедшую. Послушайте, я хочу сказать, что важен не пункт назначения, а путь."
1007803-47 = "От поиска достойного места до планирования, подготовки и самого подрыва — я люблю всё! Вы ведь понимаете, правда?"
1007803-48 = "О, кстати, раз уж заговорили о достойных местах, вам стоит знать..."
1007803-49 = "...я положила глаз на здание Шале."
1007803-50 = ""
1007803-53 = "[ns3] «Прости, что?!»\n[ns4] «Что-что?!»"
1007803-56 = "Уахаха! Вот это лицо!"
1007803-57 = "Разве не понимаете, Сенсей?"
1007803-58 = "Я хочу, чтобы вы были сильнее вовлечены в мои планы."
1007803-59 = "И решила, что если расскажу вам это, вы будете чаще возвращаться... хотя бы чтобы убедиться, что я не исполню угрозу!"
1007803-60 = "Я знаю, вы все наверняка считаете меня занозой в заднице, но мне всё равно."
1007803-61 = "Я уже давно знаю, чего хочу, ещё до вашего появления, Сенсей!"
1007803-62 = "Так что, зная это, надеюсь, в будущем вы будете относиться ко мне серьёзнее."
1007803-63 = "Вы можете это понять, Сенсей? Для меня очень важно, чтобы могли..."
1007803-64 = "...ради нас обоих."
1007803-65 = "А теперь почему бы нам не обсудить мою следующую идею?"
1007803-66 = "И если понадобится..."
1007803-67 = "можете задержаться со мной допоздна!"
1007803-68 = "[s] «...»"
1007803-70 = "[ns5] «Хорошо. Я могу.»\n[ns6] «Ладно. Но я не позволю собой помыкать!»"
1007803-73 = "Уахаха! Хорошо, хорошо! Иначе и быть не должно!"
1007803-74 = "Ну что, займёмся серьёзными поисками?"
1007803-75 = "Нам нужно найти идеальное место!"
1007803-76 = "Место, которое сделает счастливыми меня, вас и всех остальных!"
1007803-78 = "Я остался с Касуми до глубокой ночи, склонившись над картой и обсуждая её планы."
1007803-79 = "Мы страстно спорили о том, какие места подойдут лучше всего."
1007803-82 = "Было почти утро, когда мы наконец выбрали хорошее место, после чего Касуми уснула прямо на карте."
