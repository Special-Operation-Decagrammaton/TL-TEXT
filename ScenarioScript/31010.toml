[translation]
31010-1 = "Episódio 1;Prólogo"
31010-3 = "...Resumindo: o Tratado do Éden é uma promessa de que \"vamos parar de nos odiar\"."
31010-4 = "Ele visa pôr um ponto final na hostilidade quase irreconciliável que existe há tanto tempo entre Trinity e Gehenna."
31010-5 = "É um processo para dissolver o ódio que só pôde se acumular eternamente pela falta de confiança mútua e, em seu lugar, começar a construir uma nova relação de confiança."
31010-6 = "Ou, dizendo de forma ainda mais simples: é um tratado de paz entre Gehenna e Trinity."
31010-7 = "Contudo, com o desaparecimento da Presidente do Conselho Estudantil Geral, esse tratado perdeu todo o seu significado."
31010-8 = "\"Éden\"... É o nome do paraíso que aparece nas escrituras antigas. Não sei que significado ela quis colocar nisso, mas deve ser só o mau gosto de sempre da Presidente do Conselho Estudantil Geral."
31010-10 = "Você conhece os \"Sete Antigos Princípios\" de Kivotos?"
31010-11 = "O quinto deles era justamente uma pergunta sobre o \"Paraíso\"."
31010-12 = "\"É possível provar a verdade daqueles que alcançaram o Paraíso?\""
31010-13 = "Assim como os outros Antigos Princípios, é uma sequência de palavras um tanto difícil de compreender. Mas, como uma interpretação possível, podemos enxergar isso como um \"paradoxo sobre a prova da existência do Paraíso\"."
31010-14 = "Se um lugar chamado Paraíso realmente existir, aqueles que o alcançarem serão tomados por uma satisfação e alegria supremas, e por isso jamais sairão de lá por toda a eternidade."
31010-15 = "E se alguém saísse do Paraíso, isso significaria que aquele lugar não era um \"verdadeiro Paraíso\", capaz de proporcionar o êxtase genuíno."
31010-16 = "Sendo assim, alguém que tenha alcançado o Paraíso jamais será observado fora dele. Sua existência jamais poderia ser detectada."
31010-19 = "É possível provar a verdade de alguém que não existe?"
31010-20 = "No fim das contas... esse quinto Antigo Princípio é uma \"pergunta indecifrável\" sobre algo que, desde o princípio, não pode ser provado."
31010-21 = "Mas, ao mesmo tempo, há algo que me faz pensar. Uma verdade que não pode ser provada não tem valor? Através desse texto quase cínico, não haveria algo que realmente se deseja questionar?"
31010-22 = "Éden... O Paraíso descrito nas escrituras. Um lugar que não existe em parte alguma e que jamais pode ser encontrado."
31010-25 = "Uma doce, doce ilusão pintada por sonhadores."
31010-26 = "O que acha? Ouvindo dessa forma, não parece que esse próprio \"Tratado do Éden\" é exatamente isso?"
31010-28 = "...Sensei."
31010-29 = "Talvez a história que está prestes a começar não seja adequada nem apropriada para alguém como você."
31010-30 = "É uma história incômoda, desagradável, abominável, de fazer franzir a testa..."
31010-31 = "Que faz duvidar do outro, duvidar das premissas, duvidar das próprias certezas, duvidar da verdade..."
31010-32 = "Triste, dolorosa e melancólica... e que, no fim, deixa apenas um gosto amargo na boca... É esse tipo de história."
31010-33 = "Mas, ao mesmo tempo, é também uma história sobre uma verdade inegável."
31010-34 = "Por favor, não dê as costas, não desvie o olhar... Quero que observe tudo com firmeza até o último instante."
31010-38 = "Pois esse, Sensei... é o seu dever por ter escolhido \"o que vem a seguir\"."
31010-51 = "Arco do Tratado do Éden"
