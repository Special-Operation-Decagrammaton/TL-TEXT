[translation]
31010-1 = "Эпизод 1;Пролог"
31010-2 = ""
31010-3 = "Эдемский договор — это, так сказать, обещание положить конец ненависти."
31010-4 = "Это соглашение о прекращении многолетнего соперничества между Тринити и Геенна."
31010-5 = "Иными словами, попытка построить доверие вместо ненависти, которая иначе продолжала бы гнить."
31010-6 = "Можно считать его мирным договором между Геенна и Тринити."
31010-7 = "Однако теперь, когда президент Генерального студсовета пропала, договор ничего не стоит."
31010-8 = "Эдем — название рая из древних писаний. Почему президент Генерального студсовета выбрала именно его, мне непонятно. Возможно, у неё было больное чувство юмора."
31010-10 = "Вы знаете о семи коанах Кивотоса?"
31010-11 = "Пятый связан с раем."
31010-12 = "«Можно ли доказать, что кто-нибудь когда-либо достигал рая?»"
31010-13 = "Как и у каждого коана, смысл вопроса расплывчат, но его можно трактовать как указание на внутренний парадокс доказательства существования рая."
31010-14 = "Если рай существует, то достигшие его останутся там навечно, навсегда окружённые радостью и удовлетворением."
31010-15 = "Если кто-то покидает рай, значит, он не был полностью удовлетворён, а следовательно, это изначально не был рай."
31010-16 = "Поэтому достигшие рая не могут быть найдены — и не должны существовать — за его пределами."
31010-19 = "Так можно ли доказать истинность существования того, кто не существует?"
31010-20 = "Смысл пятого коана в том, что на него почти невозможно ответить."
31010-21 = "Становится ли недоказуемая истина бессмысленной? Какой настоящий вопрос скрывается за таким цинизмом?"
31010-22 = "Эдем — это Рай из писаний. Он нигде не существует и его невозможно найти."
31010-25 = "Иными словами, это лишь сладкая иллюзия, созданная мечтателями."
31010-26 = "Понимаете? Наверняка именно эта метафора скрыта в названии договора."
31010-27 = ""
31010-28 = "Сенсей."
31010-29 = "История, которая сейчас развернётся, может показаться вам неприятной."
31010-30 = "Она должна вызвать дискомфорт, тревогу и оставить вас несчастным."
31010-31 = "Циничная история, которая заставит сомневаться в людях и истине."
31010-32 = "Мрачная, печальная, болезненная и в итоге горькая."
31010-33 = "Но целиком правдивая."
31010-34 = "Я прошу вас не отводить взгляд и досмотреть её до конца."
31010-35 = ""
31010-36 = ""
31010-37 = ""
31010-38 = "Ибо это ваша ответственность."
31010-51 = "Эдемский договор"
