[translation]
2601103-1 = "Удивительно похоже"
2601103-2 = "На углу торговой улицы..."
2601103-3 = ""
2601103-8 = "[ns1] Что там за шум?\n[ns2] Направиться к источнику шума."
2601103-12 = ""
2601103-13 = ""
2601103-14 = "Хм..."
2601103-15 = "Хммм..."
2601103-16 = "[s3] Привет, Сатэн.\n[s4] Что-то случилось?"
2601103-19 = "О, Сенсей!"
2601103-20 = "Нет, ничего. Ну, видишь вон там?"
2601103-21 = ""
2601103-22 = ""
2601103-23 = ""
2601103-24 = ""
2601103-25 = "Неужели так трудно найти всего ОДНОГО человека?"
2601103-26 = "Нам нужен не просто человек. Нужен кто-то, кто умеет играть в маджонг."
2601103-27 = "Нас бы и сейчас было четверо, если бы продавец книг не ушёл..."
2601103-28 = "Чёртов маджонг! Почему для него обязательно нужно четыре игрока...?"
2601103-29 = "Я бы всё отдал ещё за одну партию... Должен же здесь быть хоть кто-нибудь, кто знает правила..."
2601103-30 = ""
2601103-31 = "[ns5] Маджонг?\n[ns6] Ты смотрела, как они играют?"
2601103-34 = "Да. В моём мире тоже есть эта игра. Я удивилась, увидев, что здесь играют в неё, вот и остановилась посмотреть."
2601103-35 = "То есть это ведь совершенно другой мир, правда? Тогда почему у вас тот же маджонг и те же правила?"
2601103-36 = "И если подумать, наша культура, наш язык — всё так похоже."
2601103-37 = "Я как раз думала о том, как странно, что у наших миров столько общего."
2601103-38 = "Да...?"
2601103-39 = "Ты удивлён, что я знаю правила маджонга? Ну..."
2601103-40 = "Я... довольно часто играю в маджонг онлайн... Так что да..."
2601103-41 = "...Погоди! Что ты сейчас сказал?!"
2601103-42 = ""
2601103-44 = ""
2601103-45 = "А?"
2601103-46 = "Эй, барышня! Мы правильно расслышали?"
2601103-47 = "Ты играешь в маджонг? Это правда?"
2601103-48 = "У тебя сейчас есть время? Может, сыграешь с нами? Хотя бы один раунд!"
2601103-49 = "Погодите, что? Эм... Я—"
2601103-50 = "Пожалуйста! Мы просим всего одну партию. Больше никого найти не можем!"
2601103-51 = "Если сейчас закончим, я буду настолько неудовлетворён, что весь день ни о чём, кроме маджонга, думать не смогу!"
2601103-52 = "Эм... Ну..."
2601103-53 = "Хм..."
2601103-54 = "[s] Вмешаться."
2601103-55 = "...О!"
2601103-56 = "Всё нормально, Сенсей. На самом деле..."
2601103-57 = ""
2601103-59 = ""
2601103-60 = "Мне правда хотелось бы сыграть партию."
2601103-61 = "Правда?! Спасибо!"
2601103-62 = ""
2601103-64 = ""
2601103-67 = "Эй, быстрее готовьте стол! И кто-нибудь принесите этой юной леди стул!"
2601103-68 = "Уже сделал! Не переживай, мы будем играть с тобой полегче."
2601103-69 = ""
2601103-71 = ""
2601103-72 = "...О?"
2601103-73 = "Полегче со мной, значит? Ну всё, сами напросились! Я играю в полную силу!"
2601103-74 = "Я покажу вам, что возраст не имеет никакого отношения к мастерству в маджонге!"
2601103-75 = "...! О-хо! Вот это настрой мне нравится!"
2601103-76 = "Хорошо, начинаем!"
2601103-78 = "Так началась маджонг-битва между Сатэн и владельцами магазинов."
2601103-79 = "Все оказались настолько сильны, что игра продолжилась ещё четыре раунда."
2601103-80 = ""
2601103-81 = ""
2601103-82 = ""
2601103-83 = ""
2601103-84 = ""
2601103-85 = ""
2601103-86 = ""
2601103-87 = ""
2601103-88 = ""
2601103-89 = ""
2601103-90 = "...Цумо!"
2601103-91 = "Риичи, пинфу, сансёку доко, цумо, дора 2..."
2601103-92 = "...Ура 2! Санбайман! Последний санбайман, по 12 000 со всех! Вот это концовка!"
2601103-93 = "Я победила! Наконец-то догнала вас по очкам!"
2601103-94 = "Ладно, следующий раунд! Давайте, давайте!"
2601103-95 = "М-Может, на сегодня уже хватит...?"
2601103-96 = "Мы ведь хотели сыграть всего одну партию... *всхлип*"
2601103-97 = "Мы не можем тягаться... с такой юношеской выносливостью..."
2601103-98 = "Что? Так нечестно! Я только-только сравнялась с вами по очкам! До этого вы всё время побеждали. Нельзя заканчивать прямо сейчас!"
2601103-99 = "Нет, мы ещё не закончили! Настоящая битва только начинается!"
2601103-100 = "Угх..."
2601103-101 = "Спасите нас..."
2601103-102 = ""
2601103-105 = "[ns] «...»"
2601103-107 = "[ns] Оттащить Сатэн от стола."
2601103-109 = "Я сослался на поздний час и убедил Сатэн отойти от стола."
2601103-110 = "...Они не поблагодарили меня вслух, но по глазам владельцев магазинов я видел их благодарность."
