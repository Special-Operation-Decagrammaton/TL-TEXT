[translation]
3202-1 = "Особый концерт принцессы Вараку 2"
3202-2 = "Наконец наступил день фестиваля Благодарения Хяккияко."
3202-3 = "Я так жду! В этот раз концерт ставит Чисэ!"
3202-4 = "Обожаю фестиваль Благодарения! Интересно, как всё пройдёт."
3202-5 = "Я специально ради сегодняшнего дня освободила место на карте памяти камеры!"
3202-6 = "Сегодня большой день! А мы до сих пор понятия не имеем, что она задумала."
3202-7 = "Похоже, так и есть."
3202-8 = "Я уже давно поняла, насколько молчаливой может быть Чисэ, если захочет."
3202-9 = "Так что я смирилась с тем, что сегодня моя роль — не режиссёр и не координатор."
3202-10 = "Почему ты смотришь из-за кулис?"
3202-11 = "Не хочешь выйти туда?"
3202-12 = "Сегодня день Чисэ."
3202-13 = "Её действия для меня совершенно бессмысленны, но я всё равно её поддержу."
3202-14 = "Тайные агенты, работающие из тени!"
3202-15 = "Ня-ха-ха. Звучит неплохо."
3202-16 = "Не думаю, что мы говорим совсем об одном и том же..."
3202-17 = "Но обе мы здесь ради Чисэ."
3202-18 = ""
3202-20 = ""
3202-21 = ""
3202-22 = ""
3202-23 = ""
3202-24 = ""
3202-26 = "Спасибо всем, что пришли на концерт «День благодарности Хяккияко»!"
3202-27 = ""
3202-31 = "Фестиваль Благодарения — давняя традиция Хяккияко. В этот день мы останавливаемся и выражаем благодарность тем, кто поддерживает жизнь нашего сообщества."
3202-32 = "И сегодня вас ждёт особое выступление! Звезда концерта — не кто иная, как любимый идол Хяккияко, принцесса Вараку Чисэ!"
3202-33 = "Давайте тепло поприветствуем Чисэ!"
3202-34 = "Привет."
3202-35 = ""
3202-37 = ""
3202-38 = ""
3202-39 = "Сначала — танец с зонтиком."
3202-40 = "Традиционные зонтики Хяккияко окрашиваются методами, передававшимися поколениями, а наша достойная история воплощена в цвете индиго—"
3202-41 = ""
3202-43 = ""
3202-44 = ""
3202-46 = "А-Ах! То есть... розовом? Зонтике? Он, эм... совсем как цветущая сакура, которой мы все так наслаждаемся! Прекрасно!"
3202-47 = ""
3202-49 = ""
3202-50 = "Переходим к следующей части! Вы увидите наши традиционные кокэси..."
3202-51 = ""
3202-53 = ""
3202-54 = "Кхм. Лису и куклу дарума!"
3202-55 = ""
3202-57 = ""
3202-58 = ""
3202-59 = "Похоже, не только нам она ничего не объяснила."
3202-60 = "Это вообще не следует обычному сценарию! Наши традиции Благодарения..."
3202-61 = "Зрители наверняка совершенно растеряны!"
3202-62 = "Чисэ правда самая милая!"
3202-63 = "Чисэ всегда выступает потрясающе!"
3202-64 = "Вот это наша идол!"
3202-66 = "...Им всё равно! Я благодарна, но почему это работает?!"
3202-67 = ""
3202-68 = ""
3202-69 = ""
3202-70 = ""
3202-71 = "Наконец всё закончилось... Кхм! То есть мы подошли к завершению концерта «День благодарности Хяккияко»."
3202-72 = "Наша звезда вечера, Чисэ, скажет несколько слов напоследок."
3202-73 = "Твой выход, Чисэ!"
3202-74 = "Желательно по сценарию!"
3202-75 = "Спасибо, что посмотрели моё выступление."
3202-76 = ""
3202-79 = "Кто-нибудь заметил, что я изменила концерт?"
3202-80 = "Да. Я сделала это, чтобы поблагодарить важных для меня людей."
3202-81 = "А-Ах, да! Конечно, именно поэтому!"
3202-82 = "Можешь рассказать, кто они, Чисэ?"
3202-83 = "Мои важные люди — это..."
3202-84 = ""
3202-85 = "...президент Ния и вице-президент Кахо."
3202-86 = ""
3202-88 = ""
3202-90 = "Я-Я правильно услышала?!"
3202-91 = "Я?"
3202-92 = ""
3202-94 = ""
3202-95 = "Без президента и вице-президента я бы никогда не стала принцессой Вараку."
3202-96 = "Поэтому сегодня я хотела, чтобы они повеселились среди зрителей."
3202-97 = "Вот почему ты изменила реквизит и цвета?"
3202-98 = "Ты сделала это ради нас..."
3202-99 = "Ня-ха-ха! Теперь все кусочки встали на свои места."
3202-100 = "Чисэ выбрала розовый зонтик, потому что любимый цвет Кахо — розовый."
3202-102 = "А вместо кокэси ты выбрала кукол, похожих на Нию и меня."
3202-103 = "Что значит «похожих на Нию»? Ты правда так думаешь, Кахо?"
3202-104 = "Двигаемся дальше... Смотри, Ния. Ты почти каждое утро пьёшь апельсиновый сок этой марки."
3202-105 = "Весь мерч, который Чисэ купила, с моим любимым персонажем!"
3202-106 = "Это даже наш с Нией любимый вкус пудинга..."
3202-107 = "Ах, да. Ого! Невероятно! Я правда впечатлена, Чисэ."
3202-108 = "Но прежде чем мы окончательно растрогаемся..."
3202-109 = "Скажи. Чем именно я похожа на даруму, например—"
3202-111 = "Чисэ! *всхлип* Как мне тебя отблагодарить?"
3202-112 = "Прости, что я следила за тобой и сомневалась в твоих режиссёрских решениях!"
3202-113 = "Я не знала, что ты так делала, но всё хорошо."
3202-114 = "Я очень ценю вас обеих. Президент Ния. Вице-президент Кахо."
3202-115 = "И дальше..."
3202-116 = "Надеюсь, мы ещё много раз будем веселиться вместе."
3202-118 = "Конечно, Чисэ!"
3202-119 = "Ня-ха-ха! Даже говорить не нужно."
3202-121 = "Только одно маленькое уточнение. Вернёмся к даруме..."
3202-122 = ""
3202-126 = "...Вот и всё."
3202-127 = "[s1] «Уверен, Кахо и Ния были тронуты.»\n[s2] «Я рад, что всё прошло хорошо.»"
3202-130 = "Глаза вице-президента Кахо превратились в реки."
3202-131 = "Президент Ния не плакала, но было видно, что ей понравилось."
3202-132 = "Миссия выполнена."
3202-133 = "[s] «Ты правда хорошо ладишь со всеми в Клубе Инь-Ян»."
3202-134 = "Да. Это так."
3202-135 = "Мы с президентом Нией и вице-президентом Кахо создали много общих воспоминаний."
3202-136 = "Мы втроём и есть Клуб Инь-Ян."
3202-138 = "Особый концерт принцессы Вараку"
