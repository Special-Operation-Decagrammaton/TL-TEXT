[translation]
2003005-1 = "Всегда есть что-то новое"
2003005-2 = "Я никак не мог понять, зачем человеку, одержимому только едой, участвовать в спортивном дне, но..."
2003005-3 = "Я наблюдал за соревнованием Харуны наполовину с ожиданием, наполовину из любопытства."
2003005-4 = ""
2003005-6 = "Немного рановато. До готовности ещё далеко."
2003005-7 = "[s1] «Моя работа — болеть за своих студентов!»\n[s2] «Мне было интересно, в чём ты участвуешь.»"
2003005-10 = "Не просто в ОДНОМ соревновании, Сенсей."
2003005-11 = "В соревнованиях!"
2003005-12 = "[s] «Что? Ты участвуешь больше чем в одном?»"
2003005-13 = "Хи-хи..."
2003005-14 = "Да. Я отношусь к этому начинанию совершенно серьёзно."
2003005-15 = "[s3] «Теперь мне правда интересно!»\n[s4] «Что же настолько разожгло энтузиазм Харуны?!»"
2003005-18 = "Хи-хи. Первое соревнование — это..."
2003005-19 = ""
2003005-22 = "Участница Куродатэ Харуна. Просим выйти на старт следующего соревнования — поедания хлеба."
2003005-23 = "[s] «...Ах.»"
2003005-24 = "Да, Сенсей. Даже в такой соревновательной атмосфере мы, Общество исследования гурманов, остаёмся Обществом исследования гурманов."
2003005-25 = "Наш долг — убедиться, что вся эта еда приготовлена по стандартам!"
2003005-26 = "[s] «...Да. Хорошо. Веселись.»"
2003005-27 = "Спасибо, что болеете за меня."
2003005-28 = ""
2003005-30 = ""
2003005-31 = "Я приложу все силы в соревновании по поеданию хлеба!"
2003005-34 = "Харуна бодро отправилась к стартовой линии."
2003005-35 = ""
2003005-38 = "Все участницы выстроились у старта, и..."
2003005-39 = ""
2003005-43 = ""
2003005-44 = ""
2003005-47 = "Харуна стойко прошла все этапы, и наконец они добрались до последнего раунда с хлебом!"
2003005-50 = ""
2003005-51 = "Хи-хи..."
2003005-52 = "[s] «Ты сможешь, Харуна!»"
2003005-53 = ""
2003005-55 = ""
2003005-56 = "Итак, кульминация соревнования по поеданию хлеба. Позвольте мне попробовать!"
2003005-57 = ""
2003005-59 = ""
2003005-60 = "*ням*"
2003005-61 = ""
2003005-63 = ""
2003005-64 = ""
2003005-65 = "*ням* *ням* *ням*"
2003005-66 = ""
2003005-68 = ""
2003005-69 = "М-м..."
2003005-70 = "[s] «Ой-ой, выражение лица Харуны...?»"
2003005-71 = ""
2003005-73 = ""
2003005-75 = "Этот хлеб...! Всё неправильно! Совершенно неправильно!"
2003005-76 = "Вы решили, что раз это всего лишь соревнование, на качестве можно сэкономить?"
2003005-77 = "Снаружи он слишком сухой, внутри слишком воздушный, а хуже всего — до сих пор ощущается вкус муки!"
2003005-78 = "Они слишком долго оставили дрожжи бродить? Или считают ниже своего достоинства разогревать духовку перед тем, как ставить туда тесто?"
2003005-79 = "Отвратительно. А я-то думала, преимущество массового производства в том, чтобы хотя бы поднять среднее качество каждого изделия, пусть и не до вершины..."
2003005-80 = "Участница Куродатэ Х-Харуна внезапно перестала есть и начала тираду о ферментации?"
2003005-85 = "...Харуна ещё довольно долго основательно отчитывала каждого судью и организатора..."
2003005-88 = "А затем началось следующее соревнование."
2003005-89 = "[s] «Итак, соревнование по поеданию хлеба позади. Что дальше?»"
2003005-90 = "Да. Следом я участвую в полосе препятствий."
2003005-91 = "[s] «Хорошо! На этот раз всё иначе!»"
2003005-93 = ""
2003005-94 = "Когда я услышала, что на забеге на длинную дистанцию можно попробовать спортивные напитки, я записалась туда..."
2003005-95 = "Но в них слишком много сахара! Он буквально мешает жидкости быстрее усваиваться!"
2003005-96 = "Конечно, измученному телу важно быстро дать источник энергии."
2003005-97 = "Но если сахара столько, что он уже липнет к языку, это проблема!"
2003005-99 = "Это спортивный напиток или энергетик? Хм?!"
2003005-100 = "Если уж хотелось подчеркнуть сладость, почему бы не использовать умеренное количество искусственного подсластителя?"
2003005-101 = "[s] «Безжалостная дегустационная оценка даже во время полосы препятствий?!»"
2003005-102 = "Я ещё не закончила!"
2003005-105 = ""
2003005-106 = "За участие в стрельбе из лука давали пончики со взбитыми сливками, поэтому я записалась..."
2003005-107 = "Но что это?! Это не пончик со взбитыми сливками. Это... растительное масло?!"
2003005-109 = "Взбитые сливки — это сливочный слой, снятый с цельного молока!"
2003005-110 = "Даже если имитировать текстуру взбитых сливок, растительные сливки неизбежно проходят определённую обработку!"
2003005-111 = "Как бы похожи они ни были, различия во вкусе всё равно останутся!"
2003005-114 = "...Так страстная тирада Харуны продолжалась от соревнования к соревнованию..."
2003005-117 = "Наконец... последнее соревнование."
2003005-118 = "Поиск конфеты в муке. Побеждает тот, кто первым найдёт спрятанную конфету, используя только рот."
2003005-119 = "Сенсей. Вы смотрите? Болейте за меня до самого конца, хорошо?"
2003005-120 = "[s] «Эм... Да. Это соревнование тебе подходит...»"
2003005-124 = "Харуна снова встала у стартовой линии."
2003005-125 = ""
2003005-130 = ""
2003005-131 = ""
2003005-135 = "Она неслась вперёд так, будто совсем не устала, и зарылась лицом в доску, покрытую мукой с конфетами...!"
2003005-136 = ""
2003005-139 = "Впереди, как ни удивительно, Куродатэ Харуна из академии Геенна!"
2003005-140 = ""
2003005-143 = "Участница Харуна рвётся вперёд. Она несётся изо всех сил!"
2003005-144 = "И приближается к финишу..."
2003005-145 = ""
2003005-148 = ""
2003005-150 = "И... она победила! Все слышат? Она победила!"
2003005-151 = ""
2003005-154 = "Ах! Участница Харуна... Она пересекла финиш, но всё ещё бежит! Куда она направляется?!"
2003005-158 = ""
2003005-159 = "Сенсей, вы смотрели?"
2003005-160 = "[s] «Конечно. Поздравляю с первым местом!»"
2003005-161 = "Хи-хи..."
2003005-164 = "― [log=하루나 체육복ND]Это было захватывающее и вкусное соревнование.[/log][wa:1060]"
2003005-166 = "― [log=하루나 체육복ND]Я немного испачкала лицо, но оно того стоило.[/log][wa:10]"
2003005-169 = "― [log=하루나 체육복ND]На этой неизведанной территории из муки...[/log][wa:2250]"
2003005-171 = "― [log=하루나 체육복ND]Сам процесс поиска конфеты с помощью чувств...[/log][wa:710]"
2003005-174 = "― [log=하루나 체육복ND]оказался очень похож[/log][wa:660]"
2003005-176 = "― [log=하루나 체육복ND]на исследование гастрономии...[/log] [wa:10]"
2003005-179 = "― [log=하루나 체육복ND]Мне это показалось очень свежим опытом.[/log][wa:10]"
2003005-182 = "― [log=하루나 체육복ND]Ах, чуть не забыла![/log][wa:520]"
2003005-185 = "― [log=하루나 체육복ND]Сенсей. Хотите это?[/log][wa:870]"
2003005-188 = "― [log=하루나 체육복ND]Конфета, которую я выиграла... [/log][wa:850]"
2003005-190 = "― [log=하루나 체육복ND]Не хотите разделить её со мной?[/log][wa:120]"
2003005-193 = "Я возвращался вместе с Харуной, отказавшись от конфеты, которой она хотела поделиться..."
2003005-194 = "Я думал, она будет ворчать из-за низкого качества еды на соревнованиях, но она почему-то выглядела необычно бодрой."
