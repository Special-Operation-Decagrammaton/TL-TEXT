[translation]
2002502-1 = "Делаем кадомацу"
2002502-2 = "На Новый год я отправился навестить Харуку. Мне казалось, я знаю дорогу, но..."
2002502-4 = "Я заблудился. За ночь выпал снег, и я не смог найти тропинку."
2002502-5 = "[ns] «...»"
2002502-8 = "Хм... Это подойдёт?"
2002502-9 = "Нет, э-этого недостаточно! Нужно что-нибудь... что-то, что подойдёт к ним..."
2002502-10 = "[s1] «Это... Харука?»\n[s2] Найти источник голоса."
2002502-14 = ""
2002502-15 = ""
2002502-16 = ""
2002502-17 = ""
2002502-18 = "Ой-ой, если так продолжится..."
2002502-19 = "У меня закончится время... Как же..."
2002502-20 = "[s3] «Привет, Харука.»\n[s4] «Ты что-то ищешь?»"
2002502-21 = "...А?"
2002502-22 = "...А?"
2002502-23 = "Эм..."
2002502-24 = "И-и-и! С-Сенсей?!"
2002502-25 = "Ч-что вы здесь делаете?"
2002502-26 = "Это из-за меня? Я-я опять случайно вам позвонила?"
2002502-27 = "О нет. О нет, нет-нет, наверняка так и есть!"
2002502-28 = "Простите. Проститепроститепроститепроститепростите..."
2002502-29 = "Я никак... никак уже не смогу перед вами загладить вину... Я хочу умереть..."
2002502-30 = "А? Ч-что значит, ничего такого?"
2002502-31 = "Зачем... вы проделали весь этот путь... п-просто чтобы поздороваться с такой, как я?!"
2002502-32 = "...Что?"
2002502-33 = "Хотите знать... что я здесь делала? О, эм..."
2002502-34 = "Просто... искала дерево... чтобы сделать кадомацу..."
2002502-35 = "Сейчас Новый год, и я просто... просто хотела позаботиться о в-всех в офисе... и о вас тоже, Сенсей."
2002502-36 = "Н-но такая, как я, никогда не сможет! Даже надеяться помочь вам всем я не могу! Я знаю."
2002502-37 = "Поэтому подумала, может быть, я... я хотя бы сделаю для вас кадомацу... Тогда желания будет исполнять кадомацу, а не я, и это будет нормально..."
2002502-38 = "Х-хм...? Вы... думаете, это одно и то же?"
2002502-39 = "О. Я... понятно... Раз кадомацу делаю я... конечно, в итоге оно всё равно бесполезное."
2002502-40 = "Конечно, я просто... как всегда впустую трачу время..."
2002502-41 = "[s5] «Идея хорошая. Давай я помогу.»\n[s6] «Можно поискать вместе с тобой?»"
2002502-42 = "А-а? В-вы... хотите сделать это вместе со мной, Сенсей?"
2002502-43 = "А-а? В-вы... хотите сделать это вместе со мной, Сенсей?"
2002502-44 = "Нет! Зачем? Э-это нелогично, Сенсей! Это должна сделать я, поэтому... Поэтому вам не нужно обращать на это внимание!"
2002502-45 = "Н-но, о нет... Отказаться от помощи — ещё у-ужаснее..."
2002502-46 = "Что... что мне делать... Я не..."
2002502-47 = ""
2002502-49 = ""
2002502-50 = "Эм, хорошо! Тогда я приму вашу помощь! И... всю оставшуюся жизнь буду пытаться отблагодарить вас!"
2002502-52 = "Мы с Харукой некоторое время искали подходящие деревья, но..."
2002502-53 = "Даже спустя час, проведённый в снегу, мы так и не нашли ни бамбука, ни сосен."
2002502-55 = "Эм... Эм... Эм..."
2002502-56 = "Сенсей... эм..."
2002502-57 = "Теперь... после всего этого... даже всей моей жизни не хватит, чтобы отплатить вам..."
2002502-58 = "[s7] «Не переживай, Харука.»\n[s8] «Всё нормально. Можешь поискать снова завтра.»"
2002502-59 = "Н-но! Я потратила ваше время! М-мы даже ничего не нашли!"
2002502-60 = "Н-но! Я потратила ваше время! М-мы даже ничего не нашли!"
2002502-61 = "Это непростительно... совершенно непростительно... отнять ваше время и н-ничего не добиться... Н-никак нельзя это исправить..."
2002502-62 = "...А?"
2002502-63 = "Вы говорите, это вообще не обязательно должен быть бамбук или сосна? К-как так?"
2002502-64 = "[s9] «Самое важное — твоё намерение, а не такие детали.»\n[s10] «Твоё желание помочь всем... уверен, оно порадует бога Нового года.»"
2002502-65 = "А? П-правда?"
2002502-66 = "А? П-правда?"
2002502-67 = "Тогда..."
2002502-68 = "П-подождите! Нет! Не «правда?» В-вы это сказали, Сенсей, значит, это правда! Абсолютно! Совершенно! Я не могу в этом сомневаться!"
2002502-69 = ""
2002502-71 = ""
2002502-72 = "Н-но пока... Сегодня... Н-ни за что я больше не могу отнимать ваше время... Поэтому... я пойду..."
2002502-73 = "Л-Ладно."
2002502-75 = "Мы с Харукой разошлись, а я вернулся в Шале закончить работу."
2002502-77 = "На следующее утро я снова навестил Харуку."
2002502-78 = ""
2002502-81 = "Хм... Это правда нормально?"
2002502-82 = ""
2002502-86 = "Может быть... выглядит немного странно, но..."
2002502-87 = ""
2002502-92 = "[ns11] Пойти на голос.\n[ns12] Помахать Харуке и позвать её."
2002502-93 = "...? Эм... З-звук?"
2002502-94 = "...? Эм... З-звук?"
2002502-95 = "...?!"
2002502-96 = "А-а-а-а-а!"
2002502-99 = "― И-и-и![wa:1120]"
2002502-101 = "― А-а... Сенсей?! Давно вы здесь...!?[wa:3240]"
2002502-104 = "― Нет! Всё не так![wa:800]"
2002502-106 = "― Я правда-правда-правда не жалуюсь! Правда![wa:2240]"
2002502-109 = "― Эм... это кажется вам...[wa:3780]"
2002502-111 = "― знакомым?"
2002502-114 = "― А-а...? Вы про это?[wa:3020]"
2002502-116 = "― Это... моё кадомацу...[wa:1100]"
2002502-119 = "― Вы сказали... В-вы сказали мне, что для таких вещей важнее всего...[wa:2360]"
2002502-121 = "― намерение..."
2002502-124 = "― Поэтому я подумала...[wa:920]"
2002502-126 = "― Я подумала, что хорошо подойдёт то, что я-я долго выращивала...[wa:10]"
2002502-129 = "― Н-но, может быть, я...[wa:670]"
2002502-131 = "― опять сделала что-то бесполезное...[wa:120]"
2002502-134 = "― Проститепроститепроститепроститепростите![wa:10]"
2002502-137 = "[ns13] «Нет. Это потрясающее кадомацу!»\n[ns14] «Ты сделала нечто удивительное. Ты потрясающая, Харука!»"
2002502-138 = "― Эм... а?![wa:4130]"
2002502-139 = "― Эм... а?![wa:4130]"
2002502-141 = "― Что? ...П-правда?[wa:2640]"
2002502-144 = "― Это... правда нормально?[wa:1240]"
2002502-147 = "― ...Хи..."
2002502-149 = "― Хи-хи..."
2002502-152 = "Мы с Харукой вместе пошли в офис, каждый нёс по кадомацу."
