[translation]
10044040-1 = "Эпизод 4;В том поезде"
10044040-2 = "*вздыхает*"
10044040-3 = "Поезда нет. Поезд ушёл."
10044040-5 = "Зря на автобусе ехали. Хотя я... ничего и не ожидала... Надо помнить об этом..."
10044040-6 = "[ns] «Кстати...»"
10044040-8 = "[ns] «...а что вообще за груз в том поезде?»"
10044040-9 = ""
10044040-12 = ""
10044040-13 = "А? Мы тебе не рассказывали?"
10044040-14 = "Не-а, Сенсею не рассказали."
10044040-15 = "О. Ага, точно."
10044040-17 = "Вы всё это время помогали, даже не зная зачем?"
10044040-18 = "[s1] «Мне сказали, что это чрезвычайная ситуация...»\n[s2] «Я всегда прибегаю, если ученику нужна помощь.»"
10044040-21 = "О-Ого... Значит, такие люди и правда существуют..."
10044040-22 = "Пахяхя, как всегда прямолинейно."
10044040-23 = "Ладно, Сенсей, слушайте. Груз в том поезде..."
10044040-24 = ""
10044040-26 = ""
10044040-28 = "...полная загадка!"
10044040-29 = "[s] «Ч-Что...?»"
10044040-31 = "Ага, мы тоже не знаем, и нам всё равно."
10044040-32 = "«Доставить штуку в место вовремя,» — вот и всё, что мы знаем."
10044040-33 = "Именно. Это всё, что нам нужно сделать. Неважно, что там."
10044040-34 = "[s] «Серьёзно.»"
10044040-36 = "К-Как вы можете так спокойно к этому относиться, Сенсей?! У меня тут куча вопросов!"
10044040-37 = "Разве не стоит хотя бы знать, ЧТО вы доставляете?"
10044040-38 = "Ну, вообще-то нам сказали, но мы не слушали."
10044040-39 = "Не-а. Слова входят, слова выпадают."
10044040-40 = "Наверное, вы ОЧЕНЬ собой гордитесь!!"
10044040-41 = "Эй! Я же сказала, это неважно!"
10044040-42 = "Работа та же самая, знаем мы или нет."
10044040-43 = "Ух... То есть вы просто делаете, что вам велят, и ничего не спрашиваете?"
10044040-44 = "А это плохо?"
10044040-45 = "Плохо...? Я-я не знаю, назвала бы я это «плохо»..."
10044040-46 = "Но разве вы не должны хотя бы уметь принимать собственные решения?"
10044040-47 = "Хмм. Наверное, да."
10044040-48 = "Но что тогда ТЫ здесь делаешь, если не «делаешь, что тебе велят»?"
10044040-49 = "Н-Ну, это..."
10044040-50 = "Ага, ты выглядишь так, будто хотела бы оказаться где угодно, только не здесь!"
10044040-51 = "Уф... Критический удар прямо в больное место..."
10044040-52 = "П-Просто... Ладно, да, ИНОГДА я делаю то, что мне велят, но это не значит, что я ХОЧУ так жить!"
10044040-53 = "К чему я вообще вела...? Неважно!"
10044040-54 = "Я всего лишь инженер, так что для меня такая свобода — просто мечта. Наверное, невозможная."
10044040-55 = "Но вы двое офицеры! У вас гораздо больше власти, чем у меня!"
10044040-57 = "Не-а. Чем больше должность, тем больше начальников."
10044040-58 = "Мы просто средний менеджмент."
10044040-60 = "Э-Это..."
10044040-61 = "Думаю, мы обе с радостью пропускали бы все эти скучные задания..."
10044040-62 = "...но ничего не делать было бы ещё скучнее, поэтому мы просто их выполняем."
10044040-63 = "Хм. Значит, даже если я стану офицером, всё будет так же. Не очень-то есть чего ждать..."
10044040-64 = "Эх, просто живи. Один день, потом другой — этого достаточно."
10044040-65 = "[ns3] «Как-то слишком глубоко пошло...»\n[ns4] «В любом случае... никто не знает, что за груз.»"
10044040-68 = "Не-а. Я ТОЛЬКО помню, что говорили: он очень, очень важный."
10044040-69 = "О-о. Может, заглянем?"
10044040-70 = "Н-Нельзя так делать..."
10044040-71 = "Разве ТЫ только что не сказала, что нам стоит знать, что мы доставляем?"
10044040-72 = "Это другое! Н-Ну, конфиденциальность и всё такое...!"
10044040-73 = "Я ничего такого не слышала. А ты? Пахяхя!"
10044040-74 = "Что скажете, Сенсей? Откроем?"
10044040-75 = "А? Без разрешения нельзя? Эх, скучно."
10044040-76 = "Ух... У меня от всего этого очень плохое предчувствие..."
10044040-77 = ""
10044040-80 = ""
10044040-81 = ""
10044040-82 = ""
10044040-83 = ""
10044040-84 = "Чем занимаешься, Хикари?"
10044040-85 = "Позвонила на следующую станцию. Поезд там."
10044040-86 = "Хм? А чем ты звонила?"
10044040-87 = "Ра-а-цией! Я украла!"
10044040-88 = "Пахяхя! Молодец, Хикари!"
10044040-89 = "Е-Если подумать, так мы действительно можем решить проблему."
10044040-90 = "Пока он снова не отправился..."
10044040-91 = "Ага, просто скажем им удержать его там! Хикари, дай сюда!"
10044040-92 = ""
10044040-94 = ""
10044040-95 = ""
10044040-96 = "Эй, эй. Слышите меня? Команда Хайлендер на той станции?"
10044040-97 = "А... Д-Да. Я вас слышу..."
10044040-98 = "Это Тачибана Нозоми из CCC. К вам только что прибыл грузовой поезд, верно?"
10044040-99 = "Он наш. Всё время сам уезжает. Какой-то сбой или типа того."
10044040-100 = "Удержите его там. Не дайте уехать. Мы сейчас будем."
10044040-101 = "Эм... мы не можем удерживать такой большой грузовой поезд на этой станции..."
10044040-102 = "И нам нужно продолжать движение пассажирских поездов..."
10044040-103 = "Нет, послушай, вы ОБЯЗАНЫ его удержать. Иначе будет огромная проблема!"
10044040-104 = "Что вообще происходит...? П-Погодите... И прямо сейчас у нас ещё идёт пря—"
10044040-105 = "Большой поезд стоять! Не уезжать, не шутка! Мы без шуток! Повторяю, без шуток!"
10044040-106 = "...Что?"
10044040-107 = "*вздох* Послушай, в том поезде ОЧЕНЬ важный груз!"
10044040-108 = "А из-за этого сбоя его носит по всей округе!"
10044040-110 = ""
10044040-111 = "..."
10044040-112 = "Поняла? Эй, ты ещё там? Ты ПОНИМАЕШЬ, насколько это важно?!"
10044040-113 = "Дай я... Здравствуйте, да, я знаю, как они звучат, но они говорят правду."
10044040-114 = "Эм... Н-Нет, я о другом..."
10044040-115 = ""
10044040-118 = ""
10044040-119 = ""
10044040-120 = "Эй, эм, мы только что сказали всё это прямо посреди прямого эфира Кронос."
10044040-121 = ""
10044040-124 = "Срочные новости!!"
10044040-125 = "Все это слышали?"
10044040-126 = ""
10044040-130 = ""
10044040-131 = "В том самом поезде находится нечто невероятное!"
10044040-132 = "Может быть, нечто настолько великое, что способно изменить судьбу всего Кивотос?"
10044040-133 = "Какова же правда, скрывающаяся за таинственным грузом?!"
10044040-134 = "Когда мы узнаем, вы услышите об этом первыми!"
10044040-136 = ""
10044040-137 = "[ns] «...»"
10044040-139 = "Это... Эм..."
10044040-140 = ""
10044040-142 = ""
10044040-143 = "Хахаха, нам конец."
