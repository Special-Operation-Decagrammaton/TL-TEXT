[translation]
1003906-1 = "RABBIT 4, Отдохнём"
1003906-2 = "Тропа возле парка Коусаги"
1003906-3 = "Я увидел Мию, сидящую на корточках и перебирающую что-то."
1003906-4 = "Эм... Не этот камень..."
1003906-5 = "И этот тоже не подходит."
1003906-6 = "[s] «Что ты делаешь?»"
1003906-7 = ""
1003906-9 = ""
1003906-10 = "С-С-Сенсей?!"
1003906-11 = "К-Когда вы пришли?"
1003906-12 = "Я совсем вас не услышала."
1003906-13 = "Вы слишком долго были рядом со мной? В-Вы тоже потеряли своё присутствие?!"
1003906-14 = "[s] «Я просто тихо шёл.»"
1003906-15 = "О... Это хорошо."
1003906-16 = "Я испугалась, что теперь в-вы такой же, как я..."
1003906-17 = "Если бы вы тоже стали невидимым..."
1003906-18 = "Никто бы не открывал мне автоматическую дверь, когда я иду на работу..."
1003906-19 = "[s] «...Вот что тебя беспокоит?»"
1003906-20 = ""
1003906-23 = "[ns] «Ладно, а что ты делала?»"
1003906-24 = "Ну, эм..."
1003906-25 = "Я собирала к-камешки."
1003906-26 = "Коллекционировать камешки — моё хобби..."
1003906-27 = "[s] «Здорово. Нашла что-нибудь интересное?»"
1003906-28 = "Н-Нет, не такое."
1003906-29 = "Мне нравятся вещи, на которые обычно никто не обращает внимания..."
1003906-30 = "Н-Например, обычный камешек, который много раз пинали ногами."
1003906-31 = "Такие камешки..."
1003906-32 = "Мне очень близки."
1003906-33 = "Поэтому я хочу о них заботиться."
1003906-34 = "[s] «Думаю, я могу это понять.»"
1003906-35 = "П-Правда?"
1003906-36 = "М-Мне приятно это слышать."
1003906-37 = "С-Сенсей. Хотите... присоединиться?"
1003906-38 = "Здесь много обычных камешков. Э-Это моё любимое место."
1003906-39 = "[s] «Хорошо.»"
1003906-42 = "Я нашёл обычный камешек и протянул его Мию."
1003906-43 = "Этот..."
1003906-44 = "Сенсей, это кусок разбитого кирпича."
1003906-45 = "У него уже было предназначение... он не совсем обычный."
1003906-46 = "[s] «А этот тогда?»"
1003906-47 = "Он такой гладкий..."
1003906-48 = "Даже человек, который не интересуется камнями, подобрал бы его."
1003906-49 = "[s] «А этот?»"
1003906-50 = "Это гранит, вулканическая порода... Он редкий..."
1003906-51 = "Сенсей. Вы выбираете только необычные."
1003906-52 = "Красивые и редкие камни заметить проще, н-но мы ищем не это."
1003906-53 = "П-Пожалуйста, отнеситесь серьёзнее!"
1003906-54 = "[s] «Ты строже, чем я думал.»"
1003906-56 = "Мы с Мию усердно искали обычные камешки до самого заката."
