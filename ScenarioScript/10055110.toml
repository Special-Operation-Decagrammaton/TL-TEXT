[translation]
10055110-1 = "Послесловие;Пираты, ниндзя и Общество Пандемониум"
10055110-2 = ""
10055110-3 = ""
10055110-4 = "Йо-хо-хо!"
10055110-5 = "Ибуки — грозная пиратка!"
10055110-6 = "Ибуки капитан, а господин Медведь — старпом..."
10055110-7 = "А Нинперо — ниндзя!"
10055110-8 = "[s1] «Ниндзя...?»\n[s2] «А я кто?»"
10055110-11 = "А, Сенсей!"
10055110-12 = "Похоже, тебе очень понравились пираты, Ибуки."
10055110-13 = "Угу! Пираты ведь такие крутые!"
10055110-14 = "Не могу сказать, что согласна, но рада, что они тебе так понравились, Ибуки."
10055110-15 = ""
10055110-17 = ""
10055110-18 = ""
10055110-19 = "Сначала ниндзя, теперь пираты..."
10055110-20 = "Но несмотря на все эти соблазны, я, конечно же, всё ещё номер один для тебя! Кихехе!"
10055110-21 = "Ниндзя... против пиратов... против Макото...?"
10055110-22 = ""
10055110-24 = ""
10055110-25 = "Скажем просто, что тебе нравятся все!"
10055110-26 = "Любовь нельзя расставить по местам!"
10055110-27 = "Трусиха. Просто сменила тему, потому что боялась, что она выберет не тебя."
10055110-28 = "Ах."
10055110-29 = "У Ибуки отличная идея! Как насчёт Ниндзя-пиратского общества Пандемониум?"
10055110-30 = "Превосходная идея!"
10055110-31 = "Ты даже не понимаешь, что она предлагает. Не соглашайся на всё подряд."
10055110-32 = "У Ибуки не может быть плохих идей!"
10055110-33 = "Ну, вообще-то это правда, но..."
10055110-34 = "Ниндзя-пиратское Общество Пандемониум...? Тебя это вообще не настораживает?"
10055110-35 = ""
10055110-36 = "[ns3] «Ниндзя... и пираты?»\n[ns4] «Ибуки — гений...?»"
10055110-39 = "...?"
10055110-40 = "Может, это я здесь от жизни отстала?"
10055110-41 = "Ахаха! Ну, вы с Ирохой всегда на разных волнах!"
10055110-42 = "Я даже не замечала...?"
10055110-43 = "Хм... И ПРАВДА не замечала?"
10055110-44 = "Ух... Чиаки."
10055110-45 = "Ахаха! Прости! Просто ты так редко смущаешься! Не смогла удержаться."
10055110-46 = ""
10055110-48 = ""
10055110-49 = ""
10055110-50 = "...Эм, Чиаки."
10055110-51 = "А?"
10055110-52 = "Простите."
10055110-53 = "За всё, что случилось на корабле. И за то, что заставила тебя волноваться."
10055110-54 = ""
10055110-56 = ""
10055110-57 = "...!"
10055110-58 = ""
10055110-60 = ""
10055110-61 = ""
10055110-62 = "Замри с таким выражением лица! Дай сделать хоть один снимок!"
10055110-63 = "Ух! Забудь! Разговор окончен!"
10055110-64 = "Ну ещё один!"
10055110-65 = ""
10055110-67 = ""
10055110-69 = "Да ну вас! Больше никогда извиняться не стану!"
