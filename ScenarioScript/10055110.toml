[translation]
10055110-1 = "Afterword Part 2;Pirates, Ninjas, and Pandemonium"
10055110-4 = "Yo-ho-ho!"
10055110-5 = "Ibuki is a scary pirate!"
10055110-6 = "Ibuki is the captain, and Mr. Bear is the vice-captain..."
10055110-7 = "And Ninpero-san is a ninja!"
10055110-8 = "[s1] \"A ninja...?\"\n[s2] \"What about Sensei?\""
10055110-11 = "Oh, Sensei!"
10055110-12 = "It seems you've taken quite a liking to being a pirate, Ibuki."
10055110-13 = "Yeah! You know, pirates are super cool!"
10055110-14 = "I'm not sure about 'cool,' but... I'm glad you like it, Ibuki."
10055110-19 = "First ninjas, now pirates, huh."
10055110-20 = "Of course, Makoto-sama is still number one! Ki-ki-ki-ki!"
10055110-21 = "Ninja... pirate... Makoto-senpai...?"
10055110-25 = "It means she likes them all!!!"
10055110-26 = "There is no hierarchy in 'liking' things!!!"
10055110-27 = "Ah, you just got nervous and tried to force a conclusion, didn't you?"
10055110-28 = "Ah."
10055110-29 = "I have a great idea! How about Ninja Pirate Pandemonium?"
10055110-30 = "Excellent!!!"
10055110-31 = "Please don't just agree without understanding what's going on."
10055110-32 = "There's no way Ibuki's suggestion could be bad!!"
10055110-33 = "Well, I suppose that's true, but..."
10055110-34 = "Ninja Pirate Pandemonium... doesn't that sound a bit too suspicious?"
10055110-36 = "[ns3] \"Ninjas and pirates...?\"\n[ns4] \"Was Ibuki a genius all along?\""
10055110-39 = "...?"
10055110-40 = "Am I the one who's out of touch with the world?"
10055110-41 = "Ahaha! Iroha-chan, you're the type who doesn't read the room, aren't you?"
10055110-42 = "I believe it's quite the opposite...?"
10055110-43 = "Hmm~ is that so?"
10055110-44 = "Uh... Chiaki?"
10055110-45 = "Ahaha! Sorry, sorry! But it's rare to see you looking so uneasy, Iroha-chan, so I couldn't help it."
10055110-50 = "Um... Chiaki."
10055110-51 = "Eh?"
10055110-52 = "I am sorry."
10055110-53 = "About that... I made you feel uneasy, didn't I? Back on the ship."
10055110-57 = "...!"
10055110-62 = "That face! Just one more time, let me see that face again!"
10055110-63 = "Oh, geez! Forget I said anything!"
10055110-64 = "Just one more time~~! Please! Let me take a picture~~!!"
10055110-69 = "I'm never doing that again!!"