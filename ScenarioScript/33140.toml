[translation]
33140-1 = "Episódio 14;Na Escuridão"
33140-5 = "Uooooooooon..."
33140-10 = "C-Confirmado... Aquela é a tal..."
33140-11 = "\"Arma tática\", é...? Não passa de um monstro."
33140-12 = "(Sinaliza com as mãos...)"
33140-13 = "Uma criação fracassada feita com base nos \"Dogmas Ancestrais\"...? Quer dizer que aquele boneco deu errado?"
33140-14 = "(Balança a cabeça)"
33140-15 = "(Continua fazendo sinais com as mãos...)"
33140-16 = "Não entendo muito bem essas coisas complicadas, mas... mesmo sendo uma falha, ainda continua sendo uma \"arma tática\"?"
33140-17 = "Bom, então tá... Mas não acha que já está na hora de descobrirem tudo? Tanto sobre o \"Conselho das Santas de Justina\", quanto sobre essa \"arma tática\" e o nosso próximo alvo."
33140-22 = "...De qualquer forma, já é tarde demais."
33140-23 = "Entre em contato com as tropas de prontidão."
33140-24 = "A partir de agora, iniciaremos a nossa marcha contra Trinity."
33140-26 = "Distrito Autônomo de Trinity - Zona das Ruínas Abandonadas"
33140-31 = "Distrito Autônomo de Trinity - Catacumbas"
33140-36 = "Distrito Autônomo de Trinity - Canais Subterrâneos"
33140-41 = "Certo, então aguardem as ordens..."
33140-42 = "..."
33140-43 = "Líder?"
33140-44 = "O-O que houve?"
33140-45 = "...Por quanto tempo deixamos este lugar vazio?"
33140-46 = "Umas três horas, eu acho..."
33140-47 = "..."
33140-48 = "...Ela está aqui."
33140-50 = "Ela?"
33140-51 = "(Sinaliza com as mãos...)"
33140-52 = "A-A Azusa-chan?"
33140-56 = "Iiih, iiiiiiiiih!?"
33140-57 = "Armadilhas!? Quando foi que ela...!?"
33140-58 = "Ah, a-aqui também!?"
33140-62 = "...!!"
33140-68 = "Não se mexam!!"
33140-69 = "...!"
33140-70 = "!!"
33140-71 = "..."
33140-72 = "O objetivo disso é nos desestabilizar. É para explorar uma brecha nossa."
33140-73 = "Como sempre, ela é ótima nesse tipo de tática. Mas, por outro lado, se lidarmos com isso com calma..."
33140-77 = "Não, pelo visto ainda deve ter mais espalhadas ao nosso redor!? Se não sairmos logo daqui...!"
33140-81 = "Hiyori!"
33140-85 = "Argh...!"
33140-86 = "Q-Que sufoco, que dor... Por que a vida tem que ser tão..."
33140-91 = "..."
33140-92 = "..."
33140-93 = "..."
33140-94 = "Ela claramente mirou na Hiyori primeiro. Se ela eliminou a sniper logo de cara, isso significa que..."
33140-95 = "...Ela pretende nos forçar a um combate corpo a corpo?"
33140-99 = "(Clack)"
33140-100 = "!!"
33140-102 = "Em cima! Granada!"
33140-106 = "Shirasu Azusa!!"
33140-113 = "Acha que vou te deixar fugir!?"
33140-114 = "Líder. Se formos atrás dela, vamos cair direitinho no jogo dela..."
33140-118 = "...Bom, fazer o quê. Princesa, como está a Hiyori?"
33140-119 = "(Faz sinais com as mãos...)"
33140-120 = "Entendi."
33140-121 = "(Sinaliza com as mãos...)"
33140-122 = "...Vai ser uma luta longa? Bom, se a Azusa estiver lutando a sério, de fato..."
33140-129 = "...Tiros da Líder. Será que ela a alcançou?"
33140-133 = "..."
33140-134 = "Não tem jeito. Vamos nós também, Princesa."
33140-135 = "..."
33140-140 = "Por aí, é!?"
33140-144 = "Não foi uma má decisão, Azusa! De frente, você jamais me venceria!"
33140-145 = "Fugindo desse jeito..."
33140-149 = "Sua única opção é tentar achar uma brecha na minha guarda!!"
33140-151 = "Arf, arf... Virar a esquina, e depois...!"
33140-158 = "!?"
33140-159 = "(Clack)"
33140-163 = "...!"
33140-164 = "..."
33140-165 = "Atsuko..."
33140-166 = "(Sinaliza com as mãos...)"
33140-167 = "...Eu recuso."
33140-172 = "CABUUUUUUUM!!!"
33140-173 = "...!?"
33140-177 = "Azusa!!"
33140-178 = "Espera, Líder. Desse jeito isso não vai ter fim."
33140-179 = "Que tal chamarmos o Conselho das Santas de Justina?"
33140-180 = "..."
33140-181 = "(Balança a cabeça)"
33140-182 = "O Conselho das Santas só intervém no conflito entre Trinity e Gehenna... Além disso, existe a possibilidade de interpretarem que a Azusa não é uma aluna de Trinity."
33140-183 = "...Huum, é um mecanismo bem chatinho, né."
33140-184 = "(Assente com a cabeça)"
33140-185 = "Pior ainda, se interpretarem que a Azusa faz parte do \"Esquadrão Arius\"..."
33140-186 = "...É, no fim das contas, os preceitos também dependem de interpretação. De fato, considerando como conseguimos esse poder em primeiro lugar, é natural que existam restrições e penalidades."
33140-187 = "Sim. E é exatamente por isso que só nos resta fazer deste jeito."
33140-188 = "O estilo de luta dela, o jeito de pensar... Basicamente, fui eu que ensinei tudo aquilo a ela. Só eu posso derrotá-la."
33140-189 = "Vamos atrás dela."
33140-193 = "...Então eu vou pelo lado oposto. Princesa, conto com você na outra rota."
33140-194 = "..."
33140-195 = "(Rumble, rumble, rumble...)"
33140-196 = "O que é isso, um terremoto...? Não, não pode ser..."
33140-197 = "Este andar inteiro está...!?"
33140-198 = "Rumble, rumble, rumble...!"
33140-199 = "Argh, quando foi que ela armou tudo isso...!? Droga, o andar de cima vai desabar. Corram!"
33140-201 = "CABUUUUUUUUUUUM!!!"
33140-203 = "Cof, cof... Ah..."
33140-204 = "Não dá pra me mexer aqui..."
33140-205 = "Azusaaaaaaaa!!!"
33140-210 = "...Cof."
33140-228 = "Xeque-mate, Azusa."
33140-229 = "...Argh."
33140-232 = "...Para alguém como você, até que mandou bem. Mas ainda assim é inútil. O seu jeito de pensar, os seus raciocínios... eu já sabia de tudo desde o começo..."
33140-233 = "Desde o início, foi uma resistência inútil."
33140-234 = "Desde quando...?"
33140-235 = "?"
33140-238 = "Desde quando Arius tem uma coisa como um míssil de cruzeiro...?"
33140-239 = "E quando foi que passaram a controlar um poder tão bizarro daqueles...?"
33140-240 = "...E aquela \"bomba que destrói auréolas\" também."
33140-244 = "..."
33140-245 = "Azusa, sabe por que você não consegue vencer?"
33140-246 = "Porque você é fraca."
33140-247 = "..."
33140-248 = "O que você acha que torna uma pessoa uma \"assassina\"?"
33140-249 = "É ter ou não a \"intenção de matar\"."
33140-251 = "Dizem que o primeiro \"assassino\" das escrituras tirou a vida de uma pessoa com uma única pedra."
33140-252 = "É disso que se trata, Azusa. Contanto que haja determinação, a ferramenta não importa. A única coisa que importa é a \"determinação\" colocada nela."
33140-253 = "Incluindo o míssil, todos os outros meios e recursos não passam de ferramentas para provar o nosso rancor... Nada mais, nada menos do que isso."
33140-256 = "Saori..."
33140-257 = "Vou perguntar mais uma vez: \"desde quando\"?"
33140-258 = "...!?"
33140-259 = "Esse rancor... naquela época, naquele lugar, eu apenas \"aprendi\" a senti-lo... Afinal, de quem é esse rancor—"
33140-260 = "Tudo é vão."
33140-265 = "Como você é fraca, Shirasu Azusa. Essa fraqueza está te mantendo acorrentada."
33140-269 = "Sim, exatamente como essa pelúcia que você se recusa a largar mesmo numa situação dessas."
33140-270 = "!!"
33140-271 = "Foi o primeiro presente que uma amiguinha te deu, é?"
33140-273 = "Que vazio."
33140-320 = "Vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio"
33140-354 = "Vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio"
33140-387 = "Vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio, vazio"
33140-388 = "Guh, aaah!?"
33140-389 = "Que vazio, Azusa."
33140-390 = "Amizade, é...? Então vou começar destruindo essa coisa inútil e vazia. Se não me engano, o nome dela era Hifumi, não é?"
33140-395 = "(Balança a cabeça)"
33140-396 = "...Princesa."
33140-397 = "...Não precisa se preocupar, estou pegando leve. Eu conheço essa daí muito bem—"
33140-407 = "Azusa, vai fugir de novo!?"
33140-412 = "..."
33140-413 = "...Continua rápida para fugir como sempre."
33140-417 = "Tanto faz, de qualquer jeito ela vai voltar."
33140-418 = "...?"
33140-424 = "Afinal, ela acabou deixando cair esta preciosa \"prova de amizade\" na fuga."
33140-425 = "..."
33140-426 = "Ela com certeza virá recuperar isto."
33140-427 = "(Sinaliza com as mãos...)"
33140-428 = "...Um inseto que encontra a luz em meio à escuridão não consegue mais viver sem ela."
33140-429 = "Uma quinquilharia dessas deve ser a luz que sustenta o coração da Azusa."
33140-430 = "Ela não vai conseguir desistir disto. Ela com certeza vai voltar."
33140-431 = "E quando isso acontecer, vou capturá-la novamente e ensiná-la mais uma vez a verdade sobre este mundo."
33140-433 = "Sim, nem que seja à força..."
33140-438 = "...Hm?"
33140-439 = "O que é isso aqui dentro...?"
33140-446 = "...!!"
33140-447 = "Isto é o que entregamos a ela na época do ataque à Seia...!"
33140-448 = "Fuja, Princesa!!!"
33140-449 = "...!"
33140-461 = "..."
33140-462 = "......"
33140-463 = "Snif..."
33140-464 = "Snif, ugh..."
33140-465 = "Desculpa, Hifumi... Me desculpa..."
33140-466 = "Com isso, eu... nunca mais vou poder... snif, ugh..."
33140-468 = "Desculpa, me desculpem, pessoal... snif, uuuugh...!! Aaaah...!!!"
33140-471 = "Próximo;A Resposta para o Quinto Koan"
