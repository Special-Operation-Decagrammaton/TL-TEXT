[translation]
10046090-1 = "Эпизод 9;После субботней ночи"
10046090-3 = ""
10046090-4 = "О, Сенсей. Вы пришли."
10046090-5 = "Знаю, прошло не так много времени, но ощущается совсем иначе!"
10046090-6 = "Ну что ж, обратно к работе! Вы пришли навестить Чаепитие?"
10046090-7 = "Я вас провожу."
10046090-14 = "...Как обычно, Нагиса со всем разобралась. Она не хотела «инцидента»."
10046090-15 = "Так что частный пляж Чаепития теперь... общественный пляж!"
10046090-16 = "А все прибывающие люди уже скрыли любые следы того, что Кружок горячих источников вообще там был."
10046090-17 = "И теперь, кажется, туда едет весь Кивотос, и..."
10046090-18 = "Ну, последствия обсуждать необязательно. Ха. Ха. Хех."
10046090-19 = ""
10046090-23 = "А? Ты это о чём?"
10046090-24 = "Для тебя это слишком сложно, Мика? Мне упростить и разжевать по буквам?"
10046090-25 = ""
10046090-27 = ""
10046090-28 = "...Хаха. Кажется, это мой сигнал уйти."
10046090-29 = "Наверное, лучше мне больше ничего не подслушивать, понимаете?"
10046090-30 = "[s1] «Спасибо, что привела меня, Ичика.»\n[s2] «А, точно. Я хотел кое-что спросить.»"
10046090-31 = ""
10046090-32 = ""
10046090-34 = ""
10046090-35 = "А? Насчёт Кружка горячих источников?"
10046090-36 = "Ну, насколько я знаю..."
10046090-38 = ""
10046090-39 = ""
10046090-41 = ""
10046090-42 = "*вздыхает*"
10046090-43 = "Вы двое можете хотя бы один день не устраивать свои мелочные ссоры?"
10046090-44 = ""
10046090-47 = ""
10046090-48 = "Отвергаю саму постановку вопроса. Настоящая интеллектуальная борьба возможна лишь между равными. А это в лучшем случае «перепалка»."
10046090-50 = "Сэя, это уже слишком..."
10046090-52 = "О? А ты, значит, так хорошо умеешь драться, Сэя?"
10046090-53 = ""
10046090-56 = ""
10046090-57 = "Мика, давай не будем спешить..."
10046090-59 = "Ты хочешь сказать, что желаешь... подраться, Мика?"
10046090-60 = "Осторожнее. Я, между прочим, чуть не убила Нагису одной тренировкой по йоге."
10046090-61 = "...? Когда это ты стала такой драматичной?!"
10046090-62 = ""
10046090-66 = "[ns3] «Привет.»\n[ns4] «Девушки, вижу, вы как обычно прекрасно ладите.»"
10046090-67 = ""
10046090-68 = ""
10046090-70 = ""
10046090-71 = "С-Сенсей? Что ты здесь делаешь?"
10046090-73 = "Я их позвала. Думаю, нам не помешает разобрать произошедшее, разве нет?"
10046090-74 = "Хотя в идеале стоило бы оставить это дело между нами, всё стало настолько запутанным, что, думаю, мы должны по-дружески пригласить Шале за наш условный стол переговоров."
10046090-75 = "Превращение пляжа из частного в общественный обернулось небольшой катастрофой. С хаосом своими силами мы не справляемся."
10046090-76 = "Поэтому Сенсей какое-то время будет навещать нас и работать вместе с нами. Мы не можем выразить им всю нашу благодарность."
10046090-77 = "[s5] «Конечно, сделаю всё, что смогу!»\n[s6] «Немного работы меня не пугает!»"
10046090-80 = "За дело!"
10046090-81 = "Нет."
10046090-82 = "Я ещё ничего не сказала!"
10046090-83 = "Мика, сначала ты должна закончить собственные обязанности. К Сенсею нельзя приближаться, пока не сдашь проект бюджета частного пляжа и пропусков для бронирования."
10046090-84 = "Бу-у, но я не хочу..."
10046090-85 = "Как я уже говорила, хочешь ты или нет — сделаешь. Ты сама попросила эту ответственность, теперь доведи дело до конца. Отпуск закончился."
10046090-86 = "Какая же ты зануда. На пляже ты была намного добрее!"
10046090-87 = "Да, а сейчас мы не там и не тогда. Мы вернулись к работе и должны вести себя соответственно. У тебя совсем нет приличий?"
10046090-88 = "Мы сыграли немалую роль в том, что Тринити постепенно стала принимать более... «расслабленную» культуру. Мы, Чаепитие, должны лучше осознавать своё влияние на академию."
10046090-89 = "Тебя это тоже касается, Сэя!"
10046090-90 = ""
10046090-93 = ""
10046090-94 = "...? Я ничего не говорила."
10046090-96 = "Она сегодня прямо в режиме зануды..."
10046090-97 = "[s] «Этот отпуск всё больше кажется сном.»"
10046090-98 = ""
10046090-100 = ""
10046090-101 = ""
10046090-102 = "Ага. Хи-хи."
10046090-110 = "Хм?"
10046090-111 = "О! Смотрите, кто здесь!"
10046090-112 = ""
10046090-117 = "Какой приятный сюрприз. Какими судьбами?"
10046090-118 = "А? Я одна? Тебе-то что?"
10046090-119 = ""
10046090-121 = ""
10046090-122 = ""
10046090-123 = "Что бы там ни было, говори потише. Староста узнала о моём «добром деле» для девчонок из Тринити."
10046090-124 = "И скажем так: она не в восторге."
10046090-125 = "Я устроила отпуск для ребят — по крайней мере, пока мои приятели из Пандемониума не отвлекут внимание старосты."
10046090-126 = "Так что я оплатила заслуженный отдых всем членам кружка! Вахаха!"
10046090-127 = ""
10046090-129 = ""
10046090-130 = "О, а почему я всё ещё здесь?"
10046090-131 = "Как вы знаете, Сенсей, я очень популярна."
10046090-132 = ""
10046090-134 = ""
10046090-135 = "Поскольку меня все узнают, я становлюсь центром внимания, все смотрят на меня... и в итоге никто не может нормально расслабиться в отпуске."
10046090-136 = "...Вот поэтому я наслаждаюсь временем в одиночестве! Самое время спокойно почитать! Вахаха!"
10046090-137 = "Это было чудесно. Вы же знаете, я никогда добровольно страдать не стану, Сенсей."
10046090-138 = "Короче говоря, Кружок горячих источников временно закрыт. Если вы кого-то ищете... эм, удачи!"
10046090-139 = "А? Нет? Вы хотели поговорить со мной?"
10046090-140 = "Угх. Вопреки распространённому мнению, я не филантроп. Бесплатно ничего не делаю."
10046090-141 = "Хотя, с другой стороны, вы столько раз мне помогали. А я всё-таки известна своим добрым сердцем."
10046090-142 = "Ну? Что вам нужно?"
10046090-143 = "[s7] «Насчёт того, что было раньше...»\n[s8] «Почему ты решила помочь Ичике?»"
10046090-146 = "Ха, какой странный вопрос, да ещё и с такой ошибочной предпосылкой."
10046090-147 = "У нас был договор. Я вернула конфискованные материалы и получила кусочек пляжа..."
10046090-148 = "...Что? Ты ведёшь себя так, будто это была благотворительность!"
10046090-149 = "..."
10046090-150 = "Что за взгляд? Большинство людей только и ждут, когда я отвечу, чтобы побыстрее уйти."
10046090-151 = "Хочешь услышать мои настоящие мысли, да?"
10046090-152 = ""
10046090-154 = ""
10046090-155 = ""
10046090-157 = ""
10046090-159 = "Ну..."
10046090-160 = "Причины нет. Просто захотелось."
10046090-161 = "Что, думаешь, я вру?"
10046090-162 = ""
10046090-164 = ""
10046090-165 = "Это правда настолько необычно?"
10046090-166 = "Разве ты никогда не... изображаешь лёгкое безумие и не делаешь что-нибудь спонтанное?"
10046090-167 = "Я так постоянно делаю. И просто вышло, что на этот раз это оказалось на руку милашке Ичике. Ничего странного."
10046090-168 = "А, давай просто примем это и двинемся дальше, ладно?"
10046090-169 = "Будь проще. Никто не любит любопытных зануд."
10046090-170 = ""
10046090-175 = "Президент!"
10046090-176 = ""
10046090-178 = ""
10046090-179 = "Ого!"
10046090-180 = ""
10046090-182 = ""
10046090-183 = ""
10046090-184 = "О, Сенсей тоже здесь! Отлично! Я принесла мороженое!"
10046090-185 = "Хотя если дам вам обоим по одному, придётся пойти покупать ещё одно для себя!"
10046090-186 = "Э-Эм...?"
10046090-187 = "Погоди, стой. Стой, Мэгу."
10046090-188 = "...Хм? А? Почему ты здесь?"
10046090-189 = "Что такое, президент? Почему у тебя такой страдальческий вид?"
10046090-190 = "Эм, Мэгу? Ты хотела... тихонько почитать вместе со мной или что-то такое?"
10046090-191 = "Эм, нет. Я люблю комиксы, но в твоих книгах одни буквы, да ещё и очень мелкие."
10046090-192 = "Да. Именно так я и думала."
10046090-193 = "...Тогда что ты здесь делаешь?"
10046090-194 = "Ты сказала, что мы можем делать что угодно! Вот я и делаю!"
10046090-195 = "Хм? А?"
10046090-196 = ""
10046090-201 = ""
10046090-202 = "Погоди, что? Это вице-президент Мэгу?"
10046090-203 = "Я думала, здесь только президент, поэтому лишнего не купила..."
10046090-204 = ""
10046090-206 = ""
10046090-208 = ""
10046090-209 = "...Что? Я непонятно выразилась?"
10046090-210 = "Я же сказала вам всем делать что хочется! Развлекайтесь! Почему вы все здесь?"
10046090-211 = ""
10046090-214 = ""
10046090-215 = "Хм? Ну... Я подумала, что тебе одной будет скучно и ты сама будешь скучной."
10046090-216 = "Точно? Президент, когда ты одна, ты просто тихо читаешь книжки."
10046090-217 = "И вообще, мы же это не планировали."
10046090-218 = "Ага, мы просто случайно встретились перед тем, как сюда прийти."
