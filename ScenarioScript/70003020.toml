[translation]
70003020-1 = "Журнал Хайлендер 2"
70003020-3 = "Эй, в том вагоне драка!"
70003020-4 = "Да? Здесь тоже!!"
70003020-5 = "Хаха, как и ожидалось от Внутренней кольцевой линии! Здесь никогда не скучно!"
70003020-7 = "Машинное отделение поезда"
70003020-8 = "А-Ай..."
70003020-9 = "Во всех вагонах? Серьёзно? Невероятно..."
70003020-10 = "Спокойное утро усыпило нашу бдительность."
70003020-11 = "Господи! Почему у нас не может быть хотя бы одного дня, когда всё проходит нормально?"
70003020-12 = "Мы не справимся со всем этим одни..."
70003020-13 = "Ч-Что нам делать...?"
70003020-14 = "Давайте вызовем подкрепление. Без сил подавления мы ничего не сделаем."
70003020-15 = "..."
70003020-16 = "А, поняла. Я вызову CCC."
70003020-17 = ""
70003020-19 = ""
70003020-21 = ""
70003020-22 = "А? Внутренняя кольцевая линия HL9000?"
70003020-23 = "Что... там происхо-о-одит?"
70003020-25 = "Н-Ну...!"
70003020-26 = "Сейчас у нас беспорядки абсолютно во всех вагонах!"
70003020-27 = "Внутренней бригаде Хайлендер с этим не справиться!"
70003020-28 = "Просим подкрепление. Наше текущее местоположение—"
70003020-30 = "Не-е-ет. Не... получится!"
70003020-31 = "У нас своих проблем по горло! Нечего выделить."
70003020-33 = "Что?! Тогда ч-что нам делать??"
70003020-35 = "Да не напрягайтесь! И берегите членов бригады, ну и всё такое."
70003020-36 = "Подкрепление... будет! Скоро!"
70003020-38 = "У-Ух...! Да! Поняла...!"
70003020-39 = ""
70003020-41 = ""
70003020-42 = ""
70003020-44 = ""
70003020-45 = "Значит, нам просто... ждать на месте?"
70003020-46 = "Так они сказали..."
70003020-47 = "Может, просто остановим движение на следующей станции, чтобы дать подкреплению время добраться?"
70003020-48 = "Мм... Тогда, может, часть пассажиров просто выйдет..."
70003020-49 = ""
70003020-51 = ""
70003020-52 = "..."
70003020-53 = "Нам правда обязательно это делать...?"
70003020-54 = "А что ещё МЫ можем сделать? Нас всего трое..."
70003020-55 = "Ситуация такая, какая есть."
70003020-56 = "Сколько бы они ни разгромили поезд, всё можно починить, если мы доберёмся до депо."
70003020-57 = ""
70003020-59 = ""
70003020-60 = "И это... правда всё, что мы можем?"
70003020-62 = "Хм?"
70003020-64 = "Такими темпами наша пунктуальность, правила безопасности, объявления, которых мы всегда придерживались..."
70003020-65 = "...всё это потеряет смысл."
70003020-66 = "Как студенты Железнодорожной академии Хайлендер, мы должны исправно управлять этим поездом и безопасно доставлять пассажиров к месту назначения."
70003020-68 = "Н-Но...! Что мы вообще можем сделать?"
70003020-69 = "Именно те пассажиры, которых мы должны доставить, и разносят всё вокруг!"
70003020-70 = "Вот оно!"
70003020-71 = ""
70003020-73 = ""
70003020-74 = "Наша обязанность — управлять поездом и защищать пассажиров."
70003020-75 = "Но! Посмотрите на тех, кто разрушает наши вагоны!"
70003020-77 = "Разве их вообще можно назвать пассажирами?!"
70003020-78 = ""
70003020-80 = ""
70003020-81 = "А? Н-Ну..."
70003020-83 = "Они только цепляются к поезду без билетов, мешают другим, провоцируют насилие и ещё торгуют!"
70003020-84 = "Если наша обязанность — защищать хороших пассажиров, значит наша обязанность и удалять плохих!"
70003020-85 = "С-Серьёзно...?"
70003020-86 = "Подумайте! Только они и мешают нам работать как обычно!"
70003020-87 = "Д-Даже если мы попробуем, как...? У нас не хватит силы..."
70003020-88 = "Хватит! У нас есть сила!!"
70003020-89 = "У всех ведь есть оружие, разве нет?!"
70003020-90 = "Т-Ты хочешь, чтобы мы вышли и начали драться?"
70003020-91 = "Мы поездная бригада! Всего лишь жалкая бригада Хайлендер!"
70003020-92 = "Нет, мы не только это! Именно мы управляем этим поездом!"
70003020-93 = ""
70003020-95 = ""
70003020-97 = "Хорошо."
70003020-98 = "Да. Сделаем это!"
70003020-100 = "Вагон 7"
70003020-101 = "До чего докатился Кивотос?! Современные дети знают только неуважение!"
70003020-102 = "А, серьёзно...?! Ты всё ещё продолжаешь...?"
70003020-104 = "Ты меня слышала! Вам, детям, всё слишком легко! Вот в мои времена—!!"
70003020-105 = ""
70003020-109 = "Аргх!"
70003020-110 = ""
70003020-112 = ""
70003020-114 = ""
70003020-115 = ""
70003020-117 = ""
70003020-118 = "Вагон 7 подавлен."
70003020-119 = "Хорошо. Двигаемся дальше."
70003020-120 = ""
70003020-122 = ""
70003020-124 = "...Эм?"
70003020-125 = "Т-Только что...? Это было...?"
70003020-127 = "Вагон 3"
70003020-128 = "Хаха! Такими темпами я поставлю рекорд продаж за месяц!"
70003020-129 = "Скоро доберусь до сапфирового ранга... Хи-хи..."
70003020-130 = "Держитесь, президент! Ещё немного, и мы сможем возродить наш клуб!!"
70003020-131 = ""
70003020-133 = ""
70003020-136 = "Аргх!"
70003020-137 = ""
70003020-139 = ""
70003020-142 = ""
70003020-143 = "Конфискуйте весь нелегальный товар."
70003020-144 = "Положитесь на меня. Ни одного не пропущу."
70003020-145 = ""
70003020-146 = "Вагон 8"
70003020-147 = "Эй! Ты знаешь, КТО Я такая?? А?!"
70003020-148 = "Да понятия не имею, кто ты!! Сколько тебе лет вообще? А?!"
70003020-149 = "Мне хватит одного звонка, и тебя—"
70003020-150 = "Да ну? Тогда звони! Давай!!"
70003020-151 = ""
70003020-154 = ""
70003020-155 = ""
70003020-157 = "А-а-а!"
70003020-158 = "Ааа!"
70003020-159 = ""
70003020-161 = ""
70003020-164 = ""
70003020-165 = "..."
70003020-166 = "...Как тихо теперь."
70003020-167 = "...Ага."
70003020-168 = "Обычно мы бы без толку мучились, пытаясь уговорить и задобрить всех этих людей..."
70003020-169 = "Они бы ни за что не ушли спокойно. Пришлось бы извиняться и умолять..."
70003020-170 = "Ага... извиняться... хотя мы вообще ни в чём не виноваты."
70003020-171 = ""
70003020-173 = ""
70003020-174 = "Может... теперь будем работать вот так?"
70003020-175 = "Вот и я о чём. Это было... так просто. Так легко."
70003020-176 = "Почему мы всё это время мучились?"
70003020-177 = "Оружие — это правда..."
70003020-178 = "...реально ПОТРЯСАЮЩЕ!"
70003020-179 = "Да! И этот способ потрясающий!"
70003020-180 = "Теперь этот поезд НАШ!"
70003020-182 = "..."
70003020-183 = "О-Они стреляли в пассажиров..."
70003020-184 = "Я тоже их видела..."
70003020-185 = ""
70003020-188 = "Они сошли с ума!!"
70003020-189 = ""
70003020-197 = "..."
70003020-198 = "Мы услышали, что тут всё норм, и пришли..."
70003020-199 = "...Что, чёрт возьми, здесь произошло?"
70003020-200 = "Как видите, ситуация под контролем!"
70003020-201 = "Мы разработали идеальный метод!"
70003020-202 = "Да! Мы эффективно использовали огнестрельное оружие и взрывчатку в поезде!"
70003020-204 = "Э-Это они! Эти члены поездной бригады Хайлендер стреляли по пассажирам!!"
70003020-205 = ""
70003020-207 = ""
70003020-208 = "И-Им вообще можно так делать? Разве они не должны нас защищать?!"
70003020-209 = ""
70003020-211 = ""
70003020-213 = "Ага-а. Всё но-орм."
70003020-214 = "...Норм?"
70003020-215 = "Угу, угу. Это... самооборона..."
70003020-216 = ""
70003020-218 = ""
70003020-219 = "Устрани их, пока они не устранили тебя. Всё но-орм."
70003020-220 = "...А?"
70003020-223 = "Круто! Не думала, что у вас духу хватит! Вы реально сделали это!"
70003020-224 = "Ага, угу. Так держать."
70003020-225 = "Пахяхя! Все здесь — студенты месяца!"
70003020-226 = ""
70003020-227 = "М-Мы сделали это...!"
70003020-228 = "Эй, это реально?! Мои самые безумные мечты сбылись!"
70003020-229 = "Я знала! Старая поговорка «Ответ кроется в порохе» была права!"
70003020-230 = "Все, давайте всегда добросовестно выполнять свои обязанности!"
70003020-231 = "На этом сегодняшний влог окончен! Пожалуйста, продолжайте любить нас, Железнодорожную академию Хайлендер!!"
70003020-232 = ""
70003020-234 = ""
70003020-236 = "С этого момента я езжу на автобусе..."
70003020-237 = "Журнал Хайлендер"
