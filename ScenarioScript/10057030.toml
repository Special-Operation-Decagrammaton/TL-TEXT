[translation]
10057030-1 = "Episode 3;What brings you here?"
10057030-2 = "Does not everyone think Erina is acting really weird?"
10057030-3 = "She is always like that. Every time she opens her mouth, it is just sarcasm!"
10057030-4 = "Everything she says makes no sense! It is like one of those cheap puddings Erina developed!"
10057030-5 = "Uhh, I can hear you, you know? Voices carry really well through curtains, don't they?"
10057030-6 = "Besides, if we are talking about making no sense, what Anna is saying is way weirder."
10057030-7 = "And... my \"H2O-over-additive pudding\" is way better than Anna's cheap machinery."
10057030-8 = "It is not cheap, it is called optimization. Have you never heard of cost-effectiveness?"
10057030-9 = "Anyway... cold air is coming in, so turn up the heater!"
10057030-10 = "Well, Erina forgot to close the gas valve, so the kitchen wall got blown off and that is why we are in this mess!"
10057030-14 = "O-Ouch! Slurp!"
10057030-18 = "...Opinion exchange session, take one."
10057030-20 = "[ns] \"Calm down, both of you!\""
10057030-22 = "[ns1] \"Could you tell me a bit more about everyone?\"\n[ns2] \"What do you all usually do?\""
10057030-26 = "As expected, I will tell Sensei the honest truth."
10057030-27 = "Not that I was really lying or anything~"
10057030-28 = "Editing is a form of processing, so it is not entirely factual. I think it is better to tell the whole story."
10057030-29 = "I read in a book that scientists win with facts."
10057030-30 = "Hmm..."
10057030-31 = "Nn..."
10057030-35 = "...Actually, Class 183 is a special class where students who receive disciplinary punishment are sent."
10057030-36 = "For various reasons, instead of being suspended, we are doing research requested by the Secretariat."
10057030-37 = "While managing the class research projects... as a personal project, I design cheap items with minimal equipment and--"
10057030-38 = "In our spare time, we take external requests from everyone to earn pocket money and funds for tank production."
10057030-39 = "[s] \"Suspended?\""
10057030-40 = "Ugh, it is so embarrassing to talk about..."
10057030-41 = "I was the chief engineer tasked with designing President Cherino's personal tank."
10057030-42 = "Working within a low budget, I made it according to her unreasonable demands, but..."
10057030-43 = "Of all times, it broke down during the parade--"
10057030-44 = "And President Cherino, having fallen into the mud, ordered my demotion to the special class."
10057030-45 = "To demote someone just because of a single failure after doing things right a hundred times..."
10057030-46 = "She should have just said if she could not do it."
10057030-47 = "Well, I guess I just tried to push the envelope too much..."
10057030-48 = "When I tried to solve public sanitation with chemistry, that fake-bearded one threw me out without a second thought, ahaha!"
10057030-49 = "[s] \"What happened?\""
10057030-50 = "I was asked by the Secretariat to... um, what was it called again...?"
10057030-51 = "You know, the thing that comes out when you turn the faucet...!"
10057030-52 = "[s] \"Tap water?\""
10057030-53 = "That is it! Jeez, I keep forgetting words..."
10057030-54 = "An-Anyway! I was told to research how to purify tap water using chemical treatment."
10057030-55 = "I figured that if tap water was clean, people would not catch colds anymore... so I decided to give it a try..."
10057030-56 = "The problem is that the equipment to treat it with ozone and chlorine costs over a hundred times our budget!"
10057030-57 = "So I disinfected it with ethanol instead! The disinfection effect was amazing, but--"
10057030-58 = "I accidentally forgot to flush out the ethanol afterward and ran the water system as is--"
10057030-59 = "[s] \"Ethanol... oh...\""
10057030-60 = "It was a massive incident that shook the entire academy. I wish Sensei could have seen the secretary's face back then."
10057030-61 = "Ugh...! Just remembering it gives me a headache..."
10057030-62 = "It was not my fault, it was the Secretariat's fault for being stingy with the budget!"
10057030-63 = "Wasn't it because Erina did not study properly?"
10057030-64 = "I did study properly, okay? Don't say ridiculous things when you are not even a chemist!"
10057030-65 = "Ah yes, the great chemist who heats volumetric flasks..."
10057030-66 = "Isn't knowing that volumetric flasks should only be used for mixing and titration basic knowledge written in textbooks?"
10057030-67 = "Wow, I had no idea! Giving lectures to someone majoring in chemistry... Class President Anna, you are truly amazing!"
10057030-68 = "Hmph, if you understand, I will let you off with this."
10057030-69 = "Since Erina is so stupid... she completely forgot that Class President Anna put ammonia in the cup she is drinking from right now."
10057030-74 = "Pfft!!!"
10057030-78 = "You've gone too far! Prepare yourself!!!"
10057030-79 = "Blech! You are the one who needs to prepare~"
10057030-84 = "...Since we have a guest today, you two have a lot of energy."
10057030-88 = "Haah... haah..."
10057030-89 = "Hah... huff..."
10057030-94 = "This is not intended for persuasion, so it is an unofficial match with no winner or loser."
10057030-101 = "...Right now, we are researching a pudding here that has been padded with water and only looks decent."
10057030-102 = "There is so much water in it that just a light breath makes it all mushy..."
10057030-103 = "Ugh! I hate being stuck out here in the middle of nowhere!"
10057030-104 = "Lana is cute so she is fine, but having this noisy, annoying person as class president is the absolute worst!"
10057030-105 = "Me too! Having Erina as vice class president is truly the worst!"
10057030-106 = "Hmph!!"
10057030-107 = "[s] \"What about Lana?\""
10057030-108 = "I did not make any mistakes."
10057030-110 = "That is true, Lana really didn't..."
10057030-111 = "Out of all of us, Lana might have it the worst..."
10057030-112 = "Being dragged out here right after enrolling."
10057030-114 = "That is correct. I have not caused any trouble since enrolling."
10057030-115 = "I merely took the entrance exam."
10057030-116 = "[s] \"You ended up here just from taking an exam?\""
10057030-117 = "Actually, there was a flaw in the exam's Scantron sheet."
10057030-118 = "Specifically, it allowed scores to be entered manually. So, I filled in my own score."
10057030-119 = "As a result, my score was 4,294,967,295, which is why I was brought here."
10057030-120 = "It is unfortunate the system was 32-bit. If it were 64-bit, it would have been 18,446,744,073,709,551,615 points."
10057030-122 = "Don't you think it is terrible? If the means are there to be used, wouldn't you want to try it?"
10057030-123 = "If she hadn't come to Class 183, Lana would have been the academy's next great hope!"
10057030-124 = "No matter how you look at it, the Scantron sheet is to blame, not Lana!"
10057030-126 = "As a result, coming here... all I do is manage Red Winter's computer systems."
10057030-127 = "Oh right. I bought what you asked for."
10057030-128 = "Ooh! Thanks, Lana!"
10057030-133 = "Nn...? Milk... six cartons? Huh?"
10057030-134 = "You said, 'Buy some milk. If they have avocados, buy six.'"
10057030-135 = "Therefore, since they had avocados, I bought six cartons of milk."
10057030-136 = "I executed the conditional statement correctly, didn't I?"
10057030-137 = "Did I do something wrong?"
10057030-138 = "...No, not at all! As expected of Lana!"
10057030-139 = "...And that is why the three of us are the entirety of Class 183."
10057030-140 = "[s] \"Three people...? Why are you holding up two fingers?\""
10057030-141 = "Because there are three of us."
10057030-142 = "[s] \"??????\""
10057030-143 = "They said they would release us if the three of us produced sufficient research results, so we do nothing but research in these mountains every day. Ah, ahaha..."
10057030-144 = "We have been trying to figure out how to get pardoned..."
10057030-145 = "We are doing our research properly, but apparently that is not enough?"
10057030-146 = "And then President Cherino said this on the radio the other day!"
10057030-147 = "\"In the next Gehenna Cup, Red Winter will definitely win!\""
10057030-148 = "I heard the winning students get the ultimate reward, and I thought, this is our chance!"
10057030-149 = "[s] \"The Gehenna Cup?\""
10057030-150 = "Ah, the Gehenna Cup is a tank league tournament where powerhouse teams from all over Kivotos gather."
10057030-151 = "The only event is tank racing. Unlike the Sports Festival where the organizer changes every time, Gehenna Academy hosts this. Since the prize money is huge, schools from all over Kivotos participate."
10057030-152 = "The preliminaries are fiercely competitive, and just participating is quite difficult, but..."
10057030-153 = "If we somehow win--we will be recognized as the best tank in Kivotos!"
10057030-154 = "As a scientist, passing up such honor is out of the question!"
10057030-155 = "Plus, it is the perfect chance to break out of here!"
10057030-159 = "The problem is... the Red Winter preliminaries are in four days!"
10057030-160 = "We don't have a turret, nor any equipment. And even if we made the parts--"
10057030-161 = "We haven't even decided on the core design."
10057030-162 = "That is why you should just do as I say!"
10057030-163 = "If we do that, we will only end up with a failure!"
10057030-164 = "Do you want to become the president of the Weird Design Association?!"
10057030-165 = "Seriously, your snarky remarks belong in a museum!"
10057030-169 = "They start fighting like this immediately, which is why I wanted to ask Sensei for help."
10057030-170 = "I heard that Sensei can perform miracles and helps students all across Kivotos."
10057030-172 = "We should do things my way this time, right, Sensei?"
10057030-173 = "No way! It should be my way~!"
10057030-178 = "[ns] \"I cannot take sides here.\""
10057030-180 = "[ns] \"Instead, I have a scientific and fair method...\""
10057030-184 = "There is a method like that?!"
10057030-185 = "I don't know what it is, but it sounds awesome!"
10057030-189 = "[ns] Propose an \"adult solution.\""
10057030-193 = "Huh?"
