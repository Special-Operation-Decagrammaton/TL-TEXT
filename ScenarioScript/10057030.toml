[translation]
10057030-1 = "Episode 3; What Brings You Here?"
10057030-2 = "Erina's such a weird girl, don't you think?"
10057030-3 = "She's ALWAYS got that attitude to her. Everytime she opens her mouth, it's#nnothing but sarcasm!"
10057030-4 = "And she just speaks nonsense! Like that stupid cheap pudding she developed!"
10057030-5 = "Hey, y'know I can hear eeeeverything you're saying, right? #nI can hear you straight through the curtain, loud and clear."
10057030-6 = "And if that's the angle you're going for, I'd like you to know that you're the one#nwho speaks weird."
10057030-7 = "Besides... #nMy \"hyper H2O-impregnated pudding\" is better than your cheapo machines."
10057030-8 = "Could you not call them \"cheapo\" machines? I prefer using the term \"optimized.\" Have you never heard of cost-effectiveness?"
10057030-9 = "More importantly... There's cold wind blowing in! Go crank the heater up!"
10057030-10 = "The main reason we're even suffering through this cold right now is because YOU forgot to turn off the gas valve and so the kitchen wall went bye-bye!"
10057030-14 = "S-shaddup! *Sniiiffle*"
10057030-18 = "...That marks the first deliberation."
10057030-20 = "[ns] \"Calm down, you two!\""
10057030-22 = "[ns1] \"Could you tell me a bit more about yourselves?\"\n[ns2] \"What do you all usually do?\""
10057030-26 = "Maybe we should actually be honest with you."
10057030-27 = "I mean, we're not exaaactly lying."
10057030-28 = "Editing is a form of manipulation, so you cannot call say you're being absolutely#ntruthful either. I believe it's best that we tell Sensei everything."
10057030-29 = "I read about this in a book where scientists compete with facts."
10057030-30 = "Hmmm..."
10057030-31 = "Nhhh..."
10057030-35 = "...Actually, Special Class 183 is a class where students who have received#ndisciplinary action are sent."
10057030-36 = "For reasons, I am conducting research by request of the Office in lieu of my#nsuspension."
10057030-37 = "While handling the research assigned to me for this class... #nI also took on an individual project to design things using minimal equipment."
10057030-38 = "In my spare time, #nI take on outside requests to earn some spare change and funding for the#nproduction of the tank."
10057030-39 = "[s] \"You were suspended?\""
10057030-40 = "Ugh... It's embarrassing to talk about it, but..."
10057030-41 = "I was the head engineer responsible for designing President Cherino's personal#ntank."
10057030-42 = "With almost no budget and absolutely unreasonable demands... #nWhat I created ultimately ended up falling apart in the middle of a parade."
10057030-43 = "And so President Cherino, having fallen in the mud, ordered that I be demoted to#nthis special class."
10057030-44 = "To think that a single failure out of a hundred successes is all it takes to be#ndemoted..."
10057030-45 = "You shoulda just said you couldn't do it if it was that impossible."
10057030-46 = "As for me though, well, I got a little toooo ambitious..."
10057030-47 = "I tried to fix the public hygiene through the power of chemistry, #nand then that fake mustache kid tossed me in here without even letting me defend#nmyself! Ahaha!"
10057030-48 = "[s] \"What happened?\""
10057030-49 = "The Office asked me to do research on... Uuhhhh, what was it called again...?"
10057030-50 = "It's that thingy, y'know? The thing that comes out when you turn on the faucet...!"
10057030-51 = "[s] \"Tap water?\""
10057030-52 = "That's the one! Gosh, the right words never come to mind..."
10057030-53 = "A-anyways! The Office wanted me to conduct research on chemically purifying tap water."
10057030-54 = "Because like, if the tap water was clean, then I wouldn't be catching colds all the#ntime... So I was like why not?"
10057030-55 = "It's just that the problem was... The cost of the equipment to perform an ozone or chlorine treatment was like 100 times my budget!"
10057030-56 = "So I decided to use ethanol to disinfect it instead! #nBut, while it WAS incredibly effective at disinfecting the water..."
10057030-57 = "I completely forgot to flush the ethanol out of the system afterward and turned#nthe water back on..."
10057030-58 = "[s] \"And so the ethanol... Ah...\""
10057030-59 = "It was a ridiculously big incident that shook up the entire academy. #nI wish you could've seen the look on the Chief Secretary's face too, Sensei."
10057030-60 = "Urgh...! Just the thought of it is giving me a headache..."
10057030-61 = "It was a huge deal at the time, you know...!?"
10057030-62 = "It wasn't my fault! It was the Office's for skimping out on the budget!"
10057030-63 = "Isn't it actually because you don't properly study?"
10057030-64 = "But I DO study properly. #nI don't want to hear this nonsense from someone who isn't even a chemist!"
10057030-65 = "A chemist who heats up volumetric flasks, huh..."
10057030-66 = "Volumetric flasks are only for mixing and titrating. #nThis is literally knowledge you can find written in a textbook."
10057030-67 = "Wooow, I toootally didn't know that! #nI can't believe you're lecturing someone who specializes in chemistry on that. #nYou're sooo awesome, class president Anna-sama."
10057030-68 = "Hmph. If you really do get it, then I'll let it slide."
10057030-69 = "Erina's just a big dumb dumb after aaall! #nShe even forgot that she put ammonia in the cup that Anna-sama is currently#ndrinking from."
10057030-74 = "Pffff!!"
10057030-78 = "You actually dare!? Grit your teeth if you know whats#ngood for you!!"
10057030-79 = "Bleeh! The one who should ready themself is you!"
10057030-84 = "...It seems having a guest over today has caused them to become quite energetic."
10057030-88 = "Pant... Pant..."
10057030-89 = "Wheeze... Pant..."
10057030-94 = "Because this was done without the intention of persuasion, it will be counted as#nan unofficial match. As such, a winner will not be decided."
10057030-101 = "...My current research here is on #nwater-laden pudding that looks like normal pudding."
10057030-102 = "It's got too much water in it, so just a light breath will turn it in a mushy mess..."
10057030-103 = "Uwaaah! I can't stand being this deep inside this stupid barren mountain#nanymoreee!"
10057030-104 = "At least Rana is cute, but I can't STAND this naggy class president that won't#nSHUT UP!"
10057030-105 = "Oh, tell me about it! It's the absolute WORST having YOU as the vice president!"
10057030-106 = "Hmph!!"
10057030-107 = "[s] \"Then, what about Rana?\""
10057030-108 = "I have not anything wrong."
10057030-110 = "That is true..."
10057030-111 = "Rana's probably the most pitiful out of us all..."
10057030-112 = "She was sent here right after she entered the school."
10057030-114 = "That's right. I haven't caused any problems since I entered the school."
10057030-115 = "All I did... was take the entrance exam."
10057030-116 = "[s] \"You were sent here for taking the entrance exam?\""
10057030-117 = "Actually, there was a vulnerability in the bubble sheet used for the exam."
10057030-118 = "To be specific, there was a way to arbitrarily input any score. #nSo, I gave myself my own score."
10057030-119 = "In the end, I received 4,294,967,295 points, which is why I was sent here."
10057030-120 = "It's a shame it was only a 32-bit system. #nIf it were a 64-bit system, I could've gotten 18,446,744,073,709,551,615 points."
10057030-122 = "Isn't it cruel? #nThey give you the means to do it and then expect you to NOT do it."
10057030-123 = "If Rana hadn't been sent to 183, then she would've succeeded me as the#nAcademy's hope!"
10057030-124 = "No matter how you look at it, the problem was with the bubble sheet, not Rana!"
10057030-126 = "As a result of that, I ended up here... #nAs for what I do, I mostly work in IT for Red Winter."
10057030-127 = "Oh, right. I also bought what you asked for."
10057030-128 = "Oooh! Thankies!"
10057030-133 = "Hm...? You got six cartons of milk? Huh?"
10057030-134 = "You said to \"buy one carton of milk and, if they have avocados, get six.\""
10057030-135 = "They had avocados, so I bought six cartons of milk."
10057030-136 = "You executed my sentence as a conditional statement...?"
10057030-137 = "Was I wrong?"
10057030-138 = "...Nope, not at all! That's Rana for you!"
10057030-139 = "...And that's all three of us. Together, we make up Special Class 183."
10057030-140 = "[s] \"All three...? Why are you only raising two fingers then?\""
10057030-141 = "Because there's three of us."
10057030-142 = "[s] \"???\""
10057030-143 = "They said they'll let us out of here if we manage to conduct enough research, #nwhich is why we just spend our days deep in these mountains, doing nothing but#nresearch. Aha... Ahaha..."
10057030-144 = "We've been thinking looong and hard about how we could get a pardon."
10057030-145 = "We've been researching like we should and all, but it really just doesn't feel like it's#ngonna be enough, y'know?"
10057030-146 = "But then, the other day, President Cherino said something on the radio!"
10057030-147 = "\"Red Winter will definitely be winning the next Gehenna Cup!\""
10057030-148 = "When I heard that the winner would recieve HUUUGE prizes, I was like, this is it!"
10057030-149 = "[s] \"Gehenna Cup?\""
10057030-150 = "Ah. The Gehenna cup is a free-for-all tank tournament where powerhouses from#nall around Kivotos gather to compete."
10057030-151 = "The only event in it is the tank race. Unlike the Halo Games, which changes hosts every time,#nthe Gehenna Cup is always hosted by Gehenna. Because there are substantial prizes to be earned,#nschools from all over Kivotos participate in it."
10057030-152 = "Competition is tough even at the qualifier level, so making it into the actual#ntournament itself is big challenge. However... If you do manage to win it all..."
10057030-153 = "Your tank would be acknowledged as Kivotos' greatest!"
10057030-154 = "As a chemist, how could I ever let this opportunity slip!?"
10057030-155 = "AND, it's the perfect chance to get out of this place!"
10057030-159 = "The only problem is... Red Winter's qualifiers are only four days away!"
10057030-160 = "We don't have the turret or the equipment done. Plus, even if we did manage#nto get those parts together..."
10057030-161 = "The important design decisions haven't even been made."
10057030-162 = "That's why we should just do as I say!"
10057030-163 = "If we do that, we're gonna end up with nothin' but failures!"
10057030-164 = "Are you looking to become the chairwoman of the \"Wacky Designs Association\"#ntoo!?"
10057030-165 = "You SERIOUSLY should have a medal for the sheer amount of venom you spit#nevery time you speak!"
10057030-169 = "As you can see, since they always start fighting at the drop a hat, I figured I should try asking for your help, Sensei."
10057030-170 = "After all, I've heard that you can create miracles, on top of helping out any student#nin Kivotos."
10057030-172 = "Sensei! I'm in the right this time, aren't I?"
10057030-173 = "Nuh-uh! It's me, riiight!?"
10057030-178 = "[ns] \"I can't take sides.\""
10057030-180 = "[ns] \"I can, however, offer you a scientific and fair method instead...\""
10057030-184 = "That exists!?"
10057030-185 = "I dunno what kinda method it is, but it sounds real promising!"
10057030-189 = "[ns] Present to them the \"adult solution.\""
10057030-193 = "Huh?"