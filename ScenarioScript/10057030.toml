[translation]
10057030-1 = "Chapter 3;What did you come here for?"
10057030-2 = "Don't you think Erina is a really strange girl?"
10057030-3 = "She's always like that. Every time she opens her mouth, it's nothing but sarcasm!"
10057030-4 = "What she says makes no sense! It's like that cheap pudding Erina developed!"
10057030-5 = "Um, I can hear everything, you know?#nVoices carry really well through curtains, don't they?"
10057030-6 = "And if we're talking about things that don't make sense, Anna, yours are even worse."
10057030-7 = "Besides...#nMy 'H2O Excess-Additive Pudding' is way better than Anna's cheap machinery, isn't it?"
10057030-8 = "It's not 'cheap,' it's 'optimized.' Don't you know the term 'cost-effectiveness'?"
10057030-9 = "Anyway... cold air is coming in, so turn up the heater!"
10057030-10 = "In the first place, it's because Erina forgot to close the gas valve that the kitchen wall blew off and we ended up in this mess!"
10057030-14 = "Sh-shut up! *Slurp!!*"
10057030-18 = "...First 'exchange of opinions'."
10057030-20 = "[ns] \"Both of you, calm down!\""
10057030-22 = "[ns1] \"Could you tell me a bit more about everyone?\"\n[ns2] \"What do you all usually do?\""
10057030-26 = "As expected, I'll tell you the truth, Sensei."
10057030-27 = "I mean, I wasn't really lying, though~"
10057030-28 = "Editing is a form of processing, so it can't be called the complete truth. I think we should tell you everything."
10057030-29 = "I read in a book that 'scientists compete with facts'."
10057030-30 = "Hmm..."
10057030-31 = "Ngh..."
10057030-35 = "...Actually, Special Class 183 is where students who have been disciplined are sent."
10057030-36 = "For various reasons, instead of being suspended, we are doing research requested by the administration office."
10057030-37 = "While I manage the class's research projects...#nAs a personal project, I design inexpensive items with minimal equipment—"
10057030-38 = "In our spare time,#nwe take on outside requests to earn pocket money and funds for tank production."
10057030-39 = "[s] \"Suspended?\""
10057030-40 = "Ugh, it's embarrassing to even talk about it, but..."
10057030-41 = "I was the lead engineer who designed the tank exclusively for President Cherino."
10057030-42 = "Despite the low budget, I made it according to her unreasonable demands, but...#nit broke during the parade of all things—"
10057030-43 = "President Cherino fell into the mud and ordered my demotion to the special class."
10057030-44 = "To be demoted after one failure despite doing it right 100 times..."
10057030-45 = "You should have just said you couldn't do it, you know~"
10057030-46 = "Well, I guess I just tried to challenge myself a bit too much..."
10057030-47 = "When I tried to solve public health issues with chemistry,#nthat fake-mustached woman just tossed me aside without a word~ Ahaha!"
10057030-48 = "[s] \"What happened?\""
10057030-49 = "I was at the administration office... uh, what was it called...?"
10057030-50 = "You know, right? The thing that comes out when you turn the faucet...!"
10057030-51 = "[s] \"Tap water?\""
10057030-52 = "That's it! Ugh, I keep forgetting words so easily..."
10057030-53 = "A-anyway! They told me to do research on purifying tap water through chemical treatment."
10057030-54 = "It's true that if the tap water is clean, we wouldn't catch colds anymore... so I decided to give it a try, but..."
10057030-55 = "The problem is... the equipment to treat it with ozone or chlorine costs over 100 times the budget!"
10057030-56 = "So instead, I disinfected it with ethanol!#nThe disinfection effect was great, but—"
10057030-57 = "After disinfecting, I accidentally forgot to remove the ethanol and ran the water supply system as is—"
10057030-58 = "[s] \"Ethanol... oh...\""
10057030-59 = "It was a massive incident that shook the entire academy.#nI wish you could have seen the face of the secretary general at that time, Sensei."
10057030-60 = "Ugh...! Just thinking about it gives me a headache..."
10057030-61 = "That time was really tough, you know...!?"
10057030-62 = "The one at fault isn't me, it's the administration office for being stingy with the budget!"
10057030-63 = "Isn't it because Erina didn't study properly?"
10057030-64 = "I did study properly, okay?#nDon't talk about things you don't know when you're not even a chemist!"
10057030-65 = "The chemist who heats a volumetric flask, huh..."
10057030-66 = "Isn't it common knowledge, even written in textbooks, that volumetric flasks are only used for mixing and titration?"
10057030-67 = "Wow, I didn't know that~#nTo think you'd even lecture someone majoring in chemistry~#nClass President Anna, you're just wonderful~"
10057030-68 = "Hmph, if you understand now, I'll let it slide."
10057030-69 = "Erina is such an idiot~#nShe even forgot that she put ammonia in the cup Anna is drinking from right now~"
10057030-74 = "Pfft!!!"
10057030-78 = "How dare you do that!? Prepare yourself!!!"
10057030-79 = "Bleh! You're the one who should prepare yourself~"
10057030-84 = "...Since we have a guest today, both of you are quite energetic."
10057030-88 = "Haa... haa..."
10057030-89 = "Whew... haa..."
10057030-94 = "Since it was not intended for persuasion, it was an unofficial match with no winner."
10057030-101 = "...Right now, we are researching 'pudding that's been bulked up with water and only looks decent'."
10057030-102 = "There's so much water that it turns to mush with just a light breath..."
10057030-103 = "Ugh! I hate being in these empty mountains!"
10057030-104 = "Rana is cute so it's fine, but having this noisy, messy person as class president is the worst!"
10057030-105 = "Same here! Erina being the vice class president is truly the worst!"
10057030-106 = "Hmph!!"
10057030-107 = "[s] \"Then, what about Rana?\""
10057030-108 = "I did not make any mistakes."
10057030-110 = "That's true, Rana is like that..."
10057030-111 = "Out of everyone here, Rana might be the most pitiful..."
10057030-112 = "She was brought here right after enrolling."
10057030-114 = "That is correct. I have not caused any problems since enrolling."
10057030-115 = "I simply—took the entrance exam."
10057030-116 = "[s] \"You were sent here just for taking the exam?\""
10057030-117 = "Actually, there was a defect in the exam's mark sheet."
10057030-118 = "Specifically, it allowed for arbitrary score input.#nSo, I marked my own score."
10057030-119 = "The result—was 4,294,967,295 points, so I was brought here."
10057030-120 = "It is a pity the system was 32-bit.#nIf it were 64-bit, it would have been 18,446,744,073,709,551,615 points."
10057030-122 = "Don't you think it's terrible?#nIf the soil is there to be worked, one would want to try, wouldn't they?"
10057030-123 = "If Rana hadn't come to 183, she would have been the academy's hope, following in my footsteps!"
10057030-124 = "No matter how you look at it, the one at fault is the mark sheet, not Rana!"
10057030-126 = "As a result, I came here...#nand all I do is manage the computer systems within Red Winter."
10057030-127 = "That's right. I bought what you asked for."
10057030-128 = "Oh~! Rana, thanks~!"
10057030-133 = "...Huh? Milk... 6 cartons? What?"
10057030-134 = "You said, 'Buy some milk. If there are avocados, buy 6'."
10057030-135 = "So, since there were avocados, I bought 6 cartons of milk."
10057030-136 = "You executed it according to the conditional statement...?"
10057030-137 = "Did I do something wrong?"
10057030-138 = "...No, not at all! As expected of Rana~!"
10057030-139 = "...So, Special Class 183 consists of the three of us here."
10057030-140 = "[s] \"Three...? Why are you holding up two fingers?\""
10057030-141 = "Because there are three of us."
10057030-142 = "[s] \"???????\""
10057030-143 = "They said they would release us if the three of us produced sufficient research results,#nso we do research every day in these deep mountains. Haha, ahaha..."
10057030-144 = "We've... been thinking about how to get a pardon for a long time~"
10057030-145 = "We're doing the research properly, but it seems that's not enough~?"
10057030-146 = "Then, President Cherino said this on the radio the other day!"
10057030-147 = "'In the next Gehenna Cup, Red Winter will definitely win!'"
10057030-148 = "I heard the winning student gets the best reward, so I thought this was our chance!"
10057030-149 = "[s] \"Gehenna Cup?\""
10057030-150 = "Ah, the Gehenna Cup is a tank league where powerhouses from all over Kivotos gather."
10057030-151 = "The event is only tank racing. Unlike the Halo Festival where the host changes every time, Gehenna Academy hosts it.#nSince there's a significant prize, academies from all over Kivotos participate."
10057030-152 = "The level is high from the qualifiers, and just participating is quite difficult, but...#nif we were to win—"
10057030-153 = "—we would be recognized as the best tank in Kivotos!"
10057030-154 = "As a chemist, it's impossible to miss out on such an honor!"
10057030-155 = "Besides, it's the perfect chance to get out of here!"
10057030-159 = "But the problem is... there are only 4 days left until the Red Winter qualifiers!"
10057030-160 = "We have no turret, no equipment. And even if we made the parts—"
10057030-161 = "The crucial design hasn't been decided."
10057030-162 = "That's why you should just do as I say!"
10057030-163 = "If we did that, we'd only end up with a failed product!"
10057030-164 = "Do you want to become the president of the 'Strange Design Association' too!?"
10057030-165 = "Honestly, your snarky remarks are worthy of a medal!"
10057030-169 = "Since they start fighting like this immediately, I thought I would ask for your help, Sensei."
10057030-170 = "I heard that you can perform miracles and help students all over Kivotos."
10057030-172 = "This time, we should do as I say, right, Sensei?"
10057030-173 = "No way! It should be me~!?"
10057030-178 = "[ns] \"I can't take sides.\""
10057030-180 = "[ns] \"Instead, I have a scientific and fair method...\""
10057030-184 = "There's such a method!?"
10057030-185 = "I don't know what it is, but it sounds amazing!"
10057030-189 = "[ns] Propose an 'adult solution'."
10057030-193 = "Huh?"