[translation]
10016030-1 = "Эпизод 3;Одолженное и голубое"
10016030-2 = "Здравствуйте и добро пожаловать на канал «Кронос»!"
10016030-3 = "Фестиваль уже идёт полным ходом, и повсюду бурлят толпы! Все отлично проводят время и едят много вкусного?"
10016030-4 = "А если вы смотрите из дома — не волнуйтесь!"
10016030-5 = "Просто подпишитесь на канал «Кронос», чтобы смотреть соревнования! Весь фестивальный азарт прямо с вашего дивана."
10016030-6 = "Кстати о соревнованиях: утренние матчи только что завершились. Уже поступают места каждой академии!"
10016030-7 = "Кто сейчас лидирует? Посмотрим..."
10016030-8 = "О, неужели? Это «Геенна»!"
10016030-9 = "Академия «Геенна» опережает и принимающий «Миллениум», и даже объединённую школу «Тринити»? Я потрясена! Что же произошло?"
10016030-10 = "Похоже, «Геенна» была на несколько голов выше всех в соревновании по еде и благодаря этому вырвалась вперёд!"
10016030-11 = "Судя по протоколам, Ванибучи Акари и Шишидо Изуми из Общества исследования гурманов «Геенны» были вне конкуренции!"
10016030-12 = "Ух ты! Акари ела собу с такой астрономической скоростью, что полностью перегрузила новую машину ванко-собы во время соревнования!"
10016030-13 = "О, но говорят, машина не успевала за Акари и сломалась, поэтому официальный результат установить не удалось..."
10016030-14 = "А соревнование по питью газировки с морским огурцом пришлось остановить посреди состязания, потому что студентов рвало и они падали в обморок. Всех, кроме одной-единственной Шишидо Изуми."
10016030-15 = ""
10016030-17 = ""
10016030-19 = "А? Кадры слишком мерзкие для зрителей? Особенно прямо перед обедом?"
10016030-20 = "Но шокирующее видео, где студентов разных академий одновременно рвёт, стало вирусным! Теперь это самый залайканный пост канала «Кронос»!"
10016030-21 = ""
10016030-23 = ""
10016030-24 = ""
10016030-25 = "Хмф... Ладно, ладно."
10016030-26 = "А теперь сообщение от нашего спонсора."
10016030-27 = "Впереди ещё много захватывающих соревнований! Продолжайте болеть за любимых спортсменок!"
10016030-28 = ""
10016030-29 = "*вздыхает* Не думала, что мы так быстро окажемся настолько позади..."
10016030-30 = "Я хотела исполнить свой долг и сосредоточиться на организации... Но так дело не пойдёт."
10016030-31 = "Если хочешь, чтобы что-то было сделано хорошо..."
10016030-32 = "Сделай это сам!"
