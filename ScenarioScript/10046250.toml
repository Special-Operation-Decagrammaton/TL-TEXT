[translation]
10046250-2 = ""
10046250-3 = "Кхм. Простите!"
10046250-4 = "Вы управляющая этого пляжа?"
10046250-5 = "«Управляющая»? ...Пожалуй."
10046250-6 = "Есть проблема?"
10046250-7 = "Очень приятно познакомиться! Я Кавава Шизуко, талисман и владелица Момоёдо."
10046250-8 = "О, Момоёдо из Хяккияко... Вы держите временную пляжную лавку, верно?"
10046250-9 = "Да, а что ещё интереснее... мы устраиваем фестиваль прямо здесь!"
10046250-10 = "...А?"
10046250-11 = "Простите, но я слышала, что единственный одобренный здесь фестиваль организует Отдел проведения фестивалей."
10046250-12 = "Кхм... Кхм! Я ещё и глава Отдела проведения фестивалей."
10046250-13 = "А, вот как?! Прошу прощения."
10046250-14 = "Это потрясающе! Вы и успешным магазином управляете, И фестивалями Хяккияко заведуете..."
10046250-15 = "Хех..."
10046250-16 = "Я-я имею в виду, нельзя приписывать всю заслугу мне. У меня потрясающая команда, которая делает всю тяжёлую работу, правда!"
10046250-17 = "Так вот, о фестивале!"
10046250-18 = ""
10046250-19 = ""
10046250-20 = ""
10046250-21 = ""
10046250-22 = ""
10046250-24 = ""
10046250-25 = "...Я ожидала совсем не этого."
10046250-26 = "Я думала, это торжественное открытие пляжа Чаепития!"
10046250-27 = "Я представляла элегантность, класс... и людей с деньгами!"
10046250-28 = ""
10046250-30 = ""
10046250-31 = "Но важнее денег безопасность... моей богатой клиентуры."
10046250-32 = "Если этот бедлам продолжится, я вообще не смогу продать ничего из того, что привезла."
10046250-33 = "Ага... Хахаха. Ну..."
10046250-34 = "Простите. Я управляла этим пляжем совершенно одна. Некоторые вещи пришлось оставить без внимания."
10046250-35 = "Хм... Как я и подозревала. Вам нужна дополнительная поддержка?"
10046250-36 = "А? Да, пожалуй."
10046250-37 = "...Хорошо."
10046250-38 = "Тогда как насчёт этого? Я помогу вам управлять пляжем."
10046250-39 = "А? Нет, в этом нет необходимости..."
10046250-40 = "Есть! Ещё как есть!"
10046250-41 = "Если учесть стоимость ингредиентов, развёртывание торговой точки и доставку сюда..."
10046250-42 = "...я рискую понести огромные убытки! КАТАСТРОФИЧЕСКИЕ!"
10046250-43 = "..."
10046250-44 = "...И, конечно же, я ещё хочу, чтобы все хорошо провели отпуск!"
10046250-45 = ""
10046250-47 = ""
10046250-48 = ""
10046250-49 = ""
10046250-50 = "..."
10046250-51 = "..."
10046250-52 = "Ну так что, мы вместе или нет?"
10046250-53 = "Рада видеть вас в команде."
