1008403-121 = "Дома развести огонь так просто, а в дикой природе это настоящий кошмар. Кто бы мог подумать..."
1008403-122 = "Похоже, люди правы. Природа беспощадна..."
1008403-124 = "Мы с Котамой грелись у огня и размышляли о суровости мира природы."
