1008403-54 = ""
1008403-56 = ""
1008403-57 = "Что такое, Сенсей?"
1008403-58 = "Когда начну запись, мы уже не сможем разговаривать, так что если есть проблема, нужно решить её сейчас."
1008403-59 = "[s3] «Это займёт вечность. У тебя спички есть?»\n[s4] «Могу одолжить зажигалку, если хочешь.»"
1008403-62 = "Так действительно было бы эффективнее всего разжечь огонь..."
1008403-63 = "Но добывание огня трением приятнее на слух: мы услышим, как из крошечного уголька рождается бушующее пламя."
1008403-64 = "Многим любителям ASMR ещё нравится звук шершавых материалов. Мои люди будут разочарованы, если я пропущу эту часть процесса."
1008403-65 = "[s] «Ну, если ты так говоришь...»"
1008403-66 = ""
1008403-68 = ""
1008403-69 = "Итак, попробуем высечь искру."
1008403-71 = "Примерно через тридцать минут..."
