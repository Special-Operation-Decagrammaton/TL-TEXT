[translation]
1008403-1 = "Звуки природы 1"
1008403-4 = "На следующих выходных я вернулся к горе для ещё одного лёгкого похода."
1008403-5 = ""
1008403-7 = "Котама тоже была там."
1008403-8 = "[s] «Котама...»"
1008403-9 = ""
1008403-11 = ""
1008403-12 = "Ах."
1008403-13 = "Эм, всё не так, как выглядит."
1008403-14 = "[s] «Выглядит так, будто ты снова записываешь чужие голоса.»"
1008403-15 = "Ни в коем случае! Я бы никогда не вернулась в горы ради такого!"
1008403-16 = "[s] «То есть этим диктофоном ты записываешь пение птиц?»"
1008403-17 = "Да. Понимаете..."
1008403-18 = "...Сегодня я пришла записывать звуки природы! Птиц, белок, всё подряд!"
1008403-19 = "[s] «Звуки природы, значит?»"
1008403-20 = "Да. Люди издревле успокаивались под пение птиц, журчание воды и шум ветра."
1008403-21 = "Даже в моих любимых ASMR-треках часто примешана природная атмосфера."
1008403-22 = "Но такие фоновые звуки трудно найти. Обычно я беру их из звуковых библиотек в интернете, но они порой звучат слишком искусственно..."
1008403-23 = "Поэтому я и пришла на эту гору. Записать настоящие звуки природы, которые меня вдохновляют!"
1008403-24 = "[s1] «Природные звуки своими руками, значит? Логично.»\n[s2] «Как-то неожиданно невинно для тебя.»"
1008403-26 = "Вы говорите так, будто не верите."
1008403-27 = "[s] «И какие звуки ты собираешься записывать сегодня?»"
1008403-28 = "Я собираю зимний горный трек, так что пение горных птиц или шаги по снегу подошли бы идеально."
1008403-29 = "О-о-о, а ещё можно добавить треск костра для контраста с зимним холодом."
1008403-30 = "Когда лежишь под тёплым одеялом и слушаешь ревущий огонь, кажется, будто ты в настоящем лагере и готов задремать."
1008403-31 = "Поэтому я собираюсь развести костёр и записать его звуки."
1008403-32 = "[s] «Ты уверена, что здесь вообще можно разводить огонь?»"
1008403-33 = "Да, я заранее получила разрешение властей. Сказали, что на территории лагеря можно."
1008403-34 = "Я даже принесла огнетушитель на случай, если что-то выйдет из-под контроля."
1008403-35 = "[s] «Безопасность прежде всего?»"
1008403-36 = "Скорее... я не хочу, чтобы звук паники испортил запись."
1008403-37 = ""
1008403-39 = ""
1008403-40 = "Ну что, соберём веток и разожжём костёр?"
1008403-43 = "Сначала сложим сухие листья и веточки конусом."
1008403-44 = ""
1008403-46 = ""
1008403-47 = "Поставим одну палочку перпендикулярно закреплённой деревянной доске."
1008403-48 = "Потом я зажму палочку между ладонями и начну их тереть."
1008403-49 = ""
1008403-51 = ""
1008403-52 = ""
