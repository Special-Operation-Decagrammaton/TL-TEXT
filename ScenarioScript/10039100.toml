[translation]
10039100-1 = "Послесловие;Утаха и дети"
10039100-2 = "Конкурс поп-идолов — предварительный этап"
10039100-4 = "Каких идолов мы увидим на этот раз?"
10039100-5 = "Все костюмы просто потрясающие. Не терпится увидеть следующих."
10039100-6 = "Говорят, следующая группа действительно умеет петь."
10039100-7 = ""
10039100-9 = ""
10039100-11 = "Фух... Почему я так нервничаю?"
10039100-12 = ""
10039100-14 = ""
10039100-15 = "Мы все нервничаем. Конечно. На сцене не мы, но на кону гордость нашего отдела."
10039100-16 = "Да... Интересно, как себя чувствует президент. Надеюсь, она держится."
10039100-17 = ""
10039100-19 = ""
10039100-20 = ""
10039100-21 = "О, здравствуйте, Сенсей. Вы пришли посмотреть выступления?"
10039100-22 = "Привет, Сенсей!"
10039100-23 = "[s1] «Привет!»\n[s2] «Вижу, инженерный отдел тоже здесь.»"
10039100-26 = "Да. Мы пришли поддержать президента."
10039100-27 = ""
10039100-29 = ""
10039100-30 = "[ns] «О, Утаха участвует в шоу?»"
10039100-31 = "Хи-хи! Скажем так: шоу дало нам новую возможность."
10039100-32 = "Надеюсь, вы тоже поддержите её вместе с нами, Сенсей!"
10039100-33 = ""
10039100-37 = ""
10039100-38 = "А, следующая группа уже начинает..."
10039100-39 = "Тогда времени на объяснения нет. Смотрим!"
10039100-43 = "Ещё несколько студенческих групп показали страстные номера, один завораживающее другого."
10039100-47 = ""
10039100-48 = "А теперь наш следующий участник..."
10039100-49 = ""
10039100-51 = ""
10039100-52 = "...из Научной школы Миллениум!"
10039100-53 = ""
10039100-56 = ""
10039100-58 = "Это Шираиши Утаха из инженерного отдела. Они известны своими гениальными изобретениями!"
10039100-59 = ""
10039100-66 = ""
10039100-68 = ""
10039100-69 = "О, посмотрите на этот костюм."
10039100-70 = "Не совсем «поп.» Выглядит скорее традиционно."
10039100-71 = "Что это за устройство рядом с ней? Она сказала, что инженер. Может, автотюн или что-то такое?"
10039100-72 = "Да, возможно. Посмотрим, что она будет делать..."
10039100-73 = ""
10039100-77 = "И-и-и... начинаем!"
10039100-78 = ""
10039100-80 = ""
10039100-82 = "Наконец-то...!"
10039100-83 = "Президент... Вы сможете..."
10039100-84 = ""
10039100-86 = ""
10039100-88 = ""
10039100-90 = ""
10039100-92 = ""
10039100-93 = ""
10039100-94 = ""
10039100-95 = ""
10039100-97 = ""
10039100-98 = "А...?"
10039100-99 = "Насчёт костюма я была права..."
10039100-100 = "Э-Энка?"
10039100-101 = "Она что, не на тот конкурс записалась?"
10039100-102 = "Да, эээ..."
10039100-103 = ""
10039100-106 = ""
10039100-107 = ""
10039100-108 = "[ns] «Эм, ну...»"
10039100-113 = ""
10039100-114 = "Она попадает в каждую ноту и точно в ритм!"
10039100-115 = "Это её любимая песня. В караоке она всегда исполняет её идеально, даже с закрытыми глазами!"
10039100-116 = "Так, Хибики, наш выход! Пора немного поддержать огнём!"
10039100-117 = "Выложимся на полную ради нашего президента!"
10039100-118 = ""
10039100-120 = ""
10039100-121 = "[ns] «Погоди, ты сказала „поддержать огнём“?»"
10039100-122 = "Сейчас объясню. У нас есть особый способ её поддержать."
10039100-123 = "А пока, Сенсей, просто смотрите. Надеюсь, вам понравится!"
10039100-124 = "[s] «Это ведь не будет опасно?»"
10039100-125 = "Ну началось..."
10039100-126 = ""
10039100-130 = "Ша-шинг!"
10039100-133 = ""
10039100-134 = "Зеркальный шар? Вращающийся зеркальный шар..."
10039100-135 = "Как в караоке-баре?"
10039100-136 = "Ага, только раз в сто ярче!"
10039100-138 = "Ну, внимание мы точно привлекли!"
10039100-140 = "Это СОВСЕМ не то, что я ожидала здесь увидеть."
10039100-141 = "Ещё бы. Энка и караоке..."
10039100-142 = "[s] «Не уверен, как на это реагируют студенты...»"
10039100-144 = "Всё в порядке, Сенсей. Посмотрите внимательнее."
10039100-145 = ""
10039100-147 = ""
10039100-149 = "...А?"
10039100-150 = "Ч-Что это? Моё тело..."
10039100-151 = "Я даже не заметила, как начала отбивать ритм ногой..."
10039100-152 = "Почему-то я киваю головой в такт..."
10039100-153 = "Знаете, у этих слов совсем другая атмосфера, не такая, как у современных песен."
10039100-154 = "Да, эта грусть почему-то прямо в сердце бьёт..."
10039100-155 = "[s3] «Эм...»\n[s4] «Сработало?!»"
10039100-159 = "Ха, я сразу поняла, что происходит, как только услышала жанр! Для утончённых студентов Тринити это, должно быть, настоящий шок!"
10039100-160 = "И дело не только в этом: президент определённо умеет петь. Она так хорошо передаёт эмоции голосом!"
10039100-161 = "Так, приближается кульминация... Второй удар, активировать!"
10039100-162 = ""
10039100-164 = ""
10039100-171 = ""
10039100-172 = "Ахх!! Это..."
10039100-173 = "Пиротехника?!"
10039100-174 = "Красиво, спору нет, но я чувствую жар..."
10039100-176 = "Тогда объясню. Сцена тёмная, поэтому нам нужны вспышки оптимальной яркости — для максимальной светимости и чёткости! Секрет в том, чтобы подмешать ровно нужное количество напалма."
10039100-177 = "[s] «Разве это не опасно?!»"
10039100-178 = "Не волнуйтесь, Сенсей. Я сильно сократила время горения, поэтому пламя погаснет задолго до того, как кого-то коснётся."
10039100-179 = "[s] «Я-Я рад это слышать, но...»"
10039100-180 = "К тому же следующий эффект работает как дополнительная страховка."
10039100-181 = "И раз уж речь зашла, скоро припев, так что..."
10039100-182 = ""
10039100-184 = ""
10039100-185 = "Сейчас!"
10039100-186 = ""
10039100-195 = ""
10039100-196 = "А? Это... дождь...?"
10039100-197 = "В помещении?!"
10039100-199 = "Видите, тепло от напалма поднимается вверх и запускает тепловые датчики на дронах-разбрызгивателях."
10039100-200 = "К тому же текст песни как раз про льющийся дождь!"
10039100-202 = "Ещё спецэффекты...?"
10039100-203 = "Капли дождя текут вместе с мимолётной любовью... Горько-сладкие воспоминания о прошлом..."
10039100-204 = ""
10039100-206 = ""
10039100-207 = "Погодите, это дождь или уже слёзы?"
10039100-209 = "Сначала я была ошеломлена, потом начала получать удовольствие... а теперь у меня слёзы на глазах..."
10039100-210 = "Я... не могу поверить в это невероятное выступление..."
10039100-213 = ""
10039100-214 = ""
10039100-215 = "Спасибо."
10039100-218 = ""
10039100-219 = ""
10039100-220 = "Шираиши Утаха, дамы и господа! Поприветствуем её громкими аплодисментами!!"
10039100-221 = ""
10039100-223 = ""
10039100-225 = ""
10039100-226 = ""
10039100-229 = "[ns5] «Вот это реакция.»\n[ns6] «Лучше, чем я ожидал!»"
10039100-233 = "По крайней мере у половины зала."
10039100-234 = "Видимо, всем не угодишь."
10039100-235 = ""
10039100-239 = "[ns7] «Я слышу, как в зале кто-то перешёптывается.»\n[ns8] «Наверное, часть зрителей ожидала чего-то другого...»"
10039100-242 = "Ну, как бы то ни было, мы сделали всё возможное. А президент спела даже лучше, чем на репетициях."
10039100-243 = "Верно. Мы сделали всё, что могли. Ни о чём не жалею."
10039100-245 = "Прошло время, и объявили результаты предварительного этапа."
10039100-248 = "Инженерный отдел получил высокий балл за реакцию публики, но, к сожалению, не прошёл в финал."
10039100-249 = ""
10039100-251 = ""
10039100-252 = "[ns] «...»"
10039100-253 = "Хм..."
10039100-254 = "Ну, какое облегчение."
10039100-255 = "Из-за нас, правда?"
10039100-256 = "[s] «Хм?»"
10039100-257 = "Мы подготовили только одну песню."
10039100-258 = "Если бы прошли в финал, пришлось бы просто повторить почти то же самое, а такого эффекта уже не было бы."
10039100-259 = "К тому же главная сцена больше, значит, понадобились бы более масштабные эффекты, а материалов у нас нет."
10039100-260 = "Знаете, неважно, какой балл мы получили."
10039100-261 = "Сегодня мы показали всем в Тринити, насколько крута энка."
10039100-262 = "И отлично прорекламировали инженерный отдел Миллениума."
10039100-263 = ""
10039100-265 = ""
10039100-266 = "[ns] «Если вы не против, я всё-таки спрошу...»"
10039100-267 = ""
10039100-268 = "[ns] «...вы все довольны тем, как всё вышло?»"
10039100-269 = ""
10039100-271 = ""
10039100-272 = "Соврала бы, если бы сказала, что ВООБЩЕ не разочарована."
10039100-274 = "Но всё равно это был очень приятный опыт. Разве нет?"
10039100-276 = "Конечно! Не просто приятный — уникальный. Я могу объяснять словами, но передавать смысл песней — совсем другой уровень. И со всем, что я делала, чтобы помочь, было чувство, будто я выступала там вместе с вами!"
10039100-277 = "Мне тоже было весело. Я чувствовала реакцию публики."
10039100-278 = "[s9] «Это хорошо.»\n[s10] «Все очень старались. Я вами горжусь.»"
10039100-281 = "Ну, теперь можно пойти и насладиться остатком Карнавала."
10039100-282 = ""
10039100-284 = ""
10039100-286 = ""
10039100-287 = "Хотите присоединиться к нам, Сенсей?"
10039100-289 = "Позже я узнал, что после Карнавала некоторые студенты Тринити основали клуб энки."
