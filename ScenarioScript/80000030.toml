[translation]
80000030-1 = "Фальшивые наручники"
80000030-2 = "Офис Бюро общественной безопасности Валькирия"
80000030-3 = "Сенсей, Сенсей! Посмотрите на это."
80000030-4 = "Угадаете, что это?"
80000030-5 = ""
80000030-7 = ""
80000030-9 = "[ns] «Наручники?»"
80000030-10 = "Наполовину верно!"
80000030-11 = "Они выглядят как обычные наручники, но на самом деле сделаны из шоколада!"
80000030-12 = "Я нашла их сегодня утром во время патруля. Забавная вариация валентиновского шоколада."
80000030-13 = "Как только увидела их, мне пришла гениальная идея, поэтому пришлось купить!"
80000030-14 = "[s] «Гениальная идея?»"
80000030-15 = "Наручники — инструмент для задержания преступников, да?"
80000030-16 = "По протоколу один браслет надевают на своё запястье, второй — на подозреваемого, чтобы тот не сбежал."
80000030-17 = "Но я неуклюжая, поэтому иногда надеваю оба на себя!#nИ тогда подозреваемый убегает..."
80000030-18 = "Я всегда думала, как было бы здорово быть достаточно сильной, чтобы просто разломать их в такой ситуации."
80000030-19 = ""
80000030-21 = ""
80000030-23 = "А теперь с этими шоколадными наручниками все проблемы решены!"
80000030-24 = "Даже если надену оба на себя, они сломаются от небольшого усилия."
80000030-25 = "И я смогу их съесть, если проголодаюсь во время засады!"
80000030-26 = "Разве это не идеальный план борьбы с преступностью, Сенсей?"
80000030-27 = "[s] «Но разве подозреваемый тоже не сможет их сломать?»"
80000030-28 = ""
80000030-30 = ""
80000030-31 = "*вздох*! В-Вы правы. Если я могу сломать наручники, то и подозреваемый сможет."
80000030-32 = "Значит, использовать их вообще бессмысленно..."
80000030-33 = "Что же я наделала, Сенсей? Я уже внесла их в рабочие расходы за этот месяц..."
80000030-34 = "Мне ужасно влетит."
80000030-36 = "Кирино пришлось написать объяснительную за растрату средств отдела на бесполезные покупки."
80000030-37 = "А шоколадные наручники она подарила мне."
