[translation]
901010400310-7 = "О, смотрите! На табличке написано, что этих крабов поймали сегодня утром!"
901010400310-8 = "Я ужасно проголодалась. Не хотите краба на обед?"
901010400310-9 = "Эм... Я откажусь."
901010400310-10 = "Почему?"
901010400310-11 = "Слишком уж муторно выковыривать мясо, раскалывать этот твёрдый, практически неприступный панцирь..."
901010400310-12 = "Однажды я порезала руку о клешню краба. Чуть ужин не испортила!"
901010400310-13 = "Это правда. Краб очень вкусный, но возни с ним много."
901010400310-14 = "Пойдём в другое место."
901010400310-15 = ""
901010400310-17 = ""
901010400310-19 = ""
901010400310-20 = "(Здесь могут быть зацепки...)"
901010400310-21 = "(Посмотрим, что скажет владелец магазина.)"
