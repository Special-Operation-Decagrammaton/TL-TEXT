[translation]
901010400310-7 = "Olha só, dá uma olhada! Disseram que esse caranguejo acabou de ser descarregado do barco hoje cedo."
901010400310-8 = "A fome já tá batendo... Que tal comer caranguejo no almoço?"
901010400310-9 = "Hummm... Prato de caranguejo é meio complicado..."
901010400310-10 = "Ué, por quê?"
901010400310-11 = "Sabe como é, né? Tem que ficar quebrando aquela carapaça dura toda."
901010400310-12 = "Já cortei meu dedo uma vez fazendo isso..."
901010400310-13 = "É verdade... Ficar catando carne com garfinho dá uma preguiça danada."
901010400310-14 = "Então vamos escolher outra coisa pra almoçar."
901010400310-15 = ""
901010400310-17 = ""
901010400310-19 = ""
901010400310-20 = "(Quem sabe eu não encontre uma pista sobre o caso por aqui...?)"
901010400310-21 = "(Vou tentar sondar um pouco mais de informação.)"
