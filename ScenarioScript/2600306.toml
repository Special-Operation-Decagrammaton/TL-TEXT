[translation]
2600306-1 = "Попались!"
2600306-2 = "Я пришёл в парк со всем необходимым для пикника."
2600306-3 = "Затем нашёл укромный уголок подальше от толпы и разложил всё принесённое."
2600306-4 = "Оставалось только одно..."
2600306-5 = ""
2600306-8 = "[ns1] «А-а-ах, спина! Как же больно!»\n[ns2] «Аргх! М-мой живот! Больно!»"
2600306-11 = ""
2600306-12 = ""
2600306-13 = "*шорох*"
2600306-14 = ""
2600306-15 = "*шуршание* *шуршание*"
2600306-16 = ""
2600306-20 = ""
2600306-21 = "Что случилось, Сенсей?!"
2600306-22 = "Тебе опять плохо?!"
2600306-23 = "Но не бойся, Серина здесь!"
2600306-24 = "Так, приступим..."
2600306-25 = ""
2600306-27 = ""
2600306-28 = "...?"
2600306-29 = "Сенсей?"
2600306-30 = "[s3] «Хе-хе. Попалась!»\n[s4] «Прости. Надеюсь, я тебя не напугал.»"
2600306-31 = "А? Что вообще здесь происходит?"
2600306-32 = "А? Что вообще здесь происходит?"
2600306-33 = "Плед, сэндвичи и сок...?"
2600306-34 = "Что всё это значит, Сенсей? Я думала, тебе больно."
2600306-35 = "А?"
2600306-36 = "Ты хочешь, чтобы я села?"
2600306-37 = "Ну... Хорошо."
2600306-38 = ""
2600306-40 = ""
2600306-41 = ""
2600306-42 = "Хм? Что это?"
2600306-43 = "Я?"
2600306-44 = "Ты всё это приготовил для меня?"
2600306-45 = "П-Почему?! Зачем?!"
2600306-46 = "С чего вдруг всё это?!"
2600306-47 = "[s5] «Потому что я многим тебе обязан.»\n[s6] «Потому что ты всегда заботишься о других.»"
2600306-48 = ""
2600306-50 = ""
2600306-51 = "А..."
2600306-52 = "То есть... это..."
2600306-53 = "Т-То есть это..."
2600306-54 = ""
2600306-56 = ""
2600306-57 = "Пф."
2600306-58 = "Пф-ф. Хи-хи!"
2600306-59 = "[s] «Серина?»"
2600306-60 = "Ой, прости."
2600306-61 = ""
2600306-63 = ""
2600306-64 = ""
2600306-66 = ""
2600306-69 = "― Серьёзно, Сенсей...[wa:1560]"
2600306-71 = "― Я просто очень удивилась.[wa:400]"
2600306-74 = "― Даже не знаю, как реагировать...[wa:10]"
2600306-76 = "― Мне никогда ничего такого не делали..."
2600306-79 = "― Немного неловко. Это нормально?[wa:780]"
2600306-82 = "― Правда...[wa:600]"
2600306-84 = "― Я никогда не встречала никого похожего на тебя.[wa:1080]"
2600306-87 = "― Прости. Честно говоря, я даже не знаю, что сказать...[wa:880]"
2600306-89 = "― Могу сказать только... Спасибо! Я так счастлива![wa:1820]"
2600306-92 = "― ...Я правда очень благодарна, Сенсей.[wa:10]"
2600306-94 = "― Это чувство... всё благодаря тебе.[wa:1640]"
2600306-97 = "После этого мы с Сериной приятно поели и ещё приятнее поговорили."
2600306-98 = "Когда Серине пришло время уходить, я не стал спрашивать, как она сюда попала и куда собирается."
2600306-99 = ""
2600306-102 = ""
2600306-103 = "Серина — в любое время и в любом месте!"
