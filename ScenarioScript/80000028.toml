[translation]
80000028-1 = "Шоколадный эликсир"
80000028-2 = "Лаборатория Саёи"
80000028-3 = "Я пришёл в лабораторию Саёи по её просьбе."
80000028-4 = "Добро пожаловать, Сенсей!"
80000028-5 = "Я позвала вас сегодня, чтобы испытать мою новейшую смесь."
80000028-6 = "Сегодня у меня... шоколадный эликсир бессмертия!"
80000028-7 = "На шоколад как раз была скидка, и я подумала: почему бы не попробовать сделать из него эликсир?"
80000028-8 = "[s] Сбежать."
80000028-9 = "С-Сенсей?! Куда вы?!"
80000028-10 = "Мне нужна ваша помощь ради прогресса алхимии!"
80000028-11 = "[s] «И как шоколад должен сделать человека бессмертным?»"
80000028-12 = "Легко! Шоколад — без шуток — просто набит антиоксидантами!"
80000028-13 = "Я решила выделить антиоксиданты, сделать концентрат#nи смешать его с другими ингредиентами!"
80000028-14 = ""
80000028-16 = ""
80000028-17 = ""
80000028-18 = "И таким образом создать идеальный эликсир против старения!"
80000028-19 = "Так что, Сенсей, ни о чём не переживайте и пейте!#nОн вкусный и шоколадный!"
80000028-20 = "[s] Выпить эликсир Саёи."
80000028-21 = ""
80000028-26 = "Ну как? Чувствуете себя моложе?"
80000028-27 = "[s] «Не особо...»"
80000028-28 = "Странно... Даже если вы не стали бессмертным, у вас хотя бы должна была появиться золотистая кожа или начать расти волосы."
80000028-29 = "[s] «Что ты вообще заставила меня выпить?!»"
80000028-30 = "Дайте-ка проанализирую химическую формулу набором для анализа..."
80000028-31 = "Хм... Понятно. Я намешала кучу ингредиентов, но почему-то это всё равно обычный шоколад!"
80000028-32 = "Получается, я просто сделала шоколад с несколькими добавками."
80000028-33 = ""
80000028-35 = ""
80000028-37 = "Вот, Сенсей. Заберите этот неудачный продукт."
80000028-38 = "Я не очень люблю шоколад, и он мне не нужен."
80000028-39 = "К-К тому же если я отдам его кому-нибудь другому, они могут неправильно понять."
80000028-40 = "Ой, только не делайте вид, будто не знаете, какой сегодня день."
80000028-41 = "..."
80000028-42 = "Может, у вас серьёзные побочные эффекты? Мне стоит волноваться?"
