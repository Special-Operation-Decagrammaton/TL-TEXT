[translation]
1006702-1 = "Источник проблемы"
1006702-4 = "[ns] «Хорошо. Кажется, я понял, что происходит, Токи.»"
1006702-5 = "Спасибо за понимание, Сенсей."
1006702-6 = "Я сделаю всё возможное и буду защищать вас до самого конца."
1006702-7 = "[ns] «Спасибо, Токи. Я тоже тебе доверяю. Но...»"
1006702-8 = "Сенсей, как я уже сказала, это миссия."
1006702-9 = "Эта тайная вечеринка проходит на роскошном круизном судне, и вход разрешён только парам."
1006702-10 = "Чтобы проникнуть туда и выполнить разведывательную миссию, мне необходима ваша помощь, Сенсей."
1006702-11 = "[ns] «Конечно, если я могу чем-то помочь...»"
1006702-14 = "[ns] «Но... почему ты так одета?»"
1006702-16 = ""
1006702-17 = "Вы задаёте очевидный вопрос, Сенсей."
1006702-18 = "Костюм кролика — официальная форма C&C для заданий по проникновению."
1006702-19 = "Спрашиваете, откуда я это узнала? Для нас в C&C это общеизвестный факт."
1006702-20 = "Хотя обычному человеку вроде вас, возможно, трудно к этому привыкнуть. Простите, что я не подумала настолько далеко."
1006702-21 = "[s] «Ну... дело не совсем в этом...»"
1006702-22 = "Тогда проблем быть не должно. Отлично."
1006702-23 = "Тогда давайте быстро направимся к круизному судну. Нельзя терять время."
1006702-24 = "[s3] «Просто...! Если другие увидят тебя в таком виде...» \n[s4] «Вы беспокоитесь о принятой в приличном обществе форме одежды?»"
1006702-27 = "Это необходимо для выполнения моей миссии?"
1006702-28 = "Не обязательно? Хорошо. Тогда мне не нужно об этом думать."
1006702-29 = ""
1006702-31 = ""
1006702-32 = "Идёмте. У нас нет времени."
1006702-34 = "Вместе с Токи, которая выглядела слегка взволнованной, мы направились к нашей цели — круизному судну..."
1006702-35 = ""
1006702-40 = "Роскошный круиз"
1006702-42 = ""
1006702-45 = ""
1006702-46 = ""
1006702-47 = ""
1006702-48 = "Мы благополучно добрались до нужного места."
1006702-49 = "Пожалуйста, держитесь рядом со мной, Сенсей. Я буду вас защищать."
1006702-50 = "Хм? Я чувствую на нас множество взглядов. Возможно... нас раскрыли?"
1006702-51 = "Если так, нужно вернуться к основам нашей стратегии. Это серьёзная проблема..."
1006702-54 = "*вздох* Посмотри на это. Как можно заставить своего партнёра надеть на вечеринку такое?"
1006702-55 = "Я понимаю, личные предпочтения не стоит осуждать, но это уже..."
1006702-56 = "Согласна. Мне кажется, костюм кролика больше подходит для... чего-то более личного, разве нет?"
1006702-57 = "До чего докатился Кивотос... Ц-ц-ц..."
1006702-58 = ""
1006702-60 = "[ns] «Ну, по крайней мере, не думаю, что они нас раскрыли.»"
1006702-61 = "Вы уверены? Вы действительно в этом уверены, Сенсей?"
1006702-62 = "[s] «...Зато мне кажется, что моя социальная жизнь только что сократилась вдвое...»"
1006702-63 = "Всё в порядке, Сенсей. Социальная жизнь время от времени меняется."
1006702-64 = "По-моему, сейчас это для нас не самый важный вопрос. По крайней мере, с моей точки зрения."
1006702-65 = "Хорошо, что я могу защищать вас физически, но вы хотите, чтобы я защищала вас ещё и морально?"
1006702-66 = "Для меня это сложно. Хотя вы и правда иногда говорите странные вещи, Сенсей. Всё будет хорошо."
1006702-67 = ""
1006702-69 = ""
1006702-71 = ""
1006702-72 = ""
1006702-75 = "Токи с гордым видом ходила по залу вечеринки, сцепив свою руку с моей."
1006702-76 = "На Токи, похоже, никак не действовали подозрительные взгляды со всех сторон, а вот я... морально... уже приближался к пределу..."
1006702-77 = ""
1006702-78 = "?! Сенсей, осторожнее."
1006702-79 = "Видите там? Цель здесь."
1006702-80 = ""
1006702-82 = ""
1006702-84 = ""
1006702-85 = ""
1006702-87 = "Задачей этой миссии было выяснить, появятся ли подчинённые цели..."
1006702-88 = "Но явилась сама цель. Это неожиданно."
1006702-89 = "Мне завершить разведку согласно плану или воспользоваться возможностью и атаковать цель?"
1006702-90 = "..."
1006702-91 = "Сенсей."
1006702-92 = ""
1006702-94 = ""
1006702-96 = ""
1006702-97 = "НЕ показывайтесь, пока я не скажу, что можно."
1006702-98 = "Это обязательно. Пожалуйста, пообещайте мне."
1006702-100 = "После этого Токи быстро скрылась среди толпы."
1006702-101 = "А потом..."
1006702-103 = "*бум*"
1006702-104 = ""
1006702-106 = "Ч-Что? Охрана, охрана!"
1006702-107 = ""
1006702-109 = ""
1006702-110 = ""
1006702-122 = "Кажется, я немного увлеклась, но миссию успешно выполнила."
1006702-123 = "Даже когда мы раскрыли, что мы из C&C, не думаю, что возникло какое-то серьёзное недоразумение."
1006702-124 = ""
1006702-126 = ""
1006702-127 = "Возможно, мне просто кажется..."
1006702-128 = "Но шёпот вокруг нас будто стал ещё громче."
1006702-129 = "Что думаете, Сенсей?"
1006702-130 = "[s] «Не думаешь... что дело было в твоём наряде...?»"
1006702-131 = "Это... так?"
1006702-132 = "..."
1006702-133 = "Мой наряд настолько плохо на мне смотрелся...?"
1006702-134 = "Токи с грустным выражением повернулась ко мне."
1006702-135 = "Увидев это... я не нашёлся, что сказать."
1006702-136 = "[ns] «Нет, наоборот, он слишком хорошо на тебе смотрелся.»"
1006702-137 = "А? Он выглядел слишком хорошо, и поэтому это стало проблемой?"
1006702-138 = "..."
1006702-139 = "Понятно. Значит, вот в чём дело."
1006702-140 = "[s] «Не уверен, что мы поняли друг друга одинаково...?»"
1006702-141 = "Всё просто. Мой наряд был настолько идеален, что все мне завидовали, верно?"
1006702-142 = ""
1006702-146 = "Почему вы молчите? А, всё настолько очевидно, что даже говорить ничего не нужно."
1006702-147 = "Это естественно. В конце концов, я идеальная горничная и лучший агент. Бам."
1006702-148 = ""
1006702-150 = ""
1006702-152 = "Тогда, Сенсей. Пойдёмте?"
1006702-153 = "[s] «Куда...?»"
1006702-154 = "Миссия закончена, значит, нужно возвращаться."
1006702-155 = "Или... у вас на уме было что-то ещё?"
1006702-156 = "Нет? Хорошо."
1006702-157 = ""
1006702-159 = ""
1006702-162 = ""
1006702-163 = ""
1006702-165 = "Возвращаемся. Я вас провожу."
1006702-167 = "Я вернулся в Шале, идя под руку с заметно довольной собой Токи..."
