[translation]
1004705-1 = "Где находится сияние"
1004705-2 = "Меня удивило сообщение Чисэ в MomoTalk."
1004705-3 = "Я переживал, что что-то случилось, поэтому отправился в общежитие Чисэ."
1004705-4 = ""
1004705-9 = ""
1004705-10 = "А? Сенсей...?"
1004705-11 = "[s] «О, Чисэ. Я хотел проверить, всё ли в порядке после твоего сообщения.»"
1004705-12 = "О нет!"
1004705-13 = "Не подходите ко мне, Сенсей!"
1004705-14 = "[s] «Ч-Что? Что случилось, Чисэ?»"
1004705-15 = "Вы не должны подходить ко мне."
1004705-16 = "Иначе вас проклянут. И вы будете очень-очень несчастны."
1004705-17 = "[s] «...Проклянут? Несчастны?»"
1004705-18 = ""
1004705-21 = "[ns] «...»"
1004705-23 = "[ns] Подойти к Чисэ."
1004705-24 = ""
1004705-28 = ""
1004705-29 = ""
1004705-30 = ""
1004705-31 = "[ns] Подойти ближе к Чисэ."
1004705-32 = ""
1004705-34 = ""
1004705-37 = "Н-Нет!"
1004705-38 = "[s] Подойти к Чисэ и обнять её."
1004705-39 = ""
1004705-43 = ""
1004705-44 = "О... Сенсей...?"
1004705-45 = "[s1] «Расскажи мне, Чисэ. Что случилось?»\n[s2] «Если у тебя проблемы, я хочу помочь. Это моя работа.»"
1004705-48 = "Н-Но..."
1004705-49 = "[s] «...Я буду ждать здесь, пока ты не расскажешь.»"
1004705-50 = ""
1004705-52 = ""
1004705-53 = "Хорошо. Я расскажу."
1004705-54 = "Сенсей, эм."
1004705-56 = "И тогда Чисэ рассказала мне всё, что произошло."
1004705-58 = "С самого утра я ходила по пляжу."
1004705-59 = "Я искала сияние."
1004705-60 = "[s] «И ты нашла на пляже письмо в бутылке?»"
1004705-61 = "Да, вот это."
1004705-62 = ""
1004705-64 = ""
1004705-66 = "Чисэ нерешительно протянула стеклянную бутылку с письмом внутри."
1004705-67 = "Я прочитал письмо вслух."
1004705-68 = "[ns] «Это письмо было отправлено из Тринити...»"
1004705-69 = "«Тот, кто получит это письмо, должен в течение трёх дней отправить такое же письмо семи людям.»"
1004705-70 = "«Если не сделать этого за три дня, вас проклянут и вы станете ужасно несчастны.»"
1004705-71 = "«Не игнорируйте это предупреждение.»"
1004705-72 = "«Удачи.»"
1004705-74 = "Это письмо просто..."
1004705-75 = "[s] «В наше время ещё существуют письма счастья?!»"
1004705-76 = "Что мне делать, Сенсей?!"
1004705-77 = "Через три дня меня проклянут, и я навсегда стану несчастной..."
1004705-78 = "[s] «Подожди, Чисэ. Это письмо поддельное. Всё это ложь.»"
1004705-79 = "А? Поддельное...? Ложь...?"
1004705-80 = ""
1004705-82 = ""
1004705-83 = "Пока озадаченная Чисэ наклоняла голову, я объяснил ей, что такое письмо счастья."
1004705-84 = "Я объяснил, что это всего лишь злая шутка и верить ей не нужно."
1004705-85 = "Зачем кому-то придумывать такую злую и ложную вещь?"
1004705-86 = "Я знал, что она это спросит."
1004705-87 = "[s] «Что ты имеешь в виду?»"
1004705-88 = "Если проклятие — ложь..."
1004705-89 = "зачем кому-то придумывать такую бессмысленную шутку?"
1004705-90 = "Почему? Почему, Сенсей?"
1004705-91 = "[s3] «Наверное... некоторые люди просто делают бессмысленные вещи.»\n[s4] «Некоторым просто нравится разыгрывать других...»"
1004705-94 = "Как странно..."
1004705-95 = "А что, если оно не поддельное?"
1004705-96 = "Что, если меня правда проклянут?"
1004705-97 = "Тогда, раз вы рядом со мной... вас тоже проклянут..."
1004705-98 = "Сенсей станет несчастным Сенсеем!"
1004705-99 = "...Я этого не хочу."
1004705-100 = "Я не могу позволить, чтобы с вами такое случилось."
1004705-101 = "Если я исчезну из-за этого проклятия..."
1004705-102 = "Пожалуйста, вырастите размером с танк вместо меня!"
1004705-103 = "[s] «Ого, вот это ответственность!»"
1004705-105 = "Чисэ начала всхлипывать, и я не знал, что делать."
1004705-106 = "Я думал, как её утешить, и..."
1004705-108 = "[ns] «Хорошо, тогда сделаем так, Чисэ.»"
1004705-109 = "А?"
1004705-110 = "[s] «В письме сказано, что через три дня ты станешь несчастной, так что до тех пор я буду рядом с тобой.»"
1004705-111 = "Но тогда вы..."
1004705-112 = "[s5] «Когда тебе будет угрожать опасность, я всегда буду рядом.»\n[s6] «Я останусь с тобой и докажу, что проклятие выдумано.»"
1004705-115 = "Вы останетесь со мной..."
1004705-116 = ""
1004705-118 = ""
1004705-119 = "Хм-м."
1004705-120 = "Хорошо."
1004705-121 = "(улыбается)"
1004705-123 = "Так получилось, что три дня летних каникул я провёл вместе с Чисэ."
1004705-125 = ""
1004705-128 = ""
1004705-129 = ""
1004705-130 = ""
1004705-131 = ""
1004705-132 = ""
1004705-133 = ""
1004705-134 = ""
1004705-135 = ""
1004705-140 = ""
1004705-141 = "В один день мы целый день бродили по песчаному пляжу."
1004705-142 = ""
1004705-145 = ""
1004705-146 = ""
1004705-147 = ""
1004705-148 = ""
1004705-149 = ""
1004705-150 = ""
1004705-151 = ""
1004705-152 = ""
1004705-153 = ""
1004705-154 = ""
1004705-155 = ""
1004705-157 = ""
1004705-159 = "В другой — сходили в пляжное кафе и поделили мороженое и какигори."
1004705-160 = ""
1004705-162 = ""
1004705-165 = ""
1004705-167 = ""
1004705-168 = ""
1004705-170 = ""
1004705-171 = ""
1004705-172 = ""
1004705-173 = ""
1004705-175 = ""
1004705-178 = ""
1004705-179 = ""
1004705-181 = "А однажды, когда мы гуляли по пляжу, к нам пристала группа хулиганов, и внезапно началась перестрелка с метанием гранат."
1004705-182 = ""
1004705-185 = ""
1004705-186 = ""
1004705-187 = ""
1004705-188 = "После этого мы вернулись на курорт и смеялись над случившимся."
1004705-190 = "Так мы с Чисэ проводили время вместе."
1004705-191 = "Наконец наступил третий день с тех пор, как она прочитала письмо."
1004705-192 = ""
1004705-196 = "[ns] «Сейчас 23:53... День почти закончился.»"
1004705-197 = "Да... Сегодня третий день."
1004705-198 = "С-Сенсей, я..."
1004705-199 = "[s] «Всё хорошо, Чисэ. Я рядом.»"
1004705-200 = ""
1004705-202 = ""
1004705-203 = "...Да. Вы рядом."
1004705-204 = "Стрелки часов продолжали приближаться к пугающему моменту."
1004705-205 = ""
1004705-213 = "И ещё..."
1004705-214 = ""
1004705-218 = "Сенсей, время..."
1004705-220 = ""
1004705-226 = "Как и ожидалось, прошло уже пять минут после полуночи, но ничего не произошло."
1004705-227 = ""
1004705-229 = ""
1004705-230 = "Ничего... не произошло...?"
1004705-231 = "[s] «Да, Чисэ. Вот тебе и письмо счастья.»"
1004705-232 = "Да... Понятно..."
1004705-233 = "[s] «Уже поздно... Мне пора возвращаться.»"
1004705-234 = "Сенсей, подождите."
1004705-235 = ""
1004705-237 = ""
1004705-238 = ""
1004705-239 = "[s] «Что-то случилось?»"
1004705-240 = "Итак, эм..."
1004705-241 = ""
1004705-246 = "Ч-что?!"
1004705-247 = "В-внезапно отключился свет?!"
1004705-248 = ""
1004705-253 = "[ns] «Неужели это... из-за письма...?!»"
1004705-254 = ""
1004705-255 = "[ns] «Чисэ! Это опасно. Держись за мою руку!»"
1004705-256 = "А?"
1004705-257 = ""
1004705-259 = ""
1004705-264 = ""
1004705-265 = "(Лицо Сенсея... слишком близко...)"
1004705-266 = "(О, это...)"
1004705-267 = ""
1004705-269 = ""
1004705-270 = "...Сияние."
1004705-271 = ""
1004705-281 = "Это было страшно."
1004705-282 = "Что произошло?"
1004705-284 = "[ns] «Наверное, просто небольшое отключение электричества.»"
1004705-285 = "Сенсей, вы тяжёлый..."
1004705-286 = "[s] «О! П-Прости, Чисэ!»"
1004705-287 = ""
1004705-289 = ""
1004705-290 = "[ns7] «Прости, что так отреагировал. Я растерялся.»\n[ns8] «Ты нигде не ушиблась? Всё хорошо?»"
1004705-293 = "Всё нормально."
1004705-294 = "Меня всё устраивает."
1004705-295 = "Но, Сенсей. Я нашла своё сияние."
1004705-296 = "[s] «Сияние? О, я действительно видел, как мигнул свет.»"
1004705-297 = "Нет-нет. Не это."
1004705-298 = "Сияние, которое я искала, появилось прямо передо мной."
1004705-299 = "Ах!"
1004705-300 = "И тогда я поняла..."
1004705-301 = "Настоящее сияние совсем не так далеко..."
1004705-302 = "[s] «А?»"
1004705-303 = "Письмо счастья было подделкой, как вы и сказали, но..."
1004705-304 = "может быть, не всё было ложью."
1004705-305 = "[s] «Что ты имеешь в виду, Чисэ?»"
1004705-306 = "Хи-хи."
1004705-307 = "Это секрет, Сенсей!"
1004705-309 = "Иногда Чисэ было трудно понять."
1004705-310 = ""
1004705-313 = "Но, похоже, ей стало лучше, и мы проговорили всю ночь до самого рассвета."
