[translation]
80000106-1 = "Вместе со всеми"
80000106-2 = "Сенсей. Вы пришли."
80000106-3 = "А. Да. Арона сейчас крепко спит."
80000106-4 = "А значит, наконец-то у нас есть возможность поговорить наедине. Я не хотела упускать идеальный шанс подготовиться."
80000106-5 = "[s] «Подготовиться к чему?»"
80000106-6 = "Разве вы не знаете, какой сегодня день, Сенсей?"
80000106-7 = ""
80000106-10 = "[ns1] «Сегодня День святого Валентина...»\n[ns2] «Значит, ты наверняка приготовила шоколад?!»"
80000106-13 = "Подтверждаю. Да, всё верно."
80000106-14 = "Вот, в награду я один раз вас поглажу. Идите сюда. Не стесняйтесь."
80000106-15 = ""
80000106-17 = ""
80000106-19 = ""
80000106-20 = "Что? Вы слишком солидный человек для поглаживаний по голове?"
80000106-21 = "А. Вы боитесь, что Арона проснётся, пока я вас глажу, и начнёт ревновать?"
80000106-22 = "Похоже, Сенсей довольно застенчив. Как я и ожидала."
80000106-23 = "Возможно, вы не помните, но я знаю вас столько же, сколько и Арона."
80000106-24 = "Поэтому я подарю вам этот шоколад на День святого Валентина."
80000106-25 = ""
80000106-27 = ""
80000106-31 = "[ns] «Шоколад от Планы?!»"
80000106-32 = "Да. Я приготовила его сама. Он на 100% состоит из Планы. Я держала всё в секрете от Ароны, чтобы не испортить сюрприз."
80000106-33 = "[s] «Л-Ладно...»"
80000106-34 = "Наконец-то я могу провести с вами время без Ароны. Довольно хитро, правда, Сенсей? Хи-хи-хи."
80000106-35 = "[s] «...Плана, а ты случайно не хотела, чтобы Арона не видела, потому что сама немного стесняешься?»"
80000106-36 = ""
80000106-38 = ""
80000106-39 = "..."
80000106-40 = "...Молчание. Я не обязана отвечать на этот вопрос."
80000106-41 = "..."
80000106-42 = "Принято... Да. Думаю... так и есть."
80000106-43 = "[s] «Спасибо, Плана. Кстати, твой шоколад выглядит очень вкусно.»"
80000106-45 = "...Да. Приятного аппетита."
