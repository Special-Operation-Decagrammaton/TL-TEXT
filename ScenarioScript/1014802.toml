1014802-41 = ""
1014802-42 = "[ns3] «Эм, Ироха...»\n[ns4] «Пусть первым бросит камень тот, кто без греха, но...»"
1014802-45 = "Эм, что вы имеете в виду?"
1014802-46 = "[s5] «Ты ведь всё-таки на летних каникулах...»\n[s6] «Может, стоит выйти... и немного развлечься?»"
1014802-49 = "..."
1014802-50 = "..."
1014802-51 = ""
1014802-53 = ""
1014802-54 = "А, вот оно что. Теперь поняла."
1014802-55 = "Не могли бы вы ненадолго выйти?"
1014802-56 = "[s] «Что?»"
1014802-57 = "Впрочем, если хотите, можете остаться."
1014802-58 = "Но тогда..."
1014802-59 = ""
1014802-61 = ""
