[translation]
1014802-1 = "Ausflug and an Elegant Summer Vacation"
1014802-5 = "Excuse me."
1014802-6 = "……The coffee pot is empty, isn't it?#nI suppose I have no choice. I'll be borrowing your kettle."
1014802-12 = "While the water boils, I'll prepare some snacks... Huh? They're gone."
1014802-13 = "Ah, I suppose I put them in the cupboard."
1014802-18 = "And once I straighten up the sofa..."
1014802-22 = "Phew... Now it's perfect."
1014802-23 = "……Is something the matter?"
1014802-24 = "[s1] \"No, it's nothing.\"\n[s2] \"I feel like I'd lose if I said it out loud...\""
1014802-27 = "Please, don't mind me."
1014802-28 = "I have no intention of getting in your way today.#nI didn't come here for Pandemonium Society business, either."
1014802-29 = "I'll just be quietly reading, so please feel free to focus on your work."
1014802-32 = "(2 hours later)"
1014802-34 = "…………."
1014802-38 = "(True to her word, Iroha had been reading the entire time.)"
1014802-42 = "[ns3] \"Um...\"\n[ns4] \"I know I'm one to talk, but...\""
1014802-45 = "Yes? Did you need something?"
1014802-46 = "[s5] \"It is summer vacation, after all.\"\n[s6] \"Maybe you could spend it doing something more... summery?\""
1014802-49 = "……."
1014802-50 = "…………."
1014802-54 = "I see."
1014802-55 = "In that case, would you mind leaving?"
1014802-56 = "[s] \"Huh?\""
1014802-57 = "It makes no difference to me either way."
1014802-58 = "But if you insist on staying—"
1014802-62 = "You'll have to take responsibility, won't you?"
1014802-66 = "(Feeling uneasy, I hurried outside.)"
1014802-67 = "(After waiting in front of the door for a while...)"
1014802-68 = "Come in. It's fine now."
1014802-71 = "[ns] \"I have a mountain of questions, but...\""
1014802-73 = "[ns] \"What's with that outfit?\""
1014802-74 = "Don't play dumb."
1014802-75 = "You're the one who said you wanted to see me in a swimsuit, Sensei."
1014802-76 = "[s] \"Did I really say that!?\""
1014802-77 = "I am merely a guest borrowing your sofa.#nI have no choice but to comply when asked."
1014802-78 = "Therefore, I am begrudgingly spending my time in this attire for your sake."
1014802-79 = "……."
1014802-80 = "Now then, I shall return to my book."
1014802-84 = "[ns] \"...So you're just going to keep reading, then?\""
1014802-85 = "Of course."
1014802-89 = "By any chance... were you hoping for something more fitting for this outfit?"
1014802-90 = "[s7] \"No, absolutely not.\"\n[s8] \"Reading is nice, isn't it?\""
1014802-97 = "(Iroha stayed in her swimsuit until the very end... and left just like that.)"
1014802-98 = "(A rumor began to spread that Schale makes students work in their swimsuits.)"