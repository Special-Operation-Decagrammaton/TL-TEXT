[translation]
1014802-1 = "Ausflüglerin and an Elegant Summer Vacation"
1014802-5 = "Excuse me."
1014802-6 = "...Your coffee is empty, right? #nWell, I'll borrow your kettle."
1014802-12 = "While boiling the water, I'll prepare some snacks... Huh? There aren't any."
1014802-13 = "Ah, did you put them in the cabinet?"
1014802-18 = "Now I just need to get the sofa ready..."
1014802-22 = "Phew... Now it's perfect."
1014802-23 = "...What is it?"
1014802-24 = "[s1] \"No, it's nothing.\"\n[s2] \"If I say it, I'll lose...\""
1014802-27 = "Don't worry."
1014802-28 = "I don't plan on getting in your way today. #nI'm not here for Pandemonium Society duty either."
1014802-29 = "I'll be reading quietly, so just focus on your work."
1014802-32 = "(2 hours later)"
1014802-34 = "......"
1014802-38 = "(Iroha means it, she starts reading a book like the usual)"
1014802-42 = "[ns3] \"Um...\"\n[ns4] \"It might not be my place to say this, but...\""
1014802-45 = "Yes? Is something wrong?"
1014802-46 = "[s5] \"It's your hard-earned summer vacation.\"\n[s6] \"Couldn't you spend it a bit more like a summer vacation...?\""
1014802-49 = "..."
1014802-50 = "......"
1014802-54 = "I see."
1014802-55 = "Then, could you please leave?"
1014802-56 = "[s] \"Eh?\""
1014802-57 = "I don't really mind either way."
1014802-58 = "But if you say you're going to stay—"
1014802-62 = "You'll have to take responsibility, okay?"
1014802-66 = "(Feeling nervous, I quickly stepped outside)"
1014802-67 = "(After waiting in front of the door for a while...)"
1014802-68 = "Come in. It's fine now."
1014802-71 = "[ns] \"There are so many things I want to ask, but...\""
1014802-73 = "[ns] \"What's with that outfit?\""
1014802-74 = "Don't play dumb."
1014802-75 = "Weren't you the one who said you wanted to see me in a swimsuit, Sensei?"
1014802-76 = "[s] \"Did I say that!?\""
1014802-77 = "I am merely borrowing your sofa. #nIf told to do, I have no choice but to comply."
1014802-78 = "So, I will reluctantly spend my time in this outfit for you."
1014802-79 = "..."
1014802-80 = "Now then, I'll return to my reading."
1014802-84 = "[ns] \"...You're still just going to read.\""
1014802-85 = "Of course."
1014802-89 = "Could it be... you were hoping for \"something\" fitting of this outfit?"
1014802-90 = "[s7] \"No, not at all.\"\n[s8] \"Reading is great too, you know.\""
1014802-97 = "(Iroha stayed in her swimsuit until the very end... and went home just like that)"
1014802-98 = "(A rumor spread that Schale makes students come to work in swimsuits)"