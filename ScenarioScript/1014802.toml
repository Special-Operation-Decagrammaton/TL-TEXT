1014802-13 = "А, забыла: я же убрала их на полку."
1014802-14 = ""
1014802-18 = "Немного взобью подушки на диване..."
1014802-19 = ""
1014802-21 = ""
1014802-22 = "Отлично. Всё идеально."
1014802-23 = "Эм, почему вы на меня так смотрите?"
1014802-24 = "[s1] «Нет, ничего».\n[s2] «Если начну об этом говорить... проиграю»."
