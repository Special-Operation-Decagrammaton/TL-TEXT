[translation]
10046240-2 = ""
10046240-3 = "Ичика."
10046240-4 = "Я откликнулась на зов."
10046240-5 = "Маширо? У тебя разве сегодня не выходной?"
10046240-6 = "У правосудия не бывает выходных."
10046240-7 = "Хаха... Ага, уж мне-то не знать."
10046240-8 = "Но Маширо, ты только вчера закончила долгое задание."
10046240-9 = "Тебе следует отдохнуть, пока не перенапряглась."
10046240-10 = "Эм... Честно говоря, в последнее время я чувствую себя немного... незаметной."
10046240-11 = "Я всегда могу усилить своё присутствие. Такое чувство, что никто не замечает мою недавнюю работу."
10046240-12 = "Хм? Но ты же снайпер, разве не хорошо, что не выделяешься?"
10046240-13 = "Мне кажется, умение сливаться с окружением — преимущество!"
10046240-14 = "Неверно! Снайперу нужно мощное присутствие."
10046240-15 = "Говорят, Хасуми поразила три цели одной пулей. Такая репутация сама создаёт присутствие, даже если враг никогда не видел, откуда она стреляет."
10046240-16 = "Ну... присутствие Хасуми определяется ДАЛЕКО не только хорошей стрельбой..."
10046240-17 = ""
10046240-19 = ""
10046240-20 = "(Шизуяма Маширо... Её достижения выдающиеся, но...)"
10046240-21 = "(Она очень... усердная. Страстная? Знаю, она молода, но ей стоит научиться рассчитывать силы.)"
10046240-22 = "(Мы никогда особо не ладили...)"
10046240-23 = ""
10046240-25 = ""
10046240-26 = ""
10046240-27 = ""
10046240-28 = "...Я слышала, ты патрулировала одна."
10046240-29 = "А? Эм... да, пожалуй."
10046240-30 = "Тебе не одиноко?"
10046240-31 = "Эм... Вообще по жизни?!"
10046240-32 = "..."
10046240-33 = "...О! Ты обо мне беспокоилась? Как младшая, ты не должна этим заниматься."
10046240-34 = "Хаха! Пожалуй, мне стоит подавать лучший пример."
10046240-35 = "Тогда да, я буду рада твоей помощи!"
10046240-36 = ""
10046240-38 = ""
10046240-39 = "Разумеется! Предоставь это мне!"
