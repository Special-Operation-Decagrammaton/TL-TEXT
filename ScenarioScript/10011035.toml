[translation]
10011035-4 = "Что это, чёрт возьми, было?!"
10011035-5 = "[s] «Морё.»"
10011035-6 = "М-Морё? Та самая известная группа нарушителей?"
10011035-7 = "Они назвались Вольными Морё! Нин!"
10011035-8 = "Я о них слышала...! Даже для банды Морё они особенно жестокие!"
10011035-10 = ""
10011035-11 = "Они против современности и отказываются признавать любые фестивали, кроме исконных традиционных праздников Хяккияко..."
10011035-12 = ""
10011035-13 = "А ещё требовали выдавать им фестивальные подарочные сертификаты двенадцать раз в год... что звучит довольно корыстно..."
10011035-14 = ""
10011035-15 = "Но академия Хяккияко отказала, и с тех пор эти фестивальные радикалы устраивают скандалы на каждом празднике."
10011035-16 = ""
10011035-17 = "Звучит как сюжет плохого комикса."
10011035-18 = "[s] «Фестивальные радикалы? Впервые слышу.»"
10011035-20 = "Но зачем им нападать сюда?"
10011035-21 = ""
10011035-24 = "ПОМОГИТЕ! Актрису, играющую принцессу, похитили!"
10011035-25 = ""
10011035-27 = ""
10011035-28 = "Принцессу... похитили?"
10011035-29 = "Т-Тогда это значит...!"
10011035-30 = "Ибуки в опасности!"
10011035-31 = "[s] «Наверняка они с самого начала хотели сорвать встречу.»"
10011035-32 = "Н-Н-Надо доложить! Клубу Инь-Ян! Или Хяккарёран!"
10011035-33 = "Н-Нет! Это слишком рискованно!"
10011035-34 = ""
10011035-36 = ""
10011035-37 = "[ns] «Что значит рискованно, Мичиру?»"
10011035-38 = "Ну, дело в том... Эм..."
10011035-39 = "Потому что... Ну вы понимаете! Представление!"
10011035-40 = ""
10011035-41 = "Член Общества Пандемония похищен?"
10011035-42 = "Если это всплывёт, разразится огромный дипломатический скандал. В худшем случае может даже начаться война между двумя школами."
10011035-43 = "Да! Именно! Поэтому сейчас нельзя докладывать!"
10011035-44 = "И разве глава Общества Пандемония не должна быть, ну, ужасно страшной? Если она узнает, нам конец!"
10011035-45 = "[s] «Боюсь, для этого уже поздновато.»"
10011035-46 = ""
10011035-48 = ""
10011035-49 = "...Ибуки, член Общества Пандемония, похищена?"
10011035-50 = ""
10011035-52 = ""
10011035-53 = ""
10011035-54 = "Ты студент Генны?! И не просто студент, а член Общества Пандемония?!"
10011035-55 = "А-а-а!! Нам конец!"
10011035-56 = "Н-Нам готовиться к войне?"
10011035-57 = "Мне нужны успокоительные! *рыдает*"
10011035-58 = "..."
10011035-59 = "[s] «Ироха, глубоко вдохни. Давай поговорим.»"
10011035-60 = "Простите, Сенсей. Но сейчас я КРАЙНЕ спокойна."
10011035-61 = ""
10011035-63 = ""
10011035-64 = ""
10011035-65 = "[ns] «По тебе как-то не скажешь...»"
10011035-66 = "Ух... Ладно, поговорим."
10011035-67 = "Вот именно поэтому я была против. Макото сказала, что это станет для Ибуки «незабываемым опытом», а я настаивала, что это слишком опасно."
10011035-68 = "Разве я не предупреждала? Это на твоей совести, Макото. И что ты теперь будешь делать? А?"
10011035-69 = "[s] «Эм, Ироха... Ты же понимаешь, что Макото сейчас здесь нет...?»"
10011035-70 = ""
10011035-72 = ""
10011035-73 = "Я могла бы прямо сейчас выйти и устроить такой переполох, какого никто ещё не видел. Разнесла бы всех на части."
10011035-74 = "Ого..."
10011035-75 = "Ой-ой..."
10011035-76 = "*глоток* ...Нин!"
10011035-77 = "...Но логика у меня впереди эмоций. Это не должно стать достоянием общественности."
10011035-78 = "Мы не можем допустить политического кризиса или конфликта между школами."
10011035-79 = "...?!"
10011035-80 = ""
10011035-81 = "[ns] «Ироха, никогда не видел, чтобы ты настолько учитывала ситуацию!»"
10011035-82 = "Потому что если это случится, на меня свалят ещё больше работы."
10011035-83 = "[s] «Вот теперь я узнаю свою Ироху!»"
10011035-84 = "Представляете, если Макото узнает? Не говоря уже о Сацуки."
10011035-85 = "И кому в итоге придётся разгребать весь бардак? Не-а. Не буду."
10011035-86 = "Поэтому я предлагаю решить всё тихо."
10011035-87 = "...Ч-Что нам делать?"
10011035-88 = "...То, что должны."
10011035-89 = "Президент?"
10011035-90 = "Это путь ниндзя."
10011035-91 = "[s] «Что такое, Мичиру?»"
10011035-92 = "Клянусь гордостью ниндзя, мы решим всё прежде, чем общественность узнает!"
10011035-93 = "Только присутствующие здесь и сейчас будут знать правду!"
10011035-95 = "Ох...!"
10011035-96 = "Гениальный президент нашего клана!"
10011035-97 = "И мы не одни. С нами высокопоставленный член Общества Пандемония и, самое главное, Сенсей!"
10011035-98 = "Мы справимся!"
10011035-99 = "[s] «Не думаю, что всё будет так просто...»"
10011035-101 = "Сенсей прав. Как мы это скроем?"
10011035-102 = ""
10011035-105 = "Проверка микрофона, раз-два, раз-два. Меня слышно?"
10011035-106 = ""
10011035-108 = ""
10011035-109 = "[ns] «Это трансляция с дирижабля?»"
10011035-111 = "Бу-ха-ха! Ну как вам представление?"
10011035-112 = "Это суперособенное выступление стало возможным благодаря сотрудничеству с Обществом Пандемония!"
10011035-113 = "Несмотря на несколько небольших изменений, настало время того самого приключения, которого вы все ждали... «Принцесса Вараку» Хяккияко!"
10011035-114 = "А теперь смотрите!"
10011035-115 = ""
10011035-119 = ""
10011035-120 = ""
10011035-121 = ""
10011035-122 = ""
10011035-123 = ""
10011035-126 = "Как видите, заговорщики, похитившие принцессу, скрываются!"
10011035-127 = "Кто первым спасёт принцессу из лап злого заговора?"
10011035-128 = "Клуб Инь-Ян приготовил очень-очень особый подарок для отважного героя, который станет нашим спасителем."
10011035-129 = "Всем студентам Генны, почтившим нас своим присутствием здесь, в Хяккияко, а также нашим студентам, всегда неизменно поддерживающим наши фестивали..."
10011035-130 = "Мы ждём вашего горячего и активного участия!"
10011035-131 = "Будем болеть за вас со стороны! Удачи!"
10011035-132 = ""
10011035-136 = "[ns] «Ух ты...»"
10011035-137 = "Именно, ого. Послание прозвучало предельно ясно: «Шоу должно продолжаться.»"
10011035-138 = "Очень хитрый способ отвлечь публику от ситуации."
10011035-139 = "Эта хитрая... Эм, то есть репутация президента действительно идёт впереди неё. Она выиграла нам время."
10011035-140 = "Ладно, миссия проста."
10011035-141 = "Исследовательский клуб ниндзюцу спасёт Ибуки до того, как хоть одна душа поймёт, что случилось!"
10011035-143 = "Есть, мэм! Ниндзя никогда не проигнорирует нуждающегося. Нин-нин!"
10011035-144 = "Бедная Ибуки... Наверняка ей сейчас очень страшно..."
10011035-145 = "...Держись, Ибуки. Я иду."
10011035-146 = "[s] «Спасём принцессу!»"
10011035-148 = "(Всё хорошо. Если мы просто спасём Ибуки, представление продолжится, а вместе с ним и наш клуб.)"
10011035-149 = "(Я должна выполнить обещание Изуне и Цукуё.)"
10011035-150 = "(Шанс ещё есть!)"
