[translation]
1012303-1 = "Непростые разговоры"
1012303-2 = "Исполнительный офис Шале"
1012303-3 = "Я прибирался перед визитом Сейи."
1012303-4 = ""
1012303-8 = "Ох... Вам вовсе не стоило всё это готовить."
1012303-9 = "Ну надо же, Сенсей. Вы всё это устроили ради меня... Не думали, что мне станет неловко?"
1012303-10 = "[s1] «...Сейя?»\n[s2] «А?»"
1012303-13 = ""
1012303-16 = ""
1012303-17 = "...Нет."
1012303-18 = "Пожалуй, я чувствую благодарность. Очевидно, я вам небезразлична, раз вы приложили столько усилий."
1012303-19 = "Я чувствую себя, пожалуй, более... дорогой для вас."
1012303-20 = "[s3] «...Сейя?»\n[s4] «Ты... так и прошла через всё здание?»"
1012303-23 = "Хи-хи, почему вы так переживаете?"
1012303-24 = "Не волнуйтесь. Я приехала сама. Меня никто не видел."
1012303-25 = "...Что это такое?"
1012303-26 = "Мне особенно нравится этот наряд? А. Вам интересно, почему я продолжаю его носить."
1012303-27 = "Разумеется, он мне нравится. Я сама его выбрала, купила и сегодня надела."
1012303-28 = "Если подумать, я так и не спросила вашего мнения. Не заставляйте меня ждать."
1012303-29 = "...Что вы об этом думаете, Сенсей?"
1012303-30 = "[s5] «Красиво.»\n[s6] «Ты очень стильно выглядишь.»"
1012303-33 = "...Понятно."
1012303-34 = "Я предполагала, что вы скажете что-нибудь в таком духе. Вы всегда такой."
1012303-35 = ""
1012303-37 = ""
1012303-38 = "Я шучу. На самом деле мне очень приятно, просто немного неловко это признавать."
1012303-39 = "Хм-м... Стильно... Чувство стиля..."
1012303-40 = "Верно. Как бы я ни выглядела со стороны, мода меня весьма интересует."
1012303-41 = "Мне нравится ограничение какой-нибудь темой — особым сезоном или праздником. Забавно одеваться не так, как обычно."
1012303-42 = "Как бы это сказать...? Подбирать все детали — в каком-то смысле словно сочинять хорошую загадку."
1012303-43 = "Конечно, хоть мне это и нравится, возможностей проявить своё чувство стиля почти не бывает. Слишком много глаз за мной следит."
1012303-44 = "Поэтому... в такие особые дни я и пользуюсь шансом показать своё мастерство."
1012303-45 = "И вполне естественно, что мне хочется показать тщательно проделанную работу... человеку, который тоже умеет замечать детали."
1012303-46 = "И всё же ваш комплимент очень меня порадовал, Сенсей. Спасибо."
1012303-47 = "...Вы удивлены?"
1012303-48 = "[s7] «Немного. Но, по-моему, это здорово.»\n[s8] «Я рад увидеть новую сторону тебя.»"
1012303-51 = "Вот опять вы говорите такие вещи."
1012303-52 = "В любом случае, я бы с удовольствием позвала вас поплескаться со мной на пляже, но, похоже, вы утопаете в работе."
1012303-53 = "Было бы жаль мешать столь важным делам."
1012303-54 = ""
1012303-56 = ""
1012303-57 = "...Что ж, да, мне бы очень хотелось. Но слишком часто так делать было бы невежливо, поэтому я лишь немного составлю вам компанию, а затем уеду."
1012303-58 = "Вас это устроит?"
1012303-59 = "[s9] «Конечно.»\n[s10] «Оставайся сколько захочешь.»"
1012303-62 = "..."
1012303-63 = ""
1012303-65 = ""
1012303-66 = "..."
1012303-67 = "[s11] «...? Сейя?»\n[s12] «Почему ты так на меня смотришь?»"
1012303-70 = "...Ни о чём."
1012303-71 = "Я слишком упрямо придерживалась своего подхода, хотя прекрасно знаю ваш характер."
1012303-72 = "Хорошо. Раз мне нужно говорить прямее — так и сделаю."
1012303-73 = ""
1012303-75 = ""
1012303-76 = ""
1012303-77 = ""
1012303-80 = "[ns13] «...С-Сейя?»\n[ns14] «Ты у меня на коленях...?»"
1012303-83 = "Я немного отдохну здесь. Не обращайте на меня внимания и спокойно занимайтесь своими делами."
1012303-84 = "Или, может быть, найдётся какая-нибудь... работа, с которой я могу помочь? Что-нибудь простое?"
1012303-85 = "Несмотря на мою репутацию, с такими вещами я вообще-то неплохо справляюсь."
1012303-86 = "...Простите?"
1012303-87 = "Почему я так делаю? Думаете, я... сержусь?"
1012303-88 = "...Фуфу."
1012303-89 = "Нет. Я совсем не сержусь."
1012303-90 = "...Нет."
1012303-91 = "Если точнее, я БЫЛА сердита, но стоит посмотреть на вас — и мне становится... гораздо лучше."
1012303-92 = "Я просто немного развлекаюсь. Вам не нужно бояться."
1012303-93 = ""
1012303-95 = ""
1012303-96 = "...Я серьёзно. Не беспокойтесь."
1012303-97 = "А теперь вернёмся к работе, Сенсей. Я помогу, мы быстро закончим, и вы сможете отдохнуть."
1012303-98 = "Давайте поскорее со всем покончим..."
1012303-99 = ""
1012303-101 = ""
1012303-102 = ""
1012303-103 = "...и отдохнём в гостиной."
1012303-105 = "С помощью Сейи мы быстро закончили все дела на сегодня."
1012303-106 = "Сейя ушла в гостиную, свернулась на диване и немного поспала, а затем уехала домой."
