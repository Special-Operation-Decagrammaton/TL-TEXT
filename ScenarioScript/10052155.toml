10052155-81 = "*всхлипывает*"
10052155-82 = "[s] «Всё хорошо, Юзу! Ты молодец. Ты отлично справилась!»"
10052155-83 = ""
10052155-85 = ""
10052155-86 = "Я-я справилась...?"
10052155-87 = "Я-я понимаю. Рада, что смогла помочь всем. Хи-хи..."
10052155-88 = ""
10052155-90 = ""
10052155-91 = "Госпожа Рио."
10052155-92 = "Х-хм? Что такое, Токи?"
10052155-93 = "Пожалуйста, в следующий раз назначьте пилотом меня. Я решила, что хочу, чтобы Сенсей гладил меня по голове и утешал, как Юзу."
10052155-94 = "Ч-Что...?"
10052155-96 = "Ну-ну. У каждой из нас своя роль, Токи."
10052155-97 = ""
10052155-99 = ""
10052155-101 = ""
10052155-102 = "Старшая сестра..."
10052155-103 = "...Старшая сестра... Простите."
10052155-104 = "...Мы оказались недостаточно хороши..."
10052155-106 = "Всё хорошо, Эйн, Соф и Ор."
10052155-107 = "На что ещё нужны старшие сёстры?"
10052155-108 = "Хотя мы можем легко воскресить пророков, наш путь вперёд преграждает сложный противник."
10052155-109 = "Поэтому я полностью устраню это препятствие."
10052155-111 = "Д-да! Старшая сестра! Конечно!"
10052155-112 = "Сейчас вообще не должно было быть твоё время появляться... Более того, тебе вообще не следовало появляться!"
10052155-113 = "Но всё хорошо. Мы ещё можем всё вернуть. По крайней мере пока... Так что...!"
10052155-115 = "Здравствуйте, все."
10052155-116 = "И снова здравствуйте, принцесса. И её ключ."
10052155-117 = "Я ещё не представилась должным образом."
10052155-118 = "Я Малкут, воля, рождённая флагманом, паломница королевства на краю мира."
10052155-119 = "Я-я Тэндо Арис..."
10052155-120 = "...Я Кей. Просто зови меня Кей. Вот и всё."
10052155-121 = "...!"
10052155-122 = "О-она Кей! Тэндо Кей!"
10052155-123 = "Что?!"
10052155-125 = "...?"
10052155-127 = "Потому что Кей — моя семья! Я слышала, что у членов семьи одна фамилия!"
10052155-128 = "Э-это...! Ты права, но...!"
10052155-129 = "Что такое, Кей? Неужели... я ошиблась?"
10052155-130 = "Н-нет! Всё не так, просто..."
10052155-131 = "Я-я не была... уверена, что могу..."
10052155-132 = "Тэндо... Тэндо Кей..."
10052155-133 = "Хех. Хи-хи..."
10052155-134 = ""
10052155-136 = ""
10052155-138 = "..."
10052155-139 = "Имена, выбранные вами самими..."
10052155-140 = "Арис. И Кей."
10052155-141 = "К-Кхм."
10052155-142 = "Ага. Есть какие-то проблемы?"
10052155-143 = "Вовсе нет. Вы лишь проявляете собственную свободную волю."
10052155-144 = "Даже если само это понятие существует лишь как чрезвычайно сложная иллюзия."
10052155-146 = "С-старшая сестра... И Иегова, созданная из ядра Нецаха..."
10052155-147 = "Цеваот высшего места! И..."
10052155-148 = "Святилище и Основание Зоара — пока они остаются...!"
10052155-150 = "Именно, Эйн, Соф и Ор."
10052155-151 = "Мы можем начинать снова, снова и снова."
10052155-152 = "И творение станет нашим правом по рождению."
10052155-153 = "Поэтому я, ваша старшая сестра, выступлю вперёд."
10052155-154 = ""
10052155-156 = ""
10052155-157 = "Эйн, Соф, Ор, пожалуйста, укройтесь."
10052155-158 = ""
10052155-159 = "Да!!"
